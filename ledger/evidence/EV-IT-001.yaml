  type: empirical
  direction: neutral
  strength: inconclusive
  claim_tier: toy
  certificate_refs: []
  proof_status: not_applicable
  proof_refs: []
  observations:
    - id: O-1
      text: >-
        The RUN-IT-001-bounded-toy package was frozen at snapshot commit
        a4561488d972895b1192cc4d0c99d86edc8a54f3 (TASK-20260731-128) before
        independent review. The snapshot archives 9 of the 12 paths the run
        manifest declares in artifact_paths; it is not a complete durable
        reproduction package.
    - id: O-2
      text: >-
        Independent Validator VAL-20260801-129 (TASK-20260731-129) verdict
        NOT_ADMISSIBLE as a completed_valid run, with blocking defects D-1
        (HEUR_ISO_1_report.json is a truncated 153-byte invalid-JSON crash
        artifact missing every spec.v3-required field, the pre-registered
        F_hit table, and the density freeze), D-2 (driver crash EXIT:1
        undisclosed in manifest/execution_report/dispatch_queue; stderr
        timestamps fall after the recorded finished_at), D-3 (durable
        snapshot missing command.txt, environment.json, stdout.log,
        stderr.log), and D-4 (HEUR_ISO_1_report.freeze.json — the only
        surviving record of the density freeze — undeclared and unarchived).
    - id: O-3
      text: >-
        Red Team RT-20260731-130 (TASK-20260731-130) filed 2 BLOCKING
        objections (RT-130-O1: crashed run archived as completed_valid;
        RT-130-O2: both controls void, all 21/21 cells censored, so every
        R_xfer=0.0 is a censorship placeholder, not a measurement), 3 HIGH
        objections (RT-130-O3: rate_iso_1_pass:false computed over censored
        rows is a laundering route into HEUR-ISO-1/H-DS-001 S1_met negative
        evidence; RT-130-O4: C_special model inverted for the anomalous
        family — with the true Smart-attack cost ~O(log p) ~ 20 ops the
        planted control flips to PASS, R_xfer ~ 0.047 < 0.7; RT-130-O5: no
        per-attempt x inverse-success-probability bookkeeping in the transfer
        accounting), plus MEDIUM/LOW objections; recommended disposition
        failed_infrastructure, scientific posture inconclusive.
    - id: O-4
      text: >-
        Both positive controls FAIL: planted_path_recovered=false
        (path_edges=[], n_hops_planted=0) and plant_detected=false
        (C_path_reported=0, C_path_recomputed=0, predicate false by
        construction; the plant was injected into a zero-signal cell). Per
        the frozen v3 contract (falsification F2 and the CTRL-NULL-IT-PLANT
        criterion) the harness is void for sub-rho / transfer-gate claims.
    - id: O-5
      text: >-
        All 21 unplanted curves are H_min_censored with mode
        censorship_lower_bound, heur_edges_expanded=0 (the BFS explored zero
        edges on every cell), R_xfer=0.0, certificate_pass=false; all
        certificates are kind:none and no solve is claimed. RATE-ISO-1 fails
        trivially (0/21) and KS/TAIL-ISO-1 are not evaluable (zero uncensored
        H_min samples). HEUR-ISO-1 was never adjudicated in either direction.
    - id: O-6
      text: >-
        stderr.log records the crash: 'TypeError: Object of type Integer is
        not JSON serializable ... when serializing dict item ''version''' at
        run_bounded_toy.sage.py line 746 (json.dump of heur_report), followed
        by EXIT:1 at 2026-07-31T23:17:32Z. HEUR_ISO_1_report.json is the
        153-byte partial write of that dump.
    - id: O-7
      text: >-
        The durable snapshot is missing 4 of the 12 manifest-declared paths
        (command.txt, environment.json, stdout.log, stderr.log) and the
        undeclared, unarchived HEUR_ISO_1_report.freeze.json; the freeze
        obligation (spec.v3 lines 147-151, 390-394) is therefore not
        certifiable from the durable snapshot.
  inference: >-
    RUN-IT-001-bounded-toy produced NO admissible measurement. The driver
    crashed (EXIT:1) while serializing a declared artifact, the required
    HEUR_ISO_1_report.json is a truncated crash artifact, the durable
    snapshot is incomplete, and both positive controls failed, voiding the
    sub-rho interpretation. The record is therefore direction neutral: it
    neither supports nor weakens H-IT-001, and no R_xfer, rate_iso_1,
    rho_special, or HEUR-ISO-1 value from this package may be read as
    empirical evidence in either direction. The run is reclassified
    failed_infrastructure per AGENTS.md rule 5 (a crash / implementation
    failure is an evidence-integrity failure, not a mathematical result).
  boundaries:
    - >-
      Toy scale only: 20/24/28-bit prime-order subgroups, 21 unplanted curves
      across 3 seeds; nothing crypto-scale.
    - >-
      Sub-rho / transfer-gate claims are void: both positive controls failed
      per the frozen contract, so the harness cannot detect a transfer when
      one exists.
    - >-
      HEUR-ISO-1 was never adjudicated: KS/TAIL null (0 uncensored samples),
      RATE is a censored gate-hold, not a validation result.
    - >-
      No universal claim, no generic-curve safety claim, no SG-ECDLP-001 /
      SG-ECDLP-002 lane-death claim, and no asymptotic claim follows from
      this record.
  unresolved_confounds:
    - >-
      Both positive controls void (planted_path_recovered=false,
      plant_detected=false): the instrument never demonstrated detection of
      a transfer when one exists, so all-zero readings are uninterpretable.
    - >-
      BFS zero-edge expansion (heur_edges_expanded=0 on all 21 cells): the
      search instrument never executed an edge expansion; R_xfer=0.0 values
      are censorship placeholders, not measurements.
    - >-
      C_special model inversion for the anomalous family (RT-130-O4): with
      the true Smart-attack cost ~O(log p) ~ 20 ops the planted control flips
      from FAIL to PASS (R_xfer ~ 0.047 < 0.7); the gate outcome is
      model-dominated.
    - >-
      Crash provenance conflation (fresh_executor_after_stall): stderr
      timestamps 23:13:35Z-23:17:32Z fall after the recorded
      finished_at 23:13:16Z / wall_seconds 1758.87 s; the archived set mixes
      a completed invocation's artifacts with a crashed invocation's corrupt
      file, unannotated.
    - >-
      HEUR_ISO_1_report.freeze.json undeclared and unarchived: the density
      freeze pre-registration is not certifiable from the durable snapshot.
    - >-
      No per-attempt x inverse-success-probability bookkeeping (RT-130-O5):
      R_xfer is a deterministic modeled ratio; under 100% censorship the true
      expected transfer cost is unbounded.
  run_status_reclassification: failed_infrastructure
  validation_report_id: VAL-20260801-129
  red_team_report_id: RT-20260731-130
  reviewed_by: coordinator
