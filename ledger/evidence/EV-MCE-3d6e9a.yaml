    table, and tested one corpus convention. It ran no solver, designed no
    experiment, and computed no distance between any attack regime and Classic
    McEliece's parameters. THIS RECORD ESTABLISHES NOTHING ABOUT CLASSIC
    McELIECE'S SECURITY IN EITHER DIRECTION.
  goal_id: GOAL-MCE-001
  batch_id: BATCH-a68f79
  experiment_ids: []
  run_ids: []
  type: literature
  direction: neutral
  strength: replicated
  strength_scope: >-
    `replicated` is scoped to O-1, O-2 and O-3 ONLY -- the SEC Table 1
    transcription and the four arXiv:2304.14757 quotations -- each of which was
    independently re-acquired first-hand by validator TASK-20260808-ea7bed
    (VAL-20260808-71bdb1) from the primary URL at the recorded sha256, extracted
