    - id: O-10
      strength: replicated
      what: >-
        TWO PRODUCER JUDGEMENT CALLS WERE INDEPENDENTLY CONFIRMED CORRECT.
        (a) The `citation_verified` split -- `read` on KN-LIT-6da230 only,
