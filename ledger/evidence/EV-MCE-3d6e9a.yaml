    - id: O-7
      strength: preliminary
      what: >-
        TWO PROVENANCE SEAMS IN THE NEW CORPUS ENTRY. (a) GAP CLOSED: the arXiv
        version the quotations come from IS recoverable and is v3 -- the PDF's
        left-margin stamp at the bound sha256 reads "arXiv:2304.14757v3 [cs.IT]
        29 May 2023" -- whereas correction_report.md section 6 item 4 and
        KN-LIT-c41d8b's "Not verified here" both state it was not recorded.
        (b) SEAM OPEN: KN-LIT-c41d8b's abstract block is labelled verbatim and
        bound to the sha256, but quotes LaTeX source. I verified in the working
        tree that lines 81-82 read "> {\em a generic alternant code} ... $q \in
        \{2,3\}$ and for {\em all} regime". The validator reports (I could not
        check this myself -- I performed no fetch) that `{\em` occurs ZERO
        times in the text of the PDF at that sha256, which renders the same
        sentence without markup; the markup can only have come from a different
        acquisition route, i.e. the arXiv abstract listing. THE WORDS ARE
        IDENTICAL AND NO MEANING IS AFFECTED. The defect is that a block
        labelled verbatim and bound to a hash reproduces bytes that are not at
        that hash, in a batch whose entire method is hash-bound provenance.
      basis: VAL-20260808-71bdb1 S-1a, S-1b; my own read of KN-LIT-c41d8b lines 81-82.
      also: >-
        S-1c, recorded as an observation and not scored: KN-LIT-c41d8b's
        frontmatter is the IEEE journal version (2024, doi
        10.1109/tit.2023.3334592) while every quotation is from arXiv v3. The
        entry does scope its quotations to the sha256. NOBODY IN THIS PROGRAM
        HAS READ THE JOURNAL VERSION and it may differ.

    - id: O-8
      strength: replicated
      what: >-
        The five-way identifier collision was REAL and the re-mint was
        LEGITIMATE -- but the Coordinator's "zero residual references" claim
        was FALSE. All five old ids (KN-LIT-209151, 48b4eb, 7b78de, 9a7860,
