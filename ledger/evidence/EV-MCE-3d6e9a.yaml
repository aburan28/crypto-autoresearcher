    parses, and both audits' output on them are recorded verbatim in
    VAL-20260808-71bdb1 control_checks C-4, so any reader can rebuild them
    exactly -- but the files themselves live in a session scratchpad OUTSIDE
    the repository and are NOT archived. It is therefore recorded as
    `empirical_only`, not `certificate`. UPGRADE PATH, and it is the same work
    as the fix: committing the five evasion forms as a regression fixture
    alongside the parsing audit turns this into an archived counterexample
