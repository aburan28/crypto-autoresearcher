    # ---------------------------------------------------------------------
    # NEGATIVES, RECORDED AS UPPER BOUNDS
    # ---------------------------------------------------------------------
    - id: O-11
      strength: not_applicable
      what: >-
        WHAT THIS BATCH DID NOT ESTABLISH, stated as upper bounds so absence is
        not later read as evidence:
          (1) NOTHING about Classic McEliece's security, in either direction.
              No solver ran, no experiment was designed, no hypothesis exists,
              and no distance between any attack regime and Classic McEliece's
              parameters was computed.
          (2) NOTHING about iacr:2026/1232 / KN-LIT-7c4620, the campaign's
              primary target. Its body remains UNOBTAINED (403, path-scoped,
              reproducible, NOT circumvented and NOT re-attempted by any route
              in this batch). Its complexity claim is still known only as a
              conjecture in its abstract. The Goppa exclusion of
              arXiv:2304.14757 DOES NOT TRANSFER to it.
          (3) NOT that the four reclassified entries' claim classes are
              CORRECT. All four papers are titled as distinguishers, which
              makes `distinguisher` plausible, but nobody in this program has
              read any of the four; the classification rests on titles and
              relayed descriptions at `confidence: reported`; and neither the
              producer nor the validator certifies it. The audits enforce form,
              not correctness.
          (4) NOT that SEC Table 1's numbers are correct, current, or usable as
              a cost model. They are a third party's published figures,
              transcribed; SEC itself says "The exact numbers in Table 1 should
              be expected to be superseded by larger numbers from future
              estimators that count bit operations."
          (5) NO heuristic was validated. arXiv:2304.14757 IS a
              heuristic-conditional result (its Heuristics 18 and 23, and
              section 3.2's explicit "does not represent a proof"). This
              program has ENUMERATED those heuristics and validated NONE. Any
              future record leaning on the Goppa exclusion is leaning on an
              unvalidated heuristic of a third party's paper that the source
              itself flags as unproved.
          (6) NO promotion gate G1-G4 is addressed. This program advances no
              asymptotic-complexity claim of its own. Stated explicitly so it
              cannot be misread as gate progress.
          (7) NO speedup, improvement or ratio is claimed anywhere, so
              inventor-protocol section 6's validation ladder is NOT ENGAGED
              rather than skipped, and no null-object control applies: the
              correct control for a transcription is source re-verification,
              which was performed (O-1).

  inference: >-
    BATCH-a68f79 discharged the three deliverables GOAL-MCE-001's 2026-08-03
    next_action named, and an independent validator returned `failed` on two
    NAMED CLAIMS about them rather than on the work itself. The honest summary
    is three-part.
