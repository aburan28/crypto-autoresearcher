  # =========================================================================
  # WHAT THE BATCH ESTABLISHED
  # =========================================================================
  observations:

    - id: O-1
      strength: replicated
      what: >-
        Esser-Bellini SEC Table 1 (mceliece-security-20221023.pdf, p.10) is
        transcribed in full: 150 cells, 15 rows x 10 columns, every
        `value_printed` carried as a JSON string, every cell status OK. This
        closes the deliverable DEC-20260803-a5b9b1 D-3 identified as having
        been skipped in BATCH-001 for a reason that does not exist.
      basis: >-
        TASK-20260808-1985f1 (sec_table1.md, sec_table1.json,
        transcription_report.md, source_access_log.yaml), snapshot commit
        04c41125a via c32b4b5dc.
      controls: >-
        The completion gate asked for "a sample of transcribed values". The
        validator checked ALL 150, TWICE, BY TWO MODALITIES: (i) it re-fetched
        the PDF itself (HTTP 200, 332574 bytes, sha256
        db17ef0879cb8822120c312b7290f7db82fe9fc356bd16058ad334a512b523fa,
        matching both the declared hash and the hash BATCH-001's
        TASK-20260803-f3aece recorded at log seq 7), extracted p.10 with
        poppler and compared by string equality keyed on
        (row_label_verbatim, column_header_verbatim): agree=150, disagree=0,
        unmatched=0; (ii) it rendered p.10 to PNG at 170 dpi and read the
        rendered table directly, matching every row, column, header order and
        the caption. sec_table1.md and sec_table1.json also agree with each
        other 150/150. VAL-20260808-71bdb1 S-2.
      not_replicated: >-
        The producer's METHODOLOGY claim -- "0 disagreements across six
        extractor configurations" -- was NOT reproduced; the validator ran two
        modalities, not six, and explicitly declines to certify the six. What
        is replicated is the load-bearing layer: the transcribed values are the
        source's values.

    - id: O-2
      strength: replicated
      what: >-
        SEC Table 1 DECLARES NO UNIT, at any of the five loci where one could
        appear, and the transcription's refusal to infer one (convention rule
        1.1.3, "never infer a unit") is correct.
      basis: TASK-20260808-1985f1; TASK-20260808-a9f648 (transcription_convention.md).
      controls: >-
        VAL-20260808-71bdb1 S-2 read the header row, the caption, the
        introducing sentence and the rendered page: no unit row exists, and the
        header row is followed directly by the first data row. It found the
        refusal BETTER supported than the producer claimed: SEC's own prose
        states "the 140.8 actually counts more than 2^143 bit operations",
        which positively establishes the entries are NOT log2 of bit
        operations, so an inferred unit would have been WRONG, not merely
        unlicensed. The transcription quoted all five loci so the ABSENCE is
        checkable rather than asserted.
      forward_constraint: >-
        BINDING ON ANY DOWNSTREAM USE. Table 1 is TIME-ONLY. SEC gives exactly
        one memory figure in prose (the 140.8 entry is "for an attack using
        memory 2^86.6") and the transcription deliberately did NOT transcribe
        the exponent because the extraction flattened the superscript. The
        `mem` column is a cost-model selector (0, 1/3, 1/2), not a memory
        quantity. Any record using these numbers as a cost model is INCOMPLETE
        under the memory-alongside-time rule until the memory figures are
        obtained. VAL-20260808-71bdb1 CM-1.

    - id: O-3
      strength: replicated
      what: >-
        The boundary of arXiv:2304.14757 (Bardet-Mora-Tillich; KN-LIT-4c8135,
        superseded by KN-LIT-c41d8b) is a CONJUNCTION of three conditions, and
        the code-family conjunct excludes Goppa codes. All four quotations the
        correction rests on are VERBATIM CORRECT, character for character,
        against the PDF at the bound sha256
        ebbd94ac3cd00b0f0e723aeab56fd3b0820c89d47072fc8241f12c5f93c564b8:
        "Interestingly our attack does not work at all when the alternant code
        has the additional structure of being a Goppa code." (p.7); Table 1
        restriction column, row "this paper", "(does not apply in the
        particular case of Goppa codes)" (p.7); "Goppa codes behave differently
        from random alternant codes and provide counterexamples to Heuristic
        18." (p.15, section 3.2 "What is wrong with Goppa codes?"); and the
        extension-degree sentence (p.7). The three-conjunct reading -- family,
        q in {2,3} with m arbitrary, high rate per condition (6) -- is correct
        AS FAR AS IT GOES.
      basis: >-
        TASK-20260808-843c87 (correction_report.md), ledger/questions/RQ-MCE-3f7c02.yaml,
        knowledge/literature/KN-LIT-c41d8b.md. Discharges DEC-20260803-a5b9b1
        D-2 and D-4 and GOAL-MCE-001's 2026-08-03 next_action.
      controls: >-
        VAL-20260808-71bdb1 S-0/S-1 fetched arXiv:2304.14757 first-hand (HTTP
        200, 526690 bytes, sha256 ebbd94ac...c564b8, BYTE-IDENTICAL to the
        bound hash, 36 pages) and located every quotation. It also checked the
        internal link: rate_regime_extraction.md lines 271-274 carry the
        exclusion sentence exactly as re-quoted, so the producer's declared
        second-hand chain is exact at every link. The page numbers above are
        the VALIDATOR's; the producer recorded none and invented none.
      what_is_genuinely_better_than_before: >-
        Recorded so this batch's real gain is not buried under O-4. NO
        SUPERSEDING SITE RE-INSTALLS A RATE-SCOPED READING
        (VAL-20260808-71bdb1 section 7, `and_separately`). On the axis
        DEC-20260803-a5b9b1 D-2 identified -- rate vs code family -- the record
        is now MORE ACCURATE than it was, and that gain stands.

    - id: O-4
      strength: replicated
      what: >-
        THE CORRECTION IS INCOMPLETE, AND ITS INCOMPLETENESS RUNS IN ONE
        DIRECTION. The correction quotes the Goppa-exclusion sentence and stops
        at the full stop. The source presents that exclusion as PHASE-SCOPED,
        PRESENT-TENSE, EXPLICITLY NOT A PROOF, and CONJECTURED TO FALL. Four
        passages establish this and NONE of the three superseding sites carries
        any of them:
          (a) p.7, the sentence immediately after the one quoted, under the
              same run-in heading "Opening the road for attacking the CFS
              scheme.": "However this work could open the road for also
              attacking this subcase, in which case we could hope to break the
              CFS scheme [CFS01] which operates precisely in the high rate
              regime where the square of the dual of the Goppa code behaves
              abnormally."
          (b) p.32, concluding remarks: "Therefore it is tempting to conjecture
              that Goppa codes, at least in the regime where they are
              distinguishable from random codes (which applies in particular to
              the CFS scheme [CFS01]) should eventually be attacked in
              polynomial by some variation the attack that has been given
              here." (transcribed as printed, including the source's own
              missing "of").
          (c) p.32, "Understanding the Grobner basis approach": "However,
              unlike the case of the filtration where right now this part of
              the attack does not work at all, it seems that here even if the
              Grobner basis computation consists of more steps, solving the
              whole system should still be polynomial." -- which SCOPES the
              "does not work at all" to the FILTRATION PHASE and to "right
              now".
          (d) p.15, section 3.2 opening: "The discussion below does not
              represent a proof that computing a filtration is impossible for
              Goppa codes, but rather an intuition about what hampers it."
      basis: >-
        VAL-20260808-71bdb1 S-1 material_omission_found, which quotes all four
        first-hand from the PDF at the bound sha256; (b) was verified twice by
        the validator, by poppler extraction and by a 150 dpi render of p.32
        read directly.
      independently_corroborated_in_this_program_by_the_coordinator: >-
        I verified (d) MYSELF in the working tree, without any fetch: it is
        already transcribed VERBATIM in this program's own committed record at
        coordination/goals/GOAL-MCE-001/batches/BATCH-001/tasks/TASK-20260803-292b99/heuristics_enumerated.md
        line 332, inside section "A2 -- 'Heuristic 23' (paper's number) -- the
        Goppa carve-out", whose line 348 reads: "**Flagged unproven:** yes;
        explicitly *'does not represent a proof'*." That file is a SIBLING of
        rate_regime_extraction.md in the SAME task directory the correction
        re-quoted from. So this omission was NOT caused by the producing role's
        inability to read the PDF; the material was already in hand.
      why_this_is_a_defect_and_not_a_completeness_quibble: >-
        A correction cannot be required to state everything the source says,
        and the validator's own self-audit SA-2 records that trap. This
        omission is bound: it is specific, quotable, one-directional, and it
        runs on THE AXIS THE CAMPAIGN TURNS ON. RQ-MCE-3f7c02 titles the
        boundary "STRUCTURAL", calls conjunct 1 "the decisive one", and states
        that for the family Classic McEliece uses "conjunct 1 settles
        applicability before any rate arithmetic is performed" -- I verified
        that text in the committed record. That is a settled-boundary reading
        of an obstruction the authors call an intuition, scope to one phase,
        and expect to fall. The correction report's own section 4 NAMES this
        failure mode ("the dismissal-side error that BATCH-001-OPENING section
        7 defines as this campaign's failure condition -- symmetric with
        alarm") and then omits the source's own guard against it. The hedge the
        superseding sites DO carry -- "not a theorem that Goppa codes resist
        algebraic attacks" -- points the right way but is formal caution a
        reader may discount; the authors' own conjecture is not.
      scope_limit: >-
        O-4 says the PROGRAM'S RECORD is incomplete. It says NOTHING about
        whether the authors' conjecture is right, whether Goppa codes will be
        attacked, or whether Classic McEliece is at risk. The passages are
        these authors' expectations about their own unproved intuition.

    - id: O-5a
      strength: replicated
      what: >-
        BOTH TAG AUDITS RAN AND BOTH PRINT NOTHING against the corpus as it
        stands on 2026-08-08, and the silence is a LIVE FILTER, not a dead
        pipeline. AUDIT-1 and AUDIT-2 (knowledge/TAG-CLAIM-CLASS.md sections 2
        and 3) each returned 0 bytes when run verbatim by the validator.
      basis: >-
        TASK-20260808-f9374d (tagging_report.md, knowledge/TAG-CLAIM-CLASS.md,
        the four superseding entries KN-LIT-3c9f21 / a4d70e / 6b1fc8 / d82a53).
        The producing role could not execute and said so in bold; the harness
        session ran the commands; VAL-20260808-71bdb1 C-1/C-2 ran them again
        independently under BSD grep/xargs/zsh, checking output LENGTH rather
        than exit status.
      controls: >-
        THE POSITIVE CONTROL NEITHER PRODUCER RAN. VAL-20260808-71bdb1 C-3
        stripped the supersession filter from AUDIT-1: stage 1 returns 13
        files, stage 2 narrows to EXACTLY FOUR -- KN-LIT-13a01d, KN-LIT-71d1a0,
        KN-LIT-7ee1a9, KN-LIT-e37d4c, precisely the four the task named and no
        others. So the empty output is produced by the filter correctly
        retiring four real hits. A command that prints nothing is otherwise
        indistinguishable from a command that cannot print anything.

    - id: O-5b
      strength: replicated
      what: >-
        THE "MACHINE-ENFORCEABLE" CLAIM IS FALSIFIED, 5 OF 5. The validator
        constructed five corpus entries that a YAML parser reads as
        {'tags': ['distinguisher', 'key-recovery']} -- semantically identical
        to the caught controls -- and that BOTH audits MISS: a legal multi-line
        flow sequence (`tags: [distinguisher,` / newline / `  key-recovery]`);
        quoted flow scalars (`tags: ["distinguisher", "key-recovery"]`); a
        block item with a trailing comment (`  - distinguisher  # claim
        class`); a block item with quoted scalars (`  - "distinguisher"`); and
        an indented `tags:` key nested under a mapping. It printed the PyYAML
        parse of each to show the evasions are semantically identical, not
        merely syntactically odd, and printed both audits' output on the
        scratch corpus (audit1 caught control C1 only, audit2 caught control C2
        only). TAG-CLAIM-CLASS section 4's four disclosed limitations --
        form-not-correctness, no-token entries, tags-not-prose, scoped-to-
        knowledge/ -- cover NONE of the five; I read that section and confirm
        it. Rule R-CC-5 mandates the single serialisation the audits handle,
        and NOTHING CHECKS R-CC-5: there is no audit for it, and the corpus
        already holds 56 literature and 23 findings entries in block style that
        R-CC-5 does not reach.
      basis: VAL-20260808-71bdb1 C-4 (negative control, constructed on request).
      what_is_therefore_supportable: >-
        NOT "the distinguisher/break constraint is machine-enforceable". Only
        this: "No live corpus entry currently carries both claim-class tokens,
        verified by two audit commands run independently on 2026-08-08 with a
        positive control showing the pipeline is live. The audits enforce ONE
        TAG ENCODING, not the semantic constraint; five legal YAML encodings
        with identical semantics evade both." An enforcement mechanism whose
        correctness depends on an unenforced convention is a convention.
      cheap_fix_identified: >-
        One script: parse each knowledge/**/*.md frontmatter and test the tag
        LIST, printing the path when {'distinguisher','key-recovery'} is a
        subset of set(tags). That is immune to quoting, wrapping, comments,
        block-vs-flow and indentation, and it SUBSUMES both audits.

    - id: O-6
      strength: replicated
      what: >-
        THE CORRECTED READING IS NOT REACHABLE BY A READER OF THE DEFECTIVE
        RECORDS. All three superseded originals still carry the rate-scoped
        reading -- correctly, since they are immutable and the task card
        forbade editing them -- but the forward links are one-way or absent:
        knowledge/literature/KN-LIT-4c8135.md still carries
        `superseded_by: null` (I verified this myself: line 20 of the file in
        the working tree), so corpus retrieval that filters on that field WILL
        STILL SURFACE THE DEFECTIVE ENTRY AND WILL NOT FLAG IT AS SUPERSEDED;
        ledger/questions/RQ-MCE-e65b3c.yaml is `status: active` and does not
        point forward; and BATCH-001-OPENING.md section 4 has NO POINTER AT
        ALL. I verified the last one myself: a case-insensitive grep of
        BATCH-001-OPENING.md for `RQ-MCE-3f7c02|superseded|correction` returns
        NO MATCHES.
      basis: >-
        VAL-20260808-71bdb1 section 7 (does_any_corrected_site_still_carry_the
        _rate_scoped_reading), plus my own two checks above. The producer
        disclosed the KN-LIT-4c8135 limitation explicitly as "Known
        limitation, recorded not hidden" (RQ-MCE-3f7c02
        one_defect_three_sites.sites[3].known_limitation).
      note: >-
        This is a genuine tension between immutability and reachability, not a
        producer failure. Filling `superseded_by` on the superseded originals
        is a one-field change using the corpus's own designated mechanism and
        would let AUDIT-1 drop its most complex stage. It is NOT decided by
