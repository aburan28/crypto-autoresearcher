    success_criterion outcome (c) and CORR-20260906-69ff2a.
  - >-
    Does NOT rule out a richer, not-yet-published self-reduction technique
    (e.g. ring-element or Galois-orbit constructions) -- H-MLKEM-36f511
    itself, and this evidence, explicitly leave that an open direction.
  - >-
    Makes NO claim about Simon 2026's Lemma 3 correctness, ML-KEM's
