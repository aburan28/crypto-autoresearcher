      step without further compute."
  boundaries:
  - >-
    Scoped ONLY to the combinatorial-ceiling axis of H-MLKEM-36f511's
    prediction, for STANDARD (scalar-coefficient) linear self-reduction.
    Does NOT address stage 0's noise-variance-to-faulty-rate conversion
