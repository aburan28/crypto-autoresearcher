  type: theoretical
  direction: supports
  strength: strong
  claim_tier: crypto
  claim_tier_note: >-
    "crypto" here describes TESTED SCALE only, per docs/claims-and-verification.md:
    every quantity was computed at ML-KEM's actual, full standardized
    parameters (q=3329, n up to 1024, k_mlkem in {2,3,4} exactly as FIPS 203
    defines them), not a toy-scale extrapolation. It does NOT mean an
    ML-KEM attack, speedup, or security-margin claim is made -- none is;
    see boundaries below.
  certificate_refs: []
  proof_status: derivation
  proof_refs:
  - experiments/EXP-MLKEM-12d9b8/runs/RUN-MLKEM-12d9b8-001/raw-result.json
  - experiments/EXP-MLKEM-12d9b8/runs/RUN-MLKEM-12d9b8-001/compute.py
  - coordination/goals/GOAL-QALG-001/reviews/RUN-MLKEM-12d9b8-001-validation/independent_recompute.py
  observations:
  - >-
    On the combinatorial-ceiling axis alone, for STANDARD (scalar-per-row,
    not ring-element) linear self-reduction from k_mlkem in {2,3,4} real
    ML-KEM Module-LWE rows, bounded at amendment MLKEM-CHG-2's operative
    B<=q=3329 ceiling: UNREALIZABLE at all three standardized levels
    (ML-KEM-512/768/1024), robustly across the full swept c in
    {12,13,15,20}, by 24 to 50 orders of magnitude (digit-count
    approximation). Independently reproduced by three separate
    implementations with zero discrepancy: the Executor's compute.py, the
    Validator's from-scratch independent_recompute.py (written from the
    frozen formulas alone, before reading compute.py), and hand/script
    verification in the Red Team's report -- all three agree exactly on
    every one of the 12 (level, c) Q-values and all 6 (level, B)
    combinatorial-ceiling values.
  - >-
    The (2B+1)^k_mlkem ceiling formula was independently confirmed, by the
    Red Team's proof-architecture audit, to be a mathematically sound upper
    bound covering every m in {0,...,k_mlkem} simultaneously (via the
    "c_i=0 encodes row i excluded" encoding), not an undercount fixed at
    m=k_mlkem -- ruling out the one credible way this counting argument
    could have been wrong.
  - >-
    The amendment's B<=q ceiling, while framed as "generous," is actually
    noise-incoherent (per-term noise variance at B=q is ~6-7 orders of
    magnitude above ML-KEM's genuine per-coordinate noise), meaning the
    reported margin is the LEAST favorable case for realizability the
    construction could offer -- a physically coherent B would sit far
    below q, making the true achievable ceiling even further short of Q.
    This strengthens, rather than weakens, the UNREALIZABLE finding.
  - >-
    A proves-too-much control (Red Team attack 4) found no counterexample
    where this methodology gives a false UNREALIZABLE verdict for a
    self-reduction technique known to be realizable within the claim's
    actual, narrow scope (standard scalar-coefficient linear self-reduction).
    The one credible richer construction identified (a ring-element /
    Galois-orbit self-reduction exploiting ML-KEM's ring structure) is
    already explicitly named and excluded as out-of-scope by
    H-MLKEM-36f511's own assumptions and interpretation_limits.
  inference:
    validation_report: coordination/goals/GOAL-QALG-001/reviews/RUN-MLKEM-12d9b8-001-validation/report.yaml
