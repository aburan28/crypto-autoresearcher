  scientific_effect: >-
    WEAKENS H-MONO-819f2b as pre-registered: the primary metric triggers
    the record's own falsification condition on the central ordering
    prediction, and the prediction's stated MECHANISM (imprimitivity
    drives harder discrimination) is independently falsified by
    constructed counterexamples (C_4, V_4). Narrower claims survive and are
    independently confirmed: this lane's actual census sample sizes (S=2,000
    for N3-style members, exhaustive for N1-style members) DO correctly and
    unambiguously resolve their real, already-`supported` group verdicts
    (all four Step 4b classifications correct); the specific numeric
    instance D_4-needs-more-draws-than-A_4 is genuinely true, just for a
    different, more general reason (excluded probability mass) than the
    hypothesis proposed. No ECDLP claim. No claim about m>=4. Does not
    change H-MONO-0b3def, H-MONO-0f9170, or H-MONO-59f6a6's status.

