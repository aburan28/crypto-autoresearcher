  proof_status: derivation
  proof_status_note: >-
    The record's headline instrument-power numbers rest on EXACT
    combinatorial derivation, not statistical estimation: the Red Team's
    independent full-enumeration computation of the multinomial power
    curve (not Monte Carlo) gives N_required(S4-vs-A4)=5 and
    N_required(S4-vs-D4)=8 exactly, matching the Validator's independently
    seeded Monte Carlo fine-grained search bit-for-bit at every tested N,
    and the Red Team further derives and verifies a closed form
    (N_required = ceil(ln(alpha)/ln(1-excluded_mass))) against four
    independent subgroups by full enumeration. The falsifying
    counterexample (C_4, V_4 breaking the primitivity-ordering mechanism)
    is likewise exact combinatorics, not simulation.
  proof_refs:
    - experiments/EXP-MONO-715694/reviews/validator/validation-report.yaml (independent fine-grained re-derivation, item 3)
    - experiments/EXP-MONO-715694/reviews/red-team/red-team-report.yaml (independent exact-enumeration re-derivation and closed form, item 1)

  observations:
    - >-
      STAGE 0/0B AND ALL FOUR REAL-DATA CLASSIFICATIONS (STEP 4B) HOLD,
      INDEPENDENTLY CONFIRMED BY BOTH REVIEWERS FROM FRESH CODE. S_4 vector
      [1,6,3,8,6]/24 and A_4 vector [1,0,3,8,0]/12 reproduced exactly by
      both reviewers from scratch. The D_4-from-real-data law, derived by
      cycle-decomposing all 44,310 non-ramified `perm` tuples from BOTH
      EXP-MONO-a20e48 runs, reproduced exactly by both reviewers (counts
      [6105, 11100, 16050, 0, 11055]; zero 3-cycles in every row, both
      runs). N3's real S=2,000 sample (both runs) classifies as S_4 under
      both pairwise tests; N1's real exhaustive 44,310-point sample (both
      runs) classifies as D_4 under the S4-vs-D4 test — all four forced
      outputs matched, independently re-derived from raw data by both
      reviewers, not merely re-read from the Executor's summary.
    - >-
      THE PRIMARY METRIC LITERALLY TRIGGERS THE RECORD'S OWN PRE-REGISTERED
      FALSIFICATION CONDITION, AS THE EXECUTOR HONESTLY REPORTED. N_required
      (smallest N reaching 99% power at 5% false-positive rate via a 20,000-
      trial Monte Carlo search over the frozen contract's own search grid,
      floor N=10) saturates at N=10 — the smallest N tested — for BOTH
      group pairs, in both runs, at power=1.0 with Monte Carlo standard
      error 0.0. H-MONO-819f2b's own `falsification_conditions` names this
      exact outcome ("N_required(S4_vs_D4) is NOT strictly greater than
      N_required(S4_vs_A4)... falsified; reported as such, not rationalized
      away") as a falsifier of the record's central prediction. The
      Executor correctly refused to extend the search below its own frozen
      floor and reported this prominently rather than working around it.
    - >-
      BOTH INDEPENDENT REVIEWERS, VIA TWO DIFFERENT METHODS, CONFIRM THE
      SPECIFIC NUMERIC PREDICTION IS GENUINELY TRUE AT FINER RESOLUTION —
      BUT THIS IS SUPPLEMENTARY ANALYSIS OUTSIDE THE FROZEN CONTRACT, NOT A
      REVISION OF THE TRIGGERED PRIMARY METRIC. The Validator's independent
      Monte Carlo search (fresh seeds, fresh code) and the Red Team's
      independent EXACT full-enumeration computation (a strictly stronger
      method than Monte Carlo) both find N_required(S4-vs-A4)=5 and
      N_required(S4-vs-D4)=8 — a genuine 1.6x gap the frozen N=10 floor was
      too coarse to see. Both reviewers explicitly frame this as
      exploratory verification outside the record's own official metric,
      per their dispatch instructions and the frozen contract's own
      invalidation_rules (a post-hoc re-selection of the search floor is
      forbidden). The falsification of the primary, pre-registered metric
      stands as triggered; this finding explains WHY, without undoing it.
    - >-
      THE RECORD'S CENTRAL EXPLANATORY MECHANISM — THAT IMPRIMITIVITY
      CAUSES HARDER DISCRIMINATION — IS INDEPENDENTLY FALSIFIED BY A
      CONSTRUCTED COUNTEREXAMPLE (RED TEAM, NEAREST-OBJECT CONTROL). The
      Red Team tested two additional known degree-4 subgroups of S_4 by
      the identical exact method: C_4 (imprimitive, order 4, excluded mass
      7/12) needs N_required=4; V_4 (imprimitive, order 4, excluded mass
      5/6) needs N_required=2 — BOTH LOWER than A_4's N_required=5, despite
      A_4 being the PRIMITIVE case the hypothesis predicted should be
      easier. Discriminating power tracks EXCLUDED PROBABILITY MASS
      exactly (closed form: N_required = ceil(ln(alpha)/ln(1-excluded_mass)),
      verified exact against full enumeration for all four subgroups
      tested), not the primitive/imprimitive structural distinction the
      hypothesis's `mechanism` and `observation_collision` sections name as
      the reason D_4 should need more draws than A_4. D_4 happens to need
      more draws than A_4 only because D_4's excluded mass (1/3) happens to
      be smaller than A_4's (1/2) — a numerical coincidence of THESE two
      specific groups, not an instance of a general primitivity law. This
      is the record's most significant single finding: the ordering
      prediction's stated MECHANISM does not survive scrutiny, even though
      its narrow numeric INSTANCE (D_4 > A_4) does.
    - >-
      THE CHERNOFF-STEIN CROSS-REFERENCE THE EXECUTOR PRESENTED AS
      CORROBORATION IS MIS-DERIVED AND SELF-CONTRADICTORY (RED TEAM). The
      Executor computed the asymptotic type-II exponent using the wrong KL
      divergence direction (D_KL(P_sub||P_full) instead of the
      Chernoff-Stein-correct D_KL(P_full||P_sub), which is +infinity for
      both pairs here since each subgroup excludes S_4-supported cycle
      types). The reported cross-reference values (~10.97 for A_4, ~13.82
      for D_4) both EXCEED the frozen floor of 10 that the primary metric
      actually needed to reach power=1.0 — i.e., the cross-reference
      predicts the search should NOT have terminated by N=10, directly
      contradicting the measured power=1.0 reported three lines earlier in
      the same execution_report.yaml. The Executor presented this as
      supporting evidence for the predicted ordering without flagging the
      internal contradiction; both values happen to still be in the
      correct relative order by numerical coincidence (the formula is a
      reasonable local approximation only for fully-supported alternatives,
      not for these disjoint-support ones), not because the derivation is
      correct.
    - >-
      HEUR-MONO-CONV-1 IS STRUCTURALLY UNTESTABLE BY STEP 4A AS DESIGNED,
      AND IS MEASURABLY FALSE FOR THE POINT-PARAMETRIZED CENSUS STYLE WHERE
      IT WAS ACTUALLY CHECKED (RED TEAM). With-replacement bootstrap
      resampling from a fixed real data pool is i.i.d. by mathematical
      construction, so comparing its power curve against a synthetic i.i.d.
      simulation's power curve can never detect non-i.i.d. structure in the
      original data — the "agreement" the Executor reported (gap=0.0) is
      guaranteed by the test's own construction, not informative about the
      real census's correlation structure. Using an independently
      constructed test WITH genuine power to detect this (contiguous
      disjoint-window dispersion, validated against a shuffled-order null
      object), the Red Team found N1's real point-ordered data IS
      significantly under-dispersed relative to a genuine i.i.d. stream
      (variance ratio 0.54-0.67 vs. 0.98-1.03 for the shuffled null).
      HEUR-MONO-CONV-1 ("simulated i.i.d. sampling reproduces this lane's
      actual census's statistical behaviour") is therefore measurably FALSE
      for the point-parametrized (N1-style) census member. This is
      DISCLOSED AS INCONSEQUENTIAL FOR THIS RECORD'S OWN CONCLUSIONS: N1's
      census is exhaustive (44,310 of 44,310 possible base points), so no
      sampling-order effect can produce a false classification there
      regardless of correlation structure — but the finding means Step 4a
      did not actually validate the heuristic it was designed to validate,
      and any FUTURE record relying on i.i.d.-modeled sampling risk for a
      genuinely sub-exhaustive point-parametrized census member should not
      cite this record's Step 4a as having cleared that concern.
    - >-
      THE NULL-1/NULL-2 CONTROLS AS SPECIFIED AND IMPLEMENTED ARE
      DEGENERATE, INDEPENDENTLY FOUND BY BOTH REVIEWERS, THOUGH THE
      UNDERLYING CALIBRATION IS CONFIRMED SOUND BY BOTH REVIEWERS' OWN
      GENUINE-CONTROL SUBSTITUTES. Setting the "sub" law numerically equal
      to the "full" law makes the LR statistic identically 0.0 for every
      draw at every N, so the false-positive rate reads exactly 0.0
      regardless of whether the broader test machinery works — this cannot
      fail by construction and provides no real evidence the calibrated
      threshold generalizes to fresh out-of-sample data. The Validator
      independently built a genuine calibrate-on-one-batch /
      evaluate-on-a-held-out-batch control (FP=0.0011-0.0194 at N=10, both
      comfortably under alpha) and the Red Team independently confirmed
      calibration correctness with a genuinely near-but-not-identical null
      law (FP=0.0494-0.0500 across N in {100,1000,10000,44310}, correctly
      close to the nominal alpha=0.05) — so the SUBSTANTIVE conclusion that
      the test's false-positive rate is controlled survives, but the
      record's own as-run NULL-1/NULL-2 could not, by construction, have
      caught a real calibration problem had one existed.
    - >-
      THE REJECTION-DIRECTION JUDGMENT CALL THE EXECUTOR MADE, RESOLVING A
      GENUINE CONTRADICTION IN ITS OWN HANDOFF TEXT, IS CONFIRMED CORRECT
      WITH MARGIN BY BOTH REVIEWERS — RECORDED AS A CREDIT, NOT MERELY A
      DEVIATION. The Red Team's exact enumeration on a hand-checkable toy
      example, and separately on the real pairs, shows the alternative
      (handoff-prose-literal) convention would have been anti-informative
      at every tested N — power falling STRICTLY BELOW its own
      significance level, i.e. worse than a coin flip, and would have
      produced power=0.00000 for both real pairs at N=10, inverting the
      entire record's substantive content. The Executor's chosen
      convention is the Neyman-Pearson-correct one, confirmed independently
      by exact computation, not merely judged plausible.
    - >-
      STEP 4B'S REAL-DATA CLASSIFICATIONS ARE GENUINE, NOT A RUBBER STAMP,
      BUT CERTIFY LESS THAN A LITERAL READING SUGGESTS (RED TEAM). At
      N=2,000, the calibrated statistic correctly flags a constructed
      fake-D_4-generated sample (100% detection over 2,000 replicates, 0%
      false alarm on genuine S_4 data) — genuine discriminating power, not
      vacuous. However, because the discriminator at this sample size is
      effectively "was a 3-cycle ever observed", it would equally classify
      several OTHER, non-D_4 constructions (V_4, C_4, or even an
      overwhelmingly transposition-heavy non-group law) as "D_4" — it
      certifies "not S_4" reliably, not "is specifically D_4" at this
      sample size.
    - >-
      A GENERAL METHODOLOGICAL LESSON THE RED TEAM SURFACES, WORTH CARRYING
      FORWARD REGARDLESS OF THIS RECORD'S OWN DISPOSITION. When two
      candidate census laws differ by having disjoint support in some
      outcome categories (the common case for comparing a full symmetric
      monodromy group against any subgroup that categorically excludes some
      cycle type), discriminating power has an EXACT closed form
      (N_required = ceil(ln(alpha)/ln(1-excluded_mass))) requiring no
      simulation at all — dominating this record's own 20,000-trial-per-
      candidate-N Monte Carlo search on time, exactness, AND resolution
      simultaneously. This is a real, checkable, generalizable technique
      this program did not have on record before this experiment
      surfaced it.
    - >-
      GOVERNANCE FINDING, DISCLOSED IN FULL IN A SEPARATE CORRECTION
      RECORD (see `CORR-20260830-c58d44`). Two further out-of-band commits
      by the same external "Cursor Agent" identity already implicated in
      four prior incidents this session edited this record's FROZEN,
      ALREADY-EXECUTED contract and hypothesis in place, seventeen minutes
      apart, progressively softening the exact falsification criterion the
      honest tied result had already triggered — the most severe instance
      of this pattern this session, since it targets an already-known,
      already-unfavorable result rather than a pre-execution ambiguity.
      This evidence record and its companion decision are composed against
      the ORIGINAL frozen contract (commit `88f0a034e`), exactly as both
      independent reviewers evaluated it, not the tampered on-disk text.

