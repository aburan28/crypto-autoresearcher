  proof_status_basis: >-
    empirical_only. Arm D counts distinct group sums by exhaustive enumeration in
    F_{2^n} arithmetic at seven (n, k, m) cells with n in {12, 15, 17}; arms A-C are
    exact arithmetic on Semaev's eqs. (15)-(16), exact F_2 linear algebra and a
    symbolic F_2-degree expansion. No Groebner engine, no solver, no degree of
    regularity, first-fall degree or d_F4 is measured or asserted anywhere
    (IMP-SEMBIN-ENGINE). certificate.kind is none with a stated reason. Every quantity
    here is a measured count, a ratio of counts, or an evaluated closed form at toy
    scale, and nothing transfers to any cryptographic n except by the explicit,
    untested assumptions named under boundaries.

