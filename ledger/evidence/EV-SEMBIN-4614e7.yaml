  observations:
    - id: O-1
      text: >-
        THE ARM-D MEASUREMENT IS EXHAUSTIVE AND THE INSTRUMENT IS SOUND (J4). 7 cells
        x 160 draws = 1120 typed enumerations; 1092 completed, 28 empty_typed_base,
        0 unreached. The validator reconstructed every domain from the recorded
        factor-base sizes without the printed ratios: typed_domain = prod
        typed_base_sizes (0 mismatches), fibre-histogram mass = domain and positive
        bins = image size for every completed row (0 mismatches), untyped domain =
        C(|F|+m-1, m) (0 mismatches), and the two printed ratios recompute to machine
        precision. One draw was brute-forced independently with the vendored curve law
        and itertools.product (image 128, mass 128, matching). Nothing was sampled.
    - id: O-2
      text: >-
        THE FROZEN PREDICTION IS MISSED AT EVERY CELL (J4). Scored verbatim --
        image_size_ratio_typed_over_untyped = m! within 10% at every enumerated cell
        -- 0 of 7 cells have every draw within 10%, 1 of 7 (n12_k4_m3, median 0.942)
        has its cell-median within 10%, and 7 of 7 have a draw below m!/2. Pooled
        median ratio/m! over 1092 completed draws is 0.4315329547882895, min
        0.000696, max 68.47. Per-cell medians: 0.0453, 0.721, 0.942, 0.688, 0.591,
        0.0811, 0.396. The contract's frozen falsification threshold (a ratio under
        m!/2 at any cell) was crossed at all seven cells. The headline "no cell within
        10%" is true under every-draw scoring and false as a statement about cell
        medians; the per-cell table in the validator's report is the result.
    - id: O-3
      text: >-
        THE DENOMINATOR m! IS OUT OF REGIME AT EVERY TESTED CELL (J4). m! is the
        2^k >> m^2 limit of the exact x-coordinate counting cap
        2^{mk} / C(2^k+m-1, m) = m! / prod_{j<m} (1 + j/2^k), an integer identity the
        validator re-derived and verified at all seven cells. At the declared cells
        cap/m! is 0.0677, 0.517, 0.837, 0.345, 0.705, 0.212, 0.705 -- at three cells
        (n12_k2_m6, n15_k3_m5, n17_k3_m6) the cap is already below m!/2, so "a draw
        below half m!" is AUTOMATIC there from integer counting alone, with no curve
        involved. Zero of seven cells satisfy HEUR-YT's own second clause mk <= n-3.
        Against the exact cap rather than m!, cell-median image/cap is 0.67, 1.39,
        1.13, 2.00, 0.84, 0.38, 0.56; against the actual point-domain ratio,
        image/domain medians sit at 0.69-1.91. The images roughly track their
        domains. The miss of m! is largely that the typed and untyped DOMAINS are not
        m! apart at these (k, m), plus saturation of the typed image against |E| while
        the untyped image stays small (|F| is 3-25 here, not 2^k). This is a checked
        convention disclosed by the run's own layer D1, not a swap of populations,
        and it does not reverse the scored miss.
    - id: O-4
      text: >-
        THE DEGENERATE-DRAW RULE IS DIRECTION-NEUTRAL AND THE 68.47 DRAW IS REAL (J4).
        All 28 empty_typed_base draws are additive cosets (multiplicative translates
        always contain x = 0 and y^2 = B has one root in characteristic 2, so gV is
        never an empty point-base); 26 of 28 sit in n12_k2_m6. Folding them back in
        moves the pooled median from 0.4315 to 0.4178 and creates no within-10% cell.
        The maximum draw (n15 k3 m5, additive, low-degree V, B=1, seed 20260913305,
        draw 0) is a completed non-empty draw: typed image 32866 against |E| = 33044
        (saturated) over an untyped base of |F| = 3 with untyped image 4. It is the
        starved-untyped / saturated-typed corner, not a draw the contract's own rule
        should have dropped. Additive and multiplicative families miss m! alike
        (median ratio/m! 0.448 vs 0.422); the representation control does not
        isolate the effect to one embedding.
    - id: O-5
      text: >-
        THE TYPED OBJECTIVE HAS AN INTERIOR MINIMUM, AND IT IS FLATNESS (J5). The
        validator re-derived dT/dm independently from the specification's three GG
        substitutions: with u(m) = n/m + log2 m, stage 1 is u + 4 omega log2 n and
        stage 2 is omega' u; du/dm = -n/m^2 + 1/(m ln 2) vanishes at m = n ln 2 with
        positive second derivative, so the argmin is interior at every n > 2/ln 2.
        Depth below the m = n boundary is 1 - 1/ln 2 - log2(ln 2) =
        0.08607133205593431 bits, independent of n; argmin 69 at n = 100 and 396 at
        n = 571 reproduce the producer's to the printed digits. The missed rising term
        is log2 m, entering from GG's typed relation store m 2^k. 0.086 bits is a 6.1%
        linear-cost difference; at n = 100 the objective falls from 130.7 bits at
        m = 2 to 87.28 at m = 69 and rises 0.086 to 87.37 at m = 100, with 76 of 99
        feasible m within 1 bit of the boundary. A real interior critical point, and
        not a useful optimum. The producer's closed form (1+omega')u has depth 0.258
        bits; the numerical total it minimises has depth 0.086 because stage 1
        dominates; the manifest stores the unit depth (labelling defect, same argmin).
    - id: O-6
      text: >-
        THE INTERIOR MINIMUM DOES NOT SURVIVE EVERY DEFENSIBLE NORMALISATION (J5).
        Under the ceiled reading k = ceil(n/m) with yield capped at 1, the global
        argmin is at the boundary m = n at n = 571 (depth 0) and a two-point tie
        {50, n} at n = 100 (depth 0); the 0.086-bit interior minimum of u does not
        appear as a global-versus-boundary gap. Under ceiled paper-raw (uncapped
        P > 1) a deep spurious interior minimum appears (70 bits at n = 100, 99 at
        n = 571) that is an artifact of an illegal probability. So the prediction
        "monotone decreasing, no interior optimum" is FALSE on the unceiled reading
        Table 3 uses, by 0.086 bits, and HOLDS at n = 571 under ceiled+capped. The
        localisation claim -- that log2(m!) is the unique exponent-setting rising
        term and its deletion dissolves the sqrt(n ln n) balance -- is not refuted:
        log2 m is O(log n), the untyped interior minimum it replaces is hundreds of
        bits deep (about 500 at n = 100), and the typed remainder is 6%.
    - id: O-7
      text: >-
        UNREVIEWED, PRODUCER'S FIGURES: ARM A. The symbolic derivation returns
        c' = sqrt(2 ln 2) = 1.17741002251547469... and c = 2/c' = 1.6986436...
        (bisection of the unreduced balance agrees to 1e-59), the stage coefficients
        are equal at c' to 50 decimal places, and the three declared typed stage-1
        savings equal log2((m-1)!) to 1.4e-14 bits (25.2505 at n571 m12, 21.79 at
        n571 m11, 12.30 at n283 m8), settling the originating proposal's 15.3-bit
        figure as log2(m!) rather than log2((m-1)!). Table 3 reproduces to 0.7% at
        35 of 36 cells under the unceiled n/m reading (the miss is 0.7042%, inside the
        table's 3-significant-figure rounding) and at 20 of 36 under ceil(n/m) with
        residuals up to 211%: Table 3's arithmetic uses the non-integer n/m, so the
        contract's requirement to reproduce it under BOTH readings is unsatisfiable
        and the run records that as a procedure defect of the k-reading clause. The
        required-degree floor coefficients are 0.2478 at omega = 2.376 and 0.1962 at
        omega = 3, with the Assumption-1 bound crossing near n = 1979. No joint
        reviewed these; recorded, not weighed.
    - id: O-8
      text: >-
        UNREVIEWED, PRODUCER'S FIGURES: ARMS B AND C. Over 160 builder draws the
        typed and untyped Weil-descended systems have identical equation count,
        variable count, maximum degree and degree-3 support; the coefficient-wise
        comparison reports a largest discrepancy at a degree-2 equation (10 vs 107
        monomials at n15 t3 k5), i.e. the systems are count-identical and
        support-identical at degree 3 and NOT coefficient-identical below it, which
        is what an affine substitution does and is not by itself a builder mismatch
        under the run's reading of the zero-cost clause. The affine-invariance
        expansion returns F_2-degree 3 for S_3(u, v_1+y_1, v_2+y_2) and for
        y_1 S_3(...) in every case, including adversarial (v_1, v_2). Whether the
        prediction's phrase "compared coefficient-wise and not merely by count" is
        satisfied by count-plus-degree-3-support identity was not put to a reviewer;
        it is open.
    - id: O-9
      text: >-
        UNREVIEWED, PRODUCER'S PROTOCOL DEVIATIONS. The run did not halt after arm D's
        gate fired; phases 1b-5 ran anyway within 64 s of a 3600 s budget and 0.22 GB
        of 4 GB, with arm D's observation complete and self-contained before any
        later phase started. Three execution attempts were made; the first two
        terminated on the empty-coset case, which was then recorded as its own
        outcome. implementation.md says 29 empty draws where image-sizes.json has 28
        (the 29th stdout anomaly is the halt-and-continue record). The driver constant
        DRAWS_PER_CELL = 20 becomes 160 enumerations per (n, k, m) after crossing
        subspace x B x family -- more draws than the contract's "all 20", not fewer.
        git_dirty was true at launch (the experiment directory was untracked); the
        snapshot TASK-20260913-a10003 (24f5a574a) then bound the bytes, and the
        validator's recomputed hashes match it.

  inference: >-
    H-SEMBIN-c59e50 IS WEAKENED IN ITS TESTED SCOPE. Two of its own falsification
    conditions fired exactly as written: the exact typed-over-untyped image ratio is
    not about m! at any of seven exhaustively enumerated cells (O-2), and the typed
    objective has an interior minimum in m at every tested n (O-5). Both firings are
    real, both survive an independent validator that attacked the denominator, the
    degenerate-draw rule, the summary and the normalisation, and both are recorded as
    failed against the sentences that were frozen. What the same review then shows is
    that neither firing tests what the hypothesis is FOR. The m! prediction was
    stated unconditionally at cells where HEUR-YT's own second clause mk <= n-3 fails
    everywhere and where the integer counting cap is already below m!/2 at three of
    seven cells (O-3): the prediction was arithmetically unattainable there before any
    curve was consulted, and against the exact cap the typed image tracks its domain
    (medians 0.38-2.00). That is a defect of the frozen prediction, not of the
    enumeration. The interior minimum is 0.086 bits of flatness from an O(log n) term
    (O-5, O-6), against the hundreds-of-bits log2(m!) balance the hypothesis says it
    removes, and it vanishes under the ceiled+capped reading. So the hypothesis's
    central localisation -- log2(m!) is the unique exponent-setting rising term in
    eqs. (15)-(16) -- stands unrefuted and is reinforced by the unreviewed arm-A
    figures (O-7), while its yield clause HEUR-YT is UNTESTED in regime and its
    zero-cost clause rests on unreviewed count-level identities (O-8). `weakened`
    rather than `rejected` because the scored refutation closes only cells outside
    HEUR-YT's stated regime (rule 6) and the surviving content is the hypothesis's
    main claim; rather than `supported` because two frozen falsification conditions
    fired and no reviewer has passed arms A-C. The successor is an image-size
    measurement in regime: cells with 2^k >> m^2 and mk <= n-3, which cannot be
    enumerated exhaustively and must be sampled with a preregistered estimator, scored
    against the exact cap rather than m!.

  boundaries:
    - >-
      Tested scope of arm D is exactly the seven cells of EXP-SEMBIN-92724f:
      (n, k, m) in {(12,2,6), (12,3,4), (12,4,3), (15,3,5), (15,4,4), (17,3,6),
      (17,4,4)}, curves y^2 + xy = x^3 + B over F_{2^n} with B = 1 and seeded random
      B, V the low-degree polynomial subspace or a random k-dimensional subspace,
      additive cosets V + v_i and multiplicative translates g_i V. |F| ranges 3-25.
      Every count above is about those objects.
    - >-
      HEUR-YT's stated regime (2^k >> m^2, mk <= n-3) is reached by NONE of the
      tested cells. The negative result therefore closes "coset typing recovers m! at
      these toy cells" and says nothing about the heuristic where it was stated.
    - >-
      Arms A, B, C and the baseline control (O-7, O-8) are producer figures with no
      independent review joint. They are recorded under core rule 8 and are not
      validated evidence.
    - >-
      The interior-minimum result is a property of the cost model eqs. (15)-(16) with
      GG's substitutions under the unceiled reading k = n/m; under ceil(n/m) with
      capped yield it does not appear as a global-versus-boundary gap at n = 571.
      Nothing here is a measured runtime.
    - >-
      No degree is measured, estimated or asserted (IMP-SEMBIN-ENGINE). HEUR-A1T
      remains unvalidated on this host. Whether the m! is conserved and exchanged
      from probability into degree is untested in either direction.
    - >-
      Transfer to Nagao ePrint 2015/984 section 7 is not settled: arm D measured
      H-SEMBIN-c59e50's coset-typed family, not EQS3/EQS4 (validator pointer).
    - >-
      NOTHING IN THIS RECORD IS A STATEMENT ABOUT THE SECURITY OF ANY CURVE AT ANY
      PARAMETER, IN EITHER DIRECTION.
    - >-
      Model provenance: the producing run records resolved_model_id null with
      model_verified false; the reviewing session records cursor-grok-4.6-xhigh at
      xhigh with fallback_used true (DEC-20260913-c224bb) and model_verified false.
      Disclosed on both sides; no adapter probe ran in either.

  unresolved_confounds:
    - >-
      Whether the typed image would reach the exact counting cap (image/cap = 1
      within 10%) in HEUR-YT's regime. The in-regime measurement does not exist; the
      toy cells scatter 0.38-2.00 around it with saturation and starvation effects
      that the regime removes by construction.
    - >-
      Whether "identical coefficient-wise" in the builder prediction is satisfied by
      count identity plus degree-3 support identity, or requires the literal
      coefficient identity that an affine substitution cannot give. The producer read
      it the first way; no reviewer adjudicated.
    - >-
      The 68.47 draw and the m = 6 cells at 0.045-0.081 are both real completed
      enumerations at opposite corners (starved untyped base; domain ratio already
      0.02 of m!). Any pooled one-number summary of arm D mixes them; the per-cell
      table is the datum.

  dominated_by: >-
    Not applicable as a Pareto question: this record tests the internal structure of
    a cost model and a yield heuristic, not an algorithm. The frontier row it bears
    on is Semaev 2015 eqs. (15)-(16) with c = 1.6986, which the unreviewed baseline
    reproduces; no row is moved.

  sota_delta:
    time_exponent: unchanged
    note: >-
      No exponent is moved and none is claimed. The hypothesis's conditional saving
      of log2((m-1)!) bits in stage 1 is confirmed as arithmetic on the model (O-7,
      unreviewed) and remains conditional on HEUR-YT, which this run could not test
      in regime, and on HEUR-A1T, which no run on this host can test.

  knowledge_promotion: deferred
  knowledge_promotion_reason: >-
    NOT PROMOTED. The reusable content is O-3 -- the exact counting cap
    2^{mk}/C(2^k+m-1, m) is the right finite-k denominator for any typed-versus-
    untyped image comparison, and m! is its limit only where 2^k >> m^2 -- together
    with O-5/O-6 -- the typed objective's interior minimum is an O(log n) flatness of
    0.086 bits, reading-dependent. Both are one review's findings on one run at toy
    cells; the cap identity is elementary and the successor contract will carry it as
    its scoring rule. Promotion to KN-FIND waits on an in-regime measurement.

