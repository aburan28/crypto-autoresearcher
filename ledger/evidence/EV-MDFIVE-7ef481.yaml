  proof_refs: []
  proof_status_basis: >-
    No cryptanalytic claim is made or reviewed in this batch; the record
    documents the superseding protocol (BCP-2), the implemented certificate
    kind, and their two independent reviews. The blind calibration search —
    the first step that could produce a result about MD5 — is NOT in this
    batch and remains open and unattempted.

  observations:
    - id: O-1
      text: >-
        BCP-2 (frozen at snapshot commit 8677f11af, TASK-20260820-513ea9)
        makes the blind calibration run DISPATCHABLE. Two independent
        reviews, run concurrently under the pre-committed plan
        (review-plan-affeff.yaml, written before either reviewer ran):
        TASK-20260820-affeff (red team, resolved model zai/glm-5.2, xhigh)
        verdict holds-with-named-gaps with no batch-halting findings;
        TASK-20260820-047039 (validator, resolved model zai/glm-5.2, xhigh)
        determination dispatchable-with-named-gaps with one minor defect.
        The determinations agree; the named gaps are recorded in O-5.
    - id: O-2
      text: >-
        The pre-dispatch gate is mechanically decidable and passes for the
        committed quarantined payload. The pinned canonical serialization
        (adopted verbatim from the committed MANIFEST:
        yaml.safe_dump(payload["path"], sort_keys=True,
        default_flow_style=False), sha256, UTF-8) recomputes to the
        pre-registered digest 2ea0083baa99e0af841f09e14ed5a5ab0488f2b8df0c5ffe1512e0be5cc05002
        — independently confirmed by three recompute paths: the coordinator
        pre-freeze check (Python 3.12.8 / PyYAML 6.0.3), the red team's J1
        recompute, and the validator's check 1a (hash-only access; payload
        content never read by any batch task). The validator's synthetic
        shape-matched structure and three serialization perturbations each
        change the digest and HALT the gate correctly. Cross-version
        stability of the pinned serialization is declared-not-checked, as
        BCP-2 itself states; the digest comparison is the check.
    - id: O-3
      text: >-
        The md5_collision_pair certificate kind (TASK-20260820-e4405b,
        additive change to harness/runner.py) behaves correctly on
        known-false objects re-run by the validator with its OWN driver
        (not the producer's suite): non-colliding pair, tampered digest, and
        m1 == m2 each come out verified:false with the failing check named;
        verified_by is wrapper-populated only (the BCP-2 J5 fix); the
        pin-mechanism distinctness check confirms IMPL-1 (hashlib/OpenSSL
        libcrypto) vs IMPL-3 (_md5/CPython, libSystem-only) as distinct
        module files, runtime types, and library linkage — matching the
        BATCH-46254b independence determination. The producer's own suite
        (T1-T10) also all-passed, including the aliased-registry detection.
        The end-to-end true path (a genuine colliding pair through two real
        independent implementations) remains UNTESTED within budget and is
        named OPEN; the quarantined pair is forbidden to all batch tasks.
    - id: O-4
      text: >-
        The BCP-1 -> BCP-2 delta table (23 rows) contains 8 tightened,
        15 held, and 0 loosened rows; the red team's element-by-element
        firewall diff (J4) independently found no loosened row and the
        declared-not-checked list grew from 5 to 6 channels (parametric
        channel with its named obstruction carried forward verbatim in
        substance). Firewall carry-over is NO REGRESSION: the quarantine
        marker and path are exact in BCP-2, the CONSUMPTION rule and
        invalidity condition are present, the closed hash-manifested input
        set is present, the ordering guarantee (protocol frozen before any
        calibration run) is present, and the corrected staging-rules
        reference points at the real RULES constant in
        kb/src/crypto_kb/ingest/repo_corpus.py (21 globs, none matching
        coordination/**; file sha256 290dc6f4... no drift versus the last
        recorded value, recomputed at both the snapshot and the validation).
    - id: O-5
      text: >-
        Named gaps, none blocking dispatch (dispositions in
        DEC-20260820-32bf19 F-2): (1) cross-version stability of the pinned
        serialization declared-not-checked, original verification PyYAML
        version unrecorded; (2) no committed test in tests/test_harness.py
        exercises md5_collision_pair — the pin mechanism is a run-time check
        only, so a future aliasing edit would be caught at run time, not by
        the suite; (3) TOL = 2 and the named baseline are declarations, not
        measurements (BCP-2 says so); (4) confound_caveat is a required
        evidence-record field (INV-10) at protocol level but not code-
        enforced in harness/runner.py; (5) the legacy write_run() path
        still accepts caller-supplied timing for new runs (INV-11 is
        protocol-level). DEFECT-1 (validator, minor): BCP-2 documents
        IMPL-3's runtime_type as _md5.MD5Type; the runner's probe records
        _md5.md5 (the type's __name__; MD5Type is an attribute alias for
        the same object) — the distinctness check is unaffected.
    - id: O-6
      text: >-
        Reviewer procedure record: TASK-20260820-affeff attests
        blind_from_respected: false — it read BCP-2's self_report section
        via a full-file read, but derived the CONSUMPTION predicate from
        the blind_scoring_rule section alone and attests zero substantive
        impact (the self_report carries no CONSUMPTION-predicate content);
        its verdicts rest on re-runs, not the read. This is the second
        occurrence of the same procedural breach pattern (first:
        TASK-20260810-b9d956, dispositioned in DEC-20260810-1163ec F-5)
        and receives the same disposition standard in DEC-20260820-32bf19
        F-4. Both reviewers attest read_sibling_reports: false; the
        quarantined payload content was read by neither (hash-only gate
        access is the declared mechanic).

