evidence:
  id: EV-ENDO-10109d
  hypothesis_id: null
  hypothesis_note: >-
    GOAL-ENDO-001 carries no active hypothesis. This is a corrective follow-up
    batch executing next actions N3, N4, N5 from DEC-20260807-c8aa8b; it tests
    no hypothesis and moves no hypothesis status.
  question_id: RQ-ICINV-475b5e
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-523510
  experiment_ids:
  - EXP-MTGT-952db3
  - EXP-EWALK-5ca18c
  - EXP-ICINV-55c2d8
  - EXP-ICINV-9b1f7c
  run_ids:
  - RUN-MTGT-p50021sweep
  - RUN-MTGT-p60013sweep
  - RUN-EWALK-p100057-20seeds
  - RUN-ICINV-p4001-fixed
  - RUN-ICINV-p6007-fixed
  - RUN-ICINV-p4001-degenfix
  - RUN-ICINV-p6007-degenfix
  type: empirical
  direction: mixed
  strength: replicated
  claim_tier: toy
  certificate_refs:
  - >-
    experiments/EXP-MTGT-952db3/runs/RUN-MTGT-p50021sweep/raw-result.json and
    RUN-MTGT-p60013sweep -- every transported table entry at every tested ell
    re-verified by recomputing [s]phi(P) on the target curve independently of
    the transport code, and every target curve confirmed at the same trace as
    the source (all_same_class: true, all_certified: true at both primes).
  proof_status: empirical_only
  proof_refs:
  - ledger/corrections/CORR-20260807-9f83be.yaml
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-523510/SYNTHESIS.md
  observations:
  - >-
    N4 CONFIRMED, REPLICATED AT TWO PRIMES. With `velu_odd` now refusing even
    ell (CORR-20260807-3ee25d D1 closed) and the rebuild baseline corrected to
    one addition per consecutive multiple (D2 closed), preprocessing transport
    LOSES against a correctly-costed rebuild at every odd ell tested, 3 through
    31, at both p=50021 and p=60013. The ratio grows from ~1.5x at ell=3 to
    ~21x at ell=31, tracking Velu's O(ell) per-point cost. THERE IS NO
    CROSSOVER: transport never wins in the tested range, which is a materially
    stronger and cleaner negative than the Red Team's "~17.1" extrapolation of
    the ORIGINAL (still-inflated) ratio -- that number described a trend line
    on the wrong baseline, not a true crossover.
  - >-
    N5 CONFIRMED, 20-SEED DISTRIBUTION, BOTH AUTOMORPHISM ARMS. At p=100057
    (prime, 1 mod 12), j=0 ratio-to-ceiling mean 1.0043 (sd 0.1128, range
    0.809-1.282) and j=1728 mean 1.0442 (sd 0.1059, range 0.868-1.193) --
    both statistically consistent with sitting ON the sqrt(|Aut|/2) ceiling,
    with symmetric noise in both directions rather than a systematic
    shortfall. Fruitless-cycle counts are near-zero throughout (38-40 of 40
    curve-seed samples exactly zero in every arm), so CORR-20260807-3ee25d D9's
    single-draw shortfall attribution to fruitless-cycle cost had no
    persistent shortfall to explain in the first place.
  - >-
    N3 CONFIRMED, REPLICATED AT TWO PRIMES, WITH A FOURTH INSTRUMENT DEFECT
    FOUND AND FIXED DURING CONSTRUCTION. Building the density sweep surfaced an
    impossible value (rate_m3 = 1.0 against a sum-set of density 0.016) that
    traced to `targets_uniform` silently degenerating to a single repeated
    point when its unchecked base point happened to be 2-torsion
    (CORR-20260807-9f83be). Confirmed present in 4 of 8 already-committed
    BATCH-cb71b5 classes. Fixed by searching up to 200 candidates for the
    highest-order point found. Directly measured impact at the p=4001 target
    class: decomp_rate_m2 ratio 5.745 -> 1.416, decomp_rate_m3 3.642 -> 2.298
    -- BOTH STILL over-dispersed, and NULL-C's between-class "no signal"
    reading holds more strongly post-fix at p=6007 (0.1955->0.881,
    0.6905->0.8215). Neither BATCH-cb71b5 qualitative conclusion flips. With
    the fix applied, the density sweep itself is unambiguous: variance ratio
    stays in [1.3, 3.6] at every density from 0.024 to 0.97 at BOTH primes,
    with NO decay trend (monotonic_decay: False at both) -- refuting the
    saturation-artifact hypothesis this campaign and the independent Red Team
    both proposed for CORR-20260807-3ee25d D8's refuted pre-registration.
  - >-
    OPEN QUESTION, NOT A RESULT. The density-independent within-class
    over-dispersion (ratio consistently 1.3-3.6x binomial noise, including
    after removing each curve's own |3V|/#E prediction) is now an established,
    replicated fact rather than a saturation artifact, but WHAT explains it is
    unknown. It licenses no attack-cost claim: the measurement is exact
    sum-set enumeration, not an efficient algorithm, and every resource/
    admissibility filter in DECOMPOSITION.md still applies unchanged.
  - >-
    N2 ADDRESSED BY CHARACTERISATION, NOT REPLACEMENT. NULL-B (per-class
    binomial dispersion) and NULL-C (cross-class label permutation) are now
    explicitly documented as answering different questions: NULL-B is the
    within-class statistic and is what shows the real effect above; NULL-C is
    a between-class MEAN detector only and must never be read as evidence
    about within-class structure in either direction, in this or any future
    batch of this campaign.
  inference: >-
    This batch's three corrective measurements (N3, N4, N5) all confirm and
    sharpen BATCH-cb71b5's post-review findings rather than reversing them:
    transport still loses (now with no crossover in range, not just at large
    ell); the walk speedup still sits on its ceiling with no systematic
    shortfall (now with a clean two-arm 20-seed distribution instead of one
    draw); and the within-class over-dispersion is now shown to be
    density-independent rather than a saturation boundary effect. A FOURTH
    instrument defect was found in the process of doing this work honestly --
    found by an impossible number surfacing during construction of the N3
    sweep, not by external review -- and its scope was checked directly against
    the already-committed evidence before this record was written: it does
    not reverse any prior conclusion, though it did inflate the magnitude of
    one within-class statistic in one already-cited run.
  boundaries:
  - >-
    Toy scale throughout: p <= 100057. No statement here transfers to
    cryptographic scale and none is offered.
  - >-
    The MTGT sweep tests one ell range (3-31) at two primes; larger ell or
    different curve families are not covered.
  - >-
    The EWALK 20-seed distribution is at one prime (p=100057); seed-to-seed
    variance at other primes or bit-lengths is not measured here.
  - >-
    The saturation sweep's density-independence finding is established at two
    primes on the SAME target-class-selection rule (largest ordinary class);
    whether it holds on differently-selected classes is untested.
  unresolved_confounds:
  - >-
    WHAT CAUSES THE RESIDUAL WITHIN-CLASS OVER-DISPERSION IS UNKNOWN. Neither
    pure binomial sampling noise nor each curve's own |3V|/#E prediction
    explains it; the residual-to-binomial ratio stays materially above 1 at
    every tested density. This is the campaign's most important open question
    and is not resolved by this batch.
  - >-
    Independent review of this batch's numeric claims was dispatched at
    reduced scope (four specific checks) given two prior full-scope
    dispatches on this campaign terminated on a provider session limit before
    delivering a report; see review_provenance for its outcome.
  - >-
    THIS BATCH DOES NOT ADDRESS N6 (the git_state() untracked-source blind
    spot from CORR-20260807-3ee25d D3) or N7 (RQ-CANL-63098f's under-populated,
    unexecuted lane). Both remain open exactly as BATCH-cb71b5 left them.
  reviewed_by: coordinator
  review_provenance: >-
    COMPLETE. An independent Validator session was dispatched at reduced scope
    (four specific numeric checks, chosen because two prior full-scope
    dispatches on this campaign were killed by a provider session limit before
    writing a report) with instructions to save its report incrementally after
    each check. It completed all four checks and returned overall
    `verdict: passed` -- the first fully-completed independent review in this
    campaign, after two prior attempts (BATCH-cb71b5's Validator and Red Team)
    were each killed mid-task by the same provider session limit.
    Full report: coordination/goals/GOAL-ENDO-001/batches/BATCH-523510/
    reviews/validator/validation_report.yaml.

    Every check was backed by independent re-execution or structural
    recomputation, not just code reading: check 1 reproduced both the fix (275
    distinct targets from a spot check expecting ~300, matching a
    birthday-collision approximation of 278.4 almost exactly) AND the original
    defect on the same curve (confirmed point (3,0) has order exactly 2); check
    2's independent re-run at p=50021 reproduced the committed sweep's shape
    within ~10% (timing noise) at three ell values; check 3's independent
    5-seed re-run landed both automorphism arms' means inside the stated
    [0.8, 1.3] band, and a separate recomputation of the committed 20-seed run
    matched the synthesis's quoted means, standard deviations, exceed-counts,
    and fruitless-cycle counts EXACTLY; check 4 used an AST-level structural
    diff to confirm code fidelity (not eyeballing), independently recomputed
    `monotonic_decay` from raw per-density rows (matched False/False at both
    primes), and arithmetically recomputed `variance_ratio` from its raw
    components to full float precision, additionally verifying explicitly
    against the AGENTS.md null-object-control requirement that the measured
    ratio does NOT decay toward 1 as density increases -- "exactly the
    canonical artifact tell the operating rules warn about", which the
    synthesis reports honestly rather than hiding.

    The Validator's own stated limitations, carried forward here rather than
    dropped: this review covers ONLY the four named numeric claims, not the
    N1/N2 narrative sections of the synthesis, not a full artifact-hash or
    dirty-tree audit, and not the correction records' own bookkeeping; it ran
    in the same environment as the harness rather than a from-scratch rebuild;
    and -- in the Validator's own words -- "a passed validation report makes
    these four receipts admissible evidence; it does NOT support an ECDLP
    claim, does NOT demonstrate a speedup, and does NOT authorize promotion or
    closure of GOAL-ENDO-001 or any of its hypotheses." N6 and N7 from
    DEC-20260807-c8aa8b remain unaddressed and unreviewed.

    The Validator also independently confirmed, unprompted, that the three
    diagnostic run directories the Coordinator committed as a follow-up
    (RUN-INSTR-p4001-degenfix, RUN-INSTR-p6007-degenfix, RUN-JINV-p1009-degenfix)
    were correctly excluded from its evidence base at review time, since they
    postdated the reviewed snapshot c9c27221 -- confirming the ordinary
    working-tree hygiene check rather than raising a new concern.
