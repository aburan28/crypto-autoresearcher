  named_finding:
    id: AM4-OBS-1
    title: >-
      The standard-basis diagonal obstruction: every observable proposed in
      GOAL-MLKEM-005 is a function of diag(QQ^T) in the standard basis, and no
      function of that diagonal can be AM-4-invariant.
    statement: >-
      E_I, V, m3, D and every quantity derived from them (r, m(t), Delta_i,
      SE_step, SE_diff, shift_SE, G1, G2), together with the degree-1 alternative
      W = sum_{a<=k} P_aa - beta*k/d that EV-MLKEM-94c773 recorded as evidence that
      "the space is not empty", are functions of the diagonal of the tail-frame
      projector in the standard coordinate basis. An ambient isometry B -> BH
      preserves the lattice and destroys that diagonal, so none of them can be
      invariant under it, and the measured values confirm it: E_I -> k/d (the Haar
      value, which falsifies both spill mechanisms), V by 38.6x, m3 by 232x, D by a
      sign change; a row permutation alone -- unimodular, the same lattice -- moves
      D by 13.3%, above Section C's own 5% practical floor.
    status: >-
      MEASURED, NOT PROVED, and single-session for E_I, m3 and D. The obstruction as
      stated is an argument about the form of the observables, not a theorem that no
      admissible statistic exists; naming it is the cheapest route to either an
      admissible observable that is not a function of the standard-basis diagonal, or
      to the "NO ADMISSIBLE PREDICATE EXISTS, HERE IS THE OBSTRUCTION" outcome that
      AM-4 itself declares preferred.
    why_it_matters_beyond_this_batch: >-
      It bears on the whole statistic family GOAL-MLKEM-005 has been built on across
      four batches, not on BATCH-a44d08 alone, and it is the measured answer to the
      fourth next_action of DEC-20260806-14ac13.
    evidence: >-
      red_team_report.md section 4 and RT-X1 (rt_am4_D.py, d = 100, beta = 40,
      k = 50, 8 bases, N = 2^20); corroborated for V only by BATCH-f19c37's red team
      via prereg section 1.1 and by the P3 refusal in DEC-20260806-14ac13.

  inference: >-
    THREE CONTROLS WERE FOUND DEFECTIVE AND THE BATCH'S THREE HEADLINE RESULTS DO NOT
    SURVIVE REVIEW IN THE FORM THEY WERE STATED -- and that is a real outcome, not a
    failed batch. What the batch actually delivered is: (1) a question five records
    across four batches had deferred is now answered, and the answer is smaller and
    firmer than the headline: the tail GSO window of the unreduced q-ary presentation
    lies in the identity block with boundary beta <= k and not beta <= d-k, but that
    is an algebraic property of B = [[I_k,A],[0,qI]] with A of full rank and entries
    of order q, it returns the identical curve on Z^d, and it tracks rank(A_S) rather
    than k -- so the E_I arm cannot separate the two spill mechanisms and never
    could. What did not have to come out as it did is the V arm, where M-K's
    generic-spread clause is genuinely refuted in the spill window at +20% to +33%.
    (2) The AM-3 gate is INADMISSIBLE by its own frozen clause, and the clause fired
    for a reason its own rationale does not cover: the injection never made the step
    increasing in three of four cells, so nothing was ever presented to the gate. The
    gate's declared 0.096 false-failure bound stands and its power is undemonstrated
    rather than disproved. (3) Section C is UNCALIBRATED. Its verdict is not
    evidence, its non-firing pairs are not upper bounds, and the reason is now
    measured rather than argued: D is one order statistic of a single shared 2^20
    pool, the frozen SE is a between-frame dispersion that omits the dominant
    variance, and two reviewers building two different true nulls both watched the
    falsifier fire on them at rates one to two orders above its declared level, with
    the scored pair's own sign flipping across error pools. (4) Cross-cutting and
    most consequential: under AM-4 not one statistic in this family is a lattice
    invariant, an ambient isometry sends E_I to the Haar value that falsifies both
    mechanisms and flips D's sign, and a row permutation alone moves D by more than
    Section C's own practical floor -- so the instrument problem is not one batch's
    problem, it is the goal's statistic family, and the obstruction has a name
    (AM4-OBS-1). The methodological pattern DEC-20260806-14ac13 recorded at six
    instances now has a seventh and an eighth, and the eighth is of a new kind: the
    object with the invisible defect was the CONTROL, not the statistic. Every one of
    these was named in advance by the producers themselves and under-weighted; none
    was missed.

  boundaries:
  - >-
    CLAIM TIER TOY, UNCONDITIONALLY. Nothing in this record bears on ML-KEM
    security, on any FIPS 203 parameter set, on any attack cost, or on any cost
    model. d in {100,140}, beta <= 120, q <= 3329, n = 8, N = 2^20, the 2^-10
    quantile only, no reduction beyond LLL.
  - >-
    NO HYPOTHESIS STATUS MOVES AND NONE IS PROPOSED. This record names no
    hypothesis, and the batch measured instruments and one basis presentation.
  - >-
    "L2 TAIL-SUFFICIENCY FALSIFIED" IS NOT A RESULT OF THIS BATCH AND IS NOT
    RECORDED AS ONE. The frozen verdict stands as the output of the frozen prereg
    4.4 rule on the frozen pool -- neither reviewer rescored it and neither may --
    but the admissible reading is UNCALIBRATED: neither falsified nor consistent
    nor a valid upper bound.
  - >-
    Section A's result is about a basis PRESENTATION and is delivered ANALYTICALLY.
    It says nothing about any lattice invariant, about reduction, about the Beta
    tail law, or about ML-KEM, and it is not an AM-4 adjudicator.
  - >-
    Section B's INADMISSIBLE is an INSTRUMENT outcome. It is not evidence about
    lattices in either direction, and it does not retire AM-3 or show the gate
    cannot fire.
  - >-
    Every negative in this batch is an upper bound at a declared floor, never an
    absence: Section A's non-falsifications at at most 1.3e-3 in E_I units against
    tol_E = 0.02 and within tol_V(M-K) of 0.0704 to 0.6889 in V units at n = 8
    bases; Section B's 0 of 48 violations at a flagging floor of 1.92 to 6.08 x
    SE_diff and its t = 1 arms at |D| < 4.0 x SE_diff = 0.004566 / 0.005185 /
    0.005973 / 0.005665; Section C's eight non-firing pairs at floors of 6.29% to
    17.23% relative -- and those Section C floors are additionally VOID because they
    are computed from the invalid SE, so they are not even upper bounds.
  - >-
    THE AM-4 TABLE IS ONE RED-TEAM SESSION'S MEASUREMENT on its own frames at one
    (d, beta, k), not pre-registered and not replicated within this batch. Only V's
    non-invariance is corroborated across batches. AM4-OBS-1 is an argument about
    the form of the observables, not a theorem that no admissible statistic exists.
  - >-
    THE TWO REVIEW REPORTS WERE READ IN THE WORKING TREE AND ARE NOT PART OF THE
    7700090428 SNAPSHOT COMMIT. They must be committed by an archival task before
    anything resting on them is durable; this is the inherited PD-4 condition
    recorded on GOAL-MLKEM-005 (the harness requires review artifacts to sit
    uncommitted across a dispatch window). This record therefore makes NO official
    hypothesis-status transition, and its own durability is contingent on the
    BATCH-a44d08 ledger archive being made and accepted by the post-commit
    verifier.
  - >-
    Independence in this batch is PROCEDURAL -- separate sessions, snapshot before
    review, roles distinct from the producers -- and NEVER model-level. Both reviews
    record model_verified: false with the reason: under this runtime, per-role model
    and effort selection is process-level, subagents keep model: inherit, and no
    adapter probe receipt exists for either session. Recorded rather than left to
    pass, as this goal's inherited constraints require.
  - >-
    No LLL, BKZ or new reduction was run by either review. Section A's secondary
    A-lll arm and every reduced-arm figure quoted in the batch are checked for
    internal consistency only (Validator L-5).

  unresolved_confounds:
  - >-
    WHETHER D DEPENDS ON THE FRAME ONLY THROUGH V AT THE 2^-10 QUANTILE IS OPEN IN
    BOTH DIRECTIONS after this batch. The instrument that was supposed to decide it
    cannot, and the calibration that would let a successor decide it -- independent
    error pools, replication over coordinate supports, and a pre-registered
    exchangeable-null false-falsification rate -- has never been run.
  - >-
    WHETHER THE AM-3 GATE HAS USABLE POWER IS UNDEMONSTRATED, not disproved. The
    closed-form c_min at all 12 steps (Red Team section 2.2) is the strictly
    stronger, cheaper, lottery-free characterization the frozen control should have
    used and it has not been pre-registered.
  - >-
    WHETHER ANY AM-4-ADMISSIBLE STATISTIC EXISTS FOR THIS QUESTION IS OPEN, and the
    obstruction AM4-OBS-1 makes the search sharper rather than closing it. Four
    statistics have now been refused (P3/V in BATCH-f19c37; E_I, m3 and D here) plus
    the degree-1 alternative W by inheritance.
  - >-
    The E_I observable's dependence on the ENTRY MAGNITUDE of A rather than on block
    identity is measured and unexplored: with the block structure held fixed and A's
    entries in {0,1}, M-K is falsified at 8x the frozen 0.02 tolerance at beta = 15
    (Red Team RT-A4). No committed record in this goal characterizes where between
    |A| ~ 1 and |A| ~ q the observable stops being pinned.
  - >-
    Section A's V arm shows M-K's generic-spread clause missing positively at 30 of
    32 discriminating points, and the producer's POST-HOC Beta-within-block
    refinement overshoots in the other direction (+0.78%..+19.10% becomes
    -0.02%..-11.09%) rather than closing the gap. Labelled POST-HOC and uncitable by
    its own producer; recorded here only as an open direction, never as a result.
  - >-
    The one-ULP scipy betaincinv difference at d = 140 is localized but not fully
    excluded at the level of the order statistic itself: reconstructing q_emp = r *
    q_Beta agrees to <= 3.85e-16 and is bitwise identical in 393 of 448, but the
    round trip is not an exact inverse, so a residual ULP-level difference in the
    order statistic is not excluded (Section B section 2.1, disclosed by the
    producer). Immaterial at every reported digit; recorded because it was not
    rounded away.
  - >-
    RULE 12 REMAINS UNMET AND UNWAIVED IN THIS GOAL, inherited from GOAL-MLKEM-003:
    every producer and every reviewer, in every batch of this goal and of its two
    predecessor campaigns, has resolved to the same model, so no claim in this goal
    has ever had a genuinely independent second backend, and two knowledge
    promotions remain owed.

  reviewed_by: coordinator
