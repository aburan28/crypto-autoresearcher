evidence:
  id: EV-MLKEM-cd9878
  hypothesis_id: null
  hypothesis_id_note: >-
    DELIBERATELY NULL. BATCH-a44d08 ran three measurements of INSTRUMENTS and of a
    basis PRESENTATION: a coordinate-block observable on an explicitly constructed
    q-ary basis (Section A), a monotonicity gate and its own positive control
    (Section B), and a matched-V cross-family falsifier (Section C). The frozen
    contract (TASK-20260806-843c40/prereg.md section 1.1, section 5.8) states that
    V, E_I, m3 and D are properties of a basis presentation and that no verdict in
    the batch is offered as an adjudicator of a claim about a lattice. Naming a
    hypothesis here would invite exactly the inference these runs cannot support.

  experiment_ids: []
  experiment_ids_note: >-
    No EXP-* record governs this batch. The frozen contract is the notarized
    pre-registration TASK-20260806-843c40/prereg.md, sha256
    8d00ca3f0977e7367cfd10f4eb01cc0d4d24dfdc1ecf9739ba3cc299ee2a6c80, notarized in
    commit 9cb2d3e28ae7a474edbb116d694969470829e112 before any producer was
    dispatched.
  run_ids: []
  run_ids_note: >-
    No RUN-* index record exists. The twelve producer artifacts (three scripts,
    three raw JSON result files, three reports, three run manifests, at three task
    directories) are snapshot-committed at
    7700090428ae7f8b5dbaaf7bb54a7a253c53fae8 and are cited here by path and by the
    path_sha256 values of the receipt at
    coordination/goals/GOAL-MLKEM-005/batches/BATCH-a44d08/archives/TASK-20260806-f4d678/snapshot-receipt.json.
    The independent Validator (TASK-20260806-7418bc, check AC-1) hashed all 14
    declared paths across both BATCH-a44d08 snapshot receipts and reports 14 of 14
    matching BOTH in the working tree and at the blob level inside commit
    7700090428.

  type: empirical
  direction: neutral
  direction_note: >-
    NEUTRAL, and that is the honest reading rather than a hedge. Nothing in this
    batch supports, weakens or contradicts any hypothesis about lattices, about
    reduction, about the Beta tail law, or about ML-KEM. What it establishes is
    about three instruments and about one basis presentation. Its headline
    verdicts either narrow to algebra (Section A's E_I arm), remain instrument
    outcomes (Section B), or are not admissible as evidence at all (Section C).

  strength: replicated
  strength_basis: >-
    `replicated` is claimed for the INSTRUMENT findings and for the reproducibility
    of the producer measurements, not for any claim about lattices, and the two
    halves are recorded separately because they replicate for different reasons.
    (i) MEASUREMENT REPRODUCIBILITY: the Validator reimplemented Section A from
    prereg sections 2.1/2.5/2.6 WITHOUT reading measure_k.py's measurement code and
    reproduced 288 E_I and 288 V values at max deviation exactly 0.0 (MR-A1), all
    three nulls at 0.0 or exactly (MR-A2), and every one of the 36 E_I and 32 V
    frozen decisions (MR-A3); it rescored all 48 Section B statistics from the raw
    per-draw r values to under 1e-12 (MR-B1) and re-executed both Section C
    falsifying pairs from seeds at max deviation 0.0 (MR-C2). Sections B and C
    additionally reproduce the COMMITTED BATCH-f19c37 record at max deviation
    2.220446049250313e-16 over 448 and 24 values (MR-B3, MR-C3), i.e. against data
    committed in a different batch. The Red Team independently reproduced Section
    C's |t| = 3.6887 and 8.1481 to every reported digit before probing them.
    (ii) THE UNCALIBRATION OF SECTION C IS REPLICATED ACROSS TWO INDEPENDENT
    REVIEWERS USING TWO DIFFERENT NULL CONSTRUCTIONS (see observation OBS-C2), which
    is the single most consequential reason this record is not filed at
    `preliminary`. (iii) NOT replicated, and recorded as such: the AM-4 invariance
    table for E_I, m3 and D is one Red Team session's measurement on its own frames
    (only V's non-invariance is corroborated across batches, by BATCH-f19c37's red
    team); the Validator's Section C null control is 7 single realizations plus 5
    pool resamples at one target and estimates no rate, and the Validator says so
    (limitation L-3).

  claim_tier: toy
  claim_tier_note: >-
    TOY, unconditionally, at d in {100,140}, beta <= 120, k in {30,40,50,70,100},
    q <= 3329, n = 8 draws per arm, N = 2^20 CBD_{eta=2} error vectors, the 2^-10
    quantile only, no reduction beyond LLL. NOTHING in this record bears on ML-KEM
    security, on any FIPS 203 parameter set, on any attack cost, or on any cost
    model. No number here is transported to beta = 606, d = 1420, or to any other
    parameter set by extrapolation or by analogy. All three producers, both
    reviews and the frozen contract state this independently (prereg section 5.2;
    validation_report.yaml claim_boundary; red_team_report.md header).

  certificate_refs: []
  certificate_refs_note: >-
    All three runs declare certificate.kind = none and that is correct: no
    discrete-log solve and no factor-base relation is claimed or produced, so
    docs/claims-and-verification.md requires no solution certificate. The Validator
    confirms this (AC-6). The independent re-verifications the runs do carry are
    instrument checks (Section A's second-code-path recomputation and its k = d/2
    anchor reproduction; Section C's reproduction against the committed
    BATCH-f19c37 results.json) and are labelled as such rather than as
    certificates.

  proof_status: derivation
  proof_refs:
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-a44d08/reviews/TASK-20260806-e43218/red_team_report.md
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-a44d08/reviews/TASK-20260806-7418bc/validation_report.yaml
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-a44d08/tasks/TASK-20260806-3084bc/report_k.md
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-a44d08/tasks/TASK-20260806-843c40/prereg.md
  proof_refs_note: >-
    `derivation` is claimed for exactly one thing: the adverse reading of Section
    A's E_I arm. The Red Team supplies a self-contained algebraic argument a reader
    can check step by step -- for B = [[I_k, A],[0, q I_{d-k}]] and beta <= d-k the
    tail frame is {(-A_S z, z)}, so E_I(beta) = (1/beta) sum_i s_i^2/(s_i^2+1) over
    the singular values of A_S, which equals min(rank(A_S), beta)/beta + O(q^-2) --
    together with two counterexample INSTANCES (q = 1, where the lattice is Z^d and
    the identical curve is returned; rank(A) forced to 10, where the boundary moves
    to beta = 10 and not k = 30) and a two-sided quantitative prediction that could
    have failed and did not (1 - E_I scaling as q^-2 over three decades). The
    Validator's independent q-sweep (CC-4) reaches the same mechanism from a
    different direction. HONEST LIMIT: the probe scripts (rt_secA.py and the
    Validator's scratchpad files) are NOT committed to this repository, so what is
    archived is the written derivation and its reported numbers, not a
    re-executable artifact. This is `derivation` in the sense of
    docs/claims-and-verification.md, never `certificate`, and it is not a
    machine-checked proof. For Section C's uncalibration the basis is
    `empirical_only` in the same document's sense -- two independent null-object
    measurements, no closed-form argument -- and that is stated in observation
    OBS-C2 rather than claimed at a stronger level here.

  validity_verification:
    performed_by: >-
      Coordinator, before interpreting any result, against the producer artifacts
      at snapshot 7700090428ae7f8b5dbaaf7bb54a7a253c53fae8 and the two review
      reports named in proof_refs. Every figure below is quoted from a named
      artifact; none is recomputed by me and none is estimated.
    expected_run_count: >-
      PASS. Three producer tasks, maximum_runs = 1 each, used 1 each. No run was
      repeated, discarded or rescored (Validator AC-7). Section A measured every
      planned cell, every beta, both arms and all three nulls; Section B scored
      exactly the declared family of 12 steps x 4 cells = 48 comparisons; Section C
      scored 10 pairs after the frozen UNREACHABLE rule reduced the realized n_C
      from the declared 12 to 10, with both counts and both Bonferroni critical
      values reported as prereg section 4.3 step 4 requires (Validator MR-C4).
    schema_complete_manifests: >-
      PASS WITH ONE RECORDED GAP, and the gap is not repaired by me. All three
      run_manifest.yaml files parse and carry command, exit status, environment,
      revision and dirty-tree state, seeds, budget and resources, and artifacts.
      TASK-20260806-c973e6/run_manifest.yaml carries NO `inference` block -- its
      inference record exists only in vmatch_report.md section 11 -- and none of
      the three manifests records `model_verified` or a probe status, which the
      AGENTS.md artifact policy requires to be carried into every manifest
      (Validator F-6, L-6). Recorded as an incompleteness, never filled in or
      estimated.
    seed_integrity: >-
      PASS. Section A: all 288 E_I and 288 V values regenerate bit-exactly from the
      declared seed formulas under an implementation written from the
      pre-registration alone (MR-A1). Sections B and C: 448 per-draw r values and
      24 D/V values regenerate against the COMMITTED BATCH-f19c37 record at max
      deviation 2.220446049250313e-16 (MR-B3, MR-C3). Section B located that
      deviation itself rather than rounding it to 0.0: it is confined to d = 140,
      uniform at one ULP across all 28 d = 140 arms, and coincides exactly with a
      one-ULP difference in the deterministic reference divisor
      betaincinv(beta/2,(d-beta)/2,2^-10) under scipy 1.15.3. The relative size is
      2e-16 against a smallest scored quantity of order 1e-4; no verdict moves at
      any reported digit.
    raw_summary_agreement: >-
      PASS. Every statistic in all three reports recomputes from the raw per-draw
      arrays in results_k.json / results_g3.json / vmatch.json rather than from the
      reports (Validator MR-A3, MR-B1, MR-B2, MR-C1). Two prose-versus-computed
      discrepancies exist inside artifacts and both were disclosed by their own
      producers rather than found by review: a sentence inside the immutable
      vmatch.json asserts a Form-1 inversion count of "0 IDENTICALLY" while the
      computed field beside it is right (counts 9/4/4/5), and report_k.md line 520
      conflates the range of V-arm misses over all 32 points with the range over
      the falsified subset. Neither record was edited; both are corrected by
      supersession below and in the producers' own reports.
    control_comparability: >-
      MIXED, AND THIS IS THE BATCH'S DECIDING AXIS. Section A's three nulls (Haar,
      ambient coordinate permutation, block swap) run on the identical code path,
      reproduce bit-exactly under the Validator's own implementation, and behave as
      the frozen text requires (CC-1, CC-2, CC-3). Section B's statistic is robust
      to the one nuisance its design does not resample: over 5 independent error
      pools x 12 steps at (100,40) all 60 statistics are negative, the maximum
      being -0.47 against a +4.2071 threshold (CC-6). SECTION C HAS NO ADMISSIBLE
      CONTROL: its own producer records that no null calibration of the frozen
      falsifier exists in the batch (vmatch_report.md deviation 7), and when two
      reviewers independently built one the falsifier fired on a true null at rates
      one to two orders above its declared level (OBS-C2). An invalid control is
      not a negative mathematical result; it is why Section C's verdict is not
      evidence.
    infrastructure_note: >-
      No timeout, crash, budget exhaustion or missing dependency occurred in any of
      the three runs (Validator AC-7): wall clock 327.6 s of 10800, 28.97 s of
      5400, 16.80 s of 5400; peak RSS 0.04 / 1.26 / 1.19 GiB against 8 / 4 / 4 GiB;
      fpylll 0.6.4 available so no infrastructure branch was taken. Nothing in this
      batch could be, or was, mistaken for negative mathematical evidence. Two
      infrastructure anomalies are recorded and neither touches a measurement:
      Section A's worktree HEAD advanced mid-session by a concurrent branch-sync
      merge (prereg.md byte-identical at all three commits, sha256 unchanged, the
      notarizing commit an ancestor of all three), and two concurrently dispatched
      subagents resolved to the same scratchpad stdout.log path, corrupting one
      progress capture (Section B anomaly A-1; the measurement process, its output
      file and its JSON are unaffected and the run was correctly NOT repeated).

  observations:
  - >-
    OBS-N1 NOTARIZATION IS VERIFIED IN THE STRONG SENSE, INCLUDING THE DIRECTION
    WHOSE ABSENCE LET THE PREVIOUS BATCH'S DEFECTIVE CHECK PASS. The Validator ran
    the chain itself rather than accepting any producer's assertion (NC-1..NC-10):
    sha256 of prereg.md in the tree, of the blob INSIDE the notarizing commit
    9cb2d3e28, and of the producer sidecar all agree at
    8d00ca3f0977e7367cfd10f4eb01cc0d4d24dfdc1ecf9739ba3cc299ee2a6c80; the
    notarizing commit contains exactly three files, all pure additions, and no
    measurement artifact; `git merge-base --is-ancestor 9cb2d3e28 7700090428` is
    TRUE and THE REVERSE IS FALSE -- the check whose omission is recorded as V-7
    against BATCH-f19c37; an introduction census by `git log --follow` shows all
    twelve measurement artifacts introduced by exactly one commit, 7700090428, a
    descendant of the notarization, with no earlier blob of any of them anywhere in
    any branch; and NO early durability commit was made by any producer, which is
    the exact composition defect that got BATCH-f19c37's producer archive rejected
    by tools.research_dispatch.GitRepositoryVerifier. Residue, unchanged and
    restated: git ancestry cannot exclude off-repository pre-computation of the
    frozen thresholds. That is closed by harness structure, not by cryptography.
  - >-
    OBS-P1 ALL THREE PRODUCERS RAN THE FROZEN SPECIFICATION WHERE THEY DISAGREED
    WITH IT, AND NAMED THE DEFECTS THE REVIEWS THEN CONFIRMED. Section A recorded
    objection O-1 against the V arm's own tolerance and ran the frozen rule anyway;
    Section B recorded A-5/O-1 that the positive control's step-selection rule and
    its injection scale are coupled through SE_diff, and ran it anyway, taking the
    frozen INADMISSIBLE branch that its objection predicted; Section C recorded
    that the frozen SE is a between-frame dispersion over ONE shared error pool
    (deviation 6) and that no null calibration of its falsifier exists (deviation
    7), and stated the frozen verdict anyway. Every one of those three disclosures
    is the defect a reviewer then demonstrated. The Validator records this as F-7,
    a commendation load-bearing for its verdict: "The failures below are failures
    of the frozen design, not of execution or of candour." The frozen design is
    mine, and the record says so.
  - >-
    OBS-A1 SECTION A, THE FROZEN RESULT AS COMPUTED. Verdict NEITHER in all four
    cells (100,30), (100,70), (140,40), (140,100). On the E_I arm M-K is falsified
    at 0 of 36 points and M-D at 36 of 36; on the V arm, over the 32 discriminating
    points after the 4 correctly excluded at beta = d/2, M-D is falsified at 32 of
    32 and M-K at 22 of 32. Every count and every per-point decision was reproduced
    by the Validator from an implementation written from the pre-registration alone
    (MR-A3), with per-cell M-K V-falsifications 6/6/5/5. The three nulls behave as
    frozen: the Haar arm returns E_I = k/d (0.2857 to 0.7150), strictly interior and
    nowhere near min(1,k/beta); the ambient permutation returns k/d to within 0.032
    absolute at all 36 points; and the block-swap admissibility test returns
    min(1,k/beta) exactly when scored against the RELOCATED identity block and
    max(0,1-(d-k)/beta) exactly when scored against the old index range, so the
    statistic follows the block and not the coordinate range.
  - >-
    OBS-A2 AND THE E_I HALF OF THAT RESULT IS ALGEBRA, NOT MEASUREMENT. The Red Team
    derived E_I(beta) = (1/beta) sum_i s_i^2/(s_i^2 + 1) over the singular values of
    A_S in closed form and reproduced the measured values to TWELVE SIGNIFICANT
    FIGURES at every beta from svd(A_S) alone, confirmed the implied q^-2 scaling of
    1 - E_I over three decades (16.4x, 15.6x, 16.0x, and 169x against (3329/256)^2 =
    169), and showed the identical curve is returned at q = 1, where B is unimodular
    and the lattice is Z^d -- an object with no q-ary structure and no mechanism M-K
    or M-D can be about, and the object BATCH-f19c37 recorded as P3's
    maximum-departure null. Forcing rank(A) = 10 with k = 30 moves the boundary to
    beta = 10, not to k = 30. So min(1,k/beta) reduces to M-K's prediction exactly
    when A_S has full rank, and "the confinement boundary tracks k" is, at q = 3329,
    the statement that a uniform k x (d-k) matrix over Z_q has full rank. The
    Validator reaches the same deflation independently by a q-sweep it added itself
    (CC-4): at q in {1,2} the measured E_I is 0.8199/0.6503/0.3747 against M-K's
    1.0000/0.8571/0.4000, and by q = 3329 the curve is pinned to min(1,k/beta) to
    1e-7 BY THE PRESENTATION. Its conclusion, which I adopt: M-D was refutable by
    algebra before any datum of this batch existed, and "M-D falsified at 36 of 36
    points at z up to 3e8" carries the weight of an algebraic refutation about THIS
    presentation, not the weight of 36 independent measurements.
  - >-
    OBS-A3 WHAT IN SECTION A IS NOT FORCED, AND SURVIVES. The V arm is two-sided and
    interior at 28 of the 32 discriminating points, and it is where M-K actually
    failed: M-K's "the excess beta - c dimensions spread generically over the
    complement" clause is falsified at 22 of 32 points, with the falsifying misses
    running +2.86% to +32.94% and the largest surviving residual at +1.87% -- a clean
    gap around the 2% floor, so no falsification is a rounding away from surviving
    (Validator item b, enumerated from the raw data). Of the 22, four lie below +5%
    (+2.86%, +3.04%, +4.32%, +4.93%) and the other 18 miss by +5.0% to +32.94%, with
    the largest clustered in the spill window min(k,d-k) < beta <= max(k,d-k). Both
    reviewers uphold objection O-1's factual claim -- prereg section 2.5 justified
    the 2% relative floor by "the <= 2% agreement the closed-form V already shows
    against committed k = d/2 values", and on the five committed anchors the closed
    form actually disagrees by -3.9%, -4.7%, -3.2%, -1.5%, -1.7%, so the floor sits
    below the model's own committed error on three of five -- and the Red Team draws
    the consequence: the small-miss falsifications are inside the model's own error
    budget, while the +20% to +33% spill-window falsifications survive the objection
    and are the section's real content. The Validator additionally computed a
    post-hoc counterfactual on raising that floor, labelled it POST-HOC and
    uncitable under prereg 5.6 and AM-3, and it is NOT cited here as a result or as
    grounds for preferring any repair; the frozen verdict is NEITHER x 4 and that is
    what stands.
  - >-
    OBS-A4 A NOMENCLATURE HAZARD ESTABLISHED BY INTEGER INSPECTION, NOT BY A
    STATISTIC. report_k.md section 3 reads the integer entries of
    IntegerMatrix.random(100,"qary",k=30,q=3329) and finds that fpylll's k counts
    the q-SCALED rows, i.e. |K_q|, while the pre-registration's k counts the
    identity block |K_I|. At k = d/2 the two labellings coincide, which is why no
    committed record could distinguish them. Off the diagonal they are different
    parameters with the same name, and the Red Team (RT-X2) records the consequence:
    any committed record in this goal reading fpylll's k as the identity-block size
    is mislabelled off the k = d/2 diagonal. NOTHING at k = d/2 is affected, so no
    committed number in this goal changes; this is a hazard for successors, and
    Section A is unaffected because it builds its bases explicitly.
  - >-
    OBS-B1 SECTION B'S RESULT IS THAT ITS OWN MANDATORY POSITIVE CONTROL DID NOT
    FIRE, AND BY THE FROZEN CLAUSE THAT IS THE RESULT. prereg section 3.5 freezes:
    "if any cell fails to return AM3-FAIL at c = 6, the AM-3 gate is declared
    INADMISSIBLE for this goal and the demonstration reports that as its result",
    with no verdict on the real arms. d100_b30, d140_b30 and d140_b40 return AM3-TIE
    at every c in {1,2,3,4,6}; only d100_b40 returns AM3-FAIL, at c = 3. The
    Validator reproduced the hardest-step selection (i = 0/7/0/1), the smallest
    firing c (none/3/none/none) and every target statistic (MR-B2). The four PARTIAL
    cell readings are marked WITHHELD by the producer and MUST NOT be lifted out as
    verdicts on the real arms. INADMISSIBLE is an INSTRUMENT outcome and is not
    evidence about lattices in either direction. Recorded beside it, because it is
    the part of Section B that stands: the declared family-wise false-failure rate
    of 0.096 (per-step alpha = 0.002 = P(t_7 > 4.2071245566046755), union bound over
    the declared family of 12 x 4 = 48, valid under arbitrary dependence) is
    correctly derived, was declared before any datum existed, and was recomputed
    independently by the Validator (48 x 0.002 = 0.096, with alpha rederived as
    0.0019999999999982102) and by the Red Team; all 48 realized epsilon_i are
    non-negative with minimum 7.98423e-04, which is the only run-supplied property
    the bound uses; and the realized count was 0 violations of 48 with the largest
    statistic in the family 4.40 below the threshold.
  - >-
    OBS-B2 BUT THE CONTROL WAS MIS-SPECIFIED, AND THE INADMISSIBLE VERDICT DOES NOT
    SHOW THE GATE CANNOT FIRE. Both reviewers reach this independently and by
    different routes. The Validator recomputed the post-injection Delta at c = 6 and
    found it STILL NEGATIVE in the three failing cells (-0.025682, -0.034764,
    -0.007921 against true Delta of -0.037829, -0.045354, -0.017249), so NO
    MONOTONICITY VIOLATION OF ANY SIZE WAS EVER PRESENTED TO THE GATE, and a
    monotonicity gate declining to flag a net decrease is behaving correctly; in the
    one cell where the frozen rule happened to select a near-flat step (d100_b40,
    true Delta = -0.57 SE_diff) the post-injection Delta is a genuine +2.4 SE_diff
    increase and the gate fires at c = 3 (F-2). The Red Team derived the control's
    outcome in closed form -- c_min(i) = 1 + (t_crit*SE_step_i - Delta_i)/SE_diff(t_i),
    reproducing the frozen c = 3/none/none/none exactly -- and applied the identical
    injection at every step: it fires at c <= 6 at 6, 7, 9 and 7 of the 12 steps in
    the four cells, with plateau-median c_min 3.98/2.72/3.76/4.17, all inside the
    frozen c grid; at the SELECTED step |Delta_i|/SE_diff is 18.69/0.57/25.70/11.09,
    so three of four could not have fired at ANY c; and bootstrapping the eight draws
    (B = 20000) gives P(INADMISSIBLE) = 0.997 under the frozen argmax-SE_diff
    lottery, with the observed argmax winning only 0.335 to 0.684 of the time. The
    narrowest true statement, which I adopt from the Red Team: the AM-3 gate's power
    has not been demonstrated at the step the frozen rule selects, and the frozen
    rule selects a step at which no gate of this form could have been demonstrated.
    AM-3 IS NOT RETIRED ON THIS EVIDENCE; retiring a gate whose only demonstrated
    failure is a defect in its own positive control would be premature closure in
    the exact sense docs/inventor-protocol.md section 4 names.
  - >-
    OBS-C1 SECTION C'S FROZEN VERDICT AS COMPUTED, AND IT IS NOT RECORDED AS A
    RESULT. Under the frozen prereg section 4.4 criterion the producer reports "L2
    TAIL-SUFFICIENCY FALSIFIED" on 2 falsifying pairs of 10, under both the declared
    n_C = 12 critical value 3.6358074219539622 and the realized n_C = 10 value
    3.4994832973505026, with 0 SUGGESTIVE pairs and 0 of 10 detection floors below
    the 5% bar (tightest 6.2855%). The Validator confirms every count, every |t|,
    every relative difference, every floor and every informativeness flag (MR-C1),
    and re-executes both firing pairs from seeds at max deviation 0.0 (MR-C2). THE
    COUNTS ARE RIGHT AND THE VERDICT THEY PRODUCE IS NOT ADMISSIBLE EVIDENCE. This
    record does NOT assert that L2 tail sufficiency is falsified, and it does not
    assert that it holds.
  - >-
    OBS-C2 TWO INDEPENDENT REVIEWERS, TWO DIFFERENT NULL CONSTRUCTIONS, ONE
    CONCLUSION: THE SECTION C FALSIFIER IS UNCALIBRATED. This is the most strongly
    supported negative finding in the batch. (a) The Validator built TL versus TL',
    the identical two-level frame with its coordinate support translated by 2 beta:
    V and m3 agree to <= 7.1e-15 at every draw and, under the i.i.d. exchangeable
    CBD error law, the two are the same object up to a coordinate permutation, so
    the proposition under test -- "D depends on the frame only through V" -- is TRUE
    BY CONSTRUCTION and a calibrated falsifier must not fire. Run at ALL 7 scored
    graded targets, not only the two that fired, condition (i) is exceeded at 7 of 7
    (|t| from 5.96 to 27.61 against a 3.6358 bar) and BOTH conditions at 5 of 7; at
    d100_b40 t=0.0075 the null |t| of 24.4 is 6.6x the 3.69 the pair was scored on,
    and the null relative difference of 21.05% EXCEEDS the 17.48% the pair was
    falsified on (CC-8). Resampling the shared error pool over five pools flips the
    SIGN of that scored pair: +17.5%, -6.2%, +29.6%, -5.4%, -11.3%, scoring
    FALSIFYING in 2 of 5 (CC-9). (b) The Red Team built a different null -- two TL
    families on INDEPENDENT RANDOM AMBIENT SUPPORTS at identical u_j, with V and m3
    identical to 1e-16 -- and found 17 of 20 and 13 of 20 disjoint null pairs are
    false falsifications with median null |t| of 11.06 and 11.25, and 24.6%/25.2%
    under the null structure that mirrors the real comparison, against a declared
    per-pair Bonferroni level of 0.0083: a factor of 30 to 100. Re-running the two
    firing pairs on three fresh CBD error samples gives |t| = 1.700, 10.630, 3.375
    for the fragile pair -- not falsifying in two of three. (c) MECHANISM, agreed by
    both and disclosed first by the producer (deviation 6): D is ONE order statistic,
    sort(R)[1023] of a single shared 2^20 pool, and which error vectors land in the
    2^-10 tail depends on the frame's coordinate support; the frozen SE is a
    between-frame dispersion over 8 frames sharing that one pool and omits the
    dominant variance component. The Red Team measures the missing piece directly:
    the between-support sd of D_TL at fixed u_j is 2.54x and 3.20x the pairs' ENTIRE
    reported SE. Consequently condition (i)'s t_7 reference is invalid and condition
    (ii)'s 5% bar is exceeded by pool noise alone -- the null's MEDIAN relative
    difference is 8.4% to 9.0%.
  - >-
    OBS-C3 SECTION B DOES NOT SHARE THAT DEFECT, AND THE ASYMMETRY IS WHY IT IS
    WORTH STATING. The Validator re-ran the identical graded family at (100,40)
    against 5 independent error pools and rescored all 12 steps: all 60 statistics
    are negative and the maximum over everything is -0.47, i.e. 4.68 below the
    +4.2071 threshold, with the frozen-pool row reproducing the recorded values
    (CC-6). Section B's paired statistic compares two frames on the SAME graded path
    at adjacent t, so they are nearly identical and the pool-selection offset is
    common-mode and cancels; Section C's compares two frames from DIFFERENT families
    on different coordinate supports, where it does not. Section B's monotonicity
    reading is therefore robust to the one nuisance the design does not resample.
  - >-
    OBS-C4 WHAT SECTION C DOES NOT TOUCH, IN THE FROZEN TEXT'S OWN WORDS. prereg
    section 4.1 states, and both reviews restate, that Var(e^T P e) = 2*beta +
    (mu_4 - 3)(V + beta^2/d) IS a function of V alone, so L2's derivation is correct
    AT SECOND ORDER and nothing in this batch contradicts it; the open question is
    only whether the 2^-10 tail quantile inherits that, its third cumulant involving
    sum_a P_aa^3 independently of V. Two further scope facts are recorded because
    they bound any future reading: both firing pairs are synthetic-versus-synthetic
    (GR versus TL), and none of the three real-lattice unreduced pairs fires (|t| =
    1.624, 2.103, 2.440), so a claim about LATTICE tail frames is untouched in
    either direction; and the Red Team notes that dD/dm3 spans 8.5x across the ten
    pairs with a sign flip, and 3.7x inside the single cell d100_b40, which a
    third-cumulant law at fixed (d,beta) should not do -- the cheapest discriminating
    check the design omitted.
  - >-
    OBS-X1 THE CROSS-CUTTING RESULT, AND THE MOST CONSEQUENTIAL THING IN THE BATCH:
    UNDER AM-4, NONE OF THESE STATISTICS IS A LATTICE INVARIANT. The Red Team built
    the AM-4 triple on one lattice at d = 100, beta = 40, k = 50, 8 bases, committed
    error sample, N = 2^20, and measured (rt_am4_D.py): under ambient isometry
    B -> BH, E_I moves 1.000000 -> 0.501690, which is k/d, THE HAAR VALUE, and the
    Haar value falsifies BOTH mechanisms; V moves 16.29108 -> 0.42244 (38.6x); m3
    moves 0.33675 -> 0.00145 (232x); and D CHANGES SIGN, +0.053166 -> -0.000495.
    Under a ROW PERMUTATION -- unimodular, the same lattice -- D moves by 13.3%,
    ABOVE Section C's own 5% "practically meaningful" floor, V by 9.1% and m3 by
    6.1x. Under B -> UB the three are near-invariant here (0.4%, 22%, 0.008%), but
    Section A's own A-lll arm IS a B -> UB and moves E_I from min(1,k/beta) to
    0.32-0.39 against k/d = 0.30. Every derived quantity in Section B (r, m(t),
    Delta_i, SE_step, SE_diff, shift_SE, G1, G2) is a function of D or R on a frame
    and inherits D's failure. The obstruction is nameable and the Red Team names it:
    every observable proposed anywhere in this goal is a function of diag(QQ^T) in
    the standard basis, and diag is exactly the object that B -> BH destroys; the
    degree-1 alternative W = sum_{a<=k} P_aa - beta*k/d that EV-MLKEM-94c773 records
    as "the space is not empty" is an affine function of the same diagonal and dies
    for the same reason. All three producers correctly disclaimed AM-4 adjudication
    in advance (prereg section 5.8), so this is not a contract violation; it is the
    measured answer to the fourth next_action of DEC-20260806-14ac13, which asked
    whether an AM-4-admissible statistic exists. Scope, stated exactly: this table is
    ONE red-team session on its own frames at one (d,beta,k), not pre-registered and
    not replicated within this batch. Only V's non-invariance is corroborated across
    batches, by BATCH-f19c37's red team (V moving 9.32 -> 0.27 -> 0.40 under ambient
    isometry on one lattice, quoted in prereg section 1.1) and by the P3 refusal in
    DEC-20260806-14ac13. E_I, m3 and D are single-session measurements here.
  - >-
    OBS-X2 THE PATTERN DEC-20260806-14ac13 RECORDED AT SIX INSTANCES NOW HAS TWO
    MORE, AND ONE OF THEM IS OF A NEW KIND. Section A's E_I arm was scored in the one
    arrangement where its own defect is invisible -- it can only sit at one of two
    algebraic extremes and the construction forces the upper one -- which is the
    seventh instance. Section B's is the eighth AND IS THE FIRST IN WHICH THE
    CONTROL, RATHER THAN THE STATISTIC, IS THE OBJECT WITH THE INVISIBLE DEFECT: the
    pre-registration named two could-not-fail forms, both of the shape "the gate
    cannot fire", and did not name the mirror, "a positive control that cannot pass",
    which is the one it ran in. Both were named in advance by the sections' own
    could-not-fail self-audits and by their producers' objections, and both were
    under-weighted rather than missed. Recorded as an observation about this
    program's method; it is not promoted to knowledge here (see the decision's
    knowledge_promotion) because every instance remains internal to this program,
    which is exactly the sampling that would make the pattern look characteristic
    whether or not it is.

