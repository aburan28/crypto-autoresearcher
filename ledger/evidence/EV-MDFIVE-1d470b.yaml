  observations:
    - id: O-1
      text: >-
        TASK-20260810-3e0793's implementation pin (IMPL-1 hashlib.md5 via
        OpenSSL; IMPL-3 _md5 CPython standalone) was INDEPENDENCE-ESTABLISHED
        by TASK-20260810-23e0ea independently of the producer's claim:
        otool -L shows IMPL-1 linking libcrypto.3.dylib and IMPL-3 linking
        libSystem only; runtime type inspection shows distinct HASH object
        types. IMPL-1 vs IMPL-2 was determined NOT independent (shared
        libcrypto) and is not the pinned pair.
    - id: O-2
      text: >-
        RFC 1321 published vectors were RE-RUN by the validator against both
        pinned implementations: 7/7 pass for each, cross-implementation
        agreement on all 7. The validator's own recalled expected values for
        vectors 5-7 proved wrong and were replaced by a third independent
        path (openssl CLI); the recorded expected values carry provenance
        'recalled' and were never treated as authority.
    - id: O-3
      text: >-
        Throughput reproducibility is PARTIAL: IMPL-1 reproduced within 1%
        (1.239 s vs 1.230 s for the recorded 1000 MiB input); IMPL-2 output
        matches with timing variance from process spawn; IMPL-3 throughput was
        never measured by the producer and remains an OPEN item (SC-5), not a
        negative result.
    - id: O-4
      text: >-
        TASK-20260810-bde128 filed four KN-LIT entries with stated provenance
        levels: KN-LIT-87e00e (Wang et al., ePrint 2004/199) primary text
        obtained and read; KN-LIT-582d77 (Sasaki-Aoki 2009) metadata only;
        KN-LIT-328239 and KN-LIT-d3ec68 abstract obtained and read. The RQ's
        flagged apparent error (an excerpt calling the 2009 result "the first
        PRACTICAL preimage attack") is carried as UNSETTLED with reason
        (primary text unobtainable under the network policy). The source
        "Preimage Attacks on One-Block MD4, 63-Step MD5 and More" is
        unobtainable; no entry was filed for it. The producer's ~6x budget
        overrun is a disclosed budget outcome (SC-4), never evidence about MD5.
    - id: O-5
      text: >-
        The BCP-1 quarantine firewall is INTACT AND ENFORCEABLE in the committed
        tree: no path data in any KN-LIT entry; quarantined payload sha256
        matches; all six manifest-enumerated hashes verified 6/6; BCP-1's exact
        marker present; the pre-registered answer digest recomputes under the
        MANIFEST's stated canonicalization. Corpus staging exclusion of
        coordination/ is structural (the 21 staging globs in
        kb/src/crypto_kb/ingest/repo_corpus.py match only knowledge/, ledger/,
        experiments/, docs/, inputs/), verified by the validator reading the
        committed code.
    - id: O-6
      text: >-
        TASK-20260810-b9d956 (independent red team, session-independent,
        resolved model zai/glm-5.2) verdict on BCP-1's blindness guarantee:
        PARTIAL — real for what it checks, declared for what it cannot check,
        ceremonial for the parametric channel. All five attack surfaces
        succeeded (J1 input-manifest completeness, J2 encoding-provenance
        declaration, J3 canonical serialization, J4 null-object discriminative
        power, J5 certificate independence). Named obstruction: model
        parametric prior knowledge — published MD5 collision paths are in the
        training data of any model this harness can resolve, and no file-system
        mechanism reaches that channel. Two self-attested procedure deviations
        are recorded in the report (a blind_from breach on BCP-1's self_report
        section, impact assessed none_on_derivation; Object C's certificate
        part untested because the md5_collision_pair kind is absent from
        harness/runner.py).

