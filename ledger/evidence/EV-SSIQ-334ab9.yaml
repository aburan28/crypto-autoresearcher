  preregistration_binding:
    specification: experiments/EXP-SSIQ-a85692/specification_v5.yaml
    freeze_commit: 59cfaf39
    verified_by: TASK-20260806-3c6363
    detail: >-
      specification_v5.yaml frozen 2026-08-06 at commit 59cfaf39, after
      TWO pre-freeze Red Team review rounds (round 1: DO-NOT-FREEZE,
      three blocking findings including a hollow-fix risk in the original
      bootstrap_gap_ci_v2 design; round 2: FREEZE-WITH-FIXES, confirming
      round 1's fixes held and finding one further blocking gap, PF-9,
      traced to an error in round 1's own required-fix prose). The
      Validator confirmed manifest.yaml's code.commit equals the freeze
      commit.
  observations:
    - id: O-1
      statement: >-
        GD-11 IS GENUINELY CLOSED, INDEPENDENTLY CONFIRMED BY BOTH
        REVIEWERS VIA RE-EXECUTION FROM SCRATCH, NOT BY TRUSTING A
        PASSING REPORT. Both reviewers independently reproduced the
        contrastive design: ols_loglog_fit_v2 and bootstrap_gap_ci_v2
        correctly reject the N=324/n=3 and N=611/n=6 anomaly cases
        (RT-BATCH-007.md's own named cases), while the frozen, unmodified
        originals silently accept spurious gammas (-0.5, 0.5) on
        identical inputs -- confirmed to reach INSIDE
        bootstrap_gap_ci_v2's own resampling loop, not merely the
        standalone function, closing the exact hollow-fix risk the first
        pre-freeze review round caught before freeze. The Red Team traced
        the precise floating-point mechanism producing the exact -0.5/0.5
        values, ruling out a rigged or coincidentally-convenient test
        construction.
      supported_by: [TASK-20260806-b3c2fc, TASK-20260806-3c6363, TASK-20260806-bf15ab]
      confidence: high
    - id: O-2
      statement: >-
        THE FROZEN CONTRACT'S OWN REQUIRED PART B CROSS-CHECK FAILED ON
        ALL FOUR PRIMES (93/203, 138/324, 234/478, 267/611
        disagreements), AND BOTH REVIEWERS INDEPENDENTLY CONFIRM, FROM
        SCRATCH, WITH THEIR OWN FRESH COUNTER-EXAMPLES (not merely
        re-reading the Executor's own (148,37) trace), that this is a
        SPECIFICATION-AUTHORING DEFECT, not a code bug. Reading
        greedy_descent_hitting_time directly: its "trapped" flag is a
        property of the walk's TERMINAL vertex (wherever the
        non-backtracking strict-descent walk halts), which the function's
        return value never exposes -- not a property of the START vertex
        the frozen contract's cross-check compares against. The Validator
        independently traced the Executor's own (148,37)/p=2437 example
        end to end and confirmed it; the Red Team constructed an entirely
        separate example ((58,996)/p=3889, never used by the Executor)
        and reproduced the identical mechanism.
      supported_by: [TASK-20260806-b3c2fc, TASK-20260806-3c6363, TASK-20260806-bf15ab]
      confidence: high
    - id: O-3
      statement: >-
        THE RED TEAM WENT FURTHER AND FOUND THE DIAGNOSIS IS INCOMPLETE:
        a SECOND, INDEPENDENT boundary-condition defect exists, exactly
        matching the F_p-rational (delta_E=1) vertex count in each
        prime's disagreement total (9/18/18/17 of 93/138/234/267).
        greedy_descent_hitting_time explicitly labels reaching delta_E=1
        as "success" (trapped=False) even at 0 steps (start==terminal),
        while is_structural_local_min trivially flags every delta=1
        vertex True by its own <= definition -- a start-vs-terminal-
        distinct mismatch, since start and terminal ARE the same vertex
        in this case. PRACTICAL CONSEQUENCE FOR ANY FUTURE FIX: naively
        exposing the walk's terminal vertex and comparing it against
        is_structural_local_min for ALL walks (not just trapped: True
        ones) would newly misclassify every SUCCESSFUL walk (15-28% of
        vertices per prime) as a disagreement -- the correct fix must
        restrict the equivalence claim to trapped: True walks only and
        explicitly exclude the delta=1/success case from the comparison.
      supported_by: [TASK-20260806-bf15ab]
      confidence: high
    - id: O-4
      statement: >-
        A NEW DEFECT IS NAMED, GD-12, AGAINST THIS CAMPAIGN'S OWN
        SPECIFICATION-AUTHORING PROCESS -- A GENUINELY NEW CATEGORY,
        DISTINCT FROM GD-6 (a re-read failure), GD-9/GD-10 (a validation
        artifact that cannot fail or doesn't call the right function),
        and GD-11 (a floating-point numerics defect). Here the instrument
        worked exactly as built and failed loudly and reproducibly,
        exactly as this campaign's discipline requires -- the defect is
        upstream, in what the frozen contract told the instrument to
        compare. The Red Team, who wrote the original PF-6 finding in
        this amendment's own round-1 pre-freeze review, re-read that
        text and found it genuinely ambiguous about which vertex "w"
        denotes; the Coordinator's own concretization of that ambiguous
        prose into the frozen contract's operational text
        (is_structural_local_min(start)) silently resolved the ambiguity
        the wrong way. Neither pre-freeze review round constructed a
        concrete multi-step trace to check the claim before freeze --
        notably, round 2 DID apply exactly that "trace it, don't trust
        it" discipline to an adjacent finding (PF-9) in the SAME
        document, but not to PF-6.
      supported_by: [TASK-20260806-bf15ab]
      confidence: high
    - id: O-5
      statement: >-
        THE STRUCTURAL LOCAL-MINIMUM FRACTIONS (0.41-0.47 per prime) AND
        THE GRAPH-REBUILD FIDELITY REMAIN VALID, INDEPENDENTLY CONFIRMED
        BY BOTH REVIEWERS THROUGH FROM-SCRATCH RECOMPUTATION -- the
        cross-check's failure is a comparison-target defect, not a
        defect in how the fractions themselves are computed. Both
        reviewers independently confirmed the rebuilt graph reproduces
        the EXACT original adjacency (not merely a same-count graph) by
        matching the archived greedy_trapped_fraction bit-for-bit for at
        least one prime (2437) -- strong evidence against a
        graph-reconstruction-divergence alternative explanation.
      supported_by: [TASK-20260806-3c6363, TASK-20260806-bf15ab]
      confidence: high
    - id: O-6
      statement: >-
        THE STRUCTURAL LOCAL-MINIMUM FRACTIONS (<50%) VERSUS THE
        WALK-BASED greedy_trapped_fraction (72-85%) IS ITSELF A
        QUANTIFIED, NOW-VALIDATED FUNNELLING SIGNAL, per the Red Team:
        fewer than half of vertices are genuine structural local minima,
        yet the large majority of greedy walks end up trapped somewhere
        -- a real, informative diagnostic about the trapping mechanism's
        shape (many walks funnel onto a smaller set of true local
        minima), though NOT a claim about H-SSIQ-36e970's real-arm
        prediction or about lever L4's viability. The Red Team ranks
        investigating WHICH local minima capture the most walks (an
        in-degree/funnel-structure analysis, already flagged as a
        natural follow-up in execution_report.yaml's own OBS-B3) as the
        most promising specific next question for L4, once GD-12 is
        fixed.
      supported_by: [TASK-20260806-bf15ab]
      confidence: medium
  inference: >-
    GD-11 is closed: independently confirmed by both reviewers to reach
    the exact call path (bootstrap_gap_ci's internal resampling loop)
    that made the original design's fix hollow. PART B's required
    cross-check failed for a reason both reviewers independently
    diagnosed as a specification-authoring defect (GD-12), not a code
    bug and not a mechanism finding: the frozen contract compared the
    walk's start vertex against a claim that only holds for its terminal
    vertex, plus a second, independent boundary-condition mismatch at the
    delta_E=1 success case. The structural local-minimum fractions the
    diagnostic computed remain valid and reveal a real, quantified
    funnelling signal (few structural local minima capture most walks),
    itself a promising lead for a future batch, but establish nothing
    about H-SSIQ-36e970's real-arm prediction or lever L4's status.
  boundaries:
    - >-
      This run makes NO claim about H-SSIQ-36e970, about a delta_E-
      gradient's existence, or about a p^{1/4} algorithm. Lever L4 is
      NOT retired by this record.
    - >-
      GD-12 is a defect in this campaign's own specification-authoring
      and pre-freeze-review process, not in any production code or
      research result. It does not invalidate GD-11's closure (fully
      independent, confirmed by both reviewers) or the structural
      local-minimum fractions (also independently confirmed valid).
    - >-
      The corrected cross-check (restricted to trapped: True walks
      against an exposed terminal vertex, excluding the delta=1/success
      case) has NOT yet been run. GD-12's fix is a named, zero-new-
      search-cost next action, not something this record claims is
      already done.
    - >-
      Evidence strength capped at preliminary, campaign-wide and
      unchanged by this batch: independence remains session-only.
  unresolved_confounds:
    - >-
      GD-12's fix (a corrected cross-check restricted to trapped: True
      walks against the exposed terminal vertex) is UNRESOLVED --
      requires superseding greedy_descent_hitting_time (never editing
      the frozen file) to expose the terminal vertex, the same
      supersede-by-addition discipline ols_hardened.py already
      established for GD-11.
    - >-
      The funnel-structure question (which local minima capture the most
      walks) is UNRESOLVED and is the Red Team's second-ranked next
      action once GD-12 is fixed.
    - >-
      Model independence remains absent and unverifiable in this
      environment, unchanged from every prior batch.
