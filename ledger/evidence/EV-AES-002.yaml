  headline_non_result: >-
    THIS BATCH PRODUCED NO CRYPTANALYTIC RESULT AND NO CLAIM ABOUT AES OF ANY
    KIND, AT ANY ROUND COUNT. No distinguisher, no key recovery, no speedup, no
    measured structural excess, and no barrier statement about AES is asserted
    here. What exists is: (A) two independently recomputed negative
    mathematical facts about the algebra of AES components, archived as a
    standalone derivation note, plus one proved closure (PROP-701-I) whose own
    falsification gate was found NON-DISCRIMINATING as specified; (B) a
    repaired mutation-control instrument that closes H-1 and H-3 and that an
    independent session showed is STILL ESCAPABLE on an uncovered coverage axis
    (ER-6); and (C) three self-contained measurements on a small-scale
    AES-shaped SPN at 3-, 4- and 5-bit cells, comparing two implementations
    both written inside TASK-20260731-703. Zero cryptanalytic compute was spent
    on AES itself.

  strength_scoping: >-
    `replicated` is scoped STRICTLY to three items, each of which a session
    that did not author it re-executed and, where applicable, recomputed by its
    own independent method: (A) the two derivation facts of
    derivation_note_column_local_obstructions.md, now recomputed in three
    sessions (TASK-20260731-604 validation, TASK-20260731-704 coordinator-side
    corroboration, TASK-20260731-705 re-execution PLUS independent
    recomputation by a different method); (B) the byte-identical reproduction
    of repair_receipt.json (results_digest 9bee94de...47d7) from committed
    source in an independent session; (C) the bit-for-bit reproduction of all
    54 GATE-601-B measurement runs from committed source after an independent
    rebuild. It attaches to NO claim about AES at any round count.
    It does NOT attach to: the closure status of PROP-701-I (see A-9 to A-12);
    the bound on what a green from mutation_control_v2.py certifies (B-5); or
    any interpretation of the 0.0444 counted ratio as a cost statement (C-6 to
    C-9). Cross-model independence is unavailable throughout: every producer,
    the validator and the Coordinator resolve to the same model under
    inference-amendment 0137a051.

  # =====================================================================
  # THREE SEPARATE VERDICTS, KEPT DISTINGUISHABLE AND NOT AVERAGED.
  # A sound derivation note does not validate the gate run; a defect in the
  # harness repair does not touch either of the others. The validator issued no
  # combined verdict by design, and none is manufactured here.
  validator_verdicts:
    check_a_derivation_and_ideation: >-
      passed, with defects (D-705-1 medium; D-705-2, D-705-5 low; D-705-3,
      D-705-4 informational). Promotion fitness of the derivation note as a
      STANDALONE artifact: FIT at the `derivation` tier.
    check_b_harness_repair: >-
      passed, with a NEW OPEN ESCAPE ROUTE found by the validator
      (ER-6 / D-705-7, medium; D-705-8 low). H-1 and H-3 closed as claimed;
      H-2, H-4 and ER-5 correctly remain open.
    check_c_gate_601b: >-
      passed, with four cost-accounting defects (D-705-9, D-705-10, D-705-12
      low; D-705-11 informational). No struck-claim scope violation found
      anywhere in the TASK-20260731-703 artifacts.
    combined: not_issued_by_design

  # =====================================================================
  observations:

    # ---- (0) EVIDENCE INTEGRITY -----------------------------------------
    - >-
      Z-1. The producer snapshot commit ebac9ba8a52b05bbd434edac715271e404d8e104
      (parent 98ae8539c9cbb8c3a261ceab83536069c9947253) was verified against Git
      in the independent TASK-20260731-705 session before any finding was
      recorded: reachable from HEAD (git merge-base --is-ancestor), expected
      parent (git rev-parse ebac9ba8^), exactly the 10 declared paths all with
      status A (git diff --name-status), and 9 of 9 committed blob SHA-256
      digests matching source_path_sha256 in the TASK-20260731-704 receipt. Two
      digests cross-check independently against digests asserted inside the
      producers' own manifests (gate_601b_impl.c dc2bc3fe..., recorded in
      gate_601b_results.json artifacts.implementation_sha256;
      mutation_control_v2.py d2b2a5dd..., recorded in repair_receipt.json
      control_source_sha256). The refutation-artifact ordering required by
      docs/claims-and-verification.md is therefore satisfied for this batch:
      the derivation note was COMMITTED and INDEPENDENTLY REVIEWED before this
      record and before the decision relying on it.
    - >-
      Z-2 DEFECT D-705-6 (low). The TASK-20260731-704 snapshot receipt still
      carries commit_sha: null and parent_sha: null; the follow-on write it
      prescribes for itself did not occur. Not blocking: the digest binding is
      complete and was verified against Git independently.
    - >-
      Z-3. Inference-block audit by the validator: 7 of 9 producer artifacts
      carry a filled block. The two gaps are the source files
      mutation_control_v2.py and gate_601b_impl.c, which are the subject of
      referred defect D-704-1. Every block in this batch records
      model_verified: false — `python3 -m orchestration.adapter doctor --probe`
      was run by nobody, so every resolved_model_id in BATCH-002 is unverified
      configuration in the sense of AGENTS.md "Model policy".

    # ---- (A) DERIVATION NOTE AND IDEATION -------------------------------
    - >-
      A-1 (scope statement, load-bearing). Observation group A concerns the
      ALGEBRA OF AES COMPONENTS and the quality of an ideation package. It is
      DERIVATION content, not measurement of a cipher. Nothing in it is a
      cryptanalytic claim, a distinguisher, or a barrier statement about AES
      security, and it may never be upgraded into one.
    - >-
      A-2. The derivation note is SELF-CONTAINED. The validator read it treating
      EV-AES-001, TASK-20260731-604 and aes_reduced.py as unavailable and found
      no step depending on them: the field, the reduction polynomial 0x11B, the
      matrix M, the Inv(0)=0 convention, the bit definition of A, the constant
      0x63, the difference convention and the definition of collinearity are all
      stated in the note; the section 2.1 order derivation, the section 2.4
      Burnside computation with its stratified cross-check, the section 3.1
      two-case argument and the section 3.2 hand-checkable counterexample all
      close on the page. Its only external dependency is script claim C0, which
      the note already declares optional. Appendix A is declared non-load-bearing
      and the validator confirmed neither proposition uses it.
    - >-
      A-3. verify_derivation.py re-executed from the committed blob
      (9618f55f...4951) in the independent session: SUMMARY 16 PASS, 0 FAIL,
      1 SKIP of 17 claims, exit 0, over two runs. C-TAB, C1, C2, C3, C4, C5,
      C6a, C6b, C6c, C7a, C7b, C7c, C8, C9, C10 and C11 all PASS. C0 alone
      SKIPs.
    - >-
      A-4. INDEPENDENT RECOMPUTATION by the validator's own method (its own
      shift-and-add GF multiply, brute-force inverse by search, its own Gaussian
      elimination, its own seeds; no code or constants taken from the producer's
      script) reproduced every fact in both propositions with NO DISCREPANCY
      ANYWHERE: ord(M) = 4 by two independent methods (matrix power iteration,
      and the order of c(y) = 02 + 03y + y^2 + y^3 in F[y]/(y^4+1)); the orbit
      of e1 = {(01,00,00,00), (02,01,01,03), (05,00,04,00), (0e,09,0d,0b)}, size
      4; kernel dimensions 4, 1, 2, 1; nonzero fixed-vector counts 4294967295,
      255, 65535, 255; orbit-count lower bound 1073741824; exact Burnside orbit
      count 1073758335 with the stratification 255 + 32640 + 1073725440;
      |GL(4,GF(2^8))| = 338947946628913982763966439819837440000 with ratio
      4/|GL| = 1.180e-38; Inv(lambda v) = lambda^-1 Inv(v) with 0 failures over
      ALL 65280 (lambda, x) pairs INCLUDING the 255 at x = 0, and 0 failures at
      vector level over 20000 seeded draws with zero coordinates over-sampled;
      the L counterexample L(01,00,00,00) = (7c,63,63,63) versus
      L(02,00,00,00) = (5d,63,63,63) with no scalar in GF(2^8)* relating them;
      and 0 of 4000 non-constant collinear pairs surviving L.
    - >-
      A-5. BOTH ADDITIONS BEYOND BATCH-001 ARE CORRECT. Corollary 2.2 (the
      constant-vector family on which L DOES preserve collinearity) was verified
      exhaustively and independently: 64262 preserved / 508 degenerate / 0 broken
      over all 255*254 = 64770 pairs (a, lambda). It is LOAD-BEARING, not
      decorative: without it Corollary 2.1 as stated would be false as a
      universal, and the non-constant sampling in claims C7a/C7b would be an
      unexplained exclusion. The section 3.5 scope limit — that neither
      proposition says anything about difference propagation through SubBytes,
      since S(x+d) + S(x) is not a function of d — correctly bounds the note,
      and the validator searched for and did not find a sentence elsewhere in
      the note that over-reads across that boundary.
    - >-
      A-6. proof_status: derivation is HONEST, and the scope statements are
      honest. The validator confirmed the note contains no distinguisher, no key
      recovery, no complexity claim and no measured structural excess; that it
      is not a barrier statement about AES security; and that it is careful in
      the other direction too — section 0.2 item 3 states Proposition 1 restores
      column-local objects to status OPEN, "strictly weaker than either 'closed'
      or 'promising'".
    - >-
      A-7 RULING ON REFERRED DEFECT D-701-1. The TASK-20260731-701 completion
      gate asked the PRODUCER to transcribe the invocation and output of
      verify_derivation.py. The producer had no execution tool, refused to
      fabricate a transcript under AGENTS.md rule 9 (correct conduct, not a
      defect), and labelled the note "machine recomputation pending". The
      independent validator ruled the gate DISCHARGED BY SUBSTITUTION AT A
      HIGHER STANDARD: re-execution from committed source plus independent
      recomputation by a different method serve the gate's purpose, and an
      independent session that did not author the note is strictly stronger than
      a producer transcript. The gate's LETTER remains unmet and is recorded as
      such rather than back-dated; the note is NOT edited (records are
      immutable). The ruling explicitly does not rest on the dispatching
      session's own run (CORROB-704-1), which is Coordinator-side corroboration
      of an artifact it was archiving.
    - >-
      A-8 DEFECT D-705-2 (low, residual of A-7). Claim C0 alone still SKIPs:
      verify_derivation.py loads the BATCH-001 harness via spec_from_file_location
      / module_from_spec / exec_module WITHOUT inserting the module into
      sys.modules first, so @dataclass resolution raises
      "AttributeError: 'NoneType' object has no attribute '__dict__'". One line
      (sys.modules[spec.name] = mod before exec_module) fixes it. Script defect,
      not a harness defect. C0's INTENT was covered independently: the validator
      loaded the committed harness with sys.modules registered and confirmed
      against its OWN constants that aes_reduced.AES_MIX equals the note's M,
      that the harness S-box equals its own L(Inv(x)) for all 256 inputs, that
      the harness GF inverse equals its own brute-force inverse for all 256
      inputs, and that the harness MixColumns matrix has multiplicative order 4.
    - >-
      A-9. IDEATION OUTCOME: NO_ADMISSIBLE_NEXT_MECHANISM, 0 candidates admitted
      from 8 enumerated objects (OBJ-701-1..8). All 8 name a concrete tracked
      object on a named byte set at a named round count, and the byte set is a
      ShiftRows diagonal in every applicable case — genuinely super-box-level
      with ShiftRows outside the tracked word, not relabelled column-local
      objects. dominated_by: n/a with written justification (nothing is claimed,
      so nothing can be dominated) and sota_delta: 0 bits on every axis at every
      round count 3-7. The validator judged the outcome a CLOSURE at the
      docs/inventor-protocol.md section 4 standard and NOT a fatigue report, and
      recorded that the record explicitly declines to claim "the super-box lane
      is mined". CANDIDATES JUDGED TO BE A REDISCOVERY PRESENTED AS NOVEL: NONE
      — the producer volunteers OBJ-701-3 (truncated differential), OBJ-701-4
      (Demirci-Selcuk multiset fingerprint) and OBJ-701-5 (Super-Sbox / rebound)
      as rediscoveries itself, and the validator's independent identification
      attempt agreed on every object.
    - >-
      A-10. PROP-701-I ("a round-independent per-super-box-word projection that
      propagates deterministically across the AES super-box interface
      Phi = ARK.MC.SR is either injective or constant") has a COMPLETE AND
      CORRECT PROOF. The validator worked all three steps: Step 1's
      one-contributed-coordinate count under ShiftRows offsets (0,1,2,3); Step
      2's upgrade to global invariance, which consumes the every-entry-nonzero
      property of M (independently verified) and where ROUND-INDEPENDENCE IS
      CONSUMED EXACTLY ONCE; and Step 3's iteration over the (lambda, k) graph,
      which the validator independently verified strongly connected. The proof
      never touches SubBytes, so the obstruction is entirely in the linear
      interface.
    - >-
      A-11 DEFECT D-705-1 (MEDIUM). The validator RAN GATE-701-C, which
      TASK-20260731-701 specified but could not run. On the AES-shaped M4 over
      GF(2^4) the gate reads 65535/65535 kernels closing to dimension 16 — PASS
      as predicted, confirming PROP-701-I's engine exhaustively in the analogue.
      BUT null_2 (the circulant with first row (02,00,01,01)) ALSO reads
      65535/65535 at dimension 16 — the SAME reading as the target — which fires
      the gate's OWN PRE-DECLARED VOID CONDITION ("VOID if EITHER null object
      returns the same verdict as the AES-shaped matrix"). Additionally null_1's
      predicted stall dimension is 4 in the report and 1 in measurement. Cause,
      and the general lesson: "every entry nonzero" is a SUFFICIENT hypothesis
      of Step 2, not a necessary one, so negating it need not change the
      conclusion — a null built by negating a sufficient hypothesis is not
      automatically a discriminating null. Mitigating: null_1 DOES discriminate
      sharply (dim 1 vs dim 16), structurally rather than on a byte-activity
      pattern — the gate never touches the S-box, which is the direct repair of
      EV-AES-001 defect I-3 — and it is the report's designated sensitivity
      anchor.
    - >-
      A-12 DEFECT D-705-5 (low). PROP-701-I does not name two scope holes:
      (i) word-position-dependent families pi_0..pi_3 within a single layer,
      which is neither OD-1 (layer-dependence) nor OD-2 (multi-word domain) and
      which breaks the index bookkeeping of Steps 1-2; and (ii) restriction of
      the "for EVERY state s" quantifier to a structured subset of states.
      Neither invalidates any step; both narrow the closure. Related informational
      defects: D-705-3 (the note's phrase "1073758335 independent binary choices"
      is loose; the number is an orbit count, as the note itself states two lines
      later) and D-705-4 (PROP-701-I's OD-1 text describes the argument as
      iterating "an unbounded number of times", overstating the cost of
      re-application; the substantive point that layer-dependence breaks the
      proof is correct).
    - >-
      A-13. PROP-701-I is SELF-LABELLED a probable re-derivation of known limits
      on AES subspace trails, marked unverified_from_memory at recall confidence
      LOW-MEDIUM. The validator can neither confirm nor refute that recall: no
      primary source is reachable, and its own similar recollection is likewise
      unverified-from-memory and settles nothing. Novelty against the external
      literature is UNRESOLVABLE in this environment.

    # ---- (B) HARNESS REPAIR — A REPRODUCIBILITY FACT, NOT A RESULT ------
    - >-
      B-1 (scope statement, load-bearing). Observation group B concerns an
      INSTRUMENT. A repaired mutation control is a REPRODUCIBILITY FACT. It
      supports no claim about AES, demonstrates no speedup, certifies no
      cryptanalytic measurement, and may never be upgraded into empirical
      cryptanalytic evidence about the cipher.
    - >-
      B-2. repair_receipt.json REPRODUCES BYTE-IDENTICALLY from committed source
      in the independent session: exit 0, 2.0 s, 0 bytes stderr, verdict pass,
      all five verdict components true, results_digest
      9bee94dedb259f8642adcf01d36bec6fa4488aec69a1e4e2cf7507129f3947d7 equal to
      the producer's recorded digest.
    - >-
      B-3. H-1 IS CLOSED BY REMOVAL, NOT NARROWED. The self-check detection path
      is deleted; the only route to detected: true is
      (comparisons_executed > 0) and (divergences > 0), with mutants run in a
      separate subprocess and all reference ciphertexts computed in the parent
      before any mutant runs. The validator re-injected BOTH known failure shapes
      IN ITS OWN TEXT — an import-time AssertionError unrelated to the fault, and
      an import-time AttributeError — plus four shapes of its own devising:
      ZeroDivisionError, KeyboardInterrupt (a BaseException other than
      SystemExit), os._exit(0) without writing the output file, and a forged
      runner output file. EVERY SHAPE FAILS CLOSED: detected: false, null
      detection mechanism, 0 comparisons, non-passing verdict. No manufactured
      detection was found.
    - >-
      B-4. H-3 IS CLOSED AS CLAIMED. Each of five new reduced-round mutants is
      detected by a comparison performed at r < Nr, per-regime rather than
      aggregated. RR4 (final round key drawn from the untruncated schedule)
      diverges 128/128 at r < Nr and 0/36 at r = Nr, flagged
      invisible_at_full_rounds: true — invisible at full rounds BY CONSTRUCTION,
      which is exactly the BATCH-001 blind spot. The semantics-preserving no-op
      mutant scores detected: false after 164 EXECUTED comparisons with 0
      divergences, so the green is falsifiable rather than automatic: the
      control discriminates.
    - >-
      B-5 DEFECT ER-6 / D-705-7 (MEDIUM, NEW, OPEN, NOT REPAIRED). A NEW ESCAPE
      ROUTE found by the validator, not by the producer. build_tasks() generates
      final_mix_columns=True ONLY for 16-byte keys
      ("for fmc in (False, True) if klen == 16 else (False,)"). The validator
      injected a fault active exactly in the complementary regime
      (final_mix_columns=True with key length != 16), confirmed by direct
      ciphertext comparison that the fault is REAL and regime-confined (24-byte
      key, 4 rounds, fmc=True: ciphertext differs; all tested 16-byte-key and
      fmc=False cases: identical), and ran the full control against that module:
      VERDICT PASS WITH ALL FIVE COMPONENTS TRUE ON A DEMONSTRABLY BROKEN
      MODULE. This is the H-3 failure shape — a bug living in a regime the
      comparison never enters — RECURRING ON A DIFFERENT AXIS INSIDE THE REPAIR
      THAT CLOSES H-3. It is a coverage escape, not a scoring bug: the receipt's
      claims are not falsified, but the bound on what a green certifies is not
      written down. The cheap fix is one line in build_tasks(): generate
      fmc in {False, True} for all three key lengths. The validator did not
      apply it (repair is not the validator's role).
    - >-
      B-6 DEFECT D-705-8 (low). Neither repair_receipt.json nor repair_report.md
      states the (key length x final_mix_columns) coverage boundary of the task
      set, so a reader cannot see from the artifacts which regimes a green
      covers. The receipt's task_sets block reports
      final_mix_columns_variants_covered: [false, true] without the key-length
      qualification. checks_not_run documents other boundaries carefully; this
      one is absent.
    - >-
      B-7. THE COMPARISON TARGET ESTABLISHES SENSITIVITY ONLY. Reduced-round
      mutants are compared against TARGET-REF = RefAES, a second implementation
      authored INSIDE the same task by the same agent from the same prose
      convention, anchored to pycryptodome at r = Nr (8/8 at each of 128/192/256
      bits). The validator's assessment: it establishes that the comparison
      machinery reacts to round-structure perturbation at r < Nr and that two
      structurally different implementations of the same WRITTEN convention
      agree; it does NOT establish that conventions C1/C2/C3 are correct,
      standard, or used anywhere else, and a shared misreading of the prose by
      the one agent that wrote both implementations is invisible to it. The
      circularity is IRREDUCIBLE in this environment and the producer states it
      unprompted in comparison_targets.TARGET-REF.does_not_establish and in
      repair_report.md section 6. One structural mitigation recorded in the
      repair's favour: RR1-RR5 each perturb a DIFFERENT truncation-convention
      axis, so a shared misreading on any of those five axes would surface as an
      undetected mutant; the circularity bites only on axes no RR mutant covers,
      which is exactly where ER-6 lives.
    - >-
      B-8. H-2, H-4 AND ER-5 CORRECTLY REMAIN OPEN. H-2 (the module's
      import-time self-check is an assert, stripped under python3 -O) is
      RECORDED, NOT REPAIRED: removing the self-check DETECTION path narrows its
      practical impact in this control but the module-level weakness is
      unchanged. H-4 (the reduced-round path has no external reference and cannot
      obtain one) STANDS AND IS NOT CLAIMED REMOVED. ER-5 (a mutant can hide its
      own fault, producing a false NEGATIVE, never a false green) is carried as
      open by design. The validator searched all three artifacts for any sentence
      claiming H-2 or H-4 closed, removed, mitigated or superseded, and found
      none. No BATCH-001 committed artifact was modified in place (confirmed by
      git diff --name-status: ten paths, all added, none under BATCH-001).

    # ---- (C) GATE-601-B — MEASUREMENTS ON A SMALL-SCALE AES-SHAPED SPN --
    - >-
      C-1 (scope statement, load-bearing). Observation group C concerns a
      SMALL-SCALE, AES-SHAPED SPN with 3-, 4- and 5-bit cells on a 4x4 cell
      state, five rounds, no key schedule, defined in full in gate_601b_impl.c.
      IT IS NOT AES. Nothing in this group is a statement about AES at any round
      count, about full-round AES, or about the security of any deployed system.
      Every quantity below is a property of THE TWO IMPLEMENTATIONS WRITTEN
      INSIDE TASK-20260731-703 at the widths actually run.
    - >-
      C-2. All 54 measurement runs REPRODUCE BIT-FOR-BIT. The validator
      extracted the committed source (dc2bc3fe...89f3), rebuilt it clean under
      -Wall -Wextra (0 bytes stderr), re-ran it (~273 s against the recorded
      272.969 s) and compared its own runs array field by field against
      raw_measurements.runs excluding only wall_clock_seconds: 0 of 54 differ,
