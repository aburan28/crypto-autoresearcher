  # =====================================================================
  inference: >-
    Three findings, deliberately not merged. (A) Two elementary negative facts
    about the algebra of AES components now exist as a self-contained, committed,
    independently re-executed AND independently recomputed derivation note, whose
    proof_status label and scope statements the validator judged honest and which
    it returned FIT for standalone promotion. That is the checkable refutation
    artifact DEC-20260731-011 deliberately deferred, and it is the promotable
    output of this batch. The same task also produced a proved closure,
    PROP-701-I, whose proof an independent session checked step by step and
    found complete and correct, and whose AES-shaped case that session confirmed
    exhaustively in a GF(2^4) analogue — but whose PRE-DECLARED FALSIFICATION
    GATE IS VOID ON ITS OWN TERMS, because the second null was built by negating
    a sufficient rather than a necessary hypothesis. A closure whose declared
    control apparatus does not discriminate is not yet a closure this program
    should make official, even when the proof under it holds. (B) The instrument
    is repaired where it was broken and is still escapable where nobody looked:
    H-1 is closed by removal rather than narrowing and survived six independent
    injection shapes; H-3 is closed with a per-regime, r < Nr-verified detection
    and a working no-op control; and yet a demonstrably broken module earns a
    full green on an uncovered (key length x final_mix_columns) axis. ER-6 is
    the same failure shape as H-3 recurring inside the repair for H-3, which is
    the honest lesson: coverage escapes are not closed by fixing the last one
    found. (C) Three self-contained measurements stand and reproduce bit-for-bit,
    with a genuinely discriminating null control and no struck-claim leakage;
    their counting convention is substantially symmetric with two named
    asymmetries that move the magnitude by tens of percent and reverse nothing,
    and the 46x memory ratio that belongs beside the 0.044 operation ratio is
    derivable but untabulated. NOTHING IN ANY OF THE THREE IS A CRYPTANALYTIC
    RESULT OR A CLAIM ABOUT AES AT ANY ROUND COUNT.

  boundaries:
    - >-
      NO cryptanalytic result and NO claim about AES of any kind, at any round
      count, is asserted by this record. No distinguisher, no key recovery, no
      speedup, no structural excess, and no barrier statement about AES.
    - >-
      Nothing here concerns full-round AES (10/12/14 rounds), AES-NI-deployed
      AES, or the security of any system that uses AES. Claim tier is toy /
      reduced-round, as ceilinged by RQ-AES-001 and GOAL-AES-001.
    - >-
      Group A is scoped to the algebra of the AES MixColumns matrix acting on
      ONE COLUMN of GF(2^8)^4 and to the byte-wise maps composing SubBytes.
      Proposition 1 concerns the group generated on a column by the column-local
      linear operations and says nothing about the group generated by the round
      function on the whole 128-bit state. Proposition 2 is a statement about
      VALUES, not about difference propagation through SubBytes. PROP-701-I is
      scoped to ROUND-INDEPENDENT, SINGLE-WORD, SINGLE-STATE, DETERMINISTIC
      per-word projections; layer-dependent families (OD-1), multi-word domains
      (OD-2), set-valued objects (OD-3) and probabilistic / bounded-branching
      propagation (OD-4) are NOT covered, and per D-705-5 two further classes —
      word-position-dependent families within a layer, and restriction of the
      "for every state" quantifier — are not covered and were not named.
    - >-
      Group B is scoped to mutation_control_v2.py as committed in ebac9ba8, to
      the eight fault mutants, one no-op mutant and four injected failure probes
      actually run, to the 36 full-round and 128 reduced-round tasks actually
      generated, and to the recorded seeds. A GREEN FROM THIS CONTROL DOES NOT
      CERTIFY aes_reduced.py IN REGIMES THE TASK SET NEVER GENERATES — in
      particular final_mix_columns=True with 24- or 32-byte keys (ER-6), where a
      demonstrably broken module was shown to earn a full green. The
      reduced-round comparison target establishes SENSITIVITY only, never
      convention correctness; H-4 stands.
    - >-
      Group C is scoped to a small-scale AES-shaped SPN at 3-, 4- and 5-bit
      cells with the declared definitional choices (round 4 carries no
      AddRoundKey; no key schedule; MixColumns (5,2,1,1) at n=3 rather than the
      AES-shaped row; field polynomials 0x0B / 0x13 / 0x25), to the two
      aggregation implementations written inside TASK-20260731-703, to the
      unweighted four-class counting convention, and to the 54 runs actually
      executed at seed_base 20260731. The counted ratio is a COUNTED quantity
      under a stated convention, not a cost model and not a timing; the direction
      is robust to plausible reweighting and the magnitude is not.
    - >-
      NO INDEPENDENT REIMPLEMENTATION of the GATE-601-B aggregations was
      written; budget did not permit it. The correctness check for group C is
      exact reproduction of the producer's comparison plus source reading of both
      aggregations, not a third implementation. The exploratory development
      sweep referenced in run_record.md section 9.1 was not re-run and is
      outside this validation.
    - >-
      Every literature statement anywhere in this batch, on every side, is
      UNVERIFIED-FROM-MEMORY: eprint.iacr.org, csrc.nist.gov and arxiv.org are
      unreachable and zero primary sources were read by any participant. Novelty
      against the external literature was not, and in this environment cannot
      be, settled. Two agreeing recollections are not a citation.
    - >-
      CROSS-MODEL INDEPENDENCE IS UNAVAILABLE. Under inference-amendment
      0137a051 all three producers, the validator and the Coordinator resolve to
      the same model; independence in BATCH-002 is in SESSION ONLY, never in
      MODEL, and the validator states plainly that this BLOCKS ANY GOAL-CLOSURE
      ATTESTATION FROM ITS SESSION. No attestation is recorded anywhere in this
