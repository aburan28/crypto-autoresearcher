    producer_snapshot_commit: ebac9ba8a52b05bbd434edac715271e404d8e104
    snapshot_parent: 98ae8539c9cbb8c3a261ceab83536069c9947253
    prior_verified_ledger_archive: eb72cac7667e60a15a311a1c0d3d2137e79d186b
    inference_amendment_commit: 0137a051eb5828789eb267fa83c8278086578d4c
    ledger_commit: >-
      Bound by the dispatch verifier after the TASK-20260731-706 commit; a
      commit's own SHA is never written into an artifact inside that commit.
  id_provenance: >-
    This record's ID was verified free and UNCHANGED by CORR-20260731-008:
    EV-AES-001 was the only EV-AES-* record on the merged tree, so this
    reservation was never in collision. The sibling decision ID was reallocated
    (DEC-20260731-004 -> DEC-20260731-025) and the knowledge target was
