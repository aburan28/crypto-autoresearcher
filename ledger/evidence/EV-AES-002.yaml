    - >-
      C-3 YIELD 1, CORRECTNESS EQUIVALENCE: CONFIRMED, and the comparison is
      EXACT rather than digest-only. Surviving-key bitmaps are compared with
      memcmp over the WHOLE guess space; the FNV-1a-64 digest is recorded in
      addition to, not in place of, that comparison. 54/54 runs byte-identical
      bitmaps and identical digests; the true key survives under both
      aggregations in 54/54; the 3-round balance self-check passes 54/54. The 24
      runs at the fully enumerable 2^16 instance cover 8 distinct keys under each
      of three S-box variants.
    - >-
      C-4 YIELD 2, S-BOX INDEPENDENCE UNDER THE NULL CONTROL: CONFIRMED, with
      both ratios recomputed by the validator from its own run. Relative
      difference between the algebraic-S-box mean and the pooled
      random-bijection null: 1.48e-05 (n=3), 7.69e-08 (n=4), 3.03e-08 (n=5), all
      far inside the declared 1% tolerance. At n=4 and n=5 the between-S-box
      difference is SMALLER than the key-to-key spread under a fixed S-box
      (7.69e-08 vs 6.00e-06; 3.03e-08 vs 2.84e-07). The reorganized side's
      counted total is exactly constant across every key and every S-box variant
      at each width, so all residual movement is on the direct side's single
      data-dependent counted site. The null object is of the same shape (a
      freshly drawn seeded random bijection, two independent draws, everything
      else unchanged) and the reported quantity behaves as predicted under it —
      the reorganization is algebraically S-box-agnostic, so invariance is the
      prediction and invariance is the measurement. No quantity fails to decay
      when a parameter meant to destroy it is applied.
    - >-
      C-5 YIELD 3, MEASURED COUNTED RATIO: CONFIRMED. At the 2^16 instance
      (n=4), direct total 1546650864 (table_lookups 778568312, xors 768082488,
      adds 0, muls 64) against reorganized total 68625045 (table_lookups
      35524949, xors 69888, adds 31719424, muls 1310784), giving
      68625045 / 1546650864 = 0.0443700945; mean over the 24 runs at that width
      0.044370098214. Validator-recomputed means at the other widths:
      0.106511676496 (n=3) and 0.016585171831 (n=5). These are MEASUREMENTS AT
      THE WIDTHS RUN against a baseline implemented in the same task and run on
      the same inputs. No scaling law is fitted, no crossover is predicted, and
      nothing is extrapolated to any other cell width.
    - >-
      C-6. THE COUNTING CONVENTION IS SUBSTANTIALLY SYMMETRIC, verified by
      source reading rather than by trusting the producer's symmetry_demonstration
      field: all counted sites on both sides go through the same four macros
      (C_TL, C_XR, C_AD, C_ML) through one global pointer retargeted per
      implementation; each aggregation zeroes its own counter struct on entry and
      clears the pointer on exit; build_G() is LITERALLY THE SAME FUNCTION called
      by both sides, contributing 128 counted ops to both at n=4, with
      ops_direct_precompute_total equal to exactly that; both sides consume the
      same N0 tables and sweep the full guess space per structure; and the shared
      preprocessing outside both counters is outside BOTH, not charged to one.
    - >-
      C-7 DEFECT D-705-9 (low). ASYMMETRY 1: the integer division at
      gate_601b_impl.c:469 (P[k] / n4, executed 1310720 times per run at n=4) is
      a data operation on the reorganized side that falls outside all four
      declared counting classes and is therefore uncounted. Charging it at
      weight 1 moves the ratio 0.04437 -> ~0.04522.
    - >-
      C-8 DEFECT D-705-10 (low). ASYMMETRY 2: excluding array writes is
      nominally symmetric but MATERIALLY FAVOURS THE REORGANIZED SIDE. Its
