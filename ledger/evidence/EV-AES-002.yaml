  # No hypothesis exists for this campaign: BATCH-002 produced no hypothesis
  # record and none was proposed. This evidence is bound to the research
  # question instead, following EV-AES-001 and the EV-FCP-001 / EV-ECDLP-002
  # precedent.
  hypothesis_id: RQ-AES-001
