  review_findings:
    custody:
      result: PASS
      finding: >-
        The snapshot commit is reachable, its actual first parent and exact two
        changed paths agree with the completed content-first binding, both path
        hashes match, and the receipt remains truthfully self-neutral.
    preserved_protocol_design:
      gate_1_local_design: >-
        Same-curve and same-subseed ordinary, planted, and planting-disabled
        arms isolate the planting toggle at the design level, subject to the
        blocking PRNG and serialization repairs. Any later pass could establish
        gross planted specificity only, never conductor sensitivity.
      gate_2_local_design: >-
        Both source-block hashes and all sixteen integer-map and first-rejection
        fixtures replay, and the q/ell kernel and endpoint-local conductor
        requirements are substantially frozen, but the exact construction is
        neither success-producing for all rows nor fully serializable.
      gate_3: >-
        The exact ordered anchor schedule [40,43,46,49,52,55,58,60], endpoints,
        maximum adjacent gap three, exact N bit length, and no-substitution rule
        are preserved as design requirements. Five impossible construction rows
        currently block the conjunction.
      gate_4: >-
        The exact GLV witness replays, including first x 5,
        P=(709722602244,157661366587), and
        phi(P)=lambda(P)=(681317832440,157661366587). This is static witness
        replay only, not a measurement or ECDLP result.
    blocking:
      - id: RT-ECTD-V4-O1
        category: static_construction_feasibility
        finding: >-
          Five scheduled rows are impossible under the exact frozen odd-prime
          p, odd-prime full-group-order N, odd q, and
          Delta_pi=q^2*D_K semantics. V4 records only the three D_K=-7 rows and
          omits the two D_K=-8 rows. The exact affected seeds are 301, 302, 304,
          305, and 308, so the eight-slot success conjunction cannot pass.
      - id: RT-ECTD-V4-O2
        category: deterministic_construction_and_rejection_replay
        finding: >-
          Canonical field-element and affine/projective point encodings,
          point-at-infinity encoding, exact admissible discriminant list and
          enumeration, complete per-code rejection schemas, serialized
          rejection bytes, and rejection hashes remain absent or ambiguous.
      - id: RT-ECTD-V4-O3
        category: canonical_serialization
        finding: >-
          Gate 1 and Gate 2 prescribe property orders inconsistent with RFC
          8785, while exact upper-anchor integers may exceed 2^53 without a
          frozen canonical big-integer encoding. The promised bytes are not
          uniquely reproducible across runtimes.
      - id: RT-ECTD-V4-O4
        category: paired_calibration_replay
        finding: >-
          Gate 1 does not freeze the PRNG algorithm, seed-to-state rule,
          version, and transitive source binding needed to make a shared
          meter_subseed implementation-independent.
      - id: RT-ECTD-V4-O5
        category: decision_source_binding
        finding: >-
          V4 forbids coercing undefined KS to nonrejection, but hash-bound
          decision.py maps rejects null to false and continues into a
          data-bearing branch. One executable decision rule is not defined.
      - id: RT-ECTD-V4-O6
        category: stopping_classification
        finding: >-
          V4 moves missing fixtures or ambiguous algorithms from the frozen
          resource_incomplete class to invalid_before_target and classifies a
          Gate-1 timeout as invalid despite the global failed_infrastructure
          rule. The terminal semantics are inconsistent.

