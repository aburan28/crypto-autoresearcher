  observations:
    - id: OBS-1
      what: 'THE ONE REAL MEASUREMENT. beta_deg on backward_state_support_size, main arm, all measured targets.'
      value: 'pooled 0.5985'
      detail: >-
        Pairwise slopes 0.5790 (p=1009 -> 65521), 0.5978 (1009 -> 16769023), 0.6119 (65521 ->
        16769023). Per-seed 0.5940 / 0.6053 / 0.5968. All-nine-cell OLS 0.5987. Leave-one-prime-out
        0.6119 / 0.5978 / 0.5790, total spread 0.033. Restricted to the certified-success subset,
        0.5982. Underlying seed-averaged means: 86.87 at q ~ 989, 984.68 at q ~ 65489, 29312.43 at
        q ~ 16767732. Every one of these cuts is at least 0.279 ABOVE the 0.3 gate, roughly eight
        times the largest instability, so the conclusion "not below 0.3" does not depend on which
        prime, which seed or which subset is used. The conclusion "equals 0.6 exactly" DOES depend
        on that choice and is NOT asserted.
      why_it_is_the_load_bearing_number: >-
        backward_state_support_size is not a fit, a sample, a bound or a solver output. It is the
        exact cardinality of the reachable set {u : some (x3,x4,x5) in V^3 closes the chain},
        computed by exhaustive enumeration over V^3 with the group law - at most 28^3 = 21952 chain
        evaluations at the largest size. It cannot be wrong in a direction; it can only be wrong
        outright, and three independent group-law implementations agreeing on 3191 certificates
        bounds that. This quantity also survives the Sage-to-sympy substitution intact (DEV-1).
    - id: OBS-2
      what: 'The measured state reproduces the elementary generic count.'
      value: 'support / L^3 = 1.35729, 1.35073, 1.33530 against 8/3! = 4/3 = 1.33333'
      detail: >-
        Converging on 4/3 from above, to three significant figures at the largest size, and within
        2% at EVERY size independently of any fit. This is the falsification condition F4 of
        H-RT1476-001 met by a ratio test that uses no regression at all. Its evidential content is
        "the generic count is not violated at three toy sizes", NOT "an exponent was discovered".
    - id: OBS-3
      what: 'beta_ops IS STRUCTURALLY UNINFORMATIVE. It is recorded here as a defect of the frozen protocol, NOT as a favourable result.'
      value: 'main pooled 0.7197 on the certified-success subset - a number that carries no information about H-RT1476-001 in either direction'
      derivation_that_makes_it_uninformative: >-
        membership_query performs L^3 iterations. Each iteration computes at most two resultants of
        polynomials whose degrees are bounded by 4 in the eliminated variable and 2 in u - bounded
        INDEPENDENTLY OF q - and then evaluates a degree-8 polynomial at every element of the forward
        state F. Therefore ops_per_query <= L^3 * (c1 + c2*|F|) with c1, c2 absolute constants. The
        forward state was MEASURED at |F| = L^2 EXACTLY at all three sizes (16, 81, 784), so
        ops_per_query = O(L^5) = O(q) for ANY curve, ANY factor base and ANY q, hence
        beta_ops <= 1 + o(1) < 3/2 WAS FORCED BEFORE ANY CURVE WAS SAMPLED. Fitting c1 and c2 from
        the two LARGER sizes only gives L^3 * (5428.5 + 15.9142*|F|), which predicts the held-out
        smallest cell to within 1.5% (363,723 predicted against 369,134 measured).
      instability: >-
        The pooled 0.7197 is not an exponent. Its pairwise slopes RISE MONOTONICALLY - 0.6165, then
        0.7158, then 0.7908 - with leave-one-prime-out spread 0.174, five times the beta_deg
        instability. It is a point on a crossover between q^{3/5} and q^1, asymptoting to 1.0.
      consequence: >-
        Criterion S2 ("beta_ops < 3/2") and falsification condition F3 ("beta_ops >= 1.5") are both
        UNREACHABLE under the implemented query. S2 was NOT MET in any informative sense and is
        struck as unreachable by DEC-20260728-003; F3 is neither met nor unmet. The red team's
        Omega(q^{3/2}) prior was a claim about subresultant PRS on an eliminant of degree ~q; this
        experiment ran a different algorithm on an object of degree 8L^3 = 8q^{3/5}. THE PRIOR IS
        NEITHER CONFIRMED NOR REFUTED - IT IS NOT ADDRESSED.
    - id: OBS-4
      what: 'The deg_u series is a DEMONSTRATED-BLIND instrument and carries no weight in either direction.'
      value: 'deg_u = 8L^3 exactly on EVERY arm: 512, 5832, 175616 at L = 4, 9, 28; fitted exponent 0.6009 main, 0.6056 posctl, 0.6004 negctl'
      detail: >-
        The module computes deg_u as the SUM over all L^3 triples of each triple's degree-8
        resultant, so it is a count of non-degenerate triples times 8 - a function of L alone, whose
        fitted exponent 3*(1/5) = 0.6 is arithmetic rather than measurement. On the POSITIVE CONTROL,
        where the reachable set provably has 6L+1 = 169 elements at L = 28, deg_u reports 175616, an
        overstatement by a factor of 1039. READ AS A STATE-SIZE METER, deg_u FAILS INVALID-4.
      consequence: >-
        (a) Success criterion S1's clause "and, where available, corroborated by
        deg_u_backward_eliminant" is STRUCTURALLY UNAVAILABLE, not merely unmet. (b) H-RT1476-001's
        SECOND prediction (deg_u grows no faster than the support size, exponent below 0.3) is
        UNTESTABLE by this instrument - it was NOT tested and failed, and no adverse reading of it is
        recorded. (c) The deg_u exponent 0.6009 is excluded from the reasoning of this record in both
        directions (scope reduction SR-1).
    - id: OBS-5
      what: 'Both controls, and the exact limit of what CTRL-POS establishes.'
      detail: >-
        CTRL-POS returned beta_deg = 0.2034 on the support series (pairwise 0.2029/0.2034/0.2037,
        leave-one-prime-out spread 0.0008), far below 0.3, so INVALID-4 does NOT fire on the primary
        series and the bidirectional lock in controls.CTRL-POS.what_it_tests is RELEASED FOR THAT
        SERIES. It was verified mechanically to differ from the main arm in exactly the one declared
        respect - identical p, a, b, n, base point, L, 1200 targets, S_3 monomial table coefficient
        by coefficient, resultant routine, operation counter, module, session and machine, with the
        shared target stream agreeing on 95 of 95 shared-index comparisons - and the planted state
        really does come out 6L+1 (all 31 measured targets return exactly 169 at L = 28).
        CTRL-NEG returned 0.6055, so INVALID-5 does not fire: a system with NO elliptic structure
        reproduces the generic exponent, and the support instrument is bracketed - 0.2034 where the
        truth is Theta(L), 0.6055 where the truth is Theta(L^3).
      the_caveat_that_must_travel_with_ctrl_pos: >-
        CTRL-POS IS WEAKER THAN "THE METER IS CALIBRATED" SUGGESTS, AND THIS RECORD DOES NOT CLAIM
        OTHERWISE. V_pos = {x([i]P)} makes the reachable index set an interval of 6L+1 integers, so
        ANY correct distinct-u counter MUST return 6L+1, and 6L+1 at L = round(q^(1/5)) MUST fit to
        0.2034. The value is ARITHMETICALLY FORCED and no sensitivity is inferred from it.
        backward_state_support_size is DEFINED as an exact cardinality and COMPUTED by exhaustion; a
        quantity computed exactly has no sensitivity to calibrate. What CTRL-POS genuinely
        establishes is a CORRECTNESS CHECK excluding one real and non-empty bug class - a support
        routine returning |V|^3, or a constant multiple of it, or anything insensitive to the
        structure of V, which is exactly the bug that would have manufactured a false 0.6 on the main
        arm. It is not a power calculation and cannot be one. CTRL-POS does NOT test the enumerator
        against an unstructured factor base whose reachable set is nevertheless small; no such input
        exists in the run set.
    - id: OBS-6
      what: 'UNEXPECTED, RECORDED UNDER AGENTS.md RULE 8: the frozen success-rate heuristic HEUR-001 meets its own falsification condition.'
      value: 'measured main-arm success_rate 0.355, 0.246, 0.239 against the heuristic L^5/(5! q) = 0.0086, 0.0075, 0.0086; ratios 41.1, 32.7, 27.9'
      detail: >-
        Systematic across all three sizes and all three seeds, an order of magnitude and more, which
        is exactly HEUR-001's stated falsification condition. The producer identifies an evident
        cause: L^5 counts UNSIGNED 5-tuples, but a relation may take either sign on each of five
        summands, and the count of signed multisets C(2L+4, 5) is about 2^5 = 32 times L^5/5! at these
        sizes. THE DIRECTION MATTERS AND IS NOT ADVERSE TO INDEX CALCULUS: relations are about 30x
        MORE common than the heuristic said. It is also IRRELEVANT to the gate - success_rate bears
        on how many targets decompose, not on how large the backward state is - and it therefore
        neither rescues nor further damages H-RT1476-001. The status of HEUR-001 is set by
        DEC-20260728-003; it is not set here.
    - id: OBS-7
      what: 'The single adversarial amendment the frozen contract ever received was honoured and is INERT.'
      detail: >-
        The red-team restriction "fit beta_ops on the certified-success subset only" is genuinely
        implemented, on the group-law certified set and not the algebraic root-existence set, with
        the unrestricted series published beside it. It could not have changed the answer:
        membership_query scans all L^3 triples with no early exit, so a successful and a failing
        query do the same work by construction, and ops_success / ops_all / ops_failure agree to
        0.0005 on the main arm (0.7197 / 0.7195 / 0.7192). Its protective function was never
        exercised. That is a fact about the implemented query, not about the mathematics; an aborting
        variant would separate the series and the amendment would bite.

  inference: >-
    ON THE TESTED SCOPE ONLY, the backward 3-sum state of the serial-S3 2|3 split of the m = 5 Semaev
    relation over a random x-line factor base at L = round(q^(1/5)) IS GENERIC: its size is
    (4/3)L^3 to within 2% at every tested size, with fitted exponent beta_deg = 0.5985 against a
    generic prediction of 3/5 and against the RT-1476-SUBRES-A1 gate of 0.3. The collapse
    H-RT1476-001 posits - a factor-q^{0.3} reduction below the generic count - IS ABSENT at these
    sizes, and it is absent for an elementary reason that the measurement corroborates rather than
    discovers: nothing in the architecture removes the 8L^3/3! signed-triple count.
    THIS EVIDENCE THEREFORE WEAKENS H-RT1476-001 ON THE TESTED SCOPE ONLY, at preliminary strength,
    at toy claim tier, on a declared empirical_only basis.
    WHAT IT DOES NOT SAY, EXPLICITLY: it says nothing about beta_ops, whose gate was unreachable by
    construction; nothing about the eliminant DEGREE, whose meter is demonstrated blind; nothing
    about whether a subresultant PRS on the backward eliminant is cheap or expensive, since the
    cost-bearing path measured here is a triple enumeration and PRS proper was sampled on four
    polynomial pairs per query as a diagnostic; nothing about coefficient blow-up, which is UNTESTED
    rather than absent because B_R is never materialised; and nothing whatever about prime-field
    ECDLP, about cryptographic-size curves, or about any other live record in this ledger.

  boundaries:
    - 'INSTANCES: nine randomly sampled ordinary prime-order short-Weierstrass curves over F_p, j(E) not in {0, 1728}, n != p, three per size, drawn under seeds 20260728/20260729/20260730.'
    - 'MODULI: p in {1009, 65521, 16769023} - 10, 16 and 24 bits. THE LARGEST FIELD IS 24 BITS. Nothing here is evidence about cryptographic-size curves, and no medium- or crypto-tier statement is available at any outcome.'
    - 'GEOMETRY AND SIZING: an x-line factor base at L = round(q^(1/5)) = 4, 9, 28, and the serial-S3 2|3 split at m = 5 at a shared Kummer coordinate. It closes nothing about other arities m, other splits, other factor-base geometries or other sizings.'
    - 'IMPLEMENTATION: Python 3 / sympy 1.14.0 / CPython 3.13.1 over GF(p) on the in-repo harness, macOS arm64, ONE machine. Sage was unavailable (DEV-1); wall-clock and coefficient bit-size do NOT survive that substitution and support no cost claim.'
    - 'BUDGET: 27 runs, 1797.3 s of measured compute against a 7200 s cap, peak RSS 91.1 MiB against 4 GB, 1200 screened targets per cell with a Stage-B measurement cap of 10 successes plus 10 failures per cell.'
    - 'FIT: three size-points spanning log q from 6.88 to 16.63, a factor of 2.4, with three seeds each. Three points cannot establish a power law - they can only show gross inconsistency with one - so HEUR-002 remains UNVALIDATED and unvalidatable by this experiment.'
    - 'NOT AN ATTACK: no discrete logarithm solved, no scalar recovered, no relation collected into a linear-algebra stage, no descent, no comparison against Pollard rho or BSGS, no cost model, no concrete-cost table. This experiment could not have become an attack under any outcome.'
    - 'SCOPE OF THE NEGATIVE: this record closes exactly the tested scope named above and supports NO universal impossibility claim, in either direction.'

  scope_reductions_binding_on_this_record:
    - id: SR-1
      text: >-
        Only the backward_state_support_size series is cited. The deg_u_backward_eliminant series is
        excluded from the reasoning in BOTH directions: it returned 0.6056 on a control whose planted
        truth is 0.2034 and is a demonstrated-blind instrument.
    - id: SR-2
      text: >-
        beta_ops = 0.7197 carries NO weight for or against the red team's Omega(q^{3/2}) prior,
        because F3 was arithmetically unreachable under the implemented query. "beta_ops < 3/2" does
        not appear anywhere in this record as a satisfied criterion without that qualification in the
        same sentence.
    - id: SR-3
      text: >-
