  unresolved_confounds:
    - 'MODEL CORRELATION. Producer and validator resolved the SAME model identifier (claude-opus-5), both with fallback_used true and model_verified false. A shared misconception about resultant degrees, about what a positive control establishes, or about the difference between a fitted exponent and an arithmetic identity would be invisible to this review. The validator wrote its Part 4 paper check specifically so a human or a different model family can settle the two load-bearing facts without a computer; that check has NOT yet been run by anyone else.'
    - 'PLATFORM. Reproducibility was demonstrated on the producer''s own machine, Python build and sympy version. A toolchain-level defect would reproduce faithfully. Different-platform replication is an open obligation (SUCC-1).'
    - 'THREE POINTS, BOTH SLOPE SEQUENCES TURNING. beta_deg pairwise slopes rise 0.5790 -> 0.6119 and beta_ops rise 0.6165 -> 0.7908. The rise is consistent with a genuine trend AND with finite-size effects at L = 4, where the factor base has four elements, 24% of that size''s certificates contain a proper sub-multiset summing to the identity, and all 43 certificates in the run set containing the target''s own x-coordinate occur. The cell anchoring the low end of every fit is the most degenerate one. F2 is therefore recorded as arithmetically met but evidentially weak; the adverse reading rests on F1 and F4, not on F2.'
    - 'MODULE IDENTITY BY DEMONSTRATION, NOT BY DECLARATION. No manifest records a SHA-256 of subresultant_meter.py and the module was dirty at execution time under commit e1847fc8. The identity of the executed code rests on the validator having re-executed five cells with the committed module and reproduced the artifacts exactly. That is stronger than a hash in practice and weaker as a standing guarantee (defect ND-8).'
    - 'coefficient_profile WAS NEVER MEASURED. B_R is never materialised, so the frozen contract''s named failure mode "coefficient blow-up dominating even if degree small" is UNTESTED, NOT ABSENT. results_summary.json records it as an explicit null with a reason, which is the correct handling. No inference is drawn from its absence.'
    - 'SELF-TEST OUTPUT IS IN NO COMMITTED ARTIFACT. The module''s --selftest exists and analysis.md section 10 reports its checks, but it was not executed into a run record, so those checks rest on the producer''s report plus the validator''s source reading.'
    - 'STAGE-B SUBSAMPLING. Per-cell means rest on 10 measured successes and 10 failures where 277-576 certified successes were available, discarding 96-98% of the success subset. Declared in advance and unbiased, but it widens the noise; seed-to-seed beta_deg spread of 0.011 bounds how much it matters.'

