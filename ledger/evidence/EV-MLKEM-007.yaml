evidence:
  id: EV-MLKEM-007
  hypothesis_id: H-MLKEM-004
  experiment_ids: [EXP-MLKEM-004]
  run_ids: [RUN-MLKEM-013, RUN-MLKEM-014, RUN-MLKEM-015, RUN-MLKEM-016]
  type: empirical
  direction: inconclusive
  strength: weak
  claim_tier: laboratory_implementation_conformance
  certificate_refs:
    - coordination/goals/GOAL-MLKEM-002/batches/BATCH-001/archives/TASK-20260724-920/snapshot-receipt.json
  proof_status: empirical_only
  proof_refs:
    - experiments/EXP-MLKEM-004/execution-report.yaml
    - experiments/EXP-MLKEM-004/analysis/synthetic_control_report.json
    - experiments/EXP-MLKEM-004/analysis/second_implementation_selection.md
    - experiments/EXP-MLKEM-004/runs/RUN-MLKEM-013/raw.json
    - experiments/EXP-MLKEM-004/runs/RUN-MLKEM-014/raw.json
    - experiments/EXP-MLKEM-004/runs/RUN-MLKEM-015/raw.json
    - experiments/EXP-MLKEM-004/runs/RUN-MLKEM-016/raw.json
    - coordination/goals/GOAL-MLKEM-002/batches/BATCH-001/tasks/TASK-20260724-921/validation_report.yaml
    - coordination/goals/GOAL-MLKEM-002/batches/BATCH-001/tasks/TASK-20260724-922/red_team_report.yaml
  official_outcome_classification: second_impl_unavailable
  observations:
    - >-
      All four planned EXP-MLKEM-004 runs reached terminal status. The run
      package is snapshot c3bd8bab7bcc8a99ff4986822695fe6fa9af624a; the
      validator recomputed all 53 receipt hashes with zero mismatches
      (TASK-20260724-921, accept_with_qualifications).
    - >-
      The KN-TECH-054 precedence repair landed for reachability. The synthetic
      baseline-invisible control was G1-silent on region R = {1536..1567} and
      detected by G2 and G3 with non-empty marginal findings attributable only
      to the synthetic control. Rediscovery of the known wolfSSL defect was not
      counted as class_marginal_information. Under the repaired precedence,
      both generator_hardening_insufficient and isolated_to_audited_commits
      were reachable worlds; neither fired.
    - >-
      The known wolfSSL v5.9.1 AVX2 omission at 1536..1567 was retained and
      detected by G1, G2, and G3, with at least one decapsulation-boundary
      accept. The negative harness passed. No reproducible silent index or
      equal-length decapsulation accept was observed outside that known defect
      on the wolfSSL post-fix backends under the grids executed.
    - >-
      The load-bearing second-implementation line ended in
      second_impl_unavailable. BoringSSL, PQClean avx2/aarch64 verify,
      mlkem-native, and aws-lc were attempted and rejected as
      length-parameterized compares that do not meet the fixed-bound
      hand-written vector-tail criterion. The validator confirmed the
      attempts are evidenced and that second_impl_unavailable is the correct
      class under frozen precedence. Isolation across implementations is
      therefore not claimed.
    - >-
      Independent red team (TASK-20260724-922) left the outcome class standing
      but landed four scope objections: the synthetic control is a harness
      tautology (single-byte diffs in R return equal by construction) that
      answers KN-TECH-054 for precedence reachability while restating it for
      library-facing instrument power; the mechanism-match criterion appears to
      leave an empty public neighborhood among preferred candidates; the
      post-fix null remains partly generator-scoped (API G2/G3 spot coverage);
      and second_impl_unavailable licenses only that the isolation question was
      not asked of a mechanism-matched peer.
    - >-
      Exact-command control passed: every command.txt is a real python3 argv.
      Anchor was graded weak against none_nist_file_validation_failed_or_incomplete
      with NIST downloads present but unused and not used to upgrade grade.
      Validator qualifications: execution-report wall fields contain 5400s
      placeholders while manifests sum to about 12.6s; RUN-013..015 git_commit
      misbinds to an unrelated SHA; build timing receipt is /tmp-primary with
      content embedded in RUN-013 raw.json.
  inference: >-
    Within this laboratory boundary the repaired gate restored outcome-class
    reachability and retained detection of the known wolfSSL defect, but it did
    not complete the isolation-versus-systemic test because no
    mechanism-matched second implementation was obtained. H-MLKEM-004 is
    inconclusive: its instrument-adequacy (precedence) conjunct held at the
    harness level, its detection-retention conjunct held, and its isolation
    conjunct was not tested. The red team's tautology objection means the
    synthetic control must not be quoted as evidence that G2/G3 have power
    against real library comparison routines. Nothing here is an attack, an
    oracle, or any statement about MLWE hardness or passive ML-KEM security.
  boundaries:
    - claim_tier is laboratory implementation conformance, never cryptanalytic advantage
    - isolation across implementations is not claimed under second_impl_unavailable
    - synthetic-control adequacy is harness-level reachability evidence, not library-facing generator power
    - wolfSSL post-fix null is scoped to the backends, parameter sets, keys, and grids actually executed
    - preferred public second-implementation neighborhood under the frozen mechanism criterion was empty in this run
  unresolved_confounds:
    - Whether any widely available open-source ML-KEM implementation currently exposes a fixed-bound hand-written comparison tail reachable offline within budget
    - Whether a library-facing baseline-invisible control (not a harness tautology) can be constructed without modifying library code
    - Execution-report wall-clock placeholders and RUN-013..015 git_commit misbind (validator qualifications)
  reviewed_by: coordinator
