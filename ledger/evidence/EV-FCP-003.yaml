evidence:
  id: EV-FCP-003
  hypothesis_id: H-FCP-001
  experiment_ids:
    - EXP-FCP-002
    - EXP-FCP-003
  run_ids: []
  type: empirical
  direction: weakens
  strength: preliminary
  claim_tier: toy
  certificate_refs:
    - kind: none
      note: >-
        All decomposition runs found no decompositions (B^2/N << 1); all carry
        certificate kind=none, verified=true.
    - kind: discrete_log
      note: >-
        All rho baselines (EXP-FCP-002: 12, EXP-FCP-003: 12) solved with verified
        discrete-log certificates.
  proof_status: empirical_only
  proof_refs:
    - experiments/EXP-FCP-002/analysis.md
    - experiments/EXP-FCP-003/analysis.md
  observations:
    - >-
      EXP-FCP-002: 144 runs at 16/20/24/28 bits, K=5, B=14, m=2, all
      completed_valid, dirty: false. Mean amortized cost ratio: 1.125 (16-bit),
      1.169 (20-bit), 1.067 (24-bit), 1.061 (28-bit). All ratios > 0.95.
    - >-
      EXP-FCP-003: 72 runs at 32/36 bits, K=5, B=14, m=2, all completed_valid,
      dirty: false. Mean amortized cost ratio: 1.023 (32-bit), 1.040 (36-bit).
      All ratios > 0.95. Closest: seed 2 at 32-bit = 0.996.
    - >-
      Precompute/groebner ratio trend across 16-36 bits: 0.0041, 0.0078, 0.0136,
      0.0149, 0.0166, 0.0157. The ratio increases from 16-32 bits but plateaus
      at ~1.6% and does NOT continue to grow. The hypothesis predicted this
      ratio would grow enough to produce >5% savings; it does not.
    - >-
      Combined: 216 runs across 6 bit sizes (16-36), 3 seeds, 5 targets, 2
      modes + rho baselines. No run achieves amortized_cost_ratio < 0.95.
    - >-
      The ratio approaches 1.0 (from 1.125 to 1.023) as bit size increases,
      but the precomp/groebner ratio plateaus at ~1.6%, far below the ~6%
      needed for K=5 amortization to produce 5% savings.
  inference: >-
    The evidence weakens H-FCP-001: the predicted crossover to amortized cost
    ratio < 0.95 does not occur at any tested bit size (16-36), and the
    precompute/groebner ratio plateaus at ~1.6% rather than continuing to grow.
    The hypothesis mechanism (construction cost grows faster than Groebner cost)
    is partially correct at 16-32 bits but saturates. At 36 bits the ratio
    actually decreases slightly (0.0166 -> 0.0157), suggesting the growth has
    stopped. The Groebner solve time remains ~0.04-0.05s across all bit sizes
    because the polynomial system (degree 14, 2 variables) is structurally
    fixed — only coefficient arithmetic cost grows, and sympy handles 36-bit
    coefficients efficiently.
  boundaries:
    - Toy scale only (max 36 bits); behavior at crypto scale is unknown.
    - B=14, m=2, K=5 only; different parameters may behave differently.
    - No decompositions found at any bit size; all Groebner solves return
      trivial ideals. Cost for non-trivial systems may differ.
    - The precomp/groebner plateau at ~1.6% is specific to B=14; larger B
      would increase construction cost but also Groebner cost.
    - >-
      empirical_only: no derivation or counterexample certificate; the
      weakening is based on 216 runs across 6 bit sizes.
  unresolved_confounds:
    - The Groebner solve time is dominated by polynomial operation count
      (fixed by degree 14, 2 variables), not coefficient arithmetic. A
      different Groebner implementation (e.g., F4 with modular arithmetic)
      might show different scaling.
    - At crypto scale (128+ bits), coefficient arithmetic cost may become
      dominant and the precomp/groebner ratio could grow again. This is
      speculative — not testable with sympy.
    - B=14 is small; a larger factor base (e.g., B=1000) would have much
      higher construction cost, but the Groebner system would be degree 1000,
      likely infeasible for sympy.
  reviewed_by: coordinator

  # Added 2026-08-02 under DEC-20260802-008 as amended by DEC-20260802-009.
  # This record cites artifacts the repository does not hold in registrable
  # form, so tools/validate_ledger.py reports them as unknown and those lines
  # are grandfathered. Disclosing the absence on the record itself is the
  # condition of that grandfathering: a reader must not have to infer from a
  # baseline file that a citation cannot be resolved. Nothing about this
  # record's observations, direction, strength or claim tier changes here.
  artifact_absence_statement:
    cited_but_unregistrable:
      - id: EXP-FCP-003
        state: >-
          experiment directory exists but no specification registers it under
          this id
    consequence: >-
      The experiment this record reports on is not registered, so the record
      is not bound to a frozen protocol through its experiment_ids.
