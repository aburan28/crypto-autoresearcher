# EV-DTREE-2e8f6a — C2 claim only (measured depth-2 descent cost C_2 vs
# single-level cost C_1). Filed separately from the C1 (slope) claim — see
# EV-DTREE-b47c19 — per review-evidence instructions: these are genuinely
# different findings (C1: no data produced, infrastructure defect; C2: mixed
# real data, capped below the decisive falsification/success thresholds) and
# must not be collapsed into one undifferentiated verdict.
#
# Independently re-verified by the Coordinator during /review-evidence
# (2026-08-09): the 16-bit stage-2 zero-success claim was recomputed directly
# from RUN-DTREE-006/summary.json's per_config_summary (not merely trusted
# from analysis.md); the CTRL-GENERIC-HEURISTIC ratio range was recomputed
# directly from RUN-DTREE-011/raw.json's generic_heuristic_control block; the
# bootstrap-CI claim was checked against RUN-DTREE-012/raw.json and against
# costs.py's actual applicability threshold (see OBS-6 below, a correction to
# analysis.md's "six" figure); one decomposition certificate (RUN-DTREE-006,
# 16-bit, target index 0) and one discrete-log certificate (RUN-DTREE-010,
# same target) were independently re-verified via from-scratch elliptic-curve
# point-addition and scalar-multiplication arithmetic (not the run's own
# verifier) — both checked out exactly, confirming 11*P = (21106, 36763) and
# a valid 2-point decomposition of the same point, cross-consistently with
# the frozen instance's algebraic structure (R = a*P + b*Q, Q = 6*P, n=23).
evidence:
  id: EV-DTREE-2e8f6a
  hypothesis_id: H-DTREE-001
  experiment_ids: [EXP-DTREE-001]
  run_ids:
    - RUN-DTREE-001   # main-instance/target/factor-base freeze (shared foundation)
    - RUN-DTREE-003   # single-level C1, 16-bit
    - RUN-DTREE-004   # single-level C1, 20-bit
    - RUN-DTREE-005   # single-level C1, 24-bit
    - RUN-DTREE-006   # depth-2 C2, 16-bit
    - RUN-DTREE-007   # depth-2 C2, 20-bit
    - RUN-DTREE-008   # depth-2 C2, 24-bit
    - RUN-DTREE-009   # CTRL-MEDBASE-LOGS
    - RUN-DTREE-010   # CTRL-MATCHED-RHO
    - RUN-DTREE-011   # probability sampling + CTRL-GENERIC-HEURISTIC
    - RUN-DTREE-012   # aggregation: optimal B_med, bootstrap CIs, fully charged totals

  type: empirical
  direction: neutral
  strength: inconclusive
  claim_tier: toy
  claim_tier_justification: >-
    Tested at 16/20/24-bit fields only (max 24 <= 32). No claim beyond these
    three specific curves, this solver (sympy Buchberger via harness/semaev.py
    with a locally-fixed s4_expr), and these caps.

  certificate_refs:
    - "RUN-DTREE-004: 16 decomposition certificates claimed, 16 verified (independent-recompute)"
    - "RUN-DTREE-006: 38 decomposition certificates claimed, 38 verified — sum of stage1_found across all 8 depth-2 configs at 16-bit (3+0+0+2+15+0+3+15=38), confirmed by the Coordinator to reconcile exactly with per-config stage1_found"
    - "RUN-DTREE-007: 40 decomposition certificates claimed, 40 verified"
    - "RUN-DTREE-008: 11 decomposition certificates claimed, 11 verified"
    - "RUN-DTREE-009: 3 decomposition certificates claimed, 3 verified"
    - "RUN-DTREE-010: 148 discrete-log certificates claimed, 148 verified"
  certificate_spotcheck: >-
    The Coordinator independently re-verified two certificates by hand,
    completely outside the run's own verifier, using only the curve equation
    y^2 = x^3 + 3028x + 22807 (mod 52721) and the elementary point-addition
    formulas: (1) RUN-DTREE-006's first listed decomposition certificate
    (m2_x16 config, target index 0, R=(21106,36763)) claims R = (5939,11909)
    + (14816,32309); both summands were confirmed on-curve by hand
    (y^2 mod p matched x^3+ax+b mod p for each), and their sum was computed
    via the standard affine addition formula and found to equal
    (21106, 36763) exactly, both coordinates. (2) RUN-DTREE-010's discrete-log
    certificate on the SAME point (P=(11943,17033), Q=(21106,36763), k=11)
    was independently checked by computing 11*P via repeated doubling and
    addition (2P, 4P, 8P, then 8P+2P+P); after catching and correcting one
    manual arithmetic slip in an intermediate point addition (verified by
    checking that the erroneous intermediate result did NOT lie on the
    curve, while the corrected one did), 11*P was confirmed to equal exactly
    (21106, 36763). Both certificates are genuine, not fabricated, and the
    two independent checks are mutually consistent with the algebraic
    structure of the frozen instance (target index 0's seed is a=14, b=11;
    Q_instance = 6*P; 14 + 11*6 = 80 = 11 mod n=23).

  proof_status: empirical_only
  proof_status_declaration: >-
    DECLARED, NOT DEFAULTED. This decision does not make an adverse
    transition (weaken or reject_scoped) on H-DTREE-001's C2 claim — see
    rationale in DEC-20260809-91d4c7 for why inconclusive was chosen instead
    — so the refutation-artifact ladder is not being climbed toward a
    rejection here. empirical_only is recorded because it is the STRONGEST
    basis this record actually has (real, certificate-verified Groebner-cost
    and decomposition-probability measurements, not a derivation or a
    counterexample construction), and because it is the ceiling this
    evidence would be capped at even if a future replication firmed the
    20-bit signal up into a `weaken` call: AGENTS.md's rule that "an
    empirical-only refutation on a single unreplicated run takes weaken +
    replication, not reject_scoped" would apply, since this is one
    unreplicated batch (one seed per size).
  proof_refs:
    - experiments/EXP-DTREE-001/runs/RUN-DTREE-007/raw.json
    - experiments/EXP-DTREE-001/runs/RUN-DTREE-011/raw.json
    - experiments/EXP-DTREE-001/runs/RUN-DTREE-012/raw.json

  observations:
    - id: OBS-1
      title: Single-level baseline C1 is itself undefined at 2 of 3 sizes
      text: >-
        P(m=3,B) measured by exact curve-group-law test (decoupled from
        Groebner completion): 0.0 (16-bit, 0/50), 0.32 (20-bit, 16/50), 0.0
        (24-bit, 0/50) — confirmed exactly against
        RUN-DTREE-003/004/005 raw.json and summary.json (which agree with
        each other in every run). C1 = mean(C_solve)/P is therefore
        undefined at 16-bit and 24-bit (not zero, not infinite — undefined,
        exactly as RUN-DTREE-003/005's summary.json's own
        c1_undefined_reason field states), and 62.5 at 20-bit
        (C_solve mean 20.0s / P=0.32).
      verified_by_coordinator: true
    - id: OBS-2
      title: 16-bit depth-2 (RUN-DTREE-006) — validity prefix MET, every C2 undefined via an exact-zero stage-2 rate
      text: >-
        Recomputed directly from RUN-DTREE-006/summary.json's
        per_config_summary and validity_prefix blocks (not from
        analysis.md's prose alone). All 8 configurations attempted 15 or 16
        targets at stage 1 (stage1_n_measured in {15,16}), satisfying the
        validity_prefix rule (>=10 targets, >=2 configs; here 8/8 configs
        qualify, exceeding the >=2 minimum). Every config's c2 field is null.
        The underlying reason splits into two distinct patterns, both
        confirmed directly: (a) 3 configs (m2_x2, m2_x4, m3_x2) had
        stage1_found=0 — stage 1 itself never found a single medium-base
        decomposition among 16 attempts, so stage 2 was NEVER attempted
        (stage2_n_attempted=0, p_m_B_stage2=null, "unmeasured" not "zero");
        (b) the other 5 configs (m2_x16, m2_x8, m3_x16, m3_x4, m3_x8) DID
        find stage-1 decompositions (2 to 15 of them) and therefore attempted
        stage 2 (6, 4, 45, 9, and 45 individual medium-base-element
        decomposition attempts respectively) — and every single one of these
        59 stage-2 attempts failed (stage2_found=0 in all 5 configs,
        p_m_B_stage2=0.0 exactly, not merely small). Certificate count
        cross-check: 3+0+0+2+15+0+3+15=38 stage-1 successes, matching
        RUN-DTREE-006's claimed/verified certificate count of 38 exactly
        (0 stage-2 certificates, consistent with 0 stage-2 successes).
      verified_by_coordinator: true
    - id: OBS-3
      title: 20-bit depth-2 (RUN-DTREE-007) — validity prefix FAILED, but 6/8 configs give a defined, uniformly unfavorable C2
      text: >-
        stage1_n_measured is 3 or 4 across all 8 configs (confirmed exactly:
        4,4,4,4,3,4,3,3), so validity_prefix_met: false (0/8 configs reach
        the 10-target minimum; the rule requires >=2). Where C2 IS defined
        (6 of 8 configs — m2_x16=126.67, m2_x8=160.0, m3_x2=140.0,
        m3_x4=155.0, m3_x8=200.0, m3_x16=110.0; confirmed exactly against
        c2_by_config), every value exceeds C1=62.5 (ratio range
        1.76x-3.2x). RUN-DTREE-007's own manifest records the
        resource_exhaustion status and the "0 configuration(s) reached the
        10-target minimum" finding explicitly, per the specification's own
        depth2-stage stop rule (a size below the validity prefix is
        "resource_exhaustion (recorded, not evidence)").
      verified_by_coordinator: true
    - id: OBS-4
      title: 24-bit depth-2 (RUN-DTREE-008) — validity prefix FAILED, and every C2 undefined
      text: >-
        stage1_n_measured is 6 or 7 across all 8 configs (confirmed exactly:
        7,7,7,7,6,7,7,7), validity_prefix_met: false. Unlike 16-bit, some
        configs here DID find stage-1 successes at a high rate (m3_x16:
        6/6=100%, m3_x8: 5/7=71%) and DID attempt stage 2 substantially (18
        and 15 attempts respectively) — yet stage2_found=0 in every single
        one of those attempts too (p_m_B_stage2=0.0 exactly where
        measurable). Every config's c2 is null.
      verified_by_coordinator: true
    - id: OBS-5
      title: CTRL-GENERIC-HEURISTIC — every computable cell is non_generic_signal, 100-800x cheaper than HEUR-001 predicts there
      text: >-
        Recomputed directly from RUN-DTREE-011/raw.json's
        generic_heuristic_control block at 20-bit (the only size with any
        computable ratio): ratio_measured_over_predicted values are
        0.000756 (m2_x16), 0.000954 (m2_x8), 0.000437 (m3_x16), 0.000514
        (m3_x2), 0.000604 (m3_x4), 0.000792 (m3_x8) — min 0.0004372
        (m3_x16), max 0.0009543 (m2_x8), confirming the reported [0.00044,
        0.00095] range exactly. All 6 are labeled non_generic_signal (far
        outside the pre-registered [0.5, 2] tolerance). Every 16-bit and
        24-bit cell is not_computable (measured_c2 null). No cell anywhere
        is labeled generic_equivalent.
      verified_by_coordinator: true
    - id: OBS-6
      title: Correction to analysis.md's "six... bootstrap 95% confidence intervals" — five reported CIs, not six, though the qualitative claim (all above 1) is correct for those five
      text: >-
        RUN-DTREE-012/raw.json's bootstrap_by_config block at 20-bit shows
        only 5 of the 6 defined-C2 configurations have applicable: true
        (a reported ci_95): m2_x16=[1.25,4.75], m3_x16=[1.619,10.0],
        m3_x2=[1.15,9.625], m3_x4=[2.133,4.0], m3_x8=[3.333,10.0] — all
        entirely above 1, lowest lower bound 1.15 (m3_x2), exactly matching
        the reported figures. The 6th config, m2_x8 (point estimate
        C2=160.0), has applicable: false: only 854 of 2000 bootstrap
        replicates (42.7%) produced a computable C2/C1 ratio, and I traced
        this to costs.py's own applicability rule
        (`if len(ratios) < n_boot * 0.5: return {"applicable": False, ...}`,
        line 390) — 854/2000 falls below the 50% floor, so its CI is
        genuinely not reported, not merely omitted from the prose. Its point
        estimate (160.0, a 2.56x ratio to C1) is directionally consistent
        with the other five but carries no reported interval. This is a
        precision correction to analysis.md's line "every one of the six
        bootstrap 95% confidence intervals... lies entirely above 1" — the
        correct count is five reported CIs (all above 1), plus one defined
        point estimate without a reported CI. It does not change the
        substantive finding (zero configurations anywhere meet
        C2 < 0.8*C1 with a CI entirely below 1).
      verified_by_coordinator: true
    - id: OBS-7
      title: The falsification condition's three disjuncts, checked individually against their exact wording
      text: >-
        "C2 falsified (route closed at toy scale): C_2 >= C_1 for every
        tested (B_med, m', m) configuration at every size with measured
        prefix meeting the validity minimum; or the optimal B_med = B at
        every size; or the medium-base log-table construction cost exceeds
        any descent saving in the fully charged comparison." (a) Only
        16-bit meets the validity prefix, and there BOTH C1 and C2 are
        undefined for the identical underlying reason (P(m=3,B) measured as
        an exact 0 on the same standard-base decomposition test, used both
        as the single-level baseline and inside every stage-2 substep) — so
        this is not a computed "C2 >= C1" at the one qualifying size, it is
        a vacuous comparison with no defined operands on either side. (b)
        optimal_b_med is null (undefined) at 16-bit and 24-bit; at the one
        size where it IS defined (20-bit), optimal_b_med = 1056 = 16*B,
        strictly greater than B=66 — so clause (b) is actively FALSE where
        measurable, not satisfied anywhere. (c) Only computable at 20-bit.
        RUN-DTREE-012's fully_charged_totals_by_config uses K = standard_B =
        66 (confirmed from aggregate.py source: `K = sl["standard_B"]`) and
        reports depth-2 fully-charged totals (preprocessing + K*C2) of
        11,880s-29,480s across the six computable configs. I computed the
        single-level fully-charged comparison myself (not quoted from a raw
        field): K*C1 = 66*62.5 = 4,125s. K*C2 ALONE (7,260s-13,200s, before
        even adding the medium-base preprocessing term) already exceeds
        K*C1 in every computable config, so clause (c) is satisfied in an
        even stronger form than literally required, at the one (sub-prefix)
        size where it is computable. All three disjuncts either fail to
        reach a validity-qualified "yes" (a, b) or only reach one at a
        sub-prefix size (c) — none closes the route as a validity-qualified
        falsification.
      verified_by_coordinator: true

  inference: >-
    I read this as inconclusive, not weaken, for three compounding reasons.
    First, the falsification condition's own validity-prefix qualifier is
    not satisfied by a genuine comparison anywhere: the one
    validity-qualified size (16-bit) yields an undefined-vs-undefined
    non-comparison (both C1 and C2 collapse to "P measured as exact 0" for
    the identical reason — this is not "C2 >= C1", it is the absence of a
    baseline to be worse than), while the one size with a clean, finite,
    uniformly unfavorable signal (20-bit — 6 defined C2 values all exceeding
    C1, 5 bootstrap CIs entirely above 1, a generic-heuristic ratio 100-800x
    off in a direction that still leaves C2 > C1, and a fully-charged
    comparison where even K*C2 alone exceeds K*C1) explicitly FAILS the
    validity prefix the frozen protocol pre-registered specifically to guard
    against exactly this kind of underpowered-but-suggestive read (n1=3-4
    out of a planned 50 targets, due to the 1500s cumulative Groebner-time
    cap being exhausted after only 4 target-rounds). The specification's own
    stopping rule calls this "resource_exhaustion (recorded, not evidence)"
    — a distinction I take seriously because it was written into the frozen
    contract BEFORE any data existed, not invoked after the fact to explain
    away an inconvenient number. Second, even setting the prefix rule aside,
    a single unreplicated batch (one seed per size) is exactly the case
    AGENTS.md reserves for weaken-with-replication, never reject_scoped, and
    I do not have grounds here to even reach a confident weaken, given the
    first point. Third, per this review's own briefing bias toward caution
    on adverse calls, I resolve the genuine tension in favor of the more
    conservative disposition. I want to be explicit that this is a REAL
    tension, not a manufactured one: every defined number in this dataset,
    without exception, points the same unfavorable direction for the
    depth-2 route (never once does C2 < C1, an unrestricted-factor-base
    control shows the measured effect is wildly non-generic, and the
    fully-charged accounting only makes the comparison worse) — and a
    reasonable reader could weigh that uniform directional consistency more
    heavily than I have and reach weaken instead. I record that this is a
    close call, not a clean one.

  boundaries:
    - >-
      Toy tier, 16/20/24-bit fields, one seed per size (seeds 1/2/3 mapped
      one-to-one to 16/20/24 bits). No replication at a second seed or
      instance exists for any size.
    - >-
      Validity-prefix status by size, stated plainly since it governs what
      may be read as evidence at all: 16-bit MEETS the prefix (8/8 configs)
      but produces no defined C2 anywhere; 20-bit and 24-bit both FAIL the
      prefix (0/8 configs each) and are "resource_exhaustion... recorded,
      not evidence" under the frozen protocol's own stopping rule, even
      though 20-bit happens to carry the only defined, CI-backed numbers in
      the whole dataset.
    - >-
      Scoped to this exact B_med grid ({2,4,8,16}xB), m' in {2,3}, m=3,
      B=ceil(sqrt(N)), this solver (sympy Buchberger via the locally-fixed
      semaev, per-solve cap 20s, per-run cumulative cap 1500s), and this
      specific factor-base construction (build_factor_base sampling the
      WHOLE curve, not the target subgroup — see unresolved_confounds).
      Other arities, deeper trees, a subgroup-restricted factor base, or a
      larger per-run budget are separate, untested questions.
    - >-
      Says nothing about the C1 (slope) claim, which is a design-infeasible
      non-result, not a measurement — see EV-DTREE-b47c19.

  unresolved_confounds:
    - id: CONF-1
      title: harness.semaev.build_factor_base samples the whole curve, not the target's subgroup
      text: >-
        Confirmed by reading harness/semaev.py directly: build_factor_base
        draws x-coordinates from the full curve E(F_p), not from the
        order-n subgroup <P> that the target R always lies in by
        construction. Combined with large, size-varying cofactors
        (2280 at 16-bit, 196 at 20-bit, 31512 at 24-bit — computed as
        (curve order)/n from the frozen instance data), this means a
        "random" factor-base element only lands inside <P> with probability
        roughly 1/cofactor, which is not what HEUR-001's own
        random_model_justification assumes ("a free x-coordinate lands in
        the base with probability B'/N"). Measured single-level P(3,B)
        (0.0/0.32/0.0) does not track HEUR-001's own (B/N)^2 point-prediction
        (0.047/0.000239/0.003) in either direction or magnitude at any of
        the three sizes, and 20-bit — the smallest cofactor of the three,
        and the ONLY size where any stage-2 or single-level success was ever
        observed — is consistent with cofactor size being a first-order
        driver of whether decomposition is measurable at all here. This was
        not a pre-registered metric, is not scored against any threshold,
        and is not diagnosed further by this record: isolating between "the
        depth-2 tree genuinely never clears the standard base here" and
        "cofactor/factor-base-construction artifacts suppress ALL
        decomposition success at 2 of 3 sizes, precluding a fair test" was
        exactly the job of the (unavailable, design_infeasible) C1 slope
        fit, and this record does not attempt it from C2 data alone.
      status: open, flagged for a future session (also recorded in
        KN-OPEN-5b3a08 for cross-experiment visibility, since
        build_factor_base is shared harness code)
    - id: CONF-2
      title: harness/semaev.py's s4_expr had a confirmed variable-collision bug, worked around locally for this experiment only
      text: >-
        Confirmed via implementation.md's account (brute-force reference
        check: a genuine 3-summand witness evaluated nonzero under
        harness.semaev.s4_expr where it must be exactly 0) and via reading
        harness/semaev.py directly (the .subs() calls in s4_expr are not
        simultaneous, so a variable intended to remain free collapses into
        the resultant's dummy variable). EXP-DTREE-001 worked around this
        locally (semaev_fix.py's s4_expr_fixed, used by gb_worker.py and
        curvegroup.py's audit path) rather than editing the shared
        harness/semaev.py, which is out of this experiment's scope — the
        arity-3 (m=3, S_4) numbers in this record (C_solve(3), and any
        arity-3 stage-2 attempt) are NOT affected by the original bug. The
        bug itself remains live in the shared harness/semaev.py and is also
        imported directly by experiments/EXP-MTIC-001/code/run_mtic.py and
        experiments/EXP-FIB-001/driver/decompcost.py (confirmed by reading
        both files). CORRECTION, applied by the dispatching Coordinator
        during archival (2026-08-09): this review's own initial check
        concluded "neither of which has any executed runs yet" (both
        approved with empty runs/ directories) — that check was wrong. Both
        experiments have many already-executed, already-committed runs (11
        for EXP-MTIC-001, 10 for EXP-FIB-001) that call the buggy s4_expr
        directly on their result path (run_mtic.py's s4_setup computes
        `S4 = s4_expr(a, b)` as its first line). This does not affect any
        number in THIS record, but is disclosed per AGENTS.md rule 8 and
        cross-referenced in KN-OPEN-5b3a08 (corrected in the same archival
        pass) since it is not confined to this experiment.
      status: open, harness/semaev.py itself unmodified; flagged for
        whoever next executes EXP-MTIC-001 or EXP-FIB-001
    - id: CONF-3
      title: 20-bit and 24-bit's sub-prefix status is a budget artifact of round-robin scheduling across 8 configurations, not necessarily a property of the underlying rates
      text: >-
        RUN-DTREE-007 exhausted its 1500s cumulative Groebner-time cap after
        only 4 target-rounds (cumulative_gb_seconds=1514.18, slightly over
        because the cap is checked before starting a new capped solve, not
        mid-call — disclosed in the run's own anomalies); RUN-DTREE-008
        after 7 target-rounds. Both stayed within the independent 1800s
        wall-clock hard cap. Because all 8 (m',B_med) configurations share
        one budget in round-robin order (frozen order: m'=2 ascending
        B_med, then m'=3 ascending B_med), a larger per-run cumulative
        budget, or fewer configurations tested per run, would directly
        address the prefix shortfall — but see CONF-1: if cofactor-driven
        suppression (not budget) is the true bottleneck, a bigger budget
        at 24-bit might still spend 1800s to reach the same P=0 conclusion
        RUN-DTREE-008 already reached with 7 targets, since 16-bit already
        shows an exact 0/N stage-2 rate with a FULLY adequate budget
        (validity prefix met, no censoring pressure).
      status: open

  reviewed_by: coordinator
  reviewed_at: '2026-08-09'
