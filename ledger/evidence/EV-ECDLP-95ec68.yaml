  observations:
    - "Claim (1): 1360/1360 exact digit-identity agreements across the 20 non-anomalous instances (5 curves x 4 primes x 68 m-values), independently re-derived from raw per-datum records by a separate blind pass (see TASK-20260911-6bf4f9 review_plan) using code that does not import the driver's own aggregation logic; zero mismatches."
    - "Claim (2): per-instance log-log size-law slopes range [1.9983, 1.9999] (mean 1.9992), independently refit from each instance's own numerator_bits_by_m to ~1e-14 agreement with the reported values; every instance inside the pre-registered 2.00+-0.05 band."
    - "Claim (4), leak: 277/277 certified (m,j) leak pairs re-verified via harness.toycurve.EllipticCurve.mul (independent of the p-adic solver path); 683 companion pairs skipped under a pre-declared, budget-driven infeasibility cap (300,000 bits), fixed before the run per derivation_note.md section E; 0 certificate failures. Combinatorics reconcile exactly: 12 sampled m-values x 4 non-negative j-values (of 7; m<n always in this ladder, so j in {-3,-2,-1} always yields a negative m+jn and is silently not recorded) x 20 instances = 960 = 277+683."
    - "Claim (4), break: the anomalous curve (p=3673=n) refuses at exactly 'division by n inside E_1 (pow(n,-1,p^K) with p|n)', the single predicted failure mode; self-check 5's positive control on a non-anomalous synthetic instance recovers and certifies 24/24."
    - "Claim (3), pooled: 24/1360 = 0.01765 agreement between the Teichmuller-section digit and m times its m=1 value, reproduced exactly from raw per-instance records. Per-instance breakdown (independently recomputed, not read from a summary field): all 20 instances agree at m=1 and ONLY m=1, except the four instances of curve 2 (A=9,B=26,x0=1,y0=6; primes 7477/7481/7487/7489), which additionally agree at m=2 -- nowhere else in the 67-value non-trivial ladder, on any curve."
    - "The m=1 agreement is a mathematical tautology by construction: stage23.py computes u_S via teichmuller_defect_digit(..., S_mod_K, ..., m_mod_n=1, ...) and the m=1 loop iteration computes u_mS via the identical function call on the identical reduced point with the identical m_mod_n=1 (mS_exact at m=1 equals S_exact exactly). It is the same computation invoked twice, not an independent trial; confirmed by direct reading of stage23.py lines ~124-135."
    - "The curve-2/m=2 agreement is fully explained (not merely observed) as an instrument-realization artifact: curve 2's doubling slope lambda=1 exactly makes 2S^=(-1,-4) an exact small-integer point over Q; x=1 and x=-1 are the only rational integers that are (p-1)-th roots of unity for every odd prime, so the Teichmuller lift and paired Hensel-y lift return them unmodified at every precision and every prime, making the contrast section s(mS) coincide exactly with the true global-lift reduction at m=1 and m=2 on this curve. Confirmed three ways in the raw data: numerator_bits==1 at m=1,2 only; u_mS==d_mS exactly at m=1,2 and diverging at every other m; identical recurrence across all four of curve 2's primes (a global rational coincidence, not four independent per-prime accidents) and absence on the other four curves (whose x0 in {7,9,5,5} and tested multiples never reduce to x=+-1)."
    - "All 22 official runs (000-selfchecks, 001-020, 021-anomalous) show status: completed_valid in both the top-level and result.status manifest fields, confirmed by direct Grep across all 22 manifest.yaml files (44/44 matches)."
  inference: >-
    Claims (1), (2), and both halves of claim (4) hold exactly as stated
    over the tested scope, each independently re-verified by a method
    distinct from the producing driver's own aggregation/certificate code.
    Claim (3)'s pooled and even its corrected non-tautological statistic do
    not represent independent evidence against or for systematic linearity
    of the Teichmuller section: every non-trivial agreement found (4 of
    1340 corrected trials) is fully accounted for by a named,
    prime-independent degeneracy of this specific instrument realization
    (fixed-x-Teichmuller-lift + Hensel-y), triggered only when a tested
    multiple's x-coordinate happens to be a universal (p-1)-th root of unity
    (+-1). This is a measurement-instrument blind spot in this particular
    test, not evidence that the section is homomorphic and not evidence
    that it is not: the underlying uniqueness-of-homomorphic-section
    mechanism (KN-TECH-73630e) is neither confirmed nor contradicted by
    this experiment's claim-3 arm as executed. Separately, the pre-
    registered 3/p falsification threshold was, independent of this
    anomaly, already below the ladder's 68-sample resolution floor
    (1/68 ~ 0.0147 > 3/p at every tested prime), so the test as specified
    could not have discriminated "no systematic linearity" from "one
    coincidence" regardless of what was observed.
  boundaries:
    - "5 frozen global curves, 4 reduction primes each (20 (curve,prime) pairs), primes in [2^10, 2^14), toy tier."
    - "m ladder: 1..64 dense plus 96, 128, 192, 256 (68 values); leak arm sampled at 12 representative m-values x j in {-3,...,3} (only j in {0,1,2,3} ever non-skipped given m<n throughout)."
    - "One anomalous toy curve/prime pair (p=3673=n) as the proves-too-much object; refusal confirmed at the predicted step only."
    - "Claim (3)'s positive finding (agreement beyond m=1) is scoped to exactly one curve (curve 2) at exactly one multiple (m=2) within this ladder; it is a property of this Teichmuller-section realization interacting with a rational point whose double happens to have x=-1, not a general statement about m=2 or about curve 2 at other multiples."
    - "No attack, no exponent claim anywhere; the leak arm consumes the scalar to build the lift it reads and is a demonstration, never a recovery result, per H-ECDLP-6a9479 and the experiment's approval_gate."
  unresolved_confounds:
    - "Claim (3)'s test design conflates a mathematical tautology (m=1, always agrees by construction) with genuine trials in its pooled statistic, and its pre-registered 3/p threshold is uncalibrated to the ladder's 68-sample resolution (the smallest measurable nonzero rate, 1/68, already exceeds 3/p at every tested prime). Both defects predate and are independent of the curve-2 finding, and together they mean claim (3) as specified cannot currently be read as either supported or refuted by this run; it needs a protocol amendment (exclude m=1 from the statistic; use a resolution-matched threshold, e.g. a binomial CI, or a much larger m-sample) before a future run's result can discriminate the intended hypothesis."
    - "The curve-2/m=2 finding is a derivation cross-checked three ways against committed raw data (numerator-bit-length, exact digit coincidence restricted to m=1/2, cross-prime recurrence pattern) rather than a re-executed numerical check; this review had no Bash/Python tool. It is elementary and independently checkable by any reader from the doubling formula and instrument.py's teichmuller_lift_scalar/hensel_lift_sqrt definitions, but a follow-up numerical confirmation is still open (named in DEC-20260911-74c9dc next_actions)."
    - "A stray, differently-named run artifact (RUN-ECDLP-a26bde-1) exists under experiments/EXP-ECDLP-a26bde/runs/ at a different git commit, marked completed_valid despite its own self-check C failing, and is not part of this evidence record's run_ids. It is not evidence for or against any claim here and is flagged separately as a data-hygiene item, not folded into this record's boundaries."
