evidence:
  id: EV-AES-5478a0
  hypothesis_id: null
  hypothesis_id_note: >-
    DELIBERATELY NULL, same documented-null allowance as EV-AES-e4c091,
    EV-AES-acddd0, EV-AES-dec938 and EV-AES-4ba350 (CORR-20260802-009).
    This record is a null-object/cipher-substitution measurement extending
    RC-D's single-instance finding (EV-AES-dec938) along the two axes its
    own unresolved confound U4 named: round count and key/seed. RQ-AES-003
    carries no hypothesis this record would bind to.
  experiment_ids: []
  run_ids: []
  task_ids:
    - TASK-20260901-92672b
    - TASK-20260901-47b21f
    - TASK-20260901-bfd667
    - TASK-20260901-951e22
    - TASK-20260901-0dcc8d
    - TASK-20260901-2a7ecc
  type: measurement
  direction: corroborating
  strength: moderate
  strength_basis: >-
    MODERATE, consistent with the campaign precedent for clean null-object
    exclusions (EV-AES-e4c091, EV-AES-dec938, EV-AES-4ba350 all moderate).
    BATCH-7939d0 ran the two RC-D follow-ons DEC-20260805-af8565 named, at
    the matched decisive exposure (2^30, where ~14 events are expected
    under BATCH-009's measured AES rate), with full exposure on every arm
    and no shortfall. Axis 1 (round count): the keyed deterministic Feistel
    substitute was re-measured at r = 4, 8, 16, 32 with the r=16 variant
    byte-for-byte reproducing RC-D (detcheck and 2^22 smoke hash equality,
    full-exposure field-identity with the archived M1-FEISTEL-P30 beyond
    the arm label). Axis 2 (key/seed): the ARCHIVED RC-D source ran
    VERBATIM (sha256 parity with the BATCH-014 file) at preregistered
    second seed 531002 against a freshly recomputed AES arm. The
    independent validator PASSED both producers with zero discrepancies on
    a full fresh-code re-derivation of every statistic (p-values exact to
    <=1e-12) and passed all five binding controls with recorded evidence.
    Strength stays moderate rather than strong because this is one
    substitute family (keyed murmur3-fmix64 balanced Feistel), two seeds,
    four round counts, one probe geometry, one machine; the class-level
    claim is scoped to exactly that family and does not extend to
    arbitrary substitute constructions.
  claim_tier: toy
  claim_tier_basis: >-
    Reduced-round (r=5) AES-shaped SPN probe geometry (amask=1, smask=1),
    one machine, 64-bit keyed Feistel substitute family, trials at 2^30.
    No crypto-scale, medium-scale, affected-scheme or asymptotic claim is
    made or implied, and no comparison to published cryptanalysis is made
    in either direction (RQ-AES-003 R3).
  certificate_refs: []
  proof_status: empirical_only
  proof_refs: []

  observations:
    - id: OBS-B16-1
      statement: >-
        ROUND-COUNT AXIS: THE ABSENCE OF YOYO EXCESS IS ROUND-COUNT-ROBUST
        WITHIN THE RC-D FAMILY. At matched 2^30 exposure (seed 531001,
        armid 1, amask=smask=1) the keyed deterministic Feistel substitute
        read 2, 1, 0, 1 hits at r = 4, 8, 16, 32 against the frozen
        comparator's 14: every arm OUTCOME-A' under the preregistered rule
        (all Garwood 95% CIs contain 1; exact conditional-binomial p =
        0.004180908203125, 0.0009765625, 0.00012207031329580786,
        0.0009765625). The statistic moved WITHIN absence (x(r)=2,1,0,1;
        non-monotonic; max rate ratio R=2.0 at r=4) and never toward
        reappearance; per the inventor-protocol null control this movement
        is reported, not silenced. The r=16 variant passed the binding
        byte-parity control (detcheck sha256
        a9ae7aa5cf74dffaa588c94afe1c1dd79fcb72bfa05b75137ef8c3f2027c0e38
        and SMOKE22 sha256
        498b78d03e55b2fc9fe3b597d7881b93e3ee482914f027381e85e2cccc5514dd
        identical variant-vs-verbatim; F-R16-P30 field-identical to RC-D's
        archived M1-FEISTEL-P30 beyond the arm label), so the r=16 point
        is literally RC-D re-measured.
    - id: OBS-B16-2
      statement: >-
        KEY/SEED AXIS: THE ABSENCE IS NOT KEY-SPECIFIC. The UNMODIFIED
        archived RC-D oracle (sha256 parity with the BATCH-014 source
        9b36c0e7...d8566) at preregistered second seed 531002 (key
        58146703b42fca722bc0ab918cd1409b) read 0 hits at matched 2^30
        (R=0.0, Garwood CI [0, 3.689] contains 1) against a freshly
        recomputed live r=5 AES arm under the same seed reading 19 hits
        (R=19.0, CI [11.44, 29.67]): exact conditional-binomial p =
        3.814697e-06 (n=19, p0=1073741823/2147483647), rate-ratio CI lower
        bound 4.667. The comparison was recomputed under S2 end-to-end
        (both arms), not reused from BATCH-014.
    - id: OBS-B16-3
      statement: >-
        THE AES-SIDE EXCESS ITSELF VARIES IN MAGNITUDE ACROSS SEEDS: 19
        hits at seed 531002 vs 14 at 531001, both far above the analytic
        null (~1). Recorded per core rule 8 as an unexpected-adjacent
        observation: the r=5 excess's magnitude is seed-sensitive while its
        presence reproduces; any future mechanism account of where the
        excess lives must accommodate this variance.
    - id: OBS-B16-4
      statement: >-
        VALIDATION: the independent validator (fresh session, no producer
        code reused) re-derived every statistic from the raw runs/*.json in
        fresh code with zero discrepancies (all hit counts exact; all
        p-values and CIs within relative 1e-12 against a declared 1e-6
        tolerance), confirmed all five binding controls (preregistration
        mtime ordering both producers; r=16 byte-parity by
        validator-owned hashing; verbatim-source sha256; frozen-comparator
        usage, including reproduction of the comparator seat from
        BATCH-015's verified frozen_comparator block; determinism across
        all six detcheck JSONs), and confirmed the P33 pair's
        preregistered skip condition (3078s < 3600s threshold, stamped).
  tested_parameters: >-
    Probe: r=5 reduced-round AES-shaped SPN geometry, amask=1, smask=1,
    64-bit halves. Exposure: 2^30 matched trials per comparison (full on
    every arm). Substitute family: keyed deterministic balanced Feistel
    (murmur3-fmix64 round function lineage from BATCH-014's
    rc8probe_feistel.c), 128-bit key derived from seed. Axis 1: rounds r
    in {4, 8, 16, 32}, seed 531001, armid 1, up to 8 threads. Axis 2: r=16
    verbatim source, seed 531002, armid 1. Comparator: BATCH-009's frozen
    matched-exposure rule as carried by EV-AES-e4c091 and BATCH-015's
    verified frozen_comparator block.
  actual_scope: >-
    One substitute family, two seeds, four round counts, one probe
    geometry, one machine, toy tier. The class-level statement is scoped
    to the keyed murmur3-fmix64 balanced Feistel family at 64-bit block:
    within it, the absence of yoyo excess at matched decisive exposure
    does not depend on round count (4-32) or on which of two keys is
    used. Nothing here speaks to other deterministic PRP families, other
    block sizes, round counts outside 4-32, or any deployed cipher.
  transfer_assumptions: >-
    None beyond the stated scope. In particular NO transfer is claimed
    from this family to the ideal-approximating fresh-key class
    (EV-AES-4ba350) or vice versa; the two classes are separate data
    points in the same comparison, and the mechanism question (where the
    r=5 excess lives) remains open per DEC-20260805-af8565.

  unresolved_confounds:
    - >-
      EV-AES-dec938 U4 is narrowed further but not fully discharged: this
      record tests other round counts and one other key/seed within the
      RC-D family, but still not other deterministic PRP families. A
      class-level claim over structured non-ideal substitutes generally
      would need at least one differently-constructed family.
    - >-
      The non-monotonic movement x(r)=2,1,0,1 within absence carries
      little power to detect a slow decay: hit counts this small cannot
      distinguish flat absence from slow decay at the exposures run. A
      decay-specific design (much larger exposure on the low-r variants)
      would be needed to rule out slow decay rather than robust absence.
    - >-
      Seed-to-seed variance of the AES-side excess (14 vs 19 hits) is
      unexplained by this record; it is an observation, not a confound of
      the substitute-side conclusion, but it is unaddressed.
    - >-
      The external citations underpinning the comparator statistics
      (Garwood 1936; exact conditional binomial) remain provenance
      'recalled' -- pointers, not support (carried from EV-AES-4ba350).

