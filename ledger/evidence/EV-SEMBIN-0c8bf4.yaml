  observations:
    - id: O-1
      text: >-
        THE INSTRUMENT IS SOUND. Reconstruction control passed on all 12 (n, B)
        boxes of the source deficit table (executor and validator each recomputed
        them; validator matched at printed precision). Algebraic selftest of (F2)
        passed in all six (n, a) cases by exhaustive enumeration of E(F_{2^n}).
        Artifact digests 25/25 match; the copied field, core and run modules are
        sha256-equal to the EXP-SEMBIN-354a75 sources. Neither known-false split
        (LSB of x_R; Tr under a second irreducible of the same degree) produced an
        empty class on any t = 2 configuration, either subspace, either side --
        rerun by the validator, agreeing with the producer -- so the run is not
        invalidated on that rule. Matched-null per-R counts are unavailable in the
        source archive, as the contract declared; not substituted.
    - id: O-2
      text: >-
        THE CONTRACT'S LITERAL N1 IS 16, NOT 0; THE THEOREM'S N1 IS 0. The frozen
        contract defines N1 as the number of (configuration, target) pairs in the
        predicted-empty class with a nonzero count "in either presentation", and
        the run scores that on the single_x_multiset / chained_x_multiset columns.
        Executor and validator independently obtain N1 = 16 with the same sixteen
        keys (validator's integer computed before opening the producer's file).
        All sixteen lie at ONE cell -- n = 12, m = 6, t = 6, k = 2, |V| = 4,
        B = 1, twist side, a_T = 512 with Tr(a_T) = 1, confined parity
        m Tr(a_T) = 0, so pi = 1 is the predicted-empty class, and every one has
        Tr(x_R) = 0 -- and every one has usable_point_multiset = 0. The
        x-multiset columns count algebraic solutions of the summation system
        including those whose y_i lie in F_{q^2} \ F_q, which are not points of
        E(F_q); the theorem is about sums of F_q-rational factor-base points. On
        the usable column, N1 = 0 over all 79 751 targets of the predicted-empty
        class across the 40 even-n low-degree configurations on both sides, and
        N1 (either definition) = 0 at every even-n t = 2 cell. The validator's
        one-sentence classification: a contract-wording defect, not a theorem
        defect and not a run defect. Recorded as a PROCEDURE FINDING under the
        hypothesis's first falsification condition and the contract's stopping
        rule; see procedure_deviations in DEC-20260913-92aa48.
    - id: O-3
      text: >-
        THE POISSON SHAPE IS RESTORED INSIDE THE REACHABLE CLASS, AT CELL GRAIN.
        E side, usable column, t = 2, low-degree V, three even-n cells (n = 20,
        22, 24), 5 seeds x 2 B modes x 1000 targets each. Predicted-empty class
        pi = 1: zero usable hits on all 30 configurations. Reachable class
        pi = 0, both B modes pooled (validator, 8000-replicate bootstrap):
        variance/mean D = 0.984 [0.958, 1.010] at n = 20, 1.004 [0.977, 1.033]
        at n = 22, 1.024 [0.995, 1.053] at n = 24 -- every interval contains 1
        against the source's pooled 1.44-1.55. Reachable mean / (2 x pooled
        mean): interval contains 1 at all six (n, B) boxes. Pooled D against
        1 + lambda (lambda = the measured pooled mean, not fitted): D - (1 +
        lambda) interval contains 0 at all three cells (1.461 vs 1.476; 1.502 vs
        1.511; 1.518 vs 1.492). Per configuration, 4 of 30 reachable-class D
        intervals exclude 1 (binomially unremarkable at 95% coverage); all 30
        mean/(2 pooled) intervals contain 1.
    - id: O-4
      text: >-
        ONE BOX EXCLUDES 1 AT BOX GRAIN. The (n = 22, B = 1) box's reachable-class
        D is 1.042 with 95% interval [1.001, 1.083] (z = 2.10 against 1); its
        pooled D 1.545 sits slightly above 1 + lambda = 1.506 while the n = 22
        random-B box sits below (1.460 vs 1.516, interval excluding 0 on the low
        side). The contract's grain and the review plan's breaking artifact name
        the CELL (n, m, t, k); at cell grain both intervals contain their
        targets. Disclosed as a limitation, not absorbed: with two boxes of
        opposite sign inside one cell there is no direction to over-read, but a
        replication at n = 22 with more seeds is the honest test of whether the
        B = 1 box is a 2-sigma fluctuation.
    - id: O-5
      text: >-
        THE NULL OBJECT SHOWS NO STRATIFICATION (PROVES-TOO-MUCH PASSED). On the
        random_k_dimensional configurations of the same cells and seeds, E side,
        both pi classes are populated at every (n, B) box with means of the same
        order (n = 20, B = 1: 0.507 vs 0.521; nonzero 2050 vs 1995), per-class D
        in [0.980, 1.016] with intervals containing 1, and pooled D 0.986-1.012
        against 1 + lambda ~ 1.49-1.52 -- the mixture signature is ABSENT where
        V is not confined, as the mechanism requires. The split machinery
        therefore does not manufacture an empty class; the curve does.
    - id: O-6
      text: >-
        THE NEARBY OBJECT (ODD n) SHOWS NO DEFICIT. Two new exhaustive cells,
        n = 21 (k = 11) and n = 23 (k = 12), t = m = 2, |V|^t = 2^22 and 2^24
        enumerated (from the run's own logs and partial/p4.json, verified by the
        validator against the code path and the 2000-row integer per-R counts;
        not sampled). E-side usable f_dispersion 0.985-1.015 over the eight
        configurations, both parity classes hit; Tr(1) = 1 at both n so 1 in V
        is not in ker(Tr) and V is not confined. The deficit is an even-n
        phenomenon at this scope, as predicted.
    - id: O-7
      text: >-
        THE TWIST SIDE IS SILENT AT t = 2. usable_point_multiset is identically 0
        on the twist for every t = 2 configuration in the source archive, for
        BOTH subspace families and at the odd-n cells too. This is not a parity
        effect (both classes are empty of usable decompositions) and it is not
        scored for or against anything here; it means every shape statement in
        O-3 through O-6 is about E, and the twist's shape is untested at this
        scope. Unexpected enough to record: why a two-point factor base of the
        twist never yields a usable pair at these cells is not explained by any
        record in this program.
    - id: O-8
      text: >-
        P5 IS UNTESTABLE FROM THE ARCHIVE AND IS NOT SCORED. RUN-SEMBIN-cbd770
        retained image sizes and fibre histograms, not image membership, so the
        prediction about n = 12 images lying in a single parity class cannot be
        checked from committed data. Recorded, not substituted. P6 is a
        re-reading of eq. (11) under the mechanism, not a measurement, and is
        carried as stated in the hypothesis.
    - id: O-9
      text: >-
        RANDOM BASES ARE SOMETIMES CONFINED. partial/subspace-checks.json records
        per configuration whether the regenerated random_k_dimensional basis
        happens to lie in ker(Tr); the mechanism predicts this with probability
        2^{-k}, i.e. essentially never at k = 10-12, and the E-side random-V
        results (O-5) are consistent with unconfined V throughout. Recorded
        because it is the one place a random configuration could mimic the
        low-degree family, and the file exists to be read by a replication.

  inference: >-
    H-SEMBIN-83a856 IS SUPPORTED IN ITS TESTED SCOPE. The deterministic prediction
    holds on the object the theorem is about: zero usable decompositions on every
    one of 79 751 targets in the predicted-empty class over 40 even-n low-degree
    configurations on both curve sides, with each side's own a verified from the
    source construction and the traces recomputed under the source moduli (O-2).
    The "whole deficit" clause holds at the contract's grain: inside the reachable
    class the per-target count has Poisson dispersion (D interval containing 1 at
    all three cells) with mean twice the pooled mean, and the pooled dispersion
    equals 1 + lambda within its interval with lambda the measured mean and no
    free parameter (O-3) -- so the 18-22% probability deficit and the 1.44-1.55
    over-dispersion that EV-SEMBIN-d40877 O-5 left unattributed are, at these
    three cells, accounted for by parity confinement alone. Both controls behave
    as the mechanism requires and the known-false splits both fail to reproduce
    the effect (O-1, O-5, O-6). What does NOT hold is the contract's literal
    operationalization of P1, whose column counted non-rational algebraic
    solutions; the sixteen pairs it produced are a procedure finding about the
    contract, localized to one degenerate |V| = 4 cell, and are recorded as such
    rather than argued away. The open attribution in EV-SEMBIN-d40877
    (unresolved_confounds, first item) is closed by reference at t = 2, n in
    {20, 22, 24}; it remains open at t >= 3 and on the twist. Transferred to
    Nagao 2015/984 Section 7, the parity condition sum_i Tr(v_i) = m Tr(a) (mod 2)
    on coset representatives follows from the theorem, not from this
    measurement, and is carried as the hypothesis states it.

  boundaries:
