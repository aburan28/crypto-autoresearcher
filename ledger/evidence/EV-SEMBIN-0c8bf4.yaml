    exhaustive enumeration at n = 7, 8, 9 for a in {0, 1}, and (c) statistical
    shape tests at toy scale. certificate.kind is none: no solve, no relation, no
    degree. Under docs/claims-and-verification.md nothing here transfers to any
    cryptographic n except by the theorem itself, whose hypotheses (V in ker(Tr),
    ordinary binary curve) are stated, not measured, there.

