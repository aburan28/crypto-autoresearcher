      twist, plus two new exhaustive odd-n cells n = 21, 23 at t = m = 2. Every
      statement is about counts on those objects.
    - >-
      The whole-deficit attribution is established at t = 2 only. The source's
      t = 3 cells have |V| in {64, 128}, where the deficit was already
      unresolvable (EV-SEMBIN-d40877 boundaries); nothing here reaches t >= 3.
    - >-
      Twist-side shape is untested: usable is identically 0 on the twist at
      every t = 2 cell in the archive (O-7).
    - >-
      One (n, B) box's reachable-class dispersion interval excludes 1 at 2.1
      sigma (O-4); the claim holds at the declared cell grain and no finer.
    - >-
      No degree, Groebner or first-fall quantity is measured or asserted
      (IMP-SEMBIN-ENGINE). The trade-off between the parity yield factor and the
      paper's Groebner-side reason for the low-degree window is not assessed.
    - >-
      NOTHING IN THIS RECORD IS A STATEMENT ABOUT THE SECURITY OF ANY CURVE AT ANY
      PARAMETER, IN EITHER DIRECTION. Confinement changes per-target yield by a
      factor in {0, 2} and the pooled mean by nothing; no exponent moves.
    - >-
      Model provenance: producer resolved_model_id cursor-grok-4.6-medium
      (requested executor-implementation; fallback_used true, reason in
      DEC-20260913-c224bb); validator cursor-grok-4.6-xhigh (requested
      review-adversarial at xhigh; fallback recorded in its attestation). Both
      model_verified false; no adapter probe ran. Disclosed, not hidden: the
      round did not run on the bound Fable backend (IMP-SEMBIN-REVIEW-MAX).

  unresolved_confounds:
    - >-
      Whether the deficit at t >= 3 and |V| >= 2^10, if it exists, is the same
      parity object. The theorem says the empty class persists for every m; the
      2-lambda Poisson shape inside the reachable class is a t = 2 measurement.
    - >-
      The twist's uniformly zero usable count at t = 2 (O-7): unexplained, and
      it blinds every twist-side shape test at these cells.
    - >-
      The (n = 22, B = 1) box (O-4): fluctuation or a small residual
      over-dispersion specific to B = 1 at that n. Only more seeds distinguish
      them.

  dominated_by: >-
    Not applicable as a Pareto question: this record attributes a measured
    probability-level deficit to a structural mechanism; it is not an algorithm.
    The closest frontier row is eq. (11) itself, which remains the correct mean
    model; this record supplies the closed-form correction EV-SEMBIN-d40877 said
    it could not yet write -- P = (1 - e^{-2 lambda}) / 2 for a confined V over
    all of E(F_q), and mean 2 lambda on the 2E targets the algorithm decomposes.

  sota_delta:
    time_exponent: unchanged
    note: >-
      No exponent is moved and none is claimed. For a confined factor base the
      per-target yield on 2E is 2 lambda and on the complement is 0; over the
      odd-order subgroup where the DLP lives every target is in 2E, so eq. (11)
      UNDERSTATES the relevant mean by exactly 2x (P6 re-reading) while the
      whole-curve hit probability it predicts is overstated by 18-22% at t = 2.
      Constant factors at toy scale, established by theorem + one run.

  knowledge_promotion: deferred
  knowledge_promotion_reason: >-
    PROMOTION IS WARRANTED FOR THE THEOREM PART AND IS DEFERRED TO A SCOPED TASK,
