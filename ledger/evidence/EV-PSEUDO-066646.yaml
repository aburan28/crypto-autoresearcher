        scaling C_mean ~ p^{0.079} (which grows slowly).
        H-PSEUDO claims max_curves C = O(constant) for all curves at fixed p. The adversarial
        search supports this: max C ~ 4 is consistent with C = O(1) (constant independent of p).
    - id: O-3
      text: >-
        The mean C grows (2.99 → 3.47 → 3.63), but the maximum C is stable (~3.9-4.1).
        This suggests: MOST curves have C close to the mean (~3.5), but a few outlier curves
        have C closer to 4. The outliers are not growing with p.
    - id: O-4
      text: >-
        H-PSEUDO with C = 5 (universal constant): empirically supported by adversarial search
        at p=1009..9001. No curve with C > 4.2 found in 190+ measurements.

