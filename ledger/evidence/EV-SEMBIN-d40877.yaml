  proof_status_basis: >-
    empirical_only. The run counts decompositions by exhaustive enumeration over
    V^t in F_{2^n} arithmetic at nine (n, m, t, k) cells with n between 12 and 24
    and |V| between 4 and 4096; no Groebner engine, no solver, no degree
    assumption, no solve, no relation. certificate.kind is none with a stated
    reason. Under docs/claims-and-verification.md every quantity here is a
    measured count or a ratio of counts at toy scale, and nothing transfers to
    any cryptographic n except by the explicit, untested assumptions named under
    boundaries.

  composed_from_review: REVIEW-SEMBIN-20260913-run2
  reviewers:
    - {task: TASK-20260913-31d530, role: validator, joints: [J1, J2, J3],
       verdicts: {J1: breaks, J2: breaks, J3: breaks}}
    - task: TASK-20260913-3395e3
      role: validator
      joints: [J6-BLIND]
      verdicts: {J6-BLIND: holds}
      note: >-
        The owner filed a value and no verdict, as a blind re-deriver must; the
        Coordinator compared and composed `holds` in review-plan.yaml
        joint_outcomes. J4 and J5 of the same round belong to EXP-SEMBIN-92724f
        and are not composed here.

  observations:
    - id: O-1
      text: >-
        THE INSTRUMENT IS SOUND. 180 of 180 configurations reached, every cell
        exhaustive where it claims to be, every artifact and code digest matching,
        the conservation identity incidences + multisets_to_infinity +
        multisets_with_sum_x_in_V = C(L+t-1, t) exact with no remainder at all
        nine cells, and the exhaustive pass agreeing with 10 000 independent
        sampled draws on the same configuration at |z| <= 0.53 at all three
        t = 2 cells (validator section 0). The four-factor attribution
        f_legal x f_multiset x f_base x f_pop closes to the observed ratio of
        means to twelve decimals at the eight non-degenerate cells.
    - id: O-2
      text: >-
        THE PREDICTED MECHANISM IS ABSENT AT THE MEAN. H-SEMBIN-c5b2e0 argues that
        eq. (11) bounds P(solve eq. 5) from above and then assumes equality, so
        realized yield should fall systematically below it. But the pooled MEAN
        number of decompositions per target agrees with eq. (11)'s lambda to
        within 1% at the three t = 2 cells (mean ratios 0.9905, 1.0070, 1.0068,
        every interval containing 1), and the one factor that reflects the curve
        rather than the formula, f_legal, is below 1 by only 0.28%, 0.15% and
        0.07% there. Whatever eq. (11) gets wrong, it is not the mean, and it is
        not the Lemma-2 side-condition exclusions the hypothesis pointed at.
    - id: O-3
      text: >-
        THE PREDICTED t-TREND IS ABSENT. P2 predicted a monotone decrease of the
        ratio in t with the t = 4 ratio below the t = 2 ratio by a factor of at
        least 2. The t >= 3 cells (|V| between 4 and 128) return ratios ABOVE 1
        (1.048 at n17, 1.28 at n19 and n21, 2.69 at n13, 25.8 at n12), which is
        why the contract's ratio-above-1 stopping rule fired in six of nine cells.
        The excess is attributed exactly to eq. (11)'s class-count bookkeeping
        (f_multiset = C(L+t-1,t)/(L^t/t!) >= 1, large when L is small) and to the
        mean-one fluctuation f_base = (L/|V|)^t, not to the curve. No monotone
        quantity in t exists in this cell set to be decreasing.
    - id: O-4
      text: >-
        THE SIGN AT t = 2 SURVIVES, AND FOR THE PAPER'S OWN CONSTRUCTION IT IS
        LARGER THAN REPORTED. The headline pooled ratio P_measured / P_eq11 is
        0.9024, 0.9069, 0.9073 at (n, k) = (20, 10), (22, 11), (24, 12), and the
        interval excludes 1 below at all three cells even after the validator
        re-computed it at the configuration level (20 clusters; the run's Wilson
        interval on 40 000 pooled draws was 4-5x too narrow). But the pooled
        population is bimodal on the contract's declared independent variable
        `subspace variant`: with V the subspace of polynomials of degree < k --
        the construction Semaev's own text specifies at lines 539-545 of the
        frozen transcription -- the ratio is 0.7810, 0.8158, 0.7929 (cluster
        intervals [0.755, 0.807], [0.790, 0.842], [0.776, 0.810]); with V a
        random k-dimensional F_2-subspace it is 1.0238, 0.9979, 1.0217, every
        interval containing 1 (Welch t = 14.0, 8.6, 19.7). The headline is the
        midpoint of a 18-22% overstatement and a 0-2% understatement and is the
        cost-bearing ratio for no instance the run measured.
    - id: O-5
      text: >-
        THE DEFICIT IS OVER-DISPERSION, NOT MEAN SHORTFALL, AND IT IS A PROPERTY
        OF THE x-COORDINATE WINDOW. Per-target decomposition counts in the
        low-degree boxes have variance/mean 1.46-1.52 against 0.99-1.00 in the
        random-subspace boxes at the same cells, with no dependence on the curve
        coefficient B (B = 1 and random B agree within each family). The same
        mean spread over fewer targets gives more zeros, so P = 1 - exp(-lambda)
        under-predicts the zero fraction: f_dispersion = 0.79-0.82 for low-degree
        V, 0.99-1.01 for random V, stable across a 4x range of |V|. The chain of
        controls comes out the way a real signal does: the curve-free matched null
        gives f_dispersion 0.99982 / 1.00035 / 1.00017 with Poisson fit passing;
        curve plus random subspace is indistinguishable from the null; curve plus
        low-degree subspace shows the deficit; and randomising the basis -- the
        parameter that should destroy the structure -- destroys it completely.
        Neither the producer nor the validator identifies WHY the degree-< k
        window clusters; the association is measured, the mechanism is open.
    - id: O-6
      text: >-
        eq. (11)'s CLASS-COUNT CORRECTION IS EXACT AND CLOSED-FORM WHERE IT
        MATTERS (P3). Replacing |V|^t / t! by C(L+t-1, t) with L the realized
        point count accounts for the whole small-|V| excess; the four-factor
        identity leaves no residual. The blind re-derivation of f_base =
        (L/|V|)^t from the statement of the quantity alone reproduced the
        producer's closed form, its L (977, 2051, 4047) and its values (0.9103,
        1.0029, 0.9762) to 3e-5 against a 0.01 breaking threshold, from an
        implementation sharing no code, notes or output. What the correction does
        NOT reach is O-5: f_dispersion is not one of the four factors and no
        closed form for it is offered.
    - id: O-7
      text: >-
        THE CONTROLS HOLD (P4, P5). The directly realized symmetric random map
        returns ratio 1 within interval at every cell (45 realisations,
        0.9906-1.0123). Chained eq. (5) and single eq. (4) counts are identical
        per target at every t = 2 cell; the Lemma-2 side-condition failure
        fraction is reported explicitly by the producer. The invalid-input,
        order-independence and known-false (ordered t!) controls all behave as
        declared. The T-side target population returns zero yield at every cell
        and is disclosed rather than folded in.
    - id: O-8
      text: >-
        THE PROVES-TOO-MUCH CONTROL EXPOSED THE ARGUMENT, NOT THE ARITHMETIC. On
        the degenerate cell n15 m5 t3 k3 (L = 3, 10 multisets, 0 incidences) the
        attribution code correctly returns 0/0 and nan rather than a finite ratio.
        But the diagnosis text asserts "attribution closes everywhere" by AND-ing
        in a vacuous True, prints 1 - f_legal = 1.000000 for a 0-of-10 outcome in
        the same column as 0.002840 for 476 396-of-477 753, and section A reports
        sem P = 1.24 with interval above 1 at the same label where sections C, D
        and F report exactly zero -- because sections A and G average 20
        configurations while C, D, E and F are one. These are summarisation
        defects, all recoverable from the retained per-configuration table, and
        none is an enumeration error.
    - id: O-9
      text: >-
        A POINTER ON H-RELN-96e3ba, RECORDED AND NOT EVALUATED (P6). The producer
        observes (task-report section 10) that EXP-RELN-164ad3's metric M3
        residual of 2^m is this run's f_base under an encoding mismatch -- the
        RELN protocol declares B on-curve x-coordinates as its factor base while
        the search ranges over the |W| = 2B points they lift to, and substitutes
        B into B^m/(m! p). This run measures (L/|V|)^m in a setting where
        L/|V| ~ 1 and finds 0.988-1.003 at m = t = 2: no 2^m. The validator did
        not evaluate this (outside its joints). It is a pointer for whoever holds
        RQ-SEMBIN-9e8f82 and the RELN records, which are immutable; if it bears on
        them the remedy is a new record.

  inference: >-
    H-SEMBIN-c5b2e0 IS WEAKENED IN ITS TESTED SCOPE, AND ITS DIRECTION SURVIVES
    UNDER A MECHANISM IT DID NOT STATE. The hypothesis predicted a systematic,
    mean-level overstatement by eq. (11) that grows with t, caused by the
    bound-then-assume-equality step in the paper's derivation and the Lemma-2
    exclusions. The exhaustive measurement finds the opposite at the mean --
    eq. (11)'s lambda is right to 1% at t = 2 and its class-count is exactly
    correctable at small |V| -- and finds no t-trend (P1 and P2 fail; P3 partly
    holds; P4 and P5 hold; P6 is a recorded pointer). What does hold is a
    probability-level deficit of 18-22% at t = 2, |V| = 2^10..2^12, present only
    when V is the low-degree-polynomial subspace the paper itself prefers, and
    entirely absent for a random subspace of the same dimension. That is an
    over-dispersion of decomposition counts per target, i.e. a failure of the
    Poisson link P = 1 - exp(-lambda), not a failure of lambda. Because eq. (11)
    enters stage-1 relation-collection cost through the PROBABILITY of a
    decomposition, the cost-relevant sign the hypothesis predicted survives and is
    reinforced for the paper's construction; the hypothesis's account of why is
    refuted. The right successor is a hypothesis about the low-degree window's
    clustering, tested where t = 3 and |V| >= 2^10 can coexist and where the
    random family gets its own exhaustive pass.

  boundaries:
    - >-
      Tested scope is exactly the nine cells of EXP-SEMBIN-354a75: n in
      {12, 13, 15, 17, 19, 20, 21, 22, 24}, curves y^2 + xy = x^3 + B over
      F_{2^n} with B = 1 and random B, V either the degree-< k polynomial
      subspace or a random k-dimensional subspace, t = m in eight of nine cells.
      Every statement above is about counts on those objects.
    - >-
      The low-degree deficit (O-4, O-5) is established at t = 2 only. The
      contract's t = 3 cells have |V| in {64, 128}, where f_multiset and f_base
      noise dominate and the two subspace families are indistinguishable;
      "no low-degree effect at t = 3" is confounded with small |V| and is a scope
      limit, not evidence either way.
    - >-
      Decay of the low-degree deficit with |V| is untested: 0.812 / 0.802 / 0.803
      over a 4x range cannot separate "no decay" from "slow decay".
    - >-
      The random-subspace family has no exhaustive pass; its result rests on
      20 000 sampled draws and 10 configurations per cell.
    - >-
      No degree is measured, estimated or asserted (IMP-SEMBIN-ENGINE). Semaev's
      stated reason for preferring the low-degree window is a Groebner-basis
      matter; the trade-off between the yield penalty measured here and that
      claimed advantage is NOT assessed anywhere in this record.
    - >-
      NOTHING IN THIS RECORD IS A STATEMENT ABOUT THE SECURITY OF ANY CURVE AT ANY
      PARAMETER, IN EITHER DIRECTION. An 18-22% probability deficit at
      |V| = 2^12 changes a toy-scale count; whether any of it persists at
      |V| = 2^k for k near n/m at cryptographic n is exactly what is untested.
    - >-
      Model provenance: the producing session records resolved_model_id
      claude-opus-5 with model_verified false; both reviewing sessions record
      claude-fable-5-1-thinking (xhigh) with model_verified false. Disclosed on
      all sides; no adapter probe ran in any of them.

  unresolved_confounds:
    - >-
      The mechanism of the low-degree clustering. Only an association with the
      subspace construction is measured. Candidates nobody has tested: the
      additive structure of the degree-< k window under the curve's x -> x + B/x^2
      trace condition; correlation between x and x' with x + x' also of low
      degree; a Lemma-2 side-condition effect specific to low-degree sums. None
      is asserted.
    - >-
      Whether f_dispersion at t = 2 is the same object as anything at t >= 3.
      The recorded unexpected observation shape_deficit_not_monotone_in_t may
      simply be O-5 seen through cells that cannot resolve it.
    - >-
      The producer's headline interval is understated 4-5x by treating 40 000
      draws from 20 configurations as exchangeable. The direction survives at
      cluster level; any downstream use of the stated precision does not.

  dominated_by: >-
    Not applicable as a Pareto question: this record measures a probability
    model, not an algorithm. The closest frontier row is eq. (11) itself, which
    remains the correct MEAN model at t = 2 and the correct class count once
    C(L+t-1, t) is substituted; this record adds a family-dependent
    probability-level correction it cannot yet write in closed form.

  sota_delta:
    time_exponent: unchanged
    note: >-
      No exponent is moved and none is claimed. If the low-degree deficit
      persisted at cryptographic scale it would multiply stage-1 relation cost by
      at most 1/0.78 ~ 1.28, i.e. +0.36 bits, for the paper's own choice of V;
      that is a cofactor, and it is a toy-scale measurement with an open
      mechanism and no decay test.

  knowledge_promotion: deferred
  knowledge_promotion_reason: >-
    NOT PROMOTED. O-5 is the reusable content -- eq. (11)'s Poisson link fails by
    18-22% for the low-degree-polynomial window at t = 2 while its mean holds --
    and it passed the full controls-before-belief chain. It is still one run, at
    t = 2 only, over a 4x range of |V|, with no exhaustive pass on the comparison
    family and no mechanism. Promotion to KN-FIND waits on the successor
    experiment reaching t = 3 at |V| >= 2^10 and testing decay; promoting now
    would put a figure in the corpus that the next run may narrow or re-scope.
    The Coordinator records this reason rather than leaving the field empty.

  reviewed_by: coordinator
  recorded_at: '2026-09-13'
