    freeze_commit: ab8e3ad8f93b84f197aef647746a36ef0d7cd359
    verified_by: TASK-20260805-79e700
    detail: >-
      The Validator verified the specification blob is identical at its
      introducing commit, at HEAD and in the working tree, that git log --follow
      shows exactly ONE commit ever touched it, and that the freeze at 03:27:36Z
      precedes the first dataset HTTP request at 03:28:47Z by 71 seconds. Every
      confirmatory precondition holds. THAT IS WHY THE DEFECT BELOW IS A
      CONTRACT DEFECT AND NOT POST-HOC DRIFT — the contract was honestly frozen
      and was honestly wrong.
  observations:
    - id: O-1
      statement: >-
        The dataset was obtained EXTERNALLY, which was the entire purpose of the
        batch: the authors' released WISDE results (github.com/christellevincent/WISDE),
        5379 files, 1915238354 bytes, aggregate SHA-256
        674b3ef7078bfa1ebbe379bb93a62af7a1611ef570723695613cce50756e5099,
        33633008 curves, p in [2, 265207]. NO delta_E WAS COMPUTED BY THIS
        PROGRAM. The Validator re-fetched ALL 5379 FILES, not a sample, and
        obtained 5379/5379 identical hashes and the identical byte count.
      supported_by: [TASK-20260805-ac12ae, TASK-20260805-79e700]
    - id: O-2
      statement: >-
        Fitted exponents over the frozen windows: W-MAIN alpha = 1.1660926255
        (se 0.0005135859), beta = 0.5890462103, R^2 = 0.9915019 on 126822 cells
        over 5211 primes; W-SENS alpha = 1.172690. The Validator reproduced
        these INDEPENDENTLY — own parse, own window code, own least squares —
        to TEN SIGNIFICANT FIGURES.
      supported_by: [TASK-20260805-ac12ae, TASK-20260805-79e700]
    - id: O-3
      statement: >-
        The frozen decision rule was applied mechanically and returned
        INCONCLUSIVE: |alpha - 1.5| = 0.3339 and |alpha - 2.0| = 0.8339, both
        exceeding the pre-registered 0.20. alpha = 1.166 lies BELOW BOTH
        competing models. The Validator re-applied the rule and found no
        softening.
      supported_by: [TASK-20260805-ac12ae, TASK-20260805-79e700]
    - id: O-4
      statement: >-
        THE HEADLINE FINDING, AND IT IS ABOUT THE INSTRUMENT. The frozen
        estimator over the frozen W-MAIN window DOES NOT RECOVER alpha = 3/2
        from an object that has alpha = 3/2 by construction. The producer
        measured a bias of -0.3638 on its own surrogate. The Validator built an
        INDEPENDENT null from a DIFFERENT lattice family (uniform HNF index-q
        sublattices of Z^3 versus the producer's Goldstein-Mayer cyclic
        lattices), 20000 samples per q-class, with its own window and OLS code,
        and measured -0.3585. Two ensembles, two code paths, agreeing to 0.005,
        on a bias 1.8x THE DECISION RULE'S OWN +-0.20 TOLERANCE. Sanity check:
        on an exact power law the same estimator returns 1.500000.
      supported_by: [TASK-20260805-ac12ae, TASK-20260805-79e700]
    - id: O-5
      statement: >-
        THE CONSEQUENCE OF O-4, ESTABLISHED BY CONTROL RATHER THAN ARGUMENT. The
        Validator built a rank-4 object with true alpha = 2, pinned by the same
        saturation condition, and the frozen window returned 1.820 / 1.764.
        Therefore SUPPORTS-D1 WAS UNREACHABLE AT ANY DATA and REFUTES was
        borderline. The contract could not have confirmed the model it was
        written to confirm. Bias decomposition: NOT the OLS (0.000), NOT the
        N >= 10 cut (1e-5), NOT the nested-cell dependence (which costs standard
        errors — bootstrap says 2.0x anti-conservative — not 0.36). It is
        saturation inside the retained window (~ -0.15) plus finite-T lattice
        discreteness at T <= 45 (~ -0.21). A decile sweep from 0.9 to 0.1 peaks
        at 1.254 and never reaches 1.5: NO WINDOW CHOICE WOULD HAVE SAVED IT.
      supported_by: [TASK-20260805-79e700]
    - id: O-6
      statement: >-
        C-NULL FAILED, voiding the primary metric under the contract's own
        failure_consequence, and BOTH reviewers independently confirm it with
        wider margins than the producer reported. The Validator's independent
        surrogate reproduces the data fit MORE closely than the producer's
        (c-ratio 1.0084 versus 1.0173), and on log c the data sits closer to
        that null (0.00839) than the two nulls sit to each other (0.00875). The
        Red Team explains WHY it could not have passed: the surrogate shares
        BOTH endpoints with the real object, since Hermite gives
        gamma_3 (p/4)^{1/3} = (p/2)^{1/3}, reproducing Theorem 1.5's constant.
        Agreement in alpha, beta and c was STRUCTURALLY FORCED. M-ALPHA IS VOID
        AND MAY NOT BE CITED AS EVIDENCE ABOUT D1.
      supported_by: [TASK-20260805-ac12ae, TASK-20260805-79e700, TASK-20260805-fb72f1]
      reviewer_disagreement_recorded: >-
        THE REVIEWERS DISAGREE ON ONE POINT AND IT IS NOT FLATTENED HERE. The
        contract fixed no numeric tolerance for "reproduces c", so the producer
        stated its own. The Red Team (O22, HIGH) holds that unstated tolerance
        LOAD-BEARING: scaled to the surrogate's own seed spread of 0.000554, the
        0.0299 gap is 54 sigma, C-NULL passes, and the metric is not void. The
        Validator holds it NOT load-bearing, having tested with an independent
        surrogate that reproduces the fit more closely still, and rejects the
        statistical reading on the contract's own terms. BOTH REVIEWERS REACH
        THE SAME VERDICT (C-NULL FAIL, M-ALPHA VOID); they disagree on how
        robust that verdict is to a tolerance the contract failed to fix. The
        Coordinator does not adjudicate between them here: the contract's
        silence is the defect, and DEC-20260805-be2f87 records it as one.
    - id: O-7
      statement: >-
        THE REGIME THE LEVER LIVES IN IS NOT SAMPLED ANYWHERE IN THE DATASET.
        T = p^{1/4} sits at x = T/(p/2)^{1/3} in [0.44, 0.71] — deep in
        saturation — at EVERY prime tested, against x ~ 2^{-21} at
        log2 p = 256. Separately, the Red Team pins the mean log-log slope from
        the two verified anchors with NO FIT AT ALL: from N(1,p) = h(-4p)/2 plus
        Dirichlet, and fraction = 1 at (p/2)^{1/3},
        s(p) - 3/2 = -2.98/(ln p - 0.693) = Theta(1/log p), giving 1.02 at
        p = 1009 and 1.25 at p = 265207. Every block-restricted fitted alpha
        lands inside the range pinned for its own primes. Consequently
        +-0.20 discrimination first becomes possible at log2 p >~ 22.5, and
        +-0.05 at log2 p ~ 87.
      supported_by: [TASK-20260805-fb72f1]
    - id: O-8
      statement: >-
        The competing alpha = 2 model was refutable AT ZERO COMPUTE: it
        saturates at T ~ 11.6 at p = 265207 while 119 primes carry curves at
        T ~ 50. A genuinely-1.17 asymptotic is excluded by the anchors
        themselves, and the counting-unit explanation moves alpha by only 0.10
        and is excluded as the cause.
      supported_by: [TASK-20260805-fb72f1]
    - id: O-9
      statement: >-
        Reference [35] is Page-Wesolowski, "The Supersingular Endomorphism Ring
        and One Endomorphism Problems are Equivalent", EUROCRYPT 2024, LNCS
        14656, pp. 388-417 — quoted from the frozen text's own reference list at
        line 328. The proceedings chapter was obtained in full. NO EXPONENT IS
        ASSIGNED TO THE REDUCTIONS ANYWHERE: [35, Proposition 8.5] gives
        Isogeny reduces to EndRing in probabilistic polynomial time with degree
        NOT ASSIGNED and oracle-call count NOT ASSIGNED; the frozen source's own
        application of the cascade assigns no cost to the step. Both are
        (log p)^{O(1)} = p^{o(1)}; NEITHER IS p^{epsilon}. GD-1's prediction is
        confirmed as a source reading. The Validator verified all four PDFs
        byte-identical with correct page locators.
      supported_by: [TASK-20260805-c89efb, TASK-20260805-79e700]
    - id: O-10
      statement: >-
        NO 1/4 CONDITION DERIVED BY THIS CAMPAIGN CHANGES under the cascade,
        because p^{o(1)} cannot move an exponent — the Red Team attacked for an
        exponent-carrying step and found none. THREE NON-EXPONENT RIDERS DO
        CHANGE, and they were not previously recorded: (i) GRH enters at the
        Isogeny arrow via Proposition 8.5 but does NOT appear in the frozen
        source's Corollary 1.2 assumptions; (ii) an unstated lambda becomes a
        STANDING CONDITION ON EVERY FUTURE CANDIDATE, since Theorem 7.2 reduces
        EndRing to OneEnd_lambda and a candidate must therefore return
        log deg alpha = (log p)^{O(1)}; (iii) the cascade's only explicit
        exponent, 12 in Omega((log N)^{-12}), propagates to 2^96 - 2^192 at
        log2 p = 256 against a 2^{85.3} headline, SO CONCRETE COST IS NOT
        INHERITABLE ACROSS THE CASCADE.
      supported_by: [TASK-20260805-c89efb, TASK-20260805-fb72f1, TASK-20260805-79e700]
    - id: O-11
      statement: >-
        No literal referent for "[35, Theorem 1]" exists in any obtained
        rendering of [35]; its main theorem is 1.1, stated precisely as 7.2. The
        producer costed both candidate readings without choosing between them
        and the Validator confirmed the absence is true of the obtained
        renderings. IACR ePrint 2023/1399 is recorded UNOBTAINED (HTTP 403,
        Cloudflare challenge, independently reproduced by the Validator) — an
        infrastructure outcome under AGENTS.md rule 5, never a finding.
      supported_by: [TASK-20260805-c89efb, TASK-20260805-79e700]
    - id: O-12
      statement: >-
        The wisde-sieve selection above p = 22000 does NOT invalidate W-MAIN,
        and this was established BY CONTROL rather than by argument: the
        Validator split its own UNSELECTED null at the same p and found
        heterogeneity 0.12543, LARGER than the data's 0.10171, with the
        data-null gap shrinking in the selected block. The heterogeneity is a
        p-range artifact of the window, not the sieve.
      supported_by: [TASK-20260805-79e700]
    - id: O-13
      statement: >-
        A supplementary check the contract did not require, and a much stronger
        normalisation anchor than the one it did: N(1,p) = h(-4p)/2 EXACTLY at
        5377/5377 primes. C-ANCHOR-HIGH passed with 0 violations in 5379 primes,
        119 attaining the bound exactly. C-REPRO and C-SEED passed.
      supported_by: [TASK-20260805-ac12ae, TASK-20260805-79e700]
    - id: O-14
      statement: >-
        M-GRAD (REC-1b, the delta_E-gradient question deciding whether lever L4
        lives) was NOT_MEASURED and returns no verdict: the release carries no
        2-isogeny adjacency. Measuring it needs a different instrument, which is
        what the next action builds.
      supported_by: [TASK-20260805-ac12ae]
  inference: >-
    The batch's primary question is UNDECIDED and cannot be decided by this
    instrument at this scale. What is decided is the instrument itself: the
    frozen window is biased by ~ -0.36, so the supporting branch was unreachable
    at any data, and the null control could not have passed because the
    surrogate shares both endpoints with the real object. D1's exponent is
    therefore neither confirmed nor refuted, lever L1 stays exactly where
    BATCH-001 left it, and the campaign's model-independence confound is NOT
    resolved. Separately and firmly: the [35] cascade carries no exponent, so no
    1/4 condition moves, but GRH, an unstated lambda, and non-inheritable
    concrete cost are now standing conditions the campaign did not previously
    carry.
  boundaries:
    - >-
      M-ALPHA IS VOID AND MAY NOT BE CITED AS EVIDENCE ABOUT D1, in either
      direction, by any record. The Red Team names this explicitly as one of
      four sentences that would turn its CONFIRM-SCOPED verdict into CHALLENGE.
    - >-
      THE NON-FIRING REVERSION IS NOT CONFIRMATION. The reversion requires alpha
      within 2.0 +- 0.20 with C-NULL passing; neither holds, so it did not fire.
      SUPPORTS-D1 did not fire either. Symmetric, and both halves must be stated
      wherever one is.
    - >-
      "C-NULL FAILED" IS A STATEMENT ABOUT THE INSTRUMENT, NOT ABOUT
      SUPERSINGULAR ARITHMETIC. The dataset demonstrably carries arithmetic the
      estimator cannot see: N(1,p) = h(-4p)/2 holds exactly at 5377/5377 primes,
      which no generic ensemble reproduces.
    - >-
      CONCRETE COST IS NOT INHERITABLE ACROSS THE [35] CASCADE (O-10 iii). No
      record may carry a concrete figure from OneEnd to EndRing or Isogeny.
    - >-
      Sub-toy throughout, and the regime the lever lives in is not sampled at
      all (O-7). Nothing here bears on cryptographic scale.
    - >-
      This experiment measured a counting function in a published dataset. It
      attacked nothing, solved no instance, and produces no evidence about
      whether a p^{1/4} algorithm exists or is near.
  unresolved_confounds:
    - >-
      MODEL INDEPENDENCE IS STILL ABSENT, and this batch was the campaign's
      attempt to route around it. All five sessions resolved to one model. The
      external dataset did substitute genuinely external DATA — and the two
      independent null constructions, from different lattice families and
      different code, agreeing to 0.005 on the bias, are the strongest
      cross-check this campaign has produced. But the batch did not answer the
      question it was built to answer, so the confound stands and the campaign
      cap of preliminary is unchanged.
    - >-
      The reviewers disagree on whether the contract's unstated c-tolerance is
      load-bearing (O-6). Unadjudicated by design; the defect is the silence.
    - >-
      D1 ingredient (d) still has no fetched artifact (inherited from
      EV-SSIQ-e43afd, Validator finding V9 of BATCH-001).
    - >-
      "[35, Theorem 1]" has no literal referent (O-11); two readings stand
      uncollapsed.
