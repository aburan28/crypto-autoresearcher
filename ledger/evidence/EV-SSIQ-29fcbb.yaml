  direction: neutral
  direction_note: >-
    NEUTRAL, AND NOT AS A HEDGE. The run's pre-registered decision rule returned
    INCONCLUSIVE mechanically, its primary metric is VOID by its own
    pre-registered null control, and independent validation established that the
    frozen instrument COULD NOT HAVE RETURNED the supporting branch at any data.
    The pre-committed reversion did not fire and D1 is equally not confirmed.
    Anyone reading this record as leaning either way is reading it wrong.
  strength: inconclusive
  strength_note: >-
    inconclusive is the honest label for the PRIMARY question. It is not the
    label for everything this batch established: the instrument calibration
    (O-4, O-5), the C-NULL structural result (O-6), the regime mismatch (O-7)
    and the cascade costing (O-9 to O-11) are all firm findings, independently
    reproduced, and they are what makes this batch worth its budget. The
    campaign-level cap of preliminary from EV-SSIQ-e43afd is unchanged and was
    NOT lifted by this batch (see unresolved_confounds).
  claim_tier: toy
  claim_tier_note: >-
    SUB-TOY, and the sub-toy-ness is itself the finding. The dataset reaches
    log2 p <= 18.0168, below the toy band RQ-SSIQ-9702af declares. O-7 records
    that the regime the lever lives in is not sampled anywhere in it.
  proof_status: empirical_only
  proof_refs:
