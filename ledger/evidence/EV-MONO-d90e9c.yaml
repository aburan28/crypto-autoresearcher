  proof_status: derivation
  proof_status_note: >-
    The (p,t,Z)-completeness claim's validity rests on H-MONO-0f9170's
    closed-form algebraic derivation (an unconditional identity, no
    distributional heuristic — see HEUR-TZ-1's own "none is load-bearing"
    framing). This experiment is a toy-scale, exact-integer CHECK of that
    derivation, independently re-derived from scratch (not merely re-read)
    by both the validator (all seven closed forms, plus a from-scratch
    O(p^2) brute-force cross-check using a genuinely different method than
    the Executor's own code) and the red-team (two full seven-tuples
    reproduced by hand from (p,t,Z) alone).
  proof_refs:
    - ledger/hypotheses/H-MONO-0f9170.yaml#mechanism
    - experiments/EXP-MONO-2a13d7/reviews/validator/validation-report.yaml (independent re-derivation)

  observations:
    - >-
      PRIMARY METRICS: PASS EXACTLY, at every one of 9 panel curves per
      prime (18 total across p=101, p=211), both runs, bit-identical
      (this contract is fully deterministic and seed-free; determinism was
      independently confirmed by the validator via `diff -rq` between the
      two runs, finding exactly the 8 declared timing/path fields differ
      and nothing else). R1 (per-stratum residual against the seven closed
      forms) = 0 on every stratum, every curve. R3 (the three internal sum
      checks: case-A to C(p,2), case-B to p(p-1)/2, double-root to exactly
      p) exact everywhere. The baseline-reproduction check against
      KN-FIND-a8990a Theorem B agreed exactly at every panel curve; the
      validator confirmed this check is not circular (the compared
      quantity, S^2+N^2-(p-Z), is derived independently of this
      experiment's own case-A counts from Theorem B's own stated form).
    - >-
      INDEPENDENT RE-DERIVATION, NOT JUST RE-VERIFICATION. The validator
      wrote a fresh, structurally different implementation (O(p^2)
      brute-force point counting, no Legendre symbols, no shared code with
      the Executor's arm) and reproduced the seven-count tables exactly
      for 4 panel curves across both primes. This rules out a
      shared-implementation-bug explanation for R1=0 (the red team's item
      4 concern), since the two independent implementations use genuinely
      different arithmetic and agree.
    - >-
      O(p) METHOD CONFIRMED, INDEPENDENTLY TIMED. The validator confirmed
      by code inspection (a single `for x in range(p)` loop, no inner
      loop) and by independently re-running and timing the point-counting
      routine (0.334s at p=101, 3.252s at p=211, matching the Executor's
      own 0.337s/3.229s) and by a scaling-ratio analysis (9.74x observed
      between the two primes vs. 9.09x predicted for genuine O(p^3) total
      cost, vs. 19x that an O(p^4) method would show) that the required
      O(p) character-sum method was genuinely used, not a slower method
      mislabeled.
    - >-
      MATCHED-PAIR NON-ISOMORPHISM INDEPENDENTLY VERIFIED. The validator
      brute-forced the full isomorphism criterion (all u in F_p^*) for
      both tested matched pairs and confirmed non-isomorphism; the red
      team separately confirmed no isomorphism criterion (including
      quadratic twists, which do not preserve j) was missed, and that
      j=0/j=1728/supersingular curves were correctly excluded from both
      panels, making the standard u^4/u^6 criterion complete for the
      curves actually tested.
    - >-
      PRE-REGISTRATION ORDERING VERIFIED. The validator confirmed
      structurally (via `run_experiment.preregister_and_run_stage1`'s
      append-then-classify sequencing, per curve) that each panel curve's
      closed-form prediction table was written before that curve's
      Stage-1 base-point enumeration began, satisfying the frozen
      contract's hard invalidation rule on this ordering.
    - >-
      PROVES-TOO-MUCH / VACUITY CHECK: PASSED. The red team verified the
      claim's power is real, not near-tautological given the test
      construction, by confirming genuinely non-isomorphic curves exist
      within shared (t,Z) cells at both primes (not just multiple
      Weierstrass models of one isomorphism class), and by constructing a
      deliberately wrong closed-form prediction (swapped S/N; wrong Z'
      mapping) which its own independent checker correctly rejected,
      validating that the verification method has genuine discriminating
      power.
    - >-
      NOVELTY CHARACTERIZATION (Red Team, requested explicitly). This is a
      LEGITIMATE, LOW-NOVELTY extension of KN-FIND-a8990a's already-proven
      Theorem B, not a hollow or a surprising new result. The case-A
      (split-base) counts are a near-mechanical corollary of Theorem B's
      already-verified ordered-class-count law (H-MONO-0f9170's own
      proof_search_map requires reproducing Theorem B as its baseline
      check, i.e. self-admits this). The case-B (inert-base) counts, using
      the classical fact that F_p^* embeds in the squares of F_{p^2}^*,
      are genuinely new relative to Theorem B's stated ordered-base setup,
      but still a fairly mechanical derivation rather than a surprising
      phenomenon. This characterization is recorded to calibrate the
      strength of the finding honestly: it is real, correct, and
      independently confirmed evidence, at a modest novelty tier.
    - >-
      NAMED LIMITATION (Red Team finding, the reason for `strength:
      strong_with_a_named_design_limitation` rather than an unqualified
      `strong`). The matched-pair non-vacuity control's STRONG form (the
      pair differs on order-3 point count, the invariant H-MONO-0f9170's
      proof_search_map names as the "planted nearby object" -- the
      genuinely informative confounder-rule-out) was NOT exercised by
      either tested pair; both passed non-vacuity only via the WEAKER
      j-invariant-difference criterion. At p=101 this was UNAVOIDABLE by
      the frozen contract as executed: the red team proved, independently
      of the Executor's code, that order-3 point count is forced whenever
      9 does not divide N=p+1-t (Cauchy's theorem), and this holds at
      EVERY one of p=101's 51 populated (t,Z) cells -- the strong form
      could not have fired at this prime regardless of which pair was
      selected. At p=211, 7 of 74 populated cells (630-1050 curves each)
      genuinely have order-3-count freedom, but the frozen contract's own
      deterministic tie-break (preferring a cell containing a Z-coverage
      curve) steered selection into one of the other 67 cells instead.
      This is a WEAKNESS IN THE FROZEN CONTRACT'S OWN SELECTION RULE, not
      an implementation defect, not a falsifier, and not evidence the pass
      is vacuous: j-invariant difference is independently sufficient to
      rule out the "vacuous because isomorphic" confounder (H-MONO-0f9170's
      own confounders list names ONLY that failure mode, which is
      correctly ruled out), so the control is genuinely non-vacuous, just
      not exercised at its strongest available form. A cheap, concrete
      follow-up exists using ALREADY-COMPUTED data from this same run (see
      `disclosed_open_items` in the companion decision) but re-selecting
      the pair now would be a post-hoc change to a pre-registered
      tie-break after Stage-1 numbers have been observed, which the frozen
      contract's own invalidation_rules require to go through a versioned
      protocol amendment rather than a silent re-selection -- so it is
      named as a next action, not performed here.
    - >-
      GOVERNANCE FINDING, DISCLOSED (see coordination/tasks/TASK-20260830-
      832479/snapshot-receipt.json for full detail). A fourth out-of-band
      commit by the external git identity "Cursor Agent" edited this
      contract's specification.yaml AFTER the Executor's run had already
      started (verified by git ancestry: the Executor's start commit
      predates the edit). The Executor never saw this edit and
      independently found and fixed, in its own code, the identical gap
      the edit documents in the spec text (excluding special curves from
      panel-selection candidates before taking the lexicographic minimum,
      not after) -- both archived runs used the Executor's own
      independently-fixed code. The edit's content is otherwise consistent
      with what both the validator (Finding F1: the CURRENT spec text's
      panel-eligibility filter still lacks an explicit t!=0 check, though
      this did not affect this run) and the run's own behavior show. This
      is the fourth such out-of-band edit by this identity found across
      two unrelated goals/experiments this session.
    - >-
      MANIFEST SCHEMA CORRECTION, DISCLOSED (see the same snapshot
      receipt's `manifest_correction_disclosure`). The Coordinator
      restructured both run manifest.yaml files from a flat to the
      required nested schema before archiving (a lossless field remapping
      of the Executor's own reported values; two fields could not be
      losslessly remapped and are recorded null with a pointer to
      environment.json as the source of record). No value was changed,
      invented, or removed.

