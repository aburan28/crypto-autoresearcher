evidence:
  id: EV-SSIQ-e43afd
  hypothesis_id: null
  hypothesis_id_note: >-
    NULL AND CORRECTLY SO. GOAL-SSIQ-001 has minted no hypothesis; BATCH-001 was
    a primary-text and method-ceiling batch and was forbidden from minting one.
    Naming a hypothesis here would invite exactly the inference this batch
    cannot support — that something about the attainability of a p^{1/4}
    algorithm has been tested. Nothing has.
  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  batch_id: BATCH-001
  experiment_ids: []
  run_ids: []
  run_ids_note: >-
    Empty by construction. BATCH-001 authorised zero runs; both producers were
    zero-compute reading and derivation tasks. No solver executed, no curve was
    touched, and no measurement of any kind was taken.
  type: theoretical
  direction: neutral
  direction_note: >-
    NEUTRAL WITH RESPECT TO ANY HYPOTHESIS OF THIS PROGRAM, because none exists.
    The record is not neutral about the research ROUTES it audited: it closes
    lever L1 in a stated scope and repairs the framing of L2-L5. Those are
    method-ceiling verdicts under docs/inventor-protocol.md section 8, not
    evidence for or against a mathematical claim, and the distinction is the
    reason this field reads neutral rather than weakens.
  strength: preliminary
  strength_cap_reason: >-
    CAPPED AT preliminary BY MODEL INDEPENDENCE, not by the quality of the work.
    Both producers, the Validator and the Red Team all resolved to the same
    model identity (claude-opus-5) under this Claude Code binding; policy
    aliases do not resolve, so review-adversarial's xhigh effort floor was
    neither applied nor verifiable and fallback_used is true on every task.
    Independence here is SESSION independence. A shared systematic error would
    not have been caught by any of the four sessions. This is Validator finding
    V1, it was declared in the goal record and the batch opening BEFORE any
    evidence existed, and it binds every record built on this batch.
    One partial mitigation is recorded rather than claimed as independence: the
    Validator anchored D1's most load-bearing ingredient against an EXTERNAL
    primary source it fetched itself (EHL+20, arXiv:2004.11495v2, Theorem 3.9),
    which is evidence from outside the shared model even though the reasoning
    about it is not.
  claim_tier: toy
  claim_tier_note: >-
    The tier is a CEILING ON WHAT THIS RECORD MAY ASSERT, not a description of
    the sources' own scope. AOV Remark 4.3 is an asymptotic statement about all
    p and is cited as such; the D1 derivation is asymptotic; the Validator's
    consistency checks that touch data touch AOV's exhaustive table at
    p <= 265207 (log2 p <= 18), which is BELOW this program's own toy band. No
    statement in this record may be read as a cryptographic-scale finding, and
    no parameter set is assessed anywhere in it.
  proof_status: derivation
  proof_refs:
    - coordination/goals/GOAL-SSIQ-001/batches/BATCH-001/tasks/TASK-20260805-87e568/L1_ceiling_audit.md
    - coordination/goals/GOAL-SSIQ-001/batches/BATCH-001/tasks/TASK-20260805-85af9d/target_conditions.md
    - coordination/goals/GOAL-SSIQ-001/batches/BATCH-001/reviews/VAL-BATCH-001.md
    - coordination/goals/GOAL-SSIQ-001/batches/BATCH-001/reviews/RT-BATCH-001.md
  proof_status_note: >-
    derivation, not certificate. The strongest checkable basis for the L1
    closure is a derivation (D1) plus cited primary text; there is no
    computational certificate because there was no computation. Validator
    condition V3 requires D1 to be transcribed as a derivation wherever it
    travels, and this field is that transcription.
  source_bindings:
    frozen_primary_text:
      path: inputs/P13-WESOLOWSKI-2026/paper_fulltext.md
      sha256_prefix: ca34a0f7
      note: >-
        Byte-identical blob at d8701af5, at 50596409 and at HEAD, independently
        confirmed by the Validator. Both producers and the Validator read the
        same bytes.
    external_sources_fetched:
      - id: AOV
        ref: "arXiv:2607.14624v1 (Aubry-Oyono-Vincent), reference [4] of the frozen text"
        role: "carries the ENTIRE headline exponent via Theorem 4.2 = frozen Theorem 1.5"
        status: fetched_and_re_fetched_byte_identical
      - id: DG
        ref: "arXiv:1310.7789 / DCC 78(2):425-440 (Delfs-Galbraith)"
        role: "the F_p-restricted Otilde(p^{1/4}) figure and the descent cost"
        status: >-
          preprint body obtained (ar5iv); PUBLISHED BODY NOT OBTAINED. The
          published abstract was obtained twice, independently, including a
          first-party publisher landing page in the Validator's session.
      - id: EHL20
        ref: "arXiv:2004.11495v2, Theorem 3.9"
        role: "external anchor for D1 ingredient (c), fetched by the Validator"
        status: fetched
  observations:
    - id: O-1
      statement: >-
        The exponent 1/3 of the archived result decomposes into factors that can
        be moved independently, and the composition was re-derived from primary
        text with 45 line locators. All 45 re-extract verbatim from the frozen
        source AND support what they are claimed to support, on independent
        re-extraction by the Validator (0 mismatches of 45).
      supported_by: [TASK-20260805-85af9d, TASK-20260805-89a2e7]
    - id: O-2
      statement: >-
        Under the re-derived composition T = c*q*d/k + r with source values
        (c,q,d,k,r) = (1,2,1/3,2,0), the total time exponent equals the exponent
        of the Theorem 1.5 degree bound, and memory equals time. Reaching 1/4 is
        exactly one multiplicative movement of 3/4, placeable on c, q or d, or
        inverted to 4/3 on k. The Validator derived the same conditions
        independently BEFORE reading the producer's file and agrees on every
        value.
      supported_by: [TASK-20260805-85af9d, TASK-20260805-89a2e7]
    - id: O-3
      statement: >-
        Two of the four placements are inadmissible for stated reasons, not for
        lack of an idea. c = 3/4 alone forces memory > time. r has NO solution
        at all: it would require P0 = p^{1/12} > 1. Consequently a proposal
        whose saving comes from improving the success probability cannot move
        the exponent — the Red Team tested this by moving B jointly and found
        the cost doubly one-sided (B = p^beta gives T = 1/3 + beta; polylog B
        gives T -> 2/3).
      supported_by: [TASK-20260805-85af9d, TASK-20260805-89a2e7, TASK-20260805-fb72f1]
      scope_narrowing: >-
        This is a statement about the EXPONENT only. Frozen text Remark 1 (line
        191) calls the same phenomenon practically relevant, so the claim would
        overstate if carried to practical impact. Both reviewers endorse the
        narrowing.
    - id: O-4
      statement: >-
        AOV Remark 4.3 states unconditionally that exponent 1/3 is
        asymptotically optimal for a UNIVERSAL bound on the minimal degree of
        E -> E^{(p)}: for every eta < 1/3 and every C' > 0 there exist p and a
        supersingular E with delta_E >= C' p^eta. Re-fetched byte-identical by
        the Validator, with all inequality signs confirmed present — the
        producer's mid-task MathML extraction bug did not reach the frozen
        package.
      supported_by: [TASK-20260805-87e568, TASK-20260805-89a2e7]
      status: cited_primary_text
    - id: O-5
      statement: >-
        A class-number counting derivation (D1) bounds the fraction of
        supersingular curves with delta_E <= p^{1/4} by p^{-1/8+o(1)}, which is
        not p^{-o(1)}. D1 SURVIVED independent re-derivation from scratch: the
        Validator obtained the same bound and resolved the producer's own open
        question on ingredient (c), which contributes (np)^{o(1)} and decisively
        not n^{1/2} — the intermediate-order sum is dominated by f = 1.
      supported_by: [TASK-20260805-87e568, TASK-20260805-89a2e7]
      status: derivation
      pre_committed_reversion: >-
        The producer pre-committed, before review, that if D1 fell then L1
        disjunct 2 reverts to UNRESOLVED while disjunct 1 stays closed. The
        reversion was NOT triggered. Recording it here because a reversion
        condition that is only mentioned when it fires is not a pre-commitment.
    - id: O-6
      statement: >-
        The obstruction this program NAMED for L1 was a category error twice
        over, and both reviewers confirmed it independently. Minkowski/Hermite
        bounds are UPPER bounds and cannot force a floor; and applied to the
        rank-4 object (P, Nrd/p) they yield exponent 1/2, WEAKER than the
        already-known 1/3. The governing object is the rank-3 trace-zero
        sublattice of discriminant p/4 with N_1 = delta_E and
        p/4 <= N_1 N_2 N_3 <= p/2; the 1/3 is 1/rank. The Validator confirmed
        the replacement does the claimed work by reproducing Theorem 1.5's
        CONSTANT: gamma_3 (p/4)^{1/3} = (p/2)^{1/3}.
      supported_by: [TASK-20260805-87e568, TASK-20260805-89a2e7, TASK-20260805-fb72f1]
    - id: O-7
      statement: >-
        The nearby-object control extends the ceiling rather than deflecting it
        for four of five neighbours: other Galois conjugates are degenerate
        (E^{(p^2)} = E over F_{p^2}), twists share the j-invariant and an
        isometric lattice, and small-degree-modified targets E^{(p)}/G obey the
        same bound with the invariant being the PRODUCT mT. The null object — a
        generic supersingular target — gives exponent 1/2, so the method
        distinguishes the intended object from a structure-free surrogate.
        THE FIFTH NEIGHBOUR IS NOT COVERED: N5, structurally different auxiliary
        targets (oriented curves, prescribed-torsion targets, higher-dimensional
        targets).
      supported_by: [TASK-20260805-87e568, TASK-20260805-89a2e7, TASK-20260805-fb72f1]
    - id: O-8
      statement: >-
        The F_p-restricted Otilde(p^{1/4}) figure is a HEURISTIC birthday bound
        for a HIGH-STORAGE bi-directional search, with memory unstated in the
        source body; and the descent stage costs Otilde(p^{1/2}), the source
        itself saying the second stage has no effect on the asymptotic running
        time. KN-TECH-058's RC4 contested-retrieval flag is resolved WITH A
        MECHANISM: arXiv holds one version whose METADATA abstract carries no
        complexity figure while its LATEX SOURCE abstract does, and the
        published Springer abstract is word-for-word the LaTeX one. The split
        was arXiv-metadata-versus-paper-text, NOT preprint-versus-published as
        the corpus conjectured. Both earlier retrievals were correct readings of
        what they fetched.
      supported_by: [TASK-20260805-87e568, TASK-20260805-89a2e7]
      not_established: >-
        The PUBLISHED BODY was not obtained. SpringerLink served a JavaScript
        bot challenge on all three routes in the producer's session; Unpaywall
        and OpenAlex both report the work closed with no open-access location.
        INFRASTRUCTURE OUTCOME under AGENTS.md rule 5, never a mathematical
        finding. The Validator's session was not bot-challenged and obtained the
        publisher LANDING PAGE, confirming the abstract first-party — the body
        remains unobtained and the producer's headline is unchanged.
        The inner F_p search's memory profile is still not obtained, and is now
        known to be ABSENT from the preprint body rather than merely unretrieved.
    - id: O-9
      statement: >-
        A naive k-way split is not free and moves the wrong way: the naive
        k-way collision costs c = k-1, giving T = 2d(k-1)/k = 4/9 at k = 3 and
        1/2 at k = 4, i.e. WORSE than the incumbent 1/3. Found independently by
        the Validator (V4) and the Red Team. This refutes by default the
        headline attraction of lever A1, which the first producer added because
        the Coordinator's L1-L5 enumeration had no lever on split arity at all.
      supported_by: [TASK-20260805-89a2e7, TASK-20260805-fb72f1]
  inference: >-
    Lever L1 — a structural degree bound with exponent 1/4 — is CLOSED IN A
    STATED SCOPE, on one derivation-tier pillar plus corroborating cited primary
    text, for the target E^{(p)} and small-degree-modified neighbours, with case
    N5 NOT COVERED. The Coordinator's exponent budget survived independent
    re-derivation and now supports ranking: the 1/4 target is one movement of
    3/4 on one of four named symbols, two of which are provably unavailable.
    Nothing here bears on whether a p^{1/4} algorithm exists.
  boundaries:
    - >-
      NO STATEMENT ABOUT THE HARDNESS OF THE SUPERSINGULAR ISOGENY PROBLEM IS
      MADE OR IMPLIED. D1 and AOV Remark 4.3 are ceilings on a METHOD — the
      degree-bound route to a lower exponent — not lower bounds on the problem.
      This is the audit's own section 10.3 disclaimer and Validator condition
      V12, carried verbatim into the ledger rather than paraphrased.
    - >-
      The L1 closure is SINGLE-PILLAR AND DERIVATION-TIER, not two pillars of
      mixed status. The Red Team established (objection O1, HIGH) that D1
      SUBSUMES the cited pillar: a universal p^{1/4} bound would force the
      fraction to be 1, contradicting p^{-1/8+o(1)} at every p, which is
      strictly stronger than Remark 4.3's infinitely-often extremal form. The
      cited unconditional pillar closes the disjunct the algorithm never needed.
      Any later record that presents this closure as resting on unconditional
      primary text alone is misdescribing it.
    - >-
      N5 IS OPEN. Structurally different auxiliary targets — oriented curves,
      prescribed-torsion targets, higher-dimensional targets — are not reached
      by the argument, and L1's own wording admits exactly that substitution.
      N5 is minted as its own lever row rather than left inside a CLOSED verdict.
    - >-
      Scoped to the tested objects: supersingular E/F_{p^2}, the target E^{(p)},
      the quaternion lattices actually stated, and the algorithm of the archived
      source. Nothing is scoped to CSIDH-style group actions or torsion-based
      key exchanges, and the source's own affected/out-of-range scheme lists are
      inherited unwidened — both reviewers checked every name and found no
      widening.
    - >-
      The cascade from OneEnd to EndRing and Isogeny runs through reductions
      [35, Theorem 1] and [35, Proposition 8.5], which are NOT in this
      repository and have never been checked by this program. No exponent is
      assigned to them anywhere in this batch. Both producers are clean on this;
      the GOAL-SSIQ-001 record itself is NOT — it states the target on the
      problem reachable only through those uninspected reductions while every
      derived condition is about OneEnd. Recorded as a defect of the goal
      record, repaired by DEC-20260805-2be965.
    - >-
      Toy and sub-toy where data appear at all. The Validator's consistency
      checks touch AOV's exhaustive table at p <= 265207, below this program's
      own declared toy band. No parameter set, no bit-security figure, no
      concrete cost.
  unresolved_confounds:
    - >-
      MODEL INDEPENDENCE IS ABSENT (V1). One model checked itself in four
      sessions. The Red Team states plainly that its own concurrence on D1 is
      not independent corroboration of D1. Resolves only when a genuinely
      different model re-checks D1, or when the Red Team's REC-1 empirical fit
      — which fails DIFFERENTLY from any amount of same-model re-derivation —
      is executed.
    - >-
      D1 ingredient (d), h(D) << |D|^{1/2} log|D|, is the one ingredient with no
      fetched artifact (V9). It is classical Dirichlet theory and
      uncontroversial, and it is recorded as unanchored anyway.
    - >-
      The published Delfs-Galbraith BODY is unobtained, so the inner F_p
      search's memory profile is unknown. Since the F_p route's whole
      attraction is a p^{1/4} ceiling, an unknown memory profile is a live gap
      and not a formality.
    - >-
      Four Validator conditions (V4, V6, V9, V12) and twenty Red Team objections
      travel with this record. All are about how results are TRANSCRIBED rather
      than whether they hold, and all are resolvable inside the repository.
      Three Red Team objections are HIGH: O1 (pillar tier, addressed in
      boundaries above), O6 (the composition law fixes TOTAL = per-attempt x
      P0^{-1} and no lever acts on the multiplication), O7 (L3's obstruction
      states a false generality — k-way splits DO beat the two-list bound in
      general, per Wagner; the claim holds only in the unique-solution,
      no-group setting, and was attached to the wrong symbol).
