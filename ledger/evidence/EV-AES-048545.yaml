evidence:
  id: EV-AES-048545
  hypothesis_id: null
  hypothesis_id_note: >-
    GOAL-AES-003 mints no hypothesis record for this measurement: the RANK 3
    S-box arm is a scope-narrowing control question (is the r=5 yoyo
    AES-S-box-specific?), not a proposition to support or refute, and
    `active_hypothesis_ids` in the goal record is deliberately empty. The
    decision DEC-20260804-73977c carries the official interpretation.
  experiment_ids: []
  run_ids: []
  type: empirical
  direction: neutral
  strength: preliminary
  claim_tier: toy
  proof_status: empirical_only
  proof_refs: []
  proof_status_basis: >-
    Schema slot filled under DEC-20260804-73977c from this record's own committed
    text: the RANK 3 arms are raw measurements of W>=1 coincidence counts in a
    software toy SPN; no certificate or derivation is archived. empirical_only
    with empty proof_refs describes what the record has; it asserts nothing new.

  observations:
    - id: O-1
      text: >-
        Pins (TASK-20260804-f5e58b): AES S-box software SPN passes FIPS-197 C.1
        KAT at r=10 (00112233445566778899aabbccddeeff -> 69c4e0d86a7b0430d8cdb78070b4c55a)
        and the r=5 anchor 4167e8f8367c38cdb7bde2ade620a7a8; 5120/5120 enc/dec
        roundtrips over r=1..10; random S-boxes (seeds 424242201, 424242202)
        bijective and deterministic (C run twice + independent Python
        recomputation; recorded tables byte-identical). Independently re-verified
        by the Validator, including a from-scratch AES implementation.
    - id: O-2
      text: >-
        RANK 2 positive control: with slotmask=0 (all hints true) the sq_slot
        instrument returns per diagonal survivor sets containing the true key
        byte (survivor_histogram {1:4}), vs BATCH-003's {0:4} under false hints.
        The instrument can return a non-empty result; BATCH-003's empty result
        is not an instrument defect.
    - id: O-3
      text: >-
        RANK 3 arms (N=2^32 each, 8 threads, round-5 yoyo, amask=1 smask=1):
        R3-A1 AES W=59 excess 14.75x; R3-A2 random sbox#1 W=58 excess 14.50x;
        R3-A3 random sbox#2 W=51 excess 12.75x (all vs analytic null 4.0 hits,
        Poisson(4) 99% interval [0,12]). All three counts independently
        recomputed by the Validator from raw receipts; no disagreement.
    - id: O-4
      text: >-
        Controls: R3-A4 AES null at r=10 W=3 (0.75x, matches BATCH-002 A3 0.625x);
        R3-A5 AES struct-destroyed amask=15 W=4 (1.00x, matches BATCH-002 A4's 4);
        R3-A6/R3-A7 random-sbox struct-destroyed W=2 and W=4. All inside the
        pre-registered [0,12] pass band. No V-flag on the arms.
    - id: O-5
      text: >-
        Scoped reading of O-3: the round-5 yoyo excess is robust to replacing
        the AES table with a uniformly random bijective table (two independent
        draws, both outside the 99% null interval, same order of magnitude as
        AES). The pre-registered rule only distinguishes "signal far above
        null" from "no signal"; it cannot resolve a 2-3x attenuation (per the
        Red Team's power analysis, the design resolves only relative
        attenuation >= 0.53 at 80% power). Claim boundary: this establishes
        independence within {AES, random uniform bijection}; it does NOT
        establish "any S-box" (identity/affine/single-monomial classes
        untested).
    - id: O-6
      text: >-
        RANK 1 (TASK-20260804-d7d0ec) stamp gap: data content fully validated
        (8 raw JSONL aggregates recomputed, verdict SURVIVES correctly derived,
        matrix M1 non-singular over GF(2^4) re-verified), but budget_stamps.jsonl
        ends at preregistration_written with NO run-section or finish stamps and
        RESULTS.json lacks completion_gate/halted_on_budget. Completion of that
        task is UNSUPPORTED by its stamp stream; the measurement content is
        intact. Repair assessment (TASK-20260806-7a980b) recommends a dual device
        (amended successor stampset + superseding completion record); no event
        requires point-time fabrication.
    - id: O-7
      text: >-
        BATCH-b41ba9 affine arm (TASK-20260806-47f217): with SBOX[i]=i the cipher
        is affine over GF(2). Four 32x32 word maps have ranks 32, 0, 0, 0
        (independently reproduced by the Validator from a from-scratch matrix
        build; D.M = I_128 verified). Pre-registered E[W>=1] per trial = 1.0
        exactly; frozen excess_E = 2^30. Measured at r=5, amask=1, smask=1,
        N=2^32, seed 189001301: W_ge1_nontrivial = 4294967296, excess = 2^30,
        measured/frozen ratio 1.0000000000002. No nonlinearity required for the
        r=5 yoyo excess.
    - id: O-8
      text: >-
        Scope of O-7 (Red Team R3 report + Validator): the excess is NOT
        attributable to the AES S-box values (O-3), NOT to nonlinearity (O-7),
        and decays at r=10 with the same S-box (O-4). The identity/affine arm's
        exact-algebraic agreement means the excess's driver is the SPN round
        structure interacting with the swap-diagonal geometry, not the
        substitution function. Still toy-tier; no claim about AES-128 or
        deployed AES at any scale.

  dominated_by: null
  sota_delta:
    time_exponent: not_applicable
    note: >-
      No attack; measurement/control contribution only. At toy tier, the round-5
      yoyo excess observed in BATCH-002 is reproduced with random bijective
      S-boxes (58/51 vs 59 hits) and EXPLICITLY WITHOUT any S-box nonlinearity
      (identity/affine arm returns exactly the algebraic expectation 2^30 with
      ratio 1.000000), so the AES table's values and even substitution
      nonlinearity are not the cause of this toy phenomenon. Nothing AES-specific
      claimed at any scale; no claim about full-round or deployed AES.

  knowledge_promotion: not_warranted
  knowledge_promotion_reason: >-
    Preliminary toy-tier negative-scope result with an unresolved boundary: the
    "S-box independence" reading is only validated within {AES, uniform random
    bijection}, the RANK 1 stamp gap leaves a completion claim unsupported, and
    the Red Team's cheapest discriminating arm (identity/affine S-box) has not
    run. Promote only after the boundary is resolved and reviewed.

  recorded_by_task: TASK-20260804-f5e58b
  archived_by: TASK-20260804-0e75d5
