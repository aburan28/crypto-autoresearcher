evidence:
  id: EV-ECDLP-3dc2db
  hypothesis_id: H-ECDLP-f8101e
  experiment_ids: []
  run_ids: []
  type: empirical
  direction: contradicts
  strength: preliminary
  claim_tier: toy
  certificate_refs: []
  proof_status: empirical_only
  proof_refs: []
  observations:
    - >-
      L2 found group order, trace, largest prime factor, automorphism count,
      supersingularity, and order-factor features constant within each sampled
      isogeny family; j-invariant and two-torsion rank varied but were not
      stable predictors after controls.
    - >-
      L3 reports no measurable j-invariant effect: zero positive-gain families,
      mean best-vs-base delta 0, and Bonferroni-adjusted p=0.75 on the declared
      toy family comparison.
    - >-
      L4 reports no endomorphism-transfer speedup after forward, inverse,
      preprocessing, and memory costs: all positive-speedup family counts are
      zero and every best net speedup is below 1.0.
    - >-
      The independent reviewer TASK-20260807-b5c6d7 and the red-team audit
      TASK-20260807-94b191 agree that no lane survives the matched controls.
  inference: >-
    The stated j/endomorphism steering hypothesis is contradicted on the exact
    three-family toy boundary: no tested predicate produced an admissible
    end-to-end reduction. This is a scoped negative, not a universal impossibility
    result and not evidence about cryptographic-size curves.
  boundaries:
    - The sampled fields and subgroup sizes are non-cryptographic toy parameters.
    - The corpus is a bounded degree-cap-5 sample, not a full isogeny graph.
    - No asymptotic exponent, deployed-curve security, or hidden-path claim is inferred.
  unresolved_confounds:
    - Larger ordinary prime-field families and other public endomorphism predicates remain open.
    - The separate EXP-ECTD conductor-step experiment measures a different Semaev-meter channel.
    - Non-isogeny ECDLP mechanisms are outside this evidence record.
