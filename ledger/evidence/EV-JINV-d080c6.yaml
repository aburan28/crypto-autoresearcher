        than filled with a plausible number - which the validator calls 'the
        right handling and the strongest thing in this package'.
      severity_reasoning_carried_from_the_validator: >-
        Kept MINOR in the validation report because these are explicitly
        PROPOSALS THAT ARE NOT GRANTS, each carrying experiment_runs_authorized 0,
        none authorized, each requiring its own separately authorized decision,
        handoff and review before existing as work. Kept MATERIAL in the red-team
        report because an unsourced precise number whose only possible use is to
        justify a budget nobody granted is 'the residue of authorization even
        when the authorization words are all correct'. Both readings are recorded;
        neither is collapsed into the other.
    red_team_cost_findings:
      RT_O1:
        ruling: SUSTAINED
        substance: >-
          The gate's 'four gates fail by roughly 1e2 to 1e5' framing presents ONE
          FACT AS FOUR. E7's committed formula is literally
          '3*retained_artifact_bytes_upper', and E7 = 3 x E4 EXACTLY. E5's
          committed formula is 'all_replacement_pairs_upper*256', and that single
          component is 50230103040000 bytes = 99.5658 percent of the entire E4
          retained total. E6's committed formula is
          'ceil(retained_artifact_bytes_upper/536870912)'. So E5, E6 and E7 are
          deterministic functions of E4, and E4 is 99.57 percent one term. The
          gate reproduced E6's committed formula as ARITH-2 but did not carry
          E7's, so this is a SELECTIVE failure to carry provenance, not an
          absence of it.
        direction: CONSERVATIVE - cannot be used to clear the gate
        why: >-
          The single underlying quantity still exceeds the retained cap by ~1.17e4
          on its own. Reporting it strengthens rather than weakens fail-closed.
        forward_value: >-
          ONE LEVER - all_replacement_pairs_upper, 196211340000 pairs at 256 bytes
          each - controls all four gates simultaneously. A design author reading
          the gate as written would believe four separate cap problems must be
          solved. This is the single most useful thing either review produced for
          successor work, and the gate withholds it.
      RT_O2:
        ruling: SUSTAINED
        substance: >-
          E7 is a fixed three-pass model over the retained total, and E5 is
          explicitly the individual-artifact check WITHOUT SHARDING - but E6
          establishes that any admissible design needs AT LEAST 93969 shards
          under the frozen individual-artifact cap. A 93969-way shard-and-merge
          design necessarily re-reads and re-writes across the merge boundary,
          and that I/O is not in a flat 3x multiplier. E5's uncertainty field
          flags the sharding conditionality; E7's never propagates it.
        consequence: >-
          E7 = 151347407533824 IS NOT AN UPPER BOUND FOR ANY DESIGN THAT COULD
          ACTUALLY BE RUN UNDER THE FROZEN CAPS. For admissible sharded designs it
          behaves as a LOWER bound. This is the one place in the estimates section
          where the stated direction of uncertainty is wrong.
        direction: CONSERVATIVE - the true admissible-design I/O is HIGHER
      RT_O12:
        ruling: SUSTAINED_AS_A_NARROW_GAP
        substance: >-
          Communication and sharding-induced I/O are charged nowhere, and the
          single-host assumption that makes that legitimate is never written down
          as an assumption, while E6 requires at least 93969 shards.
        standing_concern_status: >-
          CHECKED AND LARGELY CLEAR. The program's standing concern is that cost
          claims omit what dominates at scale. This package charges peak memory,
          retained bytes, largest single artifact, shard count, logical I/O and
          free disk - not merely time. The gaps are RT-O2's I/O-model
          conditionality and this one, not an across-the-board omission.
    RT_O4:
      ruling: SUSTAINED
      flagged_hardest_by: red team
      substance: >-
        The gate cites the goal head's E14 C1 load precondition TWICE - at
        PB-1.precedent_read and at CT-4.source_read - and BOTH TIMES DROPS the
        committed clause that the host has recently run between load 18 and 116
        on 14 cores and that the whole cost model is a linear extrapolation from
        ONE 128.234 s run. The committed text is rendered as recording load
        averages 'and declining to start above a DECLARED LOAD THRESHOLD'.
      why_it_is_the_sharpest_of_the_cost_findings: >-
        The omitted clause is the SINGLE STRONGEST PIECE OF COMMITTED EVIDENCE
        AGAINST PB-2's linear-extrapolation assumption - the assumption the gate
        itself names, in three separate places, as THE WEAKEST LINK IN THE WHOLE
        PLAN. The gate cites the sentence for the part that supports proposing
        PB-1 and omits the part that impeaches PB-2. A ~6x load spread on the
        intended host is also a ~6x wall-time spread, which silently threatens
        PB-2's uncited 3600 s figure.
      verified_by_string_count: >-
        goal.yaml contains '128.234' 4 times, 'load average 28' once, 'between 18
        and 116' once and '14 cores' 3 times; planning-gate.yaml contains
        '128.234' ZERO times, '116' ZERO times and '14 cores' ZERO times. The five
        '28' substrings in the gate were checked individually and are all
        incidental fragments of larger numerals.
      independently_checked_by_this_adjudicating_session: true
      how_this_session_checked_it: >-
        A read-only content search of planning-gate.yaml for '128.234', '14 cores'
        and 'load average 28' returned ZERO matches for all three.
    RT_O5:
      ruling: SUSTAINED
      substance: >-
        No stopping rule binds the outcome of PB-3, the plan's single most
        consequential proposed item. SR-2's three thresholds gate E1/E2/E3 only;
        SR-3 fires only when a design fits a cap BY TAKING one of the five
        prohibited credits; SR-1 is disk, SR-4 budget, SR-5 recomputation
        disagreement, SR-6 scope escape, SR-7 policy, SR-8 unmeasured control,
        SR-9 one-N transfer. NOTHING binds a PB-3 design against E4-E7.
      concrete_counterexample: >-
        A PB-3 design that reduces retained bytes from 50449135844608 to 5.0e12 -
        a genuine tenfold engineering improvement using NO compression, NO
        deduplication, NO hash-only substitution, NO omitted cell and NO budget
        widening - is still ~1164x over the 4294967296-byte retained cap and still
        needs ~9313 shards against a cap of 24, and triggers NONE of SR-1 through
        SR-9. The plan's own rule set returns no stop.
      why_it_matters: >-
        The general clause promises that each rule 'can fire against the interest
        of whoever is running the work'. For the deliverable most likely to be
        argued about, none can fire at all. A rule set that cannot refuse the
        central deliverable is incomplete.
    RT_O6:
      ruling: SUSTAINED
      substance: >-
        CT-3's null object CANNOT FAIL. Its matched null is the p-rank nuisance
        map contexts (386786400), but the committed formula for
        p_rank_nuisance_total_map_contexts is literally
        'd0_intended_total_map_contexts' - THE CARDINALITY IS COPIED FROM THE
        INTENDED ARM BY DEFINITION, so its equality is evidence of nothing about
        shape. And its destroying parameter is the plant count k with 'at k = 0
        the nuisance and intended arms must be indistinguishable', which at k = 0
        is satisfied by construction because both arms are unplanted. It measures
        a false-positive rate; it never tests whether the null is matched ON
        P-RANK, the only property CT-3 exists to control.
      discriminating_control_named_by_the_red_team: >-
        Hold k FIXED and NON-ZERO and randomize the p-rank across the nuisance
        population, holding every other structure fixed; require the measured
        p-rank effect to vanish. NAMED, NOT AUTHORIZED, and not run by anything in
        this batch.
    RT_O7:
      ruling: SUSTAINED
      substance: >-
        CT-4 WOULD REJECT CORRECT MEASUREMENTS. Its measured quantity is 'any
        per-stage CPU, wall, or peak-memory RATE' and its destroying parameter is
        HOST LOAD, with the rule 'a rate that does not move with load is measuring
        the clock, not the work'. That is right for the WALL rate and wrong for
        the other two: CPU-seconds is substantially load-invariant BY
        CONSTRUCTION - that is why one measures CPU time rather than wall time -
        and peak resident set size is essentially load-invariant. Applied
        literally to a correct CPU-seconds measurement, CT-4 rejects it.
      classification: >-
        A FALSE-POSITIVE control, the exact mirror of RT-O6's control that cannot
        fire. Both are failures of the same discipline.
      fix_named_by_the_red_team: >-
        Bind load-dependence to the WALL rate only and bind CT-4's already-present
        second destroying parameter (cardinality doubling must approximately
        double CPU-seconds) to all three. The second parameter is correctly
        specified and already does the work for CPU and memory. No new measurement
        is required.
    RT_O8:
      ruling: SUSTAINED
      substance: >-
        EV-PRE-1 requires a CURRENT free-disk observation on the declared
        execution host and offers NO alternative, while its siblings do (EV-PRE-2
        ends 'or an explicit statement that they remain underived', EV-PRE-3 ends
        'or an explicit written statement that it cannot'). Its scope is 'evidence
        such a decision would have to see FIRST', where 'such a decision' is ANY
        later authorizing decision - but EV-PRE-3 itself names the two honest
        remaining routes as a separately authorized resource-cap change or CLOSURE
        OF THIS LANE WITH ITS OBSTRUCTION NAMED, and NEITHER requires a statfs.
      why_it_is_the_sharp_edge: >-
        A planning document cannot make a run automatic by authorizing it - this
        one conspicuously does not - but it CAN make a run unavoidable by writing
        the precondition list so that every forward path runs through it. As
        written, a Coordinator who wanted to close this lane tomorrow with its
        obstruction named would be told by this document that it must first see a
        host measurement. That is scheduling pressure inside a boundary
        description. IT IS NOT AN AUTHORIZATION and neither review called it one.
    RT_O9:
      ruling: SUSTAINED_AS_MINOR
      substance: >-
        SR-1's observation is a refreshed free-disk preflight that does not exist,
        so SR-1 cannot fire today and its evaluation presumes PB-1 has run; and
        the ONLY committed observation - 1809797120 bytes free against a required
        26843545600 - already fails SR-1's threshold by exactly 1310720/88369 =
        14.832351x. PB-1's purpose describes this as routine hygiene. It is a
        re-test of a check that currently fails by more than an order of
        magnitude.
      explicitly_not_an_argument_to_skip_PB_1: >-
        The red team states so: 'A cheap measurement that is expected to fail is
        still worth taking, and this report does not recommend against it. What is
        objectionable is budgeting it in language that hides the prior.'
    validator_OBJ_2:
      ruling: SUSTAINED_AS_AN_UNDER_CLAIM
      substance: >-
        Obligation 3's note says the contract's field `equality_included: true`
        'is not a literal field name in the committed source' and downgrades it to
        a paraphrase. IT IS A LITERAL FIELD NAME: it occurs in
        experiments/EXP-JINV-bd141d/amendments/v5-derivation-fixtures.json (the
        validator counts 4 occurrences) and IS A KEY OF THE STORED
        p_value_numerator OBJECT ITSELF, the object independently re-derived in
        both orders as {"denominator": 20001, "equality_included": true,
        "plus_one": true, "reference_equal_count": 1,
        "reference_greater_or_equal_count": 10000, "value": 10001}. It also
        appears at ledger/decisions/DEC-20260813-d14d6b.yaml line 289.
      direction_of_error: >-
        CONSERVATIVE. The producer UNDERSTATED the strength of its own binding.
        Nothing was overclaimed.
      independently_checked_by_this_adjudicating_session: >-
        A read-only content search confirms the literal string `equality_included`
        is present in v5-derivation-fixtures.json (at least one occurrence; this
        session did not recount the validator's figure of 4). The presence is the
        only fact the objection needs.
    RT_O10:
      ruling: SUSTAINED_AS_AN_UNDER_CLAIM
      substance: >-
        The preservation manifest declares its own central number unverifiable
        without a validator run: 'recomputing a 441350-node census requires
        running the committed public validator, which this zero-run task does not
        do.' The premise is incorrect. The census requires only parsing the
        committed fixture and traversing it with exact type() tests - a static
        read of committed bytes. THE RED TEAM PERFORMED IT WITH ZERO RUNS and
        obtained exact agreement in all six categories, and reproduced the
        manifest hash 20ab60e1... by reimplementing the algorithm from the READ
        source without executing the pinned module.
      why_it_matters: >-
        Premature closure and overclaiming are symmetric failures. Here the
        package UNDER-claims its own verifiability, leaving obligation 8's central
        number carried as unverified when it was cheaply checkable.
    RT_O11:
      ruling: RECORDED_AS_INFRASTRUCTURE_SIGNAL_ABOUT_CUSTODY_NOT_RESOLVED_HERE
      substance: >-
        snapshot-receipt.json declares nine post-commit verification requirements
        'of the dispatching session', among them 'path_sha256 filled for all four
        keys'. In the durable record those four values, and commit_sha and
        parent_sha, are all null, and exactly one commit has ever touched the
        receipt, so no later commit filled them and none can without superseding.
      it_is_not_negative_evidence: >-
        This is INFRASTRUCTURE SIGNAL, never negative mathematical evidence about
        JINV, transport, isogeny classes, an instrument, a curve, a prime, or
        ECDLP, in either direction, at any scale. Leaving the values null rather
        than fabricating them was the CORRECT call and is explicitly right under
        the no-fabrication rule; the defect is that the filling step never
        happened afterwards.
      what_the_validator_established_that_narrows_it: >-
        The content binding for this archive DOES EXIST - it lives in the
        BATCH-25e27c queue archive block, filled by the dispatching session at
        commit 23c66739aa192e52fcb2007bae647d106bc46bed - and ALL FOUR VALUES
        THERE WERE INDEPENDENTLY RECOMPUTED AND MATCH. The red team likewise
        computed all four artifact hashes and confirmed snapshot == HEAD ==
