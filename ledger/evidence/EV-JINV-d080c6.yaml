  # --------------------------------------------------------------- obstruction
  obstruction:
    statement: >-
      The declared EXP-JINV-bd141d Phase B workload does not fit the frozen
      resource caps, and the shortfall is not four independent problems but ONE:
      a single term, all_replacement_pairs_upper = 196211340000 replacement pairs
      at a declared 256 bytes each, accounts for 99.5658 percent of the entire
      retained-byte requirement, and the other three failing gates are
      deterministic functions of that total (logical I/O = 3 x retained; largest
      individual artifact = the term itself; shard count = ceil(retained / cap)).
      No implementation, tuning, parallelism or admissible design choice changes
      this: the retained-byte gate alone requires roughly a 1.2e4-fold reduction
      in that one quantity before ANY of the four gates can pass.
    quantity: >-
      retained_artifact_bytes_upper against the frozen retained_artifact_bytes
      cap, as an exceedance ratio, together with the fraction of that total
      contributed by all_replacement_pairs_upper
    value: >-
      retained_artifact_bytes_upper = 50449135844608 bytes against a cap of
      4294967296 bytes: exceedance 197066936893/16777216 = 11746.104770x (exact
      rational, recomputed independently by both reviewers). The single
      controlling term contributes 50230103040000 bytes = 99.5658 percent of that
      total. Dependent gates: largest individual artifact 50230103040000 bytes
      against 536870912 (93560.857773x); shard count 93969 against a cap of 24
      (3915.375x, exactly 31323/8); total logical I/O 151347407533824 bytes
      against 274877906944 (550.598661x). Free disk, separately, 1809797120 bytes
      observed against 26843545600 required (14.832351x short) - but that
      observation is an INHERITED, UNREFRESHED v3 statfs and is NOT a present-tense
      fact about any host.
    value_basis: >-
      EXACT INTEGER ACCOUNTING FROM COMMITTED DECLARED UPPER BOUNDS, NOT A
      MEASUREMENT OF A RUNNING SYSTEM AND NOT A MEASUREMENT OF A MATHEMATICAL
      OBJECT. Error bars are inapplicable and none are asserted: these are
      declared cardinalities times declared per-item serialization byte bounds,
      composed by committed formulas. The chain was reproduced independently
      twice - the validator traced it three levels and recomputed all eight
      retained-byte subtotals, all thirteen cross-binding resolutions and the
      five exceedance factors; the red team rederived all 26 committed formula
      fields in v4-cost-worksheet.json exact_cardinalities and reproduced the
      eight-component sum. Zero mismatches on either side. The chain TERMINATES in
      nine per-item byte constants and a frozen_dimensions block that are
      ASSERTED in an approved, previously reviewed committed artifact; anyone
      relying on these figures relies on that approval.
    measured_by:
      - EXP-JINV-bd141d
    measured_by_note: >-
      NO RUN ID EXISTS AND NONE IS CLAIMED. run_ids is empty and this batch
      executed zero runs. The value is read from the committed contract artifacts
      of EXP-JINV-bd141d - experiments/EXP-JINV-bd141d/amendments/v4-cost-worksheet.json
      (sha256 169e7a5579cba7c2f525bddaee5287ede8fb0d78a92d39c951253d8813836ae0)
      and v6.yaml unchanged_resource_gates - and recomputed from them, which is
      why the experiment id is named here and no run id is.
    scope: >-
      The declared Phase B workload of EXP-JINV-bd141d ONLY, at the frozen v4/v3
      cardinalities and the v3 frozen resource caps, under the UNSHARDED
      serialization model the committed worksheet states, on a single declared
      execution host, for the one-N matched-order family N = 19507 at claim_tier
      toy. It is claimed for nothing else: not for a second N (none exists), not
      for any other experiment, not at cryptographic scale, not for JINV as a
      technique, and not for ECDLP in either direction. Under RT-O2 the logical-I/O
      figure is an upper bound for the UNSHARDED model only and behaves as a LOWER
      bound for any admissible sharded design, so the obstruction is if anything
      understated in that one component.
    resource_check:
      examined: true
      reading: >-
        THE REVERSAL WAS CHECKED AND ONE READING WAS FOUND, and it is the most
        useful output of this batch. Read as an asset rather than a wall, the
        collapse of four gates onto one quantity (RT-O1) says the design space has
        ONE controlling dimension, not four: any future implementation-design work
        has a single lever - all_replacement_pairs_upper - and a single scalar
        target, a ~1.2e4-fold reduction, against which any candidate design can be
        scored on paper in minutes with zero runs. The cheapest confirmation is a
        zero-run static perturbation of the committed formula chain (reduce
        all_replacement_pairs_upper alone by a factor f and recompute E4-E7): if
        all four move together, the single-lever reading is confirmed; if they do
        not, RT-O1 is refuted. THIS SESSION DID NOT PERFORM THAT PERTURBATION - it
        has no shell and it is not among this task's deliverables - and it is
        carried as the first item of the single next action rather than dropped.
        A second reading was considered and NOT taken: that the overshoot is
        evidence about the JINV mechanism itself. It is not. It is a fact about a
        declared serialization budget, and reading it as a mathematical result in
        either direction would be exactly the inference this record forbids.
      spawned_ids: []
      spawned_ids_note: >-
        EMPTY AND HONESTLY EMPTY. No IDEA-* or H-* record has taken this
        obstruction as a resource, and creating one is not authorized by this
