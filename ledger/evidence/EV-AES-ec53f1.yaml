  strength_basis: >-
    MODERATE, with the strength located exactly where the red team placed
    it. The census itself carries NO empirical weight about AES: the
    identity-law census is flat BY CONSTRUCTION (the pair-difference map
    in the affine limit is the identity, DE=id), so the 100/100 census
    match confirms the self-consistency of the instrument's convention,
    not a property of AES (red-team J2; the record's own disclosed
    confounder). The empirical weight sits in (i) the keyed bridge,
    2500/2500 trials including both known-false controls, and (ii) the
    single fixture arm at (r=6, A={0}, S={0}) at full 2^30: hits = 2^30
    with T = 0 trivial trials, W = 3 on 100% of nontrivial trials,
    excess ratio 1.0 exact against the frozen excess_E = 2^30 -- the
    affine-limit instrument is ALIVE at AES's death round under the
    carried comparator. The independent validator confirmed every number
    with zero discrepancies on fresh-code re-derivation (full rho table
    from record definitions, byte-level CAL-DET replication with the
    identity law at 65536/65536, recomputed KAT pins, recounted
    receipts, byte-identical double-runs of the committed binary).
    Strength stays moderate rather than strong because: one fixture arm
    at one seed (seed variance of the AES-side excess is on record, 14
    vs 19, EV-AES-5478a0 OBS-B16-3); empirical law coverage is
    r in {2, 5, 6} only, with r in {1,3,4,7,8,9,10} resting on the
    r-free derivation conditioned on a convention formula KAT-anchored
    at r=5,10; and cross-lineage identification (the record's B3 audit)
    is NOT discharged -- the producer line is single-lineage fresh code
    sealed by KAT pins and source-diff against the archived affine
    lineage.
  claim_tier: toy
  claim_tier_basis: >-
    Reduced-round AES-shaped SPN probe geometry, r <= 10 census and one
    r=6 arm, 64-bit halves, trials at 2^30 for the single fixture arm,
    one seed (46063001). No crypto-scale, medium-scale, affected-scheme
    or asymptotic claim is made or implied, and no comparison to
    published cryptanalysis is made in either direction (RQ-AES-003 R3).
  certificate_refs: []
  proof_status: empirical_only
  proof_refs: []

  observations:
    - id: OBS-FE0-1
      statement: >-
        GATE 0 + CENSUS: THE REPAIRED IDENTITY-MAP OBJECT IS
        SELF-CONSISTENT AND THE CENSUS IS FLAT BY CONSTRUCTION. Gate 0
        passed under fresh code: ranks (32,0,0,0) of the archived
        object, D5*M5 = M5*D5 = I128, word-0 map column-equal identity
        with words 1-3 zero, P = 1.0 exact, 1000 keyed trials with
        q0^q1 = p0^p1 on 1000/1000 and W = 3 on 100% of nontrivial.
        All 100/100 frozen cell-instances matched the preregistered
        flat table (rank pattern 32*[j in A], W = 4-|A|, P(W>=1) = 1
        for |A| <= 3 and 0 for |A| = 4; D_r*M_r and M_r*D_r = I128 for
        every r = 1..10; every rho value reproduced including
        degenerate rho = 0 cells); the table digest was committed
        pre-arm and verified unchanged post-arm; r*_aff is undefined
        within r <= 10. PER THE RED TEAM'S J2 AND THE RECORD'S OWN
        DISCLOSED CONFOUNDER, THIS FLATNESS IS A CONVENTION
        SELF-CONSISTENCY RESULT: the census checks the instrument's
        convention formula against itself and carries no empirical
        weight about AES. It is recorded because it validates the
        repaired object and the gate, not because it discriminates.
    - id: OBS-FE0-2
      statement: >-
        KEYED BRIDGE: the identity law and the W law held on 2500/2500
        keyed trials (5 cells x 500), including both preregistered
        known-false controls: the structure-destroyed cell read W = 0
        on 500/500 and the degenerate rho = 0 cell read 500/500
        trivial swaps. This is the empirical content of the law at
        r in {2, 5, 6} within the probe geometry.
    - id: OBS-FE0-3
      statement: >-
        FIXTURE ARM AT THE DEATH ROUND: at (r = 6, A = {0}, S = {0}),
        the census-predicted-alive cell at AES's death round, the
        affine-limit instrument read hits = 2^30 (T = 0 trivial
        trials, E[T] = 0.25) at full 2^30 exposure (seed 46063001, 8
        threads, 48.7 s), W = 3 on 100% of nontrivial trials, wword =
        [0,N,N,N], excess ratio 1.0 exact against the frozen excess_E
        = 2^30. Against the carried comparator (AES dead at r = 6),
        the single factor differing between the alive-at-r=6 and
        dead-at-r=6 measurements is the S-box (n = 1 nonlinear S-box
        at r = 6). KAT pins (FIPS-197 C.1 + BATCH-003 r5/r10 anchors)
        pass; determinism byte-identical at 1 and 8 threads; the C
        worker was independently replicated by a Python stream.
    - id: OBS-FE0-4
      statement: >-
        SCOPE-NARROWED READING (adopts the red team's restatement):
        the instrument's affine-limit pair-difference map is the
        identity, verified by gate, bridge, and one 2^30 arm; the
        census is convention self-consistency with zero cipher
        compute; empirical law coverage is r in {2, 5, 6}; the r = 6
        death round is NOT CARRIED by this pair-difference map. The
        phrase 'nonlinearity-driven destruction' is claimed ONLY as
        the single-factor contrast reading of OBS-FE0-3 (alive affine
        arm vs dead AES at r=6, factor = the S-box), NOT as a general
        mechanism theorem: this census's pair-difference object is not
        all linear geometry, and the record's declined one-sided
        statistic remains a live linear candidate. The residual
        carrier e = (q0^q1)^(p0^p1) is a NAMED UNMEASURED CANDIDATE
        (the record's heuristic H2), not an established carrier --
        nothing in this batch measures e under a nonlinear S-box
        (red-team J5).
    - id: OBS-FE0-5
      statement: >-
        VALIDATION AND RED TEAM: the independent validator (fresh
        session, fresh code, zero producer-code reuse, 4/4 runs)
        CONFIRMED the verdict with zero discrepancies: full rho table
        re-derived from record definitions, byte-level CAL-DET
        replication with the identity law at 65536/65536, recomputed
        KAT pins, all receipts recounted, committed-binary double-runs
        byte-identical, affine guard refuses non-identity, snapshot
        65ad479df verified 39/39 by hash (two false flags during
        validation were validator-owned check bugs, fixed and
        disclosed). The independent red team (fresh session, blind to
        the validator) returned verdict-must-narrow: no joint
        falsifies the verdict; J2/J4/J5 overclaims named and adopted
        in OBS-FE0-4; the proves-too-much control PASSED (the argument
        correctly predicts death on both in-geometry known-false
        cells, B4 W=0 500/500 and B5 500/500 trivial, and does not
        transfer to the known-dead Feistel substitute of
        EV-AES-dec938/EV-AES-5478a0 because premise D-affine fails
        there -- that non-transfer is derivation-only, with a named
        empirical guard: identity-law bridge on the substitute,
        seconds of compute). The red team supplied 7 boundary
        falsifiers, recorded below as unresolved confounds.
  tested_parameters: >-
    Probe: r <= 10 census (pure sparse GF(2) algebra, zero cipher
    compute) over the frozen 100-cell set; keyed bridge 5 cells x 500
    trials; one fixture arm at (r=6, A={0}, S={0}), seed 46063001,
    full 2^30 trials, up to 8 threads (determinism verified). 64-bit
    halves, campaign probe geometry. Comparator: the carried frozen
    comparator/excess_E = 2^30 convention (AES dead at r=6 under it).
  actual_scope: >-
    One probe geometry, empirical law coverage r in {2, 5, 6}, one
    fixture arm at one seed at 2^30. The death-round statement is
    scoped to this pair-difference map and the carried comparator: the
    r=6 death round is not carried by the map. No claim about other
    linear objects (the one-sided statistic is explicitly out of
    scope), other substitutes, other seeds, other exposures, or any
    deployed cipher.
  transfer_assumptions: >-
    None beyond the stated scope. In particular: NO transfer of the
    alive-at-r=6 reading to a general 'nonlinearity destroys the
    excess' theorem (single-factor contrast only); NO transfer of the
    candidate carrier e to an established carrier (unmeasured under a
    nonlinear S-box); NO transfer of the identity law to substitute
    families (derivation-only non-transfer, empirical guard named).

  unresolved_confounds:
    - >-
      Seed variance of the AES-side excess (14 vs 19 hits, EV-AES-5478a0
      OBS-B16-3): the verdict inherits the comparator side's one-sided
      pooled bound. Cheapest control: second-seed/key arm rerun, ~49 s
      (red-team J3).
    - >-
      Empirical law coverage is r in {2, 5, 6}; r in {1,3,4,7,8,9,10}
      rest on the r-free derivation conditioned on the convention
      formula KAT-anchored only at r = 5, 10. Cheapest control:
      preregistered census extension r = 11..16 plus one r = 16 keyed
      cell, seconds (red-team J1).
    - >-
      The 'nonlinearity-driven' reading rests on one factor contrast;
      a random-bijection arm at r=6 that reads ALIVE would kill it.
      Cheapest control: one r=6 random-bijection arm at 2^30, ~2-4 min
      (red-team J4). Cross-lineage audit B3 is not discharged
      (single-producer-lineage fresh code sealed by KAT pins +
      source-diff).
    - >-
      The candidate carrier e is unmeasured under a nonlinear S-box;
      its carrier status is heuristic H2. Cheapest control: one r=5
      AES arm logging per-trial wt(e) (red-team J5; bcb117's first
      ramp point).
    - >-
      The identity law's non-transfer to the dead Feistel substitute
      is derivation-only. Cheapest control: identity-law bridge on the
      substitute, seconds (red-team proves-too-much guard).
    - >-
      Seven boundary falsifiers named by the red team stand against
      this record: future committed r=6 excess; alive random-bijection
      at r=6; affine deviation; non-flat census at r >= 11; identity
      law holding on the Feistel substitute; isotropic-large-e
      residual; cross-lineage B3 failure.

