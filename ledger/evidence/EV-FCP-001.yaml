  observations:
    - >-
      72 runs (9 precompute, 27 fixed, 27 naive, 9 rho), all
      completed_valid. Bit sizes 8/10/12/14/16, seeds 1/2 (bits 12 has only
      seed 1), factor base 14, m=2 S_3 decomposition, sympy Groebner solver,
      Python 3.13.1, macOS arm64.
    - >-
      Precompute cost is negligible: median 0.000146 s per curve (min 0.000106,
      max 0.000195, n=9).
    - >-
      Per-target wall-time (mean, s): bits 8 fixed 0.105801 vs naive 0.045763;
      bits 10 fixed 0.050504 vs naive 0.093672; bits 12 fixed 0.050618 vs naive
      0.040923; bits 14 fixed 0.060108 vs naive 0.051790; bits 16 fixed
      0.079249 vs naive 0.057301. The direction of the fixed-vs-naive ratio is
      inconsistent across bit sizes.
    - >-
      Decomposition success is identical between fixed and naive at every bit
      size: 4/6 at bits 8, 3/6 at bits 10, 0/3 at bits 12, 0/6 at bits 14, 0/6
      at bits 16.
    - >-
      All 9 Pollard-rho baselines solved (6-123 group operations) with verified
      discrete-log certificates.
    - >-
      Control comparability verified: all 27 matched fixed/naive pairs at the
      same (bits, seed, target_index) use identical curve_id and target points.
      Rho baselines use the same curves at matched (bits, seed).
    - >-
      The Coordinator independently recomputed four certificates (two
      decomposition, two discrete-log at bits 8 and 16) from scratch using
      independent curve arithmetic; all confirmed correct.
    - >-
      Protocol governance gaps: no specification.yaml (no frozen, approved
      protocol, no pre-defined success threshold or falsification criterion);
      dirty: true on all 72 runs (manifests reference commit 16c37dcf which is
      a ledger-only commit; the harness code was first committed in e648670d
      after the runs); no formal hypothesis record; no execution_report.
  inference: >-
    No robust constant-factor improvement from fixed-curve factor-base
    preprocessing over per-target rebuilding was observed across the tested toy
    prime-field instances (8-16 bit, 2 seeds, factor base 14, m=2 S_3
    decomposition, sympy Groebner solver). Factor-base construction is not the
    dominant cost at this scale: precompute time (~0.0001 s) is orders of
    magnitude smaller than Groebner solving time (~0.04-0.11 s), and the
    fixed-vs-naive wall-time ratio is inconsistent in direction across bit
    sizes. Decomposition success is identical between modes. The absence of a
    preprocessing win at toy scale does not imply absence at larger scale, and
    the protocol governance gaps (no frozen protocol, dirty code) prevent a
    scoped rejection of the preprocessing direction.
  boundaries:
    - >-
      hypothesis_id binds to RQ-ECDLP-001 because no formal H-* hypothesis
      exists; the experiment measures S_3 decomposition cost behavior at toy
      prime-field scale. The preprocessing aspect also relates to RQ-ECDLP-002
      (multi-target, preprocessing, and memory-time tradeoffs).
    - >-
      Claim tier is toy (max field bits = 16, well under the 32-bit toy
      ceiling). Nothing supports medium-scale, cryptographic-scale, or
      universal ECDLP claims.
    - >-
      Only factor base size 14, m=2, 3 targets per curve, and 2 seeds (1 for
      bits 12) were tested. The result does not bound behavior at other
      parameterizations.
    - >-
      No frozen protocol existed, so there is no pre-defined success threshold
      against which to test the null. The observation is descriptive, not a
      scoped rejection.
    - >-
      dirty: true on all runs means the exact code that produced the results is
      not captured by the manifest commit SHA; the harness code was first
      committed in e648670d after the runs. This limits reproducibility
      guarantees.
    - >-
      The Wall-time metric includes Python/sympy overhead and is measured on a
      single macOS arm64 machine; absolute times are not comparable across
      hardware. The fixed-vs-naive comparison within the same machine is valid.
  unresolved_confounds:
    - >-
      No pre-defined success threshold means the null result cannot be
      interpreted as a falsification of a specific prediction.
    - >-
      The dirty code state means the exact harness version is not pinned; a
      re-run at the committed code (e648670d) might produce slightly different
      timings.
    - >-
      Only 2 seeds (1 for bits 12) and 3 targets per curve were tested; the
      wall-time distributions are noisy and dominated by single-target
      outliers (e.g., the 0.343 s fixed b8-s1-t1 run).
    - >-
      The experiment does not separate factor-base construction cost from
      Groebner solving cost in the naive wall-time; both are included in the
      single wall_seconds metric. However, the precompute runs show
      construction is ~0.0001 s, so this conflation is unlikely to affect the
      comparison.
  reviewed_by: coordinator
