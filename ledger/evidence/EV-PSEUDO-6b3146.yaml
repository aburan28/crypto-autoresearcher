    - id: O-1
      text: >-
        H-PSEUDO Fourier constant C across four prime sizes (full k-range DFT):
        p=1009: C≈3.0; p=4001: C≈3.5; p=9001: C≈3.7; p=50021: C≈3.84.
    - id: O-2
      text: >-
        C grows SLOWER than O(log p): expected log ratio at p=50021/1009 = 1.56
        but actual C ratio = 1.28. Best fit: C ~ p^{0.055} (very slow power law).
        Alternatively C ~ O(sqrt(log p)) or C ~ O((log p)^{0.5}).
    - id: O-3
      text: >-
        H-PSEUDO implication at crypto scale (p=2^256): Even with C ~ p^{0.055} =
        2^14 ≈ 16384, the yield error O(C^7/N^{1/2}) = O(2^{98}/2^{128}) = O(2^{-30})
        is negligible. The Semaev yield bound holds at crypto scale for any C = poly(log p).
    - id: O-4
      text: >-
        The H-PSEUDO conjecture is empirically supported in the form:
        max_k |hat{1_F}(k)| ≤ C(p) * sqrt(B) where C(p) grows very slowly with p.
        C ≈ p^{0.055} at toy scale (p=1009..50021).

