  derivation_note:
    author: coordinator (review DEC-20261016-6b0e53), hand derivation from run.py and the contract
    notation: >-
      E: y^2 = x^3 + x + 1 over F_p. F is the frozen factor base: the set of x in
      {0, ..., floor(sqrt p) - 1} with x^3 + x + 1 a square in F_p, as in run.py
      factor_base(). For x1 != x2,
      S3(x1, x2, X) = (x1 - x2)^2 X^2 - 2((x1 + x2)(x1 x2 + 1) + 2) X
      + (x1 x2 - 1)^2 - 4(x1 + x2), as in run.py summation_s3(). The
      decomposing count c(p) is the number of X in F_p with S3(x1, x2, X) = 0
      for some pair x1 < x2 in F. The contract's fraction is c(p)/p.
    steps:
      - id: D1
        status: proved
        text: >-
          Exact bound. For x1 != x2 in F_p, S3(x1, x2, X) is a polynomial in X
          whose leading coefficient (x1 - x2)^2 is nonzero, so it has at most 2
          roots in F_p. Taking the union over the C(|F|, 2) unordered pairs gives
          c(p) <= 2 * C(|F|, 2) = |F|(|F| - 1), so the fraction is at most
          |F|(|F| - 1)/p. This holds for every prime and does not use the run.
      - id: D2
        status: hand-computed
        text: >-
          Factor-base sizes, from Legendre symbols of x^3 + x + 1 for x below
          floor(sqrt p): |F| = 5 at p = 101, 6 at p = 211 and 9 at p = 307 (the
          sets are listed under validity_check.independent_rederivation).
      - id: D3
        status: proved given D2
        text: >-
          The band is unreachable. The fraction is at most 20/101 = 0.19802 at
          p = 101, 30/211 = 0.14218 at p = 211 and 72/307 = 0.23453 at p = 307.
          The band's lower edge is 0.25, so the smallest possible abs_error is
          0.30198, 0.35782 and 0.26547. "Every abs_error <= 0.25" was impossible
          at each prime before execution. "Every abs_error > 0.25" was certain,
          provided the planted identity held. H-ECDLP-a1fc69 as stated is false
          at each of the three primes.
      - id: D4
        status: proved given D1
        text: >-
          The same holds for every p, up to Weil-bound fluctuation. About half
          of the floor(sqrt p) candidate x have a square right-hand side, so
          |F| ~ sqrt(p)/2 and |F|(|F|-1)/p ~ 1/4. For this factor base, the
          fraction over all of F_p cannot approach 1/2 at any large prime. The
          "about half" step is the standard character-sum estimate; it is
          recalled, not re-proved here.
      - id: D5
        status: heuristic (random model), labelled inference
        text: >-
          Where the 1/2 comes from. With a factor base of points
          {P : x(P) < B}, the point count is |F_pts| ~ 2|F| ~ B = p^beta. The
          heuristic p^{m beta - 1}/m! is the expected number of unordered
          factor-base decompositions of a random POINT of E(F_p), which has
          about p elements. Read as a fraction it differs from the contract's
          quantity in two ways. (a) Denominator: the contract divides by p, the
          number of all x in F_p. Only about p/2 of those x are x-coordinates of
          points, which halves the leading term to 1/4. (b) Saturation: an
          expected count of 1/2 per target is not a probability. Under a
          Poisson model the fraction of targets with at least one decomposition
          is about 1 - e^{-1/2} = 0.393 over x-coordinates of E, or 0.197 over
          all of F_p. The formula p^{m beta - 1}/m! approximates the fraction
          only when it is much smaller than 1. At beta = 1/2, m = 2 it equals
          1/2.

  observations:
    - id: O-1
      text: >-
        Working-tree values (unpublished RUN-ECDLP-06bb83 raw-result.json). The
        counts are exact and deterministic, so they have no spread.
        p = 101: |F| = 5, pairs 10, c = 17, fraction 0.168317, abs_error 0.331683.
        p = 211: |F| = 6, pairs 15, c = 28, fraction 0.132701, abs_error 0.367299.
        p = 307: |F| = 9, pairs 36, c = 61, fraction 0.198697, abs_error 0.301303.
    - id: O-2
      text: >-
        planted_s3_zero is true at every prime. The planted pairs are (0, 3),
        (0, 2) and (0, 2), with x_sum 92, 169 and 142.
    - id: O-3
      text: >-
        Every recorded c(p) is at or below the D1 bound |F|(|F|-1): 17 <= 20,
        28 <= 30 and 61 <= 72. Bound minus count is 3, 2 and 11.

  comparison:
    - >-
      Against the preregistered criteria, taking the unpublished values at face
      value: every abs_error is strictly above 0.25 and the planted identity
      holds, so the contract's falsification criterion fires. By D3 that
      reading was fixed by the frozen factor base before execution.
    - >-
      Against the D1 bound: all three counts are consistent with it (O-3).
    - >-
      Post-hoc model, NOT preregistered and NOT a test: a Poisson model
      with |F|(|F|-1) draws over about p/2 x-coordinates (#E(F_p) taken as
      about p; #E was not computed) predicts fractions 0.164, 0.124 and 0.187
      against the recorded 0.168, 0.133 and 0.199. This only motivates the
      successor contract's normalization. It is not evidence for the heuristic,
      because the model was chosen after the values were seen.
    - >-
      Against the index-calculus baseline and the matched rho: not applicable.
      This is an enumeration count of decomposable targets with no relation
      collection, linear algebra or ECDLP cost. No improvement over the
      index-calculus baseline is measured (AGENTS.md "Every improvement is a
      success"). The distance remaining to the matched rho is not measured by
      this experiment.

  inference: >-
    H-ECDLP-a1fc69 as stated is false at p = 101, 211 and 307 (D1-D3). The cause
    is the hypothesis's normalization, not the decomposition behaviour of E: it
    compares a fraction over all of F_p, using a factor base of about sqrt(p)/2
    x-values, with an expected decomposition count per point (D5). That
    comparison could not succeed at any prime (D4). The reproduction check that
    IDEA-20261009-f24f8a requires, namely that the enumeration baseline
    reproduces p^{m beta - 1}/m!, has therefore not been performed. The data
    neither support nor weaken it. A successor contract needs a target set that
    matches the formula (x-coordinates of points of E(F_p), with the
    denominator computed exactly), a prediction that accounts for saturation or
    a beta small enough that p^{m beta - 1}/m! is much smaller than 1, an exact
    |F|(|F|-1) ceiling stated in advance, and a checker that does not import the
    driver.

  boundaries:
    - >-
      One curve, y^2 = x^3 + x + 1 over prime fields with p = 101, 211 and 307
      (7 to 9 bits). m = 2, beta = 1/2, the size factor base
      x < floor(sqrt p) with square right-hand side, unordered-pair enumeration
      only. No SAT, Groebner or Coppersmith solver. No exponent fit.
    - >-
      The contradiction is of the literal hypothesis statement under its own
      normalization. It is not a statement about p^{m beta - 1}/m! as a
      per-point decomposition heuristic, about m >= 3, about any other beta,
      or about any solver's cost.
    - >-
      No ECDLP cost is measured. No improvement over the index-calculus
      baseline is measured or claimed. The distance remaining to the matched
      rho is not measured. The generic exponent 1/2 is untouched.
    - Nothing here is a statement about the security of any curve.

  unresolved_confounds:
    - >-
      The D5 normalization reading is heuristic, and the post-hoc Poisson
      agreement is not preregistered. Whether the enumeration reproduces the
      idea's formula under the correct normalization is untested.
    - >-
      #E(F_p) was not computed for the three primes. Each is about p, within
      2*sqrt(p) (Hasse), so the "about p/2 x-coordinates" figure in D5 and in
      the post-hoc model is approximate.
    - >-
      The decomposing counts 17, 28 and 61 have not been independently
      recomputed (V-6). The derivation and the decision do not depend on them.
    - >-
      D1-D4 have not been re-derived by an independent agent.
    - >-
      The trial-plan source_sha256 binding (V-4) and the session's report of
      exit 0 are unverified in this review.

  obstruction:
    statement: >-
      For a size factor base F = {x < B : x^3 + ax + b is a square} with
      m = 2, the number of x in F_p that decompose over F is at most
      |F|(|F|-1). Since |F| ~ B/2, at B = floor(sqrt p) the fraction over all
      of F_p is at most about 1/4, so it cannot be within 0.25 of 1/2. This is
      a fact about the hypothesis's normalization, not a block on the
      decomposition approach.
    quantity: >-
      Upper bound on the decomposing fraction over all of F_p,
      |F|(|F|-1)/p (dimensionless), and its distance below the band edge 0.25
    value: >-
      Exact, derived, no error bars. 0.19802 (p = 101, |F| = 5),
      0.14218 (p = 211, |F| = 6), 0.23453 (p = 307, |F| = 9). The band edge is
      missed by at least 0.05198, 0.10782 and 0.01547. The recorded
      (unpublished) fractions are 0.168317, 0.132701 and 0.198697.
    measured_by: [EXP-ECDLP-422afc]
    measured_by_note: >-
      The bound is derived from the frozen contract parameters (D1-D3), and the
      |F| values were hand-computed. RUN-ECDLP-06bb83 agrees with it but is
      unpublished and not cited.
    scope: >-
      y^2 = x^3 + x + 1 at p = 101, 211 and 307, m = 2, B = floor(sqrt p),
      fraction over all of F_p. D1 holds for every p and curve. The about-1/4
      asymptote (D4) holds for this factor-base shape at any large p.
    resource_check:
      examined: true
      reading: >-
        Yes, the bound is a resource. D1 is an exact ceiling c(p) <= |F|(|F|-1)
        that a corrected stage-0 contract can state in advance as a
        nearby-object control and a method ceiling (KN-TECH-080 item 4). D5
        turns the miss into the corrected hypothesis: about 1 - e^{-1/2} over
        x-coordinates of E(F_p) at beta = 1/2, or the first-order formula at a
        smaller beta. Both are inputs to the successor design named in
        DEC-20261016-6b0e53. No IDEA or H record has been spawned yet. The
        successor H is written by /design-experiment.
      spawned_ids: []

  sota_delta:
    time_exponent: unchanged
    note: >-
      No cost, exponent or constant is measured or claimed. The contract forbids
