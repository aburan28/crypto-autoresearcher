  knowledge_promotion:
    promoted: []
    not_warranted: >-
      The methodological pattern here (a stopping rule's mechanism-level
      validity does not by itself bound its practical discriminating power
      against a plausible alternative, and a diagnostic that always fires
      under the alternative can still fire non-trivially under the null) is
      a real and potentially reusable point, but it is fully captured in
      RT-20260811-35ab34, RT-20260811-cb3211 and this record; a standalone
      corpus entry is not warranted until or unless a v3 amendment's repair
      is itself reviewed and this exact pattern recurs elsewhere in the
      campaign, consistent with DEC-20260811-a4c7ec's own
      knowledge_promotion.not_warranted reasoning for the same lane.

