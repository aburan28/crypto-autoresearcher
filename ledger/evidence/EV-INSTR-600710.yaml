  scope: >-
    NARROW. This evidence bears on H-INSTR-444c7b's OWN HEUR-INSTR-2 ("the
    empirical sampling distribution... is an adequate reference for the
    redesigned SR3 gate: a faithful reproduction... lands inside the declared
    central interval... and a materially different measurement does not")
    and, through it, on amendment v2's subordinate HEUR-INSTR-4 (the specific
    ordinary-noise mechanism amendment v2 proposes to rescue HEUR-INSTR-2's
    validation route after RUN-INSTR-36c8cf-phaseA-v2-57ca9a's F4 firing at
    p=4001). It does NOT bear on H-INSTR-444c7b's H1 (two-directional NULL-C/
    chi-square control), H2 (NULL-C's within-class disqualification) or the
    scheduling-cost claim of H3 -- none of those are touched by R3/R4. It
    makes no curve-side, within-class or between-class claim of any kind.
    claim_tier toy, sota_delta 0 on every axis.

  summary: >-
    R3 (leave-one-out jackknife exceedance reanalysis of the committed 48-seed
    reference-sampling data, plus a row-level correlation test) and R4 (a
    Student-t(df=5) null-object control replicated 500 times through the
    IDENTICAL, unmodified sr3v3.interval_for_rung/stability_check/
    z_from_coverage pipeline functions the real characterisation uses) were
    executed per RT-20260811-35ab34's required controls and
    DEC-20260811-a4c7ec's next_actions. Both an independent Validator
    (VAL-20260811-bc336d, verdict passed) and the same Red Team that filed
    RT-20260811-35ab34 (RT-20260811-cb3211, explicitly not dissenting)
    reviewed the run; this Coordinator independently re-derived a further
    subset of the numbers by hand before either review returned. All three
    independent checks agree on the headline numbers.

    HEADLINE (qualified per both reviews, not as first reported). The
    Student-t(df=5) null-object control reaches accepted_rung within the
    declared 8-rung ladder in 94/500 = 18.8% (95% CI approx [15.4%, 22.2%])
    of independent replications, versus 485/500 = 97.0% (95% CI approx
    [95.5%, 98.5%]) for a matched-shape Gaussian control -- this accept-rate
    contrast is the SHARP, well-supported discriminator, confirmed
    independently three ways (executor, Validator via full-record
    recomputation and a 12-replication spread-out spot-check, this
    Coordinator via a from-scratch replication-0 reproduction). This
    empirically confirms, as a pre-registered prediction (RT-20260811-35ab34's
    own counterexample_or_mutation, filed before this run existed), F1's
    structural finding that E3/T2 as currently specified does not by itself
    discriminate HEUR-INSTR-4 from a heavy-tailed alternative.

    THE SECONDARY, EXCEEDANCE-COUNT DIAGNOSTIC IS WEAKER THAN FIRST FRAMED.
    The Student-t(5) arm's terminal-rung exceedance count is constant at its
    structural maximum (26/26, all 13 rows both sides) in all 500
    replications -- confirmed genuine (not a code defect) by three
    independent checks, most rigorously the Validator's from-scratch
    5000-trial-per-rung-size Monte Carlo showing the true per-side in-sample
    exceedance probability is already ~99.7-99.8% at n=768 and ~100% at
    n=1536 for this distribution. But the SAME diagnostic also hits its
    literal maximum in 61/485 = 12.6% of the matched-shape GAUSSIAN arm's own
    accepted replications (mean 21.6/26 even when not maximal), independently
    verified by this Coordinator directly from r4-gaussian-calibration-
    optional.json. A fixed threshold on this diagnostic ("reject if
    exceed_total==26") would therefore misfire against the well-behaved arm
    at a non-negligible rate; the diagnostic carries real signal in aggregate
    incidence but is not a clean binary separator, and required repair R1
    (binding D1/D2 into T2's acceptance condition) is NOT solved by simply
    thresholding this specific proxy.

    TWO FRAMING CORRECTIONS FROM THE RED TEAM, BOTH VERIFIED. (i) The
    "matched-variance, apples-to-apples" design language in the task handoff
    and execution report is inert to every reported number: interval_for_rung
    (mean +/- z*sd), stability_check (a RELATIVE half-width change) and the
    exceedance check are all exactly invariant under positive affine
    transforms of the input, proved analytically and confirmed by the Red
    Team's own byte-identical re-run of the first 50 replications at loc=0,
    scale=1. Only distribution SHAPE and sample size affect any outcome here;
    the per-row scale/location matching did no comparability work and should
    not be cited as though it did. (ii) The exceedance metric R3/R4 report is
    a narrower proxy than amendment v2's own D2 text (change E9), which
    defines the diagnostic as the FULL COUNT of per-seed ratios outside the
    interval, not just whether the single row extreme (min/max) falls
    outside -- disclosed by the executor as an underspecified judgment call,
    confirmed by the Validator as a real (not silent) simplification worth
    the Coordinator's notice for any future implementation of R1.

  direction: weakens
  direction_note: >-
    WEAKENS confidence in the specific claim that reaching accepted_rung
    under the CURRENT, unrepaired amendment v2 acceptance rule (E3/T2 alone)
    would validate HEUR-INSTR-2/HEUR-INSTR-4 the way the amendment's own text
    claims. It does NOT weaken H-INSTR-444c7b's other claims (H1, H2, the
    scheduling-cost half of H3), does not establish HEUR-INSTR-4 is FALSE
    (i.e. does not show the real per-row distribution at p=4001 actually IS
    heavy-tailed -- that remains V1's still-inconclusive charge), and does
    not by itself decide whether the SR3 v3 gate redesign is the right
    architecture -- only that its acceptance rule, as currently specified,
    needs the named repairs before a rung it accepts can be trusted to mean
    what the amendment says it means. Consistent with, and adding empirical
    weight to, RT-20260811-35ab34's already-recorded qualified dissent.

  strength: preliminary
  strength_note: >-
    Preliminary for several independently-stated reasons, all named by at
    least one of the two independent reviews: (1) exactly ONE heavy-tailed
    alternative was tested (Student-t, df=5) against the Gaussian null, not a
    swept family showing how discriminating power degrades toward the
    Gaussian limit as tail-heaviness is dialled down (Validator limitation);
    (2) no pre-registered, campaign-declared acceptable false-accept-rate
    exists anywhere in this campaign's records against which 18.8% could be
    judged sufficient or insufficient to settle the dissent in either
    direction -- R2(i), still undischarged, is where that target belongs
    (Red Team required_controls); (3) the exceedance-count diagnostic's own
    discriminating power is itself only partially characterised by this run
    (aggregate incidence rate known: 100% vs 12.6%; a clean per-replication
    rule is not); (4) this evidence bears on the AMENDMENT'S acceptance-rule
    adequacy, a step logically prior to and distinct from HEUR-INSTR-4's own
    truth value, which V1 already found inconclusive and this run does not
    revisit. Toy scale throughout (13 density rows, fb sizes 4-22, seed
    counts up to 1536, pure statistical simulation); no transfer to
    cryptographic scale is claimed or implied.

