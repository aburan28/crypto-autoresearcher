        independently re-derived a third way via a from-scratch 5000-trial
        Monte Carlo, which also refuted the two alternative (non-heavy-tail)
        explanations this Coordinator's dispatch prompt asked it to consider.
        Scope discipline (amendment untouched, reference runs byte-identical,
        frozen pipeline files unmodified, no ledger/hypothesis edit,
        claim_tier/certificate accurate) independently confirmed via git diff
        and sha256 recomputation, not asserted.
    red_team:
      id: RT-20260811-cb3211
