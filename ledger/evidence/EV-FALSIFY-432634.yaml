evidence:
  id: EV-FALSIFY-432634
  hypothesis_id: H-FALSIFY-40538b
  question_id: RQ-FALSIFY-a2c501
  experiment_ids: [EXP-FALSIFY-d770c1]
  run_ids: []
  run_ids_note: >-
    A reproduction check against archived vendor data already committed to this
    repository. The computation is six lines of arithmetic over two .out files
    and is quoted in full in the observations.
  findings_under_test: [KN-FIND-012, KN-FIND-014, KN-FIND-031]
  type: analytical
  direction: supports
  direction_note: >-
    Supports all three records; every number checked reproduces exactly. The one
    adverse observation is about LINKAGE between them, not about any of their
    contents.
  strength: strong
  claim_tier: laboratory_implementation_conformance
  claim_tier_note: >-
    A reproduction of archived measurement data, not a cryptographic claim. This
    record asserts nothing about ML-KEM or Kyber security.
  proof_status: certificate
  proof_status_basis: >-
    Exact recomputation from the committed data files; every figure decided, none
    sampled.
  proof_refs:
    - experiments/EXP-MLKEM-011/vendor-lock/data/Pwrong_q241_m40_n43_nfft8_kfft3_nlat35_beta032_beta144_N25971.out
    - experiments/EXP-MLKEM-011/vendor-lock/data/Pgood_q241_m40_n43_nfft8_kfft3_nlat35_beta032_beta144_N25971.out
  recorded_at: '2026-08-08'

  observations:
    - id: O-1
      text: >-
        FIRST PROBE IN THIS PROGRAM OUTSIDE ECDLP. Every earlier probe tested
        elliptic-curve or harness records. This one tests the ML-KEM / lattice
        cluster, which matters because a defect pattern found only in one domain
        may be a property of that domain's authors rather than of the corpus.
    - id: O-2
      text: >-
        KN-FIND-012 REPRODUCES EXACTLY, all six table entries, from the archived
        vendor data. last T with Pwrong>0: recorded 1802, measured 1802.
        log2(Pwrong) at that floor: recorded -35.70, measured -35.7045. Pgood
        min / median / max over n=4000: recorded ~6668 / ~11964 / ~17823,
        measured 6668 / 11964 / 17823 -- exact, not approximate. Fraction of
        Pgood with T <= 1802: recorded 0, measured 0.
    - id: O-3
      text: >-
        KN-FIND-031's ARITHMETIC VERIFIES TO FULL PRECISION. That record is
        WITHDRAWN pending rule 12 review but states "Nothing below is retracted
        as arithmetic". Checked: the floor value in the data is 1.786031e-11, and
        1/(N * q^k_fft) = 1/(4000 * 241^3) = 1/55,990,084,000 = 1.786031e-11.
        Identical. So the -35.70 floor is EXACTLY the estimator's sampling
        resolution limit, not a property of the distribution, which is precisely
        what KN-FIND-031 claims.
    - id: O-4
      text: >-
        KN-FIND-014 REPRODUCES EXACTLY TOO, and it is a correct and important
        repair. It identifies that the vendor's Pwrong path divides by k_fft and
        the Pgood path does not, so the two archives are on different scales.
        Aligning by k_fft=3: Pgood min aligned recorded ~2223, measured 2223;
        median recorded ~3988, measured 3988; fraction inside recorded 0,
        measured 0; T-gap aligned recorded ~421, measured 421.
    - id: O-5
      text: >-
        THE LINKAGE DEFECT, NOW QUANTIFIED. KN-FIND-012 references neither
        KN-FIND-014 nor KN-FIND-031, both of which amend it (EV-FALSIFY-2feed0,
        0 of 7 targets link back). The cost is concrete: a reader of KN-FIND-012
        alone computes the T-gap as 6668 - 1802 = 4866. The correct aligned value
        is 2223 - 1802 = 421. That is an 11.57-fold overstatement, obtained by
        reading a current, unsuperseded record exactly as written. This is the
        sharpest instance of the linkage defect found so far and the only one
        with a number attached.
    - id: O-6
      text: >-
        A SMALL IMPRECISION IN KN-FIND-014, reported for accuracy rather than as
        a defect of substance. Its summary says "the raw T-gap was overstated by
        factor 3". The SCALE factor is exactly 3 and that is verified
        (6668/3 = 2223). But the quantity its own table labels "T-gap" changes
        from 4866 to 421, a factor of 11.57, because subtracting a fixed 1802
        does not scale linearly. Both statements are true of different
        quantities; the sentence conflates them, and it understates its own
        correction.
    - id: O-7
      text: >-
        KN-FIND-012 IS UNUSUALLY WELL SCOPED and it is worth saying so. It
        carries `confidence: provisional`, tags itself `contested`, and lists
        four explicit non-claims including "Does not prove Approx 4.9 false in
        the bulk; it bounds what Fig 4.1 covers" and "Not a key-recovery break of
        ML-KEM / FIPS 203". Its qualitative conclusion -- that the experimental
        backup measures Pwrong only on a T-interval that does not meet the
        Pgood operating threshold -- survives the alignment correction intact,
        because the aligned fraction inside is still 0.

  interpretation: >-
    Three records, three exact reproductions, in a domain this program had not
    touched. The ML-KEM cluster is in as good a state as the best ECDLP records,
    and KN-FIND-012's non-claims section is the most careful encountered under
    this question. The defect is again linkage, not content: 012 is amended by
    014 and 031 and points at neither, and reading it as written yields a number
    11.57 times too large.

  what_this_does_not_establish: >-
    Nothing about ML-KEM or Kyber security, nothing about whether Approximation
    4.9 holds, and nothing about the Carrier dual attack's correctness. This
    checks that three corpus records report their own archived data accurately;
    all three say explicitly that they are not security claims and this record
    repeats that. It also does not re-run the vendor's simulation: the .out files
    are taken as given, so a fault in their generation is invisible here and
    would have produced a self-consistent archive. KN-FIND-013 and KN-FIND-015
    were currency-checked but NOT reproduced; they remain open.

  dominated_by: not_applicable_methodological
  sota_delta:
    time_exponent: not_applicable
    note: No algorithmic claim.

  proposed_correction: >-
    (a) Record on KN-FIND-012 that it is amended by KN-FIND-014 (scale
    alignment) and, if rule 12 review restores it, KN-FIND-031 (floor
    interpretation) -- the build-time back-link index proposed in
    EV-FALSIFY-2feed0 covers this without touching an immutable record.
    (b) In KN-FIND-014, separate the scale factor (3) from the T-gap factor
    (11.57) in the summary sentence. (c) KN-FIND-031's arithmetic is now
    independently confirmed, which is one input its pending rule 12 review will
    want. Coordinator authority throughout.

  knowledge_promotion: not_warranted
  knowledge_promotion_reason: >-
    A reproduction adds no new content. The linkage lesson is already recorded in
    EV-FALSIFY-2feed0; this instance supplies a number for it, which belongs in
    evidence.

  scope_limits: >-
    The Fig 4.1 left-panel archives at q=241, m=40, n=43, n_fft=8, k_fft=3,
    n_lat=35, beta 32/44, N=25971, nb_iteration=4000. One parameter set. The
    second archived Pwrong file (n=50, beta 35/41) was not examined.

  independent_review_required: false
  independent_review_note: >-
    Supports every record checked and asserts no new claim; the computation is
    six lines over two committed files.

  authority_note: >-
    Evidence only. No hypothesis status changed, no finding edited or
    superseded, and no view offered on KN-FIND-031's pending rule 12 review
    beyond confirming its arithmetic (AGENTS.md rule 1).
