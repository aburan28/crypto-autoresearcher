      vacuous without solutions). Its guards are sampled: the arm-agnostic
      constructor exercised by PS0 on 5,551 satisfiable instances per D;
      C-SELF rows; J1 bit-identity on 6 unsat instances; J6/J7 on 38 unsat
      instances; and 17 independent J8 constructions, 9 with explicit
      certificates. The 84% rate is therefore sample-certified, not
      exhaustively certified.
    - >-
      THE "NOT REACHED" 16% (62 of 386) may be an artifact of the plain
      Macaulay closure (no reuse of degree-fallen polynomials) rather than a
      genuine D* > 4. RC-1 decides this.
    - >-
