  inference: >-
    (1) STRICT REPLAY. At this cell, no unsat subgroup target reproduced a
    reference's whole strict trace. The predefined P-GPU survival threshold
    (retention >= 0.5) was not met over the tested instances, parameters,
    solver and budget. At the fixed-schedule level this is exact (O-2). At
    T_strict it is empirical, from one run.
    (2) C2'S MECHANISM. The instability is not "many near-independent
    balanced pivots multiplying to 2^{-K}". It is the rank of the affine
    pivot forms saturating at n within the first few dozen live pivots,
    with every later dependent form forced to hazard 0. HEUR-CERTBIN-TS1 as
    written is false at this cell. Its balance clause survives on
    rank-increasing pivots, but only on 8 distinct low-weight forms.
    (3) T_SET REPLAY. It fails DEC-20260923-b85c30 NA-5's retention
    conjunct at this cell, though it passes the saving conjunct. By NA-5's
    text, regime B (Stage 2) is the only remaining route for P-GPU. No
    closure is recorded (tripwire).
    (4) S_3 SPECIFICITY. The instability is not S_3-specific (zero against
    zero). The T_rank spread and the "1 in R_4" signal ARE S_3-specific at
    this cell.
    (5) "1 IN R_4". A sound one-sided degree-4 unsatisfiability signal
    covers 84% of the unsat subgroup-target arm. Its mechanism beyond one
    exhibited linear consequence is open. It is a resource reading (see
    obstruction.resource_check), not a verdict.
  exact_scoped_claim: >-
    At n = 17 (F_2[t]/(t^17 + t^3 + 1)), m = 2, l = 9 (V = {deg < 9},
    polynomial basis), on one random ordinary curve (A = 97044,
    B = 126251, #E = 4 * 32603), with the declared fixed-shape D = 4
    multilinear Macaulay elimination (declared row order, descending
    degrevlex columns with the constant last, and the column-major
    smallest-original-row pivot rule), the following was observed.
    (a) No unsatisfiable-arm subgroup target (0 of 386; 0 of 347 for the
        modal reference) reproduced the whole T_strict trace of any
        unsatisfiable or modal reference, and divergence began at step 0
        or 1. The predefined strict-replay survival threshold was not met
        over the tested instances, parameters, solver and budget.
    (b) Each reference's fixed-schedule replay survives on exactly one
        x_R, its own (K_rank = 17 = n).
    (c) T_set retention was 0, so T_set replay did not meet NA-5's
        retention conjunct.
    (d) 324 of 386 unsatisfiable targets carried a degree-4 Macaulay
        refutation, against 0 in the same-support nulls and 0 on every
        satisfiable instance.
    (e) HEUR-CERTBIN-TS1 as formally stated is false at this cell on every
        repeated-form pivot (derivation). Its frozen DR-4 label remains "not
        supported, not falsified".
    Nothing here bears on other n, curves, V, orders, m = 3, regime B, F4
    traces, any deployed curve, or any ECDLP cost.

