  obstruction:
    statement: >-
      About the OBJECT, at this cell. In regime A (Weil descent to F_2 with
      field equations), every fixed-schedule replayed Macaulay pivot entry
      is an affine form in the 17 target bits. For every learned reference,
      the linear parts of those forms reach full rank n = 17 within the
      first 86-90 live pivots, out of about 2670. So:
      - a learned reference's fixed op schedule is valid for exactly one
        target, the reference itself;
      - the whole T_strict trace of an unsat reference is reproduced by no
        other unsat subgroup target;
      - the T_set trace is reproduced by none either.
      A learned trace carries no replayable structure beyond the first 1-2
      pivot steps for other targets.
    quantity: >-
      (i) K_rank, the F_2-rank of the replayed pivot forms' linear parts,
      which gives the survival-set dimension n - K_rank. (ii) Unsat-arm
      whole-trace retention at T_strict and T_set against each unsat and
      modal reference. (iii) The median first-divergence fraction f_div.
    value: >-
      (i) K_rank = 17 of 17 for all 6 references at D = 3 and D = 4. This is
      exact, with no error bar, and the survival-set dimension is 0 (a single
      point, x_R(ref)).
      (ii) T_strict: 0/386 (U1, U2, U3; CP95 [0, 0.0095]) and 0/347 (modal;
      CP95 [0, 0.0106]). T_set: 0/386 at D = 4, and <= 0.0052 at D = 3.
      (iii) Median f_div 0.000374 or 0, i.e. step 0 or 1 of about 2670.
    measured_by: [RUN-CERTBIN-3b7e05, EXP-CERTBIN-4e92d7]
    measured_by_note: >-
      The values are read from the archived per-target and per-pivot records
      of RUN-CERTBIN-3b7e05, recomputed by VAL-20260923-a679de (J3), and
      reproduced by exact forms in RT-20260923-29e7af (J4) and by the blind
      re-derivation (J6, compared in J7).
    scope: >-
      n = 17, f = t^17 + t^3 + 1, m = 2, l = 9, V = {deg < 9} (polynomial
      basis), one curve (A = 97044, B = 126251, h = 4, q = 32603), subgroup
      targets (x(2E), r_0 = 0), the declared D = 4 (and D = 3) multilinear
      Macaulay elimination with the declared orders and pivot rule. It is
      claimed nowhere else: not other n, curves, V, row or column orders,
      pivot rules, m, regime B, or F4 traces. It is NOT a lane closure. The
      tripwire (review-plan tier_ruling; TASK-20260923-918a6d LC-2) requires
      a review-breakthrough round and replication before any closure of
      regime-A strict or T_set replay.
    resource_check:
      examined: true
      reading: >-
        Taken over from RT-20260923-29e7af J8 resource_check and extended by
        the Coordinator. Three theories take the measurements of this run
        as their HYPOTHESIS rather than their refutation.
        (1) PROPOSITION S / E3-STYLE LOCALISATION WITHOUT REPLAY. "1 in R_4"
        is a sound one-sided unsatisfiability certificate: sound by theorem
        (C1), with 0 false rejects in every family, and 9 of 9 sampled
        certificates verified. A fixed-shape, branch-free masked D = 4
        elimination that reads only the constant-column pivot bit would
        reject 84% of unsat subgroup-target attempts at this cell and never
        a satisfiable one. It needs no trace, so this obstruction does not
        touch it. Its readout entropy, h(324/993) = 0.91 bit, is within
        P7's bound. COST, CHARGED: at m = 2 it is dominated by oracle A
        (512 root-findings against 3.3-3.5 x 10^5 data-dependent full-row
        XORs of 4048 bits, or 11,836,352 masked). Its value is conditional
        on m >= 3 or the chained regime, where direct enumeration costs
        2^{(m-1)l} and the rate is unmeasured.
        (2) SEMAEV'S ASSUMPTION 1 (KN-LIT-fa346d via KN-OPEN-d218ec, kb).
        This cell lies on its diagonal (m = t = 2, k = 9 = ceil(17/2)). A
        degree-4 refutation of 84% of the unsat arm is the assumption's
        content at work, not a test of it. The 16% "not reached" is not a
        counterexample (Macaulay closure weaker than F4 step degree;
        KN-OPEN-d218ec gap (B)).
        (3) KOSTERS-YEO LOW FIRST FALL DEGREE (KN-LIT-7604, kb,
        abstract-level). The exhibited linear consequence is a degree-2 fall
        on these exact instances. It is consistent with the reported
        group-morphism mechanism, which is not verified.
        COORDINATOR EXTENSION: the obstruction itself (K_rank = n, hence a
        point survival set) is the hypothesis of no replay design in regime
        A. But it IS the hypothesis of the Stage 2 (regime B) design: over a
        large base field the pivot entries are polynomial rather than
        F_2-affine in the target, and Schwartz-Zippel-type stability (the
        idea's H2) is what regime B tests. This measurement is the regime-A
        baseline that Stage 2's stability claim must beat, and it is how the
        rerank reads it.
