  proof_refs: []
  observations:
    - "DIAGNOSIS COMPLETE and machine-checked (RUN-a, n=9 seed=1 anchor cell).
       (1) The sem-vs-null column asymmetry exists at EVERY degree (ncols
       sem/null: D3 544/936, D4 3,056/4,038, D5 11,032/12,615, D6
       29,332/31,180) — it is not D6-specific. The column-formation law is
       exact on both arms at all degrees: cols(D) = the up-closure of the
       equation supports with degree slack (m covered iff some eq monomial
       m' subseteq m with |m|-|m'| <= D-deg_i), ZERO cancellation/parity
       deviation. The sem misses only top-slice monomials (1,584 degree-5 at
       D5; 1,848 degree-6 at D6), concentrated in balanced block
       compositions ((2,1,1,1)-type and all 126 pure-u quintics at D5;
       (2,2,1,1)-type 6x162, (6,0,0,0) 84, (3,1,1,1)-type at D6) — its
       block-structured supports contain no high-degree sub-monomials in
       those patterns; the null's coverage improves with D (missing
       52/10/1/0) because slack grows."
    - "(2) sr_pred semantics pinned exactly: the pinned semireg_rank_pred
       computes H(z) = (1+z)^nb / PROD_i (1+z^{d_i}) truncated-positive (its
       in-place loop == the formal series == every recorded receipt
       180/1,674/9,504/28,068 at D3..D6); the textbook Bardet series
       (1,683/9,675/28,239) does NOT match the measured nulls. HF at n=9:
       [1, 18, 144, 645, 1566, 738, 0, ...]."
    - "(3) THE BREAK IS THE FREEZE DEGREE, not the support. The series'
       freeze degree (first HF = 0) is D6 at n=9, D7 at n=12, D8 at n=15,
       D9 at n=18 (freeze = n/3+3 on this lattice). At the freeze degree the
       semi-regular model predicts the quotient stops growing (frozen at
       3,112 dims at n=9), but a real generic system's quotient collapses to
       its variety size. Variety ground truth (full 2^18 enumeration):
       |V_sem| = 6 (= 3! decomposition orderings), |V_null_old| = 1. The old
       null's D6 rank is EXACTLY ncols - |V| = 31,180 - 1 = 31,179 (full
       saturation); the sr_pred overshoot 3,111 = 3,112 - 1 = frozen
       predicted quotient minus |V|. Fall arithmetic: the null's D6 row
       space contains ALL 12,615 nonconstant degree-<=5 polynomials (>=
       3,111 fall dims beyond its D5 row space); the sem's contains >=
       10,576 (>= 1,981 fall dims beyond its D5 row space). The null's
       extra_6 = 4,986 non-model syzygies are the collapse syzygies: 3,111
       accounted for by the D5-quotient collapse; the remaining 1,875 are an
       OPEN exact decomposition (conjecture: top-slice relations induced by
       the collapse)."
    - "CORRECTED NULLS ALL FAIL AT D6 (the mission's anticipated clean
       finding). N0 (pinned old null, determinism rerun) reproduces
       RUN-EXP-SIG-005-k EXACTLY (rank 31,179, extra 4,986; c2 anchors PASS;
       rank == ncols - |V| machine-confirmed). N2 (forced vanishing at a
       seeded random z) fails IDENTICALLY — consistency is not the operative
       variable (the old null was already consistent, |V| = 1). N1, the
       mission's literal corrected construction — D6 column set EXACTLY
       equal to the sem's (29,332, by construction: safe pools + seeded
       greedy set-cover + 5 swap repairs after 60/60 rejection trials
       failed) — FAILS validation: D3/D4 clean, D5 anchor FAILS (extra 369,
       rank 9,135 < sr_pred 9,504), D6 FAILS (rank 28,939 > sr_pred 28,068,
       deficit -871, extra 7,226 != 0, |V| = 0). Equal ncols by construction
       does not fix the freeze collapse."
    - "CONSEQUENCE (sr_pred recalibration verdict): at n=9 D6 the
       semi-regular baseline model itself breaks — its frozen quotient
       (3,112) is unrealizable by ANY generic boolean system with this
       histogram (|V| measured 0/1 for nulls, 6 for the sem), so EVERY
       generic null saturates to ncols - |V| with non-model collapse
       syzygies, and NO histogram-only recalibration of sr_pred exists
       (the rank depends on the instance-specific |V|, which the degree
       histogram does not determine). The pinned baseline remains valid
       BELOW the freeze degree — hence valid at D <= 5 at n = 9 and
       PREDICTED valid at D6 for n >= 12 (freeze 7/8/9; sr_pred(12,6) =
       156,520, sr_pred(15,6) = 484,520, sr_pred(18,6) = 1,216,266)."
    - "residual_6 RE-MEASURED and reproduced EXACTLY (RUN-f == RUN-EXP-SIG-005-h,
       cross-session determinism PASS): sem D6 rank 27,292, deficit 776,
       kernel 18,032, rankK 9,135, extra_6 8,897; closure A3_6 = 542,
       A4_6 = 3,580, A5 = 6,282 (F3/F4/F5 = 988/7,052/17,290, misses 0/0/0);
       residual_6 = 2,615; D5 continuity (A3_5 = 128, A4_5 = 566,
       residual_5 = 344, residual_4 = 24) reproduces. Because no null
       validates at n=9 D6, these sem D6 quantities remain INADMISSIBLE as
       cascade evidence — status unchanged from EV-SIG-005; they are
       reproduced for continuity and as the reference point of the
       now-diagnosed baseline failure."
    - "Unexpected (AGENTS rule 8): the column-matching safety constraint
       itself induces syzygies — N1's D5 extra = 369 (also 369 on the
       independently sampled RUN-c variant), i.e., a support-structured
       RANDOM system exhibits sem-like extras/deficits at D5 (369 of the
       sem's 909). At D6, in the now-identical column world, the
       column-matched null's rank is 1,647 ABOVE the sem's and its extra
       1,671 BELOW the sem's. Measured confound for interpreting sem
       deficits as pure cascade content; numbers only, interpretation left
       to the Coordinator."
    - "Controls: C1 anchor reproduction PASS (all EV-SIG-005 receipt
       ncols/ranks reproduced before any new claim). C2 lower-degree anchors
       PASS for N0/N2 (extra = 0, rank == sr_pred at D3/D4/D5); N1 D3/D4
       PASS, D5 FAIL (369, construction bias recorded). C3 D6 validation
       FAIL for all three constructions (the finding). C4 determinism PASS
       (N0 == RUN-k; RUN-f == RUN-h on all shared values; N1 seeded
       deterministic). C5 variety ground truth recorded (6/1/1/0). C6
       sanity identities PASS on every measured cell."
    - "Deviations and censoring (AGENTS rules 5/8; none is evidence): (i)
       RUN-f's reduction-free union crosscheck was DELIBERATELY censored
       (censored_timeout_crosscheck under a 250 s soft cap — the 300 s
       platform call cap forbids the full ~465 s invocation; RUN-h's
       crosscheck passed on the identical values); (ii) RUN-c construction
       was 5 sextics short of exact column equality (donor-filter bug, fixed;
       superseded by RUN-d; retained as record); (iii) two RUN-e invocations
       were killed at the 300 s platform cap (infrastructure); (iv) SCOPE
       CENSORING: the n=12 D6 null validation — the decisive confirmation of
       the freeze theory (predicted: extra = 0, rank == sr_pred = 156,520) —
       was NOT attempted (its ~200k-column echelon exceeds the per-invocation
       cap), and n=9 seed 2 replication was not run."
  inference: >-
    Numbers only (status decisions belong to the Coordinator). The
    EXP-SIG-005 C5 null failure is fully diagnosed: it is NOT a
    support-matching defect. The support asymmetry exists at all degrees and
    is exactly explained by the up-closure law; the fatal break at D6 is that
    D6 is the freeze degree of the semi-regular Hilbert series at n = 9,
    where the model's frozen quotient (3,112 dims) is unrealizable by any
    generic boolean system (variety sizes 0/1/6 measured). Every
    histogram-matched generic null — old, forced-consistent, or
    exactly-column-matched — saturates to rank = ncols - |V| with non-model
    collapse syzygies (extra 4,986/7,226 != 0), so no D6 null baseline can
    validate at n = 9 and no histogram-only sr_pred recalibration exists
    there. The cascade characterization remains trustworthy through D = 5;
    the degree axis at n = 9 is structurally unmeasurable with this baseline
    family. The theory makes a sharp testable prediction: the D6 null
    validates at n >= 12 (freeze >= 7; sr_pred(12,6) = 156,520) — the n = 12
    D6 null cell is the decisive confirmation and is queued. residual_6 =
    2,615 is reproduced exactly but stays inadmissible as cascade evidence.
    New confound flagged: support-structured random systems show sem-like
    extras at D5 (369), so part of the sem's D5 deficit may be
    support-induced rather than cascade content.
  boundaries:
    - "Toy scale: boolean chained Semaev m = 3, t = 3, ti = 0. Diagnosis and
       null validation at n = 9 seed 1 only (the RUN-h/RUN-k anchor cell).
       Rank/count/variety-count arguments only; no solver-impact or d_reg
       claim about the sem."
    - "The freeze-degree rule (n/3+3) is computed on the on-lattice sizes
       n = 9/12/15/18 from the histogram {2: n, 3: n}; the n >= 12 D6
       validity of the null is a PREDICTION, not measured (scope-censored)."
    - "The 1,875 = 4,986 - 3,111 part of the null's extra_6 decomposition is
       OPEN (conjecture stated, not machine-checked)."
    - "N1's D5 support-bias extra (369) is measured on two related
       constructions at one cell; its magnitude elsewhere is unmeasured."
    - "The sem D6 quantities (residual_6 = 2,615, extra_6 = 8,897,
       deficit_6 = 776) are reproduced but remain inadmissible as evidence;
       the D<=5 cascade picture (EV-SIG-005) is untouched."
  unresolved_confounds:
    - "n = 12 D6 null validation (predicted: extra = 0, rank == sr_pred =
       156,520) — the decisive confirmation of the freeze theory; requires a
       budget admitting the ~200k-column echelon (block-m4ri or chunked)."
    - "Exact decomposition of the null's extra_6 = 4,986 at the freeze
       degree (1,875 dims beyond the D5-quotient collapse)."
    - "Whether the sem's D5 deficit (909) decomposes into a support-induced
       part (N1 showed 369 in a biased random system) plus a genuine cascade
       part — a new confound for the D <= 5 interpretation, surfaced by the
       column-matched construction."
    - "Whether a NON-generic null with controlled variety size (|V| >=
       3,112) could validate at n = 9 D6 — such a system is by construction
       non-generic and was not pursued (out of the approved null family)."
  reviewed_by: coordinator
