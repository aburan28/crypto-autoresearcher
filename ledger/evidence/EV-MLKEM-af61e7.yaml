  recorded_by_task: TASK-20260803-00739e
  experiment_ids: []
  experiment_ids_note: >-
    No frozen EXP contract. BATCH-012 is a reserve-check batch dispatched under
    the DEC-20260803-c7a1a3 extension against the pinned lattice-estimator, not
    an experiment against a protocol.
  run_ids: []
  reproduced_baseline: true
  source_task_ids:
    - TASK-20260803-69f3cd
    - TASK-20260803-fc46cd
