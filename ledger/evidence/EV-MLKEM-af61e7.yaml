  snapshot_commit: 1cd863b14368d828a02e9059ecbd6dda419ec529
  type: computational_estimate
  type_note: >-
    Cost-model arithmetic from the pinned lattice-estimator
    3e48ef421ec256afddb3e7d2249a77eab6e9ba12. Not a measurement. No lattice was
    reduced, no sieve was run, no instance was solved.
  direction: refutes
  strength: moderate
  claim_tier: estimate
  certificate_refs: []
  proof_status: not_applicable
  proof_refs: []
  proof_status_note: >-
    `not_applicable`: nothing is proved or derived here. This record reports
    cost-model arithmetic and the reasons it does not support the inference
    the campaign was drawing from it.

  headline_framing: >-
    ANOM-3's internal comparison is MERELY UNFALSIFIED, not established, and is
    now demonstrably unstable in a direction the campaign never tested. The
    instrument that produced it cannot answer the question the goal asks.

  scope_statement: >-
    Scoped to estimator.lwe_dual.matzov versus estimator.lwe_primal.primal_bdd
    under RC.MATZOV at pin 3e48ef421ec256afddb3e7d2249a77eab6e9ba12, at exactly
    the three FIPS 203 parameter shapes plus a synthetic n-sweep on the same
    Kyber shape. Nothing here is a statement about ML-KEM's security.

  claim_tier_note: >-
    `estimate` is the ceiling this record may assert under
    docs/claims-and-verification.md. certificate.kind is `none`: nothing was
    solved and no relation was produced, so there is nothing for a run wrapper
    to re-verify.

  direction_note: >-
    `refutes` is with respect to the campaign's own ANOM-3 reading, not with
    respect to any ML-KEM security claim. This record removes support from an
    internal finding of this program.

  strength_note: >-
    `moderate` rather than `strong`: the falsifying n-sweep (OBJ-1) is a single
    red-team computation reproduced by no second party, and the null object of
    the right shape was run only by the red team as its own control, not by a
    producer under contract with an independent check.

  what_is_established:
    - >-
      S1. The shim-free reference gap is CLOSED. Sage was obtained here by a
      route the Coordinator had not tried (`pip install passagemath-standard`
      10.8.7, binary wheels) after apt (`Candidate: (none)`) and
      `pip install sagemath-standard` (fails building cypari2 on PARI/GP) both
      failed. Under a real Sage interpreter with the shim verified off
      sys.path FROM INSIDE the interpreter, the pinned estimator reproduces
      primal_bdd exactly at all three sets and matzov to 0.0 / 3.9379e-09 / 0.0
      bits at Kyber-512/768/1024. The validator re-ran this independently and
      obtained floating-point equality on all six values.
    - >-
      S1 corroboration the producer did not claim: archived sagemath 10.9
      primal_bdd values match the passagemath 10.8.7 run exactly. That is the
      strongest available cross-version evidence and it partly answers the
      redistribution-versus-upstream caveat.
    - >-
      The shim is genuinely distinguishable from Sage. `PowerSeriesRing` works
      under passagemath and raises by design in the shim, and the producer's own
      probes show `/tmp/sagevenv/bin/python` resolving `sage.all` to the SHIM
      when the shim is on PYTHONPATH. The isolation was therefore load-bearing
      and was checked, not assumed.
    - >-
      OBJ-1 (red team, new computation). Holding the Kyber shape fixed
      (q=3329, Xs=Xe=CB(2), m=n, RC.MATZOV, same pin) and sweeping n, the
      matzov-minus-primal_bdd margin is -1.4213 / -0.7651 / +0.8232 / +3.0376 /
      +4.5925 / +7.0194 / +8.3879 / +13.0893 / +17.8816 bits at n =
      256/384/512/640/768/896/1024/1280/1536. It is monotone increasing, roughly
      linear at ~0.0151 bits per unit n, shows no flattening, and CHANGES SIGN
      between n=384 and n=512 -- inside ML-KEM's own family, roughly 60-130
      dimensions below Kyber-512.
    - >-
      OBJ-2 (red team, new computation). The two sides are not costed in one
      frame. `primal_bdd` calls `costf(rcm, beta, d)`; `matzov` calls
      `red_cost_model.short_vectors(...)` which resolves to `GJ21.short_vectors`
      (estimator/reduction.py:863), sizing the sieve to cost about one BKZ call
      and returning 2^(0.2075*sieve_dim) vectors FREE. log2 N sits 0.0537 /
      1.2195 / 0.8915 bits under that capacity, so the optima sit on the seam of
      the disputed model. At Kyber-768 the guess stage is 0.0646% of matzov's
      cost, contributing 0.00093 bits; 99.94% is T_sample. The FFT
      distinguisher, the N short vectors and the disputed independence law carry
      essentially all of the modelling risk and essentially none of the cost.
    - >-
      OBJ-3 (red team). "Neither side exposes a success probability" is FALSE.
      `PrimalHybrid.cost` writes `ret["prob"]` and executes
      `ret.repeat(prob_amplify(0.99, probability))` under the comment
      "# Repeat whole experiment ~1/prob times", measured `prob: 1.0,
      repetitions: 1` at all three optima. `MATZOV.__call__` takes no
      `success_probability` and applies no repeat. One side is total expected
      cost, the other per-attempt only.
    - >-
      OBJ-4 (red team, its own control). NULL-1 -- the Kyber-specificity null
      that the BATCH-011 validator's DEF-7 required and that the producer could
      not run -- was run to completion by the red team: 24/24 evaluated, 13
      positive and 11 negative, range -207.04 to +13.16. A rate of 0.542 is a
      coin flip. NULL-2's 0.944 answers a different question and does not
      substitute for it. Six of NULL-2's cells (CheNgu12, ABLR21) inherit
      `ReductionCost.short_vectors` (rerandomize+LLL) and are a harness category
      error; sieve-only cells give 11/12, not 17/18.
    - >-
      S4 decay under N-inflation with full re-optimisation, reproduced by the
      validator to a maximum deviation of 4.6e-07: flip at delta ~2.7773
      (Kyber-512), ~19.6716 (Kyber-768), and beyond 32 (Kyber-1024). Both of
      S4's corrections to the BATCH-011 red team hold: Kyber-768 does flip, and
      the earlier 2.3732 figure IS linear interpolation (validator obtains
      2.373191 by the same method).
    - >-
      S5. c* is reported per attack and never transferred. matzov Model A gives
      0.037261 / 0.081698 / 0.054761; Model P (peak, including the FFT table)
      gives 0.028803 / 0.081697 / 0.040268. EV-MLKEM-020's 0.0316 / 0.0459 /
      0.0071 is labelled as primal_bdd's throughout. The DEC-20260803-85adf8
      CE-1 defect is not repeated.
    - >-
      Package integrity. All eight declared producer artifacts hash-identical
      across working tree, snapshot commit 1cd863b1, the snapshot receipt, and
      the producer's own receipt, verified independently by BOTH reviewers.

  what_is_not_established:
    - >-
      That ANOM-3's internal comparison is a finding. It is not recorded as one
      here, at any parameter set. The red team's verdict is
      `blocking_objections` scoped to exactly that act.
    - >-
      That matzov is cheaper than primal_bdd in any sense that survives leaving
      the three sampled points. It changes sign 128 dimensions below Kyber-512.
    - >-
      Anything about ML-KEM's security. No break, no security proof, no FIPS 203
      parameter set affected or cleared, no NIST category claim in either
      direction.
    - >-
      That EV-MLKEM-015 is wrong. Both BATCH-011 reviews and both BATCH-012
      reviews judged its `inference` field mistaken about a different callable
      and all four explicitly declined to act. Rule 12 is UNMET and UNWAIVED and
      this record changes nothing about EV-MLKEM-015.
    - >-
      That the campaign answered its own question. KN-OPEN-016's actual question
      -- whether the dual-sieve attack works as costed -- is untouched by twelve
      batches and is not closed by this record.
    - >-
      That S1 constitutes independent verification of the cost MODEL. It is
      implementation agreement: three runs of the same estimator source under
      different arithmetic backends. It buys reproducibility, not independence.

  narrowest_supported_statement: >-
    Under the pinned lattice-estimator 3e48ef421ec2 and the reduction cost model
    RC.MATZOV, evaluated at exactly the three FIPS 203 parameter shapes and under
    two arithmetic backends that run the same estimator source,
    estimator.lwe_dual.matzov reports a smaller log2(rop) than
    estimator.lwe_primal.primal_bdd by 0.543432 / 4.592472 / 8.387943 bits. That
    difference is a property of the estimator's two functions at those three
    inputs; it is not stable across the parameter family those inputs are drawn
    from (it changes sign at n between 384 and 512 on the same Kyber shape), it
    is not costed in a common frame (the dual side receives a free-sieve
    accounting and drops an admitted O() that the primal side does not, and the
    primal side alone is amplified to a declared success probability), and
    essentially all of it at Kyber-768 is lattice reduction rather than the dual
    machinery being compared. Separately and independently: the public name
    LWE.dual_hybrid resolves to class MATZOV while EV-MLKEM-015's
    reproduce_estimates.py imported the module-level dual_hybrid (class
    DualHybrid). That is a verified fact about the archive. It makes
    EV-MLKEM-015 incomplete about a different callable; it does not make it
    wrong, and this batch does not have authority to record it either way. No
    ML-KEM break. No security proof. No FIPS 203 parameter set affected or
    cleared. Cost-model estimates, not measurements. certificate.kind: none.

  narrowest_supported_statement_provenance: >-
    Authored by the independent red team (RT-20260803-f55e34,
    `narrowest_supported_statement`) and adopted verbatim by the Coordinator.
    Not written by the Coordinator and not edited by the Coordinator. The
    BATCH-011 corrective rule in DEC-20260803-85adf8 forbids the Coordinator
    filling a reviewer's own report fields; adopting the reviewer's field
    unaltered is the permitted direction.

  observations:
    - id: OBS-1
      statement: >-
        Three probes were run as falsifiers of ANOM-3 (S2 search box, S3
        reduction frame, S4 sample count N) and none killed it. All three hold
        the LWE parameters fixed at the three Kyber sets. None varies the
        parameter the quantity is a function of.
      supported_by: RT-20260803-f55e34 real_or_merely_unfalsified
    - id: OBS-2
      statement: >-
        S2 is structurally incapable of falsifying: its scanned beta bands lie
        ENTIRELY BELOW both incumbents (589 at Kyber-768, 823 at Kyber-1024),
        which were themselves never evaluated. Its null result was guaranteed by
        its coverage. The Coordinator's earlier informal 1701-point scan had the
        same defect in a different coordinate -- its k_fft range 0-40 excludes
        the incumbent k_fft of 60 and 120.
      supported_by: VAL-20260803-1a074b D-4; RT-20260803-f55e34 OBJ-7
    - id: OBS-3
      statement: >-
        The S4 flip point is the location of a DISCONTINUITY, not a zero of the
        margin. The margin is constant to seven decimal places from delta=2.0 to
        delta=2.777 with beta pinned at 387, then jumps 0.198 bits. It never
        reaches zero. The producer's stated mechanism ("the optimiser recovers
        some of the loss") is contradicted by its own data.
      supported_by: VAL-20260803-1a074b D-2, D-3
    - id: OBS-4
      statement: >-
        `mu` is inert -- moving it from 0.5 to 2^-40 changes N by only 0.4147 /
        0.2828 / 0.2164 bits. This DEFENDS the producer: S4's multiplicative
        delta on N was the right knob, not a knob chosen to be safe.
      supported_by: RT-20260803-f55e34 OBJ-3 subsidiary finding

  inference: >-
    A quantity that survives three probes which all fix the one variable it
    depends on is unfalsified, not corroborated. When that variable is varied,
    the quantity changes sign inside the claim's own family and then grows
    without bound. Two estimator functions differenced at 0.5-bit resolution,
    where one drops an unbounded O() on the term that sets its own block size,
    receives its short vectors free, and is not amplified to a success
    probability while the other is, do not support an ordering claim. The
    inventor-protocol artifact tell fires on the n-sweep axis. It does not fire
    on the N-inflation axis, and saying so without naming the axis is the error
    corrected below.

  heuristics_relied_on:
    - id: HEU-1
      statement: >-
        The estimator's implementation of MATZOV faithfully represents the
        published MATZOV-2022 cost model.
      status: assumed, not verified by this campaign
    - id: HEU-2
      statement: >-
        GJ21.short_vectors' free-vector accounting is a modelling choice whose
        effect on the margin was not isolated. CTRL-RT-2 would isolate it and
        was not run.
      status: open

  boundaries:
    - >-
      Everything here is free-memory gate counting unless a memory charge is
      named. Where a memory charge is stated, its exponent belongs to ONE
      attack: matzov's own c* is 0.037261 / 0.081698 / 0.054761 (Model A).
      EV-MLKEM-020's 0.007 is primal_bdd's at Kyber-1024 and does NOT travel
      with ANOM-3 -- that transfer was CE-1 in DEC-20260803-85adf8.
    - >-
      passagemath 10.8.7 is a redistribution of the Sage source, not the
      upstream sagemath 10.9 under which RUN-MLKEM-015-001 was computed. Upstream
      10.9 remains unobtainable in this environment.
    - >-
      The n-sweep of OBJ-1 uses synthetic parameter shapes. Only n=512, 768 and
      1024 correspond to standardised FIPS 203 sets; the other six points are not
      ML-KEM and are not claimed to be.

  unresolved_confounds:
    - >-
      Whether the free-sieve accounting (OBJ-2) explains the whole margin. The
      cheapest check, repricing the dual side with `short_vectors_simple`, is
      under two minutes and was not run. It can only reallocate the margin
      between two components that both sit on the truncated side, so it cannot
      change the disposition, but it would size the effect.
    - >-
      Whether the growth in n is a real exponent-level separation between the
      dual-sieve and primal-BDD families under one gate-count model, reconciled
      against the literature's position that they agree to lower-order terms.
      That is a far larger claim than 0.543/4.592/8.388 bits at three points,
      the campaign has never made it, and it is what its own numbers imply.

  evidence_integrity_findings:
    - id: INT-1
      finding: >-
        results.json's `comparison_vs_shim.shim_anchor` holds the ROUNDED
        PUBLISHED anchor, not a shim output, so its `delta_bits` of 4.155e-11 and
        2.632e-11 are Sage-versus-anchor, not Sage-versus-shim. True shim-versus-
        Sage deltas are 0.0 / 3.9379e-09 / 0.0. Root cause is an asymmetry two
        lines apart: ANCHOR_PRIMAL is stored full precision, ANCHOR_MATZOV
        rounded. Nothing is fabricated; the field name does not describe its
        contents. report.md states it correctly.
      raised_by: VAL-20260803-1a074b D-1
      materiality: >-
        Immaterial quantitatively -- every quantity involved is at or below
        4e-09 bits. Material as provenance, because the Coordinator propagated
        the mislabelled reading into an immutable commit message.
    - id: INT-2
      finding: >-
        The null object of the right shape (Kyber-specificity, BATCH-011
        validator DEF-7) has now gone unrun by a contracted producer for two
        consecutive batches. In BATCH-012 it failed on an implementation error
        (`NoiseDistribution.CenteredBinomial` does not exist at the pin;
        `CenteredBinomial` is module-level at estimator/nd.py:296) and the
        producer correctly declined to rerun under `maximum_runs: 1` and
        correctly drew no inference from it. The red team then ran it as its own
        control and it came back a coin flip.
      raised_by: VAL-20260803-1a074b D-6 (high); RT-20260803-f55e34 OBJ-4
      materiality: >-
        High. It is the control that would have caught ANOM-3 earliest, and the
        one time it ran it pointed at artifact.

  coordinator_observations_unreviewed: []

  pareto:
    dominated_by: >-
      Any measurement of the score distribution of sieve-produced dual vectors.
      This record is estimator arithmetic and is dominated on the question that
      matters by any experiment that observes the distribution the cost model
      assumes.
    sota_delta: >-
      None claimed. This record moves no exponent and improves no attack. Its
      contribution is negative and internal: it removes support from one of this
      program's own readings and names why the instrument cannot settle it.

  review_refs:
    - VAL-20260803-1a074b
    - RT-20260803-f55e34
  review_verdicts:
    validator: ADMISSIBLE_WITH_DEFECTS (report verdict `passed`), 7 defects, one high
    red_team: >-
      blocking_objections, scoped: the objections block recording ANOM-3's
      internal comparison as a FINDING at any parameter set on this batch's
      evidence. They do not block archiving the package and do not block closing
      the goal.
  review_provenance_note: >-
    Two independent review sessions on snapshot 1cd863b1, dispatched
    concurrently and neither shown the other's findings. OBJ-1 and OBJ-2 are new
    computations produced in the red-team session, not re-readings of the
    producer's transcript. The Coordinator forwarded nothing between them.

  rule12_status: >-
    UNMET and UNWAIVED. ANOM-3 remains gated. No status change to EV-MLKEM-011,
    013, 015, 017, 018, 019, 020 or 021, and no KN-* entry is created, modified
    or withdrawn by this record.

