# EV-ENDO-fb5823 -- review of EXP-ENDO-25ad84 / RUN-ENDO-d7cb69, the
# isogenous-model screen. Recorded under DEC-20261016-5752c0.
# Arm M met its frozen success criterion at the modelled tier, but E's own
# verified chain 2-GLV beats it on 6 of its 7 positives. Arm A's zero-hit
# statement is refuted as worded by two certified rows (Bandersnatch D_K = -8,
# mnt1 D_K = -19). Direction: weakens. No ECDLP claim.
