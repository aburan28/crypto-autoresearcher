  direction_basis: >-
    H-ENDO-5a33ae is a conjunction of arm M and arm A. Arm M holds as worded
    (supports). Arm A is false as worded (contradicts), by a checkable
    counterexample. The conjunction is therefore weakened, not supported and
    not rejected: arm M survives in its stated scope.
  strength: preliminary
  strength_rationale: >-
    One valid deterministic pass on one seed, with all controls passing and
    every positive route verified on points by the producer and by
    independent validator code. Arm M rests on modelled counts from one cost
    model, and its seven positives are five curve families. The arm-A
    counterexample is an exact integer identity, but it has not yet been
    recomputed by code independent of the producer (archive gate of
    TASK-20261016-5c0f78).
  claim_tier: modelled
  claim_tier_note: >-
    Modelled M_eq = M + S operation counts (curvesweep wNAF model, S = 1 M
    primary) on deployed and published prime-field curves of 112 to 521 bits.
    Not a timing; not a measured bound; no ECDLP tier applies.
  scale_relevance: >-
    cryptographic-scale curves, computed directly at their real sizes; the
    quantity is a modelled known-scalar cost, so no attack-cost scale claim
    follows.
  certificate_refs: []
  certificate_refs_note: >-
    No solve or relation is claimed. Route correctness is carried by
    raw["rows"][*].verification (8 of 8 scalars per positive route) and by the
    validator's own Velu route check (27/27, with 54/54 broken routes
    failing); these are point checks, not ECDLP certificates.
  proof_status: certificate
  proof_refs:
    - experiments/EXP-ENDO-25ad84/runs/RUN-ENDO-d7cb69/rows.jsonl#L26 ascent.certificate (bls/Bandersnatch, D_K = -8)
    - experiments/EXP-ENDO-25ad84/runs/RUN-ENDO-d7cb69/rows.jsonl#L50 ascent.certificate (mnt/mnt1, D_K = -19)
    - experiments/EXP-ENDO-25ad84/analysis.md#arm-a-counterexample-proof_ref-for-ev-endo-fb5823
  proof_status_basis: >-
    certificate, for the adverse part (arm A). The recorded identity
    t^2 - 4p = D_K f_pi^2 on two rows, with D_K in {-8, -19}, plus the
    derivation in analysis.md (D_K not in {-3, -4} implies j not in
    {0, 1728} for an ordinary curve), is an explicit counterexample to the
    arm-A statement. Independent recomputation of the identity is a
    completion gate of TASK-20261016-5c0f78; if it fails, the arm-A part of
    this record and of DEC-20261016-5752c0 is void.

  validity_check:
    expected_run_count: {expected: 1, present: 1}
    manifest: valid; 136 rows, 0 error rows; frozen arguments equal the spec (validator J1)
    seeds: one frozen seed 20261016; 200 scalars per cost; 8 verification scalars
    raw_summary_agreement: rows.jsonl equals raw["rows"]; manifest and receipt digests match (validator J1)
    population: rebuilt independently, same 134 curves in the same order (validator J1)
    controls: control+model, control+ascent, control-/P-256, control-/Curve25519 and the instrument check pass (validator J2)
    defects_non_invalidating:
      - raw.provenance.dirty true vs manifest repository_dirty false (different scopes; harness sources hash-match the run commit)
      - no peak-memory record

  observations:
    - id: O1
      text: >-
        Controls pass. control+model: route back to P-256's a = -3 class,
        persistent +15.276 %, one-shot +14.465 %, verified 8/8.
        control+ascent: D_K = -3, crater GLV priced (path [11], 1779.5 M_eq).
        P-256 best persistent 0.0 (one-shot -1.70 %). Curve25519 baseline
        edwards_a=-1, best persistent 0.0. Instrument check 136/136.
    - id: O2
      text: >-
        Seven population curves have a verified best route with persistent
        and one-shot gain > 0 against E's best model plus E's unit GLV:
        Tom-384 +15.49 / +14.52 %, mnt5/2 and mnt5/3 +15.24 / +13.71 %,
        mnt3/1 and mnt3/3 +14.98 / +12.70 %, BADA55-VPR-224 +15.20 / +11.44 %
        (path 5·5), GOST 2001 test curve +8.26 / +6.70 % (persistent /
        one-shot). Every route is degree 5 or 25 and verified on 8 of 8
        scalars.
    - id: O3
      text: >-
        The seven positives are five families. mnt5/2 and mnt5/3 carry
        identical figures and a neighbour M_eq (2648.2) equal to mnt5/1's own
        baseline; mnt3/1 and mnt3/3 likewise (1788.6 = mnt3/2's baseline).
    - id: O4
      text: >-
        All seven are among the 9 population curves whose cheapest model on E
        uses generic-a doubling. No a = -3 (45), a = -3-isomorphic (13),
        twisted Edwards (32) or j = 0 unit-GLV (33) curve has a positive
        persistent gain.
    - id: O5
      text: >-
        Arm A. Two population rows whose root is not a j = 0 / 1728 crater have
        |D_K| <= 20: bls/Bandersnatch, D_K = -8, f_pi =
        21482638764116277775478679919733259912; mnt/mnt1, D_K = -19, f_pi =
        6915889423298038776451801. Both f_E unresolved; no GLV priced for
        either.
    - id: O6
      text: >-
        Against E's verified chain 2-GLV (research/endosweep_curves_20261006;
        re-run in the same cost model by RUN-ENDO-795989), the best
        model-change route loses on all six small-D_K positives: one-shot
        GOST -34.05 %, mnt3 -25.24 %, mnt5 -26.50 %, Tom-384 -30.31 %;
        persistent -31.80, -21.96, -24.25, -28.82 %. BADA55-VPR-224 has no
        |D_K| <= 2e6 and no chain GLV.

  comparison:
    - >-
      Success criterion (arm M) met: valid run, all controls and the
      instrument check pass, seven verified routes with one-shot gain > 0.
    - >-
      Arm-M prediction, one-shot gain in (0, 15 %] where an a = -3 neighbour
      exists at ell <= 7: all seven one-shot gains lie in the band. "<= 0 on
      a = -3 and a = 0 curves": consistent (O4).
    - >-
      Arm-A prediction, zero hits: 2 hits under H-ENDO-5a33ae's own frozen
      definition ("own root is not a j = 0 or j = 1728 crater"), which is the
      instrument's root_crater flag (isomodel.py 407-413). Falsified as
      worded. Under the validator's f_E-based reading the two rows are
      unresolved; no reading supports arm A.
    - >-
      Against the best known method on E (outside the frozen baseline): the
      model change is dominated on 6 of 7 positives (O6).
    - >-
      Against the index-calculus baseline and the matched rho: not
      applicable. Known-scalar k*P cost; no ECDLP pipeline or rho figure is
      involved and none moves.

  inference: >-
    Arm M holds as worded at the modelled tier on five curve families, with
    every route verified on points. Its practical reach is one curve:
    other/BADA55-VPR-224 is the only positive that no known verified method on
    E beats within the scanned discriminant bound. Arm A is false as worded:
    small |D_K| is not confined to j = 0 / 1728 curves in this population.
    Whether ascent or E's own non-unit endomorphism gives a k*P gain on
    Bandersnatch or mnt1 is untested. The hypothesis as a whole is weakened.

  boundaries:
    - >-
      Prime-field curves from harness/endosweep/targets.py deployed_targets()
      and std-curves @77fe6e3, deduplicated by (p, j, n), up to 521 bits;
      ell in {2, 3, 5, 7, 11, 13}, depth 2, at most 64 nodes per curve,
      |D_K| <= 2^20; seed 20261016; 200 scalars per cost.
    - >-
      One cost model: curvesweep wNAF, widths 3-7, affine or Jacobian tables,
      M_eq = M + S. Edwards counts recalled from the EFD; Doche-Icart-Kohel
      models not priced; S = 0.8 M column persistent only.
    - >-
      Known-scalar, variable-base k*P only. Nothing about timing, constant-time
      or complete formulas, fixed-base k*P, binary or extension fields, or
      ECDLP cost.
    - >-
      The arm-A refutation concerns the stated zero-hit claim on this
      population. It says nothing about whether any curve is weak.

  unresolved_confounds:
    - >-
      The arm-M baseline omits E's non-unit chain GLV by contract (validator
      J4); O6 supplies it from RUN-ENDO-795989.
    - >-
      f_E is unresolved for every root that is not j = 0 / 1728, so crater
      status of Bandersnatch and mnt1 is not certified.
    - >-
      The arm-A identity awaits recomputation by independent code (archive
      gate).
    - >-
      The seven positives are five families; no seed or sample-size variation
      was run.

  obstruction:
    statement: >-
      On the six arm-M positive curves that have a small D_K, E already
      carries a verified chain 2-GLV that costs 21.96 % to 31.80 % less
      (persistent) than k*P on the best model-change neighbour, so a model
      change alone is not the cheapest known k*P on those curves.
    quantity: >-
      model_change_vs_glv_on_E: 1 - (model-change route M_eq) / (GLV-on-E
      M_eq), one-shot and persistent, in curvesweep M_eq = M + S at S = 1 M.
    value: >-
      one-shot -34.05 % (GOST 2001 test curve), -25.24 % (mnt3/1, mnt3/3),
      -26.50 % (mnt5/2, mnt5/3), -30.31 % (Tom-384); persistent -31.80 %,
      -21.96 %, -24.25 %, -28.82 %. Deterministic modelled counts; the
      200-scalar sampling error of a baseline is 3.2-3.8 M_eq (about 0.1-0.2
      percentage points, validator J4), negligible beside the effect.
    measured_by: [RUN-ENDO-795989, RUN-ENDO-d7cb69, EXP-ENDO-7494e7, EXP-ENDO-25ad84]
    scope: >-
      GOST 2001 test curve (D_K -915), mnt/mnt3/1 and mnt3/3 (-139),
      mnt/mnt5/2 and mnt5/3 (-211), other/Tom-384 (-619); four isogeny
      classes; ell <= 13, depth 2; curvesweep cost model. Not claimed for
      other/BADA55-VPR-224, which has no |D_K| <= 2e6, nor outside these
      curves.
    resource_check:
      examined: true
      reading: >-
        Two theories take this measurement as their hypothesis. (1) If the
        GLV dominates the model change, the two may compose: a cheaper model
        on a neighbour that still carries the chain element. That is
        H-ENDO-f58749 (EXP-ENDO-7494e7), already run, positive at the
        modelled tier (EV-ENDO-7628a0). (2) The arm-A rows are the same kind of
        resource: Bandersnatch (D_K -8) and mnt1 (D_K -19) have small-norm CM
        elements whose own GLV is absent from their baselines. No record has
        taken (2) up yet; it is listed as a ranked next action in
        DEC-20261016-5752c0, not spawned.
      spawned_ids: [H-ENDO-f58749]

  sota_delta:
    time_exponent: unchanged
    note: >-
