  what_this_evidence_is: >-
    A test of whether the sub-Poisson deficit that carries this lane's only
    surviving positive finding is a property of the DATA or of the INDEPENDENCE
    ASSUMPTION in the null family it had been measured against. Both existing
    nulls treat cells as independent while the physical process couples them
    within an iteration. Zero new sampling of the physical system.

  observations:
    - >-
      J-1 (ESTABLISHED). THE DEFICIT SURVIVES EVERY JOINT NULL IN THE
      ITERATION-BUDGET FAMILY. The 164-cell low-occupancy mean t of 0.681097
      reads z = -2.84 under JN-2 (whole-iteration resampling preserving each
      iteration's band total, equivalent to Multinomial(S,p), the MAXIMAL
      sum-preserving negative dependence) and z = -2.82 under JN-3 (systematic
      pi-ps per iteration at pi_T = mu_T/nb with a fresh random cell order),
      against -2.79, -2.82 and -2.69 for N1, exact-Poisson N1x and N2. The
      validator built THREE further joint nulls by independent constructions --
      exact multinomial by sorted order statistics, and a Gaussian copula with
      exact inverse-CDF Binomial marginals that simulates no iterations at all --
      and obtained -2.98, -2.90 and -2.88. It also computed the null means
      analytically with no Monte Carlo at all, obtaining 0.999676 (JN-2),
      0.992025 (JN-3) and exactly 1 for JN-P and N1. The observed statistics
      reproduce to EIGHT significant figures through a pipeline that never
      imported the BATCH-015 module.
    - >-
      J-2 (THE PRODUCER'S REASON FOR J-1 IS WRONG, AND THE CORRECTED REASON IS
      BETTER EVIDENCE THAN THE ORIGINAL ONE). The producer argued that coupling
      structurally CANNOT rescue the rejection, because Var(D_T) is a functional
      of the marginal law alone and budget-preserving coupling moves only the
      null standard deviation, downward. THAT IDENTITY IS FALSE AS STATED
      (validator V-1). The statistic is (D - mu_hat)^2 / (mu_hat (1 - h)), and
      (1 - h) is the leverage correction DERIVED UNDER INDEPENDENCE, so
      off-diagonals of Sigma enter the null MEAN. The validator supplied the
      excluded construction and it does rescue: holding marginals exactly at
      N2's, AR(1) cross-cell coupling gives a null mean of 0.865 at r = +0.8
      against 0.992 at r = 0 -- a shift larger than the entire standard-deviation
      movement the producer's argument allots -- and z rises to -1.61 at
      r = +0.60. THE DATA THEN EXCLUDE THAT CLASS AT ABOUT 9 SD, on a statistic
      the producer had already computed: those nulls predict a Pearson-residual
      lag-1 autocorrelation of +0.561 +/- 0.049 at r = +0.60 against the observed
      +0.103955. Data-compatible coupling, r about 0.1 to 0.2, leaves z at -2.74.
      So J-1 now rests on a TESTED EXCLUSION rather than on an assumed structural
      impossibility, which is a better epistemic position than the one the
      producer claimed.
    - >-
      J-3 (WHY THE PRODUCER'S OWN NULLS WERE NEVERTHELESS SAFE). JN-2 and JN-3
      carry RANK-ONE coupling, which the degree-5 residual projection annihilates:
      the validator computed the analytic shifts as -3.2e-4 and under 1e-6. The
      producer's conclusion holds for its own nulls for a reason it did not give.
      The shuffle in JN-3 is a legitimate fix with its own artifact -- it makes
      the coupling mean-field, which is exactly the direction this statistic
      cannot see, and that rather than low occupancy is the sharp reason JN-3's
      standard deviation sits only 0.9 percent below N2's.
    - >-
      J-4 (JN-3 IS NOT THE JOINT MINIMUM-VARIANCE OBJECT, so BATCH-017 W-10's gap
      is NOT closed). Its marginals ARE exactly N2's -- verified analytically,
      since max pi = 0.7392 < 1 means each cell crosses at most one threshold, so
      systematic pi-ps gives inclusion probability exactly pi under any order. But
      on the aggregate it reaches Var(sum_A D) = 4659.4, a ratio of 0.9211, where
      a design constraining the SUBSET count per iteration reaches 803.3, a ratio
      of 0.1588 -- A FACTOR 5.8 UNCLAIMED. The direction is conservative, so no
      number in this record changes, but the object BATCH-017 W-10 asked for has
      still not been built.
    - >-
      J-5 (THE POSITIVE-COUPLING ESCAPE IS AN ALTERNATIVE, NOT A NULL, AND ONE OF
      ITS ROWS DOES NOT REPRODUCE). The only construction that can rescue the
      rejection widens rather than shifts, which requires POSITIVE cross-cell
      dependence: 1.34x to 1.42x standard deviation, i.e. about 1.8x variance
      (the producer's single 1.343x is computed off the friendliest null mean,
      validator V-7). The producer's JN-4 log-normal AR(1) field supplies it, but
      at 2000 replicates and two seeds the sigma = 0.20, ell = 25 row gives
      z = -2.10 and -2.15 with empirical tails 0.0060 and 0.0070, NOT the
      producer's -1.87: a Gaussian z overstates the rescue on a right-skewed
      null, and sigma of about 0.35 to 0.4 is needed rather than about 0.2. THE
      VALIDATOR RULED IT AN ALTERNATIVE on four grounds -- it contradicts the
      hypothesis under test rather than calibrating it; sigma is CHOSEN to cross
      -2, which is a minimum over a family and violates a standing binding; with
      E[psi] = 1 it widens the reference without explaining the 0.45 to 0.66
      observation; and the legitimate FITTED version has not been done.
    - >-
      J-6 (AN HONEST NEGATIVE, recorded because it defines the frontier). The
      validator searched for a statistic that discriminates the positive-coupling
      rescue points from independence AND FAILED. The producer's lag-1-of-t
      separates them by only 0.1 to 0.4 sd, and the validator's own window-spread
      candidate is no better. The 9-sd exclusion in J-2 uses the lag-1 of the
      PEARSON RESIDUALS, which does discriminate; no second discriminating
      statistic is known.
    - >-
      J-7 (A NUMBER THIS PROGRAM PUBLISHED IS WRONG, AND CORRECTING IT MAKES THE
      FINDING STRONGER). EV-MLKEM-890e2a W-1 and DEC-20260803-95176a both quote
      the model-free detrended var/mean as "0.453, 0.561, 0.660 against AN
      EXPECTATION OF 1 with sampling sd 0.29, 0.20, 0.14", inherited from
      BATCH-017's validator. THE EXPECTATION IS NOT 1. It exceeds 1 and grows
      with the window, because the straight-line detrend cannot follow the curved
      rate profile and the lack-of-fit term enters the mean. The validator derived
      it analytically with no Monte Carlo as
      E[stat] = [sum v_i (1 - p_ii) + ||(I - P) mu||^2] / ((L - 2) mu_bar),
      obtaining 1.0007, 1.0109, 1.1359 and 1.7486 at L = 25, 50, 100 and 150. The
      Coordinator checked it by an independent Monte Carlo with its own seed and
      its own local smoother, obtaining 0.997, 1.012, 1.2605 and 4.4576. BOTH
      ROUTES AGREE IN DIRECTION AND ON THE TWO CONSEQUENCES: at L = 100 the
      corrected z is about -2.8 (validator) or -3.36 (Coordinator) rather than
      the -2.40 the published wording implies, so THE FINDING IS STRONGER; and at
      L = 150 the archived 1.551 INVERTS, sitting about 0.9 sd BELOW its own null
      rather than showing a super-Poisson excess.
    - >-
      J-8 (A COORDINATOR FINDING THAT QUALIFIES THE PHRASE "MODEL-FREE"). The two
      independent calibrations in J-7 agree on direction but differ by a factor
      of 2.5 at L = 150 (1.75 against 4.46), because the null mean's lack-of-fit
      term depends entirely on which smoother supplies the reference rate. THE
      STATISTIC IS MODEL-FREE IN ITS OBSERVED VALUE AND NOT IN ITS CALIBRATION.
      It was promoted in EV-MLKEM-890e2a W-1 partly on the strength of needing no
      rate model; that is true of the numerator and false of the reference.
    - >-
      J-9 (THE CONFOUND IS NOT BREAKABLE IN THIS DESIGN, fully reproduced from the
      validator's own ingest). Within a file, not at all: 3 non-monotone occupancy
      steps in 300 for n=43 and 0 in 495 for n=50, spanning 253.2x and 198.6x.
      Across files a nominal lever exists and IDENTIFIES NOTHING: the SIGN of the
      cross-file occupancy contrast at matched position depends on the coordinate
      -- geometric means 1.873 in normalised band position, 2.598 in log C_T, and
      0.219 in RAW SCORE, which is this lane's declared scale and which REVERSES
      it. All 24 pooled specifications give |z| at most 2.27; beta-hat ranges from
      -0.10 to -330.4 with variance inflation factors up to 258301 and effective
      design size only 36.9 to 134.1 of 797 cells. With two files the occupancy
      contrast and the file main effect are one contrast, and the two files'
      dispersions differ in OPPOSITE directions. Separating occupancy from score
      position needs a third file or a non-monotone occupancy-position map.
    - >-
      J-10 (SMALLER DEFECTS). V-3: the producer's seed scheme is a weak additive
      hash and n43|JN-2 and n50|JN-3 collided on seed 520379; the validator
      established exhaustively that this is the ONLY collision among 25 streams
      and that no number is quantitatively affected, but the producer's
      justification was too strong -- its own sections 0 and 4.3 do place those
      two runs on two sides of one argument. V-4: dependence ratios quoted as
      measured, 0.897 and 0.893, where exact values 0.9480 and 0.9211 exist.
      V-5: no `inference` block in results.json or resource_receipt.json, against
      AGENTS.md artifact policy. V-6: "24 streams" where there are 25.
    - >-
      J-11 (A CORRECTION TO THIS COORDINATOR'S OWN PRIOR RECORD). EV-MLKEM-890e2a
      W-11 repeated BATCH-017 defect D-8's assertion that BATCH-015's
      rounded-Gaussian Poisson sampler is "undisclosed in BOTH BATCH-015 and
      BATCH-017". THAT ATTRIBUTION IS FALSE FOR BATCH-015, whose report.md carries
      a section headed "Sampler approximations, disclosed" stating the inversion
      branch below lambda = 30, the rounded normal above, and the O(1/12) variance
      error. The Coordinator verified the line directly. The SUBSTANCE of D-8
      stands and is immaterial here: N2 uses binomial_sample, which the validator
      read in source and confirms is exact.

  supersedes_reasoning_in: EV-MLKEM-890e2a
  supersession_note: >-
    EV-MLKEM-890e2a is immutable and is NOT edited. Two of its statements are
    superseded here. (1) W-1's clause "against an expectation of 1 with sampling
    sd 0.29, 0.20 and 0.14" is superseded by J-7: the expectation is not 1, the
    corrected reading is STRONGER at L = 100, and the L = 150 row inverts. The
    rest of W-1 -- the 164-cell low-occupancy test, the quartile gradient, the
    leverage restriction -- stands and is strengthened by J-1. (2) W-11's
    attribution clause is superseded by J-11. Everything else in EV-MLKEM-890e2a
    stands.

  inference: >-
    The sub-Poisson deficit is a property of the data and not of the independence
    assumption in the null family. It survives every joint null in the
    iteration-budget family, under five independent constructions across two
    parties, and it survives for a reason better than the one first offered: the
    coupling class that could rescue it is excluded by the data at about 9 sd on
    the Pearson-residual autocorrelation, rather than being structurally
    impossible as the producer argued. Two escapes remain open and are recorded
    rather than dismissed: the joint minimum-variance object has still not been
    built, though its direction is conservative; and a spatially smooth random
    dispersion process can widen the reference enough to soften the rejection,
    but it is an alternative that has never been FITTED, only tuned until it
    crossed a threshold. Separately, a calibration this program published as
    "an expectation of 1" is wrong, and correcting it strengthens the finding
    while inverting one archived row.

  boundaries:
    - >-
      Two archived toy-dimension files (q=241, m=40, n=43 and n=50); mid band
      only; raw undivided score scale. Establishes NOTHING about ML-KEM security
      in either direction, and nothing about Carrier et al.'s Kyber cost figures.
    - >-
      THE MECHANISM REMAINS UNIDENTIFIED. J-9 establishes that occupancy and
      score position CANNOT be separated in this design at all, by any of 24
      specifications, and that the sign of the cross-file contrast reverses on
      this lane's own declared scale.
    - >-
      The joint minimum-variance object is still not built (J-4). A design
      constraining the subset count per iteration reaches a variance ratio 5.8x
      tighter than JN-3. The direction is conservative but the gap is open.
    - >-
      The positive-coupling alternative is NOT excluded as a model, only as a
      tuned family (J-5). It has never been fitted, and no second discriminating
      statistic is known (J-6).
    - >-
      The model-free statistic is model-free in its observed value only; its null
      mean is smoother-dependent and the two independent calibrations differ by a
      factor of 2.5 at L = 150 (J-8).
    - >-
      n=50 shows no deficit under any null (z = +0.42 to +0.62) and its level
      anomaly has the opposite sign. It is not a second instance.

