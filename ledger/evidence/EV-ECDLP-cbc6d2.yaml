evidence:
  id: EV-ECDLP-cbc6d2
  hypothesis_id: H-XOR-56cc0a
  experiment_ids:
    - EXP-XOR-019343
  run_ids:
    - RUN-XOR-019343-001
  direction: neutral
  strength: inconclusive
  claim_tier: toy
  proof_status: empirical_only
  proof_refs: []
  type: independently_reviewed_experiment_observation
  batch_id: BATCH-f7de45
  recorded_at: '2026-08-09'

  summary: >-
    The frozen toy run and three independent reviews support one literal
    observation but do not supply admissible evidence for a status transition
    of H-XOR-56cc0a. Under the declared add-equivalent proxy, Arm D's blind
    with-replacement queries cost more per recovered ordered zero-sum tuple
    than Arm B in every preregistered q50/q90 comparison. The Validator
    nevertheless found the execution receipt incomplete, the experiment did
    not adjudicate hypothesis falsifier F1, and neither the run nor its reviews
    establish relation rank, an end-to-end discrete-log solve, an asymptotic
    improvement, or a cryptographic-scale result.

  observations:
    - id: OBS-ECDLP-cbc6d2-1
      statement: >-
        All 80 per-seed q50/q90 comparisons and all 16 pooled cell/q
        comparisons have Arm D charged cost per unique recovered ordered tuple
        greater than Arm B's charged cost per recovered ordered tuple. No F2
        comparison is triggered.
      measured_ranges:
        per_seed_D_over_B: [14.294320137693632, 100.04411764705883]
        pooled_D_over_B: [19.518072289156628, 86.37358101135192]
      classification: exact_frozen_toy_observation
    - id: OBS-ECDLP-cbc6d2-2
      statement: >-
        An independent Validator reconstructed the eight toy curves and all
        120 Arm D rows without importing or invoking the experiment runner.
        All 1560 arithmetic, artifact-binding, summary, control, and
        scientific-payload checks passed with zero mismatches.
      classification: independently_reproduced_arithmetic_and_binding
    - id: OBS-ECDLP-cbc6d2-3
      statement: >-
        The run receipt is incomplete under the repository's artifact policy:
        peak memory is null, CPU usage, command start time, and dependency
        versions are absent, replay bytes are not retained, and the rendered
        dispatch-plan digest is not snapshot-bound.
      classification: blocking_receipt_completeness_finding
    - id: OBS-ECDLP-cbc6d2-4
      statement: >-
        H-XOR-56cc0a's F1 coverage-interval falsifier is not evaluated. The
        successor froze no interval construction and its relation-hit
        indicators are clustered by source, so a naive relation-level
        binomial interval is not admissible.
      classification: hypothesis_adjudication_gap
    - id: OBS-ECDLP-cbc6d2-5
      statement: >-
        A static no-repeat affine-permutation sensitivity calculation reduces
        the frozen null's expected q50 query cost by about 27 percent and its
        q90 query cost by about 61 percent, while still leaving the modeled
        null roughly 14 to 37 times more costly than B. This is a reviewer
        derivation from recorded geometry, not an executed control.
      classification: analytic_sensitivity_not_experiment_evidence

  independent_reviews:
    reviewer:
      task_id: TASK-20260808-0df53d
      verdict: accept_literal_f2_non_falsification_with_major_interpretation_qualifications
      independent_session: true
      resolved_model_id: gpt-5.6-sol
      bedrock_used: false
      report: coordination/goals/GOAL-ECDLP-001/batches/BATCH-f7de45/reviews/TASK-20260808-0df53d/report.yaml
    validator:
      task_id: TASK-20260808-8d6727
      verdict: incomplete
      independent_session: true
      resolved_model_id: gpt-5.6-sol
      bedrock_used: false
      report: coordination/goals/GOAL-ECDLP-001/batches/BATCH-f7de45/reviews/TASK-20260808-8d6727/report.yaml
    red_team:
      task_id: TASK-20260808-1241ce
      verdict: narrow_observation_survives_but_broad_interpretation_is_not_supported
      independent_session: true
      resolved_model_id: gpt-5.6-sol
      bedrock_used: false
      report: coordination/goals/GOAL-ECDLP-001/batches/BATCH-f7de45/reviews/TASK-20260808-1241ce/report.yaml

  inference: >-
    The literal ordering is a descriptive result about the exact toy
    instrument. Because the receipt is incomplete, F1 is unadjudicated, the
    arms expose unequal information, the with-replacement null is dominated,
    and tuple count is not relation rank, this evidence is neutral and
    inconclusive with respect to H-XOR-56cc0a. It supplies no ECDLP attack,
    security, exponent, or concrete-cost conclusion.

  pareto_accounting:
    dominated_by:
      ecdlp_attack_frontier: Pollard rho at time exponent 1/2
      frozen_null: blind affine-permutation sampling without replacement
    sota_delta:
      time_exponent: 0
      memory_exponent: 0
      attack_result: none

  boundaries:
    - The largest field is p=211 and all tested group orders are composite.
    - No prime-order subgroup, generator, target, recovered logarithm, or solver verification is present.
    - Recovered ordered tuples are not shown to be independent or full-rank relation rows.
    - The charge formula is a partial operation proxy, not an end-to-end ECDLP cost model.
    - Peak and byte-level memory costs are unmeasured.
    - Nothing here supports cryptographic-scale or asymptotic extrapolation.

  unresolved_confounds:
    - A common information interface and matched stopping rule for B and D are absent.
    - Targeted-key acquisition cost is not derived from an implementable end-to-end mechanism.
    - The exact no-repeat trace, canonical relation identifiers, coefficient rows, and matrix rank are absent.
    - F1 requires a frozen source-cluster-aware estimator and aggregation rule.

