  proof_status: empirical_only
  proof_refs: [experiments/EXP-ECDLP-809375/runs/RUN-ECDLP-809375-1/raw-result.json]

  strength_justification: >-
    `replicated` is used here in its documented sense and in the sense 31 of
    the 50 existing `replicated` evidence records use it, stated outright by
    EV-DIFFP-1e08cc: it describes HOW MANY IMPLEMENTATIONS produced a number.
    FG-1 is a genuinely independent implementation -- independent on all three
    axes the contract required, and its central result was additionally
    reproduced by a THIRD implementation written by the Coordinator. This is
    precisely the standard the BATCH-e8a3a7 red team said RUN-2 did NOT meet,
    and it is the standard FG-1 was commissioned to meet.

  observations:
    - id: O-1
      statement: >-
        FG-1 reproduced the D1 image on BOTH already-measured instances using
        an implementation independent on all three contract-required axes:
        (1) LIFT -- group-theoretic projection
        S_hat = [p^(r-1) * ((p^(r-1))^-1 mod n)] L with no Hensel/Newton
        iteration on the order-n condition anywhere (the auxiliary y was a
        Tonelli-Shanks square root in (Z/p^r)^*, also not a per-digit lift);
        (2) GROUP LAW -- affine Z/p^r with explicit modular inverses guarded
        on the non-unit branch, not Jacobian coordinates; (3) NO REUSE -- the
        two prior scripts were never opened, and the executor disclosed this
        affirmatively. Results: instance A (p=1009, n=47) image {0,8} over all
        1035 pairs, 1012 zeros and 23 caps; instance B (p=1013, n=41) image
        {0,8} over all 780 pairs, 760 zeros and 20 caps. Every capped pair
        satisfies j+k=n exactly and every such pair is capped. No value
        strictly between 1 and r-1 appeared on any canonical lift at any swept
        precision.
      measured_by: [RUN-ECDLP-809375-1]
    - id: O-2
      statement: >-
        CONTROL C-1, the hard binary check that discharges the BATCH-e8a3a7
        J2 objection: because the order-n prime-to-p torsion lift is UNIQUE,
        a group-theoretically constructed S_hat must equal the
        Hensel-constructed one exactly or one construction is wrong. It
        matched 8/8 base-p digits of x AND 8/8 of y, on BOTH instances
        (A: 1028993090447422868629541 / 639576900641432511783834;
        B: 22454942430194572886520 / 30185837102734218797721), with the lift
        passing all construction checks at r in {4,8,12}. This replaces the
        five sampled pairs previously on record with an exact agreement on the
        load-bearing object itself.
      measured_by: [RUN-ECDLP-809375-1]
    - id: O-3
      statement: >-
        THIS COORDINATOR INDEPENDENTLY REPRODUCED C-1 WITH A THIRD
        IMPLEMENTATION (Jacobian coordinates plus staged scalar evaluation,
        distinct from the executor's affine code and from both prior scripts):
        the group-theoretic construction reproduces the recorded x_hat and
        y_hat EXACTLY on both instances, reduces to S mod p, and satisfies
        [n]S_hat = O mod p^r. The scalar's two defining properties (congruent
        to 1 mod n; divisible by p^(r-1)) were verified on both instances
        before the contract was approved. Three implementations now agree on
        the load-bearing object.
      measured_by: [RUN-ECDLP-809375-1]
    - id: O-4
      statement: >-
        CONTROL C-3 (dose-response), which no prior run performed internally:
        the on-fibre value TRACKS r on both instances -- r=4 gives 4, r=8
        gives 8, r=12 gives 12. This independently establishes that the capped
        value is exact ring equality at the truncation cap rather than a
        precision artifact, since an artifact would have pinned the cap
        regardless of r. This closes UC-2 of EV-ECDLP-921b5d on the precision
        axis.
      measured_by: [RUN-ECDLP-809375-1]
    - id: O-5
      statement: >-
        NEW AND UNANTICIPATED, and it revises what the earlier control was
        measuring. The null-lift instruction admits two non-equivalent
        readings; the executor tabulated BOTH at every cell rather than
        selecting one after the fact. The `canonical_offset` family
        (x0 = x(S_hat) + p^e) reads {0, min(e,r)} in all 24 cells and is a
        genuine dose-response instrument. The `raw_perturbation` family
        (x0 = S.x + p^e), which is what RUN-ECDLP-c373eb-1 and -2 used at
        e=1, reads {0,1} in ALL 24 cells and does NOT track e. The measured
        cause is recorded per cell: the naive integer-representative lift is
        already off-fibre at depth 1, so adding p^e for e >= 2 leaves the
        depth at min(1,e) = 1. At e=1 both families coincide and both
        reproduce the prior runs' {0,1}. CONSEQUENCE: the prior runs' null
        control was VALID AT e=1 -- it did refute the precision-artifact
        premise as claimed -- but it was never the tunable dose-response
        instrument it might have been read as, and no record should cite it
        as one.
      measured_by: [RUN-ECDLP-809375-1]
    - id: O-6
      statement: >-
        A degenerate cell was flagged rather than silently included: at
        (r=4, e=4), p^e is congruent to 0 mod p^r, so that "null" lift is
        literally the canonical lift and is not a null object at all.
      measured_by: [RUN-ECDLP-809375-1]

  inference: >-
    The BATCH-e8a3a7 J2 objection was that RUN-1 and RUN-2 share 266 of ~270
    executable lines, so their agreement carries likelihood ratio 1 on whether
    the reported image is a property of the mathematics or of the single
    implementation both share. FG-1 answers exactly that question with an
    implementation independent on all three axes, and C-1 -- exact per-digit
    agreement on a 23-digit coordinate, on a mathematically UNIQUE object --
    is not the kind of agreement a shared systematic error can manufacture,
    because there is no shared code to carry one. A third, Coordinator-written
    implementation agrees as well. The objection is discharged. Separately,
    C-3 upgrades the precision-artifact refutation from "the null lift differs"
    to "the on-fibre value tracks r", which is the stronger and more direct
    form. O-5 is a genuine correction to the record's own understanding of its
    earlier control and is recorded as such rather than absorbed.

  boundaries:
    - >-
      This establishes IMPLEMENTATION independence, not blindness to the
      answer. The frozen contract states both the lift formula and the
      expected image, and the executor was permitted to read the prior
      manifests for the C-1 targets. FG-1 is therefore an independent
      implementation of a stated construction, NOT a blind re-derivation, and
      the executor said so unprompted. What carries the weight is that the
      order-n lift is unique and its 8-digit coordinates are not something a
      wrong construction reproduces by knowing the target.
    - >-
      Still toy tier: two ~10-bit instances from one narrow configuration
      family (small ordinary curve, prime n, minimal model). Instances were
      held FIXED on purpose so the implementation was the only variable; that
      design choice buys implementation independence and buys NO scale or
      family diversity. No transfer argument to cryptographic scale is made.
    - >-
      Per the standing limitation, a finite-precision computation observes
      only "at least r", never literal infinity. The capped value means exact
      x-difference zero in Z/p^r at the precision used.
    - >-
      FG-1 itself has NOT been through an independent review round. It was
      Coordinator-verified only. Its force comes substantially from the
      discharging criterion having been pre-specified ADVERSARIALLY by the
      very reviewer whose objection it discharges, before FG-1 was designed.
      A future reviewer may still revisit it.

  unresolved_confounds:
    - >-
      UC-1: FG-1 was not independently reviewed (see boundaries). The
      pre-specified adversarial criterion mitigates but does not replace
      review.
    - >-
      UC-2 (carried forward, narrowed): the good-reduction / minimal-model
      premise still has no null object anywhere in this experiment line.
    - >-
      UC-3 (new, from O-5): the null-lift control used by RUN-1 and RUN-2 is
      now known not to track e. Any future record relying on those runs' null
      control must cite it as a valid e=1 refutation only.

  recorded_at: '2026-09-03'
