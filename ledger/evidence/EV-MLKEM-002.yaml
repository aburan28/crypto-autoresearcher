evidence:
  id: EV-MLKEM-002
  hypothesis_id: IDEA-20260722-002
  experiment_ids: []
  run_ids: []
  type: literature
  direction: neutral
  strength: preliminary
  claim_tier: crypto
  certificate_refs: []
  proof_status: derivation
  proof_refs:
    - coordination/goals/GOAL-MLKEM-001/batches/BATCH-002/tasks/TASK-20260722-207/derivation_note.md
    - coordination/goals/GOAL-MLKEM-001/batches/BATCH-002/tasks/TASK-20260722-210/technical_review.md
    - coordination/goals/GOAL-MLKEM-001/batches/BATCH-002/tasks/TASK-20260722-211/falsification_review.md
  observations:
    - >-
      No checked primary source at the 2026-07-22 cutoff reports an
      independently verifiable passive full-key recovery for ML-KEM-512,
      ML-KEM-768, or ML-KEM-1024.
    - >-
      Hou--Jiang's corrected structure-aware estimates are C0
      121.9/173.0/237.4, CC 139.1/194.7/259.0, and CN
      134.5/188.7/254.1; the maximum matched isometry gain is 0.8 bit.
    - >-
      C0, CC, CN, RAM-gate, memory-routing, provable-dual, quantum-query,
      source-level quantum, and physical-resource figures are separate cost
      series and cannot be minimized or subtracted across labels.
    - >-
      The carry-aware LaMS/isometry derivation proves that orbit targets add no
      fresh samples and reduces the score algebraically to weighted rotated
      vectors with public carry and rounding cocycles.
    - >-
      Independent red-team review correctly limits that result: algebraic
      relabeling does not prove computational equivalence without matched
      operation DAGs and memory accounting.
    - >-
      FIPS 203 exposes no DF or PC bit. Conditional oracle query counts,
      physical instantiations, and protocol confirmation costs must remain
      orthogonal evidence dimensions.
    - >-
      IDEA-20260722-002 survives only as a repaired defensive conformance
      control. Primitive-level one-bit comparison tests must precede
      end-to-end ciphertext mutation.
    - >-
      IDEA-20260722-003 remains a useful defensive measurement question but is
      not experiment-ready because its trace, key, device, retry, and power
      budgets are unfrozen.
  inference: >-
    BATCH-002 establishes a corrected and scoped research map, not an
    algorithmic breakthrough. The highest-information bounded next step is a
    defensive direct-comparison conformance gate on exact vulnerable and fixed
    optimized ML-KEM backends.
  boundaries:
    - Literature, symbolic derivation, and protocol review only; no empirical run was performed.
    - Crypto-tier scope refers to standardized parameter claims, not a solve certificate or demonstrated attack.
    - Absence from the checked corpus is not a hardness theorem or exhaustive literature closure.
    - The LaMS/isometry result closes only fresh-information and the current fourfold-vector two-bit path.
    - Named CVE findings apply only to specified versions, optimized backends, and confirmation assumptions.
    - No result authorizes operational testing against deployed systems.
  unresolved_confounds:
    - Li--Zheng lower-envelope candidates need family-wise wrong-tail validation.
    - LaMS rank, independence, and sample assumptions are unproved for one block-negacyclic FIPS key.
    - QRS absolute Kyber tables need the corrected Gaussian-width parameterization.
    - Most paper PDFs lack archived hashes and a complete screened-query log.
    - Computational reuse in weighted orbit evaluation remains open pending operation-DAG accounting.
  reviewed_by: coordinator
