    - RUN-RELN-141a86-stage0bcde
  type: empirical
  direction: neutral
  strength: inconclusive
  claim_tier: toy
  certificate_refs: []
  proof_status: empirical_only
  proof_refs: []
  observations:
    - >-
      Stage 0a's archived hash (f1aec620f8cb19318e6d6459174bd79b80daf6dd46fdacf6afdf2468c7cac7f2)
      was re-verified exactly before any measured data was read.
    - >-
      Five control tables were built against real data and every one
      matched its closed-form target EXACTLY (zero residual): INV-1
      conservation mean (144 real committed FB3 whole-group cells), INV-7
      x-class m=2 law (15 own-enumeration cells, 200 draws each, agreeing
      with the closed form within binomial sampling error, max 0.99 SE),
      INV-8 semi-regular degree (549 exact integer convolutions), INV-A4
      Bose-Chowla floor (4 exact Bose-Chowla bases), INV-A6 convention
      identity (572 real FB3 cells).
    - >-
      The contract's Stage-0c gate requires BOTH numeric agreement AND
      that the frozen exhaustive-grammar engine's blind structural search
      rediscover each expression at or below its canonical node count.
      INV-A4 (canonical complexity 7 / 3) and INV-A6 (7) were both found
      by blind search and PASS outright, both numerically and
      structurally. INV-1 (9), INV-7 (9 / 11) and INV-8 (10), all over
      6-leaf packs, could not complete exhaustive enumeration within this
      session: three real, timed, monitored background searches were
      terminated after 9-13 minutes at up to 4.9 GB resident memory (host
      total 15 GB) to avoid an uncontrolled OOM. This is
      resource_exhaustion (AGENTS.md rule 3: failed_infrastructure, never
      a negative or positive result) for those three controls' structural
      check specifically; their numeric identities remain independently
      verified exact.
    - >-
      During this stage, two real defects were found and fixed in
      source/grammar_engine.py: a pow/binomial magnitude-hang risk, and a
      fingerprint-deduplication bug that was silently discarding valid
      two-constant expressions, confirmed to have hidden the true INV-A4
      law before the fix.
    - >-
      Stage 0d's zero-compute P2 check (independent of the exhaustive
      search) PASSED cleanly on the already-committed FB3 nulls:
      Delta_null agrees with INV-A1 within 0.39 SE at 2^14 and 0.42 SE at
      2^16, and rejects the trivial 1 - 1/N law by 21.0 SE at 2^14,
      matching the contract's own pre-registered prediction exactly.
    - >-
      The Z/N-interval proves-too-much positive control PASSED cleanly
      (exact enumeration, Delta = 210/515/1275 at 2^14/2^16/2^18, clearly
      not the INV-A1 form, confirming the instrument can see structured
      over-dispersion when it is really there). The small-multiples
      positive control PARTIALLY confirmed (the q=0 point matches the
      committed 188x/480x/1224x concentration ratios; the full
      decay-ladder sweep requires Stage 0e, not run).
    - >-
      Per the contract's own stopping_rules ("Stop at the end of Stage 0c
      if any recovery control is not recovered on the primary engine...
      Stage 1 does not run [instrument failure, not evidence]"), Stage 1
      and Stage 2 were correctly not run.
  inference: >-
    NO SCIENTIFIC READING IS OFFERED. This is instrument failure at the
    Stage-0c structural-recovery gate, exactly as the contract's own
    decision_paths.negative defines it ("the hypothesis stays untested; a
    successor contract with a repaired grammar or engine is designed").
    No candidate invariant's status changes; the 19-entry candidate list
    of H-RELN-427bfd is untouched. The resource_exhaustion is a real
    performance limitation of the exhaustive-search implementation at
    complexity 9-11 over 6-leaf packs on this session's host, not a
    finding about any of INV-1, INV-7, INV-8, or about the E x-interval
    dispersion question the contract ultimately targets.
  boundaries:
    - >-
      Toy scale; only Stage 0a-0d executed. Stage 0e (own enumeration
      fallback), Stage 1 (grammar fits at the held-out 2^20 rung) and
      Stage 2 (proof obligations) are entirely not_run.
    - >-
      The structural-recovery gap is scoped exactly to three specific
      6-leaf-pack targets at complexity 9-11 on this session's host
      memory (15 GB); it says nothing about whether a longer run, a more
      memory-efficient enumeration, or a different host would recover
      them, and nothing about PySR (unavailable in this environment per
      the Stage-0a environment.lock.json, recorded separately).
  unresolved_confounds:
    - >-
      Whether the exhaustive engine, given more time or memory (or a
      pruned/ smarter enumeration order rather than brute force), would
      recover INV-1/INV-7/INV-8 structurally is not determined here. This
      is the concrete, well-scoped follow-up: a repaired or re-budgeted
      grammar engine (per the contract's own decision_paths.negative)
      attempting the same three targets, ideally with the two disclosed
      bugfixes already in place so no further silent correctness gap is
      hiding.
  obstruction: null
  reviewed_by: coordinator
