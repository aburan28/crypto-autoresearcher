evidence:
  id: EV-FALSIFY-f367ec
  hypothesis_id: null
  hypothesis_id_note: >-
    This is an instrument and corpus-integrity finding. It bears on no
    mathematical hypothesis, and naming one would invite exactly the inference it
    cannot support: nothing here is evidence for or against any claim about
    ECDLP, quaternion orders, HAWK, or anything else. It is filed under
    RQ-FALSIFY-a2c501 sub-question SQ-5, which asks what the corpus's own
    machinery does and does not make visible.
  question_id: RQ-FALSIFY-a2c501
  experiment_ids: [EXP-FALSIFY-d770c1]
  run_ids: []
  run_ids_note: >-
    No run record. The check is a static sweep of committed files whose entire
    method is the archived script named in proof_refs; re-running it is cheaper
    than reading a run manifest would be.
  findings_under_test: [KN-FIND-528ca0, KN-FIND-031]
  type: analytical
  direction: inconclusive
  direction_note: >-
    Neither supports nor contradicts any finding's content. It reports two
    defects in how the corpus records currency and exposes metadata.
  strength: strong
  claim_tier: not_applicable
  claim_tier_note: >-
    Non-mathematical. The claim tiers in docs/claims-and-verification.md grade
    cryptographic assertions; this record makes none.
  proof_status: certificate
  proof_status_basis: >-
    Every statement below is a decidable property of committed files, checked
    exhaustively over all 58 findings by the archived script, not sampled.
  proof_refs:
    - experiments/EXP-FALSIFY-d770c1/falsify/check_currency.py
  recorded_at: '2026-08-08'

  observations:
    - id: O-1
      text: >-
        THE CORPUS MARKS "NOT CURRENT" IN THREE INCOMPATIBLE WAYS, and a check on
        any one of them has silent false negatives. (1) `superseded_by`, carried
        by 52 of 58 findings. (2) `status:` plus `withdrawn_by:` -- KN-FIND-031 is
        WITHDRAWN_PENDING_RULE_12_REVIEW while its `superseded_by` is null, so a
        supersession check reports it current. (3) a record in
        ledger/corrections/ naming the finding, with no back-reference written
        into the finding -- KN-FIND-a1f3c2, whose proof step was repaired by
        CORR-20260807-652652 with nothing recorded in the finding itself.
    - id: O-2
      text: >-
        FIVE FINDINGS CARRY NO `superseded_by` FIELD AT ALL: KN-FIND-010,
        KN-FIND-011, KN-FIND-4e7a92, KN-FIND-720727, KN-FIND-d1c853. Three of
        those carry no status field either, so no field in the record states
        whether it is current. A check written as
        `fm.get('superseded_by') is None` returns for these exactly what it
        returns for a current record. Field-absent and explicitly-null are
        different facts and collapsing them is the bug.
    - id: O-3
      text: >-
        KN-FIND-528ca0 HAS NO YAML FRONT MATTER. It is the only one of 58
        findings in that state, using a bold-markdown metadata block
        ("**ID:** ...", "**Proof status:** ...") where every other record uses a
        parsed block. Consequence: it does not appear in knowledge/INDEX.md at
        all. The rebuilt index names 57 of 58 findings; 528ca0 is the sole
        omission.
    - id: O-4
      text: >-
        WHY O-3 MATTERS PARTICULARLY FOR THIS RECORD. KN-FIND-528ca0's headline
        content is a SCOPE CORRECTION: "Fractional Left O-Ideals ... Are Infinite
        -- SCOPE CORRECTION: Does NOT Apply to HAWK's Totally Definite Algebra",
        recorded because HAWK uses a totally definite algebra while the theorem
        holds for indefinite ones. A restriction on where a theorem applies is
        the single most important thing to surface to a later reader, and it is
        the part currently invisible to every metadata reader and to
        search_knowledge. AGENTS.md's retrieval policy already warns that
        "absence of a search result is not evidence that something was not
        tried... the index only covers what has been staged into the corpus";
        this is a concrete instance with a scope restriction inside it.
    - id: O-5
      text: >-
        SEPARATE DEFECT, HARNESS. CLAUDE.md states that generated artifacts "are
        never committed" and that knowledge/INDEX.md is gitignored and rebuilt on
        demand, giving as the reason that "every branch that added a knowledge
        entry rewrote the whole of INDEX.md". The path IS listed in .gitignore
        (line 134) but the file IS STILL TRACKED -- `git ls-files` resolves it --
        and .gitignore does not apply to already-tracked files. The un-tracking
        step (`git rm --cached`) was never performed, so rebuilding the index
        still dirties a tracked file on every branch that does it, which is
        precisely the conflict the documented fix says was removed. Observed
        directly: running tools/build_knowledge_index.py in a clean tree produced
        `M knowledge/INDEX.md`.

  interpretation: >-
    Two independent integrity defects. First, a reader cannot determine whether a
    finding is current from the finding alone; three mechanisms are in use, five
    records lack the primary field entirely, and one record's withdrawal is
    recorded only in a mechanism most checks do not read. Second, one finding is
    outside the machine-readable corpus altogether, and it is one whose content is
    a scope restriction. Both are cheap to fix and neither touches any
    mathematical claim.

  what_this_does_not_establish: >-
    Nothing about the correctness of KN-FIND-528ca0's theorem, which was not
    checked here, and nothing about HAWK. The scope correction it carries is
    reported as a fact about the record's visibility, not endorsed or disputed on
    its merits. Nor does this show that any agent was actually misled: no instance
    of a downstream record over-applying 528ca0 was searched for, and the claim is
    about exposure, not about a realised harm.

  dominated_by: not_applicable_methodological
  sota_delta:
    time_exponent: not_applicable
    note: No algorithmic claim.

  proposed_correction: >-
    (a) Convert KN-FIND-528ca0 to YAML front matter so it enters the index,
    preserving its text verbatim -- the record is immutable as to content, and a
    format migration that changes no assertion is a filing action, but it should
    still be done by the Coordinator and recorded. (b) Either add `superseded_by:
    null` to the five records missing it or state in templates/research-records.md
    that absence is permitted and what it means. (c) Record KN-FIND-031's
    withdrawal in whatever field the standard checks read, in addition to
    `status`. (d) `git rm --cached knowledge/INDEX.md` so the documented
    gitignore actually takes effect. None of these is urgent; all are cheap.

  knowledge_promotion: not_warranted
  knowledge_promotion_reason: >-
    Harness-integrity observations, not knowledge. KN-FIND-030 is the precedent
    for recording a harness defect as a finding, and it earned that by documenting
    a failure that had already destroyed record identifiers twice. Nothing here
    has caused a recorded harm yet, so the evidence record is the right home and
    promotion would overstate it.

  scope_limits: >-
    knowledge/findings/*.md as committed at this branch head, all 58 records,
    plus .gitignore and git index state for knowledge/INDEX.md. Static properties
    only.

  independent_review_required: false
  independent_review_note: >-
    Contradicts no claim and asserts no new mathematics. Every statement is a
    decidable property of committed files that a reader can re-check in seconds
    with the archived script.

  authority_note: >-
    Evidence only. No hypothesis status changed, no finding edited, reformatted or
    superseded, and no file untracked; every item in proposed_correction is for
    the Coordinator to action or decline (AGENTS.md rule 1).
