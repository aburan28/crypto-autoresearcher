    measured_by_note: >-
      Per-arm values are read from RUN-CERTBIN-6ebb0e closures.jsonl.gz and
      certificates.jsonl.gz, recomputed by J5 and certified by J1. The Stage-1
      fall profiles and rates are the red team's recount of RUN-CERTBIN-3b7e05
