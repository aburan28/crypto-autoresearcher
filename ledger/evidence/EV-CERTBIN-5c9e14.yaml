        routes. Each of the 144 per-draw refutations is thus a certified
        identity reproduced by two author-independent implementations. That is
        replication of the MEASUREMENT (evidence-hierarchy `replicated`:
        reproduced from a clean, independent run).
    (3) WHAT IS NOT REPLICATED. J7 is a same-seed replay, not a second sample
        (plan replication_note; J8 verdict_scope). The RATE over other seeds
        rests on one sample of 144: CP95 [0.974708, 1], whose lower bound
        exceeds the frozen 0.9 threshold. A second sample can narrow that
        interval; it cannot be expected to move the rate below 0.9 without
        contradicting the interval at 95%.
    (4) WHY THE CEILING IS EXPECTED, NOT SURPRISING. The pre-data prior put
        TENSOR modal (a, about 65%) and N-CONV's M_4 rate at least S_3's
        Stage-1 rate (b, about 55%); both held. J9 (b) supplies a structural
        reason declared before the per-arm records were opened: at least 88
