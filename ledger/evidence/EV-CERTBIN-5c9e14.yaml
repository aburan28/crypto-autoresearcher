        signatures held. (PDV-2 of the red team: the rule knew the DIRECTION of
        the N-CONV outcome from the plan; its counts and the N-CONVL and
        N-CONV17 parts were blind.) The result is neither surprising against
        the pre-data prior nor high-impact (toy, sota_delta zero), so the
        "surprising results get replicate" rule does not bind.
    (5) THE HYPOTHESIS HEAD is not moved to `supported` by this record's
        strength: the lifecycle state `replicated` is reserved for the RATE on
        an independent sample, which (3) says has not happened
        (DEC-20260926-cb4487 transitions_not_made).
