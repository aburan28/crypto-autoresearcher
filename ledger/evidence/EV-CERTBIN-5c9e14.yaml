  obstruction:
    statement: >-
      About the OBJECT at this cell, not the attempt. (i) Uniform random lower
      parts on S_L combined with S_3's quadratic part on the polynomial basis
      SATURATE the degree-<=3 fallen space of M_4 and are refuted by M_4 itself,
      so the family N-CONV never exhibits refutation that needs W_4 and cannot
      discriminate the S_3-specific W_4 behaviour on U62; this blocks reading
      NC-DR-1, NC-DR-2 or NC-DR-4 as "N-CONV reproduces S_3's W_4 behaviour".
      (ii) At W_4 the polynomial-basis convolution structure is not required
      on the one random V' tested; this blocks quoting "convolution tensor" as
      polynomial-basis-specific at W_4. (iii) The counting that forces the
      n = 17 saturation does not carry to n = 19 (derivation); this blocks the
      implicit transfer in NC-DR-7's recommendation. It blocks nothing at other
      n, curves or V beyond (iii)'s derivation, and closes no lane.
    quantity: >-
      The saturation margin dim Z_top - (trivial syzygies) - (independent
      ell-syzygies) - dim B_{<=3}; the fallen dimension dim(M_4 cap B_{<=3});
      the first W_4 iteration containing 1; the conditional W_4 rate among
      M_4-unrefuted draws; and, for O4, the M_4 and W_4 refutation counts over
      a random V'.
    value: >-
      n = 17, polynomial basis: P = 1695 (144/144 x_R and 386/386 Stage-1),
      dim Z_top = 1229, margin +88 (+71 with the 17 ell-syzygies measured
      independent on 61 systems). N-CONV unsatisfiable: fallen 988 on 142/144
      (987 on 2), M_4 144/144 (CP95 [0.9747, 1]), first W_4 iteration 0 on
      144/144, conditional rate 0/0. N-CONV17: fallen 988 on 140/144, M_4
      143/144. N-CONVL: fallen 965-982, never 988, M_4 105/144 (CP95
      [0.6489, 0.7998]), iteration 1 on 39. S_3: fallen <= 979 on 386/386
