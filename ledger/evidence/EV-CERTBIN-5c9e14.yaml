      O4 are red-team verification computations of TASK-20260926-c58e87 with
      no RUN-id (DEC-20260926-1adf4e R-6), archived by TASK-20260926-7a06ad.
    scope: >-
      n = 17, f = t^17 + t^3 + 1, m = 2, l = 9, V = {deg < 9} (plus one random
      V' for O4), one curve (A = 97044, B = 126251), the 144 archived x(2E)
      targets (and the 386 Stage-1 unsatisfiable targets for the S_3 fall
      profiles), the frozen lower-part laws, D <= 4, the pinned engine. The
      n = 19 and n = 21 margins are derivations with an assumed ell-syzygy
      count. Claimed nowhere else. NOT a lane closure: KN-OPEN-3c8f51 items (A)
      and (B) stay open, and the tier tripwire (review plan tier_ruling;
      TASK-20260926-7a06ad LC-2) is not engaged.
    resource_check:
      examined: true
      reading: >-
        Taken over from RT-20260926-c58e87 J12 resource_check. Three theories
        take these measurements as their HYPOTHESIS.
        (R-A) DEGREE-4 POLYNOMIAL CALCULUS: every tested unsatisfiable system
        with the convolution-form quadratic part (and, by O4, with one random-V'
        S_3-type part) has a degree-4 PC refutation over F_2 with Boolean axioms
        (the W_D <-> degree-D PC correspondence is RC-1's adaptation of a
        retrieved definition, not re-confirmed here). This is the hypothesis of
        degree-d PC search (Clegg-Edmonds-Impagliazzo; recalled pointer only).
        Relevant only where enumeration does not dominate (m >= 3, chained).
        (R-B) A SATURATION COUNT AS A PRE-DATA PREDICTOR: dim Z_top - trivial -
        ell-syzygies - dim B_{<=3} is computable from the quadratic part alone
        (L-TOP) in seconds, and it predicted the per-record M_4 signature of
        three families before any closure (N-CONV, N-CONV17 saturated; O4
        impossible). Its margin across n (+146 at n = 13 to -319 at n = 23)
        makes generic M_4 saturation on the diagonal polynomial basis a
        small-n phenomenon: the obstruction "N-CONV sits at the M_4 ceiling" is
        the hypothesis of a persistence-in-n statement for SYNTHETIC systems
        (KN-OPEN-3c8f51 item (B)), not for S_3 itself.
        (R-C) A STRUCTURED DEGREE-FALL THEORY: "the degree-4 refutation of
        S_3-type descents is a property of F_{2^n}-multiplication on a subspace
        (W_4), with a polynomial-basis-specific M_4 saturation for generic lower
        parts, and S_3's quadratic-plus-linear pair is a special NON-SATURATING
        one" is the hypothesis of a first-fall-degree theory for low
        F_{2^n}-degree (Frobenius-compatible) Weil descents, in the HFE /
        first-fall-degree tradition (Granboulan-Joux-Stern; Petit-Quisquater;
        Hodges-Petit-Schlather: recalled pointers only, not read, not support).
        ADDITIONAL RESOURCE: the excess fallen codimension (O-13) is an exact
        per-instance invariant that separates the two populations (>= 3 against
        <= 1) and costs seconds; it is a candidate observable for every
        successor arm (RC-2). COORDINATOR EXTENSION: (R-B) is exactly the
        zero-trial gate of nc_dr7_control_decision (iv). No ECDLP use at m = 2
        (oracle A dominates).
