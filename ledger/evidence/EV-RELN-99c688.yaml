    - RUN-RELN-82f487-N14-sigma8-seed2
  type: empirical
  direction: neutral
  strength: inconclusive
  claim_tier: toy
  certificate_refs: []
  proof_status: empirical_only
  proof_refs: []
  observations:
    - >-
      A second full measurement cell (rung N ~ 2^14, curve_seed 102,
      base_seed 202, training_seed 302, sigma = 1/8, all five arms, both
      model classes, both feature regimes) ran using the SAME, unmodified
      source/ implementation as the first cell (EV-RELN-cc045d), the
      contract's second declared seed triple substituted per its own
      replication.seeds list. No code in experiments/EXP-RELN-82f487/source/
      was changed.
    - >-
      Reproduction fixtures were exact, as in the first cell. The
      Z/N-interval positive control passed for every class and regime
      (F0_gnn measured weaker this seed at 4.541 against the threshold
      4.0, still a pass; the other three combinations near or at ceiling).
    - >-
      DIRECT COMPARISON of E_random_vs_ZN_random rho difference against
      its own tolerance_band_halfwidth, both cells:
      F0/gnn: seed1 0.0303/0.0644 (agree) -> seed2 0.0724/0.0594 (DISAGREE).
      F0/trees: seed1 0.0022/0.0644 (agree) -> seed2 0.0531/0.0594 (agree).
      F1/gnn: seed1 0.0795/0.0644 (DISAGREE) -> seed2 0.0204/0.0594 (agree).
      F1/trees: seed1 0.0022/0.0644 (agree) -> seed2 0.0531/0.0594 (agree).
      The first cell's specific F1/gnn pipeline-fault DOES NOT REPLICATE
      at this seed; F0/gnn misses band instead.
    - >-
      Two additional blocking gates fired in this cell that did not fire
      in the first: the label-permutation null (ZN_interval arm, both
      tree-model regimes: lambda 3.46, rho 3.22, against selection-null
      bands with upper bound near 2) and the canary
      (E_log_interval_canary, F1_gnn: lambda 2.53, rho 3.01, against a
      band with upper bound near 2.1).
    - >-
      Across the two cells run so far, EVERY cell has tripped some
      blocking pipeline-fault or leak gate, but never the SAME one twice:
      cell 1 failed on E-random-vs-ZN-random for F1/gnn only; cell 2
      failed on E-random-vs-ZN-random for F0/gnn, on the label-permutation
      null for both tree regimes on the ZN_interval arm, and on the canary
      for F1/gnn. F0/trees and F1/trees agreed within band on
      E-random-vs-ZN-random at both seeds.
  inference: >-
    NO DIAGNOSIS IS OFFERED. The pattern across two cells (different gate
    fails each time, several near-threshold statistics) is CONSISTENT WITH
    either (a) ordinary seed-to-seed statistical fluctuation around
    several tolerance boundaries that happen to be set tightly relative to
    this implementation's actual variance, or (b) a systematic source of
    elevated variance in the hand-written GNN/tree/feature pipeline (per
    the disclosed deviation in both cells' implementation.md: no
    torch/sklearn/xgboost/lightgbm were installed, so both models are
    hand-written). This record does not distinguish between these; it
    reports the comparison only. Per AGENTS.md rule 3 and the contract's
    own decision_paths.inconclusive, neither cell's pipeline-fault gate is
    evidence for or against H-RELN-10ad6b.
  boundaries:
    - >-
      Toy scale, two cells at one rung (N ~ 2^14), sigma = 1/8 only, out
      of the contract's full design (3 curves x 3 base seeds x 3 training
      seeds x 2 sigma x 5 rungs). The third seed triple, sigma = 1/32, and
      every rung beyond 2^14 remain not_run.
  unresolved_confounds:
    - >-
      Whether the pattern of "some gate fails every cell, never the same
      one" reflects statistical fluctuation at genuinely tight tolerances
      or a systematic implementation-variance issue is not determined.
      The concrete follow-up: run a THIRD seed cell (the contract's third
      declared triple, 103/203/303) to see whether the fraction of cells
      passing every gate cleanly stabilizes near some rate, or whether a
      specific statistic (E-random-vs-ZN-random; the ZN_interval
      label-permutation null; the canary) recurs as the most fragile one
      across three independent draws.
  obstruction: null
  reviewed_by: coordinator
