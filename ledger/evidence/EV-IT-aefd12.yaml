    - id: O-3
      text: >-
        rho_special=0.0 at all three tested bit sizes: bits=20 (exhaustive),
        bits=24 (78% coverage, resource_exhaustion), bits=28 (0.16% sample,
        50K of 537M j-invariants). No anomalous/MOV/subfield special curves
        were found in any of the three density universes. The F_hit cumulative
        distribution is identically zero at every hop distance for all three
        primes. This is a correct observation under the pre-registered density
        scan protocol and is NOT negative evidence about the mathematical
        hypothesis (AGENTS.md rules 5-7): it is a null measurement at these
        toy parameters.

    - id: O-4
      text: >-
        19 of 21 unplanted curves reported R_xfer < 1.0. These values are
        censorship lower bounds (mode: censorship_lower_bound) measuring the
        gate BFS search cost relative to matched_rho — they are NOT transfer
        cost measurements. With rho_special=0, there are no special targets;
        R_xfer as a transfer ratio is structurally undefined. All 21 curves have
        certificate_pass=false, null_gate_pass=null, C_special=0 (modeled),
        C_pullback=0 (modeled). n_unplanted_R_xfer_lt_0.7_with_cert=0.
        No sub-rho transfer claim is made or supportable from these values
        (RN-1 required by VAL-20260803-029).

    - id: O-5
      text: >-
        Red Team RT-20260803-030 returned FAIL with three blocking objections.
        RT-047-B1: CTRL-PLANTED-PATH-POS starts from a special curve
        (embedding_degree=1, any_special=true), violating R5-FIX-PRESERVE-M1's
        nonspecial-start requirement. The informal "FIX-3" label invoked in the
        run output is absent from the frozen amendment. RT-047-B2: run-id
        RUN-IT-001-rc47 is not in the amendment's reserved_run_ids; mode
        smoke_then_measure is not a frozen mode; manifest batch_open_decision
        cites DEC-20260803-003 (BATCH-046 opener) rather than a BATCH-047
        opener. RT-047-B3: dirty worktree (run_bounded_toy.py modified);
        reproducibility from committed state unconfirmed.

    - id: O-6
      text: >-
        Structural observation from RT-047-B1: trace of Frobenius is an
        isogeny-class invariant for ordinary curves (Delfs-Galbraith volcano
        structure). Anomalous curves (trace t=1, N=p) occupy their own isogeny
        class (conductor ring at maximal order), distinct from generic curves
        (trace t ≠ 1). An ordinary ell-isogeny walk from a generic curve
        preserves t (mod ell) at most, so reaching an anomalous endpoint
        requires a path of length at least p/(ell^2) in the isogeny graph —
        exponentially long at any fixed ell. This is consistent with
        rho_special=0 at all tested scales and suggests that rho_special=0
        may not be a finite-scale artifact but a structural property of the
        ordinary isogeny graph. This structural concern has not been formally
        proved or refuted in this batch; it is recorded as an observation
        requiring mathematical analysis before further Executor work.

