    - id: O-2
      text: >-
        All three BATCH-046 control voids were closed in the run design:
        BF-1 CLOSED (Smart anomalous cert: p=771853, N=p, trace=1,
        C_special_smart=157=ceil(8*log2(771853)), matched_rho=779; ratio 0.202 < 0.7,
