  headline_framing: >-
    THIS BATCH ESTABLISHED NO MATHEMATICAL RESULT ABOUT ML-KEM AND CLAIMS NONE.
    What it did establish is three things and one correction. (1) A LANE
    CLOSURE WITH A NAMED OBSTRUCTION: two deployment modes -- SSH (R20) and
    IKEv2 (R21) -- carry a normative per-key single-use REQUIREMENT for ML-KEM,
    so M = 1 and best-of-M ciphertext selection has provably ZERO room there by
    the goal record's own convexity bound G <= log2 M. (2) A NORMATIVE DEAD
    END, which the red team calls "the campaign's most transportable product so
    far": eight of fourteen deployment modes state no ciphertext count in
    EITHER direction, and the one normative delegation --
    draft-ietf-tls-hybrid-design-16 Sec. 2, "implementations that do reuse KEM
    public keys MUST ensure that the number of reuses of a KEM public key
    abides by any bounds in the specification of the KEM" -- terminates at
    FIPS 203, which states none. The mechanism's one free parameter is bounded
    neither by mathematics nor by the standards stack. (3) AN INSTRUMENT
    FAILURE, for the right reason plus one the Coordinator did not see: T2's
    frozen sensitivity demonstration manipulated the ERROR LAW while the null
    removed the PROJECTOR, so it could not demonstrate sensitivity to the
    object under study; independently, its 4s threshold was expressed in the
    per-draw sd of the arm with structurally near-zero between-draw variance.
    THE CORRECTION: C3 is NOT unmeetable. The red team measured the missing arm
    and reports the statistic moves 39.3 comparator sds under a projector-side
    manipulation, monotone across a seven-point graded family. Its words:
    "The statistic is alive; one declared arm was wrong."

  scope_statement: >-
    T1: 24 sourced rows (14 deployment-mode, 8 governing-clause, 2 scope-note)
    from retrieved ML-KEM specifications and drafts, each with section,
    bounding mechanism and retrieval date. T2: four cells (d, beta) in
    {100, 140} x {30, 40}, k = d/2, q = 3329, 8 BKZ-reduced bases per cell,
    2^20 CBD_{eta=2} error vectors shared across arms within a cell. T3: the
    pinned lattice-estimator at revision 3e48ef421ec2 under RC.MATZOV. T4: two
    primary-literature reads and a scan of 7,809 knowledge/literature entries.
    Toy scale throughout for anything measured. No ML-KEM break, no security
    claim in either direction, no FIPS 203 parameter set affected or cleared.

  direction_note: >-
    `mixed`: one lane retired with a named obstruction, one instrument failure
