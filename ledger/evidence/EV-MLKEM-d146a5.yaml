  strength_note: >-
    `moderate`. The census rows are individually sourced and the validator
    re-fetched the load-bearing ones byte-identically; but the census's
    one-sentence distribution summary is defective (see
    `corrections_to_this_batch`), and the eight count-unstated rows are an
    absence of documentation, not a measurement. T2's negative is robust --
    the gate failed in all four cells and both reviewers show the gate was
    LENIENT as written, so the failure is understated, not overstated -- but a
    failed instrument supports no distributional conclusion. The red team's
    39.3-sd probe is single-cell, single-instance, and ran in a session
    scratchpad outside any archive task; it is offered by its author as
    "re-derivation, not as a run record" and is recorded here at exactly that
