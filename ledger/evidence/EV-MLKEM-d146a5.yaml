      raised_by: VAL-20260806-bb0559 DEF-2

  the_C3_reachability_finding:
    status: >-
      Recorded as an independent reviewer's re-derivation, NOT as a run record
      and NOT as a repair of this batch. Its author states: "My probes ran in a
      session scratchpad, outside the repository and outside any archive task.
      They are reproducible from the code quoted in notes.md and are offered as
      re-derivation, not as a run record."
    the_question: >-
      Whether C3 is unmeetable by this design -- i.e. whether the rotation-
      invariance argument that voids the frozen sensitivity demonstration also
      voids the real-basis arm.
    the_answer: >-
      NO. Rotation invariance applies to the Haar arm because that projector's
      LAW is O(d)-invariant. The real arm's projector comes from a q-ary
      lattice Lambda_q(A), whose law is invariant under the signed-permutation
      (hyperoctahedral) group, not under O(d); a CBD_{eta=2} error is a product
      measure over coordinates and is likewise hyperoctahedral- but not
      rotation-invariant. Real projector and error therefore share exactly the
      symmetry that would have to be broken for a signal to exist, so a signal
      is possible.
    the_measurement:
      configuration: >-
        d = 100, beta = 30, k = d/2, q = 3329, 2^20 CBD_{eta=2} errors shared
        across arms, the package's own frozen quantile estimator, 8 draws per
        arm. Single cell, single instance.
      ratio_2em10_mean_pm_sd_over_8_draws:
        haar_null: 1.00116 +- 0.00236
        coordinate_aligned: 1.09402 +- 0.00396
        unreduced_qary_tail_GSO: 1.03719 +- 0.00236
      contrast: >-
        Against the package's own per-draw comparator sd s = 0.00236, the
        coordinate-aligned shift of 0.09286 is 39.3 s and the unreduced q-ary
        shift of 0.03603 is 15.3 s. Against the correctly computed SE of the
        difference of two 8-draw means these are ~57 sigma and ~30 sigma. The
        frozen gate demanded 4 s.
      monotonicity: >-
        Over the graded family Q_t = QR(sqrt(1-t) E_S + sqrt(t) G) at
        t in {0, 0.05, 0.10, 0.25, 0.50, 0.75, 1.00}, ratio_2em10 =
        1.09304, 1.08590, 1.07675, 1.05055, 1.01755, 1.00159, 1.00098 --
        strictly decreasing across all seven points, five of them interior.
      why_this_matters_here: >-
        GOAL-MLKEM-004 never achieved this. DEC-20260805-0b3e11 records that
        its sensitivity curve was provably NON-monotone with a crossing at
        t* = 0.7259, which is why no operational direction was available there.
        This statistic does not have that defect.
    the_pre_registered_falsifier: >-
      The parameter that should destroy the signal is beta. The coordinate-
      alignment departure scales like sd(R)/E[R] ~ sqrt(2*(1 - beta/d)/beta),
      so it should DECAY as ~1/sqrt(beta) at fixed beta/d. A departure that
      stays FLAT as beta grows is the canonical artifact tell and must be
      treated as one. This is a property of the formula only; nothing measured
      at d <= 140, beta <= 40 is transported to crypto shapes.

