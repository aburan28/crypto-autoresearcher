  what_is_established:
    - >-
      THE EPHEMERAL LANE IS CLOSED, WITH A NAMED OBSTRUCTION. R20 (SSH:
      "generating an ephemeral key exchange keypair for ECDH and ML-KEM per
      connection is REQUIRED by this specification") and R21 (IKEv2:
      "Generating an ephemeral keypair and ciphertext for each ML-KEM key
      exchange is REQUIRED by this specification") each carry a normative,
      per-key, ML-KEM-specific single-use rule. M = 1 there, so G <= log2 1 = 0
      by the convexity bound already recorded in GOAL-MLKEM-005
      `ceiling_known_in_advance`. Best-of-M ciphertext selection has exactly
      zero room in those modes. Per the goal record's own
      `non_terminal_conditions`, a lane closure retires the LANE and never the
      goal.
    - >-
      NO RETRIEVED SPECIFICATION STATES A NUMERIC M ABOVE 1, and the producer
      declined to read that as a ceiling -- twice, in census.md's Distribution
      section and in "What this census does not say". Its symmetric statement
      is the correct one and is quoted here in full from census.json: "No
      retrieved specification states any numeric M greater than 1, so none
      states an M above 2^20. Symmetrically, and this must be reported with
      equal weight: none of the 8 count-unstated modes forbids one either. The
      absence is an absence of a stated number in both directions; it is not a
      sourced ceiling and must not be read as one."
    - >-
      THE NORMATIVE DELEGATION DEAD-ENDS. draft-ietf-tls-hybrid-design-16
      Sec. 2 delegates the reuse bound to "any bounds in the specification of
      the KEM"; the validator re-fetched the draft (HTTP 200, 52657 bytes,
      sha256 3a5148cb..., byte-identical to the pinned value) and matched the
      sentence verbatim. FIPS 203 states no such bound: the validator's
      independent negative full-text search returned zero hits for
      cryptoperiod, "number of queries/decapsulations/encapsulations/
      ciphertexts/uses", multi-user, multi-target, "single use", "single-use",
      "one-time", "limit the number", "use count", "usage count", lifetime,
      rotate, rotation and "how many" -- after positive controls, and with
      seven terms the census had not declared, which "return nothing either".
      Its verdict: "The negative reproduces and is stronger than stated."
      SP 800-227 Sec. 4.1 describes the static case as "many connections ...
      over a long period of time" (R03) with no count.
    - >-
      T2 IS AN INSTRUMENT FAILURE, ADJUDICATED TO C3's `NEITHER` BRANCH, and
      the producer adjudicated it that way itself rather than rescuing the
      design post hoc. The frozen 4s gate failed in all four cells. Both
      reviewers independently find the gate was more LENIENT than it read --
      the validator by the paired/unpaired mismatch (DEF-3: "4*s =
      0.0078-0.0124 is a 1.8-2.7 sigma gate, not a 4 sigma gate"), the red team
      by the SE of the difference (OBJ-4: 1.75 s, 2.08 s, 1.57 s, 2.06 s across
      the four cells, so the observed shifts are 0.45, 0.52, 1.25 and 1.81
      sigma). The negative is therefore understated, not overstated.
    - >-
      T2's PASSES CARRY NO INFORMATION, and this was declared in advance rather
      than discovered afterwards. E[R] = beta/d is forced for every basis,
      reduced or not; Var(R) under the Beta law is derived, not fitted; and
      results.json labels both "FORCED ... ZERO INFORMATION" and "DERIVED IN
      ADVANCE, not fitted. Agreement is not a discovery." The passes are not
      admissible as validation of anything.
    - >-
      THE DHKLS ONE-OUT-OF-MANY KILL CONDITION DOES NOT FIRE, and this is now
      verified first-hand. T4 recorded its verdict as a statement about the
      retrievable record -- "on the record this environment could retrieve, the
      DHKLS statement is not established as concretely tight at ML-KEM
      parameters" -- and asked a Reviewer to obtain ePrint 2021/1351 and check
      the quotes before the verdict was treated as settled. RT-20260806-d008e0
      obtained the CCS'21 published version, checked Bernstein's Appendix A.4
      citations against it at first hand, found them accurate, and records that
      the kill verdict "survives and is STRENGTHENED". The producer's
      precondition is discharged; the caveat that this is the published
      version and not the ePrint PDF stands.
    - >-
      T3's CONVERSION INSTRUMENT REPRODUCES ITS REFERENCE EXACTLY AND CARRIES
      NO FINDING, as its producer says. Its substantive observation -- that
      `cost_zeta` searches beta and d SEQUENTIALLY, so no reported beta is the
      joint argmin -- holds by source and by execution: the validator read
      estimator/lwe_primal.py at the pinned revision and measured the
      consequence at the baselines as d moving by +8 / +31 / +35 and log2(rop)
      by 0.0088 / 0.0263 / 0.0263 bits. Its finite-difference table is
      dominated by integer quantisation of beta, and the producer labels the
      table "DESIGN AUDIT, NOT A FINDING".
    - >-
      A CORPUS-INTEGRITY FINDING AT SCALE, all six figures confirmed exact by
      independent recount with YAML front-matter parsing rather than regex:
      7,809 literature entries total; 7,421 of 7,809 name a `downloads/` path
      that never existed; 5,582 of 7,809 (71.5%) carry `citation_verified:
      read` with every identifier null; 1,938 of 1,939 entries containing "no
      abstract extractable" are nonetheless marked read, the single exception
      being KN-LIT-7607. The validator's disposition is adopted unchanged:
      "The corpus figures are exact and systemic. Acting on them is a curation
      decision outside every role in this batch."

  what_is_NOT_established:
