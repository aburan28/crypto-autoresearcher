    - id: CX-4
      supersedes: >-
        the "expected contrast EXACTLY ZERO" wording in T2 report.md Sec. 5.3,
        verify.py's V6 comment block, receipt.json D2, and the Coordinator's
        repetition of it
      correction: >-
        Zero to leading order in the MARGINAL law, which is proved and correct.
        The declared statistic is an empirical order statistic over N samples
        sharing one projector, so its expectation depends on the CONDITIONAL
        law given P, which the two arms do not share -- as the producer's own
