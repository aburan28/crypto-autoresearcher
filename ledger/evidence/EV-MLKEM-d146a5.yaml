      raised_by: VAL-20260806-bb0559 DEF-1 and RT-20260806-d008e0 OBJ-8, independently
      direction: Does not affect the INSTRUMENT FAILURE adjudication, which both reviewers uphold.
    - id: CX-5
      supersedes: T2's V6c figures "a factor 1198" and "agreement to 0.69%"
      correction: >-
        Quoted at a precision a 64-draw sample variance cannot support: its own
        relative sd is sqrt(2/63) = 17.8%. The validator's independent 64-draw
        measurement returns 827 for the same ratio. The closed form
        1.4973262032085532e-05 is confirmed exactly as algebra. Material
        because the producer's requested D2 amendment rests on both measured
