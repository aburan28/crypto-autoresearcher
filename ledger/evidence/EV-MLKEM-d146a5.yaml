      raised_by: RT-20260806-d008e0 OBJ-5
      coordinator_note: >-
        "four" was mine, not the producers'. reads.md Sec. 3.2 lists eight
        route rows; the producers' own list has at least seven failed routes
        for the body. Both the count and the framing in snapshot commit
