  corrections_to_this_batch:
    - id: CX-1
      supersedes: >-
        the distribution sentence in census.md and census.json, and the
        Coordinator's repetition of it in snapshot commit 7983a474 and in
        archives/TASK-20260805-9f6345/snapshot_receipt.json
