evidence:
  id: EV-SSIQ-c3df82
  hypothesis_id: null
  hypothesis_id_note: >-
    Explicitly null, not omitted: this batch executes the truncation-
    mutation control ranked as BATCH-012's next action in
    DEC-20260806-f7d62d, itself the Red Team's own named counterexample
    from RT-BATCH-011. It does not test H-SSIQ-36e970's real-arm
