  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  batch_id: BATCH-012
  experiment_ids: [EXP-SSIQ-a85692]
  run_ids: [RUN-SSIQ-a85692-i]
  type: empirical
  direction: neutral
  direction_note: >-
    NEUTRAL, and this is the substantive finding of this batch, not a
    formality: RT-BATCH-011 predicted this control could either close
    PF-6's RNG-sharing channel further (if n_value_differs stayed at 0
    under genuine truncation) or reopen it (if n_value_differs rose).
    Neither happened in an evidentially meaningful sense. The observed
    n_value_differs=0 is REAL and independently confirmed, but this
    batch's own Red Team review, independently re-verified by this
    Coordinator, demonstrates it is not informative either way: the
    resolved sample is too small, too correlated, and too selection-
    biased to distinguish "the channel is closed under truncation" from
    "the channel reopens at a real, moderate rate this sample was
    structurally incapable of detecting." The correct status is
    INCONCLUSIVE, not a narrowing toward either of RT-BATCH-011's two
    named outcomes.
  strength: preliminary
  strength_note: >-
    preliminary, campaign-wide cap unchanged (session-only independence).
    Materially WEAKER than BATCH-011's own strength for the specific
    question this batch was built to answer, despite clean execution:
    this record's evidentiary content is dominated not by "0 differences
    observed" but by the QUANTIFIED LIMITS on what that observation can
    support (see O-2/O-3/O-4). A follow-up run at an intermediate budget
    (0.8-1.0s, between this run's 0.5s and the observed 1.14993s natural-
    completion floor) is required before this specific question can be
    meaningfully advanced, per both reviewers' converging recommendation.
  claim_tier: toy
  claim_tier_note: >-
    Toy scale, single prime p=2437, N=203 vertices. Second amendment in
    this lineage (after v8) to spend real, non-recoverable delta_E search
    compute, though at a much smaller scale (101.46s of a 600s budget,
    vs. v8's 278.5s of 3600s).
  proof_status: empirical_only
  proof_refs:
    - experiments/EXP-SSIQ-a85692/runs/RUN-SSIQ-a85692-i/truncation_probe_comparison.json
    - experiments/EXP-SSIQ-a85692/runs/RUN-SSIQ-a85692-i/execution_report.yaml
    - coordination/goals/GOAL-SSIQ-001/batches/BATCH-012/reviews/VAL-BATCH-012.md
    - coordination/goals/GOAL-SSIQ-001/batches/BATCH-012/reviews/RT-BATCH-012.md
  preregistration_binding:
    specification: experiments/EXP-SSIQ-a85692/specification_v9.yaml
    freeze_commit: d729af05
    verified_by: TASK-20260806-b8fdf8
    detail: >-
      specification_v9.yaml frozen 2026-08-06 at commit d729af05, after
      TWO pre-freeze Red Team review rounds. Round 1 (DO-NOT-FREEZE):
      PF-1, a blocking source-file/key-format mismatch in REQUIRED
      COMPARISON 2, directly demonstrated via a reproduced KeyError
      against the actual committed RUN-SSIQ-a85692-h artifacts; three
      advisory findings (PF-2 arithmetic, PF-3 hardware-reproducibility
      caveat, PF-4 soft-cap disclosure). Round 2 (FREEZE-WITH-FIXES):
      PF-1's fix independently re-verified by directly re-running the
      specified parsing round-trip against all 203 real keys in the real
      committed file (zero collisions); one new advisory (PF-5,
      write-order/failure-isolation discipline), applied. The Validator
      independently confirmed manifest.yaml's code.commit equals the
      freeze commit, independently RE-EXECUTED the committed script from
      a clean scratch directory (reproducing every non-timing-dependent
      result exactly; the timing-dependent n_resolved split differed as
      PF-3 discloses is expected), and DYNAMICALLY tested PF-5's
      failure-isolation code by forcing a real exception against the
      unmodified script -- confirming PART A's result survives a
      Comparison-2 failure, not merely by reading the code.
  observations:
    - id: O-1
      statement: >-
        EXECUTION FIDELITY IS CLEAN, INDEPENDENTLY CONFIRMED BY BOTH
        REVIEWERS, INCLUDING A DYNAMIC TEST OF THE NEW PF-5 FAILURE-
        ISOLATION REQUIREMENT. The Validator independently re-executed
        the committed script from a clean scratch directory (every non-
        timing-dependent result reproduced exactly: 194/194 timeouts,
        0/0 value differences on both comparisons, comparison_2_error
        null; the timing-dependent n_resolved split differed, 10 vs. 8,
        exactly as the frozen contract's own PF-3 finding discloses is
        expected for a real-time wall-clock cutoff) and DYNAMICALLY
        forced a real FileNotFoundError inside Comparison 2 against the
        unmodified frozen script -- confirming PART A's own core
        measurement and Comparison 1's result are written intact and
        comparison_2_error correctly captures the exception, not merely
        that the code looks correct on static read. The Red Team
        independently confirmed the same PF-5 code path by direct trace
        and raised no objection to execution fidelity, cost/budget
        honesty (101.46s of 600s, 16.9% utilization), or scope
        (OBJECTIVE_BOUNDARY correctly excludes any PERSISTS/WEAKENS
        label or claim about H-SSIQ-36e970/lever L4). This Coordinator's
        own precommit checks independently re-derived the same coverage
        figures and both comparison results from raw JSON before the
        snapshot commit, converging with both reviewers.
      supported_by: [TASK-20260806-5aa2e6, TASK-20260806-164c92, TASK-20260806-b8fdf8, TASK-20260806-30d8d3]
      confidence: high
    - id: O-2
      statement: >-
        TRUNCATION WAS FAR MORE SEVERE THAN THE FROZEN CONTRACT
        ANTICIPATED, THOUGH THE RED TEAM SHOWS THIS WAS CLOSE TO
        ARITHMETICALLY FORESEEABLE FROM DATA THE CONTRACT ITSELF ALREADY
        CITED. specification_v9.yaml's own text anticipated "some or
        most" of the 194 non-F_p-rational vertices resolving under the
        0.5s budget; the actual outcome was 8/194 (4.1%, independently
        confirmed by this Coordinator, the Validator, and the Red Team
        from raw per_vertex_records), with all 194 vertices hitting the
        timeout on at least one table-build half. The Red Team traced
        this to RUN-SSIQ-a85692-h's own already-committed per_vertex_
        records: the MINIMUM full, non-truncated two-sided completion
        time across all 194 vertices was 1.14993s -- more than double
        v9's entire 0.5s budget, before any split between source-half
        and target-half is considered -- so near-total timeout was close
        to the only arithmetically plausible outcome given data already
        in the frozen spec's own budget-justification text, not a
        genuine surprise about the algorithm's behavior. This is a
        calibration lesson for future amendments (read completion-time
        citations through to their implication before setting an
        "expected" truncation fraction), not a defect in this run.
      supported_by: [TASK-20260806-30d8d3]
      confidence: high
    - id: O-3
      statement: >-
        THE "0/8" (EQUIVALENTLY "0/17") NULL RESULT IS STATISTICALLY AND
        MECHANISTICALLY TOO WEAK TO SUPPORT ANY CONCLUSION ABOUT
        RT-BATCH-011's BOUNDARY QUESTION -- INDEPENDENTLY CONFIRMED,
        QUANTITATIVELY, BY BOTH REVIEWERS THROUGH DIFFERENT METHODS.
        The Validator computed a Clopper-Pearson 95% upper confidence
        bound for a Bernoulli differencing-rate parameter given 0
        observed differences in 8 trials: 36.9%. The Red Team computed
        31.2%. This Coordinator independently re-derived both formulas
        and confirms NEITHER is an error: they are two standard,
        differently-scoped conventions for the same underlying question.
        1 - 0.05^(1/8) = 31.2% is the strictly ONE-SIDED 95% upper
        confidence bound (all 5% of the tail mass allocated above the
        bound); 1 - 0.025^(1/8) = 36.9% is the upper endpoint of the
        conventional TWO-SIDED 95% Clopper-Pearson interval (2.5% of the
        tail mass above the bound, matching most statistical software's
        default reporting convention). Both are legitimate; this record
        cites the wider, two-sided-convention figure (36.9%) as the more
        conservative and more commonly recognized one, while noting the
        one-sided figure (31.2%) is the tighter bound under the
        alternative convention -- either way, "roughly one-in-three to
        one-in-two" (see the pair-corrected figure below) remains fully
        consistent with the observed zero differences. The Red Team went further and found the 8
        resolved vertices are not 8 independent trials: they are 4 exact
        Frobenius-conjugate pairs (v and (a, p-b), since
        two_sided_search's own target is field.frobenius(v)) --
        independently re-verified by this Coordinator directly against
        build_isogeny_graph.py's frobenius formula and all 8 vertex
        tuples in per_vertex_records: (59,422)/(59,2015),
        (90,762)/(90,1675), (490,674)/(490,1763), (756,344)/(756,2093),
        each an exact p-b conjugate pair. Recomputing the 95% bound on 4
        independent pairs gives 52.7%. A true per-vertex (or per-pair)
        divergence rate as high as roughly one-in-three to one-in-two
        remains fully consistent with the observed zero differences.
      supported_by: [TASK-20260806-b8fdf8, TASK-20260806-30d8d3]
      confidence: high
    - id: O-4
      statement: >-
        THE RESOLVED SAMPLE IS NOT MERELY SMALL -- IT IS A MECHANISM-
        TRACED, EXTREME-VALUE SELECTION FROM THE SUBPOPULATION LEAST
        LIKELY TO BE SENSITIVE TO THE TRUNCATION EFFECT UNDER TEST,
        INDEPENDENTLY RE-VERIFIED BY THIS COORDINATOR DIRECTLY AGAINST
        THE ARCHIVED GROUND TRUTH. The Red Team pulled RUN-SSIQ-a85692-b's
        full archived delta_map for p=2437 and computed its value
        histogram over the 194 non-F_p-rational vertices: delta_E=2 is
        34/194 (17.5%), delta_E=3 is 70/194 (36.1%, the MODAL value),
        delta_E>=4 is 90/194 (46.4%) -- this Coordinator independently
        reproduced the identical histogram from the same archived file.
        ALL 8 of this run's resolved vertices have delta_E=2, the
        smallest nontrivial achievable value; ZERO resolved at delta_E=3,
        the true population's most common value. The Red Team traced
        this to build_smooth_table's strict best-first, lowest-degree-
        first expansion order: a vertex whose true minimal collision
        degree is the smallest achievable value is discoverable within
        the fewest heap-pops on BOTH sides simultaneously, the one
        scenario where a severely truncated partial table is still
        likely to already contain the answer -- confirmed NOT to be a
        "resolved faster" timing artifact (resolved vertices' wall_seconds,
        0.50-0.54s, statistically overlap unresolved vertices' 0.50-0.57s
        almost entirely; nothing in this design terminates early). This
        run's own stated design intent -- does a resolved-but-truncated
        search find a DIFFERENT value than the same seed at full budget
        -- was therefore essentially never tested: the 8 vertices that
        resolved are close to definitionally the least likely to show
        such a divergence, while the 186 vertices whose true answer
        requires deeper search (where a genuine divergence could
        plausibly appear) produced no data at all.
      supported_by: [TASK-20260806-30d8d3]
      confidence: high
  inference: >-
    RUN-SSIQ-a85692-i executes exactly as specification_v9.yaml requires,
    confirmed independently by both the Validator (true C-REPRO on every
    non-timing-dependent result, plus a dynamic test of the new PF-5
    failure-isolation requirement) and the Red Team (execution fidelity,
    cost/budget honesty, and scope discipline all clean). But this
    batch's substantive finding is that its own headline "0/8 value
    differences" result cannot bear the evidentiary weight a first
    reading suggests: this Coordinator independently re-verified both
    the statistical-power quantification (O-3) and the mechanism-traced
    selection-effect argument (O-4) directly against the archived ground
    truth and the search algorithm's own code, and both hold. The
    correct status of RT-BATCH-011's truncation-boundary question after
    this batch is INCONCLUSIVE, not narrowed toward either of its two
    named outcomes (channel closed vs. channel reopens). This is a
    genuine, if negative-shaped, contribution: it identifies precisely
    why a naively-designed truncation probe at too-severe a budget fails
    to test what it was built to test, and names the specific,
    actionable fix (an intermediate budget, 0.8-1.0s, between this run's
    0.5s and the observed 1.14993s natural-completion floor).
  boundaries:
    - >-
      No claim about H-SSIQ-36e970, a delta_E-gradient's existence, or a
      p^{1/4} algorithm. Lever L4 is NOT retired.
    - >-
      This run's n_value_differs=0 MUST NOT be cited as evidence that
      the determinism argument extends into the truncated regime, or
      that PF-6's RNG-sharing channel remains closed under truncation.
      The correct citation is that this specific probe was underpowered
      and selection-biased to test that question, per O-3/O-4.
    - >-
      BATCH-011's own conclusion (PF-6's RNG-sharing channel closed for
      p=2437 by a scale-bound determinism argument, in the NON-truncated
      regime) is UNCHANGED and UNCHALLENGED by this batch -- this batch
      concerns only the separate, still-open question of what happens
      once truncation is genuinely forced.
    - >-
      Any future citation of a resolved-vertex sample from a severely
      truncated search must check for the two selection effects named
      here (value-extremity bias toward the smallest achievable
      delta_E; Frobenius-conjugate-pair correlation halving effective
      sample size) before treating the sample as representative or
      independent.
    - >-
      Toy scale throughout (p=2437, N=203); nothing transfers to
      cryptographic scale. Evidence strength stays capped at
      preliminary; model independence remains session-only.
  unresolved_confounds:
    - >-
      The truncation-boundary question RT-BATCH-011 named (does
      n_value_differs rise once genuine truncation is forced) remains
      UNRESOLVED after this batch. Both reviewers converge on the same
      next action: a follow-up run at an intermediate per-vertex budget
      strictly between 0.5s and the observed 1.14993s natural-completion
      floor (e.g. 0.8-1.0s, or a sweep across that range), high enough
      to plausibly pull delta_E>=3 vertices into the resolved set while
      staying below every observed natural completion time so genuine
      truncation is preserved.
    - >-
      Whether the value-extremity selection effect (O-4) would persist,
      weaken, or reverse at a less severe truncation budget is itself an
      empirically testable, falsifiable prediction (per RT-BATCH-012's
      own "Counterexample or mutation" section) that a follow-up run
      would directly address.
    - >-
      Model independence remains absent and unverifiable in this
      environment, unchanged from every prior batch.
