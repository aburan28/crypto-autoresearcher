  observations:
    - >-
      SNAPSHOT INTEGRITY HOLDS. The reviewer independently recomputed the
      snapshot hashes and confirmed they match the receipt at commit
      966a46c5.
    - >-
      FIX 1 (BOUNDARY ALGEBRA) CONFIRMED CORRECT BY INDEPENDENT
      RECOMPUTATION, done twice: once by the dispatcher before preserving
      the artifact (commit 6add2958), once by the red team in a fresh scratch
      session. MC_P13_CORRECTED's penalty term is exactly 0.0 at w=M for all
      five committed P rows. Both parties confirm this is not an
      approximation but an algebraic identity.
    - >-
      FIX 2 (REPRODUCTION GATE) CONFIRMED. RG-1/2/3/5 all reproduce from the
      T1/T2 literals under the gate's own declared configuration. RG-5's span
      [2.52409, 11.275638] matches EV-SSI-455241's independently cited
      figures (2.5241/11.2756) under both the dispatcher's and the red
      team's independent recomputation.
    - >-
      FIX 3 (THE BINDING DEFECT) CONFIRMED FIXED, NARROWLY. The red team's
      own words: "BOUNDARY-CONDITION-GATE is genuinely, independently
      verified capable of returning a negative for the specific
      constant-offset anchor-error defect class that got the predecessor
      rejected (demonstrated via BCG-2 against the program's own historical
      formula, not a straw model). This satisfies DEC-20260806-a00a28's 'at
      least one control' requirement." BCG-2's residuals
      (46.25/69.3/90.65/103.0/136.1 bits at the five committed P rows,
      reproducing 0.5*L_mem(P) exactly) were independently recomputed by
      both the dispatcher and the red team from the literal rejected formula
      transcribed verbatim from EXP-SSI-697354.
    - >-
      QUALIFICATION ON FIX 3, RECORDED SO IT IS NOT LOST. The red team:
      "It does not make the other inherited controls object-level-capable" --
      the roughly dozen controls carried unmodified from EXP-SSI-697354
      remain, as before, essentially unreachable-to-fail on the frozen
      committed data. DEC-20260806-a00a28 required AT LEAST ONE capable
      control, not that every control become capable; that bar is met. This
      is not re-opened as a blocking defect, but the qualification travels
      with any future citation of this contract's control set as a whole.
    - >-
      FIX 4 (MECHANICAL) CONFIRMED. re and ast present in
      stdlib_modules_permitted; the w-grid literal (memory_grid.w_grid_log2)
      matches H-SSI-7fe2bf line 500 exactly, independently checked.
    - >-
      MODERATE FINDING, REQUIRED BEFORE THIS CONTRACT'S OUTPUT MAY BE CITED
      AS FULLY REVIEWED. RG-REPRODUCTION-GATE.can_this_control_fail asserts
      "those bands were never actually sensitive to the memory term at
      log2_w=1000 in either formula version" (specification.yaml lines
      626-632). This is FACTUALLY WRONG for the superseded formula, and the
      dispatcher independently confirmed the contradiction: at
      log2_w=1000, min(1000, L_mem(P)) clamps to L_mem(P) for every
      committed P (max L_mem=272.2 << 1000), so the superseded formula's
      penalty is -0.5*L_mem(P), NOT zero and NOT insensitive -- it is exactly
      EV-SSI-455241's own dispatcher-verified OBJ-1 finding (72.211337 vs
      band [118.25,118.75], a 46-bit deviation at P=256). The spec's own
      prose contradicts a record it cites. This does not affect any
      assertion's correctness -- RG-1..5 and BOUNDARY-CONDITION-GATE are both
      correctly specified and independently verified as computed -- it is a
      wrong explanatory claim about WHY BOUNDARY-CONDITION-GATE is needed,
      which could mislead a future reader into believing RG-1..5 provides
      more coverage than it does.
    - >-
      LOW-SEVERITY FINDINGS, NOT BLOCKING: notational symbol reuse in
      equivalent_form; BOUNDARY-CONDITION-GATE's single-point/
      single-alternative-model scope (a sign-flipped-clamp mutation would
      pass BCG-1 and is caught only by MONO-1, not disclosed as a scope
      limit in the control's own description); EV-SSI-455241's SCOPE-A/
      SCOPE-B double-counting finding is not carried forward into this
      contract as a caveat.
    - >-
      No reintroduction of IDEA-20260806-62ba9d's withdrawn quantitative
      claims, confirmed by both parties. SCOPE-B growing-gap figures
      (9.5387/21.9537/38.8387 bits) independently recomputed and matched by
      the red team.

  inference: >-
    All four repairs DEC-20260806-a00a28 required are independently verified
