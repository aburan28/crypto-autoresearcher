  observations:
    - id: O-1
      text: >-
        THE ARITHMETIC IS NOT IN DISPUTE and was never the weak point. The red team
        reimplemented every figure in COST-SEMBIN-8d123b from formulas restated
        independently, importing none of the producer's code, and reproduced all of
        them to a worst disagreement of 4.8e-5 bits, including all four published
        crossovers exactly (303 time-only both readings, 435 dense product, 375
        sparse product). The blind re-derivation reproduced the ENTIRE DENSE BRANCH
        (86.8371 memory, -8.7946 margin, crossover 435) with no substitution at all.
        Three independent implementations now agree on the spine.
    - id: O-2
      text: >-
        THE MEMORY ACCOUNTING HOLDS (J1). The variable count N = n(t-2) + kt is
        exact and is confirmed twice from two different sections of the frozen text,
        both returning 2790, 4099, 6286 at (310,10), (409,11), (571,12). The
        relation store k + log2(mk + 2n) = 48.27 bits at n = 409 is textually
        grounded. max-versus-sum is immaterial: the working set dominates the store
        at every FIPS cell under both readings, so the two differ by 0.0 to 0.0005
        bits, and 0.26 bits even under the sparsest accounting the validator could
        construct.
    - id: O-3
      text: >-
        THE CO-ORDINATOR'S FIRST PRIOR IS REFUTED. The prior expected the dense
        width^2 reading to be the least defensible number in the record and expected
        a reviewer to argue it has no textual basis, which would have retired the
        435 crossover and REMOVED the n = 409 flip. The validator disagreed and
        found the opposite: the paper gives NO memory model at all, so neither
        reading has a basis in it and both have one in the recorded
        ellipticnews/ePrint dispute (KN-LIT-e77232) -- width^2 is Galbraith's count
        and the sparse (nm)^4/24 x n^3/m is Semaev's own answer. Retiring width^2
        would leave the record reporting only the defendant's estimate. The dense
        reading stands as a disclosed upper bound rather than a straw.
    - id: O-4
      text: >-
        THE FROZEN SOURCE CARRIES 34 UNUSED MEMORY MEASUREMENTS OF THIS EXACT
        OBJECT and the record never compared its memory model against any of them.
        The validator ran the comparison. Under the reading of the Tables 1-2 MB
        column as a PEAK, measured peak lies BETWEEN the record's two readings in 21
        of 27 non-trivial rows; width^2 upper-bounds all but one row (failing it by
        1.7 bits); and a rows x cols dense accounting fails as an upper bound on ALL
        27. So the bracketing survives contact with the only data that exists, and
        the third accounting that would have narrowed it does not.
    - id: O-5
      text: >-
        THAT COMPARISON RESTS ON A CONTRADICTION THE ROUND REPORTS RATHER THAN
        SETTLES. tables.yaml's own transcription_limits says the MB column is the
        TOTAL over 100 systems, not a peak. The validator computed both readings and
        picked neither: under the total reading every model over-predicts, rows x
        cols becomes an upper bound too, and the discrimination in O-4 disappears.
        The recurring exact 32.1 MB on six unrelated easy rows is the signature of a
        process floor and hence of a peak, which is an inference and not a
        resolution. A Coordinator who resolves this the other way should expect O-4
        to weaken to inconclusive.
    - id: O-6
      text: >-
        THE BASELINE IS CHARGED AT A DOMINATED OPERATING POINT, and this is the
        round's largest single finding (J2). The record charges van
        Oorschot-Wiener the MEMORY of a 2^30-point distinguished-point store and the
        TIME of one processor. Those are different points on vOW's curve. Modelling
        the curve as T = W(1/M + 1/w), Mem = 3n max(w, M), the product
        T x Mem = 3n W (max(w,M)/M + max(w,M)/w) >= 2 x 3n x W is invariant along it
        with the minimum anywhere w ~ M, and a numeric grid over
        (log2 w, log2 M) in [0,80]^2 confirms the record's charge exceeds that
        minimum by EXACTLY 29.0 bits at n = 283, 310, 409 and 571 alike.
    - id: O-7
      text: >-
        CHARGING THE BASELINE COHERENTLY MOVES THE CROSSOVER 85 IN n AND REMOVES THE
        STRADDLE. dense 435 -> 520, sparse 375 -> 460; the n = 409 sparse margin
        moves from +11.52 to -17.48 and the dense from -8.79 to -37.79. AT n = 409
        THE CHAINED ALGORITHM THEN LOSES UNDER BOTH STORAGE READINGS. Charging each
        algorithm the minimum of its own time-memory curve -- the Pareto-honest
        comparison of two tunable algorithms, and the dominated_by check the record
        owes and lacks -- gives crossover 460 sparse / 518 dense, with n = 571 the
        first FIPS label at which Semaev is ahead (+40.49 sparse).
    - id: O-8
      text: >-
        THE CO-ORDINATOR'S SECOND PRIOR IS REFUTED, AND ITS SIGN WAS BACKWARDS. The
        prior expected the missing time-memory tradeoff to be an asymmetry favouring
        the BASELINE, i.e. the record understating Semaev. Charged as a TIME penalty
        at the record's own operating point M = 1, the distinguished-point tail costs
        log2(1 + 1/w) = 0.0000 bits for every w in {2^20 ... 2^60} at n = 409 and
        n = 571, first reaching 1.0 bit at M = w = 2^20. The tradeoff bites through
        MEMORY and it bites the other way, by 29 bits against Semaev. The red team
        recorded this as the strongest objection it could NOT make land.
    - id: O-9
      text: >-
        THE CONTRACT'S OWN FRAMING-FAILURE CONDITION FIRED. EXP-SEMBIN-f4a17b's
        falsification_criterion says that if the crossover depends more strongly on
        the vOW store parameter than on the metric choice, the deliverable is a
        two-parameter surface and the hypothesis's framing is wrong even where its
        direction is right. store_log2 is fixed at 30 in vow_log2's default and
        never varied in any crossover, although the contract declared
        distinguished_point_store_log2 [30, 40, 48, 60] as an independent variable
        and the run tabulated vOW across it in cost_table() without ever passing it
        to compare_at or crossover_curve. Across store_log2 in {0, 20, 40, 60} the
        crossover moves 180 in n dense and 183 sparse; metric choice moves it 132
        and 72. Restricted to the four values the CONTRACT ITSELF declares, the
        sparse crossover ranges over 96 in n against the metric's 72. This is an
        unmet preregistered deliverable, not an omission.
    - id: O-10
      text: >-
        THE MATCHED-NULL ATTRIBUTION IS OVERTURNED, and the Coordinator recorded
        that it did NOT expect this. CLAIM A asserts the whole shift is attributable
        to Semaev's relation store, matched-null share = 0. The control returns 0
        under time_only and equal_rate_max -- the two metrics under which memory is
        INERT -- and returns null under time_memory_product and area_time_AT, the
        two metrics the claim is actually about, because a zero-memory comparator
        makes log2(memory) = -inf. Under the metric the claim quotes it for, THE
        CONTROL DID NOT RUN; IT DEGENERATED. Decomposed against the informative null
        (a baseline with the 3n bits it actually needs): +219 dense / +159 sparse
        from Semaev's memory and -87 from the baseline's store, netting the reported
        +132 / +72. The baseline's charge is 55% of the magnitude of Semaev's and
        works in Semaev's favour. share = 0 is false.
    - id: O-11
      text: >-
        FOUR DECLARED METRICS ARE TWO DISTINCT FUNCTIONS (J3). area_time_AT and
        time_memory_product are the same expression in memory_charged_cost.py
        (log2_time + mem in both branches at memory_weight = 1); the code comment
        claiming AT is distinguished by charging the ceiled-k store even when the
        working set is smaller describes something the implementation does not do.
        equal_rate_max_of_time_and_memory returns max(time, memory) and at every one
        of the 10 (n, storage) cells neither algorithm's memory exceeds its own time,
        so it reduces identically to time-only. The four-metric framing overstates
        corroboration by a factor of two. THIS IS NOT METRIC-SHOPPING: the four are
        the contract's own preregistered cost_metrics list, approved in
        DEC-20260913-ebd639 before the run, so it is a design defect in the contract
        and not a post-hoc selection, and the red team said so explicitly.
    - id: O-12
      text: >-
        UNDER ANY FIXED PHYSICAL MEMORY BUDGET THE TWO READINGS AGREE. Semaev's
        cheapest memory over m in [2,30] at n = 409 is 2^65.33 bits sparse (m = 8)
        and 2^80.07 dense (m = 6). Under a hard budget -- an algorithm that does not
        fit does not run -- both readings say n = 409 is a LOSS at every budget below
        2^65 bits, i.e. below four exabytes, which is above every storage system that
        exists; they disagree only in the band 2^65 to 2^89. Under memory-weighted
        time T x M^alpha the dense reading flips at n = 409 only for alpha >= 0.811
        and the sparse reading does not flip anywhere in alpha in [0,1], so the swing
        that straddles zero lives in the last 19% of that family's range.
    - id: O-13
      text: >-
        OF EIGHT CHARGING CONFIGURATIONS EXAMINED, ONLY TWO STRADDLE ZERO AT n = 409
        AND ONE IS THE RECORD'S OWN. Applying every correction at once rather than
        adding separately-quoted shifts: all corrections at B-409 gives 481 dense /
        421 sparse with margins -24.80 / -3.76, both readings agreeing vOW wins;
        every pro-Semaev correction with the record's baseline kept gives 397 / 337
        with +4.70 / +25.74, both agreeing Semaev wins. The straddle is a property of
        one particular charging of the baseline, not a property of the two storage
        readings, and not a property of the algorithm.
    - id: O-14
      text: >-
        TWO DISCLOSURES IN THE RECORD CARRY THE WRONG SIGN OR THE WRONG RANGE, and
        one of them is repeated in the review plan so it would have propagated. (i)
        The record says taking q = 2^n and neglecting the FIPS cofactor makes rho
        look cheaper and so flatters the BASELINE; rho runs in the prime-order
        subgroup of order ~2^n/h at cost 0.886 x 2^{n/2}/sqrt(h), so taking q = 2^n
        OVERCHARGES the baseline and flatters SEMAEV. Magnitude 1 to 3 in n. (ii)
        K-409 and B-409 are charged identically on one row although a Koblitz curve's
        |Aut| ~ 2n = 818 gives a further 4.34 bits of baseline discount beyond the
        negation factor already inside 0.886, worth 11 in n, disclosed nowhere.
    - id: O-15
      text: >-
        THE SUBSTITUTED NEARBY-OBJECT CONTROL IS VACUOUS WITHIN THE RECORD'S OWN
        ERROR ENVELOPE (J6). The eq. (4) control passes by 1957 to 5977 bits, which
        is 54 to 147 times further than the largest uncertainty the record's own
        sensitivity analysis contemplates (degree bound 6, 36 to 41 bits). Every
        error class in that analysis leaves it passing; for it to fail, the effective
        degree bound would have to be wrong by a factor of roughly 500. It is a typo
        detector for one line of the degree argument, not a validity check on the
        cost model. CLAIM A HAS FIVE CONTROLS, NOT SIX.
    - id: O-16
      text: >-
        THE RECORD'S STATED REASON FOR THAT SUBSTITUTION IS FALSE AS WRITTEN. The
        run asserts a prime-field index-calculus cost model is in neither the frozen
        source nor this repository's corpus and that building one would have meant
        inventing formulas. The red team located EXP-ICEX-c32447 (a fully specified
        prime-field model with three separated counters and a multi-target rho arm
        with a shared distinguished-point table -- the exact comparison shape this
        run needed; status draft, no runs), EXP-ICEX-349205 (status review_required,
        no runs), the committed DEC-20260804-14b457, and KN-OPEN-001, which the
        contract itself names as the reference answer. The correct disclosure is that
        such models exist as specified but unexecuted contracts and instantiating one
        was out of scope. That is a materially different statement and it does not
        rest on a false premise.
    - id: O-17
      text: >-
        THE RECORD'S CROSSOVERS ARE CONVENTION-DEPENDENT UNDER A RULE THIS PROGRAM
        HAS ALREADY WRITTEN DOWN, and are quoted without it. EXP-ICEX-c32447 declares
        that solver work counted in field operations converts to group operations at
        kappa in {1, 10, 100} and that a conclusion flipping across the kappa range
        is labelled convention-dependent and may not be quoted without kappa.
        COST-SEMBIN-8d123b declines any conversion and calls the mismatch the largest
        single source of imprecision in its table. Across that kappa grid the
        crossover moves 20 in n (time-only 303 -> 293 -> 283; sparse product
        375 -> 364 -> 354). No FIPS verdict flips on kappa alone, so the verdict map
        survives; the crossover figures are convention-dependent.
    - id: O-18
      text: >-
        THE RECORD COMPUTES k = ceil(n/m) -- the reading Sections 3 and 4.5.2
        actually define -- ONLY under time-only (303 -> 281) and never under the
        product metric its headline lives in, where it is worth -24 in n
        (435 -> 411, 375 -> 351). Unit conversion at 10 to 100 field operations per
        group operation is worth -11 to -21, and not re-optimising m under the
        memory-charged metric is worth -0 to -2. These three run in the
        Coordinator's expected direction and are real; they are smaller than the +85
        that runs the other way.
    - id: O-19
      text: >-
        THE BRACKET WIDENS WITH THE PARAMETER AND THE RECORD DOES NOT DISCLOSE IT.
        The gap between the two storage readings is about 7 bits at N ~ 50, where the
        34 measurements are, and 19 to 21 bits at N = 2790 to 6286, where the claims
        are. A reader cannot tell from the record that the 46.6-bit swing at n = 409
        is largely an extrapolation of a gap last observed at a seventieth of the
        scale.
    - id: O-20
      text: >-
        THE 0.886 WALK CONSTANT IS CLOSED AND CANNOT MATTER. Across the full
        plausible range 0.886 to 1.2533 = sqrt(pi/2) the sparse crossover moves from
        375 to 373 and the n = 409 margin from +11.52 to +12.02: two in n. The
        relayed provenance of that constant (KN-LIT-012 records that its own full
        text was not re-read) is therefore load-bearing for nothing here. Recorded
        because a red team that reports only its hits is reporting its bias.

  inference: >-
    THE DIRECTION OF CLAIM A SURVIVES AND IS STRENGTHENED; ITS HEADLINE FRAMING DOES
    NOT. What survives is the part H-SEMBIN-83999d actually predicted: the paper
    states no memory model, charging memory on both sides moves the crossover UP,
    and under a metric charging memory at the same rate as time the crossover lands
    above 409 so the n = 409 curves leave the affected scope. The review moved that
    prediction from mixed (435 dense above, 375 sparse below) to unambiguous: with
    the baseline charged at any single coherent point on its own curve, the crossover
    is 460 sparse and 520 dense and BOTH exceed 409. The prediction is met more
    cleanly than the run met it.

    What is refused is the sentence the run led with. "A 46.6-bit swing straddling
    zero between two defensible storage readings of the same algorithm" attributes to
    the storage reading an indeterminacy that belongs to the charging of the
    baseline. Under a coherent baseline, a hard memory budget below four exabytes, or
    T x M^alpha for any alpha < 0.811, the two readings AGREE that n = 409 is a loss;
    of eight configurations examined only two straddle zero and one is the record's
    own. The honest restatement the evidence supports is the red team's: at n = 409
    the verdict is undetermined by cost models that charge memory multiplicatively
    and leave the memory scale free, and is determined -- against Semaev -- by any
    model that fixes a physical memory budget or charges the baseline at a point it
    could actually occupy.

    Two sub-claims are contradicted outright rather than rescoped: matched-null
    share = 0 (O-10; the control degenerated under the two metrics the claim is
    about, and the informative decomposition is +159 against -87, a near-cancellation
    and not a zero), and the four-metric corroboration count (O-11; two distinct
    functions). Two disclosures carry the wrong sign or range (O-14). One stated
    premise is false (O-16). None of these is an arithmetic error and none was
    concealed: every input the red team used to break the comparison is stated
    somewhere in the record. The failure is in the sign, the magnitude, and the
    corroboration count the record attaches to its own disclosures.

    The contract's own framing-failure condition fired (O-9), and it is the condition
    that decides what this record may do. The deliverable is a two-parameter surface
    over (metric x store_log2) with the baseline charged coherently, the run produced
    a one-parameter slice at an undeclared store value, and that is an unmet
    preregistered deliverable. So H-SEMBIN-83999d moves to `analyzed` and no further:
    promotion waits on EXP-SEMBIN-2c40bb, which recomputes the surface and carries
    the three corrections. COST-SEMBIN-8d123b is not withdrawn -- its arithmetic is
    triply reproduced -- but it is superseded in scope by that successor and must not
    be quoted for the straddle.

  boundaries:
    - >-
      Every figure is a heuristic estimate under docs/claims-and-verification.md. No
      curve was instantiated, no relation computed, no Groebner basis run, no solve
      performed. No certificate attaches to any number in this record.
    - >-
      NOTHING HERE IS A STATEMENT ABOUT THE SECURITY OF B-409, K-409, B-571, K-571 OR
      ANY OTHER CURVE, IN EITHER DIRECTION. A metric under which n = 409 leaves the
      affected range does not make those curves safe, and one under which it does not
      does not make them attackable. Both are statements about two cost models.
    - >-
      Every figure inherits Semaev's Assumption 1 (degree bound <= 4) and eq. (11)
      unchanged. Section 4.4 says d_F4 generally exceeds 4 when k > ceil(n/m), and
      KN-LIT-e77232 records Kosters reaching degree 5 at n = 45. Where Assumption 1
      fails every memory figure here is an underestimate by the amounts the record
      tabulates (+19.4 bits at degree 5 at n = 409) -- one-sided against Semaev, and
      LARGER than every effect this review round discusses. No degree was measured by
      anyone in this round; there is no Groebner engine on this host
      (IMP-SEMBIN-ENGINE).
    - >-
      The two sides use non-identical operation units with no conversion factor. Under
      this program's own kappa discipline (O-17) the crossover figures are
      convention-dependent and are quoted here only with that label attached.
    - >-
      The J1 verdict turns on reading the Tables 1-2 MB column as a peak, which
      tables.yaml's own transcription note contradicts (O-5). Both readings were
      computed and neither was picked.
    - >-
      The red team scoped its corrections to the COMPARISON and did not re-derive
      Semaev's memory accounting; the validator did that separately. The two are
      independent and neither reviewer read the other.
    - >-
      The vOW tradeoff model T = W(1/M + 1/w), Mem = 3n max(w, M) is the red team's
      own restatement from KN-TECH-006 and KN-LIT-012. The primary van
      Oorschot-Wiener 1999 paper was not opened by any agent in this round. The
      load-bearing consequence -- that the product is invariant along the curve and
      the record's point is dominated -- follows from the structure rather than from
      any constant, and is confirmed by the numeric (w, M) grid.
    - >-
      The Koblitz sqrt(|Aut|) figure in O-14(ii) rests on the red team's own
      application of KN-TECH-018's rule and is marked `recalled`. It is not
      load-bearing: dropping it leaves the sparse crossover at 441.

  unresolved_confounds:
    - >-
      Whether the Tables 1-2 MB column is a peak or a total over 100 systems. This
      decides whether the 34 measurements discriminate between the two storage
      readings (O-4) or over-predict under all of them (O-5). Two sources in this
      repository disagree and the round reports the disagreement rather than settling
      it.
    - >-
      THE SPARSE WORKING SET IS NOW COMPUTED IN EXACTLY ONE IMPLEMENTATION IN THIS
      REPOSITORY. It is the term that moves the n = 409 verdict from -8.8 to +11.5,
      it is corroborated at exactly one parameter point (n = 571) by the knowledge
      record it came from, and it is the one term the blind re-derivation could NOT
      check because the review plan misstated it. independent_arith.py never evaluates
      (nm)^4/24 x n^3/m and its own docstring states its independence is method
      independence, not agent independence. This is the finding the round carries
      forward and EXP-SEMBIN-2c40bb must discharge.
    - >-
      The prime-field nearby-object control remains owed. It is the only control that
      can catch a bias shared by the whole summation-polynomial family, and O-15
      establishes that the eq. (4) substitute cannot perform that function. O-16
      establishes that the material for it exists.
    - >-
      The record evaluates every metric at the argmin of stage-1 TIME rather than
      re-optimising m under the memory-charged metric. Worth 0 to 2 in n and changes
      no verdict, but it leaves 0.0 to 2.06 bits on Semaev's table.

  dominated_by: >-
    van Oorschot-Wiener parallel rho at every FIPS label up to and including n = 409
    once the baseline is charged at a coherent point on its own curve: margins -37.79
    dense and -17.48 sparse at n = 409. Semaev is ahead at n = 571 (+40.49 sparse,
    +19.35 dense) under the Pareto min-of-own-curves product. Under a hard memory
    budget below 2^65 bits he is behind at n = 409 under both readings.
  sota_delta:
    time_exponent: unchanged
    note: >-
      No exponent is moved and none is claimed. The corrected crossover against vOW
      is 460 sparse / 520 dense rather than the published 375 / 435, i.e. the
      memory-charged comparison is 85 in n LESS favourable to the chained algorithm
      than the record states. Quantitatively at n = 409: -17.48 bits sparse against
      the published +11.52.

  knowledge_promotion: not_warranted
  knowledge_promotion_reason: >-
    The reusable content is the two-parameter framing, not any crossover number, and
    the surface that carries it has not been computed yet (EXP-SEMBIN-2c40bb). A
    knowledge entry now would promote a figure the round has just shown to be
    underdetermined by an undeclared parameter. KN-OPEN-86e7e1 stays open and gains
    the sharper question: not "what is the memory-charged crossover" but "at which
    (metric, memory budget, baseline operating point) does the verdict at each FIPS
    label change, and which of those points is physically occupiable."

