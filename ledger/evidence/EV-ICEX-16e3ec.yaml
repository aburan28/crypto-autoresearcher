  observations:
    - >-
      Run integrity (TASK-20261001-bd25c1). All 191 run files in snapshot
      receipt TASK-20261001-9b0538 match; snapshot commit b19c73228d has the
      receipt's parent and changes only its files. All 185 implementation files
      pinned by receipt TASK-20260929-a7f89b match at run commit 3feb29161b.
      C-7 passed at launch (15-minute load 12.75 <= 14). The 30 executed cells
      equal the trial plan's 30; the HEAD == run-commit check is enforced
      fail-closed at every cell launch (not logged per cell).
    - >-
      Charging and certificates (TASK-20261001-bd25c1). Complete cost rebuilt
      from per-attempt logs, charging every failed and descent attempt, matches
      on all six fixtures. With independent curve arithmetic, 30/30 sampled
      relations, 16/16 relation log identities and 24/24 descents verify; the
      recovered target log and full factor-base coverage check out on all six
      fixtures.
    - >-
      Frozen statistic reproduced: complete-cost exponent 0.62156229, 95%
      bootstrap CI [0.105903, 2.316919] at the frozen seed (exact enumeration
      over all 46,656 resamples gives [0.1019, 2.4104]); verdict inconclusive;
      stage 1 carries 60.3% of pooled cost at 20 bits. The leave-b16-s21-out
      sensitivity fit reproduces at 0.7736, CI [0.344, 3.372].
    - >-
      Proves-too-much control (TASK-20261001-bd25c1) breaks at the run's noise
      level. Noise-free planted exponents 0.40 and 0.60 return exactly with the
      correct verdicts. At the run's residual SD (0.78 in log cost) the analysis
      detects a planted 0.40 about 9% of the time, calls a planted 0.60
      favourable 1.5-4.4% of the time, and calls a true 0.50 favourable
      4.75-8.6% of the time against a nominal 2.5%. Cause: 3.1% of fixture
      resamples draw a single bit size, their slopes span 0.3-0.5 in log q
      instead of about 2.5, and that share exceeds each 2.5% tail, so those
      resamples set both CI endpoints.
    - >-
      Cost against rho (red team TASK-20261001-d367dd). Complete cost is
      1,739-9,789 times the frozen rho reference 13*0.886*sqrt(q) on all six
      fixtures, and 210-2,994 times measured rho including setup; no defensible
      change of charge or baseline brings any fixture within 199 times. One
      successful m = 5 B0 membership costs 50-306 full rho solves. Relation
      yields match the random multiset model (0.52-0.75 of C(2L+4,5)/q), a
      random-x factor base yields the same (geometric mean ratio 1.15), and
      linear algebra is at most 0.05% of cost.
    - >-
      Matched rho as a method check (TASK-20261001-bd25c1 F-2). On walk cost the
      frozen fit gives 0.510, CI [0.453, 0.575]; on rho's full charged cost it
      gives 0.19, CI [0.169, 0.205], because a fixed per-target jump-table
      precompute (65-86% of measured cost) flattens the slope. The run's verdict
      divides by the fixed reference formula, not measured rho, so it is
      unaffected; the effect shows that fixed costs can produce a spurious
      sub-1/2 exponent at 16-20 bits.
    - >-
      Blind re-derivation comparison (Coordinator, from RD-20261001-1894f8 and
      cells/b16-s21__primary/result.json). Re-derived B = 10, L = 3 (x-classes
      1, 4, 9), |F| = 6 equal the run's factor_base exactly. The run reports 0
      of 256 held-out points with any pair hit (0 pair hits), which equals the
      re-deriver's most literal reading and lies inside its 0-1 range across 28
      readings of the underdetermined hash rule.
  inference: >-
    RUN-ICEX-0ad4d8 is valid and its frozen verdict, inconclusive (exponent
    0.62, CI [0.11, 2.32]), is reproduced independently. The verdict carries
    little information about the exponent: at the run's own noise level the
    frozen analysis has about 9% power against a planted 0.40, so an
    inconclusive result was the expected outcome whatever the true exponent.
    The cost measurements, by contrast, are decisive at this scale: the
    pipeline costs 1,739-9,789 times rho on every fixture, and the gap sits
    entirely in B0 membership cost per attempt, while yields, linear algebra
    and descents behave as modelled. This neither supports nor rejects
    H-ICEX-d8e858's exponent claim. It establishes that the frozen v4 pipeline
    with enumerative B0 membership is dominated by Pollard rho on these six
    fixtures.
  boundaries:
    - >-
      Toy tier. Six EXP-ICEX-aaccfc v4 fixtures (16 and 20 bits, seeds 21-23),
      interval factor base x < ceil(p^{1/5}), m = 5, enumerative non-Groebner
      MITM membership B0, the C-3 cost units, and the frozen collector, linear
      algebra and descents.
    - >-
      Closes faster-than-rho complete cost only for that pipeline exactly as
      frozen in v4 at these sizes. Does not close Groebner or
      summation-polynomial membership (EXP-ICEX-fa2b37's backend), the P1385
      collector, other factor-base rules, larger m with balanced MITM, or
      anything above 20 bits.
    - >-
      The exponent is undetermined: the fit tracks factor-base size noise
      (fitted q-coefficient 0.945 +- 0.037 and L-coefficient -1.92 +- 0.12,
      3 dof, post hoc; TASK-20261001-d367dd) more than growth in q.
  unresolved_confounds:
    - >-
      The held-out hash rule for stage 2 is underdetermined by the protocol text
      (RD-20261001-1894f8 U-2). The run's count agrees with every reading, so
      this does not affect the verdict, but it prevents exact blind
      re-derivation.
    - >-
      Two baseline rows are unchecked: BSGS (not run) and EXP-ICEX-fa2b37's
      Groebner membership (not in this run).
  obstruction:
    statement: >-
      Enumerative MITM membership B0 decides m = 5 factor-base membership at a
      cost per success that alone exceeds a whole Pollard rho solve by one to
      two orders of magnitude on these fixtures, and it accounts for more than
      99.95% of the pipeline's complete cost.
    quantity: >-
      Charged cost of one successful m = 5 B0 membership (per-attempt full-scan
      units divided by pooled per-attempt yield over relation and descent
      attempts), as a multiple of the frozen rho reference 13*0.886*sqrt(q).
    value: >-
      b16-s21 268.8, b16-s22 109.9, b16-s23 52.7, b20-s21 131.7, b20-s22 50.1,
      b20-s23 305.9 rho solves per success (range 50-306), each about +-16-18%
      relative (1 sigma, Poisson on 30-38 successes per fixture); insensitive to
      the point-addition charge within about 6%. Units per success
      131,636-3,359,817.
    measured_by: [RUN-ICEX-0ad4d8, EXP-ICEX-aaccfc]
    computed_by:
      - coordination/goals/GOAL-ICEX-001/batches/BATCH-227e0d/tasks/TASK-20261001-d367dd/j2_analysis.py
    scope: >-
      Enumerative non-Groebner MITM membership B0 (2-sum table plus full
      backward 3-sum scan) at m = 5, interval factor base x < ceil(p^{1/5}), the
      six frozen 16/20-bit fixtures and the C-3 units, and any collector or
      linear algebra built on B0 at these sizes. Not claimed for
      non-enumerative membership.
    resource_check:
      examined: true
      reading: >-
        The same measurement is an asset for the summation-polynomial
        (sub-enumerative membership) lane. Every other stage of the method is
        validated at toy scale: yields match the random multiset model, a
        random-x factor base yields the same, linear algebra is negligible and
        descents cost the same per success as relations. Only the membership
        decision is expensive. A backend deciding m = 5 membership in
        L^{o(1)} * polylog(q) on interval factor bases would convert the same
        yields into about (L+27)/yield attempts at near-constant cost each,
        which is the regime the Semaev/Gaudry/Diem literature analyses
        (provenance recalled, not retrieved here). The small-x property, unused
        by B0, is what such a backend would exploit. Competitive threshold:
        below about sqrt(q)/(L+27) units per success.
      spawned_ids: []
