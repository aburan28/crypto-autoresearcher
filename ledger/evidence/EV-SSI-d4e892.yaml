evidence:
  id: EV-SSI-d4e892
  hypothesis_id: H-SSI-df550b
  experiment_ids: [EXP-SSI-6a2619]
  run_ids: [RUN-SSI-6a2619-001]
  type: empirical
  direction: neutral
  strength: preliminary
  claim_tier: toy
  certificate_refs: []
  proof_status: empirical_only
  proof_refs: []

  observations:
    - >-
      INTRA-PRIME EXPONENT beta_hat: 0.448 (p=503), 0.655 (p=1019), 0.966
      (p=2003), 0.939 (p=4003). Strong finite-size effects at small p (ANOM-3).
      Only p=503 falls in the pre-registered [0.35, 0.65] band
      (CONSISTENT_WITH_1_OVER_2). Larger primes stabilize near 0.95
      (INTERMEDIATE_NO_CLEAR_MATCH).
    - >-
      CROSS-PRIME EXPONENT gamma_hat = 0.948 (R^2 = 0.959) over 4 primes. The
      pre-registered prediction was gamma = 1/2. Measured value is nearly double
      the prediction. However, this is a 4-point fit and carries substantial
      uncertainty from the small prime range.
    - >-
      NULL ARM beta_hat: 1.43 / 1.36 / 1.73 / 2.40. Null arm grows faster than
      treatment at all primes. Treatment-null separation is WEAK at p=503,1019,2003
      (difference within or at the null seed spread), becoming significant only at
      p=4003 (1.46 vs spread 0.77).
    - >-
      POSITIVE CONTROL: 100% hit rate at all four primes (21/21, 26/26, 18/18,
      26/26). The instrument detects guaranteed-reachable pairs correctly.
    - >-
      ENVELOPE CONTROL: zero violations at all four primes. No curve exceeds the
      4^k upper bound at any distance.
    - >-
      CONSTRUCTION AGREEMENT: both vertex-set constructions agree at all primes.
      The graph is correctly built.
    - >-
      ANOMALY ANOM-1: at p=503, CDF saturates at D=4 (all 43 curves reach
      conjugate in degree <= 4). The window is too small for meaningful beta
      estimation at this prime.
    - >-
      ANOMALY ANOM-2: graded control medians are non-monotone at all primes due
      to small bucket sizes (2-6 curves per shell). Discrete-valued medians do
      not respect envelope ordering.
    - >-
      ANOMALY ANOM-3: beta_hat increases with p (0.45 -> 0.66 -> 0.97 -> 0.94),
      suggesting the asymptotic regime has not been reached. The p=503 reading is
      likely a finite-size artifact.

  inference: >-
    The Frobenius-degree census produces valid measurements at toy scale (p <= 4003)
    but the results are INCONCLUSIVE for discriminating between the pre-registered
    gamma=1/2 prediction and alternative growth laws. The measured gamma_hat=0.95
    is far from 1/2, but (a) the 4-point fit is unreliable, (b) beta_hat has not
    stabilized (strong drift from 0.45 to 0.95 across the tested range), and
    (c) treatment-null separation is only significant at the largest prime tested.
    The experiment succeeds at its instrumental purpose (controls pass, construction
    verified, instrument demonstrated) but does NOT yet discriminate between
    competing hypotheses about the Frobenius-degree distribution's scaling.
    Direction is NEUTRAL: the data neither supports nor weakens H-SSI-df550b at
    this scale because the asymptotic regime has not been reached. A larger prime
    (p >= 10007) is needed before beta_hat stabilization can be assessed.

  boundaries:
    - >-
      Claim tier is TOY. All four primes are <= 4003. AGENTS.md rule 7 applies
      without exception. No crypto-scale inference is possible.
    - >-
      This is NOT a test of Heuristic 1 of Wesolowski 2026 (smoothness), NOT a
      cost claim, NOT an attack, NOT a parameter recommendation.
    - >-
      The measured gamma_hat = 0.95 is a 4-point OLS fit with R^2 = 0.96. It is
      consistent with multiple underlying laws and does not discriminate between
      them at this scale.
    - >-
      beta_hat has not converged. The progression 0.45/0.66/0.97/0.94 shows the
      asymptotic regime is not reached. Extrapolation from these values to larger p
      is not warranted.
    - >-
      The null arm spread equals or exceeds the treatment-null difference at
      p=503,1019,2003. Only at p=4003 is there statistically significant
      separation.

  unresolved_confounds:
    - >-
      Whether beta_hat stabilizes near 0.95 or continues to drift at larger p.
      The two-prime plateau (0.97, 0.94) could be either convergence or coincidence.
    - >-
      Whether the measured gamma_hat = 0.95 represents the true cross-prime scaling
      or is dominated by the finite-size behavior of the smallest primes in the fit.
    - >-
      Graded control non-monotonicity prevents localizing which distance shells
      deviate most from the envelope prediction.

  reviewed_by: coordinator
  recorded_at: '2026-08-07'
