    - Lead 2 of IDEA-20260928-4e2be7 is NOT closed by this record (INF-3). Its pre-registered closure reading is replaced by a detection-limited non-detection pending a relation-level test.
    - The GGM floor of IDEA-20260928-ce3ab0 and every floor-relative reading (A7, and the (2) floor-attainability framing) are outside this record under TW-FLOOR.
