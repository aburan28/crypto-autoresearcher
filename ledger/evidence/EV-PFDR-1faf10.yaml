  unresolved_confounds:
    - Counting unit. The frozen A1 counts pairs, and one relation contributes 2 to about 4|F| pairs. The resolution rule C_R >= 10 and the variance floor are in pair units (OBJ-3).
    - Exposure. A_fix matches attempts, not encodings. Encodings at A_fix differ between arms by up to about 10%, and the H1 mean scales as C(X, 2). Exposure explains about half of the dickson SS m 4, 26-bit excess (OBJ-4).
