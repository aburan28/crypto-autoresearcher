    largest_claim_justified: >-
      On the tested arms (subgroup, dickson, small_x against matched random
      bases), classes TT and SS, m = 3, 4, 5, 12..32 bits, this engine and
      these curves, at the fixed attempt budget: no replicated excursion of the
      frozen census statistic and no calibrated structural excess was
      observed. A structural excess of kappa >= 1.5 (TT m 3), 2.0 (TT m 5),
      1.25 (SS m 3, SS m 4) or 2.0 (SS m 5) at 30-32 bits would have been
      detected with probability >= 0.5 (pair units). Smaller excesses, TT at
      m = 4 and TB are not excluded. The frozen census statistic's excursions
      are not evidence of structure. Harvesting TT, TB and SS lowered the S_3
      count to solution by >= 1.3 at every base and rung >= 24 bits at m = 3
      and 5, and gave an m = 4 small_x harvest-on S_3 exponent of 0.6076
      (95% interval 0.601-0.614, nominal; J5 undercoverage applies) over
      12..32 bits. These are S_3-count statements only, and the solves rest
