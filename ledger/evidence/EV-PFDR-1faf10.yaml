  # ---------------------------------------------------------------------------
  obstruction:
    statement: >-
      On these curves and this engine, x-key coincidence counts in PAIR units
      are compound. Each distinct relation appears as several dependent pair
      coincidences, and random-base pair counts are overdispersed well beyond
      Poisson. A census statistic that counts pairs against a Poisson-floored
      3-SD band therefore has a per-cell false-excursion rate several times
      its nominal rate, and it cannot detect a structural pair excess below
      a per-(class, m) limit. This blocks reading the frozen pair-unit census
      (A1, Stage R) either as evidence of structure or as a closure of lead
      2. It is a measured property of the counted object, not of the attempt.
    quantity: >-
      (i) pairs per distinct relation M(class, m) and the random-arm pair-count
      index of dispersion D(class, m); (ii) the excursion rule's per-cell null
      false-excursion rate under dispersion-calibrated nulls; (iii) the
      detection limit X(class, m), the smallest planted pair-level kappa
      detected (leaving O-NULL) with probability >= 0.5 at 30-32 bits
    value: >-
      (i) M: TT m 3 2.66-3.00 (max 3); TB about 3; TT m 5 7.3-10.8 (max 234);
      SS m 3 1.56-1.93; SS m 4 4.1-5.4 (max 246); SS m 5 4.2-5.8 (max 294)
      pairs per relation. D: 2-6 (TT m 3), 10-51 (TT m 5), 2-5 (SS m 3),
      44-444 (SS m 4), 9-32 (SS m 5), dimensionless (Poisson = 1); ranges
      are across rungs. (ii) 0.010-0.034 per cell at the four excursion
      cells, family mean 0.018-0.023, against nominal 0.0027. The range spans
      the G-NB, G-CP and G-RES generators; the Monte Carlo s.e. of family
      probabilities is <= 0.0035 at R = 20000. (iii) X at 30-32 bits,
      weakest arm, pair units, on the grid {1.1, 1.25, 1.5, 2, 3, 5} (grid
      resolution is the error bar): TT m 3 1.5; TT m 4 > 5 (not detectable);
      TT m 5 2.0; SS m 3 1.25; SS m 4 1.25; SS m 5 2.0.
    measured_by:
      - RUN-PFDR-1b78f7-census-m3
      - RUN-PFDR-1b78f7-census-m4
      - RUN-PFDR-1b78f7-census-m5
      - RUN-PFDR-1b78f7-stage-r
      - RUN-PFDR-1b78f7-analysis
      - EXP-PFDR-1b78f7
    measured_by_note: >-
      Read from the committed census rows and harvest rows of these runs by
      the red team's review computations (attacks/out/02, 03, 04, 05, 09;
      TASK-20260929-f29c96). No new run.
    scope: >-
      Main-panel census mode, arms subgroup, dickson and small_x against their
      matched random triples, classes TT and SS (TB for M only), m = 3, 4, 5,
      12..32 bits (X at 30-32 bits), five curves per rung and five fresh
      curves per excursion cell, this engine (mitm, min_fill, default arity),
      fixed attempt budget A_fix = |F_sub|, and generated prime-order curves.
      Claimed nowhere else. In particular it is not claimed for relation-unit
      statistics, other m, other engines or sizes above 32 bits.
    resource_check:
      examined: true
      reading: >-
        Read the other way round, M(class, m) measures the slack between the
        collisions an engine pays for and the distinct relations it obtains.
        One relation costs M coincidences in the harvested classes. A theory
        that takes M as its hypothesis is collision-efficient harvesting:
        encodings or a dedup rule chosen to avoid redundant splittings, or a
        relation detector that needs to see only one splitting of each
        relation. Its best case is a constant factor bounded by M (about 3 at
        m = 3, TT; up to about 10 on average at TT m = 5). It cannot move an
        exponent, so it is not ranked as an exponent lever. The measured
        dispersion D is also the calibrated null any future census must use.
        That is a design input for DEC-20260929-bbb3a9 NA-5, not a theory. No
        record was spawned. Whether multiply-counted harvested rows enter the
        A7 relation count r is a question for the TW-FLOOR round
        (DEC-20260929-bbb3a9 NA-3), and it is not read here.
      spawned_ids: []

