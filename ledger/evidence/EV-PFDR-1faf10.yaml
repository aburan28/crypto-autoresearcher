    miscalibrated (J6, J7, proves_too_much). Every one of these failures
    appears equally on the random arms, whose kappa is 1 by definition, and
    localises to one declared convention, the pair counting unit. It is
    CONSISTENT WITH, and weakly supports, the structural null (B) within the
    measured detection limits: no calibrated excess and no replicated
    excursion. It is also consistent with the generic predictions (1a) and
    (2). "weakens" is the net direction because pre-registered clauses of the
    hypothesis as written failed on valid data. It is not a reading that the
    mechanism is wrong. The decision is refine, not weaken
    (DEC-20260929-bbb3a9).
