  obstruction:
    statement: >-
      For uniform integers n in [1, X], the Dickman function rho(u) at
      u = ln X / ln B understates the fraction that is B-smooth by a factor
      that grows as B falls. It is about 1.02-1.12 for B >= ~10^4 (consistent
      with the first-order de Bruijn term) and about 2.45 at B ~ 131 with
      u = 4.5. So rho(u) cannot serve as a factor-2 reference for a
      maximal-size uniform-integer null at B <~ 150 with u >~ 4. This blocks
      the frozen NULL-2 instrument check of EXP-WESO-9e2d6d as written. It
      says nothing about delta(E).
    quantity: >-
      f_NULL2(X, B) / rho(ln X / ln B): the ratio of the measured B-smooth
      fraction of 10^5 uniform integers in [1, X] to Dickman rho.
      Dimensionless.
    value: >-
      2.452 at X = 3408917801, B = 131.3286 (S = 336 of 100000; 99% Wilson
      ratio interval [2.13, 2.82]). Other admissible cells: 1.02-1.23 for
      B >= 1448; 1.37 / 1.76 / 1.43 / 1.92 at B = 529 / 242 / 679 / 354; and
      1.477 at B = 128.0 (X = 2097152). The first-order prediction at the
      failing cell is 1.228.
    measured_by: [RUN-WESO-e65afd, EXP-WESO-9e2d6d]
    scope: >-
      Uniform integers in [1, X], X in {2097152, 3408917801, 5541191377756}
      (the floor((p/2)^{1/3}) of the three Stage-C primes). B from 8 to
      3.13e8 on the frozen u-grid {1.5, ..., 7}. N = 10^5 per X. Claimed
      nowhere else. Provisional as a DIAGNOSIS (comparator, not code) until
      the exact Psi count is archived. The measured ratios themselves are
      checker-verified counts.
    resource_check:
      examined: true
      reading: >-
        Read the other way round, the measurement is an ASSET for
        concrete-cost modelling of smoothness-based algorithms, including
        Wesolowski's. Any cost model that uses rho(u) as the per-attempt
        success probability at practical smoothness bounds misstates the
        success rate. Its cumulative reading is pessimistic (Psi/X > rho).
        Its pointwise reading, for integers of a fixed size, is optimistic
        at first order (the point density is below rho by about
        gamma rho(u-1)/ln t). The correct model is exact Psi or a
        saddle-point estimate. This bears on the concrete-cost brackets of
        GOAL-P13-001 and GOAL-SSIQ-001 SC-3, and on how the source's own
        NIST-I tail check (rho = 1/69232 at B = 12589) should be read. It is
        also a resource for the redesign of this experiment: the model-free
        NULL-1 becomes the size-consistent primary comparator. No IDEA-* or
        H-* record has yet taken it up; the redesign is scheduled in
        DEC-20260926-c8d4b0.
      spawned_ids: []

