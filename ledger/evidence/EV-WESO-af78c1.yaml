  inference: >-
    (1) HEURISTIC 1 / H-1: no inference, by the frozen FC-VOID rule.
    (2) SAMPLER (H-S), scoped: at the four toy primes, the norm-2 cyclic-ideal
    sampler from O_0 was indistinguishable from the exhaustive
    Eichler-mass-weighted delta law at every grid k >= 16 and
    distinguishable at every grid k <= 12, at the resolution of the 99.9%
    null floor. Known-biased samplers were detected. c_hat = 1.60 is
    grid-limited, with the threshold in (12, 16] at each prime.
    (3) NULL-2 FAILURE: provisionally a comparator-calibration defect of the
    frozen protocol, not a code defect. Dickman rho is a first-order
    approximation to the CUMULATIVE smooth fraction Psi(X,B)/X, with error
    governed by 1/ln B. It is off by a factor of about 2.45 at B ~ 131, u =
    4.5. The protocol's [0.7, 2.0] band and B >= 128 floor had no
    finite-size basis. The same analysis shows rho(ln t / ln B) OVERSTATES
    the point smoothness probability of integers of size t at first order,
    so the spec's PRED-2 rho-sum and its R_max expected_direction rationale
    conflate two quantities. The model-free NULL-1 is the size-consistent
    comparator. The decisive check (exact Psi(3408917801, 131.33) vs
    S_NULL2 = 336) is scheduled, not done.
    (4) Any re-analysis of the retained Stage-C samples under an amended
    NULL-2 check is post hoc (all criterion inputs have been seen). It can
    carry at most preliminary strength and cannot move H-1 toward supported.
  scoped_statement: >-
    At p in {1019, 4099, 10007, 20011}, the endpoint of a uniform
    non-backtracking norm-2 ideal walk from O_0 of length k >= 16 was
    statistically indistinguishable (TV at or below the 99.9% multinomial
    null floor of 0.018-0.027 on the delta law; 0.038-0.063 on the type law at
