# =============================================================================
# EV-ICPERF-a8080e -- Semaev 2015 Assumption 1 measured on its own diagonal,
#                     and its d_F4 predicate reproduced at n <= 21
#
# WHAT THIS RECORD IS: two Rust instruments and their results, bearing on the
# question GOAL-DREG-001 has been circling -- whether Assumption 1's
# `d_F4 <= 4` holds for the Boolean system equivalent to Semaev 2015 eq. (5).
# It reports what was measured, WHICH OBJECT it was measured on, and the one
# thing that is genuinely settled.
#
# THE LOAD-BEARING FINDING IS NEGATIVE ABOUT THIS PROGRAM'S OWN INSTRUMENT:
# GOAL-DREG-001's existing subspace ladder measures a DIFFERENT object family
# from the one Assumption 1 names. That is not a defect in Semaev; it is a
# defect in what the ladder was pointed at.
#
# EXTERNAL PROVENANCE. Both instruments live in github.com/aburan28/crypto and
# are bound by content below. No RUN-* record exists in this ledger for either.
# =============================================================================
evidence:
  id: EV-ICPERF-a8080e
  hypothesis_id: null
  hypothesis_id_note: >-
    Null. GOAL-DREG-001 carries hypotheses about degree growth
    (H-DREG-152cff, H-DREG-9cd42c, H-DREG-dafc39 among them) and it is
    TEMPTING to name one, but these instruments were built outside this
    ledger's lifecycle and score no hypothesis's stated prediction as written.
    The ladder finding below in fact bears on whether those hypotheses were
    measuring their own object, which is a stronger reason not to attach this
    record to any one of them.
  experiment_ids: []
  run_ids: []
  run_ids_note: >-
    Empty and honest: these are `cargo run --example` invocations in another
    repository, not runs of this program's harness, so no manifest with an
    `inference` block exists for them.
  goal_ids:
    - GOAL-ICPERF-e6b6a4
    - GOAL-DREG-001
  goal_ids_note: >-
    Listed against GOAL-DREG-001 because that is the goal whose instrument the
    ladder finding corrects, and against GOAL-ICPERF-e6b6a4 because Assumption
    1 is the assumption every Semaev-side cost row in the boundary table is
    conditional on. Neither goal's status is changed by this record.
  question_ids:
    - RQ-ICPERF-94c86e
  type: empirical
  direction: weakens
  direction_basis: >-
    Weakens, but read what it weakens: it weakens confidence that
    GOAL-DREG-001's accumulated degree measurements say anything about
    Assumption 1, because 0 of 23 ladder cells measured the subspace family
    Assumption 1 quantifies over. It does NOT weaken Assumption 1 itself; the
    sound instrument REPRODUCES `d_F4 <= 4` at every cell it can reach.
  strength: preliminary
  strength_basis: >-
    Preliminary. The ladder mismatch is a definitional fact about the two
    instruments and is certain (see observations); everything else is toy-scale.
    The refutation predicate reproduces at n = 5..21 only, converging in 2-3
    rounds against a budget of 8, and n = 21 is nowhere near a cryptographic
    degree. One of the three instruments is a DOCUMENTED DEAD END whose first
    version was confounded, which is disclosed rather than dropped.
  claim_tier: toy
  certificate_refs: []
  proof_status: empirical_only
  proof_refs: []
  proof_status_note: >-
    Empirical only, and the distinction matters more here than usual. First
    fall degree and solving degree are NOT Semaev's d_F4; the gap between them
    is this program's own KN-OPEN-d218ec and is not closed by anything below.
    A first-fall or solving degree above 4 would therefore not by itself refute
    Assumption 1, and no such refutation is claimed.
  observations:
    - >-
      THE LADDER MEASURES THE WRONG OBJECT FAMILY. Assumption 1 quantifies over
      a subspace V of F_{2^n} of dimension k = ceil(n/m). This program's
      koblitz_bench::subspace_ladder instead sets the dimension to ord_n(2),
      and its basis comes from invariant_subspace_basis, which returns a
      FROBENIUS-INVARIANT subspace -- a linearised-polynomial kernel from a
      factor of x^n - 1. Two mismatches, both checkable by inspection: the
      dimension coincides with ceil(n/m) NEVER at m = 2 and only twice at
      m = 3 across n = 5..49 odd, so 0 of 23 cells at m = 2 measured the right
      dimension; and Frobenius-invariant subspaces are a measure-zero special
      family, not the "a subspace" Assumption 1 speaks about. This is
      independent of the separate d_F4-versus-d_reg definitional gap.
    - >-
      ON THE RIGHT OBJECT, FIRST FALL DEGREE IS FLAT AT 3 AND THE NULL IS 4.
      With V a UNIFORMLY RANDOM F_2-subspace of dimension exactly ceil(n/m),
      built by rejection on rank, the measured first fall degree is 3.00 flat
      across n = 7..63, while a matched random Boolean control system
      (`random_control_system`, matched on variables, equations, degree and mean
      monomial count) sits at 4.00 flat. The separation is the whole point: the
      control is a NULL OBJECT, not a replicate. The first version of this
      instrument used a replicate as its control, which measures nothing; the
      3-versus-4 separation became a claim only after the null was swapped in.
    - >-
      d_F4 <= 4 REPRODUCES AT EVERY CELL n = 5..21. A sound refutation
      predicate -- attempt to refute `d_F4 <= 4` by degree-4 closure, reporting
      REFUTED only on genuine convergence -- returns REFUTED at every cell
      n = 5..21, converging in 2 or 3 rounds against a budget of 8. Read the
      polarity carefully: REFUTED here means the predicate that would witness
      `d_F4 > 4` is itself refuted, i.e. the assumption's bound is CONSISTENT
      with every cell reached. Nothing above n = 21 was reachable.
    - >-
      THE n = 40/45 BOUNDARY IS NOT A FIRST-FALL PHENOMENON. With first fall
      degree flat at 3 through n = 63 on the correct subspace family, the
      degree behaviour at the boundary GOAL-DREG-001 has been probing is not
      explained by first fall. What it is remains open, and
      IMP-SEMBIN-ENGINE stays binding for that cell -- the engine headroom to
      settle it does not exist on this host.
    - >-
      A DOCUMENTED DEAD END, kept rather than discarded. The first closure
      instrument tested "refuted OR all variables pinned", which tracked
      DECOMPOSABILITY rather than degree, because the m = 2 swap symmetry
      guarantees at least two solutions. It is committed as a dead end with its
      diagnostics, not shipped as a result.
    - >-
      TWO SOUNDNESS DEFECTS FOUND BY AUTOMATED REVIEW AND FIXED. (1) A verdict
      string hardcoded `REFUTED-at-degree-4` while the degree was a flag; fixed
      to interpolate, and verified by running `--degree 5`. (2) MATERIAL: the
      closure routine returned the same "not capped" signal both on genuine
      convergence and on rounds-exhaustion, so a PARTIAL closure could emit
      `NO REFUTE implies d_F4 >= 5` -- a positive claim from an unfinished
      computation. Fixed with a three-valued `Closure` enum, the verdict now
      taken only from `Converged`, and a `converged` column added to the
      output. The published rows are unaffected: every one converged in 2-3
      rounds, well inside the budget of 8.
  inference: >-
    Assumption 1 survives every cell this hardware can reach, on the object it
    actually names, and with a null control that separates cleanly. That is a
    real but small piece of support, and it does not promote anything: the
    measured quantity is first fall degree, not d_F4, and the two are not the
    same object (KN-OPEN-d218ec). The reusable result is the negative one --
    GOAL-DREG-001's ladder has been measuring Frobenius-invariant subspaces of
    dimension ord_n(2) while Assumption 1 speaks about arbitrary subspaces of
    dimension ceil(n/m), so degree numbers accumulated from that ladder cannot
    be read as evidence for or against Assumption 1 without redoing them on the
    diagonal.
  boundaries:
    - >-
      Field degrees: n = 5..63 odd for first fall degree and the null control;
      n = 5..21 for the refutation predicate. Nothing is measured at any
      cryptographic n, and in particular nothing at n = 131, 163, 233, 283,
      409 or 571.
    - >-
      Summand count: m = 2 for the diagonal instrument's default and for the
      refutation predicate. The m = 2 swap symmetry is what confounded the
      first closure attempt, so m = 2 results carry that structure and are not
      a generic m statement.
    - >-
      Measured quantities: first fall degree and solving degree where the
      Macaulay matrix fits. NEITHER is Semaev's d_F4. A value above 4 in either
      column would not refute Assumption 1.
    - >-
      Subspace sampling: uniformly random F_2-subspaces by rejection on rank,
      so the dimension is exactly ceil(n/m). Four trials per cell by default,
      which is enough to see a flat 3-versus-4 separation and not enough to
      characterise a distribution.
    - >-
      The underlying field-structure machinery in the other repository is
      capped at n <= 64, with a 64-variable ceiling and Macaulay row/column
      caps. The flat-to-63 reading is therefore at the instrument's edge, not
      comfortably inside it.
  unresolved_confounds:
    - >-
      The d_F4-versus-first-fall gap is OPEN and is the reason no promotion
      follows from this record. It is this program's KN-OPEN-d218ec. Both
      instruments print a warning to this effect in their own output, which is
      the right place for it but does not close it.
    - >-
      Four trials per cell, single seed family. No spread is reported and none
      is claimed; the "3.00 flat" and "4.00 flat" figures are means over four
      trials, and a cell with genuine variance would be indistinguishable from
      a flat cell at this sample count.
    - >-
      No independent reviewer in THIS program has read either instrument. The
      two soundness defects above were found by automated review in the other
      repository's pull request, which is a real check but not this ledger's
      independence check.
    - >-
      The n = 40/45 question is NOT settled, only narrowed: first fall is ruled
      out as the explanation, and what does explain it is unknown.
      IMP-SEMBIN-ENGINE remains binding.
  obstruction:
    statement: >-
      About the OBJECT: on the subspace family Assumption 1 actually
      quantifies over, the Semaev decomposition system's first fall degree does
      not grow with n across the reachable range -- it is constant at 3 while a
      shape-matched random system sits at 4. About the INSTRUMENT, which is the
      reusable part: the dimension Assumption 1 names, ceil(n/m), and the
      dimension this program's ladder uses, ord_n(2), are different functions
      of n that do not coincide at m = 2 anywhere in n = 5..49 odd.
    quantity: >-
      (a) mean first fall degree on a random F_2-subspace of dimension
      exactly ceil(n/m), and the same for a shape-matched random control;
      (b) the number of ladder cells at m = 2 in n = 5..49 odd where
      ord_n(2) = ceil(n/2); (c) the degree at which the `d_F4 <= 4` refutation
      predicate is itself refuted, and the round count at convergence.
    value: >-
      (a) 3.00 flat for n = 7..63, control 4.00 flat over the same range; means
      over 4 trials per cell, no spread recorded so no error bar is claimed.
      (b) ZERO of 23 cells, exact -- and twice only at m = 3. (c) REFUTED at
      degree 4 at every cell n = 5..21, converging in 2 or 3 rounds against a
      budget of 8 rounds.
    measured_by:
      - "external-content:examples/diagonal_assumption1.rs#sha256:5e6ab0af1d8076b6e9d0154f94e28b2ff7e50f72af78f78a5040c97c534a9007"
      - "external-content:examples/assumption1_refutation.rs#sha256:dd8c4bf34a07d5bb072f02606dc038040ddd2824a4dc3f83e96467395cfec63e"
    measured_by_note: >-
      No RUN-*/EXP-* id of THIS program exists, and inventing one would be a
      fabrication. The list above is the content-first binding already recorded
      under external_provenance -- the same sha256 pins, not a local run id.
      (b) is a definitional count checkable from ord_n(2) and ceil(n/2) with no
      run at all; the dead-end instrument (assumption1_closure.rs) is cited by
      no observation and is deliberately absent here.
    scope: >-
      Binary fields GF(2^n) with n odd in 5..63 for (a), n odd in 5..49 for
      (b), n in 5..21 for (c); m = 2; random F_2-subspaces of dimension exactly
      ceil(n/m); first fall degree and solving degree as the measured columns,
      NOT d_F4. Claimed for no other m, no even n, no larger n, and not for
      Frobenius-invariant subspaces, which are the family whose exclusion is
      the point.
    resource_check:
      examined: true
      reading: >-
        The check ran and found a clear resource, which is why this record is
        filed at all rather than as a bare correction. A first fall degree that
        is CONSTANT in n on the correct subspace family is exactly the input a
        Semaev-side cost derivation needs: it is the difference between a cost
        formula whose degree parameter grows with the field and one whose
        degree parameter does not, and the Certicom-binary and FIPS-binary cost
        table cannot be stated conditionally on Assumption 1 without knowing
        which. Read the other way, the 3-versus-4 separation from the null also
        says the algebraic structure is buying ONE degree and not more, which
        bounds how much a structure-exploiting engine can be expected to gain.
        The instrument mismatch is a resource too, cheaply: re-pointing the
        ladder at ceil(n/m) with random subspaces costs one parameter change
        and makes 23 dead cells live.
      spawned_ids: []
      spawned_ids_note: >-
        None yet. The successor named below is where reading (i) is spent; it
        belongs here via a superseding record once authored, never by editing
        this one.
