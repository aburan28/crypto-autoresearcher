  certificate_refs: []
  proof_status: derivation
  proof_refs:
    - ledger/proposals/IDEA-20260807-15f103.yaml
    - ledger/proposals/IDEA-20260807-ecdde8.yaml
    - ledger/proposals/IDEA-20260807-0afbab.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-d8bb19/reviews/TASK-20260807-d8bb19-reviewer/review_report.md
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-d8bb19/reviews/TASK-20260807-d8bb19-redteam/red_team_report.md
    - inputs/refs/research/ISO_GOAL_isogenous_weak_curve.md
  observations:
    - >-
      BATCH-d8bb19 dispatched the Idea Generator to propose successor directions for H-IT-001
      after it was weakened by DEC-20260804-2fae6a (Tate isogeny theorem blocks ordinary
      F_p-isogeny transfer). Three proposals were produced, each identifying a distinct
      obstruction to isogeny-transfer mechanisms.
    - >-
      IDEA-20260807-15f103 (smooth-conductor descent, DIR-3): Within an ordinary isogeny class,
      curves with smooth conductor f are reachable from the surface by smooth-degree isogenies.
      However, the surface curve has no known DLP weakness for generic discriminant D = t^2 - 4p.
      The GLV endomorphism has norm ~ sqrt(|D|) ~ sqrt(p), giving 2D Pollard rho cost N^{1/2} =
      same as standard rho. No exponent improvement. The mechanism collapses to Pollard rho for
      generic curves.
    - >-
      IDEA-20260807-ecdde8 (extension-field isogeny bridge, DIR-2): Over extension fields F_{p^k}
      with k > 1, curves from different F_p-trace classes can become isogenous (Tate theorem
      applies only to F_p-isogenies). However, the cost of finding an F_{p^k}-isogeny between
      arbitrary curves is Omega(p^{k/2}) for any known algorithm, matching or exceeding Pollard
      rho before any special-curve saving is applied. For k >= 1, the mechanism costs
      Omega(p^{k/2}) >= Omega(p^{1/2}) = rho. No improvement.
    - >-
      IDEA-20260807-0afbab (within-class DLP uniformity, DIR-3): All curves in an ordinary
      isogeny class (fixed trace t) share the same group order N, embedding degree, CM
      discriminant, and GHS profile. All known DLP algorithms key on these trace-determined
      parameters, so no curve in the class has lower DLP complexity than any other. No target
      exists for within-class transfer. This is an empirical claim ("no known algorithm depends
      on j"), not a proven theorem.
    - >-
      Independent reviewer (TASK-20260807-d8bb19-reviewer) returned PASS: all three proposals
      are structurally sound, correctly identify their obstructions, and the recommendation to
      close SG-ECDLP-002 is justified. The reviewer confirms that the four obstructions are
      mutually reinforcing and cover all reasonable isogeny-transfer approaches.
    - >-
      Red team (TASK-20260807-d8bb19-redteam) returned conditional PASS: closure directionally
      correct but premature by one evidentiary step. Three of four obstructions are structurally
      sound (Tate theorem, surface-weakness gap, isogeny-finding cost). The fourth (within-class
      uniformity) is empirical, not proven. The red team recommends scoping the closure to the
      three proven obstructions and holding within-class uniformity as unverified pending the
      toy-scale test in IDEA-20260807-0afbab.
    - >-
      Validator (TASK-20260807-d8bb19-validator) returned FAIL on procedural defects (malformed
      IDs, duplicate YAML keys). These defects have been corrected: IDs reallocated to
      IDEA-20260807-{15f103,ecdde8,0afbab} and duplicate keys removed. All four completion gates
      are met.
    - >-
      Four named obstructions identified: (1) class-invariant obstruction (Tate theorem,
      unconditional), (2) surface-weakness gap (no surface weakness for generic D, GLV gives
      only constant-factor speedup), (3) isogeny-finding cost (Omega(p^{k/2}) >= rho for
      extension-field isogenies), (4) within-class uniformity (all curves in class have same
      DLP complexity, empirical not proven).
    - >-
      The reference document inputs/refs/research/ISO_GOAL_isogenous_weak_curve.md provides
      independent confirmation: "No curve F_p-isogenous to P-256 or P-224 has a meaningfully
      easier ECDLP than the base curve — every ECDLP-hardness quantity is an isogeny-class
      invariant strong for these curves." The document also notes that the isogeny bridge for
      P-256's flat volcano is cheap (Galbraith 2024, O(q^{1/4})), so the obstruction is the
      absence of a weak destination, not the bridge cost.
  inference: >-
    The isogeny-transfer approach for ordinary F_p-isogenies on generic prime-field curves is
    structurally infeasible. The four obstructions are mutually reinforcing: the Tate theorem
    unconditionally blocks cross-class transfer, the surface-weakness gap shows no within-class
    advantage exists, the isogeny-finding cost shows extension-field bridges cost >= rho, and
    within-class uniformity shows no target exists for transfer. The first three obstructions
    are proven (or based on robust heuristics). The fourth is empirical but consistent with the
    other three. The conclusion (no viable isogeny-transfer mechanism) is robust even if
    obstruction 4 is later falsified. H-IT-001 should transition from weakened to rejected_scoped:
    all successor directions (DIR-2, DIR-3) have been explored and found blocked. SG-ECDLP-002
    should close scoped to the three proven obstructions, with within-class uniformity held as
    unverified pending the toy-scale test.
  boundaries:
    - >-
      This evidence is theoretical, not experimental. The three proposals include falsifiable
      tests (toy-scale conductor smoothness, GLV speedup, extension-field isogeny finding,
      within-class variance), but none were run. The closure is based on theoretical analysis
      and known mathematics, not experimental confirmation.
    - >-
      The scope is exactly: ordinary F_p-isogenies, extension-field isogenies, and within-class
      transfer mechanisms connecting a generic non-special curve to any special family or weaker
      curve. Supersingular isogenies and non-isogeny approaches are out of scope.
    - >-
      The within-class uniformity obstruction (obstruction 4) is empirical, not proven. It rests
      on "no known algorithm depends on j," which is an absence-of-evidence claim. A future
      algorithm exploiting conductor-dependent or j-invariant-dependent structure would invalidate
      this obstruction. However, obstructions 1-3 are sufficient for closure even if obstruction
      4 is falsified.
    - >-
      This analysis applies to ordinary prime-field curves E/F_p with prime-order subgroup of
      order N. It does not apply to supersingular curves, pairing-friendly curves, or curves
      over extension fields. Non-isogeny approaches (index calculus, relation collection, etc.)
      are out of scope.
  unresolved_confounds:
    - >-
      Isogeny-graph spectral methods not explored. The red team noted (objection R4) that the
      idea generator did not consider exploiting the spectral properties of the isogeny graph
      itself (rather than using the graph as a bridge). This is a different mechanism from
      isogeny transfer and is arguably out of scope for this batch, but it remains a residual
      open direction.
    - >-
      The toy-scale tests in the three proposals (conductor smoothness, GLV speedup, extension-field
      isogeny finding, within-class variance) remain available for future validation if desired.
      Running these tests would upgrade the evidence strength from preliminary to replicated.
  inventor_accounting:
    dominated_by: Pollard rho at exponent 1/2 (no algorithmic improvement found)
    sota_delta:
      time_exponent: not_applicable
      memory_exponent: not_applicable
      data_or_query_exponent: not_applicable
      note: >-
        Negative structural result. All three proposals correctly identify Pollard rho at
        exponent 1/2 as the dominating algorithm. No improvement is possible via isogeny
        transfer for generic prime-field curves.
    named_obstruction: >-
      Four obstructions: (1) class-invariant (Tate theorem, unconditional), (2) surface-weakness
      gap (no surface weakness for generic D), (3) isogeny-finding cost (Omega(p^{k/2}) >= rho),
      (4) within-class uniformity (empirical, not proven). Obstructions 1-3 are proven; obstruction
      4 is empirical.
    forward_guidance: >-
      Close SG-ECDLP-002 scoped to the three proven obstructions. Transition H-IT-001 from
      weakened to rejected_scoped. Redirect research effort to non-isogeny approaches for ECDLP.
      The toy-scale tests in the three proposals remain available for future validation if desired.
  reviewed_by: coordinator
