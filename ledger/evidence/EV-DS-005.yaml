  validation_verdict: INADMISSIBLE
  red_team_verdict: NOT_DISCRIMINATING_INVALID_CONTROL
  observations:
    - >-
      The exact 13-path TASK-20260802-004 snapshot, parent, reachability, and
      Git-blob hashes independently verify. The sole run used the declared
      20/64/4/101 cell, unplanted uniform targets, matching backend id,
      smoothness_abort=false, and exactly one invocation.
    - >-
      The package honestly self-classifies invalid_measurement because the
      mandatory live /4 plant was not detected. Diagnostic values were
      R=0.03204552524531826 and R_null=111.54958054230949; applying /4 gave
      R_live=0.008011381311329564 and R_null_live=27.88739513557737.
    - >-
      The frozen absolute gate was underpowered in this null regime:
      R_null/4 remained 30.986 times above 0.9, and a divisor greater than
      123.944 would have been required merely to cross the threshold.
    - >-
      The reported R point lies outside its alleged 95% interval
      [0.05028302518468771, 0.13658728073025028]. The interval resamples
      successful per-relation wall ratios instead of the arm-level
      yield-charged R estimand, omits its source samples, and is not
      independently recomputable. R_null uncertainty is a degenerate point
      pair rather than a bootstrap interval.
    - >-
      Both real arms returned 200 successes in 200 unplanted attempts at this
      dense toy cell. That is point-sum coverage telemetry, not sparse Semaev
      relation-yield or inverse-success cost evidence.
    - >-
      Manifest/summary package status invalid_measurement is authoritative.
      The nested cell/R_cell completed_valid labels record arm completion only
      and cannot be read as scientific validity.
  inference: >-
    Preserve BATCH-020 as an invalid instrument result. EV-DS-002 remains the
    operative evidence for EXP-DS-001; H-DS-001 remains analyzed and
    inconclusive. Repeating the same /4 threshold against this null regime
    cannot repair detector power. Any successor requires a separately
    specified and reviewed compositional same-shape null with a relative live
    echo and honest sparse-target inverse-success accounting.
  boundaries:
    - No admissible packaging-versus-structure conclusion.
    - No S1_met, F2, mechanism support, weakening, rejection, or impossibility.
    - No crypto-scale or asymptotic evidence; all promotion gates remain open.
    - No rerun or successor experiment is authorized by this evidence record.
    - H-IC-001 and H-STR-002 are unchanged.
  unresolved_confounds:
    - Null naive/split arms do not implement the same compositional predicate.
    - Dirty-source replay does not hash every imported harness dependency.
    - Sparse target coverage and inverse-success cost remain unmeasured.
  inventor_accounting:
    object_studied: frozen live /4 detector and unplanted toy packaging
    depth: one invalid toy run plus committed-byte and gate-arithmetic audits
    dominated_by: n/a (no attack result claimed)
    sota_delta:
      generic_ecdlp_time_exponent: 0.0
      cryptographic_security_bits_reduced: 0
      supported_end_to_end_speedup: 0.0
    named_obstruction: absolute-threshold saturation in an asymmetrically slow null arm
    forward_guidance: >-
      Specify and independently review CTRL-RT047-SHAPE-MATCHED-LIVE-ECHO:
      a compositional same-shape null in detector range, preregistered relative
      0.25 live echo plus justified absolute gate, and all attempts/successes
      charged. Identification here is not authorization.
  reviewed_by: coordinator
