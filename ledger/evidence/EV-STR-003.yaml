  observations:
    - id: O-1
      text: >-
        PRIMARY TABLE. Measured `phi_alpha` at B = 27 (I1), 55 (I2), 204 (I3) and
        397 (I4), on the four instances (field_bits, seed) = (12,1), (12,2),
        (16,3), (20,3):
        arm A (phi-invariant factor base, phi-orbit rows appended - the
        as-committed configuration): 9, 2, 4, 1;
        arm B (same phi-invariant factor base and same declared phi shift, the
        appended rows REMOVED): 27, 52, 197, 386;
        arm C (random factor base under its own seeded random shift - the
        as-committed baseline): 27, 54, 201, 382;
        arm E (random factor base, rows synthetically closed under the positional
        block-of-3 shift, zero endomorphism content): 11, 1, 0, 29.
        Every cell was independently recomputed by TASK-20260727-023 from
        separately written code with zero disagreements.
    - id: O-2
      text: >-
        FALSIFICATION CRITERION F1 FIRED, at I1 and at I4. The frozen contract
        pre-registered arm E at 0, 1, 0, 1; it measured 11, 1, 0, 29, so
        alpha(E) > alpha(A) at I1 (11 > 9) and at I4 (29 > 1). The Executor
        recorded verdict `obs1_falsified`; TASK-20260727-023 recomputed the
        verdict from its own values and agrees. Per the contract, frozen before
        execution, the consequence is binding: OBS-1 and RT-OBJ-1's comparative
        limb are WITHDRAWN, DEC-20260727-009 may not rest on them, and the
        as-committed `phi_alpha` metric is UNADJUDICATED - not refuted, and not
        vindicated.
    - id: O-3
      text: >-
        S2, S3 and S4 all HELD. S2 (alpha_B > 0.5 * alpha_C) holds at 4 of 4; the
        measured ratios are 1.000, 0.963, 0.980 and 1.011, so the verdict is
        insensitive to the 0.5 threshold over two thirds of its range. S3
        (alpha_A <= misaligned_row_count_A, measured 9, 5, 4, 1) holds at 4 of 4
        with equality at 3 of 4; the same inequality holds in all 16 (arm,
        instance) cells, with equality in 9 of 16 and in 4 of 4 for arm E. S4
        holds at 4 of 4: the committed `main()` exits 0 at both B mod 3 == 0
        instances and raises IndexError at harness/endomorphism_la.py:451 with
        exit code 1 at both B mod 3 != 0 instances. F2, F3 and F4 did not fire.
    - id: O-4
      text: >-
        WHY ARM E DIVERGED, adjudicated by TASK-20260727-024 and not by this
        record: the divergence is a difference of CLOSURE CONVENTION, not a dedup
        count, not instance-dependence and not a driver defect. In the square
        branch (taken in all 16 cells) row i of the displacement matrix vanishes
        exactly when M[sigma(i)] equals the shift of M[i], so a single skipped
        emission shifts the phase of the whole downstream stream: alpha is a
        phase-tracking statistic of WHERE skips fall, not of how many there are.
        Arm E as frozen faithfully mirrors the committed harness's dedup
        pathology and consumes 2.5x-3.0x as many base rows as arm A (37/65/214/407
        against 15/22/72/136), and its skips have a different cause (weight-
        preserving permutation, so every skip is a duplicate hit) from arm A's
        (a dropped coordinate when a phi-image falls outside the truncated tail
        orbit). Arm E as frozen was therefore a valid EXISTENCE control and a
        MIS-SPECIFIED COMPARATIVE one: S1/F1 tested a proposition strictly
        stronger than OBS-1's content, on an uncontrolled nuisance variable.
        Corroborating committed numbers: arm A has dedup_suppressed_count 0 at I2
        and I4 yet misaligned_row_count 5 and 1 (both are the B mod 3 = 1
        instances), and arm E has 0 suppression and 0 misalignment at I3.
    - id: O-5
      text: >-
        CONTRACT DESIGN DEFECT, recorded rather than glossed. Section 7 defines
        S_i = not F_i, so "S1 and S2 and S3" and "F1 or F2 or F3" are exact
        complements and the contract's own `mixed` verdict branch is UNREACHABLE
        by construction - yet the measured S1 pattern IS mixed: S1 held at I2
        (1 <= 2) and I3 (0 <= 4) and failed at I1 (11 > 9) and I4 (29 > 1). The
        mechanical label `obs1_falsified` is correct under the rule as written
        and the Executor applied it correctly. It must not be read as
        "the metric is vindicated". The contract's disposition for `mixed` and its
        UNADJUDICATED language point the same way, and this ledger uses that
        language rather than the label.
    - id: O-6
      text: >-
        DERIVATIONAL LIMB SURVIVES, COMPARATIVE LIMB DOES NOT. RT-OBJ-1 had two
        limbs. Limb 2 - "a construction with zero phi content scores BETTER at
        every headline B" - is FALSIFIED by O-2 and is withdrawn in every form.
        Limb 1 - alpha is bounded by the number of positions at which the emitted
        row list departs from a clean concatenation of sigma-orbit triples - is
        exactly S3 and was CONFIRMED at 4 of 4 (equality at 3 of 4 in arm A, 4 of
        4 in arm E). Limb 1 is admitted here only in that rescoped, derivational
        form, and it does not by itself say the metric is uninformative: whether
        those phase breaks correlate with anything mathematical is precisely the
        UNADJUDICATED question.
    - id: O-7
      text: >-
        THE ONE-VARIABLE COMPARISON (CTRL-4), which involves neither arm E nor
        F1 and is untouched by the falsification. Under a COMMON phi shift
        operator, the same collection rule and the same no-append convention,
        changing only the factor base: arm B (phi-invariant F) gives 27, 52, 197,
        386 and arm C's phi-shift measurement of its own random-F rows gives 27,
        52, 199, 387. The differences are 0, 0, 2 and 1 on values of order B, at
        4 of 4. This is the one-variable ablation EXP-STR-002's own specification
        declared (lines 36-39) and never implemented (census F9, confirmed by
        TASK-20260727-016). On these four toy instances, phi-invariance of the
        factor base is not what moves alpha; the appended rows are, and they move
        it BY CONSTRUCTION - closing a row list under sigma makes the matrix
        sigma-equivariant, which is a derivation, not a measurement.
    - id: O-8
      text: >-
        THE SIGNATURE IS NOT DIAGNOSTIC. Measured under BOTH shift operators on
        the SAME rows, arm E (random factor base, zero phi content) gives
        phi-shift versus random-shift 11 vs 26, 1 vs 53, 0 vs 200 and 29 vs 391.
        A construction with no endomorphism in it exhibits, at 4 of 4 including
        both headline instances, the same qualitative (small vs ~B) separation
        that DEC-20260726-006's evidence pair rests on. This is a within-arm,
        one-variable comparison; F1 was a cross-arm comparison and its firing
        says nothing about it. It shows the SIGNATURE is not diagnostic; it does
        NOT show that arm A's value equals a phi-free one - at I1 and I4 it does
        not, which is exactly F1.
    - id: O-9
      text: >-
        NO END-TO-END PATH, and the phi arm's matrix is rank-deficient at every
        instance. `_collect_relations` builds rows as bare 0/1 incidence vectors;
        the target's scalar multiple is never recorded, so no linear system with a
        right-hand side is ever assembled, in EXP-STR-002 or EXP-STR-003. Measured
        rank deficiency B - rank_M of the phi arm: 4, 6, 30, 67 at B = 27, 55,
        204, 397 - at the headline instance the system is 67 short of full rank.
        Arm E, the construction the contract itself calls mathematically
        worthless, has rank deficiency 0, 0, 0, 1. No solve was available at any
        tested instance and none was attempted.
    - id: O-10
      text: >-
        REPRODUCTION AGAINST THE COMMITTED EXP-STR-002 RECORDS, both halves.
        (a) Arm A at I1 agrees with RUN-STR-phi-b12-s1-m2 on all five compared
        fields (B 27, n 733, hits 15, attempts 27, phi_alpha 9), and the four arm-A
        alphas 9, 2, 4, 1 reproduce EV-STR-002's phi column exactly, 4 of 4;
        DEC-20260726-006's cost_ratio 0.011 is exact arithmetic on (alpha = 1,
        B = 397). NOTHING WAS FABRICATED, and any reading of this record that
        implies otherwise is wrong. (b) The random half does NOT reproduce:
        EV-STR-002 records rand_alpha 53 (B=55), 200 (B=204), 387 (B=397) against
        measured arm C 54, 201, 382 - three comparisons, three mismatches - and
        the phi-shift measurement of the same arm-C rows gives 52, 199, 387, so
        the recorded values match NEITHER committed computation across all three
        instances. The cause is not speculated on.
    - id: O-11
      text: >-
        THE ONE REPRODUCIBLE EFFECT is a constant factor r = 3 in RELATION
        COLLECTION, not in linear algebra. Searches per relation row, phi arm
        against random arm, are 0.692/1.811, 0.364/1.154, 0.383/1.136 and
        0.770/2.466 - ratios 2.62x, 3.17x, 2.97x and 3.20x, i.e. r = 3 at every
        instance. That is the known automorphism-quotient saving
        (Wiener-Zuccherato, Duursma-Gaudry-Morain and the standard factor-r
        factor-base quotient). It is already in the literature, it is a constant
        factor, and it is not target-class.
    - id: O-12
      text: >-
        RECEIPT AND ARTIFACT INTEGRITY: PASS with two defects. TASK-20260727-023
        verified the snapshot against git (reachable from HEAD, expected parent,
        exactly 123 paths, all additions, no AppleDouble sidecar, nothing staged
        under harness/ or experiments/EXP-STR-002/, working tree identical to the
        commit for all 123 paths), confirmed 20/20 runs `completed_valid` with the
        six required files each, one distinct code-hash block matching the tree,
        distinct non-overlapping per-run timing windows (the EXP-STR-002 defect D6
        is NOT repeated), and budget consumption of 132.595 s of a declared 5400 s
        with peak RSS 0.0994 GB of 8 GB. DEFECT 1: two stderr.log files
        (RUN-STR-003-C-b16s3, RUN-STR-003-C-b20s3) are ZERO BYTES, so the
        contract's assertion that stderr carries real captured output "for every
        arm here" is not literally true; IV-2 requires presence only, so no run is
        invalidated. DEFECT 2: manifest.run.inference.fallback_used is FALSE in
        all 20 manifests while raw-result.json inference_supplement.fallback_used
        is TRUE; the value is hardcoded at harness/runner.py:136-140, which the
        contract forbids modifying because the harness is the object of
        measurement. The disagreement is disclosed inside every run record, but a
        reader of manifest.yaml alone would conclude no fallback occurred.
    - id: O-13
      text: >-
        MODEL VERIFICATION. `model_verified: false` is CONFIRMED correct -
        `python3 -m orchestration.adapter doctor --probe` returns "No module named
        orchestration.adapter" on this branch. No measured metric depends on model
        output, and this is established rather than asserted: TASK-20260727-023
        reproduced every value with deterministic Python calling the committed
        harness, with no model in the loop. The unverified identifier bears on
        which agent orchestrated the run, not on the numbers.

  inference: >-
    On four toy j=0 instances, under a contract frozen before execution and a run
    package independently re-derived cell for cell, the experiment establishes
    three things and refuses a fourth. (1) The comparative claim that a phi-free
    construction scores equal or better at every headline B is FALSE: F1 fired at
    B = 27 and B = 397, so OBS-1 and RT-OBJ-1's comparative limb are withdrawn.
    (2) The as-committed `phi_alpha` metric is UNADJUDICATED. It is not shown to
    measure phi-invariance and it is not shown to be an artifact; the frozen
    contract fixed this consequence in advance and it binds. (3) Independently of
    (1) and (2), and by a comparison that involves neither arm E nor F1: with a
    common phi shift and the appended rows removed, making the factor base
    phi-invariant changes alpha by 0, 0, 2 and 1 on values of order B at 4 of 4,
    while a row list with zero endomorphism content reproduces the small-versus-B
    signature at 4 of 4 and attains alpha = 0 at B = 204. On these instances the
    factor base's phi-invariance is not what moves the metric. (4) REFUSED: this
    record makes NO statement about H-STR-002's mechanism. Phi is an
    automorphism, phi(R) is a genuine relation whenever R is and F is
    phi-invariant, and the closed system really is C_3-equivariant; no arm of this
    experiment touches any of that. EXP-STR-003 tested an INSTRUMENT and
    establishes nothing about the endomorphism mechanism, in either direction.

  boundaries:
    - >-
      TOY TIER ONLY. Four j=0 (a=0, CM discriminant -3) prime-field curves with
      p = 1 mod 3, p <= 631843, n <= 158071 (about 17.3 bits), B <= 397, arity
      m = 2, one realisation per cell, one stack (Python 3.13.1, numpy 2.4.0,
      sympy 1.14.0, macOS arm64). Nothing here extends to arity m = 3, to
      B > 397, to j != 0 curves, to generic curves, to medium or cryptographic
      scale, or to index calculus in general. No toy number in this record may be
      presented as crypto-scale validation.
    - >-
      THIS EXPERIMENT TESTED AN INSTRUMENT, NOT A MECHANISM. Under no outcome
      could it establish or refute H-STR-002's endomorphism mechanism. It closes
      no direction, settles no cost model and moves no asymptotic exponent in
      either direction.
    - >-
      NOT A CRYPTANALYTIC RESULT, not an attack, not an attack improvement, not a
      closure and not an impossibility claim. The only reproducible speedup
      measured anywhere in this line of work is the classical constant factor
      r = 3 in relation collection (O-11), which is already the specialized
      baseline.
    - >-
      THE COST MODEL IS UNTOUCHED. The frozen contract excludes cost explicitly
      (no cost ratio, no structured_cost, no wiedemann_cost, no density_penalty,
      no crossover claim, no wall-time comparison), and TASK-20260727-023
      confirmed that no cell reports any cost quantity. The open cost-model
      objections RT-CM-1 through RT-CM-6 - displacement-rank theory applied to a
      finite-order permutation rather than a nilpotent shift, the alpha = 0
      degeneracy priced at zero operations, uncharged relation collection running
      7x to 79x the entire modelled linear algebra, absent memory accounting on
      both sides, the inverted cost_ratio under the ablation, and non-comparable
      units - remain OPEN and must not be described as settled, tested or
      addressed by this experiment or by any record citing it.
    - >-
      NO ASYMPTOTIC CLAIM IS SUPPORTED IN EITHER DIRECTION. "alpha = O(1) at
      large B" is not supported by four toy points that are not monotone
      (9, 2, 4, 1); neither is any claim that alpha must grow. No scaling law may
      be read off this table.
    - >-
      UNEXERCISED PATHS. The rectangular limb of the displacement-rank definition
      is never reached (branch is `square` in all 16 cells), and the zero-relation
      stopping path SR-4 never triggered, so both are untested here.
    - >-
      NO ARCHIVED BASELINE AT THE TWO LARGER INSTANCES. There is no committed rho
      or BSGS run record at n = 41617 or n = 158071. Arm D's child process ran rho
      at those sizes but wrote outside the repository and the contract forbids
      citing it. The comparison that would decide whether any of this matters is
      absent from the repository at exactly the parameters where the original
      claims were made.

  unresolved_confounds:
    - id: UC-1
      text: >-
        THE INSTRUMENT QUESTION IS UNADJUDICATED. Whether `phi_alpha` is an
        artifact of the row-insertion rule is not settled by this experiment and
        may not be asserted in either direction. The cheapest discriminating
        successors are named and not run: arm A-prime (the as-committed phi arm
        with the line-303/304 dedup and zero-filter disabled, predicting alpha = 0
        exactly at every B mod 3 == 0 instance) and arm E-prime (a phi-free
        closure emitting each sigma-orbit once and never suppressing).
    - id: UC-2
      text: >-
        ARM E AS FROZEN IS NOT A MATCHED COMPARATIVE CONTROL (O-4). Any future
        criterion of the S1 form must control the nuisance variable - by matching
        base-row budgets and reporting alpha conditional on suppression count -
        or it is untestable. The contract's `mixed` branch must also be made
        reachable (O-5).
    - id: UC-3
      text: >-
        rank_M at I3 and I4 rests on the driver's vectorised implementation alone
        for arms B, C and E; the in-run reference cross-check is `not_computed`
        there and TASK-20260727-023 supplied an independent reference only for
        arm A (174 at I3, 330 at I4, both agreeing). rank_M and rank_deficiency
        are secondary metrics feeding no criterion.
    - id: UC-4
      text: >-
        NO EXECUTOR TASK RECEIPT EXISTS for TASK-20260727-021, so the five
        disclosed deviations are recorded in no durable artifact (the driver
        initialises `self.deviations` at ablation_driver.py:366 and never
