  inference: >-
    THE RUN SET IS RECEIPT-VALID AND CONTROL-INVALID, AND THEREFORE CANNOT
    DISCRIMINATE BETWEEN THE TWO EXPLANATIONS THE BATCH EXISTED TO SEPARATE.
    Receipt-valid, because the expected run count, schema completeness, seed
    integrity and raw-versus-summary agreement all pass under independent check.
    Control-invalid, because every control object in the package sits on the
    all-ones stratum, which by the derivation recorded in proof_refs the counted
    path can neither produce nor reach, because the counted arm and the
    known-false control run over disjoint cosets, and because the function that
    produced every counted instance is executed by no run other than the counted
    arm and its own replay. A control that cannot fail whatever the counted path
    does is not a control, which is docs/inventor-protocol.md controls before
    belief applied to this package. Independently and by the frozen text alone,
    IV-1 is not satisfied and its frozen consequence is that ALL runs of this
    experiment are void. Applying the frozen success_criterion mechanically, G2
    is not met because IV-8 is not satisfied on either branch, G4 fails because
    R6 is vacuous, R7 is not satisfied and R8 never ran, G3 is reported but is
    not the contracted quantity, and G1 clauses are literally met but their
    reading is void with the rest. Therefore no reading of the recorded numbers
    can separate the hypothesis that the prescribed-square construction genuinely
    exhibits certified n equals 6 instances above the draw-route rate from the
    hypothesis that the recorded 28 are an artifact of an uncontrolled path.
    THE NARROWEST STATEMENT THE DATA JUSTIFY, scoped exactly as claim_tier_note
    states. The 28 objects recorded by RUN-ECRANK-73275e-R3 are, on independent
    recomputation from committed bytes, 28 structurally valid and pairwise
    non-isomorphic n equals 6 prescribed-square instances whose counts_per_H of
    15, 22 and 28 reproduces from their recorded r-heights; and no control in
    this package constrains them, the primary metric is not re-derivable from the
    frozen contract, and the run set is void as evidence under its own IV-1 rule.
    Both halves are load-bearing and neither may be quoted alone. NOTHING here is
    evidence for or against HEUR-1 or H-ECRANK-36d8d7 in either direction, and
    the defect is in the frozen contract rather than in the Executor conduct, so
    the repair is a design act and not a re-run.
  inference_two_checks_verify_different_things: >-
    RECORDED EXPLICITLY SO NO LATER READER CONFLATES THEM. The Red Team check
    C-B is a FORWARD check on persisted objects, asking whether the instances the
    run recorded satisfy the certifier own stated criteria and are pairwise
    distinct; the answer is yes, exactly, with independent code, and it
    establishes that the 28 objects are valid and non-isomorphic and that no
    counterexample exists among them. The Validator blind re-derivation is a
    BACKWARD check on the procedure, asking whether an independent party can
    reproduce the declared sample and hence the count from the frozen contract;
    the answer is no. C-B does not repair the blind re-derivation, because
    reconstructing the sample is precisely what C-B did not attempt. The blind
    re-derivation does not impugn C-B, because failing to reconstruct a sample
    says nothing about the objects that sample produced. The objects are
    checkable and were checked; the count is not checkable and was not checked.

