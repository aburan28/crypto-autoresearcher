  obstruction_not_applicable:
    promotion_note: >-
      RENAMED FROM `obstruction` AT ARCHIVE TIME, content otherwise unchanged.
      The composition draft authored this as an `obstruction` block whose five
      measurement fields were deliberately null, with the reasoning below.
      tools/validate_ledger.py requires those five fields to be non-null
      whenever an `obstruction` key is PRESENT, and permits the key to be
      absent entirely -- which is the correct shape for a record whose
      direction is neutral and which claims no obstruction. Filling them to
      satisfy the schema would have manufactured a measurement about the object
      out of an instrument fact, which is precisely the misuse the field exists
      to prevent. The block is therefore renamed rather than filled or deleted,
      so the reasoning and the resource_check survive in full. The draft at
      coordination/goals/GOAL-ECRANK-002/batches/BATCH-e15a65/tasks/TASK-20260907-175a4a/EV-ECRANK-6aa7b9.draft.yaml
      is preserved unchanged.
    statement: null
    quantity: null
    value: null
    measured_by: []
    scope: null
    not_applicable_reason: >-
      NO OBSTRUCTION IS CLAIMED BY THIS RECORD, and the block is left empty
      deliberately rather than filled to look complete. The template requires an
      obstruction block when direction is weakens or contradicts and on any
      record closing a lane. This record direction is NEUTRAL and it closes no
      lane. Every adverse-looking quantity in the package is an instrument fact
      that AGENTS.md core rule 3 and the contract own F4_controls forbid reading
      as negative mathematical evidence, so there is no measured quantity about
      the OBJECT that blocks the approach. Manufacturing one from a control
      failure would be exactly the misuse this field exists to prevent, since an
      obstruction is a claim about the object and not about the attempt.
    resource_check:
      examined: true
      reading: >-
        THE CHECK WAS RUN AND IT FOUND A GENUINE RESOURCE, RECORDED HERE EVEN
        THOUGH NO OBSTRUCTION IS CLAIMED. The one object-level measurement this
        round produced is the pair of derivations in proof_refs. (T1) says the
        Mestre object built from the monic truncated square root satisfies
        deg(g squared minus p) at most n/2 minus 1, so at n equals 6 the
        all-ones degeneration is a conic and not an elliptic object at all.
        (T2) says at the all-ones pattern the ellipticity condition is
        identically zero for every b-tuple and every t. Read as an obstruction
        these two kill the all-ones family as a control at n equals 6. READ AS A
        RESOURCE they characterise the degenerate stratum of the M3 family
        exactly, in closed form, and they are therefore the cheapest available
        specification of what a NON-degenerate control object must avoid. That
        is directly usable by the controls-repair design named in the closing
        decision, whose required property is that every control object be drawn
        from the same coset and the same mixed-sign multi-class d-pattern
        distribution as the counted arm; (T1) and (T2) tell that design precisely
        which stratum to exclude and why, without any further computation. A
        second, weaker reading. (T1) bounds deg s by n/2 minus 1 for the whole
        truncated-square-root construction, so at n equals 6 the accepted window
        of degree 3 or 4 is reachable only off the all-ones locus, which is a
        structural constraint on the family that no run in this program has yet
        measured the size of. Neither reading is a claim and neither changes any
        status; both enter the ranking on their merits as ordinary proposals.
      spawned_ids: []
      spawned_ids_note: >-
        EMPTY BY CONSTRUCTION, not by omission. This composition task was
        allocated a fixed set of identifiers and instructed to mint no others,
        so it files no IDEA or hypothesis record. The reading above is carried
        forward as a named design constraint in the closing decision next
        actions, and any record taking it up is minted by the successor design
        task with tools/allocate_id.py.

  procedure_deviations_of_the_review_round:
  - id: PDR-1
    what: >-
      Each reviewer final repository-wide git status, run as a completion-gate
      obligation to confirm nothing was written outside its write scope and
      nothing was committed, incidentally surfaced the sibling FILENAMES. The
      Validator saw two names and the Red Team saw one. Neither file was opened,
      read, diffed, grepped, hashed or inferred from, and every verdict in both
      reports was fixed before the exposure.
    contaminated: >-
      No content. Both attestations record read_sibling_reports false honestly.
      What could in principle be contaminated is knowledge that the sibling had
      finished, which the Validator itself points out and calls a scheduling fact.
      The limit stated plainly is that whether a file was revised between being
      written and being committed is not independently detectable from the tree,
      so the no-revision claim rests on the two attestations alone.
    blindness_lifted: false
  - id: PDR-2
    what: >-
      The J4 blind re-derivation was IMPLEMENTATION-BLIND BUT NOT VALUE-BLIND,
      flagged by the Validator itself before it opened anything. The mandatory
      handoff embeds the frozen plan, which quotes 15, 22, 28, feasible_tuples 20
      and feasibility_fraction 0.002 in coordinator_prior item 8 and again in the
      J4 attack plan, and the earlier prior repeats them.
    contaminated: >-
      Any reading of J4 agreements as BLIND agreement about the values. The
      at-most-two-roots ceiling is blind, but its instantiation as at least 8
      tuples contributing two instances uses the leaked 28 and 20, so the exact
      landing at 8 is a check that the record is internally coherent with a blind
      structural fact rather than a blind reproduction of the count. NOT
      contaminated is the negative finding itself, since knowing the target makes
      reverse-engineering a matching convention easier rather than harder and 375
      conventions still failed, nor the seven definitional gaps, which are
      statements about what the contract text defines.
    blindness_lifted: false
  - id: PDR-3
    what: >-
      experiments/EXP-ECRANK-76a70d/ was outside the Red Team enumerated read
      scope and was not opened, so the predecessor non-transfer argument is made
      from EV-ECRANK-8b35bb alone.
    contaminated: >-
      Nothing the Red Team computed, since J5, J6, J7 and the four checks are all
      derived from EXP-ECRANK-73275e committed bytes and the frozen contract.
      What it leaves open is the stated conditional, that if the predecessor
      controls were also built on an object its counted path cannot produce the
      same objection reaches it. That is untested and is a named next action.
    blindness_lifted: false
  - id: PDR-4
    what: >-
      The frozen plan own designated strongest refutation artifact, J7 item (i),
      Weierstrass re-verification of exhibited points with a Mazur non-torsion
      check, was NOT COMPUTABLE from committed bytes because no a-invariants and
      no curve points are persisted. The Red Team ranked it fourth, substituted
      the structural re-verification C-B plus C-C and C-D, ran three items, and
      stated the exact successor requirement.
    contaminated: >-
      Nothing, and it is recorded because it changes what this record may claim.
      It is why proof_status is derivation and not certificate, and why
      certificate_refs is empty.
    blindness_lifted: false

