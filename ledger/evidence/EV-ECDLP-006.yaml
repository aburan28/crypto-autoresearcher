evidence:
  id: EV-ECDLP-006
  hypothesis_id: H-IC-001
  experiment_ids: []
  run_ids: []
  type: theoretical
  direction: neutral
  strength: preliminary
  claim_tier: toy
  certificate_refs: []
  proof_status: not_applicable
  proof_refs: []
  observations:
    - >-
      TASK-20260726-001 produced H-IC-001 (hypothesis: T_desc crosses below
      sqrt(N) at some toy bit size, making K* finite, but crossover cost lies
      on/above the S*T^2 frontier) and EXP-IC-001 (specification: calibrate
      Groebner wall-time to group-op equivalents via rho, measure T_desc
      across 8-36 bits, compute K* and compare to S*T^2).
    - >-
      TASK-20260726-002 snapshot commit 6a4f0705 (parent 3bc44688) verified
      for ancestry, parent, exact 3 paths, and SHA-256 bindings.
    - >-
      TASK-20260726-003 independent review returned REVISE with 5 blocking
      objections: (1) rho calibration counts only walk steps, not all group
      ops, causing 97% overhead bias at 8-bit; (2) wall-time comparison
      between polynomial arithmetic and group operations is implementation-
      bound; (4) S_rel heuristic overestimates by factor B (should be
      (N/B^{m-1})*T_desc, not N*T_desc); (5) S*T^2 >= N is tautological given
      the S_rel heuristic (reduces to T_desc >= 1); (6) S_rel is never
      measured (no relations at bits >= 16), making the frontier comparison
      formula-driven, not empirical.
    - >-
      The reviewer confirmed the K* finiteness measurement at 28-36 bits is
      sound and should be preserved. The core T_desc vs sqrt(N) comparison
      is valid; the S_rel heuristic and frontier comparison need repair.
    - >-
      Review runtime used an auditable glm-5p2 fallback (opencode); equivalence
      to review-xhigh is not claimed.
  inference: >-
    The experiment design is partially sound (K* finiteness measurement) but
    has methodological defects in the calibration, S_rel estimation, and
    frontier comparison that must be repaired before the protocol can govern
    a valid executable measurement. REVISE is a review disposition on a design
    package only.
  boundaries:
    - No experiment was authorized or executed.
    - Maximum claim tier is toy; no crypto-scale claim.
    - The 5 blocking objections are specific and reparable.
  unresolved_confounds:
    - The wall-time-to-group-op conversion is inherently implementation-bound;
      even with a fixed calibration, the result depends on sympy vs an
      optimized F4 solver.
    - The S_rel heuristic at toy scale where no relations are found is
      speculative; direct measurement at 8-12 bits (where decompositions exist)
      would be more grounded.
  reviewed_by: coordinator
