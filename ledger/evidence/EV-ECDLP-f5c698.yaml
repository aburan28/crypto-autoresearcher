evidence:
  id: EV-ECDLP-f5c698
  hypothesis_id: H-ECDLP-a40416
  experiment_ids: [EXP-ECDLP-c373eb]
  run_ids: [RUN-ECDLP-c373eb-1]
  type: empirical
  direction: supports
  strength: preliminary
  claim_tier: toy
  certificate_refs: []
  proof_status: empirical_only
  proof_refs: []

  observations:
    - id: O-1
      statement: >-
        Part 1: on E/F_p (p=1009, y^2=x^3+x+1, #E(F_p)=1034), with S=(286,680)
        of prime order n=47, the canonical order-n prime-to-p torsion lift
        S-hat was constructed (verified: n*S_hat equals the exact projective
        identity mod p^8, the full precision cap -- an independent,
        checkable certificate of the lift's order-n correctness, itself
        independently re-verified by this Coordinator's own from-scratch
        Jacobian-coordinate implementation). D1(j,k) =
        v_p(x([k]S_hat)-x([j]S_hat)) truncated at r=8 was tabulated for ALL
        1035 pairs 1<=j<k<47 (exhaustive, not sampled). Observed image:
        exactly {0, 8} -- 1012 off-fibre pairs at 0, all 23 on-fibre pairs
        (k = n-j) at 8. ZERO intermediate values. This matches Proposition E
        (ideas/artifacts/ECDLP-IDEA-436/ggm_simulability_gate_erratum_20260831.md
        section C.2) exactly, with no exception across the full instance.
      measured_by: [RUN-ECDLP-c373eb-1]
    - id: O-2
      statement: >-
        This Coordinator independently re-verified O-1 using a separate,
        from-scratch Jacobian-coordinate implementation (different code from
        the executor's): confirmed the reported S_hat coordinates satisfy
        the curve equation exactly mod p^8, reduce to S=(286,680) mod p
        exactly, and satisfy n*S_hat = exact identity mod p^8. Independently
        recomputed D1 for five (j,k) pairs (including the executor's own
        spot-check pair (5,12)) spanning both on-fibre and off-fibre cases;
        all five matched the reported image {0,8} exactly (D1(5,12)=0,
        D1(5,42)=8, D1(1,46)=8, D1(10,20)=0, D1(20,27)=8).
      measured_by: [RUN-ECDLP-c373eb-1]
    - id: O-3
      statement: >-
        Part 2 (discriminating null-lift control): the identical D1
        tabulation was repeated using a different, also-valid Hensel lift of
        S that does NOT satisfy the order-n condition (measured v_p of
        n*(null lift)'s Z-coordinate is exactly 1, far short of the r=8 cap
        -- a genuinely non-order-n lift). Observed image: {0, 1} -- GENUINELY
        DIFFERENT from Part 1's {0, 8}. This directly discriminates the
        hypothesis's mechanism claim ("the flatness is a consequence of the
        canonical lift's order-n / group-isomorphism property") from the
        alternative it was designed to rule out ("the flatness is an
        artifact of p-adic library precision handling, present on any lift
        regardless of the order-n condition") -- the alternative is refuted
        by this observation, since a precision-handling artifact would have
        produced the SAME {0,8}-style flatness on the null lift too.
      measured_by: [RUN-ECDLP-c373eb-1]
    - id: O-4
      statement: >-
        Part 3 (RTF-1 rigidity probe): on the canonical lift, the Vandermonde
        (rigid, product of three pairwise x-differences) functional's image
        over six tested triples was {0, 8} -- matching D1's own two-valued
        pattern exactly, as RTF-1 predicted for a rigid functional. The
        non-rigid functional (x([k1])*x([k2])-x([k3])) image over the SAME
        six triples was {0} exclusively -- no value >= 1 was observed on
        this sample.
      measured_by: [RUN-ECDLP-c373eb-1]

  inference: >-
    O-1 and O-2 jointly confirm Proposition E's literal claim, exhaustively
    and with independent double-implementation verification, on this one
    toy instance: no counterexample exists among the 1035 pairs tested. O-3
    confirms the mechanism claim specifically (not merely the bare two-valued
    fact): the collapse is attributable to the canonical lift's order-n
    property, not to a precision-handling artifact that would appear
    regardless of which lift is used. O-4 confirms the Vandermonde half of
    RTF-1's prediction (a rigid multi-point functional inherits the
    two-valued collapse) but is UNDERPOWERED to test the non-rigid half: a
    generic non-rigid functional is expected to hit a mod-p coincidence
    (giving a finite value >= 1) only with probability roughly 1/p per
    triple, and only six triples were tested, so observing {0} exclusively
    is consistent with RTF-1 and does not test it discriminatingly. This is
    recorded as an open item, not a negative finding against RTF-1.

  boundaries:
    - >-
      Single toy instance: one curve (p=1009), one point S (n=47 prime), one
      choice of null lift, six triples for Part 3. This is NOT replicated
      evidence across multiple curves or multiple (p,n) choices; strength is
      recorded as preliminary rather than replicated or strong for that
      reason, even though the tested instance's own coverage (all 1035 pairs)
      is exhaustive, not sampled.
    - >-
      p approximately 1009 is toy tier per docs/claims-and-verification.md
      (well under the 32-bit floor). This evidence asserts direct
      measurements on this tested instance plus consistency with the
      already-derived, scale-independent Proposition E; it does NOT assert
      anything about cryptographic-scale curves without a separate,
      explicit transfer argument, which is not made here.
    - >-
      Per this control's own disclosed limitation (red-team TASK-20260831-62019a's
      RC-1), a finite-precision computation observes only "at least 8" (the
      value 8 stands for "v_p >= 8"), never literal infinity. No value in
      this record should be read as an exact infinite-precision claim.
    - >-
      Part 3's non-rigid-functional test is statistically underpowered at
      six triples (see inference above); a larger, deliberately-searched
      sample (or an explicit search for a mod-p coincidence among candidate
      triples) would be needed to genuinely test RTF-1's non-rigid-functional
      prediction.
    - >-
      This evidence bears only on disjunct D1 of ECDLP-IDEA-436's hypothesis
      H (D1 or D2); it says nothing about disjunct D2, does not close
      KN-OPEN-3417fc (which quantifies over any computable non-group-
      theoretic invariant), and does not retier KN-FIND-002 or
      KN-FIND-b7e091 (routed separately, unopened, per DEC-20260831-a9716f).

  unresolved_confounds: []

  obstruction:
    statement: >-
      The coordinate-valuation-profile functional D1 on the canonical
      prime-to-p torsion lift collapses exactly to the indicator of the
      fibre k = +/-j mod n -- an object already available for free in
      E(F_p) via a single x-coordinate comparison -- so it supplies zero
      information and no computational leverage beyond the <S>/{+/-1}
      quotient Pollard rho's negation map already exploits.
    quantity: >-
      Image (as a set) of D1(j,k) = v_p(x([k]S_hat)-x([j]S_hat)) truncated
      at precision r=8, over all pairs 1<=j<k<n on the canonical order-n
      lift.
    value: '{0, >=8} exactly, over all 1035 tested pairs (n=47), with no exception'
    measured_by: [RUN-ECDLP-c373eb-1]
    scope: >-
      E/F_p ordinary, good reduction, p approximately 1009 (this instance),
      S of prime order n=47 coprime to p, minimal Weierstrass model
      realising good reduction, canonical order-n prime-to-p torsion lift,
      precision r=8. Single toy instance; not yet replicated across
      multiple curves.
    resource_check:
      examined: true
      reading: >-
        As already recorded in DEC-20260901-255ebd and the erratum this
        evidence measures: this collapse is a resource for the STANDARD
        generic-group / structured-hardness theory this program already
        holds (KN-TECH-005's barrier, and the corroborating strict-GGM
