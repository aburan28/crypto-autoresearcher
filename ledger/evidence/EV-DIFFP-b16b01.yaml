  which_observations_do_not_rest_on_a_charged_run: >-
    THE EXCEPTION IS NAMED RATHER THAN BLURRED, AND IT IS NAMED HERE BECAUSE IT IS
    RUN-CITATION ACCOUNTING AND NOT PART OF THE REGISTRATION DEFECT BELOW. The
    ADVERSARIAL CONSTRUCTIONS of observations O-8, O-9, O-10 and O-20, and the
