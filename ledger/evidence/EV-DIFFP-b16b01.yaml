evidence:
  id: EV-DIFFP-b16b01
  title: >-
    BATCH-efcae7 round 2, composed at the exact tested scope: the strengthened
    control suite reproduces under run discipline and its artifact and control
    integrity is independently confirmed, AND its per-component power profile is
    almost entirely entailed by the control families' own construction and by the
    membership key's functional-dependency graph rather than by the instrument.
    Not one integer breaks. The reading of those integers does not survive.
  goal_id: GOAL-DIFFP-84d641
  question_id: RQ-DIFFP-a5c483
  batch_id: BATCH-efcae7
  experiment_ids: [EXP-DIFFP-4b165f]

  hypothesis_id: null
  hypothesis_id_note: >-
    NULL, AND CORRECTLY SO RATHER THAN OMITTED. GOAL-DIFFP-84d641 carries
    `active_hypothesis_ids: []`. BATCH-efcae7 measures an INSTRUMENT -- the
    adjudicator's control suite -- and not a proposition about MD5's or SHA-1's
    difference space. No H-* record exists for this batch, none was created, and
    attaching this evidence to a hypothesis that does not exist would be a
    fabricated linkage. The proposition this record bears on is named in full
    under `direction_scope`.

  run_ids: []
  run_ids_note: >-
    EMPTY BECAUSE THE FIVE RUNS DO NOT REGISTER IN THIS REPOSITORY, NOT BECAUSE
    THEY DO NOT EXIST. THE TWO ARE DIFFERENT PROPERTIES AND BOTH ARE STATED HERE.
    THEY EXIST: five charged runs, listed by manifest path under
    `run_manifest_paths` below, each with a manifest naming the literal string
    EXP-DIFFP-4b165f, the eight declared seeds, a code_path_fingerprint and an
    armed deadline, each content-bound at 35 of 35 file digests through
    run-index.json, which is itself bound by `path_sha256` in the committed
    snapshot receipt. THIS IS THE ONE STRUCTURAL THING THIS ROUND HAS THAT ROUND 1
    DID NOT, and it is why this record carries `replicated` where EV-DIFFP-b878aa
    carried `preliminary`.
    THEY DO NOT REGISTER: tools/validate_ledger.py discovers runs from exactly one
    glob and the producer wrote its run directories somewhere that glob does not
    reach, so a bare id in this field resolves to nothing and is reported as a
    citation of an unknown run. THE MEASUREMENT, THE MECHANISM AND WHOSE DEFECT IT
    IS ARE RECORDED IN FULL under `run_registration_status`.
    WHY THE FIELD IS EMPTY RATHER THAN CARRYING THE FIVE IDS: this field's
    operative meaning in this repository is "run ids that resolve in the run
    registry", and there are none. Leaving five unresolvable ids here would state
    something false about the registry while ALSO breaking the ledger; leaving it
    empty with the runs cited by PATH states something true and cites them in a
    form that is STRICTLY MORE CHECKABLE THAN A BARE ID -- a reader can open a
    path and hash it, and cannot do anything at all with an id nothing resolves.
    NOTHING IS DROPPED TO QUIET A VALIDATOR: every run is cited, by path, with its
    digest binding named, and the defect that forced the form is recorded as a
    first-class finding rather than absorbed.

