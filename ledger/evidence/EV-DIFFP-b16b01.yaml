  composed_joint_disposition:
    composition_rule_honoured: >-
      A BLINDED REVIEWER'S VERDICT COVERS ONLY THE JOINTS IT OWNS. Neither reviewer
      composed a whole-claim verdict and neither was asked to; each scalar
      `verdict` is a lossy rollup required by
      tools/check_review_independence.py's one-verdict-per-reviewer schema, and both
      reviewers said so in their own words. THIS COMPOSITION USES THE PER-JOINT MAPS
      AND NEVER THE SCALARS. In particular `passed` and `breaks` are not weighed
      against each other: the two reviewers were asked different questions and their
      answers do not conflict.
