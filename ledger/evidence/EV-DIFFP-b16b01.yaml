  per_component_power_profile:
    reporting_rule: >-
      IR-10. NEVER A PASS, NEVER A BARE FRACTION, AND GROUP 1 IS NEVER MERGED INTO
      GROUP 2. Every verdict below is stated with the census completeness it bears
      on: readable 0, quarantined_not_read 1, acquisition_gap 8 -- THREE COUNTS
      THAT ARE NEVER SUMMED -- with the synthetic shadow population of 16 planted
      entries carried separately. With a readable census of zero, a NON-MEMBER
      verdict carries no information about the literature at all, and no verdict
      below is novelty of any kind.
    the_column_this_round_adds: >-
      CONTINGENT means the verdict could have gone the other way for a reason
      internal to the instrument. ENTAILED means it follows from the perturbing
      family's own declaration (O-12). THEOREM means it follows from the key's
      functional-dependency graph (O-11). NOT PROBED means no declared family
      presents an object that could produce a differing verdict, so the verdict
      records that the suite did not look.
    group_1_the_six_declared_replication_rows:
      status: THE REPLICATION OF EV-DIFFP-b878aa O-7. NEVER MERGED WITH GROUP 2.
      rows:
        - row: 1
          drop_set: none, honest
          CTL_PLANT: 96/96
          CTL_NULL_strict_fp_of_3000: 0
          CTL_NULL_D_k0_strict_member: 16/16
          CTL_NULL_D_k_ge_1_strict_member: 0
          OLD_suite: NOT DETECTED
          STRENGTHENED_suite: NOT DETECTED
