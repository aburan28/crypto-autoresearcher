  # ======================================================================
  inference: >-
    COMPOSED AT THE EXACT TESTED SCOPE, AND IT MAY NOT EXCEED EITHER REVIEWER ON
    THE JOINTS THAT REVIEWER OWNS.
    (1) THE PACKAGE IS ARTIFACT-SOUND AND THE ARITHMETIC IS THE CODE'S, NOW UNDER
    RUN DISCIPLINE AND UNDER THREE IMPLEMENTATIONS. Five charged runs and no
    undeclared sixth; eight declared seeds and no ninth; 35 of 35 run-file digests,
    68 of 68 manifest module digests, 13 of 13 CTL-FROZEN files identical before and
    after in all four combinations; 32 of 32 CTL-REPRO agreement in a fresh
    reviewer process. This is a materially stronger integrity result than round 1's
    and it is not diminished by anything below.
    (2) THE ADJUDICATOR IS STILL NOT SHOWN TO BE WRONG, AND ITS TWO-SIDEDNESS IS
    NOW DEMONSTRATED BY CONSTRUCTION. T1 through T5 met on both sides; two
    degenerate adjudicators built and measured to fail different declared arms.
    (3) THE ROUND'S ONE CONVERGENCE IS REAL AND ITS DEPENDENCE IS DECLARED. Two
    sibling-blind sessions derived md5 2600 of 2600 and sha1 0 of 2600 BEFORE
    reading the producer's numbers, by different routes, and matched exactly. Both
    routes read the SAME committed serialiser, so the convergence is evidence about
    the projection and not about the serialiser.
    (4) AND THE PROFILE THE BATCH WAS BUILT TO PRODUCE IS ALMOST ENTIRELY NOT ABOUT
    THE INSTRUMENT. Of six depth-1 rows: one verdict is CONTINGENT on the
    instrument and the OLD suite already had it; two are ENTAILED by the perturbing
    family's own declaration; one is a THEOREM about the key's dependency graph; and
    three record that no declared family looked. The strengthening added ZERO
    contingent rows.
    (5) FIVE KNOWN-FALSE INSTRUMENTS PASS EVERY ARM THE DETECTION RULE READS, ONE
    OF THEM MEASURABLY BLIND TO THE MESSAGE DIFFERENCE ON HALF THE CENSUS, AND
    THREE OF THE SIX KEY COMPONENTS CAN BE DELETED SIMULTANEOUSLY WITHOUT THE SUITE
    NOTICING. The survival localises to ONE LINE: the detection rule reads the
    family-(d) primary arm only, so the package's own isolating sub-arm bounds
    nothing any verdict depends on.
    (6) THEREFORE, AND THIS IS THE HONEST REPLACEMENT FOR BOTH 0/3000 AND FOR
    "2 OF 5 ABLATIONS DETECTED": THE PER-COMPONENT PROFILE OF AN EXACT-KEY
    ADJUDICATOR MEASURES, IN ORDER, THE PERTURBING FAMILIES' CONSTRUCTION, THE KEY'S
    FUNCTIONAL-DEPENDENCY GRAPH, AND ONLY THEN THE INSTRUMENT. Round 1 replaced a
    pass with a fraction; this round shows the fraction is very largely a property
    of the ablation lattice and the families, and names what would have to be
    measured to make it a property of the instrument.
    (7) NOTHING HERE IS A STATEMENT ABOUT MD5 OR SHA-1. No search was run, no
    collision attempted, no complexity figure stated, no path claimed new, no
    cryptanalytic improvement of any kind claimed, no source acquired, and a
    passing control is not an improvement. The MD5 lane is BLOCKED, NOT CLOSED.

