        with in_linearized_code drop-set, and 0 of 5200 for the other four rows.
      the_counterfactual_integers: >-
        Under the OUTSIDE order the row-2 count would be 2568 rather than 2600 and
        row 5's would be 5168 rather than 5200.
      why_this_is_a_limitation_and_not_a_break: >-
        THE INSIDE ORDER IS THE CONTRACT'S DECLARED VALUE AND IS THE ORDER THE
        PRODUCER USED FOR EVERY REPORTED COUNT, SO NO REPORTED INTEGER IS WRONG.
        What is incomplete is the CHECK: a reader is told "0 differ" about a set on
        which a difference was impossible.
      mechanism_localised: >-
        The 32 divergent draws are EXACTLY the 32 draws attributed to step_delta
        although step_delta was held fixed. The two sets were computed and are
        identical at 32, all MD5. Same cause: the E3 action negates the message
        difference and step_delta together and the serialiser orders the message
        difference first, so dropping it moves which orbit variant attains the
        minimum. Tested directly rather than accepted: for all 32 of 32 the orbit
        variant attaining the minimum differs from the source entry's, and for none
        of the other 2568 does it.
      source: run 4 raw-result.json; validation-report J2 and J4
      verdict_effect: >-
        None on any reported integer. A named coverage gap in a contract-required
        check.

    - id: O-18
      what: >-
        ONE FIELD IS OVERSTATED AS LITERALLY WORDED, AND IT IS A DEFECT IN A
        DESCRIPTION RATHER THAN IN A MEASUREMENT. `isolating_draw_per_component`
        for step_delta reads that NO declared family produces a draw differing from
        a census entry in this component alone. MEASURED FALSE AS WORDED: the six
        family-(a) strict false positives on the step_delta-dropped row each differ
        from their MATCHED census entry in exactly step_delta -- NULL-MD5-9983c910
        against PLANT-MD5-05, NULL-MD5-1dc9644d against PLANT-MD5-06,
        NULL-MD5-8ee15c5c against PLANT-MD5-05, NULL-MD5-12dbedf2 against
        PLANT-MD5-06, NULL-MD5-12c43f2e against PLANT-MD5-02 and NULL-MD5-c0053ca8
        against PLANT-MD5-01. Six isolating draws exist.
      why_the_field_says_no: >-
        The committed `isolating_components` computes the field ONLY from the
        family-(d) and D-SHA1-INCODE attribution distributions, and its docstring
        declares the narrower notion it means: a draw differing from ITS OWN SOURCE
        census entry. The reasoning is coherent; THE EMITTED SENTENCE DROPS THE
        WORD "OWN" AND QUANTIFIES OVER "A CENSUS ENTRY" AND "NO DECLARED FAMILY",
        which is strictly stronger than what was computed.
      severity: >-
        IT CHANGES NO VERDICT AND NO INTEGER. Row 3 and the group-2 step_delta row
        are already DETECTED from those very six draws. The damage is that a reader
        is shown DETECTED beside an isolation claim of NO, which is internally
        incoherent and, on the contract's own definition of detection, states the
        opposite of what happened.
      source: validation-report J7 `THE_ONE_OVERSTATED_FIELD_I_FOUND`
      verdict_effect: >-
        None. A correction target whose required contents are specified in
        DEC-20260824-c5bb72 `corrections_owed`.

    - id: O-19
      what: >-
        THE k SWEEP IS NOT A DIFFICULTY SWEEP AND MUST NEVER BE CITED AS ONE. The
        parameter meant to modulate the signal does not modulate it: row 2's MD5
        member count is 520 of 520 at each of k = 1, 2, 4, 8 AND 16, and its SHA-1
        count is 0 of 520 at every one of them; the surviving instruments' sweeps
        are flat in k as well.
      why_it_is_flat_and_why_that_is_not_an_artifact_of_the_instrument: >-
        The membership test is EXACT EQUALITY ON A TUPLE, so the outcome is decided
        by WHICH key components moved and never by HOW MUCH they moved: a one-bit
        and a sixteen-bit perturbation are the same event. Under
        docs/inventor-protocol.md section 3 a quantity that fails to decay when the
        parameter meant to destroy it increases is the canonical artifact tell; here
        the tell is present AND its cause is understood and benign. The five k
        values buy 5200 draws that are, FOR THE PURPOSE OF THE DETECTED VERDICT, 16
        draws repeated. The sweep remains a genuine robustness check on the
        attribution and on the seeded position sampling.
      the_credit_recorded_with_it: >-
        NOTHING IN THE PACKAGE CITES THE SWEEP AS EVIDENCE THAT REJECTION IS ROBUST
        TO PERTURBATION SIZE, and the Red Team says so against its own objection.
      source: run 3 and run 4 per-cell counts; red-team-report J12 `the_null_object_control_the_protocol_demands`
      verdict_effect: >-
        Bounds how the 5200-draw figure may be quoted anywhere in this program.

    - id: O-20
      what: >-
        THE DECLARED IMPLEMENTATION CHOICE DOES NOT CHANGE THE VERDICT AND
        COMPLETELY DETERMINES THE ATTRIBUTION. Running the identical primary arm
        with `in_linearized_code` HELD FIXED instead of honestly recomputed, and
        everything else byte-identical: SHA-1 k >= 1 gives 2600 draws and 0 strict
        MEMBER either way, while the attribution moves from `in_linearized_code`
        together with `message_difference` on 2600 of 2600 to `message_difference`
        ALONE on 2600 of 2600.
      the_ruling_that_does_not_round_either_half_away: >-
        THE PRODUCER'S CHOICE TO RECOMPUTE IS THE CORRECT ONE and is not asked to be
        reversed -- holding a derived predicate stale would make the object
        internally inconsistent, which is round 1's malformed-object failure. BUT
        the package's own evidence that a control has power over the component it
        perturbs IS the attribution distribution, and `isolating_components` READS
        that distribution. So a declared implementation choice, correctly made, is
        what decides whether the SHA-1 primary arm reads as isolating the message
        difference. THE ATTRIBUTION MEASURES THE CHOICE AT LEAST AS MUCH AS THE
        INSTRUMENT.
      source: red-team-report J11 `the_PD_4_counterfactual`
      verdict_effect: >-
        Requires the attribution table to be read with its implementation
        dependence stated beside it, everywhere it is cited.

    - id: O-21
      what: >-
        THE MD5 LANE IS DESCRIBED AS BLOCKED AND NOT CLOSED EVERYWHERE IT APPEARS,
        AND AN ADVERSARY LOOKING FOR PREMATURE CLOSURE FOUND NO SENTENCE THAT
        CLOSES MORE THAN ITS MEASUREMENT SUPPORTS. TASK-20260824-e9d21a went after
        every closure candidate by name -- the MD5 lane, the not-probed components,
        depth two and the second seed set, null family (e), and the headline's own
        scope -- and reports NONE FOUND, having looked at the headline, both power
        tables, the limitations, the compliance checklist, the closing statement
        and the contract's interpretation limits and open directions.
      the_two_narrow_objections_recorded_rather_than_absorbed: >-
        (1) The rendered group-2 table drops the contract's own not-probed column
        into a prose block below the table, so in the rendered table a NOT DETECTED
        that means "the suite did not look" and a DETECTED that came from a
        different mechanism sit in the same column with the same vocabulary. Fully
        mitigated for a reader who reads the next block.
        (2) The stated reason for not building null family (e) is sound and is not
        disputed, and a SECOND and stronger reason is now available and is recorded
        nowhere: family (e) as described -- a planted SHA-1 entry with the flag
        flipped and everything else held fixed -- CONSTRUCTS AN OBJECT WHOSE
        REDUNDANT FIELDS CONTRADICT EACH OTHER, because the flag is a deterministic
        function of the disturbance vector being held fixed (O-11). Executed as
        written it would detect row 4 with a malformed object and the detection
        would mean nothing. THE DIRECTION IS NOT CLOSED; ITS REVISIT CONDITION IS
        AMENDED TO REQUIRE A WELL-FORMEDNESS GATE, which is the already-open OBJ-10.
      source: red-team-report J10
      verdict_effect: >-
        A genuine finding about a package that had many opportunities to close
        something and did not, stated as such rather than as an absence of effort.

