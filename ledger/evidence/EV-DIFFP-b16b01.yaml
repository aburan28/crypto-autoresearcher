  run_registration_status:
    status: >-
      THE FIVE RUNS ARE COMPLETE AND CONTENT-BOUND AND ARE NOT DISCOVERABLE BY THE
      LEDGER VALIDATOR. This is an INFRASTRUCTURE AND CONVENTION DEFECT, never a
      defect in the runs, in the measurements, or in the Executor's conduct
      (AGENTS.md rule 5 read in its symmetric direction: an infrastructure failure
      is not negative evidence, and neither is it evidence about the producer).
    measured_by_the_driving_session: >-
      tools/validate_ledger.py reported five errors of the form "evidence
      references unknown run", one per id, on an earlier draft of this record that
      carried the ids in `run_ids`. Nothing else in the repository failed. The
      driving session further measured that 281 experiment directories carry
      `experiments/<EXP-ID>/runs/`, which is the established convention by an
      overwhelming margin, and that `experiments/EXP-DIFFP-4b165f/` contains only
      `specification.yaml`. THOSE ARE THAT SESSION'S MEASUREMENTS AND ARE NOT
      RESTATED HERE AS THIS SESSION'S.
    mechanism_verified_from_committed_source_by_this_session: >-
      READ RATHER THAN ACCEPTED, BECAUSE A TRANSMITTED DIAGNOSIS IS A POINTER.
      tools/validate_ledger.py registers runs from exactly one glob,
      `experiments/*/runs/*/manifest.yaml`, and evaluates evidence `run_ids`
      against the ids that glob registered plus `ctx.legacy_aliases`. The
      producer's five run directories sit under
      `coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7/tasks/TASK-20260824-9a489e/runs/`,
      which the glob does not reach, so every citation resolves to nothing. The
      diagnosis is confirmed.
    no_field_shape_would_have_resolved_them_and_this_was_checked_not_assumed: >-
      THREE CANDIDATE MECHANISMS EXIST IN THE VALIDATOR AND NONE APPLIES.
      (a) `ctx.legacy_aliases` is fed only by hash-pinned PRE-SCHEMA manifests
      listed in tools/legacy_run_inventory.yaml, by legacy JSON manifests in that
      same inventory, and by schema supersessions carrying a redirect or
      replacement id. Registering runs executed on 2026-08-24 as "legacy" would be
      a false statement inside a frozen registry whose entire value is that it
      lists artifacts predating the schema.
      (b) tools/run_supersession_registry.yaml is the exact opposite of what is
      needed: it requires the SUPERSEDED path to match the run glob and FORBIDS the
      superseding path from matching it.
      (c) The validator's own disclosed debt block records "69 evidence and
      decision records citing runs or experiments that do not register in this
      repository". That is a PRUNE-ONLY BASELINE OF ACCEPTED HISTORICAL
      VIOLATIONS, not a mechanism a new record may join.
      SO THE CHOICE WAS BETWEEN AN UNRESOLVABLE CITATION AND A RESOLVABLE ONE, AND
      THIS RECORD TAKES THE RESOLVABLE ONE.
    whose_defect_it_is: >-
      NOT THE EXECUTOR'S. Neither EXP-DIFFP-4b165f nor the producer's task card
      names a location for run directories, and the producer followed BATCH-f8bf86's
      precedent. THE CONTRACT OMISSION IS THIS COORDINATOR ROLE'S, and the
      discovery gap is the harness's: there is a single hard-coded run-discovery
      root and NO CHECK that a producer wrote its runs where an evidence record
      will later cite them.
    why_it_surfaced_only_now_which_is_the_uncomfortable_part: >-
      BECAUSE BATCH 2 DID THE MORE RIGOROUS THING AND CITED ITS RUNS. BATCH-f8bf86's
      six charged runs sit under the same off-convention prefix and would have
      failed identically had they been cited; EV-DIFFP-b878aa carries `run_ids: []`
      and so never tested the property. THE EARLIER RECORD VALIDATED CLEANLY IN
      PART BECAUSE IT CITED LESS. That is recorded here rather than left implicit,
      and it is corrected against EV-DIFFP-b878aa by a separate correction record
      named in DEC-20260824-c5bb72 `corrections_owed`.
    it_is_the_same_shape_as_the_parse_gap_this_round_already_found: >-
      A CHECK THAT EXISTS BUT DOES NOT COVER WHERE THE WORK ACTUALLY LANDS. CI
      parse-gates `ledger/**` and not `coordination/**`, so every review plan and
      reviewer report in this program is unparse-gated; the run glob covers
      `experiments/**` and not `coordination/**`, so every run this campaign has
      executed is undiscoverable. A producer can complete, be archived, be reviewed
      by two independent sessions and pass a content-first snapshot, and the
      mismatch appears only when an evidence record finally cites a run id.
    what_is_NOT_done_here_and_why: >-
      THE RUNS ARE NOT MOVED AND NOT COPIED BY THIS ARCHIVE. Moving them would
      break the committed snapshot receipt's `path_sha256` binding permanently and
      would invalidate run-index.json's keys, which are relative to the task
      directory -- the immutable-commit failure AGENTS.md rule 15 describes, in its
      path form. Copying them into `experiments/EXP-DIFFP-4b165f/runs/` is the
      right repair and is OUTSIDE THIS TASK'S FOUR DECLARED artifact_paths, so
      doing it here would be a scope-expanding commit. It is ranked, specified and
      assigned in DEC-20260824-c5bb72 `next_action_ranking` and `successor_gates`.

  type: empirical
  direction: weakens
  direction_scope: >-
    WEAKENS EXACTLY ONE PROPOSITION, AND IT IS NOT THE ONE BATCH 1 WEAKENED:
    that AN ABLATION BATTERY OVER THE SERIALISED MEMBERSHIP KEY MEASURES THE
    CONTROL SUITE'S POWER PER COMPONENT. That proposition is the `resource_check`
    reading EV-DIFFP-b878aa recorded as the most useful thing in that record, it
    is what DEC-20260824-af6d5c ranked first, and it is what this batch was built
    to execute. Measured here: of the six depth-1 rows, ONE has a verdict
    contingent on the instrument rather than entailed by a family's perturbation
    declaration or by the key's functional-dependency graph, and that one row
    (step_delta) was already DETECTED by the OLD suite. Adding CTL-NULL-D changed
    two rows from NOT DETECTED to DETECTED and added ZERO contingent rows.
    WHAT IS NOT WEAKENED, STATED AFFIRMATIVELY SO THE RECORD IS NOT READ WIDER
    THAN IT IS.
    (a) NOTHING ABOUT MD5 OR SHA-1. No statement about either primitive's
    difference space, about any published characteristic, about any cost, or about
    novelty is weakened, strengthened or made, because none was tested.
    (b) NOTHING ABOUT THE PACKAGE'S ARITHMETIC OR ITS ARTIFACT INTEGRITY, WHICH
    ARE INDEPENDENTLY CONFIRMED AND STRENGTHENED BY THIS ROUND. Every integer that
    two independent sessions could compare reproduced exactly. The Red Team's own
    words for its three breaks are "NOT ONE INTEGER BREAKS".
    (c) NOTHING ABOUT THE ADJUDICATOR'S CORRECTNESS. The instrument is not shown
    to be wrong on any object for which a known answer exists; T1 through T5 are
    met on both sides and two degenerate adjudicators fail declared arms by
    construction.
    (d) THE MD5 LANE IS NOT CLOSED. AMD-20260824-DIFFP-ACQ-1 stands unchanged,
    Tier A refused by every route, TIER B BLOCKED PENDING A GOAL-MD5-001 DECISION
    -- BLOCKED, NOT CLOSED, with its named unblocking route intact.

  strength: replicated
  strength_note: >-
    `replicated` IS CARRIED ON THE ARITHMETIC AND THE SPLIT IS STATED RATHER THAN
    COLLAPSED, BECAUSE COLLAPSING IT IS THE DISHONESTY.
    (a) THE ARITHMETIC IS REPLICATED, AND THIS IS THE FIRST RECORD OF THIS GOAL
    THAT MAY SAY SO. Three independent implementations produced the load-bearing
    integers: the producer's five charged runs; TASK-20260824-b61d11's own
    re-implementation of the declared projection over the committed serialiser, in
    a fresh process; and TASK-20260824-e9d21a's own re-implementation of the
    projection, the per-mode index, the ablated canonical form, the membership
    verdict and the suite driver. Every comparable integer agrees exactly. Both
    reviewers wrote their values down BEFORE opening the producer's task
    directory, by different routes -- one by re-implementing the contract's
    projection, one from a GF(2)-linearity argument -- and both matched (O-4).
    (b) THE LOAD-BEARING ADVERSE FINDINGS ARE SINGLE-REVIEWER AS MEASUREMENTS AND
    ARE DERIVATIONS AS ARGUMENTS. The five surviving known-false instruments (O-8),
    O-RT2 (O-9) and the PD-4 counterfactual (O-20) were built once, by one session,
    and no second session re-ran them. What raises them above a single unreplicated
    observation is that each rests on an argument checkable from committed source
    without re-running anything: the flag is by DEFINITION a function of the
    disturbance vector (O-11); the expansion is GF(2)-linear so a weight-at-most-16
    perturbation is never a codeword (O-5); and a family perturbing exactly the set
    S while holding every other key component fixed makes the row deleting S
    identical by construction (O-12). See `proof_status`.
    (c) WHAT `replicated` DOES NOT LICENCE. It does not raise the claim ceiling,
    which is `analyzed` for structural reasons this round cannot touch, and it
    does not make a `reject_scoped` available -- see DEC-20260824-c5bb72
    `decision_label_reasoning`. A tier is a statement about how many independent
    implementations produced a number, never about what the number means.

  claim_tier: toy
  claim_tier_note: >-
    `toy` is the program's smallest descriptive scale label, applied with its
    mapping stated rather than assumed, exactly as EV-DIFFP-b878aa applied it.
    docs/claims-and-verification.md derives the tier mechanically from field bit
    size, which has no meaning for a hash differential adjudicator. THE TESTED
    SCALE THE LABEL STANDS FOR: 16 synthetic planted shadow-census entries (8 MD5,
    every one carrying a weight-1 message difference that no real MD5 collision
    characteristic has, in words 3, 4, 1, 10, 15, 15, 2 and 7; 8 SHA-1, every one
    in the linearized code); ZERO readable census entries; 3000 null draws across
    three declared families; 5216 family-(d) primary-arm draws; 520 D-SHA1-INCODE
    draws; 20864 D-VD3-PROFILE draws; 165 CTL-GEN-ACT objects; 13 CTL-FROZEN
    criterion files; five charged runs. ALL SYNTHETIC, ALL GENERATED FROM EIGHT
    DECLARED SEEDS UNDER THIS PROGRAM'S CONTROL. Nothing at cryptographic scale
    was tested, no published characteristic entered any measurement, and no figure
    here transfers to one.

  certificate_refs: []
  certificate_refs_note: >-
    NONE, AND THAT IS CORRECT RATHER THAN MISSING. No solve, collision, relation
    or conforming-pair claim is made by this record or by the package it reviews.
    EXP-DIFFP-4b165f runs no search over the difference space and none was run.
    A certificate_refs entry here would assert a claim tier this batch does not
    reach.

  proof_status: derivation
  proof_refs:
    - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7/reviews/TASK-20260824-e9d21a/red-team-report.yaml
    - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7/reviews/TASK-20260824-e9d21a/constructions/DERIVATION_BEFORE_READING.md
    - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7/reviews/TASK-20260824-e9d21a/constructions/rt_instruments.py
    - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7/reviews/TASK-20260824-e9d21a/constructions/j8_results.json
    - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7/reviews/TASK-20260824-b61d11/validation-report.yaml
  proof_status_reasoning: >-
    THE STRONGEST CHECKABLE REFUTATION ARTIFACT THIS RESULT ADMITS WAS SOUGHT
    BEFORE THE ADVERSE TRANSITION AND IS ARCHIVED BY THE SAME LEDGER COMMIT THAT
    FILES THIS RECORD (docs/claims-and-verification.md, "Refutation artifacts").
    WHY NOT `certificate`, WHICH IS A CLOSER CALL THAN IT WAS IN ROUND 1. The
    refuting objects here are not merely described: O-E, O-D, O-C, O-C-prime,
    O-C-double-prime, O-A, O-A-prime, O-B, O-RT2, O-RT2-prime and O-RT3 exist as
    executable run-time wrappers in the committed `constructions/` directory with
    their measured outcomes in `j8_results.json`. What is still missing is exactly
    what a certificate requires: no run record binds them, no manifest, no armed
    deadline, no consumed ceiling, no independent re-verifier consumes them, and
    no second session re-executed one. A further packaging defect is recorded
    honestly rather than glossed: those construction files fall outside every
    declared `artifact_paths` set in this batch's queue, so this archive CANNOT
    bind them by `path_sha256` (DEC-20260824-c5bb72 PD-2). Calling them a
    certificate would overstate the packaging on two counts.
    WHY NOT `empirical_only`. The load-bearing adverse findings are checkable
    arguments about THIS instrument, not bare contradictions between a prediction
    and an observation, and each is checkable step by step by an independent
    reader against committed source.
    (i) `in_linearized_code` is DEFINED at harness/diffpath/primitives.py as
    sha1_expand of the first sixteen words compared for equality against the whole
    word list. It is therefore a deterministic FUNCTION of the disturbance vector,
    which is itself the `message_difference` component. A function of a retained
    component carries no information the retained component does not already
    carry, so the row deleting the flag CANNOT be detected while the message
    difference is in the key, and the row deleting the message difference is NOT a
    deletion on SHA-1 because a one-bit image of the deleted component survives
    the projection. Measured beside the derivation: 960 objects, zero exceptions.
    (ii) SHA-1 message expansion is GF(2)-linear, so the flag survives a
    perturbation e if and only if e is itself a codeword; the seed-to-tail map has
    trivial kernel and the code's minimum weight over eighty words is far above
    sixteen, so no weight-at-most-16 perturbation is a codeword. Measured beside
    the derivation: the flag moves on 2600 of 2600 SHA-1 primary-arm draws at
    every k including k = 1.
    (iii) The projection is an order-preserving name filter applied inside the
    orbit minimisation over the SAME variant list for draw and source, so a family
    that perturbs exactly the set S and holds every other key component fixed
    produces two IDENTICAL ablated canonical forms once S is dropped. The DETECTED
    verdict for such a row is therefore entailed by the family's declaration.
    `derivation` is exactly the middle rung and it is the honest one: these are
    checkable arguments about this instrument at these parameters, not
    machine-verified proofs and not general theorems about control suites.

  # ======================================================================
  # THE VALIDITY CHECK, RUN BEFORE ANY INTERPRETATION
  # ======================================================================
  validity_check_before_interpretation:
    performed_by: >-
      TASK-20260824-b3e02b (this record's author) BY READING COMMITTED ARTIFACTS,
      resting on measurements made by TASK-20260824-b61d11 and by the driving
      session, each attributed by name. This session has no shell and measured
      nothing.
    expected_run_count: >-
      FIVE DECLARED, FIVE EXIST, AND NO SIXTH. TASK-20260824-b61d11 measured that
      the tree under the producer's runs/ prefix holds exactly 35 files in exactly
      5 directories; that run-index.json's `run_files_sha256` has exactly 35 keys;
      that the key set and the tree set are EQUAL, with no key without a file and
      no file without a key; and that the five `run_dir` values are those five
      directories. All 35 digests recomputed at 35 of 35 matching.
    manifest_schema_completeness: >-
      CONFIRMED BY TASK-20260824-b61d11, NOT BY THIS SESSION. Each of the five
      manifests carries the LITERAL string EXP-DIFFP-4b165f at both
      `run.experiment_id` and `run.inputs.parameters.experiment_id` (IR-7), a
      `code_path_fingerprint`, an `armed_deadline_seconds` equal to its contract
      ceiling at 180, 120, 240, 300 and 300, the command, the git commit, the
      dirty-tree state recorded honestly as true with the new module named as
      modified, environment and dependency versions, stdout and stderr, raw
      machine-readable results, validity status and reason, timestamps,
      wrapper-measured wall seconds and peak RSS.
      ONE ARTIFACT-POLICY GAP IS LOCATED RATHER THAN ASSERTED, AND IT IS
      INHERITED. Every manifest's own `inference` block records the wrong policy
      and no probe field, because harness/runner.py defines its inference block
      twice and Python binds the later definition -- a known BATCH-f8bf86 defect
      that IR-2 forbids this batch from repairing. The AGENTS.md artifact-policy
      fields are present and complete in each run's manifest-supplement.yaml. THE
      POLICY IS SATISFIED BY THE PAIR OF FILES AND NOT BY THE MANIFEST ALONE.
    seed_integrity: >-
      CONFIRMED, EIGHT AND NO NINTH. TASK-20260824-b61d11 measured that all five
      manifests carry exactly the eight declared seeds under `run.inputs.seeds`,
      byte-for-byte the frozen contract's, and additionally walked every manifest's
      whole `inputs` subtree for eight-digit integers: the set is exactly
      20260824 together with 84064101 through 84064107, with NO value outside the
      declared eight in any run.
    raw_versus_summary_agreement: >-
      AGREES ON EVERY VALUE COMPARED, AND THE CLASS OF SWEEP THAT CAUGHT ROUND 1's
      TWO DEFECTS WAS NOT RUN THIS ROUND. BOTH HALVES MATTER.
      WHAT WAS DONE: TASK-20260824-b61d11 independently recomputed twenty named
      metrics from the raw construction rather than copying them, and every one
      agrees with the producer's reported value; it further checked that every
      non-empty rejection cell in both result files carries an
      `attribution_distribution`, so no rejection is reported without the
      components that could have decided it.
      WHAT WAS NOT DONE, NAMED SO IT IS NOT MISTAKEN FOR COVERAGE: no mechanical
      field-by-field comparison of execution-report.yaml against the five JSON
      artifacts was performed by any session this round, and none was transmitted.
      Round 1's VD-1 and VD-2 were found by exactly such a sweep of 89 fields. Its
      absence here is a gap in this round's checking, not a defect in the package.
      WHAT THE PARTIAL CHECK DID FIND, TWO DESCRIPTION DEFECTS AND NO WRONG VALUE:
      the overstated `isolating_draw_per_component` string for step_delta (O-18),
      and run-index.json's per-run metrics block carrying per-primitive AGGREGATES
      under names that read per-object, where the conversion is division by eight
      (O-13). Neither changes an integer or a verdict.
    ctl_frozen_before_and_after_digest_identity: >-
      13 OF 13 IDENTICAL, 0 CHANGED, INDEPENDENTLY RECOMPUTED IN BOTH DIRECTIONS
      AGAINST BOTH THE WORKING TREE AND THE SNAPSHOT COMMIT
      1cad915c9f013b5f680cc6e1417259720eab3b39, in all four combinations, by
      TASK-20260824-b61d11. The 68 module digests pinned across the five manifests'
      `code.source.files` recompute at 68 of 68. The contract's single new module
      is byte-identical before the first run and after the last at sha256
      953398c4bc92fc1075817987976e9c9582c2756f13eff3f68a357d87355646b7, equal to
      the value pinned in all five manifests, in both CTL-FROZEN digest sets and in
      the snapshot archive's binding set -- which discharges the AN-1 concurrent-
      commit risk BY MEASUREMENT: a reviewer's cold re-run is against the same bytes
      the runs executed. The criterion-set scoping is a separate question and is
      adjudicated at O-16.
    control_comparability: >-
      CONFIRMED FOR THE ABLATION ROWS AND REFUTED FOR THE DETECTION RULE'S ARM
      COVERAGE, WHICH ARE DIFFERENT QUESTIONS AND ARE KEPT APART.
      COMPARABLE: TASK-20260824-b61d11 verified from source that every row uses the
      same committed Adjudicator class, the same committed census, the same
      generator sets, the same committed `canonical` variant list, the same
      committed null draws from the same seeds and one shared family-(d) draw plan,
      with `drop_set` the ONLY thing that varies. The projection is a pure
      order-preserving name filter and is applied INSIDE the minimisation on every
      index build and every lookup. A 22880-call self-check asserting that the
      mirrored variant list reproduces the committed canonical form reports 0
      mismatches, and an independent re-derivation reproduced every group-1 count.
      NOT COMPARABLE ACROSS ARMS, AND THIS IS A SCOPE DEFECT IN THE DETECTION RULE
      RATHER THAN A VALIDITY DEFECT IN THE RUNS: the battery's DETECTED verdict
      reads the family-(d) PRIMARY arm only, so the two sub-arms are outside every
      row's comparison. One exclusion is contract-required; the other is not, is
      where the only SHA-1 isolation lives, and is where a known-false instrument
      survives. See O-7.
    ruling: >-
      THE RUN SET IS VALID AND IS EVIDENCE, AND IT IS NOT RETURNED TO THE EXECUTOR.
      All five runs are completed_valid against the five-run plan of the frozen
      contract; nothing failed, nothing timed out, nothing crashed, no seed is
      outside the declared eight, no run directory is undeclared, no committed file
      under harness/ was modified, and no measurement basis is in doubt. The two
      description defects are in emitted strings and labels whose underlying
      computations are correct and committed. THIS RECORD THEREFORE INTERPRETS THE
      RUN SET, and the interpretation is about WHAT THE INSTRUMENT'S PROFILE
