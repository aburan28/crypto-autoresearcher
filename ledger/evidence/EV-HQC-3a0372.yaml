  run_ids: []
  run_ids_note: 'NO experiments/ RUN RECORD EXISTS, and none is claimed, per this campaign''s established
    convention (EV-HQC-bfb257, EV-HQC-dd85c1): coordination-task artifacts are cited by path and hash.
    Unlike EV-HQC-dd85c1 (a pure analysis deliverable with no invocation of the sampler), TASK-20260809-a79e4f
    DID invoke the real pipeline twice (matched_pair.py --stage 1, --stage 2), generating 10,000 + 20,000
    fresh-and-reconstructed trials against stage_a.py''s real decode_blocks. The two invocations are
    recorded in coordination/goals/GOAL-HQC-001/batches/BATCH-412513/tasks/TASK-20260809-a79e4f/run_manifest.yaml
    (command, git state, seeds, timings) rather than as a separate experiments/ RUN-* record.'
  type: empirical
  type_note: 'Genuinely empirical, distinct from EV-HQC-dd85c1''s "theoretical" typing. Stage 1 re-decoded
    the pilot''s own already-committed shards 5000/6000 through the OPPOSITE decode variant (zero new
    entropy, but a NEW measurement never previously computed); stage 2 drew 20,000 fresh trials on shards
    8000-8003. Both stages ran the real, unmodified stage_a.py generation primitives and decode_blocks,
    sha256-pinned.'
  direction: neutral
  strength: inconclusive
  strength_note: '"inconclusive" describes the CAMPAIGN-LEVEL question this batch was dispatched to
    advance (does the V3 defect propagate to a detectable joint-moment effect at k=m=17, and is the
    campaign''s required-T derivation trustworthy) -- not the workmanship, which is unusually strong.
    Two components are individually FIRM, independently reproduced exactly by both reviewers, and are
    recorded as such: (a) the mechanical/statistical facts of O2-O6 below (determinism, pairing genuineness,
    diff/SE/z at every checked cell, the SE-vs-T exponent), each reproduced to full float precision by an
    independently-written driver, and by the Red Team additionally via a full re-execution of the actual
    committed script on a THIRD machine/OS/Python/numpy combination; and (b) the SE-ratio replication
    itself (O5), now measured four independent ways and consistent in magnitude and direction with the
    single prior source. What remains undiscriminated is the substantive campaign question: Branch A
    (detection) did not fire (|z|=1.298 < 1.96 at the pre-registered primary evaluation), so neither "the
    propagated effect is genuinely near zero" nor "it is real at the ~0.10-0.12 magnitude the two most
    recent, least-noisy matched-pair measurements now agree on" is excluded. Firm components of a
    measurement do not raise the strength of an undiscriminated substantive conclusion -- the same
    distinction EV-HQC-dd85c1''s strength_note draws, applied here to a real run rather than an analysis.'
  claim_tier: toy
  claim_tier_note: 'TOY, HARD CEILING, unchanged from EV-HQC-67a6ec, EV-HQC-dd85c1 and RQ-HQC-001. PS-R3
    reduced parameters (n=7187, n_e=56, n_2=128, dup=1, omega=45, omega_r=omega_e=51, N=7168, m=17),
    one defect class (V3, last-block-window-read-early), one injection point (decode_blocks block n_e-1),
    matched-pair design, T=10,000 (stage 1) and T=20,000 (stage 2). NOTHING HERE IS A STATEMENT ABOUT
    HQC''s IND-CCA security, its decoding-failure rate, assumption A17 or A5, or any standardized parameter
    set.'
  certificate_refs: []
  certificate_refs_note: 'No discrete-log-solve, relation, or factor-base claim is made or implied.
    run_manifest.yaml states certificate.kind = none: this is a joint-moment estimator measurement on a
    toy-scale reduced parameter set, not a solve. certificate_refs is correctly empty rather than omitted.'
  proof_status: empirical_only
  proof_status_note: 'empirical_only, not derivation and not certificate. Every load-bearing number in
    this record (diff, paired SE, unpaired SE, z, the paired/unpaired ratio, the fitted SE-vs-T exponent)
    is a measurement from an actual pipeline invocation, independently reproduced by two reviewers via
    two different methods (from-scratch reimplementation with a different chunk size; full re-execution
    of the actual committed script on a third environment). No counterexample certificate is applicable
    to a measurement of this kind; the strongest checkable refutation artifact this result admits is
    exactly what it received -- independent bit/float-exact reproduction of the raw numbers plus a
    disclosed, pre-registered decision rule applied against them (see inference below), per
    docs/claims-and-verification.md''s "Refutation artifacts" guidance for empirical-only claims.'
  proof_refs:
  - coordination/goals/GOAL-HQC-001/batches/BATCH-412513/tasks/TASK-20260809-a79e4f/design.md
  - coordination/goals/GOAL-HQC-001/batches/BATCH-412513/tasks/TASK-20260809-a79e4f/matched_pair.py
  - coordination/goals/GOAL-HQC-001/batches/BATCH-412513/tasks/TASK-20260809-a79e4f/matched_pair_results.json
  - coordination/goals/GOAL-HQC-001/batches/BATCH-412513/tasks/TASK-20260809-a79e4f/matched_pair_report.md
  - coordination/goals/GOAL-HQC-001/batches/BATCH-412513/tasks/TASK-20260809-a79e4f/run_manifest.yaml
  - coordination/goals/GOAL-HQC-001/batches/BATCH-412513/reviews/TASK-20260809-603dc5/validation_report.yaml
  - coordination/goals/GOAL-HQC-001/batches/BATCH-412513/reviews/TASK-20260809-47a5ec/red_team_report.md
  - ledger/decisions/DEC-20260809-46e85c.yaml
  observations:
  - 'O1. WHAT RAN, UNDER WHAT AUTHORIZATION. DEC-20260809-46e85c authorized exactly one two-stage
    executor task, TASK-20260809-a79e4f. Stage 1 re-decoded the pilot''s already-committed shards 5000
    and 6000 (TASK-20260806-77a574) through the OPPOSITE decode variant from the pilot''s own run, with
    zero new entropy, reconstructing 10,000 genuine matched pairs on the pilot''s own draws. Stage 2 ran
    a fresh matched-pair arm on shards 8000-8003 (4 of 12 pre-declared shards), at a trial count fixed by
    a pre-registered clamp formula applied to stage 1''s own measured pooled SE. Both stages used the
    real, unmodified stage_a.py generation primitives and decode_blocks, and measure.py''s comb_matrix /
    log2_A_from_hists, sha256-pinned read-only import throughout (matched_pair_report.md sections 1, 3).'
  - 'O2. THE DETERMINISM GATE PASSED, AND IS NOW CONFIRMED ACROSS THREE INDEPENDENT ENVIRONMENTS. The
    executor''s re-derived shard-5000-defected and shard-6000-undefected whole-arm S_histogram arrays are
    bit-identical to pilot_results.json''s committed arrays (run_manifest.yaml fail_closed_checks). The
    Validator independently reproduced this from scratch on the same macOS/Python-3.13.1/numpy-2.4.0
    platform as the executor (validation_report.yaml independent_reproduction). The Red Team independently
    RE-EXECUTED the actual committed matched_pair.py end-to-end on a THIRD machine/OS/Python/numpy
    combination and found every statistical quantity -- including both crossed arms, which the bit-identity
    gate alone does not directly check -- matched the committed record exactly, and additionally proved
    by code inspection that decode_blocks and the V3 wrapper cannot mutate the shared generated bit array
    between the two decode calls on a given shard, so the crossed (matched-pair) arm is provably
    co-generated with the gate-checked arm, not merely assumed to be (red_team_report.md sections 0-1).'
  - 'O3. STAGE 1 (T=10,000 pooled, zero new entropy) AT THE PRIMARY CELL k=m=17: shard 5000 diff=+0.10178,
    paired SE=0.12511, unpaired SE=0.36306, ratio=2.902, z=0.814; shard 6000 diff=+0.01082, paired
    SE=0.14990, unpaired SE=0.48327, ratio=3.224, z=0.072; pooled diff=+0.05157, paired SE=0.09662,
    unpaired SE=0.30114, ratio=3.117, z=0.534. Recomputed exactly (to <1e-9) by the Validator from its own
    from-scratch driver and by the Red Team via full re-execution and a from-scratch reimplementation not
    calling the executor''s own jackknife function (matched_pair_report.md 2.1, validation_report.yaml
    metric_recomputations, red_team_report.md section 0 Check B). As pre-stated by DEC-20260809-46e85c
    before the run, stage 1''s pooled minimum detectable effect (~0.275 at z=1.96) exceeds both prior
    point estimates, so this stage was calibration and replication, not the primary test, and its z=0.534
    does not reach significance, consistent with that pre-stated expectation.'
  - 'O4. STAGE 2 (T=20,000, fresh shards 8000-8003) AT THE PRIMARY CELL, THE PRE-REGISTERED PRIMARY
    EVALUATION: diff=+0.11479, paired SE=0.08841, unpaired SE=0.33320, ratio=3.769, z=1.298 (paired), z=0.345
    (unpaired). Recomputed exactly by both reviewers, including by the Red Team from raw per-trial data it
    REGENERATED from scratch (the executor did not persist stage-2 raw arrays; both reviewers independently
    regenerated shards 8000-8003 and matched the reported statistics exactly). T2 landed at the
    pre-registered CLAMP FLOOR (20,000), not the ~3.9e4 that design.md''s own "why this size" narrative was
    written against, because stage 1''s measured pooled SE (0.0966) came in below the value (~0.140) the
    narrative implicitly assumed -- an arithmetically correct substitution from a pre-registered formula,
    independently confirmed structurally incapable of using stage-2 data (T2 is written to disk after
    stage 1 and read back unchanged), but one both reviewers flag as changing what stage 2 could actually
    achieve relative to its own design rationale (validation_report.yaml metric_recomputations;
    red_team_report.md section 3.2).'
  - 'O5. THE SE-RATIO REPLICATION TEST NAMED BY DEC-20260809-46E85C''S KNOWLEDGE_PROMOTION RELEASE
    CONDITION IS SATISFIED ON THE "CONSISTENT" BRANCH. Four independently-measured paired/unpaired SE
    ratios at k=17 now exist in the committed record: 2.902 (shard 5000, T=5,000), 3.224 (shard 6000,
    T=5,000), 3.117 (stage-1 pooled, T=10,000), 3.769 (stage-2 pooled, T=20,000) -- against the BATCH-2ecaa1
    Red Team''s single-source, single-shard, uncommitted-script figure of 2.78x (EV-HQC-dd85c1 O8). All
    four land within the same order of magnitude and the same direction as 2.78x, and are independently
    re-verified exactly by both reviewers (validation_report.yaml limitations final entry;
    red_team_report.md section 4). This is a genuine, non-exact-digit replication -- an exact decimal
    match would itself be suspicious for a ratio of two quantities each carrying its own sampling variance
    -- and it is the FIRST replication of this figure by an executor other than the original probe''s
    author. See knowledge_promotion below.'
  - 'O6. THE SE-VERSUS-TRIAL-COUNT EXPONENT, INDEPENDENTLY REPRODUCED EXACTLY, FALLS OUTSIDE THE
    PRE-REGISTERED [0.4, 0.6] BAND. Fitted by OLS on log(SE_paired@k=17) vs log(T) across the three
    available points (T=5,000 mean-of-shards -> SE=0.1375; T=10,000 pooled -> SE=0.0966; T=20,000 pooled
    -> SE=0.0884): exponent = 0.3186 (executor), 0.31862351594872185 (Validator, computed from its own
    independently-regenerated SE values, not read from the executor''s output), and independently
    re-confirmed by the Red Team''s full re-execution (matched_pair_report.md 2.3; validation_report.yaml
    metric_recomputations; red_team_report.md section 3.1). Both reviewers state this is a real,
    correctly-computed anomaly, not an arithmetic or reporting error.'
  - 'O7. PER THE PRE-REGISTERED BRANCH RULE''S OWN STATED ORDER, BRANCHES D AND E ARE CHECKED FIRST AND
    NEITHER FIRES. Branch D (invalid/infrastructure): the determinism gate passed, D2/D3 report 0
    violations across both stages (10,000 + 20,000 trials x 2 decode variants each), stage 2 achieved its
    full planned T2 with no truncation, and no budget overrun occurred (10.295 of 400 authorized
    core-seconds) -- independently reproduced by both reviewers. Branch E (stage-1 sign anomaly, both
    shards individually significant and disagreeing in sign): does not fire -- both stage-1 shards are
    positive (z=0.814, z=0.072), neither individually significant.'
  - 'O8. THE RAW STAGE-2 NUMBERS NUMERICALLY SATISFY BRANCH C1''S STATED CONDITIONS, BUT THE
    PRE-REGISTERED EXPONENT-SUPERSESSION CLAUSE FIRES INSTEAD, AND BOTH REVIEWERS FLAG THIS EXPLICITLY.
    At stage 2: |z|=1.2985 < 1.96 (Branch A does not fire); |diff| + 1.96*SE = 0.1148 + 0.1733 = 0.2881
    >= 0.19 (Branch B does not fire); |diff|=0.1148 >= 0.10 with sign positive and consistent with stage
    1''s pooled sign (also positive) -- by the raw arithmetic alone, Branch C1''s stated conditions are
    met. But DEC-20260809-46e85c states, in its SECONDARY pre-registered check, that an SE-vs-T exponent
    outside [0.4, 0.6] SUPERSEDES branches A/B/C, and O6''s exponent (0.3186, independently confirmed by
    both reviewers) is outside that band. The Red Team states this as "the single most important thing
    for the next Coordinator decision to get right": applying C1 without addressing the supersession
    "would misapply the rule it is bound by" (red_team_report.md headline verdict and section 3.1). The
    Validator independently confirms the same numeric facts (validation_report.yaml metric_recomputations,
    control_checks null_object_decay_check).'
  - 'O9. THE EXPONENT FIT RESTS ON FEWER INDEPENDENT DEGREES OF FREEDOM THAN THREE POINTS SUGGESTS, PER
    BOTH REVIEWERS. The T=5,000 point (mean of the two stage-1 per-shard SEs) and the T=10,000 point
    (the pooled SE on the SAME two shards'' concatenated 10,000 trials) are two different aggregations of
    IDENTICAL underlying data, not two independent replications; only the T=T2=20,000 point (stage 2,
    fresh shards) is a genuinely disjoint draw (validation_report.yaml limitations; red_team_report.md
    section 5). Both reviewers state this does not make the supersession trigger spurious -- it fired on
    correctly-computed, pre-registered, independently-reproduced numbers -- but that the specific exponent
    value (0.3186) should be read as a first-look anomaly warranting dedicated characterization, not a
    precisely-estimated scaling law.'
  - 'O10. A NEW CONFOUND CANDIDATE FOR THE SUB-1/SQRT(T) EXPONENT, SURFACED ONLY BY STAGE 2''S FOUR FRESH
    SHARDS: PER-SHARD PAIRED SE AT FIXED T=5,000 VARIES ~14x ACROSS SHARDS. Stage 2''s four shards
    (8000-8003) show individual paired SEs of 0.271, 0.019, 0.019, 0.080 at k=17, with correspondingly
    wide per-shard diffs (+0.306, -0.020, +0.002, +0.074) -- one shard (8000) individually the largest
    contributor to the whole pooled stage-2 effect. Stage 1''s two shards (0.125, 0.150) looked far more
    consistent and would not have exposed this heterogeneity on their own. Named by the Red Team as
    plausible, not yet established, context for the exponent anomaly (red_team_report.md section 2, 5.2),
    independently corroborated by the Validator''s own regenerated per-shard figures.'
  - 'O11. THE CAMPAIGN''S STANDING OBJECTION (NO FIRED CELL FROM A KNOWN-PRESENT REAL-SAMPLER DEFECT,
    ANYWHERE IN THIS CAMPAIGN) IS NOT RETIRED. DEC-20260809-46e85c states this objection is retired only
    if Branch A fires; it did not (|z|=1.298 < 1.96 at the pre-registered primary evaluation). The Red
    Team states this explicitly and independently (red_team_report.md section 6). Five independent
    matched-pair-quality z measurements of this cell now exist in chronological order, all but the first
    positive and rising with T: pilot between-shard z=-0.466 (T=5,000, EV-HQC-dd85c1 O4, an outlier by
    design flaw); Validator between-shard z=+0.613 (T=2,000); original BATCH-2ecaa1 Red Team matched-pair
    probe z=+0.970 (T=5,000, fresh shard); this batch''s stage 1 z=+0.534 (T=10,000, reconstructed); this
    batch''s stage 2 z=+1.298 (T=20,000, fresh shards). This is a legitimate reason to keep investing in
    the design, not evidence the standing objection is answered -- a rising-but-not-yet-significant trend
    at the diluted V3 point is a different question from whether the pipeline has ever rung on a
    known-present, less-diluted defect, which remains untested (no V1 run exists anywhere in this
    campaign''s committed record as of this evidence record).'
  - 'O12. MEASURED SPEND, VERIFIED AGAINST run_manifest.yaml AND INDEPENDENTLY CORROBORATED. Stage 1:
    3.73 core-seconds / 3.337 wall-seconds. Stage 2: 6.565 core-seconds / 6.102 wall-seconds. Total: 10.295
    core-seconds / 9.439 wall-seconds, against 400 core-second / 1,800 wall-second authorization -- an
    order of magnitude under budget, and consistent with DEC-20260809-46e85c''s own 20-40 core-second
    estimate (EV-HQC-dd85c1 O11). The Red Team''s own independent re-execution of the full pipeline
    completed in a comparable ~10.3 core-seconds (red_team_report.md section 0), and the Validator''s
    independent regeneration completed in 8.9 wall-seconds (validation_report.yaml cost_model_checks) --
    both corroborate the reported cost is not understated.'
  - 'O13. BOTH INDEPENDENT REVIEWS RETURNED ADMIT, AT xhigh EFFORT, INDEPENDENT SESSIONS. The Validator
    (TASK-20260809-603dc5, verdict passed / ADMIT) recomputed diff/SE/z at 5 k-values (exceeding the
    "at least three other k" requirement) for BOTH stages from its own from-scratch driver with a
    different batch/chunk size than the executor, matching to full float precision, and additionally
    traced the code to confirm the stage-2 trial count is structurally incapable of using stage-2 data.
    The Red Team (TASK-20260809-47a5ec, verdict ADMIT) went further: it re-executed the ACTUAL committed
    script end-to-end on a third machine/OS/Python/numpy combination distinct from both the pilot''s and
    the executor''s, and separately wrote a from-scratch reimplementation of the jackknife not calling any
    of the executor''s code, matching the committed record to full float precision by both methods; it
    also quantitatively distinguished the correct (histogram-first) pooling method from the biased
    (average-of-nonlinear-point-estimates) alternative (0.051567 vs 0.056301, a ~9% difference) and
    confirmed the executor''s code uses the correct method.'
  inference: 'Applying DEC-20260809-46e85c''s pre-registered decision rule to the numbers in O3-O8, in the
    rule''s own stated order: Branch D and Branch E are checked first and neither fires (O7). The raw
    stage-2 z/diff numerically satisfy Branch C1''s stated conditions (O8), but the pre-registered
    SE-vs-T exponent check (O6), independently reproduced exactly by both reviewers, falls outside the
    declared [0.4, 0.6] band, and the rule''s own text states this SUPERSEDES branches A/B/C. THIS IS
    THEREFORE THE EXPONENT-SUPERSESSION OUTCOME, NOT BRANCH A, B, C1, C2, D, OR E: the derivation''s own
    1/sqrt(T) modeling assumption is refuted on this batch''s own pre-registered test, every required-T
    figure in EV-HQC-dd85c1 O5 is downgraded to resting on a refuted assumption, and no further T-sizing
    decision may be made from that derivation until a dedicated scaling-characterization task establishes
    the true SE-vs-T relationship, ideally with independent (non-nested) samples at each T level and a
    reported confidence interval on the exponent (O9, both reviewers'' recommendation). SEPARATELY AND
    INDEPENDENTLY OF THE EXPONENT FINDING, the SE-ratio replication test that DEC-20260809-46e85c''s
    knowledge_promotion held pending (O5) IS satisfied on its "consistent" branch: this releases the held
    KN-TECH entry stating the replicated power-deficit lesson (see DEC-20260809-186c86 and
    KN-TECH-7dd14f). Branch A did not fire, so the campaign''s standing objection (O11) is not retired.
    THIS RECORD ASSERTS NOTHING ABOUT HQC. It bears on the campaign''s instrument, on the trustworthiness
    of its required-T derivation, and on what to measure next, and on nothing else.'
  boundaries:
  - 'TOY, HARD CEILING. PS-R3 reduced parameters only (n=7187, n_e=56, N=7168, k=m=17), one defect class
    (V3, last-block-window-read-early), one injection point (decode_blocks block n_e-1), matched-pair
    design, T=10,000 (stage 1, zero-new-entropy reconstruction of the pilot''s own shards) and T=20,000
    (stage 2, fresh shards), one estimator, one solver. No statement about HQC''s IND-CCA security, its
    decoding-failure rate, assumption A17 or A5, or any standardized parameter set. No extrapolation to
    standardized parameters is made, and none is licensed.'
  - 'H-HQC-18d1b4 IS UNTOUCHED IN EITHER DIRECTION AND REMAINS PROPOSED. Seven consecutive batches of
    instrument-trust, feasibility, pilot, reanalysis and now matched-pair-measurement work have not moved
    it, and this record does not move it either.'
  - 'THE MEASURED SE-VS-T EXPONENT (0.3186) IS A FIRST-LOOK ANOMALY, NOT A SETTLED SCALING LAW (O9, O10).
    It is independently reproduced exactly and its supersession trigger is not in doubt on the
    pre-registered rule''s own terms, but its precise value carries less independent statistical
    information than three points suggests, and a real candidate confound (per-shard SE heterogeneity,
    O10) has not been ruled out as a contributor.'
  - 'NO POSITIVE CONTROL EXISTS ANYWHERE IN THIS CAMPAIGN''S REAL-SAMPLER DETECTION CHAIN (O11, carried
    forward unchanged from EV-HQC-dd85c1). Neither stage of this task claims a detection, so this does not
    undermine the numbers in this record, but the campaign still cannot distinguish "this chain would fire
    on a real effect" from "this chain has never been shown to fire on anything."'
  - 'NONE OF THE FOUR ASYMPTOTIC-COMPLEXITY PROMOTION GATES IS ENGAGED, ADDRESSED, OR CLAIMED. This
    program advances no asymptotic-complexity claim of its own in this record.'
  - 'This record does not reopen, revise, or supersede EV-HQC-67a6ec, EV-HQC-bfb257, EV-HQC-163374,
    EV-HQC-9a30d3, EV-HQC-db1fd9, EV-HQC-b71230 or EV-HQC-dd85c1, all of which stand exactly as archived.
    It downgrades the STATUS of EV-HQC-dd85c1 O5''s required-T figures (from "modeled, subject to an
    unverified assumption" to "modeled, subject to an assumption now independently tested and found
    outside its declared consistency band"), without altering EV-HQC-dd85c1''s own text.'
  unresolved_confounds:
  - 'PER-SHARD SE HETEROGENEITY AT FIXED T (~14x range across stage 2''s four shards at T=5,000, O10) IS
    A PLAUSIBLE, NOT YET ESTABLISHED, CONTRIBUTOR TO THE SUB-1/SQRT(T) EXPONENT. Neither reviewer tested
    whether it fully accounts for the measured exponent; this is exactly the kind of question the next
    scaling-characterization task should be designed to answer.'
  - 'THE EXPONENT FIT''S STATISTICAL INDEPENDENCE IS WEAKER THAN THREE POINTS SUGGESTS (O9): two of three
    points are non-independent slicings of one 10,000-trial pool. Carried forward as a design requirement
    for the follow-on task (independent, non-nested samples per T level), not as a reason to discount the
    supersession trigger itself.'
  - 'STAGE 2''S REALIZED T2 (20,000, the pre-registered clamp FLOOR) DIVERGED FROM THE ~3.9E4 TRIAL COUNT
    design.md''S OWN "WHY THIS SIZE" NARRATIVE ASSUMED, because stage 1''s measured SE came in below the
    value the narrative implicitly assumed (O4). The Red Team projects that, under the exponent and diff
    actually measured, Branch B (an effect-excluding null) would have been essentially unreachable within
