evidence:
  id: EV-HQC-3a0372
  hypothesis_id: H-HQC-18d1b4
  experiment_ids:
  - EXP-HQC-982268
  run_ids: []
  run_ids_note: 'NO experiments/ RUN-* record exists for this task; per this campaign''s established
    convention (EV-HQC-dd85c1, EV-HQC-bfb257, the BATCH-2ecaa1 Validator report), coordination-task
    artifacts are cited by path and content hash rather than by a RUN-* record. This record covers
    TASK-20260809-a79e4f''s two committed pipeline invocations (--stage 1, --stage 2), each with its
    own git commit/environment/seed record in run_manifest.yaml, and its two independent reviews:
    TASK-20260809-603dc5 (Validator) and TASK-20260809-47a5ec (Red Team).'
  type: empirical
  type_note: 'A GENUINE MEASUREMENT, unlike this campaign''s preceding record (EV-HQC-dd85c1, an
    analysis over already-committed artifacts with no sampler invocation). This task ran stage_a.py''s
    real, unmodified decode_blocks (wrapped, not edited) through 8 arms across two stages -- four
    arms reconstructing matched pairs on the pilot''s own already-committed shards 5000/6000 with
    zero new PRNG consumption, four arms on fresh shards 8001/8002 -- and both the determinism gate
    and the entire dataset were independently regenerated from scratch by the Validator, bit-identical
    on every raw value checked.'
  direction: neutral
  strength: replicated
  strength_note: '"replicated" describes the MEASUREMENT, not the campaign-level question of whether
    the V3 defect propagates to a detectable k=17 effect, which this record leaves exactly as
    undiscriminated as EV-HQC-dd85c1 left it (see inference below). Every reported statistic --
    determinism-gate histograms, all 8 arms'' raw per-trial S, diff/SE_paired/SE_unpaired/ratio/z at
    every evaluable k in 2..26 for both stages, the T2 sizing substitution, and the fitted SE-vs-T
    exponent -- was independently regenerated by the Validator from a separately-written driver
    against the same sha256-pinned stage_a.py/measure.py and matched EXACTLY (bit-identical raw
    arrays, zero floating-point error on every derived statistic). The Red Team independently
    recomputed the branch-relevant statistics (z at k=17 both stages, the exponent, the SE-ratio
    table across shards) from the committed numbers and additionally traced stage_a.py''s own PRNG
    code rather than accepting the design document''s determinism claim on faith. Two independent
    sessions, two independent implementations, one number each time this was checked.'
  claim_tier: toy
  claim_tier_note: 'TOY, HARD CEILING, inherited unchanged from EV-HQC-dd85c1, EV-HQC-67a6ec and
    RQ-HQC-001. PS-R3 reduced parameters (n=7187, n_e=56, n_2=128, dup=1, N=7168,
    m_load_bearing_order=17). One defect class (V3, last-block-window-read-early), one injection
    point (decode_blocks''s block window, block n_e-1). Shards 5000/6000 (stage 1, zero new entropy)
    and 8001/8002 (stage 2, fresh sampling). NOTHING HERE IS A STATEMENT ABOUT HQC''s IND-CCA
    security, its decoding-failure rate, assumption A17 or A5, or any standardized parameter set.'
  certificate_refs: []
  certificate_refs_note: 'No solve, relation, or factor-base claim is made or implied; run_manifest.yaml
    declares certificate.kind = none. This is a joint-moment estimator measurement, not a solve.
    certificate_refs is correctly empty rather than omitted.'
  proof_status: empirical_only
  proof_refs:
  - coordination/goals/GOAL-HQC-001/batches/BATCH-412513/tasks/TASK-20260809-a79e4f/matched_pair_report.md
  - coordination/goals/GOAL-HQC-001/batches/BATCH-412513/tasks/TASK-20260809-a79e4f/matched_pair_results.json
  - coordination/goals/GOAL-HQC-001/batches/BATCH-412513/tasks/TASK-20260809-a79e4f/run_manifest.yaml
  - coordination/goals/GOAL-HQC-001/batches/BATCH-412513/tasks/TASK-20260809-a79e4f/design.md
  - coordination/goals/GOAL-HQC-001/batches/BATCH-412513/reviews/TASK-20260809-603dc5/validation_report.yaml
  - coordination/goals/GOAL-HQC-001/batches/BATCH-412513/reviews/TASK-20260809-47a5ec/red_team_report.md
  proof_status_note: 'empirical_only, not derivation and not certificate. A genuine measurement now
    exists at k=m=17 for both the SE-ratio replication question and the SE-vs-T scaling question;
    no proof or reduction is claimed, and no counterexample certificate applies. The load-bearing
    numbers (diff, SE_paired, SE_unpaired, z, the fitted exponent) were independently regenerated
    end-to-end by the Validator, which is the strongest available basis at this claim tier.'
  observations:
  - 'O1. WHAT IS UNDER REVIEW AND WHAT AUTHORIZED IT. DEC-20260809-46e85c authorized TASK-20260809-a79e4f,
    a two-stage matched-pair measurement at the V3/decode_blocks injection point, with a fully
    pre-registered decision rule (branches A/B/C/D/E, an SE-exponent supersession clause, and a
    knowledge-promotion release condition), all fixed before any data was generated (design.md,
    predating matched_pair_results.json, confirmed by the Validator via git-dirty-path ordering).
    Both stages completed with exit code 0 and are reported valid_measurement. Independent review:
    Validator TASK-20260809-603dc5 (verdict passed / ADMIT / MECHANICALLY_SOUND), Red Team
    TASK-20260809-47a5ec (concurs the pre-registered rule fired exactly as frozen; raises
    interpretive, not disqualifying, objections -- see O7-O9 below).'
  - 'O2. STAGE 1 (10,000 pairs reconstructed from the pilot''s already-committed shards 5000/6000,
    zero new PRNG consumption). Determinism gate PASS: the reconstructed S-histograms for the
    ORIGINAL configuration (shard 5000 defected, shard 6000 undefected) are bit-identical, elementwise,
    to pilot_results.json''s committed MEASUREMENT.defected/undefected.S_histogram arrays -- confirmed
    independently by the Validator from a separately-written driver, not merely re-read. At k=m=17,
    pooled: diff (defected-undefected) = +0.051567, SE_paired (matched-pair jackknife) = 0.096781,
    SE_unpaired (quadrature) = 0.304663, unpaired/paired ratio = 3.148, z_paired = 0.533. Per-shard:
    shard 5000 diff=+0.101778/SE=0.125106/ratio=2.902/z=0.814; shard 6000 diff=+0.010823/SE=0.149899/
    ratio=3.224/z=0.072. The Validator independently recomputed diff/SE/ratio/z at k=17 and across
    all 25 evaluable k in 2..26 from raw per-trial S it generated itself and matched EXACTLY (max
    absolute error 0.0) on every value.'
  - 'O3. STAGE 2 (T2=20,000 fresh matched pairs, shards 8001/8002, 10,000 each, sized by the
    pre-registered clamp formula from stage 1''s own measured pooled SE: T2_raw = 10000*(0.096781*
    2.80/0.20)^2 = 18,358.55 -> rounds to 18,359 -> clamped to the pre-registered floor 20,000 --
    independently reproduced by both reviewers to the same substitution). At k=17, pooled: diff =
    +0.011085, SE_paired = 0.017905, SE_unpaired = 0.277781, ratio = 15.514, z_paired = 0.619.
    Per-shard: 8001 diff=+0.006549/SE=0.024506/ratio=16.400/z=0.267; 8002 diff=+0.013921/SE=0.022097/
    ratio=9.814/z=0.630. The Validator regenerated all four fresh-shard arms from scratch (not from a
    committed raw array, since design.md scopes per-trial retention to stage 1 only) and matched
    EXACTLY across every evaluable k, additionally confirming the deterministic-pipeline claim holds
    on previously-unused shards, not only 5000/6000.'
  - 'O4. FAIL-CLOSED AND PAIRING-INTEGRITY CHECKS. Both sha256 pin selftests, the injection-invariant
    selftest, and D2/D3 hard invariants (0 violations, all 8 arms across both stages) all PASS, each
    independently confirmed by the Validator by tracing control flow and reproducing the deliberate-
    mismatch fault conditions. The Validator additionally ran an unrequested negative control:
    genuine same-shard matched pairs show a small, mostly-zero perturbation structure (std 0.327-0.332,
    10.4-11.0% of trials nonzero) against a deliberately mismatched cross-shard "pairing" (std
    4.64-4.67, ~91.5% nonzero) -- roughly 14x larger spread, confirming the pairing is genuine and not
    an artifact of index alignment.'
  - 'O5. BRANCH D AND E, EVALUATED FIRST PER DEC-20260809-46e85c''s ORDERING, DO NOT FIRE. Branch D
    (invalid/infrastructure): determinism gate PASS, D2/D3 clean on all 8 arms, no truncation, no
    crash, both runs well inside the 400 core-second / 1,800 wall-clock authorization -- does not
    fire. Branch E (sign anomaly): requires the two stage-1 shards to disagree in sign with each
    individually significant at |z|>=1.96; measured shard 5000 diff=+0.1018/z=0.814 and shard 6000
    diff=+0.0108/z=0.072 -- SAME sign, NEITHER individually significant -- does not fire. Both
    non-firings independently re-derived by the Red Team from the reported diff/SE pairs rather than
    taken on faith.'
  - 'O6. THE SE-VS-TRIAL-COUNT EXPONENT CHECK, EVALUATED NEXT PER DEC-20260809-46e85c''s OWN EXPLICIT
    ORDERING ("evaluated next... IF IT FALLS OUTSIDE THAT BAND, that supersedes branches A/B/C"),
    FALLS OUTSIDE THE PRE-REGISTERED BAND. Three points at k=17 -- (T=5,000, SE=0.137502, the mean of
    the two shards'' own T=5,000 paired SEs), (T=10,000, SE=0.096781, stage 1 pooled), (T=20,000,
    SE=0.017905, stage 2 pooled) -- fitted by OLS to log(SE)=log(c)-alpha*log(T) give alpha =
    1.4704932987763473. This is OUTSIDE the pre-registered consistency band [0.4, 0.6] declared in
    advance. INDEPENDENTLY REPRODUCED TWICE: the Validator''s own OLS fit on its own independently
    regenerated SE values gives alpha = 1.470493 (exact match to the executor''s figure); the Red
    Team''s independent refit gives alpha = 1.46996 (difference attributable to floating-point/
    rounding only, not a different construction). Per DEC-20260809-46e85c''s frozen text, this
    supersedes branches A/B/C: no A/B/C branch is evaluated or applied to this batch''s result.'
  - 'O7. WHAT SUPERSESSION ACTUALLY BLOCKED, MADE CONCRETE (Red Team). Absent the exponent supersession,
    stage 2''s own numbers at k=17 satisfy Branch B''s literal condition: |z|=0.619 < 1.96 AND
    |diff|+1.96*SE = 0.01108+1.96*0.01791 = 0.04618 < 0.19 -- which, un-superseded, would have read as
    a clean, TIGHT scoped null, considerably tighter than this campaign''s own pre-run target of
    excluding down to ~0.135-0.19. The Red Team credits the pre-registered exponent check for
    correctly withholding a conclusion that would otherwise look decisive, rather than treating the
    supersession clause as a formality invented after the fact.'
  - 'O8. THE EXPONENT''S OWN DIAGNOSIS IS NOT A UNIFORM DEVIATION FROM 1/sqrt(T) (Red Team, corroborated
    by the Validator independently). Recomputing the LOCAL exponent between each consecutive pair of
    points: the 5,000->10,000 step (SAME shards 5000/6000, pooled, the zero-new-entropy step this
    batch exists to validate) gives local exponent 0.5067 -- essentially exact 1/sqrt(T) consistency.
    The 10,000->20,000 step (switching to FRESH shards 8001/8002) gives local exponent 2.4344. 100%
    of the aggregate alpha=1.47 deviation is concentrated in the single transition to fresh shards,
    which SIMULTANEOUSLY changes trial count and shard identity -- a confound this 3-point,
    different-shards-per-point design structurally cannot separate. The Validator''s own report
    (independently, before reading the Red Team''s) flags the identical asymmetry: "the deviation is
    driven almost entirely by the T=10,000 -> T=20,000 step..., while the T=5,000 -> T=10,000 step is
    close to 1/sqrt(T)-consistent (predicted 0.0972, observed 0.0968)." Two independent reviewers
    converge on this decomposition without conferring.'
  - 'O9. THE PRE-RUN "~0.140 EXPECTED" COMPARISON BASELINE WAS EXTERNAL, NOT WITHIN-TASK (Red Team).
    design.md Section 2 and DEC-20260809-46e85c''s rationale characterized stage 1''s measured pooled
    SE (0.0968) as anomalously SMALLER than an "expected ~0.140," extrapolated via 1/sqrt(T) from the
    Red Team''s own EXTERNAL, single-shard BATCH-2ecaa1 Probe 2 (shard 424242, SE=0.1982 at T=5,000).
    This task''s OWN two shards individually measure SE=0.1251 (shard 5000) and SE=0.1499 (shard
    6000) at the identical T=5,000 under the identical jackknife construction -- already 24-37% below
    the external probe. Against the correct WITHIN-TASK baseline (mean 0.137502, the same value the
    report itself uses as its own T=5,000 point in the exponent fit), stage 1''s pooled SE (0.0968)
    is almost exactly the 1/sqrt(T) prediction (0.137502/sqrt(2) = 0.09724 vs measured 0.096781).
    THE GENUINELY ANOMALOUS NUMBER IN THIS BATCH IS STAGE 2''S SE (0.0179), NOT STAGE 1''S. The
    executor''s report (Section 7) and DEC-20260809-46e85c''s rationale both present the two as a
    single undifferentiated "deviation from 1/sqrt(T) scaling"; O8-O9 together correct that framing.'
  - 'O10. THE SE-RATIO (UNPAIRED/PAIRED) AT k=17 REPLICATES AT MATCHED SCALE, DOES NOT REPLICATE AT
    LARGER SCALE. This task''s stage 1 (T=5,000/shard, shards 5000, 6000) measures per-shard ratios
    2.902x and 3.224x, pooled 3.148x -- a 4%-16% relative gap from the BATCH-2ecaa1 Red Team''s
    original 2.78x (shard 424242, T=5,000), which the Red Team characterizes as "plausible sampling
    variation for a ratio-of-jackknife-SDs statistic built from only 200 pseudo-values" and a genuine
    replication at matched scale. This task''s stage 2 (T=10,000/shard, fresh shards 8001, 8002)
    measures per-shard ratios 16.400x and 9.814x, pooled 15.514x -- 3.5x-5.9x LARGER than the original
    figure, not a replication at that scale. In required-trials terms (ratio squared, the like-for-like
    quantity EV-HQC-dd85c1 O6 corrected to 7.74x at k=17): stage 1''s per-shard factors are 8.42x and
    10.39x (pooled 9.91x), broadly consistent in direction and order of magnitude with the original
    7.74x; stage 2''s pooled factor is 240.7x, a qualitative departure, not a refinement.'
  - 'O11. "ZERO NEW ENTROPY" IS VERIFIED BY CODE-LEVEL ARGUMENT AND A DETERMINISM GATE THAT COVERS ONLY
    THE GATE ARMS, NOT AN EMPIRICAL CHECK ON THE CROSSED ARMS (Red Team). stage_a.py''s CTRStream is
    keyed per-trial by (ps_id, shard, MASTER_SEED, local trial index, vector tag), independent of
    which decode_blocks is installed, on-call history, or n_trials -- the Red Team traced this
    directly in stage_a.py and found no bug in the mechanism. But the ONLY runtime check against a
    committed reference (the determinism gate) covers exclusively the two GATE arms (shard 5000
    defected, shard 6000 undefected) against pilot_results.json. The two CROSSED arms -- half of
    every reconstructed pair -- are validated by argument about CTRStream''s key derivation only,
    never by a runtime assertion. A free, structural, currently-missing check is named: since
    decode_blocks operates per-block independently and V3 only overwrites the last block''s window,
    F[:, 0:n_e-1] must be bit-identical between the defected and undefected decode of the same trial
    on the same shard; matched_pair.py never checks this, retaining only the lossy row-sum S. Not run
    in this batch.'
  - 'O12. POOLING CONVENTION UNTESTED FOR THIS NONLINEAR ESTIMATOR (Red Team, flagged as open, not a
    finding of bias). log2_A_from_hists is a nonlinear function of histogram counts; the pooling rule
    concatenates raw histograms (H_pooled = H_5000 + H_6000) rather than inverse-variance-weighting
    the two shards'' own point estimates. Stage 1''s own two shards disagree by roughly 10x at k=17
    (+0.1018 vs +0.0108), though both are within about 1 SE of each other and of zero, so this
    specific gap is not itself distinguishable from noise. Whether pool-then-estimate materially
    differs from estimate-then-average for this estimator is not tested in this batch.'
  - 'O13. BRANCH A (POSITIVE DETECTION) HAS STILL NEVER FIRED IN THIS CAMPAIGN. Stage 2''s z at k=17
    (0.619) is far below the |z|>=1.96 threshold. The Red Team''s standing objection from BATCH-2ecaa1
    -- that this detection chain has never once produced a fired cell from a known-present real-sampler
    defect -- is explicitly NOT retired by this batch, stated plainly per the handoff''s requirement.'
  - 'O14. MEASURED SPEND: 28.517 core-seconds / 28.099 wall-seconds total (stage 1: 9.66 core-s /
    9.45 wall-s; stage 2: 18.857 core-s / 18.649 wall-s), well inside the 400 core-second / 1,800
    wall-clock authorization. Cross-checked by the Coordinator against run_manifest.yaml.budget,
    matched_pair_results.json.stage_1/stage_2.budget, and stdout.log (all agree); independently
    plausibility-checked by the Validator''s own from-scratch comparable run (27.8s wall-clock total,
    same order of magnitude). One disclosed infrastructure event: numpy was not installed at task
    start; the first --stage 1 attempt exited 1 with ModuleNotFoundError before any data was
    generated (no result reported from that attempt), correctly classified per AGENTS.md rule 5 and
    resolved by `pip3 install --user numpy` (2.4.6, matching every prior task in this campaign)
    before either authorized run.'
  inference: 'APPLYING DEC-20260809-46e85c''s PRE-REGISTERED RULE EXACTLY AS FROZEN: Branch D does not
    fire (O5); Branch E does not fire (O5); the SE-vs-trial-count exponent, evaluated next per the
    decision''s own explicit ordering, falls outside [0.4, 0.6] (O6) and SUPERSEDES branches A/B/C --
    no A/B/C branch is evaluated or applied to this result, regardless of what stage 2''s z/diff/
    interval would otherwise indicate (O7). This is a mechanical fact about the fitted 3-point OLS
    value (1.470), independently reproduced twice, and nothing in O8-O10 below changes it.
    SEPARATELY, AS A SYNTHESIS OF WHAT THE FIRED SUPERSESSION MEANS, NOT A RESELECTION OF WHICH RULE
    FIRED: the Red Team''s local-exponent decomposition (O8), independently corroborated by the
    Validator, shows the exponent''s deviation is not uniform across the three measured points -- the
    zero-new-entropy step (5,000->10,000, same shards) is 1/sqrt(T)-consistent to within measurement
    noise, and the entire deviation is concentrated in the step that simultaneously introduces fresh
    shards 8001/8002. Combined with the corrected pre-run baseline (O9) and the scale-dependence of
    the SE ratio (O10), the more precise and better-evidenced statement is NOT "the 1/sqrt(T) scaling
    assumption is refuted" but "trial count and shard identity are confounded in this design, and the
    scaling law holds within a fixed shard pool but has not been shown to hold, and shows some
    evidence of NOT holding, across a shard change." This record does not resolve that confound --
    doing so requires the follow-up task DEC-20260809-46e85c''s own text calls for, run at fixed shard
    identity across trial counts. On the campaign-level question this batch was dispatched to
    inform -- whether the V3 defect propagates to a detectable k=17 effect -- NOTHING IS RESOLVED: the
    supersession clause explicitly forbids drawing either a detection or a null conclusion from
    stage 2''s numbers (O7), and EV-HQC-dd85c1''s sign-instability and unreplicated-SE concerns are
    UNCHANGED by this record. This record therefore leaves H-HQC-18d1b4 exactly where EV-HQC-dd85c1
    left it.'
  boundaries:
  - 'TOY, HARD CEILING. PS-R3 reduced parameters only (n=7187, n_e=56, n_2=128, dup=1, N=7168, k=m=17),
    one defect class (V3, last-block-window-read-early), one injection point (decode_blocks, block
    n_e-1), shards 5000/6000 (stage 1, zero new entropy) and 8001/8002 (stage 2, fresh sampling), one
    estimator, one solver. No statement about HQC''s IND-CCA security, its decoding-failure rate,
    assumption A17 or A5, or any standardized parameter set. No extrapolation to standardized
    parameters is made, and none is licensed.'
  - 'THIS RECORD DOES NOT REOPEN, REVISE, OR SUPERSEDE EV-HQC-dd85c1, EV-HQC-67a6ec, EV-HQC-bfb257,
    EV-HQC-163374, EV-HQC-9a30d3, EV-HQC-db1fd9 OR EV-HQC-b71230, all of which stand exactly as
    archived. This is a new, additional measurement, not a correction to a prior one.'
  - 'H-HQC-18d1b4 IS UNTOUCHED IN EITHER DIRECTION AND REMAINS PROPOSED. One toy-scale batch, whose own
    pre-registered rule explicitly forbids a detection or null conclusion from stage 2''s numbers,
    does not move it, and this record does not attempt to.'
  - 'NONE OF THE FOUR ASYMPTOTIC-COMPLEXITY PROMOTION GATES IS ENGAGED, ADDRESSED, OR CLAIMED. This
    program advances no asymptotic-complexity claim of its own in this record.'
  - 'THE FITTED EXPONENT RESTS ON ONLY THREE POINTS, EACH FROM A DIFFERENT SHARD SET. The Validator
    states this explicitly: it confirms the fitted value is arithmetically and computationally
    correct but takes no position on whether 3 points, confounded with shard identity as they are, are
    sufficient to characterize the estimator''s true scaling behavior. Neither does this record.'
  unresolved_confounds:
  - 'PRIMARY, NEWLY SURFACED BY THIS BATCH: trial count and shard identity are confounded in the
    3-point SE-vs-T design. The Red Team''s named, cheap discriminating experiment -- repeat T=20,000
    on shards 5000/6000 themselves (new, disjoint trial ranges) rather than fresh shards -- has not
    been run. Until it is, "the estimator''s SE scales as 1/sqrt(T) in general" and "the estimator''s
    variance is highly shard-dependent, and shards 8001/8002 sit in an unusual region of that
    dependence" remain equally consistent with everything measured here.'
  - 'The two CROSSED stage-1 arms and all four stage-2 arms'' zero-new-entropy claim rests on a
    code-level argument (CTRStream''s keying) plus a determinism gate that covers only the two GATE
    arms; the free, structural F[:, 0:n_e-1] bit-identity check the Red Team names as the decisive
    empirical test of the crossed/fresh arms'' determinism was not run in this batch.'
  - 'The pooling convention (concatenated histograms vs. inverse-variance-weighted point estimates) is
    untested for this nonlinear estimator; not shown to bias the reported results here, not ruled out
    either.'
  - 'The unpaired/paired SE ratio at k=17 is not shown to be a scale-invariant design constant: it
    replicates within about 4-16% at matched T=5,000 scale on different shards than the original
    probe, and diverges by 3.5x-5.9x at T=10,000/shard on fresh shards. Carried forward unresolved.'
  - 'NO POSITIVE CONTROL HAS EVER FIRED THROUGH THE REAL-SAMPLER PIPELINE. Across the whole campaign,
    including this batch, the decode_blocks-level-defect to log2_Ahat_k detection chain has never once
    produced |z|>=1.96 from a known-present defect. Every null-adjacent result this campaign has
    reported through that chain remains uncalibrated in the controls-before-belief sense of
    docs/inventor-protocol.md, unchanged from EV-HQC-dd85c1.'
  - 'The jackknife''s handling of non-finite (NaN) leave-one-batch-out replicates at high k, where
    evaluable_k''s own 30-trial-per-arm floor can leave individual batches sparse, is not separately
    characterized (Red Team required_controls item); a latent bias risk flagged but not investigated
    here, scoped away from the primary cell k=17 where it does not apply.'
  - 'The campaign''s cumulative wall-clock accounting convention is addressed by this record''s
    companion decision (DEC-20260809-186c86) and goal-head checkpoint, not resolved as a full
    historical reconciliation; carried forward as an open item, same status as before.'
