  - 'NO POSITIVE CONTROL HAS EVER BEEN RUN THROUGH THE REAL-SAMPLER PIPELINE (O11, carried forward
    unchanged). The decode_blocks-level-defect to log2_Ahat_k detection chain has never once produced a
    fired cell from a known-present defect in this campaign''s record.'
  - 'THE V1 POSITIVE-CONTROL COMMITMENT''S STATUS UNDER THIS OUTCOME IS AN OPEN SEQUENCING QUESTION, NOT
    RESOLVED HERE. DEC-20260809-46e85c committed V1 to dispatch "in the immediately following batch"
    specifically under branches B and C2, and named branch A as the only outcome making it unnecessary.
    This batch''s outcome is the exponent-supersession outcome, which that text does not address. See
    DEC-20260809-186c86 limitations for how this is carried forward rather than silently resolved either
    way.'
  - 'THE CAMPAIGN''S WALL-CLOCK ACCOUNTING CONVENTION IS PARTIALLY, NOT FULLY, RECONCILED (see
    DEC-20260809-186c86). This is the first ledger archive in this campaign to apply an explicit,
    disclosed subtraction against the running total rather than carrying forward a bare estimate; the base
    figure it subtracts from (roughly 4,973 seconds, inherited from BATCH-2ecaa1''s checkpoint) is itself
