  scope_statement: >-
    EXP-SEMAEV-a097b5 is an immutable implementation-only contract with zero
    experiment runs. Snapshot commit 921c4c4989430ae588f33fd15905f26644046c0d
    binds the corrected shared code, deterministic tests, Executor report, and
    self-neutral receipt. Fresh independent Validator and Red Team reviews in
    distinct verified review-adversarial xhigh sessions both return PASS. They
    independently verify simultaneous S4 construction, exact witness and
    degree controls, byte-compatible legacy full_curve behavior, opt-in target
    subgroup membership and error behavior, code/test scope, and the zero-run
    authority boundary. This evidence supports accepting the shared-code
    implementation and filing CORR-20260813-d9f0fa. It is not evidence for or
    against an ECDLP hypothesis, attack, speedup, cryptographic-scale result,
    or archived numerical conclusion.

  observations:
    - >-
      The corrected S4 has free symbols exactly {x1, x2, x3, x4}, no temporary
      t, total degree 12, exact equality to an independent resultant, and zero
      residue on the frozen F_101 four-point group-sum witness. Independent
      additional F_101 and F_103 exact witnesses also pass.
    - >-
      build_factor_base preserves the legacy three-argument call shape and
      default full_curve output. On generate_instance(seed=1, field_bits=6),
      default and explicit full_curve both return [34, 4, 25, 40, 30].
    - >-
      The opt-in target_subgroup mode returns the exact set
      {12, 13, 18, 24, 33} on the frozen order-11, cofactor-5 instance; every
      canonical lift is n-torsion; outputs are deterministic and unique; and
      oversize, shortfall, and unknown-scope cases fail explicitly.
    - >-
      Focused deterministic controls and all 23 tests in tests/test_harness.py
      pass. These are unit tests, not scientific experiment runs.
    - >-
      Validator TASK-20260813-d7ed22 and Red Team TASK-20260813-8ebacc both
      return PASS and recommend implementation acceptance only. Their verified
      sessions are distinct, exact-session provenance is bound, fallback and
      degradation are false, and no prohibited provider was selected or
      contacted.
    - >-
      Static consumer classification finds two direct production S4 consumers:
      EXP-MTIC-001 and EXP-FIB-001. Their 21 combined archived run directories
      remain immutable. Any future numerical comparison requires separately
      approved matched additive reruns; this batch observes no numerical
      impact and changes no archived conclusion.

  inference: >-
    Accept the shared-code implementation within its frozen deterministic
    correctness boundary and close BATCH-1800b3. Preserve EXP-SEMAEV-a097b5
    with execution_authorized=false and zero experiment runs. Treat
    CORR-20260813-d9f0fa as a forward provenance and comparison rule, not as
    invalidation of prior evidence. Resume the active goal only through a fresh
    Coordinator frontier rerank and a new frozen batch for any scientific run.

  boundaries:
    - No ECDLP experiment, solve attempt, benchmark, or scientific measurement ran.
    - No archived run, raw result, summary, manifest, evidence record, decision, or knowledge artifact was edited.
    - No archived numerical result is accepted, rejected, weakened, invalidated, or reinterpreted by this evidence.
    - No attack, speedup, security impact, asymptotic result, cryptographic-scale result, closure result, or breakthrough is supported.
    - Unit-test success establishes only deterministic implementation behavior on the reviewed boundary.
    - GOAL-ECDLP-001 remains active and H-DTREE-001 receives no status or evidential promotion.

  unresolved_confounds:
