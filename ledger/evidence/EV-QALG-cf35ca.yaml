  direction: neutral
  strength: n/a
  strength_note: >-
    Following EV-DREG-39e13d's precedent: the strength enum (anecdotal |
    preliminary | replicated | strong | inconclusive | contradictory)
    describes the weight of a scientific finding. No scientific finding
    exists in this record to weigh -- fifteen ideation proposals were
