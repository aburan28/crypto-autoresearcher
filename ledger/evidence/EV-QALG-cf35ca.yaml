    any hypothesis under GOAL-QALG-001, GOAL-MLKEM-001, GOAL-MLKEM-005,
    GOAL-HQC-001, or GOAL-CSIDH-001.
  experiment_ids: []
  run_ids: []
  type: administrative_ideation_review
  type_note: >-
    templates/research-records.md's evidence.type enum (empirical |
    theoretical | literature) has no entry for an ideation/proposal-review
    disposition with no experiment, run, or hypothesis behind it. Following
    the established precedent at EV-DREG-39e13d (type:
    administrative_integrity_validation, same claim-boundary discipline),
