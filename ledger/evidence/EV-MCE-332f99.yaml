evidence:
  id: EV-MCE-332f99
  hypothesis_id: null
  hypothesis_id_note: >-
    No hypothesis exists. GOAL-MCE-001 BATCH-001 is a primary-source
    acquisition batch; RQ-MCE-e65b3c forbids designing an experiment before
    primary text is in hand, and active_hypothesis_ids is deliberately empty.
    This record exists to preserve what was transcribed and what the two
    independent reviews found, not to bear on any hypothesis.
  experiment_ids: []
  run_ids: []
  type: literature
  direction: neutral
  strength: inconclusive
  claim_tier: toy
  certificate_refs: []
  proof_status: not_applicable
  proof_refs: []
  observations:
    - id: O-1
      what: >-
        Classic McEliece's five parameter sets transcribed from
        mceliece-spec-20221023.pdf section 7, with k = n - m*t (the
        specification's own section 3 definition) and rate k/n in exact
        rationals: 348864 -> 85/109 (0.779817); 460896 -> 35/48 (0.729167);
        6688128 -> 157/209 (0.751196); 6960119 -> 5413/6960 (0.777730);
        8192128 -> 51/64 (0.796875).
      basis: >-
        TASK-20260803-f3aece, snapshot commit 4d801d94. Independently
        recomputed by TASK-20260803-409c5e from a re-fetched specification:
        5/5 on k, on lowest-terms fractions, on gcds, on 6-dp decimals;
        mt < n everywhere; 5413 confirmed prime.
      controls: >-
        The producer's size-formula control (feed transcribed (m,n,t) through
        the specification's own size formulas, reproduce the independently
        extracted size table) passed 10/10 and independently re-ran at 10/10
        under the validator, which additionally verified all 40 IMPL Table 1
        cells because the private-key column has no arithmetic bridge.
    - id: O-2
      what: >-
        The complexity claim of iacr:2026/1232 is a CONJECTURE. Verbatim from
        the retrieved abstract: "We make the conjecture that this attack has a
        complexity which is of the same nature as the distinguisher, namely
        subexponential in the security parameter." No exponent and no formula
        appear in the text obtained.
      basis: TASK-20260803-292b99, snapshot commit 6787c6e4.
      scope_limit: >-
        THE PAPER BODY WAS NOT OBTAINED. eprint.iacr.org/2026/1232.pdf
        returned 403 cf-mitigated twice, 8 minutes apart, not circumvented.
        This observation covers the abstract and the authors' revision note
        only.
    - id: O-3
      what: >-
        No rate regime appears in the obtained text of iacr:2026/1232. A code
        family is stated (binary Goppa; Goppa over fields of even
        characteristic) and nothing else -- no rate, genus, degree or
        extension-degree condition. The full abstract is quoted in
        rate_regime_extraction.md section 1.3 so the ABSENCE is checkable
        rather than asserted.
      basis: TASK-20260803-292b99.
      scope_limit: >-
        Whether the unobtained body imposes a regime is UNKNOWN. This record
        does not treat absence-in-the-abstract as absence-in-the-paper.
    - id: O-4
      what: >-
        The number of heuristics iacr:2026/1232 rests on is UNKNOWN, not zero.
        Zero were enumerated because zero were read. Enumerated from papers
        that WERE read in full: iacr:2024/1193 -> 5 paper-numbered;
        arXiv:2304.14757 -> 5 paper-numbered plus 1 numbered by the executor
        and flagged as such, enumeration not certified complete.
      basis: TASK-20260803-292b99.
    - id: O-5
      what: >-
        arXiv:2304.14757 states verbatim that its attack "does not work at all
        when the alternant code has the additional structure of being a Goppa
        code", with Table 1 carrying "(does not apply in the particular case of
        Goppa codes)".
      basis: >-
        TASK-20260803-292b99, from full text (526,690 bytes) re-acquired
        byte-identically by TASK-20260803-409c5e.
      consequence: >-
        The decisive restriction in that result is the CODE FAMILY, not the
        rate. Classic McEliece uses binary Goppa codes.
    - id: O-6
      what: >-
        NIST IR 8545 (March 2025, DOI 10.6028/NIST.IR.8545) states Classic
        McEliece "is no longer under consideration for standardization as part
        of the current NIST PQC Standardization Process", giving limited
        interest, migration complexity and NIST/ISO incompatibility risk --
        explicitly NOT security.
      basis: >-
        TASK-20260803-f3aece read the NIST text directly; csrc.nist.gov was
        reachable, contrary to the expectation recorded in RQ-HQC-001.provenance.
        Re-acquired by TASK-20260803-409c5e (byte count reproduced; hash
        non-reproducible by construction -- Cloudflare email obfuscation uses a
        per-response XOR key).
    - id: O-7
      what: >-
        ISO standardization of Classic McEliece in June 2026 is asserted by the
        designers' own site and by no other source obtained. iso.org returned
        403 twice (not circumvented), the designation number was NOT obtained,
        and ISO's own text was never read.
      basis: TASK-20260803-f3aece.
      scope_limit: >-
        Recorded as OPEN. A single source that is a party to the claim is not
        an independent confirmation.
    - id: O-8
      what: >-
        The ISO parameter-set list contains no mceliece348864 variant. ISO's
        pc/pcf sets introduce no new (m,n,t), so the rate table applies to them
        unchanged.
      basis: TASK-20260803-f3aece.
      consequence: >-
        "Standardized parameter sets" excludes the lowest-claimed-category set.
        Any later claim of this program about "standardized parameters" must
        respect that exclusion.
    - id: O-9
      what: >-
        The eprint block on 2026/1232 is PATH-scoped, not format-scoped:
        /2026/1232 -> 200, /2026/1232.pdf -> 403, and
        /archive/versions/2026/1232 -> 403 on an HTML endpoint.
      basis: >-
        TASK-20260803-292b99; independently confirmed by TASK-20260803-409c5e.
      consequence: >-
        Both "eprint is blocked" and "eprint HTML works" are wrong
        generalisations. The goal record's and BATCH-001-OPENING's framing of
        this precondition is narrowed by this batch's own producer.
    - id: O-10
      what: >-
        Five re-acquisition hashes are non-reproducible BY CONSTRUCTION, each
        cause established mechanically rather than assumed: HAL serves a
        proof-of-work interstitial under HTTP 200; the eprint OAI-PMH response
        embeds a responseDate; both csrc.nist.gov pages use a per-response XOR
        key for email obfuscation; the iso.org 403 carries a challenge nonce.
        Status code and byte count reproduced exactly in every case.
      basis: TASK-20260803-409c5e.
      note: >-
        Recorded as a re-acquisition hazard for future validators, not as
        producer error.
  inference: >-
    NOTHING IS ESTABLISHED ABOUT CLASSIC McELIECE'S SECURITY IN EITHER
    DIRECTION, and this record asserts nothing of the kind.

    What the batch establishes is narrower and entirely about sources: Classic
    McEliece's rates are now transcribed and independently recomputed
    (0.729167 to 0.796875); the 2026 subexponential claim is a conjecture whose
    paper body this program could not obtain; and the nearest fully-read
    neighbour in that line explicitly excludes Goppa codes from its attack.

    The batch's own framing did not survive it. BATCH-001-OPENING section 4
    asserted that "the rate threshold is the whole question" about papers
    nobody had read; O-5 falsifies that for arXiv:2304.14757, where the
    decisive restriction is the code family. This is recorded as a defect of
    the Coordinator's framing, not of either producer, both of which held the
    scope firewall.
  boundaries:
    - >-
      Scoped to the SOURCES actually obtained on 2026-08-03 and to the five
      parameter sets of mceliece-spec-20221023.pdf section 7. Nothing here
      extends to the ISO sets beyond the (m,n,t) equivalence recorded in O-8.
    - >-
      O-2, O-3 and O-4 are scoped to the ABSTRACT of iacr:2026/1232. The body
      was not obtained; absence of a stated regime in an abstract is not
      absence of a regime in the paper.
    - >-
      No distance between the 2026 attack regime and Classic McEliece was
      computed, and none may be inferred from this record: there is no
      transcribed left-hand side.
    - >-
      claim_tier is toy and RQ-MCE-e65b3c's ceiling is unchanged. AGENTS.md
      rule 7 applies.
    - >-
      Both reviews are independent sessions on ONE resolved model
      (claude-opus-5), the same model as both producers and the Coordinator.
      NOT admissible toward an AGENTS.md rule 13 quorum; no attestation is
      recorded and none may be synthesized from these reviews later.
  unresolved_confounds:
    - >-
      The primary target's body is unread. Every statement about iacr:2026/1232
      rests on an abstract, and the single most decisive question -- whether it
      states a regime that excludes or includes Classic McEliece's parameters
      -- is unanswered.
    - >-
      The ISO claim rests on an interested single source (O-7).
    - >-
      TASK-20260803-409c5e Q2: TASK-20260803-f3aece silently glyph-normalised
      quoted material presented as verbatim while declaring zero
      [EXTRACTION-DAMAGED] markers, where TASK-20260803-292b99 left raw
      (cid:NN) tokens visible and marked them. Divergent transcription
      standards inside one batch. No number is affected, but the convention is
      unsettled and should be fixed before the next transcription batch.
    - >-
      HEAD advanced under TASK-20260803-292b99 during its run (a6a04546 ->
      6b4c09dc) via concurrent Coordinator commits, so the task card it read
      may differ from the committed one. Recorded by the producer; no
      discrepancy was identified, but the exposure is real and the dispatcher
      does not currently pin a task card by hash.
