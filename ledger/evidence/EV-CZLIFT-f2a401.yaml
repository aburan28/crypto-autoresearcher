  obstruction:
    statement: >-
      On F_p^*, the p-adic logarithm functional log_p(s(x)^{p-1}) reads only
      the Fermat quotient mod p. It vanishes on the homomorphic (Teichmuller)
      section, and on the naive integer section it returns d exactly iff
      g^d mod p^2 < p. So the only above-random recovery by this section is
      the archimedean no-carry region g^d < p, which an O(log p) integer
      logarithm already solves; off it, the band p <= g^d < p^2 never succeeds
      and the rest succeeds at about 1/p. The p-adic route adds no
      discrete-log information at the tested scope.
    quantity: >-
      (a) Teichmuller functional-vanishing rate; (b) naive-section success
      rate split by region (sub-p, band, rest), the rest against the exact
      conditional null; (c) random-Hensel success rate as a multiple of mean
      1/p.
    value: >-
      (a) 1.0, 3200/3200 rows (Clopper-Pearson 95% lower bound 0.99885, an
      instrument check of an exact identity). (b) sub-p 24/24 (rate 1.0, 95%
      lower bound 0.858); band 0/34 (0 by D-3); rest 9 successes in 3142 rows
      against an exact conditional expectation of 6.585, ratio 1.37 (95% CI
      0.63-2.60), dimensionless; total naive 33 against 5.39 at mean 1/p,
      ratio 6.13 (CI 4.22-8.61). (c) 3 against 5.39, ratio 0.56 (95% CI
      0.12-1.63), dimensionless.
    measured_by: [RUN-CZLIFT-0cefcd, RUN-CZLIFT-a5c1da, EXP-CZLIFT-bdae69]
    scope: >-
      F_p^* only; 80 seeded primes 50 < p < 2000 (two seeds of 40), 1600 pairs
      per seed, d uniform in [2, p-3], precision 4, g the smallest primitive
      root, the three named sections (Teichmuller, naive [1, p-1], fresh
      random-digit Hensel) and the one functional log_p(s^{p-1}) with the
      leading-digit ratio. The region criterion (D-3) is a derivation uniform
      in odd p; the rates are measured only here.
    resource_check:
      examined: true
      reading: >-
        Read the other way round, the block measures a partial homomorphism of
        the naive section, exact on the no-carry region x*y < p. That is the
        hypothesis index calculus runs on in F_p^*: relations among small
        integer lifts that multiply without reduction, valued in Z/l for
        l | p-1. The Fermat-quotient functional is valued in Z/p, and
        Hom(Z/(p-1), Z/p) = 0 is why it sees the structure only where no
        reduction occurs. The elliptic counterpart, small-height global
        points that add without reduction (red-team O1), is the resource whose
        scarcity is the Silverman-Suzuki / xedni obstruction, and the
        RQ-CZLIFT-b9f765 global-lift lane already measures it
        (EXP-CZLIFT-14f6d5, EXP-CZLIFT-8c50ea). So the G_m excess and its
        Siegel-bounded elliptic analogue measure one archimedean resource,
        already owned by index calculus and by that lane, and no p-adic one.
        The red team's derived, unmeasured candidate (a rational-reconstruction
        section whose elliptic sub-height chain grows like
        c*sqrt(log p / h^(P~))) is the same archimedean resource with no DLP
        leverage; it is routed as a possible cross-check row for the
        global-lift lane, not filed as a lead. No new lane is spawned
        (red-team obstruction_and_resource_reading, concurred by the
        Coordinator).
      spawned_ids: []
  reviewed_by: coordinator
