  inference:
    rejected_statement: >-
      H-CZLIFT-d37231 as posed, at the tested instantiation (smallest
      primitive root, frozen in run.py): the clause "the naive-integer ...
      section's ratio equals d mod p at a rate within 4 standard errors of the
      mean of 1/p" fails on both seeds, and the clause "the naive-integer and
      random-Hensel sections are homomorphic on a fraction near 1/p of pairs"
      is false for both sections.
    supported_statement: >-
      Scope: F_p^*, two seeds of 40 seeded primes 50 < p < 2000 with 40 pairs
      each, precision 4, g the smallest primitive root. (i) The Teichmuller
      section is homomorphic on every sampled pair, log_p(s(x)^{p-1})
      vanishes on every sampled point, and the Smart-style ratio is never
      defined. (ii) The random-Hensel section's ratio equals d on 3 of 3200
      pairs against 5.39 expected at mean 1/p (ratio 0.56, CI 0.12-1.63). (iii)
      The naive integer section's ratio equals d on 13 and 20 of 1600 pairs (z
      = 7.65, 9.14), exactly on the pairs with g^d mod p^2 < p: all 24 pairs
      with g^d < p succeed, no pair with p <= g^d < p^2 can, and the other 9 are
      consistent with the exact conditional null (1.37x, CI 0.63-2.60). (iv)
      The naive section is homomorphic exactly when x*y < p (10 and 10 against
      9.35 and 12.96), the Hensel section on 0 pairs (p^-3). The falsifying
      excess is the archimedean no-carry region (Eisenstein's logarithmic
      property of the Fermat quotient), carries no discrete-log information
      beyond an O(log p) integer-logarithm check, and is no evidence of p-adic
      leakage or about any elliptic curve.
    negative_phrasing: >-
      For the clauses that held: no Teichmuller or random-Hensel success rate
      exceeding the pre-registered 4-standard-error threshold over the mean 1/p
      was observed over the tested primes, generator rule, precision,
      implementation and budget.
    heuristic_named: >-
      H-1 (unnumbered in the hypothesis, numbered here): a non-canonical
      section's 1-unit discrepancy s(x)/omega(x) is random relative to d. It is
      the assumption the naive clause refutes; for the naive section it fails
      on the sub-p and band regions by D-3, and holds on the rest region in the
      population (rule-A rest ratio 0.984 +/- 0.085, review-side). No
      asymptotic claim depends on it.
