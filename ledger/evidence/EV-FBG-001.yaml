evidence:
  id: EV-FBG-001
  hypothesis_id: H-FBG-001
  experiment_ids: []          # EXP-FB3-001 is the experiment; its specification.yaml is
                              # not machine-parseable YAML, so its ID cannot be registered
                              # or resolved. It is cited by path throughout this record.
  run_ids:
    - RUN-FB3-001-N14
    - RUN-FB3-001-N16
    - RUN-FB3-001-N18
    - RUN-FB3-001-CTRL
    - RUN-FB3-001-FAMILY
  type: empirical
  direction: contradicts
  strength: replicated
  claim_tier: toy
  certificate_refs: []
  proof_status: derivation
  proof_refs:
    - experiments/EXP-FB3-001/conservation.md
    - experiments/EXP-FB3-001/analysis.md
    - coordination/goals/GOAL-ICLIFT-001/batches/BATCH-001/tasks/TASK-20260724-232/validation_notes.md
  observations:
    - >-
      Record-integrity note, discovered while filing this evidence: the frozen
      records ledger/H-FB3-001.yaml, ledger/RQ-FB3-001.yaml, and
      experiments/EXP-FB3-001/specification.yaml are not machine-parseable YAML
      (unquoted multi-line scalars containing colons inside list items), and
      their IDs predate the current format, which forbids a digit inside the area
      code. They remain immutable and unedited; H-FBG-001 and RQ-FBG-001 are
      faithful transcriptions created so this outcome can be recorded against
      resolvable IDs. The battery was executed against the ORIGINAL frozen text.
    - >-
      All 288 pre-registered cells (6 geometries x 3 sizes x 4 curves x 4 seeds)
      reached the terminal state `measured`; 0 infeasible, 0 invalid. Sizes
      N ~ 2^14, 2^16, 2^18 on 12 generated prime-order curves E/F_p, m = 3,
      matched size B = ceil((6N)^(1/3)), 200 permutation-null draws per cell
      (frozen minimum 100), exact counting over the complete target space.
    - >-
      Exact mean-yield ratio against the matched random null is 1.000000 at every
      size for all three untyped geometries (high_bit_interval, small_height,
      coset_union), with growth slope 0 and CI half-width at machine epsilon.
      Maximum absolute deviation of the exact cell mean from binomial(B+2,3)/N
      over 144 cells is exactly 0.
    - >-
      The three remaining cells sit strictly BELOW the null on mean yield:
      mixed_two_base 0.3726/0.3700/0.3749, asymmetric_sizing 0.0342/0.0418/0.0420,
      greedy_optimized (held-out) 0.9554/0.9717/0.9806. Their Holm-adjusted
      rejections (p = 0.0398) are all in the deficit direction; the greedy slope
      is a deficit decaying toward 1, not an advantage growing.
    - >-
      Exact coverage ratios stay within about 1% of the null for the untyped
      geometries. Two sub-1% coverage EXCESSES were reported rather than
      suppressed: greedy_optimized has a family-wise CI excluding 1 at every size
      (2^18: [1.00105, 1.00456]) but a NEGATIVE slope (-1.18e-3) and permutation
      Holm p = 1.0; coset_union reaches 1.0012 at 2^18 with a CI including 1.
    - >-
      Pre-registered analytic arm: for any base D of B distinct group elements in
      a group of order N, the sum over all targets of the number of size-m
      multisets from D summing to that target equals binomial(B+m-1, m) exactly,
      because each multiset sums to exactly one target. All four pre-registered
      consequences were CONFIRMED against measurement, including the corollary
      coverage <= min(1, mean) (336 cells, 0 violations) and the typed-base
      penalty (measured 4.817x at a balanced split).
    - >-
      Controls: counter verification against brute force (46 cases, full
      per-target count-vector agreement), per-cell closed-form totals (67,784
      checks, 0 failures), curve validity (order prime, in the Hasse interval,
      N*G = O, dlog table bijective), port fidelity against the recorded H016 and
      H017 cells (68 checks, 0 failures, reported before the family verdict), and
      bit-identical reproduction from recorded command lines apart from
      wall-clock fields.
    - >-
      Independent validation (TASK-20260724-232) returned valid_with_findings:
      7 cells recomputed from scratch without importing executor code, all exact;
      one curve order recomputed independently; all 39 snapshot hashes verified;
      every required check passed. Findings were all minor: a label in
      conservation.md carrying a curve-1 value where analysis.md publishes the
      16-replicate value, an undocumented Holm p-value aggregation rule living
      only in a code comment, a matched-random draw range of [1, N) where the
      convention string says [0, N), and manifests recording a pre-snapshot
      revision with dirty_tree true.
    - >-
      Independent red team (TASK-20260724-233) returned conclusion_requires_narrowing
      with 0 fatal, 7 scoping, and 6 noted objections. Two are load-bearing.
      (RT-1) A Bose-Chowla B_3 (Sidon) base attains coverage = min(1, mean)
      exactly, measured coverage ratio 1.1071, and a whole-group low-collision
      greedy at the battery's own 2^18 parameters reaches 1.0269 — 36x and 9x the
      largest excess anywhere in the battery, with a headroom ceiling of +54%.
      (RT-2) The frozen greedy arm optimizes a training half although exact
      counting makes the whole group the population; re-running the same
      geometry against the whole-group objective gives +2.69% instead of +0.30%,
      about 9x, while its growth slope becomes MORE negative (-0.00734/bit versus
      -0.00118/bit), so the growth clause fails more steeply, not less.
    - >-
      Red-team cost bound: under a harvest-all solve the relations obtained per
      solve equal the mean and are therefore exactly geometry-invariant; under a
      one-relation-per-target model the advantage of any geometry is bounded by
      min(1, mu)/(1 - e^-mu) <= 1.582, maximized at mu = 1, which is where the
      frozen matched size B places the battery. The tested operating point is the
      most favourable one for a structured base.
  inference: >-
    Within the tested scope, no pre-registered structured factor-base geometry
    exhibits a decomposition-yield advantage over a matched random base that
    grows with N; the frozen success criterion is met by 0 of 6 geometries. The
    mean-yield arm of the hypothesis is vacuous by construction rather than
    empirically null: the conservation identity forces the exact mean yield of
    every base of size B to binomial(B+2,3)/N, so the primary metric equals 1 for
    every matched-size untyped base at every N, and the two typed rejections are
    the closed-form typing penalty rather than an element-geometry effect. The
    evidential weight of the negative therefore rests on the secondary exact
    coverage metric, where the largest advantage anywhere in the battery is
    +0.30% against a per-cell null resolution near +/-0.5%.
  boundaries:
    - >-
      Scope: the six pre-registered geometries, the frozen counting convention
      (m = 3, unsigned multisets of factor-base points, targets uniform over the
      whole group, matched size B = ceil((6N)^(1/3))), N in {2^14, 2^16, 2^18},
      12 generated prime-order curves, claim tier toy (field_bits 14-18).
    - >-
      This does NOT establish that no factor-base geometry beats a matched random
      base on decomposition probability. The red team exhibited a Bose-Chowla
      B_3 base with a measured coverage ratio of 1.1071, and coverage headroom up
      to min(1, mean) is free for any base. The closed clause is GROWTH of a
      yield advantage for these six geometries, not the existence of any coverage
      advantage.
    - >-
      Yield and coverage only. The cost of FINDING a decomposition (the
      point-decomposition / summation-polynomial solve) and the linear-algebra
      stage are untouched. The conservation identity is CONSISTENT with index
      calculus working: the Gaudry-Diem 1/n! decomposition probability over
      extension fields IS the conservation mean, so the extension-field advantage
      lives in the solve, which this experiment does not measure.
    - >-
      Relation rank and independence were not measured. The metrics score a
      rank-deficient base (for example logs {1..B}) as tied with a random base of
      the same size.
    - >-
      Discrete logs were known by construction for measurement only. No cost,
      speedup, or attack claim follows, and counting at 2^18 costs far more than
      solving the same toy ECDLP by rho.
    - >-
      Nothing here bears on KN-OPEN-001 (whether index calculus can beat rho over
      prime fields), which remains open.
  unresolved_confounds:
    - >-
      The greedy arm as frozen understates its own geometry by about 9x
      (red-team RT-2); the arm's Holm verdict is therefore a verdict on a
      mis-specified objective, mitigated only by the red team's finding that the
      corrected arm fails the growth clause more steeply.
    - >-
      The asymmetric_sizing arm cannot reach its stated design point
      B1*B2*B3 ~ l at a fixed total size (the product is bounded by 0.222N), so
      its Holm rejection is an arithmetic-mean-geometric-mean consequence rather
      than a measurement (red-team RT-9).
    - >-
      Prior cells H016 and H017 exist only at 2^14 and 2^17 and were marked
      censored at 2^16 and 2^18 while retaining their Holm slots. The executor
      described slot retention as conservative; the red team argues the opposite
      for a null result, since inflating family size makes detection harder.
      Both readings are recorded; neither changes a verdict here.
    - >-
      The 16-replicate axis is partly pseudo-replicated for deterministic
      geometries; a 4-curve cluster bootstrap is reported alongside every
      primary CI.
    - >-
      With 200 permutation draws the smallest two-sided p-value is about 0.005,
      and untyped cells have zero-variance nulls giving p = 1.0 by construction.
  reviewed_by: coordinator
