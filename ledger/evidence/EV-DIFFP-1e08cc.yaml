      that the control "has been run EXACTLY ONCE ... returning 1 of 30 (RT-J8-4)", and H-13
      repeats RT-J8-4's denominator of 30. THE CONTRACT IS REQUIRED READING FOR THE PRODUCER, FOR
      BOTH REVIEWERS AND FOR ANY RE-DERIVER. So BR-5's blinded quantity is stated in the one
      document nobody in this round could avoid reading, and NEITHER the producer's agreement NOR
      the adversarial re-deriver's is blind to the target integer. THIS IS NOT A CRITICISM OF
      ANYONE'S HONESTY; IT IS A STRUCTURAL FACT THAT BOUNDS WHAT THE ROUND'S AGREEMENT IS WORTH,
      AND IT IS UPHELD IN FULL AGAINST THIS COORDINATOR ROLE.
      THE ADVERSARIAL SESSION APPLIED THE LABEL TO ITSELF FOR EXACTLY THE SAME REASON, WHICH IS WHY
      THIS RECORD TAKES IT RATHER THAN NEGOTIATING IT.
    what_IS_mechanically_demonstrated: >-
      THE PRODUCER'S IN-PROCESS NON-READING: an audit hook installed BEFORE any substrate import,
      hooking `open` and `os.open`, with blocked_prefixes naming the H-1 forbidden path, the
      GOAL-MD5-001 quarantine and the sealed-priors prefix; blocked_open_attempts_recorded = [];
      modules_loaded_from_the_forbidden_path = [] over modules_in_process_total 661;
      assertion_holds true. INDEPENDENTLY RE-VERIFIED TWICE: the Validator installed its OWN hook
      before importing anything, ran the producer's entire measurement under it, observed 652 open
      events with ZERO under the quarantine prefix and ZERO under the H-1 forbidden prefix, and
      demonstrated the hook FIRES by a deliberate self-test; the Red Team installed its own before
      any harness import over EIGHT prefixes with 0 blocked attempts because none was made, and
      both of its construction scripts asserted harness.diffpath.readmit ABSENT from sys.modules at
      start and end, 647 modules loaded.
    what_is_ATTESTED_AND_UNVERIFIABLE: >-
      EVERY SESSION-LEVEL BOOLEAN. The producing session and both reviewing sessions are agents
      holding file-reading tools that are NOT the Python process, and NO TOOL IN THIS REPOSITORY
      CAN VERIFY ANY OF THOSE BOOLEANS. The producer stated this itself, unprompted and in the
      correct terms, which both reviewers record as a genuine strength.
    the_green_tool_adjudicated_as_carefully_as_a_failure: >-
      `python3 tools/check_review_independence.py` RETURNED "PASS: 2 report(s), every joint owned
      and attested, blindness respected, controls declared". THAT PASS IS NOT MECHANICAL
