      `blindness.blind_from`; the plan implements blind_from as the INTERSECTION of what both
      reviewers are barred from, with per-reviewer sibling boundaries carried in
      `blindness.sibling_boundary_per_reviewer` and in each assignment; both reviewers list their
      own two documents in `sources_read` and neither reports the contradiction round 3's F-1
      recorded. THE HONEST CAVEAT CARRIES: the checker's leak test runs against
      `blind_rederivation.blind_from` and not against `blindness.blind_from`, SO BR-14's FIX IS NOT
      THE THING THE TOOL TESTED, and the green pass still does not cover it.
    did_BR_16_hold: >-
      YES, WITH A NAMED RESIDUAL SMALLER THAN ROUND 3's, AND WITH ONE NEW DEFECT OF THIS
      COORDINATOR ROLE'S OWN. Neither sealed-prior filename appears in the snapshot receipt's
      31-path `path_sha256`; only the sidecar
      coordination/goals/GOAL-DIFFP-84d641/sealed-priors/BATCH-171407/digests.json does. The Red
      Team learned nothing at all: it did not enter the prefix, did not list it, and does not know
      how many files it holds or what they are called. THE VALIDATOR DISCLOSED, UNPROMPTED, EXACTLY
      WHAT IT DID LEARN: from the receipt's `archive.written_by` field the words "sealed prior
      part-2 addendum" describing one of four content artifacts, and from the review plan's
      `coordinator_prior` field that the prior exists in TWO write-once parts with one digest
      sidecar. IT LEARNED THAT THE PRIOR HAS TWO PARTS AND NOTHING ABOUT WHAT EITHER SAYS. Round
      3's Validator was handed BOTH FILENAMES, so BR-16 reduced the leak from filenames to a
      count-and-shape, WHICH IS WHAT IT CLAIMED AND NO MORE.
      THE NEW DEFECT, UPHELD AGAINST THIS ROLE: BR-16 CLOSED THE `path_sha256` CHANNEL AND DID NOT
      CLOSE THE RECEIPT'S PROSE CHANNEL. Its own text ordered `staged_not_in_binding_set` to
      disclose by prefix and count and NOT by filename; the receipt honoured that for the prefix
      and leaked the shape through `archive.written_by` instead. THE SUCCESSOR FIX IS ONE LINE: the
      disclosure rule binds EVERY FIELD OF THE RECEIPT, not only the binding set.
    the_weighting_rule_this_round_adds_to_the_campaigns_vocabulary: >-
      MATCHING OUTCOMES ARE WEAK, and weaker this round than the contract's own
      interpretation_limits already say, because contamination pushes toward agreement AND both
      implementations were told the target integer by a required reading. DIFFERING OUTCOMES ARE
      STRONG AND ASYMMETRICALLY SO, because a disagreement between two value-informed
      implementations cannot be manufactured by contamination. THE MIXED CASE ACTUALLY OCCURRED AND
      NEITHER THE CONTRACT NOR DEC-20260824-257f35 NAMES IT: A MIXED OUTCOME IS WEIGHTED BY WHERE
      THE DISAGREEMENT SITS AND NOT BY ITS SIZE. Here the agreement sits on the quantity both
      parties were told in advance (arm (a)'s 1) and the disagreement sits on the quantity neither
      was (arm (b)'s 360 versus 368), WHICH IS THE REVERSE OF THE REASSURING PATTERN.
    the_mechanism_proposal_this_round_produced_and_it_is_routed_to_the_program_not_to_this_goal: >-
      A READ-SIDE LEDGER RATHER THAN A WRITE-SIDE PROMISE. A harness that (a) records every
      tool-level file read into an append-only session log written to a declared path, and (b) has
      the run wrapper hash that log into the manifest, would make "did the session read path P" a
      CHECKABLE PROPERTY OF A COMMITTED ARTIFACT rather than a boolean in a file. It needs a
      runtime hook, a write-once log path and one manifest field. ITS LIMIT IS STATED PLAINLY BY
      ITS AUTHOR: IT MOVES THE TRUST FROM THE AGENT TO THE RUNTIME AND DOES NOT ELIMINATE IT -- a
      session that can write its own log can write a false one unless the harness writes it -- AND
      IT CANNOT COVER A MODEL'S OWN MEMORY, which is the same residual BCP-1 already records. THIS
      IS THE MOST VALUABLE PROCESS OUTPUT OF THIS ROUND AND IT IS NOT THIS CAMPAIGN'S LEDGER'S TO
      BUILD.

