    THE READING THAT THE CORRECTED (ROW_EXPO-FREE, MPFR) CONSTRUCTION ITSELF
    CANNOT CLEAR STAGE 0 AT ANY MAIN-GRID CELL, OR THAT RAISING PRECISION
    FURTHER WOULD NOT HELP. This is directly falsified for d=512 by the Red
    Team's own executed probe1, and left genuinely open, not confirmed, for the
    d=256 cells (see compound_finding_reconciliation above).
  - >-
    ANY TREATMENT OF THE 0/6 OUTCOME AS LICENSING DEC-20260814-4ac30a's OWN NAMED
    ESCALATION BRANCHES (upstream fplll bug report, alternate fplll/fpylll
    build/version, or a scoped-down dimension) AS RIPE. See
    escalation_ruling below -- this is the primary Coordinator determination this
    record exists to support.
  - >-
    A SINGLE-NUMBER "MINIMUM ADEQUATE PRECISION" FOR THE CORRECTED CONSTRUCTION,
    STATED WITHOUT NAMING WHICH (d, beta) INSTANCE IT WAS DETERMINED AT. 65 bits
    is a property of ONE calibration instance ((d=256, beta=40), isolated-step
    level), not a general property of the fix -- a bare, unqualified citation of
    "65 bits" as if it applied generally is not admissible.
  - "ANY STATEMENT THAT THE COST OF A DIMENSION-APPROPRIATE, PROPERLY-CALIBRATED
    ATTEMPT AT d=512 IS NOW KNOWN. It is not: the wall-clock figures this batch
    measured at d=512 (386.0-413.6s) are costs of failing at an under-provisioned
    precision (Red Team COST-1), not costs of a well-calibrated attempt."

  # ==================================================================
  # ESCALATION RULING -- THE COORDINATOR DETERMINATION THIS RECORD SUPPORTS
  # ==================================================================
  escalation_ruling: >-
    DEC-20260814-4ac30a's own next_actions named three escalation options
    (upstream fplll bug report, alternate build/version, or a scoped-down
    dimension) as "the live question" IF the corrected construction failed to
    complete at every cell. It did fail at every cell. But per the compound
