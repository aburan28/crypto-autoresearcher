    could not have surfaced." Naming the escalation as ripe now would treat an
    obstruction measured over a NARROWER scope (one under-calibrated precision
    value, at one instance) as if it were measured over the BROADER scope the
    escalation branches assert (the corrected construction, or fpylll/fplll
