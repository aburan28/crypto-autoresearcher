  - "ART-9: the bisected precision is insufficient for a full BKZ tour even at the
    exact cell it was calibrated on -- independently, doubly confirmed (both
    halves reproduced by the Validator's own fresh execution)."
  - "OBJ-1: the bisected precision does not generalize to d=512, even at the
    isolated-step level the bisection itself tested -- independently executed and
    confirmed by the Red Team's own live control, seed-identical to the
    producer's own d=512 instance, with the boundary bracketed to (65, 100] bits
