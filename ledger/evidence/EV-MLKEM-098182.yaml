  # ==================================================================
  # COMPOUND FINDING RECONCILIATION -- THE LOAD-BEARING SECTION
  # ==================================================================
  compound_finding_reconciliation: >-
    THE VALIDATOR'S ART-9 AND THE RED TEAM'S OBJ-1 ARE COMPLEMENTARY, NOT
    CONTRADICTORY, AND THEIR CONJUNCTION IS A GENUINE NARROWING OF WHAT THE 0/6
    OUTCOME LICENSES -- NOT A CONFLICT REQUIRING ADJUDICATION AGAINST A LIVE
    INSTALL, BECAUSE BOTH REVIEWS' OWN EXECUTED CONTROLS ARE MUTUALLY CONSISTENT
    AND EACH TESTS A DIFFERENT AXIS OF THE SAME UNDER-CALIBRATED PRECISION.
    (1) ART-9 (Validator, independently reproducing both halves): at THE EXACT
    CELL the bisection was performed on (d=256, beta=40), 65 bits is confirmed
    sufficient for the isolated LLL-preprocessing step (0.0026s, COMPLETED) but
    confirmed INSUFFICIENT for the full BKZ tour at the identical (d, beta, seed)
    -- this is the operation-level axis: an isolated sub-step is not evidence
    about the full iterative operation, even holding the problem instance fixed.
    This is the third independently-observed instance of KN-FIND-f54a82's own
    already-promoted general lesson, not a new one.
    (2) OBJ-1 (Red Team, independently executed): the SAME 65-bit precision, at
    the ISOLATED-STEP level, fails outright at (d=512, beta=40) -- a dimension the
    bisection never tested at any level -- with a live, seed-identical,
    independently-run control (65 bits: ERROR; 100 bits: COMPLETED, 362.9s
    outer + 0.011s inner). This is the dimension/instance-generality axis: a
    precision minimum determined at ONE (d, beta) instance is not, without
    separate verification, evidence that it holds at a DIFFERENT (d, beta)
    instance, even of the identical cheap sub-step. Critically, the Red Team
    confirmed by direct source inspection (bkz.py line 123, the FIRST call
    `BKZReduction.__call__` makes when handed the corrected construction's
    `LLL.Reduction`) that this is the SAME operation every d=512 main-grid
    cell's own traceback fails on -- so the d=512 ERROR outcomes are, on this
    evidence, at least partly attributable to an under-provisioned precision, not
    solely to the full-tour operation itself.
    TAKEN TOGETHER: the 5 ERROR cells decompose into (at least) two distinguishable
    failure populations that this single, single-instance-calibrated 65-bit run
    cannot itself separate. The three d=512 cells (residual time after the outer,
    construction-independent LLL.reduction(A) pass: ~5.1-5.7s each, per the Red
    Team's own OBJ-3 decomposition) fail almost immediately at the FIRST internal
    call -- the exact signature OBJ-1's own executed control predicts for an
    under-provisioned isolated step, not a genuine, sustained full-tour numerical
    struggle. (d=256, beta=40) fails 156.7s INTO the corrected construction's own
    machinery, deep inside `svp_preprocessing`'s windowed sub-calls -- the
    ART-9 signature (isolated-step-adequate precision, full-tour-inadequate).
    (d=256, beta=55) fails after 576.4s of additional work, two tour levels
    deeper -- also consistent with the ART-9 signature, at a beta the bisection
    did not test either, though at the SAME dimension the bisection did calibrate
    against. (d=256, beta=70) is NOT_COMPUTED (cap-exceeded), and neither
    mechanism's own signature discriminates why -- it remains genuinely open
    under EITHER account.
    WHAT THIS MEANS, STATED AT ITS TRUE WIDTH: the bare fact "0/6 cells completed
    at 65-bit mpfr precision" is real, reproducible, and honestly reported by the
    producer. It does NOT show -- and the Red Team's own executed, reproducible
    control directly falsifies the broader reading that it would show -- that the
    corrected (ROW_EXPO-free, mpfr) construction ITSELF cannot clear Stage 0 at
    d=512, or that raising precision further would not help there. The
    d=256 cells' own status is narrower still: ART-9 shows the bisected precision
    is genuinely inadequate for a full tour even at the one cell it was correctly
    calibrated for, but whether a HIGHER precision (untested at the full-tour
    level anywhere in this goal's history) would let (256,40) or (256,55) clear is
    a separate, still-open question this batch does not answer either way.

