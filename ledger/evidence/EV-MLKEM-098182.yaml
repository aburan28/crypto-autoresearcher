    exactly -- 64 bits ERROR, 65 bits COMPLETED, bit-identical seed and timing
    (ART-2) -- and independently re-traced as a genuine, correctly-executed
    1-bit-resolution binary search consistent with all 9 recorded trials in order.
    Two of the six main-grid cells -- (d=256,beta=40), including its chained
    ReductionError/ValueError, and (d=512,beta=40) -- were independently
    re-attempted end to end with a fresh, non-imported implementation and
    reproduced EXACTLY: identical exceptions, identical call sites and line
    numbers, comparable wall-clock (ART-3, ART-4). SEED_ROOT=715923 and the full
    formula were independently confirmed for all 6 cells, including a corroborated
    derivation of the one value the producer itself could not recover (ART-5).
    Budget/cap arithmetic was independently recomputed and confirmed exact to
    sub-second overhead (ART-6). A minor, non-load-bearing raw-JSON
    summary-field labeling defect was found and disclosed; it does not propagate
    to the human-facing writeup or run_manifest.yaml (ART-8). A significant,
    doubly independently-confirmed observation (ART-9) was surfaced: the bisected,
    isolated-step-minimal 65-bit precision is confirmed sufficient for the
    isolated LLL step but confirmed INSUFFICIENT for the full BKZ tour, even at
    the exact same (d=256, beta=40) cell the bisection was performed on -- a third
    independently-observed instance of KN-FIND-f54a82's own generalizable pattern.
    A `passed` verdict means the receipt is admissible evidence; it authorizes no
    Stage-1 sizing decision, no hypothesis/experiment status change, and no
