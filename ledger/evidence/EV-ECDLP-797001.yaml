  scope_statement: >-
    Snapshot cc290b7e93d01c053af6b72d1106db04e7260539 preserves a
    deterministic pre/post exact-merge verifier, focused tests, and execution
    report. The implementation passes 15 focused tests, 9 inherited merge-
    hygiene tests, and the actual frozen seven-conflict precheck. Fresh
    independent Validator and Red Team reviews at review-breakthrough/max both
    return REVISE after reproducing a forged ledger-success false accept; the
    Validator also reproduces a missed Git directory/file conflict. This
    evidence therefore supports snapshot custody and specific passing controls,
    while rejecting approval of the verifier for merge execution.

  observations:
    - >-
      The snapshot changes exactly four declared paths and all committed hashes,
      sizes, parent, message identifiers, and self-neutral receipt properties
      verify.
    - >-
      The focused suite passes 15/15 and existing merge-hygiene tests pass 9/9.
      Controls cover disjoint first-parent drift, seven-OID-only false assurance,
      alternate or reordered parents, candidate mismatch, dirty and unmerged
      state, standard conflict markers, and explicit failed ledger results.
    - >-
      The actual frozen input at first parent
      53e9fa30f9193fd5fb5e90999e9ae315c3440cf1 and second parent
      f07b67416bf2b5fe5a21fd36b66784399e566e71 passes with five repair-range
      commits, fifteen exact allowed paths, and exactly six add/add plus one
      content conflict.
    - >-
      Both independent reviews reproduce a post-mode PASS from a caller-authored
      JSON claiming validator command, exit_code 0, and new_violations 0 even
      when the validator does not exist and never ran. The result has no trusted
      execution provenance.
    - >-
      The Validator adds a first-parent file shape and second-parent path
      shape/leaf.txt. Git reports an eighth directory/file conflict, while the
      flattened structural detector reports only the expected seven and returns
      PASS.
    - >-
      Red Team identifies inherited GIT_* state, replacement refs, exact Git
      conflict semantics, and marker coverage as required successor hardening.

  inference: >-
    Preserve the snapshot and dual-REVISE artifacts. Do not use the verifier to
    authorize or certify a merge. Open one additive zero-run Executor repair
    limited to removing unauthenticated ledger success, deriving or conservatively
    enforcing exact Git conflict semantics including directory/file conflicts,
    sanitizing Git object/index/replacement state, and adding the reproduced
    cases as regressions. Require a new snapshot and fresh independent max-effort
    Validator and Red Team PASS verdicts before merge planning resumes.

  boundaries:
    - No merge, live-goal edit, BATCH-0bfcc8 activation, implementation-use authorization, or execution authority follows.
    - No ECDLP experiment, solve attempt, benchmark, or scientific measurement ran.
    - No BATCH-1800b3 integrated authority is adopted or suppressed.
    - No hypothesis, experiment, question, or goal scientific status changed.
    - No attack, speedup, asymptotic improvement, security impact, closure, or breakthrough is supported.

  unresolved_confounds:
    - Caller-authored ledger validation is unauthenticated and forgeable.
    - Flattened tree comparison does not represent all Git conflict classes.
    - Git subprocess object/index/replacement environment is not yet fully sanitized and pinned.

