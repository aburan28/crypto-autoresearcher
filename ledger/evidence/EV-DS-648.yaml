  validation_report: coordination/goals/GOAL-ECDLP-001/batches/BATCH-021/reviews/TASK-20260801-001/validation_report.yaml
  validation_report_id: VAL-20260801-001
  red_team_report: coordination/goals/GOAL-ECDLP-001/batches/BATCH-021/reviews/TASK-20260801-002/red_team_report.yaml
  red_team_report_id: RT-20260801-001
  prior_evidence_and_decision: >-
    DEFER-BATCH009-001 and RT-20260731-038 (RT038-B7) required the unplanted
    control before any S1_met or mechanism-support reading of the planted
    relations=200 package. DEC-20260731-019 opened BATCH-020 to obtain it. THAT
    OBLIGATION IS NOT DISCHARGED BY THIS RECORD - see boundaries.

  observations:
    - id: OBS-1
      finding: >-
        THE RUN'S RECORDED STATUS CONTRADICTS ITS OWN FROZEN CONTRACT. The
        manifest and summary record status `completed_valid` with
        `live_plant_detected: false`. specification.v2.yaml line 247 states the
        CTRL-NULL-PLANT pass_condition as "Detection flag true; otherwise harness
        void", and line 329 states "On CTRL-NULL-PLANT failure, stop and report
        harness void (no mathematical negative)". The pre-existing `mode_impl`
        implements exactly that at ds001_driver.py lines 1301-1303
        (`if cell.planted_bug_detected is False: ... status = "invalid_measurement"`).
        THE NEW `mode_ctrl_unplanted` OMITS THAT BRANCH ENTIRELY: across its body
        it only reports the flag and never acts on it, its sole invalidation path
        being the certificate check. The correct recorded status is
        `invalid_measurement` / harness void.
      raised_by: RT-20260801-001
      independently_confirmed_by: >-
        The archiving Coordinator, by direct inspection of specification.v2.yaml
        lines 247 and 329, ds001_driver.py lines 1301-1303, the absence of any
        planted_bug_detected invalidation in the mode_ctrl_unplanted body, and
        the recorded statuses. CONFIRMED.
    - id: OBS-2
      finding: >-
        THE LIVE-PLANT DETECTOR CANNOT FIRE AT ANY CELL OF THIS EXPERIMENT. Its
        rule requires fake_R < 0.5 AND fake_R_null < 0.9; since fake_R_null is
        R_null/4, firing requires R_null < 3.6. Observed R_null is 112.105 here
        and lies in [80.405, 189.133] across the 54 committed planted cells - 0 of
        55 measurements could have fired. The control is deterministically
        non-firing, so re-running it cannot discharge it.
      raised_by: VAL-20260801-001 and RT-20260801-001 independently
    - id: OBS-3
      finding: >-
        THE NULL SPLIT ARM CANNOT PRODUCE A HIT BY CONSTRUCTION. It builds its
        table under side key "L" (ds001_driver.py:653) and looks up under "R"
        (:663) and "J" (:666); side feeds the hash, so no lookup can ever match a
        stored key. The Validator measured 0 hits in 40000 lookups. R_null
        therefore measures a handicap, not a matched null object. NOTE, AND IT
        MATTERS FOR DISPOSITION: the surrounding comments ("Independent right key
        - does NOT equal a compositional complement", "forcing a synthetic join
        key ... (no structure)") indicate this is DELIBERATE rather than a slip.
        Deliberate or not, it is not a matched null; whether it is a defect or an
        intentionally structure-free null that is nonetheless unfit for this gate
        is NOT adjudicated here.
      raised_by: VAL-20260801-001
      independently_confirmed_by: >-
        The archiving Coordinator, by reading ds001_driver.py lines 645-675.
        CONFIRMED as to mechanism.
    - id: OBS-4
      finding: >-
        THE REPORTED BOOTSTRAP INTERVAL IS NOT A CONFIDENCE INTERVAL FOR R. R is a
        ratio of arm totals including table build; the bootstrap resamples
        per-search times and estimates E[ws/wn], a different estimand. R =
        0.036552 lies below its own reported 95% interval [0.108, 0.415]. This
        occurs in 41 of 54 committed planted cells - 23 below and 18 above, so it
        is systematic rather than one-directional. Independently recomputed by the
        orchestrator, the Validator and the Red Team, all obtaining 41/54.
      raised_by: producer, then confirmed and mechanised by both reviews
      consequence: >-
        The CI conjunct of CTRL-RT025-UNPLANTED's falsification rule and of spec
        S1 is unusable as written, as is calibration_perturbation_sign_stable,
        which derives from the same interval.
    - id: OBS-5
      finding: >-
        R IS A SINGLE-SHOT WALL-CLOCK RATIO. Because all four arms have
        n_usable = 200, the rho conversion factor cancels exactly and R reduces to
        wall_split/wall_naive. `backend_units` and `n_enumerations` are
        accumulated but NEVER READ into any metric in either package, so the
        BACKEND_ID advertisement "+charged-units-v1" reaches no reported number.
        No replicate of R exists in evidence.
      raised_by: VAL-20260801-001 and RT-20260801-001 independently
    - id: OBS-6
      finding: >-
        A STATEMENT IN THE COMMITTED EXECUTION REPORT IS FALSE. It defends the
        non-detection by citing a sibling bits=16 run that "DID detect its plant".
        On the committed numbers that run's detection came from a hardcoded
        synthetic path (synth_R, synth_Rn = 0.05, 0.05) and/or a tautological
        comparison, while its live figure fake_R_null = 20.0654 fails the honest
        rule. The live detector has never fired honestly anywhere in EXP-DS-001;
        this run is its first honest evaluation, and it failed.
      raised_by: RT-20260801-001
      status: >-
        Reported at the Red Team's own confidence. The archiving Coordinator did
        not re-execute the sibling run and does not restate it as verified.
    - id: OBS-7
      finding: >-
        WHAT DID PASS, STATED SO THE RECORD IS NOT ONE-SIDED. Targets are genuinely
        unplanted (random_uniform_target draws k uniform in [1, n-1] and returns
        k*P; the planted generator is unreachable from this path). The live /4
        companion is genuinely free of the forbidden synthetic known-answer
        shortcut - which is precisely what made OBS-2 visible. The shared backend
        is byte-identical over its first ~1580 lines with both deletions being CLI
        wiring, so no pre-existing function body was altered. R and R_null
        reproduce bit-for-bit from the recorded costs. The certificate verifies.
        NOTHING IS FABRICATED ANYWHERE IN THE PACKAGE, and planted_bug_detected
        was reported honestly as false while a hardcoded True sat in the same file
        - which is the only reason OBS-6 was findable at all.
      raised_by: VAL-20260801-001 and RT-20260801-001

  inference:
    producing_task: TASK-20260731-044
    producing_policy_requested: executor-implementation
    producing_model_resolved: claude-sonnet-5
    producing_fallback_used: false
    review_policy_requested: review-adversarial
    review_models_resolved: [claude-opus-5, claude-opus-5]
    review_independence: >-
      Both reviews ran as independent sessions that did not produce the artifact,
      concurrently, with disjoint write scopes and no coordination.
    model_independence_limitation: >-
      BOTH REVIEWS RESOLVED TO THE SAME MODEL IDENTITY (claude-opus-5). Reviewer
      independence here is session and role independence, NOT model independence.
      No closure quorum is claimed or claimable from these two reviews.
    reasoning_effort_limitation: >-
      review-adversarial's floor is reasoning_effort xhigh. THIS HARNESS EXPOSES NO
      CONTROL OVER SUBAGENT REASONING EFFORT, so the floor could be neither
      requested nor verified. Recorded as an unmet-and-unverifiable requirement
      rather than asserted as satisfied.

  boundaries:
    - >-
      DEFER-BATCH009-001 AND RT038-B7 REMAIN UNDISCHARGED. The unplanted control
      they require has now been attempted and is harness void. The obligation
      survives intact and is NOT weakened by this attempt.
    - >-
      NO READING OF R OR R_null IS SUPPORTED, in either direction, at this cell or
      any other. S1 is unreachable on these inputs: its "plant detected" conjunct
      cannot be satisfied while OBS-2 holds, and its CI conjunct is unusable while
      OBS-4 holds. F2_eligible fires in 0 of 54 planted cells.
    - >-
      SCOPE IS ONE CELL AT TOY TIER: bits=20, B=64, m=4, seed=101, one execution,
      no replicate. Nothing here is a cryptographic-scale statement, a cost claim,
      a yield claim or an asymptotic claim.
    - >-
      H-IC-001 AND H-STR-002 ARE UNTOUCHED by this record. H-DS-001 does not move:
      a void harness moves no hypothesis in either direction.
    - >-
      THE INSTRUMENT WAS PRODUCER-AUTHORED. ds001_driver.py's --mode
      ctrl-unplanted (787 insertions) was written by the same session that ran it.
      That is the reason this evidence record exists in the form it does, and the
      reviews were directed at the code first and the numbers second.

  unresolved_confounds:
    - >-
      THE COMMITTED DRIVER IS NOT BOUND TO THE EXECUTED ONE. The run was made from
      a dirty tree with no source hash recorded, so no artifact proves the
      committed file is the file that ran. Raised by RT-20260801-001; the
      archiving Coordinator confirms no code-hash field exists in the manifest.
    - >-
      RUN-TO-RUN VARIANCE EXCEEDS THE REPORTED EFFECT. The null arms do
      bit-identical deterministic work in both packages, yet R_null moved
      100.858 -> 112.105 (11.2%) while R moved 0.03404 -> 0.03655 (7.4%), across
      different OS/arch/Python. Reported by RT-20260801-001 as its most
      load-bearing hidden assumption: that R is a property of the algorithms
      rather than of two implementations and the machines they ran on.
    - >-
      NO DECOMPOSITION CERTIFICATE EXISTS FOR THE 800 CLAIMED RELATIONS, and the
      in-search check lives inside the solver's own code path, which
      docs/claims-and-verification.md excludes. Raised by RT-20260801-001.
    - >-
      REPRESENTATION DENSITY MAY HAVE VOIDED THE CONTROL'S POWER INDEPENDENTLY.
      The Validator enumerated all 8157 distinct 2-sums and found all 240
      non-identity elements of <P> are signed 4-sums of the factor base, so every
      unplanted target was decomposable and the yield-collapse falsification
      branch was unreachable. The Red Team proposed the matching direct
      measurement (histogram all C(130,3) triples) as the cheapest falsification.
      BATCH-021 AUTHORIZES NO RUN, so it was correctly NOT performed.

  r1_adjudication: >-
    r1_cell_label `S1_eligible_on_null_axis` is MECHANICALLY CORRECT - both
    reviews confirm it follows the R-1 rule character-for-character - and is
    correctly scoped in the producer's own artifacts as an observation that one
    cell cannot convert into S1 (the spec requires >= 2 bit sizes). IT IS ALSO
    SUBSTANTIVELY VACUOUS: its only non-trivial conjunct, R_null >= 0.9, is
    guaranteed by the broken null of OBS-3, holding in 54/54 planted cells with
    minimum 80.4. The label carries one bit ("R < 0.5") and nothing about the null
    axis. It must not be cited as evidence of anything on that axis.

  asymptotic_promotion_gates: >-
    NOT APPLICABLE AND NOT APPROACHED. No asymptotic claim is made or available.
    None of the four gates in the coordinate-research-goal promotion rule is
    engaged by this record.

  binding_constraints_from_red_team:
    - Harness void supports no reading of R in either direction, and is not a mathematical negative.
    - >-
      Re-running the control at more cells cannot discharge it while the detector
      is deterministically non-firing; the repair must change the detector or the
      null, not the sample size.
    - >-
      dominated_by is NOT null: rho solved the same instance in the same process
      in 744 group operations / 1.24 ms while the arms spent 14.7 s and 0.54 s
      harvesting. Any future framing of this experiment must state that.

  reviewed_by:
    - VAL-20260801-001
    - RT-20260801-001
