evidence:
  id: EV-DS-648
  supersedes: null
  supersession_note: >-
    EV-DS-648 does NOT supersede EV-DS-002. EV-DS-002 remains the operative
    evidence for the relations=200 planted package. This record covers ONE
    additional control run and adds a harness-validity finding that bears on
    EV-DS-002's instrument, without re-adjudicating EV-DS-002's content.
  related_prior_evidence: [EV-DS-001, EV-DS-002]
  authorizing_decision_id: DEC-20260801-629
  hypothesis_id: H-DS-001
  experiment_ids: [EXP-DS-001]
  run_ids: [RUN-DS-001-ctrl-unplanted]
  type: control
  direction: none
  direction_scope: >-
    NO DIRECTION IN EITHER SENSE. This record supports NO reading of R or R_null,
