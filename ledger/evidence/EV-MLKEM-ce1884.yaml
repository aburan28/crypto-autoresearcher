  what_this_evidence_is: >-
    The resolution of ANOM-5, plus the per-model residual archive that makes
    BATCH-012's deep-tail table checkable. Zero new sampling of the physical
    system. Its most important content is a correction to a theorem this
    Coordinator confirmed and should not have.

  observations:
    - >-
      U-1 (ESTABLISHED, and it dissolves the anomaly). ANOM-5 IS THE ESTIMATOR'S
      NULL OBJECT, NOT ITS ARITHMETIC. D_T in the mid band is a sum over only
      nb_iteration iterations with per-iteration occupancy up to 0.739, so the
      admissible dispersion floor is mean_T(1 - mu_T/N) = 0.9183 for the n=43 mid
      band rather than the Poisson point 1.0 that BATCH-014 measured against.
      Producer z = -2.452 against the point null becomes -1.432 against the floor;
      the validator's independent instrument gives -2.352 and -1.522. The honest
      residue is -1.4 to -1.6 sd, WHICH IS NOT AN EFFECT.
    - >-
      U-2 (THE FLOOR'S NUMBER IS RIGHT AND ITS THEOREM IS WRONG, validator D-1,
      material). The stated derivation concludes "under ANY independent-iteration
      model". That is FALSE. The final step requires sum_i p_i^2 <= mu^2/N, and
      the Cauchy-Schwarz inequality invoked gives the OPPOSITE direction,
      sum_i p_i^2 >= mu^2/N. The validator ran a counterexample through its own
      instrument: floor(mu_T) iterations contributing 1 deterministically plus one
      Bernoulli(frac) is an independent-iteration model returning phi = 0.00433
      +/- 0.00039, about 2300 sd BELOW the claimed floor. The missing hypothesis
      is IDENTICAL DISTRIBUTION, which the file header supports and which the
      pooled-rate estimator already assumes.
    - >-
      U-3 (THE COORDINATOR CONFIRMED THE FAULTY QUANTIFIER). The BATCH-015
      snapshot receipt states the inequality holds under any independent-iteration
      model and records a Coordinator re-derivation as confirming it. That
      re-derivation checked Var(X) >= E[X] - E[X]^2 correctly and then silently
      assumed identical per-iteration means when summing. The assumption was never
      flagged, so the check could not have caught the error it was supposed to
      catch. Recorded here because a confirmation that shares the claim's blind
      spot is worse than no confirmation.
    - >-
      U-4 (UNDER THE CORRECTED HYPOTHESIS THE FLOOR IS EXACTLY TIGHT). The
      validator derived the general minimum-variance law for a non-negative-integer
      summand -- a two-point distribution on {floor(p), ceil(p)} with variance
      frac(p)(1-frac(p)) -- and confirmed it coincides with 1 - mu_T/N at every
      cell because every occupancy is at most 0.739 <= 1. Its own N2 null mean,
      0.918627, sits on the analytic floor 0.9182566. So the floor is the exact
      minimum under i.i.d. iterations, not merely a bound, and U-1's numbers stand.
    - >-
      U-5 (THE DEEP-TAIL NULL SURVIVES DECISIVELY, so BATCH-014's T-1 is
      untouched). Occupancy there is 0.0023 and 0.0011, giving floors 0.99974 and
      0.99986 unbinned. The validator additionally checked it under BATCH-014's
      OWN coarser binning -- about 80 and 85 bins, floors 0.9969 and 0.9981, worst
      bin 0.9945 -- against sds of 0.05 to 0.15. The correction that dissolves the
      mid-band anomaly does not touch the deep tail.
    - >-
      U-6 (THE NEW n=50 OVER-DISPERSION IS REAL ARITHMETIC AND WEAK AS AN
      ANOMALY). The producer recorded the symmetric consequence that n=50's mid
      band moves +1.66 to +2.25 sd; the validator obtains +2.31. But the
      admissible set is [floor, infinity), so over-dispersion has no bound to
      violate; M-a3 already supplies a mechanism, with Pgood showing 14.35 percent
      per-iteration CV in score scale; and it is the largest of six readings, so
      p is about 0.15 after multiplicity. Recorded, not escalated.
    - >-
      U-7 (JOB B RECONSTRUCTS COMPLETELY). All 24 fits by 5 bands per file
      recompute from the archived residuals_bits to 2.6e-10 bits; the validator's
      independent counting floors reproduce to 0.0e0; BATCH-014's flags read back
      and match; and the headline 0.7974 against 2.3938 is exact. The four rows
      BATCH-012 flagged reconstruction_valid: false are now checkable, and the
      flags were correct.
    - >-
      U-8 (BUT JOB B'S INFERENCE DOES NOT HOLD, validator D-4, material -- and
      the corrected reading is STRONGER than the one the Coordinator promoted).
      For M1a both fits share p = 26.0 and their deep-tail residuals differ by a
      RIGID CONSTANT of 0.826803 bits at every score with C < 1000. Decomposing rms
      into bias plus centred scatter: M1a's centred-scatter-over-floor is 0.5656
      under BOTH fits, M4 is 0.6148 under both, SENS 0.6148 under both, M2
      0.7684 and 0.7666. Only M1 and M3, whose shape parameters actually changed,
      move. So the fit-dependence is a normalisation BIAS and the scatter deficit
      is fit-INDEPENDENT for four of six models. With effective dof O(1) (range
      1.51 to 2.35; restricting to C >= 1000 buys no degrees of freedom, being the
      same O(1) family) neither 0.57 nor 2.39 is resolved from 1.0. The correct
      qualification of BATCH-012 is therefore "UNRESOLVED UNDER BOTH FITS", not
      "a property of the whole-band-fitted normalisation".
    - >-
      U-9 (M-a4 IS NOT WHOLLY UNTESTABLE, validator D-3). The producer declared
      the shared-random-source mechanism untestable from this archive. A uniform
      variance-scaling version of it is testable and is excluded: it would need
      c = 0.8737, and the deep tail reads +3.10 sd (n=43) and +3.21 sd (n=50)
      against that, from numbers already present in the producer's own
      results.json. The general non-uniform mechanism remains untestable.
    - >-
      U-10 (THE SECOND DEGENERATE CONGENIAL CONTROL IS CONFIRMED). The validator
      reimplemented make_bins_from_observed and reproduced the degeneracy:
      BATCH-014's control_observed_count_binning yields 297 bins over 301 scores
      in the n=43 mid band, because it closes on the OBSERVED count crossing 10
      and every mid-band increment is at least 6. Its agreeable 0.8008 reading
      tested almost nothing. Binning is genuinely excluded, but by the
      expected-count binner giving 301 bins over 301 scores, leaving no freedom.
    - >-
      U-11 (EXCLUSIONS CONFIRMED). Format excluded decisively: 0 mismatches in
      1804 and 2311 lines on a bit-exact printf round-trip, max |v*M - round| of
      1.5385e-6 and 2.3190e-6 against a 0.5 margin, gcd of increments 1, minimum
      mid-band increment 6. Estimator arithmetic excluded: the validator's third
      independent implementation agrees bit-for-bit. Positive, negative and decay
      controls all pass.
    - >-
      U-12 (SMALLER DEFECTS). D-2: M-a4 names the wrong broken assumption --
      stratification breaks identical distribution, not independence. D-5: the
      n=50 observed-count binner is 470 bins, not 475, in report prose. D-6:
      M-c5's "inside about 1.5 sd everywhere" is contradicted by its own sweep,
      which contains -1.635, +2.778 and +10.163. D-7: the shallow-band binding
      floor is 1.04e-2, not the multinomial 0.9991. D-8: "1409 bins" is
      over-precise, the honest range being 1321 to 1488. D-9: the +0.104 lag-1
      autocorrelation makes the quoted |z| marginally optimistic.
    - >-
      U-13 (THE COORDINATOR'S BAD HANDOFF NUMBERS DID NO DAMAGE). The handoff
      supplied reference values that are not in the archive. The validator
      confirms the producer's reconciliation is honest and accurate on every line
      and that NO VERDICT DEPENDED ON THEM.

  inference: >-
    ANOM-5 is the estimator's null object. Measuring a finite-iteration
    occupancy-0.739 statistic against the Poisson point 1.0 was the wrong
    reference; against the correct floor the residue is about -1.5 sd, which is
    not an effect. The floor is exactly tight under i.i.d. iterations, but the
    "any independent-iteration model" quantifier is false and must not be carried
    forward. The deep-tail null is untouched. BATCH-012's deep-tail table is now
    reconstructible, and its honest qualification is that those ratios are
    unresolved under both fits, because the statistic carries O(1) degrees of
    freedom either way.

  boundaries:
    - >-
      Two archived toy-dimension files; establishes NOTHING about ML-KEM security
      and nothing about Carrier et al.'s Kyber cost figures.
    - >-
      The floor result holds under INDEPENDENT AND IDENTICALLY DISTRIBUTED
      iterations. The header supports identical distribution and the pooled-rate
      estimator assumes it, but it is an assumption and is not verified from
      per-iteration data, which the archive does not contain.
    - >-
      A residue of about -1.5 sd and a +0.104 lag-1 residual autocorrelation
      remain unexplained and unresolvable in this archive; roughly 1321 to 1488
      bins would be needed for 3 sd and the archive has 301.
    - >-
      The general non-uniform shared-random-source mechanism is untestable here.
    - One investigation and one validation. No red-team pass on this batch.

