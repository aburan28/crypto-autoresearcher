    - "FROB-NOLATTICE-q13n5's second curve and FROB-EXT-q13n7 are explicitly out of scope of this amendment (DEC-20260921-e81e25) and SR-4 respectively; this record says nothing about them."
    - "extra=0 primary (OA-1); combinatorial half of relation collection only (OA-2 through OA-6), per specification.yaml's own hidden_overhead_disclosure -- nothing here is a solve-cost ranking, an attack, or a security statement about any curve."
    - "Only 2 of 15 achievable set-partitions are `ok` (non-empty_base) for either tested curve; `spread` on these cells is therefore a 2-point (m=1, one m=2 partition) max/min ratio, not a richer statistic -- a scope fact bearing directly on how much information any tie here can carry (see the m=1-forced-tie structural observation above)."
    - "C5 (ker Tr identity) and success_criterion clauses (1)-(5) are unchanged by this run (field-level facts already established in RUN-FROB-91ee9c-7119f2, not recomputed here per manifest.yaml's controls_not_recomputed field) and remain holding, as recorded in EV-FROB-2fe225; this record concerns ONLY clause (6) and falsification clause (c)."
  unresolved_confounds:
    - "WHY FROB-SPLIT-q11n5 and FROB-EQDEG-q19n5 show opposite block-product/collision patterns (PTM-2(ii) mixed result) is not explained by this record; a further, differently-designed experiment or a theoretical account would be needed to resolve it."
    - "The m=1-forced-tie structural argument is a new, review-derived observation, not independently checked by a second reviewer in this round (PD-1: single coordinator-subagent session)."
    - "Only ONE informative curve per cell was tested; cross-curve replication (a second informative curve per cell) remains entirely absent, capping this record's strength at preliminary per specification.yaml's own text."
    - "Whether a redesigned spread-type statistic (giving the fine-partition collision comparison more than a single binary data point) or an extended achievable-partition lattice would give clause (6)/(c) genuine statistical power at this scale is an open design question, not addressed by this record."
  obstruction:
    statement: >-
      On the tested informative object curve of each of two core cells
      (FROB-SPLIT-q11n5 and FROB-EQDEG-q19n5), the matched-cardinality
      random control (C3) and the matched-cardinality geometric null-curve
      control (C4) show a cost_ratio_neg spread EXACTLY EQUAL to the object
      arm's spread, not strictly smaller, and the non-stable
      matched-dimension control (C2) additionally shows a LARGER spread
      than the object arm on FROB-EQDEG-q19n5. Object-arm spread variation
      here is therefore not shown to be strictly more pronounced than every
      matched control's, as success_criterion clause (6) requires.
    quantity: >-
      spread(cost_ratio_neg) at extra=0, compared object arm vs. C2/C3/C4
      control arms, per cell.
    value: >-
      FROB-SPLIT-q11n5 (N=10061): object=2055/451 (~4.557); C2=4365/1936
      (~2.255, strictly smaller); C3=2055/451 both seeds (exact tie);
      C4=2055/451 both seeds (exact tie). FROB-EQDEG-q19n5 (N=117991):
      object=6152/861 (~7.145); C2=24632/2223 (~11.081, strictly LARGER);
      C3=6152/861 both seeds (exact tie); C4=6152/861 both seeds (exact
      tie). All values exact rationals, independently rederived by hand from
      raw (p_m, U_neg) pairs (analysis.md Round 2 Section 0) and confirmed
      against report.md and work/checker-report.json with zero discrepancy.
    measured_by:
      - RUN-FROB-91ee9c-51bc02
      - RUN-FROB-91ee9c-7119f2
    scope: >-
      FROB-SPLIT-q11n5 curve A=1,B=2,N=10061 and FROB-EQDEG-q19n5 curve
      A=1,B=1,N=117991 only, at extra=0, under the frozen combinatorial cost
      model (no per-trial algebraic cost included). No claim is made about
      FROB-NOLATTICE-q13n5's second curve, FROB-EXT-q13n7, curve index 0 of
      either core cell, any other (q,n) cell, or any deployed curve.
    resource_check:
      examined: true
      reading: >-
        A theory under which this tie/excess is a RESOURCE rather than a
        pure refutation: the analysis above shows the m=1 (coarsest)
        endpoint of `spread` is algebraically FORCED to equal the object's
        for any cardinality-matched control, so `spread` as defined on
        these two-achievable-partition cells can only ever discriminate
        structure from cardinality through a SINGLE collide/don't-collide
        comparison at the one finest partition. This decomposition is
        itself a usable design input for a follow-up: either (a) a
        redesigned statistic that isolates the fine-partition
        collision-count comparison directly (rather than a max/min ratio
        whose numerator endpoint is pinned by construction), giving the
        comparison genuine statistical power beyond one binary sample per
        (cell, control, seed); or (b) a differently chosen or additionally
        searched object curve/cell whose achievable partition lattice
        yields MORE than two `ok` partitions on the informative curve, so
        `spread` reflects more than one collision/no-collision data point.
        No such follow-up hypothesis or experiment record is spawned by
        this decision; it is recorded here as a reading for the Coordinator
        to route on rerank (see DEC-20260921-d5e997's next_actions), per
        AGENTS.md "Closure gate."
      spawned_ids: []
  reviewed_by: coordinator
