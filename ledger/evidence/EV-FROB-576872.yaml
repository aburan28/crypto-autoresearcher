                                 # available and is disclosed as empirical_only
                                 # rather than overstated as a derivation.
  proof_refs:
    - experiments/EXP-FROB-91ee9c/analysis.md#Round-2-Section-0
  observations:
    - >-
      J1 (holds): both (cell, curve) targets named in DEC-20260921-e81e25
      reached status `ok`. The object arm was recomputed from scratch and
      matched RUN-FROB-91ee9c-7119f2's recorded curve-index-1 values exactly
      on both cells (manifest.yaml result.object_arm_consistency_check: PASS
      both; report.md section 1's table; independently re-derived in
      analysis.md Round 2 Section 0 from metrics.json's raw `measured`
      (p_m, U_neg) pairs BEFORE report.md was opened). checker.py is pure
      stdlib (`import sys, os, json, itertools; from fractions import
      Fraction` only, grep-confirmed; no import of implementation.py,
      core.py or lattice.py) and its own independent recomputation agrees
      with the driver's on every check (work/checker-report.json:
      cost_ratio_all_match=true, C3_C4_U_neg_matched_cardinality_ok=true,
      consistency_checks_agree=true, both cells; 0 mismatches across 12
      reverifications per cell). The disclosed skip of a full independent
      order recount for FROB-EQDEG-q19n5 (pure-Python runtime cost) matches
      the same disclosed-limit pattern already accepted for RUN-FROB-91ee9c-7119f2's
      C8 in EV-FROB-2fe225.
    - >-
      J2 (holds, exactly): every cost_ratio_neg and every spread was
      independently recomputed by hand from the raw (p_m, U_neg) pairs in
      metrics.json's `measured` object, BEFORE opening report.md,
      cost-model.json or work/checker-report.json (analysis.md Round 2
      Section 0), and matches those artifacts' own stated numbers in all 24
      checks performed (12 per cell: object m=1/m=2 ratios, C2 m=1/m=2
      ratios, C3 m=1/m=2 ratios x2 seeds, C4 m=1/m=2 ratios x2 seeds, per
      cell). Zero discrepancy. I(FROB-SPLIT-q11n5)=2055/451 and
      I(FROB-EQDEG-q19n5)=6152/861 (already established in round 1) are
      reproduced exactly from this run's own independently recomputed raw
      data as well.
    - >-
      J4: collision counts (block_sizes, prod_tuple_count, distinct_targets)
      confirmed directly from metrics.json's raw fields, every ok partition,
      every arm, both cells. FROB-SPLIT-q11n5: C2's [2,2] partition (block
      product 6*6=36) shows a 2x collision (36->18 distinct targets); the
      object/C3/C4's [2,2] partition (block product 10*10=100, LARGER) shows
      zero collisions (100=100). FROB-EQDEG-q19n5: C2's [2,2] partition
      (block product 24*24=576) shows a 2x collision (576->288); the
      object/C3/C4's [2,2] partition (block product 10*30=300, SMALLER)
      shows zero collisions (300=300). This CORRECTS
      ledger/handoffs/TASK-20260921-1dba2a.yaml's own coordinator_prior,
      which asserted C2's colliding partition has "SMALLER block products
      than the object/C3/C4 ... on BOTH cells" -- true for
      FROB-SPLIT-q11n5 (36<100) but FALSE for FROB-EQDEG-q19n5 (576>300),
      caught independently from the raw block_sizes before opening any
      blind_from file (analysis.md Round 2 Section 0).
    - >-
      J3 (the load-bearing joint): success_criterion clause (6), read
      verbatim, requires ALL of C2, C3 and C4 to show STRICTLY SMALLER
      spread than the object arm, in EVERY completed cell.
      Measured: FROB-SPLIT-q11n5: C2 strictly smaller (spread 4365/1936 <
      object 2055/451); C3 EQUAL to object (2055/451, both seeds); C4 EQUAL
      to object (2055/451, both seeds). FROB-EQDEG-q19n5: C2 LARGER than
      object (spread 24632/2223 > object 6152/861); C3 EQUAL to object
      (6152/861, both seeds); C4 EQUAL to object (6152/861, both seeds).
      Clause (6) is NOT MET in either cell, on real, non-degenerate data
      (every arm's spread is genuinely >1 in both cells -- unlike round 1's
      vacuous spread=1 case on curve index 0). Falsification_criterion
      clause (c) ("any of C2, C3 or C4 shows a spread greater than or equal
      to the object's") is literally TRIGGERED in both cells, via the C3/C4
      ties (>= includes equality) and additionally via C2 on
      FROB-EQDEG-q19n5.
    - >-
      proves_too_much PTM-2, applied as the review plan requires before
      ruling on J3: (i) does C2 also trivially match the object on both
      cells (which would mean the instrument has no general discriminating
      power)? Does NOT fire -- C2 diverges genuinely on both cells (smaller
      on SPLIT, larger on EQDEG). (ii) does the collision-count pattern
      reverse so that smaller constructions collide LESS, consistent with a
      pure scale-artifact story (the plan's own named firing condition)?
      MIXED, cell-dependent: on FROB-SPLIT-q11n5 the smaller construction
      (C2, product 36) collides MORE than the larger (object/C3/C4, product
      100, zero collisions) -- argues AGAINST a scale-artifact reading; on
      FROB-EQDEG-q19n5 the pattern REVERSES -- the larger construction (C2,
      product 576) collides while the smaller (object/C3/C4, product 300)
      does not -- which IS the reversal the plan names as a PTM-2 firing
      condition. PTM-2(ii) therefore fires on FROB-EQDEG-q19n5 specifically
      but not on FROB-SPLIT-q11n5: a genuinely mixed outcome, not the clean
      uniform pass the handoff's own coordinator_prior predicted.
    - >-
      A structural fact independent of PTM-2, derived from
      specification.yaml's own C3 design text (analysis.md Round 2 Section
      0): the m=1 (coarsest) endpoint of the spread ratio is algebraically
      FORCED to equal the object's for any cardinality-matched control
      (exactly for C3; up to a canceling scalar for C4), in every cell,
      regardless of any structural difference -- because a single slot's
      p_1 = |B_1|/(N-1) is a pure function of cardinality and N, with no
      possibility of a collision effect when there is only one slot. This
      means C3's and C4's capacity to show a strictly smaller spread than
      the object, on these two-achievable-partition cells, reduces entirely
      to whether the ONE finest (argmin) partition shows more collisions on
      the object than on the control -- a single collide/don't-collide data
      point per (cell, control, seed), not a richer statistic.
  inference: >-
    Success_criterion clause (6) is NOT MET, unambiguously, in both
    completed cells, on real (non-degenerate) data; this conclusion holds
    regardless of PTM-2's outcome, since the C3/C4 ties (and, on EQDEG, C2's
    excess) hold independent of the collision-count interpretation.
    Falsification_criterion clause (c) is TRIGGERED in both cells under a
    literal reading, and the review's required proves-too-much check does
    NOT uniformly undermine that reading the way it did in round 1 (where
    PTM-2 cleanly broke the ONLY reading that would fire clause (c), on
    truly vacuous data): here PTM-2 undermines the reading only PARTIALLY
    and only on FROB-EQDEG-q19n5, while FROB-SPLIT-q11n5's trigger is
    comparatively less qualified by the collision-count check specifically
    -- though both cells' ties are qualified by the independent, uniform
    structural fact that C3/C4's coarse endpoint can never differ from the
    object's by construction, which bounds how much information any tie
    here can carry: to the ONE tested fine partition's collision behaviour,
    not to a broader structural claim. Given (a) a genuine, non-vacuous
    falsification-clause trigger on real data (materially different from
    round 1's evidence), (b) a partial, cell-dependent proves-too-much
    complication preventing a clean, uniform "attributable to Frobenius
    structure" reading, and (c) AGENTS.md's binding rule that reject_scoped
    is forbidden on a single, unreplicated, empirical_only run regardless of
    signal cleanliness, the evidence supports WEAKEN, not reject_scoped,
    support, or a second inconclusive verdict: this round's recheck data DID
    exercise the comparison round 1 could not, and it did not confirm
    clause (6).
  boundaries:
