  preregistered_verdicts:
    Q1_no_low_arity_headroom: held
    Q2_m2_dead_everywhere: held
    Q3_degree_law: held
    Q4_anf_dense: held
    Q5_anf_crossover: held
    Q6_solver_exponent: held

  observations:
    - >-
      THE HEADLINE, and the reason this record exists: below n about 300 the
      binding obstruction to index calculus on the standardised binary curves is
      NOT that the decomposition system is hard to solve. It is that the system
      is too large to WRITE DOWN inside the entire Pollard rho budget. At the
      best viable arity the descended ANF exceeds the whole per-decomposition
      budget by +6.3 bits at n = 233, +18.8 at n = 283, +24.2 at n = 113, +25.6
      at n = 127, +40.8 at n = 131 (ECC2K-130) and +37.4 at n = 163 (K-163).
      No solver, however good, removes a term that is paid before the solver is
      called.
    - >-
      AND THE CROSSOVER IS REAL. At n = 409 the same quantity is NEGATIVE
      (-4.9 bits at m = 4, -3.3 at m = 5) and at n = 571 it is -38.5 and -49.7.
      The ANF grows POLYNOMIALLY in n, like n^{m(m-1)}, while the rho budget
      grows EXPONENTIALLY, like 2^{n/2}, so the polynomial must eventually pass
      under the exponential; this locates where. The crossover lies strictly
      inside (283, 409], exactly as preregistered.
    - >-
      At n = 409 and n = 571 the question therefore reduces cleanly, and for the
      first time in this lane quantitatively, to a SOLVER question: form a
      degree-12 Boolean system in 392 (resp. 556) variables and solve it within
      2^79.3 (resp. 2^119.0) operations. That is an exponent of 0.202 and 0.214
      in the descended variable count.
    - >-
      Q1 HELD. No m <= 3 cell exceeds 10 bits of per-decomposition budget at any
      of the nine degrees. Charging sparse linear algebra against rho caps the
      factor-base dimension near n/4 + log_2(R)/2, and with that cap m*l < n at
      m <= 3, so the decomposition probability collapses and the attempt count
      alone overruns rho. The minimum viable arity is 4 at every degree without
      the Frobenius orbit quotient, and 3 only at n = 113, 127 and 233 with it,
      where the budget is +1.6, +6.2 and +2.2 bits respectively.
    - >-
      Q2 HELD. m = 2 is NEGATIVE at every one of the nine degrees, from -25.8
      bits at n = 113 to -153.5 at n = 571. It loses to rho even if every
      decomposition were free.
    - >-
      THIS GENERALISES A RESULT THE LANE ALREADY HAD. EV-ICPERF-10c5fc found
      that at ECC2K-130 "even a FREE oracle leaves m = 3 above rho, so no oracle
      engineering at m = 3 can produce a crossover". That is the n = 131, m = 3
      cell of this table, reached from a different premise (a Riemann-Roch
      decomposition oracle) and agreeing in sign and in kind. The present record
      extends it from one curve and one arity to nine degrees and five arities,
      and supplies the mechanism: the linear-algebra cap on l.
    - >-
      Q3 HELD, and the measurement CORRECTED the law it was testing. The
      Weil-descended Boolean degree is exactly m * min(m-1, l) on all 14 degree
      cells: 2 at m = 2, 6 at m = 3, 12 at m = 4. The cap at m*l is not
      cosmetic -- the (n, m, l) = (8, 4, 2) cell came back at degree 8, not 12,
      because each x_i is a linear form in only l Boolean variables. The
      originally drafted law m(m-1) was wrong there and was corrected BY the
      measurement before any conclusion used it.
    - >-
      Q4 HELD. The descended ANF is dense: measured distinct-monomial counts run
      from 0.269 to 0.867 of the dense bound sum_{i<=D} C(ml, i) across all 14
      cells, so that bound is tight to within about two bits and is a fair
      charge for forming the system. The count is not a loose over-estimate, and
      the headline in the first observation does not depend on a slack bound.
    - >-
      WHAT THE FROBENIUS ORBIT QUOTIENT IS ACTUALLY FOR. EV-FROB-d336b0 showed
      the orbit gain is exactly n and never more. Here is where that n does real
      work: it is the only term that relaxes the linear-algebra cap on l, and it
      is what moves the minimum viable arity from 4 to 3 at n = 113, 127 and 233.
      It buys single-digit bits against deficits of 20 to 40, so it changes which
      cells are nominally live and changes no verdict.
    - >-
      Q6 HELD. The m = 2 Groebner ladder, twelve rungs from 8 to 30 descended
      variables with NO censored cell, fits a slope of 0.5648 in the descended
      variable count, 95% interval [0.4945, 0.6351] on SAT targets and
      [0.5177, 0.6418] on random ones. That interval contains EV-ICI-001's
      independently measured per-PDP slope of 0.5581 [0.5359, 0.5805], obtained
      with a different solver and a different instrument on the same object.
      Two instruments that share no code agree on the exponent.
    - >-
      THE MEASURED COST OF THE ARITY THE MODEL FORCES, at a FIXED descended
      variable count of 12, so nothing is confounded by problem size: m = 2
      (Boolean degree 2) solves in 0.028 s, m = 3 (degree 6) in 2.008 s, m = 4
      (degree 12) in 20.261 s. A factor of about 724 from m = 2 to m = 4 at the
      same number of variables, bought purely by the degree rising 2, 6, 12.
      This is the squeeze in one line: the cost model forces m >= 4, and m >= 4
      is where the descended system is hardest.
    - >-
      The m = 4 / n = 12 cell is, as far as this repository records, the FIRST
      measured binary point-decomposition cost cell at arity 4 -- the gap
      IDEA-20260807-32f96d named. One cell is not a slope and is not reported as
      one: the fit function refuses a slope below three completed cells and
      returned none for m = 3 and m = 4, which is the correct behaviour rather
      than a missing result. n = 15 at m = 3 and n = 16 at m = 4 were censored
      at the 180 s per-cell cap and are uncharacterised, not hard.
    - >-
      THE PROGRAM HAS BEEN MEASURING THE ARITY THAT CANNOT WIN. Every binary
      point-decomposition measurement in this repository is at m = 3 -- the
      EXP-ICPERF-66fd51 / e21835 WDSat and Groebner panels (n = 15, 17, 19,
      l = 5, 6), EXP-ALBIN-004 and -007, the EXP-ICI-001 crossbred and MITM
      ladders at t = 3 -- while IDEA-20260807-32f96d already recorded that
      "arity m >= 4 has ZERO measured cost cells anywhere" and EV-R6-001
      censored every m = 4 arm on timeouts. This record says why that gap
      matters: m >= 4 is not merely under-measured, it is the only arity with
      any budget at all.

