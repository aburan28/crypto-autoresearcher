  scope_and_limits:
    - >-
      This is a COST-MODEL verdict with measured inputs, not an attack and not a
      lower bound on ECDLP. It says which cells cannot win under the declared
      model and why; it asserts of no cell that it does win.
    - >-
      The ANF charge binds every method that MATERIALISES the descended system,
      which is what every implemented approach does -- Groebner, WDSat, CNF-SAT,
      crossbred, msolve. It does not bind a method that never materialises it.
      That gap is the one place a genuine algorithmic escape could live below
      the crossover, and it is named here rather than closed by assertion.
    - >-
      The sparse linear-algebra charge m*D^2 is an assumption, and it is the
      load-bearing one for Q1 and Q2: a method with a materially lower exponent
      would raise the cap on l and could revive m = 3. Attacking it is the
      highest-value challenge to this record.
    - >-
      Scoped to binary fields and to the Gaudry/Diem subspace factor base.
      Nothing is asserted about prime fields, GHS Weil descent, Joux-Vitse
      variants, trace-zero varieties, or non-linear factor bases.
    - >-
      The 409 and 571 verdicts inherit every caveat of the model at its largest
      extrapolation, and they concern only whether the SYSTEM FITS the budget.
      They are not a claim that those curves are attackable; the solver question
      they reduce to is open and is not answered here.
    - >-
      The solver-exponent ladder reaches at most 30 descended variables against
      the 392 and 556 of the live cells, and only the m = 2 arm carries a slope
      at all. Extrapolating 0.5648 from 30 variables to 556 is a large step and
      is NOT performed by any clause here; it is stated so a reader can judge
      it. Q1 through Q5 are exact arithmetic plus measured degree and density and
      do not depend on the ladder.
    - >-
      One solver, PolyBoRi through Sage, on one 4-CPU host. WDSat is
      substantially faster in constant terms (EV-ICPERF-390707); a constant-factor
      engine change does not move a fitted exponent, but a genuinely different
      search strategy might, and that is not tested here.

  relation_to_prior_records:
    - record: EV-ICPERF-10c5fc
      relation: >-
        Agrees and generalises. Its ECC2K-130 free-oracle finding at m = 3 is
        one cell of this table; this record extends it to nine degrees and five
        arities and supplies the linear-algebra mechanism behind it.
    - record: EV-FROB-d336b0
      relation: >-
        Consumes it. The orbit reduction factor R(l) used to relax the
        linear-algebra cap is exactly that record's measured quantity, and this
        record locates where the "exactly n and never more" gain is spent.
    - record: EV-ICI-001
      relation: >-
        Independent instrument cross-check for Q6 only. Its per-PDP slope
        0.5581 [0.5359, 0.5805] was obtained with a different solver on the same
        object and is the comparison this experiment's m = 2 fit is held to.
    - record: IDEA-20260807-32f96d
      relation: >-
        Confirms and sharpens its observation that arity m >= 4 has no measured
        cost cells, by showing m >= 4 is the only arity with a positive budget.
    - record: EXP-SEMBIN-992e73
      relation: >-
        Concordant by a different route. Its curve_table places index calculus
        below rho only at n = 409 and 571, conditional on Semaev's Assumption 1;
        this record reaches the same two degrees from a system-size argument
        that makes no appeal to Assumption 1.
