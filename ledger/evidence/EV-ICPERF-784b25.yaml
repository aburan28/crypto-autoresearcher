  strength_basis: >-
    The arithmetic is exact and the two inputs it depends on -- the descended
    Boolean degree and the ANF density -- are MEASURED rather than assumed, on
    14 cells, with the degree law corrected by one of those measurements. But
    the conclusion is a verdict under a DECLARED COST MODEL, not an observation
    of an attack, and two of its charges (sparse linear algebra at m*D^2, and
    one operation per ANF monomial) are assumptions a better method could
    violate. `moderate`, not `strong`, for that reason and no other.
  claim_tier: model_plus_measurement
  certificate_refs: []
