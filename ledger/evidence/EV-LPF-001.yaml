  - id: OBS-LPF-5
    title: 'THE DETECTION-FLOOR TABLE. THIS IS THE FINDING, NOT THE COUNT OF NON-REJECTIONS.'
    why_it_is_the_finding: >-
      A COUNT OF NON-REJECTIONS IS A STATEMENT ABOUT THE PROCEDURE; A DETECTION
      FLOOR IS A STATEMENT ABOUT THE WORLD. The package archives everything
      needed to compute the floor and computed none of it (OBJ-RT082-4). Under
      docs/inventor-protocol.md section 5 the honest deliverable carries the
      floor, so it is carried here in the body of the record and not in a
      footnote.
    definition: >-
      The smallest |delta - 1| in the real arm's B-smooth rate, relative to the
      matched uniform law, that this design would have detected with 90 percent
      probability UNDER L-3 - which requires a band exit at BOTH cells in the
      SAME direction. Computed as the per-cell 95 percent one-sided requirement
      delta*mean >= upper + 1.6449*sd (or <= lower - 1.6449*sd), taking the WORSE
      of the two cells, under a normal approximation to the binomial count at
      n = 130816 whose validity is checked by the null sd matching
      sqrt(p(1-p)/n) to within about 8 percent at every powered rung (ratios
      0.928 to 1.052).
