  - >-
    THE MEASURED INTEGER IS AN ENCODING, NOT A DEGREE (SCOPE-2). N_ij =
    lift(e_1)*p + lift(e_2) + 1 is a bijective encoding of the fibre invariant
    pair, not "the intermediate degree" the heuristic names, AND SMOOTHNESS IS
    NOT ENCODING-INVARIANT - a different bijection [0,p)**2 -> [1, p**2] would
    give a different largest-prime-factor law for the SAME mathematical object.
    The substitution of ENC-B for "degree" is a MODELLING CHOICE and this record
    may not be read as a test of the heuristic's own quantity without it.
  - >-
    u IS DEFINED AT D WHILE THE SAMPLES LIVE ON [1, p**2] (SCOPE-3, RTB-054-6
