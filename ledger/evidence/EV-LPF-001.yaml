    THE_BLOCKING_CONTENT_FINDING: >-
      THE MEASURED AGREEMENT IS WITH THE UNIFORM ARM, NOT WITH DICKMAN, AND NO
      DELIVERABLE MAY WRITE "CONSISTENT WITH THE DICKMAN PREDICTION". STAT-KS-DICK
