    LIMBB_DECL_RR066_travels_with_every_sentence_above:
      part_1_definitional_mismatch: >-
        u is defined at D (2**32, 2**40) while every sample lives on [1, p**2],
        with archived X/D = 0.50697 and 0.53581. u is systematically OVERSTATED
