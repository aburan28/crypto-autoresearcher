  # =====================================================================
  # 4. THE INFERENCE
  # =====================================================================
  inference: >-
    THE EVIDENCE CANNOT DISCRIMINATE, AND THAT IS THE FINDING RATHER THAN A
    FAILURE TO REACH ONE. On one valid, unreplicated, toy-scale execution of the
    frozen EXP-LPF-001 driver at generate_instance(2301, 16) and
    generate_instance(2301, 20), nine of ten certifying comparisons against the
    archived 200-replicate uniform-integer order-statistic bands did not reject
    and one did - bits 16, STAT-RATE-u@u_target=2, BELOW_BAND, observed smooth
    count 46598 against a lower edge at 46602, a displacement of -2.244 measured
    null standard deviations from the null mean - in a family of ten comparisons
    that fires at least once with probability 0.1821 on a CORRECT null. ONE FIRE
    IS THE SECOND MOST LIKELY CORRECT-NULL OUTCOME, and the displacement
    interpolates to a rough-direction contamination of gamma about 0.011, BELOW
    the design's certified both-cells rough-direction floor of gamma = 0.02.
    Nine non-rejections are not nine confirmations - they are on the order of six
    to seven effectively independent comparisons against a procedure that
    expects 0.199 fires - and what they license is a DETECTION FLOOR and nothing
    else. The real arm's R(u) lay inside the frozen [0.125, 8.0] band at every
    powered rung at both cells, but the agreement that was measured is with the
    MATCHED UNIFORM ARM and not with Dickman - both arms sit 4.9 and 3.8 CDF
    points from the Dickman CDF, and the shared component has already consumed
    4.43 of the 8.0 budget at bits-16 u = 5. HEUR-DS-1 IS NEITHER VALIDATED NOR
    REFUTED AT ANY TIER, INCLUDING TOY. THE RUN IS NOT VACUOUS: it is the first
    measurement in twenty-seven batches of the object HEUR-DS-1 is about, its
    factorization is verified to an unusually high standard, and it produces a
    usable and quantified detection-floor map for the instrument. Calling it
    worthless would be the premature-closure failure mode of
    docs/inventor-protocol.md section 4, which is symmetric with overclaiming.

