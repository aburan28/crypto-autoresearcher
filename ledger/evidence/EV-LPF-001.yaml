  - id: OBS-LPF-3
    title: 'THE ONE REJECT, ADJUDICATED. BOTH PRIOR FRAMINGS WERE WRONG AND BOTH FACTS TRAVEL.'
    the_scale_free_displacement:
      value_in_null_sd_from_the_NULL_CENTRE: -2.244
      exact_arithmetic: '(0.3562102495107632 - 0.35907492202788643) / 0.0012764339776488623 = -2.244'
      what_it_is: 'a 2.5 percent TWO-SIDED normal event at that one comparison.'
    the_distance_from_the_EDGE:
      value_in_null_sd: -0.023955253423476774
      shortfall_in_samples: 4
      shortfall_in_p_hat: 3.057729941291498e-05
    why_the_minimising_framing_understates: >-
      "FOUR SAMPLES, 0.024 null sd outside the nearer edge" MEASURES FROM A BAND
      EDGE, AND A BAND EDGE IS ITSELF THE 2ND ORDER STATISTIC OF 200 DRAWS WITH
      ITS OWN SAMPLING NOISE OF ORDER HALF A NULL SD. It also sets a MAGNITUDE
      ("four samples") beside a RATE ("4/201"), which are not commensurable and
      which invite a conclusion the arithmetic does not carry. The scale-free
      quantity is -2.244 null sd from the centre and it is written here beside
      the edge distance, as OBJ-RT082-2 requires.
    why_the_amplifying_framing_overstates: >-
      "BELOW ALL 200 REPLICATES" IS A PER-COMPARISON EVENT IN A FAMILY OF TEN.
      Its per-comparison probability is at most 1/201 = 0.00498; the FAMILY-WISE
      probability that SOME one of the ten certifying comparisons lands strictly
      below its own 200 nulls is at most 1 - (1 - 1/201)**10 = 0.0487, and the
      either-tail figure is 1 - (1 - 2/201)**10 = 0.0952. Positive correlation
      among the nested statistics pushes the true family-wise rate lower still
      than these independent bounds but not into discovery territory. A
      five-percent family-wise event is not a finding.
    the_tie_and_which_way_it_cuts:
      fact: >-
        At this site the 1st and 2nd ascending order statistics of the 200
        LPF-CAL-A replicates are TIED at 0.3562408268101761 (= 46602/130816), so
        the frozen lower edge EQUALS the MINIMUM of the 200.
      consequence: >-
        THE TIE CUTS AGAINST THE MINIMISING FRAMING, NOT FOR IT, AND BOTH
        REVIEWERS FOUND THIS INDEPENDENTLY. Because ranks 1 and 2 coincide, the
        achieved low-side rejection region is {x < min of the 200}, which is
        STRICTLY SMALLER than the nominal {x < 2nd of the 200}. The frozen band
        is therefore CONSERVATIVE AGAINST REJECTING at this site, 4/201 = 0.0199
        is an UPPER BOUND on the achieved two-sided rate rather than an
        understatement of it, and the fire is RARER under a correct null than the
        declared level implies - not commoner.
      the_two_effects_roughly_cancel: >-
        A per-comparison one-sided event of about 0.005 in a family of ten is
        about 0.05 family-wise. Stated so that neither refinement is quoted alone.
    the_family_wise_arithmetic_written_out_because_it_appears_nowhere_in_the_RUN_PACKAGE:
      certifying_comparisons: 10
      nominal_per_comparison_two_sided_false_fire_probability: 0.0199004975124378
      expected_fires_on_a_correct_null: 0.199
      probability_of_at_least_one_fire_on_a_correct_null: 0.1821
      reading: >-
        ONE FIRE IS THE SECOND MOST LIKELY CORRECT-NULL OUTCOME OF THIS DESIGN.
        Zero fires is the modal outcome; one fire follows it. The observation
        therefore distinguishes a correct null from essentially nothing, in
        EITHER direction. OBJ-RT082-3.
    the_comparisons_are_not_ten_independent_tests: >-
      The Bsm ladders are NESTED (bits 16 65536 > 1626 > 256 > 84; bits 20
      1048576 > 10321 > 1024 > 256), so the u = 3 smooth set is a subset of the
      u = 2 set and so on. Under the nested-binomial model on the uniform arm's
      own measured means, corr(p2,p3) = 0.368, corr(p3,p4) = 0.366,
      corr(p4,p5) = 0.396, corr(p2,p4) = 0.135, corr(p2,p5) = 0.053,
      corr(p3,p5) = 0.145; STAT-KS-DICK is a function of the same empirical
      Z-CDF and correlates with all four. TEN COMPARISONS ARE ON THE ORDER OF SIX
      TO SEVEN EFFECTIVELY INDEPENDENT ONES, and the two cells - the only
      genuinely near-independent replication in the package - SHARE ONE MASTER
      SEED, 2301.
    the_sharpest_sentence_and_it_is_carried_verbatim: >-
      THE OBSERVED REJECT IS THE SIZE OF A CONTAMINATION THE DESIGN IS NOT
      CERTIFIED TO DETECT. Interpolating the observed -2.244 null sd displacement
      on the archived OBJ-PLANT-ROUGH bits-16 STAT-RATE-u@u_target=2 shift ladder
      - (gamma 0.002, 0.005, 0.01, 0.02, 0.05) mapping to (-0.244, -0.882,
      -2.061, -4.366, -11.248) null sd in
      results/calib/perturbation_movement_report.json - places it at gamma about
      0.011, the effect of replacing about 1.1 percent of the samples with the
      rough plant. THE CERTIFIED ROUGH-DIRECTION BOTH-CELLS DETECTION FLOOR FOR
      THAT VERY STATISTIC IS gamma = 0.02. The displacement is BELOW the floor.
    the_rough_direction_blindness_is_MEASURED_not_assumed: >-
      SEVEN of the 28 plant (family, cell, gamma) groups are INERT - not one of
      the seven statistics moves - and ALL SEVEN ARE OBJ-PLANT-ROUGH at small
      gamma (bits 16 at 0.0005, 0.001, 0.002, 0.005; bits 20 at 0.0005, 0.001,
      0.002). The inert set is identical whether read over all seven statistics
      or over the five retained. A ROUGH-DIRECTION CONTAMINATION OF UP TO
      gamma = 0.02 - UP TO 2,616 OF THE 130,816 SAMPLES REPLACED - IS BELOW THIS
      DESIGN'S CERTIFIED BOTH-CELLS DETECTION FLOOR. And the one reject that
      fired is in the ROUGH direction, which is the weak one.
    coordinator_verdict_on_the_reject: >-
      AN ORDINARY TWO-SIGMA EXCURSION IN A FAMILY OF TEN. It is neither a trivial
      edge effect nor a signal. Its honest status is UNINFORMATIVE IN EITHER
