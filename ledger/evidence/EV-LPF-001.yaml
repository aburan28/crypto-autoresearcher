  # =====================================================================
  # 7. UNRESOLVED CONFOUNDS
  # =====================================================================
  unresolved_confounds:
  - id: OBJ-RT082-1
    severity: BLOCKING_FOR_INTERPRETATION_IN_BOTH_DIRECTIONS
    status: 'NEWLY DECLARED HERE. It was UNDECLARED anywhere in the specification, in RR-LPF-2 or in H-LPF-001 before this record.'
    class: 'an undeclared interpretation limit of the RTB-054-6 class, and LARGER than it.'
    title: 'THE BAND IS CALIBRATED TO A NOISE SOURCE THE REAL ARM DOES NOT HAVE, AND NOTHING IN THE PACKAGE MEASURES THE ONE IT DOES.'
    statement: >-
      OBJ-NULL-UNIF is 130816 INDEPENDENT uniform draws, and its 200-replicate sd
      matches the iid binomial prediction sqrt(p(1-p)/n) to within about 8
      percent at every powered rung (ratios 0.928, 0.962, 1.012, 1.033, 1.037,
      1.049, 1.052, 0.999). OBJ-REAL IS NOT A SAMPLE AT ALL - the specification
      says so in terms, "OBJ-REAL IS EXHAUSTIVE OVER THAT INDEX SET. It carries
      no sampling seed and no sampling noise at all" - and its 130816 values are
      determined by 512 factor-base x-coordinates, EACH OF WHICH APPEARS IN 511
      OF THE SAMPLES. SO THE FROZEN BAND IS AN iid-SAMPLING BAND BEING USED AS
      THE YARDSTICK FOR A DETERMINISTIC POPULATION FRACTION WHOSE OWN FLUCTUATION
      SCALE - THE SCALE ACROSS CURVE INSTANCES - IS NEVER MEASURED, BECAUSE THERE
      IS ONE INSTANCE PER CELL.
    why_it_cuts_both_ways_and_that_is_the_point: >-
      (a) IF THE INSTANCE-TO-INSTANCE sd OF p_hat EXCEEDS THE iid sd - which the
      C(512,2)-from-512 dependence structure makes entirely possible, a nonzero
      first-order projection putting the effective sample size nearer 512 than
      130816 - then the true per-comparison false-fire rate is far above 4/201,
      THE SINGLE REJECT IS NOISE, AND THE NINE NON-REJECTIONS ARE NEARLY VACUOUS,
      because a band too narrow is a band a genuinely deviant real arm would also
      have passed with high probability at u = 4 and u = 5. (b) IF IT IS BELOW
      THE iid sd, the nine non-rejections are stronger than they look and the one
      reject is stronger still. NOBODY KNOWS WHICH, AND THE PACKAGE CANNOT TELL.
    consequence_for_this_record: >-
      EVERY NUMBER IN OBS-LPF-5's DETECTION-FLOOR TABLE IS CONDITIONAL ON THE
      FROZEN BAND BEING THE CORRECT NOISE SCALE. If the between-instance sd came
      out at, say, 3x the iid null sd, the observed -2.244 becomes -0.75 and the
      reject evaporates, AND SO DOES THE EVIDENTIAL CONTENT OF ALL NINE
      NON-REJECTIONS. This is a concrete route by which the favourable reading is
      falsified WITHOUT ANY NEW MATHEMATICS.
    repair: 'NOT REPAIRABLE BY ARGUMENT. It is measured by RT082-CTRL-1, which is the single next action of GOAL-ECDLP-001 after this checkpoint.'
  - id: SCOPE-1-and-SCOPE-2-as-confounds
    severity: MAJOR
    statement: >-
      No target randomisation and a modelled encoding. Both are carried in
      `boundaries` above and are repeated here because they are not merely scope
      notes - they mean the measured quantity is not the heuristic's quantity,
      and neither can be repaired by more sampling. RT082-CTRL-3, the second
      bijective encoding, is the cheap discriminating control for the second.
  - id: RT049-B6-sharpened
    severity: MAJOR
    statement: 'The determinism-versus-small-x-window confound is untouched. RT049-CTRL-2, the windowed null, remains owed.'
  - id: HC-2-structural
    severity: 'STANDING WEAKNESS OF THE WHOLE LANE, NOT OF THIS RUN'
    statement: >-
      HEUR-DS-1 HAS THE DISTRIBUTION THEOREM AND NO RIGOROUS SIZE BOUND ON THE
      OBJECT. The exemplar's Heuristic 1 is justified by COMPOSITION - a rigorous
