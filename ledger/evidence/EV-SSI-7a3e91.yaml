  unresolved_confounds:
    - >-
      THE TWO REVIEWS ARE SESSION-INDEPENDENT BUT NOT MODEL-INDEPENDENT, AND THIS
      IS THE ROUND'S REAL WEAKNESS RATHER THAN A FORMALITY. Only the `local`
      backend resolves in this environment (goal impediment IMP-1); the Validator
      self-reports claude-opus-5 and is not probe-verified and says so as its
      FIRST limitation ("my judgement and the producer's are correlated in a way
      no attestation can remove; agreement between us is weaker evidence than it
      looks"); the producer's runtime_session_receipt records DIV-1, that no
      backend probe-verifies here. For a TRANSCRIPTION task the correlation is
      not cosmetic: a shared reading habit is exactly the kind of error two
      instances of one model can make identically - a mis-parsed glyph, a
      systematically preferred slot, a shared assumption about which figure on a
      line is "the" figure. What the round bought instead is corroboration by two
      independent METHODS in two independent SESSIONS - a locator-checked audit
      of the producer's table, and a blind slot-based re-extraction from the
      source - which is a different and weaker thing than agreement between
      distinct models, and may NEVER be presented as the latter.
