  boundaries:
    - >-
      TRANSCRIPTION ONLY. The result is that ten decimal literals equal ten
      decimal literals at two fixed locators at one frozen commit. It asserts
      nothing about the correctness of the paper, about whether this cost model
      reproduces those numbers, or about the cause of any divergence.
    - >-
      THE PAPER STATES ALL TEN VALUES AS LOWER BOUNDS AND THE LITERALS CARRY THEM
      AS POINT VALUES (NS-2, and F-10 for the second approximation on the memory
      column). Under the pre-registered rule this is not a mis-transcription - the
      digits are the digits - and it is deliberately outside the verdict, because
      folding it in would have revised a pre-registration after seeing the paper.
      It travels with the verdict from here on.
    - >-
      SCOPED TO THE FROZEN TRANSCRIPT, NOT TO THE PUBLISHED ARTICLE (NS-6,
      OBJ-4). inputs/P13-WESOLOWSKI-2026/source_record.yaml records the full text
      as "provided verbatim by the repository owner in conversation on
      2026-07-24", with no DOI, no arXiv/eprint identifier, no retrieval URL and
      no checksum; the freeze is demonstrably lossy relative to a published
      article (figures survive only as caption text, and the document contains no
      markdown table at all). If the original presented these costs in a table,
      the flattening happened in an unverified conversion step. Two independent
      readings of one possibly-corrupted source agree exactly as strongly as one.
    - >-
      THE CONTROLS BOUND WIRING, NOT MUCH ELSE, AND BOTH SIDES SAY SO. VC-1, VC-2
      and both declared RC-2 directions have passes entailed by their own
      arithmetic; the producer disclosed three of those entailments and the
      Validator supplied the fourth (F-3). VC-0's pass is NOT entailed - four
      distinct failure branches fired on real inputs - but VC-0 cannot see a
      within-bullet time/memory swap (disclosed) and does not check the attributed
      number on non-`direct` entries (F-4, undisclosed). No control in the package
      checks a unit; the only guard against a unit mismatch is the per-entry
      comparison_form judgement, which is prose.
    - >-
      MINIMALITY OF THE ATTAINED MINIMUM IS NOT VERIFIED. The committed run
      packages store only the optimum, not the B-grid curve, and executing
      cost_model.py is prohibited, so `per_field[*].optimal.log2T` being the grid
      minimum rests on specification.yaml's declaration of the optimizer's
      objective. The Validator verified only that the recorded optimum is
      internally consistent with the contract's stated formulas (log2X, w, u,
      log2P0, and log2T = log2M - log2P0 bit-exactly at all five field sizes) and
      explicitly declines to assert minimality.
    - >-
      NO OBSTRUCTION IS CLAIMED AND NONE IS RECORDED. No lane is closed, no
      direction is deprioritized, and `direction` is neutral, so the closure gate
      of agents/coordinator.md does not fire. In particular an `off_curve`
      reachability verdict is NOT an obstruction block and may never be used as
      one: it is a comparison between one committed anchor and one model's
      attained minimum on one grid, with five live alternative explanations of
      which the leading one is entirely benign.
    - >-
      NO STATUS MOVES ON THIS RECORD. EXP-WESOVOW-001 remains `approved` and
      untouched; no hypothesis exists in scope; GOAL-SSI-001 remains `active`; no
      completion criterion is met or approached; nothing is promoted to
