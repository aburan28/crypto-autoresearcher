    - id: OBS-8
      item: >-
        OBJ-2 CORRECTS A FRAMING THIS PROGRAM HAD BEEN USING, AND THE CORRECTION
        IS NARROWER AND BETTER THAN WHAT IT REPLACES. The paper states all ten
        numbers as inequalities (`>=` in all ten cases, in deliberate contrast to
        the `~` it uses for the previous-methods column in the same sentences),
        and cost_model.py consumes them as point values through a TWO-SIDED test
        `abs(dev_t) <= 0.75 and abs(dev_m) <= 0.75` (lines 303-305,
        SANITY_TOLERANCE_BITS at line 72). THIS PROGRAM HAS FRAMED THAT AS THE
        DEFECT - including in committed commit messages on this batch's working
        branch. THE RED TEAM'S NARROWER STATEMENT IS THE CORRECT ONE: for control
        C1's own declared purpose the two-sided test is RIGHT, and saying
        otherwise is the opposite error. C1 is declared an INSTRUMENT SANITY GATE
        and a model-reproduction check (specification.yaml:47-52, 134-141); as a
        reproduction check its target is the paper's ARITHMETIC, and a
        reimplementation landing above the paper's figure is as suspect as one
        landing below, so a two-sided band is correct. The paper's `>=` attaches
        to the interpretation of that arithmetic as an attack cost, not to the
        arithmetic itself. THE ACTUAL OBJECTION IS NARROWER AND SURVIVES: line
        302 re-emits the raw `paper_pair` values into the per_field output record
        carrying NEITHER the relation NOR the unit, into records whose readers
        must then re-derive both from a paper outside most read_scopes in this
        campaign - and DEC-20260904-166ab5:178 records that the C1 tolerance is
        exceeded at every field size, so those figures are in fact being read as
        signed anchors somewhere. The earlier, broader framing is recorded here as
        having been broader than the evidence supports.
    - id: OBS-9
      item: >-
        OBJ-3 IS A WORKING COUNTEREXAMPLE AND IT COST NO RUN. Lines 234-238 each
        contain TWO time figures: the new attack's and, in the same sentence, the
        previous-methods figure, and those five previous-methods values are
        exactly log2(p)/2 - which is the round's declared NULL OBJECT time column.
        Therefore any verification of the form "the quoted text at the recorded
        line range CONTAINS the recorded value" returns PRESENT for a claimed
        time column that is the Delfs-Galbraith baseline rather than the new
        attack. The Red Team's own procedure is not vulnerable (it extracts by
        SLOT, P2), but the containment formulation is what the producer's control
        VC-0 literally specifies, and the Red Team could not see which
        formulation the producer used. This is the exact wrong-but-self-consistent
        shape that a blind re-transcription exists to catch and that no
        recomputation from the producer's artifacts could see. Cheapest control,
        one line and no run: feed a containment-style verifier the vector
        (128, 192, 256, 288, 384) as a claimed time column; PRESENT means the
        time column was never checked.
