    - id: O-method
      text: >-
        The authorized propose/evaluate/gap-feed/propose/evaluate method
        completed: two mutually blind initial proposals, immutable snapshots,
        T1--T5 review, deterministic gap selection, one fresh gap-fed
        proposal, a second snapshot and fresh T1--T5 review, then stop.
    - id: O-UTTK
      text: >-
        UTTK is a typed obstruction with T1 inconclusive and T2, T3, T4 and T5
        breaking. It lacks an arbitrary-complete-basis-to-theta compiler,
        factors its inverse through a smaller theta witness, and supplies no
        selected-message-attacker-to-complete-ring route.
    - id: O-RWER
      text: >-
        RWER-Trap is a typed obstruction with T1 inconclusive, T2 breaking, T3
        inconclusive, T4 breaking and T5 breaking. Endpoint inversion is
        many-to-one; guaranteed edge/dual-edge collisions yield scalar loops,
        while non-scalar rank growth and full-order saturation are unproved.
    - id: O-revision
      text: >-
        Saturation-filtered RWER is a typed obstruction with T1, T2 and T5
        breaking, T3 inconclusive, and T4 holding only as an honestly scoped
        missing-arrow obstruction. It supplies neither the bit-to-preimage
        compiler nor the endpoint-preimage-to-complete-ring extractor.
    - id: O-correction
      text: >-
        Fresh red-team review corrected the producer: epsilon^q*u_I is not
        justified without an independence and call model, and lack of a proved
        positive saturation bound is not a proved infimum of zero. A concrete
        admissible zero-saturation selector remains open.
    - id: O-T5
      text: >-
        The revision's exact byte grammar, equality roles for degree words and
        tags, repeated-use state and adaptivity, randomness coupling, and
        composed abort semantics remain unspecified.
    - id: O-locator
      text: >-
        The inherited Milne locator correction was independently checked from
        the frozen audit metadata: printed pages 69--70 map to PDF 74--75,
        printed 74 to PDF 79, and printed 75/Lemma 6.12 to PDF 80. This is a
        metadata correction only; historical J4/J5 verdicts were not recoded.
    - id: O-independence
      text: >-
        Separate reviewer sessions and scoped reads are recorded, but the raw
        independence checker fails on noncanonical frozen attestation/verdict
        layouts. Machine-verifiable independence therefore did not pass.
    - id: O-final
      text: >-
        Three typed obstructions, zero surviving interfaces and zero PKE
        finalists result. The goal remains active and no implementation or
        parameter run is warranted for these exact interfaces.
  inference: >-
    A future construction attempt should begin with a publicly checkable
    binding relation having a unique or publicly equivalent preimage, public
    bare-E sampling/evaluation, inversion from every complete evaluable basis,
    an exact repeated-use parser/game, and a correctly directed extraction or
    a scoped obstruction at its first missing arrow.
  boundaries:
