    - No primary paper was newly read; prior-art comparison remains pointer-level and incomplete.
    - T4 for the revision holds only as a scoped missing-arrow obstruction, not a completed reduction.
    - The report diagram and PDF are presentation artifacts, not mathematical evidence.
    - Machine-verifiable review independence did not pass for the frozen artifact layouts.
  unresolved_confounds:
    - Exact bare-E public sampling and repeated-view distributions, including retry and abort laws.
    - Basis-independent inversion for every complete evaluable End(E) basis and GL_4(Z)-related presentation.
    - A public binding relation with a unique or publicly equivalent preimage.
    - A decision-to-search or selected-message-attacker-to-preimage compiler.
    - Selector-robust non-scalar generation and maximal-order saturation with quantitative probability.
    - Exact parser, malformed-input, equality, state, adaptivity, randomness and repeated-use semantics.
    - Primary-source comparison with Seta-family and related isogeny-encryption constructions.
