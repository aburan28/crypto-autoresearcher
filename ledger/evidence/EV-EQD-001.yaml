    L1_cancellation_residual_caveat: >-
      RT049-B6. CANCELLATION IS EXACT FOR ANY FEATURE SHARED BY THE TWO ARMS AND IS NOT EXACT
      FOR A FEATURE THAT INTERACTS WITH THE BASE GEOMETRY. The small-x locality of the real
      base is precisely such a feature. The cancellation argument therefore protects against L1
      leakage but NOT against the determinism-versus-window confound.
    L2: 'THE SUBSTANTIVE MEASUREMENT AND THE OBJECT OF THIS RECORD.'
    L3: >-
