    better or worse than the null at these resolutions, which is precisely what "dominated by
    the null" means for a distributional claim. NO ALGORITHMIC FRONTIER ROW APPLIES - this is a
    distributional measurement and not an algorithm. Pollard rho, BSGS, GHS and Gaudry-Semaev
    index calculus are NOT COMPARABLE AND WERE NOT COMPARED - no DLP instance was solved, no
    relation collected, no linear algebra performed, no source recovery or target descent
    exists in this package, and any deliverable implying such a comparison is an overclaim. The
    closest specialized baseline is Gaudry-Semaev-style index calculus over prime fields at
    m = 4 with a half-arity intermediate; this run measures ONE load-bearing INPUT to that
    approach's cost model and measures none of the cost model, relation yield, smoothness
