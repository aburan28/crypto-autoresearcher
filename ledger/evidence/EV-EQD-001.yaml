  direction_note: >-
    `supports` IS BOUNDED HERE AND THE BOUND IS THE HEADLINE, NOT A FOOTNOTE. All six
    pre-registered predictions of H-EQD-001 over the three RETAINED statistics held at both
    tested cells, so the evidence points in the direction the hypothesis predicted. That is
    the whole of what `supports` means in this record. It is NOT confirmation, because a
    non-rejection is informative only to the extent the design had power against the
    alternative that mattered, and this design's power against the alternative a structured
    factor base is most likely to induce is ZERO AND UNMEASURED (see
    what_is_NOT_established.wrong_alternative_class). Absence of evidence is not evidence of
    absence. The operative quantities that must accompany every statement of this direction
    are the detection floor and the largest deviation consistent with the observation, both
    recorded below.
