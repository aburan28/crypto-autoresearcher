  # ===================================================================
  # OBSERVATIONS
  # ===================================================================
  observations:
  - id: OBS-EQD-1
    title: every retained statistic failed to reject at both cells, against thresholds frozen before the real arm ran
    detail: >-
      The rejection rule is STRICTLY GREATER THAN the frozen threshold. bits 16 - STAT-CHI-16
      269.31040852448893 against 315.4755320010126; STAT-CHI-64 4200.313917714735 against
      4345.885305765976; STAT-KS1-E1 0.004540728962818041 against 0.006191903131115506.
      bits 20 - STAT-CHI-16 302.82051508909535 against 326.2209621328956; STAT-CHI-64
      4168.585685033559 against 4293.229704961268; STAT-KS1-E1 0.002912487769080263 against
      0.006841670743639949. SIX OF SIX FAIL TO REJECT. Every threshold is the 199th ascending
      order statistic of that statistic's 200 CAL-1 null-versus-null replicate values at that
      cell, an exact per-test false-rejection probability of 2/201 = 0.00995 on the measured
      null, and all six were recomputed from the raw archived arrays by two independent
      sessions.
  - id: OBS-EQD-2
    title: the family-wise level is 0.0582 and NOT 0.00995
    detail: >-
      Six retained tests at 0.00995 each give a probability that a correct null reaches the
      favourable branch of (1 - 0.00995)**6 = 0.94177, that is a family-wise false-rejection
      probability of 0.0582; including the pre-empting guards the end-to-end figure is about
      0.90. THE CONTRACT'S ORIGINAL 0.9234 OVER EIGHT TESTS NO LONGER HOLDS AS WRITTEN and was
      superseded by the reading rule itself when STAT-KS1-E2 was excluded. Any statement
      quoting 0.00995 as "the level" of this result is wrong (RT049-C2).
  - id: OBS-EQD-3
    title: empirical percentiles against the 200 CAL-1 replicates, recorded under AGENTS.md rule 8
    detail: >-
      NOT A TEST AND NOT PART OF THE FROZEN RULE. Computed by RT-20260801-049 in review, as
      empirical p = (#{replicates >= observed} + 1) / 201. bits 16 - STAT-CHI-16 p = 0.2736
      (rank 147/200, z = +0.72); STAT-CHI-64 p = 0.1244 (177/200, +1.10); STAT-KS1-E1
      p = 0.1393 (174/200, +1.28); STAT-KS1-E2 p = 0.5522 (91/200, -0.20). bits 20 -
      STAT-CHI-16 p = 0.0498 (192/200, +1.70); STAT-CHI-64 p = 0.2338 (155/200, +0.76);
      STAT-KS1-E1 p = 0.6418 (73/200, -0.28); STAT-KS1-E2 p = 0.0995 (182/200, +1.22). Five of
      the six retained values sit above their null median; the exact sign test gives
      P(>= 5 of 6) = 7/64 = 0.109, which is nothing. See OBS-EQD-4.
  - id: OBS-EQD-4
    title: the bits-20 STAT-CHI-16 value sits in the upper tail of its own null and is RECORDED, NOT READ
    detail: >-
      302.82051508909535 is exceeded by only 9 of the 200 CAL-1 replicates, empirical
      p = 0.0498. IT DOES NOT EXCEED THE FROZEN THRESHOLD 326.2209621328956 and therefore
      correctly does not reject; the frozen rule was applied as written. Recording it is
      mandatory under AGENTS.md rule 8. FOUR REASONS DISQUALIFY IT AS A FINDING AND ALL FOUR
      MUST APPEAR BESIDE IT. (1) With six retained comparisons the probability that at least
      one lands above the 95th null percentile on a correct null is 1 - 0.95**6 = 0.265 - this
      is the single most likely value to appear and it appeared. (2) There is NO CROSS-CELL
      CONSISTENCY - the same statistic at bits 16 sits at rank 147 of 200, p = 0.2736; a
      genuine structural property of the deterministic selection rule should show at both
      cells. (3) Five of six above the null median gives a sign-test P of 0.109. (4) Converting
      it into a rejection would be exactly the post-calibration latitude ATS-1 clause 4 and
      condition C-1 forbid. DISPOSITION - carried as a PRE-REGISTRATION TARGET for the
      replication and never as a finding. If the bits-20 K = 16 grid statistic lands in the
      upper tail AGAIN on a DIFFERENT curve instance, that is a signal worth a pre-registered
      follow-up; if it regresses to the middle it was a draw. Naming it now is what makes the
      replication informative rather than exploratory.
  - id: OBS-EQD-5
    title: the excluded STAT-KS1-E2 would have changed nothing, and this is computable rather than assumed
    detail: >-
      DV-4 carries no threshold and no reject boolean anywhere in the package, which is the
      C-1-compliant handling of an excluded variable, and its two measured values are present
      as descriptive quantities only. Those values are 0.003095951565557725 at bits 16 against
      the CAL-1 199th order statistic 0.00623012475538165, and 0.004548373287671215 at bits 20
      against 0.00631421232876711. NEITHER EXCEEDS. Had DV-4 been retained the branch would
      have been IDENTICAL. This is the strongest available post-hoc evidence that the
      exclusion was not outcome-driven, and it is checkable rather than rhetorical. C-1 IS
      HONOURED IN BOTH DIRECTIONS - the non-rejection is NOT converted into a rejection, and it
      is NOT counted as an additional passed test strengthening this result, because an
      uncertified statistic's non-rejection carries no power certificate in either direction
      and therefore adds no evidential weight.
  - id: OBS-EQD-6
    title: the duplicate tell did not fire, and what it measures is narrower than the frozen prose says
    detail: >-
      STAT-DUP on OBJ-REAL is 20 at bits 16, inside the calibrated band [0, 110], and 0 at
      bits 20, inside [0, 0]. Neither leg of N-1 fired. See
      duplicate_structure_reconciliation and stat_dup_scope_correction - this quantity is a
      pure function of the base's 2-torsion closure at BOTH cells and bears on the
      fibre-invariant law at NEITHER.
  - id: OBS-EQD-7
    title: both apparatus controls behaved as the frozen rule required
    detail: >-
      PC-1 / DV-6 MUST REJECT and did - 463.573258544002 against 315.4755320010126 at bits 16
      and 359.93896300215863 against 326.2209621328956 at bits 20, with n_replaced
      6541 = int(round(0.05 * 130816)) at both cells. DV-7, the apparatus-identity control,
      MUST NOT REJECT and did not - 261.8934732210371 and 256.60109843454813, both below their
      thresholds and both inside the declared full CAL-1 support
      ([182.87972687693338, 321.9563383966048] and [191.40792384797555, 335.54712432476106]),
      so N-5 legs (a), (b) and (c) are all clear. THESE ARE CONTROLS AND NEITHER IS EVIDENCE
      ABOUT ANY HYPOTHESIS. DV-7's non-rejection is expressly NOT corroboration of anything;
      only a rejection there would have been informative, as an implementation defect. PC-1 at
      bits 20 passed on a thin draw - 359.939 against a CAL-2 plant-arm minimum of 359.026 in
      20 replicates, essentially the bottom of its own certified distribution.

  # ===================================================================
  # THE FINDING THAT MUST NOT SIT IN A FOOTNOTE
  # ===================================================================
  what_is_NOT_established:
    wrong_alternative_class:
      headline: >-
        THE POWER CERTIFICATE IS AGAINST THE WRONG ALTERNATIVE CLASS. THIS RUN BOUNDS
        DEPARTURES IN THE e_1 MARGINAL; IT DOES NOT BOUND THE JOINT LAW.
      mechanism_read_from_the_source: >-
        The planted-deviation object OBJ-PLANT-delta, the ONLY alternative class on the frozen
        ladder and therefore the only class against which any power was ever measured, replaces
        the e_1 coordinate of a delta fraction of pairs with a uniform draw from
        [0, floor(p/2)) and RETURNS e_2 UNCHANGED - the driver's plant() modifies out1 and
        returns e2.copy(). This was read from the source and confirmed independently by
        VAL-20260801-003 (DS-b) and RT-20260801-049. NO RUNG OF THE FROZEN LADDER MOVES THE
        DEPENDENCE BETWEEN e_1 AND e_2 AT FIXED MARGINALS.
      consequence: >-
        A COPULA-TYPE DEVIATION OF ARBITRARY MAGNITUDE - one that preserves both marginals
        exactly and moves only the dependence between them - IS NOT EXCLUDED BY THIS RUN AT
        ALL, TO ANY DEGREE, AT ANY MAGNITUDE. There is no measured power against that class
        because no member of that class was ever measured. The frozen reading rule declared
        this in advance at attainability_argument.N_4.what_remains_uncertified, and the
        hypothesis declared it at IL-EQD-POWER; the declaration held and is now a measured
        limitation rather than a foreseen one.
      why_it_is_the_relevant_class_and_not_a_hypothetical: >-
        BECAUSE OF THE SHAPE OF THE REAL OBJECT. OBJ-REAL is a SMALL-x WINDOW - the first 512
        x-coordinates of X_E in increasing order, all at or below x = 1052 against p = 46663 at
        bits 16. If such a base induces structure at all, the natural shape of that structure
        is clustering or correlation in the joint (e_1, e_2) plane at preserved marginals, not
        a uniform re-randomization of the e_1 coordinate. The apparatus was certified against
        the shape it could construct, not against the shape the object was most likely to
        produce.
      unnumbered_heuristic_named: >-
        RT049-H2, RECORDED AS A HEURISTIC RATHER THAN LEFT IMPLICIT. Reading "certified
        delta 0.05" as "deviations smaller than 5 percent are the only thing we could have
        missed" silently assumes the deviation lives in the plant's alternative class. That
        assumption is unnumbered and unjustified anywhere in the package. It is named here and
        its discharge is the single next action of this goal (RT049-CTRL-1).
    largest_deviation_consistent_with_these_observations:
      inside_the_plant_class: >-
        A DEVIATION AFFECTING UP TO ABOUT 1 PERCENT OF THE 130816 HALF-TUPLES - OF ORDER 1300
        PAIRS - IS FULLY CONSISTENT WITH THE OBSERVED NON-REJECTION AT BOTH CELLS, because a
        deviation of that size would have been missed about 85 percent of the time. Anything at
        or below 0.5 percent, of order 650 pairs, is invisible to this apparatus. This number
        must appear in the same paragraph as any statement of the non-rejection (RT049-BC-2);
        a non-rejection reported without its power is an overclaim by omission.
      outside_the_plant_class: 'UNBOUNDED. See wrong_alternative_class above.'
    detection_floor_measured_and_certified:
      the_operative_floor_is_0_02_not_0_05: >-
        BOTH NUMBERS MUST BE CITED AND NEITHER ALONE. The frozen certification predicate
        CERT-EQD-1 admits only STAT-CHI-16 and STAT-CHI-64 as certifying statistics, and 0.05
        is the smallest ladder rung either reaches at 0.95 detection in both cells - that is
        the CERTIFIED delta and it is a property of the certification predicate. But the
        adverse branch N-4 fires if ANY RETAINED statistic rejects at BOTH cells, and
        STAT-KS1-E1 reaches 20 of 20 at BOTH cells already at delta 0.02. THE DESIGN'S
        MEASURED BRANCH-LEVEL FLOOR IS THEREFORE 0.02. Pooling the 40 detections, the 95
        percent one-sided lower confidence bound on per-cell detection is
        0.05**(1/40) = 0.9280 and the joint probability across the two cells is at least 0.861.
        Citing only 0.05 UNDERSTATES the run; citing only 0.02 BENDS THE FROZEN RULE. The
        reading rule recorded this fact and correctly declined to act on it, because acting on
        it would have been selection where only substitution was permitted (RT049-C1).
      power_at_smaller_deltas_from_the_archived_CAL_2_table:
      - 'delta 0.005 - STAT-CHI-16 0/20 and 0/20, STAT-CHI-64 0/20 and 0/20, STAT-KS1-E1 0/20 and 0/20. ENTIRELY UNDETECTABLE - the joint branch-level probability is bounded above at about 0.02 and is not distinguishable from the 0.0582 family-wise false-rejection floor.'
      - 'delta 0.01 - STAT-KS1-E1 7/20 at bits 16 AND 7/20 at bits 20, STAT-CHI-64 1/20 and 0/20, STAT-CHI-16 0/20 and 0/20. Per-cell union detection about 0.35 to 0.40, joint branch-level probability about 0.12 to 0.16 treating the cells as independent. A DEVIATION OF THIS SIZE ESCAPES THIS DESIGN ABOUT 85 PERCENT OF THE TIME.'
      - 'delta 0.02 - STAT-KS1-E1 20/20 at BOTH cells. THE BRANCH-LEVEL FLOOR IS HERE.'
      - 'delta 0.05 - STAT-CHI-16 20/20 at both cells, which is what CERT-EQD-1 certifies; STAT-KS1-E1 20/20 and 20/20; STAT-CHI-64 5/20 and 9/20.'
      - 'delta 0.10 - all three retained statistics 20/20 at both cells.'
      coarseness_of_the_certification: >-
        WITH R_REPS = 20 THE 0.95 BAR IS ATTAINABLE ONLY AT 19/20 OR 20/20, so the
        certification is effectively a 20-of-20 test; a statistic of true power 0.90 passes
        such a test about 12 percent of the time and one of true power 0.97 fails it about 46
        percent of the time. The certified delta is a COARSE quantity, resolved to within a
        factor of four by a five-rung ladder. The remedy is not more argument, it is R_REPS -
        the entire archived calibration ran in 59.19 s at a peak RSS of 176 MB, so
        R_REPS = 200 on a finer ladder costs minutes (RT049-CTRL-3).
    e_2_coverage: >-
      COVERAGE OF THE e_2 MARGINAL RESTS ENTIRELY ON TWO COARSE JOINT GRIDS. The only dedicated
      full-resolution marginal probe of e_2, STAT-KS1-E2, was excluded in advance under
      CAL-STOP-1 second_stop_leg on the deductive ground that it has no power against the
      declared alternative class by construction. After the exclusion, e_2 is seen only through
      the K = 16 and K = 64 joint chi-squares, which resolve it into 16 and 64 bins while
      simultaneously spending their degrees of freedom on the joint structure. A pure e_2
      marginal deviation finer than 1/64 of the field, or one that a 4096-cell table dilutes
      across many cells, IS A REAL BLIND SPOT. No English gloss of this result may say "the
      invariants are indistinguishable" without the e_2 qualifier.
    two_sample_blindness: >-
      THE DESIGN IS BLIND BY CONSTRUCTION TO ANY DEVIATION THE DETERMINISTIC AND THE RANDOM
      BASE SHARE. The chi-square is a two-sample test of homogeneity with POOLED expectation
      and the KS statistic compares the two empirical CDFs to each other, so any feature common
      to both arms cancels identically. If the fibre invariants of ANY 512-point factor base on
      these curves are systematically non-generic in a way that matters for smoothness, this
      design cannot see it. That is the correct design for the question posed (L2) and the
      wrong design for the question HEUR-DS-1 needs (absolute behaviour against a theoretical
      reference).
    determinism_and_window_confound: >-
      RT049-B6, MATERIAL AND CARRIED FORWARD. The two arms differ in TWO respects at once -
      the DETERMINISM of the selection rule and the LOCALITY of the support. OBJ-REAL is a
      narrow initial window of the field; OBJ-NULL-RFB spreads over all of X_E. A non-rejection
      is consistent with both being irrelevant, and a rejection would not have told us which
      mattered. This is not a defect of execution - it is exactly the object the specification
      declares - but it is a scope limit that every deliverable must state, and it names a
      cheap discriminating arm (RT049-CTRL-2, a windowed null). The L1 cancellation argument
      below protects against L1 leakage and does NOT protect against this confound.
    not_touched_at_all: >-
      This run touches NONE of - any smoothness, factorization or largest-prime-factor quantity
      whatsoever; the distribution of the integer lift of e_1 or e_2 against any theoretical
      reference; any field size above 20 bits; any factor-base size other than 512; any arity
      other than m = 4 or any intermediate other than INT-2; relation yield, matrix rank,
      linear-algebra cost, source recovery or target descent; more than one curve instance per
      bit size or more than one master seed.

  # ===================================================================
  # WHAT IS ESTABLISHED
  # ===================================================================
  narrowest_supported_statement: >-
    ON THE TWO TOY CURVE INSTANCES generate_instance(2301, 16) (p = 46663, #E = 46860) AND
    generate_instance(2301, 20) (p = 767551, #E = 767427), AT Bfb = 512, m = 4,
    n = C(512, 2) = 130816 half-tuples per arm, ONE MASTER SEED AND ONE NULL DRAW PER CELL -
    the fibre invariants (e_1, e_2) = INT-2 induced by the frozen deterministic factor base
    were NOT DISTINGUISHED from those induced by a single uniformly drawn 512-point factor base
    on the same curve, by any of the three retained statistics (the two-sample chi-square of
    homogeneity on the K x K grid at K = 16 and at K = 64, and the two-sample KS statistic on
    the e_1 marginal), each compared against the 199th of 200 measured null-versus-null
    replicate values, an exact per-test false-rejection probability of 0.00995 and a
    family-wise probability of 0.0582 across the six comparisons. THE ACCOMPANYING AND EQUALLY
    LOAD-BEARING HALF - the design's measured detection floor against its declared alternative
    class (a uniform re-randomization of the e_1 coordinate on a delta fraction of pairs) is
    delta = 0.02 at the branch level with joint power at least 0.861, and delta = 0.05 by the
    frozen certification predicate; a deviation of that class at delta = 0.01, about 1300 of
    the 130816 half-tuples, would have been missed about 85 percent of the time, and at
    delta = 0.005 essentially always; AND NO POWER WHATSOEVER WAS MEASURED against a deviation
    that preserves both marginals and moves only the dependence between e_1 and e_2, so such a
    deviation OF ANY MAGNITUDE remains entirely consistent with these observations. Coverage of
    the e_2 marginal rests solely on two coarse joint grids, the dedicated e_2 marginal test
    having been excluded in advance. This is a single unreplicated toy-tier observation about
    limb L2 and about nothing else. It is not equidistribution, not genericity, not validation
    or refutation of HEUR-DS-1 at any tier, not a smoothness result, and not a statement about
    any field size above 20 bits.
  licensed_english: >-
    "NOT DISTINGUISHABLE BY THESE THREE STATISTICS AT THESE TWO CELLS, AT A MEASURED DETECTION
    FLOOR OF delta = 0.02 IN THE e_1-MARGINAL PLANT CLASS AND NO MEASURED POWER AT ALL AGAINST
    DEPENDENCE-ONLY ALTERNATIVES." That sentence is the whole of the licensed English
    (RT049-BC-1 and BC-2). The words GENERIC, EQUIDISTRIBUTED, RANDOM-LIKE and INDISTINGUISHABLE
    are forbidden in any broader sense than that.

  limb_discipline:
    L1: >-
      A DERIVATION AND NEVER A FINDING OF THIS BATCH. That (e_1, e_2) is not uniform on
      F_p x F_p, with an admissible support of density about 1/8 because the roots of
      S_3(x_i, x_j, Z) are x-coordinates of points of E(F_p) and |X_E| is about p/2, is an
      elliptic-curve fact and not a Semaev fact. No artifact in the reviewed package reports it
      as a finding and this record does not either.
    L1_cancellation_verified_from_source: >-
      THE MEASUREMENT IS OF L2 AND IS NOT A DISGUISED L1 STATEMENT, VERIFIED FROM THE DRIVER
      SOURCE BY RT-20260801-049 RATHER THAN FROM PROSE. Both arms pass through the IDENTICAL
      int2_fibre_invariants call over the IDENTICAL precomputed upper-triangle index set over
      exactly 512 points, giving exactly 130816 pairs each; the only difference is the
      512-element x-list. stat_chi is a two-sample Pearson chi-square of homogeneity with
      POOLED expectation, not a goodness-of-fit test against a uniform reference, so every
      feature common to both arms - the whole of L1, the support density about 1/8, the
      restriction of the root multiset to X_E, and the binning unevenness when K does not
      divide p - enters the pooled total and CANCELS IDENTICALLY. The same holds for the
