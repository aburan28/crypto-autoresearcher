  strength_reason: >-
    ONE UNREPLICATED RUN, ONE MASTER SEED (2301), ONE CURVE INSTANCE PER BIT SIZE, ONE HOST,
    ONE NULL DRAW PER CELL FOR THE PRIMARY COMPARISON. Not `replicated` and not `strong`.
