  # ===================================================================
  # THE DUPLICATE STRUCTURE - A THEOREM, NOT A FIT
  # ===================================================================
  duplicate_structure_reconciliation:
    status: >-
      GENUINE RECONCILIATION, INDEPENDENTLY REPRODUCED BY TWO SESSIONS, WITH NO FREE PARAMETER.
      Condition C-2 is DISCHARGED and no masking occurred.
    measurement: >-
      At bits 16 the real base produces 20 colliding invariant values, EVERY ONE of
      multiplicity exactly 2, so STAT-DUP = 20. At bits 20 it produces 0.
    account: >-
      For the unique nontrivial 2-torsion point T = (39489, 0) at bits 16, the translate map
      iota(x) = x(P + T) satisfies (P + T) + (Q + T) = P + Q + 2T = P + Q and
      (P + T) - (Q + T) = P - Q, so both x(P + Q) and x(P - Q) - hence both e_1 and e_2 - are
      invariant under simultaneous translation and EVERY translate pair MUST collide. Exactly
      10 base x-coordinates have their translate also in the base; that 10-set is closed under
      iota and iota has no fixed point on it, so it splits into 5 free orbits;
      C(10, 2) = 45 half-tuples are internal to the 10-set, of which the 5 orbit pairs
      {x, iota(x)} are setwise invariant and generate no collision, and the remaining 40 pair
      off into exactly 20 translate pairs. 45 = 5 + 2 * 20 IS FORCED BY COUNTING once the
      10-set is known, not fitted.
    independent_verification: >-
      VAL-20260801-004 rebuilt the base and the translate map from scratch - the 2-torsion
      x-coordinate found as the unique root of x**3 + a x + b by exhaustive search over F_p, and
      the translate computed BOTH by closed form AND by explicit point addition through
      harness.toycurve, agreeing on 60 of 60 cross-checked base points - and established that
      the set of 20 iota-orbit pairs is IDENTICAL AS A SET to the set of 20 index pairs
      carrying equal (e_1, e_2), with ZERO unexplained residual. RT-20260801-049 reproduced the
      same decomposition independently and matched each of the 20 collisions individually to
      its translate partner, 20 of 20 explained, 0 unexplained.
    why_it_is_not_a_fit: >-
      THREE REASONS. (1) No free parameter - |S| = 10 is a property of the base computed by
      point arithmetic and it FORCES the value 20. (2) It is a POINT PREDICTION that could have
      failed - any accidental collision, or any multiplicity above 2, would have broken it, and
      neither occurred. (3) The mechanism TRANSFERS to objects it was not derived from - on six
      independently drawn random bases the prediction was exact in 6 of 6 cases. A fit does not
      survive transfer to a null object; this did.
    no_masking: >-
      The real value 20 is EXACTLY the CAL-1 median (20.0) and sits far inside [0, 110], and the
      underlying driver |S| = 10 is close to its null expectation of about
      512 * 511 / 23429 = 11.2. THE DETERMINISTIC BASE IS TYPICAL IN ITS 2-TORSION CLOSURE. The
      error direction the executor named is real - the band was calibrated on RANDOM bases and
      is the wrong-shaped null for a deterministic arithmetic quantity, so a firing tell could
      in principle have pre-empted the substantive branch on a structural fact - but the
      mechanism-level account closes that gap for this run, which is the right way to discharge
      it.
    bits_20: >-
      #E(F_p) = 767427 is ODD, confirmed by independent exhaustive point counting, so E(F_p)[2]
      is trivial, the translate map DOES NOT EXIST, and 0 duplicates is FORCED rather than
      improbable. The quantity decays to zero exactly where its named generator is destroyed,
      which is the correct shape of a decay control under docs/inventor-protocol.md section 3.

  stat_dup_scope_correction:
    id: RT049-B2
    status: 'NEW AT THIS BATCH. Supersedes nothing - RR-EQD-1 is immutable - and is carried as a correction into any successor specification.'
    what_the_frozen_rule_said: >-
      RR-EQD-1 stat_dup_handling records that the specification's idealized duplicate model
      n**2 / (2 S) is falsified at bits 20 (predicting about 46 duplicates across 400 arms
      against zero observed) but states that at bits 16 it "predicts 31.4 per arm against a
      measured mean of 30.82, a good match".
    the_correction: >-
      THAT MATCH IS A NUMERICAL COINCIDENCE. On six independently drawn random bases at bits 16
      the observed duplicate count equalled the 2-torsion-orbit prediction EXACTLY in all six
      cases, with ZERO residual accidental collisions, where the birthday model predicts about
      31 accidental collisions each. Observing zero in six draws has probability of order
      e**(-186) under that model.
    mechanism_named_rather_than_asserted: >-
      The invariant pair (e_1, e_2) determines the unordered root set {x(P+Q), x(P-Q)}. The
      x-coordinates fix A = P + Q and B = P - Q up to sign; recovering (P, Q) requires halving
      A + B and A - B, and the halving ambiguity IS EXACTLY THE 2-TORSION SUBGROUP, while the
      sign flip on B merely swaps P and Q, which the i < j convention already identifies. So
      two distinct half-tuples share an invariant IF AND ONLY IF one is the 2-torsion translate
      of the other - THE MAP IS STRUCTURALLY INJECTIVE OFF THE TRANSLATE ORBITS and there is no
      birthday channel to speak of. NOT PROVED HERE - this is a checkable argument reached
      independently by two review sessions, labelled derivation and never "proved".
    consequence: >-
      DV-5 / STAT-DUP MEASURES THE 2-TORSION CLOSURE OF THE FACTOR BASE AND NOTHING ELSE, AT
      BOTH CELLS AND NOT ONLY AT BITS 20. Its non-firing DISCHARGES the gross support-collapse
      defect class (RT047-H2 / RT048-H1) via its live above-band leg - a collapsed stand-in
      would produce of order 1.8e5 duplicates at bits 16 and breach [0, 110] decisively - AND
      IT DISCHARGES NOTHING ELSE. It bears on the fibre-invariant law at NEITHER cell. The
      bits-20 caveat that "a control that cannot fail supplies no assurance" is restated in a
      weaker but still binding form for bits 16 - a control whose value is a function of the
      base's torsion geometry alone cannot bear on the distributional question. This supersedes
      the C-4 framing further in the same direction the C-4 statement already pointed, and that
      is the position this batch keeps.
    what_remains_unchecked: >-
      THE BELOW-BAND LEG IS DEAD AT BOTH CELLS - 0 is the minimum attainable value of a count
      and is the lower band edge at both - so the DEDUPLICATION AND WITHOUT-REPLACEMENT failure
      mode DV-5 exists to catch WAS NOT CHECKED AND MUST NEVER BE REPORTED AS PASSED. RR-EQD-1
      declared this in advance and the declaration held exactly; it is an instrument gap, not a
      defect of this run.
    why_this_is_a_positive_contribution: >-
      The calibration was supposed to catch a wrong random model and caught it at one cell only,
      because at the other cell the wrong model returned approximately the right number FOR THE
      WRONG REASON. That is a transferable lesson about calibrating against a numeric
      expectation rather than against a mechanism, and it is a live knowledge candidate - see
      DEC-20260801-008 knowledge_promotion, where it is judged on the merits and its promotion
      trigger is recorded.

