  proof_status_note: >-
    Each per-cell check is an exhaustive exact computation over F_p
    (symbolic support extraction + convex-hull vertex testing + corner
    evaluation, two independent classification code paths), machine-verified
    at the tested parameters and re-derived four times independently
    (producer, VAL reproduction, CORR post-fix re-derivation, J4 blind).
    This is not a theorem for all m; the all-m corner induction remains the
    normalization-locked derivation behind EV-CRYPTO-009 (proof_status:
    derivation there), and this record adds replicated computational
    base-case confirmation only.
  observations:
    - >-
      All 8 tested cells (m=3 and m=4 over p in {101, 103, 107, 211})
      exhaustively confirm: Newt(f_{m,t}) equals the full box
      [0, 2^(m-2)]^(m-1) for EVERY target t outside the exceptional set,
      and the observed exceptional set equals the group-arithmetic
      prediction Exc_m(E) = {x([r]P_0) : 1 <= r <= m-1} exactly
      (identity_hull true in all cells; |Exc| = m-1 = 2 for m=3, 3 for m=4).
    - >-
      Corrected nonexceptional_full_box_fraction is 1.0 at every cell with
      exact counts: 99/99, 101/101, 105/105, 209/209 (m=3) and 98/98,
      100/100, 104/104, 208/208 (m=4). Every exceptional target loses at
      least one box-corner coefficient.
    - >-
      m=3 calibration identities (c_{3,0} = A^2-4*B*t, c_{3,1} = t^2,
      c_{3,2} = 1) hold in all four m=3 cells.
    - >-
      Mutation control, constructed independently three times (CORR, VAL,
      J4): on a synthetic misclassified cell the corrected formula decays
      to 98/99 = 0.98989... while the ORIGINAL as-implemented formula
      returns 1.0 — the OBJ-5 tautology defect, caught and fixed. The
      metric as cited here is the corrected, non-tautological one.
    - >-
      Blind re-derivation J4 (TASK-20260908-0b434a, freeze b4def82098),
      from raw bytes and contract language alone with CORR and the
      producer's artifacts on the blind_from list, matches the CORR table
      at all 8 cells. No contradiction with EV-CRYPTO-009 or EV-BKK-001.
  inference: >-
    Supports H-SEMAEV-002 at replicated strength, toy tier: the
    corner-coefficient exceptional-target saturation claim is
    computationally verified exhaustively at every tested cell, and the
    load-bearing corrected metric is triangulated by four independent
    derivations including one blind. This replicates the base cases of the
    IDEA-20260723-006 corner induction and strengthens the scoped negative
    Newton/BKK gate of EV-CRYPTO-009 toward replicated toy tier. It is not
    an all-m proof, claims no cryptographic advantage, and gives no sub-rho
    credit to any route.
  boundaries:
    - >-
      Tested scope only: m in {3,4}, p in {101,103,107,211}, nonsingular
      short-Weierstrass curves selected under the frozen rule. Nothing is
      established for m >= 5, larger primes, or cryptographic scale
      (AGENTS.md rule 7).
    - >-
      OBJ-2 information content: the 8-cell headline collapses to fewer
      distinct curve shapes and the m=4 corner targets are constant per
      cell; the cell count overstates independent information. Replication
      strength rests on the four independent derivations of the same
      tested facts, not on cell diversity.
    - >-
      OBJ-3 scope: original target-sectioned canonical Semaev formulation
      only; unsectioned, coefficient-dependent lifted, Groebner, and
      non-Semaev routes are unaffected (AGENTS.md rule 6).
    - >-
      OBJ-4: no exceptional-system runtime is closed; exception-only
      uniform-mask bridges receive no sub-rho credit (consistent with
      EV-CRYPTO-009). This is a negative-gate control, not an algorithm.
    - >-
      VAL-20260907-b16812's incomplete verdict rested solely on two
      receipt-admissibility defects, both adjudicated by
      CORR-20260907-e65243 with independent derivations; no mathematical
      claim was falsified at any point in the review chain.
  unresolved_confounds:
    - >-
      Information content (OBJ-2): the tested cells share curve shapes;
      a wider curve/prime family would add independent information but is
      NEW experimental work, not a continuation of this gate.
    - >-
      All-m theorem status is unchanged: computational base cases at
      m in {3,4} cannot discharge the induction for all m; the locked
      derivation behind EV-CRYPTO-009 remains the only all-m argument and
      its own preliminary-strength caveat stands.
