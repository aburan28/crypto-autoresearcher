      `p1_p2_lack_demonstrated_power` below).
  proof_status: empirical_only
  proof_refs: []

  headline_framing: >-
    THIS BATCH DOES NOT ADVANCE C3, AND ITS CENTRAL CLAIM THAT IT DOES IS RETRACTED. B2-A's repaired
    "P3" sensitivity gate (coordinate-aligned vs Haar, 46.8-73.1 comparator SE) independently
    reproduces a construction a SIBLING BATCH ON THIS SAME GOAL had already formally REFUSED as an
    adjudicator, for a reason both this batch's own red team and the sibling batch's own reviewers
    establish precisely: the coordinate-aligned (t=0) arm attains the MAXIMUM POSSIBLE value of this
    statistic for ANY rank-beta projector on ANY lattice, so a large separation from the Haar arm is
    guaranteed by the choice of comparator, not evidence about the BKZ-reduced basis. B2-A's P5
    falsifier is built on the same statistic and inherits the defect. Independently, and by a
    different route, the batch's own reviewers show P1/P2 -- the ONLY predicate that reads the real
    arm -- lack demonstrated power to detect a departure of the magnitude this campaign's own toy-scale
    data already exhibits. What DOES stand, untouched by any of this: B2-B's exact zero-bit bound in
    the normative deployment lane, B2-C's normative-gap write-up, and B2-D's acquisition procedure and
    hash-instability finding (with a hedging correction, CE-2 below).

  parallel_lineage_collision:
    what_happened: >-
      This batch's central producer, B2-A, was dispatched to repair GOAL-MLKEM-005's C3 sensitivity
      instrument by building a graded projector family Q_t = QR(sqrt(1-t) E_S + sqrt(t) G) and reading
      its t=0 (coordinate-aligned) vs t=1 (Haar) separation as evidence the instrument can discriminate
      a real effect. Unknown to the Coordinator session that dispatched it, a SEPARATE lineage on this
      identical goal -- BATCH-436ddd, decided by DEC-20260806-8c33bf and partially superseded by
      DEC-20260806-00deff, then BATCH-f19c37, decided by DEC-20260806-14ac13 -- had ALREADY built
      essentially the same construction, found it defective on two independent counts, repaired it
      once, and then formally REFUSED the repaired construction's core adjudication method (there
      called P3) as an adjudicator, for exactly the reason B2-A's own P3 reproduces. Both of those
      decisions were committed to `main` and merged into this branch's base BEFORE this batch was
      opened; the Coordinator session that opened it read DEC-20260805-4823db from memory (carried
      over from before a container replacement and PR merge) and did not re-read
      `ledger/goals/GOAL-MLKEM-005.yaml`'s live `current_batch_id` and `next_action` after restarting
      the branch from a freshly-fetched `main`, so the supersession was never seen. Discovered only
      when the red team's independent audit (RT-20260806-1b95a1, objection O1) found it and the
      Coordinator verified it directly against git ancestry and the cited records.
    what_the_sibling_lineage_already_established:
      - >-
        DEC-20260806-00deff (committed before this batch, on `main`): the graded family's t-grid must
        bracket its true range-midpoint t=1/(d+1) (0.009901 at d=100, 0.007092 at d=140); a grid whose
        first interior point sits 5-7x past that midpoint (B2-A's own grid: {0, 0.05, 0.10, 0.25, 0.50,
        0.75, 1.00}, first interior point 0.05, exactly reproducing the superseded grid) discards most
        of the alignment excess before the first sample. AND: "P1 and P2 return IDENTICAL verdicts on
        the null arm and the real arm in all four cells... A predicate that cannot separate the null
        from the real arm cannot adjudicate anything."
      - >-
        DEC-20260806-14ac13 / EV-MLKEM-94c773 (committed before this batch, on `main`): the repaired
        adjudication predicate (there called P3, structurally identical to B2-A's coordinate-aligned-
        vs-Haar gate) is REFUSED as an adjudicator. Verbatim: "P3 RETURNS ITS MAXIMUM POSSIBLE
        DEPARTURE ON Z^d, because V <= beta(1-beta/d) for every rank-beta projector and the identity
        basis attains that bound... An ambient isometry INVERTS the verdict on one lattice: identity
        gives DEPARTURE at z=+465.48, DCT gives ANOMALY_BELOW_NULL at z=-17.98 (the spec's own
        instrument-fault verdict), and Haar gives AGREEMENT at z=-0.50." AM-4 (that decision's binding
        amendment) requires any adjudicator predicate to be shown invariant under ambient isometry,
        row permutation, and unimodular change of basis before it may adjudicate anything, "regardless
        of how well it separates." B2-A's P3 was never tested against AM-4 and, per the sibling
        lineage's own numbers on the structurally identical object, would fail it.
    reconciliation: >-
      B2-A's P3/P4 pass is NOT independent evidence C3 is advanced. It is an independent, unaware
      REPRODUCTION of a construction already known, by this same program, to be an artifact of
      comparator choice rather than a lattice property. This record treats DEC-20260806-14ac13 /
      EV-MLKEM-94c773 as authoritative on that point (committed first, reviewed by an independent
      validator and red team there, with exact isometry-swap numbers) and does not re-litigate it.
      P4's PASS stands as a narrow, still-useful instrument-arithmetic check (the code correctly
      returns 1.000 under a rotation-invariant error law) but was never a defense of P3 as an
      adjudicator and does not rescue it. P5, built on P3's statistic, inherits the same defect and
      is not read as informative.
    what_is_not_affected: >-
      B2-B (the C1 bound), B2-C (the normative-gap write-up) and B2-D (the acquisition procedure and
      retrieval) do not touch the graded-family / P3 construction at all and are not implicated by any
      of this. Nothing in the sibling lineage's decisions bears on C1, on deployment specifications, or
      on literature acquisition.
    active_collision_risk_going_forward: >-
      A THIRD, still-unmerged branch (`origin/claude/harness-goals-experiments-g5pt2o`) committed two
      further commits continuing BATCH-a44d08 (opened by DEC-20260806-14ac13's next_actions) as
      recently as 2026-08-06T15:20:04Z -- notarizing a pre-registration and binding its archive receipt
      -- and has not merged to `main` as of this record. `ledger/goals/GOAL-MLKEM-005.yaml`'s
      `current_batch_id` already reads `BATCH-a44d08` on `main`, inherited by this branch's merge and
      left unchanged by this archive. A future Coordinator session on this goal MUST check that branch's
      state before minting any new batch, or risk exactly this collision a second time.

  p1_p2_lack_demonstrated_power:
    finding: >-
      Independently of the parallel-lineage collision, and by a route neither B2-A nor the sibling
      lineage ran: the red team applied P1's own frozen threshold (|ratio_2em10 - 1| <= 0.05) to
      B2-A's own already-committed, already-measured unreduced-arm figures -- a departure B2-A's own
      report.md sec 7 calls "real, non-forced" (the unreduced q-ary basis's tail rows are literally
      axis-aligned before any reduction).
    the_numbers: >-
      unreduced ratio_2em10, and whether P1's 5% gate would catch the departure: d100_b30 1.03784
      (deviation 0.038, PASS-missed, i.e. the gate does NOT flag it); d100_b40 1.05540 (deviation
      0.055, FAIL-caught); d140_b30 1.02326 (deviation 0.023, PASS-missed); d140_b40 1.02943
      (deviation 0.029, PASS-missed). Three of four cells: P1's own threshold scores a KNOWN, REAL,
      NON-FORCED Beta departure as a PASS.
    consequence: >-
      Until P1/P2 are shown to have power against departures of this magnitude, a PASS on the real
      arm cannot be read as evidence the Beta law holds there -- it is equally consistent with a real
      departure the gate is too coarse to see. This corroborates, from a different angle than the
      parallel-lineage collision, DEC-20260806-00deff's independent finding that P1/P2 return
      identical verdicts on the null and real arms in all four cells.
    raised_by: RT-20260806-1b95a1, objection O2

  what_is_established:
    - >-
      C1's LANE STRUCTURE, per B2-B: the normative single-use deployment lane (R20 SSH, R21 IKEv2)
      admits a genuine, curvature-independent zero bound -- "the attainable reduction is <= 0 bits,
      exactly... because G <= log2(M) = log2(1) = 0" -- reusing zero new BKZ reductions and zero new
      lattice-estimator calls, and reproducing T3's own f'' sensitivity figures (RC.MATZOV-measured
      bits/block 0.27416/0.28039/0.28009 against the nominal 0.292, a 4.14-6.51% overstatement) as a
      companion table. The count-unstated lane (8 deployment modes) correctly declines to substitute
      an illustrative M, citing K1's rejected "manufactured bound from an absence" as the precedent it
      will not repeat, and reproduces the dbeta/beta formula symbolically with M left free.
    - >-
      A CORRECTION TO R20's CONFIDENCE QUALIFIER (CE-1 below): "EXACTLY 0, not merely may be" overstates
      textual certainty for R20 specifically -- the SSH draft's source text does not address rekeying,
      so the gap is a genuine silence, not merely a differently-worded requirement (RT-20260806-1b95a1
      O4, independently WebFetched by the reviewer). Does not change the M=1 conclusion or the bound.
    - >-
      THE NORMATIVE DEPLOYMENT GAP, drafted by B2-C as a rule-12-gated candidate finding, every row and
      quotation hash-checked against BATCH-a51f91's committed census.json, restating CX-1's corrected
      four-way row split and tracing the standards delegation chain on both limbs, with an explicit
      non-claims section. No defect found by either reviewer.
    - >-
      AN OPEN-ACCESS AGGREGATOR PROCEDURE (B2-D), refined from the sibling ePrint-retrieval finding to
      iterate all of a document's `locations[]` rather than only `best_oa_location` (which was
      paywalled, HTTP 403, for the DHKLS paper). Independently reproduced HTTP status, content type,
      byte count (1,832,736) and page count (17) exactly against the prior retrieval.
    - >-
      A GENUINE HASH-INSTABILITY OBSERVATION, corrected for over-attribution (CE-2 below): five
      independent fetches of the identical TU/e repository URL returned five different sha256 values,
      isolated by byte-diff to PDF font-subset-tag metadata rather than document content, verified
      with three independent hashing tools. The RAW measurement (5 distinct hashes, byte/page counts
      identical across all fetches) is accurate and undisputed by either reviewer.

  what_is_NOT_established:
    - >-
      NO ADVANCE ON C3. B2-A's repaired instrument does not discharge, and should not be read as having
      narrowed, completion criterion C3. Its central claim -- "the real arm's P1/P2 result is
      interpretable" -- is not supported: P3 is a presentation artifact (independently reconfirmed here,
      already established by the sibling lineage) and P1/P2 lack demonstrated power at the relevant
      magnitude (this record's own zero-cost demonstration, above).
    - >-
      NO CEILING ON M beyond what BATCH-a51f91 already established. C2 is unchanged.
    - >-
      NO NUMERIC dbeta OR CORE-SVP BIT VALUE for the count-unstated deployment lane -- correctly declined,
      not merely absent.
    - >-
      NO HEURISTIC VALIDATED OR REFUTED. No speedup, no exponent moved, no attack, no FIPS 203 parameter
      set affected or cleared.
    - >-
      AGENTS.md RULE 12 IS UNMET AND UNWAIVED, inherited. No EV-MLKEM-* or KN-* status changes here.
      B2-C's finding remains a draft.

