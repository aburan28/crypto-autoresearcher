      report_path: coordination/goals/GOAL-MLKEM-005/batches/BATCH-5a4656/tasks/TASK-20260806-7b2a09/report.yaml
      notes_path: coordination/goals/GOAL-MLKEM-005/batches/BATCH-5a4656/tasks/TASK-20260806-7b2a09/notes.md
    - id: RT-20260806-1b95a1
