    - >-
      This record does not re-adjudicate DEC-20260806-14ac13's own findings (the AM-1/G3 monotonicity
      gate's 0.99 false-failure rate, the F-A1 matched-V falsification, F-B's fold-across-k defect) --
      those stand on that decision's own evidentiary basis, not this one's.
    - >-
      The red team's required_controls RC-1 (a P1/P2 power table against already-collected data) and
      RC-2 (full reconciliation against AM-3/AM-4 applicability) were named but not run by this record;
      they are carried to `next_actions` below rather than attempted here.
    - >-
      Whether BATCH-a44d08's still-unmerged continuation on `origin/claude/harness-goals-experiments-g5pt2o`
      has since advanced further is unknown to this record as of its `recorded_at` date.

