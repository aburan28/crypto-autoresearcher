      notes_path: coordination/goals/GOAL-MLKEM-005/batches/BATCH-5a4656/tasks/TASK-20260806-1b95a1/notes.md

  coordinator_defects_this_batch:
    - id: CE-1
      severity: material
      defect: >-
        DISPATCHED A DUPLICATIVE BATCH WITHOUT CHECKING THE GOAL'S LIVE STATE. B2-A repaired an
        instrument construction that two further Coordinator decisions (DEC-20260806-00deff,
        DEC-20260806-14ac13), already committed to `main` and merged into this branch before
        BATCH-5a4656 was opened, had already superseded and then formally refused. The proximate
        cause: after a PR merge and branch restart earlier in this session, the goal record was
        merged from a fresh `main` but never RE-READ for its live `current_batch_id` and
        `next_action` -- the next batch was designed from a remembered `DEC-20260805-4823db`
        carried over from before the restart. Cost: a full batch of real BKZ-reduction compute
        (~14 minutes wall clock for B2-A alone) spent re-deriving a conclusion already on the
        record.
      raised_by: RT-20260806-1b95a1 objection O1, verified independently by the Coordinator against git ancestry
      remedy: >-
        Before minting any new batch on any goal, read that goal's `ledger/goals/GOAL-<AREA>-<NNN>.yaml`
        fresh -- `current_batch_id` and `next_action` specifically, not from session memory -- even
        immediately after a merge+validate pass. A successful merge and a passing validator prove the
        tree is consistent; they do not prove the plan being executed is still the goal's current one.
    - id: CE-2
      severity: minor
      defect: >-
        Two rounding/attribution slips in commit 8a121df9's own message and snapshot_receipt.json,
        neither present in any producer artifact: "46.8-73.2 SE" should read "46.8-73.1 SE" (true
        max 73.14551...); and B2-D's hash-instability finding was stated as settled fact ("a genuine...
        finding... in the TU/e repository's per-request serving") without the hedge B2-D's own
        receipt.json carries -- the sandboxed environment's own egress/TLS-interception proxy, through
        which every fetch was routed, is an unruled-out alternative source of the per-fetch byte
        differences. The underlying raw measurements (5 distinct sha256 values, identical byte/page
        counts) are accurate; only the causal attribution overclaims certainty.
      raised_by: VAL-20260806-7b2a09 DEF-3 (rounding) and DEF-2/DEF-4 (attribution), independently confirming each other's B2-D finding
      remedy: >-
        Restated in this record as "isolated to a ~73 KB region of PDF font-subset-tag metadata,
        source unconfirmed -- the environment's own egress proxy has not been ruled out as an
        alternative to per-request server-side variation."

  limitations:
