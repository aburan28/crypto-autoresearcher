evidence:
  id: EV-MONO-afcb01
  hypothesis_id: H-MONO-1d50ac
  experiment_ids: [EXP-MONO-005b49, EXP-MONO-cb905d]
  run_ids: [RUN-MONO-005b49-1, RUN-MONO-cb905d-2]
  type: empirical
  direction: leans_supporting_but_via_unbroken_chain_of_post_hoc_analytic_choices
  strength: >-
    pooled_two_cell_estimate_nominally_significant_second_cell_alone_severely_underpowered_not_a_clean_replication_failure_review_breakthrough_escalation_required_before_any_further_advancement
  claim_tier: toy
  certificate_refs:
    - experiments/EXP-MONO-005b49/execution_report.yaml
    - experiments/EXP-MONO-005b49/runs/RUN-MONO-005b49-1/
    - experiments/EXP-MONO-005b49/reviews/validator/validation-report.yaml
    - experiments/EXP-MONO-005b49/reviews/red-team/red-team-report.yaml
    - experiments/EXP-MONO-cb905d/runs/RUN-MONO-cb905d-2/
    - ledger/evidence/EV-MONO-c0bf6d.yaml
    - ledger/decisions/DEC-20260904-8c17d5.yaml
    - ledger/corrections/CORR-20260904-d0205d.yaml
  proof_status: derivation
  proof_status_note: >-
    H-MONO-45183a Part B's closed form (6(tau-1)/N) remains a derivation,
    unmodified. This evidence record concerns whether that closed form's
    own (N,tau)-only completeness (no term for endomorphism ring) holds,
    now tested at TWO independent same-prime matched cells.
  proof_refs:
    - experiments/EXP-MONO-005b49/reviews/validator/validation-report.yaml (independent Stage-0 re-derivation with a planted-earlier-match control; blind rederivation of P1/P2/P3/z/p, exact match)
    - experiments/EXP-MONO-005b49/reviews/red-team/red-team-report.yaml (power analysis with its own sensitivity controls; inverse-variance-weighted pooled cross-cell estimate; Fisher-combined comparison; CM-variant confound identification)

  observations:
    - >-
      SECOND CELL FOUND AND MEASURED CLEANLY: p=3541, N=3600, tau=4,
      CM variant j=0 (distinct from the first cell's j=1728), found as the
      genuine first match in an ascending same-prime scan of [3001,20000],
      independently re-verified by the Validator via a from-scratch
      re-implementation PLUS a planted-earlier-match control (confirmed
      the method would have reported an earlier prime had one existed).
    - >-
      SECOND CELL'S OWN TEST, TAKEN ALONE: P1=2.3776 (ordinary), P2=2.1383
      (CM), P3=1.1119, z=0.6112, two-sided p=0.5410 -- NOT significant.
      Independently reproduced to full double-precision by the Validator,
      blind from all restatement sources.
    - >-
      "REPLICATION FAILED" IS THE WRONG CHARACTERIZATION, PER THE RED
      TEAM'S OWN POWER ANALYSIS, INDEPENDENTLY RE-VERIFIED BY THIS
      COORDINATOR TO FULL PRECISION (power=0.1395): this cell's own test
      had only ~14% power to detect an effect the SIZE of the first
      cell's own observed departure. A non-significant result from a test
      this underpowered is close to uninformative about whether a
      real effect of that size exists -- it is expected roughly 86% of
      the time even if the true effect is exactly cell 1's magnitude. The
      Red Team traced the power deficit to a structural design gap in
      EXP-MONO-005b49's own specification: H-MONO-45183a's own closed form
      makes collision rate scale as ~1/N, and searching a disjoint range
      with mechanically larger N at a FIXED draw count (20000) was almost
      guaranteed to undercount relative to the first cell, independent of
      any real effect. THIS IS A GENUINE, SELF-DISCLOSED DESIGN DEFECT IN
      THIS CONTRACT, discovered by the Red Team's OWN adversarial
      power-calculation joint working as intended.
    - >-
      A PROPERLY-WEIGHTED POOLED ESTIMATE ACROSS BOTH CELLS IS NOMINALLY
      SIGNIFICANT, MORE SO THAN EITHER CELL ALONE: inverse-variance-
      weighted pooled log-ratio = 0.144664 (pooled P3 = 1.1557), pooled
      SE = 0.062519, z = 2.3139, two-sided p = 0.020673. INDEPENDENTLY
      RE-VERIFIED BY THIS COORDINATOR from the four raw counts of both
      cells directly (not from either report's prose), matching the Red
      Team's own reported figures to full precision. Cochran's Q = 0.057
      (df=1, p=0.81) shows no DETECTED heterogeneity between the two
      concordant point estimates (1.1623 at p=617, 1.1119 at p=3541) --
      but with n=2 cells this test has essentially no power to detect
      real heterogeneity, so "no heterogeneity detected" is not the same
      as "confirmed homogeneous."
    - >-
      FISHER'S COMBINED-PROBABILITY TEST ON THE SAME TWO P-VALUES GIVES A
      DIFFERENT, NON-SIGNIFICANT ANSWER (p=0.0713), independently
      re-verified by this Coordinator. This divergence from the pooled
      inverse-variance estimate (p=0.0207) is expected and instructive:
      Fisher's test discards effect-size and precision information the
      direct pooled estimate uses, illustrating exactly the known
      weakness this lane has already documented (Fisher combined
      probability's relative weakness against a diffuse-but-concordant
      signal versus a single extreme outlier) -- here in the OPPOSITE
      direction from prior instances (the diffuse signal IS real and the
      cruder test misses it, rather than being fooled by a single
      outlier).
    - >-
      THE POOLED ANALYSIS IS ITSELF A NEW POST-HOC STATISTICAL METHOD,
      NEVER PRE-REGISTERED: neither EXP-MONO-cb905d nor EXP-MONO-005b49's
      own frozen contract named a cross-cell pooling plan before either
      run. This is methodologically standard and defensible (inverse-
      variance weighting of independent effect-size estimates is the
      ordinary way to combine them, not an ad hoc "try many tests until
      one works" maneuver) -- but it is still the case that EVERY
      significant reading obtained on this question so far (cell 1's own
      corrected P3, and now this pooled estimate) was constructed AFTER
      seeing data that made the prior analysis look inadequate. This
      unbroken sequence of after-the-fact, individually well-justified
      corrections is exactly the pattern that inflates apparent
      significance even when each correction is honestly and correctly
      motivated -- and is precisely why this record does NOT treat the
      pooled p=0.0207 as sufficient grounds for "supported" on its own.
    - >-
      A PREVIOUSLY-UNFLAGGED CONFOUND IS DISCLOSED: the two cells' CM
      curves are different CM variants (j=1728 at p=617, j=0 at p=3541) --
      different automorphism-group loci. Any cross-cell comparison
      involving the CM curve's own value (P2, or any P2-specific claim)
      therefore conflates prime-to-prime variation with CM-variant
      variation in a way a P1-only (ordinary-curve) comparison does not.
      The pooled P3 estimate above still combines both curves' full
      ratios per cell, so this confound applies to it too and is not
      resolved by this record.
    - >-
      P1 VALUES ACROSS CELLS (2.398, 2.378) ARE NOT STATISTICALLY
      DISTINGUISHABLE FROM P2 VALUES' OWN CROSS-CELL VARIATION (2.063,
      2.138) AT n=2: formally tested by the Red Team (P1 cross-cell
      z=0.066, p=0.947; P2 cross-cell z=-0.268, p=0.789) and independently
      spot-checked as directionally consistent by this Coordinator. The
      superficial appearance that "P1 looks more stable than P2 across
      cells" is NOT a statistically supported finding and is disclosed as
      an observation that did not survive formal testing, per this lane's
      own discipline against reading pattern into noise.

  disposition: >-
    NOT ADVANCED TO SUPPORTED. The properly-pooled, methodologically
    sound cross-cell estimate is nominally significant (p=0.0207) and
    represents the strongest evidence this lane has produced for
    H-MONO-1d50ac's own endomorphism-ring-linked reading -- but it arrives
    at the end of an unbroken chain of post-hoc analytic corrections
    (test-mismatch fix at cell 1, discovery of cell 2's own severe
    underpowering, invention of the pooling method itself), a
    methodologically defensible chain but not a pre-registered one, and
    it bears directly on H-MONO-45183a Part B's own already-validated
    (N,tau)-only completeness claim. Per this program's binding review-
    architecture rule, a result contradicting prior independently
    validated evidence routes to the review-breakthrough tier
    (validator-breakthrough, red-team-breakthrough) before any further
    status advancement. See DEC-20260904-ffaebb for the escalation and
    named next action.
