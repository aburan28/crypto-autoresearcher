      via prime-factor counting). Fractional O_F-ideals were omitted. Pool is
      therefore larger, probability per guess smaller than Ω(n^{-1-o(1)}).
    - >-
      Heuristics 1-3 independently experimentally verified (per 30/06 update,
      verbatim: "Heuristics 1-3 have been independently experimentally verified").
    - >-
      Our BATCH-56498f/d44912 derivation confirmed the QUATERNION ALGEBRA
      version of the same principle. The paper's correction applies to the
      NUMBER FIELD O_F (Step 25-28 context). Both are correct for their rings.
    - >-
      KN-OPEN-028 Q1 closed: "Appears to run in super-polynomial time" confirmed
      as Case C (bounded denominator sampling). No sub-exponential advantage
      over the 2^{n/2+1+o(n)} Straznickas-Weis baseline is established.

