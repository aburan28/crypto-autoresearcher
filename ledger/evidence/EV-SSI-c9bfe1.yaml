  observations:
    - id: O-alias
      text: >-
        EigenX is the user-facing alias for the existing CEST-PKE candidate,
        not a new construction. Its frozen accepted-key core is A=psi(P),
        R=[r]P, sender transfer [r]A, and recipient transfer psi(R).
    - id: O-review-vector
      text: >-
        Independent owners report J1 holds and J2, J3, J4, and J5 break. J1
        establishes the exact adaptive bounded-OneEnd target only. J2 and J3
        break portfolio-wide on I3; I1 and I2 remain inconclusive.
    - id: O-interfaces
      text: >-
        I1 is conditionally sufficient but has no uniform public constructor
        or complete resource certificate. I2 gives the conditional transcript
        accounting form but lacks every-prefix law, stopping-tail, and resource
        certificates. I3 is path-correlated, pulls back to
        [deg(phi)^2]alpha, and an allowed singleton-support base leaves the
        phase-1 ring rank at most two, so it is a scoped break.
    - id: O-obligations
      text: >-
        O3 alone has a reviewed discharge: for accepted valid keys and nonzero
        r, psi([r]P)=[r]psi(P), so the canonical sender and recipient pad
        inputs agree and actual-message decryption succeeds with conditional
        failure probability zero. O1, O2, O4, O5, and O6 remain open.
    - id: O-pairing
      text: >-
        For q-torsion T, e(P,T)=e(R,A) alone admits T=[r]A+[x]P. Adding
        e(A,T)=1 uniquely forces x=0 and recognizes T=[r]A. This recognizes a
        supplied transfer point; it does not compute it, reconstruct an
        evaluator, or extract a complete endomorphism ring.
    - id: O-reduction
      text: >-
        The single-challenge classical-ROM reduction to the separately named
        CEST-XFER-KI assumption is directionally valid on its exact key law,
        but no exact EndRing challenge embedding, attacker-to-complete-basis
        extractor, adaptive OneEnd compiler, success loss, or total-cost proof
        is supplied. EndRing-solver-to-decrypt is only the reverse attack
        direction.
    - id: O-cca2
      text: >-
        In the standard IND-CCA2 game with bytewise exact-challenge exclusion,
        changing v* to v* XOR Delta for nonzero Delta gives a distinct valid
        ciphertext whose decryption is m_beta XOR Delta. One decryption query
        therefore recovers the challenge message. This breaks the frozen
        unauthenticated syntax only and does not contradict the narrower
        conditional IND-CPA proposal.
    - id: O-documentation
      text: >-
        J6 passed after corrections. TASK-20261013-1c2b7a restored visible PDF
        direction arrows and durable repository links; TASK-20261013-b61e2d
        corrected inspection metadata to distinguish 31 PDF Link annotations
        from 36 extracted wrapped href occurrences. J6 inspected the actual SVG
        and all eleven final PDF pages.
    - id: O-final
      text: >-
        Three bridge interfaces were evaluated, none survives J1--J4, EigenX
        is not established as a complete or secure EndRing PKE, and the goal
        remains active with no completion criterion met.
  inference: >-
    A future bounded round should rerank one materially different recipient
    mechanism that exposes ring-identifying behavior beyond EvalLine_(P,A),
    and require exact challenge simulation, extraction, loss, total cost, the
    complete adversarial view, and independent review before any advancement.
  boundaries:
    - No complete, secure, novel, practical, deployable, or post-quantum EigenX PKE is established.
    - No IND-CPA-under-EndRing, IND-CCA, QROM, multi-user, or concrete-security theorem is established.
    - No attacker-to-complete-EndRing extractor or complete adaptive OneEnd bridge is established.
    - No EndRing hardness result, universal impossibility theorem, complete-ring reconstruction, or separation theorem is established.
    - I1 and I2 are inconclusive conditional interfaces; missing constructions and bounds are not nonexistence evidence.
    - I3 and the IND-CCA2 attack are scoped to the frozen interfaces and syntax.
    - The classical-ROM transfer extraction is a separate-assumption result and is not an EndRing reduction.
    - The diagram, PDF, and inspection artifacts are presentation and custody records, not mathematical evidence.
  unresolved_confounds:
    - Executable TrapCurveGen, complete-ring certification, canonical selector and encoding, accepted mass, retry tails, and resource bounds.
    - A recipient mechanism whose observable behavior identifies more than the public-key-determined line evaluator.
    - Exact EndRing real-key challenge embedding and attacker-to-rank-four-evaluable-basis extraction with quantified loss and cost.
    - Complete adaptive-query OneEnd coverage if that reconstruction route is used.
    - Complete byte grammar, rejection behavior, authenticated ciphertext integrity, QPT/QROM and multi-user models, side-channel scope, and malicious-key/setup handling.
    - Independently validated toy implementation, concrete parameters, honest cost table, and primary-source non-duplication review.
