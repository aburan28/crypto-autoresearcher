  hypothesis_id: H-MLKEM-7d9bcc
  hypothesis_id_note: >-
    NAMED, NOT NULL, because unlike EV-MLKEM-5aa471/EV-MLKEM-4ba196 (instrument checks
    unrelated to any live working assumption over a specific candidate), this record's whole
    reason for existing is PREREG-8's own Stage 0, which exists SOLELY to gate H-MLKEM-7d9bcc's
    own Stage 1 (EXP-MLKEM-42ea04). Naming it here does NOT mean this record adjudicates C1 or
    C2 -- it explicitly does not, and cannot: PREREG-8 section 4.3 item 1's own FORBIDS clause
    bars any C1/C2 statement, in either direction, when T-PROJNOISE-NODATA fires (see
    termination_branch below), and every artifact this record cites honours that bar.

  experiment_ids: [EXP-MLKEM-42ea04]
  run_ids: []
  run_ids_note: >-
    No ledger RUN-* record exists for this task, matching this goal's own established
    PREREG-driven-Stage-0/infra-task pattern (cf. EV-MLKEM-5aa471, VAL-20260814-b13873's
    identical finding for TASK-20260814-c87a24). TASK-20260814-ffd791's own run_manifest.yaml
    declares two descriptive run_ids internally: RUN-MLKEM-STAGE0-INFRA-1 (section 1,
    completed_valid, 4.940s) and RUN-MLKEM-STAGE0-FEASIBILITY-1 (section 2, completed_valid --
    the MEASUREMENT PROCESS terminated cleanly and reported real data for every planned
    cell/point; this status describes the run's own honest completion, not that any cell
    "succeeded" at reduction: 0/6 main-grid cells reached a completed BKZ reduction).

  type: empirical

  direction: neutral
  direction_note: >-
    NEUTRAL, and this is the correct word, not a hedge. This record adjudicates no proposition
    about C1 (the tail law) or C2 (the order-statistic floor) -- it CANNOT, because
    T-PROJNOISE-NODATA fired for the whole package (see termination_branch below), and PREREG-8
    section 4.3 item 1 forbids exactly that statement, in either direction, at the affected
    scope. What this record DOES adjudicate, and states plainly rather than folding into a
    hedge, is (a) that the reported infrastructure observation (0/6 main-grid cells reached a
    completed reduction, each failing identically with fpylll.util.ReductionError('infinite
    loop in babai')) is independently reproduced, bit-for-bit at the seed level, by the
    Validator; and (b) that the producer's own root-cause CHARACTERIZATION of why is PARTIALLY
    CORRECTED by the reconciled evidence of both reviews plus the orchestrating session's own
    direct adjudication (see root_cause_reconciliation below).

  # ==================================================================
  # VERDICT AWARENESS -- READ THIS SECTION BEFORE CITING ANYTHING BELOW
  # ==================================================================
  validator_verdict: passed
  validator_verdict_note: >-
    The Validator (TASK-20260814-a94ddf, VAL-20260814-a94ddf) returned `passed`. The
    notarization chain was independently checked in both directions with git plumbing; section
    1's three infrastructure checks were independently re-derived from FIPS 203's own text and
    PREREG-8's own words (never importing the producer's module) and matched the producer's own
    PASS at every check, including an extra dimension (d=14) the producer did not test; two
    Stage-0 main-grid cells (d=256/beta=40, d=512/beta=40) were independently re-reduced from
    scratch and reproduced the identical ReductionError with BIT-IDENTICAL seeds (genuinely
    confirming SEED_ROOT=715923 was used, not merely declared); two toy-floor points (d=8,
    d=12) were independently re-swept and reproduced bit-identical r_min values; the
    termination branch was independently re-derived from PREREG-8's own frozen text and found
    correct. A `passed` verdict here means the receipt is ADMISSIBLE EVIDENCE of what it
    reports. It does NOT mean the producer's own root-cause characterization is correct as
    stated -- the Validator's own ART-5/ART-6/ART-7 substantially extend and, on one material
    point (the isolated-LLL-step precision question), CORRECT it, exactly as documented below.

  red_team_verdict_summary: >-
    The Red Team (TASK-20260814-fe02ff, RT-20260814-fe02ff) states plainly in its own
    narrowest_supported_statement: "T-PROJNOISE-NODATA firing for the whole package, as
    actually configured and actually run ... is CORRECT and this review does not challenge
    it." What it challenges is the producer's own CAUSAL CHARACTERIZATION of why: it built a
    live counterexample (probe3 + probe5) showing the isolated LLL-preprocessing step that
    fails under the producer's default construction SUCCEEDS in 0.003-0.004s once
    BKZReduction is handed an explicitly-configured, higher-precision GSO.Mat with NO
    GSO.ROW_EXPO flag, on the EXACT (d=256, beta=40, seed=1398073216) instance the producer
    reports failing -- directly contradicting the producer's own environment.json claim that
    mpfr "FAILED ... effectively instantly. Rules out a simple default-precision explanation."
    The Red Team also shows this fix is NOT free: a full bkz(par, tracer=True) tour under the
    same corrected construction ran ~684s of steady CPU with no error and no completion before
    being manually terminated to protect its own review budget (probe6). Its own
    narrowest_supported_statement is explicit that this does NOT mean "Stage 1 is now
    unblocked."

  admissible_now:
  - "Section 1's three infrastructure checks (fpylll install/callable, CBD/FIPS-203 compression
    re-derivation, batched-vs-scalar Babai exactness) -- ALL PASS, independently re-derived by
    the Validator from FIPS 203's own text without importing the producer's module (ART-1)"
  - "The reported Stage-0 main-grid observation itself: 0/6 (d,beta) cells reached a completed
    BKZ reduction under the producer's own default construction (raw IntegerMatrix ->
    BKZReduction, which builds GSO.Mat(A, flags=GSO.ROW_EXPO) at float_type='double'
    internally), each failing identically with fpylll.util.ReductionError('infinite loop in
    babai') well inside the 3600s cap (53.7s-408.9s) -- independently reproduced BIT-FOR-BIT AT
    THE SEED LEVEL by both the Validator (d=256/beta=40, d=512/beta=40; ART-2, ART-3) and the
    Red Team (d=256/beta=40; probe1), and by the orchestrating session's own adjudication
    scripts (same seed_used=1398073216 at d=256/beta=40, six separate script runs)"
  - "The toy-floor sweep's own completed points (d=8: 0.73s, r_min=0.001731483612129986; d=12:
    251.0s, r_min=0.001000396285911445) -- both bit-identical to the producer's own values,
    independently re-derived by the Validator (ART-4)"
  - "T-PROJNOISE-NODATA firing for the whole package, per PREREG-8 section 2.3/4.3(1)(b) --
    confirmed correct by the Validator (CTRL-1), the Red Team (narrowest_supported_statement),
    and the orchestrating session's own direct adjudication, all three independently"
  - "The notarization chain (TASK-20260814-518949 -> TASK-20260814-cb26de -> this batch's own
    HEAD) -- independently re-verified in both directions with git plumbing by both reviews"
  - "SEED_ROOT=715923 and the full default_rng([SEED_ROOT, stage_index, d, beta, arm_index,
    draw_index]) formula were GENUINELY used, not merely declared -- confirmed by bit-identical
    seed reproduction across the Validator, the Red Team, and the orchestrating session's own
    adjudication scripts"
  - "The ROW_EXPO mechanism explanation (root_cause_reconciliation below): direct, live,
    reproducible code-level fact, independently confirmed by three separate sessions (Validator,
    Red Team, orchestrating session) each testing a different slice of the same construction
    space and converging on the same reconciled account"
  - "TWO DISTINCT DIMENSION BOUNDARIES for the default double-precision construction at beta=10,
    now reconciled (review_reconciliation.the_second_reconciled_discrepancy_dimension_boundary
    below): an ISOLATED-LLL-STEP boundary (Red Team's own d=192 works/d=224 fails) and a
    SEPARATE, LOWER, FULL-BKZ-TOUR boundary (Validator's own d<=184 works/d>=192 fails) --
    confirmed by the orchestrating session's own direct adjudication at the exact disputed
    point (d=192), using each review's own exact construction: Red Team's isolated-LLL
    construction COMPLETES at d=192 (0.0061s); the Validator's full-native-BKZ-tour
    construction FAILS at d=192 (6.65s, RuntimeError: Aborted, the same underlying condition).
    Both reviews' own numbers are correct for what each one measured; neither needs correction."

  not_admissible_now:
  - >-
    THE PRODUCER'S OWN ROOT-CAUSE CHARACTERIZATION, AS STATED IN writeup.md ("a genuine,
    unfixable incompatibility between this host's fpylll 0.6.4/fplll build and BKZ's own
    internal LLL preprocessing ... not resolved by the one alternative precision setting that
    could be tested to a definite result"), IS NOT ADMISSIBLE AS STATED. See
    root_cause_reconciliation below for the precise, narrower statement that IS admissible.
  - >-
    ANY STATEMENT THAT THE FIX (dropping GSO.ROW_EXPO, raising mpfr precision explicitly) IS
    FREE, CHEAP, OR ALREADY MEASURED TO A COMPLETED RESULT AT THE MAIN-GRID CELLS. See
    unmeasured_fixed_cost below -- every attempt at the corrected full-tour construction, by
    anyone, has been terminated by a time bound before finishing.
  - >-
    A SINGLE, UNQUALIFIED NUMERIC DIMENSION BOUNDARY FOR "the double-precision, ROW_EXPO-default
    failure," STATED WITHOUT NAMING WHICH OPERATION (isolated LLL step vs. full BKZ tour) IT
    DESCRIBES. There are properly TWO boundaries, not one -- see admissible_now above and
    review_reconciliation below. A citation naming ONE boundary without its own operation label
    (e.g. bare "d=192 is the failure threshold") is not admissible; a citation naming BOTH,
    correctly attributed, is.

  strength: replicated
  strength_basis: >-
    `replicated` is claimed for the ADMISSIBLE-NOW core listed above ONLY: section 1's three
    checks, the reported ERROR observation itself at the seed level, the toy-floor completed
    points, the termination-branch determination, the notarization chain, the ROW_EXPO
    mechanism explanation for WHY dropping it avoids the immediate exception at the isolated-
    LLL-step and wrapped-lll_obj levels, and now ALSO the two-distinct-boundaries account
    (isolated-LLL-step boundary vs. full-tour boundary) -- FOUR separate live-adjudication
    results now converge on the SAME general pattern (an isolated LLL/preprocessing-only probe
    is systematically more permissive than the full BKZ-tour operation it was meant to stand in
    for), independently discovered TWICE from two structurally different apparent
    contradictions (the mpfr-fixability question; the dimension-boundary question) and resolved
    the same way both times by the orchestrating session's own direct code execution against
    the same live fpylll install both reviews used. It is explicitly NOT claimed for: the
    producer's own root-cause characterization as literally stated (corrected, not replicated);
    or the real per-cell cost of the fixed construction (unmeasured by anyone, `strength:
    anecdotal` at best -- see unmeasured_fixed_cost).
    WHAT `replicated` DOES NOT MEAN HERE, restated because it is load-bearing every time this
    goal writes it: NOT model-level and NOT independently reviewed in the AGENTS.md rule 12
    sense for the RECONCILIATION step specifically. The Validator and Red Team ARE independent
    sessions (fresh, no shared transcript, own code). The reconciliation itself
    (root_cause_reconciliation below) was performed by the SAME orchestrating session that
    dispatched both reviews and drafts this archive -- it is a direct, live, reproducible
    execution against real fpylll (not an assertion), but it is NOT a fourth, independent
    review of the reconciliation's own three scripts. This record does not claim it is.

  claim_tier: toy
  claim_tier_note: >-
    TOY, UNCONDITIONALLY, per PREREG-8's own frontmatter (q=3329, 12-bit prime). q=3329;
    d in {256, 512} (main grid, ERROR outcome at every cell); toy_floor d in {8,12,16,20};
