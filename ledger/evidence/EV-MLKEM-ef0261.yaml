  # ==================================================================
  # THE TERMINATION BRANCH
  # ==================================================================
  termination_branch:
    branch: T-PROJNOISE-NODATA, fired for the WHOLE package, per PREREG-8 sections 2.3 and 4.3 item 1.
    read_off: >-
      n_cells_cleared = 0 of 6. PREREG-8 section 2.3: "If EVERY cell is dropped,
      T-PROJNOISE-NODATA fires for the WHOLE package; Stage 1 does not run at all." Every one of
      the 6 main-grid cells failed to reach a completed reduction -- not via a
      PER_BASIS_FEASIBILITY_CAP=3600s timeout as section 2.3's own literal text anticipates
      (all 6 failed in 53.7s-408.9s, well inside the cap), but via a deterministic,
      cap-independent, reproducible exception. Section 2.3's literal "DROPPED"/"NOT_COMPUTED"
      wording is textually tied to the cap-timeout case; a genuine ERROR outcome is a THIRD
      category its literal words do not describe. BOTH REVIEWS INDEPENDENTLY RE-DERIVED THIS
      GAP AND REACHED THE SAME CONCLUSION the producer's own writeup already discloses: section
      4.3 item 1's own MEANS clause ("this attempt did not produce usable data at the affected
      scope, for a reason OTHER than the hypothesis's own content") is BROADER than section
      2.3's literal DROPPED wording and covers the ERROR outcome exactly as well as a cap
      timeout, because in both cases zero cells produced a completed reduction for a reason
      unrelated to C1/C2's truth. The Validator's own CTRL-1 states this is the CORRECT,
      best-available reading under the frozen text, not merely a defensible one; the Red Team's
      own narrowest_supported_statement independently agrees and does not challenge the branch.
    the_clause_quoted_verbatim_from_prereg_8_4_3_item_1: >-
      "fires when EITHER (a) section 1's infrastructure re-verification fails ... OR (b) Stage
      0 drops every (n, beta) cell ... OR (c) fewer than 4 of the required >= 8 draws complete
      within budget at a given cleared cell. Scope: fires per affected cell, or for the whole
      package under (a) or (b). MEANS: this attempt did not produce usable data at the affected
      scope, for a reason OTHER than the hypothesis's own content. LICENSES: citing Stage 0's
      own cell-by-cell benchmark results (wall-clock, memory, tours, delta) as a standalone,
      reportable infrastructure-timing deliverable (R-PN-OUT-1) regardless of this branch
      firing; licenses NO statement about C1 or C2's truth at the affected scope, in either
      direction. FORBIDS any claim about C1 or C2 at the affected scope, in either direction."
    what_this_licenses: >-
      Citing the Stage-0 cell-by-cell benchmark results (the ERROR outcome and its exact
      exception at every main-grid cell; the toy-floor sweep's completed/NOT_COMPUTED results
      and selected d=12) as R-PN-OUT-1, exactly as writeup.md already does. Nothing else.
    what_this_forbids: >-
      Any statement about C1 or C2's truth, in either direction, at any of the 6 cells. Neither
      the producer, nor either review, nor this record makes one anywhere.

  # ==================================================================
  # ROOT-CAUSE RECONCILIATION -- THE LOAD-BEARING SECTION OF THIS RECORD
  # ==================================================================
  root_cause_reconciliation: >-
    THE PRODUCER'S OWN CHARACTERIZATION ("a genuine, unfixable incompatibility between this
    host's fpylll 0.6.4/fplll build and BKZ's own internal LLL preprocessing ... independent of
    beta ... not resolved by the one alternative precision setting that could be tested to a
    definite result [mpfr]") IS PARTIALLY CORRECTED, NOT CONFIRMED, BY THE RECONCILED EVIDENCE
    OF BOTH REVIEWS PLUS THE ORCHESTRATING SESSION'S OWN DIRECT ADJUDICATION. This must not be
    softened to "not yet fixed" or any similar hedge -- the reconciled evidence draws a precise
    distinction the producer's own bounded diagnostic did not reach:
    (1) THE ISOLATED LLL-PREPROCESSING STEP IS GENUINELY PRECISION-FIXABLE. The Red Team's
    probe5 constructs an explicit, correctly-configured GSO.Mat(A, float_type="mpfr") with NO
    GSO.ROW_EXPO flag, calls FPLLL.set_precision(212) first, and passes it directly into
    BKZReduction on the EXACT (d=256, beta=40, seed=1398073216) instance the producer reports
    failing -- the internal LLL step that fails under the producer's default construction
    SUCCEEDS in 0.0038s. The producer's own out-of-band mpfr diagnostic almost certainly never
    raised precision above fpylll's own 53-bit default (identical to 'double'), which the
    Validator independently confirmed by direct API inspection (ART-6) -- so the producer's
    "mpfr also failed, effectively instantly" finding most likely tested the SAME under-precise
    construction twice, not a genuinely higher-precision one.
    (2) BUT THE ACTUAL CONSTRUCTION stage0_feasibility.py's worker_main_cell() USES -- a raw
    IntegerMatrix handed to BKZReduction, which BUILDS ITS OWN INTERNAL GSO.Mat(A,
    flags=GSO.ROW_EXPO) AT double PRECISION, per bkz.py's own __init__ -- IS NOT FIXED BY
    PRECISION ALONE. The orchestrating session's own direct adjudication (ADJUDICATION.md,
    three tests, same host/commit as both reviews) resolves the apparent contradiction between
    the Validator's finding (mpfr at 212 and 424 bits, WITH ROW_EXPO, fails identically at the
    full-tour level -- ART-6) and the Red Team's finding (mpfr WITHOUT ROW_EXPO fixes the
    isolated LLL step -- OBJ-1): BOTH ARE CORRECT ABOUT THE EXACT CONSTRUCTION EACH TESTED. The
    isolated LLL step and the wrapped `lll_obj()` call succeed under mpfr regardless of
    ROW_EXPO (both settings, ~0.004s each -- adjudicate_precision.py, adjudicate_wrapping.py).
    THE DIVERGENCE IS AT THE FULL bkz(par, tracer=True) TOUR LEVEL, NOT AT LLL PREPROCESSING:
    with ROW_EXPO=True (the Validator's exact construction, and the construction
    stage0_feasibility.py's own worker_main_cell() actually produces from a raw IntegerMatrix),
    the full tour reproduces the identical ReductionError in 0.282s -- mpfr precision alone
    does NOT fix this, confirmed correct for the ACTUALLY-RELEVANT construction. With
    ROW_EXPO=False (the Red Team's own construction, extended from probe5's isolated step to
    the full tour), the tour does not hit that immediate failure but ALSO does not complete
    within 100s (this session) or 684s (the Red Team's own probe6) -- consistent with, not
    contradicting, the Red Team's own explicit finding that the corrected construction's real
    cost is unmeasured and apparently large.
    THEREFORE: for stage0_feasibility.py's own actual construction, exactly as run and exactly
    as reported, the producer's finding that mpfr precision does not resolve the failure IS
    CORRECT -- confirmed independently now by three sessions (the producer's own bounded
    diagnostic, the Validator, and the orchestrating session's own adjudication). What is
    corrected is the producer's broader CHARACTERIZATION that this is "a genuine incompatibility
    ... not resolved by the one precision setting that could be tested" -- stated without the
    ROW_EXPO qualification, this overclaims, because a concrete, already-available, ordinary
    fpylll construction change (drop GSO.ROW_EXPO; raise mpfr precision explicitly) DOES avoid
    the immediate exception at the isolated-LLL-preprocessing level. The producer's own
    follow-up recommendation (investigate an upstream fplll bug report, or a different
    fplll/fpylll build/version) is consequently NOT the cheapest next step -- see decision
    DEC-20260814-4ac30a for the follow-up this record's own evidence licenses instead.

  unmeasured_fixed_cost: >-
    EVEN THE CORRECTED CONSTRUCTION (mpfr, no ROW_EXPO) HAS NOT BEEN MEASURED TO A COMPLETED
    FULL-BKZ-TOUR RESULT BY ANYONE -- not the producer (who never tried it), not the Validator
    (who tested only the ROW_EXPO=True construction to the full-tour level), not the Red Team
    (probe6: ~684s of steady single-core CPU consumption at d=256/beta=40 under mpfr-212,
    manually terminated to protect its own 5400s task budget, before completing or erroring;
    probe2: a companion attempt at the cheaper d=224 did not complete within a 120s exploratory
    bound either), and not the orchestrating session's own adjudication (adjudicate_full_tour.py
    at ROW_EXPO=False: still running, no completion or error, after its own 100s bound). Every
    single attempt at the corrected full-tour construction, by every session that has tried it,
    has been TIME-BOUNDED AND TERMINATED BEFORE COMPLETION -- none is a fabricated timing or a
    silently discarded result; each is disclosed as a manual early termination in its own
    source artifact. The real per-cell cost under the fix REMAINS UNKNOWN. The preliminary
    evidence available (>100s and still running at 100s; >684s and still running at termination,
    versus the double-precision failure's own 70.2s-to-error at the same cell) is CONSISTENT
    WITH, THOUGH IT DOES NOT PROVE, a materially larger real cost than PREREG-8 section 6.2's
    own double-precision-based "well under a minute to on the order of an hour" estimate
    assumed. No Stage-1 sizing decision may treat "the fix is free once precision is corrected"
    as established by this record.

  # ==================================================================
  # REVIEW RECONCILIATION -- BOTH REVIEWS, WHERE THEY AGREED AND WHERE
  # THEY APPEARED TO DISAGREE
  # ==================================================================
  review_reconciliation:
    where_both_agreed: >-
      (1) T-PROJNOISE-NODATA firing for the whole package, as actually configured and actually
      run, is correct -- neither review challenges the branch itself. (2)
      PER_BASIS_FEASIBILITY_CAP=3600s and TOY_FLOOR_FEASIBILITY_CAP=900s were applied exactly
      as PREREG-8 section 6.3 specifies, not loosened or tightened (Validator CTRL-3; Red Team
      COST-1, checked directly against the code, not merely the prose). (3) No scope violation
