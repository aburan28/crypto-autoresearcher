    RECOVERY is claimed anywhere in this batch.

  proof_status: derivation
  proof_status_note: >-
    LAYERED. (1) The ROW_EXPO mechanism account is a DIRECT, LIVE, CODE-LEVEL DERIVATION: the
    orchestrating session's own adjudication scripts execute the exact `BKZReduction.__call__`
    codepath (`GSO.Mat(A, flags=...)` -> `LLL.Reduction` -> `lll_obj()` -> full `bkz(par,
    tracer=True)`) under both ROW_EXPO settings and report the observed pass/fail directly --
    not an inference from indirect signals. (2) The producer's own root-cause characterization
    is corrected by a COUNTEREXAMPLE (the Red Team's probe3/probe5: the isolated LLL step
    succeeds under the corrected construction on the exact failing instance), independently
    reproduced by the orchestrating session's own adjudicate_precision.py /
    adjudicate_wrapping.py. (3) The real cost of the fixed construction is EMPIRICAL/BOUNDED
    ONLY, not derived: every attempt (Red Team's probe6/probe2; the orchestrating session's own
    adjudicate_full_tour.py at ROW_EXPO=False) was manually terminated by a time bound before
    completing or erroring, so no session has a completed measurement to derive a cost figure
    from.

