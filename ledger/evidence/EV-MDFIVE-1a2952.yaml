  proof_status: empirical_only
  proof_refs: []
  proof_status_basis: >-
    No cryptanalytic claim is made or reviewed in this record. It documents
    (1) the primary-text frontier ledger (retrieved provenance), (2) the
    falsifiable instrument-class scope, (3) the executed MD4 lower control
    and its decision-table outcome, and (4) the two independent reviews of
    the frozen package.
  citation_provenance: >-
    Every citation below carries its provenance per templates/research-
    records.md: retrieved = fetched and read in-session by the named task
    (pointer to the filed text in the artifact list); internal = a committed
    record of this program. No recalled citation supports a claim in this
    record; the two recalled frontier entries (MD5 full preimage 2^123.4,
    Aoki-Sasaki 2^107 baseline) are cited only as marked pointers in O-1.
  observations:
    - id: O-1
      text: >-
        FRONTIER LEDGER (retrieved in primary text, 2026-08-21). 8 entries:
        6 retrieved (each with URL, retrieved_date, filed_text, and a
        verification_note stating what in the text grounds the entry) and 2
        recalled (explicitly marked pointers, never support; the source-
        preference order's exhaustion is recorded with a reviewer pointer).
        Key exponents exactly as the sources state them: MD4 collision - no
        asymptotic 2^N, "hand calculation" vs Dobbertin's 1/2^22 (Wang et
        al. 2004/199, retrieved); MD5 collision - no 2^N, ~1 hour on IBM P690
        for the first pair, 15 s-5 min for subsequent, any IV (same text,
        retrieved; the collision payload remains quarantined, cited by
        MANIFEST metadata only); MD4 preimage multi-block 2^78.4 with 2^128
        precomputation (2^99.7 without), second-preimage 2^69.4 (Guo-Ling-
        Rechberger-Wang 2010/016, retrieved); MD4 preimage one-block 2^94.98
        (Zhong-Lai 2010/583, retrieved); MD4 one-block Aoki-Sasaki baseline
        2^107 (recalled, secondary citation); MD5 full preimage 2^123.4
        (Sasaki-Aoki EUROCRYPT 2009, RECALLED - primary text unobtainable,
        order exhausted); MD5 preimage 47-of-64-steps 2^96 "not practical"
        (Aumasson-Meier-Mendel 2008/183 abstract, retrieved); step-reduced
        MD4/MD5 (40-43-step MD4, 28-step MD5, cube-and-conquer, no 2^N in
        the abstract, Zaikin arXiv 2212.02405, retrieved). DEFECTS DIS-
        POSITIONED (DEF-RT2): entries 7-8 are primary-ABSTRACT retrievals
        with filed_text null, honestly disclosed. The F-7 check ("first
        practical preimage attack" apparent error, DEC-20260810-1163ec F-7)
        remains UNSETTLED with reason: the Sasaki-Aoki 2009 primary text
        (LNCS 5479 pp. 134-152) could not be obtained after the source-
        preference order was exhausted; the reviewer pointer is recorded.
        Also corrected against the primary text: the recalled MD4-preimage
        "biclique-family" pointer is not what the literature shows - the
        standing MD4 preimage frontier is MITM-family, and the guessed
        ePrint ID 2004/307 resolved to an unrelated paper (the failed
        identification is retained in the filed texts as the record of the
        misidentification).
    - id: O-2
      text: >-
        INSTRUMENT-CLASS SCOPE (falsifiable, Pareto-checked). Three ranked
        candidates, each with mechanism, asymptotic time AND memory,
        feasibility, a quantitative prediction, a minimal discriminating
        test, and a falsification condition: CAND-1 differential-guided
        collision enumeration (fix the published Wang et al. message-word
        difference, enumerate the free second-block words; recalled cost
        2^39-2^64 marked as a pointer; killed if its MD4 signature is
        indistinguishable from the null baseline within TOL = 2); CAND-2
        state-level meet-in-the-middle on the compression path (O(2^w) time
        and memory for a w-bit mid-state meet; killed if the meet-count does
        not exceed the random-state baseline by TOL at a feasible w); CAND-3
        step-reduced inversion measurement (O(2^s) for s inverted steps;
        killed if the success probability is flat from 40 to 43 steps).
        All three dominated_by: null verdicts rest on a row-by-row check of
        all 8 frontier-ledger rows plus the instrument's measured cost row
        (the nulls are justified as same-method-family, delta ~0, not as
        unchecked). The named obstruction candidate: the partial-hit MSB-
        prefix length is bounded by the random-collision floor at the
        declared scale (2^21 blocks, 40-bit meet table, seed 0) - status
        NAMED (candidate), the quantity the MD4 control would measure. The
        MD4 control-run specification was completed in this record and
        ruled by the Coordinator (the rank3_ruling key of the committed
        dispatch queue, recorded before dispatch) with three amendments:
        the MD4 verification oracle (test-vector gate + independent second
        implementation), the expected row (R6 FAIL/FAIL; R5 only inverted),
        and the MSB-prefix discrimination criterion (qualitative; TOL = 2
        on the cost ratio only).
    - id: O-3
      text: >-
        MD4 CONTROL RESULT (the lower control). The declared instrument
        class (bounded BIRTHDAY/meet-table enumeration - NOT meet-in-the-
        middle, NOT differential - over identical-prefix 2-block messages,
        N = 2^21 distinct seeded second blocks, table over the low 40
        digest bits, seed 0, hex 512-bit block encoding, run_wrapped, 900 s
        hard deadline per run) was mirrored without change onto MD4
        (standalone MD4 written from the filed RFC 1320 text, sha256
        f727b15e19ab8ac5036ab7921476e8d8644512190ade32a2e0a2fb9d8a2421c7;
        3 rounds x 16 ops = 48 steps; round 1 no constant, round 2
        0x5A827999, round 3 0x6ED9EBA1; the MD5 sine table does NOT apply
        to MD4 - a task-card instruction defect, disclosed and ruled). RUN-
        MDFIVE-md4-v0-s0 (target, standard constants): FAIL, table_full,
        2,097,152 blocks, 38.85491 s wrapper-measured, 3 partial 40-bit-key
        hits, best full-digest MSB prefix 0 bits, certificate kind none.
        RUN-MDFIVE-md4-v16-s0 (null object, T'[i] = T[(i+16) mod 48] - a
        clean round-boundary shift: r1 -> 0x5A827999, r2 -> 0x6ED9EBA1, r3
        -> 0; everything else identical): FAIL, table_full, 2,097,152
        blocks, 38.604348 s wrapper-measured, 1 partial, best MSB prefix 1
        bit, certificate kind none. R = t_null/t_target = 0.9935513427,
        COMPARABLE (interval [0.5, 2.0], TOL = 2 fixed pre-acquisition).
        DECISION-TABLE ROW R6 (target FAIL, variant FAIL) - the expected
        row: shows "the instrument found nothing on either object within
        budget"; does_not_show "that no collision path exists for either
        (SC-4)". COST TRANSFER vs the MD5 calibration anchor (54.179836 s /
        55.156728 s, R = 1.018031, row R6, EV-MDFIVE-f3e1ca): MD4/MD5
        ratios 0.7171 (target) / 0.6999 (null) - MD4 ~29% cheaper,
        directionally consistent with the 48-step vs 64-step structure
        (step ratio 0.75), and the null-object control shows the gap is not
        a discriminator (the null runs at the same cost as its target).
        FIRST DISCRIMINATION DATA (the partial-hit signature): MD5 target
        0-bit best prefix / MD5 null 0-bit; MD4 target 0-bit best prefix /
        MD4 null 1-bit - the MSB-prefix quantity shows NO non-zero growth
        on the MD4 target beyond the null object, at a primitive whose
        differential structure is known to help a CONSTRUCTED differential
        method ("hand calculation"). Test-vector gate 7/7 against the filed
        RFC 1320 text at freeze; the shift-16 core is distinct; 35-test
        suite green; CONSUMPTION clean (the MD4 manifests' hash sets
        intersect the MD5 quarantined payload sha256 set in nothing; the
        payload was never read).
    - id: O-4
      text: >-
        REVIEW ROUND (pre-committed plan review-plan-02d397.yaml,
        coordinator prior recorded before any report returned). Red team
        (TASK-20260821-02d397, review-adversarial, resolved zai/glm-5.2,
        xhigh, independent session, sibling-blind, blind_from_respected):
        HOLDS - joints L1-L5 all hold with grounding; proves-too-much
        objects G/H/I all rejected; blind re-derivation of the BCP-2 row
        predicate (from BCP-2's null_object_control section only) agrees,
        including the synthetic R=3.0 both-FAIL control landing on R6 (the
        ratio does not move the row when both FAIL); NO coordinator prior
        overturned; 3 informational defects, dispositioned in
        DEC-20260821-117817 F-2. Validator (TASK-20260821-6a36a4,
        review-adversarial, resolved zai/glm-5.2, xhigh, independent
        session, sibling-blind): run-integrity HOLDS - all seven checks
        PASS on its own re-run output (archive binding 8/8 path hashes
        recomputed from the freeze tree; standalone MD4 re-run against all
        7 RFC 1320 vectors with its own driver; T-prime 48/48; wrapper
        timing with timestamp-delta agreement; sealing + completeness with
        the only intersection the pre-registered answer-digest reference
        field; cost transfer recomputed from the four wrapper timings; 35-
        test suite green), 0 defects. INDEPENDENCE NOTE: both reviewers
        resolved to the same model identifier under one usable backend -
        the independence is session-level (pre-committed plan, pre-recorded
        prior, sibling-blindness attestations, blind_from), NOT model-level
        diversity; that is stated, not papered over.
    - id: O-5
      text: >-
        METHOD-CEILING STATEMENT (issued at the named scope, per the
        inventor-protocol closure standard: named obstruction + argument +
        forward guidance + scope + does_not_show). THE STATEMENT: the
        declared instrument class - bounded unguided meet-table/birthday
        enumeration of identical-prefix 2-block messages, N = 2^21 blocks,
        40-bit meet table, seed 0, hex 512-bit block encoding, this
        hardware, wrapper-measured cost - CANNOT close a full 128-bit
        Merkle-Damgard digest match at the declared budget on either in-
        scope primitive, and its failure cost TRANSFERS across the two
        primitives within TOL (MD5 R = 1.018031; MD4 R = 0.9935513427).
        The binding quantity (the NAMED OBSTRUCTION, measured): the
        partial-hit MSB-prefix length stays at the random-collision floor
        (best 0 bits on all three targets, 1 bit on the MD4 null) at the
        declared scale - the unit is bits of matched high-order prefix
        beyond the 40-bit table key, read from the two run-record pairs,
        and the sample is small (1-3 partials per run, single seed), which
        is the error bar stated with it. THE ARGUMENT: the instrument
        enumerates random second blocks and detects collisions on the low
        40 bits; the published collision structures (Wang et al.) constrain
        the MESSAGE space, which the unguided enumeration does not; the
        null-object control on both primitives (identical signature and
        cost, R ~= 1) shows the measured quantity is not reading the
        primitive's structure but the birthday floor of a 40-bit table at
        2^21 entries; a target with known exploitable structure (MD4)
        produced no growth, so the instrument is not accessing that
        structure at this budget. FORWARD GUIDANCE (what remains open): the
        named escape routes are CAND-1 (differential-guided enumeration -
        predicted to produce a non-random partial-hit signature on MD4 at
        2^21; the reduced-scale demonstration was the designated batch-5
        content) and CAND-2 (state-level MITM at a feasible mid-state
        width; same), each with its falsification condition recorded in
        the scope. SCOPE: claimed over MD4/MD5 Merkle-Damgard compression
        at the declared scale only - not over other block budgets, meet-
        table widths, seeds, encodings, primitives, or instrument
        variants. DOES_NOT_SHOW: no statement about MD4's or MD5's
        security; no statement about the existence or non-existence of
        collision paths; no closure of any candidate lane (CAND-1/2/3
        remain open and falsifiable); no transfer to other primitives
        without a disclosed assumption.         CONCRETE COSTS (optimistic
        assumptions flagged): one declared-scale run costs ~39-55 s
        wrapper (MD4 38.85/38.60 s; MD5 54.18/55.16 s) and ~0.74 GB peak
        RSS at 2^21 entries; both runs were SPACE-limited (table_full),
        not deadline-limited - the 900 s deadline is ~2^4.5x the measured
        cost of one declared-space run, so the binding constraint is the
        declared space, not the clock. The declared space (2^21 blocks) is
        2^43 short of the generic 128-bit birthday bound (2^64 blocks) in
        block count, which is the gap the named escape routes (CAND-1,
        CAND-2) must address structurally rather than by budget growth.
