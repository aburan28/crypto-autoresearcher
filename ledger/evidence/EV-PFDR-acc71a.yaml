    seed_integrity: >-
      Curve seeds 1101-1108, target seeds 1-5, null seed labels {7,11,13,17,19}
      mixed per D3, positive-control seeds 2101-2103, secondary B = 8, window 8,
      degrees [3,6] on the sweeps and [4,66] / [4,130] on the positive control -
