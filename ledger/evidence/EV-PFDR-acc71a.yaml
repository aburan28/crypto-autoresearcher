    supported is the hypothesis's title claim - at fixed digit shape the graded
    Macaulay invariants of the prime-field digit-presented decomposition system
    are p-independent above a small threshold prime, because the system is the
    specialization of one integer matrix family, and the p-sweep is pipeline
    calibration. That claim is not merely observed here, it is DERIVED, with
    explicit witnesses (r = [1,6,15] / [1,2,1] and p_0 = 3), and the red team's
