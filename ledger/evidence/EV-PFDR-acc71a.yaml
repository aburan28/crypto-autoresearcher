    NOT REPLICATED - the three primes are three evaluations of a value that is
    forced for every odd prime, so nothing on the p-axis is an independent test
    of p-independence; the s-axis is untested and out of contract scope. The
    label "replicated (three primes, two independent engines)" is explicitly
