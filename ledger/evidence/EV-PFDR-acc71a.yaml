  observations:
    - >-
      O-1 (V3, the load-bearing recomputation). 245 of 245 draws recomputed by
      an implementation sharing no code with the meter give full_rank
      [0, 1, 6, 15] and top_rank [0, 1, 2, 1] - the predicted (1,1), (6,2),
      (15,1) - with fall_dim [0, 0, 4, 14], row counts [0,1,6,15] and column
      counts [42,57,63,64] / [20,15,6,1], at all three primes and including all
      five NIST P-256 named draws. S~ has the recorded 49 nonzero terms in every
      draw, the planted digit vector is a root of the reviewer's own S~, and the
      digits decode to the recorded (x1, x2). At the frozen fixture the 49
      coefficients are identical term by term to the producer's in-run sympy
      construction.
    - >-
      O-2 (R2, the deciding derivation). The whole recorded vector is FORCED.
      top_rank(D) = sum_{j+k=D-4} r_1(j) r_2(k) = [1, 2, 1] at D = 4, 5, 6, the
      integer top blocks have invariant factors (16), (16, 16), (16), and
      full_rank = [1, 6, 15] unless S~ has at least 64, 32, 16 zeros on the
      64-point cube. Hence profile, fall_dim [0,0,4,14], syzygy_dim 0, d_ff 5
      and deficit_series are forced for every odd p and every instance with
      fewer than 16 zeros. The fixture triple (941, 428, 3690) taken as INTEGERS
      and reduced modulo every prime in {3, 5, 7, ..., 199, 4099, 2^64 - 59, the
      P-256 prime} gives the reference profile at every one; the only deviating
      prime is 2. p_0 = 3, three orders of magnitude below the battery's
      smallest prime, at under a second of compute.
    - >-
      O-3 (R1). The rank-drop locus is EMPTY on the searched axis, not merely
      thin. The degree-4 part of S~ is the parameter-free integer form
      16 Q_1 Q_2, so the D = 5 top block cannot drop for any (A, B, x_R) at any
      odd prime and the explicit rank-drop point the plan asked for does not
      exist. In the multilinear quotient a drop at D = 6, 5, 4 needs at least
      16, 32, 64 zeros of S~ on the 64-point cube; exhaustively over all 4099
      targets for 19,992 curves at p = 4099 (81,947,208 curve-target pairs) the
      MAXIMUM number of zeros is 6, against a threshold of 16. The planted
      design contributes exactly 2 zeros in 120 of 120 recorded draws. Planted
      and uniform profiles agree at all three primes (20 uniform draws per
      prime).
    - >-
      O-4 (R4, the scope-fixing mutations). full_rank(D) is invariant under any
      rescaling of the nonzero values of S~ on the cube, hence a function of the
      CRT point set Z(S~) ALONE; top_rank(D) is a function of the fixed integer
      top form ALONE. Mutation M1 (same zero set, same 49-monomial support,
      random coefficients) gives 40/40 draws at each of the three primes the
      recorded NULL arm's profile [(0,0),(1,1),(6,6),(15,1)] exactly. Mutation
      M2 (same top form 16 Q_1 Q_2, random sub-top coefficients, NO curve, NO
      target, NO planted decomposition and no Semaev polynomial beyond its top
      monomial x_1^2 x_2^2) gives 40/40 at each prime the recorded SEMAEV
      profile [(0,0),(1,1),(6,2),(15,1)] exactly.
    - >-
      O-5 (R3). The measured positive-control first fall 66 and 130 is the
      CORRECT value and the frozen 65 and 129 was unsatisfiable by any instance.
      The top forms (x_1^2 x_2^2, x_1^B, x_2^B) have lcm syzygies at degrees
      B + 2, B + 2 and 2B, so no top-form dependency exists below B + 2 and
      exactly two exist at B + 2, neither of which lifts; the contract's own
      d_ff (first D with fall_dim > 0) MUST return B + 2 with fall_dim 2. The
      frozen B + 1 is IDEA-20260808-093497's degree of regularity
      d_reg = ceil((m(B-1) + D_S)/2), and is also the first degree at which the
      top block is of full column rank. Independently reproduced at
      B in {4, 5, 6, 8, 10, 12, 64, 128} and at p in {4099, 16411, 1000003,
      2^64 - 59}, always B + 2, with no fall below B + 2 at any B tested.
    - >-
      O-6 (V4, literal criterion accounting, recorded as a failure rather than
      re-scored). Frozen criterion (2) is NOT MET AS WRITTEN - the measured
      first fall is 66 and 130 against the frozen 65 and 129, in 6 of 6 draws at
      each prime, under the contract's own d_ff definition. Criteria (1), (3),
      (4) and (5) are met as written. The reading was RECORDED, not substituted:
      analyze.py keeps FROZEN.posctrl_d_ff = 65/129 and emits both
      first_fall_equals_frozen (False, False) and d_top_full_equals_frozen
      (True, True), the stopping rule's flatness test uses the first-fall
      histogram, and git diff of specification.yaml against the approving commit
      c5742969 is EMPTY. No criterion is re-scored by this record; a re-scoring
      needs a versioned protocol_amendment.
    - >-
      O-7 (R2 consequences, stated narrowly). Because the profile is forced,
      criteria (3) and (5) could fail only by an instrument fault, so their
      evidence strength is the derivation's and not 120 draws'; the "40 of 40
      paired" statistic is a SEED pairing, not an instance pairing, because
      (A, B) are drawn from the seed AND p and the null mixed seed contains p,
      so no instance exists at two primes and the paired count carries exactly
      the information of the marginal counts; and criterion (4)'s interval
      bounds an event set that is EMPTY at the prime it names.
    - >-
      O-8 (R2 objection RT-O1, a stated ground that is false as written). The
      committed records define P_D as the PRODUCT of the nonzero maximal minors
      and quote Prob[rank drop] <= deg(P_D)/p. At D = 6 the 15 x 64 matrix has
      C(64, 15) = 159,518,999,862,720 maximal minors, so deg(P_D) <= 4.79e15 and
      the bound is VACUOUS at p = 4099 and p = 16411 - exactly the primes where
      criterion (4) claims to measure the rate. The usable constant 30/4099 comes
      from Stage 0's single-minor refinement, which is correct and is NOT in the
      ledger record. Any evidence or knowledge record citing the constant must
      cite the single-minor form.
    - >-
      O-9 (R2 objection RT-O2, a second stated ground false as written).
      stage0-derivation.md section 4 computes "content primes" as the gcd of the
      ENTRIES of the D = 4 row and concludes "no odd prime divides any entry's
      content". Entry content is not minor content: the proves-too-much object
      W_{1,3} over F_3 is a matrix of entry content 2 whose rank drops at p = 3
      (rank 5 < 6), and 3 divides no entry. The check as implemented cannot
      exclude odd content primes. The repair, computed by the reviewer, is the
      integer invariant factors of the top blocks - (16), (16, 16), (16) - after
      which the odd-prime exclusion is correct and top_rank = [1, 2, 1] over
      every field of characteristic not 2.
    - >-
      O-10 (R4 objection RT-O6, a third stated exclusion false as written).
      CTRL-CONFOUNDERS-NAMED (i) and analysis.md assert that "only
      generator-level rank profiles are read; no ideal-level invariant appears".
      Four of the five reported invariants are point-set quantities and the
      fifth is a parameter-free constant, and the ideal generated by S~ in the
      membership quotient is exactly I(Z(S~)) for the digit encoding. The
      confound is not excluded by construction; it is NEUTRALISED by the
      separate fact that planting pins |Z(S~)| = 2, far below every threshold
      that could move a rank. The exclusion should be restated as conditional on
      |Z(S~)| < 16.
    - >-
      O-11 (R4, what the confound audit CLEARS). The output-degree proxy of
      IDEA-20260807-899c5e is genuinely excluded - no Groebner basis, quotient
      dimension, solution count or solving degree appears anywhere in the
      package. No arm's profile depends on the curve coefficients at this shape,
      and the nodal cubic's agreement at every prime is FORCED (identical top
      form; planted root gives 2 zeros, verified 40/40 per prime), as is the
      named P-256 cell's. The null-seed mixing (D3) is justified: the Semaev
      support is the same 49 monomials in all 40 draws at every prime, so
      verbatim seeds would have collapsed 200 null draws to 5 distinct
      polynomials.
    - >-
      O-12 (R2, RT-O5, the control's dynamic range). CTRL-POSITIVE-P-DEPENDENCE
      met its forced disposition (strictly increasing, no early fall, so the O1
      bar does not fire), but d_ff = B + 2 is a function of B ALONE - verified at
      fixed B = 8 across p = 4099, 16411 and 2^64 - 59, all giving 10 - and
      B = round(p^{1/2}) is a deterministic function of p, so the 66 -> 130
      movement is explained entirely by the change of matrix shape and a
      pipeline that ignored p would produce the same integers. The control has
      NO dynamic range on the axis it is supposed to gate. What DOES discharge
      instrument p-sensitivity is the reviewer's RT-C2, executed: the METER
      itself on the sweep's own (2,2,3) construction returns 0 of 24 at the
      reference profile at p = 2 and reproduces the p = 3 drop (23 of 24, one
      draw with full_rank@6 = 13) matching the reviewer's own code draw for draw.
    - >-
      O-13 (R2/R4, RT-O8, where a c/p law is real). For the Semaev arm HEUR-001's
      c_D/p law is the wrong functional form - a drop requires at least 16 zeros,
      a codimension-at-least-14 coincidence, so the true rate at p = 4099 is 0,
      not c/p, and 0 of 40 cannot discriminate c/p from p^{-14}. The arm where a
      c/p law is real and measurable is the support-matched null's top_rank at
      D = 5, whose drop rate the reviewer measured on the ladder
      p in {5, 7, 11, 13, 101, 4099} as 0.2800, 0.1835, 0.1035, 0.0935, 0.0130,
      0.0005 with 2000 draws per rung, consistent with c about 2. The contract
      sampled that arm with 200 draws at p = 4099, where the expected event
      count is 0.1. HEUR-001 is therefore NEITHER SUPPORTED NOR TESTED by this
      experiment and must not be recorded as supported.
    - >-
      O-14 (R4, RT-O9, HEUR-002). The pre-registered failure of HEUR-002 did
      occur, by exactly the pre-registered p-independent integers (top_rank@5
      -4, fall_dim@5 +4, d_ff -1 at D = 5, identical at all three primes). But
      M2 shows those integers are produced by an object with no Semaev, curve or
      target content, so "Semaev-specific structure carried p-independently by
      exactly those integers" overstates it: the whole offset is a constant of
      the digit map at (m, s) = (2, 3). The correction IDEA-20260731-009's
      HEUR-FF-1 needs is a closed-form tensor defect, not a measured offset, and
      no status of IDEA-20260731-009 changes.
    - >-
      O-15 (V2 and R4, converging on replication counting from two directions,
      neither reviewer having read the other). The nominal 40 draws per cell
      realise 31 distinct (A, B, x_R) triples at 4099, 30 at 2^64 - 59 and 29 at
      the P-256 prime, over 8 curves, because a curve whose on-curve window
      [0, 8) holds only two or three x-values cannot supply five distinct
      planted targets. The honest exact Clopper-Pearson 95 percent upper limit
      is therefore 0.1122 at 4099 (n = 31), ABOVE criterion (4)'s own 0.1
      threshold, and 0.3694 on the 8 distinct curves. Criterion (4) is still met
      as written because what the frozen text requires below 0.1 is the RATE
      (0.0000), but the interval must not be quoted as if it were below 0.1.

  inference: >-
    Compose V1-V4 with R1-R4 and the hypothesis's title claim is not merely
    supported but derivable, while what the 722 draws are evidence OF is
    narrower than the run count suggests. The receipt is admissible on every
    validation joint. The p-independence is forced by a parameter-free integer
    top form with only content prime 2, with p_0 = 3, and the one-integer
    instance ladder that actually tests "specialization of one integer matrix
    family" passes at every prime except 2. The sweep is therefore calibration,
    exactly as the hypothesis title says, and criteria (3) and (5) could only
    have failed by an instrument fault. The observable does not see the curve,
    the target or the prime: a curve-free, target-free object with the same top
    form reproduces the Semaev profile 40/40 at all three primes, and a
    different polynomial with the same zero set reproduces the null profile.
    Three stated exclusions of the record are false as written and are corrected
    here with the reviewers' own computations, which leave the conclusion on a
    better footing than it had. HEUR-001 is neither supported nor tested;
    HEUR-002 fails by its pre-registered integers, which are a constant of the
    digit map rather than Semaev-specific structure.

  largest_justified_claim: >-
    Scoped to (m, d, s) = (2, 2, 3) with window [0, 8), at p in {4099, 16411,
    2^64 - 59, the NIST P-256 prime}, one meter, one host: the graded Macaulay
    invariants recorded by EXP-PFDR-fd901a (full_rank [0,1,6,15], top_rank
    [0,1,2,1], fall_dim [0,0,4,14], syzygy_dim 0, d_ff 5; null top_rank@5 = 6,
    d_ff 6) are DERIVABLE and p-independent for every odd prime, with threshold
    p_0 = 3 - the top half being the rank of the parameter-free integer form
    16 Q_1 Q_2 with integer invariant factors (16), (16, 16), (16), and the full
    half being the evaluation rank of the degree-(D-4) monomials on the
    non-vanishing set, equal to [1, 6, 15] whenever the generator has fewer than
    16 zeros among the 64 digit points. Because a curve-free, target-free object
    with the same top form reproduces the whole profile, THIS IS NOT A STATEMENT
    ABOUT SUMMATION POLYNOMIALS, ELLIPTIC CURVES OR THE ECDLP: it is a statement
    about a fixed integer degree-4 form and a zero-set threshold.

  boundaries:
    - >-
      B-1. One shape. Nothing here touches the s-axis, the solving degree,
      yield, cost or the ECDLP, and the contract says so in its own
      interpretation_limits.
    - >-
      B-2. NO CRYPTOGRAPHIC-SCALE VALIDATION. The P-256 cells are exact ranks of
      a 64-column matrix whose value was forced before the run, costing 3.25 s
      and 62 MB. "Reached the P-256 prime" must never become "validated at
      cryptographic scale".
    - >-
      B-3. THE RESULT IS NOT ABOUT ELLIPTIC CURVES. Mutation M2 - no curve, no
      target, no decomposition, no Semaev polynomial beyond its top monomial -
      reproduces the Semaev profile 40/40 at every prime, and the singular
      non-curve cubic reproduces it at every prime by construction. Any
      downstream sentence of the form "the Semaev system at (2,2,3) behaves
      thus" must read "any generator with this integer top form behaves thus".
    - >-
      B-4. The pairing in the p-flatness tables is a pairing of SEED LABELS, not
      of objects: no (A, B, x_R) triple and no null RNG seed is shared between
      the 64-bit and 256-bit cells. With zero within-arm spread the pairing
      carries no information beyond the equality of two modal profiles.
    - >-
      B-5. The contract's PRIMARY frozen-fixture route is not executable in
      either direction. fd901a's (2,2,3) p = 4099 fixture is A = 941, B = 428,
      x_R = 3690 while EXP-PFDR-5726af's draw flagged is_frozen_fixture at the
      same seed labels is A = 527, B = 72, x_R = 2374 - the two contracts derive
