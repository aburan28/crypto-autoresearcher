    integer matrix family" actually means - was executed and passed at every
    prime except 2. Two joints break (R2, R4) and neither touches that claim:
    R2 establishes that the SWEEP is calibration rather than measurement, which
    is what the hypothesis title itself says; R4 establishes what the observable
    is a function of, which narrows the scope and is recorded as such below.
    Two stated GROUNDS of the hypothesis are false as written and are corrected
    rather than softened (see O-8 and O-9); the conclusion they were meant to
    support is now on a strictly better footing.

  strength: replicated
  strength_note: >-
    Replicated in the sense that matters here and NOT replicated in the sense a
    reader will assume, and both must be said. REPLICATED - the recorded values
