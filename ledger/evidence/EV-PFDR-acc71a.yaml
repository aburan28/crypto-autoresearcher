      286 / 286 / 316 draws; 40/40, 200/200, 40/40, 6/6 paired-identical; CP
      upper 0.08809730287880235 for 0 of 40 and 0.018275340355136227 for 0 of
      200; the single difference row (top_rank@5 -4, fall_dim@5 +4, d_ff -1)
      identical at all three primes. Re-deriving d_ff from per_layer for all 888
      sweep draws gives 0 mismatches.
    control_comparability: >-
      All seven declared controls present at their declared counts and
      substantiated - CTRL-FROZEN-FIXTURE (by its fallback route, see B-5),
      CTRL-POSITIVE-P-DEPENDENCE (forced disposition met), NULL-SUPPORT (200 per
      prime plus 25 named-curve), NEARBY-NON-CURVE-CUBIC (40 per prime, all 120
      cubics confirmed singular and all 120 planted x_R genuine roots),
      CTRL-SECONDARY-DIRECT-FIXED-B, CTRL-NAMED-CURVE (a = p - 3 and b the
      standard P-256 constant, both checked), CTRL-CONFOUNDERS-NAMED.
