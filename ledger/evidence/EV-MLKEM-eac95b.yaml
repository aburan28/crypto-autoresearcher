  what_this_evidence_is: >-
    Two discriminating controls on the BATCH-009 shape comparison, computed with
    zero new sampling from the authors' own archived verifyModel outputs. It is
    a statement about how well Approximation 4.9's functional family fits those
    archived toy-dimension curves under a fitted normalisation. It is not a
    measurement of ML-KEM security, not a cost-model statement, and not a claim
    about Carrier et al.'s Kyber figures.

  observations:
    - >-
      O-1 (ESTABLISHED, reproduced three ways). CHECK A IS ONE-SIDED AND
      ADVERSE. Neither archived file's own Approximation-4.9 exponent minimises
      rms against its own data. n=43: own p=26.0 rms 0.705494, argmin p=23.25
      rms 0.425715, excess 0.279779 bits. n=50: own p=24.5 rms 0.696881, argmin
      p=22.25 rms 0.427413, excess 0.269468 bits. Both curves strictly unimodal,
      both argmins interior, neither scan-width limited. Established by the
      producer, recomputed by the Coordinator directly from the raw 49-point
      curves, and re-derived independently by the validator, which integrated in
      u rather than v with its own panels, its own Gauss-Legendre rule and a
      golden-section K search, never feeding a value from results.json into a
      computation. Quadrature converged identically across GL orders 8/12/16 and
      3x panel density.
    - >-
      O-2 (ESTABLISHED, and it REFRAMES O-1). THE FAMILY FITS AT NO EXPONENT IN
      THE WINDOW. The validator ran an identifiability control the package did
      not: regenerating the curve from the model itself at the archived (p, Kbar)
      and rerunning the identical scan recovers the generating exponent exactly
      (rms 0.00000000 at p=26.00 and 24.50). So the displacement in O-1 is NOT
      an estimator artifact and Check A stands. But the same control shows a 2.75
      shift costs 0.535 bits on noiseless data, while the BEST ACHIEVABLE rms on
      the real data is 0.426 bits, not 0. The honest reading is therefore
      MISSPECIFIED FAMILY, LEAST-BAD MEMBER SITS LOWER -- not "a neighbouring
      exponent is the right one".
    - >-
      O-3 (ESTABLISHED). The displacement is robust to score weighting and the
      robustness runs in the adverse direction: across six weightings every
      low-noise weighting pushes the argmin FURTHER below the file's own
      exponent (at count>=1000: -6.00 and -4.50, excess +0.568 and +0.452 bits).
      The sub-band dependence flagged by the producer does not undercut the
      conclusion.
    - >-
      O-4 (COUNTER-INSTANCE, recorded because it is the one that cuts the other
      way). On the deep tail T > 1000 the n=43 file's OWN exponent IS the argmin
      (excess +0.000935 bits; exactly 26.00 on a coarser grid). That is the
      region whose counting standard deviation, 0.61 bits, is more than twice its
      residual rms, so it is also the least informative region. The package did
      not report this; the validator did. It does not overturn O-1, and it is
      recorded here so no reader has to discover it independently.
    - >-
      O-5 (ESTABLISHED). CHECK B FIXES THE SIGN, NOT THE MAGNITUDE, and the
      producer's careful statement of this is correct. The (4.22)-position model
      always predicts less, same direction as the BATCH-009 over-prediction.
      Concavity of min(1,.) gives only Delta <= 0: a two-point mean-preserving
      spread drives E[min(1,Z)] toward 0, so NO magnitude bound follows from
      concavity. The finite two-sided bounds -2.026543 (n=43 @471) and -2.333466
      (n=50 @420) come from P_in >= Q(T), a different fact. Both BATCH-009
      over-predictions (+1.515408, +1.710856) lie INSIDE those bounds, so the
      collapse is not excluded on magnitude grounds. The validator verified the
      d_lsc integral is in the position (4.22) specifies and that Kbar was held
      fixed with no silent re-fit, checked three ways.
    - >-
      O-6 (ESTABLISHED, and it is the reason the over-prediction stays
      unattributed). The reading-free bound is nearly vacuous: the Gaussian
      floor sits only 0.511 and 0.623 bits below the measurement. Under the
      log-normal reading, absorbing the whole over-prediction needs
      s = 4.480840 / 4.394843, i.e. sd(log2 k) of 6.46 / 6.34 bits. Under the
      only textually motivated reading at the only archived alpha, the effect is
      0.31 percent and 0.27 percent of the over-predictions. Phi_dlsc and alpha
      are UNAVAILABLE in the archive, so the magnitude is a scanned bound and not
      a number.
    - >-
      O-7 (SOURCE DEFECT, validator D7, material). Approximation (4.18) DEFINES
      D with the d_lsc integral INSIDE, which the package never mentions. The
      source is therefore internally inconsistent on the exact point Check B is
      about, and that changes the question: the collapse may be a defect of the
      SOURCE rather than of the BATCH-009 implementation. Unresolved here.
    - >-
      O-8 (PROVENANCE DEFECTS, validator D1/D2). results.json carries no commit
      sha, dirty-tree state, command, inference block, seed or determinism
      statement, memory, stderr, validity status or run id. DEV-1 explains the
      absent runs/ DIRECTORY, not the absent fields inside the JSON the handoff
      did declare; memory, stderr and validity appear nowhere. DEV-3's "executed
      exactly once" is not verifiable from the archive: timestamps are
      consistent, which is not verification. The substantive risk is retired by
      the validator's independent re-derivation rather than by the record.
    - >-
      O-9 (SMALLER DEFECTS). D3: log2 K linearity is confirmed numerically
      (slopes -1.72910 / -1.63376) but the inference drawn from it is a non
      sequitur, since K ~ v_eff^{-p} forces linearity regardless; non-absorption
      follows instead from K being profiled at every p plus O-2. D6: report.md
      states P(d_lsc<0) = 7.2e-13 while its own results.json says 6.973e-13,
      which the validator independently obtained. D8: the n=50 count>=10 argmin
      does not reproduce as a located point (21.75 against a 22.00 tie at 7e-6);
      direction unaffected.

  reproduction_tally: {reproduced: 37, not_reproduced: 2, unable_to_check: 4}

  inference: >-
    Over the two archived files, inside the resolved band, under a normalisation
    fitted per exponent, Approximation 4.9's own exponent is not the one that
    best fits the authors' own measurement, and the displacement is real rather
    than an estimator artifact. But the same control that establishes this also
    shows no member of the family fits well, so the correct description is a
    misspecified family whose least-bad member sits lower, not a corrected
    exponent. Separately, the BATCH-009 headline over-prediction remains
    UNATTRIBUTED: the min(1,.) collapse biases in its direction but is bounded
    only by a nearly vacuous inequality, and the textually motivated reading
    accounts for well under one percent of it.

  boundaries:
    - >-
      The two archived files only (q=241, m=40, n=43 and n=50), resolved band
      only (scores 0..1802 for n=43, floor 2^-35.70445229), raw undivided score
      scale, normalisation fitted per exponent.
    - >-
      Toy dimensions against Kyber's beta of roughly 384-816. Establishes
      NOTHING about ML-KEM security in either direction, and must never be cited
      as bearing on it.
    - >-
      Not a claim about Carrier et al.'s Kyber cost figures, their headline
      shortfalls, or Table 5.1, none of which this record examines.
    - >-
      O-4 is a genuine counter-instance in the tail region and is not explained
      away here.
    - >-
      Single execution with one independent validation. No red-team pass. No
      replication.

