    red_team_pass: >-
      NOT A PASS/FAIL VERDICT BY DESIGN. Branch A (cost model and heuristics) and
      Branch B (the pre-screen) were BOTH run. FIVE MAJOR findings
      (RT-1, RT-2, RT-3, RT-8, RT-9), five MODERATE (RT-4, RT-5, RT-6, RT-7,
      RT-10, RT-11 — RT-11 moderate), one MINOR (RT-12) and one MAJOR structural
