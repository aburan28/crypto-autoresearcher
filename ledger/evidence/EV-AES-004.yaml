      step, independently re-derived; the negative outcome meets the
      inventor-protocol section 4 closure standard; and the self-reported
      falsification of PRED-11 propagated into nothing.
    validator_check_b_od3_and_hole_ii: >-
      passed, with 0 HIGH, 0 MEDIUM and 2 LOW (D-809-6, D-809-7) defects. Every
      number the validator could re-execute reproduced EXACTLY on its own
