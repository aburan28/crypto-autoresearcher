      passed, with 0 HIGH, 2 MEDIUM (U-809-1, D-809-4) and 4 LOW (D-809-1,
      D-809-2, D-809-3, D-809-5) defects. Proposition 806-1 FOLLOWS on the
      validator's own re-derivation and exhaustive recomputation; the pre-screen
