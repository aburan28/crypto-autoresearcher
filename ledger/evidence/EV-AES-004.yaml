    combined: not_issued_by_design
    what_passed_means: >-
      ADMISSIBLE EVIDENCE, AND NOTHING MORE. It does not support any claim about
      AES at any round count, does not demonstrate a speedup, does not establish
      a barrier, does not satisfy any promotion gate, and does not authorise any
      promotion. A validator CONCUR plus a red-team CONCUR under one resolved
