    coverage_is_disjoint_not_doubled: >-
      LOAD-BEARING AND RECORDED SO THAT "TWO REVIEWERS LOOKED" IS NOT OVERREAD.
      The two reviews cover largely DISJOINT ground, so in several places the
      count of independent checks is ONE, not two, and in one place it is ZERO.
      The red team re-executed NONE of TASK-20260801-807's measurements
      (its NR-4: the {1,16} dichotomy, the count 57, the P_b7 double
      disagreement and the null_1/2/3 isolation claim are ALL UNCHECKED BY IT)
      and did NOT attack Proposition 806-1's proof (its NR-6: "the per-word bound
