  headline_non_result: >-
    THIS BATCH PRODUCED NO CRYPTANALYTIC RESULT AND NO CLAIM ABOUT AES OF ANY
    KIND, AT ANY ROUND COUNT. No distinguisher, no key recovery, no speedup, no
    measured structural excess, and no barrier statement about AES is asserted
    here. Zero cryptanalytic compute was spent on AES itself, for the fourth
    consecutive batch. What exists is: (A) a DERIVATION — Proposition 806-1,
    B = q^(s - dim(W_S cap K)) hence B >= q = 256 at ONE super-box interface for
    the strictly smaller F-LINEAR round-independent per-word class — which
    FOLLOWS, and which an independent session re-derived lemma by lemma from its
    own arithmetic and reproduced exhaustively in two analogues; together with a
    clean, argued, independently re-derived NO to OD-4 as posed, naming Step 2's
    first sentence as the breaking step, and a trivial-ceiling obstruction
    (B <= |X| = 2^(32-L)) that the red team attacked and COULD NOT WALK PAST;
    (B) an exhaustive GF(2^4) computation of the D-705-5 hole (ii) quantifier
    sweep, reproduced exactly by an independent from-scratch implementation and
    additionally derived analytically two ways, which NARROWS AND RELOCATES the
    hole and produces a MECHANISM CORRECTION to a committed BATCH-003 record;
    an OD-3 screen returning NO_ADMISSIBLE_MEMBER, conditional on unverifiable
    recollections; and (C) the campaign's FIRST RED-TEAM PASS, which returned
    FIVE MAJOR findings against the package's only cost model and its two frozen
    pre-screens, INCLUDING A GF(2^8) COUNTER-WITNESS BELOW THE COST TABLE'S
    CENTRAL COLUMN, a demonstrated ceiling violation, and a SECOND, DISTINCT
    unnumbered conditional dependence. NO GATE PACKAGE STANDS AND NOTHING IS
    PROMOTED.

  strength_scoping: >-
    `replicated` is scoped STRICTLY to the items below, each of which a session
    that did not author it re-executed and, where applicable, recomputed by its
    own from-scratch implementation taking no code and no constant from the
    producer.
    (A1) Proposition 806-1's four lemmas and its Assembly, worked in isolation by
    the validator and re-derived by its own minimisation: all 16 entries of M
    nonzero; M MDS with 69 minors of all sizes computed and 0 singular;
    dim(W_S cap F^S) = max(0, 2s-4) recomputed over GF(2^8) for ALL 16 subsets S
    (s=0:0, s=1:0, s=2:0, s=3:2, s=4:4); minimum exponent 1 over all admissible
    (S, dim K) with dim K <= 3, hence B >= q = 256; and tightness recomputed at
    L = 8 (K = span(e0)), L = 16 (K = W_S cap F^S, S = {0,1,2}) and L = 24
    (K = span(e0,e1,e2)), all reading B = 256.
    (A2) The GF(2^4) exhaustive minimisation: 78899 proper nonzero subspaces
    (+2 trivial = 78901, exactly the producer's count), B histogram
    {16: 4377, 256: 70303, 4096: 4219}, min B = 16 = q, per-dimension minima
    16 / 16 / 16 — reproducing the producer's table EXACTLY.
    (A3) The GF(2^2) exhaustive minimisation: 527 proper nonzero subspaces
    (+2 = 529, exactly the producer's count), min B = 4 = q, and NOT MDS with 24
    of 69 minors vanishing (the producer's 16 vanishing 2x2 plus 8 vanishing 3x3
    sums to exactly 24).
    (A4) The section 6.2 obstruction: for a GF(2)-linear functional depending on
    >= 2 bytes, proj_i(K) = F for every i, the perturbation set is F^4, its
    M-image is F^4, and B = |X| = 2 at L = 31 — verified independently by the
    validator and attacked and NOT BROKEN by the red team, which found the core
    inequality B <= |X| to be an identity of the definition rather than a
    modelling step, so that no choice of object class evades it.
    (B1) The hole (ii) reach computation, re-executed by the validator from its
    OWN GF(2^4) arithmetic, its own circulant, its own ShiftRows incidence map
    and its own enumeration of y, with ZERO discrepancies: 2097152 admissible
    configurations; distinct reach sizes exactly {1, 16} with no intermediate
    value; histogram 1: 262144 / 16: 1835008; 12.5 % / 87.5 %; 65535 of 65536
    patterns Step-1 admissible; and the pre-registered count 57 measured 57. The
    validator additionally DERIVED both headline numbers analytically
    (P(J empty) = 2^-3 = 1/8 giving 2097152/8 = 262144 exactly; 57 = 4*15 - 3 by
    inclusion-exclusion; the {1,16} dichotomy forced because one free y_l already
    sweeps F when M[k][l] != 0), so the agreement is not two programs sharing a
    bug. It further confirmed constants and round key irrelevant to reach sizes
    by re-running the entire pass with seeded nonzero fixed bytes and round key,
    obtaining a byte-identical histogram.
    (B2) The (lambda,k) strong-connectivity structure of all four GF(2^4)
    matrices, recomputed from the validator's own edge rule and Kosaraju: target
    (02,03,01,01) strongly connected, 1 SCC of size 60; null_1 identity 60 SCCs
    of size 1; null_2 (0,1,1,1) 15 SCCs of size 4; null_3 (1,1,1,6) 5 SCCs of
    size 12, all entries nonzero and invertible, with ord(6) = 3 in GF(2^4)*
    verified as the forcing reason.
    (A5) THE CONTROL ATTRIBUTION, STRENGTHENED BY A NULL NOBODY BUILT. The
    validator rebuilt all four producer controls over GF(2^4) and re-ran the
    exhaustive 78899-subspace minimisation on each: target min B = 16 = q;
    CTRL-NULL-1 (2x2 zero block) min B = 1; CTRL-NULL-2 (exactly one zero entry)
    min B = 16 = q, confirming the producer's self-caught defect in the
    INCONVENIENT direction and confirming MDS is NOT load-bearing. It then built
    VALIDATOR-SIB-1 and VALIDATOR-SIB-2, both invertible, both NOT
    block-decomposable, both violating property P alone, and BOTH reading
    min B = 1 over the same exhaustive pass.
    IT DOES NOT ATTACH TO: any claim about AES at any round count; any cost,
    asymptotic, barrier or speedup reading (section 5's table is struck, see
    C-2 through C-4); the RED-TEAM findings RT-1, RT-2, RT-3, RT-4, RT-5, RT-8,
    RT-9, RT-10, RT-11, RT-12 or RT-13, every one of which is a SINGLE-SESSION
    result reproduced by no second party and is recorded at `preliminary` in the
    per-finding notes below; the OD-3 outcome NO_ADMISSIBLE_MEMBER, which is
    CONDITIONAL ON UNVERIFIABLE RECOLLECTIONS (D-809-6) and is not an established
    non-existence result; the relocation of hole (ii) to Step 2's re-application,
    which is a DESCRIPTION OF A MEASURED FAMILY explicitly not claimed as a
    theorem and not exhaustively characterised; the GF(2^8) counterparts of the
    57 and the 12.5/87.5 split, which NOBODY computed; the joint branching J at
    the six GF(2^8) witnesses, which the validator did NOT recompute; the
    GF(2^8) (lambda,k) diameter of 30, which NOBODY re-measured this batch; or
    the closure status of PROP-701-I, which remains WITHHELD.
    CROSS-MODEL INDEPENDENCE IS UNAVAILABLE THROUGHOUT: both producers, the
    validator, the red team and this Coordinator resolve to the same model under
    inference-amendment 0137a051. Every agreement recorded here is CORRELATED
    confirmation, and the mechanical re-executions above are load-bearing
    precisely because they are mechanical rather than judgemental.

  # =====================================================================
