  boundaries:
    - >-
      NO cryptanalytic result and NO claim about AES of any kind, at any round
      count, is asserted by this record. No distinguisher, no key recovery, no
      speedup, no structural excess, and no barrier statement about AES. Zero
      cryptanalytic compute was spent on AES itself.
    - >-
      Nothing here concerns full-round AES (10/12/14 rounds), AES-NI-deployed AES,
      or the security of any system that uses AES. Claim tier is toy /
      reduced-round, as ceilinged by RQ-AES-001 and GOAL-AES-001.
    - >-
      PROPOSITION 806-1 IS SCOPED TO: F-LINEAR pi only (OD-4's class is arbitrary
      pi, and R806-1 forbids quoting it as an OD-4 bound); ONE super-box interface
      Phi = ARK.MC.SR only (R806-2: every multi-interface number is a cost model,
      not a derivation); round-independent pi at all four word positions; kernels
      with 0 < dim K < 4; and the unrestricted "for every state s" quantifier,
      which is an UNNUMBERED DEPENDENCE (U-809-1) and under whose restriction the
      bound DOES NOT FOLLOW. It is INDEPENDENT OF L and is therefore NOT a cost
      inequality. Its property attribution is P ("no proper nonempty S has W_S
      contained in F^S"), not "M has no zero block" (D-809-5).
    - >-
      SECTION 5's n-INTERFACE COST TABLE IS NOT USABLE AND IS NOT EVIDENCE OF
      ANYTHING. Its central column is beaten by an exhibitable kernel (RT-1),
      every n >= 2 entry exceeds the object's own ceiling (RT-2), the composition
      class is unstated and on one horn voids the per-step factor entirely (RT-3),
      round-key knowledge is uncharged (RT-4), intermediate-profile reachability is
      unasserted (RT-5), two of its four heuristics are open and blocking, and its
      memory figures are modelled rather than measured. No barrier reading, in
      either direction, is supported by it at any strength.
    - >-
      GF(2^4) and GF(2^2) ARE ANALOGUES. Their readings are NOT evidence about
      GF(2^8) and are certainly not evidence about AES. The GF(2^2) analogue is
      additionally NOT MDS and is a weaker analogue than GF(2^4). The GF(2^8)
      counterparts of the 57 and the 12.5/87.5 split were NOT COMPUTED BY ANYONE
      and are not asserted as measured. The one load-bearing transfer (the GF(2^4)
      exhaustive joint minimum q^3 to GF(2^8)) is numbered as HEUR-806-1 rather
      than asserted.
    - >-
      RT-1, RT-2 and RT-3 are SINGLE-SESSION results reproduced by no second party.
      RT-1 is a WITNESS, not a minimum, and a kernel with J < 2^24 is UNRESOLVED.
      RT-2 is a DIMENSION COUNT, not an experiment; the direct composition that
      would settle it was not run at any scale. RT-3 and RT-4 are OMISSIONS, not
      demonstrated falsehoods. RT-5 is UNRESOLVED. The Coordinator's corroboration
