  inference: >-
    At toy scale on four prime curves (r = 2^17.7 to 2^24.0), under
    group-operation accounting with inserts/lookups and canonicalisations
    counted but not charged, bsgs.negation performs 0.825 [0.725, 0.945] of
    rho.negation's operations while storing 15.8 [13.4, 19.1] times its
    table. That is the textbook time-memory trade, recorded as a trade: a
    new Pareto point on the prime-toy frontier, not a dominating one, with
    no exponent moved. The sealed bound ECBND1he0aea8671f10 (1.160 [1.068,
    1.248] x floor, 0.502 sqrt r entries) is adopted by this ledger as a
    measured known-results row at toy tier.
  boundaries:
    - Toy tier only; fields of 18-24 bits; r <= 2^24. Nothing is asserted at medium or cryptographic sizes.
    - One epoch (epoch 1), one session, one host class; strength preliminary.
    - Four sizes, 96 pairs per axis; per-curve intervals all include 1 (OBS-3).
    - Unit is ecbench.gae; the bound is blind to field-operation cost by design; no primitive-level claim.
    - Isolation L0 on all measured runs; no wall-clock figure is a bound here.
    - bounded: true -- inserts, lookups and canonicalisations are counted, not priced; the uncharged axis is reported, not deciding.
    - A trade asserts nothing about which method is "better"; it records that the two methods are incomparable on the two deciding axes.
    - No index-calculus, no speedup over the generic floor, no exponent claim.
