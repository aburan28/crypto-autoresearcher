  observations:
    - id: O-1
      statement: >-
        THE MEASUREMENT IS INFEASIBLE AT HQC'S OWN PARAMETERS, for a structural
        reason rather than a budget one: T_req is approximately 1/DFR, so
        estimating the joint moment at the orders that matter needs
        3.401e41 / 6.80e59 / 8.387e79 trials at NIST-1/3/5. You cannot sample
        your way to a 2^-256 event.
      support: >-
        TASK-20260803-c470c0 feasibility analysis; INDEPENDENTLY REPRODUCED by
        TASK-20260802-addcdd (which re-derived all 13 T_req cells, every p* from
        Props 6.1.1-6.1.2, the variance closed form, 7 SEs and all stage costs)
        and again by TASK-20260802-e5ebe9.
      strength_of_this_observation: reproduced_by_two_independent_sessions
    - id: O-2
      statement: >-
        THE MEASUREMENT IS FEASIBLE AT REDUCED PARAMETERS AT THE EXACT MOMENT
        ORDER. Setting the Reed-Muller duplication multiplicity to dup = 1 and
        changing nothing else, PS-R1 reaches k = m = 16 with T_req = 2.915e7
        against a budget of 1e8 (margin 3.43x); PS-R3 reaches k up to 22 and
        PS-R5 up to 32. Total modeled cost 5.58e4 core-seconds.
      support: TASK-20260803-c470c0; reproduced by TASK-20260802-addcdd
      why_this_matters: >-
        It is the first time in this campaign that a route to an actual
        measurement at HQC's own moment order has been shown to exist at all.
    - id: O-3
      statement: >-
        AN EXACT CORRECTNESS ORACLE EXISTS AND IS VERIFIED. The i.i.d. null's
        enumerated joint moment equals p_i^m in EXACT RATIONAL EQUALITY, per
        subset and on average, for k = 1..5 across three structurally different
        null constructions. 9 of 9 mutants are detected, including a
        with-replacement indexing mutant that returns x2.898 on a PERFECTLY
        INDEPENDENT ensemble and x9.561 on a NEGATIVELY DEPENDENT one - i.e. it
        reads as "positive dependence" in exactly the cases where there is none.
      support: >-
        TASK-20260803-6f50df. INDEPENDENTLY RE-DERIVED by TASK-20260802-addcdd
        from its OWN 2^20 brute force rather than the producer's code, matching
        as exact rationals; it also rebuilt the ring law from scratch by integer
        WHT XOR-convolution and reproduced Lemma R bit-identically. Re-running
        the suite gave 43 passed / 0 failed and a full leaf diff of 23
        differences, EVERY ONE a wall-clock timing and ZERO mathematical values.
      why_this_matters: >-
        A high-order-moment estimator's bugs fail in the direction that looks
        like signal. Without this instrument a positive result would have been
        uninterpretable; with it, the specific failure mode is detectable.
    - id: O-4
      statement: >-
        THE INHERITED CHARACTERIZATION'S LEMMA L1 IS DEFECTIVE. It claims the
        block failure indicators are exchangeable; its cyclic-shift argument
        yields only equal marginals plus translation invariance, because
        shifting by n_2 maps block n_e-1 outside the retained window. The design
        works around it by estimating the AVERAGE joint moment, whose
        unbiasedness follows from linearity alone.
      support: >-
        TASK-20260803-c470c0; the sibling oracle's Lemma R points the same way
        (cyclic-orbit constancy, not subset-exchangeability); TASK-20260802-addcdd
        verified the workaround holds, confirming E[C(S,k)] = C(n_e,k)*mubar_k by
        linearity and that Jordan inversion needs no distributional assumption.
      independence_caveat: >-
        NOT TWO INDEPENDENT DISCOVERIES. Both producers read the same
        characterization document. TASK-20260802-e5ebe9 judged the Coordinator's
        hedge CORRECT ON INDEPENDENCE BUT UNDER-REPORTING THE CONTENT: a proof
        gap and a computed counterexample are different contributions. Recorded
        at that calibration, neither inflated nor deflated.

  defects_found_in_this_batch:
    - id: D-1
      severity: high
      found_by: TASK-20260802-addcdd (DEF-1)
      statement: >-
        THE PRIMARY NULL OBJECT'S CONSTRUCTION DOES NOT IMPLY THE PROPERTY IT
        CLAIMS. CTRL-BS requires offsets o_j "pairwise distinct and coprime to
        T", and concludes every pair of blocks therefore comes from distinct
        independent true trials. The condition needed is on the SHIFTS j*o_j.
        Counterexample inside the stated condition: o_1 = 3 and o_3 = 1 are
        distinct and both coprime to T, yet 1*3 = 3*1, so blocks 1 and 3 of
        EVERY pseudo-trial share a source trial and retain the full space-(T)
        dependence. Also 0*o_0 = 0 always, so block 0's offset is inert. The
        coprimality clause does no work at all: t -> t + s is a bijection of Z_T
        for every s, and coprimality is the condition for a MULTIPLICATIVE map,
        so it appears transplanted from a different construction.
      why_this_is_the_worst_one: >-
        The null object is the control this entire batch was built around. The
        failure is fail-safe in DIRECTION but not in COST: INV-NULL would fire,
        and the space-(T) measurement would be invalidated and MISDIAGNOSED as
        an estimator artifact.
      cheapest_fix: >-
        Require the shifts to be pairwise distinct and assert it at run start.
    - id: D-2
      severity: high
      found_by: TASK-20260802-e5ebe9 (O1)
      statement: >-
        THE "TWO-RUNGED LADDER" IS SCOPED, AND THE COORDINATOR REPORTED IT
        UNSCOPED. The producer's result holds with p*, n_e and m FIXED - its own
        text says "change nothing else". Relaxing that, a dup = 2 rung exists at
        n = 11779, omega = 62, omega_r = 70, p* = 0.388705, m = 16, n_e = 46,
        costing 2.0e4 core-seconds with T_req = 8.16e7 and m/lambda = 1.586.
      consequence: >-
        NOT COSMETIC. That rung supplies the only matched test HEUR-HQC-6 will
        ever get, so the unscoped claim foreclosed an experiment the campaign
        should run.
    - id: D-3
      severity: high
      found_by: TASK-20260802-e5ebe9 (O3)
      statement: >-
        THE WASH-OUT HOLE IS NAMED BUT NOT CLOSED. The design correctly warns
        that a reduction pushing p* toward 1/2 destroys the dependence and would
        yield a null that FALSELY CONFIRMS A17. Its guards do not close it:
        gamma-hat is a property of e-tilde alone and is INVARIANT UNDER dup, so
        that gate passes regardless; the uninformative_null trigger cannot fire;
        CTRL-WBP is inoperative under a null; and the only destroy-parameter
        ladder is optional and first to be cut under budget pressure.
    - id: D-4
      severity: high
      found_by: TASK-20260802-e5ebe9 (O2)
      statement: >-
        EXCHANGEABILITY, correctly removed from the estimand, RE-ENTERS in
        HEUR-HQC-2's closure and in the Cov(W_1,W_2) label. F2a/F2b can fire
        from covariance heterogeneity alone, producing a spurious ST-6 shutdown
        - and the sibling oracle DEMONSTRATES that heterogeneity is real.
    - id: D-5
      severity: medium-high
      found_by: TASK-20260802-e5ebe9 (O4)
      statement: >-
        HEUR-HQC-4's formal statement INVERTS its own destroy-parameter
        direction: Corr = -tau/(n_e-1) is INCREASING in tau. It contradicts its
        own falsification condition F4 and the frozen contract, and can trigger
        the wrong branch and an ST-6 shutdown.
    - id: D-6
      severity: medium
      found_by: TASK-20260802-addcdd (DEF-3) and TASK-20260802-e5ebe9
      statement: >-
        calib_m0.py and calib_m0b.py - THE SOURCE OF EVERY MACHINE CONSTANT IN
        THE COST MODEL - exist nowhere in the repository and are not listed in
        required_artifacts. The Coordinator independently confirmed their
        absence. Every cost figure in O-1 and O-2 therefore rests on constants
        that cannot currently be reproduced.
    - id: D-7
      severity: medium
      found_by: TASK-20260802-e5ebe9 (O5)
      statement: >-
        PS-R1's "3.43x margin" is a 13% margin in the underlying q-hat, with a
        3.1x step discontinuity at q-hat around 0.220. The headline multiplier
        overstates the real robustness.
    - id: D-8
      severity: medium
      found_by: TASK-20260802-addcdd (DEF-2) and TASK-20260802-e5ebe9 (O8)
      statement: >-
        "E[A-hat_k] = 1 EXACTLY" is false for a ratio estimator - exact only for
        the numerator. Measured residual -3.6e-4 bits against a 0.0321-bit SE,
        so immaterial in magnitude, but it contradicts the contract's own
        ratio-bias correction. CTRL-BS's offset condition is also stated on o_j
        rather than j*o_j, the same slip as D-1.

  coordinator_claims_retracted_this_batch:
