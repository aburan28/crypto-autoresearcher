      The oracle artifact disclosed this; the Coordinator's receipt did not.
      Confirmed by the Coordinator against both files.
    - >-
      The "corroboration from two directions, NOT two independent discoveries"
      hedge - CORRECT ON INDEPENDENCE, UNDER-REPORTING THE CONTENT. See O-4.

  claims_the_reviews_tested_and_withdrew:
    - >-
      TASK-20260802-e5ebe9 withdrew its own objection W1 - that null-based
      sizing is optimistic under the modeled alternative - after its own Jordan
      inversion reconstruction refuted it: T_stab 1.59e7 under the alternative
      against 2.92e7 under the null, V 4.72e4 against 4.94e4. NULL SIZING IS
      CONSERVATIVE. Recorded because a tested-and-withdrawn objection is
      evidence, not an absence of one.
    - >-
      Found nothing, after looking: oracle/protocol object identity (exact
      match), space-(T) sampler integrity, null-object matching, premature
      closure, claim tier, flag-without-resolution in the producers, and the
      arithmetic - which TASK-20260802-e5ebe9 attacked hardest and failed to
      break across 13 T_req cells, 7 SEs, 5 decoder-model points and the 3.21e20
      figure.

  the_decisive_question_and_its_answer:
    question: >-
      Is the rarity gap - m/lambda in [0.70,1.51] against HQC-1's 1264 -
      EV-HQC-6fd5b1 O-6's obstruction genuinely relocated, or the same
      obstruction renamed? If renamed, the design cannot answer the question and
      BATCH-004 should not spend compute.
    answer: >-
      RELOCATED, NOT RENAMED, per TASK-20260802-e5ebe9. O-6 is a
      NON-IDENTIFIABILITY statement within one law; at PS-R1/R3/R5 the joint
      moment is measured DIRECTLY at k = m, so O-6 is dead there. What remains
      is an EXTRAPOLATION obstruction across a family, which - unlike O-6 -
      admits in-range tests. BATCH-004 SHOULD RUN, once the amendments are made.
    two_corrections_to_the_producer: >-
      "0.33 decades" UNDERSTATES the design, since F3's lambda-lever spans 3.3
      decades at low k. And HEUR-HQC-3's stated reason OVERSTATES it: the rare
      many-blocks-fail mode is ABSENT at m/lambda about 1, not merely
      "invisible" - a STRONGER limitation than the producer claimed.

  what_this_evidence_does_not_establish:
    - NOTHING about whether A17 holds, in either direction.
    - NOTHING about HQC's security. No measurement was made.
    - >-
      NOT that the design is sound. Both reviews declined to admit it, and no
      contract was frozen.
    - >-
      NOT that the cost figures are reproducible: the calibration scripts behind
      every machine constant are missing (D-6).

  review_independence_limitation: >-
    Both reviews were INDEPENDENT SESSIONS but NOT INDEPENDENT MODELS. The
    validator states it plainly: review-adversarial does not resolve under this
