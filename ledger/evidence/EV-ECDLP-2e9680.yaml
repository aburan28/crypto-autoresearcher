  crossing_bracket:
    production_reading: >-
      Monotone G3-FEASIBLE, G3-FEASIBLE, G3-INFEASIBLE, G3-INFEASIBLE across
      (1/16, 1/8, 3/16, 1/4); production alone reports the crossing at
      (1/8, 3/16).
    literal_sealed_comparison: >-
