      `success_criterion`'s own escape clause ("if no clean crossing is
      confirmed ... that is reported plainly as 'crossing not confirmed at
      this N'"): the a = 1/8 disagreement sits exactly at the boundary of
      production's reported bracket, so the bracket is not independently
      corroborated by Stage A's sealed reading taken as sealed.
    after_root_cause_correction: >-
      A controlled, post-seal (non-blind, diagnostic-only) recomputation --
      same random function, same exact basins, same ground truth as the
      sealed artifact, ONLY the STATIC(T)_r selection rule changed from
      true-exact-basin-size to production's actual weight formula -- DOES
      corroborate production's (1/8, 3/16) bracket once the selection-weight
      gap is accounted for (see `a_1_8_disagreement` below). This corrected
      reading is explicitly NOT a second seal and is reported as supporting
      diagnostic evidence, never as a replacement Stage A result or as a
      confirmation under this contract's own `success_criterion`.
    this_record_reports: >-
      "Crossing not confirmed at N = 2^24" at the literal, frozen,
      sealed-vs-production level, per the contract's own wording; the
      diagnosed root cause and its corroborating post-seal reading are
      reported alongside as exactly that -- a diagnosis, not a confirmation
      -- pending a re-sealed independent re-derivation under a corrected
      definition (see DEC-20260907-9b1b02 `next_actions`).

  a_1_8_disagreement:
    root_cause: >-
      specification.yaml's own `definitions.STATIC(T)_r exact coverage` text
      names "the published Bernstein-Lange weight" used to select the T
      table entries from the r*T-distinct-DP pool but never states the
      formula. This is an UNDERSPECIFICATION IN THE FROZEN CONTRACT TEXT
      ITSELF, not a bug in either implementation: HEUR-BLT-1's plain
      statistical model (a uniformly random function plus independent
      Bernoulli marking), which is all `blind_rederivation.quantity` gives a
      from-scratch reader, does not determine this formula. Absent it,
      Stage A's sealed computation selected the pool's T entries by TRUE
      EXACT BASIN SIZE (an oracle-optimal selection given the sampled pool
      -- the most natural reading of "weight" without the specific
      literature estimator); production's Stage B (reusing
      experiments/EXP-ECDLP-612fb1/source_v2/instrument.py unchanged)
      actually selects by weight_d = S_d + 4*W*h_d (S_d the summed
      generating-walk length reaching DP d, h_d its hit count) -- a
      realistic estimator a real precomputer would have to use, not an
      oracle. STATIC(T)_r's TRUE exact coverage is then read off whichever
      set that selection rule chose.
    controlled_diagnostic: >-
      A shared pool of (start, terminal-DP, walk-length) triples per (a,
      seed), fixing an earlier diagnostic pass's confound of comparing
      across different pool draws and fixing the RNG-offset
      non-reproducibility defect noted above with a deterministic offset,
      with BOTH selection rules (true-size vs S_d+4*W*h_d) applied to the
      IDENTICAL pool (postseal_diagnostic_v2_clean.py, run strictly after
      the seal and after reading instrument.py).
    controlled_diagnostic_results:
      "a=1/16": {pass_by_size: 5, pass_by_weight: 5}
      "a=1/8": {pass_by_size: 1, pass_by_weight: 5}
      "a=3/16": {pass_by_size: 0, pass_by_weight: 2}
      "a=1/4": {pass_by_size: 0, pass_by_weight: 0}
    interpretation: >-
      Switching the selection rule from oracle true-size to production's
      actual weight, on the SAME underlying pool, systematically RAISES the
      margin at every (a, seed) tested (the oracle selection weakly
      dominates a realistic estimator's selection). At a = 1/8 this flips
      the pass-count from 1/5 to 5/5, exactly matching production. At
      a = 3/16 it moves 0/5 to 2/5 -- still solidly INFEASIBLE by the >= 4/5
      threshold, consistent with production's own near-boundary readings
      there. At a = 1/16 and a = 1/4 the verdict is unchanged under either
      rule (robust to this variable). This is a DEMONSTRATED, CHECKABLE
      units/definition mismatch, not a genuine N-dependent reversal and not
      a computational bug in either party's pipeline.
    disposition: >-
      Reported per specification.yaml `distinguishable_outcomes` (b) /
      `falsification_criterion` F3's own escape valve ("or the disagreement
      traces to a demonstrable units/definition mismatch"). Per the
      validator's own explicit statement, it does NOT unilaterally relabel
      a = 1/8 from S3 to S1 -- "that is the Coordinator's call." THIS RECORD
      DOES NOT MAKE THAT CALL EITHER: a = 1/8 is reported here as S3
      DISAGREEMENT WITH A DIAGNOSED, DEMONSTRATED, NON-COMPUTATIONAL ROOT
      CAUSE, never as CONFIRMED FEASIBLE or CONFIRMED INFEASIBLE. Accepting
      the post-seal (non-blind) diagnostic as sufficient to relabel the cell
      would require treating a non-blind, single-pass diagnostic as
      equivalent to this contract's own required sealed procedure, which
      this record declines to do (see DEC-20260907-9b1b02 for the explicit
      accept/decline reasoning and the versioned protocol_amendment this
      record's `unresolved_confounds` and the decision's `next_actions`
      route this to instead).

