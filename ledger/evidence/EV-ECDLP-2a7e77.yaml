  scope_statement: >-
    EXP-SYC-12de89's frozen zero-run static successor to EXP-SYC-a59d02
    received independent Validator (TASK-20260811-b34084) and Red Team
    (TASK-20260811-c0a729) REVISE verdicts. Both reviewers independently
    recomputed the producer's claimed numbers from the committed bytes rather
    than re-reading the producer's stated equalities, and both confirm that
    of the four blocking findings DEC-20260809-e35473 required this successor
    to close (RT-OBJ1, RT-OBJ2, VAL-EA56C5-ARCHIVE-COMMUNICATION-BYTES-
    UNCHARGED, VAL-EA56C5-OUTPUT-MANIFEST-UNDISCLOSED-SWAP), exactly one --
    RT-OBJ2, the asymmetric shard-parallelism finding -- is genuinely and
    fully closed with independently verified zero side effect on any other
    figure in the document. The other three are honestly, precisely, and
    non-fabricated PARTIALLY closed: the producer's own
    design-repair-report.yaml self-labels them PARTIALLY_CLOSED, not
    FULLY_CLOSED, and both fresh reviews independently confirm that
    self-characterization is accurate, not an understatement or an overclaim.
    Per this batch's own dispatch constraint and the identical precedent
    DEC-20260809-e35473 itself set ("Any REVISE or REJECT blocks
    implementation"), dual REVISE blocks implementation regardless of how the
    individual findings compare. This evidence supports withholding
    implementation and execution while preserving the genuine narrowing (four
    blocking findings down to three disclosed residuals, one of the three
    remaining findings now resting on a bound plus an overflow-invalidation
    rule rather than no bound at all) and the exact remaining blocking
    obligations, including one newly identified defect (Red Team OBJ1: the
    DERIV-1 heuristic margin is internally inconsistent with H-SYC-b854f4's
    own already-adopted HA-2 heuristic by two to three orders of magnitude at
    the hypothesis's own decision-relevant parameter range). It bears only on
    EXP-SYC-12de89's static design; it neither supports nor weakens
    H-SYC-b854f4 or prime-field ECDLP, and it makes no ECDLP, security,
    asymptotic, or performance claim.
  observations:
    - >-
      Zero experiments ran under EXP-SYC-12de89 (experiment_runs: 0 in both
      review reports). execution_authorized, implementation_authorized, and
      official_status_change_authorized are all false in both reports and in
      this evidence record.
    - >-
      Validator TASK-20260811-b34084 independently re-derived every literal
      the producer claims to have computed for all four findings (Python
      exact-integer and exact-rational arithmetic, sha256 recomputation,
      strict duplicate-key-rejecting YAML parsing, full line-level diffs
      against the hash-verified predecessor and deep predecessor) and
      confirms: RT-OBJ2 is CONFIRMED_FULLY_CLOSED with zero side effects;
      RT-OBJ1's derivation and overflow-invalidation rule are
      PARTIALLY_CLOSED_CONFIRMED, but the DERIV-1 by_size table's
      expected_occupancy literal at bits=27 (claimed 0.0000304654240608)
      fails independent recomputation against the document's own formula
      (correct value 0.0000304579734802) -- an isolated, non-consequential
      arithmetic slip in one literal (the row's own margin_vs_32 field is
      consistent with the correct value, not the erroneous one); the two
      Validator-origin findings (archive/communication bytes, output
      manifest) are PARTIALLY_CLOSED_CONFIRMED -- disclosure genuinely
      complete, capacity-fit genuinely not achieved, with every over-cap
      figure independently reproducing exactly (archive over by 3256009664
      bytes, communication over by 3285369792 bytes, output over by 7132160
      bytes, versus their unchanged inherited hard caps). Validator also
      found one minor, non-consequential informational discrepancy: a
      "37-syscall" citation in sandbox-policy.json's supporting prose versus
      an independently parsed 40-entry actual syscall allowlist, inherited
      uncorroborated from the predecessor Validator's own report and not
      affecting any sum_check total.
    - >-
      Red Team TASK-20260811-c0a729 independently reproduced the predecessor
      Red Team's own RT-OBJ1 counterexample against the new snapshot (exact
      match at all five ladder sizes), independently confirmed RT-OBJ2's
      symmetric, zero-side-effect shard-equalization, and independently
      confirmed all archive/communication/output over-cap arithmetic exactly.
      It then raised one NEW blocking objection (OBJ1): DERIV-1's disclosed
      ~16,644x-4,198,404x expected-case margin is internally inconsistent
      with H-SYC-b854f4's own already-adopted, numbered heuristic HA-2
      (E[X]=N^(-1/3+gamma_x+o(1))) for the identical quantity -- recomputed
      directly from HA-2, the margin at the null point (gamma_x=0) is
      smaller than DERIV-1 reports by a factor of L(bits)/8, at the
      hypothesis's own decision-changing threshold (gamma_x>5/18) the margin
      is only 64x-101.6x (two to three orders of magnitude smaller than
      disclosed), and at the hypothesis's own theoretical ceiling
      (gamma_x<=1/3) the margin is a constant, non-growing 32.0x at every
      tested size -- none of which was computed or disclosed by the
      producer. One moderate objection (OBJ2): the 5-to-8-way shard
      widening's claim of "provably zero effect on every ... figure" omits
      peak_live_bytes, the one non-additive comparison axis the repair's own
      blanket language does not actually check; a plausible ~8/5x increase
      in BSGS's concurrently-live baby-table memory is not derived or
      disclosed. One advisory objection (OBJ3): the task card's explicit
      instruction to note RT-OBJ3/RT-OBJ4 as deferred, not dropped, was not
      fulfilled in any of the five producer artifacts (zero matches on a
      text search).
    - >-
      Neither reviewer found fabrication, a hidden defect, or an understated
      residual anywhere in the producer's five artifacts; both independently
      characterize the three PARTIALLY_CLOSED findings' residuals as
      honestly and precisely quantified. The Red Team's OBJ1 is a NEW defect
      relative to the predecessor's RT-OBJ1 (which challenged the ABSENCE of
      any bound; this successor supplies a bound and an overflow rule, but
      the expected-case confidence figure attached to that bound is
      miscalibrated against the hypothesis's own model).
    - >-
      Per AGENTS.md, the archive/communication/output capacity-fit
      shortfall is an infrastructure/budget-adequacy finding about caps
      inherited unchanged across two successor generations from a
      one-mount-state predecessor design, never resized for this design's
      genuinely three-mount-state, custody-complete scope -- not a
      mathematical result about H-SYC-b854f4, and is never treated as
      negative evidence for or against the hypothesis.
  inference: >-
    Preserve EXP-SYC-12de89 at review_required with implementation and
    execution unauthorized. A further versioned static successor must: (a)
    recompute the candidate_index margin using H-SYC-b854f4's own HA-2
    heuristic directly (not DERIV-1's uncalibrated generic substitute) and
    either show adequacy still holds or raise the cap (closes Red Team OBJ1);
    (b) add a peak_live_bytes accounting for the widened 8-way BSGS baseline
    (closes Red Team OBJ2); (c) fix the bits=27 DERIV-1 literal (closes the
    Validator's isolated arithmetic defect); (d) explicitly and visibly note
    RT-OBJ3/RT-OBJ4 as deferred, not dropped (closes Red Team OBJ3); and (e)
    either propose a scoped resolution for the archive/communication/output
    capacity-fit residuals or explicitly carry them forward again as
    disclosed residuals -- itself a further static repair task, not
    implementation. Fresh independent Validator and Red Team review of that
    successor is required before any Coordinator decision considers a
    maximum-runs-zero implementation batch. The standing hold from
    DEC-20260809-e35473 (no implementation, execution, run, or ECDLP claim)
    is carried forward unchanged and not weakened.
  boundaries:
    - No experiment, run, measured gamma, recovered scalar, solver, attack, speedup, or cryptographic-scale result exists.
    - H-SYC-b854f4 remains specified with zero evidential standing; evidence_status and support_status are unaffected.
    - The 18-to-30-bit ladder is only a prospective toy finite-ladder design; nothing here transfers to cryptographic scale.
    - This evidence is scoped to the exact reviewed snapshot (commit d0041fe73b90e9e1827c8b13ff144888bc1a4f25) and its five committed artifacts.
    - GOAL-ECDLP-001 and RQ-ECDLP-002 remain active and no ECDLP claim changes.
  unresolved_confounds:
