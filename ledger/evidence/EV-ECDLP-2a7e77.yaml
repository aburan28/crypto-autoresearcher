    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-68ea16/tasks/TASK-20260811-cb5d76/design-repair-report.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-68ea16/archives/TASK-20260811-09dbe7/snapshot-receipt.json
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-68ea16/reviews/TASK-20260811-b34084/review-report.yaml
