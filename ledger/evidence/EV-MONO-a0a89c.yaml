evidence:
  id: EV-MONO-a0a89c
  hypothesis_id: RQ-MONO-001
  hypothesis_id_note: >-
    GOAL-MONO-001 has no hypothesis record and active_hypothesis_ids is empty by
    design. RQ-MONO-001 is named in the hypothesis_id slot following the
    EV-AES-001 and EV-HAWK-001 convention. NO HYPOTHESIS IS CREATED OR MOVED.
  experiment_ids: [EXP-MONO-4b50b6]
  run_ids: [RUN-MONO-4b50b6-001, RUN-MONO-4b50b6-002]
  goal_id: GOAL-MONO-001
  batch_id: BATCH-003
  type: theoretical
  type_note: >-
    theoretical, not empirical, AND THAT IS THE POINT. The load-bearing content is
    an algebraic identity and its consequences; the census confirms them and could
    not have refuted them. Filing this as empirical would misdescribe where the
    weight sits.
  direction: neutral
  direction_note: >-
    neutral with respect to ECDLP hardness. The m=3 relation-supply route is shown
    to have no exceptional-rate content, which is negative for one attack idea and
    positive for no one; and the protocol's own relation-rate model is shown to be
    wrong by a constant factor in the attacker's favour. Neither moves any
    security estimate.
  strength: preliminary
  strength_note: >-
    preliminary DESPITE the mathematics being exact, because (i) both independent
    reviews resolved to the same model as the producer, so AGENTS.md rule 12 is
    unsatisfied for any closure framing, and (ii) the empirical arm is toy-scale
    and, per curve, underpowered. The derivation is stronger than 'preliminary'
    suggests; the REVIEW STANDING is not, and the weaker of the two governs.
  claim_tier: toy
  certificate_refs: []
  proof_status: derivation
  proof_refs:
    - experiments/EXP-MONO-4b50b6/contract.md
    - experiments/EXP-MONO-4b50b6/runs/RUN-MONO-4b50b6-002/verification.json
    - coordination/goals/GOAL-MONO-001/batches/BATCH-003/reviews/TASK-20260802-e2702a/validation_report.md
    - coordination/goals/GOAL-MONO-001/batches/BATCH-003/reviews/TASK-20260802-1b4130/red_team_report.md

  observations:
    - id: OBS-1
      statement: >-
        THE IDENTITY. disc_T S_3(x1,x2,T) = 16*f(x1)*f(x2) holds as a polynomial
        identity in Z[x1,x2,A,B], where f(x) = x^3+Ax+B and S_3 is the third
        Semaev summation polynomial in the normalization the frozen protocol pins.
      basis: >-
        PROVED, three ways, two of them by independent reviewers. RUN-002 V1
        evaluates the difference on the grid [-3,3]^4; the difference has degree at
        most 6 per variable and 7 > 6 points determine it uniquely, so vanishing
        on the grid IS a proof over Z, needing no CAS. 0 counterexamples on 2401
        grid points and on 20000 random points in [-500,500]^4. TASK-20260802-1b4130
        proved it on the same grid independently. TASK-20260802-e2702a proved it in
        sympy from the protocol's own coefficients, AND separately confirmed that
        S_3 vanishes at x(P +/- Q) on real curve points - which discharges
        confounder CF-NORM-S3 universally rather than on the 4-of-105 curves
        CTRL-S3-IDENTITY covers.
      novelty: >-
        NONE CLAIMED. It is an immediate consequence of the chord-and-tangent
        addition law: the two roots of S_3(x1,x2,T) are x(P+Q) and x(P-Q), whose
        difference is -4*y1*y2/(x1-x2)^2. This is elementary and essentially
        classical. It is not recorded anywhere in this corpus, which is the only
        sense in which finding it was work.

    - id: OBS-2
      statement: >-
        THE GROUP-THEORETIC CONSEQUENCE. The geometric monodromy group of the m=3
        Semaev cover is exactly S_2, for EVERY non-singular E and every p > 3,
        with no exceptional locus. Over F_pbar, 16*f(x1)*f(x2) factors as a product
        of six pairwise-distinct irreducibles of k[x1,x2] (distinct because f is
        squarefree, which is exactly non-singularity), hence is squarefree, hence
        is not a square in the UFD or its fraction field; 16 is a unit for p > 2.
        So the quadratic S_3 is irreducible over k(x1,x2) and its Galois group is
        the full S_2. The same argument over F_p(x1,x2) gives arithmetic monodromy
        S_2.
      basis: >-
        SUPPLIED BY TASK-20260802-1b4130 objection O-1 and independently by
        TASK-20260802-e2702a finding V-10. NOT BY THE PRODUCER. RUN-001 proved
        only the weaker density consequence (OBS-3) and let the reader infer the
        group. Recorded with that attribution because the strongest statement in
        this batch came from its reviewers.

    - id: OBS-3
      statement: >-
        THE EXACT DENSITY. With Z = #{x : f(x)=0} and #E(F_p) = p+1-t, over all
        p^2 specializations: N_split = S^2+N^2-(p-Z), N_inert = 2SN,
        N_ramified = p^2-(p-Z)^2-Z, N_degdrop = p, whence
        freq_split - 1/2 = (t^2 - 2pZ + Z^2 - 2p + 2Z)/(2p^2). Since Z is 0, 1 or
        3 and |t| <= 2*sqrt(p), |freq_split - 1/2| < 4/p uniformly - O(1/p), NOT
        the O(1/sqrt p) the protocol's pinned envelope anticipated.
      basis: >-
        Verified on all 105 censused curves with 0 mismatches (RUN-002 V3), and
        established INDEPENDENTLY OF THE CLOSED FORM by exhaustive enumeration of
        all p^2 pairs on 19 curves - 17054059 pairs, 0 disagreements, all four
        strata including ramified (RUN-002 V2). Both reviewers ran their own
        brute-force enumerations and agreed: the Validator at p=23,31,37 covering
        Z in {0,1,3}; the Red Team on 12 curves at the pinned primes.
      measured_bound: >-
        max p*|delta| = 0.9994 on the random panel (Z=0 curves, bound 1/p) and
        3.9941 on the CM and automorphism panels (Z=3 curves, bound 4/p).

    - id: OBS-4
      statement: >-
        THE FACTOR-BASE LOCUS. Conditioned on x1, x2 both being x-coordinates of
        F_p-rational points, the fibre ALWAYS splits: P(split | x1,x2 in FB,
        x1 != x2) = 1, not freq_split ~ 1/2. So the protocol's
        quasirandom_relation_prediction understates the joint relation proxy by
        1/freq_split ~ 2 on the off-diagonal.
      basis: >-
        MEASURED, not assumed. RUN-001 hard-coded this probability as 1 in its
        exact_joint field (found by TASK-20260802-1b4130 O-8c). RUN-002 V4
        classifies every off-diagonal factor-base pair on every curve: 1196 pairs,
        0 non-split. Both reviewers independently ran the same classification and
        got 1196/1196.
      the_empirical_face: >-
        POOLED AND AGAINST A MATCHED NULL ONLY. RUN-002 V8 pools all 2400000 draws
        of the frozen sampled census: the real factor-base window gives
        real/quasirandom 1.5313 at z = +6.34; a shuffled window of identical size
        gives 0.7305; the ratio of ratios is 2.0962 against a predicted
        1/freq_split ~ 2.01. The Validator built its own null independently and got
        the same real arm, 1.531 at z = +6.34.
      mechanism_is_the_group_law_not_monodromy: >-
        If P and Q are rational so are P +/- Q, and the two roots of
        S_3(x1,x2,T) are exactly x(P+Q) and x(P-Q). Nothing about Chebotarev or
        monodromy is involved. TASK-20260802-1b4130 O-8a is upheld: this is a
        MIS-SPECIFICATION OF THE PROTOCOL'S PROXY, not a discovery.

    - id: OBS-5
      statement: >-
        OBS-4 IS NOT m=3-SCOPED. For every m, if x_1..x_{m-1} are x-coordinates of
        rational points then the roots of S_m(x_1..x_{m-1},T) are
        x(eps_1 P_1 + ... + eps_{m-1} P_{m-1}) over sign vectors - 2^{m-2} values
        matching deg_T S_m - and every one lies in F_p. So S_m SPLITS COMPLETELY
        over F_p on the factor-base locus, at every m, unconditionally.
      basis: >-
        SUPPLIED AND VERIFIED BY TASK-20260802-1b4130 objection O-9, which built
        S_4 by the resultant recursion S_4 = Res_X(S_3(x1,x2,X), S_3(x3,T,X)) over
        F_211 on this run's own first random-panel curve and factored 193
        specializations at triples of rational x-coordinates: 193/193 split
        completely, with root set exactly {x(+/-P1 +/-P2 +/-P3)}. The reviewer also
        recorded that its first attempt failed on a coefficient typo and produced
        garbage, which is why the negative intermediate is not hidden here either.
      why_this_is_the_most_consequential_observation: >-
        A generic-fibre Frobenius census samples uniform (x_1..x_{m-1}) in
        F_p^{m-1}. Index-calculus relation search operates entirely on the
        sublocus where the x_i are factor-base elements - a measure-zero set on
        which the cycle type is IDENTICALLY TRIVIAL, at every m. So the instrument
        KN-OPEN-009 proposes measures a quantity that is constant on the locus
        that matters. THIS BEARS DIRECTLY ON WHETHER AN m >= 4 CENSUS IS WORTH
        RUNNING, and it was found by the Red Team, not the producer.

    - id: OBS-6
      statement: >-
        THE CENSUS COULD NOT HAVE FAILED. EXCEPTIONAL_LOCUS_TOY required a sampled
        excursion of 143 sigma at p=211 and 52 sigma at p=1601 - probability of
        order 1e-500 per curve - because by OBS-3 the exact deviation is under 4/p
        while the pinned envelope is 6/sqrt(p). Worst exact|delta|/envelope over
        105 curves is 0.0416.
      basis: TASK-20260802-1b4130 O-2 and TASK-20260802-e2702a V-19, independently.
      consequence: >-
        outcome_id = FULL_MONODROMY_BARRIER_TOY IS NOT THE EVIDENCE. Its content is
        instrument integrity. The evidence is OBS-1 through OBS-5.
      not_a_protocol_design_failure: >-
        The identity was found BY this run. Before it, TASK-20260725-705 had no way
        to know the experiment was one-sided.

    - id: OBS-7
      statement: >-
        INSTRUMENT INTEGRITY, stated as what it is. All 11 declared controls
        report pass; 3150000 specializations classified; two independent classifier
        code paths agreed on 63000 cross-checked samples with 0 disagreements; the
        degree-5 instrument controls flagged a product cover non-full (0 five-cycles,
        0 four-plus-one) and matched Chebotarev(S_5) on random quintics (0.2026 vs
        0.2 +/- 0.05; 0.2451 vs 0.25 +/- 0.06); the CM hard gate is genuinely
        load-bearing, since all 22 CM curves are composite-order and without
        CTRL-CM-ADMISSION the screen would be empty and FULL forbidden (validator).
      but: >-
        TWO OF THE ELEVEN MUST BE READ AS "NOT EVALUATED", NOT "PASSED".
        CTRL-NEG-UNIFORM-WINDOW and CTRL-NEG-SHUFFLED-WINDOW use absolute
        tolerances 56x to 3204x larger than the quantity they bound and pass for an
        EMPTY window at every pinned prime (RUN-002 V5; RT O-7; validator V-14).
      and: >-
        The per-curve sampled census is underpowered for an O(1/p) effect at every
        pinned prime: sigma = 0.00289 exceeds the whole random-panel effect bound
        1/p above p=211, and 16 of 20 curves at p=1601 recorded zero joint hits.

  inference: >-
    At m=3 the Semaev cover's Frobenius cycle type is governed by an elementary
    algebraic identity, not by a monodromy question with two live sides. The
    geometric monodromy is S_2 for every non-singular curve, the split density
    deviates from 1/2 by less than 4/p uniformly, and no exceptional locus exists.
    Separately and more consequentially, the relation-supply half of KN-OPEN-009 is
    answered at EVERY m by the group law: on the factor-base locus the summation
    fibre splits completely, so a generic-fibre census measures a quantity that is
    constant where relation search actually operates.

  boundaries:
    - >-
      TOY PRIMES 211-1601 ONLY (11 bits). NO extrapolation to 256-bit ECDLP, and
      no statement about ECDLP hardness in either direction.
    - >-
      OBS-1, OBS-2, OBS-3 and OBS-6 are m=3 ONLY. They rest on the degree-2
      discriminant factorization, which has no analogue at m >= 4.
    - >-
      THE IMPRIMITIVITY HALF OF KN-OPEN-009 IS VACUOUS AT m=3 FOR DEGREE REASONS,
      NOT ANSWERED BY THIS WORK. deg_T S_3 = 2, and a transitive group of degree 2
      is primitive by definition, so the block-system and resolvent-decomposition
      mechanism KN-OPEN-009 hunts CANNOT EXIST at m=3 before any curve is
      examined. m=3 is exactly the case where that question is degenerate. Nothing
      here is evidence about m >= 4.
    - >-
      OBS-4's factor 2(1 - 1/W_eff) is CONSTANT AT FIXED m AND FIXED W_eff. The
      headline 1.5 is the W_eff=4 value and the limit is 2; a consumer that pins
      1.5 will be wrong for any realistic factor base. "Moves no exponent" is true
      AS SCOPED and must be quoted with its scope: a per-fibre factor of 2 applied
      once per summation fibre compounds as 2^{n-1} in a Gaudry/Diem-style
      decomposition over F_{q^n} with n growing, where it WOULD move an exponent
      (RT O-8b).
    - >-
      The 80 "random ordinary controls" come from the box A in [0,64], B in [1,64]
      - 0.16 percent of the curve space at p=1601, all of tiny height. The
      universality above comes from the identity, which is height-blind, so no
      conclusion depends on the panel being a uniform sample. It is not one.
    - >-
      NO CLOSURE IS CLAIMED. See DEC-20260802-a51c82 on AGENTS.md rule 12: both
      reviews resolved to claude-opus-5, the same model as the producer, so a
      closure claim could not be reviewed to the standard rule 12 requires.
    - Not admissible toward the AGENTS.md rule 13 closure quorum.

  unresolved_confounds:
    - >-
      MODEL CORRELATION. Producer, verification pass, Validator and Red Team all
      resolved to claude-opus-5. The batch has SESSION independence at the review
      step and NO MODEL independence anywhere. Both reviewers reported this
      themselves and neither is in its task's authorized_fallback_models.
    - >-
      The producer also coordinated the batch. BATCH-003-OPENING.md declares this;
      the two reviews are the only independence in the batch.
    - >-
      A latent logic defect in aggregate_outcome would have promoted a
      failed_infrastructure reverification to EXCEPTIONAL_LOCUS_TOY. Unexercised -
      zero exception candidates arose - and recomputed correctly in RUN-002 V7.
      See CORR-20260802-1d8384 defect 3.

  corrections: [CORR-20260802-1d8384]
