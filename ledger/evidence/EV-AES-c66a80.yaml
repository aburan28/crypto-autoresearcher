evidence:
  id: EV-AES-c66a80
  hypothesis_id: RQ-AES-003
  hypothesis_note: >-
    hypothesis_id carries the QUESTION id, per the convention of EV-AES-001..005,
    EV-AES-d8a13e and EV-AES-96257a. No H-* record is bound.
  experiment_ids: []
  run_ids: []
  task_ids:
    - TASK-20260803-6ba122
    - TASK-20260803-367b1b
    - TASK-20260803-9b1482
    - TASK-20260803-fab2b8
    - TASK-20260803-cc92f0
    - TASK-20260803-ae3fcd
    - TASK-20260803-6118b0
  type: measurement
  direction: supports
  strength: replicated
  strength_basis: >-
    Bound by a DISPATCHER-VERIFIED snapshot (TASK-20260803-9b1482, 101 paths)
    before either reviewer read it. The validator re-derived every matrix in its
    own GF(2^4) arithmetic with determinants by two independent routes, re-ran
    the entire sweep on its own engine, regenerated both random S-box tables
    byte-identically from their seeds, recompiled the hint binary from the
    snapshot blob, and RAN THE MISSING DECAY CONTROL ITSELF. Three key-independent
    arms agree TO THE INTEGER across engines. Session and implementation
    independence only; NOT model independence under standing basis
    0137a051eb5828789eb267fa83c8278086578d4c, so nothing counts toward a closure
    quorum.
  claim_tier: toy
  claim_tier_basis: >-
    A 4x4-NIBBLE SPN over GF(2^4) at r in {4,5,6,7} on 40 trials per arm, plus
    r=5 of a reduced-round AES-128 permutation at 2^30-2^31 trials on one
    machine, plus a 6-round toy key-recovery instrument. Nothing about full-round
    or deployed AES; no comparison to published cryptanalysis in either direction.

  scope_of_this_record:
    covers: SEGMENT 1 ONLY, as bound at the snapshot and as both reviewers read it.
    excludes: >-
      SEGMENT 2, the r=6 yoyo decay arms run after the reviewers were dispatched.
      UNREVIEWED, carrying no weight here and supporting no observation below.
      The validator states explicitly that no segment-2 artifact is validated in
      either direction. Its review is BATCH-005 rank 1.

  observations:
    - id: OBS-B4-1
      statement: >-
        THE ZERO-ENTRY DECAY CONTROL DISCRIMINATES, AND THE r=5 RESULT SURVIVES
        IT. Trials reading n mod 8 = 0 out of 40 (chance 5): at r=4 and r=5 all
        three layers read 40/40; at r=6 the producer measured 4 (no-zero control)
        / 9 (one zero) / 7 (four zeros) and the validator's independent engine
        measured 7 / 3 / 5. The preregistered falsification bar was >=36 at r=6
        under a zero-entry layer with the control at <=15. F1 DID NOT FIRE IN
        EITHER ENGINE and F2 holds in both.
      status: CONFIRMED by independent re-execution on a separate engine
      why_the_control_is_real: >-
        The validator confirmed the pairing is genuine: the seed derives from the
        round count alone and the RNG is consumed in the same order and quantity
        for every layer, so trial t at a given r carries identical keys and base
        across all three layers. The control DISCRIMINATES rather than merely
        existing -- it reads 40/40 at r=4 and r=5 and drops to chance at r=6 and
        r=7, which is what makes the zero-entry arms' identical drop informative.
    - id: OBS-B4-2
      statement: >-
        THE ARM THAT DEFEATS THE OBS-B3-4 MECHANISM: Z1 at r=5 forces the residue
        with NO fiber degeneracy -- 40/40 forced, gcd of nonzero fibers 1 on
        40/40, max_occ 6-9, 40 distinct counts. Verified directly by the
        validator.
      status: CONFIRMED
      limits: >-
        Z4 at r=5 REMAINS CONFOUNDED (divisibility by 16 on 40/40, max_occ
        80-128) and the producer says so itself. And the red team established
        that fiber divisibility makes the residue CERTAIN rather than likely --
        C(qm,2) = 8m(16m-1) at q=16 -- so every arm carrying the divisibility
        signature contributes ZERO information, INCLUDING the GF(2^8) M1 r=5 arm
        that EV-AES-96257a OBS-B3-3 rests on. That entailment is recorded here
        because no prior record states it.
    - id: OBS-B4-3
      statement: >-
        THE r=5 YOYO SIGNAL SURVIVES THE TWO RANDOM BIJECTIVE S-BOXES ACTUALLY
        DRAWN. Producer: AES 13.5x, R1 11.0x, R2 20.5x at 2^31 trials against a
        null of 2.0. Validator, on its own instrument with TWO FURTHER random
        bijections at 2^30: AES 22.0x, 15.0x, 22.0x, all ALIVE.
      status: CONFIRMED for the drawn S-boxes
      SCOPE_CORRECTED_HERE: >-
        THE HEADLINE "NOTHING THIS CAMPAIGN HAS FOUND IS SPECIFIC TO AES" IS
        OVERSTATED and is corrected in CORR-20260803-791ca7. The supportable statement is about
        the S-BOXES ACTUALLY DRAWN, at the round count measured. Two draws give a
        95% lower bound of 0.224 on the fraction of preserving bijections; 29
        consecutive draws would be needed for 0.90. The producer's own artifact
        stated this limit correctly; the Coordinator's headline did not.
      further_limit: >-
        S-box, key and stream are CONFOUNDED across the arms (three distinct
        keys). The R1-vs-R2 difference at two-sided p = 0.023 CANNOT be assigned
        to the S-box by this design.
    - id: OBS-B4-4
      statement: >-
        THE POSITIVE CONTROL PASSES AND WAS RE-EXECUTED FROM THE SNAPSHOT BLOB.
        The same sq_slot binary with every hint byte from the TRUE key schedule
        returns {1: 4}, all four diagonals unique and correct. The validator
        confirmed the source sha256 is byte-identical to BATCH-003's, recompiled
        it from the snapshot commit, and reproduced the same four survivor bytes
        and per-structure pair counts.
      status: CONFIRMED by independent recompilation and re-execution
      scope_limit: >-
        This establishes CAPABILITY and nothing more. It excludes the all-empty
        regression hypothesis for BATCH-003 rank 4; it does not re-derive that
        task's slot conclusions and does not show the {0:4} readings were correct
        for the right reason.
    - id: OBS-B4-5
      statement: >-
        A THREE-BATCH-OLD not_executed ITEM IS FILLED AND ITS ABORT REPRODUCED.
        BATCH-001's substitute circulant is confirmed SINGULAR (determinant 0 by
        two independent routes, rank 3), and that batch's own binary refuses to
        count on it. The abort was correct behaviour, not a bug. The validator
        reproduced the 12660/13500 non-singular census exactly.
      status: CONFIRMED

  boundaries:
    - >-
      OBS-B3-4 REMAINS OPEN AT BYTE WIDTH. The decay control is a GF(2^4)
      ANALOGUE. The validator confirmed the mod-8 rescale but added a caveat the
      producer omitted: the margin drops from 32x the modulus at 8 bits to 2x at
      4 bits. GF(2^4) can establish that the mechanism exists, dies, and admits a
      counterexample at r=5; it CANNOT establish the round count at which GF(2^8)
      decays, anything S-box-dependent, or MDS branch number.
    - >-
      "DECAY TRACKS ROUND COUNT, NOT ZERO ENTRIES" is TOO STRONG and is corrected
      in CORR-20260803-791ca7. Zero entries change the ROUTE by which the residue is forced at
      low round counts -- at r=4 the exact-zero result holds 40/40 under the
      control and 0/40 under both zero-entry layers -- but not WHETHER it decays.
    - >-
      Nothing here is a statement about full-round or deployed AES, and no
      comparison to published cryptanalysis is made in either direction.

  unresolved_confounds:
    - OBS-B3-4 at byte width; the GF(2^8) zero-entry arm at r=6 is unrun.
    - S-box, key and stream are confounded across the yoyo arms.
    - Structure-destroyed controls ran at 2^30, not 2^32; one breached its preregistered band as an ordinary Poisson fluctuation.
    - A decryption-only error invisible to the round-trip is not separately tested.

  understatements_recorded:
    - r=7 decay was measured and never used in the producer's verdict.
    - Six random-S-box nibble replication arms were run and never cited.
    - The exact cross-engine integer agreement of three key-independent arms was not noticed by the producer.
    - The Y-R2-sd control breach is LESS alarming than the producer presented it (exact tail 0.0190; look-elsewhere across three sd arms 0.056).

  reviewed_by:
    - TASK-20260803-fab2b8 (independent validator; verdict passed, full independent re-execution, 3 overstatements and 4 understatements)
    - TASK-20260803-cc92f0 (independent red team; 11 objections, 8 required controls)
  reviewed_at: 2026-08-03

  inference:
    policy: coordinator-orchestration-code
    requested_policy: coordinator-orchestration-code
    resolved_model: claude-opus-5
    fallback_used: true
    model_verified: false
