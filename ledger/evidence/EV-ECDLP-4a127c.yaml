  supported_core:
    model: MPZ dense prime-order generic group, optionally with exactly the shared oracle ro(v)=RO(pi(v)) of Corollary 3
    interface: universal arbitrary public signed occurrence-labelled decks with exact canonical subset restriction in four named decks and one public reconstructible fifth deck
    construction: >-
      Let B=N^(1/5), m=2^ceil(log2(B)), C=sum_{i=0}^4 m^i,
      F_i={(i,d,sigma,[sigma(d+1)m^i]P)}, and R=Q+[C]P.
    decoder: x_hat=(sum_{i=0}^4 sigma_i(d_i+1)m^i-C) mod N
    exact_restriction_calls: 4*log2(2m)=4*(ceil(log2(B))+1)
    public_fifth_scan: exactly 2m labelled occurrences and comparisons
    advice_bits: ell=B^(9/4+o(1)) after complete bit serialization
    aggregate_main_interactions: k=B^(5/4+o(1)) including construction, restrictions, scan, decoding, replay, shared-RO use, and verification
    success_bound: 3*ell*(k+1)^2/N=B^(-1/4+o(1))=N^(-1/20+o(1))
    consequence: >-
      A universal exact or nonvanishing complete-transcript solver satisfying
      all frozen premises would contradict the MPZ bound for sufficiently
      large N.
  required_scope_revision:
    disposition: REVISION_REQUIRED
    broken_boundary: >-
      The claimed Theta(B^2) stopping cost after retaining two public additive
      decks is not supported.
    preserved_successor: >-
      After isolating F0,F1,F2, compute W, store every labelled F3 encoding,
      scan every labelled F4 occurrence, and test W-encoding(e4) in the
      dictionary. This is an unverified B^(1+o(1))-state and interaction
      candidate requiring a separate frozen proof and independent review.
    control_repair: >-
      Hidden presentation labels alone do not stop decoding when public scalar
      lineage reconstructs them. The stopping control requires unavailable
      lineage or nonreconstructible or incomparable handles.
  limitations:
    - The result is distributional over fresh uniform generic challenges and representation randomness, not a pointwise coordinate-bearing theorem.
    - It does not cover coordinate-aware elliptic-curve, Semaev, resultant, field-oracle, P1553 target-local, or representation-sensitive algorithms.
    - It does not cover target-conditioned advice, persistent uncharged handles, unbounded unit-cost words, per-call rather than aggregate k, other random oracles, or marginal per-query success.
    - The three-restrictable-deck dictionary continuation is open and unreviewed.
    - No claim is made for only two restrictable decks and a remaining three-deck join.
    - This is not an ECDLP algorithm, generic lower bound, P1553 impossibility, attack, speedup, SOTA movement, B71 admission, closure, completion, or breakthrough.
