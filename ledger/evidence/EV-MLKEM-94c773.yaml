  observations:
  - THE NOTARIZATION GAP IS CLOSED BY CONSTRUCTION. The validator confirmed sha256 cc7f3e19 across SIX
    carriers; ran git merge-base --is-ancestor 17203307 d3e66a19 (TRUE); found git log --follow on prereg.md
    returns EXACTLY ONE commit, the notarization; and established that NO measurement artifact exists
    in the git record before the pre-registration does. The self-reported-ordering defect recorded in
    EV-HQC-75c05b and EV-MLKEM-94f036 is closed for this batch by harness structure. It is NOT retroactive
    for earlier batches, and ancestry cannot exclude off-repo pre-computation.
  - 'V-7: the executor verified the notarizing commit''s PARENT rather than the commit, so its own check
    would have passed had the notarization never happened. The validator ran the stronger check and it
    passes.'
  - THE AM-1 GRID FIX WORKED. The gate crossing falls INSIDE the sampled range in all four cells (clears
    through t = 0.015 / 0.02 / 0.01 / 0.015, fails from 0.02 / 0.03 / 0.015 / 0.02, against midpoints
    0.009901 and 0.007092). G1 clears at 47.80 / 66.24 / 52.56 / 77.24 SE and G2 fires nowhere. Dynamic
    range 46.56-77.24 SE.
  - 'THE AM-1 G3 GATE IS DEFECTIVE, AND THE DEFECT IS THE COORDINATOR''S. The validator reproduced all
    48 steps exactly under both SE conventions and upheld the executor''s section 7.5 objection, then
    strengthened it decisively: 24 OF 48 STEPS HAVE NEITHER ENDPOINT CLEARING THE GATE, and for a true-zero
    step Delta/SE_paired follows t_7, so P(|t_7| > 1) = 0.175309 and P(at least one FAIL across the 24)
    = 0.9902. A FLAWLESS INSTRUMENT RETURNS INVALID WITH PROBABILITY 0.99. AM-1 moved construction-driven
    P(INVALID) from about 0.9986 to 0.9902 -- it RELOCATED the defect rather than removing it, because
    the tolerance is denominated in a noise scale (SE_step_paired) that collapses exactly where the effect
    vanishes. SE_step_paired / SE_diff = 0.36-0.42, so G3-paired is roughly ten times more sensitive than
    the gate that decides whether an arm carries signal at all.'
  - 'The "record the more severe reading" clause is a ONE-SIDED safeguard, not the two-sided one it claims:
    SE_paired < SE_unpaired in 47 of 48 steps, so in practice it reduces to "always paired".'
  - 'THE TWO REVIEWS COMPUTED THE FALSE-FAILURE RATE INDEPENDENTLY, BY DIFFERENT COUNTINGS, AND AGREE ON
    THE CONCLUSION. The validator counted all 24 of 48 steps with neither endpoint clearing the gate and
    obtained P(at least one FAIL) = 0.9902, noting the figure is mostly MULTIPLICITY -- 48 comparisons
    at a per-step threshold, with no multiplicity policy declared in AM-1. The red team counted the 3
    plateau steps the AM-1 grid guarantees per cell, from the run''s own exact V values rather than from
    a model, and obtained P(cell FAIL) = 0.4397, P(4-cell FAIL) = 0.9014, and P(4-cell PASS) = 0.00025
    (0.9541 / 0.000015 at 4 plateau steps). Both are recorded; neither is preferred. The frozen G3 fails
    a correct instrument roughly nine times in ten and passes it roughly once in four thousand.'
  - P3's NULL EXPECTATION IS GENUINELY A THEOREM. The validator derived it independently -- P_aa ~ Beta(beta/2,
    (d-beta)/2), so Var = 2 beta (d-beta) / (d^2 (d+2)) and E[V] = d * Var = 2 beta (d-beta) / (d (d+2))
    by linearity alone, needing no independence because the P_aa sum to beta -- and confirmed it bit-exactly
    in all four cells plus a 20,000-frame Monte Carlo. The separation reproduces exactly from seeds under
    the validator's own independent code.
  - AND THE THEOREM IS THE WRONG DEFENCE. The red team showed that a correct null makes P3 a correctly-calibrated
    detector of FRAME ORIENTATION RELATIVE TO THE COORDINATE AXES, which is not a function of the lattice.
    P3 RETURNS ITS MAXIMUM POSSIBLE DEPARTURE ON Z^d, because V <= beta (1 - beta/d) for every rank-beta
    projector and the identity basis attains that bound -- and the producer's own out-of-sample anchor,
    V = 21.000000, IS that object. ITS STRONGEST VERIFICATION AND ITS WORST NULL-OBJECT FAILURE ARE THE
    SAME COMPUTATION.
  - 'An ambient isometry INVERTS the verdict on one lattice: identity gives DEPARTURE at z = +465.48,
    DCT gives ANOMALY_BELOW_NULL at z = -17.98 (which the spec itself defines as instrument fault), and
    Haar gives AGREEMENT at z = -0.50. Row permutation alone moves V from 9.35 to 21.00 to 12.81.'
  - 'The unreduced-arm separation is A CONSTANT OF THE CONSTRUCTION: the red team reproduced the committed
    V from its own independently generated q-ary bases to within 0.12-0.73 percent, with instance dispersion
    under 1 percent. Every +250 to +587 SE reading is a measurement of the q-ary form, obtainable in closed
    form.'
  - 'A MATCHED-V CONTROL FALSIFIES F-A1''s MECHANISM CONTENT (red team, new result). F-A1 asserts D depends
    on the frame only through V and increases with V, and the executor scored it CONSISTENT on the NOVEL
    subset. But the prereg defines that subset as graded-path points only, containing ZERO cross-family
    pairs, and along the graded path V(t) and D(t) are BOTH monotone decreasing in t -- so "zero violating
    pairs" is forced by the construction and F-A1 as scored is a monotonicity check on one monotone path.
    The red team built the missing arm: a second frame family exactly matched in V (two-level diagonal
    profile, u solved in closed form) with a different third diagonal moment. AT EXACTLY EQUAL V, D DIFFERS
    BY 7 PERCENT AND 20 PERCENT, the second at 3.45 SE. D is NOT a function of V alone. The direction tracks
    sum_a (P_aa - beta/d)^3, as expected: Var(e^T P e) = 2 beta + (mu4 - 3)(V + beta^2/d) makes the VARIANCE
    a function of V alone -- L2''s derivation is right at second order -- but D is a 2^-10 TAIL QUANTILE
    whose third cumulant involves sum_a P_aa^3 independently of V. The prereg called F-A1 "the falsifier
    that counts", immune to the magnitude map''s known 1.0-1.7x defect. IT IS NOT IMMUNE: an ordering
    test is blind to a level offset that preserves order.'
  - 'F-A1 SCOPE. The matched-V control is a red-team probe on the red team''s OWN frames, NOT pre-registered,
    TOY tier, d = 100 and beta = 30 only, and its D values are not comparable in absolute terms to the
    run''s because fpylll was unavailable in that session. It does NOT overturn the recorded CONSISTENT
    verdict, which was computed correctly under the frozen rule. It shows the frozen rule tested a weaker
    proposition than the one it named.'
  - 'F-B: "BOTH LAWS FALSIFIED" IS CORRECT BOOKKEEPING AND THE WRONG READING, and the two verdicts do
    NOT carry equal weight. L1 FALSIFIED IS ROBUST -- genuinely pre-registered, predicts decay, and growth
    was measured at both d including the fold-free d = 140 row. L2 FALSIFIED IS NOT: (i) at d = 100, k
    = 50 and the trend runs to beta = 60 > k, so D(60)/D(30) is a ratio ACROSS A PHASE CHANGE in the object
    -- the unreduced V itself falls, 24.995 to 16.269, as the tail window is forced out of the k-block
    -- and no decay law of either kind is defined across that fold; (ii) lll_only and real_bkz40 are NOT
    APPLICABLE at both d, so F-B has exactly ONE scorable arm per d and it is `unreduced`, whose V is
    a constant of the q-ary construction, so F-B''s discriminating measurement is a measurement of the
    construction and not of any reduction phenomenon; (iii) at the fold-free d = 140 the honest reading
    is L1 misses by 247 percent and L2 by 36 percent against a +/-25 percent band, a distinction the band-membership
    rule discards by design. D_A(60)/D_A(30) at fixed reduction is NOT AN ADMISSIBLE OBSERVABLE for a
    decay law and must not be frozen about again.'
  - 'THE 0.90 ARTIFACT TELL IS BOUND TO THE WRONG PARAMETER. The inventor protocol''s tell is a quantity
    that fails to decay when THE PARAMETER MEANT TO DESTROY IT increases. beta is not that parameter --
    it is the width of the probe window, not a randomization strength, and widening it into the same aligned
    k-block is EXPECTED to increase D (L2 predicts exactly that growth at d = 140). The parameters meant
    to destroy the departure here are t and reduction strength, and against both the quantity decays monotonically,
    as a real signal should. The tell fired because it was carried verbatim from the superseded prereg
    together with the wrong binding, not because an artifact was detected.'
  - 'Reproduction is exact: 32 of 32 reductions at max deviation 0.0 against BOTH prior batches, and all
    24 shared grid points bitwise identical, so extending the grid from 7 to 13 points did not perturb
    the sampled paths.'
  inference: 'The batch closed the notarization gap by construction and fixed the grid, and both of those
    hold. Its two substantive deliverables did not survive: the repaired monotonicity gate returns INVALID
    on a flawless instrument with probability 0.99, so this batch''s INVALID verdict is a statement about
    a threshold and not about the apparatus; and the candidate adjudicator, though correctly calibrated
    against a real theorem, measures frame orientation relative to the coordinate axes rather than anything
    about the lattice, and attains its maximum departure on Z^d. What is established is about the apparatus
    and the geometry of the statistic. ONE PATTERN RUNS THROUGH ALL THREE FAILURES AND IT IS THE SAME
    PATTERN: every one of them was scored where its own defect could not appear. G3 was denominated in
    a noise scale that collapses exactly where the effect vanishes. P3''s out-of-sample anchor was the
    one object on which it attains its maximum. F-A1 was scored on a subset whose construction forces
    the co-monotonicity it tested for. In each case the check was real, the arithmetic was right, and
    the arrangement made the check incapable of failing for the reason it existed to catch. That is the
    fourth, fifth and sixth instance of this failure mode in this program, and it is now the finding.'
  boundaries:
  - NOTHING bears on ML-KEM security, on any FIPS 203 parameter set, or on any cost model. Claim tier
    TOY.
  - No hypothesis status moves. The demonstration returned INVALID, so section 7.5(3) of the frozen pre-registration
    forbids interpreting the real arms.
  - The INVALID verdict as recorded STANDS. The validator computed that a gate-commensurable tolerance
    would give TIE in all four cells and therefore PARTIAL, and stated explicitly that this is POST-HOC
    and must never be cited as a result. It is not cited as one here.
  - The notarization closure is for THIS batch and is not retroactive to BATCH-436ddd or to the GOAL-HQC-001
    batches.
  - P3 is REFUSED as an adjudicator. Nothing in this record adopts it, and its demonstrated separations
    are not evidence about lattices.
  - The F-A1 CONSISTENT verdict as recorded STANDS. The matched-V control was not pre-registered and does
    not retroactively rescore a frozen falsifier. What it establishes is that the frozen F-A1 tested a
    weaker proposition than the one the pre-registration named.
  unresolved_confounds:
  - The "4 SE" gate is a roughly 0.2 percent test rather than the 3e-5 its nominal factor suggests --
    the validator measures the z standard deviation at 1.193-1.196 and a false-positive rate of 0.0015-0.0025,
    a factor of about 60. Producer-disclosed and independently confirmed.
  - k != d/2 IS NOW NAMED IN FIVE RECORDS AND HAS STILL NEVER BEEN RUN. It is the cheapest discriminating
    test outstanding in this lane and it separates the refuted q*I story from the measured I_k confinement.
  - Whether ANY statistic can adjudicate this question without inheriting the coordinate-frame dependence
    that defeats P3 is open. The red team notes a degree-1 alternative W = sum_{a<=k} P_aa - beta k /
    d is admissible, is not a function of V, and fires -- so the space is not empty, but nothing in it
    is demonstrated.
  - 'The residual after reduction still cannot be resolved statistically by this instrument: roughly 1000
    frames per arm would be needed against the 8 run.'
  - 'L2''s SECOND-ORDER DERIVATION SURVIVES AND ITS TAIL EXTENSION DOES NOT, and the boundary between
    them is now measured rather than argued: Var(e^T P e) IS a function of V alone, but the 2^-10 quantile
    the design measures at is not. No successor may treat a variance-level derivation as licence for a
    tail-level prediction in this lane without measuring the gap.'
  - The matched-V control was run on the red team''s own frames because fpylll was unavailable in that
    session, so its D values are not absolutely comparable to the run''s. Reproducing it against the committed
    bases is cheap and is not yet done.
  reviewed_by: coordinator
