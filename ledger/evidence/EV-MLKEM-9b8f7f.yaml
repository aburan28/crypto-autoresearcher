evidence:
  id: EV-MLKEM-9b8f7f
  hypothesis_id: null
  hypothesis_id_note: >-
    DELIBERATELY NULL, and for the same reason as EV-MLKEM-cd9878. BATCH-cbe023 ran
    three measurements of INSTRUMENTS: an admissibility gate over ten candidate
    observables (Section A), a monotonicity gate's own positive control (Section B),
    and a cross-family tail-quantile falsifier rebuilt with a new SE (Section C). The
    frozen contract (TASK-20260808-35efa3/prereg.md sections 2.11, 3.9, 4.11, 5.8)
    states that Sections B and C operate on presentation-dependent observables and
    that no verdict in the batch adjudicates any claim about a lattice. Naming a
    hypothesis here would invite exactly the inference these runs cannot support.

  experiment_ids: []
  experiment_ids_note: >-
    No EXP-* record governs this batch. The frozen contract is the notarized
    pre-registration
    coordination/goals/GOAL-MLKEM-005/batches/BATCH-cbe023/tasks/TASK-20260808-35efa3/prereg.md,
    sha256 2da554914e5d78146c1e6cafcdbd109aacbc1a1624ed1f8e94ae769f757fc4f8, notarized
    in commit 4f7c63703d50445c758fc6216ca8d4436e04ae2a by TASK-20260808-e725b4 before
    any producer was dispatched.

  run_ids: []
  run_ids_note: >-
    No RUN-* index record exists. The eighteen producer artifacts (three scripts,
    three raw JSON result files, three reports, three run manifests, and command.txt /
    stdout.log / stderr.log for the two producers that emitted them) are
    snapshot-committed at 6bafef86241fe3d70c21c3e30ed66d99b1f699ea by
    TASK-20260808-a6a336 and are cited here by path and by the receipt's path_sha256
    values. The independent Validator (TASK-20260808-768137) recomputed all 18 declared
    path_sha256 values from the working tree, reports 18 of 18 matching with 0
    mismatches, and reports that the snapshot commit changes exactly 19 files (the 18
    declared artifacts plus its own receipt), all additions, with the declared parent
    ed5cc287d54991480c23629b5ed477bb194dfa4c. Producer runs:
    TASK-20260808-2a9085 (Section A, AM-4 gate), TASK-20260808-cece0c (Section B,
    AM-6 positive control), TASK-20260808-3a5f18 (Section C, AM-7 rebuild).

  type: empirical

  direction: neutral
  direction_note: >-
    NEUTRAL, and this is the honest reading rather than a hedge. Nothing in this batch
    supports, weakens or contradicts any hypothesis about lattices, about reduction,
    about the Beta tail law, or about ML-KEM. What it establishes is about three
    instruments. All three of the batch's headline verdicts -- Section A's `R3`,
    Section B's "the AM-3 gate CAN fire at 29 of 48", Section C's `CONSISTENT` -- are
    shown by independent review to be outputs of their own frozen designs rather than
    facts about the objects they name, and none is recorded here as a result in the
    form its producer stated it.

  strength: replicated
  strength_basis: >-
    `replicated` is claimed for MEASUREMENT REPRODUCIBILITY and for FOUR NAMED
    INSTRUMENT FACTS. It is NOT claimed for any headline verdict and NOT claimed for
    any statement about lattices. The two halves are separated because they replicate
    for different reasons, and the single-source items are enumerated so no successor
    can read the label as covering them.
    (i) REPRODUCIBILITY. The Validator re-derived NINETEEN forced values as first-class
    artifacts (FV-1..FV-9, FV-B0..FV-B3, FV-C0..FV-C3, FV-D3, FV-W), most bit-exactly:
    all 48 Section B c_min(i) and c_pos(i) at max absolute deviation 0.000e+00 and
    AGAIN at 0.0 from the separate committed BATCH-a44d08 snapshot 770009042, so
    Section B's entire n_fire table is derivable without any number this producer
    originated; rdet's G-Q at 0.9969516728448583 bit-exactly from the closed form
    q^{(d-k)/d}; lambda_1(L)^2 at 123237.0 / 218.0 / 167027.0 / 290.0 bit-exactly
    through a DIFFERENT fpylll entry point (basis GSO where the producer used the
    integer Gram path); the Wilson reachability table to 1 ulp; alpha_pair and the
    Student-t criticals bit-exactly; E[V]_haar and the TL reachable-V intervals
    bit-exactly; the two-way SE decomposition, nu_eff, |t|, relative difference and
    detection floor at all 10 Section C targets to 1e-9 relative, recomputed from the
    raw S x E Delta tables rather than from summaries; and slogdet correctness on the
    exact bases that emit RuntimeWarnings, rdet correct to 6.758e-15 against the closed
    form with no NaN entering the statistic.
    (ii) FOUR REPLICATED INSTRUMENT FACTS. (a) The Section A T1 invariance refusals
    reproduce under an implementation the Validator wrote himself with his own basis
    construction, his own QR path, his own Haar stream and his own seed (IND-1: E_I
    7.3388e-01, V 9.8771e-01, m3 1.0187e+00, W 1.0714e+00, OD 6.1696e+00, TRIV
    8.2897e-16), 1-2 orders above tau_inv = 0.01 and 13-14 orders above the measured T0
    noise floor. (b) PRED-A1 passes at all 9 of the Validator's own cells, |mean E_I -
    k/d| between 1.07e-04 and 4.06e-03 against the frozen max(4 SE, 0.02), so the T1
    implementation meets the exact Haar expectation. (c) The HKZ repair is real and
    necessary: the Validator measured a pre-repair HKZ violation of 7.5500e-03 at
    d = 30 and 3.0205e-03 at d = 40 with one BKZ pass at block_size = d and no explicit
    sweep, reproducing the producer's "up to 7.6e-3", and 0.0 at all four lattices with
    the sweep. (d) Section C's rebuilt null regime reproduces under a null the Validator
    BUILT HIMSELF from the prereg text with his own seeds, pool bank, u and
    order-statistic path (IND-3, R = 30 at d = 100 beta = 40): 0 false falsifications
    of 30, median |t| 0.7107, p95 2.7037, against the producer's 0 of 300, median |t|
    0.5418, p95 2.4913.
    (iii) SINGLE-SOURCE, AND NOT COVERED BY THE LABEL. The T2 (row permutation) and T3
    (unimodular) invariance residuals for E_I, V, m3, D, W and OD exist only in this
    producer's output; the Validator's independent rebuild is T1-only, and the Red Team
    quotes rather than re-measures them. The diagonal-collision separation for X4 = D
    (0.15837 at L3, 0.03447 at L4) is one probe in one run at one (d,k,beta) per cell;
    the Validator rebuilt the probe construction and confirmed the six arithmetic zeros
    and the 0.433013 off-diagonal separation, but did not independently recompute D's
    collision value. The hkz G-REL1 / G-REL2 / G-Q values are single-draw, basis index 0
    only. Section C's 10 target D-tables and its 1200 null replicates exist only in this
    producer's output; the Validator states plainly that "any successor citing the
    CONSISTENT verdict must cite it as resting on one run."
    (iv) AND THE COUNTERWEIGHT, WHICH THE LABEL DOES NOT SOFTEN. The Red Team
    demonstrated that Section A's headline outcome was very nearly forced before any
    datum existed (OBS-A2 below), that PRED-B1's falsifier was empty conditional on a
    reproduction check that passed bit-exactly (OBS-B2), and that Section C's verdict
    could not have been changed by the repair the section exists to perform (OBS-C1).
    A reproducible measurement of a quantity whose verdict was determined by the
    design is a reproducible measurement and nothing more, and that is exactly how it
    is recorded here.

  claim_tier: toy
  claim_tier_note: >-
    TOY, UNCONDITIONALLY, at d in {20, 30, 40, 100, 140}, beta <= 95, k in
    {6,9,12,14,21,28,30,40,50,70,100}, q <= 3329, n = 8 bases per lattice and 8
    replicates per transform, S = 8 supports and E = 4 error pools, N = 2^20
    CBD_{eta=2} error vectors, the 2^-10 quantile only, and no reduction beyond HKZ at
    d <= 40 and the committed unreduced arms. NOTHING in this record bears on ML-KEM
    security, on any FIPS 203 parameter set, on any attack cost, or on any cost model.
    No number here is transported to beta = 606, d = 1420, or to any other parameter
    set by extrapolation or by analogy. All three producers, both reviews and the
    frozen contract state this independently (prereg 5.2; validation_report.yaml
    claim_boundary; red_team_report.md header). The Validator's own scale-binding check
    records PASS and that no producer transported a number.

