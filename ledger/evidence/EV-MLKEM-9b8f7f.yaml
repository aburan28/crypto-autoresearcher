    (deviation 5) and both reviews confirm it. Additionally, PROBE-L separates hkz from
    the frame at 4.26e-04 of scale, 23x BELOW the same gate's tau_inv = 0.01 -- so hkz
    is "not f(P)" at a margin the gate's own resolution treats as indistinguishable from
    invariance -- and PROBE-L is labelled SUPPLEMENTARY and NOT pre-registered. Also
    recorded: the q-ladder's q = 1 rung gives A = 0 and B = I_d exactly, so EVERY G-Q
    value in the table compares a q-ary lattice against Z^d -- a change of LATTICE, not
    a change of q-ary structure at fixed lattice. That voids G-Q's claimed
    discrimination as well as G-RANK's: "a constant fails and a covolume passes because
    covol(Z^d) = 1" is not evidence that G-Q separates informative from uninformative
    observables, and X_null passes G-Q at exactly 1.0000 for that reason.
  - >-
    OBS-A8 G-RANK IS NOT ADJUDICATED, CONFIRMED INDEPENDENTLY. The frozen construction
    A = A1 @ A2 mod q forces rank over F_q but leaves it full over R: the Validator
    built the factors himself and measured rank_R(A) = min(k, d-k) = 30 / 40 at EVERY
    rung r in {1,5,10,20,k} while rank_Fq(A) = r exactly. The GSO frame from QR(B^T) is
    computed over R, so the ladder does not vary the quantity G-RANK's departure index
    is meant to track, and min(rank(A_S), beta) and min(k, beta) coincide at every rung.
    The producer recorded the objection and ran the frozen spec anyway, which is
    correct. The stale mechanical verdict left in results_am4.json is superseded by
    report_am4.md 8.2 and the Validator's measurement supports the report.
  - >-
    OBS-B1 SECTION B'S REPAIR IS REAL AND IS THE BATCH'S CLEANEST POSITIVE. AM-6's
    defect was a step-selection rule that maximised the injection's own denominator;
    that rule is REMOVED rather than replaced. Every one of the 12 steps of every one of
    the 4 cells is reported, 0 degenerate, with c_pos(i) printed beside c_min(i) at
