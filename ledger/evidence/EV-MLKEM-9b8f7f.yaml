    invariant to the entire AM-7 repair -- is a pure arithmetic derivation from the
    committed table (largest realized relative difference 14.12% against tau_rel =
    0.15, so frozen condition (ii) fails at every target for any SE including SE = 0)
    and I re-checked it myself against report_am7.md. `OBS-GEN` is likewise a
    derivation and not a machine-checked proof. NO CLAIM HERE IS A THEOREM, and none
