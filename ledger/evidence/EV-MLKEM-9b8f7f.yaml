      the declared 11, with both counts reported, plus 300 replicates in each of four
      exact-null units and 60 in each of two N-C units. One declared cap bound: Section
      A's X9/X10 arm at L11 hit its 300 s cap at 300.4 s. That is INFRASTRUCTURE
      SIGNAL, never a refusal and never an obstruction (AGENTS.md rule 3), the producer
      reported BOTH the arm-level and the strict R5 readings, and the Validator
      confirms the headline is robust to both because rdet's arm completed in full.
    schema_complete_manifests: >-
      PASS WITH ONE RECORDED GAP, not repaired by me. All three run_manifest.yaml files
      parse and carry git revision and dirty state, environment and dependency
      versions, seeds, an inference block with model_verified and its reason, resources,
      timings, validity status, and certificate.kind = none with its reason. The gap
      recorded against BATCH-a44d08 (manifests missing an inference block or
      model_verified) is NOT repeated. THE GAP: TASK-20260808-3a5f18 retains no
      command.txt, no stdout.log and no stderr.log -- its manifest states the logs went
      to a session scratchpad and are "NOT durable" -- and its manifest `command:` is a
      YAML folded scalar, so the long path parses with an inserted space and is not
      runnable as written; the same folding corrupts artifacts.write_scope, and
      report_am7.md gives a third abbreviated form. AGENTS.md's artifact policy requires
      the exact command, stdout and stderr for every run. Both reviews record this
      independently (Validator F-5, Red Team RT-C7). Recorded as an incompleteness,
      never filled in or estimated.
    seed_integrity: >-
      PASS, and the strongest single sign of an unsmoothed reproduction in this batch.
      Section B regenerated all 448 per-draw r values from the carried seeds with no new
      BKZ, LLL or reduction of any kind: max deviation 0.0 against BATCH-a44d08's
      committed record and 2.220446049250313e-16 against BATCH-f19c37's, confined to
      d = 140 -- the exact one-ULP deviation prereg 3.5 DECLARED IN ADVANCE and
      explicitly forbade rounding to 0.0, traced to the deterministic reference divisor
      betaincinv(beta/2,(d-beta)/2,2^-10) under scipy 1.15.3. c_min reproduction is 0.0
      in c units on both legs. Section C's GR side and unreduced arms reproduce the
      committed BATCH-f19c37 record at the same two values. The frozen collision-free
      tuple seed scheme (TAG table, prereg section 6) was used as declared.
    raw_summary_agreement: >-
      PASS. The Validator recomputed the Section B 48-step table and the Section C
      10-target decomposition FROM RAW (the per-step (Delta_i, SE_step, SE_diff) and the
      raw Delta_table_S_by_E), not from summaries, and both agree. One stale field
      exists inside an immutable artifact and was correctly left unaltered:
      results_am4.json retains the script's mechanical G-RANK verdict "REFUSED as a
      block-content adjudicator" for E_I at L4, which report_am4.md 8.2 explicitly
      supersedes; the Validator's own rank measurement (FV-5) supports the report over
      the JSON field. Two prose-versus-binding discrepancies exist in MY OWN snapshot
      receipt and are corrected by supersession below.
    control_comparability: >-
      MIXED, AND THIS IS THE BATCH'S DECIDING AXIS -- for the second consecutive batch,
      and in a new place. The controls that were BUILT behaved: T0 (the mathematically
      identity round trip) at max 6.20e-11 against tau_num = 1e-6, four to ten orders
      below tau_inv; X7 = TRIV refused by G-Q at 3.552713678800501e-16; X8 = rdet passing
      G-INV at 2.514254164288223e-13 and lam1n at 7.150430661174418e-15; NC-B1 (c = 0)
      and NC-B2 (c = -6) both returning 0 of 48; the N-A / N-B exactness checks at
      <= 7.11e-15; the degenerate V pair excluded by rule and never counted as support.
      THE CONTROLS THAT WERE MISSING DECIDE THE BATCH, and each was BUILT by the Red
      Team after the fact. (a) Section A has NO positive control for G-REL and no
      dispersion criterion, and a parameter-determined observable with zero dispersion
      across the frozen bases reaches R1 through the frozen gate. (b) Section B has NO
      NULL OBJECT -- NC-B1 and NC-B2 are the same family under different injections --
      and on an exact-null step (Delta_i := 0 at the committed SEs) n_fire(c=6) is 47 of
      48 against the reported 29, i.e. the reported quantity is 62% of its own null and
      MOVES THE WRONG WAY as the violation vanishes. That is the canonical artifact tell
      of docs/inventor-protocol.md section 3 in its exact form. (c) Section C's
      delta_min "positive control" performs no injection and re-runs nothing
      (measure_am7.py:501); it is closed-form arithmetic in the SE it is meant to
      validate, algebraically equivalent to "is the detection floor below 50%", so it
      cannot detect SE inflation -- which is precisely the defect AM-6 clause (b) names,
      inside the section prereg 4.7 calls "the mirror of AM-6's requirement". An absent
      or self-referential control is not a negative mathematical result; it is why the
      three headlines are not evidence.
