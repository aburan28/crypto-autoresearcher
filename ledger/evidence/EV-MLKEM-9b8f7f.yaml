  - >-
    OBS-C1 SECTION C'S "CONSISTENT" VERDICT IS INVARIANT TO THE ENTIRE AM-7 REPAIR, AND
    THIS IS NOT DISCLOSED ANYWHERE IN THE PRODUCER PACKAGE. A FALSIFYING PAIR requires
