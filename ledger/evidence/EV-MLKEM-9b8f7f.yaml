    E_I, V, m3 and W are explicit sums over diag(P), TRIV = tr(P^2) = tr(P) = beta
    identically, and OD = beta - V - beta^2/d by the projector identity (verified to
    4.263256414560601e-14 by the producer over 6765 frames and to 2.842171e-14 by the
