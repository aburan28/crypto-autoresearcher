  - >-
    OBS-X1 THE PATTERN NOW HAS A NINTH INSTANCE, AND IT IS IN THE CONTROL AGAIN. The
    program has recorded eight prior instances of a check scored in the one arrangement
    where its own defect is invisible (G3, P3, F-A1, CTRL-BS, CTRL-POSHOM, CTRL-IDXMAP,
