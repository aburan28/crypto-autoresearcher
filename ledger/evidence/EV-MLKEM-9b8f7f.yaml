  - >-
    OBS-A6 AM4-OBS-1's PREMISE IS REFUTED FOR D, ITS APPARENT CORROBORATION IS
    ARITHMETIC, AND THE FROZEN OUTCOME MAP HAD NO ROW FOR WHAT HAPPENED. The frozen
