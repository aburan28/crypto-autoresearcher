    the canonical artifact tell docs/inventor-protocol.md section 3 names, in its exact
    form. The gate's behaviour is correct -- at Delta = 0 the post-injection increase is
    a real 6*SE_diff -- but the count is dominated by SE_step/SE_diff and its null
    benchmark is nearly the ceiling; prereg 3.8's Form-1 guard (a fixed-c count plus
