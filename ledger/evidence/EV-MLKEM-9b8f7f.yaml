    Validator re-derived all 48 c_min and c_pos from the raw (Delta_i, SE_step, SE_diff)
    at max absolute deviation 0.000e+00, and AGAIN from the SEPARATE committed
    BATCH-a44d08 snapshot at deviation 0.0, so Section B's headline table does not
    depend on any number this producer originated. Both mandatory negative controls
    behaved: NC-B1 (c = 0) returns 0 of 48 with max statistic -0.19342160540508713 at
