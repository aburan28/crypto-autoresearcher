    observation about this program's method. It is NOT promoted to knowledge, for the
    same reason as last batch: every instance is internal to this program, which is
    exactly the sampling that would make the pattern look characteristic whether or not
    it is.
  - >-
    OBS-X2 SECTIONS B AND C MEASURE OBJECTS SECTION A REFUSES, WHICH IS DISCLOSED AND
    MUST NOT BE FORGOTTEN DOWNSTREAM. Section A measures D's own invariance residuals at
