    committed 9.
  - >-
    OBS-B2 BUT "THE AM-3 GATE CAN FIRE -- 29 OF 48 AT c = 6" IS NOT A POWER
    DEMONSTRATION, AND ITS PREDICTION COULD NOT FAIL. Two independent reasons, both
    from the Red Team, both checkable on the committed numbers. FIRST, THERE IS NO NULL
