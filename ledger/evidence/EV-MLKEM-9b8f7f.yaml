      `git merge-base --is-ancestor 4f7c63703 6bafef862` and `... HEAD` are both true,
      asserted against the NOTARIZING COMMIT ITSELF and not its parent (carried
      correction V-7). REVERSE: prereg.md is ABSENT at the notarizing commit's parent
