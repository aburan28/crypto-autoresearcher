  - >-
    OBS-C2 THE ONE GENUINE RESULT SECTION C PRODUCED IS NOT IN ITS REPORT, AND THE RED
    TEAM FOUND IT AGAINST ITS OWN THESIS. G-CAL was scored on the JOINT criterion. Split
    by condition over the four exact-null units (1200 replicates), the RELATIVE-FLOOR
    condition (ii) fires 0 of 1200 on its own -- so all four 0/300 counts are carried
