    and it did not, so the outcome map has no row for the outcome that occurred: a
    refutation of AM4-OBS-1's premise is recorded in the producer's prose and NOT in the
    outcome field. The Validator confirms the producer's reconciliation was correct
    under the frozen text and that R4 correctly did not fire; the defect is in the map.
    SCOPE, stated exactly: the D separation is ONE probe in ONE run at one (d,k,beta)
    per cell, single-source, with the L4 margin at only 1.29x its floor. Premise refuted
    at 1 of 1 testable candidates and corroborated at 0 of 0.
  - >-
    OBS-A7 WHAT THE THREE "AM-4-ADMISSIBLE" CANDIDATES ACTUALLY CARRY, WHICH IS LESS
    THAN THE LABEL READS. rdet passes by ALGEBRA -- det(BH) = +-det B, det(Pi B) =
    +-det B, det(UB) = +-det B exactly -- and it is parameter-determined: |det B| =
    q^{d-k} for all 8 bases with zero dispersion. lam1n and hkz go through the INTEGER
    GRAM matrix, and G(BH) = BHH^T B^T = BB^T identically, so T1 -- the ONLY transform in
    the AM-4 triple that tests isometry-class invariance rather than basis invariance --
    is the exact identity on their input, and their T1 residuals of 0.00e+00 are not a
    test that could have failed. Their T2 and T3 residuals (<= 7.15e-15 and 1.20e-14)
