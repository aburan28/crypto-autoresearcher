  - >-
    OBS-C3 WHERE SECTION C'S POWER ACTUALLY WENT, AND WHY PRED-C2's FAILURE IS NOT
    INDEPENDENT OF THE VERDICT. PRED-C2 FAILS: the between-support and between-pool
    components reach 50% of SE^2 at only 2 of 10 targets (Validator's independent
    recomputation of the shares: 17.5, 47.0, -750.8, 1265.0, 41.7, -35.2, 55.7, -12.9,
    38.9, -37.8 percent). The Red Team measured the plain sample SE of each target's own
    8x4 Delta table: the rebuilt two-way SE is 0.36x to 1.37x it, median 1.05x, and
    SMALLER at 4 of 10 targets -- which is in tension with AM-7 clause (1) as worded
    ("the SE must contain the variance that dominates it") and is not reported. So the
    repair added essentially nothing to the SE's MAGNITUDE; the entire power loss comes
    from nu_eff (1.00 to 21.00, median ~3.5), which raises |t|crit from 2.783 at nu = 31
