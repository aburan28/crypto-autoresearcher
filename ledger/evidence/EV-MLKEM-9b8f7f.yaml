  validity_verification:
    expected_run_count: >-
      PASS. Three producer tasks, maximum_runs = 1 each, used 1 each. Section A scored
      all ten frozen candidates on L1..L12 with the transform triple, the q-ladder, the
      rank ladder and the collision probe; Section B scored exactly the declared family
