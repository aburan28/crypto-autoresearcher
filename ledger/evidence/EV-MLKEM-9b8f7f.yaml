  - >-
    OBS-B3 AND THE FROZEN SCORING, WHICH THE PRODUCER DISCLOSED AGAINST ITS OWN
    INTEREST. PRED-B1 is scored on the full table, which prereg 3.5 and 3.8 Form 3
