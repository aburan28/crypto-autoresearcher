    recover the components.
  - >-
    OBS-C4 THE UPPER BOUNDS, STATED AT THEIR DECLARED FLOORS AND WITH THE ONE THAT MUST
    NOT BE QUOTED BARE. Every negative here is an upper bound and never an absence. The
    frozen tightest detection floor is 3.91% relative -- but it occurs at
    d100_b40 / graded_t0.0025, THE SINGLE TARGET FLAGGED NEGATIVE-VARIANCE-COMPONENT,
    where MS_S + MS_P - MS_res <= 0 and the frozen degenerate branch replaces the
    two-way estimate with MS_res/(S*E) and nu_eff with the residual df 21. That
    substitute is precisely the residual-only variance model AM-7 exists to replace. The
    second-tightest floor at a NON-degenerate target is 10.83% (d100_b30 /
    graded_t0.0025). SO THE FAMILY-LEVEL UPPER BOUND OVER TARGETS WHOSE TWO-WAY SE IS
    WELL DEFINED IS ~10.8% RELATIVE, NOT 3.91%, and any citation of 3.91% must carry the
    qualifier. Six of ten pairs have floors at or above tau_rel and their only honest
