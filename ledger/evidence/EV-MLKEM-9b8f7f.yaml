  named_finding_disposition:
    finding: AM4-OBS-1 (EV-MLKEM-cd9878.named_finding)
    prior_statement: >-
      "Every observable proposed in GOAL-MLKEM-005 is a function of diag(QQ^T) in the
      standard basis, and no function of that diagonal can be AM-4-invariant."
    disposition: >-
      AM4-OBS-1 AS STATED IS NOT PROMOTED AND MUST NOT BE INHERITED. Its PREMISE half is
      REFUTED for D by this batch (OBS-A6); its apparent corroboration from six exact
      collision zeros is arithmetic and not evidence; and Validator F-4 shows the frozen
      trigger list for the refutation clause contained exactly the four candidates for
      which the premise is true BY ALGEBRA, so no probe of that design could have
      refuted it. Its CONCLUSION half survives and is SUBSUMED BY A STRONGER, CLEANER
      STATEMENT that does not need the diagonal premise at all: OBS-GEN -- any function f
      of the tail-beta frame projector P alone satisfying f(H^T P H) = f(P) for every
      orthogonal H is CONSTANT, equal to f(d, beta), because every rank-beta orthogonal
      projector in R^d is conjugate to every other by some orthogonal H. That is what is
      promoted, as a narrowed and corrected entry, in KN-FIND-f38a89, with the refutation
      of the premise recorded there as the entry's first content so the false half cannot
      propagate further.

  inference: >-
    THE BATCH RAN THREE FROZEN INSTRUMENTS CLEANLY AND ITS THREE HEADLINES ARE ALL
    PROPERTIES OF THEIR OWN DESIGNS -- and that, again, is a real outcome rather than a
    failed batch, because the designs are now measured rather than suspected.
    (1) SECTION A. The AM-4/AM-8 admissibility gate, which by AM-8 governs EVERY
    candidate observable in this goal, does not discriminate informative from
    uninformative observables: a parameter-determined null with zero dispersion across
    the frozen bases reaches R1 through it, nine of the ten frozen candidates were
    excluded from R1 by the pre-registration's own algebra before any datum existed,
    G-REL has no positive control and no error bar and is evaluated at one basis index,
    and its verdict on the single live candidate flips under a change of units. "R1 is
    empty" is a statement about a ten-item list; "the obstruction is relocated, not
    removed" is not supported and is not recorded. What IS supported is narrower and
    real: the six diag-determined observables are refused at 1-2 orders above the
    threshold and 13-14 orders above the noise floor; AM4-OBS-1's premise is refuted for
    D; and the R3 LABEL for hkz survives the Red Team's own replication, though for a
    reason the producer never gave -- the mirrored gap's mean is 3% of its own
    between-basis spread and its paired t is -0.064.
    (2) SECTION B. The repair is genuine and is the batch's cleanest positive: the
    argmax-SE_diff selection is removed rather than replaced, all 48 steps are reported,
    every firing sits on a positive post-injection Delta, and the whole table re-derives
    at deviation 0.0 from a different committed snapshot. But "the AM-3 gate CAN fire --
    29 of 48" is not a power statement: on an exact-null step the same count is 47 of 48,
    so the quantity FAILS TO DECAY when the violation is removed, which is the canonical
    artifact tell; and PRED-B1's falsifier was empty conditional on a reproduction check
    that passed bit-exactly. AM-3's power is undemonstrated for a second time, by a
    second and different route, and AM-3 is still not retired.
    (3) SECTION C. The verdict is invariant to the entire repair the section exists to
    perform -- the largest realized relative difference is 14.12% against a 15% floor, so
    condition (ii) fails at every target for any SE including zero -- so CONSISTENT
    carries no evidence and the L2 tail-sufficiency proposition stays OPEN IN BOTH
    DIRECTIONS. The section's real result is one the report does not contain and the Red
    Team found against its own thesis: split by condition, the rebuilt SE and its
    Satterthwaite nu_eff fire 5 times in 1200 exact-null replicates, 0.42% against a
    nominal 0.909% -- CALIBRATED, slightly conservatively. That is what AM-7 clause (2)
    asked for and it is the one thing Section C delivered.
    (4) CROSS-CUTTING. All three defects have the same shape as the eight this program has
    already recorded, and this pre-registration is the first to name both could-not-fail
    directions per section -- and it named the wrong pair three times out of three. The
    generalisable lesson is not about lattices: A CONTROL MUST BE DENOMINATED IN
    SOMETHING OTHER THAN THE QUANTITY UNDER REPAIR, AND EVERY HEADLINE COUNT MUST BE
    QUOTED AGAINST THE SAME COUNT ON A NULL OBJECT OF THE SAME SHAPE. Both reviews
    audited their own could-not-fail arrangements and the Red Team's fired twice,
    reporting against its own thesis both times; that is why these adverse readings are
    credited here rather than discounted. Every defect either review demonstrated had
    already been named by a producer and under-weighted -- including by me, whose receipt
    repeated a producer's self-reported git defect as fact when the Validator has now
    proved the producer was wrong about itself in its own disfavour.

  boundaries:
  - >-
    CLAIM TIER TOY, UNCONDITIONALLY. Nothing in this record bears on ML-KEM security, on
    any FIPS 203 parameter set, on any attack cost, or on any cost model. d <= 140,
    beta <= 95, q <= 3329, n = 8, S = 8, E = 4, N = 2^20, the 2^-10 quantile only, HKZ
    only at d <= 40.
  - >-
    NO HYPOTHESIS STATUS MOVES AND NONE IS PROPOSED. This record names no hypothesis. The
    batch measured instruments.
  - >-
    "THE OBSTRUCTION IS RELOCATED, NOT REMOVED" IS NOT A RESULT OF THIS BATCH AND IS NOT
    RECORDED AS ONE. Neither is "R1 is empty" as a statement about lattices. R2 and R2'
    were never reached, so no "no admissible predicate exists at the declared scope"
    claim may be cited from this run in any form.
  - >-
    "THE AM-3 GATE CAN FIRE AT 29 OF 48" MAY ONLY BE QUOTED WITH ITS NULL VALUE OF 47 OF
    48 IN THE SAME SENTENCE. It is not a power demonstration, it does not rescore
    BATCH-a44d08, it reinstates no withheld reading, and it does not retire AM-3.
  - >-
    "CONSISTENT" IS NOT A RESULT OF THIS BATCH IN EITHER DIRECTION. Neither "L2 tail
    sufficiency falsified" nor "consistent" may be cited from this goal. The variance-level
    identity is correct and untouched; only the tail-level question is open.
  - >-
    EVERY NEGATIVE IS AN UPPER BOUND AT A DECLARED FLOOR, NEVER AN ABSENCE. Section A's
    invariance passes at rho_max as printed per candidate against tau_inv = 0.01 at
    n = 8 bases and 8 replicates, and its sensitivity non-passes at the printed fraction
    of scale against tau_q = 0.10; Section B's 0-of-48 negative controls at their
    declared c grid; Section C's per-pair floors of 3.91% to 45.62% relative at S = 8,
    E = 4, N = 2^20 -- with the 3.91% figure valid only with its
    NEGATIVE-VARIANCE-COMPONENT qualifier and the non-degenerate family bound at ~10.8%.
  - >-
    THE T2 AND T3 INVARIANCE RESIDUALS, D'S COLLISION SEPARATION, THE hkz G-REL VALUES,
    AND SECTION C'S TEN TARGET D-TABLES ARE SINGLE-SOURCE. The Validator states that any
    successor citing the CONSISTENT verdict must cite it as resting on one run, and the
    same applies to the other three.
  - >-
    lam1n AND hkz PASS AM-4 ON THE BASIS-CHANGE SUBGROUP {T2, T3} ONLY. The ambient
    isometry clause is structurally untestable in the integer-Gram pipeline that computes
    them, since G(BH) = BB^T identically. rdet passes all three by algebra and is
    parameter-determined. No candidate on the frozen list has been shown to be both
    isometry-class invariant and informative.
  - >-
    THE X_null, EXACT-NULL-STEP AND UNITS-MUTATION CONSTRUCTIONS ARE REVIEW MEASUREMENTS
    AND RE-EXECUTABLE PROBES, NOT PRE-REGISTERED PRODUCER RESULTS. They are cited as
    grounds and as counterexample instances, never as a rescoring of any frozen verdict,
    and no party independent of the Red Team has re-executed them.
  - >-
    INDEPENDENCE IS PROCEDURAL -- separate sessions, no shared scratch, snapshot before
    review, roles distinct from the producers -- AND NEVER MODEL-LEVEL. Both reviews
    record model_verified: false with the reason: per-role model and effort selection is
    process-level under this runtime, subagents keep model: inherit, the xhigh tier
    cannot be probed from inside a subagent, and no adapter probe receipt exists.
    AGENTS.md rule 12 is UNMET AND UNWAIVED in this goal.
  - >-
    NO LLL, BKZ OR NEW REDUCTION WAS RUN BY EITHER REVIEW BEYOND THE VALIDATOR'S HKZ
    CROSS-CHECK AT d <= 40. The Red Team's Section B and C probes are arithmetic on the
    producers' committed numbers and generated no error pool, which it states itself: a
    defect living in the GENERATION of those numbers rather than in their use would be
    invisible to it.

