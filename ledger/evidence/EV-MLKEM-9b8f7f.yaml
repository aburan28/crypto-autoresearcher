    difference to exceed tau_rel; the producer recorded it in prose anyway, which is the
    right call, and the frozen "n_suggestive = 0" is a consequence of the floor rather
    than of the data.
  - >-
    OBS-C5 tau_rel = 0.15 IS 6x ITS OWN DESIGN RULE AGAINST THE INSTRUMENT IT NOW
    GOVERNS. Prereg 4.4 sets it as "1.67x the top of the measured null median range
