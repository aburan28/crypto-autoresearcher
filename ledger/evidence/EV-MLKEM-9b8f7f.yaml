    rebuild: max|diag(P1)-diag(P2)| = 0.0, off-diagonal separation 0.433013, rank 40/40)
    and separates X4 = D by 0.15837 of scale at L3 and 0.03447 at L4, above D's own
    pooled-SE floors of 0.021137 and 0.026745 by 7.5x and 1.29x. The receipt quoted only
