evidence:
  id: EV-RELN-cc045d
  hypothesis_id: H-RELN-10ad6b
  experiment_ids: [EXP-RELN-82f487]
  run_ids:
    - RUN-RELN-82f487-stage0
    - RUN-RELN-82f487-N14-sigma8-seed1
  type: empirical
  direction: neutral
  strength: inconclusive
  claim_tier: toy
  certificate_refs: []
  proof_status: empirical_only
  proof_refs: []
  observations:
    - >-
      Stage 0 static leak audit ran against the real feature/model source
      and passed cleanly; a deliberately planted discrete-log feature
      (the audit's own required negative control) was correctly REJECTED,
      confirming the audit is not broken.
    - >-
      One measurement cell (rung N ~ 2^14, curve_seed 101, base_seed 201,
      training_seed 301, sigma = 1/8, all five geometry arms, both model
      classes [inductive GNN, gradient-boosted trees], both feature
      regimes [F0, F1]) ran to completion. Reproduction fixtures were
      exact: closed-form total-check deviation 0 in every arm; sigma=1
      slice gave lambda = rho = 1.0 exactly in every arm.
    - >-
      The Z/N-interval positive control PASSED for every class and
      regime: lambda = rho = 7.996 against the ceiling 8.0 and the
      half-ceiling threshold 4.0.
    - >-
      The label-permutation null and the E/log-interval canary showed no
      leak (no permuted-label or canary lift above band in any cell).
    - >-
      The E/random-matched and Z/N-random arms DISAGREED beyond their
      tolerance band for feature regime F1, model class gnn (rho
      difference 0.079 against a tolerance half-width of 0.064); every
      other class/regime combination (F0/gnn, F0/trees, F1/trees) agreed
      within band (differences 0.030, 0.002, 0.002 respectively).
    - >-
      Under H-RELN-10ad6b's own frozen decision tree this F1/gnn
      disagreement is one of the contract's explicit BLOCKING stopping
      rules ("Stop the run if E/random and Z/N-random disagree beyond
      band at any rung [pipeline fault]"). Independently, one rung alone
      can never fit the contract's required >=2-rung log-log decay slope,
      so no branch classification (predicted/decaying vs refuting/alive)
      is reachable from this cell regardless of the pipeline-fault gate.
    - >-
      Within-band, exploratory-only numbers (not gating anything, reported
      because the contract requires every measured quantity be recorded):
      E/x-interval excess of rho/lambda over the selection null at this
      one rung ranged from -0.004 to +0.056 across class/regime
      combinations, all inside band; the GNN-minus-trees difference on
      E/x-interval was +0.036 (F0) and -0.022 (F1), both inside band, with
      no replication across curves/seeds possible from a single cell.
  inference: >-
    NO SCIENTIFIC READING IS OFFERED. A pipeline-fault stopping rule fired
    exactly as the frozen contract defines it, and the contract's own
    decision_paths.inconclusive names this outcome precisely
    ("uninformative class, leak halt, PIPELINE FAULT, underpowered slope
    ... retain the hypothesis at its current status"). No inference about
    H-RELN-10ad6b, about GNN-vs-tree structure, or about representation-
    decidable clustering is drawn from this run.
  boundaries:
    - >-
      Toy scale, one rung (N ~ 2^14), one curve, one base seed, one
      training seed, sigma = 1/8 only. The contract's full design (3
      curves x 3 base seeds x 3 training seeds x 2 sigma x 5 rungs) is
      almost entirely not_run: sigma = 1/32, curves/base seeds/training
      seeds 2-3, and rungs 2^16/2^18/2^20/2^24 are all named as not_run,
      not silently omitted.
    - >-
      Implementation deviations recorded in
      experiments/EXP-RELN-82f487/runs/implementation.md: no torch,
      scikit-learn, xgboost, or lightgbm were installed in the execution
      environment, so the K=3 message-passing GNN and the gradient-
      boosted-tree baseline are both hand-written and gradient-checked
      implementations, not the named library defaults; the cost-
      instrumentation measurement (c_f) used a placeholder linear-probe
      inference proxy rather than the trained models' own forward pass,
      and is flagged as such (it gates no pass/fail decision here); the
      INV-6 theorem-arm indicator was computed analytically.
  unresolved_confounds:
    - >-
      Whether the F1/gnn E/random-vs-Z/N-random disagreement is a genuine
      pipeline defect (a feature or sampler bug specific to feature regime
      F1 combined with the hand-written GNN), a statistical fluctuation at
      this single seed, or an artifact of the hand-written model
      substitution noted above is NOT determined by this run. A repeat of
      this exact cell at a second base seed / training seed, or an audit
      of the F1 feature construction and the E/random and Z/N-random
      samplers specifically, would discriminate between these before any
      further cell is trusted.
  obstruction: null
  reviewed_by: coordinator
