  # ======================================================================
  obstruction:
    statement: >-
      A CONTROL SUITE BUILT FROM PLANTED POSITIVES AND UNIFORM-RANDOM NEGATIVES
      HAS NO POWER AGAINST THE DELETION OF A CANONICAL-KEY COMPONENT THAT ITS
      NEGATIVES ARE NOT CONSTRUCTED TO PROBE. This is a property of the OBJECT --
      an exact-key-equality adjudicator whose acceptance region is a single point
      in every retained component and unbounded in every dropped one -- and not a
      property of the attempt. Because a uniform draw is separated by whichever
      retained component it is furthest from, the suite's power collapses onto
      that one component; the remaining components are untested and their
      deletion is invisible. For this adjudicator's key, three of five
      single-component deletions -- message_difference, in_linearized_code, and
      both together -- change no control outcome whatsoever.
    quantity: >-
      Number of single-component canonical-key ablations that the declared
      BATCH-f8bf86 control suite (CTL-PLANT recall over 96 attempts, plus
      CTL-NULL strict false positives over 3000 draws in three declared families)
      detects, out of the five ablations tested
    value: >-
      2 of 5 ablations detected. Per row, as (CTL-PLANT recall, CTL-NULL strict
      false positives of 3000): HONEST (96/96, 0); message_difference deleted
      (96/96, 0) NOT DETECTED; step_delta deleted (96/96, 6) DETECTED;
      in_linearized_code deleted (96/96, 0) NOT DETECTED; message_difference and
      in_linearized_code both deleted (96/96, 0) NOT DETECTED; everything but
      primitive and length deleted (96/96, 3000) DETECTED. Units: integer counts
      of adjudications, dimensionless. ERROR BARS: NONE, AND THE REASON IS STATED
      RATHER THAN OMITTED -- the measurement is fully deterministic at the
      declared seeds (census 84064101/84064102; null families
      84064103/84064104/84064105; 1000 draws per family), so repetition at the
      same seeds carries no variance. THE SAMPLING VARIABILITY THAT WOULD MATTER
      IS ACROSS SEEDS AND ACROSS ABLATION CHOICES, AND IT IS UNMEASURED: five
      ablations were tried, not the full 2**k lattice of component subsets, and
      one seed set was used, not many. The honest reading of "2 of 5" is
      therefore a point estimate over a hand-chosen five-element sample, not a
      rate with a confidence interval.
    measured_by:
      - EXP-DIFFP-fe894e
    measured_by_note: >-
      NO RUN-* IDENTIFIER EXISTS FOR THIS MEASUREMENT AND NONE IS INVENTED. The
      ablation battery was executed by TASK-20260824-3bd362 as review-side
      computation against the snapshot-bound source at
      35c2159eee566f05c176e79ddfe7f1a2642d604e, using the contract's declared
      seeds; it created no run directory and consumed no ceiling of
      EXP-DIFFP-fe894e. EXP-DIFFP-fe894e is named above because it is the
      contract whose seeds, census and control definitions the battery reused and
      the only registered identifier this measurement can honestly be attached
      to. The measurement itself is read from
      coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/reviews/TASK-20260824-3bd362/red-team-report.yaml,
      joint J5 part_D. See unresolved_confound UC-2.
    scope: >-
      The BATCH-f8bf86 adjudicator at the committed source
      35c2159eee566f05c176e79ddfe7f1a2642d604e; the 16-entry synthetic shadow
      census built at seeds 84064101 (MD5) and 84064102 (SHA-1), 8 entries each,
      every MD5 entry carrying a weight-1 message difference and every entry at
      full step range; strict generator set {E1,E3,E4,E5} and permissive
      {E1..E6}; the three declared null families at 1000 draws each; and the five
      named key-component ablations. CLAIMED NOWHERE ELSE: not for a census
      containing any real published path, not for any other null design, not for
      any other adjudicator, and not as a general theorem about control suites.
    resource_check:
      examined: true
      reading: >-
        YES, AND THE REVERSAL IS THE MOST USEFUL THING IN THIS RECORD. Read the
        other way round, the obstruction says that a control suite's power
        FACTORISES PER KEY COMPONENT, and a factorisation is something you can
        measure. That is exactly what the ablation battery is: delete one
        component, re-run the identical suite, and the suite's response IS the
        per-component power profile. The theory that takes this measurement as an
        asset is therefore: "CONTROL POWER IS A MEASURABLE, PER-COMPONENT
        QUANTITY, AND A CONTROL SUITE SHOULD REPORT WHICH ABLATIONS IT DETECTS
        RATHER THAN THAT IT PASSED." Under that theory the 2-of-5 figure is not a
        defect report, it is the first measurement of a quantity this program has
        never measured for any instrument it has built.
        A SECOND, NARROWER RESOURCE: the Red Team measured that the declared
        null's false-positive probability FACTORS -- family (a) reaches a planted
        message difference with probability 1/64 per draw and did so 6 times in
        1000, and then dies on the 64-word step_delta. The factorisation names,
        for free, where a stronger null must aim: hold the reachable factor fixed
        and perturb the unreachable one. CTL-NULL family (d)
        `message_difference_perturbed` is precisely that construction, and its
        first draw separates the honest adjudicator from the delta_m-blind one.
        The obstruction is what tells you the family exists.
        A THIRD, CROSS-GOAL: GOAL-SHA1-001 asks what a deployed collision
        DETECTOR covers over the disturbance-vector class. That is structurally
        the same question as "which component of a predicate carries its
        verdicts", and the ablation battery is a method for answering it. It is
        OFFERED with its scope attached, not asserted; this goal states no
        detector-coverage conclusion.
