      EVERY NUMBER HERE IS ABOUT A 16-ENTRY SYNTHETIC SHADOW CENSUS. The readable
      census has ZERO entries for both primitives. The transfer assumption --
      that an adjudicator correct on planted paths and null draws is also correct
      on published paths -- IS NOT ASSUMED, IS NOT CLAIMED, and the producer
      declined it first. Adjudicator correctness against a published
      characteristic remains UNTESTED.
    - >-
      Scoped to: MD5 (RFC 1321) and SHA-1 (FIPS 180-4) path objects as this
      package defines them; the declared generator set {E1..E6} with strict
      {E1,E3,E4,E5} and permissive all six; seeds 20260824, 84064101, 84064102,
      84064103, 84064104, 84064105, 84064106; 1000 draws per null family; 1024
      CTL-OBS objects; 4096 draws per E6 step range; the committed source at
      35c2159eee566f05c176e79ddfe7f1a2642d604e; and 80.748 s of wrapper-measured
      compute across six runs inside 960 s of ceilings. No conclusion is claimed
      at any other parameter, seed, generator set or scale.
    - >-
      All 8 planted MD5 entries carry a WEIGHT-1 message difference, which no
      real MD5 collision characteristic has. The null's matched-weight design
      therefore matches a weight no real candidate carries, and EVERY REPORTED
      DISTANCE INHERITS THAT. This is not a defect in a shadow census whose job
      is to make a false positive possible; it is a hard limit on how far any
      figure here transfers, and no batch-1 artifact stated it.
    - >-
