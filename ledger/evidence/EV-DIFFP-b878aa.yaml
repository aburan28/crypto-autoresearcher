    the tree, six declared runs and no undeclared one, seven declared seeds and
    no eighth, 48/48 exact agreement in cold re-runs by an independent session.
    (2) TWO SUMMARY TRANSCRIPTION DEFECTS EXIST, BOTH IN THE SAME DIRECTION, AND
    ONE PROPAGATED TWO HOPS INTO COORDINATOR ARTIFACTS BEFORE ANYONE RECOMPUTED
    IT. Neither changes any verdict. Their concrete cost is the propagation, and
    the lesson is that a Coordinator who quotes a producer scalar rather than
    recomputing it is manufacturing a second-hand measurement.
    (3) THE MEASURED ZERO IS A MEASUREMENT, for the first time. The scanner fires
    on a seeded positive across five predicates and three schemas and correctly
    declines a mentions-only decoy; the corpus arithmetic reproduces from an
    independent enumeration. P-1 is confirmed as literally stated and is scoped
    to five textual schemas, five suffixes and two roots -- not to "the corpus".
    (4) THE ADJUDICATOR IS NOT SHOWN TO BE WRONG. On every object for which a
    known answer could be constructed -- four E2 rotations, two E6 reindexings,
    the E4 boundary object on both sides, a SHA-0 codeword, a family-(b) draw and
    its MEMBER-reachable perturbation, a family-(c) draw, and eleven of fifteen
    one-bit mutants -- it gave that answer. Three of those answers are two-sided,
    which a degenerate adjudicator cannot produce. THIS IS A REAL POSITIVE
    FINDING AND THE COMPOSITION DOES NOT LOSE IT UNDER THE BREAKS BELOW.
    (5) AND THE CONTROL SUITE DOES NOT ESTABLISH THAT IT DISCRIMINATES. An
    adjudicator whose canonical key cannot see the message difference at all
    scores CTL-PLANT 96/96 and CTL-NULL 0/3000 -- the same two integers, to the
