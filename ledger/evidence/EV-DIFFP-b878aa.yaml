evidence:
  id: EV-DIFFP-b878aa
  title: >-
    BATCH-f8bf86 round 1, composed: the adjudicator package is artifact-sound
    and reproduces exactly, and gives the correct answer on every object with a
    constructible known answer -- and its declared control suite is measured to
    detect 2 of 5 single-component key ablations, so 96/96 and 0/3000 do not
    establish that the instrument discriminates
  goal_id: GOAL-DIFFP-84d641
  question_id: RQ-DIFFP-a5c483
  batch_id: BATCH-f8bf86
  experiment_ids: [EXP-DIFFP-fe894e]

  hypothesis_id: null
  hypothesis_id_note: >-
    NULL DELIBERATELY, AND THE ABSENCE IS THE HONEST STATE. GOAL-DIFFP-84d641
    carries `active_hypothesis_ids: []`: batch 1 builds an INSTRUMENT and its
    controls, and asserts nothing about MD5's or SHA-1's difference space. Naming
    a hypothesis here would invite exactly the inference this record forbids --
    that a control outcome on a 16-entry synthetic shadow census bears on a
    published characteristic. It does not, and no hypothesis of this program is
    supported, weakened or contradicted by anything below. What IS weakened is a
    reading of the batch's own deliverable against GOAL-DIFFP-84d641 completion
    criterion 1; see `direction` and `obstruction`.

  run_ids: []
  run_ids_note: >-
    EMPTY FOR A STRUCTURAL REASON, NOT BECAUSE NO RUNS EXIST. The six charged
    runs -- RUN-DIFFP-fe894e-buildcheck, -equivalence-verification, -census-build,
    -controls, -observation-collision, -nearby-object -- live under
    coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/tasks/TASK-20260824-c6625a/runs/,
    which is outside tools/validate_ledger.py's run index
    (experiments/*/runs/*/manifest.yaml), so naming them here would be an
    unresolvable reference. The EV-MDFIVE-f3e1ca / EV-MDFIVE-7ef481 precedent on
    GOAL-MD5-001 uses `run_ids: []` for the same reason. The run IDs are cited in
    the observations below, where this record's support actually lives.
    A SECOND AND SHARPER POINT, STATED HERE RATHER THAN BURIED: the observations
    that carry this record's load-bearing finding (O-7, O-5, O-9, O-10, O-11)
    were NOT produced by any of those six runs. They were produced by review-side
    computation in TASK-20260824-c40847 and TASK-20260824-3bd362 against the
    snapshot-bound source at 35c2159eee566f05c176e79ddfe7f1a2642d604e -- no run
    directory, no RUN-* identifier, no manifest, no armed deadline, no seed
    envelope. They are read from committed review reports, not from charged runs.
    See `unresolved_confounds` UC-2.

  type: empirical
  direction: weakens
  direction_scope: >-
    WEAKENS EXACTLY ONE PROPOSITION AND NOTHING WIDER: that BATCH-f8bf86's
    controls, as declared, validate the adjudicator as an instrument, and
    therefore that the batch satisfies GOAL-DIFFP-84d641 completion criterion 1
    ("a verifier that ... passes BOTH controls -- planted-positive recall of 100%
    over every planted entry AND EVERY IMAGE OF IT UNDER EVERY VERIFIED
    GENERATOR, and zero false positives on the declared random-negative null").
    Measured: two of the four verified generators emit no orbit image at all
    (O-6), so the recall clause is not met as its own words state it; and the
    null has no power against deletion of three of five key components (O-7), so
    the zero-false-positive clause does not license the conclusion the criterion
    draws from it.
    IT WEAKENS NOTHING ABOUT MD5 OR SHA-1. No statement about either primitive's
    difference space, about any published characteristic, or about novelty is
    weakened, strengthened or made, because none was tested.

  strength: preliminary
  strength_note: >-
    TWO DIFFERENT STRENGTHS ARE PRESENT AND COLLAPSING THEM WOULD BE THE
    DISHONESTY. (a) THE ARITHMETIC IS REPLICATED: every integer in the producer's
    six charged runs was re-derived in a fresh process by an independent session
    at 48/48 exact agreement, and the artifact hashes were re-measured at 34/34
    and 148/148 (O-1, O-3). On the arithmetic alone the tier would be
    `replicated`. (b) THE LOAD-BEARING INSTRUMENT FINDINGS ARE SINGLE-SESSION AND
    UNREPLICATED: the ablation battery (O-7), the one-bit-mutation failures
    (O-5), the decoy set and the distance/verdict decoupling (O-9, O-10, O-11)
    were each measured once, by one reviewer, in one session, without a run
    record. `preliminary` is the tier of the finding this record is FOR, so it is
    the tier this record carries. This is also why the closing decision is
    `weaken` and not `reject_scoped`: docs/claims-and-verification.md forbids
    `reject_scoped` on a single unreplicated empirical-only basis, and the
    replication that would raise this tier is named in the decision's next action.

  claim_tier: toy
  claim_tier_note: >-
    `toy` is the program's smallest descriptive scale label and is applied here
    with its mapping stated rather than assumed. docs/claims-and-verification.md
    derives the tier mechanically from field bit size, which has no meaning for a
    hash differential adjudicator; the tested scale that the label stands for is:
    16 synthetic planted shadow-census entries (8 MD5, 8 SHA-1), 0 readable
    census entries, 3000 null draws over three declared families, 1024
    observation-collision objects, 4096 draws per E6 step range, and 2000
    CTL-NEARBY codewords -- all synthetic, all generated from seven declared
    seeds under this program's control. NOTHING AT CRYPTOGRAPHIC SCALE WAS
    TESTED, no published characteristic entered any measurement, and no figure
    here transfers to one.

  certificate_refs: []
  certificate_refs_note: >-
    NONE, AND THAT IS CORRECT RATHER THAN MISSING. No solve, collision, relation
    or conforming-pair claim is made by this record or by the package it reviews;
    EXP-DIFFP-fe894e IR-8 forbade any search over the difference space and none
    was run. Every certificate field in all six charged runs' raw-result.json is
    kind `none`, and harness.semaev's stub RAISES rather than returning a passing
    verification (validation-report joint_J2 checklist f). A certificate_refs
    entry here would assert a claim tier this batch does not reach.

  proof_status: derivation
  proof_refs:
    - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/reviews/TASK-20260824-3bd362/red-team-report.yaml
    - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/reviews/TASK-20260824-c40847/validation-report.yaml
  proof_status_reasoning: >-
    THE STRONGEST CHECKABLE REFUTATION ARTIFACT THIS RESULT ADMITS, SOUGHT BEFORE
    THE ADVERSE TRANSITION AND ARCHIVED BEFORE THE DECISION THAT RELIES ON IT
    (docs/claims-and-verification.md, "Refutation artifacts"; both reports are
    committed and fixed at 2dc4d1328e7804ab2494fec8d45f9c16aba53ff3, which is the
    parent of the decision commit).
    WHY NOT `certificate`: a counterexample certificate must be packaged so
    independent code re-checks it. The refuting objects here -- the delta_m-blind
    adjudicator O5, the D3b one-bit message-difference perturbation, the VD-3 and
    VD-4 one-bit mutants -- are stated with their exact constructions and their
    measured verdicts, but no certificate artifact was emitted, no run record
    binds them, and no independent re-verifier consumes them. Calling them a
    certificate would overstate the packaging.
    WHY NOT `empirical_only`: this is not a bare contradiction between a
    prediction and observations. The mechanism is isolated and stated as a
    checkable argument: membership is exact canonical-key equality
    (Adjudicator._index dict lookup, not a threshold), so the acceptance region
    is a single point in every retained key component and unbounded in every
    dropped one; the declared null draws uniformly in directions the key already
    separates on step_delta, so no declared draw is ever constructed to agree
    with a census entry EVERYWHERE EXCEPT the message difference; therefore
    deleting the message difference from the key changes no control outcome. That
    argument is checkable step by step by an independent reader against the
    committed source, and the ablation battery is its measured instance.
    `derivation` is exactly the middle rung and is the honest one. It is a
    checkable argument about THIS instrument at THESE parameters, not a
    machine-verified proof and not a general theorem about controls.

  # ======================================================================
  # WHAT THIS RECORD RESTS ON, AND THE VALIDITY CHECK RUN BEFORE INTERPRETING IT
  # ======================================================================
  validity_check_before_interpretation:
    performed_by: TASK-20260824-b03556 (this record's author), by reading committed artifacts
    expected_run_count: >-
      SIX, AND SIX EXIST. run-index.json lists exactly the six declared runs;
      TASK-20260824-c40847 confirmed by `git ls-tree -r` at the snapshot commit
      that exactly six directories and 42 files (6 x 7) exist under runs/, with
      no undeclared run directory anywhere in the task tree.
    manifest_schema_completeness: >-
      CONFIRMED BY THE VALIDATOR, NOT BY THIS SESSION. Each of the six manifests
      carries the LITERAL string EXP-DIFFP-fe894e at both run.experiment_id and
      run.inputs.parameters.experiment_id, carries code_path_fingerprint, and
      carries armed_deadline_seconds; every directory holds all seven declared
      files with no missing and no extra file.
    seed_integrity: >-
      CONFIRMED. All six manifests carry the identical seven-key seeds dict,
      byte-equal to the frozen contract's, with no eighth key; each run's
      run.inputs.seed is one of the seven. Cold re-runs at those seeds reproduced
      every integer, which is the operational evidence that no unseeded
      randomness reached a reported number.
    raw_versus_summary_agreement: >-
      CHECKED MECHANICALLY AND IT IS THE ONE PLACE THE PACKAGE FAILS. 89 fields
      compared by script: 87 agree exactly, 2 are genuine defects (O-2). Both
      defects are in summary scalars that no downstream artifact recomputes, and
      both state a LARGER number than the raw. Neither changes a verdict.
    control_comparability: >-
      CONFIRMED IN THE CONTRACT'S SENSE AND REFUTED IN THE SENSE THAT MATTERS.
      CTL-NULL ran against a census containing 16 plantable entries a draw could
      have matched (`vacuous: false`), which is IR-4's requirement. That is a
      strictly weaker property than having a nonzero achievable false-positive
      probability, and O-7/O-8 measure the stronger property and find it largely
      absent.
    ruling: >-
      THE RUN SET IS VALID AND IS EVIDENCE. It is not an invalid or incomplete
      run set going back to the Executor: nothing failed, nothing timed out,
      nothing crashed, no measurement basis is in doubt, and the two defects are
      transcription errors in a summary whose raw sources are correct and
      committed. This record therefore interprets it, and the interpretation is
      about the CONTROLS' POWER, not about the Executor's competence -- the
      producer stated most of its own limits unprompted and composed no verdict,
      which is the correct behaviour and is recorded here as such.

  # ======================================================================
  # OBSERVATIONS -- INTEGERS, WITH THE ARTIFACT EACH IS READ FROM
  # ======================================================================
  observations:
    - id: O-1
      what: >-
        The reported integers are what the committed code produces from the
        declared seeds. A cold re-run in a fresh process by an independent
        session agrees EXACTLY on 48 of 48 re-derived integers: 24/24 on the
        equivalence checks (E1 704/0, E2 2048/248 with the 2048-0 expansion and
        0-248 step-function split, E3 128/0, E4 4368/0 with its 4096/256/16
        sub-counts, E5 256/0, E6 17/1) and 24/24 on the controls (CTL-PLANT
        96/96, CTL-NULL 0/1000 strict and 0/1000 permissive in each of three
        families, CTL-OBS 1024/1024/0 and 80/0, CTL-NEARBY 0/1000 and 1000/1000).
      source: validation-report joint_J1 part_1 and part_2
      verdict_effect: none; no generator verdict, control count or census count changes
    - id: O-2
      what: >-
        TWO SUMMARY-VERSUS-RAW DEFECTS, out of 89 fields mechanically compared;
        87 agree exactly. VD-1: execution-report.yaml states the E6 step_range
        (0,0) conditions_satisfied count as 2094 at lines 177, 184 and 623; the
        raw artifacts (equivalence-declaration.yaml line 116, raw-observations.json
        line 873, runs/RUN-DIFFP-fe894e-equivalence-verification/raw-result.json
        line 124) and an independent cold re-run at seed 20260824 all give 2089.
        VD-2: execution-report.yaml line 367 states ctl_quar.bytes_hashed as 5583;
        raw-observations.json line 108, runs/RUN-DIFFP-fe894e-buildcheck/raw-result.json
        line 125 and stdout.log line 5 all give 3103, an independent byte-wise
        re-hash by TASK-20260824-c40847 measures 3103 with os.path.getsize
        agreeing, and an independent driving-session `stat` measures 3103.
      the_digest_is_correct: >-
        e44a3fed81e9e7621697432b2124b357fc2c3f502f4bc6779df5c377b0a3e3c5 matches
        the contract's expected digest and the payload is unchanged. Only the byte
        count is wrong -- and the summary's own pair is internally inconsistent,
        because a 5583-byte file cannot have that digest.
      verdict_effect: >-
        NONE for any verdict. E6 remains EXCLUDED because step_range (0,3) is
        vacuous (0 of 4096) and the gate is the conjunction of the two ranges;
        (0,0) is non-vacuous at 2089 exactly as it is at 2094. CTL-QUAR's
        criterion -- a byte-wise hash matching the expected digest without
        parsing -- is met.
      propagation: >-
        VD-2's 5583 PROPAGATED TWO HOPS INTO COORDINATOR ARTIFACTS before anyone
        recomputed it: the snapshot receipt's open gate G5 restates "a byte-wise
        match at 5583 bytes", and the review plan's own J4 attack step (3)
        instructs the Validator to compare "at 5583 bytes". Both are immutable
        and are superseded by reference, never edited; see the closing decision's
        `defective_integer_supersession`.
      source: validation-report joint_J1 part_3, joint_J4 part_3
    - id: O-3
      what: >-
        Artifact integrity: the code that produced the numbers is the code under
        review. All 34 snapshot-receipt path_sha256 values recomputed and matched
        at the snapshot commit 35c2159ee (34/34), at the receipt's declared
        commit 4b85c67aa (34/34), and against the working tree (34/34). For every
        one of the six manifests, every file in run.code.source.files and every
        module in code_path_fingerprint.module_sha256 recomputed from the tree:
        148 comparisons, 148 matches, 0 mismatches -- covering all ten
        harness/diffpath sibling modules plus harness/__init__.py and
        harness/runner.py.
      source: validation-report joint_J2, artifact_checks
      note: >-
        This is what closes the snapshot receipt's open gate G1 and the disclosure
        gap the receipt left over the ten sibling modules and the 42 run files:
        the gap is closed BY MEASUREMENT IN REVIEW, not by receipt binding. See
        the closing decision's `snapshot_receipt_gate_status`.
    - id: O-4
      what: >-
        THE MEASURED ZERO IS A MEASUREMENT, established by the first positive
        control ever run on this scanner. All 5 PATH_DATA_RE predicates fire on
        minimal synthetic instances. End-to-end against a reviewer-constructed
        temporary root: 5 files seen, 5 read, 4 candidates, 3 carrying path data
        -- all three planted positives detected across three schemas and two
        suffixes, a mentions-only decoy correctly classified as a candidate
        carrying NO path data, an unrelated file correctly not a candidate, and a
        decoy under the quarantine prefix not scanned at all. An independent
        os.walk with re-typed predicates over the real corpus agrees 4/4 with the
        producer: 9337 files, 0 unreadable, 6 candidates, 0 carrying path data,
        and the six candidates are exactly the six the report names.
      source: validation-report joint_J4 part_1 and part_2
      scope_that_survives: >-
        The zero is scoped to "zero files under knowledge/ and inputs/ with the
        five declared suffixes carry path data in these five machine-readable
        textual forms". It is NOT "the corpus contains no path data": a LaTeX
        table, a PDF, a binary or CSV blob, another suffix or another root would
        not have been seen.
    - id: O-5
      what: >-
        CTL-PLANT CANNOT ALWAYS BE MADE TO FAIL BY A ONE-BIT CHANGE. Of 15
        one-bit mutants constructed, 11 correctly adjudicate NON-MEMBER and 4
        adjudicate MEMBER anyway. VD-3 (strict, 2 mutants): for any SHA-1 object
        whose step_range does not start at 0, EQ.align_E1 DISCARDS the declared
        dv and recomputes it from dv_seed_window, so the mutated message
        difference is overwritten before serialize() sees it; 64 of CTL-PLANT's
        96 attempts are SHA-1 E1 images with step_start in 1..8, so for all 64
        the strict key does not read the candidate's own declared DV. VD-4
        (permissive, SHA-1 only, 2 mutants): act_E2_rotate at b=0 rebuilds
        step_delta from the untouched step_delta_signed, erasing a step_delta
        mutation. Strict is unaffected by VD-4 and MD5 is unaffected by both.
      honest_limit: >-
        BOTH MUTANTS ARE MALFORMED OBJECTS -- objects whose redundant fields
        contradict each other. No two WELL-FORMED distinct path objects were
        exhibited that the canonicaliser identifies on this axis. What is
        exhibited is that the instrument silently normalises a contradiction
        between two fields of a candidate instead of rejecting or flagging it,
        and no artifact of this batch tells a reader that.
      source: validation-report joint_J3 part_2 (VD-3, VD-4)
    - id: O-6
      what: >-
        HALF THE STRICT GROUP DOES NO OBSERVABLE WORK. Measured by calling
        orbit_images with each generator alone: {E3} emits 1 image per object;
        {E1} emits 8 per SHA-1 object and 0 per MD5 object; {E4} emits 0; {E5}
        emits 0; {E4,E5} together emit 0. CTL-PLANT's 96 attempts decompose
        exactly as 16 planted + 8x1 MD5 images + 8x9 SHA-1 images, exercising
        only E1 and E3. Further: E5 can affect NO membership verdict at all --
        the condition set is not in the key (producer PD-5) and `"E5" in gens` is
        read in exactly one place, adjudicator.py line 210, which selects the
        REPORTED condition signature and is unreachable from serialize() or
        canonical(). E4's only effect on the key is REMOVAL of
        signed_representation, so it can only loosen membership, never test it.
      consequence: >-
        The strict group is nominally {E1,E3,E4,E5}; the group that does
        observable work on a membership decision is {E1,E3} plus one key-component
        deletion. Every covering number this goal ever reports inherits that, and
        no artifact of this batch states it.
      source: validation-report joint_J3 part_3; red-team-report blind_rederivation, OBJ-6
    - id: O-7
      what: >-
        THE LOAD-BEARING OBSERVATION. The identical control suite was run against
        adjudicators with one canonical-key component deleted, at the declared
        seeds. HONEST (unmodified): CTL-PLANT 96/96, CTL-NULL strict 0 of 3000.
        message_difference DELETED: 96/96, 0 of 3000 -- NOT DETECTED. step_delta
        DELETED: 96/96, 6 of 3000 -- DETECTED. in_linearized_code DELETED: 96/96,
        0 of 3000 -- NOT DETECTED. message_difference AND in_linearized_code
        DELETED: 96/96, 0 of 3000 -- NOT DETECTED. EVERYTHING but primitive+length
        DELETED: 96/96, 3000 of 3000 -- DETECTED.
      the_integer: >-
        THE DECLARED CONTROL SUITE DETECTS 2 OF THE 5 KEY-COMPONENT ABLATIONS
        TESTED. That is the null's power stated as a power rather than as an
        outcome, and it is the number that should be read wherever 0/3000 is
        currently read.
      the_known_false_object: >-
        The delta_m-blind adjudicator -- the identical package with
        ("message_difference", diff_part) removed from serialize() -- scores
        CTL-PLANT 96/96 and CTL-NULL 0/3000, IDENTICAL TO THE HONEST ONE TO THE
        DIGIT, and calls PLANT-MD5-00-with-one-flipped-message-difference-bit a
        MEMBER where the honest instrument correctly returns NON-MEMBER (both
        measured). The message difference is the primary datum of a differential
        characteristic.
      source: red-team-report joint J5 part_D; proves_too_much O5
    - id: O-8
      what: >-
        WHAT THE DECLARED NULL COULD EVER HAVE DONE. Family (a) md5_delta_m: 1000
        draws, 6 matched a planted MESSAGE DIFFERENCE exactly, 0 of those also
        matched step_delta; best approach was draw #81, agreeing with
        PLANT-MD5-05 on the message difference and on 16 of 64 step_delta words,
        at bit distance 733 of 2560. The delta_m component is reachable at all
        only because all 8 planted MD5 entries carry a WEIGHT-1 message
        difference and the draw is a weight-1 pattern over 512 positions, giving
        P = 8/512 = 1/64 per draw. Family (b) sha1_dv_in_code: 1000 draws,
        1000/1000 in the linearized code, 0/1000 DV matches, achievable
        probability <= 8/2**512 per draw -- the WEAKEST family, not the
        strongest. Family (c) sha1_dv_unconstrained: 1000 draws, 0/1000 in code
        against 8/8 planted SHA-1 entries in code, and 20 of 20 sampled draws
        have a DV that is not the expansion of their own seed window, i.e. NO
        MESSAGE PAIR INDUCES THEM.
      composed_reading: >-
        0/3000 is overwhelmingly evidence that the decoys were never near the
        boundary. It is not zero evidence: exactly one unit of discriminating
        power survives, and it is the step_delta component (O-7).
      source: red-team-report joint J5 part_A
    - id: O-9
      what: >-
        `closest_distance` NEITHER BOUNDS NOR TRACKS THE VERDICT, IN EITHER
        DIRECTION. An object at bit distance 0 from a census entry adjudicates
        NON-MEMBER (decoy N4: a SHA-1 step range relabelled (0,79) -> (5,84) with
        the DV untouched), while an object at bit distance 1277 adjudicates
        MEMBER under permissive (decoy D1: an E2-rotation image at b=1). Every
        sentence in this batch that reads a reported distance as a margin --
        including "the null's closest miss sits at essentially random distance",
        which is true and is not about the boundary -- is reading a
        decision-irrelevant quantity.
      source: red-team-report joint J5 part_B, OBJ-2
    - id: O-10
      what: >-
        THREE TWO-SIDED KNOWN ANSWERS ARE MET, AND A DEGENERATE ADJUDICATOR
        CANNOT MEET THEM. D1, E2-rotation images of PLANT-SHA1-00 at b in
        {1,7,16,31}: strict NON-MEMBER on all four AND permissive MEMBER on all
        four. D2, E6-reindexed images at block index 3: strict NON-MEMBER and
        permissive MEMBER on both primitives. D4, an object differing from a
        planted entry only in signed_representation: MEMBER with E4 in the strict
        group, NON-MEMBER with E4 removed. Additionally O1, a SHA-0 codeword
        presented as a SHA-1 DV: NON-MEMBER in both modes, and OVER-DETERMINED --
        forcing in_linearized_code True leaves it NON-MEMBER at the same
        distance, so the DV content separates it independently of the flag.
      consequences_that_do_not_fire: >-
        NO IR-5 BREACH: the strict group did not admit the excluded generator, so
        no strict verdict in this batch is voided, and the review plan's third
        escalation trigger does not fire. The permissive canonicaliser does
        implement its own declared generator, so the claim that the two verdicts
        bracket the error in a visible direction stands.
      source: red-team-report joint J5 part_B, proves_too_much O1/O3
    - id: O-11
      what: >-
        THE EQUIVALENCE ERRS IN BOTH DIRECTIONS ON DISJOINT AXES, SO THE ERRORS
        CANNOT CANCEL EVEN IN PRINCIPLE. TOO FINE, MEASURED EXACTLY: 32 distinct
        strict canonical forms among the 32 E2 rotations of PLANT-SHA1-00 against
        1 permissive form; 4 distinct strict forms among 4 block indices against
        1 permissive; 128 strict forms over 32 rotations x 4 block indices
        against 1 permissive. Inflation factor 32k where k is the number of block
        indices a DV family spans -- for a two-block SHA-1 collision, 64. TOO
        COARSE, EXHIBITED BUT UNMEASURED IN MAGNITUDE: PLANT-MD5-00 is identified
        with N2b (3531 conditions replaced by 0), with N3 (witness pair replaced
        wholesale) and with D4 (inconsistent signed representation), all at
        distance 0; and -- UNLICENSED -- with N1, an MD5 object whose step_range
        is (8,71) instead of (0,63), because serialize() drops `step_start`
        whenever E1 is in the generator set WITH NO PRIMITIVE GUARD, absorbing on
        MD5 a declared_non_generator of a SHA-1-only generator.
      direction: >-
        NOT DETERMINABLE FROM THIS BATCH, and that is a positive finding rather
        than a refusal: the coarse magnitude depends on how often real distinct
        paths share (delta_m, step_delta), which nobody has measured. Coarseness
        can only turn NON-MEMBER into MEMBER, so it threatens the MEMBER verdict's
        PRECISION and not the NON-MEMBER verdict's SOUNDNESS -- and MEMBER is the
        verdict a covering number counts, so coarseness UNDER-declares novelty.
      source: red-team-report joint J6, OBJ-3, OBJ-4, OBJ-8, OBJ-10
    - id: O-12
      what: >-
        THE FIREWALL HELD AS CONTENT, ESTABLISHED BY SEARCH RATHER THAN BY
        ATTESTATION. Structural search over all 73 committed batch files
        (excluding the sibling reviewer's unread directory): zero files contain
        any 8-hex-digit word token, zero contain a delta_m table, a DV table, a
        sufficient-conditions table, a step/difference row table, or any decimal
        integer array of length >= 6 with entries >= 6 digits. The quarantined
        entry appears only as CEN-QUAR-KN-LIT-87e00e with path_data null, orbit
        UNDETERMINED, tier A and the single whole-file sha256; every other
        occurrence of the token is the KN-LIT id, the citation string or the file
        path. Non-reading verified FROM THE CODE: bytes opened 'rb', streamed to
        a sha256 context, never decoded; the quarantine prefix pruned BEFORE any
        open. Network boundary verified PER CALL from the retrieval log: 2
        WebSearch calls, 0 WebFetch, 0 URLs followed, 18 URLs returned across the
        two calls with none being eprint 2004/199 or any MD5 item, and nothing
        retained beyond title, authors, venue, year, pages, DOI or ePrint number.
      affirmative_mark: >-
        RECORDED BECAUSE A REVIEW THAT ONLY SUBTRACTS IS MISCALIBRATED: the
        retrieval log records that a search tool's summary asserted a complexity
        figure for Chabaud-Joux and that the figure was DELIBERATELY NOT RETAINED
        because it came from a summary rather than the paper -- AGENTS.md rule 5
        applied against the agent's own interest, on exactly the surface the plan
        predicted would break.
      honest_limit: >-
        This is a search for reconstructibility from committed artifacts and that
        is all it is. No artifact search can establish that no agent ever held the
        content in context and declined to write it down.
