  clause_readings:
    S1_record_curves_below_rank7:
      reading: holds_as_observation_interpretation_unsupported
      basis: >-
        In the reduced minimal models, N_E(1e5) = 5 (GZ) and 215 (BK) against
        1155 (rank 7); N_E(3e5) = 11 and 311 against 1559. These are exact on
        both trials and reproduced by three implementations. The count is not
        an isomorphism invariant (D3): the rank-7 curve translated by
        t = 1e6 has 3 and 5. A single-hmax count cannot separate rank >= 8
        from rank 0 (D4). Across seven rank >= 7 curves, N_E(1e5) has
        Spearman -1.00 with log|disc| and -0.40 with the rank lower bound (E1).
    S1_parenthetical_c_E_falls_with_coefficient_height:
      reading: not_measured
      basis: >-
        c_E is an isomorphism invariant. Up to the constant, it is proportional
        to |tors| / sqrt(Reg). N_E(H) at H <= 3e5 is pre-asymptotic (GZ local
        exponent 2 dlogN/dloglogH = 17.3 between 1e5 and 3e5, against r = 8) and model-dependent (D3). The red team's
        listed-sublattice regulators (3.75, 751, 497) attribute about 6.3x of
        the GZ deficit of 231x to lattice density and about 37x to naive-height
        window loss. For BK the split is 2.9x times 1.8x. The regulator
        mechanism is real but minor for GZ. Floating-point heights; lattice
        counts are lower bounds.
    S2_coverage_median_in_0p8_1p2_and_every_cell_in_0p5_1p5:
      reading: met_uninformative_upper_side
      basis: >-
        The frozen median is 1.0419 (131 cells) / 1.0424 (156 cells). Under the
        hypothesis's own cell set (N >= 30, no saturation filter, DISC-1) it is
        1.0389 (144) / 1.0380 (176); the minimum cell ratio is 0.9966 and the
        maximum 1.2593. The largest attainable median, with every cell
        injective, is 1.071 / 1.082, so the upper edge 1.2 cannot fail (D1).
        The lower edge excludes subgroup confinement of index about 4 or more
        at the median cell. GZ supplies no coverage cell.
    S3_frac_above_1p5_lt_0p05:
      reading: cannot_fail
      basis: Only 6 of 131 / 7 of 156 frozen cells have x = n/N_p in (0.875, 1.099), where a ratio above 1.5 is attainable; maximum attainable fraction 0.046 / 0.045 < 0.05 (D1).
    S4_no_record_curve_H_half_at_p_ge_1000:
      reading: cannot_fail
      basis: H_half needs distinct >= N_p/2 >= (p + 1 - 2 sqrt p)/2 >= 468.9 at p >= 1000, while distinct <= n <= 311 on both record curves at H <= 3e5 (D2).
    M_reduce_uniformly_no_structure:
      reading: contradicted_as_stated
      basis: >-
        The observed frozen median of 1.0424 compares with 1.0008 +- 0.0017
        (1 sd, 400 nested uniform replicates, 0 at or above the observation).
        In the 32 top cells, observed collisions are 4969 against
        6142 +- 39. A same-height-rationals null gives 1.0277 +- 0.0040: it
        covers the BK-only median (1.0271) but not the rank-7 cells. Post hoc,
        one implementation, RUN-CZLIFT-b1dce4 cells (E2). This is the same
        direction as EV-CZLIFT-376eee C2.
    G_generalisation_to_rank_record_curves:
      reading: contradicted
      basis: >-
        Elkies-Watkins low-conductor rows of rank >= 8, 9, 10 and 11 have
        N_E(1e5) = 1027, 1023, 743 and 665. The EW rank >= 9 curve exceeds the
        rank-7 curve at H = 1e6 (2281 against 2153). The BK/rank-7 count ratio
        rises with H: 0.055, 0.144, 0.186, 0.199 at H = 1e4, 3e4, 1e5, 3e5
        (recorded counts). The rank labels are lower bounds, including the
        rank-7 label (EW footnote 3).
