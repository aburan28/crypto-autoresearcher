  inference: >-
    The two 1977 record curves, in their reduced minimal models, carry few
    points of small naive height. The reason is large discriminants, and with
    them large regulators and a naive-height window that misses their
    small-canonical-height points. It is not that higher rank buys fewer
    points. Within the window the count orders by discriminant. At matched
    coefficient size, the record curves carry 11 to 311 times the points of
    generic curves. Low-conductor curves of rank 8 to 11 are rich in small
    points, and the rank >= 9 one overtakes the rank-7 curve by H = 1e6. The
    run measures nothing about c_E, rank as a variable, or lifting. Its
    coverage clauses carry evidence only at the lower edge of S2 (no gross
    subgroup confinement). The hypothesis's uniform-reduction reading is
    contradicted at the instrument's own resolution. H-CZLIFT-27a184 is
    weakened: its measurable clauses hold, but they are an observation, not
    its mechanism. The obstruction to coverage-based global lifts is
    unchanged. It is the rank-independent counting bound of EV-CZLIFT-376eee
    (at least N_p/2 distinct global points, i.e. Omega(p) enumeration against
    O(sqrt p) for rho), which this run neither strengthens nor weakens.
  boundaries:
    - 'Curves: three reduced minimal models only. 382623908456a1 = [0,0,0,-10012,346900] (Elkies-Watkins, rank >= 7, conductor 382623908456). Grunewald-Zimmert 1977 [1,-1,1,-6494556985832,6351402068900282539] (rank >= 8). Brumer-Kramer 1977 [1,-1,1,-1608154463,25555312501831] (rank >= 9). No twists.'
    - 'Field type: reductions to prime fields F_p, 16 primes of good reduction p = 103..20011.'
    - 'Bit sizes: p up to 15 bits; naive x-height H(x) = max(|a|, d^2) <= 1e5 (main) and 3e5 (replication).'
    - 'Instance generation: exhaustive deterministic enumeration by the frozen lane-1 sieve; no seeds; 2 trials, nested (they share every point up to 1e5).'
    - 'Solver and implementation: experiments/EXP-CZLIFT-14f6d5/implementation/run.py efd811c5..., the lane-1 library experiments/EXP-CZLIFT-a255fc/implementation/run.py d8de24d0..., harness/czlift_run.py ea163968..., check.py 86432a5e... (not independent of the driver); run commit 08ee02a391.'
    - 'Controls: C1 (rank-7 overlap reproduces lane 1; validator-verified); C2 (sample-point re-verification and the H = 300 recount, which is vacuous on the record curves); C3 (rank labels are lower bounds). Review-added controls: Elkies-Watkins rows, coefficient-matched random curves, translation mutation, rank-0 proves-too-much objects, run-shaped uniform and same-height-rationals nulls, planted progression and subgroup alternatives.'
    - 'Resource limits: advisory budget 5400 s per run, 1 CPU-h; wall times 38.6 s and 178.0 s; memory not recorded.'
    - 'Recalled or heuristic ingredients: the Neron-Lang asymptotic N_E(H) ~ c_E (log H)^{r/2}; the bounded naive-canonical height difference; Bhargava-Shankar average rank < 0.885 (used only to read the coefficient-matched null).'
    - 'Largest claim justified: on the three named reduced minimal models, H <= 3e5, 16 primes 103..20011, toy tier, the counts in O-counts hold exactly. No coverage cell with n >= 30 has a ratio below 0.9966, so there is no gross subgroup confinement. No record-curve H_half at p >= 1000 is possible. Nothing about rank as a variable, c_E, uniform reduction, lifting, other models of these curves, other record curves, or any p beyond 20011.'
  transfer_assumptions:
    - None is made. Any statement about "rank-record curves" as a class, about c_E, or about another model of these curves would need the model-invariant count N(T) on a rank-versus-discriminant ladder; such a statement is outside this record.
  unresolved_confounds:
    - Rank and discriminant are perfectly confounded across the three run curves. The separating controls (EW rows, coefficient-matched null) are post hoc, use one reviewer implementation, and give one curve per rank.
    - The rank-7 label is a lower bound (EW footnote 3). "The record curves have larger rank" needs an upper bound rank(382623908456a1) <= 7 or <= 8 that no record establishes.
    - The red-team canonical heights are floating-point doubling limits, and the regulators are of listed sublattices (unknown index), so the lattice attribution of the deficit is approximate.
    - The coverage nulls are post hoc and computed on RUN-CZLIFT-b1dce4 cells. The same-height-rationals null is heuristic: it keeps denominators and the height bound, not the numerator distribution.
    - The saturation filter and upper-median convention (DISC-1) are unstated in the specification; no clause changes under the hypothesis's cell set.
  confound_assessment:
    - comparison: record curves (rank >= 8, >= 9) against the rank-7 overlap curve, N_E(hmax)
      verdict: not_isolated
      basis: >-
        Rank, |disc| (1.2e13, 1.6e28, 1.0e38), regulator and model offset all
        vary together across three curves. There is no arm with rank fixed and
        discriminant varied, or the reverse, and the reviewer controls that
        separate them were not pre-registered.
  confound_assessment_note: The specification carries no variable_ledger; this row grades the comparison the hypothesis draws, and caps strength at preliminary.
  heuristic_assessment:
    - id: uniform-reduction model (unnumbered; heuristic_under_test is null)
      frozen_falsification_condition: coverage median outside [0.8, 1.2] or frac above 1.5 >= 0.05
      frozen_condition_fired: false
      frozen_condition_power: >-
        None on the upper side. The maximum attainable median is 1.071 / 1.082,
        and the maximum attainable frac above 1.5 is 0.046 / 0.045. The lower
        edge detects confinement of index about 4 or more.
      reading: >-
        Contradicted at instrument resolution against the run-shaped uniform
        null. Most of the excess comes from small-height-rational arithmetic
        (Farey spacing) and the reduction-homomorphism structure already
        recorded in EV-CZLIFT-376eee. Must not be promoted as "no structure".
      validation_experiment_ids: [EXP-CZLIFT-14f6d5, EXP-CZLIFT-a255fc]
  exemplar_checklist: Not applicable; H-CZLIFT-27a184 makes no asymptotic complexity claim (asymptotic_claim null), and this record supports no support or expand decision.
  obstruction:
    statement: >-
      On the reduced minimal models of the Grunewald-Zimmert (1977) and
      Brumer-Kramer (1977) record curves, points of small naive x-height are
      scarce: 5 and 215 at H = 1e5, 11 and 311 at H = 3e5, against 1155 and
      1559 on the rank-7 curve 382623908456a1. So a global-lift method that
      draws on these two models through a naive-height census has few points
      to work with below H = 3e5. The scarcity belongs to the models and their
      discriminants, not to rank. It is not an isomorphism invariant, and it
      does not hold for low-conductor curves of the same or higher rank. It is
      not a rank obstruction and not a c_E obstruction.
    quantity: >-
      (q1) N_E(H): number of rational points with naive x-height
      max(|a|, d^2) <= H, O and +-P counted (dimensionless count), per named
      model. (q2) Spread of q1 over discriminant-preserving integral
      translations of the same curve (dimensionless range). (q3) Coverage
      median of distinct / uniform model over frozen cells (dimensionless),
      against the per-cell attainable cap and run-shaped nulls.
    value: >-
      (q1) GZ 5 (1e5) and 11 (3e5); BK 215 and 311; rank-7 1155 and 1559.
      Exact, with zero sampling error, reproduced by three implementations.
      (q2) The error bar that matters is model dependence: N_E(1e5) spans
      3..1155 for the rank-7 curve (5 translations), 5..29 for GZ (3) and
      13..215 for BK (2). Population spread at the same rank is 665..1027 for
      the EW rows of rank >= 8..11 at 1e5. (q3) 1.0419 / 1.0424 observed;
      attainable maximum 1.071 / 1.082; nested uniform null 1.0008 +- 0.0017
      (1 sd, 400 reps); same-height-rationals null 1.0277 +- 0.0040 (1 sd,
      400 reps); subgroup index 4 null 0.818 / 0.802.
    measured_by: [RUN-CZLIFT-ca7450, RUN-CZLIFT-b1dce4, EXP-CZLIFT-14f6d5]
    measured_by_note: >-
      q1 is read from the run records (raw-result.json counts; DEC-20261009-44c288).
      q2 and q3 were computed by the red team (TASK-20261023-7b5dc6) from the
      run curves and RUN-CZLIFT-b1dce4 cells. The EW and translation values are
      reviewer measurements, not run records.
    scope: >-
      The three named reduced minimal models only, naive x-height <= 3e5,
      reductions at 16 primes 103..20011, toy tier. The obstruction is claimed
      nowhere else. It does not cover other models of these curves, other
      record curves (the EW rows contradict any extension to "rank-record
      curves"), c_E, canonical-height counts, lifts whose rank grows with p,
      E(K), or attack cost.
    resource_check:
      examined: true
      reading: >-
        Two theories take this measurement as a hypothesis rather than a
        refutation. (1) The Elkies-Watkins search strategy: small |disc| and
        many small integral points are how high rank at small conductor is
        found. Read as a resource, q1 and q2 say that high-rank curves rich in
        small points exist exactly when the discriminant is small (EW ranks
        8..11: 665..1027 points at H = 1e5), and that a translation can move a
        model onto its generator cluster (GZ 5 -> 29). So the global-lift lane
        is not closed for rank-record curves by this run, only for the two
        1977 models. (2) The run's own H_half slopes are 0.147 for BK and 0.312
        for rank 7. That fits the lattice model's 2/r scaling and points toward
        rank helping asymptotically. The theory that takes it up is the
        growing-rank lift already routed by DEC-20261023-26a6de. Neither
        reading escapes the rank-independent counting bound: half coverage
        needs at least N_p/2 distinct global points, which is Omega(p) work
        against O(sqrt p) for rho (EV-CZLIFT-376eee D6, D7). Neither is a
        resource for an attack below rho.
      spawned_ids: []
      spawned_ids_note: >-
        Reading (1) is folded into the successor scope named in
        DEC-20261023-6931ab next_actions (one merged idea-generator proposal
        with the DEC-20261023-26a6de successor). Reading (2) is already routed.
        No status changes by their existence.
  reviewed_by: coordinator
