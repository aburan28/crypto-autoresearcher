  direction_note: >-
    The four frozen success clauses read met on both trials and no frozen
    falsification clause fired (DEC-20261009-44c288; recomputed exactly by
    VAL-20261022-2dd0e7). That reading stands. But three of the four clauses
    cannot fail given the counts (analysis.md D1, D2), so the criterion carries
    evidence only through S1 (record-curve count below the rank-7 count) and
    the lower edge of S2. S1 holds as an observation in the reduced minimal
    models. What the hypothesis reads into it does not survive review: the
    parenthetical "c_E falls with coefficient height although the rank is
    larger", the title clause "reduce uniformly", the mechanism clause "no
    structure in E(F_p)", and the generalisation to "rank-record curves".
    N_E(H) at finite H is not an isomorphism invariant (D3, with explicit
    instances). A single-hmax count cannot separate rank >= 8 from rank 0 (D4).
    Across seven rank >= 7 curves the count orders by discriminant, not by rank
    (E1). The coverage median rejects a run-shaped uniform null (E2). The record
    therefore weakens H-CZLIFT-27a184. It does not weaken the rank-independent
    counting obstruction to global lifts carried by EV-CZLIFT-376eee.
  strength: preliminary
  strength_note: >-
    The counts themselves would be strong: exhaustive, deterministic, frozen
    protocol, and reproduced exactly by three implementations (producer,
    validator, red team). The weakening rests on three things. First, two
    derivations (D1, D2: instrument cap; D3: model dependence), which need no
    replication. Second, explicit instances computed by one reviewer
    implementation (rt_lib.py), whose positive control reproduces every
    recorded count. Third, post-hoc comparisons that were not pre-registered:
    the Elkies-Watkins rows, the coefficient-matched null, and the run-shaped
    coverage nulls. There are two record curves. The comparison the hypothesis
    draws (record curves against the rank-7 curve) is not isolated from
    discriminant (confound_assessment). The two trials are nested
    deterministic runs that share every point up to H = 1e5. Strength is
    therefore capped at preliminary.
