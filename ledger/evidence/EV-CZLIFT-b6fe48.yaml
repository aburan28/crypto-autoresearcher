    discriminant, the canonical height and c_E, but not the naive x-height.
    Instance: the rank-7 curve has N_E(1e5) = 1155 in its reduced minimal model
    and 3 at t = 1e6, so F1 would fire on the same curve. D4: rank-0 objects
