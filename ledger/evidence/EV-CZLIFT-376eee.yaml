  proof_note: >-
    Derivation-level for the mechanism (D1-D4: reduction is a homomorphism
    whose kernel has a height floor, so the collision law is not the
    independent-uniform one) and for the index cap (D5). The magnitude of the
    C2 deviation is empirical (post-hoc, replicated). The counterexample
    instances are recorded in rt_c, but they are not packaged as certificates
    with an independent re-checker, so proof_status is not `certificate`.
    Recalled ingredients are listed in boundaries.
  external_verification: []
  clause_readings:
    C1_growth_law:
      reading: supported
      basis: >-
        Exhaustive counts, independently replayed. N_E(H) / (V_r (log H)^{r/2}
        / sqrt(Reg)) lies in [0.963, 1.309] for 1e3 <= H <= 3e5, ranks 1..7
        (rt_h Q1, RUN-CZLIFT-490b33). The growth slopes are within 0.32 of r/2
        on both runs. 11a1 stays at 5 for H >= 30 (CORR-20261023-0657da).
      caveat: The frozen tolerance |slope - r/2| <= 1 admits r +- 1, so the slope does not confirm rank labels.
    C2_uniform_reduction:
      reading: contradicted_as_stated
      basis: >-
        The frozen criterion is met but cannot fail upward (VAL PTM-1). The
        observed median 1.0330 / 1.0333 lies outside every uniform null
        (independent 1.0017 [1.0010, 1.0023]; nested and paired 1.0025
        [1.0010, 1.0041]; 0/200 reps). Deviations go both ways at the cell level
        (97 / 123 upper tails and 2 / 6 lower tails < 1e-6). The structured null
        (index-matched homomorphism, kernel lambda1^2 >= 2 log p) gives 1.0350
        [1.0294, 1.0398] against an observed 1.0338 (470 cells, H <= 3e4).
        Mechanism per D1-D4.
      frozen_heuristic_falsification_condition_fired: false
    C3_h_half_scaling:
      reading: consistent_derivative_not_uniform_in_p
      basis: >-
        Off-grid slopes equal 2/r within 0 to +10 percent (r = 3..7, 1-sigma
        <= 0.022, p = 103..2417), as D7 predicts from C1. H_half is infinite
        where k_p >= 3 (37a1, p = 211 index 5 and p = 293 index 4; D5),
        contradicting the uniform-in-p O(1) in the safe direction.
    C4_exponential_height_useless:
      reading: not_measured_conditional
      basis: >-
        At every resolved toy prime H_half <= p^{1.71} (rt_h Q5). Beyond the
        toy range only D7 holds, conditional on T1-T4. Height is not attack
        cost: log H ~ p^{2/r} bits < p^{1/2} for r >= 5.
    C5_twists_and_E_of_K:
      reading: untested
      basis: >-
        The instrument counts E(Q) union E^D(Q), not E(K). 8 of 129 frozen twist
        cells contain a twist point, all from 389a1 D=-1. O is counted twice.
        r_K/2 growth is not measured.
  observations:
    - id: O-validity
      text: >-
        Two of two planned trials ran, are output_validated with returncode 0
        and check_returncode 0, and are bound to their receipts (20/20 file
        hashes). Every frozen metric recomputes exactly. The enumeration is
        deterministic (no seeds). Under CORR-20261023-0657da (11a1 control
        scoped to H >= 16), both runs are admissible.
    - id: O-frozen
      text: >-
        Coverage median 1.033040 (693 cells) / 1.033250 (785 cells);
        frac_above_1.5 = frac_below_0.5 = 0 on both runs. Growth slopes within
        0.319 / 0.280 of r/2. Grid H_half slopes all within [0.5, 2] x 2/r.
        Twist median 1.0036 (129 cells). The frozen success criterion reads met.
    - id: O-ceiling
      text: >-
        For any point set the ratio is at most min(x,1)/(1 - e^-x), with x =
        N/N_p and median x = 0.10. A maximally spread planted set passes the
        frozen criterion (median 1.0514 / 1.0548).
    - id: O-calibration
      text: >-
        Uniform nulls 1.0017 [1.0010, 1.0023] / 1.0016 [1.0007, 1.0022]
        (validator, seed 20261022); nested and paired 1.0025 [1.0010, 1.0041]
        (red team, seed 20261023); random lattice 1.0125 [1.0074, 1.0179] /
        1.0134 [1.0087, 1.0179]; actual point set under a random homomorphism
        1.0116 [1.0080, 1.0164] (598 cells, observed 1.0322); index-matched
        1.0139 [1.0089, 1.0192]; kernel-floor-conditioned 1.0350
        [1.0294, 1.0398] (470 cells, observed 1.0338, 69/100 reps reach it).
    - id: O-structure
      text: >-
        The kernel floor min lambda1^2(ker red_p) - 2 log p = +0.91 over 86
        cyclic pairs. red_p(E(Q)) is proper on 14 of 112 rank >= 1 pairs; 37a1
        has index 5 at p = 211 (N_p 225, image 45) and index 4 at p = 293 (N_p
        296, image 74). Every 37a1 row is maximally spread.
    - id: O-hhalf
      text: >-
        Off-grid H_half slopes, main / replication: r=3 0.696 +- 0.019; r=4
        0.500 +- 0.020 / 0.507 +- 0.015; r=5 0.416 +- 0.022 / 0.419 +- 0.017;
        r=6 0.356 +- 0.008 / 0.352 +- 0.006; r=7 0.298 +- 0.006 /
        0.296 +- 0.005. log H_half / log p <= 1.71 at every resolved toy prime.
  inference: >-
    On the tested ladder, the small rational points are as few as the
    Neron-Lang count says. Their reductions are not independent-uniform: they
    are a lattice ball pushed through the reduction homomorphism, whose kernel
    has no vector of canonical height below 2 log p - c_E (measured: below
    2 log p + 0.91 on none). That structure makes them slightly more spread than
    uniform draws. By pigeonhole, the extra spread is worth at most a factor
    2 ln 2 in the number of points needed for half coverage. It therefore
    leaves the counting obstruction intact. The obstruction is carried by C1
    plus pigeonhole (D6, D7), not by uniformity. H-CZLIFT-9a32e9 is weakened
    because its stated mechanism (HEUR-CZLIFT-UNIFORM) is false as stated.
    Its exponential-height consequence is unmeasured at toy scale and holds
    only conditionally (T1-T4). Its twist clause is untested.
  boundaries:
    - 'Curves: the eight minimal-conductor ladder curves 11a1, 37a1, 389a1, 5077a1, 234446a1, 19047851a1, 5187563742a1, 382623908456a1 (recalled ranks 0..7; Cremona minimal models frozen in implementation/run.py); twists by D in {-1, 2, -3, 5, -7, 13} of the first four.'
    - 'Field type: reductions to prime fields F_p, 16 primes of good reduction p = 103..20011 (spec text says 101..20000); H_half resolved only at p = 103..2417.'
    - 'Bit sizes: p up to 15 bits; naive height H(x) = max(|a|, d^2) <= 1e5 (main) and 3e5 (replication); twist height <= 3e4.'
    - 'Instance generation: exhaustive enumeration by a seven-modulus quadratic-residue sieve plus an exact square test; deterministic, no seeds; 2 independent instances (trials), which share all points up to 1e5.'
    - 'Solver and implementation: experiments/EXP-CZLIFT-a255fc/implementation/run.py sha256 d8de24d0..., harness/czlift_run.py ea163968..., check.py 41c01bb9... (not independent of the driver); launch commit d13377cd.'
    - 'Controls: 11a1 torsion constancy (scoped to H >= 16 by CORR-20261023-0657da); uniform model from the same N and N_p (twist rows +1 for O); sample-point re-verification and the H = 300 recount; bad-reduction exclusion. Calibration controls added in review: seeded uniform nulls, random-lattice, Mordell-Weil-coordinate, index-matched and kernel-floor-conditioned homomorphism nulls; planted max-spread and clustered sets.'
    - 'Resource limits: advisory budget of 3600 s per run and 1.5 CPU-h; wall time 127 s and 511 s; memory not recorded.'
    - 'Recalled ingredients (not re-derived): reduction homomorphism (Silverman AEC VII.2.1); naive-canonical height difference bound; volume-law count (Lang 1983 Ch. 5 Thm 7.4, via JKSST 2000); Mordell-Weil group of 37a1 = Z (0,0).'
    - 'Largest claim justified: on this ladder, H <= 3e5, p = 103..20011, toy tier: C1 holds; C2 is false as stated, and a structured kernel-floor model fits; C3 matches 2/r off the grid but is infinite at index >= 3 primes; C4 and C5 are not measured. Beyond this range only the conditional fixed-rank bound D7 under T1-T4. Nothing about attack cost, lift construction, E(K), fields of degree > 2, or cryptographic p.'
  transfer_assumptions:
    - 'T1: the lifted curve has rank r fixed independently of p (the bound weakens to polynomial height once r >~ r*(p) = 2 log p / log(2 log p): 34.3 at 2^128, 60.4 at 2^256).'
    - 'T2: c_E = V_r / sqrt(Reg) and the naive-canonical height difference stay bounded along the lifts (a p-dependent lift has coefficients of size p, so the difference is O(log p)).'
    - 'T3: [E(F_p) : red_p E(Q)] <= 2 for a finite H_half (fails at 37a1 p = 211, 293).'
    - 'T4: a fixed E/Q stands in for the attacker''s p-dependent lift (and for xedni''s curve through lifted points); untested.'
  unresolved_confounds:
    - The adverse C2 analyses were chosen after the outcome; a pre-registered test of the structured null against the uniform null on disjoint curves and primes is outstanding.
    - Cells at H = 1e5 and 3e5 (95 main, 187 replication) are not covered by the structured-null analysis or by an independent replay.
    - The kernel-floor analysis assumes cyclic E(F_p) and skips 26 of 112 pairs.
    - Rank upper bounds are unverified; D4 and D5 rely on the recalled Mordell-Weil group of 37a1.
    - Finite-height bias in the growth-slope fit (rank 7 fits 3.18 / 3.22 against 3.5).
  confound_assessment: []
  confound_assessment_note: The specification carries no variable_ledger; the calibration nulls stand in for the comparison table.
  heuristic_assessment:
    - id: HEUR-CZLIFT-UNIFORM
      frozen_falsification_condition: median outside [0.8, 1.2] or more than 5 percent of cells above 1.5
      frozen_condition_fired: false
      frozen_condition_power: none on the upper side at these cells (median x = 0.10; ceiling 1 + x/2)
      reading: >-
        False as stated. The random-model justification is contradicted by D1
        (reduction is a homomorphism). Its scope "uniformly in p over the
        primes of good reduction" fails by D5. Calibrated reviewer nulls reject
        it at the cell level and in the median. A structured replacement
        (lattice ball under a random homomorphism with the same image index and
        a kernel height floor of 2 log p) fits post hoc and is not validated.
      validation_experiment_ids: [EXP-CZLIFT-a255fc]
  exemplar_checklist: Not applicable; H-CZLIFT-9a32e9 makes no asymptotic complexity claim (asymptotic_claim null), and this record supports no support or expand decision.
  obstruction:
    statement: >-
      For a fixed E/Q of rank r, the rational points of naive height <= H are
      the lattice points of a canonical-height ball, numbering
      N_E(H) = V_r (log H)^{r/2} / sqrt(Reg) (1 + o(1)). Reduction mod p is a
      homomorphism, so no set of points covers more residues of E(F_p) than it
      has points. Covering half of E(F_p) therefore needs N_E(H) >= N_p/2,
      i.e. log H_half >= (sqrt(Reg) N_p / (2 V_r))^{2/r} (1 + o(1)). The
      measured excess over uniform reduction is a kernel-height-floor effect
      and moves the needed N by at most a factor 2 ln 2. This is a counting
      obstruction at fixed rank, not a uniformity obstruction.
    quantity: >-
      (q1) count ratio N_E(H) / (V_r (log H)^{r/2} / sqrt(Reg)), dimensionless,
      Reg from PARI height Grams of the census points; (q2) d log log H_half /
      d log p off the grid, dimensionless, against 2/r; (q3) kernel floor gap
      lambda1^2(ker red_p) - 2 log p, nats of PARI canonical height; (q4)
      frozen-cell median of distinct / uniform model, dimensionless, against
      uniform and structured nulls.
    value: >-
      (q1) [0.963, 1.309] over 1e3 <= H <= 3e5, ranks 1..7 (exact enumeration;
      the range is the spread over H and curves); [0.987, 1.085] at H = 3e5.
      (q2) r=3 0.696 +- 0.019 (2/r 0.667); r=4 0.500 +- 0.020 / 0.507 +- 0.015
      (0.5); r=5 0.416 +- 0.022 / 0.419 +- 0.017 (0.4); r=6 0.356 +- 0.008 /
      0.352 +- 0.006 (0.333); r=7 0.298 +- 0.006 / 0.296 +- 0.005 (0.286);
      1-sigma OLS SE, main / replication. (q3) minimum +0.91 over 86 cyclic
      (curve, p) pairs; per-curve minima 2.27 to 3.36 for ranks 5..7. (q4)
      observed 1.0330 / 1.0333; uniform nested-paired null 1.0025 [1.0010,
      1.0041] (95 percent, 200 reps); structured null 1.0350 [1.0294, 1.0398]
      against observed 1.0338 (470 cells, 100 reps). Pigeonhole cap on any
      spread effect: Delta log log H_half <= 0.327 (r = 2) to 0.093 (r = 7).
    measured_by: [RUN-CZLIFT-74f172, RUN-CZLIFT-490b33, EXP-CZLIFT-a255fc]
    measured_by_note: >-
      Computed from the runs by the red team (TASK-20261023-326d39):
      q1 and q3 from RUN-CZLIFT-490b33 (rt_h Q1, rt_f); q2 and q4 from both runs
      (rt_d, rt_a, rt_g). Cells with H <= 3e4 are identical in both runs.
    scope: >-
      The eight-curve ladder (recalled ranks 0..7), naive height <= 3e5,
      p = 103..20011 for coverage and p = 103..2417 for H_half, toy tier. The
      obstruction is claimed nowhere else as a measurement. Beyond this range
      only the conditional fixed-rank bound D7 under T1-T4. It does not cover
      lifts whose rank grows with p, p-dependent lifts, E(K) proper, fields of
      degree > 2, or attack cost.
    resource_check:
      examined: true
      reading: >-
        Read in reverse, the measurement says the obstruction is a rank
        obstruction. The volume law and the kernel floor h^(ker) >= 2 log p
        meet at r*(p) = 2 log p / log(2 log p). Above that rank, small points
        cover E(F_p) at polynomial height; on the toy primes ranks 5..7 already
        sit there (H_half <= p^{1.71}). Two theories take this as a hypothesis.
        (1) A lift construction whose rank grows like log p / log log p (about
        60 at p = 2^256), reducing to a prescribed target curve. That would
        collapse the counting obstruction to polynomial height. No such
        construction is known: the record rank is 29 (recalled, from the H2
        source statement). (2) The CVP formulation: lifting Q is a
        closest-vector problem in the coset of Lambda_p = ker red_p, a rank-r
        lattice of covolume N_p and minimum >= 2 log p - c_E. Obtaining Lambda_p
        and Q's coset requires discrete logs, which is the DLP itself
        (KN-LIT-7593 pattern), so this is a resource only for a method that
        finds short kernel vectors or the coset without discrete logs. The
        floor also gives JKSST-style relation bounds a measured constant on this
        ladder (h^ >= 2 log p + 0.9). The excess itself is not a resource (D6).
      spawned_ids: []
      spawned_ids_note: >-
        Both readings are candidates for ranking, not evidence. They are routed
        to the idea-generator in DEC-20261023-26a6de next_actions, and the IDs
        will be allocated there; this record changes no status by their
        existence.
  reviewed_by: coordinator
