  type: empirical
  direction: weakens
  direction_note: >-
    Clause-level: C1 (growth law) supports; C2 (reductions behave like
    independent uniform points, HEUR-CZLIFT-UNIFORM) contradicts as stated;
    C3 (log log H_half = (2/r) log p + O(1)) is consistent, but it is derived
    from C1, and its uniform-in-p O(1) fails at index >= 3 primes, in the
    direction that makes lifting harder; C4 (height exponential in p^{2/r},
    "global lifts are useless") is not measured and is conditional on T1-T4;
    C5 (twists / E(K)) is untested. The hypothesis's stated mechanism is
    uniform reduction, so the record as a whole weakens H-CZLIFT-9a32e9. It
    does NOT weaken the counting obstruction to global lifts at fixed rank.
    The data strengthen that obstruction's counting ingredient (C1, D6).
  strength: replicated
  strength_note: >-
    The C2 effect (median 1.0330 / 1.0333 above every uniform null; 97 / 123
    frozen cells with exact paired-uniform upper tail < 1e-6) appears on both
    planned runs. Two implementations independent of the producer recompute it:
    the validator's replay and the red team's sieve. A derivation (D1-D5)
    explains it, and a one-assumption structured null reproduces it. The cap
    stays below `strong`, for two reasons. The adverse analyses were not
    pre-registered: the frozen coverage criterion was met and cannot fail on its
    upper side. And the two runs share every point up to H = 1e5, so they are
    not independent samples for coverage. C1 alone would be `strong`
    (exhaustive enumeration, frozen protocol, eight curves, independent replay).
  claim_tier: toy
  claim_tier_note: >-
    Prime field, p = 103..20011 (at most 15 bits); naive height <= 3e5.
    Scale-relevance label toy-scale, by direct computation at the stated sizes.
    No correspondence or embedding to cryptographic size. Any statement beyond
    this range is the conditional consequence D7 under T1-T4.
  certificate_refs: []
  certificate_note: No solve or relation is claimed; no success certificate applies.
  proof_status: derivation
  proof_refs:
    - experiments/EXP-CZLIFT-a255fc/analysis.md (Inference, derivation note D1-D7)
    - experiments/EXP-CZLIFT-a255fc/reports/redteam-20261023/rt_c_points_kernel_index_output_H30000.json (kernel points, index k_p; 37a1 p=211 and p=293)
    - experiments/EXP-CZLIFT-a255fc/reports/redteam-20261023/rt_f_kernel_minimum_output.json (kernel floor)
