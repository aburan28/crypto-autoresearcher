  goal_id: GOAL-SSI-001
  batch_id: BATCH-256a94
  hypothesis_id: null
  hypothesis_id_note: >-
    Deliberately null. This record composes a source-state census, an arithmetic
    reconciliation, and two independent blinded reviews of both. It tests no
    hypothesis, and naming one would invite exactly the inference this package
    cannot support. No hypothesis status is implicated in any direction.
  experiment_ids:
    - EXP-WESOVOW-001
  run_ids:
    - RUN-WESOVOW-001
  run_id_note: >-
    RUN-WESOVOW-001 is cited as the source of committed literals that were read,
    not rerun. The successor run RUN-WESOVOW-201692-001 was also read and is
    cited by immutable artifact path in proof_refs and observations rather than
    in run_ids, because its generated manifest uses the repository's legacy flat
    shape and is therefore not registered by tools/validate_ledger.py's nested
    run index. That schema debt is already disclosed on EV-SSI-4b17e7 and is
    repeated here rather than repaired by mutating a sealed snapshot. NO
    EXPERIMENT WAS EXECUTED OR RE-EXECUTED IN THIS BATCH by the producer, by
    either reviewer, or by this archive; BATCH-256a94 authorized zero new
    experiment runs.
  type: arithmetic_review
  direction: neutral
  direction_note: >-
    `neutral` is with respect to every hypothesis and every research direction:
    no hypothesis is supported, weakened, contradicted, or closed, so no
    `obstruction` block is required and none is claimed. It is NOT a softening
    of the round's adverse findings. This round refuted one declared control
    (J5), broke two reviewed joints (J4, J6), broke the proves-too-much control
    on a fourth object, and localized a defect in a frozen governing artifact.
    Those findings are recorded below at full strength and are about the
    program's own instruments and contract, not about any isogeny problem.
  strength: inconclusive
  strength_note: >-
    `inconclusive` is the composed round strength and it is a composition, not a
    hedge. Three components are individually solid within their scope: the blind
    re-derivation holds (a law derived from the frozen specification alone, by an
    agent that read neither implementation, reproduces all 240 committed rows and
    both runs' crossover values to 0.000e+00 bits); the law-identity result
    holds; the 240-row reconciliation recomputes with no missing, duplicated, or
    mixed-anchor row and no tolerance inflation. The package as a whole does not
    reach `replicated`, because (a) one declared control has no reachable failure
    branch on any real anchor, (b) one governing committed artifact still carries
    the pre-fix law and the census affirmatively denies that it carries any law,
    (c) one of the two anchors is not a point of this cost model at three of five
    field sizes, and (d) the two reviews are session-independent but not
    model-independent. `inconclusive` also blocks knowledge promotion, which is
    correct: nothing here is a durable finding about isogenies.
  claim_tier: toy
  claim_tier_note: >-
    `toy` is the evidence tier, not the model's parameter range. The cost model's
    declared grid runs to log2 p = 768, but nothing in this package is a
    measurement of any instance at any scale: it is arithmetic on already
    committed literals, code reading, record reading, and git object inspection.
    No isogeny was computed, no relation found, no instance solved, no timing
    measured. The tier may not be read as a claim about cryptographic-scale
    behaviour, and no transfer to any parameter set, scheme, or security margin
    is claimed or admissible from this record.
  certificate:
    kind: none
    note: >-
      No solve, relation, or attack is claimed, so there is nothing to certify.
      certificate_refs is empty by construction, not by omission.
