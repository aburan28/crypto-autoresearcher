  proof_status_note: >-
    `derivation` is the strongest checkable basis this round admits, and it is
    the basis for the round's headline adverse finding rather than for any
    positive claim. The refutation artifact is a derivation, not a certificate:
    the Red Team derived, from experiments/EXP-WESOVOW-001/specification.yaml
    alone and before opening any producer artifact, that no single law can
    satisfy both the analytic crossover stated in that file's metrics list and
    control C4 of the same file; the Validator independently recomputed the gap
    between the two crossover forms and measured it as exactly log2 M at every
    field size. Neither is a machine-checked certificate, and neither is
    empirical: the argument is checkable by reading the frozen contract.
  snapshot_commit: 5872cf99a2e71c0455502244047ad3c2f019ccbc
  scope_statement: >-
    Everything in this record is scoped to the artifacts snapshot-bound at commit
    5872cf99a2e71c0455502244047ad3c2f019ccbc, to the frozen EXP-WESOVOW-001
    contract and its two committed run packages, to the five field sizes
    log2 p in {256, 384, 512, 576, 768}, the six memory budgets log2 w in
    {30, 40, 50, 60, 70, 80}, the four overhead scenarios c in
    {0.0, 0.5, 1.0, 2.0}, this cost model, and these two anchors. NO security,
    SQIsign, CSIDH, standardized-parameter, exponent, asymptotic-complexity,
    speedup, or attack claim is made in any direction; none is supported by
    anything below; and no transfer or extrapolation to any other parameter,
    scheme, or method is claimed. No promotion gate of agents/coordinator.md is
    engaged, approached, or satisfied.
  citation_prohibition_restated_verbatim: >-
    The `P=512` crossover value and its `w=2^80` sign are **NOT
    citation-eligible**. This task does not lift that prohibition. Only a
    committed Coordinator decision on independently reviewed evidence can lift
    it.
  observations:
    - >-
      HEADLINE, AND INDEPENDENTLY CORROBORATED BY TWO MUTUALLY BLINDED
      REVIEWERS BY DIFFERENT ROUTES: the frozen contract
      experiments/EXP-WESOVOW-001/specification.yaml still carries the PRE-FIX
      analytic crossover on origin/main, at lines 39-40 of its metrics list:
      "crossover memory log2(w*) per (p, overhead c), analytic: w* = (T_full *
      2^{c*sqrt(log2 p)} / T_DG)^2, capped by M". The Red Team reached this as
      objection O1 from a blind re-derivation that read the specification and
      nothing else; the Validator reached it as MR-10 by recomputation, measuring
      the two crossover forms as differing by exactly log2 M at every field size
      (93.27781828665178, 137.48765358816084, 203.30702177853001 and
      268.68673590177326 bits at log2 p = 256, 384, 576 and 768; the log2 p = 512
      value withheld as a precaution by the reviewer and withheld here for the
      same reason). The composing Coordinator read specification.yaml:36-42
      directly and confirms the line is present as quoted.
    - >-
      CONSEQUENCE OF THE HEADLINE, ON THE RED TEAM'S BLIND DERIVATION: the frozen
      contract is INTERNALLY UNSATISFIABLE. The metrics-line crossover is the
      crossover of a law whose value at w = M is below T_full by log2(M)/2 bits,
      so no single charging law satisfies both that line and control C4 ("At
      w = M, vOW time must equal T_full exactly") unless log2 M = 0. The
      committed implementation, the successor run and the frozen protocol
      amendment TASK-20260809-ef3e58 all carry the repaired crossover with the
      additional log2 M term; the contract was deliberately left unamended
      (specification.yaml is listed under the amendment's immutable_exclusions)
      and now disagrees with the amendment that governs the implementation.
    - >-
      The census artifact states, at source_state_census.md:108-110, that "The
      specification states a normalisation requirement, not a closed-form law."
      That sentence is FALSE OF THE FILE: line 39-40 states a closed form. The
      metrics line is quoted zero times by the census, is absent from
      outstanding_fix.md's residual list R1-R8, and the census's own closing test
      for a future census is indexed only on cost_model.py, so a future census
      run to that test would miss it again. This is a real incompleteness in a
      census, which is the one artifact type whose value is entirely in its
      completeness. It is not evidence of concealment.
    - >-
      RG-0's verdict `fix_already_applied` STANDS on the scope where it was
      evidenced - the implementation and the two run records - and both reviewers
      independently re-verified it there. It is NARROWER THAN ITS WORDING: the
      task it answers is titled "Establish the committed charging-law state of
      EXP-WESOVOW-001", and at that scope a governing committed artifact still
      carries the pre-fix law. The verdict word is broader than the evidence
      supports by exactly one artifact.
    - >-
      J5 IS REFUTED. RG-4 has NO reachable failure branch on any real anchor. The
      producer disclosed the cap arm as algebraically entailed but asserted three
      other arms (the predecessor-law arm, monotonicity across the memory grid,
      and the log2 w = log2 M + 1 row) were not entailed and "therefore do carry
      information". The Validator refuted that by pushing 2e5 arbitrary anchors
      (log2 T_full and log2 M uniform on +/-1e6, all five field sizes, all four
      c) through the producer's own rg4_cap_and_monotonicity function: neither
      the cap arm nor the monotonicity arm failed once. The only input that flips
      any arm is the degenerate log2 M = 0 anchor. A control that cannot fail is
      not evidence, and its pass may not be reported as confirmation.
    - >-
      THE CITATION PROHIBITION IS UNDER-SCOPED. It is applied in the
      machine-readable artifact by field size - 48 rows flagged
      citation_prohibited: true, exactly and only the log2 p = 512 rows - while
      the anchor-dependent sign flip that is the prohibition's own stated
      rationale also occurs at two log2 p = 256 rows, at (log2 w = 50, c = 0.0)
      and (log2 w = 70, c = 0.5), both of which carry citation_prohibited: false
      and a null note. At one of them the smaller of the two margins is about a
      quarter of a bit, under the anchor that is not a point of this model at
      that field size. A downstream consumer honouring the flag is led straight
      to an anchor-dependent sign. Values withheld; the sign disagreement is the
      finding.
    - >-
      PAPER_PAIRS IS INFEASIBLE FOR THIS MODEL AT THREE OF FIVE FIELD SIZES. The
      contract declares the optimizer's objective as minimizing log2(T_full) over
      log2 B in [1.0, 60.0], so per_field[*].optimal.log2T is by definition the
      smallest log2 T_full this model attains. The transcribed PAPER_PAIRS time
      lies BELOW that minimum at log2 p = 256, 384 and 512 (paper minus attained
      minimum: -2.231, -0.374, -1.904 bits; at 576 and 768 it is above, +0.919
      and +1.465). A value below a minimum is not a value of the function. The
      two anchors are therefore different KINDS of quantity under this cost
      model, not two estimates of one quantity, and the reconciliation artifact's
      phrase "a genuine difference between two committed inputs" reads as the
      latter. NO CONTROL IN THE PACKAGE TESTS ANCHOR REACHABILITY, and the
      procedure accepts the infeasible pair and emits 120 fully formed rows from
      it, 72 of them at the three infeasible field sizes, with no schema field
      recording that the anchor is off-curve.
    - >-
      The proves-too-much control PASSES on all three declared known-false
      objects and BREAKS on a fourth the Red Team added: the PAPER_PAIRS anchor
      at log2 p in {256, 384, 512}, for which "this pair is an admissible
      (T_full, M) input to this cost model" is known false. The procedure accepts
      it and processes it fully. The Red Team also shows the three DECLARED
      objects have the coverage of one quantity plus one tautology: objects 1 and
      3 and RG-3's separation all measure the single constant 0.5*log2 M that
      separates the two laws, and object 2 (log2 M = 0) is known-false by the
      same max(0, .) identity that makes RG-4's cap arm entailed. The declared
      object set was written by the Coordinator in the review plan; the weakness
      is the plan's, not the producer's.
    - >-
      RG-1's and RG-2's "0.0 bits over 120 cells" is an implementation agreeing
      with its own output, under the same law, from the same anchors. It is
      ARITHMETIC SELF-CONSISTENCY, NOT INDEPENDENT VALIDATION: a faithful
      re-implementation of a wrong expression tree would produce it too. The Red
      Team names it the most quotable and least informative number in the
      package. What does bear independently is the blind re-derivation and the
      Validator's pre-registered derivation, both from the frozen specification
      alone.
    - >-
      WHAT HOLDS, STATED AS PRECISELY AS WHAT BREAKS. The blind re-derivation
      HOLDS: the Red Team derived the charging law and its crossover from
      specification.yaml's C2/C3/C4 and model_definition alone, with its own
      Dickman rho marched from the delayed ODE rather than the specification's
      Laplace inversion, and reproduced all 240 log2 T(w) values and all 240
      log2 w* values of anchor_reconciliation.json to 0.000e+00 bits, plus
      0 mixed-anchor rows in 240, overhead_bits = c*sqrt(log2 p) in 240/240 and
      log2 T_DG = log2 p / 2 in 240/240. The Validator, independently and before
      opening any producer artifact, derived the same law from C3 and C4 and
      recomputed all 240 rows in a third summation order distinct from both
      implementations under comparison, with maximum deviation 5.684341886080802e-14
      bits (one ULP) and 0.0 bits against the BATCH-eb0a7e committed table. The
      three corrected law statements - current cost_model.py, the successor run,
      and BATCH-eb0a7e's corrected_charging.py - are one function everywhere,
      including at and above the memory cap.
    - >-
      The Red Team additionally reproduced the fitted_opt anchor from the frozen
      contract with an independent Dickman rho implementation: identical
      log2 B_opt at all five field sizes, with log2 T_full and log2 M agreeing to
      <= 2.5e-4 bits. So fitted_opt is independently reproducible from the
      contract, while PAPER_PAIRS has never been compared against its external
      source by any agent in this program. The two anchors are asymmetric in
      verifiability and no prior artifact said so.
    - >-
      "Derived independently in BATCH-eb0a7e" does not survive checking as a
      claim of INDEPENDENCE. ledger/corrections/CORR-20260808-c792f8.yaml already
      stated the corrected law and the corrected crossover verbatim, and the
      Validator verified that this record was readable at BATCH-eb0a7e's own
      snapshot base bd47a3f5c. L_curr identical to L_eb0a7e is therefore
      agreement between two implementations of one already-committed written
      formula - strong evidence of transcription fidelity, weak-to-no evidence
      about the law's correctness.
    - >-
      NEITHER RUN'S EXECUTION PROVENANCE IS ATTESTED, and both manifests record
      dirty_tree: true (RUN-WESOVOW-001/manifest.yaml:19,
      RUN-WESOVOW-201692-001/manifest.yaml:24). The strongest available binding
      is the Validator's: sha256(cost_model.py) =
      714e63667c7d31bf685ebd89d3179cb55953a9e89d611f36b96ebf4067444842 equals
      source_sha256_at_run at RUN-WESOVOW-201692-001/manifest.yaml:31, so the
      committed bytes are the bytes that manifest names. That is not proof that
      the recorded command produced the recorded output.
    - >-
      RC-1, THE ROUND'S NAMED NEXT ACTION, IS UNPERFORMED. Nobody has ever
      verified the five PAPER_PAIRS literals at cost_model.py:61-65 against
      Section 4.1 of inputs/P13-WESOLOWSKI-2026/paper_fulltext.md. The Red Team
      reports the path was outside its declared read_scope and that it found no
      committed record, in this batch or in BATCH-eb0a7e's readable artifacts, in
      which any agent checked it. Both reviewers flag it as the cheapest decisive
      step in the round: it is a text lookup, and it is the only step that can
      distinguish a transcription defect from a model defect from a genuine
      external disagreement.
    - >-
      Package integrity: the snapshot commit 5872cf99a2e71c0455502244047ad3c2f019ccbc
      is content-verified. Both reviewers independently recomputed all seven
      declared source_path_sha256 values and matched them; the Validator adds
      that worktree, snapshot-commit, HEAD and receipt hashes agree 7 of 7. The
      receipt's commit_sha is null with status pending_post_commit, and its
      declared parent_sha a769ca3e7 is an ancestor of the snapshot commit but not
      its first parent, which is 26a8d6061. Under the repository's content-first
      rule the binding is the hashes and it verifies; the parent mismatch is
      recorded, not waived.
    - >-
      No file under experiments/ was modified, moved, regenerated, reformatted,
      rerun or staged by any task of BATCH-256a94. The Validator verified this
      independently against git: no commit since 2026-09-01 touches
      experiments/EXP-WESOVOW-001, git diff across the batch's commits is empty
      under experiments/, and the worktree is clean there.
    - >-
      The 2026-08-09 upstream-admission timing carried by the Coordinator's own
      recorded prior and by batch.yaml's opening_observation is NOT SUPPORTED BY
      GIT and is corrected. The decision DEC-20260809-c1066f is dated 2026-08-09;
      the source reached origin/main's first-parent line only at 2675886ea on
      2026-08-24 20:50:28 UTC, about 2 h 18 min AFTER BATCH-eb0a7e's snapshot
      base bd47a3f5c (18:32:12 UTC). The producer reported it as AN-1, the
      Validator and Red Team each re-derived it, and the Red Team additionally
      checked the first-parent step the census asserted but did not show. The
      BATCH-eb0a7e team was therefore reading a genuinely pre-fix revision and no
      fault attaches to it.
  inference: >-
    The committed reviews support accepting this round as an arithmetic and
    measurement-hygiene outcome with one durable adverse localization: the frozen
    EXP-WESOVOW-001 contract still states, at specification.yaml:39-40, an
    analytic crossover that contradicts control C4 of the same file and that the
    protocol amendment TASK-20260809-ef3e58 repaired everywhere except there.
    They do not support any inference above that. This round demonstrates NO
    speedup, NO attack, and NOTHING about the security of any supersingular
    isogeny problem, SQIsign, CSIDH, or ECDLP in either direction; it establishes
    that the charging law carried by the implementation, the successor run and
    the amendment is one law and is the law forced by the contract's C3 and C4,
    and that the fitted_opt / PAPER_PAIRS divergence survives reconciliation and
    is worse than previously recorded, because one of the two anchors is not a
    point of this model at three of five field sizes. Where the two anchors
    disagree in the sign of a baseline comparison, that disagreement is an
    unresolved interpretation boundary and never a result.
  boundaries:
    - >-
      No experiment was executed or re-executed. No timing, resource, attack,
      solve, certificate, or security measurement is recorded or accepted here.
    - >-
      No hypothesis status, experiment status, research-direction status, or
      GOAL-SSI-001 status changes. GOAL-SSI-001 remains active. No completion
      criterion is met or approached, and none is approached by this record.
    - >-
      The arithmetic is finite-grid and anchor-dependent and does not transfer to
      standardized parameters, to asymptotic complexity, or to any deployed
      scheme.
    - >-
      The P=512 crossover value and its w=2^80 sign remain NOT citation-eligible.
      This record does not lift that prohibition. The prohibition's boundary is
      now known to be under-scoped by field size; the widening is enacted by
      DEC-20260904-166ab5, not by this record.
    - >-
      `dominated_by` IS NOT ASSESSABLE FROM THIS PACKAGE and is deliberately not
      asserted either way. No row carries a memory-and-time Pareto comparison
      against any external method, and nothing may be inferred from the
      log2speedup_vs_DG_current_law column, which is a comparison against a
      single declared baseline inside a declared cost model. Recording a null
      `dominated_by` here would be a fabrication under AGENTS.md rule 9; the
      honest value is "not assessable", pending an anchor decision and RC-1.
    - >-
      THE TWO REVIEWS ARE SESSION-INDEPENDENT BUT NOT MODEL-INDEPENDENT. Only the
      `local` backend resolved in this environment; both reviewers self-report
      resolved_model_id claude-opus-5 and both record model_verified false or
      undetermined, neither having run an adapter probe. Their concurrence on the
      specification.yaml:39-40 finding is corroboration by two independent
      METHODS in two independent SESSIONS - a blind derivation and a
      recomputation - and may NEVER be presented as corroboration by distinct
      models.
    - >-
      The producer package records no resolved-model provenance: none of its
      seven artifacts carries a runtime-session receipt, and its requested policy
      is self-reported in prose. Its inference provenance is undetermined from
      committed state. The task card did not require one, so this is a contract
      gap to close in successor cards rather than a producer failure.
  unresolved_confounds:
    - >-
      Which anchor, if either, is the one to cite remains undetermined, and RC-1
      - the comparison of the five PAPER_PAIRS literals against Section 4.1 of
      the frozen paper - has never been performed by anyone.
    - >-
      RG-4 as run carries no information about the implementation on any real
      anchor. RG-3's discrimination margin is 46.25 bits or larger everywhere, so
      it bounds the procedure's resolution nowhere tighter than (0, 46.25] bits
      and is blind to every quantity this batch exists to study, including the
      anchor divergence itself at 0.18-3.22 bits.
    - >-
      The exponent 1/2 in the charging law is an import from van Oorschot-Wiener,
      not an entailment of the frozen contract, which never writes it. Both
      reviewers record this; neither closed it.
    - >-
      The historical execution provenance of both runs is unattested
      (dirty_tree: true on both manifests) and no agent in this program is
      currently authorized to re-execute them.
    - >-
      cost_model.py's default output path names RUN-WESOVOW-201692-001, so a
      future invocation without WESOVOW_RAW_PATH set would write into a committed
      run directory. The producer recorded this as R2 "without asserting it is an
      error"; the Red Team reclassifies it as a standing evidence-integrity
      hazard. It is out of this batch's authority to repair and is carried
      forward, not closed.
    - >-
      The 120-cell "overlap" comparison reported in anchor_reconciliation.md is
      the same measurement as RG-2 presented a second time, because the
      predecessor and successor optimal anchors are exactly equal. It is one
      measurement, not two.
