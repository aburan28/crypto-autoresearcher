  what_is_not_established:
    - >-
      N-1 THE MECHANISM WAS NOT TESTED, ON EITHER OBJECT. This is THE PRIMARY
      FINDING OF BATCH-021 and it is more important than the transfer. BATCH-021
      ADDED AN OBJECT, NOT A MECHANISM. smoothness_abort is false on all six arms,
      so is_B_smooth has still never been called anywhere in the EXP-DS-001 series;
      encode_intermediate is the identity on both objects at these parameters
      (D = 2^40 against residues and x-coordinates below 2^20); the join predicate
      is exact group equality. The premise of DEC-20260801-003 finding (iii) is
      therefore UNCHANGED by this run (RT048-B5).
    - >-
      N-2 THE U LIMB IS NOT AN INDEPENDENT MEASUREMENT - IT IS A CLOSED FORM IN THE
      PROTOCOL'S OWN MATCHED PARAMETERS. charge_backend_units(4) returns the
      constant 40 and is charged once per enumerated candidate in naive_search and
      once per table probe in split_search, so with both arms at n_usable = 200 the
      charged-unit ratio U is EXACTLY the enumeration-count ratio -
      51703 / 3508544 = 0.014736312270845113 on the additive object and
      47852 / 3265770 = 0.014652593415947848 on the curve, reproducing the reported
      figures to the last digit. Its a-priori expectation is
      |signed| / C(|signed|+1, 2) = 2/(|signed|+1) = 2/129 = 0.015504. N cancels,
      THE OBJECT CANCELS, the group law cancels; the prediction contains only the
      signed factor-base size. Both observations sit about 5 percent below that
      object-free number and the residual is COMMON MODE, which is why the ratio of
      ratios is 1.0057. The apparent near-perfect transfer on that limb is entailed
      by construction (RT048-B1; Validator DEF-V2).
    - >-
      N-3 D-2, THE FAVOURABLE BRANCH, WAS ARITHMETICALLY UNREACHABLE AT THIS CELL.
      split_search enumerates right pairs over i <= j on 128 signed elements, so its
      per-target enumeration is hard-capped at C(129,2) = 8256 and its whole-arm
      enumeration at 200 x 8256 = 1,651,200. Against the measured
      n_enum_naive = 3,508,544 that is U <= 0.4706, and that ceiling is attained
      only if the split arm exhausts the table on every target WITHOUT FINDING
      ANYTHING - which fires D-5 for failure to reach 200 relations. U >= 0.9 was
      therefore incompatible with a succeeding split arm ON ANY OBJECT, including a
      hypothetical object with the strongest imaginable Semaev structure. The
      pre-registration was exhaustive over the outcome space but was not
      ATTAINABILITY-CHECKED, so the D-1 landing is WEAK CONFIRMATION on the U limb.
      The W limb was genuinely free and D-4 was reachable (RT048-B2).
    - >-
      N-4 THE WALL RESIDUAL IS OBJECT ARITHMETIC COST, NOT RESIDUAL STRUCTURE. The
      1.52x gap between W and W_real is reproduced to 0.6 percent by the fact that a
      curve addition costs about 2.4 times a modular addition on this host, diluted
      on the split path by object-free hashing (E-4, RT048-B3). There is no residual
      for structure to occupy - and equally none for the AN-4 factor-base-policy
      confound to occupy. The D-1a "within a factor of 2" test was passed by an
      object-cost coincidence, not by anything about structure.
    - >-
      N-5 NO S1_met, NO F1_met, NO structure_gate_passed, NO SUPPORT, NO
      REPLICATION, NO ASYMPTOTIC OR CRYPTO-SCALE CLAIM, NO AFFECTED-SCHEME
      STATEMENT, NO HEUR-DS-1 VALIDATION OR REFUTATION. H-DS-001 requires R < 0.5 at
      B >= 64 on at least TWO bit sizes among {16,20,24}; this package supplies ONE.
      The AGENTS.md state machine requires `replicated` before `supported`.
      is_B_smooth was not called once. All four asymptotic promotion gates G1-G4
      remain OPEN and no assembled exponent is computed anywhere in the package.
    - >-
      N-6 NOTHING HERE SUPPORTS REJECTING H-DS-001 OR CLOSING THE LANE. The
      mechanism generated no evidence in either direction, the favourable branch
      could not have fired, and reject_scoped on a single unreplicated
      empirical_only run is forbidden. Whether Semaev or multihomogeneous structure
      yields any claw advantage beyond generic meet-in-the-middle is ENTIRELY OPEN.
    - >-
      N-7 NO HARDNESS STATEMENT MAY BE READ OFF THE NULL ARMS. A discrete logarithm
      in Z/753848Z is solvable outright by one extended-gcd modular inversion. The
      control measures ALGORITHM COST ONLY and the contract says so; that is not a
      defect of the control, it is the reason its arms carry no hardness content.

  two_proxy_disclosure_weight: >-
    STATED PLAINLY BECAUSE IT CUTS AGAINST THIS RECORD'S OWN HEADLINE. The
    contract's both_proxies_mandatory rule was honoured and every ratio here is an
    ordered pair - but the pair carries LESS CORROBORATIVE WEIGHT THAN A TWO-PROXY
    DISCLOSURE NORMALLY WOULD, because one limb is not a second measurement. Under
    this instrument units_per_enumeration is exactly 40.0 on every arm and every
    object, so U is an algebraic function of the enumeration counts alone with an
    object-free expected value of 2/129 (N-2, Validator DEF-V2, RT048-B1,
    RT048-H4). The DISCRIMINATING limb of the frozen pair is W alone, and W is a
    measurement of Python arithmetic on two objects (N-4). Any sentence saying
    "both proxies agree" must carry this sentence beside it.

  the_only_curve_specific_structure_touched: >-
    x(P) = x(-P), and nothing else. The join key is encode_intermediate(pt[0]),
    which is the identity on both objects, so on the curve the key is an
    x-coordinate shared by P and -P while g and N-g are distinct residues. That is
    worth a factor 2 in distinct table keys (4079 on the curve against 8159 on the
    additive object at identical 8256 entries, both figures independently
    recomputed by the Validator and the Red Team) and approximately zero in
    enumerations. IT IS AN ELLIPTIC-CURVE FACT. IT IS NOT A SEMAEV OR
    SUMMATION-POLYNOMIAL FACT, AND IT IS THE ENTIRE STRUCTURAL CONTENT OF THE
    BATCH-020 MEASUREMENT (RT048-B6).

  an2_ruling:
    id: AN-2
    ruling: >-
      BOTH INHERENT AND A REAL MATCHING DEFECT, BOUNDED AT ABOUT 1 PERCENT, AND IT
      CANNOT CARRY THE TRANSFER. INHERENT - any faithful removal of the curve
      removes the plus-or-minus identification with it; preserving it in Z/N would
      require a quotient key such as min(g, N-g), which is a different algorithm and
      would breach algorithm_invariance. A REAL DEFECT - the join predicate is
      literally 2-to-1 on the curve and 1-to-1 on the null, so "the algorithm is
      identical" is true of the code and not quite true of the induced map. BOUNDED -
      acceptance is on exact group equality, so per-enumeration success probability
      is (table entries)/N on both objects and n_enum is unaffected in expectation,
      confirmed by both objects landing within 5 percent of the object-free U
      prediction; the only cost is about one extra failed equality check per key
      hit, and key hits are about 8256/753848 = 1.1 percent of enumerations, i.e.
      order 1 percent of the split arm's wall against a 52 percent wall gap
      attributed to arithmetic cost. THE CONTROL STAYS FAIR FOR THE D-1 DIRECTION.
    validator_addendum_carried: >-
      VAL-20260801-002 adds two things this record adopts. First, the asymmetry's
      SIGN FAVOURS THE HEADLINE - the additive table's keys are twice as selective,
      so the additive split arm scans fewer candidates per lookup, pushing
      R_matched_null DOWN, in the direction that flatters the transfer reading.
      Second, A LESS ASYMMETRIC OPTION EXISTED AND WAS NOT TAKEN - keying the
      additive table on min(g, N-g) would have emulated the curve's 2-to-1 collapse.
      So this is a design choice with a known direction, not an unavoidable fact,
      and it must be carried into any reading of how CLOSE R_matched_null is to
      R_real. It does not undermine the weaker statement that a large advantage
      survives on a structure-free object.
    unnamed_confound_warning: >-
      AN-2 would have been a LIVE AND UNNAMED confound under D-2 or D-3 - a 2-to-1
      join key is exactly the sort of representation-level structure that could move
      an object-dependent ratio - and the frozen map names it in neither branch.
      That is a drafting gap to carry into the successor protocol.

  charged_unit_undercharge:
    id: RT048-B8
    statement: >-
      build_claw_table performs 8256 group additions, 8256 SHA-256 claw_key calls
      and 8256 dict inserts, and charge_backend_units is never called inside it, so
      U undercharges the split arm's table build entirely. In WALL the build IS
      charged - 0.009157 s of the matched-null split arm's 0.094135 s (9.7 percent)
      and 0.010870 s of the real split arm's 0.136718 s (8.0 percent).
    corrected_values: >-
      Charging the build at the same 40 units per operation adds 8256 x 40 = 330,240
      units, moving U from 0.014736 to 0.017086 on the additive object and from
      0.014653 to 0.017181 on the curve.
    effect_on_branch: >-
      THE BRANCH IS ROBUST TO THIS. Both corrected values remain far below 0.5, so
      D-1 still fires and the objection is recorded as non-decisive rather than left
      looking decisive.

  narrowest_supported_statement: >-
    At exactly one toy cell (curve group order 753848 over p = 752627 with
    prime-order subgroup n = 241, matched null Z/753848Z, 64 unsigned / 128 signed
    factor-base elements on each object, m = 4, seed 101, 200 relations per arm,
    unplanted uniform random targets, smoothness_abort false, backend
    ds001-v2-point-sum-membership+charged-units-v1, one unreplicated run on one
    macOS arm64 host), the identical depth-2 hash-join meet-in-the-middle collected
    200 independently certificate-verified relations on an object with no elliptic
    curve, no x-coordinate and no Semaev structure at a wall ratio of 0.04718 and a
    charged-unit ratio of 0.014736 against the naive depth-3 enumeration, versus
    0.031116 and 0.014653 on the curve measured in the same session on the same
    host; 1200 of 1200 certificates re-verified across six arms through three
    independent verifier paths; no arm capped; both decision-bearing split arms
    amortizing their claw table exactly once. The charged-unit limb of that
    comparison is a closed form in the signed factor-base size with expectation
    2/129 = 0.015504 and no dependence on the object, and the entire 1.52x wall
    difference is reproduced to within 0.6 percent by the per-enumeration cost of
    curve addition against modular addition recovered from the same four arms. The
    measurement is therefore SILENT about Semaev or multihomogeneous structure on
    BOTH objects, for the reason recorded in H-DS-001's own mechanism_test_status
    before this run existed. What is established is that the split arm's advantage
    at this cell is generic meet-in-the-middle worth about |signed|/2 in
    enumerations, available on any abelian group with any factor base; and
    consequently that the BATCH-020 R_null = 111.4 licensed no structure reading.
    Nothing here supports S1_met, `support` for H-DS-001, HEUR-DS-1 validation or
    refutation, any asymptotic or crypto-scale claim, any affected-scheme statement,
    or a Pareto win over any baseline - and equally, nothing here supports rejecting
    H-DS-001, closing the lane, or asserting that the mechanism fails, which has
    still never been executed once.

  dominated_by: >-
    Matched Pollard rho, MEASURED on this exact curve instance in this run (CTRL-RHO
    solved with k = 43 in 744 group operations, certificate verified, O(1) memory
    with distinguished points); matched BSGS (MODELED at 32 group operations / 16
    stored elements over the n = 241 subgroup, or 1738 operations / 869 stored at
    the generous full-group figure); ONE EXTENDED-GCD MODULAR INVERSION on the
    matched-null object itself, which solves discrete logarithms in Z/753848Z
    outright; and the GENERIC MEET-IN-THE-MIDDLE baseline, which the split arm
    COINCIDES WITH rather than beats - established twice over, by source reading in
    RT047-B2 and now by an exact object-free formula that predicts its charged-unit
    advantage to 5 percent from |signed| alone. Dominated on time, on memory and on
    stored elements. No axis remains on which either arm wins.
