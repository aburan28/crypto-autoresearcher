      AN-2 key asymmetry at about 1 percent of the split arm.
    - >-
      E-3 PACKAGE INTEGRITY TO AN UNUSUALLY HIGH STANDARD. VAL-20260801-002
      extracted both harvest functions by AST and reproduced the archived unified
      diff character-for-character; reproduced all ten kernel per-function
      SHA-256 and all three file hashes; confirmed ds001_driver.py and
