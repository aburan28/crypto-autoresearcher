  sota_delta: >-
    Approximately -9,180 percent on TIME against matched measured rho for relation
    collection alone on the curve (69,010 versus 744 group operations, 92.8x worse);
    approximately -51,500 percent on MEMORY against modeled BSGS (8,256 claw-table
    entries versus 16 stored elements, or 9.5x against the 869 full-group figure);
    and on the null object, 47,516 rho-equivalent operations of relation collection
    against a problem solvable outright by one modular inversion. THE ONLY POSITIVE
    DELTA ANYWHERE IN THE PACKAGE IS INTRA-EXPERIMENTAL - the split arm is 32.1x
    cheaper in wall and 68.2x cheaper in enumerations than the naive arm of the same
    harness on the curve, and 21.2x / 67.9x on the additive object - and that is not
    a published baseline, is not a state of the art, and is PREDICTED TO 5 PERCENT
