  inference: >-
    RUN-DS-001-ctrl-matched-null is an ADMISSIBLE toy-tier, empirical_only control
    receipt that fires the pre-registered D-1a branch on its stated condition. It
    establishes, on a second object and with 400 independently re-verified
    certificates on that object, that the split arm's advantage at this cell is
    generic meet-in-the-middle available on any abelian group, and it retires the
    BATCH-020 R_null = 111.4 structure reading. It establishes nothing about the
    H-DS-001 mechanism in either direction, because that mechanism was not exercised
    on either object. The honest one-line summary of BATCH-021 is that THE
    INSTRUMENT, NOT THE HYPOTHESIS, HAS BEEN REFUTED. Official disposition is
    `weaken`, scoped exactly to the interpretive claim that the measured R evidences
    Semaev or multihomogeneous structure (DEC-20260801-005).

  boundaries:
    - >-
      Toy tier only, one cell - p = 752627 (20-bit field), prime-order subgroup
      n = 241 (about 7.9 bits), matched null Z/753848Z, B = 64, m = 4, seed 101, one
      unreplicated run, one host. Not medium, not crypto, not a scaling study.
    - >-
      Backend is exact point-sum membership with a constant 40-unit charge, NOT a
      Groebner or resultant solve. The naive-versus-split comparison under a real
      algebraic membership backend remains entirely unmeasured, and that is the
      single largest reason no literature-relevant statement is available.
    - >-
      R is a wall-clock ratio of Python procedures; the charged-unit ledger is a
      candidate counter, not an operation count. Neither proxy is a defensible cost
      model, and the two are not independent.
    - >-
      Single unreplicated empirical_only set - reject_scoped is forbidden
      (docs/claims-and-verification.md, refutation artifacts).
    - >-
      Both objects have about 15.5 expected representations per random target and
      empirical success probability exactly 1.0 on every arm, so the
      inverse-success-probability factor that dominates real index calculus is
      multiplied by one and is structurally invisible. Neither object was measured
      in the regime the hypothesis is about.
    - >-
      No crypto-scale claim, no asymptotic claim, no affected-scheme scope. All four
      asymptotic promotion gates G1-G4 remain OPEN. This applies symmetrically to
      the adverse reading - no deployed scheme is any safer because a toy
      meet-in-the-middle ratio transferred to Z/753848Z.
    - >-
      Does not re-score EV-DS-001, EV-DS-002 or EV-DS-003, does not touch the
      BATCH-020 package, and does not alter H-IC-001 or H-STR-002.

