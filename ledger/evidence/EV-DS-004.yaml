    - >-
      E-4 THE OBJECT-COST-PARITY MEASUREMENT AN-3 SAID WAS MISSING IS RECOVERABLE
      FROM THIS RUN'S OWN NUMBERS. Per-enumeration wall, computed as
      reported_wall_seconds / n_enum - matched_null_naive 5.687e-07 s,
