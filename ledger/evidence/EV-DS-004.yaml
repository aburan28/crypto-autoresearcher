    RT-20260801-008 and re-derived by this Coordinator from the committed per-arm
    fields - real_split_remeasure costs 1078.28 rho-equivalent group operations per
    relation, so the 64 relations index calculus needs before linear algebra can
    start cost 69,010 rho-equivalent operations against the measured 744-operation
