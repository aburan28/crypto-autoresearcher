    RMS 0.085654 at k=2; 0.115914 / 0.133205, RMS 0.124859 at k=5; 1.110033 / 0.616119, RMS 0.897713
    at k=10; 4.062817 / 1.894927, RMS 3.169955 at k=17. ALL SEVEN COMMITTED-VALUE VERIFICATION GROUPS
    RAN BEFORE ANY NEW NUMBER WAS REPORTED, evidenced in hash-bound stdout.log ordering, at tolerances
    design.md froze in advance (1e-12 for V1/V2, 1e-4 for V3, 1e-3 for V4/V5/V6), and all six pipeline
    groups PASS. THE VALIDATOR FOUND NO EVIDENCE OF TUNING and states there is no array selection,
