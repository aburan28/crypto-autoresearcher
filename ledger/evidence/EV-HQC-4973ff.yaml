  observations:
  - >-
    O1. WHAT IS UNDER REVIEW, WHAT AUTHORIZED IT, AND THAT THE FREEZE CLAIM WAS VERIFIED RATHER THAN
    ACCEPTED. DEC-20260817-2b638b's next_actions item (1) authorized exactly one follow-up task;
    BATCH-dd0901 dispatched it as TASK-20260817-b4b6e4. THE READING RULE, THE 0.25 FLOOR, THE FACTOR 2,
