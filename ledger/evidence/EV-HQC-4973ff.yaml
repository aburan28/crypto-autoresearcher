    4bde2277a14a7007fbd322765155d997f59c9207, before any producer artifact existed -- the Red Team
    verified this directly with git diff-tree and records the freeze claim as verifiable and verified
    (a narrowing of that claim, which is real and material, is O10). NOTARIZATION VERIFIES IN BOTH
    DIRECTIONS, INDEPENDENTLY, TWICE: snapshot commit 48d384e0e49555d438e121dfd15e0f7f402b5107 exists,
    is reachable, has the declared parent, and adds exactly 13 paths ALL status A (12 producer
    artifacts + the receipt), with 12 of 12 declared path_sha256 matching the committed blobs and a
    reverse walk of the producer write_scope finding exactly those 12 and no undeclared file. The
    Validator additionally disclosed that HEAD advanced by two commits from another session during its
    review and re-verified afterwards that 48d384e0e is still an ancestor, that all 12 hashes still
    match there, and that none of the twelve producer artifacts is touched by the diff. Contract path:
    the dispatch orientation, the committed task card, the committed handoff, the committed
    dispatch_queue.json and batch.yaml's review_write_scope clause ALL name
    .../reviews/<TASK-ID>/, so unlike BATCH-91929e no precedence question arose. One cosmetic
    inconsistency, noted by both and recorded in one line: declared_path_count is 13 while
    path_sha256 carries 12 entries, consistent with the receipt's own stated "excludes itself"
    convention. No artifact is missing or unhashed.
  - >-
    O2. VALIDITY GATES, WHICH DOMINATE THE READING RULE, TAKEN FIRST. THE ZERO-DECODER-CALL GATE IS
    ESTABLISHED AS A CONSTRUCTION, NOT AS AN ASSERTION, AND ALL THREE MODULE PINS ARE UNCHANGED.
    decoder_calls_made is 0 of 0 authorized; both counters {stage_a._t_shard, stage_a.decode_blocks}
    are exactly 0 at exit; all three pinned modules re-verify UNCHANGED on disk at exit. The Validator
    did not take this on the manifest's word and established it structurally: PART A imports no pinned
    decoder module at all, so a call is impossible there; PART B's tripwires replace the LOADED module
    object's attributes with wrappers that increment and immediately raise -- THEY NEVER DELEGATE --
    installed before the selftests, before the cost probe and before any replicate; THE SHARPEST
    BYPASS IS STRUCTURALLY ABSENT because matched_pair.py contains no import of stage_a anywhere and
    receives the module as an explicit parameter, so no second unpatched module object can exist;
    both fail-closed selftests were read and neither can reach a decoder (one raises before
    exec_module, the other raises inside the wrapper before the line that would have called);
    import-time execution was checked and stage_a's only module-level call-bearing statement is the
    __main__ guard, which does not fire under the load name used. The Validator re-measured all three
    pins ON DISK with shasum and got the declared values, confirmed all three clean in git with last
    modifying commits long predating the run; the Red Team re-verified all three itself before AND
    after its own probe. NO VALIDITY GATE FAILED AT THE BATCH LEVEL AND NO INFRASTRUCTURE EVENT OF ANY
    KIND OCCURRED. protocol_deviations is empty and the Red Team verified that as true.
  - >-
    O3. THE PER-CELL VALIDITY OUTCOME, NAMED INDIVIDUALLY AS THE RULE REQUIRES: TWO OF THE FOUR
    HISTORICAL CELLS ARE DATA-AVAILABILITY OUTCOMES AND ARE GOVERNED BY BRANCH I. The frozen
    fail-closed reconstruction gate (recompute alpha_17 from the arrays actually selected and require
    agreement with that cell's committed k=17 value to within 1e-12 absolute) returned: shard 8001
    regime N PASS, recomputed -0.26824951570854555 against committed -0.2682495157085447, residual
    8.327e-16; shard 8002 regime N PASS, recomputed -0.8662355237627501 against committed
    -0.8662355237627483, residual 1.887e-15; SHARD 5000 REGIME P FAIL, recomputed 2.8360981651225576
    against committed 2.836, residual 9.8165e-05; SHARD 6000 REGIME P FAIL, recomputed
    1.4019206406015738 against committed 1.402, residual 7.9359e-05. THE TWO FAILING CELLS ARE
    INFRASTRUCTURE-CLASS DATA-AVAILABILITY OUTCOMES UNDER AGENTS.md RULE 5 AND ARE NEVER NEGATIVE
    MATHEMATICAL EVIDENCE ABOUT k, THE SHARDS, THE REGIMES, THE ESTIMATOR OR HQC. Their low-k values
    are WITHHELD and appear as literal null at every k -- not missing, not dropped, not estimated,
    not fabricated. PRODUCER CONDUCT VERIFIED CLEAN BY BOTH REVIEWS INDEPENDENTLY:
    mapping_was_adjusted_or_searched is false, no trace of an alternative pairing exists in the code,
    results or logs, the 1e-12 verdict was left standing as THE verdict, and the subordinate half-ulp
    diagnostic is explicitly walled off from gate_pass. The Red Team states that the executor's conduct
    is the cleanest in this campaign to date and that nothing in its report is an objection to the
    executor.
  - >-
    O4. THE GATE COULD NOT FIRE IN EITHER DIRECTION, AND THIS IS THE AUTHORING COORDINATOR'S DEFECT,
    NOT THE EXECUTOR'S. Both reviewers reached this by different exhaustive searches, neither seeded
    from the Coordinator's mapping. ON THE TWO FAILING CELLS THE GATE WAS UNPASSABLE BEFORE ANY DATUM
    EXISTED: +2.836 and +1.402 exist in this repository ONLY at four significant figures, originating
    in coordination/goals/GOAL-HQC-001/batches/BATCH-0e126d/reviews/TASK-20260814-a49f1c/red_team_report.md
    LINE 129 -- a review table -- and carried at that same precision into EV-HQC-469c08 O6; a
    repository-wide search at the snapshot commit finds NO fuller-precision form anywhere outside the
    producer's own artifacts. A 1e-12 ABSOLUTE gate against a four-significant-figure decimal passes
    only on a measure-zero coincidence, for the true mapping as surely as for a false one, so ZERO of
    114 physical pairings reproduce either target at 1e-12 and the FAIL carries NO INFORMATION about
    array selection in either direction. ON THE TWO PASSING CELLS THE GATE VERIFIED A TRANSCRIPTION,
    NOT A RECONSTRUCTION: TASK-20260815-e61cca's own committed JSON already records, per shard, both
    inputs (se_paired_committed_k17 = 0.024506333220408173, se_paired_new_k17 =
    0.029514095961871902), the method string and the ANSWER (-0.2682495157085447), so re-executing
    the same expression on the same two numbers and agreeing at 8.3e-16 is what float64 does when you
    evaluate one expression twice. THERE WAS NEVER A RECONSTRUCTION HYPOTHESIS FOR THOSE TWO CELLS:
    THE SOURCE FILE STATES THE PAIRING. The Red Team classes this as the same defect family as
    EV-HQC-e458ef O11's algebraic tautology, one level up -- not an identity true for any input, but a
    recomputation whose inputs the source already recorded. batch.yaml's claim that the gate "proves
    the array selection is the right one" is TRUE AT 16 DIGITS AND FALSE AT 4, and is narrowed
    accordingly by DEC-20260817-2fb269.
  - >-
    O5. THE MAPPING IS NONETHELESS CORRECT FOR ALL FOUR CELLS, ESTABLISHED INDEPENDENTLY OF THE GATE
    -- AND AT THE PRECISION THE COMPARATORS ACTUALLY CARRY, THE RESIDUAL DOES NOT IDENTIFY IT.
    UNIQUENESS AT 1e-12 ON THE TWO N CELLS IS GENUINE AND DECISIVE: of 114 physical pairings (228
    ordered) over all 19 committed per-k se_paired arrays plus the eight fresh windows, exactly ONE
    reproduces shard 8001's committed value (the batch.yaml pairing; next best misses by 3.698e-03,
    five orders worse) and exactly ONE reproduces shard 8002's (next best 1.351e-02). BOTH REVIEWERS
    INDEPENDENTLY FOUND THAT (6000, P) ADMITS A SECOND PAIRING AT 5e-4, THE HALF-ULP OF THE PRECISION
    THE P COMPARATORS ACTUALLY SUPPORT: besides the intended a79e4f/stage_1/shard_6000 ->
    8bbdd2/shard_6000 (alpha 1.4019206406015738, residual 7.94e-05) there is
    a79e4f/stage_1/shard_5000 -> a79e4f/stage_2/POOLED (alpha 1.4023391930803442, residual 3.39e-04).
    The competing pairing is semantically absurd -- wrong shard, pooled instead of per-shard,
    n_batches 400 instead of 200, wrong T_hi -- AND THAT IS EXACTLY THE POINT: WHAT IDENTIFIES THE
    MAPPING AT FOUR SIGNIFICANT FIGURES IS SEMANTICS THE GATE NEVER EVALUATES, NOT THE RESIDUAL THE
    GATE DOES EVALUATE. WHAT DOES ESTABLISH THE MAPPING, and is the Validator's own independent
    construction, is a route the producer had open and did not use: THE SAME SOURCE TABLE RECORDS THE
    UNDERLYING SE INPUTS TO SIX DECIMALS -- shard 5000: 0.125106 -> 0.017520; shard 6000: 0.149899 ->
    0.056725 -- and the arrays batch.yaml names round to EXACTLY those six-decimal values
    (0.12510552702230288, 0.017519668259777004, 0.14989868948535928, 0.05672541366346499), while that
    table's prose independently states the very provenance batch.yaml reconstructed. THE MAPPING IS
    CORROBORATED TO SIX SIGNIFICANT DECIMALS BY A COMMITTED RECORD INDEPENDENT OF THIS BATCH. A GATE
    THAT CANNOT PASS IS NOT EVIDENCE THAT THE MAPPING IS WRONG (Validator, verbatim in substance).
    THE TWO CELLS NONETHELESS REMAIN WITHHELD IN OFFICIAL STATE: the frozen rule is fail-closed, the
    producer applied it correctly, and this archive does not import either reviewer's recomputation of
    the withheld cells into any reading (O7).
  - >-
    O6. THE PAIRED ARRAYS ARE LIKE-FOR-LIKE, AND batch.yaml'S OWN DECLARED PROCEDURAL ASYMMETRY
    CONTAINS A FACTUAL ERROR THAT IS CORRECTED HERE BY SUPERSEDING RECORD. Both reviewers verified the
    metadata directly rather than accepting the producer's summary: T values CONFIRMED (regime P
    5,000 -> 10,000, i.e. the 25->50 jackknife-batch-size step; regime N 10,000 -> 20,000, i.e. the
    50->100 step), per-shard on both rungs of every cell, k range 2..26 with 25 entries on every one of
    the 19 arrays so k=5, k=10 and k=17 are inside every array's evaluable range, and the two T-points
    of each historical cell genuinely disjoint (8bbdd2 discards [0:5000), e61cca discards [0:10000)).
    THE CORRECTION: batch.yaml states the historical cells "differ from each other in jackknife batch
    COUNT reported alongside their arrays". THEY DO NOT. n_batches is 200 for EVERY per-shard array in
    all four source files (400 for every pooled array), matching stage_a.N_JACK_BATCHES = 200, and all
    eight fresh windows are 200 as well. What differs is the batch SIZE, T/200 = 25, 50, 100. The
    producer reported n_batches faithfully per array and did not flag the discrepancy with batch.yaml's
    characterisation; the Validator found it. The error cuts TOWARD this campaign's already-recorded
    fixed-batch-count confound, not away from it. THE STANDING PROCEDURAL ASYMMETRY IS REAL AND
    UNDISCHARGED: in every HISTORICAL cell the two T-points come from different tasks in different
    processes (and, per the producer's own limitation 1, different machines, operating systems, Python
    and numpy versions), while in all four FRESH cells both T-points are sliced from ONE call in ONE
