    to k=2 while the deviation falls only 19.2x. THE COLLAPSE IS A COLLAPSE OF UNITS, NOT OF
    SIGNIFICANCE (O11). The two refutations are NOT the same statement and are not merged: the frozen
    rule refutes the k-explanation on the HISTORICAL half in ABSOLUTE alpha units, fragilely, at a
    10.2% margin against one arbitrary constant; the noise-normalised reading refutes the
    RESOLVABILITY version of it on BOTH halves, robustly against any floor, but resting on a scale from
