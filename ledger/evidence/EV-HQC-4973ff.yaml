      THE ATTEMPT: the 2-point (zero-degree-of-freedom) local exponent of the matched-pair jackknife
      standard error, computed with N_JACK_BATCHES held at 200, is separated from its analytically
      forced value of 0.5 by of order ONE of its own same-T draw-to-draw noise scales at EVERY
      joint-moment order k in 2..26 -- and the ratio does not decay as k falls, it PEAKS near k=4-5.
      Both the deviation and the noise scale are log-ratios of se_paired at order k, so k sets the
      scale of both and they contract together as k falls: from k=17 to k=2 the noise handle falls
      37.0x while the fresh deviation falls only 19.2x. MOVING THE INSTRUMENT TO LOW k THEREFORE BUYS A
      BOUNDED ESTIMATOR AND NOT A RESOLVING ONE. This is a property of a two-point log-ratio of a
      jackknife standard error, not of the shards, the regimes, the defect or HQC.
    quantity: >-
      The dimensionless ratio dev_set(k) / D_RMS(k): the maximum absolute deviation of a cell set's
      2-point local exponents from 0.5, divided by the same-T, same-shard, same-batch-size,
      disjoint-window noise scale of that same statistic at the same order k. Both numerator and
      denominator are measured on the real object from already-committed arrays and require no
      parametric model.
    value: >-
