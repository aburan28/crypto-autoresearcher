    (1) THE MONOTONICITY THAT DECIDES THE HISTORICAL PREDICATE ON A PARTIAL SET IS A MATHEMATICAL
    FACT, NOT AN EMPIRICAL ONE: batch.yaml defines dev_set(k) as a MAX of per-cell absolute
    deviations, and a maximum is non-decreasing in its argument set, so the maximum over the two
    AVAILABLE historical cells is a LOWER BOUND on the maximum over all four. 0.275554 > 0.25 on the
    available cells therefore fixes predicate (i) FALSE for the full four-cell set under every
    possible value of the two withheld cells. THE BRANCH SELECTION USES NO VALUE FROM ANY WITHHELD
    CELL (O8, O9). Found independently by both reviewers.
    (2) Binomial(55, p) + Bernoulli(p) is a sum of 56 i.i.d. Bernoulli(p) and is therefore
    Binomial(56, p) EXACTLY -- proved analytically by the Validator and confirmed by its own
    4,000,000-draw Monte Carlo. The coupled null's marginal identity to BATCH-91929e's arms is
    algebraic, not measured (O13).
    (3) 2p(1-p) is the MAXIMUM last-block disagreement rate achievable by ANY coupling that preserves
    both Binomial(56, p) marginals -- a mathematical fact, established by the Red Team, and the reason
    the null's 0.434647 is not "a" choice of coupling but the extreme one (O15).
    No proof, reduction or counterexample certificate is claimed for anything else.
