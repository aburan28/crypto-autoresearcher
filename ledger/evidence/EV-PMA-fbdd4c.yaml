evidence:
  id: EV-PMA-fbdd4c
  hypothesis_id: H-PMA-001
  question_id: RQ-PMA-001
  goal_id: null
  experiment_ids:
    - EXP-PMA-001
  run_ids:
    - RUN-PMA4-001-a
    - RUN-PMA4-001-b
    - RUN-PMA4-001-c
    - RUN-PMA4-001-d
  type: empirical

  direction: mixed
  direction_note: >-
    H-PMA-001's single `statement` field asserts a bidirectional
    exact-classifier reading, but its own `mechanism` field already
    separates that from a narrower one-directional obstruction-mechanism
    reading, and this run's falsification_criterion has two independent
    directions. A single top-level `direction` value would erase that
    asymmetry, so it is stated per-claim below; the top-level value is
    `mixed` and is not itself load-bearing.
  direction_by_claim:
    - claim: >-
        Direction 1 -- the one-directional obstruction mechanism: an odd
        valuation (or nonsquare residual constant class) in a canonically
        reduced anchor discriminant is fatal to ordinary 4x4 matrix
        existence over k(t).
      direction: supports
      basis: >-
        false_obstruction_count = 0 on both the labeled (52-instance) and
        distinct (14-instance) bases; non-vacuously confirmed on 16 labeled
        / 8 distinct instances (F_7: 3 distinct, Q: 5 distinct), zero
        counterexamples across every decided instance in this run.
    - claim: >-
        Direction 2 -- the bidirectional exact-classifier reading, i.e.
        H-PMA-001 as literally frozen ("the predicate agrees with
        independent brute-force matrix existence on every tested
        instance").
      direction: contradicts
      basis: >-
        false_compatibility_count = 18 labeled / 5 distinct, all from F_5,
        the entirety of the distinct instances that field's grid could
        reach. Independently reproduced by four algorithmically distinct
        methods (Module A/B inside the run; Validator's from-scratch direct
        recomputation; Red Team's from-scratch square-root-search-plus-
        branch-construction; Red Team's from-scratch unconstrained Groebner
        basis over the algebraic closure of F_5(t), basis=[1]). Scoped to
        the narrow, forced repeated-value F_5(t) table family this grid's
        box construction can produce (see `boundaries`), not to F_5
        generically.

  strength: replicated
  strength_note: >-
    Top-level value is the conservative floor across the record's
    components; see `strength_by_claim` for what each rating actually
    attaches to. No component of this record rests on a single
    unreplicated run.
  strength_by_claim:
    - claim: Direction 2's falsification (the mathematical fact itself).
      strength: strong
      basis: >-
        Predefined protocol (specification.yaml's falsification_criterion
        direction 2, written before execution), adequate controls
        (CTRL-PMA4-GROUND-TRUTH, CTRL-PMA4-GROEBNER), a stable effect
        reproduced identically by four algorithmically independent methods
        including one (the Groebner-over-the-closure computation) that
        needs no code from either Module A or Module B, and retained
        artifacts (raw-result.json, both independent review reports). This
        is exhaustive/exact toy-scale computation, not a statistical trend,
        so "strong" describes decisiveness on the tested instances, not
        breadth.
    - claim: Direction 1's support (non-vacuous, zero counterexamples).
      strength: replicated
      basis: >-
        The effect (odd valuation => non-existence holding, zero
        exceptions) was independently reproduced from a clean run by the
        Validator's full, from-scratch recomputation of all 52/14
        instances (not a spot check), including F_7 and Q. Not rated
        `strong` here because, unlike direction 2, no independent method
        outside Module A/B and the Validator's recomputation specifically
        targeted direction 1's non-vacuous instances (the Red Team's two
        extra from-scratch methods were run on the F_5 disagreement, not on
        an F_7/Q obstructed instance).
    - claim: >-
        The labeled-instance sample-size framing ("18/18", "34/52", "the
        entirety of the F_5 grid") as a measure of independent evidentiary
        weight.
      strength: preliminary
      basis: >-
        Corrected down by CORR-20260907-ae8418: the real distinct-instance
        count behind these labels is 3.6-3.7x smaller (5 distinct F_5
        tables behind "18", 14 distinct decided instances behind "52"), and
        every distinct F_5 instance shares one narrow, forced structural
        shape (RT-20260907-0df70c OBJ-1/OBJ-2). The labeled-basis numbers
        remain correct under specification.yaml's literal metric formula
        (which counts "instances", not "distinct instances") and are not
        retracted, but citing them alone as evidentiary weight is not
        warranted.

  claim_tier: toy
  certificate_refs: []

  proof_status: derivation
  proof_status_note: >-
    This is the strongest basis achieved by ANY component of this record,
    attaching specifically to direction 2's falsification (see
    proof_status_by_claim). It is not a claim that direction 1's support
    rests on the same basis.
  proof_status_by_claim:
    - claim: Direction 2's falsification (scoped to the tested F_5 family).
      proof_status: derivation
      proof_refs:
        - experiments/EXP-PMA-001/reviews/RT-20260907-0df70c.yaml#independent_verification.method_4_groebner_no_normalization
        - experiments/EXP-PMA-001/runs/RUN-PMA4-001-b/raw-result.json
        - experiments/EXP-PMA-001/runs/RUN-PMA4-001-c/raw-result.json
      note: >-
        The unconstrained (no WLOG diagonal-conjugation normalization)
        12-unknown, 11-equation Groebner basis computation over the
        algebraic closure of GF(5).frac_field(t), returning the trivial
        ideal (basis = [1]), is a written, self-contained, independently
        checkable argument that no 4x4 matrix realization exists for the
        tested F_5 instance -- even over the algebraic closure, strictly
        stronger than "no matrix over F_5(t)". Per
        docs/claims-and-verification.md's refutation-artifact hierarchy
        this is a derivation note, not a machine-checked proof of a general
        theorem: it is checkable by an independent reader step by step and
        is archived alongside the analysis, but it establishes the result
        only on the specific tested instance and its structural siblings,
        not a general claim about F_5(t) or any other field.
    - claim: Direction 1's support (non-vacuous, zero counterexamples).
      proof_status: empirical_only
      proof_refs: []
      note: >-
        A confirmed absence of counterexamples across every tested
        instance, not a general argument that no counterexample can exist
        beyond the tested grid. Declared empirical_only rather than
        implied stronger.

  proof_refs:
    - experiments/EXP-PMA-001/reviews/RT-20260907-0df70c.yaml
    - experiments/EXP-PMA-001/runs/RUN-PMA4-001-b/raw-result.json
    - experiments/EXP-PMA-001/runs/RUN-PMA4-001-c/raw-result.json

  observations:
    - id: O-1
      text: >-
        Labeled-instance basis (as originally committed,
        RUN-PMA4-001-d/raw-result.json): predicate_bruteforce_agreement =
        34/52 = 0.6538461538461539; nonvacuous_obstruction_count = 16
        (F_7:10 + Q:6); false_obstruction_count = 0;
        false_compatibility_count = 18 (all F_5);
        existence_witness_verification_failures = 0.
    - id: O-2
      text: >-
        Distinct-instance basis (CORR-20260907-ae8418, grouped by full
        d_values dict, no rerun, independently verified twice by the
        Coordinator and matching RT-20260907-0df70c exactly both times):
        n_decided = 14 (F_3:1, F_5:5, F_7:3, Q:5); n_agreement = 9 (F_3:1 +
        F_7:3 + Q:5); predicate_bruteforce_agreement_distinct = 9/14 =
        0.6428571428571429; nonvacuous_obstruction_count_distinct = 8
        (F_7:3 + Q:5); false_compatibility_count_distinct = 5 (all F_5's 5
        distinct tables); false_obstruction_count = 0 on either basis.
    - id: O-3
      text: >-
        Root cause of the labeled/distinct gap (grid_data.py,
        allowed_values(field_label) = list(range(2, q))): a finite field
        F_q's parameter box has exactly q-2 elements, so every instance can
        realize at most q-2 distinct d_S values across the 15 subsets that
        need one, cyclically repeated. F_3 (q-2=1) collapses completely
        (already disclosed pre-correction); F_5 (q-2=3) and F_7 (q-2=5)
        collapse partially (not disclosed until CORR-20260907-ae8418); Q's
        45-element box gives near-full diversity (5 of 6 instances
        distinct).
    - id: O-4
      text: >-
        The widening fallback (grid_data.py:widening_instance) calls the
        identical box-construction function as the base grid and is
        therefore a dead no-op for any field whose box is smaller than the
        15-subset assignment stride's period (F_3, F_5). Confirmed
        concretely: F_5's 8 "widened" instances collapse into the same 5
        distinct tables already present in the base+perturbed grid; no 6th
        table appears. This is not among execution-report.yaml's disclosed
        protocol_deviations and predates the archiving session
        (CORR-20260907-ae8418 item 3, RT-20260907-0df70c OBJ-3).
    - id: O-5
      text: >-
        Independent replication of the F_5 disagreement by four
        algorithmically distinct methods on the same instance (F_5 grid
        index 0): (i) Module A (parity_predicate.py, factorization-based
        squareness test) verdict NOT_OBSTRUCTED_BY_THIS_GATE; (ii) Module B
        (existence_decider.py, coefficient-matching constructive square
        root + 8-branch enumeration) verdict NOT_EXISTS; (iii) Red Team's
        from-scratch brute-force polynomial square-root search over
        GF(5)[t] plus an independently re-derived 8-branch matrix
        construction, 0/8 branches match, reproducing raw-result.json's own
        branch_log mismatch pattern branch-by-branch; (iv) Red Team's
        from-scratch unconstrained Groebner basis computation over the
        algebraic closure of GF(5).frac_field(t) (12 unknowns, 11
        equations, no WLOG normalization), basis = [1] (trivial ideal): no
        solution exists even over the algebraic closure.

  inference: >-
    H-PMA-001's single frozen statement conflates two logically distinct
    claims that this run's own falsification_criterion already separates.
    Direction 1 (necessary-condition obstruction mechanism) is unrefuted
    and non-vacuously confirmed with zero counterexamples across every
    decided instance (52 labeled / 14 distinct). Direction 2 (bidirectional
    exact-classifier reading, H-PMA-001 as literally frozen) is decisively
    falsified, but scoped to a narrow, forced structural family: all 5
    distinct F_5 instances tested share the identical shape forced by F_5's
    3-element parameter box (3 distinct rational functions, each repeated
    across 5 of 15 subsets) -- the only shape this grid's construction
    could produce for F_5, not a representative sample of F_5(t)'s
    reciprocal-minor instance space. H-PMA-001's own pre-registered
    `interpretation_limits` ("necessary, not sufficient") anticipated
    exactly this outcome; RT-20260907-0df70c OBJ-5 confirms this is a
    confirmation of a declared risk, not a surprise. The correct evidentiary
    reading keeps the two claims distinct rather than collapsing them into
    one verdict on H-PMA-001 as a whole.

  boundaries:
    - >-
      Toy scale throughout (claim_tier: toy); certificate.kind: none in
      every run; no ECDLP, relation, source-to-scalar, or
      standardized-curve claim is made or implied.
    - >-
      Direction 2's falsification is scoped to the narrow, forced
      repeated-value F_5(t) table family (RT-20260907-0df70c OBJ-2), not to
      "F_5" generically. Whether it holds for a non-repeating F_5(t) table,
      or at any other field, is untested; CORR-20260907-ae8418's
      next_action names F_11/F_13 (q-2 >= 9) or a non-repeating-value table
      as the concrete, not-yet-executed follow-up.
    - >-
      Direction 1's support is scoped to the 14 distinct decided instances
      tested (F_3:1, F_5:5, F_7:3, Q:5). F_3 and F_5 are structurally
      box-collision-limited (RT-20260907-0df70c OBJ-1), so the
      strongest non-degenerate confirmation of direction 1 rests on F_7's 3
      distinct and Q's 5 distinct instances (8 total nonvacuous), not the
      labeled count of 16.
    - >-
      OBJ-5 (RT-20260907-0df70c): H-PMA-001's own frozen
      interpretation_limits pre-anticipated the sufficiency failure as the
      likely outcome before this experiment ran; this finding confirms a
      declared risk rather than discovering a new one.

  unresolved_confounds:
    - >-
      Whether the F_5 sufficiency failure is a field-specific artifact
      (e.g. an interaction between F_5's small residual-class structure and
      the square-root machinery) or reflects a more general gap in the
      three-anchor-discriminant necessary condition applicable at any field
      or table shape is not decided by this run; analysis.md's original
      text explicitly declines to claim either. The discriminating
      follow-up (F_11/F_13, or a non-repeating-value table) is recommended
      but not yet designed or executed.
    - >-
      The widening fallback is a dead no-op for F_3 and F_5 as implemented
      (OBJ-3 / CORR-20260907-ae8418 item 3); this experiment's non-vacuity
      conjunct for those two fields never got the benefit of a genuinely
      enlarged parameter box, so their non-vacuity coverage (F_3: n/a, F_5:
      n/a -- F_5 was never non-vacuous in the OBSTRUCTED sense) should not
      be read as having exhausted a wider search.

  obstruction:
    statement: >-
      A divisor-parity / residual-square-class predicate that certifies
      only the three anchored orientation discriminants' squareness in
      k(t) is not sufficient for ordinary 4x4 principal-minor matrix
      existence: a prescribed table can pass the predicate (all three
      anchor discriminants square, verdict compatible) while having no 4x4
      matrix realization at all, even over the algebraic closure of k(t).
    quantity: >-
      false_compatibility_count_distinct (predicate NOT_OBSTRUCTED_BY_THIS_GATE,
      independent decider NOT_EXISTS, independently confirmed over the
      algebraic closure by an unconstrained Groebner basis computation).
    value: >-
      5 of 5 distinct F_5(t) instances tested in the narrow repeated-value
      table family this grid's box construction can reach (100% within
      that family, zero counterexamples to the sufficiency failure across
      every instance tested there); 0 of 9 distinct instances tested
      outside that family (F_3:1, F_7:3, Q:5) showed this failure mode.
    measured_by:
      - RUN-PMA4-001-b
      - RUN-PMA4-001-d
      - experiments/EXP-PMA-001/reviews/RT-20260907-0df70c.yaml
    scope: >-
      F_5(t) reciprocal-minor tables of the exact frozen form
      p_S = (t+1)/(t+d_S), restricted to the narrow repeated-value family
      forced by F_5's 3-element parameter box (exactly 3 distinct rational
      functions, each repeated across 5 of the 15 subsets) -- the only
      shape this specific grid's construction could produce for F_5. Not
      claimed for any non-repeating F_5(t) table, any other field, or any
      generic-family, all-size-PMA, or asymptotic question.
    resource_check:
      examined: true
      reading: >-
        No theory currently active in this program takes "divisor-parity /
        residual-square-class necessity without sufficiency" as its own
        premise or resource; H-PMA-001's own mechanism text already
        anticipated exactly this outcome as a known limitation of the
        predicate, so this obstruction confirms a pre-declared boundary
        rather than discovering a new one. The candidate reading under
        which this measurement becomes a resource rather than a dead end:
        a future two-stage classifier that uses the parity predicate only
        as a fast, cheap NECESSARY-condition pre-filter (screening out
        instances an odd valuation already kills) and defers to a slower,
        sufficient-condition confirmation -- e.g. the mask-15 four-minor
        gate H-PMA-001's own interpretation_limits already names as an
        independent requirement -- only on the instances that pass the
        filter. Under that reading, "parity alone is insufficient" is the
        reason a two-stage architecture is justified, not evidence against
        the filter's usefulness. No such record exists yet in this
        repository; this is recorded as a candidate reading, not an
        existing spawned resource.
      spawned_ids: []

  reviewed_by: coordinator
  review_refs:
