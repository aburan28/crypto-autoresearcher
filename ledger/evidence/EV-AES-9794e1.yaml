evidence:
  id: EV-AES-9794e1
  hypothesis_id: RQ-AES-003
  hypothesis_note: >-
    hypothesis_id carries the QUESTION id, following EV-AES-001..005. No H-*
    record is bound; this batch ran two controls on existing claims.
  experiment_ids: []
  run_ids: []
  task_ids: [TASK-20260803-0764fc, TASK-20260803-cd2b5e, TASK-20260803-a13de8, TASK-20260803-b8e91c]
  type: measurement
  direction: mixed
  strength: weak
  strength_basis: >-
    WEAK, AND NOT BECAUSE THE MEASUREMENTS ARE POOR. The r=4 arm was re-executed
    by an independent validator at the FULL 2^31 trials with its own byte-oriented
    AES, agreeing in every field including the non-obvious trivial_swaps_excluded
    count of 65713. What holds strength down: the batch has ONE independent review
    rather than two, its snapshot archive is NOT dispatcher-verified, and the
    validator's independent re-execution of the 27 RC-8 arms was dropped on budget
    (~10.6 h against 4800 s). Session and implementation independence only, NOT
    model independence under standing basis 0137a051eb5828789eb267fa83c8278086578d4c.
  claim_tier: toy
  claim_tier_basis: >-
    Reduced-round AES-128, r in {2,3,4,5}, one machine, 2^30-2^31 trials per arm,
    27 drawn S-boxes plus AES. Nothing about full-round or deployed AES; no
    comparison to published cryptanalysis in either direction (RQ-AES-003 R3).
  certificate_refs: []
  proof_status: empirical_only
  proof_refs: []
  observations:
    - id: OBS-B6-1
      statement: >-
        THE YOYO ROUND-PROFILE IS SATURATED AT r <= 4 AND r=5 IS NOT A PEAK. r=4
        reads W>=1 on EVERY one of 2^31 trials. The reported "excess 2^30" is the
        ARITHMETIC CEILING of the statistic -- excess is (hit rate)*2^30 and a rate
        cannot exceed 1 -- so it is a restatement of the null model and must never
        be quoted as a magnitude. Measured profile: r=2, 3, 4 all saturated; r=5
        at 13.5x; r=6 at 0.5x. r=5 is THE LAST ROUND COUNT WITH A SUB-SATURATED
        ABOVE-NULL READING.
      status: CONFIRMED by independent re-execution at full trial count
      corrections_this_forced: >-
        The Coordinator's queue asserted a PEAK at r=5: REFUTED. The Coordinator
        and producer then described the profile as MONOTONE DECREASING: OVERSTATED
        -- r=10 is not below r=6. The accurate statement is that it decreases to
        the null and then FLUCTUATES around it. Three successive framings outran
        the data; the measurements did not change.
    - id: OBS-B6-2
      statement: >-
        RC-8's 27 DRAWS RAISE THE PRESERVING-FRACTION LOWER BOUND FROM 0.224 TO
        0.7847 UNPOOLED AND 0.7984 POOLED, AND THE 0.90 TARGET IS NOT MET. Under
        the frozen BATCH-004 criterion (X/v >= 5 AND Poisson tail < 1e-6): 25 of
        27 ALIVE, 2 INDETERMINATE, ZERO DEAD. All 27 S-boxes passed bijectivity
        and 5120 round-trip checks each.
      status: >-
        CONFIRMED, with the governing criterion RULED BY THE VALIDATOR after the
        producer correctly declined to choose. There is no second frozen rule:
        BATCH-005's "at least 5x" form presents itself in its own text as a
        QUOTATION of BATCH-004's and drops the Poisson conjunct while quoting.
        Adopting it after the data are in would be choosing the criterion on the
        data. Recorded in CORR-20260803-2cefa6.
      missed_by: two draws
    - id: OBS-B6-3
      statement: >-
        A THREE-WAY EXACT AGREEMENT ON A RARE-EVENT COUNT. The reproduction arm
        returned BATCH-005's reading exactly -- 14 hits, identical histogram,
        identical by-word vector [4,4,2,4] -- and the validator's independent
        implementation reproduced it again. Three implementations agreeing to the
        integer on a 14-in-2^30 event.
      status: CONFIRMED
      note_from_the_validator: >-
        Recorded as UNDERSTATED in the producer's package, where it appears as the
        third of three observations. It is the batch's strongest single result.
    - id: OBS-B6-4
      statement: >-
        AN UNEXPLAINED STRUCTURAL FACT AT r <= 4. Exactly three of four plaintext
        words are preserved on EVERY trial, and the never-preserved index TRACKS
        THE ACTIVE WORD rather than being index 0 -- under amask=2 the pattern is
        [N,0,N,N]. A null-object control the batch itself lacked, run by the
        validator, drives the statistic from rate 1.0 to W=0 on every trial under
        amask=15, so this is NOT a counting artifact.
      status: CONFIRMED, MECHANISM UNKNOWN
      note: >-
        No mechanism is offered by producer, validator or Coordinator. It is the
        one open object in this campaign with no proposed explanation.
  boundaries:
    - >-
      Nothing here is a statement about full-round or deployed AES, and no
      comparison to published cryptanalysis is made in either direction.
    - >-
      The r=4 saturation is NOT AES-S-box-specific: an arm under a drawn S-box
      saturates identically.
    - >-
      The preserving-fraction bound is 0.78, not 0.90. Any later citation of 0.90
      is citing a criterion this campaign did not freeze.
  unresolved_confounds:
    - The 27 RC-8 arms were not independently re-executed; the validator dropped that on budget and named it.
    - The batch has one independent review, not two.
    - The snapshot archive is committed and hash-bound but NOT dispatcher-verified.
  reviewed_by:
    - TASK-20260803-a13de8 (independent validator; verdict passed; re-executed the r=4 arm at full trial count and ran the missing null-object control)
  reviewed_at: 2026-08-03
  inference:
    policy: coordinator-orchestration-code
    requested_policy: coordinator-orchestration-code
    resolved_model: claude-opus-5
    fallback_used: true
    model_verified: false
    standing_basis: 0137a051eb5828789eb267fa83c8278086578d4c
