evidence:
  id: EV-AES-005
  hypothesis_id: RQ-AES-003
  hypothesis_note: >-
    hypothesis_id carries the QUESTION id, following the convention EV-AES-001..004
    already use in this campaign. GOAL-AES-003 BATCH-001 opened no hypothesis record. RQ-AES-003 is an
    execution-and-certification question whose unit of work is a working attack
    program and a measured cost, not a hypothesis to be raised or lowered. This
    record therefore carries no hypothesis status change and none is implied.
  experiment_ids: []
  run_ids: []
  task_ids:
    - TASK-20260802-902
    - TASK-20260802-903
    - TASK-20260802-904
    - TASK-20260802-905
    - TASK-20260802-906
    - TASK-20260802-907
    - TASK-20260802-908
  type: empirical
  direction: supports
  strength: replicated
  strength_basis: >-
    `replicated` and not `strong`. The load-bearing claims were re-executed by a
    validator session using its own from-scratch implementations, its own keys
    and its own projection words, and the certificate was re-verified under an
    AES the validator wrote from FIPS-197 in-session sharing no code with the
    attack. That is genuine replication. It is NOT `strong`, because the
    replicating session supplies SESSION independence but NOT MODEL
    independence under standing basis 0137a051: every session in this harness
    resolves to one model.
  claim_tier: toy
  claim_tier_basis: >-
    Reduced-round AES-128 at r in 2..7 plus a 4-bit-cell structural analogue,
    on one machine. Nothing in this record asserts anything about full-round or
    deployed AES, and nothing here is a comparison to published cryptanalysis in
    either direction (RQ-AES-003 R3; DEC-20260731-019 ruling 3).
  certificate_refs:
    - kind: key_recovery
      round_count: 5
      cipher: AES-128
      key: eebda21bcee6b9ad9bc7cf8d7df8fce1
      key_origin: generated by the validator with secrets.token_hex(16); present in no prior artifact
      verified_by: >-
        val_aes.py, a pure-Python FIPS-197 AES the validator wrote in-session
        (S-box derived from the GF(2^8) inverse plus the affine map), self-tested
        against FIPS-197 C.1, sharing no code with the attack. 4/4 target pairs
        re-encrypt correctly under the recovered key, 0 mismatch.
      path: coordination/goals/GOAL-AES-003/batches/BATCH-001/tasks/TASK-VALIDATION-001/validation_report.yaml
  proof_status: derivation
  proof_refs:
    - coordination/goals/GOAL-AES-003/batches/BATCH-001/tasks/count5/PREREGISTRATION.md
    - coordination/goals/GOAL-AES-003/batches/BATCH-001/tasks/TASK-VALIDATION-001/validation_report.yaml

  observations:
    - id: OBS-1
      statement: >-
        At r=4 the map from the full 2^32 diagonal coset to the inverse-ShiftRows
        ciphertext diagonal is a PERFECT BIJECTION: max occupancy 1 over 2^32
        inputs and 2^32 buckets, zero colliding pairs.
      basis: derived before measurement, then reproduced exhaustively
      replication: >-
        Producer: 1 full-coset arm. Validator: 2 further full-coset arms on a
        different key AND a different projection word j0, both n=0, max_occ=1.
      resolution: >-
        Not statistical. Exhaustive over the tested coset, so there is no
        detection floor and no p-value is appropriate.
    - id: OBS-2
      statement: >-
        At r=5 the colliding-pair count of the same object is forced to 0 mod 8,
        and the modulus is EXACTLY 8, not 16.
      basis: derived; the derivation's orbit argument was checked line by line
      replication: >-
        Producer: 6 valid full-coset arms, all 0. Dispatching session: 1 arm, 0.
        Validator: 4 further full-coset arms on its own code and keys, all 0.
      the_exactly_8_refinement: >-
        NEW, CONTRIBUTED BY THE VALIDATOR AND NOT PRESENT IN THE PACKAGE. The
        derivation implies n_5 mod 16 must lie in {0,8} and must NOT be forced to
        0. Producer readings mod 16 are {8,0,0,8,0,8,0}; the validator's four are
        {8,8,8,8}. Both residues occur, so the bound is tight rather than merely
        unproven. This is a genuine extra confirmation of the argument.
    - id: OBS-3
      statement: >-
        THE MOD-8 RESIDUE IS NOT A COUNTING ARTIFACT. This was the batch's
        highest-value check: the hypothesis that 0 mod 8 might be forced for ANY
        permutation, which would have collapsed the result entirely.
      basis: refuted deterministically by five independent null readings
      nulls:
        - {arm: PRP_aes10_A, object: 10-round AES as permutation surrogate, n_mod8: 4}
        - {arm: PRP_aes10_B, object: 10-round AES, second key/word, n_mod8: 4}
        - {arm: SIBLING_fd_r5, object: 5-round AES read on the FORWARD diagonal, n_mod8: 6}
        - {arm: r6_A, object: 6-round AES, n_mod8: 7}
        - {arm: r6_B, object: 6-round AES, second key/word, n_mod8: 7}
      why_this_is_deterministic: >-
        A forced property reads 0 with probability 1. A single non-zero null
        reading refutes forcing outright, because a counting identity admits no
        exceptions. No p-value is needed and none is claimed.
      the_validator_s_own_caveat_kept_verbatim_in_spirit: >-
        One of the validator's two balls-in-bins nulls read 0 mod 8. That is the
        expected 1/8 coincidence and is exactly why a single null trial reading 0
        is not evidence of survival. Null arms need >= 3 trials to be readable;
        the validator had 2 per null family, which is thin, and said so. What is
        established is that the residue is NOT FORCED for arbitrary bijections;
        what is NOT established is the shape of the null residue distribution.
    - id: OBS-4
      statement: The property dies at r=6, as the derivation predicts.
      basis: predicted before measurement, then measured
      replication: >-
        Producer 2 arms {7,4}; dispatching session 1 arm {0}, itself recorded as
        a 1-in-8 coincidence rather than survival; validator 2 AES arms {7,7} plus
        80 trials on a scaled structural analogue giving a zero-rate of 0.0875
        against the uniform 0.125.
    - id: OBS-5
      statement: >-
        A certified 5-round AES-128 key recovery over the full unrestricted key
        space, at a MEASURED cost of 25.66 s (producer) / 56.4 s (validator, on
        4 contended cores).
      basis: executed, certified, and re-executed by the validator on its own key
      cost_reference: >-
        REF-A, DEFINITIONAL exhaustive key search. 2^128 single-key trials follows
        from the key length alone and is checkable offline. Priced at the
        package's own measured 3.35e8 enc/s this is 1.02e30 s. The measured
        attack is below it at r=5 by roughly 28 orders of magnitude, and survives
        every omitted end-to-end term the red team identified.
      echo_check: >-
        The red team's most severe finding was that the attack might echo its own
        input key. Checked and NOT SUSTAINED, independently, twice: the validator
        read the attack5 code path and confirmed `recovered_master` is produced
        by key_invert() from surviving candidate sets filtered by the integral
        balance test, with the input key used only to build the oracle; and
        survivor counts per byte collapsed to all-ones only after the second
        structure, which an echo cannot produce.
    - id: OBS-6
      statement: >-
        The 4-round ladder (CAND-ND-1) is a strict COROLLARY of OBS-1, not
        independent evidence.
      basis: >-
        Its plaintext set is a SUBSET of the same diagonal coset and its
        ciphertext word is exactly the same inverse-ShiftRows diagonal. Since the
        r=4 map on the full coset is a bijection, it is injective on every subset,
        so zero collisions at any N is forced. It is the same object measured with
        less data.
      consequence: >-
        OBS-1 and OBS-6 MUST NOT BE COUNTED AS TWO RESULTS. The red team flagged
        the double-counting risk and the validator proved the entailment.
    - id: OBS-7
      statement: >-
        The MINI-AES-64 degree argument is arithmetically correct but its LABEL
        was overstated.
      basis: validator recomputed both algebraic degrees by Moebius transform
      detail: >-
        AES S-box degree 7 on all eight coordinates; MINI 4-bit S-box degree 3 on
        all four. 3^3 = 27 < 32 forces the balance; 7^3 = 343 > 128 makes the
        bound vacuous for every subspace of the AES state.
      the_correction: >-
        deg(F o G) <= deg F * deg G is an UPPER bound. An upper bound below the
        subspace dimension FORCES balance; an upper bound above it forces nothing
        in either direction. The correct statement is "THE DEGREE ARGUMENT does
        not transfer to AES-128", NOT "the property does not transfer". Whether
        AES-128 has a 5-round balance by some other mechanism is left open and is
        not addressed.
    - id: OBS-8
      statement: >-
        GATE-RR78-1 is genuinely superseded, and the supersession is a change of
        OBJECT, not a correction of a measurement error.
      basis: validator's own GF(2) linear algebra over the 128-bit state
      detail: >-
        SR^{-1}(ID_J) has dimension 96 and touches 12 bytes: BYTE-ALIGNED.
        SR^{-1}(M_J), the gate's space, has dimension 96 and touches all 16 bytes:
        NOT byte-aligned. A non-byte-aligned subspace does not commute with the
        byte-wise SubBytes, so the gate's condition never pulled back through it.
      what_is_NOT_retracted: >-
        The gate's readings remain VALID measurements of a well-defined if
        unmotivated statistic. They are uninformative, not erroneous, and are not
        retracted. Its r=4 residue of 5 does not contradict OBS-1 because it
        measured a different statistic.

  inference: >-
    Against the DEFINITIONAL exhaustive-search reference, this batch BUILT, RAN
    and CERTIFIED a 5-round AES-128 key recovery whose cost is measured, and
    DERIVED then exhaustively reproduced two deterministic structural properties
    at r=4 and r=5 whose predicted death round r=6 was also measured. The
    artifact hypothesis that would have collapsed the structural result was
    tested directly and refuted deterministically. RQ-AES-003 target (a) is MET
    AT r=5 AND ONLY AT r=5.

  boundaries:
    - >-
      THE MATERIAL SCOPING CORRECTION, AND IT CHANGES WHAT THESE RESULTS ARE
      ABOUT. The r=4 bijection and the r=5 mod-8 forcing are NOT AES-SPECIFIC.
      They follow from round GEOMETRY alone: any bijective S-box, any
      column-preserving mixing layer with no zero in the relevant entries,
      ShiftRows-style row rotations, and a full diagonal coset. The validator
      confirmed this BY EXECUTION -- uniformly random bijective S-boxes reproduce
      both properties at 120/120 and 120/120 in its scaled analogue. The correct
      description is "a derived deterministic property of any 5-round AES-SHAPED
      SPN, instantiated here on AES-128". These properties distinguish 5-round
      AES from a random permutation but carry NO information about the AES S-box.
      Nothing in the producer package stated this. It does not weaken OBS-1..4;
      it relabels them.
    - >-
      The 6-round key recovery WORKS AND IS DOMINATED. It required 12 hint bytes
      and, by the package's own numbers, costs 69.39 s against roughly 25 s for
      exhaustive search over the same restricted residual. dominated_by:
      exhaustive search over the hinted residual. sota_delta: NEGATIVE. It must
      never appear in a list of successes without that clause (CORR-20260802-003).
    - >-
      The r=7 run is NOT a key recovery and carries no certificate. The final
      round key is supplied as input. It measures how far the peeling extends
      under a hint and nothing more.
    - >-
      The yoyo objects (r=5 and r=6) are UNVALIDATED. The validator ran out of
      budget before re-executing them and said so explicitly, instructing that
      C11 not be treated as validated. The claims in OBS-1..6 do not depend on it.
    - >-
      The ladder's stated 2^-46.2 is a FALSE-POSITIVE RATE, not a distinguishing
      advantage. The number is right and the word was wrong in a way that
      flattered the result.
    - >-
      Novelty is NOT assessed in either direction. No primary source is reachable
      from this environment, so a recollection may be used neither to promote nor
      to dismiss (DEC-20260731-019 ruling 3). This record does not assert that any
      result here is new, and does not assert that any is known.
    - >-
      Toy tier throughout. No statement about full-round or deployed AES.

  unresolved_confounds:
    - >-
      PROTOCOL DEVIATION, REPORTED AND NOT REPAIRED. The count5 preregistration's
      VOID condition V1 required execution to STOP if any PR-A exact positive
      control failed. The r=3 control was void (uint8 occupancy counters saturated
      at a true occupancy of 2^24) and execution did not stop. The producer
      correctly recorded the datum as invalid_measurement, but the stopping rule
      as written was not honoured.
    - >-
      INSTRUMENT RISK, RAISED AND THEN CLOSED. After the void r=3 reading, every
      surviving producer PR-A control predicted ZERO, so the producer instrument
      was never shown able to produce a correct large NON-ZERO count -- a fault
      that systematically undercounts would have passed both. The validator closed
      this by supplying both missing exact controls on its own implementation:
      r=2 gave 9223372034707292160 and r=3 gave 36028794871480320, each an EXACT
      match to the pre-registered prediction, to the last digit of a 63-bit and a
      56-bit integer. The risk is closed; the protocol deviation above is not.
    - >-
      The null residue distribution is NOT characterised. Six null readings
      {4,4,0,1,6,7} refute forcing but are far too few to assert uniformity. The
      validator explicitly declined to claim it.
    - >-
      UNTESTED: the derivation's stated dependence on the mixing layer having no
      zero entry. The validator's candidate zero-entry matrix over GF(2^4) was
      singular and the control did not run.
    - >-
      A cosmetic index-convention sign error exists in count5 PREREGISTRATION.md
      section 3.5 (D-ERR-1). Non-load-bearing: under either convention the map
      from cells to equations is a bijection, which is all Facts 1 and 2 and the
      orbit count require. To be corrected by AMENDMENT, never by editing the
      immutable preregistration.

  reviewed_by: coordinator
  reviewed_at: 2026-08-02
