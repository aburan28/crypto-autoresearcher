  what_this_evidence_is: >-
    A source reading plus an adversarial pass, both zero-new-sampling from bytes
    already in the repository. Its main function is CORRECTIVE: it supersedes the
    reasoning of four observations in EV-MLKEM-eac95b while leaving that record's
    central conclusion standing in narrowed form.

  supersedes_reasoning_in: EV-MLKEM-eac95b
  supersession_note: >-
    EV-MLKEM-eac95b is immutable and is not edited. Observations O-2 (argument
    only), O-4, O-6 and O-7 are superseded HERE by C-1 through C-4 below. Its
    O-1, O-3, O-5, O-8 and O-9 stand unchanged.

  observations:
    - >-
      C-1 (SUPERSEDES the ARGUMENT of EV-MLKEM-eac95b O-2; the CONCLUSION
      survives, narrowed). O-2 argued misspecification because the best
      achievable rms was 0.426 bits "rather than 0". ZERO WAS NEVER ACHIEVABLE.
      The red team's closed-form Poisson counting-noise floor -- no simulation,
      no random numbers, an expectation in closed form, computable in under a
      second -- is 0.3406 bits (n=43) and 0.3276 (n=50) against achieved 0.4257
      and 0.4274. The Coordinator recomputed the ratios: the whole-band excess is
      only 1.25x and 1.30x the floor, which is a weak basis for any
      misspecification claim. THAT ARGUMENT IS STRUCK.
    - >-
      C-2 (THE CONCLUSION SURVIVES ON BETTER EVIDENCE). In the count>=1000
      sub-band the best achievable rms is 0.2406 against a counting floor of
      0.0146 (n=43) and 0.3775 against 0.0152 (n=50) -- ratios the Coordinator
      recomputed as 16.5x and 24.8x. That is unambiguous misfit, owing nothing to
      the tail and nothing to the number zero, and it is STRONGER evidence than
      anything EV-MLKEM-eac95b recorded. The misspecification reading therefore
      survives in narrowed form.
    - >-
      C-3 (ATTRIBUTION CORRECTED, and this matters for what may ever be claimed).
      What BATCH-009 and BATCH-010 fitted is NOT Approximation 4.9's family. It
      is BATCH-009's GAUSSIAN-Phi SURROGATE. EV-MLKEM-eac95b O-2's attribution to
      "Approximation 4.9's family" is struck. The red team supplies a named
      mechanism for the misfit: Upsilon_{n_fft/2-1} with n_fft=8 departs from a
      Gaussian by -0.58 bits at x=5 and CHANGES SIGN at 6.38, so the region
      E(T-t) is not an ellipsoid and its measure is not a pure power of v. The
      surrogate is wrong in a way the source's own (4.10)/(4.11) predicts.
    - >-
      C-4 (SUPERSEDES O-7). The literal (4.18) versus (4.22)/(4.27)
      inconsistency is real and the loci verify byte-exact. But a
      mixture-notation reading dissolves it, and the operative displays favour
      that reading FIVE TO ONE, with (4.23) and (4.29) ill-formed under the
      literal (4.18) reading. EV-MLKEM-eac95b O-7's suggestion that the min(1,.)
      collapse "may be a source defect" therefore FAILS UNDER EITHER READING and
      is struck. The source inconsistency is a notational infelicity, not a
      mathematical defect that BATCH-010's Check B was tracking.
    - >-
      C-5 (SUPERSEDES O-6, and turns a recorded limitation into a fatigue
      report). alpha IS identifiable from the archive to 0.48 percent -- via
      (4.19) against the archived Pgood median, 11964.5 predicted against
      12021.9 archived -- and Phi_dlsc is defined at (4.10). Both blockers that
      kept the Check B magnitude a "scanned bound rather than a number" are
      present in the repository. EV-MLKEM-eac95b O-6's "unattributed" is
      therefore no longer a limitation of the evidence; it is a limitation of the
      work done, which docs/inventor-protocol.md classifies as a fatigue report
      whose honest status is `unverified`. The same check also kills the
      score-scale artifact hypothesis.
    - >-
      C-6 (SUPERSEDES O-4). The resolved band ends at roughly 15 PERCENT of the
      Pgood operating threshold. The tail counter-instance recorded in O-4 is
      therefore doubly irrelevant: it sits in the least informative region of a
      band that does not reach the operating point at all. Recording it
      prominently was correct; treating it as a live counterweight would not be.
    - >-
      C-7 (ARTIFACT TELL AGAINST THE SPECIFIC NUMBERS, not against C-2). The
      argmin drifts MONOTONICALLY, 23.0 -> 18.0 (n=43) and 22.0 -> 17.0 (n=50),
      as noise is progressively removed. Under docs/inventor-protocol.md section
      3 that is the canonical artifact tell: a quantity that fails to stabilise
      when the parameter meant to destroy it is varied. So the specific values
      23.25 and 22.25 in EV-MLKEM-eac95b O-1 must NOT be read as estimates of a
      better exponent. The same drift is simultaneously among the strongest
      evidence for C-2, because a correctly specified family would not drift.
    - >-
      C-8 (D7 PACKAGE DEFECTS). The producer's quotation self-check covers 14 of
      17 blocks, and one uncovered block is not verbatim (the p24 plain line 6
      drops " Therefore, we obtain"). A page-13 quotation cannot have come from
      the declared command, since page 13 is not in the script's
      PAGES_OF_INTEREST. Neither defect touches the (4.18)/(4.22) loci, which
      verify byte-exact, but both are recorded because this task's whole product
      is verbatim quotation.
    - >-
      C-9 (FOUR ARTIFACT HYPOTHESES TESTED AND DISMISSED). The red team tested
      and rejected quadrature error, overdispersion, score-scale slip, and the
      fit protocol as explanations for the floor. They are recorded as tested so
      no successor re-runs them.
    - >-
      C-10 (AN-1 and AN-2 CONFIRMED, AN-2 UNDERSTATED). (4.18) was already in the
      archived extract set, on the same page as (4.22) -- the Coordinator
      verified this directly against the pre-existing file. Both BATCH-009 and
      BATCH-010 had it. AN-2's correction of BATCH-010's UNAVAILABLE findings is
      accepted and the red team judges it understated.

  inference: >-
    Approximation 4.9 is not what was tested. A Gaussian-Phi surrogate was, and
    that surrogate misfits the archived data by 16x to 25x the counting-noise
    floor in the low-noise sub-band, with a named mechanism from the source's own
    (4.10)/(4.11). Everything the program has said about "Approximation 4.9's
    exponent" is therefore about the surrogate's exponent, and the specific
    displaced values are artifact-flagged by their own monotone drift. The
    honest position is that the comparison instrument has been debugged twice and
    still has not tested the object it names.

  boundaries:
    - >-
      Two archived toy-dimension files (q=241, m=40, n=43 and n=50), resolved
      band only, which reaches only ~15 percent of the operating threshold.
    - >-
      Establishes NOTHING about ML-KEM security in either direction, nothing
      about Carrier et al.'s Kyber cost figures, and nothing about Table 5.1.
    - >-
      Not a refutation of Approximation 4.9. The source's own model has still
      never been instantiated in this program; C-3 is precisely the finding that
      it has not.
    - >-
      One adversarial pass, no replication, no independent validation of the red
      team's own counting-floor computation.

