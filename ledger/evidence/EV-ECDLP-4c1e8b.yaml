  scope_statement: >-
    THREE INDEPENDENT REVIEW SESSIONS (reviewer, validator, red-team) audited
    the BATCH-121 analyses and their dispositions. NO experiment ran, NO run
    record exists, and NO claim about prime-field ECDLP hardness, cost, or
    cryptanalytic capability is advanced in either direction. The record asserts
    only what survives independent scrutiny of the committed analyses.

  observations:
    - >-
      PROVENANCE HOLDS: BATCH-121's two analysis documents and the DEC were
      committed together in 32a0d119e (reachable from HEAD and an ancestor of
      origin/main); on-disk blob hashes match the committed blobs exactly for
      all four reviewed paths. The snapshot receipt's parent line names
      `b72cf155`, which does not exist (actual parent 61db44b6); the receipt's
      base-commit line is plausible (`b72cfab78` exists and is an ancestor).
    - >-
      CRITICAL — IDEA-20260805-58b64 CLOSURE IS INVALID. All three reviewers
      independently found the halving-query objection: the adversary computes the
      public scalar [2^-1] = (q+1)/2 in the subgroup of order q, forms
      H = [(q+1)/2]·Q, and queries O_D once, getting O_D(H) = x([2]H) = x(Q).
      This recovers the target x-coordinate in ONE query, independent of the
      doubling-chain length ord_q(2), so the "no sub-rho path" barrier claim
      collapses; ord_q(2) = Omega(sqrt(q)) is moot for oracle power. The
      reviewer executed this on the doc's own q=17 curve and one query returned
      x(Q).
    - >-
      CRITICAL — O_D is EQUIVALENT to the x-coordinate (encoding) oracle:
      x-oracle ⊇ O_D because O_D(P) = f(x(P)), and O_D ⊇ x-oracle by the
      halving identity x(Q) = O_D([2^-1]Q). The companion analysis
      (TASK-20260805-004) classifies the encoding oracle as NON-SIMULABLE
      Tier-3 and asserts Semaev IC is sub-rho with exactly this oracle; the
      closure document (TASK-20260805-005) assumes O_D is GGM-simulable. The two
      committed documents CONTRADICT each other on this point, and
      DEC-20260805-364e9e's "IDEA-58b638 rejected, barrier confirmed" is NOT
      supported by the artifacts.
    - >-
      CRITICAL — the doubling closed-form is WRONG. The document prints
      f(x) = ((3x^2+a)^2 - 8b·x)/(4(x^3+a·x+b)) and claims it was "verified at
      all affine points"; the correct identity is
      f(x) = (x^4 - 2·a·x^2 + a^2 - 8·b·x)/(4(x^3+a·x+b)). The validator found
      the printed form matches true x([2]P) at only 3 of 475 affine points on
      the test curve (q=17, y^2=x^3+3x+7 over F_1009) and the correct form at
      all; the reviewer scanned all 950 affine points and found 944 disagree
      with the printed form (the correct one matches all 950). The claimed
      verifier statement is false as printed. The y-sign cancellation conclusion
      survives (the correct form also has no y), so the rational-function
      structure is right.
    - >-
      "UNCONDITIONAL" LABEL REJECTED AS IS. The L[1/2, sqrt(2)] = 2^61.85 vs
      N^1/2 = 2^128 arithmetic is CORRECT (the document's "≈2^61.7" is a
      rounding of 2^61.85, within "≈"). But "Semaev IC sub-rho UNCONDITIONALLY"
      is not justified: the analysis itself says "with heuristic yield", and
      the label contradicts its own derivation. The DEC lifted the word into a
      finding, which is a scope error, not a mathematical one.
    - >-
      H-PSEUDO biconditional: the corrected orientation ("chain-complex sub-rho
      requires H-PSEUDO FAILURE") matches the hypothesis text H-PSEUDO-83817b
      and the reviewers rate the orientation fix CORRECT in substance, but as an
      iff it overstrengthens KN-FIND-9d2f56, which states a disjunction with a
      silent `o(1)` third branch and proves only one direction. C_t Tier-3
      non-simulability (encoding witness) PASSES. The premise that C_t alone
      suffices for sub-rho is NOT established — factor-base construction cost in
      GGM+C_t is uncharged (sampling hit-rate ~B/p in a pure C_t model).
    - >-
      Multi-target BKK crossover arithmetic VERIFIED: K*(BKK) =
      ceil(s·beta/(1-t·beta)), beta=2/(m+1), region t in [1,(m+1)/2), the m=5,
      s=200, t=0.9 example gives K*(BKK)=ceil(66.67/0.7)=96 (CORRECT) and
      K*(standard)=2000 exactly (the documents print 2001, an IEEE-float
      ceil artifact: 200/0.1=2000.0000000000002). One other cell (m=4,s=200,
      t=0.9: 126 vs 125) is the same class of artifact. The stated ratios and all
      other 34/36 cells are correct; no downstream conclusion changes except the
      exact crossover numbers. The "provable, not heuristic" label overreaches:
      the theorem KN-FIND-c7d31e's speedup applies to a per-attempt membership
      predicate, while transferring beta to BOTH channels is the modelling
      assumption the pre-registered EV-SEMAEV-7f7d22 is designed to measure.
    - >-
      DEC-20260805-364e9e carries two ledger gaps: KN-FIND-9d2f56's wording is
      NOT updated to match the corrected orientation (its corollary still says
      "yield above heuristic = structured additive density"); and its
      "interpretation direction used in DEC-20260804-384a4a" reference is
      DANGLING (no such record exists). The IDEA-58b638 interior record still
      reads `status: proposed` while the DEC claims it "CLOSED as rejected" —
      a ledger-consistency gap; the closure exists only in the DEC.
    - >-
      NO FABRICATED RUNS: the reviewers found no fabricated run records,
      timings, or statistics in the reviewed documents. The false "verified at
      all affine points" sentence is a mathematical error in the stated
      verification procedure, not a fabricated run (validator Check 5 note).

  inference: >-
    BATCH-e0ccb2 fully discharges the missing independent-review obligation on
    the BATCH-121 content and its dispositions. IDEA-20260805-58b638's rejection
    as argued is INVALID (O_D is x-oracle-equivalent and non-simulable, not
    GGM-simulable), so that disposition and the "UNCONDITIONALLY" finding in
    DEC-20260805-364e9e are SUPERSEDED by DEC-20260806-08b9ed. IDEA-20260805-62ef74's
    dispatch survives in substance with the "unconditional" label corrected;
    IDEA-20260805-cd03c approval for experiment design survives with exact
    arithmetic (2000, 125) replacing the float artifacts (2001, 126) before
    EV-SEMAEV-7f7d22 is pre-registered.

  boundaries:
    - This record asserts nothing about ECDLP hardness in either direction.
    - No experiment ran; no run record exists; strength is n/a by construction.
    - The halving-query and formula checks are review-time verification of
      committed records (throwaway scripts), not new research or measurement.
    - The x-oracle-alone question (does the x-coordinate oracle enable sub-rho
      IC?) is NOT answered here; it is exactly the open uncertainty the
      companion track carries.
    - One independent session per role; no closure or breakthrough claim is
      advanced, so AGENTS.md rule 12's review-breakthrough gate is not invoked.

  unresolved_confounds:
    - Whether C_t factor-base construction cost is actually avoidable at crypto
      scale in a literal GGM+C_t model (the reviewer's enumeration-gap
      objection). The "O(1) per relation" equivalence is not established.
    - Whether the corrected biconditional survives a direction-by-direction
      proof; the reverse direction and the o(1) branch are not currently proven.
    - The task-004/task-005 x-oracle contradiction must be resolved in a
      superseding analysis before either side is cited as authoritative.

