evidence:
  id: EV-GGM-001
  hypothesis_id: H-GGM-001
  experiment_ids:
    - EXP-GGM-001
  run_ids: []
  type: theoretical
  direction: supports
  strength: strong
  claim_tier: toy
  certificate_refs: []
  proof_status: derivation
  proof_refs:
    - experiments/EXP-GGM-001/analysis.md
    - experiments/EXP-GGM-001/simulability_test.py
  observations:
    - >-
      9 runs (3 seeds × 3 bit sizes), all completed_valid, dirty: false. The
      simulability test classified 8 subjects (4 controls + 4 augmented oracles).
    - >-
      Control gate: 4/4 correct. pure_generic=SIMULABLE(C=1),
      discrete_log=NON_SIMULABLE, public_curve=SIMULABLE(C=0),
      encoding=NON_SIMULABLE. Test soundness established.
    - >-
      jet_oracle: SIMULABLE with C=1. The eps-block is a deterministic function
      of (P, Q, P+Q, curve_params). Closed at exponent 1/2 by KN-TECH-005.
      Scale-independent mathematical closure (derivation, not empirical).
    - >-
      endomorphism_oracle: SIMULABLE with C=0. phi is public and deterministic
      from curve parameters. Closed at exponent 1/2. Scale-independent.
    - >-
      elliptic_net_oracle: SIMULABLE with O(log N) overhead (NOT O(1)). The net
      value encodes a*P+b*Q, computable via group operations but requiring
      O(log N) ops. Not closed at 1/2 by constant-overhead bound, but no
      sub-birthday advantage.
    - >-
      incidence_oracle: SIMULABLE with O(B^m) overhead (NOT O(1)). Decompositions
      found via brute-force summing. Not closed at 1/2 by constant-overhead
      bound.
  inference: >-
    H-GGM-001 is supported: the simulability test correctly classifies all 4
    controls (4/4) and all 4 augmented oracles. The jet and endomorphism oracles
    are SIMULABLE with O(1) overhead, closing their candidate families at
    exponent 1/2 by theorem (KN-TECH-005). The elliptic-net and incidence
    oracles are SIMULABLE with non-constant overhead (O(log N) and O(B^m)
    respectively), not closed at 1/2 but providing no sub-birthday advantage.
    The endomorphism result contextualizes H-STR-002: the block-structure
    advantage is non-generic (phi is available to the generic model).
  boundaries:
    - >-
      The classification uses the structured GGM (curve equation is public),
      not the strictest Shoup GGM (opaque labels). Under the strictest GGM,
      jet and endomorphism would be NON-SIMULABLE.
    - >-
      The SIMULABLE verdicts for jet (C=1) and endomorphism (C=0) are
      scale-independent mathematical closures (derivation-level), valid at
      all scales. The claim_tier is 'toy' for the witness exhibition only;
      the closures themselves are not toy-tier.
    - >-
      The elliptic-net and incidence oracles are SIMULABLE but with
      non-constant overhead. They are not closed at 1/2 by the constant-
      overhead bound.
  unresolved_confounds:
    - >-
      The O(1) overhead for jet and endomorphism depends on the structured GGM
      assumption (public curve equation). An adversary model that hides the
      curve equation would change these verdicts.
    - >-
      The test operates on oracle specifications, not implementations. Real
      implementations may leak timing or side-channel information outside the
      GGM framework.
  reviewed_by: coordinator
