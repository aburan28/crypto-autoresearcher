  observations:
    - >-
      Both independent reviews verified the requested immutable snapshot,
      producer boundary, and design-only claim ceiling. Neither executed an
      experiment, parser/schema diagnostic, arithmetic verifier, cost model,
      cryptographic computation, or scientific measurement.
    - >-
      V9 materially repairs the decisive v8 C-HELPER contradiction: occupied
      slots recompute to exactly 96 metadata bytes, while factor and matrix
      bytes are placed in a separately framed payload blob and bound by
      offset, length, and digest. Endpoint, owner-stride, event, matrix, and
      output maxima are also finite and arithmetically coherent within their
      stated formulas.
    - >-
      The contract remains incomplete end to end. Nested frame tags and full
      digest preimages are not closed for every named object; the query seed
      omits the universal payload_len field; builder request/terminal overhead
      and terminal-reason bounds are missing; and null/non-null record grammar
      is not fully numeric.
    - >-
      FOE event codes are not mapped one-to-one to a complete schedule, memory
      live ranges lack explicit endpoints, certificate/provider/mirror and
      HNF/output semantics remain underdefined, and paired replay/branch-null
      behavior is not materialized as a replayable artifact.
    - >-
      C-pair and synthetic manifests intentionally contain no measured rows or
      cells and no independent verification receipts. They remain invalid
      admission controls, not negative evidence. INCUMBENT-FOE-v1 remains
      pending_external_measurement with null source, FOE, and memory fields.
    - >-
      The immutable snapshot receipt retains commit_sha:null and
      pending_post_commit status as a provenance caveat. The queue archive
      verifies the reachable snapshot commit and all declared path hashes; the
      receipt was not rewritten.
  inference: >-
    The narrowest supported statement is that EXP-SSI-9d821a materially repairs
    the v8 helper-slot and several finite framing/accounting defects but remains
    an execution-blocking design contract. The reviews support another
    additive clarification and do not support any attack, security, exponent,
    novelty, hypothesis, or goal claim.
  boundaries:
    - Execution remains unauthorized; EXP-SSI-9d821a is review_required, unfrozen, and evidence_eligible=false.
    - No result transfers to EndRing, Isogeny, SQIsign, CSIDH, or deployed security claims.
    - Provider/mirror unavailability, missing controls, missing backend, and absent incumbent measurement are operational/admission conditions, not negative cryptanalytic evidence.
    - The repository validator retains one unrelated WESOVOW manifest error and 1211 grandfathered legacy errors outside this SSI batch.
  unresolved_blockers:
