  observations:
    - >-
      THE HEADLINE M1 RESULT IS DECISIVELY CONFIRMED AND STRENGTHENED: both
      reviewers, working fully independently, discovered the SAME cleaner
      argument than this experiment's own original design used -- rather
      than separately ruling out A_4, D_4, C_4, V_4 by name (requiring a
      completeness check on the subgroup lattice), a single observed
      instance each in classes "4" (4-cycle) and "3+1" (3-cycle) already
      forces the group to be exactly S_4, since S_4 is the UNIQUE subgroup
      of itself containing both. The Red Team additionally showed
      transitivity need not be assumed as a premise: observing a genuine
      4-cycle-type instance directly witnesses a transitive permutation.
      The Validator independently reproduced the ENTIRE exhaustive
      2,050,300-fibre census from scratch (two independent construction
      routes, an independent factorizer cross-checked against sympy,
      1200+16 individually-verified instances, zero mismatches anywhere)
      and additionally ran an unprompted resolvent-block-law control
      (S_4 -> S_4/V_4 = S_3) on 2,020,198 fibres with zero violations.
    - >-
      THE SUBGROUP LATTICE IS CONFIRMED COMPLETE: the Red Team brute-forced
      all 30 subgroups of S_4 and confirmed exactly 5 conjugacy classes of
      transitive subgroups (V_4, C_4, D_4, A_4, S_4) -- the four named
      proper subgroups plus S_4 itself exhaust the possibilities, so the
      original per-subgroup falsification argument was also independently
      confirmed complete, even though the stronger 4-cycle+3-cycle argument
      makes that completeness check unnecessary for the conclusion.
    - >-
      THE ARITHMETIC-VS-GEOMETRIC MONODROMY GAP IS CLOSED FOR THIS DATA:
      the Red Team showed the geometric monodromy G_geom is normal in S_4
      with cyclic quotient (standard theory), forcing G_geom in {A_4, S_4};
      the abundant observed instances in classes 1^4, 2+2, and 3+1 (none
      of which A_4 can produce in the odd-permutation coset pattern
      required) rule out A_4, forcing G_geom = S_4 as well -- i.e. this
      census bears on BOTH the geometric and the arithmetic-at-these-
      specific-primes monodromy question, not only the generic one.
    - >-
      THIS COORDINATOR'S OWN M3 TEST DESIGN HAD A GENUINE DEFECT, NOW
      CORRECTED, WITH NO EFFECT ON THE HEADLINE CONCLUSION: the chi-square
      test (2447.84, df=4) used the wrong (asymptotic) null, ignoring a
      "stratum pooling" confounder the parent idea (IDEA-20260904-ad63fe)
      had already named in advance. The Red Team derived the EXACT finite-p
      null and showed the chi-squares collapse to 0.23-171.67 against it
      (with the C1 residual traced to a specific, identified stratum).
      This Coordinator's own speculative "O(1/sqrt(p)), 3-7x shrinkage"
      explanation for the original anomaly was ALSO shown wrong in its
      specific mechanism (the true effect is O(1/p) and curve-trace-
      dependent, not a universal square-root law) even though its
      bottom-line "this is benign, not structural" conclusion was correct.
      See CORR-20260904-33fbf3 for full disclosure.
    - >-
      A GENUINELY VALUABLE NEW LEAD WAS FOUND, PROPERLY SCOPED AS A LEAD
      AND NOT AS EVIDENCE: the Red Team ran the matched-(t,Z) control the
      parent idea had deferred and found it FAILS -- two curves with
      identical (t,Z) show materially different class-count distributions,
      separated exactly by #E(F_p)[4] (16 vs 8). This is the SAME
      invariant this session's own H-MONO-93bc4d/H-MONO-1d50ac chain
      independently found governs H-MONO-45183a Part B's own missing term,
      now appearing in a wholly different experimental context
      (symmetric-base monodromy structure, not root-multiplicity collision
      rate). A recurring cross-experiment structural theme, named here as
      an open lead for RQ-MONO-001's exceptional-locus half.
    - >-
      MINOR PROCESS NOTES, NONE AFFECTING ANY CONCLUSION: EXP-MONO-0e6e8f's
      own frozen spec asserted controls were present without an actual
      `controls` field; H-MONO-ebd400's own falsification_condition left
