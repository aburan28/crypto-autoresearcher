  # ==================================================================
  # 2. CELL-BY-CELL OUTCOME STATUS -- THE LOAD-BEARING SECTION
  # ==================================================================
  cell_by_cell_outcome_status: >-
    "0 OF 2 CELLS CLEARED" IS TRUE AND IS NOT "TWO MEASURED FAILURES." THE TWO
    CELLS ARE IN CATEGORICALLY DIFFERENT STATES AND MUST NOT BE LUMPED
    TOGETHER, EXACTLY AS THE PREDECESSOR RECORD REFUSED TO LUMP ITS OWN THREE.
    (1) (d=512, beta=55), seed 452658293, at ITS OWN bisected 75 bits --
    A MEASURED MATHEMATICAL FAILURE. Terminal ERROR, "ReductionError:
    b'infinite loop in babai'", after 2502.74 s, peak RSS 141.38 MB,
    subprocess_timed_out false, returncode 0 (it terminated on its own, far
    inside the 14400 s cap), failing at fpylll bkz.py:186 inside a
    doubly-nested svp_preprocessing, on the RANGE-RESTRICTED
    lll_obj(lll_start, lll_start, kappa + block_size) call. This cell was
    FULLY REPRODUCED first-hand by the Validator on a different host, OS,
    Python and numpy: same terminal ERROR, same error string
    character-for-character, same seed, same nine-frame failure path in the
    same order. THIS IS A GENUINE, REPLICATED, NEGATIVE FULL-TOUR OBSERVATION
    AT THIS CELL AT THIS PRECISION -- and see (3) for what it is and is not
    evidence about.
    (2) (d=512, beta=70), seed 915347894, at ITS OWN bisected 73 bits --
    NOT A FAILURE. NOT A MEASUREMENT. NOT_COMPUTED, reason "exceeded
    PER_BASIS_FEASIBILITY_CAP_V3", subprocess_timed_out true, returncode -15
    (SIGTERM), killed at 14400.08 s -- 0.084 s past the cap, inside one 0.5 s
    poll. It did not complete AND it did not raise. Under AGENTS.md core rule
    5 and CLAUDE.md rule 3 a wall-clock kill is INFRASTRUCTURE SIGNAL
    and is never negative mathematical evidence; it contributes EXACTLY ZERO
    to any obstruction measurement. The only supported statement about this
    cell is that it neither completed nor raised within 14400 s; its true cost
    is a LOWER BOUND of 14400 s and is NOT a cost. The Validator could not
    reproduce it -- reproducing one cap-kill needs 14400 s on one cell, which
    alone exceeds that review's entire 12000 s budget -- and said so plainly;
    what it obtained instead is a first-hand `ps` observation at
    2026-08-17T19:23:26Z that a same-cell, same-precision worker was still
    alive at 2799 s having raised nothing. That is a measured lower bound and
    nothing more, consistent with the producer's report and NOT a reproduction
    of it.
    (3) SCOPE LIMIT ON (1), CARRIED FROM THIS GOAL'S OWN PROMOTED FINDING AND
    NOT RE-LITIGATED. Per KN-FIND-f54a82, an isolated LLL/GSO-preprocessing
    probe is measurably MORE numerically permissive than the full BKZ tour.
    The bisected 75 and 73 bits are therefore minima FOR THE ISOLATED STEP at
    one drawn basis each, and are NOT tour-adequate precisions -- which the
    producer states and which its own beta=55 phase (b) result then
    demonstrates. So (1) is a measured failure OF THE FULL TOUR AT THE
    ISOLATED-STEP MINIMUM, which is the least conservative precision in the
    entire tested window. NO d=512 CELL HAS EVER BEEN RUN, BY ANYONE, IN THIS
    GOAL'S HISTORY, AT ANY PRECISION ABOVE ITS OWN ISOLATED-STEP MINIMUM, AT
    ANY BETA. That is a fact about the record, independently established by
    the Red Team (OBJ-3, RT-CTRL-1) and consistent with everything the
    Validator reproduced.
    THE NARROWEST SUPPORTED STATEMENT, adopted verbatim in substance from the
    Red Team's own narrowest_supported_statement: "On one host, fpylll 0.6.4,
    against IntegerMatrix.random(512,'qary',k=256,q=3329) bases drawn from
    SEED_ROOT=715923 at default_rng([715923,0,512,beta,0,0]): the minimum mpfr
    precision adequate for the ISOLATED LLL/GSO preprocessing step is 75 bits
    at seed 452658293 and 73 bits at seed 915347894, each determined by a
    genuine, independent, 1-bit-resolution bisection between a re-confirmed
    failing endpoint (69 bits) and a re-confirmed succeeding endpoint (100
    bits), under a partially-tested interior monotonicity assumption. At 75
    bits the seed-452658293 basis's full BKZ tour (block_size 55) passed the
    initial full-range lll_obj() call, entered a real tour, and raised
    ReductionError('infinite loop in babai') inside svp_preprocessing's
    windowed lll_obj() call after 2502.74 s. At 73 bits the seed-915347894
    basis's full BKZ tour (block_size 70) was still running, without
    completing and without raising any exception, when it was hard-killed at a
    14400 s cap; nothing further about that cell was measured."

  # ==================================================================
  # 3. THE BATCH'S REAL RESULT: TWO INDEPENDENT ROUTES, ONE NEW FINDING
  # ==================================================================
  the_new_finding_two_independent_routes: >-
    THE MOST USEFUL THING THIS BATCH PRODUCED IS NOT THE 0-OF-2 HEADLINE. It
    is that the calibration axis this goal has been reasoning about is
    MISNAMED, established by two reviews on two different instruments, neither
    of which saw the other's work.
    ROUTE A -- STATIC, BY SOURCE INSPECTION (Red Team OBJ-1). In the
    producer's own worker_bisect() (lines 112-158 of
    stage0_d512_beta5570_precision_bisection_and_reattempt.py), `beta` appears
    on exactly three lines: the function signature, the result label dict, and
    np.random.default_rng([SEED_ROOT, 0, d, beta, 0, 0]). The object bisected
    is A = IntegerMatrix.random(d, "qary", k=d//2, q=3329) in both cases --
    no BKZ.Param, no block size, no beta anywhere in the computation. AT THE
    ISOLATED-LLL-STEP LEVEL, beta IS A SEED LABEL AND NOTHING ELSE. The
    identical property holds in the CTRL-1 probe this harness is copied from.
    The Validator's own AST-normalized comparison, run for a different purpose
    (drift detection), independently establishes that worker_bisect() is
    AST-IDENTICAL to that probe's worker(), which is what makes the property
    transfer.
    ROUTE B -- EMPIRICAL, BY RUNNING THE NULL-OBJECT CONTROL THE PRODUCER DID
    NOT RUN (Validator F-3, valprobe3 + valprobe5). Same cell (d=512,
    beta=55), same construction, same SEED_ROOT, same stage and arm indices,
    ONLY the seed formula's free draw_index moved 0 -> 1 (seed 724982883). The
    measured threshold is 71 BITS, monotone over all nine points 69-77,
    against the producer's 75 bits at the SAME cell. THAT IS A FOUR-BIT
    WITHIN-CELL, DRAW-TO-DRAW EFFECT -- TWICE the two-bit cross-beta gap the
    producer's two numbers exhibit.
    WHAT THE TWO ROUTES JOINTLY SUPPORT, AT EXACTLY THIS WIDTH: the reported
    75 and 73 bits are PER-DRAW quantities of two particular drawn bases, not
    per-beta quantities and not properties of the (d, beta) cell. Together
    with the beta=40 draw's 69 bits from BATCH-279acb, this goal now holds
    three draws {69, 73, 75} from what is, at the isolated-step level, ONE
    distribution.
    WHAT NEITHER ROUTE SUPPORTS, STATED SO IT IS NOT OVER-READ: (i) beta IS
    operative at the FULL-TOUR level -- it is the BKZ block size, and OBJ-1's
    argument is explicitly scoped to the isolated step; nothing here says
    beta is irrelevant to phase (b). (ii) The 4-bit effect size rests on ONE
    additional draw per cell and does NOT replicate symmetrically: at (d=512,
    beta=70) the draw-1 threshold (seed 312532458) stays inside (69, 73], so
    that cell shows no comparable shift. Variability is real and asymmetric,
    and the EFFECT SIZE is preliminary, not replicated. (iii) The two reviews'
    agreement here is same-family agreement and is not distinct-model
    corroboration; what carries weight is that the instruments differ, a
    source reading and an executed measurement, and a measurement is not a
    second opinion.
    CONSEQUENCE FOR THIS GOAL'S OWN PROMOTED KNOWLEDGE, RECORDED BY REFERENCE
    AND NOT BY EDIT: KN-FIND-ead2ac names its second recurrence axis "within a
    fixed dimension across `beta`". Route A shows that axis is measured by an
    instrument in which beta does not participate, so the recurrence ead2ac
    observed is ACROSS DRAWS. That SHARPENS ead2ac in the direction of MORE
    hazard, not less -- and the Red Team says so explicitly, affirming rather
    than disputing the finding. KN-FIND-ead2ac.md is immutable and is NOT
    edited by this record; the narrowing lives here and in DEC-20260815-3e8e9c
    and travels by citation. Whether it warrants its own KN-FIND is ruled on
    in DEC-20260815-3e8e9c.knowledge_promotion, with a concrete revisit
    criterion.

  # ==================================================================
  # 4. THE PRECISION RESPONSE THE RECORD READS WITH THE OPPOSITE SIGN
  # ==================================================================
  precision_response_finding: >-
    RED TEAM OBJ-4, WITH THE VALIDATOR'S F-2 CORROBORATING ITS FIRST ROW BY
    INDEPENDENT RE-EXECUTION AND THE VALIDATOR'S F-4 BOUNDING ITS SECOND.
    Define the post-outer-LLL residual = subprocess_wall_clock_seconds minus
    outer_lll_reduction_elapsed_seconds. It is an UPPER bound on BKZ-tour time
    (it also contains interpreter startup, basis generation, GSO.Mat
    construction and update_gso) and it is the identical derived quantity in
    every row, so rows compare to each other. Same cell, same seed, same
    construction, precision the only change:
      (d=512, beta=55): 69 bits (borrowed, BATCH-279acb) -> residual 5.55 s,
        died at bkz.py:123, the FIRST self.lll_obj() call, BEFORE any tour
        began, 3 frames. 75 bits (own bisected, this batch) -> residual
        2089.11 s, entered tour(), ran svp_reduction with two levels of
        recursive svp_preprocessing, died at bkz.py:186, 10 frames.
        RATIO 376.4x, on +6 bits, WITH A QUALITATIVE CHANGE from "never
        entered a tour" to roughly 35 minutes of real tour work.
      (d=512, beta=70): 69 bits -> residual 5.42 s, died at bkz.py:123, never
        entered a tour. 73 bits -> residual >= ~13,992 s and STILL RUNNING
        when killed. RATIO >= 2581x, a LOWER bound, and the outer-LLL
        subtraction here uses the mean of the 7 outer-LLL timings this same
        run measured on the SAME basis (408.15 s) because the killed worker
        never wrote its own -- the Red Team flags this row `estimated: true`
        and this record carries that flag forward.
    INDEPENDENT CORROBORATION OF THE FIRST ROW, BY A DIFFERENT INSTRUMENT:
    the Validator's F-2 reaches the same qualitative conclusion by live
    re-execution rather than arithmetic -- valprobe2b reproduced the beta=55
    cell on a different OS and Python and obtained the SAME nine frames in the
    same order ending at bkz.py:186, with 1104.40 s of BKZ work before the
    failure. So "correct per-draw calibration moves the failure materially
    deeper" is a reproducible property of the computation at 75 bits and not
    an artifact of the producer's host.
    THE CONFOUND THAT BOUNDS THE SECOND ROW, FROM THE VALIDATOR'S F-4, AND
    THIS IS A GENUINE CROSS-REVIEW QUALIFICATION RATHER THAN A CONFLICT:
    beta=70 blocks are far more expensive to enumerate than beta=55 blocks, so
    "raised nothing within 14400 s" at beta=70 is fully consistent with the
    reduction simply not having REACHED the failing kappa window yet, rather
    than being in a qualitatively different regime. The beta=70 row of OBJ-4
    is therefore confounded with block-size cost and supports no conclusion in
    either direction about precision. THE beta=55 ROW IS NOT SO CONFOUNDED: it
    is a within-cell comparison at FIXED beta with only precision changed.
    THE ARTIFACT-TELL QUESTION, INVERTED, COMES OUT POSITIVE. The parameter
    meant to destroy the failure is precision; the failure IS decaying as
    precision rises, monotonically, at every point anyone has tested, and the
    decay is measured. What is missing is the second point on that curve at
    the level where the claim lives -- the full tour, at any precision above
    the isolated-step minimum. That point is ONE RUN away and no one has taken
    it.

  # ==================================================================
  # 5. RECONCILIATION OF THE TWO REVIEWS
  # ==================================================================
  review_reconciliation: >-
    NO FACTUAL CONFLICT EXISTS BETWEEN THE TWO REVIEWS, AND NONE REQUIRES
    ADJUDICATION AGAINST A LIVE fpylll INSTALL. Their scopes are largely
    nested with a genuine overlap, and where they overlap they agree.
    AGREEMENT, STATED AS AGREEMENT (and see review_independence_and_
    correlated_judgement: this agreement is same-family and is not counted as
    distinct-model corroboration): the notarization chain is genuine and
    intact in both directions; the two bisections are genuine, separate,
    1-bit-resolution searches, not 2-point brackets, with distinct minima and
    no cross-basis reuse -- so CTRL-2 is satisfied and the failure mode this
    batch existed to catch is ABSENT; the construction and seed formula match
    the validated shapes with no drift; PER_BASIS_FEASIBILITY_CAP_V3=14400 s
    was applied exactly; scope discipline is complete ((d=512, beta=40) not
    re-attempted, (d=256, *) not touched, no full-tour-level precision search
    performed, no Stage-1 activity, no C1/C2 or ML-KEM statement anywhere);
    and the first attempt's deleted artifacts make writeup.md's "matching /
    reproduced identically" corroboration unverifiable (Validator F-1, Red
    Team OBJ-5, reached independently).
    COMPLEMENTARITY, NOT CONTRADICTION: the Validator's contribution is
    RE-EXECUTION (8/8 trial outcomes reproduced, the beta=55 full tour
    reproduced frame-for-frame, plus two controls the producer never ran: a
    71-bit monotonicity probe and the draw-variation null object). The Red
    Team's contribution is ARITHMETIC AND SOURCE READING over the committed
    fields (it executed no fpylll and no lattice computation of any kind, and
    says so) plus the cost-model and scope challenges. Each surfaced findings
    the other did not, on different instruments.
    ONE PLACE WHERE ONE REVIEW'S STATEMENT IS NARROWED BY THE OTHER'S
    MEASUREMENTS, RECONCILED HERE BECAUSE NEITHER COULD DO IT: the
    monotonicity gap. RT-CTRL-4 lists untested values strictly below the
    reported minima as {70, 71, 73} at beta=55 and {70, 71} at beta=70 -- five
    points, correctly derived from the PRODUCER's trials, which is all the Red
    Team could see, since it deliberately did not read the reviews directory.
    The Validator's valprobe1 subsequently measured 71 bits at BOTH bases
    (ERROR at both). THE RECONCILED STATE, narrower than either review states
    on its own: exactly THREE points remain untested at draw 0 -- 70 and 73
    bits at beta=55, and 70 bits at beta=70 -- and the success predicate is
    monotone at every point anyone has measured (beta=55 draw 0: 69 F, 71 F,
    72 F, 74 F, 75 S, 76 S, 84 S, 100 S; beta=70 draw 0: 69 F, 71 F, 72 F,
    73 S, 74 S, 76 S, 84 S, 100 S; beta=55 draw 1: monotone over all nine
    points 69-77). "Determined minimum" therefore still rests on an interior
    monotonicity assumption that is now MOSTLY, not fully, verified. This
    reconciliation is this Coordinator's own act, on two committed reports;
    it is not a third reviewer's judgement and is not presented as one.
    ONE PROSE MISCOUNT INSIDE THE VALIDATION REPORT, SETTLED BY MEASUREMENT
    AND RECORDED RATHER THAN SILENTLY PICKED: the report's section 9 says "40
    paths ... 39 files under probes/ plus this report", which is correct and
    matches its own section 8 enumeration; its trailing hand_off_note says
    "the true written set is the 38 paths in section 8", which is a miscount
