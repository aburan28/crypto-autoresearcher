    resolved to claude-opus-5[1m]. That is a GENUINE BUT PARTIAL independence
    gain over this goal's eighteen-batch history of producer-and-reviewer on
    one model, and it is claimed at exactly that width and no wider: one
    vendor's family reviewing another model in the same family. AGENTS.md rule
    12's independence requirement remains PROCEDURAL here, not model-level,
    and is recorded as UNMET AND UNWAIVED as in every prior record of this
    goal.
    (3) MODEL IDENTIFIERS ARE SELF-REPORTS, NOT PROBE RESULTS. model_verified
    is false for the producer and for both reviews; no adapter probe receipt
    exists for any of the three sessions and AUTORESEARCH_POLICY /
    AUTORESEARCH_BACKEND are unset. This is the standing
    SESSION-MODEL-PROVENANCE-GAP this goal records in every batch.
    (4) WHERE THE TWO REVIEWS CONVERGE ON THE SAME NEW FINDING, THE METHODS
    DIFFER AND THAT IS WORTH SOMETHING -- BUT NOT MODEL INDEPENDENCE. See
    the_new_finding_two_independent_routes below: one route is static source
    inspection, the other is an executed null-object control. Two different
    instruments agreeing is evidence about the finding; two same-family models
    agreeing is not evidence about the finding. Both statements are true
    simultaneously and this record holds both.

  # ==================================================================
  # 1. THE TERMINATION BRANCH
  # ==================================================================
