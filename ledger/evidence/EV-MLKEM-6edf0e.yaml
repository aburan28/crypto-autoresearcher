    measured_by_note: >-
      Derived by TASK-20260815-19c716's probe3 as arithmetic over those runs'
      own committed recorded fields (that review executed no lattice
      computation of any kind), and corroborated qualitatively for the
      (d=512, beta=55, 75 bits) row by TASK-20260815-57bc79's valprobe2b,
      which re-executed the cell on a different host and measured 1104.40 s of
      BKZ work before the identical nine-frame failure.
    scope: >-
      EXACTLY THESE FIVE (cell, precision) POINTS AND NOTHING WIDER:
      d = 512; beta in {40, 55, 70}; mpfr precision in {69, 73, 75};
      IntegerMatrix.random(512, "qary", k=256, q=3329) bases drawn at
      draw_index 0 from SEED_ROOT=715923 via
      default_rng([715923, 0, 512, beta, 0, 0]); fpylll 0.6.4 with
      /usr/share/libfplll8/strategies/default.json; one host
      (Linux-6.18.5-fc-v20-x86_64, 4 vCPU, glibc 2.39, Python 3.11.15);
      PER_BASIS_FEASIBILITY_CAP_V3 = 14400 s. NOT claimed at d = 256, NOT at
      any other beta, NOT at any precision above the per-draw isolated-step
      minimum, NOT on any other build or host, and -- the transfer assumption
      this goal has never stated and which is stated here -- NOT on ML-KEM
      module lattices. The object measured is a generic random q-ary lattice;
      PREREG-8's own Stage 1 reduces real ML-KEM module lattices (ring
      Z_q[X]/(X^n+1), module rank 2, real CBD eta1=3/eta2=2, real FIPS 203
      Compress_d/Decompress_d), and numerical stability of the Babai/LLL step
      depends on the GSO profile, which those two families do not share. THE
      GATE IS MEASURED ON A DIFFERENT OBJECT FROM THE ONE IT GATES, IN BOTH
      DIRECTIONS.
    resource_check:
      examined: true
      reading: >-
        EXAMINED, AND TWO READINGS WERE FOUND -- the same numbers taken as
        assets rather than as costs. BOTH ARE CANDIDATES FOR THE RANKING AND
        NEITHER IS EVIDENCE; neither changes any status by existing.
        (R1) THE PER-DRAW SPREAD IS AN ARGUMENT FOR A FIXED-MARGIN PRECISION
        THAT DELETES AN ENTIRE COST DIMENSION. The three measured minima
        {69, 73, 75} are tightly clustered; 100 bits cleared the isolated step
        at 3 of 3 bases ever tested; and 69-128 bits is ONE 2-limb mpfr regime
        by this goal's own stated cost model (the limb boundary its own
        budget_justification worries about is at 129+ bits). A fixed margin
        would delete the per-draw calibration dimension entirely -- COST-1's
        ~1,209,600 s of Stage-1 calibration -- at the price of whatever
        running at 100-128 bits instead of ~73 costs per operation. That price
        is UNMEASURED, and measuring it is one run. Charging it is mandatory
        before the saving is credited.
        (R2) THE RESIDUAL GROWTH IS A MEASURED PRECISION RESPONSE, NOT A
        RECURRENCE OF A NEGATIVE PATTERN. Read as a resource, the 376.4x
        growth at fixed cell and fixed beta on +6 bits says the isolated-step
        calibration did exactly what it was supposed to do: it got the
        computation past bkz.py:123 -- precisely the operation the
        isolated-step probe tests -- and into roughly 35 minutes of real tour
        work. The pipeline now dies at a DIFFERENT operation, the windowed
        lll_obj() at bkz.py:186, which has never been calibrated at any
        precision by anyone. The artifact-tell question inverted comes out
        POSITIVE: the parameter meant to destroy the failure is precision, the
        failure IS decaying monotonically as precision rises at every point
        anyone has tested, and the decay is measured. What is missing is the
        second point on that curve at the level where the claim lives.
        THE COMMON CONSEQUENCE OF BOTH READINGS is the single cheapest
        decisive experiment in this space, and it is the next action of
        DEC-20260815-3e8e9c: one full BKZ tour at (d=512, beta=55, seed
        452658293) at mpfr_bits = 100 -- inside the already-validated window,
        same 2-limb regime, same order of cost as the 2502.74 s already spent.
        Either outcome is decisive: it clears, and it is the first completed
        d=512 main-grid cell in this goal's history; or it errors identically,
        and the obstruction is measured for the first time at a precision that
        is NOT the isolated-step minimum -- which is the scope
        DEC-20260814-4ac30a's escalation branches presuppose and have never
        had.
