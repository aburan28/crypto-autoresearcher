  # ==================================================================
  # 6. COST FINDINGS CARRIED FORWARD
  # ==================================================================
  cost_findings: >-
    COST-1 (Red Team, critical) -- THE OMITTED COST, FOUND AND LARGE. Per the
    per-draw axis established above, if the current design's per-draw
    bisection is carried into Stage 1, calibration alone costs, at THIS run's
    own measured d=512 bisection rate of ~2800 s per draw: main arm 6 cells x
    8 draws x ~2800 s ~= 134,400 s; NULL-3 6 cells x 64 draws x ~2800 s ~=
    1,075,200 s; total ~= 1,209,600 s (~336 hours) against a frozen
    total_cpu_hours ceiling of 576 hours / 2,073,600 s in
    experiments/EXP-MLKEM-42ea04/specification.yaml. That is a ~58% increase
    and NOT ONE SECOND OF IT APPEARS in the specification's budget, in any
    decision record, or in any batch's budget_justification. LABELLED AS THE
    RED TEAM LABELS IT: arithmetic extrapolated from d=512 rates, not a
    measurement; d=256 cells would be cheaper; it is an order-of-magnitude
    sizing check. It is the number a Stage-1 sizing decision must not be made
    without, and it is one of the two reasons DEC-20260815-3e8e9c declines to
    size Stage 1.
    COST-2 (high) -- the cap check. The reuse of PER_BASIS_FEASIBILITY_CAP_V3
    was genuinely disclosed rather than copied forward silently, exactly as
    DEC-20260815-201633 (b) required. But the SIZING METHOD is falsified by
    this run's own data: the justification's stated worst case used 395.65 s
    as the largest per-trial cost, and beta=70's largest single trial was
    433.96 s (9.68% above), with that basis's total 2894.31 s against a stated
    worst case of 2769.55 s (4.5% above). It stayed inside the real 3600 s
    budget so nothing broke; what is falsified is "largest cost observed to
    date x n_trials" as an upper bound on this host -- and that same method
    style underpins the cap itself and would underpin Stage-1 sizing.
    COST-3 (high) -- the cap is now DISCHARGED as untested-as-binding, in the
    direction that matters: it BOUND, at beta=70, for the first time in this
    goal's history, on the most expensive cell ever run here. The cap now
    determines what the goal knows; a different cap would have produced a
    different record. Separately, this run contains a built-in timing null
    nobody read: outer_lll_reduction_elapsed_seconds runs BEFORE
    FPLLL.set_precision() and does not use beta, so within one basis it is the
    same computation repeated once per trial. Its spread measures host noise
    directly: beta=55 block mean 387.06 s, sd 2.58, spread 2.27%; beta=70
    block mean 408.15 s, sd 10.54, spread 7.78% with a MONOTONE +8.00% drift
    first-to-last; cross-block level shift +5.45%. No CPU-time figure exists
    anywhere and environment.json records no load average. The drifting block
    is immediately followed by the ONE verdict in this package that is a pure
    wall-clock judgement -- the beta=70 cap kill. Every wall-clock number in
    this record therefore carries an unstated environmental error bar of at
    least 5-8%.
    COST-4 (high) -- THE OPERATING CAP IS 4x THE FROZEN SPECIFICATION'S OWN
    STAGE-0 CAP, WITH NO AMENDMENT, ACROSS THREE BATCHES.
    specification.yaml states PER_BASIS_FEASIBILITY_CAP = 3600 s twice (line
    123 pass_condition, line 333 stopping rule) and PER_BASIS_STAGE1_CAP =
    14400 s for a single Stage-1 basis reduction (line 339). This Stage-0 task
    ran at 14400 s. "PER_BASIS_FEASIBILITY_CAP_V2/V3" appears nowhere in
    specification.yaml; the V2/V3 escalation lives only in batch-local
    decisions and goal checkpoints. CONCRETE COST IN THIS RUN: 10,800.08 s --
    47.9% of the task's entire 22,545.08 s compute -- was spent past the
    specification's own Stage-0 stopping rule and produced no information. By
    the spec's own rule (d=512, beta=70) was a dropped NOT_COMPUTED cell at
    3600 s. (d=512, beta=55) errored at 2502.74 s, INSIDE the spec's cap, so
    its result is unaffected. STATED FAIRLY, AS THE RED TEAM STATES IT:
    EXP-MLKEM-42ea04 is review_required / approved_by null, so this is NOT a
    violation of an approved protocol, and a larger cap can only help a cell
    PASS -- it cannot manufacture a negative. But PREREG-8 is binding-carried
    and 3600 s is the number the eventual go/no-go will be read against.
    COST-5 (low) -- per-attempt vs total-expected-cost bookkeeping is CLEAR
    and correctly absent (0 of 2 successes gives no probability to invert, and
    the producer computes no total-expected-cost figure); wall-clock
    reconciliation is CLEAR, the four phase wall-clocks summing to 22,545.082 s
    against a reported 22,545.084 s, with 43.92 s (0.194%) of interpreter
    startup and teardown falling outside t_script_start and honestly labelled
    "(self-reported)". No double-count and no phantom buffer of the kind the
    prior batch's own OBJ-4 found: this package is clean on that axis and both
    reviews say so explicitly.

