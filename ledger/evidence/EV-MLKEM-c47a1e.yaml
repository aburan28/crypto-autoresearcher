  dominated_by: >-
    unweighted_mean (CTRL-FUSION-ABLATION). At n=32 the ablation attains the
    identical m50 (64), the identical held-out false-positive rate under both
    pre-registered readings, and strictly lower charged work (292,067,004 vs
    292,105,468) while paying no covariance-estimation cost; it is also better
    at m=8 (0.267 vs 0.200, one instance). Every row of this experiment's own
    frontier was checked -- unfused, unweighted mean, GLS, random signed
    permutation, shuffled labels -- across vector count, charged work and
    held-out false-positive rate; no row is dominated by GLS. Against the
    external cost frontier no row is contested, because this experiment
    occupies no cryptanalytic cost frontier at all.
  sota_delta: >-
    ZERO against any standardized ML-KEM cost frontier: no standardized
    parameter set, estimator or matched baseline was touched, and none may be
    inferred. Within the toy experiment: GLS vs unfused +0.0068 bits of charged
    work (counted_exact); GLS vs its own ablation -0.00019 bits, i.e. the
    covariance-aware term is 0.013 percent MORE expensive for identical
    detection performance.

