      status: resource_exhaustion
      reason: >-
        Deliberately NOT listed in run_ids. It produced no measurement of any
        kind: the n=64 projected dual lattice has dimension 248 and ZERO of 30
        required LLL reductions completed within the frozen 1700 s stage
        budget, the first attempt consuming 1699.996 s. AGENTS.md rule 5 and
