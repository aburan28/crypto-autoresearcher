  certificate_refs: []
  certificate_status: >-
    certificate.kind is `none` on all four runs, confirmed by direct read of
    each manifest's result.certificate rather than assumed. This experiment
    claims no discrete-log solve and no factor-base relation, so there is
    nothing to certify (docs/claims-and-verification.md). RUN-MLKEM-026
    additionally carries a planted-layer re-verification -- all 30 instances
    re-derived from the recorded seed derivation paths by the sampler alone,
    with no scoring, fusion or covariance state; all layers, candidate indices
    and secret hashes matched. That is an INSTRUMENT re-verification, not a
    solution certificate, and it is deliberately not listed in certificate_refs
    so that no reader mistakes it for one.

  proof_status: derivation
  proof_refs:
    - experiments/EXP-MLKEM-007/analysis/refutation-note-gls-vs-uniform.yaml
    - experiments/EXP-MLKEM-007/analysis/covariance_report.json
    - experiments/EXP-MLKEM-007/analysis/cost_accounting.json
    - experiments/EXP-MLKEM-007/analysis/gate_decision.json
    - experiments/EXP-MLKEM-007/analysis/coordinator-analysis.yaml
  proof_status_basis: >-
    The strongest checkable refutation artifact this result admits, sought
    before the adverse transition as docs/claims-and-verification.md requires.
    Level 1 (counterexample certificate) does not apply: the failing prediction
    is a distributional threshold, not a per-instance witness. Level 2
    (derivation note) WAS achievable and is archived: from the archived
    held-out covariance, an oracle GLS estimator can reduce the fused null
    standard deviation by only 0.297 percent, whereas a 2x tail-FPR reduction
    at tau = 3.0 requires about 6.4 percent -- a shortfall of roughly 22x, so
    the frozen criterion was analytically unreachable at the measured
    covariance. Level 3 (empirical_only) is therefore NOT the declared basis.
    The derivation is conditional on the MEASURED covariance and is a statement
    about the tested construction, never a universal impossibility claim.

  what_this_evidence_is: >-
    A single controlled execution of a frozen, pre-registered scoring-layer
    protocol on synthetic toy MLWE at n=32, measuring whether covariance-aware
    GLS fusion over a negacyclic isometry orbit beats naive unweighted
    averaging, an unfused single-orbit baseline, and size-matched random
    signed-permutation and shuffled-label controls. It is NOT an attack, NOT an
    estimator run, and NOT a measurement of ML-KEM security. ML-KEM is not
    broken and this record must never be cited as bearing on that.

  observations:
    - >-
      OB-1 (VALIDITY). 4 of 4 planned runs terminal (3 completed_valid, 1
      resource_exhaustion); 38 required artifacts present with SHA-256 in every
      manifest and in the snapshot receipt; all four manifests schema-complete;
      30 frozen seeds split 15 training / 15 held-out before any fitting, with
      held_out_seeds_read_by_fitting_phases empty and violations empty in every
      manifest; all 30 planted layers independently re-derived from the
      recorded derivation paths; gate32 re-executed from the recorded command
      and revision producing a byte-identical orbit-scores.json, with only
      wall-clock and resource fields differing in raw.json. Ruled ADMISSIBLE
      with recorded defects.
    - >-
      OB-2 (n=32 GATE PASSED). Held-out r_eff 3.982831 >= 2.0; exact equality
      passes with maximum float relative deviation 0.0; charged work GLS
      292,105,468 < unfused 293,491,916. RUN-MLKEM-027 was therefore EXECUTED,
      not gate-stopped.
    - >-
      OB-3 (EFFECTIVE RANK NEAR MAXIMUM). Training r_eff 3.987236, held-out
      3.982831, of a maximum 4.000 -- 99.6 percent. Held-out r_eff in
      [3.9690, 3.9968] at every one of the ten vector counts. The
      wrong-candidate orbit-score covariance is near-diagonal with near-equal
      variances (diagonal 0.693-0.799, off-diagonals -0.0344 to +0.0186 at
      m=2048).
    - >-
      OB-4 (GLS REDUCES TO ITS OWN ABLATION). Fitted GLS weights at m=2048 are
      [0.256679, 0.258563, 0.242732, 0.242026], a maximum relative deviation
      from uniform of 3.43 percent, at every grid point. (The execution
      report's OBS-3 states "within 3 percent"; the archived weights give 3.43
      percent. Corrected here for precision; nothing depends on it.) Held-out
      success curves for GLS and the naive unweighted mean are identical at 9
      of 10 grid points and differ only at m=8, where the UNWEIGHTED MEAN is
      higher (0.267, 4/15) than GLS (0.200, 3/15).
    - >-
      OB-5 (THE FROZEN FPR CRITERION IS NOT MET UNDER EITHER PRE-REGISTERED
      READING). Required <= 0.5. Matched-detection reading at m=64: GLS 0.005,
      unweighted 0.005, ratio 1.000; across the grid 0.995, 1.255, 1.000,
      1.000, 1.000, then both rules measure zero false positives at m >= 128.
      Standardised-threshold (tau = 3.0) reading: ratio 1.000 at every one of
      the ten vector counts. Both readings were pinned in implementation.md
      BEFORE any run (PD-7), so no post-hoc choice was available.
    - >-
      OB-6 (m50 AND CHARGED WORK MEET THEIR THRESHOLDS). m50 unfused 512, GLS
      64, unweighted mean 64, permutation 1024, shuffled null undefined; ratio
      8.0x against a >= 2x threshold, grid-resolved on a power-of-two grid.
      total_charged_score_work_ratio 0.995276 against a < 1 threshold.
    - >-
      OB-7 (ORBIT-VS-PERMUTATION STRADDLES ITS THRESHOLD). counted_exact --
      the frozen decision metric -- gives 0.021722 bits against a >= 1.0 bit
      requirement; the labelled `modeled` sieve-dominated alternative gives
      3.989469 bits, on the other side. ~291.6 M of ~293 M charged units are
      an m-independent LLL floor, so the whole charged-work comparison is
      decided by a ~0.5 percent m-dependent remainder.
    - >-
      OB-8 (CONTROLS). CTRL-KNOWN-ANSWER passes at 0.600 top-1 training
      recovery (95 percent Wilson [0.357, 0.802]) against a >= 0.5 condition,
      so the instrument detects the signal the pipeline must amplify.
      CTRL-COVARIANCE-MODEL passes at n=32 and n=64 (max chi-square 5.047 and
      10.668 against a 22.458 critical value; all moment checks inside +-4
      standard errors). CTRL-SHUFFLED-ORBIT-LABELS is flat at 0.000 held-out
      success at every one of the ten vector counts, so the measured effect is
      not an instrument artifact. CTRL-EXACT-EQUALITY passes with maximum float
      relative deviation 0.0. CTRL-SEED-DISCIPLINE passes in every run.
    - >-
      OB-9 (THE SIZE-MATCHED PERMUTATION CONTROL IS NOT A NEUTRAL NULL). It
      reaches m50 1024, WORSE than the unfused baseline's 512, because being
      size-matched it comprises the identity plus 3 non-commuting signed
      permutations whose scores carry no signal and dilute the one informative
      element (AN-3). The true orbit's four elements are all signal-preserving
      (m50 64). The orbit and the permutation control are therefore NOT
      equivalent objects, by a factor of 16 in vector count.
    - >-
      OB-10 (n=64 PRODUCED NOTHING). Dimension 248; ZERO of 30 required LLL
      reductions completed in the frozen 1700 s stage budget; first attempt
      1699.996 s without finishing; pure CPython, no numpy / fpylll / Sage,
      network_operations none. Corroborated by RUN-025's bounded probe, which
      did not complete the same reduction in 240 s.
    - >-
      OB-11 (HEUR-001 IS FALSIFIED AS WRITTEN, BY ONE DISJUNCT ONLY --
      Coordinator adjudication; the Executor deliberately did not adjudicate).
      Disjunct (1), held-out FPR outside the frozen factor-2 band: NOT
      triggered (variance ratio 1.0919). Disjunct (2), r_eff deviating by >= 50
      percent: NOT triggered (0.56 percent). Disjunct (3), naive unweighted
      averaging matches GLS on held-out instances: TRIGGERED. The covariance
      model transferred essentially perfectly; the disjunct that fired says it
      was unnecessary, which is a different failure from the one the heuristic
      was written about. The bundled wording is recorded as a drafting defect
      and is NOT used to reinterpret the trigger; no amendment is made.
    - >-
      OB-12 (ANOMALIES CARRIED FORWARD). AN-4: no rule exceeds 0.733 held-out
      success at any vector count up to 2048, so ~25 percent of held-out
      instances are never recovered however many vectors are used, consistent
      with low-prior CBD guess-block values (P(+-3) = 1/64). AN-5: the null has
      a heavier-than-Gaussian upper tail, FPR 0.0058-0.0117 at tau = 3.0 versus
      0.00135 for a normal. AN-6: exact-rational re-verification of the reduced
      bases found effective LLL delta 0.98989 / 0.98996 against a requested
      0.99, immaterial because every residual, phase index and weight used by
      the measurement is computed over the integers or exact rationals.

  inference: >-
    At n=32 with the frozen d_shift = 8, orbit subset {0,8,16,24}, and the
    frozen pool construction, the COVARIANCE-AWARE limb of H-MLKEM-007
    contributes nothing, and the reason is derivable rather than merely
    observed: the wrong-candidate orbit-score covariance is close enough to a
    multiple of the identity (r_eff 3.983 of 4.000; row-sum coefficient of
    variation 7.7 percent) that an oracle GLS estimator could reduce the fused
    null standard deviation by at most 0.297 percent, against the ~6.4 percent
    needed for the frozen 2x false-positive-rate criterion -- a ~22x shortfall.
    The realised estimator, fitted on 15 training instances, was 0.0258 percent
    WORSE than uniform averaging out of sample. The vector-count gain that DID
    meet its threshold (8x, grid-resolved) is quantitatively consistent with
    plain averaging of four near-independent scores (predicted 4x), which the
    unweighted-mean ablation delivers at strictly lower charged work. What is
    NOT refuted is the isometry-reuse premise: all four orbit elements are
    signal-preserving (m50 64) whereas the size-matched permutation control's
    are not (m50 1024). The n=64 arm produced no measurement, so half the
    frozen success criterion is UNEVALUATED, not failed, and the mechanism's
    existential over orbit subsets of size <= 32 was tested at |J| = 4 only,
    a restriction imposed by the pure-Python host rather than by mathematics.
    The evidence therefore WEAKENS H-MLKEM-007 within the stated boundary; it
    does not reject it, and it establishes nothing whatever about standardized
    ML-KEM.

  largest_claim_justified_by_the_data: >-
    "Over the tested instances, parameters, solver and resource budget -- 15
    held-out synthetic MLWE instances over Z_3329[X]/(X^32+1), module rank 2,
    centered-binomial eta = 3, single-layer dual scoring at p = 3, orbit subset
    {0,8,16,24}, pool of the 2048 shortest vectors from an LLL(0.99)-reduced
    projected dual basis at dimension 124 -- covariance-aware GLS fusion showed
    no improvement meeting the predefined threshold over naive unweighted orbit
    averaging: the held-out wrong-candidate false-positive-rate ratio was 1.000
    under both pre-registered readings against a required <= 0.5, and an
    archived derivation shows the criterion was unreachable at the measured
    covariance by roughly a factor of 22 in the standard-deviation budget."
    Nothing beyond that sentence is asserted.

  scale_relevance:
    label: toy-scale
    justification: >-
      Direct computation at the stated size. Ring dimension 32, lattice
      dimension 124, q = 3329, module rank 2. No correspondence or embedding is
      used and none is claimed, so no larger size is reached indirectly. The
      n=64 arm, which would still have been toy-scale, produced no data.

  claim_boundaries:
    family_and_field: synthetic module-LWE over Z_q[X]/(X^n+1), q = 3329, prime cyclotomic-power ring
    sizes_tested: "n = 32 only (n = 64 attempted, no data); lattice dimension 124"
    instance_generation: "SHA256('EXP-MLKEM-007|n=<n>|seed=<seed>|<purpose>') -> random.Random; exact integer-weight CBD eta = 3 for secrets and errors"
    solver_and_version: "pure-CPython 3.11.15 standard library only; no numpy, fpylll, sympy or Sage; LLL delta 0.99 (effective 0.98989-0.98996, AN-6)"
    parameter_range: "module rank k = 2, layer prime p = 3, one layer, d_shift = 8, orbit subset size 4, pool size 2048, vector-count grid 4..2048 by powers of two"
    seeds_and_instances: "30 frozen seeds, 15 training / 15 held-out, split before any fitting"
    controls_and_baselines: "unfused single orbit; naive unweighted mean; random signed permutation; shuffled orbit labels; plus known-answer, covariance-model, exact-equality and seed-discipline controls"
    resource_limits: "6000 s total wall clock, 1800 s per run, 2.0 CPU-hours, 4 GB, 4 runs, no network, 0 deployed-system queries"

  boundaries:
    - >-
      TOY SCALE ONLY. Nothing here bears on ML-KEM-512, ML-KEM-768 or
      ML-KEM-1024, or on MLWE hardness in general. No standardized parameter
      set was attacked, no estimator was run, no BKZ at scale was performed, no
      asymptotic claim is made or implied.
    - >-
      n = 32 ONLY. The n=64 thresholds of the frozen success criterion
      (r_eff >= 4.0 and >= 4x vector-count reduction for at least one subset of
      size <= 32) are UNEVALUATED, not failed. RUN-MLKEM-027 is an
      infrastructure outcome with zero evidence value; the n=64 limb of the
      frozen correlated_reindexing disjunction is neither true nor false, and
      no value is inferred for it.
    - >-
      ONE POINT OF THE EXISTENTIAL. The hypothesis quantifies over "at least
      one selected orbit subset of size at most 32". Shift invariance forces
      |G| = |J| = n/d_shift, and with the frozen d_shift = 8 the only
      computationally reachable choice on a pure-Python host at n=32 was
      |J| = 4 (81 enumerable candidates). Subsets of size > 4 and alternative
      d_shift values were never evaluated. The restriction came from the
      execution host (PD-2, PD-3), not from the mathematics, and under
      AGENTS.md rule 5 it cannot be converted into a negative result about the
      unsearched part of the space.
    - >-
      THE ISOMETRY-REUSE PREMISE IS NOT REFUTED. What is weakened is the
      covariance-aware fusion limb. All four orbit elements are
      signal-preserving; the size-matched random signed-permutation control's
      are not (m50 64 vs 1024).
    - >-
      NOT A UNIVERSAL IMPOSSIBILITY CLAIM. The archived derivation explains why
      the criterion failed GIVEN the measured covariance. It does not show that
      the orbit-score covariance must be near-diagonal at other ring sizes,
      d_shift values, subset sizes or pool constructions.
    - >-
      OPEN PREREQUISITES NOT DISCHARGED. DEC-20260722-003's required
      carry-aware LaMS layer derivation and corrected commit-pinned matched
      baseline remain open and are untouched by this experiment. The corrected
      ePrint 2026/279 isometric gains (approximately 0-0.8 bit per
      EV-MLKEM-001) bound the plausible headroom; no result here may be
      paraphrased as improving a standardized matched baseline.
    - >-
      NOTHING ON SIDE CHANNELS. No decapsulation, failure, timing, power, hint
      or plaintext-checking oracle exists anywhere in the design; nothing here
      bears on side-channel, fault or oracle-dependent attacks.

  unresolved_confounds:
    - >-
      COST-REGIME SENSITIVITY (primary). The orbit-vs-permutation metric
      straddles its 1.0-bit threshold: 0.0217 bits on the frozen counted_exact
      model versus 3.989 bits on the labelled modeled sieve-dominated
      alternative. The frozen model is dominated by an m-independent LLL floor
      (291.7 M of ~293 M units), so both that metric and the
      total_charged_score_work_ratio < 1 verdict (0.995276, MET) are decided by
      a ~0.5 percent m-dependent remainder. Whether either verdict survives in
      a sieve-dominated regime is NOT determined by this experiment.
    - >-
      THE `generic_batching` ANTECEDENT IS SATISFIED FOR A REASON UNRELATED TO
      ITS NAME. It fires because the counted_exact cost model cannot see a 16x
      vector-count difference between the orbit (m50 64) and the size-matched
      permutation (m50 1024), not because the two behave alike. This does not
      change the first-match classification, and it bounds what any record may
      assert about generic batching here.
    - >-
      STATISTICAL POWER. 15 held-out instances; the 0.600 known-answer rate has
      a 95 percent Wilson interval of [0.357, 0.802]. The m50 grid is powers of
      two so the 8.0x ratio is grid-resolved only (underlying ratio bracketed
      between roughly 4x and 16x). The single m=8 GLS-vs-ablation difference
      (3/15 vs 4/15) is one instance and is not a measured effect.
    - >-
      TAIL MODEL. The derivation's step from a standard-deviation budget to a
      false-positive-rate budget assumes a Gaussian tail, while AN-5 shows the
      empirical null is heavier-tailed. A heavier tail makes the required
      standard-deviation reduction LARGER, so the step is conservative in the
      direction of the conclusion, but it is a model and is labelled as one.
      The variance computation itself uses no tail model.
    - >-
      SINGLE EXECUTION. The byte-identical re-run establishes determinism, not
      independent replication: same host, same executor, same implementation.
      No second implementation or second environment has reproduced any figure.
    - >-
      ACHIEVEMENT CEILING (AN-4). ~25 percent of held-out instances are never
      recovered at any vector count up to 2048. The ceiling was recorded, not
      corrected for, and it caps the per-instance signal-to-noise every rule
      could reach.
    - >-
      PROVENANCE. fallback_used true against a handoff setting
      fallback_allowed false (PD-5), and model_verified false with no
      `orchestration.adapter doctor --probe` run for the resolved identifier.
      Ruled in DEC-20260803-9b3d40; disclosed here because it is unremedied,
      though no figure in this record rests on model judgement.

