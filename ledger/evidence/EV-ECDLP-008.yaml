evidence:
  id: EV-ECDLP-008
  hypothesis_id: H-YIELD-001
  experiment_ids:
    - EXP-YIELD-001
  run_ids:
    - RUN-YIELD-001-CENSUS-M2
    - RUN-YIELD-001-CENSUS-M3
    - RUN-YIELD-001-NULL-UNIFORM-FB
    - RUN-YIELD-001-NULL-RANDOM-SUMSET
    - RUN-YIELD-001-CALIB-AP
    - RUN-YIELD-001-BASELINE-RHO-BSGS
  type: empirical
  direction: neutral
  direction_basis: >-
    NEUTRAL IS NOT A SHRUG AND IT IS NOT `weakens`. The pre-registered
    invalidation rule INV-4 fired at 4 of 49 criterion-evaluable cells, so under
    the frozen v2 outcome_disposition_table branch P0 EVERY occupancy-normalised
    efficiency E in the package is VOID, no outcome branch is evaluated, and this
    record makes no statement whatever about decomposition yield in either
    direction. A fired validity gate is the ABSENCE of a measurement, not the
    presence of a negative one. No yield ratio is reported anywhere in this
    record as a measurement.
  strength: inconclusive
  strength_basis: >-
    On the yield question there is no strength to assign, because there is no
    admissible measurement: the E values are void by pre-registration. On the ONE
    thing this batch does establish - the instrument finding recorded under
    observations O-3 and O-4 below - the basis is a DERIVATION over quantities
    already committed in the run package, independently re-derived by two
    non-originating review sessions, and the ceiling on it is claim tier toy and
    no strength above `preliminary`. `replicated` and `strong` are both
    unavailable: this is a single unreplicated run set, four field sizes on ONE
    prime-order curve each, which is a size series and not a replication (N-4).
  claim_tier: toy
  claim_tier_basis: >-
    12 to 18 field bits, m in {2, 3}, one prime-order curve per size chosen by a
    deterministic rule, x-interval factor bases anchored at 0 on the frozen
    17-point beta grid, one implementation, one budget, one platform. The frozen
    contract declares `correspondence: null - direct sampling`, so no
    correspondence, isometry or transport argument to cryptographic scale is
    offered or available. NOTHING MEASURED HERE IS EVIDENCE ABOUT
    CRYPTOGRAPHIC-SIZE CURVES IN EITHER DIRECTION.

  certificate_refs:
    - >-
      experiments/EXP-YIELD-001/runs/RUN-YIELD-001-BASELINE-RHO-BSGS/results.json
      - 128 discrete-logarithm solution certificates (64 targets, 16 per field
      size, solved twice - once by the table-based Pollard rho with negation and
      once by baby-step giant-step). The driver re-verified each against the DL
      table, and TASK-20260729-007 re-solved all 64 targets with a from-scratch
      independent BSGS sharing no code with rho, with BSGS or with the DL table,
      obtaining rho_d = bsgs_d = d_true at all 64 with 0 mismatches. THESE
      CERTIFICATES CERTIFY THE BASELINE ONLY. There is no claimed solve, relation
      or bound about decomposition yield to certify, and none is asserted.
    - >-
      experiments/EXP-YIELD-001/runs/RUN-YIELD-001-CENSUS-M2/results.json and
      RUN-YIELD-001-CENSUS-M3/results.json - CTRL-DL agreement records, 8 control
      records over 4 sizes by 2 arities at 10^4 random m-multisets each, 80,000
      curve-side versus DL-image sum comparisons with ZERO mismatches. INV-3 did
      not fire.

  proof_status: derivation
  proof_status_declaration: >-
    THE BASIS IS NAMED RATHER THAN LEFT UNDECLARED, AND IT IS MIXED. Ordered per
    docs/claims-and-verification.md, "Refutation artifacts".
    (1) COUNTEREXAMPLE CERTIFICATE - NOT AVAILABLE AND NOT APPLICABLE to the
    instrument finding: there is no claimed solve, relation or bound whose
    failure could be packaged as an instance.
    (2) DERIVATION - AVAILABLE AND USED. This is the basis of observations O-3
    and O-4 and of the whole load-bearing content of this record. It is a
    derivation over quantities ALREADY RECORDED in the committed run package - N,
    B, C_red, m, and the antipodal arm's per-cell mean and sd - requiring no new
    compute, no curve and no run; and it was INDEPENDENTLY RE-DERIVED BY TWO
    NON-ORIGINATING REVIEW SESSIONS that did not author the contract, the
    amendment, the driver or each other's report. TASK-20260729-007 recomputed
    P_pred at all 49 cells from the raw quantities to a maximum absolute
    difference of 0.0 and reproduced both standardized residuals to 1e-9;
    TASK-20260729-008 re-derived the same identity from the frozen contract text
    BEFORE reading the Executor's arithmetic and strengthened it. Per
    docs/claims-and-verification.md this is labelled `derivation` - a checkable
    argument, step by step, by an independent reader - and it is NEVER called
    proved.
    (3) EMPIRICAL_ONLY - DECLARED HERE FOR EVERYTHING ELSE. Every other
    observation this record carries - the three out-of-band cells, the one-sided
    measured-B over interval-length drift, the collision multiplicity profiles,
    the realised null spread, the rho and BSGS baselines and the census-to-rho
    cost ratios - rests on a SINGLE UNREPLICATED RUN SET at toy scale with one
    curve per size and nothing else. That basis is declared rather than implied.
    An undeclared basis would be the failure; the absence of a proof is not.
  proof_refs:
    - >-
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-011/reviews/TASK-20260729-008/falsification_review.md
      section 2 - the derivation note itself, self-contained: P_pred equals
      |S_(m-2)| + (N - |S_(m-2)|)(1 - e^-lambda), which is the mean of a process
      that PRE-MARKS the |S_(m-2)| deterministically reachable bins before
      throwing C_red balls; CTRL-NULL-SUMSET throws into an EMPTY N-bit set and
      produces only the first term; the residual is exactly
      |S_(m-2)| e^-lambda; and the structural reason is exact set inclusion,
      S_(m-2) contained in S_m, since a 3-multiset containing a cancelling pair
      {P, -P, Q} sums to Q.
    - >-
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-011/reviews/TASK-20260729-008/red_team_report.yaml
      - diagnostic_verdict block, with the independent re-derivation, the
      independent check of the C_red combinatorics, the numerical check at all 49
      cells and the two-denominator strengthening.
    - >-
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-011/reviews/TASK-20260729-007/recount_note.md
      section 3, and validation_report.yaml metric_recomputations M3 and M4 - the
      second, independent arithmetic confirmation and the location of the
      discrepancy between two committed contract clauses.
  proof_refs_ordering_disclosure: >-
    DISCLOSED RATHER THAN ROUTED AROUND. docs/claims-and-verification.md requires
    the refutation artifact to be archived BEFORE the decision record that relies
    on it. Here the derivation note lives inside the two review reports, and
    those reports are committed in the SAME ledger archive as DEC-20260729-001
    rather than in an earlier snapshot. The declared eight-path commit set of
    TASK-20260729-009 was frozen before either review reported, and the reports
    were produced by sessions that were forbidden to commit. The mitigation is
    that the derivation rests on NO NEW ARTIFACT: every quantity it consumes was
    already committed at 2fb2bb7a111d999859612e52990eea7dc6bbac1a and is
    hash-bound by the TASK-20260729-006 receipt, so a third party can re-derive
    it from the earlier commit without the reports. This is the same defect
    pattern recorded as INT-BATCH009-U and it is mitigated, not cured.

  observations:
    - id: O-1
      label: run package integrity - DETERMINED
      text: >-
        Six run directories, each with exactly manifest.json, results.json and
        stdout.log, all six `terminal_status: completed_valid` and
        `validity_status: valid`, stdout non-empty in all six. 136 of 136 planned
        census cells measured, `cells_skipped` empty. No timeout, no crash, no
        resource exhaustion, no budget cancellation. 23 of 23 AGENTS.md artifact
        policy fields present in 6 of 6 manifests. Six master seeds 110201,
        110301, 110401, 110501, 110601 and 110701, distinct per run and identical
        to the frozen v1 replication.seeds, with every derived per-cell,
        per-draw and per-seed value recorded beside the number it produced. The
        snapshot commit 2fb2bb7a111d999859612e52990eea7dc6bbac1a changes exactly
        the 20 declared paths, all additions, with 20 of 20 recorded SHA-256
        values matching the blobs at that commit.
    - id: O-2
      label: reproducibility - DETERMINED, at the strongest available level
      text: >-
        TASK-20260729-007 re-executed all six runs from the recorded command with
        the committed driver into a scratch root outside the repository, 7.8
        seconds total, and diffed every results.json against the committed one
        with NO normalisation. Every differing leaf across all six files is a
        timing field and nothing else - `seconds` 136 times,
        `instance_setup_seconds` 20 times, `elapsed_seconds` 6 times. Zero
        measured quantities, zero seeds, zero derived statistics and zero flags
        differ. Regenerating results/summary.json from the COMMITTED six
        results.json and manifest.json reproduces it BYTE-IDENTICALLY at sha256
        2287b277b6f6ce842230ca13bf1217a8ba34cc6da1d2d362123502810f7b2aeb, exactly
        the value the TASK-20260729-006 receipt binds. No number in summary.json
        is hand-entered.
    - id: O-3
      label: INV-4 FIRED - the census is VOID by pre-registration
      text: >-
        The frozen invalidation rule INV-4 fired at 4 of 49 criterion-evaluable
        cells, all at m = 3, under DEV-4's literal single-replicate-sd reading.
        Standardized residual of the empirical antipodal null mean against
        P_pred spans [-12.43936, +0.24912] over the 49 cells; split by arity, m =
        2 gives 29 cells in [-0.938, +0.249] with no systematic sign while m = 3
        gives 20 cells in [-12.439, -0.231], EVERY ONE NEGATIVE. The four failing
        cells are (k=18, beta=0.200, m=3, B=16, C_red=688) at -12.4394;
        (k=16, beta=0.225, m=3, B=16, C_red=688) at -5.8995;
        (k=18, beta=0.225, m=3, B=24, C_red=2312) at -5.7486; and
        (k=18, beta=0.250, m=3, B=28, C_red=3668) at -3.9203.
        CONSEQUENCE, AS FROZEN: branch P0 of the v2 outcome_disposition_table
        governs, every occupancy-normalised efficiency E in the package is VOID,
        and no outcome branch is evaluated. INV-4's own frozen text voids every E
        VALUE, not every measurement.
    - id: O-4
      label: the instrument finding - LOCATED AND CLOSED BY ONE TERM
      text: >-
        The shortfall of the empirical null mean below P_pred equals P_pred's own
        |S_(m-2)| e^-lambda term at every one of the 49 cells, with lambda =
        C_red/N, |S_0| = 1 and |S_1| = B. CTRL-NULL-SUMSET, both as frozen in v1
        and as re-specified by amendment C-4, throws C_red/2 antipodal pairs into
        an EMPTY N-bit set and so realises only the first term of P_pred, while
        P_pred is the mean of a process that ALSO pre-marks the |S_(m-2)| bins a
        cancelling multiset reaches deterministically. At m = 2 the omitted term
        is 1 and is invisible against a single-replicate sd of 3 to 100; at m = 3
        it is B and is the entire discrepancy. Adding that one term back collapses
        the 49-cell spread from [-12.439, +0.249] to [-0.535, +0.267] and the
        largest single discrepancy from 12.4 sigma to 0.03 sigma.
        ROBUST TO THE DEV-4 AMBIGUITY, WHICH IS THE PART THAT MATTERS: under the
        standard-error-of-the-mean reading at the recorded replicate counts of
        100, 30 and 10, the UNCORRECTED comparison fails at 22 of 49 cells rather
        than 4, including 4 cells at m = 2, while the CORRECTED residual passes at
        49 of 49 under BOTH readings - maximum absolute value 0.53 single-replicate
        and 2.93 standard-error-of-the-mean. Had a second unmodelled term existed
        it would appear in that residual; it does not.
        WHERE THE ERROR WAS BORN - NOT IN THE EXECUTOR AND NOT IN THE RUN. The
        driver implements v2 C-4's process verbatim and evaluates INV-4 against
        P_pred exactly as frozen, and both reviewers recomputed the recorded
        P_pred from the frozen formula to a maximum absolute difference of 0.0.
        The gap sits between TWO COMMITTED CONTRACT CLAUSES: v2 C-4's own
        antipodal-mean derivation gives (N-1)(1 - e^-lambda) with no
        |S_(m-2)| e^-lambda term, while the v1 P_pred it declares correct to O(1)
        carries one. The same arithmetic slip propagated through the amendment and
        both pre-execution reviews and was catchable with no data at all.
    - id: O-5
      label: independent recount of the primary metric - DETERMINED at 4 of 136 cells
      text: >-
        TASK-20260729-007 recounted |S_m| from scratch at four cells, including
        the SMALLEST criterion-evaluable cell, by explicit elliptic-curve point
        addition over every m-element multiset with distinct sums collected in a
        set - never building a discrete-logarithm table and never converting a
        point to an integer, i.e. through a different representation from the
        package's. Every printed digit agrees at all four cells, including L, B,
        C_all, C(B, m), C_red and |S_m|. The DEC-20260727-009 failure mode is NOT
        present: at these cells the primary metric is a measurement of the
        quantity it names and not a statistic of bookkeeping. It was recounted at
        4 of 136 cells, not all 136.
    - id: O-6
      label: cell classing and R-7 drift - DETERMINED, and the class is not outcome-selected
      text: >-
        49 cells criterion-evaluable on measured B against 44 on the B = L basis,
        11 cells changed class, drift 5 > 4 so R-7 FIRES as a DISCLOSURE
        obligation and not as a stop or an invalidation; the disclosure naming all
        eleven moved cells with direction is present in summary.json.
        Independently reimplemented from the predicate at all 136 cells with 0
        mismatches on C_red, on h and on the evaluable flag. Verified AT CODE
        LEVEL rather than by assertion that the class is frozen before any sum set
        exists: pass 1 calls classify_cell(B, m, p), whose signature admits no sum
        set, and pass 2 copies the class in and never revises it. All 11 movers
        moved because measured B exceeds L, a property of the interval realisation
        that existed before any E did.
    - id: O-7
      label: controls that did NOT fire - DETERMINED
      text: >-
        CTRL-DL agreed on all 80,000 curve-versus-DL-image checks, INV-3 not
        fired. CTRL-CALIB-AP recovered the EV-STR-001 per-cell penalty inside the
        factor-2 window at 6 of 6 cells on ratio of medians, independently
        recomputed; INV-2a did not fire (the shared distinct-count and membership
        routine agreed with independently computed exact values on 7 of 7
        known-answer cases in every one of the six runs) and INV-2b did not fire.
        Only INV-2a could void the census from that leg, so THE CALIBRATION LEG'S
        VERDICT IS NOT-VOID. INV-1 did not fire. INV-6 did not fire: measured
        Pollard-rho walk-step means over 16 targets per size are ABOVE the
        0.886 sqrt(N) model position at every size, at ratios 1.0550, 1.0249,
        1.1496 and 1.0858 for k = 12, 14, 16, 18. NOISE-LIMITED excluded no cell -
        maximum measured relative null sd 1.641 per cent against the unmoved 2 per
        cent rule, so the realised margin is 1.22x rather than the 1.34x amendment
        C-4 predicted.
    - id: O-8
      label: INV-5 - UNADJUDICATED BY CONTRACT DEFECT
      text: >-
        RECORDED AS NEITHER FIRED NOR NOT FIRED, and that is the honest
        disposition rather than an evasion. The trigger turns on an unquantified
        word, "shrink", and v2 C-13 gives the disposition a three-way reading.
        Under the strict literal reading 16 of 49 cells do not shrink, which
        exceeds the three-cell trigger, so it fires. Under the purposive reading
        it does not: the largest absolute deviation of E from 1 among those 16
        cells is 0.0157, every one of them is inside the declared band, the
        randomised-factor-base comparator is itself a mean of only 3 to 10 draws,
        and the count of cells that both fail to shrink AND lie out of band is
        ZERO - all three out-of-band cells DO shrink. A trigger that fires on
        noise at in-band cells and would then forbid reading the out-of-band cells
        that pass it carries no information. The Executor's refusal to adjudicate
        under ST-4 and DEV-6 was correct. NOTHING TURNS ON IT HERE: the
        conservative branch - no interval-structure reading in either direction -
        is what scope requires regardless, and every E is void regardless.
    - id: O-9
      label: the three out-of-band cells - carried ONLY in the phrasing the red team requires
      text: >-
        CARRIED AS AN OBSERVATION, NOT AS EVIDENCE ABOUT YIELD, AND WITH NO RATIO
        REPORTED. In the frozen phrasing of objection OB-3: two factor bases on
        one 12-bit curve, at lambda between 0.33 and 0.45, with the deviation
        DECREASING in p. The two cells (k=12, beta=0.325) and (k=12, beta=0.350)
        have identical measured B = 22, identical C_red = 1782 and identical
        collision maximum load 14, because the intervening x values admit no point
        on that curve, so they select the SAME factor base; across the whole
        evaluable set this is the only duplicate, and the 49 cells carry 48
        distinct (k, m, B) triples. All three sit on ONE curve - k = 12, p = 4099,
        N = 4001, y^2 = x^3 + 4x + 8 - the smallest size in the design, where the
        contract's own declared weakness is exactly one curve per size. They do
        NOT sit at the smallest C_red (1340 and 1782 against a design minimum of
        578) but at the largest lambda among small-N cells, which is a finite-N
        approach-to-saturation signature and not a yield-heuristic signature; the
        recorded collision profile agrees, with maximum load 12 to 14 where a
        Poisson maximum at the same mean load over 4001 bins is about 4 to 5. NO
        INTERVAL-STRUCTURE, CURVE-STRUCTURE OR YIELD READING OF THESE CELLS IS
        WRITTEN HERE, in either direction.
    - id: O-10
      label: the counterfactual branch is O-6, not O-4
      text: >-
        RECORDED BECAUSE THE BATCH WAS DISPATCHED UNDER THE OPPOSITE FRAMING AND
        THE COMMITTED DATA CONTRADICTS IT. Branch O-4 requires the out-of-band set
        to exceed one third of the realised evaluable set. Recorded: 3 out-of-band
        cells against 49 evaluable, 6.12 per cent, against a one-third threshold
        of 16.33 cells. All TEN realised evaluable columns are FLAT - absolute OLS
        slope at most 0.05 with a 95 per cent interval containing zero, the
        largest being +0.0408 - so no column is down-significant or
        up-significant and branches O-8, O-2, O-3 and O-7 are excluded; O-1 fails
        because the out-of-band set is non-empty. THE FIRST MATCHING BRANCH IS
        O-6, SPARSE OUT-OF-BAND SET, whose disposition is `inconclusive` at batch
        level with the explicit instruction that NO COST MODEL IS RE-CHARGED. EVEN
        A FULLY REPAIRED NULL WOULD THEREFORE HAVE PRODUCED NO COST-MODEL
        CONSEQUENCE. This is a counterfactual about branch selection only; no E is
        recomputed here and none may be.
    - id: O-11
      label: cost position - the census is not and cannot be an attack
      text: >-
        Measured census cost over measured Pollard-rho cost on the identical
        instance is 28,384 at k = 12; 147,480 at k = 14; 512,582 at k = 16; and
        2,604,442 at k = 18, in a single declared operation unit (one
        elliptic-curve point addition or doubling). The census setup alone builds
        a discrete-logarithm table costing N group operations, already more than
        the 0.886 sqrt(N) a rho needs to solve the instance outright. Memory is
        reported beside time throughout: O(N) bits for the sum set plus the DL
        table, peak RSS 0.869 GB of an 8 GB cap, against BSGS's measured 64, 129,
        257 and 512 stored group elements. The harness's rho stores every visited
        class and stops at the first repetition, so it uses O(sqrt(N)) memory
        rather than the O(1) of a Floyd, Brent or distinguished-point rho, and a
        constant-memory variant would measure MORE steps for the same solve - that
        optimistic-for-the-baseline assumption is declared in the run record and
        is repeated here rather than left implied.

  inference: >-
    THE DATA CANNOT DISCRIMINATE, AND THE REASON IS NAMED. On the question this
    experiment was built to answer - whether the exhaustively measured
    decomposition count agrees with the counting heuristic B^m/(m! p) at 12 to 18
    field bits - this run set supports NO statement in either direction, because
    the pre-registered gate that had to certify the prediction P_pred before any
    efficiency could be read did not certify it. What INV-4 established is NOT
    that P_pred is wrong; it is that P_pred WAS NEVER CERTIFIED. "Not certified"
    and "refuted" are different words and VOID is the correct one for the first.
    What the run set DOES support, at claim tier toy and at no strength above
    preliminary, is exactly one instrument finding, stated in O-4: the occupancy
    null does not simulate the process P_pred models, the discrepancy is exactly
    one omitted deterministic term, and restoring that term recovers P_pred at 49
    of 49 cells under both available denominator readings. The fault is one term
    in a Monte Carlo control, not an error in any measured quantity: |S_m| is
    exhaustive, deterministic and seed-free, and the omitted term is exact set
    inclusion needing no simulation at all. That is a repairable instrument fault
    with a named repair, and it is recorded as such - but recording a located
    fault is not re-dispositioning a fired gate, and this record does not
    re-dispose it.
  inference_alternatives_not_discriminated: >-
    The two live explanations of the recorded shortfall are (i) the null
    control's construction omits a term P_pred contains, and (ii) P_pred is wrong
    in some further, unmodelled way. The evidence in hand favours (i) strongly -
    one term closes the residual at 49 of 49 cells under both readings, and a
    second unmodelled term would have shown in that residual - but the
    discriminating EXPERIMENT has not been run: no repaired-null draw exists
    under any archived run id. Until RC-A is archived, (ii) is not excluded by
    anything except an argument. That is why this record's own next step is RC-A
    and not a re-reading of these cells.

  boundaries:
    - >-
      MAXIMUM SCOPE ANY READING OF THIS PACKAGE COULD EVER HAVE HAD, had INV-4
      not fired: four prime field sizes k in {12, 14, 16, 18}; ONE prime-order
      curve per size by a deterministic rule; x-interval factor bases anchored at
      0 on the frozen 17-point beta grid; m in {2, 3}; unweighted decomposition
      with coefficients in {+1, -1}; multiset repetition allowed; membership
      decided by hash lookup with no polynomial solver; one implementation, one
      budget, one platform.
    - >-
      OUT OF SCOPE, AND THE LIST IS NOT DECORATIVE: other integer coefficients;
      adaptive factor bases; decomposition MULTIPLICITY as opposed to distinct
      coverage; beta_cert; the (m+1)/(2m) derivation; IDEA-20260727-006's headline
      gap claim (DEFER-BATCH011-002); any arity above 3; any binary or extension
      field; any curve family beyond the four selected; any field size outside 12
      to 18 bits; and EVERY CRYPTOGRAPHIC SIZE.
    - >-
      SINGLE UNREPLICATED RUN SET (N-4). Four field sizes on one curve each is a
      SIZE SERIES, NOT A REPLICATION. No strength above `preliminary` is available
      from it, and `reject_scoped` on it is forbidden.
    - >-
      THE SHORT-BOX REGIME IS BARELY ENTERED AND THAT DEFEATS EVERY READING ON
      OFFER. Measured B over interval length exceeds 1 at nearly every cell,
      aggregate 1.046, 1.077, 1.004 and 1.030 by size, and at k = 12 the whole
      beta grid saturates by beta = 0.500 with the sum set equal to the entire
      group. The regime an index-calculus cost model actually charges - B a
      vanishing fraction of a cryptographic-size field with m growing - is not
      entered at all, and the contract itself records `correspondence: null -
      direct sampling`, so no substitute-sampling route to scale exists here.
    - >-
      NO COST MODEL IS RE-CHARGED, FLAGGED OR DEFENDED ON THIS PACKAGE. Under P0
      no outcome branch is evaluated; under the counterfactual repair the branch
      is O-6, whose own disposition text forbids re-charging. Both roads end in
      the same place.
    - >-
      THE YIELD FACTOR THIS CENSUS MEASURES IS NOT THE BINDING FACTOR FOR THE
      PRIME-FIELD EXPONENT. Per the frozen v2 clause C-11 - stated there as a
      positioning claim with NO EXTERNAL SOURCE RETRIEVED, and that declaration is
      carried here verbatim and must NOT be upgraded into a citation - the
      decomposition-TEST cost is, and this contract deliberately excises it for
      instrument independence under DEC-20260727-009. Even a perfect outcome would
      have moved nothing about the prime-field exponent.
    - >-
      EXP-YIELD-001 MOVES NO EXPONENT. It is admitted under
      docs/target-result-profile.md rule A1 as an EXPONENT-DECIDING SCREEN,
      expressly NOT as an exponent-targeting mechanism, and no later record may
      quote any part of it as target-class, as an exponent result, as an attack,
      as a closure or as an impossibility claim. All four asymptotic-claim
      promotion gates remain OPEN and none is attempted.
    - >-
      DECLARE NO LANE DEAD. Nothing here is an impossibility result and the VOID
      is emphatically not one. The decomposition-yield question at m in {2, 3}
      over prime fields remains OPEN, and is now cheaper to answer than before,
      because the instrument fault is located and its repair is one term.

  unresolved_confounds:
    - >-
      ONE CURVE PER SIZE - UNADDRESSED BY DESIGN AND DECISIVE AT THE OUT-OF-BAND
      CELLS. The uniform-random factor-base null varies the FACTOR BASE, not the
      CURVE, so it cannot separate an interval-structure effect at small N from a
      property of the single curve y^2 = x^3 + 4x + 8. Only a multi-curve control
      at those cells can (RC-B), and none was run.
    - >-
      NON-INDEPENDENCE OF THE CELLS. The 17 beta cells at each (k, m) are NESTED
      intervals on a single curve, so measured B and hence C_red, h and the sum
      set are strongly positively correlated down each column, and the four sizes
      are four curves rather than four independent draws of a curve family. The
      one-third fraction clause, the extreme-value tail check and the standardized
      bulk check all treat the evaluable cells as independent tests, and they are
      not; the effective number of independent observations is closer to the
      number of curves than to 49. This changes no disposition here because every
      E is void, but it invalidates any future power or false-discovery statement
      computed on that denominator.
    - >-
      THE REALISED EVALUABLE SET IS BIASED TOWARD ITS NOISIEST CELLS. The R-7
      drift is one-sided: the set gained cells almost entirely by crossing the
      C_red floor, and 8 of the 11 movers sit at C_red between 578 and 722, the
      smallest-C_red and largest-relative-sd corner of the design.
    - >-
      THE IDENTITY BIN. The antipodal null partitions the non-identity elements
      into bin pairs, but a draw of the identity covers one bin and the sum set
      can contain the identity; the run record declares this and calls the effect
      O(1) without correcting it. It is second order against the omitted
      |S_(m-2)| term and does not change O-4, but a repaired null must handle it
      explicitly rather than by declaration.
    - >-
      THE DEVELOPMENT DRY RUN IS A SELF-ATTESTATION THAT NO SNAPSHOT CAN
      CORROBORATE, AND THIS RECORD DOES NOT ISSUE A CLEAN BILL. A scratch-root dry
      run preceded the declared runs and revealed the INV-4 firing; the Executor
      disclosed that only REPORTING changed in response. The committed driver has
      EXACTLY ONE commit in the entire repository and the dry run left no artifact
      outside the repository, so "only reporting changed" CANNOT BE DIFFED.
      What IS checked and does check out: every threshold, criterion, seed,
      control process, replicate count and cell-class rule in the committed driver
      traces to the committed contract pair frozen at 82327a02 and amended at
      59f2e930, both strictly earlier with third-party-checkable commit order;
      INV-4 is evaluated against the frozen formula with nothing subtracted; the
      add-back diagnostic fields are consumed by NO criterion, NO threshold and NO
      class; the only data-dependent branch is a reporting conditional; the cell
      class is frozen by function signature before any sum set exists; the primary
      metric is exhaustive, deterministic and seed-free, so it carries no seed, no
      sampling and no stopping rule that a dry run could have tuned; and the
      package re-executes bit-exactly, so no reported number is adjustable after
      the fact without changing the driver's own recorded hash. The residual is
      recorded honestly and closed only by RC-F, not by this record.
    - >-
      GOVERNANCE DEFECT D-1, MATERIAL AND UPSTREAM. No committed record moves
      EXP-YIELD-001 to `approved` or fills `approved_by`; the frozen specification
      blob still reads `review_required` and null at the snapshot commit. The
      contract's own execution gate WAS met by committed records - the
      TASK-20260729-011 PASS re-review at 009b90a5 and BUDGET-AMEND-20260729-001
      at 93d961e0, both verified ancestors of the run package - so the substantive
      authorization exists and only the formal transition is missing. It is
      supplied by DEC-20260729-001 and cannot be supplied by editing an immutable
      file.
    - >-
      GOVERNANCE DEFECT D-2, MATERIAL AND UPSTREAM. PC-1, PC-2 and PC-4 were never
      separately recorded by the Coordinator before dispatch as their own binding
      note required. Their texts DO exist verbatim in the committed
      TASK-20260729-011 review at 009b90a5, an ancestor of the run package, so the
      pre-data property survives on commit order; the separate recording is
      supplied by DEC-20260729-001. PC-2 predicted eleven class flips and eleven
      occurred, but they are NOT the same eleven - only five overlap - so the count
      agreement is COINCIDENTAL and must not be read as a confirmed prediction.
    - >-
      MINOR, DECLARED: the beta at which CTRL-DL draws its factor base is
      unspecified by the contract; the driver fixes 0.500 and records it per
      control, but this is not enumerated among the declared deviations DEV-1 to
      DEV-6.
    - >-
      PROVENANCE GAP D-5 / OB-11, RECORDED AND NOT REPAIRABLE BY ANY AGENT HERE.
      The Executor's manifests record `requested_policy: executor-implementation`
      resolving through the adapter to anthropic:claude-sonnet-5 at effort medium,
      against a self-reported executing session of claude-opus-5 with
      AUTORESEARCH_POLICY and AUTORESEARCH_BACKEND unset. It is recorded as a
      policy_binding_mismatch with `fallback_used: false` and
      `model_verified: false`, and doctor --probe was attempted and could verify
      nothing. The model identity behind every number in this package is therefore
      UNVERIFIED CONFIGURATION, disclosed rather than silently substituted, and
      that is carried into this record rather than dropped.
    - >-
      MODEL INDEPENDENCE IS NOT AVAILABLE AND IS NOT CLAIMED (INT-BATCH011-D,
      N-6). Both reviews assert SESSION independence, which holds - neither
      authored the contract, the amendment, the driver or the other's report - but
      the adapter resolves review-adversarial to anthropic:claude-opus-5 on the
      default backend and refuses it on the alternate backend because the policy
      requires xhigh against a binding ceiling of high, and no API key is set, so
      no identifier in this batch is probe-verified. The agreement between the two
      reviews is therefore NOT independent-model agreement and must not be counted
      as such anywhere downstream. The concrete cost of that is on this page: a
      single arithmetic slip propagated through an amendment and two
      independent-session pre-execution reviews without being caught.
    - >-
      PRE-REGISTRATION ORDER IS ESTABLISHED; CONFIRMATORY STANDING IS NOT. The
      frozen specification is byte-identical at every commit in the chain and both
      it and the amendment strictly precede the run package, so commit ORDER is
      checkable by a third party. But the amendment sets its own
      `confirmatory_status` to `exploratory_only` because it changed the
      evaluable-set definition, the null control supplying every standardized
      denominator, and the falsification branch structure. Order is a property of
      commits; confirmatory standing is a property of protocol stability. This
      record does not upgrade one into the other.

