  narrowest_supported_statement: >-
    EXP-YIELD-001 v2 SUPPORTS NO STATEMENT ABOUT DECOMPOSITION YIELD. Its
    invalidation rule INV-4 fired at 4 of 49 criterion-evaluable cells, so every
    occupancy-normalised efficiency E in the package is VOID rather than negative
    by pre-registration, no outcome branch is evaluated, and the void is never a
    negative mathematical result. What the batch DOES support, at claim tier toy
    and at no strength above preliminary, is a single instrument finding derived
    from committed quantities and independently re-derived at TASK-20260729-008
    and TASK-20260729-007: the occupancy null CTRL-NULL-SUMSET, as frozen in v1
    and as re-specified by amendment C-4, does not simulate the process that
    P_pred models, because it throws C_red balls into an empty N-bit set while
    P_pred is the mean of a process that also pre-marks the |S_(m-2)| bins that a
    cancelling multiset reaches deterministically; the discrepancy is exactly
    |S_(m-2)| exp(-C_red/N) at every one of the 49 cells, invisible at m = 2 where
    the term is 1 and dominant at m = 3 where it is B; and with that term restored
    the antipodal null recovers P_pred at 49 of 49 cells within 3 standard
    deviations under both the single-replicate and the standard-error-of-the-mean
    readings of INV-4. Correspondingly, C-4's claim that P_pred is correct to O(1)
    against the antipodal process holds at m = 2 and fails at m = 3. Separately,
    and as OBSERVATIONS rather than evidence: |S_m| is DETERMINED exhaustively at
    all 136 cells with no cell skipped and no firing of INV-1, INV-2a, INV-3 or
    INV-6; CTRL-DL agreed on all 80,000 curve-versus-DL-image checks; and the
    census cost 2.8e4 to 2.6e6 times a measured Pollard-rho solve of the same
    instance, so it is not and cannot be an attack.

