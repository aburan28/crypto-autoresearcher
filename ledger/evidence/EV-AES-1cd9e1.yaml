        it is |S|. THE TOTAL FALLS AS THE DECLARED PER-MEMBER COST RISES ACROSS
        THE THRESHOLD, and the step sits at exactly the value PT-1, PT-2 and
        PT-4 all sit on. Declaring more work than one performs -- which every
        cost model treats as the safe direction -- is rewarded with a strictly
        smaller total.
