  # =====================================================================
  # OBSTRUCTION. THE ADVERSE DIRECTION'S REUSABLE CONTENT IS THE NUMBER IT
  # MEASURED, NOT THE VERDICT IT REACHED.
  # =====================================================================
  obstruction:
    statement: >-
      A BLIND ADJUDICATION INSTRUMENT WHOSE EXCISION APPARATUS NAMES WHAT IT
      CUT DISCLOSES WHAT IT CUT. In
      PANEL-BATCH-ae07ce-TASK-20260903-59e9b9 every excision is recorded by
      QUOTING the first words of the removed span and by stating a REASON, and
      both sit inside the item they annotate, so the instrument carries -- to
      every reader, for every item -- the prior-disagreement status of that
      item, and for four items the governing clause, the deciding extensional
      fact, or the verdict in words. This is a property of the OBJECT: an
      excision marker that is a quotation is a disclosure of the quoted text,
      and a per-item excision reason drawn from a verdict-describing vocabulary
      is a per-item classification. It is not a statement about anyone's
      diligence and not a report that a measurement was hard.
    quantity: >-
      The number of the panel's ten frozen items whose excision apparatus
      (sentinel text plus stated reason) carries verdict-adjacent information
      readable by any classifier of the instrument, split by what is carried:
      prior-disagreement status; governing clause on the axis asked; the
      deciding extensional fact; the verdict in words.
    value: >-
      10 of 10 items carry prior-disagreement status through their excision
      reasons (SPEC-01, SPEC-02/03, SPEC-04, SPEC-05 read "rule application and
      two opposite verdicts"; SPEC-06 reads "names both candidate verdicts
      explicitly"; SPEC-07 through SPEC-10 carry single-verdict reasons).
      4 of 10 items carry more than status: SPEC-01 (clause A-4 named as
      engaged), SPEC-02 and SPEC-03 (the deciding extensional fact, verbatim:
      "FACTS: P and P' compute the SAME function"), SPEC-08 (the verdict in
      words: "is OUTSIDE the S-box route and triggers inadmissibility"), and
      SPEC-10's reason names clause B-1's antecedent as the governing clause on
      the very axis asked. 3 of 3 published verdict columns were produced by
      readers whose own recorded reading list includes the panel file in full;
      0 of 3 record having skipped the `source.excised_spans` blocks.
      1 further residual leak of a different class was found by the validator
      and is not in the panel's own disclosure list (the charging form
      "(N/S_k + X/X_k) AEU-k" reproduced in the panel's R5 block and
      misdescribed there as appearing in the quoted specifications, when it
      appears in none of the ten).
      UNITS: counts of items and of columns. ERROR BARS: NOT APPLICABLE AND
      SAID SO RATHER THAN OMITTED -- these are exact counts over a CENSUS of
      the fields of one immutable file, not estimates from a sample. A later
      reader regenerates every one of them by exact substring search over
      panel-spec.yaml at 7d895a33b.
    measured_by:
      - TASK-20260903-2b5dc5
      - TASK-20260903-34d50e
      - TASK-20260903-8ede4c
    measured_by_note: >-
      NO RUN-* OR EXP-* IDENTIFIER EXISTS FOR THIS VALUE AND NONE IS INVENTED
      (SC-10). This batch ran no experiment. The counts are read from
      coordination/goals/GOAL-AES-002/batches/BATCH-ae07ce/tasks/TASK-20260903-59e9b9/panel-spec.yaml
      as committed at 7d895a33b and content-verified at 4f5115ad0. The task
      identifiers above are the sessions that read them: TASK-20260903-2b5dc5
      established the finding (OBJ-RT-2) and quoted the four instances
      verbatim; TASK-20260903-34d50e independently established the
      excision-offset facts and the fifth residual leak (BL-1, BL-2, BL-4);
      TASK-20260903-8ede4c confirmed the sentinel bytes at the declared field
      paths in its own session. tools/validate_ledger.py checks `measured_by`
      only for being a nonempty list and does not resolve its entries; naming
      the reading tasks here is therefore permitted, and it is done because
      this block asks WHERE THE VALUE IS READ FROM and the honest answer is a
      file plus three sessions, not a run.
    scope: >-
      The ten items of PANEL-BATCH-ae07ce-TASK-20260903-59e9b9 as frozen at
      commit 7d895a33b and content-verified at snapshot 4f5115ad0, and the
      three verdict columns classified against it (T-004 and T-003-SUPERSEDED
      by TASK-20260903-373afa, T-005 by TASK-20260903-9318b5). CLAIMED OF NO
      OTHER PANEL, NO OTHER INSTRUMENT, NO OTHER CAMPAIGN AND NO OTHER
      RUNTIME. In particular it is NOT claimed that every adjudication
      instrument with named excision markers leaks -- that is the reasonable
      generalisation and it is untested, which is exactly why the candidate
      knowledge entry is not promoted on this batch.
    resource_check:
      examined: true
      reading: >-
        THE REVERSAL WAS RUN AND IT FOUND A GENUINE RESOURCE, WHICH IS RECORDED
        AS A CANDIDATE READING AND NOT AS EVIDENCE. Under one theory this
        measurement is a HYPOTHESIS rather than a refutation: the panel's own
        LEAK-1 already names the tension the number measures -- a blind
        instrument must quote its source verbatim so the quotation is auditable,
        and must withhold that source's conclusions so the reader is blind, and
        a NAMED cut point cannot do both. Read that way, the count is not a
        defect of this panel but the measured cost of provenance-by-quotation,
        and it points at a constructive object: CONTENT-ADDRESSED EXCISION --
        record each cut point as a byte offset into, and a SHA-256 of, the
        committed source field, with the excision reason drawn from a fixed
        vocabulary that names no clause, no verdict and no disagreement status.
        That instrument discharges both duties at once: a later reviewer
        reconstructs exactly what was dropped by opening the cited field, while
        the classifier reads a commitment it cannot invert. THE OBJECT IS
        REUSABLE BEYOND THIS CAMPAIGN, which is why it is the named knowledge
        candidate in DEC-20260903-9c3e26 -- and it is NOT promoted on this
        batch's evidence, because it rests on one panel read by one model
        family and its generalisation is untested.
        A SECOND REVERSAL WAS ALSO EXAMINED AND IS RECORDED AS WEAKER: the red
        team's own `the_reversal_run_against_the_obstruction` proposes that if
        A5-3's bar really does reduce, on the kinds it exists for, to "does the
        attack perform the operation", then the repair sequence has been
        CONVERGING on a rule with one undefined predicate rather than three,
        and the remaining work is to individuate "the attack's
        specification-level description" rather than to write a fourth
        amendment against a fourth term. That is a resource reading of O-7's
        obstruction, not of this one, and the red team states it changes no
        status and is not evidence. Recorded here so it is not lost.
      spawned_ids: []
      spawned_ids_note: >-
        EMPTY BECAUSE THIS TASK MINTS NO IDENTIFIER IT DOES NOT WRITE. Two
        records are warranted by the readings above -- a KN-TECH entry for
        content-addressed excision and an IDEA-* or panel record for the
        successor instrument -- and both require identifiers allocated by
        `python3 tools/allocate_id.py` in a session whose write scope reaches
        those paths. Neither is in this task's write scope. Named in
        DEC-20260903-9c3e26 rather than minted here.

