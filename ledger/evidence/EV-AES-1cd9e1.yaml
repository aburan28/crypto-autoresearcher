evidence:
  # =====================================================================
  # THE EVIDENCE RECORD CLOSING BATCH-ae07ce, GOAL-AES-002.
  # WRITE-ONCE. CORRECTIONS ARE NEW RECORDS, NEVER EDITS TO THIS ONE.
  # =====================================================================
  id: EV-AES-1cd9e1
  goal_id: GOAL-AES-002
  question_id: RQ-AES-002
  batch_id: BATCH-ae07ce
  recorded_by_task: TASK-20260903-8ede4c

  hypothesis_id: null
  hypothesis_id_note: >-
    GOAL-AES-002's `active_hypothesis_ids` is [] and this batch creates none.
    BATCH-ae07ce built an INSTRUMENT (a frozen ten-item adjudication panel),
    ran three verdict columns against it, authored one protocol amendment, and
    reviewed the package twice. None of that is a hypothesis-testing act about
    any mathematical object. This record therefore reviews the BATCH-ae07ce
    package against RQ-AES-002 directly and is evidence for or against no
    H-AES-* record. Naming a hypothesis here would invite exactly the
    inference the batch cannot support.

  experiment_ids: []
  run_ids: []
  run_ids_note: >-
    NONE, AND NONE IS INVENTED (SC-10). No experiment ran in this batch. All
    eight handoffs declare `maximum_runs: 1`; every producer and both reviewers
    record `runs_used: 0` with the reason. The operations that WERE performed by
    the sessions holding a command-execution tool -- sha256sum over committed
    blobs, git log / show / ls-tree / merge-base / diff, YAML and JSON parsing,
    exact-substring and offset comparison, and a SequenceMatcher similarity
    ratio over verdict cells -- are ARTIFACT VERIFICATION instruments, not
    experiment runs. They are not recorded as RUN-* here and are charged
    against no `maximum_runs` budget. Two sessions in this batch (the panel
    freeze, the amendment authoring) and this closing session had no
    command-execution tool at all and could perform none of them.

  type: empirical
  type_note: >-
    MIXED CONTENT, DISCLOSED RATHER THAN FORCED INTO A FALSE SINGLE LABEL, on
    the same reading EV-AES-3cb33c and EV-AES-5283c8 each gave their own
    packages. `empirical` is selected because this record's decisive adverse
    content is a CENSUS OF COMMITTED BYTES, not an argument: the frozen panel's
    own `excised_spans` fields carry, verbatim and inside the item they
    annotate, the deciding extensional fact for one pair of items and the
    verdict in words for another, and the excision REASONS partition all ten
    items by prior-disagreement status. That is read by exact field inspection
    of one immutable file and is reproducible by anyone who opens it. The same
    label covers the mechanically reproduced facts of the package: recomputed
    digests, git-verified freeze ordering, the cell-by-cell copy test on the
    null-object control, and nine recomputed derived counts. WHAT THE LABEL
    DOES NOT UPGRADE, AND THIS IS STATED SO IT CANNOT BE READ AS UPGRADED: the
    relocation findings (R1, R2, R3, OBJ-RT-6, OBJ-RT-9, OBJ-RT-10) are
    DERIVATIONS over committed rule text -- worked, self-contained,
    reader-checkable constructions, each asserted of no real cipher and of no
    round count -- and they are evidence of exactly that kind and no other.

  direction: weakens
  direction_note: >-
    SCOPED EXACTLY, AND IT IS NOT A CLAIM ABOUT AES OR ABOUT ANY MATHEMATICAL
    OBJECT. What this record weakens is TWO THINGS AND ONLY TWO, both of them
    claims this campaign makes about its OWN artifacts.
    (i) IT WEAKENS THE CLAIM THAT PANEL-BATCH-ae07ce-TASK-20260903-59e9b9 IS A
    BLIND ADJUDICATION INSTRUMENT. The panel's excision apparatus discloses to
    every reader the information the excision was performed to withhold. The
    weakening rests on the panel's own committed bytes, not on any reading of
    them, and it is therefore not softened by the model-independence cap
    recorded below.
    (ii) IT WEAKENS PROTOCOL-AMENDMENT-GOAL-AES-002-005's DESIGN CLAIM THAT
    NOTHING WAS INSTALLED -- that each failing term was REMOVED from the
    operative test rather than redefined, so ambiguity cannot relocate a third
    time. The removals are real and are credited below; the claim that nothing
    decision-critical replaced them fails on derivations over the amendment's
    own committed clause text.
    WHAT THIS RECORD DOES NOT WEAKEN, STATED BECAUSE PREMATURE CLOSURE IS A
    FAILURE MODE SYMMETRIC WITH OVERCLAIMING: it does not weaken the
    repair-by-amendment line as such -- neither review asserts that line is
    saturated and the red team expressly declines to; it does not weaken
    amendment 005 as rule text, whose correctness this batch did not assess
    (VAL LIM-6); it does not weaken CM-1; and it asserts NOTHING about AES at
    any round count, in either direction.

  strength: inconclusive
  strength_note: >-
    `inconclusive` IS THE LITERAL DEFINITION IN docs/evidence-and-reproducibility.md
    -- "Data do not distinguish the relevant explanations" -- AND IT IS EXACTLY
    THE STATE OF ALL THREE VERDICT COLUMNS. The instrument they were classified
    against tells its reader, item by item, whether two prior readers split on
    that item; for the P/P' pair it states the deciding fact that P and P'
    compute the same function; for SPEC-08 it states the verdict in words. No
    column can therefore distinguish (a) the text decides this cell, from (b)
    this reader decides this cell, from (c) the instrument told the reader this
    cell. The batch's own design intended the null-object control and the
    determinacy grades to separate (a) from (b); nothing in the design
    anticipated (c), and nothing in the package can now remove it.
    WHY NOT `anecdotal`: that tier describes a valid but small observation
    useful for generating hypotheses. It would understate the census facts
    (which are exact and reproducible) and overstate the columns (which are not
    a small measurement of the target quantity but no measurement of it at
    all).
    WHY NOT `contradictory`: no two valid experiments materially disagree here.
    There is one instrument, it leaks, and its three columns are all downstream
    of the same leak.
    INDIVIDUAL FACTS INSIDE THE PACKAGE ARE STRONGER THAN THE PACKAGE, and are
    itemised in `observations` O-11: the freeze ordering, the seal pin, the
    copy test on the null control, the excision-fidelity offsets and the
    digest agreements are deterministic operations over committed bytes whose
    outputs a later reader can regenerate from the commands recorded beside
    them, and their value does not depend on which model ran them. The package
    strength is not raised on that basis, because the load-bearing quantity
    this batch was convened to measure is the one the instrument cannot carry.

  claim_tier: toy
  claim_tier_note: >-
    Per RQ-AES-002 R7, the default tier is `toy` for every evidence record
    under this question, and nothing in this batch approaches R7's single
    `crypto` gate. NO CRYPTANALYTIC MEASUREMENT, NO COST CLAIM, NO MARGIN, NO
    DISTINGUISHER, NO KEY RECOVERY AND NO CERTIFICATE OF ANY KIND EXISTS
    ANYWHERE IN THIS BATCH, and nothing is asserted about AES at any round
    count in either direction. Every producer and both reviewers independently
    state the same ceiling for their own records: SPECIFICATION RESULT ONLY.
  certificate_refs: []

  proof_status: derivation
  proof_status_note: >-
    SCOPED EXACTLY, AND THE REFUTATION-ARTIFACT LADDER WAS CLIMBED BEFORE THIS
    RECORD'S ADVERSE DIRECTION WAS SET (docs/claims-and-verification.md,
    "Refutation artifacts"; agents/coordinator.md).
    FOR WEAKENING (i), THE PANEL'S BLINDNESS: the artifact is stronger than a
    derivation note and is recorded at its true strength rather than inflated
    or deflated. It is the frozen panel's OWN COMMITTED BYTES at declared field
    paths -- `items[SPEC-02].source.excised_spans[1].begins_at_sentinel` and
    `items[SPEC-03].source.excised_spans[0]`, which read "FACTS: P and P'
    compute the SAME function"; and
    `items[SPEC-08].source.excised_spans[0].begins_at_sentinel`, which reads
    "is OUTSIDE the S-box route and triggers inadmissibility". Those bytes were
    committed at 7d895a33b, long before this decision, and are content-verified
    at snapshot 4f5115ad0 by two independent sessions. A reader refutes or
    confirms the finding by exact substring search over one immutable file,
    which is as close to a counterexample certificate as a claim about what an
    instrument discloses can come. `certificate` is nonetheless NOT claimed,
    because no independent code re-checks it and the inference from "the reader
    could read it" to "the instrument is not blind" is an argument, not a
    machine check.
    FOR WEAKENING (ii), AMENDMENT 005's DESIGN CLAIM: level 2, derivation.
    RT-20260904-2b5dc5 OBJ-RT-6 reads CM-1 element (a)'s conversion routes
    directly and shows that limb (3) of clause A5-3 cannot be false for A5-4
    kinds (2) and (3), so the three-limb test collapses to the newly installed
    predicate "does the attack perform it" on exactly the operations Route 3's
    bar was written about; VAL-20260904-9318b5 R2 exhibits a panel object
    (SPEC-02/SPEC-03) whose two readings of B5-3's new full-key predicate
    diverge, with a measured two-cell price. Each is worked, self-contained and
    checkable against committed clause text.
    LEVEL 1 IS NOT AVAILABLE AND IS RECORDED AS UNAVAILABLE RATHER THAN AS
    UNATTEMPTED: a counterexample certificate that independent code re-checks
    does not exist for a claim about how two readers read a sentence. THE
    NEAREST CHECKABLE SUBSTITUTE IS RC-6's TWO-READER MEASUREMENT, WHICH THIS
    BATCH DID NOT MAKE ON ANY CELL and which is this record's single next
    action.
  proof_refs:
    - coordination/goals/GOAL-AES-002/batches/BATCH-ae07ce/tasks/TASK-20260903-59e9b9/panel-spec.yaml
    - coordination/goals/GOAL-AES-002/batches/BATCH-ae07ce/reviews/TASK-20260903-2b5dc5/red-team-report.yaml
    - coordination/goals/GOAL-AES-002/batches/BATCH-ae07ce/reviews/TASK-20260903-34d50e/validation-report.yaml
    - coordination/goals/GOAL-AES-002/batches/BATCH-ae07ce/tasks/TASK-20260903-9318b5/verdict-tables-005.yaml
    - coordination/goals/GOAL-AES-002/amendments/protocol-amendment-GOAL-AES-002-005.yaml
    - coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/protocol/CM-1.yaml
  proof_refs_archival_note: >-
    THE SEQUENCING IS STATED PLAINLY BECAUSE THE RULE MATTERS AND THE ANSWER
    IS FAVOURABLE ONLY IN PART. The DECISIVE BYTES for weakening (i) -- the
    panel's own excision sentinels -- were archived BEFORE this decision:
    committed at 7d895a33b when the panel was frozen and content-bound by the
    snapshot archive at 4f5115ad0 (binding_mode content_first), whose seven
    declared digests two independent sessions recomputed and matched. The same
    is true of amendment 005's clause text (85383bc7c) and of CM-1. WHAT IS
    ARCHIVED WITH, NOT BEFORE, THIS DECISION is the two REVIEW REPORTS that
    read those bytes: they are committed by the same isolated ledger archive
    (TASK-20260903-8ede4c) that commits this record and DEC-20260903-9c3e26,
    exactly as BATCH-241d37 and BATCH-286bcd committed their own review reports
    alongside their evidence and decision. That is disclosed rather than
    presented as a prior snapshot.

  # =====================================================================
  # OBSERVATIONS. WHAT THE FOUR PRODUCER OUTPUTS AND THE TWO INDEPENDENT
  # REVIEWS ACTUALLY ESTABLISH. EVERY CONCLUSION CITES ITS FINDING ID AND
  # ITS PATH. THE ADVERSE STRUCTURAL FINDINGS COME FIRST BECAUSE THEY
  # GOVERN EVERYTHING AFTER THEM.
  # =====================================================================
  observations:

    - id: O-1
      title: >-
        THE CENTRAL FINDING. THE FROZEN PANEL IS NOT BLIND. ITS EXCISION
        APPARATUS CARRIES THE FACTS THE EXCISION WAS PERFORMED TO WITHHOLD,
        AND ALL THREE COLUMNS WERE CLASSIFIED BY READERS WHO READ IT.
      established_by: >-
        RT-20260904-2b5dc5 OBJ-RT-2 (severity HIGH, new to that review),
        confirmed by this Coordinator from the panel file's own bytes at the
        declared field paths.
      what_the_bytes_say: >-
        The panel names every cut point by QUOTING the first words of the
        removed text and by stating a REASON, and both sit inside the item they
        annotate. SPEC-02 and SPEC-03 -- the P/P' pair -- carry the sentinel
        "FACTS: P and P' compute the SAME function", and the panel's own reason
        for excising that span says the fact is "exactly what the panel
        measures whether a reader finds unaided, so carrying them would prime
        the verdict". The sentinel then carries it, verbatim, in the same
        block. SPEC-08 carries the sentinel "is OUTSIDE the S-box route and
        triggers inadmissibility", which is the verdict in words. SPEC-10's
        excision reason states that the removed text "applies clause B-1's
        antecedent and then states the verdict explicitly" -- naming the
        governing clause on the very axis being asked. SPEC-01's sentinel "The
        submitter's A-4 disclosure is" discloses that clause A-4 is engaged.
      the_systematic_channel_beyond_the_four_instances: >-
        The excision REASONS partition the panel by historical disagreement
        status. SPEC-01, SPEC-02/03, SPEC-04 and SPEC-05 each carry "rule
        application and two opposite verdicts"; SPEC-06 carries "names both
        candidate verdicts explicitly"; SPEC-07 through SPEC-10 carry
        single-verdict reasons. A reader is thereby told, ITEM BY ITEM, whether
        two prior readers split on it. That is the single most verdict-adjacent
        fact an instrument of this kind could carry, and it is carried for all
        ten items.
      why_the_panels_own_self_check_does_not_answer_it: >-
        `blindness_self_check` searched the file for the stems admissib /
        unadjudicab / bundl / separate charge / pass, FOUND the hits in the
        SPEC-07 and SPEC-08 sentinels, and dismissed them on the ground that
        they are "NOT AN ITEM'S SPECIFICATION". THAT IS A LOCATION ARGUMENT
        OFFERED AGAINST AN INFORMATION QUESTION. Information the reader can
        read is information the reader has, whatever field it sits in. The
        check was well designed for the leak class it was aimed at and blind to
        this one; VAL-20260904-34d50e BL-4 independently found a fifth residual
        leak of yet another class (the charging form "(N/S_k + X/X_k) AEU-k"
        reproduced in the panel's own R5 block and misdescribed there as
        appearing in the quoted specifications, when it appears in none of them
        and its provenance is material the panel excised as verdict-bearing).
      the_consequence_that_no_record_in_the_batch_discounts: >-
        THE T-005 COLUMN'S SELF-DECLARED "SINGLE STRONGEST RESULT IN THIS
        COLUMN" IS THAT THE P/P' PAIR CLASSIFIES ALIKE UNDER -005. That reading
        was produced by a session whose own `open_order_recorded.before_sealing`
        lists "panel-spec.yaml (in full)" -- i.e. by a reader that had been
        told, inside the instrument, that P and P' compute the same function.
        The pair result is contaminated at the instrument level in ALL THREE
        columns, and no record in this batch discounts it on that ground.
        VAL-20260904-34d50e's `does_it_contaminate_the_whole_column` block
        expressly names the P/P' result as "the column's strongest genuinely
        blind content"; on O-1 that sentence does not hold, and this record
        supersedes it. THE VALIDATOR IS NOT AT FAULT: it owned the
        card-leak joint, not the instrument-leak joint, and the red team owned
        the latter and broke it.
      what_would_refute_o_1: >-
        A classifier that recorded, before sealing, that it did not read the
        `source.excised_spans` blocks. NEITHER COLUMN RECORDS THAT; both record
        reading the panel file, and the T-004 column's reading rules do not
        mention the sentinels at all.
      not_repaired_here: >-
        The panel is a committed record and is immutable. NO EDIT IS MADE AND
        NONE IS PROPOSED. The repair is a successor instrument with
        content-addressed excision, which is this record's single next action.

    - id: O-2
      title: >-
        SECOND STRUCTURAL FINDING. THE FROZEN PANEL IS A TRAINING SET FOR
        AMENDMENT 005 BEING RE-USED AS ITS TEST SET. THE FREEZE REMOVED ITEM
        SELECTION, NOT TEXT FITTING.
      established_by: RT-20260904-2b5dc5 OBJ-RT-1 (HIGH, new to that review).
      the_committed_timestamps: >-
        Read from git by the red team, and independently by the validator
        (CC-2) and by the -005 reader: panel freeze 7d895a33b at
        2026-09-04T15:35:13Z; T-004 / T-003 verdict tables d6f309ad7 at
        16:09:58Z; amendment 005 text 85383bc7c at 16:44:44Z, the only commit
        ever touching that path. THE AMENDMENT-005 TEXT POSTDATES THE T-004
        COLUMN BY 35 MINUTES OF COMMITTED HISTORY.
      what_follows: >-
        The freeze establishes that the ITEMS were not chosen to suit the text.
        It establishes nothing about the converse, and the converse is what
        happened. -005's `ambiguities_addressed` sources AMB-11 to a defect
        "evidenced by PVF-1", which IS a panel cell (SPEC-10 axis B); it carries
        a top-level block `the_spec_10_disagreement` whose `how_005_resolves_it`
        explains how clause B5-3 makes that cell come out BUNDLED; and
        VAL-20260904-34d50e A5-CHK-3 confirms -005 cites the blind T-004
        verdicts twice by name. ZERO OF THE TEN ITEMS WAS HELD OUT. The -005
        column is therefore an IN-SAMPLE determinacy report and cannot measure
        whether the repair generalises to a shape its author had not already
        seen a verdict for.
      the_internal_contradiction_this_exposes: >-
        The same file asserts, at `how_the_frozen_panel_was_used_and_how_it_was_not`,
        that "NO CLAUSE BELOW WAS CHOSEN, WORDED OR ORDERED TO MAKE ANY PANEL
        CELL COME OUT A PARTICULAR WAY", and carries, as a top-level block, a
        clause-by-clause account of how one named panel cell is made to come out
        one way. NEITHER THIS RECORD NOR EITHER REVIEW ESTABLISHES OR ALLEGES
        ANY INTENT; what is checkable from outside is that the record asserts
        both. The amendment's author disclosed the citation itself, unprompted,
        and named the SPEC-10 resolution as "the first thing a reviewer should
        be suspicious of" -- which is recorded to its credit and does not reduce
        the finding.
      forward_consequence_that_must_travel: >-
        A -006 written after reading the -005 column inherits this defect
        exactly. The instrument's power against each successive amendment is
        STRICTLY DECREASING and the campaign has no held-out reserve.

    - id: O-3
      title: >-
        MODEL INDEPENDENCE IS ZERO FOR THE ENTIRE CHAIN, REVIEWS INCLUDED, AND
        IT IS A STANDING CAP ON EVERY AGREEMENT-BASED READING OF THIS BATCH.
      established_by: >-
        VAL-20260904-34d50e CC-7 and F-2 and F-13; RT-20260904-2b5dc5
        inference.model_independence_finding; snapshot-receipt.json F-1; and
        the self-report of every deliverable in the batch.
      what_was_declared: >-
        BATCH-ae07ce's batch.yaml `model_independence_note` and
        DEC-20260903-7548c0 both record that this batch's coordinator and
        validator tasks would run on fireworks/glm-5p3, a DIFFERENT family,
        EXPRESSLY to repair BATCH-241d37's recorded MODEL INDEPENDENCE ZERO.
        The plan was not fanciful: DEC-20260903-7548c0's own `decided_by` line
        records that the decision itself was taken on
        accounts/fireworks/models/glm-5p3.
      what_actually_happened: >-
        EVERY TASK IN THIS BATCH SELF-REPORTS claude-opus-5. Panel freeze,
        freeze receipt, T-004/T-003 columns, amendment 005, its report, the
        T-005 column, the snapshot receipt, the VALIDATION and the RED TEAM --
        and this closing Coordinator. The count is 9 of 9. The family is the
        same one that authored protocol-amendment-GOAL-AES-002-003, -004 and
        RT-20260901-3ad5d2, which are the records the panel is BUILT FROM and
        BUILT TO TEST.
      it_is_not_a_policy_downgrade_and_is_not_recorded_as_one: >-
        The capability contracts were honoured. orchestration/model-bindings.yaml
        binds review-adversarial on the anthropic backend to claude-opus-5 at
        ceiling `max`, above the requested xhigh; no session requested or
        accepted a downgrade, and both reviewers record that they would have
        refused rather than proceed. THE DIVERGENCE IS FROM THE BATCH'S STATED
        CROSS-FAMILY PLAN, NOT FROM THE POLICY LAYER, and the distinction is
        recorded so a later reader does not repair the wrong thing.
      the_binding_consequence: >-
        NO AGREEMENT ANYWHERE IN THIS BATCH IS CORROBORATION. Not between
        amendment 005 and the T-005 column; not between the two columns; not
        between either review and any producer; not between the two reviews;
        and not between this record and any of them. The red team states of
        ITSELF that it is inside the correlated set it was dispatched to break,
        and states the asymmetry that follows: a shared blind spot of this
        family would be INVISIBLE HERE BY CONSTRUCTION, so the absence of an
        objection in either review is not evidence that none exists.
      what_is_not_touched_by_it: >-
        The deterministic operations over committed bytes -- the recomputed
        digests, the git ordering checks, the excision offset and substring
        checks, the cell-by-cell copy test, and the nine metric recomputations
        -- are regenerable by a later reader with the commands recorded beside
        them and their value does not depend on which model ran them. Every
        JUDGEMENT in either review is capped. The validator draws this line
        itself at F-13 and this record adopts it.

    - id: O-4
      title: >-
        A DISPATCH DEFECT CAUSED BY THE ORCHESTRATING SESSION. THE
        TASK-20260903-9318b5 CARD LEAKED THE ANCHORS IT INSTRUCTED THE READER
        TO AVOID, AND THE TRUE SCOPE IS WIDER THAN THE ONE CELL IT IS MARKED
        ON.
      established_by: >-
        Self-disclosed by the affected reader (VAL-20260904-9318b5 section (a)
        and `second_leak_from_the_same_card`); scoped by VAL-20260904-34d50e
        `blindness_defect_scope_assessment`; recorded by snapshot-receipt.json
        F-2.
      what_leaked: >-
        Before any verdict was formed, the card restated SPEC-10's two prior
        answers by name (that amendment 004's author recorded BUNDLED and that
        the previous blind reader recorded SEPARATE_CHARGE_APPLIES); the prior
        columns' MARGINALS (5 undetermined of 13 informative under -003, 0
        under -004); and the prior 7-of-20 NOT_ENGAGED count -- after
        instructing that same reader to hash its verdicts before opening the
        prior tables.
      who_caused_it_and_who_caught_it: >-
        CAUSED BY THE ORCHESTRATING SESSION THAT WROTE THE CARD, not by the
        reader. CAUGHT BY THE READER, which marked the cell
        BROKEN_AND_DISCLOSED, refused to claim blindness for it, stated its
        reasoning in full so the route is checkable without trusting its
        blindness, derived its own NOT_ENGAGED count rather than inheriting the
        leaked one, counted the marginal both ways, disclosed the second leak
        unprompted, and named the remedy in the required words.
      the_true_scope_established_by_the_validator_and_not_retracted: >-
        ONE CELL HAS A DISCLOSED ANSWER-LEVEL BREAK; ONE FURTHER CELL SHARES
        THAT CELL'S ENTIRE DECISION PATH AND IS NOT MARKED; AND ALL TWENTY SIT
        UNDER A COLUMN-LEVEL MARGINAL ANCHOR. SPEC-09 axis B carries the same
        verdict, the same confidence and an overlapping clause list, and the
        reader's own R1 analysis treats SPEC-09 and SPEC-10 as one object,
        stating that under the other denominator SPEC-09 flips and SPEC-10
        flips with it; it carries no `blindness` annotation. And the marginal
        leak CANNOT be cell-scoped: the card supplied the shape of the answer
        distribution in a design whose entire deliverable IS that distribution,
        so every aggregate the column publishes is downstream of a disclosed
        prior for those same aggregates. The reader's own mitigation -- that
        its counts match neither prior column -- is offered as weak evidence
        and correctly labelled weak; it cannot separate "the anchor did not
        bind" from "the anchor bound loosely", and no statistic computed inside
        the anchored column can.
      why_this_is_recorded_as_the_smaller_defect: >-
        IT IS REAL AND IS NOT RETRACTED. It is smaller than O-1 because it
        affects one column and O-1 affects the instrument, hence all three. A
        card that leaks can be frozen and fixed by dispatch discipline; an
        instrument that leaks must be rebuilt.

    - id: O-5
      title: NO TASK CARD IS COMMITTED ANYWHERE. THE LARGEST AUDITABILITY GAP IN THE PACKAGE.
      established_by: VAL-20260904-34d50e AC-6 and F-9.
      the_fact: >-
        All eight committed task cards in
        coordination/goals/GOAL-AES-002/batches/BATCH-ae07ce/task-cards/ are
        FIVE-LINE STUBS naming role, policy, budget, handoff path and write
        scope. The substantive dispatch text -- including the text the -005
        reader quotes as having disclosed both prior positions on SPEC-10 axis
        B -- EXISTS IN NO FILE IN THIS REPOSITORY, and no task card is bound by
        any archive in this batch.
      the_consequence: >-
        THE ONLY EVIDENCE OF THE CONTENT OF THE CARD THAT BROKE BLINDNESS IS
        THE AFFECTED READER'S OWN QUOTATION OF IT. A blindness protocol whose
        breaches are recorded only by the party affected by them cannot be
        independently scoped, and the validator's own scoping of that breach
        inherits that bound and says so. It also means the red team's
        disclosure that ITS card supplied framing ("two prior amendments died
        of relocation"; "amendment 005 reports six controls") is likewise
        uncheckable from outside.

    - id: O-6
      title: >-
        DETERMINACY REGRESSED, AND ONE PUBLISHED DERIVED COUNT DOES NOT
        RECOMPUTE -- IN THE DIRECTION THAT UNDERSTATES THE PRODUCER'S OWN
        RESULT.
      the_numbers_as_published: >-
        T-003-SUPERSEDED: 5 undetermined of 13 informative cells. T-004: 0 of
        13. T-005: 3 undetermined of 12 informative cells (equivalently 3 of 13
        on the alternative count the -005 reader also published). On the
        panel's own headline metric T-005 IS WORSE THAN T-004 and better than
        T-003-SUPERSEDED.
      the_confound_that_travels_with_the_comparison_and_is_stated_first: >-
        THE THREE COLUMNS DO NOT ISOLATE THE TEXT. T-003 and T-004 share one
        reader and are comparable to each other; T-005 was produced by a
        different session and is NOT a clean text-only contrast with either, so
        every column-to-column difference involving it confounds TEXT with
        READER (VAL CH-4). The -005 reader states this before its own numbers
