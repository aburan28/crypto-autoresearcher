  # =====================================================================
  # INFERENCE. WHAT THE PACKAGE, TAKEN TOGETHER, SUPPORTS.
  # =====================================================================
  inference: >-
    THE BATCH BUILT AN INSTRUMENT THAT LEAKS THE ANSWERS IT WAS BUILT TO
    WITHHOLD, SO ITS THREE COLUMNS ARE NOT THE MEASUREMENT THE CAMPAIGN
    WANTED, AND THE OPERATIVE CLAIM REMAINS UNMEASURED. That is the finding,
    and it is a finding about this campaign's own instrument, not about AES and
    not about any mathematical object.
    The chain is short and every link is a committed byte. The frozen panel
    names each excision by quoting the removed text and stating a reason, so
    each item carries its own prior-disagreement status and, for the P/P' pair,
    the deciding extensional fact, and for SPEC-08 the verdict in words (O-1).
    All three columns were classified by readers who record having read the
    panel in full. Therefore no cell in any column can discriminate "the text
    decides this" from "the instrument told the reader this", and the
    self-declared strongest result of the T-005 column -- the P/P' pair
    classifying alike -- came from a reader that had been told the pair
    computes the same function. On top of that instrument defect sit three
    further ones that each independently bound what the columns can carry: the
    panel is a training set for -005 re-used as its test set, with zero items
    held out (O-2); the -005 column's dispatch card supplied both prior answers
    on one cell, a second undisclosed cell shares its entire decision path, and
    the same card supplied the prior columns' marginals in a design whose
    deliverable IS that distribution (O-4); and no dispatch card is committed
    anywhere, so the breach can be scoped only by the party it affected (O-5).
    THE ONE THING THAT WOULD HAVE BROKEN THE TIE IS ABSENT BY CONSTRUCTION.
    Model independence is ZERO for the entire chain, reviews included (O-3):
    nine of nine tasks self-report one family, which is the family that
    authored -003, -004, the red-team report the panel is built from, the
    panel, all three columns, amendment 005 and both reviews. Agreement
    anywhere in this package is one further draw from a correlated set. The red
    team states of itself that a shared blind spot of this family would be
    invisible here by construction, and this Coordinator is inside that set
    too.
    WHAT SURVIVES INDEPENDENTLY OF THE INSTRUMENT IS REAL AND IS NOT DISCARDED.
    The freeze ordering and the T-005 seal are verifiable from git and were
    verified twice (O-11). The T-003 null-object control is genuine on a
    mechanical copy test, which is the first control of its kind this campaign
    has run. And the adverse reading of amendment 005's design claim does not
    depend on the panel at all: OBJ-RT-6 reads CM-1's committed conversion
    routes and shows A5-3's third limb cannot be false for the two operation
    kinds Route 3's bar exists for, so the whole test collapses onto a newly
    installed predicate that is the intensional half of the superseded clause
    under a different name (O-7). The removals -005 claims ARE real and the
    demotion of "stage" is credited; the claim that nothing was installed
    fails.
    WHAT THIS PACKAGE THEREFORE CANNOT DO: it cannot support the repair line,
    it cannot reject it, and it cannot rank -005 against -004. Determinacy
    regressed on the panel's own headline metric (O-6), but that metric is
    computed on a leaking instrument, on two different denominators, by two
    different readers, with one published count that does not recompute -- and
    a text that answers fewer questions looks more determinate on any metric
    that only counts the questions it still asks. Two verdict classes rest
    silently on open CM-1 questions whose closure would move them (O-8), and
    B5-1's threshold is non-monotone in the claimant's own declared per-member
    cost in the direction that rewards conservative rounding (O-9), which no
    control in -005 looks at. RC-3's third limb passes under one denominator
    and fails under the other, and the amendment does not say which governs
    (O-10).
    THE HONEST DISPOSITION IS THAT THE EVIDENCE DOES NOT DISCRIMINATE, AND THE
    SUCCESSOR IS CHEAP AND DECISIVE IN ONE DIRECTION. Two independently
    dispatched sessions, the same panel item set, the same single text,
    byte-identical committed cards restating no prior result and no marginal,
    both sealed before either sees the other: two zero-compute sessions that
    measure RC-6's actual question for the first time. ONE REFINEMENT THIS
    RECORD ADDS TO THE RED TEAM'S OWN PROPOSAL, BECAUSE O-1 REACHES IT TOO:
    run on the CURRENT panel, that control's asymmetry is sharper than the red
    team stated. A DISAGREEMENT between two readers who have both read the
    leaked sentinels is decisive -- if they diverge despite a shared
    instrument-level prior, the text is indeterminate. AN AGREEMENT is NOT
    informative, because the leak supplies a common cause for it, and the
    model-family correlation supplies a second. The control must therefore be
    run against a SUCCESSOR panel whose excision cut points are opaque
    commitments, or its agreement branch buys nothing. THAT IS WHY THIS
    RECORD'S SINGLE NEXT ACTION RE-FREEZES THE INSTRUMENT BEFORE IT MEASURES.

  # =====================================================================
  # BOUNDARIES. EVERY CONCLUSION ABOVE IS SCOPED TO THESE AND NO FURTHER.
  # =====================================================================
  boundaries:
    - >-
      SUBJECT MATTER. This record is about a COST-MODEL SPECIFICATION and the
      instrument built to measure how two readers read it. IT ASSERTS NOTHING
      ABOUT AES AT ANY ROUND COUNT, IN EITHER DIRECTION, and depends on no
      property of AES. Every attack specification named anywhere -- SPEC-01
      through SPEC-10, attacks Q, P, P', S, H, and the hypothetical
      constructions in O-9 and O-10 -- is an explicitly hypothetical,
      specification-level object asserted of no real cipher and no real
      implementation. Claim ceiling: SPECIFICATION RESULT ONLY.
    - >-
      THE INSTRUMENT. Every column-derived number is scoped to the TEN ITEMS of
      PANEL-BATCH-ae07ce-TASK-20260903-59e9b9 as frozen at 7d895a33b and
      content-verified at 4f5115ad0, on the two declared axes, under the closed
      answer vocabulary that panel fixes. Ten items is small; the panel's own
      correlated-pair limitation says so; and O-1 caps every one of those
      numbers further.
    - >-
      THE TEXTS. T-004 is amendment 004's two `resolving_text_verbatim` blocks;
      T-003-SUPERSEDED is amendment 003's two, read on their own words with no
      clause of -004 applied and with -004's `superseded_sentences` field
      deliberately not opened; T-005 is amendment 005's two, read with CM-1 and
      WITHOUT -004, which -005's own clause A5-0 declares incomplete. THE THIRD
      COLUMN THEREFORE CLASSIFIED AGAINST A TEXT ITS OWN AUTHOR DECLARES
      INCOMPLETE while the first classified against a self-contained one: the
      two columns did not read comparable objects (RT OBJ-RT-12), and the
      accounting rule IR-4 introduced to handle the resulting cells exists only
