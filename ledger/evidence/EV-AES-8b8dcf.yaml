evidence:
  id: EV-AES-8b8dcf
  hypothesis_id: null
  hypothesis_id_note: >-
    DELIBERATELY NULL. This record measures the INSTRUMENT'S NULL MODEL and the
    byte-locality of a statistic, not a cipher property under any hypothesis
    RQ-AES-003 carries. Naming a hypothesis would manufacture a binding the
    measurement does not have. Admitted under the documented-null allowance
    recorded in CORR-20260802-009.
  experiment_ids: []
  run_ids: []
  task_ids:
    - TASK-20260803-05e072
    - TASK-20260803-a4a6a4
    - TASK-20260803-bc660a
  type: measurement
  direction: mixed
  strength: moderate
  strength_basis: >-
    MODERATE. The instrument work is as strong as this campaign has produced:
    the validator reconstructed v3 from the shipped diff BYTE-EXACTLY, rebuilt it
    to a byte-identical binary, verified the added counters touch no RNG call and
    write only their own field, and then wrote its OWN prefix counter by a
    different algorithm which reproduced every count bit-exactly. What holds
    strength at moderate is that the batch's headline localisation is
    half-established (see OBS-B8-4), its rank 1 had zero discriminating power
    (OBS-B8-5), and no model independence exists under standing basis
    0137a051eb5828789eb267fa83c8278086578d4c -- so nothing counts toward a
    closure quorum.
  claim_tier: toy
  claim_tier_basis: >-
    Reduced-round AES-shaped SPN, C1 convention, r in {3,4,5,10}, one machine,
    2^20 to 2^30 trials, one key, one base. No crypto-scale, medium-scale,
    affected-scheme or asymptotic claim is made or implied, and no comparison to
    published cryptanalysis is made in either direction.
  certificate_refs: []
  proof_status: empirical_only
  proof_refs: []

  observations:
    - id: OBS-B8-1
      statement: >-
        THE INSTRUMENT CHANGE IS SOUND ON FIVE INDEPENDENT GROUNDS. v2 plus the
        shipped diff equals v3 byte-exactly under patch; the single apparent
        deletion is a printf format string gaining a comma with the value
        expression character-identical; the added block sits at the end of the
        loop body after the trivial-swap continue, calls no RNG function so every
        plaintext pair is bit-identical, and writes only its own zero-initialised
        field; a rebuild from the shipped source produced a BYTE-IDENTICAL binary;
        and the validator's own prefix counter, written by a different algorithm,
        reproduced r=5 [16677270, 65454, 280, 14] and r=10 [16674529, 65204, 253,
        1] bit-exactly along with every pre-existing v2 field.
      status: CONFIRMED by independent reconstruction, rebuild and reimplementation
    - id: OBS-B8-2
      statement: >-
        A BYTE-LOCAL MECHANISM IS EXCLUDED, AND THIS IS THE BATCH'S STRONGEST
        RESULT. At r=5, 2^30, the observed-over-model ratio is [0.99941, 1.00036]
        at k=1 on 16.7M events and [0.99114, 1.00645] at k=2 on 65k events. A
        byte-local mechanism of the magnitude the campaign has been citing dies by
        roughly four orders of magnitude. The producer reported this in the
        flattest available language and the validator recorded it as UNDERSTATED.
      status: CONFIRMED; recorded as understated by the producer
    - id: OBS-B8-3
      statement: >-
        THE EXISTENCE OF THE k=4 EFFECT AT r=5 SURVIVES MODEL-FREE. Against the
        matched-seed r=10 arm, which consumes an identical plaintext and swap
        stream, the counts are 14 against 1, exact two-sided p = 9.77e-4, ratio
        interval [2.13, 592].
      status: CONFIRMED
      caveat: >-
        The two arms are paired BY DESIGN through identical streams but are
        analysed UNPAIRED, because trial indices are not logged. The pairing
        control RC-11 is unrun.
    - id: OBS-B8-4
      statement: >-
        THE LOCALISATION TO 32 BITS RATHER THAN 24 IS NOT ESTABLISHED, AND THE
        COORDINATOR STATED IT AS THOUGH IT WERE. By NESTING, the 13 excess k=4
        events are already inside the k=3 count; removing them leaves 266 against
        255.0, z = +0.69. The k=3 model count is 256 with Poisson sd 16 against a
        k=4 absolute excess of 13 events, which is 0.8 sigma and invisible by
        construction. The honest statement is that the excess is NOT byte-local
        and IS present at the full word; whether it is a 32-bit or a 24-bit
        phenomenon is unresolved at this exposure.
      status: >-
        CONFIRMED by the validator; the producer's own body text
        (what_this_does_NOT_establish) concedes it while its summary line does
        not. Corrected in CORR-20260803-8fa302.
    - id: OBS-B8-5
      statement: >-
        RANK 1 HAD ZERO DISCRIMINATING POWER AND ITS FALSIFIER COULD NOT HAVE
        FIRED. At r <= 4 the by-word histogram is [0,0,0,N,0] with W = 3 on every
        trial -- deterministic, holding under a random S-box, and proved by
        BATCH-007's Proposition 1. At rate 1.0 the excess is identically 2^30
        regardless of exposure or data, so the decay hypothesis and the
        instrument-artifact hypothesis make the SAME prediction there. The
        producer had also read the saturated BATCH-006 arms before
        preregistering and disclosed the non-blindness as deviation D-4.
      status: >-
        CONFIRMED. "The falsifier did not fire" is withdrawn as corroboration.
        The round profile's informative content is two points: r=5 elevated,
        r >= 6 at null.
    - id: OBS-B8-6
      statement: >-
        THE ANALYTIC NULL HAD ALREADY BEEN MEASURED ELEVEN TIMES, AGGREGATE 57
        OBSERVED AGAINST 58.0 MODELLED. Four arms in BATCH-001, four in
        BATCH-002, three in BATCH-004. The null was pinned to roughly plus or
        minus 26 percent before this batch ran, so a null error large enough to
        explain a 14x excess was ALREADY EXCLUDED. RC-10's real contributions are
        that no instrument had ever emitted a PREFIX statistic, and that it
        tightens the null by roughly 500x to plus or minus 0.05 percent at k=1.
      status: >-
        CONFIRMED by the validator's 4858-file scan and independently
        recomputed by the Coordinator. Recorded in CORR-20260803-8fa302, which
        partially corrects CORR-20260803-7d41c8.
    - id: OBS-B8-7
      statement: >-
        THE r=5 EXCESS IS NOT AES-S-BOX-SPECIFIC, AND THE DATA HAS BEEN ON DISK
        SINCE BATCH-006 WITHOUT ANYONE SAYING SO. Its 27 random-S-box arms at
        r=5, 2^30 give W_ge1 ranging 6 to 25 with mean 15.48; the AES arms read
        12 and 14. P(X >= 14 | Poisson(15.48)) = 0.681, placing AES at roughly
        the 41st percentile of the campaign's own random-S-box distribution.
      status: CONFIRMED; recomputed by the Coordinator from the 27 arms
      why_this_is_the_most_useful_item_in_the_batch: >-
        Taken with OBS-B8-2 it gives two localisations pointing the same way: the
        r=5 excess is a property of the FIVE-ROUND SPN SHAPE and of the 4-byte
        word framing, and is not a property of the AES S-box. That is the
        campaign's own existing null object answering a question the campaign
        never asked it, and it narrows what any future explanation must explain.
    - id: OBS-B8-8
      statement: >-
        THE CONDITIONAL-BINOMIAL INTERVAL CONSTRUCTION IS EXACTLY RIGHT, NOT
        MERELY DEFENSIBLE. The k+1 event is nested in the k event, so
        N_{k+1} | N_k is exactly Binomial(n_k, p_{k+1}/p_k), and the R = 1/q
        inversion preserves coverage with endpoints reversed. Degenerate cells
        are reported as undefined rather than as finite points.
      status: CONFIRMED by independent reimplementation of the incomplete beta

  defects_carried:
    - id: D-B8-1
      statement: >-
        The producer's first equivalence attempt was SIGTERMed at 120 s by a
        foreground tool timeout. The zero-byte artifact is retained deliberately
        as an infrastructure record with no number inferred from it, and is
        committed unedited. It is not negative mathematical evidence.
    - id: D-B8-2
      statement: >-
        The preregistration quotes maximum_runs 30 where the card's handoff says
        20. Seven runs were used, so there is no effect.
    - id: D-B8-3
      statement: >-
        K-R10-NULL-P30 is a disclosed UNPREREGISTERED addition, run for rung-3
        power. Both exposures are reported.
    - id: D-B8-4
      statement: >-
        The BATCH-005 red team's RC-9 status field still reads "NEVER RUN" in
        place, correctly, because reviewer artifacts are immutable. A reader
        reaching it without CORR-20260803-7d41c8 inherits the error.

  boundaries:
    - >-
      One key, one base, one machine, r in {3,4,5,10}. Nothing here is a
      statement about full-round or deployed AES.
    - >-
      The k=3 to k=4 rung at r=10 remains the loose link in the null: pinning it
      better than about 5x needs roughly 2^38 trials, about 20 hours here.
    - >-
      Session and implementation independence only. NO MODEL INDEPENDENCE under
      standing basis 0137a051eb5828789eb267fa83c8278086578d4c.
    - >-
      RC-11, the trial-index pairing that would let the matched r=5 and r=10 arms
      be analysed paired, is unrun.

  unresolved_confounds:
    - Whether the r=5 k=4 effect is a 32-bit or a 24-bit phenomenon is unresolved at this exposure.
    - Whether the r=5 excess is a cipher property or a probe-geometry property remains the campaign's central open question; OBS-B8-7 narrows it to the round structure but does not settle it.

  reviewed_by:
    - >-
      TASK-20260803-bc660a (independent validator; verdict PASSED; reconstructed
      and rebuilt the instrument, reimplemented the prefix counter and the
      interval arithmetic, and scanned 4858 JSON files to test the batch's own
      premise)
  reviewed_at: 2026-08-03
  red_team_reviewed: false
  red_team_note: >-
    NO RED TEAM REVIEWED THIS BATCH, as with BATCH-007. Recorded plainly. The
    validator nonetheless returned an adversarial result -- it refuted the
    Coordinator's own correction -- which is a reason to think a dedicated red
    team would have found more, not fewer, defects.

  inference:
    policy: coordinator-orchestration-code
    requested_policy: coordinator-orchestration-code
    resolved_model: claude-opus-5
    fallback_used: true
    model_verified: false
    standing_basis: 0137a051eb5828789eb267fa83c8278086578d4c
