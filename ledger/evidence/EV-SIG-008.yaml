       A4_6 = 3,559, A5 = 15,260; F3/F4/F5 = 2,325/33,110/85,375 misses
       0/0/0. sem D6 rank staircase checkpointed at 36,000/174,033
       (rank_acc 31,715, RUN-t); pending: deficit_6 = 156,520 - rank6,
       extra_6 = 183,312 - rank6 - 26,760, residual_6 = 141,292 - rank6.
       With gate 1 INVALID, the sem D6 numbers — when complete — are
       reported against BOTH sr_pred and the measured null rank 149,410 and
       remain inadmissible as cascade evidence."
