       faithfully reconstructed (sha recomputed from surviving carries; marked
       reconstructed). The SECOND wipe took work/ entirely. All results below were
       recorded live in the session transcript from valid-run stdout BEFORE
       destruction; durable record committed to branch exp-sig-008-artifacts (d1d36dd)."
    - "GATE 1 — column-matched D6 null baseline at n=12 — FINAL, MEASURED:
