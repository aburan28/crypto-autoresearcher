       11,990; 23,248/24k; 22,017/24k; 15,836/18k; 15,430/18k; 12,198/18k;
       14,552/18k; 7,219/12k; 2,920/6,033 (sum 149,410) — deg<=5 prefix
       exactly saturated, collapse concentrated in the top sextic columns,
       qualitatively the n=9 freeze-collapse shape at a cell where the series
       says D6 < freeze."
    - "GATE 3 — support-induced share of the sem-D5 deficit at n=12 — FINAL:
       0 / 1,321 = 0.0%. sem D5 anchor == EV-SIG-003 exactly (rank 28,097,
       sr_pred 29,418, deficit 1,321, extra 1,322, rankK5 2,093, kernel 3,415,
       nrows 31,512, ncols 46,709). N1 null D3/D4/D5 ranks == sr_pred
       (312/3,834/29,418), extra 0. Contrast n=9: 369/909 = 40.6%
       (EV-SIG-006) — the support-bias confound is size-dependent and
       vanishes at n=12; the sem's 1,321 D5 deficit is entirely genuine."
    - "GATE 2 — first admissible sem residual_6/deficit_6 at n=12 — CENSORED
       (rule 5, two independent causes, neither evidence): (i) sems1 stage-1
       closure anchor HALT: quotient sizes 1/32/1,322 PASS, rankK5 = 2,093
