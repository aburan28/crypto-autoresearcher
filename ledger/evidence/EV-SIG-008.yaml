  inference: >-
    Numbers only (status decisions belong to the Coordinator). At n=12 seed 2
    the column-matched generic null shows a genuine D6 rank defect of 7,110
    against the semiregular prediction (rank 149,410 vs 156,520; extra_6
    7,110 != 0), falsifying the freeze theory's "null validates at D6 for
    n >= 12" prediction at the exact cell recorded as its decisive test. The
    defect is not variety saturation (rank << ncols - |V| = 174,031): a new
    failure shape — below-freeze collapse in the top sextic columns. The D5
    picture is clean (support-induced share 0.0%, vs 40.6% at n=9), so the
    sem's D5 deficit of 1,321 stands as genuine cascade content under this
    baseline. Gate 2 remains unmeasured; even when computed, sem D6
    quantities at this cell are inadmissible as cascade evidence because no
    valid D6 null baseline exists here.
