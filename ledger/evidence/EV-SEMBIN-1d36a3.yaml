  observations:
    - id: O-1
      text: >-
        THE HYPOTHESIS'S OWN PREREGISTERED PREDICTION IS REFUTED, and the refutation
        replicates. H-SEMBIN-b1708c predicted t* < m* STRICTLY at every integer n in
        [250, 600] (metric t_star_interior). RUN-SEMBIN-aa5161 returned t* = m* at
        every n under all three solving-cost readings, and the validator reproduced
        that from a from-scratch optimizer written without importing
        joint_balance.py, agreeing on m* exactly (7, 7, 9, 10 at n = 283, 310, 409,
        571 under macaulay4). Semaev's t = m is optimal under his own cost model at
        concrete n, not merely asymptotically indifferent. The Coordinator was wrong
        and recorded the prior before the review as its calibration context.
    - id: O-2
      text: >-
        THE MECHANISM SURVIVES INDEPENDENT RE-DERIVATION AND IS EXACT. Writing
        A(t) = 2^{tk-n}/t!, the ratio A(t-1)/A(t) = 2^{-k} t, so in the regime
        A << 1 where eq. (11) linearises to P ~ A, one unit of t costs EXACTLY
        k - log2 t bits of yield. Cumulatively from m down to t that is
        (m-t)k - log2(m!/t!), which at k ~ n/m is ~ n(1 - t/m): linear in n in the
        exponent, hence exponential in n. The validator derived this from eq. (11) as
        stated in Section 4.3 without reading the implementation, then confirmed it
        numerically against exact eq. (11) differences to 1e-6 at nearly every step
        and to 0.346 bits in the worst case over the whole swept range.
    - id: O-3
      text: >-
        THE ARGUMENT'S PREMISE IS NEVER VIOLATED IN THE SWEPT RANGE, which is the
        check that decides whether "exponential" is earned or asserted. The premise
        fails where A >~ 1 and P saturates, at which point shortening the chain is
        free. Since k = ceil(n/m) gives mk - n <= m - 1 while log2(m!) > m - 1 for
        m >= 4, A < 1 already at t = m and falls by a further 2^{-k} t per unit.
        Sweeping every (n, m, t) with n in [250, 600], m in [2, 20], 2 <= t <= m:
        ZERO SATURATED CELLS, and the maximum log2 A over the entire range is -1.0
        exactly, attained only at the m = t = 2 corner where m is never optimal
        (m* is 9 to 12 at these n).
    - id: O-4
      text: >-
        NO SOLVING-COST READING IN THE FROZEN TEXT IS EXPONENTIAL IN (m - t), which
        is the question the joint turns on. Checking increments directly at n = 409,
        m = 20, the per-unit saving as t decreases runs 42.4, 11.3, 6.8, 4.9, 3.8,
        3.1, 2.6, 2.3, 2.0 -- DECREASING, not increasing. The cumulative saving grows
        like log(m - t), so the cost ratio is polynomial in (m - t). An exponential
        saving would require increasing increments and none of the three readings has
        them. The declared breaking artifact for this joint did not fire.
    - id: O-5
      text: >-
        THE OPTIMIZER DEMONSTRABLY SWEEPS t, established four independent ways
        because a bug that ignored t would produce t* = m* everywhere and pass the
        run's own known-false control, so this needed positive evidence rather than
        absence of failure. (i) An independent optimizer written from the published
        formulas reproduces t* = m* at every n under all three readings and matches
        jb.optimize on m* exactly. (ii) Deleting the yield term moves t* from m to 2
        at every n. (iii) Charging 400 bits for every t except one target returns
        exactly that target, for t = 2, 3, 5 and 7, with 19 distinct t evaluated per
        solve. (iv) Under a cost where shortening pays, t* moves from m* to 2, a
        swing of 28 links.
    - id: O-6
      text: >-
        THE PROVES-TOO-MUCH OBJECT THAT MATTERS MOST PASSED AND ITS THRESHOLD MATCHES
        THE MECHANISM 5/5. Object 4 charges a cost under which shortening the chain
        MUST pay, exponential in (m - t). At 10 bits per link t* flips below m* at
        n = 250 and 300 but not at 409, 500 or 571 -- and that exact pattern is
        predicted by the yield loss per unit of t at the m the patched optimizer lands
        on (n/30 - 1 = 7.3, 9.0, 12.6, 15.7, 18.0 bits; flip iff below 10). The
        optimizer is trading precisely the two quantities the mechanism says it
        should, at the rate O-2 derives independently. Repeated under macaulay4, where
        the solving cost genuinely depends on t, with the same outcome.
    - id: O-7
      text: >-
        THE VALIDATOR RECORDED A FAILURE OF ITS OWN RATHER THAN QUIETLY FIXING IT. Its
        first pass at object 4 implemented the sign backwards -- charging c(m-t) as a
        penalty for shortening rather than a reward -- and consequently could not move
        t* at any rate, which would have read as the object failing. Corrected, the
        object goes through; both signs were run and both are reported in
        proves-too-much.json, with the penalty sign leaving t* pinned at m* to 120
        bits as it must.
    - id: O-8
      text: >-
        THE PUBLISHED YIELD-LOSS RANGE IS WRONG, and wrong in the direction that
        understates the record's own case. CLAIM B and the manifest state 25 to 28
        bits per unit of t at the FIPS labels. Re-deriving k - log2 t at the
        manifest's own m* (283:9, 310:10, 409:11, 571:12) gives 28.27, 27.68, 33.72,
        44.00 -- a range of 27.7 TO 44.0 BITS. The published range covers only the two
        smallest labels and understates n = 571 by 16 bits. Cause:
        exponential_vs_polynomial_argument() hardcodes m = 10 regardless of m*, and
        the quoted range is taken over a subset of its rows. A larger yield loss makes
        t = m MORE strongly optimal, so the error is conservative -- and it is still a
        wrong number in a headline mechanism statement.
    - id: O-9
      text: >-
        A PUBLISHED FIELD IS SIGN-INVERTED AND CONTRADICTS ITS OWN NEIGHBOUR.
        raw-result.json's mechanism.per_n[*].best_t_by_net reports 3, 3, 2, 2. Those
        are the t at which shortening is WORST (net cost 139 to 370 bits), reported as
        best; the correct answer is t = 10 at net 0. Cause: an argmax/argmin sign
        error, min(per_t, key=lambda r: r["net..."] * -1). The sibling field name
        net_bits_negative_is_worse is also inverted -- its values are positive-is-worse
        -- and the manifest's "the net is negative at every t < m" inherits that. So
        raw-result.json carries best_t_by_net: 2 directly beside
        consequence: t = m is optimal, and a reader meets a self-contradiction inside
        one object. The substance is right and was confirmed independently; the
        published sign convention contradicts it.
    - id: O-10
      text: >-
        "2-3 BITS PER UNIT OF t" IS A DERIVATIVE MIS-STATED AS A RANGE. It is the
        local slope at t = m for m ~ 10-12. The maximum over t is 31 to 32 bits under
        macaulay4 and 12 under f4_std, both attained near t = 3 -> 2, i.e. ten to
        fifteen times the quoted figure. The measured solving-time drops in Tables 1-2
        of the frozen source span 3.75 to 13.87 bits and are bracketed by the two model
        readings, and every measured point has m <= 5 and reaches t = 2 -- the far end
        of the curve. THIS RECONCILES SEMAEV'S "DROPS DRAMATICALLY" WITH THE RECORD'S
        "2-3 BITS": they describe different points of one curve, and the measurements
        confirm the derivative is not the range.
    - id: O-11
      text: >-
        ONE OF THE THREE READINGS CANNOT FAIL, and the claim should say so. Under
        block_n4w -- the record's own headline reading for the memory-charged run --
        the solving cost does not depend on t AT ALL, so t* = m* is forced by the
        yield term alone and CLAIM B carries no information there. The non-trivial
        content lives entirely in macaulay4 and f4_std, where the t-dependence is real
        and the exponential-beats-polynomial trade is genuinely resolved. "Under all
        three solving-cost readings" is true and slightly flatters itself.
    - id: O-12
      text: >-
        THE DECLINED STOPPING RULE WAS CORRECT, and the red team settled it with two
        tests the record did not run. The run declined a rule saying to halt on a
        fitted c materially different from 1.6986, on the argument that c approaches
        it from below. (i) GAP SCALING: over 10^7 to 10^300, 43 decades, the raw gap
        falls from 0.2172 to 0.0101 while gap x log n / log log n stays in [1.068,
        1.326] -- 7.7% relative scatter against 62% for a constant-offset model, an
        eight-fold better fit. The deficit decays at exactly the rate the o(1)
        cofactor predicts. (ii) ANALYTIC CONTINUATION: solving m^2 log2 m = n in log
        space gives c = 1.69591 at n = 10^1000, 1.698638 at 10^10^6 and 1.6986436 at
        10^10^9. c IS CONVERGING, NOT SITTING BELOW, at Theta(log log n / log n) --
        genuinely convergent and genuinely glacial. The red team's independent fit
        also reproduces the producer's c to five decimals at every rung, so the
        fitting code is not defective.
    - id: O-13
      text: >-
        THAT CONCLUSION WAS SHIPPED ON EVIDENCE THAT DID NOT REACH IT. The record's
        support for convergence was a 7-point monotonicity test over 10^7 to 10^13, a
        window in which c moves by 0.071 and is still 0.146 short -- which does not
        distinguish an asymptote at 1.6986 from one at 1.60. Both tests that settle it
        were cheap and both were absent. Shipping a correct conclusion on inadequate
        evidence is the pattern the Coordinator was right to be uncomfortable about,
        even where the conclusion survives. Separately, c_fit_ladder carries
        c_from_balance_identity beside c_fitted and the two disagree by 0.06 to 0.20
        at every rung (1.61224 against 1.55248 at 10^13) with no remark; they differ
        because the fitted value includes the 12 log2 n cofactor and the -m log2 e
        Stirling term. Harmless, unexplained, and it invites a later reader to treat
        two numbers as a cross-check when they are not.
    - id: O-14
      text: >-
        THE PUBLISHED m* LAW ERROR RANGE IS MISQUOTED. eq. (17)'s
        m* ~ sqrt(2 ln2 n / ln n) substitutes ln m = (ln n)/2, which overstates ln m
        and so necessarily returns a smaller m than the exact stationarity condition
        m^2 log2 m = n. The direction and mechanism are confirmed. The record quotes
        the understatement as 4-15%; the red team's independent values run 5.09% to
        10.14% against the real argmin and 5.09% to 11.46% against the integer one --
        and the record's OWN c_fit_ladder carries law_relative_error from -0.1146 to
        -0.0509. NEITHER 4% NOR 15% APPEARS IN THE RECORD'S OWN DATA. It should read
        5-11%.

  inference: >-
    CLAIM B HOLDS, AND IT HOLDS AS THE NEGATION OF THE HYPOTHESIS THAT PROPOSED IT.
    H-SEMBIN-b1708c predicted an interior optimum in t; there is none, at any n in
    [250, 600], under any of the three solving-cost readings, and the refutation
    replicates across two implementations that share no code. The mechanism is not a
    numerical coincidence: yield loss under eq. (11) costs k - log2 t bits per unit of
    t, which is linear in n in the exponent, while every solving-cost saving available
    in the frozen text has DECREASING per-unit increments and therefore grows only
    like log(m - t). The premise that makes the comparison meaningful -- that eq. (11)
    is in its unsaturated regime -- holds with zero exceptions across the swept range,
    with a full bit of margin at its closest approach.

    Direction is `contradicts` because this record's subject is the hypothesis, and
    the hypothesis is refuted. The same evidence SUPPORTS Semaev: his choice of t = m
    is optimal at concrete cryptographic n under his own cost model, not merely
    asymptotically indifferent, and the short-chain trade-off that KN-OPEN-94f456 was
    opened to explore does not exist. Strength is `replicated` on four grounds: two
    independent optimizers agreeing at every n and every reading, an analytic
    derivation of the yield law confirmed numerically to 0.346 bits worst case, four
    positive demonstrations that the optimizer varies t, and a proves-too-much object
    whose flip threshold matches the derived yield law at 5 of 5 parameter sets.

    THE CLOSURE IS SCOPED TO "UNDER THE PUBLISHED YIELD LAW", exactly as the
    Coordinator's prior anticipated and a reviewer should insist. Everything above
    consumes eq. (11) as written. If realized yield falls short of eq. (11) MORE at
    t = m than at t < m, the comparison inverts -- and that is not idle, because it is
    the measurement EXP-SEMBIN-354a75 exists to make and it has not been made.

    Four published quantifications need correction and none of them is the mechanism:
    the yield-loss range is 27.7-44.0 and not 25-28 (O-8), best_t_by_net is
    sign-inverted and self-contradictory beside its own neighbour (O-9), "2-3 bits" is
    a derivative and not a bound (O-10), and the m* law error is 5-11% and not 4-15%
    (O-14). Per AGENTS.md an implementation defect is never a mathematical conclusion,
    and these are defects in summary and reporting code: optimize(), crossover() and
    stage_costs() do not consume the defective function, the validator's from-scratch
    optimizer agrees with jb.optimize everywhere, and the crossovers and the t* = m*
    table do not flow through it. The mechanism is sound and its published
    quantification is not.

  obstruction:
    statement: >-
      Shortening Semaev's chain below t = m is blocked by the OBJECT and not by the
      attempt: under eq. (11) the yield of a t-chain carries the factor 2^{tk-n}/t!,
      so removing one link costs k - log2 t bits of relation probability, while the
      Macaulay/F4 solving cost of the shorter system falls with DECREASING per-unit
      increments and so saves only Theta(log(m-t)) bits cumulatively. An exponential
      charge cannot be paid by a logarithmic credit, at any n where eq. (11) is
      unsaturated -- which is everywhere in the cryptographic range.
    quantity: >-
      yield loss per unit reduction in chain length t, in bits, at the cost-optimal m,
      set against the corresponding solving-cost saving in bits
    value: >-
      yield loss 27.68, 28.27, 33.72, 44.00 bits per link at n = 310, 283, 409, 571 at
      m* = 10, 9, 11, 12 (exact evaluation of k - log2 t, k = ceil(n/m); analytic law
      confirmed against exact eq. (11) differences to 1e-6 typical and 0.346 bits worst
      case over the whole sweep). Solving-cost saving at t = m: 2.26-2.59 bits
      (macaulay4), 2.04 bits (f4_std), 0.000 bits (block_n4w); maximum over all t:
      31-32, 12, and 0 bits respectively. Measured solving-time drops in the frozen
      source's Tables 1-2, at m <= 5 and t reaching 2: 3.75 to 13.87 bits, bracketed
      by the two model readings. Regime margin: max log2 A = -1.0 exactly, 0 saturated
      cells over n in [250,600] x m in [2,20] x 2 <= t <= m.
    measured_by: [RUN-SEMBIN-aa5161, TASK-20260913-da3982, TASK-20260913-cf9d98]
    scope: >-
      n in [250, 600] integer; m in [2, 20] (30 in the red team's extension); t in
      [2, m]; k = ceil(n/m); omega in {2.376, 2.807, 3.0}; solving-cost readings
      macaulay4, f4_std, block_n4w; Semaev 2015 eq. (11) yield law and eqs. (15)-(17)
      cost model, both AS PUBLISHED and both unvalidated by measurement. Claimed
      nowhere else: this says nothing about chain length in any other presentation of
      point decomposition, nothing about any t-chain under a yield law other than
      eq. (11), and nothing about degrees, which no one in this round measured.
    resource_check:
      examined: true
      reading: >-
        THE OBSTRUCTION IS A MEASUREMENT INSTRUMENT FOR THE MECHANISM LANE, and it
        cuts in a direction worth stating plainly. The blocking quantity is the
        symmetry factor t! inside eq. (11) -- the same object H-SEMBIN-c59e50 claims a
        coset-typed factor base removes at zero cost. Read as a resource this gives two
        things. FIRST, a sharper prediction: with t! removed, A(t) = 2^{tk-n} and the
        ratio A(t-1)/A(t) becomes exactly 2^{-k}, so the per-link yield charge RISES
        from k - log2 t to k (33.72 to 37.18 bits at n = 409, m = 11). Coset typing
        therefore makes the short-chain lane MORE firmly closed, not less; anyone
        expecting the typed construction to open an interior optimum in t should
        expect the opposite, and that is a cheap falsifiable consequence of the typing
        claim. SECOND, and more useful, the measured per-link charge is a calibrated
        ruler for whether the typing works at all: the ratio of typed to untyped
        achievable-sum counts is exactly the quantity arm D of EXP-SEMBIN-92724f
        enumerates, and the yield law fixes what that ratio must be if the symmetry
        factor is genuinely gone. An obstruction measured under the optimization
        question thus becomes the control for the mechanism question. Stated with its
        limit: this is a consistency handle, not evidence that the typing removes
        anything, and it inherits eq. (11) exactly as the obstruction does.
      spawned_ids: [H-SEMBIN-c59e50, EXP-SEMBIN-92724f, EXP-SEMBIN-354a75]

  boundaries:
    - >-
      Heuristic estimate throughout. No curve instantiated, no relation computed, no
      Groebner basis run, no solve, no certificate.
    - >-
      NO STATEMENT ABOUT THE SECURITY OF ANY CURVE, IN EITHER DIRECTION. This is a
      statement about where a published cost model is minimised.
    - >-
      SCOPED TO eq. (11) AS PUBLISHED. The whole result consumes the yield law
      unmeasured. EXP-SEMBIN-354a75 is the experiment that tests it and has not
      returned.
    - >-
      Assumption 1 (degree bound <= 4) is consumed unchanged and unvalidated. No degree
      was measured by anyone in this round; there is no Groebner engine on this host
      (IMP-SEMBIN-ENGINE). Nothing here bears on Assumption 2 or on the asymptotic
      bound (17).
    - >-
      Under block_n4w the result is vacuous (O-11), so the corroboration is two
      readings rather than three.
    - >-
      k = ceil(n/m) throughout; the un-ceiled reading of Table 3 is a separate
      ambiguity recorded on H-SEMBIN-b1708c and not resolved here.

  unresolved_confounds:
    - >-
      Whether eq. (11) overstates realized yield MORE at t = m than at t < m. This is
      the one confound that inverts the conclusion, it is unmeasured, and
      EXP-SEMBIN-354a75 exists to measure it.
    - >-
      The m = 2 corner is where the linear yield law is least accurate (A = 1/2,
      P ~ 0.39, worst-case error 0.346 bits) and it is also the only region within one
      bit of saturation. It does not matter because m = 2 is never optimal, but a
      cost model that pushed m* down toward 2 would re-open it.

  dominated_by: >-
    Not applicable as a comparison against SOTA: this record refutes a proposed
    optimization rather than proposing an algorithm. The optimization it refutes would
    have had to beat Semaev's own published t = m, and it does not -- shortening the
    chain is a net loss of 139 to 370 bits at every t < m.
  sota_delta:
    time_exponent: unchanged
    note: >-
      Zero. The joint (m, t) re-optimization recovers exactly Semaev's published
      choice, so the crossover does not move and the fitted c is unchanged at
      1.6986. The negative result's value is that it closes a lane cheaply and
      measures the quantity that closes it.

  knowledge_promotion: warranted
  knowledge_promotion_reason: >-
    The obstruction block above is reusable and its measurement is the useful output:
    an exponential-versus-logarithmic bookkeeping argument with a measured per-link
    charge, a verified unsaturated-regime margin, and a proves-too-much object whose
    flip threshold matches the derived law. That belongs in the corpus so a later
    session does not re-open the short-chain lane by intuition, and so the resource
    reading (that the same t! is the mechanism lane's target, and that removing it
    RAISES the per-link charge) stays visible to the goals that need it. Promote as a
    KN-FIND entry citing EV-SEMBIN-1d36a3, RUN-SEMBIN-aa5161 and both reviewer
    reports, and close KN-OPEN-94f456 as an optimization question while recording
    that it stays open under any yield law other than eq. (11). Promotion is queued
    under DEC-20260913-74e208 and is not performed by this record.

