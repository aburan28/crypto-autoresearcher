evidence:
  id: EV-SSIQ-f3ce32
  hypothesis_id: H-SSIQ-137200
  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  batch_id: BATCH-005
  experiment_ids: [EXP-SSIQ-a85692]
  run_ids: [RUN-SSIQ-a85692-b]
  type: empirical
  direction: neutral
  direction_note: >-
    NEUTRAL FOR A NEW REASON, distinct from every prior batch's neutral
    finding. This is the FIRST run in the campaign's history where the
    Phase -1 gate PASSED and a real M-GAP was actually computed on real,
    in-session-computed delta_E labels (not blocked by data unavailability,
    not blocked by a budget-allocation defect). The terminal branch is
    CONTROL-FAILURE-VOID: C-SEARCH-BIAS's random-target correlation stayed
    comparable in magnitude to the true-target correlation, mechanically
    firing the pre-registered control-failure consequence before the CI is
    ever consulted. H-SSIQ-137200's real-arm prediction is therefore still
    UNTESTED, but for a materially different reason than any prior batch:
    the instrument ran to completion and produced a real number, and that
    number is voided by a control, not withheld by a coverage or budget
    failure.
  strength: inconclusive
  strength_note: >-
    inconclusive as "voided by control failure," not "not attempted." Two
    independent reviews (Validator ADMIT-WITH-CONDITIONS, Red Team
    CHALLENGE) confirm the run executed honestly and the terminal label is
    the MECHANICALLY correct output of the frozen decision rule applied to
    this run's actual numbers. The CHALLENGE is not to the mechanics but to
    what the mechanics can be trusted to mean: two newly-found defects in
    REUSED control code (O-4, O-5 below) mean this specific
    CONTROL-FAILURE-VOID rests on weaker statistical footing than its own
    label implies, and a parallel defect (O-3) independently invalidates
    the underlying point estimate on a completely separate ground. The
    campaign-level preliminary cap from EV-SSIQ-e43afd is unchanged.
  claim_tier: toy
  claim_tier_note: >-
    Toy scale, matching H-SSIQ-137200.scope_ceiling: 4-5 primes actually
    searched (p in {2437, 3889, 5737, 7333, [8893 partial]}), graphs
    N in [203, 611] for the 4 primes contributing to the fit -- narrower
    than the originally intended 203-1800 range, exactly the risk
    DEC-20260805-a4e04e D-5 flagged. No result transfers to cryptographic
    scale, and none is claimed to.
  proof_status: empirical_only
  proof_refs:
    - experiments/EXP-SSIQ-a85692/runs/RUN-SSIQ-a85692-b/raw-result.json
    - experiments/EXP-SSIQ-a85692/runs/RUN-SSIQ-a85692-b/execution_report.yaml
    - coordination/goals/GOAL-SSIQ-001/batches/BATCH-005/reviews/VAL-BATCH-005.md
    - coordination/goals/GOAL-SSIQ-001/batches/BATCH-005/reviews/RT-BATCH-005.md
    - coordination/goals/GOAL-SSIQ-001/batches/BATCH-005/reviews/RT-PREFREEZE-EXP-SSIQ-a85692-v2.md
  preregistration_binding:
    specification: experiments/EXP-SSIQ-a85692/specification_v2.yaml
    freeze_commit: 14b56525
    verified_by: TASK-20260805-10868f
    detail: >-
      specification_v2.yaml frozen 2026-08-05 at commit 14b56525, itself a
      versioned amendment to v1 (specification.yaml, frozen 96ad45de),
      after its own pre-freeze Red Team review
      (RT-PREFREEZE-EXP-SSIQ-a85692-v2.md, FREEZE-WITH-FIXES, PF-1 through
      PF-5 applied before freeze). The Validator confirmed manifest.yaml's
      code.commit equals the freeze commit with no intervening commit
      before execution start.
  observations:
    - id: O-1
      statement: >-
        GD-7's ADMISSION-SIDE FIX WORKED, INDEPENDENTLY CONFIRMED. The
        run's own fresh two-point smoke test (c_min=1.4221s/vertex at
        p=2437, c_max=1.9500s/vertex at p=21601, monotonic) fed
        scope_reduction_fallback_v2's cumulative-ascending-prefix
        admission and admitted 5 of 12 primes (cumulative_estimated
        3492.94s <= T_reserved=3600s) -- clearing the >=4-prime floor
        using a FRESH, independently re-measured cost model, not merely
        BATCH-004's own already-committed numbers. Both reviewers
        independently re-derived this arithmetic from raw data.
      supported_by: [TASK-20260805-91bae2, TASK-20260805-10868f, TASK-20260805-f60ff9]
    - id: O-2
      statement: >-
        PF-1's EXECUTION-SIDE FIX ALSO WORKED, INDEPENDENTLY CONFIRMED BY
        BOTH REVIEWERS THROUGH DIRECT CODE READING AND INDEPENDENT
        ARITHMETIC, not by trusting the manifest's prose. real_execution_budget_v2
        replaced the individual per-prime cap the pre-freeze review found
        hidden in run_phase_minus1_on_confirmatory_set with a single
        aggregate, measured wall-clock counter. The Validator recomputed
        the counter's behavior from per-prime wall_seconds_used (284.9s,
        474.8s, 818.0s, 947.7s, 1074.7s -- a 3.8x spread that directly
        falsifies any fixed per-prime-cap reading) and confirmed no
        leftover T_PRIME reference and no timing leakage from earlier
        phases. The Red Team independently re-summed the same per-prime
        figures to 3600.072s against the reported 3600.0714724063873s,
        matching to five significant figures. This is the FIRST run in
        this campaign's history where the Phase -1 gate PASSED (n_primes_coverage_pass=5)
        and a real M-GAP was computed on real, in-session-computed delta_E
        labels: gamma_greedy=0.23354, gamma_random=0.40140,
        m_gap=+0.16786, bootstrap 95% CI [-0.4077, 1.3256], 4 usable
        primes with full coverage, N range [203, 611].
      supported_by: [TASK-20260805-91bae2, TASK-20260805-10868f, TASK-20260805-f60ff9]
      confidence: high
    - id: O-3
      statement: >-
        CONTROL-FAILURE-VOID IS THE MECHANICALLY CORRECT TERMINAL LABEL
        under the frozen decision rule applied to this run's actual
        numbers, independently re-traced against the code and re-derived
        arithmetically by both reviewers (C-SEARCH-BIAS's
        magnitudes_comparable_flag=true, checked before the CI, fires the
        control-failure branch regardless of the CI's wide positive-leaning
        range). Neither reviewer found any artifact in this run overclaiming
        the CI despite the void.
      supported_by: [TASK-20260805-10868f, TASK-20260805-f60ff9]
    - id: O-4
      statement: >-
        THE RED TEAM CHALLENGES WHAT THE CORRECT LABEL IS ENTITLED TO MEAN,
        ON TWO SEPARATE GROUNDS IN THE SAME REUSED CONTROL CODE. (2b)
        C-SEARCH-BIAS's own comparability rule has two clauses that
        DISAGREE on this run's numbers (corr_true=0.09611,
        corr_rand=0.03083): the RATIO clause (|corr_rand| >= 0.5*|corr_true|)
        says NOT comparable (0.03083 < 0.04805); only the ABSOLUTE-FLOOR
        clause (both < 0.1) fires, and that floor has essentially no
        statistical power at n=20 (needs |r| >~ 0.44 for conventional
        significance, per RT-BATCH-004's own prior calculation for the
        identical instrument and sample size). Both correlations are
        statistically indistinguishable from zero and therefore from each
        other, independent of whether real search-order contamination
        exists -- the absolute-floor clause will fire whenever the
        true-target correlation is itself weak, the GENERIC expected
        outcome for this instrument at toy scale, making
        magnitudes_comparable_flag=true a near-certainty at this sample
        size regardless of mechanism. This cuts toward a POSSIBLE FALSE
        control-failure (insufficient power to tell "no relationship in
        either arm" from "genuine contamination"), not a false pass -- so
        it does not license treating the run as anything other than VOID,
        but it means CONTROL-FAILURE-VOID should not be read as confirmed
        evidence that Algorithm 2's construction order is contaminating the
        real arm.
      supported_by: [TASK-20260805-f60ff9]
      confidence: medium
    - id: O-5
      statement: >-
        (2c) A NEW DEFECT: C-NULL-LABEL, THE *OTHER* CONTROL THE DECISION
        BRANCH'S OWN REASON TEXT CITES ALONGSIDE C-SEARCH-BIAS, IS DEAD
        CODE. Reading compute_delta_e.py's C-NULL-LABEL block end to end
        (reproduced identically in compute_delta_e_v2.py):
        c_null_label_control_failure is initialized False and never
        reassigned anywhere in either file -- there is no OLS fit of the
        null medians across primes, no m_gap_null, no bootstrap CI on it,
        and no comparison against the real arm's CI, despite equivalent
        machinery existing in the sibling module built for BATCH-003's
        (WISDE-based) null arm. For THIS run this is moot in the narrow
        sense that C-SEARCH-BIAS already fires the branch first -- but this
        is the FIRST run in the project's history to reach this code path
        with a real, non-empty delta_E multiset at all, so it is the first
        opportunity to notice that the "required, not optional" null-object
        control this experiment's own text relies on to distinguish a
        genuine gradient from a graph-topology/greedy-dynamics artifact
        structurally cannot ever fail. A future run that clears
        C-SEARCH-BIAS could report DETECTED with zero actual protection
        from this specific control, contrary to the frozen spec's own text.
      supported_by: [TASK-20260805-f60ff9]
      confidence: high
    - id: O-6
      statement: >-
        PD-2 (disclosed by the Executor, independently confirmed by both
        reviewers against the actual code and the run's own raw data): v1's
        inherited PER-PRIME-TRAPPED-EXCLUSION filter (trapped_fraction>0.5,
        stated in the frozen spec's own M-GAMMA-GREEDY definition text) was
        never implemented in the reused inline orchestration
        (usable_full = [p for p in per_prime], no filter of any kind). All
        4 primes contributing to this run's fit have trapped_fraction in
        [0.72, 0.85], each exceeding the 0.5 threshold the spec's own text
        requires excluding. The Validator confirmed the terminal decision
        is unaffected (CONTROL-FAILURE-VOID fires via C-SEARCH-BIAS before
        the trapped-fraction question is reached). The Red Team goes
        further and argues this INDEPENDENTLY INVALIDATES
        gamma_greedy=0.23354 as a clean, spec-conformant M-GAMMA-GREEDY
        measurement on a SEPARATE ground from the control failure: under a
        correctly implemented filter, all four primes would be dropped,
        descent_metrics.ran would be False, and no gamma_greedy/
        gamma_random/m_gap would exist to report at all -- a defect that
        recurs identically in any future run reusing this same code,
        including a hypothetical one that clears C-SEARCH-BIAS.
      supported_by: [TASK-20260805-91bae2, TASK-20260805-10868f, TASK-20260805-f60ff9]
      confidence: high
  inference: >-
    GD-7's fix (both the admission-side formula and PF-1's execution-side
    counter) is INDEPENDENTLY CONFIRMED TO WORK: this campaign's
    budget-allocation defect lineage (GD-4 through GD-7) is closed as far
    as the mechanism this run exercised. But clearing that mechanism
    surfaced two FURTHER defects in code this campaign has reused unedited
    since BATCH-003 (descent_hitting_time.py's inline orchestration and
    C-NULL-LABEL's comparison logic) that were invisible until a run
    finally reached the code path they live in with real data.
    H-SSIQ-137200's real-arm prediction remains UNTESTED: CONTROL-FAILURE-VOID
    is the mechanically correct label, but two independent grounds --
    C-SEARCH-BIAS's own low statistical power at this sample size (O-4) and
    PD-2's separate invalidation of the point estimate regardless of the
    control outcome (O-6) -- mean this run cannot be read as confirming
    that a real construction-order artifact contaminates the signal, nor
    can its m_gap=+0.168 be read as even a clean candidate measurement.
    Both are fixable at zero new search cost (Red Team's ranked BATCH-006
    list), using data this run already collected.
  boundaries:
    - >-
      H-SSIQ-137200's real-arm prediction (gamma_greedy < gamma_random) is
      UNTESTED. CONTROL-FAILURE-VOID means the signal is not trusted to be
      clean; it does NOT mean a delta_E-gradient was refuted, and it does
      NOT mean the control failure itself is confirmed evidence of
      construction-order contamination (O-4).
    - >-
      NO CLAIM IS MADE ABOUT WHETHER A p^{1/4} ALGORITHM EXISTS, is likely,
      or is near. asymptotic_claim stays null throughout.
    - >-
      gamma_greedy=0.23354/gamma_random=0.40140/m_gap=+0.16786 are NOT
      presented as valid, spec-conformant M-GAMMA-GREEDY/M-GAMMA-RANDOM
      measurements independent of the control-failure question -- PD-2
      (O-6) invalidates them on a separate ground. They are reported here
      only as an artifact of what this specific, now-partially-defective
      run computed, not as a candidate result.
    - >-
      GD-8 and GD-9 (below) describe defects in code REUSED UNEDITED since
      BATCH-003 (descent_hitting_time.py, C-NULL-LABEL's comparison logic),
      not defects introduced by this batch's v2 amendment. They went
      undetected in BATCH-003/004 because neither prior run reached the
      code path with real, non-empty data that would have exercised them.
    - >-
      Toy scale throughout (N in [203, 611] for the 4 contributing primes,
      narrower than the originally intended 203-1800 range -- the exact
      narrow-N-range risk DEC-20260805-a4e04e D-5 flagged, realized here
      because the aggregate Phase -1 budget was consumed before the
      widening extension could fire, per raw-result.json's
      n_extension_primes_attempted=0).
    - >-
      Evidence strength capped at preliminary, campaign-wide and unchanged
      by this batch: independence remains session-only, unchanged from
      every prior batch.
  unresolved_confounds:
    - >-
      Whether Algorithm 2's ascending-prime-order construction genuinely
      contaminates the real arm, or whether C-SEARCH-BIAS's comparability
      rule simply lacks the statistical power at n=20 to distinguish "no
      relationship in either arm" from "genuine contamination," is
      UNRESOLVED (O-4) -- Front 4's ranked BATCH-006 items 1-3 (wire
      C-NULL-LABEL, fix trapped-exclusion, strengthen C-SEARCH-BIAS's
      power) are all zero-new-search-cost, and item 4 (whether a
      construction-order fix like a different tie-break rule helps) is
      only informative once item 3 gives the comparability test real power.
    - >-
      Whether the trapped-descent pattern (all 4 usable primes at
      trapped_fraction 0.72-0.85) is a property of this specific labelling
      instrument or an intrinsic property of greedy descent at N~200-600 on
      these graphs, independent of delta_E-labelling quality, is
      UNRESOLVED and is Red Team's ranked item 2 -- diagnosable from
      already-collected data at zero new search cost.
    - >-
      Model independence remains absent and unverifiable in this
      environment, unchanged from every prior batch.
