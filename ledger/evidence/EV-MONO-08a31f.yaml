  proof_status: derivation
  proof_status_note: >-
    The core cost identity (D_trial(E)=m-1) rests on KN-FIND-c41ea9's own
    already-established derivation plus the group law, exercised (not
    re-proven) by Stages 0-3. The Red Team's residue-class-parity law
    governing Stage 5's true splitting behaviour is itself a fresh
    derivation, independently checked against measurement at multiple
    configurations by the same reviewer, but NOT yet independently
    cross-checked by a second party — named as a promising, not-yet-
    promotable finding (see `knowledge_promotion`).
  proof_refs:
    - knowledge/findings/KN-FIND-c41ea9.md
    - experiments/EXP-MONO-805a02/reviews/validator/validation-report.yaml (independent re-derivation of Stage 0-3, the S_4 symmetry proof, and the Stage-6 labels)
    - experiments/EXP-MONO-805a02/reviews/red-team/red-team-report.yaml (independent full-symbolic symmetry proof, the residue-parity law, and the Stage-6 census gap)

  observations:
    - >-
      THE CORE COST IDENTITY IS CLEANLY SUPPORTED, UNCHALLENGED BY EITHER
      REVIEWER. Stage 0 (m=3 known-answer edge), Stage 1 (m=4 fixture,
      193/193 both runs), Stage 2 (m=5 extension, 30/30 root-set matches
      both p), and Stage 3 (operation count, exact m-1 reconciliation at
      every one of 12 cells, both runs, zero polynomial-arithmetic calls
      confirmed by code inspection) were all independently re-derived by
      both reviewers from fresh code and hold exactly. The Validator
      additionally constructed a self-triggered degree-drop counterexample
      to independently confirm the disclosed degree-computation bug fix is
      real and complete; the Red Team independently confirmed it across
      five additional constructed edge cases (single/double 2-torsion
      drops at m=4/5, both Stage-2 and Stage-5 code paths).
    - >-
      STAGE 5's "EXPENSIVE" PREDICTION IS FALSIFIED AS LITERALLY SPECIFIED
      — BUT THE UNDERLYING PHENOMENON IS BETTER UNDERSTOOD THAN EITHER THE
      CONTRACT OR KN-FIND-c41ea9 ANTICIPATED. Measured near-complete
      splitting (m=4: 96.7-100%; m=5: 83.3-96.7%) instead of the predicted
      genuine root-finding cost. The Executor's explanation (S_4/S_5 are
      symmetric under permutation of ALL their arguments, so fixing m-2
      summation coordinates plus the on-curve target secretly re-enters
      the theorem's own precondition under a relabeling) was UNDER-
      VERIFIED as submitted (the Validator found the Executor's own
      symmetry check covered only 2 of 6 necessary transpositions, an
      insufficient basis for the "full S4/S5 symmetry" claim, and neither
      stage5 function ever computed the authoritative root-set-match test,
      only the weaker "splits completely" test) but IS CORRECT: both
      reviewers independently completed the missing checks (Validator: all
      6 transpositions confirmed identically zero via difference; Red
      Team: fully symbolic proof with symbolic a,b, all 6 transpositions
      plus 6 random permutations, degree/factor analysis ruling out a
      spurious resultant factor) and both confirmed root-set-match holds
      at 30/30 on fresh samples.
    - >-
      THE RED TEAM FOUND A MORE COMPLETE GOVERNING LAW THAN "SYMMETRY
      EXPLAINS IT AWAY" — THIS IS THE RECORD'S MOST VALUABLE SINGLE
      FINDING. Deriving the mechanism independently (Frobenius acts on the
      fibre's roots x(eps_1 P_1+...+eps_{m-1} P_{m-1}) by flipping signs at
      exactly the non-residue-fixed coordinates), the Red Team predicted
      and then measured: complete splitting occurs if and only if j=0
      (the factor-base locus, the theorem's own domain) OR j=m-1 (every
      fixed coordinate is a NON-residue x-coordinate, i.e. entirely OFF
      the curve over F_p) — confirmed at 200-400 trials/config, both
      primes, m=4 and m=5, with intermediate j values (1, 2) giving 0%
      splitting in every trial. THE ALL-OFF-CURVE LOCUS (j=m-1) IS A
      SECOND, DISTINCT COMPLETE-SPLITTING REGIME THE THEOREM'S OWN
      PRECONDITION DOES NOT COVER AND THE SYMMETRY-RELABELING ARGUMENT
      CANNOT REACH (that argument only re-derives the j=0 case under a
      relabeling; it says nothing about j=m-1). The Executor's diagnosis
      is therefore CORROBORATED for the specific literal Stage-5
      construction (which happens to sit at j=0 after relabeling) but is
      NOT a complete account of why fibres split completely in general —
      complete splitting is not, by itself, evidence of being on the
      factor-base locus.
    - >-
      STAGE 6's UNIVERSAL-LABEL PREDICTION IS FALSIFIED BY A CONFIRMED,
      GENUINE S-PRIME CELL — EXACTLY THE "REACHABLE POSITIVE" THE SOURCE
      PROPOSAL NAMED AS THE SINGLE MOST VALUABLE POSSIBLE FINDING. Both
      reviewers independently read `experiments/EXP-SIG-001/src/
      h013_f5_signatures.sage`'s `gstar_cell()` function directly and
      confirmed it genuinely builds and solves a system over the curve's
      own PRIME FIELD GF(p) (p=1,000,003 in the committed panel run, an
      independently-confirmed prime), with no boolean/extension-field
      encoding anywhere — a genuine formulation-S-with-prime-field-
      predicate measurement, exactly as labelled. This directly falsifies
      H-MONO-40aca5's own explicit `statement` clause (b): "this lane's
      own already-committed solving-degree measurements... all belong to
      the OTHER formulation... specifically for an EXTENSION-FIELD
      membership predicate... meaning none of them currently measures
      D_trial for any prime-field enumerate-and-test formulation" — this
      is now known to be false for at least one committed cell.
    - >-
      THE STAGE-6 "CENSUS" WAS INCOMPLETE, THOUGH INDEPENDENTLY CONFIRMED
      NOT TO CHANGE THE ANSWER. The Red Team found the Executor's search
      method (grep for the literal string "GOAL-SIG" and similar,
      restricted by `git ls-files`) structurally cannot match experiment
      directories named `EXP-SIG-002` through `EXP-SIG-008` (90+ committed
      run directories) or `EXP-DREG-002`/`EXP-DREG-004` (30+ runs) — none
      of which appear in the Executor's table, which nonetheless reports
      `not_located: 0` as if the search were exhaustive. The Red Team
      independently checked every one of these missed directories and
      confirmed all are boolean/GF(2)/syzygy systems with no additional
      `gstar`-style prime-field cell and no committed ICEX measurement —
      so the labelling CONCLUSION is unaffected, but the record's own
      framing of Stage 6 as a complete census over "every reachable
      committed cell" is not accurate as submitted; the completeness was
      established by the Red Team's own supplementary check, not by the
      Executor's search.
    - >-
      A REAL ERROR WAS FOUND IN THE SOURCE PROPOSAL'S OWN CLAIM, CARRIED
      FORWARD UNCHANGED INTO THIS RECORD UNTIL NOW. IDEA-20260806-9d47e2's
      claim (A) states the full signed root set costs "at most 2^{m-2}-1
      additions." The Red Team instrumented the actual addition tree and
      measured 2, 6, 14, 30, 62, 126 additions at m=3..8 — exactly
      2^{m-1}-2, i.e. TWICE the proposal's own claimed bound at every m.
      This is a genuine arithmetic error in the source proposal (not the
      Executor's or this Coordinator's own conversion), never previously
      measured, surfaced only by this record's own instrumentation.
      Disclosed here rather than silently absorbed; a future record citing
      IDEA-20260806-9d47e2's claim (A) numerically should use the
      corrected bound.
    - >-
      SUCCESS PROBABILITY WAS OMITTED FROM THE EXECUTION REPORT'S SUMMARY
      DESPITE BEING PRESENT IN RAW DATA, AND THE FACTOR BASE WAS
      UNEXPECTEDLY LARGE RELATIVE TO THE CURVE. The record's own
      `confounders` require D_trial and success probability to be reported
      as a pair, never folded into one number; the Executor's raw-result.json
      carries `hits_in_factor_base` but the execution_report's summary
      tables never surface it. The Red Team recovered it: the Stage-3
      factor base is 64 of 111 total on-curve x-coordinates at p=211 —
      57.7% of the ENTIRE curve, not a small subset — and confirmed
      measured hit rates (0.572-0.592 at m=3, matching predicted
      2|F|/#E=0.593; 0.113-0.120 at m=4, matching predicted ~0.127) behave
      as a controlled, understood null rather than an anomaly. Disclosed
      as a reporting-completeness gap, not a computation error.
    - >-
      A CURRENTLY-BENIGN, UNDISCLOSED IMPLEMENTATION HAZARD WAS FOUND AND
      CHARACTERIZED BY THE RED TEAM. Stages 2 and 5-at-m=5 compute a
      `sympy.resultant` OVER THE INTEGERS and only then reduce mod p,
      which is mathematically NOT equal to the resultant of the mod-p
      reductions whenever a degree drop occurs at the eliminated variable
      — this can inject a spurious root. The Red Team constructed the
      exact triggering condition and found it happens to be self-masking
      at every m and p tested here (the trigger condition coincides
      exactly with a case where the "spurious" root is actually genuine),
      but this was not reasoned about by the Executor and is not verified
      to remain benign for a different resultant recursion split or a
      larger m. Named as a concrete due-diligence item for any successor
      record extending this construction.
    - >-
      STAGE 1's REPLICATION-INDEPENDENCE WAS NOT ACTUALLY VERIFIABLE FROM
      THE SUBMITTED ARTIFACTS, THOUGH IT IS TRUE. `implementation.md`
      claimed Stage 1's raw-result.json content differs between the two
      runs' independent seeds; the Red Team found this false as stated
      (Stage 1 records no sample-dependent field at all — both runs read
      byte-identical after stripping timing) and supplied the missing
      verification itself (independently computed triple-sample digests:
      `d03f0658e9101a05` seed 20260830 vs. `01eda2f477ea138a` seed
      20260831, both giving 193/193). The Executor's Stage-1 CONCLUSION
      (193/193, both runs, root-set exact) is correct; the disclosed claim
      about HOW that was demonstrated was inaccurate as written.
    - >-
      RECONSTRUCTION METHODOLOGY (STAGE 1) CONFIRMED TO HAVE GENUINE
      DISCRIMINATING POWER. Since KN-FIND-c41ea9's original 193 historical
      triples are not machine-readably committed, Stage 1 used a freshly-
      seeded reconstruction of the identical curve/construction rather
      than literal reproduction. The Red Team constructed six deliberately
      WRONG builds (wrong curve, a sign error in S_3's constant term, a
      squared-term substitution, product-instead-of-resultant, a mutated
      group-law prediction) under identical seeding and confirmed every
      one scores 0/193 on the authoritative root-set-match metric — the
      reconstruction methodology genuinely distinguishes correct from
      incorrect implementations; 193/193 is real evidence, not a foregone
      conclusion of the test setup. (Caveat: the secondary "splits
      completely" metric alone is weaker — wrong-curve mutants still
      scored 25-53/193 on it — underscoring why the root-set-match test,
      not mere splitting, is the authoritative one throughout this record.)
    - >-
      NO SCOPE CREEP, NO WRITES OUTSIDE THIS EXPERIMENT'S OWN DIRECTORY,
      CONFIRMED BY BOTH REVIEWERS. `git status --porcelain` over every
      goal directory, ledger record, and evidence file read in Stage 6
      returned empty for both reviewers. Neither report makes a value
      judgment about GOAL-SDEG-001/GOAL-DREG-001/GOAL-SIG-001/ICEX's own
      research quality — only a formulation label. One wording caution
      (Red Team): `not_yet_committed` was applied to specs that ARE
      committed but never executed; a future record should distinguish
      "no contract exists" from "contract exists, execution withheld."
    - >-
      GOVERNANCE FINDING, DISCLOSED IN FULL IN A SEPARATE CORRECTION
      RECORD (see `CORR-20260830-0b8d95`). A SEVENTH out-of-band "Cursor
      Agent" commit this session edited this record's frozen, already-
      executed contract and hypothesis in place, discovered during the
      post-review merge. Unlike incidents 5-6, this edit's content is a
      genuine, correct clerical fix (aligning "1 addition" with the
      contract's own m-1 identity at m=3, and correcting two internal
      stage-number cross-references) and touches no falsification
      criterion or outcome-determining text. This evidence record is
      nonetheless composed against the original frozen contract at commit
      `033aff04e`, matching both reviewers' basis, per this session's
      consistent practice.
    - >-
      BOTH REVIEWS THEMSELVES WERE DISPATCHED BEFORE THE COORDINATOR'S
      SNAPSHOT COMMIT (the same procedure deviation as the prior MONO
      cycle), disclosed in `coordination/tasks/TASK-20260830-5ecba3/
      snapshot-receipt.json`. Both reviewers independently flagged this in
      their own attestations (Validator: terminal verdict `incomplete` on
      admissibility grounds; Red Team: recorded sha256 hashes of all
      reviewed files for post-hoc re-binding). No content changed in the
      interim; the snapshot commit now binds exactly what both reviewers
      read, cross-checked against the Red Team's own recorded hashes.

