      own success_criterion and H-MLKEM-36f511's own
      falsification_conditions present the "REALIZABLE" (F2) verdict as an
      equally live, fully specified outcome without disclosing that this
      elementary arithmetic already forecloses F2 for any B compatible
      with ML-KEM's own ring structure -- and the tail_checks
      "extreme-B check" instruction ("a bound large enough to make the
      ceiling approach Q, if any exists within a defensible noise budget")
      has no operational stopping rule once this gap is accounted for,
      per the red-team's stated consequence.
