      reported"; and the fourth (Ettinger-Hoyer) has no knowledge-base
      entry at all. EXP-CSIDH-c65945.stopping_rules names exactly one
      BLOCKED/NOT-COMPUTED escape valve (failure to access the primary
      CSI-FiSh source) -- none is named for failure to access the other
      three sources the primary applicability_outcome metric itself
      depends on, and the budget note characterizes the whole task as a
      routine "citation-plus-arithmetic-check" without disclosing this
      literature-access risk, which the red-team notes is compounded by
      this program's own immediately-prior sessions documenting WebSearch
      and crypto-kb retrieval failures in this exact harness.
