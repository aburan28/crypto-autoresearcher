    - coordination/goals/GOAL-MLKEM-001/batches/BATCH-003/tasks/TASK-20260723-214/sieve_analysis.md
    - coordination/goals/GOAL-MLKEM-001/batches/BATCH-003/tasks/TASK-20260723-217/technical_review.md
    - coordination/goals/GOAL-MLKEM-001/batches/BATCH-003/tasks/TASK-20260723-218/falsification_review.md
  observations:
    - >-
      ePrint 2026/1022 proves a fixed-dimension large-radius geometry for one
      product of continuous Gaussian polynomials and explains selected LAC
      failure-pattern alignments.
    - >-
      Its displayed Gaussian independence surrogate has second moment
      4*sigma^2 while the product law has second moment sigma^4, so the
      advertised equal-scale comparison is not valid as printed.
    - >-
      Theorem 1's printed lower-bound polydisc is not contained in the strict
      outer sphere; a fixed outward shift appears to repair the proof without
      changing the rate function.
    - >-
      The paper does not cover exact bounded CBD inputs, multiple dependent
      module products, compression, modulo-q representatives, or FIPS
      coefficientwise decoding, and therefore does not revise FIPS 203 DFRs.
    - >-
      The pinned ML-KEM estimator's final n-fold step is a union bound and does
      not require output-coefficient independence.
    - >-
      ePrint 2026/1465 proves constant-factor pair-reduction changes under iid
      isotropic ball models while preserving the
      (3/4)^(n/2)/sqrt(n) scale and the 0.2075187 list exponent.
    - >-
      Its largest headline factors use a fixed-sign sphere denominator; the
      sign-matched uniform-ball factors are 2.25 globally and 1.5 locally.
    - >-
      The paper's local Lemma 1 prints min where its definitions, proofs, and
      constants use max; this is a notation error, not evidence against the
      max-rule formulas.
    - >-
      No current BATCH-002 cost row changes without a coherent joint
      radial-angle-filter estimator rewrite and outer reoptimization.
    - >-
      Of 69 supplied papers, two were full-text ML-KEM leads, six were adjacent
      methodology, one was pedagogical, and 60 yielded no further lead at
      abstract-triage depth.
  inference: >-
    The supplied papers add useful mathematical models and bounded audit
    targets but no passive attack, DFR revision, sieve-exponent change,
    standardized solve, or algorithmic breakthrough. The cheapest
    claim-relevant follow-up is the narrowed exact-FIPS marginal audit for
    ePrint 2026/1022.
  boundaries:
    - Literature and symbolic review only; no empirical ML-KEM run or sieve was performed.
    - Crypto-tier scope denotes standardized parameters under discussion, not a solve or attack certificate.
    - Apparent source errors are restricted to the named revisions and equations.
    - Abstract-only exclusions are triage dispositions, not durable negative evidence.
    - A toy exact marginal check cannot by itself revise n=256 FIPS rates.
  unresolved_confounds:
    - Exact compression marginals and Python/FIPS rounding equivalence remain unaudited.
    - The nonuniform sieve limit lacks an explicit uniform domination or tail-truncation proof.
    - Operational lattice-sieve list radial laws are not measured by ePrint 2026/1465.
    - Binary PDF hashes were unavailable; complete extracted-text hashes bind the reviewed content.
  reviewed_by: coordinator
