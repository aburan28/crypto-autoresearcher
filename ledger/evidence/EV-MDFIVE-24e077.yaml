      full compression function, about MD4's or MD5's preimage resistance, or
      about any literature complexity figure (2^96 / 2^102 / 2^116.9 / 2^123.4,
      all UNVERIFIED provenance at every occurrence).
    - >-
      Exactly two free message words (word2 and word12), each a k1 = k2 in
      {4, 6}-bit window; the other 14 words held to the frozen
      fixed_word_generation(20260821, (2,12), k) values. Split point S = 8,
      boundary component p = 3 (the register produced at step 6), m = 12,
      k = 20. Target seeds 8975321 / 8975322 / 8975328 (gate phases) and
      8975323 (controls).
    - >-
      SCOPED TO ONE FIXED-WORD SEED. The frozen contract states plainly that the
      gate is NOT quantified over fixed-word seeds (H-MDFIVE-0ca596 CLAIM 3).
      Every integer in O-1 through O-3 is at seed 20260821. The reviewer-derived
      range of the CTL-PO5 quantity over 120 seeds is 2..928 (O-4), so a
      conclusion stated without the seed is stated two orders of magnitude wider
      than the evidence. The true quantifier is "there exists a fixed-word seed
      such that for all free-word values", not "for all free-word values"; the
      record discloses this and this boundary is what stops it being reasoned
      past.
    - >-
      MD5 arm - phase C of the gate only (md5_run_authorization F3), at
      parameters identical to the MD4 phase but for the primitive selector and
      the target seed, verified field by field from the runs' own fingerprints.
      NO MD5 SEARCH COMPUTATION OF ANY KIND OCCURRED. The MD5-mode CTL-PO9
      computation is IR-4-invalid and is excluded from this record's support -
      see O-7 and the closing decision F-6.
    - >-
      NO transfer or extrapolation is claimed to full 48-step MD4, full 64-step
      MD5, SHA-2, or to any other split point, component index, separation,
      window width or seed. NOTHING here projects toward the approximately
      2^64-block instrument-class gap (SC-3, IR-10, DEC-20260821-1215e5 F-8) -
      the red team's exhaustive token sweep found no such row anywhere and every
      2^64 occurrence in the package is a prohibition.
    - >-
      TRANSFER ASSUMPTIONS, STATED BECAUSE THEY ARE THE ONES A LATER READER WILL
      BE TEMPTED TO MAKE. (i) The E/D taint calculus and the j - i >= 4
      threshold ARE full-word algebraic statements about MD4's Round-1 word
      schedule and do transfer to any correct implementation of it - the red
      team derived them from RFC 1320 alone. (ii) NOTHING ELSE HERE TRANSFERS
      WITH THEM. In particular the calculus establishes joint FULL-WORD
      dependence, while the instrument needs WINDOWED distinguishability at
      m = 12, and at that resolution dependence is seed-contingent - the red
      team measured distinct_fwd_12bit = 1, i.e. full ANOM-1 recurrence, at some
      fixed-word seeds. A taint calculus cannot detect that gap and must not be
      cited as if it could.
    - >-
      The record contains NO memory-scaling model and no time-memory tradeoff
      was exercised at this scale; memory is declared as 2^k1 entries and that
      is all. No future record may derive a memory-scaling claim from this one.
    - >-
      NOVELTY IS UNVERIFIED. Nothing here is described as novel, new or first,
      and `sota_delta` against the full-primitive literature is declared ZERO
      explicitly. The dependent goals (GOAL-SHA2-001, GOAL-SHA3-001,
      GOAL-BLAKE-001, GOAL-ASCON-001, GOAL-SIMSPK-001) are licensed to cite
      nothing here beyond the design guidance carried by KN-TECH-bb7e9f and
