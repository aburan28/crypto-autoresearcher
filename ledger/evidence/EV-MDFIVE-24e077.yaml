  proof_status_basis: >-
    THE ORDER IN docs/claims-and-verification.md "Refutation artifacts" WAS
    WORKED IN ORDER, AND THE ACHIEVED LEVEL IS `derivation`, NOT HIGHER AND NOT
    LOWER.
    (1) Counterexample certificate - SOUGHT AND PARTLY OBTAINED, but not
    packaged as a schema certificate. What exists is stronger than a sample and
    weaker than a certificate - an EXHAUSTIVE enumeration of the entire
    2^(k1+k2) = 4096-pair space at the declared control scale, exhibiting seven
    explicit non-Y-reproducing 20-bit colliders besides the planted pair against
    a modeled expectation of 0.00390625, with the full list present as a
    required run artifact and re-derived independently by both reviewers. It is
    an explicit instance on which the theory's prediction fails and independent
    code re-checked it; it is not a certificate only because the run wrapper
    registers no kind for it.
    (2) Derivation note - OBTAINED AND ARCHIVED. The failure is isolated by a
    written, checkable argument, not merely observed - the raw candidate set is
    exactly the Cartesian product of the two per-side fibers over the shared
    20-bit value, so its cardinality is the PRODUCT of the two fiber
    multiplicities (4 x 2 = 8) rather than a sum of independent 2^-20
    coincidences. Both reviewers reached this decomposition from their own
    implementations, from opposite directions and blind to each other - the red
    team from the fiber-multiplicity product, the validator from the forward
    image's non-injectivity. That convergence is why the level is `derivation`
    and not `empirical_only`.
    (3) Empirical-only - NOT the level here, and is declared not to be.
    TIMING, STATED RATHER THAN ASSUMED - the primary refutation artifact (the
    raw candidate set and the full non-Y-reproducing collider list) was archived
    at the SNAPSHOT commit d957dfe78, before this record and before the closing
    decision, as the rule requires. The two reviewers' independent
    re-derivations are archived in the SAME commit as this record, that being
    the declared content of a `ledger` archive; they CORROBORATE the basis and
    are not themselves the basis.
    LIMIT - a derivation about the tested construction is not a universal
    impossibility claim. This one is about (R1-SEP10, fixed-word seed 20260821,
    k1 = k2 = 6, MD4) and nothing wider.

  observations:

    - id: O-1
      text: >-
        THE GATE PASSED AND THE TWO-WAY DEPENDENCE IS REAL. GATE-PO2 returned
        PASS on all nine frozen pass-predicate clauses, and the substantive
        claim behind it - that at separation j - i = 10 the declared matching
        observable genuinely depends on BOTH free words, so ANOM-1 is CURED at
        this slice and NOT RELOCATED - is independently confirmed twice, by two
        instruments the review plan deliberately made complementary. The red
        team re-derived the two-way dependence predicate BLIND, from RFC 1320's
        step table and the frozen contract alone, without opening either
        producer module, and reports full agreement on all four load-bearing
        facts - the forward taint sets E_0 = {1}, E_1 = {1,2}, E_2 = {1,2,3},
        E_d = {0,1,2,3} for d >= 3; the backward sets D_0 = {0}, D_1 = {0,3},
        D_2 = {0,2,3}, D_r = {0,1,2,3} for r >= 3; the identity d + r = j-i-1,
        independent of the split point S; and the threshold that E_d meets D_r
        for every legal S iff j - i >= 4. It confirmed each empirically by
        differential probing over 4000 trials before opening any producer
        artifact. The validator replicated the gate from the producer's own
        artifacts and reproduced every phase's distinct-value vector and fiber
        set byte-identically from a from-scratch named-register implementation,
        and re-ran both run modes cold from the snapshot module with identical
        metrics. AGREEMENT BETWEEN A BLIND RE-DERIVATION AND A REPLICATION IS
        EVIDENCE ABOUT THE QUANTITY, which is the entire reason both were
        commissioned.
      caveat: >-
        Weighted with the discount O-13 records - the red team's dispatch prompt
        disclosed the expected answer before it opened anything (PD-1, severity
        high), so the R1 re-derivation is independent of every producer
        IMPLEMENTATION but was not blind to the ANSWER.

    - id: O-2
      text: >-
        THE GATE MEASURED THE CAUSE OF THE LATER FAILURE AND RECORDED A PASS,
        BECAUSE ITS CRITERION AND ITS PRE-REGISTERED PREDICTION ARE DIFFERENT
        QUANTITIES. EXP-MDFIVE-a8e71e's mandatory_dependence_gate records, before
        any run, predicted_values distinct_fwd_32bit = 16 and distinct_bwd_32bit
        = 16, "the 12-bit counts are predicted 16 as well, with 15 acceptable".
        Phase B observed distinct_fwd_32bit = 9 of 16 and distinct_fwd_12bit = 4
        of 16; at the k1 = k2 = 6 control scale, 33 of 64 and 6 of 64. The
        criterion actually applied is `distinct >= 2`. A pre-registered
        prediction was missed by a factor of ten in a clause that scored PASS.
        `>= 2` tests NON-CONSTANCY; the downstream arithmetic that CTL-PO5's
        ceiling and the proof_search_map's audit-2 expected count both rest on
        needs NEAR-INJECTIVITY. Non-constancy does not imply near-injectivity,
        so GATE-PO2 cannot discharge the assumption the map names it as
        discharging.
      cheapest_falsification_control_costing_zero_compute: >-
        THE NUMBER WAS ALREADY ON THE PAGE. Comparing the gate's own reported
        integer (distinct_fwd_12bit = 4) to the gate's own pre-registered
        predicted integer (16) is a single comparison over numbers already in
        hand, at ZERO additional compute, and it fails the construction at
        phase B - before CTL-PO4, CTL-PO5, CTL-OBS and CTL-H1B ran at all.
        Everything from CTL-PO4 onward was spent rediscovering a number the
        batch already had. Recorded here as a control, not as a reproach - it
        generalises, and it is carried into the successor as RC-2.

    - id: O-3
      text: >-
        CTL-PO5 PART (b) FAILED, AND ITS STRUCTURE IS THE FINDING. At k1 = k2 =
        6, MD4, R1-SEP10, fixed-word seed 20260821, target seed 8975323, the raw
        pre-certificate candidate set has EXACTLY 8 members against a declared
        ceiling of 4 and a modeled expectation of 1.00390625. Part (a) passes -
        the projections are 4 distinct wA and 2 distinct wB, both far below the
        window size 64 - so this is NOT batch 4's failure mode, which was a full
        row. All eight candidates share the single 20-bit value 677474 (0xa5662);
        exactly one, (wA, wB) = (331791343, 1135165152) at window indices
        (47, 32), is certificate-verified against the full Round-1 output state
        Y; the other seven are not. The eight are exactly the 4 x 2 Cartesian
        product of the forward fiber over that value with the backward fiber
        over it. The count is therefore not eight independent 2^-20 coincidences
        - it is fully determined by two multiplicities the gate had already
        measured and recorded as a PASS.
      independence: >-
        Reached from opposite directions by two reviewers who could not see each
        other - the red team from the fiber-multiplicity product, the validator
        from the forward image's non-injectivity - and reproduced to the integer
        by three implementations in total (producer, validator, red team). That
        convergence is stronger evidence about the quantity than either path
        alone.
      classification: >-
        `negative_observation`, and the executor's classification is RATIFIED.
        It is not infrastructure_error, not resource_exhaustion, not
        invalid_measurement and not implementation_error - every correctness
        control passed independently and two from-scratch reimplementations
        agree to the integer (AGENTS.md rule 3 is not engaged in either
        direction). THE STOP WAS CORRECT AND COMPLETE - no declared-scale run
        directory exists, no parameter was adjusted, no seed changed, no
        alternative free-word pair tried, no run repeated, and 900 s of run
        ceiling is reported as unspent rather than reallocated.

    - id: O-4
      text: >-
        THE CEILING OF 4 IS AN UNLABELLED MODELED FIGURE OPERATING AS A HARD
        THRESHOLD, INSIDE A PACKAGE THAT LABELS EVERY SPEED RATIO "MODELED, NOT
        MEASURED". Its premise is E = 1 + 4096/2^20 = 1.0039, a pure uniformity
        model that assumes near-injective per-side maps. The red team measured
        the actual quantity over 120 consecutive fixed-word seeds at the
        R1-SEP10 parameters - median 32, mean 54.3, min 2, max 928, with 111 of
        120 seeds (92 percent) exceeding the ceiling and NOT ONE of 120 seeds
        producing the modeled value. Decisively for what the number is about -
        MD5, whose forward map is fully injective at 32 bits at all 120 of those
        seeds, STILL exceeds the ceiling at 59 of 120. So the ceiling is
        miscalibrated even with the MD4 forward collapse removed entirely.
      provenance_label_that_must_travel_with_this_observation: >-
        REVIEWER-DERIVED, SINGLE-SOURCE, UNCONTRACTED, AND NOT A RUN RECORD. The
        120-seed sweep was computed by TASK-20260821-2de43d in a session
        scratchpad outside the repository. Its author declares explicitly that
        no wrapper-charged run was performed, that it produces no run record,
        and that it must not be cited as one. It is admitted here as reviewer
        evidence bearing on calibration and scope, and it is exactly what RC-1
        must re-run under contract before any record treats the distribution as
        a measurement of this program.
      what_the_quantity_should_have_done_and_did_not: >-
        distinct_fwd should grow toward 2^k1 as k1 grows, because the sweep
        width is the parameter that is supposed to destroy a collapse. Measured
        by the validator at seed 20260821 - from k1 = 4 to k1 = 8 the free-word
        space grows 16 -> 256 while the forward image inside the 12-bit matching
        window goes 4 -> 5 -> 6 -> 6 -> 6, saturating at SIX. A quantity that
        stops growing when its own sweep width grows is an artifact tell under
        docs/inventor-protocol.md section 3, and it was visible in data the
        batch already had at two scales.

    - id: O-5
      text: >-
        ANOM-B5-1 - THE MD4 FORWARD OBSERVABLE COLLAPSES AND THE MD5 ONE DOES
        NOT. THE PHENOMENON IS REPLICATED; ITS MECHANISM IS NOT SETTLED, AND TWO
        DIFFERENT MECHANISMS ARE NOW ON RECORD. Phenomenon, measured by the
        executor and reproduced independently by both reviewers - MD4 phase B
        gives distinct_fwd 9/16 at 32-bit and 4/16 at 12-bit where MD5 phase C
        gives 16/16 and 16/16; at k1 = k2 = 6 the MD4 forward v6 gives 33/64 and
        6/64. Beyond the run - the validator measured the collapse across
        k1 = 4..8 at seed 20260821 and across six fixed-word seeds (MD4 forward
        window image 2 to 26 of 256, MD5 fully injective at 256 with a window
        image of 90 to 217), and reports that the six surviving MD4 window
        values are all congruent to 98 mod 512, so the low nine bits of the
        forward matching observable are constant and only bits 9, 10, 11 vary.
        MECHANISM 1 (red team) - MD4's F(x,y,z) = XY v not(X)Z is a bitwise
        multiplexer, constant in x at every bit where y_i = z_i, and tracing the
        forward chain at seed 20260821 the free word's varying bits are
        annihilated at step 3 (varying 0x00001800 against mask y^z = 0x5c0be734,
        visible 0) and at step 5 (varying 0x00004000 against 0x7b7a00ae, visible
        0); MD5's step adds the varying register OUTSIDE F through "+= b", so no
        bit of it can be annihilated. Supported by a null-object control -
        replacing F with a same-shape non-multiplexer mixer restores 64/64 and
        64/64 against MD4's 33/64 and 6/64 - and by a falsification test the
        explanation survived - MD5's forward map is injective at 32 bits at all
        120 seeds where MD4's is injective at 6.
        MECHANISM 2 (validator) - MD4's Round-1 SHIFT TABLE keeps the free
        word's low bits out of the low nine bits of v6, offered explicitly as an
        interpretation of the measured image structure and not as a measurement.
        THE TWO ARE NOT SHOWN TO BE THE SAME CLAIM, and neither reviewer could
        see the other. Composing them into one mechanism would be the
        Coordinator's synthesis, not the reviewers' evidence. See the closing
        decision F-7 for the disposition and the discriminating test.

    - id: O-6
      text: >-
        CTL-PO3, A CLAUSE OF THE NINE-CLAUSE PASS PREDICATE, IS VACUOUS AGAINST
        ITS OWN DECLARED FAILURE MODE. gate_direction_A loops over the four
        pre-registered held-fixed indices but never applies the loop variable to
        the word list, so the four repetitions are four evaluations of an
        identical expression and the byte-identity assertion can detect only
        nondeterminism - not "chunk1_observable reads free word B somewhere it
        must not", which is the failure the contract assigns it. The validator
        demonstrated this rather than asserting it - a deliberately leaky
        observable passes the module-shape check and fails the contract-shape
        one. IT DOES NOT OVERTURN THE VERDICT - the validator separately ran the
        contract-shape loop, actually setting free word B to each of 0, 5, 10,
        15, against the real chunk1_observable and got byte-identical rows. The
        clause is SATISFIED IN FACT and UNESTABLISHED BY THE ARTIFACT, and that
        distinction is the whole of the finding.

    - id: O-7
      text: >-
        AN MD5-MODE COMPUTATION OUTSIDE THE CONTRACT'S EXHAUSTIVE AUTHORIZATION
        WAS EXECUTED. Run 1's CTL-PO9 component-identity assertion ran in four
        configurations, two of them MD5 - md5_r1_sep10 and md5_batch4_slice, 64
        probes each, so 128 MD5 Round-1 evaluations plus 128 MD5 straight-line
        reference passes, on probe word-lists drawn from random.Random(20260821),
        a procedure the contract does not declare. EXP-MDFIVE-a8e71e's
        md5_run_authorization names F1, F2 and F3 and closes "NOTHING ELSE ...
        Any MD5 computation outside F1, F2, F3 and run 5 is invalid under IR-4".
        The validator verified from primary artifacts that F1, F2 and F3 are all
        present and passed, that run 5 never executed, that ZERO MD5 search
        computation of any kind exists, and that both named exclusions (phase A
        in MD5, the k1 = k2 = 6 controls in MD5) were honoured. It regenerated
        the 64 probe word-lists and recomputed all four configurations,
        confirming that MD5 arithmetic genuinely ran rather than being merely
        labelled. THE BREACH IS PRESENCE WITHOUT AUTHORIZATION, NOT EXCESS SCALE
        - the unauthorized computation is parameter-symmetric with its MD4
        counterpart in every field, so SC-1's "never larger" is not engaged.
      severability_as_measured: >-
        The unauthorized result is a distinct key in run 1's raw output
        (raw.CTL_PO9_component_identity.md5_r1_sep10 and .md5_batch4_slice).
        Nothing in run 1 or run 2 consumes it - no target, no seeded draw from
        any of the nine frozen seeds, no search, no downstream dependency. The
        MD4-mode CTL-PO9 result the contract actually needs is independently
        present and passed. ONE MANIFEST METRIC AGGREGATES OVER IT -
        `CTL_PO9_all_ok` is computed as all() over all four configurations, so
        the manifest headline rests partly on an IR-4-invalid computation; the
        MD4-only value is recoverable from raw-result.json and is also true.
      disclosure_history: >-
        Disclosed by the executor as DEV-3 and explicitly not adjudicated;
        recorded by the snapshot Coordinator as PF-6
        `mismatch_reported_not_frozen_over` with the IR-4 disposition DEFERRED
        to this closing task precisely so validator joint V4 could own it first.
        Nothing was concealed at any stage. The disposition is F-6 of the
        closing decision.

    - id: O-8
      text: >-
        RUN-RECORD CONFORMANCE FAILURES, NONE OF WHICH IS A MEASUREMENT FAILURE.
        (i) `code_path_fingerprint` is absent from BOTH run manifests;
        EXP-MDFIVE-a8e71e required_artifacts demands it "in every run manifest,
        per phase" and IR-8 makes its absence an invalidation rule and states
        that prose disclosure elsewhere does not discharge it. Run 1 carries
        none anywhere; run 2's four per-phase fingerprints ARE present in
        raw-result.json and do answer PO-8's substantive question. (ii) Three
        AGENTS.md artifact-policy fields are absent from both manifests -
        inference.backend, inference.probe_verified,
        inference.degraded_requirements - originating in harness/runner.py's
        second `_inference_block()`, which is outside the executor's write_scope;
        these three were NOT disclosed, unlike the known-wrong
        requested_policy at the same site (ANOM-B5-3, disclosed). (iii) The
        execution report's SC-G asserts "Every run manifest carries `caveat_refs`
        ... and `code_path_fingerprint` per phase"; the second half is FALSE for
        both manifests, and this is the one place the report's self-assessment
        states something the artifacts contradict. (iv) budget.enforcement
        states both runs were launched under `timeout --signal=KILL <ceiling>`;
        no artifact records it and both manifests record deadline_seconds null,
        so no in-process deadline was armed and the claim is unverifiable from
        the run record. (v) `reproduction` says the commands are recorded
        "verbatim" in command.txt, which records only " ".join(sys.argv) - the
        validator confirmed by cold re-run that the recorded shape is what a
        `python3 -m` launch produces, so the account is correct and the word
        "verbatim" is not.
      what_IS_satisfied_and_was_checked_not_assumed: >-
        Expected run count - exactly two directories, both declared, three
        declared runs not executed each carrying the clause that stopped it, no
        deleted run, no superseded run. Seed integrity - the validator
        regenerated the 14 fixed words, both free-word high-order bit patterns
        and every declared target from the frozen seeds and procedures with its
        own implementation and got byte-identity on every value; IR-3 satisfied.
        Control comparability - phase C differs from phase B in exactly one
        field, `primitive`, verified from the runs' own code_path_fingerprint
        parameter tuples rather than from narrative; nothing MD5 is wider than
        the MD4 arm anywhere. Gate ordering - established from run 2's phase_log
        monotonic clock and both manifests' wrapper timestamps, with the gate
        verdict recorded at monotonic 121346.788092 and the first control phase
        starting at 121346.788093; the ordering is enforced by control flow, not
        convention, and NO DECLARED-SCALE RUN EXISTS AT ALL, so IR-1 is not
        engaged in any form. Suite - 51 passed, 0 failed, 0 skipped, strictly
        additive against BATCH-af29f6 (224 insertions, 0 deletions, 32 -> 44
        test functions); the validator additionally ran BATCH-af29f6's
        byte-identical test file on this interpreter and got 39/0/0 against the
        recorded 37/1/1, which is the measurement DEC-20260821-1215e5 F-7 asked
        for, taken at CPython 3.13.1 rather than 3.12.8, with no claim to have
        bisected the cause. Quarantine - sha256 unchanged against MANIFEST.yaml,
        directory untouched, payload not read, attested by both reviewers.
        Archive binding - 26 of 26 declared paths re-hashed by the validator, 0
        mismatches, snapshot an ancestor of HEAD, the only path changed since
        being dispatch_queue.json which the binding deliberately excludes under
        ruling CPC-3.

    - id: O-9
      text: >-
        HEUR-H1 WAS NOT TESTED AT ALL THIS BATCH, AND HEUR-H1b's FROZEN
        THRESHOLD FIRED ON BOTH SIDES. Run 4 never executed; no chi-square, no
        p-value, no sample variance, no tail check and no achieved N exists
        anywhere in the package, and none is asserted - the execution report
        records O-9 "NOT MEASURED. The run did not happen." with
        missing_data_stays_missing true, and SC-D, SC-E and SC-F as NOT
        APPLICABLE with no substitute figure offered. The frozen Poisson(lambda
        = 256) prediction is carried unchanged, unadjusted and unscored. The red
        team returned joint R3 `not_applicable` with the reason and checked
        anyway that no applied H1 label (validated / confirmed / refuted /
        falsified) appears anywhere in the hypothesis, the idea record, the gate
