  strength: replicated
  strength_note: >-
    `replicated` in the strict sense this program means by it, and the word is
    load-bearing, so here is exactly what is and is not covered by it.
    REPLICATED - every headline integer of the two runs was recomputed
    independently, from scratch, by TWO reviewers in separate sessions using
    implementations that share no code with harness/run_md4_ceiling_v2.py and no
    code with each other. The validator wrote an explicit named-register A/B/C/D
    implementation from RFC 1320 sec 3.4 and RFC 1321 sec 3.4 with the MD5
