  obstruction:
    statement: >-
      A STATEMENT ABOUT THE OBJECT, NOT ABOUT THE ATTEMPT. In a splice-and-cut
      MITM whose per-side observables are windowed projections, the raw
      pre-certificate candidate set is the level set of a factorized match
      condition, so it is the CARTESIAN PRODUCT of the two per-side fibers over
      the matched value and its cardinality is the PRODUCT of the two fiber
      MULTIPLICITIES - not a sum of independent 2^-k coincidences. Joint two-way
      dependence, which is what a `distinct >= 2` gate certifies, bounds neither
      multiplicity. Consequently a gate criterion testing NON-CONSTANCY cannot
      bound the raw candidate count, and any expected-count arithmetic derived
      from a uniformity model over the free-word grid is unbounded above by the
      gate that is named as discharging it. For MD4's Round 1 specifically, at
      the tested slice the forward multiplicity is driven by a measured collapse
      of the forward observable's image inside the matching window that MD5 does
      not exhibit.
    quantity: >-
      The raw pre-certificate candidate count at the declared control scale, and
      its exact decomposition into (forward fiber multiplicity) x (backward
      fiber multiplicity) over the shared low-k target value; together with the
      per-side distinct-value counts of the two observables at 32-bit and at
      m = 12-bit resolution.
    value: >-
      AT fixed-word seed 20260821, target seed 8975323, k1 = k2 = 6, MD4,
      R1-SEP10 - raw pre-certificate candidate count = 8 candidates, against a
      declared ceiling of 4 and a modeled expectation of 1.00390625 candidates.
      ERROR BAR - ZERO, and the zero is earned rather than assumed. The figure
      is an EXHAUSTIVE enumeration of the complete 2^(k1+k2) = 4096-pair space,
      not a sample, so it carries no sampling error; it was reproduced to the
      integer by three independent implementations. Decomposition - 8 = 4
      (forward fiber multiplicity over low-20 value 677474 = 0xa5662) x 2
      (backward multiplicity over the same value); 7 of the 8 fail the
      independent 16-step certificate and exactly 1 reproduces Y. Per-side
      distinct-value counts at the same point, all exact integers over exhaustive
      64-value sweeps - forward v6 33/64 at 32-bit and 6/64 at 12-bit; backward
      v6 24/64 and 24/64; backward v8 2/64 and 2/64. At the k1 = k2 = 4 gate
      scale - forward 9/16 and 4/16, backward [6,4,7,11] at both resolutions,
      against a pre-registered prediction of 16 for each. NEARBY-OBJECT CONTRAST
      at identical parameters - MD5 gives 16/16 and 16/16 forward, 16/16 at
      32-bit and [8,11,7,7] at 12-bit backward.
      NOT PART OF THE MEASURED VALUE, AND LABELLED SO IT IS NOT MISREAD - the
      distribution of the same quantity over 120 fixed-word seeds (median 32,
      max 928, 92 percent exceeding the ceiling, zero seeds at the modeled
      value, MD5 exceeding at 59 of 120) is REVIEWER-DERIVED in an uncontracted
      scratchpad computation with no run record, and is recorded in O-4 as scope
      evidence rather than as this obstruction's measured value. RC-1 is the
      contracted run that would make it one.
    measured_by:
      - RUN-MDFIVE-b5-gate_and_controls
      - RUN-MDFIVE-b5-buildcheck
      - EXP-MDFIVE-a8e71e
      - TASK-20260821-26ba34 (validator, independent from-scratch recomputation, byte-identical)
      - TASK-20260821-2de43d (red team, independent from-scratch recomputation and blind re-derivation, identical to the integer)
    scope: >-
      Claimed ONLY over - MD4 Round 1; construction R1-SEP10 (free words 2 and
      12, separation j - i = 10, split point S = 8, boundary component p = 3,
      m = 12, k = 20); fixed words from fixed_word_generation(20260821, (2,12),
      k); k1 = k2 in {4, 6}; target seeds 8975321/8975322/8975323/8975328;
      single-core unoptimized CPython 3.13.1 on macOS-26.6-arm64. NARROWER THAN
      ANY CLOSURE, DELIBERATELY - it is NOT claimed over other fixed-word seeds
      (the reviewer sweep shows 9 of 120 PASS the control), over other
      separations or components, over splice-and-cut MITM in general, over MD5
      (whose contrast runs the other way at 32-bit resolution and which still
      exceeds the ceiling at 59 of 120 seeds for a DIFFERENT reason), or over
      full 48-step MD4 or 64-step MD5. NO LANE IS CLOSED BY IT.
    resource_check:
      examined: true
      reading: >-
        EXAMINED, AND A RESOURCE IS FOUND - two of them, and one is immediately
        actionable. FIRST AND STRONGEST - the fiber-product identity is a
        PREDICTOR, not only an obstruction. Because the raw candidate count is
        the product of two per-side multiplicities, and because a gate already
        computes both per-side distinct-value counts at negligible cost, the
        count that CTL-PO5 discovers after the fact is DERIVABLE BEFORE ANY
        SEARCH RUNS from numbers the gate has in hand. That converts a
        post-hoc stopping rule into a pre-run design filter and gives the
        successor two cheap instruments - an injectivity criterion replacing
        `distinct >= 2` with `distinct >= (1 - eps) * 2^k` at both resolutions
        (RC-3), and a static per-F-application (y XOR z) mask check that
        predicts the collapse with no search at all and generalises to any
        MD4-family construction (RC-4). SECOND, AND WEAKER, BUT IT IS THIS
        GOAL'S OWN RESEARCH TARGET - the measured MD4-versus-MD5 asymmetry is a
        structural Round-1 divergence that is not a cost artifact and runs
        OPPOSITE to the naive expectation - MD4's F, by being a multiplexer,
        makes the attacker's matching filter LESS discriminating than MD5's,
        where the varying register enters outside F. Any theory of why the MITM
        preimage frontier moved for MD4 and not MD5 must take that sign
        seriously rather than assume MD4 is uniformly friendlier. It is recorded
        as a lead with its mechanism explicitly unsettled (O-5), not as a
        finding.
      spawned_ids: []
      spawned_ids_note: >-
        No IDEA-* or H-* record takes this measurement as its hypothesis yet,
        and this closing task may not author one - ledger/proposals/ and
        ledger/hypotheses/ are outside its write_scope. The successor is named
        concretely in GOAL-MD5-001.next_action and in the closing decision's
        next_actions - a batch-6 idea task whose phase 1 is RC-1 paired with
        RC-4, BEFORE any redesign. The reusable half of the reading is promoted
        now, as KN-TECH-c3d80e, so it is available to the five dependent goals
        without waiting for that batch.

