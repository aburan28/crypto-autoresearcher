    rolling-tuple implementation from RFC 1320's step table alone without
    opening either producer module. Both reproduce, byte-identically, the nine
    gate clauses, all three phases' distinct-value vectors, the fiber sets, the
    planted pair, the 8-member raw candidate set, its 4 x 2 fiber decomposition,
    the single certificate-verified pair, and the CTL-H1B counts. The red team
    reports the shared 20-bit value as 0xa5662 and the validator as 677474;
    those are the same integer, arrived at independently. THREE implementations
    agreeing to the integer is replication of a measurement, and it localises
    nothing to any one implementation.
    NOT REPLICATED, AND MUST NOT BE READ AS IF IT WERE - (i) the red team's
    120-fixed-word-seed distribution (O-4) is a single-source, uncontracted
    reviewer computation in a session scratchpad, explicitly declared by its
    author not to be a research run and to produce no run record; (ii) the
    red team's F-multiplexer mechanism for the forward collapse (O-5) is
    single-source and is one of TWO candidate mechanisms on record; (iii) the
    validator's k1 = 4..8 trend, the six-element image
    {98, 610, 1122, 1634, 2146, 3682} and its low-nine-bits-constant structure
    (O-5) are single-source; (iv) the validator's variance diagnostic (O-10) is
    single-source. Each is labelled at its point of use.
    WHAT "REPLICATED" WOULD HAVE MEANT AND WHY THIS IS NOT MORE THAN IT - a
    higher grade (`strong`, as EV-MDFIVE-ab007d carries) was available in
    batch 4 because ANOM-1's load-bearing fact was a PROVED algebraic
    independence, definitionally true of every correct implementation. The
    load-bearing fact here is different in kind. The taint calculus IS derived
    and IS now settled at that level (O-1), but the fact this record is built on
    - that the raw pre-certificate count is 8 rather than at most 4 - is a
    measured integer at ONE fixed-word seed, and the frozen contract explicitly
    declines to quantify over seeds. A measurement whose reviewer-sampled range
    is 2..928 under a mutation the contract treats as irrelevant does not earn
    `strong`. `replicated` is the honest grade and it is the grade the
    successor's RC-1 sweep must be run to improve.
