  proof_status: empirical_only
  proof_status_note: >-
    DECLARED. `empirical_only` for every measured PASS/FAIL, for every failing
    (j, k) set and for every reviewer probe outcome; `derivation` for nothing;
    `proved` for nothing. AN UNDECLARED BASIS WOULD BE THE FAILURE, NOT THE
    LACK OF A PROOF.
    ONE QUALIFICATION, RECORDED RATHER THAN GLOSSED. Two statements carried in
    this record are structural arguments about the committed checker text
    rather than measurements: the Validator's root cause that the pair (j, 0)
    can never fail for any input whatsoever, and the red team's OBJ-2 that both
    scored mutations were deducible to FAIL from the checker source before the
    card ran. Both are checkable by inspection of six lines of Python and both
    were reached independently. THIS RECORD DOES NOT UPGRADE ITS OWN
    proof_status ON THEIR ACCOUNT, because the quantities it reports are
    measured booleans; the arguments are carried as reviewer arguments, with
    their authorship named, and a successor that wishes to rely on them as
    derivations owes an archived derivation note.
    The refutation-artifact ordering rule of docs/claims-and-verification.md IS
    ENGAGED by this record in one direction only and is satisfied: the reading
    "CTRL-4 catches layout breaks" is refuted here, and the refutation artifact
    - two independently executed counterexample sets with positive controls,
    listed under proof_refs - EXISTS AND IS ARCHIVED IN THE SAME COMMIT AS THIS
    RECORD AND AS THE DECISION THAT RELIES ON IT. No `weaken`, no
    `reject_scoped` and no hypothesis-to-`rejected` transition is made anywhere
    in BATCH-016.
  proof_refs:
