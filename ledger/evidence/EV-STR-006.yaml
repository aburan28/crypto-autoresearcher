    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-016/reviews/TASK-20260730-039/falsification_review.md
  proof_refs_scope: >-
    THESE FOUR PATHS ARE CITED FOR EXACTLY ONE THING AND NOT FOR THIS RECORD'S
    DIRECTION. They carry the two reviewers' EXECUTED PROBE SETS, which
    establish by demonstration that the reading "CTRL-4 catches layout breaks
