  batch_id: BATCH-016
  goal_id: GOAL-ECDLP-001
  archived_by: TASK-20260730-040
  reviewed_by: coordinator
  recorded_at: '2026-07-30'
  recorded_at_precision: >-
    DATE ONLY. The session recording this evidence record has NO SHELL, no
    interpreter, no git and no clock access, and fabricates no wall-clock time,
    no commit identifier, no hash, no verdict and no measurement. EVERY commit
    identifier and EVERY sha256 below is TRANSCRIBED from the committed
    TASK-20260730-037 receipt or from an independent review report that states
    it verified the value against Git object content, and is labelled as
    transcribed rather than verified here. THIS SESSION MAKES NO COMMIT; the
    dispatching session commits this file and writes the ledger receipt.

  # --------------------------------------------------------------- what this is
  title: >-
    The PASS/FAIL behaviour of the CTRL-4 assertion - the checker code copied
    BYTE-VERBATIM from the committed BATCH-015 probe driver - on one unmutated
    baseline and four mutated inputs at B = 192 on CURVE-J12S1, together with
    two independent reviewers' unpre-registered probe classes characterising
    what that assertion does and does not test. A TOY-SCALE COMMITTED-CODE
    INSTRUMENT PROBE OF AN INSTRUMENT. NOT AN ATTACK, NOT AN ATTACK
    IMPROVEMENT, NOT A CRYPTANALYTIC RESULT, NOT A CLOSURE, AND NOT A TEST OF
    H-STR-002's MECHANISM.

  hypothesis_id: H-STR-002
  hypothesis_id_note: >-
    RECORDED FOR LANE PROVENANCE AND FOR NOTHING ELSE. THIS RECORD MOVES
    H-STR-002 IN NEITHER DIRECTION AND BEARS ON NO PREDICTION OF IT. H-STR-002
    STAYS `weakened` on DEC-20260727-009's grounds, which are untouched here,
    and ledger/hypotheses/H-STR-002.yaml is NOT staged, NOT edited and NOT
    superseded by any card of BATCH-016. Queue rule N-1 binds this field. The
    batch measured whether a boolean assertion reports FAIL on deliberately
    broken lists of field elements; it measured no alpha, no phi_alpha, no
    displacement rank, no misalignment set, no rank deficiency, no supply
    count, no relation, no closure and no cost quantity.

  experiment_ids: []
  experiment_ids_reason: >-
    EMPTY, CORRECTLY, AND THE ABSENCE IS DECLARED RATHER THAN SILENTLY OMITTED.
    NO EXPERIMENT IS APPROVED IN THIS LANE. EXP-STR-004 IS NOT APPROVED AND WAS
    NOT EXECUTED BY BATCH-016; its NOT APPROVED determination stands from
    DEC-20260729-004 and is carried, not reopened. The frozen CTRL-4 assertion
    text at experiments/EXP-STR-004/specification.yaml was READ as the
    definition of the object under test and for nothing else; naming
    EXP-STR-004 in this field would assert an execution that did not happen.

  run_ids: []
  run_ids_reason: >-
    EMPTY, AND THIS IS A DISCLOSED WEAKNESS NAMED AS ONE RATHER THAN ROUTED
    AROUND (INT-BATCH016-F, pre-registered in the BATCH-016 opening commit
    BEFORE the mutation card existed). The card is NOT an experiment run: it
    minted no run identifier, wrote nothing under experiments/, and was not
