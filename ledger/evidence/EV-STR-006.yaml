    RESURRECTED AND IS NOT CITED AS EXISTING BY THIS RECORD.
  run_ids_independently_confirmed: >-
    The TASK-20260730-038 validator reports, from an AST walk of the committed
    mutation_driver.py blob, that the string "RUN-" does not occur in the file
    at all, that harness.runner.write_run is not called, and that the only
    write targets are three files under the mutation directory. The
    TASK-20260730-039 red team separately reports the same absence and reports
    that no path under experiments/ was touched by the snapshot commit.

  type: empirical
  direction: neutral

  direction_justification: >-
    NEUTRAL, AND THE REASON IS NOT DIPLOMACY. The record bears on no prediction
    of H-STR-002 and on no hypothesis in this ledger. It reports deterministic
    PASS/FAIL behaviour of six lines of committed Python on deliberately
    constructed lists of integers modulo 2293. `supports` and `weakens` would
    both assert a bearing on a hypothesis that no measurement here licenses;
    `contradicts` would assert a negative mathematical result where what was
    measured is a property of an instrument. THE BATCH TESTED AN INSTRUMENT,
    NOT THE OBJECT, AND `neutral` IS WHAT THAT MEANS IN THIS FIELD.

  strength: preliminary

  strength_justification: >-
    `preliminary` AND NOT HIGHER, AND NOT LOWER, ON GROUNDS STATED RATHER THAN
    LEFT TO BE INFERRED.
    WHY NOT `anecdotal`, WHICH WOULD UNDERSTATE IT. The verbatim-copy
    precondition on which the whole batch rests was confirmed THREE TIMES
    INDEPENDENTLY - by the Executor's runtime byte-comparison, by the
    dispatching session's recomputation of the region digest from git object
    content, and by the Validator's own extraction of the region from the Git
    blob and slicing of the committed copy by its marker comments - all three
    yielding 89ecfa9ac1a6705c83deacb0ee03e75818b93575d3ca97bac28ddf301c1fc3b0,
    1444 bytes, 26 lines, ZERO characters changed. All seven artifact hashes
    were re-derived from git object content by two independent computations.
    The Validator re-executed all five cases in a SEPARATE PROCESS from a
    script it wrote from the queue specification alone, without importing the
    producer's driver, and reproduced every condition-(i), condition-(ii) and
    joint verdict, both failing (j, k) SETS with member identity and offending
    values field by field, and all five factor-base digests. AND THE CENTRAL
    CHARACTERISATION OF THE ASSERTION WAS ESTABLISHED BY TWO INDEPENDENT
    SESSIONS, EACH BY EXECUTABLE PROBE AND EACH CARRYING ITS OWN POSITIVE
    CONTROL confirming that its probe scaffolding does report FAIL on a
    genuinely broken within-block ratio. That is materially stronger than
    BATCH-015, where a single unreplicated mutation carried the corresponding
    finding.
    WHY NOT `replicated`, WHICH IS EXPRESSLY REFUSED. Reproducing a
    DETERMINISTIC function on the SAME HOST against the SAME COMMITTED BYTES is
    not replication in this ledger's sense. There is ONE instance
    (CURVE-J12S1), ONE B (192, with a single red-team diagnostic at 193 that is
    outside this record's scope), ONE host, ONE software stack, ONE realisation
    per case plus a same-process determinism repeat and one cross-process
    re-execution. No second curve, no second seed, no second machine, no second
    implementation of the instrument - and the instrument IS the object of
    measurement, so an instrument-level bug would be invisible to every session
    that touched it. A deterministic function reproduces a wrong answer exactly
    as faithfully as a right one.
    AND ONE FURTHER GROUND, WHICH IS THE HONEST ONE. The single quantity this
    batch pre-registered as scoreable - the consequence flag - carried no new
    information (see O-9). The genuinely new content is two measured FAILs and
    a characterisation established by UNPRE-REGISTERED reviewer probes. Probes
    that are not pre-registered are not scored against any expectation and are
    recorded as what they are.

  claim_tier: toy
  claim_tier_note: >-
    TOY AND NOTHING ABOVE IT. p = 2293, a 12-bit prime; n = 733; B = 192 and
    ONLY B = 192 within this record's scope. This is orders of magnitude below
    any standardized parameter size. NOTHING HERE EXTENDS TO B != 192, TO
    field_bits > 12, TO j != 0 CURVES, TO GENERIC CURVES, TO ARITY m > 3, OR TO
    MEDIUM OR CRYPTOGRAPHIC SCALE. A SNAPSHOT COMMIT MAKES WORK DURABLE; IT
    DOES NOT UPGRADE THE STRENGTH OR THE SCOPE OF EVIDENCE, AND A PASSING
    VALIDATOR IS NOT A CRYPTANALYTIC IMPROVEMENT. Under
    docs/target-result-profile.md rule A1 nothing here is target-class, and
    this field says so rather than leaving it to be inferred.

