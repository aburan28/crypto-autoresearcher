    - id: O-instrument-defect
      label: derived
      text: >-
        In run.py, contains_one() at lines 202-212 replaces every generator
        and every product by its truncation {mask : popcount(mask) <= D}.
        Truncation is not an ideal consequence. A sound degree-D closure
        admits m*f only when deg(m*f) <= D and never drops monomials.
        (a) Unsound: for the satisfiable equation x0*x1 + 1 = 0 (encoding
        [{3, 0}], satisfied by assignment 3), the degree-1 truncation is {0},
        so contains_one([{3, 0}], 1) returns True. (b) Target-blind: the
        first polynomial S_3(u, x1, x2) has a constant term 1 (coefficient
        bit 0), bit-monomials of popcount 2 (squared part; cross terms of
        sym_mul(quad, quad) cancel in pairs) and 3 (cubic), and no
        popcount-1 terms. So its coordinate-0 equation truncates to {0} at
        D = 1, and contains_one(build_system(t), 1) is True for every t in
        1..31. The recorded refutation_degree = 1 is therefore independent
        of the selected system.
    - id: O-controls-gap
      label: derived
      text: >-
        The planted controls (unit {1}, linear {x0}, empty system, and the
        sound_ok check on the selected unsatisfiable system) contain no
        satisfiable equation with a monomial above the degree cap, so
        truncation passes all of them. sound_ok cannot fire, because the
        selected system is unsatisfiable by construction.

