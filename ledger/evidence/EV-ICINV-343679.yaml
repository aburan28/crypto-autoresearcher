  type: empirical
  direction: neutral
  direction_note: >-
    H-ICINV-d5e351 is explicitly decidable in either direction by its own
    design ("H1 asserts that this comparison is DECISIVE IN BOTH DIRECTIONS
    ... It does NOT assert which way the comparison falls"), so this record
    does not read as a simple supports/weakens against a single-direction
    claim. What the evidence establishes is family-by-family, against H1's own
    falsification apparatus:

    For F2 (Betti table), F2b (regularity), F3 (singular locus), and F4
    (elimination polynomial DEGREE): class-constant AND control-constant at
    the identical single value (verdict.json / execution_report.md section 3).
    This is H1's own F2 falsification branch verbatim ("All four invariant
    families are constant across all 138 curves AND the random-curve control
    set exhibits the SAME single values. Then the constancy is a property of
    S_3's shape, not of the isogeny class, and no closure of the d_reg axis is
    licensed"). For these four functionals specifically, the branch fires: no
    closure is licensed and no class-invariance finding is supported by them
    -- a scoped negative on THESE FOUR FUNCTIONALS, not a positive
    isogeny-class-invariance result.

    For F1 (S3 monomial support): class-constant (13 on all 138) while the
    control set is NOT constant (2 distinct values, {10:1, 13:137}) -- the
    pattern of H1's F3 branch ("constant across the class WHILE the control
    set exhibits several distinct values ... the d_reg axis is closed for
    these functionals ... with a named obstruction"). This pattern is real and
    independently confirmed (V1/V3), but H1's own mechanism STEP 1 already
    DERIVES this constancy analytically from T4 (D_0=-59 forces a_i != 0 !=
    b_i on every class member, which alone pins the support at 13) -- it is
    stated in H-ICINV-d5e351 as a pre-registered PREDICTION whose failure
    would be an implementation defect, not a discovery. Confirming a derived
    consequence is not a new finding about isogeny-class structure; it is a
    correctness check that passed.

    For F4b (elimination F_p-factorisation type): apparent class variation
    (66/72 split) matching the surface pattern of H1's F4 branch ("at least
    one explicitly exhibited pair of curves in the class differs ... surviving
    the gauge recheck and the second-backend cross-check"), WITHDRAWN. Both
    the Validator and the Red Team independently re-derived, from the raw
    per-curve JSON and not from prose, that elimination.polynomial equals
    x3^3+a*x3+b VERBATIM on every one of 276 sampled curves (class + control)
    -- not a derived object of the f_V-free Jacobian-ideal elimination in any
    nontrivial sense, but the curve's own Weierstrass right-hand side -- and
    that factorisation_type corresponds to the pre-existing, already-committed
    two_torsion_x_count covariate (harness/exp_icinv.py:164-169, committed
    2026-08-07, three days before this contract) with ZERO exceptions across
    all 138 class curves: (1,1,1) <-> ttc=3 (66/66), (1,2) <-> ttc=1 (72/72),
    and, on the control, (3,) <-> ttc=0 (49/49). harness/exp_icinv.py's own
    docstring already states this quantity "is NOT an isogeny-class
    invariant". F4b therefore carries zero information beyond a quantity the
    campaign already had and already knew not to trust for this purpose. It
    is withdrawn as a NEW isogeny-class finding -- not because the 66/72 split
    is wrong (it is exact and independently reproduced three ways), but
    because the elaborate Groebner/elimination pipeline that produced it
    (Sage/Singular/msolve, ~270s per full run) reproduces, exactly, a fact
    already computable in milliseconds by the pre-existing harness with no
    Semaev polynomial, no ideal, and no Groebner basis at all. This is a
    genuine and useful NEGATIVE result about WHICH ROUTE measures this
    quantity, not a failure of the experiment: the expensive route is proven
    unnecessary for this specific measurement.

    Net: no functional that survives scrutiny shows within-class variance
    exceeding its matched null (the withdrawn F4b family was the only
    candidate), and none of the five genuinely-new-computation families
    (F1-F4) supports a class-invariance closure either, because for the four
    that matter (F2/F2b/F3/F4) the control is equally constant. `neutral` is
    the honest label: this record neither supports nor weakens H1 as a
    directional claim; it discriminates among H1's own pre-declared branches
    and, for the one branch that looked decisive on its face (F4b), withdraws
    it on independently-verified mechanistic grounds.

  strength: preliminary
  strength_note: >-
    NOT `replicated` or `strong`, for four independent reasons stated
    explicitly rather than left implicit. (1) SCOPE: one certified-complete
    ordinary isogeny class at one prime (p=4001, t=30, D_0=-59) -- a single
    deterministic, exhaustive computation over 138 curves, not a statistically
    replicated measurement across independent draws or seeds; no cross-class
    or cross-prime replication exists yet (Red Team's A6 second next step
    names exactly this as the cheapest way to test whether the class-wide
    absence of the (3,) factorisation type at this D_0 is CM-theoretic or a
    138-curve sample artifact -- unresolved). (2) C-CENSUS GAP: the 138-member
    class enumeration itself was NOT independently re-derived by either
    reviewer -- explicitly recorded UNCHECKED by the Validator ("Not
    independently re-enumerated by this Validator ... out of this review's
    scope"), not passed by assumption. This Coordinator's own pre-check of
    class-census.json's internal agreement fields (count, member set, Hurwitz-
    Kronecker mass formula) is the only basis for trusting the census, and
    that is an internal-consistency check, not an independent re-enumeration.
    (3) D-3 GAP: the true per-curve 2-volcano level remains `not_computed`
    throughout -- only the class-wide level histogram exists, not a per-curve
    assignment -- so the association between F4b/two_torsion_x_count and
    actual volcano structure (H1's own P6 prediction) is UNTESTED, and Red
    Team's A6 first next step names the cheap Velu construction that would
    close it. (4) REVIEW-INDEPENDENCE LIMIT: both the Validator
    (VAL-20260810-ad7360) and the Red Team (RT-20260810-2ee0af) resolved, per
    their own inference blocks, to models on the SAME Anthropic backend as the
    reviewed run (RUN-ICINV-geom-m3-v2's D-1 disclosure: claude-opus-5) and as
    this Coordinator's own session; "independent" here means independent
    session, context, and a fresh from-scratch reading -- not independent
    judgement from a different model family. The Validator additionally could
    not confirm its own policy resolution (`review-adversarial` should
    resolve to opus-5/xhigh; this session self-declared claude-sonnet-5, so
    `model_verified: false`), recorded transparently rather than silently
    treated as satisfied. Set against these four caps: the raw NUMBER
    reproduction itself is very solid -- the Validator wrote independent,
    from-scratch code against the frozen mathematical specification (not by
    reading harness/exp_icinv_geometry.py) and reproduced every headline
    number exactly, including a full 138+138-curve recomputation of the class
    and control multisets from the raw per-curve arrays, and the Red Team
    independently re-derived the F4b/two_torsion_x_count identity
    programmatically across all 276 sampled curves. That gives high confidence
    the reported NUMBERS are correct; it does not by itself establish that the
    result generalizes beyond this one class, prime, and arity, which is what
    caps this record at `preliminary` rather than `replicated`.

  claim_tier: toy
  claim_tier_note: >-
    p=4001, one isogeny class, 138 curves, arities {3,4}. No ECDLP claim in
    either direction, in this record or in any cited artifact. sota_delta 0.

  certificate_refs: []
  certificate_note: >-
    NONE REQUIRED AND NONE CLAIMED. No isogeny is evaluated, no attack is
    mounted, no discrete-log solve or factor-base relation is asserted. Under
    docs/claims-and-verification.md, this experiment's claim tier requires no
    solution certificate.

  proof_status: derivation
  proof_refs:
    - coordination/goals/GOAL-ENDO-001/batches/BATCH-d7e255/reviews/red-team/red_team_report.md
    - coordination/goals/GOAL-ENDO-001/batches/BATCH-d7e255/reviews/validator/validation_report.yaml
    - harness/exp_icinv.py
  proof_status_note: >-
    DECLARED, NOT DEFAULTED. The withdrawal of F4b as a novel finding rests on
    an exact algebraic DERIVATION independently checked by two reviewers, not
    on a statistical correlation: elimination.polynomial is verbatim equal to
    x3^3+a*x3+b (the curve's own Weierstrass right-hand side) on 276/276
    sampled curves, and factorisation_type corresponds to
    two_torsion_x_count with zero exceptions on all 138 class members. The
    five class-invariant families (F1-F4) are `empirical_only` in the ordinary
    sense -- exact exhaustive computation on the certified class, not a
    theorem about the class -- and no adverse hypothesis-status transition is
    made by this record (decision: refine, not weaken or reject_scoped), so
    the refutation-artifact obligation for an adverse call does not bind here;
    `proof_status: derivation` is recorded for the one component (F4b) where a
    derivation-grade basis genuinely exists and was checked, per
    docs/claims-and-verification.md, "Refutation artifacts".

  observations:
    - >-
      OBS-1. F1-F4 (S3 monomial support, graded Betti table, regularity of
      S/J, affine singular locus dimension/degree, elimination polynomial
      DEGREE) are each single-valued across all 138 class members
      (RUN-ICINV-geom-m3-v2/verdict.json, per-curve-invariants.json), computed
      by genuinely new exact symbolic machinery (Sage/Singular minimal free
      resolutions and elimination ideals over the f_V-free Jacobian ideal --
      not a restatement of any prior instrument). Every value gauge-invariant
      under (a,b) -> (u^4 a, u^6 b) (C-GAUGE, independently re-verified on 2
      curves by the Validator with self-chosen u), order-independent under
      degrevlex vs deglex (C-ORDER, independently re-verified), and cross-
      backend confirmed against msolve for dimension/degree/points and an
      independent Koszul-homology route for the Betti table (C-BACKEND).
    - >-
      OBS-2. Of these, F2/F2b/F3/F4 are ALSO constant on the 138-curve control
      set at the IDENTICAL single value (Betti table one table both sets;
      regularity {5:138} both; singular locus {(0,6):138} both; elimination
      degree {3:138} both) -- H1's own F2 falsification branch, meaning the
      constancy is explained by S_3's shape and not by isogeny-class
      membership, for these four functionals specifically.
    - >-
      OBS-3. F1 (S3 support) is constant on the class ({13:138}) but the
      control shows 2 distinct values ({10:1, 13:137}, outlier at (a,b)=(9,0),
      j=1728, which lies outside the target class by construction since
      D_0=-59 forces j != 0, 1728 -- but is unrestricted in the control draw).
      This is the pattern of H1's F3 branch, but the constancy is a
      PRE-REGISTERED, ANALYTICALLY DERIVED prediction (H-ICINV-d5e351 mechanism
      STEP 1, from T4), stated in the hypothesis as a correctness gate whose
      failure would be an implementation defect -- not a discovery, and
      confirming it is a passed correctness check, not new evidence of
      isogeny-class structure.
    - >-
      OBS-4. F4b (elimination F_p-factorisation type) takes two values on the
      class ({(1,1,1):66, (1,2):72}) and three on the control
      ({(1,1,1):21, (1,2):68, (3,):49}) -- more distinct values on the
      BETWEEN-class control than WITHIN the class under test, the opposite of
      the pattern a genuinely class-specific signal should show (Red Team A1,
      first objection). Independently and decisively, elimination.polynomial
      is verbatim x3^3+a*x3+b on 276/276 sampled curves and
      factorisation_type corresponds to two_torsion_x_count with zero
      exceptions on all 138 class curves (Red Team A1, extended finding;
      Validator's own full-population 138+138 recomputation of the same
      multisets, agreeing exactly). F4b is WITHDRAWN as a novel isogeny-class
      finding on this evidence: it is the classical F_p-factorisation type of
      the curve's rational 2-torsion structure, a quantity
      harness/exp_icinv.py already computes and whose docstring already
      documents as NOT an isogeny-class invariant. The control's higher
      diversity is explained by the classical Chebotarev/Galois density for a
      generic monic cubic over F_p with Galois group S_3 (identity 1/6,
      transposition 1/2, 3-cycle 1/3 -- matching the control's observed
      {21,68,49} closely); the class's restriction to two of the three types,
      with the irreducible type at EXACTLY ZERO occurrences (0/138 vs an
      expected ~46 under the generic rate), is real and exact but is
      classical CM/2-isogeny arithmetic about how the prime 2 interacts with
      D_0=-59, not a Semaev-variety-geometry discovery -- and the Red Team
      explicitly flags the CM-theoretic mechanism as UNCHECKED, not asserted
      (D_0=-59 mod 8 = 5, suggestive of 2 being inert in the maximal order,
      not derived from CM theory here).
    - >-
      OBS-5. koszul_all_regular_sequence_on_class: false, independently
      confirmed on 2 curves by the Validator via a colon-ideal (zero-divisor)
      test distinct from the harness's own codimension-vs-generator-count
      shortcut. F2/F2b's constancy is therefore not an automatic Koszul-
      degeneration artifact.
    - >-
      OBS-6. D-4 (RUN-ICINV-geom-m3's superseded cross-check predicate)
      independently confirmed BENIGN by both reviewers: the defect was
      confined to one derived agreement flag (comparing the elimination
      polynomial's degree-1-factor count against msolve's rational-point count
      -- two different quantities), fired on exactly 14 of 30 subsample
      curves as claimed, and every primary invariant (s3_support, betti,
      regularity, singular_locus_affine dimension/degree, elimination degree
      AND factorisation type) is byte-identical across all 138 curves between
      RUN-ICINV-geom-m3 and RUN-ICINV-geom-m3-v2 -- confirmed by direct diff
      by both the Validator and the Red Team independently, not accepted on
      the execution report's word.
    - >-
      OBS-7 (m=4 secondary, arities.secondary_scope only). S_4 monomial
      support takes 2 values on both class ({391:1, 439:137}) and control
      ({225:1, 439:137}); S_4 affine singular locus (dim,degree) is single-
      valued on both ({(2,39):138}). Betti table and regularity at m=4 are
      `not_computed`, a budget statement under AGENTS.md rule 5, structurally
      confirmed by the Validator to be genuinely absent computation (no Betti-
      table call exists on the m=4 code path) rather than a suppressed or
      fabricated value. No verdict step applies at m=4 (H1's decisive
      comparison is defined for the m=3 primary families only); reported here
      as a raw distinct-value census, not a class-invariance finding either
      way.
    - >-
      OBS-8. No p-value, permutation test, null-object test, or dispersion
      statistic appears anywhere in the reviewed artifacts (grepped clean by
      the Executor, confirmed applicable-not-applicable by the Validator: this
      experiment computes exact symbolic invariants, not a sampled
      distribution, so no heuristic_validation applies).

  inference: >-
    C2 (GOAL-ENDO-001's gating completion criterion for RQ-ICINV-475b5e) IS
    NOT DISCHARGED BY THIS EVIDENCE. Neither branch of C2 is met: no attack-
    cost functional's within-class variance is shown to exceed a matched null
    with the T5 reachability gate addressed (F4b, the only candidate the
    experiment produced, is withdrawn on independent mechanistic grounds), and
    no scoped negative closing the isogeny-class-invariance question for the
    whole lane is recorded either -- only four specific functionals
    (Betti table, regularity, singular locus, elimination degree) are shown to
    carry no isogeny-class-specific information (they are equally constant on
    a matched control of curves outside the class), which is a narrower,
    scoped statement about those four functionals at this one class and prime,
    not a closure of RQ-ICINV-475b5e as a whole. Other functionals, other
    arities beyond m=4's secondary scope, other primes, and other conductors
    remain untested. This record therefore ADVANCES understanding of lane L1
    without moving H-ICINV-d5e351's status and without discharging C2 -- the
    disposition this evidence supports is `refine`, not `support`,
    `weaken`, or `reject_scoped`.

  boundaries:
    - >-
      Curve family and field: ordinary short-Weierstrass y^2=x^3+ax+b over the
      PRIME field F_4001 only. One isogeny class: t=30, D=-15104=-59*16^2
      (D_0=-59, conductor f=16), 138 members, Hurwitz-Kronecker-certified
      complete (internal consistency confirmed by this Coordinator; NOT
      independently re-enumerated by either reviewer -- C-CENSUS gap).
    - >-
      Object measured: the f_V-free Jacobian ideal I_m = <S_m, partial
      derivatives of S_m> of the Semaev summation polynomial S_m, homogenised
      with a new variable x0 under the standard grading, degrevlex primary
      monomial order. This is EXPLICITLY NOT the ideal the deployed
      index-calculus formulation solves (that ideal also contains the factor-
      base membership polynomials f_V, which the campaign's own committed
      evidence shows dominates the solving-degree proxy at a 23-31% support
      change moving the Groebner time by under 1%). Nothing here transfers to
      Groebner solving time, first-fall degree, or relation-collection cost in
      the deployed formulation.
    - >-
      Arities: m=3 required and primary (all six families); m=4 secondary,
      monomial support and affine singular locus only, Betti table and
      regularity `not_computed` by declared budget.
    - >-
      Solver and implementation: SageMath 10.9 driving Singular (libsingular)
      4.4.1 as backend A; msolve 0.9.5 as independent third-party backend B;
      a SymPy 1.14.0 Koszul-homology Tor computation as backend C (no second
      off-the-shelf resolution engine exists on the host besides Sage/
      Singular -- D-2, independently confirmed by host probe by the Validator).
    - >-
      Control set: 138 random ordinary curves at p=4001 drawn from 100 traces
      other than t=30 (excluding t=0, supersingular), same pipeline, same
      grading, same monomial order, seed 20260810 -- construction
      independently confirmed matching specification.yaml verbatim by the
      Validator (V3).
    - >-
      Resource budget: total wall clock across all six runs ~3745s against a
      21600s cap; peak RSS <=1.4GB against an 8GB cap; six runs against a
      maximum_runs:8 budget (the abandoned RUN-ICINV-geom-m4-v2 not counted in
      the budget sense, no manifest ever written). Executed_runs for THIS
      review task: 0 (validator and red team ran independent verification
      computations only, not EXPERIMENT runs).
    - >-
      THE LARGEST CLAIM JUSTIFIED BY THE DATA: over the tested 138-curve class
      at p=4001, t=30, under the declared f_V-free ideal, grading, and
      monomial order, five exact geometric invariants of the m=3 Semaev-
      variety Jacobian ideal (S3 monomial support, graded Betti table,
      regularity, affine singular-locus dimension/degree, elimination
      polynomial degree) are class-constant and not explained by a Koszul
      degeneration; four of these five are equally constant on a matched,
      size-equal control set of curves outside the class, so their constancy
      is attributable to the shape of S_3 rather than to isogeny-class
      membership specifically, for this class and prime. A sixth quantity,
      elimination F_p-factorisation type, is exactly and independently shown
      to carry no information beyond the pre-existing, already-known-
      non-invariant `two_torsion_x_count` covariate. This establishes
      behaviour only for the tested class, prime, arity range, and ideal
      definition; it does not establish that any other class, prime, or the
      f_V-bearing (deployed) formulation behaves so, and no cost, speedup, or
      ECDLP-relevant conclusion is licensed by it in either direction.

  unresolved_confounds:
    - >-
      CONFOUND-1 (C-CENSUS). The 138-member class enumeration was not
      independently re-derived by any reviewer; only its internal-consistency
      fields (count, member set, Hurwitz-Kronecker mass formula) were checked
      by this Coordinator against the previously-committed reference. Recorded
      UNCHECKED by the Validator explicitly, not passed by assumption.
    - >-
      CONFOUND-2 (D-3). True per-curve 2-volcano level remains `not_computed`;
      only the class-wide level histogram exists. Whether F4b/
      two_torsion_x_count's 66/72 split (or the missing (3,) type) tracks true
      volcano level, versus being a re-encoding of it, or being independent of
      it, cannot be determined from this record. Red Team A6 names the cheap
      (Velu, already-certified census) construction that would close this.
    - >-
      CONFOUND-3 (REVIEW INDEPENDENCE). Both the Validator and the Red Team
      resolved to models on the same Anthropic backend as the reviewed run and
      as this Coordinator's own session (CLAUDE.md's structural "model:
      inherit" limitation, standing and harness-wide, not a per-task
      discretionary substitution). "Independent" throughout this record means
      independent session, context, and a from-scratch reading of committed
      artifacts -- not independent judgement from a materially different model
      family. The Validator additionally could not confirm its own policy
      resolution (review-adversarial should resolve to opus-5/xhigh; this
      session self-declared claude-sonnet-5), recorded as `model_verified:
      false` rather than silently treated as satisfied.
    - >-
      CONFOUND-4. Whether the class-wide absence of the irreducible-cubic
      factorisation type at D_0=-59 is CM-theoretic (2 inert in the maximal
      order) or a sample artifact of this one 138-curve draw is explicitly
      UNCHECKED by the Red Team, who flagged it as suggestive but not derived
      from CM theory, and named the cheap cross-class replication (2-3 more
      classes with different D_0 2-splitting behaviour) that would settle it.
    - >-
      CONFOUND-5. The standalone Singular binary found on the review host
      could not be proven byte-identical to backend A's linked libsingular
      from outside (no binary diff performed); version-string match, location
      inside the Sage tree, and absence of any other install SUPPORT but do
      not PROVE the "not independent" classification used for D-2's C-BACKEND
      accounting on the Betti family specifically.
    - >-
      CONFOUND-6. C-BACKEND's Betti-table cross-check on the full 30-curve
      subsample was read from backend-crosscheck.json and spot-verified by an
      independent method (colon-ideal test) for only 2 of the 30 curves, not
      by re-running the full Koszul-homology computation on all 30
      independently.
    - >-
      CONFOUND-7 (provenance, detailed in CORR-20260810-676b0d). Two of three
      harness/exp_icinv_geometry.py source versions used across the five
      completed runs -- including the version behind the PRIMARY m=3 result,
      RUN-ICINV-geom-m3-v2 -- are not git-recoverable, only hash-pinned. This
      does not affect any reported number (independently re-derived from raw
      data by two reviewers using code written fresh from the frozen
      specification, not by trusting any version of the harness), but bears on
      literal third-party reproducibility of the primary run today.

  validity_determination: >-
    VALID FOR THE SCOPE STATED. Six run directories match the reported tally
    (4 completed_valid usable: gates, m3 [superseded but valid and confirmed
    benign], m3-v2 [primary], m4-v3 [primary secondary]; 1
    failed_infrastructure/completed_invalid, external OSError, excluded per
    AGENTS.md rule 5; 1 abandoned, no manifest, excluded). SR1 (support gate),
    SR2 (census gate), SR3 (backend gate, passed_with_recorded_limitation --
    D-2), SR4 (control-first), SR5 (frozen scope), SR7 (no outcome shopping)
    all fired or held as required in every run that reached them, independent
    of the Executor's own report: this Coordinator read verdict.json,
    per-curve-invariants.json, control-set-invariants.json, backend-
    crosscheck.json, koszul-indicator.json, gauge-recheck.json, and both
    manifest.yaml files for RUN-ICINV-geom-m3-v2 and RUN-ICINV-geom-m4-v3
    directly, per the handoff's independently_verified_by_this_coordinator_
    before_writing_anything section, and did not accept the execution report's
    numbers on its word alone. The Validator independently recomputed every
    headline number from a fresh Sage session using its own code transcribed
