  scope_statement: >-
    This record closes GOAL-SSI-001's stated next_action ("dispatch one
    bounded Executor run of EXP-SSI-9b542d... then independent Validator
    re-derivation of BCG-1/BCG-2 and RG-1..5 from the run's raw output, not
    from the specification's printed tables"). The Executor half (commit
    a21c1976b, RUN-SSI-9b542d-001) had already completed and self-reported
    "COMPLETED VALID... No interpretation. Ready for /review-evidence" with
    no independent review following it; this record supplies that review.
    It asserts ONLY that RUN-SSI-9b542d-001's mandatory gates independently
    re-derive to the same verdicts the run self-reported. It does not
    re-open, weigh, or resolve the four items GOAL-SSI-001's own record
    lists as "CORRECTIONS STILL OWED, QUEUED NOT MADE" (EV-WESO-001,
    EV-SSI-59f7a2, EXP-WESOVOW-001/cost_model.py, the NIST-III/V synthesis
    sentence) -- those remain open and untouched by this record.

  observations:
    - >-
      RG-1 THROUGH RG-5 INDEPENDENTLY RE-DERIVED, MATCH EXACTLY. The
      Validator recomputed T_A(256, log2_w=1000) from the raw T1 literals
      under all four laws from first principles (not from the spec's
      printed tables or crossover.py's self-reported flags): RG-1
      {L1:118.461337, L2:118.517922, L3:118.568995, L4:118.524756} inside
      [118.25,118.75]; RG-2 with S=3.0 inside [121.25,121.75]; RG-3 (A
      applied) inside [119.9,120.4]/[122.9,123.4]; RG-4's mixed-unit
      bracket [118.461337,123.153958] correctly disclosed; RG-5's full
      4-law x 2-S x 4-A grid at c=0 gives min gap 2.524114, max gap
      11.275629, span [6,11] -- all five PASS, all five agree with archive.
    - >-
      BCG-1/BCG-2 CONFIRMED GENUINE, NOT VACUOUS. The Validator made a
      deliberate adversarial attempt on BCG-2 specifically -- it is
      described in the specification as "this campaign's first control...
      independently confirmed capable of failing," so the review task was
      to try to break the PASS, not confirm it. The Validator hand-derived
      the superseded formula's residual symbolically (0.5*L_mem(P), not
      copied from the file) and spot-checked 36 raw
      tail_checks.bcg1_interpolated_check entries directly rather than
      trusting boundary_condition_gate.json's own summary field. Both
      PASS, both agree with archive; the control is real and did not fail
      here for a mathematically sound reason (the corrected formula's
      boundary identity, algebraically exact at w=L_mem(P)).
    - >-
      MONO-3'S NON-MONOTONICITY IS REAL AND ITS SHAPE IS NOW CHARACTERIZED,
      NOT JUST FLAGGED. Independently re-verified against this evidence
      record's own re-derivation (not merely against the Validator's
      report): p_star_log2 = 295.263566 at log2_w=80 and 370.685590 at
      log2_w=92.5 for L1/S=A=c=0/MC_P13_CORRECTED, pulled directly from
      p_star_table.json's main_grid and confirmed by direct substitution
      into the margin formula (residual ~8.7e-10 at the w=80 root). p*
      INCREASES as w increases across this interval -- the opposite of the
      pre-registered non-increasing direction -- with the reversal
      occurring exactly at w = L_mem(256) = 92.5, the point where the
      memory penalty term first saturates to zero for P=256. Confined to
      L1/L2 under MC_P13_CORRECTED; MC_VOW arms are NOT_EVALUABLE(n=0),
      correctly not silently passed as zero. Per the frozen specification,
      MONO-3 failure is a finding, not blocking (MONO-1/2/4/5 invalidate
      the run if they fail; they did not).
    - >-
      MONO-1, MONO-2, MONO-4, MONO-5 ALL PASS, INDEPENDENTLY CONFIRMED --
      WITH ONE STATED LIMITATION. MONO-2's kink locations (92.5/138.6 for
      P=256/384) match T2's L_mem values exactly by direct comparison.
      MONO-5's monotonicity of L_paper(P)-P/3 and L_mem(P)-P/3 was hand
      -verified from all five T2 rows. MONO-1 and MONO-4 were accepted on
      internal-consistency grounds (plausible magnitudes: MONO-1's max
      error ~1.4e-15, consistent with floating-point-scale measurement
      rather than a stub; MONO-4's 136.1-bit max difference, consistent
      with BCG-2's independently-confirmed magnitude at P=768) rather than
      full cell-by-cell reconstruction of their underlying grids, which
      the Validator explicitly flagged as a limitation rather than
      silently treating as complete.
    - >-
      INPUT PROVENANCE INDEPENDENTLY CONFIRMED BYTE-EXACT, BY A SECOND
      PARTY BEYOND THE VALIDATOR. This record's own review recomputed
      SHA-256 of all three declared input files directly with `sha256sum`
      and confirmed an exact match to input_hashes.json for
      cost_measurements.json, paper_fulltext.md, and cost_model.py --
      independent of and in addition to the Validator's own recomputation.
    - >-
      TWO NON-BLOCKING PROVENANCE DEFECTS FOUND AND RECORDED, NEITHER
      AFFECTING THE VERDICT. (1) manifest.yaml's git_commit
      (5266050b4b710f093d252a9cb479a658021e68bc) and
      execution_report.yaml's implementation_commit
      (f7944f98c2d881fe1ac28e8575b9fca4190d53da) disagree -- two different,
      both-real, both-reachable commits -- and both files self-report a
      dirty working tree at execution time. Independently re-confirmed in
      this record's own review (grep against both files, not taken on the
      Validator's word). The durable receipt is the clean Coordinator
      snapshot commit a21c1976b, reachable from HEAD and content-complete,
      so this does not put the archived result in doubt, but the run's OWN
      self-reported provenance fields are internally inconsistent and that
      is worth recording rather than silently accepting. (2) XCHK-2 is
      reported NOT_IMPLEMENTED despite numpy being present per
      environment.json (which per the spec should route to either running
      the Dickman-rho cross-check or the defined NOT_RUN+ImportError
      absence path) -- a real conformance gap, non-blocking per the frozen
      contract, undisclosed as a deviation by the archived run.

  inference: >-
    RUN-SSI-9b542d-001's "all mandatory gates PASS" self-report survives
    independent re-derivation from raw data: every check re-derivable from
    the raw JSON (RG-1..5, BCG-1, BCG-2, MONO-1/2/4/5, the cross-check, the
    null-object control) reproduces to matching precision, no single check
    disagreed with its archived verdict, and the one non-blocking finding
    (MONO-3) is confirmed real with its shape now characterized precisely
    rather than left as a bare flag. This closes the Validator half of
    GOAL-SSI-001's stated next_action.

  boundaries:
    - >-
      This record asserts NOTHING about SSI, SQIsign, or the supersingular
      isogeny problem beyond what EXP-SSI-9b542d's own scope_statement.json
      already claims (crossover locus behavior of the Wesolowski cost
      model, memory-infeasible at all tested NIST levels). It is a review
      of INTERNAL CONSISTENCY between the run's self-report and its raw
      output, not a fresh cryptanalytic measurement.
    - >-
      claim_tier: crypto is set because the run's own parameters
      (NIST-I/III/V, real T1/T2 literals) are crypto-scale, matching
      EXP-SSI-9b542d's own declared scale -- not because this record
      independently re-validates the underlying Wesolowski cost model's
      applicability to deployed SQIsign parameters, which is a separate,
      still-open question this record does not touch.

  unresolved_confounds:
    - >-
      tools/validate_ledger.py reports "evidence references unknown run
      'RUN-SSI-9b542d-001'" for this record. This is a PRE-EXISTING, known
      schema gap, not specific to this record: RUN-SSI-9b542d-001's
      manifest.yaml predates the `run: {id: ...}` wrapper the validator's
      check_run() expects (it is flat JSON with a top-level run_id field),
      so the validator never registers it under any id, regardless of who
      cites it. Confirmed by independently re-running validate_ledger.py on
      the merged tree with this record stashed out: 18 other evidence
      records already carry the identical "unknown run" error against
      other legacy-shaped manifests (EV-ECTD-8c098d, EV-ICI-0bdaaa,
      EV-IT-aefd12, EV-MLDSA-56e35b, and 14 more). This record's addition
      is the expected +1 against that pre-existing baseline (150 -> 151),
      not a new class of defect. Repairing the schema or the legacy
      manifest's shape is out of scope for this record.
    - >-
      MONO-1 and MONO-4 were not independently reconstructed cell-by-cell
      (grid size); acceptance rests on internal-consistency plausibility
      checks, stated explicitly rather than silently upgraded to full
      independent reconstruction.
    - >-
      The manifest.yaml / execution_report.yaml commit-identity
      inconsistency is unresolved as a provenance question -- which commit
      was actually live during execution is not determinable from the
      artifacts alone. It does not affect this record's verdict because the
      durable snapshot (a21c1976b) is clean and reachable, but a future
      reviewer should not assume the discrepancy has been explained, only
      that it has been recorded.

  reviewed_by: coordinator
