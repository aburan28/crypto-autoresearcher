evidence:
  id: EV-AES-4ba350
  hypothesis_id: null
  hypothesis_id_note: >-
    DELIBERATELY NULL. This record is a null-object/cipher-substitution
    measurement about the r=5 yoyo statistic's excess, the third substitute
    class in this comparison after BATCH-009's stored ideal-permutation
    table (EV-AES-e4c091) and BATCH-014's deterministic non-ideal Feistel
    PRP (EV-AES-dec938). RQ-AES-003 carries no hypothesis this record would
    bind to; naming one would manufacture a relationship this record does
    not have. Admitted under the documented-null allowance recorded in
    CORR-20260802-009, the same pattern used by EV-AES-e4c091,
    EV-AES-acddd0 and EV-AES-dec938.
  experiment_ids: []
  run_ids: []
  task_ids:
    - TASK-20260805-d408ac
    - TASK-20260805-237cad
    - TASK-20260805-849a4a
    - TASK-20260805-3f00cb
  type: measurement
  direction: corroborating
  strength: moderate
  strength_basis: >-
    MODERATE, matching the campaign precedent for clean single-instance
    null-object exclusions (EV-AES-e4c091 moderate, EV-AES-dec938 moderate).
    BATCH-015 ran the cipher-substitution comparison with the instrument the
    campaign designated decisive: an O(1)-memory-per-query construction that
    APPROXIMATES an ideal random permutation (16-round balanced Feistel,
    SipRound-based round function, fresh random 128-bit key drawn per
    trial), evaluated directly rather than stored -- reaching the decisive
    exposure (2^30 matched, where ~14 events are expected under BATCH-009's
    measured AES rate) plus 8x on the substitute (2^33), with no shortfall.
    The live AES arm reproduced BATCH-009's frozen P1-R5-PAIR reading
    byte-exactly (14 hits, identical hit-trial indices, thread seeds and
    plaintext-stream digests), so the comparison is anchored to the original
    measurement rather than a rerun approximation. The independent validator
    PASSED with zero decision-relevant disagreement: every count, p-value
    and CI blindly re-derived with validator-owned code, independence
    re-audited to a strictly stronger standard than the producer's own
    audit (reverse-direction checks extended to yoyo_sbox_v2/v3; RC-D
    constant search extended to murmur3's second constant and RC-D's
    key-schedule constants), the fresh-key-per-trial property confirmed by
    direct code read plus validator-owned key-stream digest re-derivation
    over ALL drawn keys at both exposures, and the construction's
    permutation behavior re-checked with an independent re-implementation.
    Strength stays moderate rather than strong because this is still one
    construction instance, one seed/armid/key, one probe geometry, one
    machine, and its closeness to ideal is a sound-but-labeled working
    assumption, not a proof.
  claim_tier: toy
  claim_tier_basis: >-
    Reduced-round (r=5) AES-shaped SPN probe geometry (amask=1, smask=1),
    one machine, one 16-round fresh-key Feistel construction, trials up to
    2^33. No crypto-scale, medium-scale, affected-scheme or asymptotic
    claim is made or implied, and no comparison to published cryptanalysis
    is made in either direction (RQ-AES-003 R3).
  certificate_refs: []
  proof_status: empirical_only
  proof_refs: []

  observations:
    - id: OBS-B15-1
      statement: >-
        THE SUBSTITUTE IS GENUINELY INDEPENDENT OF AES AND OF EVERY PRIOR
        CAMPAIGN INSTRUMENT, to a strictly stronger audit standard than the
        producer's own: zero AES vocabulary in the oracle/worker/gates zone
        (validator grep battery V-G1..V-G6, all validator-owned); zero
        shared vocabulary in either direction with yoyo_sbox_v2/v3/v4,
        perm128 (rc8probe_ideal.c BATCH-011/012) and RC-D
        (rc8probe_feistel.c BATCH-014), including murmur3's second constant
        and RC-D's key-schedule constants. Reused code is harness-only and
        disclosed (splitmix64, plaintext-draw loop, PW/CW geometry,
        bookkeeping digest formula). The round function is SipRound-based
        (add/rotl/xor only): no multiplication, no GF(2^8) arithmetic, no
        table lookup -- structurally distinct from AES's round function and
        from RC-D's multiply/xor-shift mix.
    - id: OBS-B15-2
      statement: >-
        THE FRESH-KEY-PER-TRIAL PROPERTY IS GENUINELY PRESENT -- the
        property that distinguishes this instrument from RC-D's verified
        fixed-key determinism and matches perm128's own per-trial-fresh-
        permutation semantics. Validator-confirmed by direct code read
        (per-trial (k0,k1) drawn from a dedicated per-thread key stream
        inside the trial loop; stack-local subkeys; no global key state in
        all 835 lines) and by validator-owned recomputation: key-stream
        seeds and first trial keys re-derived exactly; independent C
        re-implementation reproduced the order-sensitive key-stream digests
        over ALL drawn keys at 2^30 and 2^33; within-thread distinctness
        follows from splitmix64's single 2^64-cycle (odd-constant advance,
        bijective mix), cross-thread gap 2^62 >> the 2^33 window; exact
        sort-based duplicate check over 4,194,304 simulated keys found 0
        duplicates (disclosed caveat: empirical keycheck scale is below
        M2's actual draw; full-scale distinctness rests on the verified
        single-cycle argument).
    - id: OBS-B15-3
      statement: >-
        AT DECISIVE EXPOSURE THE r=5 EXCESS STAYS ABSENT UNDER THIS
        SUBSTITUTE. Matched comparison (both arms 2^30): AES 14 hits vs
        substitute 1 hit; exact conditional-binomial p = 0.0009765625
        (n=15, p0=1/2); rate ratio 14.0, CI [2.13, 592.0]; Garwood 95% CI
        on the substitute rate [0.0253, 5.572] contains the null 1.0 ->
        preregistered OUTCOME-A''. Exposure-weighted comparison (AES 2^30
        vs substitute 2^33, p0 = 1073741824/9663676415): AES 14 vs
        substitute 10 hits; p = 5.753e-8; R = 1.25, Garwood CI [0.599,
        2.299] contains 1 -> OUTCOME-A''. Under BATCH-009's measured AES
        rate the substitute would have read ~14 at 2^30 and ~112 at 2^33
        had it carried the excess; it read 1 and 10. OUTCOME-B'' was
        unreachable on these data (both CI lower bounds < 1), so no
        rule-ordering ambiguity exists. M1 and M2 share the disclosed
        prefix non-independence (OBS-B9-5 class) and were never pooled.
    - id: OBS-B15-4
      statement: >-
        THE LIVE AES ARM REPRODUCED BATCH-009'S FROZEN COMPARATOR
        BYTE-EXACTLY: W_ge1_nontrivial 14, identical whist, identical
        per-word counts, identical hit-trial index arrays, identical
        plaintext-stream digests (de8dee29c9310a13/01089d650f48ca1b),
        identical thread seeds; the AES key re-derives from the seed alone
        (validator-owned splitmix64 on 531001 ^ 0xA5A5A5A5A5A5A5A5 =
        bdf3823182ad657dab3d556b3886ba72). The comparison is therefore
        anchored to the original BATCH-009 measurement, verified
        field-by-field from the immutable source file
        (BATCH-009/tasks/TASK-20260803-a0a7b9/runs/P1-R5-PAIR.json), not
        to a re-approximation of it.
    - id: OBS-B15-5
      statement: >-
        THE STATISTICAL-QUALITY ARGUMENT IS SOUND AS A LABELED WORKING
        ASSUMPTION. Validator-verified crux: fresh per-trial keys mean each
        trial consumes exactly q=4 oracle queries against ONE permutation
        instance, so idealness bounds enter PER TRIAL and the arm-level
        quantity is a union bound over independent permutation draws, not a
        birthday accumulation. The producer's Patarin-type per-trial
        advantage of order q^4/2^{2n} = 2^-120 at q=4, n=64 leans on a
        citation marked provenance 'recalled' (never opened by any agent in
        this program -- a pointer, not support, per AGENTS.md rule 9); but
        under even the weakest standard Luby-Rackoff-type SPRP bound form
        (O(q^2/2^n), itself 'recalled' on the validator's side) the
        per-trial advantage is <= ~2^-60 and the union bound over 2^33
        trials <= ~2^-27 -- astronomically below the measurement's own
        Monte-Carlo noise. The conclusion (construction deviation
        unobservable at this exposure) does not hinge on the precise
        recalled degree. Round-function idealness is correctly disclosed as
        the standard working assumption, sanity-checked empirically
        (validator-owned re-implementation: 0 round-trip failures, 0
        collisions for distinct inputs, byte histogram consistent).
        Support-size caveat (2^128 keys vs (2^128)! permutations) is stated
        at the transcript level matching how perm128 served per
        EV-AES-e4c091 OBS-B9-2.
    - id: OBS-B15-6
      statement: >-
        O(1)-PER-QUERY MEMORY CONFIRMED EMPIRICALLY: measurement arms peaked
        at 1.5-2.0 MB RSS at 2^30 and 2^33 trials (the 259.5 MB peak is the
        selfcheck keycheck table, a separate validation instrument). This
        closes the architectural gap BATCH-012 proved permanent for
        perm128's pair-storage design (dom+rng alone 8.590 GB at 2^26):
        perm128's semantics are now reachable at decisive exposure without
        any stored table.
    - id: OBS-B15-7
      statement: >-
        COMPOSED READING ACROSS THE THREE SUBSTITUTE CLASSES (this record
        plus EV-AES-e4c091 and EV-AES-dec938): the r=5 excess does not
        survive substituting the whole cipher with (a) a stored ideal
        random permutation (2^25-2^26 exposure), (b) a deterministic
        non-ideal Feistel PRP (2^30/2^33), or (c) a fresh-key-per-trial
        ideal-APPROXIMATING O(1)-memory permutation (2^30/2^33, decisive).
        Combined with BATCH-b41ba9's identity/affine S-box arm (an affine
        cipher reproduces the excess at MAXIMAL rate, EV-AES-048545
        O-7/O-8), the evidence pattern is: the excess is carried by the SPN
        round geometry operating on AES's actual round content, not by the
        substitution function's nonlinearity and not by any property that
        survives replacing the whole cipher with a fresh random-like
        permutation. This is a scope statement about where the measured
        signal lives at toy tier, not a mechanism theorem.

  defects_carried:
    - id: D-B15-1
      statement: >-
        MINOR, no verdict impact (validator findings F1-F5): mislabeled
        'hit_trials_logged' field prints thread 0's count under a
        total-reading name (no decision-relevant number uses it); a
        cross-batch p-value convention mismatch (EV-AES-e4c091's published
        8x p is one-sided while this batch's preregistered 2x-min
        convention doubles it -- presentation inconsistency in the prior
        record, not an error here); M2 timing landed in .err via nested
        redirects (disclosed, corrected in budget stamps, validator-verified
        941.02 s / 1.45 MB from the .err file directly).

  boundaries:
    - >-
      Establishes absence of the r=5 excess on THIS ONE fresh-key-per-trial,
      O(1)-memory, ideal-approximating construction at 2^30 matched / 2^33
      substitute exposure, one seed/armid/key, one probe geometry, one
      machine.
    - >-
      Does NOT establish: absence for all ideal-approximating constructions;
      absence for other seeds, geometries or round counts; anything about
      full-round or deployed AES; any mechanism; any crypto-scale claim.
      Toy tier only; no comparison to published cryptanalysis in either
      direction.
    - >-
      The construction's closeness to ideal is a WORKING ASSUMPTION (sound
      per OBS-B15-5, robust to the exact recalled bound form, but not a
      proof); any Coordinator citing this result must carry that qualifier.

  unresolved_confounds:
    - >-
      Single construction instance: a class-level claim ("any
      ideal-approximating O(1)-memory substitute removes the excess") would
      need at least a second, differently-constructed instance -- the
      RC-D-extension follow-ons named in DEC-20260805-af8565 move in that
      direction on the adjacent (structured, non-ideal) class.
    - >-
      The external citations underpinning the concrete idealness bound
      (Luby-Rackoff 1988; Patarin; Aumasson-Bernstein SipHash 2012; Garwood
      1936) remain provenance 'recalled' -- pointers, not support. The
      conclusion's robustness to their exact form is argued in OBS-B15-5,
      but none has been opened and read by any agent in this program.

