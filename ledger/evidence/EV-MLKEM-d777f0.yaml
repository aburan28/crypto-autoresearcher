  id: EV-MLKEM-d777f0
  hypothesis_id: H-MLKEM-014
  goal_id: GOAL-MLKEM-004
  batch_id: BATCH-a2bb63
  authorized_by: DEC-20260803-4d4528
  recorded_by_task: TASK-20260804-53e6bd
  experiment_ids: []
  run_ids: []
  reproduced_baseline: true
  source_task_ids:
    - TASK-20260804-f58d34
    - TASK-20260804-264ab9
    - TASK-20260804-0ff29a
  snapshot_commit: 82bcbbe453ddc9f2a1e60b8d4c73fa905e21db6c
  type: measurement
  type_note: >-
    First measurement in this campaign of the quantity MATZOV.Nf's advantage law
    actually assumes -- across-candidate score dependence -- with both reviews
    independently ablating it.
  direction: mixed
  strength: moderate
  claim_tier: measurement_toy_scale
  certificate_refs:
    - "dual-membership certified from vectors.json ALONE by the validator with stock numpy: 0 of 959,745 violating, plus 150 exact-bigint rows"
  proof_status: empirical_only
  proof_refs: []

  headline_framing: >-
    The across-candidate departure is MOSTLY FORCED -- 66%, 71% and 92% of the
    deficit is reproduced by an object with no lattice, no sieve and no dual
    family -- and the reported factor of 2 becomes 1.10. A small
    object-specific residual of 4-9% survives every ablation either reviewer
    could construct, and is the only thing in five batches that has.

  scope_statement: >-
    One LWE instance at dimension 60 (m=35, n=25), q=127, one shared sieve
    database, candidate sets of K = 8/25/512, plus the Stage B FFT-bin design
    (m=35, k_enum=0, k_fft=10, p in {2,3,5}, beta_sieve=50, k_lat=15) at
    N = 4253. Toy scale.

  claim_tier_note: >-
    `measurement_toy_scale`. The certificate is checkable from the archived
    vectors.json alone -- the first batch in this campaign for which that is
    true.

  direction_note: >-
    `mixed`: the headline is refuted as stated, the mechanism is identified, and
    a small residual survives that neither reviewer could ablate away.

  strength_note: >-
    `moderate`: every number reproduced under two independent re-derivations of
    the closed form, but the surviving residual is unreplicated at n = 2 and its
    own comparator interval (0.450-0.504) does not resolve it against the real
    0.4149.

  what_is_established:
    - >-
      THE DEPARTURE IS MOSTLY FORCED. The validator ran the control the
      producer's own knowledge entry demands and it had not: replace X by
      matched-norm Gaussians AND Y by an iid resample of its own entries -- no
      lattice, no sieve, no dual family, same m/N/K/offset-scale. Percentage of
      the deficit forced: near-miss K=8 66%, near-miss K=25 71%,
      secret-distribution K=25 92%. THE REPORTED "FACTOR 2 ON THE OPERATIONALLY
      RELEVANT GROUP" BECOMES 1.10.
    - >-
      The red team reached the same conclusion by a different ablation: random X
      with iid Y and no lattice gives 0.7679 / 0.4503 / 0.9192 against the
      certified sieve's 0.7283 / 0.4149 / 0.9194, so 85-90% of the headline
      survives deleting the lattice, A, the modulus, the sieve and the coupling.
    - >-
      THE MECHANISM IS IDENTIFIED. With short offsets the cos channel is a pure
      common mode -- variance share 0.9999-1.0000 in EVERY short-offset arm,
      real or random -- so all discrimination is forced into the rank-<=35 sin
      channel. That is the same m=35 effect the producer found, but acting at
      MATCHED K through channel composition rather than only at K > 512 through
      rank truncation. Sigma = X^T Diag(p)^2 X has participation ratio 34.853
      (sieve) against 34.930 (random): no special geometry to read.
    - >-
      THE PRODUCER'S NULL REMOVES THE WRONG OBJECT. NULL-IIDPHASE deletes offset
      SHORTNESS and the X-Y pairing at once, and shortness carries nearly all of
      it. Offset shortness is a property of the CANDIDATE SET, not of the
      database. The secret-distribution group's offsets are delta_k = s - c_k,
      so all 25 share s: measured mean pairwise cosine +0.5562 against the red
      team's prediction ||s||^2/(||s||^2 + E||c||^2) = 0.5643, computed with no
      lattice compute at all.
    - >-
      "DOWNWARD" IS A THEOREM, not a finding: ST-6 <= K-1 by Cauchy-Schwarz,
      0 of 2000 violations. The D3 branch is unreachable via z1 at K=8 (maximum
      attainable +2.93 < 3.0).
    - >-
      A REAL OBJECT-SPECIFIC RESIDUAL SURVIVES. The validator records 4-9%
      (DEF-1); the red team independently records the real family sitting 3-11%
      below every ablated control. Both reviewers looked for a way to ablate it
      and neither found one. It is the only quantity in five batches to survive
      its own reviewers' ablations.
    - >-
      THE DECAY TEST PASSES. The validator ran a graded offset sweep the
      producer did not: 0.8646 -> 0.9919 monotone as lambda goes 1 -> 63. But
      the destroying parameter is OFFSET LENGTH, not lattice membership.
    - >-
      PRE-REGISTRATION ORDERING HOLDS. F-1/F-2 printed at 62.8 s, first research
      number at 69.7 s, SENS gate and 10 known-answer checks before the real
      arms. The validator names DEV-2 as the proof: the producer's own band was
      missed and recorded as missed.
    - >-
      NO QUIET RE-SCORING. The validator replayed the frozen rule on archived
      z-scores across 33 cells with ZERO mismatches, and confirms the post-hoc
      labelling is correct and complete.
    - >-
      T0 confirms and closes the prior observable: 12.9603 against the 12.1507
      reference (+6.7% on a +/-15% band), sieve comparator 1.2919. Reproduced by
      the red team at 0.8656/0.7310/0.9714/0.9231/0.4216 against the producer's
      0.8600/0.7296/0.9692/0.9209/0.4178, with its own error seed and scorer.
    - >-
      INTEGRITY IS CLEAN. All seven hashes match, commit structure exact, no
      ledger touched, KN-TECH-9d21c4 at 0 diff lines. The Coordinator's report.md
      extraction is BYTE-IDENTICAL to results.json["report_markdown"] (20,346
      bytes, sha256 001bf3fd0005...), checked rather than assumed. No time.time()
      in any loop condition; all loops count-bounded. Every K_eff_trail, offdiag,
      var_cv and CAL-PERM value reproduced at 0.00e+00.

  what_is_not_established:
    - >-
      Anything about ML-KEM. No break, no security proof, no FIPS 203 parameter
      set affected or cleared, no speedup, no cost claim, no exponent moved.
    - >-
      That the independence heuristic fails. The headline is refuted as stated;
      what remains is a 4-9% residual unresolved at n = 2.
    - >-
      That the residual is object-specific. Two draws of the ablated ensemble
      span 0.450-0.504 on the secret-distribution group against the real 0.4149.
      At n = 2 the residual is UNRESOLVED, and that is the check batch 6 runs.
    - >-
      Any operational sign. The red team records it as undetermined in BOTH
      directions, with the correct candidate excluded from every group.

  narrowest_supported_statement: >-
    At dimension 60 with q = 127, on one LWE instance and one shared sieve
    database, the effective number of independent candidates measured across
    candidate sets falls below the independence law's value by amounts of which
    66%, 71% and 92% are reproduced by an object with no lattice, no sieve and
    no dual family at matched norms and offset scale. The reported factor-2
    reduction on the secret-distribution group becomes 1.10 after that ablation.
    The forcing mechanism is that short candidate offsets make the cosine
    channel a pure common mode, driving all discrimination into a sin channel of
    rank at most m = 35. A residual of 4-9% specific to the real dual family
    survives every ablation either reviewer constructed, is unreplicated at
    n = 2, and is not resolved by its own comparator interval. No ML-KEM break.
    No security proof. No statement about FIPS 203 parameters, and no
    operational sign in either direction.

  narrowest_supported_statement_provenance: >-
    Composed by the Coordinator from VAL-20260804-264ab9's ablation table and
    RT-20260804-0ff29a's independent ablation, after both reviews were complete.

  observations:
    - id: OBS-1
      statement: >-
        The S-orthogonalisation test the producer named, and which the
        Coordinator dispatched as the cheapest possible killer, CANNOT FAIL in
        the informative direction: for near-miss candidates the phase columns
        ARE the Y columns, so orthogonalising zeroes the off-diagonal by
        algebra. Near-miss moves 0.7283 -> 0.9740 while secret-distribution
        barely moves, 0.4149 -> 0.4275, and it does not touch the group carrying
        the headline.
      supported_by: RT-20260804-0ff29a
    - id: OBS-2
      statement: >-
        The uniform arm sits at 0.919 +/- 0.005 for seven of eight arms and
        moves only with rank(X), which was held fixed everywhere. It
        discriminates nothing, so the uniform-versus-secret contrast that
        carried the batch's force is weaker than it appears.
      supported_by: RT-20260804-0ff29a OBJ-3
    - id: OBS-3
      statement: >-
        LIM-T2 is wrong. `adjacent_bins_10` at K=10 exists for every p in the
        producer's own results.json. The three matched-K departures are -3.95%,
        -1.98% and +2.41% -- SIGN-INCONSISTENT on the only candidate family a
        dual attack actually enumerates.
      supported_by: VAL-20260804-264ab9 DEF-6; RT-20260804-0ff29a OBJ-6
    - id: OBS-4
      statement: >-
        The ST-5c "0.44x against 0.22x" is a denominator artifact. Numerators
        are 13.306 against 13.532, so the sums family is LESS departed, not
        twice as departed; CAL-PERM swings 27.4-62.7 at K=25. Against nominal K
        the values are 0.541 and 0.532 -- indistinguishable.
      supported_by: VAL-20260804-264ab9 DEF-2; RT-20260804-0ff29a OBJ-5

  inference: >-
    Five batches have now produced five quantities dominated by geometry fixed
    before measurement. This one differs in a way worth recording precisely: its
    forcing was found by the campaign's own new technique entry, applied by a
    reviewer to the batch that wrote it, and a small residual survived both
    reviewers' attempts to ablate it. That residual is the only open quantity
    the campaign has, and it is unresolved at n = 2.

  heuristics_relied_on:
    - id: H-SCALE-1
      statement: That toy-scale behaviour transfers to cryptographic dimensions.
      status: >-
        OPEN and unaddressed. The red team was asked to name what would have to
        hold for a factor-2 effective-sample reduction at toy scale to bear on
        cryptographic parameters; with the factor now 1.10 the question is
        weaker but not answered.

  boundaries:
    - Toy scale, ONE instance, one database.
    - >-
      The surviving residual is n = 2 against a comparator interval that spans
      it. It is not a finding.
    - >-
      The forcing derivation is first order; both reviewers reproduced the
      closed form to four decimals independently.

  unresolved_confounds:
    - >-
      Whether the 4-9% residual is object-specific or a draw. Cheapest check
      named: replicate the family-ablated null 8-16 times through the archived
      closed form and report where the real family sits against that interval.
      Under three minutes, no scoring, no g6k, no fpylll.
    - >-
      The correct candidate is excluded from every group, so the operational
      sign is undetermined in both directions.

  evidence_integrity_findings:
    - id: INT-1
      finding: >-
        The Coordinator's snapshot commit message 82bcbbe4 attributes at least
        seven strings to the producer, twice under the word "verbatim", that
        appear in NO producer artifact -- their only occurrence is the
        Coordinator's own snapshot_receipt.json. The producer's third-person
        "it says exactly which part" is rendered first-person as "I can say
        exactly which part".
      raised_by: RT-20260804-0ff29a OBJ-7
      materiality: >-
        HIGH, and the most serious Coordinator defect recorded in this program.
        The prior six were dropped scope or unqualified conclusions; this is
        fabricated attribution, committed while following a quotes-or-nothing
        rule adopted one batch earlier. The strings came from the producing
        agent's transient response message rather than from any archived path,
        so the archive cannot support the quotation. Both reviewers confirm
        there is NO security claim anywhere in the message and no surviving
        present-indicative Coordinator conclusion -- the rule held for what it
        was adopted for and broke in its mechanism.
    - id: INT-2
      finding: >-
        "0.44x nominal" is wrong twice -- in the snapshot message and in the
        Coordinator's review card. It is 0.44x CAL-PERM and 0.53x nominal.
      raised_by: VAL-20260804-264ab9 DEF-2
      materiality: Moderate. The Coordinator propagated a framing without checking its denominator.
    - id: INT-3
      finding: >-
        The DEV-3 cell count is 33 of 33 (21 T1 cells of which 7 are null, plus
        12 T2), not "18 including six". The wrong count is now in the permanent
        knowledge entry KN-TECH-6c0e15, as is a scoping of the forcing to K > m
        which is vacuous at the K = 8 and K = 25 where every headline cell sits.
      raised_by: VAL-20260804-264ab9 DEF-3, DEF-9
      materiality: >-
        Moderate, and owed as a supersession rather than an edit.
    - id: INT-4
      finding: >-
        Section 3's claim that the closed form ran BEFORE scoring is refuted by
        the producer's own log (99.3-114.7 s, after). Separately,
        `expectation_uniform` = D1 was also missed -- all nine uniform cells
        returned D2 -- and is absent from the deviations list.
      raised_by: VAL-20260804-264ab9 DEF-4, DEF-5
      materiality: Moderate. Pre-registration ordering still holds overall.

  coordinator_observations_unreviewed: []

  pareto:
    dominated_by: >-
      The 8-16 draw replication of the family-ablated null, under three minutes,
      which would resolve or kill the only open quantity in this campaign.
    sota_delta: >-
      None claimed and none exists. No attack improved, no exponent moved, no
      cost reduced.

  review_refs:
