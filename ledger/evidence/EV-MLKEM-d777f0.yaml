    red_team: >-
      blocking_objections. 13 reproduced, 1 not_reproduced, 3 unable_to_check.
      Derived the score covariance from the Gaussian characteristic function
      before reading the producer's and obtained it term for term.
  review_provenance_note: >-
    Two independent sessions on snapshot 82bcbbe4, dispatched concurrently with
    nothing forwarded. Each ablated the result by a different construction and
