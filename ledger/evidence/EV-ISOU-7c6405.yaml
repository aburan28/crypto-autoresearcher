  # ===================================================================
  # OBSERVATIONS
  # ===================================================================
  observations:
    - id: OBS-Q2-MECHANISM-CONFIRMED
      scope: four runs (not gated by the null-object stop)
      statement: >-
        THE PREDICTED CONSTANT-FACTOR MECHANISM IS CONFIRMED AT THE PREDICTED
        SIZE. The best-to-worst ratio of field multiplications per group
        operation is 1.029851 (20BIT-A), 1.026243 (20BIT-B), 1.030374
        (24BIT-A) and 1.028293 (24BIT-B) -- a range of 1.0262 to 1.0304. In
        every run the quantity takes EXACTLY TWO distinct values, partitioned
        EXACTLY by the criterion "a/(-3) is a fourth power in F_p", with every
        a = -3 reachable member selecting JACOBIAN_A_MINUS_3 from a candidate
        model set declared before measurement. This is the mechanism
        H-ISOU-c5bfea names, at the size it predicts, far below the 1.5x
        threshold of falsification criterion F2, and strictly above 1.0 as the
        hypothesis also requires.
      basis: >-
        review-report.yaml REC-06, recomputed by the Validator from raw add
        and doubling M/S counts for every member, including the class min, max,
        ratio and the partition, with exact agreement to the recorded values.
      caveat: >-
        Carries the DEV-4 common-mix caveat: Q2 is evaluated at ONE COMMON
        operation mix (the base curve's), which is what makes the two-valued
        partition clean, and is a different mix convention from the one the
        implemented Q3 uses (VAL-DEF-04).
    - id: OBS-F3-NOT-OBSERVED
      scope: four runs (not gated by the null-object stop)
      statement: >-
        MONTGOMERY OR EDWARDS MODEL REACHABLE BY ZERO MEMBERS, in every run,
        out of 1652 members total. This is computed per member as a
        reachability test rather than sampled. It is the observable named in
        falsification criterion F3 and it was NOT observed, which confirms the
        prime-order / no-2-torsion argument the hypothesis relies on: N is
        prime and odd, so no member carries rational 2-torsion, so the
        within-class constant-factor lever is bounded by the a = -3 saving
        alone.
      basis: review-report.yaml REC-06 and PA-03.
    - id: OBS-CERTIFICATE-COVERAGE
      scope: four runs
      statement: >-
        EVERY CLAIMED SOLVE CARRIES INDEPENDENT VERIFICATION, AND THE
        VERIFICATION WAS ITSELF INDEPENDENTLY REDONE. 1652 of 1652 member
        transfers verify, plus four base-curve instances and 32 null-object
        instances, zero failures. The producer's checker was established
        independent by code reading (no import of solver internals, separate
        process, extended-Euclid inversion against the solver's Fermat
        exponentiation, MSB-first ladder against the solver's right-to-left
        ladder), and the Validator additionally re-verified every claimed solve
        with THIRD arithmetic written in its own session. Across 26331 member
        and base solve records the set of rho-recovered k values is a SINGLETON
        equal to the frozen k in every run, with zero non-matching values; all
        483 null-object solves recovered their planted k.
      basis: review-report.yaml certificate_checks.
      scope_limit: >-
        The certificate chain verifies the SOLVE. It does not independently
        re-verify the Velu isogenies themselves; edge certificates are
        self-checks computed inside census.py. Class MEMBERSHIP is nonetheless
        independently certified for every vertex by the Validator's own order-N
        verification plus Tate. What remains un-re-verified is which particular
        isogeny connects which pair -- the walk-path structure the Q3 walk cost
        is charged along.
    - id: OBS-CLASS-COMPLETENESS
      scope: four runs
      statement: >-
        CLOSURE, NOT MERE TERMINATION, AND INDEPENDENTLY TRUE. The enumerated
        vertex count equals h(disc(End(E_0))) at 156, 160, 594 and 742, where h
        was recomputed in the Validator's own session by counting reduced
        primitive positive-definite binary quadratic forms of discriminant
        D = t^2 - 4p, using no producer code and no part of the walk. Every
        vertex was independently verified to have group order exactly N and
        therefore, by Tate, to lie in the F_p-isogeny class; all vertices carry
        distinct j-invariants and no two are F_p-isomorphic, so no twist was
        merged. The object over which any "no member is cheaper" statement
        quantifies is intact.
      basis: review-report.yaml REC-08, CTL-02 and completeness_findings.
      caveat: >-
        THE COMPLETENESS GATE COULD NOT FAIL AS EXECUTED (VAL-DEF-03 / DEV-3).
        The condition "the declared degrees generate cl(O)" was applied as a
        candidate SELECTION FILTER, so its PASS carries no per-run diagnostic
        information, and the base-curve population is conditioned 6-to-1 in
        20BIT-A and 3-to-1 in 20BIT-B, with no conditioning at all in either
        24-bit run because the filter rejected nothing there. Completeness
        itself is independently true regardless; what narrows is the population
        of base curves any statement generalizes over.
    - id: OBS-Q1-NULL-AT-BAND-RESOLUTION
      scope: RUN-ISOU-2ac81f-20BIT-B and RUN-ISOU-2ac81f-24BIT-B only
      statement: >-
        NO WITHIN-CLASS GROUP-OPERATION EFFECT IS DETECTED ABOVE THE FROZEN
        BAND'S RESOLUTION IN EITHER ADMISSIBLE RUN. Class median of member
        medians 1285.75 group operations over 160 members (20BIT-B, p =
        1048573, N = 1050451) and 5064.0 over 742 members (24BIT-B, p =
        16777213, N = 16770113). ZERO members lie outside the raw per-seed
        dispersion band in either run. Against the narrower bootstrap median
        band, 7 of 160 and 64 of 742 members lie outside, against nominal
        two-sided expectations of 8.0 and 37.1. The single cheapest member on
        the group-operation axis in each run was re-run under the 16 declared
        FRESH seeds as the contract's tail check requires, and returned INSIDE
        the band both times. Falsification criterion F1 was therefore NOT
        observed on the only members the contract's tail check tested.
      basis: >-
        review-report.yaml REC-04, REC-05, CTL-09 and per_run_gate_table.
      caveat: >-
        THIS IS NOT A CLEAN NULL AND MUST NOT BE REPORTED AS ONE. The 24BIT-B
        band-exceedance count of 64 against 37.1 nominal is 1.73x the nominal
        rate, and VAL-DEF-06 / CTL-10 establish that the band is NOT a
        calibrated 95 percent screen -- it is estimated from ONE realization of
        16 draws on ONE curve and inherits that curve's luck, with realized
        coverage ranging from 0.61x to 1.73x nominal across the run set. Only
        the SINGLE cheapest member per run was re-run under fresh seeds, so no
        fresh-seed statement exists for the other band-exceeding members and
        none is made here.
    - id: OBS-Q3-BASIS-DEPENDENT-AND-F4-DOES-NOT-FIRE
      scope: RUN-ISOU-2ac81f-20BIT-B and RUN-ISOU-2ac81f-24BIT-B only
      statement: >-
        THE Q3 HEADLINE ANSWER FLIPS WITH THE COST BASIS AND BOTH BASES ARE
        STATED HERE TOGETHER, AS THE VALIDATOR REQUIRES; NEITHER MAY BE CITED
        ALONE. On the CONTRACT-LITERAL basis -- the contract defines
        charged_end_to_end_cost as measured Velu isogeny EVALUATIONS converted
        to field multiplications plus the member's solve cost -- 75 of 160
        members (20BIT-B) and 37 of 742 (24BIT-B) fall below the base curve's
        solve cost raw, of which 7 and 9 clear the frozen band. On the
        measured-plus-MODELLED basis, which adds a modelled Velu CONSTRUCTION
        cost beyond the contract's literal definition, ZERO members fall below
        in either run.
      f4_determination: >-
        FALSIFICATION CRITERION F4 DOES NOT FIRE, AND THE REASON IS A CONTROL,
        NOT A JUDGEMENT CALL. The band-clearing counts are the observable F4
        names, but the Validator ran a null-object control on that screen
        itself: the "clears_frozen_band" test is a one-sided test at the 2.5
        percent tail applied independently to every member with NO multiplicity
        control, so under the null of no between-member effect the nominal
        expected false-flag counts are 3.90 / 4.00 / 14.85 / 18.55 across the
        four runs against observed 6 / 7 / 14 / 9 -- pooled, 36 OBSERVED
        AGAINST 41.3 EXPECTED, at or BELOW chance. Restricting that pooled
        computation to the two admissible runs alone gives 16 observed (7 + 9)
        against 22.55 nominally expected (4.00 + 18.55), the same direction.
        THE APPARENT FIRING OF F4 IS NOISE, and a control established that it
        is noise rather than the absence of a check being read as a pass.
      modelled_basis_caveat: >-
        THE "0 MEMBERS CHEAPER END-TO-END" READING IS NOT LAUNDERED INTO A
        CLEAN NULL HERE. It holds only on a basis where the median modelled
        construction cost per member is 53x (20BIT-B) and 51x (24BIT-B) THE
        ENTIRE MEASURED BASE-CURVE SOLVE COST, and 222x to 1421x the median
        MEASURED walk cost across the run set -- a modelled quantity two orders
        of magnitude larger than anything measured determines the answer. The
        model charges naive quadratic polynomial arithmetic where the
        implementation actually uses Kronecker substitution, so it is
        PESSIMISTIC, biased toward exactly the "no member is cheaper" answer
        the hypothesis predicts; that direction is flagged here rather than
        left implicit. Separately, VAL-DEF-04: the implemented solve-cost
        formula DIVERGES from the manifest's own declared q3_definition -- the
        declaration charges each member at the common Q2 value while the
        implementation charges each member at its OWN median adds/doublings
        mix -- so a reader applying the manifest's stated rule gets different
        numbers (27 / 76 / 88 / 32 instead of the recorded 24 / 75 / 90 / 37
        raw below-base counts). The recorded numbers are the implemented
        formula's.
      basis: >-
        review-report.yaml COST-02, COST-03, REC-07, CTL-10, VAL-DEF-04,
        VAL-DEF-05, VAL-DEF-06.
    - id: OBS-INSTRUMENT-PROPERTIES
      scope: four runs, as instrument properties only
      statement: >-
        Censoring rates 1.86 / 2.33 / 0.47 / 0.31 percent by run, mechanism
        identified (a walk is censored when its cycle contains no distinguished
        point) and matching the predicted 1/sqrt(N) scaling; each censored
        solve is recorded with its step count at cutoff and contributes NO cost
        datum. Null-object censoring runs 5x to 7x the member rate in the
        20-bit runs because the distinguished-point density is fixed at 1/16
        while N' is about N/32, so the control sits in a different censoring
        regime from the members despite literally identical solver parameters
        (VAL-DEF-09). Wall clock 24.7 / 22.2 / 105.1 / 161.1 s, 313.1 s total
        against a 2 CPU-hour budget, no limit reached; peak resident set
        47464448 bytes measured on one run only.
      never: >-
        NEVER as a slow or resistant curve and NEVER as mathematical evidence.
        No run timed out, crashed or exhausted its budget, so AGENTS.md rule 5
        is not engaged by this run set at all -- there is no infrastructure
        failure here to mistake for a negative result.

  # ===================================================================
  # INFERENCE
  # ===================================================================
  inference: >-
    Within the tested scope only: the constant-factor leg of H-ISOU-c5bfea is
    CONFIRMED as a mechanism -- the per-operation field cost varies across
    class members by a factor of 1.0262 to 1.0304, takes exactly two values,
    and is partitioned exactly by the a = -3 fourth-power criterion the
    hypothesis names -- and the prime-order / no-2-torsion argument is
    confirmed by zero Montgomery or Edwards reachability across 1652 members.
    On two admissible runs at two toy prime sizes, no within-class
    group-operation effect is detected above the frozen band's resolution and
    no member is cheaper end-to-end on the basis that charges a modelled
    construction cost, while on the contract's own literal measured basis
    members below the base curve DO exist and the screen that flags them does
    not exceed its own null. THE ONE THING THIS RECORD DOES NOT DO IS DISCHARGE
    OBSTRUCTION 4 OF EV-ECDLP-b3e847. Two admissible toy runs against a
    contract carrying two defects that were blocking at approval do not convert
    an asserted absence-of-evidence claim into a measured one; obstruction 4
    stays exactly as the red team recorded it -- empirical, not proven -- and
    changes status only by a new record, never by an edit to EV-ECDLP-b3e847.
    The correct disposition of this run set is a Coordinator cure of the
    contract and a re-run under a repaired contract, which is what
    DEC-20260813-61e8a3 records.

  # ===================================================================
  # BOUNDARIES
  # ===================================================================
  boundaries:
    - >-
      RESOLUTION FLOOR, carried forward verbatim in substance from
      DEC-20260813-e0077d. The census can only see between-member differences
      larger than the frozen seed dispersion band. Pollard rho step counts have
      dispersion comparable to their mean, so a 16-seed median carries a
      standard error on the order of a fifth to a quarter of the mean, and a
      real within-class group-operation effect smaller than that is INVISIBLE
      to this instrument. THE Q1 NULL THEREFORE MEANS "no effect above the
      frozen band at the tested scale" AND NEVER "no effect".
    - >-
      NULL-OBJECT STRENGTH, carried forward from DEC-20260813-e0077d and
      confirmed by the Validator. The different-order control demonstrates that
      the meter tracks group order -- the null median tracks the predicted
      sqrt(N'/N) scaling in every run -- and does NOT demonstrate sensitivity
      to a within-class cost difference of the size the census would need to
      detect, because no object of that kind is available to control against.
      This is the strongest available control and it is weaker than the ideal
      one. Every null in this record carries that gap.
    - >-
      TESTED SCOPE, exactly. Two admissible runs: p = 1048573 with N = 1050451,
      h = 160, and p = 16777213 with N = 16770113, h = 742. One base curve per
      run, ordinary, prime order, CM conductor f = 1, a = -3 model, drawn from
      a population additionally filtered by |D| <= DMAX and h in a declared
      range. Isogeny degrees 2, 3, 5, 7, 11, 13. Sixteen declared rho seeds per
      curve plus sixteen fresh tail-check seeds. Solver: plain Pollard rho,
      r = 20 partition Teske-style adding walk, distinguished-point rule
      x congruent to 0 mod 16, NO negation map, all curves in the common
      coordinate system AFFINE_SHORT_WEIERSTRASS for Q1. Cost unit for Q3:
      field multiplications with squaring weight 1.0, raw M and S retained
      separately. Budget 600 s per run, 2 CPU-hours total, 8 GB, 1 worker.
      Nothing outside that scope is claimed.
    - >-
      TRANSFER ASSUMPTIONS: NONE ARE ASSERTED, AND THAT IS DELIBERATE. P-256 is
      the SHAPE imitated -- ordinary, prime order, flat volcano, a = -3 -- and
      is not the object measured. No statement about P-256, about
      cryptographic-scale curves, or about any scaling law is licensed by this
      record. claim_tier is toy, and the contract's scale_relevance.
      correspondence is null because the objects are sampled directly, so there
      is no correspondence theorem standing in for scale and none is cited.
    - >-
      THE STANDARD THESE RUNS WERE JUDGED AGAINST IS DEFECTIVE, AND THE
      DEFECTS ARE IN THE CONTRACT AND ITS APPROVAL. VAL-DEF-01: the frozen
      contract names a seed dispersion band but no statistic, no interval rule
      and no percentile, so the producer had to supply the designation that
      decides a MANDATORY STOP. VAL-DEF-02: the frozen reproduction fixture
      0.886*sqrt(N) is the NEGATION-MAP constant sqrt(pi*N/4), while the same
      contract mandates plain rho with no negation map, whose ideal mean is
      sqrt(pi*N/2) and whose ideal median is sqrt(2*N*ln 2) -- and the fixture
      is stated as a MEAN while the protocol compares a MEDIAN. Both were
      present at approval, in this Coordinator's own approval decision
      DEC-20260813-e0077d. Neither is a defect against the runs.
    - >-
      NO STATEMENT THAT THE BASE CURVE REPRODUCED THE FROZEN FIXTURE APPEARS IN
      THIS RECORD, BECAUSE IT DID NOT, IN ANY RUN: measured base-curve medians
      exceed 0.886*sqrt(N) by factors 1.320 / 1.506 / 1.457 / 1.106, above it
      in all four and below it in none. AND NO RUN IS RE-SCORED HERE AGAINST
      sqrt(pi*N/2), sqrt(2*N*ln 2) OR ANY OTHER SUBSTITUTE CONSTANT.
      Re-scoring after seeing the outcome is precisely the post-hoc adjustment
      the pre-registered prediction exists to prevent, and the contract's own
      invalidation rule names it. The corrected constant is fixed
      PROSPECTIVELY, in the superseding records H-ISOU-5748b6 and
      EXP-ISOU-bfba73, and applies to future runs only.
    - >-
      MODEL INDEPENDENCE IS NOT ACHIEVED (AGENTS.md rule 12). Recorded as the
      Validator recorded it and not softened: the review ran in a separate
      session under the validator role at xhigh effort, authored none of the
      artifacts under review, and re-derived every substantive number with its
      own arithmetic; but this harness resolves every policy alias to one
      model, so the resolved model is the same model that served the Executor.
      Session and role independence are real; MODEL independence is not, and no
      part of this record may be cited as independently model-verified.
    - >-
      REPRODUCIBILITY IS NOT EXERCISABLE FROM THE ARCHIVE ALONE (VAL-DEF-07).
      summary.json is generated from a scratch state file outside the
      repository that is not among the 47 declared artifacts, so regenerating
      it requires re-running the census. Substantially mitigated but not
      cured: the Validator re-derived every statistic in every summary.json
      directly from solve_records.jsonl with zero mismatches, so the CONTENT is
      confirmed correct while the pipeline replay is not available. Separately
      (VAL-DEF-10), the BSGS cross-check and the fresh-seed tail check are
      guarded by wall-clock tests, so on a slower host the CONTROL SET would
      differ and controls would be silently omitted rather than reported
      missing. Every control did execute in these runs.
    - >-
      THE DISCARDED FIRST EXECUTION OF RUN-ISOU-2ac81f-20BIT-A IS NOT IN THE
      RECORD (VAL-DEF-08), and neither is the 16-bit shakedown that the
      Executor discloses as preceding the band design. No NUMBER is in doubt --
      both bands and both separation verdicts were recomputed from raw with
      exact agreement -- but the provenance narrative cannot be verified from
      artifacts. What IS verifiable is that the two-part band rule is embedded
      in the manifest of the FIRST of the four runs and therefore predates all
      four.

  # ===================================================================
  # UNRESOLVED CONFOUNDS
  # ===================================================================
  unresolved_confounds:
    - >-
      THE Q3 BASIS IS UNRESOLVED IN THE CONTRACT, NOT MERELY IN THE REPORTING.
      The contract's text defines the charged cost on measured Velu
      EVALUATIONS; the runs additionally report a measured-plus-modelled basis
      whose modelled term dominates everything measured by two orders of
      magnitude. The two bases give OPPOSITE headline answers. Until a contract
      designates one as primary and requires both to be reported side by side,
      any Q3 statement from this experiment is basis-dependent and cannot be
      cited without its basis. EXP-ISOU-bfba73 designates it prospectively.
    - >-
      THE BAND-CLEARING SCREEN IS UNCALIBRATED (VAL-DEF-06). It has no
      multiplicity control, and its realized coverage ranges from 0.61x to
      1.73x nominal because the band is estimated from one realization of 16
      draws on one curve. Any per-member flag count from this experiment must
      be quoted with its nominal expectation; a flag count alone is
      uninterpretable.
    - >-
      A DECLARED SELF-CHECK FAILED WITHOUT BEING LOGGED (VAL-DEF-11). The Q2
      replay self-check reports false for 14 members across the run set and
      appears in no defect_log.yaml. The Validator diagnosed it: the check
      fails for exactly and only those members whose seed-index-0 walk solved
      in FEWER than the declared 300 replay operations, a perfect 14-of-14
      correlation, so it is a benign length mismatch and not an arithmetic
      disagreement, and the retained Q2 values sit correctly on the two-valued
      a = -3 partition. NO NUMBER IS WRONG. The confound is procedural and is
      cured prospectively in EXP-ISOU-bfba73, which requires such failures in
      the defect log.
    - >-
      THE WALK-PATH STRUCTURE IS NOT INDEPENDENTLY RE-VERIFIED. Class
      membership of every vertex is independently certified via order N and
      Tate, but which particular Velu isogeny connects which pair rests on
      self-checks inside census.py -- and that structure is exactly what the Q3
      walk cost is charged along.
    - >-
      NULL-OBJECT CENSORING REGIME (VAL-DEF-09). The control ran at 10.2 and
      10.9 percent censoring in the 20-bit runs against members' 1.4 and 1.9
      percent, purely because the distinguished-point density is fixed at 1/16
      rather than scaled with sqrt(N). Censoring selects short-cycle walks and
      therefore biases the surviving null median UPWARD, i.e. AGAINST
      separation, so the separations recorded here are conservative with
      respect to this bias -- but the bias magnitude exceeds the 7.3 percent
      margin by which RUN-ISOU-2ac81f-20BIT-A missed the raw band, which is one
      reason that run is held rather than argued over.
