        Seta already supplies the frozen algebraic core: endpoint plus full
        torsion-basis images and M=1 finite-action recovery. The added HHK
        shell and unused complete-ring witness do not establish a materially
        different EndRing recipient mechanism.
    - id: O-obligations
      text: >-
        O1, O2, O3, and O6 remain open. O4 is contradicted for the exact
        interface by finite-action factorization and Seta overlap. O5 is
        contradicted for the tested reduction because the required challenge
