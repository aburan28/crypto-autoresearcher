        - experiments/EXP-GFPN-05ff43/runs/RUN-GFPN-42a000/raw-result.json
    - id: PF-K6
      joint: K6
      verdict: breaks
      text: >-
        THE *_proxy COUNTS CANNOT CARRY FLATNESS, CROSS-ARM RATIOS OR F3.
        - The committed fp_ops_ratio_raw_over_sym of 39.63 moves by more than
          2x under measured CPU (13.0-14.2), executed F4 instructions (81.3),
          consistent accounting (148.7) and the frozen source's inversion cost
          (123.5).
        - The raw arm's construction is never charged.
        - The 150 F_q-mul inversion constant is unsourced; Pornin states about
          2.57.
        - There is no bound direction, and the producer's two proxies differ
          by a factor of 2^8.4.
        - Instructions per proxy operation range from 6 to 101 across shapes.
        - Proxy flatness only restates the real p-independence of the F4 matrix
          shapes, while msolve's printed CPU moves 11-17 percent.
        What survives: the F4-only shape estimate is within 2x of executed
        core_f4 instructions on the one cross-shape pair tested.
      artifacts:
        - coordination/goals/GOAL-GFPN-380702/reviews/TASK-20260923-404bf9/scratch/k6/k6_objB_summary.json
    - id: PF-K7
      joint: K7
      verdict: breaks
      text: >-
        THE FROZEN PREDICTION IS ANCHORED TO THE WRONG SYSTEM. Pornin's
        "5 equations with 5 unknowns, and a total degree 2^{k-1} = 16 ... D ...
        close to 2^{k(k-1)} = 2^20" (paper_fulltext.md lines 138-149) describes
        the S_5-symmetrized system in e_1..e_5. That is what Joux-Vitse (lines
        278-290) attach total degree 2^{n-1} and the 2^{n(n-1)} degree to, and
        what the producer's own arm (ii) interpolates on C(21,5) = 20349
        total-degree-16 monomials. Dispatcher verification confirms both
        frozen-text readings.
        - The raw system's mixed volume is 5! * 16^5 = 2^26.9, and the n = m = 3
          analogue attains 3! * 4^3 = 384 exactly.
        - So D_raw ~ 2^26.9, D_S5 ~ 2^20, and a genuine torsion quotient
          ~ 2^16.
        - The frozen D_raw ~ 2^20, D_S5 ~ 2^20/120 and D_torsion ~ 2^20/1920,
          and the band 2^121-2^132, are mis-anchored by 5! = 120.
        - Re-anchored under the design note's own model (arithmetic, not
          measurement), the torsion quotient sits at 2^134.4 (D^2) to 2^152.7
          (5 D^3). With the omitted inverse success probability charged (FHJRV
          line 854), it sits at 2^144.3 to 2^162.6.
        - The scoring code hard-codes the mis-anchored constants and a nominal
          torsion success of 2/120 (pdp_common.py lines 219-221; pdp_cell.py
          lines 451-455, 661, 679-681, 708). A correct rerun scored against
          them would fire F1 spuriously.
        The premise is corrected by CORR-20260923-27ce4f. The prediction itself
        can change only by a versioned protocol_amendment made before any
        rerun (TASK-20260923-aa277e).
      artifacts:
        - coordination/goals/GOAL-GFPN-380702/reviews/TASK-20260923-404bf9/review-report.yaml
        - coordination/goals/GOAL-GFPN-380702/reviews/TASK-20260923-404bf9/scratch/k5k7/square_analogue_n3.json
        - inputs/PORNIN-2022-274-ECGFP5/paper_fulltext.md
        - inputs/JOUX-VITSE-2010-157/paper_fulltext.md

  inference: >-
    Nothing about D, HEUR-GFPN-DFLAT or the p = 2^64 band is established,
    refuted or constrained by this run set. The m = 5 absence is a property of
    this construction, msolve 0.6.5 with -t 4, an 11 GiB RLIMIT_AS, arms (ii)
    and (iii) only, the EcGFp5-shaped curve only and p' = 4111 only. It is an
    infrastructure boundary, never evidence that D is large.
    What the round did establish concerns the protocol:
    - arm (iii) as built cannot test the hypothesis's mechanism;
    - the frozen prediction and scoring constants are anchored to the wrong
      system;
    - the proxy cannot score F3;
    - the anchor control failed on its literal band while identifying the
      right system;
    - two blocking controls were discharged at one prime only.
    The m <= 4 random-target pipeline finds decompositions at the exact rate
    at p' = 11, with two silent loss paths. The hypothesis's mechanism is
    untested by this experiment. In the red team's square analogues (toy,
    reviewer scratch, reproduced but not independently derived), a genuine
    F_p-rational quotient DID realize the predicted 2^{m-1} drop. The lane is
    more open than the run set suggests, not less.

  boundaries:
    - Curves -- EcGFp5-SHAPED double-odd toy curves y^2 = x(x^2 + 2x + c z) at p' in {4111, 262151, 16777291}, matched random_2torsion / random_no2torsion controls at p' = 4111 only; JV anchor curves at p' in {65551, 16777291}. Not EcGFp5 or EcMasFp5 themselves.
    - Field -- F_{p'}[z]/(z^5 - c), p' 13-25 bits (anchor 17 and 25 bits). n = 5; m = 5 attempted for arms (ii) and (iii) at p' = 4111 only; m = 4 and m = 3 elsewhere.
    - Solver -- msolve 0.6.5 (-t 4 for cells, -t 1 for anchors), 11 GiB RLIMIT_AS per child on the cells, producer host of 2026-09-21 (Xeon @ 2.80GHz, about 15 GB, no swap).
    - Arms -- arm (iii) as built is the norm construction (K5), not a (Z/2)^{m-1} x| S_m quotient; no artifact of this run bears on the FHJRV or F_p-rational torsion quotient.
    - Budget -- m = 5 cells stopped after 2 targets (D-5); 18 of 20 targets per m = 5 cell not attempted.
    - No statement about EcGFp5's or EcMasFp5's security, the validity of 142, or any 128-bit claim, in either direction. No improvement meeting any predefined threshold was observed or tested over these instances, parameters, solver and resource budget.
  unresolved_confounds:
    - Whether any m = 5 system of any arm completes under a larger memory envelope (the contract's 32 GB) or a sparser construction is unknown; the F_p-rational arm (iii) is about 10x sparser at m = 5 (at most 1287 + 792 monomials against 20349) and was never built.
    - The contract's F_{p'} operation counts were never instrumented (D-2); no committed per-PDP figure is calibrated.
    - The n4 anchor's wall-clock comparison is host-dependent (2010 Core 2 Duo reference; producer host 2.80 GHz; validator host 2.10 GHz, 5.88 s).
    - The m = 4 random-target driver silently records positive-dimensional systems and degenerate msolve parametrisations as non-decompositions (object A); negligible at p' >= 2^10 by extrapolation, untested there.
    - The implementation was never committed before the runs; run-time code is reconstructed from logs and the end-of-task committed version.

