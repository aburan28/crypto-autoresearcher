  protocol_findings:
    - id: PF-K5
      joint: K5
      verdict: breaks
      text: >-
        ARM (iii) AS BUILT DOES NOT TEST THE 2-TORSION SYMMETRIZATION.
        - The product Q = S(x) * S(b/x_1, x_2..x_m) is the norm of the
          G2-invariant summation polynomial. It is invariant under
          x_i -> b/x_i for every i separately, i.e. under (Z/2)^m x| S_m, not
          (Z/2)^{m-1} x| S_m.
        - Its interpolated support equals arm (ii)'s: 20349 = 20349 monomials
          at m = 5, and 495 = 495 at m = 4 (committed build RUN-GFPN-42a000,
          RUN-GFPN-c16d20). The Bezout / mixed-volume bounds are therefore
          identical.
        - The committed m = 4 F4 traces of S4 and torsion_S4 are identical
          round by round, and the m = 5 traces of arms (ii) and (iii) are
          identical from degree 17 to degree 32 (validator pointer).
        - In square analogues computed by the red team, D_product = D_S_m: 64
          at n = m = 3 at two primes, and 4096 at n = m = 4. An F_p-rational
          (Z/2)^{m-1} x| S_m quotient on a rescaled factor base gives
          2^{(m-1)^2}: 16 and 512.
        - FHJRV's Prop. 8 / Prop. 13 ring form is unavailable for double-odd b,
          which is a non-square (Pornin frozen text lines 871-875).
        The dispatching session reproduced the n = m = 3 degrees by RE-RUNNING
        the red team's script. That is a reproduction, not an independent
        derivation.
      artifacts:
        - coordination/goals/GOAL-GFPN-380702/reviews/TASK-20260923-404bf9/review-report.yaml
        - coordination/goals/GOAL-GFPN-380702/reviews/TASK-20260923-404bf9/scratch/k5k7/square_analogue_n3.json
        - coordination/goals/GOAL-GFPN-380702/reviews/TASK-20260923-404bf9/scratch/k5k7/square_analogue_n4.json
