evidence:
  id: EV-HQC-75c05b
  hypothesis_id: null
  hypothesis_id_note: DELIBERATELY NULL. Stage A validated the INSTRUMENT for EXP-HQC-982268; it sampled
    no measurement arm and computed no joint moment on space (T). Naming H-HQC-18d1b4 here would invite
    exactly the inference this run cannot support -- that something was learned about the joint failure
    law. Nothing was.
  experiment_ids:
  - EXP-HQC-982268
  run_ids:
  - RUN-HQC-982268-STAGEA-a
  type: empirical
  direction: neutral
  strength: preliminary
  claim_tier: toy
  certificate_refs: []
  proof_status: empirical_only
  proof_refs:
  - coordination/goals/GOAL-HQC-001/batches/BATCH-6fddee/reviews/TASK-20260806-43a44f/validation_report.yaml
  - coordination/goals/GOAL-HQC-001/batches/BATCH-6fddee/reviews/TASK-20260806-dd901b/red_team_report.md
  observations:
  - 'Stage A ran to completion inside its authorization: 1411.1 of 1692 core-seconds, 403 wall-seconds,
    exit 0.'
  - The instrument is arithmetically correct where it was actually tested. The red team ran the cross-validation
    the package had only claimed -- the oracle exact rational law_of_S pushed through stage_a.log2_A_from_hist,
    40 cells across 13 configurations, max difference 1.2e-14.
  - 'Sampler fidelity checks pass: D2 zero weight deviations over 1,965,576 trials / 9,827,880 vectors;
    D5 zero replay mismatches over 1600 replays; measured p-hat matches the analytic p* to between 5.2e-7
    and 1.5e-5 at all four sets; PS-A upper-tail quantiles match SPEC Table 10 to 0.0 / -2.0 / +1.4 weight
    units at 1e-3 / 1e-4 / 1e-5; an extended decoder cross-check agrees with exhaustive minimum-distance
    search on 7200 of 7200 blocks.'
  - 'D1 has a genuine positive control: the same estimator returns 1.00034-1.00446 on NULL-M, inside the
    [0.95,1.05] alarm band, so the detector demonstrably can move.'
  - 'THE INSTRUMENT IS NOT YET FIT FOR THE MEASUREMENT IT WAS BUILT FOR. Four defects, each found or confirmed
    by an independent reviewer: (1) INV-NULL, which is also the contract FALSIFICATION CRITERION, has
    a realized size of 7.7-21 percent against a nominal 0.27 percent, because the estimate and its jackknife
    SE are driven by the same rare large-S trials; (2) CTRL-BS, the contract PRIMARY control, cannot fail
    for anything upstream of the indicator matrix, because np.roll is a permutation that preserves per-block
    marginals exactly -- it fired 0 of 108 cells; (3) D3 cannot fail on its advertised object, sitting
    39-70 (M)-sigma above the (M) mean; (4) the declared SE at the allocated T is understated 5.4x at
    PS-R1 k=16.'
  - 'The single escalated INV-NULL firing (PS-R1/NULL-M/k=11, raw |z|=3.15, T_stab-admissible) DISSOLVES
    once the rule is correctly sized: corrected |z| = 2.05. No admissible cell survives. This is the controls-before-belief
    rule doing its job -- an apparent signal that did not outlive its own null.'
  - 'Two of the contract Stage-B allocations are not reachable at the MEASURED q-hat: PS-R1 needs 1.452e8
    trials against 1e8 allocated (1.45x short) and PS-R5 needs 2.554e7 against 2e7 (1.28x). PS-R3 retains
    a 20x margin. Success criterion (iv), which requires log2 A-hat_m at PS-R1, PS-R3 and PS-R5, is therefore
    unsatisfiable as written.'
  inference: 'The Stage A gate did what a gate is for: it was the cheapest stage, and it found that the
    instrument''s two most load-bearing controls -- the primary control and the falsification criterion
    -- are not fit for purpose, at a cost of 1411 core-seconds instead of the 55,785 the full contract
    models. Running any measurement arm now would produce a number whose null distribution is unknown
    and whose primary control cannot fail. What Stage A establishes is about the APPARATUS, not about
    HQC.'
  boundaries:
  - 'NOTHING here bears on HQC decoding-failure rates, on assumption A17 or A5, on the joint failure law,
    or on any standardized HQC parameter set. Claim tier: toy.'
  - No statement is made about H-HQC-18d1b4, whose status is unchanged at proposed.
  - The defects are properties of THIS contract's controls as implemented and measured at these reduced
    parameter sets. They are not claims about the underlying mathematics.
  - The BATCH-003 infeasibility closure is untouched and still stands on its own review.
  - 'TC-2 is NOT EVALUABLE, not passed: only one of the two required deterministic tie conventions was
    implemented and the resulting q-hat bracket is 0.954 bits wide. The published 2^-10.96 lies inside
    that bracket, which must NOT be promoted into "reproduces HQC''s published inner DFR".'
  unresolved_confounds:
  - The realized size of INV-NULL was measured by the red team at 300 draws per arm; the correction from
    |z|=3.15 to 2.05 rests on that estimate and has not itself been replicated.
  - Whether a correctly sized decision rule would leave any admissible INV-NULL firing anywhere is unknown
    -- the census was only re-scored at the escalated cell.
  - Only one of 20 advertised SE widths was checked (PS-R1 k=16). The others are untrusted, not disproven.
  - The snapshot archive was made after the reviewers began reading rather than before. The receipt pins
    the bytes by sha256 and the validator independently recomputed all four and matched them, so the reviewers
    demonstrably read the committed artifacts -- but the freeze is argued rather than enforced, and that
    is weaker.
  reviewed_by: coordinator
