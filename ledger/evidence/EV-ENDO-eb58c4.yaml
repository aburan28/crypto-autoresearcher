evidence:
  id: EV-ENDO-eb58c4
  hypothesis_id: H-ICINV-6c7920
  question_id: RQ-ICINV-475b5e
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-74ebef
  experiment_ids:
  - EXP-ICINV-4d33aa
  - EXP-ICINV-55c2d8
  run_ids:
  - RUN-ICINV-849d1d
  - RUN-ICINV-476e12
  - RUN-ICINV-ff0806
  - RUN-ICINV-4bf6c8
  - RUN-ICINV-f09176
  type: empirical
  direction: refutes
  direction_note: >-
    Refutes H-ICINV-6c7920's specific coverage/r mechanism as the
    explanation for EV-ENDO-10109d's over-dispersion. Does NOT refute
    EV-ENDO-10109d's own over-dispersion observation, which this run
    reproduces under a certified full-group sampler; if anything the
    phenomenon is empirically more robust than before this run, even as its
    cause is now less understood than the campaign's leading candidate
    explanation suggested.
  strength: preliminary
  strength_note: >-
    CAPPED AT `preliminary`, NOT `replicated`, FOR REASONS STRONGER THAN
    THE 2-1 MAJORITY SPLIT ALONE WOULD REQUIRE. Amendment v3's own
    `confirmatory_status: exploratory_only` applies unconditionally
    regardless of outcome (the gate redesign was engineered in view of the
    exact rows that needed to pass). Independent review (CORR-20260810-a4c123)
    found this is not merely a cap for caution: ZERO of the three primes in
    the reported majority represent a measurement taken after the gate
    redesign that was not already knowable from records predating it
    (Finding 1), and the redesigned SR3 gate's false-pass rate under a
    genuine null is 44.3-45.0% at the sample sizes used here, a 40-50x
    inflation over the literal check it replaced (Finding 3) -- so the
    admissibility gate itself supplies far less assurance than a flat
    `gate_passed: True` conveys. `preliminary` is applied as the ceiling
    this evidence record's own type permits, not as a statement that the
    result is close to `replicated` strength with more data.
  claim_tier: toy
  certificate_refs:
  - >-
    experiments/EXP-ICINV-4d33aa/runs/RUN-ICINV-849d1d/decision-rule-evaluation.json
    -- terminal_state OUTCOME-C independently re-derived by hand from its
    own aggregate_persistence/majority_counts/stratification_verdict fields
    against specification.yaml's frozen_decision_rule, by this Coordinator
    and separately by an independent Validator; both derivations agree.
  - >-
    experiments/EXP-ICINV-4d33aa/runs/RUN-ICINV-ff0806/wilson-hilferty-crosscheck.json
    and the sibling files in every other version-3 run -- change A8's
    cross-check against the committed harness/exp_icinv.py:binomial_null_verdict,
    independently reproduced by the Validator to ~1e-16 relative error at a
    representative df, and by this Coordinator's own earlier filing-time
    verification script for the underlying formula.
  proof_status: empirical_only
  proof_refs:
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-74ebef/execution/EXP-ICINV-4d33aa-v3/execution_report.md
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-74ebef/execution/EXP-ICINV-4d33aa-v3/validation_report.md
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-74ebef/execution/EXP-ICINV-4d33aa-v3/redteam_report.md
  - ledger/corrections/CORR-20260810-a4c123.yaml
  observations:
  - >-
    THE SPECIFIC MECHANISM IS REFUTED. H-ICINV-6c7920 predicted the
    within-class m=3 over-dispersion was a coverage artifact of the
    committed single-generator sampler, indexed by r (CORR-20260807-d78e2f's
    named confound: r=3 curves reach only half their group under the
    committed sampler). Under a certified full-group sampler (Arm B,
    exact support certified equal to E(F_p) on every measured curve), the
    over-dispersion PERSISTS (aggregate F_p majority 2 PERSISTS / 1
    COLLAPSES across p=2003/4001/6007) and does NOT stratify by r
    (S_prime_positive False at all three primes; the r=1 and r=3 strata
    move together row by row rather than one loading the excess onto the
    other -- an independent confirmation from the Red Team's review, not
    part of the contract's own S1/S2/S3 test, that corroborates
    S_NEGATIVE from a different angle). This is exactly falsification
    condition F-i / F-ii of the frozen contract and directly discharges
    CORR-20260807-d78e2f's required_action: the specific, previously
    most-favoured explanation for EV-ENDO-10109d's over-dispersion is
    eliminated.
  - >-
    THE UNDERLYING PHENOMENON IS NOT EXPLAINED, AND THE CAMPAIGN NOW
    UNDERSTANDS ITS CAUSE LESS, NOT MORE. Eliminating the coverage/r
    mechanism removes the leading candidate; it does not supply a
    replacement. `state_4_OUTCOME_C_neither`'s own text calls this a real,
    likely, non-failure outcome, and this record treats it as such rather
    than as a disappointment to be minimised.
  - >-
    NEITHER OF THE OTHER TWO REGIME-SPECIFIC PREDICTIONS THIS EXPERIMENT
    WAS BUILT TO TEST WAS CONTRADICTED: the exact coverage certificate
    (Stage 1, unaffected by this run) still stratifies by r exactly as
    HEUR-COV-1 predicts (r=3 <=> n1 even <=> half coverage), and the
    planted index-2 split (Arm C, unaffected by this run) was previously
    detected. What failed is specifically the causal claim that THIS
    coverage mechanism explains THIS over-dispersion, not the coverage
    mechanism's own existence.
  - >-
    A NEW, PREVIOUSLY UNQUANTIFIED CANDIDATE MECHANISM IS NAMED, NOT
    TESTED. This Coordinator, following up on an independent Red Team
    finding, freshly regressed the pooled variance ratio against measured
    density (`mean_density_3V_over_order`) at every prime, in both Arm A0
    (the pre-existing, v3-unrelated committed baseline) and Arm B (this
    run): R^2 = 0.50-0.93 across primes and arms, versus the r-split's own
    already-computed explanatory power (`VR_within/VR_pooled`, from the
    contract's own S2 check) of approximately 0% (-0.7% to 0.8%, noise
    level) at every prime. Whatever drives the excess tracks density
    strongly and tracks r not at all. `factor_base_fixed_size`'s
    deterministic "first-liftable-x" construction is named as a plausible,
    previously-unconsidered source of this density-linked structure,
    distinct from both saturation (eliminated by EXP-ICINV-55c2d8) and
    sampler coverage (eliminated here). This is a candidate, not a
    finding: no experiment has tested it.
  - >-
    "DENSITY-INDEPENDENT" IS RETRACTED AS A DESCRIPTION OF THIS PHENOMENON,
    EFFECTIVE THIS RECORD. EV-ENDO-10109d's own language ("now shown to be
    density-independent") and this experiment's own contract text ("does
    not stratify by r") are both, in the strict sense the R^2 figures
    above establish, describing a real but narrower fact -- the ratio does
    not DECAY to 1 at high density (true, and the correct substitute
    phrase) -- rather than a flat, density-independent profile (not
    supported). EV-ENDO-10109d is not edited (AGENTS.md rule 4); this is
    its corrected reading, alongside CORR-20260807-d78e2f and
    CORR-20260810-a4c123.
  inference: >-
    This record discharges CORR-20260807-d78e2f's own pre-registered
    required_action ("if OUTCOME B or C, a superseding record must state
    which"). It states OUTCOME-C, with the mechanism-elimination framed as
    the direct, intended answer to that correction's named confound, and
    with every caveat CORR-20260810-a4c123 raises attached rather than
    smoothed over: two independent reviews found the run's evidentiary
    value narrower than its own execution report conveyed, and this record
    is written to that narrower standard, not to the flat "confirmed at
    three primes, over-dispersion strengthened" reading a casual summary
    might reach.
  boundaries:
  - >-
    Toy scale throughout (p in {2003, 4001, 6007}), claim_tier: toy,
    sota_delta: 0. r is a 2-part invariant (KN-TECH-030); nothing here
    bears on the ECDLP in the prime-order subgroup in either direction.
  - >-
    "Attack" and "strengthened", where they appear in the frozen contract's
    own OUTCOME-C text and are echoed by this record, mean surviving a
    targeted attempt at falsification of a specific mechanism-hypothesis,
    not a cryptographic attack. No ECDLP cost claim is made or implied.
  - >-
    Zero of the three primes contributing to the reported majority
    represent a measurement taken after amendment v3's gate redesign that
    was not already knowable from records predating it (CORR-20260810-a4c123
    Finding 1). This evidence record's confirmatory value is effectively
    zero-primes-blind, not one-prime-partial.
  - >-
    The SR3 gate that admitted p=6007 to this run has a 44-45% false-pass
    rate under a genuine null at these sample sizes (CORR-20260810-a4c123
    Finding 3); its pass is not equivalent in strength to p=4001's, whose
    gate outcome the redesign never touched.
  - >-
    The density-vs-r explanatory comparison in this record's observations
    is a free re-analysis of already-collected data, not a new,
    independently designed and controlled experiment. It has not been
    reviewed by an independent Validator or Red Team and should be treated
    as a strong lead, not a finding, until it has.
  unresolved_confounds:
  - >-
    WHAT CAUSES THE RESIDUAL WITHIN-CLASS OVER-DISPERSION IS STILL UNKNOWN,
    and this record narrows the space of explanations without closing it:
    saturation is eliminated (EXP-ICINV-55c2d8), sampler coverage/r is
    eliminated (this record), and a density-linked mechanism tied to
    factor-base construction is newly named as the leading untested
    candidate.
  - >-
    The redesigned SR3 gate's own weak discriminating power
    (CORR-20260810-a4c123 Finding 3) is itself an open instrument question:
    a protocol_amendment v4 is required before this gate is relied on
    again, and no run under the current v3 gate should be treated as a
    strong admissibility check until that amendment lands.
  - >-
    The manifest self-identification defect (CORR-20260810-a4c123
    Finding 2) means these five runs' own `manifest.yaml` files
    misidentify their contract version; any future automated audit that
    trusts that field without cross-checking `code.commit` will misclassify
    them.
  reviewed_by: coordinator
  review_provenance: >-
    COMPLETE, TWO INDEPENDENT SESSIONS, BOTH READ IN FULL BY THIS
    COORDINATOR BEFORE THIS RECORD WAS WRITTEN, NOT TAKEN ON EITHER
    REPORT'S SUMMARY ALONE. A Validator session re-derived all eight of
    this Coordinator's own requested checks from raw committed artifacts
    (terminal-state re-derivation, the A7 CI formula at the two motivating
    rows, the A8 cross-check, the A9 provenance hashes, the edit
    prohibition, SR6, the source-provenance check, and budget/scope) and
    found every one correct, plus two additional findings (F1, F2, both
    detailed above) it was not specifically asked to look for. Full report:
    coordination/goals/GOAL-ENDO-001/batches/BATCH-74ebef/execution/EXP-ICINV-4d33aa-v3/validation_report.md
    (`passed_with_findings`). A Red Team session independently re-derived
    the SR3 gate's exact acceptance region and false-pass probability by
    closed form (regularized incomplete gamma function), checked whether
    the blindness caveat was evenly distributed across primes (it is not),
    checked wording risk in inherited contract language, and independently
    found the density trend this record's observations quantify further.
    Full report: coordination/goals/GOAL-ENDO-001/batches/BATCH-74ebef/execution/EXP-ICINV-4d33aa-v3/redteam_report.md.
    This Coordinator independently spot-checked both reports' central
    claims (the F1 bit-identical diff, the F2 manifest grep, the density
    regression) before accepting them into this record rather than citing
    either report's conclusion unverified.
