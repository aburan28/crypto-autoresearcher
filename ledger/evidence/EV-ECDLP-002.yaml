  observations:
    - >-
      TASK-20260722-001 and TASK-20260722-002 independently passed their
      authorized-fallback runtime, non-originating-session, snapshot,
      exact-path, parent, reachability, and artifact-hash gates.
    - >-
      TASK-20260722-001 returned REVISE: the proposed elliptic unit-product
      constructor is operation-level duplicate of the existing P1553 R4
      target-label common-factor frontier and supplies no concrete recurrence,
      public seed list, gauge action, dependency graph, or constructor.
    - >-
      TASK-20260722-002 returned REVISE: both methodology proposals remain
      proposal-only; frontier-B is the higher-information repair target, but
