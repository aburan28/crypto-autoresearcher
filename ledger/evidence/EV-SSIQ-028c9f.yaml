evidence:
  id: EV-SSIQ-028c9f
  hypothesis_id: H-SSIQ-36e970
  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  batch_id: BATCH-006
  experiment_ids: [EXP-SSIQ-a85692]
  run_ids: [RUN-SSIQ-a85692-c]
  type: empirical
  direction: neutral
  direction_note: >-
    NEUTRAL FOR A NEW REASON. This run re-analyzed RUN-SSIQ-a85692-b's
    already-collected data under GD-8's corrected trapped-vertex exclusion
    filter. Both the real arm and the null arm lost all 4 previously-used
    primes (each exceeds the 0.5 trapped_fraction threshold in both arms),
    so the run reports DATA-UNAVAILABLE-BLOCKED under a new,
    filter-specific gate -- not a control failure, not a data-availability
    wall external to the graphs, but a genuine coverage gap CAUSED BY
    correctly applying the exclusion rule the frozen spec's own text has
    always required. H-SSIQ-36e970's real-arm prediction was never
    computed (no gamma_greedy/gamma_random/m_gap exists for this run).
  strength: inconclusive
  strength_note: >-
    inconclusive as "not tested," not "tested weakly." What IS firm,
    independently confirmed by both reviewers via hand re-derivation from
    raw data (zero trust in the manifest's own arithmetic): GD-8's fix
    (trapped_exclusion_filter_v3) is correctly implemented and correctly
    applied, matching the frozen contract's own pre-freeze-confirmed
    worked check to full float precision in both arms. What is NOT firm:
    GD-9's fix. The Red Team found that the required synthetic self-test
    (built specifically because real data cannot exercise
    c_null_label_comparison_v3's substantive branch, per the v3 pre-freeze
    review's own PF-1 finding) never actually calls
    c_null_label_comparison_v3 -- it calls the underlying
    ols_loglog_fit/bootstrap_gap_ci library functions directly and
    re-implements the comparison rule inline, bypassing the wrapper
    function's own cross-dict indexing, min-primes gate, and ordering
    logic entirely. A subtly wrong implementation of that wrapper (e.g. a
    swapped dict source for N, an off-by-one in the primes floor, a
    missing sort) would pass this self-test unchanged. GD-9's wrapper is
    therefore fixed IN CODE and consistent with the frozen spec's prose,
    but remains RUNTIME-UNVALIDATED by any test executed in this campaign
    to date -- a materially narrower claim than "GD-9 is fixed," and this
    record states the narrower claim explicitly.
  claim_tier: toy
  claim_tier_note: >-
    Toy scale, matching H-SSIQ-36e970.scope_ceiling: the same 4-5 primes
    RUN-SSIQ-a85692-b already touched, N in [203, 718]. No result
    transfers to cryptographic scale, and none is claimed to.
  proof_status: empirical_only
  proof_refs:
    - experiments/EXP-SSIQ-a85692/runs/RUN-SSIQ-a85692-c/raw-result.json
    - experiments/EXP-SSIQ-a85692/runs/RUN-SSIQ-a85692-c/execution_report.yaml
    - experiments/EXP-SSIQ-a85692/runs/RUN-SSIQ-a85692-c/synthetic_self_test.json
    - coordination/goals/GOAL-SSIQ-001/batches/BATCH-006/reviews/VAL-BATCH-006.md
    - coordination/goals/GOAL-SSIQ-001/batches/BATCH-006/reviews/RT-BATCH-006.md
    - coordination/goals/GOAL-SSIQ-001/batches/BATCH-006/reviews/RT-PREFREEZE-EXP-SSIQ-a85692-v3.md
  preregistration_binding:
    specification: experiments/EXP-SSIQ-a85692/specification_v3.yaml
    freeze_commit: 7f40426b
    verified_by: TASK-20260805-47be12
    detail: >-
      specification_v3.yaml frozen 2026-08-05 at commit 7f40426b, a
      versioned amendment to v2 (frozen 14b56525), after its own
      pre-freeze Red Team review (RT-PREFREEZE-EXP-SSIQ-a85692-v3.md,
      FREEZE-WITH-FIXES, PF-1 through PF-3 applied, PF-4 recorded as
      forward-looking). The Validator confirmed manifest.yaml's code.commit
      equals the freeze commit with no intervening commit before execution.
  observations:
    - id: O-1
      statement: >-
        GD-8's FIX IS SOLIDLY CONFIRMED, ON REAL DATA, BY BOTH REVIEWERS
        INDEPENDENTLY. trapped_exclusion_filter_v3 applies the 0.5
        threshold independently to each arm's own greedy_trapped_fraction
        and correctly excludes all 4 primes in the real arm
        (0.8374/0.7222/0.8201/0.8511) and all 4 in the null arm
        (0.8079/0.7037/0.7908/0.8478) -- both reviewers hand-re-derived
        this arithmetic directly from RUN-SSIQ-a85692-b's own raw-result.json,
        matching the frozen contract's own pre-freeze-confirmed worked
        check to full float precision. GD-8 is fixed and validated.
      supported_by: [TASK-20260805-6f3934, TASK-20260805-47be12, TASK-20260805-176dab]
      confidence: high
    - id: O-2
      statement: >-
        THE DATA-UNAVAILABLE-BLOCKED TERMINAL LABEL IS CORRECT AND
        HONESTLY DERIVED, independently confirmed by both reviewers: the
        new gate (decision_rule_v3) fires because 0 < 4 real-arm
        survivors, correctly does NOT reopen the already-passed Phase -1
        gate from RUN-SSIQ-a85692-b (disjoint quantities -- M-COVERAGE
        versus greedy_trapped_fraction, no shared code path, confirmed by
        direct code reading), and apply_decision_rule is correctly named
        as reused-by-reference but genuinely never invoked on this
        dispatch (the >=4-survivors branch its call site sits in is never
        entered) -- disclosed explicitly, not silently glossed.
      supported_by: [TASK-20260805-47be12, TASK-20260805-176dab]
    - id: O-3
      statement: >-
        THE VALIDATOR INDEPENDENTLY CONFIRMED THE SYNTHETIC SELF-TEST'S
        ARITHMETIC IS CORRECT ON ITS OWN TERMS: an exact power law must
        recover gamma exactly, forcing the bootstrap CI to degenerate to a
        point, hand-derived from ols_loglog_fit's own formula independent
        of the Executor's claim, matching the reported values (gamma_null_greedy
        ~0.3, gamma_null_random ~0.8, m_gap_null ~0.5, CI width ~6e-16) to
        far better than the stated 1e-9 tolerance. The synthetic inputs
        (N in [100, 1000, 10000, 100000]) share no value with
        RUN-SSIQ-a85692-b's real N ([203, 324, 478, 611]) -- genuine
        independence, not incidental.
      supported_by: [TASK-20260805-47be12]
    - id: O-4
      statement: >-
        BUT THE RED TEAM FOUND, BY READING THE SELF-TEST'S CODE DIRECTLY
        (not merely its output), THAT IT VALIDATES THE WRONG FUNCTION:
        run_synthetic_self_test_v3 never calls c_null_label_comparison_v3
        (the wrapper this amendment exists to fix) -- it calls
        dht.ols_loglog_fit/dht.bootstrap_gap_ci directly on hand-constructed
        lists and re-implements the comparison rule inline as a SECOND,
        independent, hand-written copy of the expression
        c_null_label_comparison_v3 already contains. The self-test
        therefore exercises (a) library functions that already had
        independent runtime validation from BATCH-005's real-arm fit
        (EV-SSIQ-f3ce32 O-1/O-2), redundant here, and (b) a duplicate
        comparison expression, NOT (c) the wrapper's own cross-dict
        indexing (N from the real arm's dict, medians from the null arm's,
        confirmed structurally forced by the data schema -- c_null_label.per_prime
        has no N field at all), its len(null_survivors)<min_primes gate,
        or its sorted() ordering step -- exactly the control flow a subtly
        wrong implementation would get wrong. A version of
        c_null_label_comparison_v3 with a swapped dict source, an
        off-by-one in min_primes, or a missing sort would pass this
        self-test unchanged. This is a new defect of the same species as
        GD-8/GD-9: a required validation artifact that "ran" and produced
        a passing report, without its comparison logic ever touching the
        function it was built to validate.
      supported_by: [TASK-20260805-176dab]
      confidence: high
    - id: O-5
      statement: >-
        THE RED TEAM WEIGHED WHETHER THIS BATCH'S FULL THREE-ROLE PROCESS
        CYCLE WAS JUSTIFIED GIVEN THE PRE-FREEZE REVIEW HAD ALREADY
        PREDICTED THE REAL-ARM OUTCOME WITH HIGH CONFIDENCE, AND CONCLUDED
        YES, ON A NARROWER BASIS THAN THE RUN PACKAGE'S OWN FRAMING
        CLAIMS. The value is concentrated in (i) independently confirming
        the ACTUAL IMPLEMENTED CODE (not just the draft prose) applies
        GD-8's filter correctly -- code and prose have diverged often
        enough in this campaign's own history (GD-6, GD-8, GD-9) that this
        is not a formality -- and (ii) O-4's own finding, which required
        an independent read of the actually-executed reanalyze_v3.py and
        would not have been surfaced by a lighter-weight Coordinator-only
        arithmetic check. The self-test's own claimed value ("the ONLY
        runtime evidence GD-9's fix works") is real for the reused
        library functions but overstated for c_null_label_comparison_v3
        itself, per O-4.
      supported_by: [TASK-20260805-176dab]
    - id: O-6
      statement: >-
        A SEPARATE, POTENTIALLY RELEVANT OBSERVATION: trapped_fraction
        shows NO MONOTONIC TREND across the four already-tested N values
        (0.837 at N=203, 0.722 at N=324, 0.820 at N=478, 0.851 at N=611),
        independently confirmed by the Red Team from RUN-SSIQ-a85692-b's
        own data. This argues against assuming pervasive trapping is
        purely a small-N artifact that larger graphs would automatically
        resolve, and is recorded as a caution for BATCH-007's ranking, not
        as a finding about lever L4's viability -- the sample (4 primes)
        is too small to support any trend claim either way.
      supported_by: [TASK-20260805-176dab]
      confidence: low
  inference: >-
    GD-8 is fixed and validated on real data -- an unambiguous advance.
    GD-9's wrapper is fixed in code and consistent with the frozen spec's
    description, but the campaign's own required validation artifact for
    it does not actually exercise the wrapper function, so it remains
    RUNTIME-UNVALIDATED. Named as a new defect, GD-10, fixable at zero new
    search cost (build a self-test that constructs synthetic data in the
    real data's own schema -- real arm carries N, null arm does not -- and
    calls c_null_label_comparison_v3 itself through both its NOT-EVALUABLE
    and fit-and-bootstrap branches). H-SSIQ-36e970's real-arm prediction
    remains untested: DATA-UNAVAILABLE-BLOCKED under the corrected filter
    is itself informative (pervasive trapping at N in [203, 611] on these
    graphs, across all previously-searched primes and both label arms),
    but establishes nothing about whether a delta_E-gradient exists.
  boundaries:
    - >-
      H-SSIQ-36e970's real-arm prediction is UNTESTED. No claim about a
      delta_E-gradient existing or not existing is supported by this
      record in either direction.
    - >-
      NO CLAIM IS MADE ABOUT WHETHER A p^{1/4} ALGORITHM EXISTS, is likely,
      or is near. asymptotic_claim stays null throughout.
    - >-
      "GD-9 is fixed" is NOT a claim this record supports without the
      qualifier: fixed in code, consistent with spec, validated on
      synthetic data for the underlying library functions only, NOT
      runtime-validated for c_null_label_comparison_v3's own wrapper
      logic. Any successor record citing GD-9 as resolved must carry this
      qualifier until GD-10 is fixed.
    - >-
      GD-8 and GD-9(as coded)'s correctness are established by direct code
      reading and independent hand-arithmetic, not merely by the run
      "completing" or reporting a pass -- consistent with this campaign's
      standing discipline since GD-9 itself.
    - >-
      The non-monotonic trapped_fraction observation (O-6) is recorded as
      a caution, not a finding; the sample (4 primes) is too small to
      support a trend claim about how trapping varies with N.
    - >-
      Toy scale throughout: the same 4-5 primes RUN-SSIQ-a85692-b already
      searched, N in [203, 718]. Nothing transfers to cryptographic scale.
    - >-
      Evidence strength capped at preliminary, campaign-wide and unchanged
      by this batch: independence remains session-only.
  unresolved_confounds:
    - >-
      Whether c_null_label_comparison_v3's own wrapper logic is correct is
      UNRESOLVED (O-4) -- BATCH-007's top-ranked action per the Red Team.
    - >-
      The mechanism behind pervasive trapping (all 4 real-arm and all 4
      null-arm primes exceed 0.5 trapped_fraction) is UNRESOLVED. Whether
      it is a property of graph size, a structural property independent of
      N, or an artifact of the greedy tie-break rule is not established by
      this batch and is BATCH-007's second-ranked action.
    - >-
      Whether widening to larger N would show different trapping behavior
      is UNRESOLVED and is explicitly NOT recommended before the
      mechanism question above is investigated, per O-6's non-monotonicity
      caution.
    - >-
      Model independence remains absent and unverifiable in this
      environment, unchanged from every prior batch.
