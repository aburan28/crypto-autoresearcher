  observations:
  - id: OBS-DEP-DESIGN-1
    detail: >-
      TASK-20260801-040 returned literal REVISE. Under the frozen contract's
      per-comparison wording, the archived DEP-CAL-E 1-of-20 exceedance makes
      D-5 fire; RR-DEP-1 instead left an unfrozen choice between per-comparison
      and aggregate readings, which violates ATS-DEP-1.4.
  - id: OBS-DEP-DESIGN-2
    detail: >-
      D-1 is not a mechanical predicate: `beyond sampling noise` has no frozen
      tolerance, test, confidence level, multiplicity rule, or equality rule.
      Identical arrays could therefore be assigned different precedence
      branches by honest readers.
  - id: OBS-DEP-DESIGN-3
    detail: >-
      The driver computes source-versus-plant joint movement at K=16 only. It
      has no K=64 joint-movement diagnostic, and C2/C3 had no calibration arm.
      The mandatory DESIGN-TRAP-1 duty cannot certify that every family moves
      both tables at the resolution the statistics see.
  - id: OBS-DEP-GATE-1
    detail: >-
      TASK-20260801-041 recorded APPROVAL_DETERMINATION REVISE and
      measurement_authorized false. TASK-20260801-042 invoked no driver,
      started no measurement, made zero attempts, and created no measurement
      run or result package. TASK-20260801-043 committed that cancellation at
      exactly two declared paths.

  interpretation:
