      This is not a result about dependence, factor bases, Semaev polynomials,
      smoothness, ECDLP, cryptographic scale, or asymptotic complexity.

  required_repairs_before_any_future_measurement:
  - Freeze one D-5 multiplicity unit, statistic and cut before a fresh calibration.
  - Freeze a fully mechanical D-1 monotonicity/noise predicate.
  - Measure source-versus-plant joint movement at both K=16 and K=64 for every family and rung, or narrow the certified class.
  - Describe eps_det/0.02 only as a ratio of touched-record rungs unless both plants are normalized by a common measured distance.

