  observations:
    - id: O-1
      text: >-
        BATCH-060 TASK-20260804-051 performed the H-GGM-001 simulability test for
        four augmented ECDLP oracles. The test is scale-independent (mathematical
        argument, no experiment required).
    - id: O-2
      text: >-
        Oracle C (incidence): SIMULABLE. The incidence check (does P_{i1}+...+P_{ir}=Q?)
        is fully checkable via group operations and equality tests (at most m group
        ops per query). The Shoup lower bound applies: incidence-based index calculus
        is CLOSED at exponent 1/2 by theorem. This closes the approach of using
        subset-sum structure in the relation matrix to beat rho.
    - id: O-3
      text: >-
        Oracle D (endomorphism images): SIMULABLE. For prime-order prime-field curves
        with End_{F_p}(E) = Z, every endomorphism acts as scalar multiplication [m].
        phi(Q) = [m]Q is computable by m group operations from Q alone. The Shoup
        lower bound applies: endomorphism-augmented oracle gives no sub-birthday advantage.
    - id: O-4
      text: >-
        Oracle A (first-jet / dual-number): NON-SIMULABLE. The invariant-differential
        identity [k]*(omega) = k*omega forces dQ = k*dG. The jet oracle is PRIVATELY
        COMPUTABLE (requires k to evaluate dQ from dG), not publicly computable.
        Non-simulable but equivalent to the DLP oracle itself: no attacker advantage.
    - id: O-5
      text: >-
        Oracle B (elliptic net / Somos): NON-SIMULABLE. Net values W(m,n) are
        encoding-dependent through x-coords of [m+nk]G and are k-dependent (through
        the index m+nk). However, extracting k from net values reduces to standard
        DLP by the structure of the Somos recurrence. No sub-birthday leverage
        demonstrated; the net provides no information beyond what the DLP oracle
        already provides.

  dominated_by: >-
    Shoup lower bound (exponent 1/2) for simulable oracles C and D.
