        enumerated control-plane FILES and, since CORR-20260905-547849, COMMIT
        MESSAGES; the LAUNCHING PROMPT is a third channel it does not name. Carried
        forward as CF-15.
    - id: OBS-14
      joint: all - a property of the round, not of either package
      observation: >-
        NEITHER INDEPENDENCE PROPERTY THIS ROUND CLAIMS IS MODEL-INDEPENDENCE, AND
        THE CORRELATION IS NOT MERELY `NOT EXCLUDED` BUT POSITIVELY INDICATED. The
        RC-6 producer's runtime receipt records `resolved_model_id: claude-sonnet-5`
        from the adapter against `resolved_model_id_self_reported: claude-opus-5`
        from the session that served it, with `model_verified: false`, no probe run,
        and the divergence escalated to the Coordinator rather than absorbed. The
        reviewer self-reports the same family. And the reviewer established (F-13)
        that it and the OBJ-4 producer SHARE A SCRATCHPAD and therefore a top-level
        session: they are subagents of ONE orchestrating session on ONE filesystem.
        THE ROUND IS THEREFORE SESSION-INDEPENDENT, NOT MODEL-INDEPENDENT, AND
        PROBABLY NOT MODEL-DIFFERENT. IT MAY NEVER BE PRESENTED AS AGREEMENT BETWEEN
        DISTINCT MODELS. This is recorded as a WEAKNESS IN ITS OWN RIGHT and not as
        boilerplate: DEC-20260904-4c81b6 rationale item 2 names exactly what it
        leaves open - a shared misreading, a mis-parsed glyph, a systematically
        preferred slot on a line carrying two figures, a shared assumption about
        which figure is the figure. PARTIAL MITIGATION, FOR THE J4 LIMB ONLY: the ten
        values passed through three extraction engines across two sessions from at
        least two distinct codebase lineages, so a font- or encoding-level corruption
        would have to be reproduced identically by all three. THAT MITIGATION DOES
        NOT EXTEND TO J1, J2 OR J3, which are acts of reading and reasoning by one
        model family. WHAT THE SHARED SESSION BOUGHT, recorded beside its cost: the
        producer-procedure audit could check the producer's RETAINED BYTES against
        the reviewer's own rather than take its checksums on trust.
    - id: OBS-15
      joint: proves-too-much control
      observation: >-
        THE PROVES-TOO-MUCH CONTROL RAN ON ALL FIVE DECLARED OBJECTS INCLUDING THE
        POSITIVE CONTROL, AND WHAT EACH PROCEDURE ACTUALLY DID IS RECORDED. Object 1
        (a synthetic satisfiable contract, built three ways including a negative
        coefficient): returned SATISFIABLE, correct, not a break. Object 2 (the
        degenerate witness): returned satisfiable at that point, in the same words
        the real derivation uses, correct. Object 3 (decoy external sources, three of
        them): all REJECTED, with the catching field named. Object 4 (the unit decoy,
        at both declared bytes-per-entry offsets): DISAGREE on the memory coordinate
        and only the memory coordinate, correct. Object 5 (the positive control):
        ACCEPTED - the real contract landed in a THIRD verdict class distinct from
        both decoy classes, and the gate that rejected three decoys admitted the one
        true article. ENTAILMENT DISCLOSED HONESTLY BY THE REVIEWER RATHER THAN
        CLAIMED AWAY: object 4's rejection is PARTLY ENTAILED by the size of the
        offset relative to the tolerance - a shift far larger than the tolerance
        cannot pass any procedure with a tolerance - so its informative content is
        the ASYMMETRY (only the memory coordinate moved), not the rejection; objects
        1, 2, 3b and 5 are not entailed, verified by feeding the engine seven shapes
        and getting four distinct verdict classes back.
      the_object_worth_carrying_forward: >-
        OBJECT 3b IS A LIVE INSTANCE OF THE BATCH-dc1424 OBJ-3 FAILURE MODE IN A NEW
        PLACE. A DIFFERENT paper on the SAME archive, which assesses this very
        algorithm and cites it by number, CONTAINS FOUR OF THE TEN VALUES and matches
        the title phrase and the author. A containment-style identity check - `does
        this document contain these numbers and mention this title and author?` -
        WOULD HAVE PARTIALLY ACCEPTED IT. Only the checksum rejects it. Any future
        provenance procedure in this program must bind to a checksum and never to
        value containment. Carried forward as CF-17.
    - id: OBS-16
      joint: J3
      observation: >-
        THE LICENSING STATEMENT COVERS BOTH KINDS OF FIELD SIZE AND FORECLOSES MORE
        THAN IT LICENSES AT EACH, WHICH OVERTURNS THE COORDINATOR PRIOR'S ELEMENT 3.
        At the field sizes where the anchor's recorded status is `off_curve` the
        analysis gives four licenses and four forecloses; at the two where it is
        `reachable` it gives two licenses and FOUR forecloses, including that
        `reachable` may not be read as agreement, may not be read as validation of
        the model, of the source or of the transcription, may not be transferred to
        the other field sizes, and confers no exemption from the standing citation
        prohibition. It never treats an unreachable anchor as a claim that any
        published figure is wrong, and says so three times. It enumerates EIGHT
        alternative explanations for an off_curve status, covering all three the plan
        named, states the benign lower-bound explanation FIRST and as leading, and
        explicitly declines to rank or claim exhaustiveness for the rest. The
        reviewer's own Phase A retrieval independently SUPPORTS that leading
        explanation from the article's own text.
      the_residual_that_belongs_with_it: >-
        THE PER-FIELD REACHABILITY STATUSES THEMSELVES WERE NOT VERIFIED BY ANYONE
        THIS ROUND. They are cited from DEC-20260904-4c81b6, and recomputing them
        would require executing cost_model.py, which this batch prohibits absolutely
        and which the reviewer may not even read. The licensing statement is
        CORRECTLY STRUCTURED FOR A STATUS NOBODY HERE CHECKED; if the status is
        wrong, the licensing is misaddressed.
    - id: OBS-17
      joint: J3
      observation: >-
        F-7: ONE OVER-READING PATH, AND IT IS THE SHORTEST IN THE PACKAGE. The draft
        says of the five source-derived pairs that a committed evidence record
        `established their fidelity to the frozen source ... and this amendment takes
        that as settled and closed`, and that `their fidelity to that source is
        settled`. `That source` and `the frozen source` mean this program's OWN
        transcript. A later reader who quotes either sentence WITHOUT the qualifier
        `frozen` reads it as fidelity to the PUBLISHED ARTICLE - precisely the gap
        OBJ-4 was dispatched to close and which NO record of this program had closed
        when the draft was written. STATED SO IT IS NOT MISTAKEN FOR VINDICATION: on
        THIS round's evidence the stronger reading now happens to be true FOR THE TEN
        VALUES; it was not true on the evidence the draft cites, and a sentence that
        is accidentally right is still an over-reading path. Any enacting decision
        must scope that sentence explicitly to the frozen transcript and cite this
        round separately, and only for the ten values, for the external limb. A
        second, informational path was recorded with it: a phrase saying a committed
        evidence record is `strengthened ... by being relied on`, which is not an
        evidential relation and must not be carried forward.
    - id: OBS-18
      joint: J1 and J3
      observation: >-
        TWO WARRANT DEFECTS IN THE RC-6 PACKAGE, NEITHER OVERTURNING ITS CONCLUSION,
        AND ONE STRUCTURAL LIMIT ON THE REVIEW ITSELF. (a) F-2: the scope audit
        asserts that every line of the 167-line file is inside exactly one entry of
        its enumeration, `so the enumeration is exhaustive by construction`. That
        sentence is LITERALLY FALSE: the 26 entries cover 165 of 167 lines with no
        overlaps, and lines 108 and 133 are in no entry. Both are BARE MAPPING KEYS
        carrying no content, which the reviewer read and confirmed can scope nothing,
        so no scoping block is hidden and no conclusion changes - but `exhaustive by
        construction` is the warrant the audit's completeness rests on, and a reader
        who checks it finds it false with no way to learn from the artifact that the
        gap is harmless. (b) F-4: the derivation's step 4 obtains its charging law
        from a functional-form posit that the file nowhere licenses; the posit is
        NAMED honestly by both the artifact and the instrument, and it is
        UNNECESSARY - the reviewer's derivations avoid it entirely and reach the same
        set, and its third derivation needs no law at all. (c) F-8, A LIMIT ON THE
        REVIEW AND NOT ON THE PACKAGE: six classes of citation in the RC-6 package
        are UNVERIFIABLE BY THE REVIEWER BY CONSTRUCTION - everything cited to two
        evidence records and to three BATCH-256a94 artifacts (in its blind_from or
        outside its read scope), the per-field reachability statuses (recomputable
        only by executing a prohibited file), every cost_model.py line-number locator
        (that file is in its blind_from and it read not one line of it), and two
        records that were in its read scope and that it did not read (its own
        declared deviation VD-3). Its J1, J2 and J3 verdicts rest on the frozen
        contract, the package's own text, DEC-20260904-4c81b6, the committed
        BATCH-2e6130 amendment, and its own algebra and control runs, and are
        CONDITIONAL wherever the package's reasoning depends on one of the six. This
        is a cost of a blind_from list correctly drawn for J4, and it is stated as
        one.
    - id: OBS-19
      joint: J1 and J3
      observation: >-
        F-5, AND WHAT CLOSED IT. The RC-6 package NEVER OPENED inputs/ AT ALL: the
        characterization that the source states the ten as lower bounds from an
        explicitly rough underestimation - the premise of its entire category
        diagnosis - and the source locator itself were cited to a committed decision
