    - id: OBS-13
      joint: J4, and it is an objection against this round's own dispatch
      observation: >-
        F-12: THE REVIEWER'S BLINDNESS WAS PARTIALLY COMPROMISED BEFORE ITS PHASE A,
        BY ITS LAUNCHING PROMPT AND BY NO ARTIFACT. Before it retrieved anything it
        had been told that OBJ-4 reported the outcome `retrieved_and_agree`, that its
        copy came from the IACR ePrint Archive and that arXiv had rate-limited the
        host, and the sha256 prefix `ccc85233...d3d7`. WHAT THAT COSTS: its VENUE
        CHOICE was not independent of the producer's, so a shared-venue failure is not
        excluded by its retrieval; its CHECKSUM AGREEMENT was not blind, because it
        knew the expected prefix before computing its own; and knowing the expected
        outcome creates confirmation pressure on a comparison whose whole value is
        that it could have disagreed. WHAT IT DOES NOT COST: NO VALUE OF THE TEN WAS
        DISCLOSED, and it opened no producer artifact and no transcript before writing
        and hashing its Phase A block, so THE TEN-VALUE EXTRACTION - the thing the
        joint exists to duplicate - IS INTACT. ATTRIBUTION, RECORDED PLAINLY: THAT
        PROMPT WAS WRITTEN BY THE ORCHESTRATING SESSION. This is a PROCESS DEFECT OF
        THIS ROUND'S DISPATCH, not a fault of the reviewer, which detected and
        reported an entailment nobody else could have seen - it is in a prompt, not in
