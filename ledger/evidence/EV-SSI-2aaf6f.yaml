        bit on both time and memory`; the 3-bit figure is the STOPPING RULE's rerun
        threshold at :151. A note describing a control has taken the stopping rule's
        number as the control's tolerance. Found INDEPENDENTLY by the producer, which
        records it, states it is orthogonal to the defect being amended, does not
        touch it, and flags it so a later reader does not assume it was missed - and
        by the reviewer, reading the whole file for the J1 scope audit. THAT HANDLING
