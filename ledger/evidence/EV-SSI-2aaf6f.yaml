  boundaries:
    - >-
      TEN VALUES FROM ONE VENUE. The J4 result is a fact about ten decimal strings
      in one document at one version retrieved from one archive, compared against
      five lines of one transcript. It is not a whole-document fidelity certificate,
      not a durable finding about isogenies, and not transferable to any other line,
      artifact, document or claim.
    - >-
      THE SINGLE-VENUE EXPOSURE IS UNCLOSED AND CANNOT BE CLOSED BY A SECOND
      PUBLISHER, BECAUSE THERE IS NOT ONE. See OBS-7. Three retrievals from one
      archive are three retrievals from one archive.
    - >-
      CONTRACT ALGEBRA, NOT A MEASUREMENT. The J1 result is an algebraic statement
      about two blocks of one frozen YAML file at version 1. No quantity of the cost
      model was recomputed, evaluated or tabulated by anyone this round; no
      crossover, margin, sign, speedup or reachability status was evaluated; and the
      per-field reachability statuses the licensing analysis is structured around
      were taken as recorded and verified by nobody here.
    - >-
      THE AMENDMENT IS A DRAFT AND IS REVIEWED ONCE. Its adequacy rests on one
      adversarial session with no red-team pass. Nothing about it is `replicated`.
      Approving it is a separate committed Coordinator decision with a red-team pass
      as a named precondition, and this record supplies neither.
    - >-
      NO SECURITY, SQIsign, CSIDH, STANDARDIZED-PARAMETER, EXPONENT, ASYMPTOTIC,
      CROSSOVER, MARGIN, SPEEDUP, BASELINE-COMPARISON OR ATTACK CLAIM is made or
      supported in either direction, and no asymptotic promotion gate is engaged. No
      curve is instantiated and nothing here measures anything about any isogeny
      problem.
    - >-
      NO COMPLETION CRITERION OF GOAL-SSI-001 IS MET OR APPROACHED. The goal's three
      criteria require a mechanism with charged attack estimates materially improving
      a matched baseline, independent review of that mechanism, and its committed
      archive. This round audited a contract and diffed ten numbers.

