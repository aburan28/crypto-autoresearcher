    - id: OBS-11
      joint: J1
      observation: >-
        F-3: THE PACKAGE'S CLAIM THAT CONTROL C3 CORROBORATES THE FINDING
        `INDEPENDENTLY OF C4` IS OVERSTATED, AND THE CORRECT STATEMENT IS RECORDED
        IN ITS PLACE. C3's SECOND clause (`T(w) must equal T_full for w >= M`)
        logically ENTAILS C4, which is that same clause restricted to the single
        point w = M. The producer's C3 route uses only that clause, so it is the
        same inference drawn from a strictly stronger premise, not a second
        independent derivation, and the phrasing invites a later reader to count one
        source as two. THE WEAKER STATEMENT THAT IS TRUE: if C4 were deleted from the
        file, C3's text would still assert the same thing, so the finding is robust
        to a reading that dissolves C4 as a mere implementation-detail cap check.
        THE REVIEWER'S BETTER VERSION, ADOPTED HERE AS THE RECORD OF WHAT C3
        GENUINELY ADDS: C3's FIRST clause, monotonicity, needs no charging law at
        all - it gives that whenever the overhead-inflated full-memory time exceeds
        the baseline, NO CROSSOVER EXISTS AT ANY BUDGET, while the metrics line
        nevertheless returns a finite, well-defined one. The metrics line asserts the
        existence of an object C3 forbids. This strengthens the finding and it is
        offered as an addition to the record, not as a correction of the result: the
        satisfying set is R x {0} either way, and the reviewer's own derivation
        reaches it without C3 at all.
    - id: OBS-12
