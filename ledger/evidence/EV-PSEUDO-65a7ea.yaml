  observations:
    - id: O-1
      text: >-
        Full k-range DFT at p=4001 (N≈4000): C=3.35, 3.73, 3.63, 3.25 (mean 3.49, n=4).
        Full k-range DFT at p=9001 (N≈8882): C=3.66, 3.78 (mean 3.72, n=2).
    - id: O-2
      text: >-
        Combined summary C vs p:
        p=1009: C≈3.0; p=4001: C≈3.5; p=9001: C≈3.7.
        SLOW GROWTH: ratio C(9001)/C(1009) ≈ 1.24. Consistent with O(log p) growth
        (log(9001)/log(1009) ≈ 1.3) or O(p^{0.1}) growth (9^{0.1} ≈ 1.23).
    - id: O-3
      text: >-
        H-PSEUDO-83817b predicts C = O(1). The data shows C might grow slowly.
        If C = O(log p): at crypto scale (p=2^256), C ≈ 256. The yield bound
        O(C^m/N^{1/2}) = O(256^m/N^{1/2}) is still negligible for the Semaev
        index calculus parameter regime (m=5..7, N^{1/2} = 2^128).
        H-PSEUDO may need to be restated as C = O(log p) rather than C = O(1).
    - id: O-4
      text: >-
        Regardless of C growth: the yield is bounded above by heuristic * (1 + C^m/N^{1/2}).
        For any C = poly(log p), this remains essentially tight at crypto scale.

