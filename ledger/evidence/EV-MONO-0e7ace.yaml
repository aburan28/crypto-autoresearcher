    - >-
      Strictly scoped to a single-extreme-outlier positive control at
      k~49-191. Establishes nothing about the Fisher-combined statistic's
      sensitivity to the mild, diffuse deviation H-MONO-663fb4 actually
      hypothesizes for the real x-coordinate factor base -- that regime
      remains completely untested by any experiment in this lane. Both
      reviewers explicitly caution against reading this record as
      establishing Fisher-combined is a poor design choice in general.
