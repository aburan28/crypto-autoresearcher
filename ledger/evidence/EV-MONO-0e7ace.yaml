  proof_status: derivation
  proof_status_note: >-
    RO3's subgroup construction and forced values are unconditional
    (H-MONO-663fb4 mechanism step 5); both reviewers independently
    re-derived Var_real for both known-positive cells directly from that
    closed form, bypassing the reused conv.py entirely, and matched the
    archived values bit-for-bit. This record's marginal contribution --
    whether the Fisher-combined statistic detects a genuine, known
    positive -- is answered definitively for the specific regime tested
    (a single maximally-extreme outlier), and both reviewers independently
    established WHY, going beyond the archived record's own analysis.
  proof_refs:
    - experiments/EXP-MONO-b1423c/reviews/validator/validation-report.yaml (from-scratch, repository-code-free re-derivation of RO3's structure and Var_real; independent Fisher-combined reimplementation; the floor-cap argument showing no realistic increase in draws could change the outcome)
    - experiments/EXP-MONO-b1423c/reviews/red-team/red-team-report.yaml (independent panel-sensitivity analysis across four archived background panels plus a pooled k=191 panel, sharpening the "generic dilution" framing)

  observations:
    - >-
      EVERY CONSTRUCTION AND ARITHMETIC CLAIM IS INDEPENDENTLY
      RECONFIRMED FROM SCRATCH BY BOTH REVIEWERS, NOT MERELY BY
      RE-RUNNING THE PRODUCER'S OWN CODE. RO3's group structure
      (N=288, n1=3, n2=96) was independently re-derived by both
      reviewers via standalone, repository-code-free brute-force point
      enumeration and group-law implementations. Both known-positive
      cells' Var_real values were independently re-derived from
      H-MONO-663fb4's own closed-form mechanism formula, bypassing
      conv.py, and matched the archived values bit-for-bit. All five
      reused implementation files were confirmed byte-for-byte identical
      to EXP-MONO-b19c6b's (and `subgroup_control` to EXP-MONO-c819ba's)
      via direct diff, not trust. Both reviewers independently
      reimplemented Fisher's combined-probability test from scratch and
      reproduced S1-S4 bit-for-bit. The Validator additionally performed
      a full independent re-execution of the archived pipeline from a
      clean scratch copy, reproducing every reported number exactly.
    - >-
      BOTH KNOWN-POSITIVE CELLS ARE CONFIRMED GENUINE, MAXIMALLY-EXTREME
      OUTLIERS (S5). Both cells' raw p-values land exactly at the
      permutation-test floor (1/20001) on both statistics; the Red Team
      independently confirmed the real Var value exceeds the largest of
      20,000 null draws by roughly 6,358x (h=144) and 245x (h=72) --
      catching and correcting a documentation error in the Executor's
      own implementation.md, which misstated the h=144 margin as "roughly
      6x" (an apparent substitution of a different reported ratio,
      C/F-vs-null-mean=5.83, into that sentence). This documentation
      error understates rather than inflates the result and does not
      affect any measured value in S1-S5 or the outcome classification.
    - >-
      NONE OF THE FOUR FISHER-COMBINED MIXED-PANEL RESULTS (S1-S4)
      REJECT AT ALPHA=0.05, DESPITE THE INJECTED CELL BEING A CONFIRMED,
      MAXIMALLY-EXTREME OUTLIER -- THE DIRECTION OF THIS FINDING IS
      ROBUST, INDEPENDENTLY RECONFIRMED BY BOTH REVIEWERS ACROSS EVERY
      ALTERNATIVE BACKGROUND PANEL TRIED. The Red Team recomputed the
      identical test against three OTHER archived, equally
      non-exceptional background panels available in this lane
      (EXP-MONO-b19c6b's RUN-1 j0, RUN-2 j0, RUN-2 random-ordinary) and
      against a pooled k=191 panel combining all four: none reject
      either (combined p in [0.076, 0.63] across all panels tried,
      including the reported [0.47, 0.52]), and the pooled k=191 result
      (0.58-0.63) is the LEAST sensitive of all, confirming the dilution
      effect genuinely worsens, not improves, with more curves --
      supporting "genuine dilution, not artifact" over any panel-specific
      explanation.
    - >-
      THE VALIDATOR'S DECISIVE, STRUCTURAL EXPLANATION: THE PERMUTATION
      FLOOR ITSELF CAPS THE MAXIMUM POSSIBLE CONTRIBUTION, REGARDLESS OF
      HOW EXTREME THE TRUE EFFECT IS. The extreme cell's chi-squared
      contribution (-2*ln(1/20001) = 19.807) is the MAXIMUM any
      single-cell injection of this construction could ever supply at
      n=20000 draws -- both cells already hit this cap (count=0 of
      20000). The chi2(df=98) rejection threshold is 122.108 (1.72 sd
      above the mean, not the ~1 sd a casual reading suggests); the
      shortfall (43.6-45.3 chi-squared units) is more than DOUBLE what
      any floor-capped single cell can ever contribute. Closing this gap
      by raising the null draw count alone would require roughly
      467,000 draws even under the generous assumption the background
      panel sat exactly at its own theoretical mean, and 2.9-6.8 BILLION
      draws given the actually-realized background level --
      computationally infeasible. This establishes the non-rejection as
      a genuine STRUCTURAL property of pairing a floor-capped
      permutation p-value with an unweighted Fisher combination at this
      panel size, not an unlucky draw or a fixable-by-more-compute
      artifact.
    - >-
      THE RED TEAM'S SHARPENING: THE SPECIFIC REPORTED MAGNITUDE (0.47-
      0.52) IS NOT PANEL-INDEPENDENT, THOUGH THE DIRECTION IS. The
      chosen background panel (EXP-MONO-b19c6b's RUN-1 random-ordinary
      family) happens to sit appreciably below its own null expectation
      before the outlier is even added (z ~= -1.3, roughly the 8th-10th
      percentile of its own null distribution) -- roughly half of the
      "distance from significance" in the reported numbers is
      attributable to this specific panel's own below-average quietness,
      not to Fisher's method's dilution property alone. The three other
      archived panels give combined p-values of 0.076-0.292 for the
      IDENTICAL injected outlier -- 1.6x to 6.8x closer to (though still not
      crossing) the 0.05 threshold. Any future citation of this
      experiment's specific numbers should disclose this range rather
      than treat 0.47-0.52 as a panel-independent characterization of
      "how much" Fisher's method dilutes a single extreme outlier at
      this scale.
    - >-
      BOTH REVIEWERS INDEPENDENTLY ESTABLISH THAT THIS EXPERIMENT TESTS
      CLOSE TO THE LEAST FAVORABLE REGIME FOR DEMONSTRATING FISHER'S
      METHOD'S ACTUAL VALUE PROPOSITION, AND THAT THE NON-REJECTION IS
      NOT EVIDENCE THE STATISTIC IS BROKEN OR POORLY DESIGNED. Fisher's
      combined-probability test is the classical tool for detecting MANY
      MILD deviations spread across a panel; a SINGLE extreme outlier is
      its textbook weak case, and this is exactly the case the co-existing
      per-curve Holm test already has demonstrated, verified power to
      catch (this contract's own S5 metric shows the injected cell's raw
      p-value would trivially survive Holm correction: 1/20001 versus a
      threshold of order alpha/49 ~ 0.001). A single-outlier positive
      control was therefore a well-defined, honestly-scoped, but close-to
      -worst-case test of Fisher-combined's sensitivity -- it converts an
      assumption into a demonstrated fact (DEC-20260831-fccd7e's own
      stated purpose) without establishing anything about the statistic's
      actual intended regime.
    - >-
      THE CROSS-LANE FINDING, THE MOST IMPORTANT UPSHOT FOR
      H-MONO-663fb4'S OWN STATUS TEXT: FISHER-COMBINED'S CONTRIBUTION TO
      EXP-MONO-b19c6b'S "NO SIGNAL FOUND ANYWHERE" READING IS NOW KNOWN
      TO CARRY ZERO INDEPENDENT EVIDENTIARY WEIGHT FOR THE SINGLE-OR-FEW
      -EXTREME-CURVE CASE SPECIFICALLY -- IT IS REDUNDANT WITH, NOT
      ADDITIVE TO, THE PER-CURVE HOLM TEST FOR THAT CASE, WHICH ALREADY
      COVERS IT AND FOUND NOTHING ON REAL DATA. This does NOT undermine
      EXP-MONO-b19c6b's overall "controlled null confirmed" reading (the
      per-curve half of the instrument independently covers this failure
      mode and already found nothing). It DOES mean EV-MONO-04d447's
      "untested assumption" phrasing for Fisher-combined sensitivity is
      now stale in one specific respect and should read: "demonstrated
      absent for the single/few-extreme-outlier case (redundant with the
      already-power-verified per-curve Holm test for that case); entirely
      untested for the many-mild-curves case the statistic was actually
      introduced for." No experiment in this three-experiment lane has
      ever tested the many-mild-curves regime.
    - >-
      GOVERNANCE: A FOURTEENTH OUT-OF-BAND "CURSOR AGENT" COMMIT,
      CONTENT-CORRECT, INDEPENDENTLY CONFIRMED NEVER LIVE IN THE
      EXECUTED RUN. CORR-20260831-817847 discloses commit 9e786d21d,
      which correctly clarified a genuine ambiguity in this Coordinator's
      own original background-panel prose (which named only "the Var
      statistic" without specifying that C/F panels need C/F-matched
      background). Both reviewers independently confirmed, by reading
      run.py directly (not the correction's own prose), that the
      executed code already matched each Fisher panel to its own
      statistic's background correctly, before and independent of the
      out-of-band fix -- the ambiguity was never exploited.

