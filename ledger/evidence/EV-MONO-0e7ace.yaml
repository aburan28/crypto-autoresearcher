  empirical_evidence_created: true
  mathematical_evidence_created: true
  scientific_evidence_created: true
  scientific_effect: >-
    Converts EV-MONO-04d447's "Fisher-combined sensitivity is an untested
    assumption" into a demonstrated fact for the specific regime tested:
    the statistic does NOT detect a single, maximally-extreme outlier at
    a ~49-curve panel size, a structural (floor-capped, not fixable by
    more draws) consequence of unweighted Fisher pooling, independently
    confirmed by two reviewers via disjoint from-scratch re-derivations.
    This does not weaken H-MONO-663fb4's overall K3/K4 disposition
    (the per-curve Holm test already covers this exact failure mode and
    found nothing on real data), and it does not establish anything
    about the many-mild-curves regime Fisher-combined was actually
    introduced to catch, which remains completely untested by any
    experiment in this lane. No ECDLP, relation-rate, or
    cryptographic-scale claim. Does not close KN-OPEN-009.

