    detection regime already covered by the per-curve Holm test, without
    creating any new evidence toward or against the real x-coordinate
    factor base's character bias. It creates no ECDLP claim, no
    relation-rate claim, no cryptographic-scale claim, and does not close
    KN-OPEN-009. GOAL-MONO-001 remains paused; this experiment drew on
