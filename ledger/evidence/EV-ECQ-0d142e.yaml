  obstruction:
    statement: >-
      A pencil of plane cubics through 8 rational points in general position is
      a RATIONAL elliptic surface, so its Mordell-Weil rank over Qbar(t) is at
      most 8; for this pencil it is exactly 8, because the discriminant is
      squarefree of degree 12 and therefore every one of the 12 singular fibres
      is an irreducible I_1, leaving Shioda-Tate no correction to subtract. This
      is a statement about the OBJECT, not about the attempt: the record ladder
      over Q is bought with base rank, and sieving a rational elliptic surface
      cannot manufacture base rank at any volume. Exceeding 8 over Q(t) requires
      a K3 or higher elliptic surface.
    quantity: >-
      (a) Mordell-Weil rank of the base curve over Qbar(t); (b) the largest
      excess over the base observed on any specialisation over Q.
    value: >-
      (a) 8 EXACTLY, dimensionless, no error bar -- a derivation, not an
      estimate, from deg c4 = 4, deg c6 = 6, deg disc = 12 with disc squarefree,
      every input verified in exact rational arithmetic. Against a published
      base-rank reference of roughly 18-20 (recalled literature, labelled
      background, NOT measured here), the axis-1 gap is 10 to 12 as a scoped
      estimate.
      (b) +4, i.e. certified rank 12 from a base of 8, observed once; measured
      over 56 completed descents of 140 attempted (60% censored), so +4 is a
      LOWER bound on the family's maximum excess inside the searched box.
      Reaching 31 from a base of 8 would need +23 from a single specialisation,
      which was not observed anywhere and is not a scale-up of anything measured.
    measured_by:
    - RUN-ECQ-81141a-002
    - RUN-ECQ-81141a-004
    - RUN-ECQ-81141a-005
    - coordination/goals/GOAL-ECQ-001/batches/BATCH-7e06d3/tasks/TASK-20260822-0de988/validation_report.yaml
    - coordination/goals/GOAL-ECQ-001/batches/BATCH-7e06d3/tasks/TASK-20260822-53748a/red_team_report.md
    scope: >-
      This pencil, from these 8 base points. Claimed nowhere else: it bounds no
