  - id: OBS-1
    what: AXIS 1 -- base rank over Q(t) is 8, and 8 is the EXACT ceiling of this
      construction, not merely an achievement.
    detail: >-
      The pencil of plane cubics through the 8 rational points
      (4:0:1) (-1:2:1) (-3:-2:1) (0:-1:1) (-2:-1:1) (2:0:1) (-4:2:1) (1:-2:1)
      gives the family y^2 = x^3 - 27 c4(t) x - 54 c6(t) with deg c4 = 4,
      deg c6 = 6, deg disc = 12. The validator recomputed the general-position
      audit exactly (all 56 triples non-collinear, all 28 sextuples off a conic),
      confirmed the cubics-through-8-points system has rank 8 and kernel
      dimension 2 (a genuine pencil), verified the 9th base point
      (197684347 : -60668562 : -45807609) by exact substitution AND by an
      independent Sylvester resultant showing the base locus is exactly those
      nine points, and verified all 8 sections satisfy the family IDENTICALLY
      over Q(t) as polynomial identities. It then established the ceiling: the
      discriminant is SQUAREFREE (gcd(D, D') of degree 0), so all 12 singular
      fibres are irreducible I_1 and Shioda-Tate forces geometric Mordell-Weil
      rank EXACTLY 8. Cited from RUN-ECQ-81141a-002 and qt_family.json, NOT from
      gap_analysis.json (see unresolved_confounds UC-2).
    source: [RUN-ECQ-81141a-002, validation_report J1-a..J1-e, red_team 2.6]

  - id: OBS-2
    what: The 8 sections are independent at specialisations the PRODUCER NEVER
      TESTED, and the rank drops are forced by unconditional upper bounds.
    detail: >-
      The validator specialised at ten t of its own choosing and computed the
      8x8 Neron-Tate regulator at 38 AND 115 digits. Nine of ten give full rank
      8 with least eigenvalue between 1.30 and 5.74 -- three to four orders of
      magnitude above anything a tolerance argument could reach. At the drop
      fibres it ran PARI ellrank, an implementation the producer did not write:
      t = 1 -> [4,4], t = 2 -> [7,7], t = 5 -> [7,7]. Those are unconditional
      UPPER bounds, so at those fibres 8 sections CANNOT be independent and the
      drop is a property of the curve, not of the numerics. At t = 1/2 the fibre
      has rank exactly 8 while the section images span only 7 -- the
      specialisation map is non-injective there, which is a subtler statement
      than "the rank drops". A FIFTH exceptional fibre, t = 4 with ellrank
      [6,6], was found by the validator and is NOT in the producer's table: the
      producer's four exceptional t must not be read as enumerating the
      exceptional set.
    source: [validation_report J1-f, J1-g, J1-h]

  - id: OBS-3
    what: BEST CERTIFIED RANK OVER Q BY THIS PIPELINE -- 12, and it is EXACTLY 12.
    detail: >-
      t = -65/22, a-invariants [0, 0, 0, -518228207838672723,
      141005837549331272675978478]. 20 points exhibited (8 sections + 12 from
      2-descent), all on the curve in exact rational arithmetic; 12 declared
      independent; 12x12 regulator ~5.833522605e9 with least eigenvalue ~0.3462.
      The validator's BLIND RE-DERIVATION started from the a-invariants alone,
      before opening any producer file, and ran PARI's own ellrank: [12, 12] at
      effort 1 and again at effort 2, with TWO DIFFERENT 12-point sets, neither
      of them the producer's. Because r_high = 12 is an unconditional upper
      bound, rank E(Q) is EXACTLY 12 -- the producer's lower bound is sharp and
      no better point search could have beaten it. The three regulators
      (~4.7e11, ~1.2e13, ~5.83e9) are three lattice covolumes of one rank-12
      group, which is what genuinely different generating sets look like.
      IMPORTANT: this 12 came from the tier-1 global-top arm under a 20 s alarm.
      The matched tier-2 arms ran at 8 s and their maximum is 11.
    source: [RUN-ECQ-81141a-004, certified_curves.json, validation_report joint 2
      and blind_rederivation, red_team RTC-2]

  - id: OBS-4
    what: All 137 certified ranks re-derived twice, independently, with zero
      mismatches; no rank is inherited and no bound is turned into a rank.
    detail: >-
      Histogram over the 137 distinct certified fibres: rank 8 x93, 9 x14,
      10 x17, 11 x12, 12 x1. Validator: 137/137 curves, every exhibited point
      re-verified on that exact curve in exact Fractions and cross-checked with
      PARI ellisoncurve, 0 points off curve; r x r regulator recomputed at 38
      and 115 digits with its own eigenvalue count; its rank equals the claim on
      all 137, never below AND NEVER ABOVE. Red team: same 137 re-traced with a
      wholly separate implementation, 0 points off curve, 0 rank mismatches, and
      in all 54 completed descents certified_rank == ellrank r_low == r_high.
      THE SILVERMAN-INHERITANCE ATTACK FAILS CLEANLY: for each of the 137 the
      validator re-specialised all eight Q(t) sections, recovered the scaling u
      from the a-invariants, and confirmed the producer's first eight exhibited
      points ARE those specialised sections -- 137/137 -- so the rank-8 floor is
      re-exhibited on each specialised curve and never inherited from the
      generic fibre. THE POINT-FREE-BOUND ATTACK FAILS CLEANLY: all 83 fibres
      with descent_status timeout claim exactly 8, the section floor, and not
      one point more; no curve anywhere claims a rank above the r_high recorded
      beside it. The GOAL-ECRANK-001 failure mode (a proven bound with no point)
      does not occur.
    source: [validation_report joint 2 part_a, red_team 1.2 / RTC-2]

  - id: OBS-5
    what: AXIS 2 -- sieve volume, as numbers.
    detail: >-
      Tier 1: 97,640 specialisations t = p/q, gcd(p,q) = 1, |p| <= 2000,
      q <= 40, all scored with S(1000) at 1.028 ms each (100.4 s); 0 singular
      fibres in the domain. Tier 2 matched sub-domain |p| <= 150, q <= 8:
      1,548 specialisations. Matched arms K = 60 each (MN top-60 vs uniform
      random 60 drawn with seed 81141 from the SAME 1,548), overlap 2. Descent
      was attempted on 140 fibres covering 137 distinct t; 84 attempts timed out
      (83 of the 137 distinct fibres), leaving 56 completed descents. Mean
      descent cost 7.5 s at an 8 s alarm. Campaign total 1,993.0 s across 7 runs,
      peak RSS 1.22 GB. The binding cost is CERTIFICATION, not scoring: scoring
      the entire 1,548-fibre tier-2 domain costs 1.59 s against 327 s of descent
      in the MN arm alone. The red team independently re-enumerated both domain
      sizes (97,640 and 1,548) and reproduced them exactly.
    source: [RUN-ECQ-81141a-003, RUN-ECQ-81141a-004, RUN-ECQ-81141a-005,
      gap_analysis.json axis_2 (derived fields only), red_team 1.1, 2.4]

  - id: OBS-6
    what: The Mestre-Nagao statistic contributed to NO certified rank, and its
      ordering effect is real, monotone, and survives the timeout confound.
    detail: >-
      Structural: mn_score is called once, in cmd_sieve, and its output flows
      only into list ordering; certify_one and certify_rank never receive it; no
      score field appears in any of the 137 curve records. Empirical: every rank
      was re-derived from exhibited points with no reference to any score.
      Efficiency, ATTEMPTED denominators (as published): MN arm 28/60, 24/60,
      12/60 at rank >= 9, >= 10, >= 11; random control 16/60, 6/60, 0/60.
      Efficiency, COMPLETED-DESCENT denominators (red team; these are the honest
      ones): MN 28/29, 24/29, 12/29 vs control 16/25, 6/25, 0/25, with Fisher
      exact p = 2.6e-3, 1.6e-5 and 1.5e-4. THE GAP WIDENS under conditioning on
      completion and the MN arm had FEWER timeouts (31 vs 35), so censoring
      cannot be manufacturing it. The censoring mechanism was identified rather
      than assumed: over all 120 descended fibres, Spearman(log|a6|, timeout) =
      +0.765 while Spearman(score, timeout) = -0.104 -- timeout is driven by
      coefficient size and is essentially orthogonal to the score. Dose-response
      within the producer's own fibres: mean S(1000) by certified rank is
      990.18 (r8, n10), 995.44 (r9, n14), 999.36 (r10, n18), 1001.97 (r11, n12);
      the BSD-flavoured prediction for the per-rank shift is
      sum_{p<=1000} log p / p = 5.6095 and the observed first step is +5.26,
      with compression at the top as selection on a noisy score requires;
      Spearman(score, rank | completed) = +0.779.
    source: [red_team 1.1-1.4, RTC-1, RTC-3; validation_report
      heuristic_validation_checks]

  - id: OBS-7
    what: DECAY CONTROL THE PLAN NEVER ASKED FOR, run by the red team with an
      independent harness -- the strongest single piece of evidence here.
    detail: >-
      The parameter that should destroy the signal is position in the MN
      ordering. The producer sampled the top and (via the uniform control) the
      middle, never the bottom. The red team descended the BOTTOM 20 of the same
      1,548-fibre tier-2 ordering at the same 8 s alarm with a harness that does
      not import the producer's code: 11 timeouts, 9 completed, ranks
      {4,5,6,6,7,7,7,8,8}, MAX RANK 8, ZERO at rank >= 9. Fisher vs the random
      control p = 9.3e-4; vs the MN arm p = 6.1e-8. Yield falls monotonically
      0.966 -> 0.640 -> 0.000 from top to middle to bottom WHILE THE TIMEOUT
      RATE STAYS FLAT at 51.7% / 58.3% / 55.0%. A confound constant across the
      ordering cannot produce a monotone response along it, so this is a
      measured disproof of the timeout-artifact hypothesis rather than an
      argument against it. The bottom arm also independently returned rank 4 at
      t = 1 and rank 7 at t = 2, reproducing the producer's exceptional fibres:
      the statistic sorts the degenerate fibres to the bottom as well as the
      good ones to the top.
    source: [red_team 1.5, CTRL-4 / RTC-4]

  - id: OBS-8
    what: The certification harness returns the known answer on every object
      whose answer is known, and never more.
    detail: >-
      Alpoge-Howell rank-30 fixture -> exactly 30 (not 29, not 31, not 24), at
      38 and 115 digits, with no rejected eigenvalue. Conductor-37 rank-1 curve
      with 18 supplied points -> exactly 1, smallest accepted eigenvalue 29.13
      against largest rejected 2.77e-115. Empty point set -> 0, run on the best
      curve so the 0 comes from the empty support. Torsion-only support -> 0,
      including 2-torsion on a POSITIVE-rank curve so the 0 is not an artefact
      of a rankless curve. Linearly dependent non-torsion support (a control the
      validator added beyond the plan, aimed at the exact failure mode of the
      producer's discarded first criterion) -> 1, not 3. The producer's own
      first independence criterion returned 24 on the rank-30 fixture and was
      replaced BEFORE any family number was produced; the validator formed its
      own view and agrees the diagnosis and the replacement are correct
      (det/prod(diag) is a squared Hadamard ratio and necessarily under-counts
      as r grows -- a failure that gets worse in the direction of the claim).
    source: [RUN-ECQ-81141a-001, RUN-ECRANK-e1e30e-003, validation_report
      control_checks]

  - id: OBS-9
    what: NEARBY-OBJECT CONTROL, discharged here because the deliverables never
      discharged it. On the headline axis this pipeline is DOMINATED by a
      baseline sitting in the same commit.
    detail: >-
      H-ECQ-cec3c4's proof_search_map pre-registers TASK-20260822-a7a9e8 as the
      nearby object. Not one of the four deliverables mentions it: a grep for
      dominated_by|sota|a7a9e8|ECRANK-002|Mestre-style|baseline returns 0 hits
