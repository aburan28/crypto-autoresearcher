      producer, COMMISSIONED UNDER GOAL-ECRANK-002 and carried forward under
      DEC-20260822-d9bf63, reports max certified rank 13 (2 curves), 29 curves
      at rank 12 and 425 at rank 11, over 34,740 augmented curves scanned in
      1,218 s across 8 runs. The validator re-certified BOTH rank-13 curves and
      ALL 29 rank-12 curves exhaustively, plus 25 sampled at each of ranks 7-11,
      with 0 points off curve, and reproduces a maximum of 13. So the comparison
      is adjudicated, not merely owed. See boundaries B-6 for what the
      domination does and does not mean.
    source: [TASK-20260822-a7a9e8 report.md, highrank_pool.json,
      validation_report joint 2 part_b, red_team 2.5 / OBJ-2]

  - id: OBS-10
    what: The Coordinator's recorded prior was WRONG on the sieve, and this is
      the outcome a pre-recorded prior exists to produce.
    detail: >-
      The committed review plan pre-registered: "If the producer reports a large
      sieve yield, that is the first thing to disbelieve." The red team attacked
      the measurement on the prior's behalf five ways and the measurement won
      every time (OBS-6, OBS-7). THE PRIOR IS OVERTURNED, and the diagnosis is
      structural rather than statistical: the prior rests on EV-ECRANK-b6c9b6,
      which measured a Mestre-Nagao prefilter over 364,756 squarefree twists of
      five rank-0 curves, |d| <= 300,000, primes to 1,500, ellrank on the top 400
      per curve (0.11% of the domain), asking the statistic to detect a 0 -> +5
      excursion at conductor ~1e11. Here every fibre already has rank 8, the ask
      is +1..+3, the domain is one rational elliptic surface at modest
      conductor, and 3.9% of the tier-2 domain was certified. S(N) is a
      rank-EXCESS detector with a per-rank signal of ~5.61 at N = 1000 and a
      noise floor set by the family; a fixed, provably-capped base rank is
      exactly what makes its variance the excess and nothing else. The earlier
      measurement stands unchanged within its own scope -- what did not transfer
      is the generalisation from twists to families. On the validator's own
      joints (1 and 2) the prior was CONFIRMED, not overturned: P1 held and the
      certified rank landed inside the predicted 11-14 band. Recorded so that
      "the reviewers concurred" stays distinguishable from "the reviewers
      concurred with what the Coordinator already believed".
    source: [red_team 1.6, HC-2; validation_report coordinator_prior_outcome;
      EV-ECRANK-b6c9b6; dispatch_queue.json review_plan.coordinator_prior]

