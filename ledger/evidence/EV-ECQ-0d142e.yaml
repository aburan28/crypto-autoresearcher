  inference: >-
    Within one pencil of plane cubics through eight specified rational points,
    this program built the record-class pipeline end to end and certified an
    elliptic curve over Q of rank EXACTLY 12, with a committed, content-bound,
    twice-independently-re-derived witness. It measured the distance to the open
    target 31 on both axes the record is actually made of. Axis 1: base rank
    over Q(t) achieved 8, against the roughly 18-20 the published records rest
    on -- and 8 is not a shortfall of effort but a THEOREM about the object,
    since a pencil of plane cubics through 8 points is a rational elliptic
    surface with a squarefree degree-12 discriminant, so Shioda-Tate caps and
    attains 8 exactly. Axis 2: 97,640 specialisations scored at 1.028 ms each,
    1,548 in the matched box, 140 descents attempted on 137 distinct fibres, 84
    timeouts, 56 completed, 1,993.0 s total. The two axes are not
    interchangeable, and that is the campaign's actual result: MORE SIEVING OF
    THIS SURFACE CANNOT SUPPLY BASE RANK. Reaching the record ladder requires a
    K3 or higher elliptic surface, not a bigger search of a rational one.
    Secondarily and separately: the Mestre-Nagao statistic, which this program
    had previously measured failing on rank-0 twist families, orders THIS family
    well -- monotonically, with a dose-response matching the BSD-flavoured
    per-rank prediction to within 6%, and with the timeout confound measured and
    excluded by three independent routes. The prior that said to disbelieve a
    large sieve yield was over-generalised from twists to families and is
    overturned for this object only.
  boundaries:

  - id: B-1
    statement: >-
      RANK >= 31 OVER Q WAS NOT ACHIEVED AND REMAINS AN OPEN WORLD RECORD.
      The largest rank known for an explicit curve over Q is 30 (Alpoge-Howell
      2026), after 29 (Elkies-Klagsbrun 2024) and 28 (Elkies 2006). Nothing in
      this record approaches it. The best rank certified here is 12; the
      shortfall to 31 is 19. A rank-12 curve from a rank-8 Q(t) base is NOT a
      fraction of the way to 31 -- the ladder rests on a different base-rank
      regime, not on a smaller version of the same one. Completion criterion C1
      of GOAL-ECQ-001 is NOT MET, and no part of this record may be read as
      progress toward it.

  - id: B-2
    statement: >-
      THE CLOSURE CLAIM IS NARROWED BY ONE QUANTIFIER, as the red team's OBJ-8
      requires. Shioda-Tate caps the BASE rank over Qbar(t) at 8 -- a theorem.
      It caps NOTHING about the rank over Q of a specialisation, which is
      8 + extra, and `extra` is unbounded by anything measured here. The only
      support for "extra stays small" is extra <= 4 over 56 completed descents
      out of 140 attempted, in a box of 1,548 fibres drawn from a domain of
      97,640, itself a finite window on an infinite fibration -- and the
      published ladder is built by finding `extra` of order +10 to +12 on higher
      surfaces, so large `extra` is not a priori absurd, merely unobserved here.
      The defensible statement, and the only one this record makes:
      31 IS UNREACHABLE BY THIS SEARCH AS RUN; IT IS NOT PROVEN UNREACHABLE BY
      THIS SURFACE. H-ECQ-cec3c4's phrase "this route CANNOT reach 31" is
      supported only in that narrowed form.

  - id: B-3
    statement: >-
      Every number here is scoped to ONE pencil, ONE 8-point configuration, ONE
      seed (81141), ONE arm size (K = 60), ONE tier-2 box (|p| <= 150, q <= 8),
      PARI/GP 2.15.4 ellrank under 8 s and 20 s alarms, python 3.11.15 with
      cypari, no Sage. n = 1 family. Nothing is claimed for other pencils, other
      point configurations, other N, other surfaces, or larger t. The
      Mestre-Nagao result in particular is a property of THIS pencil and must
      not be widened; the red team's CTRL-2 (replicate the matched-arm design on
      a second 8-point configuration) is NOT RUN.

  - id: B-4
    statement: >-
      THE HEADLINE 12 IS CENSORED AND WAS OBTAINED UNDER A DIFFERENT BUDGET FROM
      THE MATCHED ARMS. 84 of 140 attempted descents timed out (60%), so 12 is a
      maximum over the 56 fibres actually descended, not over the family; if any
      censored fibre carries rank >= 13 the shortfall is smaller. The direction
      is conservative -- it understates the family -- but the qualifier belongs
      with the number. Separately, the 12 comes from the tier-1 global-top arm
      at a 20 s alarm (18 of 20 timed out there); the matched 8 s tier-2 arms
      have maximum 11, and gap_analysis.json does not distinguish them.

  - id: B-5
    statement: >-
      Efficiency rates published with denominators of 60 include 31 and 35
      never-descended fibres and are joint measurements of a rank property and a
      solver budget under a name that attributes all of it to the statistic.
      They are correctly labelled lower bounds; the conditional rates in OBS-6
      are the ones to quote. Likewise the rarity statistic "at most +4 across
      140 fibres" has an honest denominator of 56 completed descents, not 140
      attempted -- "1 in 140" should be read "1 in 56", a 2.5x difference. Both
      are presentation defects in the immutable producer artifacts, corrected
      here rather than there.

  - id: B-6
    statement: >-
      12 IS A WITHIN-FAMILY MAXIMUM FOR THIS PENCIL AND IS NOT THE PROGRAM'S
      BEST CERTIFIED RANK OVER Q. In this same snapshot, the carried-forward
      Mestre-style producer commissioned under GOAL-ECRANK-002 certifies 13, and
      the validator independently re-certified both rank-13 curves and all 29
      rank-12 curves. On the axis this pipeline chose as its headline, it is
      DOMINATED by that baseline: 13 > 12, at 1,218 s versus 1,993.0 s. What the
      domination does NOT cover, stated so the comparison is not read as more
      than it is: (i) the pencil route's 12 is EXACT (ellrank r_high = 12),
      while the Mestre route's 13 is a lower bound with no upper bound available
      at all -- its own RUN-008 recorded 31/31 ellrank timeouts at coefficient
      sizes a4 ~ 1e19, a6 ~ 1e28, an infrastructure outcome that decides nothing
      in either direction; (ii) the pencil route's base-rank ceiling is a
      theorem, which the Mestre route does not offer; (iii) peak memory is
      reported for this pipeline (1.22 GB) and not per-run for the Mestre route,
      so the memory axis of the comparison is INCOMPLETE and is recorded as
      incomplete rather than estimated.

  - id: B-7
    statement: >-
      Every rank reported over Q is an UNCONDITIONAL LOWER BOUND from exhibited
      points on that exact curve, except where an ellrank r_high is explicitly
      cited as an unconditional upper bound. No analytic rank, no Selmer bound,
      and no point-free bound contributes anywhere. Silverman specialisation
      motivated the search and certifies nothing: the rank-8 floor is
      re-exhibited on each of the 137 specialised curves.

  - id: B-8
    statement: >-
      This record supports no ECDLP claim, demonstrates no speedup, and makes no
      asymptotic-complexity claim (H-ECQ-cec3c4.asymptotic_claim is explicitly
      null, and the four promotion gates for such a claim are therefore not
      engaged). The published base-rank figure "roughly 18-20" is a RECALLED
      literature reference labelled background and NOT measured by this program;
      it is repeated here only with that label, and the axis-1 "gap of 10 to 12"
      is consequently a scoped estimate against an unmeasured comparator, not a
      measurement of the same kind as axis 2.

