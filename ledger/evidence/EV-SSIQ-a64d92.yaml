evidence:
  id: EV-SSIQ-a64d92
  hypothesis_id: null
  hypothesis_id_note: >-
    Explicitly null, not omitted: this batch formalizes a statistical
    control (specification_v7.yaml's own OBJECTIVE_BOUNDARY) into an
    archived record. It does not test H-SSIQ-36e970's real-arm prediction
    and does not gate any decision rule. Per RT-BATCH-010 Front 4/OBJ
    findings, it remains orthogonal to H-SSIQ-36e970's DIRECTIONAL-gradient
    question -- ANOM-1's spatial-autocorrelation signal concerns UNDIRECTED
    local clustering, a different test.
  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  batch_id: BATCH-010
  experiment_ids: [EXP-SSIQ-a85692]
  run_ids: [RUN-SSIQ-a85692-g]
  type: empirical
  direction: neutral
  direction_note: >-
    NEUTRAL. This batch formally archives a control already run informally
    in BATCH-009. It strengthens confidence in an existing empirical
    observation's reality (not a coarse-alphabet artifact) but explicitly
    does not resolve, and does not attempt to resolve, the funnel-structure
    mechanism question or any claim toward H-SSIQ-36e970 or lever L4.
  strength: preliminary
  strength_note: >-
    preliminary, campaign-wide cap unchanged (session-only independence).
    The formalized 1000-trials/prime result is a genuine, non-trivial
    strengthening of BATCH-009's informal 15/30-trial finding on TWO
    specific axes, independently confirmed by both reviewers: (1)
    PRECISION -- the formal means converge to within ~1 percentage point
    of both prior informal samples, with a standard error at N=1000
    roughly 20-40x smaller than the population standard deviation,
    confirming the informal means were not lucky small-sample draws; (2)
    TAIL CHARACTERIZATION -- the formal run's observed maxima are higher
    than either informal sample's own maxima (as expected from a larger
    sample), newly establishing PER-PRIME MARGINS between the null
    distribution's observed maximum and the real data's 100%: 23.1
    percentage points (p=2437, the TIGHTEST margin), 45.9 points (p=3889),
    48.7 points (p=5737), 40.9 points (p=7333) -- roughly 3-4 population
    standard deviations above each prime's own null mean. This strengthens
    confidence in the SIGNAL'S EXISTENCE, not its CAUSE (see O-3 below).
  claim_tier: toy
  claim_tier_note: >-
    Toy scale / infrastructure and statistical-control archival scale. The
    four primes and their delta_map are the same already-archived data
    reused since BATCH-005/BATCH-008; the 4000 permutation trials (1000
    per prime) are pure arithmetic on that already-archived multiset, zero
    new search cost.
  proof_status: empirical_only
  proof_refs:
    - experiments/EXP-SSIQ-a85692/runs/RUN-SSIQ-a85692-g/permutation_null_control.json
    - experiments/EXP-SSIQ-a85692/runs/RUN-SSIQ-a85692-g/execution_report.yaml
    - coordination/goals/GOAL-SSIQ-001/batches/BATCH-010/reviews/VAL-BATCH-010.md
    - coordination/goals/GOAL-SSIQ-001/batches/BATCH-010/reviews/RT-BATCH-010.md
  preregistration_binding:
    specification: experiments/EXP-SSIQ-a85692/specification_v7.yaml
    freeze_commit: 6bdaecb8
    verified_by: TASK-20260806-08f905
    detail: >-
      specification_v7.yaml frozen 2026-08-06 at commit 6bdaecb8, after
      TWO pre-freeze Red Team review rounds (round 1: DO-NOT-FREEZE, two
      blocking findings -- a silently weakened coverage assertion, an
      unscoped failure-handling branch on the anomaly path -- plus five
      advisory; round 2: FREEZE-WITH-FIXES, both blocking fixes
      independently re-traced formula-by-formula against
      trapping_diagnostic_v5.py's own code and confirmed holding, three
      further advisory findings applied). The Validator independently
      confirmed manifest.yaml's code.commit equals the freeze commit, and
      independently RE-EXECUTED the run's own script twice from clean
      scratch directories, reproducing permutation_null_control.json
      byte-for-byte identical (true C-REPRO, including all four primes'
      full 1000-element raw trial lists, not merely summary statistics).
  observations:
    - id: O-1
      statement: >-
        THE 1000-TRIALS-PER-PRIME NULL CONTROL IS NOW FORMALLY ARCHIVED,
        IMMUTABLE, AND INDEPENDENTLY REPRODUCIBLE -- confirmed by the
        Validator via TWO independent from-scratch re-executions (not the
        Executor's own self-report), byte-for-byte identical outputs
        including every raw trial value. The two-part coverage/graph-
        rebuild verification (restored per v7's own PF-1 fix, matching
        specification_v6.yaml's established two-check standard exactly)
        passes on all four primes, and REAL_DEPTH0_FRACTION equals exactly
        1.0 on all four primes (95/95, 132/132, 194/194, 287/287),
        precisely reproducing RUN-SSIQ-a85692-f's own archived ANOM-1
        figures -- independently re-verified by this Coordinator, the
        Validator, and the Red Team, all directly against the archived
        JSON.
      supported_by: [TASK-20260806-fde273, TASK-20260806-9ad6b5, TASK-20260806-08f905, TASK-20260806-497010]
      confidence: high
    - id: O-2
      statement: >-
        THE FORMALIZED RESULT NON-TRIVIALLY STRENGTHENS BATCH-009's
        INFORMAL FINDING, ON TWO SPECIFIC, DISTINCT AXES -- INDEPENDENTLY
        CONFIRMED BY THE RED TEAM AND RE-VERIFIED BY THIS COORDINATOR
        DIRECTLY AGAINST THE ARCHIVED DATA (both the informal figures in
        EV-SSIQ-0fc992/RT-BATCH-009 and this batch's own
        permutation_null_control.json). PRECISION: formal means (2437:
        58.2%, 3889: 37.4%, 5737: 36.3%, 7333: 45.5%) converge to within
        0.4-1.1 percentage points of both the Red Team's 30-trial informal
        means (57.1%/37.8%/35.3%/46.5%) and this Coordinator's own
        15-trial reproduction (57.9% for p=2437) -- at N=1000 the standard
        error of each mean is roughly 0.15-0.2 points against population
        standard deviations of 3.9-6.1 points, confirming the informal
        small-sample means were not lucky draws. TAIL CHARACTERIZATION:
        the formal run's observed per-prime maxima (76.9%, 54.1%, 51.3%,
        59.1%) exceed both informal samples' own maxima and, for the FIRST
        TIME in this campaign, establish PER-PRIME MARGINS between the
        null distribution's plausible reach and the real data's 100%:
        23.1 points (p=2437, the TIGHTEST of the four -- worth citing
        explicitly, not folded into an undifferentiated "far below 100%"
        claim), 45.9 points (p=3889), 48.7 points (p=5737), 40.9 points
        (p=7333). NULL_EXCEEDS_OR_EQUALS_REAL_COUNT == 0 on every prime
        (0 of 4000 total trials) is correctly reported and genuinely
        strong, but its evidentiary weight is carried by these MARGINS,
        not the bare zero count -- a null count of exactly 0/1000 is, by
        itself, compatible with a one-sided permutation p-value anywhere
        from 0 up to roughly 1/1001 at this trial count.
      supported_by: [TASK-20260806-497010]
      confidence: high
    - id: O-3
      statement: >-
        THIS STRENGTHENING IS ABOUT CONFIDENCE IN THE SIGNAL'S EXISTENCE,
        NOT ITS CAUSE. specification_v7.yaml's own PF-6 finding (round 1
        pre-freeze review) names a confound this control CANNOT, by
        construction, rule out: whether the observed graph-edge spatial
        autocorrelation of delta_E reflects genuine near-Lipschitz
        mathematical structure in the smooth-isogeny-degree pseudometric,
        or an artifact of the delta_E-computation PROCEDURE itself
        (compute_delta_e.py's shared, sequentially-advancing per-prime RNG
        under a shrinking per-vertex time budget, in sorted-tuple rather
        than graph order). This batch's own OBJECTIVE_BOUNDARY correctly
        states PF-6 in full, and the run's own execution_report.yaml
        ANOM-1-CONTEXT observation correctly draws no mechanism
        conclusion. THE RED TEAM FOUND A CONCRETE PROPAGATION GAP,
        INDEPENDENTLY RE-CONFIRMED BY THIS COORDINATOR: PF-6's specific
        text does NOT appear in permutation_null_control.json's own
        objective_boundary field (the archived JSON's own boundary
        statement is generic toy-scale prose, no mention of PF-6), nor in
        manifest.yaml, the receipt, or any machine-readable artifact in
        this run's own package -- a reader consulting only the archived
        result, not the full frozen spec text, would not learn of this
        confound. THIS EVIDENCE RECORD IS THE DISCLOSED CORRECTION THAT
        CLOSES THAT GAP (per the Red Team's own required_controls item),
        since RUN-SSIQ-a85692-g's own artifacts are immutable and cannot
        be edited.
      supported_by: [TASK-20260806-497010]
      confidence: high
    - id: O-4
      statement: >-
        DEC-20260806-498531's D-2 rationale (BATCH-009's closing decision)
        stated, at confidence: high, that ANOM-1 "establishes genuine
        spatial autocorrelation of delta_E along graph edges as a new,
        previously unrecorded structural fact about this labelling
        scheme." That decision PREDATES PF-6 (first raised only during
        THIS batch's own v7 pre-freeze review) and is not itself defective
        -- it was correct given what was known at BATCH-009's close. BUT,
        per the Red Team's explicit finding, that language MUST NOT be
        extended unqualified to this batch's newly-formalized result. THE
        ACCURATE COMPOUND CLAIM, STATED HERE FOR THE FIRST TIME: the
        signal is control-confirmed against the coarse-alphabet-pigeonhole
        null (ruled out, with high confidence, by both the informal and
        now the formal 1000-trial control), but is NOT YET distinguished
        from a delta_E-search-procedure artifact (PF-6, untested by any
        run in this campaign to date). "Genuine structural fact" overstates
        what either control (informal or formal) can support; "real,
        control-confirmed clustering signal of undetermined cause" is the
        correct, narrower framing this record adopts going forward.
      supported_by: [TASK-20260806-497010]
      confidence: high
  inference: >-
    The delta_E label-permutation null control is now formally archived,
    immutable, and independently reproducible, non-trivially strengthening
    BATCH-009's informal finding on precision and tail-characterization
    grounds -- the pattern is confirmed not to be a coarse-alphabet
    pigeonhole artifact, with a quantified, per-prime margin between the
    null distribution's plausible reach and the real data's universal
    depth==0 result. This strengthening is scoped strictly to the signal's
    EXISTENCE: PF-6's named confound (a delta_E-search-procedure artifact
    vs. genuine mathematical structure) remains entirely untested by any
    run in this campaign, and this record explicitly declines to extend
    DEC-20260806-498531's prior "genuine structural fact" language to this
    batch's result without that caveat attached. The funnel-structure
    mechanism question (DEC-20260806-498531's next_actions item (2))
    remains untouched and unresolved -- this batch's own archival purpose
    does not constitute progress toward it.
  boundaries:
    - >-
      This run makes NO claim about H-SSIQ-36e970, about a delta_E-
      gradient's existence, or about a p^{1/4} algorithm. Lever L4 is NOT
      retired by this record.
    - >-
      PF-6's confound (delta_E-search-procedure artifact vs. genuine
      near-Lipschitz graph-spatial structure) is UNRESOLVED and untested
      by this batch, per its own declared zero-new-search-cost scope. The
      accurate framing of ANOM-1 going forward is "real, control-confirmed
      clustering signal of undetermined cause," not "genuine structural
      fact" (superseding DEC-20260806-498531 D-2's unqualified language
      for any future citation of this specific control result).
    - >-
      NULL_EXCEEDS_OR_EQUALS_REAL_COUNT == 0/4000 must be cited alongside
      its per-prime margins (23.1/45.9/48.7/40.9 percentage points),
      never as an undifferentiated bare zero -- p=2437's margin is the
      tightest of the four and meaningfully weaker evidence than the
      other three primes'.
    - >-
      The funnel-structure mechanism question (which structural local
      minima capture the most walks) remains untouched by this batch.
    - >-
      Evidence strength capped at preliminary, campaign-wide and
      unchanged by this batch: independence remains session-only.
  unresolved_confounds:
    - >-
      PF-6's own named next step is the correct, cheapest discriminating
      control for the procedure-vs-structure question: a probe re-run of
      the delta_E search with per-vertex-independent, freshly-seeded RNG
      (removing compute_delta_e.py's shared, sequentially-advancing
      rng_search instance and its shrinking per-vertex time budget),
      checking whether the graph-edge spatial-autocorrelation signal
      persists. UNRESOLVED, not attempted by any run in this campaign.
    - >-
      The funnel-structure mechanism question is REFRAMED since BATCH-009
      (DEC-20260806-498531 O-4/D-3) and remains UNRESOLVED after this
      batch: a future amendment needs a depth operationalization with
      demonstrated non-degenerate variance at whatever delta_E resolution
      it runs at.
    - >-
      Model independence remains absent and unverifiable in this
      environment, unchanged from every prior batch.
