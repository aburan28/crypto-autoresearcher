    - No discovery claim. The rule is known theory (Serre-Tate/Kummer; Belding 2007, section 7). This record must not be cited as experimental evidence for, or as the discovery of, the canonical-lift obstruction.
    - Nothing bears on deployed curves or on ECDLP generally. Anomalous curves are already solvable in polynomial time on any non-canonical lift.
