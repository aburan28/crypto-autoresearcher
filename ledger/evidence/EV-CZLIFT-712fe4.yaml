  obstruction:
    statement: >-
      On a Z_p-lift E^ of an ordinary anomalous E/F_p, Smart's precision-p^2
      residue degenerates for every point and every section exactly when
      E^(Z/p^2) is (Z/p)^2. This is the case exactly when the lift lies in
      the canonical class mod p^2 (v_p(j(E^) - j_can) >= 2e). On such a lift
      the next digit succeeds exactly when the section is d-homogeneous mod
      p^2. A known theorem, recorded as a reusable measurement; it closes no
      lane.
    quantity: >-
      (a) Agreement of the point-independent degeneracy flag with the
      j-distance rule. (b) The number of degenerate lift classes mod p^2 per
      curve. (c) The pooled next-digit success count on degenerate rows
      against the matching null.
    value: >-
