  inference: >-
    H-CZLIFT-889c9d holds at toy tier in this scoped form. Scope: the 29
    class-number-one CM anomalous curves with 7 <= p <= 1373 (D in {-3, -11,
    -19, -43, -67, -163}); unramified integral short-Weierstrass Z_p-lifts in
    the four sampled classes (v_p(Δj) in {1, 2, 3, ∞} at e = 1 and {3, 6, ∞}
    at e = 3); precision p^8; the naive, Teichmuller and one-digit Hensel
    sections.
    (1) The degeneracy flag v_p(z([p]P^)) >= 2 agreed with the j-distance
    rule v_p(Δj) >= 2e on 14,616/14,616 rows. This calibrates two
    code-independent instruments against a statement that follows from
    Serre-Tate/Kummer theory (derivation: red-team R1; prior art: Belding
    2007, section 7). It is not independent empirical evidence for that
    statement. At j = 0 the threshold is pinned only to (3, 6].
    (2) Smart's ratio recovered d on 2,052/2,052 rows per seed with
    v_p(Δj) < 2e (Smart's theorem).
    (3) On degenerate lifts the pooled next-digit success count was
    consistent with the random-section null on both seeds. Under the matching
    null 1/(p+1): 93 and 87 successes against 86.84 expected (z = +0.68,
    +0.02). Under the exact nulls conditioned on the actual lifts: z = +1.54,
    +0.75. The rate is not 1/p per cell for deterministic sections: on j = 0
    lifts with A ≡ 0 mod p^2, the Teichmuller section never succeeds on d in
    mu_6 \ {±1} (rate 0 at p = 7).
    The mechanism's recovery sentence holds with the operative condition "P
    has no torsion lift in E^(Q_p)". That condition coincides with "E^[p]
    non-split" only because #E(F_p) = p.
  boundaries:
    - The 29 class-number-one CM anomalous curves with 7 <= p <= 1373 only, at precision p^8.
    - Unramified integral short-Weierstrass Z_p-lifts in the four sampled classes. Not lifts over ramified extensions or W(F_{p^k}).
    - The three tested sections (naive, Teichmuller, Hensel with one random x-digit). Not "every non-canonical section".
