      the red-team fiber sweep. These are exact counts of a deterministic
      flag, with no sampling error.
      (b) Exactly 1 of p classes on each of the 29 curves.
      (c) 93/5,256 and 87/5,256 successes per seed (0.0177 and 0.0166)
      against 86.84 expected under 1/(p+1); the null count sd is about 9.0
      (z = +0.68, +0.02). Per seed, the 4-sigma detectable absolute excess is
      0.0069.
    measured_by: [RUN-CZLIFT-041d05, RUN-CZLIFT-6709c9, EXP-CZLIFT-17b7eb]
    measured_by_note: >-
      Values (b) and the 12,778-lift part of (a) come from the red-team
      sweep, experiments/EXP-CZLIFT-17b7eb/reports/redteam-20261023/rt_r1_fiber_output.json.
      They are review data, not frozen runs.
    scope: >-
      29 class-number-one CM anomalous curves with 7 <= p <= 1373, unramified
      Z_p-lifts, precision p^8, three sections. The theorem's own scope (any
      ordinary anomalous curve, unramified lifts) is carried by the
      derivation, not by this measurement.
    resource_check:
      examined: true
      reading: >-
        Three readings, after the red team's obstruction_resource_readings.
        (1) The one-bit invariant "E^(Z/p^2) split" recognizes the canonical
        class mod p^2 in O(log p) p-adic operations without knowing j_can.
        Canonical-lift computation (Satoh-type point counting) takes such a
        bit as its input; that pointer is recalled, not retrieved. It is no
        ECDLP resource, because anomalous curves are already polynomial-time
        on any non-canonical lift.
        (2) On a split lift the homomorphic sections mod p^2 form a torsor
        under Hom(E(F_p), F_p). Every non-torsion homomorphic section is a DL
        oracle, so a section with rate 1/p + eps has DL advantage eps.
        Finding a useful section on the canonical lift is therefore
        equivalent to DL. This is a reduction, not an impossibility, and it
        suggests no attack. It does yield a design simplification for sibling
        experiments: measure section d-homogeneity mod p^2 directly.
        (3) The Teichmuller mu_6 forced failure is the CM automorphism group
        acting through conjugate embeddings. The theory that uses the same
        automorphisms is the sqrt(|Aut|) Pollard-rho speedup (recalled), so
        there is no new leverage.
        No theory takes these measurements as a hypothesis for an ECDLP
        improvement.
      spawned_ids: []
      spawned_ids_note: >-
        The design simplification in reading (2) goes to the Coordinator's
        next actions (DEC-20261023-147f9f) for sibling contracts. It is not
        filed as an idea, because it is a measurement method, not a
        mechanism.
