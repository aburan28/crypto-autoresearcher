        the n-fold ceiling) and when the trade is a net win, which the proposal
        explicitly listed as beyond its reach.
    - record: DEC-20260920-f1e672
      relation: >-
        Its mandatory repair is respected. The a77711 attribution defect
        concerned 9abf42's LADDER and its A-vs-B first-fall prior; this
        experiment preregisters no first-fall or solving-degree prediction and
        cites no a77711 corollary, so the corrupted preregistration is not
        inherited. IDEA-20260918-9abf42 is not rewritten.
    - record: H-FROB-73df22
      relation: >-
        Consistent with, and independent of, its Lemma A2 intuition that a
        symmetry permuting n copies of a problem saves no degree. This record
        measures the factor-base side only and takes no position on the
        solving-degree side.
    - record: H-FROB-a5bf86
      relation: >-
        Neither supports nor weakens it. It explains why the goal's preregistered
        cells n = 41 / m = 2 and n = 43 / m = 3 are the right places to look, but
        the WDSat conflict-ratio question is untouched.
