  type: structural_exact
  direction: supports
  strength: strong
  strength_basis: >-
    Every quantity is an exact finite count, not a sample: there is no estimator,
    no variance and no p-value to weaken. Each structural claim is carried by at
    least two derivations that share no step (divisor enumeration vs
    sigma-closure vs exhaustive subspace enumeration vs direct orbit iteration;
    and annihilator/totient vs Burnside for the census), and the curve-level
    claims carry two controls that must fail and did fail on every cell. Strength
    is `strong` rather than `decisive` for one reason stated plainly below: the
    curve panel reaches only toy field sizes, so clause (iii) is verified
    exactly at 14 cells and argued, not measured, at cryptographic n.
  claim_tier: structural_exact
  certificate_refs: []
  certificate_note: >-
    certificate.kind = none. No discrete logarithm is solved, no relation is
    claimed and no deployed curve is an attack instance, so the solution
    certificate gate in docs/claims-and-verification.md does not apply. The real
    extension degrees appear only as parameters of an exact structural census.
  proof_status: derivation
  proof_status_note: >-
    `derivation` rather than `empirical_only`: each structural claim is a
    derivation from the module structure of F_{q^n} over F_q[T]/(T^n - 1) that
    the run then confirms by exhaustive computation, and the exact orbit-count
    prediction P4 is a closed-form derivation checked against measurement on
    every cell. No solution certificate exists or is owed (certificate.kind =
    none), so `certificate` would be wrong.
  proof_refs:
    - experiments/EXP-FROB-ec08b5/runs/RUN-FROB-627924/raw-result.json
    - experiments/EXP-FROB-ec08b5/runs/RUN-FROB-627924/metrics.json
    - experiments/EXP-FROB-ec08b5/runs/RUN-FROB-627924/report.md
    - experiments/EXP-FROB-ec08b5/runs/RUN-FROB-627924/execution-receipt.json

  observations:
    - >-
      P1 HELD. Four independent methods -- monic divisors of T^n - 1 from
      q-cyclotomic cosets; sigma-closure of single vectors; exhaustive
      enumeration of every F_q-subspace by reduced row echelon form; direct
      orbit iteration -- agree exactly on subspace count, dimension spectrum and
      orbit-length census on all 12 lattice cells, 10 of them also verified
      exhaustively. The cells include p | n, where T^n - 1 is not squarefree and
      the divisor lattice is not Boolean.
    - >-
      P2 HELD. The F_q[T]-annihilator/totient derivation and the Burnside
      derivation of the orbit census agree on all 200 stable subspaces across 15
      census cells, 0 mismatches. The cells include composite n (8, 9, 15, 21)
      carrying intermediate orbit lengths that properly divide n, which is where
      the two derivations would most easily part company.
    - >-
      P3 HELD. On all 14 curve cells a sigma-stable V gives a pi-stable factor
      base; a uniformly random non-stable V' of the SAME dimension never does;
      and the null object -- a curve over F_{q^n} lying over no proper subfield
      -- never does. Both controls failed on every cell, as required.
    - >-
      P4 HELD EXACTLY, 14 of 14 cells. The number of pi-orbits on F_V equals
      f + (|F_V| - f)/n exactly, where f is the number of affine E(F_q) points
      inside F_V -- i.e. every orbit not inside E(F_q) has length exactly n. The
      largest cell is q = 2, n = 13, |F_V| = 4005 points, f = 1, 309 orbits,
      measured reduction 12.9612 against n = 13. 6844 factor-base points were
      enumerated in total.
    - >-
      CONSEQUENCE OF P4, and the answer to the part of RQ-FROB-7d8dd4 this
      experiment owns: the Frobenius-orbit gain in the factor base is EXACTLY n
      asymptotically and never more. It is a constant factor in the field size,
      not an exponent move. The n-fold factor-base symmetry the research
      question calls trivial is now measured rather than assumed, and it is
      confirmed to be the whole of the gain available at this stage.
    - >-
      P5 HELD. At q = 2, n = 131 (the ECC2K-130 extension degree) there are
      exactly FOUR sigma-stable subspaces, of F_2-dimensions 0, 1, 130 and 131,
      and the smallest one on which Frobenius acts non-trivially has dimension
      130. The unique stable LINE is F_2 itself, on which Frobenius acts
      trivially, so it carries no orbits at all. For every m in {2,3,4,5} the
      orbit trick is therefore a NET LOSS, by between 57.0 and 96.0 bits. The
      same holds at n = 163 (NIST K-163 / B-163): four stable subspaces of
      dimensions 0, 1, 162, 163, and a net loss of 72.7 to 121.7 bits.
    - >-
      The obstruction is arithmetic, not geometric. Availability is governed
      entirely by d = ord_n(q): the attainable dimensions are the subset sums of
      the degrees of the irreducible factors of T^n - 1, which for n prime is
      the coarse lattice {a + b d : a in {0,1}, 0 <= b <= (n-1)/d}. It does not
      depend on the curve, on the basis used to write field elements, or on the
      solver. Where q is a primitive root mod n the lattice degenerates to
      {0, 1, n-1, n} and no index-calculus dimension survives.
    - >-
      Availability is an arithmetic lottery across the real binary degrees, not
      a uniform verdict. Net win available in the panel at n = 113 (m = 2, 4, 5),
      127 (all of m = 2..5), 233 (m = 2, 4), 239 (m = 2), 283 (m = 3), 409
      (m = 2), 571 (m = 5); never at n = 131 or 163. The verdict is also
      NON-MONOTONE in m -- at n = 113, m = 3 loses by 11.2 bits while m = 2 and
      m = 4 win by 6.8 -- because the attainable set is a lattice of spacing d
      and ceil(n/m) lands on or off it by an arithmetic accident.
    - >-
      The base field matters as much as the degree. At the same n = 41, ord is
      20 for q = 2 and q = 8 but 8 for q = 3 and 10 for q = 4, so the design
      space has 8, 8, 64 and 32 stable subspaces respectively and the set of m
      admitting a net win changes with it.
    - >-
      INDEPENDENT VINDICATION OF GOAL-FROB-6333a9's OWN CELL CHOICES, arrived at
      from the module side and not from the WDSat side. The goal's primary cell
      is n = 41, m = 2 and its decisive cell is n = 43, m = 3. Those are exactly
      the cells at which the net-win margin is positive with zero dimension
      penalty: n = 41 admits a net win at m = 2 and at no other m in {2,3,4,5};
      n = 43 admits one at m = 3, 4, 5 and not at m = 2. The preregistered
      choice was correct for a reason the goal had not recorded.

