    raw_result_sha256: 6f8486cee18969239e0d299c28caf5b81a03ef87f688f9468df11f3674471b70
    raw_result_sha256_note: >-
      raw-result.json embeds per-cell wall_seconds, so it is not byte-identical
      across executions even though every scientific value in it is. The hash
      pins THIS run's bytes; a re-execution is expected to reproduce the
      measurements exactly and the hash not at all.

  scope_and_limits:
    - >-
      Scoped to the Gaudry/Diem factor-base family F_V = {P : x(P) in V} with V
      an F_q-subspace of the x-line. Nothing here is asserted about Joux-Vitse
      variants, factor bases cut by non-linear conditions, or GHS Weil descent,
      each of which selects its factor base differently.
    - >-
      Clause (iii) -- every non-E(F_q) orbit has length exactly n -- is verified
      exactly at 14 toy cells with field sizes up to 2^13, and derived for
      general odd prime n. It is NOT measured at cryptographic n, and the
      evidence strength is capped at `strong` for that reason.
    - >-
      Two curve cells (q = 2, n = 7, dim 3 and dim 4) have factor bases of 1 and
      3 points. The exact prediction holds there too, but cells that small carry
      no statistical content and support only the exactness claim, not any
      statement about typical behaviour.
    - >-
      The net-win inequality compares the SAME pipeline with and without the
      orbit quotient, under the standard proportionality of relation count and
      linear-algebra dimension to the number of factor-base classes. It does not
      claim an absolute cost, and it does not claim index calculus beats Pollard
      rho at any of these parameters -- a separate comparison RQ-FROB-7d8dd4 also
      asks for and this experiment does not answer.
    - >-
      Structural availability is not practical feasibility. A cell reported as a
      net win at m = 5 says nothing about whether the Semaev polynomial S_6 can
      be solved at that scale; decomposition cost is out of scope here and is
      what the rest of the FROB lane measures.
    - >-
      This experiment says nothing about solving degree or first-fall degree,
      and in particular neither supports nor weakens H-FROB-a5bf86, whose
      question is whether an invariant factor base prunes WDSat conflicts.

  relation_to_prior_records:
