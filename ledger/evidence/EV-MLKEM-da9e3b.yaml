evidence:
  id: EV-MLKEM-da9e3b
  hypothesis_id: H-MLKEM-014
  goal_id: GOAL-MLKEM-004
  batch_id: BATCH-d2a728
  authorized_by: DEC-20260803-4d4528
  recorded_by_task: TASK-20260803-586a7f
  experiment_ids: []
  experiment_ids_note: >-
    No frozen EXP contract. BATCH-d2a728 is the campaign's first measurement
    batch, dispatched under DEC-20260803-4d4528 to establish that the
    measurement can be made at all.
  run_ids: []
  reproduced_baseline: true
  source_task_ids:
    - TASK-20260803-e53ce2
    - TASK-20260803-535d15
    - TASK-20260803-bc2f41
  snapshot_commit: 8cc51677f7205d8b6b2f66e5ba31f0d8bbb84c9e
  type: measurement
  type_note: >-
    The first MEASUREMENT this program has produced on this question. Its
    predecessor GOAL-MLKEM-003 spent twelve batches on estimator arithmetic and
    measured nothing. These are real sieve outputs from g6k 0.1.2, certified
    against the dual lattice by integer arithmetic independent of the sieve.
  direction: mixed
  strength: moderate
  claim_tier: measurement_toy_scale
  certificate_refs:
    - "dual-membership certificate: all 17,919 vectors satisfy y = A^T x (mod q)"
  proof_status: empirical_only
  proof_refs: []

  headline_framing: >-
    The measurement works, its controls hold, and AGREEMENT with the dual
    attack's assumed law is a reachable outcome of this design -- the reviews
    demonstrated agreement on two of its ingredients. The batch-1 null,
    however, removes the wrong thing, and the Coordinator overclaimed from it.

  scope_statement: >-
    Scoped to one LWE instance at dimension 60 (m=35, n=25), q=127, secret
    centred-binomial eta=2, error rounded-Gaussian sigma=2, one seed, one sieve
    algorithm (g6k bgj1_sieve), distinguishing form only with no FFT sub-block
    split. This is TOY SCALE. It says nothing about FIPS 203 dimensions and
    nothing about ML-KEM's security.

  claim_tier_note: >-
    `measurement_toy_scale` under docs/claims-and-verification.md. The
    dual-membership certificate is real and was re-verified independently by
    both reviewers, but a membership certificate certifies the vectors, not any
    inference drawn from their scores.

  direction_note: >-
    `mixed` and not `supports` or `refutes`: on the population the independence
    assumption describes, the assumption HELD under test; on near-miss
    candidates it visibly did not. Recording either half alone would misstate
    the batch.

  strength_note: >-
    `moderate`: one instance, one seed, one dimension, one sieve. The red team
    established that every headline number carries roughly 20% unreported
    uncertainty (correct-secret mean +0.4029 +/- 0.0856 over resampled error),
    and that uncertainty does not shrink with N.

  what_is_established:
    - >-
      THE MEASUREMENT IS REAL AND THE CERTIFICATE IS GENUINE. bgj1_sieve at dim
      60, q=127 produced 17,919 vectors in 16.55s. All 17,919 satisfy
      y = A^T x (mod q). The validator re-verified over 447,975 integer entries
      by two independent routes (0 violations; B^-1 v integral to 1.31e-13). The
      red team reconstructed the object end to end -- recovering y for all
      17,919 vectors by inverting 25 spanning candidate phase-differences mod
      127, recovering x by Babai BDD in the rank-35 kernel lattice (shortest
      BKZ-20 row ||.||^2 = 2450 against ||x||^2 <= 282, so x is unique),
      matching the emitted norms 17,919/17,919 -- and then reproduced the entire
      database from the declared seeds with its own code, obtaining an identical
      (x, y) multiset.
    - >-
      NO SECRET LEAKAGE. The validator built A, ran LLL and bgj1_sieve TO
      COMPLETION, and only then drew the secret, reproducing the producer's
      exact database bound three ways. The sieve output is provably a function
      of A alone. Scoring is a single vectorised path with no branch on
      candidate index; the validator recomputed all 66 MAIN and NULL phase
      arrays (1,182,654 integers) with 0 mismatches. This is the way a
      measurement of this shape fails silently, and it does not fail here.
    - >-
      AGREEMENT WITH THE ASSUMED LAW IS REACHABLE, AND TWO INGREDIENTS AGREE.
      (a) The per-vector advantage law, tested across within-database ||x||^2
      deciles spanning a 3.8x range, gives measured/predicted 0.987-1.060 with
      NO TREND. (b) Uniform wrong-candidate noise over 2000 draws has sd
      0.005275 against the iid prediction sqrt(1/2N) = 0.005282, a ratio of
      1.00. (c) MATZOV.Nf's own N prediction of approximately 25 is CONFIRMED
      against the population its assumption describes: P(rank 1 of 16 uniform)
      = 0.887 at N' = 25 and 1.000 at N' = 100.
    - >-
      DEPARTURE IS LOCALISED, NOT GLOBAL. It appears only against near-miss
      candidates: the full N = 17,919 gives P = 0.834 against 8 near-misses,
      which is at least 700x the law's own N. The near-miss paired delta is
      +0.002606 +/- 0.000987 over 600 error draws (t ~ 2.6, NOT the iid t =
      5.1), correlation 0.9909, ordering stable in 99.83% of draws, one
      instance.
    - >-
      The decay control obeys a prediction the validator derived independently,
      exp(-2 pi^2 sigma^2 ||x||^2 / q^2) averaged over the emitted norms:
      0.946/0.801/0.415/0.033/~0/~0 predicted against 0.949/0.841/0.427/0.018/
      0.005/-0.004 observed.
    - >-
      Instrument reproducibility: both reviewers independently reproduced
      KN-TECH-14efa5's own figures (fpylll BKZ-30 ||b0|| 160.4 -> 130.3 in
      0.31s; g6k dim-50 gauss_sieve db 4075 in 0.93-0.95s), and both documented
      gotchas reproduced.
    - >-
      Two structural facts for later batches: all 17,919 y columns are distinct
      and the database is NOT closed under negation, so there is no +/- pair
      inflation of effective sample size; and 17,919 = ceil(3.2 * (4/3)^30)
      exactly, a g6k default rather than a chosen parameter -- which matters
      because N is precisely what Nf computes.

  what_is_not_established:
    - >-
      Nothing about ML-KEM. No break, no security proof, no FIPS 203 parameter
      set affected or cleared, no cost claim, no speedup. Dimension 60 and
      q = 127 against FIPS 203's n = 256k and q = 3329.
    - >-
      That the independence law fails. Two of its ingredients were tested and
      HELD. The departure is confined to near-miss candidates and is one
      instance at t ~ 2.6.
    - >-
      That the batch-1 null validates the sieve database. It does not -- see
      the integrity findings below.
    - >-
      Any comparison against MATZOV.Nf as a whole. None was performed, by
      contract, and the red team's OBJ-1 shows why performing one naively would
      have been meaningless.
    - >-
      That EV-MLKEM-015 or any GOAL-MLKEM-003 record is affected. Rule 12 is
      UNMET and UNWAIVED and inherited; nothing here touches them.

  narrowest_supported_statement: >-
    At dimension 60 with q = 127, one LWE instance, one seed, and one sieve run
    (g6k bgj1_sieve, 17,919 vectors certified to lie in the dual lattice by
    independent integer arithmetic), the dual-attack score of sieve-produced
    vectors was measured against 33 candidates. Within this single database, the
    per-vector advantage law holds across ||x||^2 deciles spanning a 3.8x range
    (measured/predicted 0.987-1.060, no trend), uniform wrong-candidate score
    noise matches the iid prediction to a ratio of 1.00 over 2000 draws, and
    MATZOV.Nf's predicted sample count of approximately 25 is confirmed against
    the uniform population its assumption describes. A departure from iid
    behaviour appears only against near-miss candidates (paired delta +0.002606
    +/- 0.000987 over 600 error draws, t ~ 2.6 rather than the iid t = 5.1).
    Every one of these is a statement about one instance at toy scale under one
    sieve, with roughly 20% unreported uncertainty on the headline scores, and
    none of them is a statement about ML-KEM, about FIPS 203 parameters, or
    about the cost of any attack. No break. No security proof. certificate.kind:
    dual-membership only.

  narrowest_supported_statement_provenance: >-
    Composed by the Coordinator from the two independent review reports
    (VAL-20260803-535d15 and RT-20260803-4064e1) and their quantitative
    findings, after both were complete. It fills no field of either reviewer's
    own schema.

  observations:
    - id: OBS-1
      statement: >-
        The batch-1 null CANNOT FAIL. With b uniform, x . b is uniform mod q, so
        the null is passed by any code that reads b at all. It leaves the sieve
        database -- the object whose independence the law actually asserts --
        entirely untouched.
      supported_by: RT-20260803-4064e1 OBJ-2
    - id: OBS-2
      statement: >-
        The red team ran the null that was missing. Random directions of matched
        ||x|| reproduce the sieve's concentration (N_eff 63 against 38); N_eff
        grows roughly linearly in m (40/94/154/402 at m = 35/70/140/280) and is
        INDEPENDENT of N (sd 0.0853 -> 0.0883 for N = 1,000 -> 60,000). The
        411x / N_eff = 44 inflation is therefore a controlled null, not a
        finding about sieve output.
      supported_by: RT-20260803-4064e1 OBJ-2
    - id: OBS-3
      statement: >-
        MATZOV.Nf's log-term is k_enum*H(Xs) + k_fft*log(p) + log(1/mu). This
        design is distinguishing-form-only, so none of the three has a referent
        here. Admissible readings give N_pred from 24.9 to 723 -- a factor 29
        spread BEFORE any data. Nf's second factor
        exp(k_fft/3 * (sigma_s pi / p)^2) exists precisely to charge the
        adjacent-bin penalty that the near-miss observation is about, and is
        untestable with no p.
      supported_by: RT-20260803-4064e1 OBJ-1
    - id: OBS-4
      statement: >-
        No error bars were reported anywhere in the producer package. Resampling
        the error gives correct-secret mean +0.4029 +/- 0.0856, roughly 20%,
        and that uncertainty does NOT shrink with N.
      supported_by: RT-20260803-4064e1 OBJ-3
    - id: OBS-5
      statement: >-
        The sigma sweep moves one axis of one dimensionless exponent, redraws e
        at each point, and has no error bars. All five points sit within
        +1.20/-0.45 sd, and the sigma=4 "factor-2 shortfall" is -0.45 sd, i.e.
        noise.
      supported_by: RT-20260803-4064e1 OBJ-6
    - id: OBS-6
      statement: >-
        Under the null, all 8 secret-distribution candidates beat the nominal
        secret (9 of 9, z = -2.31). Visible in the package's own table and
        unnamed by it. The direction is safe, but it is an unreported
        observation.
      supported_by: VAL-20260803-535d15 defect 7

  inference: >-
    Batch 1 did what a first measurement batch should: it established that the
    object is measurable, that the certificate is real, that the secret does not
    leak, and -- unexpectedly -- that agreement with the assumed law is a
    reachable outcome rather than a rhetorical possibility. The reviews then
    established that the batch's own null validates the wrong thing, and that
    the interesting departure is confined to a population the law's own
    correction term was written for and which this design cannot yet express.
    The correct next step is therefore not to substitute these numbers into
    MATZOV.Nf, but to make the comparison well-posed first.

  heuristics_relied_on:
    - id: H-SCALE-1
      statement: >-
        That behaviour measured at dimension 60 with advantage a_x = 0.890
        transfers to cryptographic dimensions. Nf's own arithmetic gives
        a = (1/2) ln(N/L), so cryptographic N puts the advantage near 1e-8.
      status: >-
        OFFERED BY THE RED TEAM AND ALREADY KNOWN INCOMPLETE. Recorded as a
        numbered heuristic precisely so that no later batch treats the
        extrapolation as free.

  boundaries:
    - >-
      Toy scale, one instance, one seed, one sieve algorithm, distinguishing
      form only. AGENTS.md rule 4 applies in full: no statement about FIPS 203
      dimensions is made or supported.
    - >-
      Roughly 20% unreported uncertainty on every headline score, not shrinking
      with N.
    - >-
      The near-miss departure is t ~ 2.6 on one instance. It is an observation
      to pursue, not a result.

  unresolved_confounds:
    - >-
      Whether the near-miss departure survives multiple instances, multiple
      seeds, and error bars. Cheapest check: emit x and y (roughly 1 MB) and
      report mean +/- sd over at least 1000 error draws.
    - >-
      Whether an (m, k_enum, k_fft, p, beta_bkz, beta_sieve) tuple exists that
      makes MATZOV.Nf's log-term well-posed for this design, or whether the law
      must be compared against its two separable ingredients instead.

  evidence_integrity_findings:
    - id: INT-1
      finding: >-
        The producer's reported limitation that dual vectors are absent from
        raw_scores.json, so a reviewer cannot score their own candidate without
        re-running, is FALSE AS WRITTEN. The validator recovered y from the JSON
        and scored a candidate the producer never scored: +0.174586 from the
        JSON alone against +0.174586 from re-run vectors, phase arrays
        identical. What is actually lost is x (needed for new targets and the
        full certificate).
      raised_by: VAL-20260803-535d15 defect 1
      materiality: >-
        The error is conservative -- it understates what the archive supports.
        It is material as provenance because the Coordinator propagated it into
        the immutable snapshot receipt at 8cc51677 without checking it.
    - id: INT-2
      finding: >-
        The batch-1 null validates the wrong object. It is not evidence about
        the sieve database and must not be cited as such by any later batch.
      raised_by: RT-20260803-4064e1 OBJ-2
      materiality: >-
        High. The null was made a completion gate specifically to avoid the
        predecessor campaign's controls failure, and the gate was met by a
        control that cannot fail. Passing a gate is not the same as having the
        control.
    - id: INT-3
      finding: >-
        The pooled null statistics ("18 of 33", "-0.04 sd") pool three
        populations the producer itself calls non-exchangeable. Group-wise:
        5/17 against uniform (z = +0.43), 9/9 against secret-shaped (z =
        -2.31), 6/9 against near-miss. Additionally 8 of the 32 wrong
        candidates are near-copies of the ranked item, so "18 of 33" is not the
        clean uniform-over-33 statistic a reader assumes.
      raised_by: VAL-20260803-535d15 defects 2 and 3
      materiality: >-
        The null's conclusion survives; the numbers quoted for it do not. Per
        candidate GROUP is the reportable form -- the decomposition is the
        result.
    - id: INT-4
      finding: >-
        No shortness control exists. Nothing in batch 1 varies the vectors, and
        batch 2's target law is specifically about SHORT vectors.
      raised_by: VAL-20260803-535d15 defect 5
      materiality: >-
        Partly mitigated by the ||x|| prediction matching, and directly
        addressed by the red team's own vector-null (OBS-2), which is the
        control batch 2 should adopt.
    - id: INT-5
      finding: >-
        The goal record requires the instrument to be REBUILT each batch. It was
        re-verified, not rebuilt -- the venv from an earlier session was found
        present. The producer disclosed this; it is recorded as not met.
      raised_by: RT-20260803-4064e1 OBJ-9
      materiality: >-
        Low for this batch, since both reviewers independently reproduced the
        instrument's figures. Recorded so the requirement is not quietly eroded.

  coordinator_observations_unreviewed: []

  pareto:
    dominated_by: >-
      Any multi-instance version of the same measurement with error bars, which
      would dominate this on every claim it makes. This is a first measurement,
      and it is dominated by its own obvious successor.
    sota_delta: >-
      None claimed. No attack is improved, no exponent moved, no cost reduced.
      The contribution is that a quantity the literature disputes was measured
      at all, with a certificate, and that agreement was found where the
      assumption applies.

  review_refs:
    - VAL-20260803-535d15
    - RT-20260803-4064e1
  review_verdicts:
    validator: >-
      ADMISSIBLE_WITH_DEFECTS (report verdict `passed`). 7 defects, all
      reporting accuracy, control scope, or statistical presentation; none
      touches data integrity. Explicitly admissible as raw data for batch 2.
    red_team: >-
      pass_with_constraints. 21 quantitative claims checked: 18 reproduced, 3
      unable_to_check with stated reasons. 9 objections, 3 marked must-fix.
      Recommends batch 2 PROCEED and explicitly warns against redesign as
      premature abandonment.
  review_provenance_note: >-
    Two independent sessions on snapshot 8cc51677, dispatched concurrently and
    neither shown the other's findings; the Coordinator forwarded nothing
    between them. Both reconstructed the measured object from the archive rather
    than accepting the producer's transcript. OBJ-2's vector-null and OBJ-3's
    error bars are new computations produced in the red-team session. Both
    reviewers recorded fallback_used: true -- both resolved to claude-opus-5,
    the same underlying model as the producer, which is a real limit on the
    independence of these reviews and is recorded rather than glossed.

  rule12_status: >-
    UNMET and UNWAIVED, inherited from GOAL-MLKEM-003. No status change to
    EV-MLKEM-011, 013, 015, 017, 018, 019, 020, 021 or af61e7, and no KN-*
    entry is created, modified or withdrawn by this record.

