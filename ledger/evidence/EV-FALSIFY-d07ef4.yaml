evidence:
  id: EV-FALSIFY-d07ef4
  hypothesis_id: H-FALSIFY-40538b
  question_id: RQ-FALSIFY-a2c501
  experiment_ids: [EXP-FALSIFY-d770c1]
  run_ids: []
  run_ids_note: >-
    Documentary. Four field reads and a row count, all quoted inline.
  finding_under_test: KN-FIND-5c1a03
  type: analytical
  direction: contradicts
  direction_note: >-
    Contradicts the record's `confidence: multiple_independent_analyses` label
    and its "three completely independent analyses" framing. Does NOT dispute the
    substantive characterisation, which is plausible and is not evaluated here.
  strength: moderate
  claim_tier: theory
  proof_status: derivation
  proof_status_basis: >-
    An argument about a confidence label, resting on four dated field reads and
    one row count.
  proof_refs:
    - knowledge/findings/KN-FIND-5c1a03.md
    - knowledge/findings/KN-FIND-e7a3b1.md
  recorded_at: '2026-08-08'

  observations:
    - id: O-1
      text: >-
        THE THREE "COMPLETELY INDEPENDENT ANALYSES" AND THE RECORD AGGREGATING
        THEM WERE ALL ADDED ON ONE DAY. KN-FIND-5c1a03 asserts that "three
        completely independent analyses of prime-field ECDLP complexity all
        identify the same missing ingredient", and carries
        `confidence: multiple_independent_analyses`. Its three legs are
        KN-FIND-e7a3b1 (analytic), KN-FIND-9d2f56 (combinatorial) and
        KN-FIND-7e4b90 (algebraic). All three carry `added: 2026-08-04`, as does
        5c1a03 itself. Its source_refs span BATCH-085, 091, 095, 096 -- one
        campaign, one window.
    - id: O-2
      text: >-
        WHAT "INDEPENDENT" HAS TO MEAN FOR THE LABEL TO CARRY WEIGHT. Three
        analyses agreeing is evidence in proportion to how uncorrelated their
        error modes are. These share a program, a framing, a period, and a prior
        -- the expectation that prime-field ECDLP lacks exploitable structure --
        and each is derivation-tier with no external verification. Agreement
        under those conditions is close to the failure the corpus's own goal
        closure rule names: "Three aliases that all fall back to one backend
        produce correlated judgements; counting them three times is not
        independent agreement." That rule is about model attestations, and the
        principle transfers exactly.
    - id: O-3
      text: >-
        AND ALL THREE LEGS HAVE SINCE BEEN QUALIFIED, each by a separate probe of
        this program. e7a3b1: its universal over "all standard analytic
        approaches" is unestablished, and one of its eight rows is closed on the
        p^0.079 exponent now under correction (EV-FALSIFY-89e414,
        CORR-20260808-733115). 9d2f56: its "exact condition" framing -- the
        precise form 5c1a03 cites as the Betti-Yield leg -- was withdrawn by
        KN-FIND-ff4a46 and narrowed to a necessary condition only
        (EV-FALSIFY-0ed0d9). 7e4b90: its closure supplies three of the five
        elements AGENTS.md requires, omitting remaining uncertainty and any
        successor (EV-FALSIFY-e58e4e). A convergence claim inherits the standing
        of its legs, and none of the three now stands as 5c1a03 states it.
    - id: O-4
      text: >-
        AN INDEPENDENT CORROBORATION OF THIS PROGRAM'S OWN F-6 FINDING, from
        inside the corpus. EV-FALSIFY-89e414 reported that KN-FIND-e7a3b1's title
        says "all six standard analytic methods" while its table carries eight
        data rows, and could not say which number was intended. KN-FIND-5c1a03
        describes the same leg as "8 character-sum proof methods closed". A
        second record, written the same day, says eight. The table is right and
        the title is the error.
    - id: O-5
      text: >-
        D6 APPLIES. KN-FIND-5c1a03's proof_refs is
        [knowledge/findings/KN-FIND-5c1a03.md] -- itself. It is one of the nine
        self-referential records identified in the D6 sweep, and the only one of
        those whose confidence label is an assertion about the independence of
        OTHER records.

  interpretation: >-
    The substantive characterisation -- that prime-field ECDLP has minimal
    algebraic structure while sub-rho mechanisms need richer structure -- is
    plausible and is not disputed here. What does not hold is the epistemic
    weight the record claims for it. Three same-day derivation-tier analyses from
    one campaign, each since qualified, agreeing on a conclusion consistent with
    the prior that framed all three, is not "three completely independent
    analyses". The label `multiple_independent_analyses` counts agreement it has
    not shown to be independent.

  what_this_does_not_establish: >-
    Nothing about whether the characterisation is TRUE. It may well be, and two
    of the three legs survived their audits in substance even where their framing
    did not. Same-day filing does not prove the analyses were not conducted
    separately -- only that the record offers no evidence they were, while
    claiming they were. No attempt was made to trace the three back to a common
    author or session; the batch numbers and dates are all this rests on. And
    "correlated" is not "wrong": three correlated analyses can all be correct.

  dominated_by: not_applicable_methodological
  sota_delta:
    time_exponent: not_applicable
    note: >-
      No algorithmic claim. The effect is to lower the weight a reader should
      place on a convergence, not to remove its content.

  proposed_correction: >-
    A superseding record that (a) replaces `multiple_independent_analyses` with a
    label describing what the evidence is -- three derivation-tier analyses from
    one campaign reaching a consistent conclusion, (b) drops "completely
    independent" from the finding text, (c) notes the standing of each leg as
    qualified by EV-FALSIFY-89e414, -0ed0d9 and -e58e4e, and (d) records "8" as
    the count for the analytic leg, resolving the e7a3b1 title/table discrepancy
    in the table's favour. The characterisation itself needs no change.
    Coordinator authority.

  knowledge_promotion: warranted
  knowledge_promotion_reason: >-
    The reusable rule generalises the corpus's own quorum principle beyond model
    attestations: a confidence label that counts agreeing analyses must show the
    analyses could have disagreed. Same-campaign, same-period, same-framing
    agreement is one analysis reported three ways until shown otherwise.
    Proposed as a technique entry; Coordinator approval required.

  scope_limits: >-
    The four records as committed at this branch head, their `added` dates, and
    the row count of e7a3b1's table. No provenance tracing beyond that.

  independent_review_required: true
  independent_review_note: >-
    Downgrades a confidence label on a record that aggregates three others, two
    carrying `proved`/`proved_negative`. AGENTS.md rule 12 applies before any
    status change follows.

  authority_note: >-
    Evidence only. No hypothesis status changed, no finding edited or
    superseded (AGENTS.md rule 1).
