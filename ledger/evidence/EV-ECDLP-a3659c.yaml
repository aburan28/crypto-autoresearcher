evidence:
  id: EV-ECDLP-a3659c
  hypothesis_id: H-ECDLP-60de36
  experiment_ids: [EXP-ECDLP-8c41d7]
  run_ids: [RUN-ECDLP-8c41d7-01, RUN-ECDLP-8c41d7-02, RUN-ECDLP-8c41d7-03, RUN-ECDLP-8c41d7-04]
  validation_ids: [VAL-20261019-0cb05d]
  related_evidence: [EV-ECDLP-97cb57, EV-ECDLP-7e970a, EV-ECDLP-6bdff6]
  type: empirical
  direction: contradicts
  strength: preliminary
  strength_basis: >-
    Only L = 2 and L = 3 give uncensored paired comparisons (the L = 2
    difference is about 3 ms); L = 4 is right-censored for the chain arm and
    mixes two primes; n = 5 at L = 3. Validated (VAL-20261019-0cb05d, passed
    with concerns); the validator's re-run matches all 174 deterministic fields.
  claim_tier: toy
  proof_status: empirical_only
  proof_refs: []
  observations:
    - id: O-1
      text: >-
        m = 4 with the chain variables eliminated first: msolve chain/dense
        median ratios 1.13 (L = 2) and 1.21 (L = 3); paired medians 1.12
        (interval 0.97-1.27) and 1.22 (1.12-1.27, n = 5). Singular 2.31 and
        4.90. The chain arm is not faster in any jointly completed cell, for
        either solver.
    - id: O-2
      text: >-
        Plain DRL vs block order for the chain arm (msolve): 1.6x at L = 2 and
        4.8x at L = 3 (dynamic-range control passes at L = 3).
    - id: O-3
      text: >-
        L = 4 (msolve arms at p = 262271 after AMD-03): the dense arm completes
        on every non-degenerate instance in 518-586 s (cap 600 s); the
        block-order chain arm times out on all of them; plain-DRL chain times
        out on four and one solve was killed (rc -9, 184 s). The Singular arms
        (p = 65551) time out on all instances (a tie).
    - id: O-4
      text: >-
        msolve 0.6.5 segfaults on 17- and 18-bit primes (range widened by the
        independent validation; NOTE-01, CORR-20261019-e6f65b); RUN-03's 15
        msolve crash rows at p = 65551 are instrument failures, replaced by
        RUN-04's. No completed msolve result used a 17- or 18-bit prime.
    - id: O-5
      text: >-
        Controls: every ok planted result contains the planted point; S_5
        vanishes on 13/13 planted decompositions and is nonzero on 78/78
        perturbed points (validator, own code); the eliminated chain basis
        equals the dense basis on 11/11 instances where both msolve bases
        finished (L = 2, 3); not evaluable at L = 4.
  frozen_criteria_outcome: >-
    success not met for either pair; falsification met: msolve by both clauses
    (A >= B in 2/2 cells; A_elim_ms retired at L = 4 while B_ms is not), Singular
    by clause 1 only (retirement is a tie at L = 4).
  sensitivity: >-
    The msolve L = 4 retirement clause depends on the 600 s cap (dense arm
    finishes 2.3-2.8% below it on planted instances); the clause-1 verdict holds
    for any cap of at least 14 s (msolve) or 350 s (Singular).
  scope_limits:
    - toy scale: m = 4, L <= 4, primes up to 19 bits, single-threaded, 600 s cap
    - L = 4 contrasts between msolve and Singular confound solver, prime and instances
    - AMD-03 was filed after RUN-03's data was seen (disclosed)
    - one A_drl_ms solve was killed at 184 s; the validator measured 3.4 GB for that arm alone, so memory may be the cause (unproven)
  dominated_by: Pollard rho at exponent 1/2 (and, at these sizes, plain enumeration)
