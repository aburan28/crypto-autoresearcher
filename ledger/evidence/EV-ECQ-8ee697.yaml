    - TASK-20260823-33a825          # red team; census, rate table, coverage reconstruction; NO RUN RECORD
    - TASK-20260823-bd5f2f          # orchestrating Coordinator; third re-derivation of (i) and (iv); NO RUN RECORD
    measured_by_note: >-
      The density figures (i) and the rate table (ii) come from reviewer and
      Coordinator tasks that produced no run records and are cited as
      derivation-grade corroboration, not as certificates. (i) and (iv) are
      reproduced on two independent implementations beyond the producer's; (ii)
      rests on one.
    scope: >-
      Admissible canonical integer 6-tuples of Mestre's construction, spread <= 74
      exhaustively plus 312 sampled to spread 600 plus the two published tuples;
      one fixed 73-value T-box with |t| <= 800; ICARM naive-height convention;
      rank lower bounds from exhibited points in exact arithmetic; PARI 2.15.4 /
      cypari 2.5.6 / Python 3.11.15 on one 4-core machine. The cap of 15 is
