    READING THE PAPERS, because the Euler check sum(deg * v_disc) = 24 = 12d is
    an independent internal consistency test that a wrong fibre census would
    fail.
    (iii) THE COMPARATIVE CLAIM IS EMPIRICAL AND REPLICATED. That the tuple
    search beats generic-rank selection at rank >= 12 is a comparison of two
    measured envelopes, 86.77369390941135 here against 109.5051651866501 in
    EV-ECQ-cbc837, each replicated by at least three implementations.
    (iv) THE NEGATIVE IS EMPIRICAL, BOUNDED AND UNDER-COVERED, AND IS THE WEAKEST
    THING IN THIS RECORD. "No certified rank-12 fibre below 79.32867457792244"
    is a bounded-search statement at 37.0 percent coverage of the load-bearing 46
