    resource_check:
      examined: true
      reading: >-
        THE OBSTRUCTION HANDS OVER ITS OWN ATTACK, AND THE ATTACK IS FREE. If a
        family can host rank 12 only when its discriminant is squarefree or nearly
        so over the finite T-line, then squarefreeness of the discriminant is a
        PRE-FILTER, not a post-hoc explanation: it costs one resultant on a
        degree-20 polynomial, which is cheaper than a single one of the 73 height
        evaluations it replaces, and in the exhaustive box it cuts the measurement
        set from 13077 families to 90. This batch spent essentially its whole
        measurement budget on families that structurally could not host the target
        rank, and the filter that would have prevented it costs nothing. Charging
        the filter's own cost, as the program's own literature note requires,
        does not change that. Two further readings fall out of the same data: the
        universal cap of 15 is worth stating on its own, since both the hypothesis
