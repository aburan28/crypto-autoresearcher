    limitation: >-
      The absence of a network call is SUPPORTED by the absence of any network
      import, and a negative of that kind cannot be proved from artifacts alone.
      The validator says so itself.

  - id: OBS-3
    what: >-
      THE TUPLE LEVER IS REAL AND IT IS NOT A SIZE ARTIFACT. This is the batch's
      central positive finding and it survived an adversarial attack built to
      kill it. Raw envelope spread over 13391 admissible families is 220.26041937735616
      (min 25.42973852559282, median 110.70448734398212, max 245.69015790294898),
      every figure recomputed exactly. THE ATTACK: hold coefficient content
      fixed and see whether the spread survives. It does. Inside a log-P2 window
      of width 0.25 the envelope still spans 90 to 120 log units with an
      interquartile range of 25 to 34; at log P2 in [7.50, 7.75], n = 1659, the
      envelope runs 46.92 to 167.17. A pure size statistic explains only
      R^2 = 0.19165243721035774 of the variance on log P2 and 0.27 on log spread.
    scaling_quotient_cleared: >-
      A spread reported over a quotient is exactly the kind of number that should
      be checked, and the red team checked it: the envelope over the identical
      73-value T-box for L times (0, 1, 2, 5, 6, 7) at L = 1, 2, 3, 5, 7 gives
      25.429739 exactly in all five cases, at t = L. The canonical-form quotient
      is information-preserving on that control and the spread is neither
      inflated nor deflated by it.
    who: >-
      Red team RT-J3 verdict summary and RT-J3-C1, on its own implementation;
      producer statistics recomputed exactly by the validator at M8 and M11.

  - id: OBS-4
    what: >-
      THE HYPOTHESIS'S OWN STRONGEST CLAIM WAS LEFT UNMEASURED BY THE PRODUCER
      AND WAS MEASURED BY THE VALIDATOR. H-ECQ-8b600d says the envelope minimum
      is governed by the FLAT-ARM INTERCEPT. Regressing the envelope on the
      flat-arm intercept gives slope 0.8132 at R^2 = 0.7732 over n = 13391. The
      report presents instead the weak log-P2 regression at R^2 = 0.19165243721035774
      and never measures the intercept at all. THIS IS THE BATCH'S BEST POSITIVE
      RESULT AND IT IS NOT IN report.md.
    why_it_matters: >-
      It relocates the lever. The hypothesis reasons tuple -> content ->
      intercept -> envelope; the content link carries R^2 = 0.19 and the
      intercept link carries R^2 = 0.77. The tuple moves the envelope through
      the intercept, not through the coefficient-content statistic the
      hypothesis names as the mechanism. That is a refinement of the mechanism
      and it is more useful than the version on file.
    status: >-
      ONE IMPLEMENTATION, THE VALIDATOR'S (M18), NOT REPLICATED, NO RUN RECORD.
      Its replication by a second implementation is a declared component of the
      next action.

  - id: OBS-5
    what: >-
      THE FLAT ARM PASSES A NULL-OBJECT CONTROL AND THE STEEP ARM FAILS ONE. The
      producer ran no null object for the envelope law; the validator built one -
      random degree-matched elliptic surfaces over Q(T) with deg A = 8,
      deg B = 12 so d = 2, through the same T-box, minimalisation, envelope
      construction and segmented fit, with no Mestre structure at all, three
      nulls with coefficient magnitudes spanning three orders and 35 families
      each. STEEP ARM FAILS: the nulls give steep-arm slope medians 24.04, 24.02
      and 24.09 with IQR about [23.94, 24.13] at R^2 = 1.000, against the Mestre
      scan's 22.10 with IQR [19.83, 24.32] at R^2 = 0.898. A structureless
      surface reproduces "slope 12d = 24" BETTER than Mestre's families do,
      because it is a restatement of deg c4 = 8 and deg c6 = 12; it carries no
      information about Shioda-Tate, the construction or the tuple. FLAT ARM
      PASSES: all three nulls have no flat arm at all, showing one straight line
      across the whole box at left-arm slope about 21 and R^2 about 0.998, while
      the Mestre families' left arm sits at median -0.48.
    consequence: >-
      The half of the two-arm law the report emphasises is a degree count. The
      half H-ECQ-8b600d's lever actually rests on is real and is specific to the
      construction. The report's stated explanation of the 22.10 median - "what a
      box truncated at t = 800 should produce" - is separately unsupported: local
      slopes hit exactly 24.000 at t = 2000 to 20000 for several families, and
      3850 of 13391 fitted steep slopes EXCEED 24, up to 75.70, which a downward
      truncation bias cannot produce. The cause is arithmetic minimalisation
      fluctuation.
    heterogeneity_that_must_travel_with_the_flat_arm: >-
      The flat arm is a median, not a fitted law per family. Median flat-arm
      R^2 is 0.075 with IQR [0.019, 0.174]; the flat-arm slope has IQR
      [-3.31, +2.72] and 5-95 percent range [-7.66, +6.15], with 31 percent of
      families above +2 and 37 percent below -2. That is CONSISTENT WITH FLAT and
      is not evidence for a law. Any future citation of the flat arm carries this
      distribution beside it.
    who: validator control C1 and finding F4; red team RT-J3-O5.

  - id: OBS-6
    what: >-
