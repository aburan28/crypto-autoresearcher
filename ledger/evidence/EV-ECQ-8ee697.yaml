  - id: OBS-9
    what: >-
      THE REQUIRED NULL IS NOT A NULL. The k = 0 rung of the section 6 ladder is
      documented as "0 sections, generic rank 0 by construction" and it carries
      LARGE FORCED RATIONAL RANK. The red team pointed the same instrument at 79
      RANDOM elliptic curves y^2 = x^3 + Ax + B at matched naive height
      (h approximately 60, 70 and 93, PARI ellrank under the same alarm, seed
      20260823): maximum rank 2, mean 0.48 / 0.67 / 0.58 by band, ZERO of 79 at
      rank >= 3. The k = 0 rung's 15 certified curves sit at h = 69.05 to 103.62
      and give 12 of 15 at rank >= 3, 5 of 15 at rank >= 4 and one at rank 6.
      Under the hypothesis that k = 0 curves behave like random curves of the
      same height that outcome is not close to possible.
    the_mechanism_the_red_team_names: >-
      With three irreducible quadratic factors the twelve geometric sections
      occur in Galois-conjugate pairs, and the TRACE of a conjugate pair is a
      rational point. n_sections counts rational roots and therefore reports 0
      while the rational Mordell-Weil rank is not 0. The cheapest confirming
      mutation is one number-field arithmetic call: form P + P^sigma for one
      conjugate pair at a k = 0 family's envelope argmin and check it is a
      rational point of infinite order.
    consequence: >-
      The ladder's contrast is roughly 11 down to about 5, NOT 11 down to 0. The
      12-sections-versus-0 contrast the required null exists to test WAS NEVER
      TESTED. The report's sentence that at the envelope minima "the rank that is
      actually there is largely not coming from the construction's sections" is
      exactly backwards: it is coming from the construction, from the part the
      ladder failed to remove. THAT SENTENCE MUST NOT BE CARRIED INTO ANY RECORD
      AND IS NOT CARRIED INTO THIS ONE.
    three_further_defects_in_the_same_ladder: >-
      (a) UNMATCHED ON THE DOMINANT COVARIATE. Ceiling composition per rung: k6
      has 147 of 150 at ceiling 9; k4 has 57 of 68 at ceiling 13 plus 4 at 15; k2
      has 25 at 13 and 12 at 15; k0 has 45 at 13 and 10 at 15. The treatment arm
      is the generic ceiling-9 population and the null arms are majority
      high-ceiling, because for k = 6 admissibility is obtained by REJECTION and
      for k < 6 by SOLVING the last quadratic's constant term. (b) THE MATCHING
      STATISTIC IS NOT A SIZE FOR THREE OF FOUR RUNGS. content_P2 is a sum of
      squares of CENTRED ROOTS and can be zero or negative when roots are
      complex; matched_null takes its logarithm and silently drops 34 of 150 rows
      at k0, 16 of 72 at k2, 2 of 68 at k4 and 0 of 150 at k6 - 52 of 440 null
      rows dropped from every content-matched comparison, on a criterion that
      selects on the manipulated variable, with no disclosure. The red team
      checked rather than assumed whether this changes the result: dropped rows
      have similar envelopes (k0 dropped median 134.36 against kept 136.64; k2
      108.49 against 112.91), so it is a disclosure and construct-validity
      defect and NOT result-changing. (c) UNDISCLOSED DIFFERENTIAL ATTRITION.
      n_generated is 150 for each of k4, k2 and k0; the measured rungs are 68, 72
      and 150. 82 of 150 k = 4 families and 78 of 150 k = 2 families were
      generated and then failed measurement, against zero attrition on k0 and on
      the treatment - 55 percent and 52 percent on exactly the two middle rungs,
      with the failed families persisted nowhere. The rung carrying the report's
      most surprising claim, that 8 sections buy as much as 12, is 45 percent of
      its intended sample.
    what_survives_of_the_ladder_with_intervals_attached: >-
      In-window bootstrap, 20000 resamples: median(k6) - median(k4) = +21.56
      with 95 percent CI [+8.59, +32.78]; k6 - k2 = -10.04 [-23.64, +4.89];
      k6 - k0 = -35.27 [-46.27, -29.09]. After adjusting for BOTH content and
      ceiling, pooled OLS with n = 337, mean residuals are k6 -11.41
      [-14.58, -8.19], k4 -17.53 [-24.64, -10.08], k2 -0.86 [-7.74, +6.28], k0
      +25.95 [+21.18, +30.63]. Both directional readings survive as statements
      about the MEASURED POPULATIONS. What does not survive is what either one
      MEANS, because of the null defect above. Any citation carries the
      intervals, never the bare medians.
    who: red team RT-J4-O1 to RT-J4-O5; validator control C9 recorded the
      exclusion asymmetry and correctly declined to adjudicate it as another
      reviewer's joint.

  - id: OBS-10
    what: >-
