  obstruction:
    statement: >-
      A CLAIM ABOUT THE OBJECT, NOT ABOUT THE ATTEMPT, AND IT IS A DENSITY-AND-RATE
      STATEMENT RATHER THAN A CLOSED LEVER. Mestre's construction places a
      multiplicative fibre at T = infinity, of type I_4 or I_6, on EVERY admissible
      6-tuple, so its Shioda-Tate cap is 15 and never the generic elliptic-K3 18;
      what varies between tuples is only the number of reducible fibres over the
      FINITE T-line, and a family can host rank 12 only when the discriminant is
      squarefree or nearly so there. Tuples meeting that condition are RARE and,
      in the region enumerated so far, LARGE: they sit at systematically higher
      coefficient content, and the low-content corner of the high-ceiling stratum
      is nearly unsampled. Within the fibres actually searched, the rate at which
      rank 12 appears rises steeply with height, so the sub-80 region where a cell
      could live is exactly the region where the rate is lowest. THE OBSTRUCTION
      IS THEREFORE A JOINT STATEMENT ABOUT DENSITY (how many high-ceiling tuples
      exist at low content) AND RATE (how often a searched fibre of a high-ceiling
      family attains rank 12 at a given height), and neither factor has been
      measured where it matters.
    quantity: >-
      (i) fraction of exhaustively censused admissible canonical tuples with
      Shioda-Tate ceiling >= 13, and its joint distribution with log P2;
      (ii) empirical P(certified rank >= 12) per searched fibre of a ceiling->=13
      family, by naive-height band;
      (iii) the minimum naive height over all certified rank->=12 fibres, in
      natural-log units;
      (iv) the Shioda-Tate cap of the construction itself.
    value: >-
      (i) 90 of 13077 (0.688 percent) over the two exhaustive strata,
      38 of 5569 at spread <= 56 and 52 of 7508 at spread 57 to 74. Taking all 96
      ceiling->=13 families across all strata, exactly ONE has log P2 below 5, two
      below 6, twelve below 7 and 47 below 8, with min log P2 4.9652, median
      8.0488, max 12.1903. Ceiling distribution over all 13391 families: 17 at
      ceiling 5, 16 at 7, 13257 at 9, 5 at 11, 82 at 13, 14 at 15. No error bars:
      an exhaustive count, reproduced to the digit on two independent
      implementations (red team, orchestrating Coordinator).
      (ii) 0.002 at h in [80, 90], 0.006 at [90, 100], 0.044 at [100, 120]; and
      0 of 296 searched ceiling->=13 fibres below h = 80 reached rank 12, with
      four reaching rank 11. Binomial, and at 296 draws a rate of 0.002 would
      predict 0.6 successes, so the sub-80 zero is CONSISTENT WITH THE RATE AND IS
      NOT INFORMATIVE ABOUT IT.
      (iii) 86.77369390941135, exact integer arithmetic followed by one logarithm
      on a proved-globally-minimal model, agreeing to 0.0 across four
      computations.
      (iv) 15, from I_4 on 13352 of 13391 families and I_6 on 39; no family
      reaches the generic 18 and the reason is structural.
    measured_by:
    - RUN-ECQTUP-416e78-003
    - RUN-ECQTUP-416e78-005
    - RUN-ECQTUP-416e78-006
    - RUN-ECQTUP-416e78-010
    - RUN-ECQTUP-416e78-011
    - RUN-ECQTUP-416e78-012
