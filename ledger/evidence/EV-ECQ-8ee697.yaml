  observations:

  - id: OBS-1
    what: >-
      NO CELL WAS TAKEN, ON ANY METRIC, AT ANY THRESHOLD. The best curve this
      batch exhibited at certified rank >= 12 has minimal-model naive height
      86.77369390941135. The frozen r >= 12 cell is 69.33884136527462, so the gap
