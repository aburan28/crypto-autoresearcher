  strength: replicated
  strength_justification: >-
    `replicated` FOR THE DIRECTION-BEARING RESULT AND FOR THAT RESULT ONLY.
    The naive height 86.77369390941135 was computed by THREE INDEPENDENT
    IMPLEMENTATIONS: the producer's, the validator's from the a-invariants alone
