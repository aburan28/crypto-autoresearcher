  proof_status: derivation
  proof_status_detail: >-
    STATED PER CLAIM RATHER THAN AVERAGED; the record-level label is the
    strongest checkable basis supporting the DIRECTION (supports), in the order
    docs/claims-and-verification.md sets.
    (i) THE INSTANCE IS CERTIFICATE-GRADE. The pair (86.77369390941135,
