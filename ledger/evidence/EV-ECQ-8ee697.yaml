    figure re-derived twice by agents who wrote their own code. Neither of the
    hypothesis's two declared falsification clauses fired: the envelope at
    rank >= 12 is below 109.505, and the envelope-versus-tuple relationship is
    not flat.
    WHAT IS NOT SUPPORTED, AND IS THE INFORMATIVE NEGATIVE THE HYPOTHESIS ITSELF
    NAMED: 86.77369390941135 misses the published construction-class best,
    79.32867457792244, by +7.4447, and misses the frozen r >= 12 cell,
    69.33884136527462, by +17.4349. NO CELL WAS TAKEN. C1' IS NOT MET AND
    NOTHING IN THIS BATCH APPROACHES IT.
    ONE LINK OF THE MECHANISM CHAIN IS REFINED RATHER THAN CONFIRMED. The
    hypothesis reasons tuple -> coefficient content -> intercept -> envelope. The
    content link is weak (R^2 = 0.19165243721035774 of envelope on log P2) and
    the intercept link is strong (R^2 = 0.7732 of envelope on the flat-arm
    intercept). The lever is real and it does not run through the content
