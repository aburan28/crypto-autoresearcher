  - id: OBS-2
    what: >-
      NOTHING WAS SUBMITTED AND THE LIVE BOARD WAS NOT RE-READ. No network
      import, no urllib or http reference and no endpoint appears anywhere under
      the producer's scripts/ (validator A9), and no submission artifact exists.
