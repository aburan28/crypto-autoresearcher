  inference: >-
    THIS BATCH TOOK NO CELL AND DID NOT COME CLOSE, AND ITS BEST RESULT IS NOT
    THE ONE ITS REPORT LEADS WITH. That is the honest headline and nothing below
    softens it. C1' IS NOT MET; nothing here approaches it; and no reader may
    take +7.4447 or +17.4349 for a near-miss.
    WHAT IS ESTABLISHED, INDEPENDENTLY AND NOT MERELY REPORTED. The tuple lever
    is real and is not a size artifact: at fixed coefficient content the envelope
    still spans 90 to 120 log units. The hypothesis's own pre-registered
    comparative prediction is confirmed by 22.73 log units - 86.77369390941135 at
    certified rank >= 12 against the generic-rank-selected family's
    109.5051651866501 - on a model proved globally minimal, with the rank
    certified in exact arithmetic against four positive and three negative
    controls, and with the height re-derived four times by three agents. Every
    family's ceiling is computed from its own fibre configuration and the
    BATCH-da59ec F1 error is fixed. The construction carries a universal
    multiplicative fibre at T = infinity capping it at 15 rather than 18. And the
    flat arm of the height law passes a null-object control while the steep arm
    fails one, which is the correct polarity: the surviving half is the half the
    hypothesis's lever rests on. THE SINGLE BEST POSITIVE RESULT IS THAT THE
    ENVELOPE MINIMUM REGRESSES ON THE FLAT-ARM INTERCEPT AT R^2 = 0.7732 - the
    hypothesis's own strongest claim, left unmeasured by the producer and
    measured by the validator, and unreplicated.
    WHAT IS NOT ESTABLISHED, RECORDED AS SUPERSEDED RATHER THAN DROPPED. The
    section 3 mechanism and its fibre column; the section 5 variance claim, which
    is backwards by about seven times; the negative-existence claim about the 46
    families, which is false as written; the required null, whose bottom rung
    retains roughly half the construction's rank so that the 12-versus-0 contrast
    was never run; and the reading that a higher ceiling costs envelope, which
    does not survive content and size matching.
    THE REUSABLE CONTENT IS THE OBSTRUCTION OF OBS-19, AND IT IS A DENSITY-AND-
    RATE STATEMENT RATHER THAN A CLOSED LEVER. Only 0.69 percent of exhaustively
    censused tuples reach ceiling >= 13 and only twelve of those sit at log P2
    below 7, while the rank search reached 37 percent of the load-bearing
    families with three runs stopped by wall clock. The untested region is HIGH
    CEILING AT LOW CONTENT, and the same measurement that names the obstruction
    hands over the tool for attacking it: a squarefree-discriminant pre-filter
    costing one resultant on a degree-20 polynomial, cheaper than a single one of
    the 73 height evaluations it replaces, which cuts the exhaustive measurement
    set from 13077 to 90.
    WHAT MUST NOT BE INFERRED: that the tuple lever is closed, that Mestre's
    construction cannot reach the r >= 12 cell, or that anything here bears on
    rank >= 31 over Q.

