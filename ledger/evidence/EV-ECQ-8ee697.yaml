      THE PRODUCER'S OWN CONTROL FOR IT WAS ESSENTIALLY ONE-SIDED. The producer
      verified the identity 12 sum(c^5) = 5 (sum c^2)(sum c^3) against deg_x r = 4
      on 400 random tuples with zero mismatches. At 0.15 percent density, 400
      uniform draws expect 0.6 positives and the validator's own 400 draws
      produced zero admissible, so that control tested almost only the negative
      branch. The validator established the identity OUTRIGHT instead: symbolic
      computation of r = g^2 - p on 200 random tuples gives
      [x^5] r == ((24/5) P5 - 2 P2 P3) * T^2 exactly with every other
      T-coefficient zero, 200 of 200. Since [x^5] r is a single monomial in T,
      deg_x r = 4 holds if and only if that coefficient vanishes. FALSE NEGATIVES
      ARE THEREFORE IMPOSSIBLE AND NO ADMISSIBLE TUPLE CAN HAVE BEEN SKIPPED BY
      THE PRE-FILTER. The positive branch was confirmed on 60 producer-declared
      admissible tuples and both published tuples, and the declared translation
      and scaling invariances were confirmed.
