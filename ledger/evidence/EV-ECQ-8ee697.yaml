    exact_breadth_of_the_negative: >-
      NO CELL AT THE TWELVE THRESHOLDS WHERE THIS BATCH CERTIFIED A CURVE, AND NO
      CURVE AT ALL AT THRESHOLDS 13 TO 30. The frozen frontier carries 30 rank
