    same validator code reproduced all nine reported envelope heights to 0.0
    including the published Mestre tuple A at 79.6237719007, which independently
    matches the BATCH-f2341e validator's 79.6 measured months of records earlier
    by different code.
    The certified rank >= 12 was reproduced by the validator's OWN certifier
    (F_l reduction homomorphisms, l > 16, 26 primes, stable at l = 17, 19, 23,
    29), with four positive controls against published board curves (ids 1, 157,
    50, 42 re-certifying at 12, 12, 11, 1) and three negative controls, all 23
    exhibited points first verified exactly on the curve in rational arithmetic.
    The tuple lever's reality survived an independent adversarial attack designed
    to kill it: at fixed coefficient content the envelope still spans 90 to 120
    log units, and the scaling quotient that could have manufactured the spread
    was measured and cleared.
    WHAT IS NOT REPLICATED, STATED SO THE LABEL IS NOT READ ACROSS: the flat-arm
    intercept regression R^2 = 0.7732, which is the batch's best positive result,
    rests on ONE implementation (the validator's) and was never measured by the
    producer at all; the null-object control C1 on the envelope law is ONE
    implementation; the size-matched restratification and the random-curve rank
