evidence:
  id: EV-AES-acddd0
  hypothesis_id: null
  hypothesis_id_note: >-
    DELIBERATELY NULL. This record tests whether two mechanism claims replicate
    on an instrument sharing nothing with the codebase that produced them.
    RQ-AES-003 carries no hypothesis about the r=5 yoyo excess; naming one here
    would manufacture a binding this record does not have. Admitted under the
    documented-null allowance recorded in CORR-20260802-009.
  experiment_ids: []
  run_ids: []
  task_ids:
    - TASK-20260805-8fa4c6
    - TASK-20260805-da9ea6
    - TASK-20260805-dccdfa
  type: measurement
  direction: partial_corroboration
  strength: moderate
  strength_basis: >-
    MODERATE. Every quantitative claim in this record was independently
    recomputed twice from raw source before adoption -- once by the Coordinator
    before archiving, once by the independent validator afterward, in separate
    code -- and both reproduced to the digit. The validator additionally
    diffed the two extended codebases against the entire yoyo_sbox_v2-v3-v4
    lineage directly and found zero shared vocabulary in either direction, and
    confirmed the two extensions are SUBSTANTIVELY different constructions
    (rc8probe's prefix counter derives the statistic from BATCH-008's finding
    specification rather than copying v4's RC-10 field; rc8probe's ideal-
    permutation mode uses a persistent hash table for exact injectivity where
    v4 uses a probabilistic-bound approach) -- this is the strongest evidence
    of genuine independence this campaign has produced for any instrument.
    What holds strength at moderate rather than strong: one of the two
    mechanism comparisons (cipher substitution) came back genuinely
    uninformative rather than confirming or refuting anything, and every party
    resolves to one model under standing basis
    0137a051eb5828789eb267fa83c8278086578d4c, so NOTHING HERE COUNTS TOWARD A
    CLOSURE QUORUM.
  claim_tier: toy
  claim_tier_basis: >-
    Reduced-round AES-shaped SPN, r=5, one probe geometry (amask=1, smask=1),
    trials from 2^20 to 2^27, one machine. No crypto-scale, medium-scale,
    affected-scheme or asymptotic claim is made or implied, and no comparison
    to published cryptanalysis is made in either direction (RQ-AES-003 R3).
  certificate_refs: []
  proof_status: empirical_only
  proof_refs: []

  observations:
    - id: OBS-B11-1
      statement: >-
        THE INSTRUMENT IS GENUINELY, VERIFIABLY INDEPENDENT OF THE
        yoyo_sbox_v2-v3-v4 LINEAGE, NOT MERELY A RENAMED COPY. rc8probe.c
        (BATCH-007, committed 1a0ad198) was extended in place: a k-byte prefix
        counter and an ideal-permutation mode, both additions-only (zero
        deletion lines in both diffs, confirmed independently by the
        Coordinator and the validator, each applying the diffs themselves).
        The validator grepped every v4-specific symbol against the extended
        rc8probe files and every rc8probe-specific symbol against v4.c: zero
        matches in either direction. Substantively, rc8probe's prefix counter
        derives the per-word event count BATCH-008's OBS-B8-2 actually
        reported, rather than copying v4's differently-shaped RC-10 field, and
        rc8probe's ideal-permutation mode uses a persistent hash table for
        exact injectivity where v4 uses a single-stream probabilistic bound --
        a different design with a different failure mode (memory growth),
        which is itself evidence the construction was not transcribed.
      status: CONFIRMED by independent code review, spot-checked by the Coordinator
    - id: OBS-B11-2
      statement: >-
        SUBSTRATE REPRODUCTION IS BIT-EXACT. rc8probe_baseline.c's sha256
        matches the committed BATCH-007 blob exactly, and its reproduction of
        arm B01-RAND-20260803701 (W_ge1_by_word=[4,7,6,3],
        whist=[1073741804,20,0,0,0]) matches the ORIGINALLY-COMMITTED BATCH-007
        file byte-for-byte, checked directly against that file rather than
        against the producer's self-report.
      status: CONFIRMED by the Coordinator, direct file comparison
    - id: OBS-B11-3
      statement: >-
        COMPARISON A (BYTE-LOCALITY, MIRRORING BATCH-008) REPLICATES ON THIS
        INDEPENDENT SUBSTRATE for its well-powered sub-claim. At r=5, N=2^27, a
        random-S-box arm: k=1,2,3 all read within |z|<1 of the analytic model
        (z=-0.837, -0.773, 0.177, independently recomputed twice from the raw
        counts and matching to four decimals both times). k=4 shows 2 observed
        events against a modeled 0.125 (naive z=5.303, independently confirmed)
        -- directionally consistent with BATCH-008's finding but explicitly NOT
        decision-relevant at 2 raw events, reported descriptively only, exactly
        as preregistered before the run.
      status: >-
        CONFIRMED. The validator additionally notes this comparison is close to
        a sanity check on correct RNG and counting implementation and bears
        only glancingly on the specific shared-harness risk BATCH-010 named,
        which lives in comparison B below.
    - id: OBS-B11-4
      statement: >-
        COMPARISON B (CIPHER SUBSTITUTION, MIRRORING BATCH-009) IS GENUINELY
        UNINFORMATIVE AT THE EXPOSURE THIS BUDGET REACHED. 0 hits in both the
        live and ideal-permutation arms at N=2^24, confirmed directly from the
        raw run files, not from the producer's framing. This is the MORE
        DIRECT test of the shared-harness risk BATCH-010 named, and it
        produced no signal in either direction: it does not corroborate
        BATCH-009's finding and does not refute it.
      status: >-
        CONFIRMED genuinely uninformative, not silently softened. The residual
        risk class named in EV-AES-1d5136 OBS-B10-3 is UNCHANGED by this batch
        -- neither closed nor deepened.
    - id: OBS-B11-5
      statement: >-
        THE MEMORY-DRIVEN POWER LIMIT ON COMPARISON B IS SUBSTANTIALLY REAL,
        WITH ONE MINOR UNDISCLOSED DESIGN CHOICE. The Coordinator and the
        validator both independently recomputed the ideal-permutation table's
        allocation formula and got 4.295 GB at 2^24 and 8.590 GB at 2^25,
        matching the producer's stated figures exactly. The validator further
        notes the hash-index load factor of 0.5 was not the only viable
        design -- a denser table (load factor ~1.0) could plausibly have
        reached 2^25 within the same 8 GB budget, and the producer did not
        disclose that this parameter was a choice. This does not change the
        substantive conclusion: even at 2^25 the expected excess is ~0.44
        events, still deeply underpowered relative to BATCH-009's original
        ~14-event signal at 2^30.
      status: CONFIRMED as a minor, disclosed gap, not a material defect
    - id: OBS-B11-6
      statement: >-
        THE PREREGISTRATION'S TIMING IS CONFIRMED FROM FILESYSTEM MTIMES ON
        THE ARCHIVED WORKING TREE, NOT ONLY FROM THE FILE'S OWN NARRATIVE.
        PREREGISTRATION.md (17:23:18) predates both cmpA_r5_k1234.json
        (17:23:41) and the comparison-B run files, matching the claimed
        ordering exactly. The "inconclusive by power" framing for comparison B
        was therefore stated in advance, not adopted after seeing a null
        result, which would have been a materially weaker claim.
      status: CONFIRMED by the validator against filesystem timestamps

  defects_carried:
    - id: D-B11-1
      statement: >-
        The ideal-permutation hash table's load factor (0.5) was a design
        choice that was not disclosed as such; a denser table could plausibly
        have reached one more doubling of exposure within the same memory
        budget. Recorded per OBS-B11-5; does not change the substantive
        conclusion that comparison B remains underpowered either way.

  boundaries:
    - >-
      This record bears on whether BATCH-008's byte-locality finding and
      BATCH-009's cipher-substitution finding are lineage-internal artifacts.
      Comparison A's replication addresses this for byte-locality; comparison
      B's null result does NOT address it for cipher substitution, and that
      residual risk stands exactly where BATCH-010 left it.
    - >-
      No mechanism is named for the r=5 excess by this record. Nothing here
      establishes the excess is real; it addresses only whether two prior
      findings about it are instrument-dependent.
    - >-
      Session and implementation independence only. NO MODEL INDEPENDENCE
      under standing basis 0137a051eb5828789eb267fa83c8278086578d4c; nothing
      here counts toward a closure quorum.
    - >-
      Comparison A used a random S-box, not AES, at a different key and seed
      than BATCH-008's central arms; it corroborates the byte-locality
      MECHANISM, not the specific AES reading.

  unresolved_confounds:
    - >-
      The cipher-substitution mechanism specifically (BATCH-009's central
      claim) has still never been corroborated by a codebase outside the
      v2-v3-v4 lineage; RC-B's attempt at this was genuinely underpowered by
      the memory constraint named above.
    - >-
      A denser hash table (load factor ~1.0) was not tried; whether it would
      have reached a materially more informative exposure is untested.
    - The 32-bit-vs-24-bit localization question (EV-AES-8b8dcf boundary) remains open.
    - Whether OUTCOME-A (BATCH-009) depends on idealness specifically versus mere structurelessness (U4) remains open; RC-D still addresses this and is unrun.

  reviewed_by:
    - >-
      TASK-20260805-dccdfa (independent validator; verdict PASSED; confirmed
      archive durability against origin, diffed the extended codebase against
      the entire v2-v3-v4 lineage directly, independently recomputed every
