  observations:
  - >-
    O1. WHAT IS UNDER REVIEW, WHAT AUTHORIZED IT, AND WHICH CONTRACT GOVERNED. DEC-20260815-176614's
    next_actions items (1) and (2) authorized exactly one follow-up task; BATCH-91929e dispatched it
    as TASK-20260817-c603c0 with a reading rule FROZEN IN THE PARENT COMMIT 9c7dd452c before any
    producer artifact existed -- the Red Team verified this directly with git diff-tree and records
    the freeze claim as verifiable and verified. Independent review: Validator TASK-20260817-6f610c
    (verdict passed; ADMIT subject to five characterization corrections) and Red Team
    TASK-20260817-94c89e (verdict objections_material_to_conclusions; contests no reported number).
    CONTRACT GOVERNANCE, RECORDED BECAUSE IT WAS TESTED: the dispatching session's orientation named
    a write_scope of .../red-team/TASK-20260817-94c89e/ while the COMMITTED task card, the COMMITTED
    handoff and the COMMITTED dispatch_queue.json archive entry all name
    .../reviews/TASK-20260817-94c89e/. The Red Team wrote to the committed path and flagged the
    discrepancy rather than resolving it silently. THE COMMITTED CONTRACT GOVERNED, CORRECTLY: a
    dispatch orientation is a pointer, never a contract (AGENTS.md "Inter-agent messaging"), and had
    the reviewer followed the prompt its report would have landed outside the declared artifact_paths
    the archiver reads. Both reviews are at .../reviews/, as declared.
  - >-
    O2. VALIDITY GATES: ALL PASS ON ALL ARMS, INDEPENDENTLY RE-EXECUTED, AND NO ARM IS AN
    INFRASTRUCTURE OUTCOME. Arm A's DIRECT disjointness proof (the [0:5000) prefix of the fresh
    75,000-trial stream on shard 5000 against TASK-20260809-a79e4f stage 1's committed raw per-trial
    S array) PASSES elementwise on both variants, 10,000 elements, zero differing, histograms also
    bit-identical -- reproduced by the Validator from its OWN regenerated stream, not read from the
    producer's comparison. Arm B's ADAPTED two-step proof on shard 8002 PASSES at EXACT float64
    bit-identity across all eight matched_pair_stats arrays and the four hard-invariant integers, max
    relative deviation exactly 0.0, with the declared 1e-9 fallback available at
    cross_regime_arms.py:529 and never fired -- also reproduced independently by the Validator, which
    attempted byte-level float64 identity FIRST and never needed a tolerance. The F[:, 0:n_e-1]
    structural invariant PASSES on all eight (shard, window) combinations with zero mismatches. D2 =
    D3 = 0 on all six decoder calls, none truncated, trials_done == trials_requested on all six. Both
    fail-closed selftests PASS and all three module sha256 pins verify. NEITHER REVIEWER JUDGED
    EITHER PROOF INADEQUATE: the Validator's required judgment is that the adapted proof is an
    ADEQUATE substitute for its own purpose and NOT equivalent to the direct check (as the producer
    itself says), and the Red Team judges the asymmetry correctly scoped and if anything
    under-credited. Under batch.yaml's validity_gates_dominate_everything clause and the task card's
    validity_gates_dominate clause, NO ARM IS DISQUALIFIED AND NO BRANCH IS BLOCKED BY A VALIDITY
    FAILURE. Stated explicitly rather than left implicit, per AGENTS.md rule 5.
  - >-
    O3. TWO VALIDITY-GATE CORRECTIONS THIS ARCHIVE APPLIES TO ITS OWN PRIOR RECEIPT. (a) THE
    F-INVARIANT ELEMENT COUNT IS 4,950,000, NOT 2,475,000. run_manifest.yaml line 249 reports
    2,475,000, that figure propagated into TASK-20260817-f24a5e's snapshot receipt validity_gates
    string and into the snapshot commit message, and this Coordinator repeated it. 2,475,000 is the
    PER-SHARD subtotal (45,000 retained trials x 55 blocks); the correct total over all eight
    combinations is 4,950,000, which the producer's own disjointness_proof_results.json per-check
    totals already sum to and which the Validator counted independently (275,000 / 550,000 / 550,000
    / 1,100,000 per shard for windows P1/P2/N1/N2). The error UNDERSTATES coverage and is
    conservative, but it is a wrong number in a manifest and in an archive receipt and is corrected
    here by superseding record, never by editing a frozen artifact. (b) THE INVARIANT IS NON-VACUOUS,
    ESTABLISHED BY A CHECK THE PRODUCER OMITTED AND THE VALIDATOR ADDED: zero mismatches on blocks
    0..n_e-2 proves nothing unless block n_e-1 actually changes, and the last block DOES differ
    between arms on 531 to 2,197 trials per window, i.e. 10.4% to 11.4% of trials in every one of the
    eight cells. The Validator also added a negative control on the fail-closed loader itself,
    confirming it ACCEPTS a correct hash rather than rejecting everything vacuously. Both additions
    strengthen the gate; both are recorded as review contributions, not producer claims.
  - >-
    O4. THE 2x2 IS AN ADMISSIBLE MEASUREMENT OF THE (SHARD x REGIME) CONTRAST, AND THE SPECIFIC
    COLLINEARITY BATCH-174014 NAMED IS GONE. Shards 5000 and 8002 were each measured at BOTH the
    25->50 and the 50->100 jackknife-batch-size transition, in one procedure, from exactly one
    n_trials=75,000 analysis call per (shard, variant), on windows P1 [30000:35000), P2
    [35000:45000), N1 [45000:55000), N2 [55000:75000) -- module-level frozen constants, pairwise
    disjoint by inspection, union exactly [30000:75000), all above both re-derived high-water marks
    (shard 5000 -> 15000, shard 8002 -> 30000). The Validator re-derived both high-water marks from
    MORE fields than the producer used and swept every committed JSON under GOAL-HQC-001 for a fourth
    consumer of either shard, finding none. The design matrix is full rank; the Red Team states
    plainly that the collinearity "is gone, and that is a real, verified structural achievement."
    Validator's required judgment: ADMISSIBLE, plainly, within the scope in claim_tier_note.
  - >-
    O5. THE FOUR FRESH CELLS AT k=17, REPRODUCED TO THE LAST BIT BY TWO INDEPENDENT IMPLEMENTATIONS.
    alpha(5000, regime P) = 2.0488128380076307; alpha(5000, regime N) = 2.960737268597787;
    alpha(8002, regime P) = 0.32362272345795423; alpha(8002, regime N) = 1.5943364808460014. The
    three pre-registered contrasts: regime main effect -1.091319093989102, shard main effect
    1.545795451150731, interaction 0.3587893267978908 -- Validator recomputation delta exactly 0.0 on
    all three. The Validator reproduced all four exponents end-to-end from raw data its own driver
    generated (identical to the last bit) and, beyond the four headline numbers, matched 64 of 64
    per-window statistic arrays. The Red Team re-derived all four from the committed se_paired arrays
    via the identity alpha = -log2(se_hi/se_lo) to better than 1e-14. No number in Part A is
    contested by either reviewer.
  - >-
    O6. "ALL FOUR FRESH CELLS ARE POSITIVE" IS A k=17 STATEMENT AND DOES NOT SURVIVE THE k SWEEP.
    BOTH REVIEWERS FOUND THIS INDEPENDENTLY, FROM THE SAME COMMITTED PER-k ARRAYS, AT ZERO MARGINAL
    COST, AND IT IS STATED NOWHERE IN THE PRODUCER'S REPORT. At k=2, on identical data, identical
    windows, identical shards, identical regimes and the identical estimator, the four cells are
    0.580733 / 0.506553 / 0.628397 / 0.511866 -- all within 0.13 of the analytically forced 0.5 --
    and the three contrasts are +0.095 / -0.026 / -0.042, i.e. all approximately zero. The values fan
    out monotonically with k in three of four cells, reaching [0.35, 4.02] by k=26; at k=21
    alpha(8002, P) = -0.112824 and at k=20 it is -0.027, so one of the four "all positive" cells is
    NEGATIVE at neighbouring orders. The fan-out tracks the producer's OWN Forced-Value-1 measurement
    of the estimator's bias: mean log2 A_k on the null at arm 0 is -0.00007 at k=2, first exceeds
    0.01 in magnitude at k=13, is -0.10164 at k=17 and -2.71938 at k=26. THE DRAMATIC EXPONENTS EXIST
    ONLY WHERE THE ESTIMATOR IS WORST SAMPLED AND VANISH WHERE IT IS MEASURED TO BE NEARLY EXACT.
    Under docs/inventor-protocol.md Section 3 that is the canonical artifact signature, and it is
    fired here by the campaign's own control against the campaign's own signal. k=17 is legitimately
    pre-registered (m_load_bearing_order = 17), so this is NOT selective reporting by the producer --
    it is an unstated k-dependence in a quantity the family reads directionally. Mechanism, stated as
    a hypothesis and not as a result (Red Team): log2_A_from_hists forms sum_s C(s,k) H_s, and at
    k=17 against mean S=17.88 the numerator is carried by a thin right tail of high-S trials, so the
    effective sample size for the k=17 estimand is a small fraction of T and a 200-batch jackknife
    inherits that tail's instability.
  - >-
    O7. THE TWO FRESH-RANGE REPLICATION CELLS, REPORTED SEPARATELY FROM THE FACTORIAL AS THE FROZEN
    RULE REQUIRES. This is the FIRST time any cell in this family has been replicated at the same
    (shard, regime) on disjoint data. Cell (5000, regime P): fresh +2.0488128380076307 against the
    historical +2.836 (EV-HQC-469c08 O6), delta -0.787. Cell (8002, regime N): fresh
    +1.5943364808460014 against the historical -0.8662355237627483 (EV-HQC-927899 O3), delta
    +2.46057200460875 AND A SIGN FLIP. The Red Team verified both historical citations against their
    ledger records line by line and confirms that citing rather than recomputing them was correct,
    since recomputation would require re-decoding already-consumed index ranges this design is
    forbidden to touch. BOTH CELLS MOVED TOWARD THE HISTORICAL MIDPOINT (+0.985), and the larger
    historical deviation produced the larger move -- the predicted signature of regression to the
    mean under selection on extremes, which is exactly how batch.yaml's own arm-assignment rationale
    selected these two shards ("MAXIMUM HISTORICAL CONTRAST ... the largest available true
    contrast"). That justification is valid only under the hypothesis the batch exists to test. The
    prediction was checkable and came true on both cells. WHAT THE GAP MEANS IS SETTLED BY O8, NOT BY
    SPECULATION: the +2.461 gap is SMALLER than the instrument's own measured draw-to-draw spread on
    the real object, so the sign flip is the expected behaviour of this statistic and is not a
    finding that requires a mechanism.
  - >-
    O8. THE BATCH MEASURED THE REAL-OBJECT NOISE FLOOR AND DID NOT REPORT IT. THIS IS THE MOST
    CONSEQUENTIAL NUMBER IN THE BATCH AND IT COST NOTHING. Windows P2 [35000:45000) and N1
    [45000:55000) are both T=10,000, both jackknife batch size 50, on the same shard, from the same
    call, under the same procedure, on disjoint index ranges -- so anything differing between them is
    sampling realization, by construction. Measured se_paired at k=17: shard 5000, P2 0.016872 vs N1
    0.281963, a ratio of 16.712x, with the historical T=10,000 value 0.017520 (EV-HQC-469c08 O7) as a
    third disjoint draw; shard 8002, P2 0.020055 vs N1 0.074586, a ratio of 3.719x, with the
    historical 0.022097 (EV-HQC-927899 O3) as a third draw. Since every alpha in this family is
    exactly -log2(se_hi/se_lo), those ratios ARE alpha noise, distribution-free, on the real object,
    requiring no parametric model: 4.063 and 1.895 in alpha units, RMS 3.17. SET AGAINST EVERYTHING
    THIS FAMILY HAS EVER REPORTED: entire historical exponent spread 3.702; fresh exponent spread
    2.637; largest reported contrast (shard main effect) 1.546; the +2.461 "replication failure";
    the producer's null band width 2.788. The instrument's own draw-to-draw spread at fixed (shard,
    T, batch size, procedure) exceeds every contrast this campaign has computed and approaches the
    entire phenomenon it has been studying. This is the second option in the prior Red Team's own
    required_controls ("repeat the SAME (shard, transition) measurement with genuinely disjoint fresh
    trial ranges"), which this batch's design paid for and did not compute.
  - >-
    O9. O8 OVERTURNS EV-HQC-469c08 O7's HETEROGENEITY READING, BY SUPERSEDING OBSERVATION AND NEVER
    BY EDIT. EV-HQC-469c08 O7 reports a 3.24x BETWEEN-shard spread of se_paired at T~10,000 across
    four shards and reads it as "broad shard-to-shard heterogeneity in this estimator's variance."
    The WITHIN-shard, same-T, same-batch-size, disjoint-data spread measured here is 16.71x on shard
    5000 and 3.72x on shard 8002. The within-shard spread equals or exceeds the between-shard spread
    that O7 called heterogeneity, so O7's signal is fully accounted for by within-shard sampling
    variation and requires no shard-to-shard difference at all. The Red Team notes this corrects a
    finding of its own lineage. EV-HQC-469c08 STANDS EXACTLY AS ARCHIVED AND IS NOT EDITED; this
    observation supersedes its INTERPRETATION only, not its measurements, which remain correct and
    reproducible.
  - >-
    O10. THE NULL-OBJECT CONTROL IS BLIND BY ITS OWN PRE-REGISTERED FAIL-CLOSED RULE. THIS IS THE
    FIFTH CONSECUTIVE INSTANCE OF THIS CAMPAIGN'S CONTROL-BLINDNESS PATTERN AND IS NAMED AS SUCH,
    NOT SOFTENED. No planted magnitude drove the planted median outside the unmodified null 95% band:
    the planted medians recomputed by the Validator from the raw CSV are 0.129895 / 0.059429 /
    -0.115719 against the band [-1.0295584295881741, 1.7588760235887884], all three IN_BAND. The
    producer applied the rule correctly and said BLIND in that word; both reviewers confirm the
    arithmetic and the verdict. THE RED TEAM THEN SHOWED THE LEG COULD NOT HAVE FIRED AT ANY g.
    Clearing the band requires a downward median displacement of 1.3366, i.e. rho >= 2.5256. The
    pre-registered plant class does not merely fall short, it SATURATES AND REVERSES: median rho is
    1.1414 / 1.1666 / 1.3462 at g = 1.25 / 1.5 / 2.0, then 1.0381 at g=3, 0.8275 at g=4, 0.8230 at
    g=6, 0.8532 at g=10 and 0.8688 at g=50, because clipping to [0,56] around mu=17.877 drives the
    planted arm to a near-two-point law whose k=17 jackknife SE is LOWER than the base. The Validator
    reached the same operational conclusion by a different route, computing the required rho > 2.53
    against a maximum achieved 1.392 and recording the leg as UNDERPOWERED BY CONSTRUCTION. THE BLIND
    VERDICT IS THEREFORE CORRECTLY DERIVED BUT SAYS MORE ABOUT THE BAND'S WIDTH AND THE PLANT CLASS'S
    REACH THAN ABOUT THE INSTRUMENT'S SENSITIVITY. The operational consequence is unchanged and
    binding: THE NULL BAND CARRIES NO INTERPRETIVE WEIGHT AT THIS ARCHIVE, and this batch produced an
    UNCALIBRATED DIAGNOSTIC. The campaign's own named mechanism for this pattern (an invariance
    strong enough to force a control's null also blinds it to any defect sharing that invariance)
    recurs here with a measurement attached for the first time: the boundedness that makes the null
    object clean is the same boundedness that caps the plant below the detection threshold.
  - >-
    O11. THE PRODUCER'S "FORCED IDENTITY" SUPPORTS NOTHING, AND THIS ARCHIVE CORRECTS ITS OWN PRIOR
    RECEIPT ACCORDINGLY. The identity alpha_planted = alpha_unmodified - log2(rho_g) is reported to
    have held to a maximum absolute residual of 6.217248937900877e-15 over 600 planted replicates,
    and that figure is cited BOTH in confound_break_report.md Section 3.6 AND in
    TASK-20260817-f24a5e's snapshot receipt, which this Coordinator wrote, as evidence that "the
    plant was demonstrably realized." IT IS AN ALGEBRAIC TAUTOLOGY. Substituting the definitions at
    null_object_control.py:508-514, the se_hi terms cancel identically and the residual is exactly
    zero for ANY three positive numbers. The Validator fed 20,000 triples of arbitrary, unrelated
    random positive numbers into the same expression and obtained a maximum residual of 1.07e-14 --
    the same order as the celebrated 6.2e-15; the Red Team obtained residual 0.0 from fictional
    se_planted values of 0.31 and 1e-6 and 1.776e-15 from 4321.0. The reported number measures float64
    rounding and nothing else. THE CONCLUSION SURVIVES BUT ITS SUPPORT IS HALVED: the plant WAS
    realized, and the only evidence for that is the measured rho rising 1.134 -> 1.213 -> 1.392 with
    g (producer means; Validator replicate-0 values 1.1245 / 1.2300 / 1.3842 bracket them, with
    variance ratios 1.570 / 2.256 / 3.975 and negligible clipping). Even that evidence is now scoped
    by O10: the monotone rise is an artifact of sampling only g <= 2 and reverses at g=3. THE
    IDENTITY IS NOT CARRIED FORWARD AS CORROBORATION ANYWHERE IN THIS RECORD OR IN DEC-20260817-2b638b.
  - >-
    O12. THE NULL OBJECT IS THE WRONG SHAPE FOR THE ESTIMATOR IT WAS BUILT TO CALIBRATE, AND FIXING
    THE SHAPE MAKES THE DIAGNOSTIC LOOK WORSE. At null_object_control.py:256-257 the two synthetic
    arms are drawn from INDEPENDENT RNG streams, so the "matched pair" is not matched. The real pair
    is maximally coupled: the V3 defect touches only block n_e-1, so the two real arms share 55 of 56
    blocks on every trial -- which is precisely what this batch's own F[:, 0:n_e-1] validity gate
    proves over 4,950,000 elements. The batch proves the pairing is total and then calibrates the
    PAIRED estimator on an object with NO PAIRING AT ALL. Measured se_unpaired/se_paired at k=17:
    0.9965 / 0.9984 in the producer's null (Validator: 0.998 / 0.997 / 0.998 across three rungs)
    against 2.338, 5.604, 6.694, 6.843, 15.266, 15.662, 17.260, 28.691 in the eight real cells. In
    the producer's null the paired estimator IS the unpaired estimator; the 2.3x-28.7x pairing gain
    that defines the real instrument is set to 1. BOTH REVIEWERS INDEPENDENTLY BUILT A CORRECTED
    COUPLED NULL, BY DIFFERENT CONSTRUCTIONS, AND BOTH FOUND ITS BANDS WIDER. Red Team (base ~
    Binomial(55,p), arm_i = base + Bernoulli_i(p); ratio 2.985 median, in the real range): 95% band
    width 3.398 against the producer's 2.788, i.e. 22% wider, with mean alpha 0.2747 against 0.3322.
    Validator (identical draw with only the last block re-drawn; ratio 4.77 / 4.47 / 4.19): bands
    4.3255 and 3.5083 against the producer's 3.1877 and 2.7884. THE SHAPE ERROR DOES NOT FLATTER THE
    PRODUCER -- correcting it widens the band. Both reviewers state, and this record binds, that
    neither reviewer-built null is an adjudicating band: neither was pre-registered, and the
    Validator's perturbs ~43% of trials where the real V3 defect changes S on ~11%, making its band
    an upper bound. Their role is to establish the DIRECTION of the shape error, which they do
    unambiguously and independently.
  - >-
    O13. WHAT PART B DID ESTABLISH, WHICH IS REAL AND IS RECORDED AS THE POSITIVE CONTENT IT IS.
    (a) THE CONTROL CAN FAIL: the Validator attacked it as a construction by feeding the same
    pipeline a dependent-blocks (beta-binomial) arm and moved log2 A_k from ~0 to +4.7167 with
    z_paired = -9.36, so the three forced values are forced by the MATHEMATICS (A_k = 1 under
    independent blocks) and not by a code path that returns 0. It also reports, honestly, a
    non-test: giving arm B a different p does NOT move the paired diff, which is correct behaviour
    because A_k is normalised by q^k, and warns future attackers not to read that as blindness.
    (b) BATCH-SIZE REGIME ALONE DOES NOT SHIFT THIS DIAGNOSTIC ON THE NULL: the difference of mean
    alpha between the 25->50 and the 50->100 rung pairs is 0.0217 against a per-replicate SD of 0.70,
    well under half a standard error of the mean. This is a decoder-free, shard-free, defect-free
    negative-control result, it does NOT depend on the band's width or on the blindness verdict
    (it is a difference of means, not a band comparison), and it is the strongest positive content
    in Part B. (c) A MEASURED INSTRUMENT BIAS: log2_A_from_hists carries a batch-size-dependent bias
    that decays with T in the direction it should (-0.1441, -0.1016, -0.0265, -0.0476 at k=17 across
    T = 5,000/10,000/20,000/40,000), which is correct non-artifact behaviour and which the producer
    measured but did not state as a finding. (d) FORCED VALUE 3 IS MISSED BY 9 SIGMA AND ITS
    PRE-REGISTERED EXCUSE IS FALSIFIED BY THE PRODUCER'S OWN DATA: the full-ladder fit gives alpha =
    0.35133, SD 0.23433 over R=200, SE 0.01657, z = -8.97 against the forced 0.5. design.md Section
    3.4 pre-committed the finite-T explanation, which predicts |0.5 - alpha| falls roughly 4x across
    the ladder's 8x range in T; measured, it is 0.146148 / 0.167801 / 0.125694 -- FLAT, not even
    monotone. A quantity that stays flat when it should decay is the canonical artifact tell, here
    fired by the control's own forced value against an excuse frozen before the data existed. The
    honest reading is that with N_JACK_BATCHES pinned at 200 this estimator's paired SE at k=17
    scales as T^(-0.35), not T^(-0.5), across 5,000-40,000, so every directional statement in this
    family that used 0.5 as its reference point used the wrong reference point.
  - >-
    O14. THREE PIPELINE STAGES ARE TRAVERSED BY THE NULL BUT NOT TESTED BY IT (Red Team, checked and
    clear for this batch, named because nothing would announce a failure). (a) evaluable_k gating is
    never exercised near its T_STAB_THRESHOLD = 30 boundary, because the null's Binomial(56, 0.319)
    histograms give evaluable_k = 2..26 at every rung and identically across all 200 replicates at
    all four rungs -- so any defect in the gate is invisible by construction. (b) matched_pair.py's
    jack_se uses np.nanmean/np.nansum but divides by the ROW COUNT rather than the non-NaN count, so
    a k with NaN leave-one-out rows would return a SILENTLY DEFLATED se_paired that maps directly
    into alpha; not triggered here (every reported se_paired is finite and positive, evaluable_k is
    2..26 in all eight real cells), and recorded because the pipeline would not announce it. (c) A
    symmetric bias in log2_A_from_hists is invisible in Forced Value 2 by exchangeability of the two
