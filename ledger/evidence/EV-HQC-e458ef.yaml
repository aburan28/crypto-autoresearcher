    resource_check:
      examined: true
      reading: >-
        THREE READINGS UNDER WHICH THIS BLOCK IS AN ASSET RATHER THAN A BLOCK, EXAMINED AT THE MOMENT
        THE COST IS LOWEST. (1) THE k-LOCALIZATION IS A FREE INSTRUMENT UPGRADE, NOT A LOSS. The same
        measurements that make k=17 unreadable show the estimator is nearly exact at k <= 7 (bias
        -7e-5 at k=2, same-T noise handle 0.06-0.11), so the obstruction identifies a REGIME WHERE
        THE INSTRUMENT WORKS rather than retiring it. Every cell this family has ever measured can be
        re-read there for zero decoder calls from already-committed per-k arrays. (2) THE
        INSTABILITY MAY BE THE ESTIMAND SPEAKING, NOT THE ESTIMATOR FAILING. The mechanism that
        destabilises k=17 -- the numerator being carried by a thin right tail of high-S trials -- is
        the same structure that would concentrate a genuine defect signal in that tail. Read that way,
        a 16.7x draw-to-draw swing in a tail-carried statistic is a measurement of where the
        load-bearing information lives, and the useful object becomes the tail's effective sample
        size (measurable directly) rather than the slope computed from it. This reading is a
        hypothesis, is recorded as one, and is exactly the question the Red Team names as unresolved:
        whether se_paired's k=17 instability is an artifact to route around or a property of the
        estimand worth studying. (3) THE DOMINANCE FACT IS A FREE UPGRADE PATH: on identical
        replicates the 4-rung OLS has SD 0.234334 against the 2-point's 0.700666, so the obstruction
        comes with its own already-computed 2.99x-better replacement at zero additional cost, and the
        4-point ladder on this batch's own four windows is already computable from committed data.
        A FOURTH READING WAS CONSIDERED AND FOUND EMPTY, RECORDED SO IT IS NOT RE-EXAMINED BLINDLY:
        the noise floor does NOT become a resource as a "detection-by-variance" statistic, because
        all eight cells have |z_paired| < 2.1 with diffs of both signs and no positive control has
