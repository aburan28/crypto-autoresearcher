    design.md Section 3.5 pre-registers SeedSequence([20260817, T, r, arm_index, leg_code]) with
    leg_code = 1 + index of g, and the code hard-codes leg_code to 0 at
    null_object_control.py:256-257, making it a DEAD PARAMETER; planted replicates reuse the
