  strength: replicated
  strength_note: >-
    DESCRIBES THE REPRODUCIBILITY OF THE MEASUREMENT, NOT THE RESOLUTION OF ANY CAMPAIGN QUESTION,
    which this record leaves open and, per the obstruction block, shows this instrument cannot settle
    at k=17. What is replicated: the Validator wrote its own driver from the pinned modules' APIs,
    ran its own six decoder calls, regenerated the raw data, and reproduced all four fresh exponents
