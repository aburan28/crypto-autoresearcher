  - >-
    O15. FOUR FURTHER DEFECTS AND DEPARTURES, EACH DISCLOSED HERE RATHER THAN LEFT TO BE RE-COPIED.
    (a) DEV-1's PRE-Part-A CONTENT ANCHOR IS AN UNVERIFIABLE SELF-ATTESTATION. The claim that
