    4 GB cap. MEASURED, NOT ESTIMATED, THREE WAYS. No infrastructure event of any kind occurred.
  - >-
    O20. BRANCH A (POSITIVE DETECTION) HAS STILL NEVER FIRED IN THIS CAMPAIGN, AND THIS BATCH DOES
    NOT CHANGE THAT. All eight (shard, window) cells have |z_paired| < 2.1 at k=17 with diffs of both
    signs, so none of them is a detection of the planted defect. alpha is a scaling exponent of the
    estimator's NOISE, not of a signal, and any reading of it as characterising detectability
    inherits that. The Red Team's standing BATCH-2ecaa1 objection is not retired by this batch.
  inference: >-
    THE CONFOUND WAS BROKEN AS DESIGNED, AND THE MEASUREMENT THAT BROKE IT SHOWS THE INSTRUMENT
    CANNOT RESOLVE WHAT IT WAS BUILT TO RESOLVE. Every pre-registered validity gate genuinely passes,
    independently re-executed from freshly regenerated raw data (O2, O3); the 2x2 is an admissible
    measurement of the (shard x regime) contrast and the specific 100% collinearity BATCH-174014
    named is gone (O4); and every reported number reproduces, most of them bit-for-bit, from two
    independent implementations in two independent processes (O5). WHAT THE MEASUREMENT SHOWS IS NOT
    WHAT ITS HEADLINE SAYS. The "all four cells positive" result is a k=17 statement that vanishes at
    k=2, where the same data through the same estimator returns the analytically forced 0.5 in every
    cell and all three contrasts within 0.1 of zero, fanning out monotonically with k in exact step
    with the producer's own measured estimator bias (O6). The batch's own data contains a
    distribution-free measurement of the instrument's draw-to-draw spread on the REAL object at fixed
    (shard, T, batch size, procedure) -- 16.71x and 3.72x in se_paired, 4.063 and 1.895 in alpha
    units, RMS 3.17 -- which exceeds every contrast the campaign has computed, exceeds the +2.461
    replication gap, and approaches the entire 3.702 historical spread (O8). That measurement, not
    the parametric null, is what settles the replication question: the shard-8002 sign flip is the
    expected behaviour of a statistic whose own spread is larger than the range of values being
    compared, and requires no mechanism (O7). It also retires EV-HQC-469c08 O7's heterogeneity
    reading by superseding observation, since the within-shard spread equals or exceeds the
    between-shard spread that finding called heterogeneity (O9). THE CALIBRATION WAS NOT OBTAINED,
    FOR TWO INDEPENDENT REASONS, EACH ESTABLISHED BY A DIFFERENT REVIEWER WITH A DIFFERENT
    INSTRUMENT. The control is BLIND under its own frozen fail-closed rule -- the fifth consecutive
    instance of this campaign's control-blindness pattern -- and the Red Team's extension of the plant
    class past its pre-registered ceiling shows the leg could never have fired at any g, because rho
    peaks near 1.35 at g=2 and reverses against a required 2.53 (O10). Independently, the null object
    is the WRONG SHAPE: its arms are uncoupled where the real pair shares 55 of 56 blocks, which this
    batch's own F-invariant gate proves, and both reviewers built corrected coupled nulls that give
    WIDER bands -- fixing the shape makes the diagnostic look worse, not better (O12). One cited
    verification turns out not to be a verification at all: the "forced identity" is an algebraic
    tautology whose residual measures float64 rounding, and this Coordinator's own snapshot receipt
    repeated that overstatement and corrects it here (O11). WHAT THE BATCH DID ESTABLISH POSITIVELY
    IS REAL AND IS NOT BURIED: the control can fail (+4.72 bits, 9.4 sigma, under a dependent-blocks
    probe), batch-size regime ALONE does not shift the diagnostic on the null (0.0217 against a
    per-replicate SD of 0.70, a result independent of the voided band), the estimator's
    batch-size-dependent bias decays with T as it should, and Forced Value 3 is missed by 9 sigma
    with a pre-registered finite-T excuse falsified flat by the producer's own three rung pairs, so
    the family's 0.5 reference point was the wrong reference point (O13). THE HONEST SUMMARY IS THE
    VALIDATOR'S: this is a statement that the INSTRUMENT cannot resolve the question, not a statement
    that there is nothing to resolve. NEITHER READING IS LICENSED IN THE OPPOSITE DIRECTION EITHER:
    no directional claim in this task family at k=17 survives, and no directional claim AGAINST one
    is established. H-HQC-18d1b4 is untouched in both directions, and nothing here bears on HQC.
