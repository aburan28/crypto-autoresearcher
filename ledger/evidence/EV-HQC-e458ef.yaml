  obstruction:
    recorded_voluntarily: >-
      FILED THOUGH direction IS neutral AND NO LANE IS CLOSED. templates/research-records.md requires
      this block when direction is weakens|contradicts or when a record closes a lane; neither
      applies. It is filed because this batch produced exactly what the program's obstruction
      registry lacks -- tools/obstruction_registry.py currently reports NO obstruction blocks
      recorded program-wide -- and because both reviews supply the quantity, the values, the error
      bars and the scope that turn a verdict into a datum. Recording it as prose would be a fatigue
      report under AGENTS.md "Closure standard"; recording it as a measurement makes it comparable,
      re-scopeable and invertible by any later reader in any goal.
    statement: >-
      THE OBSTRUCTION IS A PROPERTY OF THE INSTRUMENT, STATED AS A CLAIM ABOUT THE OBJECT AND NOT
      ABOUT THE ATTEMPT: the 2-point local exponent of the matched-pair jackknife standard error at
      joint-moment order k=17, computed with N_JACK_BATCHES held at 200, has a draw-to-draw
      dispersion on the real object -- at FIXED shard, fixed T, fixed batch size and identical
      procedure, differing only in which disjoint trial indices were sampled -- that equals or exceeds
      the entire spread of the phenomenon the campaign has been reading from it. The dispersion is
      not a property of the shards, the regimes or the defect; it is a property of the estimator at
      high joint-moment order, where the histogram functional sum_s C(s,k) H_s is carried by a thin
      right tail of high-S trials so that the effective sample size for the estimand is a small
      fraction of T. It is near-absent at k <= 7, where the same estimator returns its analytically
      forced value on the same data.
    quantity: >-
      The instrument's own noise scale, in alpha units (log2 ratio of paired standard errors),
      measured between two same-T, same-shard, same-batch-size, disjoint-index windows, compared
      against the largest effect the campaign has ever reported in the same units.
    value: >-
      REAL-OBJECT NOISE SCALE, RMS 3.17 alpha units, from n = 2 same-T contrasts (one per shard):
      shard 5000, se_paired at k=17 of 0.016872 (window P2 [35000:45000)) vs 0.281963 (window N1
      [45000:55000)) = 16.712x = 4.063 alpha units; shard 8002, 0.020055 vs 0.074586 = 3.719x = 1.895
      alpha units. A third disjoint draw per shard exists in the committed historical record (5000:
      0.017520, EV-HQC-469c08 O7; 8002: 0.022097, EV-HQC-927899 O3) and is consistent with the lower
      member of each pair. ERROR BARS, STATED HONESTLY: this is a SCALE FROM n = 2 CONTRASTS PLUS ONE
      HISTORICAL DRAW PER SHARD, NOT A DISTRIBUTION; no confidence interval is computable from it and
      none is claimed. AGAINST THE PHENOMENON, in the same units: entire historical exponent spread
      3.702; fresh exponent spread 2.637; largest reported contrast (shard main effect) 1.546; the
      "failed" replication gap 2.461; the fresh regime main effect 1.091. CORROBORATING PARAMETRIC
      SCALE, RECORDED AS SCALE ONLY AND EXPLICITLY CARRYING NO INTERPRETIVE WEIGHT because the control
      that produced it is BLIND under its own frozen rule and is the wrong shape: producer null 95%
      band widths 2.788 (regime N rung pair) and 3.188 (regime P); Red Team coupled-null width 3.398
      (+22%); Validator coupled-null widths 3.508 and 4.326. Every route -- one distribution-free on
      the real object, three parametric and disputed -- puts the instrument's own spread in the range
      2.79 to 4.33 against a 3.702 phenomenon. SEPARATELY MEASURED, SAME OBSTRUCTION, DIFFERENT
      HANDLE: the same-T noise handle falls from 4.063 / 1.895 at k=17 to 0.061 / 0.105 at k=2, a
      roughly 40x reduction, while the estimator's own measured bias falls from -0.10164 to -0.00007.
