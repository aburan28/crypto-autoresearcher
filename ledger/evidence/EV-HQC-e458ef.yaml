    scope: >-
      PS-R3 reduced parameters (n=7187, n_e=56, n_2=128, dup=1, N=7168); the matched-pair jackknife
      paired standard error se_paired at joint-moment order k=17 with N_JACK_BATCHES=200; T in
      {5000, 10000, 20000}; shards 5000 and 8002; trial indices [30000:75000) for the fresh windows;
      one defect class (V3, last-block-window-read-early) at one injection point; this decoder path;
      this budget. THE OBSTRUCTION IS CLAIMED NOWHERE ELSE. In particular it is NOT claimed for
      k <= 7, where the same measurements show the estimator behaving as theory requires; it is NOT
      claimed for a >= 3-rung ladder estimator on the same data, which is measured to be 2.99x less
      noisy; and it is NOT a statement about HQC, its DFR, assumption A17 or A5, or any standardized
