    above. Freshness semantics are correct; the field name overstates them. (d) THE TWO REVIEWERS
    DISAGREE ON EXACTLY ONE POINT, RECORDED RATHER THAN RESOLVED: the Red Team calls Arm A's proof
    cross-machine and cross-platform (Linux x86_64 CPython 3.11 -> macOS arm64 CPython 3.13), while
    the Validator finds that the comparator record TASK-20260809-a79e4f/matched_pair_results.json
    carries NO environment block at all, so the cross-machine adjective is an inference from sibling
    records 8bbdd2 and e61cca rather than a fact in the comparator's own record. Both agree the
    bit-identity result itself holds. This archive adopts the Validator's narrower phrasing:
    cross-run, cross-process, cross-session, with cross-machine unsupported by the comparator's own
    record.
  - >-
    O16. TWO STRUCTURAL COSTS AND ONE PARETO FACT, NONE OF WHICH APPEARS IN ANY BATCH ARTIFACT.
    (a) THE DISCARDED PREFIX IS UNBUDGETED AND COMPOUNDS. Each analysis call computes [0:30000) and
    throws it away: 120,000 of Part A's 321,800 trial-decodes -- 37.3% of the decoder work -- produced
    no datum, and neither cost_projection.json (Part B only) nor batch.yaml's sizing paragraph
    separates it. The cost is monotone in the family's own history (high-water 5,000 -> 15,000 ->
    30,000 -> 75,000), so the next SAMPLING task in this family must burn 4 x 75,000 = 300,000
    discarded decodes, about 67 seconds at this batch's own measured throughput, BEFORE ITS FIRST NEW
    DATUM -- nearly this whole batch's spend, for nothing -- and the one after that about 134 s.
    Persisting the retained per-trial S arrays (~600 KB as int8 for all eight fresh cells, against a
    4 GB cap) eliminates it entirely and would additionally upgrade both disjointness proofs from
    prefix-verified to window-verified (O17) and make re-analysis at another k or another
    N_JACK_BATCHES free instead of impossible. (b) THE DEBIT CONVENTION TRACKS THE CHEAPEST
    COMPONENT. "Only executor-measured wall-clock is debited" is stated openly at batch.yaml:348-374
    and at every checkpoint since BATCH-412513, so it is disclosed, not hidden; its consequence is
    that the reported 4.35%-of-authorization figure covers 78.371 s of executor time in a batch that
    also spent two 1,800-second reviewer authorizations and two Coordinator sessions. (c) THE
    CAMPAIGN'S PRIMARY DIAGNOSTIC IS DOMINATED ON ITS ONE RELEVANT AXIS BY AN ALTERNATIVE THE
    PRODUCER COMPUTED IN THE SAME FILE: on the executor's own identical R=200 null replicates, the
    2-point local exponent has SD 0.700666 and the 4-rung OLS in log-log has SD 0.234334 -- 2.99x
    less noisy at zero additional cost. On the real object, a 4-point ladder over this batch's own
    four windows gives alpha = 0.4734 for shard 5000 (residual RMS 1.008) and 0.0115 for shard 8002
    (residual RMS 0.514), with shard 5000 landing INSIDE the [0.4, 0.6] band that EV-HQC-927899 O4
    calls all four single-shard exponents "FAR OUTSIDE" -- reported as arithmetic on committed data,
    not as a truth claim, since the residual RMS says the fit is badly determined, which is the
    point. A dominated_by: null for the 2-point exponent anywhere in this campaign's records would be
    a fabrication under AGENTS.md rule 9; the honest value is "4-rung OLS on identical data, 2.99x
    lower SD".
  - >-
    O17. BOTH DISJOINTNESS PROOFS CERTIFY A PREFIX; THE RETAINED WINDOWS ARE DETERMINISM-INFERRED,
    SYMMETRICALLY ON BOTH ARMS. Arm A certifies [0:5000) and Arm B [0:10000); the data every
    statistic is computed on is [30000:75000) and is verified against nothing external on either arm.
    The step from prefix to windows is an inference from stream determinism -- well founded, and
    independently strengthened here rather than merely asserted: the Validator read _t_shard directly
    and established that trial ti is a PURE FUNCTION of (parameter set, shard, ti), drawn from
    CTRStream(key, dom || ti) with key = sha_key(ps_id, "T", shard, MASTER_SEED), with decode_blocks
    strictly row-wise, and confirmed it empirically by showing F from a 200-trial call and a
    137-trial call bit-identical on their common prefix and a 137-trial call at decoder batch size 7
    bit-identical to one at batch size 64. That is a stronger argument than the producer's
    one-call-vs-two-call check, which the Validator judges near-vacuous as a check (comparing a
    function's output on a copy against its output on a view) though true. CONSEQUENCE FOR
    DEC-20260815-176614's CARRIED-FORWARD ITEM (2), WHICH IS HEREBY DISCHARGED: design.md Section 2.5
    Step 4 names the residual risk as the genuine SAME-PROCESS-vs-CROSS-PROCESS gap, explicitly not
    numpy RNG or platform drift, and both reviewers confirm the correction is materially right rather
    than cosmetic -- the Validator verified the underlying claim by reading stage_a.py itself
    (CTRStream is SHA-256 in counter mode, fixed_weight_support is Floyd's algorithm over that
    stream, no numpy RNG anywhere in the T-arm sampler) rather than by citing BATCH-174014's Red
    Team. Step 5 correctly records Arm A's pass as NARROWING, not closing, Arm B's gap.
  - >-
    O18. A NEW COLLINEARITY WAS INTRODUCED FOR FREE AND WAS AVOIDABLE FOR FREE. cross_regime_arms.py
    lines 89-95 fix the window order identically on both shards (P at [30000:45000), N at
    [45000:75000)), so regime is now 100% collinear with position-within-call on both arms. It is NOT
    mechanistically live -- CTRStream is deterministic and index-keyed, so "position" is not a
    mechanism but a sampling realization -- and the Red Team says so rather than inflating it. It
    matters because the design has four cells and ZERO error degrees of freedom, structurally the
    same defect as the 2-point exponent it was built to interrogate, so the realization cannot be
    separated from the effect. Counterbalancing the window order across the two shards would have
    cost zero additional decodes. Adding a third shard at both regimes would have cost about 150,000
    decodes (~87 s) and bought 2 error degrees of freedom, against 4.35% of authorization used.
    SEPARATELY AND POSITIVELY: the four-cell factorial itself was a genuine improvement over the
    directive's two-cell minimum and was declared in advance as an ADDITION, not a substitution --
    both required cross-regime cells are present exactly as specified. That is the right way to
    exceed a directive, and the Red Team says so explicitly.
  - >-
    O19. VALIDITY AND SPEND. Both scripts report valid_measurement, failure_class null, exit code 0;
    2 of 2 authorized runs; 6 of 6 authorized decoder calls; 12 of 12 declared artifacts present,
    zero undeclared, zero missing, verified in both directions against the snapshot tree by both
    reviewers independently. The cost-projection protocol was applied as written from a MEASURED
    20-replicate probe at the most expensive rung (unit cost 1.866325e-07 core-s/trial; projection
    200 x 1.866325e-07 x 135000 = 5.0390775 core-seconds against a 540.0 threshold, 0.93% of it), no
    reduction step fired, R=200 and all four rungs were achieved, and cost_projection.json was
    written unconditionally as pre-registered. MEASURED SPEND: 78.371 wall-clock seconds / 80.073
    core-seconds total (Part A 71.863 / 72.409; Part B 6.508 / 7.664) against a 1,800 wall-clock /
    900 core-second authorization, i.e. 4.354% and 8.897%. The Validator cross-checked this against
