  what_this_evidence_is: >-
    Control C1, the deep-tail Poisson dispersion test that two prior attempts
    failed to settle, plus independent second and third computations of the two
    quantities on which this goal retired its whole-band statistic. Zero new
    sampling of the physical system.

  observations:
    - >-
      T-1 (ESTABLISHED, and it is the first clean well-powered null this lane has
      produced). THE DEEP TAIL IS CONSISTENT WITH POISSON. Producer: phi = 0.895
      +/- 0.154 (n=43, z = -0.58) and 1.062 +/- 0.166 (n=50, z = +0.36). The
      validator rebuilt the estimator from scratch -- B-spline basis rather than
      Chebyshev, BIC selection rather than forward deviance, its own bin
      placement, its own damped-Newton optimiser, its own equal-EVENT windowing,
      its own seed -- and obtained phi = 0.9494 (z = -0.28) and 1.1229
      (z = +0.65), with all 24 of its windows within 1.20 sd of 1.0. CLAIM A
      SURVIVES A DIFFERENT ANALYST'S CONSTRUCTION.
    - >-
      T-2 (THE NULL IS PROPERLY POWERED, and the validator strengthened the
      control the producer built). The upward power control reproduces:
      phi_true = 1.5 recovered as 1.5038 +/- 0.2529 and 1.5312 +/- 0.2406 with no
      attenuation. The validator then ran the DOWNWARD control the producer had
      not: phi_true = 0.80 recovered as 0.813 +/- 0.133. Two qualifications
      follow and are recorded: the exclusion of phi = 1.5 is only 1.9 sd for
      n=50, and n=43's own reading sits just +1.03 sd from phi = 0.80, so 0.80 is
      NOT EXCLUDED. phi = 0.60 is excluded at 3.2 and 5.2 sd, so the producer's
      stated "[0.6, 1.4]" resolution is honest and slightly conservative.
    - >-
      T-3 (ANOM-5 IS REAL, AND IT BOUNDS T-1). The two archived files disagree
      about MID-BAND dispersion. The validator measured n=43 at phi = 0.8020
      against its own Poisson null object of the same shape at 0.9923 +/- 0.0806,
      i.e. -2.36 sd, flat at 0.79-0.81 while the rate model was given 6 to 33
      parameters. Extra parameters can only push phi UP, so this is a genuine 20
      percent variance deficit rather than rate misfit. n=50 reads +1.55 sd. The
      bearing on T-1 is direct and must travel with it: THE DEEP-TAIL TEST'S
      UNEXCLUDED BAND CONTAINS 0.80, so the same instrument that cannot separate
      0.80 from 1.00 in the deep tail measures 0.80 at -2.4 sd three hundred rows
      shallower in the same file. T-1 is a null at the deep tail's resolution,
      not a demonstration that no dispersion structure exists.
    - >-
      T-4 (THE ATTENUATION IDENTITY REPRODUCES A THIRD TIME, to 6-13 digits).
      Noise budgets 209.125905994 and 247.866028308; attenuation 1147.226581x and
      948.726689x; measurable shares 0.087167 and 0.105404 percent; deep-tail
      floors 0.468731669 and 0.458465706 bits; M2 deep ratio 0.77042 and constant
      0.5930256, with the identity closing to ten digits on every model. All four
      counting floors reproduce to 13 digits against BATCH-012 -- a FOURTH
      independent computation of that quantity.
    - >-
      T-5 (D-1, MATERIAL: THE HEADLINE DOF DOES NOT REPRODUCE AS WRITTEN). Brute
      force over all 1803^2 and 2310^2 pairs of the stated formula
      (sum a)^2 / sum_{T,T'} min(a_T, a_T')^2 gives 1.573411 and 1.519356, NOT
      the published 1.5454 and 1.5135. The published pair comes from a different
      convention -- taking the `a` of the larger-lambda row, a T-order collapse --
      and the two diverge only because a_exact is non-monotone at exactly one
      step per file (C=3, a=0.678572 to C=2, a=0.614974). That step lies in the
      deep tail, which is why every SUB-BAND value agrees exactly and only the
      whole-band figure moves. So "1.5454, exact to published digits" is
      convention-contingent; as the formula is written it gives 1.57.
    - >-
      T-6 (THE O(1) CONCLUSION IS UNAFFECTED, which is what actually matters).
      All four conventions land in 1.51 to 2.35, against n = 1803 and 2310 rows
      and a white-noise reading of 422 and 471. The retirement of the whole-band
      statistic rests on the statistic carrying O(1) rather than O(n) effective
      degrees of freedom, and that survives every convention. What does not
      survive is quoting it to two significant figures.
    - >-
      T-7 (D-6: THE COORDINATOR'S OWN HEADLINE DOES NOT FOLLOW). The snapshot
      receipt for this batch stated that the plug-in control shows "the
      construction the earlier attempts leaned on cannot produce a dispersion
      reading in either direction". THAT IS WRONG. phi = 0.000 is confirmed
      arithmetically, but the shipped control computes ((Y - Y)^2)/Y from the
      bin's own increment count -- a numerator that is identically zero by
      construction, into which no archived byte enters -- and its "leverage
      exactly 1" is asserted rather than computed. It therefore says nothing
      about the two S-11 attempts, which fitted a local unweighted quadratic and
      a global log-linear Poisson trend respectively. The producer framed this
      correctly; the Coordinator over-read it.
    - >-
      T-8 (D-7: A SECOND COORDINATOR ERROR, repeating a producer claim without
      checking). The snapshot receipt stated that window signs alternate. They do
      not: n=43 reads -, +, -, -, +, -. The Coordinator confirmed the sequence is
      not alternating. Also in D-7: "C>=1000 white dof 163 against 162.47, exact"
      -- 162.466 rounds to 162.
    - >-
      T-9 (D-4: A THIRD COORDINATOR MISLABELLING). The snapshot receipt listed
      "a perfect model reads 0.7701x" among STRUCTURAL quantities. It is
      model-dependent: it is sqrt(sum_deep r^2 / (n * floor^2)) evaluated on M2's
      own residuals, and a model actually at the floor would read 0.9996x. The
      structural quantities are the budgets, the attenuation factors and the
      floors, which do reproduce exactly.
    - >-
      T-10 (SMALLER DEFECTS). D-3: the per-window tables use the analytic sd that
      ANOM-3 itself declares unstable, without labelling it; the validator
      reached 7.5e12 at leverage 1.0 and confirms the Monte-Carlo sd is the one
      to read. D-5: `sum h = #params` and the expected-count gate are algebraic
      identities of the construction rather than controls, and should not be
      reported as passed checks.
    - >-
      T-11 (REPRODUCIBILITY EXERCISED, not merely asserted). The validator re-ran
      dispersion_control_c1.py --reps 300 with output redirected to scratch and
      obtained ZERO differing leaves against the archived results.json outside
      the provenance block, in 216.0 s at 0.0258 GB. Artifact hashes match the
      receipt; input .out and BATCH-012 hashes match. ANOM-4 is confirmed and
      localised: observed-count binning agrees to four decimals across both
      codebases, isolating the 0.054 and 0.061 phi shift to bin PLACEMENT alone.
    - >-
      T-12 (THE UNTESTABLE REGION, corroborating the attenuation account by a
      second route). 310 of 1803 rows (n=43) and 341 of 2310 (n=50) carry NINE
      pooled increment events in total per file. No binning can extract a
      dispersion statistic from nine events. Those are precisely the rows the
      whole-band floor weights most heavily.

  inference: >-
    The deep tail is Poisson at the resolution this data supports, established
    twice under independent constructions and with a two-sided power control.
    That removes over-dispersion as an explanation for models sitting below the
    deep-tail floor and leaves the question to model error or floor protocol. The
    retirement of the whole-band statistic stands on its O(1) degrees of freedom,
    which is robust across four conventions, but the specific value 1.55 is not
    reproducible from the formula as written and should not be quoted. ANOM-5's
    mid-band 20 percent variance deficit is real, unexplained, and bounds how far
    the deep-tail null may be carried.

  boundaries:
    - >-
      Two archived toy-dimension files; deep tail and mid band only; raw
      undivided score scale. Establishes NOTHING about ML-KEM security, and
      nothing about Carrier et al.'s Kyber cost figures.
    - >-
      T-1 is a null at the deep tail's resolution: true phi in roughly [0.6, 1.4]
      is not excluded, and 0.80 specifically is not excluded for n=43.
    - >-
      ANOM-5 is unexplained. It is recorded, not interpreted, and no mechanism is
      offered.
    - >-
      Four of the six rows of BATCH-012's "16-42 percent below the deep-tail
      floor" table remain unreconstructible from archived summaries and are
      flagged reconstruction_valid: false. That claim is bounded, not settled.

