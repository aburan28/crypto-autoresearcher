    - >-
      THAT THE REPAIRED NULL LANDS ON P_pred. It lands AT OR SLIGHTLY ABOVE IT.
    - >-
      THAT ANY HIGH-PRECISION REPAIRED-MINUS-AS-RECORDED DIFFERENCE COLUMN
