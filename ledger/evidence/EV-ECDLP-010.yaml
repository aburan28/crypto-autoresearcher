evidence:
  id: EV-ECDLP-010
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-013
  hypothesis_id: null
  hypothesis_id_note: >-
    NULL, DELIBERATELY, AND THE NULL IS THE HONEST VALUE RATHER THAN A MISSING
    ONE. EXP-YIELD-003 declares `hypothesis_id: null` and `heuristic_under_test:
    null` in its frozen specification, and it declares NO success criterion and
    NO falsification criterion on its primary quantity. This record is evidence
    about ONE INSTRUMENT - the curve-free occupancy simulator of the
    EXP-YIELD-002 repaired arm, re-executed under a fresh master seed - and
    about nothing else. IT IS NOT EVIDENCE ABOUT H-YIELD-001 IN EITHER
    DIRECTION, and H-YIELD-001 stays `specified`. It bears on no other
    hypothesis in this ledger: not H-STR-002, whose next transition in either
    direction is bound by DEFER-BATCH009-001's undischarged EXP-STR-004
    replication obligation; not H-IC-001; not H-ENDO-001; not H-GGM-001; not
    H-FCP-001; not H-SUBRES-001. Naming a hypothesis here would invite exactly
    the inference the run cannot support.

  experiment_ids:
    - EXP-YIELD-003
  run_ids:
    - RUN-YIELD-003-KNOWNANSWER
    - RUN-YIELD-003-REPLICATE-REPAIRED
    - RUN-YIELD-003-HIGHPREC
  run_ids_note: >-
    Listed in the ST-2 execution order the recorded timestamps establish -
    KNOWNANSWER 15:17:13Z, REPLICATE-REPAIRED 15:17:40Z, HIGHPREC 15:18:04Z, as
    verified at VAL-20260729-002 AC-8. Three runs of three declared; no fourth
    run identifier exists.

  type: empirical

  direction: neutral
  direction_basis: >-
    `neutral` IS THE HONEST VALUE AND IT IS CHOSEN OVER `supports` ON THE
    MERITS. EXP-YIELD-003 carries NO pre-registered prediction, NO success
    criterion and NO falsification criterion on its primary quantity, by
    design: the mean, standard deviation and standard error of z_sem over the 48
    tuples are OBSERVATIONS FEEDING NO CRITERION. There is therefore no scoped
    prediction for this run set to support, and `supports` would manufacture
    one. On the only question the run set bears on - what the +0.3610 aggregate
    z_sem shift of the committed EXP-YIELD-002 repaired arm is - the run set
    does not discriminate between the surviving explanations, which is why
    DEC-20260729-003 records `inconclusive` on the mechanism.
    WHAT IS NOT `neutral`, AND IT IS ADMISSIBILITY RATHER THAN DIRECTION: the
    run's own integrity. Three runs all `completed_valid`, 48 of 48 declared
    tuples measured, no invalidation rule fired in any run, the DEV-4
    seed-string defect repaired and verified before the first draw at all ten
    block tuples, every recorded SHA-256 recomputed from the Git blobs at the
    bound commit, the primary observation recomputed from the 48 raw rows to
    exact float equality, and the recorded pipeline re-executed with every
    scientific leaf bit-identical. That is a statement about the instrument and
    is recorded as one; it is not a direction on any prediction, because there
    is no prediction.

  strength: inconclusive
  strength_basis: >-
    `inconclusive` IS THE CEILING AND IT IS CHOSEN DELIBERATELY OVER
    `preliminary`. This record's load-bearing question is the disposition of the
    +0.3610 shift, and on that question the evidence does not discriminate: the
    difference statistic between the two realised means has approximately the
    same law under both competing hypotheses and therefore a likelihood ratio of
    approximately 1 (RT31-4), so all the evidential content sits in the LEVEL,
    and the level is ONE fresh one-sided excursion at about p = 0.017 of a
    statistic that was itself selected post hoc from about ten candidates in the
    EXP-YIELD-002 package.
    `replicated` AND `strong` ARE BOTH UNAVAILABLE, BY CONSTRUCTION. Two draws
    of one statistic under two master seeds, through the SAME driver blob under
    the SAME seed-derivation rule on ONE host, are not a replication of a
    measurement: 48 parameter tuples are not 48 replications, the source
    parameters come from a SINGLE UNREPLICATED run set, and the contract's own
    confirmatory_status is `exploratory_only` under RC-G. The control that would
    convert the argument into a measurement of the null - RC-38-A, K independent
    master seeds through the same driver reporting the empirical distribution of
    the 48-tuple z_sem mean - is NAMED BY RT-20260729-031 AND DELIBERATELY NOT
    REQUESTED, because it does not clear RULE-BATCH013-SCOPE's bar. K = 1.
    `reject_scoped` ON THIS RUN SET IS FORBIDDEN in either direction, as it was
    on EV-ECDLP-009, and no such transition is proposed.

  claim_tier: toy
  claim_tier_basis: >-
    Field sizes k in {12, 14, 16, 18} with quoted group orders 4001, 16619,
    65633 and 261707; arities m in {2, 3}; the frozen beta grid as realised in
    the source package; the x-interval factor-base convention with B measured;
    ONE prime-order curve per size IN THE SOURCE PACKAGE; one simulator, one
    budget, one host. The experiment is CURVE-FREE - it executes zero group
    operations and constructs no curve, no factor base and no sum set - so it is
    not evidence about any curve at any size, and no correspondence, isometry or
    transport argument to cryptographic scale exists or is offered. Claim tier is
    declared toy in the frozen specification, in all three manifests, in
    summary.json, in both archive receipts and in both review reports, and it is
    capped there.

  platform_scope_stated_first_because_it_is_the_thing_a_reader_most_easily_overreads: >-
    THIS IS NOT A FRESH-PLATFORM REPLICATION AND NO RECORD MAY DESCRIBE IT AS
    ONE. What changed between the committed EXP-YIELD-002 runs and these: the
    master seeds (120201 to 130301 and its disjoint block), the interpreter
    build (python 3.13.1 to 3.14.3) and the numpy version (2.4.0 to 2.4.4).
    What did NOT change: the operating system (macOS-26.6-arm64-arm-64bit-Mach-O),
    the machine architecture (arm64), the processor and the host. No different
    operating system and no different machine architecture exist on this host,
    the run says so plainly, and the unavailability is recorded rather than left
    silent.
    THE CONSEQUENCE, IN TERMS. With a fresh master seed the replication
    separates CHANCE from a SEED-INDEPENDENT DETERMINISTIC PROPERTY of the
    driver-plus-build-plus-platform combination, AND SEPARATES NONE OF THOSE
    THREE FROM EACH OTHER. It never separates any of the three from the PROCESS,
    because the process is the same in both. It is evidence about THIS
    INSTRUMENT and never about the balls-in-bins process, about P_pred, or about
    decomposition yield.
    WHAT PP-1 ADDS AND WHAT IT DOES NOT (RT31-3, MAJOR, ADOPTED). The committed
    48-tuple z_sem vector is bit-identical under CPython 3.13.1 with numpy
    2.4.0, CPython 3.13.3 with numpy 2.4.4 and CPython 3.14.3 with numpy 2.4.4,
    so no difference among those three build-and-library combinations
    contributes to the observed value. AND NOTHING BEYOND THAT. Invariance
    across a tested set is not exclusion of a property SHARED by every member of
    it - for instance a behaviour of the PCG64 bit generator or of
    Generator.choice common to numpy 2.4.0 and 2.4.4 - and a shared property is
    precisely the shape a `numpy build` explanation would have to take. The
    control for that is a DIFFERENT BIT GENERATOR (RC-38-B), not a different
    build. The sentence `the interpreter build and the numpy version are
    EXCLUDED as sources of the shift`, and the TASK-20260729-036 receipt key
    that carries the overstatement in its own field name, are SUPERSEDED: see
    DEC-20260729-003 SUP-BATCH013-D.

