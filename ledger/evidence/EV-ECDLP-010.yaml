    RUN PACKAGE ITSELF, committed at 6921e7160f2e21711361e3fe8d346d25328238be by
    TASK-20260729-036, strictly earlier than this ledger archive; and the two
    review reports carrying the derivation were committed by the dispatching
    orchestrator at 0ec6c6ad, one commit EARLIER than the commit carrying this
