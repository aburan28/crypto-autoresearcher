  what_this_evidence_cannot_establish:
    - >-
      ANYTHING ABOUT DECOMPOSITION YIELD, IN EITHER DIRECTION, AT ANY SCALE. This
      is first on the list because it is the thing a reader is most likely to
      infer. A replication of a repaired control establishes nothing about the
      quantity the control was built to normalise.
    - >-
      ANY CONCLUSION ABOUT THE PROCESS drawn from the replicated z_sem statistic,
      in either direction. The pre-registered resume condition forbids it in terms
      and this record draws none.
    - >-
      THAT THE SHIFT IS A PROPERTY OF THE RECORDED DRIVER, BUILD OR PLATFORM. No
      locus for a deterministic component has been identified and none is
      asserted.
    - >-
      THAT THE SHIFT IS CHANCE, AS A POSITIVE FINDING. The evidence is consistent
      with an upper-tail draw of a correctly calibrated null and does not measure
      that null; RC-38-A would, and is not on the record.
    - >-
      PORTABILITY, CROSS-VERSION DETERMINISM AS A GENERAL CLAIM, OR ANY SEPARATION
      OF THE DRIVER FROM THE BUILD. This is not a fresh-platform replication.
    - >-
      THAT THE INTERPRETER BUILD AND THE NUMPY VERSION ARE EXCLUDED AS SOURCES OF
      ANYTHING SHARED BY ALL OF THEM. Invariance across three tested
      build-and-library combinations is not exclusion of a shared property.
    - >-
      THAT INV-4 SHOULD NOT HAVE FIRED, IS UN-FIRED, OR IS RE-DISPOSED. It fired
      under the EXP-YIELD-001 contract's own rule on the EXP-YIELD-001 run and
      nothing here evaluates or can evaluate a rule of another contract on another
      run.
    - >-
      ANY DETERMINATION OF INV-5 IN EITHER DIRECTION. EV-ECDLP-008 observation O-8
      stands.
    - >-
      THAT ANY BATCH-011 EFFICIENCY E OR YIELD RATIO, INCLUDING 0.85, IS NOW
      READABLE, RECOVERABLE OR WAS ALWAYS FINE. The VOID stands in full; no
      efficiency and no yield ratio appears as a measurement in the package or in
      this record.
    - >-
      ANY STATUS CHANGE FOR H-YIELD-001, H-STR-002, H-IC-001, H-ENDO-001,
      H-GGM-001, H-FCP-001, H-SUBRES-001 OR ANY OTHER HYPOTHESIS in this ledger.
    - >-
      ANY RE-CHARGING, FLAGGING OR DEFENCE OF ANY INDEX-CALCULUS COST MODEL, and
      any restatement of EV-ECDLP-008 observation O-11 as a result of this batch.
      That position stands unretracted and is not re-derived here.
    - >-
      THAT EV-ECDLP-008 OBSERVATION O-4's CENSUS-FACING COMPONENT (d) IS TESTED.
      It is UNTOUCHED AND UNARCHIVED. What is settled is the mean-level gap
      between two specified pre-marking rules INSIDE THE SIMULATION, which is
