  inference: >-
    WHAT THE RUN SET SUPPORTS, AT CLAIM TIER TOY AND AT NO STRENGTH ABOVE
    `inconclusive` ON ITS LOAD-BEARING QUESTION, IS ONE THING AND IT IS A
    STATEMENT ABOUT AN INSTRUMENT. At the 48 de-duplicated criterion-evaluable
    parameter tuples of the committed EXP-YIELD-001 v2 package, a curve-free
    occupancy simulation that pre-marks |S_(m-2)| uniformly chosen bins before
    throwing C_red/2 antipodal pairs, re-executed under the fresh disjoint master
    seed 130301 with the DEV-4 seed-string defect repaired and verified before
    the first draw, produced a 48-tuple z_sem mean of 0.3336976784 with sample
    standard deviation 0.8915705400 and standard error 0.1286871228, with all 48
    tuples measured, no invalidation rule fired, and the recorded computation
    reproducing bit-identically on re-execution and under two further interpreter
    builds carrying numpy 2.4.0 and 2.4.4. THAT IS ALL IT MEASURES.
    WHAT THE REPLICATION DOES AND DOES NOT SEPARATE. It separates CHANCE from a
    SEED-INDEPENDENT DETERMINISTIC PROPERTY of the driver-plus-build-plus-platform
    combination, and separates NONE of those three from each other. It is NOT a
    fresh-platform replication. It never separates any of the three from the
    PROCESS.
    ON THE MECHANISM OF THE +0.3610 SHIFT THE EVIDENCE DOES NOT DISCRIMINATE, AND
    THE REASON IS RECORDED RATHER THAN GLOSSED. The agreement of the two means
    carries no evidential content, because the difference statistic has
    approximately the same law under both hypotheses. All the content is in the
    LEVEL, and the level is one fresh one-sided excursion at about p = 0.017 of a
    statistic that was itself selected post hoc from about ten candidates in the
    EXP-YIELD-002 package, so the two nominal probabilities may not be
    multiplied. WHAT THE RECORD DOES ESTABLISH ABOUT THE CANDIDATE LOCI: the
    MATHEMATICS limb is closed BY DERIVATION, the exact process mean being a
    theorem and the only other O(n^(-1/2)) term being the computable and bounded
    classical skewness bias, for a total expectation of order +0.04; the CODE limb
    is closed EMPIRICALLY, for any defect of the fixed-bins-offset kind, by this
    package's own ten-tuple 10,000-replicate high-precision block; and the BUILD
    limb is narrowed, but not excluded as a shared property, by PP-1. NO LOCUS FOR
    A DETERMINISTIC COMPONENT HAS BEEN IDENTIFIED AND NONE IS ASSERTED.
    THE CONSTRAINED SENTENCE, IN ITS TWO PARTS, PER PDC-2. THE PROHIBITION BINDS
    UNQUALIFIED: NO RECORD MAY SAY THE REPAIRED NULL LANDS ON P_pred - IT LANDS AT
    OR SLIGHTLY ABOVE IT. THE ASSERTION HALF - that it does so by an amount larger
    than the declared second-order biases account for, and unexplained - IS SCOPED
    TO THE COMMITTED EXP-YIELD-002 REALISATION ONLY AND IS NOT ASSERTED OF
    EXP-YIELD-003's OWN REALISED DATA BY THIS RECORD.
  inference_alternatives_not_discriminated: >-
    THREE THINGS REMAIN UNDISCRIMINATED AND ARE NAMED RATHER THAN ROUNDED OFF.
    FIRST, THE RESIDUE THE RED TEAM NAMES BECAUSE NAMING IT IS THE JOB: a defect
    PROPORTIONAL TO sem_rep - one producing the same offset in SEM units at 100
    replicates and at 10,000 - is NOT closed on the committed record. No such
    defect has been named, no mechanism for one has been proposed, and none is
    proposed here. It is UNEXCLUDED, not excluded.
    SECOND, RT31-3's RESIDUE: a property SHARED by every tested numpy version -
    for instance a behaviour of the PCG64 bit generator or of Generator.choice
    common to 2.4.0 and 2.4.4 - is unexcluded by PP-1, which varies the build and
    holds the generator fixed. The control that would close it is RC-38-B, a
    different bit-generator family, and it is named and not requested.
    THIRD, THE NULL'S OWN CENTRE HAS NEVER BEEN MEASURED. RC-38-A - K independent
    master seeds through the same driver under the same seed-derivation rule,
    reporting the empirical distribution of the 48-tuple z_sem mean - is the only
    construction that turns the question from an argument about two draws into a
    measurement, cannot come out ambiguous, and is not on the record. It is named,
    costed and DELIBERATELY NOT REQUESTED under RULE-BATCH013-SCOPE.
    ABSENCE OF EVIDENCE IS NOT IMPOSSIBILITY. That no deterministic component has
    been located is not a proof that none exists, nothing here is an impossibility
    claim, and a later session that finds a mechanism is not contradicting this
    record.

