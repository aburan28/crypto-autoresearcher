  proof_status: derivation
  proof_status_declaration: >-
    THE BASIS IS MIXED, ALL THREE TIERS ARE DECLARED, AND THE ORDER IS THE ONE
    docs/claims-and-verification.md "Refutation artifacts" AND RT-20260729-031
    section 12 REQUIRE.
    (1) COUNTEREXAMPLE CERTIFICATE - NOT APPLICABLE, AND RECORDED AS NOT
    APPLICABLE RATHER THAN AS SATISFIED. There is no universally quantified
    proposition here to exhibit a witness against; a replication is a
    measurement, and a measurement admits no certificate. INT-BATCH013-I
    anticipated this and it is correct.
    (2) DERIVATION - AVAILABLE, USED, AND STRICTLY STRONGER THAN THE MEASUREMENT
    IT IS PAIRED WITH. Against the specific proposition that a third analytic
    term of size about +0.30 SEM exists in the expectation of the 48-tuple z_sem
    mean, the available artifact is a DERIVATION NOTE and this record declares
    it as one. Its content is the decomposition E[z_sem] = (M - P_pred) *
    E[1/sem_rep] + E[(mu_rep - M)/sem_rep], with M the exact process mean
    M = N - (1 - s/N)[(N-1)(1-2/N)^(C_red/2) + (1-1/N)^(C_red/2)], which is a
    theorem for the specified process and has been re-derived independently
    three times in this lineage; the bound of at most 0.0801 in SEM units on the
    first term at any of the 48 declared tuples and 0.0262 on average; the Jensen
    factor E[1/sem_rep] * sigma_sem bounded by 1 + 3/(4 n_rep), at most 1.0083
    here; and the classical skewness bias of the one-sample t statistic,
    -gamma_1/(2 sqrt(n_rep)) + O(1/n_rep), which is POSITIVE at these parameters
    because the distinct-bin count is left-skewed, is at most 0.088 at the most
    extreme tuple T-18-2-B34 and 0.012 averaged over the 48. THE TOTAL
    EXPECTATION IS OF ORDER +0.04 AND NO THIRD ANALYTIC TERM IS AVAILABLE TO
    CARRY +0.30.
    (3) EMPIRICAL_ONLY - DECLARED HERE FOR EVERYTHING THE RUN ITSELF ADDS. The
    48-tuple Monte Carlo, the known-answer frequencies, the high-precision block
    and every number this record quotes from the three run records are
    EMPIRICAL_ONLY on a single fresh-seed re-execution at K = 1 master seed.
    BND-6 and INT-BATCH013-I both anticipate this and it is declared.
    THE EMPIRICAL LIMB THAT CLOSES THE CODE QUESTION IS ALSO DECLARED AS
    EMPIRICAL AND NOT AS DERIVED. A defect producing a FIXED OFFSET IN BINS is
    excluded, for this instrument, by the package's own ten-tuple
    10,000-replicate high-precision block; that exclusion is a MEASUREMENT and is
    recorded as one. See observation O-8.
    THE UNDECLARED BASIS WOULD BE THE FAILURE, AND IT IS NOT COMMITTED HERE. The
    absence of a proof is not the failure; misdeclaring a derivation as
    empirical_only, or an empirical exclusion as a derivation, would be.

