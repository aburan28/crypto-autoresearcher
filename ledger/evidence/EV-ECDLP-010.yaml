    THE DEVIATION, STATED PLAINLY: THE DERIVATION NOTE IS NOT A STANDALONE
    ARCHIVED ARTIFACT. It lives inside a BATCH-013 review report and nowhere
    else, exactly the case INT-BATCH013-I named. It is not a product of this run;
