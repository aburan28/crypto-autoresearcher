  integrity_note_declared_set_deviation: >-
    DECLARED AS AN INTEGRITY NOTE RATHER THAN WORKED AROUND, AND THE DEVIATION IS
    THE DISPATCHING ORCHESTRATOR'S AND NOT THIS CARD'S. The TASK-20260729-039
    declared commit set is eight paths, four of them the TASK-20260729-037 and
