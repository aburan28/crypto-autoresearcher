    - >-
      ANYTHING ABOUT CRYPTOGRAPHIC-SIZE CURVES in either direction. No
      correspondence argument to scale exists or is offered and the experiment
      executes zero group operations.
    - >-
      ANY COMPLETION CRITERION OF GOAL-ECDLP-001, any closure quorum, any exponent
      movement in either direction, and any of the four asymptotic-claim promotion
      gates.
    - >-
      THAT THE LEDGER VALIDATES. tools/validate_ledger.py exits nonzero
