  observations:
    - id: O-1
      label: run package validity and integrity - VERIFIED INDEPENDENTLY, TWICE
      text: >-
        The snapshot commit 6921e7160f2e21711361e3fe8d346d25328238be has the
        declared single parent 572ce080a1dd9ea76b078e0ec6d96e9f8ff522c9, is
        reachable from HEAD, and changes exactly ELEVEN paths, all additions,
        with no deletion, no rename, no undeclared path, no AppleDouble sidecar
        and no __pycache__ entry. The eleven changed paths are set-identical to
        the receipt's committed_paths, to the contract's required_artifacts list
        and to the eleven_declared_artifact_paths field carried in all three
        manifests. All eleven recorded SHA-256 values recompute from the Git
        blobs at that commit. The twelfth declared path is the TASK-20260729-036
        receipt itself, deferred by construction under INT-BATCH007-T: a strict
        subset, not a scope overrun. The five hash-bound inputs were verified
        against their BOUND COMMITS - 2fb2bb7a for IN-1 and IN-2, c7189f80 for
        IN-3 and the two IV-2 extras - and not against the worktree. Approval
        precedence is a property of the commit graph: the TASK-20260729-034
        receipt at 99dec70d68dd49fc153f5042882dd52b888e036c records the
        determination APPROVED, conditional on PDC-1 through PDC-15 recorded
        verbatim, with condition_satisfied true and authorized_to_execute true.
        Both post-execution review sessions verified the snapshot against Git
        independently. Resources: elapsed 17.859 + 3.545 + 4.885 = 26.289 s
        against a 600 s per-run ST-1 cap, peak ru_maxrss 65814528 bytes across
        the three runs - that is 62.8 MiB - against a 4 GB cap, with memory
        reported beside time in every manifest.
    - id: O-2
      label: THE PRIMARY OBSERVATION, RECOMPUTED FROM THE RAW ROWS AT MAXIMUM ABSOLUTE DIFFERENCE 0.0
      text: >-
        Under the frozen EXP-YIELD-003 contract at
        de6fbb752f9f0b9ce28fda91b15a88593861dfcc, on one macOS arm64 host, a
        curve-free balls-in-bins re-execution of the EXP-YIELD-002 repaired-null
        arm at the same 48 declared parameter tuples, under the fresh disjoint
        master seed 130301 and the unchanged C-14 replicate schedule (37 tuples
        at 100 replicates, 11 at 30), produced a 48-tuple z_sem mean of
        0.33369767840297898, sample standard deviation at ddof 1 of
        0.89157053997649016 and standard error of 0.12868712281424166, with
        minimum -1.6051967280661212 and maximum 2.2570411311500851 attained at
        T-18-2-B82. n_neg is 16, a COUNT of tuples whose sixteen members are
        named individually in the committed record and in the recount note; the
        tail counts of |z_sem| above 1, above 2 and above 3 are 12, 3 and 0,
        again COUNTS with their members named. All 48 tuples were measured and
        `tuples_not_reached` is empty. VAL-20260729-002 recomputed the mean, the
        standard deviation and the standard error row by row with code written in
        that session, using no comparison operator anywhere in the derivation,
        and obtained the recorded doubles BIT FOR BIT; the maximum absolute
        difference over the whole 48-entry z_sem vector is EXACTLY 0.0 and the
        sorted vector is element-wise identical to the recorded one. Recorded
        honestly by the validator: an alternative summation route
        (statistics.stdev) returns 0.89157053997649005, one unit in the last
        place below the recorded value, which is float summation order and not a
        defect; the naive route and the math.fsum route both return the recorded
        double exactly. THIS OBSERVATION FEEDS NO CRITERION, because the contract
        has none.
    - id: O-3
      label: the committed comparator, recomputed from the EXP-YIELD-002 blob
      text: >-
        From RUN-YIELD-002-NULL-REPAIRED at c7189f80, recomputed independently by
        VAL-20260729-002, the 48-tuple z_sem mean is 0.3610236850427646, the
        standard deviation 0.9750016842, the standard error 0.1407293712, n_neg
        16, the tail counts 15, 4 and 0, and the maximum 2.6101537975436533. The
        driver's quoted constant 0.36102368504276455 equals the recomputed mean
        exactly. The TASK-20260729-036 receipt quotes the comparator standard
        error as 0.1407; the exact value is 0.1407293712.
    - id: O-4
      label: THE ARITHMETIC OF THE TWO MEASUREMENTS, AND WHAT IT DOES NOT DISCRIMINATE
      text: >-
        THE FIGURES FIRST. 0.3610236850 minus 0.3336976784 is 0.0273260066. The
        combined standard error of the difference is 0.1906748 using the
        receipt's rounded 0.1407 and 0.1906964 using the exact 0.1407293712; the
        ratio is 0.14 under either. Both were re-derived by VAL-20260729-002 at
        CM-2.
        THE CAVEAT THAT MUST TRAVEL WITH THEM, AND IT IS BLOCKING (RT31-4,
        ADOPTED IN FULL). THE DIFFERENCE STATISTIC DOES NOT DISCRIMINATE BETWEEN
        A FIXED OFFSET AND CHANCE, AND THE DISCRIMINATING QUANTITY IS THE LEVEL.
        Under a fixed-offset hypothesis and under the chance hypothesis alike,
        the two draws come from the same law, so they agree within their combined
        error with the same probability and the likelihood ratio contributed by
        the DIFFERENCE of the two means is approximately 1. No record may cite the
        agreement of the two means as support for a fixed offset. The sentence in
        the TASK-20260729-036 receipt that does so is superseded at
        DEC-20260729-003 SUP-BATCH013-B, together with its `about 2.5 SE each`
        figure: measured against the expectation the package's own declared
        biases imply, about +0.026 to +0.04, and against the design standard
        error 0.1466905 that PDC-12 fixes, the two excursions are about 2.3 and
        about 2.1 with one-sided probabilities of about 0.008 and 0.017.
        THE CAUTION THE RECEIPT DID GET RIGHT, ENDORSED BY THE VALIDATOR AS A
        BOUND: the two runs share the same 48 tuples and the same process, so the
        Monte Carlo noise is independent but any deterministic component is
        COMMON to both by construction.
    - id: O-5
      label: the resume condition, applied exactly as written and not re-read
      text: >-
        THE PRE-REGISTERED CONDITION, CARRIED VERBATIM FROM DEC-20260729-002
        NA-1: "If the replicated mean is within about 0.14 SEM of zero, the shift
        is recorded as chance and closed. If it reproduces above about +0.25 SEM,
        the driver, the numpy build and the platform become the objects of the
        next control. NO CONCLUSION ABOUT THE PROCESS IS DRAWN FROM IT EITHER
        WAY, and no conclusion about decomposition yield is drawn from it in any
        case."
        WHICH BRANCH IS SELECTED, AND IT IS ARITHMETIC. Under PDC-14's recorded
        unit convention - 0.14 and 0.25 in the units of the z_sem statistic
        itself, not multiples of the 0.1466905 standard error of the 48-tuple
        mean - the realised 0.3336976784 is above +0.25 and selects the SECOND
        branch. The value does not fall in the interval between about 0.14 and
        about 0.25 that neither branch names, so the pre-committed
        inconclusive-region clause was not exercised; it was correctly
        pre-committed before the number existed, at BND-5 and in the contract's
        own resume-condition block, and had the value landed there it would have
        been recorded as INCONCLUSIVE ON THE SHIFT and never assigned to the
        nearer branch.
        THE BRANCH-2 CONSEQUENCE IS RECORDED IN NA-1'S OWN WORDS AND NO
        STRONGER: the driver, the numpy build and the platform BECOME THE OBJECTS
        OF THE NEXT CONTROL. THE BATCH-013 QUEUE'S STRONGER RESTATEMENT OF THAT
        BRANCH - that the terminal finding is that the shift IS A PROPERTY OF the
        recorded driver, build and platform - IS SUPERSEDED ON THIS POINT
        (RT31-1, BLOCKING, ADOPTED IN FULL; DEC-20260729-003 SUP-BATCH013-F). NO
        RECORD PRODUCED BY THIS BATCH SAYS THAT THE SHIFT IS A PROPERTY OF THE
        RECORDED DRIVER, BUILD OR PLATFORM, AND THIS ONE DOES NOT.
        NO CONCLUSION ABOUT THE PROCESS IS DRAWN FROM THE REPLICATED STATISTIC IN
        EITHER DIRECTION, and no conclusion about decomposition yield is drawn
        from it in any case.
