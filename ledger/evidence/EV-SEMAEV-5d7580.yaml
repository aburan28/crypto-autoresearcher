  observations:
    - id: O-1
      text: >-
        BKK speedup for m=3 at p=1009 (B=16, heuristic=0.72):
        Full (256 checks=B^2): 56% yield.
        BKK (64 checks=(B/2)^2): 32% yield. Gamma_3 = 0.57.
        Speedup = 4 × 0.57 = 2.29x in total check operations.
    - id: O-2
      text: >-
        General formula: for m-fold Semaev with BKK:
        Speedup = 2^{m-1} × gamma_m where gamma_m is the yield retention fraction.
        m=2: 2^1 × 0.86 = 1.72x
        m=3: 2^2 × 0.57 = 2.29x
        The speedup GROWS with m due to the 2^{m-1} factor.
    - id: O-3
      text: >-
        For optimal m in Semaev: m = O(sqrt(log N / log log N)).
        The BKK speedup factor is 2^{m-1} × gamma_m where gamma_m might decrease
        slowly with m. If gamma_m = constant: total speedup at optimal m is
        2^{sqrt(log N)} — superpolynomial! But this is unlikely since gamma_m
        likely decreases as m grows (each extra factor reduces yield retention).
    - id: O-4
      text: >-
        At m=4 in the sub-saturated regime (heuristic=0.29): speedup much weaker.
        The BKK speedup requires SATURATED regime (heuristic > 0.5) to be effective.
        For optimal m with heuristic ≈ 1: intermediate speedup between m=2 and m=3 values.

