    or R'_4, but their variable multiples fill B_{<=3} and reach 1 at the first
    mutant iteration. The n = 17 route (1 in R'_4, FULL) did not recur. (3)
    SPECIFICITY. At W_4 the property belongs to the quadratic tensor's
    one-coefficient neighbourhood (Frobenius-twisted convolution forms, any
    affine lower part, ell not needed), not to S_3's exact tensor and not to
    ell; same-support random bilinear systems are exactly semi-regular and are
    not refuted, by derivation. At D = 3 S_3's lower part appears to matter (5
    systems). (4) C-M holds in its frozen form as tensor-level
    non-semi-regularity. (5) Soundness and exactness: on satisfiable S_3 and
    N-CONV19 systems W_4 equals the whole degree-4 part of the ideal.
  exact_scoped_claim: >-
    At n = 19 (F_2[t]/(t^19 + t^5 + t^2 + t + 1)), m = 2, l = 10, V = {deg < 10}
    (polynomial basis), on one ordinary binary curve (A = 46693, B = 306147,
    #E = 2 * 261823), for the first 400 unsatisfiable non-degenerate x(2E)
    subgroup-target attempts of the frozen stream (unconditioned on any
    closure outcome):
    (a) every one is refuted by the degree-4 mutant closure W_4 (400/400,
        CP95 [0.9908, 1]) at its first iteration, each with a wdag-v1
        certificate verified by author-independent code; and none is refuted
        by plain degree-4 multilinear Macaulay M_4 or by M_3 (0/400, each
        non-refutation witnessed by a checked functional);
    (b) the ell-substituted degree-4 Macaulay space is non-semi-regular on
        400/400 (sigma 730-766 above the reference 360), never contains 1 and
        never fills B'_{<=3};
    (c) same-support random bilinear systems (N-F219; five-family N-AFF19)
        and a one-linear-fall generic family (N-ELL19) are exactly
        semi-regular at their reference profiles and not refuted by W_4
        (0/200 each; derived from own-code profiles by checked derivations),
        while systems keeping S_3's exact quadratic tensor with a random lower
        part (N-CONV19) are refuted 200/200, and 40 one-coefficient
        perturbations of the tensor (a review verification object) 40/40;
    (d) no satisfiable control is refuted by any closure (0/300), and on the
        satisfiable S_3 and N-CONV19 systems W_4 equals the whole degree-4
        part of the ideal (codim = s on 150/150).
    Nothing here bears on other n, curves, h, V, moduli, target classes, m,
    D >= 5, F4 step degree, Semaev's Assumption 1, any deployed curve, or any
    ECDLP cost.

