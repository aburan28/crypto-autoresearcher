  inference: >-
    Both reviewer sessions requested review-adversarial at xhigh, both ran in
    independent sessions, and both ran on the runtime-native binding rather than
    the adapter's configured anthropic:claude-opus-5, which is unservable in
    this checkout for want of credentials. fallback_used true for both,
    authorised by DEC-20260916-7b2235 before either ran; model_verified false
    for both, because `doctor --probe` needs a usable backend and none exists
    here. The resolved identifiers are SELF-REPORTED and are unverified
    configuration, not established fact. Neither reviewer's measurements depend
    on the identity of the model that took them: every value above is read from
    an artifact a third party can recompute.

  boundaries:
    - >-
      ONE HOST: 4 CPUs, 15.6 GiB MemTotal, no swap, with a virtio balloon
      holding roughly 8.5 GB at launch so about 7.02 GB was available to a
      single process. Every memory figure is a property of that configuration.
    - >-
      ONE INSTANCE FAMILY at (n, l) = (15, 5) over GF(2^15): 42 variables, 42
      polynomials, three GF(2) solutions, and a DEGENERATE solution set
      (O-12(4)). l = 6 is not measured and is expected censored.
    - >-
      ONE SET OF BYTES. What is accepted is experiments/EXP-ICPERF-e21835/code/
      at the hashes in CODE_SHA256.json as of RUN-ICPERF-a4a24b, NOT the current
      working tree: bench.py changed afterwards under the unaccepted amendment
      D6 (O-7).
    - >-
      TWO ENGINES, THREE SOLVERS. Macaulay2 1.22 (F4) and Singular 4.3.2 on the
      algebra side; WDSat, CryptoMiniSat, CaDiCaL and MiniSat on the SAT side.
      No Magma, no msolve, no cado-nfs, and nothing that forks (O-3).
    - >-
      THE WALL COLUMN IS OUT OF SCOPE for any comparative use at these bytes
      (O-7). CPU seconds, basis size, maximal degree, unit status, peak RSS and
      SAT status/conflicts are in scope.
    - >-
      NOTHING HERE IS ABOUT INDEX CALCULUS. No relation is found, no point is
      decomposed, no discrete log is solved, no curve is attacked, and no
      column of the RQ-ICPERF-94c86e boundary table moves. The acceptance says
      a measuring device works at one scale.

  unresolved_confounds:
    - id: U-1
      what: >-
        RSS accounting double counts COW-shared pages after fork (O-3), so the
        memory limit is validated only for non-forking children. Any successor
        that runs a forking engine inherits an unvalidated limit.
    - id: U-2
      what: >-
        Inter-poll overshoot of up to about 1.4 GiB (O-4) is arithmetic on
        observed growth, not a measured kill. Measuring it means driving this
        host to within 1 GiB of OOM, which risks unrelated processes; it stays
        computed and labelled.
    - id: U-3
      what: >-
        Run 1 of the R6 derivation lost its resource record to a runner bug
        (the child was reaped by poll() before wait4), so that invocation's peak
        RSS is NOT MEASURED. Disclosed by the reviewer rather than backfilled.
    - id: U-4
      what: >-
        No cross-engine confirmation of the unperturbed basis: Singular's `std`
        did not finish in 600 s. The engine-free verification of the printed
        basis makes this inessential for correctness but leaves the
        cross-engine check unrun.
    - id: U-5
      what: >-
        The epoch 1 interruption cause is not distinguishable from the run's own
        artifacts: nothing in them separates a model billing quota from a host
        timeout. The manifest records the quota, records that this session's
        FIRST inference was a timeout, and R5 was asked to judge whether the
        correction is honest rather than tidy. It costs no measurement either
        way.
    - id: U-6
      what: >-
        Three of R6's four values were exposed before derivation (O-9). The
        agreement on cardinality, degree and unit status is INFORMED. What is
        blind is the quotient dimension and the entire perturbed control.
    - id: U-7
      what: >-
        The Coordinator wrote the frozen tree's four files, wrote three of the
        four defects under repair, wrote the plan, wrote the addendum that
        leaked R6's values, wrote epoch 1's manifest, and composes this round.
        That concentration is this round's principal weakness. It is mitigated
        partly -- the executor wrote the repair, R6 was independent on the one
        load-bearing quantity, and both reviewers overturned Coordinator priors
        in writing -- and it is disclosed rather than claimed away.

  dominated_by: >-
    Not a Pareto question. This record moves no frontier row, claims no
    exponent, and reports no attack cost; there is nothing for a competing
    method to dominate. The frontier comparison the CAMPAIGN owes -- solver-based
    point decomposition against a matched generic attack on the same group and
    host -- still does not exist in any ICPERF run, and EV-ICPERF-390707 records
    that as O-13. Setting this field to null after checking the frontier would
    be a category error, not honesty; the honest statement is that the frontier
    is not the axis this record lies on.
  sota_delta:
    value: null
    reason: >-
      No state of the art is engaged. The comparable quantity would be the cost
      of index calculus on a named curve, and this record measures a harness.
      A numeric delta here would be fabricated.

  knowledge_promotion: deferred
  knowledge_promotion_reason: >-
    Nothing is promoted to knowledge/ from this record, and one candidate is
    identified for later. NOT PROMOTED: the instrument acceptance itself, which
    is a fact about this repository's harness on one host and belongs in the
    ledger rather than the corpus. THE CANDIDATE: R6's order-independence
    argument -- that a zero-dimensional radical ideal over GF(2) whose solution
    set is k affinely independent points has a reduced basis of the same
    cardinality and maximal degree in EVERY monomial order -- is a small,
    reusable, engine-free technique for validating any Groebner instrument, and
    it generalises past this instance. It is deferred rather than promoted
    because it arrived inside a review report and has not been stated,
    generalised or checked as a standalone claim; DEC-20260915-927eaa ranks
    that as a task. Promoting a lemma the same session first read would skip
    the independent read the corpus is for.

