        (one GF(2) point plus radicality gives 42 linear elements) and not by
        an engine. The reviewer reports it as such.
      significance: >-
        Without this control an agreeing R6 would be indistinguishable from an
        R6 that read a cached file. It is not.
    - id: O-12
      joint: >-
        beyond the plan, reported by TASK-20260915-abf147
      verdict: observation, carried forward
      what: >-
        Four facts about this instance family that no acceptance criterion asked
        for. (1) The Magma .in file carries a literal `0 +` leading term in 9 of
        its 15 descent equations, a generator printing artifact that a converter
        mis-tokenising `0` would turn into a different system -- a real place
        for two implementations to disagree, and one that both converters
        happen to get right. (2) Macaulay2 F4's resident memory on this
        42-variable system is 8-10 GB and is SENSITIVE TO VARIABLE ORDER: the
        Magma order fits under 8 GiB, the reversed order exceeds 9 GiB, and
        adding a single x-monomial to one descent equation exceeds 8 GiB within
        83 s. A memory bound for this family must be measured per variable
        order, not per system size. (3) Singular's `std` used only 1.2 GiB and
        did not finish in 600 s single-threaded. (4) The `S` instance's solution
        set is degenerate: all three solutions have two equal x-coordinates and
        the third equal to 0, i.e. x(P_2) is the 2-torsion point and
        P_1 = +/- P_3. Whether such planted solutions are representative of
        point-decomposition instances is a scope question for every successor
        contract that uses this benchmark family.
      why_recorded_here: >-
        (2) and (3) bear directly on how EXP-ICPERF-13f001 must size its memory
        budget, and (4) bears on what its Groebner column would MEAN. The most
        valuable finding of the previous round also arrived under
        `beyond_the_plan`; the plan asks for it deliberately.

