  inference:
    supported_statement: >-
      Scope S: ordinary E/F_p with p >= 5, a subgroup <P> of prime order
      n != p, and any Z_p-lift E^ with good reduction. By derivation, uniform in
      p (analysis.md I-A): the n-torsion section s_tor is the unique homomorphic
      (equivalently [c]-equivariant) section of reduction over <P>, commutes with
      every Z_p-endomorphism of E^ preserving <P>, and on the canonical lift is
      the unique Frobenius-fixed section; it is independent of the Hensel start
      and computable in at most 2(bits(n)+bits(p^k))+1 complete additions at
      precision k; the Smart functional z([n]s(R)) vanishes identically on it;
      for every section s the Smart ratio equals the leading-digit tau-ratio
      with tau_R = s(R) - s_tor(R); and s_tor carries the discrete-log
      relation isomorphically into E^(Q_p)[n], no easier. Hence the user's H2
      clause "a computable canonical section of E(Q_p) -> E(F_p) would be a
      full break" is false under every reading in which "canonical" constrains
      the section, and circular under the one remaining reading (a section
      whose Smart residue recovers d). The runs confirm the instruments against
      this on 1116 of 1116 pairs. Measured at toy scale (50 <= p <= 600,
      11 <= n <= 613, k = 4, 36 curves per seed, two seeds): for the
      hensel_random, naive and Teichmuller sections the event "Smart ratio =
      d mod p" occurs at a rate consistent with 1/p on the CM-canonical and
      the arbitrary-integer lift alike; per arm and seed the frozen test
      excludes only excesses of about 4.2x to 5.2x of 1/p and above, and a
      uniform leak at rate p^-1/2 is excluded with power >= 0.989.
    negative_phrasing: >-
      No identity-readout success rate meeting the predefined 4-sigma
      threshold was observed for the three tested sections over the tested
      curves, primes, precision, implementation and budget.
    heuristic_named: >-
      H-1 (unnumbered in the contract, numbered here): the Smart residue of a
      choice-free section is uniform on F_p and independent of d outside the
      Aut(E^)-orbit of d. It underlies the 1/p reference only. Toy-scale
      validation: red-team rt_probe B (exhaustive control and multiplier sets,
      71 curves, 2 lifts, 2 sections). No asymptotic claim depends on it.
  boundaries:
