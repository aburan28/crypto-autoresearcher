  obstruction:
    statement: >-
      For n != p, Hom(Z/n, E^(pZ_p)) = 0: the formal group of any good-reduction
      Z_p-lift is torsion-free and uniquely n-divisible. So the unique
      homomorphic section of reduction over <P> is the n-torsion section, the
      formal-logarithm (Smart) functional vanishes identically on it, and on
      every other section it reads only the non-canonical offset tau. Lifting to
      Z_p adds nothing to the n-part of the group.
    quantity: >-
      (a) v_p(z([n]s_tor(R))) against working precision k; (b) identity-readout
      success rate of the hensel_random, naive and Teichmuller sections as a
      multiple of the mean 1/p reference.
    value: >-
      (a) v_p = k (dimensionless p-adic valuation) on 1116 of 1116 pairs at
      k = 4 (RUN-CZLIFT-dab752, RUN-CZLIFT-5b2581), and v_p = k at k = 2, 3, 4,
      6, 8 on 3 curves (red-team rt_probe D); no exceptions, so no error bar.
      (b) per arm and seed, 0 to 4 successes in 181 to 378 pairs, frozen z in
      [-1.38, +1.88]; upper detection floor 4.23x to 5.17x of 1/p at 4 sigma
      (successes needed 6 to 8); red-team exhaustive control 0.967x to 1.058x of
      a same-shape null (null sd 1.5 % to 2.8 % of its mean) over 4,078,200
      cells per section and lift.
    measured_by: [RUN-CZLIFT-dab752, RUN-CZLIFT-5b2581, EXP-CZLIFT-ae0a13]
    scope: >-
      (a) is a theorem for p >= 5, n prime, n != p, any lift, any k; measured at
      50 <= p <= 600, 11 <= n <= 613. (b) is measured only for the three named
      sections and the identity readout, on class-number-one CM integral models
      and random integer lifts with 50 <= p <= 600, k = 4.
    resource_check:
      examined: true
      reading: >-
        Read the other way round, the block says the formal-group route is a
        polynomial-time linear oracle for exactly the p-primary part of the
        group: that is the hypothesis of the anomalous attack (Smart;
        Satoh-Araki; Semaev; n = p), measured separately by EXP-CZLIFT-17b7eb,
        and its domain is empty for prime n != p. The Frobenius lift that
        rebuilds s_tor on the canonical lift is the hypothesis of Satoh-type
        p-adic point counting (computes #E, not d). Aut(E^)-equivariance on
        canonical j = 0 lifts is the hypothesis of Pollard rho with
        automorphism classes, which already owns it. Cheap prime-to-p torsion
        lifting is an input to p-adic computations of torsion fields (recalled
        pointer, not load-bearing). None is a discrete-log resource; no
        candidate lane is spawned (red-team obstruction_and_resource_reading,
        concurred by the Coordinator).
      spawned_ids: []
