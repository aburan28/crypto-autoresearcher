        efficiently invertible tau-ratio exists; any such section is a
        discrete-log oracle. Nothing here bears on ECDLP hardness.
    - id: B-6
      text: >-
        Not supported: H-CZLIFT-6d4ed1 mechanism "the canonical curve lift ...
        contributes nothing" as a structural statement. On the canonical j = 0
        lift the Teichmuller section is Aut(E^)-equivariant (16/16) and a
        perturbed lift of the same reduction is not. It holds for the
        prime-to-p splitting (theorem) and for the identity-readout rate
        (measured).
    - id: B-7
      text: >-
        Not supported as sufficient: H-CZLIFT-6d4ed1 mechanism "a section
        recovering d would need tau(dP)/tau(P) = d for all d". Any efficiently
        invertible f with tau-ratio f(d) suffices (red-team O6).
    - id: B-8
      text: >-
        The derivation covers p >= 5 (D1 needs p >= 3) and n prime to p.
        Anomalous curves (n = p) are outside it, consistent with Smart succeeding
        there (EXP-CZLIFT-17b7eb, separate review). Global lifts
        (H-CZLIFT-9a32e9) and the formal logarithm's analogues for other
        functionals are outside it; in particular nothing here says lifting to
        characteristic zero cannot help through a global functional.
    - id: B-9
      text: >-
        The construction cost O(log n + k log p) is a cost of building s_tor,
        not a cost to break; the per-attempt cost of any section "attack" times
        its inverse success probability (~p) is dominated by Pollard rho.
