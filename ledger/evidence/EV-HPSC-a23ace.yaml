evidence:
  id: EV-HPSC-a23ace
  hypothesis_id: H-HPSC-e76e8e
  experiment_ids: [EXP-HPSC-74991c]
  run_ids: [RUN-HPSC-74991c-001]
  recorded_at: '2026-08-07'
  type: empirical
  direction: supports
  strength: preliminary
  strength_note: >-
    `preliminary`, not `replicated`: one run, one implementation, one seed, seven primes,
    24 curves each. It is enough to put an interval around a recorded point value and to
    show a model degeneracy; it is not enough to settle the asymptotics of C(p), and
    nothing here should be read as settling them.
  claim_tier: toy
  certificate_refs: []
  proof_status: empirical_only
  proof_refs:
    - experiments/EXP-HPSC-74991c/runs/RUN-HPSC-74991c-001/raw-result.json
    - experiments/EXP-HPSC-74991c/specification.yaml

  observations:
    - id: OBS-1
      text: >-
        MEASURED C, 24 curves per prime (matched), full k-range, prime-order curves with
        order verified by [N]P = O.
        p=1009: mean 2.254, max 2.810. p=4001: 2.451 / 2.773. p=9001: 2.496 / 2.743.
        p=50021: 2.682 / 3.066. p=100003: 2.941 / 3.150. p=200003: 3.137 / 3.481.
        p=400009: 2.907 / 3.151. The last point is NON-MONOTONE in both statistics, which
        is the honest signature of a per-prime noise floor at n=24.
    - id: OBS-2
      text: >-
        POWER-LAW EXPONENTS WITH BOOTSTRAP 95% CIs (resampling curves within each prime).
        C_mean: 0.0508, CI [0.0461, 0.0552]. C_max: 0.0334, CI [0.0261, 0.0514].
        The recorded value 0.079 lies OUTSIDE both intervals. The value 0.055 lies inside
        the mean's interval (at its upper edge) and outside the max's.
    - id: OBS-3
      text: >-
        FOUR MODELS, TWO PARAMETERS EACH, COMPARED ON RMS RESIDUAL IN C.
        For C_mean: log 0.0993, sqrt(log) 0.0996, power law 0.1008, constant 0.2914.
        For C_max:  power law 0.1363, log 0.1376, sqrt(log) 0.1408, constant 0.2481.
        The first three are separated by under 0.002 RMS on seven points -- i.e. they are
        indistinguishable on this data -- while the constant model is decisively worse,
        which shows the comparison does discriminate when there is something to find.
    - id: OBS-4
      text: >-
        THE SAME MODELS EXTRAPOLATED TO p = 2^256.
        C_mean: constant 2.7, sqrt(log) 11.2, log 25.2, power law 13102.
        C_max:  constant 3.0, sqrt(log) 9.4,  log 20.0, power law 808.
        Three models that agree to within 2% on the measured range disagree by three
        orders of magnitude where the fit is actually used.
    - id: OBS-5
      text: >-
        Under the corpus's recorded exponent 0.079, C at 2^256 would be ~1.2 x 10^6;
        under the exponent measured here, ~3.8 x 10^2; under the sqrt(log p) heuristic,
        ~13.3. All three appear in KN-FIND-* prose as though they were the same claim.
    - id: OBS-6
      text: >-
        IMPLEMENTATION CONTROL, recorded because it fired. The first draft of the point
        counter omitted a term (it added #{x : f(x)=0} to the character sum), which gave
        a wrong N, truncated the group walk, and produced C values up to 20.7 -- five
        times any plausible value -- with no other symptom. A walk-coverage gate
        (|F_t|/N must lie in (0.3,0.7)) plus an independent [N]P = O check now make that
        failure loud. Any prior measurement of C without such a gate should be re-checked
        for it.

  inference: >-
    The corpus's recorded characterization of the H-PSEUDO constant, C(p) ~ p^0.079,
    is not reproduced. With the curve count matched across primes and the full k-range
    used at every prime, the fitted exponent is 0.033 for the adversarial max and 0.051
    for the mean, and 0.079 lies outside both bootstrap intervals. KN-FIND-4c9e71's
    self-correction -- which raised the max exponent from "O(1), not growing" to 0.079 on
    the strength of six measurements at p=50021 against 152 at p=1009 -- over-corrected;
    the direction of its first claim was closer than its revision.

    The more consequential result is OBS-3 and OBS-4 together. A power law, a sqrt(log p)
    law and a log p law fit the measured C(p) within 2% of one another, and extrapolate
    to 2^256 as ~10^4, ~10^1 and ~10^1 respectively. The functional form of C(p) is
    therefore NOT determined by data of this kind, at this range, at any sample size that
    toy scale permits -- and it is the form, not the exponent, that decides the
    crypto-scale yield-error term. KN-FIND-5c1a03 and KN-FIND-f8c290 lean on that term
    being negligible. That may well be true, but the corpus does not currently have
    evidence for it: it has a power-law fit that was never tested against the logarithm
    the standard heuristic predicts.

  boundaries:
    - Largest prime 400009 (18.6 bits); the fit spans ~8.6 bits and is used to extrapolate
      ~237 bits. That ratio is the finding, not a licence to extrapolate better.
    - One implementation, one seed, 24 curves per prime. Non-monotonicity at the largest
      prime shows n=24 is near the noise floor for this statistic.
    - This says nothing about whether H-PSEUDO is TRUE. It is about the measured size and
      growth of its constant, and about what the corpus's data can support.
    - Nothing here bears on ECDLP hardness in either direction.

  unresolved_confounds:
    - >-
      NO INDEPENDENT REVIEW. No validator, no red team, no second implementation. Rule 12
      not met. The measurement code was written by the same agent that is interpreting it,
      and it had a silent order-counting defect on first draft (OBS-6) -- which is the
      strongest available argument for having someone else run this.
    - >-
      The comparison to KN-FIND-d4f820 / KN-FIND-4c9e71 is not curve-for-curve. Their
      curve samples are not recorded in a form this run could reuse, so a systematic
      difference in curve selection (prime order versus any order, threshold choice)
      could contribute to the level offset (their 3.0-3.84 against this run's 2.25-3.14).
      The EXPONENT comparison is less sensitive to that than the level comparison, but it
      is not immune.
    - >-
      Model comparison by RMS with equal parameter counts is a crude criterion. It is
      sufficient for the claim actually made -- that the models are not separated -- and
      insufficient to select among them, which is the point.

  reviewed_by: none
