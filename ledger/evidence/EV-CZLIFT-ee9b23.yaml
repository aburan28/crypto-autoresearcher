    - {task: TASK-20261023-62eb31, report: experiments/EXP-CZLIFT-ed8113/reports/redteam-20261023/redteam_report.yaml, id: RT-20261023-d796bb, verdict: 'R1 breaks; R2 breaks; PTM-1 breaks'}
  type: empirical
  type_note: >-
    Empirical counts at toy scale. The one adverse clause rests on an exact,
    hand-checkable counterexample (proof_status). The mechanism finding rests
    on a retrieved primary source.
  direction: weakens
  direction_note: >-
    Weakens H-CZLIFT-cb95b8 as worded and as restated by CORR-20261023-4ffd7e.
    (i) Its prediction "exactly 0 on 1600 valid trials per seed" and its
    statement clause "no relation in any of 100 trials per cell on either
    seed ... upper 95 percent bound below 0.002" are false on seed 20261009,
    by an exact counterexample. (ii) Its mechanism misattributes JKSST 2000
    and wrongly claims that the bound-6 search measures "where the attack
    would need it". (iii) Its title's "never dependent" cannot be read from a
    bounded search. The rarity reading (rate <= 0.002 under the y != 0
    sampler; frozen falsification threshold 0.01 not reached) is consistent
    with the data and with the literature. That is why the direction is
    weakens, not contradicts.
  strength: preliminary
  strength_rationale: >-
    Valid frozen protocol, two clean seeds, exact recomputation and a blind
    replay of all 3200 trials (validator). The evidence is limited in four
    ways. (1) The success reading depends on a sampler restriction that the
    text does not state. (2) The measured rate is dominated by a pigeonhole
    factor that the design forces to decay with p, so its lift-specific part
    (1 of 1261 bounded mod-p relations lifted) rests on a single event,
    measured by the red team rather than frozen. (3) No unbounded
    independence control was frozen. (4) The scale is far below JKSST's own
    Experiment C (p = 257, r = 2, 0 of 100000). The red team rated it "weak",
    which maps to preliminary in the hierarchy. The adverse clause (i) does
    not depend on strength: it is an exact counterexample.
  claim_tier: toy
  claim_tier_note: >-
    The largest prime is 12809 (14 bits), with r <= 3, relation bound 6, two
    seeds and 1600 valid trials per seed. No transfer to larger p, larger r,
    larger bounds or deployed curves is claimed.
  scale_relevance:
    label: toy-scale
    justification: >-
      Direct computation at p in {101, 211, 401, 809, 1601, 3203, 6421, 12809};
      no correspondence or extrapolation is used.
  tested_setting:
    curve_family: random nonsingular short Weierstrass y^2 = x^3 + a x + b over prime fields F_p (harness/toycurve.py)
    field_type: prime
    bit_sizes: 7 to 14 bits (p = 101 ... 12809)
    instance_generation: >-
      Per (p, r) cell, 100 trials. Random (a, b). r points from
      harness/czlift.py random_point, uniform over affine points with y != 0
      and with pairwise distinct x. Symmetric integer lifts. The unique
      zero-freedom rational fit through the lifts (r = 2 short model; r = 3
      with an X^2 term). 3 planted controls per prime.
    solver_and_version: >-
      Exact bounded relation search dependent() in
      experiments/EXP-CZLIFT-ed8113/implementation/run.py at run commit
      025949c406, which is hash-identical to the freeze commit 172ec3c94f.
      Library harness/czlift.py, harness/czlift_run.py and harness/toycurve.py,
      hash-pinned in trial-plan.json.
    parameters: {primes: [101, 211, 401, 809, 1601, 3203, 6421, 12809], r: [2, 3], trials_per_cell: 100, relation_bound: 6, controls_per_prime: 3}
    seeds_and_instances: seeds 20261009 and 20261010; 1600 valid trials and 24 controls per seed
    controls: planted (2, -1); on-curve re-verification; singular-fit exclusion (vacuous by construction, validator F3)
    resource_limits: advisory 3600 s per run, 1 CPU-hour, 2 GB; used 199.40 s and 200.39 s wall; no peak-memory record
  certificate_refs: []
  certificate_note: >-
    Both runs declare certificate.kind none, because they are measurement
    runs and claim no solve. The one recorded dependence is not an attack
    relation. It is the adverse counterexample, cited under proof_refs and
    re-verified there by code independent of the producer.
  proof_status: certificate
  proof_refs:
    - experiments/EXP-CZLIFT-ed8113/analysis.md
    - experiments/EXP-CZLIFT-ed8113/reports/validation-20261022/validation_report.yaml
    - experiments/EXP-CZLIFT-ed8113/reports/validation-20261022/j3_replay.json
    - experiments/EXP-CZLIFT-ed8113/reports/redteam-20261023/rt_replay_inputs.json
    - experiments/EXP-CZLIFT-ed8113/reports/redteam-20261023/rt_regulator_control.json
    - experiments/EXP-CZLIFT-ed8113/runs/RUN-CZLIFT-c3f8a8/raw-result.json
  proof_refs_note: >-
    The certificate is scoped to the zero clause and the zero prediction
    only. It is the explicit instance E~: Y^2 = X^3 - 1728 X - 27423 with
    P~1 = (-24, -15) and P~2 = (48, -15), which satisfy 2 P~1 + P~2 = O, at
    seed 20261009, p = 101, r = 2, trial 61. The validator's sealed blind
    search (exact rational arithmetic written from the statement;
    validation_report.yaml accidental_relation_probe, j3_replay.json) found
    it independently. The red team verified it exactly with PARI
    (rt_regulator_control.json, rt_replay_inputs.json). analysis.md I-1
    re-checks it by hand: tangent factorization (X + 24)^2 (X - 48), and
    infinite order of P~1 by Nagell-Lutz on 4 P~1. The mechanism finding is
    literature (retrieved; see citations). The instrument-ceiling finding
    rests on the red team's in-distribution torsion objects
    (rt_ptm_torsion_object.json) and is not used for the transition.
    analysis.md rides the same ledger archive as this record. All other
    proof_refs are committed review inputs.
  citations:
    - ref: 'Jacobson, Koblitz, Silverman, Stein, Teske, "Analysis of the xedni calculus attack", Des. Codes Cryptogr. 20 (2000) 41-64'
      provenance: retrieved
      claim: >-
        Theorem 4.1 (success < C0/p) is conditional on Lang's canonical-height
        lower bound and on log|D| >= C1 max hhat(P_i) (Lemma 4.1). Its
        mechanism is a coefficient bound C2 plus pigeonhole. C0 ~ 1e4 (r = 2)
        and ~ 1e12 (r = 3) (section 4.1). Dependence is frequent at small
        discriminants (sections 5.1-5.2). Attack-relevant relation
        coefficients are of order p^(1/r) (pp. 51-52).
      verified_by: TASK-20261023-62eb31 (red team; primary PDF read in full)
    - ref: knowledge/frontiers/ecdlp/index-calculus/KR-IC-cd159a.yaml
      provenance: internal
      claim: >-
        The frontier row cited by the hypothesis. It states that xedni
        "succeed[s] with negligible probability" (sources read at abstract
        level only). It does not say that lifted points are independent with
        overwhelming probability.
      verified_by: coordinator, this review (row read on disk 2026-10-23)
  observations:
    - id: OBS-1
      text: >-
        Validity: 2 of 2 trials output_validated; run commit clean and bound to
        the freeze; 9/9 artifact hashes per run; every frozen metric recomputed
        exactly; 3200/3200 trial outcomes and 48/48 controls agree with a
        sealed blind replay; 0 singular exclusions in 32 cells.
    - id: OBS-2
      text: >-
        Seed 20261009 (RUN-CZLIFT-c3f8a8): 1 dependent in 1600 (rate 0.000625;
        r = 2 0.00125, r = 3 0.0), one-sided 95 percent upper bound 0.00296.
        Seed 20261010 (RUN-CZLIFT-218843): 0 in 1600 (upper bound 0.00187).
        Pooled: 1 in 3200 (3.1e-4; two-sided [7.9e-6, 1.74e-3]; one-sided
        upper bound 0.00148). Controls 24/24 on each seed.
    - id: OBS-3
      text: >-
        The single dependence: p = 101, r = 2, trial 61. Lifts (-24, -15) and
        (48, -15) on Y^2 = X^3 - 1728 X - 27423; relation [-2, -1], a tangent
        coincidence. The validator's exact probability for this tangent family
        is 9.86e-4 per trial at p = 101 and 2.46e-4 at p = 211; P(at least
        one in 200 r = 2 trials at p = 101) = 0.179.
    - id: OBS-4
      text: >-
        The frozen sampler never draws y = 0 (0 of 60000 on full-2-torsion
        curves at p = 101; 0 of 8000 replayed points). Under the literal
        all-points reading, the expected 2-torsion hits are 9.77 per seed
        (rate 0.0061), and the validator's blind literal sampler gave 8/1600.
    - id: OBS-5
      text: >-
        The height ratio, recorded over the r = 2 cells only, is 0.632-0.810
        (seed 20261009) and 0.655-0.831 (seed 20261010), rising with p. The
        uniform-residue law 1 - (1 + ln 2)/ln p gives 0.633-0.821.
    - id: OBS-6
      text: >-
        Reviewer measurements on exactly replayed inputs (not frozen):
        - Height-pairing determinant: 3199/3200 tuples Z-independent, no
          torsion points.
        - Bounded mod-p relations: 1261/3200 (r = 2 254, r = 3 1007), of
          which 1 lifts, so f = 7.9e-4 [2.0e-5, 4.4e-3].
        - Median smallest mod-p max|n|: r = 2 6 -> 60.5-61, and r = 3 3 -> 13,
          from p = 101 to p = 12809.
        - JKSST empirical law: 0.855 dependent trials expected.
        - C1 = log|Delta_min| / max hhat: minimum 11.24.
    - id: OBS-7
      text: >-
        Reviewer PTM objects: in-distribution pairs at p = 6421 with an order-7
        or order-8 rational torsion point. The producer fit reproduces each
        curve, and its search returns no relation at bound 6. The 389a1
        generators return no relation at bound 6 or 12, which is correct.
  inference:
    supported_statement: >-
      Setting: p in {101, 211, 401, 809, 1601, 3203, 6421, 12809}; random
      y^2 = x^3 + a x + b over F_p; r in {2, 3} points drawn uniformly from
      the affine points with y != 0 and pairwise distinct x (the hash-pinned
      sampler); symmetric integer lifts; the unique zero-freedom rational fit.
      Result: the exact search over max |m_i| <= 6 found 1 relation in 3200
      valid trials pooled over seeds 20261009 and 20261010 (rate 3.1e-4,
      exact 95 percent CI [7.9e-6, 1.7e-3]); per seed 1/1600 and 0/1600; for
      r = 3, 0/1600. The one relation is the tangent relation
      2 P~1 + P~2 = O at p = 101, r = 2. The planted (2, -1) control was
      detected 48/48. Naive point log-height follows log(p/2) - 1.
    negative_phrasing: >-
      No dependence rate above the predefined 0.01 falsification threshold was
      observed over the tested primes, sampler, fit, relation bound,
      implementation and budget. The predefined zero-count prediction was not
      met on seed 20261009.
    adverse_readings:
      - id: A-1
        text: >-
          The zero clause and prediction are false on seed 20261009. Basis:
          certificate (proof_refs).
      - id: A-2
        text: >-
          The mechanism's JKSST attribution is incorrect. JKSST Theorem 4.1 is
          conditional and vacuous at p <= 12809, and JKSST measures frequent
          dependence at small discriminants. Basis: retrieved literature.
      - id: A-3
        text: >-
          The mechanism's "measures the count where the attack would need it"
          is false. Bound 6 lies below the median smallest mod-p relation in
          every r = 2 cell with p >= 211 and every r = 3 cell with p >= 3203,
          and the attacker scale is p^(1/r). Basis: reviewer measurement plus
          retrieved literature.
    not_supported:
      - '"Never dependent", or "no relation on either seed".'
      - '"The lifted points are independent", read from the bounded search (PTM-1).'
      - 'The count as "the counting form of the xedni obstruction" (specification decision_impact.on_positive; red-team O8).'
      - '"Random points of E(F_p)" without the y != 0 restriction.'
      - '"Naive log-height about 0.7 log p" as a constant.'
      - That the near-zero rate at large p is evidence about the lift (it is forced mod p by pigeonhole).
  boundaries:
    - id: B-1
      text: Toy tier; p <= 12809, r <= 3, relation bound 6, symmetric lifts, zero-freedom fits, y != 0 sampler. Nothing about any deployed curve or any cost.
    - id: B-2
      text: >-
        Not xedni proper: no discriminant minimization (JKSST section 5.2
        reports about 30 percent dependence at <= 40-bit discriminants under
        minimization), no reverse-Mestre conditions, and no r = 4..9. Median
        log2|Delta_min| is 68-74 bits at p = 101 (r = 2), rising to about 424
        bits (r = 3, p = 12809).
    - id: B-3
      text: Relation coefficients above 6, including rational torsion of order 7..12 and the attacker regime of order p^(1/r), are not searched.
    - id: B-4
      text: Nothing bears on Silverman-Suzuki index calculus (no factor base) or on RQ-CZLIFT-b9f765 decision_target (a)'s coverage clause (no coverage is measured).
  unresolved_confounds:
    - >-
      Sampler: the success reading depends on the undeclared y != 0
      restriction. The literal reading is untested by the producer runs.
    - >-
      Pigeonhole: the raw rate mixes the mod-p bounded-relation rate (a
      property of F_p, not of the lift) with the lift-survival fraction. Only
      the red team separated them, on replayed inputs.
    - 'Checker independence: check.py imports run.py; independence rests on the validator''s recomputation and blind replay.'
    - Height metric covers r = 2 cells only (validator F2).
  confound_assessment: []
  confound_assessment_note: >-
    EXP-CZLIFT-ed8113 was designed on 2026-10-09, before the variable_ledger
    requirement (2026-10-18), and has no variable_ledger. No row is graded.
    The two sampler readings and the mod-p/lift decomposition are recorded
    under unresolved_confounds.
  obstruction:
    statement: >-
      For lifts of r in {2, 3} random y != 0 points under the zero-freedom fit,
      any Q-relation with max |m_i| <= 6 reduces to the same relation mod p.
      So the Q-dependence rate within the bound is at most the mod-p
      bounded-relation rate, which pigeonhole drives down like (13^r - 1)/(2p).
      Of the bounded mod-p relations that exist, the lift preserved 1 of 1261.
      The relations an attacker needs have coefficients of order p^(1/r),
      outside any fixed bound.
    quantity: >-
      (q1) Q-dependence rate within max |m_i| <= 6; (q2) mod-p bounded-relation
      rate on the same residues; (q3) lift-survival fraction f = q1-count /
      q2-count; (q4) median smallest mod-p relation max |n| per (p, r) cell,
      against the bound 6.
    value: >-
      (q1) 1/3200 = 3.1e-4 dependent trials per valid trial, exact 95 percent
      CI [7.9e-6, 1.74e-3]; per seed 1/1600 (one-sided upper 0.00296) and
      0/1600 (0.00187). (q2) 1261/3200 = 0.394; r = 2 254/1600 falling from
      0.58-0.64 at p = 101 to 0-0.01 at p >= 6421; r = 3 1007/1600 falling
      from 1.0 at p <= 211 to 0.07-0.09 at p = 12809. (q3) f = 7.9e-4
      (dimensionless), exact 95 percent CI [2.0e-5, 4.4e-3]; r = 2 1/254
      [1.0e-4, 0.022]; r = 3 0/1007 [0, 3.7e-3]. (q4) coefficient units: r = 2
      6 -> 60.5-61, r = 3 3 -> 13, from p = 101 to 12809; per-cell medians
      over 100 trials.
    measured_by: [RUN-CZLIFT-c3f8a8, RUN-CZLIFT-218843, EXP-CZLIFT-ed8113]
    measured_by_note: >-
      q1 is read from the two frozen runs. q2-q4 were measured by
      RT-20261023-d796bb (rt_modp_null.json, rt_stats.json) on inputs
      regenerated exactly from those runs: per-cell mean heights differ by 0.0,
      and the recorded relation was re-found. They are review measurements, not
      frozen metrics.
    scope: >-
      p in {101, 211, 401, 809, 1601, 3203, 6421, 12809}; r in {2, 3}; 100
      trials per cell and seed; seeds 20261009 and 20261010; y != 0 sampler
      with distinct x; symmetric lifts; zero-freedom fit; bound 6. Claimed
      nowhere else. Not over xedni proper, larger r, other lifts or larger
      bounds.
    resource_check:
      examined: true
      reading: >-
        Asked which theory takes these numbers as its hypothesis rather than
        its refutation. JKSST's success model per round is
        Pr[bounded mod-p relation] x f, and it takes f as an input. Because
        Pr[bounded mod-p relation] <= (2 C2)^r / n, no f in [0, 1] yields a
        sublinear attack. At the measured f the expected rounds are about 15 n
        (r = 2) and 1.15 n (r = 3), linear even at f = 1, and Pollard rho
        dominates. The lifted relations that do occur are geometric (tangent
        or chord) and hold mod p already, so a theory exploiting them is a
        mod-p relation test in disguise. The companion measurement
        C1 = log|Delta_min| / max hhat (minimum 11.24; medians 21.0-23.7 for
        r = 2 and 28.3-31.6 for r = 3) is the hypothesis of JKSST Lemma 4.1,
        and it holds at toy scale. A small C1 would weaken the JKSST
        obstruction, and nothing here suggests C1 -> 0 with p. The check found
        no theory taking these measurements as a resource for computing
        discrete logarithms (red-team obstruction_readings, concurred by the
        Coordinator). No lane is spawned.
      spawned_ids: []
  reviewed_by: coordinator
