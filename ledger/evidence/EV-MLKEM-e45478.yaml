    structured null's. TWO CONCLUSIONS, KEPT APART BY THE RED TEAM AND KEPT APART HERE.
    ABOUT THE INSTRUMENT (SUPPORTED): at S = 8, E = 4 with Satterthwaite on three mean
    squares, the two-way SE is degenerate often enough that the Section C instrument has no
    resolving power at a large fraction of targets BY DESIGN; C2's P-C2d was scoped to
