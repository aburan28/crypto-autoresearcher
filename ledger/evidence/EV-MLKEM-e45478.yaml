      numbers both reports themselves print, the difference is the ABSENCE OF fpylll and
      the separate session, not a different numerical stack. Recorded so that no successor
      reads the wave's bit-exact agreements as cross-platform reproduction. The genuinely
      cross-platform datum in this batch remains the producer's agreement with the
      BATCH-cbe023 Red Team's L7/L8 figures, which is a review measurement from another
      batch and is not this wave's.
    - >-
      Neither report cites "the obstruction is relocated" or "CONSISTENT" as a claim in
      either direction; where the committed real count appears in the Red Team's report it
      carries the exact-null benchmark in the same sentence; the Validator records at F-3
      that three occurrences in the PRODUCER artifacts lack the benchmark and that the
      frozen text is itself internally inconsistent on this point.

  validity_verification:
    expected_run_count: >-
      PASS for the producers, as reported by the Validator: four producer tasks,
      maximum_runs 1 each, expected_runs 1 and used_runs 1 each, with each command.txt
      stating that it is that one run. PASS with a DISCLOSED INTERPRETATION for the
      reviews: both cards carry maximum_runs 1, and both reviewers state what they read it
      to mean and count their own executions exactly rather than claiming a single
      invocation. The Validator reports three executions of its own verification instrument
      (0.1 s, about 1 s, 87.3 s). The Red Team reports seven probes, each executed exactly
      once, 625 s in total, with no probe re-run and no output discarded. I accept both
      readings: a reviewer that may execute nothing cannot satisfy a completion gate that
      requires a null object to be BUILT, and both disclosed the reading rather than
      stretching the number silently.
    schema_complete_manifests: >-
      PASS WITH TWO RECORDED MINOR GAPS, neither repaired by me and neither material. The
      Validator reports all four run_manifest.yaml files parsing and carrying command,
      revision, dirty state and reason, environment with dependency versions, BLAS pinning,
      seeds as formulas rather than cached values, inputs, timings against budget,
      validity, outcomes, and certificate.kind none with its reason. GAPS: TASK-20260809-97d6cf's
      manifest records no max_rss and TASK-20260809-3eb72c's carries no resources block at
      all; both figures (108,978,176 B and 109,060,096 B) are in the corresponding results
      JSON, which the Red Team independently confirms, so the artifact policy is satisfied
      at the task-directory level. The BATCH-cbe023 folded-scalar defect DOES NOT RECUR:
      the Validator reports parsing every manifest and finding 12 of 12 declared paths
      plain, resolving and unfolded at each of the four producers.
    seed_integrity: >-
      PASS. The Validator reports all seeds present as FORMULAS rather than cached values
      (five keys in Section R; seed_error, seed_haar and seed_nullfam in Section B'), and
      reports recomputing Section B's c_min from the 8 raw per-draw arm values at max
      deviation 0.000e+00 over all 48 live steps with 0 degenerate steps. The Section B'
      seed formula is reported as declared inside the notarized blob BEFORE any draw. Both
      reviewers independently varied only the frame seeds to build their own families, and
      the Red Team reports asserting its disjoint offset against the producer's seed range
      inside the probe.
    raw_summary_agreement: >-
      PASS, at the strongest level this goal has reached. The Validator reports
      recomputing every statistic FROM RAW rather than from summaries -- 75 G-REL2 cells
      and 38 G-REL1 entries at max |recomputed - stored| = 0.00e+00 on mean_gap, both
      between-basis sds, paired sd, paired t, detection floor, both criterion readings and
      mean s_X/|X|, with 0 verdict disagreements -- and reports rebuilding the whole C1
      table and the whole C2 ladder from the committed raw 8x4 tables with its own
      decomposition. The Red Team independently reproduces the C1 ratios and the C2 SE
      recovery. ONE recorded methodological correction the Validator makes AGAINST ITS OWN
      FIRST RESULT: an UNQUALIFIED monotonicity test on |t| across the C2 ladder fails at
      3 targets, which is the wrong test -- prereg 5.3's P-C2b is qualified "once delta
      exceeds |Delta_bar_committed|" -- and under the frozen qualifier it measures 0
      violations at 10 of 10. It records this so a reviewer applying the unqualified test
      does not read three false positives.
    control_comparability: >-
      MIXED, AND THIS IS THE WAVE'S DECIDING AXIS. The controls that were BUILT behaved,
      and both reviewers say so: X_mp = rawtail, declared MUST-PASS in the notarized text
      before any datum with a live failure row, passes REL1 at 10 of 10 and REL2 at 14 of
      19, with all five failing cells at beta = d/2 exactly, where the mirror k -> d-k is
      self-symmetric and the true gap is zero by symmetry, and all five below their own
      detection floors; X_null fires the G-VAR refusal it was planted to fire; the Section
      B' null family is identical to the graded family in every respect but the frame seed
      formula, which the Validator reports verifying by reading the code and the Red Team
      by reusing the producer's own functions verbatim; and Section C2's injection reaches
      the raw 8x4 table so the could-not-FIRE arrangement AM-14(b) names is genuinely
      averted. WHAT THE WAVE ADDS is four controls the batch did not contain, each BUILT
      rather than proposed, and three of them bound a headline: the F1 nearby family
      (RT-R1), the V_evade perturbation (Validator O-2), the effect-free 8x4 null tables
      for SE_2way/SE_naive and for nu_eff (RT-C1a, RT-C1b), and the centered C2 ladder
      (which corroborates the producer). Both reviewers also ran a negative control on
      their own instrument -- the Validator's V_const = 42.0, which G-VAR refuses and
      G-REL fails everywhere, and the Red Team's F0 arm inside every family probe -- so
      "my object passed the gate" is interpretable in both reports.
    infrastructure_note: >-
      NO TIMEOUT, CRASH OR BUDGET EXHAUSTION OCCURRED IN EITHER REVIEW. The Validator
      reports 7200 s granted and about 88 s of instrument execution consumed, peak
