  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-9e3584/tasks/TASK-20260809-4011dd/prereg.md
  proof_refs_note: >-
    `derivation` in the sense of docs/claims-and-verification.md, and it is claimed for
    the ADVERSE readings only -- the findings that three of the batch's headline
    statements are narrower than stated. Three of those readings are supported by
    explicit counterexample INSTANCES packaged as re-executable probe scripts with their
    recorded outputs: (1) V_evade, an additive perturbation of relative size about
    1e-10 that G-VAR admits while it passes both relevance clauses (Validator O-2);
    (2) the F1 nearby family, in which G-VAR fires 0 of 38 on the same two observables
    it refuses 38 of 38 times in the frozen family (Red Team RT-R1); (3) the effect-free
    8x4 null tables on which SE_2way/SE_naive < 1 occurs at the observed rate (Red Team
    RT-C1a). These fall SHORT of `certificate` and are declared short of it: no party
    independent of the reviewer that built each has re-executed it. What raises them
    above assertion is that the same scripts reproduce the producers' own recorded
    numbers -- G-VAR 38/38 in F0 through the producer's own bit_identical(), the C1
    ratios to four decimals, the C2 SE recovery to 8.527e-16. The fourth adverse reading,
    RT-R3, is a pure statement about what was and was not demonstrated and needs no
    measurement. NO CLAIM HERE IS A THEOREM, and none of this is a universal
    impossibility claim.

  # ==================================================================
  # VALIDITY VERIFIED BEFORE INTERPRETATION
  # ==================================================================
  coordinator_verification_performed:
    method: >-
      I hold no shell in this session. I read, in full and in this worktree: both wave-2
      review reports; COORDINATOR-ADJUDICATION-20260811.md; both COORDINATOR-DEFECT.md
      records by reference through the adjudication; dispatch_queue_continuation.json;
