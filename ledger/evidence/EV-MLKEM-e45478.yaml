      to one or both wave-2 reviewers, and the attribution is named at each place. I ran
      no producer code, no probe, and no git command, and I do not narrate any of them
      into checks of my own.
    what_i_checked_myself_by_reading:
    - >-
      Both reports declare artifact_paths under `.../reviews/TASK-20260809-3f1dc4/` and
      `.../reviews/TASK-20260809-444fe7/`, while the bytes are on disk under
      `.../reviews-wave2/TASK-20260812-da8c3b/` and `.../reviews-wave2/TASK-20260812-aadafd/`.
      The discrepancy is real, it is the relocation, and it is recorded rather than
      repaired inside either report.
    - >-
      The continuation queue's ledger-archive task TASK-20260809-60f9cc declares exactly
      four artifact_paths and names source_task_ids [TASK-20260809-3f1dc4,
      TASK-20260809-444fe7]. Its expected binding set therefore names two paths that do
      not exist in this worktree and omits all 30 that do. AS DECLARED IT CANNOT COMMIT
