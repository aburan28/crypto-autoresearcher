      commit on the concurrent branch.
    - >-
      Both reports state their own inference block, both record model_verified: false with
      a reason, and both state that AGENTS.md rule 12 is UNMET AND UNWAIVED. Neither
      claims model-level independence.
    - >-
      The two reports print the same numerical stack: python 3.11.15, numpy 2.4.6, scipy
      1.17.1. The Validator states plainly (its L-2) that this is the producer's stack too,
      so its 646 bit-exact agreements are EXPECTED and are not cross-platform evidence. The
