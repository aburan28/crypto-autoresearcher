      committed content is load-bearing, and because a reader who finds it should know it
      was checked rather than missed.

  strength: replicated
  strength_basis: >-
    `replicated` is claimed for MEASUREMENT REPRODUCIBILITY and for a NAMED SET of
    instrument facts, and it is claimed for NOTHING ELSE. It is not claimed for any
    producer headline as stated, not for any statement about lattices, and not for the
    new adversarial constructions this wave introduces. The three classes are separated
    because they replicate for different reasons.
    (i) REPRODUCIBILITY, TWO INDEPENDENT SESSIONS. The Validator reports rebuilding all
    80 frozen bases from the frozen text with its own code and reproducing 646 stored
    per-basis values BIT-EXACTLY (304 rdet, 304 rawtail, 38 X_null), 75 G-REL2 cells and
    38 G-REL1 entries at max deviation 0.00e+00 on every one of nine statistics, the
    entire Section C1 scoring table from the committed raw 8x4 Delta tables with its own
    two-way random-effects decomposition, and the entire Section C2 injection ladder at
    max relative SE deviation 8.527e-16 against the producer's reported 8.53e-16. The
    Red Team independently reports reproducing the notarized prereg 2.6 X_null table at
    38 of 38 cells THROUGH A MATRIX PATH the producer does not use, G-VAR firing 38/38
    on both rdet and X_null, X_null's G-REL1 at 10 of 10 and G-REL2 at 19 of 19, all ten
    SE_2way/SE_naive ratios to four decimals, and SE_Delta_bar at relative deviation
    exactly 0.0 at all ten C1 targets.
    (ii) TWO REPLICATED INSTRUMENT FACTS. (a) The zero between-basis dispersion of
    X_null and of the UNPLANTED X8 = rdet is now THREE-SOURCE: the producer's run, the
    Validator's own basis construction and slogdet plus a 50-digit closed-form
    evaluation, and the Red Team's independent matrix-path implementation. (b) Section
    B's decay-check FAIL is FOUR-SOURCE: the producer's family, the Validator's
    independently seeded family, the Red Team's 8 independently seeded replicates, and,
    in direction only, the BATCH-cbe023 Red Team's exact-null benchmark. On the rebuilt
    null family n_fire(c = 6) is 35 of 48 for the producer and 34 of 48 on the
    Validator's family, against the committed real count of 29 of 48 and the exact-null
    benchmark of 47 of 48; the Red Team's 8 replicates give 28, 37, 36, 32, 32, 29, 28,
    35 with mean 32.12 and sd 3.60, whose minimum of 28 is seven steps above the
    pre-registered PASS threshold of <= 21.
    (iii) SINGLE-SOURCE, AND NOT COVERED BY THE LABEL. Each of the following exists in
    exactly one review session and has been reproduced by no one: the Validator's O-2
    G-VAR evasion; the Validator's exact family count of 34 of 48; the Red Team's F1
    nearby family and its 0-of-38 G-VAR result; the Red Team's 8-replicate n_fire
    distribution; the Red Team's SE-ratio and nu_eff null distributions; and the Red
    Team's centered C2 ladder. They are existence demonstrations and null calibrations,
    not replicated results, and the two reviewers built them without reading each
    other's work.
    (iv) AND WHAT THE LABEL DOES NOT SOFTEN. Two of the wave's most consequential
    findings are that the batch's own headline statements over-reach: RT-R3 (the
    "neither direction" closure was demonstrated only on the PASS side) and RT-B1 (the
    single reported n_fire value is a high draw of a statistic with sd 3.60). A
    reproducible measurement of a quantity whose verdict was determined by its design is
    a reproducible measurement and nothing more.

  claim_tier: toy
  claim_tier_note: >-
    TOY, UNCONDITIONALLY, at d in {20, 30, 40, 100, 140}, k the identity block, the
    frozen beta grid, q <= 3329, 8 frozen bases per lattice, S = 8 supports and E = 4
    error pools, N = 2^20 CBD_{eta=2} draws, the 2^-10 quantile only, and no reduction
    beyond the frozen HKZ pipeline at d <= 40. NOTHING in this record bears on ML-KEM
    security, on any FIPS 203 parameter set, on any attack cost, or on any cost model.
    No number here is transported to beta = 606, d = 1420, or to any other parameter set
    by extrapolation, by analogy, or by any other route. Both wave-2 reports state this
    in their own headers and both report checking, rather than assuming, that no
    producer transported a number; the Red Team additionally reports reading all four
    producer reports and the pre-registration and finding no operation count, no
    bit-security figure and no parameter-set cost anywhere.

  certificate_refs: []
  certificate_refs_note: >-
    All four producer manifests declare certificate.kind = none with a reason, and the
