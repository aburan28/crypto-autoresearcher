      one file; the red-team slot holds its report plus 28 probe files (7 probes x
      {.py, .json, .stdout.log, .stderr.log}); 30 paths for the wave in total. UNCOMMITTED
      at the moment this record is written -- PD-4, open and inherited -- and the sole
      carriers of their own evidence until the wave-2 ledger archive commits them.
    paths:
