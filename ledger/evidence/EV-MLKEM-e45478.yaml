evidence:
  id: EV-MLKEM-e45478

  hypothesis_id: null
  hypothesis_id_note: >-
    DELIBERATELY NULL, for the same reason as EV-MLKEM-9b8f7f and EV-MLKEM-cd9878.
    BATCH-9e3584's four producers measured INSTRUMENTS: an admissibility gate over a
    frozen candidate list (Section R), a null family for a monotonicity gate's count
    (Section B'), a re-derived relative floor with a widened suggestive band (Section
    C1), and an injecting positive control for a two-way SE (Section C2). This record
    carries the SECOND INDEPENDENT REVIEW WAVE of those producers and nothing else.
    Naming a hypothesis here would invite exactly the inference these artifacts cannot
    support.

  experiment_ids: []
  experiment_ids_note: >-
    No EXP-* record governs this batch. The frozen contract is the notarized
    pre-registration
    coordination/goals/GOAL-MLKEM-005/batches/BATCH-9e3584/tasks/TASK-20260809-4011dd/prereg.md,
    sha256 190cf4740b0ecefdbe7d1da0868a6258352b044ae5e99da470060f94049c70ea. Both
    wave-2 reviewers report recomputing that sha256 independently -- from the working
    tree, from the blob at the notarizing commit 1aa7db53, and from the committed
    sidecar -- and report all three agreeing with the value carried in all four
    producer manifests and in their own task cards.

  run_ids: []
  run_ids_note: >-
    This batch minted no RUN-* identifiers. The four producer runs are identified by
    their task ids and by the sha256 of their artifacts: TASK-20260809-cda2f6
    (Section R, the lead), TASK-20260809-311784 (Section B', the AM-13 null family),
    TASK-20260809-97d6cf (Section C1), TASK-20260809-3eb72c (Section C2). Their 28
    artifacts are reported by both wave-2 reviewers as committed at
    c034ef38003028a20b8e97f7f0a55bd6a16fdb5d. THIS RECORD ADDS NO PRODUCER RUN. What it
    adds is two review sessions and their own instruments, whose artifacts are listed
    under review_artifacts below.

  type: empirical

  direction: neutral
  direction_note: >-
    NEUTRAL, and this is the reading rather than a hedge. Nothing here supports,
    weakens or contradicts any hypothesis about lattices, about reduction, about the
    Beta tail law, or about ML-KEM. What this wave establishes is (i) that the four
    producer packages are admissible evidence on their own terms, and (ii) that three
    of the batch's four reported headlines are narrower than stated -- the G-VAR
    refusal is conditional on the frozen family, the closure over the gate's refusal
    side was never demonstrated, and Section B's single reported n_fire value does not
    survive replication as stated -- while the substantive decay-check FAIL, Section
    C1's invariance, and Section C2's diagnosis of its own falsified prediction all
    survive independent re-measurement.

  # ==================================================================
  # WHAT THIS RECORD COVERS, AND THE DUPLICATE EXECUTION IT SITS INSIDE
  # ==================================================================
  scope_of_this_record: >-
    THIS IS THE EVIDENCE RECORD FOR THE SECOND (WAVE-2) INDEPENDENT REVIEW OF
    BATCH-9e3584'S FOUR PRODUCERS, AND FOR NOTHING ELSE. It is scoped to what those two
    review sessions actually measured against the committed producer snapshot. It does
    not adjudicate any producer outcome row, does not move a hypothesis, does not
    promote anything to knowledge/, and asserts nothing about ML-KEM.
  duplicate_execution_disclosed: >-
    THE TWO SESSIONS THAT PRODUCED THESE ARTIFACTS EXECUTED THE TASK CARDS
    TASK-20260809-3f1dc4 (validator) and TASK-20260809-444fe7 (red team), which the
    BATCH-9e3584 continuation queue in this worktree listed as `queued`. Those same two
    cards had ALREADY BEEN EXECUTED, by different sessions, on the unmerged branch
    origin/claude/ml-kem-solution-ckdxmg. That is a DUPLICATE EXECUTION OF ONE CARD, it
    is what happened, and this record says so rather than rewriting it. The report
    bodies therefore name TASK-20260809-3f1dc4 and TASK-20260809-444fe7 internally, and
    the validation report additionally carries `id: VAL-20260809-3f1dc4` and both
    reports declare artifact_paths under `.../BATCH-9e3584/reviews/<old task id>/`.
    THOSE INTERNAL PATH DECLARATIONS ARE STALE AND ARE NOT CORRECTED IN THE REPORTS: an
    immutable review artifact is not edited (AGENTS.md rule 4). The bytes were RELOCATED
    by the dispatching session, before any commit, to fresh task slots under
    `reviews-wave2/`, so that they cannot contend at merge with the different files the
    concurrent branch already committed at the old paths. The relocation moved bytes and
    changed no byte of either report. The mapping is recorded in
    review_artifacts.path_mapping below and is the single most important field for
    whoever merges these two chains.

  review_artifacts:
    validator_slot: TASK-20260812-da8c3b
    red_team_slot: TASK-20260812-aadafd
    on_disk_at_the_time_of_this_record: >-
