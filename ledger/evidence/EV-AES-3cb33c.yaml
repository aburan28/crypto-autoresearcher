    - >-
      The validator's blind_rederivation duty for the F1 figure was NOT
      achievable as instructed: this task's own required background reading
      included the paths the review_plan's `blind_from` was meant to
      exclude, disclosed honestly as `blind_from_respected: false`
      (F-VAL4c225b-2) rather than papered over. The arithmetic is
      nonetheless independently confirmed correct via a fresh computation,
      and further corroborated by the red team's own independent hand
      recomputation.
    - >-
      Neither reviewer's supplementary/adversarial reading of the amendment
