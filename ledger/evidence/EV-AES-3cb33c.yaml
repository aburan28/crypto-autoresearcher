  # =====================================================================
  # OBSERVATIONS. WHAT THIS BATCH'S FIVE ITEMS AND TWO INDEPENDENT REVIEWS
  # ACTUALLY ESTABLISH.
  # =====================================================================
  observations:
    - >-
      ITEM 1 (RANK 1) — protocol-amendment-GOAL-AES-002-003 (CM-1
      superseding amendment) was authored by TASK-20260901-d08b9f and
      committed by TASK-20260901-420f4b. Its four resolving-text blocks
      close DEC-20260810-6c00b4's four named CM-1 reading ambiguities
      (element (a) Route 3; elements (c)/(f) jointly; element (d); elements
      (b)/(c) distinguisher bridge). CM-1.yaml's own committed bytes remain
      byte-identical to their BATCH-2b0fd1-committed form, independently
      confirmed by both reviewers.
    - >-
      BOTH INDEPENDENT REVIEWERS DISPOSITION THE AMENDMENT'S FOUR BLOCKS,
      AND THEIR TWO VERDICTS ARE RECORDED IN FULL BECAUSE THEY ARE NOT
      CONTRADICTORY. The validator (VAL-20260901-4c225b) independently
      byte-diffed all four resolving-text blocks against their task card
      (all four match byte-for-byte after normalising markdown formatting
      only) and, on a supplementary read, found each closes its cited
      RT-20260831-1166f2 finding without introducing a comparably-sized new
      ambiguity. The red team (RT-20260901-1af5d9), assigned the formal
      counterexample-reapplication joint, independently confirmed all four
      blocks CLOSE the ORIGINAL counterexamples RT-20260831-1166f2
      constructed against the pre-amendment text — but, applying NEW,
      independently constructed counterexamples as its own joint required,
      found that TWO of the four (element (a) Route 3; elements (c)/(f)
      jointly) leave a NEW, NARROWER, MEDIUM-severity reading gap each: (a)
      Route 3's bar on "independent" ShiftRows/MixColumns computation does
      not define "independent" for a fused table-driven (T-table)
      implementation, where one memory lookup performs SubBytes, ShiftRows,
      and part of MixColumns simultaneously — two conforming readers
      classify such an attack oppositely; (c)/(f)'s "genuinely distinct
      computational acts" test is under-determined for a guess-and-determine
      hybrid (a real algebraic pre-filter followed by a final
      encrypt-and-compare on survivors) — the naive reading of "distinct"
      would also misclassify the definitional reference's own bundled
      encrypt-and-compare loop, so an unstated narrower sense of "distinct"
      is required and the amendment does not supply it. Element (d)'s
      two-axis rule was attacked with two new constructions and held: no
      verdict-level divergence was found, only a narrower disclosure-format
      gap for genuinely mixed-kind attacks (which count to report for which
      kind component). Element (b)/(c)'s distinguisher bridge was attacked
      and HELD against every reading tried, with RQ-AES-002 R7's own
      completion condition independently re-read from source and confirmed
      still satisfiable. BOTH VERDICTS ARE TRUE SIMULTANEOUSLY: the
      amendment closes the ambiguities it was built to close (validator
      byte-check plus red-team original-counterexample reapplication both
      confirm this), AND it leaves two new, narrower ambiguities of its own
      (red-team new-counterexample construction, which is the deeper duty
      its joint assignment required and the validator's supplementary,
      non-formal read did not attempt to duplicate).
    - >-
      ITEM 2 (RANK 2, PART A) — TASK-20260901-2166bd attempted to apply
      protocol-amendment-GOAL-AES-002-001's three specified BLK-1 edits
      (tools/validate_ledger.py `check_run`, docs/claims-and-verification.md,
      docs/evidence-and-reproducibility.md). Applying the specified edit
      DESYNCHRONIZES 112 baseline-suppressed pre-existing
      tools/validate_ledger.py errors from tools/validate_ledger_baseline.txt's
      TEXT-based grandfathering, because the widened certificate-kind
      vocabulary changes the literal error-message string every
      already-baselined non-conforming certificate.kind value matches on —
      a genuine STOP CONDITION under the task's own literal test (before !=
      after error set), independently reproduced BYTE-IDENTICAL by the
      validator in an isolated, detached git worktree that never touched the
      shared tree (116 new errors both times, set-equality confirmed). The
      executor reverted all three files, confirmed byte-identical to
      pre-task HEAD by two independent methods (hash comparison and live
      re-run), and the validator independently re-confirmed the revert.
      BLK-1 (RQ-AES-002) THEREFORE REMAINS OPEN. Per AGENTS.md rule 5, this
      is INFRASTRUCTURE SIGNAL about the campaign's own baseline mechanism —
      never a negative mathematical result and never evidence about AES at
      any round count.
    - >-
      ITEM 3 (RANK 2, PART B) — F1 REPAIR. CORR-20260901-d9b7bc.yaml
      corrects envelope-receipt.json's item vi 14-core decimal ceiling field
      from the arithmetically wrong 488,600,000,000 to 247,770,709.76
      (11061.1924 × 1600 × 14), matching the receipt's own correctly-derived
      log2 figure (27.884) to stated precision. This value is now
      INDEPENDENTLY RE-VERIFIED THREE TIMES: originally by the correcting
      executor (TASK-20260901-2166bd, this session's own fresh
      recomputation, matching VAL-20260831-9fc65d's BATCH-2b0fd1 finding F1
      exactly); again by this batch's independent validator
      (VAL-20260901-4c225b, a fresh python3 recomputation, though disclosed
      honestly as NOT a genuinely blind re-derivation in the review_plan's
      strict sense — the task's own required background reading included
      the answer, `blind_from_respected: false`, F-VAL4c225b-2); and again
      by this batch's independent red team (RT-20260901-1af5d9, an
      independent hand recomputation as part of its own proof-architecture
      check). All three obtain 247,770,709.76 exactly. The original
      envelope-receipt.json remains byte-identical and unedited.
    - >-
      ITEM 4 — F2 RECONCILIATION. TASK-20260810-1a81be's stamp-duty overrun
      (742 s observed against a 200 s declaration) is recorded under the
      adopted C5 `on_record_not_charged` mechanism in
      F2-reconciliation.yaml, discharged directly in this batch's own
      opening act (TASK-20260901-a666e6) per DEC-20260810-6c00b4's
      next_actions item (4). The charged figure (742 s) and the two
      preserved, not-charged figures (200 s declared; 480 s intermediate)
      are all retained per C5's no-silent-resolution rule. This has no
      effect on any campaign budget stop condition, since GOAL-AES-002's
      campaign_budget is unbounded (BUDGET-AMEND-20260828-16e34c).
    - >-
      ITEM 5 — C2 PAIRED HEURISTIC-VALIDATION DESIGN. TASK-20260901-354ef5
      produced a fully specified, NOT-executed, NOT-approved experiment
      design for candidate C2 (a paired-independent-key data-path
      Hamming-distance histogram at the full round count, against a
      Binomial(128,1/2) null, with a matched structural null-key-schedule
      control, a deterministic sensitivity anchor, and a round-count decay
      check). BOTH INDEPENDENT REVIEWERS CONFIRMED ZERO COMPUTE (directory
      listing plus full-text re-read of both artifacts by each; no
      benchmark output, timing figure, or sampled statistic present
      anywhere). The validator found the design MEETS the
      heuristic-validation-experiment standard on every axis it checked:
      full schema compliance against templates/research-records.md's
      `experiment` fields, a genuine preregistered prediction (CH-1) stated
      at honestly reduced confidence citing an independently-verified,
      correctly-scoped prior finding (H-AES-77230c), real discriminating
      arms plus a concrete positive control (ARM-ANCHOR) and an
      implementation-correctness gate (GATE-ROUND0), a computable
      round-count decay invalidation rule, and an honest
      not-yet-approved/not-yet-executed declaration. THE RED TEAM,
      ATTACKING THE SAME DESIGN ADVERSARIALLY, FOUND TWO REAL DEFECTS the
      validator's schema/presence check did not surface: (i) a LOAD-BEARING
      INTERNAL CONTRADICTION (MEDIUM_HIGH severity) — the design's own
      `seed_policy` block is arm-indexed (`SEED(key_size, arm, tier)`,
      "used ONLY for that... combination's key draws; no seed is shared or
      reused across combinations"), meaning ARM-REAL and ARM-NULL draw K, K'
      from DIFFERENT independent random streams as literally specified —
      directly contradicting `arms.ARM-NULL`'s own explicit factual claim
      that state_0 is "BYTE-IDENTICAL, sample for sample" across arms; a
      future executor following `seed_policy` literally would run a
      DIFFERENT experiment than the one design-report.md describes, with no
      signal in either file that this happened, undermining the design's
      central confound-control logic as literally specified; and (ii) a
      DECAY-CHECK LABELLING GAP (MEDIUM severity) — the named "round-count
      decay check" (`invalidation_rules` item 1) is, as literally worded, a
      round-to-round JUMP/re-emergence detector, not a convergence detector
      (a FLAT, persistently-elevated, never-increasing TVD series passes it
      cleanly, despite manifestly failing to decay); the overall
      `falsification_criterion`'s three-outcome enumeration mostly
      compensates for this via the differential real/null comparison, but
      one specific failure mode — a flat, non-jumping excess in ARM-NULL
      ALONE while ARM-REAL converges normally — is not clearly routed to any
      of the three named outcomes, even though `invalidation_rules` item 4's
      own prose clearly intends to catch it. Both defects are named with a
      concrete, cheap, textual repair action that does not require
      re-deriving the design's budget or statistical machinery.
    - >-
      ARCHIVE RECEIPTS. The validator independently verified all three named
      archive receipts of this batch (TASK-20260901-420f4b,
      TASK-20260901-a5374b, TASK-20260901-d10bc6) against live git: exact
      parent, exact declared diff, every non-self hash recomputed and
      matched, every declared record_id present in the commit message.
      TASK-20260901-420f4b and TASK-20260901-a5374b are PASS, fully clean.
      TASK-20260901-d10bc6 is PASS_WITH_LIMITATIONS: all 22 genuinely
      committed files' content is independently confirmed correct against
      the true historical commit (6223df070), but the archive's own
      MACHINE-CHECKED declared scope (inherited from TASK-20260901-a666e6's
      own under-declared `artifact_paths`) hash-pins only 3 of the 22 files
      actually committed together — NOT the 9 task cards, 10 handoffs, or
      dispatch_queue.json itself, including this reviewing task's own card
      and handoff. This is a genuine finding (F-VAL4c225b-1, MEDIUM
      severity), distinct from and NOT invalidating the content-integrity
      verification itself (which both reviewers performed by direct
      historical-commit hash recomputation, independent of the narrower
      archive binding): those 20 files are genuinely committed and their
      bytes are confirmed correct, but they are not individually
      hash-bound by any archive receipt this dispatcher machine-checks.
    - >-
      CROSS-MODEL INDEPENDENCE REMAINS UNAVAILABLE. Both independent reports
      self-report resolved_model_id claude-sonnet-5 and both explicitly
      disclose supplying SESSION independence only, under standing
      inference-amendment/basis 0137a051: this validation verdict and this
      red-team verdict are ONE DRAW FROM A CORRELATED PAIR, not two
      independent draws. No attestation of independent multi-model
      agreement is recorded anywhere in this batch's package or in this
      record.

  inference: >-
    THIS BATCH ESTABLISHES NO CRYPTANALYTIC MEASUREMENT AND NO COST CLAIM,
    AND ASSERTS NOTHING ABOUT AES AT ANY ROUND COUNT. What it establishes
    is: (1) a superseding CM-1 amendment that CLOSES the four ambiguities it
    was built to close (confirmed by both independent reviewers against the
    ORIGINAL counterexamples) but LEAVES TWO NEW, NARROWER, MEDIUM-severity
    reading gaps of its own (confirmed by the red team's own new
    counterexamples) — both findings are true and are recorded together,
    not merged into a single verdict; (2) a genuine, twice-independently-
    reproduced STOP CONDITION in BLK-1's specified edit application, cleanly
    reverted, leaving BLK-1 open as infrastructure signal, never negative
    evidence; (3) a plain arithmetic correction to a campaign instrument
    (envelope-receipt.json's F1 field), now independently re-derived
    correct three separate times; (4) a discharged budget-accounting
    reconciliation with no effect on any campaign stop condition; and (5) a
    fully specified, zero-compute, NOT-approved C2 experiment design that
    meets the heuristic-validation-experiment standard on every axis the
    validator checked but carries one load-bearing internal contradiction
    and one decay-check labelling gap the red team's adversarial attack
    surfaced — both requiring repair before this design could be dispatched.
    Both independent reviewers reached PASS_WITH_LIMITATIONS-equivalent
    dispositions, scoped explicitly to this batch's own protocol-repair,
    infrastructure, arithmetic, and design-review purposes, with no security
    claim, no margin stated, and no comparison against the published state
    of the art in either direction. NEITHER REVIEW AUTHORIZES DISPATCH OF
    ANY CRYPTANALYTIC CARD OR OF THE C2 MEASUREMENT.

  boundaries:
    - >-
      SCOPED STRICTLY to full-round AES-128/192/256 (10/12/14 rounds) under
      RQ-AES-002; no round-count claim of any kind is made anywhere in this
      batch, and none is asserted here.
    - >-
      SCOPED to this batch's own committed artifacts and this environment's
      resource envelope; no cryptanalytic dispatch, cost claim, or
      distinguisher/key-recovery claim is present anywhere in this record.
    - >-
      NO CRYPTANALYTIC CARD MAY BE DISPATCHED under this goal until (i) a
      further superseding amendment resolves the two new, narrower reading
      gaps this batch's own amendment leaves (element (a) Route 3's
      T-table/"independent" gap; elements (c)/(f)'s guess-and-determine
      hybrid gap), and (ii) BLK-1 is resolved by a genuinely different fix
      approach than the one just confirmed to break baseline coverage.
      Neither condition is met by this record.
    - >-
      C2's DESIGN IS NOT APPROVED FOR DISPATCH. Its `seed_policy` must be
      corrected (or its ARM-NULL "byte-identical, sample for sample" claim
      corrected/removed) and its decay-check invalidation rule extended
      before any future Coordinator approval could rely on it as specified.
    - >-
      TASK-20260901-d10bc6's archive scope under-hash-binds 20 of the 22
      genuinely committed batch-opening files (F-VAL4c225b-1). Their content
      is independently confirmed correct against the true historical git
