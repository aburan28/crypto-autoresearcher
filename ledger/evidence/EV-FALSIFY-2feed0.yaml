evidence:
  id: EV-FALSIFY-2feed0
  hypothesis_id: null
  hypothesis_id_note: >-
    A corpus-integrity finding about how repairs are linked. It bears on no
    mathematical hypothesis and must not be cited for or against one. Filed under
    RQ-FALSIFY-a2c501 SQ-5.
  question_id: RQ-FALSIFY-a2c501
  experiment_ids: [EXP-FALSIFY-d770c1]
  run_ids: []
  run_ids_note: >-
    Static sweep over committed files; the method is the archived script in
    proof_refs and re-running it is cheaper than reading a manifest.
  findings_under_test: [KN-FIND-9d2f56, KN-FIND-012, KN-FIND-c7d31e]
  type: analytical
  direction: inconclusive
  direction_note: >-
    Neither supports nor contradicts any finding's content. It reports a
    structural defect in how repairs are recorded.
  strength: strong
  claim_tier: not_applicable
  claim_tier_note: Non-mathematical.
  proof_status: certificate
  proof_status_basis: >-
    A decidable property of committed files, checked exhaustively over all 58
    findings.
  proof_refs:
    - experiments/EXP-FALSIFY-d770c1/falsify/check_currency.py
  recorded_at: '2026-08-08'

  observations:
    - id: O-1
      text: >-
        A FOURTH CURRENCY MECHANISM, not covered by the three in
        EV-FALSIFY-f367ec. A finding can be repaired by ANOTHER FINDING rather
        than by a record in ledger/corrections/. KN-FIND-ff4a46 is titled
        "Wording repair for KN-FIND-9d2f56"; it names 9d2f56 eight times.
        KN-FIND-9d2f56 names ff4a46 ZERO times.
    - id: O-2
      text: >-
        THE LINK IS ONE-DIRECTIONAL IN EVERY INSTANCE. Sweeping all 58 findings
        for a record that declares in its title or front matter that it repairs,
        corrects, supersedes, amends, revises or aligns another finding returns 7
        relationships. The target links back in 0 of 7:
        013 -> 012, 014 -> 012, 024 -> 026, 031 -> 012, ac28ed -> c7d31e,
        c7d31e -> 2a8b7e, ff4a46 -> 9d2f56.
        A reader arriving at any of these targets sees no indication that a
        repair exists.
    - id: O-3
      text: >-
        THE WORST CASE IS KN-FIND-012, targeted by THREE separate repairs --
        013, 014 and 031 -- and referencing none of them. It also carries three
        records in ledger/corrections/. Six documents amend it and the record
        itself points at zero.
    - id: O-4
      text: >-
        THIS PROGRAM WALKED INTO IT. KN-FIND-ac28ed repairs KN-FIND-c7d31e and
        c7d31e does not link back. F-2 (EV-FALSIFY-2a5e46) probed c7d31e without
        having read ac28ed, which was only encountered later as an F-10a target.
        The consequence is a MISSING CROSS-REFERENCE, not a wrong claim: ac28ed
        corrects the K* table cells and downgrades the "provable" label on the
        beta transfer to the linear-algebra cost model, which is a different
        matter from the verification-table estimand mismatch F-2 reports, and
        ac28ed states explicitly that it makes "no claim that the BKK speedup
        theorem is invalidated". EV-FALSIFY-2a5e46 stands as written; it should
        cite ac28ed as adjacent prior work on the same record and does not.
    - id: O-5
      text: >-
        WHY THE ASYMMETRY MATTERS MORE THAN IT LOOKS. Under AGENTS.md rule 4
        corrections supersede rather than overwrite, so the corpus is READ
        forward from an old record to its repairs. If the old record carries no
        pointer, that read is impossible without a repository-wide search, and
        the immutability rule that makes the corpus trustworthy is exactly what
        guarantees the stale record stays in place to be found first. The defect
        is not that repairs exist; it is that they are invisible from the side a
        reader starts on.

  interpretation: >-
    Repairs filed as sibling findings are a real and unlinked fourth currency
    mechanism. Combined with the three in EV-FALSIFY-f367ec, a reader or agent
    checking any single mechanism can conclude a record is current when four
    separate kinds of amendment may exist. check_currency.py now covers all four.

  what_this_does_not_establish: >-
    No claim that any of the seven repaired records is WRONG as it stands; the
    repairs may be presentational, as ff4a46's title suggests. No claim that any
    agent was actually misled, beyond this program's own instance in O-4, which
    cost a cross-reference rather than a conclusion. The sweep keys on repair
    language in the first 1200 characters, so a repair announced only in a
    record's body is invisible to it and 7 is a floor.

  dominated_by: not_applicable_methodological
  sota_delta:
    time_exponent: not_applicable
    note: No algorithmic claim.

  proposed_correction: >-
    Either (a) add a `repaired_by` / `see_also` field to the seven targets --
    which is a metadata addition, not a content edit, though under rule 4 the
    Coordinator should decide whether it counts as an edit at all, or (b) require
    that a repair be filed in ledger/corrections/ where the existing check
    already looks, or (c) generate a back-link index at build time so the
    immutable records need not change. Option (c) preserves immutability
    strictly and is the cheapest. Coordinator authority.

  knowledge_promotion: not_warranted
  knowledge_promotion_reason: >-
    A filing defect, not knowledge. KN-FIND-030 is the precedent for promoting a
    harness defect and it earned that by having already destroyed identifiers
    twice; this has cost one missing cross-reference.

  scope_limits: >-
    knowledge/findings/*.md as committed at this branch head, repair language
    matched in the first 1200 characters of each record.

  independent_review_required: false
  independent_review_note: >-
    Asserts no mathematics; a decidable property of committed files,
    re-checkable in seconds.

  authority_note: >-
    Evidence only. No record edited, no back-link added, no finding superseded;
    every option in proposed_correction is the Coordinator's (AGENTS.md rule 1).
