evidence:
  id: EV-MLKEM-d8f627
  goal_id: GOAL-MLKEM-004
  batch_id: BATCH-68471b
  batch_number: 3
  producer_task: TASK-20260804-52cc2b
  snapshot_commit: a54fe74d94e796d4cb8d1d5fe90a48a768425e78
  validator_task: TASK-20260804-53e77f
  red_team_task: TASK-20260804-1bb63d

  type: empirical
  claim_tier: toy_scale
  states_a_finding: false
  compared_against_assumed_law: false

  # Schema slots filled under DEC-20260805-7b3e91 (RUL-4). Every value below is the
  # weakest in its vocabulary and is forced by this record's own committed text;
  # any stronger value would be a new claim requiring a superseding record.
  hypothesis_id: null
  hypothesis_note: >-
    This record names no ledger hypothesis id, and its scope_statements say "No
    finding stated", "No ML-KEM security claim in either direction" and "A
    significant chi-squared test is not an attack and not a break". Choosing a
    ledger hypothesis here would assert a target the record did not choose.
  run_ids: []
  run_ids_note: >-
    No ledger-registered RUN-* record exists for this measurement. The 150
    bgj1_sieve runs were performed under the goal's coordination batch directory
    for BATCH-68471b and are identified by the producer_task, validator_task and
    red_team_task ids recorded above, and by the artifact paths in proof_refs
    below. The empty list states that no RUN-* record backs this evidence; it does
    NOT state that no work was done. Reported as an evidence-integrity gap in
    DEC-20260805-7b3e91 FINDING-3.
  direction: neutral
  strength: inconclusive
  direction_and_strength_basis: >-
    The record's own admissibility block sets
    `admissible_as_independence_test_conclusion: false` and states "The variance
    inflation (ratio=1.39, p=0.001) cannot be distinguished from a QEMU emulation
    artifact without a native x86_64 control run", with a second blocking
    objection that three outliers drive p from 0.034 to 0.001. neutral and
    inconclusive are the schema's words for a measurement that discriminates
    nothing about the question it was run to answer; the statistical result is
    separately recorded as genuine WITHIN the QEMU environment under
    what_is_not_blocked, and that scoping is unchanged.
  proof_status: empirical_only

  what_was_measured: >-
    150 independent bgj1_sieve runs on the same LWE instance (m=35, n=25, q=127,
    instance_seed=20260803001, fpylll_seed=20260803005) with randomly chosen g6k
    Siever seeds (numpy.random.default_rng(20260804001).integers(0,2**32,size=150)).
    Platform: Docker linux/amd64 via QEMU on macOS ARM64 host
    (Linux-6.12.76-linuxkit-x86_64, glibc-2.41). Within-environment single-score
    variance computed from run-0 sieve vectors (not batch-1 data).

  key_results:
    n_runs_completed: 150
    empirical_var_TN_ddof1: 8492.309645148742
    within_env_single_score_var: 0.3405690866420119
    run0_N_vectors: 17919
    independence_predicted_var: 6102.657463538211
    variance_ratio: 1.3916
    chi2_stat: 207.3448
    chi2_df: 149
    p_value: 0.001123
    ci_95_ratio: [1.1227, 1.7707]
    T_N_mean: 7551.1
    mean_score_shortfall_vs_batch1: -107.1

  admissibility:
    validator_verdict: accept
    red_team_verdict: blocking_objections
    admissible_as_raw_observation: true
    admissible_as_independence_test_conclusion: false
    reason: >-
      OBJ-QEMU (blocking): QEMU emulation on ARM64 demonstrably shifts the sieve
      distribution by -107 T_N units (confirmed across batches 2 and 3). The
      variance inflation (ratio=1.39, p=0.001) cannot be distinguished from a
      QEMU emulation artifact without a native x86_64 control run. OBJ-OUTLIER
      (blocking): 3 runs with z≈2.60 drive p from 0.034 to 0.001; after removing
      them ratio drops to 1.2235 (p=0.034). Their validity in QEMU vs native is
      unverified.

  what_is_not_blocked:
    - >-
      The statistical result is genuine within the QEMU environment: chi2(149)=207.3,
      p=0.001, 95% CI [1.12, 1.77] — all validated by independent arithmetic
      re-derivation (Validator CHK-2, Red Team independent verification).
    - >-
      Normal distribution of T_N values confirmed (Shapiro-Wilk W=0.9907, p=0.43).
    - >-
      N=17,919 constant across all 150 runs.
    - >-
      150 distinct seeds, no correlation with run index (Spearman p=0.306).

  blocking_constraints_for_batch_4:
    - >-
      B4-1 (decisive, ~10 min): Run the 3 outlier seeds (2941775225, 26883012,
      2418421570) plus run-0 seed natively on real Linux x86_64 hardware (not QEMU).
      Compare T_N values and within-run Var[s_i]. If ratio persists natively,
      signal is genuine. If ratio drops near 1.0 or T_N values are systematically
      different, QEMU emulation is confirmed as the source.
    - >-
      B4-2: Null control — compute T_N for a wrong secret (s* ≠ s) in the QEMU
      environment. T_N^null distribution under H0_null should have ratio ≈ 1.0.
      If ratio^null > 1, variance inflation is environmental, not specific to
      the correct-secret scores.
    - >-
      B4-3: Per-run within-env Var[s_i] — record variance of single scores for
      all 150 runs (not just run-0) and use the average as denominator.

  scope_statements:
    - Dimension 60, q=127, bgj1_sieve, Docker linux/amd64 QEMU only.
    - NOT crypto-scale evidence (AGENTS.md rule 7).
    - No finding stated. No comparison against MATZOV.Nf performed.
    - AGENTS.md rule 12 UNMET and UNWAIVED.
    - No ML-KEM security claim in either direction.
    - A significant chi-squared test is not an attack and not a break.

  proof_refs:
    - coordination/goals/GOAL-MLKEM-004/batches/BATCH-68471b/tasks/TASK-20260804-52cc2b/variance_results.json
    - coordination/goals/GOAL-MLKEM-004/batches/BATCH-68471b/tasks/TASK-20260804-53e77f/validation_report.yaml
    - coordination/goals/GOAL-MLKEM-004/batches/BATCH-68471b/tasks/TASK-20260804-1bb63d/red_team_report.yaml

  certificate_refs:
    - coordination/goals/GOAL-MLKEM-004/batches/BATCH-68471b/archives/TASK-20260804-acb3aa/snapshot_receipt.json

  created_at: '2026-08-04'
  created_by: coordinator
