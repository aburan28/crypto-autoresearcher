evidence:
  id: EV-PEC-7d8de9
  hypothesis_id: H-P13-001
  experiment_ids: [EXP-HEUR-d640d9, EXP-PEC-d7979c]
  run_ids: [RUN-HEUR-d640d9-a, RUN-PEC-d7979c-b]
  area_code_note: >-
    THE `PEC` AREA CODE IS A CARD ARTIFACT AND IS NOT RENAMED. This record spans
    BOTH BATCH-004 producer packages - EXP-HEUR-d640d9 (Heuristic 1 controls) and
    EXP-PEC-d7979c (c-programme closeout) - but the identifier EV-PEC-7d8de9 was
    allocated in TASK-20260802-375cd8's declared write_scope and artifact_paths
    before the batch's shape was known. AGENTS.md rule 15 is dispositive: the id
    appears in a task card's binding fields, so remapping it would break that
    binding permanently. The area code carries no meaning here beyond provenance;
    the experiment_ids above are authoritative.
  supersedes_analysis_of: null
  supersession_note: >-
    THIS RECORD SUPERSEDES NOTHING. EV-PEC-2e67ff and EV-PEC-857664 are untouched
    and their analyses stand. This is a new evidence record for two new runs. Where
    it bears on an earlier record it does so by ADDING a scoped correction that is
    named in `corrections_to_this_programmes_own_record`, never by replacing an
    adjudication.

  type: empirical
  direction: neutral
  direction_binding: >-
    `neutral` is bound precisely, and in both directions, because the alternative
    readings are both available and both wrong.
    NEUTRAL WITH RESPECT TO H-P13-001. Nothing in BATCH-004 supports Heuristic 1,
    P0, any margin row, the attack, Theorem 1.1, or the p^{1/3+o(1)} exponent, and
    nothing in it refutes any of them. Both independent reviewers state this
    separately and without qualification (VAL-20260803-cd08cd
    what_a_passed_verdict_here_does_not_mean; RT-20260802-44c6a2
    narrowest_supported_statement). The contract's own SP-H binds symmetrically:
    a non-rejection is not support and a rejection of an instrument is not a
    refutation of an object.
    NOT NEUTRAL ABOUT THIS PROGRAMME'S INSTRUMENTS, where it is ADVERSE. Three of
    the four pre-registered Heuristic 1 statistics measured the instrument rather
    than the object (OBS-1, OBS-2, OBS-4 below), and one bibliographic
    STATED_ABSENCE on which a lane was CLOSED is false (OBS-7). Instruments are not
    the hypothesis, so those findings do not move `direction`; they are the
    record's substantive content and they are recorded as such rather than
    absorbed into a neutral verdict.
    WHAT DOES NOT MOVE, EXPLICITLY: concrete_threat_nist1 stays INCONCLUSIVE
    (SP-4/SP-6 bind and both reviewers concur); FC-4 STANDS, unchanged in
    disposition; no position in H-P13-001 changes state.

  strength: inconclusive
  strength_justification: >-
    `inconclusive` is the honest word and is NOT a statement that the packages are
    inadmissible. The Validator's terminal verdicts are PKG-HEUR passed, PKG-PEC
    passed, PKG-BIB incomplete, PKG-INFRA passed-with-correction-required; every
    headline statistic in both run packages was recomputed BIT-IDENTICALLY from the
    committed raw data by independent Validator code, both frozen contracts are
    byte-unchanged since dfe285d4, and both snapshot commits' declared path sets
    equal their commits' changed sets with zero hash mismatches. The evidence is
    admissible. It simply cannot discriminate.
    WHY IT CANNOT. Of the four pre-registered Heuristic 1 statistics: S2 is VOID
    and its rejection condition provably had NO POWER (OBS-1); S1's
    SAMPLER-REJECTED verdict is a reference-measure error rather than a mixing
    result (OBS-2); S3 is READING-DEPENDENT with both models rejected and the
    preference reproduced on an object with no arithmetic content (OBS-3); S4 is
    INCONCLUSIVE because its rarity regimes are unreachable at every prime the
    contract declares (OBS-4). The one solid result is an INSTRUMENT result
    (OBS-5).
    WHY NOT `replicated`. RUN-PEC-d7979c-a and RUN-PEC-d7979c-b are bit-identical
    at all 216 primary and all 216 null sample cells and at every headline verdict
    (OBS-8). That is a determinism demonstration of a deterministic
    counted-operation pipeline, not independent replication of an inference - the
    same distinction EV-PEC-857664 drew for C-REPRO - and the second execution was
    additionally NOT BLIND, because a completed computation of the same quantities
    already existed on disk. Recorded as a determinism fact and never as
    replication.
    WHY NOT `contradictory`. Nothing here contradicts a committed evidence record.
    The corrections it carries are to this programme's own prose and to two frozen
    contracts' estimator designs, not to a measurement.

  claim_tier: toy
  claim_tier_derivation: >-
    MECHANICAL, AND DELIBERATELY THE MINIMUM. Per docs/claims-and-verification.md a
    synthesis spanning several experiments takes the MINIMUM tier of its supporting
    evidence unless a dedicated scaling analysis justifies otherwise, and none
    does.
    PKG-HEUR: the largest completely enumerated prime is p = 1999, so the maximum
    field bit size is 2 * 11 = 22 <= 32. Tier `toy`. The frozen contract declares
    `toy` even for the optional sampled arm that the mechanical rule would call
    `medium`, and the Validator confirms the binding (HV-4).
    PKG-PEC: its own parameters would give `medium` (p = 1099511627563, 80-bit
    F_{p^2}), and the alpha machinery carries a `toy` ceiling anyway from its 20-
    and 30-bit C-PSCALE arms. This record takes the minimum, so `toy` governs it.
    WHAT THIS DOES AND DOES NOT DO. It does NOT demote EV-PEC-857664, which stands
    at `medium` for the per-entry-cost calibration on its own runs and is not
    restated here. It DOES mean no statement in this record may be cited above
    `toy`. AGENTS.md rule 7 applies in full: a nine-atom delta_E distribution at
    p <= 2000 is never cryptographic-scale validation, and neither is an
    80-bit-field measurement over ell <= 211.
  certificate_refs: []
  certificate_note: >-
    Both runs declare result.certificate.kind = none with a stated reason. Neither
    claims a discrete-log solve nor a factor-base relation, so there is nothing to
    certify in the sense of docs/claims-and-verification.md. The independent
    verification artifacts are CONTROLS, not solve certificates: IF-1 ties the
    quaternion-side type-set enumeration to a brute-force count of supersingular
    j-invariants which the Validator independently re-derived at p = 11, 13, 17,
    19, 23, 101; IF-2 checks 13834 minima by two routes plus 287 exhaustive box
    searches; C-ALT.1/C-ALT.2/C-IMMUT/C-INSTR cover the closeout instrument.

  proof_status: derivation
  proof_status_justification: >-
    This record carries adverse sub-calls about two frozen contracts' estimators
    and about one bibliographic claim. Per docs/claims-and-verification.md
    ("Refutation artifacts") the strongest checkable artifact each admits was
    sought BEFORE the call that relies on it. None is a machine-verified proof, so
    the record is labelled `derivation` and never "proved". Per sub-call:
    (i) S2 HAS NO POWER - DERIVATION plus a committed instance. The derivation is
    an exact identity, reached independently by both reviewers by different
    arithmetic. Red Team form: for n the sample's own realised delta_E,
    E[1{n even} - floor(n/2)/n] = (1/2)(P(even) - P(odd)) + E[1{odd}/(2n)], whose
    second term is strictly positive for any distribution with mass on small odd
    values. Validator form: for n uniform on [1, X], E[1{n even}] - E[floor(n/2)/n]
    is strictly positive, tabulated at +0.2500 (X=2), +0.0556 (X=3), +0.0533 (X=5),
    +0.0483 (X=7), +0.0437 (X=9). THE COMMITTED INSTANCE IS THE RUN'S OWN: NULL-B
    under READING_NEW_SIZE - a bona fide uniform random integer pushed through the
    identical estimator - returns z_2 in [16.818982749412662, 19.52013770787415] in
    200 of 200 replications. That number is in the committed raw-result.json at
    11b086d9, not in a reviewer's scratch.
    (ii) S1 IS A REFERENCE-MEASURE ERROR - DERIVATION plus a committed saturation
    identity. The derivation: a non-backtracking walk in the ell-ideal graph
    equilibrates to uniform over IDEAL CLASSES, i.e. over supersingular
    j-invariants, whose pushforward to conjugacy-class types is W-CURVE (weight 1
    for a Galois-stable class, 2 otherwise), not W-TYPE. The committed identity:
    the run's S1a Fisher statistic 5305.213651378483 equals 2 * 288 * ln(10001) =
    5305.2136513784735, so the statistic is a re-encoding of the rejection count
    288 with every rejecting prime pinned at the Monte-Carlo floor 1/10001 - the
    "flat across three walk lengths" reading is CENSORED, not informative.
    (iii) THE SUTHERLAND STATED_ABSENCE IS FALSE - DOCUMENTARY COUNTEREXAMPLE, the
    strongest artifact this sub-call admits. The Validator re-fetched
    https://ar5iv.labs.arxiv.org/html/1202.3985 in its own session and quotes the
    contradicting sentence verbatim. A stated absence is a positive claim about a
    source, and a verbatim quotation from that source refutes it directly. It is
    documentary rather than mathematical and is labelled as such.
    (iv) FC-4 STANDS - not an adverse call at all. It is the frozen conjunction
    applied as written, with clauses (b) and (d) each failing independently and
    every value recomputed bit-identically by the Validator.
  proof_refs:
    - coordination/goals/GOAL-P13-001/batches/BATCH-004/reviews/TASK-20260802-cd08cd/validation_report.yaml
    - coordination/goals/GOAL-P13-001/batches/BATCH-004/reviews/TASK-20260802-44c6a2/red_team_report.yaml
    - experiments/EXP-HEUR-d640d9/runs/RUN-HEUR-d640d9-a/raw-result.json
    - experiments/EXP-HEUR-d640d9/runs/RUN-HEUR-d640d9-a/execution_report.yaml
    - experiments/EXP-HEUR-d640d9/specification.yaml
    - experiments/EXP-HEUR-d640d9/implementation/heuristic_tail.py
    - experiments/EXP-PEC-d7979c/runs/RUN-PEC-d7979c-b/raw-result.json
    - experiments/EXP-PEC-d7979c/runs/RUN-PEC-d7979c-b/execution_report.yaml
    - experiments/EXP-PEC-d7979c/specification.yaml
    - coordination/goals/GOAL-P13-001/batches/BATCH-004/tasks/TASK-20260802-79a3cd/baseline_constant_report.yaml
  archival_order_caveat: >-
    STATED PLAINLY BECAUSE IT IS A DEFECT OF THIS ARCHIVE, NOT A FOOTNOTE.
    docs/claims-and-verification.md requires a refutation artifact to be archived
    BEFORE the decision that relies on it. The first two proof_refs - the two
    BATCH-004 review reports, which carry the derivations for sub-calls (i), (ii)
    and (iii) - ARE NOT IN THE DECLARED PATH SET of TASK-20260802-375cd8, and no
    other task in the BATCH-004 dispatch queue declares them. Every other proof_ref
    is committed: the run packages at 11b086d9 and 64238edc, the frozen contracts
    at dfe285d4, the bibliographic report at 64238edc.
    CONSEQUENCE, NOT MINIMISED: until the two review reports are committed, the
    arguments this record rests on exist only in a working tree, and a
    working-tree artifact is not durable evidence. The dispatching session must
    archive them - either by extending this ledger archive's declared path set
    before staging, or by a dedicated archival task - and the receipt must record
    which. This is a Coordinator task-card defect of the same family as REM-1's,
    and it is recorded here rather than worked around.

  # =====================================================================
  # OBSERVATIONS
  # =====================================================================
  observations:
    - id: OBS-1
      package: PKG-HEUR
      title: >-
        S2's parity statistic is self-referential; its pre-registered rejection
        condition had no power, and the VOID was compelled by the contract's own
        rule
      statement: >-
        The frozen contract computes q_i = floor(n_i / 2) / n_i with n_i the
        sample's OWN realised delta_E (implementation heuristic_tail.py, s2_core,
        `n = s["delta"]`) and asserts that this "removes the size effect exactly".
        It does not. The event {delta_E even} and the conditioning quantity n_i are
        THE SAME RANDOM VARIABLE, so the estimator is self-conditioned and its
        expectation under the model it claims to test is not zero.
        MEASURED VALUES, ALL RECOMPUTED BIT-IDENTICALLY BY THE VALIDATOR FROM THE
        COMMITTED RAW DATA: arithmetic z_2 = 8.645103378616307 (W-CURVE),
        8.173740018469834 (W-TYPE), 8.202003983752695 (W-MASS); NULL-A z_2 =
        8.735230131717895, same sign; C1, C2 and C3 all MET, C1 confirmed in exact
        rational arithmetic. The contract's per-statistic void rule reads "S2: if
        |z_2| > 3 with the same sign on NULL-A, the S2 signal is VOID"; 8.735 > 3
        with sign +1 against the pooled sign +1, so the rule fires, and
        heuristic_tail.py lines 2899-2903 implement exactly that and nothing else.
        No threshold was adjusted, no range restricted, no instrument repaired.
      two_independent_reviewers_reached_the_same_defect_by_different_arithmetic: >-
        THIS CONVERGENCE IS THE BATCH'S REAL FINDING AND IT IS RECORDED AS SUCH.
        VALIDATOR (V-B4-01): built data EXACTLY from the contract's own
        random-integer model M2 - delta ~ Uniform[1, X_p] with the actual per-prime
        X_p, arithmetic removed entirely - and obtained z_2 = 13.5494, 12.4753,
        13.1528 (W-CURVE) over three independent draws. Data with NO arithmetic
        content score HIGHER than the arithmetic object's 8.645.
        RED TEAM (RT4-H1): decomposed the arithmetic excess exactly in Fractions
        into a parity term of -0.09679849 and a self-conditioning offset term of
        +0.14831138, summing to +0.05151289 and matching the run's p_obs - p_null
        to eight decimals; 64.2 per cent of the offset comes from the delta_E = 1
        spike (weight share 0.1906), 23.2 per cent from delta_E = 3, 10.2 per cent
        from delta_E = 5.
        NEITHER REVIEWER SAW THE OTHER'S REPORT AS AN INPUT TO THIS FINDING. Both
        conclude the VOID is the right outcome and the mechanism reported for it is
        wrong.
      the_reported_sign_is_not_supported: >-
        The run reports a constant factor log2(p_obs / p_null) = +0.1972 bits.
        Against the contract's own EXOGENOUS size model M2 - a size scale not read
        off the sample - the same committed data give p_obs = 0.403202 against
        p_M2 = 0.459973, z = -9.2100 and log2 ratio = -0.1900 bits, OPPOSITE IN
        SIGN. Neither number is a property of maximal orders; they are two readings
        of an uncentred estimator, and the disagreement is the point.
      what_this_does_and_does_not_establish: >-
        ESTABLISHED: the pre-registered condition C1 AND C2 AND C3 could not have
        discriminated a parity bias from no parity bias. Voiding it was not merely
        permitted, it was COMPELLED.
        NOT ESTABLISHED, AND EXPLICITLY REFUSED: the shortfall of +8.645 below the
        artifact floor is NOT evidence of a parity DEFICIT in maximal orders. The
        estimator's bias depends on the size distribution and the arithmetic and
        synthetic arms have different size distributions, so the comparison is not
        controlled in that direction either.
        CONSEQUENCE FOR RT-H3: ell = 2 IS NOT CLOSED. It has not yet been measured.
        The refutation channel is NEITHER narrowed NOR opened by this run, and no
        record may describe the batch as having narrowed it - a test with no power
        narrows nothing.
      not_the_executors_fault: >-
        A CONTRACT-DESIGN DEFECT, NOT AN EXECUTION DEFECT, and the distinction is
        load-bearing. The Executor implemented the frozen formula verbatim, ran the
        pre-registered null, reported the void, attempted no repair, and DISCLOSED
        the NEW_SIZE reading that makes the defect visible (deviation D-3). The
        Validator verified in source that both arms call the identical function
        s2_core with the identical weight_of helper (lines 2784 and 2798) and the
        identical short-vector routine (lines 1199 and 1397). Responsibility for
        the estimator sits with the Coordinator who froze it.
      one_framing_criticism_recorded: >-
        The execution report's block `the_estimator_is_not_at_fault` cites only the
        KEEP_SIZE range [-1.888674481144594, +1.643493810649473] and concludes the
        statistic is "exactly calibrated by construction". That is true only in the
        trivial sense: KEEP_SIZE holds q_i at the original observed sizes and
        re-draws only parities, so it is calibrated BY CONSTRUCTION and CANNOT
        detect this bias. Nothing is hidden - the NEW_SIZE numbers are in the same
        document - but the framing selects the arm that exonerates the instrument.
      scope: >-
        299 completely enumerated primes 11 <= p <= 1999, 13834 conjugacy classes,
        delta_E support exactly {1,...,9}, this implementation, this contract.
    - id: OBS-2
      package: PKG-HEUR
      title: >-
        S1's SAMPLER-REJECTED verdict is a reference-measure error, not a mixing
        failure; RT-H2's experimental arm returns to UNRUN
      statement: >-
        The walk has mixed. It has mixed to the WRONG REFERENCE. S1a compares the
        walk-sampled delta_E distribution against the W-TYPE (uniform over
        conjugacy classes) exact CDF, while a non-backtracking walk in the
        ell-ideal graph equilibrates to uniform over IDEAL CLASSES - over
        supersingular j-invariants - whose pushforward to types is W-CURVE. The
        contract asserts W-TYPE is "the sampler's target measure"; that assertion
        is false for the walk the contract itself constructs.
      measured_signature: >-
        RED-TEAM RECOMPUTATION FROM THE COMMITTED raw-result.json AT 11b086d9
        (labelled RT-RECOMP; see limitation LIM-2). Mean total variation to W-TYPE
        by walk length: 0.13044 (1x), 0.12782 (3x), 0.12752 (10x) - converging to a
        NONZERO limit. Mean total variation to W-CURVE: 0.03485, 0.01102, 0.01055 -
        DECAYING to the sampling-noise floor of 0.00846 for N_walk = 20000 over
        nine atoms. That is the textbook signature of a chain that has mixed to a
        stationary measure different from the reference, and the exact opposite of
        an under-mixing signature. W-CURVE is the closer reference at 288 of 299
        primes at L = 10x - THE SAME 288 as the Holm rejection count.
      the_flatness_claim_is_censored_not_measured: >-
        The run's committed S1a Fisher statistic is 5305.213651378483 at all three
        lengths, and 2 * 288 * ln(10001) = 5305.2136513784735. Every one of the 288
        rejecting primes is pinned at the Monte-Carlo resolution floor 1/10001 and
        the other 11 contribute zero, so the Fisher statistic is a re-encoding of
        the count 288 and HAS NO RESOLUTION. "The rejection does not weaken as the
        walk lengthens" is therefore not measured by the quantity quoted for it.
        The run records the underlying float underflow (AN-5) but not the
        saturation, and the saturation is the part that matters.
      corroborated_inside_the_run_itself: >-
        The run's own PH5 records that the W-CURVE and W-TYPE Clopper-Pearson
        intervals for the even-fraction are DISJOINT ([0.39491191, 0.41153088]
        against [0.32831510, 0.34911313]). That is the same measure gap measured a
        second way, in the same run, and the run did not connect it to S1.
      consequences: >-
        (i) RT-H2's EXPERIMENTAL ARM RETURNS TO UNRUN. Its gap claim about the
        frozen paper survives only because the paper still does not state its
        sampler - that is a documentary observation about the paper, not a
        measurement.
        (ii) The correct scoped statement is STRONGER than the one recorded, and in
        a different direction: this walk's stationary distribution is not uniform
        over conjugacy classes and NO WALK LENGTH REPAIRS THAT. "At the tested
        lengths" wrongly suggests a longer walk might pass.
        (iii) S1c and S1d are confounded identically, and S1d is the statistic
        where the two measures differ most - the delta_E = 1 spike again.
        (iv) RT-H2's own hypothesised failure mode is REFUTED by its author: the
        predicted tilt was "toward orders with short ideals, exactly the regime that
        makes delta_E small"; the observed tilt goes the OTHER WAY (walk 0.1567
        against W-TYPE 0.2784 at delta_E = 1, p = 1999).
      vanishing_at_scale: >-
        The rejected quantity provably vanishes at cryptographic scale: mean
        TV(W-TYPE, W-CURVE) * sqrt(p) = 4.185 over the 135 completed primes with
        p > 1000, extrapolating to a measure gap of order 1e-37 at p = 5*2^248-1.
        Recorded because it bounds the finding's relevance in the honest direction:
        the defect is real in the instrument and irrelevant at the operating point.
    - id: OBS-3
      package: PKG-HEUR
      title: "S3 discriminates nothing; PH3 'MET' must not be read as support for M1"
      statement: >-
        Three of the run's own numbers point away from the reported preference and
        the Validator confirmed all three by independent recomputation. (i) The
        observed weighted log-likelihood ratio 14508.90743042935 (W-CURVE; the
        Validator reproduced it bit-identically, along with 11656.03354371127
        W-TYPE and 5664.929450877896 W-MASS) lies BELOW the M1-truth null range -
        reported [15682.01, 16164.30], Validator's own 40 draws [15718.16,
        16086.27]. The data prefer M1 by LESS than data generated from M1 do.
        (ii) By absolute fit M2 is about five times better (KS D 0.0610 against
        0.3165) and BOTH models are rejected at Monte-Carlo p = 1/10001.
        (iii) NULL-A's LLR is 16512.48 and selects the SAME model, so the preference
        is reproduced on an object with no arithmetic content.
      void_criterion_is_vacuous_under_one_reading: >-
        NULL-B2 (M2-truth) yields LLR = -infinity in EVERY replication - the
        Validator replicated 40 of 40 - because a replacement value drawn from
        [1, X_p] can carry a prime factor impossible for an integer <= n_i, sending
        ln f1 to -infinity. The span of the union of the two null distributions is
        therefore [-inf, ~16164] and ANY finite observed LLR lies inside it. Under
        the UNION_SPAN reading the S3 discrimination is VOID BY CONSTRUCTION,
        whatever the data. The run's verdict matrix gives that reading equal
        billing with the OR-of-ranges reading, which does carry information; the
        honest statement is that the frozen void criterion is unusable under one
        reading, not that the verdict is genuinely balanced.
      consequence: >-
        Falsification criterion (b) correctly does not fire. NO RECORD MAY PRESENT
        PH3 = MET AS EVIDENCE that the actual-size model describes delta_E.
    - id: OBS-4
      package: PKG-HEUR
      title: "S4's rarity regimes are unreachable at every prime the contract declares"
      statement: >-
        The Validator recomputed lambda_hat and D2* at B = 2, 3, 5, 7 under W-CURVE
        from the per-class representation counts: lambda_hat 1.2726020913120186,
        2.1034037609191447, 2.494642626619046, 2.878566203365033 with D2*
        0.9600283803769982, 1.0771505384440292, 1.082069581191472,
        1.0595636979248564, agreeing with the run to 1 ulp. The smallest attainable
        lambda_hat over the frozen B grid is 1.2726, more than four times the
        least-rare target 0.30, so all three rarity regimes are genuinely NOT
        REACHED and the monotonicity tail check is unobservable.
      it_is_a_design_defect_not_a_scope_shortfall: >-
        MEASURED RATHER THAN ASSUMED (RT-RECOMP, RT4-D1): fitting lambda_hat(B=2)
        per prime over all 299 completed primes gives lambda_hat = 3.7603 *
        p^(-0.1604) by log-log least squares, extrapolating to 0.8898 at the TIER-2
        ceiling p = 8000 and 0.7566 at the TIER-3 ceiling p = 22000, against a
        reachability requirement of lambda_hat <= 0.60 for the LEAST rare target.
        NO TIER EXTENSION INSIDE THIS CONTRACT REPAIRS S4. The extrapolation caveat
        is stated: an 11x extrapolation of a law fitted over a 180x range in p.
    - id: OBS-5
      package: PKG-HEUR
      title: "THE ONE SOLID RESULT: the enumeration instrument is sound and independently checked"
      statement: >-
        IF-1 through IF-5 all pass and the Validator re-derived the load-bearing one
        itself. The identity n_types = (#SS + #{delta_E = 1}) / 2 holds at all 299
        primes with 0 violations; the closed form floor(p/12) + eps_p agrees with
        the recorded brute-force count at all 42 TIER-0 primes; and the Validator
        implemented its OWN brute-force supersingular-j count in F_{p^2} by the
        Hasse-invariant criterion in exact arithmetic, obtaining #SS = 2, 1, 2, 2,
        3, 9 at p = 11, 13, 17, 19, 23, 101 and matching the run at every one.
        IF-2 records 13834 two-route minimum checks and 287 exhaustive box searches
        with 0 disagreements; IF-3 agrees at all 52 primes where both routes ran;
        IF-4 verifies 41502 pairs with explicit conjugating quaternions; IF-5 shows
        no delta_E exceeds X_p. D-1's tier exclusion leaked nothing: 299 primes
        completed exactly equal the tier rule's set, max prime 1999, zero
        per_prime_records above p = 2000, and the strings "TIER-2"/"TIER-3" appear
        zero times in raw-result.json.
      what_it_is_worth: >-
        A REAL AND REUSABLE INSTRUMENT RESULT, and the Red Team says so explicitly
        despite attacking everything else in the package. IT IS NOT A RESULT ABOUT
        HEURISTIC 1. The Deuring correspondence is checked rather than inherited,
        which is stronger than the exemplar profile requires - and it validates the
        measuring apparatus, not the object measured.
    - id: OBS-6
      package: PKG-PEC
      title: "FC-4 STANDS, doubly, by measurement on the pre-registered grid"
      statement: >-
        NC2d-PROPER re-measured C-PSCALE at the SAME three primes at
        ell in {47, 101, 151, 211} - ABOVE the Karatsuba threshold, chosen so the
        ell in {3,5} artifact RT3-C3 identified could not drive it - and the frozen
        five-clause conjunction returns the permitted word STANDS. TWO CLAUSES FAIL
        INDEPENDENTLY AND EITHER ALONE SUFFICES.
        CLAUSE (b) FAILS: PRIMARY-A's per-ell reading reaches 1.1503204217789973,
        exceeding the band ceiling 1.15 by 0.0003204217789973, so it is OVERLAPPING
        rather than CONTAINED, and the contract requires containment "under BOTH
        readings". Recorded so no reader mistakes it for decisive: the miss is
        0.032 per cent of the band edge. SYMMETRICALLY, it must not be presented as
        "essentially contained" - the frozen rule is a containment test applied as
        written and only three words are available.
        CLAUSE (d) FAILS ROBUSTLY: alpha_hat(ell) carries a residual trend whose
        interval excludes zero on both primary arms - PRIMARY-A slope
