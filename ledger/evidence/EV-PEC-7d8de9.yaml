        What improves is the SIGN - the low end rises from 8.35 to 10.10 or 14.35
        bits. The criterion turns on WIDTH, so it moves further from being met, not
        closer.
      three_open_hazards_that_block_adoption_as_a_number: >-
        HZ-1, PARTIAL DOUBLE-COUNTING. k is per unit of p^{1/2}; RT2-C7's 5-7 bits
