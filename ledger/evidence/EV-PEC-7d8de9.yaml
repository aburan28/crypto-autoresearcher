        ESTIMATED with "the functional form is mine" and rigorous_support NONE.
        CORR-B IS CONFIRMED AND THE CAMPAIGN'S OWN PHRASING IS REFUTED: "k shifts
        every margin row by the same amount" is FALSE for rows A and B and only
        approximately true for row C. The Red Team concedes the same against its own
        RT-S2 wording.
