  # =====================================================================
  # INFERENCE
  # =====================================================================
  inference: >-
    THE BATCH'S HEADLINE IS A DIAGNOSIS OF THIS PROGRAMME'S MEASUREMENT DESIGN, NOT
    A FACT ABOUT THE OBJECT, and that diagnosis is worth more than the two headline
    statistics that dissolved.
    Three separate surfaces each ran to a method ceiling and EACH ENDED BY FINDING A
    DEFECT IN ITS OWN INSTRUMENT rather than a fact about the object it was pointed
    at. The c-programme hit gamma = exponent(M) - 1 <= 1 (RT3-P3). The baseline
    constant k hit a walled PDF and a blog. S1 hit a wrong reference measure and S2
    an uncentred estimator, and both defects are of ONE FAMILY: a calibration
    statistic is only meaningful against a reference fixed INDEPENDENTLY of the
    sample it is applied to - S2 read its reference off the sample's own realised
    value, S1 read it off the wrong measure entirely.
    THE ACTIONABLE CONCLUSION: the next contract's scarce resource is ESTIMATOR
    CENTRING AND REFERENCE-MEASURE CHOICE - not primes, not compute, and not
    batches. Under docs/inventor-protocol.md section 4 that is forward guidance
    naming what remains open, which is what a closure standard requires; it is NOT a
    closure and NOT a fatigue report.
    ONE OBJECT EXPLAINS BOTH DISSOLVED HEADLINES. The delta_E = 1 (Galois-stable)
    spike carries 64.2 per cent of S2's self-conditioning offset and is the entire
    W-CURVE/W-TYPE gap that drives S1. Its W-CURVE weighted mass is
    Theta(p^{-1/2+o(1)}) - measured exponent -0.4587 over 299 primes - which is of
    order 1e-34 at p = 5*2^248-1. BOTH ARE TOY-SCALE ARTIFACTS WITH NO
    CRYPTOGRAPHIC-SCALE ANALOGUE, and that cuts against reading either as a finding
    about the attack in either direction.
    WHAT THE BATCH DOES NOT LET ANYONE SAY. It does not let anyone say Heuristic 1's
    random-integer model was tested at the tail: the enumerated u reached
    [0.23540891, 3.16992500] against an operating point of u ~ 13.1 where
    rho(13) ~ 2^-60, so with 13834 samples the tail has ZERO experimental
    resolution, structurally and not for want of effort. It does not let anyone say
    the model was falsified, and it does not let anyone say it survived a test.
    FOURTH CONSECUTIVE BATCH WITHOUT MOVEMENT, SAID PLAINLY. No official position
    moves. That is not evidence the questions are unanswerable and it is not a
    reason to stop; it is a specific, diagnosable pattern with a named remedy.

  # =====================================================================
  # BOUNDARIES
  # =====================================================================
  boundaries:
    - >-
      PKG-HEUR binds to 299 completely enumerated primes 11 <= p <= 1999, 13834
      conjugacy classes, X_p <= 9, this implementation, and this frozen contract.
      With X_p <= 9 the entire delta_E distribution lives on NINE ATOMS, so every
      statistic in the package is a statement about a nine-point distribution. The
      largest claim the resource measure can support is "the nine-point body at
      p <= 2000 is or is not consistent with model M" and nothing else - not a tail
      statement, not a constant factor at the operating point, not a margin row.
    - >-
      PKG-PEC binds to one prime p = 1099511627563 (80-bit F_{p^2}) plus the
      C-PSCALE arms at 1073741783 and 1048571 which are `toy`, to
      ell in {3,5,7,11,13} on the old grid and {47,101,151,211} on the new, to one
      pure-Python implementation pair sharing every line but poly_mul, and to counted
      F_{p^2} multiplications from instrumentation - never timing.
    - >-
      A TOY-SCALE BODY MEASUREMENT IS NEVER A STATEMENT ABOUT THE TAIL AT u ~ 13,
      never a statement about the attack, and never a statement about Theorem 1.1 or
      the p^{1/3+o(1)} exponent. AGENTS.md rule 7 and the contract's own SP-H bind
      SYMMETRICALLY: a passing body statistic is not support and a rejected
      instrument is not a refutation.
    - >-
      NOTHING IN THIS BATCH BEARS ON CSIDH, (qt-)Pegasis, or torsion-based
      constructions. The affected-vs-safe scope statement is unchanged.
    - >-
      NO REVIEW-BREAKTHROUGH TIER IS CLAIMED OR CLAIMABLE. Under
      INFAMEND-20260802-P13-002 every policy alias falls back to one inherited model
      and reasoning effort is unverifiable, so AGENTS.md rule 12's non-degradable
      tier is unavailable in this harness. Both review reports state this
      themselves.
    - >-
      The optional sampled arm did not run. D-2 is a GENUINE CONTRACT DEFECT,
      correctly handled: prime_range.sampled_arm fixes the prime rule and the licence
      but NO sample size, and the only sample size in the contract is S1's
      N_walk = max(20 n_types(p), 20000), which requires n_types(p) - not computable
      at p ~ 2^28 by any method the contract provides, which is exactly what the
      sampled arm exists to avoid. A superseding contract that wants the arm must fix
      its sample size in a form not depending on n_types(p).
    - >-
      D-4 is correct under rule 4: the frozen contract names RUN-PEC-d7979c-a in
      required_artifacts and the run wrote RUN-PEC-d7979c-b, because -a is immutable
      once committed and overwriting it was the only alternative. The contract's
      required_artifacts.queue_declared list is now unsatisfiable AS LITERALLY
      WRITTEN - a contract-text fact recorded here, not a defect in the run.
    - >-
      D-1's tier stop is contract-legal (the SUFFICIENCY rule makes stopping at a
      complete tier terminal on naming the tier) and MR-16 verifies no TIER-2 datum
      entered any number. THE REASON GIVEN IS NOT A SCIENTIFIC ONE: a 170 MB vs
      100 MB per-file hosting limit is a packaging fact, and the remedy is layout
      (one raw file per tier, or dropping per-class debug fields at higher tiers, or
      compression), not science. Recording a packaging limit in the slot where a
      scope decision belongs reintroduces, in a different currency, the budget
      mechanism AGENTS.md retired - and unlike a budget it was never declared in
      advance. Measured, not assumed: TIER-2/3 would have bought u-range 3.1699 ->
      about 4.46 (13 per cent of the remaining gap, ZERO tail resolution) and X_p
      reach 9 -> 15 -> 22, which is the real gain because X_p is what shrinks the
      small-support artifacts driving S2 and S3. It would NOT have repaired S4.

  # =====================================================================
  # UNRESOLVED CONFOUNDS
  # =====================================================================
  unresolved_confounds:
    - >-
      NO CLEAN MEASUREMENT OF delta_E's PARITY AT FIXED SIZE EXISTS AFTER THIS
      BATCH. The M2 comparison confounds parity with size (delta_E is far from
      uniform on [1, X_p]) and a naive pair-collapse is confounded by the density
      decay within a pair. RT-H3's ell = 2 lane is UNMEASURED, not closed.
    - >-
      NULL-A is a valid null object under the contract's definition - same
      determinant p/4, same cardinality 13834, same prime stratification, same
      support {1..9}, same short-vector code path, same statistic function, all
      verified in source by the Validator - AND IT IS STRUCTURALLY UNABLE TO FIRE
      against the leading failure mode, because both it and the arithmetic object
      are single-realisation objects and both therefore carry the self-conditioning
      offset by construction. Separately, criterion (a) demands the deviation be
      SPECIFIC TO MAXIMAL ORDERS, which is not what Heuristic 1 claims: a deviation
      shared by every minimum of an integral ternary form of determinant p/4 STILL
      APPLIES to delta_E, because delta_E is such a minimum. NULL-A belongs in the
      mechanism-attribution column, not inside a falsification criterion.
      Independently, once the size confound is removed the two objects are
      demonstrably DIFFERENT (pair-conditioned two-sample differences +0.0862,
      +0.0254, -0.0097, -0.1419 at k = 1..4, up to ten sigma, sign-unstable), so
      "NULL-A reproduces the signal" is an agreement between two aggregate scalars
      each dominated by the same estimator offset.
    - >-
      The paired Cantor-Zassenhaus seeds make the FC-4 arms non-independent, and the
      shared null term makes clause (a) one comparison. The label is present in
      raw-result.json, manifest.yaml and execution_report.yaml as the contract
      requires after Validator V-4, and the confound is NOT removed by labelling it.
    - >-
      k's lower end is UNBOUNDED. WayFinder (ePrint 2026/1219) dominates the
      baseline row and its constants were not retrieved, so k is an UPPER bound with
      no established lower bound and the reported 1.75-bit floor is not a floor. The
      partial bound the Red Team supplies: the SIGN of log2 k survives as long as the
      best-known baseline is less than 64 to 89.6 times faster than plain DG at 256
      bits, and SuperSolver reaches only 7.62 to 9.33 there, so a sign flip requires
      roughly a further order of magnitude on top of SuperSolver.
    - >-
      V2's single instance implies c = 112878/(4096*24) = 1.1483, 9.4 per cent ABOVE
      the top of the stated band [0.75, 1.05]. ONE INSTANCE WITH GEOMETRIC-SCALE
      VARIANCE IN NODE COUNT IS NOT A REFUTATION and is not presented as one; it is
      the free E-1 internal consistency check nobody ran, and it points to c sitting
      at or above the band top, which makes k larger in the same direction as HZ-4.
    - >-
      MULTIPLICITY AND MINIMALITY EFFECTS ARE UNTOUCHED. delta_E is the degree of
      the SMALLEST isogeny E -> E^{(p)}; conditioning on minimality can correlate
      with divisibility even when representation is class-uniform. That is RT-H3's
      original body and it remains unmeasured.
    - >-
      THE HEURISTIC INVENTORY DEFECT PERSISTS AND IS THE COORDINATOR'S. There is
      still no numbered HEUR-NNN record for Heuristic 1 and no hypothesis-level
      proof_search_map, four batches into a campaign whose binding uncertainty IS
      that heuristic. Per docs/claims-and-verification.md a heuristic without a
      formal statement, a random-model justification, obstructions, a falsification
      condition and an approved validation plan may not be cited by a claim record.
      This is an inventory defect rather than a research defect and it is cheap to
      fix.

