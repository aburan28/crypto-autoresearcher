        THE BASELINE TERM'S SIGN IS PRO-ATTACK and the Red Team concedes it against
        its own expectation: a Delfs-Galbraith step is many field multiplications
        and charging it one F_{p^2}-operation was an error in the BASELINE's favour
        worth log2 k in [6.0000, 6.4854] bits at log2 p = 256 against plain DG. It
        does not merely partially cancel RT-C1's anti-attack asymmetry; it exceeds
        the SuperSolver correction it was expected to be cancelled by.
