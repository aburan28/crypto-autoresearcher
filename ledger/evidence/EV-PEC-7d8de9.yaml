        F_{p^2}-mults at mu = 3 = 2^4.310. Converting RT2-C7 at that lambda gives
        3.89 to 5.89 bits against row A's 6.00 to 6.49 - OVERLAPPING, NOT SUBSUMED -
        so "adopt k, record RT2-C7 as SUBSUMED" is premature by 0.6 to 2.1 bits.
        HZ-2, SCOPE OF APPLICATION. margin_corrected = margin_published + log2 k is
        legitimate ONLY on rows already carrying the measured attack-side overhead,
        never on the paper's raw Section 4.1 pairs.
        HZ-PROVENANCE. A non-peer-reviewed blog post is the SOLE source of a
        load-bearing constant for a CRYPTO 2022 paper. The producer flags this at
        every point of use, which is the right handling for a PROPOSAL and is not
        sufficient for ADOPTION into a margin row. HZ-3 (mu = 3 against 4, 0.415
        bits) and HZ-4 (squarings, 0.14-0.38 bits) sit inside the bracket width but
