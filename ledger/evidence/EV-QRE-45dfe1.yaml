evidence:
  id: EV-QRE-45dfe1
  hypothesis_id: null
  hypothesis_id_note: >-
    Deliberately null. GOAL-QRE-001 carries no hypothesis
    (active_hypothesis_ids is empty) and BATCH-973b49 was a costing and
    construction batch, not a test of a stated mechanism: it produced an
    arithmetic-layer count under a frozen convention. This record is evidence
    ABOUT that construction and its validation, and it is evidence for or
    against no hypothesis. Attaching it to one would misrepresent what was
    measured.
  goal_id: GOAL-QRE-001
  batch_id: BATCH-973b49
  question_id: RQ-QRE-6dba8c
  experiment_ids: []
  run_ids: []
  source_task_ids:
    - TASK-20260813-c99166
    - TASK-20260813-13e948
    - TASK-20260813-312e93
  type: empirical
  direction: neutral
  strength: replicated
  claim_tier: toy
  certificate_refs: []
  proof_status: derivation
  proof_refs:
    - coordination/goals/GOAL-QRE-001/batches/BATCH-973b49/tasks/TASK-20260813-c99166/PREREGISTRATION.md
    - coordination/goals/GOAL-QRE-001/batches/BATCH-973b49/tasks/TASK-20260813-c99166/src/derive_identities.py
    - coordination/goals/GOAL-QRE-001/batches/BATCH-973b49/tasks/TASK-20260813-13e948/validation_report.yaml

  scale:
    simulation_validated_widths:
      modexp: "n = 4..12 (exhaustive over all 2^{2n} exponents at n = 4, 5; seeded samples above)"
      point_add: "n = 4..12 (exhaustive over the whole declared domain to n = 7)"
    enumerated_but_not_simulated:
      modexp: "n = 14..128"
      point_add: "n = 13..32"
    closed_form_evaluations_only:
      - "modexp n = 2048"
      - "point_add n = 256"
    why_tier_is_toy: >-
      The widths at which the circuits were executed and checked are small. The
      closed forms are exact enumerations of the same construction, and the
      n = 2048 / n = 256 figures are arithmetic on those forms, labelled
      evaluated_from_closed_form in the artifacts and not measurements. Nothing
      here is a statement about a machine, a schedule, or a deployed parameter.

  observations:
    - >-
      MODEXP COUNTS. Toffoli(n) = 40n^3 + 50n^2, T(n) = 280n^3 + 350n^2, peak
      qubits 6n + 6, over the gate set {X, CNOT, CCX} with T = 7 * Toffoli.
      Residuals exactly zero at all 17 enumerated widths n = 4..128, including
      the six pre-declared holdout widths (24, 32, 48, 64, 96, 128). The closed
      form is independently reproduced by an algebraic derivation from the
      sub-circuit costs. Toffoli and T are modulus- and base-independent
      (checked at n = 8, 12 with two (N, a) pairs each: identical Toffoli,
      differing CNOT).
    - >-
      POINT-ADDITION COUNTS. Exact form
      Toffoli(n, b, w) = (8(b + w - 2) + 5)(20n^2 + 10n - 8) + 50(n + 1) + 2n,
      with n = bitlength(p), b = bitlength(p - 2), w = weight(p - 2); T is 7x
      that. Residuals exactly zero at all 32 enumerated (n, p) pairs. NO
      FUNCTION OF n ALONE IS EXACT: the count depends on the Hamming weight of
      p - 2. The cubic fitted on the largest-prime ladder deviates by -7.89%,
      -5.36%, -3.75% and -1.65% at n = 8, 11, 15 and 32 respectively. This
      limitation was PRE-REGISTERED (clause 7) and is stated in four places in
      the artifacts; the Validator confirmed it is not buried.
    - >-
      T = 7 * TOFFOLI IS DERIVED, NOT CITED. The producer exhibited an explicit
      Clifford+T circuit with seven T/T-dagger gates and multiplied its 8x8
      unitary against the Toffoli permutation matrix, reporting max deviation
      3.14e-16 against a declared 1e-12 tolerance. The Validator re-derived the
      same identity in genuinely exact arithmetic over Z[zeta_8] with Fractions
      and obtained equality EXACTLY.
    - >-
      COUNTED EQUALS SIMULATED, MEASURED RATHER THAN ASSERTED. One builder feeds
      both the counter and the simulator. In all 22 full-circuit configurations
      the gate tally recorded while simulating equals the tally recorded while
      counting. The Validator strengthened this to ORDERED gate-stream identity
      including qubit indices at nine configurations, the largest 1,879,060 ops,
      and confirmed by code reading that no builder branch depends on machine
      state.
    - >-
      NEGATIVE CONTROL, AND IT BOUNDS THE ABOVE. The Validator mutated the
      ripple adder's MAJ loop order. The gate tally was BIT-IDENTICAL
      ({x: 640, cnot: 7264, ccx: 3360}, peak 30) while the simulation caught the
      defect 16 of 16 times. TALLY EQUALITY ALONE IS THEREFORE NOT A CORRECTNESS
      CHECK; it remained true on a provably broken circuit. This is the most
      transferable result of the batch.
    - >-
      INDEPENDENT REPRODUCTION. The Validator rebuilt counts.json and
      validation.json from scratch from committed source in an isolated
      directory and obtained zero differing leaves apart from timing fields,
      which moved -- establishing a real re-run rather than a copy. It also
      extended simulation to two widths the producer only counted (modexp
      n = 14, point_add n = 13), both correct with clean ancillas and matching
      tallies.
    - >-
      VALIDATION IS LOAD-BEARING, DEMONSTRATED TWICE. The producer records D-2:
      the first end-to-end point-addition simulation failed on a dirty ancilla
      caused by a register aliasing a captured block's scratch qubits, fixed
      before any count existed. The defect is invisible to gate counting. The
      Validator independently reproduced a defect of the same family (D-V2).
    - >-
      17,045 circuit instances simulated across 26 exhaustive component checks
      and the full circuits, zero failures, all ancillas verified clean at
      end of circuit.

  boundaries:
    - >-
      Scoped to the frozen convention in PREREGISTRATION.md: gate set
      {X, CNOT, CCX}, T = 7 * Toffoli, clean ancillas all returned, no
      measurement or feedforward, no borrowed ancilla, unwindowed accumulate
      loop, no constant-specialised adder. A different convention gives
      different numbers and these do not transfer to one.
    - >-
      The point-addition construction uses Fermat inversion with quadratic
      ancilla. The producer states plainly it is an UPPER BOUND rather than an
      optimum, having been unable to derive a Euclid/Kaliski-style reversible
      inverter. Every point-addition figure inherits that.
    - >-
      EXCLUDED BY THE CONVENTION AND THEREFORE FROM EVERY NUMBER HERE: QFT,
      measurement, error correction, routing, layout, magic-state distillation.
      These counts are an arithmetic layer, not a resource estimate.
    - >-
      No comparison against any published construction is made by this evidence
      record. See CORR-20260813-1a06db and DEC-20260813-5cef9c: a comparison is
      now possible and was wrongly believed impossible when this batch was
      dispatched.
    - >-
      Nothing in this record is a statement about hardware, a schedule, an
      arrival probability, or a migration decision, and GOAL-QRE-001's absolute
      prohibition binds every downstream use of it.

  unresolved_confounds:
    - >-
      D-V5 (moderate, Validator): execution_report.yaml carries NO
      inference/model-provenance block, which the AGENTS.md artifact policy
      requires. The numbers are unaffected -- the Validator rebuilt them from
      deterministic committed source -- but the required field is absent and the
      artifact is hash-bound, so the repair is a superseding artifact and not an
      edit.
    - >-
      D-V2 (low): the DirtyAncilla guard is vacuous inside capture(), so
      PREREGISTRATION clause 3's claim that cleanliness is enforced mechanically
      on every run is overstated. Mitigated by a separate, non-vacuous
      end-of-circuit global zero check which the Validator confirmed fires.
    - >-
      D-V1 (low): counts.json describes the T-ratio check as "exact complex
      arithmetic"; it is IEEE-754 doubles. The substance survives -- the
      Validator redid it exactly -- but the artifact overstates its own rigour.
    - >-
      D-V3 (low): the producer's own prohibition scanner covers 4 of 17 files
      and contains no date pattern. GOAL-QRE-001 completion criterion 5 is
      discharged by the Validator's independent sweep, not by that scanner.
    - >-
      D-V4 (low): "validation is blocking" is procedural, not mechanised;
      run_counts.py never reads validation.json. Moot at zero failures.
    - >-
      PRE-REGISTRATION FREEZE ORDER IS NOT VERIFIABLE FROM GIT.
      PREREGISTRATION.md first appears in the snapshot alongside the source, so
      the two cannot be separated by commit history. The Validator recorded
      three pieces of circumstantial support rather than asserting the freeze
      held, notably that clause 6 declares a domain NARROWER than the
      construction needs, with the gap recorded as D-1 rather than edited in.
      Future batches must commit the pre-registration before the producer runs.
    - >-
      A candidate factor-1.997 inefficiency inside the frozen convention was
      reported by the Red Team (point_add replaying an already self-inverse
      mod_inv in both directions). IT IS NOT CITED AS A MEASUREMENT HERE: the
      Red Team states explicitly that its six runs are exploratory scratchpad
      measurements, are not evidence, and must be re-run under a dispatched task
      before citation. Recorded as an open item, not as a finding.

  inference: >-
    Under the frozen convention, this program now has its own arithmetic-layer
    counts for modular exponentiation and elliptic-curve point addition, exact
    as enumerations at the stated widths, independently reproduced from source,
    and validated by simulation at small widths with a negative control
    establishing that the validation can fail. That satisfies the substance of
    GOAL-QRE-001 completion criterion 2 at toy tier. It satisfies no other
    criterion, and the batch surfaced a defect in the goal's own framing that
    bears on criteria 1 and 4 -- recorded in CORR-20260813-1a06db and acted on
    in DEC-20260813-5cef9c.
  reviewed_by: coordinator
  recorded_at: '2026-08-13'
