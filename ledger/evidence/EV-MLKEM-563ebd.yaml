  direction: neutral
  strength: inconclusive
  direction_and_strength_basis: >-
    The record's own interpretation block states "Both H1 (QEMU artifact) and H2
    (genuine sieve correlation) predict ratio_null > 1 and ratio_correct > 1. The
    null control cannot distinguish between them", and its admissibility block
    records "OBJ-QEMU remains blocking". neutral and inconclusive are the schema's
