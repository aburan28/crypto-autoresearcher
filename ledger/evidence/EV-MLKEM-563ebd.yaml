  proof_status: empirical_only
  proof_refs: []

  what_was_measured: >-
    Test A: 50 bgj1_sieve runs scoring a WRONG secret (s* from seed 20260804999)
    against the real LWE b, same QEMU Docker environment as batch-3.
    variance_ratio_null = 1.5332. Test B: exact re-run of 4 batch-3 seeds
    (outliers 2941775225, 26883012, 2418421570, plus run-0 seed 1873347320)
    with both correct and wrong secret scored.

  key_results:
    test_a_null_control:
      n_runs: 50
      variance_ratio_null: 1.5332
      chi2_df49: 75.125
      p_value: 0.009589
      ci_95: [1.0698, 2.3808]
    test_b_outlier_rerun:
      seeds: [2941775225, 26883012, 2418421570, 1873347320]
      T_N_correct: [7789.567, 7791.775, 7789.812, 7420.549]
      T_N_wrong: [4167.083, 4433.895, 4238.163, 4178.842]
      delta_vs_batch3: [0.000, 0.000, 0.000, 0.000]
    ratio_correct_vs_null: 0.908

  interpretation:
    null_resolves_qemu: false
    reason: >-
      Both H1 (QEMU artifact) and H2 (genuine sieve correlation) predict
      ratio_null > 1 and ratio_correct > 1. The null control cannot distinguish
      between them. F-test for ratio difference: F(49,149)=1.10, p=0.32 —
      difference not significant. Outlier seeds reproduce to bit precision,
      ruling out stochastic QEMU PRNG as the source (but not deterministic
      QEMU state bias).

  admissibility:
    validator_verdict: accept_with_qualifications
    red_team_verdict: blocking_objections
    admissible_as_raw_observation: true
    qemu_confound_resolved: false
    reason: >-
      OBJ-QEMU remains blocking. Two blocking objections per red team:
      (1) null cannot distinguish hypotheses; (2) ratio_correct/ratio_null=0.908
      (correct slightly LOWER than null, weakly consistent with environmental
      inflation rather than Ducas-Pulles violation, but not significantly so).
      Native hardware still decisive.

  scope_statements:
