  hypothesis_id: null
  hypothesis_note: >-
    This record names H1 (QEMU artifact) and H2 (genuine sieve correlation) as
    local labels only; it names no ledger hypothesis id, and its scope_statements
    say "No finding stated" and "AGENTS.md rule 12 UNMET and UNWAIVED". Choosing a
    ledger hypothesis here would assert a target the record did not choose.
  run_ids: []
  run_ids_note: >-
    No ledger-registered RUN-* record exists for this measurement. The 50 Test-A
    runs and the 4-seed Test-B re-run were performed under the goal's coordination
    batch directory for BATCH-6ec7a4 and are identified by the producer_task,
