  type: empirical

  direction: weakens
  direction_note: >-
    WEAKENS, on two separate grounds that must not be merged. FIRST, HEUR-002
    (a bounded last fall degree for the digit presentation) is NOT SUPPORTED at
    the tested scale and is CONTRADICTED IN SUBSTANCE by the integers: d_lf
    rises from 5 to 6 between s = 3 and s = 4 on 480 of 480 draws at three
    primes with certified histories, and d_lf = d_ff is DERIVED, not fitted, on
    3660 of the package's fallen systems. That it fails for ALL s follows from
    d_lf >= d_ff together with H-PFDR-4148b8's derived d_ff law, and inherits
    that law's conditions. SECOND, and independently, the execution report's own
    statement that "the HEUR-002 falsifier statistic fires" DOES NOT SURVIVE an
    honest unit of replication and is withdrawn here: the pre-registered
    falsifier does not fire. What is NOT weakened is claim (A) of the hypothesis
    (no bounded-last-fall theorem transfers), which HOLDS as a derivation and is
    strengthened by a third, cheaper non-transferring step the package does not
    state.

  strength: replicated
  strength_note: >-
    Replicated FOR THE INTEGERS and inconclusive FOR THE SLOPE, and the two must
    never be quoted as one number. REPLICATED - (d_ff, d_lf) = (5,5), (5,5),
    (6,6), (6,6) at s = 2..5 on 480 Semaev draws across three primes, over at
