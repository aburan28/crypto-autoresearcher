  observations:
    - >-
      O-1 (V2, THE RECEIPT DEFECT, unrepairable as such). Exactly two closure.py
      versions are pinned, and the partition is not the one the plan expected:
      74e659bb on THREE runs - the known-answer fixture, the s = 1 baseline
      slice and the d_ff-agreement control, all started 21:53 UTC - and 63475db5
      on the other TWENTY, from 22:08:31 UTC on, i.e. every ladder cell, every
      equal-d^s cell and both m = 3 cells. The tree copy hashes to 63475db5;
      git log --all shows closure.py entering history exactly once, in a3a81e33,
      with content 63475db5; a scan of git rev-list --all finds NO reachable
      commit containing 74e659bb. A pin to a blob nobody has is not retention.
      Independently confirmed by the orchestrating Coordinator session.
    - >-
      O-2 (R1, PSEUDOREPLICATION - THE PRE-REGISTERED FALSIFIER DOES NOT FIRE).
      Within-cell range of d_lf is 0 at ALL TWELVE cells and the between-prime
      range at fixed s is 0, so the 480 observations are FOUR INTEGERS EACH
      REPEATED 120 TIMES. On the four independent s-points the OLS slope is
      still 0.4000 but the 95 percent t-interval is [-0.2085, 1.0085]
      (t_{2,0.975} = 4.30, s^2 = 0.1, S_xx = 5), which CONTAINS 0 - and also
      0.25, 0.5 and 1. THE "EXCLUDES 0" FALSIFIER STATISTIC DOES NOT FIRE. Both
      reviewers computed the four-point interval independently and agree to four
      decimal places. Five draws per s-level already buy "excludes 0.5", and the
      producer's own bootstrap over draws within cells returns the degenerate
      [0.4, 0.4], which is the same tell. The reported [0.3820, 0.4180] is the
      lack of fit of a line to a step function with a fictitious sample size:
      the residual sum of squares is pure lack of fit and the standard error
      shrinks as 1/sqrt(n) with no statistical content.
    - >-
      O-3 (R1, the outcome rule). The frozen three-outcome rule COULD NOT HAVE
      RETURNED ANYTHING BUT "unresolved". Outcome II's clause "the d_ff interval
      lies strictly below the d_lf point estimate" asks an interval to lie
      strictly below its own centre whenever d_ff = d_lf on every draw, which is
      the case here, so it is unsatisfiable on any single-fall system. With
      n = 480 the interval half-width is 0.018, so Outcome I reduces to
      "d_lf = s + const exactly" and Outcome III to "d_lf constant on s = 2..5".
      Every integer step between them - INCLUDING the contract's own frozen
      prediction 5, 5, 6, 6 for d_ff - lands in "unresolved" by construction.
      The label is a fact about the rule, not about the last fall degree, and
      the rule was mis-specified rather than the world being surprising.
    - >-
      O-4 (R1, what 0.400 is). The measured values are exactly H-PFDR-4148b8's
      derived step 4 + floor(s/2), whose finite-window OLS slope is 0.4 on
      [2,5], 0.5 on [2,6], 0.4571 on [2,7] and tends to 1/2. So 0.400 is a
      property of the WINDOW, and the reported interval [0.382, 0.418] EXCLUDES
      the true growth rate of the law the data reproduce with residual 0.
    - >-
      O-5 (R3 and R2, THE DERIVATION THAT CARRIES THE ADVERSE TRANSITION).
      DERIVED - if V_{F,D0} = I cap B_{<=D0} for some D0 >= e(Z) + 1 then
      V_{F,D} = I cap B_{<=D} for all D >= D0 and NO fall occurs above D0 at any
      degree. MEASURED - the recorded diagnostic V_complete_at_D is TRUE at the
      first fall on all 3752 fallen systems, the hypothesis fall_dim(d_ff) =
      dim(I cap B_{<=d_ff-1}) holds on all of them, and the degree condition
      d_ff >= e(Z) + 2 is met on 3660 (all Semaev, non-curve, NULL-1 and NULL-2
      at m = 2). So d_lf = d_ff is DERIVED, NOT FITTED, on those 3660 systems.
      The certificate that licenses the censoring decision was attacked and
      refused correctly: on a planted late-fall object (n = 10, p = 4099,
      g = u f1 + v f2 + h of degree 8) at D_max = 7 it returned falls [], dim
      V_7 = 112 against dim(I cap B_{<=7}) = 582, C1 false, route "not
      certified", right_censored true - and run to D = 9 the true history is
      falls [8].
    - >-
      O-6 (the measured law, and its consequence for the cost lane).
      D_0(s) = d_lf = d_ff = 4 + floor(s/2) at m = 2, values 5, 5, 6, 6 at
      s = 2..5 on 480 of 480 draws with residual 0 against H-PFDR-4148b8's
      closed form. "D_0" in EXP-PFDR-c04716's table is a CONSTANT parameter; the
      measurement shows it is a GROWING FUNCTION OF s at m = 2. Any use of that
      table must substitute the function, not a constant, and the table's
      D_0 <= 6 requirement at 256 bits with omega = 2 is exceeded from s = 6 on.
    - >-
      O-7 (the cost consequence, computed because it is the one cost-bearing
      statement in this lane). At the measured solving degree the reduced column
      count is N_D = sum_{j <= D} binom(2s, j), giving log_B N_D = 1.99, 1.95,
      1.95 at s = 3, 4, 5 and tending to 2H(1/4) = 1.6226; the linear-algebra
      cost is then about B^{3.9} at s = 4, 5 and tends to B^{3.245} at omega = 2
      (B^{4.55} at omega = 2.807), against B^1 for exhaustive enumeration of one
      digit block and O(sqrt(N)) for Pollard rho. SIGMA > 1 BY A WIDE MARGIN AT
      EVERY s: the algebraic route at its own measured solving degree is
      dominated by brute-force enumeration of the digit cube, let alone by rho or
      BSGS, and memory is the same N_D columns. dominated_by is therefore NOT
      null for this lane at m = 2, d = 2: it is enumeration on time and rho on
      both time and memory. This CONFIRMS IDEA-20260903-e1e38b (D7) with a
      concrete factor and extends it - e1e38b assumed d_solve = d_ff
      optimistically, and the closure histories show that assumption is the
      measured truth, so the optimistic assumption cannot be improved.
    - >-
      O-8 (R5, claim (A) HOLDS with incomplete grounds). Theorem 2.6 of
      arXiv:2103.07282 as displayed has TWO hypotheses - "F is a finite set of
      k'-LINEARIZED polynomials of maximum degree d = q^c" AND "F is reducible
      for k" - and the package names only the second. The missing linearized
      hypothesis is a third and CHEAPER non-transferring step (S~ has degree 4
      and is not additive), it needs no proof-body reading, it carries claim
      (A)'s conclusion on its own, and it makes the package's "formal analogue
      constant 4m = 8" a substitution into a formula whose variable ranges over
      linearized generators - a category error rather than merely a
      theorem-less number. Separately, the package's step from "Lemma 2.1 has no
      F_p analogue" to "no version of the theorem transfers" is an inference
      about a proof body the retrieved material does not license, and it is not
      needed.
    - >-
      O-9 (R4, SCOPE - the controlled null). The non-curve (singular, nodal)
      cubic reproduces the Semaev (d_ff, d_lf) pair AND the censoring status at
      ALL 15 CELLS on 600 draws (F5 noncurve true), and NULL-3, the
      block-factored null, matches the full pair at s = 3, 4, 5 with difference
      0 in BOTH coordinates. By the contract's own pre-registered F5 reading
      this is a controlled null: NO Semaev-specific, NO elliptic-curve-specific
      and NO ECDLP statement is licensed by any number in this package.
    - >-
      O-10 (R4, HEUR-001 where testable, and where not). The offset
      c = d_lf - (s + 2) is exactly 1 on every uncensored NULL-1 and NULL-2 draw
      at s = 2, 3, 4 - the null's last fall is exactly s + 3, EXP-PFDR-5726af's
      D_null convention with offset 0 - and at s = 5 EVERY ONE of the 615 null
      objects is right-censored by D_max = 7, so the top cell, where a widening
      band would first show, was NOT MEASURED. The "band offset grows with s"
      flag is entirely the s = 1 cell (c = 0 there against 1 at s = 2, 3, 4),
      and at s = 1 the ring has 4 monomials so no fall above D = 3 is possible:
      the boolean fires on a ring-size boundary artifact. On s = 2..4 the offset
      is constant.
    - >-
      O-11 (R4 and the proves-too-much control, the s = 1 rule). The frozen tell
      "a fall with iteration count 1" is, at s = 1, a PERFECT DETECTOR OF
      SOLVABILITY rather than of a non-iterating closure: on all 1200 s = 1
      systems it fires exactly when Z_size >= 1 (405 Semaev and non-curve
      entries plus 165 of 600 NULL-1) and never when Z_size = 0 (450 NULL-1 plus
      15 NULL-2), because at n = 2 the ring has 4 monomials and W_0(3) is
      already the ideal cap whenever a root exists. Applying it literally erased
      405 correct measurements and, on NULL-1, conditioned the s = 1 band row on
      the subsample with no root. It changed no fitted number here (s = 1 is
      outside the primary fit and raw values are reported beside the
      rule-applied ones), and the corrected reading is "iteration_count = 1 AND
      W0_saturated = false".
    - >-
      O-12 (R2 and R4, the certificate read honestly). C2(D) is a THEOREM for
      every D >= e(Z) + 2, and all 480 recorded Semaev C2 checks are at D >= 8
      with e(Z) <= 3, so NONE OF THEM COULD HAVE FAILED. The censoring decision
      rests on C1 alone. C1 is the right test and it refuses correctly on the
      known-false object, so this is a scope statement and not a defect - but
      the certificate must not be read as two independent checks. Further, C1
      says the closure has already computed the whole ideal cap at D_max, i.e.
      the system has SOLVED by D_max, so certification is equivalent to a LOW
      last fall and censoring is a deterministic consequence of a high one.
      Censored draws are excluded from the d_lf fit, so any future cell with
      d_lf > D_max would be dropped and the fit biased toward Outcome III. No
      bias was realised at s <= 5, but the fitted SAMPLE is selected by an
      ideal-level predicate although each d_lf value is generator-level.
    - >-
      O-13 (R4, the presentational artifact budget is EMPTY). All 45
      CTRL-EQUAL-DS-SPREAD instances at B = 64 report no fall and are
      right-censored, because D_max = 6 sits below the derived first fall
      4 + floor(6/2) = 7 of the matched (2, 6) arm and below the membership
      degrees of the ordinary-ring arms. The observed spread is the EMPTY SET,
      so IDEA-20260830-84cdb7's "a claimed effect must exceed the presentational
      spread by a factor 2" rule has NO DENOMINATOR anywhere in this lane and
      must not be cited until it has one.
    - >-
      O-14 (V1, a convention sensitivity the red team did not raise). The
      quantity is CONVENTION-DEPENDENT and the size of the dependence is
      bounded: a defensible third reading of "closed under multiplication" in
      the quotient ring - deg_B(h v) <= D instead of deg(h) + deg_B(v) <= D,
      allowing degree-D elements to be multiplied because idempotency keeps the
      reduced degree at D - gives the ladder 4, 5, 5, 6 and a four-point slope of
      0.6 instead of 0.4. It is NOT the plan's designated reading and NOT the
      plan's named reduced-ring variant, and the producer's convention_id string
      in all 23 manifests describes the designated reading, so the agreement is
      on the intended object. Recorded because the frozen convention document is
      load-bearing for every number in the package.
    - >-
      O-15 (V3, replication counting and an unexpected observation). A curve
      contributes at most as many distinct generator systems as it has reachable
      x(P_1 + P_2) - 9 for the four curves with three on-curve window x and 4
      for the two curves with two - so a cell holds at most 72 and at least 32
      distinct systems among its 40 draws, and at p = 16411 curve 3101 a
      duplicate is FORCED (target seeds 2 and 3 share x_R = 4634). THE BINDING
      REPLICATION FACT IS NOT THAT COUNT but the observable's zero within-cell
      variance. Unexpected observation recorded under AGENTS.md rule 8: three of
      the twelve declared instances have a DEGENERATE decomposition - the only
      digit solution is diagonal, ell_1 = ell_2, so x_R = x(2P) rather than
      x(P_1 + P_2) for distinct points (p = 65537 curve 3101 targets 1 and 2,
      and curve 3102 target 2). These are legitimate window pairs and
      (d_ff, d_lf) is unaffected, but a quarter of the subsample carries a
      doubling rather than a genuine two-summand decomposition and the solution
      set has size 1 rather than 2.

  inference: >-
    Compose V1-V4 with R0-R5 and two independent things go wrong, neither of
    which is a wrong number. The receipt is incomplete: all three blocking
    instrument controls pin a closure.py version that exists nowhere, so they
    cannot be re-run and their metric-neutrality cannot be judged. The reported
    statistic is invalid: within-cell variance is exactly zero, the 480 draws
    are four integers repeated 120 times, and on the four independent s-points
    the interval contains 0, so the pre-registered falsifier does not fire and
    the frozen three-outcome rule could not have returned anything but
    "unresolved". What replaces the statistic is stronger than it was: d_lf =
    d_ff is DERIVED on 3660 fallen systems from an archived theorem whose one
    condition is verified per draw, the closure SOLVES the digit system at
    d_ff = 4 + floor(s/2), and that law grows in s - which refutes HEUR-002 in
    substance through d_lf >= d_ff, inheriting the conditions of
    H-PFDR-4148b8's d_ff law rather than resting on the interval. Claim (A) of
    the hypothesis holds as a derivation on a third and cheaper ground than the
    package states. And the whole measurement is scoped away from the ECDLP by
    its own controlled null: a singular non-curve cubic reproduces the pair and
    the censoring status at every cell.

  largest_justified_claim: >-
    On the tested ladder only - m = 2, d = 2, s in {2, 3, 4, 5}, p in {4099,
    16411, 65537}, 8 curves x 5 planted targets per cell, D_max = 7, planting
    window [0, 4), the frozen convention cbdefb-closure-v1 and its C1
    certificate - every fallen system of the digit presentation has EXACTLY ONE
    fall degree, and at that degree the closure has already computed the entire
    degree-<= d_ff part of the vanishing ideal I(Z); consequently d_lf = d_ff
    with values 5, 5, 6, 6 on all 480 Semaev draws, residual 0 against
    H-PFDR-4148b8's derived law 4 + floor(s/2), and DERIVED rather than fitted
    on 3660 of the package's fallen systems. The fitted slope 0.400 with
    interval [0.382, 0.418] is NOT a supported statement about growth. Because
    the singular non-curve cubic reproduces the same pair and censoring status
    at every cell, NONE OF THIS IS A STATEMENT ABOUT SUMMATION POLYNOMIALS,
    ELLIPTIC CURVES OR THE ECDLP: it is a statement about a single degree-4
    multilinear generator in 2s squarefree digit variables whose top form is the
    tensor square of the digit linear forms. HEUR-002 is not supported at this
    scale and is contradicted in substance by the integers; that it fails for
    ALL s follows from d_lf >= d_ff and the derived d_ff law, and inherits that
    law's conditions. No bound uniform in s is refuted by the data alone and no
    impossibility is claimed.

  boundaries:
    - >-
      B-1. THE RECEIPT IS INCOMPLETE. CTRL-DFF-AGREEMENT, the known-answer
      fixture and the s = 1 baseline slice are not admissible as instrument
      controls in their Stage-1 form and are cited nowhere in this record. Their
      function is only partly discharged - by the s = 1 re-measurement under the
      retained version, by P1 recomputed inside all 15 ladder cells, and by the
      validator's independent blind reproduction of the agreement instance - and
      the recorded cross-contract comparison against EXP-PFDR-5726af exists only
      under the lost version.
    - >-
      B-2. THE RESULT IS NOT ABOUT ELLIPTIC CURVES. See O-9.
    - >-
      B-3. The measured law is four points on the s-axis at resolution 0.25.
      Nothing about larger s, m > 2, d > 2, yield or any cryptographic parameter
      follows.
    - >-
      B-4. THE LADDER CANNOT BE LENGTHENED under the frozen instrument. At
      m = 2, s = 6, n = 12 gives 2^n = 4096 > CERTIFICATE_COLUMN_LIMIT = 1024,
      so certify_history returns "certificate not attempted" and every draw is
      right-censored BY DECLARATION. Outcome III's "four consecutive uncensored
      cells" clause can never be satisfied on more than the four already
      measured, and the primary fit cannot be extended past s = 5 without
      changing the frozen convention.
    - >-
      B-5. HEUR-002's failure for ALL s is CONDITIONAL. It follows from
      d_lf >= d_ff plus H-PFDR-4148b8's derived d_ff law, and therefore inherits
      that law's conditions - H-TOP at m = 2, Wilson's rank theorem, and the
      status of H-PFDR-4148b8, which this same round moved to analyzed and one
      of whose clauses this same round refuted by counterexample.
    - >-
      B-6. The m >= 3 extension is not measured here. This experiment's m = 3
      evidence is one cell at s = 2 (below the closed form's range) plus one
      cell not computable at D_max = 7.
    - >-
      B-7. The presentational artifact budget is UNMEASURED, not zero (O-13).
    - >-
      B-8. No universal impossibility. The named remaining open object is
      precise: a uniform bound would require Wilson's rank formula for the
      inclusion matrices W_{j, j+2} to FAIL at large s with 2^s <= p. That is a
      classical combinatorial question, not an elliptic-curve one, and it is the
      concrete successor this line carries.
    - >-
      B-9. Judgement across this round is correlated: producer and both
      reviewers report the same model family with model_verified false.

  unresolved_confounds:
    - >-
      UC-1. The frozen convention document stage1-closure-convention.md is
      load-bearing for every number in the package and was HASHED, not opened,
      by the blind reviewer (as the plan requires). A defensible third reading
      moves the ladder to 4, 5, 5, 6 and the slope to 0.6.
    - >-
      UC-2. 117 of the 120 s = 5 Semaev draws rest on the dense float64 engine
      ALONE (cross-engine coverage 40/40 at s <= 4, 1/40 at s = 5). That engine
      is not the validated meter - VALIDATION.md states "no floating point
      anywhere in a rank" - so the dense path lives in closure.py and its
      correctness rests on the declared exactness bound, which holds with a
      2164x margin at the binding case. The reviewer's own independent EXACT
      computation at s = 5 agrees on all 12 instances, which is the strongest
      available cross-check.
    - >-
      UC-3. The definition of the measured invariant V_{F,i} REMAINS UNVERIFIED
      AGAINST ITS SOURCE. It is `recalled` in H-PFDR-c88f14 ("corpus note read,
      paper not opened"); the reviewer confirmed the paper's title, authors,
      year and its order-independence and first-fall claims from
      eprint.iacr.org/2015/573, but that page does not contain the definition.
      Internal validity is unaffected because the convention is frozen, explicit
      and pinned, but no outward-facing statement may imply the source was
      checked.
    - >-
      UC-4. KN-LIT-7605 overstates its paper's scope in exactly the direction
      that makes a bounded last fall for Semaev systems look like established
      prior art: it records authors [] and year null (actual Ming-Deh Huang,
      2021) and states as a key claim that bounded-fall-degree results are
      stated for summation-polynomial systems over F_2, while the abstract and
      displayed theorems name LINEARIZED polynomials and no summation
      polynomials.
    - >-
      UC-5. Whether the first fall SATURATES at every s is not established.
      Theorem A reduces d_lf = d_ff to one checkable condition and that
      condition is measured true on 3660 systems; it is not proved to hold at
      every s, and the s = 6 cell that would test it next is structurally
      unmeasurable under the frozen instrument (B-4).

  obstruction:
    statement: >-
      The last fall degree of the d = 2 digit presentation equals its first fall
      degree and GROWS with the shape parameter - d_lf = d_ff = 4 + floor(s/2)
      at m = 2 - so no last-fall bound constant in s is available to this
      presentation, and a cost model that treats D_0 as a constant parameter is
      pricing a quantity that is a function of s. This is a property of the
      OBJECT: the closure reaches the entire degree-<= d_ff part of the
      vanishing ideal at the first fall, so there is nothing left to fall, and
      the first fall itself is fixed by the tensor-square top form.
    quantity: >-
      The pair (d_ff, d_lf) under the frozen Huang-Kosters-Yeo closure
      convention cbdefb-closure-v1, with its C1 completeness certificate, read
      per draw across the m = 2 ladder; equivalently the solving degree D_0(s)
      of the digit system at m = 2.
    value: >-
      (d_ff, d_lf) = (5,5) at s = 2, (5,5) at s = 3, (6,6) at s = 4, (6,6) at
      s = 5, on 480 of 480 Semaev draws. Exact integers with ZERO within-cell
      variance and ZERO between-prime variance at fixed s, so the honest error
      bar on each of the four values is exactly 0 and the honest interval on
      their SLOPE, computed on the four independent s-points, is
      [-0.2085, 1.0085] around 0.4000 - which is why no growth-rate statement is
      supported by this design. The corresponding column count at the measured
      solving degree gives log_B N_D = 1.99, 1.95, 1.95 at s = 3, 4, 5, tending
      to 2H(1/4) = 1.6226, hence sigma > 1 at every s.
    measured_by:
      - RUN-PFDR-cbdefb-m2-s2-p4099
      - RUN-PFDR-cbdefb-m2-s2-p16411
      - RUN-PFDR-cbdefb-m2-s2-p65537
      - RUN-PFDR-cbdefb-m2-s3-p4099
      - RUN-PFDR-cbdefb-m2-s3-p16411
      - RUN-PFDR-cbdefb-m2-s3-p65537
      - RUN-PFDR-cbdefb-m2-s4-p4099
      - RUN-PFDR-cbdefb-m2-s4-p16411
      - RUN-PFDR-cbdefb-m2-s4-p65537
      - RUN-PFDR-cbdefb-m2-s5-p4099
      - RUN-PFDR-cbdefb-m2-s5-p16411
      - RUN-PFDR-cbdefb-m2-s5-p65537
    scope: >-
      m = 2, d = 2, s in {2, 3, 4, 5}, p in {4099, 16411, 65537}, 8 curve seeds
      x 5 planted targets per cell (at least 32 distinct generator systems per
      cell), D_max = 7, planting window [0, 4), the frozen convention and its C1
      certificate, 0 of 600 Semaev draws censored. NOT claimed at s >= 6 (the
      instrument cannot certify there), NOT claimed at m >= 3 (one cell below
      the formula's range and one not computable), and NOT a statement about
      elliptic curves, since a singular non-curve cubic reproduces the same pair
      at every cell.
    resource_check:
      examined: true
      reading: >-
        EXAMINED, AND A RESOURCE WAS FOUND, in a direction that is already being
        used inside this same round. Read as a refutation, the growth of d_lf
        removes HEUR-002 and, with it, the bounded-D_0 premise of the
        conditional cost table. Read as a measurement rather than a refutation,
        the SAME quantity is precisely the degree column that
        EXP-PFDR-c04716's cost model needs and did not have: D_0 there is a
        constant parameter, and this record supplies the function
        D_0(s) = 4 + floor(s/2) at m = 2, against which the table's "D_0 <= 6 at
        256 bits with omega = 2" is exceeded from s = 6 on. That is the reading
        DEC-20260904-d47cd2 takes up, and it is promoted as KN-FIND-0618ab
        together with the m 2^{m-1} generator-degree floor. A SECOND theory
        takes it as a hypothesis rather than a refutation: R3's Theorem A turns
        "the closure solves at d_ff" into a positive structural statement about
        the digit presentation - the whole ideal cap is computed at the first
        fall, so the fall history has length one - which is a lane-relevant fact
        the battery did not predict and which is what makes the d_lf ladder's
        contribution derivational rather than statistical. A THIRD reading is
        named and NOT taken up by anyone yet: the growth is exactly floor(s/2),
        i.e. one degree per two digits, which is slower than the null's s + 3,
        so the digit presentation retains a real one-degree separation from a
        generic multilinear system at every strict cell - a structural gain that
        no IDEA-* or H-* record currently owns. Named rather than assumed to
        exist.
      spawned_ids: []

