    INCONCLUSIVE - the slope statistic, for the reason recorded at O-2. CAPPED -
    the receipt is INCOMPLETE on all three blocking instrument controls (O-1),
    which is why this record's strength is not raised further and why the
    decision carries a mandatory replication action.

