      independent Coordinator re-derivation here; that is a limitation of this
      record and it is carried into DEC-20260802-359eca.limitations rather than
      elided.
    expected_run_count:
      status: defect_found_and_recorded
      detail: >-
        Producer: maximum_runs 1, two executions performed, receipt records
        budget_exceeded false (D5). The overrun is disclosed with a sound reason
        and the superseded diagnostic is named; the boolean is nonetheless wrong.
        Validator: 1 of 1 allowed, approximately 660 s of a 2400 s allowance,
        peak working array approximately 7 MB against a 4 GB cap, no git commit,
        zero writes outside write_scope. First validation: 0 completed runs,
        terminated on a provider limit, recorded as failed_infrastructure and NOT
