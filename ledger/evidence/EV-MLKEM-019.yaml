    verdict: >-
      ADMISSIBLE AS EVIDENCE OF WHAT IT IS: an independently reproduced,
      honestly disclosed recomputation over immutable archived toy-parameter
      bytes, carrying twelve recorded defects of which three are major. It is NOT
      admissible as evidence that the measurement selects Approximation 4.9's
      functional form, NOT admissible as any statement about the absolute level,
      NOT admissible as any statement about Pwrong below the counting floor where
