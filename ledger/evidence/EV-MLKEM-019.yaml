    manifest_and_seed_integrity:
      status: met
      detail: >-
        The producer receipt records the reproduction command,
        git_commit_at_execution 5f8bb4eb49b7391ef4fbeabcee03590fd5d39a1a, a dirty
        tree confined to its own untracked write scope (the expected state for a
        producer that does not commit), stdout embedded in
        comparison_results.json with stderr recorded empty, and resource
        measurements (243.078 s wall clock, 23.4 MB peak RSS via
