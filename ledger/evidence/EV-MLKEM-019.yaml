  # ------------------------------------------------------------------
  # OBSERVATIONS (schema field)
  # ------------------------------------------------------------------
  observations:
    - >-
      Over the resolved bands of two archived toy-parameter verifyModel Pwrong
      files ([0,1802] at counting floor 2^-35.70445229 and [0,2309] at
      2^-36.28941479, both floors bit-for-bit IEEE-754 equal to
      1/(nb_iteration * q^k_fft)), a recomputation of Approximation 4.9 under a
      declared reading of the unarchived Phi, carrying ONE fitted normalisation
      log2 K = -72.712581 / -67.222505, agrees with the measurement to whole-band
      residual rms 0.7055 / 0.6969 bits and to rms 0.2823 / 0.2722 bits over the
      sub-band where its D component dominates (scores 756-1492 and 727-1968).
    - >-
      An independent re-implementation evaluated at the producer's own K matches
      the producer's per-score prediction column to <= 6.57e-04 and <= 4.65e-04
      bits across all 4113 scores; the log2 Q column to 3e-14, the measured
      column exactly, the log2 P(D >= T) column to 7e-15. The recomputation is
      reproduced; what it means is a separate question and the answer is below.
    - >-
      THE REQUIRED NULL-OBJECT CONTROL WAS ABSENT AND DOES NOT DISCRIMINATE WHEN
      RUN. On the informative sub-band, a + b*T^(1/3) fits at rms
      0.1051 / 0.1007 bits against the Approximation 4.9 tail form's
      0.1048 / 0.0987. Under docs/inventor-protocol.md section 3 the reported
      shape agreement is an artifact until shown otherwise, and it is not shown
      otherwise here.
    - >-
      THE NON-DEGENERACY CONTROL DISCRIMINATES ALMOST NOTHING. A fine sweep
      (step 0.5, K refit at each p) gives acceptance sets
      {p : rms <= rms at the archived p} = [20.5, 26.0] and [20.0, 24.5], with
      whole-band optima at p = 23.0 and p = 22.0, so the archived exponents 26.0
      and 24.5 are the UPPER ENDPOINTS of their own acceptance sets. The
      producer's p = 10 and p = 40 sit 13-18 units outside the basin.
    - >-
      THE DIVERGENCE PROFILE IS CONFOUNDED WITH THE PACKAGE'S OWN SINGLE-K
      REDUCTION. corr(residual, clipped fraction) = 0.916 / 0.904; mean residual
      +0.959 / +1.103 where the clip is active against -0.231 / -0.193 where it
      is negligible; min(1, K*L^p) is concave in K so Jensen fixes the sign; and
      at most about 45% of the +1.516 / +1.710 peaks is attributable to the
      reduction. The majority of the peak remains unexplained.
    - >-
      THE INFORMATIVE REGION CARRIES ABOUT THREE INDEPENDENT OBSERVATIONS, NOT
      ABOUT 1800. The lever arm in X = log2 ln(N/T) spans 0.3080 / 0.4709 and
      residual lag-1 autocorrelation is 0.992 / 0.996, giving an AR(1) effective
      sample of 3.1 of 737 and 2.6 of 1242 points.
    - >-
      OF THE QUOTED 34.7 / 35.3 BITS OF DYNAMIC RANGE, 4.61 AND 2.91 ARE CARRIED
      BY THE PARAMETER-FREE Q(T) TERM, which over that stretch matches to rms
      0.0100 and 0.0059 bits with ZERO free parameters. Q(T) tracks the
      measurement within 0.1 / 0.5 / 1 bit to scores 322 / 469 / 525 (n=43) and
      273 / 401 / 460 (n=50), then falls 32.4000 / 35.1561 bits below it by score
      1000 and 149.9930 / 265.5570 bits below it at the counting floor. That part
      of the agreement is Model 4.7's, not Approximation 4.9's.
    - >-
      THE STRONGEST SURVIVING ITEM, WHICH THE PRODUCER NEVER CLAIMED: the
      exact-model sub-band optimum shifts between the two files by EXACTLY the
      predicted 1.50 (24.50 -> 23.00 against dp = (44-41)/2 = 1.50), so the two
      files independently return r = 52/24.5 = 2.122 and r = 49/23.0 = 2.130,
      agreeing to 0.4%; and the free-slope sub-band fit recovers b = 26.515
      against an a-priori 26.0 and b = 24.549 against 24.5. No tuned parameter
      had to pass this check. Computed once, by the validator, never
      independently re-derived.
    - >-
      Neither prohibited failure mode is present: nothing is compared, fitted,
      anchored, scanned or extrapolated past the counting floor in either file,
      and no k_fft alignment is applied anywhere - the raw-scale sigma ratios are
      0.9996 / 0.9986 and 1.0020 / 1.0002 against sqrt(avg_N/2), versus
      2.9987 / 2.9957 and 3.0060 / 3.0007 against the /k_fft alternative. This
      independently reproduces EV-MLKEM-018's finding for the third time and
      changes nothing about its status.
    - >-
      nb_iteration = 6000 for the n=50 file is not merely defensible against the
      Fig 4.1 caption's 4000: the caption value is EXCLUDED BY THE FILE'S OWN
      BYTES. The values are exact integer multiples of 1/(6000*241^3)
      (max |count - round| = 3.8e-06) and are not integer multiples of
      1/(4000*241^3) (max deviation 0.3333), and the last positive value is
      exactly two thirds of the 4000-quantum.
    - >-
      The measurement lies marginally BELOW the model's parameter-free noise
      floor at the very bottom of both bands - scores 0-126 (n=43) and 0-133
      (n=50), maximum shortfall 0.00369 and 0.00693 bits. Since Model 4.7 writes
      the wrong-guess score as D + N(0, N/2) with D >= 0, no K >= 0 reproduces
      those scores. Structural rather than numerical, tiny, and consistent with
      the measured score standard deviation sitting 0.04%-0.14% away from
      sqrt(avg_N/2).
    - >-
      Normalisation matters enormously at one end of the band and not at all at
      the other: anchoring K at the 2^-5 level (score 213/214, where the
      prediction's elasticity in K is only about 0.15) undershoots the deep tail
      by up to 18.198 / 16.651 bits, while anchoring at the last count >= 10
      score costs at most +1.75 / +1.95 bits of mid-band overshoot. Any statement
      of the form "the model agrees or disagrees by X bits" is meaningless
      without saying where the single unarchived scale was pinned.
    - >-
      Twelve defects are recorded, three of them major (D6, D7, D8), and none is
      repaired: the archived artifacts are immutable and corrections supersede
      rather than overwrite (AGENTS.md rule 4).

  # ------------------------------------------------------------------
  # INFERENCE
  # ------------------------------------------------------------------
  inference: >-
    THE COMPUTATION IS SOUND AND THE CLAIM IT WAS OFFERED FOR IS NOT ESTABLISHED.
    BATCH-009 ran the comparison EV-MLKEM-018 named as "the cheapest real test the
    archive supports", and the test came back without discriminating power. The
    arithmetic reproduces under an independent re-implementation to better than
    7e-04 bits across 4113 scores, both counting floors are exact IEEE-754
    identities, both prohibited failure modes of this campaign are absent, and
    every parameter the approximation needs is either sourced or confirmed
    genuinely absent from the whole repository. What does not follow is the
    producer's headline. Over the window where Approximation 4.9's own D
    component carries the prediction, a structurally unrelated two-parameter form
    fits equally well (0.1051 / 0.1007 against 0.1048 / 0.0987 bits); the
    non-degeneracy control probes points 13-18 exponent units outside the
    acceptance basin and leaves the archived exponent sitting at the basin's
    upper edge; the reported divergence profile is confounded with the package's
    own single-K reduction, with the sign fixed by Jensen and at most 45% of the
    peak explained; about 4.6 of the advertised 34.7 bits of dynamic range belong
    to a parameter-free Gaussian term; and the informative region carries an
    AR(1) effective sample of roughly three. Under docs/inventor-protocol.md
    section 3, a reported signal whose null object of the same shape fits equally
    well is recorded as a CONTROLLED NULL, not as a finding, and that is what is
    recorded here. ONE THING SURVIVES THAT TEST, and the producer never claimed
    it: the exact-model sub-band optimum shifts between the two files by exactly
    the 1.50 the archived integers predict, giving r = 2.122 against 2.130 across
    two independent files - a cross-file consistency check that no tuned
    parameter had to pass, and therefore the one item here that a pure fitting
    artifact would not have had to survive. It is genuine evidence that the
    declared reading of Phi captures something real about the data. It was also
    computed exactly once, by the single independent session this batch got,
    because the first validation died on a provider session limit; and it rests
    on the same unarchived Phi as everything else. NONE OF THIS IS A VERDICT ON
    APPROXIMATION 4.9. The comparison is shape-and-relative with one free
    normalisation, the absolute level is untestable from repository bytes because
    Phi, alpha, delta(beta_bkz) and n_lsc are absent from all of them, and
    nothing here reaches Pwrong below the counting floor, which is where the
    approximation is actually used and where the paper's cost tables apply it 84
    to 208 bits deeper.

  # ------------------------------------------------------------------
  # BOUNDARIES
  # ------------------------------------------------------------------
  boundaries:
    - >-
      NOT A MEASUREMENT OF ML-KEM SECURITY, AND NOT AN ML-KEM OR KYBER BREAK
      CLAIM. No FIPS 203 parameter set is affected or cleared. No security level,
      cost model or attack complexity is asserted or revised; COST-MLKEM-001 is
      untouched. `certificate_refs` is empty because there is nothing to certify:
      no solve, no relation, no decomposition.
    - >-
      TOY PARAMETERS ONLY: q=241, m=40, n=43 and n=50, n_fft=8, k_fft=3,
      avg_N approximately 25971 and 25970. AGENTS.md rule 7 - toy-scale evidence
      is never presented as crypto-scale validation.
    - >-
      THIS SAYS NOTHING ABOUT WHETHER APPROXIMATION 4.9 IS CORRECT IN THE PAPER'S
      OWN ANALYSIS, in either direction. Conclusions bind exactly three objects:
      the two archived verifyModel Pwrong files present in this repository, and
      Approximation 4.9 as written in the archived page extracts UNDER A DECLARED
      READING OF THE UNARCHIVED Phi with one unarchived normalisation. The files
      come from verifyModel/ScoreExperimentalDistribution/, a verification-model
      directory, and no retrieved artifact shows that directory's conventions
      produced Table 5.1 or Table C.2.
    - >-
      THE ABSOLUTE LEVEL IS UNTESTABLE FROM ARCHIVED BYTES. Phi_dlsc, alpha,
      delta(beta_bkz) with Lemma 2.9, and n_lsc are absent from every repository
      byte, independently confirmed. Everything here is shape-and-relative with
      one free scale. Any of the three - Phi's constants, alpha, or delta - is on
      its own sufficient to make the level uncomputable.
    - >-
      NOTHING HERE REACHES BELOW THE COUNTING FLOOR, which is where Approximation
      4.9 is actually used. The floors are 2^-35.70445229 and 2^-36.28941479; the
      Kyber cost table applies the approximation at 2^-119.57 / 2^-177.79 /
      2^-244.03, i.e. 83.87 / 142.09 / 208.33 bits below the validated band
      (EV-MLKEM-018). This record does not narrow that gap by one bit.
    - >-
      AGENTS.md RULE 12 IS UNMET AND UNWAIVED. This record changes nothing about
      EV-MLKEM-011, EV-MLKEM-013, EV-MLKEM-015, EV-MLKEM-017, EV-MLKEM-018,
      H-MLKEM-011, H-MLKEM-013, KN-FIND-012, KN-FIND-014, KN-OPEN-016 or
      KN-OPEN-017, edits no field of any of them, and treats none of them as
      corrected. The KN-FIND-012 restatement, the KN-FIND-014 withdrawal
      successor and the KN-OPEN-016 amendment recorded as PENDING in
      DEC-20260802-937ba9 remain owed and are not cancelled by this record.
    - >-
      NO HYPOTHESIS STATUS CHANGES. H-MLKEM-011 stays `analyzed`; H-MLKEM-013
      stays `analyzed`. Nothing here moves either toward `supported`, `weakened`
      or `rejected`.
    - >-
      ONE INDEPENDENT REVIEW, NOT TWO, AND NO RED TEAM. The first validation
      failed on a provider session limit; no red-team task was dispatched for
      BATCH-009. Both reviews of this record's own quality that a stronger batch
      would have carried are simply absent, and the record is bounded accordingly.

  # ------------------------------------------------------------------
  # UNRESOLVED CONFOUNDS
  # ------------------------------------------------------------------
  unresolved_confounds:
    - >-
      D6 IS ONLY PARTLY QUANTIFIED. Zeroing the whole clip contribution moves the
      prediction by at most 0.682 / 0.685 bits at the residual peak, i.e. at most
      about 45% of the +1.516 / +1.710 peaks. THE MAJORITY OF THE PEAK REMAINS
      UNEXPLAINED and is attributed to neither the model nor the reduction. No
      session has separated the two contributions, and the exact single-K
      alternative (integrating K(dlsc) inside the min(1,.) rather than collapsing
      it first) was never computed.
    - >-
      THE clipped_fraction COLUMN DOES NOT REPRODUCE (D3) AND INDEXES EXACTLY THE
      CONFOUNDED REGION. The discrepancy is 2.8-10.3% in one file and
      -0.5 to -2.2% in the other, with the sign flipping between files; neither
      session established which implementation is right, and the column defines
      the sub-band boundary (755 versus 756) on which the headline sub-band rms is
      computed.
    - >-
      THE DECLARED READING OF Phi IS UNTESTABLE FROM THE ARCHIVE, and the entire
      exponent p depends on it. The D7 sweep bounds how much a wrong reading would
      move the fit; it does not remove the dependence. The favourable cross-file
      shift under `what_survives` rests on the same reading, so it is evidence
      that the reading is CONSISTENT with the data, not that it is correct.
    - >-
      EVERY NOVEL FINDING HERE WAS COMPUTED ONCE. D6, D7, D8, the effective-DoF
      measurement and the cross-file exponent shift all come from a single
      session (VAL-20260803-3346d2) and have never been independently re-derived,
      because the first validation died and no red team was dispatched. This is
      the confound most likely to matter to a future reader and it is stated
      first among the process confounds rather than last.
    - >-
      THE DECAY CONTROL IS STILL ABSENT FROM THE ARCHIVE, unchanged from
      EV-MLKEM-018. nb_iteration was never varied under otherwise-fixed
      parameters; the two files differ in n, n_lat, beta_0, beta_1, avg_N AND
      nb_iteration, so neither is a matched-budget control for the other. The
      cross-file shift under `what_survives` therefore compares two points that
      differ in more than the one variable it reads.
    - >-
      THE EFFECTIVE REPLICATE COUNT IS UNRECOVERABLE. The q^k_fft = 13,997,521
      candidates inside one FFT share the same N dual vectors and the same
      target, so the pooled counting estimate's effective replicate count cannot
      be recovered from the archive, and 2^-35.7045 is a LOWER BOUND on the
      instrument's resolution rather than a demonstrated value. The AR(1)
      autocorrelation measurement above is a diagnostic of this, not a resolution.
    - >-
      THE PRODUCER OF THE .out FILES IS NOT ESTABLISHED FROM BYTES. Algorithm.py
      is not archived, so which code path wrote them is not determinable from the
      repository. Carried unchanged from EV-MLKEM-018.
    - >-
      THE THIRD ARCHIVED PWRONG FILE (beta037_beta144_N200001, nb_iteration=1,
      avg_N=200001) IS STILL NOT IN THE REPOSITORY - header extract and SHA-256
      only, no survival column. EV-MLKEM-018 archival defect A3, still open, and
      it is the one file whose different nb_iteration could have served as a decay
      control.
    - >-
      WHETHER ANY OF THIS TRANSFERS TO CARRIER'S PUBLISHED ANALYSIS IS UNTESTED.
      The verifyModel directory's conventions have not been shown to produce the
      cost tables.
    - >-
      BIT-IDENTITY OF THE PRODUCER'S SUPERSEDED FIRST EXECUTION IS UNCHECKABLE:
      its output was overwritten in place at the same path and is not in the
      snapshot.

