        (50bd293cadf9..., ce23181dca95..., f1e9cf478928...). One environment
        field is unverifiable (D10) and is labelled unverifiable, not false.
    raw_summary_agreement:
      status: two_disagreements_found_and_recorded
      detail: >-
        Checked, and this is where D1 and D3 came from. D1: the REPORT prose
        conflates endpoint-to-endpoint drift with a min..max range, understating
        by 0.110 / 0.123 bits in the claim-favourable direction, while the JSON
