    artifacts"). Four items are derivation-grade and re-runnable by any reader
    from the archived bytes: (i) the counting-floor identity, an exact IEEE-754
    equality in both files; (ii) the exclusion of nb_iteration = 4000 for the
    n=50 file by the file's own quantisation; (iii) Jensen's inequality fixing
    the SIGN of the D6 confound, since min(1, K*L^p) is concave in K; and (iv)
    the null-object fit table and the fine exponent sweep, which are computed
    control measurements over the same archived bytes and are the refutation
    artifact the weakening rests on. What is NOT derivation-grade and is labelled
    so throughout: the positive shape-agreement statement itself, which is
    `empirical_only`, rests on one fitted normalisation and on a declared,
    unarchived reading of Phi, and is exactly the statement this record declines
    to give weight to. No certificate exists or could exist here: there is no
    solve, no relation and no object for a run wrapper to re-verify.

  # ------------------------------------------------------------------
  # SCOPE - stated before any number
  # ------------------------------------------------------------------
  scope_statement: >-
    A RE-ANALYSIS OF ALREADY-ARCHIVED TOY-PARAMETER BYTES. No experiment was run,
    no sampling was performed, no lattice computation, no G6K call and no network
    retrieval took place, and no new data was produced. Everything here is
    recomputed from Carrier, Meyer-Hilfiger, Shen and Tillich's archived
    verifyModel outputs at q=241, m=40, n=43 and n=50, n_fft=8, k_fft=3,
    avg_N approximately 25971 and 25970, nb_iteration 4000 and 6000, together
    with the archived page extracts of that paper under
    inputs/MLKEM-DUAL-SOURCES-20260802/. The underlying measurement remains a
    single un-replicated third-party run set that this program has never
    re-executed, and the archive still contains no matched-budget decay control
    (nb_iteration was never varied under otherwise-fixed parameters).

  claim_tier_note: >-
    `toy` is the ceiling and it is not close. q=241 against ML-KEM's q=3329 and
    beta approximately 384-816; the whole comparison lives in two files of a
    verification-model directory. AGENTS.md rule 7: toy-scale evidence is never
    presented as crypto-scale validation. Nothing here is a measurement of ML-KEM
    security and no medium-scale or crypto-scale claim is made or implied. Note
    that EV-MLKEM-011 carries `medium` on overlapping bytes; this record does not
    change that record's field and does not adopt its tier.

  direction_note: >-
    `neutral`, and that is the honest reading rather than a hedge. H-MLKEM-011 is
    a COVERAGE claim - that the archived Fig 4.1 Pwrong measurement does not
    reach the Pgood approximately 1/2 operating threshold - and this record
    measures something else entirely: how a recomputed Approximation 4.9 compares
    against the measurement INSIDE the band that was resolved. It neither
    supports nor weakens the coverage claim, and it says nothing about behaviour
    below the counting floor, which is where the coverage question lives and
    where Approximation 4.9 is actually used. With respect to H-MLKEM-013 the
    bearing is likewise `neutral` and is confirmatory only: the score-scale check
    below independently reproduces EV-MLKEM-018's finding from a third
    computation, and adds no new consequence. Above all, `neutral` is NOT a
    verdict on Approximation 4.9. EV-MLKEM-018's boundary - "NOTHING HERE SHOWS
    APPROXIMATION 4.9 IS WRONG, NOR THAT IT IS RIGHT" - survives this batch
    unchanged; what BATCH-009 establishes is that the cheapest test the archive
    supports has now been RUN, and that it does not discriminate.

  strength_note: >-
    `preliminary`, and the cap is deliberate and load-bearing. THREE reasons,
    each sufficient on its own.
    (1) THE REQUIRED NULL CONTROL DOES NOT DISCRIMINATE. Under
    docs/inventor-protocol.md section 3 a reported signal is an artifact until
    the identical measurement is run against a null object of the same shape. The
    producer ran no such control. The validator ran one and, over the sub-band
    where Approximation 4.9's D component actually carries the prediction, the
    structurally unrelated two-parameter form a + b*T^(1/3) fits at rms
    0.1051 / 0.1007 bits against the Approximation 4.9 tail form's
    0.1048 / 0.0987. That is a controlled null, and a controlled null caps the
    evidential weight of the agreement hard - it is a measurement about the
    window, not about the model family.
    (2) THE INTERPRETIVE CONTENT WAS COMPUTED ONCE. The arithmetic is genuinely
    replicated - two independent implementations, the producer's hand-rolled
    Gauss-Legendre code and the validator's numpy/scipy re-implementation, agree
    on the per-score prediction column to <= 6.6e-04 bits over all 4113 scores.
    But every finding this record actually leans on - the D7 acceptance-set
    sweep, the D8 null table, the D6 clip correlation, the effective-degrees-of-
    freedom measurement, and the favourable cross-file exponent shift - was
    produced by exactly ONE session (VAL-20260803-3346d2) and has never been
    independently re-derived by anyone, including me. The first validation, which
    would have been the second pair of eyes on the package, died before writing
    anything (see `failed_first_validation`).
    (3) THE MEASUREMENT UNDER COMPARISON IS ITSELF UN-REPLICATED, and its
    informative region carries about three independent observations, not
    approximately 1800 - see `effective_degrees_of_freedom`.
    `replicated` was considered and refused: it would be read as "this finding is
    replicated", when what is replicated is a recomputation and what is not
    replicated is everything the record concludes from it.

  # ------------------------------------------------------------------
  # THE FRAMING - what survives, stated first
  # ------------------------------------------------------------------
  headline_framing: >-
    THE ARITHMETIC IS SOLID AND THE HEADLINE IS MUCH WEAKER THAN IT WAS WRITTEN.
    The producer's package leads with "with one fitted scale, the recomputed
    Approximation 4.9 tracks the measurement across the entire resolved band -
    34.7 bits of dynamic range", tightly in the tail (rms 0.283 / 0.274 bits over
    the sub-band). Every number in that sentence reproduces. Its EVIDENTIAL
    WEIGHT does not survive three independent findings of the successor
    validation: a null object of the same shape fits equally well (D8), the
    non-degeneracy control tests a regime the data never made plausible and in
    fact places the archived exponent at the UPPER ENDPOINT of its own acceptance
    set (D7), and the reported divergence profile is confounded with the
    package's own single-K reduction with the sign fixed by Jensen (D6). On top
    of that, of the quoted 34.7 bits, 4.6 are carried by the PARAMETER-FREE
    Gaussian term Q(T) at rms 0.010 bits with zero free parameters - that is
    Model 4.7's success, not Approximation 4.9's - and the informative region
    carries an AR(1) effective sample of about three.
    WHAT SURVIVES IS SOMETHING THE PRODUCER NEVER CLAIMED: a cross-file
    consistency check that no tuned parameter had to pass. This record adopts the
    validator's framing (VAL-20260803-3346d2, central_question_judgement) as its
    own, and elevates the surviving item to the headline position the producer
    left empty.

  what_survives:
    - >-
      THE STRONGEST SINGLE ITEM IN THE PACKAGE, AND THE PRODUCER LEFT IT ON THE
      TABLE: A CROSS-FILE CONSISTENCY CHECK WITH NO TUNED PARAMETER. The
      exact-model sub-band optimum shifts between the two files by EXACTLY 1.50
      (24.50 for n=43 -> 23.00 for n=50), which is precisely the shift the
      archived integers predict: p = (beta_sieve + n_fft)/2 gives
      (44+8)/2 = 26.0 and (41+8)/2 = 24.5, so dp = (44-41)/2 = 1.50. Equivalently,
      under the generalised reading Phi = exp(-(a*x^r + b*y^r)) with
      p = (beta_sieve + n_fft)/r, the two files independently return
      r = 52/24.5 = 2.122 and r = 49/23.0 = 2.130 - agreeing across two
      independent files to 0.4%, against the value r = 2 that the archived (4.19)
      implies. Separately, the FREE two-parameter tail fit on the sub-band
      recovers slope b = 26.515 against the a-priori 26.0 (n=43) and b = 24.549
      against 24.5 (n=50). A pure fitting artifact would not have to pass a
      between-file consistency check that nothing was tuned to satisfy. This is
      genuine evidence that the declared reading of Phi captures something real
      about the data. CAVEAT, stated with it and not below it: it was computed by
      ONE session and has never been independently re-derived, and it rests on
      the same unarchived reading of Phi as everything else here.
    - >-
      COROBORATION OF THE SAME ITEM AT COARSER RESOLUTION. Among the
      integer/half-integer readings r in {1, 1.5, 2, 3, 4}, r = 2 gives the
      lowest whole-band rms in BOTH files (0.706 / 0.697, against 5.943 / 6.282
      at r=1, 2.492 / 2.647 at r=1.5, 1.053 / 1.320 at r=3, 1.566 / 1.986 at
      r=4). This is a coarse discrimination and it is real; the fine sweep in D7
      is what shows it does not extend to selecting the archived exponent within
      its own family.
    - >-
      THE ARITHMETIC AND THE REPRODUCTION. 20 of the validator's 26 metric
      recomputations are marked `reproduced` outright, one
      `reproduced_and_strengthened`, one `reproduced_with_tolerance_sensitivity`;
      the remaining three defects and one `unable_to_check` are enumerated below.
      Decisively, the validator's INDEPENDENT re-implementation of Approximation
      4.9 evaluated at the producer's own log2 K matches the producer's per-score
      prediction column to <= 6.57e-04 bits (n=43) and <= 4.65e-04 bits (n=50)
      across all 4113 scores; the log2 Q column matches to 3e-14, the measured
      column exactly, and the log2 P(D >= T) column to 7e-15. Two independent
      implementations - a hand-rolled Gauss-Legendre quadrature under a recorded
      absence of numpy/scipy, and a numpy/scipy implementation cross-checked
      against scipy.integrate.quad - agree far below any reported precision.
    - >-
      BOTH PROHIBITED FAILURE MODES ARE ABSENT, and both were checked explicitly
      because this campaign has already hit each of them. (a) THE COUNTING FLOOR:
      nothing in the package is compared, fitted, anchored, scanned or
      extrapolated at or above the first zero in either file. The per-score table
      covers scores 0..1802 (1803 rows) and 0..2309 (2310 rows) contiguously, no
      `measured` value is <= 0, the exponent-scan fit ranges are [0,1802] and
      [0,2309], the anchors are at 213/1492 and 214/1968, and the shape-test
      ranges are [643,1492] and [600,1968] - all inside the band. (b) THE VOID
      k_fft ALIGNMENT: no alignment is applied anywhere. The validator re-derived
      two estimators of sigma = sqrt(E[F^2 | F >= 0]) from each file's own
      survival column and obtained ratios 0.9996 / 0.9986 (n=43) and
      1.0020 / 1.0002 (n=50) against Model 4.7's raw prediction sqrt(avg_N/2),
      versus 2.9987 / 2.9957 and 3.0060 / 3.0007 against the /k_fft alternative.
      This is a THIRD independent reproduction of EV-MLKEM-018's finding and it
      changes nothing about that record's status.
    - >-
      THE COUNTING FLOORS, EXACTLY. 4000 * 241^3 = 55,990,084,000 and
      1/that = 1.7860305406935986e-11 = 2^-35.70445229; 6000 * 241^3 =
      83,985,126,000 and 1/that = 1.1906870271290657e-11 = 2^-36.28941479. In
      BOTH files the last positive survival value equals the floor as a
      bit-for-bit IEEE-754 equality, and every value in each file is an integer
      multiple of the quantum. Resolved bands [0,1802] with first zero 1803, and
      [0,2309] with first zero 2310. This is a fourth-and-fifth independent
      reproduction of the identity EV-MLKEM-018 recorded.
    - >-
      A PRODUCER CONCLUSION THAT IS NOT MERELY DEFENSIBLE BUT FORCED BY THE
      BYTES, and here the package under-argued itself (D12). The Fig 4.1 caption
      says nb_iteration = 4000 for both panels; the n=50 file's header says 6000
      and the producer used the header "since it is the file's own record". The
      validator settled it from the data alone: the n=50 values are exact integer
      multiples of 1/(6000*241^3) (max |count - round| = 3.8e-06) and are NOT
      integer multiples of 1/(4000*241^3) (max deviation 0.3333), and the last
      positive value is exactly two thirds of the 4000-quantum. The caption's
      4000 is EXCLUDED BY THE FILE'S OWN BYTES. Consistent with EV-MLKEM-018,
      which already recorded 6000 for this file.
    - >-
      THE FOUR UNAVAILABLE PARAMETERS ARE GENUINELY ABSENT, INDEPENDENTLY
      CONFIRMED, AND THE UNTESTABILITY CONCLUSION IS RIGHT THOUGH UNDER-ARGUED.
      Phi_dlsc appears only in the page-23 and page-25 extracts, always used and
      never defined (Approximation 4.6, which introduces it, is on a page never
      retrieved); delta(beta_bkz) is symbolic in (4.24) only, with no numerical
      value anywhere and none in KN-TECH-020; alpha appears only symbolically in
      (4.19) and the page-25 locus; n_lsc appears once, undefined. The validator
      searched inputs/, knowledge/, ledger/, coordination/ and experiments/,
      excluding the producer's own directory, and confirms all four. So "the
      absolute level of Approximation 4.9 is untestable from archived bytes" is
      RIGHT - but the producer pinned it principally on delta, when alpha and
      Phi's constants are EACH independently sufficient and delta is the weakest
      of the three links, being a standard predictable quantity in the wider
      literature. The delta arithmetic itself checks out: 44*31 = 1364,
      41*41 = 1681, and a 0.1% change in delta moves the level by 1.97 and 2.42
      bits.
    - >-
      TWO DISCLOSURE ITEMS THAT ARE CLEAN. alpha was recorded as an unverified
      candidate (the Pgood header's alpha_secret=2 / alpha_error=2) and NEVER
      BOUND to any computation - every occurrence in the script is a comment, a
      parameter-ledger string, a files_not_compared field or a stdout line, and
      p = (beta_sieve + n_fft)/2 contains no alpha by construction. And the
      self-reported 1394 -> 1681 erratum is confined to a descriptive
      what_this_blocks string, occurs exactly once in the script and once in the
      JSON, is bound to no variable and enters no expression.
    - >-
      SCOPE DISCIPLINE. The validator hunted for an ML-KEM claim, a crypto-scale
      inference and a status change, and found none: "The report's section 7
      non-claims are correct and I found no sentence in the package that violates
      them." No fabricated command, output, timing, statistic, citation or run was
      found.

  # ------------------------------------------------------------------
  # WHAT DOES NOT SURVIVE - the three major defects that drive the framing
  # ------------------------------------------------------------------
  what_does_not_survive_scrutiny:
    - id: D8
      severity: major
      title: >-
        THE REQUIRED NULL-OBJECT CONTROL WAS ABSENT, AND WHEN RUN IT DOES NOT
        DISCRIMINATE. This is the finding that caps this record.
      detail: >-
        docs/inventor-protocol.md section 3 is binding and unambiguous: any
        reported signal is an artifact until the identical measurement has been
        run against a null object of the same shape, and if the numbers match the
        result is a CONTROLLED NULL, not a finding. The producer ran no null
        object. The validator ran one. Best two-parameter fit of log2(measured)
        on the clip-negligible AND count >= 10 sub-band, one shape variable each,
        rms in bits (n=43 / n=50): the Approximation 4.9 tail form
        a + b*log2 ln(N/T) gives 0.1048 / 0.0987; a + b*T^(1/3) gives
        0.1051 / 0.1007; a + b*log2 T gives 0.1242 / 0.1092; a + b*sqrt(T) gives
        0.1110 / 0.1541; a + b*T gives 0.1723 / 0.3455; a + b*T^2 gives
        0.3481 / 0.7204. Over the window where Approximation 4.9's D component
        actually carries the prediction, its functional form is INDISTINGUISHABLE
        from a cube-root tail at the same number of free parameters. Only the
        pure Gaussian shapes are clearly excluded. CONSEQUENCE: the reported
        shape agreement does not select Approximation 4.9's functional form over
        generic smooth two-parameter alternatives, and under the inventor
        protocol the reported signal must be treated as an artifact until shown
        otherwise. It is not shown otherwise here.
    - id: D7
      severity: major
      title: >-
        THE NON-DEGENERACY CONTROL IS TOO WEAK, AND THE ARCHIVED EXPONENT IS THE
        UPPER ENDPOINT OF ITS OWN ACCEPTANCE SET.
      detail: >-
        The producer's control scans the exponent p at 10 and 40 and reports rms
        1.96 and 3.63 (n=43), 2.35 and 4.38 (n=50), concluding that "a
        one-parameter family of this shape does not fit the data automatically".
        Those figures reproduce (validator's whole-band refit: 1.893 / 3.626 and
        2.327 / 4.382, and intermediate points to <= 0.07 bits). But a FINE sweep
        - p from 10 to 40 in steps of 0.5, refitting K at each p - shows the
        basin is wide and the archived exponent sits at its edge. Whole band:
        {p : rms <= rms at the archived p} = [20.5, 26.0] for n=43 (archived p
        = 26.0, width 5.5) and [20.0, 24.5] for n=50 (archived p = 24.5, width
        4.5). {p : rms <= 1 bit} = [18.0, 27.5] and [18.5, 25.5]; {p : rms <= 2
        bits} = [10.0, 32.0] and [12.5, 30.0]. On the clip-negligible sub-band
        {p : rms <= 1 bit} widens further to [15.0, 33.5] and [16.5, 29.5]. IN
        BOTH FILES THE ARCHIVED EXPONENT IS THE UPPER ENDPOINT OF ITS OWN
        ACCEPTANCE SET: the whole-band optimum is p = 23.0 (rms 0.427 against
        0.706 at p = 26) and p = 22.0 (rms 0.431 against 0.697 at p = 24.5). The
        producer's p = 10 and p = 40 sit 13-18 units from the optimum, far
        outside the basin, so the control as run tests a regime the data never
        made plausible and discriminates almost nothing. It establishes
        non-degeneracy in the weakest possible sense. NOTE, in the producer's
        favour: nothing is concealed - the report's own section 4.4 discloses the
        preference for a lower exponent and derives r = 2.17 / 2.23. This is a
        control-STRENGTH failure, not concealment.
    - id: D6
      severity: major
      title: >-
        THE HEADLINE DIVERGENCE PROFILE IS CONFOUNDED WITH THE PACKAGE'S OWN
        K(dlsc) -> Kbar REDUCTION, AND JENSEN FIXES THE SIGN.
      detail: >-
        The script's own text states that collapsing K(dlsc) to a single
        effective Kbar is exact only in the unclipped regime and is "an
        approximation rather than an identity" where the clip binds. The report
        does not carry that caveat into its interpretation. min(1, K*L^p) is
        CONCAVE in K, so by Jensen the single-Kbar prediction is an UPPER BOUND
        exactly where the clip binds - which is the SIGN of the reported
        divergence. Measured association: corr(residual, clipped fraction) =
        0.916 (n=43) and 0.904 (n=50); mean residual +0.959 / +1.103 where the
        clipped fraction exceeds 1%, against -0.231 / -0.193 where it is below
        0.1%; the residual peak sits at clipped fraction 0.377 / 0.378 and the
        clip peak at 0.388 / 0.400. Upper bound on the effect, computed rather
        than asserted: zeroing the entire clip contribution moves the prediction
        by at most 0.682 and 0.685 bits at the residual peak, so AT MOST about
        45% of the +1.516 / +1.710 peaks is attributable to the reduction rather
        than to the model-versus-data comparison. That is a PARTIAL, not a
        complete, explanation - the remaining majority of the peak is
        unexplained, and is recorded below as an unresolved confound rather than
        argued away. The report reads the coincidence with the clipped fraction
        only as the D-versus-Gaussian crossover, and does not state the direction
        of the bias.
    - id: D9
      severity: moderate
      title: >-
        THE FRAMING OVERSTATES EVIDENTIAL WEIGHT BY MERGING TWO REGIMES AND
        INVITING A PER-POINT READING.
      detail: >-
        "tracks the measurement across the entire resolved band - 34.7 bits of
        dynamic range" merges a parameter-free regime with a one-parameter one.
        Of the quoted 34.7 / 35.3 bits, 4.61 and 2.91 are carried by the
        parameter-free Gaussian Q(T), which over that stretch matches to rms
        0.0100 and 0.0059 bits with ZERO free parameters: Q carries >= 50% of the
        prediction for scores 0..234 and 0..172. That is Model 4.7's success, not
        Approximation 4.9's. Sections 4.3(6) and 5(7) of the report contain the
        corrective facts; the headline sentence does not.
    - id: D1
      severity: moderate
      title: >-
        A DRIFT STATISTIC IS CONFLATED, AND THE ERROR RUNS IN THE
        CLAIM-FAVOURABLE DIRECTION.
      detail: >-
        Report section 4.3(1) says the per-score solved scale "drifts by only
        1.150 bits (n=43, over scores 643-1492, range -73.298 ... -72.038)" and
        1.238 bits for n=50 (600-1968, range -67.942 ... -66.582). The quoted
        endpoints are right (validator: -73.298 / -72.038 and -67.943 / -66.582)
        but max-min over those ranges is 1.260 and 1.361, not 1.150 and 1.238.
        The sentence presents the endpoint-to-endpoint drift and the min..max
        range as one quantity. comparison_results.json is CORRECT and carries
        both statistics under distinct keys; the defect is in the report prose.
        Recorded prominently because the larger figure is the conservative one
        and is the one that measures how badly a single K serves the sub-band, so
        the understatement of 0.110 / 0.123 bits runs in the direction favourable
        to the claim.
    - id: D2
      severity: minor
      title: A statistic's stated definition is wrong (non-load-bearing).
      detail: >-
        The reported Pgood median 11964.802334 is the UPPER of the two central
        order statistics (v[2000]); the LOWER is v[1999] = 11964.145101 and their
        average, 11964.473718, is EV-MLKEM-018's value. The report says "the
        lower". The number is a genuine order statistic; only its stated
        definition is wrong. Non-load-bearing: Approximation 4.9 is the
        wrong-guess statement and Pgood is not compared anywhere in the package.
    - id: D3
      severity: minor
      title: >-
        THE clipped_fraction COLUMN DOES NOT REPRODUCE, AND IT SITS ON EXACTLY
        THE REGION D6 IDENTIFIES AS CONFOUNDED.
      detail: >-
        At the producer's own K, the validator's exact clip mass
        Q(T - u*) - Q(T) divided by the prediction is 2.8-10.3 percent HIGHER
        than the producer's column for n=43 and 0.5-2.2 percent LOWER for n=50.
        The sign FLIPS between files, which points to a quadrature treatment of
        the clip boundary rather than a definitional difference; neither session
        resolved which is right. Only visible consequence: the declared
        clip-negligible sub-band starts at 755 (producer) versus 756 (validator),
        moving n from 738 to 737 and the sub-band statistics in the third
        decimal. Recorded here rather than filed as trivia because the clip
        fraction is the very quantity D6 correlates the residual against, so the
        one column that does not reproduce is the one that indexes the confound.
    - id: D5
      severity: moderate
      title: A budget-contract record is wrong.
      detail: >-
        The handoff sets maximum_runs = 1; two script executions were performed;
        receipt.json records `budget_exceeded: false` alongside
        `script_executions_performed: 2` and `maximum_runs_allowed: 1`. The
        boolean is wrong. The overrun is fully disclosed elsewhere and its reason
        is sound - execution 1 used a linearised Pwrong = Q + K*J diagnostic that
        is invalid wherever the min(1,.) clip binds, the producer identified the
        defect, replaced the diagnostic with an exact per-score bisection and
        re-ran - but the correct record would be `budget_exceeded: true` with
        that mitigation. AGENTS.md rule 9 forbids reporting a budget state that
        did not obtain, whichever direction it errs in.
    - id: D4_D10_D11_D12
      severity: informational_to_minor
      title: Four further disclosed defects, recorded for completeness.
      detail: >-
        D4: the exponent scan fits K on 47 (n=43) and 59 (n=50) SUBSAMPLED
        scores, not on the resolved band; the report says only "over the fit
        grid" while the reader compares those rms values against the whole-band
        0.706 / 0.697. Immaterial numerically (whole-band refit agrees to <= 0.07
        bits); a transparency gap. D10: receipt.json records
        numpy_available: false and scipy_available: false, which could not be
        reproduced under the same recorded Python 3.11.15 and platform; recorded
        as UNVERIFIABLE, not as a falsehood, and immaterial because the
        validator verified the producer's quadrature against
        scipy.integrate.quad and reproduced J(T=1802) to 6e-15 relative. D11:
        report section 2 says the archived (4.19) "forces" Phi to be exponential
        in a negative quadratic form while section 5(2) calls the same thing "a
        declared reading" - (4.19) fixes one functional of Phi and rules out
        readings with no decay in y but does not determine Phi; the script's own
        text uses the correct weaker phrasing and the stronger word appears in
        the section a reader reaches first. D12: two places where a correct
        conclusion is under-argued (the nb_iteration exclusion and the
        untestability attribution), both recorded under `what_survives` above.
    - id: UNABLE_TO_CHECK
      severity: recorded_not_a_defect
      title: One claim could not be checked at all.
      detail: >-
        "the script was run twice and every retained number is bit-identical
        between the two runs" is `unable_to_check`: execution 1's
        comparison_results.json was overwritten IN PLACE at the same path and is
        not in the snapshot, so no artifact exists to diff. The disclosure itself
        is complete and quotes the superseded numbers (spurious drift
        15.3854 / 13.0930 bits; linear-form best p 21.0 / 20.5). The validator's
        independent re-derivation is consistent with the retained values, which
        says nothing about the producer's first run.

  # ------------------------------------------------------------------
  # EFFECTIVE DEGREES OF FREEDOM - why "~1800 points" is not ~1800 constraints
  # ------------------------------------------------------------------
  effective_degrees_of_freedom:
    finding: >-
      THE POINT COUNT IS NOT THE CONSTRAINT COUNT, AND THE GAP IS THREE ORDERS OF
      MAGNITUDE. In the region where Approximation 4.9's D component carries the
      prediction the model is log2 pred = log2 K + p*X with X = log2 ln(N/T),
      i.e. a straight line in X with one fitted intercept.
    lever_arm: >-
      X spans only 0.3080 (n=43) and 0.4709 (n=50) across the whole informative
      sub-band - a third to a half of one octave. A short lever arm cannot
      separate slope from intercept.
    autocorrelation: >-
      Residual lag-1 autocorrelation is 0.992 (n=43) and 0.996 (n=50), giving a
      naive AR(1) effective sample size of 3.1 out of 737 points and 2.6 out of
      1242. The reason is structural rather than statistical: the measurement is
      ONE pooled cumulative count from 4000 / 6000 iterations, so consecutive
      scores are nearly the same statistic.
    consequence: >-
      "Shape matching across approximately 1800 points" is, in the informative
      region, a one-parameter intercept fitted on a short log-log line carrying
      about THREE independent observations. This is not a defect in the
      producer's arithmetic; it is a property of the archived instrument, and it
      is the reason D8's non-discrimination is unsurprising rather than anomalous.
      Any future test of Approximation 4.9's functional form against this archive
      must either lengthen the lever arm or accept that it is testing three
      numbers.

  # ------------------------------------------------------------------
  # THE FAILED FIRST VALIDATION - named, and why it is not evidence
  # ------------------------------------------------------------------
  failed_first_validation:
    task_id: TASK-20260802-08f428
    class: failed_infrastructure
    what_happened: >-
      The first independent validation of the F1 package terminated on a provider
      session limit ("You've hit your session limit, resets 1:10am UTC") before
      it wrote validation_report.yaml. Its completion gate - every quantitative
      claim marked reproduced / not_reproduced / unable_to_check with a reason,
      and explicit answers to the resolved-band and score-scale checks - lives in
      that file and was therefore never met, regardless of how complete its
      preserved notes appear.
    why_it_is_not_evidence: >-
      AGENTS.md rule 5: a timeout, crash or infrastructure failure is NEVER
      evidence for or against a mathematical hypothesis. This receipt records
      that a session ended on a provider limit. It says nothing about whether
      Approximation 4.9 tracks the archived measurement, nothing about the
      quality of the F1 package, and nothing about ML-KEM. Its preserved
      validation_notes.md is NOT a verdict, carries no `verdict` field, and may
      not be cited as an independent validation of TASK-20260802-8bae8e by this
      or any downstream record. NOTHING IN EV-MLKEM-019 RESTS ON IT.
    why_it_is_nevertheless_a_source_task_of_this_archive: >-
      A failed task's artifacts are still artifacts and must be archived exactly
      once (AGENTS.md "Durable research commits"). Its declared artifact for this
      ledger archive is its infra_failure_receipt.yaml, which this archive updates
      to record its successor, that successor's verdict and the final disposition
      of the blockage. Leaving a failure receipt without its resolution is how a
      program accumulates permanently ambiguous state.
    artifact_path_amendment: >-
      Recorded because it is a real cost of the failure. The task's ORIGINAL
      declaration named validation_report.yaml, a file that does not exist and
      never will. A Coordinator amendment (dispatch_queue.json,
      TASK-20260802-08f428.coordinator_amendment, 2026-08-03) narrowed
      artifact_paths to the failure receipt. validation_notes.md remains committed
      at 08ff430260c5 and is not re-declared; nothing was deleted or rewritten.
    successor: TASK-20260803-01f419
    only_one_independent_review_exists: >-
      STATED PLAINLY BECAUSE IT BOUNDS THIS RECORD. Because the first validation
      died, the F1 package received ONE independent review, not two. No red-team
      task was dispatched for BATCH-009. Every novel finding this record leans on
      (D6, D7, D8, the effective-DoF measurement, the cross-file exponent shift)
      therefore rests on a single session's computation, unchecked by any other.
      That is the principal reason `strength` is capped at `preliminary`.

  # ------------------------------------------------------------------
  # VALIDATION PROCESS NOTE - how the superseded notes were handled
  # ------------------------------------------------------------------
  validation_process_note:
    why_recorded: >-
      A superseded, unfinished review sitting in the tree is a contamination
      hazard for its successor, and the handoff required disclosure. The
      successor handled it correctly and the handling is recorded so a future
      auditor need not reconstruct it.
    what_the_successor_did: >-
      It read TASK-20260802-08f428's infra_failure_receipt.yaml IN FULL, and of
      that task's validation_notes.md it read ONLY the section-heading lines (a
      grep of lines beginning with '#'/'##' plus lines containing
      "defect"/"verdict"), and only AFTER every one of its own computations was
      already complete and recorded. It read none of that file's body text,
      tables or numbers.
    what_it_disclosed: >-
      Exactly that, in validation_notes.md section 12 and in
      validation_report.yaml.supersession_note. It further recorded that two of
      the dead session's headings indicate overlapping coverage with its own
      sections 6.6 and 10, which it had already derived and written, and stated
      that the overlap "should not be read as corroboration, since that session
      never reached a verdict and its work was never checked". No number, finding
      or line of reasoning in VAL-20260803-3346d2 is taken from the superseded
      notes.
    coordinator_assessment: >-
      Correct on all three counts that matter: independence preserved by ordering
      (own computations first), exposure minimised and bounded, and disclosure
      exact rather than gestural. I accept the report as an independent
      re-derivation. The overlap is explicitly NOT counted as a second
      confirmation anywhere in this record.

  # ------------------------------------------------------------------
  # COORDINATOR VALIDITY CHECK BEFORE INTERPRETATION
  # ------------------------------------------------------------------
  coordinator_validity_check:
    performed_before_interpretation: true
    scope_of_what_i_did: >-
      STATED FIRST SO NOTHING IS OVERREAD: I ran NO computation for this record. I
      read the producer package, the failure receipt, the successor validation
      report and its notes, and I checked the run set for validity against the
      criteria AGENTS.md requires of me before interpreting any producer result.
      Where I record a number below it is the validator's or the producer's and
