  what_this_evidence_is: >-
    A SHAPE comparison between Carrier et al.'s Approximation 4.9 and the
    authors' own archived Pwrong measurement, confined to the band the archived
    simulation actually resolved. It is not a validation of Approximation 4.9,
    not a measurement of ML-KEM security, and not a cost-model statement.

  the_decisive_scope_limit: >-
    THE PREDICTION'S NORMALISATION IS FITTED TO THE DATA BEING COMPARED. The
    constant K is obtained by fitting on the same archived curve the prediction
    is then scored against, so this is a test of SHAPE, never of LEVEL. The
    producer states this plainly and repeatedly and the validator confirmed it;
    that candour is why the package is admissible at all. Any reading of the
    agreement as evidence that Approximation 4.9 predicts the right absolute
    Pwrong is unsupported by this record.

  observations:
    - >-
      O-1 (ESTABLISHED, Coordinator-verified). The resolved band is bounded
      below by the counting floor 1/(nb_iteration * q^k_fft) = 1/(4000 * 241^3)
      = 1.786030540693598580e-11 = 2^-35.70445229, reached as exact IEEE-754
      equality at score 1802 with the first zero at 1803. The Coordinator
      recomputed 1/(4000*241^3) independently and it agrees to the printed
      precision. Every archived value is an integer multiple of that quantum
      (maximum relative deviation 2.17e-16). This is the estimator's sampling
      resolution, not a property of the distribution.
    - >-
      O-2 (ESTABLISHED). RESOLVED-BAND CHECK PASSES. per_score carries exactly
      1803 rows over scores [0, 1802]; the fit grid, scan grid, anchors 213 and
      1492, and the K-solved profile are all slices of that band. Nothing is
      compared, fitted, anchored or extrapolated past the counting floor. One
      disclosed limitation: scale_check sums its moment series over trailing
      zeros, which contribute exactly 0 (relative bias < 6e-5).
    - >-
      O-3 (ESTABLISHED). SCORE-SCALE CHECK PASSES on the raw undivided scale.
      The sigma estimators reproduce to every printed digit (113.9051 and
      113.7914 against sqrt(avg_N/2) = 113.9539, ratios 0.9996 and 0.9986 raw
      versus 2.9987 and 2.9957 under a /k_fft reading). The validator
      corroborated this two ways the producer did not use: FFT_sample.py line 30
      in the hash-verified vendor tree defines the score as an unnormalised
      cosine sum, and a zero-parameter Q(T) = 0.5*erfc(T/sqrt(N)) tracks the
      measurement within 0.1 bit to score 322, where a factor-3 slip would be
      immediately visible. This matters because the k_fft = 3 asymmetry recorded
      in KN-FIND-014 would otherwise shift every comparison point silently.
    - >-
      O-4 (REPRODUCED INDEPENDENTLY). The validator re-derived Approximation 4.9
      from the archived text before reading the producer's code and implemented
      it by a different method -- integrating in u with the min(1,.) kink placed
      at its exact location u* = N*exp(-K^{-1/p}) and the clipped piece in closed
      form -- against the producer's 4370-node grid in v = ln(N/u). At the
      producer's K the two agree on every reported figure: n=43 min -0.9325 at
      score 1616, max +1.5154 at 471, mean +0.2449, rms 0.7055, 12 sign changes
      first at 888; n=50 min -0.9170 at 2283, max +1.7109 at 420, mean +0.1920,
      rms 0.6969, 14 sign changes. An independent whole-band fit gives
      log2 K = -72.711622 / -67.219917 against the producer's -72.712581 /
      -67.222505.
    - >-
      O-5 (REPRODUCED). Re-executing the committed script into a sandboxed path
      mirror, touching no producer artifact, reproduced comparison_results.json
      bit-identically except for six timing leaves.
    - >-
      O-6 (ADVERSE, and the most informative observation in this batch). The
      validator ran a nearby-object control the package did not: fitting the
      n=50 file's archived exponent p = 24.5 to the n=43 data gives rms 0.4965,
      BETTER than that file's own p = 26 (rms 0.7055). Discrimination is
      therefore one-sided. The agreement demonstrates that a model of this
      family can be made to track the curve; it does not demonstrate that
      Approximation 4.9's particular exponent is the one the data select. The
      producer disclosed the underlying fact that both files prefer p about 2
      lower, but did not run the control that bounds what the agreement means.
    - >-
      O-7 (DEFECT, moderate, D5). Approximation (4.22) places the d_lsc integral
      INSIDE min(1,.); the script computes min(1, Kbar * L^p). Because min(1,.)
      is concave, Jensen makes the collapsed model an UPPER bound. Both headline
      peaks (+1.5154 at score 471 and +1.7109 at 420) sit at clip fractions
      0.361 and 0.381, so the bias has the SAME SIGN as the reported
      over-prediction and is unquantified. The reported peak over-prediction
      cannot be attributed to Approximation 4.9 rather than to this collapse
      until the bias is bounded.
    - >-
      O-8 (DEFECT, moderate, D4). The claim that (4.19) "forces"
      Phi = exp(-(a x^2 + b y^2)) is overstated: (4.19) pins the x = ||w_lat||
      dependence and a Gaussian in d_lsc but says nothing about y = ||w_lsc||,
      which is what carries n_fft into p. The report elsewhere correctly calls
      this form "declared, not archived", so the package is internally
      inconsistent on its own load-bearing assumption.
    - >-
      O-9 (DEFECT, moderate, D3). delta(beta_bkz) is declared UNAVAILABLE, but
      root_hermite_factor(beta) is defined at utilitary.py line 16 in the same
      hash-verified vendor tree that produced the data (delta(32) = 1.012528410,
      delta(35) = 1.012604644). The report's conclusion that the absolute level
      cannot be checked is correct in outcome but wrong in cause: what blocks it
      is alpha and Phi's form, not a missing delta.
    - >-
      O-10 (PROCESS DEFECTS, recorded). D6: maximum_runs_allowed 1 against
      script_executions_performed 2 with budget_exceeded false. D7: execution
      one's JSON was overwritten in place rather than superseded, so the
      bit-identity claim is unverifiable from the archive alone -- an AGENTS.md
      rule 4 violation in packaging. D8: task_completed_utc 23:58:00Z postdates
      the 23:49:11Z commit that already contains that string. D9: the Pgood
      median 11964.802334 is the upper central order statistic, not the lower as
      labelled. D1, D2, D10, D11 are smaller labelling and self-check defects.

  controls:
    positive_control: present (parameter-free Q(T) tracks to 0.1 bit through score 322)
    model_family_control: present (p-scan; rms rises 1.96 -> 3.63 at p = 10 and 40)
    null_object_control: >-
      ABSENT in the docs/inventor-protocol.md section 3 sense. The validator's
      nearby-object control (O-6) partially substitutes and its result is
      adverse to the strength of the agreement.

  inference: >-
    Over the resolved band only, and with the normalisation fitted to the same
    data, a model of Approximation 4.9's family reproduces the archived Pwrong
    survival shape to rms 0.70 bits with the deviation changing sign 12 to 14
    times. Both gate checks pass and the arithmetic reproduces independently by
    a different implementation. What the batch does NOT establish is that
    Approximation 4.9 specifically is the model the data select: the nearby-object
    control fits BETTER with a neighbouring exponent, and the min(1,.) collapse
    biases the comparison in the same direction as its headline finding. The
    honest summary is that the instrument works and the shape is compatible; the
    discriminating question is untouched.

  boundaries:
    - >-
      Shape only, never level. K is fitted to the compared data.
    - >-
      Resolved band only: scores 0..1802, Pwrong in [2^-35.70, 2^-1], for the
      q=241 / m=40 / n=43 and n=50 archived files. Toy dimensions against
      Kyber's beta of roughly 384-816.
    - >-
      Establishes nothing about ML-KEM security in either direction. ML-KEM is
      not broken and this record must never be cited as bearing on that.
    - >-
      Validates and refutes nothing about Approximation 4.9 itself; O-6 and O-7
      are the reasons, and they are structural, not budgetary.
    - >-
      No cost model, no re-optimization, no G6K run, no new sampling.

