    control_comparability:
      status: FAILED - and this is the finding of the batch
      detail: >-
        The package's only self-imposed control is the exponent scan, which the
        validator reproduced and then showed to be too weak to bear the weight
        placed on it (D7). The control the inventor protocol REQUIRES - the same
        measurement against a null object of the same shape - was absent (D8),
