    closure is asserted.
  strength: moderate
  strength_basis: >-
    MODERATE, strong for its kind within the tested lane. ESTABLISHED:
    the ordered PX cascade fired PX-DEAD uniquely; the matched 2^32
    dead anchor passed first (hits=4, S_obs=0, p_extra=1 exact); the
    alive arm read S_obs=2, p_extra=0.7468 > 0.15, S_obs <= null mean
    2.67193; validator reproduced 22/22 exact rationals and all
    power/BF quantities with zero discrepancies, snapshot 52/52.
    LIMITS: realized N=53 is below the design bracket 56, giving
    rho_80=0.1183 (above the design worst case 0.109); anchor n=4 is
    below the n>=5 power floor (direction-safe for PX-DEAD but reduced
    assurance); S_obs=2 is one zero from PX-WEAK and the joint BF at
    rho=0.05 is only ~9.7, so exclusion rests on the power calculation
    rather than a maximal-null reading. Effects rho<rho_50=0.0751 and
    the band (0.0751,0.1183) remain named-unmeasured.
  claim_tier: toy
  claim_tier_basis: >-
    Reduced-round AES-shaped probe (r=5 alive, r=6 dead anchor), one
    probe cell (amask=1, smask=1), 2^32 exposure, seed 531003, toy
    tier. No crypto-scale, deployed-AES, affected-scheme, asymptotic,
    or published-frontier claim in either direction.
  certificate_refs: []
  proof_status: empirical_only
  proof_refs: []

  observations:
    - id: OBS-ACE-1
      statement: >-
        ANCHOR P3 (r=6, seed 531003, 2^32, analyzed FIRST): 4 hits
        (<= dead band, tripwire not fired), S_obs = 0, p_extra = 1
        exact, p_deficit ~= 0.8158, null mean 55836997691/274877906624
        ~= 0.2031, hit_overflow = 0. Anchor PASS. Unexpected (rule 8):
        4 hits below expected 8-12 and below n>=5 power floor;
        direction-safe for PX-DEAD but reduced anchor assurance.
    - id: OBS-ACE-2
      statement: >-
        ALIVE P4 (r=5, seed 531003, 2^32): 53 hits (12 active / 41
        inactive), S_obs = 2, p_extra = 0.74680513 (> 0.15), p_deficit
        = 0.50020087, null mean 275420510837/103079213808 ~=
        2.67193, realized cutoff c = 7 (size 0.01934). PX-DEAD
        conjuncts hold; PX-WEAK would have required S>=3.
        Overdispersion audit: empirical variance 0.0363 <= null
        0.0502, no clustering. hit_overflow = 0; HIT_LOG_CAP 256
        sufficient (per-thread hit counts 11/15/13/14 < 64; red team
        notes the cap change was behaviorally inert).
    - id: OBS-ACE-3
      statement: >-
        POWER: at realized N=53, c=7, rho_50 = 0.0751 and rho_80 =
        0.1183 (shortfall disclosed per the frozen confounders clause:
        N=53 < design bracket 56). Power grid: 0.541 at rho=0.08,
        0.664 at 0.096, 0.918 at 0.15, 0.991 at 0.214. Joint BF with
        committed G5: 9.69 at rho=0.05, 150.3 at 0.096, 8.4e5 at
        0.214. False-PX-DEAD probability at the frontier ~0.5%
        (red-team derivation).
    - id: OBS-ACE-4
      statement: >-
        VALIDATION: independent validator (fresh session, fresh blind
        code, 2 compute runs) reproduced all 22 exact rationals,
        power/rho/BF/joint-LR within one float64 ulp, cross-checked
        the committed G5 DP digit-for-digit, verified anchor-first
        chronology, hit_overflow=0, HIT_LOG_CAP source-diff
        single-constant, Gate-0 rebuild identity, KAT/determinism/
        digest gates, and snapshot ab29f977e 52/52. Zero
        discrepancies. PX-DEAD upheld as the unique ordered branch.
    - id: OBS-ACE-5
      statement: >-
        RED TEAM (stands-with-narrowing): all load-bearing quantities
        re-derived; PX-DEAD stands but closes ONLY the t=1 lane of the
        X statistic in cell (amask=1, smask=1) at the realized
        frontier rho_80 = 0.1183. No carrier death, no ramp closure.
        rho < 0.0751 and the band (0.0751, 0.1183) remain
        named-unmeasured; ramp-shape question (363851 C3) survives,
        gated. Anchor n=4 below power floor disclosed; S_obs=2 one
        zero from PX-WEAK; HIT_LOG_CAP change inert.
  tested_parameters: >-
    P3 (aes,r6,amask=1,smask=1,2^32,seed 531003,threads 4); P4
    (aes,r5,amask=1,smask=1,2^32,seed 531003,threads 4); Gate-0
    rebuild with HIT_LOG_CAP 256; determinism log2N=20; KAT and digest
    gates.
  actual_scope: >-
    One probe cell (amask=1, smask=1), r=5 alive / r=6 dead anchor,
    2^32 exposure, seed 531003, toy tier. The negative closes exactly
    the t=1 X-statistic excess-zero lane in this cell at the measured
    exclusion frontier rho_80=0.1183; it does not close e as a carrier
    under other statistics/cells/exposures, does not address
    rho<rho_50, and does not close ramp shape.
  transfer_assumptions: >-
    None beyond the stated scope. NO transfer to other masks, round
    counts, exposures, statistics, or ramp shape. NO carrier-death
    claim. The powered negative is a lane closure at measured power,
    not a universal falsification.

  unresolved_confounds:
    - >-
      rho < rho_50 = 0.0751 and the band (0.0751, 0.1183) remain
      named-unmeasured; a higher-exposure or pooled design could
      adjudicate them if ever re-ranked.
    - >-
      Anchor n=4 is below the n>=5 power floor; reduced assurance but
      direction-safe for PX-DEAD.
    - >-
      S_obs=2 is one zero from PX-WEAK; exclusion rests on power, not
      maximal null.
    - >-
      Ramp-shape question (IDEA-20260901-363851 C3) remains open and
      gated; shape-only designs are possible but not spent here.

