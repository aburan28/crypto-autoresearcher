  proof_status: derivation
  proof_status_note: >-
    The model-level statement (zero in-domain generic-law cells below the VOW
    column) rests on an algebraic identity, not on the sweep. For every table
    model, PROBE + FILL = N + log2 m! + d, so by AM-GM
    TOTAL >= 1 + (N + log2 m! + d)/2. The blind re-derivation gives
    TOTAL >= s L/(2s-1) > L/2 for s >= 2 and TOTAL >= L for s <= 1, i.e.
    margin > 0.67 bits for every (m, s, d, N). Its prose constant -0.17455 is
    erratum E1 (the computed value is -0.174621), which does not change the
    bound. JV-1 adds an analytic balanced minimum under the most IC-favourable
    constant accounting it could construct (X-1's s! probe side, distinct-entry
    FILL, budget on distinct entries): N/2 + (N/2 + log2 s!)/(2s - 1) + 1, which
    exceeds the VOW column at every s. The sweep is a fixture of these
    statements. It is not their basis. The label is `derivation`, never
    "proved", and these are single-session derivations checked against each
    other, not refereed proofs.
