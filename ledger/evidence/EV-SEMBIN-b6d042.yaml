  inference: >-
    RUN-SEMBIN-be48b7 computes the AMD-20261001-e61f2b header-block model
    exactly. Three implementations that share no code with it confirm this to
    1e-13 bits or better on every cell they evaluated (strength_rationale). As
    an implementation-fidelity fixture it supports this statement and no
    stronger one.
    WITHIN THE v2 COST MODEL (the oracle table's construction charged as
    operations at one per entry, an UPPER-BOUND charge by up to log2 s!; memory
    reported, not charged; one operation per group op, probe, multiply-add or
    table write, declared optimistic for index calculus; relation count |F|;
    linear algebra |F|^2), for the three primary oracle laws ENUM, MITM and
    MITM_CAPPED (the model's generic-class laws, which touch the group only
    through group operations and equality of encodings and treat the factor
    base as an unstructured list): 0 of 362,219 in-domain cells at the ten
    listed degrees (m 2..16, d on the v1 0.25 grid, every listed store budget
    including unlimited) fall below the VOW column log2(0.886) + N/2, and 0
    fall below PUB at n = 131. The zero survives distinct-entry FILL, a budget
    law on distinct entries, clamping out-of-domain cells to one call, exact
    multiset yields, real d, and the most IC-favourable constant accounting
    JV-1 could construct. Inside the model it is an identity
    (TOTAL >= 1 + (N + log2 m! + d)/2), not a tally. The zero is a property of
    the ORACLE LAW: the FREE control has 7,850 in-domain cells below VOW.
    For generic algorithms at large, only the EXPONENT-LEVEL statement follows,
    and it does not follow from this run. No generic algorithm needs fewer than
    c sqrt(r) group operations, c an unspecified constant. That is a corollary
    of Shoup 1997 via Wagner 2002 Cor. 1 (KN-LIT-011; DEC-20261001-5c9e7a R6,
    scoped by CORR-20261002-e58c3a K14). The constant-level comparison against
    0.886 sqrt(N) holds only inside the model.
    The result is SILENT on every oracle that uses the curve's structure. These
    remain the open non-generic routes: membership tests x(P) in V,
    Weil-descended summation polynomials, approximate F_2-linear x-coordinate
    filters, and Frobenius beyond orbit bookkeeping.
    The margins are modelled values on the 0.25 grid, upper bounds on the
    real-d minimum by up to 0.230 bits per degree. They move by up to 19 bits
    with the domain predicate and the p > 1 reading (O-7), always in the
    direction against index calculus. Nothing is asserted about any curve.

  boundaries:
    - >-
      Tested scope: closed-form log2 arithmetic at the ten degree labels; m 2..16
      (an m-bound probe to 24 for argmins at 16); d on the v1 0.25 grid from 1.0
      to n (and to n/2 for C-BOUND-PROBE); store budgets as listed in the run,
      including unlimited. N = log2 r at n = 131, otherwise n. Nothing is
      instantiated. No curve is touched.
    - >-
      Oracle class: ENUM, MITM and MITM_CAPPED only. MITM_CAPPED's
      finite-budget figures (RESULTS T6) use HEUR-GENERIC-MSUM's time-store law,
      which DEC-20261001-5c9e7a R6 reads as contradicted as worded and which may
      not be cited as a lower bound. The exploratory X-5 column is lower than T6
      at 61 of 90 (degree, B) pairs, by up to 76.84 bits (JV-3 F8). Neither
      column is below VOW anywhere. The zero count does not rest on that law.
    - >-
      Single-instance accounting. The precomputation and multi-instance
      readings are checked on the v2 rows only (O-10). They are governed by
      different theorems (KN-LIT-013, KN-LIT-7cc07f), and their constants rest
      on kb records whose full texts were not read (JV-1 L-3).
    - >-
      VOW rests on HEUR-VOW-CURVE (unvalidated). Every margin is conditional on
      it, on the unit, on LA = |F|^2, on the |F| relation count, and on the
      p > 1 reading at the optimum (O-7).
    - >-
      Discharges no completion criterion of GOAL-SEMBIN-5078bc. In particular
      not criterion 4, which names the chained-S_3 index calculus with its
      Groebner cofactor. This model admits no Groebner cost (H-SEMBIN-8e7ae3
      binding_consequence).
  transfer_assumptions: >-
    None for scale: the labels are evaluated directly. For any reading about
    index calculus beyond this model, the generic-class oracle assumption IS a
    transfer assumption (JV-3 heuristic_validation_checks). Without it nothing
    here transfers.

  unresolved_confounds:
    - >-
      The p > 1 regime at every optimum (O-7) is a modelling assumption that no
      implementation-level check can test. A toy fixture that counts linearly
      useful relations per full MITM pass would be needed.
    - >-
      Which domain predicate is right: CALLS >= 0, trials per relation >= 1, or
      independent targets >= |F|. It moves margin values by up to 19 bits, not
      the zero (O-7; red team cost_model_challenges).
    - >-
      Whether one group addition plus one write per distinct entry is the right
      unit for the table build, relative to rho's step plus distinguished-point
      check. Under a stricter unit both sides gain about 1 bit (JV-1
      cost_model_checks).
    - >-
      The constants behind the exploratory precomputation comparators
      (Kuhn-Struik, Bernstein-Lange off-anchor scaling) are recalled or
      unverified (JV-1 L-3). They do not bear on the v2-row conclusion.
    - >-
      Reviewer independence is between sessions, not between models. Every
      session reports claude-opus-5-5. A blind spot shared by that model would
      be shared by all four reports.

  dominated_by: >-
    Every in-domain cell is dominated by van Oorschot-Wiener parallel rho
    (KR-RHO-6239aa) in time. On the 0.25 grid the margin is at least +16.551
    bits, and at least +15.857 with distinct-entry FILL (n = 97). Rho also
    dominates in memory: the per-degree minima build tables of 2^63.75 to 2^327
    entries (ordered count; the distinct-entry tables are smaller by log2 s!,
    which is at most 15.30 bits, so the dominance stands). At n = 131, PUB dominates by at least +22.633 bits (real d). No
    frontier row moves.
  sota_delta:
    time_exponent: unchanged
    memory_exponent: unchanged
    note: >-
      0 on time, memory and data. At exponent level the generic-class conclusion
      is Shoup's bound (KN-LIT-011). At constant level it is an identity of an
      internal model. The record's value to the program is that the family now
      has ONE admissible receipt, with its conditional stated. It also names
      where any exponent change would have to come from, which is the
      non-generic routes, not from this family.

  knowledge_promotion: not_warranted
  knowledge_promotion_reason: >-
    See DEC-20261002-7a3f19 knowledge_promotion. The direction is neutral, the
    decision is not support or reject_scoped, and a KN-FIND would restate a
    known theorem (exponent level) or an identity of an internal model with an
    optimistic unit (constant level), sota_delta 0.

  reviewed_by: coordinator
