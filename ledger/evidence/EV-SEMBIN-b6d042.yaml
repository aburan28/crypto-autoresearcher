    - id: O-4
      text: >-
        FILL IS AN UPPER BOUND, NOT A LOWER BOUND (JV-1 breaking_artifact). FILL
        = s d counts ORDERED s-tuples. The table is keyed by a symmetric sum, so
        a table of s-multiset sums has binom(2^d + s - 1, s) ~ |F|^s / s!
        entries. It serves the v2 probe law with identical success and is built
        at about one group addition plus one write per entry (depth-first over
        non-decreasing index tuples). FILL therefore over-charges by log2 s!,
        from 1 bit (s = 2) to 15.30 bits (s = 8). In domain PROBE >= FILL
        holds exactly, so with the budget law unchanged no in-domain TOTAL moves
        by 1 bit or more (max 0.968). Per-degree minimum margins against VOW with
        distinct-entry FILL: 97 +15.857, 109 +16.781, 131 +18.508, 163 +21.244,
        191 +23.244, 233 +25.474, 239 +26.264, 283 +28.472, 409 +34.761,
        571 +42.012. If the budget law is also applied to distinct entries,
        per-budget minima drop by up to 3.508 bits (233, B = 2^100) and the
        smallest per-budget margin stays +15.857 (n = 97). Under every variant
        the sub-rho count stays 0. The v2 TOTALs are upper bounds on the
        construction-charged cost of their own oracle. log2_table_entries is
        overstated by the same log2 s!.
