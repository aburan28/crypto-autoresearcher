evidence:
  id: EV-FALSIFY-e58e4e
  hypothesis_id: H-FALSIFY-40538b
  question_id: RQ-FALSIFY-a2c501
  experiment_ids: [EXP-FALSIFY-d770c1]
  run_ids: []
  run_ids_note: >-
    Documentary audit of a closure argument against the standard the corpus
    already imposes. Nothing to execute.
  finding_under_test: KN-FIND-7e4b90
  type: analytical
  direction: inconclusive
  direction_note: >-
    Does NOT contradict the finding's mathematics, which appears sound and is if
    anything understated. The defect is procedural: the closure omits a required
    element, on a lane the program's own charter points at.
  strength: moderate
  claim_tier: theory
  proof_status: derivation
  proof_status_basis: >-
    An argument about the completeness of another record's closure, plus two
    exact facts about the repository (a zero count and the existence of a goal).
  proof_refs:
    - knowledge/findings/KN-FIND-7e4b90.md
    - docs/inventor-protocol.md
    - AGENTS.md
  recorded_at: '2026-08-08'

  observations:
    - id: O-1
      text: >-
        RULE 2. No supersession, no withdrawal, no correction. Named in 2
        coordination/ documents, both under GOAL-SSI-001; read, and relevant to
        O-5 rather than to currency.
    - id: O-2
      text: >-
        (a) NAMED OBSTRUCTION -- PASSES, strongly. The obstruction is structural
        and specific: Wesolowski's Theorem 1.5 needs End(E) = B_{p,inf}, a
        definite quaternion algebra, and a 4D lattice over its maximal order with
        short elements of norm O(p^{1/3}) found by 4D LLL. Ordinary prime-field
        curves have End(E) an imaginary quadratic order, commutative and rank 2
        over Z, so the analogue lattice is 2D with shortest vector O(sqrt(N)) --
        which is Pollard rho, not an improvement. This is a real structural
        obstruction, not a screening count.
    - id: O-3
      text: >-
        (b) ARGUMENT -- PASSES. The dimension count, the resulting norm, and a
        specific reason the p^{1/3} case cannot arise are all given.
    - id: O-4
      text: >-
        AND THE OBSTRUCTION IS UNDERSTATED, which is worth recording because an
        audit that only ever weakens claims is not an audit. The record says a
        p^{1/3} short element "would require |D| ~ p^{2/3} and class number 1,
        which is not the case for GENERIC curves". Class number 1 is not a
        genericity condition: by Baker-Heegner-Stark there are finitely many
        imaginary quadratic orders of class number 1, the largest having
        |D| = 163. So |D| ~ p^{2/3} with h = 1 is impossible for EVERY curve once
        p^{2/3} > 163, i.e. p greater than roughly 2082 -- not merely
        non-generic. Flagged as an audit reading for a reviewer to confirm, not
        asserted as a new result; if it holds, the record's own conclusion is
        stronger than it claims.
    - id: O-5
      text: >-
        (c) FORWARD GUIDANCE -- FAILS. The record contains ZERO statements of
        what remains open: no successor, no revisit condition, no remaining
        uncertainty, no statement of what observation would reopen the lane. It
        ends at "No direct transfer of Wesolowski's structural theorem to
        ordinary prime-field ECDLP". A grep for remains-open / successor /
        revisit / future-work language returns 0 matches. Contrast KN-FIND-e7a3b1
        which, whatever its other defects (EV-FALSIFY-89e414), does name Hecke
        characters for CM curves as the surviving route.
    - id: O-6
      text: >-
        THE CONTRACT REQUIRES MORE THAN THE PROTOCOL DOES HERE. AGENTS.md's
        research-direction integrity section states that a proposed
        deprioritization or closure "must name the evidence, budget, test
        boundary, remaining uncertainty, and a concrete successor or revisit
        condition". This record supplies evidence and test boundary. It supplies
        no budget, no remaining uncertainty, and no successor or revisit
        condition. Three of five.
    - id: O-7
      text: >-
        WHY THIS ONE MATTERS MORE THAN ITS SIZE SUGGESTS. Wesolowski's
        p^{1/3+o(1)} result is not an arbitrary target: CLAIME.md and AGENTS.md
        name it as the program's CANONICAL EXEMPLAR, with
        docs/target-result-profile.md built around it and all roles instructed to
        bias toward that pattern. A record titled "blocked", tagged `blocked`,
        closing the transfer of the program's own stated exemplar, with no
        revisit condition and a self-referential proof_refs, is the highest-
        consequence shape a closure can have here. The inventor protocol calls
        premature closure a failure mode symmetric with overclaiming precisely
        for this case.
    - id: O-8
      text: >-
        THE SUCCESSOR EXISTS AND IS UNNAMED. GOAL-SSI-001, "Supersingular-isogeny
        cryptanalysis after the SIDH break", is a live goal in this repository
        and is exactly the setting where the quaternion structure Wesolowski
        needs DOES occur. The record's scope line -- ordinary prime-field ECDLP
        -- correctly excludes supersingular curves, so there is no contradiction;
        but the closure never says so, and "blocked" in a title with a `blocked`
        tag reads more broadly than the scope line binds. Naming GOAL-SSI-001 as
        where the lane continues would cost one sentence and would prevent a
        later reader concluding the Wesolowski route is dead in this program,
        which it is not.
    - id: O-9
      text: >-
        D6. proof_refs is [knowledge/findings/KN-FIND-7e4b90.md] -- the record
        itself. One of the nine identified in the D6 sweep, and the only one of
        those nine that is also a `blocked` closure.

  interpretation: >-
    The mathematics is sound and probably stronger than stated. The closure is
    incomplete by the corpus's own two standards: it omits forward guidance under
    the inventor protocol, and omits budget, remaining uncertainty and a
    successor under AGENTS.md's integrity section. On any other lane that would
    be a filing note. On the program's canonical exemplar, with a `blocked` tag
    and no revisit condition, it is the specific failure the protocol names.

  what_this_does_not_establish: >-
    No claim that the Wesolowski transfer to ordinary prime-field ECDLP is in
    fact possible. Nothing here identifies a route past the rank-2 obstruction,
    and none was sought -- that would be the real test and it was not run. The
    objection is to what the record fails to record, not to what it concludes.
    O-4's class-number reading is an audit observation, not a verified result.

  dominated_by: not_applicable_methodological
  sota_delta:
    time_exponent: not_applicable
    note: No algorithmic claim.

  proposed_correction: >-
    A superseding record keeping the obstruction and argument unchanged and
    adding what the closure standard requires: (a) an explicit remaining-
    uncertainty statement, (b) GOAL-SSI-001 named as where the quaternion route
    continues, with the scope line made prominent so "blocked" is not read past
    ordinary prime-field curves, (c) a concrete revisit condition -- the natural
    one being any result giving ordinary curves access to a rank-4 endomorphism
    structure, or a short-representation argument not routed through End(E), and
    (d) optionally the strengthening in O-4 if a reviewer confirms it.
    Coordinator authority.

  knowledge_promotion: not_warranted
  knowledge_promotion_reason: >-
    An audit of one record's completeness is not knowledge.

  scope_limits: >-
    KN-FIND-7e4b90 as committed at this branch head. F-6 (KN-FIND-e7a3b1) is
    recorded separately in EV-FALSIFY-89e414. No other closure was audited.

  independent_review_required: true
  independent_review_note: >-
    Touches a record carrying confidence: proved_negative on the program's
    canonical exemplar, and O-4 proposes a strengthening that needs a reader
    competent in imaginary quadratic orders. AGENTS.md rule 12 applies before any
    status change follows.

  authority_note: >-
    Evidence only. No hypothesis status changed, no finding edited or
    superseded; only the Coordinator may do that (AGENTS.md rule 1).
