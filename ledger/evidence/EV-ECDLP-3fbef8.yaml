  supported_core:
    model: MPZ dense prime-order ordinary generic group, optionally with exactly the shared oracle of Corollary 3
    asymptotic_scope: sufficiently large prime N satisfying N>4L+1
    interface: >-
      One target-independent universal exact arbitrary-signed-labelled-deck
      subset-stable Query2P1 object, exact under cumulative F0 restrictions and
      every correlated public target shift used by one jointly correct
      adaptive transcript. The object itself is assumed, not constructed.
    construction_fixture: >-
      Set B=N^(1/5), r=ceil(log2 B), m=2^r,
      D={-m,...,-1,1,...,m}, C=sum_i=0^4 m^i,
      L=m+m^2+m^3+m^4, and
      F_i={(i,d,sigma,[sigma(d+1)m^i]P)}. Query R=Q+[C]P.
    universal_witness: >-
      The five base-m digits of canonical x select an all-positive labelled
      tuple summing to [x+C]P=R.
    one_restricted_deck: F0 only
    isolation_calls: r+1
    public_f0_recovery: >-
      Direct singleton label, or reconstruction of all 2m public F0 encodings
      followed by at most 2m labelled equality tests or an equivalently fully
      charged collision-resolving dictionary.
    residual: >-
      There is a unique z in [-L,L] satisfying
      m*z congruent to x+C-c0 modulo N; no integer equality or divisibility is
      asserted.
    correlated_threshold: >-
      For R_t=R+[m*t]P and 0<=t<=2L+1, exact restricted answers satisfy
      q(t)=1 iff t<=L-z. Thus binary search recovers z.
    exact_top_level_call_cap: 5*ceil(log2(B))+3
    decoder: x_hat=(m*z+c0-C) mod N followed by mandatory [x_hat]P=Q verification
    advice_bits: ell=B^(9/4+o(1)) after complete ordinary-bit serialization
    aggregate_main_interactions: >-
      k=B^(5/4+o(1)), including public-handle reconstruction, restriction and
      shifted-target formation, all predicate interactions, finite F0
      recovery, dictionary/scan build, serialization, storage, collisions,
      traffic, lookup, replay, decode, verification, teardown, and clearing,
      with no reset between calls.
    success_bound: 3*ell*(k+1)^2/N=B^(-1/4+o(1))=N^(-1/20+o(1))
    consequence: >-
      A universal object with asymptotically nonvanishing complete-transcript
      success satisfying every frozen premise would recover every fresh target
      in the admitted stratum, while MPZ bounds average success by a quantity
      tending to zero. Such an object therefore cannot exist inside this exact
      ordinary-generic resource rectangle.
  limitations:
    - The exact universal subset-stable predicate and jointly correct correlated-target object are premises; no record constructs either one.
    - MPZ supplies the enclosing ordinary-generic extraction bound, not the signed-deck object, occurrence labels, subset stability, or complete-transcript guarantee.
    - The result is distributional over a fresh uniform generic target and representation randomness; no pointwise MPZ theorem is claimed.
    - Every public generic handle must be reconstructed after the advice boundary from public scalar lineage and fully charged; target-conditioned or opaque carried state is outside scope.
    - It does not cover a fixed-target-only object, separately randomized marginal success, per-call k resets, or extra-oracle access.
    - It does not cover wrapped N<=4L+1 or collision strata, zero-inclusive coefficient languages, random-deck-only objects, or zero-restriction objects.
    - It does not cover coordinate-aware elliptic-curve, Semaev, resultant, P1553 target-local remainder, dyadic-unit-product, representation-sensitive, or other non-generic algorithms.
    - It is not an ECDLP algorithm, generic ECDLP lower bound, P1553 impossibility, attack, speedup, SOTA movement, B71 admission, lane closure, goal completion, or breakthrough.
