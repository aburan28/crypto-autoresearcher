  claim_tier: toy
  claim_tier_note: >-
    TOY, UNCONDITIONALLY. Scope: q = 3329; d in {20, 30, 40, 100, 140}; the frozen k and
    beta grids of PREREG-2 2.2; 8 bases per lattice per fibre family; one scored family F0
