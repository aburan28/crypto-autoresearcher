  strength: replicated
  strength_basis: >-
    `replicated` is claimed for the admissible core listed above -- the branch, the
    certified classes, four of the five falsifier verdicts, both precision_degenerate
    readings, the K-interval emptiness, all three F0 readings, P-GRAM as applied, PREREG-2
