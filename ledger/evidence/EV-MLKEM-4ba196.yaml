    integer determinant plus exact-rational Gram-Schmidt, agreeing to decimal-context
    rounding only). CORRECT. This does not itself decide A-1; it establishes that FC-1's
    firing (see OBJ-1 below) is not a defect in that derivation.

  proof_refs:
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-6b6e78/tasks/TASK-20260813-25cb95/prereg.md#section-2.9
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-6b6e78/reviews/TASK-20260813-59c321/probes/probe_gram_derivation.py
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-6b6e78/reviews/TASK-20260813-59c321/probes/probe_gram_derivation_output.json
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-6b6e78/reviews/TASK-20260813-85e343/probes/probe_pgram_reach.py
  - coordination/goals/GOAL-MLKEM-005/batches/BATCH-6b6e78/reviews/TASK-20260813-85e343/probes/probe_pgram_reach_output.json

  # ==================================================================
  # THE TERMINATION BRANCH
  # ==================================================================
  termination_branch:
    branch: T-A1-FALSIFIED-PARTIAL
    read_off: >-
      R3-OUT-1 and R3-OUT-2 under R3-OUT-V's precedence, and nowhere else (PREREG-2 7).
      R3-OUT-V (VOID) does not fire: P-G2 held, 210 guard records checked independently by
      the Validator, 0 violations. T-UNSTATABLE does not fire: FC-1 fired for the raw-GSO
      class alone, not for the determinant-only class, whose R6_exact exists, is defined
      and terminates for all 18 determinant-only candidate instances -- PREREG-2 7.2
      requires EVERY class to fail decidability, and only one of two did.
      T-A1-FALSIFIED fires: FC-1 (one class of two), FC-2a (153 cells), FC-3a (868 cells,
      or 867 under the Validator's verbatim-carry reading of the 2.6 ambiguity -- see F-1;
      the branch is unaffected under either) and FC-3b (354 cells) all fired, each
      independently sufficient under PREREG-2 1.2. Coverage is not full (114 uncovered
      cell evaluations), so the -PARTIAL suffix of 7.6 applies.
      BOTH REVIEWS RE-DERIVED ALL FOUR STEPS FROM COMMITTED ARTIFACTS RATHER THAN FROM THE
      PRODUCER'S SUMMARY AND REPORT THE SAME BRANCH. The Red Team states plainly: "THE
      BRANCH IS CORRECT AND I DO NOT CONTEST IT ... ROBUST TO EVERY OBJECTION BELOW: set
      FC-1 aside entirely and FC-2a, FC-3a and FC-3b each independently still fire it."
    what_it_licenses_quoted_verbatim: >-
      "a decision recording exactly which sub-clause failed, at which cells and routes,
      and for which certified class -- and the specification of a SUCCESSOR ASSUMPTION,
      not a criterion, subject in full to 7.5's repair bar."
    what_it_forbids_quoted_verbatim:
    - specifying any dispersion criterion, fibre clause or gate resting on A-1
    - proceeding to C3 behind any gate
    - presenting the falsification as evidence about any lattice, any observable's
      admissibility, or any proposition in this goal -- it is an instrument outcome
    - reading the 114-cell coverage gap, or any timeout, crash or missing dependency, as a
      falsifier -- that is infrastructure signal (AGENTS.md rule 5)
    - closing, pausing or completing GOAL-MLKEM-005

  # ==================================================================
  # NUMBERED FINDING: THE PRODUCER'S OWN NARRATIVE ABOUT ITS ARTIFACT WAS FALSE
  # (correction to the description that propagated into the archive commit message)
  # ==================================================================
  finding_1_narrative_correction:
    id: EV-4ba196-F2
    corresponds_to: Validator finding F-2
    severity: RECORD-INTEGRITY, not a measurement defect
    what_was_claimed: >-
      report_a1.md section 10 and its anomaly-log item 8 both state that "the automated
      P-A12a register line in results_a1.json is mis-scored HELD; corrected to FALSIFIED
      ... with the JSON left unedited." That claim, verbatim, then propagated -- UNCORRECTED
      -- into the commit message the parent harness session wrote for TASK-20260813-48240d,
      the lead's own snapshot archive at 4e466c6bf221ea002fe84311baccdb816081a8cd.
    what_is_actually_true: >-
      THIS IS FALSE AGAINST THE COMMITTED ARTIFACT. I independently confirmed it myself by
      reading the committed results_a1.json directly: PREDICTION_REGISTER.items["P-A12a"]
      records `"OUTCOME": "FALSIFIED"`, not "HELD" -- the string "HELD" does not occur
      against P-A12a anywhere in the file. The Validator's F-2 reaches the identical
      conclusion independently: a fresh, unmodified re-run of the committed measure_a1.py
      reproduces FALSIFIED, and reading the scorer's own code (measure_a1.py:1570-1578)
      shows it filters the FULL, untruncated FC-2a list (153 entries, below the 200-entry
      serialization cutoff), so it CANNOT produce HELD on this data. P-A12a's committed
      OUTCOME is, and always was, FALSIFIED.
      THE SUBSTANTIVE SCIENTIFIC VALUE WAS CORRECT THROUGHOUT. P-A12a is genuinely
      FALSIFIED at 22 cells (X_null 12, rdet 10, both route R2_QR_of_BT) -- the producer's
      corrected TABLE VALUE in report_a1.md section 10 is right, confirmed independently by
      the Validator (RULING-P-A12a) and by the Red Team's own recomputation from the
      complete per-cell record. Only the producer's NARRATIVE ABOUT WHAT ITS OWN COMMITTED
      ARTIFACT SAYS was wrong -- a description of a JSON field's contents, not a
      measurement of any object. This is a correction of a DESCRIPTION, never of a
      MEASUREMENT.
    most_likely_benign_explanation_offered_by_the_validator_without_asserting_it: >-
      the producer's run_manifest.yaml records three reduced-scope smoke invocations over 3
      of the 10 lattices before the declared run; the FC-2a firings for X_null and rdet
      occur only at L5 and L11, so a 3-lattice smoke run could plausibly have shown HELD.
      The producer may have carried an observation from a smoke run into a paragraph about
      the committed artifact. Offered as a hypothesis, asserted as fact by no one.
    why_this_matters_and_is_recorded_as_its_own_numbered_item: >-
      A reader who trusts the narrative and does not open the JSON -- exactly the failure
      mode Validator F-1 of the PRIOR batch (DEC-20260812-781961) also caught -- would be
      misled about a committed artifact by three independent carriers of the same false
      claim: report_a1.md section 10, its anomaly-log item 8, and the TASK-20260813-48240d
      snapshot commit message that quoted it. THE COMMIT ITSELF (4e466c6bf) AND ITS MESSAGE
      ARE NOT EDITED -- both are immutable history, exactly as AGENTS.md rule 2 requires.
      This evidence record is the correction: a reader who saw only the commit message is
      corrected by this ledger entry, which states the true fact plainly -- P-A12a's
      committed OUTCOME is FALSIFIED, and was FALSIFIED at the moment the commit was made.
    required_action: RC-2 below (a superseding record, no re-run required)

  # ==================================================================
  # NUMBERED FINDING: THE HEADLINE COUNT IS NOT ADMISSIBLE AS STATED
  # ==================================================================
  finding_2_headline_count:
    id: EV-4ba196-F1
    corresponds_to: Validator finding F-1, Red Team objection O-5
    severity: MATERIAL
    what_was_measured: >-
      measure_a1.py's binary32 route R4 does not implement what results_a1.json's own
      `route_provenance` field DECLARES it implements ("the committed float64 expressions
      with the cast to np.float64 replaced by a cast to np.float32 AND NOTHING ELSE
      CHANGED"). The committed float64 expression forms the Gram in EXACT int64 and casts
      ONCE (`(B @ B.T).astype(np.float64)`); measure_a1.py:295 instead ACCUMULATES the Gram
      AT THE WORKING PRECISION (`Bf @ Bf.T` with `Bf = B.astype(dt)`) -- a change beyond the
      cast, and the one thing the provenance statement says did not happen. This was
      INVISIBLE to the producer's own consistency check ("480 of 480 route values
      bit-identical to the committed measure_gvar2, max abs diff 0.0") because at binary64
      the two forms are bit-identical on these families (every Gram entry is an integer
      below 2**53); the deviation exists only on the axis that check does not cross.
      CONSEQUENCE: under the declared provenance the headline count is 1,313 changing cells
      (Validator's blind re-derivation from the frozen text alone, before reading any
      producer code); under the Gram-at-working-precision reading actually used it is 1,416
      -- the producer's committed number. BOTH the Validator and the Red Team independently
      confirm the QUALITATIVE structure is invariant under either reading (49 of 330 blocks
      change verdict; concentration on R4 and R2; zero on R0, R1, R3, R5), and the Red Team
      additionally built a third rung -- exact arithmetic, closed-form for these families --
      showing the phenomenon is real and does NOT collapse at higher precision (684 changes
      spread evenly over R2, R4, R5 at binary64-to-exact), so this is not an R4-at-binary32
      artifact; it is that the NUMBER 1,416 (or 1,313) is a joint function of the route set
      and the precision pair, not a property of the clause alone.
    root_cause: >-
      A SPECIFICATION GAP IN PREREG-2 2.6, not an error by either session. PREREG-2 2.6
      declares the six routes BY REFERENCE to committed float64 code and then declares a
      second working precision without saying how a carried expression generalizes to it.
      Both readings are defensible from the frozen text; only one matches the record's own
      provenance statement.
    what_is_unchanged: >-
      the block count 49; route R2's contribution of exactly 20; zero contribution from R0,
      R1, R3, R5, RQ, RG; every certified class; every falsifier firing and non-firing
      including FC-2a at exactly 153 and FC-3b at exactly 354; every precision_degenerate
      number; the joint K-interval and its emptiness (including restricted to binary64
      alone); all three frozen F0 readings at binary64; and THE TERMINATION BRANCH.
    what_is_not_admissible_until_superseded: >-
      the count 1,416 itself and its by-route / by-candidate / by-fibre-family
      decompositions; FC-3a's exact split (868 vs 867, and its per-amplitude breakdown);
      the R4|binary32 K-interval endpoints; and the binary32 diagnostic "6 of 38" reading.
      See the not_admissible_until_superseded list above.
    required_action: RC-1 below (a superseding record; NO RE-RUN REQUIRED per both reviews)

  # ==================================================================
  # OBJ-1 AND OBJ-2, RULED (the producer's own carried objections)
  # ==================================================================
  obj_1_ruling:
    subject: >-
      The producer's OBJ-1: P-GRAM's 1e-10 tolerance may be unsatisfiable by any exact
      route, because the two committed float64 routes RQ and RG disagree with each other
      by up to 3.0015e-09.
    ruling: >-
      THE OBJECTION IS CORRECT, AND STRONGER THAN THE PRODUCER STATED IT (Validator
      RULING-OBJ-1, Red Team O-1, independently measured and agreeing to the sig-fig). By
      the triangle inequality, P-GRAM requires ONE value within 1e-10 of BOTH committed
      float64 routes, which is possible only where the two routes themselves agree to
      2e-10. Measured max|RQ-RG| over the frozen bases: 1.776e-15 (L1, L4, L7, L11), 0.0
      (L9), 4.354e-10 (L8), 3.420e-10 (L10), 6.189e-10 (L12), 1.331e-09 (L2), 3.0015e-09
      (L5). At L2, L5, L8, L10 and L12 -- every lattice with k > d-k -- the disagreement
      exceeds 2e-10, so NO REAL NUMBER WHATEVER, not merely no exact route, could satisfy
      P-GRAM there. This is a SPECIFICATION DEFECT IN PREREG-2 2.9's tolerance, in the same
      class as the precision_degenerate hole PREREG-2 1.3 itself declares, and repairable
      only by a superseding record; it is NOT repaired here and PREREG-2 2.9 froze its own
      consequence in advance ("it is never patched"), which the producer applied exactly.
    what_this_does_and_does_not_change: >-
      IT DOES NOT CHANGE THE SCORING OR THE BRANCH. FC-1's firing for the raw-GSO class is
      an ARTEFACT OF AN UNREACHABLE TOLERANCE, not a property of the raw-GSO class, and is
      NOT evidence against PREREG-2 2.9's derivation, which the Validator's MR-3 and the Red
      Team's O-13 independently verify correct at every step (see proof_status above). The
      derivation reproduces RQ -- the route whose diagonal IS the Gram-Schmidt norm sequence
      -- to 1.42e-13 at every basis and lattice, and at the five lattices where RQ and RG
      agree bit-closely it agrees with both. It DOES change what may be SAID about FC-1's
      meaning: T-A1-FALSIFIED still fires, unaffected, because FC-2a, FC-3a and FC-3b each
      fire independently and each is independently sufficient. A successor that cites FC-1
      as evidence about the raw-GSO class, about X_gso_k, or about the decidability of exact
      constancy for it, would be citing an artefact of PREREG-2's own tolerance.

  obj_2_ruling:
    subject: >-
      The producer's OBJ-2: under the strict precision_degenerate reading, A-1.2 is
      falsified at 4,788 cells purely by the definition of route R0 (and the bit-identity of
      R1 and R3 on these fibres); the frozen reading exempts them.
    ruling: >-
      THE FROZEN READING IS THE RIGHT ONE AS A MATTER OF INSTRUMENT DESIGN (Validator
      RULING-OBJ-2), because the strict reading is not a test: A-1.2 asks for a STRICT
      DECREASE of rho with precision, and R0/R1/R3 have rho = 0 at every precision by
      construction on these fibres, so the strict reading would falsify A-1.2 at those
      cells before any measurement -- a could-not-HOLD arrangement PREREG-2 6.3 names in
      advance and 1.3 exempts precisely.
      BUT THE EXEMPTION'S EXISTENCE BOUNDS A-1.2's REAL CONTENT, AND THIS MUST TRAVEL WITH
      ANY CITATION. Of the 12,426 covered cells, 4,788 (38.5 percent, on three of six float
      routes -- R0, R1, R3) are precision_degenerate and VACUOUS for A-1.2 under the frozen
      rule: they neither confirm nor falsify. A-1.2's real empirical content in this batch
      lives on R2, R4 and R5 only, and FC-2a in fact fired ONLY on route R2. A successor
      citing "A-1.2 was tested at 12,426 cells" OVERSTATES by 4,788 cells; this scope
      correction is recorded explicitly so it travels with any future citation of A-1.2.
      IT DOES NOT SOFTEN THE BRANCH: FC-2a's 153 firings are all on the NON-exempt cells
      (route R2, explicitly not precision_degenerate), and FC-3a/FC-3b are A-1.3 firings to
      which 1.3's exemption does not apply at all. The frozen reading is the CONSERVATIVE
      one: it removes cells that would have added falsifications, and A-1 is falsified
      anyway. Both readings are disclosed at every one of the 4,788 cells (R3-OUT-7), as
      1.3 requires, and the Red Team independently notes a SECOND, one-sided defect in the
      same exemption (its own O-4(iii)): all 153 FC-2a firings have
      rho(binary32) = 0.0 EXACTLY, i.e. the low-precision estimator returned the TRUE value
      while the high-precision one returned rounding noise, and the exemption -- which
      protects rho(binary64) == 0 -- says nothing about rho(binary32) == 0. This is recorded
      as a further specification note for any successor repairing PREREG-2 1.3, and it does
      not change the branch either.

  # ==================================================================
  # THE CONVERGENT SCOPE-LIMIT FINDING -- THE BATCH'S TRUE LIMITATION
  # ==================================================================
  scope_limit_finding:
    statement: >-
      T-A1-FALSIFIED-PARTIAL SURVIVES ON A-1.2 -- FC-2a's 153 firings are on the
      certified-CONSTANT class, which is populated by fourteen candidate instances
      including three real determinant-only candidates from this goal's own list (X_null,
      rdet, X_parfree), and FC-2a alone is independently sufficient. BUT A-1.3 -- the
      invariance sub-clause, the half of A-1 that is about objects certified to READ the
      instance -- WAS TESTED EXCLUSIVELY AGAINST OBJECTS THAT CARRY NO LATTICE INFORMATION.
      X_gso_k, the only in-scope candidate that reads the instance, is UNCERTIFIED (P-GRAM
      failed on route RG; see obj_1_ruling above), so every one of the 868 FC-3a and 354
      FC-3b firings comes exclusively from the null object X_hash, which PREREG-2 2.8
      itself declares carries "no lattice information whatever."
    both_reviews_built_this_independently_and_it_is_convergent: >-
      NOT MERELY OBSERVED -- BUILT, TWICE, BY DIFFERENT SESSIONS, WITH DIFFERENT OBJECTS.
      The Validator built X_indexnoise = X_null + c*g(i), where g is a fixed pseudorandom
      function of the BASIS INDEX ALONE -- it reads no entry of any basis, not even a hash
      of one, so it is not a relabelling of X_hash. Certified NON-CONSTANT by the exact
      route, it scores 684 cells with FC-3a at 114 cells and 92 VAR-F verdict changes --
      IDENTICAL, number for number, to X_rowsum, a blind null that DOES read A (Validator
      CC-2, CC-3). The Red Team, independently and without reading the Validator's
      write-scope, built X_lin = mean(A entries)/q (a linear functional) and X_par =
      (count of even entries of A)/(k(d-k)) (a counting functional), neither a hash: exact
      route, both CERTIFIED EXACTLY NON-CONSTANT at 30 of 30 fibres; rho > 0 at both
      declared precisions at 30 of 30 cells; rho(binary32)/rho(binary64) in
      [0.999997517, 1.000003717] for X_lin and [0.999998595, 1.000000653] for X_par -- 0 of
      30 cells outside the frozen [1/2, 2] window -- so NEITHER FC-3a NOR FC-3b would fire
      on either object; and PROVABLY NOT LATTICE INVARIANTS (Red Team O-2): an integral
      unimodular row operation that leaves the lattice generated identical moves both X_lin
      and X_par by a fixed, measured amount, and carries a median Pearson correlation of
      -0.0045 (X_lin) and -0.0178 (X_par) against the one in-scope geometric observable
      X_gso_k, versus a must-pass control (two float routes for the same geometric
      quantity) of exactly +1.0000.
    conclusion: >-
      "CERTIFIED EXACTLY NON-CONSTANT ON THE FIBRE" THEREFORE CARRIES NO INFORMATION
      WHATEVER ABOUT WHETHER AN OBJECT READS THE INSTANCE. Two structurally different
      built objects -- one that reads the basis index alone and reads no entry of any
      basis, and two non-digest functionals of A that are provably not lattice invariants
      -- are admitted to A-1.3's certified-NON-CONSTANT class on exactly the same terms as
      the real object X_gso_k would be, had it been certified. This is NOT that A-1 is
      false in general; it is that A-1.3's sub-clause was never tested this batch where it
      would matter -- on an object that both reads the instance AND is certified. This is
      compounded with OBJ-1 above: OBJ-1 removed X_gso_k from the certified classes via an
      unreachable consistency tolerance, and the scope-limit finding is the consequence. A
      successor that repairs P-GRAM's tolerance (obj_1_ruling) would recover the one
      candidate that could give A-1.3 empirical content on a real object -- and that,
      rather than a new dispersion statistic, is what the numbers point at.
    citation_discipline: >-
      Any citation of T-A1-FALSIFIED-PARTIAL, or of A-1.3 in particular, must carry this
      finding in the same sentence: A-1.3's certified-NON-CONSTANT class in this batch
      contained no object that reads the instance (Validator L-3; Red Team
      "narrowest_supported_statement" item 5).

