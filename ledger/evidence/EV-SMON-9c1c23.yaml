  type: theoretical
  type_note: >-
    Recorded as `theoretical` because the load-bearing claim is a derivation
    (papers/semaev-conservation-specialization/paper.tex, Theorem 3.4). The finite-field
    battery is corroboration of the derivation's consequences at toy scale, not the basis
    of the claim. An `empirical` label would overstate what the runs alone can carry:
    Frobenius data can exhibit which conjugacy classes OCCUR, and can make a larger group
    implausible, but cannot by itself determine a Galois group over a function field.
  direction: supports
