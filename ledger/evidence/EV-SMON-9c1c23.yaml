  observations:
    - id: OBS-1
      text: >-
        C1. disc_T S_3(x1,x2,T) = 16 f(x1) f(x2) holds as an identity in Z[x1,x2,A,B],
        checked with exact integer coefficients (9 monomials on each side), not as a
        congruence modulo a prime. This reproduces KN-FIND-c41ea9 by an independent
        implementation.
    - id: OBS-2
      text: >-
        C2/C3. Over 18000 uniform specializations at m = 3,4,5 across 20 curves and 6
        primes, 16737 were good (full degree 2^{m-2}, squarefree, signed sums distinct
        and finite). On ALL 16737 the root set over F_{p^2} was exactly the set of
        2^{m-2} signed sums x(eps_1 P_1 + ... + eps_n P_n). Zero exceptions.
    - id: OBS-3
      text: >-
        C4/C8. On all 16737 good samples the factorization type over F_p was exactly the
        predicted one: 1^{2^{m-2}} when all chi(f(a_i)) agree, 2^{2^{m-3}} otherwise.
        Maximum irreducible factor degree observed at any m was 2. No mixed type ever
        occurred. All 2^{m-2} Frobenius classes were realized at each m, and each class
        produced exactly one factorization type.
    - id: OBS-4
      text: >-
        C5. Over 18000 factor-base-locus specializations (every a_i the x-coordinate of
        an F_p-rational point), 16107 were good and ALL 16107 split completely over F_p,
        with every root in F_p and equal to a signed sum. Zero counterexamples at m = 3,
        4 and 5, on every curve including the supersingular and full-2-torsion ones.
    - id: OBS-5
      text: >-
        C6. Exhaustive enumeration of all p^{m-1} specializations at
        (m,p) = (3,53), (3,101), (3,211), (4,37), (4,53) -- 257061 specializations, 224906
        good -- gave zero factorization-type mismatches, and for EVERY Frobenius class in
        EVERY cell the exact identity
        S^k N^{n-k} + N^k S^{n-k} = #good_in_class + #degenerate_in_class
        held with residual exactly 0.
    - id: OBS-6
      text: >-
        Branch locus. The degenerate locus matched the derivation exactly. At m=3 with
        Z = 0 it had exactly p points (101 at p=101, 211 at p=211: the diagonal
        t_1 = t_2, which is S_2 = 0); at p = 53 with Z = 1 exactly
        157 = 53 + (2*53 - 1) - 1 points, the diagonal together with the ramification
        locus f(t_1) f(t_2) = 0, corrected for their single common point.
    - id: OBS-7
      text: >-
        C9. disc_T S_m was a square at all 7324 good m=4 samples and all 1627 good m=5
        samples, and mixed at m=3 (3828 square, 3958 non-square). This is the predicted
        consequence of the group acting regularly: for m >= 4 every non-identity element
        is a product of 2^{m-3} >= 2 transpositions and so is even, while at m = 3 it is
        a single transposition and so is odd.
    - id: OBS-8
      text: >-
        C7 (NULL CONTROLS -- the discriminating check). NULL-A, a uniform random quartic
        over F_401: of 599 separable samples only 13.7% obeyed the C4 dichotomy; types
        1^1 3^1, 4^1 and 1^2 2^1 were all common. NULL-B, the identical S_4 resultant
        construction with the inner summation polynomial replaced by a random quadratic:
        of 595 separable samples 48.9% obeyed it, with 4^1 and 1^2 2^1 both frequent. A
        law obeyed by 100% of 241643 genuine good specializations and by 13.7%/48.9% of
        matched controls is not an artifact of the instrument.

  inference: >-
    The derivation in the manuscript establishes that the Galois group of
    S_m(t_1,...,t_{m-1},T) over K(t_1,...,t_{m-1}) is (Z/2)^{m-2} in its regular
    representation, for every elliptic curve over every field in every characteristic,
    with arithmetic monodromy equal to geometric monodromy. Every finite-scale
    consequence of that derivation that could be checked was checked and held without
    exception, against null controls the same instrument rejects. Two consequences are
    recorded separately as KN-FIND-a8990a: the exact factorization dichotomy over F_q,
    and complete splitting on the factor-base locus at every m.

    The operative negative consequence: any statistic of the form "factorization type,
    cycle type or Frobenius class of the summation fibre" is identically constant on the
    factor-base locus, at every m and for every curve. A Chebotarev-style generic-fibre
    census therefore cannot detect a relation-rate anomaly on the locus where relation
    search operates -- not because the census is badly designed, but because there is no
    variation there to detect.

  boundaries:
    - Largest prime exercised is 1009 (10 bits). Claim tier is toy and may not be raised
      by this record.
    - m in {3,4,5} only. The derivation covers all m >= 3; the verification does not.
    - The battery constrains the monodromy group from below (all 2^{m-2} classes were
      realized) and makes a larger group implausible (no cycle type of order > 2 was ever
      observed in 241643 good samples), but does not by itself determine the group. The
      group is established by the derivation.
    - Complete splitting on the factor-base locus is a statement about solving for the
      LAST coordinate given the other m-1. Relation search fixes the target and searches
      for the others; the theorem gives it no leverage. See section 5.1 of the manuscript.
    - Nothing here bears on ECDLP hardness in either direction. No discrete logarithm was
      solved and no cost model was improved.

  unresolved_confounds:
