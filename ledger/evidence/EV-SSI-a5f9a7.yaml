  observations:
    - >-
      Both independent reviews concur with the narrow design-only ceiling,
      execution_authorized:false, frozen:false, and evidence_eligible:false.
      Neither executed an experiment, diagnostic, parser, arithmetic verifier,
      cost model, cryptographic computation, or scientific measurement.
    - >-
      The v8 lineage rule is a material improvement: historical v1/v6/v1.1/v2
      clauses are declared lineage-only and v8 is named as the active namespace.
      This is a design observation, not evidence about SSI hardness.
    - >-
      The v8 C-HELPER-v3 slot is internally inconsistent. Its occupied record
      needs 377 bytes under the declared canonical biguint fields, while the
      slot_width_bytes is 96. The supposed payload contains only a digest and
      zero padding, not the factor/matrix bytes required by the HNF path.
    - >-
      Independent reviews also find unresolved universal-frame versus local
      layout grammar, helper capacity and query-key binding, fixed-advice
      quantifier enforcement, field-by-field bounds, finite terminals and
      padding, setup/access FOE separation, live memory accounting,
      certificate/provider binding, HNF/output production, replay/null identity,
      C-pair finite references, and synthetic rational aggregation.
    - >-
      The bound INCUMBENT-FOE-v1 file is honest but pending_external_measurement
      with null values. It blocks freeze, comparison, and break-even arithmetic;
      it is not negative evidence and no FOE number was fabricated.
    - >-
      The snapshot queue initially contained a mistyped object ID. The actual
      reachable snapshot is c19deb2206d548b2192cfe33d67ba56559f48d37; the
      Coordinator corrected the mutable queue binding in commit
      33daedb89. The immutable receipt remains pending_post_commit and was not
      rewritten.
  inference: >-
    The narrowest supported statement is that the corrected EXP-SSI-16649a
    contract materially improves
    v7's namespace and contract intent but remains incomplete and execution
    blocking. The reviews support an additive v9 physical-contract repair and
    do not support any attack, security, exponent, novelty, hypothesis, or goal
    claim.
  boundaries:
    - Execution remains unauthorized; EXP-SSI-16649a is review_required, unfrozen, and evidence_eligible=false.
    - No result transfers to EndRing, Isogeny, SQIsign, CSIDH, or deployed security claims.
    - Provider/mirror unavailability and the absent incumbent measurement are operational/admission conditions, not negative cryptanalytic evidence.
    - The immutable snapshot receipt's pending_post_commit fields remain a provenance caveat.
    - The repo-wide validator retains an unrelated grandfathered WESOVOW manifest error; it is outside this SSI batch.
  unresolved_blockers:
    - Replace the C-HELPER-v3 96-byte slot with one explicit record width that includes actual factor/matrix payload bytes, and totalize zero/capacity bounds.
    - Choose one universal framed-object grammar and define every local header/body/digest preimage inside v9, including SSJ manifest and HNF/output subcontracts.
    - Bind fixed advice to a pre-target p-level seed and owner manifest; bind the target manifest, selection-code map, query-key domain, record width, and payload bytes.
    - Give every scalar and derived product an explicit finite inequality, signed-bigint grammar, record width, length prefix, and overflow/terminal precedence.
    - Define finite builder request/record/terminal bytes, null padding, exhaustion, restart, complete event payloads, primitive hash/byte costs, and setup/access boundaries without double counting.
    - Bind certificate authenticity, target/path identity, provider receipt, mirror, horizon, HNF operations, saturation, and OUTPUT bytes to one complete path.
    - Materialize replay identity, branch-null semantics, finite C-pair reference bytes, and synthetic rational recurrence/aggregation.
    - Supply an independently measured matched INCUMBENT-FOE-v1 source before freeze or comparison.
