    - TASK-20260805-a98111
  snapshot_commit: 0d34dfcb3709a5e18c246b0f7d3e95a1cb840e2f
  type: measurement
  type_note: >-
    Final batch of GOAL-MLKEM-004. Replicates the surviving residual from n = 2
    to n = 16, puts the correct candidate into every group for the first time,
    and both reviews then localise what the residual is and is not about.
  direction: mixed
  strength: moderate
  claim_tier: measurement_toy_scale
  certificate_refs:
    - "dual-membership: 0 violating of 447,975 entries, re-verified by both reviewers"
  proof_status: empirical_only
  proof_refs: []

  headline_framing: >-
    The residual REPLICATES -- exact exchangeability p = 0.0303 on the three
    headline groups over 32 pooled draws -- and it is NOT about the sieve, the
    lattice, or vector shortness. Holding the real sieve X exactly fixed and
    ablating only Y reproduces the entire departure. What it is about is the
    ALIGNMENT between the pool's Gram matrix and the candidate phase matrix.
    Separately and structurally: no operational direction exists, in either
    sense, anywhere in this campaign.

  scope_statement: >-
    One LWE instance at dimension 60 (m=35, n=25), q=127, one sieve database,
    candidate groups at K = 8, 11 and 25, plus the adjacent-FFT-bin family under
    the Stage B tuple at N = 4253. Toy scale, one instance, one database.

  claim_tier_note: >-
    `measurement_toy_scale`. The certificate re-verifies; it certifies the
    vectors, not any inference from their scores.

  direction_note: >-
    `mixed`: the replication succeeds, the interpretation is localised away from
    the campaign's object, and the operational reading is shown to be
    structurally unavailable.

  strength_note: >-
    `moderate`: the statistic is reproduced by two independent reviewers from
    independently written code, but rests on ONE instance and ONE database, the
    five groups are three nested families, and the best exact per-group p is
    0.0244 on one of five correlated groups.

  what_is_established:
    - >-
      T1 REPLICATES. Sixteen draws of the family-ablated null put the real
      certified dual family OUTSIDE_LOW on secret_distribution_25
      ([0.4309, 0.5074] against 0.4149), near_miss_25 ([0.7485, 0.8079] against
      0.7283) and near_miss_8 ([0.8835, 0.9346] against 0.8646), and INSIDE on
      both uniform groups. The validator re-drew on disjoint seeds and the three
      headline groups stayed OUTSIDE_LOW; pooling both ensembles to 32 draws
      gives exact exchangeability p = 0.0303, the 1/33 floor, with zero of 32
      below the real value.
    - >-
      THE INTERVAL CONSTRUCTION IS HONEST. The validator measured the offset
      scale rather than trusting it: real against ablated Y through dep.phases
      give off-mod-q mean 59.2636/59.1189, sd 50.7728/50.7516, cosPhi mean
      +0.56937/+0.56861 -- matched to three decimals, identical pipeline,
      identical candidate columns, identical K.
    - >-
      THE DEPARTURE IS NOT ABOUT THE SIEVE, THE LATTICE, OR SHORTNESS. The
      validator's ABL-Y-only arm holds the real sieve X EXACTLY FIXED and
      reproduces the whole departure on the same 4 of 5 groups; ABL-X-only does
      the same. OUTSIDE_LOW therefore carries no information about sieve
      geometry, lattice membership, or vector shortness.
    - >-
      WHAT IT IS ABOUT, established by the red team and cleaner than the package
      claimed: it built three nested nulls -- ROWPERM (X real, Y real, only the
      row pairing broken), XABL and YABL, n = 8 each. Since closed_form_cov
      depends on X only through X X^T and row norms, ROWPERM is a COMPLETE
      decomposition, and the deficit lives entirely in the ALIGNMENT between the
      sieve pool's Gram matrix and the candidate phase matrix.
    - >-
      THE RED TEAM'S OWN CONJECTURE WAS REFUTED BY MEASUREMENT, and it reports
      that as its most important finding: it proposed that sieve pools are
      pairwise-reduced and so have lighter Gram tails, and measured pairwise
      cosine sd 0.16924 real against 0.16890 ablated, kurtosis 2.8460 against
      2.8406. No such effect.
    - >-
      DEV-5 HOLDS AND IS STRUCTURAL. The validator reproduced the
      non-monotonicity three ways including IN CLOSED FORM WITH NO SIMULATION:
      m_z(t) is U-shaped with minimum -1.1849 at t = 0.365, crossing back
      through the independence baseline at t* = 0.7259, so OP-HARDER is emitted
      for EVERY shared fraction in (0, 0.726). The producer's stated mechanism
      is wrong on [0, 0.365]. The red team adds that the dominant response to
      rising dependence is OP-HARDER (3 of 5 grid points at |z| 34.8-49.9), that
      the grid's smallest nonzero point has |mean corr| 0.3059 while every real
      cell has at most 0.03305 -- a factor of about 9, so labels are read off an
      uncharacterised region -- and that two of three adjacent labels flip under
      plausible re-estimation of an sd taken from 8 realisations. NO OPERATIONAL
      DIRECTION EXISTS, IN EITHER SENSE, ANYWHERE IN THIS CAMPAIGN.
    - >-
      T2 put the correct candidate into every group for the first time in six
      batches, on the adjacent-FFT-bin family at matched K = 11, with
      expectations frozen at t = 0.0s: E1 met 2/3, E2 met (max |mean corr|
      0.03305), E3 NOT met 1/3 with the producer recording its stated reason as
      wrong, E4 no prediction by design. Result: OP-HARDER (p=2), OP-EASIER
      (p=3), OP-HARDER (p=5) -- sign-inconsistent, mirroring batch 5. The
      reconstruction reproduces the archived K=10 statistics at delta 0.00e+00
      in all six cells.
    - >-
      PROVENANCE IS THE CLEANEST OF THE CAMPAIGN. report.md byte-identical to
      results.json["report_markdown"] at the producer's DECLARED sha256, 28,547
      bytes, verified independently by the validator and traced by the red team;
      all 11 artifact hashes match; resolve.py has ZERO while loops; T2 is
      bit-reproducible from its recorded command to 17 significant figures; T1's
      real arm reproduces at 0.00e+00 from independently written code. DEV-4
      confirmed as an invocation error producing no measurement (/usr/bin/time
      absent, exit 127 before Python starts).
    - >-
      KN-TECH-1a5b7e lands both owed corrections TWICE EACH -- in the front
      changelog and inline at the point of the original error as boxed
      corrections, which is the placement that reaches a stranger -- and
      correction 2 replaces the wrong cause rather than deleting it.
      `confidence` deliberately held at `single_run_experiment`. 0 diff lines on
      KN-TECH-6c0e15 and KN-TECH-9d21c4, verified.

  what_is_not_established:
    - >-
      Anything about ML-KEM. No break, no security proof, no FIPS 203 parameter
      set affected or cleared, no speedup, no cost claim, no exponent moved.
    - >-
      That the independence heuristic fails, or holds. Six batches did not test
      it. This is recorded in the decision as the reason C2 is unmet.
    - >-
      Any operational direction. DEV-5 shows it is structurally unavailable.
    - >-
      That the residual is a property of sieve-produced vectors. The rejected
      null was known false by construction -- the package's own membership
      certificate IS the statement that y is a deterministic function of x, so
      OUTSIDE_LOW licenses only "not the ablated object", which nobody disputed.

  narrowest_supported_statement: >-
    At dimension 60 with q = 127, on one LWE instance and one sieve database,
    the effective-independent-candidate statistic for the real certified dual
    family falls below a 16-draw family-ablated interval on three of five
    candidate groups -- which are three nested families, not five independent
    ones -- with exact exchangeability p = 0.0303 over 32 pooled draws and a
    best per-group exact p of 0.0244 over 40 decoupled draws. The deficit is
    reproduced with the real sieve X held exactly fixed, so it is not a property
    of sieve geometry, lattice membership or vector shortness; a row-permutation
    decomposition places it entirely in the alignment between the pool's Gram
    matrix and the candidate phase matrix. A second certified dual family for
    the same instance sits ABOVE the sieve on all five groups. No operational
    direction is available: the sensitivity curve is provably non-monotone, so
    the OP-HARDER label is emitted for every shared fraction in (0, 0.726). No
    ML-KEM break. No security proof. No statement about FIPS 203 parameters.

  narrowest_supported_statement_provenance: >-
    Composed by the Coordinator from VAL-20260805-983040's re-drawn ensembles
    and closed-form derivation and RT-20260805-a98111's nested-null
    decomposition, after both reviews were complete.

  observations:
    - id: OBS-1
      statement: >-
        SIEVE_SUMS, the second archived certified dual family for the same
        instance, sits ABOVE SIEVE on all five groups by 0.0285-0.1463,
        exceeding the 0.0009-0.0589 deficit on four of five. Marginals differ,
        so the red team records it as a spread counterexample and not a sign
        one, and states it did not run the marginal-matched null because that
        would exceed maximum_runs.
      supported_by: RT-20260805-a98111 OBJ-3
    - id: OBS-2
      statement: >-
        On two of the three OUTSIDE_LOW groups the real value is NOT extremal
        against the pooled decoupled draws (ROWPERM 05 = 0.8477 < 0.8646;
        XABL 00 = 0.7150 < 0.7283).
      supported_by: RT-20260805-a98111 OBJ-2
    - id: OBS-3
      statement: >-
        uniform_8's INSIDE is a 49.5% coin flip, priced by resampling 16 of 32
        pooled draws 2000 times, and it FLIPS to OUTSIDE_LOW on the validator's
        ensemble. The headline 3/2 split is 4/1 on those draws.
      supported_by: VAL-20260805-983040 DEF-2
    - id: OBS-4
      statement: >-
        The five groups are three nested families -- near_miss_8 is a subset of
        near_miss_25, uniform_8 of uniform_25 -- so "3 of 5" is 2 of 3.
      supported_by: VAL-20260805-983040 DEF-5
    - id: OBS-5
      statement: >-
        SENS-T1 varies rank(X) from 35 to 5, but real X and ablated X are both
        rank 35: it certifies sensitivity to the one nuisance parameter held
        constant. Its warrant cites RT-20260804-0ff29a OBJ-3, which draws the
        OPPOSITE conclusion from the same premise.
      supported_by: VAL-20260805-983040 DEF-3
    - id: OBS-6
      statement: >-
        The "derived-in-advance false-positive rate met on all five groups" is
        ALGEBRAICALLY FORCED given pairwise-distinct draws, and the producer
        says so. It is the sixth forced quantity of the campaign and the first
        forced in the VERIFICATION rather than the measurement.
      supported_by: RT-20260805-a98111
    - id: OBS-7
      statement: >-
        A fourth departure exists that appears in report.md's table but in
        neither the narrative nor the commit message: uniform+correct at p=5,
        z = -5.21, the largest |z| in the batch.
      supported_by: VAL-20260805-983040 DEF-7

  inference: >-
    The campaign's one surviving quantity replicated and was then localised out
    of the campaign's subject matter. It is a real property of the alignment
    between a vector pool's Gram matrix and a candidate phase matrix, at one
    instance, with no operational sign. That is a smaller and sharper object
    than "sieve-produced dual vectors depart from independence", and it is not
    what six batches were for.

  heuristics_relied_on:
    - id: H-SCALE-1
      statement: That toy-scale behaviour transfers to cryptographic dimensions.
      status: >-
        OPEN and never tested. RC-5, the dimension sweep at fixed (N, K), went
        unmet for three consecutive batches and is the successor's first task.

  boundaries:
    - One instance, one database, one modulus, one sieve family.
    - >-
      Three nested candidate families presented as five groups; best exact
      per-group p is 0.0244 on one of five correlated groups.
    - >-
      No operational direction, structurally. Every label in T2 is read off an
      uncharacterised region of a provably non-monotone curve.

  unresolved_confounds:
    - >-
      Whether the residual is carried by the coupling y = A^T x mod q alone.
      The validator names the one cheap un-run control: an ablation that
      PRESERVES the coupling while destroying the sieve geometry.
    - >-
      Whether SIEVE_SUMS sitting above SIEVE survives a marginal-matched null.
      Unrun; would have exceeded the batch's run budget.

  evidence_integrity_findings:
    - id: INT-1
      finding: >-
        Two minor Coordinator quotation defects in snapshot commit 0d34dfcb:
        "cleared its 0.05 threshold by 0.3952" states the gap, where the margin
        over threshold is 0.3452; and "the producer calls the most important
        thing T2 produced" renders the producer's "most important CAVEAT in T2".
      raised_by: RT-20260805-a98111 OBJ-8, OBJ-9
      materiality: >-
        Minor, and explicitly NOT the batch-5 fabricated-attribution class. The
        red team verified that the quote-only-from-declared-paths rule was KEPT:
        every quoted string traces to report.md, every figure to results.json,
        results_t1.json or results_t2.json, and the hash-verified extraction
        checks out. No security claim anywhere.
    - id: INT-2
      finding: >-
        1/16 = 6.25% is the leave-one-out rate; the exchangeability rate for the
        verdict is 1/17 = 5.88%. Conservative in effect, but KN-TECH-1a5b7e
        promulgates 1/n as a general prescription.
      raised_by: VAL-20260805-983040 DEF-4
      materiality: Minor, and owed as a correction to the knowledge entry.
    - id: INT-3
      finding: >-
        KN-TECH-1a5b7e's mode 5 says "report the interval, not the point" and
        then reads a verdict off the interval's ENDPOINT -- itself a point
        estimate, which decides the verdict 49.5% of the time on this batch's
        own data.
      raised_by: VAL-20260805-983040
      materiality: >-
        Moderate as a curator note. The entry's own advice is undercut by its
        own worked example.

  coordinator_observations_unreviewed: []

  pareto:
    dominated_by: >-
      RC-5, the dimension sweep at fixed (N, K), which would test the one
      heuristic this campaign never tested; and the coupling-preserving
      ablation, which would settle what the residual is carried by.
    sota_delta: >-
      None claimed and none exists. No attack improved, no exponent moved, no
      cost reduced, no parameter set affected.

  review_refs:
    - VAL-20260805-983040
    - RT-20260805-a98111
  review_verdicts:
    validator: >-
      ADMISSIBLE_WITH_DEFECTS, 7 numbered defects, 3 material. Re-drew the
      ensemble on disjoint seeds and derived DEV-5's non-monotonicity in closed
      form.
    red_team: >-
      pass_with_constraints. 21 claims: 16 reproduced, 2 not_reproduced, 3
      unable_to_check. 11 numbered objections. Attacked the axis it was given,
      failed, and reports that failure as its most important finding.
  review_provenance_note: >-
    Two independent sessions on snapshot 0d34dfcb, dispatched concurrently with
    nothing forwarded. Both re-derived from independently written code. Neither
    committed its own artifacts. INDEPENDENCE LIMIT: every participant across
    all six batches resolves to claude-opus-5; independence is procedural, not
    model-level, and that limitation is recorded in every batch of this
    campaign.

  rule12_status: >-
