  id: EV-MONO-661ee4
  hypothesis_id: H-MONO-5b6617
  experiment_ids: [EXP-MONO-815525]
  run_ids: [RUN-MONO-815525-1]
  type: derivation_plus_independent_review_with_decisive_null_object_control
  direction: instrument_no_go_zero_discriminating_power_underlying_claim_neither_confirmed_nor_refuted
  strength: >-
    the_construction_is_correct_and_the_projective_interpretation_is_proven_but_the_diagnostic_itself_is_proven_to_carry_zero_evidential_content_via_an_explicit_null_object_control
  claim_tier: toy
  certificate_refs:
    - experiments/EXP-MONO-815525/execution_report.yaml
    - experiments/EXP-MONO-815525/runs/RUN-MONO-815525-1/
    - experiments/EXP-MONO-815525/reviews/validator/validation-report.yaml
    - experiments/EXP-MONO-815525/reviews/red-team/red-team-report.yaml
    - ledger/corrections/CORR-20260904-293257.yaml
  proof_status: derivation
  proof_status_note: >-
    The S_4 construction and the projective (root-at-infinity) reading of
    the affine deviations are both now proven, independently, via three
    fully disjoint methods across two reviewers (algebraic identity;
    direct point arithmetic on the complete deviation set; independent
    enumeration-based construction verification). What is NOT proven, and
    is in fact disproven, is that this experiment's own g-irreducible
    diagnostic carries any information about which subgroup of S_4 is
    actually realized.
  proof_refs:
    - experiments/EXP-MONO-815525/reviews/validator/validation-report.yaml (c_4=S_3^2 proof; full point-arithmetic verification of all 6,762 instances; Frobenius-fixed-class confirmation)
    - experiments/EXP-MONO-815525/reviews/red-team/red-team-report.yaml (independent construction audit; isogenous-curve finding; the decisive null-object control)

  observations:
    - >-
      THE PROJECTIVE READING IS PROVEN, NOT MERELY ARGUED: c_4(e) =
      S_3^sym(e)^2 exactly (independently derived by both reviewers via
      disjoint methods) -- the m=4 quartic's leading coefficient vanishes
      if and only if H-MONO-93bc4d's own S_3 vanishes, i.e. if and only if
      some signed sum of the three base points is O. The Validator
      independently verified, via real F_{p^3}/F_{p^6} point arithmetic,
      ALL 6,762 disclosed degree-drop instances (not a sample): in every
      one, exactly one of the four signed sums equals O, and it is always
      the Frobenius-fixed sign class, exactly matching the theoretically
      predicted affine action. The S_4 construction itself is
      independently confirmed correct by a third, fully disjoint method
      (direct group-law enumeration across 15 curves and 7 primes,
      146,839 S_4 multisets, zero mismatches, including supersingular and
      j=0/1728 curves the census itself excluded).
    - >-
      A GENUINE, UNTESTED DEGENERATE EDGE CASE WAS FOUND BUT DID NOT
      AFFECT THIS RUN: when g equals the curve's own defining polynomial f
      exactly (i.e. the three "base points" are the three finite
      2-torsion points), ALL FOUR sign classes sum to O and Q_e degenerates
      identically to 1 -- a case IDEA-20260904-ad63fe's own (C3) clause
      explicitly excludes (Res(g,f) != 0) but this experiment's own
      selection rule ("g irreducible" alone) did not. The Validator located
      such a point on tested curve C3 (p=211); it was not hit by the 300
      random draws on C3, and the two exhaustive sweeps were on different
      curves (C1, C5), so it never affected the reported results -- but
      future contracts in this sub-lane must add this exclusion explicitly.
    - >-
      THE CURVE SAMPLE WAS PARTIALLY DEGENERATE: C1 and C5 (both p=101)
      are F_p-isogenous (same trace, order, CM discriminant, (t,Z) class),
      so their "unexpectedly identical" deviation counts are a curve-class
      invariant, not independent confirmation -- the effective independent
      curve count is 4, not 5.
    - >-
      THE HEADLINE FINDING: THIS EXPERIMENT HAS ZERO DISCRIMINATING POWER,
      PROVEN VIA AN EXPLICIT NULL-OBJECT CONTROL. AGL(2,2)=S_4's own 8
      elements with an order-3 linear part are ALL 3-cycles for EVERY
      translation, so "g irreducible" (order-3 linear part) already
      logically forces cycle type (1,3) as a pure group-theoretic
      consequence, independent of which translation cocycle -- the actual
      curve-specific data distinguishing full S_4 from a smaller group --
      is realized. The Red Team constructed NULL(T) = (T-e1)*g(T), whose
      monodromy is the INTRANSITIVE point-stabilizer S_3 (not even
      transitive on the four roots, let alone S_4), and showed it
      reproduces the census's exact results, instance for instance, at
      every tested prime. A design that cannot distinguish the real
      elliptic-curve cover from a manifestly wrong intransitive dummy
      provides ZERO evidence in either direction, regardless of its
      688,300-instance scale.
    - >-
      THIS IS A THIRD INSTANCE OF A NAMED FAILURE CLASS IN THIS LANE: OBS-5's
      factor-base-locus trap; EXP-MONO-12ce1c's ordered-generic-locus trap
      (F_p's unique quadratic extension caps cycle types); and now this
      g-irreducible-CONDITIONING trap. All three share the same shape: a
      sampling domain or conditioning choice that looks generous but is,
      by pure algebra, blind to the question being asked -- and all three
      were caught only by an explicit null-object or derivational control,
      never by scale alone. H-MONO-5b6617's own claimed "two-sided"
      pre-registration was itself not actually two-sided: the Red Team
      confirmed the named falsifying alternatives are group-theoretically
      impossible under an order-3 linear part for any subgroup capable of
      producing an irreducible g at all -- the falsification branch was
      empty before the run, a design gap this Coordinator did not catch
      before dispatch.
    - >-
      A GENUINELY DISCRIMINATING ALTERNATIVE WAS FOUND AND INFORMALLY
      PILOTED: the UNCONDITIONED five-class Chebotarev census (not
      filtering to g-irreducible), where every proper subgroup of S_4
      predicts probability EXACTLY ZERO for at least one class actually
      observed thousands of times. The Red Team's own review-side pilot
      (explicitly marked not evidence-eligible) found observed frequencies
      consistent with uniform S_4 (chi-square approximately 4.5-4.9) --
      genuinely informative context suggesting full S_4 is likely true,
      but not admissible evidence under this program's own rules until run
      under a proper, pre-registered contract.

  disposition: >-
    H-MONO-5b6617 is NEITHER SUPPORTED NOR REFUTED: the test it specified
    is proven to have zero discriminating power, an instrument no-go
    exactly analogous to the two prior rejected census instruments in this
    lane. IDEA-20260904-ad63fe's own broader full-S_4 claim at m=4 remains
    genuinely OPEN -- untouched in either direction by this experiment,
    though the Red Team's own informal pilot of the correct alternative
    design is suggestive (not evidential) support. See DEC-20260904-858cdc
    for the full disposition and the named next action (a proper,
    pre-registered unconditioned five-class census contract).
