  proof_status_note: >-
    H-MONO-45183a Part B's closed form (6(tau-1)/N) remains a derivation,
    unmodified. This evidence record concerns only whether the SAME
    matched (p=617, N=580, tau=4) cell's already-known ~2x transversal-vs-
