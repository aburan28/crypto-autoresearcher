  proof_refs:
    - experiments/EXP-MONO-cb905d/reviews/validator/validation-report.yaml (independent slot-counting + toy-curve Monte Carlo proof of the amendment's sampler correctness; blind rederivation of P1/P2/P3, with a disclosed blindness-process caveat)
    - experiments/EXP-MONO-cb905d/reviews/red-team/red-team-report.yaml (independent 4M-trial Monte Carlo reproduction of both sampler variants; discovery of the archived P3 test's own specification defect)
    - ledger/corrections/CORR-20260904-d0205d.yaml (the test-mismatch defect and this Coordinator's own independent delta-method re-verification)

  observations:
    - >-
      SAMPLER MATH IS NOW VERIFIED CORRECT BY TWO FULLY INDEPENDENT
      METHODS. The Validator's toy-curve (p=19) exact enumeration plus
      2,000,000-draw Monte Carlo and the Red Team's 4,000,000-trial
      combinatorial Monte Carlo of three variants (v1's actual defect, v2's
      corrected construction, and a targeted "drop only the O slot"
      mutation) both independently confirm: v1 overweights 2-torsion points
      exactly 2x and never reaches O; v2 is exactly 1/N-uniform. Both
      reviewers' own proves-too-much controls passed -- their methods
      correctly flag known-biased variants as biased, not merely "look
      fine" on everything. This is now checked by three independent
      parties across this lane (the Executor's own disclosed protocol
      deviation, the Validator, and the Red Team), all converging.
    - >-
      RUN-MONO-cb905d-1's PART A REMAINS NOT EVIDENTIALLY USABLE per
      CORR-20260831-ba2118 (biased sampler). ITS PART B (100/100
      cross-prime cells, transversal-only, unaffected by the sampler
      defect) REMAINS VALID EXPLORATORY CONTEXT, UNCHANGED BY THIS RECORD.
    - >-
      RUN-MONO-cb905d-2's ARCHIVED P3 HEADLINE STATISTIC (Fisher-exact,
      p=0.32999, "not significant") IS A TEST-SPECIFICATION DEFECT, NOT A
      GENUINE NULL RESULT. Per CORR-20260904-d0205d: the archived test
      compared the wrong quantity (any-collision-per-tuple counts, ignoring
      each curve's own noisy transversal baseline) rather than testing
      whether P1 and P2 (the actual pairs-per-tuple ratios under
      pre-registered comparison) differ. A properly-specified test --
      independently derived by the Red Team via three methods (p in
      [0.022, 0.038]) and independently re-derived by this Coordinator via
      a fourth, different method (log-ratio delta method on the four raw
      counts directly: p=0.0248) -- is NOMINALLY SIGNIFICANT at alpha=0.05.
      This REVERSES the archived headline's "not significant" reading.
    - >-
      THIS IS NOW THE THIRD CONSECUTIVE BORDERLINE HEADLINE STATISTIC ON
      THE SAME SINGLE (p=617, N=580, tau=4) CELL: EXP-MONO-64aaa4's
      pre-registered two-sided test (p=0.066, just outside 0.05, with
      alternative framings landing just inside it); RUN-MONO-cb905d-1's
      biased-sampler P3 (p=0.4879, discarded as apparatus-invalid, not
      counted here); RUN-MONO-cb905d-2's properly-corrected P3 (p in
      [0.022, 0.038]). NO MULTIPLICITY CORRECTION HAS BEEN APPLIED ACROSS
      THESE TESTS. A naive Bonferroni correction treating the two
      methodologically-sound tests on this cell (EXP-MONO-64aaa4's p=0.066
      and this record's corrected p~0.025-0.033) as a 2-test family would
      push the corrected result's significance to the edge of or past
      alpha=0.05 again (2 x 0.025 = 0.05; 2 x 0.033 = 0.066). This is
      disclosed as a genuine, unresolved multiplicity concern, not resolved
      by this record.
    - >-
      A GENUINE COORDINATOR PROCESS GAP IS SELF-DISCLOSED PER THE RED
      TEAM'S OWN J3 FINDING: this Coordinator authorized real compute
      (RUN-MONO-cb905d-2) and drafted an interpretive "corrected vs.
      superseded" narrative in execution_report.yaml's own addendum based
      on a single Coordinator session's own self-check, BEFORE either
      independent review mechanism touched it -- by the same entity whose
      earlier approval let v1's sampler bug through in the first place.
      The Red Team found no mathematical flaw in the amendment itself, but
      correctly names this SEQUENCING as a real scrutiny gap independent of
      whether the content turned out correct. ESTABLISHED DISCIPLINE GOING
      FORWARD: when a self-caught instrument defect requires a corrected
      re-run, dispatch independent review of the CORRECTED CONSTRUCTION
      before authorizing compute against it, not only after, unless compute
      cost genuinely forces the tradeoff (it did not here: RUN-2 took
      4.25s).
    - >-
      OBJ-6's own reference band (1.84-2.08x) was measured on five
      DIFFERENT curves at primes 103/191/421/569, never at p=617, with no
      derived (N,tau)-dependence formula for this specific ratio (Red Team
      finding OBJ-J4-2). P1 (2.398, ordinary curve) sitting outside that
      band is therefore NOT independently diagnosable as an artifact versus
      an expected cell-to-cell variation in the ratio itself -- this record
      does not attempt to resolve that question and flags it as open.
    - >-
      BLINDNESS-PROCESS FINDING (Validator): the blind_rederivation
      instruction's `blind_from` list omitted RUN-MONO-cb905d-2's own
      manifest.yaml, whose `result.metrics` block already stated the exact
      P1/P2/P3 values under review. The Validator's recomputation matched
      those values exactly but disclosed this compromised true blindness.
      ESTABLISHED DISCIPLINE GOING FORWARD: any future blind_from list must
      include a run's own manifest.yaml whenever its own result summary
      restates the rederivation target.

  disposition: >-
    NOT ADVANCED TO SUPPORTED OR TO A CLOSED FALSIFICATION. The corrected,
    properly-specified test on THIS run's own data leans toward the
    endomorphism-ring-linked reading (P3 nominally significant), reversing
    the archived headline's naive "not significant" framing -- but this is
    the third borderline result on an UNREPLICATED single cell, with no
    multiplicity correction applied and a genuine open question about
    whether OBJ-6's reference band even transfers to this specific (N,tau).
    See DEC-20260904-8c17d5 for the full disposition and named next action.
