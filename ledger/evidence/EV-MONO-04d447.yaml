    per-curve Holm/permutation statistic, on the tested panel (90-98
    curves, primes in [73,2050], F=N/4, m=4), toy scale, with the
    Fisher-combined co-metric's sensitivity left as an open, named
    qualification rather than folded into the support claim. It creates
    no ECDLP claim, no relation-rate claim, no cryptographic-scale claim,
    and does not close KN-OPEN-009. GOAL-MONO-001 remains paused; this
    experiment drew on none of its campaign budget.
