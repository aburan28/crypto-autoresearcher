  empirical_evidence_created: true
  mathematical_evidence_created: false
  scientific_evidence_created: true
  scientific_effect: >-
    H-MONO-663fb4's unconditional identities are re-exercised, not newly
    evidenced. This is the first of the lane's three K3/K4 attempts whose
    instrument was independently verified, by two reviewers via full
    bit-for-bit re-execution, to have genuine statistical power and a
    genuinely independent panel. The per-curve Holm/permutation reading
    of "no exceptional locus detected" is well-supported with high
    confidence. The co-equal Fisher-combined reading is arithmetically
    sound and its SPECIFICITY is confirmed, but its SENSITIVITY to a
    genuine positive has never been demonstrated anywhere in this lane --
    the single largest remaining open qualification. K3/K4 is therefore
    SUPPORTED toward a controlled-null reading for the tested panel and
    scale, but not fully closed: a cheap, concrete next step (running the
    Fisher-combined statistic against a reconstructed positive control)
    would close the remaining gap. No ECDLP, relation-rate, or
    cryptographic-scale claim in either direction. Does not close
    KN-OPEN-009.

