  proof_status: derivation
  proof_status_note: >-
    H-MONO-663fb4's identities (I1)-(I3) are unconditional and untouched;
    Stage 0 re-exercised them and both reviewers independently
    reconfirmed. THIS RUN'S MARGINAL CONTRIBUTION -- a design-time-power-
    verified, genuinely-independent-panel test of K3/K4 -- is, for the
    first time in this three-experiment lane, GENUINELY INFORMATIVE: both
    reviewers independently re-derived, from raw data and source rather
    than from Coordinator prose, that the permutation-p-value floor sits
    an order of magnitude BELOW every declared family's Holm threshold
    (opposite of EXP-MONO-670aa6), and that the two curve families are
    genuinely independently constructed (zero full-triple collisions,
    was 100%). The real-arm result (no significant deviation anywhere)
    is therefore a genuine null reading, not a guaranteed one.
  proof_refs:
    - experiments/EXP-MONO-b19c6b/reviews/validator/validation-report.yaml (full bit-for-bit re-execution of both runs; independent floor-vs-threshold, panel-independence, and alpha-inflation re-derivations; two new disclosed findings)
    - experiments/EXP-MONO-b19c6b/reviews/red-team/red-team-report.yaml (independent audit of all 760 raw per-curve p-values with a self-applied null-object control on an exploratory pattern; the alpha-inflation a-priori-power sharpening; the K5 Fisher-combined sensitivity gap, the strongest new finding)

  observations:
    - >-
      STAGE 0, THE DUAL-PATH CHECK, PANEL INDEPENDENCE, AND THE ADMISSION
      RULES ALL HOLD, INDEPENDENTLY RECONFIRMED BY BOTH REVIEWERS VIA
      FULL RE-EXECUTION. Stage 0's fixture identities reproduce exactly.
      Route-1/route-2 agreement on all real-arm cells is exact (0.0
      relative residual) in both runs, both reviewers. `family` is
      confirmed threaded through all five declared seed call sites by
      direct source reading (not inference from absent collisions);
      Stage 1's independence verification shows ZERO full-triple
      (p,B,t_used) collisions across 46 and 48 matched curve_ordinals --
      a complete reversal of EXP-MONO-670aa6's 100% collision rate,
      independently reproduced by both reviewers from raw data. The j0
      family's p=1(mod 3) admission rule and the random-ordinary family's
      supersingularity rejection are both independently confirmed 100%
      clean (45/45, 48/48 and 0/48, 0/49 respectively), closing
      EXP-MONO-670aa6's 58%-supersingular-contamination finding.
    - >-
      THE DESIGN-TIME POWER CHECK GENUINELY WORKED, CONFIRMED EXACTLY BY
      BOTH REVIEWERS. n_null_draws=20000 confirmed directly; realized
      per-family Holm test counts (90, 96, 96, 98) give a floor
      (1/20001) sitting 10.2x-11.1x BELOW every family's own Holm
      threshold -- the opposite inequality from EXP-MONO-670aa6's 5-10x
      ABOVE. Neither reviewer found any p-value near the floor: the
      global minimum RAW p-value (0.0062, ~124x the floor) and the
      global minimum HOLM-ADJUSTED p-value (0.558, ~11x nominal alpha)
      both sit far from significance. The Red Team went further and
      independently audited ALL 760 raw per-curve p-values directly (not
      the corrected summaries): only 27/760 (3.55%) fall below nominal
      0.05 -- BELOW the 38/760 (5.00%) a perfectly-calibrated null would
      produce, not above it. This is a genuine, non-tautological "no
      signal" reading.
    - >-
      ONE EXPLORATORY PATTERN WAS FOUND AND SELF-CONTROLLED BY THE RED
      TEAM, AND READS AS NOISE. Among the 27 nominally-low p-values,
      field_bits=9 curves were mildly enriched (6.58% vs 3.55% pooled,
      Fisher p=0.045, not surviving Bonferroni over 5 field-bit
      categories). The Red Team applied a null-object control to its own
      finding: the SAME enrichment appears at comparable magnitude in the
      null-object arm (which has no real effect by construction), so this
      reads as benign per-cell noise texture at that group-size range,
      not a deviation specific to the real x-coordinate factor base.
      Explicitly not evidence toward H-MONO-663fb4's status.
    - >-
      A DISCLOSED, INDEPENDENTLY-VERIFIED, EMPIRICALLY-INCONSEQUENTIAL
      DESIGN DEFECT (CORR-20260831-d663e0) IS CONFIRMED REAL BUT
      SHARPENED IN ITS PRACTICAL READING BY THE RED TEAM. Both reviewers
      independently confirmed 1-(0.95)^6 ~= 26.5% (not the implicit 5%)
      is the Stage-2 gate's true per-seed false-stop rate, given its
      un-Bonferroni-corrected union of six sub-tests -- and the Validator
      additionally found (RECOMP-8/OTHER-FINDING-2) the IDENTICAL defect
      recurs, unremarked by the correction, in Stage 3's own
      exceptional-locus-vs-controlled-null outcome determination. Both
      reviewers confirmed every relevant observed statistic (minimum
      Fisher-combined p=0.4302, minimum Holm-adjusted p=0.558) sits far
      above both the nominal and corrected thresholds, so the SPECIFIC
      numbers are unaffected. The Red Team's own sharpening: a
      well-calibrated instrument had only a ~54.0% a priori chance
      (0.735092^2) of passing the flawed composite gate on BOTH seeds --
      so the bare "Stage 2 passed" EVENT, read alone, is materially
      weaker evidence of calibration than a naive reader might assume;
      the actual evidentiary weight rests on the p-value MAGNITUDES
      (independently confirmed far from either threshold), not the
      binary pass/fail outcome.
    - >-
      THE SINGLE LARGEST OPEN QUALIFICATION, THE RED TEAM'S STRONGEST NEW
      FINDING: THE MANDATORY K5 NEARBY-OBJECT POSITIVE CONTROL WAS NEVER
      RE-EXERCISED AGAINST THE FISHER-COMBINED STATISTIC ANYWHERE IN THIS
      THREE-EXPERIMENT LANE. H-MONO-663fb4's own
      `proof_search_map.method_ceiling.nearby_object_control` requires
      any instrument to demonstrate it CAN detect a known-exceptional
      case before a null reading from it is trusted. This contract's
      legacy-panel reliance on EXP-MONO-c819ba's own already-reviewed
      subgroup/coset-union result validly discharges this for the REUSED
      per-curve Var/permutation computation (`conv.py`, byte-identical,
      twice independently reviewed) -- but this contract ALSO introduces
      the Fisher-combined panel-level statistic as a CO-EQUAL primary
      metric for the first time, specifically to catch effects too small
      to survive per-curve correction, and no positive control anywhere
      in this lane has ever been run through it. The Stage-2 null-object
      gate confirms the Fisher-combined test's SPECIFICITY (it does not
      fire on a null-vs-null comparison); it does NOT confirm its
      SENSITIVITY (that it would fire on a genuine positive). The Red
      Team's own supplementary synthetic check (uniform p-values with 2,
      5, or 10 of 50 replaced by near-zero p-values, giving combined
      p=0.00028/0.0074/1.1e-14 respectively) confirms the statistic's
      MACHINERY is not fundamentally broken, but is explicitly disclosed
      as a synthetic sanity check, not a contract-grounded positive
      control, and creates no evidence toward H-MONO-663fb4.
    - >-
      TWO FURTHER OPEN GAPS, BOTH DISCLOSED AS RECURRENCES OF A NAMED
      CROSS-LANE PATTERN (KN-TECH-a810e4). (1) Stage 4's extended
      dual-path sample clears its declared ">=200 samples" floor by
      sampling only TWO fixed within-curve positions (draw_index 0 and
      100) repeated across ~97 curves, leaving over 99% of any single
      curve's 20,000-draw null-index range unswept by the independent
      computation route -- a narrower recurrence of EXP-MONO-670aa6's own
      coverage gap, satisfied in letter (the numeric floor) but not
      intent (representative coverage of the range the p-value machinery
      depends on). Empirically low-risk (every check performed anywhere
      in this lane has found exact route agreement), but the coverage
      claim should not be over-read. (2) An undisclosed, benign partial
      (prime-only, not full-triple) cross-family collision rate (3/46,
      3/48 matched ordinals) was found only by re-deriving it from the
      raw comparison array; never stated in the archived prose.
    - >-
      A MILDER RECURRENCE OF A "SELF-ASSERTED-AS-VERIFIED" PROCESS
      PATTERN, INCONSEQUENTIAL HERE. The frozen contract's own approval
      rationale claimed panel independence was verified "via a required
      pre-approval extraction script" -- but the Validator confirmed no
      implementation code existed at the design/approval commit at all,
      so no such script could have run before approval. The underlying
      claim (that the family-keying fix produces genuinely independent
      panels) turned out TRUE, independently confirmed by both reviewers
      against the actual executed runs -- unlike the prior round's
      version of this pattern, where the analogous self-asserted claim
      was FALSE and consequential. Noted for the Coordinator's continued
      attention to approval-time practice.
    - >-
      GOVERNANCE, DISCLOSED, CONTENT INDEPENDENTLY VERIFIED CORRECT.
      CORR-20260831-d663e0 discloses the thirteenth out-of-band "Cursor
      Agent" commit; both reviewers independently confirmed the executed
      code used the ORIGINAL (pre-tampering) alpha=0.05-per-test
      semantics, not the tampered text's alpha_gate=0.05/6, via direct
      source reading -- and the Validator additionally found an
      independent TIMESTAMP proof (both runs completed ~7 hours before
      the tampering commit was even authored) beyond the git-commit-graph
      reasoning this session has relied on for all twelve prior
      incidents. Not adopted as an authorized amendment.
    - >-
      NO SCOPE CREEP, CONFIRMED BY BOTH REVIEWERS. `asymptotic_claim: null`
      holds throughout; no ECDLP, cost, or exponent claim appears anywhere.
      Both reviewers explicitly note "controlled null confirmed" is
      CONSISTENT WITH but does not CONFIRM HEUR-CHR-2 (absence of a
      detected deviation at this power and panel size is not evidence the
      deviation is bounded for all generic ordinary curves).

