  proof_status_note: >-
    The ORDERED-base claim (HEUR-KUM-2: S_m irreducible over
    k(x_1..x_{m-1})) is now supported by THREE independent proofs of the
    honest |S|>=2 gap: this Coordinator's own specialization witnesses
    (valid but scope-limited, per finding below); the Validator's own
    general dominance argument (fixing all-but-one coordinate gives a
    surjective map, so the E[2]-preimage has positive codimension); and
    the Red Team's own general transcendence-degree argument (if Q_S is
    2-torsion, a fixed point's coordinate becomes algebraic over the
    remaining generic points' field, contradicting transcendence) --
    plus independent confirmation the underlying theorem is already
    published (arXiv:1403.0126 Theorem 1; eprint.iacr.org/2017/609). The
    SYMMETRIC-base claim (D3) is a derivation shown WRONG at its own m=3
    baseline, not merely unconfirmed.
  proof_refs:
    - experiments/EXP-MONO-917e3a/reviews/validator/validation-report.yaml (dominance argument; witness quantifier-order critique)
    - experiments/EXP-MONO-917e3a/reviews/red-team/red-team-report.yaml (transcendence-degree argument; literature citations; (D3) refutation)

  observations:
    - >-
      HEUR-KUM-2 IS DISCHARGED FOR THE ORDERED BASE, AT EVERY m>=3, IN
      CHARACTERISTIC NOT 2 OR 3 -- decisively, via convergent independent
      proof by two disjoint reviewers using unrelated methods (explicit
      polynomial reduction vs. transcendence-degree), corroborated by
      published literature neither reviewer nor this Coordinator had
      searched beforehand. H-MONO-45183a's own named weakest link is
      resolved. THIS IS NOT A NOVEL RESULT TO THE FIELD (per finding_1 in
      CORR-20260904-d2c631) -- the program's own contribution is closing an
      internal gap and identifying the Part A/Part B structural coupling,
      not proving a new theorem.
    - >-
      THE SYMMETRIC-BASE EXTENSION (D3) IS REFUTED AT ITS OWN m=3
      BASELINE, NOT MERELY LEFT OPEN: independently verified by the Red
      Team via explicit discriminant factorization that the true m=3
      symmetric-base monodromy is S_2 (order 2), not the order-4 group
      (D3) claims. The root cause -- an unstated, unproven, and (at m=3)
      FALSE assumption that the symmetric-base splitting field contains
      the ordered-base one -- is precisely identified. This is a genuine
      proves-too-much failure caught in the record's own designated
      baseline slot.
    - >-
      THE DISCLOSED m=5 COLLISION WAS MISLABELED IN THREE PLACES
      (H-MONO-93bc4d, execution_report.yaml, raw-result.json's own note):
      both reviewers, independently and via disjoint methods, identified
      the SAME correct colliding pair -- (1,1,1,1) vs (1,-1,-1,-1), caused
      by P_2+P_3+P_4=O -- and traced this to the exact point-at-infinity
      branch of E[2] the original mechanism's Step 3 text silently
      dropped. The record's own single disclosed anomaly was itself
      evidence of the gap it was trying to close, concealed by the
      mislabeling rather than revealed by it.
    - >-
      THE SPECIALIZATION-WITNESS APPROACH THIS COORDINATOR USED IS VALID
      AS FAR AS IT GOES BUT DOES NOT ESTABLISH THE CLAIMED SCOPE: the
      Validator confirmed the core logic (a witness at any point,
      however degenerate, validly shows non-identical-vanishing) is
      sound, but identified a quantifier-order gap: a witness at one
      specific (A,B) proves the statement for THAT curve only, not for
      "every non-singular E." The Red Team independently and
      quantitatively confirmed this is a REAL practical gap, not a
      theoretical nicety: exhaustive search found 0 of 870 curves at
      p=31 admit ANY clean m=4 witness, while the generic (indeterminate)
      statement remains true for every one of them -- witness-existence
      and generic truth are empirically decoupled. The dominance/
      transcendence arguments both reviewers independently supplied
      close this gap completely and require no witness at all.
    - >-
      A GENUINE COINCIDENCE AT m=4 IS NOTED: the Red Team confirmed
      S_3 -> Aut(V) is not merely injective but an ISOMORPHISM at m=4
      (both groups have order 6), meaning the ordered-base containment
      alone already gives the full symmetric group Sym(4) at this
      specific arity -- a fact with zero additional content once the
      isomorphism is noted, distinct from the general m>=4 injectivity
      argument (D3)'s own text gives.
    - >-
      A CONCRETE, NAMED NEXT CHECK FOR THE STILL-OPEN SYMMETRIC-BASE
      QUESTION AT m=4 IS SUPPLIED BY THE RED TEAM, and it is IDENTICAL to
      IDEA-20260904-ad63fe's own recommended-first Stage 1 test: search
      for a 3-cycle in the Frobenius action on the four roots of S_4's
      symmetric-base descent, over base points where the residual cubic
      g is irreducible. One 3-cycle proves the missing surjection onto
      S_3 at m=4 (supporting IDEA-20260904-ad63fe's own AGL(2,2)=S_4
      claim); systematic absence refutes it. This is a genuine
      convergence between this record's own open question and a
      separately-filed, independently-designed proposal.
    - >-
      MINOR PROCESS DEFECT DISCLOSED: EXP-MONO-917e3a's own frozen
      specification did not explicitly address the five CORR-20260802-1d8384
      OI-1 requirements (recording `protocol_deviations: []` rather than
      an explicit not-applicable disposition), per the Red Team's own
      finding. Not consequential to this record's own conclusions (a
      zero-compute/near-zero-compute mathematical verification, not a
      sampled census the OI-1 requirements were designed for), but noted
      for future contract templates in this sub-lane.

  disposition: >-
    H-MONO-93bc4d is PARTIALLY CONFIRMED (ordered-base HEUR-KUM-2,
    decisively) and PARTIALLY REFUTED (symmetric-base (D3) extension,
