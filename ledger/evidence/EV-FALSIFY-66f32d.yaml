evidence:
  id: EV-FALSIFY-66f32d
  hypothesis_id: H-FALSIFY-40538b
  question_id: RQ-FALSIFY-a2c501
  experiment_ids: [EXP-FALSIFY-d770c1]
  run_ids: []
  run_ids_note: >-
    No new run. This is a reproduction check of another experiment's archived
    artifact, RUN-SMON-e5cbe6-001, whose figures are recomputed from the
    committed JSON. Nothing new was measured.
  finding_under_test: KN-FIND-a8990a
  type: analytical
  direction: supports
  direction_note: >-
    Supports the finding under test and correspondingly contradicts prediction
    P-2 of the hypothesis that filed this experiment. Second corpus record after
    KN-FIND-ac28ed to verify in every particular checked.
  strength: strong
  claim_tier: toy
  proof_status: certificate
  proof_status_basis: >-
    Every figure is recomputed exactly from the committed artifact, decided
    rather than sampled.
  proof_refs:
    - experiments/EXP-SMON-e5cbe6/runs/RUN-SMON-e5cbe6-001/raw-result.json
  recorded_at: '2026-08-08'

  observations:
    - id: O-1
      text: >-
        RULE 2 SATISFIED FIRST. check_currency.py flags two corrections naming
        KN-FIND-a8990a: CORR-20260807-652652 (targets KN-FIND-a1f3c2) and
        CORR-20260808-3d4031 (targets EV-FALSIFY-440677, this program's own).
        Neither targets a8990a. It is current.
    - id: O-2
      text: >-
        THE CITED ARTIFACTS ALL EXIST, which for a derivation-tier record is not
        guaranteed: papers/semaev-conservation-specialization/paper.tex,
        experiments/EXP-SMON-e5cbe6/contract.md, and the run's raw-result.json,
        alongside independent implementation code (code/semaev_cover.py,
        code/verify.py). Contrast the nine D6 records whose proof_refs name only
        themselves.
    - id: O-3
      text: >-
        THE HEADLINE COUNT IS EXACT. The confidence_note claims the finite-scale
        consequences "held on 241643 good specializations with zero exceptions".
        Recomputed from the artifact: the C4 dichotomy checks total
        16,737 (C2_C4, sampled) + 224,906 (C6, exhaustive) = 241,643. Exact
        match.
    - id: O-4
      text: >-
        AND THE AGGREGATION IS THE CORRECT ONE, which is worth stating because a
        naive sum is wrong. Adding C5_factor_base_locus (16,107) gives 257,750.
        C5 tests a DIFFERENT consequence -- that the factor-base locus splits
        completely -- not the dichotomy, so excluding it is right. This checker's
        first pass made exactly that error and would have filed a 16,107
        discrepancy that does not exist; the record's arithmetic was right and
        the check was wrong.
    - id: O-5
      text: >-
        ZERO EXCEPTIONS VERIFIED, not accepted. Across every reported cell:
        mixed_patterns = 0 at m = 3, 4, 5; max_factor_degree_seen = 2 everywhere;
        one_pattern_per_class = True everywhere; pattern_mismatches = 0 in the
        exhaustive C6 blocks. No factor of degree above 2 appears anywhere, which
        is the dichotomy the record asserts.
    - id: O-6
      text: >-
        THE NULL CONTROLS ARE REAL AND THE QUOTED NUMBERS ARE EXACT. The
        confidence_note says the same instrument rejects the nulls "at 86% and
        51%". From the artifact: NULL-A obeys the dichotomy on 0.1369 of 599
        separable degree-4 samples, so it REJECTS at 86.31%; NULL-B obeys 0.4891
        of 595, rejecting at 51.09%. Both match. A null the instrument rejects at
        86% is a null that could have caught a broken instrument, which is the
        property that makes the main result readable at all.
    - id: O-7
      text: >-
        INDEPENDENT CORROBORATION IN BOTH DIRECTIONS. RUN-FALSIFY-d770c1-001
        tested the same dichotomy with a separate implementation over primes
        11..103 and found 0 violations in 1,274 specialisations
        (EV-FALSIFY-440677, as restated by CORR-20260808-3d4031). The two runs
        share no code and agree. This matters specifically because a8990a's own
        confidence_note states that AGENTS.md rule 12 is NOT met for it -- no
        validator, red team, or human function-field reader has reviewed it. An
        independent reimplementation agreeing is a partial step toward that gate
        and is not a substitute for it.

  interpretation: >-
    KN-FIND-a8990a verifies in every particular this check could reach: the
    headline count, the zero-exception claim, and both null-control rejection
    rates. It is also the best-made record encountered under this question so
    far -- it self-declares `confidence: derivation` rather than `proved`, states
    plainly that rule 12 is unmet and that novelty is not adjudicated, ships
    executable code beside the claim, and reports null controls that its own
    instrument rejects at 86% and 51%. That is what the corpus should look like.

  what_this_does_not_establish: >-
    This checks the record's REPORTED NUMBERS against its OWN archived artifact.
    It does not re-execute EXP-SMON-e5cbe6, so a fault inside that experiment's
    code would be invisible here and would have produced a self-consistent
    artifact. It does not review Theorem A's proof -- the fibre-product/Artin
    argument and Lemma 3.2 are unread by any independent reviewer, and rule 12
    remains unmet exactly as the record says. It reaches only m in {3,4,5} at the
    primes the run used, so the "every characteristic, every curve" quantifier is
    untouched by it.

  dominated_by: not_applicable_methodological
  sota_delta:
    time_exponent: not_applicable
    note: No algorithmic claim; a reproduction check of an existing record.

  knowledge_promotion: not_warranted
  knowledge_promotion_reason: >-
    A confirmation adds no mathematical content. Promoting "we recomputed this
    and it matched" would convert a reproduction check into apparent
    corroboration of a universal claim, the inflation this experiment exists to
    detect.

  successor_task: >-
    The remaining gap on KN-FIND-a8990a is the one it names itself: AGENTS.md
    rule 12. What is wanted is a reviewer reading Theorem A and Lemma 3.2 in
    papers/semaev-conservation-specialization/paper.tex, not more finite-scale
    checks -- two independent instruments now agree on the finite-scale
    consequences and a third would add little.

  scope_limits: >-
    The committed artifact RUN-SMON-e5cbe6-001 as of this branch head; m in
    {3,4,5}; the primes and curves that run used. Static recomputation only.

  independent_review_required: false
  independent_review_note: >-
    Contradicts nothing and asserts no new mathematics; it recomputes archived
    figures that any reader can recheck in seconds.

  authority_note: >-
    Evidence only. No hypothesis status changed, no finding edited or
    superseded (AGENTS.md rule 1).
