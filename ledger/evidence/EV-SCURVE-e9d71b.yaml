    - research/nist_seed_provenance_20261016/validation-20261016/out/j3_analysis.json
    - research/nist_seed_provenance_20261016/validation-20261016/out/c4_roots.json
  proof_status: certificate
  proof_status_by_claim:
    C1a: >-
      certificate. Regeneration of each seed from (t, block) and the zero
      residue c*b^2 + 27 mod p can be re-checked by any independent code from
      the published parameters (q1_seeds.json, q2_binary.json, q3_x962.json).
    C2: >-
      certificate plus derivation. The recovered states regenerate each seed
      (q7_state_recovery.json). The alignment bound and the chance figures are
      exact arithmetic (C2-2).
    C3: >-
      certificate for every prime order the classification uses. All 38 prime
      curve orders and 48 prime twist orders pass Hasse and N*P = O for three
      random points (j3_analysis.json), without relying on SEA.
      empirical_only for the composite (0) rows. Their status rests on
      two SEA early-abort runs (producer's and Validator's) that share the
      PARI/GP library, plus full counts on the 289-row sample.
    C4: >-
      certificate. These are exact modular-root identities, re-checkable from
      the published p and b (c4_roots.json).
  proof_refs:
    - research/nist_seed_provenance_20261016/validation-20261016/out/q1_seeds.json
    - research/nist_seed_provenance_20261016/validation-20261016/out/q3_x962.json
    - research/nist_seed_provenance_20261016/validation-20261016/out/q7_state_recovery.json
    - research/nist_seed_provenance_20261016/validation-20261016/out/j3_analysis.json
    - research/nist_seed_provenance_20261016/validation-20261016/out/recensus_compare.json
    - research/nist_seed_provenance_20261016/validation-20261016/out/c4_roots.json
  observations:
    - >-
      Joint verdicts (VAL-20261016-cd9156, review_attestation): J1 holds, J2
      holds, J3 holds, J4 holds, J5 holds, J6 holds, J7 inconclusive. There are
      30 check entries: 28 pass, 1 concern (J4-3), 1 not_run (J6-4).
      numeric_mismatches_against_claim and
      numeric_mismatches_against_recorded_data are both empty.
    - >-
      Every proves-too-much object failed as required (PTM-1..PTM-5). Adjacent
      blocks and t +/- 1: 40 of 40 fail. Reversed seeds: 0 hits. X9.62
      variants: (a) top bit not cleared fails on P-192, prime192v2, P-256 and
      P-384, so it identifies; (b), (d) and (e) fail on all ten; (c) no
      mod-2^160 wrap holds on all ten and is non-identifying, because no
      published seed is within v of 2^160. Random 160-bit strings: no
      regenerating state. The n < p object is not void: prime239v2 has n > p,
      and the n < p rule rejects it.
    - >-
      Re-census: 11,042 of 11,042 rows compared, 0 mismatches. 10,576 rows are
      identical in both columns. In 466 rows the recorded Nt is a nonzero
      composite where the Validator's independent twist count aborted. In every
      one of the 466, the recorded value equals 2(p+1) - N0, with smallest prime
      factor at most 199 (by run: p239 38, p192 99, p521 27, p256 56, p384 25,
      p224 221). The producer's Nt is filled from N0 whenever N0 was counted.
      This is not a disagreement (VAL J3-2).
    - >-
      Full counts without early abort on 289 rows (85 named plus a 204-row
      nonce sample; nonce
      702c36f2b6afb1a50f1b561a7e6583df966d4a3e02dc4b0d90618421f8176f92 from the
      freeze commit): 0 mismatches. Every recorded N0 = 0 row (230) and Nt = 0
      row (186) has a composite order with smallest prime factor at most 137
      or 127 respectively. None exceeds the 1,000 concern threshold.
    - >-
      Twist bookkeeping, checked by this Coordinator against
      out/j4_lost_criteria.json: the twist-only-prime rows in the p = 3 (mod 4)
      runs number 9 + 14 + 0 + 4 + 4 = 31. Of these, the twist order has more
      bits than p in p192 rows 774, 1477, 3506 and 4492 and in p384 row 1432,
      so 9 + 10 + 0 + 4 + 3 = 26 would pass the stated criteria if -b had been
      tried. P-224's 16 twist-only rows are not reachable by -b (p = 1 mod 4;
      -1 is a square; VAL J4-2), and no record counts them as lost (VAL J4-4).
    - >-
      Unexpected observation, kept: in the P-192 walk-back window a
      non-aligned srand48-form state falls in 1998 (t = 905479852,
      d = 133833, d mod 20 = 13). So the date alone does not identify t. The
      inference rests on regeneration plus block alignment plus the date
      (VAL C2-1).
    - >-
      Infrastructure events: PARI stack overflows (J3 attempt 1, re-census
      shard 1 attempt 1), and a GP input line reset (J3 attempt 2). All of
      them were recomputed, with no data lost. These are infrastructure signal
      and say nothing about the claims.
  inference: >-
    The bundle's generator claim (C1a), its timestamp attribution (C2), its
    census measurements (C3 as scoped) and its root-choice observation (C4)
    survive an independent implementation that did not read the producer's
    code, and they reach the strengths in strength_by_claim. This is verified
    provenance of the historical seeds. It is not cryptanalysis.
  boundaries:
    - >-
      Scope: the ten X9.62 / FIPS 186-2 prime-curve seeds and the six recovered
      srand48 runs up to each run's last published seed; the four binary
      seeds B-233/283/409/571; the published parameters as retrieved by the
      Validator (OpenSSL 3.0.13, FIPS 186-2, SP 800-186). prime192v2/v3 and
      prime239v1-v3 rest on OpenSSL only, because ANSI X9.62 itself was not
      retrieved.
    - >-
      Out of scope and not supported here: the base points (FreeLIP or
      otherwise), the B-163 seed, the security-consequences table, the
      about-30-bit freedom figure (Valsorda), the skip rule (why 11 accepted
      candidates were skipped), and every ECDLP, attack-cost, twist-security or
      SafeCurves statement.
    - >-
      Rates read from the census are stopped-sample counts: each run ends at
      its last published seed.
    - >-
      "Lost" in the corrected C3 sentence (CORR-20261016-10d498) means only that
      the -b curve would have passed the stated classifier criteria. Whether
      the 1997 procedure would have published any of the 26 is unknown, because
      the skip rule is unexplained.
  unresolved_confounds:
    - >-
      PARI/GP SEA is common to producer and Validator. A composite (0) row
      that is truly prime would require SEA to abort wrongly in both runs. Only
      the N*P = O certificates are SEA-independent, and they cover every prime
      order the classification uses, not the 0 rows.
    - >-
      Single reviewer, no red-team pass. Independence was from the producer,
      not across reviewers (DEC-20261016-7bcdd6, limitations).
    - >-
      Constraint 4 ordering is attested in logs/order.log, not mechanically
      enforced. The J5 classification of the recorded orders was logged at
      22:47:42Z, before summary.json was opened at 23:39:32Z. The full counts
      and re-census were logged at 23:39Z, after the orders files (data under
      test, readable from the start) were opened at 22:46:47Z, as the plan
      allows.
    - >-
      The harness injected /home/user/crypto/CLAUDE.md, a path under
      blind_from, into the Validator's context. It is generic workflow policy,
      with nothing about drand48, X9.62, the census or the seeds. Ruled
      immaterial in DEC-20261016-82753f (ruling independence_deviation).
  obstruction: null
  reviewed_by: coordinator
