  strength_by_claim:
    C1a:
      strength: replicated
      claim: >-
        The ten X9.62 / FIPS 186-2 prime-curve seeds (P-192, P-224, P-256,
        P-384, P-521, prime192v2/v3, prime239v1-v3) are each one 20-byte block
        of (int)(drand48()*256) output after srand48(t), the first generated
        byte being the first seed byte, at 1-based block indices 139, 5228 and
        6013 (t = 863966734: P-192, prime192v3, prime192v2); 2185, 2320 and
        3048 (t = 863711343: prime239v1, v2, v3); 1136 (t = 871002724: P-521);
        1842 (t = 871696354: P-256); 2688 (t = 872952608: P-384); 7026
        (t = 891607927: P-224). Every t is a UNIX time between 1997-05-15 and
        1998-04-03 UTC. The X9.62 seed-to-c map (FIPS 186-2 App. 6.4/6.5,
        SP 800-186 C.3.1/C.3.2) gives c*b^2 + 27 = 0 (mod p) with the published
        b for all ten. The B-233, B-283, B-409 and B-571 seeds are five
        consecutive lrand48() words (forward word order, big-endian words)
        after srand48(s), with 2s on 1998-04-17 between 15:24:18 and 15:32:08
        UTC.
      basis: >-
        VAL J1-1..J1-4, Q2-1, J2-1, and controls PTM-1, PTM-2 and PTM-3, all
        pass, from an independent implementation built from POSIX, FIPS 186-2
        and SP 800-186 text. Pre-committed reading (1) of DEC-20261016-7bcdd6
        gives replicated. That reading defines no strong path for C1, so none
        is taken after the fact.
    C1b:
      strength: preliminary
      claim: >-
        The README's statements about what the native Rust tests in
        aburan28/crypto check, and that census.sh re-ran the P-256 run byte for
        byte.
      basis: >-
        Not checked in this round. /home/user/crypto/ was in blind_from, and
        VAL J6-4 is not_run by plan design. Pre-committed reading (4) caps the
        affected claim at preliminary. The cap applies to this sub-claim only,
        because the substance the tests describe was re-derived independently
        (C1a). See DEC-20261016-82753f ruling c1_not_run_cap.
    C2:
      strength: strong
      claim: >-
        Lattice state recovery from each prime seed alone gives a 48-bit
        drand48 state that regenerates all 160 bits, for all ten seeds. Walking
        back 8,000 blocks (160,000 steps) from it reaches 2 or 3
        srand48-form states (low 16 bits 0x330E), exactly one of them
        block-aligned, and that one is the claimed t at the claimed block, for
        all ten. The two triples share t = 863966734 and t = 863711343.
        2^48/2^160 = 2^-112; 63,072,000/2^32 = 0.014685; 0.014685^6 = 1.00e-11.
        "At most one block-aligned srand48-form state within 8,000 blocks"
        holds deterministically: aligned states are at least lcm(65536, 20) =
        327,680 steps (16,384 blocks) apart.
      basis: >-
        VAL C2-1 and C2-2 pass. Control PTM-4 passes: 10 nonce-derived random
        160-bit strings give no regenerating state and no 1997-98 aligned
        state, and 10 synthetic positive controls are recovered. Pre-committed
        reading (2) requires state recovery and walk-back for all ten seeds,
        and they were done. The README says this attribution was established
        outside the repository. It has now been re-derived inside it.
    C3:
      strength: strong
      claim: >-
        In the six runs, up to each run's last published seed: 21,753 blocks;
        11,042 with -27/c a nonzero square (1,555 / 3,061 / 584 / 960 / 1,337 /
        3,545); the recorded orders files' N0 and Nt values are correct, with 0
        meaning a composite order; classifier criteria (prime n, bitlen(n) <=
        bitlen(p), n != p, p^k != 1 mod n for k < 2^10) give 21 accepted
        (8/5/1/2/1/4), 17 bitlen rejects (0/7/0/0/2/8), 47 twist-only-prime
        (9/14/0/4/4/16); the published seeds are a subset of the accepted
        candidates, 10 published and 11 skipped; the accepted list matches the
        posts 21 of 21; the bitlen rule cannot fire at p239 or p256; 31
        twist-only-prime candidates lie in the five p = 3 (mod 4) runs (p521
        contributing 0).
      excluded: >-
        The README sentence "In the four p = 3 mod 4 runs, 31 seeds were lost
        this way." It miscounts the runs (five, of which four have twist-only
        rows) and overstates the loss: 5 of the 31 twists have more bits than
        p and fail the bitlen rule, so at most 26 would have passed the stated
        criteria. Corrected by CORR-20261016-10d498.
      basis: >-
        VAL J2-2, J3-1, J3-2, J4-1, J4-2, J4-4, J5-1..J5-4 and PTM-5 pass;
        J4-3 is a concern, and the excluded sentence is its subject.
        Pre-committed reading (2) requires the independent early-abort
        re-census of all 11,042 rows agreeing row by row, and that was done
        with 0 mismatches. The full counts and the SEA-free N*P = O
        certificates on 289 rows found no error.
    C4:
      strength: replicated
      claim: >-
        On each of the nine published p = 3 (mod 4) curves, b is the (p+1)/4
        root, and -b is the root in none (2^-9 by chance). P-224's b is p - R,
        where R is the Tonelli-Shanks root computed with the smallest
        non-residue z = 11. The sign depends on z: z = 22 and 31 give +R.
      basis: >-
        VAL C4-1 and C4-2 pass. Pre-committed reading (1) gives replicated, and
        it defines no strong path for C4.
    C5:
      strength: none
      claim: >-
        The skip-filter screen, the RNG-consumption models and the generator
        scan (README "External analyses").
      basis: >-
        External analysis, so only labelling and provenance were reviewed
        (pre-committed reading (5)). J7 is inconclusive. The labelling holds.
        No immutable record dates PREREGISTRATION.md before the census data: it
        was first committed together with that data, in aburan28/crypto
        bc6b8f29 and here in 64a46b4c. The README's "frozen before any curve
        order was seen" is broader than the file itself supports. See
        DEC-20261016-82753f ruling j7.
  claim_tier: crypto
  claim_tier_note: >-
    The tested objects are the standardized curves themselves at full size
    (p192-p521), so the tier is crypto by parameter size. It licenses only
    scoped statements about those exact curves and seeds. Nothing in this record
    is an ECDLP, attack-cost or curve-safety statement.
  certificate_refs:
    - research/nist_seed_provenance_20261016/validation-20261016/out/q1_seeds.json
    - research/nist_seed_provenance_20261016/validation-20261016/out/q2_binary.json
    - research/nist_seed_provenance_20261016/validation-20261016/out/q3_x962.json
