  comparison:
    - >-
      Frozen success criterion: met on both seeds. Frozen falsification
      criterion: not met.
    - >-
      Against the toy runs (EXP-CZLIFT-17b7eb: all 29 CM anomalous curves with
      7 <= p <= 1500; EXP-CZLIFT-ae0a13: 50 <= p <= 600), the same exact
      outcomes recur on new curves with p up to 97813.
    - >-
      Upper bounds on per-row success, one-sided 95% Clopper-Pearson with 0
      successes (red team R2-e; the unit check is O6):
      - anomalous degenerate, per seed: 1.73e-3 (n = 1728), 51x and 54x the
        mean 1/p;
      - anomalous degenerate, both seeds: 8.66e-4 (n = 3456), 26x the mean 1/p;
      - torsion, per section per seed: 1.03e-2 (n = 288), 352x to 395x;
      - torsion, per section over both seeds: 5.19e-3 (n = 576), 187x.
      The red team's all-sections common-rate bound (1.73e-3, n = 1728) assumes
      independent rows across sections, which the torsion driver does not
      provide (O6), so it is not used.
    - >-
      Against p^-1/2, taken over the tested primes: [3.35e-3, 9.24e-3] on the
      anomalous arm and [3.20e-3, 1.00e-2] on the torsion arm. The anomalous
      bound is below the whole band per seed and pooled. The torsion
      per-section bound is above the band per seed and inside it pooled.
    - >-
      Operating characteristic of the frozen 1/p clause (red team R2-d, exact
      Poisson-binomial over the recorded p_i): it passes on both seeds with
      probability 1.000 at rate 0, 0.900 at 1/p, 0.312 at 10/p and 0.084 at
      20/p. P(all zero | 1/p) = 0.850, so the likelihood ratio of 1/p to 0 is
      0.85. One success in the seed-20261010 anomalous cell gives z = 4.0001.
      Caveat: the torsion part of that model treats the three sections as
      independent, which O6 shows they are not.

