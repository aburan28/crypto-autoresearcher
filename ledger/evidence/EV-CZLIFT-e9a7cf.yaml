  inference: >-
    At toy tier, with p up to 10^5, the exact clauses of H-CZLIFT-889c9d and
    H-CZLIFT-6d4ed1 hold with no exception on new curves, on two seeds. On the
    anomalous arm (41 distinct CM anomalous curves) these are the j-distance
    degeneracy rule and Smart's recovery on the non-canonical pert_p lift, with
    independent-code corroboration. On the torsion arm (48 distinct odd-order
    curves) these are the five torsion-section rates, the tau-ratio identity
    and the cost bound, with same-code evidence only. The identities follow
    from the derivations named in proof_status_basis, and the mechanism does not
    depend on p. The run therefore extends instance coverage and does not open
    a new regime. The 1/p clauses are inconclusive. Non-canonical success
    rates are bounded below 8.7e-4 per row on the anomalous arm and below
    5.2e-3 per row per torsion section (95%). That is consistent with 1/p and
    equally with 0. The anomalous bound excludes a p^-1/2 rate at every tested
    p; the torsion bound alone does not.

  scoped_claim: >-
    At toy tier, the largest field being F_p with p = 97813 < 2^17. The data are
    two clean runs (RUN-CZLIFT-032a92 and RUN-CZLIFT-6447f0) of the unmodified
    lane-1 drivers over a new sampler with 10^4 <= p <= 10^5.
    Anomalous arm: 41 distinct class-number-one CM anomalous curves (D in {-3,
    -11, -19, -43, -67, -163}) at precision p^8. The j-distance degeneracy rule
