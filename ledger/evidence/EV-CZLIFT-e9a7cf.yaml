    equalled d on all 1152 pert_p rows, and every canonical, isomorphic and
    pert_p2 row degenerated.
    Torsion arm: 48 distinct odd-order curves (n in [109, 93001]) at precision
    p^4. The five torsion-section rates and the tau-ratio identity held on all
    576 pairs (same-code evidence).
    Non-canonical recoveries succeeded 0 times in 3456 anomalous-degenerate rows
    and 0 times in 576 rows per torsion section. The 95% one-sided bounds are
    8.7e-4 and 5.2e-3 per row; these do not test the 1/p rate. No claim is made
    about 33 to 96-bit fields, a deployed curve, or any attack cost.

  boundaries:
    - >-
      Anomalous arm: class-number-one CM anomalous curves, D in {-3, -11, -19,
      -43, -67, -163}, p in [11719, 89269], integral CM models. Four lift classes
      (canonical, isomorphic, pert_p, pert_p2), three point sections
      (hensel_random, naive, teichmuller), 8 samples, precision 8.
    - >-
      Torsion arm: CM curves (observed D in {-3, -11, -19, -43, -67, -163}) on
      the canonical model, and random curves on naive integer lifts. p in
      [10007, 97813], odd order, n the largest prime factor of N, n in [109,
      93001], 12 samples, precision 4.
    - Two seeds (20261009, 20261010). Advisory budget 3600 s per run; used 10.85 s and 11.21 s.
    - >-
      Not covered: non-CM anomalous curves; D = -7 or -8 in the torsion arm;
      non-canonical lifts of CM curves in the torsion arm; even-order curves;
      n < 101; p above 10^5; any field above 17 bits; any deployed curve.

  unresolved_confounds:
    - >-
      Torsion-section identities and rates rest on the producer's code only; no
      independent implementation of the torsion section was run.
    - >-
      The arm contrast confounds lift type (canonical against naive) with curve
