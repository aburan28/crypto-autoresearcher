    - >-
      Uniform d reaches a structured small-d stratum (the EXP-CZLIFT-bdae69
      mechanism) in about 1.5e-4 of rows.
  confound_assessment: []
  confound_assessment_note: >-
    The specification declares no variable_ledger. The one confounded
    comparison (the torsion arms) supports no reading in this record. See
    unresolved_confounds.

  obstruction:
    statement: >-
      On the tested CM anomalous curves the canonical curve lift (and any lift
      with v_p(j - j_CM) >= 2e) splits E^[p], so Smart's precision-p^2 residue
      is 0/0 for every point lift. On the tested non-anomalous curves the
      canonical point section (prime-to-p torsion) gives a vanishing Smart
      functional, and every other section's Smart ratio equals its tau-ratio.
      Exact-hit recovery of d through either route was never observed.
    quantity: >-
      Rule disagreement rate per curve x lift-class cell; torsion identity
      failure rate per pair; non-canonical exact-hit success rate per row.
    value: >-
      Rule disagreements: 0/164 cells, 95% upper bound 1.81% per cell.
      Torsion-identity failures: 0/576 pairs, 95% upper bound 0.52% per pair.
      Anomalous-degenerate next-digit successes: 0/3456 rows, 95% upper bound
      8.66e-4 per row (26x the mean 1/p).
      Torsion section successes: 0/576 rows per section, 95% upper bound
      5.19e-3 per row (187x the mean 1/p).
      All bounds are one-sided Clopper-Pearson with 0 events. Units are
      probability per (curve lift, section, (P, d)) row.
    measured_by: [RUN-CZLIFT-032a92, RUN-CZLIFT-6447f0, EXP-CZLIFT-f5e06c]
    scope: >-
      The boundaries above, at toy tier: p in [10007, 97813], precision 8
      (anomalous) and 4 (torsion), two seeds. The vanishing results are theorems
      that the instrument checks here. The exact-hit bounds say nothing about
      partial leakage or about sub-row structure in d.
    resource_check:
      examined: true
      reading: >-
        The instrument counts exact hits only. The obstruction is therefore
        silent on tau-ratios that are biased toward d or carry some bits of d,
        and that kind of input is exactly the hypothesis of a hidden-number or
        lattice attack. "No section beats 1/p" does not imply "no section
        leaks". If leakage existed, it would be a resource, and the successor
        recommended in DEC-20261023-9de83a measures it: record r and d per row
        and test the residue distribution (red team C1). The torsion section is
        itself a canonical, homomorphic lift of E(F_p)[n] into E(Q_p)[n] at about
        107 additions. Every p-adic analytic invariant vanishes on it, and the
        only non-vanishing structure on the lifted points is l-adic for l | n,
        which is the original problem. No exploitable reading was found there.
      spawned_ids: []

  sota_delta:
    time_exponent: unchanged
    note: >-
      No attack or cost claim. Smart's classical anomalous attack is reproduced
      as a control. No ECDLP row moves.

