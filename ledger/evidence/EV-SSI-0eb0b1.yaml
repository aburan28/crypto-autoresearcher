    - coordination/goals/GOAL-SSI-001/batches/BATCH-017/tasks/TASK-20260802-003/red_team_report.yaml
  observations:
    - >-
      Five SSI mechanism candidates screened across three lanes (orientation/known-End,
      CSIDH quantum, SQIsign transcript leakage). None predict an exponent improvement
      over the matched baselines (VW p^{1/2}, conditional p^{1/4}).
    - >-
      SSI-S1 (transcript leakage test) selected as cheapest decisive gate. Red-team
      found it underspecified: no named statistic, no simulator construction, no
      parameter set, no effect-size threshold.
    - >-
      Red-team verdict PASS_WITH_OBJECTIONS. Four binding controls required before
      experiment dispatch: RT-CTRL-001 (preregister exact statistic, simulator,
      parameter set, effect-size threshold for SSI-S1), RT-CTRL-002 (correct O2/Q2
      dominated_by to position against Wesolowski 2026 / Kuperberg 2011),
      RT-CTRL-003 (resolve O1/O2 uncharged endomorphism preprocessing — identify a
      concrete curve set with known End(E) not obtained by solving the target problem),
      RT-CTRL-004 (torsion-image exclusion scope confirmation).
    - >-
      Torsion-image exclusion is sound (PASS). All candidates correctly exclude
      broken SIDH/SIKE setting.
    - >-
      No candidate identifies a genuinely new structural ingredient (target-result-profile
      requirement A4: hunt for external theorems/bounds/correspondences that convert a
      bottleneck step into a tractable one).
    - >-
      Pareto ranking is locally correct within the five candidates but globally dishonest:
      O2 and Q2 do not position against Wesolowski 2026 p^{1/3+o(1)} or Kuperberg 2011
      quantum subexponential isogeny evaluation.
  inference: >-
    Ideation screen is an honest, properly bounded starting point. No mechanism is ready
    for implementation or computation. The red-team's binding controls (RT-CTRL-001..004)
    are necessary and sufficient conditions for advancing SSI-S1 to experiment design.
    All candidates remain unverified ideation with no exponent improvement predicted.
  boundaries:
    - No curve computation was performed.
    - No implementation exists for any candidate.
    - No security claim, break, or asymptotic improvement is asserted.
    - This is a screening/review record, not experimental evidence.
    - Toy-curve evidence does not exist; no scale claim applies.
  unresolved_confounds:
    - >-
      SSI-S1 needs a named statistic, simulator construction method, toy SQIsign
      parameter set, and effect-size threshold before it can be experimentally tested.
    - >-
      O1/O2 (orientation lane) have uncharged endomorphism preprocessing: the curve
      set with known End(E) must not be obtained by solving the target problem.
    - >-
      Q1/Q2 (quantum lane) testability is unclear without access to a quantum simulator
      or a classical surrogate that preserves the relevant structure.
  reviewed_by: coordinator
