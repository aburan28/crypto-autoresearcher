  scope_statement: >-
    THIS RECORD ASSERTS NO MEASUREMENT AND NO EXPERIMENT REPAIR. It reviews
    whether IDEA-20260803-fa9839's successor lineage belongs under
    GOAL-ECDLP-001, per revisit condition R-D of DEC-20260805-bb162b. No
