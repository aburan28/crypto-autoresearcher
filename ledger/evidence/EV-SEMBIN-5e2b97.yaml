  derivation_note:
    author: coordinator (review DEC-20261016-8d3f61), hand derivation from run.py
    notation: >-
      x_k = a_k0 + a_k1 z + a_k2 z^2, bits a in R = F_2[a] (no field equations),
      F_8 = F_2[z]/(z^3+z+1); Q = x1x2 + x1x3 + x2x3 = q0 + q1 z + q2 z^2;
      C = x1x2x3; S = Q^2 + C + 1 with coordinates f_0, f_1, f_2 in R.
    steps:
      - id: D1
        text: >-
          Driver gate. products() (run.py line 199) admits (generator g,
          multiplier m) at degree d only if deg(m) + deg_unreduced(g) <= d, in
          BOTH modes: generator_degree is read before bool_reduce. DEGREE_CAP = 4.
      - id: D2
        text: >-
          field_mul(Q, Q) gives parts [q0^2, 0, q1^2, 0, q2^2] (cross terms
          cancel in characteristic 2); with z^3 = 1+z, z^4 = z+z^2 the
          coordinates are (q0^2, q2^2, q1^2 + q2^2). C has degree <= 3. So
          top4(f) = M (t0^2, t1^2, t2^2), t_i the degree-2 part of q_i,
          M = [[1,0,0],[0,0,1],[0,1,1]], det M = 1 over F_2; deg f_i = 4.
      - id: D3
        text: >-
          t0, t1, t2 are F_2-independent: a relation sum c_i t_i = 0 with c != 0
          gives a nonzero F_2-linear functional l with l(Q(x)) = 0 on all of
          F_8^3; at x3 = 0, Q = x1 x2 takes every value of F_8, so l = 0,
          contradiction. Frobenius is injective and additive on R, so the
          top4(f_i) are independent: every nonzero F_2-combination of f_0, f_1, f_2
          has degree exactly 4.
      - id: D4
        text: >-
          Shift invariance. Q(x1+1, x2, x3) = Q + x2 + x3 and C(x1+1, .) =
          C + x2 x3 add only terms of degree <= 2, so t_i and D2-D3 are unchanged
          on the shifted side.
      - id: D5
        text: >-
          Consequences on both sides. Unreduced: no rows for d < 4; at d = 4 the
          rows are f_0, f_1, f_2 and no combination has degree < 4 (D3), so
          def5_true = BOUND+1 = 5. Macaulay: at d = 4 rank 3 = row count, so the
          label is absent. Boolean: no rows for d < 4 (D1 uses unreduced degree
          4); at d = 4 the rows bool_reduce(f_i) have degree <= 3 and f_0 has
          constant term 1, so low >= 1 > previous = 0 and def6_fake = 4. The
          715-column matrix never holds more than 3 rows.
      - id: D6
        text: >-
          Therefore matrix_holds == planted_ok identically for this driver, on
          the shifted and on the unshifted polynomial alike. The preregistered
          outcome was fixed by cap = generator degree before execution; the shift
          contributes nothing.

