  inference: >-
    The contract cannot discriminate the heuristic it was written to test. Under
    the frozen driver every label is a property of the three generators alone and
    is shift-invariant (D1-D6), so "the coset shift separates Def.6 from Def.5 or
    from the Macaulay label" and "the separation is a construction artifact
    present without the shift" predict the same values. H-SEMBIN-ce9e29's literal
    statement holds at stage-0 scope by derivation, but holds vacuously with
    respect to the shift. It bears neither way on IDEA-20261006-8f4f02's formal
    proposition (Def.6 preservation implies Def.5 preservation under shift):
    Def.5 <= 4 already fails on the unshifted side, so neither a preservation nor
    a counterexample is observed.

