    - id: O-F2
      text: >-
        F2 accepted direct/transported exceptional automorphisms are correctly
        typed and non-scalar, but no general public exceptional-path constructor
        or required mass/cost/support result exists. J3, J4, and J5 break.
    - id: O-F3
      text: >-
        F3 accepted odd closed words give nonsquare-degree non-scalar self-maps,
        but cycle-mass and public-line-enumeration cost theorems are missing and
        the returned support is a public singleton. J3 is inconclusive while J4
        and J5 break.
    - id: O-F4
      text: >-
        F4 has an exact raw-bit law and accepted maps are globally verified, but
        descriptor density and support-enumeration conclusions remain open.
        J3 and J5 are inconclusive and J4 breaks.
    - id: O-hard-problem
      text: >-
        A valid accepted descriptor is a bounded OneEnd answer on that same
        curve. High-mass success under the single D_ER endpoint law does not
        instantiate the always-answer oracle on Page--Wesolowski Algorithm 3's
        adaptive internal query curves, so no EndRing solver follows.
    - id: O-correction
      text: >-
        The user authorized a correction round, but the frozen admission gate
        was not met: every family needs multiple independent construction,
        mass/cost/support, or adaptive-coverage repairs. The reserved correction
        task was not queued.
    - id: O-documentation
