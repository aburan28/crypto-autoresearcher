        loss. O5/O6, novelty, QPT/QROM security, and Category 5 are correctly
        left open. Its word "holds" validates those honest dispositions only,
        not a security claim.
    - id: O-CCA
      text: >-
        The exact raw XOR syntax is IND-CCA2-insecure. From challenge (C,v),
        one byte-distinct query (C,v XOR Delta) returns m_b XOR Delta, so the
        selected message and challenge bit are recovered with advantage 1/2
        using one decryption query and no random-oracle query.
    - id: O-composition
      text: >-
        The frozen joint vector is J1 REJECT, J2 FAIL, and J3 narrow holds for
        correctly open dispositions. The normalized O1--O6 conjunction fails;
        one proposal was evaluated and zero candidates survived for
