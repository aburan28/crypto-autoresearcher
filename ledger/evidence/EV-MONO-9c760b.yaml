  proof_status: derivation
  proof_status_note: >-
    The Red Team derived NEW exact closed forms (transversal and
    group-uniform expected collision rates as functions of (N, tau,
    #E(F_p)[4]) alone) and validated them against brute-force enumeration
    to <1e-14 on 20 curves and against 145 archived curve-measurements
    (mean z=-0.010, sd=0.915). This Coordinator independently re-verified
    the single most load-bearing specific consequence (cell 1's group
    structure and #E[4] are forced identical for both curves, via
    elementary number theory on 580's factorization) but has NOT
    independently rederived the full closed forms themselves. Per the
    reviewer's own explicit request and stated falsification route
    (RC-B10), an independent rederivation by a fresh party remains the
    named next action before this is cited as a settled DETERMINISTIC-tier
    result.
  proof_refs:
    - experiments/EXP-MONO-005b49/reviews/red-team-breakthrough/red-team-report.yaml (exact closed forms, RC-B1 through RC-B10)
    - experiments/EXP-MONO-005b49/reviews/validator-breakthrough/validation-report.yaml (JB1 sequential-inference simulation, JB2 third independent rederivation, FB4 100-cell panel reanalysis)

  observations:
    - >-
      THE POOLED 2-CELL HEADLINE (z=2.3139, p=0.020673) IS REFUTED BY TWO
      FULLY INDEPENDENT, DISJOINT ARGUMENTS. See CORR-20260904-80506e for
      the full disclosure. In summary: (1) exact computation shows cell 1
      is mathematically forced to have zero true effect (N=580, tau=4
      forces a unique group structure and hence identical #E[4]=4 for
      both curves -- independently reverified by this Coordinator), and
      cell 1 carries 87% of the pooled weight; cell 2's true effect is
      real but 0.042% and points opposite the measured direction; 63.3%
      of the pooled signal traces to one reused, never-re-measured count.
      (2) independently, formal simulation of the actual six-look decision
      procedure under a true null gives a true false-positive rate of
      ~10.3% (not 5%), driven by omitted overdispersion in the delta-
      method variance and a post-hoc choice between two named combination
      rules.
    - >-
      THE GENUINE POSITIVE RESULT: H-MONO-45183a Part B's (N,tau)-only
      completeness is FALSE, but the completion is SMALL, EXACT, and NOT
      an endomorphism-ring effect. The exact completion is (N, tau,
      #E(F_p)[4]): Part B's closed form 6(tau-1)/N is the leading term of
      an exact expression with an O(1/N) correction depending on #E[4].
      Mean bias across 145 archived curve-measurements: +0.60% (range
      +0.07% to +5.08%), always in the direction of Part B under-
      predicting the true rate. The endomorphism ring enters this
      observable ONLY through #E[4] -- two curves sharing (N, tau, #E[4])
      have EXACTLY equal rates regardless of endomorphism ring, per the
      exact closed form.
    - >-
      THE CM-VARIANT CONFOUND IS NOW QUANTITATIVELY BOUNDED (previously
      only qualitatively flagged): matched same-prime curves are
      isogenous and share a CM field (determined by the trace: cell 1's
      t^2-4p = 16^2*(-4) forces K=Q(i) hence j=1728; cell 2's
      t^2-4p = 60^2*(-3) forces K=Q(sqrt(-3)) hence j=0). They differ only
      in conductor ("crater" vs. lower-conductor curve on the same isogeny
      volcano), not in "CM vs non-CM" -- every ordinary curve has CM by
      some order. Across 84 archived matched cells, exact rates differ in
      exactly 5, always because the crater (j in {0,1728}) curve has MORE
      4-torsion (#E[4]=16 vs 8), and its rate is ALWAYS LOWER by
      0.098%-0.455% -- bounded, small, and in the OPPOSITE direction from
      the pooled headline's claimed effect.
    - >-
      A LARGER, ALREADY-ARCHIVED, ~40X BETTER-POWERED DATASET CORROBORATES
      A SMALL REAL EFFECT WHILE EXCLUDING THE CLAIMED MAGNITUDE: the
      Validator's own independent analysis of RUN-MONO-cb905d-1's Part B
      panel (100 further matched cells, previously filed as "exploratory
      context only") gives an exact conditional-binomial CM/ordinary
      transversal rate ratio of 1.01798, 95% CI [1.00016, 1.03612], over
      49,491 colliding pairs. This CORROBORATES the direction of a real,
      small CM-linked effect (consistent with the #E[4] explanation above)
      while EXCLUDING the pooled headline's claimed 1.156 by a factor of
      ~8. THIS FINDING IS PROVISIONAL pending the partition required by
      CORR-20260904-30a8ce (64/100 panel cells have a supersingular curve
      misclassified as CM) -- the clean re-analysis, excluding
      contaminated cells, is a named next action, not yet performed.
    - >-
      BOTH BREAKTHROUGH REVIEWERS EXPLICITLY RECOMMEND AGAINST A THIRD
      CELL. A 20,000-tuple cell's own standard error (~8x the largest true
      effect anywhere in the 145-measurement archive) cannot resolve a
      question the exact closed form already answers deterministically in
      about one CPU-second per curve.
    - >-
      TERMINOLOGY CORRECTION FLAGGED FOR FUTURE RECORDS (not urgent enough
      for its own correction, since it changes no conclusion): "CM vs
      ordinary" mislabels this comparison throughout the chain. The
      correct description is "crater (maximal-order, extra-automorphism)
      curve versus a lower-conductor curve in the same isogeny class,"
      since both members have complex multiplication and the "CM" member
      is forced by construction to be one of exactly the two curves with
      extra automorphisms (j=0, Aut order 6; j=1728, Aut order 4).
    - >-
      KN-OPEN-009 IS STRUCTURALLY UNTOUCHED BY THIS ENTIRE LINE OF WORK,
      FOR THREE INDEPENDENT REASONS: (i) that record's own text requires
      excluding j=0/1728 extra-automorphism artifacts from any exceptional-
      curve claim, while this design's entire CM arm IS j in {0,1728};
      (ii) KN-OPEN-009 concerns the Semaev summation-cover monodromy/cycle-
      type observable, which H-MONO-45183a Part A already reports constant
      -- a different observable than root-multiplicity collision counting;
      (iii) it concerns relation rates for index calculus, and this
      observable is not a Semaev relation rate.
    - >-
      SCALE: even if the pooled result had held, it would establish
      nothing at cryptographic scale. The measured quantity is ~6(tau-1)/N
      ~ 2^-251 at a 256-bit N; observing one collision would need ~2^251
      tuples, and distinguishing the true O(1/N) structural term (which
      scales as N^3 in required samples) would need ~2^732 tuples.

  disposition: >-
    H-MONO-1d50ac's own pre-registered, two-sided question -- does a
    matched CM and ordinary curve's transversal-vs-group-uniform sampling
    ratio differ beyond (N,tau) -- is answered NO for the specific m=4
    construction and the two cells tested: the apparent difference is a
    sampling artifact, exactly explained and exactly bounded by missing
    #E(F_p)[4]-dependence (<=0.46% relative, opposite-signed from the
    measured "signal"). The genuinely valuable outcome of this cycle is
    the (N, tau, #E[4]) completion to H-MONO-45183a Part B's closed form
    -- a real, small, deterministic-tier finding, pending independent
    rederivation, worth its own knowledge-promotion path. See
    DEC-20260904-d79f75 for the full disposition and named next actions.
