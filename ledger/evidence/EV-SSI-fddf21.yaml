  inference: >-
    The next useful uncertainty is whether the exact bare-E EndRing distribution
    admits a polynomial public noncentral endomorphism sampler that does not
    collapse to an efficiently enumerable proper witness family. This is
    separate from complete-ring reconstruction and does not authorize a PKE wrapper.
  boundaries:
