    - id: O-revision
      text: >-
        RCF-Bind's sampler repair would leave four other joint obligations open.
        Replacing BDEB's scalar support changes its load-bearing sampler,
        inverse, reduction, and view. No gap-fed candidate was manufactured.
    - id: O-documentation
      text: >-
        Independent documentation review found two terminology/rendering
