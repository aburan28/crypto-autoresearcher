    - No primary paper was newly read; prior-art comparison remains pointer-level and incomplete.
    - The diagram and PDF are presentation artifacts, not mathematical evidence.
    - Candidate-specific breaks remain scoped to the exact frozen interfaces and distributions.
  unresolved_confounds:
    - Exact bare-E public noncentral sampling distribution, runtime, output grammar, retries, and success probability.
    - Uniform inverse and actual-message recovery for every complete evaluable basis and accepted representative.
    - Non-factorization through one endomorphism, scalar family, finite action, table, or proper suborder.
    - Quantitative attacker-to-complete-ring extraction with rank, index, saturation, evaluable output, loss, runtime, and abort accounting.
    - Exact parser, malformed-input, state, adaptivity, randomness, and repeated-use semantics.
    - Primary-source normalized comparison with existing supersingular PKE constructions.
