evidence:
  id: EV-MLKEM-001
  hypothesis_id: IDEA-20260722-001
  experiment_ids: []
  run_ids: []
  type: literature
  direction: weakens
  strength: preliminary
  claim_tier: toy
  certificate_refs: []
  proof_status: derivation
  proof_refs:
    - coordination/goals/GOAL-MLKEM-001/batches/BATCH-001/tasks/TASK-20260722-203/technical_review.md
    - coordination/goals/GOAL-MLKEM-001/batches/BATCH-001/tasks/TASK-20260722-204/falsification_review.md
  observations:
    - >-
      No reviewed source demonstrates passive standardized-parameter ML-KEM
      key recovery or a verified asymptotic break.
    - >-
      The producer's 137.1/192.7/257.2 classical-circuit baseline and 2--3 bit
      structure gains reproduce the published Ogilvie table but are stale:
      Hou--Jiang report an author-confirmed estimator bug and corrected
      isometric gains of approximately 0--0.8 bit.
    - >-
      Negacyclic monomial isometries preserve ML-KEM's centered-binomial laws,
      but orbit-target scoring is adjoint to known rotated-vector scoring and
      creates no additional independent samples.
    - >-
      The proposed LaMS composition does not yet define signed p-adic carries,
      partition invariants, vector-pool validity, or a calibrated joint
      correct/wrong score law.
    - >-
      Effective covariance rank and a fourfold local vector reduction do not
      imply a two-bit end-to-end attack reduction.
  inference: >-
    IDEA-20260722-001, as specified, does not justify experiment design or a
    novelty/cost claim. A bounded symbolic derivation can still determine
    whether any non-equivalent amortization survives the rotated-vector
    identity and carry-aware LaMS layer equations.
  boundaries:
    - Literature and derivation review only; no empirical run was performed.
    - No standardized ML-KEM parameter set was attacked or solved.
    - Findings weaken only the specified orbit-plus-LaMS-plus-GLS composition.
    - They do not rule out all covariance-aware, isometry-aware, or p-adic MLWE attacks.
    - Oracle-dependent and implementation-leakage attacks are outside the passive core-MLWE claim.
  unresolved_confounds:
    - Full LaMS formulas and absolute matched costs were not independently recovered in both review sessions.
    - A carry-aware layer action may exist but has not been derived.
    - The corrected model-matched lower envelope requires pinned estimator reproduction.
  reviewed_by: coordinator
