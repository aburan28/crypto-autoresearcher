evidence:
  id: EV-DS-002
  supersedes: EV-DS-001
  supersession_note: >-
    EV-DS-001 remains published and immutable and is NOT overwritten. This
    record supersedes it as the operative evidence record for EXP-DS-001 under
    the BATCH-019 relations=200 repair package at snapshot
    1eb431f11aaeffeb346df257de21917b903d4670 (TASK-20260731-036). EV-DS-001
    continues to describe the BATCH-018 relations=15 package at 33a1f6ae /
    DEC-20260731-023. Claims that apply only to the relations=15 matrix are
    not carried forward; shared deviation/control caveats (RT038-B1–B7 / M1;
    RT-20260731-025 B1–B6 / M1) remain binding.
  related_prior_evidence:
    - EV-DS-001
  authorizing_decision_id: DEC-20260731-018
  hypothesis_id: H-DS-001
  experiment_ids:
    - EXP-DS-001
  run_ids:
    - RUN-DS-001-impl
    - RUN-DS-001-measure
    - RUN-DS-001-heur
  type: empirical
  direction: neutral
  direction_scope: >-
    Neutral on H-DS-001 mechanism support. Package is an admissible toy-tier
    receipt under recorded protocol deviations; S1_eligible_observation is not
    S1_met; HEUR-DS-1 F3_trigger_observation is true at tested bit sizes;
    denser S1-axis labels under relations=200 do not discharge
    CTRL-RT025-UNPLANTED or null-gate theater objections.
  strength: preliminary
  claim_tier: toy
  confirmatory_status: exploratory
  certificate_refs:
    - experiments/EXP-DS-001/runs/RUN-DS-001-impl/raw-result.json
    - experiments/EXP-DS-001/implementation/verify_certificates.py
  proof_status: empirical_only
  proof_refs:
    - experiments/EXP-DS-001/specification.v2.yaml
    - experiments/EXP-DS-001/results/summary.json
    - experiments/EXP-DS-001/results/R_table.json
    - experiments/EXP-DS-001/results/HEUR_DS_1_report.json
    - experiments/EXP-DS-001/results/null_control_report.json
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-019/tasks/TASK-20260731-035/execution_report.yaml
  snapshot_commit: 1eb431f11aaeffeb346df257de21917b903d4670
  validation_report: >-
    coordination/goals/GOAL-ECDLP-001/batches/BATCH-019/reviews/TASK-20260731-037/validation_report.yaml
  validation_report_id: VAL-20260731-002
  red_team_report: >-
    coordination/goals/GOAL-ECDLP-001/batches/BATCH-019/reviews/TASK-20260731-038/red_team_report.yaml
  red_team_report_id: RT-20260731-038
  prior_evidence_and_decision:
    - EV-DS-001
    - DEC-20260731-023
  observations:
    - >-
      O-1: VAL-20260731-002 ADMISSIBLE / PASS_WITH_LIMITATIONS. 3/3 runs
      completed_valid at snapshot 1eb431f1; 54/54 measure cells with
      n_usable_split=200; cost identities R/R_null recompute exactly.
    - >-
      O-2: R-1 F2-over-S1 override does not fire (0 cells with R<0.5 and
      R_null<0.9); 43 cells labeled S1_eligible_on_null_axis by point estimate
      (up from 32 on relations=15). Official S1_met remains false.
    - >-
      O-3: HEUR-DS-1 F3_trigger_observation true — RATE and KS fail at 16/20/24
      with n=1e5 each; scientific payload equal to 33a1f6ae after volatile strip;
      TAIL passes trivially (p_ext=1.0). Not degree-CDF; not HEUR validation.
    - >-
      O-4: CTRL-NULL-PLANT detected on impl (synthetic known-answer theater
      remains); CTRL-RHO/CTRL-BSGS present; impl DL certificate k=27 verified.
    - >-
      O-5: Protocol deviations recorded — charged-units point-sum backend proxy
      (not per-attempt sympy Groebner); planted random m-sums; relations_target=200
      with cell_wall=90s ≪ contractual 7200; smoothness_abort=false on R arm;
      17 naive arms with n_usable_naive<200.
    - >-
      O-6: RT-20260731-038 — blocking-on-decision RT038-B1–B7 + M1; no license
      for crypto-scale, asymptotic, HEUR support, S1_met, mechanism-support, or
      reject_scoped-as-impossibility; CTRL-RT025-UNPLANTED still required; all
      four asymptotic promotion gates remain OPEN.
    - >-
      O-7: assembled_E_proxy never <0.45 on completed cells (min≈0.65).
    - >-
      O-8: H-IC-001 and H-STR-002 untouched.
    - >-
      O-9: Relations=200 vs relations=15: R lower on 51/54 cells; 11 label
      transitions into S1_eligible_on_null_axis — consistent with planted-yield
      amortization optics, not a newly established Semaev structure win
      (RT038-B7 / B4).
    - >-
      O-10: Recommended control cell (20,64,4,seed=101) has point R≈0.034 labeled
      S1-eligible while bootstrap CI [0.256,0.920] includes 0.5 and excludes the
      point — artifact tell, not confirmatory S1 (RT038-M1 / B7).
  inference: >-
    The admissible relations=200 package supports only a deviation-qualified toy
    observation about wall-charged membership search under a point-sum proxy with
    planted targets and denser planted yield. It does not establish S1_met, does
    not validate HEUR-DS-1 at toy (F3), does not discharge CTRL-RT025-UNPLANTED,
    and does not move any asymptotic claim. Official disposition is inconclusive.
  boundaries:
    - Toy tier only: bits in {16,20,24}, B in {64,128,256}, m in {4,5}.
    - Backend is ds001-v2-point-sum-membership+charged-units-v1, not Groebner.
    - Bootstrap CIs are wall-ratio proxies, not charged-R CIs (VAL NBO-1);
      30/43 S1-axis cells have point outside reported CI.
    - Single unreplicated empirical_only set: reject_scoped forbidden.
    - No crypto-scale or asymptotic claim; promotion gates OPEN.
    - Does not describe the relations=15 EV-DS-001 package; does not alter
      H-IC-001 or H-STR-002.
  unresolved_confounds:
    - >-
      UC-1: Planted m-sums make yield observable but do not measure sparse
      random-target relation success (RT038-B7 / CTRL-RT025-UNPLANTED).
    - >-
      UC-2: Null-split / plant / rho-calib control theater unrepaired (RT038-B3).
    - >-
      UC-3: HEUR raw N_j/Z_j streams not archived; HEUR master seed 101 only
      (VAL NBO-2/NBO-3); sampled object is EC x-coord encode_intermediate, not
      Semaev resultant/norm intermediates (RT038-B2).
    - >-
      UC-4: cell_wall=90s and partial naive yield underpower confirmatory reading
      (RT038-M2 advisory).
  r1_adjudication:
    override_fires: false
    package_observation_label: S1_eligible_observation
    official_S1_met: false
    binding: true
  asymptotic_promotion_gates:
    status_all: OPEN
    note: >-
      G1–G4 remain OPEN; no path from this toy contract alone to hypothesis
      status supported on an exponent claim (RT038 coordinator_must_restate).
  binding_constraints_from_red_team:
    - RT038-B1
    - RT038-B2
    - RT038-B3
    - RT038-B4
    - RT038-B5
    - RT038-B6
    - RT038-B7
    - RT038-M1
  reviewed_by: coordinator
