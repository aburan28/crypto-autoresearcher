  claim_tier: toy
  certificate_refs: []   # raw-result.json: certificate.kind=none, claims=[].
                         # This is a rank-existence/nonexistence measurement,
                         # not a claimed solve or relation; the certificate
                         # gate in docs/claims-and-verification.md does not
                         # apply (per EXP-FROB-b8cf21 constraints).
  proof_status: not_applicable   # no adverse transition (weaken/reject_scoped/
                                 # rejected) is being made; the formal
                                 # decision is inconclusive, so
                                 # docs/claims-and-verification.md's
                                 # refutation-artifact requirement is not
                                 # triggered. See "secondary_observation"
                                 # below for the scoped material that WOULD
                                 # be load-bearing if a future run completes
                                 # the panel.
  proof_refs: []
  observations:
    - >-
      FORMAL: the frozen 12-cell panel did not complete. FROB-q7-n3-object02
      is status=ineligible_object, reason=fixed_object_curve_pool_exhausted,
      independently re-confirmed (not merely trusted from report.md) from
      runs/TASK-20260907-ee1e3c/raw.jsonl: all 49 = 7^2 candidate (A,B) pairs
      for q=7,n=3 are logged with kind object_curve_rejected or
      object_curve_selected, and exactly one (A=3,B=4, FROB-q7-n3-object01)
      was selected. Its two null-seed cells are correctly
      not_run_no_eligible_object. specification.yaml's own
      incomplete_selection rule ("Fewer than 2 qualifying object curves at
      either field ... makes the planned 12-cell experiment inconclusive.
      Do not replace parameters, increase pools or substitute curves outside
      the fixed ordering") is a run-level, not per-field, stop rule: both
      success_criterion and falsification_criterion share a whole-panel
      "complete ... cells" gating clause before either's per-field check is
      evaluated, and incomplete_selection names "the planned 12-cell
      experiment" (not a field) as what becomes inconclusive. Full textual
      analysis in experiments/EXP-FROB-b8cf21/analysis.md, section J4.
    - >-
      SECONDARY, CLEARLY SCOPED, NOT LOAD-BEARING FOR THE FORMAL VERDICT: the
      q11,n5 field cell alone completed (2 eligible object curves, 4 matched
      null-seed cells, all status=completed). Every one of object01's 63
      covers and object02's 7 covers (both negation and, for the object arm,
      frobenius_negation presentations) shows Delta_rank=0,
      mixed_accepted_pairs=0 -- confirmed directly from metrics.json (an
      exhaustive grep for any nonzero Delta_rank across the whole 8233-line
      file returns zero hits inside FROB-q11-n5-object01 or
      FROB-q11-n5-object02's object-arm cells). All four matched null-seed
      cells for these two curves show a positive Delta_rank on at least one
      multi-base cover (range 1-5; maximum 5 at object02's null-seed cells'
      triple cover "1,2,3"). This is the literal surface pattern
      falsification_criterion describes, but it cannot trigger that
      criterion alone because the criterion's own gating precondition
      ("after complete ... cells") was never met for the whole run (q7,n3
      incomplete). Independently corroborated as a genuine combinatorial
      fact, not a rank/accept-counting bug, by: (a) this review's
      code-informed replication
      (review-20260921-independent-replication/, positive control at
      q7,n3-object01 finding 12/180 accepted relations, ruling out
      "the independent code always returns zero"); (b) a from-scratch,
      pre-code blind rederivation of the accepted-relation definition from
      specification.yaml's prose alone (not the paraphrase in this review's
      own handoff), which reached the producer's EXACT raw Q3 value
      (152799) on a hand-checked sample pair using field arithmetic derived
      only from the encoding sentence in specification.yaml, before ever
      reading implementation.py; (c) an exhaustive 400/400
      raw.jsonl pair-attempt recount for cover "1,2" on object01 (0
      accepted, matching metrics.json exactly). See
      experiments/EXP-FROB-b8cf21/analysis.md, sections "Post-hoc
      confirmation of J5" and J2, and
      experiments/EXP-FROB-b8cf21/review-attestation-20260921.yaml.
    - >-
      proves_too_much controls both pass with no failure signature:
      PTM-1 (q7,n3-object01 positive control) shows nonzero accepted_pairs
      (12 at cover "1", 180 at cover "1,2,3"), so the method is not blind to
      real gains; PTM-2 (t=1 baseline) shows Delta_rank=0 on every
      single-base cover across the entire run (exhaustively grepped), so the
      rank machinery is not structurally broken in the direction that would
      invalidate every other number.
    - >-
      Null construction invariants (candidate cardinalities, intersection
      sizes, negation closure preserved; Frobenius weights not transported)
      are enforced by runtime assertions in implementation.py's
      null_labels() (lines 454-476), which would have raised and invalidated
      the run had they failed; the run reached completed_valid. This was
      verified from the code's enforcement mechanism and the run's
      non-crash completion, not by an independent by-hand re-derivation of
      every null cell's fixture cardinalities (disclosed limitation).
  inference: >-
    The formal existence prediction in H-FROB-824aa8 ("for at least one
    eligible object curve in each frozen field cell...") cannot be tested to
    a scientific verdict by this run: its own preregistered
    incomplete_selection rule voids a run-level verdict before the per-field
    falsification/success checks are ever reached, because q7,n3 has only one
    eligible object curve against the required two. The q11,n5 field's own
    clean, triply-corroborated null pattern is real and informative as an
    instrument reading, but is explicitly not sufficient alone to carry
    reject_scoped on the universally-quantified hypothesis statement, and
    this record does not attempt to make it do so.
  boundaries:
    - "Field cells tested: GF(7^3) (~8.6 bits), GF(11^5) (~17.3 bits); both toy-scale (<32 bits)."
    - "Curve family: y^2 = x^3 + A*x + B, self-generated ordinary curves; A,B enumerated lexicographically over {0,...,q-1}^2."
    - "Cover arity tested: 1, 2, 3 (all subsets of up to 3 preregistered invariant factor bases)."
    - "One aggregate run (maximum_runs=1); no replication beyond the two fixed label seeds 2026090701/2026090702 used for the non-geometric null."
    - "Only 1 of the intended 2 object curves at q7,n3 was reachable within the fixed, preregistered curve-search pool; no other q,n cell was tested."
    - "No solve, decomposition, key-recovery or descent-cost claim is made; certificate.kind=none throughout."
  unresolved_confounds:
    - "The q7,n3 incompleteness is a genuine, exhaustively-confirmed pool exhaustion (J1), not remediable within this run per the run's own frozen rule; a recheck requires a NEW, differently-designed experiment (different curve pool/ordering), not an amendment to this one."
    - "The null construction is deliberately non-geometric (specification.yaml's own declared limitation) and cannot by itself isolate a Frobenius effect even where its contrast with the object arm is clean, at either field."
    - "FROB-q7-n3-object01's OWN object arm shows positive Delta_rank, but its non-geometric nulls show even larger Delta_rank at several covers -- an open question (already flagged by DEC-20260914-d04668's dependency_and_ordering) about what the non-geometric null is actually measuring at this field, separate from and not resolved by this review."
    - "J3 (null invariant preservation) was verified via the producer's own code assertions plus non-crash completion, not an independent by-hand fixture re-derivation for every null cell."
  reviewed_by: coordinator
