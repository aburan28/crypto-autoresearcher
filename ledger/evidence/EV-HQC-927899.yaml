    committed stage_2 D2/D3/D3_cap/D3_max_w and matched_pair_stats to full float64 bit-identity across
    all 25 evaluable k) PASSES on all 4 (shard, variant) pairs. Step 2 (the real n_trials=30000
    analysis call''s own discarded [0:10000) prefix, bit-identical elementwise to the SAME task''s own
    separate verification call) PASSES on all 4 pairs. The F[:, 0:n_e-1] structural invariant PASSES
    on both shards, 0/1,100,000 mismatches each. The Validator independently reproduced BOTH steps and
    the F-invariant from a fully separate driver and its OWN freshly-generated raw data (not the
    executor''s), obtaining identical PASS results and identical bit-for-bit statistics. This two-step
    check is DISCLOSED, BY BOTH THE DESIGN AND THE VALIDATOR''S EXPLICIT JUDGMENT, AS GENUINELY WEAKER
    than TASK-20260814-8bbdd2''s direct raw-array-vs-committed-record check on shards 5000/6000 --
    necessitated by the disclosed data gap that TASK-20260809-a79e4f stage 2 never persisted raw
    per-trial S arrays for shards 8001/8002. The Validator''s explicit, non-optional judgment: ADEQUATE
    as a disclosed, weaker substitute given the actual data gap; NOT equal in strength to the direct
    check. Hard invariants D2/D3: 0 violations on all 8 sampling calls (4 verification + 4 analysis).'
  - 'O3. THE COMPLETED FOUR-SHARD SINGLE-SHARD-ONLY LOCAL-EXPONENT TABLE, ALL FOUR VALUES NOW ON
    RECORD. Shard 5000 alone: +2.836 (EV-HQC-469c08 O6, cited not recomputed). Shard 6000 alone:
    +1.402 (EV-HQC-469c08 O6, cited not recomputed). Shard 8001 alone: -0.2682495157085447 (this
    task, T=10,000 committed 0.024506333 -> T=20,000 new disjoint tail 0.029514095961871902 at k=17;
    diff=-0.024883352085833366, se_unpaired=0.3236250600063397, z_paired=-0.8431006024368555). Shard
    8002 alone: -0.8662355237627483 (this task, T=10,000 committed 0.022096687 -> T=20,000 new
    disjoint tail 0.04028005391322156 at k=17; diff=+0.04250322299718334,
    se_unpaired=1.1794235190866975, z_paired=1.055192803086891). Both new exponents, and the full
    per-k statistics they rest on, were independently reproduced by the Validator to full
    double-precision exactness (bit-identical `==`) from the Validator''s own freshly-regenerated raw
    data, at k=17 and four additional k (2, 10, 24, 26), confirming the pattern is a genuine property
    of the data and estimator across k, not a k=17-specific fluke.'
  - 'O4. ALL FOUR SINGLE-SHARD-ONLY LOCAL EXPONENTS ARE FAR OUTSIDE THE PRE-REGISTERED [0.4,0.6]
    1/sqrt(T)-CONSISTENCY BAND, AND THE TABLE NOW SPANS A FULL SIGN FLIP: two positive (5000: +2.836,
    6000: +1.402 -- SE decreased from the first to the second point on both original shards) and two
    negative (8001: -0.268, 8002: -0.866 -- SE INCREASED from the first to the second point on both
    fresh shards, the opposite direction from any 1/sqrt(T) shrinkage). The executor''s own
    run_manifest.yaml flags this sign flip as an anomaly per AGENTS.md rule 9, recorded as an
    observation and not interpreted; the Validator''s control_checks independently confirms this is
    exactly the "canonical artifact tell" (docs/inventor-protocol.md Section 3) and that it is
    disclosed, not swept into the consistency-band language.'
  - 'O5. THE IVW COMBINATION VS. THE CONCATENATED-HISTOGRAM POOLED ESTIMATE AT k=17, BOTH SHARD PAIRS,
    INDEPENDENTLY REPRODUCED TWICE (Validator and Red Team, from two separately-written from-scratch
    computations reading only TASK-20260809-a79e4f''s already-committed matched_pair_results.json, no
    new sampling). (a) Shards 5000/6000 at T=5,000-each: diff_ivw=0.06443464789067889,
    se_ivw=0.09604884205062017, vs. concatenated pooled (T=10,000) se=0.096781; ratio
    se_ivw/se_pooled = 0.9924324564527465. (b) Shards 8001/8002 at T=10,000-each:
    diff_ivw=0.010615533285116259, se_ivw=0.016410683466159315, vs. concatenated pooled (T=20,000)
    se=0.017905; ratio se_ivw/se_pooled = 0.9165211564744258. Both ratios are close to 1 at k=17; the
    (b) ratio ranges further from 1 across k=2..26, with its minimum (about 0.907-0.910) around
    k=17-20, its largest deviation coinciding with the pre-registered load-bearing cell.'
  - 'O6. THE RED TEAM''S FIRST SUBSTANTIVE FINDING: THE COMPLETED FOUR-SHARD TABLE DOES NOT SHARPEN
    THE SHARD-SPECIFIC-VS-GENERAL QUESTION INTO CONFOUND-FREE EVIDENCE -- IT ACTIVELY UNDERMINES THE
    DIAGNOSTIC ITSELF. A two-point log-log slope has zero internal degrees of freedom: no standard
    error, confidence interval, or significance test is computable from two points alone. Treated
    (informally, explicitly flagged by the Red Team as a crude, non-rigorous illustration, not a
    model of the diagnostic''s true sampling distribution) as four i.i.d. draws -- values
    [2.836, 1.402, -0.268, -0.866], mean 0.776, sample SD 1.6755 (ddof=1), naive t(df=3) 95% CI on the
    mean [-1.890, 3.442] -- the interval contains both 0 and the pre-registered [0.4,0.6] band and
    values far above 1: even this crude n=4 treatment cannot reject "the true common exponent is 0.5
    and everything else is sampling noise in a very noisy 2-point statistic," the opposite of what a
    directional lean toward general heterogeneity requires. The Red Team names this an honest
    correction to its own prior report''s framing (TASK-20260814-a49f1c named the single-shard local
    exponent "the sharpest available discriminator" when it had two data points that agreed in sign;
    with two more that disagree in sign, that sharpness claim does not survive its own completion).'
  - 'O7. THE RED TEAM''S CENTERPIECE FINDING: SHARD IDENTITY IS PERFECTLY CONFOUNDED, ACROSS EVERY
    SINGLE-SHARD-ONLY LOCAL EXPONENT MEASURED IN THIS TASK FAMILY SO FAR, WITH THE ABSOLUTE
    TRIAL-COUNT/BATCH-SIZE TRANSITION TESTED -- A THIRD, PREVIOUSLY UNNAMED, DIRECTLY FALSIFIABLE
    EXPLANATION DISTINCT FROM BOTH "SHARD-SPECIFIC" AND "GENERAL ESTIMATOR HETEROGENEITY."
    N_JACK_BATCHES = 200 is a FIXED constant, confirmed by direct code read (stage_a.py line 89),
    used identically by every matched-pair/jackknife computation in this family. Batch size is
    therefore T/200, doubling at every trial-count step measured in this family:
    shard 5000 alone and shard 6000 alone were BOTH tested at the T=5,000->10,000 transition
    (batch size 25->50), and BOTH show a POSITIVE exponent (SE decreased); shard 8001 alone and shard
    8002 alone were BOTH tested at the T=10,000->20,000 transition (batch size 50->100), and BOTH
    show a NEGATIVE exponent (SE increased). No shard in this campaign has EVER been tested at the
    other pair''s transition regime -- shard identity (original vs. fresh) and transition regime
    (25->50 vs. 50->100 trials-per-batch) are 100% collinear in the data collected so far, because
    TASK-20260809-a79e4f stage 1 fixed T=5,000/shard for 5000/6000 and stage 2 fixed T=10,000/shard
    for 8001/8002, and every subsequent single-shard-only measurement has extended each shard from
    its own historically-fixed starting point rather than from a common one. This confound requires
    no appeal to shard identity of any kind (specific or general) -- only to which two absolute
    (T, batch-size) points were sampled, a variable this task family has never varied independently
    of shard identity. It is cheap and directly falsifiable: test at least one shard from each
    existing pair at the OTHER pair''s transition regime, on a fresh, disjoint trial range.'
  - 'O8. THE DESIGN''S OWN NAMED EXAMPLE OF THE DISJOINTNESS PROOF''S RESIDUAL RISK DOES NOT SURVIVE A
    DIRECT CODE TRACE; A DIFFERENT, MORE PRECISE GAP IS THE GENUINE ONE (Red Team). design.md Section
    3 names "a numpy RNG version or platform difference changing CTRStream''s output" as the
    mechanism by which the two-step check could pass while true correspondence to the originally
    consumed data is broken. The Red Team traced CTRStream''s constructor and _refill directly
    (stage_a.py lines 171-204): it is a pure SHA-256 counter-mode construction with zero dependency
    on numpy.random/PCG64/Generator anywhere in the trial-generating path -- this named risk is not
    mechanistically live. The genuine, more precise gap is structural: Step 2 compares two calls made
    inside the SAME process, where Step 1 and TASK-20260814-8bbdd2''s direct check both compare
    against an artifact from a genuinely SEPARATE process/session. The Red Team checked the reused
    code for the concrete same-process failure class this implies (buffer aliasing, stale caching)
    and found none (F_all is freshly zero-allocated every _t_shard call; sa.decode_blocks is
    correctly saved/restored by run_arm). Position: the adapted proof is not proven unsound and no
    exploited gap was found, but it is honestly weaker in a different, more precise way than either
    the design or (by extension) EV-HQC-469c08 documented.'
  - 'O9. THE IVW CHECK (PART B) ANSWERS A NARROWER QUESTION THAN EV-HQC-469c08 O8''s ACTUAL
    POOLING-CONVENTION ASYMMETRY, WHICH REMAINS UNTESTED (Red Team). O8''s asymmetry is between the
    T=5,000 fit point (the ARITHMETIC MEAN of two separately-computed per-shard SEs, 0.137502) and
    the T=10,000/20,000 fit points (the SE of a single, JOINTLY POOLED multi-shard dataset). Part B
    never computes or compares against the arithmetic-mean-of-SEs statistic; it compares
    IVW-of-two-shards to concatenated-pooling-of-two-shards, both MULTI-SHARD-COMBINED statistics
    computed on the SAME trial count -- structurally, both express "what you get from combining
    10,000 (or 20,000) total trials across two shards," so their close agreement (O5 ratios near 1)
    is expected regardless of whether O8''s actual concern is a real bias. The specific
    pooling-convention asymmetry O8 named remains neither confirmed nor refuted by this batch. A
    minor, independently-caught prose overstatement: four_shard_exponent_report.md Section 6(b)
    states the (b)-pair ratio is "consistently at or below 1... at every k in 2..26," but the Red
    Team''s own pull of the full k=2..26 series shows the ratio is marginally ABOVE 1 at k=2-7
    (1.0005-1.0018) -- a non-material prose inaccuracy, the underlying data are correct.'
  - 'O10. VALIDITY. Both scripts (shard_8001_8002_discard_prefix.py, ivw_pooling_check.py) report
    valid_measurement, exit code 0. D2/D3 hard invariants: 0 violations on all 8 sampling calls, no
    truncation, no crash. All fail-closed selftests PASS. The bootstrap-utility-function
    local-redefinition pattern (sha256_file, core_seconds, git_state, load_module_fail_closed,
    structurally forced by the same chicken-and-egg problem EV-HQC-469c08 O10 named for
    TASK-20260814-8bbdd2) is disclosed accurately here, in the same place as the correction, unlike
    the sibling task''s design.md -- both reviewers confirm this positive finding independently.
    Independently reconfirmed by the Validator (own driver, own data) and the Red Team (direct
    inspection of the committed JSON''s pass/fail fields plus independent recomputation of the IVW
    combination and the batch-size trajectory).'
  - 'O11. MEASURED SPEND: 94.171 core-seconds / 94.020 wall-clock seconds total
    (shard_8001_8002_discard_prefix.py: 93.839 core-s / 93.828 wall-s; ivw_pooling_check.py: 0.332
    core-s / 0.192 wall-s), against the 500 core-second / 1,800 wall-clock authorization (18.8% /
    5.2% of budget), 2 of 2 authorized runs used. Cross-checked by the Coordinator against
    run_manifest.yaml, both results JSON files'' own budget blocks, and stdout.log (all agree).
    Independently plausibility-checked by the Validator''s own comparable workload (94.500 core-s /
    94.420 wall-s, within 0.7% of the executor''s figure); read but not independently re-measured by
    the Red Team. No infrastructure event of any kind occurred.'
  - 'O12. BRANCH A (POSITIVE DETECTION) HAS STILL NEVER FIRED IN THIS CAMPAIGN. This task''s own
    z_paired at k=17 (shard 8001: -0.8431; shard 8002: +1.0552) joins shard 5000''s -1.2256 and shard
    6000''s +0.6760 (EV-HQC-469c08 O3): all four |z| < 1.96. The Red Team''s BATCH-2ecaa1 standing
    objection is not retired by this batch.'
  inference: >-
    THE FOUR-SHARD TABLE AND THE IVW COMPARISON WERE EXECUTED EXACTLY AS DESIGNED, PASSED EVERY
    PRE-REGISTERED VALIDITY GATE, AND ARE INDEPENDENTLY REPRODUCIBLE TO FULL DOUBLE-PRECISION
    EXACTNESS -- BUT THEY DO NOT SETTLE, AND DO NOT EVEN CLEANLY SHARPEN, THE SHARD-SPECIFIC-VS-GENERAL
    QUESTION THIS BATCH WAS DISPATCHED TO INFORM. Two independent findings from this batch's own new
    data undercut that question's premise rather than answer it. FIRST (O6): the single-shard-only
    local exponent is a two-point, zero-degree-of-freedom diagnostic; the completed four-value table,
    treated even crudely as a sample, cannot statistically distinguish "general heterogeneity,"
    "shard-specific," or "flat exponent plus noise" from one another. SECOND, AND THE SHARPER,
    CENTERPIECE FINDING OF THIS BATCH (O7): shard identity is perfectly confounded, in every
    measurement this family has ever made, with the absolute trial-count/batch-size transition
    tested, because N_JACK_BATCHES=200 is fixed while T doubles at each step -- a mechanism
    structurally unrelated to shard identity of any kind, previously unnamed anywhere in this task
    family, and directly falsifiable by a cheap cross-regime test that has not yet been run. Given
    O6 and O7 together, THE HONEST READING IS NOT THAT THE SHARD-SPECIFIC-VS-GENERAL QUESTION IS
    CLOSER TO RESOLUTION, BUT THAT IT WAS UNDER-SPECIFIED FROM THE START: a third, more parsimonious
    candidate mechanism competes with both of DEC-20260809-186c86's original named categories, and no
    measurement in this family to date can discriminate among the three, because the diagnostic's own
    sampling variance has never been calibrated (O6) and the batch-size confound has never been broken
    (O7). SEPARATELY: the IVW combination is correctly computed and independently reproduced twice,
    but answers a narrower question than EV-HQC-469c08 O8's actual pooling-convention asymmetry (O9),
    which remains untested. The adapted disjointness proof is ADEQUATE as a disclosed, weaker
    substitute (Validator''s explicit judgment), and its own named residual-risk mechanism is not
    mechanistically live, though a different, more precise same-process-vs-cross-process gap is real
    and undisclosed until this review (O8). H-HQC-18d1b4 is untouched by any of this: neither the
    diagnostic-reliability finding nor the batch-size confound bears on the V3 defect''s propagation
    to k=17 in either direction.
