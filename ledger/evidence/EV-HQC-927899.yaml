  - 'O2. THE ADAPTED TWO-STEP DISJOINTNESS PROOF AND THE F[:, 0:n_e-1] STANDING INVARIANT, BOTH
    FAIL-CLOSED VALIDITY GATES FOR THIS TASK''S NEW DATA, BOTH PASS. Step 1 (a dedicated
