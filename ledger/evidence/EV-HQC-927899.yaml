  unresolved_confounds:
  - >-
    NEW, PRIMARY, THE CENTERPIECE FINDING OF THIS BATCH: the batch-size/absolute-trial-count
    transition regime (T/N_JACK_BATCHES, N_JACK_BATCHES=200 fixed throughout this family) is
    perfectly confounded with shard identity across every single-shard-only local exponent measured
