  inference: >-
    THE GATING QUESTION IS UNANSWERED AND THE MEASUREMENT RETURNED ITS PREDICTED
    NULL AT PRELIMINARY STRENGTH, WITH ONE UNRESOLVED CONFOUND.

    (1) Cost corollary CC of H-ICINV-82ee6a remains UNDETERMINED -- not refuted,
    not supported. STAGE 0 could not obtain a full text, so no cost statement may
    be made in either direction and no modeled row of the concrete-cost table may
    be cited as a cost claim. The load-bearing [EXTERNAL, UNVERIFIED] assumption
    of H-ICINV-82ee6a and IDEA-20260807-9fb27c's novelty_status: unverified with
    its unread Bernstein-De Feo-Leroux-Smith attribution travel forward with
    their marks INTACT. No supersession of IDEA-20260807-9fb27c is triggered;
    that is triggered only by S0_BASE_FIELD.

    (2) HEUR-ORD-1 survives at toy scale, at `preliminary`, with seed 20260807
    dissenting. The dissent rests entirely on deficits at k20 (0.081) and k22
    (0.061), BOTH BELOW the design's declared resolvable floor of 0.10, which is
    why the aggregate is a majority null rather than a contradiction.

    (3) HEUR-M2-2 is supported at the coverage the contract declared and no
    further: the m = 1 fixture passes through the STAGE-3 code path and no
    instance with m > 2 was found in the static audit. That coverage is WEAKER
    than the runtime instrumentation the parent proposal asked for, by a
    substitution declared in H-ICINV-82ee6a and unchanged here.

    (4) THE DEFICIT ANOMALY IS UNRESOLVED, AND THIS RECORD SAYS EXACTLY WHAT THE
    DATA CAN AND CANNOT DISTINGUISH. Three explanations. (A) A small-d
    arithmetic artefact, which the contract pre-declared: SUPPORTED by the
    monotone rise of distinct (d, m) values 167 -> 923 across the ladder and by
    the deficit being significant at exactly the three most atomic decades and
    sub-critical at k24 at 3/3 seeds -- but an effect that genuinely shrinks with
    p would look identical, so this is consistency, not proof. (B) THE NULL IS
    MATCHED ON d BUT NOT ON THE SUPPORT OF lambda, and THE DATA CANNOT ADDRESS
    THIS AT ALL because the design never drew the comparison that would. Since
    lambda = +/- round(t/2), the curve-derived lambda is a SMALL INTEGER in a
    window of size O(sqrt d), while the matched null draws a UNIFORM unit from
    all of (Z/d)^*. A deficit against the uniform null is therefore ambiguous
    between "CM structure makes the order small" (a fact about curves) and
    "small integers have smaller multiplicative order than uniform units mod the
    same d" (a fact about integers, with no elliptic curve in it). This is a gap
    in the PRE-REGISTERED DESIGN, not in its execution, and is filed as
    KN-OPEN-2c095b. (C) Noise at the floor: EXCLUDED as a complete explanation,
    because k14 reaches D in [0.104, 0.121] -- above the declared floor -- at all
    three independent seeds; it plausibly explains the sub-floor cells the
    dissent rests on. Net: (A) contributes, (B) is untested, (C) is insufficient.
    The honest label is UNRESOLVED and the remedy is a discriminating
    replication, not a verdict.

    (5) AUDIT-Z IS NOT CONFIRMED. Zero rows change exponent, which is what
    AUDIT-Z predicted, but 127 of 177 are undetermined and
    OUTCOME_AUDIT_PARTIAL fired. The contract is explicit that a partial audit
    may not be reported as a confirmation.

    (6) NO ATTACK AND NO SPEEDUP, IN EITHER DIRECTION. sota_delta is 0.0 against
    0.886 sqrt(N). Even had a small-m family of positive density been found,
    mechanism STEP 4 -- H-ENDO-001, used here as an admissibility filter and NOT
    re-tested -- would still make the endomorphism useless for the ECDLP, because
    it acts on the prime-order subgroup as a scalar computable in O(1).

  boundaries:
    - >-
      Curve family and field: ordinary short-Weierstrass y^2 = x^3 + ax + b over
      PRIME fields F_p, p > 3, singular and supersingular (t = 0) instances
      rejected. Supersingular curves and extension fields are OUT OF SCOPE and
      nothing here transfers to them.
    - >-
      Bit sizes: log2 p in {12, 14, 16, 18, 20, 22, 24} at p = 4093, 16381,
      65521, 262139, 1048573, 4194301, 16777213. Scale-relevance label:
      TOY-SCALE, by direct computation at the stated size. No correspondence or
      embedding is used and none is available, which is why crypto scale is not
      reachable rather than merely not attempted.
    - >-
      Instance generation: deterministic seeded sha256 stream
      a = sha256(seed:p:a:i) mod p, b = sha256(seed:p:b:i) mod p; #E determined
      by baby-step/giant-step in the Hasse interval with a uniqueness flag and
      annihilation at >= 3 independently sampled points; non-unique instances
      EXCLUDED and counted, never guessed. Modular non-uniformity below 2^-230,
      declared.
    - >-
      Solver and implementation: pure Python, new modules harness/exp_kerfield.py,
      harness/run_kerfield.py, harness/velu_stage0.py, with harness/toycurve.py
      and harness/runner.py imported unmodified; sympy 1.14.0, Python 3.13.1,
      macOS arm64. No Sage, no Groebner, no solver. All 13 runs carry
      code.source.all_pinned: true with per-file sha256;
      tools/check_run_source_provenance.py --strict exits 0 with 13 pinned and 0
      unpinned.
    - >-
      Parameter range: alpha restricted to the FROBENIUS ORDER Z[pi], primitive
      with gcd(v, d) = 1; the k = 5 smallest-degree window reported; conductor
      stratified into {f = 1, 2 <= f <= 10, f > 10}. Where f > 1 the maximal
      order O may contain a non-scalar element of SMALLER degree, so every d here
      is a Z[pi] statement and the O-minimum is a declared secondary for f <= 100.
    - >-
      Seeds and instances: 3 seeds (20260807, 20260814, 11235813) x 7 decades x
      1000 instances = 21000 measured instances plus 21000 matched null draws.
    - >-
      Controls and baselines: planted positive control (blocking), matched
      random-unit null written and re-read from disk BEFORE the KS statistic with
      hashes and timestamps recorded, m = 1 nearby-object fixture (blocking),
      decay check, factorisation and order verification per instance, order
      certificate per curve, run-source provenance (blocking). Standing cost
      baselines KN-TECH-001, KN-TECH-006, KN-TECH-018, KN-TECH-031, byte-verified
      at run time, unchanged and unchallenged.
    - >-
      Resource limits: 7200 s per run, 6 CPU-hours, 4 GB. Used: 25.1 s, 0.007
      CPU-hours, 99 MB. Thirteen runs against a frozen cap of 12 (deviation D1).
    - >-
      THE LARGEST CLAIM JUSTIFIED BY THE DATA, in the negative-result phrasing of
      docs/evidence-and-reproducibility.md: over the tested instances,
      parameters, solver and resource budget above, NO deviation of the
      distribution of log m / log d for the curve-derived lambda from that of a
      uniformly random unit modulo the SAME d, meeting the pre-registered
      two-sample KS criterion at the three largest decades, was observed at two
      of three seeds; AND no cost claim recorded in this ledger was found to
      change its stated exponent under the corrected cost model (0 of 177 rows,
      127 undetermined). A deficit against the matched null was observed at the
      three smallest decades at all three seeds and is UNRESOLVED. The field over
      which the square-root Velu operation count is stated remains UNDETERMINED,
      so no corrected cost figure is asserted in either direction. This
      establishes behaviour only on the tested toy distribution; it does not
      establish that all parameterisations behave so, that all related
      representations behave so, that no undiscovered structure exists, or that
      no future algorithm exploits the mechanism.

  unresolved_confounds:
    - >-
      CONFOUND-1, THE MOST SERIOUS AND THE ONE THIS DESIGN CANNOT ADDRESS: THE
      MATCHED NULL IS MATCHED ON d BUT NOT ON THE SUPPORT OF lambda. By T3 the
      minimal non-scalar alpha has v = +/-1 and u = round(-t/2), and the frozen
      lambda-rule then gives lambda = +/- round(t/2) mod d, so
      |lambda| <= (|t|+1)/2 <= sqrt(p) + 1 ~ sqrt(d): the curve-derived lambda is
      a SMALL INTEGER in a window of size O(sqrt d). The null draws a UNIFORM
      unit from all of (Z/d)^*. The observed deficit is therefore ambiguous
      between a fact about CM arithmetic and a fact about the multiplicative
      orders of small integers. NO null over small integers of matched magnitude
      was drawn, so these 13 runs cannot separate them. Filed as KN-OPEN-2c095b.
    - >-
      CONFOUND-2: m DEPENDS ON THE CURVE ONLY THROUGH t, so the effective number
      of distinct objects per decade is O(sqrt p), not the nominal n = 1000. The
      pre-registered critical value 1.358 sqrt(2/N) is calibrated for 1000
      independent continuous draws; the curve-derived sample has 164-939 distinct
      (d, m) values with heavy multiplicities, most extreme exactly where the
      deficit is largest. Whether this makes the nominal threshold conservative
      or anti-conservative under this replicated-atom structure is NOT settled by
      these data.
    - >-
      CONFOUND-3: the primitivity and gcd(v, d) = 1 admissibility filter
      conditions the sample. Its measured degenerate_fraction is 0.000 at every
      cell, which bounds any conditioning effect as small but does not
      characterise its direction.
    - >-
      CONFOUND-4: the k = 5 degree window means minimality is not uniqueness;
      the within-window spread is reported (T4) but the primary statistic uses
      the smallest-degree admissible alpha, and whether the minimiser choice
      contributes to the deficit is not separately tested.
    - >-
      CONFOUND-5: RUN-ICINV-kf-decide bound the SUPERSEDED stage-1 artifact
      (barrier_table_sha256 ee853b76..., from RUN-ICINV-kf-stage1-barrier rather
      than -v2). M4 is identical in both tables, verified by direct read, so no
      number changes; the traceability defect is recorded rather than absorbed.
    - >-
      CONFOUND-6: no independent Validator or Red Team review exists.
      DEC-20260807-1538f8 next action N3 reserved both "before any evidence
      record is written" and they were not run. This record is Coordinator-only.

