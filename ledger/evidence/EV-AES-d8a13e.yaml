    a convention that was already there and already right.
    EV-AES-d33b1c IS NOT EDITED. It is bound by sha256 in the DISPATCHER-VERIFIED
    ledger archive TASK-20260802-c90b58 at commit 2b894d1e, and editing it would
    break the first archive in this goal to pass its own gate in order to fix a
    one-line field. Superseding costs one record; editing would cost the
    verification.
    Every observation, limit, boundary and confound below is BYTE-IDENTICAL to
    EV-AES-d33b1c apart from this header. No claim is added, removed or altered.
  hypothesis_id: RQ-AES-003
  hypothesis_note: >-
    hypothesis_id carries the QUESTION id, following the convention of
    EV-AES-001..005. No H-* record is bound. RQ-AES-003 is an execution-and-certification
    question and this batch tested three named objects directly rather than a
