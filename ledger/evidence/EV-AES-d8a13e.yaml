  strength_basis: >-
    Every load-bearing measurement below was RE-EXECUTED by an independent
    validator using instruments it wrote from scratch (vcount.c, vsq.c, vyoyo.c,
    gf.py), its own keys, and a different partitioning strategy, against a
    package bound by a DISPATCHER-VERIFIED snapshot archive at commit c1ff4665.
    A red team audited the same package for claim tiers and omitted terms. This
    is `replicated` and NOT `strong`: the campaign supplies session and
    implementation independence but NOT MODEL independence under standing basis
    0137a051eb5828789eb267fa83c8278086578d4c, so nothing here counts toward a
    closure quorum.
  claim_tier: toy
  claim_tier_basis: >-
    Reduced-round AES-128 only, r in {4,5,6,7}, single key per arm, on one
    machine. Nothing here says anything about full-round or deployed AES, and no
    comparison to published cryptanalysis is made in either direction --
    RQ-AES-003 R3 forbids that in this repository, which has no reachable
    primary source to adjudicate it.
  certificate_refs: []
  proof_status: empirical_only
  proof_refs: []

  scope_of_this_record:
    covers: >-
      SEGMENTS 1 AND 2 ONLY, exactly as bound at snapshot commit c1ff4665 and
      exactly as the two reviewers reviewed.
    excludes: >-
      SEGMENT 3. The rank 2+4 producer was resumed for two further arms AFTER
      the reviewers were dispatched, so that output is UNREVIEWED. It is named
      in DEC-20260802-b226fb as measured-but-not-reviewed, it carries no
      strength here, and it supports NO observation below. It carries to
      BATCH-003 for its own snapshot and independent review. See
      coordination/goals/GOAL-AES-003/batches/BATCH-002/archives/TASK-20260802-c90b58/SEGMENT-3-SCOPE-NOTE.md.

  observations:
    - id: OBS-B2-1
      statement: >-
        THE HINTED r=6 AND r=7 CONSTRUCTIONS ISOLATE THE CORRECT KEY BYTE; THE
        UNIQUENESS IS NOT AN ARTEFACT OF THE SURVIVOR TEST. With a true hint the
        survivor-count histogram over 16 diagonals is {1: 16} and every survivor
        is the correct byte. With ANY hint byte falsified the candidate set is
        EMPTY, not differently populated: 1-of-3 wrong gives {0: 16} over 16
        diagonals, 2-of-3 gives {0: 12}, 3-of-3 gives {0: 44} over 11 trials. In
        no wrong or partial diagonal did the true byte, or the wrong key's own
        corresponding byte, appear anywhere in a survivor set.
      status: CONFIRMED by independent re-execution
      confirmation: >-
        The validator built its own hint-substitution variant (vsq.c), reusing no
        producer source, and reproduced TRUE6 survivors [253,65,253,122] all
        unique and correct, WRONG6 as {0,0,0,0}, and 1-of-3-wrong as {0,0,0,0} on
        a second key.
      limits: >-
        The producer's hint corruption is by PREFIX, so "a single false hint
        byte" was tested only at slot t=0; slots t=1 and t=2 were never singly
        corrupted. Two short runs would close this and they were not run. The
        thinnest cell, 2-of-3-wrong at r=7, has ONE trial and lies outside the
        frozen preregistration; no conclusion rests on it, and deleting it leaves
        24 partial diagonals all reading 0 with this observation unchanged.
    - id: OBS-B2-2
      statement: >-
        THIS SAYS NOTHING ABOUT ATTACK UTILITY, AND THE DISTINCTION IS PART OF
        THE OBSERVATION. r=6 remains DOMINATED -- 69.39 s against roughly 25 s
        for exhaustive search over the same hinted residual -- and r=7 is NOT a
        key recovery: it is handed the full last round key plus 3 of 4 bytes per
        diagonal. The r=6 mode consumes 12 of 16 last-round-key bytes to yield 4,
        i.e. 96 bits in for 32 bits out.
      dominated_by: exhaustive search over the hinted residual
      sota_delta: negative
      status: CONFIRMED
      limits: >-
        The red team notes the domination was costed on TIME only. Adding query
        cost makes it LARGER, not smaller: 2^33 chosen plaintexts against O(1)
        for the baseline, with oracle transport charged at zero because the
        process is its own oracle. The record is incomplete in the direction that
        flatters the construction, and is corrected here.
    - id: OBS-B2-3
      statement: >-
        THE OPEN INSTRUMENT RISK IS CLOSED. Every previously surviving control in
        this campaign predicted ZERO, so a counting engine that systematically
        undercounted would have passed all of them. A control was preregistered
        with an exact large non-zero prediction -- n = 547608330240, occupancy
        histogram {0: 4278190080, 256: 16777216}, max occupancy exactly 256 --
        and the instrument returned it TO THE DIGIT with the histogram matching.
        The paired arm at a non-critical j0, same matrix, same key, same base,
        returned exactly 0 with max occupancy 1.
      status: CONFIRMED by independent re-execution
      confirmation: >-
        The validator reproduced n = 547608330240 with the identical histogram on
        an engine it wrote from scratch, and reproduced the paired j0 arm at 0.
      limits: >-
        The exact count and its occupancy histogram are ONE structural prediction
        reported as two, since n is a deterministic function of the histogram.
        Two of the producer's three "exactness checks" are the same check: n and
        n_alt derive from the same histogram, so their agreement is implied by
        the per-window integrity test. What genuinely discriminates is the PAIRED
        j0 behaviour -- a convention misalignment would have swapped the two
        readings and did not. The cross-instrument anchor against BATCH-001's
        engine was never run.
    - id: OBS-B2-4
      statement: >-
        THE MIXING-LAYER NO-ZERO-ENTRY CONDITION SPLITS BY ROUND COUNT: it is
        dispensable at r=5 and load-bearing at r=4, where the exact requirement
        is that the four entries M[(-c-j0) mod 4][c] be non-zero, with which four
        depending on j0.
      status: >-
        CONFIRMED at r=4 by independent re-execution of the j0-paired arms.
        At r=5 the DISPENSABILITY rests on the validator's independent
        verification that fact 2's k=1 class contributes a multiple of 2^24, plus
        the red team's constraint-counting argument -- both reviewed analysis.
      recorded_as: CORR-20260802-46b73b
      limits: >-
        The producer's original framing, "the derivation is WRONG", was ruled
        DOES NOT FOLLOW by the validator and is NOT adopted. Fact 2 read as a
        statement about AES's own MixColumns is TRUE and merely NON-MINIMAL; what
        is false is its assertion as a hypothesis OF THE r=5 RESULT. The
        producer's two r=5 arms are two projections of the SAME 2^32 ciphertexts,
        differing only in j0, so its 1/64 independence figure was not established
        by those arms; the honest 1/64 across two independent keys exists only
        because the VALIDATOR ran the arm the producer dropped.
    - id: OBS-B2-5
      statement: >-
        THE r=5 YOYO SIGNAL REPLICATES IN A THIRD INDEPENDENT IMPLEMENTATION at
        15.63x over the null (125 hits against 8.0), with a second key at 15.00x.
        The measured PRP null AGREES with the analytic null -- pooled 12 hits
        over 2^34 trials against an analytic 16.0, inside the 99% Poisson
        interval -- closing a gap where the p-value had previously rested on an
        unmeasured null. The structure-destroyed control reads 1.00x. Death round
        MEASURED BY THIS CAMPAIGN: alive at r=5, dead at r=6.
      status: CONFIRMED by independent re-execution
      confirmation: >-
        The validator's own probe read 14.5x at r=5 and a PRP null of exactly
        1.000000 at r=10, and recomputed every rank-3 statistic including the
        corrected log-space false-negative rate.
      limits: >-
        The one-sided bound on any r=6 excess is 1.72x pooled (the package quoted
        1.64x, which is the single-arm figure). The structure-destroyed control
        at 2^32 excludes only an excess above roughly 2.3x. Two null arms were
        added AFTER the main result was read; the producer disclosed this and
        reported them individually, and the red team assessed the anti-flattering
        one as a disclosed non-issue. The per-trial quantity is a FALSE-POSITIVE
        RATE, not a distinguishing advantage -- the earlier wording flattered the
        result and is corrected.

  inference:
    policy: coordinator-orchestration-code
    requested_policy: coordinator-orchestration-code
    resolved_model: claude-opus-5
    fallback_used: true
    fallback_note: >-
      orchestration/model-policies.yaml names GPT-5.6-family aliases this harness
      cannot resolve; all roles run model: inherit.
    model_verified: false
    standing_basis: 0137a051eb5828789eb267fa83c8278086578d4c

  boundaries:
    - >-
      Nothing in this record is a statement about full-round or deployed AES, and
      no comparison to published cryptanalysis is made or implied in either
      direction. The r=6 and r=7 constructions are hint-assisted and are NOT key
      recoveries; the r=6 one is dominated by the trivial alternative.
    - >-
      The r=4 and r=5 properties are NOT AES-S-box-specific. They follow from
      round geometry and were reproduced with uniformly random bijective S-boxes
      at 120/120. They distinguish 5-round AES from a random permutation but
      carry NO information about the AES S-box.
    - >-
      This record covers the reviewed package only. Segment 3 is excluded, by the
      scope statement above.

