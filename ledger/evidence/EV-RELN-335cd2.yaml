evidence:
  id: EV-RELN-335cd2
  hypothesis_id: H-RELN-41562a
  experiment_ids: [EXP-RELN-f202be]
  run_ids:
    - RUN-RELN-f202be-N14v2
    - RUN-RELN-f202be-N16v2
    - RUN-RELN-f202be-N18
    - RUN-RELN-f202be-N20
    - RUN-RELN-f202be-stage4v2
  type: empirical
  direction: neutral
  strength: inconclusive
  claim_tier: toy
  certificate_refs: []
  proof_status: empirical_only
  proof_refs: []
  observations:
    - >-
      Complete run set achieved under protocol_amendment v1
      (experiments/EXP-RELN-f202be/amendments/v1.yaml, DEC-20260907-432a39):
      all four rungs (N ~ 2^14, 2^16, 2^18, 2^20), three certified
      prime-order curves each, pass every blocking control (Z/N-interval,
      Bose-Chowla, NULL-A/NULL-B bands, q-decay monotonicity, ordering, and
      the amended forced-negation-gap control at 0/144 total object-cell
      failures across both amended rungs and the unaffected two large
      rungs). INV-1 and INV-2 accounting are exact (zero deviation) and the
      independent spectral (FFT) cross-check agrees exactly in every cell.
      RUN-RELN-f202be-N14v2 and N16v2 reproduced every measured quantity
      of the original (pre-amendment) N14/N16 runs bit-for-bit under the
      same deterministic seeds, confirming determinism.
    - >-
      The dispersion index Delta for all three object geometries
      (x_interval_low, x_interval_mid, qr_class), both base-size
      conventions, lies inside the NULL-A random-base band (mean +/- 3 SD)
      at every rung and every curve -- the pre-committed NULL half of the
      contract's success_criterion is met.
    - >-
      The Delta-versus-null-mean difference is small and of MIXED SIGN at
      every rung and cell (rung14: -0.071, -0.013, -0.037; rung16: +0.002,
      -0.007, -0.046; rung18: +0.005, +0.013, -0.021; rung20: -0.002,
      -0.009, -0.005, for x_interval_low/x_interval_mid/qr_class
      respectively), always comparable to or smaller than that rung's
      NULL-A band SD (0.088, 0.042, 0.021, 0.012 at the four rungs). No
      monotone growth or consistent sign appears across rungs.
    - >-
      Despite the above, the contract's growth-fit statistic (fit on
      log(max(Delta - Delta_null_mean, SD_null)) versus log N) gives a
      95%-CI-excludes-zero NEGATIVE slope for every geometry: x_interval_low
      -0.480 [-0.631, -0.344]; x_interval_mid -0.452 [-0.697, -0.216];
      qr_class -0.483 [-0.527, -0.392]. This is neither the pre-committed
      NULL pattern (slope interval contains 0) nor the ALIVE pattern
      (positive slope excluding 0, with z > 3 SD at the two largest rungs
      -- not met by any geometry). The contract's own decision tree does
      not name this outcome.
  inference: >-
    DIAGNOSTIC, NOT A SCIENTIFIC FINDING ABOUT CLUSTERING, offered because
    it is checkable arithmetic on the already-recorded numbers above: since
    the object-vs-null-mean difference is at or below one null-band SD at
    every rung, max(diff, SD_null) equals or nearly equals SD_null at
    nearly every cell, so the fitted "growth" slope is dominated by how the
    NULL-A BAND'S OWN sampling SD shrinks with more effective samples at
    larger N (consistent with the observed slope magnitude near -1/2),
    rather than by any property of the object geometries' Delta values.
    Under this reading, the run set's SUBSTANTIVE picture is consistent
    with the null hypothesis (no growing excess dispersion for x-line or
    QR-class bases at the tested scale), but the contract's LITERAL
    success_criterion cannot be read as satisfied, because that criterion
    requires the growth-fit slope interval to contain 0 and it does not, for
    a reason the criterion's own definition did not anticipate. This
    reading is UNVERIFIED by independent review and is offered as the
    Coordinator's working explanation only, not as a resolved fact.
  boundaries:
    - >-
      Toy scale only (N ~ 2^14 to 2^20), three curves per rung, m = 3, this
      solver and this exact battery's geometry panel and predicate family.
      No transfer or extrapolation to larger N or to other geometries is
      claimed.
    - >-
      The predicate-lift metrics (M8 in the contract) remain incomplete on
      negation-closed object arms, which substitute the analytic INV-3 null
      for the contract-specified NULL-A Monte Carlo null (per-draw NULL-A
      predicate sums were never retained in either run); this evidence
      record does not rely on those lifts.
  unresolved_confounds:
    - >-
      Whether the growth-fit metric's max(diff, SD_null) clipping fully
      explains the observed slope, or whether some part of the negative
      slope reflects a real (if small) property of the object geometries,
      is not settled by this record. A direct check (fitting a growth
      statistic on diff alone, without the SD_null floor) would resolve
      this cheaply from data already collected, with no new curve
      generation required.
    - >-
      Whether the amended forced-negation-gap tolerance
      (max(0.1, 3*(m/B_1)*expected), protocol_amendment v1) is itself
      correctly calibrated beyond the four already-measured rungs is
      untested at any other scale; the amendment's own text discloses that
      its safety margin was chosen with these rungs' residuals already
      visible.
  obstruction: null
  reviewed_by: coordinator
