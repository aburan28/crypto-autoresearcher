      - TASK-20260827-e63723
    joint_outcomes:
      J1-signed-sumset-threshold-and-decoder: breaks
      J2-cross-target-transcript-and-mpz-accounting: holds
      J3-scope-proves-too-much-and-fixed-target-boundary: holds
      blind-statement-only-rederivation: incomplete_statement_nonvoting
    composition:
      - >-
        J1 independently verifies the exact signed four-deck interval, the
        strict no-wrap threshold, binary boundary recovery, decoder, endpoint
        cases, query cap, sign symmetry, and final group verification. It
        breaks the producer record only because that record asserts that an
        F0 occurrence label is necessary even on the admitted large stratum.
      - >-
        On N>4L+1>2m, equality [c]P=[c']P for c,c' in
        {-m,...,-1,1,...,m} forces c=c'. The object and reduction construct the
        deck, so an isolated generic encoding uniquely determines c0 without
        an additional returned occurrence label. Labels remain necessary only
        in excluded collision strata such as m=2,N=3.
      - >-
        J2 independently retrieves MPZ and verifies that one jointly correct
        adaptive correlated-target transcript is admissible as one main-phase
        execution, provided all advice is serialized before Q, no extra
        oracle is introduced, and every interaction is charged to one
        aggregate k that never resets. The exact source bound is
        3*ell*(k+1)^2/N.
      - >-
        J3 confirms that all eight known-false controls stop at named missing
        premises. Its wrap control shows that N>4L+1 is load-bearing; for
        N=10009,m=8,L=4680 the sequence has q(1)=false and q(649)=true.
      - >-
        The blind task independently derives the modular threshold and sharp
        no-wrap boundary, but cannot reproduce the full quantity because the
        frozen blind statement omits the formal signed alphabet, C and the
        x-to-z relation, the public shift formula, ell and k, and the MPZ
        accounting rule. It is therefore incomplete rather than confirming or
        contradicting the producer.
  verified_positive_core_pending_corrected_record:
    model: MPZ dense prime-order generic group under one jointly correct adaptive correlated-target transcript
    asymptotic_scope: sufficiently large prime N satisfying N>4L+1
    construction: >-
      Let B=N^(1/5), m=2^ceil(log2(B)), C=sum_i=0^4 m^i,
      D={-m,...,-1,1,...,m}, L=m+m^2+m^3+m^4, and isolate one F0 coefficient
      c0. The remaining scalar sumset is m[-L,L].
    exact_interval: D+mD+m^2D+m^3D=[-L,L]
    shifted_boundary: >-
      If x+C-c0 is congruent to m*z modulo N with z in [-L,L], then for
      public correlated shifts R_t=R+[m*t]P and 0<=t<=2L+1, the exact
      predicate has q(t)=1 iff t<=L-z.
    decoder: x_hat=(m*z+c0-C) mod N, followed by mandatory [x_hat]P=Q verification
    exact_top_level_call_cap: 5*ceil(log2(B))+3
    advice_bits: ell=B^(9/4+o(1)) only under complete target-independent ordinary-bit serialization
    aggregate_main_interactions: k=B^(5/4+o(1)) only when all target, predicate, handle, replay, decode, and verification work is charged without reset
    conditional_source_bound: 3*ell*(k+1)^2/N=B^(-1/4+o(1))=N^(-1/20+o(1))
  revision_required:
    producer_label_claim: >-
      Remove the assertion that an F0 occurrence label is necessary on the
      admitted N>4L+1 stratum. Replace it with an injectivity lemma showing
      value-only recovery of c0 there, while preserving labels as necessary
      only for explicitly admitted collision strata.
    blind_statement: >-
      Freeze the actual alphabet D={-m,...,-1,1,...,m}, the definition of C,
      the x-to-z congruence, the public target-shift formula, ell and k, the
      exact MPZ source bound, and the required fixed-target versus correlated-
      target distinction before a fresh statement-only re-derivation.
    status: additive_successor_required
  boundaries:
    - The exact universal arbitrary-deck predicate and the jointly correct cross-target transcript are premises; no record constructs them.
    - The accepted fixed-target one-restriction interface does not imply the stronger correlated-target premise.
    - The result does not type-check for coordinate-aware P1553 target-local remainders or dyadic unit products.
    - Target-conditioned advice, opaque crossing handles, free predicates, extra oracles, separately randomized marginal success, and uncharged interactions are outside scope.
    - The strict N>4L+1 stratum is necessary for the stated linear threshold; wrapped/circular variants remain open.
    - No generic ECDLP lower bound, algorithm, attack, speedup, SOTA movement, B71 admission, closure, completion, or breakthrough follows.
  unresolved_confounds:
