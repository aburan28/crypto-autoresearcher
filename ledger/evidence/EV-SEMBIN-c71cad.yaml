    - >-
      OBSERVABLE NOT MEASURED. The declared observable is the Boolean-ring
      d'_ff ("definition #4"; EXP-SEMBIN-e76704 observable,
      H-SEMBIN-934774 statement). The code does not compute it. Every
      instrument builds m*f as {mm | m for mm in f}, so colliding monomials
      collapse instead of cancelling: src/ffd_semaev.py:95,
      src/recomb_search.py:31, src/fastfall.py:25. At (6,3), 270 of 320 rows
      differ from the true product. The fast kernel then XORs these OR-rows
      when it recombines, which is neither convention. At T1 the slow and
      fast instruments build different V_2 (dim 12 versus 13). At T3 the
      fast kernel reports new_falls(M, 2) = 4 on 5,376 matrices where the
      slow instrument and the true product give 0. The runner's T2 and T4
      counts are values of the OR-row artifact, not of the stated quantity.
      (VAL-20260929-sembine76704 DA-1, DA-2)
    - >-
      TRUE BOOLEAN PRODUCT (validator kernel, non-blind): T1 unchanged
      (d'_ff(I) = 2, d'_ff(M) = 3 at M = [1, 2, 4, 8, 26]); T2 upward
      1,355,520 of 9,999,360 (PRED 1,612,800), D_ff_max 3; T3 upward 0, with
      5,376 matrices at d'_ff 1; T4 null upward 4,824 of 20,160 (PRED 5,424),
      identity 2, max 3. Sources: recount_T2.json, recount_T3.json,
      recount_T4.json. So T1 and T3 would pass, and T2 and T4 would fail, if
      scored on the declared quantity by this kernel.
    - >-
      LABEL WRONG. "Definition #4" (2015/984 Definition 6, degrees reduced
      modulo S_fe), taken literally, gives d'_F = 1 for every presentation of
      these instances, because 1 is in the ideal. The (6,3) and (4,2)
      instances are unsatisfiable over F_2 (hps_def6.py; DA-8).
    - >-
      WHAT SURVIVES, AND WHERE. Under Nagao 2013/549 Definition 1 on the bare
      generators (no field equations), the witness M = [1, 2, 4, 8, 26] at
      (6,3) does separate: D_ff 2 -> 3. At D = 2 the top-degree kernel is
      0-dimensional (21 equations, 10 unknowns). Over GL_5(F_2), exactly
      1,612,800 matrices separate. That number equals PRED T2 for the
      Definition 1 count, NOT for the Boolean count. It equals
      5 * |GL_5(F_2)| / 31, the number of matrices whose generators include
      h4 = f1 + f3 + f4 = u0 + u2 + w0 + w2, the unique span element of
      degree <= 1; every upward M contains row 26. (DA-5, DA-6)
    - >-
      (a) D_ff(M) = 3 is reached only through a trivial (Koszul) syzygy,
      g0 = h4, g4 = h0 + 1 (DA-6).
    - >-
      (b) With the field equations u_j^2 + u_j included as generators (the
      {f} union S_fe form that 2013/549 uses for Weil descent),
      h4*h4 + sum_j (u_j^2 + u_j) = h4 is a fall at D = 2. So D_ff(M) = 2 and
      there is NO separation (DA-7).
    - >-
      (c) Under Definition 1, adjusted for trivial syzygies, the random null
      does NOT separate: D_ff(I) = D_ff(M) = 3 for all 20,160 matrices, T4
      upward = 0 (DA-9). The interpretation "generic, not descent-specific"
      recorded in EXP-SEMBIN-e76704 and H-SEMBIN-934774 is therefore
      REFUTED under Definition 1. Their claim that "degree-drop absorption is
      not supported" is contradicted: at (6,3), separation occurs exactly
      when the unique degree-<=1 span element h4 is itself a generator (DA-5).
    - >-
      (d) The (6,3) and (4,2) instances are unsatisfiable over F_2. The T3
      negative is structurally forced, because 1 is in the generator span at
      Semaev (4,2) (DA-8, DA-10), so T3 is not an informative negative
      control.
    - >-
      C1 IDENTITY CELLS. The validator reports that identity-presentation
      d'_ff is unchanged under the true product in all 10 C1 cells
      (def1_all_and_c1.py; console output not preserved as a file).
      Recombined presentations are affected. That includes the null
      (T4 upward 5,424 -> 4,824), whose identity value stays at 2 under both
      products.

  inference: >-
    RUN-SEMBIN-79996f is a valid, reproducible receipt of a computation on the
    OR-row artifact. It is not a measurement of the Boolean-ring first fall
    degree, and it cannot confirm or refute H-SEMBIN-934774 as stated. On
    the validator's non-blind computations, a narrower object survives: the
    (6,3) Semaev system separates under Nagao Definition 1 on the bare
    generators, through a trivial syzygy only, and the separation disappears
    once the field equations are generators. Bearing on KN-OPEN-7f0511 (A):
    the separation exists for Definition 1 without field equations only,
    through a Koszul syzygy, and vanishes in the field-equation form
    relevant to Weil descent. (A) is NOT resolved, in either direction.

