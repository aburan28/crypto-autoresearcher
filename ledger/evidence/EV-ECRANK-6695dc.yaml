  # ---------------- the adverse findings --------------------------------
  - >-
    ADVERSE, AND THE CENTRE OF THIS RECORD -- SEPARABILITY IS FALSE ON THE
    MEASURED DATA. Equal-maximum / different-total k = 3 sub-cosets are
    abundant. Within cert_deg32_multiplicity at max_single_class = 3 the total
    takes 10, 12, 14, 16 and 18; at max = 2 it takes 8, 10, 12, 14, 16. Within
    cert_deg16_multiplicity at max = 4 it takes 14, 16, 18, 20. Over all 651
    sum_mult-objective rows `others` = total - max spans 6 to 17 -- a spread of
    11 on a mean of 10.41. `others` is not independent of the max either: its
    conditional mean rises 9.4945 (n = 182) -> 10.6954 (n = 453) -> 13.0667
    (n = 15) as max goes 2 -> 3 -> 4. The additive form total = max + constant,
    which is what converts a base rank into a prediction about 31, is refuted by
    exhibited objects on the tested cosets. [de2fa2 joint 1 = breaks; 0de988
    recomputed the same contingency table exactly without concluding, its joint
    being a different one]
  - >-
    ADVERSE -- THE COSET RELATION IS A CONTROL THAT CANNOT FAIL. A label-shuffle
    null (200 trials, seed 20260904: permute the per-class certified values
    within each parent certificate, keep the sub-coset enumeration fixed) leaves
    the fit where it was. Pooled over all 12,431 rows: observed R^2 = 0.6682
    against a null median of 0.6691 (range 0.6679-0.6703); observed "required
    max single class" 17.874 against a null median 17.863 (17.849-17.878). ON
    THE n_classes ROWS THE SHUFFLED STATISTIC IS IDENTICAL IN 200 OF 200 TRIALS
    (R^2 = 0.9402, required 22.722). On the sum_mult rows the observed
    R^2 = 0.3146 is WORSE than the null median 0.3280 and lies inside the null
    band 0.3078-0.3458.
    THE CAUSE IS STRUCTURAL, NOT LUCK: the k = 3 sub-cosets of a k-dimensional
    coset form a 2-DESIGN -- every pair of classes lies in a constant number of
    sub-cosets (7 for deg16, 35 for both deg32 certificates, 155 for deg64,
    verified by pair co-occurrence count). A least-squares fit is a
    second-moment statistic, so on a 2-design it depends on the class values
    only through their multiset and their pairwise co-occurrence, both of which
    the design holds constant. RELATION 2 CANNOT DETECT COSET STRUCTURE EVEN IN
    PRINCIPLE; it is a restatement of the histogram of per-class ranks. The two
    figures 17.87 and 23.80 therefore contain no information about cosets and
    must never be quoted as "measured coset structure".
  - >-
    ADVERSE -- CONSEQUENTLY NO MEASURED "BASE RANK REQUIRED FOR 31 AT k = 3"
    EXISTS IN COMMITTED BYTES. What exists is FOUR IN-SAMPLE EXTRAPOLATIONS,
    every one of them labelled MODELED by the producer in both the prose and the
    JSON: base rank 11.72 (relation 1, R^2 = 0.023, 497 of 502 curves at one
    predictor value), base rank 7.86 (relation 1b), max single class 17.87
    (relation 2) and 23.80 (relation 2'). The two coset-derived ones fail the
    null above. The optimistic frontier value is an ORDER-STATISTIC ARTIFACT:
    relation 1b fits four points of sample size 1, 1, 497, 3, and a maximum is
    an increasing function of n -- bootstrapping the r0 = 3 group (20,000
    resamples) gives an expected max of 3 draws of 16.91, not 20; refitting at a
    common n = 3 gives required base rank 8.83 and on group means 11.83; a
    four-point jackknife gives 6.00 / 7.56 / 8.11 / 9.06, a 24 percent swing
    from the k3_mult of ONE curve. The choice of pool alone moves the headline
    by 7.6 units (restricted to the 651 sum_mult rows: 10.32 linear, 20.59
    additive), which is larger than the 6-unit disagreement the report itself
    flags as the honest width. NO HELD-OUT SET EXISTS ANYWHERE IN THE RECORD.
  - >-
    ADVERSE -- THE FITTED DATASET IS STRUCTURALLY UNLIKE THE POOL IT REASONS
    ABOUT. Every one of the 12,431 measured k = 3 totals is EVEN (odd totals
    observed: 0) and the extrapolation target 31 is ODD. The mechanism is exact:
    on each of the five parent cosets the parity of the per-class certified rank
    is an affine-linear functional of the class's F_2 coordinate vector over the
    support -- a brute-force solve found exactly 2^(7-k) solutions per
    certificate (16, 8, 4, 4, 2), i.e. a unique functional on each coset's own
    direction space -- and summing an affine functional over an 8-point affine
    subspace is always even. Against the label-shuffle null the signal is strong
    where it can be: on the two mixed-parity certificates the null produces
    about half odd totals (14.6 of 30 for deg16, 310.5 of 620 for deg32_mult)
    and the observed count is 0 in both.
    THIS IS NOT AN IMPOSSIBILITY RESULT ABOUT RANK 31 AND MUST NOT BE READ AS
    ONE. The committed 502-row scan contains 78 curves with ODD k3_mult (13, 15,
    17 and 19 all occur), so parity is not a universal obstruction; it is a
    property of the five certificate cosets. That is exactly the point: it
    upgrades the producer's own Limitation 4 from a caveat to a mechanism.
    The affine-parity reading is a HYPOTHESIS FOR THE RANKING, not evidence: the
    red team could not compute a single root number (no PARI) and says so.
  - >-
    ADVERSE -- PSEUDO-REPLICATION. The 12,431 "measurements" are combinatorial
    re-uses of 152 per-class certified values (8 + 16 + 32 + 32 + 64) over five
    parent cosets sitting on FOUR distinct base curves: cert_deg16_multiplicity's
    A = -22275, B = -232733250 is the quadratic twist by 5 of
    cert_deg32_multiplicity's A = -891, B = -1861866 (-22275 = -891*25,
    -232733250 = -1861866*125). The producer's Limitation 4 correctly says the
    rows are not a sample of the pool; it does not say they are not independent
    OF EACH OTHER, which is the part that invalidates the fit statistics rather
    than merely their external validity. 9,145 of the 12,431 rows are the single
    repeated point (max, total) = (1, 8), and 11,780 occupy only three distinct
    points.
  - >-
    ADVERSE -- THE CERTIFICATE-KIND AXIS IS ABSENT FROM EVERY RANK TOTAL THIS
    BATCH REPORTS, AND THE EXACT CEILING IS SATURATED EVERYWHERE. k3_cls = 8 for
    ALL 502 curves of the committed scan, so at k = 3 the eigenspace argument
    certifies at most 8 and does so everywhere. Hence 8 of the fixture's 20 are
    exact-certificate units and 12 are height-regulator units, and a
    hypothetical degree-8 total of 31 or 32 would be 8 exact plus 23 or 24
