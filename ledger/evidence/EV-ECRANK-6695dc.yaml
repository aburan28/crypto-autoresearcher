    beats degree 32" would trade a 100-percent exact certificate for a
    25-percent exact one. H-ECRANK-f2a2f7's method_ceiling says exactly this;
    the batch's tables do not carry it. The guardrail was NOT VIOLATED here --
    no degree-8 result at 31 was produced and neither producer claims an
    improvement -- but it is UNMAINTAINED, which is how the violation would
    enter the next record rather than this one. [de2fa2 joint 2 = holds]
  - >-
    ADVERSE, AND INFRASTRUCTURE ONLY -- P2 IS UNTESTED BY THIS BATCH IN EITHER
    DIRECTION. review_plan item (b) puts "the k = 3 and k = 4 twist-family
    optima on the AUGMENTED pool" under review and NO SUCH MEASUREMENT EXISTS:
    no task in BATCH-e0caa5 was commissioned to scan a7a9e8's constructed curves
    and none did; the two producers exchanged no artifact. RUN-a7a9e8-008
    measured 31 of 31 ellrank calls hitting a 25 s alarm on exactly the
    rank >= 12 base curves (a4 ~ 1e19, a6 ~ 1e28), and twisting by d up to 30030
    scales those to a4*d^2 ~ 1e28 and a6*d^3 ~ 1e41, so the 128 descents per
    curve the twist scan needs are strictly harder than the ones already
    measured to time out. THAT IS A MEASURED OBSTACLE TO DOING IT WITH THIS
