  inference: >-
    SCOPED TO THE COMMITTED BYTES OF BATCH-e0caa5 AT 2938068a3, TO THE 1206-CURVE
    MESTRE POOL, THE 502-ROW / 501-DISTINCT-CURVE SMALL-COEFFICIENT SCAN, THE
    FIVE COMMITTED CERTIFICATES ON FOUR DISTINCT BASE CURVES, THE SUPPORT
    [-1, 2, 3, 5, 7, 11, 13], AND THE 1218 s / 24 s PRODUCER BUDGETS:
    (1) The Mestre route delivers what the twist route could not: certified rank
    13 over Q from exhibited points, against a measured twist ceiling of 4.
    P1 is supported at full strength, and the construction saturates its own
    function-theoretic ceilings (7 and 9) exactly, with everything above 9 coming
    from an extra-point scan over |n| <= 400, d <= 12 that was never widened.
    (2) The mechanism by which that base rank was to be converted into a
    statement about 31 at k = 3 IS BROKEN. Additive separability is refuted by
    exhibited counterexamples; the relation that carried the two coset-derived
    "required" figures is invariant under randomising its own input and is
    provably blind to coset structure because the enumeration is a 2-design; the
    optimistic frontier figure is a sample-size artifact; and the fitted dataset
    can only take even values while the target is odd. So the campaign does not
    hold a MEASURED base rank that 31 at k = 3 would require -- it holds four
    mutually inconsistent in-sample extrapolations, two of which fail their null.
    (3) NOTHING HERE SUPPORTS A CLOSURE IN EITHER DIRECTION. Not a positive one:
    no k = 3 total above 20 was produced anywhere, and 20's maximality is
    unverified. Not a negative one: "Mestre reached 13 and k = 3 gave 20, so
    degree 8 is out of reach" would be a fatigue report about a 1218-second and a
    24-second budget that additionally converts an absent tool into evidence.
    P2 and P3 are UNTESTED, and the instrument that would test them (PARI
    ellrank at these coefficient sizes) is measured to be the wrong instrument
    rather than measured to give an answer.
    (4) The single most decision-relevant thing this batch produced is not a
    number about cosets. It is that the campaign's own C1 says "degree <= 8",
    degree 1 qualifies, and an external record of a curve over Q of rank >= 31
    is reported to exist, dated after this batch's task dates -- which, if this
    program's own verifier accepts its points, would make the committed
    statement "rank >= 31 over Q is open" out of date and would change what
    GOAL-ECRANK-002 is still asking.

