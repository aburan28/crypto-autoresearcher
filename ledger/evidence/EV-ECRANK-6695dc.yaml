    scope: >-
      The 12,431 k = 3 sub-cosets of the five committed certificates of
      EXP-ECRANK-e1e30e, on four distinct base curves ([0,-1,1,8,-50];
      [1,-1,1,-1,-40] twice at coset representatives 5 and 1; [1,-1,1,0,0];
