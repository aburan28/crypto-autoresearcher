    resource_check:
      examined: true
      reading: >-
        THE REVERSAL IS REAL AND IS THE MOST PRODUCTIVE THING IN THIS RECORD.
        Read as a refutation, the spread kills the ceiling calculation. Read as a
        HYPOTHESIS, it says the other seven classes are NOT a fixed tax that a
        large base rank must pay -- they vary by 11 units at fixed maximum, so
        there is engineerable headroom in them. That relocates the productive
        object: not a higher base rank at all, but a curve whose SEVERAL TWISTS
        simultaneously carry forced points. Mestre's construction forces
        s(a_i) to be a square; the same machinery can as easily force
        s(a_i) = d * square for a chosen d, putting prescribed points on E^(d)
        rather than on E, so a construction prescribing points across four or
        five classes of one k = 3 coset attacks the 8-class total directly
        instead of paying for it through one class. It is also the only route in
        view NOT blocked by the descent-infeasibility obstacle, because it
        produces the twist points BY CONSTRUCTION rather than by descent.
