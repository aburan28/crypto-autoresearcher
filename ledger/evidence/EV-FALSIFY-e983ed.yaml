evidence:
  id: EV-FALSIFY-e983ed
  hypothesis_id: H-FALSIFY-40538b
  question_id: RQ-FALSIFY-a2c501
  experiment_ids: [EXP-FALSIFY-d770c1]
  run_ids: [RUN-FALSIFY-d770c1-004]
  finding_under_test: KN-FIND-ac28ed
  type: analytical
  direction: supports
  direction_note: >-
    Supports the finding under test, and correspondingly contradicts the
    hypothesis that filed this experiment. KN-FIND-ac28ed is the first corpus
    record checked under RQ-FALSIFY-a2c501 that is exactly right in every
    particular.
  strength: strong
  claim_tier: theory
  proof_status: certificate
  proof_status_basis: >-
    The check is a closed-form exact-rational recomputation of a finite table.
    Every one of the 18 cells is decided, not sampled, so the artifact is a
    verification certificate for the finding's arithmetic rather than a
    measurement of it.
  proof_refs:
    - experiments/EXP-FALSIFY-d770c1/runs/RUN-FALSIFY-d770c1-004/raw-result.json
    - experiments/EXP-FALSIFY-d770c1/runs/RUN-FALSIFY-d770c1-004/manifest.yaml
    - experiments/EXP-FALSIFY-d770c1/runs/RUN-FALSIFY-d770c1-004/stdout.log
    - experiments/EXP-FALSIFY-d770c1/falsify/run_kstar.py
  recorded_at: '2026-08-08'

  observations:
    - id: O-1
      text: >-
        KN-FIND-ac28ed (confidence: proved, evidence_level: theorem) asserts that
        the as-committed BATCH-121 K* tables contain exactly two errors, both
        IEEE float ceil artifacts: K*(standard) 2001 -> 2000 and the m=4 cell
        126 -> 125, with K*(BKK) = 96 correct as committed. Being a correction
        record, its dangerous failure mode is not a wrong correction but an
        INCOMPLETE audit -- a third bad cell nobody caught.
    - id: O-2
      text: >-
        All 18 cells were recomputed in exact rational arithmetic from
        K*(std) = ceil(s/(1-t)) and K*(BKK) = ceil(s*beta/(1-t*beta)) with
        beta = 2/(m+1), over m in {3,4,5}, s in {50,100,200}, t in
        {0.3,0.5,0.7,0.9}. Three cells disagree with the committed tables, and
        they collapse to exactly TWO distinct corrections -- K*(std) is
        independent of m, so its single error appears once per table. Those two
        are precisely the two the finding names. There is no third.
    - id: O-3
      text: >-
        The stated CAUSE was tested rather than accepted. Recomputing every cell
        a second time in IEEE double arithmetic reproduces the as-committed value
        at every disagreement: float yields 2001 and 126 exactly as committed,
        while exact rationals yield 2000 and 125.
    - id: O-4
      text: >-
        A representability control sharpens this. t = 0.5 is exactly
        representable in binary and t = 0.9 is not. Every disagreement occurs at
        t = 0.9, and all three t = 0.5 cells -- 134, 100, 80 -- were committed
        correctly despite also being exact integers where a naive ceil could have
        slipped. The error lands exactly where the stated mechanism predicts and
        nowhere else.
    - id: O-5
      text: >-
        K*(BKK) = 96 at m=5, s=200, t=0.9 is confirmed: exact value 2000/21 =
        95.238..., ceiling 96, matching both the committed table and the
        finding's confirmation.
    - id: O-6
      text: >-
        ONE DEFECT FOUND, TRACEABILITY, MINOR. KN-FIND-ac28ed attributes "the BKK
        K* formulas and rescue region t in [1,(m+1)/2)" to KN-FIND-c7d31e. That
        record contains ZERO occurrences of "K*". The formulas are in
        coordination/goals/GOAL-ECDLP-001/batches/BATCH-121/tasks/
        TASK-20260805-005/closure_and_multi_target.md, sections B.2 and B.3.
        Following the citation as written does not reach the formula; a
        repository-wide search was needed to reproduce a confidence: proved
        record. The arithmetic is unaffected.

  interpretation: >-
    KN-FIND-ac28ed verifies completely. Its corrections are right, its audit is
    complete, its confirmation of the 96 cell is right, and its causal
    explanation is confirmed by direct reproduction. It is a well-made correction
    record and the falsification program found nothing wrong with its substance.

  what_this_does_not_establish: >-
    This certifies the ARITHMETIC of the K* tables and nothing else. It does not
    validate the cost model those tables express. In particular B.3 assumes the
    BKK factor beta transfers identically to the relation-collection channel and
    the per-target descent channel, which is a modelling assumption rather than a
    consequence of KN-FIND-c7d31e's theorem. KN-FIND-ac28ed itself flags this and
    downgrades the "provable" label on the transfer, and KN-FIND-93d1aa reports
    the descent-channel rescue as empirically falsified at its one live window
    cell. Nothing here disturbs or supports either of those; a correct
    computation of a model's numbers is not evidence for the model.

  dominated_by: not_applicable_methodological
  sota_delta:
    time_exponent: not_applicable
    note: >-
      No algorithmic claim. Confirms a corpus correction record and reports one
      citation defect.

  proposed_correction: >-
    Only the traceability defect in O-6 warrants any action: a superseding record
    pointing the K*-formula citation at BATCH-121 TASK-20260805-005 B.2/B.3
    rather than at KN-FIND-c7d31e. No arithmetic changes. New record, never an
    edit (AGENTS.md rule 4). Coordinator authority, and low priority.

  knowledge_promotion: not_warranted
  knowledge_promotion_reason: >-
    A confirmation adds no new mathematical content, and promoting "we checked
    this and it held" into the corpus would inflate a verification into a result.
    The traceability defect is a filing matter, not knowledge. Recorded here so
    the next reader knows the tables have been independently recomputed and where
    the formulas actually live.

  scope_limits: >-
    The 18 cells of BATCH-121 section B.4 as committed, at m in {3,4,5},
    s in {50,100,200}, t in {0.3,0.5,0.7,0.9}. Exact rational arithmetic. No
    other table, formula, or claim is covered.

  independent_review_required: false
  independent_review_note: >-
    This record contradicts nothing and asserts no new claim; it certifies a
    finite computation whose inputs, formulas and outputs are all archived, and
    the certificate is re-runnable in seconds by anyone. AGENTS.md rule 12 is not
    engaged.

  authority_note: >-
    Evidence only. No hypothesis status changed, no finding edited or
    superseded; only the Coordinator may do that (AGENTS.md rule 1).
