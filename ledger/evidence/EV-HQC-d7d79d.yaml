  observations:
  - 'THE PRIOR BATCH''S "GLOBAL INJECTION CHEAPER THAN BASELINE" HEADLINE DOES NOT SURVIVE, THOUGH THE
    UNDERLYING STRUCTURAL CONCLUSION DOES. TASK-20260806-66e3c3 found the dilution formula''s
    i.i.d.-blocks approximation deviates from the campaign''s own committed data POSITIVELY at every
    tested k (2 through 35) and GROWS MONOTONICALLY -- +0.42 percent at k=2, +7.63 percent at k=17 on the
    large T=1e7 baseline, up to +660 percent at k=35 (5 supporting trials only). A smaller T=10,000
    dataset gave +13.39 percent at k=17, the source of the prior batch''s single-number 13.4 percent
    finding.'
  - 'THE VALIDATOR RESOLVED THE DATASET DISAGREEMENT WITH A METHOD NEITHER PRIOR REVIEWER HAD USED: a
    parametric bootstrap (20,000 resamples of T=10,000 drawn from the large dataset''s own empirical
    distribution) places the small dataset''s observed values at the 65th-78th percentile of the
    resulting distribution -- ordinary T=10,000 sampling noise, not a methodological difference between
    the two datasets. The Validator additionally found the ratio estimator itself carries a growing
    upward finite-sample bias, meaning even the large dataset''s high-k figures are increasingly biased,
    not merely noisier -- a confound orthogonal to the sampling-noise question.'
  - 'THE RED TEAM PROPAGATED EACH DATASET''S BRACKET-TERM ESTIMATE THROUGH THE ALREADY-VALIDATED DILUTION
    FORMULA AND OBTAINED TWO DIFFERENT ABSOLUTE FIGURES FOR THE GLOBAL-INJECTION REQUIRED T: 1.380e5
    (small dataset, cheaper than the specification''s undefected T_req of 3.09e5) versus 4.257e5 (large,
    more reliable dataset, MORE EXPENSIVE than the undefected T_req). The breakeven deviation (8.95
    percent) sits inside the disclosed 7.63-13.39 percent uncertainty band, closer to the more reliable
    figure -- directly reversing the prior batch''s "cheaper than baseline" claim as an absolute figure.'
  - 'THE VALIDATOR THEN ESTABLISHED, ALGEBRAICALLY, WHICH PART OF THE PRIOR CONCLUSION IS ROBUST AND
    WHICH IS NOT: Delta(log2_A_k)_global = n_e * Delta(log2_A_k)_single, using the IDENTICAL bracket(k)
    term both Check 1 and the Red Team''s propagation measure -- differing only by the pure dilution-
    geometry prefactor (k/n_e for single-block, k for global). Any correction to the shared
    i.i.d.-approximation term moves the required-T for BOTH injection shapes together, and the ratio
    between them (exactly n_e-squared = 3136) survives exactly regardless of which bracket-term estimate
    is used. THE RELATIVE CONCLUSION -- global injection is roughly 3,000x more cost-effective than
    single-block injection -- IS ROBUST. THE ABSOLUTE FIGURE FOR GLOBAL INJECTION IS NOT: it could be
    cheaper or more expensive than the undefected baseline T_req, depending on which bracket-term
    estimate the true value is closer to.'
  - 'THE VALIDATOR ADDED A HEURISTIC, UNRESOLVED SIGN ARGUMENT: the Red Team''s implicit assumption that
    the true bracket-term value is closer to the larger (more pessimistic) dataset''s figure presumes
    positive block-clustering, which conflicts with this campaign''s own established finding
    (EV-HQC-b71230) that HQC''s real block failures are ANTI-correlated, not positively clustered. Applying
    that same sign, ~1.38e5 may lean toward an UNDERESTIMATE-of-cost direction (i.e. closer to correct)
    rather than an overestimate -- offered as a candidate heuristic, explicitly not a resolution.'
  - 'THE RED TEAM ALSO CAUGHT A SCOPE-NARROWING DEFECT IN THIS BATCH''S OWN EXECUTION: "Check 2" as run
    validated the Delta_p-scaling arithmetic (a bug/implementation check, confirmed machine-precision
    clean) rather than the SE(T) proportional to 1/sqrt(T) extrapolation check the prior batch''s Red
    Team report actually specified. That specific check remains outstanding.'
  inference: 'Two consecutive layers of review have now converged on the same structural picture: the
    block-dilution formula is mathematically correct and its implementation is bug-free (confirmed to
    machine precision), but the input it depends on -- the i.i.d.-blocks approximation''s deviation from
    reality -- is itself imprecisely known, growing with k, and drawn from data whose disagreement across
    sample sizes is explainable but whose absolute value at any given k carries real uncertainty. This
    campaign now has strong grounds (the exact n_e-squared ratio, algebraically independent of the
    disputed bracket term) to prefer a global injection over a single-block one. It does NOT yet have
    grounds to claim the global injection is cheaper than the undefected baseline -- that claim depends on
    resolving a bracket-term estimate that currently spans a 3x range straddling the baseline itself.'
  boundaries:
  - Toy. Two reliability checks and their independent review; no new experiment was run at any injection
    point, single-block or global. No statement about A17, HQC''s decoding-failure rate, or any
    standardized parameter set.
  - This evidence record does not reopen, revise, or supersede EV-HQC-b71230, EV-HQC-db1fd9,
    EV-HQC-9a30d3, EV-HQC-163374, EV-HQC-bfb257, EV-HQC-67a6ec, or EV-HQC-036d4b, all of which stand
    exactly as archived. It corrects EV-HQC-036d4b's "cheaper than baseline" framing without editing that
    record, per this program's supersession-not-overwrite discipline.
  - "The absolute required-T for a global injection remains a projection in a 1.38e5-4.26e5 range, not a
    measurement. No global-injection pipeline has ever been run in this campaign, at any scale."
  - The outstanding SE(T) proportional to 1/sqrt(T) extrapolation check, named by the prior batch's Red
    Team and not actually executed by this batch's "Check 2," remains unrun.
  - H-HQC-18d1b4 is untouched by this record in either direction; it remains PROPOSED.
  unresolved_confounds:
  - 'THE ABSOLUTE REQUIRED-T FOR GLOBAL INJECTION IS UNRESOLVED, spanning a range that straddles the
    undefected baseline T_req. Resolving it precisely would require either running the still-outstanding
    SE-extrapolation check, or -- more directly -- actually running a global-injection pilot and measuring
    the bracket term under real injected-defect conditions rather than continuing to extrapolate from two
    disagreeing undefected-baseline datasets.'
  - The ratio estimator''s growing finite-sample bias (Validator finding) is itself unquantified beyond
    "present and growing"; its exact magnitude at k=17 is not derived here.
  - The Validator''s anti-correlation-sign heuristic argument for why 1.38e5 might be closer to correct is
    explicitly a heuristic, not a derivation; it has not been checked against the formula''s actual
    sign-dependence structure.
  reviewed_by: coordinator
