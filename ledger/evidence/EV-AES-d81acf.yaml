evidence:
  id: EV-AES-d81acf
  hypothesis_id: null
  hypothesis_id_note: >-
    DELIBERATELY NULL. This record recomputes an existing descriptive
    percentile over a fuller data set; RQ-AES-003 carries no hypothesis about
    the r=5 yoyo excess or its S-box-specificity, and naming one here would
    manufacture a binding this record does not have. Admitted under the
    documented-null allowance recorded in CORR-20260802-009, the same pattern
    used by EV-AES-837cd8.
  experiment_ids: []
  run_ids: []
  task_ids:
    - TASK-20260805-258754
    - TASK-20260805-c7e43d
    - TASK-20260805-9c54e4
  type: measurement
  direction: inconclusive
  strength: weak
  strength_basis: >-
    WEAK, AND FOR A STATED REASON RATHER THAN A HEDGE. RC-C recomputed
    OBS-B8-7's S-box-specificity percentile using all five already-available
    AES r=5/amask=1/smask=1 data points (14, 14, 8, ~13.5 (a rate, kept
    separate from the raw counts), 12) against the 27-arm random-S-box
    reference distribution (mean 15.481481481481481, range 6-25), instead of
    the original two (12, 14). The independent validator (TASK-20260805-9c54e4,
    verdict passed_with_caveats) went beyond scope and reconstructed the
    27-arm reference distribution itself from the raw BATCH-006 arm files
    rather than trusting either OBS-B8-7's or the producer's stated
    mean/range, and independently reproduced all four raw-count Poisson
    tail probabilities via a different code path (scipy.stats.poisson). Both
    producer and validator conclude the five points sit interior to the
    random-S-box range at approximate percentiles of roughly 32nd (D-AES-K1),
    32nd (D-AES-K2), 1st (D-AES-K3), ~27th-37th depending on interpolation
    (Y-AES-main's rate-derived 13.5), and 15.5th (B0-AES-REF), none near
    either tail, and OBS-B8-7's qualitative conclusion ("the r=5 excess is
    not AES-S-box-specific") survives. STRENGTH IS CAPPED AT WEAK BECAUSE THE
    VALIDATOR'S OWN RULING (five_vs_two_points_ruling) is explicit that this
    is MODEST corroboration, not a dramatic strengthening: D-AES-K1, D-AES-K2
    and D-AES-K3 are three measurements of the SAME S-box (AES) under three
    different keys, not three independent draws from the 27-arm
    random-S-box reference population. They sharpen the estimate of AES's
    own rate (and BATCH-005's own preregistered T2 key-main-effect test,
    independently re-verified here at p=0.24734580566758235, already found
    no detectable key-to-key rate variation among them) but do NOT increase
    the effective sample size against the comparison population of 27
    distinct random S-boxes each measured once. No pooled or combined
    statistical test of the five AES points as a group was run by either the
    producer or the validator; only per-arm, unpooled percentiles are
    reported, per this task's own scope constraint.
    TWO MINOR DEFECTS FOUND BY THE VALIDATOR, NEITHER CHANGING THE
    SUBSTANTIVE CONCLUSION. (a) The producer's RESULTS.json incorrectly
    claimed the five key_hex fields are 33-character strings, "one character
    longer than a standard 32-hex-digit AES-128 key representation"; the
    validator measured len() on every key_hex string read directly from the
    five source JSON files and found all five are exactly 32 characters, the
    standard length. This does not affect the distinctness conclusion (a
    plain string-inequality check is unaffected by a wrong length
    observation) and is recorded as a factual inaccuracy, not fabrication.
    (b) A genuine arithmetic/logic bug in the producer's analyze.py: the
    CDF-from-below interpolation used for the descriptive-only 13.5-rate
    figure is internally inconsistent with the correctly-computed
    survival-side interpolation for the same point -- it reports a
    36.3rd-percentile figure that does not complement the correctly-computed
    72.57% survival figure (72.57% + 36.3% = 108.9%, not ~100%); the
    internally-consistent complement is 1 - 0.725689 = 27.43%. This defect is
    confined entirely to a value both the producer and this record label
    DESCRIPTIVE ONLY and explicitly caveat as not a probability statement
    about an observed integer draw; it does NOT affect any of the four
    raw-count Poisson percentiles (independently reproduced by the validator
    to full double precision via scipy.stats.poisson, a different code path
    from analyze.py's hand-rolled log-space PMF), does not affect the
    descriptive five-point mean (12.3), and does not change the qualitative
    conclusion, which reads "unremarkable, below median" under any of the
    candidate figures (27.4%, 36.3%, or 36.8%).
    Every party resolves to one model under standing basis
    0137a051eb5828789eb267fa83c8278086578d4c, so NOTHING HERE COUNTS TOWARD A
    CLOSURE QUORUM.
  claim_tier: toy
  claim_tier_basis: >-
    Recomputation over already-committed toy-tier reduced-round (r=5)
    AES-shaped SPN measurements, one probe geometry (amask=1, smask=1),
    2^30-2^31 trials per arm, five distinct derived keys/streams, one
    machine. No new measurement arm was launched by this task; it recomputed
    statistics over data already on disk. No crypto-scale, medium-scale,
    affected-scheme or asymptotic claim is made or implied, and no
    comparison to published cryptanalysis is made in either direction
    (RQ-AES-003 R3).
  certificate_refs: []
  proof_status: empirical_only
  proof_refs: []

  observations:
    - id: OBS-B13-1
      statement: >-
        ALL FIVE AES r=5 DATA POINTS SIT INTERIOR TO THE 27-ARM
        RANDOM-S-BOX REFERENCE DISTRIBUTION, NONE NEAR EITHER TAIL. The
        27-arm reference distribution (rounds=5, sbox_spec startswith
        "rand", amask=1, smask=1) has mean 15.481481481481481 and range
        6-25, independently reconstructed from the raw BATCH-006 arm files
        by the validator (27 arms found, matching the count both OBS-B8-7
        and the producer cite) rather than trusted from either's stated
        figures. Per-arm right-tail probabilities against Poisson(15.48),
        independently reproduced by producer (analyze.py, log-space PMF) and
        validator (scipy.stats.poisson) to full double precision: D-AES-K1
        (W_ge1=14) P(X>=14)=0.6811403904651809 (~32nd percentile from
        below); D-AES-K2 (W_ge1=14) P(X>=14)=0.6811403904651809 (~32nd
        percentile); D-AES-K3 (W_ge1=8) P(X>=8)=0.98638462537402 (~1.4th
        percentile, the lowest of the five, still 2 units inside the
        observed minimum of 6); B0-AES-REF (W_ge1=12) P(X>=12)=0.845060624282609
        (~15.5th percentile). Y-AES-main's W_ge1_nontrivial=27 at 2^31 trials
        scaled to a 2^30-equivalent rate of 13.5 is positioned descriptively,
        NOT fed into a Poisson tail lookup as though it were a discrete
        observation, via linear survival-function interpolation between k=13
        and k=14 (SF=0.725689, ~27.4th percentile as the internally
        consistent complement; see D-B13-2 defect below for the flawed
        alternate figure of ~36.3rd).
      status: >-
        CONFIRMED independently by producer (TASK-20260805-258754) and
        validator (TASK-20260805-9c54e4), the latter via a different code
        path (scipy.stats.poisson) and an independently reconstructed
        reference distribution.
    - id: OBS-B13-2
      statement: >-
        THE FIVE-POINT ADDITION MODESTLY CORROBORATES OBS-B8-7's QUALITATIVE
        READING BUT DOES NOT DRAMATICALLY STRENGTHEN IT, BECAUSE THREE OF THE
        FIVE POINTS ARE NOT INDEPENDENT DRAWS AGAINST THE COMPARISON
        POPULATION. D-AES-K1, D-AES-K2 and D-AES-K3 are three measurements of
        the SAME S-box (AES) under three different keys, not three
        independent draws from the 27-arm random-S-box reference population
        (each of whose 27 arms is a distinct random S-box measured once).
        BATCH-005's own preregistered key-main-effect test (T2, G-statistic)
        already found no detectable key-to-key rate variation among these
        exact three arms (p=0.24734580566758235, independently re-verified
        character-for-character in this task's source data by both producer
        and validator, matching EV-AES-1d5136 OBS-B10-5's citation exactly).
        The three points therefore sharpen the estimate of AES's own rate
        under this geometry but do NOT increase the effective sample size
        against the 27-arm comparison population. The new low reading
        (D-AES-K3=8) additionally pulls the AES sample mean DOWN (five-point
        descriptive mean 12.3, versus the random-S-box distribution's mean
        15.48) -- the opposite direction an S-box-specificity claim would
        need. No pooled or combined statistical test of the five AES points
        as a group against the 27-arm distribution was run; both producer and
        validator are explicit this is out of scope, per the task's own
        constraint against averaging raw counts before computing a
        percentile.
      status: >-
        CONFIRMED, as the validator's own explicit ruling
        (five_vs_two_points_ruling), independently checked against BATCH-005's
        raw T2/T3 test output by both producer and validator.

  defects_carried:
    - id: D-B13-1
      statement: >-
        The producer's RESULTS.json incorrectly stated the five key_hex
        fields are 33-character strings, one character longer than the
        standard 32-hex-digit AES-128 key representation. The validator
        measured len() directly on each key_hex string read from the five
        source JSON files and found all five are exactly 32 characters. Does
        not affect the pairwise-distinctness conclusion (a plain
        string-inequality comparison is unaffected by a wrong length
        observation). Recorded as an incorrect factual claim, not
        fabrication under AGENTS.md rule 9 -- most likely a miscounted
        transcription -- and must not be repeated uncorrected in any
        downstream synthesis.
    - id: D-B13-2
      statement: >-
        A genuine internal-consistency bug in the producer's analyze.py: the
        CDF-from-below linear interpolation used to position Y-AES-main's
        descriptive-only 13.5 rate does not bracket 13.5 between CDF(13) and
        CDF(14) as the complementary survival-side interpolation does;
        instead it extrapolates from the [12,13] bracket using a fraction of
        1.5, giving a reported figure of 36.3% (or 36.8% using the correct
        [13,14] bracket) that fails to complement the correctly-computed
        survival figure of 72.57% (sum 108.9% or 109.4% instead of ~100%).
        The internally consistent complement is 1 - 0.725689 = 27.43%. This
        defect is confined entirely to a value both the producer and this
        record explicitly and repeatedly label DESCRIPTIVE ONLY and state
        must not be treated as a probability statement about an observed
        integer count. It does NOT affect any of the four raw-count Poisson
        percentiles (exact, independently reproduced via a separate code
        path), the descriptive five-point mean (12.3, computed
        arithmetically from the raw 13.5 rate, not from its percentile
        position), or the report's own qualitative narrative, which cites
        the already-consistent survival-based figure rather than the flawed
        CDF-from-below one.

  boundaries:
    - >-
      This record establishes that OBS-B8-7's qualitative conclusion (the
      r=5 excess is not AES-S-box-specific, judged by all five available AES
      readings falling in the interior, not the tails, of the campaign's
      own 27-arm random-S-box distribution) survives under the fuller
      five-point evidence base, as a per-arm descriptive finding. It does
      NOT establish a formal pooled statistical test result, does NOT
      establish whether BATCH-009's cipher-substitution finding holds or
      fails on an independent instrument (that question remains open, see
      unresolved_confounds), and does NOT establish anything about
      full-round or deployed AES or about published cryptanalysis in either
      direction.
    - >-
      Session and implementation independence only. NO MODEL INDEPENDENCE
      under standing basis 0137a051eb5828789eb267fa83c8278086578d4c; nothing
      here counts toward a closure quorum.
    - >-
      "Five points" does not mean "five independent samples" against the
      comparison population; three of the five are repeated measurements of
      the same cipher under different keys, and this record's strength
      rating is capped accordingly.

  unresolved_confounds:
    - >-
      RC-D (a second, differently-constructed null object -- a keyed PRP
      that is not an oracle, e.g. a wide-block Feistel with a fixed non-AES
      round function -- to test whether BATCH-009's OUTCOME-A depends on
      IDEALNESS specifically or on structurelessness more broadly, residual
      limitation U4) remains unrun.
    - >-
      The cipher-substitution mechanism (BATCH-009's central claim) still
      has no independent-instrument corroboration in either direction at any
      exposure reached so far (EV-AES-837cd8 unresolved_confounds, carried
      forward unchanged by this record).
    - >-
      This batch's own finding that "5 points" does not equal "5 independent
      samples" against the 27-arm comparison population: D-AES-K1, D-AES-K2
      and D-AES-K3 are the same S-box under different keys, so the effective
      independent AES sample size against the random-S-box population
      remains closer to three (Y-AES-main, the pooled D-AES set, B0-AES-REF)
      than to five, and no formal accounting for this has been run.
    - >-
      No pooled/combined statistical test of the five AES points as a group
      against the 27-arm distribution has been performed by either the
      producer or the validator.

  reviewed_by:
    - >-
      TASK-20260805-9c54e4 (independent validator; verdict
      passed_with_caveats, treated as `passed` under this task's explicit
      instruction with its two caveats carried forward verbatim; went beyond
      the task's own scope by independently reconstructing the 27-arm
      reference distribution from raw source files rather than trusting
      either OBS-B8-7's or the producer's stated mean/range; independently
      reproduced all four raw-count Poisson tail probabilities via a
      different code path, scipy.stats.poisson; found the two defects
      recorded above; confirmed the producer's key-distinctness conclusion
      while correcting its stated key_hex length).
  reviewed_at: 2026-08-05
  red_team_reviewed: false
  red_team_note: >-
    NO RED TEAM REVIEWED THIS BATCH. Recorded plainly, consistent with prior
    disclosure in this campaign.

