evidence:
  id: EV-ECDLP-97cb57
  hypothesis_id: H-ECDLP-60de36
  experiment_ids: [EXP-ECDLP-20a588]
  run_ids: [RUN-ECDLP-20a588-01, RUN-ECDLP-20a588-03]
  validation_ids: [VAL-20261019-e750db]
  related_evidence: [EV-ECDLP-6bdff6, EV-ECDLP-7e970a]
  type: empirical
  direction: contradicts
  strength: replicated
  strength_basis: >-
    Two solver families (msolve 0.6.5 F4, Singular std) on the same m = 3
    instances as the earlier experiments, same direction in both; validated
    (VAL-20261019-e750db, passed) with the validator's own recomputation equal
    to the producer's and a re-run whose 144 deterministic fields match.
  claim_tier: toy
  proof_status: empirical_only
  proof_refs: []
  observations:
    - id: O-1
      text: >-
        With the chain variables eliminated first (msolve -e, Singular block
        order), the chain arm is still slower than the dense same-set arm in
        every jointly completed cell: msolve paired median ratios 1.34, 1.86,
        2.27, 1.94 at L = 3..6 (95% bootstrap intervals 1.11-1.58, 1.82-2.04,
        2.18-2.35, 1.78-1.99; all above 1); Singular 1.61 and 1.42 at L = 3, 4.
    - id: O-2
      text: >-
        Plain DRL over the block order for the chain arm: 4.6x at L = 3 and
        16.2x at L = 4 (dynamic-range control passes). The block order removes
        the growing penalty and leaves a roughly constant factor of about 2 for
        L = 3..6.
    - id: O-3
      text: >-
        The eliminated chain basis equals the dense basis on 24 of 24 instances
        where both msolve bases finished (17 non-trivial, 7 unit ideals):
        the extra cost is the chain rows and the path, not a different problem.
    - id: O-4
      text: >-
        Retirement: both msolve arms time out on all six instances at L = 7
        (right-censored at 600 s: a tie that says nothing about relative cost
        there); the Singular chain arm is retired at L = 5, the dense arm at
        L = 6.
    - id: O-5
      text: >-
        Exploratory, not preregistered: msolve max F4 degree is 2^L + 8 on every
        dense instance; on the block-order chain arm 14, 32, 65, 133 for
        instances with a solution (about 2^(L+1) for L >= 4) and near the dense
        value on no-solution instances (7 of 8 of which have the unit ideal as
        basis). A lead, not a result.
    - id: O-6
      text: >-
        Positive control 60/60 planted ok results contain the planted point
        (A_elim 16, B 16, A_drl 8, A_block 8, B_sg 12 on non-excluded cells).
  frozen_criteria_outcome: >-
    success not met for both pairs; falsification met: msolve by the >= 80%
    clause (4/4 cells A >= B; retirement tie at L = 7), Singular by both clauses
    (2/2 cells A >= B; A retired at L = 5 < 6).
  scope_limits:
    - toy scale: m = 3, primes 10-22 bits, n = 6 per cell
    - one block-order configuration per solver; weighted or interleaved orders untested
    - L = 7 solves are right-censored; the ratio's trend beyond L = 6 is unmeasured; memory grows 17-19x per L (validator probe)
    - no 17- or 18-bit prime was used (msolve crash range, CORR-20261019-e6f65b)
  dominated_by: Pollard rho at exponent 1/2 (and, at these sizes, plain enumeration)
