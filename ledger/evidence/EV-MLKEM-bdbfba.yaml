  goal_id: GOAL-MLKEM-004
  batch_id: BATCH-1be68e
  batch_number: 5
  producer_task: TASK-20260804-cbf6e2
  snapshot_commit: 8b446af26e5658346ba25804e2f1f3181a533d4c
  validator_task: TASK-20260804-a31f88
  red_team_task: TASK-20260804-7b4008

  type: empirical
  claim_tier: toy_scale
  states_a_finding: false
  compared_against_assumed_law: false

  # Schema slots filled under DEC-20260805-7b3e91 (RUL-4). Every value below is the
  # weakest in its vocabulary and is forced by this record's own committed text;
  # any stronger value would be a new claim requiring a superseding record.
  hypothesis_id: null
  hypothesis_note: >-
    This record names H1 (environmental) and H2 (genuine) as local labels only; it
    names no ledger hypothesis id, and its scope_statements say "No finding
    stated" and "AGENTS.md rule 12 UNMET and UNWAIVED". Choosing a ledger
    hypothesis here would assert a target the record did not choose.
  run_ids: []
  run_ids_note: >-
    No ledger-registered RUN-* record exists for this measurement. The 50 paired
    runs were performed under the goal's coordination batch directory for
    BATCH-1be68e and are identified by the producer_task, validator_task and
    red_team_task ids recorded above. The empty list states that no RUN-* record
    backs this evidence; it does NOT state that no work was done. Reported as an
    evidence-integrity gap in DEC-20260805-7b3e91 FINDING-3.
  direction: neutral
  strength: inconclusive
  direction_and_strength_basis: >-
    The record's own admissibility conclusion states "Neither H1 nor H2 is ruled
    out. OBJ-5 (all QEMU-only) remains blocking", and its pre-registered
    thresholds block records "Observed r = 0.44 -- NEITHER THRESHOLD MET".
    neutral and inconclusive are the schema's words for a measurement that
    discriminates nothing.
  proof_status: empirical_only
  proof_refs: []

  what_was_measured: >-
    50 paired runs in QEMU Docker linux/amd64: for each run with Siever seed
    from numpy.random.default_rng(20260804003).integers(0,2**32,size=50), the
    same sieve vectors were scored for both the correct secret s
    (instance_seed=20260803001) and a wrong secret s* (seed=20260804999).
    T_N_correct_i and T_N_null_i recorded per run.

  key_results:
    pearson_r: 0.4395
    pearson_p: 0.00141
    spearman_r: 0.4648
    var_TN_correct: 9096.83
    var_TN_null: 14058.60
    var_TN_diff: 13216.07
    ratio_correct: 1.5415  # 9097 / (17919 * 0.32934)
    ratio_null: 1.7602     # 14059 / (17919 * 0.44572)
    rc3_cross_run_r_c_odd_n_even: 0.125
    rc3_cross_run_p: 0.553
    rc3_lag1_correct: 0.056
    rc3_lag1_null: 0.169

  what_rc3_shows: >-
    RC-3 (cross-run correlation, QEMU state leakage test): all cross-run r ≈ 0
    (p > 0.25 for all four tests). QEMU JIT/PRNG state is NOT leaking across
    runs. The within-run r=0.44 is a genuine property of the sieve vectors'
    joint structure, not a run-to-run sequential artifact.

  pre_registered_thresholds: >-
    H1 (environmental): r >= 0.8; H2 (genuine): r <= 0.3.
    Observed r = 0.44 — NEITHER THRESHOLD MET. Red team OBJ-1 showed that the
    H1 threshold was never calibrated: the additive Q model predicts r ≈ 0.317,
    and the observed r = 0.44 is NOT significantly different from pure H1
    (Fisher-z p ≈ 0.33). The threshold of r >= 0.8 would require Var(Q) ≈ 4.7×
    the intrinsic Var[T_N_correct], which was not established.

  key_asymmetry: >-
    ratio_correct = 1.54 < ratio_null = 1.76 (direction inconsistent with
    symmetric sieve-vector correlation). Under H2 (genuine bgj1 sieve
    vector correlation), both should inflate proportionally to per-vector
    variance; they do not: the Q-model variance implied by ratio_correct
    (3,195) differs from that implied by ratio_null (6,072).

  admissibility:
    validator_verdict: accept_with_qualifications
    red_team_verdict: pass_with_constraints
    admissible: true
    qemu_state_leakage: false
    qemu_structural_artifact_ruled_out: false
    conclusion: >-
      The evidence is statistically consistent with pure H1 (environmental
      additive quality variation, r ≈ 0.317 predicted, 0.44 observed p=0.33).
      Neither H1 nor H2 is ruled out. OBJ-5 (all QEMU-only) remains blocking.
      RC-3 rules out the specific QEMU state-leakage mechanism.

  scope_statements:
    - Dimension 60, q=127, bgj1_sieve, Docker linux/amd64 QEMU only.
    - NOT crypto-scale evidence (AGENTS.md rule 7).
    - No finding stated.
    - AGENTS.md rule 12 UNMET and UNWAIVED.

  created_at: '2026-08-04'
  created_by: coordinator
