  observations:
  - 'THE MEASUREMENT DEPARTS FROM THE INDEPENDENCE NULL AT EVERY ORDER, AND THE DEPARTURE IS NEGATIVE.
    All 17 reported cells at PS-R3, T = 1e7, lie BELOW their frozen lower bound: log2 A-hat_2 = -6.031e-03
    at -244.1 null SD, falling monotonically to log2 A-hat_18 = -9.813e-01 at -32.4 SD. The pre-specified
    k = m = 17 cell -- the ONLY cell retaining 0.27 percent size under RULE-5 -- reads -8.657e-01 against
    a frozen interval of [-5.5547e-02, +7.5110e-02], i.e. -42.7 SD.'
  - The sign is the content. A17 assumes the inner-decoder block failures are independent; a NEGATIVE
    log2 A_k means the joint moments fall BELOW the independence prediction, i.e. the failures are ANTI-correlated
    at every tested order on this reduced parameter set.
  - 'Shape, reported as description and not as mechanism: log2 A-hat_k tracks C(k,2) * log2 A-hat_2 to
    within 0.4 to 6.4 percent across k = 2..18.'
  - THE INSTRUMENT DID NOT FIRE ON ITS MATCHED NULL. NULL-P fired 0 of 17 cells at the same T, the same
    frozen interval and the same estimator. CTRL-POSHOM clause (a) does not fire (X/df = 0.915, p = 0.653).
    CTRL-BS's k = 2 value is 107x smaller than the (T) value. INV-NULL bit-identity passes 17/17 and CTRL-ORACLE
    passes at max difference 8.88e-16 against a 1e-12 tolerance.
  - The measured q-hat shift is 0.44x the 3 SE reference, inside the certified q-robustness envelope the
    v3 amendment was admitted on.
  - THE VALIDATOR CERTIFIED THE ARITHMETIC INDEPENDENTLY AND EXACTLY. It recomputed all 17 values in exact
    rational arithmetic from the archived histogram, without numpy and without shared code, to a maximum
    deviation of 3.7e-15 bits -- nine to eleven orders below the narrowest interval half-width -- and
    regenerated the entire 17-cell frozen table from the amendment's prose alone, obtaining 34/34 bounds
    bit-identical.
  inference: 'On this one reduced parameter set, under a decision rule whose size was measured and independently
    re-derived before the data were seen, the independence assumption behind A17 is contradicted in a
    specific direction: block failures are anti-correlated, not independent, at every order from 2 to
    18. The direction matters for how this is read. Anti-correlation makes a bound built on independence
    CONSERVATIVE rather than optimistic, so this is not an attack result and must never be reported as
    one. What it is: the first measured, controlled statement this campaign has produced about the joint
    failure law, at toy scale, with a null that could fire and did not.'
  boundaries:
  - PS-R3 ONLY, at T = 1e7. PS-A was DROPPED from success criterion (iv) in the v3 amendment because it
    was not robust across +/-3 SE of q-hat, so NO CELL AT TRUE HQC PARAMETERS IS CERTIFIED. Nothing here
    is a statement about HQC-1, HQC-3, HQC-5, or any standardized parameter set.
  - NO extrapolation to the selected parameters is stated, and none may be inferred. Completion criterion
    1 requires that extrapolation, conditional on numbered heuristics; it is NOT supplied.
  - Claim tier TOY. One run, one seed family, no replication.
  - The 17-cell battery has familywise size 1.026 percent against 0.27 percent nominal (3.80x). Only the
    pre-specified k = m = 17 cell is a 0.27 percent test. A battery firing is roughly 1-in-100 under the
    exact null, NOT 1-in-370 (RULE-5).
  - Only the SYMMETRISED content of A17 is testable by this rule.
  - This weakens the INDEPENDENCE ASSUMPTION at the tested scope. It does not weaken, support, or otherwise
    bear on HQC's IND-CCA security, its decoding-failure rate, or the published bound.
  unresolved_confounds:
  - 'OPEN-6 IS THE LARGEST HOLE AND IT IS NOT CLOSED. No arm tests the (T) joint law against an answer
    known in advance. The validator states the consequence plainly: its exact recomputation certifies
    arithmetic FROM THE HISTOGRAM FORWARD AND NOTHING BEHIND IT, so a sampler defect would reproduce this
    result perfectly. A -244 SD departure is exactly what a subtly wrong sampler would also produce.'
  - CTRL-POSHOM is structurally blind to the shift-equivariant defect class (V1, V2, V3 confirmed blind
    by injection on two independent seeds), so clause (a) not firing does NOT exclude an index defect
    of that class. V2 in particular is exactly invisible to it AND changes the estimand.
  - Two declared controls were NOT RUN (CTRL-IDXMAP, CTRL-POSHOM clause (b)) under RULE-1, because their
    artifacts require a gather requirement inside stage_a.py outside the task's scopes.
  - NULL-M ran under-powered at 81,980 trials, and CTRL-BS and CTRL-POSHOM(a) ran on subsamples, because
    a 453.4 core-second shakedown overrun consumed the budget margin. Budget outcomes, never null results.
  - THE MEASUREMENT HAD ONE INDEPENDENT REVIEWER, NOT TWO. Completion criterion 2 names Validator AND
    Red Team; only the Validator reviewed the measurement itself. The Red Team reviewed the amendment.
  - 'ORDERING REGRESSION: the measurement snapshot (26578e1b) followed the validator''s read rather than
    preceding it -- the same deviation DEC-20260806-9d8aab said had been corrected. The correction was
    applied to the amendment path and not the measurement path. The validator independently hashed all
    four paths and matched them, so it read these bytes; but the freeze is argued, not enforced.'
  - The executor self-reported that its in-run integrity check was FAIL-OPEN -- it read path_sha256 at
    the receipt top level where the field is nested under archive, so the abort branch could never have
    triggered. Verification was redone correctly afterwards.
  - 'RT2-OBJ-1 is not closed: the composite-null size is unknown, so a firing is scoped to the TESTED
    null and not to "order k" in general.'
