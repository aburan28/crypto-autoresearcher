  run_ids: [RUN-P13-NC2d-a, RUN-P13-NC2b-a]
  supersedes_analysis_of: EV-WESO-b6ceff
  supersession_note: >-
    EV-WESO-b6ceff is NOT edited, withdrawn, or deleted; it remains on record
    exactly as committed at 133f7d47b (reachability from origin/main
    confirmed by the orchestrating session via `git merge-base
    --is-ancestor`; this reconciliation session has no Bash and did not
