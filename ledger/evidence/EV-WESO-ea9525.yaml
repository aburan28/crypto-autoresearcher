    This record supersedes EV-WESO-b6ceff's ANALYSIS LAYER (its direction,
    strength, claim_tier and provenance framing) with template-conformant
    values. It does NOT re-derive any number: every figure below is carried
    verbatim from EV-WESO-b6ceff's own observations and from
    coordination/goals/GOAL-P13-001/batches/BATCH-403f13/'s committed task
    receipts, which this session read but had no shell to independently
    recompute. Where this record states something EV-WESO-b6ceff did not
    (the D-8 contract-parseability finding below), it is new and is marked
