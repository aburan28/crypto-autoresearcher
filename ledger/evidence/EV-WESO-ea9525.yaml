  scope_of_the_measurement:
    instance: >-
      Same three primes as EXP-PEC-49c773's C-PSCALE (p ~ 2^40, 2^30, 2^20),
      re-measured at ell in {47,101,151,211} -- the actual operating range,
      disjoint from the original ell in {3,5,7,11,13} falsifier test.
      Phi_ell for all four degrees was already acquired; two of three primes
      already measured; the p3 arm was free (DEC-20260802-48c72c next_action
      item 1). C-PHI-VERIFY confirms all four Phi_ell hashes match committed
      values (RUN-P13-NC2d-a).
    implementation: >-
      The same per_entry_cost.py instrument as EXP-PEC-49c773/EXP-PEC-6be870,
      imported by path with SHA-256 matched.
    budget: "TASK-20260804-241b87: wall clock 42.0s of a 3600s budget for items (1)-(3) combined."

  observations:
    - id: OBS-A
      subject: "NC2d-PROPER: FC-4 does NOT fire at the operating ell range; FC-2 does not fire"
      text: >-
        Pooled alpha_primary = 1.1321, alpha_null = 1.0715, gap =
        |alpha_primary - alpha_null| = 0.0606, below the 0.15 FC-4 threshold.
        Jackknife range [1.1260, 1.1410] is contained in the pre-registered
        [0.85, 1.15] band, so FC-2 does not fire either. No-trend check:
        OLS slope b of alpha_hat(ell) vs log2(ell) = 0.0206, within the
        0.10 tolerance. Regressor is log2(log2 p) per the frozen spec (a
        handoff-description/spec disagreement was flagged and resolved in
        the frozen spec's favour, per DEC-20260802-48c72c precedent --
        RUN-P13-NC2d-a.handoff_conflict). Carried verbatim from
        EV-WESO-b6ceff and DEC-20260804-e19a65, cross-checked against
        RUN-P13-NC2d-a's own committed fields by this session's Read-only
        inspection; not independently recomputed by this session (no shell).
      this_records_own_reading: >-
        This retires MECHANISM-INCONSISTENT on L5 WITHIN THE OPERATING
        RANGE, by measurement, per the rule DEC-20260802-48c72c itself set.
        It does NOT lift the original FC-4 firing at ell in {3,5,7,11,13},
        which is a different, earlier pre-registered test and stands as
        record. Both facts are stated because a record carrying only one
        misleads in one direction (a post-hoc-restriction reading) or the
        other (treating L5 as unconditionally rehabilitated).
    - id: OBS-B
      subject: "NC2b-SLOPE: the instrument passes a synthetic non-zero-exponent recovery test"
      text: >-
        The committed null series was multiplied pointwise by ell^s for
        s in {0.4, 0.8}; the corrected estimator is required to recover
        s*log2(B_opt) + REF_null within the same 0.75-bit tolerance at every
        field size. All 10 W-MID checks pass; worst error 0.0926 bits of the
        0.75-bit tolerance (RUN-P13-NC2b-a.step4/step5, cross-checked by this
        session's Read-only inspection). RUN-P13-NC2b-a's own anomalies[0]
        discloses that the null series used (EXP-PEC-49c773's 47-ell series,
        W-MID n=43) differs from DEC-20260802-48c72c's expected object
        (EXP-PEC-6be870's ell 11..101 series, n=21), because the frozen
        EXP-P13-NC2b spec points at controls.C-NULL.per_ell_per_entry, which
        resolves to the newer series; the run states plainly that "gate
        evaluation uses the REFIT values not the expected values, so the
        gate result is valid" -- an openly disclosed spec/expectation
        mismatch, not a hidden substitution.
      this_records_own_reading: >-
        This validates the ESTIMATOR'S SENSITIVITY to a known non-zero
        exponent (power against assumption L1 that the flat null of NC2b-G1
        cannot supply). It is NOT a test of L1 itself and is not cited as
        one, matching EV-WESO-b6ceff's own boundary statement.
    - id: OBS-C
      subject: "Bibliographic subtask: three sources retrieved; the baseline constant k is not resolved"
      text: >-
        Sutherland (ANTS X, 2013, arXiv:1202.3985), Santos-Costello-Shi
        (CRYPTO 2022) and Adj et al. (ePrint 2018/313) were retrieved. The
        constant k is not explicitly stated in the retrieved abstracts;
        resolving it requires reading the Wesolowski paper body, which this
        item did not do. Named as necessary in three consecutive red-team
        reports before this batch (per DEC-20260802-48c72c); retrieval is
        complete, quantification of k is NOT.
    - id: OBS-D
      subject: "NC-3/NC-6 (Heuristic 1 tail validation): failed at infrastructure, not evidence"
      text: >-
        TASK-20260804-6519fa: "Executor subagent returned empty result (no
        text output, no artifacts)." states_a_finding: false. Per AGENTS.md
        rule 5 this is an infrastructure outcome and is NEVER evidence for
        or against Heuristic 1. Across GOAL-P13-001's entire budgeted
        history, NC-3/NC-6 has now been attempted exactly once (here) and
        has never successfully executed. It remains the single substantive
        open item DEC-20260802-48c72c named as "the decisive remaining gap."
    - id: OBS-E
      subject: "D-8 (new): the frozen contracts governing this evidence do not currently parse as YAML"
      text: >-
        experiments/EXP-P13-NC2b/specification.yaml and
        experiments/EXP-P13-NC2d/specification.yaml both fail strict YAML
        parsing on the current tree (confirmed by the orchestrating session:
        NC2b raises a ParserError at line 96 column 34; NC2d raises a
        ScannerError at line 260 column 10; both independently flagged by
        tools/check_merge_hygiene.py --absolute as pre-existing on main, not
        introduced by this branch). This session inspected both locations
        with its Read tool (no YAML parser available, but the defects are
        visible on inspection). NC2b line 96 writes its b_opt_constants.table
        entries as `field: "..."; log2p: N; log2_B_opt: N` -- semicolon-
        separated inline pairs, which is not valid YAML flow-mapping syntax
        (a comma-separated `{...}` mapping would parse; semicolons do not).
        NC2d line 260 begins a required_report bullet with a literal `|`
        immediately after the list dash (`- |alpha_hat(ell) -
        alpha_null(ell)| per ell`, intended as absolute-value notation), which
        YAML instead parses as a block-scalar indicator expecting indented
        content on following lines. Both read as localised, AUTHORING-TIME
        YAML syntax mistakes (a hand-written constants table; an
        unescaped math-notation bullet) rather than truncation or
        merge-conflict markers -- but this session has no git history access
        to establish WHETHER either file parsed at BATCH-403f13's freeze/
        execution time and was corrupted afterward by an unrelated commit,
        or was already unparseable when "frozen." Neither direction is
        asserted; both remain open.
      consequence: >-
        Per the goal's own next_action: "a superseding contract cannot
        retroactively re-freeze a run that already happened, so say plainly
        what the runs then are." Stated plainly: RUN-P13-NC2d-a and
        RUN-P13-NC2b-a are committed, immutable run artifacts that were
        contemporaneously reviewed by an independent Validator and Red Team
        who reported reading and checking the pre-registered thresholds
        against "the frozen spec" at review time (TASK-20260804-cf1ae3,
        TASK-20260804-83d874). Neither this evidence record nor any future
        automated reader can RIGHT NOW mechanically re-verify those
        thresholds against a parseable frozen-contract file, independent of
        the reviewers' own contemporaneous reading. This record therefore
        does NOT claim the EV-PEC-857664-standard of freeze integrity
        ("the frozen contract is byte-unchanged since its own snapshot ...
        verified by comparing GIT TREE OBJECTS"); it relies on the
        reviewers' contemporaneous record instead, carried forward as
        REVIEW FINDINGS. Repairing the two specification.yaml files (via
        git-history reconstruction if the pre-corruption bytes are
        recoverable, or a fresh superseding EXP-id if not) is NOT done in
        this record and is named as an open, un-minted follow-up action in
        the citing decision's next_actions.

  boundaries:
    - This is a toy/medium-scale result (max field 80-bit F_{p^2}); the two smaller C-PSCALE primes carry a `toy` ceiling.
    - NC2b-SLOPE validates instrument sensitivity to L1; it is not a test of L1 itself.
    - NC-3/NC-6 was attempted once and failed at infrastructure; Heuristic 1 remains completely empirically unvalidated across this goal's entire history.
    - >-
      The original FC-4 firing at ell in {3,5,7,11,13} (EXP-PEC-49c773)
      is NOT lifted by this record. It stands as record per
      DEC-20260802-48c72c adjudication E.
    - alpha=1.13 excess over the theoretical L5 prediction of 1.0 is not propagated into any c-table row (unresolved; see unresolved_confounds).
    - >-
      D-8: the governing frozen contracts (EXP-P13-NC2b/EXP-P13-NC2d
      specification.yaml) do not currently parse; see OBS-E.
    - No completion criterion of GOAL-P13-001 is approached or claimed met by this record.
    - Nothing here bears on the conditional asymptotic theorem or on any concrete NIST-level threat determination, both of which remain exactly as DEC-20260802-48c72c left them.

  unresolved_confounds:
    - "RT-OBJ-A (Red Team, BATCH-403f13): the primary-null gap shows an unmonitored upward trend toward the 0.15 FC-4 threshold at larger ell; gaps at ell=151,211 already sit at 59% of threshold."
    - "RT-OBJ-B (Red Team, BATCH-403f13): the alpha=1.13 excess (13% over the theoretical 1.0) is not propagated into any c-table or margin row."
    - "RT-OBJ-F (Red Team, BATCH-403f13): Heuristic 1 remains completely unvalidated; nothing in this batch bears on it."
    - "Q-1/Q-2 (Validator, BATCH-403f13, informational): a labelling qualification, and BATCH-403f13's NC-3/NC-6 task artifacts being untracked/outside the reviewed snapshot at review time."
    - "D-8 (this record, new): see OBS-E -- the frozen contracts do not currently parse, so pre-registered thresholds rest on the reviewers' contemporaneous reading rather than on mechanical re-verification by this record."

