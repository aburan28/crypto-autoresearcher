  type: empirical
  direction: supports
  direction_binding: >-
    Bound to exactly one thing: assumption L5 (the p-scaling exponent
    alpha ~= 1) is MEASURED-CONSISTENT AT THE OPERATING ell RANGE
    {47,101,151,211}, retiring the MECHANISM-INCONSISTENT label WITHIN THAT
    SCOPE by the one route DEC-20260802-48c72c itself specified as
    legitimate: "the MECHANISM-INCONSISTENT label is retired BY MEASUREMENT,
    which is the only legitimate way to retire it." NC2d-PROPER is a freshly
    pre-registered test scoped to ell>=47, not a restriction of the original
    ell in {3,5,7,11,13} test, so retiring the label at this scope does not
    lift the original FC-4 firing (EXP-PEC-49c773), which STANDS as record
    per DEC-20260802-48c72c adjudication E's governing rule that a post-hoc
    restriction cannot lift a pre-registered falsifier. NOT bound to: the
    conditional asymptotic theorem (untouched); Heuristic 1 (untouched, and
    its one validation attempt in this same batch FAILED AT INFRASTRUCTURE,
    which is not evidence either way, AGENTS.md rule 5); the concrete NIST-I
    threat question (untouched, still INCONCLUSIVE per DEC-20260802-48c72c);
    or any promotion of H-WESO-001 toward `supported` (the four promotion
    gates of agents/coordinator.md remain unsatisfied; see the citing
    decision's promotion_gate_check).
  strength: preliminary
  strength_justification: >-
    Capped at `preliminary`, for reasons independent of the archival defects
    this record repairs. One run each (maximum_runs 1 per contract), the
    same instrument as EXP-PEC-49c773/EXP-PEC-6be870
    (experiments/EXP-PEC-6be870/implementation/per_entry_cost.py, sha256
    aea73ef79c3bdf6091b1fd61950bd8449618b295effd9d39a096f65197020ef1,
    matched in RUN-P13-NC2d-a.instrument), and NC2b-SLOPE is zero-compute
    arithmetic on already-committed numbers rather than a second measurement.
    Independent review (Validator TASK-20260804-cf1ae3
    accept_with_qualifications; Red Team TASK-20260804-83d874
    pass_with_constraints) is arithmetic verification of admissibility, not a
    second measurement, matching the standard EV-PEC-857664 set for the
    predecessor batch. WHAT WOULD RAISE IT: a second authorized run under a
    different instrument or prime, or resolution of the D-8 contract-parse
    defect below so the pre-registered thresholds are mechanically
    re-checkable rather than resting on the reviewers' contemporaneous
    reading.
  claim_tier: medium
  claim_tier_derivation: >-
    Mechanical, per docs/claims-and-verification.md, matching
    EV-PEC-857664's derivation for the same C-PSCALE prime set: NC2d-PROPER
    re-runs C-PSCALE at "the SAME three primes" as EXP-PEC-49c773
    (DEC-20260802-48c72c next_action item 1) -- p ~ 2^40 (80-bit F_{p^2}),
    p = 2^30 (60-bit) and p = 2^20 (40-bit), confirmed in
    RUN-P13-NC2d-a.arms (p1: log2_p ~= 20.0). Max field bit size 80 lies in
    (32, 96], so the tier is `medium`; the two smaller primes carry a `toy`
    ceiling individually and every alpha_hat/FC-4/FC-2 statement inherits it,
    exactly as EV-PEC-857664 records for the predecessor C-PSCALE run.
    NC2b-SLOPE is zero-compute arithmetic on the same committed medium-tier
    series and inherits its tier. The bibliographic subtask carries no
    claim_tier (a literature retrieval, not a measurement).
  certificate_refs: []
  certificate_note: >-
    No discrete-log solve or factor-base relation is claimed. Nothing to
    certify in the sense of docs/claims-and-verification.md.
  proof_status: derivation
  proof_status_justification: >-
    Per docs/claims-and-verification.md ("Refutation artifacts"), the
    strongest checkable basis this record's direction claim admits is the
    pre-registered falsifier test itself (FC-4/FC-2 evaluated against fixed,
    pre-registered thresholds) plus the independent reviewers' own
    recomputation, not a machine-verified proof. Labelled `derivation`,
    never "proved" or "measured beyond doubt."
  proof_refs:
    - coordination/goals/GOAL-P13-001/batches/BATCH-403f13/tasks/TASK-20260804-cf1ae3/validation_report.yaml
    - coordination/goals/GOAL-P13-001/batches/BATCH-403f13/tasks/TASK-20260804-cf1ae3/validation_notes.md
    - coordination/goals/GOAL-P13-001/batches/BATCH-403f13/tasks/TASK-20260804-83d874/red_team_report.yaml
