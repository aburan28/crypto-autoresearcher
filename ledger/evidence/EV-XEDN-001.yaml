evidence:
  id: EV-XEDN-001
  hypothesis_id: H-XEDN-001
  experiment_ids: [EXP-XEDN-002]
  run_ids:
    - RUN-XEDN-002-A2
    - RUN-XEDN-002-B
    - RUN-XEDN-002-C
    - RUN-XEDN-002-CTRL
  type: empirical
  direction: contradicts
  strength: replicated
  claim_tier: toy
  certificate_refs: []
  proof_status: derivation
  proof_refs:
    - experiments/EXP-XEDN-002/derivation.md
    - experiments/EXP-XEDN-002/analysis.md
    - coordination/goals/GOAL-ICLIFT-001/batches/BATCH-001/tasks/TASK-20260724-234/validation_notes.md
    - coordination/goals/GOAL-ICLIFT-001/batches/BATCH-001/tasks/TASK-20260724-235/objections.md
  observations:
    - >-
      Exact closed form for the frozen family (y^2 = x^3 + b(t) over F_p with
      a(t) = 0 and deg b = 6 exactly; slot = monic quadratic x(t); frozen
      is_square_poly predicate): N_slots(p) = (p-1)*p^8 and
      N_hit(p) = p^2*(p^4 - 3p^3 + 2p^2 + p - 1)/2, hence
      P_lift(p) = (1 - 2/p + p^-3)/(2*p^3) as an exact identity.
    - >-
      Limiting exponent alpha = 3 exactly with constant exactly 1/2. Exact
      finite-size exponents at the four contracted sizes: 2.985781 (101->211),
      2.993178 (211->431), 2.996544 (431->809). These are exact rationals, so
      there is no sampling uncertainty to report.
    - >-
      Arm B: exact agreement between the closed form and enumeration under the
      frozen predicate on every enumerated slice, over 596,268,874 slots
      classified twice by two independent methods with zero disagreements. FULL
      slot-space exhaustion was reached at p = 5 and p = 7 only; at p = 11 and
      p = 13 all surfaces were tested but only against 9.9174% and 3.5503% of
      the slot space respectively, with the tested x lists recorded. The
      artifacts describe the partial enumeration as partial.
    - >-
      Arm C: exact per-surface histograms. The fraction of surfaces carrying at
      least 9 DISTINCT hit slots of the single frozen degree shape is exactly 0
      at p = 5, 7, 11 and 1.346645e-06 at p = 13 (78 of 57,921,708 surfaces) in
      the monic convention. The same run also records the free-x convention:
      0, 7.893536e-03, 0, 8.815141e-03 — below p^-1 at every computed size but
      RISING with p.
    - >-
      Controls: the frozen predicate agreed with an independent square test
      everywhere tested (finding: the predicate implicitly requires the square
      root to be squarefree; relaxing that multiplies P_lift by 1.2303 at p = 5
      and 1.0100 at p = 101 and changes no exponent); the EXP-XEDN-001 planted
      section was recovered uniquely at p = 101; the closed form predicts 0.00274
      expected hits in the 5760 slots of the recorded p=101 smoke, so that
      smoke's observed 0 was uninformative about alpha by construction; the
      excluded y = 0 case accounts for exactly p^2 slots.
    - >-
      Independent validation (TASK-20260724-234) returned valid_with_findings.
      The validator DERIVED N_slots and N_hit from the specification and the
      frozen predicate BEFORE reading derivation.md and obtained the identical
      formulas symbol for symbol, independently discovered the squarefree-root
      property of the predicate, and reproduced the p = 5 and p = 7 full
      brute-force counts (3,800 of 1,562,500 and 36,162 of 34,588,806) without
      importing executor code. That is what rules out a post-hoc fitted formula.
    - >-
      MATERIAL FORMALISATION DEFECT, found by the executor and independently
      confirmed by the validator: with a(t) = 0 the whole family has j = 0, so
      under the standard constant-j definition EVERY surface is iso-trivial. The
      family is the sextic-twist family of Y^2 = X^3 + 1, with exactly (p-1)p
      members F_p(t)-isomorphic to a constant curve (20/42/110/156 at
      p = 5/7/11/13, enumerated). The EXP-XEDN-001 contract constraint
      "iso-trivial surfaces must be detected and excluded from census counts" is
      therefore not satisfiable for this family as frozen: applying it would
      empty the family. Nothing was excluded, and both readings are recorded.
    - >-
      Independent red team (TASK-20260724-235) returned conclusion_requires_narrowing
      with three FATAL scoping objections. (RT-1) The frozen family is exactly the
      class candidate B2 excluded — B2 wanted a non-iso-trivial rank-1 surface and
      this family is j = 0 with generic geometric Mordell-Weil rank 8 — and
      H-XEDN-001's own assumption of iso-trivial exclusion is unsatisfiable for
      the family it names, so the hypothesis is refuted AS POSED rather than
      candidate B2 being closed. (RT-4) Distinct sections are not independent
      sections: on an in-family p = 13 surface the 15 counted free-x sections form
      5 mu_3 orbits satisfying S + wS + w^2 S = O, whose specialisation is a
      tautology (checked on 4,788 points at p = 7, 13, 31, 61), and s >= r+1 is
      neither necessary nor sufficient. (RT-5) The measure is wrong for the
      attack: xedni CONSTRUCTS the surface through prescribed points, and the red
      team built an in-family surface with the target fibre and a prescribed
      section at 10,201 of 10,201 attempts at p = 101, against a uniform per-slot
      rate of 4.76e-07, with the prescribed-configuration count exactly p^3(p-2)
      and growing.
    - >-
      Red-team scoping results that do not overturn the number: the
      NON-iso-trivial family (deg a <= 4) was derived and exhaustively verified
      in a scratch probe to give P_slot = (p-1)(p^3+1)/(2p^7), i.e. alpha = 3
      exactly as well, so iso-triviality does not rescue the hypothesis (RT-2 —
      a red-team probe, not a recorded run); alpha = 3 is the naive
      square-density count and NOT the Jacobson-Koblitz-Silverman-Stein-Teske
      prediction, which the ledger records as an O(1/p) coefficient bound (RT-7);
      and the counted sections are height-2 roots of the E_8 Mordell-Weil lattice,
      so their relations have absolutely bounded coefficients, making the binding
      obstruction the coefficient size rather than the p^-3 density (RT-10).
    - >-
      A verified off-by-one in derivation.md section 2.5 charges two fibre
      conditions when a(t) is absent, so its stated threshold "m >= 6" should
      read "m >= 7" (red-team RT-6). This affects the arm-D parameter table, not
      arms A, B, or C.
  inference: >-
    H-XEDN-001's prediction alpha < 1/2 is false for the family, slot shape, and
    predicate it names: the exact exponent is 3. The EXP-XEDN-001 phase-2
    promotion gate does not open. But the closure this buys is narrow and is not
    a closure of candidate B2 or of function-field xedni: the census measured a
    uniform-measure per-slot density on a family that is entirely iso-trivial —
    the class the original candidate explicitly excluded — while the attack
    prescribes its surface, and the multi-section clause depends on a distinct-
    versus-independent conflation and flips its margin under the free-x
    convention. An exact count removes sampling error, not model error.
  boundaries:
    - >-
      Scope, verbatim from the red team's narrowest defensible boundary: the
      uniform-measure per-slot integral-section density for this surface family
      (a(t) = 0, deg b = 6 exactly), this monic degree-2 slot shape, this
      predicate (nonzero square with squarefree root, y = 0 excluded), and these
      sizes. Claim tier toy.
    - >-
      NOT closed by this record: candidate B2; the function-field xedni census as
      a research direction; non-iso-trivial families and a(t) != 0; higher-degree,
      non-monic, or non-integral sections; Mordell-Weil rank and independence;
      relation-coefficient size (the obstruction the literature says is binding);
      the constructed measure that the attack actually uses; other base fields;
      crypto scale; and xedni over number fields.
    - >-
      The result must not be described as confirming, reproducing, or being
      consistent with "the classical JKSST prediction". alpha = 3 is the naive
      square-density codimension count. JKSST's refutation of classical xedni is
      about relation-coefficient growth, which is untested here.
    - >-
      This adds nothing to and supersedes nothing in the audited-route records
      ECFG-P1543 and ECFG-P1547 in ledger/FINDING-PF-IC-001.md, and it is not a
      general no-go for lifting.
    - >-
      Arm D is a scoped parameter-counting lemma with two unproved counting
      heuristics verified in three configurations, plus one verified off-by-one.
      It is not a geometric theorem and not an unconditional no-go.
    - >-
      The infeasibility of the original EXP-XEDN-001 phase-2 sampling design is a
      methodology observation and is never evidence about the mathematics
      (AGENTS.md rule 5).
  unresolved_confounds:
    - >-
      Model error is the dominant unresolved risk and is unresolved by design:
      three of the red team's objections are fatal to reading the exact number as
      an answer about xedni rather than about this family under this measure.
    - >-
      Full-space frozen-predicate exhaustion reached p = 5 and 7 only; at p = 11
      and 13 the residual risk is reduced by arm C's independent fibering, which
      the validator reproduced bin for bin, but not eliminated.
    - >-
      The planted-section positive control lies OUTSIDE the census family (its
      b has degree 5, inherited from the frozen EXP-XEDN-001 input), so the
      package has no in-population planted positive; the red team constructed one
      in three lines but it is not a recorded run.
    - >-
      Independence of review is procedural rather than architectural: the
      validator reported that this session and resolved model match the
      executor's, and the review-xhigh policy cannot be resolved in a
      Claude-family harness at all. The reviewers had independent context, and
      the xedni validator re-derived the count before reading the executor's, but
      AGENTS.md rule 12's independent-session requirement is discharged only in
      that weaker sense and is recorded as such.
  reviewed_by: coordinator
