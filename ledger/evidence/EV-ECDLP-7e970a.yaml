evidence:
  id: EV-ECDLP-7e970a
  hypothesis_id: H-ECDLP-60de36
  experiment_ids: [EXP-ECDLP-502ae2]
  run_ids: [RUN-ECDLP-502ae2-01]
  validation_ids: [VAL-20261015-280100]
  related_evidence: [EV-ECDLP-6bdff6]
  type: empirical
  direction: contradicts
  strength: replicated
  strength_basis: >-
    Second, independent solver family (msolve 0.6.5, F4 + FGLM) on the same
    instances as EV-ECDLP-6bdff6 (Singular), same direction; validated
    (VAL-20261015-280100, passed) with a partial re-run whose deterministic
    fields match 18/18.
  claim_tier: toy
  proof_status: empirical_only
  proof_refs: []
  observations:
    - id: O-1
      text: >-
        m = 3, msolve -P 1 full solve: arm A (chain) median 1.40 s vs arm B
        (same set, dense) 0.085 s at L = 3 (16.5x) and 291 s vs 1.94 s at L = 4
        (150x). A faster than B in 0/2 jointly completed cells.
    - id: O-2
      text: >-
        Basis step alone (msolve -g 2), which isolates F4 from msolve's -P 1
        genericity retries (these inflate A's full-solve ratio ~5x, validator
        check 4c): A/B = 8.0x at L = 3, 30.5x at L = 4, > 79x at L = 5 (A timed
        out on 6/6 at 600 s; B median 7.6 s).
    - id: O-3
      text: >-
        Arm A retired at L = 5; arms B and C completed L = 5 on all instances
        and L = 6 on the 2 random (empty-variety) targets, retired at L = 7.
        Counting planted instances only, B and C reach L = 5 against A's L = 4.
    - id: O-4
      text: >-
        The chain lowers msolve's maximum F4 degree (A: 12, 13 at L = 3, 4;
        B and C: 16, 24, 40, 72 at L = 3..6) but at 3L variables the F4
        matrices grow faster than the degree saving: lower solving degree does
        not translate into lower cost here.
    - id: O-5
      text: >-
        Arms B and C cost the same within spread; enumeration (E) needs 629
        group operations at L = 5 and stays far below every Groebner arm.
        Positive control 32/32 (planted in msolve's reduced basis);
        quotient dimension of A equals B on 8/8 paired planted instances and
        msolve equals Singular vdim on 34/34 paired results.
  frozen_criteria_outcome: >-
    success not met; falsification met on both limbs (A >= B in 2/2 jointly
    completed cells; A retired at L = 5 <= 7 for B and C).
  scope_limits:
    - m = 3, p 10..22 bits, msolve 0.6.5 single-threaded, DRL in the launcher's variable order, -c 2, 600 s per step
    - other variable/elimination orders, block orders for the chain, other F4/F5 implementations, m >= 4 not tested
  dominated_by: Pollard rho at exponent 1/2 (and plain enumeration at these sizes)
