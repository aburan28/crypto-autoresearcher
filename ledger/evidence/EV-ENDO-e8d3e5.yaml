  - coordination/goals/GOAL-ENDO-001/batches/BATCH-cb71b5/reviews/red-team/red_team_notes.md
  observations:
  - >-
    SURVIVING, SYMBOLIC. The Semaev S_3 monomial support is exactly 9 for j = 0
    (a = 0), 10 for j = 1728 (b = 0), and 13 for generic j. Exact symbolic
    computation over F_p, and re-derived term by term by hand in the independent
    Red Team session. This is the batch's only unqualified positive finding and it
    is a structural fact about the polynomial system, not an attack.
  - >-
    SURVIVING, DERIVED AND VERIFIED. #{x in F_p : x^3+ax+b is a square} =
    (#E(F_p) - 1 + z)/2, where z is the number of rational 2-torsion x-coordinates.
    Verified on every curve of every measured class at p = 2003, 4001, 6007.
    Consequence: the full-field liftable density is a function of (#E, z) alone;
    #E is class-invariant and z is not; so the entire within-class variation of
    that quantity is the 2-torsion structure. The predicted within-class variance
    Var(z)/4 matches the observed value to 2.9e-14.
  - >-
    SURVIVING, INSTRUMENTAL. Enumeration completeness is certified against the
    Hurwitz-Kronecker class number H(4p - t^2) and passes on every ordinary trace
    at p = 1009, 2003, 4001, 6007. The census REJECTED an earlier implementation on
    60 of 127 traces at p = 1009 (imprimitive quadratic forms counted), which is
    the check doing its job.
  - >-
    SURVIVING, CERTIFIED. Isogeny transport of an ECDLP instance is correct at odd
    ell: every transported table entry passes a certificate computed independently
    of the transport code, and every target curve lands at the same trace, as Tate
    requires. This is the transport theorem T1 confirmed empirically at ell = 3, 5,
    7. The COST claim attached to it is refuted -- see below.
  - >-
    REFUTED PRE-REGISTRATION. DECOMPOSITION.md section 5 prediction 1 predicted
    ZERO within-class variance in relation yield. Under the CORRECTED uniform
    sampler, relation yield is OVER-DISPERSED within the class at both m = 2 and
    m = 3 and at both primes. The Red Team's saturation-decay sweep shows the
    over-dispersion falling with factor-base density (variance ratio 0.93 at
    |3V|/#E = 0.023 rising to 2.04 at 0.53), consistent with a saturation artifact,
    but still 1.27-1.34 at densities 0.11-0.22 which bracket the regime a real
    m = 3 decomposition operates in. NEITHER READING IS ESTABLISHED. The batch ran
    only the saturated row.
  - >-
    OVERSTATED AND WITHDRAWN. The batch's headline reading of the label-permutation
    null -- "the isogeny-class grouping carries no detectable information" -- is
    licensed only for between-class MEANS. The Red Team characterised NULL-C by
    planting a between-class mean shift into the real data: power 1.00 at a 0.9%
    shift. It is a mean detector, maximally sensitive to exactly the #E confound
    that CORR-20260807-a05e1e identified, and blind to within-class structure.
    EXP-INSTR-2d32ba characterised NULL-B only; its pass does not license NULL-C.
    At a planted shift of zero the median p is 0.059 rather than 0.5, indicating a
    residual class effect from #E survives the sampler fix.
  - >-
    UNSUPPORTED AND WITHDRAWN. The reported automorphism-quotient speedup of 1.641
    against the sqrt(3) = 1.7321 incremental ceiling is a SINGLE DRAW. Over 8 seeds
    the mean is 1.7344 (sd 0.2046, min 1.3705, max 2.0333) -- statistically ON the
    ceiling -- with 3 of 8 seeds above it, and seed 4 at ratio 1.1739 tripping the
    campaign's own P3 pause threshold. The batch's attribution of the shortfall to
    fruitless-cycle cost is contradicted by the run's own counter, which reports
    fruitless_total = 0 in every arm. Defensible statement: the measured speedup is
    consistent with the ceiling and does not exceed it beyond seed noise.
  - >-
    REFUTED. The claim that a preprocessing table transports at ~1/6 the cost of
    rebuilding is wrong: the rebuild baseline calls a full double-and-add per entry
    for a table of CONSECUTIVE multiples, inflating it by ~log2(N). Re-measured by
    the Coordinator with min-over-7 timing: ratio 12.23 at S = 400 and 15.18 at
    S = 2000, both builders returning byte-identical tables. Against a correct
    rebuild, transport LOSES at every odd ell tested.
  - >-
    INVALID. RUN-MTGT-p4001e2 measures the IDENTITY MAP. velu_odd loops
    range((ell-1)//2), empty at ell = 2, returning (a, b) unchanged; velu_image
    with the resulting empty kernel is the identity. Every success indicator in
    that run is trivially true of the identity. Confirmed by direct re-derivation.
  - >-
    ATTEMPTED AND INCONCLUSIVE. The batch's volcano "level" variable is
    character-for-character the 2-torsion count and resolves 2 of the 5 levels the
    p = 4001 / t = 30 volcano actually has (true distribution {0:3, 1:9, 2:18,
    3:36, 4:72}, matching h(D0 f^2) and summing to the enumerated 138). The Red
    Team rebuilt the true 2-isogeny graph and re-ran the test on the correct
    5-level variable: p = 0.3115, so the no-effect conclusion SURVIVES -- but on
    the Red Team's measurement, not the batch's, and with n = 3 at the crater where
    the design detects nothing below a 9.8% excess.
  - >-
    NOT MEASURED, CONTRARY TO THE SYNTHESIS. No Groebner-cost difference between
    special-j and generic arms exceeds 1% in either direction (j=0: -0.44%,
    j=1728: -0.67%), with no dispersion estimate for any arm at n = 6, 4 and 12
    curves. The synthesis reported "~3%"; the only ~3% quantity in the run is
    gb_size_mean for j = 1728 at +3.41%, i.e. the special-j basis is LARGER.
  inference: >-
    NOTHING IN THIS BATCH SUPPORTS OR WEAKENS ANY ECDLP CLAIM, and the batch's own
    headline readings did not survive independent review. What it establishes is
    narrow and mostly instrumental: two exact mathematical facts (the S_3 support
    counts and the liftable-count identity), a certified-complete class enumerator,
    and a certified-correct isogeny transport at odd ell. Its central negative --
    that the isogeny class carries no attack-relevant structure -- is NOT
    established: the statistic it rested on cannot see within-class structure, and
    the one pre-registered prediction that was testable was refuted. The direction
    of this record is `neutral` and its strength is `inconclusive` because that is
    what the evidence supports, not because the question is uninteresting.
  boundaries:
  - >-
    Toy scale throughout: p <= 100003, complete class enumeration only to p = 6007.
    No statement here transfers to cryptographic scale and none is offered.
  - >-
    Two isogeny classes per prime at two primes for the gating measurement. The
    target class is selected as the LARGEST ordinary class, which is a size bias
    the batch did not control for.
  - >-
    Groebner cost is measured through sympy, which runs a Buchberger-family routine
    and does not expose the degree of regularity. All such numbers are
    implementation-bound proxies, as harness/semaev.py already insists.
  - >-
    Only ell = 2 has a defined volcano-level variable in this harness; odd-ell level
    determination needs modular polynomials, which are not implemented, and the
    code now refuses rather than reporting a wrong level.
  unresolved_confounds:
  - >-
    THE BATCH HAS NO INDEPENDENT RUN-INTEGRITY VALIDATION. The Validator session
    terminated on a provider session limit having written nothing. The Red Team
    session terminated on the same limit after writing complete working notes but
    before its structured report. Every finding above that is attributed to review
    comes from those notes plus the Coordinator's own re-derivation; the census
    arithmetic, the Wilson-Hilferty approximation, the Velu normalisation and the
    certificate independence have NOT been checked by a non-originating party.
  - >-
    The six snapshot-1 run manifests record a commit at which none of their code
    existed, and `dirty: false`, because git_state() ignores untracked files. Those
    runs are not reproducible from their own manifests (CORR-20260807-3ee25d D3).
  - >-
    NONE of the seven executed experiments had a frozen contract before execution.
    They are exploratory measurements, and no post-hoc contract has been written for
    them because that would present a specification as a pre-registration
    (CORR-20260807-3ee25d D4).
  - >-
    Residual #E dependence survives the sampler correction (median permutation p of
    0.059 at a planted zero shift), and its size is unmeasured.
  - >-
    Whether the relation-yield over-dispersion is a saturation artifact or a real
    curve effect is undetermined at the densities that matter.
  reviewed_by: coordinator
  review_provenance: >-
    Independent Red Team session dispatched against snapshot 22eb74ba; notes at
    coordination/goals/GOAL-ENDO-001/batches/BATCH-cb71b5/reviews/red-team/red_team_notes.md.
    Defects D1 and D2 of CORR-20260807-3ee25d were independently re-derived by the
