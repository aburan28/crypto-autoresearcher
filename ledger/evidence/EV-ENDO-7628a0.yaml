  inference: >-
    At the modelled tier, a model change and the chain 2-GLV compose on four
    isogeny classes: on a horizontal 5-neighbour with an a = -3 model, the
    2-GLV is cheaper than the 2-GLV on E by 5.96 % to 11.84 % persistent and,
