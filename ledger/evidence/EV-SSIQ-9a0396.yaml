evidence:
  id: EV-SSIQ-9a0396
  hypothesis_id: H-SSIQ-18dc91
  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  batch_id: BATCH-003
  experiment_ids: [EXP-SSIQ-58b642]
  run_ids: [RUN-SSIQ-58b642-a]
  type: empirical
  direction: neutral
  direction_note: >-
    NEUTRAL, AND FOR A DIFFERENT REASON THAN EV-SSIQ-29fcbb. That record was
    neutral because the run completed and its decision rule returned
    INCONCLUSIVE. This run's confirmatory metric (M-GAP on real labels) was
    NEVER COMPUTED AT ALL: a data-availability gap blocked it before the
    decision rule could apply to real data. Both reviewers independently
    confirm the gap is real, not a shortfall of effort. Nothing here supports,
    weakens, or is inconclusive about H-SSIQ-18dc91's prediction; the
    hypothesis remains UNTESTED at the labelled real-arm level.
  strength: inconclusive
  strength_note: >-
    inconclusive as a label for "not tested," not for "tested weakly." What IS
    firm and independently reproduced: Phase 0 (C-CAL-GAP) genuinely passed
    (Validator re-derived it from scratch with a different noise model and RNG,
    and separately re-executed the producer's own code, both bit-for-bit or
    within tolerance); graph construction passed every correctness gate for all
    12 primes, independently re-verified beyond the contractual minimum; and
    the WISDE data-gap that blocked the real arm is independently confirmed
    real by direct fetch of five files plus the dataset's own generating source
    code. The campaign-level preliminary cap from EV-SSIQ-e43afd is unchanged.
  claim_tier: toy
  claim_tier_note: >-
    Toy scale, matching H-SSIQ-18dc91.scope_ceiling exactly: graphs from 203 to
    1800 vertices, p up to 21601 (15 bits). No result transfers to
    cryptographic scale, and none is claimed to.
  proof_status: empirical_only
  proof_refs:
    - experiments/EXP-SSIQ-58b642/runs/RUN-SSIQ-58b642-a/raw-result.json
    - experiments/EXP-SSIQ-58b642/runs/RUN-SSIQ-58b642-a/execution_report.yaml
    - coordination/goals/GOAL-SSIQ-001/batches/BATCH-003/reviews/VAL-BATCH-003.md
    - coordination/goals/GOAL-SSIQ-001/batches/BATCH-003/reviews/RT-BATCH-003.md
  preregistration_binding:
    specification: experiments/EXP-SSIQ-58b642/specification.yaml
    freeze_commit: f5244c18583255186fd0fc30dc7c73645d86607a
    verified_by: TASK-20260805-2c086d
    detail: >-
      The Validator confirmed the contract's git history shows exactly three
      commits (draft, six-fixes-applied, freeze), that specification.yaml is
      byte-unchanged from the freeze commit through HEAD, and that the freeze
      timestamp (06:18:46Z) precedes the run's start (06:50:51Z) by ~32
      minutes. This contract itself went through a pre-freeze Red Team review
      (RT-PREFREEZE-EXP-SSIQ-58b642.md, seven findings, all resolved before
      freeze) -- the standing practice adopted after GD-4/GD-5.
  observations:
    - id: O-1
      statement: >-
        PHASE 0 (C-CAL-GAP) GENUINELY PASSED, independently confirmed two
        ways. The Validator wrote a from-scratch OLS-on-logs estimator with a
        DIFFERENT noise model and RNG structure than the producer's, ran it
        over 20 independent seeds per synthetic variant (not the producer's
        single seed), and got a 20/20 pass rate on all three variants
        (constant-offset c=1, constant-offset c=10, saturating/capped) --
        showing the ESTIMATOR DESIGN recovers the known 0.25 gap robustly, not
        that one lucky seed passed. Separately, direct re-execution of the
        producer's own code reproduced the reported numbers BIT-FOR-BIT
        (0.272119 / 0.258219 / 0.275418, errors 0.022/0.008/0.025 against the
        +-0.10 tolerance). This is the calibration gate this campaign added
        specifically because BATCH-001 and BATCH-002 each froze an instrument
        nobody had checked; it worked as designed.
      supported_by: [TASK-20260805-eaf51d, TASK-20260805-2c086d]
    - id: O-2
      statement: >-
        GRAPH CONSTRUCTION PASSED EVERY CORRECTNESS GATE, independently
        re-verified beyond the contractual minimum. The Validator recomputed
        the CGL/De Feo floor(p/12) vertex-count formula for ALL 12 primes (not
        a sample) from scratch and matched exactly; verified the classical
        Phi_2 modular polynomial coefficients via a THIRD independent route
        (exact rational elliptic-curve arithmetic, Velu's formula, 5 curves,
        Phi_2(j(E),j(E'))=0 exactly in all 5 cases -- beyond both the
        producer's q-expansion self-check and its root-finding code); and
        directly re-executed the full construction pipeline (seed, BFS,
        degree sequence, edge-list) for p=2437, matching exactly. p ≡ 1 (mod
        12), per PF-5's resolution, gave the cleanest possible C-CONNECTIVITY
        anchor in the campaign (epsilon=0 exactly), and it held.
      supported_by: [TASK-20260805-eaf51d, TASK-20260805-2c086d]
    - id: O-3
      statement: >-
        THE REAL-ARM DATA GAP IS REAL, not a shortfall of effort, independently
        confirmed by direct investigation rather than accepted on the
        producer's word. WISDE's per-prime .sage files carry abstract
        maximal-order Z-bases and (N1,N2,N3) Gross-lattice successive minima,
        indexed by conjugacy-class loop position -- NO numeric j-invariant and
        no identifier linking an order type to a specific computed graph
        vertex, anywhere. The Validator fetched and read the WISDE authors' OWN
        GENERATING SCRIPT (deltacomputation.sage) and confirmed it never
        constructs an elliptic curve, a j-invariant, or an isogeny at any
        point: the linkage this contract's delta_E_cross_reference clause
        needed is not merely unpublished, it is NOT COMPUTED BY THE DATASET'S
        OWN PIPELINE. Recovering it requires the full Deuring correspondence
        (curve-to-ideal direction), out of this run's and the prior run's
        budget for the same reason.
      supported_by: [TASK-20260805-eaf51d, TASK-20260805-2c086d]
    - id: O-4
      statement: >-
        THE PRODUCER CORRECTLY REFUSED TO FABRICATE A LABEL ASSIGNMENT. Both
        reviewers confirm this reasoning is sound: a random assignment of
        WISDE's real per-prime delta_E multiset onto the built graph's
        vertices would destroy any true correlation and make the "real" arm
        statistically indistinguishable from another instance of C-NULL-LABEL
        -- producing a number that looked like a result while testing nothing.
        The Red Team flags a cheaper unblocking route the producer did not
        pursue and was not asked to: computing delta_E directly in-session via
        bounded smooth-degree isogeny search (the archived source's own
        method), which sidesteps the hard Deuring curve-to-ideal direction
        entirely, unlike full endomorphism-ring reconstruction.
      supported_by: [TASK-20260805-eaf51d, TASK-20260805-5dba23]
    - id: O-5
      statement: >-
        A CONTRACT DEFECT IS WARRANTED, FROM TWO CONVERGING, COMPLEMENTARY
        ANGLES. Red Team's finding (root cause): this WAS catchable before
        freeze. EXP-SSIQ-4de240's own execution report -- committed over an
        hour before this contract was drafted, and NAMED as this contract's
        own delta_E_cross_reference source -- already stated WISDE indexes by
        abstract order type, not j-invariant, and that recovering per-vertex
        linkage means reimplementing the authors' pipeline. Neither the
        drafting Coordinator nor the pre-freeze Red Team re-read what that
        already-committed document said; the pre-freeze review's own
        "attacked and held" section conflated the WISDE vertex-COUNT check
        with the per-vertex LABEL mechanism. This is a RE-READ failure, a
        different species from GD-4 (a wrong obstruction) and GD-5 (an
        uncalibrated estimator) -- both of those were fresh-calculation
        failures; this one is a failure to consult evidence already on hand.
        Validator's finding (downstream, narrower): even granting the gap was
        undiscoverable before freeze, the frozen decision_rule_frozen_before_data
        defines VOID ONLY for a C-NULL-LABEL/C-CONNECTIVITY failure -- neither
        of which failed here. This run's actual outcome (M-GAP structurally
        uncomputable, both named controls passing) is a FOURTH, unforeseen
        category, absorbed into the generic invalidation_rules
        underspecification clause and then reported under the same VOID label
        the decision rule reserves for a different situation. A downstream
        reader filtering by decision_branch cannot distinguish "signal
        contaminated by structure" from "no data existed to test either
        direction" -- materially different epistemic situations. The
        execution_report's own internal field M_GAP_real_status: BLOCKED is
        the more precise term and existed but was not surfaced to the
        top-level label.
      supported_by: [TASK-20260805-5dba23, TASK-20260805-2c086d]
    - id: O-6
      statement: >-
        DESPITE THE VOID, THIS RUN LEFT REUSABLE, VALIDATED INFRASTRUCTURE. The
        Red Team names two: C-CAL-GAP is now a validated, reusable calibration
        harness for any future contract that needs to sign-test a difference
        of exponents -- independent of whether this run's real arm ever
        completes. The graph-construction pipeline (Phi_2 root-finding, BFS
        enumeration, C-CONNECTIVITY/C-EDGELIST) is now validated, reusable
        tooling for a future L4 attempt that solves the labelling problem by
        another route.
      supported_by: [TASK-20260805-5dba23]
    - id: O-7
      statement: >-
        A GENUINE STRUCTURAL FINDING SURVIVED INDEPENDENT VERIFICATION. PD-2 (a
        small number of vertices per prime, 0-3 of 203-1800, have a double
        edge to their own Frobenius conjugate) was independently reproduced
        for p=2437 by the Validator (2 vertices, algebraically confirmed as
        Frobenius conjugates under p=2437) and confirmed orthogonal to M-DEGSEQ
        (which checks total multiset degree = 3, unaffected by neighbour
        distinctness). The Red Team reads this as showing CGL's "no
        automorphism implies simple graph" argument, which PF-5's resolution
        relied on to narrow the confirmatory prime set to p = 1 (mod 12), is
        NECESSARY BUT NOT SUFFICIENT: a distinct mechanism (Galois action on
        E[2]) produces multiplicity even in the residue class chosen
        specifically to avoid it. This does not reopen PF-5 (the degenerate
        j=0/j=1728 case still does not arise at p=1 mod 12; PD-2 is a
        different, milder multiplicity source that leaves total degree
        correct), but it is recorded because it narrows how strong PF-5's
        underlying "simple graph" claim actually was.
      supported_by: [TASK-20260805-eaf51d, TASK-20260805-2c086d, TASK-20260805-5dba23]
    - id: O-8
      statement: >-
        A NARROW, NON-CONFIRMATORY ARTIFACT-ACCURACY DEFECT WAS FOUND, caught
        only by the Validator's re-execution rather than by inspection.
        command.txt claims a standalone invocation of calibration_synthetic.py
        "was actually executed"; running it exactly as committed raises an
        ImportError from a genuine circular import between
        calibration_synthetic.py and descent_hitting_time.py. The actual
        primary_execution command that produced raw-result.json was
        independently re-run and reproduces bit-for-bit, so NO REPORTED METRIC
        IS AFFECTED -- but an artifact asserting a command "was actually
        executed" when it currently fails is a finding under AGENTS.md rule 9
        and is recorded rather than silently passed over.
      supported_by: [TASK-20260805-2c086d]
  inference: >-
    Lever L4's real-arm test could not be run. This is neither support nor
    weakening of H-SSIQ-18dc91: the frozen instrument, once genuinely
    calibrated and once its graph-construction pipeline was independently
    validated, hit a data-availability wall that predates this batch and was,
    on the Red Team's finding, discoverable from a document already in this
    repository. L4 remains OPEN, its status unchanged from BATCH-002
    (highest priority, the only lever whose ceiling meets the goal's target),
    with a validated instrument now ready for reuse once the labelling problem
    is solved by a cheaper route than full Deuring reconstruction.
  boundaries:
    - >-
      H-SSIQ-18dc91's real-arm prediction is UNTESTED, not weakly tested and
      not refuted. No claim about a delta_E-gradient existing or not existing
      is supported by this record in either direction.
    - >-
      NO CLAIM IS MADE ABOUT WHETHER A p^{1/4} ALGORITHM EXISTS, is likely, or
      is near. asymptotic_claim stays null throughout, as the frozen contract
      and hypothesis require.
    - >-
      PD-2 does not reopen PF-5's degenerate-vertex resolution; it narrows the
      strength of the underlying "simple graph" argument without contradicting
      its operative conclusion (no j=0/j=1728 degeneracy at p=1 mod 12).
    - >-
      Toy scale throughout: p up to 21601 (15 bits), graphs up to 1800
      vertices. Nothing transfers to cryptographic scale.
    - >-
      Evidence strength capped at preliminary, campaign-wide and unchanged by
      this batch: independence remains session-only, and both reviewers
      report that this environment's orchestration.adapter doctor --probe
      cannot verify ANY backend, so even same-vs-different model status across
      sessions in this batch is asserted, not measured -- a sharper statement
      of the cap than prior batches carried.
  unresolved_confounds:
    - >-
      THE LABELLING PROBLEM ITSELF IS UNRESOLVED. Whether a cheaper route than
      full Deuring correspondence (the Red Team's proposed direct in-session
      smooth-degree isogeny computation of delta_E) can unblock the real arm is
      the open question this evidence record cannot answer.
    - >-
      The VOID-taxonomy gap (O-5, Validator half) is unresolved: no successor
      contract template yet distinguishes VOID-CONTROL-FAILURE from
      VOID-DATA-UNAVAILABLE/BLOCKED as separate decision-rule branches.
    - >-
      command.txt's non-reproducible standalone-invocation claim (O-8) is
      unresolved -- not repaired in place per AGENTS.md rule 4, needs a
      follow-up artifact correction.
    - >-
      Model independence remains absent and, per both reviewers' explicit
      probe attempts, is now confirmed UNVERIFIABLE in this environment rather
      than merely unattempted.
