      assignments of all 12 instances; the degree-4 top form against
      top(ell_1^2) top(ell_2^2); every rank against sympy DomainMatrix over
      GF(p)).
    - >-
      O-2 (the surviving closed form). d_ff = m 2^{m-1} + floor((s - 2^{m-1})/2)
      + 1 takes the values 5, 5, 6, 6, 7 at m = 2, s = 2..6 and 13, 13 at m = 3,
      s = 4, 5 - identical across every curve, target and prime tested, strictly
      below the measured support-matched null at the five cells where a strict
      early fall is possible, and reproduced exactly by a curve-free
      block-factored null. It survived every attack in this round, including an
      exhaustive small-prime sweep (26,000 instances at (2,2,3), 0 deviations).
    - >-
      O-3 (R1, THE COUNTEREXAMPLE, stated at full strength). The identity
      fall_dim(d_ff) = m[C(s,a_0) - C(s,a_0+e)] of (D4) is stated WITHOUT the
      hypothesis it needs - linear independence of the rows mu S~ in B - and is
      FALSE inside the record's own quantifier range. At p = 13,
      E: y^2 = x^3 + 12x + 3, x_R = 11, m = 2, s = 2 the measured pair is
      (5, 3), not (5, 4); at p = 19, a = 2, b = 15, x_R = 9 likewise. Both
      curves pass the experiment's own filter, and at p = 13 all four window x
      are on the curve and x_R has 8 decompositions. The exact mechanism is
      fall_dim(D) = dim ker(m_{S~_top}) - dim Rel_D with
      Rel_D = {h of degree D - delta vanishing on supp(S~)}. The repaired
      statement - "whenever no nonzero squarefree form of degree a_0 vanishes on
      supp(S~); a sufficient condition is N_sol < 2^{ms - a_0}" - is TRUE at
      every draw in the package, and the bound is SHARP: the counterexample sits
      at N_sol = 8 = 2^{4-1} exactly. Observed N_sol in the package is in
      {1, 2, 6} against thresholds 8, 32, 64, 256, 512, 2^11, 2^14, and
      full_rank equals rows at 272 of 272 Semaev layers and 1490 of 1490 NULL-1
      layers.
    - >-
      O-4 (R1, the boundary cells). (D6)/P3's "the block-factored null
      reproduces d_ff AND fall_dim exactly, FORCED 0 at every cell" is not
      merely unobserved at (2,2,2) and (3,2,4) - it is UNSATISFIABLE there. At
      s = e the homogeneous block-factored null is a scalar times the product of
      ALL ms variables, whose support in {0,1}^{ms} is one point, so full_rank
      is 1 for every D and fall_dim = 1 is forced for any m, s, p. The clause
      "and fall_dim" was added between IDEA-20260903-e1e38b (D6), which claims
      only d_ff, and the hypothesis record. The producer set
      P3_null2_minus_semaev_all_zero FALSE (60 entries at fall_dim_diff -3) and
      F4_null1_falls_at_semaev_value_any_seed TRUE at the gate cell, honestly.
    - >-
      O-5 (R1, the diagnosis, and the round's convergence). The discrepancy is
      HOMOGENEITY, not curve information. An INHOMOGENEOUS block-factored null
      with no curve, no target and no x_R returns (5, 4) and (13, 12) exactly at
      sub-top densities 1.0 and 0.25, and a dense random polynomial with no
      block structure returns (5, 4) and (13, 12) at the boundary cells. The
      validator, independently and without contact, reports that its own
      curve-free block-factored nulls reproduce the Semaev value at the deciding
      cell. Two blinded reviewers reached the same localisation from different
      directions.
    - >-
      O-6 (R1/OBJ-3, dynamic range). At the boundary cells delta = n = ms, so
      A_delta is one-dimensional and A_{delta+1} = 0, giving top_rank = 0 and
      d_ff = n + 1 for EVERY generator of degree delta. The measured agreement
      of the Semaev arm, NULL-1 and NULL-2 on d_ff there is DEGREE EXHAUSTION,
      not a degree fall, and could not have come out otherwise. Two of the seven
      cells in the residual table carry zero dynamic range on the mechanism
      question and are instrument checks.
    - >-
      O-7 (R2, a stated ground that is false). (D4) justifies full rank by "for
      p > s every binom(k-i, t-i) is a positive integer below p". Computed
      witness: s = 10, j = 4, e = 2, p = 11 has diagonal entries 1, 3, 6, 10, 15
      with 15 >= p, so the stated reason is false - while the rank is
      nevertheless full (210). The correct reason under p > s is Kummer/Lucas
      (r + e <= s < p implies p does not divide binom(r+e, e)). The source
      proposal IDEA-20260903-e1e38b (D4) states the correct bound
      (binom(s, floor(s/2)) < 2^s <= p) and THE LEDGER RECORD LOST IT.
    - >-
      O-8 (R2, the scope of the refutation). Refuting IDEA-20260830-84cdb7's H1
      (boundedness in s) requires the LOWER bound only, hence H-WIL/Wilson only,
      so the s <= 8 direct check contributes NO UNCONDITIONAL REFUTATION - no
      finite s-range can refute a boundedness statement. The unconditional
      content is exactly "d_ff takes the closed-form values 5, 5, 6, 6, 7 at
      s = 2..6, m = 2, two primes". Exactness is verified directly at e = 2 for
      s <= 8 (package) and s <= 10 (review), and at e = 4 for s <= 10 (review),
      at every prime tested with p > s, and is conditional on Wilson beyond. The
      review's p-sweep shows the H-WIL control has real dynamic range: 79 rank
      drops at e = 2 and 32 at e = 4, ALL at p <= s and NONE at p > s.
    - >-
      O-9 (R3, the citation defect and the new positive result). The archived
      EXP-ALPF-011 column [4, 4, 4, 12] is a GENERATOR-DEGREE LIST, not a
      per-variable profile of S_4 - decisive because the entry becomes
      [5, 5, 5, 12] when |FB| = 5, and a per-variable profile cannot track the
      factor base. HEUR-001's random_model_justification is factually wrong as
      written and the m = 3 claim rests entirely on the package's own symbolic
      run, which is sound and which the reviewer reproduced (c = 1, three random
      parameter sets). POSITIVE: H-TOP at m = 4, declared not attempted in
      stage0-htop.md 2.2, is NOW CHECKED - deg_{(x1..x4)} S_5 = 32 and the
      coefficient of x_1^8 x_2^8 x_3^8 x_4^8 is 1 in six random (a, b, x_R),
      with x_R symbolic, and with a, b symbolic (no free symbols in the leading
      coefficient). m >= 5 remains an open symbolic obligation. No objection to
      the sympy substitution for the absent Sage: the contract names the
      construction, not a CAS, and sympy's resultant over Z[a, b, x_R] is exact
      with no termination heuristic.
    - >-
      O-10 (R4, what d_ff alone can certify). A non-tensor top form
      "ell_1^2 ell_2^2 + ell_1^3 ell_2" with dense sub-top terms has a rank-2
      coefficient matrix, so (D4) does not apply - and it still gives d_ff = 5,
      with fall_dim 2 rather than 4. d_ff ALONE THEREFORE DOES NOT IDENTIFY
      BLOCK STRUCTURE, and F5's converse reading is too strong. The mechanism
      claim must be carried by the PAIR (d_ff, fall_dim) or by the kernel
      dimension. The plan's own object "ell_1^3 ell_2 + ell_1 ell_2^3" gives
      d_ff = 6 and satisfies the declared failure signature. The executed
      all-six-shared mixed-block reading returns (6, 14) on 3 independent draws
      against the package's 36 of 36 at 6; the literal 3-shared reading,
      recorded as degenerate and not run, gives generator degree 3 and (4, 3).
    - >-
      O-11 (R4, the confound). CTRL-CONFOUNDERS-NAMED's "excluded by
      construction" is wrong: no metric reads an ideal invariant directly
      (verified in run_pfdr_5726af.py - N_sol and d_solve appear only in
      sol_covariate, and d_solve is None at every draw), but the solution set
      reaches full_rank through the row-collapse term. It is excluded
      NUMERICALLY at the tested cells and demonstrably NOT excluded in general,
      which is the channel through which O-3's counterexample arrives. No
      Groebner basis, reduced-basis degree or CAS termination event appears
      anywhere in the run script or the meter.
    - >-
      O-12 (R4, the convention and the dead comparator). c_D = C(n,D) -
      C(n,D-delta) is negative iff D >= floor((n+delta)/2)+1 and zero at the
      balanced degree, so IDEA-20260830-84cdb7's ceil convention names a degree
      at which a generic object does NOT fall; NULL-1 falls at the contract's
      value in 60 of 60 seeds at each m = 2 cell and 10 of 10 at each m = 3
      cell, and no scored comparison changes because every scored comparison is
      against the measured null. Separately, 84cdb7's formula uses generator
      degree 2m, correct only at m = 2, so the printed D_null_84cdb7 column at
      (3,2,4) and (3,2,5) (9 and 11) is the null of a system that does not exist
      and must be dropped or annotated. Harmless because never scored.
    - >-
      O-13 (R4/CC-1, the cost consequence of (D7), recomputed). With
      T_solve >= columns^omega and columns about B^{m H(1/(2m))}, the bound is
      sigma >= omega m H(1/(2m))/(m-1), which at omega = 1 is 1.623 (m 2), 0.975
      (m 3), 0.725 (m 4), 0.586 (m 5), 0.497 (m 6), 0.433 (m 7), 0.318 (m 10) -
      so "sigma >= 1" is true only at m = 2, and asymptotically the bound falls
      BELOW IDEA-20260808-812554's admission threshold 1 - 2/(m-1) from m = 6
      upward. The CONCLUSION survives for a reason the record does not give: the
      standing assumption 2^s <= p caps s and the regime condition s >= 2^{m-1}
      caps m (at 9 for s = 256, at 7 for s = 64), and at those finite points the
      exact column count gives sigma >= 1.015 (3,256), 0.901 (4,128), 0.818
      (4,256), 0.779 (5,256), 0.859 (6,256), 1.031 (7,256), 1.125 (9,256).
      WHAT REMAINS OPEN: for m >= 10 at 256-bit p, s < 2^{m-1} and the
      presentation is in the hypothesis's own excluded regime, so the closure
      reaches nothing there - and 812554's table says large m is exactly where
      the admission threshold is loosest. The closure is weakest where the stake
      is most attractive, and that belongs in its forward guidance.
    - >-
      O-14 (V3, replication counting). The twelve declared draws cover ELEVEN
      distinct (p, a, b, x_R) instances: at p = 65537, curve seed 1103, target
      seeds 1 and 2 both give x_R = 47685. Two further draws (p = 65537, curve
      1102) certify only through a doubling P + P and have N_sol = 1 rather
      than 2. The deciding cell's replication count is 12 draws over 11 distinct
      instances on 6 curves.
    - >-
      O-15 (V2, prediction integrity from git rather than from the producer's
      word). The contract carrying the deciding-cell prediction was committed at
      c5742969 on 2026-09-03T19:42:47Z and is byte-identical at HEAD (empty
      diff); the first run started 20:34:34Z, about 52 minutes later. The
      prediction cannot have been fitted to the data. Caveat recorded rather
      than absorbed: stage0-predictions.yaml was itself first committed WITH the
      run package, so its own "written_before_any_official_rank: true" is
      self-attested; the binding evidence is the earlier contract commit. That
      file also discloses a pre-registration scratch benchmark that printed rank
      profiles at m = 2, s in {3,4,5,6}, p = 4099 on an ad-hoc curve before it
      was written - disclosed by the producer, neutralised by the contract
      commit.

  inference: >-
    Compose V1-V4 with R0-R4 and the hypothesis splits. Its principal claim -
    a closed form for the first fall degree of the d = 2 digit presentation,
    curve- and target-independent, reproduced by a curve-free block-factored
    null and strictly below the support-matched null - is confirmed at every
    tested cell by a blind re-derivation, a full ladder, two m = 3 cells, an
    independent engine in a sibling experiment, and an exhaustive small-prime
    sweep that failed to break it. Its fall_dim clause is FALSE as universally
    quantified, refuted by a counterexample certificate at an explicitly
    exhibited curve and target that pass the experiment's own filter, with the
    mechanism localised exactly and a repaired statement supplied that is true
    at every draw in the package. Its boundary cells test neither claim. Its
    exactness justification is false as written while its conclusion is right
    for a different reason. Its refutation of 84cdb7's H1 is conditional on
    Wilson and unconditional at no s. Its exponent closure holds at the finite
    parameters that exist and does NOT reach m >= 10, where the presentation is
    out of its own regime. And d_ff alone does not identify block structure. The
    net direction is weaken, and both halves are recorded at full strength.

  largest_justified_claim: >-
    For the d = 2 digit presentation with a single Semaev generator, in the
    squarefree ring B over F_p with the per-layer meter convention, at
    (m, s) in {(2,2),(2,3),(2,4),(2,5),(2,6),(3,4),(3,5)} and p in {4099,
    65537}, over the 3 curves and 2 targets tested: the first fall degree is
    exactly d_ff = m 2^{m-1} + floor((s - 2^{m-1})/2) + 1 = 5, 5, 6, 6, 7, 13,
    13, identical across every curve, target and prime, strictly below the
    measured support-matched null at the five cells where a strict early fall is
    possible, and reproduced exactly by a CURVE-FREE block-factored null - so
    THIS IS NOT A STATEMENT ABOUT SUMMATION POLYNOMIALS, ELLIPTIC CURVES OR THE
    ECDLP but about the block-tensor structure of the digit presentation. The
    fall dimension equals m[C(s,a_0) - C(s,a_0+e)] at every draw tested and in
    general ONLY when no nonzero squarefree form of degree a_0 vanishes on
    supp(S~), a condition that holds whenever N_sol < 2^{ms - a_0} and that
    FAILS at explicitly exhibited instances, so the "for all p, all curves, all
    targets" form of that clause is false. H-TOP holds at m = 2, 3, 4 and is
    open at m >= 5. Nothing here moves any attack cost.

  boundaries:
    - >-
      B-1. A first fall degree is not a solving degree, not a cost and not an
      exponent. Nothing on any attack axis moves; Pollard rho is unchallenged
      and unapproached.
    - >-
      B-2. Toy scale throughout: p in {4099, 65537}, at most 64 columns at the
      deciding cell, s <= 6, m in {2, 3}. The general-s claim rests on Wilson's
      formula, which no one in this round opened.
    - >-
      B-3. THE RESULT IS NOT ABOUT ELLIPTIC CURVES. A curve-free, target-free,
      x_R-free block-factored null reproduces (5, 4) and (13, 12); a dense
      random polynomial with no block structure reproduces the boundary-cell
      values; and EXP-PFDR-cbdefb's non-curve cubic arm reproduces the Semaev
      pair at every cell from a second engine. Any downstream sentence of the
      form "the Semaev system at (2,2,3) behaves thus" must read "any generator
      with this block-tensor top form behaves thus".
    - >-
      B-4. Two of the seven residual-table cells (s = 2^{m-1}) carry zero
      dynamic range and are instrument checks, not evidence on the mechanism.
    - >-
      B-5. The deciding cell replicates over 11 distinct instances, not 12.
    - >-
      B-6. No impossibility is claimed. No bound uniform in s is refuted by the
      data alone, and the refutation of 84cdb7 H1 is conditional on Wilson's
      rank theorem and unconditional at no s.
    - >-
      B-7. Judgement across this round is correlated: producer and both
      reviewers report the same model family, one with model_verified true only
