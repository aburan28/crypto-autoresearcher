      cited at snippet level.
    - >-
      UC-5. A contract wording inconsistency, harmless at m = 2: D_null is
      written floor((m s + m e)/2) + 1 in the frozen prediction file and
      floor((m s + 2 m)/2) + 1 in CTRL-CONFOUNDERS-NAMED. The two agree at m = 2
      and disagree at m = 3 (13 versus 10); every recorded D_null follows the
      first form, so no scored comparison is affected.
    - >-
      UC-6. The unstated heuristic behind (D4)'s fall_dim clause - row
      independence in B - is doing real work and is unnumbered. Under this
      program's own standard it should be a numbered HEUR with the rigorous
      bound N_sol < 2^{ms - a_0} attached, and with the observation that the
      object it concerns has a STRUCTURED zero set (the decomposition set),
      which is precisely why the random model can fail.

  obstruction:
    statement: >-
      The first fall degree of the d = 2 digit presentation is a closed form
      that GROWS in both m and s - d_ff = m 2^{m-1} + floor((s - 2^{m-1})/2) + 1
      - so no degree bound constant in the shape parameters is available to this
      presentation. This is a property of the OBJECT: the digit-substituted
      generator's top form is the tensor product of the block linear forms
      raised to 2^{m-1}, which fixes both the m 2^{m-1} offset and the
      floor(s/2) growth.
    quantity: >-
      d_ff, the first fall degree measured by the per-layer graded-rank meter
      under the frozen convention "per_layer, leading_forms=False,
      frobenius=False, rows mu*S~ with deg mu = D - delta", read per draw across
      the (m, s) ladder.
    value: >-
      d_ff = 5, 5, 6, 6, 7 at m = 2, s = 2..6 and 13, 13 at m = 3, s = 4, 5.
      Exact integers with ZERO spread: the manifests record spread [5] and [4]
      at the deciding cell, and the same single value across all 3 curves, 2
      targets and 2 primes at every cell (12 draws per m = 2 cell, fewer at
      m = 3). Error bars are therefore identically zero within the tested
      design, which is itself the reason the slope statistic of the sibling
      experiment EXP-PFDR-cbdefb has no sampling content. The corresponding
      offset against the support-matched null is D_null - d_ff = 0 at s = 2,
      1 at s = 3 and 4, and 2 at s = 5 and 6 - it GROWS, which is the decay
      behaviour a real effect owes.
    measured_by:
      - RUN-PFDR-5726af-m2-s2-gate
      - RUN-PFDR-5726af-m2-s3
      - RUN-PFDR-5726af-m2-s4
      - RUN-PFDR-5726af-m2-s5
      - RUN-PFDR-5726af-m2-s6
      - RUN-PFDR-5726af-m3-s4
      - RUN-PFDR-5726af-m3-s5
    scope: >-
      d = 2, (m, s) in {(2,2),(2,3),(2,4),(2,5),(2,6),(3,4),(3,5)},
      p in {4099, 65537}, 3 curve seeds x 2 target seeds per cell (11 distinct
      instances at the deciding cell), the frozen per-layer convention, D_max =
      D_null + 1 at every cell so no cell is censored. The closed form is
      claimed nowhere outside that ladder; its extension to larger m and s is
      the hypothesis, not the measurement.
    resource_check:
      examined: true
      reading: >-
        EXAMINED, AND A RESOURCE WAS FOUND. Read as a refutation, the growing
        d_ff closes IDEA-20260830-84cdb7's H1 and Outcome 3 at d = 2. Read the
        other way round, the SAME measurement is the exact input a cost model
        needs and did not have: it supplies the degree column
        D_0(s) = 4 + floor(s/2) at m = 2 and the floor m 2^{m-1} at higher m,
        which is what EXP-PFDR-c04716's constant D_0 parameter must be replaced
        by. That reading is taken up in this round by EV-PFDR-99c699 and
        DEC-20260904-d47cd2, and is promoted as KN-FIND-0618ab. A second
        reading, recorded because it cuts against the obvious one: the offset
        m 2^{m-1} does NOT grow with the factor base, unlike
