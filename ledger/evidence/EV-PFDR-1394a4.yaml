        presentation, so at fixed m the digit presentation's degree obstruction
        is a constant in s where the direct presentation's is exponential - a
        real structural gain, and the reason this record does not read the
        growth as closing the presentation. No new IDEA-* or H-* record has yet
        been minted on either reading; both are named here rather than assumed
        to exist, and the second is carried into DEC-20260904-1e27a2's
        next_actions.
