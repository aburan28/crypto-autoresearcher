    - >-
      UC-2. Whether the row-collapse exception exists at a STRICT-early-fall
      cell or only at the boundary cells is UNDETERMINED. The reviewer found it
      twice at (2,2,2) and never in 26,000 exhaustive instances at (2,2,3),
      which is suggestive and not decisive. It determines whether the repaired
      (D4) needs its N_sol side condition only at s = 2^{m-1} or everywhere.
    - >-
      UC-3. H-TOP at m >= 5 is an open symbolic obligation. The general argument
      offered ("the resultant recursion multiplies leading coefficients") is
      GENERIC, and the degenerate specialisations the reviewer hit (c_1 = c_2,
      x_3 = x_4 kill the leading T-coefficient) are exactly where genericity
      fails, so the general claim needs the non-vanishing of both leading
      T-coefficients and is not established.
    - >-
      UC-4. Wilson (1990) was not opened - two WebSearch queries and two
      WebFetch attempts failed (HTTP 403, PDF text extraction unavailable).
