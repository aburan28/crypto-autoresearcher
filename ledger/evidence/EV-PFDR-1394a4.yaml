  observations:
    - >-
      O-1 (V1, BLIND, the load-bearing measurement). The Semaev arm gives
      (d_ff, fall_dim) = (5, 4) on all 12 declared instances with
      (full_rank, top_rank) = (1,1), (6,2), (15,1) at D = 4, 5, 6 and (20, 0) at
