  claim_tier: toy
  proof_status: empirical_only
  proof_status_note: >-
    A second exhaustive measurement, independently reproduced via a
    DIFFERENT classification method (not merely re-executed) by the
    Validator, plus a Red Team derivation that found a real arithmetic
    bug in the Executor's own tolerance check and a structural reason
    the R3-exact-value follow-up test could not have been decisive on
    this specific object.

  proof_refs:
    - experiments/EXP-MONO-e102a3/reviews/validator/validation-report.yaml (independent J1/J2, cross-method reproduction via pure root-counting instead of the Executor's discriminant-formula classifier)
    - "experiments/EXP-MONO-e102a3/reviews/red-team/red-team-report.yaml (J3 traced and fixed the Executor's own SE bug; J4 structural denominator analysis of the R3 test)"
    - ledger/evidence/EV-MONO-344589.yaml (the first object's own result, for comparison)

  summary: >-
    EXP-MONO-e102a3 measured a second (curve,R) at p=101: E':y^2=x^3+x+2
    (j=4, order 100), R' of true order 50. Stage 1's corrected exact-
    tolerance controls both matched EXACTLY (independently reproduced).
    R8 passed. Stage 0: R1=57/115, R2=58/115 (R1+R2=1 exactly, the same
    combinatorial identity as before, confirmed independently), R3=1523/
    10005, irreducible density=3436/10005 -- decisively excluding
    trivial, C_2, and A_3 (the same logic as the first object, orders of
    magnitude away from those predictions, unaffected by anything
    below).

    Red Team's own independent arithmetic audit (J3) found a REAL BUG in
    the Executor's own "within 3 standard errors" claim: the script
    computed a single Bernoulli(p=0.5) standard error and reused it,
    unchanged, to test R3's own target of 1/6 -- whose correct standard
    error is smaller. Recomputed correctly (SE for p=1/6, n=10005):
    the observed R3 deviation is 3.88 standard errors, OUTSIDE a naive
    3-sigma band, not inside one as the Executor claimed. Red Team
    further showed the entire naive-iid-sampling framing is conceptually
    wrong for an EXHAUSTIVE census in the first place (a point the FIRST
    object's own red-team review already made and which was not carried
    into this run's own Stage-0 interpretation, though it correctly was
    carried into the Stage-1 control fix). Under HEUR-CHEB-1's own
    stated "relative O(p^-1/2)" Weil-style framing, the deviation IS
    contained (87% of that envelope) -- but Red Team derived, via
    explicit error-propagation through a ratio of two separately Weil-
    bounded quantities, that this relative form does NOT automatically
    follow and that a naive combination could give a materially looser
    (6x) absolute bound instead; no theorem establishing the tighter
    form for this specific S_3-cover exists. Bottom line, in Red Team's
    own words: "marginally consistent, worth a flag -- not comfortable,
    not genuine doubt."

    Red Team's own J4 additionally found that per-invariant deviation
    growth from the first to the second object is NOT uniform (R1: 0.92x
    the first object's deviation; irreducible density: 1.58x; R3: 8.75x)
    -- concentrated specifically in R3, worth naming rather than
    averaging away. Most importantly, Red Team found a STRUCTURAL reason
    the "does R3 equal 17/101 exactly" follow-up test could not have
    been decisive on this specific object regardless of whether an exact
    (p+1)/(6p)-type law actually governs V_R's own split density: the
    reduced denominator of this object's own R3 (10005 = 3x5x23x29) has
    NO factor of 101, so 1523/10005 could NEVER equal k/101 for any
    integer k -- whereas the first object's own denominator (9999 =
    3^2x11x101) DID have a factor of 101, which is why 17/101 was even
    representable there. The non-match on this object is therefore
    STRUCTURALLY GUARANTEED independent of the underlying dynamics, and
    does NOT settle whether the first object's own exact match was a
    genuine law or a coincidence -- this Coordinator's own earlier,
    provisional framing (in the experiment's own preregistered outcome
    naming) that a non-match would "confirm" the first match was
    object-specific is WITHDRAWN as premature; Red Team's own proposed
    denominator-independent reformulation (checking n*R3 - n/6, or an
    equivalent normalization immune to reduction artifacts) is the fair
    version of this test, not yet run.

  claim_tier: toy
  what_this_supports: >-
    (1) Trivial, C_2, and A_3 remain decisively excluded on a SECOND,
    independent object -- this conclusion is robust and unaffected by
    the standard-error dispute below (the relevant deviations are
    orders of magnitude, not marginal). (2) The Executor's own "within 3
    SE" claim was based on an arithmetic bug (wrong target probability
    used in the standard-error formula), independently found and
    corrected by Red Team -- a real, disclosed defect, though one with
    no effect on the group-exclusion conclusion. (3) The relevant
    theoretical question (is V_R's own deviation from 1/6 governed by a
    Weil-style RELATIVE O(p^-1/2) envelope, as HEUR-CHEB-1 assumes, or
    something looser) remains UNPROVEN for this specific object, and Red
    Team's own attempted derivation found the relative form does not
    follow automatically from the individually-Weil-bounded pieces.

  what_this_does_not_support: >-
    Does NOT confirm G_R=S_3 with high confidence -- the second object's
    own R3 deviation is honestly "marginally consistent, worth a flag"
    per independent Red Team assessment, not comfortably consistent. Does
    NOT settle whether the first object's own R3=17/101 exact match was
    a genuine law or a coincidence -- the follow-up test designed to
    check this was, per Red Team's own structural finding, incapable of
    deciding the question on this specific object regardless of the
    truth. Does NOT support any relation-rate, cost, exponent, or
    cryptographic-scale claim.

  independent_review:
    validator:
      report: experiments/EXP-MONO-e102a3/reviews/validator/validation-report.yaml
      verdict: >-
        J1 holds: independent curve/point/census verification via
        entirely fresh code, using a DIFFERENT classification method
        (pure root-counting vs. the Executor's own discriminant-formula
        classifier) than the Executor used -- genuine cross-method
        corroboration, not merely re-execution. Exact match on every
        reported quantity, including the R1+R2=1 identity. J2 confirmed:
        1523/10005 != 17/101 by exact cross-multiplication, difference
        -16262/1010505 (fully reduced).
    red_team:
      report: experiments/EXP-MONO-e102a3/reviews/red-team/red-team-report.yaml
      verdict: >-
        J3: traced the Executor's own SE claim to a specific code bug
        (run_galois_cubic_census_v2.py, a single max-variance SE reused
        for a non-0.5 target); recomputed correctly, found the true
        result is 3.88 SE from the naive target (outside a 3-sigma band,
        not inside one); assessed the theoretically preferred relative-
        Weil-style envelope as containing the deviation (87%) but
        UNPROVEN to be the correct form for this specific measurement.
        Bottom line: marginally consistent, flagged, not confirming.
        J4: exclusion of named rivals remains decisive; deviation growth
        is concentrated in R3 specifically (8.75x); found the structural,
        denominator-driven reason the R3-exact-value test could not have
        been decisive here, and proposed a fair, denominator-independent
        reformulation as the next concrete test.
    independent_session: true
    blindness_confirmed: >-
      Both reviewers launched as fresh subagents in one dispatch message.
      Validator confirmed the sibling Red Team directory did not exist
      when it wrote its own report. Red Team confirmed the same in the
      other direction.

