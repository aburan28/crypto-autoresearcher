  - RUN-ICINV-e0cd8f-m3class
  type: empirical
  direction: supports
  direction_note: >-
    SUPPORTS H-ICINV-d5e351's own literal claim (H1: "the exact symbolic
    Semaev geometry of a curve is either an isogeny-class invariant or it is
    not, and this hypothesis holds that the question is decidable at zero
    statistical cost" -- a methodological/decidability claim, NOT a
    directional one). The comparison WAS decisive: falsification condition
    F4 fired cleanly (at least one invariant family varies within the
    class, surviving the gauge recheck and the second-backend cross-check),
    exactly as H1's own pre-registered structure anticipated as one of two
    archivable branches. This direction label is deliberately narrow and
    must not be read as endorsing the CONSEQUENCE the frozen contract's
    success_criterion attaches to an F4 firing -- see strength_note and
    this decision's own rationale (DEC-20260811-a3398a) for why that
    consequence is NOT triggered by this specific evidence without further
    work.
  strength: preliminary
  strength_note: >-
    CAPPED AT `preliminary`, NOT `replicated` OR `strong`, FOR REASONS
    BEYOND THE USUAL SINGLE-CLASS/SINGLE-PRIME SCOPE LIMIT. Two independent
    review-adversarial sessions (validation_report.md, redteam_report.md)
    and this Coordinator, working independently of both, each derived from
    scratch (via three different methods: two independent sympy Groebner
    basis computations and one direct-factorisation empirical cross-check)
    that the ONE varying invariant family (`elimination_factor_partition`,
    66/138 class curves at partition (1,1,1), 72/138 at (1,2), surviving
    gauge and second-backend controls) is not a new algebraic-geometric
    signal: it is, by exact symbolic identity, the classical rational
    2-torsion factorisation type of the curve, recorded in full in
    KN-FIND-ddd982. This exact quantity was already measured on this exact
    class in BATCH-cb71b5 with the identical 66/72 split, and is the
    explicit subject of ledger/hypotheses/H-ICINV-6c7920.yaml (a sampling-
    bias nuisance covariate, not a discovery, in that record's own framing).
    Separately, both independent reviews flag that the SIX OTHER,
    genuinely-Jacobian-specific invariant families (S_3 support, singular
    locus dimension and degree, regularity, Betti table) were found
    constant on BOTH the 138-curve class AND its 138-curve control set at
    IDENTICAL values -- exactly the condition the contract's own
    falsification criterion F2 treats as a refutation of curve-class-
    specific informativeness for those families ("the constancy is a
    property of S_3's shape, not of the isogeny class"), a caution the
    run's own verdict-computation code never surfaced because the overall
    routing (CLASS-VARYING) is driven by the seventh, now-explained family
    alone. Taken together: of seven measured quantities, six show a
    pattern the contract's own rules read as UNinformative about isogeny-
    class geometry when isolated, and the seventh is old news. This is a
    procedurally flawless, triple-independently-verified execution whose
    substantive content, once correctly identified, does not establish
    what a bare "CLASS-VARYING" headline would suggest.
  claim_tier: toy
  certificate_refs: []
  proof_status: derivation
  proof_refs:
  - knowledge/findings/KN-FIND-ddd982.md
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-d7e255/execution/EXP-ICINV-e0cd8f/validation_report.md
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-d7e255/execution/EXP-ICINV-e0cd8f/redteam_report.md
  observations:
  - >-
    Six of seven primary invariant families (S_3 monomial support=13,
    singular-locus dimension=0, singular-locus degree=6, Castelnuovo-Mumford
    regularity=5, elimination-polynomial degree=3, one shared graded Betti
    table) are constant across all 138 class members AND all 138 control-set
    members, at identical values on both sets. No curve in either set shows
    Koszul degeneration (koszul_degeneration=False everywhere), so the
    constancy is not a trivial regular-sequence artifact -- but per F2 it is
    also not evidence of isogeny-class invariance, since a random-curve
    control reproduces it exactly.
  - >-
    The seventh family, elimination_factor_partition, varies within the
    class (66/(1,1,1), 72/(1,2), summing to 138) and shows a different
    distribution on the control (26/(1,1,1), 63/(1,2), 49/(3,), summing to
    138) -- surviving gauge recheck (0/276 failures) and an independent
    Macaulay2 cross-check on all 66 differing curves (m2_agrees and
    order_agrees both True on all 66 rows). This variation is real and
    reproducible. Its substance is fully addressed by KN-FIND-ddd982: it is
    the curve's classical rational 2-torsion factorisation type by exact
    identity, and the class's total absence of the (3,) partition (present
    49/138 times in the control) is a forced consequence of the class's
    fixed even group order (3972), needing no isogeny-class-specific
    mechanism.
  - >-
    check_run_source_provenance.py --strict passes (1 pinned, 0 unpinned,
    clean tree). One development-time defect (an early Macaulay2 script
    used `**`, M2's tensor-product operator, instead of `^`, and omitted
    the elimination-polynomial computation) was self-caught and fixed
    before RUN-ICINV-e0cd8f-m3class was started; both independent reviews
    separately confirmed no residual symptom of that defect class survives
    in the committed run's output.
  inference: null
  boundaries:
  - One class only: p=4001, t=30, D=-15104=-59*16^2, 138 curves.
  - One control construction: 138 random ordinary curves at the same prime, other traces.
  - m=3 only for the decisive families; m=4 support and singular locus computed as required secondaries, Betti/regularity at m=4 not computed (budget-permitted secondary, not exhausted, simply not required).
  - "One declared grading and monomial order (x0-homogenisation, degrevlex primary / lp cross-check); a different convention is not comparable."
  - claim_tier toy throughout; sota_delta zero; no attack, exponent, or speedup claim of any kind.
  - >-
    KN-FIND-ddd982's identity is verified for m=3's elimination construction
    specifically; whether an analogous collapse occurs for m=4's elimination
    object is untested and explicitly out of scope here.
  unresolved_confounds:
  - >-
    Whether the six constant families are constant because they reflect
    S_3's shape independent of the object being an elliptic curve at all
    (both independent reviews' recommended follow-up: run the same seven
    families on a size-matched set of generic, non-elliptic-curve-derived
    polynomials of the same bidegree) is NOT tested by this run. If they
    are equally constant there, none of the six ever tested curve geometry
    in the first place -- a stronger negative than this evidence record
    itself asserts, named here as open rather than assumed.
  - >-
    No explicit, checked mechanism argument connecting rational 2-torsion
    structure to Groebner-solving degree or regularity of the summation-
    polynomial elimination system (f_V-free or f_V-bearing) exists anywhere
    in this campaign's committed record. Absence of such an argument is why
    this evidence record does not endorse treating elimination_factor_partition's
    variation as informative for min_{E'~E} C(E') without further work.
