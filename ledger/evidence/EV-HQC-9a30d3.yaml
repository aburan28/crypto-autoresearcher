  observations:
  - 'THE V2 ARM FIXED BOTH GAPS THE RED TEAM NAMED AGAINST V1, AND ONE FIX IS FULL, ONE IS PARTIAL.
    TASK-20260806-047535 imported and ran stage_a.py''s REAL decode_blocks (the WHT/Reed-Muller decoder,
    sha256-pinned) instead of a hand-rolled majority threshold -- confirmed genuine and unmodified by
    both independent reviewers. It replaced homogeneous all-0/all-1 planted blocks with two fixed,
    heterogeneous, near-decision-boundary 128-bit templates (one intended-fail, one intended-succeed),
    whose true decode was verified, before any trial generation, against BOTH decode_blocks and an
    independent brute_force_decode/rm17_codewords exhaustive search, with no disagreement ever observed.
    T = 1,000,000 trials (reduced 10x from PS-R3/V1''s T = 1e7, disclosed before the run: the real
    decoder runs roughly 54x slower than V1''s hand-rolled substitute), 434.3 of 1800 authorized
    core-seconds used. All 17 tested cells (k = 2..18) MATCH the closed-form planted value.'
  - 'THE V1 REPORT''S "DETECTION IS MATHEMATICALLY IMPOSSIBLE, FOR ANY T" FINDING IS RETIRED. The Red
    Team injected the same V1 (global off-by-one), V3 (last-block-early), plus an interior-position
    analogue and the mirror "late" direction, against a standalone reimplementation calling the real
    decode_blocks. Every variant produced a log2_Ahat_k deviation of 90 to over 13,000 jackknife SE
    against the arm''s actual T=1e6 SE -- an unambiguous MISMATCH at the level of the same estimator
    statistic the real PS-R3 pipeline uses, not merely a self-check firing, and independent of which of
    the 56 block positions was hit. The Validator independently reconfirmed non-zero flip probability by
    a separate reimplementation of the perturbation, reproducing the executor''s full 8-scenario table.'
  - 'THE RESIDUAL IS QUANTIFIED, NOT MERELY NAMED, AND IT IS LARGE. The Red Team independently measured
    the natural single-position "read-one-early" flip rate on Bernoulli(0.35) content -- this campaign''s
    OWN stated proxy for realistic crypto-like noise density, the same distribution design.md used to
    search for the two templates -- at ~8.8 percent overall (~19.6 percent even restricted to content
    already sharing the templates'' margin), roughly 5 to 11x lower than the 100 percent these two
    hand-searched templates exhibit. Because the construction uses exactly two fixed templates chosen
    specifically because a perturbation guarantees their flip, it can only ever express an all-or-nothing
    {0 percent, 100 percent} outcome at the population level -- it cannot, even in principle, measure a
    calibrated detection RATE for the real, heterogeneous PS-R3 pipeline. The same gap surfaces in the
    marginal q-shift: this arm''s own closed-form shift under a single-position defect is roughly +1.98
    percent, about two orders of magnitude larger than CTRL-POSHOM''s measured real-crypto-data shifts
    under the identical nominal defect classes (-0.0243, -0.0566, +0.0015 percent).'
  - Both reviewers independently ADMIT the artifacts as honest, reproducible, and budget-compliant, and
    both independently judge the disposition the same way, without conferring, as PARTIALLY CLOSES /
    PARTIALLY CLOSED -- not fully closed, not left fully open.
  inference: 'This evidence record does not measure anything about HQC; it measures the trustworthiness
    of the instrument that produced EV-HQC-b71230''s PS-R3 result, one control-arm generation further
    than EV-HQC-db1fd9. The strongest available objection to this campaign''s planted-arm methodology --
    that boundary/index-shift defects are structurally, mathematically undetectable by any arm of this
    shape -- is now false: at least one construction exists under which such defects are detected with
    overwhelming margin. That retires a real prior concern. But OPEN-6''s actual question -- whether
    PS-R3''s -244.1-to--32.4 null-SD anti-correlation signal (EV-HQC-b71230) could be explained by an
    undetected subtle sampler bug in the real pipeline -- is not answered by a worst-case, hand-searched
    demonstration that is 5 to 11x more sensitive than realistic content would be. OPEN-6 remains open in
    the sense that matters for interpreting PS-R3, pending a control that can measure an actual detection
    rate rather than mere possibility.'
  boundaries:
  - Toy. One planted instance, one run (T = 1e6, a disclosed 10x reduction from PS-R3''s T = 1e7), one
    seed family, no replication. This is an instrument check, not a measurement of HQC.
  - This evidence record does not reopen, revise, or supersede EV-HQC-b71230 or EV-HQC-db1fd9, both of
    which stand exactly as archived.
  - The demonstrated 100 percent detection rate does not generalize to the real PS-R3 pipeline''s actual
    sensitivity; the Red Team''s ~8.8 percent independently-measured natural flip rate is the more
    representative figure, and even that figure is itself only a proxy (Bernoulli(0.35) content, not a
    genuine (T)-distributed sample).
  - The cryptographic (T)-sampler (CTRStream, fixed_weight_support, ring arithmetic) remains entirely
    unexercised, as it was for V1. Nothing here establishes that stage_a.py''s real generation path
    actually carries a V1/V3-class defect, only that if one existed and hit near-boundary content,
    decode_blocks could in principle express it as an error.
  - H-HQC-18d1b4 is untouched by this record in either direction; it remains PROPOSED.
  unresolved_confounds:
  - 'OPEN-6 IS PARTIALLY CLOSED, NOT CLOSED. Named next control (both reviewers converge on this
    independently): a V3 arm using a genuinely heterogeneous per-position, per-trial content ensemble
    (e.g. Bernoulli(0.35)-style content, filtered only on matching the planted decode label, so S_t''s
    marginal law stays closed-form) instead of two fixed templates, so an injected boundary-shift
    defect''s detection RATE -- not merely its possibility -- can be measured and compared against the
    ~8.8 percent natural flip-rate baseline this batch established.'
  - This arm''s own jackknife SE is artificially tiny relative to PS-R3''s actual noise floor, because
    its planted S_t support is only {17,18,19} versus PS-R3''s near-binomial spread over {0,...,56}. The
    thousands-of-SE detection margins observed here do not directly transfer to what the same
    absolute defect-induced shift would represent against PS-R3''s real, much larger noise floor; a
    defect an order of magnitude smaller than what was tested (plausible under the ~8.8 percent natural
    flip-rate regime, if it aggregated only partially) could sit closer to the boundary of detectability.
  - The Validator flagged that a full independent re-derivation from raw per-batch histograms is not
    possible from the committed artifacts alone (only derived summary statistics are archived) -- a gap
    inherited unchanged from V1's identical precedent, not new to this batch.
  reviewed_by: coordinator
