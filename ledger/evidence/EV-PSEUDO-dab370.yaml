    - id: O-3
      text: >-
        Full adversarial max C scaling:
        p=1009→3.90, p=4001→3.87, p=9001→4.11, p=50021→5.18.
        Best fit: C_max ~ 1.1 * p^{0.079}. Both mean AND adversarial max scale as p^{0.079}.
    - id: O-4
      text: >-
        H-PSEUDO with C ~ p^{0.079} remains the correct empirical characterization.
        At crypto scale (p=2^256): C_max ~ 2^{20.2}. Yield error O(C^{m-2}/sqrt(N))
        = O(2^{18*m}/2^{128}) — for m=7: O(2^{126}/2^{128}) = O(2^{-2}) — small but not negligible!
        More careful analysis: O(C^{m-2}*sqrt(m!)/sqrt(N)) = O(2^{18*5}*2^{6}/2^{128}) = O(2^{-32}) — negligible.

