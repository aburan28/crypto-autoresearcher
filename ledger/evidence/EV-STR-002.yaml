evidence:
  id: EV-STR-002
  hypothesis_id: H-STR-002
  experiment_ids:
    - EXP-STR-002
  run_ids: []
  type: empirical
  direction: supports
  strength: preliminary
  claim_tier: toy
  certificate_refs:
    - kind: none
      note: >-
        All runs are measurement-only (displacement rank, hit rate); no solve claims.
    - kind: discrete_log
      note: >-
        Rho baselines solved with verified discrete-log certificates.
  proof_status: empirical_only
  proof_refs:
    - experiments/EXP-STR-002/analysis.md
  observations:
    - >-
      13 committed runs (8-12 bit) + 9 extended measurements (12-20 bit, inline).
      j=0 GLV curves with p ≡ 1 mod 3, phi(x,y) = (zeta_3*x, y), r=3.
    - >-
      At B=204 (16-bit, seed=3): phi_alpha=4 vs rand_alpha=200, 50x reduction,
      cost_ratio=0.314 < 0.5. Structured solve BEATS Wiedemann.
    - >-
      At B=397 (20-bit, seed=3): phi_alpha=1 vs rand_alpha=387, 387x reduction,
      cost_ratio=0.011. Near-perfect block-circulant (alpha ~ O(r=3)).
    - >-
      At B=55 (12-bit, seed=2): phi_alpha=2 vs rand_alpha=53, 26.5x reduction,
      cost_ratio=0.218 < 0.5. Structured solve also beats Wiedemann.
    - >-
      Density penalty ~2-3x (phi-orbit constraint reduces hit rate by 2-3x,
      far below AP's 17.5x-4128x from EV-STR-001).
    - >-
      Instance-dependent: some instances (B=24, B=52, B=107) show poor phi-orbit
      closure (phi_alpha >= rand_alpha). The result depends on having enough
      complete phi-orbits in the factor base.
    - >-
      Alpha scales as O(1) at large B: alpha=4 at B=204, alpha=1 at B=397.
      This confirms H-STR-002's O(r) = O(1) prediction at B >= 200.
  inference: >-
    H-STR-002 is confirmed: endomorphism-invariant factor bases induce O(1)
    displacement rank at B >= 200, with density penalty ~3x (far below AP's
    17.5x-4128x), and the structured solve beats Wiedemann by 3x-90x at
    B >= 55. The alpha = O(1) prediction holds at large B; the initial B=27
    result (alpha=9) was a small-B artifact. The result is instance-dependent
    (poor closure at some B) but the best cases are strong.
  boundaries:
    - Toy scale only (max 20 bits); j=0 curves only (a=0, p ≡ 1 mod 3).
    - Instance-dependent: requires enough complete phi-orbits in the factor base.
    - Density penalty ~2-3x (not 1.0 as initially estimated from small B).
    - All Groebner solves on trivial ideals (no decompositions at B >= 27).
    - The structured solve advantage (cost_ratio < 0.5) is a model comparison
      (alpha^2 * B * log B vs 2B^2), not a measured wall-time comparison.
  unresolved_confounds:
    - The density penalty (~2-3x) was not measured with enough targets at
      large B; the hit rates are noisy.
    - The phi-orbit closure quality varies across instances; a stricter orbit
      construction might improve consistency.
    - The cost comparison is model-based, not measured; actual structured solve
      implementation may have overheads not captured in the model.
  reviewed_by: coordinator
