evidence:
  id: EV-STR-002
  hypothesis_id: H-STR-002
  experiment_ids:
    - EXP-STR-002
  run_ids: []
  type: empirical
  direction: supports
  strength: preliminary
  claim_tier: toy
  certificate_refs:
    - kind: none
      note: >-
        All runs are measurement-only (displacement rank, hit rate); no solve/relation
        claims. Certificate kind=none, verified=true.
    - kind: discrete_log
      note: >-
        Rho baselines solved with verified discrete-log certificates.
  proof_status: empirical_only
  proof_refs:
    - experiments/EXP-STR-002/analysis.md
  observations:
    - >-
      13 runs (4 phi-invariant, 4 random, 5 rho) at 8-12 bit j=0 curves with
      p ≡ 1 mod 3, all completed_valid, dirty: false. 16/20-bit instances
      were too slow to generate with BSGS + factoring.
    - >-
      phi_alpha < rand_alpha in 4/4 cases. At B=27: phi_alpha=9 vs
      rand_alpha=27 (3x reduction). At B=6: phi_alpha=2 vs rand_alpha=3.
    - >-
      Density penalty ~1.0: the phi-orbit constraint does NOT reduce the
      relation hit rate (unlike AP's 17.5x-4128x penalty from EV-STR-001).
    - >-
      phi_alpha = 9 at B=27 is not O(1) = O(r=3); it's O(B/3). The
      block-circulant structure is partial, not full. Some phi-shifted
      relations have summands outside the factor base.
    - >-
      Cost ratio (structured/Wiedemann) = 7.5 at B=27 — structured solve is
      NOT cheaper yet. The crossover where structured beats Wiedemann is
      B > alpha^2 * log(B) / 2 ~ 200 (bit sizes > ~20).
  inference: >-
    The endomorphism-invariant factor base provides a 3x displacement rank
    reduction without the density penalty that killed the AP approach. The
    structure is partial (alpha = B/3, not O(1)), and the structured solve is
    not cheaper at B=27 (needs B > 200). The result supports H-STR-002's
    direction (phi-invariant gives lower alpha than random) but the alpha is
    larger than predicted (O(B/3) vs O(1)).
  boundaries:
    - Toy scale only (max 12 bits meaningful); only 2 data points with B >= 6
    - j=0 curves only (a=0, p ≡ 1 mod 3); no claim about generic curves
    - alpha = O(B/3) not O(1); the block-circulant structure is partial
    - Cost ratio = 7.5 at B=27; structured solve not cheaper until B > 200
    - All Groebner solves on trivial ideals (no decompositions at B=27)
  unresolved_confounds:
    - Only 2 meaningful data points; more are needed to confirm the alpha = B/3
      scaling vs O(1)
    - The imperfect phi-orbit closure (some shifted summands outside F) may
      be fixable with a larger factor base or a different orbit construction
    - 16/20-bit instances were too slow; a faster point-count is needed
  reviewed_by: coordinator
