  hypothesis_id: H-SSI-7fe2bf
  experiment_ids: [EXP-SSI-9b542d]
  run_ids: [RUN-SSI-9b542d-001]
  type: empirical
  direction: supports
  strength: preliminary
  claim_tier: medium
  certificate_refs: []
  proof_status: empirical_only
  proof_refs: []

  observations:
    - >-
      BOUNDARY-CONDITION-GATE PASS: MC_P13_CORRECTED reduces to T_full exactly at
      w=M (residual 0.0 at all five P rows). The superseded formula diverges by
      exactly 0.5*L_mem(P) bits (46.25/69.3/90.65/103.0/136.1).
    - >-
      REPRODUCTION-GATE PASS: RG-1 through RG-5 all within preregistered bands.
      RG-5 gap span [2.524, 11.276] covers [6, 11] as predicted.
    - >-
      XCHK-1 PASS: all four cost laws agree to machine epsilon (difference = 0.0)
      on the secondary cross-check formula.
    - >-
      CONVENTION-DOMINANCE (H2 data): MC_P13_CORRECTED and MC_VOW disagree at ALL
      15 tested feasible cells. The sign of the cost comparison is controlled by the
      convention choice, not the underlying mathematics, across the entire tested
      parameter grid. Advantage grows with NIST level: 9.5 / 22.0 / 38.8 bits at
      I/III/V.
    - >-
      SCOPE STATEMENT: ALL levels are memory-infeasible. Excess over global storage
      at 64 bytes/entry: 25.4 / 71.5 / 114.2 bits at NIST I/III/V. No crossover in
      this grid changes a deployed parameter recommendation.
    - >-
      GRID CATEGORICAL BREAKDOWN: 288 numeric crossovers (6.4%), 2672 no_crossover
      (59.6%), 1440 infeasible (32.1%), 80 multiple_roots (1.8%) out of 4480 cells.
    - >-
      MONO-3 FINDING (non-blocking): p*(w) is non-monotone under MC_P13_CORRECTED
      due to L_mem(P) growth feedback. This is a structural property of the cost
      model, not an implementation error.
    - >-
      ADVERSARIAL CORNER: minimum margin is 9.5 bits at (L1, S=0, A=-1.74, c=0,
      P=256). Even at the most attacker-favorable parameters the assessed method
      remains cheaper by 9.5 bits.
    - >-
      NULL DISPLACEMENT: D_null0 in [11.96, 13.66] bits (preregistered [11.9, 14.2]
      -- PASS). The per-entry correction is load-bearing (> 11 bits everywhere).

  inference: >-
    The crossover locus experiment succeeds at its stated objective: it maps the
    exact parameter region where the P^{1/3} method transitions from cheaper to
    more expensive than van Oorschot-Wiener, under MC_P13_CORRECTED. The primary
    finding is that convention choice (which cost law is used) dominates the sign
    of the comparison across the entire tested grid, with the gap GROWING at higher
    security levels. However, the entire question is academic: every crossover cell
    lies in a memory-infeasible regime (25+ bits above global storage), so no
    parameter recommendation changes regardless of which method "wins". The MONO-3
    non-monotonicity is a honest record of the cost model's structural behavior.
    Strength is preliminary because the load-bearing inputs top at p=2^40 (the cost
    formulas are analytical, but their calibration constants derive from
    measurements at that scale).

  boundaries:
    - >-
      Claim tier is MEDIUM, not crypto. The cost formulas are evaluated analytically
      at crypto-scale P values, but their calibration constants derive from
      measurements at p <= 2^40. A systematic error in those constants would shift
      every crossover cell.
    - >-
      This is NOT an attack, NOT a security claim, NOT crypto-scale validation of
      either algorithm's actual running time.
    - >-
      The comparison is between two COST MODELS, not two implementations. Neither
      algorithm was run at crypto scale.
    - >-
      Memory infeasibility at all levels means no operational recommendation follows
      from any crossover cell.
    - >-
      MONO-3 non-monotonicity means the locus should be reported as a bracket, not
      a point estimate, near knife-edge cells (|Delta| < 1 bit).

  unresolved_confounds:
    - >-
      The MC_P13_CORRECTED formula's calibration rests on constants extracted from
      measurements at p <= 2^40. Systematic bias in those constants would shift
      all crossover locations in the same direction.
    - >-
      80 cells (1.8%) show multiple roots. The locus in those regions is
      multivalued and the cost comparison reverses within a single scenario.
    - >-
      The MONO-3 non-monotonicity means that for certain parameter paths, the
      "winning" method switches and switches back as the parameter increases.

  reviewed_by: coordinator
  recorded_at: '2026-08-07'
