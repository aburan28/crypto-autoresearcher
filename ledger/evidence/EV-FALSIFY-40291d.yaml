evidence:
  id: EV-FALSIFY-40291d
  hypothesis_id: H-FALSIFY-40538b
  question_id: RQ-FALSIFY-a2c501
  experiment_ids: [EXP-FALSIFY-d770c1]
  run_ids: [RUN-FALSIFY-d770c1-002]
  findings_under_test: [KN-FIND-d4f820, KN-FIND-e7a3b1, KN-FIND-4c9e71]
  type: empirical
  direction: contradicts
  direction_note: >-
    Contradicts the power-law exponent recorded in KN-FIND-d4f820 and quoted in
    KN-FIND-e7a3b1. Supports KN-FIND-4c9e71. The three records disagree with
    each other already; this evidence resolves the disagreement rather than
    creating it.
  strength: strong
  claim_tier: toy
  proof_status: empirical_only
  proof_refs:
    - experiments/EXP-FALSIFY-d770c1/specification.yaml
    - experiments/EXP-FALSIFY-d770c1/runs/RUN-FALSIFY-d770c1-002/raw-result.json
    - experiments/EXP-FALSIFY-d770c1/runs/RUN-FALSIFY-d770c1-002/stdout.log
  recorded_at: '2026-08-08'

  observations:
    - id: O-1
      text: >-
        THE CORPUS CONTRADICTS ITSELF, UNRESOLVED. Three live findings, none
        superseded, characterise the same quantity C(p) -- the H-PSEUDO additive
        character-sum constant for the small-x factor base -- three different
        ways. KN-FIND-d4f820 records C(p) ~ p^0.055 in its title from a "4-point
        scaling". KN-FIND-e7a3b1 states C(p) ~ p^0.079 "empirically" and builds
        the conjecture statement on it. KN-FIND-4c9e71 records max C ~ O(1) ~ 4
        across the same prime range p = 1009..9001. A power law and a constant
        are not the same claim, and 0.055 and 0.079 are not the same power law.
    - id: O-2
      text: >-
        THE EXPONENT IS NOT IDENTIFIABLE FROM THIS DESIGN. Independent
        re-measurement at p in {1009, 2003, 4001, 9001}, B_frac = 0.05, five
        independent curves per prime, full-range DFT over all k != 0:
        mean C = 3.225, 3.246, 3.673, 3.912. The across-p variation of the mean
        is 1.213x over a prime range of 8.92x. The within-prime spread at
        p = 1009 alone is 1.494x -- LARGER than the entire across-prime effect
        being fitted -- and the mean within-prime standard deviation is 10.8% of
        the mean. For reference the competing claims predict total variation of
        1.128x (p^0.055) and 1.189x (p^0.079) across the whole range. The noise
        is the same size as the signal.
    - id: O-3
      text: >-
        THE FIT IS UNSTABLE UNDER RESAMPLING. With one curve per prime the
        least-squares exponent is p^0.0324; with five curves per prime it is
        p^0.0969. Redrawing which curves are sampled moves the fitted exponent
        by a factor of three and spans both recorded corpus values. An exponent
        that moves this much under resampling is not a measurement of the curve
        family, it is a measurement of the draw.
    - id: O-4
      text: >-
        NULL OBJECT REPRODUCES THE CLAIMED EXPONENT. A uniformly random subset
        of the same size in the same group -- carrying no arithmetic structure of
        any kind, no factor base, no small-x condition -- fits p^0.0694. That
        sits between the two recorded corpus exponents. Whatever p^0.055 and
        p^0.079 are measuring, a structureless object measures it too, so it is
        not evidence about the arithmetic of the small-x factor base. The
        expected behaviour of the null is C ~ sqrt(log N), which over
        1009..9001 rises about 14% and which a short power-law fit necessarily
        renders as a small positive exponent.
    - id: O-5
      text: >-
        THERE IS A REAL SIGNAL, AND IT IS NOT THE ONE RECORDED. Across every
        prime tested the factor base's constant exceeds the random null's by a
        stable factor: mean C_factorbase / C_null = 1.300x, with the ordering
        holding at all four primes individually (3.225/2.531, 3.246/2.594,
        3.673/2.754, 3.912/2.933). The small-x factor base is measurably LESS
        pseudorandom than a uniformly random subset of the same size. This offset
        is more stable than the exponent that was recorded, and no finding in the
        corpus records it.

  interpretation: >-
    The recorded exponents in KN-FIND-d4f820 and KN-FIND-e7a3b1 are fitting
    artifacts of a 4-point design spanning less than one decade with per-point
    noise of the same order as the total effect. KN-FIND-4c9e71's O(1)
    characterisation is the one consistent with the measurement, and the
    three-way disagreement in the corpus should be resolved in its favour.
    Separately, the stable 1.3x excess over the random null is the part of this
    measurement that carries information and it is currently unrecorded.

  what_this_does_not_establish: >-
    This does NOT show C(p) is bounded as p grows, and therefore says nothing
    about whether H-PSEUDO itself is true. Establishing boundedness requires a
    range over which a p^0.05 effect is resolvable -- several decades, not 8.92x
    -- and this run does not have it. The honest statement is that the tested
    design cannot distinguish O(1) from p^0.08, in either direction, so no
    exponent may be quoted from it. That cuts against reading O-2 as support for
    a constant just as it cuts against the recorded power laws. It also does not
    re-derive the corpus's own runs: different curves, one B_frac, five trials.
    Any claim that the original measurement was mis-executed would need its raw
    per-curve data, which this record does not have and does not assume.

  dominated_by: not_applicable_methodological
  sota_delta:
    time_exponent: not_applicable
    note: >-
      No algorithmic claim. The effect on the corpus is to withdraw a quoted
      exponent, resolve an internal contradiction, and surface an unrecorded
      structural offset.

  proposed_correction: >-
    A superseding record that (a) withdraws the p^0.055 and p^0.079 exponents as
    unidentifiable from a 4-point sub-decade design, (b) reconciles the three
    findings on KN-FIND-4c9e71's O(1) characterisation while stating explicitly
    that boundedness is NOT thereby established, (c) records the 1.3x
    factor-base-over-random offset as the reproducible quantity, and (d) states
    the design requirement -- several decades of p, replicate curves per prime,
    reported scatter -- that any future exponent claim must meet. New records
    only, never edits (AGENTS.md rule 4). Coordinator authority.

  knowledge_promotion: warranted
  knowledge_promotion_reason: >-
    The reusable content is a design rule, not a mathematical result: an exponent
    fitted over less than one decade, without replicate scatter, and without a
    structureless null measured on the same axis, is not a measurement. Two
    corpus findings already failed this test. Proposed as a technique entry
    subject to Coordinator approval.

  scope_limits: >-
    p in {1009, 2003, 4001, 9001}; B_frac = 0.05; five randomly drawn cyclic
    curves per prime; full-range DFT. Toy scale throughout. Nothing here
    extrapolates to cryptographic parameters.

  independent_review_required: true
  independent_review_note: >-
    This record contradicts an exponent that KN-FIND-e7a3b1 uses in its
    statement of an open conjecture. AGENTS.md rule 12 applies before any status
    change follows.

  authority_note: >-
    Evidence only. No hypothesis status changed, no finding edited or
    superseded; only the Coordinator may do that (AGENTS.md rule 1).
