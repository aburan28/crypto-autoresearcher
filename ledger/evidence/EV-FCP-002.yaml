evidence:
  id: EV-FCP-002
  hypothesis_id: H-FCP-001
  experiment_ids:
    - EXP-FCP-002
  run_ids: []
  type: empirical
  direction: neutral
  strength: preliminary
  claim_tier: toy
  certificate_refs:
    - kind: none
      note: >-
        All 120 decomposition runs (60 fixed + 60 naive) found no decompositions
        (B^2/N << 1 at 16-28 bits); all carry certificate kind=none, verified=true.
    - kind: discrete_log
      note: >-
        All 12 rho baseline runs solved with verified discrete-log certificates
        (verifier: independent-recompute).
  proof_status: not_applicable
  proof_refs: []
  observations:
    - >-
      144 runs (12 precompute, 12 rho, 60 fixed, 60 naive), all completed_valid,
      dirty: false, at commit 10cb3510. Bit sizes 16/20/24/28, seeds 1/2/3,
      factor base 14, m=2 S_3, K=5 targets, sympy Groebner, Python 3.13.1,
      macOS arm64.
    - >-
      Amortized cost ratio (fixed_total / naive_total) > 0.95 at ALL tested bit
      sizes for all seeds. Mean ratios: 1.125 (16-bit), 1.169 (20-bit), 1.067
      (24-bit), 1.061 (28-bit). Fixed preprocessing is more expensive than naive
      at 10 of 12 (bits, seed) combinations.
    - >-
      Precompute/groebner ratio increases monotonically: 0.0041 (16-bit) → 0.0078
      (20-bit) → 0.0136 (24-bit) → 0.0149 (28-bit). Construction cost grows faster
      than Groebner solve cost with field size, but is still only ~1.5% of Groebner
      time at 28 bits.
    - >-
      No decompositions found at any bit size (B=14, m=2, N >> B^2 for bits >= 16).
      All Groebner solves return trivial ideals; cost may differ for non-trivial
      systems.
    - >-
      All 12 rho baselines solved (15-4716 group operations) with verified
      discrete-log certificates.
    - >-
      Control comparability verified: all 60 matched fixed/naive pairs use
      identical curve_id and target points.
  inference: >-
    The success criterion (amortized_cost_ratio < 0.95 at bits >= 20 for >= 2/3
    seeds) is not met. The falsification criterion (ratio >= 0.95 at all sizes
    AND precomp/groeb not increasing) is not fully triggered because the
    precomp/groeb ratio does increase. The result is inconclusive: the
    preprocessing direction is not closed, but the advantage (if it exists) is
    below the noise floor at 16-28 bits with K=5 and B=14. Extrapolating the
    precomp/groeb trend linearly suggests ~6% at ~40 bits, which with K=5 would
    yield ~5% savings — but this extrapolation is speculative.
  boundaries:
    - Toy scale only (max 28 bits); nothing about medium or crypto scale.
    - B=14, m=2, K=5 only; different parameters may behave differently.
    - No decompositions found; Groebner cost on trivial ideals may not represent
      cost for non-trivial systems.
    - Absolute timings are sympy/macOS-arm64-bound; only within-machine ratios
      are comparable.
    - The precomp/groeb trend is based on 4 bit-size data points; linear
      extrapolation beyond 28 bits is not warranted.
  unresolved_confounds:
    - The Groebner solve time does not increase significantly across 16-28 bits
      (0.04-0.05s), suggesting polynomial operation count dominates coefficient
      arithmetic at this range. The construction/groebner ratio may not continue
      to increase at the same rate beyond 28 bits.
    - The fixed mode is sometimes slower than naive even excluding precompute,
      suggesting Groebner solve time variance (~10%) dominates the ~1.5%
      construction cost difference.
    - K=5 may be too small; larger K would improve amortization but the
      bottleneck is the precomp/groeb ratio, not K.
  reviewed_by: coordinator
