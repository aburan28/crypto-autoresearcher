evidence:
  id: EV-ECDLP-fd61e4
  hypothesis_id: H-XOR-YIELD
  experiment_ids:
    - EXP-SEMAEV-f48dd1
  run_ids:
    - RUN-SEMAEV-f48dd1-grid
  type: empirical
  direction: contradicts
  strength: strong
  claim_tier: toy
  certificate_refs: []
  proof_status: empirical_only
  proof_refs: []
  observations:
    - >-
      Y_A = Y_B exactly across all 40 cells (4 primes × 2 b-values × 5 seeds).
      Mean Y_A = 0.01212636, mean Y_B = 0.01212636, mean Y_C = 0.00010671.
    - >-
      Corrected statistical analysis (n=8 independent groups, accounting for
      pseudo-replication): Δ = Y_B − Y_C = 0.01202, 95% CI [0.00593, 0.01811],
      t(7) = 4.665, p = 0.0023. Statistically significant, but scientifically
      misleading.
    - >-
      The statistically significant Δ measures the difference between the x-oracle
      and a random predictor (strawman baseline), not the difference between the
      x-oracle and exhaustive search (scientifically relevant baseline).
    - >-
      The x-oracle MITM strategy finds exactly the same relations as exhaustive
      search (Y_A = Y_B), but with fewer field operations. This is a computational
      efficiency result (cost reduction), not a yield improvement result.
    - >-
      All 120 arm-runs completed successfully. All control checks passed (query
      count match, PRNG collision-free, baseline consistency).
  inference: >-
    The evidence contradicts H-XOR-YIELD in its original formulation. The hypothesis
    predicted that the x-oracle would improve yield (relations per enumeration space)
    over exhaustive search. The evidence shows Y_A = Y_B exactly, indicating no yield
    advantage. The x-oracle provides cost reduction via MITM filtering (fewer field
    operations to find the same relations), which is a different research question.
    The statistically significant Δ = 0.01202 is real (the x-oracle beats random
    noise), but it is not evidence of yield improvement over exhaustive search.
    This is a textbook case of testing the wrong hypothesis: the experiment asked
    "Does oracle beat random?" when it should have asked "Does oracle beat exhaustive
    search?"
  boundaries:
    - >-
      Toy scale only: 7-8 field bits, m=3, one implementation. No evidence about
      cryptographic-size curves (AGENTS.md rule 7).
    - >-
      The cost-reduction observation (fewer field operations) is qualitative, not
      quantitative. No full cost model was measured.
    - >-
      The x-oracle is an idealized construct. Real attacks must compute whether an
      x-coordinate admits a point, which has its own cost.
  unresolved_confounds:
    - >-
      Whether the cost reduction scales to larger parameters is unknown.
    - >-
      Whether a different oracle-exploitation strategy could improve yield is unknown.
    - >-
      Whether the x-oracle has other exploitable properties beyond MITM filtering
      is unknown.
  reviewed_by: coordinator
  decided_by: coordinator
  decided_at: '2026-08-07'
  decision_id: DEC-20260807-fd61e4
