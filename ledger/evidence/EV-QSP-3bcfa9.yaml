    The pre-registered CONSISTENT-WITH-H1 verdict fires; G1 (growing
    deficit) and G2 (far below) do not. The eliminant degree does not
    collapse below a constant fraction of the paper's M(E)=4d as d goes 2
    -> 3; it sits at ~1.9x 4d, the same level as the C1 random-pair null,
    so the factor is a property of the degree pattern, not of the
    phi-chain. NEW FINDING OF THIS REVIEW: the n axis is exactly
    degenerate — the eliminant POLYNOMIAL is byte-identical at n=17 and
    n=23 for every (d, lambda) (verified across all 20 chain rows),
    because F^{n'} is the identity on the F_2-coefficient chain under the
    xi=1 specialisation; the effective tested scope is 10 chain cells, not
    20.
