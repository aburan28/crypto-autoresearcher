  inference: Theorems A, B and C of the manuscript extend to m = 6 and m = 7 without exception
    on this battery. The value of these arities is that the monodromy group has order 16 and
    32 and the fibre degree 16 and 32, so 'every Frobenius class yields exactly one factorization
    type, and that type is 1^16/2^8 or 1^32/2^16' is a far stronger coincidence to satisfy by
    accident than at m = 3. Combined with RUN-SMON-e5cbe6-001 the theorems now hold without
    exception at every arity from 3 to 7 on 22 curves.
  boundaries:
  - Primes to 4001; five curves; 600 uniform and 600 factor-base samples per arity. Smaller
    than the m<=5 battery, which is why it is a supplement to EV-SMON-9c1c23 rather than a replacement.
  - Same implementation as RUN-SMON-e5cbe6-001, by deliberate import. A shared implementation
    defect would not be detected by this run and is not claimed to be.
  - Nothing here bears on ECDLP hardness in either direction.
  unresolved_confounds:
