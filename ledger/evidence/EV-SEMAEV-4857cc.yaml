        NOT a systematic structured density. The average yield is still B^2/(2N) (heuristic).
    - id: O-3
      text: >-
        Connection to H-PSEUDO Fourier constant C: The Parseval identity gives
        N * E(F,F) = Σ_k |hat{1_F}(k)|^4. With E(F,F)/baseline = alpha ≈ 2.29:
        (Σ_k |hat{1_F}(k)|^4)^{1/4} ≈ alpha^{1/4} * B^{5/4} / N^{1/4} ≈ 1.23 * B.
        For C=3 (measured Fourier max): max|hat| = 3*sqrt(B), so L^4 norm ≤ N^{1/4}*3*sqrt(B).
        Consistent: the additive energy ratio = |L^4 norm of DFT |^4 / (B^4) = alpha.
    - id: O-4
      text: >-
        The additive energy measurement does not provide additional evidence for or against
        H-PSEUDO beyond the Fourier constant C measurement. Both measure the same structure
        of the DFT of 1_F; additive energy gives the L^4 norm, Fourier constant gives the
