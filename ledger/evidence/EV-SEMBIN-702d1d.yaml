      LM SHA-256 comparison with the producer's digests is not computed in this
      record (RC-1). Equal per-size leading counts and equal N_std make an
      undetected leading-set difference unlikely and do not exclude one. Gate
      C-DIGEST of TASK-20261005-cf5839 computes it and stops the archive on any
      mismatch among the nine comparable instances.
    - >-
      The blind lane is one author and shares the plan's statement of the order and
      the budget, which the plan author derived from closure.c's column layout. The
      agreement certifies the implementation computes the defined quantity, not that
      the convention is the contract's.
    - >-
      The blind lane's independent second implementation (closure2 -i) was stopped
      in the long tail of its queue on both N = 40 instances: it inserted 102091 and
      102087 independent rows (the recorded ranks) and wrote no leading sets
      (UNREACHED). At scale the leading sets rest on one blind implementation and
      byte-identical re-runs at different batch sizes.
    - >-
      The producer's final bases are not archived and were not saturation-checked
      (about 3.7 GB dense at n = 45). Equal invariants imply equal subspaces only
      if the producer's rows lie in the closure, which the cancellation example of
      PT-2(b) shows is an argument and not a proof (PLAUSIBLE).
    - >-
      The three insufficient windows' order-robustness is argued (up-set, K = 0 on
      40 closures), not computed under every admissible order.
    - >-
      The W3(a) proof is argued from recalled Groebner facts and checked on 60
      systems with N <= 7; the Macaulay block of the contract was taken from its
      one-sentence description, and 'products by monomials up to total degree 4'
      is read as product degree <= 4 (PLAUSIBLE; a multiplier-degree reading would
      need columns of degree up to 6).
    - >-
      Window-scale corruption injection into the evaluation check was not done
      (forbidden by the validator card); its power at the window is a computed model.
    - Reasoning effort of both reviewer sessions is not independently verifiable.

