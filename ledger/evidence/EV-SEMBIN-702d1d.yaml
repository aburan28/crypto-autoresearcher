  observations:
    - id: F-1
      grade: VERIFIED
      text: >-
        THE ONE DISAGREEMENT IS AN EARLY-STOP ARTIFACT OF THE PRODUCER'S RECORD, NOT
        A CLOSURE DEFECT. n = 40 draw 0 is recorded at rank 101931 of 102091 with
        size-4 leading count 91230 and digest prefix 8b168c1a; the blind lane's full
        closure has rank 102091 and size-4 count 91390 (a difference of 160 rows =
