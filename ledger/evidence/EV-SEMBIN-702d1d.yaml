        an intermediate, batch-dependent subspace (the validator showed a small
        chained instance, n = 10, m = t = 3, recording rank 8774 at one memory cap
        and 8960 at another, against 9109 columns). The verdict and
        N_std (0) are unaffected. Localised, in the plan's terms, to a difference
        between the statement of the quantity and closure.c, which the plan did not
        name (it named the order tie-break and the budget). NOTES.md prints
        '101931 / 102091' under 'D=4 (1 in W_D)' without saying it is intermediate
        (record defect RD-5). The other four records with 1 in W: two have
        rank = columns (n = 41 draw 0, n = 43 draw 5) and two were decided at D = 2.
    - id: F-2
      grade: VERIFIED (numerics, 300 mutants) / argued (proof)
      text: >-
        THE POLARITY STATEMENT HOLDS AS STATED. Under an admissible order, a closure
        W' missing products is contained in W, which is contained in I, so
        N_std(W') >= N_std(W) >= |V|: a missing product can only turn a true
        'sufficient' into a recorded 'insufficient'; an out-of-ideal row can only
        lower N_std (false 'sufficient' or 'impossible'). Hence the nine sufficient
        verdicts are soundness-sensitive and the three insufficient ones are
        soundness-and-completeness-sensitive. 300 mutant closures: 0 counterexamples
        (67 strict, 233 equal). A non-admissible graded order breaks it
        (artifact A2). Red team W1 attack 3; validator S1/S4.
    - id: F-3
      grade: VERIFIED (two implementations at real scale on 4 windows; 168 small systems)
      text: >-
        THE RECORDED OBJECT IS THE ITERATED CLOSURE, NOT THE CONTRACT'S LITERAL
        CERTIFICATE, AND THE TWO GIVE OPPOSITE VERDICTS ON 7 OF THE 12 WINDOW
        SYSTEMS. The specification's certificate is 'the degree-4 Macaulay block ...
        all products of the generators and the field equations by monomials up to
        total degree 4', read (red team, PLAUSIBLE reading, supported by the stated
        column count) as product degree <= 4 in ONE level. That literal block is
        insufficient on 10 of 12 (rank 31673 of 102091 at n = 40) and sufficient
        only where 1 already lies in the span of the generators (n = 42 draw 0,
        n = 44 draw 0). The iterated closure is sufficient on 9 of 12. Opposite
        verdicts (literal insufficient, iterated sufficient): n40 d0, n40 d1,
        n41 d0, n41 d4, n42 d1, n43 d0, n43 d5. Both baseline instances of the
        contract (n = 40) are among them. Literal-block ranks were confirmed by a
        second implementation on four windows (31673, 31673, 36001, 41455). Small N:
        168 systems, iterated strictly larger on 95, 57 verdict flips single
        insufficient to iterated sufficient, 0 reverse. By monotonicity (the literal
        span is inside the iterated span) the three insufficient verdicts hold under
        BOTH definitions; only the sufficient verdicts are definition-dependent
        (7 of 9). The validator's S5 shows the producer's own single-level path
        equals an independent Macaulay rank on 42 of 42 small runs, so the literal
        block is correctly implemented in closure.c; it was not run in
        RUN-SEMBIN-5ed13e (--no-single).
    - id: F-4
      grade: VERIFIED (9 sufficient, six orders) / argued (3 insufficient)
      text: >-
        THE LABEL IS RELATIVE TO (CLOSURE, ORDER, RULE). The specification contains
        no definition of the sufficiency verdict, no monomial order and no
        leading-monomial wording (zero grep matches, red team F-W1-S1). A system with
        a fixed closure subspace flips between sufficient and insufficient under
        different admissible graded orders (N = 10, |V| = 156, W of rank 245 in all
        four orders: degrevlex 156 sufficient, deglex 156 sufficient, two weighted
        orders 160 and 158 insufficient; artifact A1, seed 2026 trial 1449). On the
        twelve windows no flip was found: the nine sufficient windows are sufficient
        under degrevlex, deglex and four random weighted graded orders (W = I_{<=4},
        order-independent); the three insufficient windows are argued order-robust
        (the leading set is an up-set, K = 0 verified on 40 closures, so
        N_std >= c - r > |V| in every admissible graded order). N_std MAGNITUDE of
        an insufficient record is order-relative: under a seeded variable
        permutation n = 44 draw 5 gives 9133 (not 9145) and n = 45 draw 0 gives
        13608 (not 13681), verdict class unchanged. The validator's S6 (reversed
        variables: same rank, different leading set on 8 of 8, different N_std on
        1) agrees.
    - id: F-5
      grade: VERIFIED
      text: >-
        THE PRODUCER'S CROSS-CHECK ARGUMENT CANNOT SEE A MISSING PRODUCT, AND THE
        CHECKS THAT CAN SEE ONE FLAG EVERY OUTCOME-CHANGING MUTANT. Two elimination
        routines agreeing, an evaluation check clean at a common zero, and a clean
        structural check share closure.c's product generation. Validator: 43
        scenarios, the producer's procedure flagged 0, an independent reference plus
        saturation verifier flagged 23 (variants MA budget minus one, MB drop the
        pivot_new_ branch at a lowered batch floor, MC generators only, MD drop the
        last batch; the mutant MI, resume forgets which rows were new, changed the
        outcome in 5 of 5 kill-and-resume tests and is caught by the resume
        harness). Red team PT-1: 15
        missing-product cases on its own independent closure, the argument passed
        with no flag in all 15, and comparison with an independent closure and a
        saturation verifier flagged every real mutant (4 of 4, 4 of 4, 3 of 3); its
        mutant (b) (multiply a row once at creation) is not a missing-product mutant
        by F_2-linearity and was correctly not flagged. Localised product losses are
        usually absorbed: 212 block-drop runs, up to 15000 consecutive products
        dropped with no outcome change, 5 changes all flagged by the verifier and
        none by the producer's procedure. The unmutated closure.c equals the
        validator's independent reference and verifier on 127 completed runs (103
        saturation checks, 18 instances, N 9..26, caps from many tiny batches to one
        batch, two batch floors) and its column order equals the statement's
        comparator for N = 8..62.
    - id: F-6
      grade: VERIFIED
      text: >-
        THE EVALUATION CHECK IS A NECESSARY-ONLY BULK DETECTOR, AND IT CARRIES LITTLE
        OF THE ROUND'S WEIGHT. Witnesses are common zeros (the first lister zero,
        1 of 4 for n = 44 draw 5 and 1 of 2 for n = 45 draw 0); the positive control
        flags; an injected row vanishing at the witness and not at a second zero
        stays clean (necessary-only). Detection depends on how much is corrupted:
        every scratch trial with at least half as many flips as output rows was
