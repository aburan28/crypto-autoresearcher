  inference: >-
    The recorded verdicts of RUN-SEMBIN-5ed13e are correct readings of the iterated
    degree-capped closure on the twelve window systems under degrevlex: an
    independent, M4RI-free implementation reproduces every verdict-bearing value,
    the nine soundness-sensitive and the three completeness-sensitive polarities
    alike, and the checks that could expose a missing product expose every
    outcome-changing mutant while passing the unmutated code. What the producer's
    own cross-checks establish is narrower (a bulk soundness defect is excluded on
    two instances), and the weight of the validation comes from the blind lane.
    The recorded verdicts are NOT verdicts of the contract's certificate: on 7 of
    9 sufficient systems the literal certificate gives the opposite label, so the
    run cannot be read against EXP-SEMBIN-7e1371 v1's success or falsification
    criteria and is exploratory relative to them. The three insufficient verdicts
    are certificate-robust (they hold under both definitions) and order-robust
    (argued). An 'insufficient' verdict is a statement about the capped closure and
    not about the ideal or about d_F4.

  boundaries:
    - Twelve instances only: (n, m, t, k) = (40..45, 2, 2, 20, 21, 21, 22, 22, 23), one solution-free and one solution-bearing draw per n, chained_S3_eq5, low_degree_polynomial subspace, B_random, closure degree D <= 4, order degrevlex, x_1 largest.
    - The contract's literal single-level certificate was measured by the red team in review scratch (results/single_level) on its own code and is not a run. No RUN id was minted for it.
    - The 9bb990 off-diagonal sweeps, single-level blocks, controls and certificate-soundness comparisons are not re-measured on the fixed library by anything in this round.
    - RUN-SEMBIN-b6eb9f is not reviewed here; the correction record against it that the 9bb990 NOTES call a Coordinator act remains unwritten.
    - No statement about Assumption 1, d_F4, Assumption 2, n = 409 or 571, Kosters' comment-thread figures, or any curve, in either direction. An instrument stop is never negative mathematical evidence.

