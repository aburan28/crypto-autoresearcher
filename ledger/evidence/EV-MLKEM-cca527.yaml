  ledger_task: TASK-20260804-2dc49f

  type: empirical
  claim_tier: toy_scale
  states_a_finding: false
  compared_against_assumed_law: false

  # Schema slots filled under DEC-20260805-7b3e91 (RUL-4). Every value below is the
  # weakest in its vocabulary and is forced by this record's own committed text;
  # any stronger value would be a new claim requiring a superseding record.
  hypothesis_id: null
  hypothesis_note: >-
    This record names only the statistical null H0: Var[T_N] = N*Var[s_i]; it
    names no ledger hypothesis id, and its scope_statements say "No finding
    stated" and "No ML-KEM security claim in either direction". Choosing a ledger
    hypothesis here would assert a target the record did not choose.
  run_ids: []
  run_ids_note: >-
    No ledger-registered RUN-* record exists for this measurement. The 50
    bgj1_sieve runs were performed under the goal's coordination batch directory
    for BATCH-6f309b and are identified by the producer_task, validator_task,
    red_team_task and ledger_task ids recorded above, and by the artifact paths in
    proof_refs below. The empty list states that no RUN-* record backs this
    evidence; it does NOT state that no work was done. Reported as an
    evidence-integrity gap in DEC-20260805-7b3e91 FINDING-3.
  direction: neutral
  strength: inconclusive
  direction_and_strength_basis: >-
    The record's own admissibility block sets
    `admissible_as_independence_test: false` and states "The measurement does not
    reject H0 and was not designed to do so with adequate power. Need n >= 190-200
    for 80% power", with a 95% CI spanning both the independence prediction and
    substantial positive correlation. neutral and inconclusive are the schema's
    words for a measurement that discriminates nothing.
  proof_status: empirical_only

  what_was_measured: >-
    50 independent bgj1_sieve runs on the same LWE instance (m=35, n=25, q=127,
    instance_seed=20260803001, fpylll_seed=20260803005) with g6k Siever
    seeds 0..49. Platform: Docker linux/amd64 (Linux-6.12.76-linuxkit-x86_64,
    glibc-2.41) via QEMU on macOS ARM64 host. For each run: T_N_i = sum of
    cosine scores for the correct secret over N=17,919 sieve vectors.

  key_results:
    n_runs_completed: 50
    T_N_mean: 7554.192
    T_N_std_ddof1: 85.421
    empirical_var_TN_ddof1: 7296.782
    single_score_var_from_batch1: 0.332505
    independence_predicted_var: 5958.153
    variance_ratio: 1.2247

  admissibility:
    validator_verdict: accept_with_qualifications
    red_team_verdict: pass_with_constraints
    admissible_as_raw_observation: true
    admissible_as_independence_test: false
    reason_for_test_inadmissibility: >-
      OBJ-5 (blocking): n=50 is statistically underpowered to test H0:
      Var[T_N]=N*Var[s_i]. chi2(49)=60.009, critical value 66.339 at alpha=0.05,
      p=0.135. 95% CI for ratio is [0.855, 1.902], which includes both the
      independence prediction (1.0) and substantial positive-correlation values.
      The measurement does not reject H0 and was not designed to do so with
      adequate power. Need n >= 190-200 for 80% power.

  blocking_constraints_for_batch_3:
    - >-
      B3-1 (power): n >= 150–200 independent sieve runs in a SINGLE environment
      with a pre-specified stopping rule and a pre-registered chi-squared test.
    - >-
      B3-2 (environment): compute Var[s_i] WITHIN the same Docker environment
      as the variance runs, not from batch-1 which used a different kernel/glibc.
      There is a systematic mean-score difference of ~103.9/17919 = 0.58% between
      environments (red team OBJ-1/3) that must be characterised before the
      ratio denominator is trusted.
    - >-
      B3-3 (seeds): use randomly chosen g6k Siever seeds (not 0..49) to avoid
      any potential correlation between adjacent low-integer seeds. A marginal
      negative Spearman correlation (−0.247, p=0.084) with seed index was
      observed; not significant but motivates the change.

  scope_statements:
    - Dimension 60, q=127, bgj1_sieve, Docker linux/amd64 only.
    - NOT crypto-scale evidence (AGENTS.md rule 7).
    - No finding stated. No comparison against MATZOV.Nf performed.
    - AGENTS.md rule 12 UNMET and UNWAIVED.
    - No ML-KEM security claim in either direction.

