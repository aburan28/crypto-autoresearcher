evidence:
  id: EV-SPEC-001
  hypothesis_id: H-STR-002
  hypothesis_binding_caveat: >-
    READ THIS BEFORE CITING THIS RECORD. The schema requires a `hypothesis_id`
    and H-STR-002 is named only because EXP-STR-003 is that hypothesis's
    experiment. THIS RECORD BEARS ON A CONTRACT ARTIFACT, NOT ON A MECHANISM. It
    says nothing whatever about endomorphism structure, factor-base invariance,
    displacement rank, or any ECDLP quantity. It MOVES NEITHER H-STR-002 NOR
    H-IC-001, both of which remain `weakened` per DEC-20260727-009 and
    DEC-20260727-008 respectively. Any citation of this record as bearing on the
    H-STR-002 mechanism is a miscitation.
  experiment_ids:
    - EXP-STR-003
    - EXP-IC-002
  run_ids: []
  run_ids_reason: >-
    EMPTY BY CONSTRUCTION AND STATED, NOT DEFAULTED. No experiment was executed
    and no run was produced. BATCH-008 dispatched no Executor experiment: its
    only computation was two invocations of tools/validate_ledger.py and a diff.
    There is no run identifier that could be bound here, and AGENTS.md rule 10 is
    satisfied by citing the exact artifacts and commits in `proof_refs` and
    `observations` instead.
