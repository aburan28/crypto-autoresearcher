    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-008/tasks/TASK-20260727-028/validator_output_after.txt
    - ledger/corrections/CORR-20260727-004.yaml
  proof_status_basis: >-
    `derivation`, and expressly NOT `certificate`. The basis is a chain of
    byte-level and git-level facts each independently recomputed by a
    non-originating session, plus a parse argument. No solve, relation or
    mathematical claim is certified, and nothing in
    docs/claims-and-verification.md's certificate sense arises here.

  bound_snapshot:
    branch: claude/ecdlp-batch006
    worktree: /Volumes/Volume/crypto-autoresearcher-worktrees/ecdlp-batch006
    repair_commit: a935f207a85f5d0a227b811cfbdde4393372aa1a
    plan_commit: 14deee8a33a23cd1c8feef9a25376c53f5e3433c
    freeze_commit: 92268c9e72dd9d49de410f4a535e64af5aa5d9a9
    run_archive_commit: c79e3a8d6cb429c7a9c876b5e0272f46145ab919
    environment_of_the_validating_session: Darwin 25.6.0, git 2.39.5, python 3.13.1, pyyaml 6.0.3

  observations:
    - id: O-1
      title: The diff is exactly two lines across two files, quoting only
      text: >-
        Independently recomputed by VAL-20260727-003 (claim C1) from all four
        blobs extracted with `git show`, using a byte-level comparator that
        splits on b"\n" and compares index-wise; the producer's repair.diff was
        not used to derive it. EXP-IC-002: 29208 -> 29210 bytes, 511 -> 511
        lines, one differing line (213). EXP-STR-003: 50581 -> 50583 bytes,
        923 -> 923 lines, one differing line (407). No reflow, no reindent
        (leading whitespace 6 -> 6 and 4 -> 4), no reorder, no line-count change,
        no trailing-newline change (tail byte 0a on all four extracts), no
        line-ending change (zero CR anywhere). The byte delta is exactly +2 per
        file and in each case the after-line equals the before-line with one
        U+0027 inserted immediately after the key prefix and one appended at end
        of line. Neither original scalar contains an apostrophe, so no escaping
        was needed and none was introduced.
    - id: O-2
      title: The SHA-256 of each file with the changed line deleted is identical before and after
      text: >-
        VAL-20260727-003 claim C1: EXP-IC-002 99590067f09d8550... before and
        after; EXP-STR-003 08644b7e67389387... before and after. Every other line
        of both files is byte-identical.
    - id: O-3
      title: Neither pre-edit blob had any valid parse
      text: >-
        yaml.safe_load raises on both. Verbatim scanner errors obtained by
        VAL-20260727-003: EXP-IC-002 "ScannerError: while scanning a block scalar
        ... line 213, column 31 ... expected chomping or indentation indicator";
        EXP-STR-003 "ScannerError: while scanning a block scalar ... line 407,
        column 24 ... expected a comment or ...". Both errors sit at the column
        of the unquoted `|`, confirming the diagnosed cause rather than assuming
        it. RT-20260727-004 re-ran the same check on both extracted blobs and
        obtained ScannerError for both. Both post-edit blobs parse, with
        experiment.id EXP-STR-003 and EXP-IC-002 respectively.
    - id: O-4
      title: The parsed value equals the original raw text character for character
      text: >-
        VAL-20260727-003 test T2, on the repaired files:
        experiment/metrics/secondary[4]/p_dec_counting_bound parses to
        `|S| / N.` and the original raw text after the key prefix is `|S| / N.` -
        EQUAL; experiment/metrics/secondary[1]/branch parses to
        `"square" | "rectangular" - which limb of lines 220-234 executed
        (RT-OBJ-4).` and the original raw text is the same string - EQUAL.
    - id: O-5
      title: Structural isolation - the quoting perturbed the parse of no other node
      text: >-
        VAL-20260727-003 test T3 (placeholder neutralisation): with the offending
        line replaced by an identical placeholder in BOTH the pre- and post-repair
        file, the two parse trees are identical for each experiment, by Python
        equality and by canonical JSON dump. No key moved, no sibling was
        absorbed, no block boundary shifted.
    - id: O-6
      title: Validator transition, WITH ITS DENOMINATOR
      text: >-
        990 new validation errors before, 985 after. EXIT CODE 1 BOTH TIMES. The
        delta is -5 on a denominator of 990 - 0.5 PERCENT. Measured by
        VAL-20260727-003, which ran tools/validate_ledger.py itself at HEAD, then
        wrote the 14deee8a versions of the two specs over the working copies,
        re-ran, and restored with `git checkout --` (restoration verified: git
        status --porcelain empty and both files' SHA-256 matching the pre-swap
        values). The 990 and 985 error sets are set-identical to the executor's
        committed validator_output_before.txt and validator_output_after.txt;
        that agreement is corroboration only and no claim rests on it.
    - id: O-7
      title: The post-repair error set is a STRICT SUBSET of the pre-repair set
      text: >-
        `comm -13` on the sorted error sets returns THE EMPTY SET: the two
        newly-registering experiment records introduced no schema, id,
        duplicate-id or cross-reference violation of their own. The five entries
        cleared, verbatim: "experiments/EXP-IC-002/specification.yaml: invalid
        YAML: while scanning a block scalar";
        "experiments/EXP-STR-003/specification.yaml: invalid YAML: while scanning
        a block scalar"; "ledger/decisions/DEC-20260727-008.yaml: decision
        references unknown target 'EXP-IC-002'";
        "ledger/decisions/DEC-20260727-009.yaml: decision references unknown
        target 'EXP-STR-003'"; "ledger/evidence/EV-STR-003.yaml: evidence
        references unknown experiment 'EXP-STR-003'". This also confirms the
        BATCH-008 opening session's code reading (INT-BATCH008-006 item 3) that
        FIVE errors would clear rather than the three the orchestrator reported:
        both `invalid YAML` lines were present before.
    - id: O-8
      title: The baseline was not laundered, and the same validator binary measured both sides
      text: >-
        tools/validate_ledger_baseline.txt resolves to blob
        a818e2ee99f28cc458873c65f7b444ae2ab54032 at ALL of 92268c9e, c79e3a8d,
        14deee8a, a935f207 and HEAD - byte-unchanged, it did not grow. Its last
        touching commit is fb0f9b488ecd4d8019ad89ac5158e1eefb2ca9fb of
        2026-07-22, five days before the repair. Its 1142 entries match the
        "1142 grandfathered legacy error(s) suppressed" note that appears
        IDENTICALLY in the pre- and post-repair runs, so no error was shifted
        into the grandfathered set. Grepping it for EXP-IC-002, EXP-STR-003,
        EV-STR-003, DEC-20260727-008 and DEC-20260727-009 returns ZERO matches:
        none of the five cleared errors is grandfathered. And a935f207 does not
        modify tools/ at all - the tools tree hash is
        c80b4e4f9a51a905558e690e842744c1de9cbf18 at both 14deee8a and a935f207 -
        so the same validator binary measured both sides.
    - id: O-9
      title: The freeze ordering survives and is git-verifiable
      text: >-
        experiments/EXP-STR-003/runs DOES NOT EXIST at 92268c9e at all; it first
        appears at c79e3a8d. 92268c9e added exactly one path, the specification,
        and nothing else. The runs subtree is bit-identical from c79e3a8d through
        HEAD (tree hash f632035108372f599860b85f273c8dee437ca64f at c79e3a8d,
        14deee8a, a935f207 and HEAD) and all 20 manifests record
        `code.commit: 92268c9e...` with `dirty: false` - a single group of 20.
        Lines 1-406 and 408-923 of EXP-STR-003 are byte-identical to the frozen
        file, so F1 (line 544), the fixed-in-advance consequence block (line 560),
        the verdict definitions including obs1_falsified (line 576) and every
        control, budget and stopping rule are untouched.
    - id: O-10
      title: Commit scope
      text: >-
        a935f207 changed exactly six paths: the four TASK-20260727-028 artifact
        files (added) and the two specifications (modified). Tree hashes for
        ledger/, tools/, harness/ and experiments/EXP-STR-003/runs/ are identical
        at 14deee8a and a935f207. A filter for
        `^(harness/|ledger/|tools/|experiments/[^/]+/runs/)` over the commit's
        path list returns no matches.
    - id: O-11
      title: No consumer regression is possible
      text: >-
        Grep of tools/*.py and harness/*.py finds no reader of
        metrics.secondary. tools/validate_ledger.py is the only program in the
        repository that opens experiments/*/specification.yaml, and its
        check_experiment reads only the top-level experiment fields. Since
        neither file parsed at all before, no program could previously have read
        the changed key. There is no behaviour that could regress.

  # ==================================================================
  over_concession_corrected:
    what_the_batch_said: >-
      repair_plan.md section 5 and goal integrity note INT-BATCH008-004 assert
      that semantic equivalence "cannot be proved mechanically here" and
      substitute a decidable-by-eye diff plus two independent reviews.
    why_that_is_wrong: >-
      RT-20260727-004 objection OBJ-5. What is genuinely unavailable is a
      PARSED-TREE DIFF - the pre-edit blob has no parse tree, so tree comparison
      is not merely unproven but undefined. What IS available, and is strictly
      STRONGER for a pure-delimiter change, is an INVERSE-TRANSFORM BYTE-IDENTITY
      argument: delete the inserted delimiters from the post-edit blob and
      require the pre-edit blob back, byte for byte, over the whole file.
      Combined with (a) the pre-edit blob having no valid parse at all, so there
      is no second reading the repair could have chosen wrongly, and (b) the
      parsed value equalling the original post-key text character for character,
      the argument is COMPLETE rather than substituted for. Presenting a provable
      thing as unprovable is a defect in the safe direction, but it invites the
      next batch to skip the proof.
    what_is_archived_and_what_is_not: >-
      THE PROPOSITION IS ARCHIVED; THE SCRIPT IS NOT. Observations O-1 and O-2
      above - index-wise byte comparison, byte delta exactly +2, after-line equals
      before-line plus two delimiters, and identical SHA-256 of each file with the
      changed line deleted - are recorded in the committed VAL-20260727-003 and
      establish the same proposition by a different route. What is NOT archived is
      the re-runnable inverse-transform script itself. RT-20260727-004 ran that
      script and reports True for both files over the whole file, but IN A SESSION
      SCRATCHPAD OUTSIDE THIS REPOSITORY, and labels the result expressly NOT
      EVIDENCE (its required control RC-3). This record does not cite that probe as
      a measurement. Archiving the script and its captured output is assigned to
      TASK-20260727-033.
    why_this_matters_procedurally: >-
      RC-3 is stated by the Red Team because AN EARLIER SESSION IN THIS CAMPAIGN
      DROVE A DECISION FROM AN UNARCHIVED SCRATCHPAD PROBE THAT THEN FAILED TO
      REPRODUCE (the extended-B measurements corrected by CORR-20260727-007). The
      failure mode is on the record and is not repeated here: every fact in
      `observations` above is taken from a COMMITTED artifact or from a review
      report archived in this same commit, and none is taken from an unarchived
      probe.

  inference: >-
    Two committed frozen experiment specifications that did not parse as YAML
    were edited in place at a935f207 by the insertion of two single-quote
    characters each, on one line per file. The edit is CONTENT-NULL in a
    mechanically checkable sense: neither pre-edit blob had any valid YAML parse,
    and every other byte of both files is unchanged. Five of 990 non-grandfathered
    validator errors cleared, none appeared, 985 remain and the validator still
    exits 1. The pre-registration ordering, the run attestations and every clause
    of EV-STR-003's freeze evidence survive intact, because each is a statement
    about named commits rather than about HEAD. What is lost is HEAD byte-identity
    with the attested freeze, which no ledger record asserts but which a reader
    resolving EV-STR-003's unpinned proof_ref at HEAD would encounter without
    being told; CORR-20260727-004 supplies the pin. Nothing here bears on any
    hypothesis, mechanism or ECDLP quantity.

  boundaries:
    - >-
      THIS RECORD MOVES NEITHER H-STR-002 NOR H-IC-001. Both remain `weakened`.
      It bears on a CONTRACT ARTIFACT and its receipt chain, not on a mechanism.
    - >-
      NOT A RESEARCH RESULT AT ANY TIER. No measurement was taken, no run was
      produced, no curve, parameter size, solver or cost model is in scope, and no
      asymptotic exponent moves in any direction. All four promotion gates remain
      OPEN and untouched; the cost-model objections RT-CM-1 through RT-CM-6 remain
      OPEN.
    - >-
      THE LEDGER DOES NOT NOW VALIDATE. 985 errors remain and exit code is 1.
      Eleven other specifications remain unparseable and grandfathered in
      tools/validate_ledger_baseline.txt: EXP-DREG-001, EXP-DREG-002, EXP-EQJ-001,
      EXP-FB-001, EXP-FB3-001, EXP-ICI-001, EXP-REP-001, EXP-REP-002, EXP-SIG-001,
      EXP-SIG-004, EXP-SIG-005. The true claim is "these two experiments now
      register." No gate was unblocked, because no gate could be gated on a
      validator failing at 990.
    - >-
      AUTHORIAL INTENT IS UNPROVABLE HERE. Because the originals are unparseable
      there is no fact of the matter about what they MEANT as YAML. For
      EXP-STR-003 line 407 specifically: had double-quote syntax been intended,
      `"square"` would have denoted the bare string `square`; the repair instead
      yields a string CONTAINING the literal quote characters. That is the
      conservative raw-text-preserving choice and it is judged correct from
      context - the rest of the line is prose that cannot be YAML syntax under any
      reading, and every sibling in metrics.secondary has the same
      `- name: free-text` shape - but that judgement is INFERENCE FROM CONTEXT,
      NOT PROOF. What is established is source-text preservation, not recovery of
      an intended parse.
    - >-
      It establishes only that the two descriptions are UNCHANGED, not that they
      are technically accurate.
    - >-
      SCOPE OF MEASUREMENT: one branch (claude/ecdlp-batch006), one validator
      (tools/validate_ledger.py at tree c80b4e4f), one machine, two files, two
      lines. The 985 remaining errors and the 1142 grandfathered entries were not
      investigated and no claim is made about their health.
    - >-
      MODEL POLICY IS UNVERIFIED FOR BOTH REVIEWS. Both requested
      review-adversarial / review-xhigh and both resolved to claude-opus-5 with
      `model_verified: false`, because orchestration/adapter is absent on this
      branch and `doctor --probe` cannot be run. RT-20260727-004 records
      `fallback_used: true`. Neither claims equivalence to the requested policy,
      and no closure quorum is claimed or claimable.
    - >-
      THE SNAPSHOT ELEMENT IS HAND-VERIFIED, NOT DISPATCHER-VERIFIED. All eight
      BATCH-008 cards carry `commit_sha: null` under INT-BATCH007-T /
      INT-BATCH008-C, which make archive-task verification unreachable
      repository-wide. Both reviews checked a935f207 against every property the
      dispatcher's verifier WOULD check and it satisfies them; that is their
      check, not the dispatcher's, and no receipt hash is fabricated anywhere in
      this batch.

  unresolved_confounds:
    - id: DEF-VAL003-3
      severity: advisory_provenance
      text: >-
        RUN MANIFESTS BIND A SPECIFICATION ONLY BY `code.commit`, NEVER BY THE
        SPECIFICATION BLOB HASH. Nothing in the receipt chain detected this
        divergence, and nothing would detect a NON-BENIGN one: a hostile or
        careless post-execution edit of a frozen contract would be equally
        invisible to the 20 manifests, which attest a commit id and a dirty flag
        and nothing about the contract's content. Discoverable only by an
        explicit `git diff 92268c9e HEAD -- <path>`. This is a PRE-EXISTING
        property of the manifest schema that this repair did not introduce, and
        this repair is THE FIRST TIME IT HAS BITTEN. Closing it requires either a
        spec-blob field in the manifest schema or a frozen-contract hash recorded
        in the evidence record; neither is done here.
    - id: OBJ-7
      severity: standing_limitation
      text: >-
        The frozen contract was never MACHINE-BOUND to the execution. No run
        manifest references the specification path or any hash of it, and the 20
        runs were driven from CLI arguments; the pre-registration guarantee behind
        F1 is commit order plus human transcription. Equally true at 92268c9e and
        unchanged by the repair. Recorded as a standing limitation, not used to
        attack F1.
    - id: L4-GAP
      severity: recorded_defect_of_this_batch
      text: >-
        Between a935f207 and the commit carrying this record, the repository
        contained an in-place edit of two committed frozen contracts and no
        superseding record - structurally the same state that CORR-20260727-007
        corrects. That gap is real, is not repairable retrospectively, and is
        recorded rather than argued away (CORR-20260727-004, gate clause L4).
    - id: RC-2-GAP
      severity: open_item
      text: >-
        No SHA-256 of either PRE-EDIT file was computed. Every pre-edit identifier
        on record is a git-internal SHA-1 blob id, so retrieval is verifiable only
        within this git repository. Assigned to TASK-20260727-033.

  reviewed_by: coordinator
  independent_reviews:
