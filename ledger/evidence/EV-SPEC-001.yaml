    the validator, by TASK-20260727-030 (VAL-20260727-003, PASS) and the
    load-bearing ones again by TASK-20260727-031 (RT-20260727-004), neither of
    which authored the plan, the repair, the queue or the goal record. Strength
    does NOT propagate to any hypothesis: the direction is `neutral`, so no
    amount of strength here supports or weakens anything.
  claim_tier: toy
  claim_tier_note: >-
    `toy` is the floor of the tier scale and is used because no tier applies. No
    curve, no parameter size, no solver and no cost model is in scope.
  certificate_refs: []
  proof_status: derivation
  proof_refs:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-008/reviews/TASK-20260727-030/validation_report.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-008/reviews/TASK-20260727-031/red_team_report.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-008/reviews/TASK-20260727-031/adversarial_notes.md
