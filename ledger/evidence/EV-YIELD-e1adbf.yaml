  observations:
    - id: O-1
      text: >-
        EXP-YIELD-004 measured Semaev m=2 decomposition yield at p ∈ {1009, 4001, 9001}
        with B_frac=0.05, 8 trials per prime, exhaustive target check (up to 25 targets per curve).
    - id: O-2
      text: >-
        Mean ratio actual_yield / min(1, heuristic B^2/(2N)):
        p=1009: 0.80; p=4001: 0.98; p=9001: 1.00.
        TREND: ratio converges to 1.0 from BELOW as p grows.
    - id: O-3
      text: >-
        H-YIELD-001 predicts yield EXCEEDS the heuristic (ratio > 1.0). This measurement
        shows ratio ≤ 1.0 for all tested primes, converging to exactly 1.0 at p=9001.
        No super-heuristic signal is observed. The heuristic B^2/(2N) is an accurate
        and slightly over-optimistic predictor for small p, converging to exact accuracy
        as p grows. This is NEGATIVE evidence for H-YIELD-001.
    - id: O-4
      text: >-
        Scoped: m=2 only, at primes 1009 to 9001, B_frac=0.05. The BATCH-011
        void (INV-4 census issues) is ABSENT here — the direct exhaustive check avoids
        the normalization problems. Negative evidence applies only to m=2 at these scales.
        m=3 and larger primes are not tested.

  dominated_by: Pollard rho at exponent 1/2
  sota_delta:
    time_exponent: not_applicable
    note: Yield matches heuristic; no above-heuristic signal for m=2 at tested scales.

