  claim_tier: toy
  claim_tier_note: >-
    Toy scale, single prime p=2437, N=203 vertices. This is the first
    amendment since specification_v4.yaml to spend real, non-recoverable
    delta_E search compute (278.5s of a 3600s budget) -- not zero-cost
    re-analysis like BATCH-006 through BATCH-010.
  proof_status: empirical_only
  proof_refs:
    - experiments/EXP-SSIQ-a85692/runs/RUN-SSIQ-a85692-h/probe_delta_e_comparison.json
    - experiments/EXP-SSIQ-a85692/runs/RUN-SSIQ-a85692-h/probe_permutation_null_control.json
    - experiments/EXP-SSIQ-a85692/runs/RUN-SSIQ-a85692-h/execution_report.yaml
    - coordination/goals/GOAL-SSIQ-001/batches/BATCH-011/reviews/VAL-BATCH-011.md
    - coordination/goals/GOAL-SSIQ-001/batches/BATCH-011/reviews/RT-BATCH-011.md
  preregistration_binding:
    specification: experiments/EXP-SSIQ-a85692/specification_v8.yaml
    freeze_commit: 2c17b69e
    verified_by: TASK-20260806-ae09c6
    detail: >-
      specification_v8.yaml frozen 2026-08-06 at commit 2c17b69e, after
      THREE pre-freeze Red Team review rounds -- the deepest pre-freeze
      review this campaign has run for a single amendment, proportionate to
      this being the first real-compute-spending amendment since v4.
      Round 1 (DO-NOT-FREEZE): two blocking findings, PF-1 (PART B would
      crash on any unresolved vertex) and PF-2 (mis-cited the ORIGINAL
      procedure). Round 2 (DO-NOT-FREEZE): a NEW blocking finding, PF-9,
      reproducing PF-1's exact crash shape through a different,
      undetected path (F_p-rational vertices never wired as a required
      construction step). Round 3 (FREEZE-WITH-FIXES): PF-9's fix
      re-verified via a complete positive safety argument; no third
      blocking path found; two narrow advisories (PF-12, PF-13) applied.
      The Validator independently confirmed manifest.yaml's code.commit
      equals the freeze commit, and independently RE-EXECUTED the run's
      own script from a clean scratch directory, reproducing
      probe_permutation_null_control.json byte-for-byte identical
      (true C-REPRO; the comparison JSON differed only in per-vertex
      timing fields).
  observations:
    - id: O-1
      statement: >-
        EXECUTION FIDELITY IS CLEAN, INDEPENDENTLY CONFIRMED BY BOTH
        REVIEWERS. The Validator independently re-executed the committed
        script from a clean scratch directory: probe_permutation_null_control.json
        reproduced bit-for-bit identical (all 1000 trial values, every
        summary statistic, the PERSISTS label); probe_delta_e_comparison.json
        differed only in per-vertex wall_seconds timing fields (0 diffs in
        new_delta_map, coverage_gate, or comparison_against_archived) --
        true C-REPRO, not a self-report. The Red Team independently
        confirmed the PF-1/PF-9 gate (len(new_delta_map)==203), the PF-8
        graph-identity re-verification, and the pre-registered threshold
        arithmetic, and raised no objection to execution fidelity, cost
        reporting, or scope (single prime, no extension to H-SSIQ-36e970 or
        lever L4). This Coordinator's own precommit checks (snapshot
        receipt) independently re-derived the same coverage gate,
        archived-vs-new comparison, and PERSISTS threshold check from raw
        JSON before the snapshot commit, converging with both reviewers.
      supported_by: [TASK-20260806-64562f, TASK-20260806-edeb5a, TASK-20260806-ae09c6, TASK-20260806-359283]
      confidence: high
    - id: O-2
      statement: >-
        PART A's HEADLINE "0/203 VALUE DIFFERENCES" HAS SUBSTANTIALLY LESS
        DISCRIMINATING POWER AGAINST PF-6's RNG-SHARING HYPOTHESIS THAN ITS
        FRAMING IMPLIES -- A FINDING THIS COORDINATOR INDEPENDENTLY
        CONFIRMED BY DIRECT CODE READ, NOT MERELY ACCEPTED FROM THE RED
        TEAM'S REPORT. The Red Team traced find_roots_with_multiplicity
        (build_isogeny_graph.py:340-429): it uses RNG only to select which
        candidate element an internal Cantor-Zassenhaus-style splitter
        tries, and is CORRECTNESS-CHECKED before returning (raises
        RuntimeError if the returned root count does not exactly match the
        polynomial's squarefree-part degree) -- so its returned root
        MULTISET is a property of the polynomial itself, not of which RNG
        seed drove the search, whenever the search completes without
        truncation. This Coordinator independently re-read the same
        function and confirms the correctness-check argument holds exactly
        as described. Independently re-derived from probe_delta_e_comparison.json's
        own per_vertex_records: max per-vertex wall time across all 194
        vertices was 1.70s against a 15.0s budget (an 8.8x margin), 0
        timeouts -- and PF-4 (round 1 pre-freeze review) already disclosed
        the archived shared-RNG baseline used only ~7.9% of its own
        aggregate pool. Neither run came close to exercising the ONE
        channel through which RNG choice could change two_sided_search's
        output. Both "PF-6's confound is real" and "PF-6's confound does
        not exist" predict n_value_differs=0 under these conditions -- this
        specific comparison cannot empirically distinguish them, though it
        remains a genuine, valuable correctness/reproducibility check (a
        code bug or unexpected truncation would have produced a nonzero
        count).
      supported_by: [TASK-20260806-359283]
      confidence: high
    - id: O-3
      statement: >-
        THE REPORTED "MARGIN STRONGER THAN v7's ARCHIVED 23.1pp" (25.29pp)
        IS NOT EVIDENCE OF A STRENGTHENED SIGNAL; IT IS A DIRECTLY-TRACED
        ARTIFACT OF DIFFERING BASE-VALUE INSERTION ORDER BETWEEN TWO
        INDEPENDENTLY-DRAWN 1000-TRIAL NULL SAMPLES, NOT A LITERAL REPLAY.
        The Red Team demonstrated, by direct comparison against the actual
        rebuilt graph and the archived delta_map, that RUN-SSIQ-a85692-b's
        archived delta_map key order does not match the order a fresh
        reconstruction of the documented fp-then-non-fp-rational
        construction produces against the identical, verifiably-identical
        graph. Since Python's random.Random.shuffle performs a
        length-and-seed-determined index permutation independent of
        element values, this ordering mismatch alone is sufficient to make
        the two "same-PERMUTATION_SEED=20260806" 1000-trial samples two
        genuinely independent draws, not a re-derivation of the same
        sequence -- consistent with the observed pattern (identical
        medians, 0.5844155844155844 in both; differing, noisier extreme
        order statistics: max 0.7692 vs 0.7471, min 0.3836 vs 0.3571). The
        Red Team's own root-cause trace was not completed (it did not
        identify why the archived JSON's key order departs from the
        documented construction), but the mismatch's EXISTENCE, not its
        cause, is what carries this finding, and this Coordinator finds the
        demonstrated mismatch sufficient on its own to withdraw the
        "stronger signal" reading. THIS RUN's OWN margin (25.29pp)
        independently clears the pre-registered 13.1pp PERSISTS threshold
        comfortably, on its own terms, without needing the cross-run
        comparison to v7's archived figure -- the mechanical PERSISTS
        label itself is unaffected by this correction; only the
        "strengthening" narrative is withdrawn.
      supported_by: [TASK-20260806-359283]
      confidence: high
    - id: O-4
      statement: >-
        THE CORRECT, NARROWER, MORE DEFENSIBLE STATEMENT THIS RUN SUPPORTS:
        FOR p=2437 SPECIFICALLY, PF-6's RNG-SHARING CHANNEL IS CLOSED BY A
        SCALE-BOUND DETERMINISM/CORRECTNESS ARGUMENT, NOT BY THIS
        COMPARISON'S EMPIRICAL POWER ALONE. This is, in one sense, a
        STRONGER conclusion than "we ran it once and it matched" (it does
        not depend on this specific BASE_SEED's luck -- per O-2's
        correctness-check argument, any seed would produce the same
        194/194 non-F_p-rational values as long as no vertex truncates),
        and in another sense NARROWER: the argument is explicitly
        SCALE-BOUND, requiring non-truncated search, which held here
        (max 1.70s of 15.0s) but is not guaranteed at larger primes or
        crypto scale, where table-build cost grows with field arithmetic
        cost and truncation becomes plausible -- at which point PF-6's
        RNG-sharing mechanism becomes live again and this style of probe
        would regain genuine empirical discriminating power. Any future
        widening of this probe design to the other three primes (3889,
        5737, 7333) or to larger primes MUST check per-vertex wall-time
        data for near-timeout cases first, per the Red Team's explicit
        recommendation, rather than assuming the same "0 differences"
        outcome carries the same evidentiary weight.
      supported_by: [TASK-20260806-359283]
      confidence: high
    - id: O-5
      statement: >-
        THIS RESULT LICENSES RESTORING DEC-20260806-498531 D-2's "GENUINE
        STRUCTURAL FACT" LANGUAGE FOR p=2437 ALONE -- SUPERSEDING
        EV-SSIQ-a64d92's NARROWER "real, control-confirmed clustering
        signal of undetermined cause" FRAMING FOR THIS ONE PRIME ONLY, NOT
        FOR THE OTHER THREE. specification_v8.yaml's own PERSISTS threshold
        (real_depth0_fraction>=0.95 AND margin>=13.1pp) was pre-registered
        before this run's execution, precisely to prevent post-hoc
        threshold selection, and this run's own fresh margin (25.29pp,
        independent of the withdrawn cross-run comparison per O-3) clears
        it comfortably. Combined with O-4's determinism argument, the
        RNG-sharing half of PF-6's confound is now closed for p=2437 with
        HIGH confidence -- the strongest epistemic basis this campaign has
        produced for ANY of ANOM-1's four primes. The budget-shrinking half
        of PF-6 remains addressed only by PF-4's disclosure (the archived
        baseline very likely never neared its budget), not independently
        re-tested by this run; and p=3889, p=5737, p=7333 remain entirely
        untested by any RNG-independence probe.
      supported_by: [TASK-20260806-359283, TASK-20260806-ae09c6]
      confidence: high
  inference: >-
    RUN-SSIQ-a85692-h executes exactly as specification_v8.yaml requires,
    confirmed independently by both the Validator (true C-REPRO, all
    headline numbers recomputed from raw JSON) and the Red Team (execution
    fidelity clean, no protocol deviation). The Red Team's adversarial
    review, independently re-derived and confirmed by this Coordinator,
    corrects the evidentiary framing of both headline comparisons: PART A's
    "0/203 differences" is close to the algorithm's guaranteed output at
    this toy scale given two_sided_search's own correctness invariants
    (O-2), and PART B's "stronger than archived" margin is a base-value
    ordering artifact between two independent Monte Carlo draws, not a
    strengthened signal (O-3). The correct conclusion this run supports is
    narrower in scope but stronger in kind: PF-6's RNG-sharing channel is
    closed for p=2437 by a scale-bound determinism argument (O-4), and this
    licenses restoring "genuine structural fact" language for p=2437 alone
    (O-5), with the budget-shrinking confound half and the other three
    primes still unresolved.
  boundaries:
    - >-
      No claim about H-SSIQ-36e970, a delta_E-gradient's existence, or a
      p^{1/4} algorithm. Lever L4 is NOT retired.
    - >-
      "Genuine structural fact" is licensed by this record for p=2437
      ONLY, per specification_v8.yaml's own OBJECTIVE_BOUNDARY. It is NOT
      extended to p=3889, p=5737, or p=7333, which remain at
      EV-SSIQ-a64d92's narrower "control-confirmed clustering signal of
      undetermined cause" framing until their own RNG-independence probes
      are run.
    - >-
      The determinism argument closing PF-6's RNG-sharing channel (O-4) is
      SCALE-BOUND: it requires non-truncated search, verified true here via
      per-vertex timing (max 1.70s of 15.0s) but not guaranteed at larger
      primes or crypto scale. Any future widening MUST check per-vertex
      near-timeout data first, not assume the same outcome.
    - >-
      The 25.29pp-vs-23.1pp cross-run margin comparison MUST NOT be cited
      as a strengthened signal (O-3); only this run's own fresh margin
      against its own pre-registered threshold is a valid basis for the
      PERSISTS label.
    - >-
      The budget-shrinking half of PF-6's confound remains addressed only
      by PF-4's disclosure (not independently re-tested by this run).
    - >-
      Toy scale throughout (p=2437, N=203); nothing transfers to
      cryptographic scale. Evidence strength stays capped at preliminary;
      model independence remains session-only.
  unresolved_confounds:
    - >-
      The other three primes (3889, 5737, 7333) remain entirely untested by
      any RNG-independence probe; this evidence does not extend to them.
    - >-
      The Red Team's own required_controls name two concrete, cheap
      follow-ups, neither yet executed: (a) a second probe at a different
      BASE_SEED, testing whether n_value_differs stays at 0 (predicted yes,
      per the determinism argument, not luck); (b) a truncation-mutation
      control (artificially shrinking PER_VERTEX_BUDGET_SECONDS well below
      the observed ~1.15-1.70s completion range) to directly test the
      determinism argument's own boundary condition -- this is the cheaper
      and more mechanism-targeted of the two, per the Red Team's own
      ranking.
    - >-
      Model independence remains absent and unverifiable in this
      environment, unchanged from every prior batch.
