evidence:
  id: EV-FALSIFY-246cd8
  hypothesis_id: H-FALSIFY-40538b
  question_id: RQ-FALSIFY-a2c501
  experiment_ids: [EXP-FALSIFY-d770c1]
  run_ids: [RUN-FALSIFY-d770c1-005]
  finding_under_test: KN-FIND-982fdf
  type: analytical
  direction: supports
  direction_note: >-
    Supports the clauses tested, which are now DECIDED rather than argued.
    Contradicts nothing in the theorem. What it reports against is the PROMOTION:
    the knowledge record drops two caveats its own source document states
    explicitly.
  strength: strong
  claim_tier: toy
  proof_status: certificate
  proof_status_basis: >-
    Definition 3 makes the order-based class finite on a fixed curve, so clauses
    (d) and (e) are decidable there. Every order-based oracle was enumerated on
    each of 72 curves and every clause decided, not sampled.
  proof_refs:
    - experiments/EXP-FALSIFY-d770c1/runs/RUN-FALSIFY-d770c1-005/raw-result.json
    - experiments/EXP-FALSIFY-d770c1/falsify/run_ct_minimality.py
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-122/tasks/TASK-20260805-008/ct_minimality_lemma.md
  recorded_at: '2026-08-08'

  observations:
    - id: O-1
      text: >-
        RULE 2, AND IT WAS LOAD-BEARING. KN-FIND-982fdf uses "order-based"
        throughout and never defines it; a uniqueness claim over an undefined
        class is not decidable. The extended currency check flagged 2
        coordination/ documents, and the definition is in one of them --
        Definition 3 of BATCH-122/TASK-20260805-008/ct_minimality_lemma.md: O is
        order-based iff there exist tau in {0..p} and eps in {0,1} with
        O(P) = 1_{x(P) < tau} XOR eps. Without the coordination/ sweep added in
        CORR-20260808-733115 this probe would have reported the definition as
        missing, which would have been wrong.
    - id: O-2
      text: >-
        THE CLAUSES ARE DECIDABLE, SO THEY WERE DECIDED. Definition 3 makes the
        order-based class finite on a fixed curve -- every prefix and suffix of
        the ordered x-values, identified as functions on E(F_p). Enumerating it
        exhaustively on 72 curves over p in 11..53: clause (d) holds on every
        curve, with exactly TWO order-based oracles identifying F_t, namely C_t
        and its complement, never a third. Zero violations. This is the first
        result under RQ-FALSIFY-a2c501 that decides a corpus clause rather than
        sampling it.
    - id: O-3
      text: >-
        CLAUSE (e) ALSO HOLDS, and its own weakness is confirmed quantitatively.
        Predecessors of a non-constant oracle under the pointwise information
        order are exactly {0, 1, O, not-O} on every curve, and distinct effective
        cuts are pairwise incomparable under that order. But the identical
        property holds for 40 of 40 randomly drawn 1-bit oracles of the same
        1-set size, which have nothing to do with the order-based class. Clause
        (e) standing alone therefore distinguishes C_t from nothing.
    - id: O-4
      text: >-
        AND THE SOURCE DOCUMENT SAYS SO. ct_minimality_lemma.md, Lemma 5(i):
        "This holds for EVERY non-constant 1-bit oracle -- including random
        hashes -- so the 'nothing between trivial and C_t' statement is true but
        VACUOUS unless combined with Lemma 4 (see correction C1)." The word
        vacuous appears 4 times in that document. It also records an explicit
        non-claim: "No claim that 'minimal' holds among *all* 1-bit oracles -- it
        does not (Section 4.2)."
    - id: O-5
      text: >-
        CAVEAT LOSS ON PROMOTION -- THE ACTUAL DEFECT HERE. Neither caveat
        survives into the knowledge record. KN-FIND-982fdf contains the word
        "vacuous" ZERO times and carries no statement that minimality fails among
        all 1-bit oracles. Its clause (e) is presented as a substantive component
        of a theorem carrying confidence: proved and evidence_level: theorem, and
        its Review status describes the qualifications as "presentation-level".
        A reader of the corpus record cannot learn what a reader of the source
        document is told plainly. The source is more careful than the record
        promoted from it, and promotion is where the care was lost.
    - id: O-6
      text: >-
        PROBE DEFECT, RECORDED RATHER THAN SILENTLY FIXED. A first version of the
        antichain check compared 1-sets by INCLUSION and reported "antichain:
        False" on all 72 curves -- prefixes are of course nested. The claim is
        about the pointwise INFORMATION order, under which O' <= O iff O' = h(O),
        so only {0, 1, O, not-O} lie below O. Under the correct order the
        antichain holds everywhere. This is the third time in this program that a
        wrong instrument produced a confident false refutation: the F-1 degree
        drop, the F-10d naive aggregation, and this. In all three the claim was
        right and the probe was wrong.

  interpretation: >-
    KN-FIND-982fdf's clauses (d) and (e) are correct and are now decided over the
    class they quantify, which is stronger than the derivation-tier status the
    record carries for them. The defect is not in the theorem but in the
    promotion: two caveats that the source lemma states explicitly -- that (e) is
    vacuous standing alone, and that minimality fails among all 1-bit oracles --
    are absent from the knowledge record, which is what most readers will read.

  what_this_does_not_establish: >-
    Clauses (a), (b) and (c) were NOT tested. (b), the non-simulability claim, is
    the substantive one and is a statement about generic algorithms that no
    enumeration over one curve can decide. Nothing here bears on it. The decision
    is toy-scale, p in 11..53, and the class enumerated is the one Definition 3
    defines -- oracles depending on y or on the full point are outside it, as the
    source document itself records under correction C7. Deciding (d) and (e) also
    does not make the corollary true: it is the conjunction with (b) that carries
    the record's significance claim, and (b) is untested here.

  dominated_by: not_applicable_methodological
  sota_delta:
    time_exponent: not_applicable
    note: No algorithmic claim.

  proposed_correction: >-
    A superseding record for KN-FIND-982fdf that (a) carries the source's own
    vacuity note on clause (e), (b) carries the explicit non-claim that
    minimality fails among all 1-bit oracles, (c) states Definition 3 inline or
    cites the lemma document for it, so the class the uniqueness claim quantifies
    over is present in the record, and (d) may cite this run as an exhaustive
    decision of (d) and (e) at toy scale. The theorem itself needs no change.
    Coordinator authority.

  knowledge_promotion: warranted
  knowledge_promotion_reason: >-
    The reusable content is the defect class, not this instance: promotion into
    the corpus can strip caveats that the source document states explicitly, and
    the promoted record is what later readers cite. That is distinct from every
    defect class already in docs/falsification-program.md, all of which concern
    errors made in the record rather than care lost between two records.
    Proposed as a technique entry; Coordinator approval required.

  scope_limits: >-
    p in {11,...,53}, 72 non-singular curves, threshold t at the median distinct
    x-value, order-based class per Definition 3 enumerated exhaustively. Clauses
    (d) and (e) only.

  independent_review_required: false
  independent_review_note: >-
    Contradicts no claim in the finding and asserts no new mathematics; it
    decides two finite statements and reports a documentary discrepancy between a
    record and its own source. Both are re-checkable in seconds.

  authority_note: >-
    Evidence only. No hypothesis status changed, no finding edited or
    superseded (AGENTS.md rule 1).
