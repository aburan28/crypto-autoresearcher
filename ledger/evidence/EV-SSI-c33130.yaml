  observations:
    - id: O-method
      text: >-
        The frozen propose/evaluate method admitted one mechanism and required
        stopping at the earliest exact obstruction. Three fresh scientific
        sessions owned disjoint joints, one blind session rederived from the
        literal public statement, and a separate J7 session reviewed report
        fidelity. No scientific, implementation, formalizer, experiment,
        benchmark, or parameter-selection run occurred.
    - id: O-transport
      text: >-
        For a supported cyclic isogeny phi of degree d, the integral maps
        F_phi(alpha)=phi alpha hat(phi) generate a rank-four unital endpoint
        order S_phi. Relative to the rationally conjugated complete base-ring
        basis, its change matrix is diag(1,d,d,d), giving the scoped exact
        index [End(E):S_phi]=d^3. J1 independently reviewed this narrow
        transport diagnostic.
    - id: O-normalization
      text: >-
        Normalized conjugation is not uniformly integral because a general
        base-ring endomorphism need not preserve the cyclic kernel line. Thus
        neither the integral transported tuple nor uniform division by d
        supplies the requested complete endpoint-ring basis.
    - id: O-O1-stop
      text: >-
        KeyGen stops at the undefined CompleteBasisAtEndpoint(pp,phi,W0)
        interface. No uniform algorithm, evaluable output representation,
        saturation/full-ring certificate, conversion cost, retry law, or
        failure bound is supplied. This is a construction gap, not a lower
        bound or proof that polynomial completion is impossible.
    - id: O-downstream
      text: >-
        EdgeLabel, RingPotential, Encrypt, and Decrypt are undefined after the
        O1 stop. O1--O6 all remain open, and no executable PKE or correctness
        theorem exists. J2 is inconclusive on O3/O4; J3 is inconclusive on
        O5/O6 and the separate security gates.
    - id: O-objectives
      text: >-
        Complete PKE, IND-CPA, active security, attacker-to-complete-EndRing
        extraction, novelty, QPT/QROM security, and NIST Category 5 are all
        unestablished. The conditional raw endpoint-plus-XOR payload-flip
        control is not an attack on a CEFC-I encryption algorithm because no
        such algorithm was instantiated.
    - id: O-composition
      text: >-
        The normalized O1--O6 conjunction fails. One mechanism was evaluated,
        zero candidates survived for validation, and implementation, theorem,
        benchmarking, or parameter selection is not eligible from this batch.
    - id: O-procedure
      text: >-
        The frozen independence checker passed for all three scientific
        reports: every joint was owned and attested, sibling-read blindness was
        preserved, and controls were declared. This is a procedure check, not
        a mathematical proof or security theorem.
    - id: O-documentation
      text: >-
        Fresh J7 holds/PASSes documentation fidelity only. All five report
        artifacts match the snapshot hashes and all six PDF pages were
        visually inspected. Minor diagram crowding, source-path navigation,
        editable/rendered compression, and pagination deviations are
        nonblocking; no scientific or security gate changes.
