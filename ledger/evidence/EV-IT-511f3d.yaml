    - "Silverman, AEC Ch. V Theorem 3.7 (Tate conjecture / isogeny theorem for elliptic curves over finite fields)"
    - "Hasse bound: #E(F_p) = p + 1 - t with |t| <= 2*sqrt(p)"

  observations:
    - id: O-1
      text: >-
        TASK-20260804-002 (BATCH-048) formally evaluated the class-invariant
        argument from EV-IT-aefd12 O-6 using the Tate isogeny theorem. The
        theorem states: two ordinary elliptic curves over F_p are F_p-isogenous
        if and only if they have the same trace of Frobenius (equivalently,
        the same #E(F_p)). This is an unconditional theorem, not a heuristic.
        See class_invariant_analysis.md for the full formal statement and proof
        sketch.

    - id: O-2
      text: >-
        Direct implication for H-IT-001: the three named special families
        (anomalous trace=1, MOV embedding-degree, Weil-descent/GHS) are all
        isogeny-class invariants determined by #E(F_p). An anomalous curve has
        #E(F_p) = p (trace=1). A generic non-anomalous curve has #E(F_p) = p+1-t
        with t ≠ 1. These two curves are NOT in the same F_p-isogeny class and
        cannot be connected by any ordinary F_p-isogeny path of any finite degree
        (coprime to p). Therefore rho_special = 0 for ANY non-anomalous starting
        curve at ANY scale — it is a mathematical certainty, not a finite-scale
        artifact or a computable fact with uncertainty.

    - id: O-3
      text: >-
        EV-IT-aefd12 O-6 stated the obstruction as "path length at least
        p/(ell^2) — exponentially long." This understates the result. The Tate
        theorem gives DISCONNECTION: no finite path exists from a non-anomalous
        curve to an anomalous curve via ordinary isogenies. The empirical
        rho_special=0 in BATCH-047 is correct and cannot be improved by using
        larger primes or more hops.

    - id: O-4
      text: >-
        The analysis identifies three successor directions for the ECDLP transfer
        attack line (see successor_directions.yaml): DIR-1 (supersingular bridge,
        low priority, dominated by rho), DIR-2 (find a non-invariant special
        family, medium priority, mechanism open), DIR-3 (within-class reformulation,
        medium priority, requires new mechanism). None beats Pollard rho without
        a new mechanism proposal.

  dominated_by: >-
