evidence:
  id: EV-ECDLP-6bdff6
  hypothesis_id: H-ECDLP-60de36
  experiment_ids: [EXP-ECDLP-f49f75]
  run_ids: [RUN-ECDLP-f49f75-01, RUN-ECDLP-f49f75-02, RUN-ECDLP-f49f75-03]
  validation_ids: [VAL-20261015-1c3bff]
  type: empirical
  direction: contradicts
  strength: preliminary
  strength_basis: >-
    One frozen toy grid, one solver family (Singular std/slimgb + fglm), 6
    instances per cell; independently re-derived and partially re-run
    (VAL-20261015-1c3bff, 48 instances, deterministic fields identical, timings
    within ~15%). Not replicated with an F4/F5 solver.
  claim_tier: toy
  proof_status: empirical_only
  proof_refs: []
  observations:
    - id: O-1
      text: >-
        Arm A (2-isogeny-chain encoding of x(R + <K>)) median std+fglm time
        exceeds arm B (same set, dense minimal polynomial) in 8/8 jointly
        completed cells under std (ratio 2.0x at m=2,L=3 rising to 654x at
        m=2,L=8; 5.6x and 35x at m=3,L=3,4) and in 7/8 under slimgb with one
        1 ms tie at m=2,L=3 (ratios up to 146x).
    - id: O-2
      text: >-
        Arm A timed out (600 s) on every instance at m=2,L=9 and m=3,L=5;
        arms B and C completed m=2 through L=11 and m=3 through L=5.
    - id: O-3
      text: >-
        Arms B (isogeny set) and C (random set) are indistinguishable in cost
        at every cell (within the min-max spread): the set's isogeny origin is
        invisible to the solver.
    - id: O-4
      text: >-
        Meet-in-the-middle enumeration (arm E) needs 629 median group
        operations at m=3,L=5 (sub-ms Python) versus 70-340 s for the
        completing Groebner arms; every Groebner arm is slower than
        enumeration at every cell.
    - id: O-5
      text: >-
        Positive control: 248/248 non-excluded planted decompositions lie in the
        computed variety. RUN-01 m=2,L>=8 Groebner cells are excluded (AMD-02
        launcher overflow, caught by this control) and re-run as RUN-03.
  frozen_criteria_outcome: >-
    success criterion not met; falsification criterion met on both limbs
    (A >= B in 100% of jointly completed cells under both solvers; at m=3 A
    retired at L=5, no larger than B and C, which completed L=5).
  scope_limits:
    - toy primes 7..23 bits, m in {2,3}; P-256 needs m=6, L=44
    - one Groebner implementation family; msolve/Magma unavailable
    - says nothing about other modellings of the chain or about P-256 security
  dominated_by: Pollard rho at exponent 1/2 (and, at these sizes, plain enumeration)
  sota_delta:
    time_exponent: not_applicable
    note: no advantage observed; chain encoding is a constant-to-exponential slowdown at toy scale
