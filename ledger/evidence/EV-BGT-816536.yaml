  proof_status_basis: >-
    Schema slot filled under DEC-20260805-7b3e91 from this record's own committed
    text: its observations are measurements and it archives no counterexample
    certificate or derivation note. empirical_only with empty proof_refs describes
    what the record has; it asserts nothing new.
  context: >-
    This evidence record is for the H-PSEUDO conjecture (DL pseudorandomness
    for structured points), which is related to but distinct from H-GGM-001.
    H-PSEUDO: max_{k≠0} |Σ_{P∈F} e^{2πi k*DL(P)/N}| = O(sqrt(B)).
    Tagged under H-GGM-001 as the closest existing hypothesis; no separate
    H-PSEUDO record exists yet.

  observations:
    - id: O-1
      text: >-
        Computed all discrete logs in E(F_p) at p ∈ {1009, 2003, 4001} (feasible
        by exhaustive enumeration at these sizes). Computed max_{k=1..300}
        |Σ_{P∈F} e^{2πi k*DL(P)/N}| for F = small-x factor base at B_frac=0.05-0.10.
    - id: O-2
      text: >-
        Ratio C = max|hat{1_F}(k)| / sqrt(B):
        p=1009: C=3.107 (n=1); p=2003: C=2.628 (n=2); p=4001: C=2.872 (n=1).
        Mean C ≈ 2.9. No systematic growth with p across tested range.
    - id: O-3
      text: >-
        Empirical support for H-PSEUDO with constant C ≈ 3. The ratio C is
        bounded (not growing) across p=1009..4001 at toy scale. This is consistent
        with H-PSEUDO being TRUE with constant C ≈ 3. The yield measurements
        (EV-YIELD-e1adbf/ca4b02/7c3195) converging to heuristic is explained:
        yield error = O(C^m/N^{1/2}) ≈ O(3^m/N^{1/2}) — negligible at p≥4001.
    - id: O-4
      text: >-
        Scoped: only k=1..300 tested (not all N-1 values of k). At p=1009, N≈1000
        so this covers 30% of all k. The maximum might be larger at other k values.
        Full measurement (all k) would be needed for a complete empirical bound.

  dominated_by: Pollard rho at exponent 1/2
  sota_delta:
    time_exponent: not_applicable
    note: >-
      Empirical support for H-PSEUDO with C≈3. If H-PSEUDO holds with constant C,
      then Semaev yield ≤ heuristic + O(C^m/N^{1/2}) — confirming no super-heuristic
      yield and no sub-rho index calculus.

  knowledge_promotion: warranted_pending_coordinator_decision
  knowledge_promotion_reason: >-
    First empirical measurement of H-PSEUDO character sum constant C ≈ 3.
    Consistent with H-PSEUDO being true. Novel measurement connecting DLP Fourier
    analysis to yield bounds.

  recorded_by_task: TASK-20260804-086
