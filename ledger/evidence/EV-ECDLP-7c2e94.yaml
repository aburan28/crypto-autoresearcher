    - id: O-4
      text: >-
        In every finished seed the separate step count is at least the joint
        step count (9 of 9 rows), as D5 requires. No ratio or median is
        computed here: the contract forbids a ratio from an unscored census.
    - id: O-5
      text: >-
        Diagnostic field h1 is false on both labelings. h1 is not a
        preregistered metric. It is recorded and not interpreted.

  comparison:
    - >-
      Against the preregistered reading: neither the positive reading (scored
      and 5*S >= 7*J with a permuted ratio not strictly below 7/5) nor the
      negative reading (scored and below, or failing the permuted control) is
      reachable. The contract's own decision_impact.on_unscored applies:
      record that fewer than 12 seeds finished, and do not compute a ratio
      from the dropped seeds.
    - >-
      Against the index-calculus baseline and the matched rho: not applicable.
      This is an additive group of order 503 with generator 1, with no curve,
      no index-calculus pipeline and no ECDLP cost. No improvement over the
      index-calculus baseline is measured. The distance remaining to the
      matched rho is not measured by this experiment.

  inference: >-
    The frozen contract cannot score H-ECDLP-b4ebad on its frozen seeds. By D2
    the drops are structural: they come from the functional graph of the
    r-adding walk and its DP set (D3), not from the step cap, and by D4 a
    re-execution reproduces the same unscored census. The hypothesis is
    therefore untested, neither supported nor weakened. O-3 is consistent with
    D3: the ten seeds dropped under both labelings are consistent with targets
    outside the generator's component, which does not depend on the labeling,
    and the three identity-only drops with DP placement. That reading has not
    been checked against the graphs. Even a scored v1 ratio would have measured
    the spread of DP hit indices on one shared walk (D5), not the cost of
    separate walks. A successor contract needs a walk-restart rule so that
    drops cannot be structural, a genuinely executed separate arm, per-seed
    records with drop reasons, and controls that can fail.

  boundaries:
    - >-
      Exactly one group: Z/503Z under addition, generator 1, four planted
      targets per seed, 16 frozen seeds, 16 jump branches, DP modulus 16
      (identity and one fixed permuted labeling), cap 2000 (non-binding by D2).
    - >-
      The derivation concerns THIS driver: an r-adding walk with no restart
      rule and walks that share one function. It is not a statement about
      distinguished-point reuse across targets in general (KR-RHO-46c2c6), and
      not about any elliptic-curve group.
    - >-
      No ECDLP cost is measured. No improvement over the index-calculus
      baseline is measured or claimed (AGENTS.md "Every improvement is a
      success"). The distance remaining to the matched rho is not measured.
      The generic exponent 1/2 is untouched, as the contract states.
    - Nothing here is a statement about the security of any curve.

  unresolved_confounds:
    - >-
      Whether the joint table reaches S/J >= 7/5 on 12 or more scored seeds is
      untested.
    - >-
      Whether the ten both-labeling drops are component separation (D3) is
      inferred, not measured. The driver records no drop reasons (V-6).
    - >-
      The derivation has not been independently re-derived. A reviewer should
      confirm D2 (non-binding cap) and D5 (accounting identity).
    - >-
      Binding of the executed code to trial-plan.json source_sha256 (V-4) and
      the session's report that check.py exited 0 are unverified in this
      review.

  obstruction_note: >-
    No obstruction block: the direction is neutral, no obstruction is asserted
    and no lane is closed. The reversal was considered anyway. That DP walks
    without restart get trapped (DP-free cycles, separate components) is a
    known instrument hazard. The standard remedy is to abandon a walk after a
    multiple of 1/theta steps with no DP (van Oorschot-Wiener; recalled
    pointer, unverified). It serves only as an instrument-design rule for a v2
    contract. No theory takes it as a hypothesis, and nothing is spawned.

  sota_delta:
