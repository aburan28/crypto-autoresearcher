  derivation_note:
    author: coordinator (review DEC-20261016-a3f58d), hand derivation from run.py
    notation: >-
      N = 503. For one seed, jumps j_0..j_15 in {1..502}, the step map
      f(x) = (x + j_{x mod 16}) mod N on the set {0..N-1}, start s, targets
      t_1..t_4 (distinct, nonzero). Identity DP set D = {x : x mod 16 = 0};
      permuted DP set D' = {x : pi(x) mod 16 = 0}. g_i is the generator step
      index stored for the DP that target i meets, and t-steps_i is the target's
      step count to it.
    steps:
      - id: D1
        text: >-
          Recovery is the identity. In first_hit the loop keeps
          current = (t + coefficient) mod N, so recovered = (current -
          coefficient) mod N = t for every hit. arm() therefore never returns
          None because of a mismatch, and the invalidation rule "a certified
          coefficient differs from the planted residue" cannot fire. With
          generator 1 every element is its own logarithm, so the planted check
          tests nothing.
      - id: D2
        text: >-
          The cap never binds. f is a deterministic self-map of an N-element
          set, so every trajectory enters its cycle within N - 1 steps, and its
          first N points contain every point it will ever visit. points_for
          stores the DPs among 2001 generator points and first_hit tests steps
          0..2000, and 2000 >= N. So every DP the generator walk ever reaches is
          stored, and every point the target walk ever reaches is tested. A
          dropped seed stays dropped for every cap >= 503. The unscored census
          is not a timeout and not budget-limited.
      - id: D3
        text: >-
          Finish condition. Target i finishes if and only if its trajectory
          meets the generator trajectory at some point m and the generator
          trajectory from m onward contains a DP. Equivalently, t_i lies in the
          same component of the functional graph of f as s, and that
          component's cycle contains a DP or a DP lies on the generator's tail
          at or after m. A seed finishes only if all four targets do. The
          components do not depend on the labeling; the DP set does.
      - id: D4
        text: >-
          Determinism. Every random choice is drawn from SHA-256 of a fixed
          label and counter, with no OS entropy. Re-executing the frozen driver
          reproduces the identical census, which is what check.py asserts.
          Replicating this contract would add provenance, not information.
      - id: D5
        text: >-
          Accounting identity. joint = max(g_i) + sum(t-steps_i) and
          separate = sum(g_i + t-steps_i), so S - J = sum(g_i) - max(g_i) >= 0
          for every finished seed. S/J >= 1 is true by construction. Whether it
          reaches 7/5 depends on how spread out the g_i are relative to J. No
          independent separate walk is executed.

  observations:
    - id: O-1
      text: >-
        Working-tree values (unpublished RUN-ECDLP-3d61b8 raw-result.json;
        counts are exact, deterministic, no spread). Identity labeling: 3 of 16
