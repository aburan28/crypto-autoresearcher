  inference: >-
    Compose J1 and J2 and the round yields no recordable closure. The
    mathematics of the Proposition holds and was independently re-derived blind,
    so nothing here suggests the coordinate-valuation-profile family D1 is
    promising. But the inference from strict-GGM simulability to a scoped
    rejection of ECDLP-IDEA-436 does not hold as stated, by the producer own
    method ceiling and by KN-LIT-7606 as the memo itself quotes it; the stated
    scope is missing the primality hypothesis the exponent step needs; the O(1)
    figure is interface-conditional; and the record hypothesis is a disjunction
    of which only one disjunct was gated. The disposition survives only on the
    model-free Corollary 4.3 ground, which no committed artifact currently
    foregrounds. The correct action is a bounded, zero-compute producer erratum
    re-founding the verdict on that ground and applying the six named repairs
    (the four red-team blocking repairs, validator R1, and the OBJ-8 scope
    split),
    followed by the toy-scale tabulation control that supplies the null object
    this round entirely lacks. Recording a closure now would ship a defective
    licensing chain and a missing hypothesis into the ledger behind a verdict
    label.

  boundaries:
    - >-
      B-1. Everything established here is scoped to ECDLP-IDEA-436 disjunct D1
      - the pairwise coordinate-valuation profile - over the parameter class
      E/F_p ordinary with good reduction, p at least 3, S of order n with
      gcd(n,p) equal to 1, a Weierstrass model over Z_p, the canonical order-n
      prime-to-p lift, and, per finding F-1, a model realising the good
      reduction. Outside that class the collapse argument does not run as
      written - bad or additive reduction, p equal to 2 under the short form,
      non-Weierstrass models, a point whose order is divisible by p, a functional
      on the formal group, or a non-minimal integral model.
    - >-
      B-2. Disjunct D2 - a fixed statistic of the precision-r coordinate digits
      of a SINGLE lifted point - is NOT gated by this round. It was assessed only
      at the weaker relative tier and remains open.
    - >-
      B-3. KN-OPEN-3417fc is NOT closed, resolved, or narrowed by this record.
      That open problem quantifies over any computable non-group-theoretic
      coordinate or valuation invariant, and its own negative-resolution
      criterion requires a MEASUREMENT at toy p that has not been performed.
      Note for the record that D1 is the open problem own headline worked
      example, which makes the pending disposition more consequential than the
      phrase one named family conveys - and equally makes the missing
      measurement more consequential.
    - >-
      B-4. Nothing here bears on ECDLP hardness, on any speedup, attack,
      novelty, breakthrough or cryptographic-scale transfer, in any direction.
      Pollard rho and BSGS are unchallenged. The anomalous additive transfer
      (KN-TECH-033) lies OUTSIDE the gated scope entirely, since gcd(n,p) equal
      to 1 excludes curves of cardinality p, so this round says nothing about
      it and must not be read as saying anything about it.
    - >-
      B-5. This record makes no official status change of any kind.
      ECDLP-IDEA-436, KN-FIND-002, KN-FIND-b7e091, KN-OPEN-3417fc, H-CREP-001
      and EXP-CREP-001 are untouched. Corrections supersede and never overwrite.
    - >-
      B-6. Zero runs, zero experiments, zero implementations, zero p-adic
      arithmetic, on the producer side and on both review sides. No timing, no
      seed, no sample, no measured obstruction. Any statement in this record
      that reads like a quantity is a derived value over a stated hypothesis
      class, and is labelled as such.
    - >-
      B-7. Both reviewers recorded resolved_model_id as claude-opus-5 and
