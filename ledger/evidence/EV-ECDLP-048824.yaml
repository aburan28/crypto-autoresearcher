  round_composition:
    composition_rule: >-
      Joints are the claim load-bearing steps and are conjunctive by
      construction, as templates/research-records.md states them - if one
      fails, the claim fails. A blinded reviewer reports on its own joint and
      cannot see the other, so neither report is a whole-claim verdict and the
      Coordinator composes them. A validator holds on J1 and a red team breaks
      on J2 is therefore a SPLIT, and the claim as stated does not carry.
    joints:
      - joint_id: J1
        name: 'Mathematical correctness of the Proposition and its two lemmas'
        owner_task: TASK-20260831-c6ceb9
        owner_role: validator
        requested_policy: review-adversarial
        reasoning_effort: xhigh
        resolved_model_id: claude-opus-5
        resolved_model_probe_verified: false
        independent_session: true
        attested_verdict: holds
        full_disposition_as_recorded: holds_with_findings
      - joint_id: J2
        name: 'Does simulability actually license the scoped rejection, at the stated scope and tier'
        owner_task: TASK-20260831-62019a
        owner_role: red-team
        requested_policy: review-adversarial
        reasoning_effort: xhigh
        resolved_model_id: claude-opus-5
        resolved_model_probe_verified: false
        independent_session: true
        attested_verdict: breaks
        full_disposition_as_recorded: >-
          holds_with_required_repairs in the report body, revised to breaks in
          the operative top-level attestation. See procedure_deviations PD-3.
    composed_disposition: >-
      The mathematics holds; the licensing inference as stated does not. The
      producer disposition scoped_rejection_simulable is NOT recordable as an
      official closure in this archive. ECDLP-IDEA-436 status is unchanged and
      its record remains frozen.

  observations:
    - >-
      O-1 (J1, derivation tier). The Proposition dichotomy holds on the intended
      reading of the memo section 1.1. The validator wrote out and SEALED a full
      independent re-derivation of the value set of inv_{j,r} before opening
      either blind_from path - sealed sha256
      14b80674828ce3ff91d4d636e3ce494f61d9fb32a252264db13fdd25ad9630fc,
      timestamped 2026-08-31T18:29:22Z, 107 lines - and reached the same
      two-valued dichotomy, with the same separating predicate k congruent to
      plus-or-minus j mod n, and independently derived the analogues of
      Corollaries 4.1, 4.2 and 4.3 before reading them. Scope of O-1 - the
      value-set claim only, over the parameter class in boundaries B-1.
    - >-
      O-2 (J1, finding F-1, substantive). The Proposition LITERAL universal
      claim - that there is no j, k, E, p, n for which the valuation takes a
      finite value at least 1 - is FALSE on a non-minimal integral Weierstrass
      model. Coefficients in Z_p is strictly weaker than a model realising the
      good reduction. Substituting x equal to u squared times X with u equal to
      1 over p carries a good-reduction short model to a model with coefficients
      still in Z_p on which the valuation is exactly 2, finite and at least 1,
      while the two points are not plus-or-minus one another. The quantifier
      list of the Proposition and of the proof-search-map does not carry the
      model, and the map dependency_audit assertion that no hidden instance
      dependence exists is therefore wrong at simulator line 4, which returns
      the model-dependent literal constant 0. The validator recorded the
      proof-architecture quantifier_fidelity check as FAIL on this ground.
    - >-
      O-3 (J1). The two-valued PARTITION, the group-theoretic separating
      predicate, and the three-line strict-GGM simulator survive O-2 unchanged
      under any admissible model change - only the label of the non-collision
      branch moves from 0 to a public model constant. All secondary consequences
      of O-2 move in the direction of MORE degeneracy, not less. O-2 therefore
      falsifies a stated sentence, not the mathematical content the round rests
      on. Repair R1 is one clause - require v_p of the discriminant equal to 0
      in section 1.1 and add model non-minimality to the section 10 exclusion
      list.
    - >-
      O-4 (J2, objection OBJ-1, major). The stated licensing chain certifies
      strictly less than the verdict claims, by the producer OWN declared method
      ceiling, which says the method can certify nothing about the real cost of
      any algorithm on a real curve and can never certify a lower bound in the
      structured GGM; and by KN-LIT-7606 as the memo itself quotes it, which
      says a plain-GGM simulability argument cannot close a candidate for real
      elliptic curves - plain GGM being the strict branch the D1 closure lives
      in; and by KN-TECH-005 own applicability limit, that the bound is a
      barrier and not a proof that no non-generic attack exists. Strict-GGM
      O(1) simulability does not by itself license rejecting a proposal about
      real elliptic curves.
    - >-
      O-5 (J2). The disposition nevertheless survives on a MODEL-FREE ground the
      memo contains but does not foreground - Corollary 4.3, which identifies D1
      with equality in the quotient of the subgroup by plus-or-minus one, a
      quotient computable for free in E(F_p) by one x-coordinate comparison. On
      that ground D1 gives a real coordinate-holding adversary strictly zero
      information and strictly zero leverage, and the argument needs no model,
      no Shoup and no Fork-A branch, and defeats non-generic adversaries too.
      This is a re-founding, not a retraction, and it is recorded as a repair
      that has NOT yet been applied to any artifact.
    - >-
      O-6 (J2, objection OBJ-2, major). The exponent-1/2 step needs n prime and
      no stated hypothesis supplies it. KN-TECH-005 states its bound in terms of
      the LARGEST PRIME FACTOR of the group order; the memo and ECDLP-IDEA-436
      Assumption 1 state only gcd(n,p) equal to 1, and the proof-search-map
      concludes Omega of the square root of n, which Pohlig-Hellman makes false
      for composite n. KN-FIND-b7e091, whose argument style the memo extends,
      does carry the prime-order hypothesis; the memo dropped it while widening
      the quantifier.
    - >-
      O-7 (J2, objection OBJ-6, major). Move M2 is stated without a cost bound,
      and on its natural unbounded reading it fires on the anomalous additive
      transfer and proves too much exactly as M1 does. The memo blocks that only
      by invoking the conclusion, which is a consistency check rather than a
      mechanism check. Repair - restate M2 constructively as firing if and only
      if an EXPLICIT simulator answers each query in O(1) group operations,
      inversions and equality tests on handles. D1 is unaffected under the
      repaired statement, because the memo exhibits exactly such a simulator.
    - >-
      O-8 (J2, objection OBJ-7, medium). The O(1) figure presupposes a HANDLE
      interface. The frozen family in ECDLP-IDEA-436 is written with integer
      indices, and under an integer interface the simulator must itself
      materialise handles at O(log n) group operations - non-constant, which
      under KN-FIND-002 own bookkeeping lands in the elliptic-net tier recorded
      as NOT closed at 1/2. The memo never declares which interface the gate is
      run on, and the profile-vector line omits the cost of materialising the
      reference handles, an omission running in the producer-favouring
      direction. Repair - declare the interface as an explicit fourth fork and
      answer on both branches. The model-free ground of O-5 is indifferent to
      the interface.
    - >-
      O-9 (J2, objection OBJ-8, minor but scope-bearing). ECDLP-IDEA-436
      hypothesis H is a DISJUNCTION - a member of the frozen family D1, OR a
      fixed statistic of the precision-r coordinate digits, D2. Closing one
      disjunct does not close the hypothesis. The phrase scoped rejection of
      ECDLP-IDEA-436 as written is therefore BROADER than the findings support.
      Only D1 is in scope. D2 was held at the weaker RELATIVE tier - simulable
      in every model in which it is publicly computable at all, not simulable in
      the model in which it is not computable - and that residue remains open.
    - >-
      O-10 (J2). The red team recorded verdict_becomes_holds_when as all four
      blocking repairs applied - OBJ-1, OBJ-2, OBJ-6, OBJ-7 - and stated that
      breaks means the inference as stated must be repaired and re-issued, NOT
      that the producer conclusion is wrong and NOT that the candidate family is
      viable. All four repairs are zero-compute edits. Validator repair R1 for
      F-1 is a fifth, also zero-compute.
    - >-
      O-11 (both joints, controls). The mandatory proves-too-much control on
      anomalous curves was run independently by both reviewers and PASSED on
      both halves - M1 proves too much and is broken as a closure rule, M2 does
      not fire, so the exponent-1/2 verdict is not broken by that control. The
      second control, on the already-closed jet and endomorphism oracles,
      reproduced all four recorded verdicts on both Fork-A branches, but the red
      team judged it FAILS AS AN INDEPENDENT CONTROL - M1 and M2 were abstracted
      FROM those four classifications and then validated by reproducing them, so
      the reported 4/4 is a fit statistic on the training set with no held-out
      object for M2 in the firing direction. The validator separately closed the
      producer disclosed read_scope gap by opening experiments/EXP-GGM-001
      analysis and confirming implementation-level agreement, which the producer
      could not do.
    - >-
      O-12 (both joints, inventor-protocol section 3). NO null-object control
      exists for this round, because zero runs occurred. ECDLP-IDEA-436 own
      declared negative control - random profiles with the same precision budget
      and no scalar dependence - was not run, and KN-OPEN-3417fc own
      negative-resolution criterion is explicitly a MEASUREMENT at toy p and was
      not run. The reported quantity is flat in the parameter meant to move it,
      which is the canonical artifact tell; here flatness is a DERIVED claim so
      the tell does not fire automatically, but a finite-precision
      implementation would report the same flatness and can never observe
      infinity, only at least r. This is recorded as a real gap, not absorbed.
    - >-
      O-13 (J1, finding F-4, forward guidance). ECDLP-IDEA-436 own declared
      POSITIVE control is not executable as written. An anomalous curve has
      cardinality p, so a generator has n equal to p and gcd(n,p) equal to p,
      violating the record own Assumption 1 - the family is UNDEFINED there, not
      merely uninformative. Any successor record in this lane must name a
      positive control that satisfies its own assumptions.
    - >-
      O-14 (J1, finding F-2 and J2, objection OBJ-15). The scope is
      over-restrictive rather than insufficient in two places - ordinary and
      p at least 3 are inherited from KN-TECH-73630e and used by neither lemma.
      Under-claiming is safe and both reviewers record it as understatement, not
      error. Recorded so a later reader need not rediscover it.
    - >-
      O-15 (J2, objection OBJ-15 third item). Under ECDLP-IDEA-436 Assumption 3,
      which forbids post-hoc selection of the reference pair, the reciprocal
      informative-query density exponent is 1 rather than 1/2, so the record own
      promotion gate fails harder than the memo reports. The memo took the
      reading more favourable to the idea, which is the correct direction, and
      should say so.

  corpus_contradictions_recorded_not_resolved:
    status: >-
      RECORDED AND ROUTED BY THIS ROUND. NOT RESOLVED, NOT ACTED ON, AND NOT
      EVIDENCE AGAINST EITHER RECORD AT THIS TIER. No prior record was edited.
      Both cited findings remain exactly as committed.
    items:
      - id: CC-1
        raised_independently_by:
          - TASK-20260831-c6ceb9
          - TASK-20260831-62019a
        statement: >-
          KN-FIND-002 section 4 records the incidence oracle as O(B raised to m)
          with B growing with problem size and NOT closed at 1/2, while
          KN-FIND-b7e091 section 1 records an incidence oracle as simulable in
          O(m) group operations per query and its title and tags say closed.
          Both records are marked authoritative - KN-FIND-002 is status
          established, confidence strong, internal_refs EV-GGM-001 and
          DEC-20260726-007; KN-FIND-b7e091 is confidence proved, evidence_level
          theorem_backed, source_refs EV-GGM-79e710 and DEC-20260804-3b4258.
          The memo reports both without picking one and attributes the
          difference to a narrower oracle definition, which is the correct
          handling under the retrieval policy on contradictory sources.
        tier: 'derivation, zero runs, raised in review sessions, not independently checked'
      - id: CC-2
        raised_by: TASK-20260831-62019a
        also_touched_by: 'TASK-20260831-c6ceb9 finding F-5, on the adjacent constant-overhead question'
        statement: >-
          KN-FIND-b7e091 line 27 justifies its endomorphism-oracle closure with
          the premise that for prime-order prime-field curves the ring of
          F_p-rational endomorphisms is Z, so every endomorphism is
          multiplication by m. That premise is FALSE for every elliptic curve
          over a finite field - the p-power Frobenius is always an F_p-rational
          endomorphism of degree p, while multiplication by m has degree m
          squared, and a prime is never a perfect square. The red team reports
          the CONCLUSION survives under a corrected eigenvalue argument at
          O(log l) group operations by double-and-add, not the m group
          operations the record states, which as literally written is not even a
          log-overhead simulation. The validator F-5 separately observes that m
          group operations is not O(1) and so applies the constant-overhead
          criterion inconsistently with KN-FIND-002 own refusal to close the
          elliptic-net and incidence oracles.
        tier: >-
          derivation, zero runs, single red-team session. The degree facts are
          marked provenance recalled by the reviewer that raised them and are
          checkable in one line by any reader; the internal claim they
          contradict was opened and quoted from committed bytes.
      - id: CC-3
        raised_by: TASK-20260831-62019a
        statement: >-
          A separate red-team proposition, which the producer did not raise -
          KN-FIND-002 records the jet oracle at overhead constant 1 and the
          endomorphism oracle at overhead constant 0 as SIMULABLE with O(1)
          overhead and closed at exponent 1/2 by KN-TECH-005, WHILE declaring
          the structured GGM as its model in its own scope block. The producer
          own method ceiling states that no lower bound can be certified in the
          structured GGM because Shoup theorem does not hold there, and the
          producer own anomalous-curve control demonstrates it. On that
          combination the supportable tier for those two oracles would be the
          RELATIVE tier the memo assigns to its own D2, not an absolute
          exponent-1/2 closure. KN-LIT-7606 already names KN-FIND-002 in its
          Relevance block on this point.
        tier: 'derivation, zero runs, single red-team session, filed for routing only'
    routing_determination_made_by_this_round: >-
      Do NOT re-run this round. CC-1, CC-2 and CC-3 are collateral to the joints
      under review rather than load-bearing on them - the D1 content does not
      depend on either finding record in either direction, and under the OBJ-1
      re-founding it does not depend on the GGM at all. They are routed to a
      SEPARATE round whose subject is the recorded tier of KN-FIND-002 and the
      recorded justification of KN-FIND-b7e091. That round is a contradiction
      between validated evidence records and must therefore run at
      review-breakthrough, max effort, degradable false, per AGENTS.md rule 12
      and the routing_rules unrecoverable-result-review the committed review
      plan names. It requires its own Coordinator opening decision, its own
      review plan and its own prior, none of which this archive creates. See
      DEC-20260831-a9716f.

  escalation_determination:
    question_posed_by_the_committed_review_plan: >-
      Whether the producer OFQ-1 - that this program has no canonical GGM
      branch, so KN-FIND-002 and KN-FIND-b7e091 evaluate on different Fork-A
      branches and every corpus closed at exponent 1/2 carries an unstated
      model parameter - amounts to a CONTRADICTION of prior validated evidence
      rather than a scoping observation about it. If so, routing_rules
      unrecoverable-result-review fires and the round re-runs at
      review-breakthrough.
    determination: 'SCOPING OBSERVATION, NOT A CONTRADICTION. The escalation condition DID NOT FIRE for this round.'
    determined_independently_by:
      - task: TASK-20260831-c6ceb9
        role: validator
        finding: >-
          OFQ-1 is half true and OVERSTATED as written. KN-FIND-002 DOES state
          its branch, in the passage the memo itself quotes; only KN-FIND-b7e091
          does not. The two records do not disagree about any oracle on any
          single branch. And KN-TECH-005, the record the closure is imported
          from, states its own applicability as the strict opaque-label branch,
          so the canonical branch for the bound is not missing.
      - task: TASK-20260831-62019a
        role: red-team
        finding: >-
          Both branches established independently from the committed bytes.
          Neither record asserts a canonical model for the program, so neither
          is contradicted by the observation that they differ. OFQ-1 is true,
          useful, and scoping.
    composed_by: 'coordinator, in DEC-20260831-a9716f'
    coordinator_composition_judgement: >-
      The red team stated explicitly that if the Coordinator judges OFQ-1 and
      its own OBJ-3 to be the SAME observation, escalation fires on OFQ-1 and
      this round must re-run. The Coordinator judges they are DIFFERENT. OFQ-1
      asserts that a model parameter is unstated, which is a scoping gap about
      how the corpus is written. OBJ-3, recorded here as CC-3, asserts that on
      one value of that parameter the certification KN-FIND-002 records is
      unavailable, which is a claim about what a committed record supports.
      Escalation therefore does not fire on OFQ-1, and CC-3 is routed to its own
      review-breakthrough round rather than absorbed into this one.

  independence_and_procedure:
    reviewers_launched_concurrently: true
    reviewers_are_not_the_producing_agent: true
    fresh_independent_sessions: true
    mutual_blindness_declared_by_plan: true
    mutual_blindness_held: >-
      Yes, on both reviewers own attestations and on the disclosed evidence.
      The validator listed the reviews directory and found it did not exist. The
      red team listed the sibling directory and found it EMPTY, opened nothing
      in it, and disclosed that a final git status --porcelain, which lists
      paths only, later showed two filenames had landed there after its own
      report body and session receipt were complete. It did not open either.
      That is a disclosed near-miss, not a breach.
    mechanical_independence_check:
      tool: tools/check_review_independence.py
      raw_result: >-
        FAIL, one problem across two reports - re-deriver TASK-20260831-c6ceb9
        read 2 blind_from paths, so the re-derivation is reported as not
        independent of the implementation it was meant to check.
      disposition: FALSE_POSITIVE
      disposition_basis: >-
        The committed review plan mandates a TWO-PHASE protocol - derive blind
        in Phase 1, THEN open the blind_from paths in Phase 2 to compare against
        the producer. Opening those two paths in Phase 2 is REQUIRED by the
        plan. The tool has no notion of phases and simply intersects sources_read
        with blind_from. The validator listed both paths HONESTLY; deleting the
        two lines would have turned the check green by falsifying a source list
        and was refused.
      what_this_round_therefore_rests_on: >-
        The blind-ordering property of this round rests on the sealed pre-read
        hash 14b80674828ce3ff91d4d636e3ce494f61d9fb32a252264db13fdd25ad9630fc
        timestamped 2026-08-31T18:29:22Z, together with the validator explicit
        ordering attestation. It does NOT rest on a passing mechanical check,
        and must not be reported as though it did.
      recorded_as: 'procedure deviation PD-1, not a passing mechanical check'
      raised_by: 'the validator itself, unprompted, in its own tooling observations'

  procedure_deviations:
    - id: PD-1
      kind: tooling_gap_and_disclosed_check_failure
      statement: >-
        tools/check_review_independence.py reported one problem, a blind_from
        overlap for the re-deriver, and it is dispositioned above as a FALSE
        POSITIVE arising from the tool lacking phase-awareness. The round
        blind-ordering property is carried by a sealed hash and an attestation
        rather than by a passing check.
      needed_fix: >-
        The tool needs a phase-aware field, for example
        sources_read_before_blind_lift, so this property can be checked
        mechanically instead of attested.
      not_resolved_here: true
    - id: PD-2
      kind: tooling_gap
      statement: >-
        The validator reported that tools/check_review_independence.py reads
        field names the committed review plan did not use - joints[].joint,
        joints[].assigned_to, joints[].attack_plan, proves_too_much.objects,
        proves_too_much.failure_signature, blind_rederivation.required and
        blind_rederivation.assigned_to. The committed plan used its own names,
        so the checker would have PASSED BY NOT RUNNING - reporting no problem
        because it found no structure to check. A schema shim,
        review-plan.checker.yaml, restating the committed plan verbatim in the
        field names the tool reads, was written to make the check actually run.
      why_it_matters: >-
        A check that passes by finding nothing is worse than no check, because
        it still reads as rigorous. This is a real tooling gap between
        templates/research-records.md review_plan vocabulary and the checker
        implementation, and it is recorded rather than absorbed.
      artifact: coordination/goals/GOAL-ECDLP-001/proposals/B71-IDEA436-GGM-SIMULABILITY-GATE-20260831-c7c3ef/review-plan.checker.yaml
      not_resolved_here: true
    - id: PD-3
      kind: post_hoc_reviewer_contact
      statement: >-
        After the red-team report body and session receipt were complete, the
        orchestrating Coordinator session asked that reviewer to confirm its
