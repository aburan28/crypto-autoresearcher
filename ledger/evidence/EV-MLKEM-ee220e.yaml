  what_this_evidence_is: >-
    An adversarial pass on BATCH-015. It returns blocking objections, and its
    central finding is that the occupancy floor -- which BATCH-015 and this
    Coordinator both used to dissolve ANOM-5 -- is the WRONG REFERENCE POINT and
    is itself rejected by the archive. The CONCLUSION that ANOM-5 is not an
    effect survives on different grounds.

  supersedes_reasoning_in: EV-MLKEM-ce1884
  supersession_note: >-
    EV-MLKEM-ce1884 is immutable and not edited. Its U-1 and U-4 mechanism is
    superseded here by W-1 through W-4. Its U-2, U-3, U-5 and U-7 stand; its
    conclusion that ANOM-5 is not an effect stands, on the grounds in W-5.

  observations:
    - >-
      W-1 (THE COORDINATOR'S PREMISE WAS FALSE FOR THE SIXTH TIME, and this one
      was checkable in one command). The handoff asserted the archive contains no
      per-iteration data. It does: Pgood_...n43....out holds 4000 per-iteration
      F(solution) values in iteration order, header line 17, 4017 lines. Only the
      PWRONG files lack per-iteration data. Worse, BATCH-015 had already used it:
      its own pgood_serial_probe at anom5_investigation.py lines 873-917 computes
      exactly this. I asserted an absence without opening the file.
    - >-
      W-2 (IDENTICAL DISTRIBUTION SURVIVES, and the red team says so plainly).
      Lag-1 to lag-8 autocorrelation max |0.035| against sd 0.0158; runs z =
      -0.214; block-mean variance ratios 0.893 to 1.228 for B = 2..100. The red
      team calibrated the probe's power: a monotone drift above 0.25 sd of
      F(solution), i.e. 3.6 percent of the mean, is detected at z = +2.35.
      Varying lattices are i.i.d. redraws that preserve the marginal, and
      unequal-weight pooling is excluded by the format test.
    - >-
      W-3 (BUT IDENTICAL DISTRIBUTION WAS NEVER THE LOAD-BEARING ASSUMPTION, and
      this retires the question the whole batch was convened to ask). For
      independent X_i ~ Poisson(lambda_i), the sum is Poisson(sum lambda_i), so
      Var = mu for ANY heterogeneous lambda_i and E[phi] = 1 exactly.
      NON-IDENTITY CANNOT PRODUCE A SUB-FLOOR READING. The Coordinator verified
      this. The phi = 0.00433 counterexample that motivated the concern lives
      entirely in the 0/1-per-cell regime.
    - >-
      W-4 (BLOCKING, O-1: THE FLOOR IS THE WRONG REFERENCE POINT AND THE ARCHIVE
      REJECTS IT AT >= 3 SD). 0.9183 is the MINIMUM over the admissible family,
      attained only by the member in which each iteration contributes 0 or 1 per
      cell. EV-MLKEM-ce1884 U-1 and U-4 promote that minimum to the REFERENCE
      POINT -- a third statement that nobody checked, and the same quantifier
      blind spot that produced U-3. The floor member predicts an occupancy slope
      of -1 and a deficit concentrated at HIGH occupancy. The archive shows the
      opposite: in the n=43 mid band, the low-occupancy tercile (mean occupancy
      0.0045, where the floor correction is 0.4 percent) reads phi = 0.6371
      against a floor-member null of 0.9971 +/- 0.1430, while the high-occupancy
      tercile (0.2209, correction 22 percent) reads 0.9043 against a floor-member
      null of 0.7802 +/- 0.1145. Observed slope +0.197 against a floor-member
      null of -0.967 +/- 0.337 gives z = +3.46, or +3.15 after lag-1 deflation;
      n=50 agrees at +2.03. The Coordinator confirmed the direction: THE DEFICIT
      SITS WHERE THE FLOOR CORRECTION IS NEGLIGIBLE AND VANISHES WHERE IT IS
      LARGE. All terciles were run through the identical instrument with
      identical fitted mu, so leverage and edge effects cancel.
    - >-
      W-5 (THE CONCLUSION SURVIVES ON GROUNDS NEEDING NO FLOOR). ANOM-5 remains
      NOT AN EFFECT: Sidak p = 0.105 over six post-hoc readings; a rate-model-order
      range of 0.43, five times the 0.082 floor correction; and the two files
      disagree in SIGN. So the conclusion of BATCH-015 stands and its mechanism
      does not.
    - >-
      W-6 (EXHAUSTION, RULED: THE MID-BAND LANE IS NOT EXHAUSTED, but a sub-lane
      is, with a sharper obstruction than bin count). The WHOLE-BAND
      POINT-COMPARISON sub-lane IS exhausted, and not for the reason this
      Coordinator gave. K = ln(100)/a with a = 0.01530 per score fixed by the
      instance, so MORE ITERATIONS TRANSLATE THE COUNT WINDOW WITHOUT WIDENING
      IT -- they buy no mid-band bins at all. The observable is unit-integer, one
      bin per score is already in use, and the 1414-bin requirement would need
      9.4 decades of count range in a region where occupancy exceeds 1 and the
      floor's own applicability flag is False. Forward guidance: only a
      flatter-decay INSTANCE helps, never more data. The lane itself is not
      exhausted -- five moves remain at 301 bins, one of which the red team
      executed here.
    - >-
      W-7 (WHAT SURVIVES OF BATCH-015). U-2 and U-3, the quantifier correction
      and the record of the Coordinator's blind confirmation. U-4's mathematics
      as mathematics. The admissible-set argument. U-5, the deep tail untouched.
      Scope discipline, the justified dominated_by: null, and the degree choice,
      against which the red team raised an objection and then retired it on
      BATCH-014's forward-selection rule.

  inference: >-
    BATCH-015 reached the right conclusion by the wrong mechanism, and this
    Coordinator endorsed the mechanism twice. The occupancy floor is a valid
    minimum and an invalid reference point; the archive rejects the floor member
    at more than three standard deviations, because the observed deficit is
    concentrated exactly where the floor correction is negligible. ANOM-5 is
    still not an effect, on multiplicity, model-order sensitivity and a sign
    disagreement between the two files -- none of which needs a floor. The
    mid-band lane retains moves; what is exhausted is the whole-band
    point-comparison sub-lane, and the binding obstruction is that the instance's
    decay rate fixes the count window so more iterations cannot widen it.

  boundaries:
    - >-
      Two archived toy-dimension files. Establishes NOTHING about ML-KEM security
      and nothing about Carrier et al.'s Kyber cost figures.
    - >-
      W-2's power calibration bounds detectable monotone drift at 0.25 sd of
      F(solution); smaller or non-monotone departures are not excluded.
    - >-
      W-4 rejects the floor MEMBER as the data-generating description. It does
      not identify what does describe it, and no mechanism for the low-occupancy
      deficit is offered.
    - One adversarial pass, no validation of it, no replication.

