      text: >-
        NO COST MODEL IS TOUCHED, CLAIMED, RE-CHARGED, FLAGGED OR DEFENDED, and
        EVEN A FULLY CERTIFIED NULL YIELDS NO COST-MODEL CONSEQUENCE WHATEVER -
        the counterfactual branch on the committed data is O-6, SPARSE OUT-OF-BAND
