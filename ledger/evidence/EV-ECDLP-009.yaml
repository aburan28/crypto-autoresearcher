        0.00483443278876482; KA-4's eleven marginals inside the band; KA-5 exactly
        3 distinct pre-marked bins in every one of 10^6 draws at zero tolerance;
        KA-6 frequency 0.090968 inside the band [0.08975917, 0.09205901] with
        zero implication violations; KA-7 exact at zero tolerance over 10^6 draws;
        KA-8 reproducing P_pred at all four INV-4-failing tuples at maximum
        absolute difference 0.0 against a 1e-9 tolerance. Generators are seeded
        for exactly five cases, as C-19a requires. Seed integrity: 105 seeds in
        total across the four arms, ALL 105 DISTINCT, with no overlap between any
        two arms, every one derivable from the contract text by a third party and
        every one so derived and matched.
    - id: O-8
      label: the comparability arm - ANCHORED, NOT VOID, AND ITS BLIND SPOT RESTATED
      text: >-
        The as-recorded arm reproduces the committed
        RUN-YIELD-001-NULL-RANDOM-SUMSET antipodal per-cell means within the
        contract's own tolerance at every tuple: IV-1a fires at 0 of 48 and IV-1b
        at 0 of 48, against triggers of MORE THAN two, with mean z_comp +0.0868
        and sd 1.0585 over the 48 tuples. The repaired arm's comparison to the
        recorded BATCH-011 package is therefore ANCHORED and IS NOT VOID, and
        CR-3 was evaluable.
        THE BLIND SPOT IS RESTATED RATHER THAN LEFT TO BE DISCOVERED. C-9 stands
        unchanged: IV-1 cannot see the single largest anomaly in the BATCH-011
        package, so its passing is not evidence that no such anomaly exists. C-12
        and C-21 stand: P-ASRECORDED is specified to be IDENTICAL to a driver the
