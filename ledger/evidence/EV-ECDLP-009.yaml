        VALIDATION OR BY THIS RECORD, AND NO DISCHARGE IS CLAIMED.
    - id: O-9
      label: the seven declared protocol deviations - ALL ASSESSED, NONE BLOCKING, TWO WITH RESIDUALS
      text: >-
        DEV-1 and DEV-2, the folding of command, environment, stderr and the
        implementation notes into manifest.json: ACCEPTABLE and not a policy
        breach, because AGENTS.md enumerates the INFORMATION each run must retain
        and prescribes no filenames, while the frozen contract declares EXACTLY
        ELEVEN FILES and a twelfth would have fired IV-6. DEV-3, a numeric
        tolerance for comparison against the committed C-16 table: ACCEPTABLE and
        the conservative choice, declared before the comparison, with the realised
        maxima reproduced independently at 4.939094e-06 against a 1e-5 tolerance
        for delta_i and 4.987526e-07 against 1e-6 for p_i(3.000), and r_i matching
        IN-1 at 0.0. RESIDUAL: the exact-A1 column is QUOTED and not re-derived by
        anyone, for want of a permitted quadrature dependency. DEV-4, the shared
        per-tuple seed inside the high-precision block: CONFIRMED AS A CONTRACT
        DEFECT rather than an Executor reading, and the Executor's conservative
        literal reading was the right one - see O-10. DEV-5, four phi-equivalent
        aggregations reported and none chosen: the right shape of answer, each
        carrying the binding label that it has no threshold, no acceptance region
        and no disposition, and the fourth correctly reported null with its
        reason. DEV-6, the tail check reporting the full sorted vector and
        performing no test: the reading that adds no unpre-registered inference,
        and what made the shift visible in the record rather than buried. DEV-7,
        a null phi-equivalent with its reason in the two arms that draw no
        P-REPAIRED replicate: nothing omitted, location named.
    - id: O-10
      label: DEV-4 is a contract defect, it feeds no criterion, and it does feed the most persuasive-looking number in the package
      text: >-
        THE DEFECT. The seed string's fields are master, arm, k, round(beta x
        1000), m, B, C_red, and the arm labels are enumerated as EXACTLY
        REPAIRED, ASRECORDED, KNOWNANSWER and HIGHPREC. The high-precision
        diagnostic runs BOTH processes at the same four tuples under one master
        seed, and no field distinguishes the process, so THE CONTRACT AS WRITTEN
        MANDATES A SHARED SEED FOR TWO PROCESSES IT EXISTS TO COMPARE. Inventing
        a label outside the enumerated set would have been an Executor-side change
        to a frozen clause; taking the contract literally and declaring the defect
        was correct.
        IT FEEDS NO CRITERION, CONFIRMED BY THREE INDEPENDENT LINES: the four
        HIGHPREC seeds appear only inside the block and never enter
        repaired_arm.rows; an independent recount that never touched the block
        reproduces all four criteria exactly; and the phi-equivalent, IV-1 and
        IV-2 all read other arms.
        AND IT DOES FEED SOMETHING (RT21-8). The receipt and the summary report,
        at the four high-precision tuples, the measured mean difference
        repaired-minus-as-recorded beside T_DETERMINED - 15.9447 against
        15.957992933938208; 15.8261 against 15.833155497720552; 23.7687 against
        23.78891041831733; 27.5352 against 27.61029847167744. A reader will take
        that as a precise confirmation of T to within 0.05 per cent. IT IS NOT,
        BECAUSE THE TWO LEGS SHARE A SEED: their streams are offset rather than
        independent, the variance of the difference is neither the
        independent-sum value nor a clean common-random-numbers reduction, and IT
        IS QUANTIFIED NOWHERE. The correlation is visible in the realised numbers -
        at T-18-3-B16 both legs sit low, at -2.95 and -2.03 against the exact
        analytic mean, and at T-16-3-B16 and T-18-3-B24 both sit high. NO RECORD
        MAY QUOTE THE HIGH-PRECISION DIFFERENCE COLUMN AS A CONFIRMATION OF T, and
        this record does not. THE FIX A SUCCESSOR MUST MAKE: append the leg label
        to the seed string, giving HIGHPREC-REPAIRED and HIGHPREC-ASRECORDED, and
        re-derive the block.
    - id: O-11
      label: THE MANDATORY POWER SENTENCE IS FALSE AS WRITTEN, AND THE CORRECTION IS CARRIED BESIDE IT
      text: >-
        RT21-1, BLOCKING ON ADOPTION, ADOPTED IN FULL.
        THE SENTENCE C-20 MAKES MANDATORY ON EVERY RECORD PRODUCED FROM THIS
        CONTRACT, CARRIED VERBATIM AS THE CONTRACT REQUIRES: "THEREFORE A PASS OF
        P-CORE IS NOT EVIDENCE THAT THE REPAIRED NULL IS EXACT: it is evidence
        that the null does not fall short by a LARGE fraction of T, and a
        shortfall of 5 percent of T or less would be very unlikely to be detected
        by anything in this contract." Under a perfectly correct repaired null
        this design records P-CORE only about 0.659 of the time, MISS-MARGINAL
        0.291 and MISS-STRUCTURED 0.050.
        THE CORRECTION, CARRIED BESIDE IT AND NEVER APART FROM IT: THE CLAUSE
        ABOUT A SHORTFALL OF 5 PERCENT OF T IS SUPERSEDED BY RT-20260729-021. The
        design detects a uniform shortfall of 5 per cent of T with probability
        about 0.9999 and of 4 per cent with probability about 0.99, essentially
        all of it carried by CR-1 at T-18-3-B16 where T/sem_001 is 124.73, so the
        expected |z_sem| there at phi = 0.05 is 6.24 rather than 3.000. IT IS
        BLIND TO A UNIFORM SHORTFALL BELOW ABOUT 1.5 PER CENT OF T, AND BLIND TO
        ANY SHORTFALL THAT IS NOT PROPORTIONAL TO T, because T/sem_001 is below
        3.000 at 25 of the 29 m = 2 tuples. WHAT P-CORE EXCLUDES ABOVE PHI ABOUT
        0.03 RESTS ON THREE TUPLES - T/sem_001 is 124.73 at T-18-3-B16, 59.95 at
        T-16-3-B16 and 57.56 at T-18-3-B24 - and overwhelmingly on the first
        tuple's 100 replicates (RT21-9). IV-4's re-derivation at maximum absolute
        difference 0.0 is what stands against a mis-resolved per-cell quantity
        there, and it is adequate; the concentration belongs on the record beside
        the headline, and it is here.
        THE LIKELIHOOD RATIOS AGAINST phi = 0, AS RT-20260729-021 COMPUTED THEM:
        1.0 at phi = 0.010, 1.2 at 0.015, 1.5 at 0.020, 2.5 at 0.025, 5.7 at
        0.030, 87 at 0.040 and about 8,600 at 0.050. A SINGLE P-CORE IS DECISIVE
        AGAINST A UNIFORM 5 PER CENT SHORTFALL, STRONG AT 4 PER CENT, AND WORTH
        LESS THAN 2 TO 1 AGAINST A UNIFORM SHORTFALL OF 2 PER CENT OR LESS. THAT
        SMALL-SHORTFALL REGIME IS GENUINELY UNTOUCHED.
        HOW THE ERROR AROSE, RECORDED AGAINST THE CONTRACT AND AGAINST THIS
        PROGRAM'S OWN PROCESS: the pre-registered power curve's column reports the
        NUMBER of tuples at which the expected |z_sem| reaches 3.000, which is ONE
        at phi = 0.05, and three successive sessions read that COUNT as a
        MAGNITUDE - as though one tuple meant no power - when CR-1 requires only
        ONE failure and that one tuple carries an expectation of 6.24. THIS IS THE
        CARDINALITY-NOT-IDENTITY FAILURE THE CONTRACT'S OWN PRED-ID RULE EXISTS TO
        PREVENT, RECURRING FOR THE THIRD TIME IN THE SAME CONTRACT AND THIS TIME
        INSIDE THE POWER CURVE. It cuts CONSERVATIVELY - it understates the
        design's power and makes P-CORE look weaker than it is, and creates no
        route by which a miss is reported as a pass - which is why it is blocking
        on adoption rather than on the P-CORE reading.
        BASIS AND ITS LIMIT: T, sem_001 and their ratio are arithmetic on
        quantities committed in IN-1 and in
        experiments/EXP-YIELD-002/results/summary.json and are re-derivable by any
        third party. The detection probabilities - P(CR-1 or CR-4 fires) of 0.124
        at phi = 0, 0.170 at 0.010, 0.266 at 0.015, 0.442 at 0.020, 0.663 at
        0.025, 0.849 at 0.030, 0.990 at 0.040 and 0.9999 at 0.050 - are an
        UNARCHIVED PROBE of RT-20260729-021, corroborated on the T/sem_001 figure
        by the dispatching session, and they are NOT EVIDENCE of this experiment.
    - id: O-12
      label: EV-ECDLP-008 observation O-4 - CONFIRMED IN PART, LEFT STANDING IN PART, NEITHER SUPERSEDED NOR CONFIRMED AS A WHOLE
      text: >-
        O-4 IS COMPOUND AND THE BATCH TOUCHES ITS FOUR COMPONENTS DIFFERENTLY.
        (a) That the shortfall equals |S_(m-2)| exp(-lambda) at every cell was
        ALREADY DETERMINED ARITHMETIC on committed data before this batch; it is
        reconfirmed and is not newly established.
        (b) That a process which ALSO pre-marks |S_(m-2)| bins has mean P_pred is
        CONFIRMED BY MEASUREMENT FOR THE FIRST TIME. THIS IS THE BATCH'S GENUINE
        INCREMENT.
        (c) That CTRL-NULL-SUMSET AS IMPLEMENTED in BATCH-011 realises only the
        first term is SUPPORTED BUT NOT INDEPENDENTLY ESTABLISHED, because IV-1's
        anchor arm is transcribed from a contract text written AFTER the
        Coordinator read the BATCH-011 driver (C-12, C-21).
        (d) That the bins are the ones A CANCELLING MULTISET REACHES
        DETERMINISTICALLY is UNTOUCHED AND STILL UNARCHIVED: RC-A and this
        contract pre-mark a UNIFORMLY RANDOM s-subset, which the contract itself
        states is NOT the structurally exact set - at m = 2 the structurally
        correct bin IS bin 0, and at m = 3 it is B/2 whole antipodal pairs closed
        under negation. The contract declares that substitution before data,
        bounds its MEAN effect at 0.0895 SEM (realised maximum 0.07542), and makes
        NO claim about the variance (C-13), so not even the mean-level equivalence
        transfers to any second moment.
        CONSEQUENCE, AND IT CORRECTS THE GOVERNING CONTRACT: the frozen
        success_criterion sentence that under P-CORE "EV-ECDLP-008 observation O-4
        is thereby CONFIRMED BY MEASUREMENT for the first time" is CORRECT FOR
        COMPONENT (b) AND OVER-BROAD AS WRITTEN AS A STATEMENT ABOUT O-4 AS A
        WHOLE (RT21-2). It is not adopted unqualified anywhere in this record or
        in DEC-20260729-002. O-4 IS NEITHER SUPERSEDED NOR CONFIRMED AS A WHOLE;
        its null-construction component is confirmed by measurement at the 48
        declared tuples, and its component about WHICH BINS the correct null
        should pre-mark remains supported by argument rather than by measurement.
        EV-ECDLP-008 IS IMMUTABLE AND IS NOT EDITED BY THIS RECORD.
    - id: O-13
      label: what the run did NOT require, and where the agreement is weakest
      text: >-
        RECORDED BECAUSE IT IS THE SHARPEST THING EITHER REVIEW SAID ABOUT THIS
        BATCH. CR-1 and CR-2 are NEAR-TAUTOLOGICAL: the contract proves exactly
        that E[distinct] - P_pred = (1 - s/N) f(lambda) with f bounded at 0.0752
        SEM over the declared set, so they test whether numpy and a thirty-line
        marking loop reproduce a PROVED expectation - which is what IV-2's eight
        known-answer cases were separately built to catch. The only criterion
        whose statistic contains a number produced in a DIFFERENT batch by a
        DIFFERENT implementation is CR-3, and CR-3 is anchored by IV-1, which C-12
        and C-21 declare unable to distinguish faithful from co-defective.
        FURTHER, AND UNARCHIVED-PROBE BASIS: RT-20260729-021 reports that taking
        only the committed mu_001, s_001, N and C_red and the exact
        no-pre-marking mean, the standardized residual over the 48 tuples has mean
        -0.0122, sd 1.1303, t = -0.075 - the committed BATCH-011 antipodal arm is
        DEAD CENTRED on the exact analytic mean of the process it is now said to
        have realised, by pure arithmetic on already-committed constants, with no
        Monte Carlo needed to see it.
        WHAT IS NOT MANUFACTURABLE, AND IT IS WHAT SAVES THE RUN: the target
        P_pred is QUOTED and SHA-256-pinned from IN-1 at
        2fb2bb7a111d999859612e52990eea7dc6bbac1a, was committed in a different
        batch at a different commit, could not be moved by this batch, and IV-4
        re-derives it at maximum absolute difference 0.0. CR-1 and CR-2 are
        therefore NOT CIRCULAR, whatever else they are. The objection is about how
        much the agreement ADDS, not about whether it is real.
