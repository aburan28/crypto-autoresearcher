    - id: O-3
      label: independent re-implementation from the contract text alone - MAXIMUM ABSOLUTE DIFFERENCE 0.0
      text: >-
        TASK-20260729-020 wrote a simulator from `process_specification`,
        `replication.seed_derivation_binding` and clauses C-3a to C-3e, C-19a and
        C-19c, WITHOUT using the Executor's driver as a source, and performed the
        RC-C de-duplication independently from IN-1 (49 cells to 48 tuples, 29 at
        m = 2 and 19 at m = 3, 37 tuples at 100 replicates and 11 at 30). Against
        the committed package the MAXIMUM ABSOLUTE DIFFERENCE IS 0.0 for mean,
        sd_ddof_1, sem, z_sem, z_sd, z_shift, T, P_pred, mu_001, s_001 and
        sem_001, and for the as-recorded arm's mean and sd. All 96 derived seeds
        of the two 48-tuple arms match exactly as integers AND all 96 seed
        strings match exactly as strings. All four INV-4-failing tuples reproduce
        end to end. Two independently written implementations agreeing bit for
        bit rules out a coding slip in either - and it does NOT rule out a
        process error transcribed faithfully into the contract text both were
        written from (NARROW-6).
    - id: O-4
      label: the realised branch as the frozen rule classifies it - P-CORE
      text: >-
        ALL FOUR PRE-REGISTERED CRITERIA HOLD ON THE 48 DECLARED TUPLES.
        CR-1, the primary standard-error-of-the-mean reading, firing set EMPTY;
        CR-2, the single-replicate standard-deviation reading, firing set EMPTY;
        CR-3, the pre-registered upward shift, firing set EMPTY; CR-4, n_neg = 16
