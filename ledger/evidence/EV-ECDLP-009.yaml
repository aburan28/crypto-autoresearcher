  inference: >-
    WHAT THE RUN SET SUPPORTS, AT CLAIM TIER TOY AND AT NO STRENGTH ABOVE
    `preliminary`, IS ONE THING. At the 48 de-duplicated criterion-evaluable
    parameter tuples of the committed EXP-YIELD-001 v2 package, a curve-free
    occupancy simulation that pre-marks |S_(m-2)| uniformly chosen bins before
    throwing C_red/2 antipodal pairs reproduces the unchanged, hash-bound P_pred
    under BOTH pre-registered denominator readings, with all three per-tuple
    firing sets empty on set identity and n_neg = 16 inside the pre-registered
    [14, 34] window. That confirms BY MEASUREMENT, for the first time, that
    CTRL-NULL-SUMSET as frozen in EXP-YIELD-001 v1 and as re-specified by
    amendment C-4 WAS MIS-CONSTRUCTED BY EXACTLY THE OMITTED TERM.
    IT ESTABLISHES NOTHING ELSE. It does not certify P_pred as a model of the
    decomposition census; the census-facing half of EV-ECDLP-008 observation O-4
    is untouched. It does not un-fire or re-dispose INV-4, which fired at 4 of 49
    criterion-evaluable cells of the BATCH-011 package under that contract's own
    rule and whose firing stands untouched. It makes NO BATCH-011 efficiency E
    readable. It declares INV-5 neither way. It moves no hypothesis. It yields no
    cost-model consequence whatever.
    AND A PASS OF P-CORE IS NOT EVIDENCE THAT THE REPAIRED NULL IS EXACT: it is
    evidence that the null does not fall short by a LARGE fraction of T, and a
    shortfall of 5 percent of T or less would be very unlikely to be detected by
    anything in this contract - A CLAUSE SUPERSEDED BY RT-20260729-021 AND
    CORRECTED AT OBSERVATION O-11, where the true reading is recorded: decisive
    against a uniform 5 per cent shortfall, worth less than 2 to 1 against a
    uniform 2 per cent one, blind to any shortfall not proportional to T, and
    resting essentially on three tuples. Under a perfectly correct repaired null
    this design records P-CORE only about 0.659 of the time, MISS-MARGINAL 0.291
    and MISS-STRUCTURED 0.050.
  inference_alternatives_not_discriminated: >-
    THREE THINGS REMAIN UNDISCRIMINATED AND ARE NAMED RATHER THAN ROUNDED OFF.
    FIRST, WHETHER THE SUM-SET NULL OUGHT TO PRE-MARK S_(m-2) AT ALL. The
    experiment confirms an identity between two closed forms for a process that
    pre-marks a UNIFORMLY RANDOM subset; the structurally exact variant - bin 0 at
    m = 2, B/2 whole antipodal pairs at m = 3 - is FORBIDDEN inside this contract
    by run_plan_rule, correctly, because adding it would create an unpre-registered
    comparison, and it needs of order 10^4 replicates per tuple to separate at the
    declared 0.0895 SEM mean gap, which the C-14 schedule does not provide. It is a
    SUCCESSOR control.
    SECOND, WHETHER THE BATCH-011 DRIVER DID WHAT ITS CONTRACT SAID. RC-F is not
    discharged. Its P_pred sub-route IS now archived - KA-8 and IV-4 re-derive
    P_pred from N, C_red and |S_(m-2)| and agree with the quoted values at maximum
    absolute difference 0.0 at all 48 tuples including the four failing ones, a
    THIRD independent reproduction after TASK-20260729-007 and TASK-20260729-008.
    Its occupancy_null sub-route is NOT archived and is explicitly contaminated by
    transcription. NET: RC-F moves from undischarged to undischarged, with one
    sub-route closed and the other explicitly contaminated. IV-1 PASSING IS NOT
    PROGRESS ON RC-F.
    THIRD, THE +0.3610 AGGREGATE z_sem SHIFT. Chance in an unthresholded post-hoc
    statistic and a small shift common to both BATCH-012 arms are both live; a
    real bins-level bias and a third analytic term are strongly disfavoured by the
    committed high-precision block and by the three-arm comparison. NO EXPLANATION
    IS ADOPTED HERE, because the discriminating replication RC-21A was not
    dispatched.

  boundaries:
    - >-
      LARGEST SCOPE SUPPORTED: the 48 declared parameter tuples; k in
      {12, 14, 16, 18} with quoted group orders 4001, 16619, 65633 and 261707; the
      frozen beta grid as realised in the source package; arities m in {2, 3}; the
      x-interval factor-base convention with B measured; the ONE prime-order curve
      per size OF THE SOURCE PACKAGE; this simulator, this budget, one platform,
      numpy 2.4.0; and THE OCCUPANCY CONTROL OBJECT ALONE rather than any measured
      decomposition quantity.
    - >-
      SCOPES NOT SUPPORTED: any curve; any field size not listed; any
      cryptographic scale, in either direction; any decomposition-yield quantity;
      any efficiency E; any yield ratio, including 0.85; any cost model; any
      hypothesis; INV-5; any other arity, coefficient set, factor-base convention
      or number of curves per size; AND REPLICATION - 48 parameter tuples are not
      48 replications.
    - >-
      SINGLE UNREPLICATED RUN SET WHOSE INPUTS COME FROM ANOTHER SINGLE
      UNREPLICATED RUN SET. No strength above `preliminary` is available and
      `reject_scoped` on it is forbidden in either direction.
    - >-
      THE ODD-C_red ARM OF IV-4 IS UNTRIGGERED by the declared set - all 48
      declared C_red are even and throws_per_replicate equals C_red//2 at 48 of 48
      - and is therefore UNTESTED by the package and by its validation alike.
    - >-
      THE 27 TUPLES AT WHICH NO PER-TUPLE CRITERION COULD FIRE EVEN UNDER THE FULL
      COUNTERFACTUAL are an INFORMATION LIMIT at the fixed replicate count, named
      individually in the committed criterion feasibility table before the freeze.
      They are not a finding about anything, and the only escape - more replicates
      - is forbidden by RC-E and is declared unavailable rather than quietly taken.
    - >-
      EXP-YIELD-002 IS NOT EVEN AN EXPONENT-DECIDING SCREEN. It is an INSTRUMENT
      CONTROL ON A CONTROL, admitted under docs/target-result-profile.md rule A1's
      building-block clause. IT MOVES NO EXPONENT AND CANNOT MOVE ONE, and no
      later record may quote any part of it as target-class, as an exponent
      result, as an attack, as an attack improvement, as a cryptanalytic result,
      as a closure or as an impossibility claim. All four asymptotic-claim
      promotion gates remain OPEN and none is attempted.
    - >-
      DECLARE NO LANE DEAD. Nothing here is an impossibility result. THE
      DECOMPOSITION-YIELD QUESTION AT m IN {2, 3} OVER PRIME FIELDS REMAINS OPEN,
      and its instrument is now one measurement better characterised than it was.

