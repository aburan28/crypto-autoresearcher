  what_this_evidence_cannot_establish:
    - >-
      ANYTHING ABOUT DECOMPOSITION YIELD, IN EITHER DIRECTION, AT ANY SCALE. This
      is first on the list because it is the thing a reader is most likely to
      infer. A repaired control that lands on its own prediction establishes that
      the control was mis-constructed and establishes NOTHING about the quantity
      the control was built to normalise.
    - >-
      That P_pred is certified, correct or validated as a model of the
      decomposition census.
    - >-
      That INV-4 should not have fired, is un-fired, or is re-disposed. It fired
      under the EXP-YIELD-001 contract's own rule on the EXP-YIELD-001 run;
      nothing in BATCH-012 evaluates or can evaluate a rule of another contract on
      another run.
    - >-
      That any BATCH-011 efficiency E or yield ratio is now readable, recoverable
      or was always fine. THE VOID STANDS IN FULL, on procedural, evidential and
      structural grounds. No efficiency, no yield ratio and no occurrence of 0.85
      as a measurement appears in the package or in this record.
    - >-
      Any determination of INV-5 in either direction. EV-ECDLP-008 observation
      O-8 stands.
    - >-
      Any status change for H-YIELD-001, H-STR-002, H-IC-001, H-ENDO-001,
      H-GGM-001, H-FCP-001, H-SUBRES-001 or any other hypothesis in this ledger.
    - >-
      Any re-charging, flagging or defence of any index-calculus cost model, and
      any restatement of EV-ECDLP-008 observation O-11 as a result of this batch.
    - >-
      That the repaired null lands ON P_pred. It lands AT OR SLIGHTLY ABOVE it, by
      an amount the declared second-order biases do not account for.
    - >-
      That the repaired null is exact, or that the high-precision block's
      difference column confirms T to within 0.05 per cent.
    - >-
      That RC-F is discharged, or that IV-1 passing is progress on RC-F.
    - >-
      That heuristic HEUR-1, the counting heuristic B^m/(m! p), was tested. It was
      not, and `heuristic_under_test` is null in the frozen contract.
    - >-
      Anything about cryptographic-size curves in either direction. No
