  narrowest_supported_statement: >-
    At the 48 de-duplicated criterion-evaluable parameter tuples of the committed
    EXP-YIELD-001 v2 package, a curve-free occupancy simulation that pre-marks
    |S_(m-2)| uniformly chosen bins before throwing C_red/2 antipodal pairs
    reproduces the unchanged, hash-bound P_pred under both pre-registered
    denominator readings, with all three per-tuple firing sets empty on set
    identity and n_neg = 16 inside the pre-registered [14, 34] window. This
    confirms by measurement, for the first time, that CTRL-NULL-SUMSET as frozen
    in EXP-YIELD-001 v1 and as re-specified by amendment C-4 was mis-constructed
    by exactly the omitted term, and it establishes nothing else. It does not
    certify P_pred as a model of the decomposition census, does not un-fire or
    re-dispose INV-4, makes no BATCH-011 efficiency E readable, declares INV-5
    neither way, moves no hypothesis, and yields no cost-model consequence
    whatever - the counterfactual branch being O-6 and not O-4. EV-ECDLP-008
    observation O-4 is neither superseded nor confirmed as a whole: its
    null-construction component is confirmed and its component about which bins
    the correct null should pre-mark is untouched. A pass of P-CORE is not
    evidence that the repaired null is exact, and under a perfectly correct
    repaired null this design records P-CORE only about 0.659 of the time. The
    realised aggregate z_sem mean of +0.3610 over the 48 tuples exceeds what the
    declared second-order biases account for, is recorded and not adjusted for,
    is unexplained and unreplicated, and is in the direction away from the
    counterfactual this design exists to detect. Claim tier toy; a single
    unreplicated curve-free run set; NOT A CRYPTANALYTIC RESULT.

