evidence:
  id: EV-ECDLP-009
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-012
  hypothesis_id: null
  hypothesis_id_note: >-
    NULL, DELIBERATELY, AND THE NULL IS THE HONEST VALUE RATHER THAN A MISSING
    ONE. EXP-YIELD-002 declares `hypothesis_id: null` in its frozen
    specification and `heuristic_under_test: null` beside it. This record is
    evidence about a CONTROL OBJECT - the occupancy null CTRL-NULL-SUMSET as
    frozen in EXP-YIELD-001 v1 and as re-specified by amendment C-4 - and about
    nothing else. IT IS NOT EVIDENCE ABOUT H-YIELD-001 IN EITHER DIRECTION, and
    H-YIELD-001 stays `specified`. It bears on no other hypothesis in this
    ledger: not H-STR-002, whose next transition in either direction is bound by
    DEFER-BATCH009-001's undischarged EXP-STR-004 replication obligation; not
    H-IC-001; not H-ENDO-001; not H-GGM-001; not H-FCP-001; not H-SUBRES-001.
    Naming a hypothesis here would invite exactly the inference the run cannot
    support.
  experiment_ids:
    - EXP-YIELD-002
  run_ids:
    - RUN-YIELD-002-NULL-REPAIRED
    - RUN-YIELD-002-NULL-ASRECORDED
    - RUN-YIELD-002-KNOWNANSWER
  type: empirical
  direction: supports
  direction_basis: >-
    SUPPORTS EXACTLY ONE SCOPED PREDICTION AND NOTHING ELSE, AND THE SCOPE IS THE
    WHOLE OF THE CLAIM. What is supported is the pre-registered prediction of
    EXP-YIELD-002 as frozen at f291a624610458fc7ad40b5cf174447517ce97e5 and
    amended at e3c9cb451381625877034174b61ca918b48f790d and
    0548d8ccabcd8c95bd0a7240b8424d9c5248a138: that a balls-in-bins process which
    pre-marks |S_(m-2)| bins before throwing C_red/2 antipodal pairs reaches the
    UNCHANGED, hash-bound P_pred at all 48 declared parameter tuples under both
    pre-registered denominator readings, with the pre-registered upward shift.
    `supports` HERE IS NOT SUPPORT FOR ANY HYPOTHESIS, for any statement about
    decomposition yield, for any efficiency, for any cost model, or for any claim
    about cryptographic-size curves. A repaired control that lands on its own
    prediction establishes that the control was MIS-CONSTRUCTED; it establishes
    nothing about the quantity the control was built to normalise. That sentence
    is the frozen contract's own and it binds this record.
  strength: preliminary
  strength_basis: >-
    `preliminary` IS THE CEILING AND IT IS NOT A FORMALITY. Forty-eight parameter
    tuples are NOT forty-eight replications: they are 48 points of ONE simulation
    of ONE analytic process, on ONE platform, under ONE implementation, in ONE
    batch, whose every input comes from a SINGLE UNREPLICATED SOURCE RUN SET
    (EXP-YIELD-001, four field sizes with ONE prime-order curve each - a size
    series, not a replication). The contract's own confirmatory_status is
    `exploratory_only` under RC-G, because every N, B, C_red, m, |S_(m-2)| and
    P_pred it consumes was committed before the contract was written.
    `replicated` and `strong` are both UNAVAILABLE, and `reject_scoped` on this
    run set is forbidden by agents/coordinator.md in either direction. The named
    replication that would raise the strength is RC-21A, which BATCH-012 does not
    perform and does not authorize.
  claim_tier: toy
  claim_tier_basis: >-
    Field sizes k in {12, 14, 16, 18} with quoted group orders 4001, 16619, 65633
    and 261707; arities m in {2, 3}; the frozen beta grid as realised in the
    source package; the x-interval factor-base convention with B measured; ONE
    prime-order curve per size IN THE SOURCE PACKAGE; one simulator, one budget,
    one platform, numpy 2.4.0. The experiment is CURVE-FREE - it executes zero
    group operations and constructs no curve, no factor base and no sum set - so
    it is not evidence about any curve at any size, and no correspondence,
    isometry or transport argument to cryptographic scale exists or is offered.
    Claim tier is declared toy in the frozen specification, in both amendments,
    in all three manifests, in summary.json and in the TASK-20260729-019 receipt,
    and it is capped there.

  certificate_refs:
    - >-
      NONE, AND NONE IS APPLICABLE. EXP-YIELD-002 claims no discrete-logarithm
      solve, no relation and no bound, so there is nothing whose claimed truth a
      certificate could re-verify, and docs/claims-and-verification.md requires
      none. Recorded as not applicable rather than as satisfied.
    - >-
      THE NEAREST ANALOGUE, AND IT IS A CONTROL RATHER THAN A CERTIFICATE:
      experiments/EXP-YIELD-002/runs/RUN-YIELD-002-KNOWNANSWER/results.json -
      the IV-2 known-answer arm, eight cases KA-1 to KA-8, four of them at ZERO
      tolerance, all eight independently re-implemented and re-passed by
      TASK-20260729-020 from the contract text.

  proof_status: derivation
  proof_status_declaration: >-
    THE BASIS IS MIXED AND BOTH HALVES ARE DECLARED, PER
    docs/claims-and-verification.md "Refutation artifacts" AND PER
    RT-20260729-021 SECTION 7, WHICH ORDERED THEM.
    (1) COUNTEREXAMPLE CERTIFICATE - NOT AVAILABLE AND NONE CAN EXIST. A
    certificate here would be a tuple, seed and replicate stream at which the
    pre-marked antipodal process demonstrably does NOT have mean
    P_pred + (1 - s/N) f(lambda). That identity is an EXACT theorem for the
    specified process, independently re-derived at RT-20260729-016, so no such
    instance exists. Correctly not claimed.
    (2) DERIVATION - AVAILABLE, USED, AND STRONGER THAN THE MEASUREMENT IT IS
    PAIRED WITH. The exact mean E = N - (1 - s/N)[(N-1)A + C] with its O(1/N)
    control is committed in the frozen specification's
    process_specification.effect_size_arithmetic_OB_10, was re-derived from
    scratch by RT-20260729-016 before the freeze, and was re-derived a third time
    by TASK-20260729-020, which reproduced the declared 0.131-bin and 0.0895-SEM
    envelope with realised maxima 0.13051 bins and 0.07542 SEM. This is the basis
    of the analytic content of this record.
    (3) EMPIRICAL_ONLY - DECLARED HERE FOR EVERYTHING THE RUN ADDS. The 48-tuple
    Monte Carlo, the realised criterion evaluations, the known-answer
    frequencies, the comparability arm and the high-precision diagnostic block
    are EMPIRICAL_ONLY on a single unreplicated curve-free run set. RT-20260729-021
    ruled in terms that a record omitting this declaration for the measured half
    has an UNDECLARED BASIS and that the undeclared basis, not the absence of a
    certificate, is the failure. It is declared here.
  proof_refs:
    - >-
      experiments/EXP-YIELD-002/specification.yaml at
      f291a624610458fc7ad40b5cf174447517ce97e5 -
      process_specification.effect_size_arithmetic_OB_10, the exact-mean
      derivation with the identity-bin treatment made explicit rather than
      declared.
    - >-
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-012/reviews/TASK-20260729-016/contract_review.yaml
      - RT-20260729-016, which re-derived the exact mean from scratch before any
      draw existed and confirmed it, and which returned REVISE on other grounds.
    - >-
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-012/reviews/TASK-20260729-020/recount_note.md
      sections 3, 5 and 8 - the independent re-implementation written from the
      contract text alone, the five-item bin accounting, and the C-16 committed
      table re-derivation.
    - >-
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-012/reviews/TASK-20260729-021/falsification_review.md
      section 7 - the refutation-artifact ordering ruling that this record adopts.
  proof_refs_ordering_disclosure: >-
    THE ORDERING RULE IS SATISFIED FOR THE LOAD-BEARING CONTENT, WHICH IS AN
    IMPROVEMENT ON BATCH-011 AND IS RECORDED AS SUCH RATHER THAN CLAIMED AS
    CLEAN. INT-BATCH012-J requires the refutation artifact to be archived BEFORE
    the decision that relies on it. The primary artifact here is the RUN PACKAGE
    ITSELF, committed at c7189f80225bad0d0d2aa28cbbbb11e672d30dd6 by
    TASK-20260729-019, strictly earlier than this ledger archive; the derivation
    note is in the frozen specification at f291a624 and in RT-20260729-016,
    earlier still. THE TWO POST-EXECUTION REVIEW REPORTS THIS RECORD CITES WERE
    ALSO COMMITTED IN AN EARLIER COMMIT THAN THIS ONE - see
    integrity_note_declared_set_deviation below - so unlike DEC-20260729-001,
    no argument this record rests on lives only in a file committed by the same
    archive. What remains DISCLOSED rather than cured: the RT21-1 corrected
    detection curve and the TASK-20260729-020 Monte Carlo are UNARCHIVED PROBES
    reported inside those reports and are labelled NOT EVIDENCE by the sessions
    that computed them; this record carries them as reported quantities of a
    review, never as measurements of this experiment.

  integrity_note_declared_set_deviation: >-
    DECLARED AS AN INTEGRITY NOTE RATHER THAN WORKED AROUND, AND THE DEVIATION IS
    THE DISPATCHING COORDINATOR'S AND NOT THIS CARD'S. The TASK-20260729-022
    declared commit set is eight paths, four of them the TASK-20260729-020 and
    TASK-20260729-021 review artifacts. Those four were committed EARLIER, at
    f7b780f6, rather than in this ledger commit. They are therefore committed and
    hash-bindable exactly as the declaration requires; what differs is that they
    landed one commit early, so the commit carrying this record changes THREE
    declared paths - ledger/evidence/EV-ECDLP-009.yaml,
    ledger/decisions/DEC-20260729-002.yaml and ledger/goals/GOAL-ECDLP-001.yaml -
    which is a STRICT SUBSET of the declared eight and contains no undeclared
    path. No declared path is missing from the repository and none is committed
    twice with different content. A verifier comparing the declared set against
    this single commit MUST EXPECT the four review paths at the earlier commit,
    exactly as INT-BATCH007-T already requires it to expect each receipt one
    commit later. Recorded, not repaired: enlarging or shrinking the declaration
    after the fact would falsify one side of it.

