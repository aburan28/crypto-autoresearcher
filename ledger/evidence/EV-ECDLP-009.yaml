        comparison is evaluated on SET IDENTITY and never on cardinality, as the
        PRED-ID rule requires, and all three symmetric differences are empty.
        Realised extrema, reproduced independently at max absolute difference
        0.0: max |z_sem| = 2.6101537975436533 at T-18-3-B44; max |z_sd| =
        0.4765467044908104; max |z_shift| = 2.981990543674932 at T-18-2-B140. NO
        INVALIDATION RULE FIRED: IV-1a 0 of 48 and IV-1b 0 of 48 against triggers
        of MORE THAN two; IV-2 passes at all eight known-answer cases; IV-3 did
        not fire; IV-4's re-derivation of lambda, exp(-lambda), T and P_pred
        against the QUOTED values agrees at MAXIMUM ABSOLUTE DIFFERENCE 0.0
        across all 48 tuples; IV-5 has nothing to name, all 48 tuples being
        reached in both arms; IV-6 did not fire. Under the frozen falsification
        criterion P-MISS is false, so neither MISS-STRUCTURED nor MISS-MARGINAL
        is reachable, and the realised branch is P-CORE.
    - id: O-5
      label: CR-3's realised margin, and the pre-registration that did succeed
      text: >-
        NARROW-2, ADOPTED VERBATIM IN DEC-20260729-002 AND RECORDED HERE SO THE
        EMPTY FIRING SET IS NOT READ AS A COMFORTABLE MARGIN. CR-3's realised
        firing set is empty, and its largest realised statistic is |z_shift| =
        2.981990543674932 at T-18-2-B140, which passes the 3.000 threshold by
        0.018 and which is NOT one of the two tuples C-16 pre-registered BY NAME
        as CR-3's expected chance offenders. The package reports that figure
        honestly, in tail_checks and in top_five_abs_z_shift, rather than burying
        it. SEPARATELY AND IN THE PACKAGE'S FAVOUR: the two tuples that WERE
        named in advance, T-18-2-B264 and T-14-2-B118, realised |z_shift| 1.9806
        and 1.5698 and did not fire, which is a genuine and correctly reported
        pre-registration success. The pre-data conditional rates for those two,
        committed before any draw, are 0.105 and 0.057 with A2 removed.
    - id: O-6
      label: THE ONE UNEXPLAINED OBSERVATION - the aggregate z_sem shift, recorded and not adjusted for
      text: >-
        RECORDED UNDER AGENTS.md CORE RULE 8 AND NOT ABSORBED. The z_sem vector
        over the 48 declared tuples has mean +0.361024, sd 0.975002, standard
        error of the mean 0.140729, t = 2.5654 - reproduced exactly by the
        Executor, by the dispatching session, by TASK-20260729-020's independent
        simulator and by TASK-20260729-021.
        WHAT IS EXCLUDED, EACH BY A NAMED CHECK. The two declared second-order
        biases account for only +0.0264 of it: the contract's own exact mean
        evaluated at all 48 tuples gives bias/sem in [0.00468, 0.07542] with mean
        0.02638, confirming the declared 0.0895 SEM envelope and the declared
        0.0752 per-tuple maximum, and re-standardizing against the exact process
        mean leaves +0.334642 (t = 2.3794). Replicate-level skewness accounts for
        a further +0.011 and is an order of magnitude too small. An off-by-one in
        the pre-mark, a ddof inconsistency and a wrong shuffle keyword are
        excluded structurally by two independently written implementations
        agreeing at 0.0 and by KA-4 and KA-5 at zero tolerance. A seeding
        correlation or a pathology of the SHA-256 seed derivation is excluded by
        direct Monte Carlo. An n_rep-keyed code path is excluded by reading the
        driver, which has none. A third unmodelled analytic term is strongly
        disfavoured: the exact mean is exact rather than asymptotic and was
        re-derived from scratch; the INDEPENDENT as-recorded arm shows +0.1224
        (t = 0.887) and the committed BATCH-011 arm shows -0.0122 (t = -0.075);
        and the classical skew mechanism E[T] approximately -gamma_1/(2 sqrt(n))
        gives about 0.003 SEM, two orders of magnitude too small.
        THE CONTROL THAT WAS ALREADY RUN, AND WHAT IT SHOWS. A real defect is a
        FIXED OFFSET IN BINS, which z_sem scales by sqrt(n_rep)/sd, so an offset
        large enough to give +0.3346 SEM at 100 replicates MUST give +2.9 to +3.7
        SEM at 10000. The committed high-precision diagnostic block measures
        exactly that at four tuples through the SAME draw path, and the observed
        deviations of its repaired leg from the exact analytic mean are -2.95,
        +0.97, +0.61 and -0.45 where +3.09, +3.66, +2.94 and +3.24 would be
        required; RT-20260729-021 puts that joint outcome at probability of order
        1e-7 under a real bins-level bias.
        THE INDEPENDENT MONTE CARLO. TASK-20260729-020 repeated the ENTIRE
        48-tuple design 400 times under the contract's OWN SHA-256 seed rule with
        disjoint master seeds, obtaining MC mean +0.0439 and MC sd 0.1473 - the sd
        an independent-stream design predicts, sqrt(1.03/48) = 0.147 - and places
        the observed value at P(mean z_sem at least 0.361024) = 0.0100 plus or
        minus 0.0050, with P(n_neg at most 16) = 0.0200. A 100-repetition run
        under SeedSequence.spawn agrees and returns n_neg MC mean 23.55 against
        the contract's declared Poisson-binomial E[n_neg] = 23.504.
        WHAT REMAINS OPEN, AND NO EXPLANATION IS ADOPTED. Two readings survive:
        chance in a quantity that was NOT a pre-registered test statistic -
        tail_checks names no statistic and DEV-6 records that it fires nothing by
        construction, so a post-hoc 2.4 sigma there is worth very little - and a
        small shift common to both BATCH-012 arms (pooled +0.2285, SEM 0.0985,
        t = 2.32) that would have to be a property of THIS driver, platform or
        numpy build rather than of the process, which the high-precision block
        also disfavours. RT-20260729-021 adopted the first reading AND made its
        own next action conditional: RC-21A, a replication of the repaired arm
        under a fresh master seed on a different interpreter and platform, MUST be
        dispatched before any record adopts a reading of the shift, and if it is
        not, THE SHIFT IS RECORDED AS UNEXPLAINED AND UNREPLICATED WITH NO
        EXPLANATION ADOPTED. RC-21A was not dispatched, the batch budget being
        consumed, so that is exactly how it is recorded here.
        THE SENTENCE THIS CONSTRAINS, AND IT IS BINDING ON EVERY LATER RECORD: NO
        RECORD MAY SAY THE REPAIRED NULL LANDS ON P_pred. IT LANDS AT OR SLIGHTLY
        ABOVE IT, by an amount larger than the declared second-order biases
        account for and currently unexplained.
        WHY IT DOES NOT DAMAGE THE P-CORE READING, AND THE REASON IS NOT THAT
        CR-4's WINDOW ABSORBED IT: the shift is POSITIVE, and every alternative
        this design exists to detect is a SHORTFALL, so the excursion is in the
        direction AWAY from the counterfactual and cannot manufacture a P-CORE
        that a shortfall would have denied. n_neg = 16 low in [14, 34] is the same
        fact seen through a coarser statistic, not independent corroboration.
    - id: O-7
      label: the known-answer arm - EIGHT OF EIGHT PASS ON AN INDEPENDENT IMPLEMENTATION
      text: >-
        IV-2 does not fire. TASK-20260729-020 re-implemented all eight cases from
        IV-2 plus C-3a and C-19a and derived their seeds independently: KA-1 and
