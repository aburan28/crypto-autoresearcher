        empty; 27 of 27 AGENTS.md artifact-policy fields present in 3 of 3
        manifests. The snapshot commit c7189f80225bad0d0d2aa28cbbbb11e672d30dd6
        has the declared first parent f49670fa165e63cb8970ab137a4311c3d8223fd0,
        changes exactly 11 paths all additions, and all 11 recorded SHA-256
        values recompute from the Git blobs at that commit - re-verified
        independently by BOTH review sessions. The two hash-bound inputs match
        their pinned values exactly. NO TIMEOUT, NO CRASH, NO RESOURCE
        EXHAUSTION AND NO BUDGET CANCELLATION OCCURRED ANYWHERE IN THE PACKAGE,
        so there is no infrastructure signal to report and none is reported.
        Approval precedence is a property of the commit graph: the
        TASK-20260729-030 receipt records the determination APPROVED at
        5174001c37cc6e3b27fb468e0742d7732976a5de, and that commit is an ANCESTOR
        of f49670fa, the parent of the run snapshot.
    - id: O-2
      label: bit-identical re-execution - VERIFIED, AND SCOPED
      text: >-
        TASK-20260729-020 re-executed the committed driver blob against the two
        committed input blobs in a scratch root OUTSIDE the repository and
        diffed all four regenerated JSON documents against the committed blobs by
        recursive structural diff at EXACT FLOAT EQUALITY. Every differing leaf is
        a timing field or a hash of a file that differs only in timing fields:
        ZERO NON-TIMING DIFFERENCES. Wall clock 14.53 s in that session against
        14.96 s recorded in the package. THE SCOPE IS NARROWED AND NOT SOFTENED
        (NARROW-5): the reproduction ran on the SAME platform, the SAME
        interpreter and the SAME numpy 2.4.0, so it establishes DETERMINISM OF
        THE RECORDED PIPELINE and NOT portability across numpy versions or
