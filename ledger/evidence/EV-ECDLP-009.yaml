    - >-
      AN UNTRACKED macOS AppleDouble SIDECAR at
      experiments/EXP-YIELD-002/amendments/._v2_to_v3.yaml was deleted by the
      Executor from OUTSIDE its declared write scope. Disclosed in the receipt; it
