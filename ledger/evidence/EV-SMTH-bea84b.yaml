  headline: >-
    THE INSTRUMENT DOES NOT DISCRIMINATE. The frozen success predicate of
    EXP-SMTH-71b1b0 evaluates true at both field sizes, and that fact carries no
    information about HEUR-DS-1, because the identical predicate also passes on
    a factor base of 512 elements that are NOT x-coordinates of points on the
    curve. This is a controlled null, not a result.

  observations:
    - Frozen predicate evaluated true at both field sizes. bits16 KS2-DS-1
      0.002094545009784732 and bits20 0.0026296477495106885, against threshold
      0.006373. TAIL-DS-1 |0.00067270| and |0.00063448| against 0.01. DECAY-1
      did not fire at either size.
    - All four blocking controls recorded PASS, and the Validator recomputed
      every one from the raw arm data rather than reading the summary.
    - DECISIVE - NULL-OBJECT CONTROL, run by the Red Team and NOT contained in
      the frozen contract. The identical pipeline on an OFF-CURVE factor base
      (512 elements with x**3 + a*x + b a quadratic non-residue, so none is the
      x-coordinate of a point of E(F_p)), same p, a, b, same INT-1, same ENC-B,
      compared against this run's own committed NULL-UNIF-D arrays, PASSES THE
      ENTIRE FROZEN PREDICATE at both field sizes - KS2 0.00363 and 0.00172,
      TAIL 0.0017 and -0.0005, DECAY 0.00041 and 0.00035.
    - Mechanism of the non-discrimination, predictable before compute. ENC-B is
      the bijection N = e1*p + e2 + 1 onto exactly the null's support, so the
      test is an equidistribution test for (e1, e2) in F_p**2. The one
      structural feature that makes the object a Semaev half-arity partial map
      on the curve contributes nothing the predicate can see.
    - CTRL-ENCA-POWER is a liveness check, not a power certificate. ENC-A =
      max(e1,1)*max(e2,1) is a product of two integers below p, so its largest
      prime factor is below sqrt(D) WITH PROBABILITY ONE. The arm is 100.0000
      percent u=2-smooth with 0.0000 percent tail at both sizes (max LPF 59281
      against sqrt(D) 65536; 928111 against 1048576). The 106x rejection margin
      is arithmetic, not an outcome. Independently found by both reviewers.
    - Resolution of the primary statistic collapses down the ladder. KS2-DS-1 is
      an unweighted sup-norm with an absolute tolerance, so tolerated
      treatment/null ratios are 1.02x at u=2, 1.10x at u=3, 1.74x at u=4, 6.45x
      at u=5 and 60.6x at u=6 (105x at bits20) - blind exactly where a Dickman
      early-abort accounting would live.
    - Attacks that did NOT land, reported for completeness. Cluster dependence
      from 130816 records over 512 sources - measured design effect approx 1.0,
      does not bite. Permutation calibration - the frozen threshold's true alpha
      is approx 0.017-0.025, mildly LIBERAL, so it cannot have manufactured the
      pass. "Encoder never ran" - defeated by verify_run.py V4, which re-derives
      N end-to-end and re-factors 400 records per arm by pure trial division.

  inference: >-
    NO INFERENCE ABOUT HEUR-DS-1 IS DRAWN, and none is available from this run.
    The frozen predicate was met, but the null-object control shows the
    predicate cannot distinguish the tested object from an off-curve one, so
    meeting it is uninformative about the curve structure the hypothesis is
    about. The correct reading is a failure to reject at sup-norm resolution
    0.0064, on an instrument demonstrated to be non-discriminating.
    This is the outcome the inventor protocol calls a controlled null. It is
    recorded as evidence about the INSTRUMENT, not about the mathematics.

  boundaries:
    - Toy tier. bits in {16, 20}, |FB| = 512, m = 4, INT-1, ENC-B, one curve
      instance per field size, one seed, one host, one unreplicated run.
    - Scoped to the frozen intermediate map INT-1 and the primary encoding
      ENC-B. A different faithful encoding of the same fibre could carry a
      different smoothness law; this run does not rule that out.
    - Licenses NO cost saving, NO exponent, NO early-abort accounting, NO
      crypto-scale validity and NO consequence for any deployed scheme.
    - CTRL-ENCA-POWER certifies that the statistic can reject AT ALL. It does
      NOT certify power against a small deviation. No record may say this test
      was shown to have power.
    - The frozen contract labels a pass `outcomes.SUPPORT_AT_TOY_SCALE`, whose
      disposition field reads `support`. That label is NOT adopted. It contradicts
      H-SMTH-001.interpretation_limits ("A pass is `replicate`, never
      `support`"), and the null-object control makes even `replicate`
      overstated. Recorded as a contract defect in CORR-20260803-5fbba1.
    - ENC-A, the object of a blocking control, is defined nowhere in the frozen
      contract; the single corpus definition was imported. See
      CORR-20260803-5fbba1.

  what_this_evidence_does_not_support:
    - It does not support HEUR-DS-1.
    - It does not weaken or refute HEUR-DS-1. A non-discriminating instrument
      produces no evidence in either direction, and a timeout, a degenerate
      control or a blind statistic is never negative mathematical evidence.
    - It does not license any transition of H-SMTH-001 toward supported,
      weakened or rejected.
