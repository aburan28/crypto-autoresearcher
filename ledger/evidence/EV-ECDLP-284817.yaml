evidence:
  id: EV-ECDLP-284817
  experiment_id: EXP-SEMAEV-f48dd1
  run_id: RUN-SEMAEV-f48dd1-grid
  date: '2026-08-08'
  hypothesis_id: H-XOR-d1a480
  direction: weakens
  strength: strong
  claim_tier: toy
  summary: 'Revised experiment with mandatory revisions REV-1 to REV-4 applied. Primary analysis (REV-2)
    isolates oracle marginal contribution by comparing Arm B (oracle MITM) vs Arm C (random MITM), holding
    MITM structure constant. Result: oracle INCREASES candidates_verified by 3.75x, making MITM filtering
    LESS efficient. The oracle redirects queries but does not reduce work. Secondary analysis confirms
    MITM structure reduces field operations by 18x compared to exhaustive search, but this is the algorithmic
    structure effect (O(|F|^3) → O(|F|^2)), not the oracle effect.

    '
  observations:
  - id: OBS-1
    description: Oracle marginal contribution (PRIMARY, REV-2)
    metric: oracle_marginal_ratio = candidates_verified_B / candidates_verified_C
    value: 3.754
    std: 3.187
    range:
    - 1.36
    - 11.237
    n_groups: 8
    interpretation: 'Oracle INCREASES candidates_verified by 3.75x compared to random queries. Oracle
      makes MITM filtering LESS efficient, not more. The oracle''s effect is to redirect queries, not
      reduce work.

      '
  - id: OBS-2
    description: MITM cost reduction vs exhaustive search (SECONDARY)
    metric: cost_ratio = field_operations_B / field_operations_A
    value: 0.0557
    std: 0.0223
    range:
    - 0.0321
    - 0.0926
    n_groups: 8
    interpretation: 'MITM reduces field operations by factor of 18.0x compared to exhaustive search. This
      is the MITM STRUCTURE effect (O(|F|^3) → O(|F|^2)), not the oracle effect. The cost reduction comes
      from the algorithmic structure, not the oracle.

      '
  - id: OBS-3
    description: MITM filtering efficiency
    metrics:
      arm_b_survival_rate: 0.3744
      arm_c_survival_rate: 0.1323
      ratio: 2.83
    interpretation: 'Arm B (oracle): 37.4% of right-half pairs survive to verification. Arm C (random):
      13.2% of right-half pairs survive to verification. Oracle increases survival rate by 2.83x, confirming
      oracle makes filtering less efficient (more candidates survive, more work to verify).

      '
  inferences:
  - id: INF-1
    description: Oracle does not reduce work
    basis:
    - OBS-1
    - OBS-3
    conclusion: 'The oracle increases candidates_verified by 3.75x and increases the survival rate by
      2.83x. The oracle''s effect is to redirect queries to structured patterns, but this does not reduce
      the total work. In fact, it makes MITM filtering less efficient because more candidates survive
      to verification.

      '
  - id: INF-2
    description: MITM structure reduces cost, not oracle
    basis:
    - OBS-2
    conclusion: 'The 18x cost reduction comes from the MITM structure replacing O(|F|^3) exhaustive enumeration
      with O(|F|^2) right-half table construction plus O(|F|) left-half queries. This is a standard algorithmic
      optimization, not an oracle-specific improvement. The oracle''s contribution is limited to query
      patterns, not algorithmic complexity.

      '
  limitations:
  - id: LIM-1
    description: Toy scale only
    scope: 7-8 bit primes, m=3
    impact: 'Results may not extrapolate to crypto scale. Hash table overhead, memory access patterns,
      and cache behavior may change dramatically at larger scales.

      '
  - id: LIM-2
    description: Constant factor only
    scope: no asymptotic improvement
    impact: 'Both arms have the same asymptotic complexity O(|F|^m). The cost reduction is a constant
      factor (18x), not an exponent change. This is fundamentally different from an asymptotic improvement
      like Wesolowski''s p^{1/3+o(1)}.

      '
  - id: LIM-3
    description: Dominated by Pollard rho
    scope: not competitive with best known
    impact: 'Pollard rho is O(sqrt(N)) time, O(1) memory. The x-oracle MITM is O(|F|^m) time, O(|F|^2)
      memory. For any reasonable parameter choice, rho is faster and uses less memory. This experiment
      does not change that.

      '
  revisions_applied:
  - id: REV-1
    description: Reframe claim to test MITM cost reduction, not oracle cost reduction
    applied: true
  - id: REV-2
    description: Add Arm C comparison as primary analysis
    applied: true
  - id: REV-3
    description: Remove t-test, replace with deterministic statement
    applied: true
  - id: REV-4
    description: Add cost model limitations as confounder
    applied: true
