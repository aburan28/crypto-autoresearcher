  run_ids: [RUN-MONO-bb6fa1-1]
  type: galois_group_discrimination_on_one_object_after_a_corrected_control_standard
  direction: consistent_with_g_r_equals_s3_excludes_trivial_c2_and_a3_does_not_confirm_s3
  strength: >-
    a_single_tested_object_with_all_named_rival_alternatives_ruled_out_but_no_second_object_or_prime_yet_confirming_the_specific_group
  claim_tier: toy
  proof_status: empirical_only
  proof_status_note: >-
    A single exhaustive measurement (|V_R(F_101)|=10202 points, fully
    censused) on one curve and one point R, independently reproduced and
    audited by the Validator with entirely separate code, plus an
    independent Red Team derivation of a previously-unnamed rival
    hypothesis and its own exclusion. Not a derivation of G_R=S_3 itself
    -- only a measurement consistent with it.

  proof_refs:
    - experiments/EXP-MONO-bb6fa1/reviews/validator/validation-report.yaml (independent J1/J2 blind re-derivation and enumeration/curve/point audit, entirely separate code from the Executor's own)
    - experiments/EXP-MONO-bb6fa1/reviews/red-team/red-team-report.yaml (independent J3 derivation of the C_2 rival and its exclusion; J4 correction-completeness audit)
    - ledger/corrections/CORR-20260904-8cc20f.yaml (the tolerance-model defect this evidence record's own reading depends on)

  summary: >-
    EXP-MONO-bb6fa1 measured, on curve E: y^2=x^3+x+1 over F_101 (j=34,
    ordinary) and point R of true order 105 (confirmed not in E[2]), the
    factorization-type census of the m=4 residual cubic over the fixed-T
    surface V_R: |V_R(F_101)|=10202 (within the Lang-Weil envelope of
    p^2=10201), discriminant-square rate R1=0.4952, "1+2" density
    R2=0.5048, split density R3=0.1683 (irreducible density 0.3269).
    R8 (the free m=3 baseline reproduction check) PASSED exactly. Stage
    1's two mandatory nearby-object controls were reported as FAILED
    under the frozen specification's own literal asymptotic tolerance,
    but this was itself a Coordinator specification defect
    (CORR-20260904-8cc20f): both control objects are exhaustive,
    deterministic finite-field censuses with exact, independently
    re-derived closed-form densities that match the observations
    bit-for-bit -- there is no sampling error to apply a statistical
    tolerance band to, and against the correct standard, BOTH controls
    pass, demonstrating the classifier genuinely distinguishes the two
    objects rather than being blind to the effect. This claim was
    independently re-verified from scratch, by entirely separate code,
    by the Validator (J1/J2, both hold).

    Red Team's own independent analysis (J3) then made the substantive
    contribution: R1 and R2 are not independent measurements of G_R --
    a classical identity (disc(g) is a square iff Frobenius is an even
    permutation iff the type is NOT "1+2") links them exactly (verified
    bit-exact on the run's own counts: 1683+3269=4952, R1's own
    numerator), so R1/R2 together only test "is G_R contained in A_3",
    NOT full transitivity. Red Team identified a previously-unnamed rival
    the specification did not consider: G_R=C_2 (an INTRANSITIVE subgroup
    -- one root of g is always a rational function of the base point,
    i.e. the cover is reducible), which predicts the IDENTICAL R1/R2
    values as S_3 (0.5, 0.5) but a DIFFERENT split/irreducible split
    (1/2, 0 instead of 1/6, 1/3). The ACTUAL observed R3=0.1683 (close to
    1/6) and irreducible density 0.3269 (close to 1/3) decisively exclude
    C_2 (which predicts 1/2 and 0 respectively) as well as A_3 (which
    predicts split density 1/3, ruled out already by R1) and the trivial
    group. G_R=S_3 is the only named candidate the data is consistent
    with, on this one tested object.

  claim_tier: toy
  what_this_supports: >-
    (1) The Stage-1 control tolerance defect is real and confirmed by
    two independent reviewers via entirely separate code and reasoning
    -- the archived run's own literal "control_failure" disposition
    reflects a specification defect, not an instrument failure. (2) On
    this ONE tested (curve, R), all named rival hypotheses for G_R
    (trivial, C_2, A_3) are decisively excluded by the FULL measured
    triple (not by R1 alone, which Red Team showed cannot separate S_3
    from C_2); G_R=S_3 is the sole surviving named candidate. (3) A
    striking, independently-noted numerical curiosity: the observed
    split density R3=0.16831683... equals EXACTLY 17/101 = (p+1)/(6p),
    the same O(1/p)-correction SHAPE as the two null-object closed forms
    -- but this is disclosed as an unexplained observation, not a
    derived or confirmed law, per Red Team's own explicit caution.

  what_this_does_not_support: >-
    Does NOT confirm G_R=S_3 -- "excluding every named alternative on
    one object" is weaker than "deriving or independently reproducing
    the specific group on a second object." A single (curve, R) cannot
    rule out an UNNAMED alternative, and Red Team's own J3 explicitly
    could not derive a rigorous a priori bound on V_R's own expected
    finite-p deviation (unlike the two null objects, whose closed forms
    ARE derivable from elementary combinatorics) -- the "consistent with
    S_3" reading rests on ruling out named rivals plus a qualitative
    Weil-bound plausibility argument, not an exact target value. Does
    NOT test Stage 2/3 of IDEA-20260904-a1b81b's own broader design
    (multiple curves, multiple R, multiple primes, CM comparison). Does
    NOT support any relation-rate, cost, exponent, or cryptographic-scale
    claim (per the idea's own interpretation_limits, unchanged). Does
    NOT establish or refute the R3=(p+1)/(6p) observation as a genuine
    law versus a coincidence at this one specific object.

  independent_review:
    validator:
      report: experiments/EXP-MONO-bb6fa1/reviews/validator/validation-report.yaml
      verdict: >-
        J1 (blind closed-form re-derivation, via two independent methods
        -- symbolic/hand and a from-scratch numpy brute force): holds,
        exact bit-for-bit match with the archived numbers, confirmed only
        AFTER completing the blind derivation. J2 (enumeration/curve/
        point audit, entirely separate code from the Executor's): holds
        -- confirmed the symmetric-coordinate enumeration (no ordered-
        variety trap), the degenerate-stratum criterion, and independently
        re-derived the curve (E:y^2=x^3+x+1/F_101, order 105, j=34,
        ordinary) and point (R=(8,4), true order 105, structurally
        excluded from E[2] since #E=105 is odd) from scratch.
    red_team:
      report: experiments/EXP-MONO-bb6fa1/reviews/red-team/red-team-report.yaml
      verdict: >-
        J3: identified and derived the previously-unnamed C_2 rival, its
        identical R1/R2 predictions to S_3, and confirmed the ALREADY-
        COLLECTED R3/irreducible-density values decisively exclude it.
        Attempted a rigorous a priori bound on V_R's own expected
        deviation; found it conditionally circular (an analogous Weil
        argument would presuppose the very transitivity being tested) and
        disclosed this honestly rather than forcing a derivation. Named
        the R3=(p+1)/(6p) exact match as a concrete, checkable curiosity.
        Recommended framing: "consistent with, not confirming, outcome
        (I)". J4: confirmed CORR-20260904-8cc20f correctly separates
        instrument-sensitivity from result-correctness claims; flagged one
        minor imprecision in that correction's own next_action (conflating
        elementary-combinatorics-scale corrections with Weil-type
        O(p^{-1/2}) corrections) that does not change the disposition but
        is noted here for the record; endorsed a standing rule for this
        program distinguishing exhaustive-census-with-known-closed-form
        controls from exhaustive-census-without-known-closed-form
        measurements.
    independent_session: true
    blindness_confirmed: >-
      Both reviewers launched as fresh subagents in one dispatch message.
      Validator confirmed the sibling Red Team directory was empty when
      it wrote its own report. Red Team confirmed it checked (via `ls`,
      no read) that the Validator directory was empty before forming its
      own conclusions.

