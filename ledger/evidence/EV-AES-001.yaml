  headline_non_result: >-
    THIS BATCH PRODUCED NO CRYPTANALYTIC RESULT AND NO CLAIM ABOUT AES OF ANY
    KIND, AT ANY ROUND COUNT. No distinguisher, no key recovery, no speedup, no
    measured structural excess, and no barrier statement about AES is asserted
    here. Zero cryptanalytic compute was spent: TASK-20260731-601 recorded
    depth_of_verified_structure: NONE and no gate was run. What exists is (A) a
    verified reproducibility instrument and (B) a screening verdict on a
    proposal package, plus corrections to that package's mathematics.

  # =====================================================================
  observations:

    # ---- (A) HARNESS INTEGRITY — A REPRODUCIBILITY FACT, NOT A RESULT -----
    - >-
      A-1 (scope statement, load-bearing). Observation group A concerns the
      TASK-20260731-602 instrument only. A passing harness verification is a
      REPRODUCIBILITY FACT about an implementation. It supports no claim about
      AES, demonstrates no speedup, and authorizes no promotion. It may never be
      upgraded into empirical cryptanalytic evidence about the cipher.
    - >-
      A-2. The producer snapshot commit 0185c0ff (parent 0137a051) verified
      against Git in the independent TASK-20260731-604 session: reachable from
      HEAD, expected parent, changes exactly the six declared paths, and all
      five source_path_sha256 values recomputed from the commit blobs match. The
      aes_reduced.py blob hash
      2c76f3e5db83ec2500ce1010a392a135869d8b9dd1a534af817e06f15babb447 equals
      the hash recorded in vector_check_receipt.json and the module's own
      load-time self-hash. No drift between receipt and committed code.
    - >-
      A-3. Full-round agreement reproduced under the validator's OWN seed
      (60420260731777) and OWN driver: 9000 pycryptodome comparisons
      (1500 key/plaintext pairs per key size at 128/192/256, encrypt and
      decrypt) and 1440 openssl CLI block comparisons, with 0 mismatches. The
      three known-answer ciphertexts (128: 69c4e0d86a7b0430d8cdb78070b4c55a;
      192: dda97ca4864cdfe06eaf70a0ec0d7191; 256: 8ea2b7ca516745bfeafc49904b496089)
      agreed three ways across aes_reduced.py, pycryptodome and openssl.
    - >-
      A-4 (qualifier on A-3). That these three values also match FIPS-197
      Appendix C is UNVERIFIED-FROM-MEMORY on BOTH sides: neither the executor
      nor the validator read any specification document (csrc.nist.gov
      unreachable). Two agreeing recollections are weaker than one read source
      and are not recorded as a citation. The load-bearing fact is the three-way
      IMPLEMENTATION agreement, which does not depend on anyone's recall.
    - >-
      A-5. Backend independence verified by construction, not by assertion: with
      imports of Crypto, Cryptodome, cryptography, subprocess, ctypes and ssl
      hard-blocked, aes_reduced.py still produced the correct AES-128
      ciphertext. Its only imports are __future__, dataclasses, hashlib, random,
      typing (json/sys in the __main__ demo only). pycryptodome (in-process
      library) and the openssl CLI (separate process, EVP path) are also
      independent of each other.
    - >-
      A-6. The documented reduced-round convention (C1 final round drops
      MixColumns; C2 initial AddRoundKey is whitening and is not a round; C3
      round keys are an untruncated FIPS-197 schedule prefix) matches what the
      code computes, checked against an INDEPENDENTLY AUTHORED reduced-round
      implementation written by the validator from the prose alone and
      deliberately structured differently: 468/468 cases agree, 0 disagreements
      (3 key sizes x r=0..Nr x final_mix_columns in {False,True} x 6 draws),
      with that implementation anchored to genuine AES at r=Nr against both
      backends.
    - >-
      A-7. Determinism reproduced: the archived driver, extracted from
      run_record.md and hash-matched
      (675ff4d568c03f6b12aa5d8931c6185ec7c5b08344ef826616fd9580d4c84a6d), re-ran
      twice from scratch in a different session and directory and produced the
      committed results digest
      f78e55e4b7d6df30f41ce4aa613f8621ca9ecdd21f9ab9f3027b87c96dacaf1a both
      times. A field-by-field structural diff of the recomputed receipt against
      the committed one differed only in /verdicts/determinism_rerun_digest_matches,
      which is emitted only when a prior digest is supplied.
    - >-
      A-8. The mutation control reproduced exactly (sbox_transpose_0x53_0x54
      2/4 KAT and 152/200 random pairs; shiftrows_offsets_swapped 4/4 and
      200/200; rcon_off_by_one 4/4 and 200/200), and ALL THREE mutants took the
      'applied' path — each was caught by a real comparison, so the committed
      green result is uncontaminated by the historical false-green bug the
      executor self-reported. A control-of-the-control (semantics-preserving
      no-op mutant) scored 0/200, so the control discriminates rather than
      always firing.
    - >-
      A-9 DEFECT H-1 (medium, latent, NOT realized in the committed run). The
      executor's false-green fix is genuine for the failure mode it addressed:
      an import-time AttributeError now yields verdict FAIL with
      detected: false on all three rows. But an import-time AssertionError
      UNRELATED to the injected fault is still scored
      rejected_by_module_self_check / detected: true, returning 'pass' on three
      mutants none of which was compared against anything. The failure class is
      NARROWED from all import exceptions to AssertionError only, not
      eliminated. Live path for future runs; tracked as a repair item.
    - >-
      A-10 DEFECT H-2 (low). The module's import-time self-check is an assert
      and is stripped under python3 -O: a module with provably inconsistent
      MixColumns/inverse-MixColumns matrices imports cleanly under -O. Such a
      mutant would still be caught by differential comparison, but a check whose
      behaviour depends on an interpreter flag is not a check.
    - >-
      A-11 DEFECT H-3 (medium, coverage gap; nothing false is asserted). All
      three mutants are scored by full-round comparison against pycryptodome. No
      mutant perturbs round-structure logic (_is_final_round, encrypt_partial
      level bounds, round-key indexing at r < Nr) — precisely the bugs that
      would be invisible at r = Nr and would silently corrupt every later
      reduced-round measurement. The receipt's detection-power claim is scoped
      to the FULL-ROUND path and must be read that way.
    - >-
      A-12 PRINCIPAL LIMITATION H-4 (declared correctly by the producer, not a
      producer fault). The reduced-round path has NO EXTERNAL REFERENCE and
      cannot obtain one: no available tool implements r < Nr AES. Its components
      are externally pinned (byte-identical to the full cipher, whose components
      are constrained by three-way agreement over 10440 validator comparisons)
      and the prose-to-code binding is externally checked by A-6, but the
      round-structure convention itself is a DEFINITIONAL CHOICE, not a
      correctness question with a reference answer. Two of the receipt's own
      convention flat-checks (rounds=0 whitening; distinct ciphertext per round
      count) are near-tautological. Operative consequence: any future comparison
      of a reduced-round measurement against a recalled literature number
      silently assumes both use the same convention, and which convention the
      literature uses is UNANSWERABLE in this environment and remains open.
    - >-
      A-13. Checks correctly recorded as NOT RUN, confirmed unavailable by the
      validator: NIST CAVP/AESAVS response files, the FIPS-197 document text, an
      AES-NI C cross-check (out of deliverable scope), a reduced-round
      cross-check against an external reference (impossible), and non-ECB modes.
      These are infrastructure limitations, never statements about AES
      (AGENTS.md rule 5).

    # ---- (B) IDEATION SCREENING — A MATHEMATICAL-QUALITY FINDING ---------
    - >-
      B-1 (scope statement). Observation group B concerns the quality of the
      TASK-20260731-601 PROPOSAL package. It is reported separately from group A
      and is not merged with it: a sound harness does not validate the ideation,
      and a weak candidate does not invalidate the harness. Nothing in group B
      is a statement about AES either — the corrections below are facts about
      the algebra of AES components used to evaluate an argument, not
      cryptanalytic findings.
    - >-
      B-2. Independent verdict on CHECK (b): FAILED, scoped and repairable.
      Explicitly NOT for dishonesty and NOT for novelty. The package is
      well-formed, passes every formal-completeness requirement (tracked object,
      round count, assumptions, end-to-end cost charging of data/time/memory/
      precomputation/verification, non-null row-checked dominated_by,
      quantitative sota_delta, lossy-projection test, one runnable gate with its
      null control, six-family deduplication), presents NEITHER candidate as
      novel, records depth_of_verified_structure: NONE truthfully, and correctly
      refuses its own session-level saturation conclusion as 'unverified' per
      docs/inventor-protocol.md section 4. It failed on mathematics the
      validator recomputed.
    - >-
      B-3 DEFECT I-4 (major). The flagship AGL/GL closure — CAND-601-A's entire
      justification — is an ASSERTION, NOT A DERIVATION. The quoted group fact
      (translations plus GL(4,q) generate the 2-transitive AGL(4,q)) is true,
      but AES does not supply GL(4,q) on a column: MixColumns supplies exactly
      ONE element. Recomputed order of the AES MixColumns matrix in
      GL(4,GF(2^8)) = 4; |<M>|/|GL(4,q)| = 1.18e-38; orbit of e1 under <M> has
      size 4 against q^4-1 = 4294967295, i.e. at least 1073741823 orbits on
      nonzero vectors. The generated group is neither transitive nor
      2-transitive, so steps (i) and (ii) do not follow and nonconstant
      invariants of a single column difference exist in abundance. What survives
      is only the elementary fact that collinearity is preserved by any
      invertible M.
    - >-
      B-4 DEFECT I-2 (major). Step (iv) of the same argument is FALSE. Byte-wise
      inversion PRESERVES GF(2^8)-collinearity, because Inv(lambda*v)_i =
      lambda^-1 * v_i^-1; measured preserved on 4000/4000 collinear pairs with
      all coordinates nonzero and 4000/4000 with a zero coordinate. The
      GF(2)-affine layer L is the operative obstruction (collinearity broken on
      4000/4000). The conclusion 'the object dies at the first SubBytes'
      survives via a different mechanism than stated. The report CONTRADICTS
      ITSELF: its own second enumerated closure states the Inv/L duality
      correctly.
    - >-
      B-5 DEFECT I-3 (major). GATE-601-A's positive controls do not
      discriminate against the gate's own null object. Recomputed with the
      CHECK (a)-verified harness: R_j = 1.0 at r=1 (active column) and
      R_j = 1,1,1,1 at r=2 for AES AND for null_control_2 (AES with a random
      S-box); at r=3 both collapse to the null. Criterion (2) ('r=2 exceeds the
      null, instrument sensitive') therefore fires on a BYTE-ACTIVITY PATTERN,
      not on the GF(2^8)-module structure the object claims to exploit, so a
      null at r >= 3 would not be the demonstrated-sensitive null the
      candidate's rationale promises. The predicted graded decay does not exist
      — there are two levels, a cliff, not a decay — so the
      docs/inventor-protocol.md section 3 decay test cannot be applied on the
      positive side. The gate's VOID criterion (excess at r >= 3 flat or
      increasing) remains correct and is retained. The gate's statistical-power
      arithmetic is separately confirmed correct (C(255,2) = 32385;
      1e6 * 32385 * 5.9371e-8 = 1922.6 expected events per column, sigma ~44).
    - >-
      B-6 DEFECT I-1 (moderate). Assumption A3, self-labelled load-bearing and
      decisive, is FALSE: under the pinned default convention the r=1 rate is
      1.0, identical to the final_mix_columns=True variant, not ~2^-24. The
      error is in the safe direction for criterion (1), but a decisive
      assumption was wrong and cost seconds to check.
    - >-
      B-7 DEFECT I-5 (minor). Closure step (iii) states collinear triples occur
      at rate O(q^-2) = 2^-16; the true rate is (q-1)/(q^4-1) = 5.937e-08 =
      2^-24.01 = q^-3, which is exactly what the candidate's own assumption A1
      states. A1 is correct; the closure text is wrong. Nothing load-bearing
      depends on it.
    - >-
      B-8 DEFECT I-6 (moderate, CAND-601-B). sota_delta asserts a bit-margin
      (~4 bits, possibly ~0) against a recalled 2^44 partial-sums baseline whose
      own recall uncertainty is +/-2 bits — a comparison the candidate itself
      shows is not adjudicable in this environment. Any conclusion of the form
      'beats partial sums by N bits' is unreachable here REGARDLESS of how the
      gate resolves. It must be STRUCK, not deferred as an open question.
    - >-
      B-9. Rediscovery screening: NO candidate is presented as novel and NONE is
      a rediscovery presented as novel. CAND-601-A's 'adaptation' label is
      correct — it is NOT a rediscovery of the KN-LIT-7595 whole-state rank
      measurement, since a matrix can be full rank while containing many
      collinear column-restricted pairs — but the difference is INCONSEQUENTIAL,
      both statistics being null at r >= 3. CAND-601-B's self-label ('novelty
      unverified; PROBABLE REDISCOVERY stated up front') is correct and
      sufficient. Both the producer's and the validator's recollections about
      FFT/WHT integral key recovery are UNVERIFIED-FROM-MEMORY; two agreeing
      recollections settle nothing, and novelty against the external literature
      is UNRESOLVABLE in this environment.
    - >-
      B-10. Survival-depth call, handed to the validator by the producer:
      CAND-601-A's ~1/2-round survival depth DOES undermine its premise. The
      producer's defence (value as a cheap controlled test of its closure
      argument) requires a sound closure argument and a gate that demonstrates
      its own sensitivity; B-3, B-4 and B-5 remove both legs. This is
      repair-before-run, NOT discard: declining to run a cheap measurement
      because the target looks mined would itself be the premature-closure
      failure mode.
    - >-
      B-11. Closure audit of the five claimed closures: three meet the section-4
      standard as verified derivations (determinant of the 4x4 column matrix;
      GF(2)-rank of the 255x128 difference matrix, by pure counting; GF(2^4)
      subfield trails, with two real and independent obstructions). One (the
      AES-128 key-schedule bijectivity argument) is a genuine derivation at the
      counting level but phrased more firmly than it supports — absence of
      counting redundancy does not exclude an invariant that eases an attack's
      system of equations — and its scoping (AES-192/256 open, related-key out
      of scope) is honest. One (the AGL column-local closure) does not hold, per
      B-3 and B-4. Two further items are self-labelled rediscovery rather than
      closure, correctly.
    - >-
      B-12. What GATE-601-B could still establish, self-containedly and
      independently of the unverifiable baseline: correctness equivalence of the
      WHT reorganization and partial sums on a small-scale cipher (exact
      algebra); S-box independence of the counted operation ratio via its
      random-bijection null control (a genuinely sharp control for a cost-term
      claim, and the strongest single element in the package); and a measured
      ratio on a fully enumerable 2^16 guess space against a re-implemented
      baseline. Its full-scale form needs a 2^32-entry (4 GB) accumulator and is
      correctly declared NOT to fit the envelope.

    # ---- (C) COORDINATOR-SIDE CORROBORATION (distinct from validation) ---
    - >-
      C-1. Coordinator-side recomputation, performed in the dispatching session
      and recorded as CORROBORATION ONLY — it is NOT a second independent
      validation, since it shares this session's lineage: the multiplicative
      order of the AES MixColumns matrix in GL(4,GF(2^8)) is exactly 4
      (confirming B-3), and Inv(lambda*v) = lambda^-1 * Inv(v) holds on
      4000/4000 collinear pairs (confirming B-4, and confirming that the ideation
      report contradicts its own second enumerated closure). Two of the batch's
      three decisive mathematical findings were thus reproduced by a second
      session.

    # ---- (D) PROVENANCE DEFECT ------------------------------------------
    - >-
      D-1. Referred inference-block defect, confirmed by the validator: the
      TASK-20260731-601 artifacts carry NO inference block — no requested
      policy, no resolved model, no fallback flag, no model_verified status —
      while TASK-20260731-602 attests its own. The Coordinator recorded
      resolved_model_id: unrecorded and fallback_used: presumed_true_unattested
      in inference-amendment-TASK-20260731-602.yaml rather than filling it in by
      inference (AGENTS.md rule 9). Severity: bookkeeping; it does not affect the
      admissibility of a zero-compute package every substantive claim of which
      was checked by recomputation. It WOULD block a goal-closure quorum: an
      'unrecorded' value cannot be one of three pairwise-distinct
      resolved_model_id values, and neither producer identifier is
      probe-verified (model_verified: false for both; doctor --probe was not run
      in any session of this batch).

  # =====================================================================
  inference: >-
    Two separate findings, deliberately not merged. (A) The campaign's
    reproducibility floor is REAL and admissible as infrastructure: full-round
    AES-128/192/256 is pinned by three independent implementations under the
    validator's own seeds, backend independence is verified by construction,
    the reduced-round convention is documented and matches the code against an
    independently authored implementation of that documentation, determinism
    reproduces bit-for-bit, and the receipt is faithful to what the code
    computes. That is a REPRODUCIBILITY FACT and nothing more — it supports no
    claim about AES and authorizes no promotion. Its principal limitation is
    that the reduced-round path is externally unreferenced and unreferenceable,
    so the convention is a definitional choice and the H-3 detection-power
    coverage gap sits on exactly the path this campaign will use. (B) The
    ideation package is honest, well-formed and correctly non-novel-claiming,
    but the mathematics under its flagship candidate does not survive
    recomputation: the AGL transitivity premise is not satisfied by AES (I-4),
    step (iv) is false and self-contradictory within the report (I-2), and the
    gate's positive control cannot distinguish AES from its own null (I-3). The
    correct disposition is repair-and-resubmit, not discard — the package's
    residual open question (cross-column, super-box-level objects where
    ShiftRows sits on the outside) is untouched by any defect and is the most
    valuable thing it produced.

  boundaries:
    - >-
      NO cryptanalytic result and NO claim about AES of any kind, at any round
      count, is asserted by this record. No distinguisher, no key recovery, no
      speedup, no structural excess, and no barrier statement about AES.
    - >-
      Nothing here concerns full-round AES (10/12/14 rounds), AES-NI-deployed
      AES, or the security of any system that uses AES. Claim tier is toy /
      reduced-round, as ceilinged by RQ-AES-001 and GOAL-AES-001.
    - >-
      Group A is scoped to: aes_reduced.py as committed in 0185c0ff, AES-128/192/256,
      ECB single- and multi-block, encryption and decryption, full-round known-answer
      and randomized differential comparison against pycryptodome 3.23.0 and
      OpenSSL 3.0.13, r = 0..Nr under both final_mix_columns variants, on
      Python 3.11.15, Linux 6.18.5, 4 cores. It says nothing about performance
      at cryptanalytic volume: the instrument is pure Python at ~0.69 ms/block
      and is built for correctness, not speed.
    - >-
      Group B is scoped to the two candidates and the enumerated closures
      actually written in candidate_report.yaml. Neither gate (GATE-601-A,
      GATE-601-B) was run by anyone. The validator's R_j recomputations used
      small samples (20-40 delta-set structures), sufficient to settle the
      saturated r=1 and r=2 values and the A3 question exactly, but NOT
      sufficient to measure the r >= 3 rate to the gate's stated precision;
      r >= 3 observations are reported as consistent-with-null at that sample
      size, not as a measurement of the null.
    - >-
      Every literature comparison anywhere in this batch — producer's and
      validator's alike, including the FIPS-197 Appendix C recollection and the
      recalled 2^44 partial-sums baseline — is UNVERIFIED-FROM-MEMORY.
      eprint.iacr.org, csrc.nist.gov, arxiv.org, faest.info and ietf.org are
      unreachable under the campaign network policy and zero primary sources
      were read. Two agreeing recollections are not a citation.
    - >-
      Cross-model independence is UNAVAILABLE anywhere in BATCH-001. Per
      inference-amendment-TASK-20260731-602.yaml, the harness structurally
      resolves every subagent to the inherited model, so the validator's
      agreement is independent in SESSION but not in MODEL. The observation
      C-1 corroboration is weaker still, sharing the dispatching session's
      lineage. No goal-closure attestation may cite a model resolved under that
      amendment.
    - >-
      Group A's mutation-control detection power is scoped to the full-round
      path only (defect H-3). No evidence exists that the harness would detect a
      round-structure bug that is invisible at r = Nr.

  unresolved_confounds:
    - >-
      Which reduced-round convention the literature uses is unanswerable in this
      environment and remains open. Every later comparison against a recalled
      number silently assumes convention agreement.
    - >-
      Novelty of both candidates against the external literature is unresolvable
      here; CAND-601-B is a probable rediscovery that cannot be confirmed.
    - >-
      Defect H-1 leaves a narrowed but live false-green path in the mutation
      control (import-time AssertionError unrelated to the fault). Unexercised in
      the archived run; unrepaired.
    - >-
      Whether any cross-column / super-box-level object admits a lossy projection
      surviving more than the one-and-a-half rounds achieved by column-local
      objects is entirely untested — the batch's named residual.
    - >-
      resolved_model_id for TASK-20260731-601 is unrecorded and no model
      identifier in this batch is probe-verified.

  reviewed_by: coordinator
