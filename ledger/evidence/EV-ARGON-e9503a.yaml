  hypothesis_id: null
  hypothesis_id_note: >-
    No hypothesis record exists for this reconciliation by design; it
    consolidates existing PROPOSAL records (IDEA-*), not a tested hypothesis.
  experiment_ids: []
  run_ids: []
  type: proposal_reconciliation
  direction: not_applicable
  direction_note: >-
    Not support/weaken of any tested claim. This record documents a content
    comparison across ten proposal records under one research question,
    performed per DEC-20260809-8732e6's next_action.
  strength: preliminary
  claim_tier: proposal
  certificate_refs: []
  proof_status: not_applicable
  proof_refs:
    - coordination/goals/GOAL-ARGON-001/batches/BATCH-0c7f2f/tasks/TASK-20260810-7e0990/reconciliation.md
    - coordination/goals/GOAL-ARGON-001/batches/BATCH-0c7f2f/tasks/TASK-20260810-7e0990/receipt.yaml
    - ledger/proposals/IDEA-20260809-a915ea.yaml

  observations:
    - >-
      TASK-20260810-7e0990 (coordinator) read all nine pre-existing
      RQ-ARGON-141710 proposals in full, plus TASK-20260809-4e04eb's proposal
      and both its independent reviews, and produced explicit content-grounded
      verdicts: TASK-20260809-4e04eb's proposal SUPERSEDES IDEA-20260809-a915ea
      content-wise (same tracked object -- the Argon2 per-lane memory-access
      DAG topology and its depth-reducing-set size -- same directional claim
      made specific and falsifiable, a915ea's own fields disclosing it as an
      unworked sketch with no null-object control, no quantitative metric, and
      no read primary source; a915ea's second observable is subsumed as
      methodology rather than dropped; TASK-20260809-4e04eb's proposal carries
      independent RFC-9106 corroboration a915ea lacks).
    - >-
      TASK-20260809-4e04eb's proposal STANDS ALONE against IDEA-20260809-ac5947
      (distinct question: measured attack cost vs. measured graph structure),
      with a narrow reference-currency note -- ac5947's mechanism field names
      a915ea's graph object by name; that reference should point at the
      surviving formalization going forward, not a content change to ac5947's
      own hypothesis.
    - >-
      IDEA-20260809-bcf891's calibration-precondition status (a stronger,
      independent-known-family control against known-depth-robust and
      known-shallow reference graphs) transfers unchanged onto
      TASK-20260809-4e04eb's proposal, confirming rather than revising
      DEC-20260809-8732e6's existing next_action on this point.
    - >-
      The remaining seven proposals (ac98b5, b17238, b9e9cc, bcf891, bf5139,
      c059a7, c13b8b) were read in full and found not to overlap the
      graph-structure-and-null-comparison content under reconciliation, except
      IDEA-20260809-b9e9cc, which carries the same reference-currency note as
      ac5947 (its single-lane anchor control cites a915ea by name).
    - >-
      IDEA-20260809-a915ea's dominated_by field was corrected: it had asserted
      "no memory-hard-function records exist in the corpus," which is false --
      knowledge/INDEX.md contains eight matching records, independently
      confirmed by both TASK-20260809-4e04eb's own dedup pass and the
      TASK-20260809-28c68e Validator (see EV-ARGON-209ece). The directly
      adjacent novelty_screen field, sharing the same false-premise root
      cause, was corrected for internal consistency. No other field of
      a915ea.yaml was touched.

  inference: >-
    Ten proposal records under RQ-ARGON-141710 now have an explicit,
    content-grounded relationship to each other rather than existing as
    unreconciled parallel sketches. TASK-20260809-4e04eb's proposal is the
    surviving formalization for the goal's graph-structure-first work; a915ea
    remains on record (not deleted, not status-changed) as the sketch it
    supersedes content-wise. No claim about Argon2's security, any parameter
    set's safety, or any attack's cost is made anywhere in this record or its
    sources.

  boundaries:
    - >-
      This reconciliation performs no ledger status transition on any
      proposal record; TASK-20260810-7e0990's write scope authorized only a
      correction to a915ea's dominated_by/novelty_screen fields, not its
      status field. A formal superseded/refined status transition, if this
      program's proposal schema supports one, remains an open item.
    - >-
      RFC 9106 remains unfiled as a formal KN-LIT primary source; this
      reconciliation restates, but does not itself discharge, DEC-20260809-
      8732e6's next action to acquire and file it via raw HTTP fetch.
    - No experiment ran; no measurement of any kind exists as a result of this record.

  unresolved_confounds:
    - >-
      Whether IDEA-20260809-bcf891's independent-known-family calibration
      should fully replace, or merely supplement, TASK-20260809-4e04eb's
      proposal's self-referential small-q cross-check (proposal.md Sec.6 step
      6) is not decided here -- only that bcf891's precondition status
      applies.
    - >-
      The Red Team's "null-vs-theory gap" (whether a window-truncated uniform
      null is the comparison the unread depth-robust-graph literature itself
      makes) remains open and unresolved by this reconciliation.

  reviewed_by: []
  reviewed_by_note: >-
    This reconciliation task was not independently reviewed by a fresh
    validator/red-team session, consistent with the precedent this branch
    observed in a concurrent session's own goal-head reconciliation work
    (RECON-20260810-002, TASK-20260810-e45e48): a coordinator content
    reconciliation of existing records is a coordination act, not a new
    research claim, and AGENTS.md's independent-review requirement binds
    claim-relevant producer results, not administrative record consolidation.
