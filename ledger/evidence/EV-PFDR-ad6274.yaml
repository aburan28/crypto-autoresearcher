  # ---------------------------------------------------------------------------
  claim_boundaries:
    curve_family_and_field: 'generate_prime_order_curve(bits, c, p_filter=subgroup_prime_filter([3,4,5], 0.15)), prime fields, fresh seeds c = 10 .. 10+n-1 per (panel, m, rung) (CR-054, CR-201)'
    bit_sizes: 20..32 step 2 (table and search panels); FAM-1 decision band 30 and 32 pooled; CARRY-1 28; PC-1 20 and 24
    instance_generation: per design.json final n; G-CURVE checked every instance's (p, a, b, N, P) against design.json, 83,510 rows, re-checked by the validator's own comparator (CR-208)
    solver_and_version: crypto_autoresearcher.index_calculus mitm engine at the EXP-PFDR-011cd0 build (code commit 38be58dad, dirty false), default table arity (m+1)//2, min_fill; analysis by the pinned A-3 copy (CR-057, CR-185)
    parameter_range: m = 3, 4, 5; classes TT and SS at m = 3, 4, 5 and TB at m = 3 in FAM-1; TT and TB over the full table; SS among the first X_fix = 20*isqrt(N) formally distinct encodings
    seeds_and_instances: 'per (panel, m) and rung: table m3 300, m4 2000, m5 400; search m3 32, m4 144, m5 32 curves (CR-073); CARRY-1 100 fresh curves at 28 bits (CR-202); three matched random bases per structured arm per curve plus one known-null base per family'
    controls_and_baselines: matched random bases (kappa_rel = 1 by definition); known-null arms (PC-NULL); planted_sub at m 3 (PC-R); known_log (PC-1); all pass (OBS-7)
    resource_limits: machine protection per the hypothesis test boundary (4 workers, 3.5e9-byte per-process address-space cap, 14 GB; CR-184); every R12-R16 location completed_valid (DEC-20261002-1ebedd)
    scale_relevance:
      label: toy-scale
      justification: direct computation at log2 p <= 32; no correspondence or embedding to larger N; no transfer asserted
    transfer_and_extrapolation_assumptions:
      - "TA-1 (design only): the SS m 4 P0 inputs were estimated at 22-24 bits and assumed to transfer to 30-32 bits. Every SS m 4 power or X_rel statement here carries [SS m 4 P0 inputs estimated at 22-24 bits; TA-1 assumed, not verified by P0]. The decision does not rest on TA-1: the SS m 4 cells are read only through their achieved X_rel at the realised n (DEC-20261002-1ebedd O-C3; CR-190), and TA-1 was found to have failed conservatively (CR-090)."
      - "Band pooling: the FAM-1 statistic pools 30 and 32 bits, so each bound is a statement about the pooled ratio; a kappa_rel that differs between the two rungs (as small_x TT4 suggests) is averaged, not resolved."
      - "No extrapolation in N: nothing is claimed for N above 32 bits or for growth of kappa_rel with N (INF-6)."
      - "No transfer to other bases, other families, other arities, other engines, TS or search-vs-base coincidences, or TB at m = 4, 5."
      - "U-to-engine: the lemmas' uniform model transfers to the engine's random bases only through HEUR-2765d2-H4 (not refuted here) with the derived -2/s first-moment bias (CR-085)."
    largest_claim_justified: >-
      On generated prime-order curves at 30-32 bits with this mitm engine
      (default arity, min_fill), for the subgroup, small_x and dickson bases
      against matched random bases, a relation-level structural excess of
      kappa_rel >= 1.15 (TT, SS) or >= 1.5 (TB m 3) is excluded by a
      conservative one-sided bound in 20 of the 21 FAM-1 cells (all except
      small_x TT4), with achieved detection limits X_rel 1.02 (TT3), 1.11
      (TT4), 1.05 (TT5), 1.03 (SS3), 1.03 (SS4) [SS m 4 P0 inputs estimated
      at 22-24 bits; TA-1 assumed, not verified by P0], 1.05 (SS5) and 1.27
      (TB3). For small_x TT4 no excess crossed the family-wise threshold, but
      an excess up to its one-sided upper bound 1.1711 (above the 1.15
      target) is not excluded (CR-151). CARRY-1 excludes the EXP-PFDR-1b78f7
      discovery value on fresh curves. No heuristic of H-PFDR-2765d2 is
      refuted at this scale. Single unreplicated run set; empirical only.
  boundaries:
    - "Negative-result semantics: no relation-level structural excess meeting the calibrated threshold was observed over the tested arms, cells, bit sizes, engine and curves. This does not show that no structure exists, that other bases, classes, m or sizes behave alike, that kappa_rel does not grow with N, or that no other algorithm can exploit the mechanism."
    - Lead 2 of IDEA-20260928-4e2be7 is NOT closed by this record. It is weakened at 30-32 bits on 20 cells; small_x TT4 is open; growth with N is untested.
    - Only TT, TB and SS are harvested; search-vs-base coincidences and order-suppressed table-vs-search matches are not tested (hypothesis interpretation_limits).
    - TB at m = 4 and 5 is outside the family (screened only).
    - An informative but solve-useless homogeneous excess would read as kappa_rel > 1 with rank (proof_search_map remaining collision); not exercised, since nothing was detected.
    - Nothing here is floor-relative; the TW-FLOOR round (DEC-20261001-709f0d) is unaffected.
  unresolved_confounds:
    - "small_x TT4 rung heterogeneity (30 bits kappa 1.017, 32 bits 1.178). Chance cannot be separated from a size- or curve-set-dependent effect with two rungs (OBS-4)."
    - Per-rung tail count borderline (3 of 147, P 0.035; two at TT4) under the calibrated generator (OBS-9); not decision-bearing by CC-10, but it points at the same TT4 class.
    - PC-NULL's low power against arm over-dispersion; the gap is closed here only by review-time direct estimates and a permutation null, not by the frozen control (OBS-6, OBS-7).
    - Interval labelling (about 97.5% for "95%"); conservative, so no bound is optimistic, but any power or replication sizing must use the simulated coverage.
    - Seeds of instances whose bases were not written are verified only indirectly (validator limitation).
    - The pinned harness's CR-4 H9 text blind spot (F-6), unreachable on the archived logs, remains in the specification text for any reuse.

  # ---------------------------------------------------------------------------
  obstruction:
    statement: >-
      On generated prime-order curves at 30-32 bits and this mitm engine, the
      x-structured bases subgroup, small_x and dickson supply distinct
      nonformal relations at the matched-random rate within a conservative
      per-cell bound: their relation-level excess kappa_rel is bounded below
      the lever's target (1.15 TT/SS, 1.5 TB3) in 20 of 21 declared cells. This
      blocks reading these bases, at these sizes, as a relation source with a
      target-size constant excess; it is a measured property of the bases'
      relation supply, not of the attempt. It does not block growth with N
      (not measured), small_x TT4 (not bounded below target), or any other
      base, class or engine.
    quantity: >-
      Per FAM-1 cell, the one-sided upper bound on kappa_rel (structured over
      matched-random mean of distinct nonformal monic relations, CC-1 to
      CC-10), and the achieved detection limit X_rel (smallest kappa with P(z >
      t*) >= 0.5 at the realised n); both dimensionless ratios.
    value: >-
      Upper bounds (field upper95_one_sided; simulated one-sided coverage
      0.961-0.980, so conservative; CR-097): TT3 1.0074-1.0112; TT4 subgroup
      1.0633, dickson 1.0886 (small_x 1.1711, NOT below target, excluded from
      the block); TT5 1.0314-1.0519; SS3 1.0280-1.0343; SS4 0.9985-1.0166 [SS m
      4 P0 inputs estimated at 22-24 bits; TA-1 assumed, not verified by P0];
      SS5 1.0040-1.0257; TB3 1.0986-1.2456 (ranges over the three arms;
      CR-147 to CR-167). X_rel at grid resolution 0.01, reproduced
      independently within +0.01 (CR-115, CR-097): TT3 1.02, TT4 1.11, TT5
      1.05, SS3 1.03, SS4 1.03 [SS m 4 P0 inputs estimated at 22-24 bits; TA-1
      assumed, not verified by P0], SS5 1.05, TB3 1.27.
    measured_by:
      - RUN-PFDR-011cd0-table
      - RUN-PFDR-011cd0-search
      - RUN-PFDR-011cd0-calibrate
      - RUN-PFDR-011cd0-analysis
      - EXP-PFDR-011cd0
    measured_by_note: >-
      Read from R16 analysis.json (A_INT) and cells.jsonl as tabulated in the
      red team's cell-statements.json, re-derived blind from rows by the
      validator (297/297) and reproduced by the red team's own A-INT. No new
      run.
    scope: >-
      FAM-1 cells (subgroup, small_x, dickson) x {TT3, TT4, TT5, SS3, SS4,
      SS5, TB3} at 30 and 32 bits pooled, minus small_x TT4; curves c = 10 ..
      10+n-1 at the design's final n; this engine (mitm, default arity
      (m+1)//2, min_fill); TT and TB over the full table, SS at X_fix =
      20*isqrt(N). Claimed nowhere else; in particular not for N above 32 bits,
      for the growth exponent delta, for other bases or for other engines.
    resource_check:
      examined: true
      reading: >-
        Read the other way round, the bound says that three x-defined bases
        whose membership is testable cheaply (a coset of a multiplicative
        subgroup, a Dickson image, the s smallest x) show no measurable
        difference in relation supply from uniformly random bases of the same
        size at 30-32 bits, within each cell's two-sided interval (field ci95
        of cell-statements.json; widest for TB3). A theory that takes this as its hypothesis is one that
        wants a structured, canonical or cheaply verifiable factor base to
        behave like a random one, for example deterministic base selection,
        a base whose membership test is a constant-time arithmetic predicate,
        or an H4-type random-base assumption made for a structured base. Its
        best case is a constant-factor saving in membership testing or
        reproducibility; it cannot move an exponent, so it is not ranked as an
        exponent lever. No current record takes it up; none was spawned. The
        bound is also the calibrated sensitivity any later structured-base
        census must beat, which is a design input for the successor
        (TASK-20261002-33047e), not a theory.
      spawned_ids: []

