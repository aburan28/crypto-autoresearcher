          independently by both reviewers (CR-064, CR-094). PC-1 passes; the
          raw TT+TB known_log ratio over random_sub is 18996.91 with nonformal
          0 on every instance (CR-132, CR-200). The planted arm sits far above
          the targets, so PC-R and PC-1 demonstrate dynamic range, not
          sensitivity at the target (CR-088).
        refs: [CR-146, CR-088, CR-093, CR-131, CR-064, CR-094, CR-132, CR-200]
      - id: OBS-8
        text: >-
          Proves-too-much (red team). PTM-1: random arms read as structured,
          42 band pseudo-cells, 0 above t* (CR-113). PTM-2: under a real-data
          permutation null of the four null arms per curve, the family-wise
          rate at the producer's t* is 0.0275 against the generator's 0.0338
          (CR-114). PTM-3: under real noise the detectable X equals the
          producer's X_rel in all 14 family-(class, m) cells (CR-115);
          conditional on the observed data, detection at X_rel is below 0.5
          in 6 cells, all with low observed z, so X_rel is a design
          sensitivity, not a realised bound (CR-116, CR-117).
        refs: [CR-113, CR-114, CR-115, CR-116, CR-117]
      - id: OBS-9
        text: >-
          Per-rung tails (not decision-bearing under CC-10). Three of 147 FAM-1
          per-rung cells have |z| > t*: small_x TT4 32, dickson TT4 24, small_x
          SS5 20, all positive (CR-134); expected 0.6918 under the calibrated
          generator, P(count >= 3) = 0.03535; combined with the known-null
          comparator P = 0.03285 (CR-169, CR-105).
        refs: [CR-134, CR-169, CR-105]
      - id: OBS-10
        text: >-
          O-HEUR readings (frozen conditions, random arms, 30-32 bits). No 99%
          interval lies entirely outside its prediction band for H1a (7 (class,
          m)), H1b (7) or H1c (4); no H1c randomized-PIT KS rejects at 1%; no H5
          interval has lower end above 4 (CR-140 to CR-143). H1a TT3 ratio
          0.9975964944679478; H1a TB3 interval [0.9402315188965109,
          1.1145264475928545] straddles 1.10 (CR-145). H5 SS4 dispersion
          1.3237012099500771 [SS m 4 P0 inputs estimated at 22-24 bits; TA-1
          assumed, not verified by P0] (CR-144). Red team J8 recomputes every
          reading with its own code: none of H1a, H1b, H1c, H3, H4, H5 is
          refuted; three intervals straddle their bands; H3 is not evaluable
          for TT4 and TB3 on any random arm; the KS family's chance of at least
          one rejection under all-true heuristics is about 0.03 (CR-108 to
          CR-111).
        refs: [CR-140, CR-141, CR-142, CR-143, CR-144, CR-145, CR-108, CR-109, CR-110, CR-111]
      - id: OBS-11
        text: >-
          Lemmas (red team J2). L1 is correct as stated within the uniform
          model U for N prime and applies to the engine's TT and TB stored sets
          (CR-084); its moments transfer to the engine's distinct-x base only up
          to O(1/s), a derived pair first-moment bias of about -2/s consistent
          with H1a TT3 0.9976 (CR-085, CR-087). L2 holds for generic
          relations; L3 stays a sketch with no proof and no counterexample, not
          relied on by the design (CR-086).
        refs: [CR-084, CR-085, CR-086, CR-087]
      - id: OBS-12
        text: >-
          SS m 4 power transfer [SS m 4 P0 inputs estimated at 22-24 bits;
          TA-1 assumed, not verified by P0]. P0 predicted X_rel 1.15 and power
          0.564 at 1.15 after raising search m 4 to 144 curves per rung
          (CR-098, CR-073); the realised X_rel is 1.03 for all three arms
          (CR-099). TA-1 failed in the conservative direction: P0's SS m 4
          dispersion input was estimated at scope A_fix, not X_fix (CR-090).
        refs: [CR-098, CR-073, CR-099, CR-090]
    comparison:
      - id: CMP-1
        text: >-
          Against the calibrated family null: 0 FAM-1 cells above t* is the
          modal null outcome; the family maximum's calibrated p 0.08216 is not
          an excursion of the family-wise rule (CR-129). On known-false
          objects the same procedure excurses at or below the calibrated rate
          (OBS-8), so the non-detection is not an artefact of an insensitive
          rule, and under real noise it detects a planted excess at the
          producer's X_rel (CR-115).
      - id: CMP-2
        text: >-
          Against EV-PFDR-1faf10 (pair units, EXP-PFDR-1b78f7): its detection
          limits at 30-32 bits were TT3 1.5, TT4 not detectable at <= 5, TT5
          2.0, SS3 1.25, SS4 1.25, SS5 2.0 in pair units on the weakest arm, TB
          not covered (the design's own comparison, CR-203). Here, in
          relation units, X_rel is TT3 1.02, TT4 1.11, TT5 1.05, SS3 1.03, SS4
          1.03 [SS m 4 P0 inputs estimated at 22-24 bits; TA-1 assumed, not
          verified by P0], SS5 1.05, TB3 1.27 (OBS-2). The units differ, so
          this is a comparison of sensitivity regimes, not of numbers on one
          scale.
      - id: CMP-3
        text: >-
          Against the Coordinator's pre-recorded prior (plan coordinator_prior;
          exposure PD-1). Met: J1, J3, J5, J7 holds; J2 holds with the stored
          set independent of L; t* and X_rel reproduced; PC passes recomputed;
          no FAM-1 heuristic refuted; proves-too-much at the calibrated rate;
          no defect changing an outcome id (prior 0.1). Overturned: the
          expected break at structured-arm over-dispersion (prior 0.2) did
          not occur; the expected SS m 4 target miss (prior 0.4) did not occur
          because TA-1 erred conservatively [SS m 4 P0 inputs estimated at
          22-24 bits; TA-1 assumed, not verified by P0]; the harness H9/H8
          conjunction gives a false FAIL, not a false PASS (CR-206). Reshaped: "at
          least one cell misses its target (prior 0.5)" -- none misses by
          X_rel, but small_x TT4 is not bounded below its target, a form the
          prior did not name; the per-rung tail count is borderline (P 0.035)
          rather than comfortably consistent (prior 0.85). Unanticipated: the
          about-97.5% intervals, PC-NULL's blindness to dispersion, the -2/s
          U-to-engine bias, and F-7. Concurrence is discounted by PD-1 (the
          prior was written after reading the outcome summary) (CR-045, CR-046,
          CR-209 to CR-211).
    inference:
      - id: INF-1
        text: >-
          On 20 of the 21 FAM-1 cells, a relation-level structural excess at or
          above the target (1.15 for TT and SS, 1.5 for TB3) is excluded at 30-32
          bits by the cell's one-sided upper bound, with the achieved X_rel also
          at or below target: subgroup, small_x and dickson at TT3, TT5, SS3,
          SS4 [SS m 4 P0 inputs estimated at 22-24 bits; TA-1 assumed, not
          verified by P0], SS5 and TB3; subgroup and dickson at TT4. The
          bounds are conservative (OBS-6). This is the weakening of the
          structural branch that the frozen next_decision admits (CR-176), on
          a narrower cell set than its "X_rel <= target" shortcut would give
          (CR-177).
      - id: INF-2
        text: >-
          small_x TT4 is a non-detection at the family level whose data do NOT
          exclude a TT relation excess of the target size (upper bound
          1.1711 > 1.15, signed 1.1587 > 1.15). Its excess is concentrated in
          one rung (32 bits) and is diffuse over curves, as for null arms;
          chance (a per-cell p of 0.004 is expected somewhere in a 21-cell
          family; family-wise p 0.082) and a small_x-specific excess are both
          compatible with the data. The evidence cannot discriminate them:
          for this cell the reading is INCONCLUSIVE at the target level and
          the cell is scoped out of the weaken until a confirmatory
          replication (DEC-20261002-c3f49b NA-3).
      - id: INF-3
        text: >-
          dickson SS4 [SS m 4 P0 inputs estimated at 22-24 bits; TA-1 assumed,
          not verified by P0] is a lower-tail null realisation; its upper
          bound excludes the target, and it is read as "no excess detected",
          never as evidence that kappa_rel < 1.
      - id: INF-4
        text: >-
          Bounds are read from each cell's upper bound, never from X_rel
          (OBS-8): X_rel is the design sensitivity at the realised n, and in
          cells with low observed z the realised data could not have detected
          an excess of size X_rel.
      - id: INF-5
        text: >-
          The heuristic validation evidence (promotion gate 2, partial): at
          30-32 bits on this engine's random arms, HEUR-2765d2-H1a, H1b, H1c,
          H4 and H5 are not refuted; H3 is not refuted where evaluable (TT3,
          TT5, SS3, SS4, SS5) and is untested for TT4 and TB3; "not refuted" is
          not "established within the band" for H1a TB3 and H1b SS3, SS5. H4's
          "distributed as the calibrated null" rests mainly on the direct
          dispersion estimates and the permutation null, not on PC-NULL alone
          (OBS-6, OBS-7). HEUR-2765d2-H2 (the structural null) is not refuted;
          a non-detection bounds it per cell and does not confirm it.
      - id: INF-6
        text: >-
          Nothing here measures growth with N. The lever needs kappa_rel ~
          N^delta; a two-rung band (30, 32 bits) cannot estimate delta, so the
          weakening is a statement about the constant at 30-32 bits on these
          cells, not about delta or about larger N.
    limitation:
      - Toy scale; FAM-1 at 30 and 32 bits pooled; generated prime-order curves c >= 10 under subgroup_prime_filter([3,4,5], 0.15); one mitm engine (default arity (m+1)//2, min_fill) at the EXP-PFDR-011cd0 build; m = 3, 4, 5; arms subgroup, small_x, dickson against matched random triples (CR-185, CR-201). No deployed-curve implication, universal impossibility, exponent below rho's, or floor-relative reading (TW-SCOPE).
      - One run set, one producer session, one engine; no independent replication. The review re-derived and recomputed but ran no new census.
      - The review-time computations (dispersion estimates, permutation null, PTM, coverage simulations, replication sizing) are one red team's simulations; they bound interpretation and change no frozen reading or success criterion.
      - J3's blind agreement cannot detect a misreading of the frozen text that the validator and the producer share; the two alternatives measured (TB-B unit, orientation) do not matter (CR-062).
      - J5's attribution is bound-based, not an exact replay of the pre-fix counter (CR-068).
      - "Same-model review: session independence of producer, both reviewers and this Coordinator is attested; model independence is not claimed."
      - The knowledge index was not available to either reviewer or to this Coordinator; no fact is called known on its authority (CR-079, CR-124).

