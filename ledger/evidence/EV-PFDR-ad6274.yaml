      HEUR-2765d2-H1b: not refuted (7 of 7); SS3 and SS5 intervals straddle 0.8 (CR-141, CR-110)
      HEUR-2765d2-H1c: not refuted (dispersion 4 of 4; PIT KS 4 of 4 non-rejecting; the KS is conservative, size 0-0.4% at nominal 1% per the red team) (CR-142, CR-111, CR-207)
      HEUR-2765d2-H2: not refuted; bounded per cell (OBS-2); no rate statement
      HEUR-2765d2-H3: not refuted where evaluable (TT3, TT5, SS3, SS4, SS5); NOT EVALUABLE for TT4 and TB3 (CR-109)
      HEUR-2765d2-H4: not refuted (PC-NULL pass; H1c TT/TB clause holds); PC-NULL leg nearly blind to over-dispersion (CR-146, CR-088)
      HEUR-2765d2-H5: not refuted (3 of 3); SS4 dispersion 1.3237 [SS m 4 P0 inputs estimated at 22-24 bits; TA-1 assumed, not verified by P0] (CR-143, CR-144)
