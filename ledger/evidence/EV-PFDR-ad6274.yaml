  type: empirical
  direction: weakens
  direction_scope: >-
    Read against the STRUCTURAL BRANCH of H-PFDR-2765d2: the non-null
    alternative that an x-structured base (subgroup, small_x, dickson) yields
    a non-generic excess of distinct relations, kappa_rel > 1, which is the
    exponent-targeting lever of the hypothesis's asymptotic_claim
    (conditional on kappa_rel ~ N^delta). The record's own falsification
    condition says O-NULL-BOUNDED "weakens it for cells whose X_rel meets the
    target" (CR-180). After review the weakening is scoped to the 20 FAM-1
    cells whose achieved X_rel AND one-sided upper bound are at or below
    target; it does NOT cover small_x TT4, whose upper bound exceeds its
    target (J6; CR-101, CR-151, CR-170). The same data are CONSISTENT WITH,
    and within the detection limits support, the record's null statement
    (B-rel) and its predictions P4 (no FAM-1 cell above t*), P6 (PC-NULL), P7
    (planted arm detected and recovered) and P8 (CARRY-1 null); and no
    heuristic HEUR-2765d2-H1a, H1b, H1c, H3, H4, H5 is refuted at the tested
    scale. "weakens" is the net direction for the lever; it is not a
    statement that the mechanism is impossible, and it covers no N outside
    30-32 bits.
  strength: preliminary
  strength_basis: >-
    A valid, pre-registered experiment with large per-cell n (600 to 4000
    table curves, 64 to 288 search curves pooled over 30 and 32 bits; CR-073),
    in-design known-null, planted and known_log controls, archived rows, and
    an independent review that re-derived every deterministic cell value
    blind (297/297 exact; CR-059) and reproduced the calibration with its own
    generator and seeds (CR-091, CR-092). It is not "replicated": one producer
    session, one engine, one run set; no independent replication exists. It
    is not "strong": the scale is toy (two bit rungs in the decision band),
    the controls' discriminating power is narrower than their passes suggest
    (PC-NULL is nearly blind to arm over-dispersion; PC-R (i) and PC-1
    demonstrate dynamic range, not sensitivity at the target; CR-088), and
    one cell (small_x TT4) is not bounded below its target.
  claim_tier: toy
  claim_tier_basis: max log2 p = 32 (table and search panels 20..32 bits; FAM-1 at 30-32; CARRY-1 at 28; PC-1 at 20 and 24) -- docs/claims-and-verification.md mechanical rule (toy = max field bit size <= 32)

