  observations:
    - "chi(6) = 45 = C(2^{6-3}+2, 2) CONFIRMED EXACTLY on the mechanism bond of the chi law (root of the left-comb recursion, {x1,x2}|{x3,x4,x5,x6}, d = 16): rank <= 45 by the Sylvester-multiset construction (45 rank-1 terms, extraction self-checked), and rank = 45 certified by full-rank factor matrices (rank(CM) = rank(HM) = 45) plus an exhibited rank-45 evaluation minor in every one of 9 cells (p in {101,431,1009} x 3 seeds). Identical in all cells (field-size independence, beta = 0 continuation)."
    - "m=6 is the first size where the two readings of the chi law diverge. On the growth-family balanced split {x1,x2,x3}|{x4,x5,x6} (4913x4913), the face-value prediction 45 does NOT hold: measured rank 68 in all 9 cells (exact lower-bound minor rank(E) = 68; form rank rank(W_A S W_B^T) = 68 at two independent point samples per cell). The naive balanced-multiset count C(8,4) = 70 also fails: the Sylvester sign matrix S has full rank 70 (over QQ and mod all three primes), but the S_4 X-coefficient polynomials carry ONE universal degree-4 syzygy (factor spans 69/70, identical witness across independent samples and across A/B sides in every cell) and the restricted form drops one further dimension (70 -> 69 -> 68)."
    - "Symmetry/context bonds: grandchild {x1..x4}|{x5,x6} = 45 (= root value; consistent with full Semaev symmetry of the recursion-built formal S_6, also C1 comb == balanced at 2048 points per cell); single-variable {x1}|rest = 17 (full)."
    - "Growth-slope arithmetic on the mechanism family (chi = 3, 6, 15, 45 at d = 2, 4, 8, 16): 4-point least-squares slope of log2 chi vs log2 d = 1.3043 (up from 1.1610 on the m <= 5 window, EV-TTN-001); two-point m=5->m=6 root slope log2(45/15) = 1.5850. Trend toward the asymptotic exponent 2 (disproof region) continues; in-window fit, not an asymptotic statement."
    - "Controls all pass 9/9 cells: P1 S3 baseline 20/20 per curve; P2 coefficient paths == direct dets and == symbolic formal S4/S5 (term counts 439 / 54377-54777, matching EV-TTN-001); C1 comb == balanced (0 mismatches in 9 x 2048 points; verifies the recursion-associativity identity used for the child upper bound) and comb == fully-nested sage resultants padded to formal degree (9 x 64/64, including degree-drop points); C2 extraction == plain GE dets; C3 rank(E) == rank(W_FORM_W) both bonds every cell; P3 prefix-CUR exact at full rank; N1 random matrices rank 96; N2 planted rank-45 recovered."
    - "Dense symbolic S_6 probe (infrastructure context, NOT evidence): S_4 0.009 s / 439 terms, S_5 3.35 s / 54 477 terms (consistent with EV-TTN-001), S_6 resultant censored by 150 s hard subprocess kill (SIGALRM cannot interrupt Singular C-level code). No dense-baseline statement for m = 6."
    - "RUN-TTN-002-a/-b retained as valid_with_defect (control-side defects: int64 overflow in a single-einsum control evaluation at p = 1009; single-level formal-degree padding insufficient at an inner degree-drop point). All measurements identical across -a/-b/-c."
  inference: "The chi(m) = C(2^{m-3}+2, 2) law is confirmed exactly at m = 6 on its mechanism bond family, with a proved structural upper bound and an exact independence certificate; the extrapolation toward asymptotic exponent 2 (the disproof direction for H-TTN-001-style TTN attacks) is unchanged and continues to track. Separately, the balanced 3|3 bond does not follow the law's face value at m = 6 (68, not 45), and exhibits a new universal degree-4 syzygy phenomenon among S_4's coefficient polynomials — recorded as an unexpected structural observation for the theory track. State transition left to the Coordinator."
