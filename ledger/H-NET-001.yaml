hypothesis:
  id: NET-H-001
  question_id: NET-RQ-001
  statement: >
    Re-encoding the ECDLP in the elliptic divisibility net (Shipsey/Stange) yields a
    relation supply (two-parameter Somos identity family) that reduces discrete-log
    recovery below the birthday bound B = rho^(1/2) limiting every generic walk.
  mechanism: >
    Net terms are deterministic algebraic functions of x(kP) (division polynomials);
    Somos quadratic identities are exact two-parameter multiplicative relations among
    net terms; if collisions among FB-index net terms and target-shifted terms arrive
    sub-birthday, index calculus on net exponents beats BSGS at equal op budget.
  assumptions:
    - "ordinary prime-field curves, prime-order subgroup, char >= 5"
    - "exclude singular curves and small embedding degree (pairing channel)"
    - "EDS in division-polynomial normalization"
  predictions:
    - metric: "k-recovery charged exponent trend across sizes"
      direction: lower
      minimum_effect: "< 0.49 (promotion gate, verbatim from candidate B1)"
    - metric: "net-relation rank per field op vs BSGS-equivalent"
      direction: higher
      minimum_effect: ">= 2x (secondary, necessary-not-sufficient, verbatim)"
  test_boundary:
    instances: ["18 seeded instances: p in {101, 431, 1601} x seeds 20260717..20260722"]
    parameters: {B: "ceil(sqrt(n))", n: "largest prime subgroup order >= 37, embedding degree >= 7"}
    implementation: "experiments/EXP-NET-001/net1_somos_sieve.sage (SageMath 10.9)"
    budget: {wall_clock_seconds_per_run: 600, maximum_runs: 8}
  falsification_conditions:
    - "Measured collision statistics equal to random-oracle birthday statistics across sizes (candidate disproof track)."
    - "No k-yielding relation below BSGS budget; charged exponent trend >= 0.49."
  interpretation_limits:
    - "Toy prime fields (p <= 1601); closes only the tested scope; not crypto-scale validation."
    - "Negative result does not address other net parameterizations, rank >= 2 nets as relation source, or the proof-track theorem."
  status: rejected_scoped
  proposed_by: coordinator-research-director
