evidence:
  id: EV-JETB-001
  hypothesis_id: H-JETB-001
  experiment_ids: [EXP-JETB-001]
  run_ids: [RUN-JETB-001-a, RUN-JETB-001-b, RUN-JETB-001-f0]
  type: empirical
  direction: supports
  strength: preliminary
  validity_status: valid
  observations:
    - "P1 screen equivalence: 0 mismatches between tangent-screen and zeroth-order verdicts on 49,362 FB candidate tuples (m2: 4,896; m3: 44,466), 10,201 exhaustive p=101 pairs, and 3,600 uniform random negative pairs, across all 18 instances."
    - "P2 sigma_true = 1.0 and P3 leakage = 0 at all three sizes; P4 sigma_pass/p_m = 1.0 exactly (p=101: 0.04028=0.04028; p=211: 0.01732=0.01732; p=431: 0.005376=0.005376 for m=2; identical equality for m=3)."
    - "P5 eps-solution space = ker grad S with the predicted dimensions at 100% of true relations (dim 1 for m=2 variety, dim 2 for m=3 variety; 0 singular relations observed anywhere)."
    - "P6 formal-group linearity: 0 failures in 1,745 dual-number addition probes (zeroth-order, omega-scalar linearity, swap-invariance); 18/18 true chain relations constructively witnessed over F_p[eps]/eps^2."
    - "P7 (amended): one-step Newton solve hit rate 2/p on non-degenerate fibers (measured 0.02237 vs 0.01980 at p=101; 0.01048 vs 0.009479 at p=211; 0.005348 vs 0.004640 at p=431 — Poisson-consistent) and exactly 1.0 on the x1 = x_R degree-drop fiber (100/100 at both p=101 and p=211)."
    - "Deviation recorded: the FROZEN P7 bound (<= 2/p) is exceeded by pooled sigma_solve (0.0564 at p=101, 0.0519 at p=211) solely due to degree-drop fibers; S_R(x1,z) loses its z^2 term (x_R - x_1)^2 exactly when x1 = x_R, a zeroth-order-observable degeneracy carrying no jet information. Amendment proposed to the Coordinator (analysis.md section 4)."
    - "Controls: positive — S-evaluation == point-arithmetic relation truth on every tuple (0 mismatches; 67/67 constructed relations pass test and screen); negative — 0 leakage including dual-repair tests on random non-relations."
    - "Infrastructure: RUN-JETB-001-f0 failed (implementation bug: 2-torsion division + wrong linearity convention), not evidence; RUN-JETB-001-b valid and superseded; RUN-JETB-001-a valid, deterministic (reproduces -b bit-for-bit on shared fields), 6.46 s wall of 2400 s budget, 3 of 8 runs used."
  inference: "Measured jet-sigma behavior matches the simulable-model prediction exactly on every primary metric at all three toy sizes: the tangent screen is precisely the zeroth-order relation test (sigma_pass = p_m, sigma_true = 1, leakage = 0), its solution space is the Zariski tangent space, and dual-number addition is exactly Lie-linear. No explicit non-simulable operation was observed at any toy size. Under the D1 decision rule (match = barrier evidence), the toy certification lands on the barrier side; the gate's alternative (a proved simulation theorem) remains on the proof track and is untouched by this experiment."
  boundaries:
    - "Toy prime fields p in {101,211,431} (~2^9), x-interval factor bases B <= 30, m in {2,3} Semaev varieties, 6 seeds per size, 18 curve instances; establishes behavior only on the tested toy distribution (rule 7) — no P-256-scale claim."
    - "Consistency evidence for simulability, not a proof; the promotion gate requires the theorem itself or a validated non-simulable operation — neither is delivered by toy data alone."
    - "Tested formalization uses x-only Semaev varieties with free tangent lifts (the A1 screen regime); other jet-augmentation designs (constrained lifts, higher jets order >= 2) are outside the tested scope (rule 6)."
    - "The x1 = x_R degree-drop phenomenon is fully accounted for by zeroth-order structure; it must not be misread as a jet-powered solve."
  unresolved_confounds: ["singular summation-variety points never occurred in the sample, so the singular-fiber eps-dimension branch (dim = number of jet variables) was not exercised empirically"]
  reviewed_by: coordinator
