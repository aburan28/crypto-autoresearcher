coordinator_decision:
  id: DEC-20260716-002
  context: >-
    EXP-REP-002 tested the m=3 leg of H-REP-001. Both models solve at d_reg=2
    (vdim=6, verified). With EXP-REP-001 (m=2) this closes the representation /
    solving-degree question over the tested scope.
  decision: reject_scoped
  target_ids: [H-REP-001]
  rationale:
    - "Model-native d_reg invariant at BOTH m=2 and m=3 (=2), fair Semaev baseline; falsification criterion met at both arities."
    - "Edwards native is constant-factor costlier at equal d_reg (more variables) — no exponent lever, opposite of the hypothesized advantage."
  evidence_refs: [EV-REP-002, EV-REP-001]
  limitations: ["Toy scale; Edwards-admitting curves; d_reg metric; closes only this scope (rule 6)."]
  next_actions:
    - "Set H-REP-001 status = rejected_scoped (representation/solving-degree: model-invariant, m<=3, toy)."
    - "Pivot the program to the next fresh Phase-4 direction: RQ-ISO-001 isogeny-neighborhood audit of PDP d_reg with matched controls (separate isogeny effect from coefficient variance)."
  decided_by: coordinator
  decided_at: "2026-07-16"
