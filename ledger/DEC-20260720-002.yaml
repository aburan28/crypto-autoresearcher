coordinator_decision:
  id: DEC-20260720-002
  context: >-
    Independent audit of the DREG n=17 first-past-wall result (TASK-20260720-
    DREG-AUDIT: Validator VAL-20260720-DREG-AUDIT + Red-Team red_team_report.md),
    reconciled with the EXP-SIG-005 cascade evidence and the newly demonstrated
    D6 instrument miscalibration. Thread: SIG asymptotics + DREG audit (2026-07-20).
  decision: inconclusive          # trending weakened; scoped KILL NOT earned
  target_ids: [H-DREG-001]
  rationale:
    - "RECEIPT INTEGRITY VERIFIED (Validator, 6/6 checks, no defects): the n=17
       sem two-partition gate (rank 125099, sr_pred 126922, deficit 1823) and the
       null two-partition gate (rank==sr_pred 126922, deficit 0) reproduce
       exactly; 9 sha256 recomputed, every rank reconstructed from per-unit pivot
       ledgers. The cancelled NULL-B parent is correctly inadmissible."
    - "KEY CAVEAT (Validator check 4): the 1823 is a rank deficit at a FIXED
       degree D=5 -- both arms are below full row rank (125099 and 126922 <
       nrows 132719), so d_reg is NOT reached and d_reg(sem) < d_reg(null) is
       NOT evaluable from any current cell."
    - "RED-TEAM correction adopted: n=17 is OFF the syzygy lattice (17 = 2 mod 3;
       the SIG cascade laws 8n/3, 2n/3+1 are defined only for n = 0 mod 3). The
       '-39 non-monotone dip' at n=17 is an off-lattice commensurability artifact.
       On the lattice the D5 deficit subsequence 1322/1862/1999 (n=12/15/18) is
       MONOTONE INCREASING (with n=9: 909/1322/1862/1999, increments
       +413/+540/+137). The 'relative deficit -> 0' argument (4.71%->1.39%) is
       near-tautological (rank ~ n^5) and is NOT the d_reg-relevant invariant."
    - "n-AXIS SPEEDUP CASE IS QUANTITATIVELY EMPTY: the D4 residual law is LINEAR
       and confirmed to n=24 (EV-SIG-005); residual_5 is non-monotone (drops at
       n=18, replicated); no measured syzygy quantity grows super-linearly in n.
       H-DREG-001's support clause (super-linear deficit growth OR d_reg(sem) <
       d_reg(null)) is not met."
    - "DEGREE-AXIS is the only live route AND is not validly measured. The
       Red-Team flagged the degree axis as the remaining open direction; this
       Coordinator's EXP-SIG-005 D6 run then demonstrated the D6 baseline is
       BROKEN (C5 null failure: arms differ in ncols, sr_pred matches neither).
       So BOTH the residual_6 'explosion' and the deficit_6 'turnover' the
       Red-Team weighed are inadmissible -- the degree axis is UNMEASURED past
       D=5, not merely ambiguous. The KILL clause is therefore unevaluable and a
       scoped KILL is NOT earned."
  evidence_refs: [EV-DREG-003, EV-DREG-002, EV-SIG-005,
    VAL-20260720-DREG-AUDIT, TASK-20260720-DREG-AUDIT]
  limitations:
    - "Toy scale (n<=24, D<=5); AGENTS rules 5-7. Single seed (2026) / single
       target on the DREG arm; the n=17 dip has no error bar."
    - "No generic prime-field ECDLP speedup is demonstrated or claimed. This is
       'no sub-rho signal at reachable scale', never a theorem (rule 6), and
       never crypto-scale (rule 7)."
    - "n=21/n=24 D5 deficit and any D>=6 deficit are unmeasured (n=21 owned by a
       concurrent session; D6 blocked by the instrument miscalibration and by
       host ENOSPC)."
  next_actions:
    - "H-DREG-001 status: INCONCLUSIVE, trending WEAKENED. The mechanism is now
       tightly constrained (syzygy-born, linear-D4, non-monotone-D5, off-lattice
       n=17 corrected) but the decisive observable is unmeasured."
    - "Gate any status change on the single highest-value measurement (Red-Team
       ranked #1), which now has a PREREQUISITE: repair the D6 semi-regular
       baseline, then measure the D=6 rank DEFICIT at n=12 (standard, on-lattice)
       on the DREG block-m4ri instrument -- the first non-anomalous degree-axis
       test and first chance at an actual d_reg datum."
    - "Secondary: replicate the DREG deficit across >=3 curves/seeds at n=12,15
       (currently single-seed); measure the d_ff/d_reg first-fall ladder (the
       hypothesis's own gap(n) metric, currently only 2 samples)."
    - "Infrastructure: the host root disk hit 100% (ENOSPC) mid-run; the n=21 and
       n=12-null-D6 cells are censored, not evidence. Recommend freeing host disk
       or relocating Sage TMPDIR to the data volume before the next heavy batch."
  decided_by: coordinator
  decided_at: "2026-07-20"
