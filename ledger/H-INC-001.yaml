hypothesis:
  id: H-INC-001
  question_id: RQ-INC-001
  statement: "A dual range-searching reporter (grid-bucketing / algebraic partition) over F_p^2 reports the s-rich lines of an EC chord arrangement output-sensitively: setup o(B^2) and marginal cost proportional to reported incidences, with measured pair/tuple-output exponent alpha2 < 3/2 and complete-cost trend below 0.49."
  mechanism: "Dualize FB points and chord lines; EC chords are a non-generic, algebraically structured line family (each line determined by two curve points); partition/range queries report only s-rich lines and witness tuples, so relation-discovery cost is proportional to output I rather than the B^{m-1} candidate space."
  assumptions: [A finite-field analogue of partition/range reporting can avoid Omega(candidate) factors; EC chord families are rich enough at useful B (tested separately by D3); m=4/5 regime is the intended operating point (m=3 supply arithmetic stated adverse by the candidate itself).]
  predictions:
    - {metric: pair/tuple-output exponent alpha2 (total reporting cost vs B), direction: lower, minimum_effect: "< 3/2 with setup o(B^2) confirmed"}
    - {metric: complete-cost trend across three sizes (total vs n), direction: lower, minimum_effect: "pointing below 0.49"}
    - {metric: marginal per-incidence cost, direction: lower, minimum_effect: "output-proportional, below enumeration's Theta(B^2)/I"}
  test_boundary:
    instances: ["ordinary prime-field curves, prime order n", "p in [211, 1009, 4099]", "B in {n^(1/4), n^(1/3), n^(2/5)} with B>=8", "seeds 20260717..20260722"]
    parameters: {m: 3, g: "ceil(sqrt(B)) x-interval buckets", algebraic_partition: "int(x^2-y) mod 9"}
    implementation: experiments/EXP-INC-001/inc1_report.sage
    budget: {wall_clock_seconds: 2400, maximum_runs: 8}
  falsification_conditions: ["candidate pair tests remain Omega(B^2) for the reporters (no output sensitivity)", "alpha2 >= 3/2 on the substantive op decomposition", "complete-cost trend not below 0.49", "reporter output differs from enumerator (correctness failure)"]
  interpretation_limits: ["Toy prime fields p <= 2^12, m=3 only, B <= 28: constant factors and fitted exponents at toy scale do not establish asymptotic behavior.", "Negative result closes only the tested scope: not m=4/5, not crypto-scale fields, not the existence of a subquadratic finite-field reporting primitive.", "The gate's B ~ q^{1/5} point falls below the B>=8 family bound at these toy sizes; coverage is partial."]
  status: rejected_scoped
  proposed_by: coordinator-research-director
