hypothesis:
  id: STR-H-001
  question_id: RQ-STR-001
  statement: Constraining relation harvesting to supports forming short arithmetic progressions {x, x+d, ..., x+(m-1)d} yields a relation matrix with O(1) displacement rank, solvable by superfast structured algorithms below generic sparse Wiedemann cost, while the measured AP relation-probability penalty stays small enough that the linear-algebra win is not swamped (B = rho 1/2).
  mechanism: Translation symmetry of AP support sets makes the relation operator Toeplitz/Hankel-like (displacement generator of size O(alpha*(m+B)) instead of nnz); AP-tuple sieve is an honest hit generator, non-AP relations discarded; rank kept full by choice of shift set D.
  assumptions: [FB x-interval; liftable-x density ~1/2; displacement rank survives lifting and negation; AP supply sufficient for a full-rank matrix]
  predictions:
    - {metric: displacement rank alpha of AP relation matrix over F_n, direction: lower, minimum_effect: "alpha = O(1), clearly below the generic/random-baseline rank ~ min(rows,B)"}
    - {metric: AP hit rate vs random-support baseline, direction: lower, minimum_effect: "relation-stage penalty < 1.5x at equal toy size"}
    - {metric: LA share of fully charged total cost, direction: lower, minimum_effect: "< 10% with structured solve, sustained across three sizes"}
  test_boundary:
    instances: ["ordinary prime-field curves, prime order n (anomalous excluded), p in {211, 1009, 4099}, seeds 20260717..20260722"]
    parameters: {D: "1..64", m: [3, 4], B: "ceil(sqrt(n))"}
    implementation: experiments/EXP-STR-001/str1_ap_matrix.sage
    budget: {wall_clock_seconds: 2400, maximum_runs: 8, per_invocation_seconds: 600}
  falsification_conditions:
    - "Measured alpha growing like sqrt(B) (or faster), or no separation from the random-support baseline displacement rank."
    - "AP relation-stage penalty >= n/B, or >= 1.5x vs standard-harvest baseline sustained across three sizes."
  interpretation_limits: [Toy fields only; toy != crypto-scale; negative closes only the tested scope (these sizes, FB rule, D, m); structured-solve time is model-projected from measured alpha.]
  status: rejected_scoped
  proposed_by: coordinator-research-director
