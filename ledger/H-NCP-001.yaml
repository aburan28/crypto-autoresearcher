hypothesis:
  id: H-NCP-001
  question_id: RQ-NCP-001
  statement: >
    The noncommutative path algebra of the correspondence quiver {T_{P_i}} + {neg} contains
    word-level relations (degree <= 6) toward the target word that a commutative subset-sum
    baseline at equal op budget does not reach, with NC-GB cost per relation below the
    commutative harvest cost and charged exponent trend < 0.49.
  mechanism: >
    Word order among translations/negations is discarded by the commutative quotient; if the
    evaluation kernel is not generated by commutators, NC overlap reductions expose relations
    with no commutative shadow.
  assumptions:
    - ordinary prime-field curve, prime-order subgroup
    - no isogeny arrows (base experiment)
    - evaluation of words as affine maps X -> eps*X + beta*P, v(w) = eps + beta in Z/n
  predictions:
    - metric: cost per Q-reaching relation (NC vs commutative at equal size)
      direction: lower
      minimum_effect: "cost_nc < cost_comm at equal size"
    - metric: charged exponent trend across p in {101, 431}
      direction: lower
      minimum_effect: "< 0.49"
  test_boundary:
    instances: ["p in {101, 431}", "B in {4, 8}", "seeds 20260717..20260719"]
    parameters: {max_word_degree: 6, n_floor: 13}
    implementation: experiments/EXP-NCP-001/ncp1_quiver_gb.sage
    budget: {wall_clock_seconds_per_run: 600, total_wall_clock_seconds: 2400, maximum_runs: 8}
  falsification_conditions:
    - Commutative quotient reproduces all NC-found relations (value-set inclusion + shadow replay, 0 violations) AND (cost_nc per relation >= cost_comm at equal size OR charged exponent >= 0.49) -> scoped negative (bookkeeping).
  interpretation_limits:
    - Toy primes; degree <= 6 truncation; a scoped negative closes only the tested scope.
    - Says nothing about degree > 6, larger B, isogeny-arrow quivers, non-prime fields, or crypto-scale curves.
  status: rejected_scoped
  proposed_by: coordinator-research-director
