handoff:
  id: TASK-20260903-6745ea
  from: coordinator
  to: executor
  goal_id: null
  batch_id: null
  batch_id_note: >-
    Assigned by /run-experiment when the execution batch is opened; this
    handoff is authored at approval time under DEC-20260903-93862f.
  experiment_id: EXP-PFDR-cbdefb
  hypothesis_id: H-PFDR-c88f14
  question_id: RQ-PFDR-ae2fba
  battery_position: 3 of 6 (runs after EXP-PFDR-fd901a and EXP-PFDR-5726af report)
  recorded_at: '2026-09-03'
  objective: >-
    Execute the frozen, approved contract EXP-PFDR-cbdefb exactly as
    specified: Stage 0 (zero compute) the transfer dictionary, the two
    non-transferring steps, the null formula and the formal analogue
    constant on the ladder; Stage 1 the V_{F,D} closure implemented as a
    loop around the shared F_p meter's exact-rank engine with the closure
    convention FROZEN and recorded in stage1-closure-convention.md before
    the first Stage 2 cell, validated on the s = 1 slice (afe4ce's floor)
    and on the known-answer fixture (the F_2 descent fixture with its
    conformance argument, or the planted-fall fixture with the substitution
    recorded), and P1 (closure d_ff equals graded-rank d_ff) on the shared
    (2, 2, s) cells at p = 4099; Stage 2 the ladder m = 2, d = 2, s in
    {1..5}, p in {4099, 16411, 65537}, 8 curves x 5 planted targets,
    D_max = 7, all arms (Semaev, NULL-1, NULL-2, NULL-3, non-curve cubic),
    fall history and iteration counts recorded, the equal-d^s spread cells;
    Stage 3 (optional, gated on EXP-PFDR-5726af's H-TOP result) m = 3,
    s in {2, 3}; Stage 4 (zero compute) slopes with 95 percent intervals on
    uncensored cells only, the outcome label by the pre-registered rule,
    the censoring report. Implement under experiments/EXP-PFDR-cbdefb/ with
    implementation.md; one immutable run directory per planned run
    (granularity: one (s, p) cell over all curves, targets and arms;
    fixtures; equal-d^s cells) under experiments/EXP-PFDR-cbdefb/runs/
    <run-id>/ carrying manifest.yaml, command.txt, environment.json,
    stdout.log, stderr.log and raw-result.json per
    docs/evidence-and-reproducibility.md; an execution_report YAML;
    observations only, never interpretation beyond the contract's
    predefined labels.
  uncertainty_reduced: >-
    Whether the last fall degree of the digit-presented prime-field Semaev
    system on the s-ladder is semi-regular (Outcome I), strictly faster
    than the first fall while tracking the null (Outcome II, the
    pre-registered expectation), or flat over at least four consecutive
    uncensored s (Outcome III, the only label that licenses
    IDEA-20260830-84cdb7's conditional exponent and hands D_0 to
    EXP-PFDR-c04716); whether the null arms sit in the band {0, 1, 2}
    above the null formula; and whether NULL-3 matches the Semaev d_ff at
    every cell. Censored or aborted cells at the top of the ladder make the
    slope a bound and forbid Outcome III.
  inputs:
    - experiments/EXP-PFDR-cbdefb/specification.yaml
    - ledger/hypotheses/H-PFDR-c88f14.yaml
    - ledger/proposals/IDEA-20260903-d52480.yaml
    - ledger/decisions/DEC-20260903-93862f.yaml
    - ledger/decisions/DEC-20260903-8cdf8d.yaml
    - ledger/questions/RQ-PFDR-ae2fba.yaml
    - harness/macaulay_fp/ (the F_p meter from TASK-20260903-ba41aa, at its verified snapshot commit)
    - harness/macaulay_fp/VALIDATION.md
    - ledger/handoffs/TASK-20260903-ba41aa.yaml
    - experiments/EXP-PFDR-fd901a/analysis.md (the rank-drop rate at p = 4099, the artifact budget; read only after that contract's snapshot archive verifies)
    - experiments/EXP-PFDR-5726af/analysis.md (the graded-rank d_ff values for CTRL-DFF-AGREEMENT and the H-TOP result gating Stage 3; read only after that contract's snapshot archive verifies)
    - ledger/proposals/IDEA-20260830-84cdb7.yaml
    - ledger/proposals/IDEA-20260808-afe4ce.yaml
    - ledger/proposals/IDEA-20260903-e1e38b.yaml
    - docs/evidence-and-reproducibility.md
    - docs/claims-and-verification.md
    - ledger/handoffs/TASK-20260903-6745ea.yaml
  constraints:
    - >-
      DEPENDENCY, BINDING: this contract requires exact F_p ranks and may
      not start before TASK-20260903-ba41aa has returned and its snapshot
      archive receipt has verified; refuse to start unless
      harness/macaulay_fp/ exists at a committed path with
      tests/test_macaulay_fp.py passing, and record the meter's commit and
      per-file sha256 in every manifest. ORDERING: dispatched only after
      EXP-PFDR-fd901a and EXP-PFDR-5726af have reported and their snapshot
      archives have verified, because their artifact budget and d_ff
      values are inputs; if either is unavailable at dispatch, refuse and
      report.
    - >-
      Refuse to start unless experiments/EXP-PFDR-cbdefb/specification.yaml
      is status approved with approved_by coordinator at a committed path
      in a verified snapshot archive. A message saying 'approved' is not an
      approval.
    - >-
      The closure convention is frozen at Stage 1 and recorded before the
      first Stage 2 cell; a change after that invalidates every cell under
      the other convention unless both are reported side by side under a
      protocol amendment. The preregistered prediction, the three-outcome
      rule and the criteria are read-only; any needed change is a versioned
      protocol_amendment under experiments/EXP-PFDR-cbdefb/amendments/
      requested from the Coordinator, never an edit.
    - >-
      Stopping rules are binding: stop before Stage 2 if the s = 1 slice,
      the known-answer fixture, or the d_ff agreement fails; stop the
      ladder after two consecutive fully-censored or aborted s; if d_lf on
      the Semaev arm is flat across three consecutive s while the null
      rises, run the confirmation arm before any other cell.
    - >-
      Timeouts, OOM, crashes and pre-flight aborts (above 50,000 columns or
      4 GiB dense-equivalent; (2, 2, 6, 8) excluded by name) are
      failed_infrastructure or not-computable-in-budget with the cell named;
      never evidence about the last fall degree. A censored cell is
      censored, never a bound, and never enters a slope fit.
    - >-
      A claimed fall with closure iteration count 1 invalidates that fall
      entry and returns the instrument to Stage 1; iteration counts are
      recorded per degree per cell.
    - >-
      Record every deviation in the execution report and the manifest;
      never silently absorb one. Every planted target carries a
      certificate re-verified by independent point addition; the y^2 = f(x)
      soundness subsample is reported, not modelled.
    - >-
      No Groebner output degree as d_lf; no reduced-basis degree as a
      metric; every fall is read from the exact closure.
    - >-
      No hypothesis, experiment, question or goal status change; no
      evidence record; observations only. An Outcome III label is reported
      as the pre-registered label with its censoring report and is NOT
      interpreted by the executor; the Coordinator routes it to
      review-breakthrough.
    - >-
      Write only under experiments/EXP-PFDR-cbdefb/; never commit; never
      run git; never edit the specification, any hypothesis, or any other
      record.
    - >-
      Record the requested policy (executor-implementation, medium), the
      resolved model identifier, model_verified and fallback_used in every
      manifest's inference block and in the execution report; no Bedrock,
      no fallback, no degradation.
    - >-
      Seeds exactly as frozen: curve seeds 3101..3108 per prime; target
      seeds 1..5; null seeds 7, 11, 13, 17, 19 per null arm; known-answer
      fixture seed 5.
  deliverables:
    - experiments/EXP-PFDR-cbdefb/implementation.md
    - experiments/EXP-PFDR-cbdefb/stage0-transfer.md (the dictionary, the two non-transferring steps, the null and analogue-constant table)
    - experiments/EXP-PFDR-cbdefb/stage1-closure-convention.md (the frozen convention, the fixture conformance argument or the planted-fall substitution)
    - one immutable run directory per planned run under experiments/EXP-PFDR-cbdefb/runs/<run-id>/ with manifest.yaml, command.txt, environment.json, stdout.log, stderr.log, raw-result.json
    - experiments/EXP-PFDR-cbdefb/analysis.md (slopes with intervals, outcome label, null band table, NULL-3 table, equal-d^s spread, iteration counts, censoring table, tail checks, verdict against the frozen criteria as observation)
    - experiments/EXP-PFDR-cbdefb/execution-report.yaml (per-run terminal status, stage report, stopping rules triggered, deviations, certificate results, inference block)
  artifact_paths:
    - experiments/EXP-PFDR-cbdefb/implementation.md
    - experiments/EXP-PFDR-cbdefb/stage0-transfer.md
    - experiments/EXP-PFDR-cbdefb/stage1-closure-convention.md
    - experiments/EXP-PFDR-cbdefb/runs/
    - experiments/EXP-PFDR-cbdefb/analysis.md
    - experiments/EXP-PFDR-cbdefb/execution-report.yaml
  write_scope:
    - experiments/EXP-PFDR-cbdefb/
  archived_by: null
  archived_by_note: >-
    The execution batch's snapshot archive task is minted by
    /run-experiment when the batch is opened and stages exactly the
    artifact_paths above. This handoff itself is archived by the approval
    snapshot of DEC-20260903-93862f.
  inference:
    policy: executor-implementation
    reasoning_effort: medium
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 172800
    memory_gb: 8
    maximum_runs: 48
    budget_note: >-
      Copied from the frozen contract with a bound: wall_clock_seconds_per_run
      7200 x maximum_runs 48 = 345600 s is the ceiling only if every run
      consumed its full window; the contract's total_cpu_hours 48 at
      maximum_workers 1 (172800 s) is the binding envelope and is what
      wall_clock_seconds carries. Per-run windows stay at 7200 s as
      frozen; memory_gb 8 is the contract's maximum_memory_gb with the
      pre-flight gate at 4 GiB dense-equivalent.
  completion_gate:
    - >-
      G1: every planned run (the s = 1 slice, the known-answer fixture, the
      d_ff agreement, the 15 main (s, p) cells, the 3 equal-d^s cells, the
      2 optional m = 3 cells if gated open; re-runs only after an
      infrastructure stop) has a run directory with a manifest carrying a
      terminal status and the six required files; runs not started because
      a stopping rule fired are listed by name with the rule.
    - >-
      G2: raw-result.json and the analysis tables agree; every slope, band
      value and label is reproducible from the raw fall histories with
      censored cells excluded as flagged.
    - >-
      G3: every control is present and reported: CTRL-S1-BASELINE,
      CTRL-KNOWN-ANSWER-FIXTURE, CTRL-DFF-AGREEMENT, NULL-1, NULL-2,
      NULL-3-BLOCK-FACTORED, NEARBY-NON-CURVE-CUBIC, CTRL-EQUAL-DS-SPREAD,
      CTRL-ITERATION-COUNT, and the CTRL-CONFOUNDERS-NAMED statement.
    - >-
      G4: every manifest carries the meter's commit and per-file sha256,
      the closure convention, the implementation commit and dirty-tree
      hash, seeds, parameters, timing, peak RSS, pre-flight counts,
      per-file sha256 of the run package, certificate results, and the
      inference block.
    - >-
      G5: the execution report is returned with stopping rules triggered,
      every deviation, the censoring report, and the observed values
      against each frozen criterion stated as observation.
    - >-
      G6: nothing outside experiments/EXP-PFDR-cbdefb/ was written; no
      record was edited; no status changed.
  return_format: >-
    A short plain-text return listing: the run ids with terminal status;
    the s = 1, known-answer and d_ff-agreement results; per-cell (d_ff,
    d_lf, censoring flag, iteration counts) for the Semaev arm and each
    null; the fitted slopes with intervals; the outcome label as assigned
    by the pre-registered rule; the null band offsets; any stop rule
    triggered and where; which of G1-G6 are met and which are not, with
    reasons; the inference block values. Observations only; no claim about
    the hypothesis; no summary files outside the write scope.
  review_plan: null
  review_plan_note: >-
    The review round is opened by a later Coordinator handoff after the
    execution snapshot archive; validator and red-team run at
    review-adversarial (xhigh) in independent sessions. If the label is
    Outcome III, the round runs at review-breakthrough (max) with a
    review_plan naming as joints the closure convention, the known-answer
    fixture, the censoring report and the null band (DEC-20260903-8cdf8d
    next_actions item 5), and D_0 is read against EXP-PFDR-c04716's
    thresholds only after that review.
  id_allocation_provenance: >-
    TASK-20260903-6745ea pre-allocated by the orchestrating Coordinator
    session with tools/allocate_id.py and supplied for this approval step;
    this agent did not allocate identifiers.
  yaml_parse_disclosure: >-
    Written by the Coordinator subagent without an interpreter; every prose
    value is a folded block scalar or a quoted scalar; no tabs; no duplicate
    keys to the author's reading. The orchestrator must run the strict parse
    and tools/validate_ledger.py before relying on this record.
