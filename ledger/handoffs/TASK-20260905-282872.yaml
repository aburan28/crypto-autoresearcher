  constraints:
  - Proposal-only task. No experiments, implementation, attack code, key-recovery procedure
    or third-party target operation; maximum_runs is 0. Every minimal_test is a design for a
    later approved contract.
  - Research at a conceptual and mathematical level only. Toy and symbolic scopes; lawful
    defensive cryptanalysis on public constructions.
  - The five RQ-SATIC-1ae57a proposals are the nearest work and are OFF-LIMITS as
    mechanisms. A new proposal may not be another ceiling restatement, factor attribution,
    null ladder, Gaussian-elimination inertness argument or subspace-membership enumeration;
    it must name which of those it builds on and the exact difference. The crossbred and
    hybrid re-costings (IDEA-20260808-fc5e3e, IDEA-20260808-da1428, IDEA-20260903-dcf857),
    the digit presentation (IDEA-20260830-84cdb7, IDEA-20260903-e1e38b) and the
    last-fall-degree floor (IDEA-20260808-afe4ce) are prior art to be diffed against, not
    repeated.
  - Candidate directions the Coordinator asks you to consider, without quota and in addition
    to your own, are (1) the prime-field decomposition system as an SMT problem in the
    bit-vector theory and in a finite-field theory with integer-range side constraints, with
    the prime-field analogue of the SATIC ceiling stated as the falsifiable prediction;
    (2) incremental, assumption-based solving across many targets sharing one curve and
    factor base, with learned-clause reuse and the falsifier that every learned clause is
    target-dependent; (3) approximate and projected model counting for decomposition
    probability against factor-base size, the quantity RQ-RELN-001 needs, with PAC error
    bars and enumeration ground truth at toy size; (4) proof-producing UNSAT solving (DRAT,
    LRAT, FRAT) as an independently checkable certificate of non-decomposability, closing the
    negative-side certificate gap, with proof size as an instrument for above-leaf pruning;
    (5) symmetry detection on the encoded system, asking whether the true automorphism group
    exceeds S_m and how many pruning bits that is worth; (6) cube-and-conquer and lookahead as
    direct tests of the no-above-leaf-pruning claim; (7) mapping learned clauses to ANF
    polynomials and testing membership in the Macaulay row space at degree D, bridging CDCL
    learning to first-fall degree; (8) SAT, ILP or MaxSAT search over the factor-base choice
    (subspace, interval, digit base) against a declared hardness proxy validated against
    measured cost; (9) pseudo-Boolean and mixed encodings of the digit-presented prime-field
    system; (10) a point-domain CSP with a group-law propagator as a known-false or ceiling
    control; (11) anything genuinely new.
  - Every proposal states which pipeline stage it changes (factor-base design,
    decomposition, yield measurement, certification, linear algebra, descent) and whether it
    targets an exponent, an amortised constant, or certifiability; fills target_complexity
    against the SATIC ceiling of ml - log2|G| bits, the honest enumeration bound of
    IDEA-20260904-96c4f3, the Groebner baseline and Pollard rho at N^(1/2), charging
    encoding, preprocessing, proof checking and memory.
  - 'Metrics discipline: conflicts, decisions and leaf counts are primary; wall-clock is
    secondary with pinned solver, version, hardware and seed; SAT and UNSAT instances are
    predicted and reported separately.'
  - 'Mandatory controls in every minimal_test: a shape-matched random system of identical
    shape (the null ladder of IDEA-20260904-b40e6d or its prime-field analogue), a
    planted-satisfiable instance, and a known-false object on which the claimed effect must
    vanish.'
  - Every timing in SRC-SATIC-TRIMOSKA-2019 is reported, not reproduced; no record may cite
    it as measured here or form a cross-hardware ratio against it. Magma is unavailable and
    Sage or Singular Groebner ratios are not comparable to it. estimated_cost must reflect
    the solver inventory in notes/satic_solver_environment_20260904.md.
  - Novelty stays unverified unless a specific local record and an opened primary source
    support the exact distinction. No claim of global novelty from absent search results.
    search_knowledge is unavailable to this task; disclose that, use explicit local record
    searches and primary-source retrieval (web search and fetch are permitted for external
    literature such as finite-field SMT theories, model counters and proof formats), and
    record every retrieval in sources.json.
  - Read mechanisms of nearest internal proposals, not only titles. Record at least one
    specific nearest internal record and the exact difference for each candidate.
  - Mark every citation with provenance recalled, retrieved, kb or internal; a recalled
    reference is a pointer and supports nothing. Name the verifying task for sources opened.
  - Proof-oriented records carry a complete proof_search_map. Conditional cost claims name
    numbered heuristics with validation routes.
  - dominated_by may be null only after every declared frontier row was checked; otherwise
    record the unresolved comparison. sota_delta is quantitative or an explicit unquantified
    boundary.
  - 'Required per-idea fields: id, title, class, claim, mechanism, question_id, question_ids,
    goal_ids, goal_applicability, status, proposed_by, recorded_at, task_id, batch_id,
    novelty_status, novelty_screen, citations, assumptions, predictions, minimal_test,
    falsification_conditions, confounders, interpretation_limits, heuristic_assumptions,
    target_complexity, estimated_cost, recommended_priority, proof_search_map, dominated_by,
    sota_delta, inference.'
  - 'Fixed values: question_id RQ-ECDLP-f0a7b0; question_ids must include RQ-ECDLP-f0a7b0
    and RQ-ECDLP-002 and may add RQ-SATIC-1ae57a, RQ-RELN-001, RQ-SDEG-001 or RQ-CRYPTO-001
    where applicable; goal_ids must include GOAL-ECDLP-001 and may add GOAL-CRYPTO-001,
    GOAL-RELN-001, GOAL-SDEG-001, GOAL-DREG-001 or GOAL-ICEX-001 with a goal_applicability
    sentence each; status proposed; proposed_by idea-generator; recorded_at 2026-09-05;
    task_id TASK-20260905-282872; batch_id BATCH-23ec69; novelty_status unverified.'
  - 'Assigned identifiers, used in order and never re-minted: IDEA-20260905-24d827,
    IDEA-20260905-a6f98e, IDEA-20260905-3de445, IDEA-20260905-a94b5f, IDEA-20260905-79112a,
    IDEA-20260905-3993c3, IDEA-20260905-1226bf. Unused identifiers are left unused.'
  - Every idea stays status proposed and novelty_status unverified. No global novelty,
    asymptotic advance, verified mechanism or breakthrough is asserted.
  - 'Write ideas.yaml as a mapping with ideas: [one complete idea body per proposal, no
    wrapper key inside the list]. Do not write to ledger/ and do not commit. report.md
    records the honest-accounting block of docs/inventor-protocol.md section 5, the ranking
    rationale and the recommended first test. sources.json records every retrieval and every
    local record read.'
  - Do not read sibling producer outputs. Do not repair existing records.
