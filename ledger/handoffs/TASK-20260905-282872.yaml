handoff:
  id: TASK-20260905-282872
  from: coordinator
  to: idea-generator
  objective: >-
    Generate five or six distinct, schema-complete, falsifiable proposals for
    RQ-ECDLP-f0a7b0: uses of SAT, SMT, model-counting and proof-producing constraint
    technology that could change the charged cost or the certifiability of factor-base
    design, relation finding (point decomposition) and the Groebner or algebraic step of
    elliptic-curve index calculus, on prime fields and on extension fields, beyond the five
    binary-field pdp proposals already filed under RQ-SATIC-1ae57a.
  uncertainty_reduced: >-
    Whether constraint technology moves a search exponent, an amortised per-target constant,
    or only certifiability and measurement fidelity, for the decomposition step and the
    stages around it; and whether the SATIC no-above-leaf-pruning ceiling has a prime-field
    analogue.
  inputs:
