    - RUN_ID minted with `python3 tools/allocate_id.py --next run --area CERTBIN` and confirmed with `--check`; archived_by (TASK-20260924-d0f80c) bound before launch.
    - All inputs committed on the branch (RUN-CERTBIN-c417e0, RUN-CERTBIN-3b7e05 curve.json, the red-team directory, the engine at 934bee5).
    - At most three CERTBIN executors running at once within their memory caps (DEC-20260924-f5c3f9 R-9); otherwise wait.
    - No lane claim applies (no goal, no queue); record that in the dispatch note. If a queue exists by then, claim with tools/goal_lanes.py first.
    - The dispatching session reads this whole card, including these preconditions, and does not write or edit any file under experiments/EXP-CERTBIN-060020/verifier/.

  completion_gate:
    - engine-provenance/ shows C-ENGINE passing with timestamps preceding every draw log; selftest.json shows C-SELF, C-FIX, C-CURVE and C-ELL0 passing; slice17.json shows C-SLICE17 passing; inputs.json shows C-SRC passing
    - trial-plan-v1.json exists with the exact power table, its sha256 is in the manifest, and it predates phase 0
