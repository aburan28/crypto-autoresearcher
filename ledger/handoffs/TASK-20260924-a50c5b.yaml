# =============================================================================
# TASK-20260924-a50c5b -- EXECUTOR card for EXP-CERTBIN-060020 (the n = 19
# cell): M_3, M_4, W_4 and the ell-substituted R'_3 / R'_4 on 400
# unsatisfiable subgroup-target S_3 descents at n = 19, l = 10, beside
# N-CONV19, N-ELL19, N-F219, N-AFF19 and the x(2E) split, on the pinned fast
# engine crypto_autoresearcher.gf2, with wdag-v1 / flat-v1 / ann-v1
# certificates verified by a separate process.
#
# ID PROVENANCE: pre-minted by the dispatching session (relayed); checked by
# TASK-20260924-791da5 SC-1.
#
# NOT DISPATCHED. Dispatch only after TASK-20260924-791da5's receipt verifies.
# =============================================================================
handoff:
  id: TASK-20260924-a50c5b
  from: coordinator
  to: executor
  recorded_at: '2026-09-25'
  goal_ids: []
  question_id: RQ-CERTBIN-836ce2
  experiment_id: EXP-CERTBIN-060020
  hypothesis_id: H-CERTBIN-e3ac93
  approval_decision: DEC-20260924-f5c3f9
  archived_by: TASK-20260924-d0f80c
  run_id: minted at dispatch (EXP-CERTBIN-060020 execution.run_id_rule); passed as $RUN_ID
  review_required: true
  depends_on: [TASK-20260924-791da5]
  state: written_not_dispatched

  objective: >-
    Reduce the uncertainty in whether the degree-4 mutant-closure (W_4)
    refutation of unsatisfiable m = 2 S_3 subgroup-target descents, 386/386 at
    n = 17, persists at n = 19 or decays toward the nulls, and whether S_3's
    non-semi-regular degree-4 structure persists (substituted fall profile).
    Implement experiments/EXP-CERTBIN-060020/impl/ and verifier/ from the
    frozen specification (version 1) on the pinned engine, run it once, and
    return observations. Interpret nothing beyond the mechanical decision
    rules N19-DR-1..10.

  uncertainty_reduced: >-
    E-PERSIST against E-DECAY on S3-U400 (H-CERTBIN-e3ac93 C-P) and C-M
    (N19-DR-3). Positive next decision: m = 3 pricing becomes eligible for its
    own design; negative: item (B) answered negatively at this cell with
    certified non-refutations; inconclusive: a second n = 19 curve.

  inputs:
    - experiments/EXP-CERTBIN-060020/specification.yaml (frozen v1; its engine_provenance, inputs, object, instance_sets and controls blocks are the implementation spec)
    - ledger/hypotheses/H-CERTBIN-e3ac93.yaml
    - src/crypto_autoresearcher/gf2/ (pinned at 934bee5; imported, never copied or edited) and its README.md
    - tools/gf2_replay_rc1.py and tests/test_gf2_kernels.py (C-ENGINE)
    - experiments/EXP-CERTBIN-e94b27/runs/RUN-CERTBIN-c417e0/instance-sets.json and experiments/EXP-CERTBIN-4e92d7/runs/RUN-CERTBIN-3b7e05/curve.json (C-SLICE17), read only
    - experiments/EXP-CERTBIN-a58c63/runs/RUN-CERTBIN-0b8f3a/cells.json and selftest.json (provenance comparison, C-CURVE (f)), read only
    - coordination/review/certbin-20260924-3d7e1a/reviews/TASK-20260924-d95e70/red-team-report.yaml and j9-ptm/o2-declaration.yaml (regression values; N-ELL draw rule; T4, T5), read only

  constraints:
    - id: EX-1
      text: >-
        ENGINE PROVENANCE FIRST. Before the first frozen draw and before any
        closure on run data: C-ENGINE (tree rule, _kernels.c sha256
        c8f79d5961fffaf80428cdd29d0a53bfcc1e6d32ab07022931e3aacd926ca745,
        CRYPTO_AR_GF2_BACKEND=native, build_info in the manifest,
        `python3 tools/gf2_replay_rc1.py --limit 1062 --json ...` with 0
        mismatches, `python3 -m pytest -q -rs tests/test_gf2_kernels.py` with
        0 failures and 0 skipped), then C-SRC, C-SEED, C-SELF (including the
        nv = 20 native-versus-reference item), C-FIX, C-CURVE, C-ELL0 and
        C-SLICE17. On any failure STOP and report; never adjust a dimension,
        an input, a seed or a rule to pass.
    - id: EX-2
      text: >-
        THE PACKAGE IS IMPORTED, NEVER COPIED OR EDITED. impl/ holds only
        n = 19-specific code (specification engine_provenance.import_rule). A
        suspected engine defect is a STOP and a report to the Coordinator,
        never a patch; the engine's author is the dispatching session, which
        will not write or edit verifier code for this experiment.
    - id: EX-3
      text: >-
        DRAWS BY RULE ONLY. Seven frozen seeds, one PCG64 generator per arm,
        numpy 2.4.6, the specification's draw and keep rules, quotas and caps.
        Nothing is extended, trimmed, reordered or redrawn after any output.
        Every attempt is logged.
    - id: EX-4
      text: >-
        RC-B BEFORE PREDICTIONS. Phase 3 computes the ell-substituted profile
        on every applicable system and writes and hashes predictions.jsonl.gz
        before phase 4. No semi-regular prediction is applied to S_3 or
        N-CONV19 systems.
    - id: EX-5
      text: >-
        CERTIFICATES OR IT DID NOT HAPPEN. A refutation counts only if its
        flat-v1 (M_4, max |mu| <= 2) or wdag-v1 (W_4) certificate verifies in
        verifier/verify_n19.py run as a SEPARATE PROCESS that imports nothing
        from impl/, from crypto_autoresearcher or from any archived impl/. The
        engine's flat certificate of a W_4 refutation never counts toward W_4
        unless max |mu| <= 2. An uncertified refutation is reported as
        UNCERTIFIED and not counted. Every S3-U400 non-refutation carries an
        ann-v1 certificate (C-NONREF). A certificate that fails voids what
        INV-6 / INV-8 name; do not repair it silently.
    - id: EX-6
      text: >-
        SOUNDNESS IS AN INSTRUMENT CHECK. Any refuted satisfiable control, or
        codim(W_4) < s (C-PS), voids the run (INV-5). Report it verbatim.
    - id: EX-7
      text: >-
        NO D >= 5, NO F4, NO SECOND CURVE, NO m = 3, NO PRICING (SR-4). D <= 5
        cleanliness is not computed.
    - id: EX-8
      text: >-
        DECISION RULES ARE MECHANICAL. Apply N19-DR-1..10 as written,
        including both N19-DR-1 labels. Exact arithmetic for every interval
        and tail (RC-3). The exact power table goes into the trial plan
        before phase 0. Add no threshold and drop no system after seeing
        results.
    - id: EX-9
      text: >-
        OBSERVATIONS ONLY. Change no hypothesis status; write no evidence
        record, decision or knowledge entry; edit no specification, ledger
        record, or anything under EXP-CERTBIN-4e92d7, -e94b27, -a58c63,
        -ddfe75, coordination/review/ or src/. Retain every failed attempt
        with its logs. Do not commit; the Coordinator archives.
    - id: EX-10
      text: >-
        RESOURCES (machine protection). Memory cap 3 GB; one process with at
        most 3 engine threads (CRYPTO_AR_GF2_THREADS <= 3);
        PYTHONDONTWRITEBYTECODE=1; run watchdog 172,800 s with checkpoint and
        --resume; per-system closure watchdog 3,600 s (expiry =
        UNDETERMINED(budget), never "not refuted"). maximum_runs 2: one run
        plus one re-run only after an INFRASTRUCTURE failure. Other CERTBIN
        executors may share the 4-core, 15 GB machine.
    - id: EX-11
      text: >-
        SCOPE AND TIER. Claim tier toy; no cost claim; sota_delta zero; oracle
        A and parallel rho dominate. Nothing about F4 step degree, other n,
        m = 3, or Semaev's Assumption 1. Runtime figures in any report are
        labelled measured (with manifest) or modeled, never mixed.
    - id: EX-12
      text: >-
        INDEPENDENCE DISCLOSURE in run-report.md: the engine was written by the
        dispatching session; impl/ and verifier/ by you; the verifier is
        code-independent of both but not author-independent of impl/. The
        author-independent verification is the review round's.

  launch:
    entry_point: experiments/EXP-CERTBIN-060020/impl/driver.py
    environment: the specification's execution.environment
    command: the specification's execution.command, with $RUN_ID
    resume: append --resume to the driver command
    determinism_phase: the specification's execution.determinism_command (separate process)
    backend_phase: the specification's execution.backend_command (separate process, CRYPTO_AR_GF2_BACKEND=reference)
    verify: the specification's execution.verify_command (separate process, after the closures)
    launch_note: No batch queue exists; tools/experiment_execution.py is not used. trial-plan-v1.json is written from the specification before phase 0.

