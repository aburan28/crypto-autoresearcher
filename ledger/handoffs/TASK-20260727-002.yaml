handoff:
  id: "TASK-20260727-002"
  from: "coordinator"
  to: "executor"
  goal_id: "GOAL-ECDLP-001"
  authorized_by: "DEC-20260727-002"
  objective: >-
    Execute the frozen EXP-ENDO-001 protocol exactly as specified and produce the immutable
    run records and execution report it requires. Experiment title: Endomorphism-invariant factor base on GLV curves: displacement rank versus random/AP
    baselines, relation-density penalty, and calibrated structured-solve model cost,
    with a non-GLV generic-curve arm.
  uncertainty_reduced: >-
    Decide the two claims of H-ENDO-001 under a frozen protocol, as the decisive
    replication and extension of EV-STR-002 (preliminary, unreviewed, model-only, noisy
    penalty). C1 (structure): on j = 0 and j = 1728 GLV curves at 16-24 bits, a phi-
    invariant factor base yields a relation matrix commuting with the phi-shift
    permutation and having displacement rank alpha <= r, separated from an in-run rando
  inputs:
    - "experiments/EXP-ENDO-001/specification.yaml (status approved, frozen: true; do not change)"
    - "ledger/hypotheses/H-ENDO-001.yaml (status approved; do not change)"
    - "ledger/proposals/IDEA-20260726-002.yaml (context; do not change)"
    - "AGENTS.md, docs/task-lifecycle.md, docs/evidence-and-reproducibility.md, docs/claims-and-verification.md"
  constraints:
    - "The protocol is frozen. Any change requires a versioned protocol_amendment under experiments/EXP-ENDO-001/amendments/ approved by the Coordinator; runs already executed are never re-scored against an amended criterion."
    - "Every run needs a manifest with exact command, git commit and dirty state, environment, seeds, stdout, stderr, raw results, validity status, timestamps, and resource measurements."
    - "claim_tier is toy: no conclusion above that tier; infrastructure failure is never evidence against the hypothesis (AGENTS.md rule 5)."
    - "Stopping and invalidation rules of the specification are binding; a timeout, crash, or implementation failure is reported as such, never as a result."
  deliverables:
    - "All artifacts enumerated in experiments/EXP-ENDO-001/specification.yaml required_artifacts (per-run manifest.yaml, command.txt, environment.json, raw.json, summary.json, stdout.txt, stderr.txt)"
    - "experiments/EXP-ENDO-001/execution-report.yaml"
  artifact_paths:
    - "experiments/EXP-ENDO-001/specification.yaml"
    - "experiments/EXP-ENDO-001/runs/"
    - "experiments/EXP-ENDO-001/execution-report.yaml"
  write_scope:
    - "experiments/EXP-ENDO-001/"
  archived_by: "TASK-20260727-901"
  inference:
    policy: "executor-implementation"
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 10200
    memory_gb: 4
    maximum_runs: 12
  completion_gate:
    - "Exactly 12 planned runs reach a terminal status (completed_valid, completed_invalid, failed_infrastructure, failed_implementation, resource_exhaustion, cancelled_by_budget)."
    - "Every required artifact in the frozen specification exists and is schema-valid."
    - "Validation checks pass: expected run count, no duplicated or missing seeds, raw/summary agreement, control comparability, no unrecorded protocol deviation."
    - "No claim above claim_tier toy; no status of any ledger record changed by the Executor."
  return_format: "Immutable run records per required_artifacts plus execution-report.yaml."
