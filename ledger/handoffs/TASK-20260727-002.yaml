handoff:
  id: TASK-20260727-002
  from: coordinator
  to: reviewer
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-009
  authorized_by: DEC-20260727-002
  objective: >-
    Reach an independent terminal verdict on whether origin/main's executed EXP-GGM-001
    archive earns the two things it asserts: the control gate reported as 4/4, and the
    claim that the jet and endomorphism verdicts are scale-independent mathematical
    closures at exponent 1/2. Derive the operative simulability predicate from main's own
    committed artifacts, apply it yourself and uniformly to all eight subjects, and say
    what survives.
  uncertainty_reduced: >-
    Whether the disputed closure claim carried by EV-GGM-001 and origin/main's
    DEC-20260726-007 stands, falls, or cannot be decided from the committed artifacts -
    judged by a session that wrote neither the execution nor the escalation ruling that
    attacks it.
  inputs:
    - experiments/EXP-GGM-001/specification.yaml (status review_required, approved_by null; do not change it)
    - experiments/EXP-GGM-001/analysis.md
    - experiments/EXP-GGM-001/simulability_test.py — READ IT. ESC-20260727-001 explicitly
      did not read the implementation and named that omission as a way its own argument
      could be wrong.
    - All 9 run directories under experiments/EXP-GGM-001/runs/ (RUN-GGM-s1-b8, s1-b12,
      s1-b16, s2-b8, s2-b12, s2-b16, s3-b8, s3-b12, s3-b16), each with manifest.yaml,
      raw-result.json, command.txt, environment.json, stdout.log, stderr.log
    - ledger/evidence/EV-GGM-001.yaml (direction supports, strength strong, claim_tier
      toy, proof_status derivation, run_ids empty despite asserting 9 runs)
    - ledger/decisions/DEC-20260726-007.yaml (origin/main's record; decision support;
      knowledge_promotion promoted KN-FIND-002)
    - ledger/hypotheses/H-GGM-001.yaml (currently status supported; assumptions item 5
      fixes the model variant across all oracles and controls; falsification_conditions
      item 4; interpretation_limits)
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-006/reviews/TASK-20260726-005/review_report.yaml
      (REV-20260726-005, design-time, verdict REVISE, 8 blocking objections)
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-006/redteam/TASK-20260726-006/objections.md
      and falsification_routes.yaml (RT-20260726-001, OBJ-02 blocking, claim_tier ceiling toy)
    - coordination/goals/GOAL-ECDLP-001/escalations/ESC-20260727-001/ruling.yaml and
      reconciliation_notes.md — read these as a POSITION UNDER TEST, not as an authority
    - AGENTS.md rules 4, 5, 6, 7, 9, 10, 12; docs/claims-and-verification.md;
      docs/task-lifecycle.md; knowledge/techniques/KN-TECH-005.md
  constraints:
    - >-
      INDEPENDENCE IS THE POINT. This review must run in a session that (a) did not
      author or execute EXP-GGM-001, EV-GGM-001, main's DEC-20260726-007, H-GGM-001 or
      KN-FIND-002, and (b) did NOT author ESC-20260727-001 ruling.yaml or
      reconciliation_notes.md. State both non-originations in an independence_attestation,
      and additionally state whether this session is or is not the session that produced
      REV-20260726-005 or RT-20260726-001, so any correlation is visible rather than
      assumed absent.
    - >-
      AGENTS.md rule 12. Requested policy is review-breakthrough at reasoning_effort max
      and it may not be degraded. Moving to a different backend that FULLY meets the max
      floor is permitted and must be recorded; substituting a weaker policy or running
      below max effort is not. If no backend meeting the floor can be resolved, STOP and
      return a policy-resolution failure with resolved_model_id and probe status recorded
      — do not return a verdict. A verdict produced below the floor is worse than no
      verdict, which is why the floor exists.
    - >-
      Establish the review binding FIRST. For every reviewed path, resolve the commit
      that supplies it, confirm it is clean at HEAD, and compute its SHA-256 from Git
      object content, never from the working tree. Record commit, path and hash in a
      snapshot_validation block. If the binding cannot be established, stop and report a
      binding failure instead of a review verdict.
    - >-
      Do not execute anything. EXP-GGM-001 version 1 is status review_required with
      approved_by null and its execution is not authorized by any decision, including
      DEC-20260727-002. Do not run simulability_test.py, do not re-run any RUN-GGM-*, and
      do not write a version 2 specification. If you conclude re-execution is necessary
      to decide the question, that conclusion IS a deliverable — record it as a required
      successor task.
    - >-
      Do not edit any file under experiments/EXP-GGM-001/. Run records are immutable; a
      gap is recorded, never filled. Do not change the status of any hypothesis,
      experiment, evidence, decision or knowledge record; only the Coordinator may, and
      only via TASK-20260727-006.
    - >-
      Do not edit anything under knowledge/. knowledge/INDEX.md and
      knowledge/findings/KN-FIND-001.md and KN-FIND-002.md currently carry unresolved Git
      conflict markers, and KN-FIND-002 is claimed by two different findings. Report what
      you observe about the KN-FIND-002 promotion; repair nothing.
    - >-
      CORE TASK 1 — derive the predicate yourself. Read simulability_test.py and write
      out, in one sentence, the operative predicate the module actually applies to decide
      SIMULABLE versus NON_SIMULABLE. State whether that implemented predicate matches
      the prose rationales emitted in raw-result.json and whether it matches the frozen
      specification's inputs.gg_model_variant value shoup_encoding.
    - >-
      CORE TASK 2 — apply it uniformly. Apply ONE definition of simulable, by hand, to
      all eight subjects (pure_generic, discrete_log, public_curve, encoding, jet_oracle,
      elliptic_net_oracle, incidence_oracle, endomorphism_oracle). Do this for strict
      Shoup and for whatever formalisation of the "structured GGM" you judge most
      defensible. Report the verdict table per model and state, for each, whether the
      control gate reaches 4/4 under that single model.
    - >-
      CORE TASK 3 — steelman before attacking. ESC-20260727-001 reconciliation_notes
      section 5 item 3 names the strongest available rescue: a structured GGM in which
      the curve equation is public but the POINT ENCODING remains opaque, which might
      separate jet and endomorphism data from x(P). Try seriously to construct that
      definition. If it can be made precise and it saves the gate, say so plainly — that
      outcome vindicates the co-driver's result and is a fully acceptable finding. If it
      cannot, show why.
    - >-
      CORE TASK 4 — check the specific claims. (a) Is overhead_C identical across the 8,
      12 and 16 bit runs for every subject, and can a statically counted quantity support
      an N-independence claim? (b) Does the discrete_log control emit a witness of the
      form its own specification mandates (an encoding pair), or prose? (c) Does
      H-GGM-001 falsification_conditions item 4 fire for elliptic_net (O(log N)) and
      incidence (O(B^m)), and is that condition stated in the right direction? (d) Is
      "O(B^m) is still much less than sqrt(N)" true, false, or vacuous given that B is
      never bounded in the frozen specification? (e) Do all 9 runs agree on spec_hash and
      on every subject verdict?
    - >-
      CORE TASK 5 — separate process from substance. That no approval record exists (A1)
      and that no rule-12 review preceded the archive (A2) are process facts. Whether the
      mathematics is right is a separate question. Answer both, and never let a process
      defect stand in as a mathematical finding or vice versa. A process-invalid execution
      is not negative evidence about any oracle.
    - >-
      Scope every statement to the tested oracle specifications, the tested toy sizes and
      the model you name. Nothing in this review is evidence for or against ECDLP
      hardness, prime-field ECDLP, index calculus, or KN-OPEN-001.
    - >-
      Record requested_policy review-breakthrough, the resolved model identifier, the
      reasoning effort actually used, model_verified / probe status, fallback_used, and
      equivalence_to_requested_policy_claimed false if any substitution occurred.
  deliverables:
    - >-
      review_report.yaml with snapshot_validation, independence_attestation,
      runtime_receipt, implemented_predicate, uniform_verdict_tables (one per model
      definition tried, all eight subjects, control-gate score under each),
      control_gate_finding, closure_claim_finding, steelman_attempt, per_run_consistency,
      process_findings kept strictly separate from substance, recommended_claim_tier and
      recommended_proof_status ceilings, blocking_objections and non_blocking_objections
      each with a concrete fix, exactly one terminal_verdict from {SURVIVES,
      SURVIVES_WITH_SCOPE_REDUCTION, DOES_NOT_SURVIVE, CANNOT_DETERMINE},
      verdict_rationale, and exactly one recommended_next_action.
    - >-
      adversarial_notes.md giving the strongest available case FOR main's result and the
      strongest case AGAINST it, in that order, stating which one you could not break,
      and naming the one check a third party could run on paper to decide between them.
  artifact_paths:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/reviews/TASK-20260727-002/review_report.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/reviews/TASK-20260727-002/adversarial_notes.md
  write_scope:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/reviews/TASK-20260727-002/
  archived_by: TASK-20260727-004
  inference:
    policy: review-breakthrough
    reasoning_effort: max
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
    note: >-
      review-breakthrough is degradable false in orchestration/model-policies.yaml. A
      cross-backend move that fully meets the max floor is permitted and must be
      recorded with resolved_model_id and probe status; a weaker policy or sub-max effort
      stops the task with a policy-resolution failure and no verdict.
  budget:
    wall_clock_seconds: 3600
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
    - Both artifacts exist and every reviewed path is bound to a resolved commit and a
      SHA-256 computed in this task from Git object content.
    - The independence attestation names non-origination from the EXP-GGM-001 execution
      AND from ESC-20260727-001, and states the REV-20260726-005 / RT-20260726-001
      correlation status.
    - The runtime receipt records the resolved model and effort actually used, and either
      attests the max floor was met or the task stopped with a policy-resolution failure
      and no verdict.
    - simulability_test.py was read and the implemented predicate is stated in one
      sentence.
    - All eight subjects are classified by hand under at least two named single model
      definitions, with the control-gate score reported under each.
    - The steelman rescue attempt is recorded, whether or not it succeeded.
    - Exactly one terminal_verdict is returned, with explicit separate answers on the 4/4
      control gate and on the exponent-1/2 closure claim.
    - Process findings are reported separately from substantive findings, and the report
      states plainly that a process defect is not evidence about any oracle.
    - Nothing under experiments/, ledger/ or knowledge/ was modified, no execution
      occurred, and no record status was changed.
    - The report states plainly that nothing in it is evidence for or against ECDLP
      hardness.
  return_format: Independent YAML review verdict plus a Markdown two-sided adversarial
    reconstruction.
