  title: >-
    Reading (a): read the Maurer-Menezes-Teske body (IACR ePrint 2001/084) at
    source for IDEA-20260922-d11575, recording provenance retrieved, and write
    a reading note on its 25 derived-empty and 20 open cells and the Hess
    obligation
  objective: >-
    Read the body (not only the abstract) of M. Maurer, A. Menezes and E.
    Teske, "Analysis of the GHS Weil descent attack on the ECDLP over
    characteristic two finite fields of composite degree", IACR ePrint
    2001/084, published in LMS J. Comput. Math. 5 (2002) 127-174, at source,
    and answer RA-Q1 to RA-Q4 below for IDEA-20260922-d11575 and its
    consolidated member IDEA-20260922-0e3641. Record every source used with
    provenance retrieved (URL, retrieval date, sha256 of the retrieved file,
    verified_by this task). Write one reading note under this task's
    directory. Edit nothing else.
  uncertainty_reduced: >-
    Whether the published body already settles the record's 25
    derived-empty and 20 open cells and what exactly the Hess obligation of
    its (C1) is, so that HOLD-H can be re-ruled from a source read rather
    than from an abstract and a summariser (DEC-20260924-99ce20 HOLD-H
    evidence).
  questions:
    RA-Q1: >-
      For the cell table of IDEA-20260922-d11575 (its claim and minimal_test
      fields; 25 cells derived empty, 20 open): which cells, or which classes
      of cells, does the MMT body settle, and by which theorem, table, lemma
      or computation? Quote the pointer (section and number) and a short
      passage for each. Cells the body does not settle are listed as not
      settled, with the reason (outside the paper's parameter range, a
      different curve family, a different descent).
    RA-Q2: >-
      State the Hess obligation. Which hypothesis of Hess's generalisation of
      the GHS construction (the record cites KN-LIT-6987) does the record's
      (C1) rely on, and does the MMT body address the collapsed case the
      record's proof_search_map names? Say whether you read Hess at source;
      if not, the Hess content stays recalled.
    RA-Q3: >-
      Compare the genus values the record relayed through a summariser
      (DEC-20260924-99ce20 HOLD-H evidence) with the MMT body's own genus
      formulas or tables, row by row where the record gives a row. A
      disagreement is reported with both values; nothing is corrected in the
      record.
    RA-Q4: >-
      As far as the source allows: does the body state a memory-charged
      comparison against parallel collision search (the van Oorschot-Wiener
      verdict named in HOLD-H's remaining uncertainty), and what does it say?
      Anything the source does not state is reported as not stated.
  record_fields_informed: >-
    IDEA-20260922-d11575 citations (the MMT entry, now ABSTRACT ONLY),
    citation_note, novelty_status basis, proof_search_map (the Hess
    obligation), frontier_check, dominated_by and sota_delta. The note names
    which field each answer informs; it does not edit the record. The closing
    decision DEC-20260929-7257b2 rules on HOLD-H from it.
  inputs:
