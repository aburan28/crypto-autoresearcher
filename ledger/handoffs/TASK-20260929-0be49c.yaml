  write_scope:
    - coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-04a6be/reading/TASK-20260929-0be49c/
  constraints:
    - >-
      RA-1 Read at source. Every source used carries provenance retrieved
      with URL, retrieval date, the sha256 of the retrieved file and
      verified_by TASK-20260929-0be49c. If the body cannot be reached, record
      the impediment with what was attempted; the MMT entry then stays
      ABSTRACT ONLY and the hold stays as recorded. An impediment is never
      negative evidence.
    - >-
      RA-2 Answer RA-Q1 to RA-Q4, each with a section, theorem, table or page
      pointer and a short quotation (a few lines at most), and state for each
      answer which field of IDEA-20260922-d11575 it informs.
    - >-
      RA-3 Edit no proposal, decision, correction or other record. Write only
      reading-note.yaml under this task's directory.
    - >-
      RA-4 Tripwire T2 of DEC-20260924-99ce20. Do not state, as an outcome or
      a finding of this note, that any deployed c2pnb or other standardized
      row sits below its matched rho or that the record's 0.9 to 12.3-bit
      advantages hold. Report what the source states; mark every
      extrapolation beyond it as not supported by the source.
    - >-
      RA-5 Rho comparisons, if any, use the CORR-20260922-81aeab convention;
      any m >= 4 per-attempt budget is D3 of CORR-20260928-4cb669, never D1;
      any per-orbit relation-yield framing is conditional under
      CORR-20260925-649e25.
    - >-
      RA-6 Zero runs. Hand or scripted arithmetic to check a quoted formula
      against a row is permitted, labelled as a check, and its script and
      output are embedded in the note.
    - >-
      RA-7 No AUXIN census value, RUN-FROB value, EXP-FROB-30006a outcome, or
      anything about an EXP-QSP-70b731 run.
