      no-visible-datum claim, the c4(n) bias disclosure, and the reachability
      argument's generality) plus report-writing, without being open-ended.
      Exhausting the wall-clock budget is a BUDGET EVENT under AGENTS.md rule
      5, reported as such, never as a verdict.

  completion_gate:
  - >-
    A strict-YAML report at the declared path dispositions changes E6 and E7 by
    name, and each of the four stated conditions (a)-(d), with either a
    concrete counterexample/reading or a stated "attempted and held" finding
    for each.
  - >-
    The terminal-rung-sufficiency question, the no-visible-datum claim, the
    c4(n) bias-disclosure question, and the reachability-argument-generality
    question are each addressed by name with a concrete finding.
  - >-
    Exactly one overall disposition is returned on the freeze question:
    discipline-preserving, optional stopping in a uniform, or CONDITIONAL with
    the exact conditions under which each holds. A conditional disposition
    that names its conditions precisely is a complete and acceptable
    deliverable.
  - >-
    The report states explicitly whether it constitutes a DISSENT from
    amendment v2's E6/E7 freeze-question defense, since a dissent blocks
    approval per DEC-20260810-5aeeaa what_would_clear_it and
    amendments/v2.yaml validation_required_before_approval.
  - >-
    Independence (session, and model if determinable), scope, and the
    admissibility-only limitation on anything drawn from the targets_uniform
    reference measurement are stated explicitly, per
    standing_control_restatement_v2_verbatim clause (c).
  - >-
    Every finding carries evidence and, where applicable, a concrete successor
    action, and the report states that finding no defect is not a
    certification that none exists.
  - No file outside the declared report was written and no commit was made.

  return_format: >-
    A YAML report at
    coordination/goals/GOAL-ENDO-001/batches/BATCH-d7e255/reviews/TASK-20260810-854c12/red-team-report.yaml
    containing: a per-condition disposition of (a)-(d) for changes E6/E7; a
    named finding on each of the five specific attack surfaces above; exactly
    one overall disposition on the freeze question (discipline-preserving /
    optional stopping / conditional, with conditions named); an explicit
    dissent/no-dissent statement; the independence and provenance block; and a
    findings list, each with evidence, severity, and a concrete successor
    action. Do not approve, amend, or withdraw amendments/v2.yaml -- that is a
    Coordinator act on a later ledger archive, after this report and
    TASK-20260810-c9655a's report both exist.

