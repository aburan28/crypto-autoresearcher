  objective: >-
    THIS IS V2 OF THE TWO VALIDATIONS DEC-20260810-5aeeaa REQUIRES BEFORE
    AMENDMENT v2 MAY BE APPROVED. Red-team the FREEZE QUESTION itself: whether
    extending a declared seed ladder after a stability failure -- under an
    unchanged 5% rung-to-rung threshold, unchanged per-row coverage 259/260,
    unchanged family-wise target 0.05, unchanged mean +- z*sd estimator, a
    declared terminal rung (rung 8, 1536 seeds), and a terminal outcome
    declared in advance in both directions (amendments/v2.yaml changes E6, E7)
    -- is DISCIPLINE-PRESERVING or is OPTIONAL STOPPING wearing a uniform.
    Attack changes E6 and E7 specifically and the argument in
    DEC-20260810-5aeeaa adjudication_item_1.the_freeze_question_confronted_head_on_rather_than_asserted
    and amendments/v2.yaml the_freeze_question_confronted_rather_than_assumed.

  uncertainty_reduced: >-
    Whether the four conditions DEC-20260810-5aeeaa states as necessary for the
    extension to be a different act than widening an interval -- (a) the
    acceptance region is not moved, (b) there is no visible datum to fit
    toward, (c) the amendment is filed before the data it governs exists, (d)
    the ladder is deterministic and terminates at a declared rung with its
    terminal outcome declared now in both directions -- actually hold as
    stated, and whether any of them is weaker than claimed or admits a reading
    under which the extension IS optional stopping despite the declared
    terminal rung. This is the second precondition DEC-20260810-5aeeaa names
    for the amendment ever being approved (what_would_clear_it, V2). It
    resolves nothing about H-INSTR-444c7b, H-ICINV-6c7920, endomorphism
    structure, |D_0|, or ECDLP difficulty -- see scope_and_honesty below.

  independence_requirement: >-
    THIS MUST RUN IN A SESSION THAT DID NOT ORIGINATE THIS CLAIM. It must not
    be the Executor session that produced RUN-INSTR-36c8cf-phaseA-v2-57ca9a and
    must not be the Coordinator session that wrote DEC-20260810-5aeeaa or filed
    amendments/v2.yaml. It should also be a distinct session from
    TASK-20260810-c9655a (V1), since the two validations are required to be
    independent draws, not a single session answering both. Record the session
    identifier, requested policy, resolved model identifier and reasoning
    effort actually used, and state plainly that this supplies SESSION
    independence and not necessarily MODEL independence under this harness's
    fallback (CLAUDE.md model policy note; DEC-20260810-5aeeaa
    inference.fallback_reason).

  standing_control_restatement_v2_verbatim: |-
    SAMPLER CONTROL, VERSION 2. THIS SUPERSEDES THE WORDING "targets_B
    (harness/exp_icinv_fullgroup.py), NEVER targets_uniform" WHEREVER IT APPEARS IN
    A GOAL-ENDO-001 DISPATCH ENVELOPE, HANDOFF OR TASK CARD FROM THIS DECISION
    ONWARD. IT EDITS NO COMMITTED RECORD: DEC-20260810-a4bec4 and every handoff
    already committed stand exactly as written, and this restatement supersedes them
    by reference in the way every correction in this campaign does. It must be
    transcribed VERBATIM into every future dispatch envelope in this campaign that
    draws a target.

    (a) EVERY NEW MEASUREMENT ARM USES exp_icinv_fullgroup.targets_B. targets_uniform
    is PROHIBITED for any new measurement arm, at any density row, in any contract of
    this campaign.

    (b) EXACTLY ONE EXCEPTION, AND IT IS NOT A LICENCE. A RE-MEASUREMENT OF A NAMED
    HISTORICAL REFERENCE RUN, at that run's own frozen parameters, for the sole
    purpose of characterising that run's own sampling variability or checking
    reproduction of it, USES THE REFERENCE RUN'S OWN SAMPLER, identified at run time
    from that run's own record and never assumed. Substituting a different sampler
    makes the object a different estimand and makes the reproduction check vacuous.

    (c) ANYTHING MEASURED UNDER (b) IS AN ADMISSIBILITY QUANTITY ONLY. It may not
    support any within-class, between-class, over-dispersion, curve-side or ECDLP
    claim in either direction, and it inherits the H-ICINV-6c7920 dispute wholesale:
    if that hypothesis is later supported, every quantity measured under (b) is an
    artifact of the sampler and any gate built on it certifies reproduction of a
    historical artifact and nothing more.

    (d) THE r-STRATIFICATION HALF OF THE CONTROL IS UNCONDITIONAL. Every measurement
    is stratified on r = #{x in F_p : x^3 + a x + b = 0} and the strata are reported
    wherever a target is drawn, under (a) and (b) alike. That reporting gates
    nothing.

    (e) AN EXECUTOR THAT FINDS AN ENVELOPE AND A FROZEN CONTRACT IN CONFLICT
    DECLARES THE CONFLICT BEFORE ANY MEASUREMENT, FOLLOWS THE FROZEN CONTRACT, ADDS
    NO UNDECLARED ARM, AND LEAVES THE ADJUDICATION TO THE COORDINATOR. That is what
    RUN-INSTR-36c8cf-phaseA-v2-57ca9a did and it is correct.

  no_compute_authorized_note: >-
    THIS TASK AUTHORIZES NO NEW RUN OF EXP-INSTR-36c8cf OR ANY OTHER
    EXPERIMENT. amendments/v2.yaml (experiments/EXP-INSTR-36c8cf/amendments/v2.yaml)
    is filed and status filed_pending_independent_validation_NOT_APPROVED,
    approved_by null, and stays that way until BOTH the paired validation task
    TASK-20260810-c9655a (V1) and this task (V2) return without dissent AND a
    successor Coordinator decision approves, amends or withdraws it. A DISSENT
    from either blocks approval outright; it is not outvoted. If V1 returns the
    heavy-tail explanation, THE AMENDMENT MUST BE WITHDRAWN RATHER THAN
    APPROVED and the gate's estimator redesigned instead, which is a USER
    decision and not a Coordinator one, because the user selected this gate
    replacement in DEC-20260810-a4bec4; your task is independent of that
    outcome and attacks the freeze question on its own terms regardless of what
    V1 finds. This task itself performs no new measurement, runs no harness
    code that consumes budget against EXP-INSTR-36c8cf's contract, and
    dispatches nothing further; it reads and reasons over already-committed
    artifacts.

