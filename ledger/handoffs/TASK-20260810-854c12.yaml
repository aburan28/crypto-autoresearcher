  constraints:
  - >-
    ATTACK CHANGE E6 (the ladder extension, acceptance-region-untouched) AND
    CHANGE E7 (the termination rule T1-T4) BY NAME. For each of the four
    conditions DEC-20260810-5aeeaa states as necessary -- (a) acceptance region
    untouched, (b) no visible datum to fit toward, (c) filed before the
    governed data exists, (d) deterministic termination with a pre-declared
    outcome -- either exhibit a concrete reading under which the condition
    fails to hold as claimed, or state plainly that you attempted to break it
    and could not, and how you tried.
  - >-
    SPECIFICALLY TEST WHETHER A DECLARED TERMINAL RUNG WITH A PRE-DECLARED
    TERMINAL OUTCOME IS SUFFICIENT TO DEFEAT THE OPTIONAL-STOPPING OBJECTION,
    OR ONLY NECESSARY. Consider concretely: does T2 ("the first rung that meets
    the rule is the accepted rung, and the characterisation stops there")
    combined with a terminal rung actually prevent hull-fitting, or does the
    CHOICE of ladder lengths (12, 24, 48, 96, 192, 384, 768, 1536) itself
    already encode information from having seen rungs 1-3 fail, since the
    ladder was extended rather than replaced with a differently-spaced one
    after seeing the rung-1/2/3 half-widths? Is "we saw the data before
    choosing how to extend, but the extension rule itself does not target any
    specific candidate value" a distinction that holds up, or is it a
    distinction without a difference?
  - >-
    ATTACK THE CLAIM THAT THERE IS "NO VISIBLE DATUM TO FIT TOWARD" (condition
    b). DEC-20260810-5aeeaa bases this on EXP-ICINV-4d33aa being paused with no
    successor Arm A0 measurement existing. Is that claim itself falsifiable
    from committed state, or does it rest on an absence that a red-team pass
    should verify rather than accept? If a candidate value existed anywhere
    else in the campaign that this gate's future acceptance interval could be
    read against, name it; if you find none, state the search you performed.
  - >-
    ATTACK THE DISCLOSED c4(n) BIAS DIRECTION (amendments/v2.yaml E6,
    the_one_direction_of_effect_disclosed_rather_than_hidden): the amendment
    states the sample standard deviation is biased low, shrinking with n, so a
    longer ladder produces a marginally WIDER interval on average (~0.5% from
    rung 3 to rung 8), and that this is "the same direction a hull-fit would
    move" but is disclosed rather than corrected. Does disclosing a
    permissive-direction bias without correcting it undermine SR4 NO WIDENING
    in substance even though no interval is literally widened by an act of the
    Coordinator? Or is an estimator-inherent, data-independent, sub-1% bias a
    different category from an interval widened after seeing a result?
  - >-
    ATTACK THE REACHABILITY ARITHMETIC'S ROLE IN THE ARGUMENT. DEC-20260810-5aeeaa
    argues the 5% rule was "effectively unreachable at 48 seeds by
    construction" (probability ~1.2e-4 at 24->48) and uses this to conclude the
    F4 firing is a protocol artifact rather than a mathematical result. Does
    that argument, if accepted, create a general precedent that a Coordinator
    may retroactively excuse any stopping-rule failure by showing the rule was
    improbable to pass -- and if so, does amendment v2's own terminal-outcome
    declaration (T3) actually close that loophole, or only narrow it to this
    one ladder?
  - >-
    THE STANDING CONTROL ABOVE (standing_control_restatement_v2_verbatim) IS
    BINDING ON ANYTHING YOU CITE FROM RUN-INSTR-36c8cf-phaseA-v2-57ca9a: that
    run's SR3 v3 characterisation measured the reference run's own sampler
    (targets_uniform) under clause (b), and anything you draw from it is an
    ADMISSIBILITY QUANTITY ONLY under clause (c). Your attack is about the
    epistemic structure of the stopping/extension rule, not about any curve or
    class property, and must not be worded as if it were.
  - >-
    NO NEW RUN, NO NEW HARNESS EXECUTION AGAINST EXP-INSTR-36c8cf OR ANY OTHER
    EXPERIMENT CONTRACT. This is a read-and-reason task over committed
    artifacts. You produce no experiments/EXP-*/runs/ artifact.
  - >-
    claim_tier toy on anything you state. NO ATTACK, NO EXPONENT, NO SPEEDUP.
    Nothing in this task's output may be read as bearing on H-ICINV-6c7920,
    EV-ENDO-10109d, endomorphism structure, |D_0|, or ECDLP difficulty in
    either direction; it bears only on whether a Coordinator-set stopping and
    extension rule is methodologically sound.
  - >-
    Never fabricate a command, output, timing, statistic, or figure. A
    quantity you did not verify stays unverified and is reported as such
    (AGENTS.md rule 5).
  - >-
    Do not repair anything you find wrong in DEC-20260810-5aeeaa or
    amendments/v2.yaml. Name the defect, evidence it, and state a concrete
    successor action. You do not change any hypothesis status, approve or
    withdraw the amendment, or edit any ledger, experiment, or run record.
  - >-
    FINDING NO DEFECT IS NOT A CERTIFICATION THAT NONE EXISTS, AND THE REPORT
    MUST SAY SO. A genuine, well-evidenced "I attacked this and it held" is a
    valid and complete deliverable; it is not weaker than finding a defect.
  - >-
    Write only the declared report; make no ledger, queue, protocol,
    experiment, or run edit, and no commit.

