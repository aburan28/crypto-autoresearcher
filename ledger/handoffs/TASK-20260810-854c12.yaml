    memory_gb: 3
    maximum_runs: 1
    total_cpu_hours: null
    budget_note: >-
      COORDINATOR-SET, BOUNDED, NOT DERIVED FROM ANY MEASUREMENT OF THIS
      TASK'S OWN COST. This is a read-and-reason task attacking a
      methodological argument over already-committed text (DEC-20260810-5aeeaa
