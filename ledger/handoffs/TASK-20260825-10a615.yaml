handoff:
  id: TASK-20260825-10a615
  from: coordinator
  to: idea-generator
  objective: >-
    Generate exactly four mechanism-distinct, schema-complete, falsifiable proposals
    for RQ-ECDLP-002 after screening the current ECDLP proposal corpus, hypotheses,
    knowledge records, and the GOAL-ECDLP-001 frontier. Every proposal must identify
    a concrete public object or observable not already covered by the nearest records,
    retain an honest novelty label, and include a cheapest decisive test.
  uncertainty_reduced: >-
    Whether any unfiled public prime-field ECDLP mechanism, representation,
    composition, or decisive control survives current-corpus deduplication and has
    enough structural leverage to merit later Coordinator selection.
  inputs:
    - ledger/questions/RQ-ECDLP-002.yaml
    - ledger/goals/GOAL-ECDLP-001/goal.yaml
    - ledger/goals/GOAL-ECDLP-001/batches/BATCH-4e7dcf/batch.yaml
    - ledger/goals/GOAL-ECDLP-001/batches/BATCH-4e7dcf/dispatch_queue.json
    - ledger/hypotheses
    - ledger/proposals
    - knowledge/open-problems/KN-OPEN-002.md
    - knowledge/open-problems/KN-OPEN-005.md
    - knowledge/open-problems/KN-OPEN-009.md
    - knowledge/open-problems/KN-OPEN-019.md
    - knowledge/findings/KN-FIND-5c1a03.md
    - knowledge/findings/KN-FIND-8f2c90.md
    - knowledge/findings/KN-FIND-b7e091.md
    - knowledge/techniques/KN-TECH-003.md
    - knowledge/techniques/KN-TECH-006.md
    - knowledge/techniques/KN-TECH-080.md
  constraints:
    - Write exactly the four assigned proposal files and do not modify existing records.
    - Use IDs IDEA-20260825-fc85c6, IDEA-20260825-823de4, IDEA-20260825-49129b, and IDEA-20260825-7efa27 exactly.
    - Screen all 106 current RQ-ECDLP-002 proposals plus adjacent ECDLP, Semaev, endomorphism, isogeny, representation, multi-target, and cost-model records before selecting mechanisms.
    - Every idea must include claim, mechanism, nearest-record delta, novelty status, citations with provenance, assumptions, proof_search_map, predictions, minimal test, controls, falsification, confounders, interpretation limits, heuristic assumptions with validation routes, target complexity, complete cost boundary, dominated_by, sota_delta, estimated cost, and priority.
    - Prefer exponent-moving structural ingredients; constant-factor or audit ideas are admissible only when they gate a high-value route and must say so.
    - Every statistical signal requires a same-shape null and a parameter that destroys the proposed structure; every proof-oriented idea requires the four KN-TECH-080 audits.
    - Use novelty_status unverified unless a checked primary source supports a narrower label; recalled citations cannot support novelty.
    - No experiment execution, implementation, hypothesis creation, approval, status transition, knowledge promotion, deployed-system interaction, live-key recovery, or breakthrough claim.
    - No Amazon Bedrock, fallback, or degradation.
  deliverables:
    - IDEA-20260825-fc85c6.yaml
    - IDEA-20260825-823de4.yaml
    - IDEA-20260825-49129b.yaml
    - IDEA-20260825-7efa27.yaml
  artifact_paths:
    - ledger/proposals/IDEA-20260825-fc85c6.yaml
    - ledger/proposals/IDEA-20260825-823de4.yaml
    - ledger/proposals/IDEA-20260825-49129b.yaml
    - ledger/proposals/IDEA-20260825-7efa27.yaml
  archived_by: TASK-20260825-3cfb3a
  inference:
    policy: research-deep
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 3600
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
    - Exactly four assigned YAML proposal records strict-parse and use the assigned IDs.
    - Every record binds to RQ-ECDLP-002 and GOAL-ECDLP-001, remains proposed, and satisfies the idea-generator schema.
    - The four mechanisms are non-overlapping and each names its nearest existing records and exact delta.
    - No experiment, implementation, approval, status transition, knowledge promotion, or scientific result is claimed.
  review_plan: null
