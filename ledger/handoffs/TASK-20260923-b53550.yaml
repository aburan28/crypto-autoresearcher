    PHASE A: make stage R1's layer and both r1 plans durable and hash-bound
    BEFORE stage R2 and before any repaired run (addendum RS-4;
    DEC-20260923-80e280 RC-9 RQ-4). Stage the stage-R1 paths file by file,
