    - id: RA-3
      text: >-
        MERGE origin/main INTO THE BRANCH, NEVER REBASE, before each phase's
        commit; record the base commit and merge outcome in that phase's
        receipt. A conflict inside a record is resolved by a superseding
        record under a new id, never by picking a side.
    - id: RA-4
      text: >-
        AN ARCHIVE IS NOT EVIDENCE AND NOT APPROVAL. H-GFPN-9a29be stays
        inconclusive and HEUR-GFPN-DFLAT untested. Phase B composes, scores
        and interprets nothing.
    - id: RA-5
      text: LAUNCH NOTHING. maximum_runs 0 for both phases.
    - id: RA-6
      text: >-
        PHASE ORDER (DEC-20260923-80e280 RC-9). Phase A runs after
        TASK-20260923-a681f9 returns with outcome completed and releases its
        claim, and is verified and pushed BEFORE stage R2. Phase B runs only
        after TASK-20260923-3aa31e returns (any outcome, including a failed
