      kind snapshot, phase A, source_task_ids [TASK-20260923-a681f9]; the
      PS-1 branch; the filing commit, if any, and parent_sha; path_sha256 for
      every bound file; the three amendment hashes as checked; outcomes of
      verification steps (1)-(7); the origin/main base commit and merge
      outcome; record_ids; the validator outcome; scope findings. The
      receipt never carries its own commit's sha.
    after_phase_a: >-
      Once the post-commit verifier accepts phase A and it is pushed, the
      dispatching Coordinator session appends a BATCH-e409ca revision citing
      this receipt that: records the phase-A commit in this archive's
      `archive.phases`; appends the bound implementation-v2-r1/ files to
      TASK-20260923-a681f9's artifact_paths; appends the 31 run directories
      reserved in trial-plan-v2-r1.json to TASK-20260923-3aa31e's
      write_scope; and sets TASK-20260923-3aa31e from `blocked` to `queued`.
      research_dispatch.py passes on it before it is committed.
    commit_message_must_name: [TASK-20260923-b53550, TASK-20260923-a681f9, EXP-GFPN-05ff43, AMD-EXP-GFPN-05ff43-20260923-paristack, DEC-20260923-80e280]
    completion_gate:
      - verification steps (1)-(6) pass, and any finding from (7) is recorded
      - the phase-A commit changes exactly the bound paths and the receipt (or a documented superset listed in the receipt)
      - the receipt's path_sha256 covers every bound path and matches the committed tree
      - the receipt records the parent, the origin/main base commit and the merge outcome
      - tools/validate_ledger.py on the head reports no error line beyond the base's pre-existing set
      - the branch is pushed and the PR refreshed, naming TASK-20260923-b53550 and TASK-20260923-a681f9
      - no repaired run package exists, and nothing was launched

