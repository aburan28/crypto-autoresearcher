      run files to TASK-20260923-3aa31e's artifact_paths; sets commit_sha,
      parent_sha and full path_sha256 on this archive (binding_mode
      content_first); marks it completed. Then RQ-7 of DEC-20260923-80e280
      applies: only if G1..G4 are completed_valid with gate_pass true and
      REG-1 passed does a revision unblock TASK-20260923-292052; otherwise a
      Coordinator decision records the R2b packages not_attempted.
    commit_message_must_name: [TASK-20260923-b53550, TASK-20260923-3aa31e, TASK-20260923-a681f9, EXP-GFPN-05ff43, AMD-EXP-GFPN-05ff43-20260923-paristack, DEC-20260923-80e280, every staged RUN-GFPN-* id]
    commit_message_note: >-
      Under content_first binding the queue verifier checks that the commit
      recorded in commit_sha (the phase-B commit) names this task and every
      record_id, so phase B's message names all of them.
    completion_gate:
      - stage R2 has returned, and every run directory under a reserved id and execution-report-v2-r1.yaml are staged exactly as returned
      - the phase-B commit changes nothing outside the staged scopes and the post-run receipt
      - the post-run receipt's path_sha256 is in the RC-8 form, covers every staged file and matches the committed tree, and records its parent, origin/main base commit and merge outcome
      - the checker outputs, the REG-1 output check and the reserved-id accounting are recorded verbatim
      - the branch is pushed and the PR refreshed, naming the staged RUN-GFPN-* ids
      - nothing was composed or scored, and no stage-R2b package or reviewer was launched before this gate was met

  verifier_standard: >-
    The dispatching session performs both commits and writes both receipts.
    After each commit, the post-commit verifier re-checks every path_sha256
    in the receipt against the ARCHIVE COMMIT'S TREE (`git show <archive
    commit>:<path>`), and checks that the commit changes exactly the
    declared paths plus the receipt (or a superset the receipt lists), names
    this task and the listed records, and has the parent the receipt records.
    Content binds first. A content mismatch is fatal. A phase is official
    only when the verifier accepts it.

