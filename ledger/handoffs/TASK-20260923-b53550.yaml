      - experiments/EXP-GFPN-05ff43/implementation-v2-r1.md
      - experiments/EXP-GFPN-05ff43/trial-plan-v2-r1.json
      - experiments/EXP-GFPN-05ff43/trial-plan-v2-a1-r1.json
    bound_paths_note: >-
      implementation-v2-r1/ is expanded file by file, and the receipt's list
      must equal the list implementation-v2-r1.md declares. A difference is a
      scope finding and the archive STOPS for a Coordinator decision. The
      paths may be committed in a filing commit before the receipt commit or
      in the same commit; the receipt names which.
    verification_steps: >-
      (1) The three amendment files hash to the DEC-20260923-80e280 RC-1
          values (paristack 856fdc1d...c7; v2 e02d4976...d3; rung31
          2c5e0524...0c).
      (2) The 14 paths of the TASK-20260923-0fa03f phase-A receipt and the 12
          paths of the TASK-20260923-4ff597 phase-A receipt still hash to
          their receipt values, and git status is clean for them. The 344 run
          files of RUN-GFPN-ac4487 and RUN-GFPN-3377f1 still hash to the
          TASK-20260923-0fa03f post-run receipt values.
      (3) No directory experiments/EXP-GFPN-05ff43/runs/<id>/ exists for any
          id reserved in trial-plan-v2-r1.json or trial-plan-v2-a1-r1.json,
          nor for any of the 40 retired ids (the "no repaired package yet"
          sequencing check, RQ-4).
      (4) trial-plan-v2-r1.json reserves 31 ids and trial-plan-v2-a1-r1.json
          11; none is a v1, v2 or v2-a1 id; the id maps form a 42-entry
          bijection; both `watchdogs` objects equal trial-plan-v2.json's;
          protocol_version is "2-r1" / "2-a1-r1"; each records the paristack
          id and sha256, DEC-20260923-80e280, its run card
          (TASK-20260923-3aa31e / TASK-20260923-292052) and the PS-1 branch;
          neither carries TASK-20260923-cd932c or TASK-20260923-6c7f55 as a
          task id.
      (5) If the branch is P-B, implementation-v2-r1.md carries the trigger
          evidence verbatim (addendum lines 309-311). If missing, STOP.
      (6) implementation-v2-r1.md records: the branch, values and API; the
          RC-2 read-back semantics; the RC-3 redirection list; the RC-4
          declared key paths and id maps; the REG-1 exclusion list; the DV-1
          inventory with flags; every DV outcome, including DV-3 reproducing
          the overflow and the RC-6 probe. A missing item STOPS the archive.
      (7) No byte outside the four stage-R1 paths was written by stage R1:
          `git status --porcelain -- experiments/EXP-GFPN-05ff43` shows
          changes only inside them. Untracked byte-code is listed, never
          staged.
