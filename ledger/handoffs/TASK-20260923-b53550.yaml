        releases its claim, and before stage R2b, any review plan or
        reviewer. Each phase runs ALONE and is claimed as coordinator on the
        BATCH-e409ca queue where the queue state admits it; otherwise it runs
        under the card and records that in its receipt.
    - id: RA-7
      text: >-
        After each commit, push the branch and refresh the open PR against
        main (draft PR #1391, or its successor), naming the records. Amazon
        Bedrock is prohibited. No model name in a receipt beyond the
        inference block's resolved binding, which the dispatching session
        records.

