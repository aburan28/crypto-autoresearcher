# =============================================================================
# TASK-20260923-b53550 -- Coordinator SNAPSHOT ARCHIVE of the EXP-GFPN-05ff43
# repair: stage R1 (TASK-20260923-a681f9) and stage R2 (TASK-20260923-3aa31e).
# Two phases are declared up front:
#   PHASE A (after stage R1, BEFORE stage R2 and before any repaired run). It
#     binds by SHA-256 every file of implementation-v2-r1/,
#     implementation-v2-r1.md, trial-plan-v2-r1.json and
#     trial-plan-v2-a1-r1.json, and records snapshot-receipt.json. Both r1
#     plans, and so the whole repaired run set, are fixed here.
#   PHASE B (after stage R2 returns, whatever the outcome; before stage R2b,
#     any review plan or reviewer). It binds by SHA-256 every repaired v2 run
#     package and execution-report-v2-r1.yaml, and records
#     post-run-receipt.json, which aggregate_a1 reads (DEC-20260923-80e280
#     RC-8).
# Reserved by DEC-20260923-c1fb69 R-7. Written by the Coordinator under
# TASK-20260923-b2ab1b (DEC-20260923-80e280). Follows TASK-20260923-0fa03f
# and TASK-20260923-4ff597 (one archival task, two receipted commits). An
# archive is not approval and not evidence. This card edits nothing and
# launches nothing.
# =============================================================================
