    origin/main base commit and the merge outcome, and commit. Every repaired
    manifest then records this commit literally.
    PHASE B: after stage R2 returns, commit every repaired v2 run package that
    exists under the ids reserved in trial-plan-v2-r1.json, and
    execution-report-v2-r1.yaml, exactly as returned, with a post-run receipt
    in the RC-8 form, so that stage R2b and the review read committed,
    hash-bound bytes.

  uncertainty_reduced: >-
    PHASE A: whether the layer and plans that stage R2 and R2b run are
    exactly the bytes stage R1 produced, fixed before any repaired
    measurement. PHASE B: whether the repaired v2 packages that aggregate_a1
    and the reviewers read are the bytes the executor wrote.

