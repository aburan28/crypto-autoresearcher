handoff:
  id: TASK-20260921-aac8e7
  from: coordinator
  to: coordinator
  recorded_at: '2026-09-21'

  objective: >-
    Dispatch an independent adversarial audit (validator + red-team, working
    blind from each other) of the J3 (load-bearing) and J4 (collision-count /
    PTM-2) findings recorded in ledger/decisions/DEC-20260921-d5e997.yaml and
    ledger/evidence/EV-FROB-576872.yaml -- the second /review-evidence round
    on EXP-FROB-91ee9c, decision `weaken`. This is NA-1 of
    DEC-20260921-d5e997.yaml: an audit recommended out of caution given (a)
    that round's own correction of a factual error in its dispatching
    handoff's coordinator_prior (the collision-count block-product claim),
    and (b) the non-obvious, load-bearing "m=1-forced-tie" structural
    argument that round introduced. It is NOT the review_plan's formal
    escalation trigger (reject_scoped/support at strength >=
    replicated/strong is not met by a `weaken` decision at `preliminary`
    strength) -- it is a voluntary strengthening pass, per AGENTS.md rule 9
    ("pursue promising paths in good faith") and the general principle that
    a surprising, load-bearing finding earns independent scrutiny before
    anything (a knowledge promotion, a redesigned experiment, a further
    status change) is built on it.

  uncertainty_reduced: >-
    Whether DEC-20260921-d5e997's J3/J4 resolution -- success_criterion
    clause (6) NOT MET and falsification_criterion clause (c) TRIGGERED in
    both tested cells, with a MIXED (cell-dependent) proves_too_much (PTM-2)
    result that fires on FROB-EQDEG-q19n5 but not FROB-SPLIT-q11n5, and a
    supporting "m=1-forced-tie" structural argument bounding the evidentiary
    weight of the observed ties -- survives independent adversarial scrutiny,
    both mechanically (are the numbers, the collision counts, and the
    algebraic claim actually correct) and interpretively (does `weaken`
    genuinely follow, or does the mixed PTM-2 result argue for a different
    ceiling -- `inconclusive` again, or conversely something stronger --
    or expose a hidden assumption that changes the picture).

  inputs:
    - AGENTS.md (Review architecture; core rules 3, 4, 5, 6, 9)
    - agents/validator.md
    - agents/red-team.md
    - docs/claims-and-verification.md
    - docs/evidence-and-reproducibility.md
    - ledger/hypotheses/H-FROB-d93575.yaml (current status
      weakened_control_battery_spread_ties_and_c2_excess)
    - experiments/EXP-FROB-91ee9c/specification.yaml (FROZEN; controls.C2/C3/C4,
      success_criterion, falsification_criterion, invalidation_rules)
    - experiments/EXP-FROB-91ee9c/amendments/DEC-20260921-e81e25.yaml
    - experiments/EXP-FROB-91ee9c/runs/TASK-20260914-7119f2/ (IMMUTABLE)
    - experiments/EXP-FROB-91ee9c/runs/TASK-20260921-51bc02/ (IMMUTABLE;
      metrics.json, cost-model.json, certificates.json, report.md,
      checker.py, work/checker-report.json are the primary raw evidence for
      this audit)
    - experiments/EXP-FROB-91ee9c/analysis.md (both rounds' content)
    - ledger/evidence/EV-FROB-2fe225.yaml, ledger/decisions/DEC-20260921-3678fc.yaml
      (round 1, for context on the vacuous-tie PTM-2 precedent this round
      distinguished itself from)
    - ledger/evidence/EV-FROB-576872.yaml, ledger/decisions/DEC-20260921-d5e997.yaml
      (round 2 -- THE CLAIM UNDER AUDIT)
    - ledger/handoffs/TASK-20260921-1dba2a.yaml (round 2's review_plan, for
      the original coordinator_prior this round's J4 corrected)
    - experiments/EXP-FROB-91ee9c/review-20260921-round2-attestation.yaml

  constraints:
    - >-
      Neither role changes hypothesis status, edits any ledger record, or
      edits any run artifact. Per agents/validator.md and agents/red-team.md,
      both roles verify/challenge and report; only a subsequent Coordinator
      action (a correction record, a new /review-evidence round, or an
      explicit confirmation note) may change any official record based on
      what you find.
    - >-
      Do not edit specification.yaml, either run directory,
      ledger/evidence/EV-FROB-576872.yaml, ledger/decisions/DEC-20260921-d5e997.yaml,
      EV-FROB-2fe225.yaml, DEC-20260921-3678fc.yaml, this handoff, or
      ledger/handoffs/TASK-20260921-1dba2a.yaml. All are immutable inputs to
      this audit.
    - >-
      BLINDNESS: validator and red-team must not read each other's report
      before writing their own. Both may (and should) independently read all
      the primary sources listed above.
    - >-
      Do not simply re-run the same hand arithmetic a third time and call it
      done -- that quantity (every cost_ratio_neg/spread value, the
      collision counts) has already been independently verified twice (by
      the round-2 coordinator subagent and by the dispatching session). The
      marginal value of this audit is in (validator) verifying the
      MECHANICAL/ALGEBRAIC claims that were NOT separately re-derived by a
      second party -- above all, whether the "m=1-forced-tie" claim is
      actually a mathematical certainty as asserted, by working the algebra
      independently rather than accepting the prose -- and (red-team) in
      INTERPRETIVE challenge: does the evidence actually license `weaken`,
      or does careful reading support a different ceiling.

  deliverables:
    - experiments/EXP-FROB-91ee9c/validation-20260921-round2.md (validator)
    - experiments/EXP-FROB-91ee9c/redteam-20260921-round2.md (red-team)
    - >-
      each report ends with an explicit verdict -- CONFIRMS
      DEC-20260921-d5e997's J3/J4 resolution as recorded | CONFIRMS WITH
      QUALIFICATION (state exactly what changes) | FINDS A DEFECT
      (state exactly what, and whether it changes the decision, the
      strength, or neither)

  artifact_paths:
    - experiments/EXP-FROB-91ee9c/validation-20260921-round2.md
    - experiments/EXP-FROB-91ee9c/redteam-20260921-round2.md

  archived_by: null
  # This handoff is a recommended audit pass, not itself a claim-changing
  # ledger transition. If either report finds a defect requiring a
  # correction, the dispatching session mints a fresh TASK-*/CORR-* id at
  # that point for the corrective action; none is pre-minted here since
  # none may be needed.

  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true

  budget:
    wall_clock_seconds: null
    memory_gb: null
    maximum_runs: 0

  completion_gate:
    - both reports exist with an explicit verdict
    - validator's report shows independent algebraic work on the
      m=1-forced-tie claim (not a restatement of analysis.md's prose)
    - red-team's report explicitly addresses whether `weaken` is the correct
      ceiling given the mixed PTM-2 result, and names the cheapest
      additional check (if any) that would resolve FROB-EQDEG-q19n5's
      ambiguity

  return_format: >-
    Each role reports: its verdict (confirms / confirms with qualification /
    finds a defect), the specific reasoning, and if a defect is found, the
    exact record(s) and field(s) it would change.

  review_plan:
    claim_under_review: >-
      DEC-20260921-d5e997.yaml / EV-FROB-576872.yaml's J3 and J4 findings
      (verbatim, from EV-FROB-576872.yaml observations): J3 -- "success_criterion
      clause (6) is NOT MET in either cell... Falsification_criterion clause
      (c)... is literally TRIGGERED in both cells, via the C3/C4 ties (>=
      includes equality) and additionally via C2 on FROB-EQDEG-q19n5." J4 --
      "proves_too_much PTM-2... (ii) does the collision-count pattern
      reverse... MIXED, cell-dependent: on FROB-SPLIT-q11n5 [argues] AGAINST
      a scale-artifact reading; on FROB-EQDEG-q19n5 the pattern REVERSES...
      which IS the reversal the plan names as a PTM-2 firing condition." Plus
      the structural claim: "the m=1 (coarsest) endpoint of the spread ratio
      is algebraically FORCED to equal the object's for any
      cardinality-matched control... because a single slot's p_1 =
      |B_1|/(N-1) is a pure function of cardinality and N, with no
      possibility of a collision effect when there is only one slot."
      Overall decision: `weaken`, strength `preliminary`.

    coordinator_prior: >-
      Recorded 2026-09-21, before this handoff is dispatched, by the session
      that dispatched round 2's coordinator subagent and independently
      re-verified its arithmetic, collision counts, and the m=1-forced-tie
      argument before accepting and archiving DEC-20260921-d5e997 (so this
      prior is informed by that verification, which already found the
      arithmetic and the algebraic claim sound; it is a prior on whether an
      ADVERSARIAL, differently-motivated pass finds anything the two prior
      confirmatory passes missed, not a blind prior on the raw numbers).
      Prediction: the validator's mechanical audit CONFIRMS J3/J4 as
      recorded -- the m=1-forced-tie claim is a genuine algebraic identity
      (p_1 for a single slot has no summation, hence no possible collision,
      independent of which same-cardinality set is chosen), and the
      collision counts are simple, checkable facts already independently
      reproduced twice. I predict red-team's interpretive challenge is where
      any real friction shows up, and I predict it lands on one of two
      specific points rather than overturning the decision outright: either
      (a) that `weaken` at `preliminary` is in fact the correct, appropriately
      cautious ceiling given the single-run/mixed-PTM-2 posture, and no
      stronger or weaker verdict is defensible from this data alone, or (b) a
      genuinely new point I have not yet considered -- e.g. whether the
      m=1-forced-tie fact means clause (6) was, in a strict sense,
      UNTESTABLE by this experiment's design on any two-achievable-partition
      cell from the start (a scope critique of the experiment, not of this
      review), which would bear on how the "resource_check" reading in
      EV-FROB-576872's obstruction block should be prioritised. I explicitly
      do NOT predict a finding that reverses `weaken` back toward
      `inconclusive` or forward toward `reject_scoped`, since AGENTS.md's
      bar against `reject_scoped` on an unreplicated empirical_only run is
      unaffected by anything this audit could find, and `inconclusive` a
      second time would understate data that was, in fact, successfully
      exercised.

    joints:
      - joint: >-
          J-VALIDATOR: mechanically re-verify (i) every collision count
          (block_sizes, prod_tuple_count, distinct_targets) reported for J4
          directly from RUN-FROB-91ee9c-51bc02/metrics.json's raw data, for
          every ok partition, every arm, both cells; (ii) the m=1-forced-tie
          algebraic claim, worked independently from specification.yaml's
          own definitions of U_neg and p_m(P) rather than accepted from
          analysis.md's prose -- does a single-slot partition (m=1) admit
          ANY possibility of a collision (two distinct points summing, or in
          this case simply BEING, in B_1, that could reduce distinct_targets
          below |B_1|)? State the argument in your own words and check it
          against at least one of this run's own m=1 raw data rows (object
          arm, both cells) to confirm prod_tuple_count == distinct_targets
          there always holds trivially; (iii) that RUN-FROB-91ee9c-51bc02's
          own hash-bindings (manifest.yaml's run.artifacts dict) still verify
          against disk, and that checker.py's independent re-derivations
          (work/checker-report.json) genuinely do not import driver code
          (grep the import statements yourself).
        assigned_to: validator
        attack_plan: >-
          Read metrics.json directly; do not read report.md's summary tables
          as a substitute for the raw `measured` object. Recompute every
          collision count and every m=1/m=2 cost_ratio_neg value
          independently. Work the m=1-forced-tie argument as a standalone
          proof, stated in your own words, before checking it against the
          data.
        breaking_artifact: >-
          Any collision count, cost_ratio_neg value, or hash that does not
          match DEC-20260921-d5e997/EV-FROB-576872's stated numbers, or a
          gap in the m=1-forced-tie argument that the round-2 analysis did
          not disclose (e.g., an edge case where a single-slot partition
          COULD show a collision that the argument overlooked).
      - joint: >-
          J-REDTEAM: interpretively challenge whether `weaken` (rather than
          `inconclusive`, `reject_scoped`, or an unstated fourth reading) is
          the decision the evidence actually licenses, given the mixed,
          cell-dependent PTM-2 result. Identify the cheapest additional
          check (a further control, a redesigned statistic, an extended
          partition lattice, or a purely analytical argument) that would
          resolve FROB-EQDEG-q19n5's ambiguity, and state whether any hidden
          assumption in the C2/C3/C4 control designs themselves (not just in
          this round's application of them) undermines the comparison this
          hypothesis's clause (6) was built to make.
        assigned_to: red-team
        attack_plan: >-
          Read specification.yaml's controls.C2/C3/C4 design text, the
          m=1-forced-tie argument, and both cells' full achievable-partition
          data (only 2 of 15 partitions are `ok` for either tested curve).
          Ask directly: is a 2-point spread statistic, on a control whose
          coarse endpoint is provably tied by construction, EVER capable of
          giving clause (6) a fair test on a cell this sparse -- and if not,
          is that a defect in THIS round's interpretation, or a scope defect
          in EXP-FROB-91ee9c's own design that predates this round and that
          neither round 1 nor round 2 flagged? If the latter, name the
          concrete follow-up (matching or refining EV-FROB-576872's own
          resource_check reading) rather than re-litigating this round's
          arithmetic.
        breaking_artifact: >-
          A textual argument, grounded in specification.yaml's own frozen
          language and the actual achievable-partition data, that `weaken`
          does not follow from the recorded findings -- either because the
          evidence is too thin to weaken anything (supporting a return to
          `inconclusive`) or because it is unambiguous enough to support a
          stronger call than AGENTS.md's single-run bar would otherwise
          suggest (which would itself need to be reconciled with that bar,
          not simply asserted).

    blindness:
      mutual: true
      lifted_for: []
      rationale: null

    proves_too_much:
      objects:
        - >-
          Neither role's own conclusion should be uncritically self-confirming:
          if validator's algebraic argument for m=1-forced-tie, if valid,
          implies NO cardinality-matched control could EVER show a smaller
          spread on a two-partition cell regardless of any real structural
          difference, then the round-2 finding is not merely "weakened by
          ties" but reveals the METRIC itself cannot discriminate on cells
          this sparse -- a stronger, more precise statement than "weaken"
          alone conveys, and validator should say so explicitly if the
          algebra supports it, rather than only confirming the narrower
          claim as originally phrased.
      failure_signature: >-
        A report that merely restates DEC-20260921-d5e997's own reasoning in
        different words, without independently re-deriving the algebra or
        posing a genuine interpretive challenge, has not performed an
        adversarial audit and should not be accepted as satisfying this
        handoff's completion_gate.
      assigned_to: coordinator

    blind_rederivation:
      required: false
      quantity: null
      parameters: >-
        Not required this round: every reported quantity has already been
        independently re-derived twice (round 2's coordinator subagent, and
        the dispatching session before archiving). A third blind numeric
        rederivation of the same values would not add information; this
        audit's value is in independent MECHANICAL/ALGEBRAIC verification
        (validator) and INTERPRETIVE challenge (red-team), per the joints
        above.
      blind_from: []
      assigned_to: null

    procedure_deviations:
      - >-
        PD-1: this is a two-role independent audit (validator + red-team),
        the first non-single-coordinator round in this experiment's review
        history (rounds 1 and 2, TASK-20260921-da0399 and
        TASK-20260921-1dba2a, both disclosed a single-coordinator-subagent
        departure as PD-1). It is dispatched as NA-1 of DEC-20260921-d5e997,
        recommended out of caution rather than required by that decision's
        own escalation trigger.
