handoff:
  id: TASK-20260917-66ec2b
  from: coordinator
  to: executor
  recorded_at: '2026-09-17'
  goal_id: null
  question_id: RQ-QSP-f9bbdb
  experiment_id: EXP-QSP-82a906
  hypothesis_id: H-QSP-411d8f
  kind: experiment_execution
  objective: >-
    Implement and execute the frozen contract
    experiments/EXP-QSP-82a906/specification.yaml (version 1, approved by
    DEC-20260917-f37ca4) exactly as written, and return the observations.
    Run Stage 0 (engine gate: gcc builds a toy; I1 C bit-packed Sylvester
    and I2 independent Python bit-packed Sylvester agree on deg_elim and,
    if emitted, the eliminant up to scalar on the named fixture n=17, m=2,
    d=2, lambda=X^2+X+1, xi=1, K=F_2[z]/(z^17+z^3+1)), Stage 1 (chain
    builder and degree gate: expanded-form identity and per-variable
    degrees 2 and 2d), Stage 2 (the 20 exhaustive seed-free chain cells,
    n in {17, 23}, m=2, d in {2, 3}, the counted non-linearized F_2
    lambda: 2 at d=2 bits {5, 7}, 8 at d=3 bits 8..15), Stage 3 (controls
    C1 four seeded nulls, C2a lambda=X known-collapse forced zero, C2b
    lambda=X+1 translation calibration, C3 agreement matrix over all 28
    algebraic cells), and Stage 4 (the report: d=2 versus d=3 ratios, both
    M(E) columns, censored cells, exact scope, inventor-protocol obstruction
    block with resource_check IF a growing deficit appears). REPORT WHAT
    YOU MEASURED. Do not decide whether H1 holds: that is a Coordinator
    decision on a later review round. Do not interpret H-QSP-645a07 or (E').
  uncertainty_reduced: >-
    Whether the engine-independent eliminant degree of the m=2
    no-Weil-descent chain at the frozen (n, d, lambda) cells is a constant
    fraction of M(E)_paper = 4d as d goes from 2 to 3, or whether a growing
    deficit / far-below collapse is certified at these cells; and whether
    two independent Sylvester implementations agree on every reported cell.
    Before this task the program has an upper-bound cost model and no
    lower-bound measurement; after it, either deg_elim under manifests or
    a localised defect.
  inputs:
    - experiments/EXP-QSP-82a906/specification.yaml
    - ledger/hypotheses/H-QSP-411d8f.yaml
    - ledger/proposals/IDEA-20260916-b84e2d.yaml
    - ledger/questions/RQ-QSP-f9bbdb.yaml
    - ledger/decisions/DEC-20260917-f37ca4.yaml
    - ledger/hypotheses/H-QSP-645a07.yaml
    - ledger/decisions/DEC-20260917-ea9dd2.yaml
    - ledger/evidence/EV-QSP-a6aa4b.yaml
    - ledger/corrections/CORR-20260916-8d0b81.yaml
    - knowledge/literature/KN-LIT-0a321c.md
    - knowledge/literature/KN-LIT-4fe9d2.md
    - knowledge/literature/KN-LIT-096.md
    - inputs/HUANG-2020-JMC-QSP/paper_fulltext.md
    - inputs/EULER-PETIT-2019-QSP/paper_fulltext.md
    - coordination/pending-ideas/BATCH-fe6992/admission/primary-sources/semaev-2004-031.txt
    - analysis/qsp-ecc2k130/explore/gf2rc.c
  constraints:
    - >-
      THE CONTRACT IS FROZEN AT VERSION 1. Execute the cells, lambda lists,
      instruments, seeds, controls, thresholds and metrics exactly as written.
      Any deviation -- a cell dropped, a lambda list silently narrowed, an
      instrument skipped, a seed changed, a threshold adjusted, an n in
      {29, 41} or an m>=3 Groebner cell added -- requires a VERSIONED
      protocol_amendment under experiments/EXP-QSP-82a906/amendments/ authored
      before the affected run, never a silent change and never a retro-fit.
      specification.yaml itself is IMMUTABLE and MUST NOT BE EDITED.
      ECC unlimited is NOT a license to add Groebner cells to this version.
    - >-
      OBSERVATIONS ONLY, NO INTERPRETATION. Report deg_elim, rho_paper,
      rho_note, agreement cells, identically-zero flags, degrees, wall time
      and peak RSS (the last two labelled engine-diagnostic, never as
      evidence for or against H1). Do not write that the hypothesis is
      supported, confirmed, refuted, or proved; do not change any ledger
      record's status; do not write an evidence record; do not promote
      anything to knowledge/; do not interpret H-QSP-645a07 or (E'). The
      pre-registered prediction is not yours to adjust. Do not adjudicate
      which M(E) encoding is "correct": report both columns.
    - >-
      EVERY NUMBER IS PRODUCED BY THIS RUN. analysis/qsp-ecc2k130/explore/gf2rc.c
      MAY be copied into experiments/EXP-QSP-82a906/implementation/ for
      GF(2)[X] helpers with provenance stated. It is a GF(2)[X] root
      counter, NOT a resultant-over-F_{2^n} engine, and is NEVER cited as a
      result. The JSON outputs and README tables of that directory MAY NOT
      be copied into runs/, cited as results, or used to fill a cell the
      run did not compute. Reading a number out of the analysis note and
      reporting it as a run result is fabrication under AGENTS.md core
      rule 5.
    - >-
      TWO INDEPENDENT IMPLEMENTATIONS ARE REQUIRED. I1 is a C bit-packed
      Sylvester over F_{2^n}; I2 is a second, independently authored Python
      bit-packed Sylvester. I2 MUST NOT wrap I1 and MUST NOT import sympy,
      sage, galois, flint, or ntl. They MUST agree on deg_elim (and, if
      both emit it, the eliminant up to a nonzero scalar) on the named
      Stage 0 fixture and on every reported cell (C3). Disagreement STOPS;
      it is infrastructure / invalid, not evidence about H1.
    - >-
      STOP WHERE THE CONTRACT SAYS STOP. Stage 0 fail, Stage 1 degree or
      identity fail, C3 disagreement, C2a returning nonzero, and a certified
      H1-refuting deficit (G1 or G2) at any n each STOP the affected work
      immediately, archive the failing evidence FIRST, and return. A
      certified growing deficit is the most valuable outcome available here:
      archive it, stop further n, and return WITHOUT interpreting (E').
    - >-
      INFRASTRUCTURE IS NOT EVIDENCE. A timeout, crash, memory-cap kill,
      missing compiler, or budget exhaustion is an infrastructure outcome
      (G4/F6, AGENTS.md rule 5). Record it as such with the partial per-cell
      output checkpointed; never report it as a negative mathematical result
      and never estimate, interpolate, or reconstruct a number a run did not
      produce. Missing data stays missing and is reported as missing.
    - >-
      MANIFEST COMPLETENESS IS A GATE, NOT A FORMALITY. Each stage invocation
      writes a manifest carrying every AGENTS.md artifact-policy field: exact
      command; git commit and dirty-tree state; environment and dependency
      versions (including compiler and flags for the C helper, python3
      version, numpy version); inputs, cell definitions, field polynomials,
      seeds and named sub-streams; requested model policy
      (executor-implementation), backend, resolved model identifier and probe
      status; reasoning effort; fallback_used and degraded requirements;
      stdout and stderr; raw machine-readable results; validity status and
      reason; timestamps, wall clock and peak_rss_bytes. Required companions
      on every stage: command.txt, environment.json, stdout.log, stderr.log,
      raw-result.json, manifest_v2.yaml. This experiment RUNS a program,
      unlike RUN-QSP-33b442-S0. Record `requested_policy` alongside the
      resolved model; if they differ, say so with `fallback_used: true` and
      a reason -- never substitute silently.
    - >-
      MACHINE PROTECTION BINDS: 4 GB peak memory, 1 worker, no descendant
      processes beyond the run process itself. The time and CPU estimates are
      ADVISORY (docs/research-budget-policy.md); exceeding them is recorded,
      not forbidden, and needs no further approval.
    - >-
      NO CURVE, NO POINT, NO GROUP, NO KEY. This contract is finite-field
      polynomial arithmetic only. Do not construct a curve, a point, or a
      group anywhere in the implementation. Do not impose a "re-verified by
      curve arithmetic" obligation. A run that does is out of contract and
      invalid.
    - >-
      LAMBDA LISTS ARE COUNTED AND MAY NOT BE NARROWED. d=2 non-linearized:
      bits {5, 7}, count 2. d=3 non-linearized: bits 8..15, count 8. 20
      chain cells. C1: 4 nulls from seed 20260917. C2a: 2 cells, forced
      identically-zero. C2b: 2 cells. Total 28 algebraic cells. Stages 0
      and 1, the 20 chain cells, and C2 are seed-free.
  deliverables:
    - The Stage 0 gate record (gcc toy build, I1 and I2 exist, fixture agreement on deg_elim and eliminant-up-to-scalar), archived before Stage 1 runs.
    - Per-stage run directories with schema-complete manifests and the required companions command.txt, environment.json, stdout.log, stderr.log, raw-result.json, manifest_v2.yaml.
    - Per-cell machine-readable JSON for Stages 2 and 3: one row per chain cell and per control cell with every column named under inputs.stage_2.recorded_per_cell.
    - The I1-versus-I2 AGREEMENT MATRIX (M4) in full, with every disagreeing cell listed if any.
    - The GATE RECORD: pass/fail for Stage 0, Stage 1 degree/identity, C2a forced zero, C3, with archived evidence of any failure.
    - The Stage 4 REPORT, carrying the d=2 versus d=3 ratios, both M(E) columns, every per-lambda value so a reviewer can recompute the median, censored cells, exact scope, and -- IF a growing deficit appears -- the docs/inventor-protocol.md section 4 closure block AND the templates/research-records.md obstruction block with statement, quantity, value with units, measured_by run IDs, scope, and a completed resource_check (examined, reading, spawned_ids). No interpretation of H-QSP-645a07.
    - execution-report.yaml recording per stage what ran, what did not, and why, with unfinished work reported as unfinished and never estimated.
    - The implementation under experiments/EXP-QSP-82a906/implementation/, with provenance stated where code was adapted from analysis/qsp-ecc2k130/explore/gf2rc.c.
