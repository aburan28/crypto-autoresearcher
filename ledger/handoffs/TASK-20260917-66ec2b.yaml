  completion_gate:
    - Stage 0's gate record exists: gcc built a toy, I1 and I2 exist, they agree on the named fixture's deg_elim (and eliminant up to scalar if both emit it), OR F6/infrastructure is reported with the failing step archived.
    - Stage 1's degree gate and expanded-form identity passed, or the failing polynomials are archived and the run stopped before Stage 2.
    - All 20 chain cells and all 8 control cells emit deg_elim from BOTH I1 and I2 (or a recorded identically-zero flag with I3), OR the stage that did not complete is named as unfinished for an infrastructure reason.
    - The I1-versus-I2 agreement matrix is reported; any disagreement is listed cell by cell and the run is declared invalid (F5).
    - C2a returned identically-zero at both n, or the discrepancy is archived and the run is declared invalid.
    - The pre-registered comparison of rho_paper(d=2) versus rho_paper(d=3) is computed at every tested n that completed (the two medians, their ratio, and whether G1/G2 fire), OR the unfinished n is named.
    - Every stage invocation has a manifest carrying every AGENTS.md artifact-policy field plus the required companions; a stage without one is not complete.
    - The Stage 4 report carries both M(E) columns and, if a growing deficit appears, the obstruction block with a filled resource_check; it does not interpret H-QSP-645a07 or (E').
    - execution-report.yaml names every stage that did not complete and why, with no estimated or reconstructed number anywhere in the deliverables.
