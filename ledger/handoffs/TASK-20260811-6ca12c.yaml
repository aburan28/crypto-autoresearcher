handoff:
  id: TASK-20260811-6ca12c
  recorded_at: '2026-08-11'
  from: coordinator
  to: idea-generator
  role: idea-generator
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-aeeb17
  question_id: RQ-CLGP-b99df5
  axis: A2
  axis_title: >-
    The reduction as the deliverable: ECDLP against class-group vectorization in both directions, with quantifier order explicit, or a black-box barrier

  objective: >-
    Generate proposals whose deliverable is A REDUCTION OR A BARRIER THEOREM,
    not a measurement. Lane L11 (RQ-CLGP-b99df5) already asks whether a reduction
    exists between Cl(O)-vectorization and ECDLP on the same class, and expects
    failure because the two problems live on different objects (curves versus
    points). This task inverts the posture: treat the reduction architecture itself
    as the object of study, and pursue BOTH directions.

    Direction 1: does an ECDLP oracle -- for every curve in one isogeny class, or
    for one curve, or for a noticeable fraction -- give any purchase on the
    vectorization problem for Cl(O) acting on that class? Direction 2: does a
    vectorization oracle give purchase on ECDLP? Direction 2 is the one the campaign
    keeps assuming is useless because of T5; state precisely whether that assumption
    is a theorem or a habit.

    THE QUANTIFIER ORDER IS THE WHOLE GAME and it must be written out in every
    proposal: for-all-curves-exists-oracle, exists-curve-for-all-oracles,
    average-case over the class, worst-case, with or without the ability to choose
    the base point, with or without knowing the endomorphism ring. Reductions in
    this area die almost entirely from quantifier slippage, and a proposal that does
    not pin the order is inadmissible.

    A BLACK-BOX BARRIER IS AS VALUABLE AS A REDUCTION AND IS EXPLICITLY IN SCOPE. A
    theorem of the form "no reduction of shape S exists relative to an oracle" is a
    publishable result and is the kind of clean negative with a named obstruction
    that docs/inventor-protocol.md's closure standard accepts. Say which shape S you
    can rule out and by what technique.

    BIND SECTION 8 OF docs/inventor-protocol.md (KN-TECH-080). Any proof-oriented
    proposal carries a proof_search_map: the exact bottleneck, the baseline
    reproduction, the observation-collision search, the quantifier order, the method
    ceiling, and the nearby-object control. These are cheap pre-compute
    falsification checks and a failed audit is often the useful result.

  uncertainty_reduced: >-
    Whether GOAL-ENDO-001 has a live path to a publication-grade result, or
    whether its fourteen-lane decomposition has already enumerated the reachable
    mechanisms and the remaining work is closure. The campaign has 146 committed
    proposals, a gating lane paused on instrument calibration at toy scale, and
    a documented convergence toward negatives. This axis tests one specific
    hypothesis about WHERE a live path could still be: that the lane structure
    is indexed by resource applied to a single curve's point group, and that
    objects outside that indexing have not been systematically generated. A
    well-argued finding that this axis is ALSO closed, with the obstruction
    named, reduces the same uncertainty and is an accepted deliverable.

  seed_note: >-
    Calibrate ambition against docs/target-result-profile.md, whose canonical
    exemplar is Wesolowski's p^{1/3+o(1)} supersingular isogeny result: an
    exponent-moving result on a central hard problem, stated conditionally on
    explicit NUMBERED heuristics, validated at cryptographic scale, and costed
    honestly. That profile is a direction, never a licence to overclaim; the
    evidence rules bind unchanged and claim_tier stays toy.

