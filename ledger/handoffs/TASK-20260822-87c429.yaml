handoff:
  id: TASK-20260822-87c429
  from: coordinator
  to: red-team
  objective: 'Challenge the interpretation and cost model of phase 1: R1 does the seed distribution actually separate seed-lottery from construction-defect from model-defect at the claimed granularity (proves-too-much: run the same criterion against the known-collapsed ANOM-1 S=9 object and against a known-good mixer; R2 does the RC-4 mask-survival argument go through where its conclusion is known false (proves-too-much: the ANOM-1 object); R3 is the cost model honest (seconds claim vs measured wall-clock; does the distribution justify the seed/criterion/construction routing at the recorded granularity)? Plus the blind re-derivation of (1-eps)*2^k at both resolutions.'
  inputs:
  - the snapshot receipt and bound paths
  - the pre-committed review plan (joints R1-R3, proves-too-much objects, blind_from declaration)
  - the Coordinator's recorded prior in the plan (falsifiable prediction about distribution shape)
  constraints: []
  deliverables:
  - coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/reviews/TASK-20260822-87c429/red-team-report.yaml (joint-by-joint findings, proves-too-much outcomes, blind re-derivation result, attestation of reads, requested policy + resolved model)
  artifact_paths: []
  archived_by: TASK-20260822-554f6d
  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 450
    memory_gb: null
    maximum_runs: 2
  completion_gate: []
  review_plan:
    claim_under_review: 'BATCH-ebac02 phase 1: the RC-1 fixed-word-seed distribution (>=100 seeds, MD4 and MD5, 32-bit and 12-bit resolution, CTL-PO5 raw candidate count) and the RC-4 static (y XOR z) mask check, as frozen by the TASK-20260822-b325fe snapshot receipt, and the routing answer (seed vs criterion vs construction) derived from them'
    coordinator_prior: 'I expect the 12-bit distinct_fwd distribution to concentrate at the LOW end (mass on 1..a small constant, far below (1-eps)*2^12), i.e. the collapse is NOT a seed lottery; the F-multiplexer mask kills the free word''s varying bits (the RC-4 mechanism), not the seed choice. Falsifiable: if >= 50% of the >= 100 seeds reach the declared injectivity threshold at 12-bit on either primitive, the batch-5 negative was a seed lottery and the routing flips to SEED -- that overturns the prior and is a first-class result'
    full_plan: coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/review-plan/review-plan-87c429.yaml
    joints:
    - joint: R1
      assigned_to: TASK-20260822-87c429
      attack_plan: 'proves-too-much controls: apply the same criterion to the known-collapsed ANOM-1 S=9 object (must be flagged) and to the known-good null mixer (must pass); if it flags neither or both, the routing answer is void; then check the reported distribution''s shape and confidence at n>=100 against a seed-lottery model at the declared tolerance'
    - joint: R2
      assigned_to: TASK-20260822-87c429
      attack_plan: 'proves-too-much: run the identical (y XOR z) mask argument on the ANOM-1 S=9 construction, where the conclusion is KNOWN TRUE from the blind proof -- the argument must reproduce it from the mask alone; then check against the batch 5 CTL-PO5(b) object (collapse for a reason the mask does not name) to verify necessary-not-sufficient honesty'
    - joint: R3
      assigned_to: TASK-20260822-87c429
      attack_plan: 'cost model: declared 120 s ceilings vs wrapper-measured wall-clock in the manifests; the seconds claim must rest on measured time, not the ceiling; verify the armed deadline would have fired on a 10x slowdown; granularity: does the routing answer (seed/criterion/construction) actually change at the distribution''s confidence, or is the honest output inconclusive-at-n plus a recommended n=X'
    proves_too_much:
      objects:
      - 'ANOM-1 S=9 construction (batch 4): the conclusion ''zero discriminating power over free word9'' is KNOWN from the blind proof; the criterion and the (y XOR z) mask argument must reproduce it, and if they do not, the instruments are not measuring what they claim'
      - 'RC-5 null object (non-multiplexer mixer of the same shape): known NON-collapse; the criterion must pass it and the mask argument must not flag it'
      - 'batch 5 CTL-PO5(b) object: known collapse for a reason the mask argument does not name; tests that the mask argument is stated as necessary-not-sufficient'
      failure_signature: If the criterion flags neither the known-collapsed ANOM-1 object nor the known-good null mixer, or attributes the CTL-PO5(b) collapse to the mask, the routing answer derived from the distribution is void and the report must say so
    blind_rederivation:
      required: true
      quantity: the injectivity threshold count (1 - eps) * 2^k at BOTH 32-bit and window/12-bit resolution, for the declared eps and declared k
      assigned_to: TASK-20260822-87c429
      blind_from:
      - harness/run_md4_seed_sweep.py
      - the run manifests under coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/tasks/TASK-20260822-767bb1/runs/
      - the producer's notes and execution report
