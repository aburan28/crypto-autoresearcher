  constraints:
    - id: CH-1
      text: >-
        ZERO RUN PACKAGES. Nothing is written under
        experiments/EXP-GFPN-05ff43/runs/, under any frozen tree, under
        implementation-v2-r1/, or outside write_scope. Python runs with -B or
        PYTHONDONTWRITEBYTECODE=1. The bundle is extracted to the session
        scratchpad only, never into the repository.
    - id: CH-2
      text: >-
        MACHINE PROTECTION (AC-1). Every msolve child is launched through the
        frozen v2_solver.run_child with cap_bytes 10737418240, set in the
        child and read back with getrlimit (a child that cannot set it
        refuses). One solver process at a time; machine quiet (no other
        solver-like process, v2_solver.other_solver_processes). msolve -t 1.
        If the dispatching session reports a memory-guard threshold below
        12.0 GB, lower the child cap to 2 GB below it and record that. No
        outer guard beyond the dispatching session's declared memory guard;
        each run_child timeout is declared in characterization.md (at most
        600 s per child at these sizes).
    - id: CH-3
      text: >-
        INTEGRITY FIRST (draft CR-5). Before any solve: (a) the bundle's
        sha256 equals TASK-20260923-53a47d's receipt value; (b) the event
        input fx_reg0_torsion_S3_norm.ms extracted from the bundle hashes to
        541b57b904e0c16956f9ea4615a32f1aaaae1cdfe7ca9c3b767f3b5f22d537c8;
        (c) the world A and world B outputs of that solve are found in the
        bundle, with sha256 prefixes d2878f4f2b276162 (A) and
        201812d43b7c7a9d (B), and their full sha256 are recorded; (d) every
        RUN-GFPN-ac4487 file read matches the TASK-20260923-0fa03f post-run
        receipt path_sha256. Any failure of (a) to (d) STOPS the task before
        any solve; the failure is reported and nothing is read as a rate.
        (e) The other 35 toy solver inputs of the world B toy G1 package are
        located in the bundle and hashed. If they are not all there, C-1c
        runs on those that are, and the gap is recorded; this is not a stop.
    - id: CH-4
      text: >-
        THE DESIGN IS FIXED HERE. Solve counts, order and pacing are not
        changed in flight, and no class is re-run to change its count. Each
        solve uses the frozen argv v2_solver.msolve_argv(IN, OUT, threads=1)
        (`-v 2 -t 1 -f IN -o OUT -P 1`, no -c) unless C-3 (c) says otherwise,
        with a fresh output path per solve in scratch.
        - C-3 (b) FIRST: the full `msolve -h` output verbatim, the msolve
          version string, the installed package version, and a search of the
          help text for any seed, random or genericity option.
        - C-1a: the event input, 500 solves, back to back (each starts as
          soon as the previous child is reaped).
        - C-1b: the event input, 500 solves, each started at least 1.1 s
          after the previous child ended.
        - C-1c: each of the other 35 solver inputs of the world B toy G1
          package (byte-identical between worlds per implementation-v2-r1.md
          line 637), 100 solves each, back to back.
        - C-2: each of the 36 RUN-GFPN-ac4487 solver inputs, 100 solves each,
          back to back. Each output is compared with the archived .ms.out in
          bytes and by the parsed comparison of the draft's SE-4 (d).
        - C-3 (a): world A versus world B event outputs from the bundle:
          parsed header (char, nvars, degree, varnames, linform), eliminating
          degree, square-free flag, and a verbatim unified diff of the two
          msolve logs.
        - C-3 (c), DIAGNOSTIC ONLY, NEVER ADOPTED: the event input under
          `-c 0` (200 solves) and `-c 1` (200 solves); each RUN-GFPN-ac4487
          input under `-c 1` (5 solves each). Record outcomes and whether the
          bytes equal the default-flag modal output or the archived
          RUN-GFPN-ac4487 output.
        - C-3 (d), OPTIONAL: if the msolve 0.6.5 source is obtainable (the
          distribution's source package or the upstream release tag), record
          where randomness enters the genericity handling and how it is
          seeded, with file and line, citation provenance `retrieved`. If it
          is not obtainable, say so. Network only through the configured
          proxy. Amazon Bedrock is prohibited.
        - C-4, READ-ONLY CENSUS: across the archived v1 run packages of
          EXP-GFPN-05ff43 and RUN-GFPN-ac4487 / RUN-GFPN-3377f1, count the
          retained msolve logs and, among them, the logs showing the NSP
          signature ("not squarefree", or "Degree of the square-free part: s"
          with s below the printed quotient dimension), by prime and m.
          Report counts only, never a D value. Where logs were not retained,
          say so.
    - id: CH-5
      text: >-
        CLASSIFICATION. Each solve is classified by the frozen
        v2_solver.parse_msolve_log, parse_msolve_param, rational_solutions
        and classify_solve, with n_sub_fail = 0 (substitution is not re-run;
        say so). The NSP signature is exactly the draft's SE-1. Each solve's
        record in solves.jsonl carries: class, input name and sha256,
        repetition index, flags, start and end UTC with microseconds, wall
        seconds, return code and run_child outcome, the child's getrlimit
        read-back, output and log sha256, dimension_of_quotient printed,
        square-free degree, minimal-polynomial degree reported, parse kind,
        header (nvars, degree, linform), eliminating degree and square-free
        flag, classify_solve outcome and reason, NSP flag, and equality with
        the class reference (the archived RUN-GFPN-ac4487 output for C-2;
        the world B output for C-1a/C-1b; the modal output otherwise).
    - id: CH-6
      text: >-
        COMPUTE THE PRE-DECLARED READINGS EXACTLY. From the records, compute
        for each class n_c, x_c and the one-sided 95% Clopper-Pearson upper
        bound u_c, then u_max; S_ub with its derivation from
        trial-plan-v2.json, trial-plan-v2-a1.json and the driver code; K by
        CR-2's formula, or "none" if no k in {2, 3, 4, 5} qualifies; the CR-1
        finding (every instance, with the input and the two solves); and the
        CR-3 branch (d-bytes or d-parsed, with every instance). Report the
        numbers and the instances. Substitute no judgement for a formula and
        make no recommendation on approval.
    - id: CH-7
      text: >-
        RETENTION. solves.jsonl holds every record. distinct-outputs.tar.gz
        holds, per input, one copy of each distinct output byte-string, the
        log of every solve with the NSP signature, the log of every solve
        whose output differs from its class reference, and the C-3 (a) diff.
        Everything else is kept as sha256 only.
    - id: CH-8
      text: >-
        OBSERVATIONS ONLY. No D, degree or quotient dimension is reported as
        a result. Toy values are harness parameters. The 4111 values are the
        archived RUN-GFPN-ac4487 values re-observed, not new measurements.
        Nothing here is evidence about D, the quotient, H-GFPN-9a29be or
        HEUR-GFPN-DFLAT. A finding (an event, a CR-1 difference, a mechanism)
        is reported and is never a STOP. Only CH-3 integrity and the CH-2
        envelope stop the task.
    - id: CH-9
      text: >-
        INTERRUPTION. If a harness or host failure interrupts a class, keep
        the partial records, record the reason, and restart that class ONCE
        from its start under a new label (for example C-1a-r2), keeping both.
        A partial class is reported as partial and is not used in CR-2.
    - id: CH-10
      text: >-
        NO SECURITY STATEMENT; toy public parameters, known-scalar only. No
