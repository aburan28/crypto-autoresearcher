# =============================================================================
# TASK-20260923-6599cf -- EXECUTOR CARD, ZERO-RUN SOLVER CHARACTERIZATION for
# the EXP-GFPN-05ff43 repair. It measures how often msolve 0.6.5, with the
# frozen v2 argv, returns a different outcome on BYTE-IDENTICAL input: at the
# toy input on which stage R1's RC-6 probe stopped (p' = 1033), at the other
# toy inputs of that package, and at the 36 archived inputs of RUN-GFPN-ac4487
# (p' = 4111, whose outputs are already archived and reviewed). It also runs
# diagnostics toward the mechanism and a read-only census of archived logs.
# CREATES NO RUN PACKAGE. Measures nothing about D. Solves nothing at a ladder
# prime, and no fixture, cell, build or anchor system whose outcome is unknown.
# Ordered by DEC-20260923-582d6b (ruling R-3). Written by the Coordinator under
# TASK-20260923-234811. Dispatched later by /run; this card launches nothing.
# Its one archival task is TASK-20260923-683f34.
# =============================================================================
