  authority: >-
    DEC-20260923-582d6b R-3, a committed Coordinator ruling. This card is a
    zero-run DEVELOPMENT task of the repair: it creates no run package, runs
    no protocol package, and changes no protocol. It is NOT authorized by the
    draft AMD-EXP-GFPN-05ff43-20260923-solverevent, which is not approved.
    That draft's `characterization_readings` (CR-1..CR-5) are the formulas
    this card computes; the draft file is read as the definition of those
    formulas, bound by hash from TASK-20260923-4eee3b's receipt.

  objective: >-
    Characterize, under the frozen v2 solver invocation and outcome
    classifier, the per-solve frequency of a differing msolve outcome on
    byte-identical input, in four pre-declared classes (C-1a, C-1b, C-1c,
    C-2); run the C-3 diagnostics and the C-4 census; derive S_ub from the
    frozen plans and code; and compute, exactly as the draft's
    characterization_readings define them, the CR-1 finding, u_max, K (CR-2)
    and the REG-1 (d) branch (CR-3). Report numbers and findings. Decide
    nothing: the approval act (reserved TASK-20260923-ad3016) applies them.

  uncertainty_reduced: >-
    Whether the stage-R1 event is the only kind of msolve nondeterminism on
    these inputs (CR-1), how frequent it is at toy scale and at the archived
    4111 fixture inputs, whether it clusters in time, whether ok outputs are
    byte-stable (CR-3), and, if obtainable, where msolve's randomness enters.
    This fixes the two free parameters of the draft re-solve rule by declared
    formulas, before any repaired solve.

