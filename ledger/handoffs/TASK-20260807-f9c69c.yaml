handoff:
  id: TASK-20260807-f9c69c
  from: coordinator
  to: executor

  activation_status: ACTIVE
  activation_note: >-
    ACTIVE ON FIRST ARCHIVE. This record was drafted at
    NOT_ACTIVE_PENDING_APPROVAL and activated in the same working tree, BEFORE its
    first commit, on the user's approval at the /design-experiment gate on
    2026-08-07. Both acts its draft required are done: (1) the approval decision
    DEC-20260807-1538f8 names EXP-ICINV-fcb497 and fills its `approved_by` /
    `approved_at`; (2) `activation_status` reads ACTIVE here.
    NO SUPERSEDING TASK ID WAS MINTED, AND NONE WAS NEEDED. The draft prescribed
    supersession because it assumed it would be archived before approval; AGENTS.md
    rule 4 binds records from their first archive, and this file had none. Its
    first committed state is the one below. Nothing archived was edited, so nothing
    required superseding -- minting a second TASK id to supersede a file that was
    never published would have put an unreachable id in the ledger.
    An executor may now accept this handoff. It remains bound by the frozen
    contract: the STAGE-0 gate is blocking, an UNRETRIEVED_INFRA outcome is never
    reported as BASE_FIELD, and no protocol change is legal except by a versioned
    amendment under experiments/EXP-ICINV-fcb497/amendments/.

  objective: >-
    Reduce, in this order, three uncertainties that currently sit under several of
    this campaign's cost arguments:
      (U0, THE HARD GATE) Over WHICH FIELD is the square-root Velu Otilde(sqrt d)
      operation count stated -- the field of definition of a kernel generator, or
      the base field? One retrieval and one byte-verified quotation decide whether
      IDEA-20260807-9fb27c's claim (B3) and H-ICINV-82ee6a's cost corollary CC stand
      or are refuted and superseded. THE REFUTING BRANCH IS A PRE-REGISTERED SUCCESS
      OF THE TASK, NOT A FAILURE OF IT, AND IS NOT AN ABORT.
      (U1) What is the toy-scale distribution of m = ord_d(lambda), the extension
      degree of the field of definition of a generator of the kernel of the minimal
      non-scalar endomorphism of an ordinary E/F_p, against a MATCHED null (a
      uniformly random unit mod the SAME d) and a BLOCKING planted control?
      (U2) Does ANY isogeny- or endomorphism-evaluation cost recorded in this ledger
      change its stated EXPONENT under the corrected cost model? Predicted: exactly
      zero. The deliverable is the enumerated table, not the prediction.

  uncertainty_reduced: >-
    Whether the Otilde(sqrt p) "knife edge" -- a square-root Velu evaluation of the
    degree-Theta(p) minimal non-scalar endomorphism that would TIE the 0.886 sqrt(N)
    rho baseline -- is real or illusory, and whether any recorded barrier in this
    campaign is stale. Both are currently UNMEASURED and one of them is a literature
    read.

  inputs:
    - >-
        experiments/EXP-ICINV-fcb497/specification.yaml   # THE FROZEN CONTRACT; read in full first
    - ledger/hypotheses/H-ICINV-82ee6a.yaml
    - ledger/proposals/IDEA-20260807-9fb27c.yaml
    - >-
        ledger/proposals/IDEA-20260807-c36472.yaml        # for the two required barrier-table rows
    - ledger/questions/RQ-ICINV-475b5e.yaml
    - ledger/goals/GOAL-ENDO-001/goal.yaml
    - >-
        ledger/corrections/CORR-20260807-911ef7.yaml      # run-source pinning, BLOCKING
    - ledger/corrections/CORR-20260807-0f5d56.yaml
    - >-
        ledger/corrections/CORR-20260807-a24675.yaml      # no transcribed reference values, BLOCKING
    - >-
        knowledge/literature/KN-LIT-780.md                # STAGE-0 fallback, and see its stated limits
    - analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md
    - docs/inventor-protocol.md
    - docs/claims-and-verification.md
    - docs/target-result-profile.md
    - templates/research-records.md
    - harness/toycurve.py
    - harness/runner.py
    - tools/check_run_source_provenance.py
    - AGENTS.md

  constraints:
    - >-
      THE CONTRACT IS FROZEN. Every threshold, branch, sample size, seed, search
      term and decision rule in experiments/EXP-ICINV-fcb497/specification.yaml is
      pre-registered. Changing any of them requires a versioned protocol_amendment
      under experiments/EXP-ICINV-fcb497/amendments/ filed BEFORE the affected data
      is generated, and NEVER an edit of the specification.
    - >-
      RUN SOURCE MUST BE PINNED. Every run manifest must carry
      `code.source.all_pinned: true` with a sha256 for every repo .py the run
      imported. Verify with
      `python3 tools/check_run_source_provenance.py --experiment EXP-ICINV-fcb497
      --strict` before reporting any run as evidence. An unpinned run is INVALID.
    - >-
      NO TRANSCRIBED REFERENCE VALUES, AT ANY PRECISION. Every quoted number,
      passage, title or cost figure is READ FROM THE PINNED ARTIFACT AT RUN TIME and
      re-verified as an exact byte-substring with recorded offsets
      (CORR-20260807-a24675). This applies with full force to STAGE 0: DO NOT WRITE
      DOWN WHAT YOU BELIEVE THE PAPER SAYS. If you cannot retrieve it, the verdict is
      UNRETRIEVED_INFRA.
    - >-
      EDIT PROHIBITION. harness/exp_icinv.py, harness/exp_icinv_fullgroup.py,
      harness/run_fullgroup.py, harness/run_saturation.py and
      harness/isogeny_class.py MUST NOT BE EDITED OR IMPORTED. Committed runs of
      other experiments must stay reproducible against them byte-for-byte. New
      behaviour goes in harness/velu_stage0.py, harness/exp_kerfield.py and
      harness/run_kerfield.py only.
    - >-
      NO RECORD OUTSIDE YOUR WRITE SCOPE IS EDITED. The barrier table ESCALATES; it
      never corrects. A row with exponent_changed = yes goes into your report and to
      the Coordinator, and the correction path is a new superseding record made only
      by a Coordinator ledger archive (AGENTS.md rule 4).
    - >-
      CONTROLS BEFORE BELIEF. The planted control (d = r^2 - 1, lambda = r, must
      report m = 2) and the matched null are RUN AND WRITTEN TO THE RUN RECORD
      before any distributional statistic is read. A failed planted control makes
      the run set INVALID, not negative, and no null it reports may be cited.
    - >-
      MEASURED AND MODELED NEVER MIX. Every emitted number carries a `basis` field.
      No table or column mixes bases. A table resting on a model is titled "bound"
      or "model", never "prediction" or "measurement".
    - >-
      CLAIM TIER IS CAPPED AT `toy` (GOAL-ENDO-001, RQ-ICINV-475b5e). No
      extrapolation of the measured order distribution to cryptographic p is a
      validated claim; PS-P256 and PS-P384 rows are MODELED and conditional on
      HEUR-ORD-1. Pollard rho with distinguished points (0.886 sqrt(N)) and BSGS
      remain the standing matched cost baselines and are unchallenged; sota_delta is
      ZERO.
    - >-
      TIMEOUTS, CRASHES, OOM AND NETWORK FAILURES ARE INFRASTRUCTURE OUTCOMES and are
      never negative mathematical evidence (AGENTS.md rule 5). An unretrievable
      STAGE-0 source is UNRETRIEVED_INFRA and IS NOT a BASE_FIELD verdict.
    - >-
      NOVELTY AND CITATION FLAGS TRAVEL. IDEA-20260807-9fb27c is
      `novelty_status: unverified`; the Bernstein-De Feo-Leroux-Smith attribution and
      the Erdos-Murty / Kurlberg-Pomerance attributions are
      [unverified -- cited from background knowledge, not read]. Carry those marks
      into every deliverable. STAGE 0's own verdict is the only thing that may
      discharge the first of them, and only on a byte-verified quotation.
    - >-
      GOAL CONSTRAINTS. H-ENDO-001 stays `approved` and is USED as an admissibility
      filter, never re-tested. KN-FIND-b7e091 is BINDING. H-STR-002 stays `weakened`
      with DEFER-BATCH009-001 open; nothing here may bear on it.
    - >-
      YOU OBSERVE; YOU DO NOT DECIDE. Report the emitted terminal states and the
      measurements. Do not change any hypothesis, experiment or proposal status, do
      not write an evidence record, and do not commit. The Coordinator makes the
      snapshot commit, obtains independent validation and red-team review, and only
      then makes a ledger commit and a decision.

  deliverables:
    - >-
      D1 STAGE 0 (RUN FIRST, ALONE). Retrieve the square-root Velu source by curl
      per the frozen URL order, store every byte stream under the run's sources/
      directory, pin each by sha256, extract text, locate EVERY operation-count
      passage with the frozen search terms, record each with >= 400 characters of
      context and byte offsets, re-verify every quotation as an exact substring, and
      emit stage0-verdict.json with a verdict in {KERNEL_FIELD, BASE_FIELD,
      AMBIGUOUS, UNRETRIEVED_INFRA} plus the full quotation tail and the extracted
      title/author comparison against the attribution.
    - >-
      D2 STAGE 1. The barrier table (barrier-table.json and barrier-table.md): one
      row per corpus cost claim over ledger/, knowledge/, analysis/ and docs/, every
      frozen column filled, every quoted cell byte-verified against its artifact with
      sha256 and offsets, INCLUDING the two required rows for
      IDEA-20260807-c36472's Otilde(p^{1/4}) transport figure (carrying its [open]
      mark forward undischarged) and its h ~ p^{1/2} identification cost.
    - >-
      D3 STAGE 2 (CONTROLS, BEFORE ANY MEASUREMENT IS READ). controls.json with the
      planted-control verdict and reported m for every frozen r, and the m = 1
      small-ell rational-eigenspace fixture verdict per (curve, ell) produced by the
      SAME code path as STAGE 3, including the degeneration check of the cost formula
      to Otilde(sqrt ell).
    - >-
      D4 STAGE 3. per-instance-measurements.json and distributions.json across the
      seven-decade ladder at three seeds: the full per-instance table, the per-decade
      and per-conductor-stratum CDFs of log m / log d for the curve-derived and the
      matched-null samples, achieved n, the KS statistic and its critical value.
    - >-
      D5 THE CONCRETE-COST TABLE at PS-TOY-24, PS-P256, PS-P384 and PS-ELL-SMALL,
      with time AND memory columns, `basis` and `bound_kind` per row, the optimistic
      assumptions with the DIRECTION OF THEIR BIAS, the hidden-overhead items named,
      the standing ECDLP baselines beside them, and the affected-vs-safe scope
      statement.
    - >-
      D6 ALL SIX TAIL CHECKS (tail-checks.json), including the analytic-vs-measured
      peak-memory reconciliation.
    - >-
      D7 decision-rule-evaluation.json with the frozen rule's inputs, per-decade and
      per-seed statistics, and the terminal states emitted BY THE RUN ITSELF.
    - >-
      D8 An execution report at
      coordination/goals/GOAL-ENDO-001/batches/<BATCH>/execution/EXP-ICINV-fcb497/execution_report.md
      stating what was run, what was NOT run and why, every deviation from the frozen
      contract with its amendment reference, every defect found (including in your
      own work), and the closure paragraph: named obstruction, argument, forward
      guidance. A negative that names no obstruction and no successor has not
      finished.

  artifact_paths:
    - experiments/EXP-ICINV-fcb497/runs/
    - experiments/EXP-ICINV-fcb497/amendments/
    - harness/velu_stage0.py
    - harness/exp_kerfield.py
    - harness/run_kerfield.py
    - coordination/goals/GOAL-ENDO-001/batches/<BATCH>/execution/EXP-ICINV-fcb497/

  write_scope:
    - experiments/EXP-ICINV-fcb497/runs/**
    - experiments/EXP-ICINV-fcb497/amendments/**
    - harness/velu_stage0.py
    - harness/exp_kerfield.py
    - harness/run_kerfield.py
    - coordination/goals/GOAL-ENDO-001/batches/<BATCH>/execution/EXP-ICINV-fcb497/**
  write_scope_note: >-
    EXCLUSIVE AND EXHAUSTIVE. experiments/EXP-ICINV-fcb497/specification.yaml is
    READ-ONLY to this task. No ledger record, no knowledge entry, no other
    experiment directory and no other harness module may be written. The executor
    does not commit; the Coordinator makes the isolated snapshot commit.

  archived_by: TASK-20260807-f9c69c
  archived_by_note: >-
    PLACEHOLDER, TO BE REPLACED AT ACTIVATION. A producer task may not archive
    itself: workers do not commit into a shared worktree (AGENTS.md, "Durable
    research commits"). At activation the Coordinator assigns a separate,
    Coordinator-owned snapshot archival task id here, and a later, separate ledger
    archival task after independent review. Snapshot archives run alone and before
    review; ledger archives run alone and after it.

  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: true
    fallback_reason_expected: >-
      This Claude Code harness cannot resolve the policy aliases in
      orchestration/model-policies.yaml; every alias falls back to the one model the
      session runs on. Record `fallback_used: true` with the reason in every run
      manifest -- never silently substitute (AGENTS.md rule 11).
    degraded_allowed: false
    independent_session_required: false
    independent_session_note: >-
      Execution does not require an independent session. THE REVIEW OF ITS OUTPUT
      DOES: a separate `review-adversarial` Validator task and a separate Red Team
      task, each in an independent session and neither originating this work, must
      run before any evidence record or Coordinator decision. If STAGE 0 returns
      BASE_FIELD -- a result that contradicts the record that motivated the
      experiment -- that review is mandatory before any statement of it, and the
      Coordinator must consider whether AGENTS.md rule 12 escalates it to
      `review-breakthrough`.

  budget:
    wall_clock_seconds: 7200
    memory_gb: 4
    maximum_runs: 12
  budget_note: >-
    NO BUDGET FIELD IS NULL; this Coordinator rejects its own handoff if any is.
    wall_clock_seconds is PER RUN. maximum_runs 12 = 1 STAGE-0 + 1 STAGE-1 +
    1 STAGE-2 + 7 STAGE-3 decade runs + 2 headroom. total_cpu_hours 6 across the
    task, per the contract's budget block. Exceeding the per-run wall clock stops
    that run with status failed_infrastructure and partial artifacts retained; it is
    never a verdict (AGENTS.md rule 5).

  completion_gate:
    - >-
      G1 Every run manifest carries `code.source.all_pinned: true` and
      `python3 tools/check_run_source_provenance.py --experiment EXP-ICINV-fcb497
      --strict` exits clean. BLOCKING.
    - >-
      G2 stage0-verdict.json exists with a verdict, the pinned source sha256(s), and
      -- for any determinate verdict -- at least one quotation re-verified as an
      exact byte-substring with recorded offsets, plus the full quotation tail.
      BLOCKING.
    - >-
      G3 The planted control reports m = 2 on every frozen r. BLOCKING; failure
      makes the run set INVALID and ends the task with the defect listed, not with a
      result.
    - >-
      G4 The m = 1 nearby-object fixture returns m = 1 (or a declared,
      eigenvalue-derived m = 2) from the SAME code path as STAGE 3, and the cost
      formula degenerates to Otilde(sqrt ell) there. BLOCKING.
    - >-
      G5 At least 5 of the 7 decades yield a distributional verdict at the
      400-instance floor, with the matched null written to the run record BEFORE any
      curve-derived KS statistic is read.
    - >-
      G6 Every instance's d factorisation verifies (product of prime powers = d) and
      every m verifies (lambda^m = 1 and lambda^(m/q) != 1 for every prime q | m);
      every exclusion is recorded with its reason and none is silent.
    - >-
      G7 The barrier table exists with every frozen column filled, every quoted cell
      byte-verified, and the two required rows present.
    - >-
      G8 The concrete-cost table exists at the named parameter sets with time AND
      memory, `basis` and `bound_kind` per row, optimistic assumptions with direction
      of bias, hidden-overhead items, and the affected-vs-safe scope statement. No
      row mixes measured and modeled values.
    - >-
      G9 All six tail checks are reported, including analytic_peak_bytes beside
      measured peak_rss_bytes with their ratio.
    - >-
      G10 decision-rule-evaluation.json reports exactly one measurement outcome and
      exactly one audit outcome, emitted by the run itself and not selected
      afterwards.
    - >-
      G11 The execution report names every deviation with its amendment reference,
      every defect including any in the executor's own work, and a closure paragraph
      with a named obstruction, an argument and forward guidance.

  return_format: >-
    A single execution report at the path in D8, plus a short reply naming: the
    STAGE-0 verdict and the sha256 of the artifact it rests on; the planted-control
    and m = 1 fixture verdicts; the per-decade median of log m / log d and the KS
    statistics with their achieved n; the barrier-table exponent-changed and
    undetermined counts; the emitted terminal states; the `all_pinned` status; and an
    explicit list of anything NOT done and why. STATE REFUSALS AND DEFECTS PLAINLY;
    do not design around them silently. You report observations only -- no status
    change, no evidence record, no commit.

