handoff:
  id: TASK-20260807-b91e6c
  from: coordinator
  to: executor
  objective: >-
    Produce the reach-map table required by EXP-MLKEM-9d41b6: for each of the
    two alpha normalisation conventions and each rank k in {1,2,3,4} (k=1 is
    the forced degeneracy gate, k in {2,3,4} are FIPS 203's deployed
    ML-KEM-512/768/1024 ranks), state a reach/does-not-reach/condition-violated
    verdict for the DCP -> Regev (KN-LIT-21383c) -> BKSW (KN-LIT-4706) ->
    IP-M-EDCP (KN-LIT-1744) reduction chain against FIPS 203's actual (k, n,
    q) parameters, with every number traced to a specific theorem/page in one
    of the three primary sources or FIPS 203 itself. Q1 (whether Simon 2026's
    proof, KN-LIT-e204ab, is correct) is explicitly OUT OF SCOPE and must not
    be touched, adjudicated, or assumed correct beyond the granted input
    parameters named in the experiment contract.
  uncertainty_reduced: >-
    Whether the published reduction chain, granting Simon 2026's claimed
    parameters without adjudicating them, reaches FIPS 203's deployed
    Module-LWE parameters -- currently unaddressed by any ledger or knowledge
    record (KN-OPEN-8a5965's Q2).
  inputs:
  - ledger/hypotheses/H-MLKEM-7f3a2c.yaml
  - experiments/EXP-MLKEM-9d41b6/specification.yaml
  - knowledge/literature/KN-LIT-21383c.md
  - knowledge/literature/KN-LIT-4706.md
  - knowledge/literature/KN-LIT-1744.md
  - knowledge/open-problems/KN-OPEN-8a5965.md
  - knowledge/techniques/KN-TECH-d1bc4f.md
  constraints:
  - >-
    FOLLOW EXP-MLKEM-9d41b6's specification exactly, including its
    stopping_rules (STOP-1: reproduce the flagged Q = k*n^{c+1}, c>=12
    example from primary sources before computing any new reach-map number,
    or STOP and report the discrepancy; STOP-2: run and pass the k=1
    degeneracy gate before reporting any k>=2 verdict, or STOP and report the
    discrepancy).
  - >-
    PRIMARY-SOURCE FILE PATHS, RE-VERIFY BEFORE RELYING ON THEM. The
    hypothesis's earlier draft cited these under a `downloads/` path that
    does not exist in this repository (0 hits via `git ls-tree -r
    --name-only HEAD | grep -c '^downloads/'`) -- the KN-OPEN-3f7a21
    corpus-integrity pattern. The corrected paths are OUTSIDE this repository:
    /Volumes/SSD990/research/10770194.pdf (KN-LIT-4706, previously confirmed
    valid PDF, 463170 bytes) and /Volumes/SSD990/research/2026-155.pdf
    (KN-LIT-1744, previously confirmed valid PDF, 1229350 bytes). Confirm
    both resolve and are the papers they claim to be BEFORE using them; if
    either has moved or does not match, STOP and report immediately rather
    than substituting a secondary summary. KN-LIT-21383c (Regev 2004) needs
    no local file: use its DOI (10.1137/S0097539703440678) or arXiv
    cs/0304005.
  - >-
    SOURCE-BLOCKED DISCIPLINE. Any parameter transformation not traceable to
    a specific theorem/page in KN-LIT-21383c, KN-LIT-4706, or KN-LIT-1744 is
    marked SOURCE-BLOCKED explicitly in the output table, never inferred or
    filled from KN-OPEN-8a5965's or KN-TECH-d1bc4f's paraphrase (pointer
    records only, not citable sources per the experiment contract).
  - >-
    NO CODE, NO NUMERICAL SIMULATION, NO LATTICE COMPUTATION. This is a
    literature-arithmetic and citation-tracing task only, per
    EXP-MLKEM-9d41b6's implementation field and memory_accounting.applicable:
    false.
  - >-
    Q1 (Simon's proof correctness) is out of scope. Do not adjudicate it, and
    do not let a reach verdict be read or written as bearing on it. The
    required_artifacts include an explicit Q1-noninterference confirmation
    for this reason.
  - >-
    Report both-convention results independently per the both_conventions_
    sweep control; do not resolve a disagreement between conventions by
    picking one -- report the disagreement itself as specified in
    falsification_conditions F3.
  - >-
    Write only within this task's declared write_scope. Do not edit
    ledger/hypotheses/H-MLKEM-7f3a2c.yaml, experiments/EXP-MLKEM-9d41b6/specification.yaml,
    or this handoff record. Do not touch any ledger, goal, or knowledge
    record; only the Coordinator changes official status (AGENTS.md rule 1).
  deliverables:
  - >-
    A run report at experiments/EXP-MLKEM-9d41b6/runs/RUN-MLKEM-<token>.yaml
    (or equivalent immutable run artifact under runs/) containing the
    reach-map table (convention x k -> Q, alpha, dimension, reach verdict),
    full citations for every number or an explicit SOURCE-BLOCKED marker, the
    k=1 degeneracy-gate result with derivation, the reproduced (or
    discrepancy-reported) Q = k*n^{c+1} c>=12 example, and the explicit
    Q1-noninterference confirmation -- i.e. every item in
    EXP-MLKEM-9d41b6.required_artifacts.
  - >-
    If either stopping rule triggers, a run report stating the STOP, the
    exact discrepancy found, and where it was sought, with no further
    reach-map computation attempted.
  artifact_paths:
  - experiments/EXP-MLKEM-9d41b6/runs/
  archived_by: TASK-20260807-b91e6c
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 0
    memory_gb: 0
    maximum_runs: 1
  completion_gate:
  - >-
    EXP-MLKEM-9d41b6.success_criterion is met: a reach map exists per
    convention (2 conventions) at each of k in {2,3,4} plus the k=1 gate,
    every number traced to a specific theorem/page in a primary source or
    FIPS 203, and the c>=12 example is either reproduced from source with its
    exact exponent and origin step, or its discrepancy from the claimed value
    is explicitly reported -- with no silent third outcome.
  - >-
    OR, if a stopping rule fires first: the STOP is reported with the exact
    discrepancy and no further reach-map computation was attempted, per
    EXP-MLKEM-9d41b6.stopping_rules.
  return_format: >-
    A single run artifact (YAML) under experiments/EXP-MLKEM-9d41b6/runs/,
    plus a short prose summary in the task's own report suitable for
    Coordinator review -- no ledger record is written or modified by the
    executor.

  budget_note: >-
    Zero compute budget, single literature-arithmetic pass -- matches
    EXP-MLKEM-9d41b6.budget exactly (wall_clock_seconds_per_run: 0,
    total_cpu_hours: 0, maximum_runs: 1). No field left null: reading time is
    real but is not tracked as compute per the experiment contract's own
    justification.
