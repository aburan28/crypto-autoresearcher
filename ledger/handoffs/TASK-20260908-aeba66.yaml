  objective: >
    Implement and execute the frozen, APPROVED contract
    EXP-ECRANK-52d039 version 1 (experiments/EXP-ECRANK-52d039/
    specification.yaml; status approved, approved_by coordinator, per
    DEC-20260908-d5057a) EXACTLY as written. Three enumerated runs in
    the frozen order. R1, the abstract gate, control admission first,
    C1 (A0, the zero-width identity matrix) must return INDEPENDENT
    with all pivot lower bounds exactly 1 and determinant 1 before any
    other reading; then the 29 frozen object-width runs over the
    machine-verified abstract object set (A1 at widths 2^-10 and
    2^-30; A2 on the width schedule w(n) = 2^-10 * 4^-n for n = 0 to
    16, reporting (n*, n_cert) with n* computed at run start by the
    INDEPENDENT verifier implementation; A3 at both widths with the
    explicit positive definite box member re-derived at run start; A4
    the inward-rounded known-false object, which must be REJECTED by
    the enclosure-derivation check; G_dep under the three frozen
    order permutations at both widths, which must never return
    INDEPENDENT), with the C6 producer-verifier exact agreement and
    blind re-derivation on every run. R2, the elliptic interface gate,
    selects the named curve by the frozen candidate-list rule (first
    candidate passing all four run-start exact checks, every check for
    every candidate archived), derives C(E) exactly with every
    inequality an exact rational check, blind-re-derives C(E) in the
    independent verifier, then certifies O1, the singleton {P}
    grounded by the Mazur non-torsion control (never by the
    certificate), over n = 0 to n_max = 60, and runs O2, the pair
    {P, 2P} dependent by exact construction, which must never return
    INDEPENDENT at any n, with the comparison-only floating regulator
    cross-check whose positive determinant on O2 is the pre-
    registered collision event, recorded and never read into a
    verdict. R3 replays R1 and R2 in a fresh process and must
    reproduce every verdict, pivot lower bound, n_cert, n*, the C(E)
    value, and the certificate witness bytes bit-for-bit. The frozen
    contract is the ONLY protocol. The Executor records observations
    only, interprets nothing, selects no interpretation branch, uses
    no hypothesis language in run records, and changes no status.
  uncertainty_reduced: >
    Whether the rational interval Schur witness is sound at abstract
    scale (M-A, the four controls plus zero unwitnessed or dependent-
    object INDEPENDENT verdicts); whether its certification power
    meets the independently derived sufficient bound (M-B, the
    (n*, n_cert) pairs and the n_cert <= n* theorem of the stated
    mechanism); and whether the elliptic interface works end to end on
    one small named curve (M-C, the exact C(E) derivation, the O1
    certification at a reported n_cert, the O2 never-certified
    property, and the cross-check sign agreement). This task records
    measurements; it decides nothing.
  inputs:
