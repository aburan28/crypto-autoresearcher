handoff:
  id: TASK-20260830-4bf73d
  from: coordinator
  to: executor
  objective: >-
    Execute the FROZEN, coordinator-approved contract EXP-MONO-c819ba
    exactly as written: verify the exact second-moment identity for
    factor-base decomposition counts (Var_R N_m(R) = character-sum
    formula), and measure the normalized character bias of the real
    x-coordinate factor base against a matched random symmetric subset.
    Record observations only; render no verdict on H-MONO-663fb4.
  uncertainty_reduced: >-
    Whether the "relation-rate half" of KN-OPEN-009 is governed by the
    factor base's own character bias (a subset-uniformity question)
    rather than by the summation cover's monodromy (H-MONO-45183a's
    question, already tested in EXP-MONO-12ce1c), and whether the real
    x-coordinate factor base is statistically indistinguishable from a
    matched random symmetric subset at toy scale.
  inputs:
    - >-
      experiments/EXP-MONO-c819ba/specification.yaml (READ IN FULL — it
      is extremely detailed and nearly self-sufficient, matching the
      rigor of EXP-MONO-12ce1c's own contract; follow it literally)
    - ledger/hypotheses/H-MONO-663fb4.yaml (the full derivation — mechanism steps 1-7)
    - ledger/evidence/EV-MONO-a0a89c.yaml
    - ledger/proposals/IDEA-20260803-ff7415.yaml
    - knowledge/open-problems/KN-OPEN-009.md
    - AGENTS.md
  constraints:
    - >-
      Follow experiments/EXP-MONO-c819ba/specification.yaml EXACTLY; it
      is frozen. Every construction procedure (prime, curve, factor base,
      seed derivation) is specified as an exact, reproducible algorithm —
      implement it literally.
    - >-
      STAGE 0 (m=1, m=2 exact identity gate) IS A HARD, NEAR-ZERO-COMPUTE
      GATE. Verify both identities exactly on the frozen fixture cell
      BEFORE any curve-construction or census code runs. A failure means
      STOP — the derivation is wrong, report prominently, escalate per
      AGENTS.md rule 12, do not proceed.
    - >-
      STAGE 1 (reading the seven relayed records: KN-FIND-007,
      KN-FIND-d4f820, KN-FIND-4c9e71, DEC-20260804-0a4bc2,
      DEC-20260804-4f3a3b, DEC-20260804-53c89f, DEC-20260804-f320c2) is
      MANDATORY and must produce VERBATIM QUOTATIONS, not paraphrase —
      or an explicit `not_obtained` disposition per record if it cannot
      be located. If KN-FIND-007's conservation mean turns out NOT to be
      the ordered mean F^m/N under any convention, STOP — the
      identification of N_m with the relation event is wrong and no
      measurement may be interpreted until this is flagged.
    - >-
      THE SUBGROUP-AVAILABILITY PRECONDITION (at least two panel curves
      with #E(F_p) admitting index-2 and index-4 subgroups) IS A HARD
      PRECONDITION. If unmet, the positive control does not exist and NO
      ARM MAY BE INTERPRETED — report this explicitly rather than
      running a degraded version.
    - >-
      THE ORDERING CONTROL IS MANDATORY: both positive controls, the
      calibration control, and the complete matched-null arm (>=30 draws
      per cell) must be generated, computed, and SHA-256-committed BEFORE
      any treatment cell is computed.
    - >-
      REPORT BOTH THE ORDERED AND MULTISET CONVENTIONS AT EVERY CELL.
      Never report one alone (this is an explicit invalidation rule).
    - >-
      NEVER REPORT A RAW STATISTIC WITHOUT ITS MATCHED-NULL RATIO — this
      is an explicit invalidation rule the contract names as the specific
      failure mode (166 of 229 prior evidence records in this program
      allegedly have no null anywhere) this design exists to avoid.
    - >-
      THE m=1 CALIBRATION CONTROL IS DECLARED NON-DISCRIMINATING IN
      ADVANCE AND MUST BE EXCLUDED FROM THE PRIMARY METRICS. Its passing
      may never be reported as a null result.
    - >-
      TARGETS ARE EXHAUSTIVE (ALL R in E(F_p)), never sampled — the
      contract explicitly forbids target sampling to avoid injecting
      estimation error into the primary metric.
    - >-
      No hypothesis, experiment, or goal status change. No ECDLP attack,
      cost, exponent, or cryptographic-scale claim of any kind. No
      adjudication of the corpus's disputed alpha/max-C values — report
      what Stage 1 finds, verbatim, never resolve the disagreement.
    - >-
      Any timeout, crash, construction failure, or dual-path disagreement
      is `failed_infrastructure`/`invalid`, never negative mathematical
      evidence (AGENTS.md rule 3).
    - "Exactly 2 runs, seeds 20260805 and 20260806 per the contract's own `replication`."
  deliverables:
    - experiments/EXP-MONO-c819ba/implementation.md
    - experiments/EXP-MONO-c819ba/implementation/ (source code)
    - experiments/EXP-MONO-c819ba/runs/RUN-MONO-c819ba-1/
    - experiments/EXP-MONO-c819ba/runs/RUN-MONO-c819ba-2/
