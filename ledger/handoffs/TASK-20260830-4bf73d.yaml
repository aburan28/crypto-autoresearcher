    - experiments/EXP-MONO-c819ba/implementation/
    - experiments/EXP-MONO-c819ba/runs/RUN-MONO-c819ba-1/
    - experiments/EXP-MONO-c819ba/runs/RUN-MONO-c819ba-2/
  archived_by: TASK-20260830-cf3c8d
