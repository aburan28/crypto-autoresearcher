handoff:
  id: TASK-20260722-201
  from: coordinator
  to: idea-generator
  objective: Map current ML-KEM attack baselines and propose one novelty-screened algorithmic mechanism.
  uncertainty_reduced: Whether any concrete mechanism plausibly improves attack complexity beyond estimator tuning.
  inputs:
    - ledger/goals/GOAL-MLKEM-001.yaml
    - ledger/questions/RQ-MLKEM-001.yaml
  constraints:
    - Separate established literature, derivation, speculation, and proposed tests.
    - Cite primary sources and charge all material costs.
    - Make no breakthrough claim or official state change.
  deliverables:
    - baseline_map.md
    - candidate_report.yaml
  artifact_paths:
    - coordination/goals/GOAL-MLKEM-001/batches/BATCH-001/tasks/TASK-20260722-201/baseline_map.md
    - coordination/goals/GOAL-MLKEM-001/batches/BATCH-001/tasks/TASK-20260722-201/candidate_report.yaml
  archived_by: TASK-20260722-202
  inference:
    policy: research-sol-max
    fallback_allowed: true
    independent_session_required: false
  budget:
    wall_clock_seconds: 2400
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
    - Baselines, novelty screen, assumptions, predictions, costs, and a falsification gate are explicit.
  return_format: Write only the two declared artifacts and return a short receipt.
