handoff:
  id: TASK-20260724-235
  from: coordinator
  to: executor
  objective: Implement and run frozen EXP-MLKEM-003 within the four-run laboratory hardened-gate budget.
  uncertainty_reduced: Whether the widened multi-class generator retains detection of the known wolfSSL v5.9.1 defect while finding no reproducible silent index and no equal-length decapsulation accept in wolfSSL post-fix backends or in an independent open-source ML-KEM implementation.
  inputs:
    - experiments/EXP-MLKEM-003/specification.yaml
    - wolfSSL v5.9.1-stable and v5.9.2-stable
    - One additional open-source ML-KEM implementation selected by the frozen preference order
    - experiments/EXP-MLKEM-002 harness structure and established silent sets
  constraints:
    - Do not interpret results, change hypothesis status, or rank outcomes beyond the frozen precedence
    - Stop and escalate immediately on any reproducible silent index or accept outside the known v5.9.1 defect; construct no exploitation path, publish nothing, contact no third party
    - No key recovery, oracle construction, query chaining, or attack-cost estimation
    - No deployed system, network peer, or third-party key
    - Never modify library comparison logic, buffer lengths, or dispatch conditions
    - Issue no conformance verdict for a backend lacking a decapsulation-boundary measurement
    - Never count a malformed-length result as a comparison omission
    - Name and grade the conformance anchor, and record the exact retrieval attempts if only a weak anchor is available
    - Record requested_policy executor-terra and resolved model cursor-grok-4.5-high with fallback_used true
    - Stay inside write_scope experiments/EXP-MLKEM-003 and keep clones and build trees under /tmp
  deliverables:
    - All required_artifacts listed in the frozen specification
    - experiments/EXP-MLKEM-003/execution-report.yaml
  artifact_paths:
    - experiments/EXP-MLKEM-003/execution-report.yaml
  archived_by: TASK-20260724-236
  inference:
    policy: executor-terra
    requested_policy: executor-terra
    resolved_model: cursor-grok-4.5-high
    fallback_allowed: true
    fallback_used: true
    independent_session_required: false
    note: User directed remaining work onto Cursor Grok 4.5; record fallback_used true versus executor-terra.
  budget: {wall_clock_seconds: 5400, memory_gb: 4, maximum_runs: 4}
  completion_gate:
    - Exactly four terminal schema-complete runs
    - Positive control detection reported per generator class
    - Negative harness reported before any library-build conclusion
    - Anchor named and graded strong or weak with attempts recorded
    - Every conformance verdict names an attested backend, a resolved commit SHA, and a decapsulation-boundary measurement
    - Malformed-length results confined to their own table
    - Unique outcome classification under frozen precedence
  return_format: Write only under experiments/EXP-MLKEM-003 and return a receipt.
