# TASK-20261001-1181dd
# Executor handoff for EXP-BINSTD-becc4b. Written with archived_by bound.
# Not dispatched in the design session that authored it.
handoff:
  id: TASK-20261001-1181dd
  from: coordinator
  to: executor
  objective: >-
    Implement the two independent factorisations required by
    EXP-BINSTD-becc4b and execute exactly two runs, one per implementation,
    producing the certificate artifacts. Reduce the uncertainty in whether
    T^k - 1 over F_{2^16} has the preregistered degree multisets and whether
    each published Order is prime and coprime to the published cofactor.
  uncertainty_reduced: >-
    Whether the preregistered Part 1 census matches exact factorisation and
    the parsed curve orders, or fails a named row, or fails as an instrument.
  inputs:
    - experiments/EXP-BINSTD-becc4b/specification.yaml
    - ledger/hypotheses/H-BINSTD-336b2d.yaml
    - ledger/decisions/DEC-20261001-327951.yaml
    - analysis/binstd-curve-audit/binary-curve-params.txt
    - analysis/binstd-curve-audit/audit-certificate.txt
  constraints:
    - Do not edit experiments/EXP-BINSTD-becc4b/specification.yaml or the hypothesis.
    - maximum_runs is 2. One run per implementation. No third attempt presented as a replacement.
    - The two factorisation modules must not import each other.
    - Do not enumerate curve points and do not attempt a discrete logarithm.
    - Parse Order and Cofactor from the parameter file. Do not hard-code the Order integers from memory.
    - Public synthetic and published curve parameters only.
    - Amazon Bedrock is prohibited.
    - Write only under the declared write_scope.
  deliverables:
    - experiments/EXP-BINSTD-becc4b/implementation/ factor and checker modules
    - two run directories under experiments/EXP-BINSTD-becc4b/runs/ with the required artifacts
    - a short implementation note stating that the modules do not import each other
  artifact_paths:
    - experiments/EXP-BINSTD-becc4b/implementation/
    - experiments/EXP-BINSTD-becc4b/runs/
  write_scope:
    - experiments/EXP-BINSTD-becc4b/implementation/
    - experiments/EXP-BINSTD-becc4b/runs/
  archived_by: TASK-20261001-8de567
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: null
    memory_gb: 2
    maximum_runs: 2
  completion_gate:
    - Exactly two run directories exist, each with manifest, command, stdout, stderr, raw-result.json, and certificate.yaml.
    - The F_2, k = 17 control is present in both certificates and reports irreducible count 3, or the run is marked invalid for that reason.
    - specification.yaml is byte-unchanged.
    - No discrete-log or point-decomposition output is claimed.
  return_format: >-
    Paths of both runs, whether implementations agreed, and the per-curve
    pass, fail, or invalid label. Do not promote the hypothesis.
  review_plan: null
  dispatch_preconditions:
    - >-
      TASK-20261001-8de567 snapshot receipt verifies against the design commit
      before this card is dispatched. Dispatch with archived_by still unverified
      is forbidden.
    - The declared inputs are committed and pushed.
    - >-
      No goal_id is set on EXP-BINSTD-becc4b, so there is no goal lane to
      claim. If a later batch attaches this experiment to a goal that already
      has a live lane, claim through tools/goal_lanes.py before launch.
