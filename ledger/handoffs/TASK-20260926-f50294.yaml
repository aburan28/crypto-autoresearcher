  objective: >-
    (J7) Decide whether the archived J6 output agrees with RUN-CERTBIN-a3fc60
    on every compared quantity for all 90 blind systems; whether every blind
    wdag-v1 and ann-v1 checks under your own minimal checker; and whether the
    archived J1 output agrees with the run's certificate-verification.json and
    annihilator-verification.json and leaves every MR count and N19-DR verdict
    unchanged. For each disagreement, determine which implementation departs
    from the text of the frozen specification. (J8) Decide what wdag-v1,
    flat-v1 and ann-v1 certify as frozen (D-1, D-6), whether their degree
    discipline admits anything outside W_4, and which counts of the run are
    certificate-backed at which closure.

  uncertainty_reduced: >-
    Whether the run's load-bearing quantities survive implementations that
    never saw the producers'; if not, whose error it is; and whether the
    certificates certify exactly what the metrics name.

  inputs:
    - coordination/review/certbin-20260926-d7249d/review-plan.yaml
    - coordination/review/certbin-20260926-d7249d/reviews/TASK-20260926-f0736e/ (archived by TASK-20260926-e8779d; read access LIFTED for you)
    - coordination/review/certbin-20260926-d7249d/reviews/TASK-20260926-401771/ (archived by TASK-20260926-e8779d; read access LIFTED for you)
    - coordination/review/certbin-20260926-d7249d/blind/blind-inputs.json and blind-inputs-key.json
    - coordination/review/certbin-20260926-d7249d/archives/ (the 5d1557 and e8779d receipts and the extraction script)
    - experiments/EXP-CERTBIN-060020/specification.yaml, experiments/EXP-CERTBIN-e94b27/specification.yaml and experiments/EXP-CERTBIN-4e92d7/specification.yaml
    - experiments/EXP-CERTBIN-060020/impl/, experiments/EXP-CERTBIN-060020/verifier/ and src/crypto_autoresearcher/gf2/ (READ only, to localise a disagreement at a clause; your checkers and third checks are your own code)
    - experiments/EXP-CERTBIN-060020/runs/RUN-CERTBIN-a3fc60/ (instances.jsonl.gz, closures.jsonl.gz, certificates.jsonl.gz, annihilators.jsonl.gz, certificate-verification.json, annihilator-verification.json, cell-summary.json, decision-rules.json, trial-plan and implementation.md for how the run resolved each ambiguity)
    - experiments/EXP-CERTBIN-060020/trial-plan-v1.json

  read_scope_excludes:
    - coordination/review/certbin-20260926-d7249d/reviews/TASK-20260926-42be88/
    - coordination/review/certbin-20260926-d7249d/reviews/TASK-20260926-fee7a9/
    - "the executor's development outputs and return message; any PR text; coordination/bus/"

  constraints:
    - id: CP-1
      text: >-
        VERIFY BEFORE COMPARING. (1) Both reviewer directories match the
        TASK-20260926-e8779d receipt's path_sha256. (2) Each seal.txt matches
        its sealed files. (3) blind-inputs.json matches the
        TASK-20260926-5d1557 receipt. (4) The e8779d receipt reports no
        blocking defect. Then map labels to run keys with
        blind-inputs-key.json. Work in a dedicated worktree at the e8779d
        commit with PYTHONDONTWRITEBYTECODE=1.
    - id: CP-2
      text: >-
        COMPARE EVERY ITEM BELOW and tabulate agree / disagree per item and per
        system, for all 90 blind systems.
        Against instances.jsonl.gz: s (both routes where given), arm (s = 0 or
        not), the degenerate flag.
        Against closures.jsonl.gz: rank_3, rank_4, "1 in R_3", "1 in R_4",
        dims_by_deg(M_4); W_4 dim per iteration (where the run recorded it;
        otherwise mark "re-deriver only"), fixpoint index, first iteration
        with 1 (or none), final dimension, dims_by_deg(W_4) and "1 in W_4";
        the rc_b fields (kernel dimension, ell, j*, rank R'_3, rank, "1 in"
        and dims_by_deg of R'_4, sigma, T5_applicable) and ell_route; W'_4
        where both have it.
        Against certificate-verification.json, annihilator-verification.json,
        certificates.jsonl.gz and annihilators.jsonl.gz: J1's per-certificate
        verdict against the run's, key by key and format by format; MR19-1 and
        MR19-3 recounted from J1's verdicts only, with N19-DR-1, N19-DR-4,
        N19-DR-5 and the mechanical N19-DR-9 re-applied by the frozen rules;
        state whether any verdict changes. J1's VC-2 rebuild results and VC-3
        satisfiability against instances.jsonl.gz for every kept system (not
        only the pool). J1's VC-6 M_4 witnesses against the run's M_4 records
        on every S3-U400 system.
        Also: each re-deriver ambiguity and each J1 ambiguity, set against how
        the run resolved it (trial-plan-v1.json, implementation.md
        "Executor interpretations").
    - id: CP-3
      text: >-
        CHECK EVERY BLIND CERTIFICATE (wdag.jsonl.gz and ann.jsonl.gz of
        TASK-20260926-f0736e) with your own minimal checkers, written before
        you read the re-deriver's code. Build f_k for explicit-kind systems
        from blind-inputs.json and for curve-kind systems by your own S_3
        descent (or decode the run's E_hex with your own codec from the
        E_layout text); import no crypto_autoresearcher module. wdag-v1:
        rules (a)-(e) with degrees after multilinear reduction. ann-v1:
        (A1)-(A3) with your own elimination. Report per system: valid,
        invalid (with the first violated rule), or absent. Then state, per run
        key in the pool, whether "1 in W_4" is certified twice (run wdag-v1
        verified by J1 AND a valid blind wdag-v1), once, or engine-reported
        only; and whether "1 not in W_4" is certified (a valid blind or run
        ann-v1), derived (D-3 / T5 on an independent profile) or
        engine-reported only.
    - id: CP-4
      text: >-
        LOCALISE EVERY DISAGREEMENT: (a) read both implementations at the
        specification clause concerned; (b) run a third, minimal,
        specification-literal check on that one system, in your own code,
        declared; (c) name which side departs from the specification text, or
        the ambiguity both sides read differently. A disagreement in a
        per-iteration record where "1 in W_4" and the final dimension agree is
        reported as such; W_4 is a least fixpoint, so it may reflect the
        iteration schedule rather than the closure. Check the D-2 identity on
        independent numbers: the re-deriver's direct ell_route against its own
        R'_4 constant, and both against the run's records.
    - id: CP-5
      text: >-
        J8, CERTIFICATE SEMANTICS, as the plan's J8 attack_plan states: write
        the soundness proofs of wdag-v1 and ann-v1 yourself from the format
        text (D-1, D-6: verified, refuted or unchecked); try to craft, on a
        small system of your own (6 to 8 variables), a certificate that passes
        a frozen rule for a false statement, and document where the attempt
        fails; compare the reading of "deg poly(c) <= 3" and of (A2)'s basis
        applied by J1 and by the re-deriver with the text; and state, count by
        count, what is certificate-backed and what is engine-reported,
        including the consequence of C-NONREF's declared vacuity
        (DEC-20260926-f6a749 R-9). J8 reads no sibling output beyond the two
        lifted directories.
    - id: CP-6
      text: >-
        VERDICT ON J7: `holds` if every compared quantity agrees (or every
        disagreement localises to a re-deriver or verifier side, or to an
        encoding difference) AND every run-claimed W_4 refutation in the pool
        is witnessed by a valid blind wdag-v1 AND every blind non-refutation
        is consistent with the run; `breaks` if any disagreement localises to
        the producer's implementation or the engine, or a run-claimed outcome
        is contradicted by a valid blind certificate; `inconclusive` if a
        disagreement cannot be localised, a genuine ambiguity was read
        differently by both sides (name the clause), or a run-claimed W_4
        refutation is unwitnessed but not contradicted. VERDICT ON J8: `holds`
        if D-1 and D-6 are verified and every count cites certificates that
        certify what it names; `breaks` on a counterexample or a crafted false
        certificate that passes; `inconclusive` if a proof step stays
        unchecked. State which compared items sit at a floor or ceiling for
        every system, and therefore are weak evidence about the
        implementation.
    - id: CP-7
      text: >-
        REPORT ON J7 AND J8 ONLY. Do not read the validator's or the red
        team's reports. No verdict on the claim. Zero trials; third checks on
        at most 20 archived systems plus the CP-3 checks on every blind
        certificate and the CP-5 constructions, declared. Memory cap 3 GB.
    - id: CP-8
      text: >-
        DISCLOSED PRIOR (review-plan PD-R1). The Coordinator's review prior
        names where it expects disagreements. Do not let that decide where you
        look hardest; compare everything in CP-2.
    - id: CP-9
      text: >-
        CONTINUATION as in the other cards of this round (skeleton first; a
        fresh same-role session continues this card from its own partial
        artifacts; sessions recorded). INDEPENDENCE SELF-CHECK before
        returning: run `python3 tools/check_review_independence.py --plan
        coordination/review/certbin-20260926-d7249d/review-plan.yaml --reports
        coordination/review/certbin-20260926-d7249d/reviews/TASK-20260926-f50294/`
        and paste its output into the report; a problem naming
        TASK-20260926-f50294 is fixed in your attestation before you return.

