handoff:
  id: TASK-20260904-c616c0
  from: coordinator
  to: red-team
  supersedes: TASK-20260904-a897dc
  supersession_reason: >-
    The v1 dispatch failed at the API level before any work: the bound
    model zai/glm-5.2 is balance-blocked ('Insufficient balance or no
    resource package. Please recharge.', 2026-09-04 ~17:55Z). Per
    DEC-20260904-e1888e (mechanism: DEC-20260903-16bfc2), the round is
    re-dispatched on the vllm/qwen3.8-27b runtime with the fallback
    declared. Scope, plan, gates, and budget are unchanged; the resolved
    model and applied effort are recorded on the report.
  objective: >-
    Round 1, joint J2: attack the CONTROL-C adjudication of
    DEC-20260904-92dec2 and the amendment v2 two-sided control design --
    including the proves-too-much controls assigned to this joint.
  uncertainty_reduced: >-
    Whether the survival-reading of the o2-lane reference is correct and
    correctly transferred, and whether the two-sided control (C1 T4
    survival band + C2 comparator collapse) actually discriminates a
    working NULL-2 from a broken one.
  inputs:
  - AGENTS.md
  - agents/red-team.md (your role contract)
  - ledger/decisions/DEC-20260904-92dec2.yaml (the claim under review, as its producer stated it)
  - ledger/handoffs/TASK-20260904-4f5322.yaml (the round plan: your joint J2, its attack plan, the proves_too_much objects)
  - experiments/EXP-ECDLP-56ee42/specification.yaml (frozen contract v1: NULL-2 definition, controls, seeds)
  - experiments/EXP-ECDLP-56ee42/amendments/v2_control_c_recalibration.yaml (the control under attack)
  - analysis/o2-sum-compatible-filters/reviews/RT-EXP-1-RESULT.md (the cited o2-lane reference, in full)
  - analysis/o2-sum-compatible-filters/rt_exp_1.py (the cited o2 implementation, in full)
  - knowledge/findings/KN-FIND-ffe1df.md (the knowledge record of the o2 lane)
  - experiments/EXP-ECDLP-56ee42/implementation/runs/RUN-ECDLP-56ee42-S2/raw-result.json (the observed CONTROL-C numbers)
  - experiments/EXP-ECDLP-56ee42/implementation/runs/stage-cache/ (on-disk, hash-bound in the S1 record; available for the comparator level-set balance assessment in attack step (e))
  constraints:
  - >-
    You own joint J2 and the proves_too_much controls ONLY. Do not opine
    on run-record integrity (joint J1, owned by TASK-20260904-4f5322); if
    a J2 finding depends on an integrity question, state the dependency
    and stop.
  - 'Blindness: do not read the validator report or any other reviewer output of this round. Attest what you read.'
  - >-
    Your deliverable is a falsification attempt with a verdict, not a
    defence of the claim. A finding that the control as written admits a
    broken NULL-2, or that the o2 reading is wrong, is a SUCCESS for this
    task and must be stated as such.
  - >-
    The broken-shuffle scenarios (no-op, max-preserving) are to be
    ANALYSED (what ratio each produces for T4 and for the comparator,
    therefore what C1 and C2 each accept/reject); you may compute the
    comparator balance counts from the stage-cache arrays, but you
    execute no stage of EXP-ECDLP-56ee42 and create no run records.
  - 'No changes to any ledger, experiment, or goal record. Write nothing outside write_scope. Never commit.'
  - >-
    This session runs on the FALLBACK runtime vllm/qwen3.8-27b per
    DEC-20260904-e1888e (requested policy review-adversarial is unchanged;
    the zai backend is balance-blocked). Record on the report: requested
    policy, resolved model (vllm/qwen3.8-27b or whatever actually
    answered), and the reasoning effort actually applied versus the
    xhigh request. If the session cannot serve review-adversarial at all
    (not merely capped), refuse rather than downgrade.
  deliverables:
  - >-
    report.yaml in your write_scope: per-attack-step findings (a)-(e)
    from the round plan, the proves-too-much table (object x control ->
    accept/reject with the computed ratios), a joint verdict
    (SUSTAINED / REVISE / BROKEN with the specific break), a blindness
    attestation, and model provenance (requested policy, resolved model,
    applied effort, fallback recorded).
  artifact_paths:
  - experiments/EXP-ECDLP-56ee42/reviews/round-1/red-team/
  archived_by: null
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: true
    fallback: 'vllm/qwen3.8-27b per DEC-20260904-e1888e (zai balance-blocked; DEC-20260903-16bfc2 mechanism)'
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 7200
    memory_gb: 16
    maximum_runs: 0
  completion_gate:
  - 'report.yaml exists, parses as strict YAML, and covers attack steps (a)-(e) and all three proves-too-much objects'
  - 'every o2 number the DEC quotes is independently recomputed from the RT-EXP-1 table'
  - 'the broken-shuffle table states, for each of no-op and max-preserving, the C1 ratio, the expected C2 ratio, and accept/reject for each control'
  - 'the comparator level-set balance is quantified per rung (or the reason it cannot be, stated)'
  - 'blindness attestation and model provenance present'
  return_format: 'the report.yaml contents (or its path) and nothing else'
  review_plan: 'round plan carried in the opening handoff ledger/handoffs/TASK-20260904-4f5322.yaml (joint J2, proves_too_much, blindness); this handoff names the same round'
