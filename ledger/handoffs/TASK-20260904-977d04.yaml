handoff:
  id: TASK-20260904-977d04
  from: coordinator
  to: coordinator
  goal_id: GOAL-SSI-001
  batch_id: BATCH-dc1424
  role: coordinator
  archive_kind: snapshot
  objective: >-
    Run alone and snapshot exactly the six producer artifacts of
    TASK-20260904-d66403 before either independent reviewer reads them, so that
    both reviews attack a bit-identical, immutably bound package and a later
    disagreement between reviewer and producer localizes to a claim instead of
    to a question about what the package said.
  uncertainty_reduced: >-
    Whether the RC-1 package is bound to an immutable, exact-path archive whose
    content hashes verify independently, before any reviewer has read a byte of
    it.
  inputs:
    - The six declared producer artifacts under BATCH-dc1424/tasks/TASK-20260904-d66403/
    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/batch.yaml
    - The TASK-20260904-977d04 task card
  constraints:
    - Run alone. No other task of this batch may be running while this archive runs.
    - >-
      Stage exactly the six producer paths plus this receipt, by exact pathspec.
      Never `git add -A`, never stage a directory, never stage a frozen path,
      and never stage a control-plane file.
    - >-
      Do not edit anything under experiments/ or inputs/, do not execute
      cost_model.py, and do not write any ledger or scientific record.
    - >-
      Never reconstruct, estimate, or guess a commit SHA, a parent SHA, or a
      path hash. Leave a binding null until a real archive commit exists.
    - >-
      Fetch origin/main before committing and MERGE it into the working branch -
      never rebase, because rebasing rewrites the commits run records were
      archived in. Record the base commit checked and the merge outcome in the
      receipt. If a sync conflicts inside an immutable record, do not pick a
      side: stop and report; the resolution is a superseding record under a new
      identifier.
    - >-
      Push the branch and open or refresh the PR against main naming
      TASK-20260904-d66403 and BATCH-dc1424. A record that exists only in a
      local commit is unpublished, not durable evidence.
    - >-
      NO INDEPENDENT REVIEWER STARTS until this snapshot receipt is accepted by
      the post-commit verifier. That ordering is the whole point of this task.
    - >-
      DO NOT WRITE A CORRECTION, NOTE, OR COMMENTARY THAT AFFIRMS ANY REVIEWED
      VERDICT. DEC-20260904-166ab5 PD-1 recorded a pre-review correction that
      stated of the verdict under review that it "stands"; the ruling for
      successors is that a pre-review correction states what it corrects and
      does NOT state that the reviewed verdict stands.
    - >-
      If the producer stopped early - an unlocatable Section 4.1, an
      `undetermined` composed verdict, or an exhausted budget - snapshot the
      package exactly as it is. An honest stop and an honest `undetermined` are
      archived exactly like a complete run, and neither is annotated as a
      failure by this task.
    - >-
      Change no status, write no ledger record, and make no interpretation of
      the package's contents. This task reads the artifacts only to hash and
      stage them.
  deliverables:
    - snapshot_commit_receipt.json
  artifact_paths:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/archives/TASK-20260904-977d04/snapshot_commit_receipt.json
  read_scope:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/tasks/TASK-20260904-d66403
    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/batch.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/archives/TASK-20260904-977d04
  write_scope:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/archives/TASK-20260904-977d04
  archived_by: TASK-20260904-977d04
  archives:
    - TASK-20260904-d66403
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 900
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
    - The snapshot commit changes exactly the six producer paths plus this receipt, and nothing else.
    - No path under experiments/ or inputs/ appears in the commit.
    - The receipt records only commit information and hashes obtained from Git, with the fetched base commit and the merge outcome.
    - The branch is pushed and a PR against main names TASK-20260904-d66403 and BATCH-dc1424.
    - No ledger or scientific record is written, no status is changed, and no verdict of the package is affirmed or characterized anywhere.
  return_format: >-
    A short receipt summary naming the commit, its parent, the six hashed paths,
    the fetched base commit, and the merge outcome. If the commit could not be
