# LEDGER ARCHIVE of the composed GOAL-MONO-001 closure-or-dissent decision,
# BATCH-44adf9. It implements the final leg of DEC-20260930-3a0b7b NA-1
# ("Then ledger-archive alone"). The top-level session pre-minted the ID and
# reports that --check found it free. Written by a Coordinator subagent that
# has no shell. Zero runs.
#
# RESERVED TOKENS: the composed decision id is DEC-20260930-8553d4,
# and on an adopting outcome the knowledge ids are
# KN-FIND-fde7cf and
# KN-OPEN-450599. They are minted and
# substituted by the top-level session before this file is first committed,
# as ledger/handoffs/TASK-20260930-e74f4c.yaml describes. No identifier is
# invented here.
handoff:
  id: TASK-20260930-f4f675
  from: coordinator
  to: coordinator
  goal_id: GOAL-MONO-001
  batch_id: BATCH-44adf9
  authorized_by: DEC-20260930-3a0b7b
  archive_kind: ledger
  objective: >-
    Make the composed decision DEC-20260930-8553d4
    official. Do it in ONE isolated commit that stages exactly: the
    composer's worksheet; the decision; the write-once checkpoint shard
    ledger/goals/GOAL-MONO-001/checkpoints/BATCH-44adf9.yaml; the additive
    goal-head projection on ledger/goals/GOAL-MONO-001/goal.yaml; this
    card's ledger receipt; and, on an adopting outcome only, the knowledge
    paths the decision lists under ledger_archive_scope_additions, after
    the queue revision described in constraints LA-3. Before staging,
    re-verify that the committed review bytes still hash to the
    TASK-20260930-a72623 receipt. This task runs ALONE, after the composer
    returns.
  uncertainty_reduced: >-
    None. This task gives durability and custody. It is what makes the
    closure (GOAL-MONO-001 -> completed) or the recorded dissent official.
  inputs:
    - coordination/goals/GOAL-MONO-001/batches/BATCH-44adf9/composition/TASK-20260930-e74f4c/composition-worksheet.yaml
    - ledger/decisions/DEC-20260930-8553d4.yaml
    - ledger/goals/GOAL-MONO-001/goal.yaml
    - ledger/goals/GOAL-MONO-001/checkpoints/BATCH-44adf9.yaml
    - coordination/goals/GOAL-MONO-001/batches/BATCH-44adf9/archives/TASK-20260930-a72623/snapshot-receipt.json
    - coordination/goals/GOAL-MONO-001/batches/BATCH-44adf9/dispatch_queue.json
    - ledger/handoffs/TASK-20260930-e74f4c.yaml
  read_scope:
    - coordination/goals/GOAL-MONO-001/batches/BATCH-44adf9/
    - coordination/goals/GOAL-MONO-001/review/TASK-20260930-40470a/
    - ledger/decisions/DEC-20260930-8553d4.yaml
    - ledger/goals/GOAL-MONO-001/
    - ledger/handoffs/TASK-20260930-e74f4c.yaml
    - ledger/handoffs/TASK-20260930-f4f675.yaml
    - knowledge/findings/KN-FIND-fde7cf.md
    - knowledge/open-problems/KN-OPEN-450599.md
    - knowledge/open-problems/KN-OPEN-009.md
    - tools/research_dispatch.py
    - tools/validate_ledger.py
  write_scope:
    - coordination/goals/GOAL-MONO-001/batches/BATCH-44adf9/archives/TASK-20260930-f4f675/
    - ledger/decisions/DEC-20260930-8553d4.yaml
    - ledger/goals/GOAL-MONO-001/goal.yaml
    - ledger/goals/GOAL-MONO-001/checkpoints/BATCH-44adf9.yaml
  write_scope_note: >-
    The archive writes only its receipt. It OWNS, and so stages, the
    decision, the goal-head projection and the checkpoint shard that the
    composer wrote. On an adopting outcome, the LA-3 revision adds the
    knowledge paths to write_scope and artifact_paths before this task is
    claimed.
  constraints:
    - >-
      LA-1 RUNS ALONE, after TASK-20260930-e74f4c has returned and its claim
      is released. No other BATCH-44adf9 card runs concurrently. Zero runs.
    - >-
      LA-2 Merge origin/main into the working branch first, and never
      rebase. Record base_commit_checked and merge_outcome in the receipt. If
      the merge touches ledger/goals/GOAL-MONO-001/goal.yaml, check that the
      composer's additive projection still applies without rewriting another
      lane's text. A conflict inside a record is never resolved by editing
      it: stop and report. The resolution is a superseding record by
      Coordinator decision.
    - >-
      LA-3 OUTCOME-DEPENDENT SCOPE. Read the decision's
      ledger_archive_scope_additions. If it is [], stage the base set
      below. If it lists paths, which happens on an adopting outcome with
      knowledge entries, then BEFORE claiming this task the top-level
      session adds exactly those paths to this card's artifact_paths and
      write_scope in the queue, and adds their record ids (for example
      KN-OPEN-009 and the minted KN ids) to archive.record_ids. It
      records that addition as a dated `notes` entry of kind card_revision
      that cites the decision as its authority, and re-renders the queue
      with tools/research_dispatch.py, which must pass. The listed paths
      must lie within the composer's declared write_scope. A listed path
      outside it is a scope finding: stop and report. The ledger handoff
      file is not edited, because the queue card is the dispatch copy.
    - >-
      LA-4 CUSTODY RE-CHECK. Before staging, recompute the sha256 of the
      committed review_report.md, s4_construction/computations.json and
      runtime-session-receipt.json at HEAD. Compare them with
      TASK-20260930-a72623's path_sha256 and with the digests the composer
      recorded first in its worksheet. Any mismatch is a custody failure:
      stop, stage nothing, and report. The composition is then void.
    - >-
      LA-5 Stage exactly the declared set, one by one. Base set: the
      composer's worksheet;
      ledger/decisions/DEC-20260930-8553d4.yaml;
      ledger/goals/GOAL-MONO-001/goal.yaml;
      ledger/goals/GOAL-MONO-001/checkpoints/BATCH-44adf9.yaml; and this
      card's ledger-receipt.json. Add the LA-3 additions on an adopting
      outcome. git add -A, git add . and directory adds are forbidden. The
      queue, claims/, knowledge/INDEX.md and the review files (already
      committed by a72623) are NOT staged.
    - >-
      LA-6 Check that the goal.yaml diff is additive. Allowed changes: new
      lines for this lane's checkpoint pointer and dated next_action, and
      the status scalar on an adopting outcome only. Any other line changed
      is a scope finding: stop and report. Do not repair it.
    - >-
      LA-7 Run tools/validate_ledger.py before committing. Stop on any new
      error attributable to the staged paths, and record the outcome. If
      the decision sets GOAL-MONO-001 to completed, the validator's
      goal-closure checks must pass as they stand. The suspended quorum is
      not re-imposed, and no attestation is invented (CLAUDE.md rule 8).
    - >-
      LA-8 binding_mode commit. The commit must change exactly the declared
      set. commit_sha, parent_sha and path_sha256 go into the queue's archive
      block in a later commit.
    - >-
      LA-9 The commit message names TASK-20260930-f4f675 and every archive
      record_id literally. The PR text names the same records and states the
      disposition only as the decision's own decision_label. It adds no
      reviewer-computed value.
    - >-
      LA-10 Verify the receipt with tools/research_dispatch.py. Push the
      branch and open or refresh the PR against main naming every record id.
      A missing, dirty, malformed or scope-expanding commit blocks the
      transition. It is an evidence-integrity failure, not a result.
    - >-
      LA-11 After the receipt verifies: close the lane with `python3
      tools/goal_lanes.py close-lane GOAL-MONO-001 BATCH-44adf9 --outcome
      archived --decision <the minted decision id> --ledger-commit <sha>
      --as <addr> --publish`. Check that the committed goal record now
      carries exactly one next action for this lane, or status completed.
    - >-
      LA-12 Never edit the decision, the worksheet, a knowledge entry, the
      review files or any handoff while staging. Never amend, rebase or
      force-push.
  deliverables:
    - >-
      coordination/goals/GOAL-MONO-001/batches/BATCH-44adf9/archives/TASK-20260930-f4f675/ledger-receipt.json.
      It holds commit_sha (null by convention inside the commit), parent_sha,
      base_commit_checked, merge_outcome, binding_mode commit, path_sha256
      for every staged path, record_ids, the LA-4 custody comparison, the
      LA-6 goal.yaml additivity check, the validate_ledger.py outcome, the
      research_dispatch.py verification outcome, and whether an LA-3 revision
      was applied.
    - One isolated commit, a pushed branch, an open or refreshed PR against main naming every record id, and the lane closed.
  artifact_paths:
    - coordination/goals/GOAL-MONO-001/batches/BATCH-44adf9/archives/TASK-20260930-f4f675/ledger-receipt.json
    - ledger/decisions/DEC-20260930-8553d4.yaml
    - ledger/goals/GOAL-MONO-001/goal.yaml
    - ledger/goals/GOAL-MONO-001/checkpoints/BATCH-44adf9.yaml
  archived_by: TASK-20260930-f4f675   # SELF: an archive task archives itself.
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    reasoning_effort_note: null = policy default (high).
    fallback_allowed: true
    fallback_note: >-
      Runtime inheritance under the Claude Code harness. Backend or model
      substitution only, and never below the policy's effort. Record
      fallback_used and model_verified truthfully. Never Bedrock.
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 1800
    wall_clock_note: >-
      Advisory under docs/research-budget-policy.md. It is a watchdog
      checkpoint. Expiry checkpoints the task and records no result.
    memory_gb: 1
    maximum_runs: 0
  dispatch_preconditions:
    - id: LP-1
      text: archived_by is bound (SELF). AGENTS.md standing precondition 1.
    - id: LP-2
      text: >-
        TASK-20260930-e74f4c has RETURNED and its claim is released. The
        worksheet, the decision, the checkpoint shard and the goal.yaml
        projection exist in the working tree. So do the knowledge paths,
        on an adopting outcome.
    - id: LP-3
      text: >-
        Standing precondition 2, as it applies to an archive. The files this
        card commits are in the working tree, unchanged since the composer
        wrote them. Every other input it relies on (the BATCH-44adf9 opening
        commit and TASK-20260930-a72623) is committed, verified and pushed.
    - id: LP-4
      text: >-
        The LA-3 queue revision is applied and the queue re-renders cleanly,
        OR the decision's ledger_archive_scope_additions is [].
    - id: LP-5
      text: >-
        A task claim, made after git fetch, via `python3 tools/goal_lanes.py
        claim coordination/goals/GOAL-MONO-001/batches/BATCH-44adf9/dispatch_queue.json
        TASK-20260930-f4f675 --as <addr> --ttl-minutes N --publish` before it
        starts. It is released with --outcome on return. Standing
        precondition 3.
    - id: LP-6
      text: RUNS ALONE.
  completion_gate:
    - origin/main merged (merge, never rebase), with base_commit_checked and merge_outcome in the receipt.
    - The LA-4 custody re-check passed, or the task stopped with nothing staged.
    - LA-3 applied when required, and the queue re-rendered clean.
    - The goal.yaml diff is additive only (LA-6).
    - validate_ledger.py shows no new error attributable to the staged paths.
    - One commit changing exactly the declared set, its message naming TASK-20260930-f4f675 and every record id. The receipt is verified by tools/research_dispatch.py under binding_mode commit.
    - The branch is pushed, the PR opened or refreshed against main, and the lane closed with the decision and commit.
    - Nothing edited while staging, zero runs.
  return_format: >-
    The ledger receipt: commit_sha, parent_sha, the path_sha256 map, the LA-4
    and LA-6 outcomes, the validate_ledger and research_dispatch outcomes, the
    PR reference and the close-lane record path.
  review_plan: null
  review_plan_note: An archive opens no review round.
  runs_launched: 0
