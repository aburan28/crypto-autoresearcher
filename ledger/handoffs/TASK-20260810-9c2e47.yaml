  completion_gate:
  - >-
    SR1 passes -- the N = 19507 family is re-derived under this run's own immutable
    record and compared against the design document's inventory, with #E = 19507
    verified PER CURVE and a Hurwitz-Kronecker completeness certificate per class
    -- or the run terminates PREMISE-FAILED and reports the disagreement as a
    finding about the design document.
  - >-
    SR2 passes -- targets_B support certified equal to the enumerated E(F_p) on
    every measured curve, with any non-exact certificate listed individually, and
    there must be none.
  - >-
    SR4 passes -- mean_rate approximately |3V| / #E reproduced on the committed
    p = 4001, t = 30 class under targets_B at every declared density row.
  - >-
    All four dependent variables are measured on every class of the |D_0| arm at
    every density row of the frozen grid, stratified by r, with each class's r
    composition reported.
  - >-
    The rank correlation against |D_0| is reported per density row WITH its exact
    permutation distribution over class labels, and alongside the detection floor
    EXP-INSTR-36c8cf measured at this geometry, with no association below that
    floor described as a trend.
  - >-
    C-TRACEPAIR and C-RESIDUAL-P are reported at every density row, the five
    doubly-hit D_0 values individually.
  - >-
    The |Aut| arm is reported as an exact rank out of the INDEPENDENTLY ENUMERATED
    class size, with its exact one-sided permutation probability, its resolution
    ceiling of 1 over that enumerated size restated, the single crater vertex's
    per-statistic values shown against the full floor distribution rather than its
    mean, and any ratio expressed against the sqrt(6) automorphism-discount
    baseline.
  - >-
