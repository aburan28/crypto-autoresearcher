  constraints:
  - >-
    THE CONTRACT IS FROZEN AND IS READ-ONLY TO THIS TASK. Every threshold,
    definition, grid, seed and prediction in
    experiments/EXP-JINV-bd141d/specification.yaml binds as written. Any change
    requires a versioned protocol_amendment authored by the COORDINATOR under
    experiments/EXP-JINV-bd141d/amendments/ and filed BEFORE the affected data is
    generated. The executor does not write amendments.
  - >-
    SR1 FAMILY GATE RUNS FIRST. Re-derive the WHOLE N = 19507 family and compare
    against the design document's inventory. THE INVENTORY IS DERIVED IN A DESIGN
    SESSION BY A SCRIPT WITH NO RUN RECORD, NO MANIFEST AND NO INDEPENDENT
    VERIFICATION -- 59 classes, 51 at f = 1, 46 distinct fundamental
    discriminants, five D_0 values hit twice, |D_0| from 1299 to 78027, conductor
    arm {1, 3, 107}, roughly 2000 curves, and the t = 211 class with 1 crater and
    36 floor vertices. IT IS NOT EVIDENCE. No decision rule may depend on any of
    those figures until this run has re-derived them, and disagreement terminates
    the run PREMISE-FAILED and is reported as a finding about the design document.
  - >-
    VERIFY #E(F_p) = 19507 PER CURVE, NOT PER CLASS, by direct point counting or
    by an order certificate on a generator. A single failure makes the run INVALID.
    This is the control that makes the whole design work; without it the confound
    is not annihilated, merely assumed away.
  - >-
    isogeny_class.class_census must return agrees true for every class used. Any
    disagreement makes the run INVALID.
  - >-
    THE DEURING CAVEAT IS BINDING. Class sizes in the design document are class
    numbers of ORDERS; for D_0 in {-3, -4} the Deuring correspondence weights
    j = 0 by 1/3 and j = 1728 by 1/2, so a class number is NOT a vertex count. THE
    AUTHORITY ON THE EXACT VERTEX COUNT OF THE t = 211 CLASS IS THE CAMPAIGN'S OWN
    HURWITZ-KRONECKER ENUMERATION (harness/isogeny_class.py class_census), not the
    class-number formula and not the design document. Report the enumerated count
    independently; a discrepancy is a finding about the enumeration, reported as
    one. Using the class number as the authority is an invalidation rule.
  - >-
    SR2 SUPPORT GATE. Use harness/exp_icinv_fullgroup.py targets_B and certify its
    support EQUAL to the enumerated point set of E(F_p) on every measured curve
    before any rate is recorded. A single failure terminates the run
    PREMISE-FAILED. exp_icinv.targets_uniform is PROHIBITED in every arm. This is a
    refusal to reuse a sampler whose estimand is under dispute; IT IS NOT A
    POSITION ON H-ICINV-6c7920, which stays `specified` and is neither presumed
    true nor false, and no output may present it as one.
  - >-
    SR3 INSTRUMENT GATE, BLOCKING. See dependency_note. Do not read or report any
    arm verdict until EXP-INSTR-36c8cf has delivered a detection floor and a
    false-positive rate for every statistic used, at the ACTUAL geometry of this
    design.
  - >-
    SR4 BASELINE IDENTITY GATE. On the committed p = 4001, t = 30 class under
    targets_B, reproduce mean_rate approximately equal to |3V| / #E at every
    declared density row, to within the exact enumeration tolerance, before any
    N = 19507 measurement is interpreted. Failure makes the run INVALID and returns
    it as a defect. This quantity is deliberately one H-ICINV-6c7920 does not
    contest.
  - >-
    SWEEP THE DENSITY GRID; THE SATURATED ROW IS NEVER REPORTED ALONE. The
    committed within-class over-dispersion decays from 2.037 at density 0.5306 to
    0.930 at 0.0234, and the batch that produced the campaign's headline ran only
    the saturated row. A conclusion drawn from one density row is not a conclusion
    about the curves. The m = 3 operating density is 1/m! which is about 0.167.
    Report the lowest and highest rows explicitly alongside the operating row.
  - >-
    STRATIFY ON r = #{x in F_p : x^3 + a x + b = 0}. Every headline statistic is
    reported PER STRATUM as well as pooled, with each class's r composition. IF THE
    SIGN OF AN ASSOCIATION DIFFERS BETWEEN STRATA, THE POOLED FIGURE IS WITHDRAWN
    and only the stratified figures are reported.
  - >-
    C-TRACEPAIR. The five fundamental discriminants hit TWICE by distinct trace
    pairs are a free internal replication set -- same D_0, same N, different t,
    different p. If the within-pair spread is comparable to the spread across the
    whole |D_0| range, THE |D_0| AXIS IS NOT RESOLVABLE at this design's precision
    and no trend claim may be made in either direction. Report the five values
    individually, not summarised.
  - >-
    C-RESIDUAL-P. Report the same statistics against p as well as against |D_0|.
    Fixing N does not fix p, since p = N + t - 1, and p and D_0 are algebraically
    linked through t. A |D_0| trend equally explained by p is NOT attributable to
    the endomorphism ring and the record must say so.
  - >-
    THE TWO ARMS ARE NEVER POOLED, with each other or with EXP-VOLC-9f5571's
    results, into one model, one table or one test. Pooling is an invalidation
    rule.
  - >-
    THE |Aut| ARM'S RESOLUTION CEILING IS DERIVED AND FIXED BEFORE EXECUTION. The
    crater has ONE vertex, so under a permutation of the enumerated class members
    the smallest attainable one-sided p-value is 1 / (enumerated class size), which
    the design document puts at 1/37 = 0.02703. The arm can never distinguish a
    large effect from a moderate one. REPORT IT AS A RANK AND AN EXACT PERMUTATION
    PROBABILITY, NEVER AS A DIFFERENCE OF MEANS AND NEVER WITH A CONFIDENCE
    INTERVAL ON n = 1; either is an invalidation rule.
  - >-
    IDENTIFY THE CRATER BY EXPLICIT VELU 107-ISOGENY STRUCTURE.
    two_torsion_x_count and ell_subgroup_count(., 2) are PROHIBITED as crater or
    level proxies -- they are the same computation and resolved 2 of 5 levels on
    the committed p = 4001 class.
  - >-
    C-TRANSPORT-CERT. gcd(107, 19507) = 1 with N prime, so T1 transport carries
    (E, P, Q, k) between crater and floor with the SAME k. Emit at least one
    explicit transport with a certificate RE-VERIFIED INDEPENDENTLY of the
    transport code (docs/claims-and-verification.md).
  - >-
    SR8 BASELINE PAUSE, ESCALATE DO NOT PROCEED. If any crater/floor ratio on the
    |Aut| arm exceeds sqrt(6) which is about 2.449, STOP and escalate to the
    Coordinator. GOAL-ENDO-001 pause condition P3 requires an independent
    review-adversarial session before any record states the excess, and
    review-breakthrough at max effort before any record calls it a break. Do not
    write the excess into a report, a log summary or a commit message before that
    escalation is answered.
  - >-
    DO NOT EDIT harness/exp_icinv.py. It is READ-ONLY. All new code goes under
    harness/exp_jinv_bd141d/, which is this task's own declared write scope, as a
    new driver and module over harness/isogeny_class.py, harness/toycurve.py and
    harness/exp_icinv_fullgroup.py.
  - >-
    SOURCE PROVENANCE IS BLOCKING (the standing A6 precondition carried from
    EXP-ICINV-4d33aa amendment v2). Every run manifest must pin the hash of every
    source file executed, via harness/runner.py source_provenance(), and
    `python3 tools/check_run_source_provenance.py --experiment EXP-JINV-bd141d
    --strict` must pass before any run is considered complete.
  - >-
    NO TRANSCRIBED REFERENCE VALUES. Every value quoted from a committed record --
    the density-decay table, the detection-floor table, the p = 4001 baseline, any
    figure delivered by EXP-INSTR-36c8cf -- must be READ FROM THAT RECORD AT RUN
    TIME and bound by a source_sha256 in baseline-provenance.json. Transcription at
    any precision is PROHIBITED and makes the run INVALID (EXP-ICINV-4d33aa
    amendment v2 change A4, CORR-20260807-a24675). This applies to every figure
    quoted in this handoff, including the family inventory.
  - >-
    COMPUTE THE EXACT m = 2 AND m = 3 SUM SETS ONCE per (curve, factor-base size)
    and reuse them across every seed, density row and statistic. This is a contract
    requirement, not an optimisation, and it is what makes three seeds nearly free.
  - >-
    CONCURRENCY. See concurrency_note. This task runs ALONE. Do not start, spawn or
    parallelise any other BATCH-d7e255 task, and keep this task's own internal
    parallelism low enough that it does not add to a host already at load average
    21.6 / 25.8 / 40.2 on 14 cores.
  - >-
    THE EXECUTOR NEVER INTERPRETS RESULTS. Produce run records and an execution
    report of what ran, what did not, every deviation and the emitted verdicts. Do
    not characterise what they mean for RQ-JINV-8fc13a, H-JINV-5a0b9e,
    H-ICINV-6c7920, GOAL-ENDO-001's criteria, or the campaign.
  - >-
    THE EXECUTOR NEVER CHANGES A HYPOTHESIS STATUS. H-JINV-5a0b9e stays
    `specified`. H-ICINV-6c7920 stays `specified`. H-ENDO-001 stays `approved` and
    is USED as the admissibility filter, not retested. H-STR-002 stays `weakened`
    with DEFER-BATCH009-001 OPEN and pause condition P2 respected -- this contract
    constructs no equivariant factor base and tests no phi-stable structure, so it
    bears on H-STR-002 in neither direction and no output may suggest it does. Only
    the Coordinator moves a status, on a committed ledger archive after independent
    review.
  - >-
    THE EXECUTOR NEVER COMMITS. Do not run `git commit`, `git push`, or any
    history-modifying git command. Workers do not commit into a shared worktree
    (AGENTS.md, "Durable research commits"); the Coordinator makes the isolated
    snapshot commit. Read-only git inspection is permitted and encouraged.
  - >-
    NO COMPLETION CRITERION MAY BE CLAIMED MET. Claim nothing about GOAL-ENDO-001
    C1-C4. Record no attestation and no closure quorum.
  - >-
    Never fabricate a command, output, timing, statistic or run. A measurement not
    taken stays missing and is reported as missing (AGENTS.md rule 9). A timeout,
    crash or OOM is failed_infrastructure, never negative evidence (AGENTS.md
    rule 5).
  - >-
    Mint every new identifier with `python3 tools/allocate_id.py --next <type>`
    and confirm it with `--check` before use. Do not grep for the next free
    number.
  - >-
    Fetch origin/main and compare it with this branch before the run manifests are
    written; record the base commit checked and the merge outcome in the execution
    report. Merge new main changes into the branch; never rebase pushed run
    records.
  - >-
    SESSION SURVIVAL. Write artifacts to disk as each gate and each class
    completes -- after SR1, after SR2, after SR4, and after every class measured.
    Never hold results only in memory.
  - >-
    Lawful defensive cryptanalysis on public toy constructions only. N = 19507 and
    primes p = N + t - 1 near 2^14.3, plus the committed p = 4001 baseline. No live
    key, wallet or deployed system is touched.

