  objective: >-
    Execute the frozen, approved contract at
    experiments/EXP-JINV-bd141d/specification.yaml, version 1, exactly as written.
    Read that file IN FULL before writing any code; it is READ-ONLY to this task.
    Measure relation-collection density against the CM fundamental discriminant on
    the matched-order family N = 19507, in TWO ARMS reported separately and NEVER
    pooled. ARM 1, the |D_0| arm -- decomposition_rate_m2, decomposition_rate_m3,
    liftable_density and decomposition_efficiency against |D_0| across the
    conductor-1 classes of the family, at every density row of the frozen grid,
    stratified by r. ARM 2, the |Aut| arm -- the single j = 0 crater vertex against
    the floor vertices INSIDE the t = 211, p = 19717, D = -34347 = -3 * 107^2
    class, reported as an exact rank with its exact one-sided permutation
    probability. Emit one of the three frozen verdicts per arm, computed inside the
    run.

  uncertainty_reduced: >-
    Whether relation density depends on the CM fundamental discriminant once the
    group order is ANNIHILATED as a confound rather than modelled -- the repair
    that D = (t - 2)^2 - 4N makes structural instead of statistical -- and,
    separately, whether the automorphism group separates from the discriminant at
    the one place in this program where the two are not perfectly confounded. The
    campaign's own standing prediction (DECOMPOSITION.md section 5 prediction 1,
    yield depends on N and factor-base size only) is THE NULL of Arm 1, and N is
    identical by construction across the family, so a null here strengthens that
    prediction under the one design that removes its main confound.

  dependency_note: >-
    THIS TASK IS BLOCKED BY TASK-20260810-c98659 (EXP-INSTR-36c8cf) UNDER
    GOAL-ENDO-001 CRITERION C4, AND THAT BLOCK IS ON READING AND REPORTING
    VERDICTS, NOT ON RUNNING. This is the contract's own SR3 INSTRUMENT GATE and
    its instrument_gate.blocking field, restated as a dispatch relation.

    WHAT MAY RUN BEFORE TASK-20260810-c98659 COMPLETES ITS PHASE B. Stage 1 in
    full -- SR1 family gate, SR2 support gate, SR4 baseline identity gate -- and
    the measurement work itself. Stage 1 is also what PRODUCES the real geometry
    (family construction, class census, per-class r composition, enumerated vertex
    count of the t = 211 class) that TASK-20260810-c98659's Phase B REQUIRES under
    its own SR2; emit those artifacts and return them to the Coordinator as soon
    as Stage 1 completes, because Phase B cannot start without them.

    WHAT MAY NOT. DO NOT READ OR REPORT ANY |D_0|-ARM OR |Aut|-ARM VERDICT until
    EXP-INSTR-36c8cf has delivered, AT THE ACTUAL GEOMETRY OF THIS DESIGN, a
    measured detection floor and a measured matched-null false-positive rate for
    every statistic used here -- the real class counts, the real r-stratum sizes,
    the 37-vertex |Aut| arm, and the actual density rows. An unmeasured control
    cell BLOCKS its conclusion; it does not pass it. In particular the |Aut| arm
    may not be read until C-PSEUDO-CRATER has been reported by that contract.

    THE RESULTING ORDER, SERIALIZED. TASK-20260810-ab0a07 completes;
    TASK-20260810-c98659 Phase A completes; THIS TASK runs its Stage 1 gates and
    measurement and returns; TASK-20260810-820328 does likewise;
    TASK-20260810-c98659 Phase B completes at the real geometries; only then are
    this task's verdicts readable. If the Coordinator judges that the verdict step
    is cleaner as a separate short dispatch, it will say so; do not assume it.

    NULL-C IS NOT PRESUMED ADMISSIBLE HERE merely because the #E confound is
    annihilated. It was characterised on a different design and must be
    re-characterised on this one by EXP-INSTR-36c8cf or it may not be used; using
    it before that re-characterisation is an invalidation rule of this contract.

  concurrency_note: >-
    DISPATCHED STRICTLY ONE AT A TIME. This task runs ALONE. No other
    BATCH-d7e255 task may be running while it is.

    THE REASON, WITH THE MEASUREMENT THAT MOTIVATES IT. The execution host has 14
    cores and, at dispatch time, a load average of 21.6 over 1 minute, 25.8 over
    5 minutes and 40.2 over 15 minutes. It is already oversubscribed by other
    sessions. GOAL-ENDO-001's campaign_budget.max_concurrent is 6; THAT FIGURE IS
    NOT AUTHORIZATION HERE and is deliberately overridden downward to 1 for this
    batch. Sizing concurrency to what the machine can actually run without
    degrading is the dispatching Coordinator's responsibility (AGENTS.md,
    "Dynamic dispatch"), and the recorded cost of getting it wrong is
    GOAL-AES-003 BATCH-002 (DEC-20260802-b226fb, budget_accounting), which lost
    one producer's entire first segment and five of eight trials in another to
    exactly this condition.

    A TIMEOUT, STALL OR DEGRADED RUN CAUSED BY HOST LOAD IS AN INFRASTRUCTURE
    EVENT under AGENTS.md rule 5, recorded as failed_infrastructure with partial
    artifacts retained. IT IS NEVER NEGATIVE MATHEMATICAL EVIDENCE and in
    particular is NEVER a NO-TREND verdict on the |D_0| arm. This is the heaviest
    contract in the batch -- exact m = 3 sum-set enumeration over roughly 2000
    curves at #E = 19507 -- so it is the one most likely to be degraded by a
    saturated host, and the failure mode to guard against is a truncated sweep
    silently reading as an absent trend.

