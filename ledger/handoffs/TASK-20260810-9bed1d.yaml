  role: red-team
  from: coordinator
  to: red-team
  objective: >-
    Adversarially review EXP-ICINV-e0cd8f's execution and its CLASS-VARYING
    claim at the committed snapshot 1721063e4. Try to REFUTE the significance of
    the F4b finding and try to find a reading under which this result is weaker,
    or means something different, than the execution report's framing suggests.
  why_this_matters: >-
    This is the campaign's first EXACT, non-statistical result bearing directly
    on RQ-ICINV-475b5e, the gating lane, and C2's completion criterion. A wrong
    or overclaimed reading here would misdirect the whole campaign; a correctly
    scoped reading is a genuine result either way. It has had no independent
    review. A confirmed, correctly-scoped finding is a fully valid outcome of
    this task.
  the_claim_to_attack: >-
    Over all 138 curves of the certified ordinary class at p=4001, t=30,
    D=-15104, five of six exact geometric invariants of the m=3 Semaev variety
    are CLASS-INVARIANT (single value across all 138 members): S_3 monomial
    support, graded Betti table, regularity, affine singular locus (dim,
    degree), elimination polynomial degree. The sixth, elimination
    F_p-factorisation type, is CLASS-VARYING: 66 members have type (1,1,1), 72
    have type (1,2), with an exhibited witness pair (a,b)=(17,1345) vs
    (a,b)=(148,2766). The matched control (138 curves from 100 OTHER traces)
    shows type-3 variation on the SAME family: {(1,1,1):21,(1,2):68,(3,):49}.
  specific_attack_surfaces:
    - >-
      A1. IS THE CONTROL COMPARISON FATAL TO THE FINDING'S SIGNIFICANCE? The
      control (between-class, random other traces) shows MORE distinct F4b
      values (3) than the class itself (2). If between-class variation exceeds
      within-class variation, does that undercut any claim that F4b's variation
      is a special, isogeny-class-relevant phenomenon rather than simply "this
      invariant varies across curves generally, isogeny class or not"? State
      this as sharply as you can. This is the single most important question in
      this review.
    - >-
      A2. IS "CLASS-VARYING" EVEN THE RIGHT VERDICT LABEL FOR WHAT WAS FOUND?
      The contract's own verdict_definition says CLASS-VARYING fires on "at
      least one explicitly exhibited pair of class members differing in at
      least one family" -- a very low bar, satisfied even by a single outlier
      pair among 138. Does the execution report's presentation (leading with
      the binary CLASS-VARYING verdict) fairly represent that 5 of 6 families
      are invariant and the 6th splits roughly 48/52, or does it read as a
      stronger claim than the underlying numbers support?
    - >-
      A3. THE D-4 SUPERSESSION -- IS IT REALLY BENIGN? The report claims the
      first m3 run's defect was confined to one derived cross-check flag with
      every primary invariant unaffected. Check whether ANY of the affected
      14/30 subsample curves happen to be inside the F4b class-varying finding
      itself, and if the fix could have also changed which curves are counted
      in the 66/72 split, not just whether backend B "agrees".
    - >-
      A4. THE 2-VOLCANO GAP (D-3). true_volcano_level is not_computed per curve;
      only a histogram. Given L2's decomposition and this campaign's prior
      finding that volcano depth correlates with structural axes, could F4b's
      variation actually be explained by volcano LEVEL rather than by
      "isogeny-class membership" per se -- i.e., is this really a within-class
      finding, or could it be secretly tracking something the volcano-level gap
      prevents distinguishing? two_torsion_x_count is recorded per curve; does
      it correlate with the 66/72 split in a way that suggests this?
    - >-
      A5. THE PROTOCOL DEVIATION (D-1). Was the Coordinator's upward-substitution
      authorisation actually obtained BEFORE compute was spent, or does the
      timeline in the run manifests/execution_report suggest otherwise? Spot
      check timestamps.
    - >-
      A6. WHAT WOULD SETTLE A1 DECISIVELY? If A1 is the crux, what is the
      cheapest next measurement that would distinguish "F4b varies specially
      within an isogeny class" from "F4b just varies across curves in general,
      isogeny-class membership irrelevant"? Name it concretely -- this becomes
      the campaign's next action if the finding survives your review with a
      caveat rather than outright.
  constraints:
    - >-
      SC-1 FABRICATE NOTHING. If you cannot check something, say it is unchecked
      rather than passing it.
    - >-
      SC-2 YOU MAY NOT CHANGE RESEARCH STATUS. Write your report only. Do not
      edit any committed record, including execution_report.md or any run
      artifact. Do not commit.
    - >-
      SC-3 A CONFIRMED, CORRECTLY-SCOPED FINDING IS A VALID OUTCOME. You are not
      required to find a defect, and manufactured objections are as damaging as
      missed ones. If the finding is real and correctly scoped once A1-A6 are
      worked, say so plainly.
    - >-
      SC-4 STAY OUT of RQ-ICINV-475b5e's SIBLING contract EXP-ICINV-4d33aa
      (different, statistical, currently paused pending a v4 amendment) --
      do not conflate the two or import findings across them without saying so
      explicitly. Also stay out of EXP-INSTR-36c8cf, EXP-JINV-bd141d and
      EXP-VOLC-9f5571.
    - >-
      SC-5 Toy scale, claim_tier toy, sota_delta zero. Assert nothing about
      ECDLP hardness in either direction.
