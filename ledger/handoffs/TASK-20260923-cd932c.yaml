  constraints:
    - id: EC-1
      text: >-
        OBEY PROTOCOL v2 EXACTLY. That is the frozen specification read with
        the bound amendment and DEC-20260923-e788a1 AC-1 to AC-6. Do not
        edit the specification, the amendment, the preregistered prediction,
        HEUR-GFPN-DFLAT or any threshold. Do not score any ratio against the
        constant 2^20 (DC-2 T-1). Report F3 and the 2^36 tail check as
        "undecidable (AMD-EXP-GFPN-05ff43-20260923-reanchor-arm-iii DC-4)".
        Never report torsion_S5_norm with group order 1920. Fix (beta, lam)
        per (curve, p') before any target is drawn.
    - id: EC-2
      text: >-
        STAGE 1: IMPLEMENT, DO NOT RUN.
        - Write the v2 implementation to
          experiments/EXP-GFPN-05ff43/implementation-v2/ and its note to
          experiments/EXP-GFPN-05ff43/implementation-v2.md.
        - Write the v2 trial plan to
          experiments/EXP-GFPN-05ff43/trial-plan-v2.json (DC-6 R-2). It
          enumerates every planned (arm, curve_shape, p', m, target_kind)
          cell and every fixture, anchor and build package with its reserved
          RUN-GFPN-* id, in execution order. It declares any per-target
          watchdog uniformly per (arm, m) (AC-6), and totals at most 48
          packages.
        - Implement everything the amendment requires:
          - DC-2: the re-anchored scoring, with every hard-coded locus
            replaced in the v2 tree;
          - DC-3: torsion_S{m}_rq, S{m}_rescaled and torsion_S{m}_norm, with
            the single-flip test, lifting and certificate fields beta, lam
            and relation_mod_T, and an independent verifier that checks them;
          - DC-4: perf or callgrind instruction counts, the proxy bracket,
            identical construction charging, and inversion priced at 2.57;
          - DC-6 R-1 to R-10;
          - rulings.DC-5 jv_anchor_system_trace_identity.
        - Development checks are allowed. They create no run package, they
          report no number as a result, and they are listed in
          implementation-v2.md as development notes.
        - Then STOP and return. Stage 1 ends with no v2 run package on disk.
    - id: EC-3
      text: >-
        STAGE 2 ORDER, BLOCKING. Begin only after the dispatch precondition
        on phase A holds. Each step is a run package, recorded whether it
        passes or fails.
        (1) Fixture F-1, F-2 and F-3 at n = m = 3, at p' = 4111 and
            p' = 16777291, with the curves, beta values and four regression
            targets of square_analogue_n3.json plus two fresh seeded targets
            per prime. Expected D: raw_x 384, raw_u 384, S3 64, S3_rescaled
            64, torsion_S3_norm 64 (35 monomials, total degree 4), and
            torsion_S3_rq 16 (deg_A 2, deg_B 1, 14 monomials). Also the
            orbit-by-orbit bijection table (F-2(b)) and a ratio of 4 (F-3).
        (2) jv_anchor_system_trace_identity at p' = 16777291 on at least 3
            random targets, compared with k4a_anchor_system.py and with the
            archived RUN-GFPN-61bba9 traces, under msolve 0.6.5 -g 1 -t 1.
        (3) degenerate_symmetrization_identity, orbit_lifting_verifier and
            known_scalar_instances (frozen, blocking).
        Only when (1), (2) and (3) all pass does ANY n = 5 cell of ANY arm
        run, in trial-plan-v2.json order. F-4 (n = m = 4, b square) is run
        if feasible and is NOT blocking.
        A failure of (1), (2) or (3) STOPS the task at the gate. Return with
        the mismatch listed and classified per AC-5. A mismatch confined to
        raw_u or S3_rescaled is "implementation or derivation". Do not
        re-iterate the code inside this card. The repair is a successor task
        under a new Coordinator decision.
    - id: EC-4
      text: >-
        MEMORY ENVELOPE, MACHINE PROTECTION (AC-1; DC-7).
        - Every msolve child and every builder or interpolation process runs
          under RLIMIT_AS = 10737418240 bytes (10 GiB).
        - The limit is set in the child and read back with getrlimit, and
          the read-back value is logged and written to the manifest's
          resources block. A wrapper default is never recorded.
        - A child that cannot set the limit refuses to start.
        - One memory-heavy process runs at a time.
        - Before each child launch the driver checks its own RSS; above
          1 GiB it refuses the launch and records why.
        - Task envelope: at most 11 GiB. Host: 16481980 kB of RAM, no swap.
          The dispatching session's guard killed a v1 probe at 13.1 GB
          (implementation.md lines 224-228).
        - If the dispatching session reports a guard threshold below
          12.0 GB, lower the child cap to 2 GB below that threshold and
          record it.
        - msolve runs with -t 1 everywhere.
        - Peak memory per child is read from /proc/<pid>/status VmHWM and
          VmPeak.
        - Every not_measured row carries the full A-6 envelope tuple,
          including the cap actually in force.
        - A larger host of up to 32 GB is permitted only if the dispatching
          session provides it. It is recorded per run, and its rows are never
          merged with 10 GiB rows.
        Exhausting the cap is an infrastructure outcome, never evidence
        about D.
    - id: EC-5
      text: >-
        FIXTURE INDEPENDENCE (AC-4). Build the n = m = 3 arms from the
        amendment's DC-3 definition. Do not import, copy or execute any code
        from coordination/goals/GOAL-GFPN-380702/reviews/TASK-20260923-404bf9/scratch/.
        The JSON files there are read for curves, beta, targets and expected
        values only. k4a_anchor_system.py is executed as the independent
        comparator for the anchor identity. Its code is not copied into
        implementation-v2/.
    - id: EC-6
      text: >-
        WRITE ONLY INSIDE write_scope. v1 artifacts are READ-ONLY:
        implementation/, implementation.md, trial-plan.json, every existing
        runs/ directory, analysis.md, corrections/ and amendments/. No
        run directory is ever overwritten. No v1 reserved run id, including
        RUN-GFPN-bb78e5, is reused. New RUN-GFPN-* ids are minted with
        python3 tools/allocate_id.py and checked with --check.
    - id: EC-7
      text: >-
        TIMEOUTS, OOM, CRASHES, positive_dimensional and
        degenerate_parametrisation outcomes are recorded with their class and
        are never measured non-decompositions or evidence about D (AGENTS.md
        core rule 5; DC-6 R-5). The pre-declared A-7 early stop applies: two
        consecutive memory_exhausted outcomes at the same F4 degree in an
        m = 5 cell record the cell's remaining targets as not_attempted, with
        the stop reason. Any cell with a measured target continues to 20
        targets.
    - id: EC-8
      text: >-
        NO SECURITY STATEMENT. Band figures are emitted only per DC-2 B-3,
        next to 142.4 (uncharged) or 149.3 (charged), and labelled modeled.
        The execution report states no security level and draws no
        supported or refuted conclusion about H-GFPN-9a29be or
        HEUR-GFPN-DFLAT. It records observations, heur_dflat_pass values and
        comparison statistics only.
    - id: EC-9
      text: >-
        KNOWN-SCALAR, PUBLIC PARAMETERS, TOY CURVES ONLY. No live system, no
        unknown-scalar solve, no deployed-curve instance and no wall-time
        extrapolation. Amazon Bedrock is prohibited. Record in every manifest
        the requested policy (executor-implementation), the resolved binding
        as the session provides it, and fallback_used. Never substitute a
        policy silently.
    - id: EC-10
      text: >-
        MACHINE QUIET. No other solver-running process runs on the host while
        stage 2 runs. That includes EXP-GFPN-659e34, which is not runnable
        (DEC-20260923-9b0c79).

