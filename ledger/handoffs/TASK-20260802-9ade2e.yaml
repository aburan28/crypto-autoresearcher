handoff:
  id: TASK-20260802-9ade2e
  from: coordinator
  to: validator
  objective: 'Independently verify artifact and control integrity of RUN-PEC-6be870-a: check every declared
    hash binding, re-run the measurement code yourself, recompute the reported gamma fit and the extrapolated
    c from raw-result.json, and check each pre-registered control''s verdict against the evidence actually
    present.'
  uncertainty_reduced: Whether the NC-2 receipt is admissible evidence at all, and whether the reported
    numbers follow from the raw data.
  inputs:
  - experiments/EXP-PEC-6be870/specification.yaml
  - experiments/EXP-PEC-6be870/runs/RUN-PEC-6be870-a/
  - coordination/goals/GOAL-P13-001/batches/BATCH-002/archives/TASK-20260802-ca5bdc/snapshot_commit_receipt.json
  constraints:
  - 'Independent session: you did not produce these artifacts. Do not edit the producer''s files.'
  - 'Verify against the FROZEN contract, not against what the run happens to have done: any deviation
    between specification.yaml and the executed protocol is a finding, whichever direction it favours.'
  - Re-derive the gamma fit from raw-result.json with your own code. A fit you cannot reproduce is a finding.
  - 'Check C-NULL specifically: confirm the null-object control was actually run on a construction with
    O(1) per-entry cost, and that the instrument reported gamma ~ 0 there. A missing or degenerate null
    control voids the signal, per docs/inventor-protocol.md.'
  - Verify the modular-polynomial provenance claim by checking the recorded hash against the recorded
    source, and verify at least one Phi_ell(j_i, j_{i+1}) = 0 chain relation independently of the producer's
    code.
  - Missing evidence is reported as incomplete or invalid. Do not fill a gap with a plausible reconstruction.
  - Record requested_policy, resolved model identifier, fallback_used, and the degraded_requirements from
    INFAMEND-20260802-P13-002 in the report's inference block.
  - You verify integrity and arithmetic; you change no research status.
  deliverables:
  - validation_report.yaml with a terminal verdict (VALID | VALID-WITH-OBSERVATIONS | INCOMPLETE | INVALID)
    and a per-control verdict table
  artifact_paths:
