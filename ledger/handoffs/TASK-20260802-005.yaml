handoff:
  id: TASK-20260802-005
  from: coordinator
  to: reviewer
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-028
  role: reviewer
  objective: >-
    Review the frozen control contract, RR-IVR-1 and the wrapper driver ON THEIR
    MERITS, against seven named checks, and return PASS or REVISE with a
    recommendation_to_task_006 of APPROVE or DO_NOT_APPROVE. The run is gated on
    this review.
  uncertainty_reduced: >-
    Whether the instrument that is about to measure the yardstick can measure
    what it claims to measure, and whether it can do so without editing anything
    or importing the machinery it is supposed to be independent of.
  inputs:
  - experiments/EXP-LPF-001/control_ivr/control_specification.yaml
  - experiments/EXP-LPF-001/control_ivr/reading_rule_ivr.yaml
  - experiments/EXP-LPF-001/control_ivr/implementation/ivr001_driver.py
  - experiments/EXP-LPF-001/control_ivr/implementation.md
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/tasks/TASK-20260802-003/contract_report.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/archives/TASK-20260802-004/snapshot_commit_receipt.json
  - ledger/decisions/DEC-20260801-015.yaml
  - experiments/EXP-LPF-001/specification.yaml
  - experiments/EXP-LPF-001/reading_rule_v2.yaml
  - experiments/EXP-LPF-001/implementation/lpf001_driver.py
  - experiments/EXP-LPF-001/results/calib/
  constraints:
  - 'INDEPENDENT SESSION. You did not author, freeze or archive any artifact under review, and you did not author DEC-20260801-015.'
  - >-
    CHECK 1 - THE VERBATIM TRANSCRIPTION. Diff reading_rule_ivr.yaml against
    DEC-20260801-015's reading rule clause by clause. NO CLAUSE MAY BE ADDED,
    REMOVED OR REWORDED; only derived constants and computational detail may be
    added. Report any difference you find, however small.
  - >-
    CHECK 2 - THE NON-INHERITANCE CHECK, WHICH REPLACES THE FOUR-CHANGE CAP.
    Verify that RR-IVR-1 imports NO branch, band, cut, strike, certified ladder,
    gamma floor or disposition from RR-LPF-1 or RR-LPF-2. AN IMPORTED CLAUSE
    WOULD SILENTLY MAKE THIS CONTROL RE-ADJUDICATE BATCH-027, which the claim
    ceiling forbids outright. Search for it actively rather than confirming its
    absence by reading.
  - >-
    CHECK 3 - RE-DERIVE THE ATTAINABILITY ARITHMETIC WITH YOUR OWN CODE, from
    the chi-square distribution on nu = 19. Report the interval multipliers, the
    two declaration floors, and the power at VR = 16, 4, 2, 1.5 and 1.26 THAT
    YOU OBTAIN, never the numbers this handoff or the queue quotes. State
    whether you agree that k = 20 separates VR = 1 from VR = 16, and state
    independently what k = 20 does NOT buy.
  - >-
    CHECK 4 - THE WRAPPER DOES NOT MODIFY THE DRIVER. Verify from source AND by
    execution that ivr001_driver.py IMPORTS lpf001_driver.py and does not copy,
    fork, monkey-patch or vendor it; that no code path in the wrapper writes to
    any file under experiments/EXP-LPF-001/ outside control_ivr/,
    runs/RUN-LPF-001-ivr/ and results/ivr/; and that lpf001_driver.py hashes to
    786aeb0550d75fa3d0785aefbe50b121a24cacae584a4cadd79902c464722d65 with an
    EMPTY git diff. RUN THE WRAPPER'S SELF-TEST MODE AT bits = 12 YOURSELF and
    report what you observe.
  - >-
    CHECK 5 - PRE-Q-1 ANSWERED CORRECTLY. Re-read generate_instance FROM SOURCE
    and independently determine whether p varies with the seed or is fixed by
    bits. Confirm the contract states the right answer and that RR-IVR-1 says
    which quantity the between-instance sd then is. STATE THE CONSEQUENCE FOR
    RT049-B6 EITHER WAY - one shared small-x window across all 20 instances, or
    20 different ones.
  - >-
    CHECK 6 - THE FREE RIDER IS CONTROLLED, NOT UNCONTROLLED. Verify that BOTH
    nulls are specified - the closed form sqrt(p_bar*(1 - p_bar)/511) AND the
    permutation null at R_PERM = 2000 over the 130816 pair slots holding the
    incidence structure and the total smooth count fixed - that neither may be
    reported alone, and that the permutation is over PAIR SLOTS and not over
    indices. IMPLEMENT THE PERMUTATION NULL YOURSELF ON A SYNTHETIC EXCHANGEABLE
    INPUT and confirm the statistic is centred where the contract says it is.
    Also verify W3 is stated - that a clean free rider licenses NO statement
    about VR, because a purely second-order dependence is invisible to a
    first-order projection.
  - >-
    CHECK 7 - EVERY ARCHIVED ARRAY IS SPECIFIED AND EVERY REPORTED RATIO CARRIES
    AN INTERVAL. Confirm the 20 per-instance p_hat vectors per cell, the 20
    STAT-KS-DICK values per cell, the 512 per-index rates at every
    instance/cell/powered rung and the instance registry are all declared as
    archived arrays, and that no reported ratio anywhere in the contract lacks a
    sampling interval.
  - >-
    ALSO VERIFY THE FREEZE IS REAL. The contract package must be committed and
    reachable from HEAD at the TASK-20260802-004 commit, the three new sha256
    values must match, and NO instance of the 90001-90020 family may exist yet -
    no file under experiments/EXP-LPF-001/results/ivr/ or
    runs/RUN-LPF-001-ivr/. AN UNARCHIVED OR ALREADY-EXERCISED CONTRACT IS ITSELF
    A REVISE.
  - >-
    ASK THE ADVERSARIAL QUESTION EXPLICITLY AND ANSWER IT ON THE RECORD - is
    there any route by which this control could be made to return a favourable
    VR by choices the contract leaves open? Name the strongest such route you
    can construct and say whether the contract blocks it. Consider at minimum
    the seed family, the substitution rule, the choice of denominator array, the
    rung set, the primary declaration and the permutation-null construction.
  - 'STATE ANY PRECONDITION YOU ATTACH AND STATE WHETHER IT IS SATISFIABLE BY AN ARTIFACT OF THE CLASS YOU NAME - the BATCH-026 lesson, where an unsatisfiable precondition ended a batch.'
  - 'REPAIR NOTHING. You have no write scope over experiments/. If you find a defect, return REVISE and name it; the repair is a separate task in a separate batch by a session that is not this one.'
  - 'STATE WHAT YOUR PASS DOES NOT CERTIFY. A PASS certifies an instrument, not a result; it says nothing about OBJ-RT082-1 answer, about H-LPF-001, about HEUR-DS-1 or about the Semaev map in either direction.'
  - 'MAKE NO COMMIT; TASK-20260802-006 archives this report.'
  - 'Record inference honestly (requested review-adversarial, independent session, fallback_used true, model_verified false), and every YAML written must parse.'
  deliverables:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/reviews/TASK-20260802-005/contract_review.yaml
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/reviews/TASK-20260802-005/contract_review.yaml
  archived_by: TASK-20260802-006
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 7200
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
  - >-
    PASS or REVISE with a concrete defect list and a recommendation_to_task_006;
    all seven checks answered with measured or executed evidence rather than
    reading; the transcription diffed clause by clause; the non-inheritance
    check performed actively; the attainability arithmetic re-derived with your
    own code and your own numbers reported; the wrapper's non-modification
    verified from source AND by execution with the self-test run; PRE-Q-1
    re-determined from source with the RT049-B6 consequence stated; the
    permutation null implemented independently on a synthetic exchangeable
    input; every archived array and every interval confirmed; the freeze
    confirmed committed, reachable and unexercised; the strongest
    favourable-outcome route named and answered; any precondition stated with
    its satisfiability; what the pass does not certify stated; no repair
    authored and no commit made.
