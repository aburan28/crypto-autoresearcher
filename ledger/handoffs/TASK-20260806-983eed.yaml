handoff:
  id: TASK-20260806-983eed
  from: coordinator
  to: executor
  objective: >-
    Implement the frozen EXP-ECTD-001 instrumentation (meters, planted
    control, three null arms, matched rho/BSGS) and run RUN-ECTD-001-impl
    (smoke on one small class) then RUN-ECTD-001-screen (full >=5-class
    screen) exactly as the frozen contract specifies. Do not tune thresholds
    post-hoc.
  uncertainty_reduced: >-
    Whether any prime-field ordinary isogeny class exhibits a Semaev/FB/
    Macaulay heavy tail at toy N under frozen meters, surviving all required
    nulls and the planted-control instrument check.
  inputs:
  - experiments/EXP-ECTD-001/specification.yaml
  - ledger/hypotheses/H-ECTD-001.yaml
  - ledger/decisions/DEC-20260731-013.yaml
  - ledger/evidence/EV-ECTD-002.yaml
  constraints:
  - Do not edit experiments/EXP-ECTD-001/specification.yaml.
  - >-
    Freeze the factor-base convention and solver budget into the run driver
    and hash it into every run manifest (spec.inputs.factor_base_rule).
  - >-
    Five master seeds [201,202,203,204,205]; additional seeds only on
    class-construction failure, recorded as infrastructure per
    spec.replication.seed_policy.
  - >-
    All seven controls (CTRL-OUTSIDE-CLASS, CTRL-DEGREE-PROFILE,
    CTRL-PERMUTATION, CTRL-PLANTED-OUTLIER, CTRL-RHO, CTRL-BSGS,
    CTRL-NO-CLASS-INVARIANT-ENDPOINT) are mandatory, not optional.
  - >-
    CTRL-PLANTED-OUTLIER is mandatory: if not recovered as an outlier, stop
    and report decision_branch instrument_void (spec.stopping_rules) -- do
    not continue to a homogeneity reading.
  - >-
    Stop a curve's GB arm at the frozen solver budget; label timeout as
    infrastructure (AGENTS.md rule 5), never as a mathematical negative.
  - >-
    Any claimed solve or relation (including rho/BSGS baseline runs, if they
    resolve a real target) MUST emit a certificate per
    docs/claims-and-verification.md and pass independent re-verification
    before completed_valid; pure measurement runs declare certificate kind:
    none explicitly.
  - >-
    Do not report "trapdoor", "break", or any crypto-scale language in any
    artifact; claim_tier stays toy throughout.
  - >-
    Pre-register decision_table branches from the frozen spec; do not
    invent new branches or thresholds.
  - >-
    Record exact command, driver version, git commit and dirty-tree state,
    environment, seeds, requested/resolved model policy, and validity
    status per run (AGENTS.md Artifact policy).
  - >-
    Budget ceiling: wall_clock_seconds_per_run 7200, total_cpu_hours 40,
    maximum_memory_gb 16, maximum_runs 2 (spec.budget; do not exceed).
  deliverables:
  - RUN-ECTD-001-impl run manifest + raw-result.json (smoke on one small class)
  - RUN-ECTD-001-screen run manifest + raw-result.json with decision_branch
  - >-
    Per-class meter tables, planted/null-arm receipts, permutation
    stability table, matched rho/BSGS receipts
  - stdout/stderr for both runs
  artifact_paths:
  - experiments/EXP-ECTD-001/driver/MANIFEST.md
  - experiments/EXP-ECTD-001/runs/RUN-ECTD-001-impl/run.yaml
  - experiments/EXP-ECTD-001/runs/RUN-ECTD-001-impl/environment.json
  - experiments/EXP-ECTD-001/runs/RUN-ECTD-001-impl/stdout.log
  - experiments/EXP-ECTD-001/runs/RUN-ECTD-001-impl/stderr.log
  - experiments/EXP-ECTD-001/runs/RUN-ECTD-001-impl/raw-result.json
  - experiments/EXP-ECTD-001/runs/RUN-ECTD-001-screen/run.yaml
  - experiments/EXP-ECTD-001/runs/RUN-ECTD-001-screen/environment.json
  - experiments/EXP-ECTD-001/runs/RUN-ECTD-001-screen/per_class_meter_tables.json
  - experiments/EXP-ECTD-001/runs/RUN-ECTD-001-screen/planted_control_receipt.json
  - experiments/EXP-ECTD-001/runs/RUN-ECTD-001-screen/null_arm_receipts.json
  - experiments/EXP-ECTD-001/runs/RUN-ECTD-001-screen/permutation_stability_table.json
  - experiments/EXP-ECTD-001/runs/RUN-ECTD-001-screen/rho_bsgs_receipts.json
  - experiments/EXP-ECTD-001/runs/RUN-ECTD-001-screen/stdout.log
  - experiments/EXP-ECTD-001/runs/RUN-ECTD-001-screen/stderr.log
  - experiments/EXP-ECTD-001/runs/RUN-ECTD-001-screen/raw-result.json
  archived_by: TASK-20260806-4455ac
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
    resolved_model_id: claude-sonnet-5
    fallback_used: true
    fallback_reason: this harness cannot resolve policy aliases
    model_verified: false
  budget:
    wall_clock_seconds: 14400
    memory_gb: 16
    maximum_runs: 2
  completion_gate:
  - Both planned runs reach a terminal status
  - >-
    decision_branch recorded matches spec.decision_table exactly, no
    post-hoc threshold changes
  - >-
    All seven controls present with pass/fail recorded; planted control
    result determines instrument_void short-circuit
  - No trapdoor/crypto-scale language in any artifact
  - Every run has command, commit, environment, seeds, and validity status recorded
