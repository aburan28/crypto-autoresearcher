handoff:
  id: TASK-20260813-619d9c
  from: coordinator
  to: coordinator
  goal_id: GOAL-ECDLP-001
  sub_goal_id: SG-ECDLP-002
  question_id: RQ-ECDLP-002
  hypothesis_id: H-ISOU-c5bfea
  experiment_id: EXP-ISOU-2ac81f
  batch_id: BATCH-009b1b
  decision_id: DEC-20260813-d61a99
  archives_task_id: TASK-20260813-4bee82

  status: written_not_dispatched
  status_note: >-
    Written and carded. NOT DISPATCHED. This is the SNAPSHOT archive of the
    BATCH-009b1b pair, and it runs only after TASK-20260813-4bee82 has produced
    run artifacts and before TASK-20260813-e183e6 reads them. IT RUNS ALONE: no
    other agent works this worktree while it stages and commits, and it is never
    run concurrently with the ledger archive TASK-20260813-8a872d.

  archive_kind: snapshot

  objective: >-
    Commit the exact run artifacts produced by TASK-20260813-4bee82 as an
    isolated snapshot archive, BEFORE any independent review reads them, so that
    the Validator binds immutable committed bytes rather than a moving working
    tree, and push them to a branch with an open PR against main so they are
    published rather than merely local.

  uncertainty_reduced: >-
    Whether the census run set is durable and immutable at a named commit. That
    is the precondition for any review of it to mean anything, for any later
    evidence record to cite it, and for the post-commit verifier to accept it; a
    result that exists only in a working tree is not evidence of anything.

  inputs:
    - >-
      experiments/EXP-ISOU-2ac81f/implementation/ and
      experiments/EXP-ISOU-2ac81f/runs/ -- the artifacts as produced by
      TASK-20260813-4bee82, staged as they are and never edited.
    - >-
      coordination/goals/GOAL-ECDLP-001/tasks/TASK-20260813-4bee82/receipt.yaml
      -- the Executor task receipt naming the exact file paths written under each
      declared directory. The staged set is derived from it.
    - >-
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-009b1b/dispatch_queue.json
      -- TASK-20260813-4bee82's declared artifact_paths THERE are the authority on
      what this archive stages, because the archive's expected paths derive from
      the QUEUE. A declared set unequal to the committed set is the failure that
      makes an archive unverifiable and `completed` unreachable.
    - >-
      ledger/handoffs/TASK-20260813-4bee82.yaml -- the producer's committed card.
      Read for its constraints and deliverables. NOTE THE DISCLOSED DIVERGENCE:
      that record declares two DIRECTORIES and instructs the queue to copy them
      verbatim, but tools/research_dispatch.py rejects a directory and requires
      exact file paths, so the instruction is unsatisfiable as written and the
      record is immutable and cannot be fixed. The queue's file-level list is the
      same artifact set at finer granularity, minus the undeclared 24-bit runs.
      See handoff_record_divergence in the queue.
    - >-
      experiments/EXP-ISOU-2ac81f/specification.yaml -- the required_artifacts
      list, read to check PRESENCE of the required artifacts, never their
      correctness. Judging them is the Validator's job, not this one's.

  constraints:
    - >-
      RUN ALONE. No concurrent writer in this worktree during the archive. Never
      ask two workers to commit in one shared worktree.
    - >-
      STAGE ONLY THE DECLARED PATHS: the three source artifact paths from
      TASK-20260813-4bee82 plus this task's own receipt. No stray file, no
      generated artifact, no knowledge/INDEX.md, no dispatch plan, and nothing
      from any other lane rides in this commit.
    - >-
      THIS IS A SNAPSHOT ARCHIVE AND STAGES NO LEDGER RECORD. No evidence record,
      no decision, no hypothesis, no goal record and no checkpoint appears in
      this commit. Ledger records travel in the SEPARATE ledger archive
      TASK-20260813-8a872d, which runs alone and only after review.
    - >-
      THE COMMIT MESSAGE MUST LITERALLY CONTAIN TASK-20260813-619d9c AND EVERY ID
      IN the archive block's record_ids -- EXP-ISOU-2ac81f, TASK-20260813-4bee82
      and BATCH-009b1b -- as plain substrings. Naming them in prose is not
      enough; the verifier does a substring check.
    - >-
      FETCH origin/main AND MERGE IT into the working branch before generating.
      MERGE, NEVER REBASE: pushed run records are not rewritten. Record the base
      commit checked and the merge outcome in the receipt. Never resolve a sync
      conflict by editing a record -- stop and create a superseding record.
    - >-
      PUSH THE BRANCH AND OPEN OR REFRESH A PR against main naming the records. A
      record that exists only in a local commit is unpublished, not durable
      evidence.
    - >-
      DO NOT INTERPRET, SCORE, SUMMARIZE OR ADJUDICATE THE RUN SET. This task
      moves bytes into history and does nothing else. It writes no evidence
      record, assigns no evidence strength, changes no status and states no
      verdict on whether the census succeeded.
    - >-
      DO NOT EDIT ANY RUN RECORD, the specification, or any ledger record. If a
      required artifact is missing, record that it is missing in the receipt and
      report it; do not create, repair or backfill it.
    - >-
      IF THE POST-COMMIT VERIFIER REJECTS THE ARCHIVE, report the defect exactly
      as reported. Do not repair a run record to make the archive verify.
    - >-
      DO NOT STAGE experiments/EXP-ISOU-2ac81f/implementation/__pycache__. It
      exists on disk, it is NOT a declared artifact, and staging it would make the
      committed set unequal to the declared set -- the exact condition that makes
      an archive unverifiable. Do not delete it to tidy up either; simply leave it
      out of the staged set.
    - >-
      BEFORE STAGING, RECONCILE THE DECLARED SET AGAINST THE EXECUTOR RECEIPT.
      Every declared path must exist, and every path the receipt says was written
      must be declared. If they differ -- a missing declared file, an extra
      produced file, or executed 24-bit runs that were deliberately left
      undeclared -- STOP, do not stage, and report the exact difference. The
      Coordinator amends the queue's declared set to the exact produced set and
      re-renders; only then is this archive dispatched. Staging a set unequal to
      the declared set makes the archive unverifiable, and staging fewer files
      than were produced silently loses evidence.
    - >-
      THE DECLARED SET IS THE QUEUE'S, NOT THIS RECORD'S, AND THE QUEUE NAMES
      EXACT FILES. It declares implementation/census.py,
      implementation/certificate_checker.py, the eleven
      per-run files for each of RUN-ISOU-2ac81f-20BIT-A and
      RUN-ISOU-2ac81f-20BIT-B, and the Executor receipt -- 25 paths, none of them
      an obligation the committed card did not already promise. AMENDED 2026-08-14,
      AND THE TEXT ABOVE IS PRESERVED AS WRITTEN: all four runs completed valid
      inside budget, so the policy's first branch fired and the 22 files of
      RUN-ISOU-2ac81f-24BIT-A and RUN-ISOU-2ac81f-24BIT-B were added to the
      declared set in all three places. EACH LIST NOW DECLARES 47 PATHS and the
      staged set must equal it exactly. The 24-bit runs were
      executed if budget allowed but were NOT declared as mandatory, because a
      declared path a budget-exhausted run never produces makes `completed`
      unreachable; if they are produced they enter the declared set by the
      amendment above, or are archived by a successor archive card in a successor
      batch. They are never dropped.
    - >-
      No fallback, no degradation, no Bedrock (AGENTS.md rule 16).

  deliverables:
    - >-
      snapshot-receipt.json recording commit_sha, parent_sha, the exact declared
      paths with their path_sha256 digests, the source task ids, the record ids,
      the base commit of origin/main that was checked, and the merge outcome.
    - >-
      The branch pushed, with a PR open or refreshed against main naming
      EXP-ISOU-2ac81f, TASK-20260813-4bee82 and BATCH-009b1b.

  artifact_paths:
    - >-
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-009b1b/archives/TASK-20260813-619d9c/snapshot-receipt.json

  archived_by: TASK-20260813-619d9c
  archived_by_note: >-
    Self-archiving, as every archive task is: the receipt records the commit it
    itself makes.

  review_required: false
  review_note: >-
    An archive is a mechanical act with no research inference in it, so it
    carries no review. What it enables IS the review: TASK-20260813-e183e6 reads
    the bytes this task freezes.

  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false

  budget:
    wall_clock_seconds: 900
    memory_gb: 1
    maximum_runs: 1
    budget_note: >-
      Archive budget only. No experiment run and no census compute is authorized
      by this task; maximum_runs counts this archive act itself.

  completion_gate:
    - >-
      The archive verifier accepts the exact parent, the declared paths, their
      hashes, and the message identifiers.
    - >-
      path_sha256 covers exactly this task's artifact_paths together with
      TASK-20260813-4bee82's declared artifact_paths AS DECLARED IN THE
      BATCH-009b1b QUEUE -- no subset, no superset -- and the commit changes
      exactly that set and nothing else.
    - >-
      The declared set was reconciled against the Executor receipt before
      staging, and any difference was resolved by amending the queue and
      re-rendering rather than by staging a different set.
    - >-
      No ledger record, no interpretation, no evidence strength and no status
      change appears anywhere in the commit.
    - >-
      The branch is pushed and a PR against main is open or refreshed naming the
      records.

  return_format: >-
    The snapshot-receipt.json described above, plus a plain listing of the exact
    committed paths, the commit and parent shas, the origin/main base checked and
    the merge outcome, and the verifier's acceptance or its exact rejection.
    State any missing required artifact explicitly and separately. Do not state a
    conclusion about the census.
