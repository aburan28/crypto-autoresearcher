    memory_gb: 2
    maximum_runs: 4
  completion_gate:
    - Each of J1, J2, J3 and J4 carries its own verdict and its own recorded attack, and none is answered only by restating a producer.
    - The phase_a block is present, carries its own recorded hash, and is stated to have been written before paper_fulltext.md and TASK-20260905-a210bd's directory were opened; or the retrieval failed and the blind half of J4 is recorded UNPERFORMED with its endpoints and errors.
    - No path in blind_from appears in sources_read, and blind_from_respected is explicitly true; or a leak is reported honestly and the task stops.
    - The whole of specification.yaml was read, and the J1 scope audit names every block that could scope, override, restrict, supersede or redefine either target block, with line ranges and findings.
    - Every producer control was called on an input the reviewer constructed, what the producer's own code did is recorded, and the AC-3 and AC-4 positive controls were constructed and fired by the reviewer.
    - The proves-too-much control was run on all five declared objects including the positive control, and what each procedure actually did is reported.
    - The producer's retrieval procedure was audited - URL resolution, checksum reproduction, command reproduction, version match - and the result recorded either way.
    - Frozen-artifact immutability is checked and stated, and cost_model.py was neither read nor executed.
    - The report is a YAML file that yaml.safe_load parses, with a top-level review_attestation listing the four joint names verbatim, read_sibling_reports false, blind_from_respected explicit, and a verdict of holds, breaks or inconclusive.
    - The citation prohibition and its predicate extension are restated verbatim, neither is lifted, any recommendation is marked as not a decision, and no security, parameter, exponent or asymptotic claim is made.
  return_format: >-
    A short report naming the four joint verdicts, whether your own retrieval
    succeeded and what document type you obtained, the proves-too-much outcomes,
    whether every producer control fired on an input you built, and every
    limitation - including explicitly whether this review is model-independent.
    The ten values do not go in the message.
