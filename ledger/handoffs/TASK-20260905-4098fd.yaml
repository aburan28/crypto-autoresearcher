    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/reviews
  archived_by: TASK-20260905-5090ae
  dispatch_precondition: >-
    MAY NOT BE DISPATCHED while batch.yaml blind_phase_hygiene.protected_sha256
    is empty, or while the snapshot receipt's blind-history result is FAIL or
    UNCHECKABLE. Joint J4 has a blind phase.
  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: false
    degraded_allowed: false
