  task_card: coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/tasks/TASK-20260905-4098fd/task_card.yaml
  objective: >-
    Independently decide, on joints J1, J2, J3 and J4 of
    coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/review_plan.yaml:
    whether the contract defect at
    experiments/EXP-WESOVOW-001/specification.yaml:39-40 reproduces from the
    frozen file alone and whether its scope assumption survives audit; whether
    the drafted amendment addresses the category question in the narrow form this
    program adopted rather than the broader form DEC-20260904-4c81b6 PD-8 records
    as superseded; whether the amendment's licensing statement covers what it
    must, forecloses nothing it should not, and quietly repairs nothing it does
    not name; and, by retrieving a published copy of the source paper YOURSELF
    before reading anything of the producer's, whether this program's frozen
    transcript is faithful to the published article for the ten values every
    anchor comparison in this campaign rests on.
  uncertainty_reduced: >-
    Whether the campaign's oldest adverse finding is real as recorded or is a
    misread that three batches have cited, and whether the frozen transcript
    everything here depends on has ever been checked against anything outside
    this repository.
  inputs:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/review_plan.yaml - joints J1-J4, the proves-too-much control and the blind re-derivation are all yours
    - The snapshot-bound package under BATCH-752ef2/tasks/TASK-20260905-28c89d/ and the receipt at archives/TASK-20260905-6fcd2c/
    - experiments/EXP-WESOVOW-001/specification.yaml, read yourself and in full
    - ledger/decisions/DEC-20260904-4c81b6.yaml and ledger/decisions/DEC-20260904-166ab5.yaml
    - The public internet, through the configured agent proxy, for your own Phase A retrieval
    - inputs/P13-WESOLOWSKI-2026/paper_fulltext.md and BATCH-752ef2/tasks/TASK-20260905-a210bd/ - PHASE B ONLY
  constraints:
    - Independent session. You are the only reviewer of this round, which batch.yaml records as a cost and not a design virtue. Report on your joints, do not return a whole-claim verdict, and copy the four joint names verbatim into joints_owned.
    - Phase A is first for J4 - your own retrieval, your own extraction of the ten values with locators and comparability judgements, written and hashed - BEFORE opening paper_fulltext.md or TASK-20260905-a210bd's directory. J1, J2 and J3 may be worked at any time; they do not touch the ten values.
    - Do not read, list or glob any blind_from path of the plan, at any point, in any phase. None is needed for any joint you own, which is what makes the list mechanically checkable; list every path you read honestly in sources_read.
    - Do not run git log, git show, git blame or any command that prints a commit message before Phase A is written and hashed, and do not read files under .git/. Read the blind-history result recorded in the snapshot receipt instead.
    - A model recollection is not a retrieval; values you did not read out of a document you fetched may not appear in your Phase A transcription or comparison.
    - Run the producer's own control code against inputs you construct - import amendment_controls.py and call AC-1 through AC-4 directly, and build the AC-3 and AC-4 positive-control inputs yourself and confirm the scans fire.
    - Run the proves-too-much control on all five declared objects including the positive control, and report what each procedure actually did. A pass where the conclusion is known false is a BREAK, not robustness.
    - Read specification.yaml yourself, the whole file. J1's load-bearing question is a scope question and cannot be answered from two quoted excerpts.
    - Your report is a .yaml file with a top-level review_attestation mapping carrying task_id, joints_owned, sources_read, read_sibling_reports, blind_from_respected and verdict, parseable in full by yaml.safe_load, and the only file in the batch directory carrying that key.
    - Read-only on experiments/ and inputs/; cost_model.py is in your blind_from and may be neither read nor executed.
    - maximum_runs bounds executions of experiment code, producer implementations and anything that writes a run record; throwaway scripts, arithmetic and network retrievals are not runs. This batch authorizes zero new experiment runs.
    - Never disable TLS verification, never unset HTTPS_PROXY, transmit no repository content to any service, and never select a provider, backend, endpoint or model identifier containing Bedrock. If your retrieval fails, the blind half of J4 is recorded UNPERFORMED with its endpoints and errors and is NOT substituted by recomputation from the producer's artifacts.
    - Record at least one concrete objection per owned joint, or state for that joint that you searched and found none and exactly how. A joint answered by restating the producer is an uncovered joint.
    - A not_reproduced defect verdict and a not_retrievable provenance outcome are results, not incomplete tasks; review them as results.
    - If any value disagrees - yours against the frozen transcript, or yours against the producer's - record it precisely and stop investigating it; it contradicts a committed evidence record and requires a review tier this environment cannot serve.
    - Do not repair, complete or rewrite any producer artifact; change no status, write no ledger record, approve no amendment, and commit nothing. You may recommend on the citation prohibition; a recommendation is not a decision.
    - Restate the citation prohibition and its predicate extension verbatim and state whether either fired; check specifically that no crossover value, baseline comparison, margin or sign is derived, recomputed, tabulated or cited anywhere in the RC-6 package.
    - Make no security, SQIsign, CSIDH, standardized-parameter, exponent or asymptotic claim in either direction, and construct no attack.
  deliverables:
    - >-
      validation_report.yaml carrying a hashed phase_a block; a per-joint verdict
      from CONFIRMED, CONFIRMED WITH CAVEAT or REFUTED for each of J1-J4; the
      concrete objection or recorded failed search per joint; your own
      re-derivation of the contract satisfiability question with your scope audit;
      the inputs you fed to each producer control and what its own code did on
      them including the AC-3 and AC-4 positive controls; the proves-too-much
      results on all five declared objects; a phase_b block with the two
      comparisons and the producer-procedure audit; a limitations list including
      whether the review is model-independent; a citation-prohibition
      recommendation marked as not a decision; and a top-level review_attestation.
  artifact_paths:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/reviews/TASK-20260905-4098fd/validation_report.yaml
  joints_owned:
    - J1 independent reproduction of the contract defect, from the frozen file alone
    - J2 the category question, and whether the draft reverts to the superseded broader framing
    - J3 what the amendment licenses, forecloses, and quietly repairs
    - J4 external provenance of the frozen transcript, with an independent retrieval
  blind_from:
    - experiments/EXP-WESOVOW-001/cost_model.py
    - experiments/EXP-WESOVOW-001/runs/RUN-WESOVOW-001
    - experiments/EXP-WESOVOW-001/runs/RUN-WESOVOW-201692-001
    - ledger/evidence/EV-SSI-5d954c.yaml
