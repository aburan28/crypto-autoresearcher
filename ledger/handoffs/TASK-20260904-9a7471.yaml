handoff:
  id: TASK-20260904-9a7471
  from: coordinator
  to: idea-generator
  goal_id: GOAL-SSI-001
  batch_id: null
  batch_id_note: >-
    Ideation-only task opened under /propose-ideas step 3 on 2026-09-04 at
    user request ("create ideas for ssi and ecdlp"). NOT a batch of
    GOAL-SSI-001 and NOT part of BATCH-eb0a7e, which is terminal
    (TASK-20260824-52f6d0). This task authorizes no hypothesis, no
    experiment, no goal-status transition, and no dispatch. Sibling
    ideation task on the ECDLP side of the same user request:
    TASK-20260904-300a32.
  experiment_id: null
  hypothesis_id: null
  question_id: RQ-SSI-001
  recorded_at: '2026-09-04'
  objective: >-
    Generate SIX distinct, schema-complete, falsifiable proposals against
    RQ-SSI-001 -- can an algorithmic mechanism materially improve
    cryptanalysis of a SURVIVING supersingular-isogeny hardness assumption
    after the SIDH break (CGL path-finding, SQIsign's endomorphism-ring
    foundation, CSIDH's commutative group action, and the oriented /
    Deuring-side variants) -- biased hard toward the exemplar profile in
    docs/target-result-profile.md, whose canonical instance is exactly this
    problem (Wesolowski, supersingular isogeny in time and memory
    p^{1/3+o(1)}).
  uncertainty_reduced: >-
    Which mechanisms against a surviving supersingular assumption are worth
    the program's next unit of design budget, and which are already held in
    the 195 SSI/isogeny proposals the pool carries -- an uncertainty the
    program currently cannot answer because GOAL-SSI-001 has no active
    hypothesis and its last batch closed neutral.
  inputs:
    - ledger/questions/RQ-SSI-001.yaml
    - docs/target-result-profile.md (checklist C1-C18; the exemplar IS this problem)
    - inputs/P13-WESOLOWSKI-2026/paper_fulltext.md (full text of the exemplar)
    - knowledge/techniques/KN-TECH-055.md (exemplar technique abstract)
    - knowledge/techniques/KN-TECH-056.md and docs/inventor-protocol.md
    - knowledge/techniques/KN-TECH-080.md and docs/inventor-protocol.md section 8
    - knowledge/open-problems/KN-OPEN-013.md, KN-OPEN-014.md, KN-OPEN-015.md
    - knowledge/techniques/KN-TECH-024.md .. KN-TECH-029.md (isogeny spine)
    - knowledge/literature/ (7859 entries; grep by object name, do not enumerate)
    - ledger/proposals/ (1620 proposals; MANDATORY dedup, see constraints)
    - agents/idea-generator.md (schema and search heuristics)
    - templates/research-records.md ("Citation provenance")
    - AGENTS.md (core rules 1-16)
  constraints:
    - >-
      MANDATORY DEDUP BEFORE WRITING. A pre-built digest of the 195 existing
      SSI/isogeny proposal titles is at
      /tmp/claude-0/-home-user-crypto-autoresearcher/00e0faae-e3ef-5e1e-8042-c290e281f969/scratchpad/dedup_ssi.txt
      Read it in full FIRST. Then, for each object you intend to propose on,
      grep ledger/proposals/ for that object's name and read any hit before
      writing (standing practice PD-1, adopted by GOAL-ECDLP-001's coordinator
      on 2026-09-03 after a task re-derived what the pool already held). Every
      idea records what it was discriminated from in `discriminated_from`,
      naming the nearest existing IDEA-* by id.
    - >-
      The crypto-kb retrieval index is EMPTY in this environment
      (CRYPTO_KB_QDRANT_URL=':memory:'; search_knowledge returns nothing and
      says so in its startup log). You therefore have NO retrieval tool for
      external literature beyond WebSearch/WebFetch and the repo's own
      knowledge/ tree. Consequences, which are contract not preference: a
      reference you did not open is `provenance: recalled` with
      `verified_by: null`, an idea whose only literature is recalled is
      `novelty_status: unverified`, and no recalled citation may support
      `novelty_status: known` or `adaptation`. Naming the nearest work you can
      recall, hedged and marked, is WANTED. Presenting a recollection as a
      checked source is a core-rule-9 violation.
    - Academic / defensive cryptanalysis only. No operational key recovery against live systems.
    - >-
      Distinguish SIDH/SIKE (broken; torsion images published under the secret
      isogeny) from the survivors that publish no such images. A mechanism that
      silently assumes torsion-image access against a survivor is not a
      proposal against that survivor and must say so.
    - >-
      Charge every cost: preprocessing, memory, oracle queries, quantum query
      depth and width, and verification. State memory beside time in
      target_complexity, and disclose what hides in o(1)/polylog.
    - Do not reuse RQ-ISO-001 / EXP-ISO-001 scope (ordinary-curve Semaev neighbors).
    - >-
      Do not touch the frozen EXP-WESOVOW-001 charging-law defect or the
      fitted_opt/PAPER_PAIRS anchor reconciliation; that is a separate
      Executor-scoped source-fix lane and is NOT open. In particular you may
      NOT cite the P=512 crossover or the w=2^80 sign, which are under an
      explicit prohibition until independently reviewed.
    - >-
      Ideas are proposals only. Do not create or edit hypothesis, experiment,
      evidence, decision, or goal records; do not approve anything; do not
      assign work to the Executor.
    - >-
      Premature closure is a failure mode symmetric with overclaiming
      (docs/inventor-protocol.md). "This space is mined after the SIDH break"
      is a hypothesis about the search, not a reason to return fewer ideas.
  deliverables:
    - >-
      SIX idea records, one file each, written to the EXACT pre-allocated
      paths and ids below. Do not mint your own ids; you have no Bash and
      allocate_id.py is how ids are minted here.
    - ledger/proposals/IDEA-20260904-ec17aa.yaml
    - ledger/proposals/IDEA-20260904-9b58ab.yaml
    - ledger/proposals/IDEA-20260904-6e8793.yaml
    - ledger/proposals/IDEA-20260904-9bf9c6.yaml
    - ledger/proposals/IDEA-20260904-5b0fc9.yaml
    - ledger/proposals/IDEA-20260904-31f1fa.yaml
  artifact_paths:
    - ledger/proposals/IDEA-20260904-ec17aa.yaml
    - ledger/proposals/IDEA-20260904-9b58ab.yaml
    - ledger/proposals/IDEA-20260904-6e8793.yaml
    - ledger/proposals/IDEA-20260904-9bf9c6.yaml
    - ledger/proposals/IDEA-20260904-5b0fc9.yaml
    - ledger/proposals/IDEA-20260904-31f1fa.yaml
  write_scope:
    - ledger/proposals/IDEA-20260904-ec17aa.yaml
    - ledger/proposals/IDEA-20260904-9b58ab.yaml
    - ledger/proposals/IDEA-20260904-6e8793.yaml
    - ledger/proposals/IDEA-20260904-9bf9c6.yaml
    - ledger/proposals/IDEA-20260904-5b0fc9.yaml
    - ledger/proposals/IDEA-20260904-31f1fa.yaml
  archived_by: null
  inference:
    policy: research-deep
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: null
    memory_gb: null
    maximum_runs: 0
  completion_gate:
    - All six files exist at the exact paths above and parse as YAML with a single top-level `idea` key.
    - >-
      Every record carries: id, question_id (RQ-SSI-001), handoff_id
      (TASK-20260904-9a7471), added ('2026-09-04'), title, class, claim,
      mechanism, novelty_status, novelty_screen, citations (each with ref,
      provenance, claim, verified_by), assumptions, predictions (metric,
      direction, minimum_effect), minimal_test (design, controls,
      required_metrics), falsification_conditions, confounders,
      interpretation_limits, heuristic_assumptions (id, statement,
      rigorous_support, validation_plan), target_complexity (time_exponent,
      memory_exponent, best_known, hidden_overhead, tradeoff_note),
      dominated_by, sota_delta, discriminated_from, null_object_control,
      estimated_cost, recommended_priority, status ('proposed'), proposed_by
      ('idea-generator'), proposed_at ('2026-09-04'), source_refs.
    - >-
      proof_search_map is present and filled for every proof-oriented
      proposal (bottleneck, baseline_embedding, observation_collision,
      constructive_transforms, quantifier_order, method_ceiling,
      proof_obligations); a non-proof-oriented proposal sets
      not_applicable_reason instead of omitting it.
    - >-
      dominated_by is `null` ONLY after checking every row of the frontier
      across time, memory and data/queries, and sota_delta is quantitative.
      An unchecked null is a fabrication under core rule 5.
    - At least three of the six are exponent-moving (not log-cofactor polishing) and say against which assumption and baseline.
    - Every idea names in `discriminated_from` the nearest existing IDEA-* by id and says what distinguishes it.
  return_format: >-
    A markdown report listing, per idea: id, class, one-sentence claim,
    novelty_status, target_complexity time/memory vs best_known,
    recommended_priority, estimated cost, the nearest existing IDEA-* it was
    discriminated from, and its cheapest decisive test. Then a short section
    naming which of the six you would test first and why, and anything you
    screened OUT during dedup with the id that already held it.
  review_plan: null
