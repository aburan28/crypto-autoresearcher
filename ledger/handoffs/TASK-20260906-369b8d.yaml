  review_plan:
    claim_under_review: 'The executor''s run records for EXP-ECRANK-76a70d v1: whether the decidable success
      criterion was met or missed EXACTLY as frozen (arm B: >= 1 nonsingular quartic with 8 forced non-torsion
      points across 4 distinct twist classes of one k=3 coset inside the frozen box/caps, exact descent-free
      certificate reporting certified k=3 total >= 8 from the forced classes with the eigenspace/F_l split,
      zero verifier errors, all controls IV-1..IV-7 untriggered), and nothing beyond it. This round reviews
      the RUN RECORDS only: it does NOT promote C1, does NOT close anything, and does NOT touch the UNPROMOTED
      closure candidate of DEC-20260905-7adca0 -- any breakthrough/closure-tier promotion remains separately
      gated behind IMP-2 (review-breakthrough at max, never degraded).

      '
    coordinator_prior: 'Recorded BEFORE any reviewer runs. Expected: the instrument smoke self-test passes
      on committed fixtures; IV-1 known-false d=(1..1) reports total = n exactly (7 at n=8, 9 at n=10)
      -- I expect this to PASS because the certificate machinery is the committed verifier stack reused
      from EXP-ECRANK-e1e30e; the determinism re-run matches bit-for-bit; arms A and B complete inside
      the counted-op cap at the assumed >= 2 x 10^4 ops/s floor (finding 2''s disclosed assumption --
      if the real engine is slower I expect inert exhaustion with an honestly reported completed prefix,
      NOT a fake result). Arm B success itself is GENUINELY UNCERTAIN: the design derived P(zero | rate
      >= q) ~ 4.5e-5 for the positive branch at the declared floor q = 10^-3, but the true density may
      sit below q, in which case I expect an honest negative or exhausted-prefix report. Arm C (n=10,
      exponent 0) is borderline by design: a null there is a P3-relevant measurement, not an invalidation.
      Where I think a failure would hide, if there is one: (i) the twist-class distinctness bookkeeping
      (4 DISTINCT classes of ONE coset) -- a conflation would inflate the certificate total; (ii) the
      degeneracy filter IV-4 -- a leak would let a singular quartic count; (iii) the counted-op accounting
      itself -- an undercount would silently breach the frozen cap.

      '
    joints:
    - joint: J1 run-record integrity and determinism
      assigned_to: TASK-20260906-369b8d (validator)
      attack_plan: 'Re-parse every run manifest under experiments/EXP-ECRANK-76a70d/runs/ against the
        artifact policy (command, commit, dirty state, env, seeds, inference manifest, stdout/stderr,
        raw results, validity, timestamps, resources). Re-run the arm B determinism check from the committed
        seed 760708 and compare the instance list bit-for-bit against the record. Verify the checkpoint
        cadence (every 10^7 counted ops) appears in the raw outputs, and that any exhaustion report is
        classified as exhaustion, never as a result.

        '
    - joint: J2 blind re-derivation of the load-bearing certificate total
      assigned_to: TASK-20260906-369b8d (validator)
      attack_plan: 'For ONE arm-B certified instance (pick the first by seed order), re-derive the certified
        k=3 total contribution and its eigenspace/F_l split FROM THE STATEMENT OF THE QUANTITY AND THE
        INSTANCE PARAMETERS ALONE (spec section defining the certificate + the instance''s published twist
        class and point data), WITHOUT reading the executor''s implementation, notes, or report (blind_from:
        experiments/EXP-ECRANK-76a70d/source/, the run report bodies, execution-report.yaml). Agreement
        is evidence about the quantity; disagreement localises to one of two named implementations and
        blocks promotion until resolved.

        '
    - joint: J3 controls, invalidations, and scope honesty
      assigned_to: TASK-20260906-a2eb0c (red-team)
      attack_plan: 'Audit every control and invalidation trigger (IV-1..IV-7) against the raw outputs:
        did IV-1 report total = n exactly; did the planted synthetic control miss or recover the wrong
        exponent (IV-2); did the blind kernel re-derivation (IV-3) run and match; did the degeneracy filter
        (IV-4) strike anything and was anything struck that should have been; did any verifier reject
        a witness (IV-5); is there ANY descent, r_low, or floating point in the exact certificate part
        (IV-6); did the determinism re-run diverge (IV-7). Then attack SCOPE: any language in the executor''s
        records that reads beyond the frozen sample (10^4 seeded b-tuples per arm), beyond the tested
        n, or toward rank over Q / C1 closure is a finding; rule 6 binds negative outcomes to the exact
        tested scope.

        '
    - joint: J4 cost model and exhaustion inertness
      assigned_to: TASK-20260906-a2eb0c (red-team)
      attack_plan: 'Recompute counted-op totals from the raw checkpoint data and compare against the 1.0e8
        cap and the 7200 s wall per run; measure actual throughput against finding 2''s assumed >= 2 x
        10^4 exact Fraction ops/s floor and finding 3''s ~7.2 x 10^3 ops/b estimate; verify exhaustion
        (if any) is inert in BOTH directions -- a slow machine yields a completed prefix plus an exhaustion
        report, never a fake result and never a silently shortened cap. Check the per-run wall and total
        budget accounting against the handoff envelope (8 runs max).

        '
    blindness:
      within_round: 'The validator (369b8d) and the red-team (a2eb0c) may NOT read each other''s reports;
        each attests to what it read. Both read the SNAPSHOT COMMIT of the executor''s artifacts (sha
        named in their task cards) and the frozen contract on main. The Coordinator composes their joint-level
        verdicts; no whole-claim verdict is taken from either alone.

        '
      lifted_for: []
    proves_too_much:
      failure_signature: The pipeline reports a certified k=3 total >= 8 "from forced classes" for the
        known-false vector d=(1..1), OR the density metric reports a forcing signal on the scan-stage
        null objects that does not decay. Either outcome means the argument goes through where its conclusion
        is known false, and the review round FAILS regardless of arm B's result.
      objects:
      - 'The known-false vector d=(1..1) (IV-1): the certificate pipeline MUST report total = n there.
        If the pipeline''s argument "certified total >= 8 from forced classes" goes through for the known-false
        object, the argument proves too much and the round fails regardless of arm B''s result.'
      - 'The scan-stage null objects (seed 760711): the density metric must NOT report a forcing signal
        on null objects; a signal that does not decay on nulls is the canonical artifact tell.'
    blind_rederivation:
      blind_from:
      - experiments/EXP-ECRANK-76a70d/source/
      - the executor's run report bodies and execution-report.yaml
      what: 'The certified k=3 total and eigenspace/F_l split for one arm-B instance, re-derived from
        the spec''s statement of the quantity and the instance parameters alone (J2).

        '
