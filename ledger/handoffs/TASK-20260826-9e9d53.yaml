handoff:
  id: TASK-20260826-9e9d53
  from: coordinator
  to: coordinator
  goal_id: GOAL-MLKEM-005
  batch_id: BATCH-762807
  question_id: RQ-MLKEM-001
  opening_decision: DEC-20260824-5e222e
  objective: >-
    Make BATCH-762807's opening control plane and producer package DURABLE before any
    reviewer reads them: merge origin/main into the working branch (MERGE, NEVER
    REBASE), stage only the declared paths, create one snapshot commit naming the
    task and record IDs, record a content_first receipt with path_sha256 for every
    bound path, verify it with tools/research_dispatch.py, and push and open or
    refresh the PR. THEN, and only after the archive lands, write the review plan and
    the two sibling-blind assignment documents that open the review round.
  uncertainty_reduced: >-
    Whether the producer's instrument, acceptance suite and evidence artifacts,
    together with the opening control plane, are intact, complete against their
    declared path sets, and durable enough to found an independent review round --
    and what exactly the round is to attack, owned joint by owned joint, recorded
    BEFORE any reviewer reports so that concurrence can be distinguished from
    concurrence with what this Coordinator already believed.
  inputs:
    - >-
      The twelve declared artifacts of TASK-20260826-602395 and its implementation
      report.
    - >-
      The eight declared artifacts of TASK-20260826-f1340b: batch.yaml, the producer
      task card and six handoff envelopes.
    - >-
      coordination/goals/GOAL-MLKEM-005/batches/BATCH-762807/batch.yaml
      suggested_joints J1..J6, which seed the plan.
    - >-
      ledger/decisions/DEC-20260824-5e222e.yaml and DEC-20260815-3e8e9c.yaml -- the
      authority and the five binding conditions.
    - >-
      AGENTS.md 'Review architecture' and templates/research-records.md 'Review plan'.
  constraints:
    - RUNS ALONE. No other task of this batch may be running.
    - >-
      STAGE ONLY THE DECLARED PATHS. Do NOT stage dispatch_queue.json, do not stage
      dispatch_plan.json or dispatch_plan.md, and do not write, regenerate or stage
      knowledge/INDEX.md.
    - >-
      FETCH origin/main AND MERGE IT INTO THE WORKING BRANCH BEFORE THE ARCHIVE.
      MERGE, NEVER REBASE -- rebasing rewrites commits that pushed run records were
      archived in. Record the base commit checked and the merge outcome in the
      receipt. NEVER RESOLVE A SYNC CONFLICT BY EDITING A RECORD; stop and create a
      superseding record.
    - >-
      PUSH THE BRANCH AND OPEN OR REFRESH A PR AGAINST main NAMING THE NEW RECORDS. A
      record that exists only in a local commit is unpublished, not durable evidence.
    - >-
      VERIFY BEFORE DECLARING DONE. The commit must be reachable, change exactly the
      declared paths, and match the recorded hashes; content binding is primary and
      commit reachability is advisory. A content mismatch is FATAL.
    - NEVER INVENT A COMMIT SHA OR A HASH. Record only values you measured.
    - >-
      WRITE THE REVIEW PLAN AFTER THE ARCHIVE LANDS AND BEFORE EITHER REVIEWER RUNS.
      Record the Coordinator's PRIOR in it first; a prior written afterwards is
      unrecoverable and a review round without one is a set of agents asked to look at
      something.
    - >-
      OWN EVERY JOINT EXACTLY ONCE. Six joints, three per reviewer, disjoint, each
      with a WORKED attack plan naming what to build, compute or vary and where you
      think it breaks. An unowned joint is visible before the round rather than after.
    - >-
      SET blindness.mutual TRUE AND LEAVE lifted_for EMPTY. Give each reviewer ONLY
      its own assignment; the sibling's assignment, review directory and report are
      outside its read scope and the boundary is stated in both assignments.
    - >-
      REQUIRE A proves_too_much CONTROL and a blind_rederivation of the D6 quantity,
      with blind_from naming the producer's implementation, notes and report as
      literal path prefixes.
    - >-
      REQUIRE AN admissibility_ruling BLOCK FROM EACH REVIEWER, separate from its
      joint findings, answering whether this instrument is fit to carry the next
      capped run as ADMIT / DO NOT ADMIT / NOT IN MY SCOPE with the reason.
    - >-
      THE PLAN MAY NOT AUTHORISE ANY LATTICE COMPUTE AT d=512 AND MAY NOT DIRECT
      EITHER REVIEWER TO RE-RUN THE 100-BIT CELL. A reviewer's own probes stay at
      acceptance scale.
    - >-
      DO NOT INTERPRET THE PRODUCER'S RESULT, do not move a hypothesis and do not
      write a ledger record. This task archives and plans; it does not decide.
    - >-
      RECORD ANY DEPARTURE FROM batch.yaml's suggested joints in the plan's
      procedure_deviations rather than absorbing it.
  deliverables:
    - >-
      One snapshot commit binding the twenty declared paths of TASK-20260826-f1340b
      and TASK-20260826-602395 plus this task's own four artifacts, with a message
      naming BATCH-762807, both source task IDs and this task ID.
    - >-
      archives/TASK-20260826-9e9d53/snapshot-receipt.json -- content_first, with
      path_sha256 for every bound path, commit_sha and parent_sha as MEASURED, the
      merge base and outcome, the tools/research_dispatch.py and
      tools/validate_ledger.py outputs verbatim with any nonzero exit adjudicated item
      by item, the PR reference, and staged_not_in_binding_set disclosing
      dispatch_queue.json BY NAME.
    - >-
      review-plan/review_plan.yaml -- claim_under_review as the PRODUCER stated it,
      coordinator_prior, six owned joints with worked attack plans and breaking
      artifacts, blindness (mutual true, lifted_for empty), proves_too_much,
      blind_rederivation for D6, and procedure_deviations.
    - >-
      review-plan/assignment-TASK-20260826-9605ae.yaml -- the Validator's three joints
      (J1, J2, J3), its read boundary and its required admissibility_ruling.
    - >-
      review-plan/assignment-TASK-20260826-5ee48b.yaml -- the Red Team's three joints
      (J4, J5, J6), its read boundary and its required admissibility_ruling.
  artifact_paths:
    - coordination/goals/GOAL-MLKEM-005/batches/BATCH-762807/review-plan/review_plan.yaml
    - coordination/goals/GOAL-MLKEM-005/batches/BATCH-762807/review-plan/assignment-TASK-20260826-9605ae.yaml
    - coordination/goals/GOAL-MLKEM-005/batches/BATCH-762807/review-plan/assignment-TASK-20260826-5ee48b.yaml
    - coordination/goals/GOAL-MLKEM-005/batches/BATCH-762807/archives/TASK-20260826-9e9d53/snapshot-receipt.json
  archived_by: TASK-20260826-9e9d53
  archive:
    kind: snapshot
    binding_mode: content_first
    source_task_ids:
      - TASK-20260826-f1340b
      - TASK-20260826-602395
    commit_sha: null
    parent_sha: null
    path_sha256: {}
    record_ids:
      - GOAL-MLKEM-005
      - RQ-MLKEM-001
      - BATCH-762807
      - TASK-20260826-f1340b
      - TASK-20260826-602395
      - TASK-20260826-9e9d53
    note: >-
      commit_sha, parent_sha and path_sha256 are EMPTY AT OPENING because the
      authoring Coordinator subagent had no shell and could not compute a hash or read
      a commit. Inventing any of them would be a fabrication under AGENTS.md rule 5.
      The archiving session fills them from MEASURED values. binding_mode
      content_first because archive receipts bind to CONTENT first (CLAUDE.md): a
      content mismatch is fatal and commit reachability is advisory.
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 150
    memory_gb: 2
    maximum_runs: 1
    charged_runs_authorised: 0
    charged_runs_note: >-
      ZERO CHARGED EXPERIMENT RUNS. `maximum_runs: 1` is the dispatcher's minimum
      positive integer and is NOT an authorisation. See batch.yaml PD-1.
    justification: >-
      150 s, the same shape as this goal's prior snapshot archives (BATCH-f9780d's
      TASK-20260824-c7248f) plus authoring the review plan and two assignment
      documents.
  completion_gate:
    - >-
      The commit exists, is reachable, changes exactly the declared paths, and its
      recorded path_sha256 match the tree.
    - >-
      The receipt records commit_sha and parent_sha as MEASURED values, the merge base
      checked and the merge outcome, and the branch is pushed with a PR open or
      refreshed naming the new records.
    - >-
      dispatch_queue.json is NOT in the binding set and IS disclosed by name in
      staged_not_in_binding_set; dispatch_plan.json, dispatch_plan.md and
      knowledge/INDEX.md are not staged.
    - >-
      All twelve producer artifacts and all eight opening artifacts are present and
      bound.
    - >-
      The review plan exists, was written AFTER the archive landed and BEFORE either
      reviewer ran, and carries a coordinator_prior recorded before any report
      returned.
    - >-
      Every one of the six joints has exactly one owner and a worked attack plan with
      a named breaking artifact; no joint is unowned and no joint has two owners.
    - >-
      blindness.mutual is true, lifted_for is empty, and each assignment states the
      read boundary excluding the sibling's assignment and review directory.
    - >-
      proves_too_much and blind_rederivation blocks are present, and blind_from names
      the producer's implementation, notes and report as literal path prefixes.
    - >-
      Each assignment requires an admissibility_ruling block with the ADMIT / DO NOT
      ADMIT / NOT IN MY SCOPE choice and a reason.
    - >-
      The plan authorises no d=512 lattice compute and does not direct any reviewer to
      re-run the 100-bit cell.
    - >-
      No hypothesis moved, no ledger record was written, and no producer result was
      interpreted.
  return_format: >-
    Commit sha and parent as measured, the bound path set, the merge base and outcome,
    the verifier outputs verbatim, the PR reference, the six-joint assignment with
    owners, and confirmation that the plan was written after the archive and before
    either reviewer.
  review_plan: null
  review_plan_note: >-
    NULL HERE AND THAT IS DELIBERATE. This handoff OPENS the review round but is
    written at batch opening, before the producer has run and before there is a claim
    to review. Per AGENTS.md 'Review architecture' the plan itself is authored BY THIS
    TASK, after its archive lands and before either reviewer runs, at the declared
    path coordination/goals/GOAL-MLKEM-005/batches/BATCH-762807/review-plan/review_plan.yaml
    which is bound by this task's own artifact_paths. Writing a plan here would mean
    recording a prior about artifacts nobody has produced.
