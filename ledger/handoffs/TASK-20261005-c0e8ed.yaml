handoff:
  id: TASK-20261005-c0e8ed
  from: coordinator
  to: executor
  objective: >-
    Measure f, G_sat, G_mitm, and the verified triple sets for
    EXP-KIC-6ee7d9 on the frozen n=7 list, the two seeds, the two
    controls, and the capped n=11 list.
  uncertainty_reduced: >-
    Whether the n=7 charged-operation gap is explanation O, explanation
    S, a split population, seed-unresolved, or invalid.
  inputs:
    - ledger/hypotheses/H-KIC-278c66.yaml
    - ledger/proposals/IDEA-20260930-4406e0.yaml
    - experiments/EXP-KIC-6ee7d9/specification.yaml
    - ledger/decisions/DEC-20261005-b27a52.yaml
  constraints:
    - Use the shared multiplier for the solver circuit and for meet-in-the-middle.
    - Charge every ordered pair, including misses.
    - Read counters from the CryptoMiniSat binary. Omit a counter it does not expose.
    - Do not compare with F4 and do not retune the encoding after the first solve.
    - Keep n=11 targets that hit 100000 conflicts out of f.
    - Write nothing outside the declared write scope.
    - Use no Bedrock endpoint or model.
  deliverables:
    - experiments/EXP-KIC-6ee7d9/runs/<RUN-ID>/counters.json
    - experiments/EXP-KIC-6ee7d9/runs/<RUN-ID>/command.txt
  artifact_paths:
    - experiments/EXP-KIC-6ee7d9/runs/
  write_scope:
    - experiments/EXP-KIC-6ee7d9/implementation/
    - experiments/EXP-KIC-6ee7d9/runs/
  archived_by: TASK-20261005-bbacfc
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: null
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
    - base.json exists and its sha256 was recorded before the first solver call.
    - counters.json has one row per n=7 target per seed and names any omitted counter.
    - The n=7 triple-set comparison is present.
    - Capped n=11 targets are listed and excluded from f.
    - The run manifest records the git commit and the solver version string.
  return_format: >-
    Run id, validity, mean and minimum f, the G ratio, and the artifact
    paths.
  review_plan: null
  dispatch_preconditions:
    - archived_by TASK-20261005-bbacfc is committed and its receipt verifies.
    - The hypothesis, specification, and this handoff are committed and pushed.
    - A lane is claimed before launch.
