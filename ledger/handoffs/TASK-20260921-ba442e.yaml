    RUN-FROB-91ee9c-7119f2 and left in the SR-4 permitted terminal state
    `not_run_resource` after a SELF-IMPOSED 540-second wall-clock checkpoint
    that this amendment's budget corrects.

  uncertainty_reduced: >-
    FROB-EXT-q13n7 is the first cell with s=3 (rather than s=2 or s=4)
    equal-degree non-trivial factors, giving an achievable-partition lattice
    of Bell(3)=5 set-partitions (3 distinct slot-dimension multisets: [6]
    (m=1), [4,2] (m=2), [2,2,2] (m=3)) -- genuinely richer than
    FROB-EQDEG-q19n5's permanent Bell(2)=2 ceiling (CORR-20260921-9dc350
