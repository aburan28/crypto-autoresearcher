    - >-
      ledger/corrections/CORR-20260921-9dc350.yaml (correction C1 -- the
      Bell(3)=5 lattice fact; correction C2 -- the C2 fix rationale)

  constraints:
    - >-
      WRITE SCOPE: experiments/EXP-FROB-91ee9c/runs/TASK-20260921-ba442e/
      only. Never write to any prior run directory, specification.yaml, or
      any file under ledger/ other than this handoff's own status field if
      the harness requires it.
    - >-
      THIS IS A LONG-RUNNING COMPUTATION -- DO NOT RUN IT AS A SINGLE
      FOREGROUND SHELL CALL. A single synchronous tool call is capped at 10
      minutes; this run's own point estimate is 60-90 minutes and its
      authorized advisory budget is 3 hours (10800s). Launch the Sage
      subprocess in the background (redirect stdout/stderr to files,
      capture its PID, e.g. `nohup /opt/conda-sage/bin/sage -python
      implementation.py ... > work/FROB-EXT-q13n7.out.json 2>
      work/FROB-EXT-q13n7.err.log & echo $! > work/FROB-EXT-q13n7.pid`),
      then poll for completion (checking the PID and/or output file) at
      reasonable intervals rather than blocking on it, and do not let any
      individual tool call itself exceed the 10-minute per-call limit while
      waiting.
    - >-
      Use the curve already identified by the prior probe as your starting
      point (A=0,B=1,N=5,230,261 for curve index 0), but INDEPENDENTLY
      VERIFY it satisfies every condition in specification.yaml's
      object_selection text in full (prime N >= 17, exponent exactly 1,
      does not divide the curve's order over F_q, AND the Frobenius scalar
      condition ord_N(mu) = n verified by exhaustive charged lookup against
      independent point arithmetic) -- the prior probe explicitly
      describes itself as an "object-search-only probe," so do not assume
      it already performed the full mu-scalar verification. Do not
      re-search from scratch if verification succeeds; report explicitly
      if it does not, and fall back to a from-scratch scan only if needed.
    - >-
      Implement the FULL C1-C8 control battery for this cell, using the
      corrected per-slot-independent C2 construction from
      TASK-20260921-819bc0's implementation.py (a pool per dimension, grown
      to the multiplicity a partition needs, consumed in lexicographic
      order). For the [2,2,2] partition specifically, verify and report
      that all THREE assigned subspaces are pairwise distinct (not just
      pairwise distinct from a single other one, as in the [2,2] case
      elsewhere in this experiment).
    - >-
      C4's null curve requires an independent point-counting call over the
      full 62,748,517-element field (F_13^7) -- budget real time for this
      (Sage's SEA-based order computation is typically fast even at this
      size, but confirm rather than assume, and report the observed timing).
    - >-
      All arithmetic exact (Python fractions.Fraction or equivalent); no
      floating point in any reported ratio (IR-1).
    - >-
      Curve index 1 for this cell is OUT OF SCOPE. Do not search for or
      compute a second curve.
    - >-
      If the run genuinely cannot complete within the 3-hour advisory
      budget (a REAL checkpoint this time, not a premature self-imposed
      one), report `not_run_resource` honestly with the same rigor as the
      prior probe's own reasoning (observed throughput, extrapolated
      remaining cost, memory headroom) -- this is a permitted, non-negative
      SR-4 outcome. Do not force completion by cutting corners (skipping a
      control, reducing exactness, or approximating a count).
    - >-
      Reuse the machine-protection caps unchanged (maximum_memory_gb: 8,
      maximum_workers: 1). wall_clock_seconds is ADVISORY at 10800 per this
      amendment -- a checkpoint at or before that point is a legitimate
      watchdog outcome per CLAUDE.md, not a violation.

