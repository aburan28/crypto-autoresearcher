  from: coordinator
  to: executor

  objective: >-
    Execute EXP-FROB-91ee9c specification.yaml version 1 AS AMENDED by
    DEC-20260921-e81e25 (v2), DEC-20260921-2f89d4 (v3), and
    DEC-20260921-f93b43 (v4): attempt FULL COMPLETION of cell FROB-EXT-q13n7
