    first attempt at any measurement on this cell at all: does the
    partition-cost effect (spread of cost_ratio_neg across achievable
    partitions) appear at m=3, and do C2/C3/C4 show the same
    strictly-smaller/not-strictly-smaller pattern as the two-cell picture
    already recorded? FROB-EXT-q13n7 is explicitly NON-LOAD-BEARING for
    H-FROB-d93575's success/falsification criteria (SR-4) -- this run
    produces a new, independently interesting data point, not a resolution
    of the hypothesis's current status.

  inputs:
    - >-
      experiments/EXP-FROB-91ee9c/specification.yaml (FROZEN v1; read
      named_parameter_sets.FROB-EXT-q13n7, cell_execution_order,
      object_selection, factorisation_and_slots, factor_base, and every
      control's DESIGN verbatim -- do not redefine any of them)
    - >-
      experiments/EXP-FROB-91ee9c/amendments/DEC-20260921-2f89d4.yaml (the
