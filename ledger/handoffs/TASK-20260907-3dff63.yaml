  completion_gate:
    - "J3: a verdict on NULL-RANDSEL's known-false argument, backed by an extra-seed right-tail study of margin_null at the smallest tested a, with the largest observed margin_null reported individually whether or not the control passed."
    - "J4: for EACH of DECAY-A and DECAY-TSEL, an explicit answer to 'could this control have failed', with any clause shown to be satisfied by construction exhibited as an identity; and a check of whether DECAY-A's mbar(1/4) < 0 anchor is genuinely external to this batch or circularly re-derived from it."
    - "J5: a verdict on the ceiling-versus-mechanism boundary, an explicit recommendation on whether a = 1/16's blind-production agreement should carry reduced or zero independence weight, and a scope check that no conclusion outruns the tested (N, a, r, T_sel, seed set, instrument) or implies an exponent."
