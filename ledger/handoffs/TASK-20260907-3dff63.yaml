  objective: >-
    Own joints J3, J4 and J5 of the review round declared in
    ledger/handoffs/TASK-20260907-e423d5.yaml `review_plan`, and run the round's
    PROVES-TOO-MUCH control. Try to falsify the batch's controls and its
    interpretation rather than its arithmetic: break NULL-RANDSEL's known-false
    argument (J3), determine whether the declared decay controls could have
    failed at all (J4), and attack what a resolved result would be allowed to
    claim, including the blind-history contamination at a = 1/16 (J5).
  uncertainty_reduced: >-
    Whether the batch's feasibility verdicts rest on controls that can actually
    detect an artifact, or on controls that pass by construction -- and whether
    a resolved a = 1/8 would license anything beyond a ceiling-feasibility
    statement scoped to the tested grid. DEC-20260907-9b1b02 named the absence
    of an independent red-team pass as a disclosed gap of the prior batch; this
    task closes it.

  inputs:
    - experiments/EXP-ECDLP-6ac801/specification.v2.yaml (`controls` (f)-(j), `invalidation_rules`, `interpretation`, `blind_history_contamination`, `claim_tier_note`)
    - experiments/EXP-ECDLP-6ac801/amendments/v1_to_v2.yaml (`judgment_calls`, where the Coordinator's own doubts about these controls are recorded)
    - ledger/handoffs/TASK-20260907-e423d5.yaml `review_plan` (your joints J3, J4, J5, the proves_too_much objects, and the Coordinator's prior)
    - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-e9fd22/archives/TASK-20260907-60957d/snapshot-receipt.json (the frozen tree under review)
    - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-e9fd22/tasks/TASK-20260907-e423d5/execution_report.yaml
    - experiments/EXP-ECDLP-6ac801/runs/ and source_v2/ (the producer's package -- you are NOT blind to these; the blind constraint binds TASK-20260907-6a2b2e, not you)
    - ledger/evidence/EV-ECDLP-60e266.yaml and EV-ECDLP-2e9680.yaml (the external anchors OBJ-1 and DECAY-A rest on; check whether those anchors are genuinely external to this batch)
    - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-289698/tasks/TASK-20260906-90e7cf/src/pipeline_perm and results/j4_perm/ (the lane's permanent bijection negative fixture, OBJ-4)
    - docs/inventor-protocol.md ("controls before belief"; the closure and obstruction standard)

  constraints:
    - >-
      A CONTROL THAT CANNOT FAIL IS THE FINDING. Your first question at J4 is
      not "did the control pass" but "could it have failed". The Coordinator has
      already recorded a prior that DECAY-TSEL is the weakest of the four and
      that its monotonicity clause was tautological before being removed. Confirm
      or overturn that; overturning a recorded prior is among the most valuable
      results this round can produce.
    - >-
      COMPUTE, DO NOT ARGUE, WHERE COMPUTING IS CHEAP. J3 asks for the right
      tail of margin_null at the smallest a, not its mean; N = 2^20 is roughly
      16x cheaper than N = 2^24 and many extra seeds there are affordable. An
      objection backed by a produced instance is worth more than one backed by
      reasoning about one.
    - >-
      RUN THE PROVES-TOO-MUCH CONTROL AS A CONTROL. Apply the producer's
      pipeline and the contract's predicate UNCHANGED to OBJ-1 through OBJ-4 in
      `review_plan.proves_too_much`. Do not adapt the pipeline to make it work
      on the bijection fixture -- if it crashes rather than refusing
      structurally, that is itself the finding (the same class of defect the
      lane already recorded as F-J4-4 on EXP-ECDLP-612fb1).
    - >-
      REPORT ON YOUR OWN JOINTS ONLY. You own J3, J4, J5. You are blind to
      TASK-20260907-6a2b2e's report and may not read it or any file under its
      task directory. You may read the producer's package freely; the blind
      constraint in this round binds the re-deriver, not you.
    - >-
      DO NOT TOUCH THE PRODUCER'S ARITHMETIC AS YOUR MAIN LINE. J1, J2 and J6
      are owned. If you find an arithmetic defect incidentally, report it as an
      out-of-joint observation and say so; do not spend your budget there.
    - >-
      YOU DO NOT CHANGE STATE. No hypothesis status, no evidence record, no
      decision, no edit to any frozen contract or to any BATCH-3c7493 artifact.
      Write only inside write_scope.
    - >-
      A timeout or crash in your own probing is infrastructure signal about your
      probe, never evidence about the hypothesis or about the producer's result.

  deliverables:
    - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-e9fd22/tasks/TASK-20260907-3dff63/red_team_report.yaml
    - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-e9fd22/tasks/TASK-20260907-3dff63/proves_too_much_results.json
    - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-e9fd22/tasks/TASK-20260907-3dff63/src (any probe code you write, committed with your report)

  artifact_paths:
