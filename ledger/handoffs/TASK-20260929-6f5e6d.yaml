  objective: >-
    Run /design-experiment on IDEA-20260926-20ba8f under RQ-BINSTD-b6f698 as a
    version-3 revision within DEC-20260928-63addc S1 scope and design
    conditions C1 to C8 unchanged. Write H-BINSTD-099d93 and EXP-BINSTD-8cb697
    (status review_required, approved_by null), each complete in itself and
    each carrying supersedes naming its version-2 record, and a new
    proof-search-map audit sheet with fixture_code and stage0_code as
    committed, import-safe code. Discharge DEC-20260929-1f5fcb's breaking item
    R2-J3-1 and every required_moderate and required_minor item by number
    (listed under revision_items below), with the constants, the committed
    m = 4 range and the Stage 0 arithmetic unchanged or every change listed in
    a constants_delta block. Zero runs.
  uncertainty_reduced: >-
    Whether a complete protocol exists whose invalidation, stopping and
    admission rules, applied to its own declared metrics and modal pattern,
    leave every declared outcome reachable, with a G1 gate whose false-fail
    rate under its own model is small and stated at every cell regime.
  revision_items:
    source: DEC-20260929-1f5fcb revision_requirements, verbatim in substance; the decision is the authority where wording differs
    breaking:
      - id: R2-J3-1
        requirement: >-
          Scope IR-5 so it cannot fire on the contract's own declared figures.
          Restore the carve-out: reporting a figure that sums shared and
          per-target units IN PLACE OF their separate columns invalidates that
          figure, and the declared per_target_cost(L) of AM3 and FR_by_L is the
          defined exception. Decide and state whether IR-5 remains in the
          run-wide list of success_criterion and contract_label.RUN-ARTIFACT.
          Align the hypothesis' proof_obligations ("never summed into one
          figure"). State which committed program evaluates IR-5 (binstd_core
          stage2_outcome took run_valid as an input in version 2). The audit
          sheet then records one check per invalidation and stopping rule:
          applied to the contract's own declared metrics and to its modal
          pattern P1, which outcome results.
    required_moderate:
      - id: R2-J3-2
        requirement: >-
          Make G1's false-fail rate under the contract's own model small and
          stated, per cell regime. Either scale the KR and FR bands per cell to
          the model's sampling sd at that cell's mu and B, or add a same-regime
          Z/NZ control (B = 512, N the least prime above 2^19, mu about 1).
          Correct derivation_notes D-4 for the control. Restate most_likely
          with the model probability that G1 fails when H1 and H2 hold.
      - id: R2-J3-3
        requirement: >-
          State in admissible_ranges, and in statement (D)'s gloss of "the FORM
          of the amortisation law", that in the reuse arm AM1 to AM3 reduce to
          (rho_rel, a_bar), that AM3 is dominated by AM1, and that
          FR = a_bar / a_pred. Either replace AM3 by an observable with its own
          failure region, or say that the L-dimension is not tested by the
          reuse arm as designed.
      - id: R2-J3-4
        requirement: >-
          Pre-register the LOW-RETRY instrument audit: what it checks, and
          which declared outcome it assigns either way. State which per-cell
          class a KN-FIND-007-direction yield deficit maps to. Quote the
          finding's own quantity (target coverage) in H1's
          random_model_justification.
      - id: R2-J2-1
        requirement: >-
          Wire every procedure step 2 self-test (the I1 seeded system; the I4
          point, table and schoolbook checks; oracle A against brute force) to
          a declared consequence: CTL-7 with S3, or an invalidation rule, so
          that an instrument defect cannot reach a declared NEGATIVE through
          LOW-COV. State how the I3 to I5 code is bound: committed and
          digest-pinned under IR-6 before Stage 2, or pinned in the execution
          batch's snapshot before any run, with the gap stated.
      - id: R2-J4-1
        requirement: >-
          State the TW-01 containment clause (outcome_table.tw01_caution; audit
          tripwire_preregistration) as a c = 1 statement with the range of c on
          which it holds. Add the critical-g shift (+log2 c) to the
          column_conventions sensitivity. The c-independent routing rule stays
          as written.
    required_minor:
      - {id: R2-J3-5, requirement: 'Fix the relation kept at mu about 1: a seeded uniform choice among the returned decompositions, or a fixed and modelled order. A2 says which.'}
      - {id: R2-J3-6, requirement: 'Derive the outcome_reachability patterns from generative quantities through the reuse-arm identities; P5, P6 and P8 were not producible data.'}
      - {id: R2-J3-7, requirement: 'State CTL-6 as the delta_hat test plus an integrity assertion; two of its conjuncts could not fail under the committed control code.'}
      - {id: R2-J4-2, requirement: 'Word Stage 3 as a proposed column note for a Coordinator decision, consistent with statement (D).'}
      - {id: R2-J4-3, requirement: 'Replace "any prime-field object at all" with "no prime-field curve and no prime-field engine cell".'}
      - {id: R2-J1-1, requirement: 'Correct the L = 1 residuals to their values at the frozen inputs, and state that the tie rule is load-bearing at the frozen m = 4 input.'}
      - {id: R2-J1-2, requirement: 'Give the m = 4 envelope figures an honest provenance on the committed grid (producer recomputation, or stage0_code at S0 plus the recorded review recomputations).'}
      - {id: R2-J1-3, requirement: 'List the LA iteration constant (LA = k m B^2) as a hidden cofactor with its sensitivity. No comparator or model change is required, and the D3 pin uses the same k = 1.'}
      - {id: R2-J2-2, requirement: 'Print the comparator memory at the m = 4 cap-slice and envelope upper ends (stage0_code computes the envelope value; add the cap slice), or reword "both memories are stated".'}
      - {id: R2-J2-3, requirement: 'Align "reaches 100000 attempts" in stage_1 (g), the fixture criterion and S5 with the coded test.'}
      - {id: R2-J2-4, requirement: 'Reconcile the "no numpy" instruction with the CERTBIN helpers impl_layout copies, by naming which helpers are dropped.'}
      - {id: R2-PROC-1, requirement: 'Give stage0.py a __main__ guard so that importing it executes nothing.'}
    recommended_not_required:
      - Vendor the three retrieved PDFs under inputs/ with their sha256 (audit OI-2), so R-SRC provenance is durable. Not required; if done, the vendored files are a scope change returned to the Coordinator, not written by this card.
