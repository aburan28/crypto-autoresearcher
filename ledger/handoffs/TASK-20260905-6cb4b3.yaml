handoff:
  id: TASK-20260905-6cb4b3
  from: coordinator
  to: executor
  objective: >-
    Execute EXP-ECDLP-a26bde: on five frozen global curves with small rational
    points, reduced at toy primes, verify the formal-group digit identity
    d(m S^) = m d(S^) mod p, the m^2 size law of x(m S^), the non-homomorphic
    contrast against the Teichmuller section, the recovery of m (with
    certificate [m]S = T) from an explicit lift built using m, and the
    anomalous curve's refusal at the torsion-section division step. This
    decides H-ECDLP-6a9479 claims (1)-(4) at toy scale; no attack or exponent
    is claimed.
  uncertainty_reduced: >-
    Whether the hard-lift localisation identity and its size law hold exactly
    at toy scale, whether the Teichmuller section stays non-homomorphic, and
    whether the anomalous control breaks the argument at the correct step.
  inputs:
    - experiments/EXP-ECDLP-a26bde/specification.yaml
    - ledger/hypotheses/H-ECDLP-6a9479.yaml
    - ledger/proposals/IDEA-20260905-848b77.yaml
    - ledger/proposals/IDEA-20260905-dacf4f.yaml
  constraints:
    - >-
      Coordinator approval required before execution; this contract is a design draft and is NOT approved.
      Satisfied by DEC-20260905-908616, which sets the specification's status to approved and approved_by to coordinator.
    - Stage 1 is blocking; no multiple is computed before the self-checks pass.
    - The leak arm consumes the scalar to build the lift it reads; its output is a demonstration of the identity, never a recovery result, and the evidence record must say so.
    - No live keys or deployed curves; self-generated toy instances only.
    - numpy is not required for this contract (pure Python fractions); do not add it as a dependency.
  deliverables:
    - run records under experiments/EXP-ECDLP-a26bde/runs/<RUN-ID>/
    - an execution_report per docs/task-lifecycle.md
  artifact_paths:
    - experiments/EXP-ECDLP-a26bde/
  archived_by: TASK-20260905-6cb4b3
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 14400
    memory_gb: 4
    maximum_runs: 24
  completion_gate:
    - every planned run reaches a terminal status
    - manifest.yaml, raw-result.json and the derivation note are present for every run
    - the execution_report states the digit-identity agreement rate, the size-law slope, the Teichmuller contrast rate, leak recovery certificates, and the anomalous break-step outcome exactly as specified in the contract's required_metrics
  return_format: execution_report YAML per docs/task-lifecycle.md
  review_plan: null
