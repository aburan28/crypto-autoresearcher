  constraints:
    - id: VC-1
      text: >-
        BUILD FROM THE STATEMENT. Your own F_{2^17} arithmetic modulo
        t^17 + t^3 + 1; your own S_3 from KN-TECH-b18366, self-tested on at
        least 100 point pairs of the archived curve; your own descent to
        f_0..f_16 by TWO routes that must agree (symbolic expansion in
        F_{2^17}[v_0..v_17] with v^2 = v, and interpolation of each output bit
        from direct evaluation over all 2^18 v); your own Boolean-ring monomial
        product and XOR. Record ambiguities and your reading of each.
    - id: VC-2
      text: >-
        INSTANCE BINDING. Parse each certificate's key (set:family:idx). For
        curve instances take x_R from RUN-CERTBIN-3b7e05 targets-F-S3.jsonl.gz
        by idx and cross-check it against instance-sets.json archived.x_R; a
        mismatch is a finding. For null instances take the equations from
        systems/null-systems.json by key. Do NOT decode or use instance-sets.json
        E_hex for construction. After your construction is fixed you MAY
        decode E_hex (with the convention stated in the a4f217 receipt) for a
        construction-agreement comparison on curve instances, reported
        separately.
    - id: VC-3
      text: >-
        VERIFY EVERY CERTIFICATE. For each line: build sum over (mu, k) in C
        of mu*f_k in B and check it equals exactly the constant 1. Record per
        certificate: key, closure label, verified true/false, |C|, max deg mu,
        distinct k used, and, on failure, the residual's size and five of its
        monomials. For every certificate labelled M_5 check max deg mu <= 3;
        for every certificate, record max deg mu against its closure label
        without judging what it means (the red team owns that reading).
    - id: VC-4
      text: >-
        YOUR OWN NEGATIVE CONTROLS, for EVERY (closure, set) kind present in
        the file, at least 5 each: (a) one pair removed; (b) one k changed;
        (c) one mu changed to another monomial of the same degree; (d) a
        certificate transplanted onto a different instance of the same set.
        Declare the seed or rule you use to pick positions. All must reject.
    - id: VC-5
      text: >-
        SANITY OF YOUR CONSTRUCTION. On at least 20 certified instances (at
        least 5 curve and 5 null), count Boolean solutions exhaustively over
        2^18 with your own f_k. A verified certificate on an instance with
        s >= 1 would mean YOUR construction or checker is wrong; stop and
        report it.
    - id: VC-6
      text: >-
        SEAL, THEN READ. Write verification.json first and record its sha256
        and the UTC time in seal.txt. Only then may you open the run's reports
        (never certificate-verification.json or the negative-control files,
        which stay in must_not_read), and only then write
        validation-report.yaml. Never change verification.json after sealing;
        a correction goes to verification-v2.json with a note.
    - id: VC-7
      text: >-
        VERDICT ON J1: `holds` if every certificate verifies under your
        construction, every M_5 certificate has max deg mu <= 3, and every
        negative control rejects; `breaks` if any certificate fails under a
        construction whose self-tests pass (show the residual); `inconclusive`
        if the failure localises to the key mapping or to the null-system
        decoding (an extraction question, not a certificate question). Report
        on J1 ONLY; no whole-claim verdict.
    - id: VC-8
      text: >-
        ZERO TRIALS. Verification computations only; no RUN-id; no git write;
        write only in your directory; memory cap 3 GB. A timeout is
        infrastructure, never a result.
    - id: VC-9
      text: >-
        DISCLOSED PRIOR (review-plan PD-R1). The Coordinator's review prior was
        written after it read the run's results. Attack J1 on its merits; do
        not compensate in either direction.

