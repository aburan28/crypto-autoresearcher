  constraints:
    - >-
      NO ENGINE IMPORT OR EXECUTION: do not import or execute anything under
      src/crypto_autoresearcher (or any engine code). The replica is
      re-implemented from the archived script's logic; the analysis is pure
      computation on the rows. This creates NO RUN id, writes nothing under
      experiments/, and is never evidence about any base, class or m beyond
      its own rows.
    - Write ONLY under coordination/tasks/TASK-20261002-a8bbd8/. Do not modify any existing record or file.
    - >-
      Construction verbatim from the archive: the same N rule, encoding,
      pair-counting, row fields and mode semantics as
      attacks/07_ptm5_analysis.py; the same r, r_frozen, r_rank conventions
      as attacks/f3-lemma-map.yaml symbol_map; the same analysis conventions
      as TASK-20261002-758e51/code/01_analysis.py (weights w = 1/(N B),
      quantile method, MC-5 calibration structure, seeds declared). Any
      deviation is recorded in the report with its reason; nothing is
      silently changed.
    - >-
      POWER RULE (DEC-20261002-0df88e, fixed before data): n = 200 per (m,
      rung) cell; rungs computed in ascending order (26, 28, 30, 32); m = 5
      on-mode only if >= 50% of the wall clock remains after m = 4; if a
      rung cannot finish inside the budget, STOP, record the stop reason (a
      stop is blocked, never a finding), and do not silently change n. The
      archived 12..24 rows are the first segment and are READ, never
      regenerated.
    - >-
      OUTCOME RULE (DEC-20261002-0df88e, fixed before data): report the
      26..32 segment slope with its calibrated interval against the archived
      12..24 slope and 0; the outcome is FLAT (interval excludes the 12..24
      slope), CONT (overlaps the 12..24 slope and excludes 0), AMBIG
      (overlaps both), or CROSS (any rung's calibrated 99% interval excludes
      1 from below -- FLAGGED, never self-interpreted). The narrowest
      supported sentence per outcome.
    - >-
      Machine protection: launch only with >= 6 GB MemAvailable; RSS stop at
      2.5e9 bytes per process; ONE computation process at a time; wall clock
      21600 s; outputs under 50 MB; the host disk is near full (~5 GiB free)
      -- write compactly and check df before each rung batch.
    - >-
      Determinism: fixed seeds declared in the code and the receipt; every
      command recorded verbatim; stdout and stderr retained; a timeout,
      crash or disk-full stop is failed_infrastructure, never evidence.
    - Toy scale (the replica stops at 32 bits); no deployed-curve claim, no
      universal impossibility, no exponent below rho (TW-SCOPE discipline).
    - >-
      No status change, no hypothesis record, no evidence record, no ledger
      write: observations only.
