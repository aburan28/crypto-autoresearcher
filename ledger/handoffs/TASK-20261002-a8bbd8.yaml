# (DEC-20261001-494663 NA-3 (b); designed and approved by DEC-20261002-0df88e
# with the power rule and outcome rule FIXED BEFORE DATA). Generate the
# exactly generic replica at rungs 26, 28, 30, 32 bits (m = 4 on-mode primary;
# m = 5 on-mode only if >= 50% of the wall clock remains), construction
# verbatim from the red team's archived replica logic with NO engine import,
# then run the F7(a) analysis conventions on the new rows combined with the
# archived 12..24 rows and report the pre-registered outcome. Observations
# only; no status change; no RUN id.
# =============================================================================
handoff:
  id: TASK-20261002-a8bbd8
  from: coordinator
  to: executor
  objective: >-
    (1) GENERATE the exactly generic replica at rungs 26, 28, 30, 32 bits
    (n = 200 instances per (m, rung) cell, the archived design), m = 4
    on-mode primary, m = 5 on-mode only if at least 50% of the wall clock
    remains after the m = 4 rungs; construction verbatim from the red team's
    archived 07_ptm5_analysis.py replica logic (same N rule, same encoding
    and pair-counting conventions, same row fields), re-implemented or
    adapted WITHOUT importing or executing anything under
    src/crypto_autoresearcher. (2) ANALYZE, with the F7(a) conventions
    (TASK-20261002-758e51/code/01_analysis.py as the reference), the new
    rows COMBINED with the archived 12..24 rows: per-rung aggregate T = sum
    w S_3^2 / sum w r N/4, w = 1/(N B), both r conventions, 99%
    curve-bootstrap intervals (five instances per rung per replicate, at
    least 20000 replicates, coverage reported); the 26..32 SEGMENT SLOPE of
    log2 T_frozen vs log2 N at m = 4 on-mode against the archived 12..24
    segment slope (-0.038062, calibrated [-0.041782, -0.034385]) and against
    0; and (3) REPORT the outcome under DEC-20261002-0df88e's
    pre-registered outcome rule (FLAT / CONT / AMBIG / CROSS), as the
    narrowest supported sentence, with the T-point tripwire (any rung whose
    calibrated 99% interval excludes 1 from below is FLAGGED for the
    Coordinator, never self-interpreted).
  uncertainty_reduced: >-
    Whether the generic harvest-on approach to the floor BENDS above 24 bits
    (flattening: the segment slope shallows) or CONTINUES at the 12..24 rate
    (crossing projected ~34..36 bits) -- the F7 open question's next
    decision-changing quantity, at zero engine cost.
  inputs:
    - ledger/handoffs/TASK-20261002-a8bbd8.yaml
    - ledger/decisions/DEC-20261002-0df88e.yaml
    - ledger/decisions/DEC-20261002-bed082.yaml
    - coordination/review/pfdr-twfloor-20261001/reviews/TASK-20260929-575e80/attacks/07_ptm5_analysis.py
    - coordination/review/pfdr-twfloor-20261001/reviews/TASK-20260929-575e80/attacks/out/ptm5_results.jsonl
    - coordination/review/pfdr-twfloor-20261001/reviews/TASK-20260929-575e80/attacks/f3-lemma-map.yaml
    - coordination/tasks/TASK-20261002-758e51/code/01_analysis.py
    - coordination/tasks/TASK-20261002-758e51/out/slopes.json
    - coordination/tasks/TASK-20261002-758e51/out/per_rung_T.json
