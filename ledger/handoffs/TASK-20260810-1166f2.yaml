handoff:
  id: TASK-20260810-1166f2
  recorded_at: '2026-08-10'
  goal_id: GOAL-AES-002
  question_id: RQ-AES-002
  batch_id: BATCH-2b0fd1
  task_card: coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/task-cards/TASK-20260810-1166f2.md
  role: red-team
  from: coordinator
  to: red-team
  objective: >-
    Attack CM-1 itself, from the immutable TASK-20260810-f7bc82 snapshot bytes
    alone. Find the charging asymmetry, the missing conversion, the unstated
    convention, the uncharged resource, or the reading under which two conforming
    parties could compute different costs for the same attack. Also attack the
    BLK-1 amendment's claim that adding a key_recovery certificate kind is purely
    additive and backward-compatible.
  uncertainty_reduced: >-
    Whether CM-1 can survive contact with an adversary before it is used to
    charge anything. The cost model is the object most worth attacking in this
    campaign: GOAL-AES-001's first red-team pass destroyed that campaign's only
    cost model, and a cost model that fails after a margin is computed under it
    is worth far less than one that fails now.
  inputs:
    - CM-1
    - protocol-amendment-GOAL-AES-002-001
    - adoption-amendment-005-partB
    - RQ-AES-002
    - TASK-20260810-f7bc82
  constraints:
    - >-
      SC-1 C2 STAMP DUTY. As its FIRST act, before any research work, this task
      writes a stamp record carrying start_utc, start_epoch,
      declared_wall_clock_seconds and a binding_stop_utc COMPUTED as start plus
      declared; writes a further stamp at EACH major section boundary carrying
      utc, elapsed_s and a marker naming what was completed; HALTS at
      binding_stop_utc, records halted_on_budget truthfully and NAMES the work
      dropped; and COMMITS those stamps as a declared artifact, carried as a
      budget block inside this task's designated covering manifest. The
      TASK-20260801-810 budget block is the reference implementation. A halt at
      binding_stop_utc is INFRASTRUCTURE SIGNAL, never a negative mathematical
      result (AGENTS.md rule 5), and dropped work is SCOPE, never an answer
      (rule 8).
    - >-
      SC-2 C4 DECLARATION BASIS. The declared wall_clock_seconds is calibrated
      against AUTHORING-INCLUSIVE session elapsed; the compute component is
      reported SEPARATELY in its own field and may NOT be offered as evidence of
      budget compliance. Discharging SC-1 is FULL compliance even if the charged
      figure later exceeds the declaration, and any residual is a campaign-side
      accounting fact, never a producer defect.
    - >-
      SC-3 COVERING MANIFEST AND CLOSED CLASS VOCABULARY. Every declared
      source-code artifact carries a comment-block inference stanza in its own
      text. AT LEAST ONE machine-readable manifest of this task, DESIGNATED THE
      COVERING MANIFEST by this task's card and by the manifest itself, carries
      an artifact_provenance list covering EVERY declared artifact of the task,
      and EVERY OTHER manifest of the task appears as an ENTRY in it, with fields
      path, kind, sha256, comment_block_inference_stanza (boolean, stated
      honestly including when false) and
      covered_by_this_manifest_inference_block (boolean). A self-referential
      digest is impossible and is recorded as SELF. The kind vocabulary is CLOSED
      and CASE-INSENSITIVE - SOURCE_CODE, MACHINE_READABLE_MANIFEST,
      PROSE_REPORT, LEDGER_AND_COORDINATION_RECORD - matched ignoring
      underscore/hyphen/space differences; no fifth class may be invented, a
      value outside the vocabulary is a DEFECT TO REPORT, and any
      machine-readable structured-data artifact resolves to
      MACHINE_READABLE_MANIFEST.
    - >-
      SC-4 THE R5 ANTI-LAUNDERING CLAUSE, QUOTED VERBATIM FROM RQ-AES-002 AND
      BINDING AS A COMPLETION GATE ON EVERY DELIVERABLE OF THIS TASK: "R5. THE
      ANTI-LAUNDERING CLAUSE. Any record, in any location, that states a margin
      MUST in the SAME SENTENCE (i) name the reference as exhaustive key search
      at the stated key size under CM-1, and (ii) declare the
      published-state-of-the-art comparison UNADJUDICABLE in this environment.
      Transcribing a definitional-reference margin as a state-of-the-art margin
      — in a headline, an evidence record, a decision, a synthesis, a status
      line, a cross-reference, a knowledge entry, a PR title or a commit message
      — is a CLAIM-TIER VIOLATION and is handled exactly as
      docs/claims-and-verification.md handles dropping a conditional qualifier:
      as an assertion above what the record supports. OPERATIONALLY, under
      docs/inventor-protocol.md section 5: every ideation and closure deliverable
      under this question sets `dominated_by: "unresolvable in this environment:
      no primary source reachable; every recalled frontier row is
      unverified-from-memory"` and NEVER `null`, because `null` asserts the
      frontier was checked row by row and it cannot be. `sota_delta` records the
      DEFINITIONAL-REFERENCE delta, explicitly labelled as such, plus the word
      `unadjudicable` for the published frontier."
    - >-
      SC-5 NO RECALLED LITERATURE FIGURE MAY BE CITED AS AUTHORITY, IN EITHER
      DIRECTION. A recalled figure may be named as context with its status
      declared, and may never be used to compare, rank, screen, size, promote or
      DISMISS anything. Using an unverified recollection to dismiss is the same
      fabrication as using it to promote.
    - >-
      SC-6 NO COMPARISON AGAINST THE PUBLISHED STATE OF THE ART IS ASKED FOR OR
      ADMITTED. It is unadjudicable in this environment in both directions; the
      only quantitative reference this campaign may use is the DEFINITIONAL
      exhaustive-key-search reference under CM-1.
    - >-
      SC-7 EVERY DELIVERABLE STATING A MARGIN CARRIES THE R5 CLAUSE IN THE SAME
      SENTENCE, not in a footnote, an appendix, or a later paragraph.
    - >-
      SC-8 NO REDUCED-ROUND FINDING PRODUCED UNDER THIS GOAL MAY BE ASSERTED
      HERE. It belongs to RQ-AES-001's ceiling and is cross-filed there
      (GOAL-AES-002 non_completion_criteria (iii); RQ-AES-002
      relationship_to_RQ_AES_001 (iv)).
    - >-
      SC-9 ANYTHING NOT ATTEMPTED IS NAMED OPEN AND UNATTEMPTED and is NEVER
      recorded as tried, screened or negative (AGENTS.md rules 5 and 8).
    - >-
      SC-10 FABRICATE NOTHING. No invented timing, measurement, throughput,
      citation, review verdict, model identifier or commit SHA. A field that is
      not yet knowable stays null and is named as such.
    - >-
      SC-11 NEVER SELECT, CONFIGURE, PROBE, CONTACT OR USE AMAZON BEDROCK, in any
      runtime, backend, endpoint, model identifier, fallback or probe (AGENTS.md
      rule 16).
    - >-
      Use a FRESH session that did not author CM-1, and record its session
      identifier, requested policy, resolved model identifier and reasoning
      effort. Record honestly that this supplies SESSION independence and NOT
      MODEL independence under standing basis 0137a051, so this verdict and the
      validator's are ONE DRAW FROM A CORRELATED PAIR.
    - >-
      Verify the TASK-20260810-f7bc82 snapshot parent, exact changed path set,
      hashes and live-byte equality BEFORE reviewing content.
    - >-
      Attack all six R2 elements one at a time: the unit and its conversion; the
      success convention applied to both sides; the success-probability
      normalisation; the data charge and its kind; the memory charge; and the
      precomputation-and-verification charge. For each, either exhibit a concrete
      reading under which two conforming parties compute different costs for the
      same attack, or state that you could not and what you tried.
    - >-
      Attack the amendment's backward-compatibility claim concretely: identify
      any existing run, evidence or decision record that adding a key_recovery
      kind could invalidate, or state that you found none within a stated scope.
    - >-
      Return a scoped disposition. A defect in a cost model is a SPECIFICATION
      result and is never mathematical or empirical evidence about AES. Finding
      no defect is not a certification that none exists, and the report must say
      so.
    - >-
      Write only the declared report; make no ledger, queue, protocol or
      experiment edit and no commit.
    - >-
      You may run under the cross-goal max_concurrent cap of 3 alongside the two
      producer tasks. If admitting this task would exceed that cap across BOTH
      AES goals, it waits rather than running degraded.
  deliverables:
    - red-team-report.yaml, designated the covering manifest for this task
