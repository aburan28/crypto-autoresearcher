handoff:
  id: TASK-20260906-822ee0
  from: coordinator
  to: idea-generator
  objective: 'Generate one or two schema-complete proposals bound to RQ-FROB-7d8dd4: whether the q-power
    Frobenius endomorphism of a subfield curve E/F_q attacked over F_{q^n} reduces the fully charged cost
    of index calculus by more than the trivial constant factors (n on the factor base via Frobenius orbits,
    n^2 on linear algebra), specifically whether a Frobenius-invariant rewriting of the summation-polynomial
    decomposition system after Weil descent lowers the solving degree or the number of variables, and
    whether the charged pipeline beats Pollard rho on Frobenius classes (the sqrt(n) speedup) at toy scale.
    The null object is mandatory: a curve over F_{q^n} not defined over any proper subfield at matched
    size, subgroup order and factor-base size, through the identical pipeline. Candidate shapes: (i) a
    mechanism proposal on the invariant-ring rewriting of the descended Semaev system under the Frobenius
    action (and its composition with the negation symmetry), predicting a solving-degree or variable-count
    difference between object and null object with a minimal test at small (q, n, m) using a Groebner
    or SAT decider already used in this program; (ii) a measurement proposal that charges every stage
    on both arms and reports the Frobenius gain stage by stage against the predicted constants, with the
    accelerated rho baseline. GHS Weil descent is prior art to be named and used as a comparison row where
    its applicability conditions hold, not rediscovered. Deployed Koblitz curves are never instances.'
  uncertainty_reduced: Whether the user-named target 'Frobenius exploitation in subfield-curve index calculus'
    admits an object-first, falsifiable proposal with a sound verifier that no existing record already
    covers.
  inputs:
  - coordination/ideation/targets-20260906-76d6dc/tasks/TASK-20260906-822ee0/context.md
  - ledger/questions/RQ-FROB-7d8dd4.yaml
  - knowledge/literature/KN-LIT-010.md
  - knowledge/literature/KN-LIT-007.md
  - knowledge/literature/KN-LIT-090.md
  - knowledge/literature/KN-LIT-6987.md
  - knowledge/literature/KN-LIT-449.md
  - knowledge/literature/KN-LIT-1402.md
