handoff:
  id: TASK-20260914-861bb9
  from: coordinator
  to: executor
  objective: >-
    Provision one Linux runtime carrying Sage 10.9 with in-process libsingular on
    the base OCI digest pinned by
    coordination/frobenius/BATCH-2f8435/admission/linux-runtime-lock.json, run the
    four admission probes that dependencies.json.runtime_lock_requirements
    demands, and author a SUCCESSOR runtime lock and a SUCCESSOR run-binding at
    the two new paths declared below. This is a zero-scientific-run provisioning
    and admission task. IT DOES NOT RUN THE STAGE0 TRIAL.
  uncertainty_reduced: >-
    Whether a runtime satisfying every declared stage0 guard can be provisioned
    today, and if so what its actual identity, executables, hashes, versions and
    guard measurements are. Until that is answered by measurement, stage0 of
    EXP-FROB-d8aa37 cannot be launched and its impediment (IMP-1 of
    DEC-20260914-37e0d9) cannot clear. A failure to provision is a complete and
    useful answer to this task; it is infrastructure signal and is reported as
    such, never as evidence about H-FROB-73df22.

  inputs:
    - AGENTS.md
    - CLAUDE.md
    - agents/executor.md
    - docs/research-budget-policy.md
    - ledger/decisions/DEC-20260914-37e0d9.yaml
    - ledger/decisions/DEC-20260909-bf5b48.yaml
    - ledger/handoffs/TASK-20260909-ece919.yaml
    - experiments/EXP-FROB-d8aa37/specification-stage0-v2.yaml
    - experiments/EXP-FROB-d8aa37/trial-plan-stage0-v2.json
    - experiments/EXP-FROB-d8aa37/stage0/dependencies.json
    - coordination/frobenius/BATCH-2f8435/admission/linux-runtime-lock.json
    - coordination/frobenius/BATCH-2f8435/admission/run-binding.json
    - coordination/frobenius/BATCH-2f8435/admission/stage0-admission.json
    - coordination/frobenius/BATCH-2f8435/dispatch_queue.json

  constraints:
    - >-
      ZERO SCIENTIFIC RUNS. Do not invoke
      experiments/EXP-FROB-d8aa37/stage0/driver.py or
      experiments/EXP-FROB-d8aa37/stage0/checker.py at all under this task - not
      with --run-dir, not with --self-test, not with --help. dependencies.json
      forbids "stage0 scientific constructors during implementation", and the
      cheapest way to keep scientific_runs provably 0 is never to start them.
      Probe with a standalone throwaway probe program that imports sage.all and
      reports versions, paths, hashes and guard measurements, exactly as the
      superseded lock's probe did. Do not create
      experiments/EXP-FROB-d8aa37/runs/RUN-FROB-2404fa/ or any file inside it.
    - >-
      DO NOT EDIT, OVERWRITE, MOVE OR RENAME ANY EXISTING FILE. Specifically
      prohibited: linux-runtime-lock.json, run-binding.json,
      stage0-admission.json, dispatch_queue.json, anything under
      coordination/frobenius/BATCH-2f8435/claims/ or
      coordination/frobenius/BATCH-2f8435/archives/, trial-plan-stage0-v2.json,
      specification-stage0-v2.yaml, specification.yaml, and every file under
      experiments/EXP-FROB-d8aa37/stage0/. Every change this task makes is a NEW
      file at a path in write_scope. A correction supersedes and never
      overwrites (AGENTS.md core rule 4).
    - >-
      TASK-20260909-ece919 REMAINS `queued` AND IS NOT YOURS. Do not claim it, do
      not release it, do not launch it, and do not alter its queue entry or its
      handoff record. It stays the scientific task and stays queued until a
      separate Coordinator launch-admission decision releases it.
    - >-
      NO VALUE MAY BE AUTHORED WITHOUT THE RUNTIME. Every measured field of the
      successor lock - image digest, sandbox and image ids, volume id, executable
      paths, realpaths and sha256, version strings, pid, pgid, rlimit pair,
      cgroup readback, git version, commit, adapter output - comes from the
      runtime you actually provisioned. Do not copy any value forward from
      linux-runtime-lock.json, from DEC-20260914-37e0d9, or from expectation. If
      a value cannot be obtained, the field is absent with a stated reason and
      the lock is NOT cut. Copying the 2026-09-10 probe stdout forward would be a
      fabricated run under AGENTS.md core rule 9.
    - >-
      PINNED IMAGE IDENTITY. base_oci_image must be exactly
      sagemath/sagemath@sha256:2401ffa8e9fc85c7ea17d3649bde5958b4dbf0858b3e504098c4102720151711.
      image_recipe must remain exactly the three declared steps: "pinned base OCI
      image", "USER root", "apt_install git python3-yaml". No package
      installation after the lock. If that digest cannot be pulled, STOP and
      report - a different digest is a different runtime and needs a Coordinator
      decision before it may be locked.
    - >-
      REQUIRED RUNTIME, from dependencies.json.required_runtime: os Linux; sage
      10.9; Sage-bundled Python with exact executable, version and hash pinned;
      in-process libsingular:std with NO external Singular process and NO pexpect;
      working POSIX process groups; per-process RLIMIT_AS of exactly 8589934592
      bytes for both driver and checker slots; git available read-only for
      rev-parse HEAD and status --porcelain=v1 --untracked-files=all; workers 1;
      no detached or out-of-session children.
    - >-
      MACHINE PROTECTION IS NOT A RESEARCH BUDGET AND IS NOT WAIVED. Configure
      provider memory min/max at [8192, 8192] MiB and a single scientific worker.
      If the runtime cannot expose cgroup limits, record that honestly in
      aggregate_memory_guard.measurement as the superseded lock did - do not
      advertise a per-process RLIMIT_AS as aggregate RSS protection.
    - >-
      BEDROCK IS PROHIBITED (AGENTS.md core rule 16). No provider, backend,
      endpoint or model identifier containing "bedrock", case-insensitive. Refuse
      before making the request. Lack of an allowed runtime is a terminal
      infrastructure stop, never permission to use Bedrock.
    - >-
      RECORD YOUR OWN PROVENANCE TRUTHFULLY. Requested policy is
      executor-implementation. Record the resolved model identifier,
      model_verified, fallback_used and degraded_requirements as they actually
      are; an unexposed serving identity is null with a provenance note, never a
      guess. Never record an attestation, approval or agreement you did not
      obtain.
    - >-
      FAILURE IS A VALID RETURN. If no compliant runtime can be provisioned, or
      any probe returns the wrong value, or any frozen source hash mismatches
      inside the runtime: author NO lock, author NO binding, and return the
      provisioning report with the concrete defects, the exact commands, and the
      raw stdout/stderr retained. Do not weaken a guard, do not substitute a
      different base image, do not restart unrelated work, and do not proceed on
      a partial probe.
    - >-
      Retain raw outputs and failed attempts under the declared probe log paths.
      A pruned failure is a rewritten history; list every attempt in the
      successor lock's prior_probe_events with scientific_runs 0.

