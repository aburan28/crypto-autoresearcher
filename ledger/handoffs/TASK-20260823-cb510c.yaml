handoff:
  id: TASK-20260823-cb510c
  from: coordinator
  to: validator
  batch_id: BATCH-8b08ef
  goal_id: GOAL-ECQ-002
  hypothesis_id: H-ECQ-0ed5c8
  joints_owned:
  - J1
  - J2
  objective: >-
    J1: is the enumerated stratum what it claims to be -- is the squarefree-discriminant pre-filter
    sound with no false negatives on the ceiling->=13 target set, is the reported population of
    ceiling->=13 families at log P2 < 6 real, and is every ceiling computed from the family's own
    fibre configuration against a cap of 15 rather than the generic 18? J2: re-derive the best
    candidate's naive height from its a-invariants alone, settle global minimality, re-certify its
    rank from the exhibited points with your own code, and independently check the provenance of EVERY
    reported curve against the frozen snapshot by curve_key AND by a-invariants and against Cremona's
    tables. You also own proves_too_much objects (i) and (ii) and the blind re-derivation declared in
    the review plan.
  uncertainty_reduced: >-
    Whether the batch searched the set it says it searched, and whether its best numbers survive
    re-derivation by code that shares nothing with the producer's.
  inputs:
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-8b08ef/review_plan.yaml
  - ledger/hypotheses/H-ECQ-0ed5c8.yaml
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-8b08ef/archives/TASK-20260823-8ea188/receipt.yaml
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-8b08ef/tasks/TASK-20260823-827765
  - coordination/goals/GOAL-ECQ-002/baseline/frontier_20260823.json
  - coordination/goals/GOAL-ECQ-002/baseline/icarm_database_20260823.json
  constraints:
  - Read ONLY committed state at the snapshot sha recorded in the archive receipt.
  - >-
    You are BLIND to the sibling reviewer. Do not open, list for content, or search any path under
    coordination/goals/GOAL-ECQ-002/batches/BATCH-8b08ef/tasks/TASK-20260823-d03635, and attest to
    that in your report.
  - >-
    HOLD THE COORDINATOR TO THE RECORDED PRIORS in review_plan.yaml, including the ones that vindicate
    it. Recording only the corrections is its own distortion, and the BATCH-541940 red team said so
    explicitly about prior P1.
  - >-
    The corrected disbelief target is ANY REPORTED HEIGHT BELOW THE FROZEN FRONTIER VALUE AT THE
    CERTIFIED RANK CLAIMED. The previous plan's rank-unconditioned form was mis-specified and flags
    1489 non-events; if the Coordinator reverts to it anywhere, say so.
  - >-
    A cell claim must satisfy ALL FOUR conditions of C1'. Verify each independently and record the
    later ones even when an earlier one fails -- a criterion whose later conditions are never examined
    is a criterion nobody has tested.
  - Report a coverage fraction wherever you rely on a negative, including your own.
  - >-
    A timeout or PARI alarm in YOUR OWN work is an infrastructure outcome too: report a truncated
    control as a BOUND, not as a distribution, exactly as the BATCH-541940 red team did at n = 79.
  - >-
    Declare your blind re-derivation honestly, including partial blindness, and name every path you
    read before writing your own implementation.
  - Never change hypothesis or goal status, and make no promotion recommendation.
  - >-
    Rank >= 31 over Q remains an open world record (30, Alpoge-Howell 2026); flag anything in the
    package that reads as progress toward it.
  deliverables:
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-8b08ef/tasks/TASK-20260823-cb510c/validation_report.md
  - >-
    coordination/goals/GOAL-ECQ-002/batches/BATCH-8b08ef/tasks/TASK-20260823-cb510c/verdict.yaml,
    carrying per-joint verdicts, artifact checks, metric recomputations, controls, the
    proves_too_much results with each object's PASS stated before its outcome, and a
    review_attestation.
  artifact_paths:
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-8b08ef/tasks/TASK-20260823-cb510c/validation_report.md
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-8b08ef/tasks/TASK-20260823-cb510c/verdict.yaml
  archived_by: TASK-20260823-3eedf3
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 3600
    memory_gb: 3
    maximum_runs: 40
  completion_gate:
  - both owned joints addressed with a verdict of holds, breaks or inconclusive on each
  - each recorded prior held to or explicitly excused
  - the proves_too_much objects (i) and (ii) run, with each object's PASS stated before the result
  - the blind re-derivation performed and its blindness declared honestly
  - at least one independent re-derivation using no producer code
  - every artifact hash in the archive receipt recomputed
  return_format: >-
    validator record: validation_report.md plus verdict.yaml carrying joint verdicts, artifact checks,
    metric recomputations, controls and a review_attestation.
