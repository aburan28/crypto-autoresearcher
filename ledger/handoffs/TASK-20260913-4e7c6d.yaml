      marked CERTIFIED.
    - All 160 obligation-results.yaml rows and all 400 chart-coverage.yaml rows carry one of the six declared statuses with a reason/certificate anchor.
    - case_order followed exactly; case-15/case-16 controls worked and their result recorded before case-01/case-02.
    - open-obligations.yaml lists every OPEN cell with its exact missing prerequisite, not a vague "needs more work."
    - audit-report.md states plainly that this task's semantic verdicts are not yet independently reviewed, per specification.independent_checker_plan.
