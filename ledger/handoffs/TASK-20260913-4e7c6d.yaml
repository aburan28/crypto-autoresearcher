handoff:
  id: TASK-20260913-4e7c6d
  from: coordinator
  to: idea-generator
  objective: >-
    Perform the fixed symbolic proof-audit pass EXP-CRYPTO-6505c6 declares
    (run_kind: symbolic_proof_audit_pass, maximum_runs: 1, zero numerical
    runs): work the 160-cell obligation matrix and 400-cell chart-coverage
    matrix against specification.yaml's frozen symbolic domain, families,
    and main transfer target, producing genuine source-matched certificates
    or explicit OPEN/REFUTED/NOT_APPLICABLE verdicts per cell. This task IS
    the audit itself, not a further preparation step before it -- no
    separate "trial plan" file exists for a symbolic audit the way a
    numerical experiment needs one; the 20 artifact files this task produces
    are the trial. It does not authorize, approve, or claim any scientific
    breakthrough: per specification.launch_gate, that requires a separate
    independent semantic review this task cannot itself provide.
  uncertainty_reduced: >-
    Whether the elliptic-addition trace-transfer target's main families (K
    and L sheaves) can be certified against the primary source's actual
    theorem, with every chart/control/null premise checked, or whether
    specific obligations must be recorded OPEN or REFUTED -- and, critically,
    whether the source theorem this audit depends on can supply the
    *effective* uniform bound specification.main_transfer_target.effective_B
    requires at all (see the flagged finding below).
  critical_finding_to_verify_first: >-
    A preliminary WebFetch read of the primary source
    (https://arxiv.org/html/2511.09459v1, "Bilinear forms with trace
    functions" by Fouvry, Kowalski, Michel, Sawin) suggests Theorem 2.4's
    moment-bound stratification is stated INEFFECTIVELY: the paper's own
    Remark 1.2 reportedly states the method's dependency on sheaf complexity
    "is not polynomial... due to use of qualitative results in Quantitative
    Sheaf Theory," and the theorem gives no explicit formula for the
    implicit constant in its |t_m(x,k_n)| << |k_n|^(w/2) conclusion. This
    was a one-shot automated summary of dense technical HTML, not a verified
    reading -- treat it as a lead to check against the actual paper text
    yourself, not as an established fact. specification.main_transfer_
    target.effective_B is explicit that "a finite observed maximum,
    n-dependent C, or ineffective existence does not discharge this
    target." If your own reading of the actual source confirms Theorem 2.4
    is ineffective and no other cited/discoverable result in the same paper
    or its closely related literature supplies an effective version
    applicable here, then obligation O06 (and everything in the
    phase_order/case_order that depends on a certified effective bound) is
    OPEN by specification.stopping_rule's own terms ("record missing
    ...effectiveness prerequisites as OPEN rather than silently assuming
    them"), not a blocking failure of this task and not grounds to skip the
    rest of the panel -- structural obligations (family/base/domain
    definitions, the 400-cell chart-pair coverage, control/null validity)
    do not depend on effectiveness and should still be worked and certified
    or refuted on their own merits. Read the actual primary source (fetch
    the HTML or PDF yourself; do not rely on this summary) before writing
    any O06-dependent cell, and record in audit-report.md exactly what you
    found, in your own words, with direct quotes/section numbers.
  inputs:
    - experiments/EXP-CRYPTO-6505c6/specification.yaml (the complete frozen
      contract for this audit -- families, degeneration strata, addition
      charts, the 160 obligation and 400 chart-pair cells, controls,
      artifacts layout; read it in full before starting)
    - ledger/proposals/IDEA-20260905-3e4bf0.yaml
    - ledger/hypotheses/H-CRYPTO-fde1f1.yaml
    - coordination/design/BATCH-aa0d38/source-packet.json
    - coordination/design/BATCH-aa0d38/design-note.md
    - >-
      coordination/design/BATCH-aa0d38/checkpoint.md (prior status -- zero-run
      preparation TASK-20260907-ec75b0 done; "actual proof work needs a
      separately ranked, genuinely claimed task with source-reading
      capabilities" -- this handoff is that task)
    - https://arxiv.org/html/2511.09459v1 (primary source; fetch and read
      directly -- this is a WebFetch/WebSearch-capable role specifically
      because this task requires it)
    - experiments/EXP-CRYPTO-6505c6/implementation/ (whatever the prior
      zero-run preparation task left; read-only, treat as background
      material, not a substitute for reading the primary source yourself)
  constraints:
    - >-
      Write only under
      experiments/EXP-CRYPTO-6505c6/audits/TASK-20260913-4e7c6d/, matching
      specification.artifacts' exact 20-file root layout (audit-manifest.yaml,
      source-readings.yaml, source-hypothesis-matrix.yaml, case-index.yaml,
      obligation-results.yaml, chart-coverage.yaml, normalization-and-weights.yaml,
      complexity-ledger.yaml, shared-constituents.yaml, moment-certificates.yaml,
      stratification-application.yaml, control-results.yaml, counterexamples.yaml,
      open-obligations.yaml, work-and-resources.yaml, audit-report.md,
      certificate-bundle.md, dependency-dag.yaml, checker-results.yaml,
      artifact-sha256.json). Do not modify specification.yaml, the prior
      preparation task's files, or any ledger record other than this one.
    - >-
      No numerical run, no code execution beyond reading, no invented
      citation, proof step, or certificate. specification.independent_
      checker_plan.semantic_output explicitly "requires an independent
      qualified review task, not this preparation Executor" -- so this
      task's own structural_output and your best-effort semantic readings
      are not a substitute for that later independent review; say so
      plainly in audit-report.md rather than presenting your own verdicts
      as already independently checked.
    - >-
      Work case_order exactly as specified: case-15 and case-16 (the
      known-false cancellation controls) first, then the exceptional-geometry
      and matched-null cases, then the excluded-base diagnostics, and the two
      main-target cases (case-01, case-02) last -- controls and diagnostics
      before the main claim, per specification.ordering.checks'
      "control_admission" rule and this program's own null-object-before-belief
      discipline (docs/inventor-protocol.md).
    - >-
      Every one of the 160 obligation cells and 400 chart cells gets a
      status from specification's own statuses list
      (CERTIFIED/REFUTED/OPEN/OUTSIDE_MAIN_SCOPE_CLASSIFIED/
      NOT_APPLICABLE_WITH_CERTIFICATE/NOT_ATTEMPTED_AFTER_STOP) -- an absent
      or silently-skipped cell is a defect in this task's own deliverable,
      not an acceptable simplification. If time/budget genuinely runs out
      before all cells are worked, mark the remainder NOT_ATTEMPTED_AFTER_STOP
      with the exact reason, per specification.stopping_rule; do not leave
      cells simply missing from the table.
    - >-
      No claim beyond what specification.outcomes/success_criterion/
      falsification_criterion actually license. This audit produces
      per_family outcomes (CERTIFIED_MAIN_SCOPE/EXACT_MAIN_COUNTEREXAMPLE/
      INCONCLUSIVE/INVALID_ARGUMENT) and an overall
      positive/partial/negative classification per those exact definitions
      -- never a broader "the theorem applies" or "ECDLP is affected"
      statement; this specification's own frame is explicit that no such
      claim is in scope.
    - Never select a provider, backend, endpoint, or model identifier containing Bedrock, case-insensitively.
  deliverables:
    - experiments/EXP-CRYPTO-6505c6/audits/TASK-20260913-4e7c6d/ (all 20 root files per specification.artifacts)
  artifact_paths:
    - experiments/EXP-CRYPTO-6505c6/audits/TASK-20260913-4e7c6d/
  archived_by: null
  inference:
    policy: research-deep
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: null
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
