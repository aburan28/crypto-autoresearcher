    blindness:
      mutual: true
      lifted_for: []
      rationale: >-
        Not lifted. TASK-20260923-58953e and TASK-20260923-404bf9 run in
        separate independent sessions and may not read each other's reports,
        nor any report under coordination/goals/GOAL-GFPN-380702/reviews/
        other than their own, in this round.

    proves_too_much:
      objects:
        - >-
          OBJECT A -- THE "0/20 IS THE EXPECTED REGIME" ARGUMENT AT A SMALL
          PRIME WHERE DECOMPOSITIONS ARE KNOWN TO BE COMMON. At p' in {11, 31,
          41} (each = 1 mod 5; confirm primality and pick c as the smallest
          non-fifth-power, per implementation.md section 1.1) on a fixed curve
          (C1: y^2 = x^3 + 3x + 8z^4; C2: y^2 = x(x^2 + 2x + (263 mod p')z);
          confirm both nonsingular), compute EXACTLY, by enumeration, the
          fraction f of E(F_{p'^5}) expressible as P_1 + P_2 + P_3 + P_4 with
          every x(P_i) in F_{p'} (repetition allowed). Then run the producer's
          m = 4 RANDOM-target cell path (not the constructed-solvable path)
          with arm S4 on N targets drawn from a fixed seed, N chosen so that
          N*f >= 10, and count verified decompositions.
        - >-
          OBJECT B -- THE ARM (iii) CONSTRUCTION ON A CURVE WITH NO RATIONAL
          2-TORSION, where a 2-torsion symmetrization gain is KNOWN TO BE
          ZERO because the translation it quotients by does not exist. Build
          arm (iii) (torsion_S3, m = 3, constructed-solvable) on the
          random_no2torsion curve at p' = 4111 exactly as on the EcGFp5-shaped
          curve.
        - >-
          OBJECT C -- THE SUPPLEMENTARY FLATNESS STATISTIC ON A QUANTITY FIXED
          BY CONSTRUCTION. Apply the "D identical across the ladder, therefore
          flat" reading of runs/RUN-GFPN-ca7b88/heur-dflat.yaml
          supplementary_flatness_not_the_frozen_heuristic to the planted-orbit
          size itself (m! for the raw arm, 1 for the symmetrized arms).
      failure_signature: >-
        OBJECT A: the observed number of verified decompositions must fall
        inside the two-sided 99 percent binomial interval of N*f. THE REGIME
        ARGUMENT HAS PROVED TOO MUCH if the pipeline finds materially fewer:
        "no random target decomposed, as JV predicts" would then also explain
        away a completeness defect in the random-target path, and because
        EXP-GFPN-659e34 reuses this driver (TASK-20260921-838c4a C-8), that is
        a precondition failure for that run and must be reported as such. An
        msolve crash or timeout at the chosen p' is infrastructure: pick
        another p' from the set, or report inconclusive.
        OBJECT B: on a curve without T, arm (iii) must either refuse, or
        produce only decompositions the S3 arm also finds, with no orbit
        gain. THE CONSTRUCTION HAS PROVED TOO MUCH if it reports the same
        degree, the same cost and the same "(Z/2)^m x S_m" semantics there as
        on the EcGFp5-shaped curve: it then does not depend on the 2-torsion
        it claims to exploit (which bears on K5, owned by the same reviewer).
        OBJECT C: if the statistic returns "flat" for a quantity that is
        constant by construction, it cannot discriminate and must not be read
        as evidence about p-independence of any degree; report whether every
        supplementary D equals the planted-orbit size in every cell.
      assigned_to: TASK-20260923-404bf9

    blind_rederivation:
      required: false
      decision_rationale: >-
        DECIDED EXPLICITLY, NOT OMITTED. A blind re-derivation earns its cost
        on a load-bearing MEASURED quantity that a wrong-but-self-consistent
        implementation could fake. This run set has none: (1) no m = 5 ideal
        degree, flatness verdict or band exists to re-derive -- the headline
        is an absence, and whether the absence is correctly classified is a
        reading of logs and frozen rules (K1, K2), not a quantity; (2) the
        only positive decomposition results, the 600 constructed-solvable
        certificates, were already re-verified by
        implementation/verify_independent.py, which shares no code with the
        solver path, and re-run by the dispatching session (600 OK, 1920
        lifted points), and their D values are fixed by construction (K3,
        proves-too-much object C); (3) the n = 4 anchor is a wall-clock
        timing on specific hardware, which a blind agent cannot re-derive,
        and its load-bearing question is identity of the system (K4 (a)),
        which the validator checks against the frozen JV text. The one
        quantity whose independent derivation would genuinely test the
        producer's implementation -- the exact m = 4 decomposable fraction
        at a small prime, against which the random-target path is checked --
        is built into proves-too-much object A as an exact enumeration that
        does not use the producer's solver path. I considered assigning that
        enumeration to a separate blind card (the spare
        TASK-20260923-ad50ff) and rejected it: its inputs are a curve and a
        prime fixed in this plan, not producer outputs, so it is independent
        of the producer's implementation by construction, and a fifth card
        would buy separation between two computations that must be compared
        anyway.
      quantity: null
      parameters: null
      blind_from: []
      assigned_to: null

