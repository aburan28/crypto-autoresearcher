  review_plan:
    claim_under_review: >-
      AS THE PRODUCER STATED IT. The producer drew no conclusion:
      experiments/EXP-GFPN-05ff43/implementation.md says "Observations live in
      the run packages and in the execution report; nothing here concludes
      that the heuristic is supported or refuted." What the producer DID
      state, and what is put under review, is its account of what was and was
      not measured (implementation.md section 6, verbatim):

        "The contract's own cells use random known-scalar targets R = [k]G. At
        m = 5 they all ended not_measured / resource_exhaustion. At m = 4 they
        completed, and — as the Joux–Vitse (n−1)-point method predicts for an
        overdetermined system — no random target decomposed, so those cells
        measure decomposition-test cost and a success rate of 0/20, and leave
        D undefined."

        "Supplementary constructed-solvable cells (clearly labelled
        target_kind: constructed_solvable, not the contract's cells) build a
        decomposable target by summing m factor-base points ... These are the
        only cells with a defined ideal degree, and their success rate is 1
        by construction — recorded as success_rate_by_construction, never as
        decomposition_success_rate. (In the raw arm's runs the field
        decomposition_success_rate was nevertheless filled with 1.0 ...)"

        "fp_operations_per_pdp is a proxy (section 1.4). The m = 4 values are
        nearly identical across primes and across arms because the proxy is
        built from msolve's matrix shapes, which are p-independent, and
        because arms (ii) and (iii) produce systems of the same shape under
        this construction (D-6)."

      together with the two deviation sentences that bound the absence:
      D-4, "The 13-bit rung is therefore the cheapest m = 5 case, and it
      already exhausts the cap. The m = 5 boundary is consequently documented
      at p' = 4111 for arms (ii) and (iii) rather than re-purchased at every
      rung"; and D-6, "they are a property of this construction, this solver
      and this 11 GB host, not of the ideal degree." The run tables then
      record heur_dflat_pass not_applicable for every arm and shape
      (runs/RUN-GFPN-ca7b88/heur-dflat.yaml) and a null cost band for every
      arm with reason heur_dflat_not_applicable
      (runs/RUN-GFPN-ca7b88/cost-band-p64.yaml). The producer's own rating,
      as restated by the snapshot card TASK-20260921-98561a, is
      protocol_complete PARTIAL and requires_rerun true.

      THE CLAIM THAT WOULD BE MADE IF THE ROUND READS THE RESULT AS ITS
      PRODUCER DID is therefore not a claim about D or about EcGFp5 at all.
      It is: "Under this construction, msolve 0.6.5 and a 12 GB cap, no m = 5
      degree is measurable; the m <= 4 pipeline is correct and
      certificate-verified; HEUR-GFPN-DFLAT is untested and the p = 2^64 band
      is void; a rerun is required." The frozen contract's success criterion
      is quoted for reference, verbatim: "For each arm with >=3 completed m=5
      cells spanning >=12 bits: D and fp_operations_per_pdp recorded;
      heur_dflat_pass decided; orbit_nonfreeness and lifted_verified_points
      recorded; if heur_dflat_pass, modeled band bits at p=2^64 emitted next
      to 142 with measured-vs-modeled labels. Arms that only have m=4
      fallback report fallback metrics and heur_dflat_pass = not_applicable
      (insufficient m=5 D). Success is protocol completion with decidable
      metrics — not '128 broken'."

    coordinator_prior: >-
      WRITTEN 2026-09-23, BEFORE ANY REVIEWER RAN, AND NOT BLIND. I have read
      implementation.md, the specification, the snapshot receipt and card,
      the aggregate run's heur-dflat and cost-band tables, the manifests and
      raw results of RUN-GFPN-bbed6f and RUN-GFPN-61bba9 and the five
      anchor_t*.ms.log files of RUN-GFPN-bbed6f, and the relevant pages of the
      Pornin and Joux-Vitse frozen texts. I have run nothing. My prior is
      therefore anchored to the producer's account, and the useful content of
      this prior is where I expect that account, or the frozen contract
      itself, to be weaker than it reads.

      1. K7, THE COST-MODEL PREMISE -- 0.70 that the red team finds the
      frozen prediction is anchored to the wrong system. Pornin's paper
      (inputs/PORNIN-2022-274-ECGFP5/paper_fulltext.md lines 138-149) says
      "Each system would contain 5 equations with 5 unknowns, and a total
      degree 2^{k−1} = 16" and D "should be close to 2^{k(k−1)} = 2^20";
      16^5 = 2^20 is the Bezout number of five total-degree-16 equations in
      five unknowns. The producer's own construction shows which system that
      is: arm (ii), the S_5-symmetrized system in e_1..e_5, is interpolated
      on N = C(5 + 16, 5) = 20349 monomials, i.e. total degree <= 16, while
      arm (i), the raw system in x_1..x_5, needs the (16+1)^5 box, i.e.
      degree 16 in EACH variable (implementation.md section 1.3). If that
      holds, the design note's 2^20 and its 142 already include the S_5
      symmetrization, and H-GFPN-9a29be's statement that 142 is "computed
      for the RAW descended ... system" and its frozen predictions D_raw
      about 2^20, D_S5 about 2^20/120, D_torsion about 2^20/1920 are
      mis-anchored by roughly 5! = 120; on the same Bezout reasoning the
      2-torsion quotient would leave about 2^20/2^4 = 2^16, and the design
      note's own floor would move from about 2^142.4 to about
      2^(102.4 + 2*16) = 2^134.4, not to the 2^121 of the hypothesis. This
      is a Coordinator prior from arithmetic on frozen text, not a finding,
      and it touches no run's validity. If the red team confirms it, a rerun
      cannot be scored against the frozen prediction without a versioned
      protocol_amendment made BEFORE the rerun, and RQ-GFPN-c01af8 and
      H-GFPN-9a29be carry the premise and would need correction records.

      2. K5, ARM (iii) -- 0.65 that the red team finds arm (iii) as built is
      not a valid test of the (Z/2)^4 x S_5 symmetrization at m = 5: its
      polynomial has the same monomial support and so the same Bezout bound
      as arm (ii) (20349 terms, total degree <= 16), it quotients by
      translations on all m coordinates and accepts R + T relations, and
      its degree in the target coordinate doubles; so its m = 5 exhaustion
      says nothing about FHJRV's invariant-ring construction, and any rerun
      must build that form. 0.40 that it also finds FHJRV's form needs b to
      be a square in F_q and that this needs checking for EcGFp5's
      b = 263z before a rerun is designed.

      3. K6, THE PROXIES -- 0.70 that the red team finds *_proxy unfit for any
      p-flatness statement (built from matrix shapes that are p-independent
      below 2^31, so flatness is tautological) and for scoring F3's 2^36
      threshold (a dense-elimination estimate is not a lower bound and its
      unit is not the contract's instrumented F_p-operation count); 0.50
      that it finds it fit, with caveats, as a within-shape relative size
      indicator.

      4. K4, THE ANCHOR -- 0.75 that the validator confirms RUN-GFPN-61bba9
      timed a genuine Joux-Vitse-shaped system (4 variables, 5 equations of
      total degree 8, 495 monomials); 0.55 that it rules the frozen control
      FAILED on its literal band (ratio 0.470 is outside [0.5, 2.0]) and that
      accepting a fast anchor would be a change of a success criterion after
      the outcome, which needs a protocol_amendment; 0.50 that it finds the
      contract's "n=4" (hypothesis proof_search_map: "n=4 cells reproducing a
      published ... timing ... before trusting n=5 numbers") names a
      different object from the n = 5, m = 4 anchor that was run; 0.40 that
      the reference row (JV's own-C F4, 17.01 s, rather than F4' at 5.002 s)
      was not pinned before measurement; 0.50 that the RUN-GFPN-bbed6f logs
      contradict deviation D-3's account of the crash (the crash is in the
      -g 1 F4 round, not a parametrization step).

      5. K1-K3, CLASSIFICATION AND SEPARATION -- 0.85 that every m = 5 cell is
      correctly classified not_measured and nothing reads it as D; but 0.50
      that the validator finds the m = 5 outcome was never produced inside
      the contract's resource envelope (contract maximum_memory_gb 32, host
      cap 12 GB; and 29 msolve logs in the validation and anchor runs,
      including every log of RUN-GFPN-bbed6f and RUN-GFPN-61bba9, carry
      "ulimit: virtual memory: cannot modify limit", so how the cap was
      applied needs establishing) and that arm (i) raw was never attempted at
      m = 5 at all,
      which is "not attempted", not "not measured"; 0.85 that heur_dflat and
      the band follow mechanically; 0.60 that at least one place puts a
      supplementary value next to a contract metric without a fence beyond
      the raw-arm field the producer already disclosed.

      6. PROVES-TOO-MUCH -- 0.30 that the small-prime rate control finds the
      m = 4 random-target path finds FEWER decompositions than exact
      enumeration predicts. That is the outcome that matters most, because
      EXP-GFPN-659e34 (TASK-20260921-838c4a constraint C-8) reuses this
      driver. The constructed-solvable cells already show the pipeline
      recovers planted decompositions (600 certificates, independently
      verified), which is why I do not expect a gross defect.

      MODAL EXPECTATION, stated so it can be overturned: 0.70 that the round
      returns "nothing about D, DFLAT or the band is established; the
      absence is correctly classified; the pipeline at m <= 4 is sound; the
      anchor control failed on its literal band; arm (iii) as built cannot
      test the 2-torsion symmetrization; the proxy cannot carry flatness or
      F3; and the frozen prediction's raw-system premise needs a protocol
      amendment before any rerun." If that comes back, the honest decision
      for H-GFPN-9a29be is `inconclusive` on this experiment, with the
      rerun's design owed first, and nothing about EcGFp5's security moves.

    joints:
      - joint: >-
          K1. THE m = 5 ABSENCE IS CLASSIFIED AS AN ABSENCE: that every m = 5
          cell (RUN-GFPN-8f1b50 arm S5, RUN-GFPN-805701 and RUN-GFPN-61a67b
          arm torsion_S5, all at p' = 4111 on the EcGFp5-shaped curve) and
          every other cell that exhausted resources (including the raw-arm
          m = 4 cells RUN-GFPN-b1f5d2, RUN-GFPN-c7a3e9, RUN-GFPN-d8e114) is
          recorded not_measured with D null and certificate.kind none, that
          no artifact reads an exhaustion as evidence about D, and that the
          classification is honest about the resources and the arms actually
          attempted.
        assigned_to: TASK-20260923-58953e
        attack_plan: >-
          (a) Enumerate all 48 run packages from the snapshot receipt; list
          every run whose status is failed or whose not_measured list is
          nonempty, with its arm, m, p', shape and failure class. Confirm D
          null and certificate.kind none on each, and search every
          ladder-table.yaml, raw-result.json, heur-dflat.yaml and
          cost-band-p64.yaml for any field derived from an exhausted cell.
          (b) ATTACK THE ENVELOPE. The contract sets maximum_memory_gb 32; D-1
          caps every solver at 12 GB (prlimit plus ulimit -v). 29 msolve logs
          in the validation and anchor runs (every anchor_t*.ms.log of
          RUN-GFPN-bbed6f and RUN-GFPN-61bba9 among them) carry "ulimit:
          virtual memory: cannot modify limit: Operation not permitted", so
          the ulimit half of the cap failed at least there. Establish from the
          m = 5 cells' own logs, their recorded peak memory (61a67b reports
          memory_exhausted at the 11 GB RLIMIT_AS) and
          implementation/pdp_common.py or run_wrapper.py what cap was actually
          in force on the m = 5 cells, and state whether the m = 5
          outcome is "not measured within the contract's envelope" or
          "not measured at 12 GB", which is what the record must say.
          (c) ATTACK COVERAGE. Arm (i) raw has no m = 5 run at all. D-4
          argues the m = 5 systems are the same size at every rung, so one
          rung suffices. Rule whether "raw at m = 5" is not_measured or
          not_attempted, and whether D-4's single-rung argument is consistent
          with the frozen stopping rule "Stop the ladder for an arm when >=3
          primes spanning >=12 bits have completed D measurements (or all
          attempted cells timed out)".
          (d) Confirm D-5's early stop lists every unattempted target with
          class and reason.
          WHERE I THINK IT BREAKS: not in the classification of D (0.85
          holds); in (b) and (c), 0.50, as an honesty-of-scope defect.
