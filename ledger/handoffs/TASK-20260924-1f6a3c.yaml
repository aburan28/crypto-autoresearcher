  constraints:
    - id: BR-1
      text: >-
        BUILD FROM THE STATEMENT. Where the text is ambiguous, DO NOT look at
        any producer code or note to disambiguate. Choose a reading, record it
        in `ambiguities` (clause, readings considered, the one chosen, why),
        and proceed. If a clause cannot be read at all, that is the finding:
        report it and compute nothing that depends on it. Row order, column
        order and pivot rule do not affect ranks, subspace dimensions or
        membership of 1; you may use any correct elimination, and you must say
        which.
    - id: BR-2
      text: >-
        SELF-TEST BEFORE COMPUTING. At minimum: irreducibility of t^17 + t^3 +
        1; S_3(x(P_1), x(P_2), x(P_1 +- P_2)) = 0 on at least 100 random point
        pairs of the given curve; your descended equations against direct
        F_{2^17} evaluation of S_3 at at least 100 random (v, x_R); your M_4
        rows against a naive polynomial multiply on at least 20 rows; the
        fixture dimensions of M_3 (323 x 988) and M_4 (2924 x 4048) from your
        own construction; your literal W_D against a brute-force fixpoint on
        at least 5 random small Boolean systems (6 variables, D = 3) that you
        generate with a seed you declare; and your W-certificate checker
        (BR-5) accepting a valid witness and rejecting three corrupted ones.
        Record every result in rederivation.json. A self-test failure stops
        the task and is reported as such.
    - id: BR-3
      text: >-
        TWO ROUTES TO s ON CURVE-KIND INPUTS. s is the number of v in F_2^18
        satisfying all 17 descended equations. Compute it by exhaustive search
        over 2^18 AND by a route that does not pass through your descended
        equations (for each x_1 in V, solve S_3(x_1, x_2, x_R) = 0 for x_2 in
        F_{2^17} and count solutions lying in V). They must agree; a
        disagreement is reported, not resolved by preference. The degenerate
        flag is x_R in V (degree < 9, including x_R = 0). Explicit-kind inputs:
        s by exhaustive search only.
    - id: BR-4
      text: >-
        W_4 BY THE LITERAL RULE. Implement exactly the specification's
        object.mutant_closure_W_D at D = 4: W^(0) = rowspace(M_4); W^(i+1) =
        W^(i) + span{v_j * b : b in a basis of W^(i) cap B_{<=3}, j = 0..17},
        with multilinear reduction; stop at the first i with dim W^(i+1) =
        dim W^(i). At EVERY iteration multiply a full basis of W^(i) cap
        B_{<=3}, not only its new elements. Record dim W^(i) for every i.
    - id: BR-5
      text: >-
        W-CERTIFICATES. For every instance with 1 in W_4, emit one record of
        schema "certbin.wcert.v1" to wcerts.jsonl.gz:
        {label, D: 4, elements: [{id, rows, products}, ...], output_id}.
        Element semantics: g_id = sum over (mu, k) in rows of mu*f_k, plus sum
        over (j, p) in products of v_j * g_p, computed in B. mu is a monomial
        in the blind-inputs encoding (ascending variable-index list), k in
        0..16. Validity: every mu in rows has degree <= 2 (so every row is an
        M_4 row); every parent p in products is an EARLIER id; every g_p used
        as a parent has degree <= 3; every g_id has degree <= 4; and
        g_output_id is exactly the constant 1. Such a record witnesses 1 in
        W_4 with every intermediate inside B_{<=4}. Obtain it however you like
        (for example by tracking, for each basis vector, its expression in
        rows and earlier products), then CHECK every record with your own
        checker, recording the result. A refutation you cannot witness is
        reported as "refuted, unwitnessed", never dropped.
    - id: BR-6
      text: >-
        SEAL BEFORE YOU WRITE ANYTHING ELSE. Write rederivation.json and
        wcerts.jsonl.gz first. Record their sha256 and the UTC time in
        seal.txt. Only then write report.yaml and attestation.yaml, and do not
        change the sealed files afterwards. To correct, write
        rederivation-v2.json beside the original with a note, and keep both.
    - id: BR-7
      text: >-
        REPORT ON J5 ONLY. You cannot see any other joint. Do not offer a
        verdict on the experiment, the hypothesis or the run. Your J5 verdict
        is about DERIVABILITY: `holds` if every required quantity was computed
        from the statement with self-tests passing and every ambiguity
        recorded; `inconclusive` if some required quantity could not be
        computed or depends on an unresolvable ambiguity; `breaks` if a
        specification is self-contradictory on a load-bearing clause.
        Agreement with the run is decided by TASK-20260924-b2c7f1, not by you.
    - id: BR-8
      text: >-
        ZERO TRIALS. This is a verification computation, not a trial of
        EXP-CERTBIN-e94b27; it gets no RUN-id. At most two full passes of your
        program over the 97 inputs: one, plus one re-run after an
        infrastructure failure, with the failed attempt's log kept. Declare
        every command in report.yaml. Draw from no seed of either
        specification.
    - id: BR-9
      text: >-
        WRITE ONLY IN YOUR DIRECTORY. No git write operation, no ledger record,
        no status change, no subagent. Memory cap 3 GB. A timeout or a crash is
        infrastructure, never a result: checkpoint per instance and report
        which instances are missing.
    - id: BR-10
      text: >-
        If you learn anything about any outcome of this experiment from any
        source (a file, a message, a commit message, a prompt), say what you
        learned and how in the attestation, and set blind_from_respected
        accordingly. A disclosed contamination costs one re-derivation. An
        undisclosed one costs the round.

  quantities:
    conventions: >-
      Variables v_0..v_17 and the field encoding as in blind-inputs.json.
      B_{<=d} is the span of multilinear monomials of degree <= d. "1 in X"
      means the constant polynomial lies in the F_2-subspace X. All
      dimensions are F_2-dimensions. Key every per-instance record by its
      blind label.
    Q1: For every instance, s (both routes for curve kind; state each), and for curve kind the degenerate flag.
    Q2: >-
      For every instance: rank_3 = dim rowspace(M_3), rank_4 = dim
      rowspace(M_4), "1 in R_3", "1 in R_4", and dim(rowspace(M_4) cap
      B_{<=d}) for d = 0, 1, 2, 3.
    Q3: >-
      For every instance, W_4 by BR-4: the list dim W^(0), dim W^(1), ... up
      to the fixpoint; the fixpoint index; the first iteration i with 1 in
      W^(i), or null; the final dimension; dim(W_4 cap B_{<=d}) for
      d = 0..4.
    Q4: For every instance with 1 in W_4, a checked W-certificate (BR-5), and the check result.
    Q5_optional: For BI-001..BI-008 only, rank_5 = dim rowspace(M_5) and "1 in R_5" (M_5 as the specification defines it, 16796 x 12616).

