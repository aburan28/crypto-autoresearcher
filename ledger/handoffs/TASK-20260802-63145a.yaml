handoff:
  id: TASK-20260802-63145a
  from: coordinator
  to: executor
  objective: 'Execute the frozen EXP-PEC-49c773 protocol exactly: run NC2b first (zero new measurement
    - recompute c under the corrected law from values already committed in RUN-PEC-6be870-a, and check
    the estimator against its own null), then NC2a (extend IMPL-B over ell 103..211 with full-range C-NULL
    coverage) and refit the seam-free primary response.'
  uncertainty_reduced: What the overhead c actually is once the estimator carries the level as well as
    the slope, and what the per-entry exponent is once the fitted response has one definition across the
    whole range.
  inputs:
  - experiments/EXP-PEC-49c773/specification.yaml (frozen - follow exactly)
  - experiments/EXP-PEC-6be870/runs/RUN-PEC-6be870-a/raw-result.json (committed at 49166fa5; the NC2b
    inputs are already in fit.windows.*.intercept and the C-NULL block - treat it as READ-ONLY input data)
  - experiments/EXP-PEC-6be870/implementation/per_entry_cost.py (the instrument; reuse it rather than
    rewriting it, so NC2a is comparable to the superseded run)
  constraints:
  - Record observations only. Do not interpret, do not restate the NIST-I question, do not change any
    status.
  - RUN NC2b FIRST and report it even if NC2a cannot finish. It costs no measurement and it is the item
    the reviewers said must be on the record before anything downstream cites an overhead value.
  - If the corrected estimator FAILS its own pre-registered null gate, report that plainly as a failure
    of the repair. Do not adjust the law until the null passes - that is precisely the failure mode that
    produced the defect being repaired.
  - Do not edit, move, or regenerate anything under experiments/EXP-PEC-6be870/. It is superseded, not
    wrong-and-replaceable, and its run is committed evidence.
  - Count F_{p^2} multiplications exactly by instrumentation for any new measurement. Carry NC2b's inputs
    from the committed raw result verbatim and label them as such.
  - C-NULL must cover the full fitted range this time. If the contract's execution order still leaves
    any fitted ell un-null-controlled, STOP and report it rather than proceeding.
  - Never fabricate a command, output, timing, statistic, citation, or run. Never hardcode modular-polynomial
    coefficients from memory; use the contract's provenance route and record URL, timestamp and SHA-256.
  - 'The standing prohibitions from DEC-20260802-8227b9 bind you: do not cite c = 0.864 or the other forbidden
    values except as clearly labelled superseded inputs being corrected.'
  - Preserve the full receipt per AGENTS.md artifact policy, including requested_policy, resolved model
    identifier, fallback_used, and degraded_requirements.
  - 'A timeout or crash is failed_infrastructure and is never mathematical evidence. A partial NC2a is
    scoped evidence: report the ell range actually reached.'
  deliverables:
  - implementation/corrected_extrapolation.py
  - runs/RUN-PEC-49c773-a/ complete receipt bundle
  artifact_paths:
  - experiments/EXP-PEC-49c773/implementation/corrected_extrapolation.py
  - experiments/EXP-PEC-49c773/runs/RUN-PEC-49c773-a/manifest.yaml
  - experiments/EXP-PEC-49c773/runs/RUN-PEC-49c773-a/raw-result.json
  - experiments/EXP-PEC-49c773/runs/RUN-PEC-49c773-a/execution_report.yaml
  - experiments/EXP-PEC-49c773/runs/RUN-PEC-49c773-a/stdout.txt
  - experiments/EXP-PEC-49c773/runs/RUN-PEC-49c773-a/stderr.txt
  - experiments/EXP-PEC-49c773/runs/RUN-PEC-49c773-a/command.txt
  - experiments/EXP-PEC-49c773/runs/RUN-PEC-49c773-a/environment.json
  archived_by: TASK-20260802-18f85d
  goal_id: GOAL-P13-001
  batch_id: BATCH-003
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: true
