handoff:
  id: TASK-20261002-9f9ce5
  created_at: '2026-10-02'
  created_by: coordinator
  from: coordinator
  to: coordinator
  goal_id: GOAL-ECDLP2M-001
  batch_id: BATCH-2e63c3
  lane: U-HOLDH
  skill: /design-experiment
  review_required: true
  review_required_note: >-
    True. The contract gates a future execution, so it is reviewed by
    TASK-20261002-b8360c, TASK-20261002-2214e9, TASK-20261002-17bf2f and the
    blind TASK-20261002-8d288b at review-breakthrough at max before
    DEC-20261002-c9ec6b can approve it.
  title: >-
    Design U-HOLDH: write H-BINSTD-0dd2ce and EXP-BINSTD-f442a9 (approved_by
    null) for IDEA-20260922-d11575 with IDEA-20260922-0e3641, and an audit
    sheet with committed, import-safe code, discharging DC-H1 to DC-H6 under
    tripwire T2
  objective: >-
    Run /design-experiment on IDEA-20260922-d11575 (lead) with its
    consolidated member IDEA-20260922-0e3641 under RQ-BINSTD-b6f698, as the
    one design unit U-HOLDH of DEC-20260929-7257b2 R-HOLD-H. Write
    H-BINSTD-0dd2ce and EXP-BINSTD-f442a9 (status review_required,
    approved_by null), each complete in itself, and a proof-search-map audit
    sheet whose code blocks are committed and import-safe. Discharge DC-H1 to
    DC-H6 and the opener's design items DH-1 to DH-13 below by number. Zero
    runs.
  uncertainty_reduced: >-
    Whether a complete protocol exists that (a) reproduces the published
    census of the five composite-degree ANSI rows as a baseline fixture, (b)
    turns the collapse claim (C1) into single-responsibility lemmas with its
    Hess dependence explicit, (c) pairs the conditional cost table with
    pre-registered toy-scale validation of its numbered heuristics, and (d)
    charges linear algebra, descent and memory and prices the van
    Oorschot-Wiener comparison, so that a later execution can produce the
    program's first memory-charged table for these rows from validated
    heuristics.
  design_items:
    source: >-
      DC-H1 to DC-H6 are DEC-20260929-7257b2 R-HOLD-H design_conditions,
      verbatim in substance; that decision is the authority where wording
      differs. DH-1 to DH-13 are DEC-20261002-21a63d's.
    design_conditions:
      - id: DC-H1
        requirement: >-
          The Hess obligation stays open. The design either reads Hess at
          source in its Stage 0 (a PDF-capable runtime; IMP-3 recheck) or
          carries (C1) as the record's own elementary derivation with MMT
          Remarks 21 and 23 cited as the source's conclusion and the Hess
          hypothesis as an explicit numbered open obligation.
      - id: DC-H2
        requirement: >-
          MMT Table 3 (n, m, g per open cell, read at source) is the
          baseline-reproduction fixture of the proof_search_map, including the
          four cells where m differs from n (E208 and E368 at n = 8 and 16)
          and the n = 16 genus branch the source leaves open.
      - id: DC-H3
        requirement: >-
          The cost model charges linear algebra, the descent map and memory;
          the VOW memory-charged comparison is the record's own unsourced
          prediction and is priced, not quoted.
      - id: DC-H4
        requirement: >-
          Matched rho under CORR-20260922-81aeab, sqrt(pi l / (4k)) (the
          reading note's CHECK-3 reports the record's printed rho about 0.25
          bit below that convention).
      - id: DC-H5
        requirement: >-
          Any cell verdict that depends on MMT pages 20-21, 25-42 or on the
          journal version reads them first (IMP-2 recheck), or is marked
          dependent and unavailable.
      - id: DC-H6
        requirement: >-
          Tripwire T2 kept: the design round and any cell verdict below
          matched rho run at review-breakthrough at max, non-degradable.
    opener_items:
      - id: DH-1
        requirement: >-
          One unit, one contract. IDEA-20260922-0e3641 travels as a section:
          its (A) period formula and (B) divisor count as zero-compute
          derivations, and its Part 2 composite-k' toy cell (H-0e3641-1)
          either as an optional declared arm with its own pre-registration or
          omitted with a recorded reason.
      - id: DH-2
        requirement: >-
          Proof architecture (promotion gate 1). Decompose (C1) into
          single-responsibility lemmas, each naming its responsibility
          (correctness, size, success probability or interface): at least the
          conjugate period n(c) = 16/gcd(c, 16); the grouping of the Galois
          sum by residue mod 16/c (d11575 proof obligation [1]); the
          eigenvalue lambda of the F_(2^16)-Frobenius on the l-part, lambda^k
          = 1 and lambda not 1, from gcd(l, h) = 1; the annihilation by the
          subfield trace; and the interface lemma linking that trace to the
          conorm-norm image of the GHS map (where the Hess dependence lives).
          The main statement is a pure assembly. (C2) likewise, citing MMT
          Corollary 14 and Remark 24 at their read provenance. The trichotomy
          STRUCTURALLY EMPTY with certificate / DEFINED WITH A COMPUTED COST /
          OPEN with the missing quantity named is the cell verdict space.
      - id: DH-3
        requirement: >-
          Numbered heuristics (promotion gate 2). H-DL-1 (split density of
          cover divisors against 1/g!), H-DL-2 (the complexity constant) and,
          if its arm is declared, H-0e3641-1 (genus depends only on period),
          each formally stated with rigorous support, falsification condition
          and a pre-registered toy-scale validation arm in this same
          contract: the predicted law, the statistic, the threshold, the
          sample size with stated power, a tail check, and the transfer
          distance to the deployed rows as a numbered transfer assumption.
          (C1) and (C2) carry no heuristic and say so.
      - id: DH-4
        requirement: >-
          Baseline fixture (DC-H2) by committed stage0_code: parameters of
          the five rows and the declared prime-degree control rows parsed
          with their source; for every (row, divisor c of N, c < N) the
          conjugate period, m under both conventions (shown equal), the genus
          candidates and the Theorem-1 condition ((7), or Lemma 6's (9) where
          relied on) by direct computation of Tr(a); MMT Table 3 reproduced
          on all twenty open cells with a printed diff against the reading
          note's table_3_transcription; Remark 24's bounds on the collapsed
          cells; controls that can fail (a Koblitz-shaped curve over a
          composite N, m = 1 in every lane; a B in F_(2^8) fixture, m at most
          n/2; the prime-degree rows, lattice {1, N}; a uniform-B null, m = n
          in every lane with a stated probability; the c = 16 cell, m = 1);
          matched rho per row; the plan's reference lines R-1 to R-4 printed
          (REVIEW-BINSTD-H-20261002-2e63c3 blind_rederivation Q4).
      - id: DH-5
        requirement: >-
          Cost model and concrete-cost table (DC-H3, DC-H4; promotion gate
          3). For each deployed row and each lane the contract treats as
          live: relation collection under the small-genus law at the
          provenance actually read (KN-LIT-164 and its successor
          KN-LIT-92caf4 carry their own citation status; a retrieved source
          is cited with URL, date and sha256); sparse linear algebra
          (dimension, row weight, time, memory, parallel scaling); the
          descent map; factor-base memory; the regime ratio g / log2 q; the
          van Oorschot-Wiener comparison against parallel rho priced under
          one stated machine model for both arms; o(1)/polylog disclosure;
          the time-memory tradeoff; optimistic assumptions flagged; every row
          conditional on the numbered heuristics, with the H-DL-2 constant as
          a stated range. An affected-versus-safe scope statement that asserts
          no verdict. Matched rho only as sqrt(pi l / (4k)).
      - id: DH-6
        requirement: >-
          DC-H5 applied: the journal version and MMT pages 20-21 and 25-42
          are read first by any statement that depends on them, or the
          statement is marked dependent and unavailable (K-impediment), with
          IMP-2 and IMP-3 carried.
      - id: DH-7
        requirement: >-
          Decision rules (the DEC-20260929-585602 lessons). (a) Every
          stopping, invalidation and admission rule has its false-fire rate
          under the contract's own null computed in committed code (C-5) and
          stated beside the rule; no rule fires on more than 5 percent of
          null runs without a stated reason and remedy. (b) A degeneracy
          audit of every declared (cell, arm, lane) by a stated rule from
          parameter arithmetic only (C-7). (c) Every declared cell, arm and
          lane is selected in code by role or name, never by an offset that
          varies with c, k, d or a field size. (d) An end-to-end dry call of
          the decision code over the full declared name grid with planted
          synthetic inputs per arm (C-6), showing each declared arm can reach
          each outcome its table assigns it. (e) The toy-cell verification of
          (C1) carries a negative control and a positive control whose
          predicted non-trivial image is argued, not assumed (the proposal's
          "k' even" control is examined and kept, replaced or reasoned out).
          (f) Every declared outcome is reachable from generative quantities.
      - id: DH-8
        requirement: >-
          Design-time computation is limited to allowed_session_computations
          C-1 to C-8. No toy cell the contract declares is constructed beyond
          C-7. Synthetic groups and dry-call curves must not coincide with the
          group of any declared cell at any field size (isomorphism type
          included); choose them from (d, k') pairs and coefficients the
          contract does not declare, and say so in the audit sheet.
      - id: DH-9
        requirement: >-
          Record form (DEC-20261002-21a63d R-FORM): H-BINSTD-0dd2ce and
          EXP-BINSTD-f442a9 are new, with no supersedes field; every approval
          field present; status review_required; approved_by null; an approval
          block naming DEC-20261002-c9ec6b. No proposal status moves.
      - id: DH-10
        requirement: >-
          Provenance (AGENTS.md rule 9). MMT is cited as retrieved by
          TASK-20260929-0be49c (ePrint 2001/084 PostScript, sha256
          5833727d99d5a9d14eb0862609c96eb333e6fd64283c557aa53d6abcaa866dee
          per receipt TASK-20260929-26849f; pages 1-19 and 22-24), never as
          read beyond that extent. Every recalled reference is marked
          recalled and supports no cost figure, no heuristic discharge and no
          novelty claim.
      - id: DH-11
        requirement: >-
          Outcome discipline and T2 (TH-1). No sentence states that any
          deployed or standardized row sits below its matched rho, that any
          curve is broken, weakened or safe, or adopts the source's D1/D2
          columns or the proposal's 0.9 to 12.3-bit figures as a finding. No
          D1, D2 or D3 quantity of CORR-20260928-4cb669 as a budget ("m" here
          is the GHS magic number). No citation of IDEA-20261001-621974's
          j = 2 figures as a cost (TW-7257-1).
      - id: DH-12
        requirement: >-
          YAML hygiene. Every prose value containing ": " is a folded block
          scalar (>-); code blocks are literal block scalars. Write a complete
          skeleton of each file first and fill it section by section
          (R-CONTINUATION).
      - id: DH-13
        requirement: >-
          Scope. Arithmetic only on deployed coefficients; the executable arm
          is toy cells (the proposal's dk' at most 41, or another bound with
          its reason); no attack at N of 131 or more; isogeny-extended GHS and
          other cover attacks are out of scope and stated as interpretation
          limits.
  allowed_session_computations:
    authority: DEC-20261002-21a63d R-PRODUCER-COMPUTE, stated in advance
    note: >-
      The producer session may ask the top-level session to perform these and
      only these, in the scratch subdirectory
      <session scratchpad>/BATCH-2e63c3/TASK-20261002-9f9ce5/, and embeds
      each command and its verbatim output in the audit sheet as a design
      figure, never a result. Each is run against the code blocks as written
      in the audit sheet and extracted by the pinned method. The session
      never exports or copies a whole git tree into scratch.
    items:
      - C-1 extract each committed code block by the pinned method and compute its sha256
      - C-2 a syntax check and an import-safety check of each block in a fresh interpreter (importing executes nothing)
      - >-
        C-3 run stage0_code through its __main__ entry (parameter parse; the
        census of conjugate period, m, genus candidates and Theorem-1
        condition on all fifty (row, divisor) cells of the five deployed
        rows; the declared fixtures and controls on published curves or
        synthetic non-cell curves; the MMT Table 3 diff; matched rho; the
        reference lines R-1 to R-4) and relay its output verbatim
      - C-4 run the committed cost-table generator (design figures, parametrised by the stated H-DL-2 constant range) and relay its output verbatim
      - >-
        C-5 run the committed null false-fire calibration: every stopping,
        invalidation and admission rule applied to synthetic inputs drawn
        from the contract's own null model, seed recorded, rates relayed
        verbatim
      - >-
        C-6 run the committed end-to-end dry call of the decision code over
        the full declared (cell, arm, lane) name grid with planted synthetic
        inputs per arm, and relay its output verbatim
      - >-
        C-7 admissibility arithmetic of each declared toy cell and nothing
        else on it: the order over the subfield and over the extension by the
        Weil recursion, their factorisation, gcd(l', h), and the degeneracy
        verdict by the stated rule. No point of order l' is constructed and
        no trace, cover, divisor sample or relation is computed
      - >-
        C-8 run openssl ecparam -name <curve> -param_enc explicit -text
        -noout for the five deployed rows and every declared prime-degree
        control row, record openssl version, and relay the output verbatim
    forbidden: >-
      Anything else: no computation on a declared toy cell beyond C-7, no dry
      call on a group coinciding with a declared cell at any field size, no
      attack at deployed parameters, no driver written or executed, nothing
      importing anything under experiments/*/runs/.
