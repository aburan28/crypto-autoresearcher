    experiments/EXP-QSP-70b731/runs/; experiments/EXP-FROB-30006a/; the ref
    origin/cursor/semaev-2015-audit-program-5b8b; PR #1377; the branch
    cursor/ecdlp2m-revision-design-3d1a; every BATCH-f435ab and BATCH-f6b7c5
    review or composition path; every BATCH-ccfdc6 record; every QSP batch
    path.
