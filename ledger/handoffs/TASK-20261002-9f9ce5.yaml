    - every DC-H and DH item maps to a named clause in the discharge table
    - the census output reproduces or explicitly diffs MMT Table 3 on all twenty open cells, with the four m-different-from-n cells named
    - (C1) decomposed into named lemmas; the Hess obligation read at source or numbered; H-DL-1, H-DL-2 (and H-0e3641-1 if declared) each with a pre-registered validation arm
    - the cost table charges linear algebra, descent and memory in every row and prices the VOW comparison; every row conditional
    - the null false-fire table, the end-to-end dry call and the degeneracy table present, each from committed code
    - every code block import-safe, with extraction method and reference sha256; no synthetic group coincides with a declared cell
    - approved_by null and the approval block names DEC-20261002-c9ec6b; no TH-1 sentence; zero runs
  review_plan: coordination/review/binstd-h-20261002-2e63c3/review-plan.yaml
