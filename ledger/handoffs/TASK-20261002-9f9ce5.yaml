  constraints:
    - >-
      DU-1 Write exactly the three declared files, all new. Edit no proposal,
      reading note, decision, correction, question, plan or goal record.
      Mint no identifier.
    - DU-2 Discharge DC-H1 to DC-H6 and DH-1 to DH-13 by number, each mapped to a named clause in the audit sheet's discharge table.
    - >-
      DU-3 Import safety and pinning: every code block is a block scalar of
      the audit sheet with its extraction method and reference sha256 pinned,
      and importing it executes nothing; every cell, arm and lane is
      selected in the code by role or name.
    - DU-4 Session computations limited to allowed_session_computations C-1 to C-8; each command and output embedded in the audit sheet as a design figure.
    - DU-5 No computation on a declared toy cell beyond C-7; no dry call on a group coinciding with a declared cell at any field size (TH-3).
    - DU-6 No deployed-row verdict, no below-rho, broken, weakened or safe sentence as an outcome (TH-1); no D-column budget; TW-7257-1.
    - DU-7 Every citation with provenance; recalled references support nothing.
    - >-
      DU-8 Approval fields; status review_required; approved_by null; an
      approval block naming DEC-20261002-c9ec6b. Zero runs. No AUXIN census
      value, reviewer finding value of another lane, RUN-FROB value,
      EXP-FROB-30006a outcome or anything about an EXP-QSP-70b731 run.
    - >-
      DU-9 Folded block scalars for every prose value that contains a colon
      followed by a space; a complete skeleton first (R-CONTINUATION).
