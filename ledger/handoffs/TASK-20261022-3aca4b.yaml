    ledger_archive_task_id: TASK-20261022-bff8ff
    written_by: coordinator
    written_at: '2026-10-22'
    written_before_any_reviewer_ran: true
    claim_under_review: Rational points of naive height <= 10^5 (3*10^5 on replication) on the rank-0..7 ladder
      and quadratic twists grow as (log H)^{r/2} (slope of log N_E against log log H within 1 of r/2) and cover E(F_p) at the uniform-reduction
      rate (coverage ratio median in [0.8, 1.2]).
    coordinator_prior: I expect custody to hold (every manifest hash, both seeds, both receipts), every frozen metric
      to recompute exactly from raw-result.json, and the blind re-derivation to agree with the producer value. If
      anything breaks, I expect it in the producer's own definition of a borderline sample rather than in the arithmetic.
      This is a prior, not an outcome.
    joints:
    - id: J1
      joint: 'Both run packages are complete and bound: every manifest files_sha256 entry, the snapshot and ledger
        archive receipts, command, revision, clean tree, seed and environment records agree, and the trials cover
        the frozen plan.'
      assigned_to: TASK-20261022-3aca4b
      attack_plan: Recompute every hash with sha256sum, diff command.txt against trial-plan.json, check git_head
        against the commit that froze the contract, enumerate trials against the plan, and look for an unlisted,
        duplicated or missing artifact.
      breaking_artifact: A named file, trial or record whose bytes, count or hash disagree with its receipt.
    - id: J2
      joint: Every frozen success and falsification metric, and each control in the specification, recomputes exactly
        from raw-result.json on both seeds, and the independent checker receipt agrees.
      assigned_to: TASK-20261022-3aca4b
      attack_plan: Write your own recomputation from raw-result.json against the specification's metric definitions
        before reading check.py; then compare with the manifest metrics and the checker output, and probe the borderline
        samples (exclusions, ties, d = +-1, singular fits) for silent drops.
      breaking_artifact: A metric, count or control outcome that differs from the recorded value, with the raw rows
        that produce the difference.
    - id: J3
      joint: The load-bearing quantity, re-derived blind from the statement, agrees with the producer's value.
      assigned_to: TASK-20261022-3aca4b
      attack_plan: Implement the quantity from the specification and hypothesis only, seal it, then compare with
        the raw results in phase 2.
      breaking_artifact: A disagreement between the sealed blind value and the recorded one, with both computations
        attached.
    blindness:
      mutual: true
      lifted_for: []
      rule: Ten validators run in this round, one per contract; none reads another's report. No red team runs in
        this round.
    proves_too_much:
      objects:
      - id: PTM-1
        object: A planted point set of N distinct residues of E(F_p) chosen to hit distinct points, fed to the coverage-ratio
          computation.
        known_false_conclusion: Any point set covers E(F_p) at the uniform-reduction rate.
        expected_failure_signature: The coverage ratio on the planted set must exceed 1.2 at small N/N_p; a ratio
          near 1 means the instrument cannot see excess coverage.
      failure_signature: The coverage ratio on the planted set must exceed 1.2 at small N/N_p; a ratio near 1 means
        the instrument cannot see excess coverage.
      assigned_to: TASK-20261022-3aca4b
    blind_rederivation:
      required: true
      quantity: N_E(H) for 11a1 and 37a1 at H = 300 and H = 1000 by a slow scalar search, and the uniform model
        N_p(1 - (1 - 1/N_p)^N) for 37a1 at the primes 101 and 1009 with your own N_p.
      parameters: Curves, height definition and model formula exactly as stated in experiments/EXP-CZLIFT-a255fc/specification.yaml.
      blind_from:
      - harness/czlift.py
      - harness/czlift_run.py
      - harness/czlift_medium.py
      - harness/czlift_formal.py
      - harness/czlift_cubic.py
