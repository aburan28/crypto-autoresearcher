handoff:
  id: TASK-20260901-da5e05
  from: coordinator
  to: idea-generator
  objective: 'Generate exactly four fresh, mechanism-distinct, schema-complete proposals bound to RQ-ECDLP-165d4b,
    the prime-field non-generic hardness census (ordinary prime-order short-Weierstrass curves over F_p
    at 16-36 bits, CM and special-j candidates with a verified F_p-rational automorphism, and bounded-degree
    F_p-rational isogeny neighbours; methods: Pollard rho, negation quotient, automorphism quotient, fully
    charged isogeny transfer). Favour proposals that define a NEW measurable attack-cost functional or
    a census design that discriminates public non-generic structure from generic behaviour with a matched
    null object, a decay test, and matched rho/BSGS controls; screen against the 4 existing RQ-ECDLP-165d4b
    proposals, the H-ECDLP-{1853dc,63d136,63eecd,80fceb,e42bda} hypotheses, DEC-20260809-{b61556,54f91c},
    and the GOAL-ENDO-001 isogeny-class-invariance lane (RQ-ICINV-475b5e, transport theorem T1) by exact
    delta.'
  uncertainty_reduced: Whether any census-scale functional exists whose within-family or within-class
    variance exceeds its matched null once every cost (precomputation, transfer, memory, serialization)
    is charged.
  inputs:
  - ledger/handoffs/TASK-20260901-da5e05.yaml
  - coordination/ideation/ec-goals-20260901-f672c8/tasks/TASK-20260901-da5e05/context.md
  - ledger/questions/RQ-ECDLP-165d4b.yaml
  - agents/idea-generator.md
  - docs/inventor-protocol.md
  - docs/target-result-profile.md
  - templates/research-records.md
  - ledger/proposals
  - knowledge
  - ledger/decisions/DEC-20260809-b61556.yaml
  - ledger/decisions/DEC-20260809-54f91c.yaml
  - ledger/hypotheses
  - ledger/goals/GOAL-ENDO-001/goal.yaml
  - analysis/endomorphism-isogeny-decomposition
  - knowledge/findings
  - knowledge/techniques/KN-TECH-018.md
  constraints:
  - Use exactly the assigned IDEA IDs and write only their proposal files under ledger/proposals/; never
    overwrite an existing proposal; never run git; never write outside write_scope.
  - THE crypto-kb RETRIEVAL INDEX IS UNAVAILABLE THIS SESSION (CRYPTO_KB_QDRANT_URL is ':memory:' and
    the index is empty -- verified by the orchestrating session by direct call before dispatch). Do NOT
    call search_knowledge, and do NOT read its silence as evidence of novelty. Screen novelty by direct
    reading of ledger/proposals/, ledger/hypotheses/, knowledge/, and the context file in your task directory;
    cap novelty_status at unverified unless you actually opened a primary source (provenance retrieved,
    verified_by naming this task).
  - Every citation carries provenance (recalled | retrieved | kb | internal) per templates/research-records.md
    'Citation provenance'; recalled references are wanted but support nothing; an internal citation carries
    verified_by only if you read that record this session.
  - 'Every proposal is a complete idea record per agents/idea-generator.md: claim, mechanism, novelty_status
    and novelty_screen, citations, assumptions, predictions with named metrics and directions and minimum_effect,
    minimal_test with controls and required_metrics, falsification_conditions, confounders, interpretation_limits,
    heuristic_assumptions each with rigorous_support and a validation_plan, target_complexity with time
    AND memory exponents versus a named best_known plus hidden_overhead, dominated_by (null only after
    checking every frontier row across time, memory, and data/queries), a quantitative sota_delta, estimated_cost,
    recommended_priority, honest_prior_of_survival, discriminated_from naming the nearest existing record
    and the exact delta, and question_id / goal_id bindings.'
  - Proposals are mechanism-distinct from each other and from every screened record; if fewer than four
    genuinely distinct candidates survive screening, file fewer and say so in your return -- never pad
    the count.
  - 'No Bash or interpreter is available to your role: record yaml_parse_disclosure stating the file was
    not machine-parsed by you. Write YAML defensively: quote any scalar that begins with |, >, -, *, &,
    !, %, @, `, [, {, #, or a quote; use >- block scalars for prose; no tabs; no duplicate keys.'
  - 'Ideation only: no experiment, implementation, run, hypothesis creation, approval, status transition,
    knowledge promotion, or deployed-target interaction. Do not report imagined outcomes.'
  - 'Requested policy research-deep at effort high; record it in the proposal (proposed_by: idea-generator;
    inference block naming requested_policy research-deep). No Amazon Bedrock, no fallback, no degradation;
    if the requested policy cannot be honoured, refuse rather than downgrade.'
  - No hidden scalar-dependent advice or oracle access; no uncharged precomputation, transfer, memory,
    or serialization (RQ-ECDLP-165d4b constraints).
  - Primary curves must be ordinary, prime-order, non-anomalous, with declared embedding-degree and twist
    checks; special-j and neighbour curves are census cells, not targets.
  - Every measured quantity requires a null object of the same shape and a decay test before it is believed
    (docs/inventor-protocol.md); on CM cells the automorphism-discounted rho baseline is the control (KN-TECH-018).
  - 'Toy and medium runs cannot be promoted to cryptographic-scale claims; state claim_tier: toy in interpretation_limits.'
  deliverables: &id001
  - ledger/proposals/IDEA-20260901-e3ffc2.yaml
  - ledger/proposals/IDEA-20260901-753636.yaml
  - ledger/proposals/IDEA-20260901-3e68ad.yaml
  - ledger/proposals/IDEA-20260901-49dba1.yaml
  artifact_paths: *id001
  archived_by: TASK-20260901-f672c8
  inference:
    policy: research-deep
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 3600
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
  - Up to four schema-complete assigned proposal files exist, each bound to the declared question_id (and
    goal_id where one exists), each mechanism-distinct from every screened record with the nearest record
    and exact delta named.
  - Every proposal carries a non-null dominated_by, a quantitative sota_delta, heuristic_assumptions with
    validation routes, and target_complexity with time and memory exponents against a named baseline.
  - No scientific result, hypothesis, approval, or status transition is claimed; novelty_status is unverified
    unless an opened source is cited with provenance retrieved and verified_by.
  - 'The return message lists, per filed id: title, class, novelty_status, sota_delta, recommended first
    test, and any id left unused and why.'
  return_format: idea records per agents/idea-generator.md, plus the per-id summary named in completion_gate
