  completion_gate:
    - >-
      R-a is answered with a CONSTRUCTED OBJECT or with an explicit statement that
      none was found within budget and what was tried. "The argument looks fine" is
      not an answer to a proves-too-much joint.
    - >-
      If the argument survives on any object, the report names the object, its exact
      construction, its measured outcome on every arm of the strengthened suite, and
      the STEP of the argument at which the survival happens.
    - >-
      Every joint the committed plan assigns is reported with holds | breaks |
      inconclusive under its short id, with the construction or measurement it rests
      on.
    - >-
      The obstruction reversal is answered, with any spawned successor recorded as a
      candidate for the ranking and explicitly not as evidence.
    - >-
      The SHA-1 `in_linearized_code` confound is assessed from YOUR OWN construction,
      with an explicit statement of whether it bites and how hard, independent of the
      producer's D-SHA1-INCODE framing.
    - >-
      A review_attestation block is present with read_sibling_reports: false and
      sources_read listed honestly and completely, and any encounter with a finding
      through commit metadata, a PR body, the merge digest or a bus message is
      disclosed unprompted.
  return_format: >-
    Joint-by-joint verdicts under short ids, the proves-too-much object and where the
    argument survived, the family-(d) mutations and the independently constructed
    SHA-1 flag confound, the narrowest supported statement, the cheapest
    distinguishing control you can name, anything you could not attack with the
    reason, and your resolved model with its probe status.
  review_plan: null
