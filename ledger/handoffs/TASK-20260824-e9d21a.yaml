handoff:
  id: TASK-20260824-e9d21a
  from: coordinator
  to: red-team
  goal_id: GOAL-DIFFP-84d641
  batch_id: BATCH-efcae7
  question_id: RQ-DIFFP-a5c483
  objective: >-
    Attack the INTERPRETATION of the control-power package before the Coordinator
    composes it. THE COMMITTED REVIEW PLAN ASSIGNS THIS TASK'S JOINTS AND IS
    AUTHORITATIVE OVER THIS SKETCH; this task may not be dispatched until that plan
    is committed. Coordinator's intent at opening:
    (R-a) PROVES-TOO-MUCH ON THE STRENGTHENED SUITE, this round's load-bearing
    joint. Construct an instrument that PASSES CTL-PLANT + CTL-NULL families a,b,c +
    CTL-NULL-D and whose conclusion is KNOWN FALSE, run the batch's argument
    unchanged against it, and report WHERE IN THE ARGUMENT THE SURVIVAL HAPPENS.
    Candidates are a FLOOR, NOT A CEILING: an adjudicator blind to a DEPTH-2 subset
    the depth-1 lattice does not reach; one that reads only `dv_seed_window` (VD-3's
    mechanism promoted from defect to design, which would pass every SHA-1 E1-image
    arm); one blind to `block_index`; and ONE KEYED ON A LOSSY FUNCTION of the
    message difference -- the SET of differing word indices, or its Hamming weight --
    rather than on its value, which can pass many family-(d) draws while still
    identifying paths whose message differences differ.
    (R-b) THE OBSTRUCTION REVERSAL: which theory takes this batch's measurement as
    its HYPOTHESIS rather than its refutation? Round 1's reversal produced family (d)
    itself; the analogous reading here is what a per-component power profile ENABLES
    that a pass/fail suite does not. File any spawned successor as a candidate for
    the ranking, never as evidence.
    (R-c) THE CLOSURE ATTACK, symmetric with overclaiming: is any lane being quietly
    closed by a fatigue report wearing a number -- the MD5 lane, the
    `in_linearized_code` component declared "unprobed", depth >= 2, the second seed
    set, null family (e)? Is "the strengthened suite detects X" stated more widely
    than it was measured? If an `obstruction` block appears, does its measurement
    support the breadth it closes?
    (R-d) THE COMPOSITIONAL-INVARIANT AND NEARBY-OBJECT ATTACK ON FAMILY (d) ITSELF:
    mutate one component of the perturbation construction and find where it stops
    probing what it claims. INDEPENDENTLY CONSTRUCT the SHA-1 `in_linearized_code`
    confound rather than accepting the producer's D-SHA1-INCODE framing of it.
    (R-e) THE CHEAPEST DISTINGUISHING CONTROL: name the control that would separate
    an implementation artifact from a real gain in power, and exhibit at least one
    object this contract's author did not imagine.
  uncertainty_reduced: >-
    Whether the conclusion this batch wants to draw -- "the strengthened suite
    detects the deletion of the message difference, therefore the null now has power
    over the primary datum of a differential characteristic" -- survives objects for
    which it is KNOWN FALSE. The OLD suite's proves-too-much object exists and is
    measured (O5, the delta_m-blind adjudicator). THE STRENGTHENED SUITE'S DOES NOT,
    and by construction it cannot be in the contract, because the contract's author
    is the one who would have had to imagine it.
  inputs:
    - >-
      The committed review plan for TASK-20260824-9a489e, which assigns this task's
      joints and is authoritative over the objective sketch above.
    - The snapshot receipt and the exact paths it binds by path_sha256.
    - >-
      experiments/EXP-DIFFP-4b165f/specification.yaml -- the frozen contract, its
      ablation_mechanism, its hard terms H-3 and H-6, its eight declared seeds, its
      pre-registered comparison values and its interpretation_limits.
    - >-
      The producer's execution report, null-family-d-result.json,
      ablation-battery-result.json, generator-action-profile.json,
      repro-and-frozen-result.json and run-index.json.
    - >-
      EV-DIFFP-b878aa (especially O-5 to O-11 and the `obstruction` block with its
      `resource_check`) and DEC-20260824-af6d5c (especially the successor gates and
      the round-1 proves-too-much composition), as the state of the art this round
      must beat rather than restate.
    - >-
      The committed BATCH-f8bf86 adjudicator under harness/diffpath/, READ-ONLY, as
      the substrate for any adversarial instrument you construct.
  constraints:
    - >-
      INDEPENDENT SESSION, SIBLING-BLIND. Do NOT read
      coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7/reviews/TASK-20260824-b61d11,
      and declare in your attestation exactly what you read.
    - >-
      BLINDNESS COVERS COMMIT MESSAGES, THE MERGE DIGEST AND
      coordination/events/main/** WHILE THIS ROUND IS OPEN. Use
      `git log --format=%H`. THIS IS THE CHANNEL THAT BROKE ROUND 1: a commit message
      body carried the Validator's findings and their mechanisms while the Red Team
      was still running in the same worktree. If you encounter a finding anywhere,
      DISCLOSE IT UNPROMPTED AND IN FULL in the attestation rather than quietly
      proceeding.
    - >-
      COMMIT YOUR REPORT WITH A SUBJECT LINE AND NO FINDINGS IN THE BODY. The summary
      defers to the composition commit.
    - >-
      REPORT ON THE JOINTS YOU OWN AND DO NOT COMPOSE A WHOLE-CLAIM VERDICT. You
      cannot see the Validator's joints by construction; composing is the
      Coordinator's job.
    - >-
      TAKE THE PLAN'S ATTACK AS A FLOOR, NOT A CEILING. A break the plan did not
      anticipate is worth more than one it did.
    - >-
      DO NOT ALTER THE EXECUTOR'S RAW RECEIPTS OR THE VALIDATOR'S REPORT. Your
      constructions write into THIS TASK'S OWN DIRECTORY ONLY.
    - >-
      DO NOT MODIFY ANY COMMITTED FILE UNDER harness/. Build adversarial instruments
      the way the contract builds ablations -- a projection or wrapper applied at run
      time -- and say which mechanism you used. CTL-FROZEN would detect a
      modification and it would invalidate the producer's package as well as your own
      finding.
    - >-
      DO NOT READ coordination/goals/GOAL-MD5-001/quarantine/** or the same content
      by any other route, and attest non-reading.
    - >-
      DO NOT CALL A BOUNDED FAILURE AN IMPOSSIBILITY RESULT, do not reject a result
      merely because it is surprising, and PRESERVE THE NARROWEST VALID CONCLUSION
      when an object of yours breaks something.
    - >-
      DO NOT MANUFACTURE A CRYPTANALYTIC BASELINE. Pollard-rho, BSGS and the
      specialized ECDLP baselines are not the comparison class here: the package
      makes no cryptanalytic claim and runs no search. The appropriate comparison is
      the OLD suite's power against the STRENGTHENED suite's, per component.
    - >-
      AN INFRASTRUCTURE FAILURE IN YOUR OWN CONSTRUCTION IS INFRASTRUCTURE SIGNAL,
      not a finding against the producer. Report it as such and say what remained
      unattacked.
    - >-
      `maximum_runs: 3` COUNTS CHARGED EXPERIMENT RUNS UNDER A CONTRACT -- a run
      directory, a RUN-* id, a manifest, an armed deadline and a consumed ceiling. IT
      DOES NOT COUNT SCRIPT EXECUTIONS, read-only probes, adversarial constructions
      or unit-test invocations, however many you run. Round 1's Red Team asked which
      reading governed; the ambiguity is closed here rather than left to guess.
    - >-
      Record requested policy, resolved model identifier, backend, probe status and
      reasoning effort. A tier the backend cannot reach is a PAUSE, never a silent
      downgrade; if the probe verifies nothing, say so and mark the identifier
      self-reported rather than measured.
    - >-
      Never Amazon Bedrock in any runtime, backend, endpoint, fallback or probe
      (AGENTS.md rule 16).
  deliverables:
    - >-
      red-team-report.yaml with joint-by-joint verdicts under the plan's SHORT JOINT
      IDS; the proves-too-much result naming WHICH OBJECT the argument survived on
      and WHERE IN THE ARGUMENT the survival happens, with the object's exact
      construction and its measured suite outcomes; the obstruction reversal with any
      spawned successor named as a candidate and not as evidence; the closure attack;
      the family-(d) mutation results including your INDEPENDENT construction of the
      SHA-1 flag confound; `required_controls`; `counterexample_or_mutation`;
      `narrowest_supported_statement`; `next_concrete_action`; and a
      review_attestation block naming joints_owned by short id, sources_read honestly
      and completely, read_sibling_reports: false, and the verdict.
  artifact_paths:
    - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7/reviews/TASK-20260824-e9d21a/red-team-report.yaml
  archived_by: TASK-20260824-b3e02b
