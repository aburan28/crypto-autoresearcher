      J1 (DERIVATION AND INTERFACE). 0.85 that the algebra of Sections 0-3
      and 6 holds; it is a standard consequence of disc(O) = p^2 and T = 2A.
      0.55 that you find a statement-level scope defect: H says "curves over
      F_{p^2}" and "Hom(E, E')", but over F_{p^2} a curve with Frobenius -p
      and its quadratic twist with Frobenius +p have Hom_{F_{p^2}} = 0, so the
      lemma holds only for the geometric Hom (over F_p-bar), which the note's
      Section 4 parenthesis assumes and the hypothesis statement does not
      say. 0.40 that you rule the recalled inputs (disc(O) = p^2, local
      principality over a maximal order, the local structure at p, class
      number 1 at p = 2, and the general Deuring pair) carry the derivation,
      so "derivation tier" means conditional on recalled standard facts, and
      the evidence record must say so. 0.10 that a step breaks.

      J2 (CAN THE COMPUTATION FAIL?). 0.85 that you find it essentially
      cannot fail except through an instrument or construction error. For
      q = Nrd, R = 1 on A1/A2/A5 is equivalent to disc(O) = p^2, which IS the
      maximality criterion (C-NONMAX flags non-maximality by exactly that
      determinant); [O : I] = n(I)^2 is a theorem for every invertible
      ideal, and every left ideal of a maximal order is invertible; A6 is
      det(H)^2. What CAN fail is: the Gram normalisation (the 16), Nrd versus
      the absolute norm, PARI's order not being maximal, the n(I) and index
      measurements, and the rescaling. The Deuring interface cannot fail in
      this run because it is not in it. So the 945 cells corroborate
      NORMALISATION and INSTRUMENTS and carry near-zero weight for the
      universal claim beyond that; the claim rests on the note. 0.40 that you
      find a contract-design defect: an A1 R != 1 would have been scored
      F-NORM (falsification) although it could only mean PARI returned a
      non-maximal order, which is an instrument fault. It is moot here
      because nothing triggered, but it bears on how the contract's headline
      may be quoted.

      J3 (DOES THE LEMMA CLOSE WHAT IT SAYS?). 0.80 that the Hermite
      reasoning holds as stated: the direction is right (a larger det gives
      a weaker upper bound on the minimum), gamma_4 = 2^{1/2} in this
      Gram convention (the Hurwitz order at p = 2 attains equality: min 1,
      det 1/4), and the constant (c_4/2) p^{1/2} is right. 0.60 that you find
      a RELEVANCE defect. The criterion in DEC-20260805-2be965 (D-5; goal.yaml
      exponent_budget_corrections, factor admissibility_criterion) is a bare
      exponent condition, log_p(det)/rank <= 1/4, and it was introduced
      because it "permits rank 4, which is where N5's higher-dimensional case
      lives". Its authors located the rank-4 option in N5, not in a single
      g = 1 Hom-module. The lemma is then correct but removes an instance the
      criterion never relied on. H's wording "the rank 4 with det <~ p option
      is EMPTY for every lattice lying inside a single Hom(E, E')" is true;
      any adoption into the goal record that drops "inside a single
      Hom-module" would overstate, because rank-4 lattices of determinant 1
      exist inside a sum of two Hom-modules (PT-6). 0.30 that you find the
      criterion also has a typical-minimum (Gaussian-heuristic) reading, in
      which the determinant gives the same exponent but the word
      "certificate" misdescribes the closure.

      J4 (PROVES TOO MUCH). 0.85 that the argument does NOT prove too much.
      It stops at "full rank" on PT-1, PT-2 and PT-6, at "inside an integral
      Hom-module" on PT-3, and at the upper-bound direction on PT-4; and it is
      consistent with C-NEAR and L1 on PT-5. 0.25 that you find a sentence
      readable as a FLOOR on isogeny degree ("can never certify a nonzero
      isogeny ... of degree below ..."), which PT-4 would refute if read that
