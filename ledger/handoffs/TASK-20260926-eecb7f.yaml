      quantity: >-
        Derive, from the definitions below and your own knowledge only, with a
        written step-by-step argument AND an exact numeric check, the
        following three quantities as exact functions of their parameters.
        Q1. det(O, Nrd): the determinant of the Gram matrix of the reduced
        norm on a Z-basis of a maximal order O of the definite quaternion
        algebra B_{p,inf} over Q ramified exactly at {p, inf}, as a function
        of p, valid for every prime p including p = 2.
        Q2. The group index [O : I], for O a maximal order of B_{p,inf} and I
        a nonzero left O-ideal contained in O, as a function of n(I).
        Q3. det(P^0, Nrd/p): the determinant of the Gram matrix of the form
        Nrd/p on a Z-basis of the rank-3 lattice P^0 = {x in P : Trd(x) = 0},
        where P = {x in O : p divides Nrd(x)}, as a function of p.
        For each: state every input you recall rather than derive, marked
        `recalled`; state where your argument would change if O were not
        maximal (Q1, Q2) or if P were replaced by O (Q3).
      parameters: >-
        GRAM CONVENTION (the producer's, frozen): for a quadratic form q on a
        Z-basis e_1..e_n, A_ii = q(e_i) and A_ij = (q(e_i + e_j) - q(e_i) -
        q(e_j)) / 2, so q(x) = x^T A x; det means det(A), an exact rational.
        n(I) is the positive generator of the Z-ideal generated by
        {Nrd(x) : x in I}. Nrd and Trd are the reduced norm and reduced trace.
        NUMERIC CHECK: at p in {2, 3, 5, 13, 17} (at least one prime of each
        class p = 2, 3 mod 4, 5 mod 8, 1 mod 8) and at one prime above 2^63 of
        your choosing, with a maximal order YOU construct (your own
