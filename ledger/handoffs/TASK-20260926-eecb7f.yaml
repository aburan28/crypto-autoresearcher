        verified maximal by a test you state), compute Q1 and Q3 exactly; and
        for Q2 construct at least three left ideals of distinct norms (one
        composite) at two of those primes, measuring [O : I] and n(I)
        independently of each other. Exact rational arithmetic only; you may
        use PARI/GP or Python in your scratch directory, but every script is
        your own and is quoted in the report.
