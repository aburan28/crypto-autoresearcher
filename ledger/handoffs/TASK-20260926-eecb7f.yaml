    claim_under_review: >-
      AS THE PRODUCERS STATED IT. (1) The hypothesis statement,
      ledger/hypotheses/H-SSIQ-a9df38.yaml, verbatim: "DETERMINANT LEMMA
      (derivation tier, with a computational normalisation check). For every
      prime p and every pair (E, E') of supersingular elliptic curves over
      F_{p^2}, the Z-lattice Hom(E, E') under the quadratic form deg has Gram
      determinant EXACTLY p^2/16. Gram convention: the matrix A with A_ii =
      q(e_i) and A_ij = (q(e_i+e_j) - q(e_i) - q(e_j))/2 on a Z-basis
      (e_1..e_4), i.e. q(x) = x^T A x. Consequently every full-rank (rank-4)
      sublattice L of index m in Hom(E, E') has det(L, deg) = m^2 p^2/16 >=
      p^2/16, so log_p(det L)/4 >= 1/2 - log_p(16)/4, and a
      Hermite/Minkowski-type certificate min q <= c_4 det(L)^{1/4} built from
      L can never certify a nonzero isogeny E -> E' of degree below (c_4/2)
      p^{1/2}." And its proposed consequence, verbatim: "If this hypothesis
      is supported, the "rank 4 with det <~ p" option is EMPTY for every
      lattice lying inside a single Hom(E, E') under deg in DIMENSION ONE, for
      every auxiliary target E' (not only E^{(p)}); lever L1's recorded
      "rank-4 object (P, Nrd/p) gives exponent 1/2" is the index-1 case.
      Lever N5 (levers_added) is NOT closed: only its rank-4,
      dimension-one, single-Hom-module, degree-form branch is."
      (2) The closure artifact, experiments/EXP-SSIQ-6916e8/derivation-note.md
      (executor, derivation tier, "not labelled proved"), Section 7,
      verbatim: "Covered (derivation tier, conditional on the cited
      interface (D)): every full-rank (rank-4) sublattice of a single module
      Hom(E, E'), with the degree form, for supersingular elliptic curves
      (dimension g = 1), every prime p, and every pair (E, E')." Its Section 5
      marks the Deuring interface (D) "CITED, NOT TESTED": line 244 of the
      frozen Wesolowski text (internal) for E' = E^{(p)}, the general pair
      recalled. (3) The run of record, execution-report-v2.yaml, verbatim:
      outcome_code INCONCLUSIVE-CONSTRUCTION, with the single blocking cell
