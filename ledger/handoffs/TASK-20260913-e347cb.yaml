handoff:
  id: TASK-20260913-e347cb
  from: coordinator
  to: executor
  objective: >-
    Implement and run EXP-AUXIN-7e2e3d Stage 0 order pin and Stage 1
    divisor census: synthetic controls first, then E(r) for every frozen
    standardized order, with factorization certificates and an independent
    recomputation. Do not run Cheon, recover a discrete logarithm, or audit
    protocols.
  uncertainty_reduced: >-
    Whether any frozen deployed prime-order r has a divisor of r±1 that
    puts E(r) materially below 0.5, under the DEC-20260802-204 expression.
  inputs:
    - experiments/EXP-AUXIN-7e2e3d/specification.yaml
    - ledger/hypotheses/H-AUXIN-66e6fd.yaml
    - ledger/ideas/IDEA-20260831-df4197.yaml
    - ledger/decisions/DEC-20260913-515d80.yaml
    - ledger/decisions/DEC-20260802-204.yaml
  constraints:
    - Own only the declared write_scope.
    - Stage 0 hash-commit of orders.json before any factoring.
    - Never treat a field prime as r.
    - Commit planted and safe-prime control verdicts before writing deployed E(r).
    - Do not call Cheon, generate [x^i]P, or recover a discrete logarithm.
    - An unfactored cofactor is an E_bound row, never a dropped curve.
    - If any deployed E(r) <= 0.40 after controls pass, finish remaining rows and stop-and-escalate; do not interpret as a vulnerability.
    - No ordinary-ECDLP improvement language.
    - Never select a provider, backend, endpoint, or model identifier containing Bedrock, case-insensitively.
    - maximum_runs is 1 (one census package).
  deliverables:
    - experiments/EXP-AUXIN-7e2e3d/implementation/
    - experiments/EXP-AUXIN-7e2e3d/runs/<allocated-RUN-ID>/
  artifact_paths:
    - experiments/EXP-AUXIN-7e2e3d/implementation/driver.py
    - experiments/EXP-AUXIN-7e2e3d/implementation/factor_path_a.py
    - experiments/EXP-AUXIN-7e2e3d/implementation/factor_path_b.py
    - experiments/EXP-AUXIN-7e2e3d/implementation/e_eval.py
    - experiments/EXP-AUXIN-7e2e3d/implementation/trial-plan.json
  archived_by: TASK-20260913-d428ec
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: null
    memory_gb: 8
    maximum_runs: 1
  completion_gate:
    - Stage 0 orders.json exists with sha256 commitment and a named source per curve.
    - controls_receipt.json shows planted E(r) in [0.24, 0.26] and safe-prime r-1 branch >= 0.49, committed before deployed E(r).
    - e_table.json has a row for every pinned deployed curve (E(r) or E_bound) with both branches and independent-recompute agreement.
    - Zero Cheon executions and zero discrete-log recoveries are attested.
    - Required run artifacts listed in the specification are present.
  review_plan: null
