handoff:
  id: TASK-20260911-9df234
  from: coordinator
  to: executor
  objective: >-
    Implement and run EXP-ECDLP-e36df2 exactly per its frozen
    specification.yaml: a resolution-matched, degeneracy-screened re-test
    of the Teichmuller non-homomorphic contrast, closing the confound
    DEC-20260911-74c9dc's next_actions named in H-ECDLP-6a9479 claim (3).
  uncertainty_reduced: >-
    Whether the Teichmuller-section digit shows any systematic (>=3x
    chance, alpha=0.01) linearity in m after removing the m=1 tautology and
    excluding the named +-1-root-of-unity degeneracy via a pre-registered
    cross-prime screen -- decided for the first time at a resolution able
    to discriminate the two outcomes (H-ECDLP-09125b).
  inputs:
    - ledger/hypotheses/H-ECDLP-09125b.yaml
    - experiments/EXP-ECDLP-e36df2/specification.yaml
    - ledger/proposals/IDEA-20260911-2dd68d.yaml
    - "experiments/EXP-ECDLP-a26bde/driver/instrument.py (READ-ONLY reference: padic.pmul, split_point, teichmuller_lift_scalar, teichmuller_section)"
    - "experiments/EXP-ECDLP-a26bde/driver/curves.py (READ-ONLY reference: seeded prime-search procedure/criteria)"
    - "experiments/EXP-ECDLP-a26bde/runs/RUN-ECDLP-a26bde-001..020/raw-result.json (READ-ONLY: Stage 0 regression baseline data)"
    - "experiments/EXP-ECDLP-a26bde/frozen_curves_and_primes.json (READ-ONLY: the five original curves and 20 instances)"
  constraints:
    - "Do not modify, append to, or add any file under experiments/EXP-ECDLP-a26bde/ (driver/, runs/, specification.yaml, analysis.md, derivation_note.md, frozen_curves_and_primes.json) -- it is frozen, official, and cited by EV-ECDLP-95ec68's 22 already-official runs."
    - "Build a NEW driver entirely under experiments/EXP-ECDLP-e36df2/driver/. May import read-only or copy-with-attribution (commit hash + source path in a comment) padic.pmul, split_point, teichmuller_lift_scalar, teichmuller_section from the frozen module; never monkeypatch or edit the frozen module in place."
    - "N_i = ceil(20 * p_i) is a FROZEN scientific sample-size protocol (specification.yaml approval_gate); do not reduce it to fit a CPU/time budget. If actual measured cost makes the full ladder impractical, halt and report to the Coordinator rather than silently substituting a smaller N_i."
    - "Stage 0 (the pmul-vs-exact-Fraction regression check against a26bde's committed m=1..256 data) is BLOCKING: it must show 0 mismatches before any Stage 2/3 compute is run. If it shows any mismatch, HALT immediately, do not proceed, and report the mismatch(es) plus a diagnosis attempt -- this is a design/implementation defect requiring a Coordinator decision, not something to patch and continue past silently."
    - "The engineered positive-control curve's 4 reduction primes must be generated by the identical seeded search procedure/criteria as driver/curves.py's _find_primes_for_curve, applied to the fixed frozen point A=5,B=10,x0=1,y0=4."
    - "Per-instance raw output must NOT be a full per-m table over the entire deep ladder (up to ~3.3e5 m-values); retain only the aggregate counts, the small flagged-multiple census, and chi-square summary statistics specified in required_artifacts, to keep the run within the declared memory budget."
    - "The joint alpha=0.01 / effect>=3 falsification bar and the four-way outcome split in specification.yaml's success_criterion are frozen; do not reinterpret or soften them after seeing results."
    - "Timeouts, crashes, and precision-margin exhaustion are infrastructure per AGENTS.md rule 5 -- report as failed_infrastructure / attempted_and_inconclusive, never as a negative finding about claim (3)."
    - "This task may not modify H-ECDLP-6a9479, EV-ECDLP-95ec68, or DEC-20260911-74c9dc, and cannot change H-ECDLP-6a9479's status; it produces evidence only for H-ECDLP-09125b."
  deliverables:
    - experiments/EXP-ECDLP-e36df2/driver/ (new instrument code, per specification.yaml inputs.instrument)
    - experiments/EXP-ECDLP-e36df2/stage0_regression_transcript.json
    - experiments/EXP-ECDLP-e36df2/frozen_positive_control_curve.json
    - "experiments/EXP-ECDLP-e36df2/runs/RUN-ECDLP-e36df2-*/{manifest.yaml,raw-result.json}"
    - experiments/EXP-ECDLP-e36df2/pooled-summary.json
    - experiments/EXP-ECDLP-e36df2/design_note.md
  artifact_paths:
    - experiments/EXP-ECDLP-e36df2/
  archived_by: null
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: null
    memory_gb: 6
    maximum_runs: 25
  completion_gate:
    - "Stage 0 transcript committed with an explicit match/mismatch count; if nonzero, the task ends there (halt-and-report) and does not proceed to Stage 1/2/3."
    - "The positive-control curve and its 4 primes are frozen and committed before any Stage 2 run begins."
    - "All planned runs (up to 25) reach a terminal status (completed_valid, completed_invalid, attempted_and_inconclusive, or failed_infrastructure) with schema-complete manifest.yaml files (command, commit, dirty-tree state, environment, inference block)."
    - "pooled-summary.json reports rho_hat_x, rho_hat_y, rho_hat_rand with 95% exact-Poisson CIs and one-sided Poisson p-values, the joint alpha=0.01/effect>=3 verdict for s_x and s_y, the positive control's m=2 screen flag rate, and the mu_0_target=40 sensitivity-check result."
    - "The flagged-degenerate-multiple census (x- and y-screens) is reported per instance."
    - "design_note.md documents the s_y and s_rand constructions and the cross-prime screen definition, and reports the H2 base-rate tabulation against EXP-ECDLP-a26bde's existing data."
    - "No file under experiments/EXP-ECDLP-a26bde/ shows a diff from its currently-committed state."
  return_format: >-
    A completion report citing every produced artifact path, the Stage 0
    mismatch count, the four-way outcome classification (supported /
    falsified / split-inconclusive / instrument-invalidation) per
    specification.yaml's success_criterion, and any deviation from the
    frozen protocol encountered during implementation.
  review_plan: null
