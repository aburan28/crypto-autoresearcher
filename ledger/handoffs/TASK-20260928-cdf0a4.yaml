  title: >-
    Compose DEC-20260928-63addc: the official ranking of the unranked open ECC
    proposals in the six-question pool, the official re-rank of HOLD-A to
    HOLD-G, and the selection of at most two proposals for /design-experiment
    as disjoint design lanes in a later batch
  objective: >-
    Read the snapshot-bound ranking report and dedup map, and write
    DEC-20260928-63addc. It records the Coordinator's official ranking of
    every pool proposal; the official order of DEC-20260924-99ce20's HOLD-A
    to HOLD-G after the 26 reviews and the validator pass (discharging
    DEC-20260924-99ce20 NA-7 for this selection point); a disposition of
    DEC-20260924-99ce20 NA-3 (the revision batch for the six
    return_for_revision proposals) and NA-4 (the HOLD-H and HOLD-L reading
    tasks), each either ranked into a later batch with its content fixed by
    the reviews or carried with a revisit condition; selects at most two
    proposals under this goal's own questions (RQ-BINSTD-b6f698,
    RQ-CERTBIN-836ce2, RQ-QSP-f9bbdb) for /design-experiment as disjoint
    design lanes in a later batch under standing authorization; routes any
    top-ranked RQ-ICPERF-94c86e, RQ-FROB-7d8dd4 or RQ-SATIC-1ae57a proposal
    to its owning goal (GOAL-ICPERF-e6b6a4, GOAL-FROB-6333a9,
    GOAL-SATIC-c49b77) by bus pointer named in next_actions; routes every
    tripwire item to review-breakthrough at max in a later batch; and states
    in next_actions item 1 the design batch to open on GOAL-ECDLP2M-001
    precisely enough to author. Write a selection worksheet mapping every
    departure from the ranking report to its reason.
  uncertainty_reduced: >-
    Which proposal(s) the program designs next on GOAL-ECDLP2M-001 once
    BATCH-b67954's lanes compose, and why, recorded so that the choice can be
    audited against the report it departs from.
