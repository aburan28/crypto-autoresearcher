    committed decision on main) and its R-HOLDS or R-NA7 ruling is applied to
    the hold re-rank; if not, the re-rank is recorded as made before those
    composing decisions and revisited by them.
  constraints:
    - >-
      The ranking report is advisory. The official ranking is this decision's.
      Every departure from the report is recorded in the worksheet with its
      reason.
    - >-
      NO ADVERSE TRANSITION. Close, reject, weaken or supersede nothing, and
      move no status. Every proposal stays proposed. A deprioritised proposal
      records its evidence, test boundary, remaining uncertainty and revisit
      condition. A review that disagrees with a recorded hold (29b1c5,
      HOLD-E) may change the hold's KIND (for example queued_for_design to
      return_for_revision) only with the review's finding quoted and a
      revisit condition, and it is then a candidate for an additive
      correction named in next_actions, never an edit.
    - >-
      A proposal is selected for design only if its proof_search_map audits
      are present or carry a stated not_applicable reason
      (agents/coordinator.md "Proof-oriented dispatch gate"), or if the
      design card that next_actions item 1 specifies must supply the missing
      audit first. A selected proposal that quotes the floor-to-rho gap as a
      per-attempt budget carries a design condition to re-price against D2
      or D3 (CORR-20260928-4cb669).
    - >-
      AT MOST TWO selections, both under RQ-BINSTD-b6f698, RQ-CERTBIN-836ce2
      or RQ-QSP-f9bbdb. A top-ranked ICPERF, FROB or SATIC proposal is
      recorded with its rank and routed to its owning goal by a bus pointer
      in next_actions; it is not designed on GOAL-ECDLP2M-001 and no other
      goal's head is edited.
    - >-
      Apply DEC-20260924-4f8a03 R2 and name the survivor of each merged
      cluster. Apply CORR-20260925-649e25 to any per-orbit relation-yield
      framing.
    - >-
      TRIPWIRES. Every tripwire item from the report, and any this session
      finds, is routed to review-breakthrough at max in a later batch (AGENTS.md
      rule 12). None is decided, downgraded, closed or weakened here. If
      review-breakthrough cannot be served at max, the item stays un-approved
      and the impediment is recorded; the tier is never lowered.
    - >-
      Write only DEC-20260928-63addc and the worksheet. The goal head is NOT
      edited: its lane next_action already names DEC-20260928-63addc
      next_actions item 1 as this lane's authority after TASK-20260928-deb56a
      verifies (DEC-20260928-157d40 NA-goal-head). Mint no identifier; the
      design batch's ids are minted later by the top-level session.
    - >-
      Fill knowledge_promotion (not_warranted, with the reason) and the
      inference block with fallback_used and its reason. Record
      session_checks_reported as the dispatching session's report, and
      bound_inputs with the snapshot receipt's digests.
    - >-
      Slots. The design batch of next_actions item 1 opens only after
      BATCH-b67954's lane archives verify or a slot of the goal's
      max_concurrent 3 otherwise frees; state the precondition. The QSP
      custody successor (DEC-20260928-157d40 rank 4) keeps its own claim on
      the first free slot and is not displaced by this selection without a
      recorded reason.
    - >-
      OUTCOME DISCIPLINE. No AUXIN census value, reviewer finding value,
      RUN-FROB-627924 value or EXP-FROB-30006a outcome. Nothing read under the
      excluded paths. ZERO RUNS.
