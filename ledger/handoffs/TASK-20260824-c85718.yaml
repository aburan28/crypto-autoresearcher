handoff:
  id: TASK-20260824-c85718
  from: coordinator
  to: idea-generator
  objective: >-
    Design, but do not execute, the first finite protocol for finding and
    unconditionally certifying an explicit elliptic curve over Q with 32
    independent rational points, using frozen ICARM curve 302 as the exact
    rank-31 lower-bound baseline.
  uncertainty_reduced: >-
    Whether there is a falsifiable, resource-bounded, control-complete route
    from the current exact 31-point baseline to a candidate whose rank >= 32
    can be proved without analytic assumptions or floating decisions.
  inputs:
    - ledger/goals/GOAL-ECQ-e72c0b/goal.yaml
    - ledger/decisions/DEC-20260824-c2ac4c.yaml
    - coordination/goals/GOAL-ECQ-e72c0b/baseline/icarm_curve_302_20260824.json
    - coordination/goals/GOAL-ECQ-e72c0b/batches/BATCH-3d8863/archives/TASK-20260824-01b105/receipt.yaml
    - Internal scope guards GOAL-ECQ-001, GOAL-ECQ-002, GOAL-ECRANK-001, and GOAL-ECRANK-002.
    - Retrieved ICARM verifier source commit 4c9ef36265c3cbc10f5da84fcade3f4bbe6854cc.
  constraints:
    - >-
      maximum_runs is one agent-dispatch attempt, not a command or experiment
      budget: run no curve search, rank computation, verifier, benchmark,
      experiment, or code.
    - Do not create a candidate curve or claim mathematical progress.
    - Do not read from, edit, copy, or depend on unmerged GOAL-ECQ-bef741 artifacts.
    - Use repository knowledge retrieval before asserting a route is known, tried, failed, or novel; every citation carries recalled, retrieved, kb, or internal provenance.
    - Treat curve 302 only as rank >= 31; do not use its BSD plus GRH commentary as unconditional evidence.
    - Record a quantitative SOTA delta of exactly one additional certified independent point; do not claim exact-rank delta.
    - >-
      Include the complete proof_search_map: exact baseline reproduction,
      observation-collision audit, explicit quantifier order, method ceiling,
      and nearby-object control.
    - Compare every proposed lane across time, memory, and data or query costs before setting dominated_by; an unchecked null is forbidden.
    - Predeclare deterministic finite candidate-family cells or another finite target set, seeds and ordering, matched null controls, positive controls, nearby-object controls, budgets, stops, invalidation rules, and exact artifacts.
    - Include proves-too-much point-set controls P32=P1+P2 and P32=2P1, which must fail the independence gate, plus an exact rational-2-torsion applicability control.
    - Define an independent local reproduction of curve 302's nonsingularity, all 31 on-curve equations, exact torsion treatment, and exact torsion-aware character-matrix lower bound before tuning on rank 32.
    - Define candidate acceptance as exact discriminant nonzero, 32 exact rational on-curve points, exact E(Q)_tors, and an unconditional certificate whose complete published basis or basis binding proves matrixRank-torsionRank=32 or an equivalent exact theorem.
    - Specify producer snapshot, independent validator, red team, blind rederivation, review-breakthrough max with no fallback/degradation, and ledger archive gates for any eventual success.
    - Do not authorize external leaderboard submission or any other external write.
    - Preserve the disclosed red full-suite state as an execution blocker; protocol design cannot waive it.
    - Use no Bedrock provider, fallback, or degraded inference.
  deliverables:
    - coordination/goals/GOAL-ECQ-e72c0b/batches/BATCH-3d8863/tasks/TASK-20260824-c85718/protocol.yaml
    - coordination/goals/GOAL-ECQ-e72c0b/batches/BATCH-3d8863/tasks/TASK-20260824-c85718/task-report.yaml
  write_scope:
    - coordination/goals/GOAL-ECQ-e72c0b/batches/BATCH-3d8863/tasks/TASK-20260824-c85718/protocol.yaml
    - coordination/goals/GOAL-ECQ-e72c0b/batches/BATCH-3d8863/tasks/TASK-20260824-c85718/task-report.yaml
  artifact_paths:
    - coordination/goals/GOAL-ECQ-e72c0b/batches/BATCH-3d8863/tasks/TASK-20260824-c85718/protocol.yaml
    - coordination/goals/GOAL-ECQ-e72c0b/batches/BATCH-3d8863/tasks/TASK-20260824-c85718/task-report.yaml
  archived_by: TASK-20260824-32cf98
  inference:
    policy: research-deep
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget: {wall_clock_seconds: 7200, memory_gb: 4, maximum_runs: 1}
  completion_gate:
    - The output is a design only and records experiments_run 0 and mathematical_claims empty.
    - The protocol binds the frozen curve-302 bytes, provenance, date, and SHA-256 and separates lower-bound evidence from conditional exact-rank commentary.
    - Mechanism, predictions, test boundary, falsification, confounders, interpretation limits, SOTA delta, Pareto comparison, and proof_search_map are complete.
    - Every future stage has finite work units, exact budgets, controls, stopping rules, invalidation rules, and artifact paths.
    - The exact rank-32 certificate and torsion route is theorem-backed and independently rederivable from declared inputs.
    - A predeclared protocol-review plan names joints for baseline, search validity, certificate semantics, controls, budgets, and execution environment.
    - No execution handoff or approval is created.
  return_format: >-
    Protocol YAML plus truthful task report at the two declared task paths, with citations, hashes, budgets, controls, proof-search map, future review architecture, and zero-run statement.
  review_plan: null
