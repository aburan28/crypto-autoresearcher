      One commit whose message names TASK-20260924-c65bfb,
      TASK-20260924-1039eb, DEC-20260924-bea197, EXP-GFPN-05ff43 and
      GOAL-GFPN-380702.
    - coordination/goals/GOAL-GFPN-380702/archives/TASK-20260924-c65bfb/snapshot-receipt.json
