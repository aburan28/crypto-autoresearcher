    - coordination/goals/GOAL-GFPN-380702/archives/TASK-20260923-0fa03f/snapshot-receipt.json
    - coordination/goals/GOAL-GFPN-380702/archives/TASK-20260923-4ff597/snapshot-receipt.json
    - coordination/goals/GOAL-GFPN-380702/batches/BATCH-e409ca/dispatch_queue.json
    - origin/main

  constraints:
    - id: CC-1
      text: >-
        STAGE ONLY THE DECLARED PATHS, path by path. `git add -A` is
        forbidden. A dirty or untracked path outside the declared set is not
        staged, and is NAMED in the receipt as a scope finding.
    - id: CC-2
      text: >-
        EDIT NO RECORD WHILE ARCHIVING. That covers the census files, every
        draft addendum, the preserved r2 outputs, the characterization and
        premise-check files, every bundle, any run package, any frozen tree,
        cards, decisions, corrections, the goal record and tools/. A defect
        found now becomes a new record, never a repair.
    - id: CC-3
      text: >-
        MERGE origin/main INTO THE BRANCH, NEVER REBASE, before the commit.
        Record the base commit and the merge outcome. A conflict inside a
        record is resolved by a superseding record under a new id.
    - id: CC-4
      text: >-
        AN ARCHIVE IS NOT EVIDENCE AND NOT APPROVAL. The draft
        AMD-EXP-GFPN-05ff43-20260924-healthresolve stays a draft.
        H-GFPN-9a29be stays inconclusive and HEUR-GFPN-DFLAT untested. The
        archive computes, scores and interprets nothing.
    - id: CC-5
      text: LAUNCH NOTHING. maximum_runs 0. RUNS ALONE.
    - id: CC-6
      text: >-
        After the commit, push the branch and refresh the open PR against
        main, naming every id in record_ids. Amazon Bedrock is prohibited.
        Write no model name into the receipt beyond the inference block's
        resolved binding, which the dispatching session records.

  verification_steps: >-
    (1) The three declared files exist, or the missing ones are exactly those
        census.md itself declares missing after an LC-2 stop. census.json
        parses as JSON.
    (2) The healthresolve draft still hashes to the TASK-20260924-bc10a8
        receipt addendum_sha256; the seedresolve draft to
        dc714a446a22a99fd6762196d4e6ad1b8c9e7eb3920d64cf26036f95ecadee81;
        the solverevent draft to
        011d4b2c11f99d696281ccfdd4d65ece4fefcc6ae71de3de813049bbeb2d9b7f; and
        the 19 r2 outputs to the TASK-20260924-5ca2a5 receipt values.
    (3) No run directory exists beyond the v1 packages, RUN-GFPN-ac4487 and
        RUN-GFPN-3377f1; no path implementation-v2-r3*, trial-plan-v2-r3.json
        or trial-plan-v2-a1-r3.json exists.
    (4) `git status --porcelain -- experiments/EXP-GFPN-05ff43` shows changes
        only inside experiments/EXP-GFPN-05ff43/dev-evidence/launch-census/.
    A failure of (2) or (3) STOPS the archive. Nothing is committed, and the
    failure is reported to the Coordinator.

  deliverables:
