    - DEC-20260924-bea197

  objective: >-
    After TASK-20260924-1039eb returns (any outcome) and releases its claim,
    commit its declared files exactly as returned in one isolated commit.
    Record a post-commit snapshot receipt with per-path SHA-256, the parent,
    the origin/main base commit checked and the merge outcome, so that the
    approval act decides on archived bytes.

