    memory_gb: 2
    maximum_runs: 0

  completion_gate:
    - the archive commit changes exactly the bound paths that exist plus the receipt, or a documented superset listed in the receipt
    - the receipt's path_sha256 covers every bound path that exists and matches the committed tree, as the post-commit verifier re-checks
    - the receipt records the parent, the origin/main base commit, the merge outcome and verification steps (1)-(4)
    - the branch is pushed and the open PR is refreshed, naming every id in record_ids
    - a BATCH-e409ca revision then marks this archive completed with commit_sha, parent_sha and full path_sha256 (binding_mode content_first), and TASK-20260924-1039eb with the outcome its claim release records
    - nothing was launched and no record was edited

  next_act_after_this_archive: >-
