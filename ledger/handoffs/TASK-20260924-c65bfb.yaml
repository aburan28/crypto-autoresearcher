    - No other archive, producer or solver is running (RUNS ALONE).
    - origin/main is fetched and merged, never rebased, before staging. The base commit is recorded.
    - tools/validate_ledger.py on the working tree reports no error line beyond the base's pre-existing set.

  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    resolved_model_id: null
