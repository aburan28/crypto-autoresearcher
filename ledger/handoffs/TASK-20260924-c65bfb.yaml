  receipt_contents: >-
    The receipt records:
    - kind snapshot, source_task_ids [TASK-20260924-1039eb] and record_ids;
    - path_sha256, a mapping of repository-relative path to lowercase sha256
      for every bound file and the receipt;
    - the parent, the origin/main base commit and the merge outcome;
    - verification steps (1)-(4);
    - the validator outcome and any scope findings;
    - quoted separately, and copied verbatim without interpretation from
      census.json: the CN-5 integrity outcome, the CN-1 list of reachable
      classified msolve launch sites and its reading, the CN-2 (i)-(ix)
      outcomes and the CN-2 (vi) mismatch count.
    The receipt never carries its own commit's sha.

  archived_by: TASK-20260924-c65bfb
  archived_by_note: Self-bound. This is the archive card itself; the card file is committed by TASK-20260924-bc10a8.
  depends_on:
    - TASK-20260924-1039eb

