handoff:
  id: TASK-20260820-047039
  recorded_at: '2026-08-20'
  goal_id: GOAL-MD5-001
  question_id: RQ-MDFIVE-6870c1
  batch_id: BATCH-312472
  task_card: coordination/goals/GOAL-MD5-001/batches/BATCH-312472/task-cards/TASK-20260820-047039.md
  role: validator
  from: coordinator
  to: validator
  objective: 'Verify, independently of the author''s and red team''s accounts, that BCP-2 is dispatchable:
    evaluate its pre-dispatch gate mechanically against the committed quarantine state at the snapshot
    commit, re-run the runner''s certificate logic on your own known-false objects, and confirm the firewall
    carry-over is intact in the committed tree.'
  uncertainty_reduced: That dispatchability is a mechanical fact about the committed tree, not a property
    of the author's description of it.
  inputs:
  - BCP-2 at the snapshot commit
  - harness/runner.py at the snapshot commit
  - The committed quarantine MANIFEST (sha256 + canonicalization text only — NEVER the payload)
  - implementation-pin.yaml (the pinned pair)
  - The BATCH-46254b validation report (the firewall baseline to check for regression)
  constraints:
  - SC-1 FABRICATE NOTHING. No invented timing, measurement, throughput, citation, review verdict, model
    identifier or commit SHA. A field that is not yet knowable stays null and is named as such.
  - SC-2 CLAIM CEILING. Assert nothing about MD5 - no collision, no preimage, no complexity, no method
    ceiling, no obstruction, and no comparison against any published result in either direction.
  - SC-3 UNVERIFIED FIGURES STAY MARKED. Every figure not obtained in primary text stays marked unverified
    and is never cited as authority in either direction.
  - SC-4 A failed, halted or exhausted search is a BUDGET OUTCOME about a solver and NEVER evidence about
    MD5 (AGENTS.md rules 5 and 8).
  - SC-5 Anything not attempted is named OPEN AND UNATTEMPTED and is never recorded as tried, screened
    or negative.
  - SC-6 Change no hypothesis, question, experiment or goal status; approve no experiment; promote no
    knowledge; edit no committed record. Report findings; the disposition is the Coordinator's.
  - SC-7 Halt at the declared wall_clock_seconds (350 s) and report the halt truthfully as infrastructure
    signal, naming the dropped work as scope rather than as an answer.
  - SC-8 Never select, configure, probe, contact or use Amazon Bedrock (AGENTS.md rule 16).
  - 'RE-RUN, do not read: evaluate BCP-2''s pre-dispatch gate against the committed state with your own
    commands (recompute the canonical serialization digest from the MANIFEST''s stated command shape applied
    to a synthetic payload structure, and check the gate''s decision logic on a synthetic manifest); re-run
    the runner''s md5_collision_pair logic on your own known-false objects.'
  - NEVER READ the quarantined payload. The gate evaluation uses the MANIFEST's sha256 and canonicalization
    text with a synthetic structure, exactly as a future dispatcher would.
  - Read the committed tree at the snapshot commit, not uncommitted working state.
  deliverables:
  - validation-report.yaml with a per-check verdict and its basis, the explicit dispatchability determination
    (dispatchable / dispatchable-with-named-gaps / not-dispatchable, with the gate evaluation shown step
    by step), the certificate-logic re-run results object by object, the firewall carry-over determination
    (no regression against the BATCH-46254b determination), and a concrete defect list.
  artifact_paths:
  - coordination/goals/GOAL-MD5-001/batches/BATCH-312472/reviews/TASK-20260820-047039/validation-report.yaml
  archived_by: TASK-20260820-19ae68
  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 350
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
  - The pre-dispatch gate was evaluated mechanically (the command sequence and its output are in the report),
    not merely described.
  - Every known-false certificate object comes out verified:false under the runner at the snapshot commit.
  - The firewall carry-over determination is explicit and states whether exclusion remains enforceable.
  - Every defect is concrete and actionable, and no defect is softened into a caveat.
  - No status changed, no committed record was edited, and nothing was written outside this task's review
    directory.
  return_format: The report path, the explicit dispatchability determination in one line, the gate-evaluation
    command sequence summary, the per-object certificate re-run results, the firewall carry-over determination,
    and the defect count.
