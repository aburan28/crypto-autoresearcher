handoff:
  id: TASK-20260801-802
  from: coordinator
  to: executor
  objective: >-
    Close the escape route the TASK-20260731-705 validator found INSIDE the
    repair that closed H-3, in a superseding BATCH-003 package.
    (1) ER-6 / D-705-7: mutation_control_v2.py's build_tasks() generates
    final_mix_columns=True ONLY for 16-byte keys
    ("for fmc in (False, True) if klen == 16 else (False,)"), so a fault
    confined to fmc=True with 24- or 32-byte keys earns a full green on a
    demonstrably broken module. Make the one-line change generating fmc in
    {False, True} for ALL THREE key lengths and RE-RUN to demonstrate that the
    validator's regime-confined fault is now DETECTED.
    (2) D-705-8: write the explicit (key length x final_mix_columns) coverage
    boundary into the receipt, so a reader can see from the artifacts which
    regimes a green covers.
    (3) D-705-2: apply the one-line `sys.modules[spec.name] = mod` fix before
    exec_module in a superseding copy of verify_derivation.py and demonstrate
    that claim C0 now runs instead of SKIPping.
  uncertainty_reduced: >-
    Whether the bound on what a green from this mutation control certifies can
    be made VISIBLE and made TRUE on the axis where it was shown false — which
    DEC-20260731-025 recorded as the undischarged remainder of
    DEC-20260731-011's condition that H-1 and H-3 close before any reduced-round
    measurement is certified; and whether the derivation script's last
    unexecuted claim, the cross-check against the BATCH-001 harness, actually
    passes once the loader defect is removed.
  inputs:
    - >-
      DEC-20260731-025 disposition harness_TASK_20260731_702: the repair is
      ADMITTED as a reproducibility fact, H-1 and H-3 are CLOSED, ER-6 is OPEN
      and tracked with D-705-8, and DEC-20260731-011's certification condition
      is NOT discharged while ER-6 stands.
    - >-
      EV-AES-002 observations B-5 (ER-6, with the exact build_tasks()
      expression and the validator's confirmed regime-confined fault), B-6
      (D-705-8), B-7 (the comparison target establishes SENSITIVITY only; H-4 is
      irreducible), B-8 (H-2, H-4, ER-5 remain open) and A-8 (D-705-2, the exact
      sys.modules defect and the AttributeError it raises).
    - >-
      TASK-20260731-705 validation_report.yaml REPRO-705-4 (byte-identical
      reproduction, results_digest 9bee94de...47d7), REPRO-705-5 (six injection
      shapes, all failing closed) and REPRO-705-6 (the ER-6 demonstration and
      its exact injection method), plus harness_repair_review.md.
    - >-
      mutation_control_v2.py, repair_receipt.json and repair_report.md as
      committed at snapshot ebac9ba8 (control_source_sha256 d2b2a5dd...00d7),
      READ-ONLY.
    - >-
      verify_derivation.py as committed at snapshot ebac9ba8 (blob
      9618f55f...4951), READ-ONLY.
    - "The BATCH-001 harness aes_reduced.py as committed at snapshot 0185c0ff, READ-ONLY."
    - >-
      Local tooling: python3 3.11.15, pycryptodome 3.23.0, openssl 3.0.13,
      gcc 13.3.0 -maes, 4 cores, 15 GB RAM.
  constraints:
    - >-
      IMMUTABILITY. Every BATCH-001 and BATCH-002 artifact is committed and
      immutable (AGENTS.md core rule 4). Do NOT modify, overwrite, delete or
      re-run into any of them. Copy what you need into THIS task's directory and
      supersede with new, separately named files. State exactly which committed
      artifact each new file supersedes, and that the BATCH-002 archived green
      STANDS AS RECORDED — ER-6 is a coverage escape that falsifies no claim the
      BATCH-002 receipt makes, and this package must not present it as one.
    - >-
      ER-6 PROOF OBLIGATION, THE POINT OF THE TASK. Re-create the validator's
      regime-confined fault from REPRO-705-6 — a wrong final-round determination
      active ONLY for final_mix_columns=True with key length != 16 — FIRST
      confirm independently by direct ciphertext comparison that the fault is
      real and regime-confined, THEN run mutation_control_v3.py against that
      broken module and show it is now DETECTED, with the detection occurring
      through an EXECUTED comparison and not through any exception path. Record
      the injected source, the confirming ciphertext comparison, the comparison
      counts and the full scored output. A fix demonstrated only by reading the
      new task set is not a demonstration.
    - >-
      REGRESSION OBLIGATION. Re-run the full mutant suite and the no-op controls
      under the widened task set and show the BATCH-002 results still hold:
      every H-1 injection shape still fails closed with detected: false and a
      non-passing verdict; every reduced-round mutant is still detected by a
      comparison performed at r < Nr; and the semantics-preserving no-op mutant
      still scores detected: false AFTER a nonzero number of executed
      comparisons. A widened task set that made the control fire on everything
      would be vacuous, and that must be checked, not assumed.
    - >-
      COVERAGE BOUNDARY IN THE RECEIPT (D-705-8). repair_receipt_v3.json must
      carry an explicit machine-readable statement of the
      (key length x final_mix_columns) product actually generated, and the
      report must state in prose which regimes a green covers and which it does
      not. State the NEW boundary honestly: closing one coverage axis does not
      close the class of coverage escapes, and the recorded lesson is that ER-6
      was the H-3 failure shape recurring inside the repair for H-3. Name at
      least two further coverage axes that remain unexercised and are candidates
      for the same escape, WITHOUT claiming they are safe.
    - >-
      D-705-2. Apply `sys.modules[spec.name] = mod` before exec_module in
      verify_derivation_v2.py and RUN it. Report the full per-claim summary. If
      C0 now PASSes, report 17 PASS / 0 FAIL / 0 SKIP with the claim's detail
      line. If C0 FAILS or still SKIPs, report that verbatim and do NOT adjust
      the claim to make it pass — a failing cross-check against the BATCH-001
      harness would be a substantive finding this campaign needs to know about,
      not a nuisance to route around. Change NOTHING else in the script: the
      file must otherwise be byte-identical to the committed blob, and the
      report must state the change explicitly as a one-line diff.
    - >-
      H-2, H-4 AND ER-5 ARE NOT REPAIRED AND MUST NOT BE CLAIMED CLOSED,
      MITIGATED OR SUPERSEDED. H-4 (no external reduced-round reference exists
      or can be obtained) is an irreducible limitation of this environment.
      Restate all three as open.
    - >-
      OBSERVATIONS ONLY. A repaired instrument is a REPRODUCIBILITY FACT about
      an instrument. It supports no claim about AES, demonstrates no speedup,
      certifies no cryptanalytic measurement, and may never be upgraded into
      empirical cryptanalytic evidence about the cipher. Assert no evidence
      strength and propose no state change.
    - >-
      Record exact commands, exit statuses, resolved tool versions, git commit
      and dirty-tree state, deterministic seeds, timestamps, and every check
      that did NOT run and why. Do not fabricate a command, version string,
      output, count or passing check (AGENTS.md rule 9). A mutant that could not
      be scored is recorded as unscored.
    - "No literature baseline is relevant to this task and none may be invoked."
    - >-
      A check that cannot be performed is an INFRASTRUCTURE LIMITATION reported
      with its exact failure — a task-scope result, never negative mathematical
      evidence (AGENTS.md rule 5).
    - >-
      Create no ledger record, promote nothing to knowledge, change no official
      state, and write only under this task's own directory.
  deliverables:
    - mutation_control_v3.py
    - verify_derivation_v2.py
    - repair_receipt_v3.json
    - repair_report_er6.md
  artifact_paths:
