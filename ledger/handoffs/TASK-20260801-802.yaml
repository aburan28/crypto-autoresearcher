    - coordination/goals/GOAL-AES-001/batches/BATCH-003/tasks/TASK-20260801-802/verify_derivation_v2.py
    - coordination/goals/GOAL-AES-001/batches/BATCH-003/tasks/TASK-20260801-802/repair_receipt_v3.json
