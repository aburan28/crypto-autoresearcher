handoff:
  id: TASK-20260812-273630
  from: coordinator
  to: executor
  goal_id: GOAL-ARGON-001
  batch_id: BATCH-614f1d
  question_id: RQ-ARGON-141710

  status: written_not_dispatched
  status_note: >-
    Written by this reconciliation task (TASK-20260812-e46d24,
    DEC-20260812-03fa10) per GOAL-ARGON-001's next_action item (3). This
    Coordinator session has no Bash/curl and did NOT execute this task. It
    is a frozen, dispatch-ready handoff for a future Executor session, not a
    completed action. Do not treat RFC 9106 as fetched or filed until an
    Executor's own completed receipt exists under this task's write_scope.

  objective: >-
    Obtain RFC 9106 (Argon2 password hashing) as primary text and file it as
    a KN-LIT literature record in the knowledge corpus, so this goal's
    RECALLED-and-spot-check-confirmed algorithmic claims (C1-C7 in
    TASK-20260809-4e04eb's proposal.md Sec.3) can eventually be read as
    program-filed, cited primary source rather than as recalled and
    independently corroborated.

  uncertainty_reduced: >-
    Whether a raw HTTP fetch route (curl or equivalent) reliably obtains RFC
    9106's primary text in this environment for a session other than the
    one Validator session (TASK-20260809-28c68e) that first demonstrated it,
    and whether that text can be filed as a durable, citable KN-LIT record
    rather than remaining an ad hoc verification artifact.

  inputs:
    - >-
      coordination/goals/GOAL-ARGON-001/batches/BATCH-09d69e/reviews/TASK-20260809-28c68e/validation_report.yaml
      -- demonstrates the working route: `curl -s --max-time 20
      https://www.rfc-editor.org/rfc/rfc9106.txt` returned HTTP 200 and the
      full 975-line RFC text in that session. Also carries a per-claim
      spot-check (C1-C7) of TASK-20260809-4e04eb's RECALLED premises against
      the actual RFC text, useful as a cross-check once the primary text is
      filed.
    - >-
      coordination/goals/GOAL-ARGON-001/batches/BATCH-09d69e/tasks/TASK-20260809-4e04eb/proposal.md
      Sec.0 and Sec.3 -- the RECALLED-vs-verified claim ledger this filing
      should let a future session upgrade from RECALLED to READ.
    - knowledge/README.md -- entry format and provenance-class rules for knowledge/literature/.
    - >-
      knowledge/literature/KN-LIT-494.md and knowledge/literature/KN-LIT-3385.md
      -- worked examples of the literature-entry frontmatter/body shape,
      including how to record an entry whose content could only be
      partially extracted (do NOT reproduce that partial-extraction pattern
      here if the full RFC text is actually obtained -- file it as fully
      read, not as a heuristic title-only stub).

  constraints:
    - >-
      Use a raw HTTP fetch route (curl or equivalent Bash tool), not
      WebFetch/WebSearch -- those tools failed identically for three
      independent sessions in this goal (producer, Validator, Red Team) on
      a backend-model infrastructure error unrelated to RFC 9106's actual
      availability.
    - >-
      Try, in order: (1) `https://www.rfc-editor.org/rfc/rfc9106.txt`
      (demonstrated working), (2) the .html variant, (3)
      `https://datatracker.ietf.org/doc/html/rfc9106` as fallback. Record
      whichever succeeds and the exact command used.
    - >-
      File the obtained text as a NEW KN-LIT-* entry. Mint the identifier
      by choosing a random 6-hex token per AGENTS.md rule 14 (note:
      `tools/allocate_id.py --next` does not currently cover the `KN`
      prefix family, so allocate manually -- pick a random 6-hex suffix,
      verify it is free with `python3 tools/allocate_id.py --check
      KN-LIT-<token>`, and only then use it) and confirm no existing
      KN-LIT entry already covers RFC 9106 before filing (grep
      `knowledge/literature/` and `knowledge/INDEX.md` for "9106"/"Argon2"
      first -- if one already exists, supersede or cross-reference it
      rather than filing a duplicate).
    - >-
      confidence: established is appropriate ONLY if the full primary text
      is actually read and its claims relayed accurately; do not mark it
      established from a partial fetch. citation_verified: true requires
      the identifiers field to carry the resolved RFC number/URL actually
      used.
    - >-
      Do not use this filing to assert, deprecate, or recommend anything
      about any Argon2 parameter set -- this task files a primary source,
      it does not interpret it toward a security claim.
    - >-
      No real password, credential, leaked corpus, or third-party dataset
      enters this goal at any stage.
    - >-
      Write scope limited to knowledge/literature/KN-LIT-<new-token>.md and
      this task's own receipt under
      coordination/goals/GOAL-ARGON-001/batches/BATCH-614f1d/tasks/TASK-20260812-273630/.
      Do not edit knowledge/INDEX.md directly (generated, gitignored,
      rebuilt by the Coordinator's curation tooling) and do not edit any
      ledger/proposals/ or ledger/goals/ record -- filing the KN-LIT entry
      is this task's only content deliverable; folding RFC 9106 citations
      into GOAL-ARGON-001's records or any proposal is a separate,
      Coordinator-only follow-up task.
    - Do not commit; archival is a separate Coordinator step.

  deliverables:
    - >-
      A new knowledge/literature/KN-LIT-<token>.md entry for RFC 9106,
      following the knowledge/README.md entry format, with identifiers
      (RFC number, rfc-editor.org and/or datatracker.ietf.org URL) filled
      in, confidence: established, citation_verified: true, and a body
      summarizing RFC 9106's Argon2 specification (indexing functions,
      recommended parameter table, Argon2i/Argon2d/Argon2id split) at a
      level of detail sufficient for a future session to upgrade
      TASK-20260809-4e04eb's proposal.md Sec.3 claims C1-C7 from RECALLED to
      READ.
    - >-
      A task receipt under
      coordination/goals/GOAL-ARGON-001/batches/BATCH-614f1d/tasks/TASK-20260812-273630/
      recording the exact fetch command used, its result, and the new
      KN-LIT identifier minted.

  artifact_paths:
    - knowledge/literature/KN-LIT-PLACEHOLDER.md
    - coordination/goals/GOAL-ARGON-001/batches/BATCH-614f1d/tasks/TASK-20260812-273630/receipt.yaml
  artifact_paths_note: >-
    KN-LIT-PLACEHOLDER.md is a placeholder: the real filename depends on the
    token the executing Executor mints per the constraints above. The
    Executor's receipt must record the actual path used.

  archived_by: null
  archived_by_note: >-
    To be assigned by the Coordinator when this task is dispatched; a
    snapshot-then-ledger archive is required before the KN-LIT filing is
    official (AGENTS.md "Durable research commits").

  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: true
    fallback_note: >-
      Policy aliases resolve to the one session model under this Claude
      Code harness (CLAUDE.md "Model policy note"); not silently
      substituted.
    degraded_allowed: false
    independent_session_required: false

  budget:
    wall_clock_seconds: 300
    memory_gb: 1
    maximum_runs: 1

  completion_gate:
    - RFC 9106 primary text obtained via a raw HTTP fetch route with the exact command and result recorded.
    - A new KN-LIT-* entry filed, citation_verified: true, identifiers filled in, no duplicate of an existing entry.
    - No security verdict, recommendation, or deprecation of any Argon2 parameter set anywhere in the filed entry.
    - No write outside the declared write_scope.

  return_format: task receipt YAML plus the filed KN-LIT entry's path and ID.
