handoff:
  id: TASK-20260810-9e7f4c
  from: coordinator
  to: coordinator
  to_rationale: >-
    Coordinator, because every deliverable is a read-and-reconcile judgement over
    committed ledger records and archive receipts, and because only the Coordinator
    may edit a shared goal ledger or change official research state (AGENTS.md
    "Dynamic dispatch"). NO EXECUTOR IS APPROPRIATE: this task authorizes no
    implementation, no run, and no compute. NO VALIDATOR OR RED TEAM IS APPROPRIATE
    EITHER: there is no producer artifact to review, because nothing is produced.
  authorized_by: DEC-20260810-2f92d8
  goal_id: GOAL-PATH-001
  batch_id: BATCH-002

  drafting_note_not_a_supersession: >-
    D4 WAS AMENDED BEFORE THIS RECORD WAS EVER COMMITTED, and the distinction matters
    under AGENTS.md rule 4. The first draft asked the reconciliation task to compute
    the DEC-20260731-014 hash comparison as an open question, because the authoring
    session had no shell. The dispatching session then ran the check and the git
    history, and D4 was rewritten to consume those results as inputs and to carry the
    GOAL-AES-001 surfacing obligation that DEC-20260810-2f92d8 CD-1 required_handling
    adds. NOTHING IMMUTABLE IS REWRITTEN: this file had not been archived, so what
    follows is this record's FIRST COMMITTED STATE, not a supersession of a published
    one. Recorded here rather than left silent so that a reader comparing this handoff
    against CD-1's history can see why the two agree. No other field was changed by
    that amendment, and every boundary below stands exactly as first written -
    maximum_runs 0, no DREG batch opened, no measurement authorized, no cross-lane
    edit, and non-null wall-clock and memory budgets required of any later DREG
    measurement handoff.

  objective: >-
    Determine, from committed records only, whether GOAL-DREG-001's on-lattice ladder
    under the admitted CTRL-B instrument can be advanced to a decision-grade increment
    within its remaining committed budget - and produce the reconciliation that must
    precede any such batch.

    EXPLICIT PRECONDITION, AND THE FIRST DELIVERABLE: RECONCILE GOAL-DREG-001'S HEAD
    AGAINST ITS COMMITTED BATCH-004 AND BATCH-005 DIRECTORIES BEFORE ANY NEW DREG
    BATCH IS OPENED. The head (ledger/goals/GOAL-DREG-001.yaml) carries
    current_batch_id BATCH-003, updated_at 2026-07-27, a checkpoints list ending at
    BATCH-003, and a next_action that still directs the reader to "open BATCH-004
    CTRL-B" and to keep the raw 17947 headline QUARANTINED. Committed state has moved
    past that: coordination/goals/GOAL-DREG-001/batches/BATCH-004 and BATCH-005 exist
    with ledger receipts declaring EV-DREG-007 / DEC-20260725-026 and EV-DREG-008
    respectively. THE CONTENTS OF THOSE DIRECTORIES WERE NOT VERIFIED BY THE SESSION
    THAT AUTHORED THIS HANDOFF beyond opening the two ledger receipt files and reading
    the three ledger records they name; no run artifact, dispatch queue, or review
    report in either batch was read, and no commit, parent, or hash was resolved
    (no shell was available). A session resuming GOAL-DREG-001 from its head alone
    would re-commission work that is already archived, which is the concrete hazard
    this precondition exists to prevent.

    SECOND PRECONDITION, EQUALLY BLOCKING: diagnose defect CD-1 of DEC-20260810-2f92d8.
    GOAL-PATH-001's superseded next_action and DEC-20260802-505759 both attribute the
    DREG CTRL-B cell PASS to DEC-20260731-014, whose committed content at
    ledger/decisions/DEC-20260731-014.yaml is a GOAL-ECDLP-001 BATCH-021 decision about
    EXP-DS-001 residual control-theater repair, with no DREG content at all. The
    measurement itself is on record in EV-DREG-008; only the decision-ID citation is
    defective. Establish what the correct citation is, and specify - do not perform -
    the superseding record needed.

  uncertainty_reduced: >-
    Whether GOAL-PATH-001's selected direction (expand the DREG ladder under CTRL-B)
    is executable at all within GOAL-DREG-001's committed campaign budget, and what
    the true committed ladder state is. Both are currently unknown because the goal's
    mutable head disagrees with its own archives.

  inputs:
  - ledger/decisions/DEC-20260810-2f92d8.yaml
  - ledger/goals/GOAL-PATH-001.yaml
  - ledger/goals/GOAL-DREG-001.yaml
  - ledger/evidence/EV-DREG-006.yaml
  - ledger/evidence/EV-DREG-007.yaml
  - ledger/evidence/EV-DREG-008.yaml
  - ledger/decisions/DEC-20260725-023.yaml
  - ledger/decisions/DEC-20260725-026.yaml
  - ledger/decisions/DEC-20260731-014.yaml
  - ledger/decisions/DEC-20260805-cc2b32.yaml
  - coordination/goals/GOAL-DREG-001/batches/BATCH-004/
  - coordination/goals/GOAL-DREG-001/batches/BATCH-005/

  constraints:
  - >-
    ZERO RUNS. No experiment is approved, no protocol is frozen or amended, no solver
    or rank computation is invoked, and no compute is spent. maximum_runs is 0 and it
    is the binding bound on this task.
  - >-
    NO GOAL RECORD MAY BE EDITED BY THIS TASK - not GOAL-DREG-001, not GOAL-PATH-001,
    not any other. The deliverable is a report plus a PROPOSAL for the edits a later
    Coordinator ledger archive would make. Reconciling a head is itself a state
    transition and needs its own committed decision.
  - >-
    NO IDENTIFIER MAY BE MINTED BY READING STATE. Any new ID this task recommends must
    be allocated with python3 tools/allocate_id.py --next <type> and confirmed with
    --check by the session that actually writes the record (AGENTS.md rule 14).
  - >-
    DEC-20260731-014 MUST NOT BE RENAMED, EDITED, OR REMAPPED. It is named in the
    binding fields (record_ids and artifact_sha256) of the completed BATCH-005 ledger
    receipt at
    coordination/goals/GOAL-DREG-001/batches/BATCH-005/archives/TASK-20260731-027/ledger-receipt.json,
    so AGENTS.md rule 15 forbids a remap. The repair is a superseding record under a
    new identifier, authored by the DREG lane owner. This task SPECIFIES that record;
    it does not write it.
  - >-
    ASSERT NO MATHEMATICAL RESULT. No d_reg, deficit, rank, gap(n), exponent, or ECDLP
    statement may be made, strengthened, or weakened. No hypothesis status changes; in
    particular H-DREG-001 and H-SIG-001 are untouched. Claim ceiling stays toy.
  - >-
    A TIMEOUT, CRASH, MISSING FILE, UNRESOLVABLE COMMIT, OR HASH MISMATCH ENCOUNTERED
    WHILE RECONCILING IS AN INTEGRITY OR INFRASTRUCTURE FINDING, NEVER EVIDENCE ABOUT
    d_reg (AGENTS.md rule 5). Report it as such, with the exact path and the exact
    check that failed.
  - >-
    MISSING DATA STAYS MISSING. If a batch's artifacts do not establish whether it
    executed, say so and name what would settle it. Do not infer execution from a
    directory's existence, and do not estimate, reconstruct, or interpolate any number.
  - >-
    Before writing anything, fetch origin/main and merge it into the working branch -
    merge, never rebase - and record the base commit checked and the merge outcome in
    the task receipt. GOAL-DREG-001 has a recorded history of concurrent co-drivers
    (its notes field), so its head may have moved again.

  deliverables:
  - >-
    D1 RECONCILED LADDER STATE. For each of BATCH-004 and BATCH-005: what the
    committed artifacts establish was done, which ledger records were archived, and
    whether the batch's own receipt records a verification. Then the reconciled
    picture of the on-lattice ladder against GOAL-DREG-001's completion criterion
    (n in {12,15,18}, at least 3 seeds, semi-regular null control, D up to d_reg where
    reachable): which rungs and seeds are ADMITTED, which are OPEN, and which are
    recorded as infra-limited rather than measured. Cite a record ID or an exact path
    for every cell of that table; leave a cell explicitly UNKNOWN rather than filling
    it.
  - >-
    D2 BUDGET DETERMINATION. GOAL-DREG-001's campaign_budget.maximum_batches is 6 and
    committed records name BATCH-001 through BATCH-005, so at most one batch remains.
    State whether that one batch can carry a decision-grade increment toward the
    completion criterion, with the reasoning shown. If it cannot, say so plainly and
    give the two alternatives explicitly: a scoped criterion amendment, or a budget
    request. DO NOT INVENT A WALL-CLOCK OR MEMORY NUMBER; if a defensible estimate
    cannot be derived from a committed record, report it as underdetermined and name
    the measurement that would fix it.
  - >-
    D3 INSTRUMENT-HAZARD READING. GOAL-DREG-001's execution_status.infra_note records
    the un-chunked DREG_dff.sage first-fall instrument as host-unsafe at D6, with the
    n=18 rung infra-limited rather than measured, and the chunked block-m4ri D6 cells
    completing at about 7 GB peak RSS. Say what that implies for an n=15 or n=18 rung
    under the chunked instrument. DEC-20260805-cc2b32 B4's roughly 28.9 GB against a
    24 GB cap projection is about EXP-SDEG-f7faa8's Stage 2 and MUST NOT be quoted as
    a DREG ladder cost; cite it only as a caution about this instrument family.
  - >-
    D4 CD-1 DIAGNOSIS AND SUPERSESSION SPEC. Establish which record actually carries
    the GOAL-DREG-001 BATCH-005 CTRL-B disposition, whether any committed decision
    dispositions EV-DREG-008 under a different identifier, and what the superseding
    record must say.
    THE HASH QUESTION IS ALREADY SETTLED AND IS AN INPUT, NOT A DELIVERABLE. The
    on-disk ledger/decisions/DEC-20260731-014.yaml hashes to
    20f9353438399a7cf959c9742d2527600e166e54af3aafb3c28b93630cc5c253; the BATCH-005
    receipt declares 6093f111f4b1f7eef4c5da8e067a9f8e8cb14984c1885cbdff88414ba1a0a81b
    for that same path; THE TWO DIFFER. Verified by the dispatching session running
    `shasum -a 256 ledger/decisions/DEC-20260731-014.yaml`, NOT by the session that
    authored this handoff, which had no shell. D4 CONSUMES THIS RESULT AND DOES NOT
    RE-DERIVE IT. Re-running the one-line shasum as a cheap CONFIRMATION OF A KNOWN
    RESULT is permitted and welcome; if it is run, report it as confirmation and report
    any disagreement with the value above as an integrity finding. IT IS NOT AN OPEN
    QUESTION, and no deliverable may be written as though the answer were unknown.
    ALSO SETTLED AND SUPPLIED AS INPUT: `git log --oneline --follow --
    ledger/decisions/DEC-20260731-014.yaml`, run by the dispatching session, shows the
    identifier minted in at least three independent lanes - 98fa35db1 (GOAL-ECDLP-001
    BATCH-021, the content now at the path), a421f72bb ("ledger: close GOAL-AES-001
    BATCH-003 — EV-AES-003, DEC-20260731-014 (revise)"), and 3b342d3c5 (a merge) -
    while the BATCH-005 receipt expects a fourth content hash matched by none of them.
    SURFACING OBLIGATION, MATCHING DEC-20260810-2f92d8 CD-1 required_handling: D4 MUST
    SURFACE that a421f72bb shows a THIRD LANE, GOAL-AES-001, holding the same
    identifier, and that the GOAL-AES-001 lane owner NEEDS NOTIFYING. IT SURFACES THIS
    AND NOTHING MORE: this task does not notify anyone, does not author or perform a
    supersession, does not decide which lane owns the identifier, does not call any of
    the three decisions invalid, and edits nothing outside its write_scope. The
    supersession spec it produces is a PROPOSAL for the lane owner, exactly as this
    task's scope was set - diagnose and propose. THE SCOPE IS NOT WIDENED BY THE
    THREE-LANE FINDING.
  - >-
    D5 PROPOSED EDITS, AS A PROPOSAL ONLY. The exact GOAL-DREG-001 head edits a later
    Coordinator ledger archive should make (checkpoint appends for BATCH-004 and
    BATCH-005, current_batch_id, updated_at, and a superseded-next_action field
    preserving the old text verbatim rather than deleting it), written out but NOT
    APPLIED, plus the exact GOAL-PATH-001 next action that should follow.
  - >-
    D6 RECOMMENDATION. Exactly one of: OPEN a bounded DREG batch (with the concrete
    cells, seeds, and the non-null wall-clock and memory budgets it would require);
    AMEND the completion criterion to what the remaining budget can reach; or REQUEST
    a budget grant with the specific increment it buys. State the recommendation's
    weakest supporting link.

  artifact_paths:
  - coordination/goals/GOAL-PATH-001/batches/BATCH-002/tasks/TASK-20260810-9e7f4c/reconciliation_report.md
  - coordination/goals/GOAL-PATH-001/batches/BATCH-002/tasks/TASK-20260810-9e7f4c/ladder_state.yaml
  write_scope:
  - coordination/goals/GOAL-PATH-001/batches/BATCH-002/tasks/TASK-20260810-9e7f4c/
  write_scope_note: >-
    Non-overlapping and PATH-owned by construction. This task writes NOTHING under
    coordination/goals/GOAL-DREG-001/, nothing under experiments/, and nothing under
    ledger/, so it cannot collide with a concurrent DREG co-driver.

  archived_by: null
  archived_by_note: >-
    DELIBERATELY NULL, NOT AN OMISSION. Exactly one snapshot archival task must own
    this task's artifacts, and its TASK-* identifier could not be minted by the
    authoring session: IDs must come from python3 tools/allocate_id.py --next handoff
    and no shell was available. THE DISPATCHING SESSION MUST ALLOCATE THAT ARCHIVAL
    TASK AND SET THIS FIELD BEFORE DISPATCH. A task whose archive receipt is never
    written cannot reach completed and must be closed invalid instead.

  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: true
    fallback_reason_if_used: >-
      Record the resolved model with fallback_used true and its reason if the harness
      cannot resolve the canonical policy alias. Never substitute silently
      (AGENTS.md rule 11).
    degraded_allowed: false
    independent_session_required: false
    independent_session_note: >-
      false because this task produces no claim requiring adversarial review: it reads
      committed records and returns a reconciliation. If D6 recommends OPEN, the
      resulting measurement batch DOES require independent Validator and Red Team
      review, and that requirement is inherited by that batch, not waived here.

  budget:
    wall_clock_seconds: null
    memory_gb: null
    maximum_runs: 0
  budget_note: >-
    maximum_runs 0 IS THE BINDING BOUND: this task authorizes no execution, so there
    is no run to bound in time or memory. wall_clock_seconds and memory_gb are null
    BECAUSE NO COMMITTED RECORD FIXES A BUDGET FOR A COORDINATOR LEDGER-READ TASK, and
    inventing one would be a fabricated number under AGENTS.md rule 9.
    GOAL-PATH-001's campaign_budget.total_wall_clock_seconds of 86400 is a CAMPAIGN
    cap, not a task allocation, and is not repurposed here. THIS TOLERANCE DOES NOT
    TRANSFER: any successor handoff that authorizes a DREG measurement MUST carry
    non-null wall_clock_seconds and memory_gb, derived from a committed cell cost, and
    a Coordinator must reject it otherwise (DEC-20260810-2f92d8 limitations).

  completion_gate:
  - >-
    D1 through D6 all present, with a record ID or exact path cited for every factual
    claim, and every unestablished cell marked UNKNOWN rather than filled.
  - >-
    The report states, in its own words, that GOAL-DREG-001's head was NOT edited and
    that no run was executed.
  - >-
    No mathematical claim, no hypothesis status change, no claim-tier movement, and no
    goal status change appears anywhere in the deliverables.
  - >-
    The base commit fetched from origin/main and the merge outcome are recorded in the
    task receipt.
  - >-
    Artifacts exist only under the declared write_scope, and are committed by a
    Coordinator snapshot archival task run alone, whose receipt the post-commit
    verifier accepts. UNTIL THAT VERIFICATION PASSES THE RESULT IS NOT DURABLE AND NO
    DREG BATCH MAY BE OPENED ON IT.

  return_format: >-
    A markdown reconciliation report plus a machine-readable ladder_state.yaml at the
    declared paths, and a short summary naming: the reconciled ladder state, the
    budget determination, the CD-1 diagnosis, and the single D6 recommendation with
    its weakest link. If the reconciliation cannot discriminate between explanations -
    for example if the BATCH-005 artifacts cannot establish whether the archive was
    verified - SAY INCONCLUSIVE PLAINLY and name what would settle it.
