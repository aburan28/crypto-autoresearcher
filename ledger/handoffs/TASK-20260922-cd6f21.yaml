# =============================================================================
# TASK-20260922-cd6f21 -- Executor: implement and measure EXP-FROB-30006a.
#
# SUPERSEDES TASK-20260920-66a30e, which is COMMITTED AND MERGED (14ef07b83,
# 2026-09-20) and is therefore NOT EDITED. That card cannot be dispatched:
# `tools/research_dispatch.py` refuses it with "artifact_paths must be an exact
# safe repository-relative file path", because its artifact_paths and its
# write_scope are the SAME list and two of the four entries are directories.
#
# THE DEFECT IS A CONFLATION, NOT A TYPO. research_dispatch.py:211-216
# (validate_scope) strips a trailing slash and ALLOWS it; :219-227
# (validate_artifact_path) does not. The two fields answer different questions --
# write_scope is a permission boundary and may be a directory, artifact_paths is
# the completion-checkable declared set and must be exact files -- and the merged
# card gave one answer to both. Across every queue in this repository 15876
# entries conform and 5 do not; two of the five are that card.
#
# CONSEQUENCE, STATED PLAINLY: GOAL-FROB-6333a9 HAS NEVER HAD A DISPATCHABLE
# EXECUTOR CARD. Its two days with a null queue were not only a missing queue.
#
# WHAT THIS CARD CHANGES: seven things, enumerated under `supersedes`. NOT ONE OF
# THEM IS A SCIENTIFIC PARAMETER. No cell, curve, dimension, seed, control,
# certificate requirement, invalidation rule, stopping rule, budget number or
# threshold differs from the merged card. A superseding executor card that
# quietly moved a parameter would be a protocol change wearing a clerical
# disguise, and this one is checkable against its predecessor line by line.
# =============================================================================
