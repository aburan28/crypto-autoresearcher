  artifact_paths_basis: >-
    THREE EXACT FILES, AND THE SELECTION IS A PROTOCOL JUDGEMENT RATHER THAN A
    CLERICAL ONE. `artifact_paths` is the completion-checkable declared set and
    must be nameable BEFORE the work, so it can contain only paths the protocol
    fixes in advance. A RUN-ID does not exist until the runner mints it, so
    `runs/<RUN-ID>/manifest.yaml` is unnameable here AND MUST NOT BE GUESSED --
    inventing a run identifier is a fabrication under AGENTS.md rule 5. The same
    is true of the module names under implementation/, which are the executor's
    choice.

    So the per-run package and the instrument sources are declared where they can
    be bound honestly: as SOURCES of the snapshot archive TASK-20260922-98729f,
    hashed into its path_sha256 AT ARCHIVE TIME, when they exist and their names
    are facts. That is the identical separation TASK-20260922-98729f already
    uses for its own receipt, and it is what makes `git diff --name-only`
    checkable against a declared list at each stage.

    RESULTS.json IS THE PIECE THAT MAKES THIS WORK. Without it, "which runs
    exist" is answerable only by listing a directory, and a directory listing
    cannot distinguish a cell that refuted from a cell that was never attempted.
    With it, the unnameable set becomes enumerable from a nameable file.

  results_json_schema:
    note: >-
      Specified here because EX-10 makes it a deliverable and an unspecified
      required artifact is an argument waiting to happen. Field names are
      binding; extra fields are permitted.
    top_level:
      experiment_id: EXP-FROB-30006a
      amendment_ids: [AMD-EXP-FROB-30006a-20260922-nullcontrol]
      task_id: TASK-20260922-cd6f21
      regression_gate: >-
        {passed: bool, reference: <ICPERF/Trimoska row cited>, conflicts: int,
        reference_conflicts: int, ratio: float} -- C-REG, within 2x.
      cells: >-
        One entry per PLANNED cell from trial-plan.json, present whether or not
        it ran.
      per_mode_summary: >-
        One entry per search_mode in {wdsat_default, wdsat_xg_ext}, each carrying
        r_s (median), r_r (median), r_s_over_r_r (per-replicate list and
        median), and verdict in {basis_blind, pruning, null_loose, inconclusive}.
      mode_agreement: >-
        {agree: bool, verdicts: {<mode>: <verdict>}, resolved: false}. `resolved`
        is ALWAYS false: a mode disagreement is reported as `inconclusive` and is
        never resolved by choosing a mode, averaging, or taking the lower count
        (A-1).
      impediments: >-
        List; each {what, clears_when, recheck}. The n = 43 capacity gate firing
        goes here, never into a verdict.
    per_cell:
      cell_id: stable string from trial-plan.json
      n: int
      m: int
      l: int
      V_kind: stable | random
      irreducible_factor: identifier of the factor, or null at m = 2 random
      target_seed: int
      search_mode: wdsat_default | wdsat_xg_ext
      run_id: >-
        the RUN-ID that served this cell, or null WITH `not_run_reason` -- never
        both null and unexplained
      not_run_reason: null | resource_exhaustion | instrument_failure | capacity_gate
      wdsat_conflicts: int or null
      null_value: exact rational or integer for 2^{ml}/m! at this cell
      conflict_ratio: float or null
      unsat_certificate_status: certified | uncertified | not_applicable
      max_id_anf_match: bool
      build_id: >-
        identifies the WDSat binary used; two modes sharing one build record the
        same value, and two builds record different ones (EX-7)
    invariants:
      - >-
        A cell with `unsat_certificate_status` other than `certified` MUST NOT
        contribute to any r_s, r_r or verdict. Scoring conflicts without an
        independent certificate is a declared invalidation rule of the frozen
        contract.
      - >-
        A cell with `max_id_anf_match: false` is INVALID and is reported as
        invalid, not dropped (C-SIZE).
      - >-
        No verdict field may be written for a mode whose cells are incomplete.
        Write the measured values and `inconclusive`.

  write_scope:
    - experiments/EXP-FROB-30006a/implementation.md
    - experiments/EXP-FROB-30006a/implementation/
    - experiments/EXP-FROB-30006a/runs/
    - experiments/EXP-FROB-30006a/trial-plan.json
    - experiments/EXP-FROB-30006a/RESULTS.json
  write_scope_note: >-
    THE MERGED CARD'S FOUR ENTRIES PLUS RESULTS.json, AND THE TWO DIRECTORIES ARE
    DELIBERATELY RETAINED. `research_dispatch.py` validate_scope (lines 211-216)
    strips a trailing slash and accepts a directory; validate_artifact_path
    (lines 219-227) does not. The two fields answer different questions and the
    merged card gave one answer to both. A producer's permission boundary MUST be
    a directory -- it creates files whose names it chooses -- while its
    completion-checkable set must be exact. Narrowing write_scope to exact files
    here would make the card unexecutable rather than more rigorous.

