      text: >-
        REPORT ON J1, J2 AND J3 ONLY. You cannot see J4-J8 by construction. A
        whole-claim verdict from you would be an opinion formed from a fraction
        of the evidence. The Coordinator composes the round.
    - id: RV-6
      text: >-
        AN INSTRUMENT DEFECT IS NOT A MATHEMATICAL RESULT. If J1 or J2 breaks,
        that is a statement about the measurement. It is never evidence for or
        against H-CERTBIN-a73f1c, TS1 or P-GPU (INV-8). Say so in terms.
    - id: RV-7
      text: >-
        ZERO TRIALS. Verification computations are permitted:
        - the J1 constructions, on at most 20 archived instances;
        - the J3 aggregation;
        - the J2 checks.
        They run under your write scope, get no RUN-id and are declared
        command by command in the report. You re-run no phase of the driver.
    - id: RV-8
      text: >-
        CITE WITH PROVENANCE. A file you opened is `internal`. A source you
        recall but did not open is `recalled`, and it is a pointer, never
        support.
    - id: RV-9
      text: >-
        DISCLOSED PRIOR (review-plan PD-R1). The Coordinator's review prior was
        written after it had read the run's results, so concurrence with it
        is weaker evidence than it looks. Attack the joints on their merits.
        Do not compensate in either direction.

