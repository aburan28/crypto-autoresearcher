    TASK-20260817-6f610c in
    coordination/goals/GOAL-HQC-001/batches/BATCH-91929e/dispatch_queue.json.
    This is the durable ledger-side copy required by agents/coordinator.md.
  objective: >-
    Independently validate, by recomputation from the frozen snapshot bytes and
    from data your own driver generates, that the four fresh 2x2 cells are real
    properties of the estimator rather than artifacts of the discard-prefix
    driver or the window slicing; that Arm A's direct and Arm B's adapted
    disjointness proofs actually hold and are correctly characterized in
    strength; that the F[:, 0:n_e-1] invariant passes on all eight (shard,
    window) combinations; and that the null-object control genuinely returns its
    three forced values (log2 A_k = 0, paired diff = 0, alpha = 0.5) rather than
    being constructed so that it cannot do otherwise.
  uncertainty_reduced: >-
    Whether the confound-breaking measurement is admissible at all --
    specifically, whether START_INDEX=30000 really clears every previously
    consumed index on both shards, whether the four windows are genuinely
    pairwise disjoint and sliced from a single call per (shard, variant),
    whether the one-call-versus-two-call procedural difference from the
    historical cells changes any number, and whether the null-object control's
    forced values are forced by the mathematics or merely by the way the control
    was coded.
  inputs:
  - coordination/goals/GOAL-HQC-001/batches/BATCH-91929e/tasks/TASK-20260817-c603c0/ -- all twelve
    artifacts, at the TASK-20260817-f24a5e snapshot commit.
  - coordination/goals/GOAL-HQC-001/batches/BATCH-91929e/batch.yaml -- including the FROZEN
    pre-registered reading rule, so you can judge whether the delivered numbers are the ones the
    rule needs; you do not apply the rule.
  - coordination/goals/GOAL-HQC-001/batches/BATCH-412513/tasks/TASK-20260809-a79e4f/matched_pair_results.json
    -- stage_1's committed per_trial_S for shard 5000 (Arm A's direct comparator) and stage_2's
    committed derived statistics for shard 8002 (Arm B's comparator).
  - coordination/goals/GOAL-HQC-001/batches/BATCH-174014/tasks/TASK-20260815-e61cca/ and
    coordination/goals/GOAL-HQC-001/batches/BATCH-0e126d/tasks/TASK-20260814-8bbdd2/ -- the two
    prior tasks whose consumed trial ranges determine whether START_INDEX=30000 is genuinely fresh.
  - ledger/evidence/EV-HQC-927899.yaml and ledger/evidence/EV-HQC-469c08.yaml -- the four
    historical cells this task cites and partially replicates.
  - ledger/decisions/DEC-20260815-176614.yaml -- the authorizing decision, including next_actions
    item (2)'s required residual-risk correction.
  constraints:
  - Independent session. Do not continue the producing agent's session.
  - RECOMPUTE, DO NOT TRUST. Every reported figure you admit must be recomputed from bytes at the
    snapshot commit or from data your own driver generated. Producer summaries are not evidence of
    themselves.
  - Independently re-derive the consumed high-water index on each shard from the COMMITTED records
    of TASK-20260809-a79e4f, TASK-20260814-8bbdd2 and TASK-20260815-e61cca, and state whether
    START_INDEX=30000 genuinely clears it on BOTH shards. If it does not, that is a disqualifying
    finding.
  - Independently confirm, by reading cross_regime_arms.py itself, that each shard's four windows
    come from EXACTLY ONE _t_shard call at n_trials=75000 per (shard, variant), that the windows
    are pairwise disjoint, and that no window overlaps the discarded prefix.
  - Independently reproduce Arm A's direct bit-identity check - generate your own shard 5000 prefix
    and compare it against TASK-20260809-a79e4f stage_1's committed per_trial_S yourself, rather
    than confirming the executor's comparison.
  - Independently reproduce Arm B's adapted two-step proof - run your own dedicated n_trials=10000
    verification call per (8002, variant), confirm it reproduces the committed stage_2 derived
    values (state your tolerance and why), and confirm the executor's analysis-call prefix matches
    YOUR freshly generated data, not merely the executor's.
  - Independently recompute at least one of the four fresh local exponents end to end from raw
    per-trial data your own driver wrote, and recompute all four from the executor's committed
    per-window se_paired values, at k=17 and at least three other k.
  - ATTACK THE NULL OBJECT AS A CONSTRUCTION, NOT ONLY AS A COMPUTATION. Determine whether
    log2 A_k = 0, paired diff = 0 and alpha = 0.5 are forced by the independent-block i.i.d. law as
    claimed, or whether some coding choice forces them regardless of input. Verify the sensitivity
    leg actually perturbs what it claims to perturb, and render an explicit judgment on whether the
    control is blind. A control that cannot fail is not a control - this campaign has four recorded
    instances.
  - Independently recompute the null band from noc_replicate_summary.csv and confirm the reported
    percentiles, and independently check the forced identity alpha_planted = alpha_unmodified -
    log2(rho_g) for at least one g.
  - Confirm p was calibrated once, before any ladder replicate, recorded in design.md, and held
    fixed for every rung, replicate, arm and the sensitivity leg - not retuned after seeing a
    rung's evaluable_k coverage. Confirm design.md demonstrably predates both results JSON files
    and that the cost-projection reduction protocol was applied as written rather than improvised.
  - Assess the one-call-versus-two-call procedural difference from the historical cells, confirm
    the executor's batch-structure check, and state whether the difference could move any reported
    number.
  - Confirm all twelve declared artifact paths exist at the snapshot commit, that no undeclared
    file was written into the task directory, and that the snapshot receipt's path_sha256 matches
    the bytes you read. Confirm the reported spend is measured, split by Part, and consistent with
    the run's own timings.
  - Render the required, non-optional judgment - is the fresh 2x2 factorial an ADMISSIBLE
    measurement of the (shard x regime) contrast, and is the null-object control an ADMISSIBLE
    calibration of the 2-point local-exponent diagnostic? Answer each separately and plainly.
  - Answer every must-check item explicitly, INCLUDING the ones that pass. Change no record status,
    edit no producer artifact, do not apply batch.yaml's reading rule, and state a verdict of ADMIT
    or DO-NOT-ADMIT plainly.
  - Write only under your own review directory. Do not read or modify the concurrent Red Team task
    directory (TASK-20260817-94c89e) and do not confer with it.
