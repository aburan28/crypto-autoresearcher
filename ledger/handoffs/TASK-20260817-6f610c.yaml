  completion_gate:
  - Every must_check item V1-V14 is answered explicitly, including the ones that pass.
  - START_INDEX=30000 is independently confirmed or refuted as genuinely fresh on both shards.
  - Both disjointness proofs and the F-invariant are independently reproduced from the reviewer's
    own freshly generated data, not accepted from the executor's report.
  - At least one fresh local exponent is recomputed end to end from raw data the reviewer's own
    driver wrote, and all four from committed per-window values at k=17 and at least three other k.
  - An explicit, separate judgment is rendered on whether the null-object control is a genuine
    calibration or a construction that cannot fail.
  - A verdict of ADMIT or DO-NOT-ADMIT is stated plainly, with separate admissibility findings for
    the 2x2 factorial and for the null-object control.
