handoff:
  id: TASK-20260802-010
  from: coordinator
  to: red-team
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-028
  role: red-team
  objective: >-
    Try to falsify the interpretation, the scope and the uncertified-class
    declaration of whatever the control shows - IN BOTH DIRECTIONS. If VR comes
    out near 1, attack the conclusion that the yardstick is sound. If VR comes
    out large, attack the conclusion that it is broken. Name the strongest
    alternative explanation for the observed between-instance dispersion that is
    not the one RR-IVR-1 will license.
  uncertainty_reduced: >-
    Whether the reading RR-IVR-1 is about to license survives an adversary who
    wants it to be wrong.
  inputs:
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-ivr/
  - experiments/EXP-LPF-001/results/ivr/
  - experiments/EXP-LPF-001/results/calib/
  - experiments/EXP-LPF-001/control_ivr/
  - ledger/evidence/EV-LPF-001.yaml
  - ledger/decisions/DEC-20260801-014.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-027/reviews/TASK-20260801-082/red_team_report.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/archives/TASK-20260802-008/snapshot_commit_receipt.json
  constraints:
  - 'INDEPENDENT SESSION. You did not author, freeze or execute any artifact under review, you did not serve TASK-20260802-005, and you do not read TASK-20260802-009 report.'
  - 'ATTACK IN BOTH DIRECTIONS AND STATE THE COUNTERFACTUAL. A red team that only attacks one outcome is an asymmetric instrument. State explicitly what you would have said had VR come out the other way, at the same length.'
  - >-
    ATTACK THE HEADLINE INFERENCE HARDEST OF ALL - THAT A VARIANCE RATIO SAYS
    ANYTHING ABOUT HEUR-DS-1. It does not, in either direction, and the claim
    ceiling forbids it. Hunt for any sentence in the package that slides from a
    statement about the yardstick to a statement about the intermediates.
  - >-
    ATTACK THE NORMAL APPROXIMATION UNDERLYING THE CHI-SQUARE INTERVALS. p_hat
    across instances is not guaranteed normal; at u = 5 the smooth counts are
    small (of order 196 and 117 at the two cells on the archived measure arm) and
    skew may be material. SAY WHETHER THE INTERVALS ARE TRUSTWORTHY RUNG BY RUNG
    and whether a distribution-free interval would move any declaration.
  - >-
    ATTACK THE INDEPENDENCE APPROXIMATION IN THE BOTH-CELLS RULE. The 20 fresh
    instances at bits 16 and at bits 20 come from the SAME 20 master seeds, so a
    seed-level effect would correlate the cells and the declared both-cells
    false-declaration rate of 0.0025 would be optimistic. Recompute the per-seed
    residual correlation from the archived arrays and say how much the declared
    multiplicity arithmetic is off.
  - >-
    ATTACK W3 FROM BOTH SIDES. A clean free rider with a large VR, and a dirty
    free rider with a VR near 1, are both coherent outcomes; say what each would
    mean and refuse to let either be reported as a contradiction or as
    corroboration of the other.
  - >-
    CARRY RT049-B6 SHARPENED AND MAKE IT BITE ON PRE-Q-1 ANSWER. If p is fixed
    by bits then all 20 instances share ONE small-x window and the free rider is
    a one-base measurement; say so in terms. If p varies, say what that buys and
    what it does not.
  - >-
    CHECK THE UNCERTIFIED-CLASS DECLARATION FOR COMPLETENESS AND FOR SOFTENED
    WORDING. W1 through W5 plus V1 through V12 as restated by RR-LPF-2,
    ABS-REL-LPF-1 and LIMBB-DECL-RR066 must travel with any distributional
    statement. A RESULT STATED WITHOUT ITS UNCERTIFIED LIST IS AN OVERCLAIM BY
    OMISSION, and that is the specific failure you are hunting. Propose W6 if you
    find a class the five do not cover.
  - 'ATTACK THE SCOPE. Two toy cells at 16 and 20 bits, one encoding, one factor-base rule, 20 instances from one generator. Name every step of any argument that would carry this upward or sideways and say where it fails. NOTHING HERE TRANSFERS TO CRYPTOGRAPHIC SCALE.'
  - 'APPLY THE CONTROLS-BEFORE-BELIEF TEST of docs/inventor-protocol.md section 3 - ask what the measured dispersion SHOULD do as the parameter meant to destroy it changes, and say whether it does. State whether this control is itself controlled, and by what.'
  - >-
    STATE WHETHER THE PACKAGE CAN BEAR A SUPERSEDING NOTE AGAINST THE EV-LPF-001
    DETECTION-FLOOR TABLE, and if so exactly which entries and by exactly what
    factor with what interval. IT MAY NOT BEAR A RE-ADJUDICATION OF BATCH-027
    AND YOU MUST SAY SO.
  - 'STATE dominated_by AND A QUANTITATIVE sota_delta. dominated_by MAY NOT BE NULL and may be set to a non-null value only after checking every row of the frontier across time, memory and data/queries.'
  - 'DO NOT DECLARE A READING CLAUSE and do not state the disposition; TASK-20260802-011 owns that. Write objections and falsification routes. DO NOT READ C-MEAN.'
  - 'MAKE NO COMMIT; TASK-20260802-011 archives this report.'
  - 'Record inference honestly (requested review-adversarial, independent session, fallback_used true, model_verified false), and every YAML written must parse.'
  deliverables:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/reviews/TASK-20260802-010/red_team_report.yaml
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/reviews/TASK-20260802-010/red_team_report.yaml
  archived_by: TASK-20260802-011
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 7200
    memory_gb: 8
    maximum_runs: 1
  completion_gate:
  - >-
    Objections and falsification routes filed in both directions with the
    counterfactual stated at equal length; the yardstick-to-intermediates slide
    hunted for explicitly; the normality of p_hat across instances assessed rung
    by rung with the interval trustworthiness stated; the both-cells
    independence approximation recomputed from the archived per-seed residuals
    with the size of the error stated; W3 attacked from both sides; RT049-B6
    made to bite on the observed PRE-Q-1 answer; the uncertified-class
    declaration checked for completeness and softened wording with W1-W5 and
    V1-V12 enumerated and W6 proposed if warranted; the scope attacked step by
    step; the controls-before-belief test applied to this control itself; the
    superseding-note capacity stated with the exact entries and factors it can
    and cannot bear; dominated_by non-null and sota_delta quantitative; no
    reading clause declared, no disposition stated, C-MEAN not read; no commit
    made.
