handoff:
  id: TASK-20260801-037
  from: coordinator
  to: validator
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-024
  objective: >-
    Independently validate the RUN-DEP-001-calib package BEFORE any threshold is frozen against
    it. Return ADMISSIBLE or INADMISSIBLE with a concrete defect list. THE NAMED PRIORITY DUTY IS
    THE MARGINAL BIT-IDENTITY CHECK - reconstruct at least one planted arm per family per cell
    from the recorded seeds and verify INDEPENDENTLY that the sorted-marginal sha256 digests and
    the marginal histograms of the plant equal the source's, rather than taking the driver's own
    report for it.
  uncertainty_reduced: >-
    Whether the calibrated instrument is trustworthy enough that a reading rule may be frozen
    against its numbers.
  inputs:
  - experiments/EXP-DEP-001/specification.yaml
  - experiments/EXP-DEP-001/implementation/dep001_driver.py
  - experiments/EXP-DEP-001/runs/RUN-DEP-001-calib/
  - experiments/EXP-DEP-001/results/calib/
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/archives/TASK-20260801-036/snapshot_commit_receipt.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/tasks/TASK-20260801-035/execution_report.yaml
  constraints:
  - >-
    INDEPENDENT SESSION. Recompute rather than reason wherever recomputation is possible - the
    standing model-independence caveat means procedural independence is all this harness provides.
  - >-
    NAMED DUTY 1 - CTRL-DEP-MARG. Verify marginal bit-identity independently on reconstructed
    arms, not from the driver's self-report. A mismatch is INSTRUMENT FAILURE and is never a
    result.
  - >-
    NAMED DUTY 2 - verify structurally that the package contains NO OBJ-REAL sample, NO
    deterministic factor-base x-list, NO rung of any of the three ladders and NO duplicate
    decomposition, and that the tripwire calibration_saw_real_object is false.
  - >-
    NAMED DUTY 3 - verify CTRL-DEP-EQDHASH from source, that the sha256 of
    experiments/EXP-EQD-001/implementation/eqd001_driver.py equals
    bdb2601b195f314a4430fa80fcf8ab15ec0b605335a8386a93c2b9b3c7d7b02f, that the driver IMPORTS it
    rather than re-implementing the map or the statistics, and that NO file under
    experiments/EXP-EQD-001/ was modified - check `git status` and the diff.
  - >-
    NAMED DUTY 4 - verify the measurement entry point exists, is reachable and was NOT executed,
    and that DRIVER_SHA256 in the receipt equals the file's hash and the manifest's.
  - >-
    NAMED DUTY 5 - recompute every archived EXP-EQD-001 threshold quoted in
    archived_threshold_reproduction.json as the 199th ascending order statistic of the named
    200-element array, and recompute the THR-DEP-REPRO exceedance counts.
  - >-
    Check expected arm counts, schema completeness, seed and stream integrity INCLUDING
    disjointness from the archived EXP-EQD-001 streams, raw versus summary agreement, and control
    comparability.
  - Run tools/validate_ledger.py check_run on the manifest and report its error list verbatim.
  - >-
    STATE NO DISPOSITION ABOUT ANY HYPOTHESIS. This package is expressly non-evidential in either
    direction. Do not freeze or propose any threshold and do not apply any reading rule.
  - 'Do not edit any file outside your write scope. MAKE NO COMMIT; TASK-20260801-046 archives this report.'
  - 'Record inference honestly (requested review-adversarial, independent session).'
  deliverables:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/reviews/TASK-20260801-037/calibration_validation_report.yaml
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/reviews/TASK-20260801-037/calibration_validation_report.yaml
  archived_by: TASK-20260801-046
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 5400
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
  - >-
    A literal ADMISSIBLE or INADMISSIBLE verdict with a concrete defect list; all five named
    duties answered explicitly and each with its own recomputed evidence; check_run error list
    quoted verbatim; no disposition about any hypothesis stated.
