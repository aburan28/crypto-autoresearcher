  return_format: >-
    Report: the decision, evidence strength, the exact scoped claim the data
    justify (negative-result phrasing per
    docs/evidence-and-reproducibility.md), how J3 was resolved and why, and
    the single next action with its role.

  review_plan:
    claim_under_review: >-
      H-FROB-d93575, statement (verbatim): "Let E/F_q be an ordinary subfield
      curve considered over F_{q^n} with p not dividing n, let <G> be a
      prime-order subgroup of order N not contained in a proper subfield, and
      let x^n - 1 = (x-1)*f_1*...*f_s over F_q. For each partition P of
      {f_1,...,f_s} into m groups, let V_1,...,V_m be the corresponding
      Frobenius-stable F_q-subspaces of F_{q^n}, let B_j = {Q in <G>\{O} :
      x(Q) in V_j}, let p_m(P) be the exact fraction of <G>\{O} expressible
      as Q_1 + ... + Q_m with Q_j in B_j, and let U(P) be the exact number of
      relation columns of the union. Then, at fixed total slot dimension
      sum_j dim V_j = n - 1, the combinatorial cost ratio (U(P) + 1 +
      extra)/p_m(P) varies across P by at least a factor 4 in a cell whose
      x^n - 1 splits completely, its minimum is attained at a partition with
      m >= 2 and balanced slot dimensions, and the within-cell improvement
      factor is at least four times larger there than in a matched cell
      whose x^n - 1 has no non-trivial factorisation. Separately and
      independently, the direct sum of the kernels ker f_j(pi) over all j is
      exactly ker Tr_{F_{q^n}/F_q}, of dimension n - 1." Success criterion
      and falsification criterion are reproduced in full in this handoff's
      `inputs`-cited specification.yaml sections success_criterion (six
      conjunctive clauses) and falsification_criterion (five clauses (a)-(e),
      each independently scoped to the cells where observed) -- read them
      there, verbatim, before ruling.

    coordinator_prior: >-
      Recorded 2026-09-21, before this handoff is dispatched, by the session
      that wrote this plan (the same session that dispatched and
      independently verified the Executor's run before the PR #1311 snapshot
      commit -- so this prior is informed by that verification work, not
      blind to the run's content; it is a prior on the INTERPRETIVE decision
      only, recorded before any coordinator subagent rules on it).
      Prediction: INCONCLUSIVE, via decision_branches.inconclusive, because
      success_criterion clause (6) ("in every completed cell the spread of
      cost_ratio_neg on each of the C2, C3 and C4 control arms is STRICTLY
      SMALLER than the object arm's spread in that cell") cannot be
      affirmatively confirmed: the control battery was run only on each
      core cell's FIRST eligible curve, and in FROB-SPLIT-q11n5 and
      FROB-EQDEG-q19n5 that first curve's object arm itself has spread
      exactly 1 (every achievable partition on it is empty_base except the
      trivial one) -- there is no object-arm variation on that curve for the
      controls to be compared against. The SECOND eligible curve in each of
      those two cells is the one whose object arm shows the real, non-trivial
      spread (headline I=2055/451 and I=6152/861), and it was NOT given the
      C2/C3/C4 battery in this run (disclosed in report.md section 5 as "the
      single most consequential scope gap in this run package").
      Symmetrically, I predict falsification_criterion clause (c) ("any of
      the C2, C3 or C4 control arms shows a spread greater than or equal to
      the object arm's in the same cell") should NOT be read as triggered by
      the curve-0 data alone: on curve 0, spread(C2)=spread(C3)=spread(C4)=
      spread(object)=1 is a VACUOUS tie -- >= is literally satisfied, but
      there is no "object-arm variation" on that curve for the tie to fail
      to explain, so reading this as a genuine falsification would be
      exactly the failure mode the proves_too_much control (PTM-2 below) is
      designed to catch: the same vacuous-tie reading applied to
      FROB-NOLATTICE-q13n5 (where the object arm is ALSO trivially flat by
      construction, as the designed null-lattice cell) would equally
      "falsify" the hypothesis there -- which cannot be right, since
      NOLATTICE's flatness is the INTENDED, EXPECTED null behaviour, not a
      falsification of anything. I therefore predict J3 resolves to "not
      evaluable on this run's data" and the decision is inconclusive, with a
      named concrete recheck: extend the C2/C3/C4 battery to each core
      cell's SECOND eligible curve in a follow-up run. I further predict:
      C5 (ker Tr identity, success clause 2 / falsification (d)) will be
      reconfirmed PASS in all three core cells (already independently
      verified by this session before the snapshot commit, cross-checked by
      the run's own from-scratch checker.py); the achievable-slot-dimension-
      multiset-vs-divisor-lattice match (success clause 3 / falsification
      (e)) will PASS; and the IR-7 memory discrepancy (peak_rss/analytic
      ratio 82-14,671, reported not resolved) will be noted as a disclosed,
      non-falsifying instrument limitation, not grounds for invalidation,
      since IR-7 only requires the discrepancy be REPORTED, which it was.

    joints:
      - joint: >-
          J1: the three core cells genuinely satisfy success_criterion
          clause (1) (at least one eligible object curve, all four arms
          populated) and FROB-EXT-q13n7's not_run_resource is a genuinely
          permitted SR-4 outcome, not masking an operational failure
          mislabelled as an acceptable checkpoint.
        assigned_to: coordinator
        attack_plan: >-
          Re-derive eligible-curve counts and arm population directly from
          raw.jsonl and metrics.json for each core cell, not from report.md's
          prose summary. Confirm FROB-EXT-q13n7's 540-second self-imposed cap
          is documented in specification.yaml (not invented post hoc by the
          Executor to excuse an incomplete run) and that its object-search
          probe genuinely completed with a real result (N=5,230,261 and
          N=3,109) rather than a placeholder.
        breaking_artifact: >-
          Any core cell missing a populated arm, or an SR-4 invocation not
          actually grounded in the frozen spec's own text.
      - joint: >-
          J2: the headline improvement numbers (I(FROB-SPLIT-q11n5) >= 4,
          I(SPLIT) >= 4*I(NOLATTICE)) are confirmed across the FULL
          achievable-partition set in each cell, with no partition excluded
          from the min/max and no denominator-zero configuration silently
          dropped (IR-9).
        assigned_to: coordinator
        attack_plan: >-
          Enumerate every achievable partition recorded in cost-model.json
          for FROB-SPLIT-q11n5 and FROB-NOLATTICE-q13n5 (not just the two
          headline ratios this session already spot-checked: 206733/41 vs
          5533/5, I=2055/451), confirm the reported argmax/argmin genuinely
          range over that full set, and independently recompute
          I(SPLIT) >= 4*I(NOLATTICE) from the raw per-partition numbers
          rather than trusting the report's own arithmetic a second time.
        breaking_artifact: >-
          An achievable partition present in the raw data but absent from
          the reported spread/argmin computation, or a denominator-zero
          configuration dropped rather than flagged per C7.
      - joint: >-
          J3 (the load-bearing joint): does success_criterion clause (6) /
          falsification_criterion clause (c) -- the C2/C3/C4-spread-vs-
          object-spread comparison -- resolve to MET, FALSIFIED, or NOT
          EVALUABLE, given the control battery was run only on the curve
          whose object arm itself shows no variation (spread=1) in
          FROB-SPLIT-q11n5 and FROB-EQDEG-q19n5?
        assigned_to: coordinator
        attack_plan: >-
          Read clause (6) and falsification (c) verbatim against the actual
          curve-by-curve data in metrics.json (not this handoff's
          paraphrase). State explicitly which curve each achieved spread
          number in the run package was measured on. Apply the
          proves_too_much check (PTM-2 below) before ruling: if the same
          reading of "vacuous tie satisfies/falsifies the comparison" would
          also fire on FROB-NOLATTICE-q13n5's designed-flat cell, that
          reading is broken and the honest answer is NOT EVALUABLE on this
          run's data, pointing to inconclusive rather than either support or
          reject_scoped/weaken.
        breaking_artifact: >-
          A textual argument, grounded in the frozen spec's own language
          rather than in what makes a cleaner-sounding verdict, that a
          vacuous tie on the flat curve DOES meaningfully satisfy or falsify
          the comparison the criterion actually intends.
      - joint: >-
          J4: C5 (ker Tr identity, success clause 2 / falsification (d)) and
          the achievable-slot-dimension-multiset-vs-divisor-lattice match
          (success clause 3 / falsification (e)) hold across ALL SIX curves
          in this run (not only the curves already discussed in the
          Executor's own handback and this session's spot checks).
        assigned_to: coordinator
        attack_plan: >-
          Re-verify directly from certificates.json and metrics.json for
          every one of the six curves (two per core cell), cross-checked
          against checker.py's own independent field/Frobenius-matrix
          construction where it was run (disclosed as skipped for the two
          largest-N curves in the Executor's handback -- confirm that
          disclosure is accurate and does not silently extend to a curve it
          was NOT actually skipped on, or vice versa).
        breaking_artifact: >-
          Any curve where dim(sum of nontrivial kernels) != dim(ker Tr), or
          the achievable slot-dimension multiset disagrees with the divisor
          lattice of x^n-1 for that (q,n).
      - joint: >-
          J5 (blind_rederivation, separately declared below): independently
          derive, from specification.yaml's own definitions alone (never
          implementation.py, checker.py, cost-model.json, or this session's
          own PR #1311 verification notes), the achievable partition lattice
          for FROB-SPLIT-q11n5's curve with N=1051 (the SMALLER of its two
          eligible curves, chosen for hand-tractability), and the exact
          cost_ratio_neg at m=1 (the trivial single-slot baseline, C1's own
          closed-form case) for that curve, then compare to the run's
          recorded value after opening the blind_from files.
        assigned_to: coordinator
        attack_plan: >-
          See blind_rederivation block below; this is its worked form as a
          joint so it is owned and attackable like the others.
        breaking_artifact: >-
          A prose-only reading of the partition-lattice/cost-ratio
          definitions that yields a materially different achievable-
          partition set or m=1 cost_ratio_neg than the run's recorded value
          for this specific curve.

    blindness:
      mutual: true
      lifted_for: []
      rationale: null

    proves_too_much:
      objects:
        - >-
          PTM-1: FROB-NOLATTICE-q13n5 is the experiment's own designed
          negative control for the whole slot-count-axis claim (only m=1 is
          achievable there by construction, since x^n-1 has no non-trivial
          factorisation for this (q,n)). The method used to find a
          non-trivial-partition effect in FROB-SPLIT-q11n5 must NOT also
          spuriously report a nontrivial-partition entry for
          FROB-NOLATTICE-q13n5 -- re-verify metrics.json/cost-model.json
          record only m=1 there, with no fabricated m>=2 entry.
        - >-
          PTM-2 (the one that resolves J3): apply whatever reading of
          falsification clause (c) is used to rule on curve 0's vacuous tie
          in FROB-SPLIT-q11n5/FROB-EQDEG-q19n5 to FROB-NOLATTICE-q13n5's
          object arm as well, which is ALSO trivially flat (spread=1) there
          by design, on every eligible curve, since no non-trivial partition
          exists at all. If that reading fires falsification (c) on
          NOLATTICE too, the reading is broken: NOLATTICE's flatness is the
          CORRECT, EXPECTED null behaviour this experiment was designed to
          produce, not a falsification of the hypothesis's separately-scoped
          claims about SPLIT and EQDEG.
      failure_signature: >-
        PTM-1 firing (a fabricated nontrivial partition on the designed-flat
        cell) invalidates the instrument outright. PTM-2 firing (the same
        reading used for J3 also falsifying the hypothesis via
        NOLATTICE's intentional flatness) means that reading is wrong and
        must not be used to resolve J3 in either direction; the correct
        resolution is "not evaluable," not a forced choice between support
        and reject_scoped.
      assigned_to: coordinator

    blind_rederivation:
      required: true
      quantity: >-
        For FROB-SPLIT-q11n5's curve with N=1051: (a) the achievable
        partition lattice at total slot dimension n-1=4 (which slot-
        dimension multisets are achievable, derived from the divisor
        structure of x^5-1 over F_11 alone, per specification.yaml's own
        prose definition of Frobenius-stable subspaces and achievable
        partitions -- NOT from reading off the run's own reported lattice
        table); (b) cost_ratio_neg at the trivial m=1 partition (U_neg=N-1,
        p_1 -- the closed-form C1 baseline case), computed from
        specification.yaml's own definitions of U(P) and p_m(P) and this
        curve's raw group order N=1051 alone.
      parameters: >-
        q=11, n=5 (same field construction as FROB-SPLIT-q11n5's other
        curve, already characterised in the EXP-FROB-b8cf21 review as
        F_11[z]/(z^5+2z^4+1) -- re-derive independently rather than assuming
        that prior result transfers to this curve's own field construction,
        since field construction is canonical per (q,n) and should
        reproduce identically, but the re-deriver must verify this rather
        than assume it); curve parameters and N=1051 as recorded in this
        run's own fixtures.json (frozen input data, not the producer's
        method, so NOT in blind_from) for the FROB-SPLIT-q11n5 cell's second
        (smaller-N) eligible curve.
      blind_from:
        - experiments/EXP-FROB-91ee9c/runs/TASK-20260914-7119f2/implementation.py
        - experiments/EXP-FROB-91ee9c/runs/TASK-20260914-7119f2/checker.py
        - experiments/EXP-FROB-91ee9c/runs/TASK-20260914-7119f2/aggregate.py
        - experiments/EXP-FROB-91ee9c/runs/TASK-20260914-7119f2/report.md
        - experiments/EXP-FROB-91ee9c/runs/TASK-20260914-7119f2/cost-model.json
        - experiments/EXP-FROB-91ee9c/runs/TASK-20260914-7119f2/metrics.json
      assigned_to: coordinator

    procedure_deviations:
      - >-
        PD-1: joints and blind_rederivation are assigned to the role address
        "coordinator" rather than a distinct reviewer TASK-* id, matching
        the same declared departure as TASK-20260921-e107c8's PD-1 (this
        review dispatches a single coordinator subagent per the
        /review-evidence skill's own step 2, not separate validator/red-team
        sessions with their own handoffs). If the eventual decision is
        support or reject_scoped with strength >= strong, a full multi-agent
        independence-checked round is a candidate escalation and should be
        named as a next_action rather than silently substituted for by this
        lighter round.
      - >-
        PD-2: this handoff's coordinator_prior was written by a session that
        had already independently verified the run's content (hash-checking,
        arithmetic spot-checks, C5 cross-verification) before writing this
        plan, as part of accepting the Executor's handback and making the
        PR #1311 snapshot commit. This is disclosed rather than presented as
        a blind prior: the prior concerns the INTERPRETIVE decision (which
        of support/weaken/reject_scoped/inconclusive applies), which was not
        yet decided at the time this plan was written, not the underlying
        facts (which were already independently checked).
