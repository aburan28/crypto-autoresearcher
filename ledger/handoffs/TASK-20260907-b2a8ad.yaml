  inference:
    policy: review-breakthrough
    reasoning_effort: max
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  inference_note: >-
    TIER CHECK, PERFORMED DELIBERATELY AGAINST THE FILE RATHER THAN ASSUMED.
    orchestration/model-policies.yaml `routing_rules` first entry is
    `unrecoverable-result-review`, whose `when.any` includes
    `contradicts_prior_evidence: true` and which requires
    `policy: review-breakthrough`, `independent_session: true`,
    `reviewer_must_not_be_originating_agent: true`, `fallback_allowed: false`.
    THIS BATCH MATCHES THAT ENTRY on two independent grounds:
    (i) it resolves a recorded DISAGREEMENT inside the committed, validated
    evidence record EV-ECDLP-2e9680 (a = 1/8: sealed blind 1/5 against
    production 5/5, which DEC-20260907-9b1b02 declined to relabel in either
    direction) -- i.e. a contradiction between two readings inside validated
    evidence, which is `review-breakthrough`'s own stated purpose
    (`contradiction_resolution`); and
    (ii) it can contradict the v2 batch's own committed executor conclusion,
    carried in EV-ECDLP-f6b3f5, that there is "no smaller a ... where
    T_sel = T/2 would be feasible" -- the contradiction DEC-20260906-bcc097
    surfaced and this batch is dispatched to adjudicate.
    The next entry, `critical-result-review` (review-adversarial), is NOT the
    match: its trigger is a proposed state transition to `supported` or
    `rejected`, and this batch proposes neither -- but routing_rules are
    evaluated in order and the first entry already fires, which is the
    stronger tier regardless. The batch-open instruction's default of
    `review-adversarial` is therefore OVERRIDDEN here, exactly as its own tier
    check directed. Practically this means the driving session dispatches the
    `validator-breakthrough` subagent variant (CLAUDE.md model policy note),
    which is the same role contract, authority and tool surface at `max`
    effort. `review-breakthrough` has `fallback_policy: null` and
    `degradable: false`: no weaker policy may stand in for it, and an
    unservable `max` blocks the CLAIM, never the campaign.
  budget:
    wall_clock_seconds: 3600
    memory_gb: 4
    maximum_runs: 2
  budget_note: >-
    3600 s / 4 GB matches the equivalent validator task of this goal's
    previous batch (TASK-20260906-bc1cfc, BATCH-f3a30a), which performed a
    comparable blind re-derivation with exact basins at N = 2^24 inside it.
    The J2 workload is bounded by the same measured arithmetic the amendment's
    `budget_note` records: RUN-ECDLP-612fb1-v2-1v2-s1's committed manifest
    shows peak_rss_bytes 643100672 (about 0.60 GiB) and wall_seconds 11.856
    for a STRICTLY HEAVIER N = 2^24 exact-basin workload, so 4 GB carries
    roughly 6x headroom over the closest measured analogue for a lighter job.
    maximum_runs 2 covers the sealed J2 computation plus one re-run if it hits
    a recorded infrastructure fault; it is not a licence for a second,
    post-seal "better" derivation. This reviewer and the Red Team may run
    concurrently at max_concurrent 2: 4 + 4 = 8 GB against a 15 GB host, with
    the Executor finished and nothing else in flight.

  review_plan:
    plan_authored: '2026-09-07'
    plan_authored_before_any_reviewer_ran: true
    authored_by: coordinator (BATCH-8f3e86 batch-open authorship)
    mirrored_on:
      - ledger/handoffs/TASK-20260907-ee1ca7.yaml
      - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-8f3e86/dispatch_queue.json
    mirror_note: >-
      ONE PLAN, THREE COPIES, BYTE-IDENTICAL. The same review_plan block is
      carried on both reviewer handoffs and on both reviewer entries of the
      dispatch queue, so neither reviewer has to read the other's handoff to
      know the plan -- which mutual blindness would otherwise make awkward.
      If the copies ever diverge, THIS ONE (the Validator handoff) is
      authoritative and the divergence is itself a reportable defect.

    claim_under_review: >-
      As the PRODUCER (Executor TASK-20260907-aad514) will state it in
      execution_report.yaml, not as the Coordinator would restate it: "On the
      frozen v2 instrument of EXP-ECDLP-612fb1, at N = 2^24 with exact basins,
      T = 256, T_sel = 128, r = 2, seeds {1,2,3,4,5}, the G3 ceiling-feasibility
      predicate of amendment v2_to_v3.yaml Section 3 -- margin_s =
      TopShare_s(T_sel) - StaticCov_s(T, r) >= 0 in at least 4 of 5 seeds --
      returns verdict V(a) at each a in {1/16, 1/8, 3/16, 1/4}; at N = 2^20,
      T = 64, T_sel = 32 the same predicate reproduces the committed a-scan
      per-seed margins of RUN-ECDLP-612fb1-v2-ascan-s1..s5; and the
      accompanying controls NULL_A_G3, NULL_B_G3, DECAY_G3,
      EXACT_COVERAGE_NON_EXCEEDANCE and seed integrity returned the outcomes
      recorded per cell."
      THE LOAD-BEARING PART, and the only part with claim-changing
      consequences, is V(1/16) and V(1/8) at r = 2, N = 2^24. A PASS at either
      reopens clause (C1) of H-ECDLP-37dc01 at a smaller a than that
      hypothesis's own stated test_boundary.

    coordinator_prior: >-
      WRITTEN BEFORE ANY REVIEWER RAN AND BEFORE ANY OTHER LINE OF THIS PLAN.
      I expect the review to CONFIRM G3-feasibility at BOTH a = 1/16 and
      a = 1/8 at (N = 2^24, r = 2, T_sel = T/2), and therefore to reopen
      clause (C1) at two smaller a values rather than one. Specifically I
      expect: a = 1/16 to pass 5/5, because it has already been confirmed
      twice by two independent readings within EXP-ECDLP-6ac801
      (EV-ECDLP-2e9680: blind 5/5 and production 5/5) and this batch is its
      third angle; a = 1/8 to pass at 4/5 or 5/5, because I attribute that
      cell's committed sealed-level disagreement (blind 1/5 against production
      5/5) entirely to the missing weight formula that the v3 amendment's
      Section 3 now writes down -- EV-ECDLP-2e9680's own controlled post-seal
      diagnostic, re-selecting by w(d) on a shared pool, moved a = 1/8 from
      1/5 to 5/5 -- so I expect the fresh re-seal to reproduce production
      rather than the old blind reading; STAGE 3A to reproduce the committed
      a-scan margins essentially exactly (same frozen instrument, same seeds,
      so agreement to floating-point tolerance, not merely within CI); DECAY_G3
      to hold with 0/5 at r = 4 and r = 8 at every a; and the proves-too-much
      objects a = 3/16 and a = 1/4 to FAIL.
      WHERE I THINK THIS BREAKS, named now so it cannot be rationalised later.
      FIRST AND MOST LIKELY: a = 3/16 is THIN. EV-ECDLP-2e9680's own controlled
      diagnostic, applying the w(d) rule this predicate binds, scored a = 3/16
      at 2/5 at N = 2^24 -- a clean FAIL against the >= 4/5 bar, but two seeds
      nearer the boundary than that batch's production 0/5, and my own reading
      of the committed N = 2^20 a-scan puts a = 3/16 at 1/5 with one strongly
      positive seed (+0.018691). If STAGE 3B returns a = 3/16 at 4/5, the
      proves-too-much control has FIRED, the predicate does not discriminate at
      this T_sel on this instrument, and EVERY PASS in this batch -- including
      the two I expect -- becomes uninterpretable. That would be the most
      informative outcome this batch can produce and I would rather have it
      than my prior.
      SECOND: NULL_A_G3 IS THE CONTROL I AM LEAST ABLE TO PREDICT. I expect
      margin_null comfortably ABOVE margin, i.e. the relabelled
      evidence-blind selection covers materially less than the weight-based
      one. I have never measured this at any a, in any batch -- no committed
      record in this program contains it. If margin_null sits close to margin
      at a = 1/16 and a = 1/8, then w(d) carries little information at small a
      and a "G3 PASS" is a statement about a degenerate comparator rather than
      about the basin-size distribution. I would then NOT read a PASS as
      support, whatever the verdict table says.
      THIRD, and least likely: STAGE 3A fails to reproduce the committed
      a-scan. That would be an instrument discrepancy between the v3 driver
      and the frozen v2 a-scan path, would make STAGE 3B uninterpretable, and
      would be a defect in this batch rather than a result about the
      hypothesis.
      WHAT I DO NOT EXPECT AND WOULD TREAT AS THE STRONGEST SIGNAL AGAINST MY
      OWN POSITION: a fresh sealed blind re-derivation at a = 1/8 that AGAIN
      comes out infeasible under the now-explicit w(d) formula. That would
      mean my diagnosis of the 6ac801 disagreement is wrong, the disagreement
      is real and unexplained, and a = 1/8 must be reported as still
      contested rather than resolved.

    joints:
      - joint: >-
          J1 -- PREDICATE FIDELITY. The implementation under source_v3/
          computes the predicate the amendment's Section 3 defines, and not a
          nearby one. Load-bearing sub-clauses: STATIC(T)_r is selected by
          w(d) = S_d + 4*W*h_d computed from POOL EVIDENCE ONLY, with the
          seeded ascending tie-break; exact basin sizes are used to SCORE the
          selection and NEVER to make it; the pool stops at exactly r*T
          DISTINCT DPs with every generating walk (hit or miss) charged;
          capped walks contribute nothing and belong to no basin; TopShare(t)
          sums the t largest exact basins; the >= 4-of-5 threshold is applied
          per cell, unchanged from v2.
        assigned_to: TASK-20260907-b2a8ad
        attack_plan: >-
          Read source_v3/ and the source_v2/instrument.py functions it
          imports, AFTER sealing J2, clause by clause against Section 3.
          Concretely: (1) trace the selection path and prove by reading that
          no exact basin array is in scope where the weight is computed --
          this is the exact confound that produced the 6ac801 a = 1/8
          disagreement, so look for it specifically rather than generically;
          (2) instrument or re-run one cell with the weight vector replaced by
          true basin sizes and confirm the verdict CHANGES (if it does not,
          either the cell is insensitive or the selection is already reading
          basin sizes -- both are findings); (3) check the pool-termination
          condition counts DISTINCT DPs, not walks, and that misses are
          charged to P but credit nothing; (4) confirm capped points are
          excluded from every basin AND from the TopShare denominator N in the
          way Section 3 states, since a denominator convention that quietly
          drops capped mass would inflate every share; (5) confirm the 4-of-5
          rule is applied per (N, a, r) cell and not pooled across r.
          WHERE I THINK IT BREAKS: (4) and (1), in that order. The capped/cycle
          mass convention is the kind of detail that is right in the frozen v2
          path and silently re-derived wrongly in a new driver, and it moves
          every margin in the same direction, which is exactly the shape of an
          artifact that survives casual review.
        breaking_artifact: >-
          A named clause of Section 3 that source_v3/ implements differently,
          together with the cell whose verdict changes when the clause is
          implemented as written -- or a demonstration that the verdict does
          NOT change when true basin sizes replace w(d), which would mean the
          selection rule is not load-bearing where the amendment says it is.

      - joint: >-
          J2 -- BLIND RE-DERIVATION OF THE LOAD-BEARING QUANTITY. The
          G3-feasibility VERDICT (pass_count out of 5, and the per-seed margin
          SIGNS) at a = 1/16 and a = 1/8, N = 2^24, T = 256, T_sel = 128,
          r = 2, seeds {1,2,3,4,5}.
        assigned_to: TASK-20260907-b2a8ad
        attack_plan: >-
          Implement the predicate from the amendment's Section 3 and its
          exact_parameter_table_for_this_item ALONE, under reading P2: your own
          uniformly random function on Z_N and your own independent
          Bernoulli(theta = 1/W) DP marking, with the SAME T, T_sel, a, W,
          cap, r, seed count, the SAME pool procedure and the SAME weight and
          tie-break. Compute exact basins by your own method. SEAL
          j2_output.json and your code (sha256 + UTC timestamp + the list of
          what you had read) BEFORE opening anything in blind_from. Then
          compare at verdict and per-seed-sign level only.
          WHERE I THINK IT BREAKS: at a = 1/8, which is the boundary cell --
          committed N = 2^20 margins there run +0.003183, -0.001996,
          +0.010345, +0.004992, +0.007094, so one seed is already within
          0.002 of zero, and a different random-function family can plausibly
          flip a seed's SIGN there without any implementation error at all. If
          your a = 1/8 comes out 3/5 or 4/5, say exactly which seeds and how
          close to zero: a 3/5 with two near-zero negatives is a materially
          different finding from a 3/5 with three decisive negatives, and the
          difference decides whether a = 1/8 is reported as resolved,
          borderline, or still contested. At a = 1/16 the committed 2^24
          margins from the prior lane are comfortably positive under both its
          readings, so a blind FAIL there would point at your implementation
          or at the amendment's text before it points at the producer.
        breaking_artifact: >-
          A sealed per-cell verdict differing from the producer's at a = 1/16
          or a = 1/8, or a sealed per-seed margin SIGN differing at any of the
          ten (a, seed) pairs -- with the seal artifact proving the derivation
          preceded any blind_from read. Magnitude differences are expected and
          are NOT a break.

      - joint: >-
          J3 -- THE 2^20 REPLICATION ANCHOR. STAGE 3A's fresh run reproduces
          the contested committed a-scan numbers that started this lane:
          at N = 2^20, T_sel = T/2 = 32, r = 2, a = 1/16 passes 5/5 and
          a = 1/8 passes 4/5 with seed 2 failing, and the per-seed margins
          match RUN-ECDLP-612fb1-v2-ascan-s1..s5 to floating-point tolerance.
        assigned_to: TASK-20260907-b2a8ad
        attack_plan: >-
          Recompute each margin yourself directly from the COMMITTED a-scan
          raw-result.json (cells[a].top_share["T/2"] minus
          cells[a].static_by_r["2"], five seeds, four a values) -- do not take
          the amendment's or the producer's restatement of them -- and diff
          against STAGE 3A's fresh per-seed values to at least 6 decimal
          places. The Coordinator's own reading of those files gives, at
          r = 2: a = 1/16 -> +0.019553, +0.012215, +0.023987, +0.016334,
          +0.009157 (5/5); a = 1/8 -> +0.003183, -0.001996, +0.010345,
          +0.004992, +0.007094 (4/5, seed 2 failing); a = 3/16 -> +0.018691,
          -0.009538, -0.015742, -0.008542, -0.003351 (1/5); a = 1/4 ->
          -0.014133, -0.003534, -0.053352, -0.019899, -0.023048 (0/5). Check
          those numbers too: if the Coordinator misread the committed table,
          the entire premise of this batch is wrong and that is the single
          cheapest break available to you.
          WHERE I THINK IT BREAKS: nowhere, and that is precisely why it is
          worth one reviewer's time -- it is the same instrument and the same
          seeds, so ANY disagreement beyond floating-point noise localises a
          real defect in the new v3 driver and invalidates STAGE 3B's
          interpretation before anyone argues about it.
        breaking_artifact: >-
          A per-seed margin differing beyond floating-point tolerance, a
          pass_count differing at any a, or a demonstration that the
          Coordinator's quoted a-scan readings are not what the committed
          raw-result.json files contain.

      - joint: >-
          J4 -- PROVES-TOO-MUCH. The same predicate, the same code path, the
          same pool procedure and the same analysis must return G3 FAIL on the
          objects where G3-feasibility is KNOWN FALSE: a = 1/4 at r = 2,
          N = 2^24; a = 3/16 at r = 2, N = 2^24; and every tested a at r = 8.
        assigned_to: TASK-20260907-ee1ca7
        attack_plan: >-
          Verify each known-false object is actually evaluated by the SAME
          code path as the primary cells -- not a separate branch, not a
          hard-coded expectation, not a cell quietly skipped -- and that each
          returns FAIL. Then attack the control's own strength: a = 3/16 IS
          THE THIN ONE and the Coordinator flags it in advance.
          EV-ECDLP-2e9680's controlled post-seal diagnostic, using the w(d)
          rule this predicate binds, scored a = 3/16 at 2/5 at N = 2^24, and
          the committed N = 2^20 a-scan puts it at 1/5 with one seed at
          +0.018691. If STAGE 3B returns a = 3/16 at 4/5 or 5/5 the control
          has FIRED: report it FIRST and state plainly that no PASS anywhere
          in this batch may be read as support until it is explained. If it
          returns 2/5 or 3/5, report HOW CLOSE -- a control that only just
          fails is a weak control and the batch's discrimination claim is
          correspondingly weak. Also check the direction of the a-ordering: if
          feasibility is not monotone decreasing in a, the "known-false"
          labelling of a = 3/16 and a = 1/4 is itself suspect.
          WHERE I THINK IT BREAKS: a = 3/16 at 3/5, i.e. neither a clean FAIL
          nor a firing -- an outcome that invites softening into "borderline"
          and must not be.
        breaking_artifact: >-
          A G3 PASS at any known-false object, or a demonstration that a
          known-false object was evaluated by a different path, with different
          parameters, or not at all.

      - joint: >-
          J5 -- CONTROLS BEFORE BELIEF: the null objects and the decay control.
          NULL_A_G3 (relabelled evidence pairs on the IDENTICAL pool draw)
          must show margin_null materially ABOVE margin; NULL_B_G3 (two
          independent selection code paths over the same weights and keys)
          must give set-identical selections; DECAY_G3 must show margin
          NON-INCREASING in r over {2, 4, 8} at every (N, a, seed), with the
          cell verdict FAIL by r = 8.
        assigned_to: TASK-20260907-ee1ca7
        attack_plan: >-
          First check the null is the RIGHT SHAPE: NULL_A_G3 must relabel the
          pool's OWN multiset of (S_d, h_d) pairs on the SAME pool draw at the
          same (N, a, r, seed) -- if the producer instead drew a fresh pool,
          the "null" differs from the signal in two ways and controls nothing.
          Then attack the null's INFORMATIVENESS, which is the Coordinator's
          own named uncertainty: compute margin / margin_null per cell at
          a = 1/16 and a = 1/8 and say whether the weight function is
          carrying real signal. If margin_null is NOT materially larger than
          margin, then w(d) is close to uninformative at small a and a G3 PASS
          reflects a weak comparator rather than basin structure -- report
          that as an artifact tell, not as a curiosity. No committed record in
          this program contains this measurement, so there is no prior to
          lean on.
          For DECAY_G3: the margin MUST fall as r grows, because a larger pool
          gives the realistic selector strictly more to choose from. Check
          monotonicity per (a, seed), not just pooled. A margin that is flat
          or rising in r is the canonical artifact signature of
          docs/inventor-protocol.md and means the measured quantity is not the
          estimator-loss gap the predicate claims -- in which case the batch's
          PASS readings are uninterpretable and must be reported that way.
          WHERE I THINK IT BREAKS: NULL_A_G3 at a = 1/16. The margins there
          are the largest in the grid, and if the null margin is nearly as
          large, the most-cited PASS in this batch is the weakest.
        breaking_artifact: >-
          A null drawn from a different pool than its signal; a
          margin/margin_null ratio near 1 at a primary cell; a NULL_B_G3 set
          difference (which is a bookkeeping leak and invalidates the cell); or
          a non-decaying margin in r at any (N, a) beyond CI.

      - joint: >-
          J6 -- COST, SCOPE AND WHAT A PASS LICENSES. Every headline number
          carries its storage and precomputation siblings (S, S_peak in bits,
          P/sqrt(NT), W) rather than a bare ratio; the claim tier stays TOY;
          the result is reported as a CEILING and never as a mechanism; the
          a-widening outside H-ECDLP-37dc01's stated test_boundary is
          disclosed; and EV-ECDLP-60e266's standing obstruction at a = 1/4 is
          neither reopened nor weakened.
        assigned_to: TASK-20260907-ee1ca7
        attack_plan: >-
          Read the producer's execution_report and cost_table.json adversarially
          for the four specific overclaims this lane is prone to. (1) THE
          CEILING/MECHANISM SLIDE: a G3 PASS says the BEST POSSIBLE
          T_sel-entry table beats a realistically-selected T-entry table; it
          says nothing about any online re-selection procedure attaining it,
          and ZERO online arms are run here. Find any sentence that elides
          this -- DEC-20260907-9b1b02 recorded exactly this slide once already.
          (2) SMALLER a IS NOT FREE: a = T*W^2/N, so at fixed (N, T) a smaller
          a is a SHORTER walk (W = 64 at a = 1/16 against W = 128 at a = 1/4
          at N = 2^24). Check that no advice-ratio statement appears without
          W, S, S_peak and P/sqrt(NT) in the same sentence. A "half the table"
          claim quoted without its shorter walk is a different operating point
          sold as the same one. (3) MEASURED vs MODELED: verify cost_table.json
          never mixes them in one column -- W, theta and cap are MODELED; every
          count, coverage and margin is MEASURED. (4) SCOPE: confirm nothing
          in the package claims anything at any (N, a, r, T_sel) outside the
          cells actually run, that the toy tier is stated, and that no
          statement about a = 1/4 weakens EV-ECDLP-60e266's obstruction, which
          appears here only as a known-false control.
          WHERE I THINK IT BREAKS: (2). It is the easiest number in this batch
          to quote alone and the most misleading when quoted alone.
        breaking_artifact: >-
          A quoted ratio without its frontier tuple; any sentence that reads a
          ceiling result as a mechanism result; a measured/modeled column
          collision; or any claim reaching outside the run cells.

    blindness:
      mutual: true
      lifted_for: []
      rationale: >-
        Not lifted. This is a first review round on a claim-changing result,
        and the two reviewers own disjoint joints: the Validator owns
        predicate fidelity, the blind re-derivation and the replication
        anchor; the Red Team owns the known-false controls, the null and decay
        controls, and the cost/scope claim. Neither needs the other's verdict
        to do its own work, and letting them read each other would convert two
        independent readings into one correlated one. Each reviewer's
        review_attestation must record read_sibling_reports: false honestly; an
        accidental read is reported, never absorbed. A later hardening round
        may legitimately lift this, and would say so here.

    proves_too_much:
      objects:
        - "a = 1/4, T_sel = T/2 = 128, r = 2, N = 2^24, frozen v2 instrument. KNOWN FALSE on two committed records: EV-ECDLP-60e266 measured the exact top-T/2 basin share below STATIC(T)'s exact coverage in 10 of 10 exactly enumerated seeds (its recorded obstruction), and EV-ECDLP-2e9680 reproduced 0/5 under BOTH its blind and its production readings at exactly this cell (production margins -0.012918, -0.008373, -0.036196, -0.016829, -0.022216). Provenance: internal."
        - "a = 3/16, T_sel = T/2 = 128, r = 2, N = 2^24, frozen v2 instrument. KNOWN FALSE on EV-ECDLP-2e9680, which reports it CONFIRMED G3-INFEASIBLE under both readings (blind 0/5, production 0/5). THIS IS THE THIN ONE -- see J4's attack plan and the Coordinator's prior. Provenance: internal."
        - "every tested a at r = 8, N in {2^20, 2^24}. KNOWN FALSE at N = 2^20 on the Coordinator's own reading of the committed RUN-ECDLP-612fb1-v2-ascan-s1..s5, which gives 0/5 at r = 8 for all four a values. Provenance: internal."
      failure_signature: >-
        The same predicate, the same code path, the same pool procedure and
        the same analysis must return G3 FAIL on every object above. A PASS on
        any of them means the predicate AS IMPLEMENTED proves too much -- it
        returns FEASIBLE where feasibility is already established false -- and
        NO PASS ANYWHERE IN THIS BATCH, including at a = 1/16 and a = 1/8, may
        be read as support until that is explained. This is a STOPPING
        CONDITION FOR INTERPRETATION, not a negative result about the
        hypothesis, and not grounds to invalidate the runs.
      assigned_to: TASK-20260907-ee1ca7

    blind_rederivation:
      required: true
      quantity: >-
        THE STATEMENT, not the method: the G3-feasibility VERDICT -- pass_count
        out of 5, and the per-seed margin SIGNS -- where for each seed s,
        margin_s = TopShare_s(T_sel) - StaticCov_s(T, r) with TopShare, the
        pool, the selection weight w(d) = S_d + 4*W*h_d and StaticCov as
        DEFINED IN experiments/EXP-ECDLP-612fb1/amendments/v2_to_v3.yaml
        Section 3, and the cell passes iff at least 4 of the 5 seeds have
        margin_s >= 0.
      parameters: >-
        N = 2^24 = 16777216; T = 256; T_sel = 128; r = 2; seeds s in
        {1, 2, 3, 4, 5}; a = 1/16 (W = 64.000000, theta = 0.015625000,
        cap = 512) and a = 1/8 (W = 90.509668, theta = 0.011048544,
        cap = 725); exact basins. These are the amendment's own
        exact_parameter_table_for_this_item values, restated so the re-deriver
        needs nothing else. Reading P2 (own random-function family + own
        Bernoulli(theta) DP marking) is not merely permitted, it is preferred.
      blind_from:
        - experiments/EXP-ECDLP-612fb1/source_v3/
        - experiments/EXP-ECDLP-612fb1/source_v2/
        - experiments/EXP-ECDLP-612fb1/runs/RUN-ECDLP-612fb1-v3-rep20-s1/
        - experiments/EXP-ECDLP-612fb1/runs/RUN-ECDLP-612fb1-v3-rep20-s2/
        - experiments/EXP-ECDLP-612fb1/runs/RUN-ECDLP-612fb1-v3-rep20-s3/
        - experiments/EXP-ECDLP-612fb1/runs/RUN-ECDLP-612fb1-v3-rep20-s4/
        - experiments/EXP-ECDLP-612fb1/runs/RUN-ECDLP-612fb1-v3-rep20-s5/
        - experiments/EXP-ECDLP-612fb1/runs/RUN-ECDLP-612fb1-v3-g3x24-s1/
        - experiments/EXP-ECDLP-612fb1/runs/RUN-ECDLP-612fb1-v3-g3x24-s2/
        - experiments/EXP-ECDLP-612fb1/runs/RUN-ECDLP-612fb1-v3-g3x24-s3/
        - experiments/EXP-ECDLP-612fb1/runs/RUN-ECDLP-612fb1-v3-g3x24-s4/
        - experiments/EXP-ECDLP-612fb1/runs/RUN-ECDLP-612fb1-v3-g3x24-s5/
        - experiments/EXP-ECDLP-612fb1/runs/RUN-ECDLP-612fb1-v3-analysis-001/
        - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-8f3e86/tasks/TASK-20260907-aad514/
        - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-8f3e86/tasks/TASK-20260907-ee1ca7/
        - coordination/experiments/EXP-ECDLP-6ac801/
        - experiments/EXP-ECDLP-6ac801/
      assigned_to: TASK-20260907-b2a8ad
      seal_artifact: coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-8f3e86/tasks/TASK-20260907-b2a8ad/j2_seal_manifest.yaml
      agreement_criterion: >-
        Verdict and per-seed SIGN, never magnitude. Two random-function
        families give different margin magnitudes at the same (a, r, seed);
        EV-ECDLP-2e9680 measured that directly. A verdict difference or a
        per-seed sign difference is a break and localises to one of two named
        implementations.
      disclosed_limitation: >-
        STATED PLAINLY RATHER THAN LEFT AS AN UNDECLARED HOLE IN THE
        INDEPENDENCE PROPERTY. The re-deriver MUST read the amendment (it is
        the source of the formal statement), and the amendment's Section 1
        blocks `residual_after_EXP_ECDLP_6ac801` and
        `recomputed_by_this_authorship` QUOTE THE PRIOR LANE'S PER-SEED
        MARGINS at N = 2^24 for a = 1/16 and a = 1/8, and the committed N =
        2^20 a-scan margins. So the re-deriver is blind to THIS BATCH's
        producer, but is NOT blind to the PRIOR lane's numbers. That is a real
        limitation on how much J2 can independently corroborate a = 1/16 and
        a = 1/8, and it is disclosed here rather than discovered later.
        Removing it was not available: deleting those blocks from the
        amendment would have hidden the state this batch is scoped against.
        MITIGATION, which is binding: the seal manifest must record explicitly
        that the re-deriver saw those prior-lane numbers, and must record its
        own result unchanged regardless of them. A sealed result that matches
        the prior lane is therefore weaker corroboration than one produced in
        true ignorance -- and a sealed result that DIVERGES from the prior
        lane is correspondingly strong, because it was produced against the
        pull of a number already read.
      independence_checker_note: >-
        `blind_from` lists paths the Validator writes nothing to and must not
        READ BEFORE SEALING; it reads several of them AFTER sealing, which is
        the protocol. tools/check_review_independence.py compares declared
        sources against blind_from without a time axis, so it may flag this
        task. That flag, if it appears, is expected and is answered by the
        seal manifest's timestamp and read-list -- it is not a silent
        deviation, and it is recorded here in advance rather than explained
        away afterwards.

    procedure_deviations: []
    procedure_deviations_note: >-
      Empty at authorship. Any departure -- acting before a report returns,
      reassigning a joint mid-round, dropping a control, lifting blindness --
      is appended by the Coordinator in the ledger-archive decision record,
      never absorbed silently. A review protocol that is quietly deviated from
      is worth less than one never declared, because it still reads as
      rigorous.

  completion_gate:
    - "j2_seal_manifest.yaml exists, carries the sha256 of j2_output.json and of j2_blind_rederivation.py, a UTC timestamp, the explicit list of what had been read at sealing time, and the re-deriver's own disclosed choices for the start-draw PRNG and the tie-break stream."
    - "The seal demonstrably PRECEDES any read of a review_plan.blind_rederivation.blind_from path, and the report's review_attestation records blind_from_respected honestly."
    - "j2_output.json reports, per seed, TopShare, StaticCov, margin and sign, plus pass_count and verdict, at (N = 2^24, T_sel = 128, r = 2) for a = 1/16 and a = 1/8 at minimum, with the comparison against the producer's verdicts stated at verdict and sign level."
    - "j1_predicate_audit.md audits Section 3 clause by clause against the implementation and states, specifically, whether any exact basin array is in scope at the point the selection weight is computed."
    - "j3_replication_table.json gives, per (a, r = 2, seed), the STAGE 3A margin, the independently recomputed committed a-scan margin, and the absolute difference to at least 6 decimal places -- with the committed values recomputed by the Validator from raw-result.json, not copied from the amendment."
    - "validation_report.yaml gives a per-joint verdict (holds | breaks | inconclusive) for J1, J2 and J3 ONLY, plus run-integrity findings (artifact completeness, manifest fields, seed integrity, raw/summary agreement, exact-coverage non-exceedance), and carries the review_attestation block with joints_owned, sources_read, read_sibling_reports and verdict."
    - "No file outside write_scope was created, edited or deleted; no ledger record was written; no run record, specification or amendment was modified."

  return_format: >-
    validation_report.yaml at the declared path, with the review_attestation
    block. Report on J1, J2 and J3 and on run integrity. Do NOT issue a
    whole-claim verdict, do not recommend a hypothesis status, and do not
    write any ledger record -- the Coordinator composes the joints and the
    ledger-archive task files the decision.
