    that produced it computes the predicate the amendment defines rather than
    a nearby one. EXP-ECDLP-6ac801's committed a = 1/8 disagreement
    (EV-ECDLP-2e9680, blind 1/5 against production 5/5) was root-caused to
    exactly such a gap -- a selection rule the contract named but never wrote
    down -- so this joint is not a formality.

