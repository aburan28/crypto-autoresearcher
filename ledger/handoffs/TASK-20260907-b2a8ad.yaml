  constraints:
    - "INDEPENDENT SESSION, MUTUALLY BLIND. You may not read the Red Team TASK-20260907-ee1ca7's report, notes, scratch files or task directory in this round (review_plan.blindness.mutual: true, lifted_for: []). Your review_attestation must record `read_sibling_reports: false` honestly. If you read one by accident, say so -- an undeclared sibling read is worse than a declared one."
    - "J2 ORDERING IS ABSOLUTE. Write your independent implementation, run it, and SEAL the result -- a hashed, timestamped artifact (j2_seal_manifest.yaml carrying the sha256 of j2_output.json and of your own code) -- BEFORE opening ANY path in review_plan.blind_rederivation.blind_from. Then, and only then, compare. Your attestation records `blind_from_respected: true|false` and the honest list of everything you actually read."
    - "J2 IS A RE-DERIVATION, NOT A REPLICATION. Do not import, read, port, or consult source_v2/ or source_v3/. Implement the predicate from the amendment's Section 3 text and its parameter table alone. Reading P2 (`reading_P2_instrument_family`) explicitly INVITES your own uniformly random function on Z_N with your own independent Bernoulli(theta) DP marking; you are NOT trying to reproduce mix64. What you must match exactly is T, T_sel, a, W, cap, r, the seed count, the pool procedure, and above all the selection weight and tie-break."
    - "AGREEMENT IS AT VERDICT AND PER-SEED-SIGN LEVEL, NOT MAGNITUDE. Different random-function families give different margin magnitudes at the same (a, r, seed); EV-ECDLP-2e9680 measured exactly that (blind -0.030..-0.052 against production -0.008..-0.036 at a = 1/4, same sign every seed). A magnitude difference is EXPECTED and is not a break. A per-cell VERDICT difference, or a per-seed SIGN difference, is -- report it as a break and do not explain it away."
    - "SELECTION MUST USE POOL EVIDENCE ONLY. In your own implementation and in your audit of the producer's, STATIC(T)_r is chosen by w(d) = S_d + 4*W*h_d, never by true basin size. Exact basin sizes SCORE a selection; they never MAKE one. This is the confound that produced the 6ac801 disagreement and it is now a named invalidation rule of the amendment."
    - "YOU MAY WRITE ONLY UNDER your own task directory. You author no ledger record of any kind, change no status, and do not edit, repair or re-score any executor artifact, run record, specification or amendment."
    - "A DEFECT IS A FINDING, NOT A FIX. If a run is missing an artifact, a manifest lacks a required field, raw-result.json disagrees with summary.json, a seed is duplicated, or StaticCov exceeds TopShare, record it precisely and let it block. Do not repair it."
    - "AN INFRASTRUCTURE FAILURE IS NEVER MATHEMATICAL EVIDENCE. If a run timed out, crashed or hit the memory ceiling, that is failed_infrastructure. It is not evidence against G3-feasibility at any a (AGENTS.md core rule 5)."
    - "INFERENCE: requested policy review-breakthrough at `max`, independent session required, fallback_allowed false, degraded_allowed false. This policy is `degradable: false` in orchestration/model-policies.yaml -- there is nothing a Coordinator can sign for. If the backend cannot serve `max`, REFUSE AND REPORT. The claim then stays un-promoted; the campaign does not stop and the review is not downgraded (AGENTS.md 'Goals are never paused', point 2)."
    - "CITATION PROVENANCE on every reference you make: recalled | retrieved | kb | internal. A `recalled` source is a pointer for a later reader, never support."

