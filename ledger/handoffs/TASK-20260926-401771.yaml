  constraints:
    - id: VC-1
      text: >-
        BUILD FROM THE STATEMENT. Your own F_{2^19} arithmetic modulo
        t^19 + t^5 + t^2 + t + 1; your own S_3 from KN-TECH-b18366, self-tested
        on at least 100 point pairs of the literal curve (A = 46693,
        B = 306147; P and Q of inputs.literal_parameters, or points you find);
        your own descent to f_0..f_18 by TWO routes that must agree (symbolic
        expansion in F_{2^19}[v_0..v_19] with v^2 = v, and interpolation of
        each output bit from direct evaluation); your own Boolean-ring
        monomial product and XOR; your own E_layout codec from the
        specification's object.E_layout; your own column order
        column_order(4, 20) rebuilt from the text of FORMAT ann-v1 ("all
        multilinear monomials of degree <= 4 in v_0..v_19 sorted by (-degree,
        bitmask ascending)"). Record every ambiguity and your reading.
    - id: VC-2
      text: >-
        SYSTEM BINDING AND REBUILD. Key each certificate to its system by its
        `key`. Curve-algebra systems (S3-U400, S3-SAT100, F-RANDX19): rebuild
        E_S3(x_R) from x_R and compare with the archived E_hex decoded by your
        codec; a mismatch is a finding (report the system and the first
        differing (row, column)). N-CONV19: rebuild the quadratic columns
        21..210 from the slot's x_R and compare. Synthetic systems (N-CONV19's
        drawn part, N-ELL19, N-F219, N-AFF19): decode from E_hex and check the
        structural constraints the specification states (rows inside the
        union support U computed by your own affine decomposition; N-ELL19 row
        18 equal to ell_lin + c; N-CONV19's linear and constant part inside
        S_L). Stream replays of the synthetic arms are OPTIONAL; if done,
        declare them. Check each archived E_sha256.
    - id: VC-3
      text: >-
        SATISFIABILITY. s by your own exhaustive evaluation over all 2^20
        assignments, for EVERY kept system in instances.jsonl.gz; compare with
        the archived s; check every listed solution of every satisfiable
        control. A verified refutation certificate on a system with s >= 1
        means YOUR construction or checker is wrong: stop and report it.
    - id: VC-4
      text: >-
        VERIFY EVERY REFUTATION CERTIFICATE. flat-v1: build sum over (mu, k) in
        C of mu*f_k in B and check it is exactly 1; record max |mu|; it counts
        toward M_4 only at max |mu| <= 2 and never toward W_4 otherwise.
        wdag-v1: evaluate every node from its rows and prods and check rules
        (a)-(e) as frozen, with every degree taken AFTER multilinear
        reduction; record per certificate: key, closure, format, verified
        true/false, the first violated rule, node count, maximum prods depth,
        maximum node degree, and, on failure, the residual's size and five of
        its monomials.
    - id: VC-5
      text: >-
        VERIFY EVERY ann-v1 CERTIFICATE by (A1)-(A3) as frozen: (A1) every row
        of YOUR M_4 (4009 rows) is annihilated by every functional; (A2) for a
        basis K of S cap B_{<=3} computed by YOUR OWN elimination,
        lambda(v_j k) = 0 for every k in K, j in 0..19, lambda in L; (A3) some
        lambda has lambda(1) = 1. Record per certificate the size of L, each
        rule's result, and the dimension of S you computed. If
        annihilators-nonarchived.json lists any certificate not archived,
        record it as not verifiable here.
    - id: VC-6
      text: >-
        M_4 NON-REFUTATION WITNESSES ON THE PRIMARY ARM. For every S3-U400
        system, decide 1 in rowspace(M_4) with your own elimination. Where 1 is
        absent, extract one functional lambda on B_{<=4} with lambda(row) = 0
        for every M_4 row and lambda(1) = 1, check it, and write it (hex, in
        the ann-v1 coordinate order) to m4-witnesses.jsonl.gz. Where 1 is
        present, emit your own flat certificate with max |mu| <= 2 and check
        it. This is the only author-independent evidence for the primary
        arm's M_4 non-refutations.
    - id: VC-7
      text: >-
        YOUR OWN NEGATIVE CONTROLS, for EVERY (closure, arm, format) kind
        present in the two certificate files, at least 5 each: (a) one row
        removed; (b) one k changed; (c) one mu changed to another monomial of
        the same degree; (d) a degree-discipline violation (wdag-v1: a prods
        child of degree 4, or a one-node wdag-v1 with |mu| = 3; flat-v1
        submitted as M_4 with |mu| = 3); (e) a certificate transplanted onto
        another system of the same arm; for ann-v1: (f) a functional added
        that is nonzero on a named M_4 row; (g) L with every functional's
        constant coordinate cleared; (h) the annihilator of M_4 alone on a
        system where your W_4 differs from M_4, if such a system exists
        (otherwise declare (h) vacuous with the reason). Declare the seed or
        rule used to pick positions. All must reject.
    - id: VC-8
      text: >-
        TABULATE per (closure, arm, format): submitted, verified, rejected,
        max |mu| distribution, node-count and depth distributions; per arm:
        systems rebuilt / decoded, E_hex matches, s matches; and the VC-6
        witness count. No reading of what the counts mean for the hypothesis.
    - id: VC-9
      text: >-
        SEAL, THEN READ. Write verification.json and m4-witnesses.jsonl.gz
        first and record their sha256 and the UTC time in seal.txt. Only then
        may you open the run's reports (never a must_not_read file), and only
        then write validation-report.yaml. Never change a sealed file; a
        correction goes to verification-v2.json with a note.
    - id: VC-10
      text: >-
        VERDICT ON J1: `holds` if every certificate verifies under your
        construction, every counted refutation has a certificate of the format
        its metric requires, every ann-v1 verifies, every archived
        curve-algebra E_hex is reproduced, every s agrees, and every negative
        control rejects; `breaks` if any certificate fails under a
        construction whose self-tests pass (show the residual or the violated
        rule), or an s disagrees, or a primary system's M_4 contains 1 while
        the run records it as not refuted by M_4; `inconclusive` if a failure
        localises to the key mapping or to a convention you could not fix
        from the text (name the clause). Report on J1 ONLY; no whole-claim
        verdict.
    - id: VC-11
      text: >-
        ZERO TRIALS. Verification computations only; no RUN id; no git write;
        write only in your directory; memory cap 3 GB. A timeout is
        infrastructure, never a result. CONTINUATION: write a skeleton
        verification.json first and fill it file by file; if this session is
        killed, a fresh session of the same role continues THIS card from its
        own partial artifacts and the declared inputs only, re-checks every
        completed section, and records which sessions wrote the output.
    - id: VC-12
      text: >-
        DISCLOSED PRIOR (review-plan PD-R1). The Coordinator's review prior was
        written after it read the run's results. Attack J1 on its merits; do
        not compensate in either direction.
    - id: VC-13
      text: >-
        INDEPENDENCE SELF-CHECK before returning: run `python3
        tools/check_review_independence.py --plan
        coordination/review/certbin-20260926-d7249d/review-plan.yaml --reports
        coordination/review/certbin-20260926-d7249d/reviews/TASK-20260926-401771/`
        and paste its output into validation-report.yaml. Problems naming
        other tasks are expected at this stage; a problem naming
        TASK-20260926-401771 is fixed in your attestation before you return.
        Also grep your code/ for "crypto_autoresearcher" and record the result
        (it must be empty).

