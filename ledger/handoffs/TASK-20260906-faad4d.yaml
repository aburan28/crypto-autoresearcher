handoff:
  id: TASK-20260906-faad4d
  from: coordinator
  to: idea-generator
  objective: 'Generate one or two schema-complete proposals bound to RQ-GRUMPY-964876: the exact average-case
    constant c of the Bernstein-Lange two-grumpy-giants-and-a-baby algorithm (expected group additions
    c*sqrt(l)*(1+o(1)) over a uniform target in a generic prime-order group at a declared step schedule).
    The sound verifier is exhaustive enumeration: at toy l the all-target mean is an exact integer ratio,
    so any closed form, bound or asymptotic constant must be checked against exhaustive means before it
    is believed. Candidate shapes: (i) a proof-oriented proposal deriving c from the first-collision time
    of the three sequences, carrying a proof_search_map (bottleneck, baseline reproduction against the
    BSGS 1.5-type constants recorded in KN-LIT-7291, observation-collision search, quantifier order over
    schedule and cost unit, method ceiling, nearby-object control such as plain BSGS or a single grumpy
    giant); (ii) a measurement proposal whose instrument is the exhaustive per-target operation count
    on Z/l across a ladder, with the elliptic arm as a consistency check, the negation-map variant as
    a separate parameter, and a declared extrapolation model for the limit. Screen the recalled literature
    (Galbraith, Wang and Zhang on baby-step giant-step variants) by opening it with WebFetch if you can;
    if you cannot open it, cite it as recalled and cap novelty at unverified.'
  uncertainty_reduced: Whether the user-named target 'exact average-case constant of the two-grumpy-giants-and-a-baby
    algorithm' admits an object-first, falsifiable proposal with a sound verifier that no existing record
    already covers.
  inputs:
  - coordination/ideation/targets-20260906-76d6dc/tasks/TASK-20260906-faad4d/context.md
  - ledger/questions/RQ-GRUMPY-964876.yaml
  - knowledge/literature/KN-LIT-7291.md
  - ledger/proposals/IDEA-20260901-753636.yaml
  - ledger/questions/RQ-ECDLP-165d4b.yaml
  - AGENTS.md
  - agents/idea-generator.md
  - docs/inventor-protocol.md
  - docs/target-result-profile.md
  - templates/research-records.md
  - ledger/proposals
  - knowledge/literature
  - knowledge/techniques
  constraints:
  - Use exactly the assigned IDEA ids and write only their files; never overwrite; never run git; file
    one proposal if only one genuinely distinct candidate survives screening -- never pad.
  - 'THE crypto-kb RETRIEVAL INDEX IS EMPTY THIS SESSION ('':memory:'', verified by the orchestrator):
    do not call search_knowledge; screen by reading; cap novelty_status at unverified unless you actually
    opened a primary source (provenance retrieved, verified_by naming this task). WebFetch is available
    for opening sources.'
  - 'Every proposal is a complete idea record per agents/idea-generator.md: claim, mechanism, novelty_status
    and novelty_screen, citations with provenance (user-supplied framing is provenance internal citing
    the RQ record), assumptions, predictions with named metrics and minimum_effect, minimal_test with
    controls and a null object of the same shape, a decay parameter, falsification_conditions, confounders,
    interpretation_limits (claim_tier toy), heuristic_assumptions with validation routes, target_complexity
