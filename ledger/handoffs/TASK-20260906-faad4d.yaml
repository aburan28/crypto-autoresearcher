    memory_gb: 4
    maximum_runs: 1
  completion_gate:
  - One or two schema-complete proposals bound to RQ-GRUMPY-964876, mechanism-distinct from every screened
    record with the nearest record and exact delta named.
  - Each proposal names the step schedule family, the cost unit and the negation-map setting it claims
