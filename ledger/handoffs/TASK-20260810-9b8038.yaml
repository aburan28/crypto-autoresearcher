handoff:
  id: TASK-20260810-9b8038
  recorded_at: '2026-08-10'
  from: coordinator
  to: coordinator
  objective: >-
    Adjudicate a genuine two-lane conflict on GOAL-ECDLP-001's head. Two
    concurrent sessions each opened a design-repair successor batch on
    2026-08-09, each from a real closed parent with a real parent decision:
    BATCH-ae8019 (parent BATCH-c3c474, decision DEC-20260809-d5ff80) on
    origin/main, and BATCH-ea56c5 (parent BATCH-ece945, decision
    DEC-20260809-6bd04d) on this branch. Determine, from record contents, which
    lane the goal continues on -- or that both are live -- and write the
    superseding record that says so and cites both.
  uncertainty_reduced: >-
    Whether GOAL-ECDLP-001 has one live successor lane or two, and which batch
    its head must name. Until this is settled the branch cannot merge
    origin/main, so NO batch can open on ANY goal: the merge is repository-wide
    and `/launch-research-harness` step 8 requires the branch current with main
    before dispatching. This single conflict parks the whole harness.
  inputs:
    - AGENTS.md
    - agents/coordinator.md
    - ledger/goals/GOAL-ECDLP-001/goal.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-ea56c5/batch.yaml
    - ledger/goals/GOAL-ECDLP-001/checkpoints/
    - ledger/decisions/
    - coordination/reconciliation/RECON-20260810-003/main_side/
    - coordination/reconciliation/RECON-20260810-002/tasks/TASK-20260810-55845c/change_log.md
  constraints:
    - >-
      READ coordination/reconciliation/RECON-20260810-003/main_side/ FIRST. You
      have no shell and CANNOT run `git show`, so that directory is the only way
      you can see origin/main's side of this conflict. It contains main's
      BATCH-ae8019 opening record, its goal-head excerpt, both parent decisions
      and the BATCH-c3c474 checkpoint, extracted verbatim by the orchestrating
      session. Treat it as origin/main's committed content, not as a working
      draft.
    - >-
      DO NOT RESOLVE THIS BY PICKING THE SIDE THAT IS ALREADY WRITTEN HERE. This
      branch currently says BATCH-ea56c5, and that is an accident of which
      session you happen to be running in, not evidence. TASK-20260810-55845c
      concluded BATCH-c3c474's lane "terminates closed -- no committed record
      names any successor" and that conclusion was FALSE: BATCH-ae8019 declares
      exactly that parentage and was on main the whole time. The audit simply
      could not see it. Weigh both lanes on their records.
    - >-
      BOTH LANES MAY BE LIVE, and that is a legitimate finding. Two design-repair
      batches descending from two different closed parents is not necessarily a
      contradiction. If both are live, say so plainly: the head names one, the
      other is declared explicitly in the record with its own status, and neither
      is silently dropped.
    - >-
      CORRECT BY SUPERSESSION AND CITE BOTH. Do not edit, delete, or overwrite
      either lane's committed batch record, decision or checkpoint. Preserve the
      existing current_batch_id note verbatim and add the adjudication alongside.
    - >-
      THIS IS A RESEARCH-STATE JUDGEMENT, not bookkeeping, and it must be
      recorded as one. Say which lane the goal continues on and WHY, in terms of
      what each lane's objective actually repairs. Do not decide it on which
      branch is newer, which commit is later, or which session got there first.
    - >-
      You may NOT resolve the git merge. You produce the record; the orchestrating
      session performs the merge afterwards using your ruling. Do not write
      conflict markers, and do not attempt to reconstruct main's file.
    - >-
      No sha, commit ordering, or reachability. You have no shell; anything
      needing one stays UNRESOLVED and is named.
    - >-
      If the records genuinely do not settle it, say UNRESOLVED and name exactly
      what would. A wrong ruling here silently discards one session's research
      lane, which is far worse than an honest deferral.
  deliverables:
    - adjudication.md
    - ruling.yaml
  artifact_paths:
    - coordination/reconciliation/RECON-20260810-003/tasks/TASK-20260810-9b8038/adjudication.md
    - coordination/reconciliation/RECON-20260810-003/tasks/TASK-20260810-9b8038/ruling.yaml
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 2400
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
    - >-
      ruling.yaml states LANE_AE8019 | LANE_EA56C5 | BOTH_LIVE | UNRESOLVED, the
      head value that follows from it, and the committed records whose CONTENTS
      settled it -- for each lane, its parent batch, parent decision, and what
      its objective repairs.
    - >-
      Both lanes are addressed by name. Neither is dismissed without a reason
      grounded in a record, and the losing lane (if any) has its disposition
      stated: superseded, parallel, or to be closed by a named successor act.
    - >-
      The ruling states explicitly what it does NOT decide -- it opens no batch,
      authorises no run, and moves no hypothesis status.
    - >-
      adjudication.md records that TASK-20260810-55845c's "no successor exists"
      premise was false and why an audit could not have seen otherwise, so the
      same inference is not repeated by the next concurrent session.
    - >-
      The exact merge instruction for the orchestrating session is stated: which
      value current_batch_id must carry after the merge, and what must be
      preserved from each side.
  return_format: >-
    YAML terminal verdict: ruling, resulting head value, disposition of the other
    lane, the merge instruction, paths written, and anything left UNRESOLVED.
