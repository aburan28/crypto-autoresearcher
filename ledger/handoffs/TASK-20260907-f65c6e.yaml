  task_card: coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-e9fd22/tasks/TASK-20260907-f65c6e/task_card.yaml
  role: coordinator
  from: coordinator
  to: coordinator (approval gate)

  objective: >-
    THE APPROVAL GATE. Decide whether EXP-ECDLP-6ac801 specification.v2.yaml is
    approved as frozen, revised, or refused, and record that decision as
    DEC-20260907-4e34c5. If approved, set exactly four gate fields on
    specification.v2.yaml (status: approved, approved_by: coordinator,
    frozen: true, execution_authorized: true) plus one additive approval_note,
    and the matching approved_by/approved_at/status on the amendment record.
    Nothing downstream in this batch may run until this task and its ledger
    archive TASK-20260907-ceb8cf complete.
  uncertainty_reduced: >-
    Whether the amended v2 protocol is fit to execute: whether the corrected
    STATIC(T)_r definition is stated precisely enough that an independent
    re-deriver can derive the quantity from the contract alone (the exact defect
    that produced v1's a = 1/8 disagreement), and whether the declared controls,
    seed count, interval rule and stopping rules are adequate before any compute
    is spent.

  inputs:
    - experiments/EXP-ECDLP-6ac801/specification.v2.yaml (the proposed contract)
    - experiments/EXP-ECDLP-6ac801/amendments/v1_to_v2.yaml (PA-ECDLP-6ac801-v1-to-v2)
    - experiments/EXP-ECDLP-6ac801/specification.yaml (frozen v1, for the additive check)
    - ledger/decisions/DEC-20260907-9b1b02.yaml (the RANK 1 this amendment discharges)
    - coordination/experiments/EXP-ECDLP-6ac801/batches/BATCH-3c7493/tasks/TASK-20260907-80e198/validation_report.yaml (`a_1_8_disagreement_root_cause`)
    - experiments/EXP-ECDLP-612fb1/source_v2/instrument.py (`Pool.weights`, to confirm the amendment's formula matches what production computes)
    - docs/inventor-protocol.md (controls before belief; the obstruction and null-object standard)
    - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-e9fd22/archives/TASK-20260907-4ce154/snapshot-receipt.json (the committed base this decision rests on)

  constraints:
    - >-
      READ THE FORMULA AGAINST THE IMPLEMENTATION BEFORE APPROVING. The single
      substantive question at this gate is whether
      `definitions.STATIC(T)_r exact coverage (v2, CORRECTED, item a)` is (i)
      the same rule Pool.weights actually computes and (ii) derivable by someone
      who never opens Pool.weights. If either fails, REVISE -- approving a
      second underspecified definition would reproduce the exact failure this
      amendment exists to repair.
    - >-
      APPROVAL IS NOT AUTOMATIC AND REFUSAL IS A LEGITIMATE OUTCOME. Record
      `revise` with concrete defects, or `reject`, if the contract is not fit.
      A revision loops back through a new amendment version and a new approval
      gate; it does not edit this one in place.
    - "If approved, change ONLY the four gate fields plus an additive approval_note. Every other byte of specification.v2.yaml stays exactly as designed."
    - "specification.yaml (v1) is not touched under any outcome. No BATCH-3c7493 artifact is touched. No hypothesis status changes."
    - "Do not restate any per-cell verdict, margin or numeric result from BATCH-3c7493 in the decision record's rationale in a form that a later blind re-deriver would encounter -- DEC-20260907-4e34c5 is not on the Stage A' blind_from list and must not become a leak channel."
    - "Mint nothing: DEC-20260907-4e34c5 is pre-reserved by this handoff. Confirm it with `python3 tools/allocate_id.py --check coordinator_decision DEC-20260907-4e34c5` before writing it."

  deliverables:
    - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-e9fd22/tasks/TASK-20260907-f65c6e/approval_review.yaml (the gate's own worked check, see artifact_paths_note)
    - ledger/decisions/DEC-20260907-4e34c5.yaml (approve | revise | reject, with rationale and evidence references)
    - experiments/EXP-ECDLP-6ac801/specification.v2.yaml (gate fields set, if and only if the decision is approve)
    - experiments/EXP-ECDLP-6ac801/amendments/v1_to_v2.yaml (approved_by / approved_at / status set to match)

  artifact_paths:
    - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-e9fd22/tasks/TASK-20260907-f65c6e/approval_review.yaml

  artifact_paths_note: >-
    ledger/decisions/DEC-20260907-4e34c5.yaml is AUTHORED here and OWNED by the
    ledger archive TASK-20260907-ceb8cf, because the dispatcher permits exactly
    one declared owner per path and a ledger archive is required to own an exact
    artifact under ledger/decisions/. This task's own owned artifact is
    approval_review.yaml: the worked record of the one substantive check this
    gate performs -- reading `definitions.STATIC(T)_r exact coverage (v2,
    CORRECTED, item a)` side by side with `Pool.weights` in
    experiments/EXP-ECDLP-612fb1/source_v2/instrument.py, and separately asking
    whether the stated formula is derivable by someone who never opens that
    file. Writing that check down is what stops the approval from being a
    signature; the same reasoning appears in the completion gate.

  write_scope:
    - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-e9fd22/tasks/TASK-20260907-f65c6e/approval_review.yaml
    - ledger/decisions/DEC-20260907-4e34c5.yaml
    - experiments/EXP-ECDLP-6ac801/specification.v2.yaml
    - experiments/EXP-ECDLP-6ac801/amendments/v1_to_v2.yaml

  archived_by: TASK-20260907-ceb8cf

  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false

  budget:
    wall_clock_seconds: 3600
    memory_gb: 2
    maximum_runs: 0
    budget_note: "Zero-compute decision task; memory is machine protection."

  completion_gate:
    - "approval_review.yaml exists and records the formula-versus-implementation comparison line by line, plus an explicit answer to whether the stated formula is derivable from the contract text alone by a reader who never opens instrument.py."
    - "DEC-20260907-4e34c5 exists, parses, carries an explicit decision verb, rationale, evidence_refs, limitations and next_actions, and states whether the amendment's formula was checked against experiments/EXP-ECDLP-612fb1/source_v2/instrument.py by reading both."
    - "If the verb is approve: specification.v2.yaml carries status approved, approved_by coordinator, frozen true, execution_authorized true, and a diff against the proposed version touching only those four fields plus approval_note."
    - "If the verb is revise or reject: specification.v2.yaml still carries execution_authorized false, the concrete defects are enumerated in the decision, and the successor amendment version is named."
    - "experiments/EXP-ECDLP-6ac801/specification.yaml is byte-identical to sha256 dfd4047f467b2faab12f179e6907a11f53d72ca6d1239836c0b162c7369a82b9."
    - "tools/validate_ledger.py reports no NEW error naming a file this task wrote."
