handoff:
  id: TASK-20260810-ccfeb4
  recorded_at: '2026-08-10'
  goal_id: GOAL-MD5-001
  question_id: RQ-MDFIVE-6870c1
  batch_id: BATCH-46254b
  task_card: coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/task-cards/TASK-20260810-ccfeb4.md
  role: coordinator
  from: coordinator
  to: coordinator
  objective: >-
    Write and commit, alone, the two independent review reports, the batch
    evidence record EV-MDFIVE-1d470b, and the closing decision
    DEC-20260810-1163ec, scoped strictly to what the two reports actually
    support, and publish them on a branch carrying an open PR against main.
  uncertainty_reduced: >-
    Whether this batch's disposition - gates discharged or not, BCP-1 sound or
    amended - is durable, auditable, published, and no larger than its two
    reviews support. Five other campaigns will cite it.
  inputs:
    - TASK-20260810-23e0ea validation report
    - TASK-20260810-b9d956 red-team report on BCP-1
    - DEC-20260810-9942ea, the opening decision this one closes against
    - >-
      the three snapshot receipts, which establish what was actually committed
      and in what order
  constraints:
    - >-
      SC-1 FABRICATE NOTHING. No invented timing, measurement, throughput,
      citation, review verdict, model identifier or commit SHA. A field that is
      not yet knowable stays null and is named as such.
    - >-
      SC-2 CLAIM CEILING. Assert nothing about MD5 - no collision, no preimage,
      no complexity, no method ceiling, no obstruction, and no comparison
      against any published result in either direction. The evidence record's
      claim tier reflects a protocol freeze, an implementation pin and a
      literature filing, and nothing else.
    - >-
      SC-3 UNVERIFIED FIGURES STAY MARKED. Any figure the acquisition did not
      obtain in primary text stays marked unverified in the evidence record, and
      the RQ's flagged apparent error is carried forward as settled or unsettled
      exactly as TASK-20260810-bde128 found it.
    - >-
      SC-4 A failed, halted or exhausted search is a BUDGET OUTCOME about a
      solver and NEVER evidence about MD5 (AGENTS.md rules 5 and 8). A producer
      that halted on budget is recorded as halted, not as negative.
    - >-
      SC-5 Anything not attempted is named OPEN AND UNATTEMPTED and is never
      recorded as tried, screened or negative. The blind calibration search was
      not attempted in this batch and must be recorded that way.
    - >-
      SC-6 Approve no experiment and change no hypothesis, question or goal
      status beyond what this batch's own decision records; record no
      attestation and no completion_quorum block.
    - >-
      SC-7 Halt at the declared wall_clock_seconds and report the halt
      truthfully as infrastructure signal, naming the dropped work as scope
      rather than as an answer.
    - >-
      SC-8 Never select, configure, probe, contact or use Amazon Bedrock
      (AGENTS.md rule 16).
    - >-
      Run alone. Stage exactly the two review reports, the two ledger records,
      and this task's own receipt. Stage nothing else.
    - >-
      Fill knowledge_promotion explicitly. A KN-FIND promotion requires a
      support or reject_scoped decision on replicated or strong evidence, and a
      gate batch that reviews no cryptanalytic result supplies neither, so state
      the concrete not_warranted reason rather than leaving the field empty. Note
      separately that KN-LIT entries filed by TASK-20260810-bde128 are
      acquisition, not promotion, and do not satisfy this field.
    - >-
      IF THE RED TEAM FINDS BCP-1's BLINDNESS GUARANTEE PARTIAL OR CEREMONIAL,
      RECORD THAT AS THE RESULT. It is the cheapest and most valuable outcome
      this batch can produce, it is a statement about this program's protocol and
      not about MD5, and it must reach the dependent goals rather than being
      smoothed into a pass. BCP-1 is immutable once committed: a fix is a
      superseding protocol record under a new id in a later batch, never an edit.
    - >-
      Fetch origin/main and MERGE it into the working branch before committing;
      never rebase. Record the base commit checked and the merge outcome.
    - >-
      Checkpoint the committed goal record after this archive and preserve
      exactly one next action.
    - >-
      Push the branch and open or refresh the PR naming EV-MDFIVE-1d470b,
      DEC-20260810-1163ec, BATCH-46254b and the task IDs.
  deliverables:
    - >-
      EV-MDFIVE-1d470b.yaml, the batch evidence record, citing the exact task
      and review IDs
    - >-
      DEC-20260810-1163ec.yaml, the closing coordinator decision with
      knowledge_promotion filled
    - ledger-receipt.json under this task's archive directory
  artifact_paths:
    - ledger/evidence/EV-MDFIVE-1d470b.yaml
    - ledger/decisions/DEC-20260810-1163ec.yaml
    - >-
      coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/archives/TASK-20260810-ccfeb4/ledger-receipt.json
  archived_by: TASK-20260810-ccfeb4
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 300
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
    - >-
      The archive verifier accepts the parent, the declared path set, hashes,
      reachability, and every archive.record_ids identifier in the commit
      message.
    - >-
      EV-MDFIVE-1d470b exists, cites the exact task and review IDs, and asserts
      nothing about MD5.
    - >-
      DEC-20260810-1163ec records only what the two independent reports support,
      fills knowledge_promotion with a promoted entry or a concrete
      not_warranted reason, and records no attestation and no completion_quorum
      block.
    - >-
      Any red-team finding that BCP-1's blindness guarantee is partial or
      ceremonial is recorded as a result rather than softened, and no edit to
      BCP-1 was made.
    - >-
      The blind calibration search is recorded as OPEN AND UNATTEMPTED in this
      batch.
    - >-
      The goal record is checkpointed after this archive with exactly one next
      action preserved, the branch is pushed, and the PR names EV-MDFIVE-1d470b
      and DEC-20260810-1163ec.
  return_format: >-
    A summary naming the three written paths, the commit and parent as observed,
    the disposition each of the two independent reports actually supports, the
    knowledge_promotion field as filled with its concrete reason, the record that
    the blind calibration search was OPEN AND UNATTEMPTED, the goal checkpoint
    with its single preserved next action, the origin/main base commit checked
    and the merge outcome, and the PR reference.
  reservation_note: >-
    EV-MDFIVE-1d470b and DEC-20260810-1163ec are RESERVATIONS at the time this
    handoff record is written. Neither exists on disk, and both are deliberately
    absent from the target_ids of DEC-20260810-9942ea because target_ids
    references committed records. They are named here as the exact identifiers
    this task is to write into. If this batch closes without producing an
    evidence-bearing package, EV-MDFIVE-1d470b is simply never written; an unused
    reservation is not a retracted claim.
