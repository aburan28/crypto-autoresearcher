    failure mode symmetric with overclaiming.
  - Contest numbers where you can reproduce a contradiction, and keep objections about what the
    numbers MEAN distinct from objections about whether they are SOUND. Change no record status,
    edit no producer artifact, and do not apply batch.yaml's reading rule (though the rule itself
    is an explicit target).
