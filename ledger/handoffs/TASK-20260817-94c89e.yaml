    it let a real effect be dismissed as noise?
  - ATTACK THE ARM ASSIGNMENT. Was choosing the extreme members (5000, 8002) over the mid-range
    members (6000, 8001) a defensible power argument or a selection that flatters the design? Would
    including 6000 or 8001 have changed what can be concluded? Was exceeding the directive's
    two-cell minimum with a four-cell factorial an improvement or scope creep?
  - ASSESS THE DISJOINTNESS-STRENGTH ASYMMETRY. Arm A gets a direct cross-process check and Arm B
    only the adapted one. Does that asymmetry itself bias the comparison between the arms? Is the
    claim that Arm A's check "narrows but does not close" Arm B's gap correctly scoped?
  - SAY WHAT IS STILL NOT KNOWN AFTER THIS TASK, and name the SINGLE CHEAPEST next control that
    would resolve it. If your honest position is that this instrument family should stop rather
    than continue, say that plainly and give the evidence -- but do not treat a target as saturated
