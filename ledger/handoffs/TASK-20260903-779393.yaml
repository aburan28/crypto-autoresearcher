  - Verify that AMEND-1 is quoted verbatim from DEC-20260901-6f9de3 and applies to every analysis-bearing receipt the design would produce, including the saturation-aware overflow identity at the proposed exposure, and that the stated build-identity and freeze-digest claims match the snapshot-bound lineage hashes.
  - Report on YOUR JOINT ONLY. A blinded reviewer cannot see the other joint by construction, so a whole-claim verdict would be formed from a fraction of the evidence; the Coordinator composes the verdicts.
  - validation_report.yaml must parse with yaml.safe_load and carry a parse attestation plus a review_attestation block (task_id, joints_owned, sources_read, read_sibling_reports, blind_from_respected, verdict in holds|breaks|inconclusive).
  - Write only inside the declared write_scope. Make no commits and change no ledger record.
  - A budget or tooling failure is reported as resource_exhaustion or infrastructure failure, never as a defect in the design.
  deliverables:
  - validation_report.yaml carrying the independent re-derivation written before the pricing file was opened, the comparison against the producer's numbers, the rule-decidability check, the source verification of every reading, the AMEND-1 and custody checks, and a verdict on joint J-P only
