  constraints:
  - 'NEVER read the red-team task directory coordination/goals/GOAL-AES-003/batches/BATCH-b38667/tasks/TASK-20260903-4fdf77. Blindness within this round is mutual and an undeclared sibling read is a violation.'
  - 'BLIND RE-DERIVATION FIRST, IN THIS ORDER: derive the exposure-to-decision arithmetic (pooled exposure; expected counts under the constant-floor, continued-decay and analytic-null hypotheses; exact Garwood 95% CIs at 17, 21, 13, 18 and 12; discrimination power at the stated alpha) from the statement of the quantity and the committed readings alone, in fresh code, and WRITE IT INTO validation_report.yaml BEFORE opening pooled-exposure-pricing.json. Then compare, and localize any disagreement to one of the two named implementations.'
