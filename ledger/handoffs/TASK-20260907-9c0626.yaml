    an expectation, or a numeric value of the quantity under test? SUFFICIENCY:
    could a competent implementer who reads ONLY the allowlisted files compute every
    field the packet's deliverables demand, without opening anything else? The second
    is the expensive one and is not optional -- an allowlist that is leak-free but
    insufficient forces the re-deriver to violate it, which is worse than a denylist.
  - >-
    J5 CONTROL FALSIFIABILITY, ITEM BY ITEM. For every declared control, construct
    or refuse to construct a state of the world in which it fires on a CORRECT implementation.
