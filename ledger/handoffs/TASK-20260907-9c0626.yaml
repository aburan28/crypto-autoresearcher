  - >-
    J7 SCOPE. Is any part of the wide scope added surface for no required purpose?
    RANK 1 did not require a second scale, and DEC-20260907-4e34c5 offered dropping
    it as a complete discharge of D1. Say whether the smaller change is preferable.
