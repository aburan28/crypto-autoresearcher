        imports a solver module. Every command is declared with its seed
        before it runs. Re-executed outputs go to your scratch directory and
        are never written under experiments/.
    - id: VF-5
      text: >-
        MACHINE PROTECTION. ONE computation process at a time (your driver
        plus at most one child), nice 19, OMP_NUM_THREADS,
        OPENBLAS_NUM_THREADS and MKL_NUM_THREADS set to 1, --workers 1 for any
        census job. Poll VmRSS at least once a second and stop any process
        that crosses 2.0e9 bytes; the stop is blocked, not a finding. Launch
        only if the launch facts show at least 6 GB MemAvailable. Stream
        harvest-rows files; never load one whole. Never read, signal or touch
        another session's processes or files.
    - id: VF-6
      text: >-
        AN INFRASTRUCTURE OR PACKAGE DEFECT IS NOT A MATHEMATICAL RESULT. A
        timeout, crash or memory stop in your recomputation is reported as
        blocked. A re-execution that does not reproduce its archived row, or a
        k that fails the disjoint check, is a statement about the run set
        (a validity defect, I-3 or I-5), never evidence for or against the
        floor or any hypothesis.
    - id: VF-7
      text: >-
        REPORT ON F1, F2, F5 AND F7 ONLY. You cannot see F3, F4, F6 or the
        proves-too-much control by construction. Offer no whole-claim verdict,
        no reading of H-PFDR-0cc7e8 or H-PFDR-4765e4, and do not call any
        instance a contradiction, a break or a premise violation. The
        Coordinator composes the round.
