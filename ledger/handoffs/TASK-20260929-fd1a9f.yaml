      disjoint baby-step giant-step at N < 2^32 stores at most 2^16 baby steps
      (tens of MB). The RSS stop at 2.0e9 bytes is about twice the measured
      maximum and below the frozen per-process cap of 3.5e9 bytes. memory_gb
