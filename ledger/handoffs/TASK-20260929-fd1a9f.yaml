    - id: VF-3
      text: >-
        DISJOINT CHECKER (joint F1). The code that decides kP = Q, recomputes
        the target logarithm by rule and solves the logarithm independently
        imports nothing from crypto_autoresearcher and no elliptic-curve
        library. It implements its own affine arithmetic over F_p, its own
