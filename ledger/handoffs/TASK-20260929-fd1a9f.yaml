      refinement_and_reasoning: >-
        (1) The floor is an EXPECTATION bound. In the lemma, E[colliding pairs
        among X encodings] <= X^2/N, and with X = c*S (c encodings per S_3
        unit, declared c = 2) E[r] <= c^2*S^2/N. For a fixed S, Markov's
        inequality gives only P(ratio <= t) <= t^2, which is up to 0.81 at
        t = 0.9. So one instance below 0.9 is not by itself evidence against
        the lemma; the lemma constrains an aggregate. This is the
        Coordinator's derivation sketch, written to be checked (F6), not a
        cited fact. (2) Every fed row is a colliding pair, so A7's on-mode r
        is still bounded in expectation if the premise holds. Multiplicity
        (EV-PFDR-1faf10 OBS-3: M up to about 10 on average at TT m 5, bundles
        up to 234-294 pairs) does not move the mean past the bound. It makes
        r a compound, heavily overdispersed count (index of dispersion up to
        about 444 at SS m 4), and the TT/TB lump fed before the first attempt
        is a single heavy-tailed draw. That is what sends a per-instance
        ratio far below its typical value. (3) The A4 harvest gain (>= 1.3 in
        S_3 at m = 3, 5) moves the on-mode ratio below the census-mode ratio
        by a factor of at least 1.3*sqrt(r_on/r_census). A harvest that uses
        collisions the plain engine computes and discards stays inside the
        lemma, because every collision shares one X^2/N budget, so a downward
        shift is expected and is not by itself a contradiction. Whether it
        crosses 0.9 depends on the census-mode ratio level, which I have not
        read. (4) Post hoc, from keys only: 0 generic firings at m = 3, 10 at
        m = 4 and 11 at m = 5, where the measured overdispersion is largest;
        the structured share of generic firings is 7 of 21, which equals the
        structured share of arms (3 of 9). These are consistent with (2) and
        were known before (2) was written; they are NOT predictions.
