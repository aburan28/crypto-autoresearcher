    multiplicity_and_calibration_controls:
      source: >-
        Carried over from the prior round's plan
        (ledger/handoffs/TASK-20260929-accb8e.yaml, MC-1 to MC-7) and adapted
        to a per-instance tripwire on a ratio, plus one control new to this
        round (MC-8).
      controls:
        - id: MC-1
          text: Every decision-bearing bootstrap endpoint (the F6 aggregate test, the F7 ratio slope and exponent comparison) is recomputed at 20000 replicates or seed-averaged, and its Monte Carlo s.d. is reported against its margin to the threshold.
          owner: TASK-20260929-575e80 (F6); TASK-20260929-fd1a9f (F7)
        - id: MC-2
          text: Seed sweep over at least 200 seeds for every bootstrap decision element and every simulation-based tail probability (F6 b and d, PTM-5), with the flip fraction or the Monte Carlo standard error.
          owner: TASK-20260929-575e80 (F6, PTM-5); TASK-20260929-fd1a9f (F7)
        - id: MC-3
          text: Order invariance. Every A7 value is deterministic, so the firing set must not change under row order or under reading merged/ against the attempt files; any change is a finding.
          owner: TASK-20260929-fd1a9f (F2)
        - id: MC-4
          text: Family-wise calibration of the per-instance predicate over every evaluable instance, under the F6 plug-in null and under the PTM-5 synthetic engine, reported as the expected number of firings and P(at least the observed number) per (panel, m, mode, arm class).
          owner: TASK-20260929-575e80 (F6, PTM-5)
        - id: MC-5
          text: Small-sample interval calibration at five units per rung, re-measured by simulation for each interval this round reads (the prior J5 found 0.86-0.92 coverage against 0.95).
          owner: TASK-20260929-fd1a9f (F7); TASK-20260929-575e80 (F6 c)
        - id: MC-6
          text: Design-evaluated comparators in place of asymptotic ones -- the floor-model exponent at the actual rungs, |F| and r (F7), and the rho comparator at the actual N with setup_ops excluded (PTM-2).
          owner: TASK-20260929-fd1a9f (F7); TASK-20260929-575e80 (PTM-2)
        - id: MC-7
          text: Every convention the text leaves open is written down before computing -- the validator's sealed readings (F2) and the red team's attacks/choices.yaml (F3, F4, F6) -- and attacked by its named alternative.
          owner: TASK-20260929-fd1a9f (F2) and TASK-20260929-575e80 (F3, F4, F6), on different questions
        - id: MC-8
          text: Arm-class multiplicity. Generic firings are compared between structured and random arms at matched m (PTM-4); a structured firing is never read on its own.
          owner: TASK-20260929-575e80 (PTM-4)
    tripwire_routing:
      TW-BREAK: >-
        If, after F1-F7 and the proves-too-much control, a sub-floor reading
        survives on premise-holding generic arms with verified solves, an
        independent-relation r and an aggregate statistic violated beyond its
        calibrated error, the composition records it as an input only: no
        interpretation, no status change, no synthesis statement. Its own
        composition follows under AGENTS.md rule 12, with a derivation-note
        commission and an independent replication on fresh curve seeds
        designed as a separate act.
      TW-SCOPE: >-
        Binding on both reports and the composition. No deployed-curve
        implication, universal impossibility or exponent below rho's.
    hypothesis_readings:
      note: >-
        What happens to H-PFDR-0cc7e8 under each reading. Written now, before
        any reviewer runs. In every case this round changes no status; the
        reassessment is DEC-20260929-bbb3a9 NA-10, after this round composes
        (the Stage 0 composition is already archived: TASK-20260929-091c3a,
        057fa588b). Scope:
        H-PFDR-0cc7e8's test boundary is the committed harvest-off sweep
        rows; the firing rows are EXP-PFDR-1b78f7 harvest-on instances, so any
        reading below bears on H-PFDR-0cc7e8 through its mechanism (the
        lemma) and the "lemma, constants or charging convention" clause of
        its first falsification condition, by an explicitly stated transfer.
      readings:
        - id: RD-1
          if: Accounting or calibration (E1). The generic firings vanish or fall to the calibrated null rate under r_rank, F6 shows the per-instance predicate miscalibrated, and the aggregate lemma statistic is not violated.
          then: >-
            No contradiction. H-PFDR-0cc7e8's prediction (i) ("at least 1.0 on
            every row") and falsification condition 1 are per-row statements
            of an expectation bound; they are restated as an aggregate,
            calibrated statement by a superseding hypothesis record (refine)
            at NA-10. EXP-PFDR-1b78f7 gets an additive protocol_amendment that
            adds the corrected floor reading beside the frozen A7 one, labelled
            post hoc, never re-scoring it. The withheld floor-relative
            readings of EV-PFDR-1faf10 become composable under it.
        - id: RD-2
          if: Premise (PTM-1, F3 premise audit). The known_log and j0_coset firings are premise violations.
          then: >-
            Not evidence against H-PFDR-0cc7e8, whose assumption 2 excludes
            them. They become the floor screen's positive control (it sees a
            known non-generic relation source), recorded as such.
        - id: RD-3
          if: Uncounted encodings (F4 breaks, or F3 finds c = 2 not engine-faithful).
          then: >-
            A7's charging convention is incomplete and is amended additively
            (X_total or the corrected c). If the lemma's own text omits the
            term, H-PFDR-0cc7e8's mechanism needs a corrected constant: refine,
            with a derivation note commissioned before any adverse reading.
        - id: RD-4
          if: Surviving contradiction (TW-BREAK conditions met).
          then: >-
            H-PFDR-0cc7e8 falsification condition 1 in substance. TW-BREAK
            routing; strongest refutation artifact sought first (a derivation
            note locating the failing lemma step; no single instance can
            certify against an expectation bound). No weaken and no
            reject_scoped on this single, unreplicated run set.
        - id: RD-5
          if: A solve is not real (F1 breaks on an instance).
          then: >-
            That instance is invalid (I-3 or I-5) and drops from every reading.
            It goes back to the executor as a validity defect with a scoped
            repair task. Not evidence about H-PFDR-0cc7e8.
        - id: RD-6
          if: Blocked or inconclusive (F1 or F2 blocked, retention gaps).
          then: >-
            Floor-relative readings stay withheld. H-PFDR-0cc7e8 is unchanged,
            and a scoped successor task is opened for what was blocked.
        - id: RD-7
          if: F7 finds no sub-floor trend (or cannot decide).
          then: >-
            Prediction (2) may then be read, scoped to m = 4 small_x and this
            engine, as consistent with floor attainability (or stays withheld
            if undecidable). It is never read as an exponent below rho's.
