        used only to RE-EXECUTE instances (bounded recomputation, VF-4), never
        to check them.
    - id: VF-4
      text: >-
        BOUNDED RECOMPUTATION, EXACTLY AS SCOPED, NO RUN ID. Permitted: the
        re-executions listed under the plan's joint F1 (RS-1 and the controls
        C-a to C-c, about 76 single-key jobs), each at most twice (a second
