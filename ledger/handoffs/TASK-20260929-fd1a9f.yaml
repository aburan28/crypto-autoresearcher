          (MC-1), seed sweep (MC-2), calibrated at five curves per rung
          (MC-5, by your own simulation). (d) The family: the number of
          evaluable instances and the family-wise false-fire rate of the
          predicate under the null (MC-4). Where I think it breaks: the null
          expects several sub-0.9 generic on-mode instances under r_frozen
          and few under r_rank, and the aggregate is not violated.
        breaking_artifact: a null calibration showing the observed generic firing count is expected at a material rate, or conversely an aggregate lemma statistic that is violated beyond its calibrated error on premise-holding arms
      - joint: >-
          F7 -- THE PREDICTION (2) EXPONENT AGAINST THE FLOOR MODEL. The m = 4
          small_x harvest-on S_3 exponent (0.6076 as composed, EV-PFDR-1faf10
          OBS-2) lying below the floor model's (m+1)/(2m) = 0.625 and its
          design-evaluated value is finite-range lower-order terms plus r and
          |F| accounting, not a sub-floor trend.
        assigned_to: TASK-20260929-fd1a9f
        attack_plan: >-
          After the seal. (a) Design-evaluated comparator (MC-6): per m = 4
          small_x on-mode instance, the floor value (1/2)*sqrt(r*N) under
          r_frozen and r_rank; fit its exponent over 12..32 with the frozen
          stats.fit_exponent, and also (1+beta)/2 with beta =
          log|F|/log N per rung. (b) The ratio slope: log2 of the A7 ratio
          against log2 N per (m, base, mode) under r_frozen and r_rank, with
          intervals at 20000 replicates or seed-averaged over at least 200
          seeds (MC-1, MC-2). (c) Calibrate the fit_exponent interval at this
          design (five instances per rung, 11 rungs) by your own simulation,
          at least 1000 synthetic series (MC-5; the prior J5 measured
          0.913-0.916 coverage, re-measure it here). (d) State whether the
          observed exponent lies below the floor-model exponent beyond the
          calibrated error, and whether the gap tracks r/|F| (HEUR-0cc7e8-H2)
          or vanishes in the ratio slope. Where I think it breaks: the ratio
          slope under r_rank is within calibrated error of 0, so the
          exponent gap is lower-order terms.
        breaking_artifact: a ratio slope under r_rank that is negative beyond its calibrated interval (a sub-floor trend), or an exponent comparison that the calibrated interval cannot decide
    blindness:
      mutual: true
      lifted_for: []
      rationale: null
    proves_too_much:
      objects:
        - >-
          PTM-1, known_log on-mode (35 firing instances). Base logs are known
          by construction (F_j = jP), so the conclusion "this instance
          contradicts the generic floor" is KNOWN FALSE (the lemma does not
          apply). Any adjudication rule the round proposes must classify all
          35 as premise violations. Any corrected convention must still place
          them far below the floor, or it has lost the dynamic range to see a
          known non-generic relation source.
        - >-
          PTM-2, the rho panel (R13, 110 instances; j0 rho, 35). A generic
          algorithm with r = 1; "rho beats the generic bound" is KNOWN FALSE.
          Compute walk_ops / sqrt(N) (one encoding per step) and walk_ops /
          ((1/2)*sqrt(N)) (the two-encodings analogue), the fraction below 0.9
          under each, against the birthday prediction 1 - exp(-t^2) for the
          negation-folded collision time, with setup_ops excluded as the
          README requires.
        - >-
          PTM-3, harvest-off rows. The census-mode rows of R10-R12 on random
          arms (solver columns gated identical to harvest off, G2) and the
          committed min_fill sweep rows reproduced by R05 and R06: the plain
          engine on generic bases, where "a non-generic effect" is KNOWN
          FALSE. Under every convention the round proposes (r_rank, X_total,
          c = 1, an aggregate or quantile threshold), count the rows that
          fire.
        - >-
          PTM-4, random arms in on mode (14 of the 21 generic firings).
          Random bases are generic by construction, so "a structural relation
          source" is KNOWN FALSE there. Compare the structured-arm firing
          rate with the random-arm rate at matched m (Fisher), so that no
          structured firing is read as structure unless it exceeds the
          random-arm rate.
        - >-
          PTM-5, a synthetic generic-group engine with uniform logs. Your own
          minimal mitm-with-harvest engine over Z_N with x-keys from a
          uniformly random labelling of +-classes (no curve), table arity
          (m+1)//2, TT, TB and SS star rows, stop at full rank, at N from
          2^12 to at most 2^24 for m = 3, 4, 5, at least 200 instances per
          (m, N). The floor holds in expectation by construction, so every
          sub-0.9 instance here is the predicate's null rate. Compute A7 under
          r_frozen and r_rank.
      failure_signature: >-
        The per-instance predicate, or any convention the round proposes, must
        NOT declare a contradiction on PTM-2, PTM-3, PTM-4 or PTM-5, where the
        conclusion is known false, at more than its calibrated null rate. If
        it fires on rho, on harvest-off random-arm rows, on random arms or on
        the synthetic generic engine at a rate comparable to the observed
        generic firings, then the 21 generic firings are not by themselves
        evidence against the floor. On PTM-1 the adjudication must classify
        every instance as a premise violation and keep it below the floor;
        a convention that lifts known_log above the floor proves too little
        and is reported as such.
      assigned_to: TASK-20260929-575e80
