handoff:
  id: TASK-20260905-82fd16
  from: coordinator
  to: idea-generator
  objective: Convert IDEA-20260831-df4197 into a specified hypothesis (H-AUXIN-66e6fd) and a frozen experiment
    contract (EXP-AUXIN-7e2e3d) for the r-1/r+1 divisor census over the frozen standardized curve list,
    with planted-divisor positive control, safe-prime null control, arithmetic certificate checks, and
    a literature check on prior per-curve tables.
  uncertainty_reduced: Whether the divisor census is fully specified -- frozen curve list, exact cost
    expression, factorization certificates, controls, metrics, budgets, stopping rules -- so a later execution
    batch can run it without reinterpretation.
  inputs:
  - AGENTS.md
  - agents/idea-generator.md
  - templates/research-records.md (hypothesis and experiment specification schemas; copy, do not invent
    fields)
  - 'docs/inventor-protocol.md (object-first generation, lossy-projection test already passed in the idea;
    null-object control before belief; Pareto honesty: dominated_by and sota_delta required)'
  - ledger/ideas/IDEA-20260831-df4197.yaml (the proposal; follow its minimal_test design and controls
    exactly)
  - ledger/questions/RQ-AUXIN-f8d8c0.yaml (the bound question)
  - ledger/goals/GOAL-AUXIN-a93442.yaml (completion criteria C1-divisor half, pause conditions -- especially
    the acquisition-gate and stop-and-escalate clauses)
  - 'ledger/decisions/DEC-20260802-204.yaml (binding acquisition gate: no ordinary-ECDLP improvement language
    anywhere in the design)'
  constraints:
  - 'H-AUXIN-66e6fd status is specified, never approved: approval is the Coordinator''s DEC-20260905-1c2b01
    in this batch''s ledger archive, not this task.'
  - EXP-AUXIN-7e2e3d is a frozen contract with approved_by null. Freeze the curve list in the contract
    (NIST P-224/P-256/P-384/P-521, secp256k1, brainpoolP256r1/P384r1, Ed25519 prime-order subgroup, BN254,
    BLS12-381 group orders). Budgets, stopping rules, required artifacts, and the run manifest shape are
    stated before any execution.
  - 'Carry the three controls from the idea verbatim into the contract: planted-divisor positive control
    (synthetic r with d = round(sqrt(r)) must return E(r) ~ 0.25), safe-prime null control (r-1 branch
    E(r) ~ 0.5), arithmetic product-recomputation control plus independent recomputation of every certificate
    by the run wrapper in a second arithmetic implementation.'
  - 'Literature check first, via the knowledge retrieval policy: search for prior per-curve divisor tables
    before asserting unpublished novelty. Report contradictory sources rather than picking one. Every
    citation carries its provenance (recalled | retrieved | kb | internal); a recalled reference is a
    pointer, never support. Do not file KN-LIT rows here -- source filing belongs to execution; the design
    only records what was checked and what remains to file.'
  - 'No ordinary-ECDLP improvement language anywhere: the goal''s pause condition makes any such statement
    a supersede trigger. This census is pure integer arithmetic and claims no attack.'
  - 'Stop-and-escalate: if the literature check or any preliminary arithmetic surfaces a near-sqrt(r)
    divisor on a deployed curve, STOP and report it as the terminal finding of this task; do not proceed
    to specify execution around it.'
  - No status changes, no DEC/KN/EV records, no experiment runs. Preserve committed source records; write
    only the two exact artifact paths; never commit.
  deliverables:
  - 'ledger/hypotheses/H-AUXIN-66e6fd.yaml: the specified hypothesis (mechanism, predictions with E(r)
    metric and minimum effects, test boundary, falsification criteria verbatim from the idea).'
  - 'experiments/EXP-AUXIN-7e2e3d/specification.yaml: the frozen contract (frozen curve list, cost expression,
    certificate format, controls, metrics, budgets, stopping rules, required artifacts, approved_by null).'
  artifact_paths:
  - ledger/hypotheses/H-AUXIN-66e6fd.yaml
  - experiments/EXP-AUXIN-7e2e3d/specification.yaml
  write_scope:
  - ledger/hypotheses/H-AUXIN-66e6fd.yaml
  - experiments/EXP-AUXIN-7e2e3d/specification.yaml
  archived_by: TASK-20260905-038574
  inference:
    policy: research-deep
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 1200
    memory_gb: 2
    maximum_runs: 0
  completion_gate:
  - Both artifacts exist, parse against templates/research-records.md schemas, and carry complete mechanism/predictions/controls/metrics/budgets
    with no null approved fields.
  - The literature check was performed and its outcome (with provenance-marked citations) is recorded
    in the hypothesis.
  - No status field above specified; approved_by is null on the contract; no DEC/KN/EV record was created;
    no run was executed.
  review_plan: null
