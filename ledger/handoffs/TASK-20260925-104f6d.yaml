    every approval field and a value-free newly_frozen_values section; hash the
    four producer files against the snapshot receipt. SWEEP: diff v1 against v2
    in full and list every unmapped hunk and every defect no joint owns, with
    severity and the joint it would have belonged to. Report on YOUR joints and
    the sweep only.
