    - id: RT-2
      text: >-
        BUILD, DO NOT ONLY ARGUE. J2 needs the step-by-step proof check and the
        exact toy enumeration; J4 needs your own G-NB-R generator, the t*,
        PC-NULL, dispersion-model and X_rel recomputations and the coverage
