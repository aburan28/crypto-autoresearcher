    - id: RT-3
      text: >-
        ONE OWNER PER JOINT. You own J2, J4, J6, J8 and proves_too_much. You do
        not re-validate the package, re-derive the archived counts blind or
        audit the implementation (J1, J3, J5 and J7 are the validator's). You
        may recompute any statistic from the archived rows and counts as an
        input to your attacks. Offer no whole-claim verdict and no status
        recommendation for H-PFDR-2765d2. If your recomputation, applied with
        the frozen rule, gives a FAM-1 cell with z > t* or CARRY-1 with z >
        t_carry, say exactly that, label it "frozen text yields O-CANDIDATE",
        and stop interpreting; the Coordinator routes it.
    - id: RT-4
      text: >-
        FLOOR INDEPENDENCE. Compute, print, write or read no floor ratio and no
        A7 quantity, and do not attack one. If an attack seems to need one,
        report the need and declare that point blocked.
    - id: RT-5
      text: >-
        NO NEGATIVE EVIDENCE FROM INFRASTRUCTURE. A crash, timeout or numerical
        failure in your own simulation is reported as such, never as a finding
        about the claim.
    - id: RT-6
      text: >-
        ZERO RUNS, ZERO SOLVER. Your computations are analysis of the committed
        rows and counts, toy enumerations and synthetic simulation. They get no
        RUN id. Do not execute run_jobs.py, merge_relcensus.py, the census CLI
        or the A-3 copy's subcommands (J1, J3, J5 and J7 are the validator's);
        you may read them and reimplement any statistic. You may import
        curve.py, factor_base.py and tails.py by file path for the J2 toy
        enumeration only. Write nothing outside your write scope.
    - id: RT-7
      text: >-
        MACHINE PROTECTION. One computation process at a time, nice 19,
        OMP_NUM_THREADS, OPENBLAS_NUM_THREADS and MKL_NUM_THREADS set to 1,
        resident memory under 3.0e9 bytes (stop any child that crosses it; the
        stop is blocked, not a finding). Launch only if the launch facts show
        at least 4 GB MemAvailable for this task. Stream the large rows and
        harvest-rows files; never load one whole. Every file a shell helper
        writes is named by an absolute path inside your scratch directory or
        write scope. Files over 50 MB go to your own scratch directory
        scratchpad/rt-87ffc4/ and are recorded by path and sha256 only. Never
        read, signal or touch another session's processes or files.
    - id: RT-8
      text: >-
        CITE WITH PROVENANCE. A file you opened is internal. A source you
        recall but did not open is recalled, a pointer, never support. Query
        the knowledge index (search_knowledge) before calling any statistical
        or number-theoretic fact known, and record whether the index answered.
    - id: RT-9
      text: >-
        DISCLOSED PRIOR. The Coordinator's prior was written after it read
        parts of R16's outputs (plan PD-1), and it names what it expects from
        you. A prior the review overturns is among the most valuable results
        available. Attack the joints on their merits.
    - id: RT-10
      text: >-
        TW-SCOPE AND THE TA-1 LABEL. No statement in your report may imply
        anything about a deployed curve, a universal impossibility, an
        exponent below rho's or a floor-relative quantity. Every statement is
        scoped to the tested arms, m = 3, 4, 5, 20..32 bits (FAM-1 at 30-32),
        this engine and these curves. Any report of the SS m = 4 predicted
        power or X_rel carries the label "SS m 4 P0 inputs estimated at 22-24
        bits; TA-1 assumed, not verified by P0" (DEC-20261002-1ebedd O-C3).
