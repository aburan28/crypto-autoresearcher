handoff:
  id: TASK-20260801-051
  from: coordinator
  to: validator
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-025
  objective: >-
    Verify the integrity of the calibration package BEFORE any reading rule is frozen against it.
    THE NAMED PRIORITY DUTIES ARE TWO - (1) the PERTURB-MOVE-1 movement table, checked row by row
    against your own recomputation from the archived raw arrays, and (2) the factorization
    verification, checked by INDEPENDENTLY REFACTORING a random subsample by a second
    factorization path and comparing the largest prime factor.
  uncertainty_reduced: >-
    Whether the numbers the reading rule is about to be frozen against are real, reproducible, and
    produced by an apparatus that was blind to the real object.
  inputs:
  - experiments/EXP-LPF-001/specification.yaml
  - experiments/EXP-LPF-001/implementation/lpf001_driver.py
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-calib/
  - experiments/EXP-LPF-001/results/calib/
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/archives/TASK-20260801-050/snapshot_commit_receipt.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/tasks/TASK-20260801-049/execution_report.yaml
  constraints:
  - 'INDEPENDENT SESSION. You did not author or execute any artifact under review.'
  - >-
    RECOMPUTE, DO NOT READ. Every quantitative claim must be recomputed from the archived raw
    arrays in your own session, and every structural claim about the driver must be re-derived
    from SOURCE and then re-tested by EXECUTING the driver's own functions. This is the
    compensation for procedural-not-model-level independence and it is what caught all four
    BATCH-024 defects.
  - >-
    PRIORITY DUTY 1 - THE MOVEMENT TABLE. Recompute every row of perturbation_movement_report.json
    from the raw replicate arrays. Confirm one row exists per family, rung, cell and statistic with
    no rung missing. Report any rung whose recorded shift is within noise, and report separately
    any CERTIFYING STATISTIC that fails to move on ANY rung of ANY family - that is the BATCH-024
    defect class and it must be surfaced here, not at the review.
  - >-
    PRIORITY DUTY 2 - THE FACTORIZATIONS. Independently refactor a uniformly random subsample of at
    least 5000 samples per cell by a factorization path that reuses NONE of the driver's code, and
    compare the largest prime factor. Report the exact agreement count. A single disagreement is a
    blocking defect.
  - 'Verify the pilot gate ran and its projection is recorded; verify no scope reduction occurred - R_CAL, both ladders, both cells and n exactly as the frozen contract fixes them.'
  - >-
    Verify STRUCTURALLY that the calibration contains no OBJ-REAL sample, no deterministic
    factor-base x-list and no Semaev specialization, AT THE LEVEL OF OBJECTS AND NOT MERELY OF
    LABELS.
  - 'Verify the driver''s own Dickman solution against the frozen table and report the maximum relative discrepancy.'
  - >-
    Verify manifest schema completeness, seed and stream integrity, disjointness of the calibration
    streams from the reserved measurement streams, raw versus summary agreement at tolerance zero,
    and tools/validate_ledger.py check_run on the manifest.
  - 'RETURN ADMISSIBLE or NOT ADMISSIBLE with a concrete defect list. You do not set status and you do not interpret the numbers.'
  - 'MAKE NO COMMIT; TASK-20260801-060 archives this report. Its sha256 is bound at TASK-20260801-053.'
  - 'Record inference honestly (requested review-adversarial, independent session).'
  deliverables:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/reviews/TASK-20260801-051/calibration_validation_report.yaml
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/reviews/TASK-20260801-051/calibration_validation_report.yaml
  archived_by: TASK-20260801-060
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 7200
    memory_gb: 8
    maximum_runs: 1
  completion_gate:
  - 'ADMISSIBLE or NOT ADMISSIBLE returned with a concrete defect list.'
  - 'The movement table recomputed row by row with any statistic that cannot move named explicitly.'
  - 'At least 5000 factorizations per cell independently re-verified by a second code path with the exact agreement count reported.'
  - 'The pilot gate and the absence of scope reduction confirmed; structural blindness confirmed at object level.'
  - 'The Dickman discrepancy reported; seed, stream, manifest and raw-versus-summary integrity confirmed.'
  - 'No interpretation offered; no commit made.'
