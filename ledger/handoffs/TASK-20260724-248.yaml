handoff:
  id: TASK-20260724-248
  from: coordinator
  to: validator
  objective: >-
    Independently verify the integrity of the EXP-XEDN-002 run package: artifact
    completeness, conformance to the frozen specification, exact agreement between
    the closed form and exhaustive enumeration, agreement between the frozen
    predicate and an independent square test, consistency with the recorded
    EXP-XEDN-001 smoke result, and budget compliance. Re-derive the closed-form
    count independently.
  uncertainty_reduced: >-
    Whether the exact xedni census is valid evidence under its frozen protocol,
    and whether its closed form is correct rather than fitted after the fact.
  inputs:
    - experiments/EXP-XEDN-002 (verified snapshot)
    - experiments/EXP-XEDN-002/specification.yaml
    - experiments/EXP-XEDN-001/xedni_sections.py
    - experiments/EXP-XEDN-001/smoke_results.json
    - coordination/goals/GOAL-ICLIFT-001/batches/BATCH-001/archives/TASK-20260724-231/snapshot-receipt.json
  constraints:
    - Verify receipts and integrity; do not reinterpret the research question.
    - >-
      Derive the slot count independently from first principles before comparing
      with the executor's formula, and report both.
    - Distinguish infrastructure failures from mathematical outcomes.
    - Change no official state and write only inside the assigned task directory.
  deliverables:
    - validation_report.yaml with an explicit pass, fail, or invalid verdict per required artifact and control
    - validation_notes.md including the independent derivation
  artifact_paths:
    - coordination/goals/GOAL-ICLIFT-001/batches/BATCH-001/tasks/TASK-20260724-234/validation_report.yaml
    - coordination/goals/GOAL-ICLIFT-001/batches/BATCH-001/tasks/TASK-20260724-234/validation_notes.md
  archived_by: TASK-20260724-236
  inference:
    policy: review-xhigh
    fallback_allowed: true
    independent_session_required: true
  budget:
    wall_clock_seconds: 3600
    memory_gb: 4
    maximum_runs: 3
  completion_gate:
    - Every required artifact and control has an explicit verdict.
    - An independent derivation of the exact count is reported and compared.
    - Any protocol deviation from the frozen specification is named.
  return_format: validation_report
