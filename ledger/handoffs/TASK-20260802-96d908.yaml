handoff:
  id: TASK-20260802-96d908
  from: coordinator
  to: red-team
  objective: 'Attack the NC-2 result, not confirm it. Falsify the claim that the measured gamma at p ~
    2^40 over a toy ell range says anything about c at NIST-I: attack the extrapolation law, the choice
    of counting unit, the amortization denominator, the algorithmic choices that could make the measured
    cost an artifact of a naive implementation rather than a property of Algorithm 1, and the possibility
    that a batched or Sutherland-type modular-polynomial evaluation - flagged as an open direction in
    the paper''s own footnote and in RT-C1 - collapses the measured exponent.'
  uncertainty_reduced: Whether the NC-2 number survives adversarial scrutiny well enough to move the NIST-I
    question off INCONCLUSIVE, or whether it is a scoped implementation measurement that leaves the concrete
    question exactly where BATCH-001 left it.
  inputs:
  - experiments/EXP-PEC-6be870/specification.yaml
  - experiments/EXP-PEC-6be870/runs/RUN-PEC-6be870-a/raw-result.json
  - experiments/EXP-WESOVOW-001/runs/RUN-WESOVOW-001/raw-result.json
  - coordination/tasks/TASK-20260724-P13-RT/red_team_report.yaml (your own prior objections RT-C1, RT-C2,
    RT-S1)
  constraints:
  - 'Independent session: you did not produce these artifacts.'
  - A scoped failure is not an impossibility result, and a toy-scale exponent is not a crypto-scale fact.
  - 'The asymmetry recorded in RT-C1 cuts both ways here: a measured gamma from an unoptimised pure-Python
    implementation is an UPPER bound on the achievable per-entry cost, so it is anti-attack by construction.
    Say so plainly if it is true, and quantify how much of the measured exponent a competent optimisation
    could remove.'
  - Every objection names its cheapest discriminating control.
  - State explicitly whether this measurement changes your prior RT-S1 position that no scope statement
    stronger than the paper's own abstract hedge is supported.
  - Carry dominated_by and a quantitative sota_delta per docs/inventor-protocol.md; setting dominated_by
    to null requires actually checking the frontier, and an unchecked null is a fabrication.
  - Record requested_policy, resolved model identifier, fallback_used, and the degraded_requirements from
    INFAMEND-20260802-P13-002.
  - You change no research status and edit no raw artifact.
  deliverables:
  - red_team_report.yaml with per-objection severity, an end-to-end baseline statement, and named next
    controls
  artifact_paths:
  - coordination/goals/GOAL-P13-001/batches/BATCH-002/reviews/TASK-20260802-96d908/red_team_report.yaml
  archived_by: TASK-20260802-e804d1
  goal_id: GOAL-P13-001
  batch_id: BATCH-002
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: true
    independent_session_required: true
  budget:
    wall_clock_seconds: 3600
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
  - The report names an end-to-end baseline, at least one concrete next control, and an explicit position
    on whether the NIST-I question moves off INCONCLUSIVE.
