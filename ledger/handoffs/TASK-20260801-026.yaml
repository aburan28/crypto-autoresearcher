handoff:
  id: TASK-20260801-026
  from: coordinator
  to: coordinator
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-023
  objective: >-
    Archive the TASK-20260801-025 review, its attainability check and its anti-tuning check,
    and record APPROVAL_DETERMINATION APPROVED or NOT APPROVED for the real arm
    RUN-EQD-001-real in the snapshot receipt. Committing a review is not approving it.
  uncertainty_reduced: Whether RUN-EQD-001-real is authorized.
  inputs:
  - TASK-20260801-025 artifacts
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/archives/TASK-20260801-024/snapshot_commit_receipt.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/archives/TASK-20260801-022/snapshot_commit_receipt.json
  constraints:
  - RUN ALONE. Stage exactly declared_commit_sets.TASK-20260801-026_snapshot - four paths.
  - The receipt must contain APPROVAL_DETERMINATION with the literal value APPROVED or NOT APPROVED.
  - >-
    APPROVED only if ALL THREE hold - the TASK-20260801-025 verdict is PASS; its
    attainability_check.md returns ATTAINABLE for EVERY band and EVERY branch; and its
    anti_tuning_check.md returns COMPLIANT on ATS-1. A PASS whose attainability check reports
    any unreachable band or branch is NOT APPROVED - that combination is precisely what
    BATCH-021 shipped. A PASS whose anti-tuning check reports that the calibration selected
    rather than supplied is NOT APPROVED.
  - A REVISE at any severity is NOT APPROVED and ends the real arm for this batch under the one-cycle cap.
  - >-
    If TASK-20260801-023 recorded a CAL-STOP-1 non-execution, this task records NOT APPROVED
    on that ground alone, states that the apparatus was stopped BEFORE the real arm rather
    than after it, and states that a CAL-STOP-1 stop is never a disposition about any
    hypothesis in either direction.
  - Do not repair the contract, the driver or the reading rule in this task. No second cycle is permitted.
  - Do not stage ledger/goals/GOAL-ECDLP-001.yaml or ledger/hypotheses/H-EQD-001.yaml.
  - >-
    Commit message must contain TASK-20260801-026, TASK-20260801-025, EXP-EQD-001, H-EQD-001,
    RUN-EQD-001-real, GOAL-ECDLP-001, BATCH-023.
  - Do not push from this task.
  - Do not start the Executor in this task.
  - State no interpretation of the calibration numbers and no disposition about any hypothesis in the receipt.
  deliverables:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/archives/TASK-20260801-026/snapshot_commit_receipt.json
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/archives/TASK-20260801-026/snapshot_commit_receipt.json
  archived_by: TASK-20260801-026
  inference:
