handoff:
  id: TASK-20260801-030
  from: coordinator
  to: red-team
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-023
  objective: >-
    Challenge any reading of this measurement stronger than a toy-scoped distributional
    observation about limb L2, IN BOTH DIRECTIONS AND WITH EQUAL FORCE. If the real arm looks
    indistinguishable from the matched null, attack that - name every way the apparatus could
    manufacture agreement, starting with insufficient resolution and with power that exists
    only against the plant class, and say whether PC-1 genuinely establishes that the
    statistic could have rejected THE ALTERNATIVE THAT MATTERED rather than a different one.
    If it looks like a deviation, attack that at least as hard - name every non-structural
    channel that could produce it, including the binning unevenness when K does not divide p,
    the half-tuple dependency structure, the finite factor base, the redraw policy on the null
    side, and any bias in the real-arm null stream. THEN AUDIT THE ATTAINABILITY ARGUMENT
    AGAINST THE ACTUAL DATA - was the branch that fired one your own arithmetic confirms was
    reachable, and did any branch that did NOT fire turn out to be unreachable after all. AND
    AUDIT ATS-1 POST HOC - with the real numbers now visible, does the reading rule still look
    like a substitution of measured numbers into a pre-frozen form, or does any part of it
    look chosen. Finally, state plainly whether any deliverable of this batch blurs the line
    between equidistribution of the fibre invariants and HEUR-DS-1.
  uncertainty_reduced: >-
    Whether this measurement genuinely bears on limb L2, or whether a third explanation - the
    instrument, the binning, the dependency structure, the plant class or the sampling design
    - survives.
  inputs:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/archives/TASK-20260801-028/snapshot_commit_receipt.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/archives/TASK-20260801-024/snapshot_commit_receipt.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/archives/TASK-20260801-022/snapshot_commit_receipt.json
  - experiments/EXP-EQD-001/specification.yaml
  - experiments/EXP-EQD-001/reading_rule.yaml
  - ledger/hypotheses/H-EQD-001.yaml
  - ledger/hypotheses/H-SMTH-001.yaml
  - ledger/hypotheses/H-DS-001.yaml
  - ledger/decisions/DEC-20260801-007.yaml
  - ledger/decisions/DEC-20260801-006.yaml
  - ledger/decisions/DEC-20260801-005.yaml
  - ledger/evidence/EV-DS-004.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/reviews/TASK-20260801-025/attainability_check.md
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/reviews/TASK-20260801-025/anti_tuning_check.md
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-022/reviews/TASK-20260801-012/attainability_check.md
  - docs/inventor-protocol.md
  constraints:
  - INDEPENDENT SESSION.
  - >-
    SYMMETRY IS MANDATORY. Premature closure is a failure mode symmetric with overclaiming
    (docs/inventor-protocol.md section 4). Attack a negative-looking result exactly as hard as
    a positive-looking one.
  - >-
    AUDIT THE ATTAINABILITY ARGUMENT AGAINST THE ACTUAL DATA and say plainly whether any band
    or branch turned out unreachable after all. This is the BATCH-021 defect RT048-B2 and the
    BATCH-022 finding RV012-A1, and you are the last line on both.
  - >-
    AUDIT ATS-1 POST HOC. With the real numbers visible, say whether the calibration supplied
    or selected, and whether the driver executed at the real arm is byte-identical to the one
    the calibration froze.
  - >-
    LIMB DISCIPLINE IS BLOCKING. L1 - that (e_1, e_2) is not uniform on F_p x F_p with support
    density about 1/8 - is a DERIVATION and may not be reported as a finding of this batch
    under any branch. L3 - the dependency-structure comparison - is an instrument fact and may
    not be reported as a result about the Semaev map. Say explicitly whether any deliverable
    violates either.
  - >-
    THE HEUR-DS-1 LINE IS BLOCKING. Equidistribution of the fibre invariants is a LOAD-BEARING
    INPUT to HEUR-DS-1 and is NOT identical to it. This experiment measures no smoothness,
    factors no integer and computes no largest prime factor. Say explicitly whether any
    deliverable blurs that, and confirm the smoothness measurement is still recorded as OWED
    under OPEN-BATCH023-A.
  - >-
    reject_scoped-as-impossibility is forbidden on this package under every branch; so are
    S1_met, F1_met, F2_met, structure_gate_passed, `support` for H-EQD-001, H-SMTH-001 or
    H-DS-001, HEUR-DS-1 validation or refutation at any tier, any asymptotic, crypto-scale or
    medium-scale claim, and any affected-scheme statement.
  - >-
    dominated_by may not be null; carry a quantitative sota_delta, and note that for a
    distributional measurement of this kind the relevant frontier row is the matched-null
    comparison itself rather than any algorithm.
  - >-
    Carry RT047-B5, RT048-B1, RT048-B2, RT048-B5, RT048-B9, RT048-H1, RT048-H2, RT048-M1,
    RV012-A1, RV012-A2, RV012-B1, RV012-B2, RV012-B3 and RV012-B6 forward and state each
    one's status - discharged, partially discharged or still open - after this run.
  - Say explicitly whether the reading rule was applied as frozen or bent to the data.
  - >-
    Attack the claim that INT-2 is the intermediate rather than a stand-in with the same force
    RT047-H2 applied to the previous sampling, and say whether CTRL-EQD-S3 at 1000 per cell
    actually settles it.
  - Say explicitly whether PC-1's power certificate covers the alternative class the decision statistics actually faced, or only the plant class, and what that leaves uncertified.
  - Toy stays toy; promotion gates G1-G4 remain OPEN unless you prove otherwise with archived artifacts.
  - >-
    State explicitly that your session is independent in the AGENTS.md sense but NOT in the
    model sense under this harness, and that it is not admissible toward the three-model
    closure quorum of AGENTS.md rule 13.
  - Do not alter H-EQD-001, H-SMTH-001, H-DS-001, H-IC-001 or H-STR-002. MAKE NO COMMIT.
  deliverables:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/reviews/TASK-20260801-030/red_team_report.yaml
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/reviews/TASK-20260801-030/red_team_report.yaml
  archived_by: TASK-20260801-031
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 5400
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
  - >-
    Blocking constraints, an explicit post-hoc audit of the attainability argument, an
    explicit post-hoc audit of ATS-1, an explicit limb-discipline verdict on L1 and L3, an
    explicit verdict on whether the HEUR-DS-1 line was blurred, the narrowest supported
    statement, dominated_by, a quantitative sota_delta, the next required control, and a
    recommended disposition all recorded.
