handoff:
  id: TASK-20260902-51b6ce
  from: coordinator
  to: idea-generator
  objective: >-
    Run one bounded ideation round against RQ-ECDLP-002 (sibling
    RQ-CRYPTO-001 permitted as question_id only for a concrete non-generic
    mechanism aimed at beating Pollard rho on cryptographic prime-field
    ECDLP) and return three to six schema-complete, novelty-screened,
    falsifiable proposals. Generation runs under docs/inventor-protocol.md:
    the program's established and already-closed attack families are named
    and declared off-limits as the primary lens; every candidate is framed
    as a tracked object and passed through the lossy-projection test before
    any experiment is proposed; a null-object control is named before any
    signal is believed; every idea carries numbered heuristic_assumptions
    with validation routes, target_complexity with time and memory exponents
    against the best known, a checked dominated_by and a quantitative
    sota_delta; and the session returns the honest-accounting block of
    inventor-protocol section 5 whether or not it produced anything.
  uncertainty_reduced: >-
    Whether a candidate mechanism, representation, measurement, control, or
    tooling object exists OUTSIDE the families this program has closed or
    screened (summation-polynomial index calculus on an algebraic factor
    base, GGM-simulable augmented representations, characteristic-zero and
    p-adic lifts, Poincare-factor and genus transfers, Wesolowski-style
    quaternion transfer, four-list generalized-birthday joins, endomorphism
    witness lattices, re-randomisation promise classes, block-system
    quotients) that can change a scoped prime-field ECDLP decision at its
    cheapest discriminating test.
  inputs:
    - ledger/questions/RQ-ECDLP-002.yaml
    - ledger/questions/RQ-CRYPTO-001.yaml
    - ledger/goals/GOAL-ECDLP-001/goal.yaml (head fields and live next_action only; the file is ~945 KB of batch history and is grepped, not read end to end)
    - ledger/decisions/DEC-20260902-4c82fd.yaml
    - knowledge/findings/KN-FIND-61347e.md
    - knowledge/findings/KN-FIND-5c1a03.md
    - knowledge/findings/KN-FIND-9d2f56.md
    - knowledge/findings/KN-FIND-7e4b90.md
    - knowledge/findings/KN-FIND-c93d45.md
    - knowledge/open-problems/KN-OPEN-001.md
    - knowledge/open-problems/KN-OPEN-005.md
    - knowledge/open-problems/KN-OPEN-018.md
    - knowledge/open-problems/KN-OPEN-019.md
    - knowledge/open-problems/KN-OPEN-020.md
    - knowledge/techniques/KN-TECH-056.md
    - knowledge/techniques/KN-TECH-080.md
    - knowledge/techniques/KN-TECH-06bb4e.md
    - knowledge/techniques/KN-TECH-3b593f.md
    - knowledge/techniques/KN-TECH-73630e.md
    - coordination/goals/GOAL-ECDLP-001/proposals/B71-CRYPTO001-NEW-MECHANISM-20260902-2fb7f8/tasks/TASK-20260902-2fb7f8/candidate-mechanisms.yaml
    - coordination/goals/GOAL-ECDLP-001/proposals/B71-CRYPTO001-NEW-MECHANISM-20260902-2fb7f8/tasks/TASK-20260902-2fb7f8/source-novelty-audit.yaml
    - ledger/proposals/ (every record bound to RQ-ECDLP-* or RQ-CRYPTO-001; a compiled screening list is supplied to the session)
    - agents/idea-generator.md
    - docs/inventor-protocol.md
    - docs/target-result-profile.md
    - templates/research-records.md
  constraints:
    - Two lanes run in independent sessions with disjoint pre-allocated idea ids. Lane A leads with object-first generation (a tracked object, its one-step propagation, the lossy-projection test). Lane B leads with external-structural-ingredient scouting (a cited theorem, bound, or correspondence from the 2023-2026 literature, provenance marked, converted into an algorithmic step). Each lane is told the other lane's lens and must not produce a candidate whose primary lens is the other lane's.
    - Zero compute and zero implementation. experiment maximum_runs is 0. Every quantitative statement is a derivation or a screening statement, never a reported execution.
    - The crypto-kb retrieval index is unavailable in this container (CRYPTO_KB_QDRANT_URL is ':memory:' and empty). Screening is by direct Read and Grep over knowledge/, ledger/, analysis/ and ideas/ plus WebSearch and WebFetch; every record states this in novelty_screen and treats absence of a grep hit as a floor, never as novelty.
    - No novelty label stronger than unverified rests on a recalled citation. Every citation carries provenance (recalled | retrieved | kb | internal) and verified_by where required.
    - No idea is a re-parameterisation of an off-limits family in new notation. discriminated_from names the nearest prior record and the operation-level difference.
    - Every idea has at least two possible outcomes with stated meanings, at least one falsification condition that a cheap test can trigger, and a null-object control of the same shape.
    - A proof-oriented idea carries a proof_search_map with all four audits filled or marked not_applicable with a reason.
    - dominated_by is null only after checking every frontier row (parallel rho with negation, BSGS, kangaroo, automorphism-discounted rho, Pohlig-Hellman, generic preprocessing S*T^2 = N); an unchecked null is a fabrication under AGENTS rule 5.
    - No hypothesis record, experiment record, or status change is written; this task assigns no work to the Executor.
    - Proposals use only the pre-allocated ids listed under artifact_paths, in order; unused ids remain unused.
    - Drafts are written to the session scratchpad and filed into ledger/proposals/ by the orchestrating session only after schema verification; a draft returned incomplete is completed by its author, not repaired by the orchestrator.
  deliverables:
    - Three to six idea records, one per pre-allocated id, complete per the schema in agents/idea-generator.md plus the fields the current filed exemplars carry (question_id, added, novelty_screen, citations, proof_search_map, object_first_candidate, null_object_control, discriminated_from, dominated_by, sota_delta, honest_prior_of_survival, status, proposed_by, proposed_at, source_refs).
    - One session-accounting record per lane carrying the inventor-protocol section 5 block (objects considered, depth of verified structure, dominated_by, sota_delta, enumerated closures with mechanisms, open directions) and a one-paragraph ranking rationale naming the single idea to test first.
  artifact_paths:
    - ledger/proposals/IDEA-20260902-63dbc0.yaml
    - ledger/proposals/IDEA-20260902-c17bf6.yaml
    - ledger/proposals/IDEA-20260902-be04b4.yaml
    - ledger/proposals/IDEA-20260902-a0ed78.yaml
    - ledger/proposals/IDEA-20260902-701458.yaml
    - ledger/proposals/IDEA-20260902-bc63e4.yaml
    - ledger/proposals/IDEA-20260902-c9f8f2.yaml
  archived_by: TASK-20260902-63f7da
  inference:
    policy: research-deep
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 7200
    memory_gb: 4
    maximum_runs: 0
  completion_gate:
    - Every filed record parses under a strict YAML load and carries the REQUIRED idea fields (id, title, class, claim, mechanism, novelty_status) plus heuristic_assumptions and target_complexity.
    - Every record's novelty_screen discloses the retrieval-index outage and names the grep terms and records read.
    - Every record's citations carry provenance, and no record with only recalled literature claims novelty_status stronger than unverified.
    - Every record names a null-object control and at least one falsification condition reachable by a low-cost test.
    - tools/validate_ledger.py reports no NEW error on the touched paths.
    - The orchestrating session files the accepted records, commits them with this handoff and the snapshot receipt under TASK-20260902-63f7da, pushes the branch, and opens a draft pull request against main naming the RQ and IDEA ids.
  return_format: >-
    Per lane, the list of drafted idea ids with one-line summaries (class,
    claim, novelty_status, cost), the session-accounting block, and the
    recommended first test with its cheapest valid discriminator.
  review_plan: null
