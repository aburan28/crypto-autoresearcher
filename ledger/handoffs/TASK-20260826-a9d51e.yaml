  objective: >-
    Attack the conclusions, not the arithmetic. THE COMMITTED REVIEW PLAN ASSIGNS THIS TASK'S
    THREE JOINTS AND IS AUTHORITATIVE OVER THIS SKETCH. Coordinator's intent at opening:
    (R-a) IS THE QUANTIFIER THE ONLY ADMISSIBLE READING -- the contract states the forcing
    predicate formally and requires both composition orders measured; construct a third reading
    if one exists, run it, and report what count it gives. If the count is a property of a
    quantifier choice rather than of the instrument, say so with the objects that show it.
    (R-b) IS THE INDEPENDENCE REAL -- the producer attests non-reading of a named path; establish
    what that attestation is worth, whether any mechanism demonstrates it, and how a close should
    weight a MATCHING count versus a DIFFERING one given that contamination pushes toward
    agreement. Build an object if you can.
    (R-c) DOES THE CONSISTENT-PAIR FAMILY DECLARE WHAT IT MOVES, and does anything in this
    batch's package -- or in the opening that specified it -- claim more than it measured? This
    includes the batch record, the frozen contract and the review plan, all of which are this
    Coordinator role's.
