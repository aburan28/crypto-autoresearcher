    Whether the re-admitted count measures the instrument or the rule that selects the cells;
    whether the replication is independent in any sense a later reader can check; and whether the
    consistent-pair family's declaration is true of what it actually perturbs -- the exact shape
    of defect that made the diagonal theorem's hypothesis false on one primitive in round 3.
