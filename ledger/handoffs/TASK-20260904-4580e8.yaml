handoff:
  id: TASK-20260904-4580e8
  from: coordinator
  to: [validator-breakthrough, red-team-breakthrough]
  created_at: '2026-09-04'
  experiment_id: EXP-MONO-005b49
  hypothesis_id: H-MONO-1d50ac
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001

  objective: >-
    BREAKTHROUGH-TIER review, per AGENTS.md's binding rule that a result
    contradicting prior independently validated evidence routes here
    (this result bears on H-MONO-45183a Part B's own already-validated
    (N,tau)-only completeness claim). Assess whether the two-cell pooled
    result for H-MONO-1d50ac (inverse-variance-weighted log-ratio pooling
    across p=617 and p=3541: z=2.3139, p=0.0207, independently re-verified
    three times by three different sessions across this lane) is genuine
    evidence against (N,tau)-only completeness, or an inflated-significance
    artifact of the chain of post-hoc corrections that produced it.

  review_plan:
    coordinator_prior: >-
      Recorded BEFORE either breakthrough reviewer is dispatched. This
      Coordinator's OWN prior at ordinary review tier (that a
      non-significant second cell would support reading cell 1's own
      result as noise) was already rejected on the merits by ordinary-tier
      review (DEC-20260904-ffaebb) via a power calculation this Coordinator
      independently re-verified. Given that experience, this Coordinator's
      CURRENT prior, held with LOW-TO-MODERATE confidence precisely because
      it has already been wrong once on a closely related question: the
      pooled estimate is probably a genuine, if modest, signal -- the
      individual corrections (test-mismatch fix, power-deficit discovery)
      were each independently verified by disjoint methods across two
      separate ordinary-tier review rounds, which is more scrutiny than a
      typical single post-hoc adjustment gets. But this Coordinator
      explicitly flags: (a) it has NOT independently assessed whether the
      SEQUENCE of corrections, taken together, has a formal alpha-inflation
      characterization (e.g., via a simulation of the actual decision
      procedure that was followed, not just each individual test's own
      p-value); (b) the CM-variant confound (j=1728 vs j=0) has not been
      quantitatively bounded, only qualitatively flagged; (c) this
      Coordinator's own repeated involvement in producing, reviewing, and
      now re-verifying every step of this chain is itself a source of
      correlated blind spots that ordinary review has not fully offset.
    claim_under_review: >-
      Whether the two-cell pooled log-ratio estimate (z=2.3139, p=0.0207)
      constitutes genuine evidence against H-MONO-45183a Part B's
      (N,tau)-only completeness, sufficient to warrant advancing
      H-MONO-1d50ac's status, OR whether it should be read as an artifact
      of sequential post-hoc analytic adjustment that does not license
      any status advancement without a pre-registered third-cell test.
    joints:
      - joint: JB1-SEQUENTIAL-INFERENCE-VALIDITY
        assigned_to: validator-breakthrough
        attack_plan: >-
          Formally characterize the actual DECISION PROCEDURE this lane
          followed (not just each test's own nominal p-value): (1) test
          cell 1 with an initially-flawed statistic; (2) discover the flaw
          via independent review and correct it; (3) design and run cell 2;
          (4) discover cell 2 was underpowered via independent review;
          (5) invent and apply a pooling method. Using formal
          sequential-testing or alpha-spending theory (or a Monte Carlo
          simulation of an analogous synthetic decision procedure under a
          TRUE NULL, replicating each of these five steps' own decision
          rules as closely as possible), estimate the TRUE false-positive
          rate of this exact procedure, as actually executed, not the
          nominal 0.05 threshold applied to the final number alone. Does
          the procedure's own actual error rate materially exceed 5%?
      - joint: JB2-INDEPENDENT-END-TO-END-REDERIVATION
        assigned_to: validator-breakthrough
        attack_plan: >-
          Starting from ONLY the four raw run manifests/raw-result.json
          files (experiments/EXP-MONO-cb905d/runs/RUN-MONO-cb905d-2/
          raw-result.json and experiments/EXP-MONO-005b49/runs/
          RUN-MONO-005b49-1/raw-result.json, plus RUN-MONO-cb905d-1's own
          raw-result.json for the reused transversal counts) -- blind from
          every execution_report.yaml, evidence record, and decision record
          in this chain -- independently re-derive the entire analysis from
          scratch: both cells' P1/P2/P3, the pooled inverse-variance
          estimate, and its p-value. This is the THIRD independent
          end-to-end rederivation of this exact pooled number (after the
          Red Team's and this Coordinator's own); confirm it a third time,
          or report a genuine discrepancy if found.
      - joint: JB3-ADVERSARIAL-NULL-CONSTRUCTION
        assigned_to: red-team-breakthrough
        attack_plan: >-
          Construct the STRONGEST available case that this entire two-cell
          signal is a null-hypothesis artifact. Consider explicitly: (a) is
          there a p-hacking-adjacent reading where "we tried until the
          statistic looked right" describes this chain better than
          "we found and fixed genuine bugs"? Steelman this reading even
          though this Coordinator does not believe it. (b) Does the
          CM-variant confound (j=1728 vs j=0) provide an alternative,
          mundane explanation -- e.g., could j=0 vs j=1728 curves have
          structurally different baseline collision behavior for reasons
          UNRELATED to any (N,tau)-completeness question, such that the
          pooled P3 signal is really detecting a CM-variant effect rather
          than a generic CM-vs-ordinary effect? (c) Is there any reason to
          suspect the transversal-arm reuse in cell 1 (counts taken from
          RUN-MONO-cb905d-1, drawn before the group-uniform sampler bug was
          even found) could itself carry a subtle correlated error the
          amendment's own fix didn't address?
      - joint: JB4-CLOSURE-STANDARD-CHECK
        assigned_to: red-team-breakthrough
        attack_plan: >-
          Per docs/inventor-protocol.md's real-closure-standard and
          Pareto-honesty requirements: if this result WERE accepted as
          genuine, what would it actually establish, and what would it
          NOT establish, about H-MONO-45183a Part B, KN-OPEN-009, or any
          broader ECDLP-relevant claim? Write the most honest possible
          "if true" statement and the most honest possible "even if true,
          this does not..." statement, so the Coordinator's eventual
          decision record cannot overclaim regardless of this round's
          verdict on JB1-JB3.
    blindness:
      lifted_for: null
      rationale: null
      declaration: >-
        Both reviewers are launched as fresh subagents with no prior
        context; each must independently state whether it read the other's
        output or any sibling review directory before forming its own
        conclusions.
    proves_too_much:
      objects:
        - >-
          A sequential-inference simulation (JB1) that reports a true
          null's own false-positive rate as exactly 5% regardless of how
          many post-hoc adjustment steps are simulated would fail to be
          discriminating -- the method must show INCREASED false-positive
          risk as more post-hoc steps are added, or it isn't measuring
          what it claims to measure.
        - >-
          An adversarial null construction (JB3) that can be applied
          identically to reject ANY positive result in this lane's history
          (e.g. if the same argument template would also "refute" the
          Validator's own independently-reproduced sampler-uniformity
          proof from EXP-MONO-cb905d, which has no comparable post-hoc
          adjustment history) is not actually targeted at this record's own
          specific defect and should be discarded as overbroad.
      failure_signature: >-
        If JB1's simulation cannot distinguish a 1-step from a 5-step
        adjustment procedure's own false-positive rate, or if JB3's
        strongest-case argument would equally indict unrelated, cleanly
        pre-registered results in this same lane, the joint has not
        actually been covered.

  budget:
    wall_clock_seconds: 3600
    memory_gb: 4
    maximum_runs: 0

  constraints:
    - Do not commit or push. Report only, in your own review directory under experiments/EXP-MONO-005b49/reviews/{validator-breakthrough,red-team-breakthrough}/.
    - Do not read the sibling reviewer's directory before forming your own conclusions; disclose whether you did.
    - Do not change any research status, ledger record, or hypothesis field -- this Coordinator composes the resulting decision after both reports land.
    - >-
        This is the review-breakthrough policy tier, marked non-degradable
        in this program's policy config. If you cannot complete this
        review at full rigor for any reason, say so explicitly rather than
        delivering a lower-rigor substitute silently.

  completion_gate: >-
