handoff:
  id: TASK-20260803-6329c6
  from: coordinator
  to: red-team
  objective: 'TWO jobs. (A) ATTACK THE IDENTICAL-DISTRIBUTION ASSUMPTION on which BATCH-015 rests. The
    occupancy floor mean_T(1 - mu_T/N) = 0.9183 dissolves ANOM-5, and it is EXACT under i.i.d. iterations
    -- but it is FALSE without identical distribution: a counterexample of floor(mu) deterministic iterations
    plus one Bernoulli(frac) returns phi = 0.00433, some 2300 sd below it. The file header supports identical
    distribution and the pooled-rate estimator already assumes it, but the archive contains NO per-iteration
    data with which to verify it. Build the strongest case that the assumption fails for this data, and
    name the cheapest check that would settle it. If it survives, say so and state exactly what the floor
    is then entitled to claim. (B) RULE EXPLICITLY ON EXHAUSTION. Resolving the remaining -1.5 sd mid-band
    residue to 3 sd would need roughly 1321 to 1488 bins and this archive has 301. State whether the mid-band
    lane is EXHAUSTED at this archive resolution. If it is, say so plainly with a named obstruction and
    forward guidance per the inventor-protocol closure standard; declaring a lane exhausted when it is
    is a RESULT, not a failure -- and declaring it exhausted when it is not is the premature-closure failure
    mode the same protocol treats as equal to overclaiming.'
  uncertainty_reduced: Whether BATCH-015 resolution of ANOM-5 rests on a hypothesis this archive cannot
    support, and whether this goal mid-band lane has reached the end of what its data can decide. BATCH-015
    had one investigation and one validation and no adversarial pass.
  inputs:
  - Snapshot commit 18e6679ba0 and ledger commit 405e19415b
  - coordination/goals/GOAL-MLKEM-003/batches/BATCH-015/tasks/ (investigation and validation packages)
  - ledger/evidence/EV-MLKEM-ce1884.yaml and ledger/decisions/DEC-20260803-b4d2d0.yaml
  - coordination/goals/GOAL-MLKEM-003/batches/BATCH-014/tasks/ (C1 packages)
  - experiments/EXP-MLKEM-011/vendor-lock/data/
  - docs/inventor-protocol.md
  constraints:
  - Never fabricate a command, output, timing, statistic, citation, or run (AGENTS.md rule 9).
  - 'ZERO NEW SAMPLING of the physical system: no G6K, no network, no new .out bytes. Seeded randomness
    for your own null objects is expected; disclose it.'
  - Toy tier; raw undivided score scale; NO ML-KEM security claim.
  - 'AGENTS.md rule 12 stays UNMET and UNWAIVED: EV-MLKEM-011, EV-MLKEM-013 and EV-MLKEM-017 keep their
    status; KN-FIND-031 stays withdrawn.'
  - 'BINDINGS: no whole-band ratio without its effective degrees of freedom; do NOT quote a specific dof
    value -- state O(1), cite the range 1.51-2.35, give the C>=1000 comparison; read a congenial control
    code before summarising it; a re-derivation reaching the same conclusion by the same route is NOT
    an independent check; decompose rms into bias and centred scatter before inferring fit-dependence.'
  - Write only inside the declared write_scope. Do not edit any prior artifact or ledger record. Do not
    git commit.
  - 'Independent session. Do NOT defer to the producer, the validator, or the Coordinator: FIVE Coordinator-authored
    premises have now been falsified downstream in this goal, including a re-derivation that confirmed
    a false quantifier.'
  - EVERY objection must be CHECKABLE -- name the artifact, path, locus or computation that settles it.
  - Do not make an accusation against the source. If the i.i.d. assumption is doubtful, that is a statement
    about what this archive can support, not about the authors.
  - If BATCH-015 conclusion SURVIVES, say so plainly and state what it may then claim. This lane has produced
    adverse readings repeatedly; a red team that always finds a fatal flaw is as useless as one that never
    does.
  deliverables:
  - 'red_team_report.yaml: numbered objections each with a named cheapest check; verdict pass|pass_with_constraints|blocking_objections;
    an EXPLICIT survives/does-not-survive statement on the i.i.d. assumption; and an EXPLICIT exhausted/not-exhausted
    ruling on the mid-band lane'
  - 'objections.md: the argued case'
  artifact_paths:
  - coordination/goals/GOAL-MLKEM-003/batches/BATCH-016/tasks/TASK-20260803-6329c6/red_team_report.yaml
  - coordination/goals/GOAL-MLKEM-003/batches/BATCH-016/tasks/TASK-20260803-6329c6/objections.md
  archived_by: TASK-20260803-9d3a59
  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 3000
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
  - every objection names a checkable artifact, path or computation
  - an explicit statement on whether the identical-distribution assumption survives
  - an explicit exhausted/not-exhausted ruling on the mid-band lane, with a named obstruction if exhausted
