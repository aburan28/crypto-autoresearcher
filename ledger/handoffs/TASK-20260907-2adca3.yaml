  constraints:
    - >-
      FROZEN CONTRACT. Any needed change to any protocol field (arms,
      features, architecture, seeds, sigma, thresholds, the preregistered
      prediction) is a versioned protocol_amendment under
      experiments/EXP-RELN-82f487/amendments/ to the Coordinator -- NEVER
      an inline edit of specification.yaml.
    - >-
      DETERMINISTIC SEEDS exactly as replication.seeds: curve_seeds
      [101,102,103], base_seeds [201,202,203], training_seeds
      [301,302,303], split_seed 401, node_shuffle_seed 501 (determinism
      variant 502), selection_null_seed 601, label_permutation_seed 701,
      target_sample_seed_2_24 801, bootstrap_seed 901.
    - >-
      LEAK DISCIPLINE IS BLOCKING: the static audit (source/leak_audit.py)
      must reject the planted-leak diagnostic; the label code path must
      share no implementation with the feature or model code path; the
      label-permutation null must stay inside band on EVERY arm including
      Z/N-interval, or the run halts and nothing is reported.
    - >-
      SPLIT BY TARGET: no held-out target may have an incident relation
      node in the training graph; hyperparameters are selected on the
      validation split only.
    - >-
      A model's ACCURACY IS NEVER A RESULT. Only the lift excess over the
      selection null, its decay slope, the GNN-minus-trees difference, and
      the predictor cost ratio are reportable primary metrics.
    - >-
      RUN RECORDS are immutable under experiments/EXP-RELN-82f487/runs/<RUN-ID>/
      with every required_artifact the contract lists, INCLUDING a
      manifest.yaml (not only manifest.json -- EXP-RELN-f202be's run
      package initially omitted this and had to be repaired; do not repeat
      that gap) satisfying tools/validate_ledger.py's run schema (id,
      experiment_id, status, code, environment, inputs, timing, result),
      plus command.txt, environment.json, stdout.log, stderr.log, and
      raw-result.json.
    - >-
      A TIMEOUT, OOM kill, training divergence, solver crash, or watchdog
      expiry is failed_infrastructure and is NEVER a result, positive or
      negative (AGENTS.md rule 3).
    - >-
      GIVEN THE SCALE OF THIS CONTRACT (advisory 400 CPU-hours, 30 runs,
      5 rungs x 5 arms x 2 classes x 2 regimes x 3 curves x 3 base seeds x
      3 training seeds), full completion within one executor session is
      NOT expected or required. Partial completion, honestly reported per
      the contract's own stopping/invalidation rules and decision_paths
      (inconclusive: "preserve immutable partial artifacts, name the
      failed gate or missing rung concretely"), is an explicitly
      anticipated and acceptable outcome. PRIORITIZE: (1) Stage 0 (freeze
      and static audit) and the reproduction fixtures first; (2) the
      cheapest rung (2^14) across ALL arms, both classes, sigma=1/8 only,
      to validate the whole pipeline including the leak audit and
      determinism re-run end to end; (3) then sigma=1/32 at 2^14; (4) then
      as many of 2^16/2^18/2^20/2^24 as time allows, in that order. Report
      exactly what completed, what is partial, and what was not reached --
      never round up.
    - ZERO INTERPRETATION beyond the contract's own decidable branch classification.
    - >-
      IMPLEMENTATION PATH: experiments/EXP-RELN-82f487/source/ per the
      contract's required_artifacts list, hash-pinned by commit in every
      run manifest.
