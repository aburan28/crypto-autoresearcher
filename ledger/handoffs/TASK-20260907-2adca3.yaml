  objective: >-
    Implement and execute the frozen, APPROVED contract EXP-RELN-82f487
    version 1 (experiments/EXP-RELN-82f487/specification.yaml; status
    approved, approved_by coordinator, execution_authorized true, per
    DEC-20260907-efe01a) EXACTLY as written: measure whether a LEARNED
    coordinates-only predictor (an inductive GNN and, separately, a
    gradient-boosted-tree baseline) finds representation-decidable
    structure in the m=3 decomposition-count vector of negation-closed
    x-interval bases on prime-order E/F_p beyond the exchangeable
    selection null, across the four-arm-plus-canary geometry panel, at
    N in {2^14, 2^16, 2^18, 2^20} (exhaustive labels, preferring committed
    EXP-RELN-f202be count vectors where the identical cell is present,
    falling back to the contract's own Stage-1 enumeration elsewhere) and
    2^24 (certified sample), scored by the lift excess and its fitted
    log-log decay slope against the two pre-registered competing exponents
    (-1/2 closed vs 0 alive), with the full control panel (positive/
    negative controls, label-permutation null, planted-leak check,
    reproduction fixtures, determinism re-run) gating whether any cell is
    readable. The Executor records observations only: it interprets
    nothing beyond the contract's own decidable branch classification, and
    changes no ledger status.
  uncertainty_reduced: >-
    Whether, on cells passing every control, the E/x-interval arm's
    lookup-subtracted lift excess is inside the selection-null band or
    decays with a slope interval containing -1/2 (the predicted, NULL-
    consistent branch of H-RELN-10ad6b) versus a slope interval containing
    0 and excluding -1/2, replicated across curves and training seeds (the
    refuting/alive branch) -- or is INCONCLUSIVE per the contract's own
    falsification_criterion (underpowered slope, an uninformative class,
    a leak halt, a pipeline fault, or infrastructure failure).
  inputs:
    - experiments/EXP-RELN-82f487/specification.yaml (the frozen, approved contract; the ONLY protocol)
    - ledger/hypotheses/H-RELN-10ad6b.yaml
    - ledger/questions/RQ-RELN-61638a.yaml
    - ledger/proposals/IDEA-20260906-79ff48.yaml
    - ledger/proposals/IDEA-20260830-c5c614.yaml
