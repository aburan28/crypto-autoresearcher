        and cancellation/RSS in every dense loop. Prior reports/checks are deliberately visible after archive and
        may be used as regressions, but a passing copied suite is not independent full-source evidence.
      breaking_artifact: Exact source path/line or bounded independent synthetic reproduction of a frozen obligation
        violation; untested uncertainty explicitly distinguished from reproduced defects.
    blindness:
      mutual: false
      lifted_for:
      - TASK-20260908-49c4b4
      rationale: Fresh independent hardening review after both prior spectral rounds and the second corrected producer
        were archived. Prior completed reports/checks and source versions are deliberately visible; no concurrent
        reviewer report or parent conversation may be read.
    proves_too_much:
      objects:
      - Zero successful collisions with positive work, for which finite charged cost is undefined.
      - Unequal-success null arms whose mean cost differs from total work divided by total successes.
      - One missing heldout cell or one coordinate arm that fails the effect threshold, for which a complete-panel
        positive verdict is false.
      - An arbitrary hash-bound text document or forged PASS report without reachable archive/source binding.
      - A completed-looking final directory missing one mandatory canonical artifact.
      - A failed certificate hidden among otherwise successful controls.
      - A failed first exploratory cell followed by any scheduled heldout work.
      - A post-rename parent-fsync or quarantine failure that leaves a canonical-looking failed run without an explicit
        durable state.
      - A valid-looking archived PASS report for different source bytes or the wrong reviewed/executing commit roles.
      failure_signature: The derivation must refuse finite gain for zero successes and refuse a positive complete-panel
        verdict for missing or failed arms; use pooled work/success counts.
      assigned_to: TASK-20260908-49c4b4
