    joints:
    - joint: Corrected executable spectral protocol and admission/custody conformance
      assigned_to: TASK-20260908-49c4b4
      attack_plan: Read the entire unchanged specification/amendment and second corrected implementation. Audit
        every obligation and canonical output, not merely V01..V08. Independently construct fixed synthetic/mock
        attacks on exploratory/heldout ordering and missing cells, failed certificate immediate stop, topology/first-repeat
        summaries and per-diagnostic costs, UTC/CPU intervals, post-rename/quarantine/receipt failures, genuine
