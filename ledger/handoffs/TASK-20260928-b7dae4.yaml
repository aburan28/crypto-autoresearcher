  goal_id: GOAL-ECDLP2M-001
  batch_id: BATCH-67c132
  review_plan_id: null
  title: >-
    Read-only ranking of every open ECC proposal under RQ-BINSTD-b6f698,
    RQ-CERTBIN-836ce2, RQ-ICPERF-94c86e, RQ-QSP-f9bbdb, RQ-FROB-7d8dd4 and
    RQ-SATIC-1ae57a that DEC-20260924-99ce20 did not rank, plus a re-rank of
    DEC-20260924-99ce20's HOLD-A to HOLD-G in the light of the 26 reviews and
    the validator pass
  objective: >-
    Produce one audited row per pool proposal, a deduplication map across the
    six questions (and against the 36 proposals DEC-20260924-99ce20 already
    ranked), a recommended re-ordering of HOLD-A to HOLD-G, and a ranked top
    three for /design-experiment. DEC-20260928-63addc uses it as advisory
    input. This card closes, rejects and edits nothing.
  uncertainty_reduced: >-
    Which of the proposals filed on 2026-09-26/28 (and any other unranked open
    one in the six areas) are distinct, sound enough to design, and
    decision-changing per unit cost; which duplicate each other or a
    99ce20-ranked row; which price themselves against the wrong quantity
    (the floor-to-rho gap instead of the per-attempt budget,
    CORR-20260928-4cb669); which lack a proof_search_map audit; which carry a
    breakthrough, closure or contradiction claim (tripwire); and whether the
    26 reviews and the validator pass change the order of HOLD-A to HOLD-G.
  inputs:
    - >-
      THE POOL, pasted VERBATIM into the launch prompt by the top-level
      session at dispatch: the output of `python3 tools/ecc_priority.py
      --open-ideas --area X` for X in BINSTD, CERTBIN, ICPERF, QSP, FROB,
      SATIC, MINUS the 36 ids DEC-20260924-99ce20 official_ranking lists. The
      pasted output governs. The authoring Coordinator expects, from a glob of
      this checkout on 2026-09-28: BINSTD (12) IDEA-20260926-120d6a, -136bd3,
      -178821, -1db0e8, -201e86, -20ba8f, -5c26f9, -6f2601, -80209d, -b48c9d,
      -beb5b6, -cafcf1; CERTBIN (13) IDEA-20260926-0d1d74, -3c6a19, -4b65e3,
      -89886c, -917981, -9c5694, -9cc043, -a79052, -ae8f0a, -b6cc43, -bbf2ed,
      -d06324, -d3c5a5; ICPERF (5) IDEA-20260926-1ddce2, -3cc0b8, -c98e92,
      -d1adfc, -dacb83, plus the older open ICPERF ids the tool lists; QSP (1)
      IDEA-20260926-bc1cab; FROB (1) IDEA-20260926-197ecf; SATIC (1)
      IDEA-20260926-b11cb1 plus the older open SATIC id the tool lists. The
