  read_scope_note: >-
    Proposals that are not open, and the 36 proposals DEC-20260924-99ce20
    ranked, are read for deduplication and for the HOLD re-rank only and are
    not given a pool row. EXCLUDED READS: every path under
    coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-b67954/,
    coordination/review/nistbin-20260925-b67954/,
    coordination/review/binstd-20260925-b67954/, the branch
    cursor/ecdlp2m-revision-design-3d1a and any version-2 contract or
    hypothesis block it carries; experiments/EXP-QSP-70b731/runs/;
    experiments/EXP-FROB-30006a/; the ref
    origin/cursor/semaev-2015-audit-program-5b8b; PR #1377. Knowledge
    retrieval (search_knowledge) is used before asserting that an avenue was
    tested or is known to fail; if the index is empty, say so and do not
    treat an empty result as evidence.
  constraints:
    - >-
      READ-ONLY and ZERO RUNS. Write only the two declared files. Edit no
      proposal, question, correction, decision or any other record. Mint no
      identifier. Write no hypothesis or experiment. Run no solver and no
      program. Every arithmetic check is written out in the report, step by
      step, and listed in an arithmetic_checks section with an id (A1, A2, ...).
    - >-
      NO DISPOSITION BEYOND A RECOMMENDATION. Do not close, reject, withdraw,
      weaken or supersede any proposal or lane. A recommendation to hold or
      deprioritise names its evidence, test boundary, remaining uncertainty
      and a concrete revisit condition (AGENTS.md "Research-direction
      integrity"). The 26 reviews are advisory input, not verdicts; a review
      that disagrees with a recorded hold (IDEA-20260922-29b1c5, HOLD-E) is
      reported as a disagreement with the review's stated reason, never as a
      re-disposition.
    - >-
      APPLY DEC-20260924-4f8a03 R2. BINSTD owns the reachability table and
      structural-emptiness certificates only; CERTBIN, NISTBIN and OAKLEY own
      measured decomposition cost on their own families; mechanism owners
      (SEMBIN, QSP, ICPERF, FROB, SDEG/DREG, RELN, SATIC) keep their
      quantities. A proposal that re-measures another owner's quantity is
      flagged, not ranked as new work. Record each row's owning question and,
      for RQ-ICPERF-94c86e, RQ-FROB-7d8dd4 and RQ-SATIC-1ae57a rows, the
      owning goal (GOAL-ICPERF-e6b6a4, GOAL-FROB-6333a9, GOAL-SATIC-c49b77),
      because a design under those questions is routed to that goal, not
      opened on GOAL-ECDLP2M-001.
    - >-
      PRICE AGAINST THE BUDGET, NEVER THE GAP. For every row that quotes an
      ECC2K-130 m >= 4 oracle budget, record WHICH quantity it uses under
      CORR-20260928-4cb669's pin: D1 the floor-to-rho gap (2^-4.41 at m = 4),
      D2 the producer's per-target budget (2^+5.71), or D3 the re-optimised
      per-attempt budget (2^+11.01). A row that prices against D1 as a
      per-attempt budget is flagged in pareto_check with the exact field
      quoted; the number is not corrected. Floors are read at the finding's
      N = 4r ambient unless the record states a subgroup-restricted base, in
      which case the 4/(m+1)-bit shift applies and is shown.
    - >-
      MATCHED-RHO CONVENTION. Check every rho baseline against
      CORR-20260922-81aeab: 0.886 sqrt(r)/sqrt(k), equivalently
      sqrt(pi r/(4k)); on ECC2K-130, k = 131 and rho is 2^60.8090. Report each
      deviation with the exact field and formula as written. Do not correct it.
    - >-
      PRIOR ART. For every round-2 record (the 22 with a prior_art block),
      read prior_art.rows_checked and the record's top five hits in
      novelty-screen-round2.md, and state in citation_provenance_flags
      whether any top hit states the proposal's mechanism (the round's own
      screen says none does; check it, do not copy it). For every round-1
      record (novelty_status unverified, no web search), record that
      novelty is unverified and name any recalled reference a load-bearing
      number rests on.
    - >-
      SCOPE. Any proposal whose minimal test runs an ATTACK on a curve at
      m >= 131 is flagged out of scope under RQ-BINSTD-b6f698's "ARITHMETIC
      ONLY AT DEPLOYED PARAMETERS" constraint and the siblings' equivalents.
      Arithmetic-only rows at deployed parameters are in scope.
    - >-
      TRIPWIRES. A breakthrough-shaped claim, a closure result, or a
      contradiction of a validated evidence record is listed under
      tripwire_items with the exact passage quoted. Candidates the authoring
      Coordinator noticed from titles alone, to be checked and never assumed:
      IDEA-20260926-178821 ("one decomposition ... solves ECC2K-130 with zero
      relations"), IDEA-20260926-20ba8f ("the product law is a single-target
      verdict"), IDEA-20260926-136bd3 ("would beat matched rho by about 13
      bits"), IDEA-20260926-197ecf ("kills the m!"), IDEA-20260926-3c6a19
      (an above-cap window at m >= 5). None is judged here.
    - >-
      INDEPENDENCE. A fresh research-deep session that did not author
      DEC-20260928-157d40, any proposal in the pool, any of the 26 reviews, or
      the validator pass.
    - >-
      OUTCOME DISCIPLINE. No AUXIN census value, reviewer finding value,
      RUN-FROB-627924 value or EXP-FROB-30006a outcome appears in either file.
      Nothing about any EXP-QSP-70b731 run. Nothing read from the excluded
      paths, attested in the report.
  deliverables:
    - >-
      ranking-report.yaml. One row per pool proposal, in the pasted pool's
      order, with the nine card fields of TASK-20260924-25a6b2: (1)
      dedup_cluster with members across the six questions AND any
      99ce20-ranked row it overlaps, and the owner under R2; (2)
      reachability_cells, each typed structurally_empty, computed_cost or
      open; (3) proof_search_map_audit, for each of the four KN-TECH-080
      audits one of present, not_applicable with the proposal's reason, or
      missing; (4) pareto_check, whether dominated_by and sota_delta are
      filled and consistent with the corrected rho convention AND which
      budget quantity (D1, D2, D3) the row prices against, deviations quoted;
      (5) result_class, exponent_moving, constant_factor,
      structural_certificate or tooling, judged against
      docs/target-result-profile.md C1; (6) citation_provenance_flags,
      including the prior_art top-hit reading; (7) compute_class,
      zero_compute_derivation, arithmetic_only_deployed, executable_toy_cell
      (n <= 41) or out_of_scope, naming any missing instrument (numpy, a SAT
      or Groebner engine) the record's own test declares; (8)
      first_decisive_deliverable, its cost and the decision it would change;
      (9) recommended_disposition, design_now, design_after (naming the
      prerequisite), merge_into (naming the survivor), route_to_owner
      (naming the owning goal), return_for_revision (naming the defect) or
      hold (with evidence, boundary and revisit condition). Then: a
      hold_rerank section recommending an order for HOLD-A to HOLD-G with the
      review finding that moves each (or "unchanged"); a ranked top three for
      /design-experiment on GOAL-ECDLP2M-001 with reasons; a zero-compute
      structural-certificate shortlist; tripwire_items; arithmetic_checks;
      and an attestation of what was read, the excluded paths not read, the
      exact tool output received, and the served model with fallback_used.
    - >-
      dedup-map.yaml. Clusters of overlapping proposals across the six
      questions and against the 99ce20-ranked rows, each with members, the
      shared object or quantity, and a recommended survivor or merge.
  artifact_paths:
    - coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-67c132/ranking/TASK-20260928-b7dae4/ranking-report.yaml
    - coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-67c132/ranking/TASK-20260928-b7dae4/dedup-map.yaml
