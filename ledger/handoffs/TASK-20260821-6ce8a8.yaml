  constraints:
    - RUNS ALONE. No concurrent writer during the archive.
    - >-
      VERIFY RUN VALIDITY BEFORE INTERPRETING: expected run count,
      schema-complete manifests, seed integrity, raw/summary agreement, control
      comparability. An invalid or incomplete run set goes back to the Executor
      with concrete defects listed -- it is not evidence.
    - Run `python3 tools/check_review_independence.py --batch
      coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa` and record its
      output.
    - The records assert nothing beyond the two review reports and the frozen
      package. Invent, repair, or estimate nothing in prose.
    - Compose, do not average. Report any red-team/validator disagreement about
      the gate as a LOCALISATION to one of two named implementations, never as a
      split difference.
    - >-
        Rule explicitly on the recorded prior P-R1: confirmed, refuted, or not
        discriminated. A refuted prior is a first-class result and is unrecoverable
        if folded into "the design was fine".
    - >-
      POLICY ESCALATION: if any result CONTRADICTS EV-MDFIVE-ab007d's
      obstruction as that record scopes it, do NOT record a decision on it.
      Stop, record the contradiction, and require a separate review-breakthrough
      round at max effort in an independent session before any status moves
      (AGENTS.md rule 12). That policy may never be degraded.
    - Claim tier `analyzed`, NEVER `supported`. Name explicitly which of
      CLAUDE.md's four promotion gates are unmet and why. "HEUR-H1 tested once at
      toy scale" is NOT "H1 validated".
    - If the direction is weakens/contradicts, or any lane closes, the
      `obstruction` block is REQUIRED and must be a MEASUREMENT -- quantity,
      value with units and error bars, runs it is read from, and a scope no wider
      than the closure -- with a non-null `resource_check`.
    - Before any adverse transition, secure the strongest checkable refutation
      artifact the result admits (counterexample certificate, then derivation
      note, then a declared empirical_only basis) and cite it in
      proof_status/proof_refs. `reject_scoped` on a single unreplicated
      empirical-only run is FORBIDDEN; use `weaken` plus replication.
    - >-
        `knowledge_promotion` is a required mapping; promote a KN-FIND on
        support/reject_scoped backed by replicated/strong evidence (proven
        boundaries count), otherwise record a concrete not_warranted reason. Do not
        commit the generated, .gitignore'd knowledge/INDEX.md.
    - No success criterion moves after outcomes were observed without a versioned
      protocol_amendment record (SC-9).
    - Never record an attestation you did not obtain. No `completion_quorum`
      block is required; if present it is validated in full and must describe a
      review that really happened. A single DISSENT blocks closure.
    - A gate stop or a FAILED two-way gate is recorded as the batch result
      honestly. It ends that task, not the goal, and it is not written up as a
      failure.
    - Mint the closing decision id via
      `python3 tools/allocate_id.py --next decision --date 20260821 --check`, and
      REGENERATE the dispatch queue with the real path (replacing the
      DEC-20260821-PENDINGMINT sentinel in artifact_paths and archive.record_ids)
      before committing.
    - Merge origin/main before committing (MERGE, NEVER REBASE); record the base
      commit checked and the merge outcome. A sync conflict inside an immutable
      record becomes a new superseding record, never an edit. Push and refresh
      the PR against main.
    - No official transition may be made from uncommitted artifacts, and none is
      official until the post-commit verifier accepts it.
    - Never read the quarantined payload (SC-6); no Bedrock (SC-8).
  deliverables:
