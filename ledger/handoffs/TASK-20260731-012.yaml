handoff:
  id: TASK-20260731-012
  from: coordinator
  to: idea-generator
  goal_id: GOAL-FAEST-001
  batch_id: BATCH-001
  objective: >-
    Obtain the FAEST Round-3 specification and reference implementation from the
    primary sources, verify each citation, and file them as four KN-LIT
    literature entries (KN-LIT-7637, KN-LIT-7638, KN-LIT-7619..7620) plus a sources note, so that no later
    FAEST experiment is designed against an unfiled or unverified source.
  inputs:
    - GOAL-FAEST-001.yaml and RQ-FAEST-001.yaml (scope and claim_tier_ceiling)
    - knowledge/README.md and the KN-LIT-7616 entry (entry format)
    - tools/build_knowledge_index.py (index rebuild is the archive task's job, not yours)
  constraints:
    - >-
      File exactly four KN-LIT entries: KN-LIT-7637 (FAEST Round-3
      specification), KN-LIT-7638 (FAEST/VOLEitH conference paper, Crypto 2023,
      eprint 2023/996), KN-LIT-7619 (reference implementation, faest-ref),
      KN-LIT-7620 (NIST IR 8610 Round-3 status report or, if unobtainable, the
      NIST additional-signatures program page).
    - >-
      Every entry requires citation_verified: true and a precise, checked
      citation. A citation you could not verify by fetching the primary source
      is marked citation_verified: false with the exact obstruction recorded.
    - >-
      Follow the KN-LIT frontmatter format in knowledge/literature/KN-LIT-7616.md.
      Do not hand-edit knowledge/INDEX.md; the snapshot archive task regenerates
      it with tools/build_knowledge_index.py.
    - >-
      Fetch order (source-preference order): faest.info spec -> NIST
      round-3-additional-signatures page -> faest-sign GitHub reference
      implementation. If every primary source is unobtainable, record the exact
      obstructions in sources_note.md; the Coordinator will pause the goal
      rather than proceed on unverified summaries.
    - >-
      Record in sources_note.md: which URLs were fetched, HTTP results, file
      checksums, versions, and whether copies came from raw git objects or
      rendered pages.
    - >-
      Do not design an experiment, create no hypothesis/evidence/decision
      record, and change no official state. Record requested policy, resolved
      model identifier, fallback status, and session independence in
      sources_note.md.
    - Do not fabricate commands, outputs, timings, citations, or successful fetches.
  deliverables: [KN-LIT-7637.md, KN-LIT-7638.md, KN-LIT-7619.md, KN-LIT-7620.md, sources_note.md]
  artifact_paths:
    - knowledge/literature/KN-LIT-7637.md
    - knowledge/literature/KN-LIT-7638.md
    - knowledge/literature/KN-LIT-7619.md
    - knowledge/literature/KN-LIT-7620.md
    - coordination/goals/GOAL-FAEST-001/batches/BATCH-001/tasks/TASK-20260731-012/sources_note.md
  archived_by: TASK-20260731-013
  inference:
    policy: research-deep
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 2700
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
    - >-
      All four KN-LIT entries exist with the exact filenames, correct
      frontmatter, and citation_verified set honestly (true only when the
      citation was actually fetched and checked).
    - >-
      sources_note.md records the fetched URLs, HTTP results, checksums,
      versions, and the policy/model metadata.
    - No experiment, hypothesis, evidence, or decision record was created, and no official state changed.
  authorized_by: DEC-20260731-020 (batch decision recorded at BATCH-001 ledger archive)
  recorded_by: coordinator
  recorded_at: '2026-07-31'
