  dispatchable: false
  dispatch_gate: >-
    THIS HANDOFF IS NOT DISPATCHABLE AND MUST NOT BE PLACED IN A DISPATCH QUEUE
    IN A READY STATE. It becomes dispatchable if and only if ALL of the
    following are true in COMMITTED state:
    (G1) experiments/EXP-PEC-27c7a3/specification.yaml has
    `status: approved` and a non-null `approved_by`. It currently reads
    `status: review_required` and `approved_by: null`.
    (G2) The FOUR blocking preconditions of that contract are discharged:
    PRE-1, a recorded campaign_budget authorization permitting a further
    executor task against GOAL-P13-001 (which is `closed_at_budget`,
    batches_consumed 4, batches_remaining 0, and whose next_action states that
    NO FURTHER EXECUTOR BATCH IS AUTHORIZED under the current spent budget) or
    a re-parenting of the contract to a new goal with its own budget; PRE-2,
    acceptance of the SP-3 handling over the w axis; PRE-3, the approver has
    read the contract's coordinator_prior_before_execution; and PRE-4, A
    COMMITTED DETERMINATION OF WHICH vOW MEMORY CONVENTION GOVERNS. PRE-4 IS
    THE HARDEST OF THE FOUR AND THE EXECUTOR MUST NOT WORK AROUND IT:
    RUN-WESOVOW-001 and RUN-WESOVOW-201692-001 are both committed, use
    different vOW normalizations, differ by 0.5*log2 M = 46.6389 bits at
    NIST-I, and disagree on whether the assessed method beats the baseline at
    all. If this handoff is ever dispatched with PRE-4 unresolved, the Executor
    REFUSES and reports the refusal rather than picking a variant - and in
    particular must not pick variant (A) merely because CTL-1's known-answer
    gate is built from OBS-M, which is faithful to variant (A) and therefore
    ENFORCES it rather than testing it.
    (G3) A Coordinator snapshot archive has committed IDEA-20260803-48e258,
    H-PEC-189c70, the frozen specification.yaml and this handoff by exact path,
    and the dispatcher's post-commit receipt has verified it. A contract that
    exists only in a working tree is not frozen; a contract that exists only in
    a local commit is unpublished.
    UNTIL THEN THIS RECORD IS A DESIGN ARTIFACT, NOT AN ASSIGNMENT. An Executor
    that receives it anyway must refuse and report the refusal rather than
    begin work.
  why_it_exists_unapproved: >-
    The design skill writes the handoff at the same lifecycle step as the
    contract so that the approval gate has a complete package to judge -
    objective, constraints, deliverables, budget and completion gate - rather
    than a promise that one will be written later. Writing it does not
    authorize it.

  objective: >-
    Reduce exactly one uncertainty: WHETHER THIS CAMPAIGN'S OWN MODELLED
    COMPARISON IS BETTER CONDITIONED WHEN REPORTED AS A CROSSOVER LOCUS
    p*(w_mem) THAN AS A SCALAR MARGIN AT (NIST-I, w_mem = 2^30). Concretely:
    emit the frozen deliverable grid of EXP-PEC-27c7a3 and report whether the
    locus band, as a fraction of its own value in log2 p, is strictly narrower
    than the committed margin band [8.3498, 13.1544] is as a fraction of its
    midpoint 10.7521 - i.e. strictly below the frozen comparator 0.44685. A
    finding that it is NOT narrower, or that the locus is undefined or unrun
    where it would have to be read, is a COMPLETE AND VALUABLE DELIVERABLE and
    is what this Coordinator expects.
  uncertainty_reduced: >-
    The conditioning of a REPORTING OBJECT. NOT the attack, NOT Heuristic 1,
    NOT any deployed parameter set, NOT any cost this campaign has not already
    charged, and NOT the concrete_threat_nist1 position, which remains
    INCONCLUSIVE under SP-4 whatever this task returns.

  inputs:
    - experiments/EXP-PEC-27c7a3/specification.yaml
    - ledger/hypotheses/H-PEC-189c70.yaml
    - ledger/proposals/IDEA-20260803-48e258.yaml
    - ledger/decisions/DEC-20260802-48c72c.yaml
    - ledger/evidence/EV-PEC-857664.yaml
    - ledger/evidence/EV-PEC-2e67ff.yaml
    - ledger/goals/GOAL-P13-001.yaml
    - ledger/hypotheses/H-WESO-001.yaml
    - experiments/EXP-WESOVOW-001/cost_model.py
    - experiments/EXP-WESOVOW-001/runs/RUN-WESOVOW-001/raw-result.json
    - docs/claims-and-verification.md
    - docs/inventor-protocol.md
    - AGENTS.md

  constraints:
    - >-
      THE CONTRACT IS FROZEN. Execute experiments/EXP-PEC-27c7a3/specification.yaml
      LITERALLY: its crossover definition XO-DEF, baseline cost model XO-BASE,
      uncertainty-propagation rule XO-PROP, fitted-window boundaries XO-WIN,
      the five pre-registered predictions P1-P5, the eleven-step
      execution_order, the five controls CTL-1..CTL-5 and the twelve
      invalidation rules INV-1..INV-12 are all binding as written.
    - >-
      THIS HANDOFF DIRECTS NO EXECUTION ORDER, TOLERANCE, WINDOW, ESTIMATOR OR
      PREDICTION THAT DIFFERS FROM THE FROZEN CONTRACT, AND COULD NOT.
      DEC-20260802-48c72c adjudication H upheld a governance defect against a
      dispatching Coordinator for exactly that, and its remedy binds this
      batch: if an order must change, the instrument is a versioned
      protocol_amendment recorded BEFORE execution, or a superseding contract.
      A dispatch message cannot amend a frozen protocol. If you find an
      underspecification, REPORT IT - do not resolve it.
    - >-
      NO NUMBER MAY BE INVENTED, RECALLED, INTERPOLATED BEYOND ITS FITTED
      WINDOW, OR ESTIMATED. Every emitted number carries a MET-9 provenance
      label in {MEASURED, MODELED, DERIVED, TRANSCRIBED, UNDEFINED, UNRUN} and
      a source record ID. An unlabelled number is INV-12. A required quantity
      that is neither committed nor transcribable makes its segment UNDEFINED
      or UNRUN, never estimated (AGENTS.md rule 9).
    - >-
      MEASURED AND MODELED NEVER MIX IN ONE COLUMN. The fitted (log2 A, gamma)
      pairs are MODELED-FROM-MEASURED, not MEASURED; the fitted level at
      ell = B_opt is a FITTED value at an unobserved abscissa (CORR-3, MA-8)
      and the only correct phrasing is that the fitted per-entry cost curve,
      evaluated at ell = B_opt, is 21.2 to 25.2 bits above Section 4.1's
      convention. Never "the measured prefactor is 2^9.73", and never
      "2^8.92 is the prefactor" - 8.924066290325673 belongs to the SUPERSEDED
      mixed-response fit and the pairing rule forbids combining it with a
      seam-free gamma.
    - >-
      c IS USED ONLY AS THE BRACKET, NEVER AS A NUMBER, with all eight
      mandatory attachments MA-1..MA-8 on every emitted object. SP-1 is
      PERMANENT: c = 0.864 / 0.771 / 0.868 / 1.0389 / the c_kappa values may
      appear only in a column explicitly labelled "superseded input being
      corrected".
    - >-
      EVERY STANDING PROHIBITION OF DEC-20260802-48c72c BINDS, FOUR OF THEM
      PERMANENTLY: SP-1..SP-12. In particular SP-3 (margins quoted at
      w_mem = 2^30 only; larger-w rows are not improvements - attach it to
      every other w row), SP-7 (bootstrap endpoints are never the uncertainty
      on c), SP-9 (C-NULL's per-step cost is never a Delfs-Galbraith
      measurement), SP-10 (alpha = 1 is DERIVED and MECHANISM-INCONSISTENT,
      never measured-consistent), SP-11 (no W-TOP-derived c as an estimate or
      bracket endpoint) and SP-12 (the NC2b-G1 pass is not validation of the
      corrected law).
    - >-
      THE FC-4 MECHANISM-INCONSISTENT DESIGNATION STANDS on the ell set it
      fired on, {3,5,7,11,13}, and is retired BY MEASUREMENT only within
      ell in {47,101,151,211}. That retirement may NOT be cited as
      contract-verified while defect D-8 stands - the two frozen contracts
      EXP-P13-NC2b/specification.yaml and EXP-P13-NC2d/specification.yaml do
      not currently parse as YAML.
    - >-
      CLAIM TIER CAPPED AT `medium` FOR THE INPUT MEASUREMENTS, AND THE LOCUS
      ITSELF CARRIES NO CLAIM TIER AT ALL. Every emitted object is labelled
      MODEL SUBSTITUTION; NO CLAIM TIER. No `crypto` tier is available and none
      is claimed. No review-breakthrough tier is available in this campaign and
      none may be claimed (AGENTS.md rule 12).
    - >-
      YOU RECORD OBSERVATIONS ONLY. You do not interpret, do not promote, do
      not change any hypothesis or experiment status, do not write to
      ledger/, and do not decide whether the hypothesis is supported. The
      Coordinator alone adjudicates. Report anomalies and deviations openly
      with their authority named; `anomalies: []` beside a report listing
      anomalies is the inversion RT3-C10a recorded and must not recur.
    - >-
      A TIMEOUT, CRASH, MISSING DEPENDENCY, OR NETWORK FAILURE IS AN
      INFRASTRUCTURE OUTCOME AND IS NEVER MATHEMATICAL EVIDENCE ABOUT THE
      HYPOTHESIS (AGENTS.md rule 5; INV-11). In particular, failure to retrieve
      the baseline constant k is an infrastructure/availability outcome that
      triggers F5 - ratio form only, absolute locus UNRUN, P1 NOT EVALUATED -
      and is never a finding about the locus.
    - >-
      STOP AND EMIT NOTHING if the known-answer gate CTL-1 fails (F1). Stop and
      report F6 rather than loosening any window predicate. Stop on budget
      exhaustion and report the exhaustion as such.
    - >-
      NOTHING YOU PRODUCE MAY CLAIM OR IMPLY ANY CRYPTANALYTIC IMPROVEMENT. The
      sota_delta is ZERO on time, memory, data and queries. Nothing here bears
      on ECDLP, SIDH/SIKE, CSIDH, SQIsign security, (qt-)Pegasis, or
      torsion-based constructions. If prediction P1 fails (F3), you report it as
      a statement about a MODEL and you are FORBIDDEN from reporting it as a
      concrete threat finding or as moving concrete_threat_nist1 off
      INCONCLUSIVE.
    - >-
      DO NOT COMMIT. Do not stage, commit, push, or open a pull request. A
      separate Coordinator-only archival task owns every commit. Write only
      inside your write_scope.

  deliverables:
    - "The frozen deliverable grid: p*(w_mem) over w_mem in {2^20, 2^25, 2^30, 2^35, 2^40}, for all eighteen measured-gamma readings and both L4 scenarios, with the L2 charging-point correction applied at both ends of [0.60, 1.00] and SIGNED, and both overhead conventions - machine-readable, every cell carrying its value-or-label and its provenance"
    - "MET-3, the known-answer-gate residuals: per-row deviations against the eight committed OBS-M rows and the in-band verdict for all eighteen readings"
    - "MET-2, the band-width ratio against the frozen comparator 0.44685, or an explicit NOT EVALUABLE with the reason named"
    - "MET-4, the null-baseline displacement of the locus (or of D at each committed field size under NO_CROSSOVER_IN_RANGE)"
    - "MET-5, the named adversarial corner most favourable to the attack, with its p* value or verdict, beside the RT3-C2 saturation reading"
    - "MET-6, the ENUMERATED undefined/unrun-segment inventory with the failing predicate and the missing input named for each - not a count"
    - "MET-7, MET-8: the L4 scenario separation with its joint/split verdict on P1, and the instrument-response monotonicity check on the w axis with clamp flags"
    - "MET-9, MET-10, MET-11: the measured-vs-modeled provenance ledger, the hidden-overhead disclosure, and the memory accounting with log2 M beside the run's own peak_rss_bytes"
    - "The MISSING-K transcription with quoted excerpt and source SHA-256, OR an explicit UNOBTAINED record naming what was attempted"
    - "The attachments file: MA-1..MA-8 verbatim, the FC-4 label with its localisation, Heuristic 1's unvalidated status, and the o(1) / unmeasured-octave disclosure"
    - "A complete run manifest per the AGENTS.md artifact policy, and an execution report recording every deviation with its authority named and every anomaly enumerated"

  artifact_paths:
