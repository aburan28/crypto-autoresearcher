  write_scope:
    - experiments/EXP-PEC-27c7a3/implementation/
    - experiments/EXP-PEC-27c7a3/runs/RUN-PEC-27c7a3-a/
  write_scope_note: >-
    EXCLUSIVE AND NON-OVERLAPPING, both under the experiment directory. The
    frozen specification.yaml is OUTSIDE the write scope and is read-only: it
    is never edited, and a needed change is a versioned protocol_amendment or a
    superseding contract. experiments/EXP-PEC-27c7a3/amendments/ is outside the
    write scope because only the Coordinator authors an amendment. ledger/,
    knowledge/ and coordination/ are outside the write scope entirely. A write
    outside this scope is refused and the refusal is recorded.

  archived_by: null
  archived_by_note: >-
    NULL BY NECESSITY AND NOT BY OMISSION. Exactly one Coordinator-only
    archival task must own the snapshot of this task's run package, and that
    task's id cannot be minted here: it is allocated by the batch that
    dispatches this work, under a campaign budget that does not currently
    exist (PRE-1). The approving Coordinator MUST mint it with
    `python3 tools/allocate_id.py --next task --date <today>` and `--check` it,
    fill this field, and assign this run package to that archival task and to
    no other, BEFORE dispatch. A run package assigned to no archival task, or
    to more than one, is an evidence-integrity failure.
  separately_required_archival_tasks: >-
    Two further archival tasks are required downstream and are named here so
    they are not discovered late: a SNAPSHOT archive of the run package before
    any independent review reads it, and a LEDGER archive of the evidence,
    decision and any status transition after review. They run ALONE, stage only
    their declared paths, and record a post-commit receipt the dispatcher
    verifies.

  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
    recording_requirement: >-
      Record `requested_policy: executor-implementation` in the manifest
      alongside the exact resolved model identifier, the backend, the reasoning
      effort, `fallback_used`, `model_verified` and its reason, and any
      `degraded_requirements`. With fallback_allowed false and degraded_allowed
      false, a backend that cannot serve this policy is a REFUSAL to be
      reported, never a silent substitution (AGENTS.md rule 11). If this
      harness cannot resolve the policy alias - as INFAMEND-20260802-P13-002
      records for this campaign - that is recorded as `fallback_used: true`
      with its reason, and the Coordinator must issue an inference_amendment
      before the run is treated as authorized rather than the Executor
      proceeding on its own authority.

  budget:
    wall_clock_seconds: 1800
    memory_gb: 2
    maximum_runs: 2
  budget_note: >-
    NO FIELD IS NULL; this Coordinator would reject its own handoff if one
    were. The two authorized runs are the R1 self-reproduction pair in separate
    processes, not two independent trials. Compute is effectively free -
    deterministic re-execution of a committed pure-Python cost model over a p
    grid plus bisection, with no isogeny computation and no sampling. These
    numbers sit far inside GOAL-P13-001's committed total_wall_clock_seconds of
    21600 and max_concurrent of 3, and NO CEILING IS INVENTED HERE THAT THE
    GOAL RECORD DOES NOT CONTAIN. The genuinely binding budgets are
    AUTHORIZATION (PRE-1: the goal is closed_at_budget with batches_remaining
    0) and REVIEW CAPACITY (the R3 independent re-derivation plus an
    independent adversarial pass before any citation).

  completion_gate:
    - "The specification SHA-256 recorded in the manifest matches the committed blob (INV-1 not triggered)."
    - "The committed cost_model.py, re-executed, reproduces IN-COMMITTED-FIELD-GRID's log2B_opt, log2T_full and log2T_DG at all five committed field sizes (INV-2 not triggered)."
    - "CTL-1 executed and its verdict reported: all eighteen readings in [8.3498, 13.1544] and all eight committed rows within 0.001 bits in margin and 1e-6 in c - OR a clean F1 stop with per-row residuals reported and nothing else emitted. EITHER OUTCOME SATISFIES THIS GATE ITEM; a run that stops correctly at F1 is a complete run."
    - "CTL-2, CTL-3, CTL-4 and CTL-5 each executed and each reporting a verdict with its numbers, or reporting a documented reason it could not be evaluated - and no control silently skipped."
    - "MET-1..MET-11 all present in the artifacts, with MET-6 enumerated rather than counted and MET-9 labelling every emitted number with a source record ID."
    - "The MISSING-K arm resolved one way or the other: a transcription with excerpt and hash, or an explicit UNOBTAINED record with the absolute locus reported UNRUN and P1 NOT EVALUATED."
    - "R1 self-reproduction run in a separate process with byte-identical output (INV-8 not triggered)."
    - "Every required artifact of the contract present at its declared path, with a complete manifest per the AGENTS.md artifact policy including peak_rss_bytes and the inference block."
    - "The execution report records every deviation with its authority named and enumerates every anomaly; no artifact carries an empty anomaly list contradicted by another."
    - "No prohibited citation appears anywhere in the package (INV-9), every emitted object carries MA-1..MA-8 and the SP-3 attachment where it applies (INV-10), and no number is unlabelled (INV-12)."
  completion_gate_note: >-
    THIS GATE IS SATISFIABLE BY A NEGATIVE RESULT AND THAT IS DELIBERATE. A run
    that stops at F1, or emits only the ratio form under F5, or reports
    NO_CROSSOVER_IN_RANGE and F6 throughout, MEETS this gate provided it did so
    by the frozen rules and documented it. The gate measures protocol
    compliance and artifact integrity, never the favourability of the outcome.

  return_format: >-
    An execution report at
    experiments/EXP-PEC-27c7a3/runs/RUN-PEC-27c7a3-a/execution_report.yaml
    carrying, in this order: the completion-gate verdict item by item; the five
    control verdicts with their numbers; the five pre-registered predictions
    P1-P5 each marked MET / FAILED / NOT EVALUATED with the deciding metric
    named; the falsification conditions F1-F6 each marked FIRED / NOT FIRED;
    the enumerated undefined/unrun inventory; every deviation with its
    authority named; every anomaly; and the inference block. STATE OBSERVATIONS
    AND VERDICTS AGAINST PRE-REGISTERED CRITERIA ONLY. Do not interpret, do not
    recommend a status transition, and do not characterise any outcome as good
    or bad news for the attack.

  review_plan: null
  review_plan_note: >-
    NULL HERE BECAUSE THIS HANDOFF DOES NOT OPEN A REVIEW ROUND - it is the
    producer task. A review_plan is REQUIRED on the handoff that opens the
    claim-changing review round that must follow, and that round is mandatory
    rather than optional: this experiment touches the concrete_threat_nist1
    position, so an independent Validator and an independent Red Team are
    reserved per AGENTS.md "Dynamic dispatch". That plan must name, at minimum,
    these joints, each owned by exactly one reviewer: (J1) the reconstruction
    of the ten uncommitted readings and the CTL-1 residuals; (J2) the XO-WIN
    window predicate and whether any emitted DEFINED point is in fact out of
    window; (J3) the XO-PROP envelope and whether it is anywhere presented as a
    confidence interval; (J4) the sign convention of XO-DEF and whether the
    reported crossover direction is the one the contract froze. It must also
    carry a `proves_too_much` block and require the R3 BLIND RE-DERIVATION of
    MET-2 from the frozen definitions and committed inputs only, with the
    Executor's implementation and report in `blind_from`.

