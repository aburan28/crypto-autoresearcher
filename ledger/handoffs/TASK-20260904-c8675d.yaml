handoff:
  id: TASK-20260904-c8675d
  from: coordinator
  to: red-team
  goal_id: GOAL-SSI-001
  batch_id: BATCH-dc1424
  role: red-team
  joints_owned:
    - J5 blind independent re-transcription of the five pairs
  also_owned:
    - proves_too_much
    - blind_rederivation
  objective: >-
    Produce a SECOND, INDEPENDENT instance of the measurement this batch exists
    to make, not an audit of the first. In Phase A, reading only the frozen paper
    and the frozen specification's unit declarations, locate Section 4.1 and
    transcribe the five (log2 time, log2 memory) pairs yourself with a locator
    for each, and judge per value whether the paper states it in a form directly
    comparable to the cost model's declared units. In Phase B, only then, open
    experiments/EXP-WESOVOW-001/cost_model.py lines 56-70 and compare your
    transcription against the committed literals value by value. Run the plan's
    proves-too-much control on your own transcription procedure.
  uncertainty_reduced: >-
    Whether the five committed literals survive a reading of the source by an
    agent that has never seen them, has never seen the producer's answer, and
    cannot reconstruct either from any record it is permitted to read. This is
    the one check that can see a transcription that is wrong and
    self-consistent, which is exactly what recomputing from the producer's
    artifacts cannot.
  inputs:
    - inputs/P13-WESOLOWSKI-2026/paper_fulltext.md (Phase A; the target, read-only)
    - inputs/P13-WESOLOWSKI-2026/source_record.yaml (Phase A; provenance of that document)
    - experiments/EXP-WESOVOW-001/specification.yaml (Phase A; unit_of_cost, unit_of_memory and field_sizes_log2p - this file contains none of the ten values)
    - experiments/EXP-WESOVOW-001/cost_model.py (PHASE B ONLY; the committed literals are at lines 61-65)
    - The review plan on TASK-20260904-d66403's task card, whose joint J5, proves_too_much control and blind_rederivation are yours
    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/archives/TASK-20260904-977d04/snapshot_commit_receipt.json
  constraints:
    - >-
      PHASE A IS FIRST, IS WRITTEN DOWN BEFORE ANYTHING ELSE IS OPENED, AND IS
      NOT REVISED AFTERWARDS. Write your transcription, your locators, your
      per-value comparability judgement, and your count of how many distinct
      places in Section 4.1 state any of these quantities BEFORE you open
      cost_model.py or any other Phase B input. If Phase B changes your mind
      about the paper, record that as a separate Phase C note; do not edit Phase
      A.
    - >-
      DO NOT READ, AT ANY POINT, ANY PATH IN THE PLAN'S `blind_from`: the six
      producer artifacts under BATCH-dc1424/tasks/TASK-20260904-d66403/,
      ledger/evidence/EV-SSI-5d954c.yaml, BATCH-256a94's
      anchor_reconciliation.json and anchor_reconciliation.md, both BATCH-256a94
      review reports, and both directories under
      experiments/EXP-WESOVOW-001/runs/. Every one of them either carries the ten
      values or lets them be reconstructed by arithmetic. You may read
      TASK-20260904-d66403/task_card.yaml, which is deliberately value-free.
    - >-
      DO NOT LIST OR GLOB the producer's task directory, the reviews directory,
      or the runs directory. A directory listing is a read for this purpose when
      the filenames or sizes would tell you what the package concluded.
    - >-
      Set `blind_from_respected: true` in your attestation only if it is true,
      and list every path you read in `sources_read`. AN HONEST LEAK REPORTED IS
      RECOVERABLE AND COSTS ONE TASK; AN UNREPORTED ONE INVALIDATES THE ROUND. If
      you read a blind_from path, say so, stop the blind phase, and report - the
      batch has a declared stop condition for exactly this.
    - >-
      THE PHASE ORDERING WITH RESPECT TO cost_model.py AND
      ledger/decisions/DEC-20260904-166ab5.yaml IS ATTESTED, NOT TOOL-CHECKED.
      Those two are Phase B inputs and are therefore not in blind_from, so
      tools/check_review_independence.py cannot verify that you opened them after
      writing Phase A. Your attestation must state the ordering explicitly. This
      limit is disclosed rather than papered over.
    - >-
      Independent session. Do not read the sibling validation report; blindness
      is mutual. The reviews directory is not in your read_scope.
    - >-
      Report on YOUR joint. You own J5 and cannot see J1-J4 by construction, so
      do not return a whole-claim verdict; the Coordinator composes.
    - >-
      Copy the joint name verbatim into joints_owned in your review attestation:
      "J5 blind independent re-transcription of the five pairs".
    - >-
      YOUR REPORT IS A .yaml FILE WITH A TOP-LEVEL `review_attestation` MAPPING.
      In BATCH-256a94 the reports were .md, so
      tools/check_review_independence.py - which yaml.safe_loads the whole report
      file - could read neither attestation and the independence gate could not
      run at all. Write red_team_report.yaml as valid YAML that yaml.safe_load
      parses.
    - >-
      RUN THE PROVES-TOO-MUCH CONTROL on all four declared known-false objects,
      against YOUR OWN transcription procedure, and report what your procedure
      actually did on each. A pass where the conclusion is known false is a
      BREAK, not a robustness result. Check also that your procedure ACCEPTS
      something; a procedure that rejects every input has rejected the decoys for
      no reason and its rejections carry no information either.
    - >-
      THREE OUTCOMES ARE ALL REAL RESULTS FOR YOU TOO. If Section 4.1 does not
      state these quantities in a directly comparable form, your Phase A finding
      is that, said plainly, with the section's actual form quoted. An honest
      `undetermined` is the most decisive thing this round could produce, not a
      shortfall, and you must not manufacture a comparison to avoid it.
    - >-
      READ-ONLY on experiments/ and inputs/, and DO NOT EXECUTE cost_model.py at
      all - its default output path writes into a committed run directory, a
      standing evidence-integrity hazard. Read it as text.
    - >-
      `maximum_runs` ON THIS CARD BOUNDS EXECUTIONS OF EXPERIMENT CODE, PRODUCER
      IMPLEMENTATIONS, AND ANYTHING THAT WRITES A RUN RECORD; your own throwaway
      arithmetic and scratch scripts are NOT runs (DEC-20260904-166ab5 PD-4).
      This batch authorizes zero new experiment runs.
    - >-
      Do not repair, complete, or rewrite any artifact of any other task. Do not
      change any status, write any ledger record, or commit anything.
    - >-
      Restate the citation prohibition and its predicate extension verbatim, do
      not lift either, and state whether either fired on anything you produced.
      You may RECOMMEND lifting or retaining with conditions; a recommendation is
      not a decision.
    - >-
      Make no security, SQIsign, CSIDH, standardized-parameter, exponent, or
      asymptotic-complexity claim in either direction, and construct no attack.
      Your comparison is between a document and five committed numbers; it says
      nothing about whether the paper's result is correct, and no sentence may
      imply that it does.
    - >-
      A timeout, crash, missing dependency, or exhausted budget is an operational
      observation and never mathematical evidence.
    - >-
      Never select a provider, backend, endpoint, or model identifier containing
      Bedrock, case-insensitively.
  deliverables:
    - >-
      red_team_report.yaml: a parseable YAML document with a phase_a block
      written before any Phase B input was opened (transcription, locators,
      per-value comparability judgement, count of distinct statements of these
      quantities in Section 4.1, and the search performed); a phase_b block with
      the value-by-value comparison against the committed literals and its
      per-value outcome from agree, disagree, or incomparable; the
      proves-too-much results on all four declared objects including any pass
      where the conclusion is known false; a verdict on J5; an explicit
      recommendation on the citation prohibition marked as a recommendation; a
      limitations list; and a top-level review_attestation block whose
      sources_read is honest and complete and may be grouped by phase.
  artifact_paths:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/reviews/TASK-20260904-c8675d/red_team_report.yaml
  read_scope:
    - AGENTS.md
    - agents/red-team.md
    - docs/claims-and-verification.md
    - docs/inventor-protocol.md
    - templates/research-records.md
    - inputs/P13-WESOLOWSKI-2026
    - experiments/EXP-WESOVOW-001/specification.yaml
    - experiments/EXP-WESOVOW-001/cost_model.py
    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/batch.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/dispatch_queue.json
    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/tasks/TASK-20260904-d66403/task_card.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/tasks/TASK-20260904-c8675d/task_card.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/archives/TASK-20260904-977d04/snapshot_commit_receipt.json
    - ledger/decisions/DEC-20260904-166ab5.yaml
  read_scope_note: >-
    Narrowed on purpose, and the narrowing is the point of this task rather than
    a restriction of evidence. experiments/EXP-WESOVOW-001 is listed as two exact
    files rather than as a directory, because runs/ is blind_from. The batch
    tasks directory is listed as two exact task cards rather than as a directory,
    because the producer's six artifacts are blind_from. The batch reviews
    directory is absent, because the sibling report lives there.
    experiments/EXP-WESOVOW-001/cost_model.py and
    ledger/decisions/DEC-20260904-166ab5.yaml are PHASE B ONLY; everything they
    bind on this task - the citation prohibition, its predicate extension, and
    the PD-2 and PD-4 rulings - is restated verbatim on the task card so that
    Phase A needs nothing from them.
  write_scope:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/reviews/TASK-20260904-c8675d
  archived_by: TASK-20260904-cb8d1d
  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 3000
    memory_gb: 2
    maximum_runs: 3
  completion_gate:
    - The Phase A transcription appears in the report and is stated to have been written before any Phase B input was opened, with its sources named.
    - No blind_from path appears in sources_read, and blind_from_respected is explicitly true; or a leak is reported honestly and the task stops.
    - Phase A carries a per-value comparability judgement and a count of the distinct places in Section 4.1 that state any of these quantities, or an explicit statement that none does.
    - Phase B compares value by value against the committed literals and records agree, disagree, or incomparable for each.
    - The proves-too-much control is run on all four declared objects and its results are reported, including any pass where the conclusion is known false, and including whether the procedure accepts anything at all.
    - J5 carries a verdict, a worked attack, and at least one concrete objection or an explicit account of how a search for one failed.
    - The report is a YAML file that yaml.safe_load parses, with a top-level review_attestation listing the joint name verbatim, read_sibling_reports false, blind_from_respected explicit, and a verdict of holds, breaks, or inconclusive.
    - The citation prohibition and its predicate extension are restated verbatim, neither is lifted, the recommendation is explicitly not a decision, and no security, parameter, exponent, or asymptotic claim is made.
    - cost_model.py was never executed and nothing under experiments/ or inputs/ was modified.
  return_format: >-
    A short report in the final message naming your Phase A comparability
    finding, the Phase B per-value outcome counts, the proves-too-much results,
    your J5 verdict, and every limitation - without restating any of the ten
    values, which belong in the artifact. Findings live in the artifact; a result
    that exists only in a message did not happen.
  review_plan: null
  review_plan_note: >-
    Null and correctly so: this handoff receives a review assignment, it does not
    open a round. The round's plan is on TASK-20260904-d66403, and this task's
    blind_from list is defined there.
  recorded_at: '2026-09-04'
  recorded_by: coordinator
