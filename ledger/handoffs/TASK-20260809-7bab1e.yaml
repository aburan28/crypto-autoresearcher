    - >-
      A MISSING OR PARTIAL INFERENCE BLOCK, A MISSING artifact_provenance LIST,
      A DIGEST MISMATCH, OR A NON-ADDITIVE SHARED-FILE EDIT IS A
      COMPLETION-GATE FAILURE AT DISPATCH: TASK-20260809-23abf9 is RETURNED AS
      INCOMPLETE with the defect named concretely and is NOT archived, and
