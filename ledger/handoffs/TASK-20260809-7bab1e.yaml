    - >-
      RECOMPUTE EACH RANK-1 ARTIFACT'S SHA-256 YOURSELF and confirm it matches
      the entry asserted by protocol-act-manifest.json. Record both values for
      every artifact. A provenance list that does not match the bytes is a
