    - >-
      VERIFY THE PROVENANCE GATE ON THE RANK-1 PACKAGE BEFORE COMMITTING, IN
      THE IDENTICAL LANGUAGE THE PRODUCER CARDS CARRY. protocol-act-manifest.json
      is designated THE COVERING MANIFEST in its own text and carries an
      artifact_provenance entry for every declared TASK-20260809-23abf9
