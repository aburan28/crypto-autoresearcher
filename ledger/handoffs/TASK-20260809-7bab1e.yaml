  objective: >-
    MAKE THE BATCH-001 GATE DURABLE BY COMMITTING IT, ALONE, BEFORE ANY PRODUCER
    IS DISPATCHED — AND DECLARE THAT COMMIT AS A TASK RATHER THAN LEAVING IT AS
    AN IMPLICIT ACT OF THE DISPATCHING SESSION. This archive covers TWO source
    tasks and it covers them in DIFFERENT WAYS, stated plainly rather than
    blurred.
    (i) TASK-20260809-23abf9, THE RANK-1 PROTOCOL ACT: its FIVE declared
    artifacts (stamps.json, CM-1-cost-model.yaml, adoption-record.yaml,
    protocol-act-manifest.json, and protocol-amendment-GOAL-AES-002-001.yaml)
    together with the TWO additive shared-file edits
    (docs/claims-and-verification.md, tools/validate_ledger.py) are STAGED,
    COMMITTED AND PUSHED BY THIS TASK in an isolated coordination commit, and
    the branch's PR against `main` is opened or refreshed naming the amendment
    and the task.
    (ii) TASK-20260809-93d82c, THE QUEUE-DRAFTING ACT: its artifacts ARE THE
    CONTROL PLANE ITSELF — the batch record, the dispatch queue, the nine task
    cards, the nine handoff records, DEC-20260809-16c8f4, the goal head update
    and the drafting receipt — and they are committed BY THE DISPATCHING SESSION
    IN THE SAME COMMIT THAT LANDS THIS QUEUE, before this task ever runs. THIS
    TASK THEREFORE DOES NOT RE-STAGE THEM; IT BINDS THEM, recording that
    commit's sha, its parent and a SHA-256 for every control-plane path in this
    receipt, as the archive of record for TASK-20260809-93d82c. THAT IS THE
    HONEST MAPPING AND IT IS SAID PLAINLY: covering TASK-20260809-93d82c here
    does NOT promise a separate future commit of its artifacts, and no reader of
    this receipt may take it as promising one.
    WHY THIS TASK EXISTS AT ALL: the first draft of this queue left the rank-1
    commit implicit, and tools/research_dispatch.py REJECTED that queue because
    every non-archive task must be assigned exactly once to an archive task. The
    gate ordering is unchanged — rank 1's artifacts are still committed before
    ranks 2 and 3 are dispatched — but the commit that enforces it is now a
    DECLARED, BUDGETED, REVIEWABLE task instead of an unbudgeted side effect.
  uncertainty_reduced: >-
    Whether the BATCH-001 gate is durable at the moment it gates. RQ-AES-002
    makes CM-1 a hard pre-dispatch gate and BLK-1 a blocker that must be
    resolved before any card that could produce a solve is dispatched; a gate
    that exists only in a mutable working tree when the card it gates is issued
    is retroactive enforcement, which this program refuses. It also determines
    whether the control plane itself — the queue, the cards, the handoffs and
    the opening decision that authorise every later BATCH-001 act — exists as
    committed, pushed, verifiable bytes rather than as a local draft.
