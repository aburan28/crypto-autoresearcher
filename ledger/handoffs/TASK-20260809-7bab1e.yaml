      waive it, do not refer it forward, and DO NOT REPAIR, EDIT, EXTEND OR
      RE-RUN any rank-1 artifact to make it pass.
    - >-
      BIND THE CONTROL-PLANE COMMIT RATHER THAN RE-CREATING IT, AND SAY SO IN
      THE RECEIPT IN PLAIN WORDS. TASK-20260809-93d82c is covered by this
      archive because its artifacts land in the commit the dispatching session
