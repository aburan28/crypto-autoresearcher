handoff:
  id: TASK-20260731-005
  from: coordinator
  to: red-team
  goal_id: GOAL-FAEST-001
  batch_id: BATCH-001
  objective: >-
    Independently review (a) the KN-LIT-7637, KN-LIT-7638, KN-LIT-7619..7620 source filing for citation
    precision and honesty, and (b) the three IDEA records for schema
    completeness, object-first discipline, matched-baseline presence,
    falsifiability, and novelty honesty, and return a verdict on which ideas
    are admissible for experiment design.
  inputs:
    - The verified sources snapshot (TASK-20260731-013 receipt)
    - The verified ideation snapshot (TASK-20260731-015 receipt)
    - RQ-FAEST-001.yaml and GOAL-FAEST-001.yaml
  constraints:
    - Independent session required; this review must not share lineage with either producer.
    - >-
      Separate checks: (1) receipt validity of both snapshots, (2)
      citation/source correctness, (3) IDEA schema completeness and
      object-first discipline, (4) matched-baseline correctness (does the idea
      actually challenge the stated baseline, or is the baseline mis-stated?),
      (5) novelty honesty.
    - >-
      Flag any idea whose mechanism does not name an exact object as
      underspecified; flag any idea whose matched baseline is missing or
      mis-stated as incomplete.
    - Change no producer artifact and no official state.
    - >-
      Record requested policy, resolved model identifier, fallback status, and
      session independence in review_report.yaml.
  deliverables: [review_report.yaml, objections.md]
  artifact_paths:
    - coordination/goals/GOAL-FAEST-001/batches/BATCH-001/tasks/TASK-20260731-005/review_report.yaml
    - coordination/goals/GOAL-FAEST-001/batches/BATCH-001/tasks/TASK-20260731-005/objections.md
  archived_by: TASK-20260731-006
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 1800
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
    - The report names all fatal and nonfatal objections across the five separate checks.
    - >-
      Each IDEA record receives an explicit admissibility verdict (admit /
      require revision / reject) with a bounded falsification route for any
      admitted idea.
  authorized_by: DEC-20260731-020 (batch decision recorded at BATCH-001 ledger archive)
  recorded_by: coordinator
  recorded_at: '2026-07-31'
