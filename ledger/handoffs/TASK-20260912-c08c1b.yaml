    - >-
      Background, for the record. This session's original fix
      (TASK-20260912-2100f6, all five findings, archived as
      TASK-20260912-8178a2) and a concurrent session's independent fix
      (TASK-20260912-f821b2/TASK-20260912-688e64/DEC-20260912-34c82d,
