      origin/main, then merging the concurrent session's own further pushes
      to this session's PR branch after a non-fast-forward push rejection),
      resolving each hunk on technical merit -- full detail is in this
      session's git history on claude/point-addition-bias-t2dow9 (commits
      ac956b5ec, c1baa9c15, ab355d5fc, b1fa3e107) even though that reconciled
      state itself never reached main. Before this task's own reconciliation
      commits could be pushed, cursor[bot] auto-merged PR #1126 at
      2026-09-12T11:08:03Z, capturing an intermediate commit
      (7fa7c54ddb9d63a0fce54b7e31655a90a1c328cf) from the concurrent agent's
      OWN independent resolution of the identical conflict -- not this
      task's reconciliation, and not even that agent's own final commit
      (they kept pushing for several more minutes, apparently unaware the
      PR had already merged). The two-round reconciliation this session
      performed is therefore moot as a merge decision: main picked its own
      resolution unilaterally. What is NOT moot is checking whether that
      resolution is actually correct, and whether anything this session
      wrote of independent value survived it.
    - >-
      Diffed origin/main's current arithmetic.py/rho.py/driver.py against
      this session's own final (unmerged) reconciled state to find every
      remaining difference. Result: exactly three, all documentation-only,
      zero functional difference. (1) driver.py's check_cgroup_admission
      docstring claims "if both are supplied they must agree" about the
      job_type/job_kind keyword alias the concurrent session added; the
      actual code (`if job_type is not None: job_kind = job_type`) has no
      agreement check and no raise -- job_type silently wins. Fixed the
      docstring to say so. Also restored this session's own
      refuse-rather-than-assume sentence about an unrecognized job_kind,
      absent from main's version but consistent with, and not contradicting,
      anything the concurrent session wrote. (2) rho.py's
      EndpointTable.insert_if_absent docstring is missing this session's own
      original C11 explanatory paragraph (present since this session's very
      first fix commit, predating any merge); it was not on main because,
      during this session's own second reconciliation round, an unrelated
      auto-merge step dropped it without either side's commit messages
      naming that as a deliberate removal -- restored verbatim. (3)
      arithmetic.py had one stray extra blank line before a section comment,
      left over from resolving a conflict marker somewhere upstream; removed
      for consistency with the file's own two-blank-line convention
      elsewhere. No other difference exists: main's arithmetic.py already
      has point_add_planted/point_double_planted (the concurrent session's
      own deliberate, disclosed choice to keep them, per its commit
      messages) and the corrected C6 Y3/Z3 formula with planted_sink
      threading; main's driver.py already has the job_kind design with the
      job_type alias; this session's own C8 documentation on scalar_multiply
      already survived on main unchanged.
    - >-
      Verified the actually-shipped code is correct, not merely internally
      consistent, before publishing any change: imported main's
      arithmetic.py and ran `scalar_multiply` + `normalize` against 150
      random scalars on the real secp256k1 curve, comparing every result to
      an independently-written, from-scratch pure-Python affine-coordinate
      double-and-add reference (naive modular-inverse formulas, no code
      shared with arithmetic.py) -- 0 mismatches, confirming the C6 fix that
      reached main is arithmetically correct, not just textually
      self-consistent. Ran `scalar_multiply_planted` against 30 further
      random scalars and confirmed both value-agreement with
      `scalar_multiply` and the exact count identity M_planted == 2 *
      M_reference on every trial -- 0 failures, confirming C9's composition.
      Directly exercised rho.py's `EndpointTable.insert_if_absent` with two
      inserts sharing one key_hash and one (x, y) endpoint but different
      other fields; the second insert correctly returned (False, the first
      slot), confirming the C11 fix that reached main actually works, not
      just that its dead-code bug is textually absent. `python3 -m
      py_compile` clean on all three files both before and after this task's
      edits; an AST walk confirms no duplicate class/function definitions in
      any of the three files.
