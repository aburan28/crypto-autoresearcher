      third variant merely for authorship's sake.
    - Do not edit or delete TASK-20260912-2100f6.yaml, TASK-20260912-8178a2.yaml,
      or main's TASK-20260912-f821b2.yaml / TASK-20260912-688e64.yaml /
      DEC-20260912-34c82d.yaml -- each remains an accurate immutable record of
