  completion_gate:
    - >-
      ROUND 1 (this branch vs. main). arithmetic.py had exactly one textual
      conflict hunk: point_add's corrected Y3/Z3 computation (C6). This
      branch's fix used plain `.mul()`; main's used
      `_top_level_mul(..., planted_sink)`, matching how every other top-level
      M in the same function is already routed. Checked against the pre-fix
      common ancestor: `_top_level_mul` and the `planted_sink` parameter on
      `point_add`/`point_double`/`normalize` did NOT exist before either fix
      -- both were added by main's branch only (confirmed: this branch's
      pre-merge point_add/point_double took no `planted_sink` parameter at
      all). Taking this branch's own Y3/Z3 text as-is would have left the
      corrected lines silently unplanted (an exact-count-identity violation,
      spec.arithmetic.planted.exact_count_identity) while every sibling M in
      the same function was planted -- an internal inconsistency, not a
      stylistic difference. Resolved by taking main's hunk.
    - >-
      ROUND 1, continued. Outside that one flagged hunk, git's line-based
      merge silently concatenated two non-overlapping same-purpose additions:
      this branch's new `point_add_planted`/`point_double_planted`/
      `scalar_multiply_planted` functions (a from-scratch C9 composition),
      and main's own, separately designed `scalar_multiply_planted` (which
      instead threads the existing `planted_sink` parameter through the
      unmodified `point_add`/`point_double`). Both fully close C9. Because
      both land under the same function name `scalar_multiply_planted`, the
      merged file (pre-resolution) defined it TWICE at module scope -- a real
      latent bug py_compile cannot catch: Python keeps only the later
      definition, silently shadowing this branch's `point_add_planted`/
      `point_double_planted`-based one into dead, unreachable code, not a
      conflict git's line-based diff can see. Round 1 resolved this by
      deleting this branch's entire redundant composition; round 2 (below)
      restored it for a different reason.
    - >-
      ROUND 1, continued. driver.py's check_cgroup_admission had two
      independent C12 designs: this branch's took a required, no-default
      `job_type` parameter and raised ValueError on an unrecognized value;
      main's takes `job_kind` defaulting to "arithmetic" and treats an
      unrecognized value as a graded refusal (an admitted=False
      CgroupAdmissionResult), consistent with the function's own stated
      "refuse rather than assume/fabricate" contract. Grepped the whole
      repository on both pre-merge branches: neither has any call site for
      check_cgroup_admission beyond its own definition and descriptive text
      in admission-template.json/preparation-report.yaml (both branches
      independently document it as "an unexercised interface"). Resolved by
      taking main's design in full. rho.py's only round-1 conflict was a
      docstring-only addition with zero code difference; kept main's text.
    - >-
      Pushing round 1's merge commit (ac956b5ec61957bdc824877ac2594f7d7ee6b9ae)
      was rejected: non-fast-forward. `git fetch` showed
      origin/claude/point-addition-bias-t2dow9 had moved to b7d2959ce, via
      Cursor Agent commits authored between the round-1 conflict appearing
      and this task pushing its resolution. Their merge commit message (
      9157a9a45) reads in full: "Resolve EXP-CRYPTO-9225d2 implementation
      conflicts by keeping main's completed C6/C9/C11/C12 repairs
      (_top_level_mul, job_kind cgroup admission, endpoint-match comment);
      retain PR repair artifacts." A second commit (31a814ad1) elaborates:
      "Conflict resolution keeps main's load-bearing implementations, and
      retains this branch's unique revise-fix value: C8 caller-responsibility
      documentation ...; point_add_planted / point_double_planted mirrors
      named by this PR's preparation-report; job_type keyword alias on
      check_cgroup_admission for revise-fix docs; TASK-20260912-2100f6 /
      TASK-20260912-8178a2 handoffs and snapshot archive." Both are
      co-authored by aburan28@gmail.com. ROUND 2 merged this update
      (`git merge origin/claude/point-addition-bias-t2dow9`) into round 1's
      commit rather than force-pushing over it.
    - >-
      ROUND 2 conflicts. (a) arithmetic.py: the Cursor Agent's resolution
      restored `point_add_planted`/`point_double_planted` (which round 1 had
      deleted) as a deliberate, reasoned choice -- its own new comment states
      they are "merge-retained alongside planted_sink ... so revise-fix
      documentation that names them stays accurate," explicitly NOT wired
      into the shipped `scalar_multiply_planted` (which still uses the
      `planted_sink`-threaded path). This is a real, considered trade-off
      (independent structural cross-check vs. dead code with a public
      `__all__` export), not an error; round 2 accepted it rather than
      re-deleting it a second time, per this task's own constraint against
      re-litigating a reasoned choice already made. (b) driver.py: the Cursor
      Agent added a keyword-only `job_type` alias to `check_cgroup_admission`
      ("if job_type is not None: job_kind = job_type") specifically so the
      round-1-superseded `job_type` naming used in this branch's own
      documentation stays callable. Accepted, and merged with round 1's own
      docstring addition (the refuse-rather-than-assume sentence) rather than
      dropping either. Caught and fixed one inaccuracy introduced by their
      docstring in the same hunk: it claimed "if both are supplied they must
      agree," but the actual code silently prefers `job_type` with no
      agreement check or raise; corrected the docstring to say `job_type`
      wins, matching the real behavior. (c) rho.py: no textual round-2
      conflict, but not a clean carry-through either -- git's 3-way merge
      silently DROPPED this branch's own original C11 explanatory paragraph
      in EndpointTable.insert_if_absent's docstring (present since this
      branch's pre-round-1 tip 35030a4ca, confirmed by direct inspection):
      the Cursor Agent's branch tip had removed it, round 1's commit hadn't
      touched those exact lines further, so the 3-way merge took the changed
      side with no conflict raised. Neither of their commit messages lists
      this paragraph among what was deliberately retained or dropped, unlike
      their explicit call-outs for C8/point_add_planted/job_type -- so unlike
      those, this was not a reasoned choice to accept, and this task's own
      constraint (accept only genuine, reasoned judgment calls; decide
      everything else on its merits) means restoring pre-existing,
      unsuperseded documentation is correct rather than deferential.
      Restored verbatim in a follow-up commit (ab355d5fc) after diffing the
      final round-2 result against origin/main and noticing the unexplained
      loss; confirmed identical to the original text via `git show` on the
      pre-round-1 tip. A stray extra blank line left over from resolving
      arithmetic.py's round-2 markers was tidied in the same commit.
    - >-
      Verification actually performed (see the corrected constraints bullet
      above for why this exceeded this task's own originally-stated
      no-execution constraint). Imported the final, twice-merged
      arithmetic.py/rho.py and: (1) ran `scalar_multiply` + `normalize`
      against 300 random scalars total (200 immediately after round 2, a
      further 100 after the rho.py restoration commit) on the real secp256k1
      curve and compared every result against an independently-written,
      from-scratch pure-Python affine-coordinate double-and-add reference
      (naive modular-inverse formulas, no shared code with arithmetic.py) --
      0 mismatches across all 300, confirming the C6 fix (taken from main in
      round 1) is not merely internally consistent but arithmetically
      correct; (2) ran `scalar_multiply_planted` against 50 random scalars
      and confirmed both value-agreement with `scalar_multiply` and the
      exact count identity M_planted == 2 * M_reference on every trial -- 0
      failures; (3) ran the round-2-restored `point_add_planted` against 50
      random point pairs (each itself a `scalar_multiply`-derived point) and
      confirmed exact value agreement with `point_add` -- 0 failures, which
      also substantiates that keeping `point_add_planted`/
      `point_double_planted` in round 2 (rather than re-deleting them) left
      genuinely correct, not merely harmless, code behind; (4) directly
      exercised the twice-merged `EndpointTable.insert_if_absent` with two
      inserts sharing one key_hash and one (x, y) endpoint but different
      other fields -- the second insert correctly returned (False, the first
      slot), confirming the C11 fix in its exact final byte-content, not
      just in the pre-restoration text this task read. `python3 -m
      py_compile` clean on all three files after every round; an AST walk of
      arithmetic.py's module-level function
      definitions shows no duplicate names after either round; `__all__`
      matches exactly the set of defined names with nothing missing or
      stale; grep across the whole repository confirms no other file calls
      `check_cgroup_admission` under either parameter name, so neither
      round's driver.py choice had any call-site compatibility cost.
    - >-
      Confirmed after both rounds that this branch's one contribution not
      present in either concurrent fix -- C8 (scalar_multiply's
      normalization-ownership documentation) -- survives unchanged, and that
      all five original findings (C6, C8, C9, C11, C12) remain closed in the
      final merged source, not just the four the concurrent BATCH-53f590 fix
      closed.
    - >-
      All ten declared files' path_sha256 in this task's snapshot were
      recomputed via sha256sum against the final post-round-2 bytes on disk,
      independent of any producer- or peer-session-reported value; the seven
      files neither main nor the Cursor Agent's push touched hash-match
      TASK-20260912-8178a2's snapshot exactly.
  review_plan: null
