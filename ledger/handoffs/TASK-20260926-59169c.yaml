    - "the executor's development outputs and return message; any PR text; coordination/bus/"

  constraints:
    - id: CP-1
      text: >-
        VERIFY BEFORE COMPARING. (1) Both reviewer directories match the
        TASK-20260926-9c0134 receipt's path_sha256. (2) Each seal.txt matches
        its sealed files. (3) blind-inputs.json matches the
        TASK-20260926-58d32c receipt. (4) The 9c0134 receipt reports no
        blocking defect (seal, blind_from, must_not_read, import scan). Then
        map pool labels to run keys with blind-inputs-key.json and replay keys
        "NCONV-REPLAY:<slot>:<role>" to "N-CONV:<slot>:<role>".
    - id: CP-2
      text: >-
        COMPARE EVERY ITEM BELOW and tabulate agree/disagree per item and per
        system.
        Q0 against draws-N-CONV.jsonl.gz, instances.jsonl.gz and support.json:
        U and S_L; per slot, the attempt indices of both kept systems, their
        rows (compare decoded matrices, not hash strings, then the E_sha256
        convention separately), s of every attempt, every rejection; the same
        for Q0-opt arms where present.
        Q1 against closures.jsonl.gz (M_4): rank, "1 in rowspace(M_4)",
        dims_by_deg d = 0..3 and P on every unsatisfiable N-CONV system (and
        satisfiable, if present).
        Q2-Q5 against instances.jsonl.gz and closures.jsonl.gz for every pool
        system: s; rank_3, rank_4, the two "1 in R" flags, dims_by_deg(M_4), P;
        W_4 dims per iteration, fixpoint index, one_first_iteration, final
        dimension, dims_by_deg(W_4); rc_b kernel dimension, c, ell's support
        and constant, label, j*, rank R'_3, and R'_4 rank, one and
        dims_by_deg.
        Against certificate-verification.json and certificates.jsonl.gz: J1's
        per-line verdict against the run's, key by key; MN1, MN2 and MN3
        recounted from J1's verdicts only under the frozen counting rule, with
        NC-DR-1..4 re-applied by the frozen text; state whether any verdict
        changes. Also J1's VC-2 kept-part table against the run's C-CONSTRUCT,
        C-SUPPORT and C-ELL records.
        Also: each J7 and J1 ambiguity, set against how the run resolved it
        (trial-plan-v1.json readings, impl/README.md, implementation.md).
    - id: CP-3
      text: >-
        CHECK EVERY J7 wdag-v1 CERTIFICATE with your own minimal checker,
        written before you read the re-deriver's code. Build f_k for pool
        systems from blind-inputs.json and for replay systems from J7's own
        rows (and, separately, from the run's instances.jsonl.gz rows where the
        replay matched). Check rules (a)-(e) of object.certificate_format.
        Report per certificate: valid, invalid (first violated rule), or
        absent. Then state, per run key in the pool and per N-CONV
        unsatisfiable slot, whether its refutation is witnessed by J7, by J1's
        verification of the run's certificate, by both, or contradicted.
    - id: CP-4
      text: >-
        LOCALISE EVERY DISAGREEMENT: (a) read both implementations at the
        specification clause concerned; (b) run a third, minimal,
        specification-literal check on that one system or stream step, in your
        own code, declared; (c) name which side departs from the specification
        text, or the ambiguity both sides read differently. A disagreement in a
        per-iteration record where "1 in W_4" and the final dimension agree is
        reported as such; W_4 is a least fixpoint, so it may reflect the
        iteration schedule rather than the closure.
    - id: CP-5
      text: >-
        VERDICT ON J8: `holds` if every compared quantity agrees (or every
        disagreement localises to a re-deriver or verifier side, or to an
        encoding difference) AND every run-counted refutation in the compared
        sets is witnessed and none is contradicted; `breaks` if any
        disagreement localises to the producer's implementation, or a
        run-counted refutation is contradicted; `inconclusive` if a
        disagreement cannot be localised, or a genuine ambiguity was read
        differently by both sides (name the clause). State which compared items
        sit at a floor or ceiling for every system, and therefore are weak
        evidence about the implementation.
    - id: CP-6
      text: >-
        REPORT ON J8 ONLY. Do not read the validator's or the red team's
        reports. No verdict on the claim. Zero trials; third checks on at most
        20 systems or stream steps plus the CP-3 checks on every certificate,
        declared. Memory cap 3 GB; PYTHONDONTWRITEBYTECODE=1.
    - id: CP-7
      text: >-
        DISCLOSED PRIOR (review-plan PD-R1). The Coordinator's review prior
        names where it expects disagreements. Do not let that decide where you
        look hardest; compare everything in CP-2.

