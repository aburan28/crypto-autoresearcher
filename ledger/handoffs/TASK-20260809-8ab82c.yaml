handoff:
  id: TASK-20260809-8ab82c
  from: coordinator
  to: executor
  goal_id: GOAL-AES-002
  question_id: RQ-AES-002
  batch_id: BATCH-001
  rank: 3
  parent_decision: DEC-20260809-16c8f4
  task_card: coordination/goals/GOAL-AES-002/batches/BATCH-001/task-cards/TASK-20260809-8ab82c.md
  depends_on:
    - TASK-20260809-7bab1e
  dispatch_precondition: >-
    NOT DISPATCHED until CM-1, protocol-amendment-GOAL-AES-002-001 and the
    adoption record — authored by TASK-20260809-23abf9 — are COMMITTED, PUSHED
    AND VERIFIED by the opening snapshot archive TASK-20260809-7bab1e. THE
    DEPENDENCY IS ON THE ARCHIVE, NOT ON THE AUTHORING TASK: an artifact that
    has been written but not committed, digest-checked and pushed has not
    closed a gate, and a gate uncommitted when the card it gates is issued is
    the retroactive enforcement this program refuses.
  objective: >-
    RESOLVE, BY MEASUREMENT RATHER THAN BY ASSERTION, THE NAMED CONTRADICTION
    BETWEEN TWO COMMITTED RECORDS ABOUT THE LOCAL C TOOLCHAIN — RQ-AES-001's
    constraints record gcc 13.3.0 with -maes as AVAILABLE, while GOAL-AES-001's
    next_action records that a GF(2^8) census leg is blocked because it needs
    numpy or a small C program and NEITHER IS INSTALLED — and produce a
    MACHINE-READABLE ENVELOPE RECEIPT carrying: (i) whether gcc exists, its
    resolved version, and whether a -maes program COMPILES AND RUNS, each
    recorded as an executed command with its exit status; (ii) whether numpy
    imports; (iii) MEASURED AES throughput in AES EVALUATIONS PER SECOND PER
    CORE for each implementation actually available — AES-NI via the C probe if
    it compiles, pycryptodome, and pure Python — with the measurement method,
    block count and repetition count stated; (iv) usable RAM and
    physical/logical core count as MEASURED on the host; and (v) THE RESULTING
    PER-TASK AND PER-CAMPAIGN CEILING IN AES EVALUATIONS, derived
    arithmetically from the measured per-core rate, the declared per-task
    budgets and the 22500 s campaign ceiling, with the derivation shown.
    A SECOND DISCREPANCY IS ALSO SETTLED BY THE SAME MEASUREMENT: RQ-AES-002
    constraints declare 4 CPU cores and 15 GB RAM, while the host reading taken
    at queue-drafting time reported 14 physical cores and 48 GB. Measure it; do
    not adjudicate it by argument. ALSO RECORD, as a measurement and not as a
    forecast, the host load average at the moment of measurement, and state
    plainly that a throughput figure measured on a heavily loaded machine is a
    measurement OF THAT MACHINE IN THAT STATE.
  uncertainty_reduced: >-
    Whether any GOAL-AES-002 card may ever declare a budget that depends on
    throughput. RQ-AES-002 constraints make this receipt a REQUIRED FIRST-BATCH
    ARTIFACT and forbid any such declaration until it exists; the
    order-of-magnitude figures in DEC-20260731-031 limitations are UNMEASURED
    SIZINGS to be REPLACED by it, not measurements. It also determines which of
    two committed records describes the actual C toolchain, and whether the
    declared 4-core/15 GB envelope or the observed 14-core/48 GB host describes
    the resource a dispatched task actually gets.
  inputs:
    - >-
      RQ-AES-002 constraints: the LOCAL RESOURCE ENVELOPE item naming the
      contradiction, and what_the_envelope_forecloses.
    - RQ-AES-001 constraints recording gcc 13.3.0 with -maes as available.
    - >-
      GOAL-AES-001 next_action recording that neither numpy nor a C program is
      installed.
    - >-
      The host reading relayed by the dispatching session at queue-drafting
      time: 14 physical cores, 48 GB RAM, load averages 40.48 / 43.60 / 40.25.
      THIS IS AN INPUT TO BE CHECKED BY MEASUREMENT, NOT A FIGURE TO BE
      REPRODUCED.
    - >-
      The committed CM-1, protocol-amendment-GOAL-AES-002-001 and adoption
      record from TASK-20260809-23abf9.
  constraints:
    - >-
      SC-1 C2 STAMP DUTY, AND IT BINDS COORDINATOR TASKS EXACTLY AS IT BINDS
      PRODUCERS. As its FIRST act, before any other work, this task writes a
      stamp record in its own task directory carrying start_utc, start_epoch,
      declared_wall_clock_seconds and a binding_stop_utc COMPUTED AT DISPATCH
      TIME as start plus declared; writes a further stamp at EACH major section
      boundary carrying utc, elapsed_s and a marker naming what was completed;
      HALTS at binding_stop_utc, records halted_on_budget truthfully and NAMES
      the work dropped; and COMMITS those stamps as a DECLARED ARTIFACT of the
      task. The TASK-20260801-810 budget block is the reference
      implementation. A halt at binding_stop_utc is INFRASTRUCTURE SIGNAL,
      never a negative mathematical result (AGENTS.md rule 5), and dropped work
      is SCOPE, never an answer.
    - >-
      SC-2 C4 DECLARATION BASIS. The declared budget is calibrated against
      AUTHORING-INCLUSIVE session elapsed, and the COMPUTE component is
      reported SEPARATELY in its own field. Compute seconds are NOT the charged
      clock and may NOT be offered as evidence of budget compliance (C3).
      Discharging SC-1 is FULL COMPLIANCE even if the dispatcher-observed
      figure later exceeds the declaration; any residual is a campaign-side
      accounting fact and is never a producer defect.
    - >-
      SC-3 COVERING MANIFEST AND CLOSED CLASS VOCABULARY, under
      protocol-amendment-GOAL-AES-001-004 Part B as corrected by
      protocol-amendment-GOAL-AES-001-005 Part C, in force from BATCH-001. AT
      LEAST ONE machine-readable manifest of this task, DESIGNATED THE COVERING
      MANIFEST by this card and by the manifest itself, carries an
      `artifact_provenance` list covering EVERY declared artifact of the task,
      and EVERY OTHER MANIFEST OF THE TASK MUST APPEAR AS AN ENTRY IN IT. Entry
      fields: path, kind, sha256, comment_block_inference_stanza (boolean,
      stated honestly including when false),
      covered_by_this_manifest_inference_block (boolean). A self-referential
      digest is impossible and is recorded as SELF. THE `kind` VOCABULARY IS
      CLOSED AND CASE-INSENSITIVE — SOURCE_CODE, MACHINE_READABLE_MANIFEST,
      PROSE_REPORT, LEDGER_AND_COORDINATION_RECORD — matched ignoring
      underscore/hyphen/space differences; NO FIFTH CLASS MAY BE INVENTED, a
      value outside the vocabulary is a DEFECT TO REPORT rather than a class to
      create, and any machine-readable structured-data artifact resolves to
      MACHINE_READABLE_MANIFEST. Every declared SOURCE_CODE artifact
      additionally carries a comment-block inference stanza in its own text.
      THE COVERING MANIFEST OF THIS TASK IS envelope_receipt.json.
    - >-
      SC-4 R5 ANTI-LAUNDERING CLAUSE, QUOTED VERBATIM FROM RQ-AES-002
      claim_tier_ceiling AND BINDING AS A COMPLETION GATE ON EVERY DELIVERABLE
      OF THIS TASK: "R5. THE ANTI-LAUNDERING CLAUSE. Any record, in any
      location, that states a margin MUST in the SAME SENTENCE (i) name the
      reference as exhaustive key search at the stated key size under CM-1, and
      (ii) declare the published-state-of-the-art comparison UNADJUDICABLE in
      this environment. Transcribing a definitional-reference margin as a
      state-of-the-art margin — in a headline, an evidence record, a decision,
      a synthesis, a status line, a cross-reference, a knowledge entry, a PR
      title or a commit message — is a CLAIM-TIER VIOLATION and is handled
      exactly as docs/claims-and-verification.md handles dropping a conditional
      qualifier: as an assertion above what the record supports. OPERATIONALLY,
      under docs/inventor-protocol.md section 5: every ideation and closure
      deliverable under this question sets `dominated_by: "unresolvable in this
      environment: no primary source reachable; every recalled frontier row is
      unverified-from-memory"` and NEVER `null`, because `null` asserts the
      frontier was checked row by row and it cannot be. `sota_delta` records
      the DEFINITIONAL-REFERENCE delta, explicitly labelled as such, plus the
      word `unadjudicable` for the published frontier."
    - >-
      SC-5 EVERY DELIVERABLE STATING A MARGIN CARRIES THE R5 CLAUSE IN THE SAME
      SENTENCE AS THE MARGIN. Not in a footnote, not in an appendix, not in a
      later paragraph, not in a preamble that the sentence itself does not
      repeat.
    - >-
      SC-6 NO RECALLED LITERATURE FIGURE MAY BE CITED AS AUTHORITY, IN EITHER
      DIRECTION. Every literature statement is UNVERIFIED-FROM-MEMORY
      (eprint.iacr.org, csrc.nist.gov and arxiv.org are unreachable under this
      harness's network policy) and must be marked inline at the point of use.
      It may not be used to promote, dismiss, rank, screen or size anything.
      Using a recalled number to DISMISS a candidate is the same fabrication as
      using it to PROMOTE one, and is additionally the premature-closure
      failure mode CLAUDE.md names as symmetric with overclaiming. Two agreeing
      recollections are ONE draw from a correlated pair, not two.
    - >-
      SC-7 NO COMPARISON AGAINST THE PUBLISHED STATE OF THE ART IS ASKED FOR BY
      THIS CARD, AND NONE MAY BE SUPPLIED. The only quantitative reference
      under this question is the DEFINITIONAL exhaustive-key-search reference
      of R1. `dominated_by` is set to the R5 string and NEVER to null.
    - >-
      SC-8 NO REDUCED-ROUND FINDING IS ASSERTED UNDER THIS GOAL. Reduced-round
      work is admissible here only as a validation-ladder instrument for a
      full-round mechanism, carries `toy` tier, and where it yields a result
      ABOUT reduced-round AES it is recorded under RQ-AES-001's ceiling and
      cross-filed there, never asserted here.
    - >-
      SC-9 ANYTHING NOT ATTEMPTED IS NAMED OPEN AND UNATTEMPTED and is NEVER
      recorded as tried, screened or negative (AGENTS.md rules 5 and 8). A
      count of things not reached is not a finding about the problem.
    - >-
      SC-10 CONCURRENCY. max_concurrent is 3 ACROSS BOTH AES GOALS, not 3 each.
      If GOAL-AES-001 BATCH-005 is in flight and dispatching this task would
      exceed the cap, THIS BATCH WAITS: record WAITED_ON_CONCURRENCY_CAP with
      the time waited and dispatch later at full budget, full deliverable set
      and full review chain. Never run degraded. Measured at drafting time on
      the host by the dispatching session: 14 physical cores, 48 GB RAM, load
      averages 40.48 / 43.60 / 40.25 — heavily oversubscribed. That is a
      measurement at drafting time and NOT a forecast of the load at dispatch
      time; re-check the cap immediately before dispatch.
    - >-
      EVERY FIGURE IN THE RECEIPT IS EXECUTED, NOT ASSERTED. Record the exact
      command, its exit status, its stdout/stderr summary and the resolved tool
      version for every probe. A probe that fails is recorded as FAILED with
      its error text — that is the answer to the toolchain question, not a
      defect to hide. A quantity you did not measure is recorded as NOT
      MEASURED and is never estimated (AGENTS.md rule 9).
    - >-
      MEASURE UNDER LOAD AND SAY SO. Record the host load average immediately
      before and immediately after each throughput measurement, in the receipt,
      beside the figure. State plainly that the figures are measurements of
      this machine in the state it was in, that a heavily oversubscribed
      machine yields a lower per-core rate than an idle one, and that the
      receipt therefore supplies a CONSERVATIVE floor for planning rather than
      a peak capability. Do NOT extrapolate to an idle machine and do NOT scale
      the figure by any load factor.
    - >-
      DERIVE THE CEILING ARITHMETICALLY AND SHOW THE ARITHMETIC. The per-task
      and per-campaign ceilings in AES evaluations follow from the measured
      per-core rate, the core count actually usable, and the declared budgets.
      Show each multiplication. State explicitly which core count you used and
      why, given the 4-versus-14 discrepancy, and state the ceiling under BOTH
      core counts if the discrepancy is not resolved by measurement.
    - >-
      SEED ALL RANDOMNESS DETERMINISTICALLY AND RECORD EVERY SEED. Record git
      commit and dirty-tree state, timestamps, and every check that did NOT run
      with its reason.
    - >-
      THIS IS INFRASTRUCTURE, NOT A RESULT. A measured throughput receipt is
      explicitly NOT a completion criterion (GOAL-AES-002
      non_completion_criteria (vi)): GOAL-AES-001 spent four batches learning
      to say so and the lesson is inherited, not relearned. The report says
      this in its own words. Nothing here is a cryptanalytic result, a
      distinguisher, a key recovery, a cost claim or a barrier statement, and
      nothing here asserts anything about AES at any round count.
    - >-
      NO CRYPTANALYSIS. Encrypting blocks to time an implementation is a
      BENCHMARK, not an attack, and the report must say which it is. Do not
      search any key space, do not attempt any recovery, and do not report any
      statistic about AES structure.
    - >-
      Create no ledger record, propose no hypothesis, promote nothing to
      knowledge, assign no evidence strength, change no official state, and
      write only under this task's own directory. DO NOT read, cite, copy from
      or rely on the pre-existing gates/, ideation/ or ideation2/ directories.
  deliverables:
    - stamps.json
    - envelope_probe.py
    - aesni_probe.c
    - envelope_receipt.json (THE COVERING MANIFEST)
    - envelope_report.md
  artifact_paths:
    - coordination/goals/GOAL-AES-002/batches/BATCH-001/tasks/TASK-20260809-8ab82c/stamps.json
    - coordination/goals/GOAL-AES-002/batches/BATCH-001/tasks/TASK-20260809-8ab82c/envelope_probe.py
    - coordination/goals/GOAL-AES-002/batches/BATCH-001/tasks/TASK-20260809-8ab82c/aesni_probe.c
    - coordination/goals/GOAL-AES-002/batches/BATCH-001/tasks/TASK-20260809-8ab82c/envelope_receipt.json
    - coordination/goals/GOAL-AES-002/batches/BATCH-001/tasks/TASK-20260809-8ab82c/envelope_report.md
  write_scope:
    - coordination/goals/GOAL-AES-002/batches/BATCH-001/tasks/TASK-20260809-8ab82c
  archived_by: TASK-20260809-877f6b
  inference:
    policy: executor-implementation
    requested_policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
    standing_basis: >-
      inference-amendment commit 0137a051eb5828789eb267fa83c8278086578d4c.
      Cross-model independence is unavailable campaign-wide; nothing produced
      here may be treated as a closure attestation.
  budget:
    wall_clock_seconds: 1600
    memory_gb: 4
    maximum_runs: 12
  budget_basis: >-
    The 1600 s producer line of GOAL-AES-002 campaign_budget.sizing_basis,
    borrowed from GOAL-AES-001's measured executor producer actuals (792 / 892
    / 1609 / 1510) sized at or near the observed maximum with NO cushion added.
    maximum_runs is 12 rather than the ideation card's 4 because this task's
    work is many short probes, each of which is one run.
  completion_gate:
    - >-
      stamps.json exists, was written as the task's FIRST act, and carries
      start_utc, start_epoch, declared_wall_clock_seconds, binding_stop_utc
      computed as start plus declared, a stamp at every major section boundary,
      and a truthful halted_on_budget with the dropped work named if it halted.
    - >-
      envelope_receipt.json records, for gcc: existence, resolved version, and
      whether a -maes program COMPILED and RAN, each as an executed command
      with exit status; and for numpy: whether it imports, as an executed
      command with exit status.
    - >-
      The receipt states which of the two committed records the measurement
      supports on the C toolchain, quoting both, and states plainly if the
      measurement supports neither cleanly.
    - >-
      Measured AES throughput in AES evaluations per second per core is
      recorded for every implementation actually available, with method, block
      count, repetition count, and the host load average immediately before and
      after each measurement recorded beside the figure.
    - >-
      Physical and logical core count and usable RAM are recorded AS MEASURED,
      the 4-versus-14 core and 15-versus-48 GB discrepancies with RQ-AES-002's
      declared envelope are named explicitly, and neither is resolved by
      assertion.
    - >-
      The per-task and per-campaign ceilings in AES evaluations are derived
      with the arithmetic shown, under the core count used, and under both core
      counts if the discrepancy remains unresolved.
    - >-
      Every failed probe is recorded as FAILED with its error text; every
      quantity not measured is recorded as NOT MEASURED; no figure is
      estimated, extrapolated or scaled by a load factor.
    - >-
      The report states that this receipt is INFRASTRUCTURE and NOT a
      completion criterion, performs no cryptanalysis, states no cost claim or
      margin, and asserts nothing about AES at any round count.
    - >-
      envelope_receipt.json is designated THE COVERING MANIFEST in its own text
      and carries an artifact_provenance entry for EVERY declared artifact with
      path, kind from the closed vocabulary, sha256,
      comment_block_inference_stanza and
      covered_by_this_manifest_inference_block, its own entry recorded as SELF;
      envelope_probe.py and aesni_probe.c each carry a comment-block inference
      stanza in their own text.
    - >-
      All seeds, exact commands, exit statuses, tool versions, git commit and
      dirty-tree state and timestamps are recorded; all writes are under this
      task's own directory; no pre-existing gates/, ideation/ or ideation2/
      content was read or relied on.
  return_format: >-
    The envelope receipt, a plain verdict on the C-toolchain contradiction
    quoting both committed records, the measured per-core
    AES-evaluations-per-second figures with the load readings beside them, the
    measured core count and RAM against the declared envelope, the derived
    per-task and per-campaign evaluation ceilings with the arithmetic, and an
    explicit list of what was NOT measured.
