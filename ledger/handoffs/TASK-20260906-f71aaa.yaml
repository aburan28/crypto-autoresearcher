handoff:
  id: TASK-20260906-f71aaa
  from: coordinator
  to: idea-generator
  objective: >-
    Generate four or five distinct, schema-complete, falsifiable, unapproved
    proposals for RQ-ECDLP-623a32 -- genuinely new representations of points
    on a prime-order prime-field elliptic curve, outside the Kummer-line and
    degree-d-function-on-E paradigm closed at model lever 1 -- each searched
    as a (representation, operation set) pair under the object frame of
    docs/object-frame-ideation.md and the enumeration KN-TECH-ee6696, each
    naming the attack stage whose charged cost it claims to change and the
    cheapest discriminating test against the mandatory null battery.
  uncertainty_reduced: >-
    Whether any R1, R2 or R3 representation class of RQ-ECDLP-623a32 admits a
    candidate whose lossy-projection audit passes against a named non-translation
    operation set, or which changes a decomposition degree, Newton polytope,
    monodromy group, membership-description degree, or linear-algebra structure
    by a stated amount against a null object of the same shape -- versus every
    such candidate being a reparametrisation the PGL_2 battery reproduces.
  inputs:
  - ledger/questions/RQ-ECDLP-623a32.yaml
  - knowledge/techniques/KN-TECH-ee6696.md
  - docs/object-frame-ideation.md
  - agents/idea-generator.md
  - docs/inventor-protocol.md
  - docs/target-result-profile.md
  - ledger/proposals/IDEA-20260807-8027a2.yaml
  - ledger/proposals/IDEA-20260807-e6d79e.yaml
  - ledger/proposals/IDEA-20260807-dadcd2.yaml
  - ledger/proposals/IDEA-20260808-2e14f7.yaml
  - ledger/proposals/IDEA-20260806-0c9de1.yaml
  - ledger/proposals/IDEA-20260808-fa1d80.yaml
  - ledger/proposals/IDEA-20260807-4fc635.yaml
  - ledger/proposals/IDEA-20260905-1dd2e5.yaml
  - ledger/proposals/IDEA-20260802-002.yaml
  - ledger/proposals/IDEA-20260806-c5d183.yaml
  - ledger/proposals/IDEA-20260901-863e36.yaml
  - knowledge/open-problems/KN-OPEN-003.md
  - knowledge/open-problems/KN-OPEN-005.md
  - knowledge/open-problems/KN-OPEN-020.md
  - knowledge/findings/KN-FIND-b7e091.md
  - knowledge/findings/KN-FIND-007.md
  - knowledge/techniques/KN-TECH-009.md
  - knowledge/techniques/KN-TECH-018.md
  - knowledge/techniques/KN-TECH-080.md
  - knowledge/literature/KN-LIT-004.md
  - knowledge/literature/KN-LIT-018.md
  - knowledge/literature/KN-LIT-201.md
  - knowledge/literature/KN-LIT-1131.md
  - knowledge/literature/KN-LIT-3937.md
  - knowledge/literature/KN-LIT-7490.md
  constraints:
  - >-
    Proposal registration only: four or five idea records, status proposed,
    approved_by null, novelty_status unverified unless checked against
    knowledge/ and ledger/hypotheses/ (corpus check) -- web checking is
    permitted and, if used, is recorded in citations with provenance
    retrieved and verified_by; no experiment, hypothesis, approval, or edit
    to any existing record.
  - >-
    Use exactly these identifiers, in order, one per proposal:
    IDEA-20260906-86cc17, IDEA-20260906-09b937, IDEA-20260906-aa6da3,
    IDEA-20260906-476f20, IDEA-20260906-f95c77. An unused identifier stays
    unused. Each record's top-level layout and field set copies
    ledger/proposals/IDEA-20260905-4dca34.yaml and the schema in
    agents/idea-generator.md (question_id RQ-ECDLP-623a32, goal_id
    GOAL-ECDLP-001, proposed_by idea-generator, added and proposed_at
    2026-09-06); no invented fields.
  - >-
    OBJECT FRAME. Every candidate is a PAIR (representation of the point,
    operation set Sigma the tracked object must survive). Name both
    explicitly in `mechanism`. Sigma must not be the full translation action,
    which is closed for lossy objects by IDEA-20260806-c5d183 and
    KN-FIND-ffe1df Theorem C; if Sigma contains the full translation action,
    the candidate is a branching object and must say so. Index calculus is
    Class I, partial-action (translation by factor-base elements only).
  - >-
    TRICHOTOMY. Place each candidate in exactly one class of
    IDEA-20260806-c5d183 -- partial-action, branching, or
    coordinate-dependent -- and give the one-line reason in `mechanism`.
    A candidate that cannot be placed is returned as `unverified` with the
    obstruction named, not silently dropped. Cross-check placement against
    the family table of KN-TECH-ee6696.
  - >-
    LOSSY-PROJECTION TEST, AGAINST THE NAMED OPERATION SET. Per
    docs/inventor-protocol.md section 2 and IDEA-20260901-863e36: state what
    the projection discards, show the discard is compatible with Sigma (a
    block system of <Sigma>, or a stated branching bound), and show it is
    lossy in the representation actually used. A projection that loses
    nothing is a change of coordinates and is not returned.
  - >-
    PRICE THE ONE OPEN NUMBER. For a quotient object, the cost of
    canonicalising a <Sigma>-orbit, charged end to end. For a branching
    object, the loss L and branching b of IDEA-20260802-002, with the
    minimal test stating how they are measured on a toy curve against the
    identity, random-label, and generic-group (relabelled Z/nZ) controls.
  - >-
    OFF-LIMITS AS PRIMARY LENS: families F1-F7 of IDEA-20260802-002 as
    tabulated in KN-TECH-ee6696, plus the lane-specific closures: every
    degree-2 coordinate is a Moebius reparametrisation of the Kummer line
    with model lever exactly 1 (IDEA-20260807-8027a2, IDEA-20260807-e6d79e,
    IDEA-20260807-dadcd2); degree-d maps E -> P^1 are already proposed
    (IDEA-20260808-2e14f7); the X_1(N) torsor representation
    (IDEA-20260806-0c9de1) and the (E x E)[N] split-quotient certificate
    (IDEA-20260808-fa1d80) are already proposed; isogeny-class arithmetic
    heterogeneity is already proposed (IDEA-20260905-1dd2e5). A candidate
    that uses one as a component names it and states what is added; a
    candidate that is one of these in new notation is not returned.
  - >-
    FACTOR-BASE ESCAPE. Any candidate factor base or relation mechanism must
    say which of the KN-OPEN-020 open classes it belongs to -- high-degree,
    implicit-membership, or target-dependent description -- and charge
    description, membership, relation, descent, time and memory costs, or
    declare itself inside the scoped-out class and stop. KN-FIND-007's
    geometry-invariant conservation mean bounds per-target decomposition
    yield for every factor base of a given size; a representation may change
    the solve cost or the membership cost, never that mean.
  - >-
    REPRESENTATION CLASS. Name the R1/R2/R3 class of RQ-ECDLP-623a32 the
    representation belongs to, and the attack stage (factor-base membership,
    relation decomposition, collision structure, linear algebra, descent)
    whose charged cost it claims to change, in `claim`. Name the non-generic
    operation the representation makes cheaper; a representation used only
    as a black-box encoding is inside the generic-group bound (KN-TECH-005,
    KN-FIND-b7e091) and is not returned.
  - >-
    MANDATORY CONTROLS in every minimal_test: the PGL_2(F_p)
    random-reparametrisation battery and the translation-conjugate null of
    IDEA-20260807-4fc635; a matched random curve at the same p; Pollard rho
    with distinguished points and BSGS as matched cost controls
    (automorphism-discounted rho on CM curves, KN-TECH-018). Toy instances
    only (p up to ~32 bits); claim_tier toy; every claimed solve or relation
    certificate-backed per docs/claims-and-verification.md.
  - >-
    PROOF SEARCH MAP before any compute (docs/inventor-protocol.md section 8):
    exact bottleneck, baseline embedding (the Weierstrass S_m system as the
    parameter slice), observation collision, quantifier order, method ceiling
    with a nearby-object control.
  - >-
    HONEST ACCOUNTING. `dominated_by` and `sota_delta` per section 5;
    `target_complexity` with exponents versus rho at p^{1/2}; `heuristic
    assumptions` each with a validation route; costs. The report ends with
    the section 5 block for the session as a whole, and a closure of any
    representation class meets the section 4 standard or is recorded as
    `unverified`.
  - >-
    Diversity: no two proposals in the same R-class with the same operation
    set; at least one R1, one R2 and one R3 candidate unless the honest
    accounting records why a class yielded nothing.
  - >-
    Lawful defensive cryptanalysis on public constructions and toy benchmarks
    only; no live keys, wallets, or deployed systems.
  deliverables: &id001
  - ledger/proposals/IDEA-20260906-86cc17.yaml
  - ledger/proposals/IDEA-20260906-09b937.yaml
  - ledger/proposals/IDEA-20260906-aa6da3.yaml
  - ledger/proposals/IDEA-20260906-476f20.yaml
  - ledger/proposals/IDEA-20260906-f95c77.yaml
  - research/ecdlp_representation_ideas_20260906.md
  artifact_paths: *id001
  archived_by: TASK-20260906-44503a
  inference:
    policy: research-deep
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 2400
    memory_gb: 4
    maximum_runs: 0
  completion_gate:
  - Four or five proposal YAMLs that parse under tools/validate_ledger.py,
    status proposed, unapproved, each carrying the object-frame declarations
    in the fields docs/object-frame-ideation.md section 4 assigns.
  - Every proposal names its (representation, operation set) pair, trichotomy
    class, R-class, attack stage, non-generic operation, and mandatory
    controls; every complexity claim carries heuristic_assumptions and
    target_complexity.
  - The report carries the corpus dedup against the seven cited lane
    proposals, the section 5 honest-accounting block, the single recommended
    first test, and a ranking rationale.
  return_format: >-
    Four or five YAML records and one Markdown report, plus a one-paragraph
    summary naming the recommended first test and why it is the cheapest
    valid discriminator.
  review_plan: null
