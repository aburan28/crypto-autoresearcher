    - experiments/EXP-ECDLP-fac9ea/runs/TASK-20260921-4888d4/registry.json
  constraints:
    - Specification v1 exactly; no row, prime, seed, or rule change after
      any cell outcome; additive changes via amendments only.
    - Canonical probability normalisation; exact additive Bluestein
      chirp-z over each prime; vhat(0) = 1 per ok cell.
    - Controls before any verdict read; first control failure voids the
      run with the defective control named.
    - The census R03 bridge is CITED (RUN-ECDLP-8e13c2 registry values on
      these primes), never re-measured or overwritten.
    - Memory above 8 GiB checkpoints the cell resource_exhaustion with a
      continuation pointer; machine protection only.
    - Write only inside the declared write_scope; do not commit (the
      coordinator runs the archives); Bedrock prohibited.
