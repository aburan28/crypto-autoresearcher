handoff:
  id: TASK-20260921-b61136
  from: coordinator
  to: executor
  objective: >-
    Execute the frozen digit-character profile EXP-ECDLP-b9ba72 v1 exactly
    per its specification: (lambda, PGL_2-stability) for the Thue-Morse and
    Rudin-Shapiro level sets on the census's primary ladder, the identity
    check, the control battery, the construction-closure comparison, and
    the checker spot re-derivations. Observations only.
  uncertainty_reduced: >-
    The first non-set row of the synthetic-statistic table and the
    R03-construction closure (DEC-20260921-8e8086's open item).
  inputs:
    - experiments/EXP-ECDLP-b9ba72/specification.yaml
    - ledger/hypotheses/H-ECDLP-caf3ff.yaml
    - ledger/proposals/IDEA-20260921-1ec106.yaml
