      decision record.
    - >-
      RECEIPTS. An archive receipt lands at its live path only if every path
      it binds lands or already exists on main byte-identical. Otherwise it
      goes to provenance only, and every record it archived is marked
      "archive not verifiable on main".
    - >-
      SEQUENTIAL UNITS (T-4) in the order U1, U4, U2, U3, U6, U7, U5, U9.
      Each unit branches from origin/main after the previous unit merged.
      Branch coordinator/transplant-34c6e8-<unit>. One PR per unit. Merge
      commits only, on a head whose CI checks all concluded success or
      skipped, with no conflict and no open blocking thread. Never re-run or
      skip a check. A stopped unit does not block later units unless they
      depend on it (U3 on its own 9b18fc part; U9 on its own eb9e5e part).
    - >-
      CLOSE SOURCE PRS (T-5) only after their unit merged and every A path is
      on main or in the provenance table. Each closure is a commented git
      operation citing the transplant PR and DEC-20261005-fe9f9f.
    - >-
      KNOWLEDGE PROMOTION (E6). Apply the templates/research-records.md rule
      to any landed decision that lacks the field. A required KN-FIND needs a
      dispatcher-minted id and is written per /curate-knowledge in the same
      unit. Otherwise give a concrete not_warranted reason. The evidence is
      not re-reviewed.
    - >-
      PROVES-TOO-MUCH (E7 = 040d37 S3). Never write a control as if
      pre-registered. In case (b), record the deviation and request a
      control-task id from the dispatcher; the control card is written in
      this session.
    - >-
