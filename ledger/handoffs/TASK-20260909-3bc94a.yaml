    source_snapshot: b65b8994463be8b9b04d82fce4b3a2bb01410bf2
    joints:
    - joint: dependency_image_byte_identity_and_operational_custody
      assigned_to: TASK-20260909-3bc94a
      attack_plan: Read the complete protocol,metadata,helper sources,binding and preparation receipts. Verify
        exact PyPI wheel SHA256/size/version constraints,offline pip commands,no unbound packages or TLS bypass,three
        unique container starts,cumulative retry authority,terminal states and exact cleanup. Verify outer
        and nested receipts separately;the first PermissionError is retained,not recast as a successful pair.
        Independently read-only inspect the exact local image ID and export it without starting a container.
        Validate config digest against the image ID,layer identities against config rootfs diff_ids and base-layer
        prefix,and the declared user,environment,OS/architecture and command configuration. Parse the archive
        as data only;handle whiteouts and overlay ordering,do not extract or execute files. Independently hash
        the two embedded wheel archives against frozen metadata and reconstruct the installed distribution
        files to compare all1667declared entries and aggregate hashes. Check missing,extra,symlink and transformed/generated-file
        cases explicitly;do not silently skip a file the producer inventoried. Where wheel members differ legitimately
        because pip generates metadata/scripts,identify the exact transformation and do not equate wheel and
        installed hashes blindly. Verify library import/version results as retained operational observations,not
        fresh code execution. Challenge fixed malformed image manifests,wrong config/layer/wheel/file hashes,incomplete
        cleanup,wrong UID/profile,missing attempts or guessed outer exits. State any unsupported archive format
        or unavailable local image as an operational limitation. Source definitions and actual group-OOM/launch/fixture
        gates remain separate.
      breaking_artifact: Exact mismatching image/layer/file digest or a retained-process/authority inconsistency,with
        evidence scope separated from science.
    blindness:
      mutual: false
      lifted_for:
      - TASK-20260909-3bc94a
      rationale: Fresh independent source-aware review. Prior inconclusive report/checker/receipt are explicitly
        visible only to preserve failure history and avoid repeating setup failure. No parent or producer conversation,
        concurrent supervisor review, or undisclosed reports. Independently verify image and archive semantics;
        earlier unexecuted checker is not evidence.
    proves_too_much:
      objects:
      - Correct image name/tag with a wrong immutable config digest.
      - A changed wheel or installed file with unchanged claimed metadata.
      - A valid-looking inventory that omits an expected file.
      - A failed first attempt or unremoved container omitted from the receipt.
      - A source annotation or nested exit presented as a measured outer outcome.
      failure_signature: A wrong byte identity,incomplete actual attempt set or unproved operational assertion
        must not be accepted.
      assigned_to: TASK-20260909-3bc94a
    blind_rederivation:
      required: false
      quantity: No mathematical quantity is proposed.
      parameters: Immutable image and file identity only.
      blind_from: []
      assigned_to: TASK-20260909-3bc94a
      not_repeated_reason: Operational byte/custody audit,not scientific or proof evidence.
    scope_limit: No container start,image-code execution,scientific computation,guard pressure test,source
