handoff:
  id: TASK-20260830-25b8c3
  from: coordinator
  to: executor
  objective: >-
    Execute the FROZEN, coordinator-approved contract EXP-MONO-4c7479
    exactly as written: Stage 0 (zero-compute symbolic identity check) then
    Stage 1 (exhaustive dual-arm classification of every (e1,e2) base point
    at p=101 and p=211, across the 6 committed (p,A,B) cells, plus the
    matched-ordered-base control, the excluded-strata accounting, the
    factor-base-sublocus control, and the random-quartic S_4 null control).
    Pure Python 3 stdlib only. Record observations only; render no verdict
    on H-MONO-0b3def.
  uncertainty_reduced: >-
    Whether, at toy scale (p in {101,211}), the m=3 symmetric-base Semaev
    cover's Frobenius action is consistent with exact D_4 (=Z/2 wr S_2)
    monodromy with an empty exceptional locus, per H-MONO-0b3def.
  inputs:
    - experiments/EXP-MONO-4c7479/specification.yaml
    - ledger/hypotheses/H-MONO-0b3def.yaml
    - ledger/proposals/IDEA-20260830-1a08f9.yaml
    - harness/semaev.py
    - knowledge/open-problems/KN-OPEN-009.md
    - docs/claims-and-verification.md
    - AGENTS.md
  constraints:
    - >-
      Follow experiments/EXP-MONO-4c7479/specification.yaml EXACTLY; it is
      frozen. Do not implement Stage 2, Stage 3, or the CM/j=0/j=1728/full-
      2-torsion curve-panel legs -- all are explicitly out of scope
      (`future_work`).
    - >-
      Pure Python 3 standard library ONLY. No sympy, sage, numpy, g6k, or
      fpylll. Any import of a forbidden module invalidates the run.
    - >-
      Arms (a) and (b) MUST be genuinely independent code paths sharing no
      intermediate value (`arms_and_controls.independence_requirement`).
      Arm (b) must use a general quartic-factoring routine (distinct-degree
      method), never the biquadratic Z=Y^2 shortcut that would silently
      collapse it onto arm (a).
    - >-
      Excluded strata (i), (ii), (iii) are counted separately and never
      pooled into P1/P2/P3 (`excluded_strata_i_ii_iii`).
    - >-
      Stage 0 gates Stage 1: if any symbolic identity fails, stop and report
      the failure; spend no further compute.
    - >-
      A cell's random-quartic control failing to reproduce S_4 Chebotarev
      densities (especially failing to emit type 3+1) invalidates
      interpretation of that cell's Semaev-arm results; report as instrument
      failure, not as a Semaev-arm finding.
    - >-
      Retain the full per-base-point classification log (not a summary) per
      `required_artifacts` -- P1 and P3 are per-instance metrics a reviewer
      must be able to re-check.
    - >-
      No hypothesis, experiment, or goal status change. No relation-rate,
      ECDLP, cost, or exponent claim of any kind, in either direction
      (AGENTS.md rule 4 / `claim_ceiling`).
    - >-
      Any timeout, crash, or construction failure is `failed_infrastructure`,
      never negative mathematical evidence (AGENTS.md rule 3).
    - Exactly 2 runs (seeds 20260830, 20260831); deterministic except for the random-quartic control.
  deliverables:
    - experiments/EXP-MONO-4c7479/implementation.md
    - experiments/EXP-MONO-4c7479/implementation/ (source code)
    - experiments/EXP-MONO-4c7479/runs/RUN-MONO-4c7479-20260830/
    - experiments/EXP-MONO-4c7479/runs/RUN-MONO-4c7479-20260831/
    - execution_report.yaml (per docs/evidence-and-reproducibility.md)
  artifact_paths:
    - experiments/EXP-MONO-4c7479/implementation.md
    - experiments/EXP-MONO-4c7479/implementation/
    - experiments/EXP-MONO-4c7479/runs/RUN-MONO-4c7479-20260830/
    - experiments/EXP-MONO-4c7479/runs/RUN-MONO-4c7479-20260831/
  archived_by: TASK-20260830-8c214e
  inference:
    policy: executor-implementation
    reasoning_effort: medium
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
    reasoning_effort_basis: >-
      Bound by .claude/agents/executor.md effort medium and
      orchestration/roles.yaml role executor -> default_policy
      executor-implementation -> reasoning_effort medium. Bounded,
      spec-following implementation of an already-fully-designed contract
      (all arithmetic, controls, and metrics specified exactly); not design
      or ideation. Matches CLAUDE.md's model-policy table.
  budget:
    wall_clock_seconds: 1200
    memory_gb: 1
    maximum_runs: 2
  completion_gate:
    - Stage 0 identity check run and its result (pass/fail) reported before any Stage 1 compute.
    - >-
      All 6 committed (p,A,B) cells processed if Stage 0 passes: P1, P2, P3
      reported per cell, with excluded-strata counts (i)/(ii)/(iii) reported
      separately per cell.
    - >-
      Matched-ordered-base control, factor-base-sublocus control, and
      random-quartic null control (2,000 draws per p per run) all executed
      and reported per `arms_and_controls`.
    - >-
      Per-base-point classification log retained in full for both runs, per
      `required_artifacts`.
    - >-
      Run manifests bind git commit, dirty flag, seeds, environment
      (confirming stdlib-only), timing, resources, per
      docs/evidence-and-reproducibility.md.
  return_format: >-
    Executor execution_report.yaml per docs/evidence-and-reproducibility.md:
    Stage 0 result; per-cell P1/P2/P3 and class-density counts; control
    outcomes; excluded-strata counts; any deviations or anomalies. Observations
    only -- no verdict on H-MONO-0b3def, no status change.
