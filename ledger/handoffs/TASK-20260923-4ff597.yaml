# =============================================================================
# TASK-20260923-4ff597 -- Coordinator SNAPSHOT ARCHIVE of stage 1b
# (TASK-20260923-4c64b5) and stage 2b (TASK-20260923-6c7f55) of
# EXP-GFPN-05ff43 protocol v2-a1. Two phases are declared up front:
#   PHASE A (after stage 1b, BEFORE stage 2 of TASK-20260923-cd932c and before
#     any addendum run). It binds by SHA-256 every file of
#     implementation-v2-a1/, implementation-v2-a1.md and trial-plan-v2-a1.json,
#     and records snapshot-receipt.json.
#   PHASE B (after stage 2b, before any review plan or reviewer). It binds by
#     SHA-256 every addendum run package and execution-report-v2-a1.yaml, and
#     records post-run-receipt.json.
# Reserved by DEC-20260923-034ba0 R-9. Written by the Coordinator under
# TASK-20260923-33484e (DEC-20260923-8b2dbf). Follows TASK-20260923-0fa03f
# and TASK-20260923-3b12c2 (one archival task, two receipted commits). An
# archive is not approval and not evidence. This card edits nothing and
# launches nothing.
# =============================================================================
handoff:
  id: TASK-20260923-4ff597
  from: coordinator
  to: coordinator
  archive_kind: snapshot
  kind: snapshot_archive
  recorded_at: '2026-09-23'
  source_task_ids:
    - TASK-20260923-4c64b5
    - TASK-20260923-6c7f55
  source_task_ids_note: >-
    Phase A archives TASK-20260923-4c64b5 (stage 1b). Phase B archives
    TASK-20260923-6c7f55 (stage 2b).
  goal_id: GOAL-GFPN-380702
  question_id: RQ-GFPN-c01af8
  batch_id: BATCH-6b1c29
  experiment_ids: [EXP-GFPN-05ff43]
  hypothesis_ids: [H-GFPN-9a29be]
  record_ids:
    - EXP-GFPN-05ff43
    - AMD-EXP-GFPN-05ff43-20260923-rung31
    - TASK-20260923-4c64b5
    - TASK-20260923-6c7f55
    - TASK-20260923-4ff597
  record_ids_note: >-
    Phase B adds every RUN-GFPN-* id it stages. Each is an id reserved in
    trial-plan-v2-a1.json.

  archival_binding: >-
    THIS CARD IS THE ONE ARCHIVAL TASK that TASK-20260923-4c64b5 and
    TASK-20260923-6c7f55 name in archived_by. It owns every deliverable of
    both, from before either writes anything. Phase B is declared here in
    advance as the step that archives the addendum run packages.

  objective: >-
    PHASE A: make stage 1b's implementation and plan durable and hash-bound
    BEFORE stage 2 of TASK-20260923-cd932c and before any addendum run
    (DEC-20260923-8b2dbf SQ-4; DEC-20260923-034ba0 R-5 (4)). It stages the
    stage-1b paths file by file, records per-path SHA-256 in a snapshot
    receipt with the parent, the origin/main base commit and the merge
    outcome, and commits them. Every addendum manifest then records this
    commit and a clean tree for these paths.
    PHASE B: after stage 2b returns, it commits every addendum run package
    that exists under the ids reserved in trial-plan-v2-a1.json, and
    execution-report-v2-a1.yaml, exactly as returned. It records a post-run
    receipt, so that the review plan and independent review read committed,
    hash-bound bytes.

  uncertainty_reduced: >-
    PHASE A: whether the addendum code and plan that stage 2b runs are exactly
    the bytes stage 1b produced, fixed before any v2 measurement exists.
    PHASE B: whether the addendum run packages that reviewers read are the
    bytes the executor wrote, with nothing outside the write scope touched.

  inputs:
    - ledger/handoffs/TASK-20260923-4c64b5.yaml
    - ledger/handoffs/TASK-20260923-6c7f55.yaml
    - ledger/decisions/DEC-20260923-8b2dbf.yaml
    - experiments/EXP-GFPN-05ff43/amendments/v2_addendum_rung31.yaml (hash check only)
    - coordination/goals/GOAL-GFPN-380702/archives/TASK-20260923-0fa03f/snapshot-receipt.json
    - experiments/EXP-GFPN-05ff43/implementation-v2-a1/ (phase A)
    - experiments/EXP-GFPN-05ff43/implementation-v2-a1.md (phase A)
    - experiments/EXP-GFPN-05ff43/trial-plan-v2-a1.json (phase A; phase B reads it for the reserved ids)
    - experiments/EXP-GFPN-05ff43/runs/<each RUN-GFPN-* id reserved in trial-plan-v2-a1.json>/ (phase B)
    - experiments/EXP-GFPN-05ff43/execution-report-v2-a1.yaml (phase B)
    - coordination/goals/GOAL-GFPN-380702/batches/BATCH-6b1c29/dispatch_queue.json
    - origin/main

  constraints:
    - id: SA-1
      text: >-
        STAGE ONLY THE DECLARED PATHS, per phase, path by path. `git add -A` is
        forbidden. A dirty or untracked path outside the declared set is not
        staged. If it lies inside implementation-v2-a1/ (for example
        __pycache__/), it is NAMED in the receipt as a scope finding.
    - id: SA-2
      text: >-
        EDIT NO RECORD WHILE ARCHIVING. That covers implementation-v2-a1/,
        implementation-v2-a1.md, trial-plan-v2-a1.json, run packages, the
        execution reports, implementation-v2/, the specification, both
        amendments, cards, decisions, corrections, the goal record and
        tools/. A defect found now becomes a new record, never a repair.
    - id: SA-3
      text: >-
        MERGE origin/main INTO THE BRANCH, NEVER REBASE, before each phase's
        commit. Record the base commit checked and the merge outcome in that
        phase's receipt. A conflict inside a record is resolved by a
        superseding record under a new id, never by picking a side.
    - id: SA-4
      text: >-
        AN ARCHIVE IS NOT EVIDENCE AND NOT APPROVAL. H-GFPN-9a29be stays
        inconclusive and HEUR-GFPN-DFLAT stays untested. Phase B composes,
        scores and interprets nothing.
    - id: SA-5
      text: LAUNCH NOTHING. maximum_runs 0 for both phases.
    - id: SA-6
      text: >-
        PHASE ORDER (DEC-20260923-8b2dbf AA-2).
        - Phase A runs after TASK-20260923-4c64b5 returns with outcome
          completed and releases its claim. It completes, is verified and
          is pushed BEFORE stage 2 of TASK-20260923-cd932c.
        - Phase B runs only after TASK-20260923-6c7f55 returns (any outcome,
          including a failed controls_a1 gate or a wall-clock checkpoint)
          and releases its claim. It runs before any review plan or reviewer.
        - Each phase runs ALONE: no producer, solver or other archive runs
          while it runs.
        - Each phase is claimed as coordinator on the BATCH-6b1c29 queue
          where the queue state admits it. Otherwise it runs under the card
          and records that in its receipt; the queue keeps this archive
          `queued` until phase B.
    - id: SA-7
      text: >-
        After each commit, push the branch and refresh the open PR against
        main (PR #1383 on claude/pollard-rho-speedup-hypotheses-yu8qwp, or its
        successor), naming the records. Amazon Bedrock is prohibited. Write no
        model name into a receipt beyond the inference block's resolved
        binding, which the dispatching session records.

  phase_a:
    runs: >-
      After TASK-20260923-4c64b5 returns completed. Before stage 2 of
      TASK-20260923-cd932c and before any addendum run.
    depends_on:
      - TASK-20260923-4c64b5
      - TASK-20260923-58a958
    bound_paths:
      - experiments/EXP-GFPN-05ff43/implementation-v2-a1/<every file that `git ls-files` lists after staging, excluding byte-code>
      - experiments/EXP-GFPN-05ff43/implementation-v2-a1.md
      - experiments/EXP-GFPN-05ff43/trial-plan-v2-a1.json
    bound_paths_note: >-
      implementation-v2-a1/ is expanded file by file in the receipt, and the
      receipt's list must equal the file list implementation-v2-a1.md
      declares. If they differ, the receipt records the difference as a scope
      finding and the archive STOPS for a Coordinator decision. It never binds
      a narrowed or widened set silently. These paths may be committed in a
      filing commit before the receipt commit, or in the same commit. The
      receipt names which, as TASK-20260923-0fa03f's did.
    verification_steps: >-
      (1) The addendum hashes to
          2c5e052468e37111023dd116706149fb05d691e7188e26ae1e2c069bad792d0c
          and the v2 amendment to
          e02d4976a5e773b9eee95aa4c376d6154e9c0a9da4e6c6118ed58748054924d3.
      (2) The 14 paths bound by TASK-20260923-0fa03f phase A still hash to
          that receipt's values, and git status is clean for them.
      (3) No directory experiments/EXP-GFPN-05ff43/runs/<id>/ exists for any
          id reserved in trial-plan-v2-a1.json OR in trial-plan-v2.json. This
          is the "no run package yet" sequencing check (SQ-4, SQ-5).
      (4) trial-plan-v2-a1.json:
          - it reserves 11 ids (31-bit plan) or 7 (FB-1 plan), none a v1 or
            v2 id (the v2 set is read from trial-plan-v2.json, the v1 set from
            its v1_ids_never_reused);
          - its watchdog values equal trial-plan-v2.json lines 95-177;
          - it records protocol_version "2-a1", the addendum id and sha256,
            and TASK-20260923-6c7f55.
      (5) If trial-plan-v2-a1.json is the FB-1 plan,
          implementation-v2-a1.md carries the DEC-20260923-8b2dbf AA-3
          trigger evidence (the 16777291 pass, and both 1073741831 failures
          with command, exit status, signal and stderr tail), and
          implementation-v2-a1/ladder-a1.json exists. If either is missing,
          STOP.
      (6) No byte outside the three stage-1b paths was written by stage 1b.
          `git status --porcelain -- experiments/EXP-GFPN-05ff43` shows
          changes only inside them. Untracked byte-code is listed, never
          staged.
      (7) No stage-1b artifact carries the string TASK-20260923-cd932c as its
          own task id (DEC-20260923-8b2dbf AA-5 (a)). Found by search and
          recorded. A hit is a scope finding for the Coordinator, never a
          repair.
      A failure of (1), (2), (3), (4) or (5) STOPS the archive. The failure is
      reported, and nothing is committed.
    receipt: coordination/goals/GOAL-GFPN-380702/archives/TASK-20260923-4ff597/snapshot-receipt.json
    receipt_contents: >-
      The receipt records:
      - kind snapshot, phase A, source_task_ids [TASK-20260923-4c64b5];
      - the plan branch (31-bit or FB-1);
      - the filing commit, if any, and parent_sha;
      - path_sha256 for every bound file;
      - both amendment hashes as checked;
      - the outcomes of verification steps (1)-(7);
      - the origin/main base commit and the merge outcome;
      - record_ids, the validator outcome and scope findings.
      The receipt never carries its own commit's sha. The verifier binds that
      after the commit.
    after_phase_a: >-
      Once the post-commit verifier accepts phase A and it is pushed, the
      dispatching Coordinator session appends a tasks_state_revisions entry to
      the BATCH-6b1c29 queue, citing this receipt. That revision:
      - records the phase-A commit in this archive's `archive.phases` note;
      - appends the bound implementation-v2-a1/ files to
        TASK-20260923-4c64b5's artifact_paths;
      - sets TASK-20260923-cd932c from `blocked` to `queued`.
      research_dispatch.py must pass on the revised queue before it is
      committed. It edits no card. Stage 2 of TASK-20260923-cd932c may launch
      only after that revision (SQ-5).
    commit_message_must_name: [TASK-20260923-4ff597, TASK-20260923-4c64b5, EXP-GFPN-05ff43, AMD-EXP-GFPN-05ff43-20260923-rung31, DEC-20260923-8b2dbf]
    completion_gate:
      - verification steps (1)-(5) pass, and any finding from (6) or (7) is recorded
      - the phase-A commit changes exactly the bound paths and the receipt (or a documented superset listed in the receipt)
      - the receipt's path_sha256 covers every bound path and matches the committed tree
      - the receipt records the parent, the origin/main base commit and the merge outcome
      - tools/validate_ledger.py on the head reports no error line beyond the base's pre-existing set
      - the branch is pushed and the PR refreshed, naming TASK-20260923-4ff597 and TASK-20260923-4c64b5
      - no v2 or addendum run package exists, and nothing was launched

  phase_b:
    runs: >-
      Only after TASK-20260923-6c7f55 has returned, with any outcome. Before
      any review plan, reviewer or composition.
    depends_on:
      - TASK-20260923-6c7f55
    staged_scopes:
      - experiments/EXP-GFPN-05ff43/runs/<each RUN-GFPN-* id reserved in trial-plan-v2-a1.json that has a directory>/
      - experiments/EXP-GFPN-05ff43/execution-report-v2-a1.yaml
    staged_scopes_note: >-
      The reserved ids are read from the phase-A-bound bytes of
      trial-plan-v2-a1.json. Each run directory is expanded file by file in
      the receipt. The receipt lists:
      - every reserved id with no directory, with the execution report's
        stated reason, as an unused contingency id or a not-created package;
      - any file under runs/ whose id is reserved in neither
        trial-plan-v2-a1.json nor trial-plan-v2.json, as a scope finding,
        NOT staged.
      __pycache__ byte-code is excluded as a build product. Any msolve input
      or output retained in a package under R-10 is staged with it.
    pre_commit_checks: >-
      (1) The phase-A paths still hash to the phase-A receipt values.
      (2) The v2 run packages still hash to TASK-20260923-0fa03f's post-run
          receipt values.
      (3) The addendum completion-gate checker in implementation-v2-a1/
          (A1-7 (4)) runs on each staged package, and its output is recorded
          verbatim. It is recorded, not acted on: a failing package is still
          staged exactly as returned.
      (4) No path outside the staged scopes and the receipt is in the commit.
    receipt: coordination/goals/GOAL-GFPN-380702/archives/TASK-20260923-4ff597/post-run-receipt.json
    receipt_contents: >-
      The receipt records:
      - kind snapshot, phase B, source_task_ids [TASK-20260923-6c7f55];
      - parent_sha;
      - path_sha256 for every staged file;
      - the pre_commit_checks outputs;
      - the reserved-id accounting;
      - the origin/main base commit and the merge outcome;
      - record_ids (every staged RUN-GFPN-* id);
      - the validator outcome and scope findings.
    after_phase_b: >-
      Once verified and pushed, a queue revision:
      - appends the staged run-package files to TASK-20260923-6c7f55's
        artifact_paths;
      - sets commit_sha, parent_sha and full path_sha256 on this archive;
      - marks it completed.
      research_dispatch.py passes on it with the repository verifier
      (binding_mode content_first).
    commit_message_must_name: [TASK-20260923-4ff597, TASK-20260923-6c7f55, EXP-GFPN-05ff43, AMD-EXP-GFPN-05ff43-20260923-rung31, TASK-20260923-4c64b5, every staged RUN-GFPN-* id]
    commit_message_note: >-
      Under content_first binding, the queue verifier checks that the
      commit_sha it records (the phase-B commit) names this task and every
      record_id. Phase B's message therefore names all of them.
    completion_gate:
      - stage 2b has returned, and every run directory under a reserved id and execution-report-v2-a1.yaml are staged exactly as returned
      - the phase-B commit changes nothing outside the staged scopes and the post-run receipt
      - the post-run receipt's path_sha256 covers every staged file and matches the committed tree, and records its own parent, origin/main base commit and merge outcome
      - the checker outputs and the reserved-id accounting are recorded verbatim
      - the branch is pushed and the PR refreshed, naming the staged RUN-GFPN-* ids
      - nothing was composed or scored, and no reviewer was launched before this gate was met

  verifier_standard: >-
    The dispatching session performs both commits and writes both receipts.
    After each commit, the post-commit verifier re-checks every path_sha256 in
    the receipt against the ARCHIVE COMMIT'S TREE, reading `git show <archive
    commit>:<path>`, not the working tree. It also checks that:
    - the commit changes exactly the declared paths plus the receipt, or a
      superset the receipt lists;
    - the commit names this task and the listed records;
    - the parent recorded in the receipt is the commit's parent.
    Content binds first (CLAUDE.md "Archive receipts bind to CONTENT first").
    A content mismatch is fatal. A phase is official only when the verifier
    accepts it.

  deliverables:
    - 'phase A: one commit naming TASK-20260923-4ff597, TASK-20260923-4c64b5, EXP-GFPN-05ff43, AMD-EXP-GFPN-05ff43-20260923-rung31 and DEC-20260923-8b2dbf'
    - coordination/goals/GOAL-GFPN-380702/archives/TASK-20260923-4ff597/snapshot-receipt.json
    - 'phase B: one commit naming TASK-20260923-4ff597, TASK-20260923-6c7f55, TASK-20260923-4c64b5, EXP-GFPN-05ff43, AMD-EXP-GFPN-05ff43-20260923-rung31 and every staged RUN-GFPN-* id'
    - coordination/goals/GOAL-GFPN-380702/archives/TASK-20260923-4ff597/post-run-receipt.json

  artifact_paths:
    - experiments/EXP-GFPN-05ff43/implementation-v2-a1/
    - experiments/EXP-GFPN-05ff43/implementation-v2-a1.md
    - experiments/EXP-GFPN-05ff43/trial-plan-v2-a1.json
    - coordination/goals/GOAL-GFPN-380702/archives/TASK-20260923-4ff597/snapshot-receipt.json
    - experiments/EXP-GFPN-05ff43/runs/<each RUN-GFPN-* id reserved in trial-plan-v2-a1.json that has a directory>/
    - experiments/EXP-GFPN-05ff43/execution-report-v2-a1.yaml
    - coordination/goals/GOAL-GFPN-380702/archives/TASK-20260923-4ff597/post-run-receipt.json
  artifact_paths_note: >-
    The union of both phases. The first four are phase A and the last three
    are phase B. Directories are expanded file by file in each receipt. This
    card itself (ledger/handoffs/TASK-20260923-4ff597.yaml) is archived by
    TASK-20260923-58a958, the ledger archive of the act that wrote it.
  write_scope:
    - coordination/goals/GOAL-GFPN-380702/archives/TASK-20260923-4ff597
  write_scope_note: >-
    The stage-1b and stage-2b paths belong to the write scopes of
    TASK-20260923-4c64b5 and TASK-20260923-6c7f55. This task STAGES them and
    writes only its receipt directory.

  archived_by: TASK-20260923-4ff597
  archived_by_note: >-
    Self-bound for its receipts: each receipt rides its own phase's commit.
    The card file is archived by TASK-20260923-58a958.
  depends_on:
    - TASK-20260923-4c64b5
    - TASK-20260923-6c7f55
    - TASK-20260923-58a958
  depends_on_note: >-
    Phase A depends on TASK-20260923-4c64b5 and TASK-20260923-58a958. Phase B
    depends on TASK-20260923-6c7f55.

  dispatch_preconditions:
    - >-
      archived_by is bound (SELF for the receipts). This card is committed by
      TASK-20260923-58a958, and the post-commit verifier accepted that commit
      before phase A runs.
    - 'PHASE A: TASK-20260923-4c64b5 has returned with outcome completed and released its claim; no v2 or addendum run package exists.'
    - 'PHASE B: TASK-20260923-6c7f55 has returned and released its claim.'
    - Each phase RUNS ALONE, with no producer, solver or other archive running.
    - origin/main is fetched and merged (never rebased) before each phase's commit, and the base commit is recorded.

  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    resolved_model_id: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false

  budget:
    wall_clock_seconds: 3600
    memory_gb: 2
    maximum_runs: 0
  budget_note: >-
    Per phase. The figures are advisory (docs/research-budget-policy.md),
    except maximum_runs 0, which is binding: an archive launches nothing.

  completion_gate:
    - phase A's completion_gate is met after stage 1b and before stage 2 of TASK-20260923-cd932c and any addendum run
    - phase B's completion_gate is met after stage 2b returns and before any review plan or reviewer
    - each phase's receipt is accepted by the post-commit verifier against its archive commit's tree
    - no scientific trial was launched by either phase, and no record was edited

  return_format: >-
    For each phase:
    - the receipt path, the archive commit sha, the parent, the base commit
      and the merge outcome;
    - the verification or pre-commit check outcomes;
    - any scope finding.
    Phase A also gives the plan branch and both amendment hashes as checked.
    Phase B also gives the reserved-id accounting.

  handoff_record: ledger/handoffs/TASK-20260923-4ff597.yaml
  state: written_not_executed
