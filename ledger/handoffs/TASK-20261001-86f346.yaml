handoff:
  id: TASK-20261001-86f346
  from: coordinator
  to: idea-generator
  objective: >-
    Generate exactly four mechanism-distinct, schema-complete, falsifiable
    proposals for RQ-PFDR-ae2fba on representations and factor-base definitions
    for prime-field ECDLP (E/F_p, no Weil descent) Semaev point-decomposition
    systems that aim simultaneously at LOW-DEGREE (first-fall/solving degree
    bounded or growing strictly slower than the support-matched semi-regular
    null) and USEFUL decomposition yield, each stating whether its
    degree-versus-yield tradeoff is exponent-moving or constant-moving against
    Pollard rho. Each proposal must identify a mechanism or representation not
    covered by the nearest PFDR/index-calculus record and must remain an
    ideation-only candidate with status proposed.
  uncertainty_reduced: >-
    Whether any unfiled prime-field representation or factor-base mechanism
    survives the frontier-map, dedup-list, and object-frame screens and merits
    later Coordinator ranking under RQ-PFDR-ae2fba.
  inputs:
    - AGENTS.md
    - agents/idea-generator.md
    - docs/inventor-protocol.md
    - docs/target-result-profile.md
    - docs/object-frame-ideation.md
    - templates/research-records.md
    - ledger/questions/RQ-PFDR-ae2fba.yaml
    - knowledge/frontiers/ecdlp
    - ledger/proposals
    - ledger/hypotheses
    - knowledge
    - coordination/tasks/TASK-20261001-86f346/context
  constraints:
    - >-
      Write exactly the four assigned proposal files and do not modify existing
      records. Use IDs IDEA-20261001-c41c07, IDEA-20261001-f484bd,
      IDEA-20261001-6a8720, and IDEA-20261001-2d18c7 exactly.
    - Bind every record to RQ-PFDR-ae2fba with status proposed.
    - >-
      OBJECT FRAME (docs/object-frame-ideation.md section 3, binding): every
      candidate is a pair (representation of the point, operation set Sigma the
      tracked object must survive), both named explicitly in `mechanism`. Sigma
      must not be the full translation action, closed for lossy objects by
      IDEA-20260806-c5d183 and KN-FIND-ffe1df Theorem C; index calculus is
      Class I partial-action (translation by factor-base elements only). Place
      each candidate in exactly one trichotomy class (partial-action,
      branching, coordinate-dependent) with a one-line reason in `mechanism`.
      Apply the lossy-projection test against the named Sigma: state what the
      projection discards, show the discard is Sigma-compatible, and show it is
      lossy in the representation actually used. Price the one open number end
      to end: orbit-canonicalisation cost for a quotient object, or loss L and
      branching b for a branching object measured on a toy curve against the
      identity, random-label, and generic-group (relabelled Z/nZ) controls.
    - >-
      OFF-LIMITS AS PRIMARY LENS: families F1-F7 of IDEA-20260802-002 (walk
      collision/rho/kangaroo/VW/BSGS; factor-base decomposition as such;
      isogeny path; pairing transfer; p-adic lift; endomorphism/automorphism
      orbit; preprocessing table), plus the lane closures: the bounded-degree
      target-independent algebraic factor base of KN-OPEN-020/IDEA-20260801-021
      and Kummer-line / degree-d-function-on-E representations
      (RQ-ECDLP-623a32 model lever 1). A candidate using an off-limits family
      as a component names it and states what is added.
    - >-
      FACTOR-BASE ESCAPE: any candidate factor base or relation mechanism must
      say which KN-OPEN-020 open class it belongs to (high-degree,
      implicit-membership, or target-dependent description) and charge
      description, membership, relation, descent, time, and memory costs, or
      declare itself inside the scoped-out class and stop.
    - >-
      REPRESENTATION CLASS: name the R1/R2/R3 class of RQ-ECDLP-623a32 the
      representation belongs to and the attack stage (factor-base membership,
      relation decomposition, collision structure, linear algebra) whose
      charged cost it claims to change.
    - >-
      Screen the rendered frontier maps and the dedup list in
      coordination/tasks/TASK-20261001-86f346/context/, plus ledger/proposals,
      ledger/hypotheses, and knowledge/; name the nearest record or KR row and
      the exact object, observable, quantifier, or algorithmic delta for every
      idea. An idea whose claim or mechanism matches a KR row's claim or
      forecloses phrases is novelty_status known or adaptation and cites the
      row. Absence of a row is not evidence of novelty.
    - >-
      Every record carries the complete idea-generator schema including
      proof_search_map (an audit that does not apply records why; it is not
      silently omitted), heuristic_assumptions each with a validation route,
      target_complexity with time and memory exponents against the rho baseline
      p^{1/2} (log p)^{O(1)} stating exponent-moving versus constant-moving and,
      if constant-moving, whether it is a required building block of an
      exponent-moving idea, dominated_by (null only after checking every
      frontier row across time, memory, and data/queries, saying what was
      checked), quantitative sota_delta, the mandatory null controls
      (support-matched semi-regular null, matched random base, permutation
      null, matched rho on the same toy curves), falsification conditions,
      confounders, interpretation limits, and full cost boundaries.
    - >-
      prior_art block REQUIRED (IDEA-20261001-* cutover,
      templates/research-records.md "Prior art on ideas"): frontier_map
      knowledge/frontiers/ecdlp; rows_checked listing the KR-* rows actually
      positioned against; nearest with at least one entry carrying
      ref/provenance/relation/delta, or none_found_after with the queries run.
    - >-
      Every citation carries provenance (recalled | retrieved | kb | internal).
      This session has no retrieval tools beyond the repository; anything known
      from memory is `recalled`, keeps novelty_status at `unverified`, and may
      not support novelty_status known or adaptation. Do not present a
      recollection as a checked source.
    - >-
      Toy-scale discipline binds: log2 p in 12..40 for solve cells;
      sampling/correspondence cells may scale system shapes to 64..256-bit
      proxies with no curve constructed. No crypto-scale claim. Each idea
      discriminates between at least two possible explanations; "try this and
      see" is incomplete.
    - >-
      No experiment execution, implementation, hypothesis creation, approval,
      status transition, knowledge promotion, deployed-target interaction,
      live-key recovery, or breakthrough claim. Do not resume or amend any
      GOAL or BATCH; this is a standalone ideation wave.
    - No Amazon Bedrock, fallback, or degradation. A timeout or crash is failed_infrastructure, never evidence.
  deliverables:
    - ledger/proposals/IDEA-20261001-c41c07.yaml
    - ledger/proposals/IDEA-20261001-f484bd.yaml
    - ledger/proposals/IDEA-20261001-6a8720.yaml
    - ledger/proposals/IDEA-20261001-2d18c7.yaml
  artifact_paths:
    - ledger/proposals/IDEA-20261001-c41c07.yaml
    - ledger/proposals/IDEA-20261001-f484bd.yaml
    - ledger/proposals/IDEA-20261001-6a8720.yaml
    - ledger/proposals/IDEA-20261001-2d18c7.yaml
  archived_by: TASK-20261001-cf1045
  inference:
