      This card, the archival card TASK-20261001-cf1045, and every context file
      under coordination/tasks/TASK-20261001-86f346/context/ are committed and
      pushed on ideas/pfdr-ic-20261001 before launch.
    - >-
      archived_by is bound to TASK-20261001-cf1045 before dispatch (satisfied
      by this card's own text; the archival card is committed in the same
      commit as this one).
    - >-
      No GOAL-* lane claim is required: this wave binds no goal, and its write
      scope (new ids under ledger/proposals/, its own task directory) is
      disjoint from every open lane checked on the bus inbox on 2026-10-01
      (coordinator-pfdr-1rfntm works experiments/EXP-PFDR-*; the TW-FLOOR
      review round works review directories).
    - >-
      The resolved backend serves research-deep without Bedrock; the resolved
      model identifier is recorded in the run receipt and carries
      model_verified false until a probe confirms it.
  completion_gate:
    - >-
      Exactly four YAML proposal records strict-parse, use the assigned IDs,
      bind RQ-PFDR-ae2fba, and remain status proposed.
    - >-
      Every record satisfies the idea-generator schema including prior_art with
      rows_checked and at least one nearest entry (or none_found_after with the
      queries), heuristic_assumptions with validation routes,
      target_complexity exponents against rho, dominated_by stating what was
      checked, and a quantitative sota_delta.
    - >-
      The four mechanisms are pairwise distinct and distinct from every entry
      of the dedup list; each names its nearest record and exact delta, and
      each carries its object-frame pair and trichotomy class.
    - >-
      Each idea discriminates at least two possible explanations and carries
      falsification conditions and the mandatory null controls.
    - >-
      No experiment, implementation, approval, status transition, knowledge
      promotion, or scientific result is claimed.
  review_plan: null
