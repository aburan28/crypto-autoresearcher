handoff:
  id: TASK-20260802-104
  from: coordinator
  to: red-team
  objective: 'Attack the interpretation of the TASK-20260802-101 adjudication, not its arithmetic. Specifically:
    (a) if a finding is adjudicated confirmed_in_current_source, argue the strongest case that it is nonetheless
    known, immaterial to the security claim, or an artifact of the reading; (b) if a finding is adjudicated
    corrected_by_authors, argue what the program should have concluded and when it could have known; (c)
    attack any implicit inference from ''the erratum survives'' to ''the security claim is wrong''; (d)
    name the cheapest single check that would falsify the batch''s headline reading. Apply the inventor-protocol
    closure standard: a claim that a lane is dead needs a named obstruction, not a fatigue count.'
  uncertainty_reduced: Whether the batch's headline reading survives an adversarial reading, and what
    the cheapest falsification of it would be.
  inputs:
  - The verified TASK-20260802-102 snapshot commit and its five artifacts
  - knowledge/open-problems/KN-OPEN-016.md
  - docs/inventor-protocol.md
  - PUBLICATION-CANDIDATES.md (the standing novelty-adjudication posture this batch tests)
  constraints:
  - Never fabricate a command, output, timing, statistic, citation, or run (AGENTS.md rule 9).
  - Every retrieved source records url, http_status, retrieved_at (UTC), sha256, and byte size. A source
    that could not be retrieved is recorded as unretrieved with its error, never paraphrased from memory.
  - Recollection is not evidence. A claim of the form 'I recall this is known' may be recorded only as
    an explicitly labelled unverified recollection, and may never adjudicate a finding in either direction.
  - Toy/estimate-tier results never become crypto-scale claims (AGENTS.md rule 7). No ML-KEM break claim.
  - Write only inside the declared write_scope. Do not edit prior batch artifacts or any ledger record.
  - You did not produce this package and must not repair it. Write objections; do not edit producer artifacts.
  - Independent session.
  - 'An objection must be checkable: name the artifact, path, or source locus that would settle it.'
  - Return pass, pass_with_constraints, or blocking_objections with numbered objections.
  deliverables:
  - red_team_report.yaml with numbered objections, each with a named cheapest check
  - objections.md with the argued case
  artifact_paths:
  - coordination/goals/GOAL-MLKEM-003/batches/BATCH-007/tasks/TASK-20260802-104/red_team_report.yaml
  - coordination/goals/GOAL-MLKEM-003/batches/BATCH-007/tasks/TASK-20260802-104/objections.md
  archived_by: TASK-20260802-105
  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 2400
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
  - every objection names a checkable artifact or source locus
  - the cheapest falsification of the batch headline is named explicitly
