    - >-
      DO NOT WRITE OR EDIT
      coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-a75ffb/tasks/TASK-20260825-ba07db/task.yaml.
      YOUR OWN TASK CARD LIVES INSIDE YOUR WRITE SCOPE DIRECTORY and it is the Coordinator's,
      not yours. If you believe it must change, report that as a blocker and stop; do not act
      on it.
    - >-
      DERIVE OR EXHIBIT FOR EVERY ORDERED PAIR. A dependency edge asserted without either a
      derivation from the committed source or an exhibited witness set is not a result. State
      for each pair which of the two you have, and say `undetermined` where you have neither
      rather than guessing. AN `undetermined` CELL IS AN HONEST OUTPUT; A GUESSED EDGE IS NOT.
    - >-
      REPORT ONE GRAPH PER PRIMITIVE AND DERIVE THE COMPONENT LIST AT ANALYSIS TIME FROM THE
      COMMITTED `serialize()` UNDER THE EXACT GENERATOR SET BATCH-efcae7 USED. DO NOT ASSUME
      THE SIX-ROW LIST IS THE SAME ON BOTH PRIMITIVES: the committed source emits
      `in_linearized_code` only for sha1, and takes `message_difference` from `delta_m` on
      md5 and from `dv` on sha1. A MERGED SINGLE GRAPH IS A DECLARED DEFECT, and the six-row
      partition is a UNION across two primitives whose composition must be stated explicitly
      with any single-primitive row named as such.
    - >-
      THE PARTITION IS PRE-REGISTERED AND IS REPRODUCE-OR-REFUTE (BR-3). It is fixed in
      batch.yaml `pre_registered_partition` before you run. A REFUTATION IS A FIRST-CLASS
      RESULT AND IS REPORTED WITH THE ROW, BOTH CLASSES AND THE DERIVATION THAT SEPARATES
      THEM. Do not adjust a class to make the arithmetic come out, and do not adjust the
      pre-registration: changing a criterion after observing an outcome requires a versioned
      protocol_amendment and is not yours to make.
    - >-
      STAGE (3) IS GATED ON STAGE (1) AND FOLLOWS THE MEASURED GRAPH (BR-4). Adjudicate only
      the off-diagonal cells the MEASURED graph marks as capable of carrying information. If
      the measured graph disagrees with the pre-registered partition, follow the MEASURED
      graph and record the divergence as a declared deviation. DO NOT RUN STAGE (3) FIRST AND
      DO NOT RUN THE DIAGONAL: the diagonal is known in advance by round 2's own general rule
      -- a family perturbing exactly the set a row deletes is DETECTED BY CONSTRUCTION -- and
      paying for cells whose answers are theorems is the cost this task exists to avoid.
    - >-
      ANY FAMILY THAT PERTURBS `in_linearized_code` PASSES A WELL-FORMEDNESS GATE FIRST
      (BR-5, goal-head restriction 3, DEC-20260824-c5bb72 `successor_gates` item 2). As
      specified, such a family would construct an object whose redundant fields contradict
      each other and whose detection would mean nothing. IF THE GATE CANNOT BE SATISFIED,
      REPORT THAT FAMILY AS NOT CONSTRUCTIBLE WITH THE REASON -- never as a zero, never as an
      empty cell, and never as evidence that the direction is closed. IT IS NOT CLOSED.
    - >-
      REBUILD O-E FROM ITS COMMITTED DEFINITION AND DO NOT INVENT A SECOND BLIND INSTRUMENT.
      Report that the rebuild is a SECOND IMPLEMENTATION of an unreplicated adversarial
      construction AND that it is not full replication, because it reads the same committed
      serialiser: agreement is evidence about the PROJECTION and is not an independent check
      that the serialiser implements the contract. That qualification is the round-2 Red
      Team's own and is adopted, not softened.
    - >-
      EVERY DETECTED OR NOT DETECTED VERDICT YOU QUOTE FROM BATCH-efcae7 CARRIES ITS BASIS
      AND ITS PRIMITIVE SCOPE (BR-6). A bare verdict from that table is the "96/96 and
      0/3000" failure one layer up.
    - >-
      NEVER QUOTE THE 5200-DRAW FIGURE AS EVIDENCE THAT REJECTION IS ROBUST TO PERTURBATION
      SIZE (BR-7). NEVER STATE POWER OVER THE SHA-1 MESSAGE DIFFERENCE MORE WIDELY THAN
      POWER OVER THE SIXTEEN-WORD SEED WINDOW PLUS ONE FLAG BIT ON THIS CENSUS (BR-8). STATE
      THE ATTRIBUTION TABLE'S IMPLEMENTATION DEPENDENCE BESIDE ANY CITATION OF IT (BR-9).
      `closest_distance` IS A REPORTED DIAGNOSTIC AND NEVER A MARGIN (BR-10).
    - >-
      DO NOT REPAIR THE INSTRUMENT. VD-3, VD-4, the {E4}/{E5} zero-image result, OBJ-3,
      OBJ-4, OBJ-10, RC-1's sub-arm fold and the two labelling defects routed here by
      DEC-20260824-c5bb72 `corrections_owed` item 3 ARE MEASURED AND DESCRIBED HERE, NOT
      FIXED. Write the fix down as an observation and do not apply it.
    - >-
      DO NOT READ, PARSE, EXTRACT, FETCH OR RECONSTRUCT
      coordination/goals/GOAL-MD5-001/quarantine/** OR THE SAME CONTENT BY ANY OTHER ROUTE,
      including the network, a package index, a retrieval index, or a model's own memory
      reproduced into a file. Do not even re-hash the payload. ATTEST NON-READING AND NAME
      THE MECHANISM RATHER THAN THE INTENT.
    - >-
      NO NETWORK ACQUISITION BY ANY ROUTE. You hold run_commands and deliberately NOT
      web_search under orchestration/roles.yaml; fetching via the shell would route around a
      declared role boundary. AMD-20260824-DIFFP-ACQ-1 is in force: Tier A refused by every
      route, TIER B BLOCKED PENDING A GOAL-MD5-001 DECISION -- BLOCKED, NOT CLOSED -- Tier C
      permitted but NOT AUTHORISED IN THIS BATCH. THE MD5 LANE IS NOT CLOSED AND NOTHING YOU
      WRITE MAY STATE OR IMPLY THAT IT IS.
    - >-
      NO SEARCH OVER THE DIFFERENCE SPACE, no collision attempt, no cost projection, no
      complexity figure. MINT NO IDENTIFIER OF ANY KIND, and mint no IDEA-* id from
      TASK-20260824-873dc9's proposal set, which remains gated.
    - >-
      MAKE NO COMMIT AND STAGE NOTHING (BR-13). You write files and return. The driving
      session commits under Coordinator authority. Where this envelope and agents/executor.md
      differ on commit behaviour, tool surface or authority, THE ROLE CONTRACT GOVERNS.
    - >-
      A TIMEOUT, CRASH, CEILING HALT, IMPORT FAILURE OR IMPLEMENTATION FAILURE IS
      INFRASTRUCTURE SIGNAL, never a negative mathematical result and never a finding about
      the dependency graph or about either primitive (AGENTS.md rule 5). Report an unspent
      budget AS UNSPENT and never reallocate it.
    - >-
      IF YOU FIND YOURSELF MEASURING WHETHER A CHARACTERISTIC-SEARCH SOLVER WORKS, STOP and
      report the observation for handoff to GOAL-MD5-001 (goal head `non_duplication`). That
      work is not this goal's and absorbing it would contaminate another goal's blind
      calibration criterion.
    - >-
      ATTEMPT `search_knowledge` BEFORE ANY ASSERTION ABOUT WHAT HAS OR HAS NOT BEEN TRIED,
      and record every query and outcome VERBATIM. The index is derived and may be empty; an
      empty answer is a fact about the index and licenses no inference in either direction.
      Write nothing to the index.
    - >-
      RECORD OBSERVATIONS ONLY. Compose no verdict on whether the instrument is validated, on
      whether any path is new, on novelty, or on either primitive's difference space. THE
      CLAIM CEILING IS `analyzed`, NEVER `supported`. A PASSING CONTROL IS NOT AN IMPROVEMENT,
      and a dependency graph is a fact about this program's own instrument and not a result
      about MD5 or SHA-1.
    - >-
      NEVER FABRICATE A COMMAND, AN OUTPUT, A TIMING, A STATISTIC, A CITATION OR A RUN
      (BR-15). Missing data stays missing and is reported as missing. NEVER INVENT, QUOTE OR
      RESTATE A COMMIT SHA YOU DID NOT MEASURE. NEVER SELECT ANY PROVIDER, BACKEND, ENDPOINT
      OR MODEL IDENTIFIER CONTAINING "Bedrock" (BR-14).
  deliverables:
    - >-
      harness/diffpath/keydeps.py -- THE ONLY NEW MODULE. The per-primitive key-component
      extractor read off the committed `serialize()`; the ordered-pair functional-dependence
      test with, per pair, a derivation reference or an exhibited witness set; the depth-1
      verdict re-classifier; the depth-2 dependency-break enumerator; the well-formedness
      gate of BR-5; the O-E rebuild from the committed projection; and the gated
      off-diagonal matrix driver. It imports the committed adjudicator and controlpower
      modules and MODIFIES NEITHER.
    - >-
      tests/test_diffpath_keydeps.py -- A NEW DEDICATED TEST FILE covering the component
      extractor on both primitives, the dependence test on at least one known edge and one
      known non-edge, the well-formedness gate's ability to REFUSE, the O-E rebuild against
      its committed definition, and the off-diagonal cell selector. NO EXISTING TEST FILE IS
      EDITED.
    - >-
      key-dependency-graph.json -- ONE GRAPH PER PRIMITIVE. The component list derived at
      analysis time with the generator set it was derived under; for every ORDERED pair, the
      verdict (`function_of` / `not_function_of` / `undetermined`), the basis (`derivation`
      or `witnessed`), the derivation reference or the witness set with its size, and the
      exceptions count. Any `undetermined` cell is listed by name in its own block.
    - >-
      verdict-partition.json -- THE RE-PARTITION OF EVERY DEPTH-1 VERDICT OF BATCH-efcae7,
      per primitive and then composed into the six-row union, into PROVABLY UNDETECTABLE BY
      ANY FAMILY / NOT PROBED BY A DECLARED FAMILY / PROBED AND GENUINELY NOT DETECTED /
      ENTAILED BY THE PERTURBING FAMILY'S OWN DECLARATION / CONTINGENT ON THE INSTRUMENT --
      WITH THE PRE-REGISTERED CLASS BESIDE THE DERIVED CLASS FOR EVERY ROW, an explicit
      AGREES / DIFFERS flag per row, and the integer totals stated AS A PARTITION AND NEVER
      AS A FRACTION.
    - >-
      depth2-dependency-breaks.json -- the depth-2 subsets that BREAK a dependency, with the
      argument for each and the argument for every subset that does NOT, plus the explicit
      statement of how many of the fifteen subsets are thereby retired without compute and
      how many remain open.
    - >-
      offdiagonal-matrix-result.json -- the off-diagonal cells SELECTED with the graph
      reason each was selected and each excluded cell's reason; the family-by-row verdict for
      each selected cell under the HONEST instrument and under O-E; THE COUNT OF DIFFERING
      CELLS as an integer with the cells named; and any family reported NOT CONSTRUCTIBLE
      under BR-5 with its reason. STRICT AND PERMISSIVE ARE SEPARATE FIELDS AND ARE NEVER
      MERGED. An unmeasured cell serialises as null, NEVER as integer zero -- this is one of
      the two labelling defects DEC-20260824-c5bb72 routed here, and it is honoured in this
      task's own output even though repairing round 2's is out of scope.
    - >-
      artifact-index.json -- A sha256 FOR EVERY FILE THIS TASK WROTE, including any file not
      in `artifact_paths`, plus the sha256 of every committed input file the analysis read
      from harness/ and from the BATCH-efcae7 producer and reviewer directories. THERE ARE NO
      RUN DIRECTORIES IN THIS BATCH, so this index is how the package is content-bound beyond
      its declared paths.
    - >-
      execution-report.yaml -- WHOSE HEADLINE IS THE GRAPH AND THE PARTITION, NEVER A PASS
      AND NEVER A FRACTION. It states, in order: the search_knowledge queries and outcomes
      verbatim; the quarantine non-reading attestation with its mechanism; the derived
      component list per primitive; the graph; the partition with AGREES / DIFFERS per row
      and an explicit statement of whether the pre-registration reproduced or was refuted;
      the depth-2 argument; the gated off-diagonal count; every deviation with its named
      cause; the measured wall clock with any unspent budget reported AS UNSPENT; the
      inference block (requested policy, backend, resolved model identifier, whether
      probe-verified, fallback_used false, degraded false, amazon_bedrock_used false); and it
      CLOSES WITH THE EXPLICIT STATEMENT that NO CHARGED RUN WAS SPENT, NO PATH IS CLAIMED
      NEW, NO SEARCH WAS RUN, NO SOURCE WAS ACQUIRED, NO INSTRUMENT WAS REPAIRED, and THE MD5
      LANE IS BLOCKED RATHER THAN CLOSED.
