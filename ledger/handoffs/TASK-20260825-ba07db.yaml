  constraints:
    - >-
      ZERO CHARGED RUNS (BR-1). Do not create a run directory, a RUN-* identifier, a run
      manifest, an armed deadline or a consumed ceiling, and do not invoke harness/runner.py
      `run_wrapped`. `maximum_runs: 1` in the budget below is a SCHEMA FLOOR --
