  objective: >-
    COMPUTE THE MEMBERSHIP KEY'S PER-PRIMITIVE FUNCTIONAL-DEPENDENCY GRAPH FROM THE
    COMMITTED `adjudicator.serialize()`, USE IT TO RE-READ EVERY DEPTH-1 VERDICT
    BATCH-efcae7 REPORTS, AND THEN -- GATED ON THAT OUTPUT AND INSIDE THIS SAME TASK --
    ADJUDICATE ONLY THE OFF-DIAGONAL CELLS OF THE FAMILY-BY-ROW MATRIX AGAINST THE HONEST
    INSTRUMENT AND AGAINST ONE KNOWN-FALSE INSTRUMENT. IN THREE NUMBERED DELIVERABLES AND
    IN THIS ORDER.
    (1) A STATIC, ZERO-CHARGED-RUN ANALYSIS, PER PRIMITIVE, that outputs for each ORDERED
    PAIR of membership-key components whether one is a deterministic function of the other,
    with a derivation or an exhibited counterexample for every pair, and that
    RE-PARTITIONS every depth-1 verdict of BATCH-efcae7 into PROVABLY UNDETECTABLE BY ANY
    FAMILY / NOT PROBED BY A DECLARED FAMILY / PROBED AND GENUINELY NOT DETECTED / and, for
    the DETECTED rows, ENTAILED BY THE PERTURBING FAMILY'S OWN DECLARATION versus CONTINGENT
    ON THE INSTRUMENT. REPRODUCING OR REFUTING THE PRE-REGISTERED PARTITION FROM THE GRAPH
    ALONE IS THIS TASK'S FIRST DELIVERABLE AND ITS OWN FALSIFICATION TEST.
    (2) NAME THE DEPTH-2 SUBSETS THAT BREAK A DEPENDENCY, with the argument, so that the
    fifteen-subset depth-2 lattice is BOUGHT BY ARGUMENT RATHER THAN BY COMPUTE.
    (3) GATED ON (1): on the off-diagonal cells the MEASURED graph marks as capable of
    carrying information, adjudicate the family-by-row matrix TWICE -- once against the
    honest instrument and once against the per-primitive-blind known-false instrument O-E --
    and report the COUNT OF DIFFERING CELLS.
    REPORT A GRAPH, A PARTITION, AN ARGUMENT AND A CELL COUNT. COMPOSE NO VERDICT.
  uncertainty_reduced: >-
    WHETHER THIS PROGRAM'S OWN PER-COMPONENT POWER PROFILE CAN BE READ AT ALL, AND HOW MUCH
    OF IT IS ABOUT THE INSTRUMENT. BATCH-efcae7 measured six depth-1 verdicts whose every
    integer reproduces three ways and whose reading does not survive: a NOT DETECTED verdict
    there is a provable impossibility, a coverage gap, or a genuine negative, and the single
    column cannot tell a reader which. The re-partition converts the profile into a
    statement; the off-diagonal count is the honest scalar version of what the round-2
    strengthening actually bought. SECOND, SMALLER, AND STATED SO IT IS NOT OVER-CLAIMED:
    stage (3) rebuilds the strongest surviving round-2 known-false instrument, which
    DEC-20260824-c5bb72 recorded as built once by one session and never re-run
    (EV-DIFFP-b16b01 UC-2) -- one of the two independent grounds on which that decision
    refused `reject_scoped`.
