    - templates/research-records.md
  read_scope_note: >-
    A whitelist of four repository files. Every other repository path is out
    of scope, and every path in the plan's blind_rederivation.blind_from is
    forbidden by name, which you cannot see and need not: read nothing else.
    No git history of any kind, and no pull-request text. No external
    retrieval is needed; every parameter is on this card.
  quantities:
    what_you_are_testing: >-
      Whether a structural capacity statement about a finite abelian group
      and a k-list cost table are determined by elementary arithmetic on the
      stated model. A second implementation will be compared with yours
      afterwards.
    parameters:
      l: 680564733841876926932320129493409985129
      l_note: a prime of 129 bits; you may verify primality but need not
      group_orders:
        primary: 4 times l
        control_one: 2 to the power 17
        control_two: 4 times 137 times 239
      exact_filter_definition: >-
        For a finite abelian group G written additively, a map h from G onto a
        set of size M is exactly sum-compatible if there is a combining rule f
        such that h(P + Q) = f(h(P), h(Q)) for all P, Q in G and f is
        invertible in each argument. The capacity of G below a bound X is
        log2 of the largest M strictly less than X for which such an h exists.
      list_model: >-
        A k-list tree with k = 2^j lists over a group of order N uses lists of
        size L = N to the power 1/(j + 1) and costs k times L group operations
        per attempt. A factor base must contain the lists, so its size B
        equals L. The relations needed are B (without orbit unknowns) or B
        divided by 262 (with orbit unknowns). The linear algebra costs k times
        (relations)^2. The total is relations times per-attempt cost, plus the
        linear algebra.
      N_for_the_list_model: l (the primary group's prime factor), not 4 times l
      k_values: [8, 16]
      rho_reference_definition: R = sqrt(pi times l divided by (4 times 131)), in bits
    Q0:
      name: undetermined choices
      definition: >-
        Every point at which the definitions above left you a choice (whether
        M = 1 or M = order counts, whether f invertible in each argument
        forces a group structure on the alphabet, rounding of L, real versus
        integer arithmetic, the coefficient of the linear-algebra term). For
        each, quote the text, list the admissible readings, and say which
        quantities depend on it.
      report: A list. An empty list is a result and must be stated as such.
    Q1:
      name: exact filter capacity
      definition: >-
        For each of the three group orders in group_orders, treating the
        group as any finite abelian group of that order (state whether your
        answer depends on the isomorphism type), the set of alphabet sizes M
        for which an exactly sum-compatible h exists, and the capacity in
        bits below X = l for the primary group, below X = 2^17 for control
        one, and below X = 239 for control two. Prove or cite from first
        principles the structural fact you rely on; do not transcribe it.
      report: Per group order, the set (or its description), the capacity in bits, and the argument in your own words.
      tolerance: exact
    Q2:
      name: ideal k-list tree cost table
      definition: >-
        For each k in k_values, with N = l as stated: log2 of L, log2 of the
        per-attempt cost, log2 of the relations needed without and with orbit
        unknowns, log2 of the linear-algebra term in each case, and log2 of
        the total in each case.
      report: Per k and per case, every value to two decimal bits.
      tolerance: 0.5 bit
    Q3:
      name: rho reference
      definition: R in bits, as defined in parameters.
      report: To four decimal bits.
      tolerance: 0.05 bit
    Q4:
      name: margins against the reference
      definition: log2 total from Q2 minus R from Q3, per k and per case, in bits, with its sign.
      report: Per k and per case.
      tolerance: 1 bit
    rules:
      - BL-1 Read only the four whitelisted repository paths. Every other repository path is out of scope.
      - BL-2 Run no git command that shows history (log, show, blame, diff) and read no pull-request text.
      - >-
        BL-3 Choose your own libraries and algorithms and name them with
        versions. Do not transcribe any value or theorem statement from any
        source; compute and argue it.
      - >-
        BL-4 If you find, in a source you were permitted to read, a value that
        looks like an already-computed answer to Q1 to Q4, stop and report a
        leak.
      - BL-5 Report on J5 only. Give no verdict on any contract or hypothesis, which you have not read.
      - BL-6 Zero experiment runs. This is arithmetic and elementary group theory.
      - BL-7 Write nothing outside your write scope. Put every script, command and raw output inside computations.json.
    verdict_rule_for_your_attestation: >-
      Your review_attestation verdict on J5 is inconclusive by design: you
      are forbidden to compare. Report Q0 to Q4 in full; the composing
      Coordinator compares them with the contract's frozen certificate and
      table under the plan's keys.
  constraints:
