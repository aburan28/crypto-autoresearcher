    asks for. You are told what to compute and not how, and you read no
    other artifact of this program.
  uncertainty_reduced: >-
    Whether the lane-B deployed arithmetic (the exact sum-compatible filter
    capacity of a finite abelian group of stated order, and an ideal k-list
    tree cost table) is determined by the stated model and parameters. A
    second implementation, written by someone who shares nothing with you,
