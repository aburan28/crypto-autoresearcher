  goal_id: GOAL-MONO-001

  objective: >-
    Execute EXP-MONO-0e6e8f: an UNCONDITIONED five-class Chebotarev census
    of the m=4 symmetric-base Semaev cover, reusing EXP-MONO-815525's own
    already-independently-verified S_4/Q_e(T) construction, to test
    whether the observed factorization-class distribution matches full S_4
    or shows systematic absence consistent with a named proper subgroup.

  authorized_by: coordinator
  authorization_basis: >-
    DEC-20260904-858cdc's own next_action, naming this exact design.

  critical_difference_from_the_predecessor: >-
    EXP-MONO-815525 filtered to ONLY g-irreducible base points, which was
    proven (by an explicit null-object control, see
    experiments/EXP-MONO-815525/reviews/red-team/red-team-report.yaml) to
    have zero discriminating power -- every group containing an order-3
    linear-part element forces the SAME observed pattern there, regardless
    of translation. THIS EXPERIMENT MUST NOT FILTER ON g's OWN
    FACTORIZATION TYPE AT ALL (except the single explicit
    Res(g,f)=0 exclusion named below). Sample (e1,e2,e3) uniformly across
    ALL of F_p^3 and classify whatever comes out. If you find yourself
    implementing any other selection rule on the base point, STOP -- you
    have likely reintroduced the exact defect this experiment exists to
    avoid.

  reused_construction: >-
    Load experiments/EXP-MONO-815525/implementation/derive_s4.py and
    run_census.py by file path (read-only, do not copy/modify the core
    Q_e(T) construction). Re-run its own construction-verification checks
    once at Stage 0 as a sanity check before proceeding to Stage 1.

  constraints:
    - >-
      Explicitly check and disclose isogeny class for the tested curves
      (e.g. via trace of Frobenius and CM discriminant) -- do not repeat
      EXP-MONO-815525's own disclosed error of treating two isogenous
      curves as independent.
    - >-
      Explicitly exclude Res(g,f)=0 (the case where g equals the curve's
      own defining polynomial f, causing Q_e to degenerate identically) --
      check and skip, disclose the exact count excluded.
    - Do not silently discard any instance in any class. Report the complete per-instance classification.
    - One run directory: runs/RUN-MONO-0e6e8f-1/, full manifest per docs/evidence-and-reproducibility.md.
    - No network access. Budget per specification.yaml.
    - Any infrastructure failure is failed_infrastructure, never mathematical evidence.

  budget: see experiments/EXP-MONO-0e6e8f/specification.yaml `budget` block.

  completion_gate: >-
    execution_report.yaml filed with Stage 0's re-verification outcome,
    Stage 1's complete per-instance classification counts (all five
    classes, plus the Res(g,f)=0 exclusion count), and Stage 2's
    chi-square statistic AND per-subgroup falsification checks reported
    distinctly -- before any snapshot archive or dispatch to independent
    review.

  next_step_after_completion: >-
    Coordinator isolated snapshot archive of the run package (exact
    declared paths), then independent Validator + Red Team dispatch,
    given the review architecture's own track record on this exact
    sub-lane this session (three genuine, load-bearing findings caught in
    three consecutive rounds).

