  constraints:
    - id: CA-1
      text: >-
        COMPOSE; DO NOT VOTE-COUNT. Each reviewer owned a strict subset of the
        joints and could not see the others. "Both reviewers concurred" is not a
        finding about the claim; it is two findings about disjoint joints. Write
        what the union of the joints establishes and what it does not.
    - id: CA-2
      text: >-
        RUN `python3 tools/check_review_independence.py --batch
        coordination/goals/GOAL-FROB-6333a9/batches/BATCH-5286b0/reviews/` BEFORE
        composing, and record its result in the decision. Every joint owned,
        every assigned reviewer attested, no undeclared sibling reads, and no
        re-deriver whose declared sources intersect its `blind_from`. A failure
        here voids the round's independence and the composition waits.
    - id: CA-3
      text: >-
        COMPARE THE OUTCOME AGAINST THE RECORDED PRIOR, EXPLICITLY, and cite
        PD-R1 when you do. The prior was written by the session that also
        composed EV-FROB-b6e1e9 and found both contract defects, so concurrence
        is weaker evidence than it looks and the decision must say so rather than
        letting a reader infer independence that is not there.
    - id: CA-4
      text: >-
        AN INSTRUMENT DEFECT IS NOT A MATHEMATICAL RESULT. If J1, J2 or J4
        breaks, the decision records an invalid run set returned to the executor
        with concrete defects -- never a finding for or against Frobenius-stable
        factor bases.
    - id: CA-5
      text: >-
        DO NOT MOVE H-FROB-a5bf86 IN THIS ARCHIVE unless the composition actually
        supports it at the scope the artifacts carry, and never on a single
        unreplicated cell. `weaken` plus replication, never `reject_scoped`, on
        one run set. Any adverse transition needs the strongest checkable
        refutation artifact the result admits, archived first.
    - id: CA-6
      text: >-
        FILL `knowledge_promotion` ON THE DECISION. Promote a KN-FIND only on
        `support`/`reject_scoped` backed by `replicated`/`strong` evidence; a
        single primary cell is neither. Otherwise state a concrete
        `not_warranted` reason.
    - id: CA-7
      text: >-
        STAGE ONLY THE DECLARED PATHS, PATH BY PATH. `git add -A` is forbidden.
        Merge origin/main first -- merge, never rebase.
    - id: CA-8
      text: >-
        SCOPE THE DECISION to the tested curves, degrees, arity, solver commit,
        search modes, replicate count and budget, and state any transfer
        assumption explicitly. n = 41 and 43 is not n = 131.
    - id: CA-9
      text: ZERO RUNS. This is not a /run and launches no trial.

