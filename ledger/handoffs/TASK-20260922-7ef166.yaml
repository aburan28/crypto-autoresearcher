# decision and LEDGER-ARCHIVE the round. Runs ALONE, after both reviews return.
#
# This is BATCH-5286b0's closing archive and the single ledger archive
# `_validate_review_chains` requires: it depends on every review and names every
# review as a source, so `review_archives` is a set of size exactly one.
#
# IT DOES TWO JOBS, AND THAT IS A DISCLOSED COMPROMISE. It composes the verdicts
# into DEC-20260922-f4d910 and it commits them. The better shape splits those --
# BATCH-cbb416 used TASK-20260916-ac0aea to rule and TASK-20260916-9d98ef to
# archive, and this batch's own procedure_deviations PD-2 argues for exactly that
# separation. It is not taken here for two reasons stated rather than glossed: no
# fifth handoff identifier is minted, and the validator demands exactly ONE
# ledger archive over the reviews, so a separate compose card would have to be a
# non-archive source of this one -- which is right, and is what a later batch
# should do. See `composition_and_archive_in_one_card` below.
# =============================================================================
