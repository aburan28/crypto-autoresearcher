  title: >-
    Revise lane A to version 4: write EXP-NISTBIN-451dfa version 4
    (approved_by null) at the canonical path, one append-only version_4 block
    of H-NISTBIN-dec5e1 with an in-force index, a version-4 audit sheet with
    committed import-safe code and a revision worksheet with a value-free
    newly_frozen_values section, discharging RV3-1 to RV3-14 of
    DEC-20261002-353743
  objective: >-
    Run /design-experiment as a fresh Coordinator-role session on
    IDEA-20260922-7d6d43 Parts 1-2 under RQ-NISTBIN-06157b and write version 4
    of EXP-NISTBIN-451dfa under DEC-20261002-3ba55f R-FORM
    (DEC-20261002-0983f2 R-FORM extended to version 4). Discharge RV3-1 to
    RV3-14 of DEC-20261002-353743 by number (revision_items below), apply its
    rulings S-1 to S-4, carry everything that decision composed as holding
    unchanged except where an RV3 item forces a change (each change in
    constants_delta with its forcing item), and meet the design items DI-INDEX
    and DI-MI2. DEC-20260924-99ce20 S1 scope, design conditions C1-C8 and
    tripwire T1 still bind. Zero runs.
  uncertainty_reduced: >-
    Whether a version-4 lane-A protocol exists that discharges RV3-1 to
    RV3-14 while keeping everything REVIEW-NISTBIN-20261002-f435ab found to
    hold, with the decomposition-probability form declared as a numbered
    choice and the hypothesis layering made checkable, stated precisely
    enough for REVIEW-NISTBIN-20261002-bc5bd5 to test it joint by joint and
    to re-derive every newly frozen value blind. It measures nothing about
    the 571 cell, the true solving degree or any curve.
  revision_items:
    source: >-
      DEC-20261002-353743 revision_defects and rulings_on_relayed_items,
      verbatim in substance; that decision is the authority where wording
      differs. A remedy may be met by any equivalent route stated with its
      reason, except where the decision fixes the route.
    breaking:
      - id: RV3-1
        joint: J1 (353743 J2-D1, J2-D2, J2-D3; W1)
        requirement: >-
          A memory figure in the same sentence, list item, table row or
          printed log line as every in-force time figure, including the
          A(571, m) log lines. Print the store per line in CB-2 (or its
          successor) under a new pinned digest. The three groups are the
          carried figure in the specification's fixture_target.source_status,
          the restated target in the hypothesis version_3
          proof_search_map.baseline_embedding.reproduction_check (supersede
          that field in the version_4 block and restate it with memory), and
          the A(571, m) figures of the C-4 log.
      - id: RV3-2
        joint: J1 (353743 J2-D4, J2-D5; W2, W3)
        requirement: >-
          Join each memory statement to its figure, or replace index-text
          figures by field-path labels. The plan declares the in-force text
          rule (logs are in force; WITH means same sentence, list item, table
          row or printed log line); follow it, and do not declare a different
          rule yourself.
      - id: RV3-3
        joint: J2 (353743 OBJ-J4-0; rd6_search; OBJ-J4-7)
        requirement: >-
          Rewrite the version-3 audit's L-INT M7 binomial example in an
          m7_direction lemma form that names the per-step crossover and the
          cumulative crossover separately per m (the plan's PTM-I gives both
          definitions); state the direction relative to the cumulative
          crossover; correct rd6_search; qualify the attributed range as "no
          earlier for crossings above the cumulative crossover". Every
          crossover degree you print is computed by committed C-4 code and
          listed as an NF item.
      - id: RV3-4
        joint: J5 (353743 O-RT-01; S-3 literal reading)
        requirement: Admit the cross-check record path in IR-1's whitelist and name the declared raw-result.json files, so that read literally no rule forbids a read SN-1, RS-2 or C-XDEG requires.
      - id: RV3-5
        joint: J5 (353743 O-RT-02)
        requirement: protocol_success adds "and no invalidation rule V-1 to V-11 fired".
      - id: RV3-6
        joint: J6 (353743 K-indeterminate on Q0-01, condition C2)
        requirement: >-
          Declare the decomposition-probability form as a numbered
          model-identification choice MI-2 (design item DI-MI2), with its
          textual basis and its consequence disclosed, as MI-1 is.
    material:
      - id: RV3-7
        source: OBJ-J4-4 and O-RT-04 (two independent reviewers; C6)
        requirement: >-
          Either a numbered heuristic transferring H1 to (571, m) for every m
          of the M-SET under both k readings, with its random-model
          justification, falsification condition and scheduled validation
          pointer, and the per-m span beside the table (route T); or E1, E2
          and the threshold sentence scoped to m = 12 by rule, the other m
          printed as unscored context (route S). State the route chosen and
          why.
      - id: RV3-8
        source: OBJ-J4-3
        requirement: Carry the one-k comparison rule (C-CEIL-T at a measured k = ceil(n/m)) into definitions.e1_e2.
      - id: RV3-9
        source: OBJ-J4-1, O-RT-09
        requirement: Reconcile E1 with H1's one-step upper tolerance (R-B only), as E2 now is; word E1, E2 and H1 identically in the specification and the version_4 block.
      - id: RV3-10
        source: 353743 S-2 (b)
        requirement: Scope P-S to crossings at D >= 4 wherever it is stated, as L-SPREAD is.
      - id: RV3-11
        source: 353743 S-2 (a); OBJ-J6-1
        requirement: >-
          State outcome-class reachability per branch under D-10 without
          presenting any class as a finding; remove or mark every unreachable
          branch (the K4 branch included); state the decision value of
          execution given that the threshold table has been blind-derived
          twice with full agreement; restrict K4 revisit (i) to
          k = ceil(n/m), t = m and to the first validated report after the
          decision.
      - id: RV3-12
        source: O-RT-03
        requirement: V-6 covers an absent gates.json; raw-result.json carries the gates.json sha256 and per-stage timestamps.
      - id: RV3-13
        source: O-RT-05; UNOWNED-4
        requirement: A provenance note naming who read which C4 source and when; re-base pricing_conventions on the three correction records.
    minor:
      - id: RV3-14
        source: >-
          O-RT-06, O-RT-07, O-RT-08, O-RT-10, O-RT-11, OBJ-J6-2, OBJ-J4-5,
          OBJ-J4-6, F-J1-1, F-J1-2, F-J1-3, F-J3-1, J8-N1, J8-O1, 4cb903
          OBS-2 and OBS-3
        requirement: Answer each as its report states; map each id in the worksheet to a change with its location or to a stated reason.
    design_items:
      - id: DI-INDEX
        source: DEC-20261002-3ba55f R-FORM (the layering cost of R-FORM; C8 broke on carried hypothesis fields in two rounds)
        requirement: >-
          The version_4 block carries in_force_index, a list with one entry
          per field path of the version_1, version_2 and version_3 layers
          (nested fields included), each with its layer and a status of
          in_force or superseded_by_version_4. Every earlier field that
          states a time figure is either superseded and restated in the
          block with its memory figure, or in_force and already WITH its
          memory figure under the plan's rule. The index is complete, not a
          sample.
      - id: DI-MI2
        source: RV3-6; 353743 R-K-INDETERMINATE; next_plan_items item 2
        requirement: >-
          MI-2 names the two forms by formula (PF-1 P = 2^(mk - n)/m!; PF-2
          P = 1 - exp(-2^(mk - n)/m!), the paper's equation (11)), quotes the
          paper's Section 4.3 text by line as its basis, states which form is
          in force and why, and discloses its consequence at 571, 283 and 359:
          A(571, m) per m under both forms, the minimised stage-1 cost at each
          degree under both, and whether the frozen C2 fixture passes under
          each form. If the fixture passes under exactly one form, say that it
          identifies MI-2. MI-2 is carried into H1, every threshold and every
          output template, with its label, as MI-1 is.
    carried_as_holding: >-
      DEC-20261002-353743 joint_dispositions: J1, J3, J5, J6, J8 and J11 held
      and J9 is applicable. Carry unchanged everything those joints found to
      hold (the coverage gate and CB-1, CO-1, D-CARRY, the MI-1 disclosure and
      direction at 571, 283 and 359, the fixture passing as frozen, scoring at
      omega 3 with G4 gated, PTM-A to PTM-F, the K4 revisit keyed to an
      external event, every D-8 item, custody and approval fields, the
      parallelization statement, every stated memory figure that was correct
      at its own point) except where an RV3 item forces a change, listed in
      constants_delta with its forcing item. Every Q1 and Q2 value stays
      value-identical unless an RV3 item forces it (J6 D-CARRY).
  newly_frozen_values_obligation: >-
    The worksheet carries a separable section newly_frozen_values listing
    EVERY value version 4 freezes and version 3 did not (memory and store
    figures on log lines, MI-2 consequence figures, crossover degrees, any
    per-m span, any value of a new rule-trace or reachability table, any
    constant of changed code), each as NF-nn with (a) its location by file and
    field path, never its value, (b) a value-free definition sufficient for an
    independent re-derivation (what is computed, from which primary inputs,
    under which rule, parameters, k reading and P form), and (c) where it
    applies, the label of the quantity of
    coordination/review/nistbin-20261002-f435ab/blind-inputs.yaml or
    coordination/review/nistbin-20261002-bc5bd5/blind-inputs.yaml that
    defines the same quantity, by label only. The section attests
    definitions_are_value_free true. The pre-review gate copies each
    definition byte-exact to the blind card, so each must stand alone; flag
    any definition you cannot separate from its answer. Use the contract's own
    names (MR_B, MR_M, MR_C8, W, R-B, R-M, D*_R, D*real_B, A, MI-1, MI-2,
    PF-1, PF-2, D_ps, D_cum) in every definition.
  allowed_session_computations:
    authority: DEC-20261002-3ba55f R-PRODUCER-COMPUTE, stated in advance
    note: >-
      This producer holds no shell. It may ask the top-level session to
      perform these and only these, by item id, in
      <session scratchpad>/BATCH-bc5bd5/TASK-20261002-e11714/, under
      /usr/local/bin/python3 (CPython 3.11.15; no 3.12+ API; the bash time
      keyword, since /usr/bin/time is not installed). It embeds each command
      and its verbatim output in the audit sheet as a design figure, never a
      result. Code is run exactly as written in the sheet and extracted by the
      pinned method. The session never exports or copies a whole git tree into
      scratch (353743 S-4); it checks out single declared files only. No
      computation instantiates a curve, constructs a group or runs a solver,
      so no synthetic object can coincide with a declared cell; a rule-trace
      manifest may use the contract's declared names as labels only.
    items:
      - >-
        C-1 extract each committed code block by the pinned method and compute
        its sha256; and recompute the version-3 reference sha256 of every block
        carried unchanged (CB-1 7e76be311e2063e3235f527d6abccb0165ca53865810bf1c3204b102f9269574;
        CB-2 96a681bc0f900cade3e42b60f80f92a3680056da91434674e19027978400d8cb)
      - >-
        C-2 a syntax check and an import-safety check of each block in a fresh
        /usr/local/bin/python3 (importing executes nothing), a scan for any
        3.12+ API, and a yaml.safe_load parse of each of the four returned
        files, reported verbatim and never repaired
      - >-
        C-3 run the committed Stage-0 coverage code (CB-1 or its successor)
        through its __main__ entry against the primary inputs, read-only, with
        its in-memory omission self-test, and relay the output verbatim
      - >-
        C-4 run the committed closed-form design-figure code (CB-2's
        successor under its new pinned digest) of the contract's abstract
        model: memory beside every printed time figure, including every
        A(571, m) line (RV3-1); the MI-2 consequence under PF-1 and PF-2 at
        571, 283 and 359, including the fixture under each form (DI-MI2); the
        per-step and cumulative M7 crossovers per m (RV3-3); any per-m span
        (RV3-7); the one-k comparison at k = ceil(n/m) (RV3-8); the
        reachability table per branch (RV3-11). It imports neither
        experiments/EXP-SEMBIN-81dc96/code/joint_balance.py nor anything under
        experiments/*/runs/, instantiates no curve and runs no solver. Output
        relayed verbatim.
      - >-
        C-5 run a committed rule-trace block, if the audit sheet commits one:
        every stopping, invalidation, input and gate rule of version 4 applied
        to synthetic run manifests (one valid run built from the closed forms;
        gates.json absent; a D* table written before gates.json; a ceiled
        figure inside a gated quantity; V-11 firing), reporting which rule
        fires and what protocol_success reads (RV3-4, RV3-5, RV3-12). No
        driver is written or executed. Output relayed verbatim.
      - >-
        C-6 sha256 of the three frozen specification copies and of the leading
        28166, 57952 and hypothesis_v3_prefix_bytes bytes of the hypothesis,
        relayed verbatim (custody baseline for constants_delta and the prefix
        rule)
    forbidden: >-
      Anything else. No execution of the frozen instrument or of any driver,
      no solver, no curve, no group, no SEMBIN or SDEG quantity re-measured,
      no run, no file read outside the repository except named primary
      sources and this card's scratch path.
