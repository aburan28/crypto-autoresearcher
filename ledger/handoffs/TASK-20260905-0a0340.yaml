handoff:
  id: TASK-20260905-0a0340
  from: coordinator
  to: idea-generator
  objective: Generate 12 distinct provisional ideas for producer B
  uncertainty_reduced: Generate 12 distinct provisional ideas for producer B
  inputs:
  - AGENTS.md
  - agents/idea-generator.md
  - docs/inventor-protocol.md
  - docs/target-result-profile.md
  - templates/research-records.md
  - coordination/ecc-ideas-20260905-c86946/coverage-plan.json
  - knowledge/
  - ledger/proposals/
  - ledger/hypotheses/
  - ledger/questions/
  - ledger/RQ-DREG-001.yaml
  - ledger/RQ-SIG-001.yaml
  constraints:
  - No dispatch until repair closing DEC is archived and its gates pass. This allocation
    changes no goal state and opens no new experiment.
  - All44 active/draft goals and58 questions require at least one substantively applicable
    proposal. A metadata-only label does not discharge coverage.
  - No experiments, attack implementation, private-key extraction procedure, exploit
    payload, or third-party target operation. Use mathematical conjectures, proof
    architecture, defensive certificate/control proposals.
  - Novelty remains unverified unless a specific local record and opened primary source
    support the exact distinction. No claim of global novelty from absent search results.
  - Every record contains exact claim, mechanism, differentiator from nearest work,
    predicted observable, falsification, cheapest discriminating test, matched null/known-false
    object, confounders, scope, and actual source provenance.
  - Proof-oriented records carry proof_search_map with baseline embedding, observation
    collision, quantifier order, method ceiling and named proof obligations. Any conditional
    cost claim names heuristics and validation routes; report time, memory and data/query
    costs including setup/transport.
  - dominated_by may be null only after the declared frontier rows were actually checked.
    Otherwise record unresolved comparison, and a quantitative conditional sota_delta
    or explicit unquantified boundary.
  - Read exact assigned question constraints before proposing. Shared SafeCurves slots
    must specify applicability/failure cases across every assigned curve, with anomaly
    controls explicitly distinguished.
  - 'No padding: if a reserved bucket duplicates existing work, devise a distinct
    mechanism for its question set or return an explicit coverage gap for Coordinator
    reranking.'
  - Eight terminal goals are historical context only; do not reopen them or count
    a terminal status as a current task.
  - Sources and task receipts record requested research-deep policy and actual inherited
    native model provenance; no probe or independent attestation is invented.
  - Before generation use available knowledge retrieval. If search_knowledge is unavailable,
    disclose it and use explicit local record searches plus primary-source retrieval;
    absence of a match is not novelty evidence.
  - Read mechanisms of nearest internal proposals, not only titles. Record at least
    one specific nearest internal record and the exact difference for each candidate;
    record uncertainty if no neighbor can be established.
  - Research only at a high conceptual and mathematical level. No implementation or
    operational key-recovery/exploit instructions, even in a proposed minimal test.
  - Use source provenance recalled/retrieved/kb/internal correctly; name actual verifying
    task for sources opened. Record references per idea and source URLs/paths in sources.json.
  - Prefer mechanisms, representations and compositions over pure bookkeeping. A measured-control
    proposal must identify the mathematical uncertainty it could resolve.
  - Every idea stays status proposed and novelty_status unverified for this batch.
    No global novelty, asymptotic advance, completed goal, or verified mechanism is
    asserted.
  - 'Required per-idea fields: id,title,class,claim,mechanism,question_id,question_ids,goal_ids,goal_applicability,status,proposed_by,recorded_at,task_id,batch_id,novelty_status,novelty_screen,citations,assumptions,predictions,minimal_test,falsification_conditions,confounders,interpretation_limits,heuristic_assumptions,target_complexity,estimated_cost,recommended_priority,proof_search_map,dominated_by,sota_delta,inference.'
  - minimal_test defines design, matched null and known-false controls, required metrics,
    proposed small/self-generated mathematical fixtures, and stopping rule; it is
    a proposal only.
  - 'Write ideas.yaml as a mapping with ideas: [one complete idea body per allocated
    slot], no wrapper inside the list. Do not write to ledger or commit. report.md
    records counts, recommended first test and any incomplete coverage; sources.json
    records actual retrievals and read sources.'
  - Do not read sibling producer or reviewer outputs. Do not repair existing records.
    An incomplete candidate is revised before producer completion; after snapshot
    use additive correction only.
