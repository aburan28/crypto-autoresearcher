handoff:
  id: TASK-20260830-5b8033
  from: coordinator
  to: executor
  objective: >-
    Execute the FROZEN, coordinator-approved contract EXP-MONO-2a13d7
    exactly as written: Stage 0 (exhaustive curve enumeration at p=101 and
    p=211 via the REQUIRED O(p) character-sum method, computing (t,Z,j,
    order3_count) per curve, finding matched non-isomorphic pairs with
    equal (t,Z), selecting the Stage-1 panel, and emitting pre-registered
    closed-form predictions BEFORE any base-point enumeration), then Stage
    1/3 (exhaustive dual-check of the seven exact stratum-count closed
    forms on the selected panel, the internal sum checks, the
    baseline-reproduction check, and the matched-pair equality +
    non-vacuity control). Pure Python 3 stdlib only. Record observations
    only; render no verdict on H-MONO-0f9170.
  uncertainty_reduced: >-
    Whether, at toy scale (p in {101,211}), the seven Frobenius-class and
    excluded-stratum counts of the m=3 symmetric-base Semaev cover are
    EXACT integer functions of (p,t,Z) alone, per H-MONO-0f9170.
  inputs:
    - experiments/EXP-MONO-2a13d7/specification.yaml
    - ledger/hypotheses/H-MONO-0f9170.yaml
    - ledger/proposals/IDEA-20260830-9761f0.yaml
    - ledger/hypotheses/H-MONO-0b3def.yaml
    - experiments/EXP-MONO-4c7479/specification.yaml
    - experiments/EXP-MONO-4c7479/implementation/ (for the reusable
      base_construction/split-inert classification pattern; do not just
      copy blindly, this contract's classification is deliberately simpler
      per `stage1_classification.independence_from_sibling_arms`)
    - harness/semaev.py
    - knowledge/findings/KN-FIND-a8990a.md
    - docs/claims-and-verification.md
    - AGENTS.md
  constraints:
    - >-
      Follow experiments/EXP-MONO-2a13d7/specification.yaml EXACTLY; it is
      frozen. Do not implement Stage 2 (p=1009), the cross-prime
      panel-spread-decay prediction, or the j=0/j=1728/CM/full-2-torsion
      legs of the matched-pair search -- all explicitly out of scope
      (`future_work`).
    - >-
      Pure Python 3 standard library ONLY. No sympy, sage, numpy, g6k, or
      fpylll. Any import of a forbidden module invalidates the run.
    - >-
      Stage 0's curve point-counting MUST use the O(p) character-sum
      method specified in `inputs.curve_invariants_per_curve` -- NOT any
      O(p^2)-or-slower method. This is a hard requirement
      (`invalidation_rules` names using a slower method without a
      protocol amendment as a defect), not a preference.
    - >-
      The pre-registered closed-form table for each Stage-1 panel curve
      MUST be emitted and archived strictly BEFORE that curve's Stage-1
      base-point enumeration begins. This ordering is itself an
      invalidation rule if violated -- do not enumerate first and
      "pre-register" after the fact.
    - >-
      The matched-pair non-vacuity control (the pair must differ on j
      and/or order-3 point count) is MANDATORY. If it fails for every
      found pair at a prime, report the equality test as vacuous and draw
      no conclusion from it -- never report it as confirmation.
    - >-
      Excluded strata (double-root, (A4) ramified-A, (B2) ramified-B) are
      counted separately and never pooled into R1/R2/R3's five primary
      classes or into each other.
    - >-
      Stage 0 gates interpretation per prime: if no matched non-isomorphic
      pair with equal (t,Z) is found at a prime, report that as an
      instrument outcome for that prime (not evidence either way) and
      still proceed with R1/R3 and Z-coverage checks at that prime.
    - >-
      Internal sum checks (case A to C(p,2), case B to p(p-1)/2,
      double-root to exactly p) are free correctness gates: a failure
      voids the affected cell as an implementation defect, never as
      evidence against H-MONO-0f9170.
    - >-
      No hypothesis, experiment, or goal status change. No relation-rate,
      ECDLP, cost, or exponent claim of any kind, in either direction.
    - >-
      Any timeout, crash, or construction failure is `failed_infrastructure`,
      never negative mathematical evidence (AGENTS.md rule 3).
    - Exactly 2 runs, fully deterministic/seed-free (no randomness anywhere in this contract).
  deliverables:
    - experiments/EXP-MONO-2a13d7/implementation.md
    - experiments/EXP-MONO-2a13d7/implementation/ (source code)
    - experiments/EXP-MONO-2a13d7/runs/RUN-MONO-2a13d7-1/
    - experiments/EXP-MONO-2a13d7/runs/RUN-MONO-2a13d7-2/
    - execution_report.yaml (per docs/evidence-and-reproducibility.md)
  artifact_paths:
    - experiments/EXP-MONO-2a13d7/implementation.md
    - experiments/EXP-MONO-2a13d7/implementation/
    - experiments/EXP-MONO-2a13d7/runs/RUN-MONO-2a13d7-1/
    - experiments/EXP-MONO-2a13d7/runs/RUN-MONO-2a13d7-2/
  archived_by: TASK-20260830-0532d0
  inference:
    policy: executor-implementation
    reasoning_effort: medium
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
    reasoning_effort_basis: >-
      Bound by .claude/agents/executor.md effort medium and
      orchestration/roles.yaml role executor -> default_policy
      executor-implementation -> reasoning_effort medium. Bounded,
      spec-following implementation of an already-fully-designed contract;
      not design or ideation.
  budget:
    wall_clock_seconds: 1800
    memory_gb: 1
    maximum_runs: 2
  completion_gate:
    - >-
      Stage 0 curve-invariant tables emitted for both primes, matched-pair
      census reported (found/not-found per (t,Z) cell), panel selected and
      documented, and pre-registered closed-form tables archived BEFORE
      Stage 1 begins for each curve.
    - >-
      R1 (per-stratum residual), R2 (matched-pair difference, conditional
      on non-vacuity), and R3 (internal sums) reported per panel curve at
      both primes.
    - Baseline-reproduction check reported on the 3 sibling-panel curves per prime.
    - >-
      Per-base-point classification log retained in full for both runs,
      per `required_artifacts`.
    - >-
      Run manifests bind git commit, dirty flag, environment (confirming
      stdlib-only and which modular-sqrt routine is used), timing,
      resources.
  return_format: >-
    Executor execution_report.yaml per docs/evidence-and-reproducibility.md:
    Stage 0 matched-pair census and M-identity check; per-cell R1/R2/R3;
    baseline-reproduction outcome; excluded-strata counts; any deviations
    or anomalies. Observations only -- no verdict on H-MONO-0f9170, no
    status change.
