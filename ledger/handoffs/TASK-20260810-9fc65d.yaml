    memory_gb: 3
    maximum_runs: 1
  completion_gate:
    - >-
      A strict-YAML report binds every verified archive receipt and returns
      exactly one scoped verdict with a per-artifact disposition.
    - >-
      All six R2 elements of CM-1, the amendment's specified vocabulary and
      check_run change, and the adoption record's three bindings are
      dispositioned by name.
    - >-
      The provenance gate and the C2 stamp duty are checked concretely per task,
      with committed stamps reported as attestation and never as proof.
    - >-
      The envelope receipt's arithmetic is re-derived from preserved raw outputs
      and reported field by field, including agreement or disagreement with
      MEAS-GOAL-AES-002-001.
    - >-
      Tier compliance of the object enumeration is checked item by item,
      including the exact dominated_by string and the not-a-completion
      declaration.
    - >-
      Independence, provenance, the correlated-pair limitation and no-Bedrock
      status are explicit, and no attestation is recorded.
    - No file outside the declared report was written and no commit was made.
  return_format: >-
    A YAML report with exactly one scoped verdict, a per-artifact disposition, a
    per-task provenance-gate and stamp-duty check, the field-by-field
    re-derivation of the envelope receipt, an item-by-item tier-compliance check
    of the object enumeration, a findings list each with evidence and a concrete
    repair action, an explicit independence and provenance block including the
    correlated-pair limitation, and the SC-1 budget stamp block.
