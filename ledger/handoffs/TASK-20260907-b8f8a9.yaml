    - experiments/EXP-ECDLP-869870/specification.yaml
    - experiments/EXP-ECDLP-869870/execution-report-v2.yaml
    - experiments/EXP-ECDLP-869870/source_v2/
    - ledger/decisions/DEC-20260907-f394f5.yaml
    - ledger/decisions/DEC-20260906-1f5b71.yaml
    - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-289698/tasks/TASK-20260906-7ec3ea/src/j2_rederive.py
    - experiments/EXP-ECDLP-869870/runs/RUN-ECDLP-869870-S-s1/receipt.yaml
    - experiments/EXP-ECDLP-869870/runs/RUN-ECDLP-869870-S-s2/receipt.yaml
    - experiments/EXP-ECDLP-869870/runs/RUN-ECDLP-869870-S-s3/receipt.yaml
    - experiments/EXP-ECDLP-869870/runs/RUN-ECDLP-869870-S-s4/receipt.yaml
