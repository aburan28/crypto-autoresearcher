  objective: >-
    Independently validate the EXP-ECDLP-869870 v2 successor-cell runs
    against PA-ECDLP-869870-v1-to-v2 and DEC-20260907-f394f5. Own joints
    J1 (mixer and walk-index fidelity; splitmix seeds 1-5 determinism
    vs v1) and J2 (per-mixer published-weight and top-T-share gates,
    raw and O(theta)-corrected). Do not read the red-team report.
    Do not transition H-ECDLP-3550b8. Observations and integrity only.
  inputs:
