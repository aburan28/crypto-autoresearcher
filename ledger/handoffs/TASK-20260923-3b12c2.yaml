        EDIT NO RECORD WHILE ARCHIVING. No decision, correction, run record,
        registry entry (beyond the declared placeholder replacement, which
        precedes phase A and is recorded in its receipt), card, goal head or
        reviewer report is edited by either phase. A defect found now is a new
        record, never a repair.
    - id: SC-3
