    - id: SC-6
      text: >-
        PHASE ORDER. Phase A completes, is pushed and has an open PR against
        main before any reviewer is launched. Phase B runs only after all four
        reviewer reports have returned and before the Coordinator composes
        either round or reads any report for a decision. Phase B stages a
