  reviewer_schedule_note: >-
    DISPATCHER-SIDE NOTE, NOT A CONSTRAINT ON REVIEWERS. The dispatching
    session runs at most two reviewers at once, and each reviewer wraps every
    solver-heavy command (PARI SEA / ellcard sweeps, msolve, Sage point
    counting) in flock on one host lock file, so no two solver computations
    ever overlap on the host (about 15 GB, no swap). This is a
    machine-protection mechanism only: the lock file carries no content and
    passes nothing between reviewers, so it does not touch the round's mutual
    blindness.

