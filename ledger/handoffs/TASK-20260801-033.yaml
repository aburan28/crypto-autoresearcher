handoff:
  id: TASK-20260801-033
  from: coordinator
  to: coordinator
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-024
  objective: >-
    Author a FRESH frozen experiment contract under the NEW id EXP-DEP-001, a new hypothesis
    record H-DEP-001 at status `specified` bound to RQ-ECDLP-002, and DEC-20260801-009 opening
    BATCH-024 on the single next_action recorded at the BATCH-023 close. The contract must fix
    the three plant constructions, the mandatory marginal bit-identity integrity check, the three
    ladders, R_REPS = 200, the statistic family, the two cells, the seeds, the required
    artifacts, the budget, the toy claim ceiling, the threshold RULE, the anti-tuning safeguard,
    the ALTERNATIVE-CLASS DECLARATION and the calibration-first lifecycle - ALL BEFORE ANY
    CALIBRATION DATUM EXISTS. Authorize no run.
  uncertainty_reduced: >-
    Whether the single largest gap in EV-EQD-001 - that its power certificate is against the
    wrong alternative class - is converted into a frozen, reviewable, falsifiable measurement
    whose reading is declared in advance in BOTH directions.
  inputs:
  - ledger/goals/GOAL-ECDLP-001.yaml next_action at the BATCH-023 close
  - ledger/decisions/DEC-20260801-008.yaml
  - ledger/evidence/EV-EQD-001.yaml
  - ledger/hypotheses/H-EQD-001.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/reviews/TASK-20260801-030/red_team_report.yaml
  - experiments/EXP-EQD-001/specification.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/dispatch_queue.json
  - docs/inventor-protocol.md
  - docs/target-result-profile.md
  - docs/claims-and-verification.md
  - docs/task-lifecycle.md
  constraints:
  - >-
    A NEW EXP ID AND A NEW HYPOTHESIS ID ARE MANDATORY. Do not file this as a v2, an amendment or
    a supersession-by-edit of EXP-EQD-001 or H-EQD-001.
  - >-
    DO NOT EDIT experiments/EXP-EQD-001/specification.yaml, experiments/EXP-EQD-001/reading_rule.yaml,
    the EXP-EQD-001 driver, any EXP-EQD-001 run package or any EXP-EQD-001 review. Read-only
    import and sha256 verification only.
  - Do not read-modify, edit or stage ANY file under experiments/EXP-DS-001/ or experiments/EXP-SMTH-001/.
  - >-
    Do not alter H-EQD-001, H-DS-001, H-SMTH-001, H-IC-001 or H-STR-002, and do not re-score or
    edit EV-EQD-001 or EV-DS-001 through EV-DS-004.
  - 'AP-2 BINDS. No threshold may be frozen that has never been measured against its own null.'
  - >-
    AP-3 BINDS AND IS NEW. The contract must state explicitly which class of deviation each
    statistic will have measured power against and which classes remain uncertified -
    ALT-CLASS-DEP-1 - and must name the reviewer duty that checks it against source.
  - >-
    Freeze the whole branch structure, the cuts rho_star and eps_star, the three ladders and the
    detection bar in the SPECIFICATION, before any datum, so the reading rule can only substitute
    numbers.
  - >-
    State the marginal bit-identity check as MANDATORY and a mismatch as INSTRUMENT FAILURE,
    never a result.
  - Check that every decision variable can actually vary with what it measures, and record DESIGN-TRAP-1 explicitly.
  - 'No search arms, no timing decision variable, no cost identity, no R, no smoothness statistic, no factorization.'
  - >-
    Toy claim ceiling. Forbid S1_met, F1_met, F2_met, structure_gate_passed, `support`,
    asymptotic promotion and reject_scoped-as-impossibility throughout. Promotion gates G1-G4
    stay OPEN.
  - Rule explicitly on manifest.yaml versus manifest.json and record the reason.
  - Carry every declared open item forward and say for each whether this batch discharges it, mitigates it or leaves it open.
  - 'CREATE NO RUN AND AUTHORIZE NOTHING. TASK-20260801-034 and TASK-20260801-041 are the two separate gates.'
  - 'MAKE NO COMMIT; TASK-20260801-034 archives.'
  - Leave FAEST and XEDN alone.
  - >-
    Every YAML and JSON file written must parse; prose containing a colon-space inside a
    block-sequence item must be a folded block scalar or quoted (CORR-20260801-002), and JSON
    delimiters must be checked - a missing comma broke the BATCH-023 queue.
  deliverables:
