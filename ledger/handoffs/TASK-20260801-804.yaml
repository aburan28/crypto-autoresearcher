handoff:
  id: TASK-20260801-804
  from: coordinator
  to: validator
  objective: >-
    Independently verify the committed BATCH-003 producer package as TWO
    SEPARATE and SEPARATELY REPORTED checks, whose verdicts are kept physically
    separate and are never merged, averaged or carried across: (a) the OD-1
    diameter computation, the OD-1 extension argument, and the redesigned
    GATE-701-C together with its run; (b) the ER-6 close-out, its regression
    suite, its coverage-boundary statement and the D-705-2 fix. The BATCH-002
    precedent is binding: a sound derivation does not validate an instrument
    repair, and a defect in the repair does not touch the mathematics.
  uncertainty_reduced: >-
    Whether the redesigned second null genuinely negates the NECESSARY Step-3
    ingredient and whether the redesigned gate genuinely DISCRIMINATES — the
    precondition DEC-20260731-025 placed on any future reject_scoped of the
    round-independent single-word deterministic class; whether the diameter and
    any OD-1 extension claimed from it survive independent recomputation and
    independent scrutiny of the argument; and whether the ER-6 fix actually
    detects the fault it was built to detect, or merely narrows the escape to a
    new uncovered axis as the H-3 repair did.
  inputs:
    - The verified TASK-20260801-803 snapshot receipt
    - The committed TASK-20260801-801 artifacts
    - The committed TASK-20260801-802 artifacts
    - >-
      DEC-20260731-025, EV-AES-002 and KN-FIND-028, including defects D-705-1,
      D-705-2, D-705-5, D-705-7/ER-6, D-705-8 and the open items H-2, H-4, ER-5
    - >-
      The TASK-20260731-705 validation package, in particular REPRO-705-3 (the
      void gate's measured readings) and REPRO-705-6 (the ER-6 injection
      method), read-only
    - The BATCH-001 and BATCH-002 committed artifacts, read-only, for supersession checking
    - GOAL-AES-001 and RQ-AES-001 scope, claim-tier ceiling and network policy
  constraints:
    - >-
      Read only COMMITTED artifacts. The TASK-20260801-803 snapshot receipt must
      verify against Git — reachable from HEAD, expected parent, exactly the
      declared paths, matching hashes — before any finding is recorded. If it
      does not, STOP and report an evidence-integrity failure.
    - >-
      TWO SEPARATE VERDICTS, PHYSICALLY SEPARATE. Check (a) in
      od1_and_gate_review.md, check (b) in er6_closeout_review.md.
      validation_report.yaml carries them side by side with NO combined verdict.
      Issue no overall grade.
    - >-
      CHECK (a), DIAMETER. RECOMPUTE the diameter yourself, by your own BFS on a
      graph you build from your own GF(2^8) arithmetic, taking no code or
      constants from the producer. Report your eccentricity distribution,
      radius, diameter and a realizing pair, and report any discrepancy with the
      producer's figures as a defect. Confirm strong connectivity independently.
    - >-
      CHECK (a), THE OD-1 ARGUMENT IS THE HIGH-STAKES ITEM. Work the extension
      argument step by step as TASK-20260731-705 worked PROP-701-I's three
      steps. State explicitly whether the claimed extension from
      round-independent objects to objects surviving more than roughly 2d rounds
      FOLLOWS, whether it is overstated, or whether the producer correctly
      declined it. A small diameter is a fact about a graph and does NOT by
      itself license a statement about projections: say plainly whether the
      producer conflated the two. Identify precisely where round-independence is
      or is not consumed in the layer-dependent case.
    - >-
      CHECK (a), THE REDESIGNED GATE. Verify from the committed source that the
      second null's entries are ALL NONZERO, that the matrix is INVERTIBLE, that
      its entries lie in a PROPER subgroup, and — by your OWN computation — that
      its (lambda,k) graph is NOT strongly connected, reporting the component
      structure you find. Then RE-RUN the gate yourself on all three matrices
      from the committed source and report your own readings. Return an explicit
      verdict on whether the gate DISCRIMINATES: target and BOTH nulls
      distinguishable. Apply the D-705-1 lesson directly — state whether the
      negated hypothesis is genuinely NECESSARY to the step it is drawn from, or
      whether the redesign has substituted one sufficient-hypothesis negation
      for another. Confirm the predicted readings were pre-registered before
      measurement, and confirm exactly ONE candidate second null was run:
      evidence of iterating over nulls until one discriminated is a serious
      defect and must be reported as such.
    - >-
      CHECK (a), A NON-DISCRIMINATING OUTCOME IS NOT A FAILING VERDICT. If the
      redesigned gate does not discriminate and the producer reported that
      plainly and stopped, say so and judge the REPORTING, not the outcome. The
      failure mode to look for is a gate massaged into passing, not a gate that
      honestly did not.
    - >-
      CHECK (b), ER-6. Do not accept the fix on the strength of the repair
      report. RE-CREATE the regime-confined fault YOURSELF from your own text,
      confirm independently by direct ciphertext comparison that it is real, run
      mutation_control_v3.py against it from committed source, and confirm the
      detection occurs through an EXECUTED comparison rather than any exception
      path. Then PROBE FOR A FURTHER COVERAGE ESCAPE ON AN AXIS NOBODY HAS
      LOOKED AT — ER-6 was itself the H-3 shape recurring inside the H-3 repair,
      so the prior that the class is closed is low — and report what you find,
      including a null result.
    - >-
      CHECK (b), REGRESSION AND VACUITY. Confirm the widened task set has not
      made the control fire on everything: re-run the semantics-preserving no-op
      mutant yourself and confirm detected: false after a NONZERO number of
      executed comparisons, and confirm at least one H-1 injection shape still
      fails closed. Confirm the coverage-boundary statement in the receipt
      matches the task set the code actually generates.
    - >-
      CHECK (b), D-705-2. Diff verify_derivation_v2.py against the committed
      verify_derivation.py yourself and confirm the change is the single
      sys.modules line plus provenance text and nothing else. Re-run it and
      report the per-claim outcome, including C0, from your own execution.
    - >-
      SUPERSESSION AND IMMUTABILITY. Confirm by `git diff --name-status` that no
      BATCH-001 or BATCH-002 committed artifact was modified in place, and that
      each new file names what it supersedes.
    - >-
      PROVENANCE AUDIT. Confirm every one of the seven producer artifacts
      carries a filled inference block, that each source-code artifact carries
      the comment-block stanza required by
      protocol-amendment-GOAL-AES-001-002, and that each covering manifest's
      artifact_provenance digests match the committed bytes you recompute.
      Report any gap as a completion-gate defect. Record your OWN inference
      block, and state plainly that under the 0137a051 amendment your
      independence is in SESSION and NOT in MODEL, and that this blocks any
      goal-closure attestation from your session.
    - >-
      Every literature statement you make is UNVERIFIED-FROM-MEMORY and must be
      marked as such at the point of use. Two agreeing recollections are not a
      citation.
    - >-
      Do not repair, edit, extend or re-run producer artifacts to make them
      pass. Defects are reported, not fixed. Write only under this task's own
      directory.
    - >-
      Change no official state. Propose no hypothesis status, create no ledger
      record, promote nothing to knowledge, and assign NO evidence strength —
      those are the Coordinator's transition in TASK-20260801-805.
    - >-
      Distinguish absence of evidence from impossibility, and infrastructure
      failure from mathematical result (AGENTS.md rule 5). Everything here is
      TOY SCALE and none of it is crypto-scale evidence.
  deliverables:
    - validation_report.yaml
    - od1_and_gate_review.md
    - er6_closeout_review.md
  artifact_paths:
    - coordination/goals/GOAL-AES-001/batches/BATCH-003/tasks/TASK-20260801-804/validation_report.yaml
    - coordination/goals/GOAL-AES-001/batches/BATCH-003/tasks/TASK-20260801-804/od1_and_gate_review.md
    - coordination/goals/GOAL-AES-001/batches/BATCH-003/tasks/TASK-20260801-804/er6_closeout_review.md
  archived_by: TASK-20260801-805
  inference:
    policy: review-adversarial
    requested_policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
    standing_basis: >-
      inference-amendment commit 0137a051eb5828789eb267fa83c8278086578d4c. This
      session supplies SESSION independence and NOT MODEL independence, and
      therefore cannot supply a goal-closure attestation.
  budget:
    wall_clock_seconds: 1500
    memory_gb: 4
    maximum_runs: 8
  budget_basis: >-
    Calibrated against MEASURED consumption: the two prior validator tasks
    actually consumed 1071 s and 1375 s. Set at the top of that measured range,
    not above it: this package is six artifacts against BATCH-002's nine, but
    the validator must independently re-run a redesigned gate, independently
    recompute a graph diameter and independently re-inject a coverage fault.
  completion_gate:
    - >-
      The snapshot receipt is confirmed against Git, or the task stops and
      reports an evidence-integrity failure.
    - >-
      Two verdicts are issued in two physically separate files, and
      validation_report.yaml carries them side by side with NO combined verdict.
    - >-
      od1_and_gate_review.md reports the validator's OWN recomputed diameter,
      eccentricity distribution and realizing pair, with any discrepancy against
      the producer named as a defect.
    - >-
      od1_and_gate_review.md returns an explicit verdict on the OD-1 extension
      argument — follows / overstated / correctly declined — worked step by
      step, and states whether a graph fact was conflated with a statement about
      projections.
    - >-
      od1_and_gate_review.md confirms independently that the second null's
      entries are all nonzero, that the matrix is invertible, that its entries
      generate a proper subgroup, and that its (lambda,k) graph is NOT strongly
      connected, with the component structure reported; reports the validator's
      OWN readings for all three matrices; returns an explicit DISCRIMINATES
      yes/no verdict; and states whether the negated hypothesis is genuinely
      necessary to its step.
    - >-
      od1_and_gate_review.md confirms the predicted readings were pre-registered
      before measurement and that exactly one candidate second null was run, or
      reports the violation.
    - >-
      er6_closeout_review.md records the validator's OWN re-creation of the
      regime-confined fault, its independent confirmation by ciphertext
      comparison, the scored outcome under mutation_control_v3.py, and
      confirmation that detection occurred through an executed comparison.
    - >-
      er6_closeout_review.md reports an attempt at a FURTHER coverage escape on
      a previously unexamined axis, with its outcome stated either way, and
      reports the validator's own no-op-mutant and H-1-shape regression checks.
    - >-
      er6_closeout_review.md reports the validator's own diff and re-run of
      verify_derivation_v2.py including C0's outcome.
    - >-
      validation_report.yaml lists every defect with a severity, confirms or
      denies an inference block and amendment-002 provenance in each of the
      seven producer artifacts with digests recomputed, carries the validator's
      own inference block with the session-not-model independence statement,
      asserts no official state change, and assigns no evidence strength.
  return_format: >-
    The three artifacts, plus a plain statement of: whether the OD-1 extension
    follows; whether the redesigned gate DISCRIMINATES on the validator's own
    re-run; and whether the ER-6 fault is now detected and what further coverage
    escape, if any, the validator found.
