handoff:
  id: TASK-20260823-744c38
  from: coordinator
  to: coordinator
  objective: Snapshot-archive the BATCH-f2341e producers so independent review reads committed state.
    Stage EXACTLY the declared paths, commit, and record every path_sha256. Do not interpret the producers'
    results and do not change any hypothesis or goal status -- this is the snapshot archive, not the ledger
    archive.
  uncertainty_reduced: Whether the producers' artifacts are durable and hash-pinned for review.
  inputs:
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-f2341e/dispatch_queue.json
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-f2341e/tasks/TASK-20260823-d1cb76
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-f2341e/tasks/TASK-20260823-01d3d9
  constraints:
  - Stage ONLY the explicitly declared paths. Never `git add -A` -- that swept a live reviewer's in-flight
    file into an unrelated commit three times in GOAL-ECQ-001.
