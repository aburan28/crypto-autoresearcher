    findings to a still-blind reviewer via git log in GOAL-ECQ-001 (BI-1).
  - Record path_sha256 for every archived path; the archive binds to CONTENT first.
  - Do not change hypothesis or goal status. That is the ledger archive's job, after review.
  deliverables:
