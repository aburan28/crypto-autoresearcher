  artifact_paths:
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-f2341e/archives/TASK-20260823-744c38/receipt.yaml
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 1800
    memory_gb: 2
    maximum_runs: 10
  completion_gate:
  - every declared path hashed and recorded
  - commit sha and parent sha recorded
  - no status change made
  return_format: coordinator archive receipt only.
