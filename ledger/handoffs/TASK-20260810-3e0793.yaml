handoff:
  id: TASK-20260810-3e0793
  recorded_at: '2026-08-10'
  goal_id: GOAL-MD5-001
  question_id: RQ-MDFIVE-6870c1
  batch_id: BATCH-46254b
  task_card: coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/task-cards/TASK-20260810-3e0793.md
  role: executor
  from: coordinator
  to: executor
  objective: >-
    Discharge the RQ-MDFIVE-6870c1 implementation gate: pin TWO INDEPENDENT
    RFC 1321 implementations with exact provenance and version, validate BOTH
    against the RFC 1321 published test vectors, and record a hash-throughput
    measurement on each. The second implementation exists so that a collision
    certificate can be re-verified by code that did not produce it, which the RQ
    requires and which one implementation cannot do for itself.
  uncertainty_reduced: >-
    Whether this environment can compute MD5 correctly at all under two
    separately-sourced implementations, and at what rate. Until it can, no
    collision certificate produced here is checkable and no later collision
    budget has a unit to be expressed in.
  inputs:
    - >-
      RQ-MDFIVE-6870c1 constraint requiring a pinned implementation validated
      against the published test vectors before any search runs
    - >-
      RQ-MDFIVE-6870c1 constraint requiring collision certificates to be literal
      pairs re-verified independently
    - >-
      BCP-1, whose certificate format and charging convention this task must
      conform to
    - >-
      the RFC 1321 test-vector suite, taken from the RFC text itself and not
      from recollection
  constraints:
    - >-
      SC-1 FABRICATE NOTHING. No invented timing, measurement, throughput,
      citation, review verdict, model identifier or commit SHA. A field that is
      not yet knowable stays null and is named as such.
    - >-
      SC-2 CLAIM CEILING. Assert nothing about MD5 - no collision, no preimage,
      no complexity, no method ceiling, no obstruction, and no comparison
      against any published result in either direction. A throughput number is
      an engineering datum about this machine and is not a cryptanalytic result.
    - >-
      SC-3 UNVERIFIED FIGURES STAY MARKED. Every figure in RQ-MDFIVE-6870c1
      provenance is web-search excerpt not read in primary text, and none may be
      cited as authority in either direction.
    - >-
      SC-4 A failed, halted or exhausted search is a BUDGET OUTCOME about a
      solver and NEVER evidence about MD5 (AGENTS.md rules 5 and 8). A build
      failure or missing dependency is infrastructure signal and is reported as
      such.
    - >-
      SC-5 Anything not attempted is named OPEN AND UNATTEMPTED and is never
      recorded as tried, screened or negative.
    - >-
      SC-6 Change no hypothesis, question, experiment or goal status; approve no
      experiment; promote no knowledge; edit no committed record; record no
      attestation and no review verdict.
    - >-
      SC-7 Halt at the declared wall_clock_seconds and report the halt
      truthfully as infrastructure signal, naming the dropped work as scope
      rather than as an answer.
    - >-
      SC-8 Never select, configure, probe, contact or use Amazon Bedrock
      (AGENTS.md rule 16).
    - >-
      THE TWO IMPLEMENTATIONS MUST BE INDEPENDENT IN PROVENANCE, not two builds
      or two bindings of one source tree. Record for each: source and origin,
      exact version or commit, build or interpreter toolchain and version, and
      how independence was established. If genuine independence cannot be
      established with what is installed, say so and record the pair as NOT
      INDEPENDENT rather than describing it as independent - the whole point of
      the second implementation is destroyed by an unnoticed shared core.
    - >-
      VALIDATE BOTH against the full RFC 1321 published test-vector suite and
      record every vector, every expected digest and every observed digest in
      test-vector-report.json. A partial pass is a partial pass; do not
      summarise it as a pass.
    - >-
      MEASURE HASH THROUGHPUT for each implementation and record it with the
      exact command, input size, repetition count and machine description. This
      is the unit every later collision budget needs and no record in this
      campaign currently has one. Report it as a measurement of this machine
      under this toolchain, scoped accordingly, and never as a prediction of
      attack cost.
    - >-
      Write only under this task's directory. Do not write under knowledge/,
      under coordination/goals/GOAL-MD5-001/quarantine/, or anywhere in the
      concurrently-running TASK-20260810-bde128 write scope.
    - >-
      Do not read coordination/goals/GOAL-MD5-001/quarantine/ or any published
      collision path. This task needs the specification and the test vectors
      only, and a clean read history here is worth preserving.
    - >-
      Do not commit. TASK-20260810-5c819b snapshots these exact bytes before any
      reviewer reads them.
  deliverables:
    - >-
      implementation-pin.yaml recording both implementations with provenance,
      version, toolchain, and the independence determination stated honestly
    - >-
      test-vector-report.json recording every RFC 1321 vector with expected and
      observed digests for both implementations
    - >-
      a measured hash-throughput datum for each implementation with its exact
      command and machine description
  artifact_paths:
    - >-
      coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/tasks/TASK-20260810-3e0793/implementation-pin.yaml
    - >-
      coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/tasks/TASK-20260810-3e0793/test-vector-report.json
  archived_by: TASK-20260810-5c819b
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 450
    memory_gb: 4
    maximum_runs: 3
  completion_gate:
    - >-
      Two implementations are pinned with exact provenance, version and
      toolchain, and the independence determination is stated explicitly as
      established or not established.
    - >-
      Every RFC 1321 published test vector is recorded with its expected and
      observed digest for both implementations, and any mismatch is reported
      rather than summarised away.
    - >-
      A throughput measurement exists for each implementation with its exact
      command, input size, repetition count and machine description, scoped as a
      machine measurement and not as an attack-cost prediction.
    - >-
      Nothing was written outside this task's directory and nothing under
      quarantine/ was read.
    - >-
      No collision, preimage or complexity claim appears anywhere in the
      deliverables.
  return_format: >-
    A summary naming the two written paths, both pinned implementations with
    their provenance and the independence determination stated as established or
    not established, the per-vector pass or mismatch counts for each
    implementation, both throughput measurements with their exact commands and
    machine description, and a truthful halt statement if the declared budget
    was reached.
