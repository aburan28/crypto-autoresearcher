  constraints:
    - id: RT-1
      text: >-
        READ ONLY COMMITTED BYTES, at or before the TASK-20260923-e3b590
        commit. Do not read sibling reviewers' directories. Blindness is not
        lifted for you.
    - id: RT-2
      text: >-
        J4 IS EXACT, NOT STATISTICAL. For every (reference, pivot) pair in the
        P2 set, compute a_{k,0} and a_k from the archived op logs and the
        affine decomposition. Decide rank-increment against the earlier
        nonzero a_j. Write the exact predicted conditional hazard BEFORE you
        open pivot-hazards.json's h_k values for that pair, then compare. Report
        every mismatch individually. A mismatch is a replay defect until shown
        otherwise.
    - id: RT-3
      text: >-
        J5 RUNS THE ARCHIVED PIPELINE UNCHANGED on O1 and O2 (plan,
        proves_too_much). Import impl/ functions. Do not edit them. Declare O2's
        seed and every command. Compute O2's predicted invariant prefix length
        from column-order-D4.json BEFORE running. This is a verification
        computation authorized by DEC-20260923-4d7a19. It is not a trial, not
        an arm and not evidence about H-CERTBIN-a73f1c. It gets no RUN-id, and
        it writes only under your directory. At most 2 invocations for O2
        (one, plus one after an infrastructure failure), with at most 200
        instances each.
    - id: RT-4
      text: >-
        J8 NAMES THE NARROWEST STATEMENT. For each DR verdict and each prior
        part marked OVERTURNED in run-report.md, write the narrowest statement
        the archived evidence supports: tested curve, n, m, l, D, solver and
        granularity. Name every transfer assumption. For the "1 in R_4"
        observation, answer the resource_check question in terms: which theory
        takes this measurement as its HYPOTHESIS rather than as its
        refutation? If you think a follow-up proposal is warranted, file it as
        a recommendation with its minimal test. You file no ledger record.
    - id: RT-5
      text: >-
        NO NEW RULES. Where a frozen rule reads badly (for example, the P2-set
        definition), say so and state the reading the evidence supports.
        Changing a frozen decision rule after data needs a versioned
        protocol_amendment. That is the Coordinator's call, and it is never
        made inside a review.
    - id: RT-6
      text: >-
        REPORT ON J4, J5 AND J8 ONLY, with a verdict per joint. The Coordinator
        composes the round. Do not call a bounded failure an impossibility, and
        do not claim any ECDLP-level conclusion. The claim tier is toy, and
        parallel rho dominates.
    - id: RT-7
      text: >-
        DISCLOSED PRIOR (review-plan PD-R1). The review prior was written after
        the Coordinator had read the results, and it predicts your J4 finding
        specifically. Concurrence is therefore weak evidence. A J4 result that
        contradicts it is worth more, so look for one in earnest.
    - id: RT-8
      text: >-
        CITE WITH PROVENANCE. A recalled source is a pointer, never support.
        Challenge any load-bearing recalled citation in the run package or the
        idea by name.

