handoff:
  id: TASK-20260801-023
  from: coordinator
  to: coordinator
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-023
  objective: >-
    Freeze experiments/EXP-EQD-001/reading_rule.yaml - the branch set N-0, N-5, N-1 and
    exactly one of N-2, N-4, N-6 in the precedence order already frozen in the contract;
    the NUMERIC thresholds SUBSTITUTED from the archived CAL-1 outputs under THR-EQD-1; the
    certified delta and the certifying statistic evaluated under CERT-EQD-1; any statistic
    excluded under CAL-STOP-1 second_stop_leg with its MEASURED reason; and the
    attainability argument ATTAIN-RR-EQD-1 stating, for every band and every branch, WITH
    MEASURED CALIBRATION NUMBERS, that some achievable measurement lands there. IF NO DELTA
    ON THE FROZEN LADDER REACHES A 0.95 DETECTION RATE AT BOTH BIT SIZES, DO NOT FREEZE A
    READING RULE - record CAL-STOP-1, record NON-EXECUTION for the real arm, and name the
    repair.
  uncertainty_reduced: >-
    Whether the calibrated instrument has certified power against the pre-declared
    alternative class, and if so what the numeric decision thresholds are - or whether the
    apparatus is stopped before the real arm rather than after it.
  inputs:
  - experiments/EXP-EQD-001/specification.yaml
  - experiments/EXP-EQD-001/results/calib/null_replicate_statistics.json
  - experiments/EXP-EQD-001/results/calib/power_curve.json
  - experiments/EXP-EQD-001/results/calib/instrument_characterization.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/archives/TASK-20260801-022/snapshot_commit_receipt.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/archives/TASK-20260801-020/snapshot_commit_receipt.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/reviews/TASK-20260801-032/calibration_validation_report.yaml
  constraints:
  - >-
    DO NOT FREEZE A READING RULE AGAINST AN UNVALIDATED CALIBRATION. TASK-20260801-032
    must have returned ADMISSIBLE. On INADMISSIBLE, freeze nothing, record the defects, and
    return the calibration to the Executor as a scoped repair - an invalid calibration is
    not a stop rule firing and is not a result about any object.
  - >-
    SUBSTITUTION ONLY, NEVER SELECTION (ATS-1 clause 4). Every threshold must be traceable
    to a NAMED order statistic of a NAMED CAL-1 output - the 199th ascending of 200 for
    each one-sided statistic, and the [3rd, 398th] band of 400 for STAT-DUP. A number in
    this file that cannot be so traced is an integrity failure and fires N-0.
  - >-
    DO NOT CHANGE ANY STATISTIC, K, REPLICATE COUNT, QUANTILE, PLANT CONSTRUCTION, DELTA
    LADDER OR BRANCH STRUCTURE. Any such change is a versioned protocol_amendment, must be
    recorded BEFORE the real arm runs, must be justified on grounds independent of any real
    datum, and RESETS confirmatory status to exploratory_only.
  - >-
    THE ONE PERMITTED POST-CALIBRATION EXCLUSION is CAL-STOP-1 second_stop_leg - a
    statistic with a degenerate null distribution (zero variance, identically zero, or a
    threshold the largest-delta plant cannot exceed) is DECLARED UNATTAINABLE AND EXCLUDED
    with the measured reason recorded. A variable may never be excluded because it is
    inconvenient, and NO VARIABLE MAY BE ADDED AFTER CALIBRATION UNDER ANY CIRCUMSTANCES.
  - >-
    CERT-EQD-1 is a PREDICATE, not a choice. The certified delta is the SMALLEST delta on
    the frozen ladder whose measured CAL-2 detection rate is at least 0.95 at BOTH bit
    sizes for at least one of STAT-CHI-16 or STAT-CHI-64, tie-broken smallest delta first,
    then STAT-CHI-64 before STAT-CHI-16.
  - >-
    ATTAIN-RR-EQD-1 must cover, WITH MEASURED NUMBERS - N-2 (the measured probability a
    correct null reaches it, with the eight-test family-wise figure), N-4 (the measured
    CAL-2 detection rate at the certified delta at both cells), N-1 (the measured CAL-1
    STAT-DUP distribution and a concrete achievable defect that breaches the band), N-5 (a
    concrete achievable implementation for each of the three legs and the measured margin
    by which a correct implementation does not fire it), N-0 (reachability by construction
    with the wall-clock stop and the faithfulness control named), N-6 (a concrete route by
    which the two cells diverge), every rung of the resolution ladder (powered or declared
    unpowered with the n that would power it), and BOTH SIDES of every retained
    statistic's threshold with the measured number for each side.
  - >-
    UNDER CAL-STOP-1 THE DELIVERABLE IS THE RECORDED STOP. The named repairs are a larger n
    (a larger factor base) or a different statistic - NEVER a relaxed threshold and NEVER a
    weaker delta bar. A CAL-STOP-1 stop falsifies the APPARATUS, is never a result about
    any object, and is never a disposition about any hypothesis in either direction.
  - >-
    An incomplete calibration is reported incomplete. The reading rule is NOT frozen on a
    partial calibration; the batch records non-execution for the real arm.
  - >-
    Do not edit experiments/EXP-EQD-001/specification.yaml. Immutability is preserved by
    ADDITION - the reading rule is a separate file for exactly this reason.
  - Do not read the real arm's data, which does not exist, and do not authorize it. TASK-20260801-026 is that gate.
  - Report the calibration numbers as instrument constants, never as results about the Semaev map.
  - MAKE NO COMMIT; TASK-20260801-024 archives.
  - Every YAML file written must parse; prose containing a colon-space inside a block-sequence item must be a folded block scalar or quoted (CORR-20260801-002).
  deliverables:
  - experiments/EXP-EQD-001/reading_rule.yaml
  artifact_paths:
  - experiments/EXP-EQD-001/reading_rule.yaml
  archived_by: TASK-20260801-024
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 3600
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
  - >-
    Either reading_rule.yaml frozen with every branch, every numeric threshold traced to a
    named CAL-1 order statistic, the certified delta and certifying statistic from
    CERT-EQD-1, any CAL-STOP-1 exclusion with its measured reason, and ATTAIN-RR-EQD-1
    covering every band and branch with measured numbers; OR a recorded CAL-STOP-1
    non-execution with the measured detection rates and the named apparatus repair, and no
    reading rule frozen. No statistic added. No threshold untraceable. No real datum
    consulted.
