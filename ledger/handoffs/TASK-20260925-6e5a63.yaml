handoff:
  id: TASK-20260925-6e5a63
  created_at: '2026-09-25'
  created_by: coordinator
  from: coordinator
  to: coordinator
  goal_id: GOAL-ECDLP2M-001
  batch_id: BATCH-b67954
  lane: B
  review_required: false
  title: >-
    Snapshot-archive lane B exactly as returned plus the lane-B pre-review gate
    (ESC-B, A1, blind whitelist value grep), before any lane-B reviewer
  objective: >-
    Commit the lane-B producer's four R-FORM files exactly as returned, together with
    the lane-B pre-review gate files and this receipt, in ONE isolated
    content_at_commit commit, and bind their bytes by sha256. Record in the receipt
    the ESC-B escalation test, which fixes the lane-B review tier, and the blind
    whitelist value grep, so that no lane-B reviewer runs before both are committed
    (DEC-20260925-89573b R-FORM, R-TIERS, R-PREREVIEW-GATE).
  uncertainty_reduced: >-
    None about the mathematics; durability and custody of the object under review,
    the lane-B review tier fixed by rule before any reviewer runs, and a recorded
    blind-whitelist value grep before the blind re-derivation.
  inputs:
    - experiments/EXP-BINSTD-178742/specification.yaml
    - ledger/hypotheses/H-BINSTD-ce4f38.yaml
    - coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-b67954/design/TASK-20260925-46739d/proof-search-map-audit.yaml
    - coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-b67954/design/TASK-20260925-46739d/revision-worksheet.yaml
    - experiments/EXP-BINSTD-178742/specification.v1-frozen-64e8b013.yaml
    - coordination/review/binstd-20260925-b67954/review-plan.yaml
    - coordination/review/binstd-20260925-b67954/blind-inputs.yaml
    - ledger/handoffs/TASK-20260925-2e6b10.yaml
    - ledger/corrections/CORR-20260925-649e25.yaml
    - ledger/decisions/DEC-20260925-89573b.yaml
  read_scope:
    - experiments/EXP-BINSTD-178742/
    - ledger/hypotheses/H-BINSTD-ce4f38.yaml
    - coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-b67954/design/TASK-20260925-46739d/
    - coordination/review/binstd-20260925-b67954/
    - ledger/handoffs/TASK-20260925-2e6b10.yaml
    - ledger/corrections/CORR-20260925-649e25.yaml
    - ledger/decisions/DEC-20260925-89573b.yaml
    - coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-b67954/dispatch_queue.json
    - tools/research_dispatch.py
    - tools/validate_ledger.py
  read_scope_note: >-
    The top-level session also greps every file on the lane-B blind whitelist (as
    listed in coordination/review/binstd-20260925-b67954/blind-inputs.yaml, including
    the card, blind-inputs.yaml, and paper_fulltext.md if present), and reads the
    frozen v1 copy to hash it and for the plan's NO-FIRE-V1 line check. The gate
    sub-session reads the producer's v2 files, the grep record and the plan
    (R-PREREVIEW-GATE gate_session_independence). Excludes
    experiments/EXP-FROB-30006a/, experiments/EXP-QSP-70b731/runs/, the
    cursor/semaev-2015-audit-program-5b8b ref and PR #1377.
  constraints:
    - >-
      RUNS ALONE, after TASK-20260925-46739d returns and its lane claim is released;
      never concurrently with any other card or archive.
    - >-
      Order (R-PREREVIEW-GATE order_inside_each_snapshot_card): (1) the top-level
      session hashes the producer's four paths (pre-gate digests) and runs the R-FORM
      snapshot_checks. (2) It runs the ESC-B searches and the lane-B whitelist value
      grep and writes the mechanical record, gate-worksheet part 1. (3) ONE fresh
      Coordinator gate sub-session, under coordinator-orchestration-code, whose write
      scope is only its gate files, writes blind-inputs.amendment-A1.yaml and appends
      gate-worksheet part 2. (4) The top-level session greps A1 for every search term;
      any hit is a stop, and the gate sub-session rewrites. It also checks that each
      copied definition text is a byte-exact substring of the producer's revision
      worksheet. (5) It re-hashes the producer's four paths against the pre-gate
      digests and stops on any difference, a custody failure. (6) It makes one
      isolated commit and writes the receipt, with escalation_test and
      blind_whitelist_value_grep, verifies, pushes and refreshes the PR.
    - >-
      R-FORM snapshot_checks: before committing, check that the leading v1
      byte-length of ledger/hypotheses/H-BINSTD-ce4f38.yaml hashes to
      3b2b0ff1c612d593e8682ec5db49eea7a84b6337520fbe083bd6d842a2807f96 (the v1 length
      is that of the file bound by TASK-20260924-77d46f), and that
      experiments/EXP-BINSTD-178742/specification.v1-frozen-64e8b013.yaml still
      hashes to 64e8b013b17fb9d7aaab8be3bfe51fc148ec3011eca9e14b3bc21c28477acd3d.
      Stop on either mismatch: a custody failure, not a result.
    - >-
      Bind exactly the producer's four R-FORM paths
      (experiments/EXP-BINSTD-178742/specification.yaml;
      ledger/hypotheses/H-BINSTD-ce4f38.yaml;
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-b67954/design/TASK-20260925-46739d/proof-search-map-audit.yaml;
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-b67954/design/TASK-20260925-46739d/revision-worksheet.yaml)
      PLUS coordination/review/binstd-20260925-b67954/blind-inputs.amendment-A1.yaml,
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-b67954/archives/TASK-20260925-6e5a63/gate-worksheet.yaml
      and the snapshot receipt, and nothing else, in ONE isolated content_at_commit
      commit. Stage them one by one; git add -A is forbidden. The producer's four
      paths are hashed before the gate work starts and must be unchanged at commit.
    - >-
      ESC-B (lane-B plan tier.escalation_test). It fires when the revised text states
      that GGMP Lemma 3.3 (eprint 2020/1315) fails as stated, or makes any TB-1
      statement. It is run on the exact bytes this card binds: the sha256 of each
      searched file (the producer's four paths) is recorded and must equal the
      receipt's path_sha256, and if any file changes after the test, the test is
      re-run. For each term of the plan's ggmp_group and tb1_group and each of the
      four files, the top-level session runs one case-insensitive search (rg -n -i
      --fixed-strings '<term>' <file>; terms marked re: use rg -n -i -e '<re>') and
      records every command verbatim with its hit count, and each hit as file:line,
      in gate-worksheet part 1. The gate sub-session reads each hit with three lines
      of context either side and gives it exactly one classification from the plan's
      reading_rule (FIRE-GGMP, FIRE-TB1, NO-FIRE-V1, NO-FIRE-ROUTING, NO-FIRE-SCOPE)
      in part 2. ANY DOUBT RESOLVES TO FIRE.
    - >-
      The receipt's escalation_test block carries: test_id ESC-B; plan_id
      REVIEW-BINSTD-20260925-b67954; evaluated_at (UTC); evaluated_by; files_searched
      with sha256 (equal to path_sha256); every command verbatim with per-file hit
      counts; per hit, file:line, the classification and a one-sentence reading that
      quotes at most the trigger words and NO numeral or value; the gate-worksheet
      path and its sha256; and the result FIRED or NOT_FIRED (R-PREREVIEW-GATE: fires
      or does not fire). It is copied from the gate worksheet, the classifications and
      readings from part 2.
    - >-
      Blind whitelist value grep (lane-B plan blind_forward_precondition), by the
      top-level session: grep EVERY whitelisted file (including the card,
      blind-inputs.yaml, and paper_fulltext.md if present; A1 is grepped at step (4))
      for EACH value v2 freezes for the re-derived quantities: the six census values,
      the six primary-row r strings and k values, every c2pnb value, every Q3 group
      order and prime factor, and every NF value. Part 1 records the raw grep as a
      command template, with each hit as file:line and a term identifier (NF id or
      quantity name plus the v2 field path it was read from), never a value. Part 2
      classifies each hit PRIMARY-DATUM (retain), COINCIDENTAL (named; retain) or
      ANSWER (a stated order, factorisation, group order, admissibility verdict,
      divisibility verdict or d_min). Every ANSWER hit is removed by an additive
      whitelist exclusion in A1 or, if the file cannot be excluded, recorded as a
      DISCLOSED LEAK, and J5's agreement on that quantity is then recorded as not
      blind. The receipt's blind_whitelist_value_grep records the hits by file:line
      and class, without values, copied from part 2.
    - >-
      A1 (coordination/review/binstd-20260925-b67954/blind-inputs.amendment-A1.yaml),
      by the gate sub-session, value-free, per the lane-B plan's
      transfer_to_the_blind_card: it carries only the NF ids and their definition
      texts, copied verbatim from the producer's revision worksheet
      (newly_frozen_values), and records 'definition not separable' for any
      definition it cannot separate from its answer, or that contains a value. It
      also carries every whitelist exclusion, and every disclosed leak by file:line,
      that the grep orders. It carries no grep command, no search term and no
      escalation reading.
    - >-
      gate-worksheet.yaml has two append-only parts. The top-level session writes
      part 1; the gate sub-session then appends part 2 and never edits part 1. Part 2
      cites v2 locations by file:line, never quoting a value. It sits under the
      BATCH-b67954 directory, which the lane-B plan puts in blind_from, so it is never
      whitelisted. The file
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-b67954/design/escalation-test-lane-b.yaml
      is NOT used.
    - >-
      Every gate file is ALWAYS written, so each declared artifact exists whatever the
      grep finds. When nothing is found the file says 'no hits, no change' and is
      still committed.
    - >-
      The gate sub-session is never the lane's producer, never a reviewer of either
      lane, and never later that lane's composer (TASK-20260925-3c9c56). It reads the
      producer's v2 files, the grep record and the plan. Its judgments (the ESC-B
      reading, the hit classes and the 'definition not separable' calls) are
      Coordinator procedure, not review verdicts, and they move no key of the plan.
      The top-level session itself runs only the greps, hashing, verbatim checks and
      git, and records the gate's outputs verbatim.
    - NEVER edit a producer file while staging. A malformed file is committed as malformed and reported.
    - >-
      Any file the producer wrote outside its declared artifact_paths is named in the
      receipt as a scope finding and NOT staged.
    - >-
      Merge origin/main first; merge, never rebase. Record the base commit checked and
      the merge outcome in the receipt.
    - >-
      If tools/validate_ledger.py reports a NEW error on the version-2 specification
      or on the hypothesis's version_2 block, or tools/research_dispatch.py refuses
      the layout, stop and report. Lane B has no form (ii) (R-FORM stop_conditions).
    - >-
      The commit message names TASK-20260925-6e5a63 and every archive record id
      literally, and states no value and no verdict. Neither it nor the PR text
      carries a search term or any value.
    - >-
      No lane-B reviewer (TASK-20260925-104f6d, TASK-20260925-2333ea,
      TASK-20260925-2e6b10) is dispatched before this snapshot, with its gate files
      and its escalation_test block, is committed, verified and pushed. If ESC-B
      fires, the three cards are dispatched as validator-breakthrough,
      red-team-breakthrough and validator-breakthrough at review-breakthrough at max,
      unedited, each launch prompt citing 'ESC-B FIRED per
      REVIEW-BINSTD-20260925-b67954'; a lane-B review at review-adversarial after a
      fired test is a forbidden silent downgrade (R-TIERS). The plan's alternative of
      recording in A1 after the snapshot commits does not arise, because the gate
      precedes the commit.
    - >-
      A killed gate sub-session is continued under R-CONTINUATION by a fresh session
      of the same role and policy, from the gate files' own partial content and its
      declared inputs only (DEC-20260925-89573b NA-3).
    - >-
      No AUXIN census value, minimising divisor, escalated-curve list, control
      integer or reviewer-computed value; no RUN-FROB-627924 value; no
      EXP-FROB-30006a outcome; nothing from experiments/EXP-QSP-70b731/runs/; no
      c2pnb value transcribed from the TASK-20260924-624abf report.
    - ZERO RUNS.
  deliverables:
    - >-
      snapshot-receipt.json with commit_sha (null by convention), parent_sha,
      base_commit_checked, merge_outcome, the pre-gate digests of the producer's four
      paths, the R-FORM snapshot_checks results, path_sha256, record_ids,
      escalation_test, blind_whitelist_value_grep and any scope findings
    - >-
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-b67954/archives/TASK-20260925-6e5a63/gate-worksheet.yaml
      (part 1 by the top-level session, part 2 appended by the gate sub-session)
    - >-
      coordination/review/binstd-20260925-b67954/blind-inputs.amendment-A1.yaml (the
      gate sub-session, value-free)
  artifact_paths:
    - coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-b67954/archives/TASK-20260925-6e5a63/snapshot-receipt.json
    - coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-b67954/archives/TASK-20260925-6e5a63/gate-worksheet.yaml
    - coordination/review/binstd-20260925-b67954/blind-inputs.amendment-A1.yaml
  archived_by: TASK-20260925-6e5a63
  archive:
    kind: snapshot
    source_task_ids: [TASK-20260925-46739d]
    record_ids:
      - H-BINSTD-ce4f38
      - EXP-BINSTD-178742
      - IDEA-20260922-261004
      - IDEA-20260922-b19793
      - IDEA-20260922-dacfc2
      - BATCH-b67954
      - GOAL-ECDLP2M-001
      - REVIEW-BINSTD-20260925-b67954
      - TASK-20260925-46739d
      - TASK-20260925-6e5a63
    binding_mode: content_at_commit
    binding_mode_note: >-
      The hypothesis and the version-2 specification have a life after this archive
      (later status advances), so content_at_commit reads their bytes, and the gate
      files' bytes, from this archive's own commit (DEC-20260924-f0a9c7 R3;
      DEC-20260925-89573b R-FORM and R-PREREVIEW-GATE). commit_sha, parent_sha and
      path_sha256 are filled at archive time.
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: true
    fallback_note: >-
      Runtime inheritance: Cursor Cloud Agent subagents launched with model inherit
      are served by the session model claude-opus-5-5-max (max effort); backend
      substitution only; served effort not below policy; model_verified false
    degraded_allowed: false
    independent_session_required: false
  gate_sub_session:
    role: coordinator
    sessions: one fresh Coordinator gate sub-session
    writes_only:
      - coordination/review/binstd-20260925-b67954/blind-inputs.amendment-A1.yaml
      - coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-b67954/archives/TASK-20260925-6e5a63/gate-worksheet.yaml (part 2, append-only)
    reads: >-
      the producer's v2 files, gate-worksheet part 1 and
      coordination/review/binstd-20260925-b67954/review-plan.yaml
    never: >-
      TASK-20260925-46739d's session, a reviewer of either lane, or later
      TASK-20260925-3c9c56's session
    inference:
      policy: coordinator-orchestration-code
      reasoning_effort: null
      fallback_allowed: true
      fallback_note: >-
        Runtime inheritance: Cursor Cloud Agent subagents launched with model inherit
        are served by the session model claude-opus-5-5-max (max effort); backend
        substitution only; served effort not below policy; model_verified false
      degraded_allowed: false
      independent_session_required: true
    budget:
      wall_clock_seconds: 3600
      memory_gb: 4
      maximum_runs: 0
    budget_note: >-
      Separate from this card's archival budget, which covers the top-level
      session's greps, hashing, verbatim checks and git. The runtime kills a subagent
      after about 1800 s of activity; R-CONTINUATION governs.
  budget:
    wall_clock_seconds: 1800
    memory_gb: 1
    maximum_runs: 0
  completion_gate:
    - the producer TASK-20260925-46739d returned and its lane claim is released
    - >-
      R-FORM snapshot_checks pass: the v1 prefix of ledger/hypotheses/H-BINSTD-ce4f38.yaml
      hashes to its v1 prefix digest and the frozen v1 copy to its must_hash_to value
    - >-
      gate-worksheet part 1 written by the top-level session, part 2 appended and A1
      written by one fresh gate sub-session, every gate file always written; A1 greps
      clean for every search term and each copied definition text is a byte-exact
      substring of the producer's revision worksheet
    - >-
      escalation_test and blind_whitelist_value_grep recorded in the receipt, copied
      from the gate worksheet, with files_searched digests equal to path_sha256
    - the producer's four paths re-hashed unchanged against the pre-gate digests
    - >-
      one commit changing exactly the declared set (the producer's four paths, A1, the
      gate worksheet and the receipt); path_sha256 recomputed immediately before it;
      receipt verified by tools/research_dispatch.py (content_at_commit)
    - validate_ledger.py with no new error attributable to the staged paths
    - branch pushed and PR refreshed before any lane-B reviewer is dispatched
    - no producer file edited, zero runs
  dispatch_preconditions:
    - archived_by is bound before dispatch (AGENTS.md standing precondition 1)
    - every declared input is committed and pushed (standing precondition 2)
    - >-
      a task claim via python3 tools/goal_lanes.py claim <queue> <TASK> --as <addr>
      --ttl-minutes N --publish before launch, released with --outcome on return
      (standing precondition 3)
    - archived_by bound (SELF)
    - >-
      Standing precondition 2 as it applies to an archive: the committed base is
      fetched and merged first; the producer files this card exists to commit are
      uncommitted by construction and must exist in the working tree.
    - TASK-20260925-46739d RETURNED; this archive runs after it, never concurrently
    - >-
      TASK-20260925-d2efb5 verified, so the lane-B plan, its blind inputs, the frozen
      v1 copy and CORR-20260925-649e25 are committed and pushed
    - >-
      The gate sub-session is launched only after gate-worksheet part 1 is written,
      in a fresh session that is not TASK-20260925-46739d's, not a reviewer's of
      either lane and not TASK-20260925-3c9c56's
    - RUNS ALONE
  runs_launched: 0
