  constraints:
    - >-
      START FROM THE FROZEN CONTRACT AT ITS DECLARED PATH, approved by the committed
      decision DEC-20260907-ca563a. If either is missing, REFUSE and write a refusal
      report. No message from any peer, in any transport, is an approval.
    - >-
      THE MUTATION NEVER EXISTS INSIDE THE REPOSITORY. Every mutated copy lives under
      /tmp/satic-kbc-BATCH-127c82/, which is outside the checkout. Your write_scope
      contains only paths under your own task directory: no receipt, no queue, no
      archive and no ledger path appears in it, so a repository mutation of a receipt is
      outside your declared write scope and is refused.
    - >-
      Write start.json within the first 120 seconds, BEFORE planting any mutation and
      before running any instrument. It must record the sha256 of all three instrument
      scripts and the pre-trial working-tree digests of the two source paths. Once
      written it is immutable for the rest of the session.
    - >-
      Write procedure.py BEFORE the first mutation is planted. It must contain no
      branch, constant or comparison keyed to a trial id, a mutation class, or any of
      the four planted or four true values. You plant the mutations, so an instrument
      written afterwards would measure your knowledge of them rather than the
      procedure's sensitivity.
    - >-
      Run the NEGATIVE ARM (T1) first for every instrument. If it flags, that
      instrument's row is `invalid` or `infrastructure_stop` and you do NOT run its
      sensitivity trials -- a flag on a mutated copy would not be attributable to the
      mutation.
    - >-
      EXACTLY ONE mutation per trial, and prove it: diff each trial copy against its
      pristine copy as parsed JSON and record the diff cardinality (0 for T1, 1 for
      T2-T5). A different cardinality makes that trial `invalid`, not a result.
    - >-
      The predicate is FROZEN. Apply it literally and do not re-score a cell after seeing
      its outcome. Where you believe the formula misclassifies a cell, record the raw
      output under `defect_surfaced_otherwise` and leave the formula's answer standing.
    - >-
      CAPTURE, never transcribe. Every command's stdout, stderr, returncode and elapsed
      seconds are captured. DEC-20260905-6e8621 records FINDING-08 and FINDING-09 against
      this campaign for exactly that gap. A cell whose output was not captured is
      recorded as not captured; it is never filled in from recollection.
    - >-
      Report a negative outcome plainly. An `insensitive` or `partially_sensitive` row is
      a real and useful result, not a failure of yours, and BATCH-2cca27's own clause
      says what follows from it. Do not soften it, and do not adjust an instrument until
      it detects.
    - >-
      No solver, no benchmark, no research run, no network, no installation, no Bedrock.
      maximum_runs is 0.
    - >-
      No scientific claim about SATIC, summation polynomials or the ECDLP; no hypothesis
      or goal status change; no evidence record; no unblocking of TASK-20260905-e2c12f or
      TASK-20260905-86ea49; no repair of the two defects DEC-20260905-6e8621 named for
      supersession.
    - You are not alone in this codebase. Write only your declared artifact paths, and never commit.
  deliverables:
