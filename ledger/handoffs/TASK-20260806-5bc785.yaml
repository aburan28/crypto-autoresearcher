handoff:
  id: TASK-20260806-5bc785
  from: coordinator
  to: validator
  objective: >-
    Independently verify run-set validity before any interpretation: expected
    run count (2), schema-complete manifests, seed integrity (no
    duplicated/missing seeds among 201-205 plus any documented failure
    substitutions), raw/summary agreement, control comparability across all
    seven required controls, planted-control recovery, permutation-stability
    correctness, and that the reported decision_branch is the one
    spec.decision_table actually implies from the raw data (recompute, do not
    trust the summary alone).
  uncertainty_reduced: >-
    Whether the run package is valid evidence at all, and if so what
    decision_branch it actually supports.
  inputs:
  - Verified snapshot TASK-20260806-4455ac
  - experiments/EXP-ECTD-001/specification.yaml (frozen, approved)
  constraints:
  - >-
    independent_session: true REQUIRED; do not originate or edit the run
    artifacts under review.
  - "Verdict: valid | invalid | incomplete, plus the recomputed decision_branch."
  - >-
    An invalid or incomplete run set is an evidence-integrity finding, not a
    negative result on H-ECTD-001 -- state concrete defects if found.
  - >-
    Explicitly check: does the planted CTRL-PLANTED-OUTLIER control actually
    get recovered as an outlier in the raw data? If not, the correct verdict
    is instrument_void regardless of what any summary claims.
  - >-
    Explicitly check: is any claimed outlier permutation-stable per
    TAIL-ECTD-PERM-STABLE, using the raw permutation table, not a stated
    conclusion?
  - >-
    Explicitly check: no trapdoor / crypto-scale / exponent-improvement
    language appears in any artifact (claim_tier toy).
  - Do not edit producer or snapshot artifacts; write findings only.
  - Record policy/model/independence metadata.
  deliverables:
  - validation_report.yaml
  - validation_notes.md
  artifact_paths:
  - coordination/goals/GOAL-ECTD-001/batches/BATCH-fca4e2/reviews/TASK-20260806-5bc785/validation_report.yaml
  - coordination/goals/GOAL-ECTD-001/batches/BATCH-fca4e2/reviews/TASK-20260806-5bc785/validation_notes.md
  archived_by: TASK-20260806-411ffd
  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
    resolved_model_id: claude-sonnet-5
    fallback_used: true
    fallback_reason: >-
      this harness cannot resolve policy aliases; session independence is
      satisfied, model independence is not claimed
    model_verified: false
  budget:
    wall_clock_seconds: 2700
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
  - Verdict recorded with rationale tied to raw artifacts, not summaries
  - independent_session: true and model metadata recorded
  - >-
    Recomputed decision_branch stated explicitly, matching or contradicting
    the producer's claim
