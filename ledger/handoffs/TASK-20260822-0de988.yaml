handoff:
  id: TASK-20260822-0de988
  from: coordinator
  to: validator
  objective: Independent validator review of the BATCH-e0caa5 producer outputs at the snapshot commit.
    Work ONLY the joints assigned to you in review_plan. Do not review the joints owned by the other
    reviewer -- coverage, not correlation.
  uncertainty_reduced: whether the batch claims survive adversarial scrutiny at the joints that carry
    them
  inputs:
  - coordination/goals/GOAL-ECRANK-002/batches/BATCH-e0caa5/archives/TASK-20260822-e7c486/receipt.yaml
  - coordination/goals/GOAL-ECRANK-002/batches/BATCH-e0caa5/tasks/TASK-20260822-a7a9e8
  - coordination/goals/GOAL-ECRANK-002/batches/BATCH-e0caa5/tasks/TASK-20260822-8df232
  - ledger/hypotheses/H-ECRANK-f2a2f7.yaml
  - experiments/EXP-ECRANK-e1e30e/
  constraints:
  - Read the SNAPSHOT COMMIT, not the live worktree.
  - You may not read the other reviewer's report in this round (review_plan.blindness.mutual).
  - You change no research status and no raw artifact.
  - Record the model that actually answered alongside the requested policy. If this session cannot
    honour review-adversarial, REFUSE rather than downgrade.
  deliverables:
  - coordination/goals/GOAL-ECRANK-002/batches/BATCH-e0caa5/tasks/TASK-20260822-0de988/validation_report.yaml
  artifact_paths:
  - coordination/goals/GOAL-ECRANK-002/batches/BATCH-e0caa5/tasks/TASK-20260822-0de988/validation_report.yaml
  archived_by: TASK-20260822-0e9c74
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 1800
    memory_gb: 2
    maximum_runs: 12
  completion_gate:
  - every assigned joint answered with a verdict and the artifact that supports it
  - review attestation block present naming requested policy and resolved model
  return_format: role review report per the role contract
  review_plan:
    claim_under_review: 'As the producers state it: (a) the maximum rank over Q reached by a Mestre-style
      construction within budget, certified by exhibited independent points; (b) the k = 3 and k
      = 4 twist-family optima on the augmented pool; (c) the base rank that reaching 31 at k = 3
      would require, derived from measured coset structure.'
    coordinator_prior: 'The Coordinator expects P1 and P2 to HOLD and P3 to HOLD: the Mestre construction
      should beat rank 4, the k = 3 optimum should rise above 20, and it should still fall short
      of 31. Recorded before any reviewer runs so that a concurring review is distinguishable from
      a review that agreed with what the Coordinator already believed. If the producers return 31
      at k = 3 the prior is WRONG and that is the more interesting outcome.'
    joints:
    - joint: Every rank attributed to a Mestre-constructed curve is a certified LOWER BOUND from
        exhibited points, never an analytic rank, a Selmer bound, or an ellrank r_high.
      assigned_to: TASK-20260822-0de988
      attack_plan: 'Take each curve the producer claims has rank r and independently recompute: that
        r points are exhibited, that each lies on the curve in exact arithmetic, and that the r x
        r height pairing matrix is nonsingular. Where the producer cites ellrank output, check whether
        it used r_low or r_high -- GOAL-ECRANK-001 saw ellrank return [1,1,0,[]], a proven bound
        with NO point, which must contribute zero here.'
      breaking_artifact: a claimed rank with fewer exhibited independent points than claimed
    - joint: The reported k = 3 optimum is the true maximum over the enumerated space, i.e. the subspace
        enumeration is complete and the scoring indexes the curve it says it does.
      assigned_to: TASK-20260822-0de988
      attack_plan: 'Re-derive the k = 3 optimum on the COMMITTED pool blind (see blind_rederivation)
        and require it to equal 20. Then attack the indexing directly: GOAL-ECRANK-001 shipped a
        build in which XOR cancellation put 16 transported points on isomorphic-but-different models,
        caught only by the exact verifier. Check the transport factor t is applied wherever a coset
        representative shares primes with a class.'
      breaking_artifact: a coset whose recomputed score differs from the reported one
    - joint: 'The claimed base rank needed for 31 at k = 3 is MEASURED, not assumed: specifically
        that the non-maximal-class contribution is separable from the maximal class.'
      assigned_to: TASK-20260822-de2fa2
      attack_plan: Attack separability directly. Find two cosets with the same maximum twist rank
        and materially different totals; if they exist, the extrapolation behind the claimed ceiling
        is invalid and the number must be withdrawn. Also check the claim is not fitted on the same
        cosets it is then validated on.
      breaking_artifact: two equal-max cosets with different totals, or a fit validated on its own
        training set
    - joint: Any degree-8 result is reported as WEAKER IN KIND than the held degree-32 exact certificate,
        not as a strict improvement.
      assigned_to: TASK-20260822-de2fa2
      attack_plan: At k = 3 the eigenspace argument certifies at most 8, so 31 must come from within-class
        multiplicities and therefore from numerically evaluated height regulators. Challenge any
        framing that presents a smaller degree as a strictly better result while silently trading
        an exact certificate for a numerical one. Check the cost table states both axes.
      breaking_artifact: a deliverable claiming improvement on degree while hiding the certificate
        downgrade
    blindness:
      mutual: true
      lifted_for: []
      rationale: null
    proves_too_much:
      objects:
      - the committed GOAL-ECRANK-001 pool at k = 3, whose optimum is KNOWN to be 20 -- a pipeline
        returning more on unchanged inputs has a scoring bug, not a discovery
      - a configuration built only from twists whose exhibited point sets are EMPTY (ellrank proved
        a bound but found no point), whose certified total is known to be 0
      - a configuration whose exhibited points are torsion, e.g. a 2-torsion point (x,0), whose certified
        contribution is known to be 0 under the Mazur check
      failure_signature: On each object the pipeline must return the known value. Any nonzero certified
        rank on the second or third object, or anything above 20 on the first with unchanged inputs
        and support, means the scorer is measuring itself.
      assigned_to: TASK-20260822-0de988
    blind_rederivation:
      required: true
      quantity: 'the k = 3 optimum: the maximum over all cosets of all 3-dimensional subgroups V
        of the support group of sum over the 8 classes of the number of exhibited independent non-torsion
        points on the corresponding quadratic twist'
      parameters: the committed pool at experiments/EXP-ECRANK-e1e30e/runs/RUN-ECRANK-e1e30e-001/pool.json
        with support [-1,2,3,5,7,11,13]
      blind_from:
      - coordination/goals/GOAL-ECRANK-002/batches/BATCH-e0caa5/tasks/TASK-20260822-8df232
      - experiments/EXP-ECRANK-e1e30e/source/scan_pool.py
      - experiments/EXP-ECRANK-e1e30e/source/twist_family.py
      - experiments/EXP-ECRANK-e1e30e/runs/RUN-ECRANK-e1e30e-001/subspace_scan.json
      assigned_to: TASK-20260822-0de988
    procedure_deviations: []
