handoff:
  id: TASK-20260823-416e78
  from: coordinator
  to: executor
  objective: Search TUPLE SPACE, not parameter space. Regenerate Mestre's construction over many small
    integer 6-tuples, measure each family's lower envelope of minimal-model naive height, and rank families
    by ENVELOPE rather than by generic rank. Report the best (certified rank, height) reached against
    the intermediate benchmark 79.329 and against the r>=12 cell read from the frozen frontier.
  uncertainty_reduced: Whether tuple choice moves the height envelope, and how far.
  inputs:
  - ledger/hypotheses/H-ECQ-8b600d.yaml
  - ledger/goals/GOAL-ECQ-002/goal.yaml
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-541940/review_plan.yaml
  - coordination/goals/GOAL-ECQ-002/baseline/frontier_20260823.json
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-f2341e/tasks/TASK-20260823-01d3d9/pipeline/
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-da59ec/tasks/TASK-20260823-72505a/validation_report.md
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-da59ec/tasks/TASK-20260823-eaf799/redteam_report.md
  constraints:
  - READ every frontier value FROM frontier_20260823.json AT RUN TIME. Do NOT transcribe it. Hand-copying
    put two of three pre-declared incumbents wrong last batch (CORRECTION-predeclared-target-values.md).
  - REUSE the BATCH-f2341e pipeline and the BATCH-da59ec validator's independent re-derivation of Mestre's
    construction. Do not rewrite either.
  - 'Compute each candidate family''s Shioda-Tate ceiling FROM ITS OWN FIBRE CONFIGURATION. The generic
    K3 bound overstated Nagao''s by 3 (validator F1: the true value is 15, an I_4 at infinity costs 3).'
  - 'RUN THE REQUIRED NULL, owed since BATCH-f2341e and never run: a LOW-generic-rank family of the same
    shape through the identical pipeline. If low-rank families give the same envelopes, rank buys nothing
    and the whole rank-versus-size premise collapses. That is a finding, not a failure.'
  - EVERY rank is a certified LOWER bound from exhibited points verified in exact arithmetic.
  - Exact height gate FIRST; Mestre-Nagao ordering only within the admissible set, if at all.
  - A flat envelope-vs-tuple relationship FALSIFIES the lever and is a complete result. Report it plainly.
  - DO NOT submit anything to the ICARM endpoint.
  - Failing to beat 69.339 while beating 79.329 is BOTH a success of the method and a shortfall against
    the board. Report it as both; do not round either way.
  - A timeout or crash is an infrastructure outcome, never negative mathematical evidence.
  - Write ONLY inside your write_scope. Never commit.
  deliverables:
  - 'tuple_envelope_scan.json: per tuple, the measured envelope, intercept, slope, fitted arms, surface
    degree and its own Shioda-Tate ceiling, plus the null family''s results'
  - 'best_candidates.json: best (certified rank, naive height) curves with exhibited points, ICARM format'
  - 'report.md: does tuple choice move the envelope, by how much, and what is the best reached against
    79.329 and against the r>=12 cell'
  artifact_paths:
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-541940/tasks/TASK-20260823-416e78/tuple_envelope_scan.json
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-541940/tasks/TASK-20260823-416e78/best_candidates.json
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-541940/tasks/TASK-20260823-416e78/report.md
  archived_by: TASK-20260823-1f16e5
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 3600
    memory_gb: 4
    maximum_runs: 80
  completion_gate:
  - frontier values READ from the frozen file, not transcribed
  - envelope measured for many tuples, with the envelope-vs-tuple relationship reported
  - each family's ceiling computed from its own fibre configuration
  - THE REQUIRED NULL RUN and reported
  - every certified rank backed by that many exhibited points in exact arithmetic
  - nothing submitted to ICARM
  return_format: 'executor execution report: what was run, what was measured, what failed.'
