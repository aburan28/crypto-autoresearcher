handoff:
  id: TASK-20260930-be6bbf
  created_at: '2026-09-30'
  from: coordinator
  to: executor
  title: >-
    Implement and run the frozen EXP-FROB-5e15ed panel once; record
    observations; do not change the prediction
  objective: >-
    Implement and run ONLY the frozen EXP-FROB-5e15ed panel. Record
    observations. Do not change the preregistered prediction, the bands,
    the cells, the seeds, or the success and falsification criteria.
  uncertainty_reduced: >-
    Whether H1's yield ratio P1 on the four frozen Koblitz cells falls in
    band, fails the outer band, or cannot be read because the instrument
    fails; and whether Stage-2 P2 and Stage-3 P3 meet their frozen readings.
  inputs:
    - experiments/EXP-FROB-5e15ed/specification.yaml
    - ledger/hypotheses/H-FROB-855915.yaml
    - ledger/proposals/IDEA-20260926-197ecf.yaml
    - ledger/decisions/DEC-20260930-f693b9.yaml
    - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
    - experiments/EXP-CERTBIN-e94b27/impl/curve.py
    - experiments/EXP-CERTBIN-e94b27/impl/macaulay.py
    - experiments/EXP-CERTBIN-e94b27/impl/closure.py
    - experiments/EXP-CERTBIN-e94b27/runs/RUN-CERTBIN-c417e0/
  constraints:
    - Amazon Bedrock is prohibited. Do not select, probe, or contact it.
    - No enumeration and no solver run at n = 131. n = 131 appears only as arithmetic on the published constants inside Stage 0, labeled modeled.
    - No ECDLP exponent claim. Do not treat a 2 to 2.5 bit constant as beating Pollard rho.
    - Do not edit experiments/EXP-FROB-5e15ed/specification.yaml. It is frozen.
    - Do not edit ledger records. Do not edit CERTBIN sources.
    - >-
      Protocol amendments, if a later change is required, would be new files
      under experiments/EXP-FROB-5e15ed/amendments/. This handoff does not
      authorize an amendment.
    - maximum_runs 1 means one execution of the frozen panel, not one cell.
    - Do not add cells, seeds, or targets.
    - A timeout, crash, or implementation failure is invalid_instrument, not a negative mathematical result.
    - This handoff does not open a claim-changing review round.
  deliverables:
    - experiments/EXP-FROB-5e15ed/implementation/ sufficient to rerun the panel
    - the required_artifacts listed in experiments/EXP-FROB-5e15ed/specification.yaml, under experiments/EXP-FROB-5e15ed/runs/
    - execution-report.yaml stating exactly one outcome_label
  artifact_paths:
    - experiments/EXP-FROB-5e15ed/specification.yaml
    - ledger/handoffs/TASK-20260930-be6bbf.yaml
    - ledger/hypotheses/H-FROB-855915.yaml
    - ledger/decisions/DEC-20260930-f693b9.yaml
  write_scope:
    - experiments/EXP-FROB-5e15ed/implementation/
    - experiments/EXP-FROB-5e15ed/runs/
  archived_by: TASK-20260930-fa234f
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
    no_bedrock: true
  budget:
    wall_clock_seconds: 14400
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
    - command.txt, environment.json, stdout.log, stderr.log, raw-result.json, analysis.yaml, manifest.yaml, and execution-report.yaml exist under the run directory
    - stage0-orders.yaml, stage0-budget-modeled.yaml, stage1-yields.yaml, stage2-closure.yaml, stage3-degree.yaml, rc1-regression.yaml, and verification-summary.yaml exist
    - stage0-budget-modeled.yaml labels every budget figure modeled, not measured
    - specification.yaml is byte-identical to the approved version
    - >-
      execution-report.yaml states exactly one outcome_label from
      success, falsified_h1, outcome_ii_closure, invalid_instrument,
      using the precedence in the specification. If the panel finishes
      with the instrument intact, H1 not falsified, and outcome (ii) not
      fired, but the success conjunction fails, the label is not_success
      and the failed clauses are listed. not_success is not a pass.
    - the label matches the frozen bands; the prediction text is unchanged
  review_plan: null
  dispatch_preconditions:
    - archived_by is bound to TASK-20260930-fa234f before any launch
    - declared inputs are committed and pushed
    - do not launch until the snapshot receipt for TASK-20260930-fa234f verifies
    - >-
      This session must not launch the executor. A lane claim is required
      before launch if a goal lane is later opened. Absence of a receipt is
      not permission to start.
  runs_authorized_by_this_card: 0
  note: >-
    The card is written so a later dispatcher can launch it. Writing it is
    not a launch.
