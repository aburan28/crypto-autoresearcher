# SUCCESSOR HANDOFF: supersedes ledger/handoffs/TASK-20260904-91ab5b.yaml as
# the dispatchable copy of the same review round. REASON FOR SUPERSESSION
# (infrastructure, not research): the api_direct runtime's role registry has
# no 'reviewer' role - it refuses with
# KeyError: "unknown role 'reviewer'; roles: coordinator, executor,
# executor-mechanical, idea-generator, red-team, red-team-breakthrough,
# validator, validator-breakthrough" - and roles.yaml binds policy
# review-breakthrough to the validator-breakthrough role on this runtime.
# Per AGENTS.md the role is refused rather than run with a reduced surface;
# the queue task id stays TASK-20260904-91ab5b (its live claim and paths are
# unchanged), only the handoff role name and this record id change.
# No reviewer has run; nothing is superseded in substance.
# Ledger handoff record. Dispatched under BATCH-5abf72 (GOAL-MONO-001),
# authorized by DEC-20260904-0f525b. This handoff OPENS a claim-changing
# review round (it can move GOAL-MONO-001 to completed), so review_plan is
# populated and was written BEFORE any reviewer ran.
handoff:
  id: TASK-20260904-50755f
  from: coordinator
  to: validator-breakthrough
  objective: >-
    Rule-12 review of the proposed scoped instrument no-go recorded in
    DEC-20260810-2f86db (D-1/D-2, grounded in EV-MONO-a0a89c OBS-5) and of its
    adequacy for GOAL-MONO-001 completion criterion (c) ("a scoped
    instrument/protocol no-go is recorded"). This is a CLOSURE-result review:
    your CONCUR on all three joints is the single artifact both records name
    as the last gate before the goal closes.
  uncertainty_reduced: >-
    Whether the no-go derivation is sound, correctly scoped, and sufficient
    for criterion (c) - reduced to three owned joints in review_plan below.
  inputs:
    - ledger/decisions/DEC-20260810-2f86db.yaml
    - ledger/decisions/DEC-20260802-a51c82.yaml
    - ledger/evidence/EV-MONO-a0a89c.yaml
    - ledger/goals/GOAL-MONO-001/goal.yaml
    - ledger/corrections/CORR-20260802-1d8384.yaml
    - ledger/questions/RQ-MONO-001.yaml
    - knowledge/open-problems/KN-OPEN-009.md
    - AGENTS.md
    - templates/research-records.md
  constraints:
    - >-
      Independent session: you are not the producing agent and must not read
      the producer's implementation or notes (see review_plan
      .blind_rederivation.blind_from). Declare everything you read.
    - >-
      Report on YOUR joints only; the Coordinator composes the round.
    - >-
      A timeout, crash, or tooling failure is not evidence about the
      mathematics (core rule 5).
    - >-
      You change no official state; your verdict is input to a Coordinator
      decision.
    - >-
      Cite provenance for every citation (recalled | retrieved | kb |
      internal). A recalled reference is a pointer, never support.
    - >-
      Claim-tier ceiling stays toy; no security estimate moves in either
      direction.
  deliverables:
    - >-
      review_report.md with, for EACH of the three joints: the method you
      actually used, what you built/computed/read, the verdict CONCUR or
      DISSENT with reasons, and the reading-declaration (every path you
      opened).
    - >-
      An attestation block: independent_session true, role reviewer,
      requested_policy review-breakthrough, resolved backend and model as
      reported by the runtime, and the exact record IDs reviewed.
    - >-
      For the blind re-derivation: your derivation written from scratch, the
      parameters you used, and the statement that you did not open the
      blind_from paths.
  artifact_paths:
    - coordination/goals/GOAL-MONO-001/batches/BATCH-5abf72/tasks/TASK-20260904-91ab5b/review_report.md
  archived_by: TASK-20260904-6c12e0
  inference:
    policy: review-breakthrough
    reasoning_effort: max
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 5400
    memory_gb: null
    maximum_runs: null
  completion_gate:
    - >-
      review_report.md exists at the declared artifact path with a per-joint
      verdict and reading declaration for all three joints.
    - >-
      The attestation block records requested policy, resolved backend/model,
      and independent session truthfully.
    - >-
      No verdict is left implicit: CONCUR or DISSENT for J1, J2, J3.
  return_format: >-
    Return the review report body (per-joint verdicts, method, reading
    declaration, attestation block). The runtime receipt and transcript are
    archived alongside by the Coordinator.
  review_plan:
    claim_under_review: >-
      As stated by its producer (DEC-20260810-2f86db): "the generic-fibre
      Frobenius cycle-type census, in the frozen instrument form of
      EXP-MONO-4b50b6, AS A PROBE OF INDEX-CALCULUS RELATION RATE, at every m"
      is closed, because on the factor-base locus the census statistic is
      identically trivial - EV-MONO-a0a89c OBS-5: if x_1..x_{m-1} are
      x-coordinates of F_p-rational points, the roots of
      S_m(x_1..x_{m-1},T) are exactly the 2^{m-2} x-coordinates of
      eps_1 P_1 + ... + eps_{m-1} P_{m-1} over sign vectors, all in F_p, so
      S_m splits completely over F_p there and the statistic is constant
      across every curve, prime and m - and this no-go is, on its face, the
      object GOAL-MONO-001 completion criterion (c) asks for.
    coordinator_prior: >-
      Written before any reviewer ran. I expect CONCUR on all three joints. J1:
      the D-1 argument is a two-line consequence of the group law (each root
      is the x-coordinate of a sum of factor-base points by construction of
      S_m; there are exactly 2^{m-2} sign vectors matching deg_T S_m; sums of
      F_p-rational points are F_p-rational), and the m=4 p=211 corroboration
      (193/193) leaves little room for an implementation gap. J2: I expect the
      scope statements to hold because they are negative constraints on
      readings, not additional mathematics. J3: I expect criterion (c) to be
      satisfied by the record as written. I would NOT be surprised by a
      DISSENT on J1 that turns on the uniqueness direction of the root count
      (that the sign-vector sums exhaust the roots rather than merely provide
      deg_T S_m of them) - that is where I would attack first, and it is the
      one place the derivation could hide a gap that empirical corroboration
      at one prime would not catch.
    joints:
      - joint: >-
          J1 - DERIVATIONAL SOUNDNESS OF THE NO-GO. The OBS-5 statement:
          on the factor-base locus (all base coordinates x_i are
          x-coordinates of F_p-rational points), S_m(x_1..x_{m-1},T) splits
          completely over F_p with root set exactly { x(eps_1 P_1 + ... +
          eps_{m-1} P_{m-1}) : eps_i in {+1,-1} }, which has cardinality
          deg_T S_m = 2^{m-2} for m >= 3, so the cycle-type statistic is
          constant on that locus.
        assigned_to: TASK-20260904-91ab5b
        attack_plan: >-
          Blind re-derivation (see blind_rederivation) of the root-set
          statement from the group law and the defining property of Semaev
          polynomials (S_m(x_1..x_m)=0 iff there is a point R = sum P_i with
          x(R)=x_m), plus your OWN independent construction of S_4 by
          resultant recursion over a small prime of your choosing (the
          producer used p=211; any prime in 50-2000 serves). Two checks at
          minimum: (a) completeness - for random factor-base triples, the
          degree-4 polynomial in T has all four roots in F_p; (b) exactness -
          the root set equals the sign-vector set, not a superset, and the
          count matches deg_T S_4=4. The place I think it could break: the
          exhaustion direction (roots of S_m over the algebraic closure vs
          F_p-rational sums) - verify deg_T S_m equals the number of distinct
          sign-vector x-coordinates on your instance rather than assuming it.
        breaking_artifact: >-
          One factor-base-locus instance (any m >= 3, any prime) where S_m
          fails to split completely over F_p, or where a root lies outside the
          sign-vector x-coordinate set; or a derivation showing the root count
          differs from 2^{m-2}.
      - joint: >-
          J2 - SCOPE HONESTY OF THE NO-GO. The record must close ONLY
          the instrument form: not the relation-rate question (D-2), not the
          imprimitivity half of KN-OPEN-009 (D-3), not the D-4 direction
          swap, and it must not license any m >= 4 census in the rejected
          form.
        assigned_to: TASK-20260904-91ab5b
        attack_plan: >-
          Proves-too-much control (see proves_too_much): run the D-1 argument
          structure against the D-4 swapped statistic (fixed T = x(R); count
          of FB-rational points on the fibre of the projection to the
          T-line). The argument keys on the base locus making the T-roots
          rational; in the swapped projection the roles are exchanged, so a
          correct scoping shows the argument does NOT transfer. Then audit
          the record's own words for overreach: any sentence readable as
          closing the relation-rate half, the imprimitivity half, or any
          statistic other than the generic-fibre cycle type.
        breaking_artifact: >-
          A reading of DEC-20260810-2f86db (or the goal record's next_action)
          that licenses "the relation-rate half of KN-OPEN-009 is closed" or
          "the D-4 swapped statistic is condemned", OR a demonstration that
          the D-1 argument structure transfers to the swapped statistic (in
          which case the no-go proves too much and the scoping in D-2 is
          wrong somewhere).
      - joint: >-
          J3 - ADEQUACY FOR CRITERION (c). GOAL-MONO-001
          completion_criteria item (c) is "a scoped instrument/protocol no-go
          is recorded"; DEC-20260810-2f86db claims its D-1 no-go is
          that object, recorded as a Coordinator proposal pending exactly
          this review.
        assigned_to: TASK-20260904-91ab5b
        attack_plan: >-
          Quote-match criterion (c) against the record: is the no-go scoped
          (J2), is it recorded in a committed Coordinator decision, and is
          adopting it as the criterion-(c) object consistent with
          DEC-20260802-a51c82 N-2's original reasoning (which examined only
          criterion (a)) and with the goal record's supersession note? Check
          no OTHER completion criterion is being silently claimed, and that
          closure under (c) implies no hypothesis-status change and no claim
          beyond toy scope. This is a consistency joint: build the exact
          quote trail, not new mathematics.
        breaking_artifact: >-
          A criterion-(c) reading the record does not satisfy (e.g. (c)
          demands an instrument no-go established by measurement rather than
          derivation, or demands scope statements the record lacks), or a
          contradiction between the record and DEC-20260802-a51c82/goal.yaml
          that closure would paper over.
    blindness:
      mutual: true
      lifted_for: []
      rationale: >-
        Single-reviewer round; no sibling reports exist to be blinded from.
    proves_too_much:
      objects:
        - >-
          A GENERIC (non-factor-base) base point tuple: x_i drawn from F_p
          NOT constrained to be x-coordinates of F_p-rational points. There
          the census statistic is expected to VARY (generic monodromy), so
          the no-go argument must FAIL to prove constancy off the locus. If
          the D-1 argument structure also "proves" constancy for generic
          tuples, it proves too much and is wrong somewhere.
        - >-
          The D-4 direction-swapped statistic on the same factor-base locus
          (fixed T = x(R), counting FB-rational points on the fibre of the
          projection to the T-line). D-1's conclusion (statistic identically
          constant) is about the generic-fibre census statistic; if the same
          argument yields constancy for the swapped statistic, the no-go
          condemns its own named successor and the scoping is inconsistent.
      failure_signature: >-
        The argument succeeding (proving constancy / non-discrimination) on
        either object where its conclusion is known or expected false. Record
        the exact reasoning step that fails to stop at the locus boundary.
      assigned_to: TASK-20260904-91ab5b
    blind_rederivation:
      required: true
      quantity: >-
        The OBS-5 root-set statement itself: for m=3 and m=4, given base
        x-coordinates of F_p-rational points, the set of F_p-roots of
        S_m(x_1..x_{m-1},T) equals { x(sum eps_i P_i) } and has size
        2^{m-2}. Re-derive from the group law and the defining universal
        property of Semaev polynomials, with your OWN S_4 construction.
      parameters: >-
        Any prime p in 50-2000 and any curve over F_p with a factor base of
        x-coordinates of F_p-rational points; at least 20 random base tuples
        for m=4. (The producer's instance was p=211, curve y^2=x^3+3x+8 over
        F_211; you need not use it.)
      blind_from:
        - experiments/EXP-MONO-4b50b6/
        - coordination/goals/GOAL-MONO-001/batches/BATCH-003/
      assigned_to: TASK-20260904-91ab5b
    procedure_deviations: []
