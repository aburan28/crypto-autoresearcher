  batch_id: BATCH-127c82
  role: coordinator
  archive_kind: snapshot
  objective: >-
    Snapshot-archive the exact opening artifacts of BATCH-127c82 -- the frozen
    known-bad-control contract, the dispatch queue, the seven handoffs and the approval
    decision -- in ONE isolated commit that stages exactly those declared paths and
    nothing else, and record a post-commit receipt the dispatcher's verifier accepts.
  uncertainty_reduced: >-
    Whether the frozen protocol the executor will be held to is durable and verifiable
    rather than a working-tree artifact. A contract that exists only uncommitted is not
    an approval an executor may act on.
  inputs:
    - coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-127c82/contracts/known-bad-control.json
    - coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-127c82/dispatch_queue.json
    - ledger/decisions/DEC-20260907-ca563a.yaml
    - ledger/handoffs/TASK-20260907-9ceaba.yaml
    - ledger/handoffs/TASK-20260907-814b9f.yaml
    - ledger/handoffs/TASK-20260907-39511d.yaml
    - ledger/handoffs/TASK-20260907-e7cc96.yaml
    - ledger/handoffs/TASK-20260907-6fbd6d.yaml
    - ledger/handoffs/TASK-20260907-c3d2d8.yaml
    - ledger/handoffs/TASK-20260907-9b71ea.yaml
  constraints:
    - Runs ALONE. No other task of this lane may be running while this commit is made.
    - Stage exactly the declared paths. A scope-expanding commit is an evidence-integrity failure, not a convenience.
    - >-
      Merge origin/main into the working branch before committing, never rebase, and
      record the base commit checked and the merge outcome in the receipt.
    - >-
      dispatch_plan.json and dispatch_plan.md are gitignored generated artifacts and are
      NEVER staged.
    - >-
      The queue's own archive block for this task cannot be written inside the commit it
      binds. Backfill commit_sha, parent_sha and path_sha256 in a second commit that
      stages only dispatch_queue.json, which is the established pattern on this branch
      (4feb619f1 backfilled 70cf21653).
    - Stay on branch cursor/satic-c49b77-imp1-recheck-276e. Never force-push, never rewrite pushed history.
  deliverables:
    - a snapshot commit staging exactly the declared opening artifacts
    - a post-commit receipt naming the task and record IDs, the commit, its parent, and each declared path digest
    - a dispatcher verification of that receipt
  artifact_paths:
    - coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-127c82/archives/TASK-20260907-814b9f/snapshot.md
  write_scope:
    - coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-127c82/archives/TASK-20260907-814b9f/
  archived_by: TASK-20260907-814b9f
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: null
    memory_gb: null
    maximum_runs: 0
  completion_gate:
    - the commit changes exactly the declared paths, with no undeclared extra and no declared-but-untouched path
    - the receipt's declared parent equals the commit's actual first parent
    - every declared path digest recomputes exactly from the commit's tree
    - the commit message names TASK-20260907-814b9f and the record IDs it binds
    - the dispatcher's post-commit verifier accepts the receipt
    - the base commit of origin/main checked, and the merge outcome, are recorded
  return_format: the commit sha, the parent sha, the declared path digests, and the verifier's result
  review_plan: null
