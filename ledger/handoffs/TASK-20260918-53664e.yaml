# TASK-20260918-53664e -- DESIGN IDEA-20260916-3f7a1c into a frozen
# INDEPENDENT-REPLICATION contract for the n = 131 census.
#
# DESIGN ONLY. This card freezes a contract; it approves nothing and runs
# nothing. Execution is a separate /run invocation against the frozen contract,
# after a separate Coordinator approval decision.
# =============================================================================
handoff:
  id: TASK-20260918-53664e
  from: coordinator
  to: idea-generator
  recorded_at: '2026-09-18'
  goal_id: GOAL-ECDLP2M-001
  batch_id: BATCH-93320c
  question_id: RQ-QSP-f9bbdb
  opened_by_decision: DEC-20260918-7e0865
  kind: experiment_design

  objective: >-
    Convert IDEA-20260916-3f7a1c -- still `status: proposed`, authored
    2026-09-16, NEVER DESIGNED -- into a hypothesis record and a frozen
    experiment contract for an INDEPENDENT REPLICATION of the n = 131 census,
    with two deliverable halves:
    (1) A SECOND, INDEPENDENTLY WRITTEN INSTRUMENT for the root count
    N_K(L) = #{x in F_(2^131) : x^(2^n') = lambda(x)}, written from the
    STATEMENT of that quantity and not from EXP-QSP-33b442's implementation --
    the contract must declare what the implementer may not read, exactly as a
    blind re-derivation does, because recomputing from the producer's artifacts
    reproduces a wrong-but-self-consistent implementation faithfully.
    (2) THE UNCOVERED CELLS n' = 3..14. EXP-QSP-33b442 Stage 3 covered only
    n' in {33, 44, 66}; n' = 3..14 has no committed run at n = 131.
    IDEA-20260916-3f7a1c's own minimal_test already contemplates n' in {11, 22}
    as brute-force cross-check cells, so this is a widening of a design that
    exists rather than a new one.

  uncertainty_reduced: >-
    Whether the n = 131 census is right at all. EV-QSP-a6aa4b discloses that 720
    of its 732 rows (98.4%) are SINGLE-INSTRUMENT, and that its re-verifier can
    falsify a listed root but "cannot detect a missing one" -- a one-directional
    check on the quantity every cost row of the QSP line is built from.
    DEC-20260917-793ae2 records at PD-6 that no independent replication
    invocation was ever spent, and that determinism-by-construction plus one
    blind re-derivation of ONE cell's aggregates stood in its place. A second
    instrument is the only thing that closes that exposure; the blind
    re-derivation of TASK-20260917-5fa7d5 reached the n' = 33 cell's aggregates
    and computed nothing at n' = 44, n' = 66, or anywhere below 33.

  motivation_to_record_in_the_contract: >-
    THE CONTRACT MUST CARRY THIS MOTIVATION IN ITS OWN OBJECTIVE, NOT ONLY HERE,
    so that a later reader of the contract alone can see what it is for: the
    census it replicates is 98.4% single-instrument by its own evidence record's
    disclosure, and that evidence record states in terms that its re-verifier
    "cannot detect a missed one". A replication designed without that sentence
    in front of it will build a second instrument that shares the first's blind
    spot.
    A PRELIMINARY, NON-EVIDENTIAL INDICATION, RECORDED UNDER AGENTS.md CORE
    RULE 5 AND USABLE FOR NOTHING ELSE. The activation session of 2026-09-18
    computed an n = 131 census in a scratchpad OUTSIDE the experiment harness --
    no frozen contract, no RUN record, no certificates, no review. It reproduced
    RUN-QSP-33b442-S3 exactly (maximum |V| = 132 at n' = 33, attained by the same
    four polynomials X^7+X^2, X^7+X^5+1, X^7+X^6+X^3+X^2 and
    X^7+X^6+X^5+X^4+X^3+X+1) and additionally covered n' = 3..14, where the
    maximum seen was 133 at n' = 8.
    THIS IS NOT EVIDENCE, IT CARRIES NO RUN RECORD AND NO CERTIFICATE, AND IT
    CONFERS NO CLAIM. It is recorded here for one purpose only: it is part of why
    this task is the goal's operative next action, since an
    outside-the-harness reproduction is precisely NOT a replication. THE
    DESIGNED CONTRACT MAY NOT CITE IT, may not preregister against its numbers,
    may not treat n' = 8 as an expected maximum, and may not enter any of it as a
    measurement. If the contract's designer wants a prior for n' = 3..14, the
    honest one is the null model of TASK-20260917-5fa7d5 -- about 2 roots per
    candidate, one Frobenius orbit occasionally -- and not these numbers.
    Deriving a preregistered prediction from an unrun scratchpad would corrupt
    the preregistration, which is the one thing the contract cannot afford.

