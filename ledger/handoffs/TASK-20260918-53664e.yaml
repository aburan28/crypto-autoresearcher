  inputs_note: >-
    KN-TECH-54c38e is the composition-lemma instrument validated by
    TASK-20260917-5fa7d5 -- counting K-rational roots without materialising L,
    with its three recorded limits including that d^k must stay
    materialisable. It is listed as an INPUT because the designer must decide,
    explicitly and in the contract, whether the second instrument may use it. IT
    PROBABLY MAY NOT: an instrument sharing a technique with the blind
    re-derivation that already agreed with the producer is not independent of
    that agreement. State the decision either way with its reason.
    experiments/EXP-QSP-33b442/specification.yaml is listed so the designer knows
    what is being replicated and what the cells were. IT IS FROZEN AND IMMUTABLE
    AND MUST NOT BE EDITED, amended, or re-approved by this task.

  constraints:
    - id: C-1
      text: >-
        DESIGN ONLY. Author a hypothesis record and a frozen experiment contract
        at version 1 with `approved_by: null`. DESIGNING IS NOT APPROVING
        (AGENTS.md "ECC comes first", instruction 3): approval is a separate
        committed Coordinator decision, and execution is a separate /run
        invocation after that.
    - id: C-2
      text: >-
        RUN NOTHING. maximum_runs is 0. Do not execute a census, a spot check, a
        prototype, or a timing measurement, and do not create any directory under
        experiments/<new id>/runs/ beyond an empty .gitkeep. A number produced by
        this task would be a measurement taken before its own protocol was
        frozen, which is the defect the freeze exists to prevent.
    - id: C-3
      text: >-
        THE INDEPENDENCE OF THE SECOND INSTRUMENT IS DECLARED IN THE CONTRACT AS
        A BLIND_FROM LIST, NOT PROMISED IN PROSE. Name the exact paths the
        implementer may not read -- at minimum EXP-QSP-33b442's implementation
        directory, its run artifacts, its execution report, and its analysis --
        and require the executor's report to declare what it actually read. An
        independence that is not checkable after the fact is not independence.
    - id: C-4
      text: >-
        EDIT NO EXISTING RECORD. EXP-QSP-33b442, H-QSP-5540d7, EV-QSP-a6aa4b,
        DEC-20260917-793ae2 and IDEA-20260916-3f7a1c are all immutable. In
        particular, DO NOT convert IDEA-20260916-3f7a1c by editing it; its
        `status: proposed` is historically accurate and the new hypothesis
        CITES it as its source proposal.
    - id: C-5
      text: >-
        PREREGISTER THE PREDICTION FOR n' = 3..14 IN THE CONTRACT'S
        `preregistered_prediction` BLOCK, derived from a stated null model and
        NOT from any unrun computation (see motivation above). The cells are
        uncovered by any committed run, so the prediction is genuinely blind and
        that is a feature: it is the only cell set in this line where a
        preregistration has not already seen the answer.
    - id: C-6
      text: >-
        CARRY A PROOF_SEARCH_MAP AND CONTROLS. The hypothesis is proof-adjacent
        (it rests on IDEA-20260916-3f7a1c's derivation (A)) so
        docs/inventor-protocol.md section 8 applies: baseline reproduction,
        observation collision, quantifier order, method ceiling with a nearby
        object control. Carry forward IDEA-20260916-3f7a1c's own controls, all of
        which are already worked there: the brute-force cross-check, the
        proves-too-much objects ((7,3) -> 8, (31,15) -> 2^15, subfield (12,6) ->
        64), the null object, the linearized control, and the
        degenerate-candidate arm for square lambda.
    - id: C-7
      text: >-
        SCOPE THE CELLS HONESTLY AND SIZE THEM AGAINST THE RECORDED IMPEDIMENT.
        At n' = 3..14 the direct gcd route needs a polynomial of degree 2^n' <=
        2^14, which is small; at n' = 33 it needs 2^33, which is the impediment
        that forced AMD-20260917-001 and the absence of a sub-quadratic GF(2)[X]
        engine (DEC-20260917-793ae2 NA-6 item iii). Design the low cells as
        directly computable and say explicitly which cells rest on a derivation
        rather than a brute count.
    - id: C-8
      text: >-
        IF IDEA-20260918-6c07e1 SURVIVES TASK-20260918-190055, IT PREDICTS THE
        n' = 3..14 CELLS CONTAIN NO COMPLETE SPLITTER. Do NOT build that
        prediction into this contract: at design time that proposal is unreviewed
        and may not be cited as support (DEC-20260918-7e0865 limitations). Design
        the census to measure N_K(L) regardless; if the proposal later holds, the
        same measurements become a test of it, which is strictly better than
        having assumed it.
    - id: C-9
      text: >-
        DP-2 SATISFIED 2026-09-20 UNDER DEC-20260920-ceb609: write EXACTLY
        ledger/hypotheses/H-QSP-cd0c90.yaml and experiments/EXP-QSP-70b731/
        (specification.yaml plus empty amendments/.gitkeep and runs/.gitkeep).
        Do not mint alternate identifiers. The angle-bracket placeholders in
        the original artifact_paths/write_scope fields remain as historical
        text; operative paths are artifact_paths_minted_20260920 /
        write_scope_minted_20260920.

