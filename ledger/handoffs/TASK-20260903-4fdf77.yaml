  constraints:
  - 'NEVER read the validator task directory coordination/goals/GOAL-AES-003/batches/BATCH-b38667/tasks/TASK-20260903-779393. Blindness within this round is mutual.'
  - 'PROVES-TOO-MUCH CONTROL, REQUIRED: apply the proposal''s own decision rule to objects where its conclusion is known false - (a) the k=0 ramp-zero arm, where the count is 2^30 by construction, (b) the r=6 dead anchor at 0 hits, (c) synthetic counts drawn from the analytic null at the proposed exposure, and (d) a synthetic still-decaying generator. A rule that returns "live floor above comparator" on (a), (b) or (c), or "plateau" on (d), has proved too much and is wrong somewhere nobody has read closely enough.'
  - 'Attack the pooling model: independence across seeds, exposure additivity, between-seed heterogeneity and overdispersion, instrument stationarity across a longer arm, and whether HIT_LOG_CAP or the overflow counter interacts with the estimator at higher exposure under AMEND-1.'
  - 'Attack scope and interpretation sentence by sentence: hunt for any smuggled extinction, plateau, completion, cliff-at-4, sub-sub-interval, whole-curve replication, k=12 coverage, count-verdict-at-k=8 or prior-rehabilitation sentence, and for any statement exceeding grid {0,1,2,3,4,8,16}, cell (1,1), r = 5, 2^30, seeds 531001/531002 (plus dead-anchor seed 531004), PIN-T0, toy tier.'
  - 'Attack Pareto honesty: is dominated_by genuinely checked across time, memory and number of draws, is sota_delta quantitative, and does RANK 2 (family extension or a finer (3,4] locator) or a cheaper third-draw design dominate this route on information per second? Premature closure and overclaiming are symmetric failure modes; "this route is exhausted" is a hypothesis about the search and needs a named, measured obstruction like any other.'
  - 'Toy tier: no published-cryptanalysis comparison in either direction, and no deployed-AES statement.'
  - Report on YOUR JOINT ONLY; the Coordinator composes the verdicts. State any successor requirement you would bind on the design as a numbered item.
