handoff:
  id: TASK-20260826-5ee48b
  from: coordinator
  to: red-team
  goal_id: GOAL-MLKEM-005
  batch_id: BATCH-762807
  question_id: RQ-MLKEM-001
  opening_decision: DEC-20260824-5e222e
  objective: >-
    Try to falsify the interpretation, scope and value of the repaired instrument on
    the three joints assigned to you: J4 -- name what a d=512, mpfr=100 run would do
    that the tiny surrogate cannot show, and whether any of the six fixes could
    SILENTLY FAIL ONLY AT SCALE; J5 -- run the proves-too-much control by applying
    the fixes' argument to BATCH-f9780d's own executions, where the verdict is
    already known, and say what this batch actually buys if the answer is that
    nothing would have changed; J6 -- determine whether the repaired instrument makes
    the next 100-bit attempt's budget computable from the 14448 s LOWER BOUND, and
    what is still missing. Return an admissibility_ruling.
  uncertainty_reduced: >-
    Whether a green acceptance board at tiny d licenses any confidence that these
    fixes will hold at the scale they were built for; whether this instrument repair
    changes any verdict the ledger has already recorded, and if not what it is
    actually worth; and whether the one quantity DEC-20260815-3e8e9c(i) said a
    Stage-1 sizing decision needs is now obtainable from a capped cell.
  assigned_joints:
    J4: >-
      THE SURROGATE DOES NOT GENERALISE. The acceptance tests run at tiny d. Name what
      a d=512, mpfr=100 run would do that the surrogate cannot show, and say whether
      any of D1..D6 could silently fail ONLY at scale -- per-tour flush cost against
      multi-hour tours, signal delivery inside a long C call, RSS or file-handle
      behaviour over hours, a tours table that grows unboundedly, a stdout_tail that
      truncates the only interesting part.
    J5: >-
      PROVES-TOO-MUCH. If these fixes had been applied to the predecessor run, would
      they have changed its verdict? Run the argument against the object where its
      conclusion is known: BATCH-f9780d's own executions. If the answer is 'no', say
      what this batch actually buys and whether that is worth its cost. An instrument
      repair that would not have changed a single committed verdict is not thereby
      worthless, but it must be defended on what it enables next rather than on what
      it would have fixed.
    J6: >-
      COST AND NEXT-RUN SIZING. DEC-20260824-5e222e requires the next 100-bit attempt
      to be sized from the 14448 s LOWER BOUND, NEVER from the predecessor's 2502.74 s
      failure time. Does the repaired instrument make that sizing computable, and what
      is still missing? A tours-per-hour curve from a killed cell is the quantity
      DEC-20260815-3e8e9c(i) said a Stage-1 sizing decision needs; check whether the
      v2 instrument would actually produce it under a cap.
  inputs:
    - The committed snapshot of TASK-20260826-9e9d53 and its receipt.
    - >-
      review-plan/review_plan.yaml and review-plan/assignment-TASK-20260826-5ee48b.yaml
      -- your joints, your attack plans and your read boundary.
    - The producer's twelve declared artifacts and its implementation report.
    - >-
      BATCH-f9780d in full -- the predecessor's runner, results, execution report,
      both reviews and its snapshot receipt. This is J5's known-false object.
    - >-
      ledger/decisions/DEC-20260824-5e222e.yaml -- the 14448 s lower bound, the
      refusal of the 100-bit re-run, and the ruling that 2502.74 s is a FAILURE time
      and not a cost.
    - >-
      ledger/decisions/DEC-20260815-3e8e9c.yaml condition (i) -- what the
      tours-per-hour curve was supposed to buy.
    - >-
      knowledge/findings/KN-FIND-f54a82.md -- an isolated-step probe is not evidence
      about the full tour it stands in for. It binds how a tiny acceptance cell may be
      described.
  constraints:
    - >-
      INDEPENDENT SESSION. You did not produce, run, dispatch or archive any artifact
      under review, and you say so.
    - >-
      SIBLING-BLIND. Do NOT read
      coordination/goals/GOAL-MLKEM-005/batches/BATCH-762807/reviews/TASK-20260826-9605ae
      or
      coordination/goals/GOAL-MLKEM-005/batches/BATCH-762807/review-plan/assignment-TASK-20260826-9605ae.yaml.
      Attest to what you read.
    - >-
      REPORT ON YOUR OWN JOINTS, NOT ON THE WHOLE CLAIM. The Coordinator composes.
    - >-
      ZERO LATTICE COMPUTE AT SCALE. Your own probes stay at acceptance scale. DO NOT
      RUN ANY d=512 REDUCTION AND DO NOT RE-RUN THE 100-BIT CELL; that re-run is
      refused by DEC-20260824-5e222e and no review authorises it. If your J4 argument
      needs a scale measurement to be decisive, SAY SO AND NAME THE MEASUREMENT rather
      than taking it.
    - >-
      DO NOT MANUFACTURE AN OBJECTION. Where the batch is honest, say so and move your
      effort elsewhere; a fabricated objection costs the round more than a missed one.
    - >-
      PREMATURE CLOSURE IS A FAILURE MODE SYMMETRIC WITH OVERCLAIMING. 'The instrument
      is fine' and 'the instrument is worthless' both need an argument and an artifact.
    - >-
      A TIMEOUT, CRASH OR MISSING DEPENDENCY IN YOUR OWN PROBE IS INFRASTRUCTURE
      SIGNAL, never a finding against the producer.
    - >-
      NEVER FABRICATE a command, an output, a timing or a hash. Recompute what you
      assert; attribute what you quote.
    - >-
      DO NOT MOVE ANY STATUS, do not write any ledger record, do not commit, and write
      nothing outside your own review directory.
    - >-
      AN UNREACHED JOINT IS REPORTED AS NOT REACHED WITH WHAT YOU TRIED, and any
      overrun is disclosed in the attestation.
    - >-
      ASSERT NOTHING ABOUT ML-KEM AT ANY PARAMETER SET, in either direction. The
      object under test at d=512 is already the null object -- a structureless random
      q-ary lattice -- and that limit is inherited, not established here.
    - >-
      DO NOT SIZE OR RECOMMEND A BUDGET FOR THE NEXT 100-BIT ATTEMPT AS AN
      AUTHORISATION. J6 asks whether the sizing is COMPUTABLE and what is missing;
      authorising a run is a Coordinator decision plus a frozen contract, and neither
      exists.
  deliverables:
    - >-
      reviews/TASK-20260826-5ee48b/red-team-report.yaml -- per-joint findings for J4,
      J5 and J6 with verdicts holds / breaks / inconclusive, the proves-too-much
      control run explicitly against BATCH-f9780d's own executions with its failure
      signature stated, any named scale-only failure mode with the artifact or
      argument supporting it, an obstruction block with a resource_check if anything
      is claimed closed or weakened, and an admissibility_ruling block.
    - >-
      reviews/TASK-20260826-5ee48b/attestation.yaml -- role, independent_session true,
      requested_policy and resolved model, model_verified with its basis, exactly what
      you read, the sibling-blindness statement, and any budget overrun disclosed.
  artifact_paths:
    - coordination/goals/GOAL-MLKEM-005/batches/BATCH-762807/reviews/TASK-20260826-5ee48b/red-team-report.yaml
    - coordination/goals/GOAL-MLKEM-005/batches/BATCH-762807/reviews/TASK-20260826-5ee48b/attestation.yaml
  archived_by: TASK-20260826-70d800
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 900
    memory_gb: 2
    maximum_runs: 1
    charged_runs_authorised: 0
    charged_runs_note: >-
      ZERO CHARGED EXPERIMENT RUNS. A reviewer's own adversarial probes are NOT
      charged runs under this batch's maximum_runs definition. `maximum_runs: 1` is
      the dispatcher's minimum positive integer and is NOT an authorisation. See
      batch.yaml PD-1.
    justification: >-
      900 s, on the identical basis as TASK-20260826-9605ae: three adversarial joints
      at the measured per-joint rate of roughly 300 s (DEC-20260824-257f35 PD-1).
      Overrun in AGENT time is expected, disclosed in the attestation, and never met
      by reallocating a ceiling.
  completion_gate:
    - >-
      Each of J4, J5 and J6 has an explicit verdict (holds / breaks / inconclusive)
      with the argument or artifact it rests on.
    - >-
      J4 NAMES CONCRETELY what a d=512, mpfr=100 run would do that the surrogate
      cannot show, and states for each of D1..D6 whether it could silently fail only
      at scale.
    - >-
      J5 runs the proves-too-much control against BATCH-f9780d's own executions and
      states, in terms, whether the repaired instrument would have changed that
      batch's verdict and what the batch buys if it would not.
    - >-
      J6 states whether the 14448 s-based sizing is computable from what the
      instrument now records, and enumerates what is still missing, without
      recommending or authorising any budget.
    - >-
      An admissibility_ruling block is returned as ADMIT / DO NOT ADMIT / NOT IN MY
      SCOPE with the reason.
    - >-
      No d=512 reduction was run and the 100-bit cell was not re-attempted; any
      measurement that would have been needed is NAMED rather than taken.
    - The attestation names the sibling directory and assignment as unread.
    - >-
      No status moved, no ledger record was written, nothing was committed, and
      nothing was written outside the review directory.
  return_format: >-
    Per-joint verdicts with their supporting argument or artifact, the proves-too-much
    result against BATCH-f9780d stated plainly, the named scale-only failure modes per
    defect, the J6 answer on sizing computability with what is missing, the
    admissibility ruling with its reason, and any unreached joint reported as NOT
    REACHED.
  review_plan: null
  review_plan_note: >-
    NULL BY DESIGN. This handoff is a REVIEWER's envelope, not the envelope that opens
    the round. The binding plan is written by the SNAPSHOT task TASK-20260826-9e9d53
    at coordination/goals/GOAL-MLKEM-005/batches/BATCH-762807/review-plan/review_plan.yaml
    after that archive lands and before this reviewer runs, and this reviewer's
    assignment document is derived from it.
