handoff:
  id: TASK-20260905-153d93
  from: coordinator
  to: [validator, red-team]
  created_at: '2026-09-05'
  hypothesis_id: H-MONO-39b1f0
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001

  objective: >-
    Independently verify a Coordinator-composed CANDIDATE finding
    (H-MONO-39b1f0, DEC-20260905-7c2ad9, KN-FIND-9be274 -- all three
    NOT yet accepted as established) that IDEA-20260807-5126f4's
    proposed C_2^{m-2} character-descent membership filter is refuted
    by EXISTING, already-independently-reviewed evidence
    (EXP-MONO-805a02 Stage 5 / EV-MONO-08a31f / DEC-20260830-828289),
    with ZERO new compute, via an argument-count identity connecting
    the idea's own "partial locus" to Stage 5's already-measured
    construction. This is a Coordinator interpretive act, not a new
    experiment; what needs independent scrutiny is the REASONING chain
    linking an old measurement to a new claim, not the underlying
    split-rate numbers themselves (those were already independently
    re-derived by a prior Validator+Red-Team round -- see
    EV-MONO-08a31f).

  review_plan:
    coordinator_prior: >-
      Recorded BEFORE either reviewer is dispatched. A subagent acting
      as Coordinator produced H-MONO-39b1f0/DEC-20260905-7c2ad9/
      KN-FIND-9be274, and I (the orchestrating Coordinator session)
      independently re-read the source idea, the cited evidence, and
      the actual implementation code (`experiments/EXP-MONO-805a02/
      implementation/run_experiment.py`, Stage 5, lines ~428-462) before
      writing this plan. My own reading confirms: `on_curve_points(E)`
      draws BOTH the fixed summation coordinates (P1, P2) AND the
      target (Rt) uniformly from the SAME full set of curve points, with
      no interval/factor-base restriction on either -- so Stage 5's
      target was already drawn exactly as "a genuine, unconstrained
      curve point," matching reading (ii) (T = x(R), R a real relation-
      search target) rather than reading (i) (T generic/off-curve). I
      also independently re-confirmed KN-FIND-c41ea9's own precondition
      (m-1 of m total symmetric arguments on-curve) is a purely
      algebraic curve-membership condition, unrelated to any interval
      bound a factor base might additionally impose -- so the fact that
      Stage 5's P1/P2 were NOT restricted to an interval-defined factor
      base does not weaken the argument-count identity itself. I have
      MODERATE-HIGH confidence the core identification (T is always
      on-curve because a real relation target R is always a genuine
      curve point) is correct, but I have NOT independently verified:
      (a) whether IDEA-20260807-5126f4's author intended reading (i) as
      a live alternative the record should have grappled with more
      explicitly rather than settling in one paragraph; (b) whether
      "the filter's false-positive rate equals the split rate" is an
      exact identity or merely a strong heuristic proxy -- i.e. whether
      a candidate root position could in principle be realized (split)
      yet still be correctly filtered OUT by the character tower for a
      reason unrelated to realizability; (c) whether generalizing from
      Stage 5's specific m in {4,5}, p in {211,1009} cells to
      IDEA-20260807-5126f4's own claimed locus silently drops a
      constraint the idea's own text implies (e.g. that the m-2 FIXED
      coordinates are drawn from a bounded, structured factor base
      rather than the full point set) that could change which regime
      applies. This decision is a bookkeeping/interpretive act reusing
      already-reviewed numbers, but the CONNECTIVE ARGUMENT is new and
      has not been reviewed, and it is about to set a terminal
      hypothesis status and promote a KN-FIND -- exactly the stakes this
      program requires independent review for before treating either as
      final.

    claim_under_review: >-
      (a) Is reading (ii) -- T = x(R) for a genuine relation-search
      target R, hence always on-curve -- the correct reading of
      IDEA-20260807-5126f4's own "partial locus... where relation search
      actually operates," as opposed to reading (i) (T generic/
      off-curve, per DEC-20260804-4f37d5's own GENERIC monodromy
      computation) or some third reading neither H-MONO-39b1f0 nor this
      plan considered? (b) Given (a), does IDEA-20260807-5126f4's own
      locus coincide, in argument-count structure (m-1 of m total
      symmetric arguments on-curve, one free), with EXP-MONO-805a02
      Stage 5's already-executed construction? (c) Does Stage 5's
      measured near-complete split rate (0.833-1.0) actually decide
      IDEA-20260807-5126f4's own falsification condition (a) ("filter
      false-positive rate is ~1 on the partial locus too"), or is there
      a gap between "the fibre splits completely" and "the specific
      character-tower filter this idea proposes has false-positive rate
      equal to the split rate" that H-MONO-39b1f0 elided? (d) Is the
      generalization from Stage 5's specific tested cells to
      IDEA-20260807-5126f4's own claimed scope sound, or does it drop a
      constraint (e.g. a bounded/structured factor base for the fixed
      coordinates, as opposed to Stage 5's uniform draw from ALL curve
      points) that matters?

    the_exact_code_under_analysis: |
      def stage5_m4(seed: int) -> dict:
          out = {}
          for p, a, b in [(FIXTURE_P, FIXTURE_A, FIXTURE_B), (SECOND_P, SECOND_A, SECOND_B)]:
              E = EllipticCurve(p, a, b)
              pts = on_curve_points(E)
              rng = random.Random(str((seed, p, "stage5-m4")))
              S4 = s4_expr(a, b)
              x4sym = sympy.symbols("x4")
              n_split = 0
              n_total = 0
              for _ in range(STAGE5_TRIALS_PER_CELL):
                  P1, P2 = rng.sample(pts, 2)
                  Rt = rng.choice(pts)
                  expr = S4.subs({x1: P1[0], x2: P2[0], x4sym: Rt[0]})
                  deg, roots = poly_roots_bruteforce(expr, x3, p)
                  split = len(roots) == deg
                  ...
      (verbatim from experiments/EXP-MONO-805a02/implementation/
      run_experiment.py:428-462, FIXTURE_P=211/FIXTURE_A=37/
      FIXTURE_B=57, SECOND_P=1009. Note: `pts = on_curve_points(E)` is
      the FULL point set with no interval restriction; both P1/P2
      (the "m-2 factor-base coordinates") and Rt (the target T) are
      drawn from it identically.)

    joints:
      - joint: >-
          Reading (ii) is the correct/only reasonable interpretation of
          IDEA-20260807-5126f4's "partial locus... where relation search
          actually operates" (not reading (i), and not an unconsidered
          third reading).
        assigned_to: TASK-20260905-153d93-validator
        attack_plan: >-
          Re-read IDEA-20260807-5126f4.yaml's `mechanism`,
          `object_first_candidate`, and `null_object_control` fields in
          full, independently, WITHOUT reading H-MONO-39b1f0 or
          DEC-20260905-7c2ad9 first. Write down, before looking at the
          Coordinator's own resolution, what YOU believe "the partial
          locus" means and whether T's on-curve status is determined or
          ambiguous in the idea's own text. Then read DEC-20260804-4f37d5
          in full (the source of reading (i), the GENERIC monodromy
          computation) and determine whether real index-calculus relation
          search (as this program's own prior records, e.g.
          GOAL-MONO-001's own `next_action` D-4 route, use the term) ever
          treats a target as a free/symbolic function-field parameter
          rather than a concrete curve point. If you find a THIRD reading
          under which the idea's locus does NOT coincide with Stage 5's,
          that is a break: report it explicitly, do not fold it into
          reading (i) or (ii) for convenience.
        breaking_artifact: >-
          A specific quotation from IDEA-20260807-5126f4 or
          DEC-20260804-4f37d5 that supports reading (i) or a third
          reading as at least equally defensible, undermining
          H-MONO-39b1f0's claim that reading (ii) is the idea's own
          unambiguous commitment.
      - joint: >-
          "The fibre splits completely" (Stage 5's measured quantity) is
          actually equivalent to "the C_2^{m-2} character-tower filter
          IDEA-20260807-5126f4 proposes has false-positive rate equal to
          the split rate" -- not merely correlated with it or a loose
          upper bound.
        assigned_to: TASK-20260905-153d93-red-team
        attack_plan: >-
          Construct the actual C_2^{m-2} filter IDEA-20260807-5126f4
          describes (the tower of m-2 quadratic-character conditions
          decomposing the degree-2^{m-2} root-find for x_1) from first
          principles, independently of H-MONO-39b1f0's prose claim, and
          check by direct computation on at least one Stage-5-style cell
          (p=211, curve A=37/B=57, m=4, a specific (P1,P2,Rt) triple with
          all four roots realized) whether EVERY realized root is
          actually reachable/accepted by the filter, or whether the
          filter's own bit-vector construction could reject a real root
          for a reason independent of realizability (which would mean
          "split rate" over-estimates the true false-positive rate, not
          equal it). If you find such a case, that is a break, and you
          must report whether it changes the DIRECTION of the conclusion
          (idea's condition (a) still fires, just for a different reason)
          or only its precise magnitude.
        breaking_artifact: >-
          A concrete (P1, P2, Rt) triple and its four roots where the
          idea's own filter construction rejects a root that the fibre
          nonetheless realizes (or vice versa), demonstrating split rate
          and filter false-positive rate are not the same quantity.
      - joint: >-
          Stage 5's uniform draw of P1/P2 from ALL curve points (not a
          bounded/interval-restricted factor base) does not weaken the
          transfer of its split-rate measurement to IDEA-20260807-5126f4's
          own claimed scope, because KN-FIND-c41ea9's complete-splitting
          precondition is a curve-membership fact independent of any
          interval bound.
        assigned_to: TASK-20260905-153d93-validator
        attack_plan: >-
          Read KN-FIND-c41ea9.md's own theorem statement directly and
          confirm (or refute) that its precondition is EXACTLY "x-
          coordinate of an F_p-rational curve point," with no additional
          interval/boundedness condition. If the theorem (or its actual
          proof) secretly relies on the fixed coordinates coming from a
          SMALL or STRUCTURED subset rather than an arbitrary curve
          point, Stage 5's uniform-draw measurement would not transfer to
          a genuine interval-restricted factor base, and this joint
          breaks.
        breaking_artifact: >-
          A quotation or derivation step from KN-FIND-c41ea9 showing the
          complete-splitting result depends on more than curve
          membership of the fixed arguments.

    blindness:
      mutual: true
      lifted_for: []
      rationale: >-
        Standard blind parallel round; no hardening pass has occurred yet
        for this specific candidate finding.

    proves_too_much:
      objects:
        - >-
          H-MONO-45183a's own imprimitivity claim / KN-FIND-a1f3c2's own
          C_2^{m-2} group-theoretic result, at an arity/coordinate-count
          combination that does NOT meet KN-FIND-c41ea9's m-1-of-m
          precondition (e.g. fixing only m-3 summation coordinates plus
          T, one short of the theorem).
      failure_signature: >-
        If the same "T is always on-curve because a real target is
        always a genuine curve point" reasoning, applied naively, would
        ALSO predict near-complete splitting at an arity that this
        program's own prior records (or a quick independent computation)
        show does NOT split completely, the argument over-generalizes
        and is wrong somewhere it has not been read closely enough --
        report exactly where the argument-count identity actually
        depends on the m-2-plus-T-equals-m-1 arithmetic specific to this
        record, and does not silently apply to every arity.
      assigned_to: TASK-20260905-153d93-red-team

    blind_rederivation:
      required: false
      quantity: null
      parameters: null
      blind_from: []
      assigned_to: null

    procedure_deviations: []

  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true

  budget:
    wall_clock_seconds: 1800
    memory_gb: 4
    maximum_runs: null

  completion_gate:
    - Both reviewers report on their assigned joint(s) and the shared proves-too-much control.
    - python3 tools/check_review_independence.py --batch (or manual equivalent) confirms no undeclared sibling reads.

  return_format: >-
    A validation-report.yaml / red-team-report.yaml pair under
    `experiments/` is not applicable here (no EXP-* directory backs this
    decision). Instead, each reviewer returns its verdict per joint
    (HOLD/BREAK) with the worked evidence, directly in its response, for
    the Coordinator to compose into a CORR (if any joint breaks) or an
    unqualified confirmation (if all hold) before H-MONO-39b1f0,
    DEC-20260905-7c2ad9, and KN-FIND-9be274 are archived as final.
