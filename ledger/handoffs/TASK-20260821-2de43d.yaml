  review_plan_note: >-
    YOU ARE BOUND BY THE PLAN AT review_plan_path. READ IT BEFORE YOU START; it
    is the pre-committed contract for this round and it names your joints, your
    worked attacks, your blind_from, and the Coordinator's recorded prior. The
