handoff:
  id: TASK-20260731-027
  from: coordinator
  to: idea-generator
  goal_id: GOAL-ECTD-001
  batch_id: BATCH-001
  objective: >-
    Obtain primary sources for Teske's elliptic-curve trapdoor construction and the approach-adjacent
    papers listed in inputs/ECTD-TESKE-20260731/briefing.md; upgrade KN-LIT-7261 from title-only; file
    new KN-LIT-7630..7636 for missing papers (or record exact fetch blocks); so no later ECTD experiment
    is designed against unverified summaries.
  inputs:
  - inputs/ECTD-TESKE-20260731/briefing.md
  - GOAL-ECTD-001.yaml and RQ-ECTD-001.yaml
  - Existing KN-LIT-007, KN-LIT-3748, KN-LIT-5102, KN-LIT-7261
  - knowledge/README.md entry format
  constraints:
  - >-
    Upgrade KN-LIT-7261 in place with a real abstract/contribution once Teske's paper is fetched (title
    variants: 'An Elliptic Curve Trapdoor System' / 'Trapdooring with Isogenies'). citation_verified:
    true only if the primary PDF/HTML was actually fetched and checked. Local downloads/teske.pdf is currently
    MISSING.
  - >-
    File exactly seven new entries KN-LIT-7630..7636 covering, in order: (7630) Galbraith Constructing
    Isogenies Between Elliptic Curves over Finite Fields; (7631) Jao–Miller–Venkatesan Expander Graphs
    Based on GRH; (7632) De Feo Mathematics of Isogeny-Based Cryptography (survey; cite the weak-class
    / MITM section if present); (7633) Dent–Galbraith Hidden Pairings and Trapdoor DDH Groups; (7634)
    Kutas–Petit–Silva Trapdoor DDH Groups from Pairings and Isogenies; (7635) Fried–Gaudry–Heninger–Thomé
    A Kilobit Hidden SNFS Discrete Logarithm Computation; (7636) Jacobson–Kushwaha Removable Weak Keys
    for Discrete Logarithm Based Cryptography. If a paper is already filed under another KN-LIT id, do
    NOT duplicate: write a short redirect note in sources_note.md and leave that KN-LIT-76xx as a stub
    pointing to the existing id with citation_verified matching the existing entry.
  - >-
    Do not re-file KN-LIT-007 (GHS) or KN-LIT-3748 (Extending GHS); summarize their relevance in sources_note.md
    only.
  - >-
    Every entry requires honest citation_verified and a precise citation (title, authors, venue/eprint/arxiv,
    year). Unobtainable sources: citation_verified: false with the exact obstruction.
  - >-
    Fetch preference: IACR ePrint / publisher DOI / author page / arXiv. Record URLs, HTTP results, checksums,
    and versions in sources_note.md.
  - >-
    Do not design an experiment, create no hypothesis/evidence/decision, change no official hypothesis
    status. Record requested policy, resolved model, fallback, and session independence in sources_note.md.
  - Do not fabricate fetches, citations, or paper claims.
  deliverables:
  - Upgraded KN-LIT-7261.md
  - KN-LIT-7630.md through KN-LIT-7636.md
  - sources_note.md
  artifact_paths:
  - knowledge/literature/KN-LIT-7261.md
  - knowledge/literature/KN-LIT-7630.md
  - knowledge/literature/KN-LIT-7631.md
  - knowledge/literature/KN-LIT-7632.md
  - knowledge/literature/KN-LIT-7633.md
  - knowledge/literature/KN-LIT-7634.md
  - knowledge/literature/KN-LIT-7635.md
  - knowledge/literature/KN-LIT-7636.md
  - coordination/goals/GOAL-ECTD-001/batches/BATCH-001/tasks/TASK-20260731-027/sources_note.md
  archived_by: TASK-20260731-028
  inference:
    policy: research-deep
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 3600
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
  - >-
    KN-LIT-7261 is upgraded beyond title-only OR sources_note.md records an exact Teske fetch obstruction.
  - >-
    All seven KN-LIT-7630..7636 files exist with correct frontmatter and honest citation_verified (or
    explicit redirect-to-existing-id stubs).
  - sources_note.md records fetch URLs, results, checksums/versions, and policy/model metadata.
  - No hypothesis, experiment, evidence, or decision record was created.
