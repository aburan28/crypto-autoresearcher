handoff:
  id: TASK-20260824-8c17c2
  from: coordinator
  to: coordinator
  objective: >-
    Materialize an additive, non-rewriting correction for the failed
    commit-message binding of opening snapshot task TASK-20260824-9e826a,
    preserve immutable commit 205add86b495f98edc7eef37ffb2c1b90dc898a9,
    and prepare a live dispatch queue in which the fresh correction snapshot
    archive TASK-20260824-eac248 is the sole dependency-eligible successor.
  uncertainty_reduced: >-
    Whether the otherwise exact opening snapshot can receive a durable
    additive binding correction that names GOAL-ECQ-bef741 and
    DEC-20260824-92303c without amending history, modifying the archived
    opening artifacts, or permitting the protocol producer prematurely.
  inputs:
    - TASK-20260824-e3992d
    - TASK-20260824-9e826a
    - GOAL-ECQ-bef741
    - DEC-20260824-92303c
    - BATCH-9fa73f
    - 205add86b495f98edc7eef37ffb2c1b90dc898a9
    - c57d838d910c42d089632457c97adc3a0100b948
    - coordination/goals/GOAL-ECQ-bef741/batches/BATCH-9fa73f/initial-dispatch-queue.json
    - coordination/goals/GOAL-ECQ-bef741/batches/BATCH-9fa73f/dispatch_queue.json
    - coordination/goals/GOAL-ECQ-bef741/batches/BATCH-9fa73f/archives/TASK-20260824-9e826a/receipt.yaml
    - >-
      Exact postarchive diagnostic: archive task TASK-20260824-9e826a commit
      message is missing IDs ['DEC-20260824-92303c']
  constraints:
    - >-
      Perform one Coordinator materialization invocation and zero mathematical
      searches, curve-generation runs, timeout replays, Mestre scans,
      benchmarks, candidate screens, rank computations, or other experiments.
    - >-
      Preserve commit 205add86b495f98edc7eef37ffb2c1b90dc898a9
      unchanged and reachable. Do not amend, rebase, reset, replace, recreate,
      or rewrite it.
    - >-
      Treat TASK-20260824-9e826a as invalid for downstream dependency purposes
      because its commit message omitted DEC-20260824-92303c. Preserve its
      observed parent, exact ten-path diff, hashes, and receipt as immutable
      historical observations.
    - >-
      Make the correction relation explicit through correction_of_task_id
      TASK-20260824-9e826a and correction_of_commit_sha
      205add86b495f98edc7eef37ffb2c1b90dc898a9. Do not make the invalid task a
      depends_on predecessor of the correction.
    - >-
      The live dispatch_queue.json is mutable operational state owned by
      TASK-20260824-e3992d. A Coordinator may update it to represent the
      invalid old archive and the additive correction DAG, but that mutable
      update is not evidence, is not owned by this task, and is excluded from
      this correction snapshot. initial-dispatch-queue.json remains immutable
      and byte-for-byte unchanged.
    - >-
      In the live queue, preserve TASK-20260824-e3992d as completed; represent
      TASK-20260824-9e826a as invalid with the exact binding diagnostic;
      represent TASK-20260824-8c17c2 as completed; make TASK-20260824-eac248
      queued with only TASK-20260824-8c17c2 as its dependency; make
      TASK-20260824-2218b3 depend only on TASK-20260824-eac248; and leave
      TASK-20260824-a0eb67 dependent on TASK-20260824-2218b3.
    - >-
      Embed handoffs identical to the two standalone correction envelopes. The
      TASK-20260824-eac248 queue entry must carry archive kind snapshot, source
      task TASK-20260824-8c17c2, null commit_sha, parent
      205add86b495f98edc7eef37ffb2c1b90dc898a9, empty precommit path_sha256,
      and record IDs GOAL-ECQ-bef741 and DEC-20260824-92303c.
    - >-
      Write only the four exact declared write_scope paths. Do not modify the
      goal, decision, immutable queue snapshot, old receipt, protocol handoff,
      protocol artifacts, experiments, or any unrelated file.
    - >-
      Record only an archive-binding correction. Do not change a research
      status, approve the protocol, promote knowledge, or make a mathematical
      claim.
  deliverables:
    - >-
      A standalone handoff for TASK-20260824-8c17c2 and a standalone handoff
      for TASK-20260824-eac248.
    - >-
      An archive-binding-correction record that quotes the exact failed gate,
      preserves the valid observations from the old snapshot, and declares the
      additive successor.
    - >-
      An operational observation that the live queue makes
      TASK-20260824-eac248 the sole dependency-eligible task and keeps the
      protocol producer ineligible; the queue is not a deliverable or source
      artifact of this task.
    - >-
      A truthful materializer task report recording zero experiments and no
      mathematical claims.
  write_scope:
    - ledger/handoffs/TASK-20260824-8c17c2.yaml
    - ledger/handoffs/TASK-20260824-eac248.yaml
    - coordination/goals/GOAL-ECQ-bef741/batches/BATCH-9fa73f/tasks/TASK-20260824-8c17c2/archive-binding-correction.yaml
    - coordination/goals/GOAL-ECQ-bef741/batches/BATCH-9fa73f/tasks/TASK-20260824-8c17c2/task-report.yaml
  artifact_paths:
    - ledger/handoffs/TASK-20260824-8c17c2.yaml
    - ledger/handoffs/TASK-20260824-eac248.yaml
    - coordination/goals/GOAL-ECQ-bef741/batches/BATCH-9fa73f/tasks/TASK-20260824-8c17c2/archive-binding-correction.yaml
    - coordination/goals/GOAL-ECQ-bef741/batches/BATCH-9fa73f/tasks/TASK-20260824-8c17c2/task-report.yaml
