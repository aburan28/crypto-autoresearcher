  # =========================================================================
  # REVIEW PLAN. Written 2026-10-02, before any reviewer of this round runs.
  # =========================================================================
  review_plan:
    id: REVIEW-SEMBIN-20261002-c7e1d4
    opens_round_for:
      - TASK-20261001-9b3e70 deliverables D1-D5
      - draft H-SEMBIN-c7e1d4 (proposed-records)
      - HEUR-HARVEST-FV-1, HEUR-HARVEST-FV-2 (proposed-records/heuristic-restatement.md)
      - the residual of DEC-20261002-7a3f19 R8 (the (C-yes) flag)
    object_snapshot: >-
      The bytes of coordination/tasks/TASK-20261001-9b3e70/ as committed by
      TASK-20261001-d815a6 (reviewers reported commit 4a0b13aec). The receipt
      must verify before dispatch.
    why_claim_changing: >-
      Its composition decides whether H-SEMBIN-c7e1d4 is filed, whether
      H-SEMBIN-8e7ae3 moves to `superseded`, whether HEUR-HARVEST-FV enters
      the ledger as the heuristic the V1 contract validates, and whether the
      (C-yes) residual re-arms review-breakthrough at max.
    claim_under_review: >-
      AS THE PRODUCER STATED IT. (D1) COR-GEN: a relation harvester satisfying
      G1-G4 (Shoup's generic oracle with encodings visible; the factor base as
      a list of handles with membership only by lookup; a success guarantee
      that holds for a uniformly random negation-closed list, also
      [lambda_pi]-closed on Koblitz curves with sigma-stable V; targets built
      from P and Q) makes at least c sqrt(l) - O(|F| + #targets) oracle calls
      before its first non-trivial relation, at any memory. The adaptation
      to closed lists and the non-trivial-relation form are "mine, derivation,
      unreviewed". Outside G1-G4 lie the x(Q) in V test, summation
      polynomials/Weil descent, approximate x-filters, halving/trace tests,
      Frobenius by squaring, the Riemann-Roch oracle, and the preprocessing
      and multi-instance readings. The constant is unspecified. (D2) The
      shared-table line T M = m! N |F| is "the frontier of nothing". PCS
      batched harvesting crosses the card's (C-yes) thresholds at every
      4 < w <= d, without a sub-rho cell: +7.17 bits over VOW at n = 131,
      d = w = 10. A strict hybrid pays >= 7 sqrt(l') per relation only in the
      sparse regime, and in the dense regime it tends to PCS batching. The
      derivation STOPPED there. (D3) HEUR-HARVEST-FV-1, distributional (N_2
      and m-decomposition counts of F_V are Poisson with the same law as a
      closure-matched random list), and HEUR-HARVEST-FV-2, algorithmic
      (every harvester in A_FV = G plus a unit-cost x(Q) in V test, plus a
      unit-cost pi on Koblitz curves, needs T >= (1/8) K sqrt(l / min(M, K))
      for K = |F| + 2 full-rank relations, fill charged), each with its
      falsification condition and plan V1-V4. (D4) H-SEMBIN-c7e1d4's two-layer
      statement (model layer constant-exact by identity; generic layer
      Omega(sqrt l) with unspecified c), its SILENT list, and differences
      SD-1 to SD-4 from DEC-20261001-5c9e7a R6. (D5) OPEN-A (approximate
      char-2 x-filters), OPEN-B (FFDA-type solving degree), OPEN-C
      (semi-generic membership-class lower bound; K-of-L step), OPEN-D
      (Frobenius canonicaliser beyond <+-lambda_pi>).
    coordinator_prior_meta:
      recorded_before_any_report: true
      recorded_with_knowledge_of: >-
        DERIVATION.md, heuristic-restatement.md and the H-SEMBIN-c7e1d4 draft,
        read in full for DEC-20261002-7a3f19, and the four reports of the
        previous round. Not independent of those.
    coordinator_prior: >-
      I EXPECT THE FOLLOWING.
      JR-1: the exponent-level statement HOLDS for harvesters whose success
      analysis is list-agnostic. G3 is the weak joint. "Its success guarantee
      holds for a random closed list" is a property of the ANALYSIS, not of the
      algorithm. For MITM or ENUM run on F_V itself, it is exactly what
      HEUR-HARVEST-FV-1 asserts, so COR-GEN binds F_V only conditionally, as
      DERIVATION.md section 3.4 item 2 half-concedes. I expect the verdict
      "holds, with that conditional made explicit in D4's generic layer". The
      non-trivial-relation adaptation and the Shoup-not-Maurer point I expect
      to hold.
      JR-2: NO generic harvesting configuration below the VOW column at any
      listed degree. The dense-regime hybrid's coupon-corrected cost is no
      better than PCS batching, whose margin over VOW is 2.17 + d - w/2 >=
      2.17 + d/2 and is smallest only where the index calculus has degenerated
      to rho (tiny d). I expect the sparse/dense dichotomy to survive, and IDEA
      claim (B) to be confirmed false outside the sparse regime.
      JR-3: clause 1 is well-posed and falsifiable. I expect a defect in its
      exclusion set on Koblitz curves (pi-image coincidences) and in the
      lambda_2 constant, which the statement already defers to the null. For
      clause 2 I expect its random-model justification (ii) to be the
      unreviewed weak point, and the 1/8 constant to stand as a pre-declared
      line, not a derived one.
      JR-4: OPEN-B partly duplicates KN-OPEN-d218ec / KN-OPEN-002 /
      KN-OPEN-7f0511, OPEN-D overlaps KN-OPEN-5e3dd0, and OPEN-A and OPEN-C
      are new.
      PROVES-TOO-MUCH: I expect the clause-2 counting argument to separate
      F_q^* and the high-genus Jacobians correctly, because their real oracles
      test membership in the m-fold product set or factor a norm at unit cost,
      which A_FV does not.
      WHAT WOULD OVERTURN THIS PRIOR:
      (a) a generic or A_FV harvester configuration below the VOW column at a
      listed degree, which is rule-12 material and convenes max;
      (b) a known algorithm that meets G1-G4's letter but escapes Dai's
      reduction, meaning COR-GEN's interface is wrong, not just conditional;
      (c) HEUR-HARVEST-FV-1 untestable as worded, or already contradicted by
      a structural property of F_V;
      (d) clause 2's justification applying verbatim to F_q^* or a g >= 4
      Jacobian, meaning it proves too much.
      I think (c) is the live one.
    joints:
      - joint: >-
          JR-1 -- THE COR-GEN INTERFACE. That G1-G4 bind exactly the harvesters
          Dai's reduction (Wagner 2002 section 3, Cor. 1) covers; that the
          closed-list and non-trivial-relation adaptations are sound; that the
          statement is exponent-level only (SD-1; CORR-20261002-e58c3a K14); and
          which of the model's laws (ENUM by lookup, MITM, MITM_CAPPED, X-5,
          X-6) satisfy G3 unconditionally.
        assigned_to: TASK-20261002-9e27f4
        attack_plan: >-
          Take each row of DERIVATION.md section 3.3 marked "yes" and try to
          exhibit the reduction concretely. Hand the harvester a list
          +-(r_j P + s_j Q) with known (r_j, s_j). Does it still output a
          relation with its stated probability, and is that probability
          guaranteed by the algorithm or only by a heuristic about F? I expect
          G3 to break for MITM over F_V: its success needs F_V's decomposition
          counts to be random-like, which is HEUR-HARVEST-FV-1. Then check
          whether "the first non-trivial relation gives x unless the Q
          coefficient vanishes (prob ~1/l)" survives the negation-closed and
          lambda-closed lists. Finally, check the claim that hashing needs
          Shoup's model and not Maurer's.
        breaking_artifact: >-
          A concrete harvester satisfying G1-G4 as worded for which Dai's
          reduction fails, or a row of section 3.3 misclassified, with the
          corrected statement.
      - joint: >-
          JR-2 -- THE (C-yes) RESIDUAL AND THE HYBRID DICHOTOMY. That no generic
          harvesting configuration, PCS batching, per-target golden collision
          in either regime, or a hybrid with a shared target-independent table,
          has a fill-charged total for K = |F| relations (linear algebra
          included) below the VOW column at any of the ten degrees; and that
          DERIVATION.md section 2.4's sparse/dense dichotomy holds.
        assigned_to: TASK-20261002-46ba70
        attack_plan: >-
          FINISH WHAT THE PRODUCER STOPPED. Derive the dense-regime cost with
          the coupon correction (at m = 8, S = 4 one decomposition is 70 golden
          collisions, per section 2.4) for m in {4, 6, 8, 10}, s, w and per-target
          half-domains n_h up to l, at all ten degrees. Then minimise the total
          for K = |F| relations against log2(0.886) + N/2. Attack at small d,
          where PCS's margin 2.17 + d - w/2 is smallest, and at the dense limit
          n_h -> l. Check the X-6 formula 2 + d + (N - w)/2 from vOW section 4.2
          at source (inputs/VOW-1996-PCS/), and re-derive the +7.17 at n = 131,
          d = w = 10. Report the minimum margin over everything constructed,
          per degree, with the configuration. A negative margin is the breaking
          artifact. I expect the minimum to be about +2 bits at degenerate d.
        breaking_artifact: >-
          A generic harvesting configuration whose total is below the VOW column
          at a listed degree (this convenes review-breakthrough at max), or a
          demonstration that the dichotomy or the dense-limit identification
          with PCS is false.
      - joint: >-
          JR-3 -- HEUR-HARVEST-FV-1 AND -2 AS FORMAL STATEMENTS. Quantifiers,
          null specification (closure-matched F*), exclusion sets, the
          falsification conditions' decidability, the pre-declared 1/8 line,
          the Koblitz l/(2n) replacement, the random-model justifications, and
          whether V1-V4 can falsify what they claim to test.
        assigned_to: TASK-20261002-9e27f4
        attack_plan: >-
          Try to make each clause UNFALSIFIABLE or ALREADY FALSE. For clause 1:
          on a Koblitz curve with sigma-stable V, pi-closure plus negation
          generates coincidences a + b = c + d from orbit structure. Does the
          exclusion set remove exactly these, and does F* reproduce them?
          Compute small cases by hand or scratch. Does any F_2-linear property
          of x make N_2 depart from F* by construction, for example the
          halving-trace criterion (J3 section 5)? For clause 2: is there a known
          A_FV harvester (PCS over F_V with membership-filtered steps) already
          within a factor 8 of the line, so that the 1/8 constant is not "5
          bits below" anything? Does "min(M, K)" give the right regime for
          M > K? Check that V4's falsification bar (99% UCB of mean below the
          line over >= 30 instances) can be met by a real harvester at toy l.
        breaking_artifact: >-
          A clause that cannot be falsified by its own stated test, or a
          structural property, a construction or a known algorithm that
          already falsifies it, with corrected wording.
      - joint: >-
          JR-4 -- THE KN-OPEN CANDIDATES (OPEN-A to OPEN-D). Precise enough to
          file; not duplicates of existing knowledge/open-problems/ entries or
          of KN-FIND-ffe1df; each with a measurable or settleable quantity and
          an honest exponent stake.
        assigned_to: TASK-20261002-9e27f4
        attack_plan: >-
          Read the bodies of KN-OPEN-d218ec, KN-OPEN-002, KN-OPEN-7f0511,
          KN-OPEN-3c8f51, KN-OPEN-046735, KN-OPEN-5e3dd0 and KN-OPEN-94f456,
          and KN-FIND-ffe1df (Theorem C and the additive-completion lemma's
          p > 2 assumption). Search knowledge/ for "filter", "solving degree",
          "membership", "canonicali". For each candidate, state same / special
          case / adjacent / new against each hit. For OPEN-A, check that
          "bucket gain M epsilon growing without bound in M" is the right
          observable, and that the halving-trace j = 1 gain of 2 is consistent
          with KN-FIND-ffe1df Theorem C's h bound.
        breaking_artifact: >-
          A candidate that duplicates an existing entry (with the entry id), or
          one whose statement is not settleable as written, with corrected
          text.
    blindness:
      mutual: true
      lifted_for: []
      rationale: null
      note: >-
        Neither reviewer reads the other's report within this round. Both may
        read the committed records of DEC-20261002-7a3f19, EV-SEMBIN-b6d042,
        CORR-20261002-e58c3a and the previous rounds' reports. Neither may read
        THIS FILE (TASK-20261002-c13d8e) before its own report is written,
        because the coordinator_prior lives here (DEC-20261002-7a3f19 PD-5).
    proves_too_much:
      objects:
        - >-
          F_q^* at n in {131, 256}, with the factor base the primes below B and
          the "membership test" a B-smoothness test of a lifted integer. Index
          calculus is known to win there (L_q[1/2] or better).
        - >-
          A genus g >= 5 hyperelliptic Jacobian at n ~ 160, with the factor
          base the degree-1 divisors and the membership test factoring the
          Mumford u-polynomial. Gaudry/Harley-type decomposition beats rho
          there (reproduced exactly in RT-20261002-bdda1a).
      failure_signature: >-
        HEUR-HARVEST-FV-2's random-model justification (ii) ("relations
        <~ T |F|/l + T^2/l") and COR-GEN's interface, transplanted to each
        object with its real oracle, MUST NOT bound the relation rate below
        what the known index calculus achieves. The reviewer must name the step
        that excludes the object: membership in the m-fold product set at unit
        cost, or norm factoring. With the object's GENERIC oracles they must
        still give Omega(sqrt l). If the argument bounds the real-oracle rate
        on either object, it proves too much and is wrong somewhere for F_V
        too.
      assigned_to: TASK-20261002-46ba70
      assigned_to_note: >-
        Same red-team session as JR-2, disclosed. Both attack the harvesting
        argument, and TASK-20261001-b2c916 already built these objects.
    blind_rederivation:
      required: false
      reason_not_required: >-
        No new load-bearing NUMERICAL quantity is under review. The model-layer
