handoff:
  id: TASK-20260824-7d9f92
  from: coordinator
  to: red-team
  goal_id: GOAL-DIFFP-84d641
  batch_id: BATCH-145531
  question_id: RQ-DIFFP-a5c483
  experiment_id: EXP-DIFFP-04082e
  objective: >-
    Attack the INTERPRETATION of the dependency-graph and off-diagonal package before the
    Coordinator composes it. THE COMMITTED REVIEW PLAN ASSIGNS THIS TASK'S FOUR JOINTS AND
    IS AUTHORITATIVE OVER THIS SKETCH. Coordinator's intent at opening:
    (R-a) ATTACK THE WORD PROVABLY, this round's load-bearing joint -- construct an object
    or a population for which a claimed dependency edge, or the PROVABLY_UNDETECTABLE class
    that rests on it, is KNOWN FALSE, and report WHERE IN THE ARGUMENT the survival
    happens. Candidates are a FLOOR, NOT A CEILING: a well-formed SHA-1 object OUTSIDE the
    linearized code, which this census contains none of; an object at a step range other
    than (0,79); an object whose flag is set at CONSTRUCTION rather than derived at
    SERIALISATION, so that the edge is a fact about how this program builds objects rather
    than about the key; and a population size at which the witness is vacuous.
    (R-b) ANSWER J8, J11 AND J13 -- the three round-2 joints that BROKE -- rather than
    restating them, because GOAL-DIFFP-84d641 completion criterion 4 requires it.
    Concretely: does the RC-1 refold actually close J8 for O-E, and does it leave O-D, O-C,
    O-C-prime and O-C-double-prime open as predicted? Does the off-diagonal result answer
    J13's restatement-versus-power question or reproduce it one level up? Does J11's
    finding -- that the isolating sub-arm binds nothing the verdicts depend on -- change?
    (R-c) THE CLOSURE ATTACK AND THE O-RT2 STRUCTURAL FINDING, symmetric with overclaiming
    -- confirm or refute FROM THE GRAPH that a SHA-1 membership key's apparent 2560 bits are
    at most 512 plus one flag bit on IN-CODE objects, and check whether any lane is being
    quietly closed: the MD5 lane, depth >= 2 (where "bought by argument" must not become
    "covered", and where three non-breaking subsets are already MEASURED to hide a
    known-false instrument), permissive mode, the second seed set, null family (e), or the
    four unreplicated survivors.
    (R-d) WHAT WOULD MAKE THE DIFFERING-CELL COUNT MEANINGLESS -- is it a diagnostic or is
    it being used as a decision variable; does the null-object control show the COUNTING
    RULE can be large or that the FAMILY SET can produce a large one, which are different;
    name the cheapest control that separates them; and exhibit at least one object this
    contract's author did not imagine.
  uncertainty_reduced: >-
    Whether the conclusions this batch wants to draw -- that a NOT DETECTED verdict is
    PROVABLY UNDETECTABLE, that the depth-2 lattice is bought by argument, and that a
    differing-cell count measures the instrument -- survive objects for which they are KNOWN
    FALSE. This is the first batch of this goal to claim something theorem-like, and by
    construction its counterexample cannot be in the contract, because the contract's author
    is the one who would have had to imagine it.
  inputs:
    - The committed review plan for TASK-20260824-68ba87, which assigns this task's four joints and is authoritative over the objective sketch.
    - The snapshot receipt and the exact paths it binds by path_sha256.
    - experiments/EXP-DIFFP-04082e/specification.yaml -- the frozen contract, its hard terms, its exclusion rules, its eight declared seeds and its interpretation_limits.
    - The producer's execution report and its eleven result artifacts, including run-index.json.
    - >-
      coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7/reviews/TASK-20260824-e9d21a
      -- round 2's own report and its constructions/, which are the state of the art this
      round must beat rather than restate, and which R-b must answer against.
    - EV-DIFFP-b16b01 and DEC-20260824-c5bb72 -- the composed round-2 ruling, the obstruction and its resource_check, and the successor gates.
    - The committed adjudicator under harness/diffpath/, READ-ONLY, as the substrate for any adversarial instrument you construct.
  constraints:
    - >-
      INDEPENDENT SESSION, SIBLING-BLIND. Do NOT read
      coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-145531/reviews/TASK-20260824-e1062f,
      and declare in your attestation exactly what you read.
    - >-
      DO NOT READ coordination/goals/GOAL-DIFFP-84d641/sealed-priors/**. Round 2's Red Team
      declined the Coordinator's prior deliberately so its rulings could not be a
      confirmation of it; this round the prior is placed where declining costs you nothing.
    - >-
      BLINDNESS COVERS COMMIT MESSAGES, THE MERGE DIGEST, coordination/events/main/** AND
      COMMITTED ARTIFACTS THAT RESTATE COMMIT HISTORY. Use `git log --format=%H`. If you
      encounter a finding anywhere, DISCLOSE IT UNPROMPTED AND IN FULL.
    - DO NOT COMMIT YOUR REPORT (BR-11). Leave it untracked at your declared write scope; the ledger archive commits it.
    - >-
      WRITE constructions-index.json EVEN IF YOU BUILD NOTHING (BR-8). In round 2 the six
      files carrying the load-bearing counterexample were unbindable for the second
      consecutive batch; this index is the fix and it is a declared artifact.
    - REPORT ON THE FOUR JOINTS YOU OWN AND DO NOT COMPOSE A WHOLE-CLAIM VERDICT. You cannot see the Validator's joints by construction; composing is the Coordinator's job.
    - >-
      TAKE THE PLAN'S ATTACK AS A FLOOR, NOT A CEILING. A break the plan did not anticipate
      is worth more than one it did, and round 2 measured that the plan's candidate list did
      NOT bound the pass.
    - >-
      IF THE BUDGET BINDS, REPORT AN UNREACHED JOINT AS NOT REACHED WITH WHAT YOU TRIED. Do
      not silently drop one. The budget is below round 2's measured per-joint rate and that
      is declared at opening; an overrun is to be DISCLOSED, never met by reallocating a
      ceiling.
    - DO NOT ALTER THE EXECUTOR'S RAW RECEIPTS OR THE VALIDATOR'S OUTPUT. Your constructions write into THIS TASK'S OWN DIRECTORY ONLY.
    - >-
      DO NOT MODIFY ANY COMMITTED FILE UNDER harness/. Build adversarial instruments as a
      run-time projection or wrapper and say which mechanism you used. CTL-FROZEN-3 would
      detect a modification and it would invalidate the producer's package as well as your
      own finding.
    - DO NOT READ coordination/goals/GOAL-MD5-001/quarantine/** or the same content by any other route, and attest non-reading BY MECHANISM rather than by intent.
    - DO NOT CALL A BOUNDED FAILURE AN IMPOSSIBILITY RESULT, do not reject a result merely because it is surprising, and PRESERVE THE NARROWEST VALID CONCLUSION when an object of yours breaks something.
    - >-
      DO NOT MANUFACTURE A CRYPTANALYTIC BASELINE. Pollard-rho, BSGS and the specialized
      ECDLP baselines are not the comparison class: the package makes no cryptanalytic claim
      and runs no search. The appropriate comparison is what the graph and the families'
      declarations PREDICT against what the adjudications MEASURE.
    - AN INFRASTRUCTURE FAILURE IN YOUR OWN CONSTRUCTION IS INFRASTRUCTURE SIGNAL, not a finding against the producer. Report it as such and say what remained unattacked.
    - >-
      `maximum_runs: 2` COUNTS CHARGED EXPERIMENT RUNS UNDER A CONTRACT -- run directory,
      RUN-* id, manifest, armed deadline, consumed ceiling. IT DOES NOT COUNT script
      executions, probes, adversarial constructions or unit-test invocations.
    - >-
      Record requested policy, resolved model identifier, backend, probe status and reasoning
      effort. A tier the backend cannot reach is a PAUSE, never a silent downgrade; if the
      probe verifies nothing, say so and mark the identifier self-reported.
    - WRITE EVERY PROSE VALUE AS A BLOCK SCALAR OR QUOTED THE FIRST TIME (BR-13). coordination/**.yaml is unparse-gated in CI.
    - Never Amazon Bedrock in any runtime, backend, endpoint, fallback or probe (AGENTS.md rule 16).
  deliverables:
