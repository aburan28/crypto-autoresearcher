    - Every joint the committed plan assigns is reported with holds | breaks | inconclusive under its short id, with the construction or measurement it rests on -- or as NOT REACHED with what was tried.
    - The closure attack is answered candidate by candidate, including whether `the depth-2 lattice is bought by argument` has been allowed to become `covered`.
    - A review_attestation block is present with read_sibling_reports false and read_sealed_prior false and sources_read listed honestly and completely, and any encounter with a finding through commit metadata, a PR body, the merge digest, a bus message or a committed artifact restating history is disclosed unprompted.
