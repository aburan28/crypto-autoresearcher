handoff:
  id: TASK-20260905-f615a7
  from: coordinator
  to: executor
  objective: Implement the approved EXP-ECRANK-76a70d contract exactly as written and run its enumerated
    runs (smoke, arm A, arm B, arm-B determinism re-run at seed 760708, arm C, augmentation scan + nulls,
    known-false control, one repair margin) with all controls, certificates, and blind re-derivation artifacts.
  uncertainty_reduced: Whether the delta-multiplier engine exhibits the pre-registered success criterion
    (or the derived negative branch) within the frozen boxes and counted-ops caps, with every control
    passing.
  inputs:
  - AGENTS.md
  - agents/executor.md
  - docs/task-lifecycle.md (budget floors; run manifest and execution-report schemas)
  - templates/research-records.md
  - ledger/hypotheses/H-ECRANK-ee6e0e.yaml (the specified hypothesis this experiment tests; do not modify
    it)
  - experiments/EXP-ECRANK-76a70d/specification.yaml (the approved frozen contract -- implement exactly
    as written, do not deviate)
  - ledger/decisions/DEC-20260905-cebc4d.yaml (the committed approval; execution without it verified is
    forbidden)
  - ledger/decisions/DEC-20260905-145454.yaml (design findings 1-7; the disclosed assumptions the outcome
    must be read against)
  constraints:
  - Implement EXACTLY the approved frozen contract. New engine module and drivers go under experiments/EXP-ECRANK-76a70d/source/*.py;
    NEVER edit construct_highrank.py or coset_structure.py (D4 remedy). Do not deviate from inputs, controls,
    metrics, boxes, seeds, or budgets without stopping and reporting why.
  - 'Zero descent anywhere: no PARI ellrank, no 2-descent, no r_low, no root numbers, no floating point
    inside the exact certificate part (numerical regulator admissible only as a recorded cross-check).
    descent_calls 0, pari_ellrank_calls 0, network none.'
  - 'The COUNTED exact-op cap binds, not the wall: 1.0e8 counted exact rational ops per arm, checkpoint
    every 1.0e7 ops with flushed partial artifacts. Per-arm stop at cap or 7200 s wall, whichever first;
    exhaustion is reported as exhaustion (inert both directions), never re-scored. NO early stop of arm
    B; NO box widening ever (a widening is a NEW experiment, not an amendment-by-doing).'
  - 'All invalidation rules IV-1 through IV-7 are live: known-false d=(1..1) must report 7 at n=8 and
    9 at n=10 or ALL runs void; planted synthetic misses void distributional metrics; blind re-derivation
    (C3) with declared sources_read and blind_from attestation, never reading the solver implementation;
    degeneracy filter strikes; verifier rejection fires F5; determinism re-run at seed 760708 must match
    bit-for-bit.'
  - 'Per-run manifests carry: exact command, code commit + dirty-tree state, environment/dependency versions
    (stdlib-only declaration), all seeds, inference manifest (requested policy, backend, resolved model
    id, probe-verified flag, effort, fallback/degraded record), complete stdout/stderr, raw-result.json,
    certificates, validity status + reason, timestamps and resource measurements (wall, counted ops, peak_rss_bytes
    vs the 8 GB ceiling).'
  - Do NOT interpret the results for the hypothesis (no support/close claim), do NOT change any hypothesis/goal/experiment
    status, do NOT create any DEC/KN/EV/B71 record. That is reserved for the Coordinator disposition.
  - Do NOT claim any solve, attack, speedup, novelty, closure, or breakthrough. A positive criterion outcome
    is recorded as a criterion outcome pending required review, never as a finding.
  deliverables:
  - 'experiments/EXP-ECRANK-76a70d/source/*.py: the new engine module and drivers.'
  - 'experiments/EXP-ECRANK-76a70d/runs/*/manifest.yaml + stdout.log + stderr.log + raw-result.json: one
    directory per executed run with the full manifest.'
  - 'experiments/EXP-ECRANK-76a70d/certificates/*.json: forced points, class lists, kind-split totals,
    F_l primes/reductions, Mazur witnesses, Kummer tests, verifier verdicts.'
  - Blind re-derivation report (C3), null/scan yield tables (F6 inputs), known-false outputs, planted-control
    log, determinism diff artifact.
  - 'experiments/EXP-ECRANK-76a70d/execution-report.yaml: plain factual report -- what ran, controls outcomes,
    deviations, operational limits -- no interpretation.'
  artifact_paths:
  - experiments/EXP-ECRANK-76a70d/source/
  - experiments/EXP-ECRANK-76a70d/runs/
  - experiments/EXP-ECRANK-76a70d/certificates/
  - experiments/EXP-ECRANK-76a70d/execution-report.yaml
  write_scope:
  - experiments/EXP-ECRANK-76a70d/source/
  - experiments/EXP-ECRANK-76a70d/runs/
  - experiments/EXP-ECRANK-76a70d/certificates/
  - experiments/EXP-ECRANK-76a70d/execution-report.yaml
  archived_by: TASK-20260905-6b4607
  inference:
    policy: executor-implementation
    reasoning_effort: medium
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 57600
    memory_gb: 8
    maximum_runs: 8
    budget_note: Worst-case ceiling 8 runs x 7200 s = 16 h per the contract; expected ~6-7 h. Single worker
      (maximum_workers 1); host has 14 cores / 48 GB.
  completion_gate:
  - Every executed run has a complete manifest, logs, raw-result.json, and validity status; certificates
    exist for every exhibited witness.
  - All seven invalidation rules were evaluated with recorded outcomes; any fired rule voids exactly what
    the contract says it voids.
  - The counted-ops caps and checkpoint discipline were honored; any exhaustion is reported as exhaustion
    with its completed prefix.
  - No interpretation, status change, or new B71/DEC/KN/EV record was created by this task.
  review_plan: null
  approved_by_decision: DEC-20260905-cebc4d
