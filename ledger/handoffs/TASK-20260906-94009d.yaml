handoff:
  id: TASK-20260906-94009d
  from: coordinator
  to: coordinator
  objective: RUN ALONE after all three producers have returned and before any reviewer is dispatched.
    Verify each producer wrote exactly its declared artifacts and nothing else, READ EACH leak_scan_report.yaml
    AND STOP IF EITHER REPORTS AN UNCLASSIFIABLE DIGIT RUN, commit exactly the eight producer artifacts
    plus this task's own receipt by exact pathspec in ONE commit, record that commit's sha, its parent
    and the sha256 of each of the nine paths, and record every gate as run with its verbatim output or
    as OUTSTANDING with the reason.
  uncertainty_reduced: Whether the three packages the reviewer is about to review are the packages the
    producers actually wrote, bound by CONTENT and by a real reachable commit rather than by the existence
    of files at declared paths (CF-17). And, uniquely in this batch, whether anything governed escaped
    into them before they become permanent.
  inputs:
  - The eight declared artifacts of TASK-20260906-decbd5, TASK-20260906-6c5e0a and TASK-20260906-6afb30,
    at their exact declared paths.
  - The two leak_scan_report.yaml files, which you READ AS A GATE and not as content to summarise.
  - coordination/goals/GOAL-SSI-001/batches/BATCH-1fa3fb/batch.yaml archive_topology and archive_execution_ruling.
  - ledger/decisions/DEC-20260906-376148.yaml - this batch's opening decision and the authoritative list
    of its declared deviations.
  - ledger/decisions/DEC-20260906-f709b2.yaml PD-1 and PD-3 - the archive-execution failures this task
    exists to prevent recurring.
  constraints:
  - RUN ALONE. No other task of this batch may be running. Stage ONLY the nine declared paths, by exact
    pathspec. `git add -A` is forbidden.
  - IF YOU HOLD NO SHELL, YOU CANNOT PERFORM THIS TASK AND MUST NOT PRETEND TO. A coordinator subagent
    has no shell on this runtime (MSG-20260906-dc0f1e note 2; DEC-20260906-408595 PD-2; DEC-20260906-f709b2
    PD-1). Record every gate as OUTSTANDING with that exact reason and return the task to the dispatching
    session, which executes the commit and the gates under batch.yaml archive_execution_ruling. NEVER
    INVENT A SHA, A HASH, AN EXIT CODE OR A COMMAND OUTPUT.
  - 'THE LEAK GATE COMES FIRST AND IT IS THE ONE GATE UNIQUE TO THIS BATCH. Open both leak_scan_report.yaml
    files and read their verdicts. IF EITHER REPORTS AN UNCLASSIFIABLE DIGIT RUN, OR REPORTS THAT ITS
    SYNTHETIC POSITIVE CONTROL DID NOT FIRE, DO NOT COMMIT: the batch STOPS and returns to the Coordinator.
    A leaking artifact committed is permanent. THAT IS THE WHOLE REASON THIS GATE PRECEDES CUSTODY.'
  - 'VERIFY THE PRODUCER OUTPUT SETS AND IT IS A GATE: exactly three artifacts from TASK-20260906-decbd5,
    exactly three from TASK-20260906-6c5e0a and exactly two from TASK-20260906-6afb30, at their exact
    declared paths; nothing else written anywhere in the repository; NOTHING UNDER inputs/ OR experiments/
    MODIFIED IN ANY WAY; nothing under BATCH-2e6130, BATCH-752ef2, BATCH-79a0cb, BATCH-60d6b9 or BATCH-314308
    modified; and no __pycache__ left inside a snapshot-bound directory. A SHORTFALL OR AN EXCESS IS A
    STOP that returns the batch to the Coordinator, never a note, and never repaired by writing the missing
    file yourself.'
  - COMPUTE, NEVER RECONSTRUCT. Compute the sha256 of each of the nine paths and record it as COMPUTED;
    take the commit sha and its parent from a named git command. A hash that was read rather than computed
    is labelled as read and its source named.
  - THE COMMIT MESSAGE STATES RECORD IDENTIFIERS AND LOCATORS ONLY - BATCH-1fa3fb, GOAL-SSI-001, TASK-20260906-decbd5,
    TASK-20260906-6c5e0a, TASK-20260906-6afb30, TASK-20260906-94009d and the nine paths. NO VERDICT TOKEN,
    NO FINDING, NO SEVERITY, NO COUNT, NO CHARACTERIZATION, AND ABOVE ALL NO NUMERIC CONTENT OF ANY KIND
    FROM ANY PRODUCER ARTIFACT. A commit message cannot be reverted (CORR-20260905-547849), and this batch
    handles a governed value.
  - FETCH origin/main AND MERGE IT - never rebase - before committing, and record the base commit and
    the merge outcome. A sync conflict inside an immutable record is resolved by a SUPERSEDING RECORD
    under a NEW identifier, never by picking a side and never by editing the record.
  - PUSH THE BRANCH AND OPEN OR REFRESH THE PR against main naming BATCH-1fa3fb, TASK-20260906-decbd5,
    TASK-20260906-6c5e0a and TASK-20260906-6afb30. A package that exists only in a local commit is unpublished
    and is not durable evidence, and TASK-20260906-28e6de may not be dispatched against unpublished bytes.
  - 'DO NOT READ THE PRODUCERS'' FINDINGS FOR CONTENT AND DO NOT SUMMARISE THEM ANYWHERE - not in the
    receipt, not in the commit message, not in a return message. Reading a file to hash it is not reading
    it for content, and reading a leak_scan_report.yaml''s VERDICT is a gate rather than content. IF YOU
    DO READ FOR CONTENT, SAY SO IN THE RECEIPT: you sit between the producers and the reviewer and you
    are a channel.'
  - DO NOT REPAIR ANYTHING A PRODUCER WROTE. If an artifact is malformed, record it exactly and stop.
    Repairing a reviewed object destroys the evidence.
  - Change no status, write no ledger record, approve nothing, enact nothing, touch no frozen or immutable
    artifact, do not execute cost_model.py, and do not open inputs/.
  - RESTATE THE CITATION PROHIBITION AND ITS PREDICATE EXTENSION VERBATIM in the receipt, lift neither,
    and state whether either fired on anything you wrote.
  - 'RECORD THE LAUNCHING-PROMPT DISCLOSURE FOR ALL THREE PRODUCERS (CF-15, second limb): what the dispatching
    session told each at launch, verbatim for any statement about an expected outcome, a preferred position,
    a known finding or a suspected defect - AND EXPLICITLY WHETHER THE WITHHELD coordinator_prior WAS
    SPOKEN ALOUD, AND WHETHER ANYTHING WAS SPOKEN ACROSS THE CONTAINMENT SEPARATION between the P-2 and
    P-3 readers, both of which batch.yaml forbids.'
  - Never select a provider, backend, endpoint, or model identifier containing Bedrock, case-insensitively.
  deliverables:
  - snapshot_commit_receipt.json - the leak-gate result for both scan reports, recorded FIRST; the commit
    sha and its parent; the sha256 of all nine declared paths, computed here and labelled as computed;
    the exact pathspec staged; the verbatim commit message; the three producer output-set verifications
    with their exact commands and outputs; the fetch/merge base commit and outcome; the push and PR result;
    the launching-prompt disclosures for all three producers including whether the withheld prior was
    spoken and whether anything crossed the containment separation; and EVERY GATE recorded as run with
    verbatim output and exit code, or as OUTSTANDING with the reason it could not be run.
  artifact_paths:
  - coordination/goals/GOAL-SSI-001/batches/BATCH-1fa3fb/archives/TASK-20260906-94009d/snapshot_commit_receipt.json
  write_scope:
  - coordination/goals/GOAL-SSI-001/batches/BATCH-1fa3fb/archives/TASK-20260906-94009d
  write_scope_note: EXACT AND EXHAUSTIVE. This task WRITES only its own receipt; it COMMITS nine paths
    - the eight producer artifacts plus that receipt - which is custody, not authorship. It may not modify
    a producer artifact and may not write anywhere else.
  archived_by: TASK-20260906-94009d
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 1800
    memory_gb: 2
    maximum_runs: 0
  budget_note: maximum_runs IS 0. git commands and hashing are not runs, and nothing here executes experiment
    code, a producer implementation or anything that writes a run record. This batch authorizes ZERO new
    experiment runs. AN EXHAUSTED BUDGET IS AN OPERATIONAL OBSERVATION AND IS NEVER NEGATIVE MATHEMATICAL
    EVIDENCE.
  completion_gate:
  - Both leak_scan_report.yaml verdicts were read BEFORE anything was staged, and the receipt records
    them; an unclassifiable digit run or a non-firing positive control stopped the archive and no commit
    was made.
  - Exactly the eight producer artifacts exist at their exact declared paths, nothing else was written
    into the repository, and the verification commands and their verbatim outputs are in the receipt.
  - Nothing under inputs/ or experiments/ was modified in any way, nothing under BATCH-2e6130, BATCH-752ef2,
    BATCH-79a0cb, BATCH-60d6b9 or BATCH-314308 was modified, and no __pycache__ was left in a snapshot-bound
    directory.
  - The commit changes EXACTLY the nine declared paths and archive.path_sha256 covers all nine.
  - Every sha256 in the receipt was COMPUTED here and every commit sha and parent came from a named git
    command; none was reconstructed, estimated or guessed.
  - The commit message states record identifiers and locators only, with no verdict token, no finding,
    no count and NO NUMERIC CONTENT FROM ANY PRODUCER ARTIFACT.
  - origin/main was fetched and MERGED, never rebased, with the base commit and the merge outcome recorded.
  - The branch was pushed and the PR against main was opened or refreshed naming BATCH-1fa3fb and the
    three producer task identifiers.
  - The launching-prompt disclosures for all three producers are recorded, including explicitly whether
    the withheld coordinator_prior was spoken aloud and whether anything was spoken across the containment
    separation.
  - The citation prohibition and its predicate extension are restated verbatim and neither is lifted.
  - Every gate is recorded as run with its verbatim output and exit code, or as OUTSTANDING with the reason;
    none is reported as passed without having been run.
