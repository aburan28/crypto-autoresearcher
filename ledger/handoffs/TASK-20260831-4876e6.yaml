      20000 matched-null draws per known-positive cell (h=N/2 and h=N/4,
      2 cells total), on curve RO3 only. A single run, seed 20260901, no
      replication needed per the contract's own text.
    - >-
      Dual-path (route1 vs route2) control on both known-positive cells,
      same 1e-9 relative tolerance as the rest of this lane.
    - >-
      No hypothesis, experiment, or goal status change. No ECDLP attack,
      cost, exponent, or cryptographic-scale claim. This does NOT
      re-litigate EXP-MONO-b19c6b's own "controlled null confirmed"
      reading for the per-curve Holm/permutation statistic.
    - >-
      Any timeout, crash, or construction failure is
      `failed_infrastructure`/`invalid`, never negative mathematical
      evidence (AGENTS.md rule 3).
    - "Budget: 600s wall clock, 512MB memory, 1 run. This should take well under 60s — if it's trending toward the ceiling, STOP and report as an infrastructure signal."
