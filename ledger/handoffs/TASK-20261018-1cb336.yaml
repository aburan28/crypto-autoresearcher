    seed:null; never invent0. Outer certificate.kind:none unless a genuine supported certificate exists;
    required certificate.yaml can be an explicitly limited finite worksheet witness, never fabricated
    proof/ECDLP certificate.
  - Exact required scientific outputs include raw-result.json and certificate.yaml plus native manifest;
    supervisor owns GENERATED8 and they are not declared as driver artifacts. Every extra output must
    be listed prospectively.
  - Each prospective trial-layout.json names every frozen cell/route, required artifact, method, parameter
    source, dependency, invalidation/control and unresolved ambiguity; use placeholders for unallocated
    IDs and do not claim approval/readiness.
  - No Bedrock, unavailable-model substitution, inference verification, formal proof, speedup or scientific
    interpretation claim.
