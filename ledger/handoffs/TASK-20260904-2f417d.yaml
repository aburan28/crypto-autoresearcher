handoff:
  id: TASK-20260904-2f417d
  from: coordinator
  to: [validator, red-team]
  created_at: '2026-09-04'
  experiment_id: EXP-MONO-bb6fa1
  hypothesis_id: H-MONO-572e7e
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001

  objective: >-
    Independent review of EXP-MONO-bb6fa1 and CORR-20260904-8cc20f. The
    archived run's own disposition (control_failure_instrument_result)
    is correct under the frozen specification's literal wording, but the
    Coordinator's own correction claims this was a specification defect
    (an asymptotic-plus-sampling-error tolerance wrongly applied to an
    exhaustive, deterministic population census) rather than a real
    instrument failure, and that both controls in fact pass exactly
    against the correct, independently re-derived closed-form standard.
    This review verifies that claim from scratch and assesses whether
    Stage 0's own withheld R1/R2/R3 census can now be interpreted, and
    if so, which outcome (S3 confirmed, A3 found, or neither) it
    supports.

  review_plan:
    coordinator_prior: >-
      Recorded BEFORE either reviewer is dispatched. This Coordinator
      independently re-derived the exact finite-field combinatorial
      counts from first principles (C(p,3), p^2(p-1)/2, and (p^3-p)/3 for
      split/1+2/irreducible monic cubics over F_p, summing with p^2
      degenerate cubics to p^3 exactly) and confirmed both closed forms
      -- (p-2)/(6p),1/2,(p+1)/(3p) for the unconstrained object and
      (p-2)/(3p),0,2(p+1)/(3p) for the synthetic A_3 object -- match the
      Executor's own reported values to the last digit at p=101. This
      Coordinator is confident the correction's own core claim (the
      controls demonstrate the classifier works, not that it fails) is
      correct. The genuinely open question this Coordinator has NOT
      resolved is Stage 0's own interpretation: V_R is a materially
      different kind of object (a 2-dimensional algebraic surface cut
      out by S_4=0, not simply "all cubics" or "cubics with square
      discriminant"), and this Coordinator has neither derived nor found
      an exact closed form for its own expected R1/R2/R3 at finite p.
      The observed R1=0.4952 deviates from the naive idealized 0.5 by
      0.0048 -- comfortably under both a 1/p~0.0099 and a 1/sqrt(p)~0.0995
      scale, and nowhere near the A_3 alternative of 1.0 -- but whether
      that specific deviation is itself explainable, or whether V_R's
      own geometry could produce a larger or differently-signed
      correction that would change the qualitative reading, is unknown
      to this Coordinator and is the crux of this review.
    claim_under_review: >-
      (a) Is CORR-20260904-8cc20f's own central claim correct -- do both
      nearby-object controls, judged against the correct exact
      finite-p closed form rather than the misapplied asymptotic
      tolerance, actually pass (i.e. does the classifier correctly and
      sharply distinguish the two objects, each matching its own
      derivable exact value)? (b) Is the curve/R selection and the
      Stage-0 enumeration method free of the "sample the ordered variety
      by mistake" trap IDEA-20260904-a1b81b's own confounders section
      names as the single most likely implementation error (independently
      confirm the degenerate count 203 and the enumeration logic, not
      merely the reported totals)? (c) Given (a) holds and R8 already
      passed, can Stage 0's own R1=0.4952, R2=0.5048, R3=0.1683 be
      responsibly interpreted, and if so, does the evidence support
      outcome (I) (G_R=S_3), leave it genuinely ambiguous, or suggest
      something else? (d) Is there a derivable exact or refined-
      asymptotic closed form for V_R's own expected density triple that
      would sharpen this reading, or is the qualitative "close to 0.5,
      far from 1.0" comparison the best that can honestly be said at
      this single tested (E,R)?
    joints:
      - joint: J1-CLOSED-FORM-REDERIVATION
        assigned_to: validator
        attack_plan: >-
          Independently re-derive, from scratch (not by re-reading the
          Coordinator's or Executor's own arithmetic), the classical
          finite-field counts of monic cubics over F_p by factorization
          type: split into 3 distinct roots, split as root+irreducible-
          quadratic, totally irreducible, and repeated-root (degenerate).
          Confirm these sum to p^3 exactly at p=101, and confirm the
          resulting densities match (p-2)/(6p), 1/2, (p+1)/(3p) for the
          unconstrained population and (p-2)/(3p), 0, 2(p+1)/(3p) for the
          square-discriminant (A_3) sub-population. Then independently
          verify these closed forms match `experiments/EXP-MONO-bb6fa1/
          runs/RUN-MONO-bb6fa1-1/raw-result.json`'s own reported observed
          values to the last digit -- not merely that they are "close."
      - joint: J2-ENUMERATION-METHOD-AUDIT
        assigned_to: validator
        attack_plan: >-
          Read `experiments/EXP-MONO-bb6fa1/implementation/
          run_galois_cubic_census.py` in full. Confirm the Stage-0
          enumeration iterates DIRECTLY over (e1,e2,e3) in F_101^3 (never
          choosing an ordered pair and solving for a third coordinate),
          and confirm the degenerate-stratum count (203 out of 10202)
          is computed correctly (a repeated root in the residual cubic,
          not some other condition). Independently re-verify the curve
          selection (E: y^2=x^3+x+1 over F_101, ascending-scan rule) and
          R's own true order (105, confirmed not in E[2]) using your own
          code, not the Executor's.
      - joint: J3-VR-INTERPRETATION
        assigned_to: red-team
        attack_plan: >-
          This is the substantive question. Assess whether V_R's own
          observed R1=0.4952 (deviation 0.0048 from the naive idealized
          0.5) is safely interpretable as consistent with G_R=S_3, or
          whether the deviation could plausibly reflect something else
          (a wrong |V_R| count, a subtly biased enumeration, or a
          genuine geometric effect specific to this surface that a naive
          "close to 0.5" reading would miss). Attempt to derive, or at
          least bound, the EXPECTED finite-p correction for a genuinely
          2-dimensional algebraic surface's own point-counting density
          (a Weil-bound argument: |#V_R(F_p) - p^2| = O(p^{3/2}) is
          already used for the SIZE of V_R in the specification -- does
          an analogous argument bound the discriminant-square RATE on
          V_R, or is that a materially different question requiring its
          own derivation)? If you can derive a tighter expected value or
          bound, report it. If not, say plainly that the qualitative
          reading (close to 0.5, decisively far from 1.0) is the most
          that can honestly be claimed from ONE tested (E,R), and name
          what a second (E,R) or a p-ladder check (the idea's own R5/R7)
          would add.
      - joint: J4-CORRECTION-COMPLETENESS-AND-PATTERN-AUDIT
        assigned_to: red-team
        attack_plan: >-
          Read CORR-20260904-8cc20f in full. Assess whether it correctly
          and completely characterizes the defect, or overstates/
          understates anything (e.g., does it correctly distinguish
          "the controls demonstrate the classifier works" from "the
          controls PROVE V_R's own result is correct" -- these are
          different claims and the correction must not blur them).
          Separately: this is now the THIRD time this session an
          asymptotic-vs-exact-finite-p confusion has surfaced (after
          CORR-20260904-33fbf3 on EXP-MONO-0e6e8f). Assess whether this
          recurring pattern warrants a standing, explicit rule for this
          program (e.g. in a future knowledge entry or a checklist item
          for `/design-experiment`) rather than being re-caught
          instance-by-instance, and if so, draft a one-paragraph
          statement of that rule as a recommendation.
    blindness:
      lifted_for: null
      rationale: null
      declaration: >-
        Both reviewers are launched as fresh subagents with no prior
        context; each must independently state whether it read the
        other's output or any sibling review directory before forming its
        own conclusions.
    proves_too_much:
      objects:
        - >-
          J1's own re-derived closed forms, applied to a THIRD population
          this record does not test -- e.g. the count of monic cubics with
          a repeated root itself (the degenerate stratum) -- must give
          exactly p^2 at p=101 (10201), matching both this run's own
          reported degenerate count in the unconstrained object and the
          independently-known classical fact that a monic cubic has a
          repeated root iff its discriminant vanishes, a codimension-1
          condition with exactly p^2 solutions in (e1,e2,e3)-space.
      failure_signature: >-
        If the reviewer's own re-derivation does not give exactly p^2
        degenerate cubics, the reviewer's own method has an error and
        its verdict on J1 cannot be trusted until fixed.
    blind_rederivation:
      required: true
      quantity: >-
        The exact factorization-type counts for both nearby-object
        populations at p=101, derived from first principles before
        reading the Executor's or Coordinator's own reported numbers.
      assigned_to: validator
      blind_from:
        - experiments/EXP-MONO-bb6fa1/execution_report.yaml
        - experiments/EXP-MONO-bb6fa1/runs/RUN-MONO-bb6fa1-1/raw-result.json
        - ledger/corrections/CORR-20260904-8cc20f.yaml

  budget:
    wall_clock_seconds: 3600
    memory_gb: 4
    maximum_runs: 0

  constraints:
    - Do not commit or push. Report only, in your own review directory under experiments/EXP-MONO-bb6fa1/reviews/{validator,red-team}/.
    - Do not read the sibling reviewer's directory before forming your own conclusions; disclose whether you did.
    - Do not change any research status, ledger record, or hypothesis field.

  completion_gate: >-
    Both validation-report.yaml and red-team-report.yaml filed, each
    addressing its owned joints explicitly, before the Coordinator
    composes the evidence and decision records determining how this
    result bears on H-MONO-572e7e and IDEA-20260904-a1b81b's own broader
    claim.

  inference:
    requested_policy: review-adversarial
    reasoning_effort: xhigh
    runtime: claude_code
    resolved_model_id: claude-sonnet-5
    model_verified: true
    fallback_used: false
    degraded_requirements: []
