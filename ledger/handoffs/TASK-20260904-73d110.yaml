  objective: >-
    Execute EXP-MONO-815525 exactly as frozen: derive the explicit m=4
    symmetric-base Semaev quartic Q_e(T) via resultant elimination from
    the curve group law, verify the construction, then census the
    Frobenius factorization pattern of Q_e(T) over F_p at base points
    where the residual cubic g is irreducible, testing whether it is
    always exactly (linear)(irreducible cubic) as full S_4 monodromy at
    m=4 requires.

  authorized_by: coordinator
  authorization_basis: >-
    DEC-20260904-4eb323's own next_action (2), converging with
    IDEA-20260904-ad63fe's own Stage 1 recommendation.

  construction_guidance: >-
    Derive Q_e(T) by extending this session's own already-verified S_3
    derivation method (see experiments/EXP-MONO-cb905d and this session's
    own D-5 check for precedent): encode P1+P2+P3+P4=O (equivalently
    P1+P2+P3 = -P4, x(P1+P2+P3) = T) via the addition-law relation,
    eliminate y1, y2, y3 successively via resultants against y_i^2=f(x_i),
    to get a polynomial in (x1,x2,x3,T,A,B) -- this is the ORDERED-base
    S_4, degree 4 in T and (per this program's own established fact) also
    degree 4 in each of x1,x2,x3 by symmetry. To descend to the SYMMETRIC
    base, either (a) symbolically substitute the elementary-symmetric
    relations and simplify (may be large), or (b) work NUMERICALLY: for a
    GIVEN numeric (e1,e2,e3), construct the three roots of
    g(X)=X^3-e1X^2+e2X-e3 in the appropriate extension field (F_p, F_p^2,
    or F_p^3 depending on g's own factorization), substitute into the
    ORDERED-base S_4(x1,x2,x3,T) as numeric values, and the result is
    guaranteed (by symmetry/Galois-stability of the root set) to reduce to
    a polynomial in T with coefficients in F_p -- this avoids ever needing
    the full symbolic symmetric-base formula. Option (b) is likely far
    cheaper and is the RECOMMENDED approach; use option (a) only if (b)
    proves impractical, and disclose which you used.

  verification_required_before_any_headline_result: >-
    Per specification.yaml's own Stage 0: verify Q_e(T) is degree 4 in T;
    verify it reproduces the ALREADY-DISCHARGED ordered-base result
    (H-MONO-93bc4d) when g splits completely (three rational roots) --
    i.e. the four roots correspond to actual sign-class sums of three
    genuine curve points, matching this session's own witness_search.py
    logic as a cross-check; verify basic symmetry. Do NOT proceed to
    Stage 1 if any of these fail -- report failed_infrastructure instead.

  constraints:
    - >-
      The g-irreducibility selection is a selection on the BASE POINT, not
      on the curve. Disclose exactly how many random draws were rejected
      before finding a qualifying base point, if random sampling is used;
      prefer exhaustive/deterministic search over F_p^3 if p is small
      enough to make this cheap (matching this session's own established
      preference for exhaustive over random search wherever affordable).
    - Do not silently redraw away or discard a disconfirming instance. Report it as the headline finding immediately.
    - One run directory: runs/RUN-MONO-815525-1/, full manifest per docs/evidence-and-reproducibility.md.
    - No network access. Budget per specification.yaml.
    - Any infrastructure failure is failed_infrastructure, never mathematical evidence.

  budget: see experiments/EXP-MONO-815525/specification.yaml `budget` block.

  completion_gate: >-
