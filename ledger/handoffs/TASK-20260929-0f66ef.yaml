      census-m4 manifest defects that are with the user, are recorded but
      are not this task's to fix. A mismatch or failure in (a)-(g) is a
      scope_finding and a STOP. The package goes back to the executor or to
      a Coordinator decision, and is never fixed by editing an artifact.
