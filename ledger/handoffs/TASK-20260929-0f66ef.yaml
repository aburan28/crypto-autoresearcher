      and refresh PR #1487 (or open a PR against main) naming the same ids.
      The package is not durable until the verifier accepts it.
    - >-
      Archive as produced. A failed, partial, stopped or invalid run set is
      archived with its status. It is not evidence and not negative evidence
      (AGENTS.md core rule 5). A pool break, memory stop, attempt-limit stop
      or placeholder row is failed_infrastructure.
    - >-
      LARGE FILES. If any staged file exceeds the remote's size limit, stop
      before committing and report its path and size to the Coordinator.
      Never drop, split or recompress an artifact to fit.
    - No hypothesis, experiment, evidence or goal status changes in this task.
    - Never select a provider, backend, endpoint or model identifier containing Bedrock.
