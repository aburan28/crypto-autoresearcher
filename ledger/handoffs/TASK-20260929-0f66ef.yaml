      Stage ONLY paths inside TASK-20260929-89c123's artifact_paths that
      exist, plus this card's receipt. A conditional path that does not
      exist is recorded in the receipt as absent, not as a finding. Any file
      the task wrote outside its scope is not staged; it is listed in
      scope_findings and reported to the Coordinator. No __pycache__ file and
      nothing from any scratch directory (the M-6 view included) is staged.
    - >-
      One commit whose message names TASK-20260929-0f66ef,
      TASK-20260929-89c123, AMD-20260929-430f44, AMD-20260929-1de84f,
      DEC-20260929-bb40ce, EXP-PFDR-1b78f7, H-PFDR-4765e4 and every RUN id
