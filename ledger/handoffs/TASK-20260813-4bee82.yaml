handoff:
  id: TASK-20260813-4bee82
  from: coordinator
  to: executor
  goal_id: GOAL-ECDLP-001
  sub_goal_id: SG-ECDLP-002
  question_id: RQ-ECDLP-002
  hypothesis_id: H-ISOU-c5bfea
  experiment_id: EXP-ISOU-2ac81f
  decision_id: DEC-20260813-e0077d

  status: written_not_dispatched
  status_note: >-
    Written and dispatch-ready. NOT DISPATCHED. The Executor must not be
    dispatched, and must not begin implementation or spend compute, until the
    Coordinator snapshot archive that commits EXP-ISOU-2ac81f's approval,
    H-ISOU-c5bfea's transition, DEC-20260813-e0077d, and this handoff has been
    made AND its post-commit verification accepted (docs/task-lifecycle.md
    step 6, AGENTS.md "Durable research commits"). Approval lives in a frozen
    contract at a declared path plus a committed decision record; a message
    from any agent saying "approved" is not one, and an Executor that cannot
    find both records refuses the work.

  objective: >-
    Implement and run the frozen protocol EXP-ISOU-2ac81f exactly as written,
    producing immutable, certificate-carrying run records for a complete-class
    ECDLP cost census on a P-256-SHAPED toy curve. Measure and report, per class
    member and per seed, the three separated quantities the contract defines --
    Q1 group operations to solve in a common coordinate system, Q2 field
    multiplications per group operation in each member's own cheapest reachable
    model, and Q3 charged end-to-end cost in field multiplications with the
    isogeny walk charged -- together with the null-object, seed-band,
    positive-control, BSGS cross-check, and special-j controls the contract
    mandates. Report observations. Do not interpret them.

  uncertainty_reduced: >-
    Whether the group-operation cost of solving one fixed, transferred DLP
    instance is in fact invariant across every member of a complete
    F_p-isogeny class at toy scale, and by what measured constant factor the
    field cost per group operation varies across that class -- the leg of the
    EV-ECDLP-b3e847 closure (obstruction 4, "within-class uniformity") that the
    red team recorded as empirical rather than proven, and that no record in
    this repository has measured with an actual solve.

  inputs:
    - >-
      experiments/EXP-ISOU-2ac81f/specification.yaml -- THE frozen contract, at
      version 1, status approved, approved_by coordinator. It is the sole
      authority on inputs, controls, metrics, budgets, stopping rules,
      invalidation rules, success and falsification criteria, and required
      artifacts. Where this handoff and the contract could be read as
      differing, the contract governs and the Executor stops and reports the
      discrepancy rather than choosing.
    - >-
      ledger/hypotheses/H-ISOU-c5bfea.yaml -- the hypothesis, at status
      specified, carrying HEUR-ISOU-1, the proof_search_map, the test boundary
      (solver = Pollard rho with distinguished points, matched implementation
      across curves; secondary solver = BSGS on the smallest instance), and the
      interpretation limits.
    - >-
      ledger/decisions/DEC-20260813-e0077d.yaml -- the approval, including the
      recorded resolution floor and the 24-bit budget-feasibility limitation
      that motivates the run ordering below.
    - >-
      ledger/proposals/IDEA-20260812-68e87f.yaml -- the originating proposal;
      background only, superseded by the contract wherever they differ.
    - >-
      ledger/evidence/EV-ECDLP-b3e847.yaml -- the closure this census audits.
      Read for context on obstruction 4. This task does not edit it.
    - >-
      docs/claims-and-verification.md -- claim tiers and the solution-certificate
      requirement that the run wrapper re-verifies independently.
    - >-
      AGENTS.md core rules 1-10 and the artifact policy, which bind every run
      record produced here.

  constraints:
    - >-
      FROZEN BASE CURVE. The base curve tuple (p, a, b, N, t, f) is selected by
      the declared selection procedure and FROZEN into the run manifest BEFORE
      any solve is executed. It is never chosen, re-chosen, swapped, or
      re-parameterized after any cost datum has been seen. The selection log,
      its seed, and every rejected candidate with its rejection reason are
      recorded artifacts. The frozen tuple must satisfy the contract's shape
      requirements -- ordinary, prime group order N, conductor f = 1, a = -3
      model -- and f = 1 is verified by checking that t^2 - 4p is a fundamental
      discriminant, with that check recorded.
    - >-
      FROZEN SEED BAND. The seed dispersion band is computed on the base curve
      under the 16 declared seeds and FROZEN into the manifest BEFORE any
      between-member comparison is computed or read. No between-member number
      is looked at before the band exists. The band is never widened, narrowed,
      or recomputed after member data is seen.
    - >-
      Q1 AND Q2 LIVE IN DIFFERENT REGIMES AND MUST NOT BE MIXED. Q1 is measured
      with ALL members in ONE common coordinate system -- meaning every member
      is expressed in the same model family, the same coordinate system, and the
      same arithmetic implementation, so the group-operation counter counts the
      same abstract events on every curve. Q2 is measured separately, with each
      member in its own cheapest reachable model. Mixing these two is the
      primary way this census could report a fake speedup, and doing so
      invalidates Q1 under the contract's own invalidation rules.
    - >-
      DECLARED CANDIDATE MODEL SET FOR Q2. The set of candidate models over
      which "cheapest reachable" is minimized -- and the cost rule used to rank
      them -- is declared in the manifest BEFORE measurement, so that "cheapest"
      is not selected after seeing which choice flatters a member. The
      a = -3 reachability test (a/(-3) a fourth power in F_p) and the
      Montgomery/Edwards reachability test are computed and recorded for every
      member regardless of which model is selected.
    - >-
      MATCHED SOLVER ACROSS EVERY CURVE. The Pollard rho walk function, its
      partition count, the distinguished-point parameter, and the seed schedule
      are frozen in the manifest and are IDENTICAL for class members, base
      curve, and null objects alike. A control that runs under different solver
      parameters than the members it is controlling is not a control. The
      primary-metric solver does not use the negation map or any other
      automorphism speedup, because the contract's frozen reproduction fixture
      is 0.886*sqrt(N) for plain rho; if a run departs from this, it is reported
      as a deviation and its data is not compared against that fixture.
    - >-
      DECLARED M/S AGGREGATION. Field multiplications and squarings are
      instrumented and recorded SEPARATELY as raw counts, and the aggregation
      rule used for the reported per-operation ratio (squarings weighted at
      1.0 multiplications unless the manifest declares otherwise) is frozen in
      the manifest before measurement, so that any other weighting can be
      recomputed by a reviewer from the raw counts.
    - >-
      WALK COST: MEASURED OR LABELLED MODELLED, NEVER BLURRED. The isogeny walk
      cost that enters Q3 is measured by the SAME instrumented field arithmetic
      as the solve wherever possible. If any step routes through a library
      primitive that cannot be instrumented, its cost may be computed from an
      explicitly declared operation-count formula, but that value is labelled
      `modelled` in the artifact, the formula is recorded, and Q3 for the
      affected members states which basis it rests on. A modelled cost is never
      presented as measured, and an unmeasurable and undeclared cost is reported
      as missing rather than estimated.
    - >-
      INDEPENDENT CERTIFICATE CHECKER. The certificate checker must not share
      state or code paths with the solver. Self-confirmation is not
      verification. It re-derives, independently, that the recovered k
      satisfies [k]P = Q on the base curve after pullback, and a member whose
      certificate does not verify contributes NO cost datum and is recorded in
      the defect log.
    - >-
      NULL-OBJECT GATE IS A STOP, NOT A CAVEAT. If the different-order null
      object control (at least 8 curves over a declared smaller prime p' with
      N' <= N/16) fails to separate from the class members at the resolution of
      the frozen seed band, STOP that run and report instrument failure. NO Q1
      or Q3 result may be reported from that run, in any form, including as a
      preliminary or partial observation.
    - >-
      COMPLETENESS GATE. The census is complete only when the enumerated vertex
      count equals h(disc(End(E_0))), computed independently of the walk. A walk
      that closes on fewer vertices is an incomplete subgraph and is reported as
      exactly that; it invalidates every "no member is cheaper" claim, which is
      a statement about a complete class or nothing. Report the walk's vertex
      count and the independently computed h side by side in every case,
      including when they agree.
    - >-
      VERTEX DEDUPLICATION BY F_p-ISOMORPHISM. Vertices are deduplicated by
      F_p-isomorphism class, not by j-invariant alone, and the deduplication
      rule actually used is recorded.
    - >-
      SPECIAL-j SEGREGATION. Any j = 0 or j = 1728 member is reported
      SEPARATELY and excluded from the generic band. Its automorphism group
      gives a known constant-factor rho discount that is an automorphism effect,
      not a within-class effect, and merging the two would manufacture a false
      positive.
    - >-
      RUN ACCOUNTING AND ORDER. maximum_runs 4 is resolved as two prime sizes
      (20-bit, 24-bit) times the contract's two independent instances, one run
      per (prime size, instance) census. Run the 20-bit censuses FIRST, both of
      them, and only then the 24-bit censuses. The census cost grows close to
      linearly in p because the class size itself grows like sqrt(p), so a
      24-bit census may not fit inside its 600 s budget; if it does not, that
      run is reported as budget-exhausted with an incomplete subgraph and no Q1
      or Q3 claim, and the completed 20-bit censuses still stand on their own.
      Do not react by trimming seeds, sampling the class, or otherwise altering
      the protocol.
    - >-
      TIMEOUTS AND CRASHES ARE NEVER NEGATIVE MATHEMATICAL EVIDENCE (AGENTS.md
      rule 5). A censored solve is recorded as censored with its step count at
      cutoff -- never as a slow curve, never as a member that resisted solving,
      and never as data supporting or opposing any leg of the hypothesis. A
      crash, an infrastructure failure, or an implementation failure terminates
      its run with the corresponding terminal status and is reported as
      infrastructure signal.
    - >-
      UNEXPECTED OBSERVATIONS ARE RECORDED, NOT DISCARDED (AGENTS.md rule 8).
      Failed edges, non-verifying certificates, members outside the seed band,
      and any protocol deviation go in the defect log with enough detail for an
      independent reviewer to reproduce the situation.
    - >-
      NO FABRICATION (AGENTS.md rule 9). Never invent or estimate a command,
      output, timing, count, statistic, seed, or run. Missing data stays missing
      and is reported as missing.
    - >-
      NO INTERPRETATION. The Executor implements and runs. It does NOT
      interpret results, does NOT write evidence records, does NOT assign
      evidence strength, does NOT change any hypothesis or experiment status,
      and does NOT state whether the hypothesis was supported or falsified.
      Observing that a datum meets a stated falsification condition is reported
      as the observation plus the condition it meets, and nothing further.
    - >-
      NO PROTOCOL CHANGE. The contract is frozen at version 1. If it cannot be
      executed as written, STOP and report the blocker with the exact field that
      cannot be satisfied; a change requires a versioned protocol_amendment
      approved by the Coordinator under
      experiments/EXP-ISOU-2ac81f/amendments/, and it never rewrites a raw run
      record.
    - >-
      WRITE SCOPE. Write only under experiments/EXP-ISOU-2ac81f/implementation/
      and experiments/EXP-ISOU-2ac81f/runs/. Do not edit specification.yaml, any
      ledger record, any knowledge entry, or knowledge/INDEX.md.
    - >-
      DO NOT COMMIT. Archival is a separate, isolated Coordinator step. Leave
      the artifacts in the working tree and report their exact paths.
    - >-
      LAWFUL DEFENSIVE CRYPTANALYSIS ON TOY BENCHMARKS ONLY. Toy primes at 20
      and 24 bits, generated inside this task. No live key, no wallet, no
      deployed system, no third-party data, and no real-world key material of
      any kind enters this task at any stage. Nothing produced here is evidence
      about P-256; P-256 is the shape imitated, not the object measured.

  deliverables:
    - >-
      An implementation under experiments/EXP-ISOU-2ac81f/implementation/
      covering base-curve selection, complete class enumeration by explicit Velu
      isogenies with per-edge certificates, DLP transfer, the instrumented rho
      solver, the BSGS cross-check, the independent certificate checker, and the
      instrumented field arithmetic -- with the certificate checker in a
      separate module that shares no state with the solver.
    - >-
      One immutable run record per executed run under
      experiments/EXP-ISOU-2ac81f/runs/, each reaching exactly one terminal
      status from docs/task-lifecycle.md step 6, and each containing every item
      the contract's required_artifacts list names: the base-curve selection log
      with rejected candidates and seed; the complete class enumeration with
      j-invariants, isomorphism-class ids, Weierstrass coefficients, walk paths
      and degrees, the independently computed h(disc(End(E_0))), and the
      vertex-count-versus-h comparison; every Velu isogeny with its kernel
      generator and edge certificate; the frozen DLP instance and its transfer
      to each member; per-member per-seed solve records with instrumented
      operation counts; independent certificate-verification output for every
      claimed solve; the null-object records and the frozen seed band; the
      defect log; and the run manifest with the resolved inference block and
      environment.
    - >-
      A per-run summary of the three primary metrics and the secondary metrics
      per member, in machine-readable form, agreeing exactly with the raw
      records it summarizes -- reported as measurements with their bands, with
      no interpretation, no verdict, and no evidence record.
    - >-
      A task receipt recording, for each run, the exact command, the git commit
      and dirty-tree state, environment and dependency versions, input
      parameters and seeds, the requested policy, backend, resolved model
      identifier and whether it was probe-verified, reasoning effort, whether
      fallback was used, wall-clock and resource measurements, terminal status
      with reason, and the exact artifact paths written.

  artifact_paths:
    - experiments/EXP-ISOU-2ac81f/implementation/
    - experiments/EXP-ISOU-2ac81f/runs/
    - >-
      coordination/goals/GOAL-ECDLP-001/tasks/TASK-20260813-4bee82/receipt.yaml
  artifact_paths_note: >-
    Directory-level declarations, because per-run identifiers are minted by the
    executing session. The Executor's receipt must record the exact file paths
    written under each declared directory. The run directories are expected to
    be named for the (prime size, instance) pair resolved in the constraints --
    20-bit instance A and B first, then 24-bit instance A and B. The dispatch
    queue card for this task must take its artifact_paths verbatim from this
    list; a queue whose expected paths disagree with this card makes the
    archive receipt unverifiable and `completed` unreachable.

  archived_by: null
  archived_by_note: >-
    Assigned by the Coordinator when this task is dispatched. Two isolated
    Coordinator archives are required and neither is this task's work: a
    snapshot archive of the run artifacts before any independent review, then a
    ledger archive of the review reports and the evidence, decision, and
    hypothesis records after review. The Executor never commits.

  review_required: true
  review_note: >-
    Claim-relevant: the result bears on obstruction 4 of a recorded closure
    (EV-ECDLP-b3e847). A dependent Validator task under review-adversarial in an
    independent session must exist before this task is dispatched, and must
    check expected run count, schema-complete manifests, seed integrity,
    raw-versus-summary agreement, certificate-checker independence, control
    comparability, and whether the different-order null object actually
    separated.

  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: true
    fallback_note: >-
      Under this Claude Code harness every policy alias resolves to the one
      session model (CLAUDE.md "Model policy note"); the executor role's
      `medium` reasoning effort is what binds per subagent. Recorded here rather
      than silently substituted. The run manifest must carry requested_policy
      alongside the resolved model identifier, with fallback_used true and this
      reason if they differ. Not Bedrock (AGENTS.md rule 16).
    degraded_allowed: false
    independent_session_required: false

  budget:
    wall_clock_seconds: 600
    memory_gb: 8
    maximum_runs: 4
    total_cpu_hours: 2
    maximum_workers: 1
    budget_note: >-
      Taken verbatim from EXP-ISOU-2ac81f's own budget block
      (wall_clock_seconds_per_run 600, total_cpu_hours 2, maximum_memory_gb 8,
      maximum_runs 4, maximum_workers 1). wall_clock_seconds is PER RUN. These
      are hard stops: exhausting one ends the run with a budget terminal status
      and is reported as such, never as a mathematical result, and never as
      grounds to reduce seeds or sample the class.

  completion_gate:
    - >-
      The frozen contract at experiments/EXP-ISOU-2ac81f/specification.yaml is
      status approved, approved_by coordinator, and
      ledger/decisions/DEC-20260813-e0077d.yaml exists in a verified commit
      before any compute is spent.
    - >-
      The base curve tuple and the seed dispersion band are recorded in the run
      manifest with timestamps preceding the first between-member comparison.
    - >-
      Every executed run reaches exactly one terminal status with a recorded
      reason, and every required artifact from the contract's
      required_artifacts list is present for it or explicitly recorded as
      missing with the reason.
    - >-
      Every claimed solve carries independent certificate-verification output
      from a checker that shares no state or code path with the solver; any
      member without one appears in the defect log and contributes no cost
      datum.
    - >-
      The enumerated vertex count and the independently computed
      h(disc(End(E_0))) are both reported, with the completeness comparison
      stated explicitly, for every run.
    - >-
      The different-order null-object control result is reported for every run,
      and any run where it failed to separate carries no Q1 or Q3 result at all.
    - >-
      Q1 measurements are all in the declared common coordinate system and Q2
      measurements are all in the declared per-member cheapest model, with the
      declared candidate model set and the M/S aggregation rule recorded before
      measurement.
    - >-
      Every walk-cost component entering Q3 is labelled measured or modelled,
      with the formula recorded for any modelled component.
    - >-
      No interpretation, evidence record, status change, or
      supported/falsified verdict appears anywhere in the deliverables.
    - >-
      No write outside the declared write scope, and no commit.

  return_format: >-
    The task receipt YAML described in the deliverables, plus a plain listing of
    the exact artifact paths written and, per run, its terminal status, its
    completeness comparison (vertex count versus h), its null-object separation
    result, and its three primary metrics as reported measurements with bands.
    State any protocol blocker or deviation explicitly and separately. Do not
    state a conclusion.
