  title: >-
    Lane A blind re-derivation J5 (version 2): the quantities Q0 to Q7 stated
    on this card, from their definitions and parameters alone
  objective: >-
    Compute every quantity that the quantities block of this card defines,
    from its definitions and parameters alone, and report every output it
    asks for. You are told what to compute and not how, and you read no
    other artifact of this program.
  uncertainty_reduced: >-
    Whether a column of generic-frontier budgets, a precomputation identity,
    a crossing window in one parameter at a fixed base, a crossing-window
    envelope over a range of bases, and two tie budgets are determined by
    elementary arithmetic on the stated model with its constants fixed
    exactly. A second implementation, written by someone who shares nothing
    with you, will be compared with yours afterwards. Disagreement localises
    to a model choice or to one of two named implementations.
  inputs:
