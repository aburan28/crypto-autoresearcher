    origin/cursor/semaev-2015-audit-program-5b8b; PR #1377.)
  quantities:
    what_you_are_testing: >-
      Whether a set of budget figures and crossing windows are determined by
      elementary arithmetic on the stated model, with every constant given as
      an exact form. A second implementation will be compared with yours.
    parameters:
      r: 680564733841876926932320129493409985129
      r_note: a prime of 129 bits; you may verify primality but need not
      N_prime: r divided by 262 (real number, not an integer)
      two_to_n: 2 to the power 131
      m_values: [4, 5, 6, 8, 16]
      rho_reference_definition: R = sqrt(pi times r divided by (4 times 131))
      model:
        cap_locus: B_cap(m) = (m factorial times 2^131) to the power 1/m
        mu: mu(B) = B^m divided by (m factorial times 2^131), for arity m and base size B
        attempts_per_success: A(mu) = 1 / (1 - exp(-mu)), exact, never rounded
        retry_factor: retry_m = 1 / (1 - m times exp(-m)), exact, never rounded
        shared_cost: T_shared(B, C) = B times A(mu(B)) times C + m times B^2
        per_target_cost: per_target(B, C) = A(mu(B)) times retry_m times C
        total_for_L_targets: IC(L) = T_shared(B, C) + L times per_target(B, C)
        generic_multi_target_law: rho_multi(L) = R times sqrt(L)
        window: >-
          At fixed (m, B, C), the window is the set of real L >= 1 for which
          IC(L) is strictly less than rho_multi(L).
      generic_preprocessing_frontier: >-
        For advice size S words, T_gen = sqrt(N_prime divided by S) and
        P_gen = sqrt(N_prime times S).
      comparator_inputs_bits:
        m5_D3_convention: 33.075936
        m5_proposal_convention: 32.414212
        m4_D3_convention: 11.010251
      comparator_note: >-
        Unrounded single-target per-attempt budgets in bits. They are inputs,
        not answers. At m = 5 use each in turn as B5 with C = 2^(B5 + g). At
        m = 4 use C = 2^(11.010251 + g).
      sub_cap_base_definition: >-
        x_sub = (log2 R + log2 0.6 - 2) / 2, with R as defined above; the
        sub-cap base is B = 2^x_sub.
      m5_g_values: [0, 2, 6, 10, 12, 13, 13.2, 14]
      m4_g_values: [0, 6, 10, 13, 14, 20, 25, 30, 31, 31.5, 32]
      m4_grid: >-
        log2 B on the grid x_sub + 0.01 k for integers k >= 0, up to and
        including the last grid point not above 36.000, with log2 B_cap(4)
        (your Q1 value) added as an extra point.
      m4_ranges:
        range_a: log2 B from x_sub to log2 B_cap(4), both ends included
        range_b: log2 B from x_sub to 36.000 (the last grid point not above it), both ends included
    Q0:
      name: undetermined choices
      definition: >-
        Every point at which the definitions above left you a choice (a
        rounding, an ambiguity in the model, the grid, the treatment of an
        empty window, whether contiguity is read on the grid or on the
        continuum, real versus integer arithmetic). For each, quote the text,
        list the admissible readings, and say which quantities depend on it.
      report: A list. An empty list is a result and must be stated as such.
    Q1:
      name: cap locus in bits
      definition: log2 of B_cap(m) for each m in m_values.
      report: Per m, to six decimal bits, with the factorial you used.
      tolerance: 0.05 bit
    Q2:
      name: generic frontier column at matched advice
      definition: With S = B_cap(m), log2 T_gen(m) and log2 P_gen(m) for each m in m_values.
      report: Per m, both values to four decimal bits.
      tolerance: 0.05 bit
    Q3:
      name: precomputation identity and the linear-algebra term
      definition: >-
        (a) Whether B_cap(m) times sqrt(N_prime / B_cap(m)) equals
        sqrt(N_prime times B_cap(m)) as an identity, stated symbolically and
        checked numerically at each m. (b) log2 of m times B_cap(m)^2 at each
        m, and whether it is below log2 P_gen(m).
      report: The symbolic statement, the numeric check per m, and the per-m comparison with its sign.
      tolerance: exact on (a); exact on the sign in (b)
    Q4:
      name: m = 5 crossing window at the cap base
      definition: >-
        At m = 5 and B = B_cap(5), for each B5 in m5_D3_convention and
        m5_proposal_convention and each g in m5_g_values, with C = 2^(B5 + g),
        the window as defined in the model. Report log2 of its lower and upper
        endpoints, or state that it is empty. Then the critical g per B5: the
        smallest real g above which the window is empty, to 0.01.
      report: Per B5 and per g, the two endpoints in bits or empty; the critical g per B5.
      tolerance: 1 bit on each endpoint; 0.2 on the critical g
    Q5:
      name: rho reference
      definition: log2 R.
      report: To six decimal bits.
      tolerance: 0.05 bit
    Q6:
      name: m = 4 envelope over the base
      definition: >-
        At m = 4, for each g in m4_g_values and each grid point log2 B in
        m4_grid, with C = 2^(11.010251 + g), the window as defined in the
        model. For each g and each of range_a and range_b, the envelope: the
        minimum over the range of log2 of the lower endpoint and the maximum
        of log2 of the upper endpoint over grid points with a nonempty
        window, or empty if every window in the range is empty; whether the
        union of the windows over the range is a single interval
        (contiguity); and per range the closing g, the smallest real g at
        which the window is empty at every grid point of the range, to 0.01,
        with the log2 B at which the window closes last.
      report: >-
        Per g and per range, the envelope edges in bits or empty, and
        contiguity; the closing g per range with its last-closing log2 B. In
        computations.json, the full per-grid-point table (log2 B, g, log2 of
        the lower and upper endpoints or empty).
      tolerance: 1 bit on each envelope edge; 0.2 on each closing g; exact on contiguity
    Q7:
      name: single-target tie budgets
      definition: >-
        With L = 1, the per-attempt cost C at which IC(1) equals R: (a) at
        m = 4 and B = 2^x_sub; (b) at m = 5 and B = B_cap(5). Report log2 C,
        and x_sub itself.
      report: log2 C for (a) and (b) to six decimal bits, and x_sub to six decimal bits.
      tolerance: 0.05 bit
    rules:
      - BL-1 Read only the four whitelisted repository paths. Every other repository path is out of scope.
