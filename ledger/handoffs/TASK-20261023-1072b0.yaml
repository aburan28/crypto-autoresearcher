    - 'harness/czlift_formal.py: formal_series computes w through at least z^(k+3) before forming u = w/z^3, so that log_F and exp_F are exact mod z^(k+1). It refuses or caps k >= p, raising on a non-unit denominator instead of truncating silently. The docstring states the exactness condition.'
    - 'harness/czlift_formal_check.py: an independent series derivation plus an additivity test of log_F on E1(Q_p) by its own chord law.'
