    - 'experiments/EXP-CZLIFT-7c8d73/reports/return-DEC-20261023-66af3b/defect_response.yaml: one row per defect D1-D7 with classification, the repair or the amendment item that answers it, test names and results, and the old and new sha256 of every file written.'
