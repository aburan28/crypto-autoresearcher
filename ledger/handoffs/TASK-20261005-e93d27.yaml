  constraints:
    - >-
      ZERO SCIENTIFIC RUNS AND NO IMPLEMENTATION. No G_sc, pi_c(d), slope or
      histogram of any curve or stream at any scale. Scratch arithmetic is
      allowed and labelled scratch.
    - >-
      RE-DRAFT, NOT AMENDMENT. Same id EXP-SEMBIN-e2b864, version 2, with a
      version_history entry pointing at version 1's path and its snapshot
      TASK-20261003-d05b93. Same id H-SEMBIN-9c41f7, version 2. Every change is
      listed as CH-1..CH-n with the E item it closes. Do not edit anything
      under coordination/tasks/TASK-20261003-3c8ea2/.
    - >-
      FROZEN SCIENCE. Do not change n in {19, 23, 31, 41}, the roles, S, S_E,
      S_FX, blocks or halves, eligibility 100, the slope threshold 0.10, the
      level threshold 0.10, Bonferroni 0.05 over 12 (family, rule) cells per n,
      the >= 2-n REFUTED and BOUNDED-EXCESS rules, the j_max rule, the
      families, the rules, the nulls or the controls. If closing an E item
      appears to require such a change, STOP and report it as a defect to the
      Coordinator instead of making it.
    - >-
      E3 (QUESTION). Set H-SEMBIN-9c41f7 question_id to RQ-SEMBIN-6d4e0b, with
      a question_id_note citing DEC-20261005-b7e3a9 R7 and quoting its
      fixed_question_text verbatim. Do not write the RQ record. The approval
      decision files it.
    - >-
      E4 (GATE FAILURE POWER, the JV-2 standard of DEC-20261002-7a3f19 R3,
      applied by analogy). Add all four of the following. (a) MODULE B, an
      independent recomputation, from the sealed histograms, of every per-n
      decision vector: G_sc per block and rung, beta, Delta_beta_SHA,
      Delta_beta_MM, Delta_top, the Bonferroni CIs, NULL-FLOOR, REFUTE-n and
      the outcome. It shares no code with the estimator (module A), and the
      two must agree exactly (a STOPPING gate). (b) A DECLARED MUTANT TABLE.
      Each row gives the defect class, the mutant, the expected catching gate,
      and the bias direction (FALSE-PASS, FALSE-REFUTE or neutral). Every
      FALSE-PASS row must be caught by a STOPPING gate. Minimum rows, one or
      more per JV-2 class. OFF-GRID OR MISLABEL: rung labels nested by high
      bits instead of low bits; J_top taken as the lowest four rungs; j_max
      from per-curve l instead of l_min(n). DOMAIN PREDICATE: the <P>-stream
      drawn without clearing the cofactor; Q + R = O draws kept or uncounted;
      M_eff convention replaced by RT-EXP-1's remap or NaN. ENUMERATOR:
      selection and estimation halves overlapping (in-sample leak);
      eligibility tested on half A only; the offset d range truncated; a block
      index reused. SHARED INPUT: the N-MM sigma replaced by a multiplier map
      k -> u k (a homomorphism; FALSE-PASS); N-SHA keyed on the family label
      instead of x; LR-A and LR-B sharing one alpha draw; the planted coin
      keyed on the stream index instead of the dlog. BASELINE COLUMN: nulls
      evaluated on a different stream than the families (unpaired); nulls
      evaluated on the family's own labels (FALSE-PASS); Delta_top taken
      against the smaller null; the Bonferroni quantile at 0.05/1; FX-2
      compared against an in-sample G instead of the exact pi. (c) A
      NULL-EQUIVALENCE GATE. Synthetic all-null label streams, built so that
      every family is an independent SHA relabelling, go through the full
      machinery. They must yield no REFUTE-n and no BOUNDED-EXCESS at more than
      the rate E7 states. Also a synthetic-signal gate, at slope 0.2 with
      decision-level power stated. (d) PLACEMENT. The suite runs in RUN-1
      after FX and the arithmetic gates and before any family histogram is
      unsealed. An uncaught mutant makes the experiment INVALID, not
      INCONCLUSIVE. Add every new gate to the invalidation rules and to
      required_artifacts.
    - >-
      E5. Freeze the PRP round function to ONE named choice (with its key
      derivation) in the contract, not in the manifest.
    - >-
      E6. State a numeric wall_clock_seconds_per_run for RUN-1, RUN-2, RUN-3
      and RUN-A, and the checkpoint unit (curve x block) for deterministic
      resume. CPU stays advisory. A watchdog expiry checkpoints the run and is
      never evidence.
    - >-
      E7. State, as labelled scratch arithmetic, the probability under the
      global null of REFUTED and of BOUNDED-EXCESS, given per-n Bonferroni 0.05
      over 12 cells and the >= 2-n rule (state any independence assumption
      across n). Do not change any threshold to move that number.
    - >-
      RE-RUN THE PROOF-SEARCH-MAP OBSERVATION-COLLISION AUDIT with the shared-arm
      class added. List each defect common to the family and null arms and the
      gate that separates it, or record it as an uncovered residual.
    - >-
      PARETO HONESTY. Carry dominated_by and sota_delta forward. If the checks
      were not re-done, say so explicitly, as version 1's language did.
    - NO CLAIM ABOUT THE SECURITY OF ANY CURVE in either direction.
    - >-
      IDENTIFIERS. Mint no new record id. If a shell is available, run
      `python3 tools/allocate_id.py --check` for EXP-SEMBIN-e2b864,
      H-SEMBIN-9c41f7 and RQ-SEMBIN-6d4e0b and record the output. Otherwise
      disclose that it was not run.
    - >-
      PARSE. If a shell is available, yaml.safe_load both drafts and record the
      result. Otherwise quote every scalar containing ': ', '#' or braces, and
      disclose that no parse was run.
    - >-
      INDEPENDENCE. Not the TASK-20261003-3c8ea2 session. Read no reviewer
      output on EXP-SEMBIN-e2b864 (none exists). The dispatch message carries
      the card path and nothing from any sibling task's output
      (DEC-20261003-e2a917 R7(a)).
    - >-
      WRITE SCOPE: coordination/tasks/TASK-20261005-e93d27/ ONLY. Do not
      commit. Do not edit any record.
