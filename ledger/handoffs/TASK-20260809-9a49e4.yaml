  objective: >-
    MAKE THE BATCH-001 OUTCOME OFFICIAL AND DURABLE IN ONE ISOLATED LEDGER
    COMMIT, AFTER independent validation and the red team exist as committed
    artifacts and not before. Steps, in order: (1) commit the validation and
    red-team artifacts in an ISOLATED PREDECESSOR COMMIT, because they are in
    no other declared archival path and a ledger commit must change exactly its
    own declared paths; (2) USE THE TWO IDENTIFIERS THIS QUEUE ALREADY
    DECLARED — the evidence record is ledger/evidence/EV-AES-790d63.yaml and
    the closing decision is ledger/decisions/DEC-20260809-9d8e92.yaml, both
    drawn with tools/allocate_id.py and `--check`ed free at queue time and both
    listed in artifact_paths and archive.record_ids — so DRAW NO NEW ID and do
    not rename these; if either is found bound to another record at write time,
    STOP AND ESCALATE rather than scanning for a "next free" number; (3) author
    the evidence record for what BATCH-001 actually produced, scoped exactly to
    it; (4) author the batch decision under DEC-20260809-9d8e92, filling
    `knowledge_promotion` with either a promoted KN-FIND or a concrete
    `not_warranted` reason; (5) checkpoint GOAL-AES-002 preserving EXACTLY ONE
    next action; (6) commit exactly the declared ledger paths, push, and open
    or refresh the PR against `main` naming every new record.
    THE IDENTIFIERS ARE FIXED; THE CONTENT IS NOT. Neither record exists yet
    and neither is created before this task runs. Nothing has been measured, no
    producer has run, and declaring the ids says NOTHING about what the records
    will contain: `inconclusive`, an invalid run set, or a producer returned
    incomplete are all outcomes these identifiers accommodate unchanged.
  uncertainty_reduced: >-
    Whether BATCH-001's outcome exists as durable, published, verifiable state
    — a record that exists only in a local commit is unpublished, not durable
    evidence — and whether the goal's head carries exactly one next action
    rather than an accumulation.
  inputs:
    - >-
      The committed validation report (TASK-20260809-9b0401) and red-team
      findings (TASK-20260809-33a159).
    - >-
      The committed rank-1, rank-2 and rank-3 packages and the
      TASK-20260809-877f6b snapshot receipt.
    - >-
      ledger/evidence/EV-AES-005.yaml, to be READ ONLY, so the collision below
      is verified by the executing session rather than taken on trust.
  constraints:
    - >-
      SC-1 C2 STAMP DUTY, AND IT BINDS COORDINATOR TASKS EXACTLY AS IT BINDS
      PRODUCERS. As its FIRST act, before any other work, this task writes a
      stamp record in its own task directory carrying start_utc, start_epoch,
      declared_wall_clock_seconds and a binding_stop_utc COMPUTED AT DISPATCH
      TIME as start plus declared; writes a further stamp at EACH major section
      boundary carrying utc, elapsed_s and a marker naming what was completed;
      HALTS at binding_stop_utc, records halted_on_budget truthfully and NAMES
      the work dropped; and COMMITS those stamps as a DECLARED ARTIFACT of the
      task. The TASK-20260801-810 budget block is the reference
      implementation. A halt at binding_stop_utc is INFRASTRUCTURE SIGNAL,
      never a negative mathematical result (AGENTS.md rule 5), and dropped work
      is SCOPE, never an answer.
    - >-
      SC-2 C4 DECLARATION BASIS. The declared budget is calibrated against
      AUTHORING-INCLUSIVE session elapsed, and the COMPUTE component is
      reported SEPARATELY in its own field. Compute seconds are NOT the charged
      clock and may NOT be offered as evidence of budget compliance (C3).
      Discharging SC-1 is FULL COMPLIANCE even if the dispatcher-observed
      figure later exceeds the declaration; any residual is a campaign-side
      accounting fact and is never a producer defect.
    - >-
      SC-3 COVERING MANIFEST AND CLOSED CLASS VOCABULARY, under
      protocol-amendment-GOAL-AES-001-004 Part B as corrected by
      protocol-amendment-GOAL-AES-001-005 Part C, in force from BATCH-001. AT
      LEAST ONE machine-readable manifest of this task, DESIGNATED THE COVERING
      MANIFEST by this card and by the manifest itself, carries an
      `artifact_provenance` list covering EVERY declared artifact of the task,
      and EVERY OTHER MANIFEST OF THE TASK MUST APPEAR AS AN ENTRY IN IT. Entry
      fields: path, kind, sha256, comment_block_inference_stanza (boolean,
      stated honestly including when false),
      covered_by_this_manifest_inference_block (boolean). A self-referential
      digest is impossible and is recorded as SELF. THE `kind` VOCABULARY IS
      CLOSED AND CASE-INSENSITIVE — SOURCE_CODE, MACHINE_READABLE_MANIFEST,
      PROSE_REPORT, LEDGER_AND_COORDINATION_RECORD — matched ignoring
      underscore/hyphen/space differences; NO FIFTH CLASS MAY BE INVENTED, a
      value outside the vocabulary is a DEFECT TO REPORT rather than a class to
      create, and any machine-readable structured-data artifact resolves to
      MACHINE_READABLE_MANIFEST. Every declared SOURCE_CODE artifact
      additionally carries a comment-block inference stanza in its own text.
      THE COVERING MANIFEST OF THIS TASK IS ledger-archive-receipt.json.
    - >-
      SC-4 R5 ANTI-LAUNDERING CLAUSE, QUOTED VERBATIM FROM RQ-AES-002
      claim_tier_ceiling AND BINDING AS A COMPLETION GATE ON EVERY DELIVERABLE
      OF THIS TASK: "R5. THE ANTI-LAUNDERING CLAUSE. Any record, in any
      location, that states a margin MUST in the SAME SENTENCE (i) name the
      reference as exhaustive key search at the stated key size under CM-1, and
      (ii) declare the published-state-of-the-art comparison UNADJUDICABLE in
      this environment. Transcribing a definitional-reference margin as a
      state-of-the-art margin — in a headline, an evidence record, a decision,
      a synthesis, a status line, a cross-reference, a knowledge entry, a PR
      title or a commit message — is a CLAIM-TIER VIOLATION and is handled
      exactly as docs/claims-and-verification.md handles dropping a conditional
      qualifier: as an assertion above what the record supports. OPERATIONALLY,
      under docs/inventor-protocol.md section 5: every ideation and closure
      deliverable under this question sets `dominated_by: "unresolvable in this
      environment: no primary source reachable; every recalled frontier row is
      unverified-from-memory"` and NEVER `null`, because `null` asserts the
      frontier was checked row by row and it cannot be. `sota_delta` records
      the DEFINITIONAL-REFERENCE delta, explicitly labelled as such, plus the
      word `unadjudicable` for the published frontier."
    - >-
      SC-5 EVERY DELIVERABLE STATING A MARGIN CARRIES THE R5 CLAUSE IN THE SAME
      SENTENCE AS THE MARGIN. Not in a footnote, not in an appendix, not in a
      later paragraph, not in a preamble that the sentence itself does not
      repeat. THIS INCLUDES THE COMMIT MESSAGE AND THE PR TITLE, which R5 names
      explicitly.
    - >-
      SC-6 NO RECALLED LITERATURE FIGURE MAY BE CITED AS AUTHORITY, IN EITHER
      DIRECTION. Every literature statement is UNVERIFIED-FROM-MEMORY
      (eprint.iacr.org, csrc.nist.gov and arxiv.org are unreachable under this
      harness's network policy) and must be marked inline at the point of use.
      It may not be used to promote, dismiss, rank, screen or size anything.
      Using a recalled number to DISMISS a candidate is the same fabrication as
      using it to PROMOTE one, and is additionally the premature-closure
      failure mode CLAUDE.md names as symmetric with overclaiming. Two agreeing
      recollections are ONE draw from a correlated pair, not two.
    - >-
      SC-7 NO COMPARISON AGAINST THE PUBLISHED STATE OF THE ART IS ASKED FOR BY
      THIS CARD, AND NONE MAY BE SUPPLIED. The only quantitative reference
      under this question is the DEFINITIONAL exhaustive-key-search reference
      of R1. `dominated_by` is set to the R5 string and NEVER to null.
    - >-
      SC-8 NO REDUCED-ROUND FINDING IS ASSERTED UNDER THIS GOAL. Reduced-round
      work is admissible here only as a validation-ladder instrument for a
      full-round mechanism, carries `toy` tier, and where it yields a result
      ABOUT reduced-round AES it is recorded under RQ-AES-001's ceiling and
      cross-filed there, never asserted here.
    - >-
      SC-9 ANYTHING NOT ATTEMPTED IS NAMED OPEN AND UNATTEMPTED and is NEVER
      recorded as tried, screened or negative (AGENTS.md rules 5 and 8). A
      count of things not reached is not a finding about the problem.
    - >-
      SC-10 CONCURRENCY. max_concurrent is 3 ACROSS BOTH AES GOALS, not 3 each.
      If GOAL-AES-001 BATCH-005 is in flight and dispatching this task would
      exceed the cap, THIS BATCH WAITS: record WAITED_ON_CONCURRENCY_CAP with
      the time waited and dispatch later at full budget, full deliverable set
      and full review chain. Never run degraded. Measured at drafting time on
      the host by the dispatching session: 14 physical cores, 48 GB RAM, load
      averages 40.48 / 43.60 / 40.25 — heavily oversubscribed. That is a
      measurement at drafting time and NOT a forecast of the load at dispatch
      time; re-check the cap immediately before dispatch.
    - >-
      DO NOT USE EV-AES-005. THIS IS A CORRECTION TO THE COMMITTED GOAL
      next_action AND IT IS STATED PLAINLY RATHER THAN ROUTED AROUND SILENTLY.
      The GOAL-AES-002 next_action instructs this archive to carry
      `EV-AES-005`. THAT IDENTIFIER IS ALREADY BOUND TO GOAL-AES-003:
      ledger/evidence/EV-AES-005.yaml carries hypothesis_id RQ-AES-003 and
      task_ids TASK-20260802-902 through TASK-20260802-908. Read that file
      yourself and confirm it before proceeding. Reusing the id would shadow a
      committed immutable record of another goal — exactly the identifier
      collision CLAUDE.md's ID-allocation rule exists to prevent. DO NOT EDIT,
      SUPERSEDE, RENAME OR CITE EV-AES-005 AS THIS BATCH'S EVIDENCE. THE REMEDY
      IS NOW A DECLARED IDENTIFIER RATHER THAN AN INSTRUCTION TO MINT LATER:
      this batch's evidence record is EV-AES-790d63 and its closing decision is
      DEC-20260809-9d8e92, both drawn with tools/allocate_id.py and `--check`ed
      free at queue time and both declared in artifact_paths and
      archive.record_ids. Use exactly those, draw no new id, and if either is
      found bound to another record at write time STOP AND ESCALATE; do not
      fall back to a scanned "next free" number, which is the bug the allocator
      exists to remove.
    - >-
      RUN ALONE, AND MAKE THE PREDECESSOR COMMIT SEPARATELY. The ledger commit
      changes EXACTLY the declared ledger paths; the validation and red-team
      artifacts and any knowledge entry go in the isolated PREDECESSOR commit
      immediately before it. This is planned here, not discovered late.
    - >-
      BEFORE COMMITTING, FETCH origin/main AND MERGE IT (merge, never rebase).
      Record the base commit checked and the merge outcome in the receipt.
      Never resolve a sync conflict by editing a record — stop and create a
      superseding record.
    - >-
      FILL knowledge_promotion EXPLICITLY. Promote a KN-FIND only if the
      decision is `support` or `reject_scoped` on `replicated` or `strong`
      evidence; otherwise record a concrete `not_warranted` reason. If a
      promotion is warranted, the KN-FIND entry under knowledge/findings goes
      in the PREDECESSOR commit, not the ledger commit. knowledge/INDEX.md IS
      REGENERATED BUT NOT COMMITTED AND IS NOT IN THIS TASK'S WRITE SCOPE: it
      is a generated artifact, `.gitignore`d under CLAUDE.md's concurrency
      rules. Follow the /curate-knowledge conventions in force at write time
      rather than this card's recollection of them, and record which you
      followed.
    - >-
      PRESERVE EXACTLY ONE NEXT ACTION on the goal checkpoint, and preserve any
      superseded instruction verbatim under its own clearly named key rather
      than destroying it.
    - >-
      SCOPE THE EVIDENCE RECORD TO WHAT WAS ACTUALLY PRODUCED. BATCH-001
      produces a cost model, a certificate-vocabulary amendment, an adoption
      record, an object enumeration and a measured envelope receipt. NONE of
      those is a cryptanalytic result, and the enumeration is explicitly NOT a
      completion (non_completion_criteria (i)) and the envelope receipt is
      explicitly NOT a completion (non_completion_criteria (vi)). Do not let a
      batch that produced infrastructure and an enumeration be recorded as a
      batch that produced a finding about AES.
    - >-
      NO STATUS TRANSITION IS PRE-AUTHORISED BY THIS CARD. Do not transition
      GOAL-AES-002, do not open or move a hypothesis, and record no completion
      attestation. `completed` is unreachable for this goal under GOAL-AES-002
      completion_reachability and no attestation may be recorded that was not
      obtained.
    - >-
      DO NOT COMMIT, CITE OR ATTACH the pre-existing gates/, ideation/ or
      ideation2/ directories. They are not this batch's artifacts and are not
      evidence for anything in it.
