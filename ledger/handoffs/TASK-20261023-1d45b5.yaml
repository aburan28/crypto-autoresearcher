    claim_under_review: 'Let E/F_p be ordinary with a subgroup <P> of prime order n != p, and E^/Z_p ANY lift of
      E (the Serre-Tate canonical CM model or an arbitrary integer lift). Reduction E^(Q_p)[n] -> E(F_p)[n] is a
      group isomorphism, so s_tor(R) = the unique n-torsion lift of R is a canonical section on <P>; it is computable
      as P^ - [n^{-1} mod p^k]([n]P^) from any Hensel lift P^, costing at most 2(bits(n) + bits(p^k)) + 1 complete
      additions. It is a homomorphism, it does not depend on the Hensel start, and [n] s_tor(R) = O at every precision,
      so the Smart functional z([n] s(R)) VANISHES on it. For every other section s, z([n]s(Q))/z([n]s(P)) equals
      z(tau_Q)/z(tau_P) with tau_R = s(R) - s_tor(R) in E^(pZ_p): the attack output depends only on the non-canonical
      part of the section, and for the Hensel, naive-integer and Teichmuller sections it equals d mod p at the random
      rate 1/p, on the canonical curve lift and on an arbitrary lift alike. Hence the asked-for "computable canonical
      section" exists and is not a break: the user''s claim that it "would be a full break" is predicted FALSE as
      stated.'
    coordinator_prior: I expect every identity to hold because each is a theorem (Hensel uniqueness of prime-to-p
      torsion); the open question is whether 'computable canonical section exists and is useless' refutes the H2
      'full break' clause or only one reading of it. This is a prior, not an outcome.
    joints:
    - id: R1
      joint: The torsion section is the canonical section H2 asked for, so the evidence contradicts the H2 clause
        that a computable canonical section would be a full break, rather than only exhibiting a trivial section.
      assigned_to: TASK-20261023-1d45b5
      attack_plan: Read H2 (RQ-CZLIFT-b9f765 and the user's source statement in the hypothesis) and decide whether
        its 'canonical section' means a homomorphic section, a section compatible with the formal-group filtration,
        or a section that carries the discrete log into Z_p. Show which reading the torsion section meets and which
        it cannot. Check the cited Katz reference, which the validator flags as recalled with no verifier.
      breaking_artifact: A reading of H2 under which the torsion section is not the object asked for, so the 'contradicts'
        inference overreaches.
    - id: R2
      joint: The other sections' failure is measured against the right null with enough power.
      assigned_to: TASK-20261023-1d45b5
      attack_plan: 'Compute the detectable excess at 4 sigma per arm (validator: only rates 3.9 to 4.7 times 1/p
        are flagged), and the unstated S = O exclusion. Decide whether the arm comparison (CM-canonical versus arbitrary
        lift) has any power to show the curve lift matters.'
      breaking_artifact: A section family that leaks at a useful rate and passes the test.
