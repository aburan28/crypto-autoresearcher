    (3) G2: the F-1..F-3 fixture at p' = 16777291; G3: the JV anchor
        system-and-trace identity at p' = 16777291; G4: the frozen controls;
    (4) only if RB-4's condition holds for each of G1..G4 (run_status
        completed_valid with gate_pass true AND the r4 checker, run by the
        wrapper at admission time, exits 0) AND REG-1 passed: the 23
        post-gate packages (F-4, builds, cells, aggregate), in plan order,
        each admitted as RL-4 words it; contingency ids only under R-12.
    Write execution-report-v2-r4.yaml on ANY outcome. Observations only.

