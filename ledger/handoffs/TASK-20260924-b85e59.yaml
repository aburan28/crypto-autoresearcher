  constraints:
    - id: R4P-1
      text: >-
        OBEY PROTOCOL 2-r4 EXACTLY: v2 as DEC-20260923-e788a1 approved it
        (AC-1..AC-6; TASK-20260923-cd932c EC-1 and EC-3..EC-10 as rules), read
        with every text and condition DEC-20260924-daf670 LKA-2 lists, in its
        order. Do not edit the specification, any amendment, either r4 plan,
        any frozen or preserved tree, HEUR-GFPN-DFLAT or any threshold. Run
        only packages reserved in trial-plan-v2-r4.json, only through the r4
        wrapper, only in plan order. Never invoke v2_run_wrapper.py,
        a1_run_wrapper.py, or the r1, r2 or r3 wrapper. Never use a retired id
        (162).
    - id: R4P-2
      text: >-
        THE REPAIRED GATE (PS-4; SE-4 with SF-4; RB-4; RL-4). G1 first. REG-1
        (d-parsed) is evaluated by the r4 wrapper before it admits G2, and its
        complete output, with solver-events.json quoted in full, is quoted
        verbatim in execution-report-v2-r4.yaml whatever it finds (RC-7; SE-4
        (e)). Any post-gate package runs only when, for EACH of G1..G4,
        run_status is completed_valid with gate_pass true AND the r4 checker
        (the frozen v2_check_run in its own process plus the r4 checks: the
        RF-3 verdict with RL-3 recorder gaps under RH-1 attribution, the RI-1
        counts and the RJ-1..RJ-4 detectors) exits 0, AND REG-1 passed. The
        admitted package's manifest records gate.gate_package_checker per gate
        package (command, exit status, output verbatim).
        - A REG-1 failure ends the stage before G2. It is read as "the repair
          layer is not behaviour-neutral at 4111, or the pipeline is
          non-deterministic beyond the SSF re-solve rule", naming both, never
          as a result. A REG-1 (b) difference in any instructions_callgrind
          field is read by CG-4.
        - A failure or refusal of any of G1..G4 ends the stage at the gate,
          classified per DEC-20260923-e788a1 AC-5 unchanged, with every named
          gap and recorder gap quoted. A frozen-checker failure attributable to
          the callgrind child's cap read-back is read by CC-3.
        - Neither is ever a mathematical result about the quotient. No
          contingency id is ever used for a gate package. The repair of a
          repair is a successor task under a new Coordinator decision.
    - id: R4P-3
      text: >-
        THE RE-SOLVE RULE (SE-2 with SF-1, SF-2, SF-3; SC-11), applied by the
        phase-A-bound layer, by code and never by hand, to every classified
        solve of every package. The Executor never re-runs a package, a target
        or a solve by hand, and never selects among attempts. Every attempt is
        preserved (.ssf-attempt<k> files, RB-1 records and solver-events.json).
        A consistency violation (SE-2 (4), SF-2 (b)) or an RB-1 recording
        failure ends that package failed as implementation_error, never a
        result. CC-8 (c) applies.
    - id: R4P-4
      text: >-
        THE CALLGRIND SITE (CG-2; CG-3; CC-4; VA-6 (c)). S-3 is never
        re-solved. Its records are RECORDED AND REPORTED ONLY and gate
        nothing; its launch is bound to RB-1 (e) (RJ-1), which is written as
        DEC-20260924-daf670 LKA-9 words it. A non-ok callgrind child leaves
        instructions_user null; that cost measurement is reported missing,
        never estimated and never re-measured.
    - id: R4P-5
      text: >-
        THE VERDICT (RK-3 (b); RF-3; LKA-8; LKA-10). Each package's r4 verdict
        is PASS, PASS_ZL or FAIL only as the incorporated texts define them.
        Every named gap (COUNT, SITE COUNT, DUPLICATE-PATH, CALLGRIND COUNT,
        CALLGRIND SITE COUNT, COMPARATOR COUNT, UNKNOWN-KIND) and every
        recorder gap is quoted in the report with its package. A FAIL is never
        repaired, re-run or reinterpreted inside this task; it is read under
        RF-0 (d) and RG-5 as the texts word them.
    - id: R4P-6
      text: >-
        MEMORY ENVELOPE, MACHINE PROTECTION (AC-1; RC-10; LKA-13), identical to
        v2: child RLIMIT_AS 10737418240 set in the child and read back with
        getrlimit into each manifest; a child that cannot set it refuses to
        start; driver RSS at most 1 GiB, checked before each launch; one
        memory-heavy process at a time; task envelope at most 11 GiB; msolve
        -t 1; the lowered cap if the dispatcher's guard threshold is below
        12.0 GB, recorded; the full A-6 envelope tuple on every not_measured
        row; the A-7 pre-declared early stop. Watchdogs are exactly
        trial-plan-v2.json's (R-9). Every SE-2 attempt has the same cap and
        per-target timeout as attempt 1. GFPN_V2_CAP_BYTES is unset in the
        wrapper environment, checked and recorded before G1.
    - id: R4P-7
      text: >-
        LAUNCH RULE (RB-8; PS-5; CORR-20260923-fb1be8 XD-2). Each package is
        launched through the r4 wrapper in the RB-8 form `( setsid -w python3
        -B <r4 wrapper> <RUN-ID> > <out> 2>&1 < /dev/null; echo
        "wrapper_exit=$?" >> <out> ) &`, recorded verbatim with the status in
        the report, with no outer guard (no timeout, ulimit, nice, taskset or
        wrapper script). The dispatching session's memory guard is declared in
        the task receipt before launch, with its threshold.
    - id: R4P-8
      text: >-
        SEGMENTS. Segment 1 is the gate (G1, REG-1, G2, G3, G4); later segments
        are contiguous blocks of post-gate packages in plan order. At each
        boundary the Executor appends a progress checkpoint to
        execution-report-v2-r4.yaml (packages completed, statuses and r4
        verdicts, SSF counts, callgrind-site counts, next package id) and may
        renew the lane claim at epoch + 1. A segment never reorders, skips or
        repeats a package, and a checkpoint is never a result. On a wall-clock
        or claim expiry the Executor records every planned package not yet run
        as not_attempted with the reason, and returns.
    - id: R4P-9
      text: >-
        TIMEOUTS, OOM, CRASHES, positive_dimensional and
        degenerate_parametrisation outcomes (including an SSF class that
        persists after the last allowed attempt, and resolve_cap_reached) are
        recorded with their class and envelope tuple. They are never measured
        non-decompositions or evidence about D (AGENTS.md core rule 5; EC-7).
        Every per-cell watchdog that fires after a target with at least one
        re-solve is flagged watchdog_after_resolve; its not_attempted targets
        are never evidence (SF-2 (d); SJ-6).
    - id: R4P-10
      text: >-
        MANIFESTS (PS-5; RC-2; RC-3; SE-2 (5); SC-11 (b); HR-8; CG-3; CC-4;
        RB-2; RL-1; RL-5). Each records: task_id TASK-20260924-b85e59 (never
        any of the eight R-13 ids); protocol_version "2-r4"; the amendment
        blocks for the seventeen LKA-1 files with id, sha256 and decision or
        standing; derived_from; code.phase_a_commits literally
        (TASK-20260923-0fa03f fb4597b2014b44a0c9528d48d3ab9997b46f038c;
        TASK-20260924-4a47e5 phase A, with its source); clean flags for the
        implementation trees; resources.pari_stack with the read-backs and the
        redirection, SE-3 and RL-1 install read-backs; the RB-2 accounting;
        the `solver_events` block per site with the callgrind-site counts;
        PYTHONHASHSEED "0" read back; gate.regression_REG-1 and
        gate.gate_package_checker from G2 on; the child getrlimit read-back,
        threads executed, host RAM and swap; watchdogs and their equality with
        trial-plan-v2.json's; dependency versions; and the inference block
        (requested policy executor-implementation, the resolved binding as the
        session provides it, fallback_used). No model id is invented.
    - id: R4P-11
      text: >-
        REPORTING (SE-2 (7); SF-2 (e); SC-4 with RB-3; HR-8 and CG-3
        extended). execution-report-v2-r4.yaml tabulates, per package and per
        cell, the r4 verdict with every named gap and recorder gap; SSF
        attempts per clause (i)-(v), re-solves, solves still SSF after the
        last attempt, every resolve_cap_reached and every
        watchdog_after_resolve, with their tags; the callgrind site separately
        (children observed, callgrind_result_present counts, log-visible SSF
        indicators, quotient-dimension mismatches, read-backs differing from
        the requested cap); and the SC-4 parametrisation accounting for every
        recorded ok attempt with a retained .ms.out. A violation is recorded
        verbatim and routed to review (SJ-5); it triggers no re-solve,
        reclassification or exclusion. These tables are reported, never tuned,
        and never read as information about D.
    - id: R4P-12
      text: >-
        CEILING AND CONTINGENCY. At most 31 packages under this card (27
        planned + 4 contingency), and at most 48 in the lineage over the ten
        plans (R-11; 6 existing + 42 reserved). A contingency id only under
        R-12 (within this plan; never for a gate package). Reaching a ceiling
        before the plan completes is an impediment for a new decision, never a
        result.
    - id: R4P-13
      text: >-
        WRITE ONLY INSIDE write_scope. Every v1, v2, v2-a1, r1, r2, r3 and r4
        layer path, and every existing run package, are READ-ONLY. No run
        directory is overwritten. The r4 layer and plans are bound by phase A
        of TASK-20260924-4a47e5 and are not edited. Disclosed transient
        scratch outside the repository is outside write_scope's reach and is
        listed in the report.
    - id: R4P-14
      text: >-
        NO SECURITY STATEMENT (DC-9; LKA-13). Band figures are emitted only per
        DC-2 B-3, next to their own convention's constant, labelled modeled.
        The report states no security level and draws no supported or refuted
        conclusion about H-GFPN-9a29be or HEUR-GFPN-DFLAT. Known-scalar, toy
        public parameters only. No msolve, valgrind or callgrind_annotate flag
        or argv change, no time() interposition. Amazon Bedrock is prohibited.
        MACHINE QUIET: no other solver-running process runs on the host while
        this stage runs, including EXP-GFPN-659e34 (IMP-3) and any review or
        design task that solves.

