handoff:
  id: TASK-20260811-845cc4
  recorded_at: '2026-08-11'
  from: coordinator
  to: validator
  role: validator
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-aeeb17
  reviews_batch: BATCH-aeeb17
  preregistered: true
  preregistration_note: >-
    THIS ENVELOPE WAS WRITTEN AND COMMITTED BEFORE ANY PRODUCER OUTPUT EXISTED,
    so the review scope could not be tuned to the results. The snapshot commit
    and the concrete list of filed IDEA identifiers are the only fields the
    Coordinator fills in at dispatch; every check below is fixed as of the
    pre-registration commit.

  objective: >-
    Independently VERIFY the BATCH-aeeb17 idea corpus against the standards the
    batch declared for itself before generating: that every filed proposal is
    genuinely novel against the 146-record corpus, admissible under the H-ENDO-001
    filter, schema- and identifier-disciplined, controlled by a matched null where
    it measures anything, honest in its claim fields, and correctly routed under
    pause conditions P2 and P3. Verification here means re-running the check
    yourself, not reading the producer's account of having run it.

  uncertainty_reduced: >-
    Whether BATCH-aeeb17's proposals are admissible, genuinely novel against a
    146-record corpus, honestly costed, and correctly routed under pause
    conditions P2 and P3 -- and whether the batch's own pre-registered coverage
    hypothesis survived contact with its results. Ideation is cheap to produce
    and expensive to act on; this review is what decides whether anything here
    is worth a contract.

  inputs:
  - AGENTS.md
  - CLAUDE.md
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-aeeb17/BATCH-CARD.md
  - analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md
  - ledger/goals/GOAL-ENDO-001/goal.yaml
  - knowledge/findings/KN-FIND-b7e091.md
  - docs/inventor-protocol.md
  - docs/claims-and-verification.md
  - ledger/proposals/
  - ledger/handoffs/TASK-20260811-5ff234.yaml
  - ledger/handoffs/TASK-20260811-6ca12c.yaml
  - ledger/handoffs/TASK-20260811-f58f22.yaml
  - ledger/handoffs/TASK-20260811-c439c2.yaml
  - ledger/handoffs/TASK-20260811-6d56a7.yaml
  snapshot_commit: FILLED_AT_DISPATCH
  filed_idea_ids: FILLED_AT_DISPATCH

  constraints:
  - >-
      YOU ARE AN INDEPENDENT SESSION AND DID NOT ORIGINATE THIS OUTPUT. Read the artifacts at the declared snapshot commit. Do not accept any producer's self-report as verification of itself; a self-reviewed instrument is not a control, and the same applies to a self-screened novelty claim.
  - >-
      YOU CHANGE NO STATUS AND NO RAW ARTIFACT. You do not edit the IDEA records, do not move any hypothesis, do not approve or reject anything officially, and do not commit. You write ONE report at your declared path. The Coordinator adjudicates.
  - >-
      CORE RULE 5 BINDS YOU TOO. Never fabricate a check you did not run, a file you did not read, or a count you did not compute. If you could not verify something, record it as unverified and say why. An unverified check is not a passed check.
  - >-
      STANDING CONSTRAINTS YOU ARE CHECKING AGAINST, not relitigating: H-ENDO-001 is the admissibility filter (every endomorphism acts on the prime-order subgroup G as a scalar, so a proposal whose only use of phi is to apply it to points of G is INADMISSIBLE ON ITS FACE); KN-FIND-b7e091's generic-group closure is BINDING and may be extended but never revisited; H-STR-002 is `weakened` with DEFER-BATCH009-001 OPEN, so goal pause condition P2 fires on any result bearing on it in either direction; pause condition P3 means a candidate appearing to exceed the automorphism-discounted rho baseline must be FLAGGED AND STOPPED, never stated, and sqrt(6) (KN-TECH-018) is baseline calibration and never an exponent.
  - >-
      THE BATCH'S OWN COVERAGE HYPOTHESIS IS ITSELF UNDER REVIEW. BATCH-CARD.md section 1 pre-registers the claim that the fourteen lanes are indexed by resource applied to a single curve's point group, leaving objects the indexing cannot express thinly generated. If what came back is mostly existing proposals in new language, SAY SO PLAINLY -- that finding is worth more than a generous review, and 'the idea space is saturated' is an accepted and intended deliverable of this batch.

  checklist:
  - >-
      V1. NOVELTY SCREENS, RE-RUN INDEPENDENTLY. This is the highest-value check in the review and gets the largest share of your budget. 146 committed proposals already reference GOAL-ENDO-001 or its lanes. For EVERY filed IDEA record: independently search ledger/proposals/ for its central object and mechanism; verify that `discriminated_from` names a REAL and genuinely NEAREST record rather than a distant one chosen to look thorough; and verify the stated difference is real rather than a rewording. Report per-record: screen adequate / screen inadequate / REDISCOVERY, with the colliding id named. A rediscovery filed as novel is the costliest failure available to this batch and finding one is a success for you.
  - >-
      V2. ADMISSIBILITY-FILTER COMPLIANCE, PER RECORD. Does each proposal name a resource from the R1-R8 taxonomy in DECOMPOSITION.md section 2, or explicitly argue that the taxonomy needs a new entry? Is any proposal inadmissible on its face under H-ENDO-001 -- that is, does its mechanism reduce to applying an endomorphism to points of G and nothing more? Name every inadmissible record; do not soften this.
  - >-
      V3. SCHEMA AND IDENTIFIER DISCIPLINE. Every filed record parses as YAML; carries the field structure of the corpus exemplar ledger/proposals/IDEA-20260808-4d77a6.yaml; uses ONLY an identifier from its own axis's pre-allocated pool as declared in that axis's handoff; and no identifier is used twice across axes or minted outside the pools. Report any id that is reused, invented, or drawn from another axis's pool.
  - >-
      V4. CONTROLS AND FALSIFIABILITY. Every proposal that measures anything carries a MATCHED NULL OBJECT in `controls` (docs/inventor-protocol.md, controls before belief). Every proposal carries a `minimal_test` that is genuinely cheap AND genuinely discriminating -- an idea whose minimal test cannot kill it is not yet an idea. Every proposal carries usable `falsification_conditions`. Report each missing or non-discriminating case.
  - >-
      V5. CLAIM DISCIPLINE, LITERAL AND IMPLIED. `claim_tier` toy and `sota_delta` zero in every record, `dominated_by` populated honestly against parallel Pollard rho at 0.886*sqrt(N) with O(1) memory. Then check the HARDER version: does any record's prose imply an exponent, a speedup, or an attack while its fields formally say zero? Quote any such passage.
  - >-
      V6. P2 AND P3 ROUTING. Flag every proposal that bears on H-STR-002 in either direction (phi-stable factor bases especially) and check the producer flagged it P2-adjacent. Flag every proposal that appears to exceed the automorphism-discounted rho baseline and check the producer FLAGGED rather than STATED it. A stated excess is a P3 violation and is reported to the Coordinator immediately.
  - >-
      V7. ELEMENTARY [fact] CLAIMS ARE VERIFIED, NOT ACCEPTED. Producers were told to mark every non-citation claim [fact] (elementary, verifiable, and verified by them) or [open]. Independently verify a sample of the [fact] claims, and verify ALL of them where the proposal leans on one structurally. Axis A1 was given a specific seed to check -- that E and its quadratic twist E^d share the x-line P^1 = E/{+-1} while lying in DIFFERENT isogeny classes (the twist has trace -t) -- and whether A1 verified or refuted it, and did so correctly, is a named deliverable of yours. You have Bash: compute rather than reason where computing is cheaper.
  - >-
      V8. WRITE-SCOPE COMPLIANCE. Using git, confirm no producer wrote outside its declared write_scope and that no producer committed. Report any stray path.

  deliverables:
  - >-
    ONE report at coordination/goals/GOAL-ENDO-001/batches/BATCH-aeeb17/reviews/TASK-20260811-845cc4/validation-report.yaml, parseable YAML, carrying: a per-record verdict for
    every filed IDEA identifier; a per-axis verdict; every finding with an id,
    a severity, the exact file and field it attaches to, and what would settle
    it; an explicit list of checks you could NOT complete and why; and the
    requested policy alongside the model that actually answered.
  - >-
    An overall verdict of one of: PASSED, PASSED_WITH_FINDINGS, INCONCLUSIVE, or
    FAILED -- with the reason stated in one sentence. INCONCLUSIVE is a real and
    acceptable verdict; do not manufacture a decisive one.
  - >-
    A DISSENT is available to you and BLOCKS Coordinator approval of whatever it
    names until a successor Coordinator decision supersedes it on the merits.
    Use it for something you would defend, not as emphasis.

  artifact_paths:
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-aeeb17/reviews/TASK-20260811-845cc4/validation-report.yaml

  write_scope:
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-aeeb17/reviews/TASK-20260811-845cc4/validation-report.yaml

