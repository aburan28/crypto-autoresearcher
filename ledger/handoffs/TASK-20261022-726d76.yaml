handoff:
  id: TASK-20261022-726d76
  from: coordinator
  to: executor
  recorded_at: '2026-10-22'
  kind: implementation_package
  opened_by_decision: DEC-20261022-a8c780
  question_id: RQ-PFDR-ae2fba
  goal_id: GOAL-PFDR-fd09e0
  hypothesis_id: H-PFDR-727bfc
  experiment_id: EXP-PFDR-bb0d26
  objective: >-
    Implement the launcher, the deterministic trial plan, the checker and the fixtures for the review_required
    contract experiments/EXP-PFDR-bb0d26/specification.yaml (H-PFDR-727bfc, IDEA-20261017-078074): a toy-scale census
    of exact nontrivial pair-sum coincidence counts of the x-label sets of rank-r log-GAP bases against a matched
    uniform random label-set null on generated prime-order curves (45 toy cells), with a planted label AP, null-vs-null
    calibration and replication of flagged cells on fresh curves. The approved scope is the toy part only; the idea's
    real-curve extension is held for a user decision and is not implemented. The contract is the authority for every
    design constant; run.py carries them identically and check.py spec-consistency proves it. Zero census runs: this
    task runs unit tests and the selftest machinery on synthetic data only.
  uncertainty_reduced: >-
    None scientific (implementation and readiness). Makes the contract runnable so that the preapproval probe, the
    runbook compile and a separate approval decision can follow. A passing unit test or dry selftest is not
    evidence about H-PFDR-727bfc.
  inputs:
  - ledger/proposals/IDEA-20261017-078074.yaml
  - ledger/proposals/IDEA-20261017-078074.notes.md
  - ledger/hypotheses/H-PFDR-727bfc.yaml
  - experiments/EXP-PFDR-bb0d26/specification.yaml
  - ledger/decisions/DEC-20261022-a8c780.yaml
  - ledger/questions/RQ-PFDR-ae2fba.yaml
  - src/crypto_autoresearcher/index_calculus/curve.py
  - experiments/EXP-PFDR-ca5e01/implementation/
  - experiments/EXP-PFDR-ca5e01/trial-plan.json
  - experiments/EXP-PFDR-ca5e01/runbook.yaml
  - tools/experiment_preapproval.py
  - tools/experiment_execution.py
  constraints:
  - id: IC-1
    text: >-
      The specification is the authority. Implement exactly the cells, seed blocks, builders, statistics, classes,
      gates, readings and artifact names it declares. If run.py cannot be made to match a constant, stop and
      report the mismatch to the Coordinator; never edit the specification and never choose a different constant.
      The only edits to the specification are the freeze_fills it lists, made at freeze, not in this task's
      commits of source.
  - id: IC-2
    text: >-
      No engine file: add nothing to and edit nothing under src/crypto_autoresearcher/index_calculus/**,
      tests/test_index_calculus_*.py or tests/fixtures/** (DEC-20261002-c3f49b NA-5). New scripts live only under
      experiments/EXP-PFDR-bb0d26/implementation/. vendor/curve.py is a verbatim copy of the upstream file; record the
      upstream commit and sha256.
  - id: IC-3
    text: >-
      Zero real-data runs. Do not run any census trial and do not generate any curve of the main block (8,100,000 + c)
      or the replication block (8,200,000 + c), not even for timing. Unit tests and dry selftest machinery use only
      synthetic inputs, the selftest block 8,900,000 + c, and bits at most 20. No test, script or log may print,
      store or assert a ratio of structured to null pair-sum counts, or aggregate the pair-sum count of rank-r log-GAP
      label sets across curves at any design cell size (n >= 256 at bits >= 20); builder and kernel equality tests use
      n <= 64 at p <= 2^16 and assert exact equality only. The planted-control and calibration tests use planted and
      null sets only. This keeps the pre-registration blind to the structured outcome.
  - id: IC-4
    text: >-
      Pre-registration blindness of the sibling. Do not read experiments/EXP-PFDR-ca5e01/runs/, runbook-sessions/ or
      reports/, nor any analysis, evidence or review of EXP-PFDR-ca5e01, while implementing or testing. The
      EXP-PFDR-ca5e01 implementation directory, trial plan and runbook may be read for structure and style only.
  - id: IC-5
    text: >-
      Held extension, omitted. The idea's real-curve arm (standardized curves secp256k1 and NIST P-256) is held for a user
      decision and is outside the approved scope (specification resolution R3). Implement none of it, not even as
      unexercised code: no standardized-curve constant, no realcurves.json fixture, no 256-bit key path, no
      census-real subcommand or trial, no real-curve cell, rule, test or known-answer vector appears in any file of this
      task. The kernel and the builders target generated toy curves with p below 2^31. If the user later admits the
      extension it is added by a versioned protocol_amendment and a new approval, not by this task.
  - id: IC-6
    text: >-
      Run ids and determinism. The five RUN ids are minted by the top-level session with tools/allocate_id.py and
      substituted for the five <RUN:...> tokens; invent none. Every job record is a pure function of its key except the
      seconds field; random streams are random.Random seeded by sha256("EXP-PFDR-bb0d26|" + labels).
  - id: IC-7
    text: >-
      Artifact hygiene. Declared trial artifacts are flat file names including manifest.yaml and raw-result.json; do not
      declare any name the supervisor generates (launch.json, execution-receipt.json, command.txt, environment.json,
      stdout.log, stderr.log, check.stdout.log, check.stderr.log). Never stage __pycache__. analyze-main and
      analyze-final must run to completion on toy data alone.
  deliverables:
  - id: D1
    path: experiments/EXP-PFDR-bb0d26/implementation/run.py
    text: >-
      The launcher. Standard library plus PyYAML. Subcommands trial (the supervisor entry, --run-dir --run-id --trial-id
      --plan), design, selftest, census-toy, analyze. Contains constants BITS, RANKS, NS, NULL_REPS, TARGET, SAFETY,
      N_MIN, N_MAX, PLANT_FRACTION, GATES, SEED_BLOCK and the functions cells(), log_gap_builder, null_builder,
      planted_builder, job functions, the cell statistics, the cell classes, the toy reading and the headline, exactly
      as the specification states. Writes manifest.yaml (with code_sha256 of every .py and .c under implementation/ and
      the trial plan sha256), raw-result.json and the trial's declared artifacts. 4 workers, kernel timeout 3600 s per
      call, failed_infrastructure records for timeouts and crashes, a degenerate status for an exhausted half-box.
  - id: D2
    path: experiments/EXP-PFDR-bb0d26/implementation/labelsum.c
    text: >-
      The kernel: given n labels below p (p below 2^31), forms all n(n-1)/2 unordered pair sums mod p as exact 64-bit
      keys, radix-sorts, and returns C and D. Memory at most 16 bytes per pair; n = 4096 within 4 workers under 4 GB.
  - id: D3
    path: experiments/EXP-PFDR-bb0d26/implementation/check.py
    text: >-
      The checker: check.py <run_dir> <trial-plan.json> <trial> exits 0 (CHECK OK) or 3 (CHECK FAIL); re-derives the
      design table, census completeness, a seeded replay of up to 4 small-n toy jobs with a brute-force recount that
      does not use the kernel, and per cell S, M, kappa, z, z_cal, class, the calibration gate, fraction_valid, flagged
      list, toy reading and headline. Subcommand spec-consistency <specification.yaml> compares every constant in the
      specification with run.py and exits non-zero on any difference.
  - id: D4
    path: experiments/EXP-PFDR-bb0d26/implementation/vendor/curve.py
    text: verbatim copy of src/crypto_autoresearcher/index_calculus/curve.py; the upstream commit and sha256 are recorded for the freeze fill
  - id: D5
    path: experiments/EXP-PFDR-bb0d26/implementation/fixtures/kat.json
    text: >-
      Known-answer vectors produced by an independent brute-force script that shares no code with run.py: tiny label
      sets with exact C and D (for example X = {0,1,2,3} mod 101 has C = 1, D = 5); a hand-built set with exactly one
      planted coincidence; the design anchors n_curves = 1440 at bits 28, n = 256 and 89 at bits 28, n = 512; the count
      of 45 toy cells
  - id: D6
    path: experiments/EXP-PFDR-bb0d26/implementation/test_unit.py
    text: the unit-test suite of the plan below, runnable with python3 -m pytest or python3 directly
  - id: D7
    path: experiments/EXP-PFDR-bb0d26/implementation/unit-test-report.txt
    text: >-
      the verbatim output of the unit-test run (test names, pass or fail, counts, timing of the null-only resource probe
      if one was made); a readiness record, never evidence
  - id: D8
    path: experiments/EXP-PFDR-bb0d26/trial-plan.json
    text: >-
      The deterministic trial plan, schema crypto.autoresearch.trial_plan.v1: experiment_id EXP-PFDR-bb0d26, frozen
      true, approved_by DEC-20261022-f1efde, specification path and the sha256 of the final (freeze-filled, approved)
      specification, task_id TASK-20261022-32fe8b, queue coordination/goals/GOAL-PFDR-fd09e0/batches/BATCH-8d6d84/
      dispatch_queue.json, defaults (the seed blocks, null reps, target, safety, workers), nonempty source_sha256
      (run.py, check.py, labelsum.c, vendor/curve.py, fixtures/kat.json) and nonempty input_sha256 (vendor/curve.py,
      fixtures/kat.json), and five linear trials in this order with their minted run ids - selftest (artifacts
      manifest.yaml, raw-result.json, selftest.json, design.json; memory 2048; watchdog 3600), census-toy-main
      (manifest.yaml, raw-result.json, toy-main-jobs.jsonl; block main; memory 4096; watchdog 43200; inputs_from design),
      analyze-main (manifest.yaml, raw-result.json, analysis-main.json, flags.json; memory 2048; watchdog 3600),
      census-toy-rep (manifest.yaml, raw-result.json, toy-rep-jobs.jsonl with allow_empty_artifacts; block rep; memory
      4096; watchdog 43200; inputs_from design and flags), analyze-final (manifest.yaml, raw-result.json, analysis.json,
      flags.json; memory 2048; watchdog 3600). No census-real trial. Every argv and check_argv names a bound source
      path and contains no bedrock string; every trial has a watchdog_reason. Written after the freeze fills, because it
      binds the final specification bytes.
  - id: D9
    path: experiments/EXP-PFDR-bb0d26/amendments/.gitkeep
    text: empty placeholder so the directory exists
  - id: D10
    path: experiments/EXP-PFDR-bb0d26/runs/.gitkeep
    text: empty placeholder so the directory exists
  unit_test_plan:
  - id: UT-1
    name: kernel against brute force
    text: >-
      Random label sets (p of 12 to 16 bits, n of 8 to 200, a fixed seed) give C and D equal to a pure-Python dictionary
      count; sets with forced coincidences, a set where only 2u = v + w holds (C must be 0), and a set with all sums
      distinct (C = 0, D = n(n-1)/2).
  - id: UT-2
    name: known answers
    text: every vector of fixtures/kat.json is reproduced by run.py with no tolerance.
  - id: UT-3
    name: builder against a slow path
    text: >-
      For r = 1, 2, 3 on small generated curves (selftest block, p at most 2^16, n at most 64), the labels collected by
      the log-GAP builder equal a slow recomputation with Curve.mul per coefficient vector; the vectors follow the
      lexicographic first-nonzero-positive order; labels are distinct; T is the least integer meeting the half-box
      bound; duplicate-skips are counted; a forced tiny curve with n above the half-box gives status degenerate.
      Assert equality only (constraint IC-3).
  - id: UT-4
    name: positive control must read as a large excess
    text: >-
      A synthetic mini-census on the selftest block (bits 16 to 20, n of 128 to 256, 30 or more curves, planted and null
      sets only) gives plant_kappa >= 1.15 and plant_z > 4, the plant size rule m is feasible, and a hand-built set with
      exactly one planted coincidence yields count 1.
  - id: UT-5
    name: null must pass its calibration
    text: >-
      A synthetic mini-census of null sets only (selftest block, bits 16 to 20, 200 or more curves, 20 replicates, one
      pseudo-structured replicate) gives sd(z_cal) in [0.75, 1.25] and |mean(z_cal)| <= 0.35, and the measured null
      mean within 5% of 3 binom(n,4)/p averaged over curves. A deliberately shifted pseudo-structured set (all labels
      from an AP) fails the gate.
  - id: UT-6
    name: scaling identity
    text: multiplying all labels of 12 toy sets by u^2 mod p for random units u leaves C and D exactly unchanged.
  - id: UT-7
    name: determinism and ordering
    text: >-
      Re-running a synthetic job gives an identical record except seconds; shuffling the completion order of synthetic
      job records leaves the bootstrap interval identical.
  - id: UT-8
    name: analysis logic on synthetic jobs files
    text: >-
      Hand-built synthetic jobs files drive the analysis to each state: null-only data gives O-NULL and SUPPORT_SCOPED;
      one cell with an injected 15% excess is flagged, survives a complete synthetic replication (O-STRUCT,
      FALSIFY_SCOPED) and is pending with an incomplete one (O-PENDING-REPLICATION); an underpowered cell is
      inconclusive_underpowered; a failed plant gives inconclusive_plant_not_recovered; a failed_infrastructure job
      invalidates its cell; a forced calibration failure gives O-INVALID and NOT_EVIDENCE. analyze-main and
      analyze-final complete on toy data alone.
  - id: UT-9
    name: checker negative tests
    text: >-
      check.py exits 0 on the consistent synthetic run directories and 3 after each of: a tampered outcome, headline,
      z_cal, class, an unaccounted missing job, a changed jobs record, a plant count altered by one; a replayed job that
      differs.
  - id: UT-10
    name: specification consistency
    text: >-
      check.py spec-consistency exits 0 on the specification after the freeze fills and non-zero after a mutation of any
      one of bits, ranks, ns, null reps, target, safety, gate bands, flag thresholds or seed blocks; it also fails if the
      specification or any bound artifact contains a standardized-curve constant (the held extension is absent).
  - id: UT-11
    name: design table
    text: >-
      cells() returns 45 toy cells, n_curves is 1440 at bits 28, n = 256 and 89 at bits 28, n = 512, 50 wherever the
      formula gives fewer, and no cell reaches the cap 2000; the selftest writes the same design.json twice byte for byte.
  - id: UT-12
    name: resource probe
    text: >-
      One synthetic null-only set of 4096 labels at p of about 2^20 (no structured set) is counted through the kernel to
      record peak resident memory and time per set; the figures go in unit-test-report.txt and may refine the stage
      estimates by a stage-estimate amendment note, never a threshold.
  completion_gate:
  - every unit test UT-1 to UT-12 passes and unit-test-report.txt is committed verbatim
  - check.py spec-consistency exits 0 on the freeze-filled specification
  - no file under src/crypto_autoresearcher/index_calculus/**, tests/test_index_calculus_*.py or tests/fixtures/** is added or changed
  - no standardized-curve constant, realcurves.json or census-real trial exists in any deliverable (constraint IC-5)
  - no census trial was run and no main-block or replication-block curve was generated (constraint IC-3), stated in the return
  - the deliverables are committed and pushed on the session branch before tools/experiment_preapproval.py is run, so that source_ref origin/<branch> holds the same bytes
  - tools/experiment_preapproval.py --packet reports approvable true for the exact final bytes, or the exact blockers are recorded and the contract stays review_required
  return_format: >-
    created paths with sha256, the upstream commit of vendor/curve.py, the unit-test report location, the
    spec-consistency output, a statement of IC-3 and IC-5 compliance, the minted RUN ids placed in the trial plan, and
    the probe output or its blockers
  artifact_paths:
  - experiments/EXP-PFDR-bb0d26/implementation/run.py
  - experiments/EXP-PFDR-bb0d26/implementation/check.py
  - experiments/EXP-PFDR-bb0d26/implementation/labelsum.c
  - experiments/EXP-PFDR-bb0d26/implementation/vendor/curve.py
  - experiments/EXP-PFDR-bb0d26/implementation/fixtures/kat.json
  - experiments/EXP-PFDR-bb0d26/implementation/test_unit.py
  - experiments/EXP-PFDR-bb0d26/implementation/unit-test-report.txt
  - experiments/EXP-PFDR-bb0d26/trial-plan.json
  - experiments/EXP-PFDR-bb0d26/amendments/.gitkeep
  - experiments/EXP-PFDR-bb0d26/runs/.gitkeep
  write_scope:
  - experiments/EXP-PFDR-bb0d26/implementation/
  - experiments/EXP-PFDR-bb0d26/trial-plan.json
  - experiments/EXP-PFDR-bb0d26/amendments/.gitkeep
  - experiments/EXP-PFDR-bb0d26/runs/.gitkeep
  archived_by: TASK-20261022-b6532d
