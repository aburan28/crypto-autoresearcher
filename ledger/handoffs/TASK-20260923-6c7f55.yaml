    - id: S2B-2
      text: >-
        GATES (A1-2).
        - controls_a1 runs only after all four v2 gate packages
          (RUN-GFPN-ac4487, RUN-GFPN-3377f1, RUN-GFPN-76420e,
          RUN-GFPN-b231c1) are completed_valid with gate_pass true.
        - Packages 2 onward run only after controls_a1 is completed_valid
          with gate_pass true.
        - A controls_a1 failure ends the run at its gate. The remaining
          packages are recorded not_attempted with the reason. The failure is
          an infrastructure or implementation signal, never a result. The
          repair is a successor task under a new Coordinator decision, not a
          re-iteration inside this card.
    - id: S2B-3
      text: >-
        READING RULES, applied at reading time and never to v2 bytes.
        - A1-4 labels every (16777291, ecgfp5_shaped, c = 59) row
          `off_shape_non_double_odd`.
        - A1-3 sets the evaluation sets and triple accounting.
        - A1-5 defines aggregate_a1's sections (i)-(v).
        - AA-4 adds the matched-triple figure, labelled descriptive and not a
          verdict.
        - heur_dflat_not_applicable is never relabelled heur_dflat_failed.
          F3 and the 2^36 tail check stay "undecidable". No ratio is computed
          against 2^20. torsion_S5_norm carries group order 3840.
    - id: S2B-4
      text: >-
        MEMORY ENVELOPE, MACHINE PROTECTION (AC-1; DEC-20260923-8b2dbf AA-6),
        identical to v2:
        - RLIMIT_AS = 10737418240 bytes, set in the child and read back with
          getrlimit into each manifest's resources block. A child that cannot
          set it refuses to start.
        - driver RSS at most 1 GiB, checked before each launch;
        - one memory-heavy process at a time;
        - task envelope at most 11 GiB;
        - msolve -t 1;
        - the lowered cap if the dispatcher's guard threshold is below
          12.0 GB, recorded;
        - the full A-6 envelope tuple on every not_measured row;
        - the A-7 pre-declared early stop.
        Watchdogs are exactly trial-plan-v2.json's, and the wrapper refuses
        any mismatch.
    - id: S2B-5
      text: >-
        TIMEOUTS, OOM, CRASHES, positive_dimensional and
        degenerate_parametrisation outcomes are recorded with their class.
        They are never measured non-decompositions or evidence about D
        (AGENTS.md core rule 5). A 31-bit m = 5 cell that ends not_measured
        makes the primary-shape verdict not_applicable, never FALSE.
    - id: S2B-6
      text: >-
        MANIFESTS (A1-7 (3)). Each records:
        - task id TASK-20260923-6c7f55 (never TASK-20260923-cd932c);
        - protocol_version "2-a1";
        - the addendum id and sha256;
        - the TASK-20260923-0fa03f and TASK-20260923-4ff597 phase-A commits
          and both clean-tree flags;
        - the child RLIMIT_AS read back from getrlimit;
        - threads executed;
        - host RAM and swap;
        - the inference block (requested policy executor-implementation, the
          resolved binding as the session provides it, fallback_used).
        No model id is invented.
    - id: S2B-7
      text: >-
        CEILING AND CONTINGENCY.
        - At most 11 addendum packages (7 under the FB-1 plan), and at most 48
          v2 plus addendum packages in total (DC-7 A-7; AA-5 (e)).
        - A contingency id is used only under trial-plan-v2.json's
          contingency_rule, applied to addendum packages.
        - Reaching the ceiling before the plan completes is an impediment for
          a new Coordinator decision, never a result.
    - id: S2B-8
      text: >-
        WRITE ONLY INSIDE write_scope. Every v1 and v2 path, and every v2 run
        package, is READ-ONLY. No run directory is ever overwritten.
        implementation-v2-a1/, implementation-v2-a1.md and
        trial-plan-v2-a1.json are bound by phase A of TASK-20260923-4ff597 and
        are not edited.
    - id: S2B-9
      text: >-
        NO SECURITY STATEMENT (DC-9; AA-8). Band figures are emitted only per
        DC-2 B-3 and A1-3's band clause, next to their own convention's
        constant and labelled modeled. The execution report states no
        security level, and draws no supported or refuted conclusion about
        H-GFPN-9a29be or HEUR-GFPN-DFLAT. Known-scalar, toy public parameters
        only. Amazon Bedrock is prohibited.
    - id: S2B-10
      text: >-
        MACHINE QUIET. No other solver-running process runs on the host while
        this stage runs, including stage 2 of TASK-20260923-cd932c (already
        returned by SQ-5 and SQ-6) and EXP-GFPN-659e34 (IMP-3).

