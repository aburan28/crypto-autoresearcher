    Whether the ideal degree D of each arm on the double-odd EcGFp5-shaped
    curve at p' = 1073741831 (or on c_fb1 under FB-1) completes within the
    AC-1 envelope, and what it is. With v2's 13- and 19-bit rows, this decides
    whether HEUR-GFPN-DFLAT is evaluable, and with what verdict, on the frozen
    primary shape (A1-3). That decides goal criterion C1's measured side.

