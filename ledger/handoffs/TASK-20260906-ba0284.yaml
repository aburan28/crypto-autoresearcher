  completion_gate:
    - Each of J1, J2, J3 and J4 carries its own verdict and its own recorded check, and none is answered only by restating a producer.
    - independent_parse_check.py exists at its declared path, and the report states whether it was written and run before amendment_parse_control.py was opened.
    - The report gives your own results for the redrafted clause_1, the superseded clause_1 and the redrafted clauses 2, 3 and 4, with the resulting metrics length, the metrics[5] type and its key.
    - The producer's control was run by you on all five proves-too-much objects including the unamended frozen file and the positive control, and what it actually did on each is reported with the assertion that fired.
    - J3 reports item by item on RT-4, RT-5, RT-7, RT-8, RT-9(b), OP-2, OP-3 and the R3 warrant sentence, and enumerates every difference from the superseded draft with each classified.
    - J3 states explicitly whether CF-14 was disclosed rather than repaired, and whether RT-6, RT-9(a) or RT-12 were resolved by the redraft when they are reserved to the enacting decision.
    - J4 checks the attestation in both directions, re-runs at least one of its checks, and reports whether the null object ran and returned a different answer.
    - Every finding carries a severity and a target path with a line or key locator, no finding is inflated, and a joint with no finding says so and says how it was searched.
    - Per joint, what you did not accept from the reports you were given is stated.
    - Nothing under experiments/, inputs/, BATCH-752ef2/, BATCH-79a0cb/ or either producer's task directory was modified; cost_model.py was neither executed nor modified; no amended copy of specification.yaml exists anywhere in the repository; and the report states how this was checked.
    - The report is a YAML file that yaml.safe_load parses, with a top-level review_attestation listing the four joint names verbatim, read_sibling_reports declared truthfully, blind_from_respected true, and a verdict of holds, breaks or inconclusive.
    - runtime_session_receipt.yaml records inference provenance including any divergence, records no probe that was not run, discloses the launching prompt, and states that the review is not model-independent.
    - The citation prohibition and its predicate extension are restated verbatim, neither is lifted, and no crossover value, baseline sign, margin or speedup is derived, recomputed, tabulated or cited anywhere.
    - Exactly the three declared artifacts exist at their exact declared paths and nothing else was written into the repository.
  return_format: >-
    A short report naming the four joint verdicts; whether you wrote and ran your own
    splice-and-parse before opening the producer's control; what the producer's
    control did on the unamended frozen file; the item-by-item J3 result and any
