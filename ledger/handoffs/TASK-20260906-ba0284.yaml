  task_card: coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/tasks/TASK-20260906-ba0284/task_card.yaml
  objective: >-
    Independently check both producer packages of BATCH-60d6b9 on joints J1 through
    J4 of coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/review_plan.yaml:
    whether the redrafted clause_1 spliced over
    experiments/EXP-WESOVOW-001/specification.yaml:39-40 actually yields a file that
    parses with the declared shape AND content; whether the new parse control CAN
    FAIL or whether its pass is entailed by its own construction, run by you on the
    plan's named negative objects including the UNAMENDED file; whether the redraft
    carries exactly the items DEC-20260905-3b8e94 routed to it and introduces
    nothing else; and whether the CF-9 attestation claims exactly what its evidence
    supports, checked in both directions.
  uncertainty_reduced: >-
    Whether the repair of RT-1 and the control written to answer it are what they
    say they are - checked by an agent that wrote neither - and whether a
    long-deferred provenance item has come back overstated or understated.
  dispatch_precondition: >-
    MAY NOT BE DISPATCHED until the dispatching Coordinator session has committed
    EXACTLY the six producer artifact paths of TASK-20260906-ee372e and
    TASK-20260906-0fbf69, by exact pathspec, in ONE commit whose message states
    record identifiers and locators only, and has recorded that commit's sha, its
    parent sha, and the sha256 of each of the six paths for TASK-20260906-9f3e2a's
    ledger_commit_receipt.json. This is how snapshot-before-review survives a batch
    with four identifiers and no snapshot-archive task. If that commit cannot be
    made, or does not change exactly those six paths, THE REVIEW IS NOT DISPATCHED:
    the batch stops and returns to the Coordinator. Reviewing uncommitted producer
    artifacts is not a fallback.
  inputs:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/review_plan.yaml - joints J1-J4, the proves-too-much objects and the attested reading order are all yours
    - The two producer packages of this batch under tasks/TASK-20260906-ee372e/ and tasks/TASK-20260906-0fbf69/ - committed before you were dispatched; you are their reviewer, not their repairer
    - experiments/EXP-WESOVOW-001/specification.yaml - READ-ONLY, read it yourself and not through anyone's excerpts
    - coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/tasks/TASK-20260905-28c89d/protocol_amendment_draft.yaml - the SUPERSEDED draft, immutable; you need its clause_1 as a negative object
    - coordination/goals/GOAL-SSI-001/batches/BATCH-79a0cb/reviews/TASK-20260905-6d5c9c/red_team_report.yaml and BATCH-752ef2/reviews/TASK-20260905-4098fd/validation_report.yaml - blindness is DELIBERATELY LIFTED for you and you must declare that you read them
    - ledger/decisions/DEC-20260905-3b8e94.yaml - the authoritative list of what was routed to the redraft and what is reserved to the enacting decision
    - A scratchpad OUTSIDE the repository for anything beyond your one declared script
  constraints:
    - INDEPENDENT SESSION, review-adversarial, xhigh. Report on YOUR joints; do not return a whole-claim verdict on enactability - the Coordinator composes. Copy the four joint names VERBATIM into joints_owned.
    - READING ORDER, BINDING, FOR J1 AND J2, AND IT IS NOT A BLIND PHASE - nothing is forbidden to you at any time. Write and run YOUR OWN splice-and-parse (independent_parse_check.py, in your write scope) against the redraft record's own bytes and against the SUPERSEDED clause_1, BEFORE opening amendment_parse_control.py or its report. Then open them and say where yours differs. Record that you did it in that order, or record honestly that you did not.
    - A REVIEW THAT FINDS NOTHING WRONG IS A FULLY ACCEPTABLE OUTCOME AND IS CONTRACTED AS ONE IN ADVANCE. If you search hard and find nothing, say so plainly and record HOW you searched. Do not manufacture an objection; rate severities honestly, including informational.
    - RUN THE PRODUCER'S CONTROL YOURSELF on the plan's five proves-too-much objects and report what it ACTUALLY DID on each and which assertion fired. THE OBJECT THAT MATTERS MOST IS THE UNAMENDED FROZEN FILE - it already has a 7-element metrics list whose item 5 is a single-key mapping, so a control asserting only shape passes on the file it exists to detect the amendment of. A pass there is a BREAK and is reported as one, never as robustness.
    - DO NOT FIX ANYTHING. The producer packages are the objects under review and are committed; repairing them destroys the evidence. Name the defect, give the smaller repair, and leave it.
    - READ-ONLY, ABSOLUTELY, on experiments/ and inputs/. Do not edit specification.yaml and never write an amended copy of it anywhere inside the repository. DO NOT EXECUTE cost_model.py EVER (CF-10). Set PYTHONDONTWRITEBYTECODE=1 and sys.dont_write_bytecode before importing anything from a snapshot-bound directory.
    - RECORD AT LEAST ONE CONCRETE FINDING PER OWNED JOINT, or state for that joint that you searched and found none and exactly how. A joint answered by restating a producer is an uncovered joint.
    - SAY PER JOINT WHAT YOU DID NOT ACCEPT FROM THE REPORTS YOU WERE GIVEN. Your agreement with RT-1 or any earlier finding is not independent of them; reproduce each yourself before agreeing, and if your round consists entirely of re-confirming existing RT-numbers, say so.
    - AT J3, GO ITEM BY ITEM over RT-4's two provisos in clause_4's own text, RT-5, RT-7, RT-8's CF-14 disclosure note, RT-9(b), OP-2, OP-3 and the R3 warrant sentence, saying for each - carried, carried in the wrong place, or not carried - then enumerate every difference from the superseded draft and classify each as ordered, required by an ordered item, or NEW AND UNMANDATED with its smaller repair.
    - AT J3, CHECK THE TWO EASY-TO-MISS ONES - that CF-14 is DISCLOSED and NOT repaired, and that RT-6, RT-9(a) and RT-12, reserved to the enacting decision, are NOT resolved by the redraft.
    - AT J4, CHECK IN BOTH DIRECTIONS. Overstatement - every ATTESTED limb must bind to a checksum against recoverable bytes, and you re-run at least one check yourself. Understatement - every UNATTESTABLE limb must be one a committed artifact does not settle. Confirm the null object ran and returned a different answer.
    - maximum_runs bounds executions of experiment code, producer implementations and anything that writes a run record; your own script and importing the producer's control as a module are NOT runs (DEC-20260904-166ab5 PD-4). This batch authorizes ZERO new experiment runs.
    - IF YOU CONCLUDE THE UNDERLYING DEFECT DOES NOT REPRODUCE, record it precisely and in full and STOP INVESTIGATING IT - that object contradicts EV-SSI-2aaf6f at strength `replicated` and requires review-breakthrough at max, which this environment cannot serve. The round halts on that object and the Coordinator decides. Do not soften it, and do not let the stop condition discourage you from finding it.
    - RESTATE THE CITATION PROHIBITION AND ITS PREDICATE EXTENSION VERBATIM, lift neither, and state whether either fired on the packages and on your own report. If a check would require computing a corrected crossover or a baseline-comparison sign, the output is THE STATEMENT that it would, never the value - RT-2's antecedent `A > 0` IS the governed sign. You may RECOMMEND; a recommendation is not a decision.
    - DO NOT RESTATE any PAPER_PAIRS value, delta, crossover, margin, sign or speedup anywhere, including any you encounter in a raw result while checking J4. Name them by locator.
    - YOUR REPORT IS A .yaml FILE WITH A TOP-LEVEL review_attestation MAPPING carrying task_id, joints_owned, sources_read, read_sibling_reports, blind_from_respected and verdict, parseable in full by yaml.safe_load, and the ONLY file in this batch directory carrying that key. Set read_sibling_reports TRUTHFULLY; blind_from_respected is true because this plan declares no blind_from list; verdict is one of holds, breaks, inconclusive.
    - NETWORK IS NOT REQUIRED AND NO CONCLUSION MAY REST ON A RETRIEVAL. A model recollection is a `recalled` pointer under AGENTS.md rule 9 and is never support.
    - RECORD YOUR INFERENCE PROVENANCE HONESTLY and escalate any divergence rather than absorbing it; never record a probe or a model identity you did not obtain; disclose what your launching prompt told you (CF-15).
    - THIS ROUND IS SESSION-INDEPENDENT AND NOT MODEL-INDEPENDENT - state that in your limitations, and never present your agreement with a producer as agreement between distinct models. State also that you are NOT a red-team pass on the redrafted record and that this round may not be treated as one.
    - Change no status, write no ledger record, approve nothing, enact nothing, commit nothing, repair no artifact, and make no security, SQIsign, CSIDH, standardized-parameter, exponent or asymptotic claim in either direction.
    - Never select a provider, backend, endpoint, or model identifier containing Bedrock, case-insensitively.
  deliverables:
    - >-
      validation_report.yaml - a verdict per joint from CONFIRMED, CONFIRMED WITH
      CAVEAT or REFUTED for J1-J4; your own splice-and-parse results for the
      redrafted clause_1, the superseded clause_1 and clauses 2-4, with the order in
      which you produced them; the producer's control run by you on all five
      proves-too-much objects with what it actually did and which assertion fired;
      the item-by-item J3 table and the full difference enumeration with
      classifications and smaller repairs; the J4 two-direction check with at least
      one limb re-run by you; every finding with a severity and a target path with a
      line or key locator; a per-joint statement of what you did not accept from the
      reports you were given; a limitations list stating that this review is not
      model-independent and is not a red-team pass; the citation prohibition and
      predicate extension restated verbatim with whether either fired; and a
      top-level review_attestation with an honest, complete sources_read.
    - independent_parse_check.py - your own splice-and-parse script, written before you opened the producer's control, committed so your mechanical results are re-checkable from a committed artifact rather than only re-runnable (CF-24).
    - runtime_session_receipt.yaml - inference provenance, launching-prompt disclosure, wall clock used, and an explicit statement that no experiment run was executed, that cost_model.py was neither executed nor modified, and that nothing under experiments/, inputs/, BATCH-752ef2/, BATCH-79a0cb/ or either producer's directory was written, with how you checked.
  artifact_paths:
