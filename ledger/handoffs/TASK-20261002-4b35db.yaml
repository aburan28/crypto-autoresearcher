      920a4f188ee556134a20b5e4d2322f3a7dd8cca40744c47be70aa46ee14c094b in the
      working tree, and the receipt equals its committed blob.
      (b) The TASK-20261002-6afa5a, TASK-20261002-d08cff and
      TASK-20261002-e46042 receipts still verify, every path they bind has
      its recorded path_sha256, and each receipt equals its committed blob.
      (c) git status --porcelain (untracked included) shows exactly the five
      record paths this task stages, besides its receipt, and nothing else. In
      particular: experiments/EXP-PFDR-0b3699/ holds only specification.yaml;
      no change in src/ or tests/ (tests/test_index_calculus_smallx_offset.py
