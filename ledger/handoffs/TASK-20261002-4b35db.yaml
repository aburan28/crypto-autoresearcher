      anything unexpected in it is a stop.
    - >-
      MECHANICAL REFERENCE CHECK, BEFORE ANY COMMIT.
      (j) With a read-only script, check every row AP-001 to AP-115, AP-K1
      and AP-K2 of DEC-20261002-e7f8c9
      coordinator_decision.approval_reference_table.rows against the files
      named, per that table's machine_check_format (exactly
      AMD-20261002-236691 protocol_amendment.machine_check_format with the
      AMD-20261002-594eab format it inherits: list file and list locator
      rows, literal ["..."] key segments, [N] indices, contains on the loaded
      string value, count_equals on the whole file text, not_exists, and
      dict_equal_except performed exactly as the row's procedure states).
      - Record in the receipt: the script's sha256 (the script itself is not
        staged), the decision's sha256 as checked, and per row the result
        PASS, MISS or INFO with the observed value, count or line; for AP-K1
        and AP-K2 the number of leaves compared, the number excluded and
        every differing path.
      - Rows AP-103 to AP-115 and AP-K2 read files written by the approval
        act (staged by this task); check them in the working tree.
      Any MISS: STOP, do not commit, and return the list of MISS rows to the
      Coordinator. The decision is then superseded or replaced by a new
      Coordinator record, never edited after this check has passed. If the
      bytes of the decision, the specification or a card change before
      commit for any reason, (j) is re-run.
    - >-
      CUSTODY, WITHOUT EDITING.
      (a) The TASK-20261002-a5460f receipt verifies with
      tools/research_dispatch.py (content_at_commit), its one bound path
      coordination/design/TASK-20261002-729fc9/replication-design-corrected.yaml
