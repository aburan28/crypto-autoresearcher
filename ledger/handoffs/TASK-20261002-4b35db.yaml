      A mismatch in (a), (b) or (c) is a custody failure: STOP, do not
      commit, and report to the Coordinator. The decision rests on those
      exact bytes.
    - >-
      PARSE, VALIDATE, HYGIENE, SIZE.
      (d) Each YAML artifact_path parses with yaml.safe_load.
