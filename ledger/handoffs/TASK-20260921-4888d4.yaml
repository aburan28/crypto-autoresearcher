handoff:
  id: TASK-20260921-4888d4
  from: coordinator
  to: executor
  objective: >-
    Execute the frozen lambda-registry census EXP-ECDLP-fac9ea v1 exactly
    per its specification: measure the exact nontrivial additive L1 norms
    of the 12 frozen statistics over both frozen prime ladders, pass the
    four mandatory controls, fit the scaling exponents, emit the gate
    verdict table, and produce the checker re-derivations. Observations
    only: no interpretation beyond the frozen verdict vocabulary, no
    status changes.
  uncertainty_reduced: >-
    The per-statistic gate quantity lambda(v) for every registry row, with
    controls calibrating the pipeline and the reproduction row anchoring
    it to the committed p^{0.39} measurement.
  inputs:
    - experiments/EXP-ECDLP-fac9ea/specification.yaml
    - ledger/hypotheses/H-ECDLP-4e1880.yaml
    - ledger/proposals/IDEA-20260921-6a29df.yaml
    - ledger/decisions/DEC-20260921-4d1b40.yaml
    - knowledge/findings/KN-FIND-ffe1df.md
    - ledger/proposals/IDEA-20260904-f68c7f.yaml
    - ledger/proposals/IDEA-20260920-b6ad24.yaml
  read_scope:
    - AGENTS.md
    - agents/executor.md
    - docs/experiment-execution.md
    - docs/research-budget-policy.md
    - templates/research-records.md
    - the inputs list above
  constraints:
    - Execute specification version 1 exactly; no registry row, ladder
      prime, convention, or seed change after any cell outcome; additive
      changes go through experiments/EXP-ECDLP-fac9ea/amendments/ as
      protocol_amendments and never rewrite frozen fields.
    - The transform is the EXACT additive Fourier transform over F_p via
      Bluestein chirp-z over the prime; a composite-length surrogate DFT
      invalidates the run.
    - The frozen convention is the NONTRIVIAL L1 norm (sum over k != 0);
      |vhat(0)| is reported separately per cell but the gate column uses
      only the frozen convention.
    - Controls run before any gate read is believed: >-
        C01 exact, C02 in
        band on both seed sets, C03 PGL_2 stability per row, R03
        reproduction in [0.36, 0.42]. First failed control halts dependent
        reads, preserves evidence, and marks the run void with the
        defective control named.
    - Every stochastic element comes from the frozen
      SHA256(EXP-ECDLP-fac9ea:<cell>:<purpose>:<counter>) streams.
    - Memory above 8 GiB checkpoints the cell as resource_exhaustion with
      a continuation pointer; machine protection only, never a verdict.
    - Write only inside the declared write_scope; existing records are
      immutable; do not commit (the coordinator runs the snapshot
      archive).
    - Bedrock providers/endpoints/model identifiers are prohibited
      (AGENTS.md).
    - An exhausted step or wall-clock budget is reported as such, never as
      a result.
  deliverables:
    - experiments/EXP-ECDLP-fac9ea/runs/TASK-20260921-4888d4/implementation.py
    - experiments/EXP-ECDLP-fac9ea/runs/TASK-20260921-4888d4/checker.py
    - experiments/EXP-ECDLP-fac9ea/runs/TASK-20260921-4888d4/manifest.yaml
    - experiments/EXP-ECDLP-fac9ea/runs/TASK-20260921-4888d4/registry.json
    - experiments/EXP-ECDLP-fac9ea/runs/TASK-20260921-4888d4/fits.json
    - experiments/EXP-ECDLP-fac9ea/runs/TASK-20260921-4888d4/report.md
  artifact_paths:
    - experiments/EXP-ECDLP-fac9ea/runs/TASK-20260921-4888d4/implementation.py
    - experiments/EXP-ECDLP-fac9ea/runs/TASK-20260921-4888d4/checker.py
    - experiments/EXP-ECDLP-fac9ea/runs/TASK-20260921-4888d4/manifest.yaml
    - experiments/EXP-ECDLP-fac9ea/runs/TASK-20260921-4888d4/registry.json
    - experiments/EXP-ECDLP-fac9ea/runs/TASK-20260921-4888d4/fits.json
    - experiments/EXP-ECDLP-fac9ea/runs/TASK-20260921-4888d4/report.md
  write_scope:
    - experiments/EXP-ECDLP-fac9ea/runs/TASK-20260921-4888d4/
  archived_by: null
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: null
    total_cpu_hours: null
    memory_gb: 8
    maximum_runs: 1
    maximum_workers: 4
  stopping_rules:
    - First failed control halts dependent registry reads; preserve all
      evidence and mark the run void with the defective control named.
    - All frozen cells appear in the manifest, including unavailable,
      artifactual, unresolved, and void statuses; no cell silently dropped.
    - Report observations only; interpretation beyond the frozen verdict
      vocabulary belongs to the coordinator's evidence review.
  completion_gate:
    - manifest.yaml present with every frozen cell recorded (registry rows
      x ladder primes, controls, curve-restriction variants) with status
      and raw values.
    - checker.py re-derivations recorded and agreeing: >-
        one small-prime
        spot cell by naive O(p^2) DFT to 1e-9 relative, one mid cell by a
        second independent chirp-z implementation, and the gate algebra
        blind-re-derived from the two cited records' statements
        (character-identical).
    - all four controls passed, or the run marked void with the defective
      control named.
    - registry.json carries per-cell exact values, |vhat(0)|, wall time,
      and peak RSS; fits.json carries exponents, standard errors,
      residuals, jackknife, two-ladder and seed-set comparisons.
    - report.md carries the gate verdict table using only the frozen
      vocabulary.
  review_plan: null
