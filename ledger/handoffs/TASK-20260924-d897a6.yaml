# REVIEW of the DIFFERENCE between the DRAFT
# AMD-EXP-GFPN-05ff43-20260924-launchkind and the DRAFT
# AMD-EXP-GFPN-05ff43-20260924-attcount (RJ-1..RJ-8, RGL-10..RGL-12), and of
# that difference's interaction with everything incorporated.
# It runs no msolve, valgrind, callgrind_annotate, gp, Sage or builder child,
# creates no run package, and imports no module of the scanned trees.
# Its questions, as before: can a package be PASSED, PASSED_ZL or ADMITTED by
# the rules while a capped child that may have executed argv has no recorded
# cap read-back, while a pair the parent read is in no launch record, while a
# created child is recorded as not created, while a record written in a
# process other than the installing one goes undetected, or while its outcome
# was recorded by the wrapper (a FAIL-OPEN counterexample)? And does any
# planned basis outcome FAIL by design (a PLANNED-BASIS REFUSAL)? New this
# round: every production LAUNCH KIND is checked for a lost-record detector
# written independently of the launch recorder, and the previous round's
# fail-open CX-A is the known answer.
# Ordered by DEC-20260924-babd04. Written by the Coordinator under
# TASK-20260924-491b2a. This card launches nothing. Its one archival task is
# TASK-20260924-68cf6b.
# =============================================================================
