    (review_design.prior), to which this reviewer is blind.
  review_design:
    owner_of_every_joint: TASK-20260924-d897a6 (single reviewer)
    joints:
      LJ-0_known_answer_control:
        reading: failclosed RFR-0 (c), and CRJ-4 (b)-(f)
        claim_under_attack: The reviewer's own method is sensitive enough to find the fail-open and planned-basis cases the previous rounds found, including CX-1 and CX-A, on rule text and on real package listings.
        worked_attack: >-
          Apply the method used for LJ-1..LJ-3, unchanged, to the objects CRJ-4
          names, in the order (a)-(f). Report what the method actually did on
          each object, at record level and package level.
        failure_signature: A method that does not flag these objects cannot support "holds" on LJ-1 or LJ-2.
      LJ-1_launch_kinds_no_fail_open:
        reading: failclosed RFR-1 (definitions (i)-(v); (iv) read literally; (ii) with an absent record read as "not class (A) or (C)"), applied to RJ-1..RJ-4 and RJ-7 (c) and their interaction with RI-1, RH-1, RG-1, RF-0..RF-3, RL-1, RL-2, RL-3 and RB-1
        claim_under_attack: >-
          With RJ-1..RJ-4, a lost launch record of any of the six production
          launch kinds is a named gap or leaves a recorder gap, whether or not
          the child wrote a file, except under RGL-10's declared
          consistent-loss premise; the six call sites are all of them; and the
          carried residuals (X1, X6b, X10; IV-1 under RH-1 (iv); TW-2) still
          have no supplying code.
        worked_attack: >-
          (1) For EACH of LK-1..LK-6, construct a lost record of a launch whose
          child writes no file (a failure before its stdout open; a refusal
          before fork; a refusal after fork) and of a launch that exec'd, and
          state whether the kind's detector is written on that path, before or
          after the launch, and by a code path other than the launch recorder;
          in particular: whether any path launches a callgrind child without
          the key instructions_callgrind in a returned result, or sets the key
          without a launch (callgrind_instructions raising after its
          run_child; any other writer of the key); whether pari/<tag>.gp is
          written on every gp launch path (curve_facts, fb1_curve_search) and
          by nothing else; whether raw-result.json carries comparator.child on
          every comparator launch path and not otherwise. (2) A lost record
          together with its detector: state which losses must be consistent
