handoff:
  id: TASK-20260803-001a04
  from: coordinator
  to: validator
  objective: Independently verify the per-cell occupancy regression. Re-derive the slope with your own
    variance treatment and your own null calibration; check the heteroscedasticity and shared-rate-model
    dependence are handled correctly, since an ordinary least-squares standard error would be wrong here;
    and state whether the low-occupancy deficit is structural at per-cell resolution.
  uncertainty_reduced: Whether the sharper instrument confirms or overturns BATCH-016 tercile result.
    BATCH-015 went to ledger on one investigation and one validation and BATCH-016 corrected it; this
    batch is the correction of the correction and must not repeat that thinness.
  inputs:
  - The verified TASK-20260803-6b6f9d snapshot commit and its three artifacts
  - EV-MLKEM-ee220e, EV-MLKEM-ce1884
  - The BATCH-015 and BATCH-016 packages
  constraints:
  - Never fabricate a command, output, timing, statistic, citation, or run (AGENTS.md rule 9).
  - 'ZERO NEW SAMPLING of the physical system: no G6K, no network, no new .out bytes. Seeded randomness
    for your own null objects is expected; disclose it.'
  - Toy tier; raw undivided score scale; NO ML-KEM security claim.
  - 'AGENTS.md rule 12 stays UNMET and UNWAIVED: EV-MLKEM-011, EV-MLKEM-013 and EV-MLKEM-017 keep their
    status; KN-FIND-031 stays withdrawn.'
  - 'BINDINGS IN FORCE: no whole-band ratio without its effective degrees of freedom; do NOT quote a specific
    dof value (state O(1), range 1.51-2.35, give the C>=1000 comparison); read a congenial control code
    before summarising it; a re-derivation reaching the same conclusion by the same route is NOT an independent
    check -- state which STEP you checked; decompose rms into bias and centred scatter before inferring
    fit-dependence; before asserting the archive LACKS something, open the directory and NAME THE COMMAND
    that established it; a minimum over a family is NOT the expected value of the statistic.'
  - Write only inside the declared write_scope. Do not edit any prior artifact or ledger record. Do not
    git commit.
  - Independent session. RE-DERIVE, do not confirm. State which STEP you checked.
  - You did not produce this package and must not repair it. Report defects; do not edit producer artifacts.
  - If the result is inconclusive at per-cell resolution, say so plainly rather than forcing a verdict.
  - Return ADMISSIBLE, ADMISSIBLE_WITH_DEFECTS or INADMISSIBLE with numbered defects.
  deliverables:
  - validation_report.yaml with per-claim reproduction status and a package verdict
  - validation_notes.md
  artifact_paths:
  - coordination/goals/GOAL-MLKEM-003/batches/BATCH-017/tasks/TASK-20260803-001a04/validation_report.yaml
  - coordination/goals/GOAL-MLKEM-003/batches/BATCH-017/tasks/TASK-20260803-001a04/validation_notes.md
  archived_by: TASK-20260803-8f94e0
  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 3000
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
  - every quantitative claim marked reproduced, not_reproduced or unable_to_check with a reason
  - an explicit statement on whether the deficit is structural at per-cell resolution
  - a package verdict
