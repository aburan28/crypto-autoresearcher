  review_plan:
    claim_under_review: >-
      As the producer stated it (experiments/EXP-PFDR-cbdefb/
      execution-report.yaml, observations, verbatim): "per_cell_pairs_after_
      iteration_rule: semaev: s1 'no valid fall (count-1 entries
      invalidated; raw (3, 3))', s2 '(5, 5) x 120', s3 '(5, 5) x 120', s4
      '(6, 6) x 120', s5 '(6, 6) x 120; all certified C1+C2'"; "null1: ...
      s3 '(6, 6) x 600', s4 '(7, 7) x 600', s5 'no fall in (4, 7] on all 600;
      right-censored'"; "null3: ... s3 '(5, 5) x 15', s4 '(6, 6) x 15', s5
      '(6, 6) x 15'"; "noncurve: ... s2 '(5, 5) x 120', s3 '(5, 5) x 120', s4
      '(6, 6) x 120', s5 '(6, 6) x 120'"; "single_fall: every fallen system
      on every arm at every cell has exactly one fall degree (d_lf = d_ff);
      the cascade completes the ideal cap B_{<=D} at that degree";
      "slopes: d_lf_primary_s2_to_5: {slope: 0.4, ci95_t: [0.3820, 0.4180],
      n: 480, residual_variance: 0.0502, bootstrap_ci95: [0.4, 0.4]}";
      "outcome_label: d_lf_only: unresolved; joint: unresolved";
      "heur_002_falsifier_statistic: d_lf interval [0.382, 0.418] excludes
      0 on a ladder uncensored at its top (s = 5): the pre-registered
      condition fires (statistic only; no judgment made here)";
      "heur_001_null_band: NULL-1 and NULL-2 offsets c = d_lf - (s + 2): 0
      at s = 1, 1 at s = 2, 3, 4 (every uncensored draw); s = 5 not testable
      (all draws censored, no fall below 7)"; "f5_controlled_null: NULL-1
      and NULL-2 do NOT reproduce the Semaev pair at every cell ...; the
      NON-CURVE CUBIC reproduces the Semaev pair at EVERY cell (F5 true for
      noncurve)"; "null3_vs_semaev: d_ff difference 0 at s = 3, 4, 5 (all
      cells); d_lf difference 0". The hypothesis (H-PFDR-c88f14, title): "No
      bounded-last-fall-degree theorem transfers to the prime-field digit
      presentation ..., so the last fall degree must be MEASURED on the
      s-ladder; the pair (d_ff, d_lf) separates semi-regular growth,
      isolated early falls that do not cascade, and the genuinely bounded
      case, and only the bounded case licenses IDEA-20260830-84cdb7's
      conditional exponent".
    coordinator_prior: >-
      Written 2026-09-04 before any reviewer runs. (1) THE LABEL. I expect
      the 'unresolved' label to survive mechanically, but for a reason the
      pre-registered rule did not anticipate: the d_lf and d_ff fits are
      identical because every fallen system has a single fall (d_lf = d_ff
      on every draw), so the joint rule's clause 'd_ff interval strictly
      below the d_lf point estimate' can never hold and Outcome II was
      unreachable on these data; Outcomes I and III are excluded only by a
      t-interval that I expect the red team to break as an artifact of
      pseudo-replication: within-cell variance is exactly zero (every draw
      in a cell returns the same integer), so the 480 'draws' are four
      values (5, 5, 6, 6) each repeated 120 times, and [0.382, 0.418] is the
      lack of fit of a line to a step function with a fictitious sample
      size. On the four independent s-points the OLS slope is still 0.40 but
      the 95 percent t-interval (2 degrees of freedom) is roughly 0.4 +/-
      0.61, containing both 0 and 1; the 'HEUR-002 falsifier statistic
      fires' claim does not survive an honest interval, and the ladder is
      genuinely unresolved at resolution 0.25 with four points. (2) WHAT
      0.40 MEANS. The slope is the OLS of the step 4 + floor(s/2) over
      s = 2..5 (H-PFDR-4148b8's closed form for d_ff, slope 1/2 per two
      steps), so d_lf tracks the derived first-fall law exactly and is not
      flat over any four consecutive cells (longest flat run 2): Outcome
      III's flatness requirement fails on the integers themselves,
      independently of any interval. For HEUR-002 (bounded last fall) the
      honest reading is therefore 'not supported at the tested scale, and
      contradicted in substance by the integers (d_lf rises from 5 to 6
      between s = 3 and s = 4 on every one of 120 draws at three primes)',
      with the frozen statistic an invalid instrument for that reading. I
      expect the decision to be weaken on HEUR-002 with the refutation
      basis declared as empirical plus a derivation note IF the red team can
      argue d_lf = d_ff = 4 + floor(s/2) from the closed form and the
      closure's saturation (which would make the refutation derivation-tier
      and the bound's growth explicit), never reject_scoped on the
      artifactual interval. (3) THE NEW FACT. 'V_{F,d_ff} = I cap B_{<= d_ff}
      at every cell' means the Huang-Kosters-Yeo closure SOLVES the digit
      system at degree d_ff = 4 + floor(s/2), a solving degree of slope 1/2
      against the null's s + 3; this is a lane-relevant fact the battery did
      not predict, promotable if the completeness certificate (C1/C2) is
      right, and it is the measured law that EXP-PFDR-c04716's D_0 must be
      read against (D_0(s) = 4 + floor(s/2), growing: the cost table's
      'D_0 <= 6' is exceeded from s = 6 on). (4) CONTROLS. HEUR-001 (null
      band) holds where testable (c = 1) but D_max = 7 censored the null's
      own last fall at s = 5, a design defect that removed the null's top
      cell; NULL-3 reproduces the full pair at s = 3..5 and the non-curve
      cubic at every cell, so, exactly as pre-registered under F5, the
      measurement is about digit complete intersections with a monomial top
      form and licenses no Semaev-specific statement. (5) INSTRUMENT RISKS
      the round must clear: the dense float64 engine's exactness bound at
      s = 5 (39 of 40 Semaev draws per cell rest on it alone), the
      completeness certificate's C2 criterion (a false certificate would
      hide falls above D_max and bias toward flatness, the Outcome III
      direction), and the count-1 rule that invalidated every s = 1 fall
      for a structural (saturation) reason rather than an artifact -- the
      frozen tell over-triggers at tiny n, a protocol observation. DECISION
      I EXPECT: H-PFDR-c88f14 claim (A) (no transfer) holds as a derivation;
      the measurement's own label is unresolved; HEUR-002 weakened at the
      tested scale; HEUR-001 supported where testable; evidence strength
      replicated for the integers (three primes, 120 draws per cell, two
      engines cross-checked at s <= 4) and inconclusive for the slope
      statistic; a knowledge finding for the single-fall / closure-solves
      observation and the measured D_0(s) law if the certificate holds.
    joints:
      - joint: 'V1 blind re-derivation of (d_ff, d_lf) under the HKY closure on the declared subsample and the slope over s = 2..5'
        assigned_to: TASK-20260904-42b33a
        attack_plan: >-
          Implement review_plan.blind_rederivation.quantity from its
          statement alone: for each s in {2, 3, 4, 5} and each of the 12
          instances, the generator S~ = S_3(ell_1, ell_2, x_R) with ell_k =
          sum_{i < s} 2^i a_{k,i}, the field equations a_{k,i}^2 - a_{k,i},
          and Huang-Kosters-Yeo's V_{F,D} for D = 4..7 computed to a fixed
          point by your own exact linear algebra modulo p: a fall at D iff
          dim(V_{F,D} cap R_{<= D-1}) > dim V_{F,D-1}; record the fall
          history, the pass count per degree, d_ff, d_lf and your censoring
          basis (structural completeness when D_max >= n + 1, i.e. s <= 3;
          otherwise state whether you can certify no fall above 7 and how).
          Then fit d_lf on s over s = 2..5 by OLS (a) per draw (48 points)
          and (b) per cell (12 cell means) and (c) per s (4 points), each
          with the 95 percent t-interval, and evaluate the contract's
          three-outcome rule on each. Where I think it breaks: nowhere on
          the integers ((5, 5), (5, 5), (6, 6), (6, 6) with a single fall
          per system); on the interval, (a) reproduces something narrow and
          (c) contains 0 and 1, which is the finding.
        breaking_artifact: >-
          Any (s, instance) whose (d_ff, d_lf) differs from the pattern
          (5, 5), (5, 5), (6, 6), (6, 6), or a system with more than one
          fall degree, with your V_{F,D} dimensions per pass archived; or a
          statement that the quantity is underspecified, naming the missing
          convention (the disagreement then localises to a convention, not
          to arithmetic).
      - joint: 'V2 run-set validity, manifest schema and pinning, the two closure.py hashes, the convention hash binding, seeds'
        assigned_to: TASK-20260904-42b33a
        attack_plan: >-
          PHASE B. For each of the 23 run directories: seven files present
          (six required plus package-sha256.json), sidecar hashes recomputed
          and matching, manifest status completed_valid, code.commit
          3029ff14 with dirty false, the pinned sha256 of closure.py (expect
          exactly two distinct values: one for the fixture and s1-slice runs,
          one for runs 3-23 -- list which runs carry which) and of
          run_cbdefb.py, meter per-file sha256 equal to
          harness/macaulay_fp/VALIDATION.md, closure_convention_sha256 equal
          to the sha256 of stage1-closure-convention.md computed by a hashing
          tool WITHOUT opening the file, seeds equal to the contract's
          (curves 3101..3108, targets 1..5, null 7..19, fixture seed 5, the
          5726af seeds 1101..1103 / 1..2 in the dff-agreement run), D_max 7,
          plant_window 4, the engine_policy block (sparse column limit 256,
          certificate column limit 1024, dense exactness bound p^2 (ncols +
          1) < 2^53) and whether that bound holds at p = 65537 with 968
          columns, budget block, timing_source wrapper, stderr empty, the
          session inference block with model_verified false disclosed. Count
          runs (23 of 48 allowed) and total wall time against the caps.
          Where I think it breaks: nowhere; the two closure.py versions are a
          disclosed change whose metric-neutrality only the red team (who
          may read the file) can judge -- record the hashes and defer.
        breaking_artifact: >-
          A hash mismatch, a run whose closure.py hash is neither of the two
          declared versions, a convention hash that does not match the
          file, a seed set differing from the contract, or an exactness
          bound violated at the recorded column count.
      - joint: 'V3 instance and certificate checks on the declared subsample and the distinct-instance count'
        assigned_to: TASK-20260904-42b33a
        attack_plan: >-
          With your own arithmetic, for each of the 12 instances (p, a, b,
          x_R) in review_plan.blind_rederivation.parameters: non-singular
          curve with a, b != 0; at least two on-curve x in [0, 4); x_R equals
          x(P_1 + P_2) for some pair of window points with signs (an
          independent decomposition certificate). Then, from the
          parameters block and the plan's note that target seeds 1 and 5 of
          curve 3101 at p = 4099 share x_R = 1960 and target seeds 2, 3 of
          curve 3101 at p = 16411 share x_R = 4634: enumerate for each
          declared curve ALL distinct x(P_1 + P_2) over window pairs and
          signs, and state the maximum number of distinct generator systems
          any curve can contribute at window [0, 4) (I expect at most 3
          on-curve x, hence at most a handful of distinct x_R per curve);
          conclude a bound on the number of distinct (curve, x_R) systems
          among the 40 draws of any cell. Where I think it breaks: the
          'n = 480 draws' of the slope fit are far fewer distinct systems;
          a replication-count finding for the red team's R1.
        breaking_artifact: >-
          An instance whose x_R is not a window-pair sum, a singular or
          special-j curve, or the distinct-system bound with its
          enumeration (an artifact for the composition, not a break of the
          integers).
      - joint: 'V4 CTRL-DFF-AGREEMENT and cross-engine coverage from the manifests'
        assigned_to: TASK-20260904-42b33a
        attack_plan: >-
          PHASE B. From RUN-PFDR-cbdefb-dff-agreement's manifest and the
          four EXP-PFDR-5726af cell manifests (m2-s2..s5): confirm the
          dff-agreement instances are 5726af's (curve seeds 1101..1103,
          targets 1..2, p = 4099; the plan's 5726af parameter list gives
          a = 527, b = 72, x_R = 2374 for (1101, 1)), that the closure's
          d_ff equals the graded d_ff equals 5726af's recorded per-draw
          values (5, 5, 6, 6 at s = 2..5) on all 24 rows, and that d_lf =
          d_ff with none censored. From the 15 ladder manifests: tabulate
          per cell the engine used, cross_checked count and
          cross_check_agree_all (expect sparse with 40/40 at s <= 4, dense
          with 1/40 at s = 5), right_censored and no_fall_in_window counts
          per arm, min_iteration_count_at_falls and
          fall_with_iteration_count_1 (expect 0 at s >= 2), and
          P1_closure_dff_equals_graded_dff_all_semaev. Record as a
          limitation that 39 of 40 Semaev draws per s = 5 cell rest on the
          dense engine alone. Where I think it breaks: nowhere.
        breaking_artifact: >-
          A dff-agreement row that disagrees with 5726af's recorded value,
          a censored Semaev draw counted in a fit, or a cell whose
          cross-check flag is false.
      - joint: 'R0 raw/summary agreement: slopes, labels, band table, iteration counts and the count-1 rule from the raw records'
        assigned_to: TASK-20260904-3a2ff5
        attack_plan: >-
          From runs/*/raw-result.json only, regenerate analysis.md sections
          B-M with your own code: per-cell (d_ff, d_lf) histograms per arm
          before and after the count-1 invalidation, censoring counts, the
          per-draw OLS slopes and t-intervals for d_lf and d_ff (primary
          s = 2..5 and secondary), the bootstrap, the outcome rule
          evaluation, the null band offsets, the NULL-3 table, the F5 flags,
          the iteration-count table, the equal-d^s and m = 3 sections; diff
          against analysis.md, analysis.json and execution-report.yaml.
          Verify that the count-1 rule was applied exactly as the contract's
          invalidation rule 3 states and only at s = 1. Where I think it
          breaks: nowhere.
        breaking_artifact: >-
          Any table entry, slope, interval or label that differs from the
          raw records, or a censored draw inside a fit.
      - joint: 'R1 pseudo-replication: the slope interval, the outcome rule and the HEUR-002 falsifier statistic'
        assigned_to: TASK-20260904-3a2ff5
        attack_plan: >-
          Show what the per-draw t-interval [0.382, 0.418] with n = 480 is
          measuring when within-cell variance is exactly zero: the 480
          observations are 4 distinct values (5, 5, 6, 6) each replicated
          120 times, so the residual variance is the lack of fit of a line
          to a step, and the standard error shrinks as 1/sqrt(480) for no
          statistical reason. Recompute the slope and interval on the
          independent units: (a) the 12 (s, p) cells; (b) the 4 s-points
          (2 degrees of freedom); (c) the number of DISTINCT generator
          systems per cell (joint V3's bound). Re-evaluate the pre-registered
          three-outcome rule and the joint rule on each, and the HEUR-002
          falsifier statistic ('d_lf interval excludes 0'). Then state
          whether Outcome II was reachable at all given d_lf = d_ff on every
          draw, and produce the corrected label table. Where I think it
          breaks: the falsifier 'fires' only under pseudo-replication; on
          (b) the interval contains 0 and 1.
        breaking_artifact: >-
          The corrected interval table and label evaluation (a break of the
          execution report's 'fires' statistic, not of the integers), or a
          demonstration that the per-draw interval is statistically
          legitimate.
      - joint: 'R2 is the frozen closure HKY invariant, and is the completeness certificate sound?'
        assigned_to: TASK-20260904-3a2ff5
        attack_plan: >-
          Read stage1-closure-convention.md sections 1-3 and closure.py.
          Check the section-2 equivalence (reduced ring with fallen-element
          multiplication versus the polynomial ring with field equations
          adjoined; nominal multiplier degree; multiply only fallen
          elements) line by line, and the section-3 completeness certificate:
          (S) structural at D_max >= n + 1, and (C) ideal-side C1: dim
