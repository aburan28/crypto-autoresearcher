handoff:
  id: TASK-20260904-1f4e2f
  from: coordinator
  to: executor
  goal_id: GOAL-SSI-001
  batch_id: BATCH-256a94
  objective: >-
    Determine, from committed inputs and code reading alone, which van
    Oorschot-Wiener charging law each governing EXP-WESOVOW-001 artifact
    actually carries and whether any source fix remains outstanding; whether
    the corrected law carried by the current implementation and by
    RUN-WESOVOW-201692-001 is the same law as the one independently derived in
    BATCH-eb0a7e; and how the fitted_opt and PAPER_PAIRS anchors reconcile
    across the frozen grid, with every disagreement localized to an anchor or
    to a formula.
  uncertainty_reduced: >-
    Whether this goal is looking at a live source defect or at an already
    repaired implementation that one branch had not yet merged; whether two
    independently produced corrections agree; and whether the fitted_opt /
    PAPER_PAIRS divergence that grounds the standing P=512 citation
    prohibition is an arithmetic error, a formula difference, or a genuine
    difference between two committed inputs.
  inputs:
  - AGENTS.md and the frozen-artifact ruling in BATCH-256a94/batch.yaml
  - experiments/EXP-WESOVOW-001/specification.yaml (frozen contract, read-only)
  - experiments/EXP-WESOVOW-001/cost_model.py (read-only)
  - experiments/EXP-WESOVOW-001/runs/RUN-WESOVOW-001/ (frozen predecessor run, read-only)
  - experiments/EXP-WESOVOW-001/runs/RUN-WESOVOW-201692-001/ (successor run, read-only)
  - The BATCH-eb0a7e producer package under tasks/TASK-20260824-dd5b5c/ and its Validator report
  - Committed records DEC-20260809-c1066f, DEC-20260809-39eb45, EV-SSI-4b17e7, EV-SSI-e8cc71,
    EV-SSI-12c22e, DEC-20260824-384e78, EV-WESO-001
  - Committed corrections CORR-20260806-3ac71e and CORR-20260808-c792f8
  constraints:
  - 'READ-ONLY, ABSOLUTELY: experiments/EXP-WESOVOW-001/specification.yaml,
    experiments/EXP-WESOVOW-001/cost_model.py, and every file under runs/RUN-WESOVOW-001/
    and runs/RUN-WESOVOW-201692-001/. Do not edit, move, regenerate, reformat, rerun,
    or stage any of them. The specification is a frozen contract changeable only by a
    recorded protocol amendment, never by an edit.'
  - WRITE ONLY inside coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/tasks/TASK-20260904-1f4e2f/
    and produce exactly the seven declared artifacts, no eighth. Do not modify task_card.yaml.
  - RG-0 SOURCE-STATE CENSUS RUNS FIRST AND CAN CHANGE THE TASK. Quote with file and line
    number the charging law in cost_model.py's serialized formulas block, in its executable
    expression, in RUN-WESOVOW-001/raw-result.json, in RUN-WESOVOW-201692-001/raw-result.json,
    and in specification.yaml's C3/C4 controls. Report the verdict as exactly one of
    fix_already_applied, fix_outstanding, or indeterminate, with its evidence.
  - Treat the opening_observation block in batch.yaml as an unverified Coordinator hypothesis
    to be checked, including the possibility that it is wrong. It is not evidence and may
    not be cited as support.
  - 'If RG-0 returns fix_outstanding, do NOT apply any fix: emit the proposed change as an
    unapplied unified diff inside outstanding_fix.md together with the exact protocol-amendment
    fields a Coordinator would have to record, and state plainly that nothing was applied.'
  - If RG-0 returns indeterminate, stop after source_state_census.md and outstanding_fix.md,
    write the remaining five artifacts as explicit not-attempted stubs naming the blocking
    indeterminacy, and report the stop. A stop here is a legitimate result, not a failure.
  - 'reconcile.py must be standalone: Python standard library plus numpy at most, no network,
    no SageMath or g6k, and no imports from experiments/. It reads committed inputs read-only
    and writes only inside the task directory.'
  - 'Report every reconciled quantity twice with the anchor named in every row, and never
    mix anchors: fitted_opt takes both time and memory from RUN-WESOVOW-001 per_field optimal
    values, PAPER_PAIRS takes both from the cost_model.py literals. A mixed-anchor row is a
    defect, not a result.'
  - 'Cover the frozen full grid in both anchors: field sizes 256, 384, 512, 576, 768; log2 w
    in 30, 40, 50, 60, 70, 80; overhead c in 0.0, 0.5, 1.0, 2.0.'
  - Run RG-1 predecessor reproduction, RG-2 successor reproduction, RG-3 null discrimination,
    and RG-4 cap and monotonicity, each with a stated concrete input that would have made it
    fail; for RG-4 state whether the cap identity is algebraically entailed by the law under
    test.
  - Every number must trace to a committed path and key or to a formula stated in the artifact.
    Never fabricate commands, outputs, timings, statistics, citations, or runs; missing data
    stays missing and is reported as missing.
  - A timeout, crash, missing dependency, or exhausted budget is an operational observation
    and never mathematical evidence about the cost model or any isogeny problem.
  - Restate the P=512 citation prohibition verbatim in every artifact and do not lift it.
    Make no security, standardized-parameter, exponent, or asymptotic-complexity claim in any
    direction. Write no ledger or scientific record, change no status, and do not commit.
  - Never select a provider, backend, endpoint, or model identifier containing Bedrock,
    case-insensitively.
  deliverables:
  - source_state_census.md
  - law_equivalence.md
  - reconcile.py
  - anchor_reconciliation.json
  - anchor_reconciliation.md
  - controls_report.md
  - outstanding_fix.md
  artifact_paths:
  - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/tasks/TASK-20260904-1f4e2f/source_state_census.md
  - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/tasks/TASK-20260904-1f4e2f/law_equivalence.md
  - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/tasks/TASK-20260904-1f4e2f/reconcile.py
  - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/tasks/TASK-20260904-1f4e2f/anchor_reconciliation.json
  - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/tasks/TASK-20260904-1f4e2f/anchor_reconciliation.md
  - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/tasks/TASK-20260904-1f4e2f/controls_report.md
  - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/tasks/TASK-20260904-1f4e2f/outstanding_fix.md
  read_scope:
  - AGENTS.md
  - CLAUDE.md
  - docs/claims-and-verification.md
  - docs/inventor-protocol.md
  - experiments/EXP-WESOVOW-001
  - ledger/evidence/EV-WESO-001.yaml
  - ledger/evidence/EV-SSI-4b17e7.yaml
  - ledger/evidence/EV-SSI-e8cc71.yaml
  - ledger/evidence/EV-SSI-12c22e.yaml
  - ledger/decisions/DEC-20260809-c1066f.yaml
  - ledger/decisions/DEC-20260809-39eb45.yaml
  - ledger/decisions/DEC-20260824-384e78.yaml
  - ledger/corrections
  - coordination/goals/GOAL-SSI-001/batches/BATCH-eb0a7e
  - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94
  write_scope:
  - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/tasks/TASK-20260904-1f4e2f
  archived_by: TASK-20260904-47c3ea
  inference:
    policy: executor-implementation
    reasoning_effort: medium
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 5400
    memory_gb: 2
    maximum_runs: 4
  completion_gate:
  - All seven artifacts exist at their exact declared paths and nothing else was written.
  - No file under experiments/ was modified, moved, or staged.
  - RG-0 records a verdict of exactly fix_already_applied, fix_outstanding, or indeterminate,
    with the five verbatim law quotations and their file:line references.
  - RG-1 and RG-2 each passed, or the task stopped and reported an implementation or
    infrastructure failure and produced no reconciliation verdict.
  - RG-3 and RG-4 each carry a verdict and the concrete input that would have made them fail.
  - Every reconciled cell names its anchor, both anchors cover the full frozen grid, and no
    row mixes anchors.
  - Any outstanding fix appears only as an unapplied diff inside outstanding_fix.md with the
    amendment fields a Coordinator would need.
  - The P=512 prohibition is restated verbatim in every artifact and is not lifted, and no
    security, parameter, exponent, or asymptotic claim is made.
  - No ledger or scientific record was written, no status was changed, and nothing was
    committed.
  return_format: >-
    A short task report in the final message naming the RG-0 verdict, the
    law-equivalence outcome, the per-anchor maximum deviation, each control
    verdict, and every limitation. Findings live in the artifacts; a result
    that exists only in a message did not happen.
  review_plan:
    claim_under_review: >-
      The package produced by TASK-20260904-1f4e2f, as that task states it in
      its own artifacts: the RG-0 verdict on whether a charging-law source fix
      remains outstanding for EXP-WESOVOW-001; the law_equivalence.md finding
      on whether the law carried by the current cost_model.py and
      RUN-WESOVOW-201692-001 is the same law as the one derived independently
      in BATCH-eb0a7e; and the anchor_reconciliation finding on how the
      fitted_opt and PAPER_PAIRS anchors reconcile across the frozen grid,
      including whether anything in that reconciliation bears on the standing
      P=512 citation prohibition.
    coordinator_prior: >-
      Recorded before any reviewer runs. I expect RG-0 to return
      fix_already_applied: that the repair was made, reviewed, and admitted
      upstream on 2026-08-09 (DEC-20260809-c1066f, protocol amendment
      TASK-20260809-ef3e58, EV-SSI-4b17e7) and reached this branch only in the
      recent merge, so that BATCH-eb0a7e localized a real defect in a
      pre-merge file and no new source edit is warranted. I expect
      law_equivalence.md to find the two corrected laws algebraically
      IDENTICAL in the frozen log2 units, with agreement to floating-point
      tolerance wherever the grids overlap. I expect the fitted_opt versus
      PAPER_PAIRS divergence to SURVIVE reconciliation as a genuine difference
      between two committed inputs rather than an arithmetic error, and
      therefore expect the P=512 / w=2^80 prohibition to remain in force. I
      expect at least one residual bookkeeping inconsistency that is not a law
      defect (specification.yaml required_artifacts naming only
      RUN-WESOVOW-001, cost_model.py's RAW_PATH and run_id defaults naming the
      successor run, and the recorded C1 partial_fail). The findings that
      would most inform this program are the ones that overturn this prior: a
      genuine fix_outstanding verdict, a demonstrated inequivalence between the
      two corrected laws, or a demonstration that the anchor divergence is an
      arithmetic artifact after all.
    joints:
    - joint: J1 source-state census
      assigned_to: TASK-20260904-e13cf2
      attack_plan: >-
        Do not accept the producer's quotations. Open each of the five
        governing artifacts yourself and read the charging law at its own line
        numbers: cost_model.py's serialized formulas block, its executable
        log2Tw expression, RUN-WESOVOW-001/raw-result.json,
        RUN-WESOVOW-201692-001/raw-result.json, and specification.yaml's C3 and
        C4. Then check the census against the committed record set: does
        DEC-20260809-c1066f actually admit the repair the producer says it
        admits, and does the amendment it names exist? Where I think this
        breaks: the census is a claim about what is COMMITTED and the producer
        reads a WORKING TREE. If the producer never distinguished the two, its
        verdict is about an unverified tree state and the verdict word is
        stronger than its evidence.
      breaking_artifact: >-
        A quotation at a named file:line contradicting the census, or a named
        committed record that does not say what the census reports it says, or
        a demonstration that the census conflated worktree with committed
        state.
    - joint: J2 law equivalence
      assigned_to: TASK-20260904-e13cf2
      attack_plan: >-
        Derive the required law yourself from specification.yaml alone, before
        opening law_equivalence.md: C3 requires T(w) non-increasing in w and
        equal to T_full for w >= M, C4 requires equality to T_full exactly at
        w = M. Then test the producer's equivalence claim numerically at the
        boundary cases it is most likely to have skipped: w > M, w exactly M,
        the smallest budget log2 w = 30 at log2 p = 768, and c = 2.0 where the
        overhead term is largest. Where I think this breaks: a min/max clamp
        difference between the two implementations that is invisible at w < M
        and appears only at or above the cap.
      breaking_artifact: >-
        A concrete (p, log2 w, c) cell where the two corrected laws differ by a
        stated number of bits, or a proof that the producer's equality argument
        omits the clamp region.
    - joint: J3 numerical reconciliation
      assigned_to: TASK-20260904-e13cf2
      attack_plan: >-
        Recompute a sample of anchor_reconciliation.json independently from the
        committed literals, choosing rows adversarially rather than uniformly:
        the smallest absolute margins, every row the producer reports as
        agreeing exactly, and every row where the two run packages overlap.
        Check row count against the declared grid (5 x 6 x 4 per anchor) and
        check that no row mixes a time from one anchor with a memory from the
        other. Where I think this breaks: silent tolerance inflation, or a
        claimed comparison against RUN-WESOVOW-201692-001 that actually
        re-reads the producer's own recomputation.
      breaking_artifact: >-
        A row whose independently recomputed value differs from the producer's
        beyond the declared tolerance, a missing or duplicated grid cell, or a
        mixed-anchor row.
    - joint: J4 anchor reconciliation and citation eligibility
      assigned_to: TASK-20260904-22e444
      attack_plan: >-
        Attack the conclusion the package invites rather than the arithmetic it
        shows. Take the P=512, log2 w = 80, c = 0 cell under both anchors and
        ask what would have to be true for either anchor to be the right one to
        cite: what does each anchor's memory value actually measure, are they
        even the same quantity, and does either run package establish that its
        optimum is the operative one at that budget? Then try to construct the
        strongest honest argument for LIFTING the prohibition and show where it
        fails. Where I think this breaks: the package can reconcile the
        arithmetic completely and still leave the anchor CHOICE undetermined,
        which is exactly the condition under which a reader lifts a prohibition
        on the strength of tidy numbers.
      breaking_artifact: >-
        Either a demonstration that one anchor is not comparable to the other
        at all, which would strengthen the prohibition, or a defensible
        argument that the prohibition may be lifted, stated as a recommendation
        with its conditions and never as a decision.
    - joint: J5 control capability
      assigned_to: TASK-20260904-e13cf2
      attack_plan: >-
        For each of RG-0 through RG-4, construct the concrete input that makes
        it fail and check that the producer's implementation would actually
        take that branch. Pay particular attention to RG-4: BATCH-eb0a7e's
        Validator recorded that its cap control passed an identity that was
        algebraically built into the law being tested. Check whether RG-4
        repeats that, and whether the producer disclosed it. Where I think this
        breaks: a control that is a restatement of the law it is meant to test.
      breaking_artifact: >-
        A control with no reachable failure branch, or a passing control whose
        pass is entailed by the law under test and was reported as
        confirmation.
    - joint: J6 scope and provenance of the fix-status verdict
      assigned_to: TASK-20260904-22e444
      attack_plan: >-
        Ask what this package licenses if accepted. Enumerate every sentence in
        it that could be quoted as support for a statement about SQIsign, a
        standardized parameter set, an exponent, a security margin, or the
        status of GOAL-SSI-001, and show the shortest path by which a later
        reader could over-read it. Separately, attack the provenance of the
        fix-status verdict: if it rests on an unverified worktree read, or on
        the Coordinator's opening_observation block, say so - that block is
        explicitly not evidence. Where I think this breaks: a verdict of
        fix_already_applied is a claim about the program's own history and is
        the easiest thing here to assert more strongly than the evidence
        supports.
      breaking_artifact: >-
        A named sentence with a worked over-reading path, or a demonstration
        that the fix-status verdict rests on a source the batch declared
        inadmissible.
    blindness:
      mutual: true
      lifted_for: []
      rationale: null
    proves_too_much:
      objects:
      - The predecessor law as serialized in RUN-WESOVOW-001/raw-result.json, for which the
        conclusion "this law satisfies the C4 cap requirement at w = M" is KNOWN FALSE.
      - A synthetic anchor with log2 M = 0, for which the conclusion "the corrected law and
        the predecessor law are distinguishable at the probe" is KNOWN FALSE because both
        reduce to log2 T_full.
      - The predecessor run's committed vOW rows fed to the successor law's checker, for
        which the conclusion "these values agree with the corrected law" is KNOWN FALSE.
      failure_signature: >-
        On each object the package's own procedure must report the negative
        outcome: a cap violation on the first, no discrimination on the second,
        and disagreement on the third. If any of them passes, the procedure
        proves too much and its agreements elsewhere carry no information; say
        so explicitly rather than treating the pass as a robustness result.
      assigned_to: TASK-20260904-22e444
    blind_rederivation:
      required: true
      quantity: >-
        The van Oorschot-Wiener time-memory law log2 T(w) for a memory budget
        w, in the frozen contract's log2 units, that satisfies the
        specification's C3 (T(w) non-increasing in w, and equal to T_full for
        w >= M) and C4 (at w = M, vOW time equals T_full exactly), together
        with the crossover budget log2 w* at which log2 T(w) meets the
        Delfs-Galbraith baseline log2 T_DG = log2 p / 2 under the overhead
        multiplier 2^{c*sqrt(log2 p)}.
      parameters: >-
        The frozen grid as declared in specification.yaml: field sizes log2 p
        in {256, 384, 512, 576, 768}; memory budgets log2 w in
        {30, 40, 50, 60, 70, 80}; overhead c in {0.0, 0.5, 1.0, 2.0}; log2
        T_full and log2 M taken from whichever anchor the re-deriver names,
        with the anchor named in every result.
      blind_from:
      - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/tasks/TASK-20260904-1f4e2f/reconcile.py
      - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/tasks/TASK-20260904-1f4e2f/law_equivalence.md
      - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/tasks/TASK-20260904-1f4e2f/controls_report.md
      - coordination/goals/GOAL-SSI-001/batches/BATCH-eb0a7e/tasks/TASK-20260824-dd5b5c/corrected_charging.py
      - coordination/goals/GOAL-SSI-001/batches/BATCH-eb0a7e/reviews/TASK-20260824-5b150a/validation_report.md
      assigned_to: TASK-20260904-22e444
    procedure_deviations: []
