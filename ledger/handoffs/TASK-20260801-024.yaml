handoff:
  id: TASK-20260801-024
  from: coordinator
  to: coordinator
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-023
  objective: >-
    Commit the exact TASK-20260801-023 reading rule alone, with this receipt, so that
    RR-EQD-1 and its attainability argument ATTAIN-RR-EQD-1 are HASH-BOUND BEFORE the
    independent reviewer reads them and BEFORE any real datum exists. A reading rule that
    could still be edited after review is not pre-registered, and an attainability argument
    that could be written after seeing which branch fired is worthless.
  uncertainty_reduced: >-
    Whether the numeric decision rule provably predates the real arm it will classify.
  inputs:
  - TASK-20260801-023 artifacts
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/archives/TASK-20260801-022/snapshot_commit_receipt.json
  constraints:
  - RUN ALONE. Stage exactly declared_commit_sets.TASK-20260801-024_snapshot - two paths.
  - >-
    The committed tree must contain NO OBJ-REAL sample, no deterministic factor-base x-list
    and no real-arm run artifact of any kind. The reviewer at TASK-20260801-025 is charged
    with verifying that against Git rather than taking this constraint's word for it.
  - >-
    THE RECEIPT MUST RECORD CALIBRATION_VALIDATION_REPORT_SHA256 AND
    CALIBRATION_VALIDATION_VERDICT AS NAMED FIELDS, quoting the sha256 of
    coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/reviews/TASK-20260801-032/calibration_validation_report.yaml
    and its ADMISSIBLE or INADMISSIBLE verdict. DO NOT STAGE THAT FILE - it is owned by
    TASK-20260801-032 and archived by the ledger commit at TASK-20260801-031, because
    research_dispatch.py requires the archive of an independent review to be a ledger
    archive. Recording its hash here binds WHEN it existed and WHAT it said, so that the
    reading rule frozen in this same commit cannot later be defended against a report that
    changed afterwards.
  - >-
    If TASK-20260801-023 recorded a CAL-STOP-1 non-execution instead of a reading rule, this
    task archives that record instead, states NON-EXECUTION explicitly, and the batch does
    not proceed to the real arm.
  - >-
    Do not stage experiments/EXP-EQD-001/specification.yaml, the driver, the calibration
    package, ledger/goals/GOAL-ECDLP-001.yaml, ledger/hypotheses/H-EQD-001.yaml,
    dispatch_queue.json, any EXP-DS-001 or EXP-SMTH-001 artifact, FAEST or XEDN.
  - >-
    Commit message must contain TASK-20260801-024, TASK-20260801-023, EXP-EQD-001,
    RR-EQD-1, ATTAIN-RR-EQD-1, GOAL-ECDLP-001, BATCH-023.
  - Do not push from this task.
  - >-
    State no interpretation in the receipt, and DO NOT RECORD ANY APPROVAL. This snapshot
    hash-binds a rule; it authorizes nothing. TASK-20260801-026 is the approval gate.
  deliverables:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/archives/TASK-20260801-024/snapshot_commit_receipt.json
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/archives/TASK-20260801-024/snapshot_commit_receipt.json
  archived_by: TASK-20260801-024
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 900
    memory_gb: 1
    maximum_runs: 1
  completion_gate:
  - >-
    Post-commit verifier accepts exact declared paths, parent and hashes; the receipt
    records that the committed tree contains no real-arm artifact; no approval recorded.
