  constraints:
  - ZERO EXPERIMENT RUNS. Author a static planning document. Execute no experiment, no control, no instrument, no validator-as-experiment, and no runner. Materialize no plant bank, no null bank, no curve, and no target. Invoke no experiment command runner.
  - BEGIN FROM resource_incomplete AND LEAVE IT THERE. You may PROPOSE estimates, budgets, and stopping rules. You may NOT clear, lift, relax, re-dispose, widen, or declare satisfied the fail-closed resource_incomplete disposition, and you may take no compression, deduplication, hash-only-substitution, omitted-cell, or budget-widening credit.
  - 'THIS PACKAGE AUTHORIZES NOTHING. State that in the document, in these terms: it does not authorize implementation, Phase B, any control or experiment, target or curve access, JINV or transport work, N18, science, status change, ECDLP, closure, breakthrough, publication, network write, or execution.'
  - 'The planning-gate document must specify all six of the next_action''s required contents and label them as such: estimates, budgets, stopping rules, controls, artifacts, and a fresh authorization boundary.'
  - ESTIMATES must cover, at minimum, the three estimates the frozen v3 resource block records as MISSING (CPU, wall clock, peak memory) and the five gates it records as FAILED (retained-byte, individual-artifact, shard, logical-I/O, disk). Each estimate states its method, its inputs, its units, and its uncertainty. An estimate you cannot derive is DISCLOSED as underived with the reason; it is never invented, interpolated, or back-filled from a desired conclusion.
  - 'BUDGETS must be concrete and non-null: wall clock, memory, disk, and a maximum-runs bound, each with the assumption it rests on. A null budget field is a defect; reject your own plan if one is null.'
  - STOPPING RULES must be declared IN ADVANCE and be refusable. State what observation stops the work, at what threshold, and what the stop means. A stop on budget is a BUDGET EVENT and is never a pass and never a negative mathematical result.
  - CONTROLS must be named before any belief. For every quantity the plan would eventually have measured, name the matched null object of the same shape that must be measured with the identical instrument, and name the parameter whose increase must destroy the signal. An unmeasured control is not a passed control.
  - ARTIFACTS must be named as exact repository-relative paths with the record type each would carry, so that a later archive can bind them without invention.
  - The FRESH AUTHORIZATION BOUNDARY must state exactly what a later, separately authorized decision would have to grant, what it would still not grant, and what evidence it would have to see first. It is a description of a boundary, not a grant of one.
  - PRESERVE ALL EIGHTEEN OBLIGATIONS. Reproduce each obligation's wording verbatim in preservation-manifest.yaml, and for each record the exact committed artifact and field it binds to, whether you independently reverified it, and the result. An obligation you cannot bind is an OPEN BINDING DEFECT, disclosed with its reason. Never drop, summarize away, estimate, repair in prose, or silently resolve one.
  - INDEPENDENTLY RECOMPUTE the hashes and sizes in frozen_preservation_contract rather than copying them. They were READ from committed records by a session with no hashing tool. A mismatch is a MATERIAL finding you report; it is never quietly corrected and never assumed to be a typo.
  - EDIT NO v6 OR EARLIER BYTE. The approved amendment-v6/protocol-v7 package is read-only input. Do not edit, rename, remap, normalize, regenerate, or supersede it.
  - 'Write nothing outside the declared write_scope. ledger/goals/GOAL-ENDO-001/goal.yaml is NOT in your write scope and must not be edited. Never commit: the dispatching session stages and commits the declared paths after you return.'
  - Record requested policy alongside the model that actually answered, in runtime-session-receipt.json. If this session cannot honour the requested policy, REFUSE rather than downgrade. No fallback, no degradation, and no Bedrock provider, backend, endpoint, runtime, model, probe, or request.
  - claim_tier stays toy and sota_delta stays zero. The one-N N=19507 ceiling stays. Nothing you write is an attack, an exponent, a speedup, or evidence for or against any hypothesis, in either direction, at any scale.
  - budget.maximum_runs=1 IS ONLY THE dispatch_queue.v1 MINIMUM POSITIVE SCHEMA BOUND AND IS NOT A RUN AUTHORIZATION. This task executes ZERO experiment runs.
