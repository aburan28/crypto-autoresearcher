# path).
# =============================================================================
handoff:
  id: TASK-20260926-41c7e7
  from: coordinator
  to: executor
  recorded_at: '2026-09-26'
  question_id: RQ-WESO-8aff57
  hypothesis_id: H-WESO-516558
  experiment_id: EXP-WESO-9e2d6d
  heuristic_under_test: HEUR-WESO-516558-1
  source_idea: IDEA-20260926-4a496f
  opened_by_decision: DEC-20260926-ec2847
  goal_context: [GOAL-P13-001, GOAL-SSIQ-001, GOAL-SSI-001]
  kind: implement_and_run
  run_invocation: /run EXP-WESO-9e2d6d under TASK-20260926-41c7e7

  bound_protocol:
    specification: experiments/EXP-WESO-9e2d6d/specification.yaml
    specification_version: 1
    approval_decision: DEC-20260926-ec2847
    hash_binding_note: >-
      The snapshot archive TASK-20260926-b8e6be records the sha256 of the
      specification. Before writing any file, the Executor computes the
      specification's sha256 and compares it with that receipt value; on a
      mismatch it refuses and reports.

  objective: >-
    Implement EXP-WESO-9e2d6d exactly as frozen and execute its four stages in
    order, each as its own run: STAGE-A (RUN-WESO-aa2237) exact WISDE ground
    truth and the I-1 interface identity; STAGE-B (RUN-WESO-f37773) sampler
    mixing, positive controls, start-order control and the walk-length rule
    k_C(p) = ceil(3 * c_hat * log2 p); STAGE-C (RUN-WESO-e65afd) 10^5 samples
    at each of the three frozen-rule primes of 64, 96 and 128 bits with
    NULL-1, NULL-2, KS-1, START-2, PC-3, SEED-1, SEED-2; STAGE-D
    (RUN-WESO-0b4b33) FG-D pilot, then 10^5 samples at p = 5*2^248 - 1 if
    FG-D passes. Apply each gate mechanically as the specification words it;
    on a gate failure STOP at that stage and return. Report observations and
    the mechanically evaluated gate and criterion inputs; draw no
    interpretation beyond them.

  uncertainty_reduced: >-
    Whether the obvious walk sampler reaches the curve-level law at a walk
    length linear in log p (a question the source's Section 4.2 leaves
    unanswered), and, if so, whether delta(E) is B-smooth at least as often as
    the source's rho(u) and a size-matched uniform-integer null at 64-128 bits
    (and NIST-I if feasible). No Heuristic-1 measurement has completed in this
    program; EXP-P13-NC36 stopped at an infrastructure gate.

  inputs:
    - experiments/EXP-WESO-9e2d6d/specification.yaml (FROZEN; the authority for every procedure, threshold, seed and criterion)
    - ledger/hypotheses/H-WESO-516558.yaml
    - ledger/decisions/DEC-20260926-ec2847.yaml (approval; conditions AC-1..AC-8)
    - ledger/proposals/IDEA-20260926-4a496f.yaml
    - inputs/P13-WESOLOWSKI-2026/paper_fulltext.md lines 65-83 and 242-254 (read-only)
    - experiments/EXP-SSIQ-4de240/runs/RUN-SSIQ-4de240-a/source_access_log.yaml (read-only; the WISDE fetch route)
    - experiments/EXP-SSIQ-4de240/runs/RUN-SSIQ-4de240-a/raw-result.json "source_files" (read-only; committed per-file sha256 values, also copied into the specification)
    - experiments/EXP-SSIQ-4de240/implementation/fit_delta_counting.py (read-only; WISDE parsing and normalisation reference; may be copied with provenance, never edited)
    - AGENTS.md; docs/claims-and-verification.md; docs/research-budget-policy.md; agents/executor.md

  constraints:
    - id: EX-1
      text: >-
        FROZEN PROTOCOL. Implement the specification as written. No threshold,
        grid, seed, sample count, prediction, admissibility rule or criterion
        may be changed. A needed change is returned to the Coordinator as a
        proposed protocol_amendment; the Executor never writes under
        amendments/.
    - id: EX-2
      text: >-
        DECLARED DEPENDENCY. PARI/GP 2.15.4 at /usr/bin/gp (installed in this
        session via apt `pari-gp`; not provisioned by the repository). Record
        `gp --version-short` and the binary's sha256 in every manifest. If gp
        is absent or not 2.15.x, STOP (SR-7): infrastructure, never evidence.
        Do not install, upgrade or substitute any other CAS. No Sage, Magma or
        fpylll.
    - id: EX-3
      text: >-
        WISDE ROUTE (spec inputs.wisde_dataset.route_decision). Fetch exactly
        the four declared files from raw.githubusercontent.com through the
        agent proxy; never disable TLS verification, never unset HTTPS_PROXY;
        record URL, status, UTC time, bytes and sha256 BEFORE parsing. Apply
        FB-A per prime only on the declared trigger (5 failed attempts or a
        hash mismatch), and state its independence cost. Do not commit the
        fetched bytes.
    - id: EX-4
      text: >-
        ORDER AND GATES. Stages run strictly in the order A, B, C, D, one at a
        time. Each stage's run package is complete (all per_run files) before
        the next starts. Gate failures stop as SR-1..SR-9 say. FG-D INFEASIBLE
        checkpoints Stage D and is an infrastructure outcome, never evidence.
    - id: EX-5
      text: >-
        BLINDNESS AND FIXED N. Before Stage C samples, record the sha256 of
        every implementation file in the Stage-B manifest (analysis_freeze).
        No smoothness statistic at a prime is computed or printed before that
        prime's sampling completes. No early stopping on observed values.
    - id: EX-6
      text: >-
        MACHINE PROTECTION (binding; not research caps). At most 4 concurrent
        worker processes and only after DET-1 passes (else 1). Total resident
        memory <= 8 GB; each gp process parisizemax <= 1 GB. Per-stage
        watchdogs as the specification lists (A 3600 s, B 43200 s, C 259200 s,
        D 259200 s); expiry checkpoints the stage (status failed with an
        infrastructure reason; completed samples preserved and NOT analysed as
        a smaller N). Per-factorisation watchdog 600 s (FG-D and Stage D).
    - id: EX-7
      text: >-
        RUN IDS. Use exactly RUN-WESO-aa2237 (A), RUN-WESO-f37773 (B),
        RUN-WESO-e65afd (C), RUN-WESO-0b4b33 (D). Mint no other id. A stage
        that does not run (gate stop) gets no run directory, and the
        execution report of the last run says why.
    - id: EX-8
      text: >-
        WRITE SCOPE. Write only under experiments/EXP-WESO-9e2d6d/, and there
        only: implementation/, implementation.md, and runs/<the four run ids>/.
        specification.yaml, amendments/ and the .gitkeep files are READ-ONLY.
        Nothing under ledger/, coordination/, knowledge/ or any other
        experiment. Transient scratch files outside the repository (the WISDE
        cache, large intermediates) are allowed and listed in implementation.md.
        Commit nothing: the Coordinator archives by exact path.
    - id: EX-9
      text: >-
        HONESTY. Never estimate, repair or fill a missing value. A failed
        control, anomaly or unexpected observation is recorded in the
        execution report and preserved, never dropped (AGENTS.md core rules 8
        and 9). Timeouts, crashes and implementation failures are
        infrastructure outcomes, never mathematical evidence (core rule 5).
    - id: EX-10
      text: >-
        EXACT COMMANDS. Every program is a file under implementation/ run by
        its path; every command's exact argv is in command.txt. No inline
        programs. Python runs with -B or PYTHONDONTWRITEBYTECODE=1 so no
        bytecode lands in the repository.
    - id: EX-11
      text: >-
        INFERENCE AND PROHIBITIONS. Record requested_policy
        executor-implementation, the resolved binding as the session provides
        it (null if not exposed; never invented) and fallback_used in each
        manifest. Amazon Bedrock is prohibited. No security statement.

  deliverables:
