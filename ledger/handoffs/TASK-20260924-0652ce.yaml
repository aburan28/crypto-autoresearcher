    - id: PC-2
      text: >-
        INTEGRITY FIRST (draft PR-5). Before any reading:
        (a) the seedresolve draft equals the addendum_sha256 in
            TASK-20260923-df9fab's receipt;
        (b) the superseded draft hashes to
