    - id: PC-3
      text: >-
        PR-1, EXACTLY AS THE DRAFT DEFINES IT.
        (a) For each of the 72 archived .ms inputs, call
            write_msolve_input(tmp, names, p, eqs) on
            (names, p, eqs) = _parse_ms_file(f) and compare tmp with f byte
            for byte. The 72 inputs are:
            - the 36 toy inputs of the world-B toy G1 package in the bundle,
              including the event input fx_reg0_torsion_S3_norm.ms;
            - the 36 RUN-GFPN-ac4487 solver/*.ms.
            An adapter between the parser's and the writer's representation is
            allowed only if it changes no coefficient or exponent. Its code is
            in pc_check.py and quoted in premise-check.md. Report every
            mismatch with the first differing byte offset.
        (b) Code reading, with file and line, confirming or refuting that:
            - v2_driver.solve writes the .ms from the same (names, p, eqs) it
              substitutes into (v2_driver.py lines 162 and 196);
            - write_msolve_input drops only identically-zero equations and
              writes coefficients as given (v2_arms.py lines 691-710);
            - v2_solver.substitute reduces modulo p (v2_solver.py lines
              473-485).
            Say whether any system constructor can place a coefficient outside
            [0, p) in eqs, and whether that matters given the substitution.
    - id: PC-4
      text: >-
        PR-2, EXACTLY AS THE DRAFT DEFINES IT. Build the set O as the draft
        defines it (output_set_O). For each output in O, take the log of a
        solve that produced exactly those bytes, from the bundle,
        distinct-outputs.tar.gz or RUN-GFPN-ac4487/solver/. Then classify it
        exactly as v2_driver.solve lines 170-197 do:
        1. log text = .ms.log + "\n" + .ms.err + "\n";
        2. parse_msolve_log;
        3. parse_msolve_param;
        4. rational_solutions(payload, p, nvars);
        5. n_sub_fail = the number of parsed solutions s with not
           substitute(eqs, s, p), where eqs comes from _parse_ms_file of that
           output's input;
        6. classify_solve.
        Then apply the SF-1 signature, clauses (i)-(v), and record which clause
        fires. For each output, report:
        - the input key, the output sha256 and which solve's log was used;
        - outcome, reason, n_sub_fail, D as the driver would record it, parse
          kind, eliminating degree and square-free flag, the number of rational
          solutions and the solution-set sha256;
        - the SSF clause, or none;
        - whether its SE-4 (d) parsed comparison equals its input's modal
          output.
        Then state readings PR-2 (a)-(e) as the draft words them, each with its
        instances. For PR-2 (d), compare with the D that
        RUN-GFPN-ac4487/raw-result.json records for the same tag.
    - id: PC-5
      text: >-
        PR-3 and PR-4, EXACTLY AS THE DRAFT DEFINES THEM. Confirm the PR-3 code
        facts (i)-(v), each with file and line, or name the discrepancy. List,
        for PR-4, every output in O without an available log.
    - id: PC-6
      text: >-
        OBSERVATIONS ONLY. No D, degree or quotient dimension is reported as a
