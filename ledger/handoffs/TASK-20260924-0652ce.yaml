# - confirms the code facts SF-1 is written against (PR-3), and log
#   availability (PR-4).
# It computes the draft's pre-declared readings PR-1..PR-5, reports them, and
# decides nothing.
# Ordered by DEC-20260923-d670c6. Written by the Coordinator under
# TASK-20260923-ad3016. Dispatched later by /run; this card launches nothing.
# Its one archival task is TASK-20260924-3ee9a8.
# =============================================================================
