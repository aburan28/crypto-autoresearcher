        control by construction. Offer no whole-claim verdict and no reading
        of H-PFDR-4765e4 or H-PFDR-0cc7e8. Do not call any outcome a lever, a
        closure, support or refutation. The Coordinator composes the round.
    - id: RV-6
      text: >-
        AN INSTRUMENT OR PACKAGE DEFECT IS NOT A MATHEMATICAL RESULT. If J1,
        J2 or J4 breaks, say that it is a statement about the run set, never
        evidence for or against any hypothesis. A timeout, crash or memory
        stop in your own computation is reported as blocked, never as a
        finding about the claim.
    - id: RV-7
      text: >-
        ZERO RUNS, WITH ONE BOUNDED RECOMPUTATION. No run of the experiment,
        and no RUN id. Permitted computations are reading and hashing
        committed files, your re-derivation, your calibration simulations,
        ONE re-execution each of analyze_census.py (R15 and the R16 --stage-r
