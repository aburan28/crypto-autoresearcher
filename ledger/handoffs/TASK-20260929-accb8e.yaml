        the two census-job re-executions that J4 scopes. Nothing else imports
        a solver module; load stats.py by file path. Every command is declared
        with its seed.
    - id: RV-8
      text: >-
        MACHINE PROTECTION. One computation process at a time, nice 19,
        OMP_NUM_THREADS, OPENBLAS_NUM_THREADS and MKL_NUM_THREADS set to 1,
        resident memory under 1 GB (poll VmRSS and stop any child that crosses
        1.0e9 bytes; the stop is blocked, not a finding). Launch only if the
        launch facts show at least 3 GB MemAvailable. Stream the large
        harvest-rows files; never load one whole. Never read, signal or touch
        another session's processes or files.
    - id: RV-9
      text: >-
        LARGE OUTPUTS. Files over 50 MB (re-executed job rows, harvest rows)
        go to your own scratch directory, scratchpad/rv-accb8e/, and are
        recorded in your report by path and sha256 only. Everything the
        report rests on that is under 50 MB goes under your write scope.
    - id: RV-10
      text: >-
        CITE WITH PROVENANCE. A file you opened is internal. A source you
        recall but did not open is recalled, a pointer, never support. Query
        the knowledge index (search_knowledge) before calling a statistical
        fact known, and record whether the index answered.
    - id: RV-11
      text: >-
        DISCLOSED PRIOR. The Coordinator's prior below was written after it
        had read the structural parts of the producer's report, which
        disclose that R15 returned O-EXCURSION with four excursion cells and
        that every gate and positive control is reported passing.
        Concurrence with it is weaker evidence than it looks. Attack the
        joints on their merits.
