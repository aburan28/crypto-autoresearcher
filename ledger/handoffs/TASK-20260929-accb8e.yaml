        Q7, PC-1 and PC-2 as A5 defines them, with G6's rank check.
        Q8, the TW-FLOOR predicate: fired iff any census or on instance has
        S_3 / ((1/2) * sqrt(r * N)) < 0.9 (A7), or EXP-PFDR-7c8bf2 returned
        OUT-FLOOR-VIOLATION. Report only the boolean, the count and the keys
