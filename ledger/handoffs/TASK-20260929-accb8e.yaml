    proves_too_much:
      objects:
        - >-
          PTM-1, random arms read as structured. On the committed census rows,
          take each random arm in turn as the "structured" arm A against the
          other random arms of its size class. Use the other two of its own
          triple, with C_R the mean of two and SD_null = sqrt(V * 3/2), or,
          where |F| matches on that curve, three randoms of the other family.
          Choose between the two before computing. Run A1 and the excursion
          rule over the same family of cells, and the Stage R rule on R16's
          random arms. Random bases have kappa = 1 by definition, so any
          "excursion" here is known false.
        - >-
          PTM-2, synthetic null counts. Counts drawn per cell from the J6(a)
          null generator (kappa = 1 by construction), passed through A1, the
          excursion rule, a selection of the four most extreme cells, and
          Stage R on fresh synthetic curves.
        - >-
          PTM-3, planted excess (for the closure branch). The structured
          arm's counts are raised to a known kappa_true in {1.1, 1.25, 1.5,
          2.0} by Poisson augmentation at 30 and 32 bits, and at the rung of
          each excursion cell, with the random arms unchanged. The reading
          "inside the band" or "O-NULL" is known false on these objects.
      failure_signature: >-
        On PTM-1 and PTM-2, the procedure must produce |z| > 3 at about the
        nominal per-cell rate and replicate at Stage R at about the nominal
        one-sided rate. If it excurses materially more often, or at least as
        often as on the structured arms, the observed excursions are not by
        themselves evidence of structure. On PTM-3 the procedure must leave
        the band; if it returns O-NULL with probability above 0.5 at
        kappa_true = X, then any closure statement is limited to excesses
        below X, per (class, m). Report X.
      assigned_to: TASK-20260929-f29c96
    blind_rederivation:
      required: true
      quantity: >-
        Q1, the M-5 canonical row sets of R11, R12, R14 and R16 (J2a).
        Q2, A1 per (m, rung, class in {TT, TB, SS}, structured arm in
        {subgroup, small_x, dickson}), census mode: C_A, C_R, kappa, V,
        SD_null, z, the resolved flag, raw kappa, and the curves used and
        dropped with their reason (failed/failed_infrastructure, invalid,
        censored at A_fix, unmatched_size).
        Q3, the excursion list (every resolved cell with class in {TT, SS} and
        |z| > 3, with the sign of z). Also the O-ALIVE conditions: resolved
        z > 3 at 30 and 32 bits; A2's slope per (arm, class in {TT, SS}, m)
        over the resolved 20..32 rungs, with y_b, x_b and the frozen
        curve-index bootstrap (random.Random(0), 2000 replicates, the same
        indices for A and its three randoms); the one-sided p and Holm over
        the fixed 18-test family; A3's median rho_c. Then R15's outcome id.
        Q4, Stage R: per excursion cell, A1 on curves 5..9, the sign and |z|,
        replicated or not, and the final structural reading.
        Q5, harvest gain against the mitm baseline. Census mode is the
        baseline, its solver columns gated identical to harvest off (G2).
        Per instance with both modes solved and verified, ratio =
        s3_solves(census) / s3_solves(on). Median per (m in {3, 5}, base in
        {subgroup, dickson, small_x, random_sub, random_dick}, rung 24..32)
        and (1a). Exponents by stats.fit_exponent over 12..32, census and on,
        per (m, base), delta, its paired-bootstrap interval, and (1b). The
        m = 4 small_x harvest-on exponent with its 95% interval and (2) met,
