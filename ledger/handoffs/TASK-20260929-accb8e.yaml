    multiplicity_and_calibration_controls:
      source: >-
        The controls the EXP-PFDR-7c8bf2 red team showed were missing there
        (DEC-20260929-1b779a findings M1, G-1 and J4, controls C1-C5; that
        record is not yet archived, PRR-4), restated and applied here.
      controls:
        - id: MC-1
          text: Every decision-bearing bootstrap endpoint (A2 interval above 0 and Holm p; A4 (1b) and (2)) is recomputed at 20000 replicates, or seed-averaged, and its Monte Carlo s.d. is reported against its margin to the threshold.
          owner: TASK-20260929-f29c96 (J6); the validator's J3 reports the Monte Carlo error of its own recomputation
        - id: MC-2
          text: Seed sweep over at least 200 bootstrap seeds per decision element, with the flip fraction. A6 under an alternative PIT seed family.
          owner: TASK-20260929-f29c96 (J6)
        - id: MC-3
          text: Row-order and curve-order sensitivity. z, Stage R and the A4 medians must be order-invariant; any change is a finding. Bootstrap-based elements report flip fractions.
          owner: TASK-20260929-f29c96 (J6)
        - id: MC-4
          text: Family-wise calibration by simulation of the excursion rule over the full resolved family, of Stage R over the four cells (null and power), of the Holm-controlled A2 family under the design's actual p-value distribution, and of the A6 KS family.
          owner: TASK-20260929-f29c96 (J6, PTM-1, PTM-2)
        - id: MC-5
          text: Small-sample interval calibration at five curves per rung on synthetic designs.
          owner: TASK-20260929-accb8e (J5)
        - id: MC-6
          text: Design-evaluated comparators in place of asymptotic ones -- A2's null slope, the m = 4 exponent model and threshold, and baseline consistency with the committed sweeps.
          owner: TASK-20260929-f29c96 (J6)
        - id: MC-7
          text: Every convention the text leaves open is stated in writing before computing (the validator's sealed readings) and attacked by its alternative (J7).
          owner: TASK-20260929-accb8e (J3) and TASK-20260929-f29c96 (J7), on different questions
    tripwire_routing:
      TW-FLOOR: >-
        Reported only as fired or not fired. No reviewer reads, quotes,
        computes into a file or interprets any A7 value (RV-4; the red team's
        RT-4). The validator's J3 reports the predicate's boolean and firing
        keys, and J3 compares them with the producer's flag and keys. If
        either says fired: every floor-relative reading (A7, and any reading
        against the EXP-PFDR-7c8bf2 floor fits, whose F-3 event
        EV-PFDR-cf6ee5 found non-discriminating) is withheld from this
        round's composition. The firing rows are routed, unread, to a
        separate review round at review-breakthrough (max) as "a claimed
        contradiction of a generic lower bound or an accounting error". That
        round has its own review_plan written before its reviewers run, and
        its ids are minted then. The rest of this round composes normally. If
        neither says fired, A7 stays a secondary descriptive metric, read with
        the EV-PFDR-cf6ee5 caveat above.
      TW-ALIVE: >-
        If R16 reports a replicated anomaly, or R15/R16 reports O-ALIVE, then
        this round's composition records validity (J1-J5) and the J6-J8 and
        proves-too-much findings as inputs only. There is no interpretation,
        no status change and no synthesis statement. Before any reading, an
        independent replication on fresh curve seeds (beyond 0..9) is
        designed as a separate act. Stage R was run by the producer's own
        session and engine, so it is not that replication.
      TW-SCOPE: >-
        Binding on both reports. No deployed-curve implication, universal
        impossibility, or exponent below rho's.
    procedure_deviations:
      - id: PD-1
        text: >-
          The Coordinator's prior was written after it read the structural
          parts of the producer's report (coordinator_prior.exposure_disclosure),
          which disclose O-EXCURSION, four excursion cells and gate and
          positive-control passes. Recorded so that concurrence is weighed
          accordingly.
      - id: PD-2
        text: >-
          The blind re-deriver (this task) also owns J1, J2b and J4, whose
          attacks require reading blind_from paths after the seal. This is a
          declared property of the plan (RV-2), not a leak. The independence
          checker is order-blind (PRR-3), so its expected output is exactly
          one problem: the line reporting that re-deriver
          TASK-20260929-accb8e read blind_from paths. Any other problem is a
          finding for composition. Custody: TASK-20260929-d9bf1b checks that
          rederivation/sealed-section.yaml still hashes to the digest logged
          at seal time.
      - id: PD-3
        text: >-
          The re-derivation is blind to the producer's values and
          implementation, not to labels. R16's job layout, an input the
          re-deriver must read for Q1, discloses which cells excursed, and
          this card discloses that R15 returned O-EXCURSION with four cells.
          No value is disclosed.
      - id: PD-4
        text: >-
          A bounded recomputation (two census-job re-executions, J4(c)) is
          scoped in a round that otherwise runs no solver. The jobs are chosen
          by rule before anything is read, carry no RUN id, are never
          evidence about any base, and a memory or time stop is blocked, not
          a finding.
    composition: >-
      The Coordinator composes J1-J8 and the proves-too-much control itself,
      joint by joint, after TASK-20260929-d9bf1b verifies. Before treating
      the round as complete, it reads the archived output of `python3
      tools/check_review_independence.py --plan
      ledger/handoffs/TASK-20260929-accb8e.yaml --reports
      coordination/review/pfdr-1b78f7-20260929/reviews/TASK-20260929-accb8e/attestation.yaml
      coordination/review/pfdr-1b78f7-20260929/reviews/TASK-20260929-f29c96/attestation.yaml`
      and records every departure from this plan. It compares the result
      with the prior above, applies the tripwire routing, and reads the
      Stage 0 P7(c) dispersion observation (EV-PFDR-cf6ee5 OBS-11) beside
      A6's clean fixed-budget HEUR-4765e4-H1 test, never in place of it.
      Ceilings fixed now: toy scale and one engine; the hypothesis carries
      an asymptotic claim and can reach analyzed on this experiment, never
      supported (four promotion gates). A single-run, empirical-only census
      supports no reject_scoped. Any closure reading carries PTM-3's
      detectable-excess scope and an obstruction block. A KN-TECH entry on
      bootstrap undercoverage is considered only if J5 independently
      confirms it.
