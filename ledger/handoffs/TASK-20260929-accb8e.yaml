  review_plan:
    round: claim-changing review of EXP-PFDR-1b78f7 under protocol v3 (whole run set, R01-R16)
    reviewers: [TASK-20260929-accb8e (validator-breakthrough), TASK-20260929-f29c96 (red-team-breakthrough)]
    claim_under_review: >-
      As the producer's outputs state it (execution-report-amd430f44.yaml,
      runs/RUN-PFDR-1b78f7-analysis/analysis.json and
      runs/RUN-PFDR-1b78f7-stage-r/analysis.json, read with
      execution-report.yaml and execution-report-amd1de84f.yaml): the
      EXP-PFDR-1b78f7 run set under protocol v3 is complete and
      completed_valid. It comprises R01 and R01a, R02-R09, R10, R11 (attempt 1
      plus attempt 2, merged to merged/), R12-R14, R15 and R16; R17 and
      R02a-R09a were not triggered. G1-G7 pass and PC-1 and PC-2 pass. R15
      returned O-EXCURSION, and Stage R (R16) re-ran its excursion cells on
      curves 5..9. The final structural reading is whichever of O-NULL with
      the excursion list attached, a REPLICATED ANOMALY (TW-ALIVE) or O-ALIVE
      R16's analysis states. The O-GENERIC readings -- predictions (1a), (1b)
      and (2), HEUR-4765e4-H1 per A6 and HEUR-4765e4-H3 per A3 -- are as R15
      states. TW-FLOOR fired or did not fire as R15 states. Scope as frozen:
      toy scale (12..32 bits main panel, 12..24 bits known_log and j0),
      generated prime-order curves, one mitm engine, m = 3, 4, 5, five curves
      per rung, and five fresh curves per excursion cell at Stage R. This
      Coordinator has not read the outcome_ids block, either analysis.json,
      any Stage R z, any A1-A9 value or the TW-FLOOR state. The claim is
      written in the form those outputs take, with their values unread.
    coordinator_prior:
      exposure_disclosure: >-
        Written before any reviewer runs, after reading:
        specification.yaml (in full); AMD-20260929-1de84f and
        AMD-20260929-430f44 (in full); H-PFDR-4765e4 (in full) and
        H-PFDR-0cc7e8 (status and statement); DEC-20260929-523aab,
        DEC-20260929-bb40ce and DEC-20260929-1b779a (in full) and
        DEC-20260928-ab2d31 NA-4 to NA-6; the cards TASK-20260929-c40e48,
        -69b7c5, -89c123, -0f66ef and -16c25d; and the structural parts of
        execution-report-amd430f44.yaml -- status, BI-1, harness pins, IE-1,
        the resume set, the runs block (including R16's list of four cells),
        the gates block (G1-G7, PC-1 and PC-2 booleans and the per-run G4-G7
        counts), the failed_infrastructure, placeholder and non-cell lines,
        main-panel prime coincidences, protocol_deviations (DEV-A to DEV-D),
        validate_ledger and artifact_paths. NOT read: outcome_ids,
        excluded_instances, incomplete_cells, j0_cells, anomalies,
        unexpected_observations, executor_assessment, the implementation
        notes, any analysis.json, kappa-cells.jsonl, fits.json, raw-result.json,
        merge-report.json, view map or row file. What that exposure
        discloses: R15 returned O-EXCURSION with four cells, every gate and
        positive control is reported passing, and the certified-row counts
        per run.
      expectations: >-
        J1 holds, with minor defects: the census-m3/m4 certificate format
        (known, PRR-1), and DEV-B's lagging view-map entries confirmed as
        limited to stdout.log and checksums.sha256. C-1's exactness and C-2's
        certificate hold. P(break) about 0.1.
        J2 holds: the blind canonical sets equal merged/ and the R12, R14 and
        R16 roots record for record, and the view maps bind every file R15
        and R16 read. If it breaks, I expect it at R16's union U after DEV-A
        or at the rho-row sort key. P(break) about 0.1.
        J3 holds for the deterministic quantities -- kappa, z and resolution
        per cell, the excursion list, the Stage R z, the A4 medians, PC-1 and
        PC-2 -- and to Monte Carlo error for the bootstrap ones. If it breaks
        (about 0.25), I expect the disagreement to localise to a convention
        the text leaves open rather than to arithmetic: when an instance
        counts as censored at A_fix; whether attempt_limit rows count as
        failed in A1; A_fix counting for SS; V's floor; x_b = mean log2 N; the
        unseeded A4 paired bootstrap; r for harvest-on instances in A7. I
        hold no expectation about TW-FLOOR, whose state I have not read.
        J4 holds: byte-identical re-execution apart from path strings,
        identical merge re-execution, and both re-run jobs equal to the
        archive after M-3's exclusions. P(break) about 0.1, most likely at
        the pre-/post-DEV-A merge difference.
        J5 reproduces the Stage 0 finding independently: stats.bootstrap_slope
        undercovers at five curves per rung (coverage clearly below 0.95), and
        the A4 exponent intervals undercover similarly. Every "interval
        excludes" statement in A2 and A4 is then weaker than its nominal
        level.
        J6: the four excursions are compatible with the null at a
        non-negligible family-wise rate. The family has well over 100
        resolved (arm, class, m, rung) cells, and z rests on a ten-degree-of-
        freedom variance floored at C_R, ignoring the overdispersion that
        cluster coincidences give pair counts. I expect the null expected
        number of |z| > 3 cells to be about 1-4, and P(at least four | null)
        between 0.05 and 0.5. I expect none of the four to replicate at Stage
        R (about 0.75), and Stage R's power against a selection-corrected
        excess to be below 0.5, so a non-replication supports a scoped null
        of limited sensitivity, not kappa = 1. If a cell replicates, I expect
        J7 to explain part of it by a convention or by overdispersion, but I
        hold about 0.15 that a replicated excess survives J7. That would be
        TW-ALIVE, not a result. A2's slope criterion has a design-dependent
        null slope, so "interval above 0" is not a clean alternative test; I
        expect it not to be decision-bearing, because O-ALIVE also needs
        z > 3 at both 30 and 32 bits. The A4 readings are seed-robust except
        where an interval end lies within Monte Carlo error of its threshold.
        J7: the conventions are applied as written. The consequential one is
        that z assumes the structured arm has the random arms' dispersion. I
        expect small_x in particular to differ from it. The censoring and
        unmatched_size drops are few and arm-symmetric by construction.
        Formal duplicates on generic curves are exactly the zero-difference
        pairs. poisson_mean feeds A6 only.
        J8: DEV-A is the only deviation that touches an outcome-bearing path
        (R16's canonical set, raw-result and analysis step). It was made
        after R15 had named the excursion cells, as R16's design requires,
        and before any R16 row existed. I expect it to be mechanical and
        value-independent. DEV-B, DEV-C and DEV-D touch no outcome-bearing
        path.
        Proves-too-much: the random-as-structured family produces excursions
        at a rate comparable to the structured arms. Stage R's false-
        replication rate is near nominal. The minimum excess the band detects
        at 30-32 bits with probability 0.5 is of order kappa - 1 = 0.3 or
        more for TT, and smaller for SS, so any closure reading must be
        scoped to that detectable effect.
        Overall: the run set is valid and the census a correctly computed but
        weakly powered screen. I do not expect the round to support any
        closure stronger than the planted-excess sensitivity, or any
        structural excess.
