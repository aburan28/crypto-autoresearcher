handoff:
  id: "TASK-20260725-004"
  from: "coordinator"
  to: "coordinator"
  objective: >-
    Commit the independent BATCH-003 review, scoped evidence, Coordinator
    decision, and active-goal checkpoint as an isolated Coordinator ledger
    archive before any official state transition.
  uncertainty_reduced: >-
    Whether the protocol-design review is durable and eligible for an official
    Coordinator decision and goal checkpoint.
  inputs:
    - "the two exact TASK-20260725-003 review artifacts"
  constraints:
    - "Run alone; stage only the declared review, evidence, decision, and goal-record paths; preserve every unrelated dirty file."
    - "Validate review independence and snapshot binding before committing."
    - "Fill the decision's knowledge_promotion field: promote a KN-FIND only if warranted, otherwise record a concrete not_warranted reason."
    - "Keep the goal active unless a declared completion or pause condition is met; this is the final batch of a three-batch budget."
    - "Record commit_sha, parent_sha, and SHA-256 for every committed path in the receipt after the commit."
    - "Stop on any archive verification failure."
  deliverables:
    - "ledger_commit_receipt.json"
    - "EV-ECDLP-005.yaml"
    - "DEC-20260725-001.yaml"
    - "GOAL-ECDLP-001.yaml"
  artifact_paths:
    - "coordination/goals/GOAL-ECDLP-001/batches/BATCH-003/archives/TASK-20260725-004/ledger_commit_receipt.json"
    - "ledger/evidence/EV-ECDLP-005.yaml"
    - "ledger/decisions/DEC-20260725-001.yaml"
    - "ledger/goals/GOAL-ECDLP-001.yaml"
  archived_by: "TASK-20260725-004"
  inference:
    policy: "coordinator-ultra-code"
    fallback_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 300
    memory_gb: 1
    maximum_runs: 1
  completion_gate:
    - "Review integrity and exact claim boundaries pass."
    - "Evidence and decision records state whether the toy protocol is frozen and review-eligible or why the route remains incomplete."
    - "The goal retains exactly one next action and the post-commit verifier accepts the archive."
  return_format: "Coordinator ledger archive receipt JSON plus immutable YAML records."
