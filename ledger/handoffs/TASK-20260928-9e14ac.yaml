  constraints:
    - >-
      DERIVATION ONLY. Instantiate no curve, build no factor base, solve no
      polynomial system, load no Groebner engine. Every n is a parameter label in
      a cost formula. Standard library arithmetic only.
    - >-
      AMENDMENTS A1-A8 ARE BINDING PROTOCOL. In particular: C-FLOOR-REPRO gates on
      ordering, monotone decrease in m, and margin SIGNS -- never on offset
      magnitude (A1); the offset trend has a declared expected signature and a
      departure over 1.5 bits stops the run for Coordinator adjudication rather
      than proceeding (A1); C-BOUND-PROBE computes every argmin and every
      margin-condition solution at no fewer than two materially separated d-sweep
      bounds and reports per bound (A3); a figure that tracks its bound is
      reported as bound-tracking, never as a minimum or a crossover (A3).
    - >-
      SCORE EACH PREDICTION IN ITS DECLARED CLASS (A2). Report P1, P2, P3a and P4
      as implementation-fidelity checks and P5 as the sweep search. DO NOT report
      an aggregate "5 of 5 confirmed": four of them are consequences of the cost
      model and a headline count would manufacture evidential weight the run does
      not carry.
    - >-
      P3b IS WITHDRAWN AS A PREDICTION AND IS REQUIRED REPORTING (A2b). Report the
      minimum-store curve over m and the m at which it turns, and state in the
      results that P3b as authored is inconsistent with P4. Do not silently
      reconcile them and do not score P3b as confirmed.
    - >-
      LANGUAGE CEILING (A5). Never write that memory was "charged" into a cost. No
      store term enters any cost functional on either side; the oracle's store is
      budget-constrained and reported, the baseline's is reported. Use that
      formulation.
    - >-
      Report step 3's best integer-s cell and step 4's continuous minimum
      SEPARATELY per (degree, m), and state whether the step-4 minimum is realised
      by any step-3 cell (A6). An unrealised minimum is a model bound, never an
      attack parameter.
    - >-
      NO SECURITY STATEMENT ABOUT ANY CURVE IN EITHER DIRECTION. Every listed
      degree is prime and Weil descent / cover attacks are out of scope by
      construction; say nothing about them.
    - >-
      A timeout, crash, or memory stop is an infrastructure fact recorded as such
      and is NEVER negative mathematical evidence (AGENTS.md rule 3). Retain
      failed attempts.
    - >-
      Record the manifest fully: exact command, git commit and dirty-tree state,
      environment and dependency versions, parameters, requested_policy from this
      card beside the resolved model identifier and its probe-verified status, and
      whether any fallback was used. Never silently substitute a model.
    - >-
      WRITE SCOPE is experiments/EXP-SEMBIN-04ec3c/{code,runs,RESULTS.md} ONLY. Do
      not touch specification.yaml -- it is frozen by approval -- and do not touch
      any ledger record.
  deliverables:
