handoff:
  id: TASK-20260907-8a0b02
  from: coordinator
  to: validator
  objective: >-
    Independently validate the EXP-ECDLP-a98ea9 Stage 2c run package
    on joints artifact_binding, hard_gate_recompute, provenance_ast,
    and xbucket_not_sold_as_pass.
  uncertainty_reduced: >-
    Whether the S2c receipts are admissible under v3 and whether the
    Stage 2 hard gates hold on the committed artifacts.
  inputs:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-da8d1e/review_plan.yaml
    - experiments/EXP-ECDLP-a98ea9/specification.yaml
    - experiments/EXP-ECDLP-a98ea9/amendments/v3_xbucket_diagnostic.yaml
    - experiments/EXP-ECDLP-a98ea9/execution-report-stage2c.yaml
    - experiments/EXP-ECDLP-a98ea9/runs/RUN-ECDLP-a98ea9-S2c/
    - experiments/EXP-ECDLP-a98ea9/runs/RUN-ECDLP-a98ea9-S2/
    - experiments/EXP-ECDLP-a98ea9/runs/RUN-ECDLP-a98ea9-S2b/
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-a06448/archives/TASK-20260907-004783/snapshot-receipt.json
    - agents/validator.md
  constraints:
    - Own only the four assigned joints. Do not verdict the whole claim.
    - Do not read TASK-20260907-b736a3 artifacts.
    - Do not change hypothesis or experiment status.
    - Do not interpret ADV or D2.
    - Do not authorize Stage 3.
    - Certificate kind must remain none.
  deliverables:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-da8d1e/reviews/TASK-20260907-8a0b02/validation-report.yaml
  artifact_paths:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-da8d1e/reviews/TASK-20260907-8a0b02/validation-report.yaml
  archived_by: TASK-20260907-14e5d9
  inference:
    policy: review-adversarial
    requested_policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 1800
    memory_gb: 4
    maximum_runs: 1
    experiment_maximum_runs: 0
  completion_gate:
    - review_attestation present with joints_owned and verdict holds|breaks|inconclusive
    - Each assigned joint has a holds/breaks/inconclusive result
    - sources_read is complete
    - read_sibling_reports is false
  review_plan_ref: coordination/goals/GOAL-ECDLP-001/batches/BATCH-da8d1e/review_plan.yaml
  review_plan:
    opened_by: TASK-20260907-8a0b02
    batch_id: BATCH-da8d1e
    recorded_at: '2026-09-07'
    recorded_before_reviewers: true
    claim_under_review: >-
      Producer statement (execution-report-stage2c.yaml,
      RUN-ECDLP-a98ea9-S2c): validity valid under v3_xbucket_diagnostic;
      all Stage 2 hard gates passed; interval fixture n=23 s=3
      q_maj=284/529 and q_strict=0/1; known-answer T5 value_set {0,4},
      off_fibre_value_set {0}, off_fibre_at_cap_count=0; POSITIVE
      CONTROL B pass; planted ladder pass; static provenance pass;
      digit_ADV_computed false; certificate kind none; authorized
      stages [0,1,2]; x-bucket 3dp role diagnostic, hard_gate false,
      match_3dp_all false. No ADV claimed. S2 remains invalid; S2b
      remains the pre-amendment observation.
    coordinator_prior: >-
      Written before the reviewers of this round run, after the same
      session produced RUN-ECDLP-a98ea9-S2c. The Coordinator expects
      the validator joints to hold. PROCEDURE DEVIATION PD-S2R1: this
      prior is contaminated by the producer session.
    procedure_deviations:
      - id: PD-S2R1
        description: Coordinator session produced the run and the prior.
      - id: PD-S2R2
        description: Branch commit messages may contaminate blind history.
    joints:
      - joint: artifact_binding
        assigned_to: TASK-20260907-8a0b02
        attack_plan: >-
          Rehash TASK-20260907-004783 snapshot paths. Confirm S2 and
          S2b were not overwritten. Certificate none. No digit ADV.
        breaking_artifact: missing file, hash mismatch, overwrite, or certificate not none
      - joint: hard_gate_recompute
        assigned_to: TASK-20260907-8a0b02
        attack_plan: >-
          From raw-result.json alone verify interval 284/529, known-answer
          value set, POS-B, ladder, digit_ADV_computed false, x-bucket
          role diagnostic.
        breaking_artifact: any hard-gate field disagreement
      - joint: provenance_ast
        assigned_to: TASK-20260907-8a0b02
        attack_plan: Re-run static_provenance.py on kfree_transport.py.
        breaking_artifact: AST failure or forbidden scalar parameter
      - joint: xbucket_not_sold_as_pass
        assigned_to: TASK-20260907-8a0b02
        attack_plan: >-
          Confirm match_3dp_all false is not treated as a 3dp pass or
          as H/ADV evidence.
        breaking_artifact: 3dp mismatch sold as pass or as H/ADV support
    blindness:
      mutual: true
      lifted_for: []
      rationale: null
    proves_too_much:
      objects:
        - The section-(G) x-bucket 3dp smoke whose match_3dp_all is false.
      failure_signature: >-
        Citing the failed 3dp smoke as a pass, as nearby success, or
        as support for H or digit ADV.
      assigned_to: TASK-20260907-8a0b02
    blind_rederivation:
      required: true
      quantity: >-
        Interval-partition q_maj and q_strict at n=23, s=3 over all
        529 pairs. v(k)=min(floor(k*s/n), s-1);
        q_maj=(1/n^2) sum_{a,b} max_c N[a,b,c]; q_strict is the
        forced-sum-fiber fraction. Holds iff q_maj=284/529 and
        q_strict=0.
      parameters:
        n: 23
        s: 3
        pairs: 529
      blind_from:
        - experiments/EXP-ECDLP-a98ea9/implementation/
        - experiments/EXP-ECDLP-a98ea9/execution-report-stage2c.yaml
        - experiments/EXP-ECDLP-a98ea9/execution-report-stage2.yaml
        - experiments/EXP-ECDLP-a98ea9/runs/RUN-ECDLP-a98ea9-S2c/
        - experiments/EXP-ECDLP-a98ea9/runs/RUN-ECDLP-a98ea9-S2b/
        - experiments/EXP-ECDLP-a98ea9/runs/RUN-ECDLP-a98ea9-S2/
        - coordination/goals/GOAL-ECDLP-001/batches/BATCH-da8d1e/reviews/TASK-20260907-8a0b02/
      assigned_to: TASK-20260907-b736a3
