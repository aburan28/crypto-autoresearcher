  q1_the_open_mathematical_question_this_coordinator_could_not_settle_alone: >-
    Earlier in this SAME session (unrelated to this batch, tool at
    tools/isogeny_class_screen.py, not part of the committed harness), this
    Coordinator successfully constructed rational ell-isogenies on P-256 for
    ell values that did NOT divide #E(P-256) at all -- i.e. gcd(ell, N) = 1 in
    every one of those cases too -- via the Elkies kernel-polynomial method:
    the kernel is the eigenspace of Frobenius acting on E[ell], obtained as
    h = gcd(psi_ell, x^p * psi_lambda^2 - phi_lambda), and requires only that
    ell SPLIT or RAMIFY in the relevant order (Kronecker(D, ell) != -1), which
    is a DIFFERENT and WEAKER condition than "E has a rational POINT of order
    ell". The resulting isogeny is F_p-rational as a MAP even though no single
    point in its kernel is individually F_p-rational -- the kernel SUBGROUP is
    merely Galois-stable. harness/isogeny_class.py, the module this run used,
    implements ONLY velu_odd(E, kernel_gen, ell) and find_kernel_generator --
    both point-based, with no Frobenius-eigenspace/kernel-polynomial path.
    THE QUESTION: does this alternative method actually apply to THIS case?
    Two reasons it might NOT, which is exactly why this needs independent
    scrutiny rather than this Coordinator's own guess: (a) ell = 107 here is
    the class's own CONDUCTOR (D = -3*107^2, conductor arm f=107 per the
    design doc), so the isogeny in question is a VERTICAL/volcano isogeny
    (crater j=0 <-> floor), not a HORIZONTAL one (which is what the P-256
    precedent actually demonstrated -- ell coprime to the CONDUCTOR there, not
    merely coprime to N). Vertical isogeny kernels at a volcano's own
    conductor prime may have a different rationality criterion than horizontal
    ones; this Coordinator does not have settled confidence on which. (b) Even
    if a kernel POLYNOMIAL is Frobenius-rational, whether that alone suffices
    for this experiment's specific downstream needs (T1 transport machinery,
    T5 reachability walk, whatever E2/E3 actually require operationally) is a
    separate question from mere existence.
  q1_what_to_actually_do: >-
