  objective: >-
    PART A -- THE ZERO-DECODER-CALL LOW-k RECOMPUTE (pure arithmetic on
    already-committed JSON). (A1) Recompute the four FRESH cells alpha(5000,P),
    alpha(5000,N), alpha(8002,P), alpha(8002,N) and the three pre-registered
    contrasts at k=5, at k=10 and at every k in 2..26, from BATCH-91929e's
    committed cross_regime_arms_results.json, by the same method every cell in
    this family uses: alpha = -[log(SE_hi) - log(SE_lo)] / [log(T_hi) -
    log(T_lo)], regime P from window P1 [30000:35000) at T=5,000 to window P2
    [35000:45000) at T=10,000 and regime N from window N1 [45000:55000) at
    T=10,000 to window N2 [55000:75000) at T=20,000. (A2) Both 4-point ladders at
    k=5 and k=10: per shard, the OLS slope of log(se_paired) against log(T) over
    P1/P2/N1/N2, reported with residual RMS and standard error. (A3) The four
    HISTORICAL cells at k=5, k=10 and every k in 2..26, reconstructed from the
    three committed source files named in batch.yaml and gated fail-closed by a
    reproduction of each cell's committed k=17 alpha to 1e-12. (A4) The same-T
    noise handle D_shard(k) = |log2( se_paired(P2,k) / se_paired(N1,k) )| per
    shard, and D_RMS(k), at every evaluable k. PART B -- THE COUPLED-ARM NULL
    BAND (no decoder calls; roughly 7 core-seconds). Rebuild BATCH-91929e's Part
    B with exactly one structural change: base ~ Binomial(n_e - 1 = 55, p) and
    arm_i = base + Bernoulli_i(p) with an independent Bernoulli per arm, so each
    arm's marginal is Binomial(56, p) exactly. Report, at k = 5, 10 and 17: the
    median se_unpaired/se_paired beside the eight real cells' range at the same
    k; the DIRECTLY SIMULATED null distribution of all five banded quantities;
    the measured-versus-analytic SD ratios; the two pre-declared blindness tests
    as PASS/FAIL; the realized Binomial(56, p) marginal check; and the k=17 band
    widths beside the committed comparators. OBSERVATIONS ONLY THROUGHOUT.
