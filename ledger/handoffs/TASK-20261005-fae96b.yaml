  constraints:
    - >-
      PHASE 1 IS READ-ONLY. Extend the G-1 inventory to a classification: for
      each of the 86 distinct unmapped CI lines, the verbatim line, its
      workflow, check name and job, and its class (S1-S10); for each of the
      32 conflicted PRs, each conflicting path and whether it is (i) an
      append-only registry or goal-head conflict (G-4/G-5 pattern), (ii) a
      conflict inside an immutable record (S9), or (iii) an ordinary content
      conflict in mutable files (S7 merge). No write of any kind in Phase 1.
    - >-
      PHASE 2 COMMITS THE DISPOSITION BEFORE ANY REPAIR. A per-PR disposition
      table (merge / supersede-via-S9 / close-redundant / re-run-once / stop)
      written to coordination/archives/TASK-20261005-fae96b/classification.yaml
      and committed before any repair write. A line that maps to no class even
      after Phase 1 stops that PR and is reported (G-1 unchanged).
    - >-
      SUPERSEDE, NEVER EDIT (G-3). Never modify, delete or re-serialize a
      pushed run, ledger, handoff, knowledge or goal-checkpoint file on any
      branch. New files only, plus append-only registry entries (G-4) and
      additive goal-head prepends (G-5).
    - >-
      S9 RECORDS. For every add/add or content conflict inside an immutable
      record: a same-id v2 schema-supersession record when the divergence is
      exactly a schema-defective field; otherwise a superseding record under a
      NEW id (minted by the dispatcher, --check confirmed) that pins each
      prior sha256 and states what each side asserted. Never pick a side.
      If the two pushed versions do not determine the disposition, stop on that
      record and report it.
    - >-
      S10 LINES. Verbatim-recorded, routed out of the repair: a needed
      tooling change becomes a normal code task requested from the dispatcher,
      never a mixed-in repair write. A PR whose only blockers are S10 lines is
      re-run once on its current head; if the lines persist it is reported.
    - >-
      LOWEST BRANCH, THEN MERGE UP (G-2). Never rebase. Never force-push.
      Never squash. Merge only on a head whose CI checks have all concluded
      success or skipped, with no conflict and no open blocking review thread;
      never re-run or skip a check to make it green.
    - >-
      PROVES-TOO-MUCH (S3 of DEC-20261005-040d37). Never write a control as
      if pre-registered. Case (a) cites a report that actually ran it. Case
      (b) records the procedure deviation and requests a control-task id from
      the dispatcher.
    - >-
      KNOWLEDGE PROMOTION (S2). Apply the templates/research-records.md rule.
      A required KN-FIND needs an id minted by the dispatcher; otherwise give
      a concrete not_warranted reason. The evidence is not re-reviewed.
    - >-
      LANES (C3) AND HEAD (C4). Execute exactly DEC-20261005-040d37 C3 and
      C4 after the stacks are merged or stopped; the head is sharded only if
      no open PR touches ledger/goals/GOAL-ECDLP2M-001.yaml, verified and
      recorded how.
    - IDs are minted only by the dispatcher (tools/allocate_id.py --next, then --check). None is invented here.
    - No hypothesis, evidence, experiment or goal status changes. No /run. No experiment re-execution.
    - Amazon Bedrock is prohibited.
