handoff:
  id: TASK-20260916-8d493b
  from: coordinator
  to: coordinator
  role: coordinator
  kind: archive
  archive_kind: snapshot
  batch_id: BATCH-94168f
  goal_id: GOAL-ICPERF-e6b6a4
  recorded_at: '2026-09-16'
  state: queued
  depends_on:
    - TASK-20260916-ec9948

  title: >-
    BATCH-94168f dispatch-package snapshot: commit and push the two task cards,
    this card, and DEC-20260916-a91144 in one isolated commit, verify the
    receipt against Git, refresh the PR -- BEFORE TASK-20260916-3355fc is
    dispatched

  objective: >-
    Make the DISPATCH package durable BEFORE the executor is launched from it.
    Three things depend on this and each fails differently without it: (1)
    TASK-20260916-3355fc's `archived_by` points at TASK-20260916-2c4679, and a
    binding that points at an uncommitted card is a promise rather than a
    binding; (2) DEC-20260916-a91144 authorizes the dispatch, and AGENTS.md
    forbids an official act from uncommitted ledger state; (3) the executor
    card names itself in its own read_scope, and an agent asked to read
    uncommitted state reads something no reviewer can reproduce. This card
    commits, verifies, pushes, and publishes.

  uncertainty_reduced: >-
    None. An archival act measures nothing, runs nothing, and interprets
    nothing.

  why_this_card_exists_at_all: >-
    STATED PLAINLY BECAUSE A THIRD ARCHIVAL CARD IN ONE BATCH NEEDS A REASON.
    TASK-20260916-ec9948 is immutable and its artifact_paths are frozen at nine
    files, none of which is a record written today; it cannot be widened to
    carry this package and must not be edited to look as though it were.
    TASK-20260916-2c4679 runs AFTER the executor returns, so it cannot make the
    executor's own card durable BEFORE the executor is launched. The four
    records below therefore have no archival owner unless this card exists, and
    "every ledger record is assigned to exactly one archival task" would be
    unsatisfied. The alternative -- dispatching from uncommitted cards and
    archiving afterwards -- is precisely the remedy-disclosed-as-correction
    that AGENTS.md "Dispatch preconditions bind the DISPATCHER" forbids
    treating as compliance.

  inputs:
    - path: ledger/decisions/DEC-20260916-3c0cf5.yaml
      role: READ ONLY; the approval of EXP-ICPERF-2f2e40 that DEC-20260916-a91144 dispatches against. Committed by TASK-20260916-ec9948.
    - path: experiments/EXP-ICPERF-2f2e40/specification.yaml
      role: READ ONLY; the frozen contract. Committed by TASK-20260916-ec9948. NOT staged and NOT edited here.
    - path: coordination/goals/GOAL-ICPERF-e6b6a4/lanes/BATCH-94168f.lane.json
      role: READ ONLY; already committed; declares this lane and its write scope.
    - path: coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-94168f/archives/TASK-20260916-ec9948/snapshot-receipt.json
      role: the predecessor archive's receipt; its commit is this commit's expected ancestor.

  constraints:
    - RUN THIS ARCHIVE ALONE. No concurrent worker commits into this worktree while it runs.
    - >-
      STAGE ONLY THE DECLARED PATHS. Do NOT restage anything
      TASK-20260916-ec9948 already committed -- DEC-20260916-3c0cf5, the three
      hypotheses, the three specifications, TASK-20260916-ec9948.yaml or the
      checkpoint shard. Restaging a committed record double-owns it and changes
      nothing.
    - >-
      BEFORE COMMITTING: fetch origin/main and MERGE it into
      claude/index-calculus-graph-dag-3linyk (merge, never rebase); re-run
      `tools/validate_ledger.py` on the merged tree; run `python3
      tools/merge_digest.py --since $(git merge-base HEAD origin/main) --until
      origin/main` and note anything about GOAL-ICPERF-e6b6a4. Record the base
      commit checked and the merge outcome in the receipt.
    - >-
      A SYNC CONFLICT INSIDE AN IMMUTABLE RECORD IS NEVER RESOLVED BY PICKING A
      SIDE. STOP and create a superseding record under a new identifier.
    - >-
      DO NOT EDIT ANY OF THE FOUR RECORDS TO MAKE THIS ARCHIVE TIDIER, and in
      particular do not edit TASK-20260916-3355fc after it has been dispatched
      for any reason whatever. The handoff is immutable; a card that still
      reads `written_not_dispatched` after its agent ran is historically
      accurate for the moment it was written, and a correction record supplies
      what followed. Rewriting it destroys the only evidence of the ordering.
    - >-
      MINT NO IDENTIFIER. All four were supplied pre-allocated and --check
      verified. If a new record turns out to be needed, STOP and request one.
    - >-
      AFTER COMMITTING: push the branch and open or refresh the PR against
      main, NAMING DEC-20260916-a91144, TASK-20260916-3355fc,
      TASK-20260916-2c4679 and TASK-20260916-8d493b. An archive that adds new
      DEC-* and TASK-* records and is not pushed to a branch with an open PR is
      unpublished, not durable evidence.
    - >-
      DO NOT DISPATCH ANYTHING. Completing this card makes
      TASK-20260916-3355fc DISPATCHABLE; it does not dispatch it, and it is not
      a /run. The launch is a separate act under the executor card's own nine
      dispatch preconditions, every one of which must be checked first.

  deliverables:
    - One isolated commit containing exactly the four declared artifact_paths.
    - >-
      coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-94168f/archives/TASK-20260916-8d493b/snapshot-receipt.json
      per templates/research-records.md "Coordinator archive receipt": kind
      snapshot, source_task_ids, commit_sha, parent_sha, path_sha256 for every
      declared path, and record_ids.
    - A post-commit verification of that receipt against Git, reported pass or fail with its exact message.
    - The pushed branch and an open or refreshed PR against main naming the four records.
    - The origin/main base commit checked and the merge outcome, in the receipt.

  artifact_paths:
    - ledger/decisions/DEC-20260916-a91144.yaml
    - ledger/handoffs/TASK-20260916-3355fc.yaml
    - ledger/handoffs/TASK-20260916-2c4679.yaml
    - ledger/handoffs/TASK-20260916-8d493b.yaml
  artifact_paths_note: >-
    FOUR EXACT FILE PATHS, all of which exist with their final content at the
    moment this card is written. Nothing here is templated and nothing waits on
    a producer.

  also_staged_sha256:
    - coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-94168f/dispatch_queue.json
  also_staged_note: >-
    The queue gains the three new task entries in this commit but is NOT
    hash-bound as an artifact_path, for the fixed-point reason
    TASK-20260915-1942e2 recorded and TASK-20260916-ec9948 repeats: a queue
    that records this task's own state transition cannot have its post-commit
    bytes declared before the commit that changes them.

  archived_by: TASK-20260916-8d493b
  archived_by_note: >-
    SELF-OWNED, WHICH IS CORRECT AND NOT A LOOP: an archival card is itself a
    record and must be owned by exactly one archival task, and the only task
    that can stage it in the same isolated commit as the package it archives is
    this one. Same structure as TASK-20260916-ec9948 and TASK-20260915-6d72a0.

  write_scope:
    - ledger/decisions/DEC-20260916-a91144.yaml
    - ledger/handoffs/TASK-20260916-3355fc.yaml
    - ledger/handoffs/TASK-20260916-2c4679.yaml
    - ledger/handoffs/TASK-20260916-8d493b.yaml
    - coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-94168f/archives/TASK-20260916-8d493b/
    - coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-94168f/dispatch_queue.json
  write_scope_note: >-
    The first four are STAGING scope, not authoring scope: they are already
    written and this card commits them unchanged. The fifth is the only path
    this card authors. The sixth is the queue state transition.

  read_scope:
    - ledger/
    - experiments/EXP-ICPERF-2f2e40/
    - coordination/goals/GOAL-ICPERF-e6b6a4/
    - templates/research-records.md
    - AGENTS.md
    - agents/coordinator.md

  not_in_scope:
    - ledger/goals/GOAL-ICPERF-e6b6a4/goal.yaml
    - ledger/handoffs/TASK-20260916-ec9948.yaml
    - ledger/decisions/DEC-20260916-3c0cf5.yaml
    - ledger/hypotheses/H-ICPERF-afe62e.yaml
    - ledger/hypotheses/H-ICPERF-81de5c.yaml
    - ledger/hypotheses/H-ICPERF-f08b1e.yaml
    - experiments/EXP-ICPERF-2f2e40/specification.yaml
    - experiments/EXP-ICPERF-61c136/
    - experiments/EXP-ICPERF-42ef30/
    - coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-a33cda/
    - coordination/review/icperf-20260915-a33cda/
    - experiments/EXP-ICPERF-e21835/
    - experiments/EXP-ICPERF-13f001/
    - experiments/EXP-ICPERF-66fd51/
  not_in_scope_reason: >-
    The first is BATCH-a33cda's to write. The next eight are
    TASK-20260916-ec9948's declared artifact_paths and are already owned by
    that archive; restaging them here would give a record two archival owners.
    The last four belong to BATCH-a33cda and to frozen predecessors.

  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false

  budget:
    wall_clock_seconds: 1800
    memory_gb: 2
    maximum_runs: 0
  budget_note: >-
    NO FIELD IS NULL, so this card is not self-rejected by the Coordinator's
    own budget rule. `maximum_runs: 0` is a HARD scientific constraint: an
    archival task performs no trial. The other two are advisory
    machine-protection figures, matched to TASK-20260916-ec9948's because the
    work is the same shape -- four small YAML files and one coordination file.

  dispatch_preconditions:
    - id: DP-1
      condition: >-
        TASK-20260916-ec9948 has COMPLETED and its post-commit verifier
        ACCEPTED its receipt. That archive makes DEC-20260916-3c0cf5 and
        experiments/EXP-ICPERF-2f2e40/specification.yaml durable; this package
        cites both, and a decision that cites an uncommitted approval is not
        durable either. It is also DEC-20260916-3c0cf5's declared single next
        action, and running this first would jump it.
      binds: the dispatching session, before launch
    - id: DP-2
      condition: No other task is writing this worktree. Archive commits run ALONE.
      binds: the dispatching session, before launch
    - id: DP-3
      condition: >-
        origin/main has been fetched and MERGED into
        claude/index-calculus-graph-dag-3linyk (merge, never rebase), and
        `tools/validate_ledger.py` reports no NEW errors on the merged tree.
      binds: the dispatching session, before launch
    - id: DP-4
      condition: >-
        All four artifact_paths exist with their final content, and no
        not_in_scope path is dirty -- in particular none of
        TASK-20260916-ec9948's nine artifact_paths has been modified since it
        committed them.
      binds: the dispatching session, before launch
      standing: true
    - id: DP-5
      condition: >-
        A lane claim is HELD on GOAL-ICPERF-e6b6a4 for TASK-20260916-8d493b
        (`tools/goal_lanes.py`), after `git fetch`, respecting `max_concurrent`
        2, and released on return. The lane FILE is already committed; a task
        CLAIM is a separate act and is this precondition.
      binds: the dispatching session, before launch
      standing: true
  dispatch_preconditions_note: >-
    AGENTS.md "Dispatch preconditions bind the DISPATCHER, not the agent":
    these five bind the SESSION DOING THE LAUNCHING, must be satisfied BEFORE
    launch rather than discovered afterwards, and are not waived by the work
    turning out fine. `archived_by` is bound (to this card itself, see
    archived_by_note), the declared inputs are committed by DP-1, and DP-5 is
    the lane claim.

  completion_gate:
    - The commit exists, is reachable from HEAD, and has TASK-20260916-ec9948's commit as an ancestor.
    - The commit changes EXACTLY the four declared artifact_paths plus the one also_staged path, and nothing else.
    - Every declared path's sha256 in the receipt matches the committed tree.
    - The commit message names TASK-20260916-8d493b, DEC-20260916-a91144, TASK-20260916-3355fc and TASK-20260916-2c4679.
    - The receipt records the origin/main base commit checked and the merge outcome.
    - The post-commit verifier ACCEPTS the receipt. Until it does, TASK-20260916-3355fc is NOT dispatchable (AGENTS.md rule 7).
    - The branch is pushed and a PR against main is open or refreshed, naming the four records.
    - '`tools/validate_ledger.py` passes on the committed tree with no new errors attributable to these four files.'
    - The dispatch queue contains TASK-20260916-3355fc, TASK-20260916-2c4679 and TASK-20260916-8d493b with their declared states and dependencies, and `tools/research_dispatch.py` renders the queue without error.

  return_format: >-
    The archive receipt path; commit_sha and parent_sha; the verifier's
    pass/fail with its exact message; the origin/main base commit and merge
    outcome; the merge_digest result for GOAL-ICPERF-e6b6a4; the PR url or
    number; the validate_ledger result; and the rendered dispatch plan's Ready
    set. Report any refusal or scope expansion rather than working around it.

  review_plan: null
  review_plan_note: >-
    Null because this card opens no claim-changing review round. The round that
    IS owed on EXP-ICPERF-2f2e40's output, and everything its plan must own, is
    written in TASK-20260916-3355fc `review_plan_note`; it is not duplicated
    here, because two copies of a plan drift and only one of them can be the
    one reviewers read.

  provenance:
    written_by: coordinator, BATCH-94168f, 2026-09-16
    authorizing_decision: DEC-20260916-a91144
    identifier_discipline: >-
      NO IDENTIFIER WAS MINTED BY THIS SESSION. TASK-20260916-8d493b was
      supplied pre-allocated and --check verified. It was offered as a SPARE
      and is used here for a distinct archival task rather than left as a
      placeholder; why it is genuinely needed is in `why_this_card_exists_at_all`.
