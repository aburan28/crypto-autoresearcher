handoff:
  id: TASK-20261005-2eeff9
  from: coordinator
  to: executor
  objective: >-
    Enumerate S(p) and O(p) for EXP-SSI-c9d464 and compare transcribed and
    deleted-transcript 3-isogeny walks of length at most 2 from j = 1728.
  uncertainty_reduced: >-
    Whether the F_p-rational supersingular set is a proper subset at these
    primes, and whether the endpoint j-invariant alone pulls the walk back.
  inputs:
    - ledger/hypotheses/H-SSI-4a0c67.yaml
    - ledger/proposals/IDEA-20261004-a09dd4.yaml
    - experiments/EXP-SSI-c9d464/specification.yaml
    - ledger/decisions/DEC-20261005-dbff92.yaml
  constraints:
    - Implement only the API in the frozen specification.
    - Enumerate every supersingular j-invariant and every walk of length at most 2. Do not sample.
    - Do not describe a toy total variation as a mixing time at a larger prime.
    - Do not claim a PKE, a reduction, or a result outside the three primes.
    - Write nothing outside the declared write scope.
    - Use no Bedrock endpoint or model.
  deliverables:
    - experiments/EXP-SSI-c9d464/runs/<RUN-ID>/cells.json
    - experiments/EXP-SSI-c9d464/runs/<RUN-ID>/command.txt
  artifact_paths:
    - experiments/EXP-SSI-c9d464/runs/
  write_scope:
    - experiments/EXP-SSI-c9d464/implementation/
    - experiments/EXP-SSI-c9d464/runs/
  archived_by: TASK-20261005-26725d
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: null
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
    - cells.json contains all three primes and walk lengths 0, 1, and 2.
    - Each prime records both support sizes, the identity total variation, transcribed pullback failures, and the ambiguous-endpoint count.
    - The run manifest records the git commit, the command, and an empty seed list.
  return_format: >-
    Run id, validity, the primary counts, and the artifact paths.
  review_plan: null
  dispatch_preconditions:
    - archived_by TASK-20261005-26725d is committed and its receipt verifies.
    - The hypothesis, specification, and this handoff are committed and pushed.
    - A lane is claimed before launch.
    - >-
      A Coordinator decision after DEC-20261005-dbff92 explicitly releases
      this experiment. Until that decision, do not launch.
