  the_correction_this_archive_must_make: >-
    This Coordinator's own snapshot commit a72f28b1e (EXP-VOLC-9f5571) framed
    the SR5/T5/T1-transport block as a "genuine design tension" in
    MATCHED-ORDER-DESIGN.md, on the reasoning that gcd(107,19507)=1 (N prime)
