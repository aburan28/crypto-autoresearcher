    for the crater<->floor 107-isogeny on the t=211 class, derived two
    independent ways -- algebraically (Frobenius mod 107 acts as the scalar
    t/2 at the crater, since 107 is inert in O_K so O_K/(107) is a FIELD and a
    repeated-root quadratic in a field forces the root exactly, making all 108
    order-107 subgroups individually rational there; at the floor, End=Z[pi]
    exactly, giving a genuine Jordan block with exactly one stable line) and
    computationally (a toy analog, D_0=-3, ell=5 inert, conductor exactly 5,
    p=19, t=1: crater splits into six rational quadratic factors of the
    5-division polynomial over GF(19), floor gives exactly one rational
    quadratic factor plus one irreducible degree-10 factor -- matching the
    algebraic prediction exactly).
  independently_reverified_by_this_coordinator_before_accepting_the_correction: >-
    Did NOT accept this on the validator's word alone, given it reverses a
    framing already pushed in a prior commit. Recomputed directly: D=-34347,
    D mod 107 = 0 exactly (107^2 | D, D/107^2 = -3.0 exactly, confirming
    D_0=-3, conductor f=107 exactly). Kronecker(-3,107) via Euler's criterion:
    (-3)^53 mod 107 = 106 = -1 mod 107, confirming 107 IS INERT in
    O_K=Z[(1+sqrt(-3))/2]. Independently re-derived, from these two facts alone
    and standard CM theory (not from the validator's writeup), that O_K/(107)
    is a field (inertness), that pi mod 107 satisfies a repeated-root quadratic
    in that field, and that a field's lack of nontrivial nilpotents forces
    pi mod 107 to equal the scalar root exactly -- the same conclusion the
    validator reached, by an independent path. THE CORRECTION IS ACCEPTED.
