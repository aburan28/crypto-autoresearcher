  review_plan:
    id: REVIEW-ICPERF-PRIME63-M2-20261019
    goal_id: GOAL-ICPERF-e6b6a4
    experiment_id: EXP-ICPERF-515ae3
    source_task_id: TASK-20261019-904fbf
    snapshot_task_id: TASK-20261019-2c3c6a
    validator_task_id: TASK-20261019-eb3177
    red_team_task_id: TASK-20261019-de7d9a
    ledger_archive_task_id: TASK-20261019-b3799d
    written_by: coordinator
    written_at: '2026-10-19'
    written_before_any_reviewer_ran: true
    claim_under_review: Exact three-cell prime63 m=2 planted outputs have complete raw and phase custody, correct
      monitor-stop classifications, and independently valid full-point certificates for any cell reported ok. The
      diagnostic offers no natural-yield, base-ranking or full-cost claim.
    coordinator_prior: I expect the fixed monitor-null control to fail closed, the independent checker to reject
      any root or no-solution claim contradicted by the archived witness, and at least one direct m=2 positive to
      produce an inspectable solver trace within its cap. This is a prior, not an outcome; an unserved review backend
      or censored solver leaves it unresolved.
    joints:
    - id: R1
      joint: Every scheduled monitor control and positive cell has a unique raw request, trace, stdout, stderr and
        response when emitted, with exact receipt and archive hashes.
      assigned_to: TASK-20261019-eb3177
      attack_plan: Independently enumerate tar members and receipt rows, recompute hashes, reconstruct attempted
        and unattempted order, and seek missing or duplicated bytes.
      breaking_artifact: A named member or schedule row with contradictory bytes, count or hash.
    - id: R2
      joint: Every accepted planted root satisfies the exact polynomial system, B=475 base and signed full target
        point; an archived satisfying witness contradicts certified_no_solution.
      assigned_to: TASK-20261019-eb3177
      attack_plan: Independently implement field and curve arithmetic from the statement and public parameters,
        evaluate each polynomial and signed sum, then compare with raw solver statuses.
      breaking_artifact: A complete arithmetic counterexample with cell, polynomial or group equation, raw response
        and witness.
    - id: R3
      joint: Monitor fault detection, process-tree RSS, scratch and wall censors are reported within their sampled
        and watchdog scope.
      assigned_to: TASK-20261019-de7d9a
      attack_plan: Recompute terminal classifications from trace, timestamps and resource samples; test whether
        any early stop was recast as a solver negative or silently skipped.
      breaking_artifact: A named cell with raw stop state and reported classification that disagree, or a monitor
        failure that permitted science.
    - id: R4
      joint: The report makes no factor-base, relation-yield or E2E performance inference from separately planted
        targets.
      assigned_to: TASK-20261019-de7d9a
      attack_plan: Build the complete cold and online cost ledger with every unmeasured term null; try to falsify
        each proposed comparison using missing common-target and matched-rho controls.
      breaking_artifact: A quantitative ranking or E2E inference lacking matched natural targets, complete costs
        or independent rho.
    blindness:
      mutual: true
      lifted_for: []
      rule: Reviewers receive the frozen statement and raw snapshot, not the producer interpretation or each other's
        reports, until both joint reports are sealed.
    proves_too_much:
      objects:
      - id: proves_too_much_1
        known_false_conclusion: A checked satisfying planted witness and a certified unit ideal can both hold for
          the same ideal.
        object: The altered certified_no_solution response in the integration's synthetic negative checker control.
        expected_failure_signature: Validator rejects contradiction as invalid instrument output while model_cap_censored
          remains censored.
      assigned_to: TASK-20261019-eb3177
      failure_signature: Acceptance of the contradictory no-solution response invalidates the review procedure.
    blind_rederivation:
      required: true
      quantity: Three request identities, exact planted polynomial evaluations, complete signed target-point sums
        and fixed schedule count.
      parameters: Prime p=9223372021248595841, subgroup r=9223372018953067627, three public m=2 requests, B=475
        arm definitions and archived witness coordinates.
      blind_from:
      - research/icperf_prime63_m2_diagnostic_integration_20261018/check.py
      - research/icperf_prime63_m2_diagnostic_integration_20261018/report.md
      - experiments/EXP-ICPERF-515ae3/runs/RUN-ICPERF-eb0d88/raw-result.json
      - experiments/EXP-ICPERF-515ae3/runs/RUN-ICPERF-eb0d88/diagnostic/receipt.json
      assigned_to: TASK-20261019-eb3177
    seal_then_compare: Archive both independent reports with their assigned joints and checksums before the Coordinator
      reads them side by side or lifts mutual blindness. Any cross-reviewer clarification records a procedure deviation
      and never rewrites a sealed report.
    inference_boundary: Passing review supports only bounded exact m=2 planted solver-to-certificate observations.
      It does not measure natural decomposition yield, useful rank, linear algebra, held-out target recovery, cold
      or amortized total cost, matched rho or a best factor base.
