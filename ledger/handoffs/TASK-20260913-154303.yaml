  completion_gate:
  - All declared combinations finalized with the nested `run:` record schema and required companions.
  - CTL-2 (the Z/15 known-false gate) is checked and reported before any other combination is read as interpretable.
  - validate_ledger.py adds no new violations after the run package.
  - execution-report.yaml and implementation.md are written per required_artifacts.
  return_format: >-
    execution-report.yaml summarizing status (completed_valid /
    failed_infrastructure / invalid_measurement), the CTL-2 gate result,
    and the P1/P2 outcomes as mechanically decided by the frozen
    success_criterion -- no interpretation, no status recommendation for
    H-CRYPTO-46bb7c beyond what the frozen success/falsification criteria
    mechanically decide.
