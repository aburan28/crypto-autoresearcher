handoff:
  id: TASK-20260913-154303
  from: coordinator
  to: executor
  recorded_at: '2026-09-13'
  goal_id: GOAL-CRYPTO-001
  question_id: RQ-CRYPTO-001
  objective: >-
    Implement and execute the frozen, approved contract
    experiments/EXP-CRYPTO-3713bf/specification.yaml (H-CRYPTO-46bb7c,
    converting IDEA-20260905-afa907): build a self-contained, stdlib-only
    Python enumeration over Z/11, Z/17 (prime-order test groups) and Z/15
    (auxiliary known-false coset control); construct the three declared
    partition families (coordinate-style, matched-random null, Z/15 coset)
    under both the declared restricted operation grammar and the full
    translation grammar; compute exact history-conditioned transition
    kernels and delta_t (total-variation distance) for t in {1,2,3,4} by
    full enumeration and exact rational arithmetic; check the Z/15
    known-false gate FIRST; then evaluate predictions P1 (coordinate-style
    delta_t vs matched-null distribution) and P2 (full-translation
    collapse); run the observation-collision check (an independently
    chosen second coordinate rule); and preserve every artifact per
    docs/claims-and-verification.md and AGENTS.md's artifact policy.
  uncertainty_reduced: >-
    Whether a restricted (non-full-translation) operation grammar can
    support a coordinate-style public feature partition of a prime-order
    cyclic group with a measurably smaller approximate-lumpability defect
    (delta_t) than a matched random balanced partition of the same shape,
    and whether that separation collapses once the full translation group
    is available. BOTH outcomes (separation found vs separation absent,
    collapse confirmed vs collapse absent) are pre-registered as decidable,
    first-class, non-failing results per H-CRYPTO-46bb7c's predictions
    P1/P2 and this contract's success_criterion.
  inputs:
  - experiments/EXP-CRYPTO-3713bf/specification.yaml (this frozen, approved contract)
  - ledger/hypotheses/H-CRYPTO-46bb7c.yaml
  - ledger/handoffs/TASK-20260913-154303.yaml (this record)
  - ledger/proposals/IDEA-20260905-afa907.yaml (the converted proposal; claim, mechanism, minimal_test, controls, assumptions, proof_search_map must be read here for full context)
  - ledger/questions/RQ-CRYPTO-001.yaml
  - docs/research-budget-policy.md (advisory budget language governing this contract's budget block)
  read_scope:
  - experiments/EXP-CRYPTO-3713bf/specification.yaml
  - ledger/hypotheses/H-CRYPTO-46bb7c.yaml
  - ledger/handoffs/TASK-20260913-154303.yaml
  - ledger/proposals/IDEA-20260905-afa907.yaml
  - ledger/questions/RQ-CRYPTO-001.yaml
  - docs/research-budget-policy.md
  constraints:
  - Do not weaken, omit, or "clean up" either control (CTL-1-MATCHED-NULL, CTL-2-KNOWN-FALSE-COSET), the heuristic under test (HEUR-1), or any falsification condition from the frozen specification.
  - >-
    The preregistered_prediction (P1/P2, transcribed into the contract) is
    frozen and MUST NOT be adjusted after any run. Any protocol gap
    discovered during implementation is a versioned protocol_amendment
    under experiments/EXP-CRYPTO-3713bf/amendments/, never a silent edit of
    specification.yaml.
  - >-
    CTL-2 (the Z/15 known-false coset control) MUST be computed and
    checked before any coordinate-style or matched-random result on Z/11
    or Z/17 is read as interpretable evidence for or against P1/P2, per
    the contract's stopping_rules and invalidation_rules.
  - >-
    No external mathematics package (PARI, Sage, GAP, cypari, etc.) may be
    used or is required; the entire pipeline is exact enumeration and
    exact rational arithmetic (Python's fractions.Fraction or equivalent)
    on groups of order <=17. If any step is found to require such a
    package, that is a protocol_amendment, not a silent addition of a new
    dependency.
  - >-
    P1 or P2 resolving as a genuine negative (no separation found, or no
    collapse found) is a real, welcome, first-class, non-failing outcome
    per the contract's success_criterion -- report it exactly as such,
    never as a task failure and never suppressed or silently re-run with
    different parameters to seek a different answer.
  - >-
    A wall-clock or memory watchdog interruption (unexpected given the
    tiny scale, but possible as an infrastructure event) is
    `failed_infrastructure` per AGENTS.md rule 3 and is never reported as
    evidence for or against HEUR-1, P1, or P2.
  - >-
    No status change to any other record (H-*, EV-*, DEC-*, GOAL-*) is
    within this task's authority. This experiment does not touch, and
    makes no claim about, GOAL-CRYPTO-001's own completion criteria,
    status, or next_action.
  - Do not commit. The Coordinator performs snapshot and ledger archive commits separately, after this task and after independent review.
  deliverables:
  - experiments/EXP-CRYPTO-3713bf/source/ (self-contained stdlib-only Python: group construction, the three partition families, both grammars, one-step kernel builder, exact delta_t composition, matched-random draw/enumeration logic, observation-collision second coordinate rule)
  - experiments/EXP-CRYPTO-3713bf/runs/ (the enumerated run(s) as nested `run:` records with command.txt/environment.json/stdout/stderr/raw-result.json companions, organized per group or as the executor finds clearest, per the contract's maximum_runs_note)
  - experiments/EXP-CRYPTO-3713bf/execution-report.yaml (observations only, no interpretation, per the spec's required_artifacts and success_criterion_decidability_note)
  - experiments/EXP-CRYPTO-3713bf/implementation.md (documents the coordinate-style modulus rule and restricted grammar as implemented, the CTL-1/CTL-2 construction, and the exact delta_t computation method)
  artifact_paths:
  - experiments/EXP-CRYPTO-3713bf/source
  - experiments/EXP-CRYPTO-3713bf/runs
  - experiments/EXP-CRYPTO-3713bf/execution-report.yaml
  - experiments/EXP-CRYPTO-3713bf/implementation.md
  write_scope:
  - experiments/EXP-CRYPTO-3713bf/source
  - experiments/EXP-CRYPTO-3713bf/runs
  - experiments/EXP-CRYPTO-3713bf/execution-report.yaml
  - experiments/EXP-CRYPTO-3713bf/implementation.md
  archived_by: TASK-20260913-154303
  archived_by_note: >-
    This handoff's deliverables are archived by a separate,
