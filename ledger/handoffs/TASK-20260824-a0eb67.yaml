handoff:
  id: TASK-20260824-a0eb67
  from: coordinator
  to: coordinator
  objective: >-
    Create and strictly verify an immutable snapshot commit of the protocol and
    task report produced by TASK-20260824-2218b3 before any Reviewer,
    Validator, Red-Team, or Executor task is created.
  uncertainty_reduced: >-
    Whether the proposed first-batch protocol is frozen at an exact commit and
    exact artifact hashes so later independent review cannot observe a moving target.
  inputs:
    - GOAL-ECQ-bef741
    - BATCH-9fa73f
    - TASK-20260824-2218b3
    - TASK-20260824-9e826a
    - coordination/goals/GOAL-ECQ-bef741/batches/BATCH-9fa73f/tasks/TASK-20260824-2218b3/protocol.yaml
    - coordination/goals/GOAL-ECQ-bef741/batches/BATCH-9fa73f/tasks/TASK-20260824-2218b3/task-report.yaml
    - coordination/goals/GOAL-ECQ-bef741/batches/BATCH-9fa73f/archives/TASK-20260824-9e826a/receipt.yaml
  constraints:
    - >-
      This is a Coordinator-only snapshot archive task. Perform zero
      mathematical searches, rank computations, benchmarks, candidate screens,
      timeout replays, or other experiments.
    - >-
      Require TASK-20260824-2218b3 to be terminal completed and its task report
      to record zero mathematical experiments.
    - >-
      Fetch and inspect origin/main before archival. Merge the base into the
      research branch if required; never rebase pushed research history.
    - >-
      If a conflict touches an immutable record, stop and require an additive
      successor or correction rather than editing either historical record.
    - >-
      Parse both producer artifacts and check completion gates. Archival freezes
      producer output but does not approve the protocol or interpret its merit.
    - >-
      Populate the receipt's parent_sha and path_sha256 from observed Git state
      and final producer bytes before committing. Leave commit_sha null in the
      committed receipt because the receipt is part of the commit it describes.
    - >-
      Exclude the receipt itself from path_sha256 and include exactly the
      protocol and producer task-report paths.
    - >-
      Stage only the two producer artifact paths and this receipt. Do not use
      broad staging, amend, reset, rebase, or rewrite history.
    - >-
      Use the exact commit subject
      research(TASK-20260824-a0eb67): snapshot TASK-20260824-2218b3 protocol.
    - >-
      Do not create review reports, executable handoffs, candidate curves, or rank claims.
  deliverables:
    - >-
      A snapshot commit whose diff is exactly the two producer artifacts plus receipt.
    - >-
      A receipt binding snapshot kind, source task, parent commit, both source
      hashes, and relevant record identifiers.
    - >-
      Post-commit verification of exact parent, subject, changed paths, blob
      hashes, reachability, and absence of an undeclared experiment.
  write_scope:
    - coordination/goals/GOAL-ECQ-bef741/batches/BATCH-9fa73f/archives/TASK-20260824-a0eb67/receipt.yaml
  artifact_paths:
    - coordination/goals/GOAL-ECQ-bef741/batches/BATCH-9fa73f/archives/TASK-20260824-a0eb67/receipt.yaml
  archived_by: TASK-20260824-a0eb67
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 1800
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
    - TASK-20260824-2218b3 is completed with exactly its two declared artifacts.
    - Both producer artifacts parse and the producer report records zero experiments.
    - >-
      The archive receipt names kind snapshot, source task TASK-20260824-2218b3,
      the observed parent, exact hashes for both producer paths, and record IDs
      TASK-20260824-2218b3 and TASK-20260824-a0eb67.
    - >-
      The resulting commit has the required parent and subject and changes
      exactly the two producer paths plus the receipt path.
    - Every recorded source hash equals the corresponding committed blob hash.
    - The snapshot commit is reachable from HEAD.
    - >-
      No protocol approval, state transition, executable experiment, or
      rank-greater-than-30 claim is recorded.
  return_format: >-
    YAML archive receipt at
    coordination/goals/GOAL-ECQ-bef741/batches/BATCH-9fa73f/archives/TASK-20260824-a0eb67/receipt.yaml
  review_plan: null
