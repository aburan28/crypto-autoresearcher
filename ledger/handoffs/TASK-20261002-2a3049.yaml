  constraints:
    - RUNS ALONE, after TASK-20261002-23efd5 returns and its lane claim is released; never concurrently with any other card or archive.
    - >-
      ORDER (R-GATE). (1) The top-level session hashes the producer's four
      paths (pre-gate digests) and runs the R-FORM checks below. (2) It runs
      the whitelist value grep of the plan's forward_precondition step (1)
      and writes the mechanical record whitelist-grep-v3.yaml (the command
      and every hit as file:line; it may print search terms, so it is in the
      J10 blind_from and never whitelisted). (3) ONE fresh Coordinator gate
      sub-session, under coordinator-orchestration-code, whose write scope is
      only blind-inputs-amendment-01.yaml, writes the amendment. (4) The
      top-level session greps the amendment for every search term and checks
      that every transcribed definition is a byte-exact substring of the
      producer's worksheet; any hit or mismatch is a stop and the gate
      sub-session rewrites. (5) It re-hashes the producer's four paths against
      the pre-gate digests and stops on any difference, a custody failure. (6)
      It makes one isolated commit, writes the receipt, verifies, pushes and
      refreshes the PR.
    - >-
      R-FORM CHECKS (plan TA-5), each a stop on mismatch: the frozen version-2
      copy hashes to
      1ad01ce2e913fc66c127688f6e718432fbb4de3a4b16174455ceec690ff5942d; the
      frozen version-1 copy hashes to
      1088d03f25e7cff8f581a0ed83c299301bba48013a4f26df560371b9e90b0d2d; the
      leading hypothesis_v2_prefix_bytes bytes of
      ledger/hypotheses/H-NISTBIN-dec5e1.yaml (the length TASK-20261002-144a4f
      recorded, never one read back from the current file) hash to
      28b713f12fb63b3eebd4a814093bf7311b244d78c0b69cfcd1060d02869db157; its
      leading 28166 bytes hash to
      b83b2a358bea10a29b6fca0fea4184e19ff9b257ade3a27ab5608ab33caa0b23.
    - >-
      THE AMENDMENT (plan forward_precondition step (3)). Value-free and
      additive. Every grep hit takes exactly one of the plan's four
      dispositions, D1-REDACTION, D2-EXCLUSION, D3-DISCLOSED-LEAK or
      D4-NON-VALUE-MATCH (subclass D4a IDENTIFIER or D4b FOREIGN-QUANTITY with
      a one-line value-free basis), and no other label (DEC-20260925-41f6dc
      PF-2). It transcribes, never as a value, the definition of every NF-nn
      item of the worksheet's newly_frozen_values section, byte-exact, with
      "definition not separable" recorded where it cannot be separated from
      its answer; any changed definition of R-B, R-M, W, a memory column or
      the threshold; the statement of any M7 reading version 3 adopts or
      restricts; and any (n, m, t, D, k reading) point at which version 3
      states a memory figure outside the QM grid, as parameters. It writes no
      search term.
    - Both gate files are ALWAYS written, so each declared artifact exists whatever the grep finds. When nothing is found the file says "no hits, no change" and is still committed.
    - >-
      The gate sub-session is never the producer's session, a reviewer's or
      the composer's (TASK-20261002-b2b9f1). Its judgments are Coordinator
      procedure, not review verdicts, and move no key of the plan. The
      top-level session itself runs only the greps, hashing, verbatim checks
      and git, and records the gate's outputs verbatim.
    - >-
      Bind exactly the producer's four paths, the two gate files and the
      receipt, and nothing else, in ONE isolated content_at_commit commit.
      Stage them one by one; git add -A is forbidden. NEVER edit a producer
      file while staging; a malformed file is committed as malformed and
      reported. Any file the producer wrote outside its declared paths is
      named in the receipt as a scope finding and NOT staged (also TA-5).
    - Merge origin/main first; merge, never rebase. Record the base commit checked and the merge outcome in the receipt.
    - If tools/validate_ledger.py reports a NEW error on the version-3 specification or the version_3 block, or tools/research_dispatch.py refuses the layout, stop and report (DEC-20261002-0983f2 R-FORM stop_conditions).
    - The commit message names TASK-20261002-2a3049 and every archive record id literally, and states no value and no verdict. Neither it nor the PR text carries a search term or any value.
    - A killed gate sub-session is continued under R-CONTINUATION by a fresh session of the same role and policy, from the gate file's own partial content and its declared inputs only.
    - No reviewer (TASK-20261002-3cd1f8, -3de9d2, -496923, -4cb903, -84c5d6) is dispatched before this snapshot, with its gate files, is committed, verified and pushed.
    - ZERO RUNS.
