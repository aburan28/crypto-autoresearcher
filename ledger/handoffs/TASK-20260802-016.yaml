handoff:
  id: TASK-20260802-016
  from: coordinator
  to: idea-generator
  objective: >-
    Scout primary literature for a concrete external theorem or correspondence
    that changes a load-bearing generic-prime-field ECDLP bottleneck, and map
    each viable ingredient to an exact object and operation before proposing.
  uncertainty_reduced: >-
    Whether any theorem-new non-permutation correspondence, source-free inverse,
    or exact source-complete rank bound survives applicability and full-cost screening.
  inputs:
    - ledger/questions/RQ-ECDLP-002.yaml
    - ledger/goals/GOAL-ECDLP-001.yaml
    - ledger/evidence/EV-ECDLP-015.yaml
    - ledger/decisions/DEC-20260802-003.yaml
    - focus/current_plan.json
    - ideas
    - ledger
    - knowledge
    - docs/inventor-protocol.md
    - docs/target-result-profile.md
  constraints:
    - Read the complete mechanism frontier and BATCH-026 review before scouting.
    - Use primary sources and quote no theorem more strongly than its hypotheses allow.
    - Start from the exact external theorem, its hypotheses, and the ECDLP object/operation it would change.
    - Exclude longer orbit words, reordered Kummer decks, higher public endpoint jets, bounded-degree chart multiplication, tensor-format swaps, and BATCH-020 threshold maintenance unless a new theorem changes their information flow.
    - Charge theorem preprocessing, construction, success probability, source output, rank, factor logs, blind descent, verification, memory, data, and communication.
    - Include matched Pollard-rho/Shoup and structured-generic boundaries, dominated_by, and quantitative sota_delta.
    - Use pre-ID B22-T handles only; do not allocate canonical IDEA ids.
    - Zero viable ingredients is allowed but is not literature or search closure; preserve named obstruction and forward guidance for every screen.
    - MAKE NO COMMIT and assign no Executor.
  deliverables:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-027/tasks/TASK-20260802-016/ingredient_scout.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-027/tasks/TASK-20260802-016/literature_map.md
  artifact_paths:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-027/tasks/TASK-20260802-016/ingredient_scout.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-027/tasks/TASK-20260802-016/literature_map.md
  archived_by: TASK-20260802-017
  inference:
    policy: research-deep
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget: {wall_clock_seconds: 5400, memory_gb: 4, maximum_runs: 1}
  completion_gate:
    - Every screened ingredient has a primary-source theorem statement, applicability map, exact object/operation, complete cost transform, falsification, and Pareto accounting.
