handoff:
  id: TASK-20260904-d66403
  from: coordinator
  to: executor
  goal_id: GOAL-SSI-001
  batch_id: BATCH-dc1424
  role: executor
  objective: >-
    Determine, value by value and with a locator for each, whether the five
    (log2 time, log2 memory) pairs literalized at
    experiments/EXP-WESOVOW-001/cost_model.py:61-65 are FAITHFUL to Section 4.1
    of inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, are MIS-TRANSCRIBED, or are
    UNDETERMINED because the paper does not state them in a form directly
    comparable to the cost model's units; and, separately and afterwards,
    measure whether the PAPER_PAIRS time at each field size lies at or above the
    minimum log2 T_full this cost model attains on the contract's own declared
    optimizer grid (RC-2, anchor reachability).
  uncertainty_reduced: >-
    Which of three different worlds the committed fitted_opt / PAPER_PAIRS
    divergence comes from - a transcription defect in a committed implementation
    input, a defect or difference in the cost model, or a genuine external
    disagreement between the paper and this model - and whether the two anchors
    were ever two estimates of one quantity at all. Nobody in this program has
    ever read the source to check; both reviewers of BATCH-256a94 named this the
    cheapest decisive step in that round and it was not performed there because
    the paper was outside every declared read_scope.
  inputs:
    - inputs/P13-WESOLOWSKI-2026/paper_fulltext.md (the frozen source; Section 4.1 is the target, read-only)
    - inputs/P13-WESOLOWSKI-2026/source_record.yaml (provenance of that document, read-only)
    - experiments/EXP-WESOVOW-001/cost_model.py (read-only; the five literals are at lines 61-65 inside the PAPER_PAIRS mapping opened at line 60)
    - experiments/EXP-WESOVOW-001/specification.yaml (read-only; model_definition states the units and cites Section 4.1, and the optimizer block declares the grid RC-2 needs)
    - experiments/EXP-WESOVOW-001/runs/RUN-WESOVOW-001/raw-result.json (read-only; per_field optimal values are the model's attained minimum for RC-2)
    - AGENTS.md, and the frozen_artifact_ruling, citation_prohibition, blind_phase_hygiene and execution_prohibition blocks of BATCH-dc1424/batch.yaml
    - ledger/decisions/DEC-20260904-166ab5.yaml (the decision that ordered this task; its PD-2 and PD-4 rulings bind here)
  constraints:
    - >-
      READ-ONLY, ABSOLUTELY: everything under inputs/P13-WESOLOWSKI-2026/,
      experiments/EXP-WESOVOW-001/specification.yaml,
      experiments/EXP-WESOVOW-001/cost_model.py, and everything under
      experiments/EXP-WESOVOW-001/runs/. Do not edit, move, regenerate,
      reformat, rerun, or stage any of them.
    - >-
      DO NOT EXECUTE cost_model.py, EVER - not to reproduce a value, not to
      check a literal, not with WESOVOW_RAW_PATH set. Its default output path
      names a committed run directory, which is a standing evidence-integrity
      hazard (DEC-20260904-166ab5, O7/R2). Read it as text only.
    - >-
      WRITE ONLY inside
      coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/tasks/TASK-20260904-d66403/
      and produce exactly the six declared artifacts, no seventh. Do not modify
      task_card.yaml.
    - >-
      WRITE THE PRE-REGISTRATION FIRST, BEFORE OPENING SECTION 4.1. The
      tolerance, the per-value verdict vocabulary, the composition rule and the
      directly-comparable test are fixed by the task card and are copied into
      paper_literals_verification.yaml and stated as written before the paper
      section is read. They may not be revised after any paper value is seen; an
      objection to the pre-registration is recorded and then followed.
    - >-
      TOLERANCE, PRE-REGISTERED: a committed literal and a paper-stated value
      agree when |paper - literal| <= 0.05 bits, half a unit in the last decimal
      place the literals carry. If the paper states a value to COARSER
      precision, use half a unit in the PAPER's last stated place, record the
      widened tolerance explicitly, and flag the value `precision_limited`. If
      the paper states a value only qualitatively, the value is `undetermined`.
    - >-
      DIRECTLY COMPARABLE, PRE-REGISTERED. A paper value is `direct` only if
      Section 4.1 states it as a number in the same quantity and unit the
      literal carries - log2 of F_{p^2}-operations for time, log2 of TABLE
      ENTRIES for memory. Bytes, another entry convention, or a formula the
      reader must evaluate make the form `requires_derivation` and the verdict
      `undetermined`. If you perform such a derivation anyway, record it under
      `derived_comparison` with the derivation written out; it may NOT become
      the value's verdict.
    - >-
      A LOCATOR FOR EVERY VALUE, INCLUDING EVERY ABSENT ONE: file path, line
      range in paper_fulltext.md, and the verbatim quoted sentence, table row or
      cell. For a value you could not find, record the line range of Section 4.1
      you read in full and the search terms you used, so `absent` is a reported
      measurement and not an omission.
    - >-
      RC-1 IS THE GATE AND ITS VERDICT IS FROZEN BEFORE RC-2 RUNS. Finalize
      paper_literals_verification.yaml and locator_table.json first; only then
      compute anchor_reachability.yaml. Nothing in RC-2 may alter a per-value or
      composed verdict; record any pressure to do so under `post_hoc_pressure`
      and leave the verdict as written.
    - >-
      RC-2 READS COMMITTED NUMBERS ONLY: the attained minimum from
      RUN-WESOVOW-001/raw-result.json per_field optimal values by exact key
      path, and the anchor time from the cost_model.py literals. Do not
      recompute the optimizer, do not re-derive Dickman rho, and do not run
      cost_model.py. If a needed key is absent, say so and report RC-2 not
      attempted for that field size; missing data stays missing.
    - >-
      EVERY CONTROL NAMES THE CONCRETE INPUT THAT MAKES IT FAIL, AND THAT INPUT
      MUST BE REAL AND REACHABLE. DEC-20260904-166ab5 REFUTED a control of the
      last round for having no reachable failure branch on any real anchor: it
      passed on every possible input, so its pass carried no information. For
      each of VC-0, VC-1, VC-2 and RC-2, state the input, run the control's own
      code on it, and report what actually happened. If a control turns out to
      be entailed by its own construction, SAY SO and report it as carrying no
      information.
    - >-
      check_literals.py must be standalone: Python standard library only, no
      network, no numpy requirement, no SageMath, no imports from experiments/.
      Its controls must be functions with reachable failure branches that a
      reviewer can import and call with its own inputs.
    - >-
      RESTATE THE CITATION PROHIBITION VERBATIM IN EVERY ARTIFACT, together with
      the predicate extension, and state for each artifact which of them you
      found applicable and why. Do not lift either. Where a deliverable would
      name a prohibited value, a LOCATOR satisfies it (DEC-20260904-166ab5
      PD-2).
    - >-
      Every number must trace to a committed path and a line or key path. Never
      fabricate commands, outputs, timings, statistics, citations, page numbers,
      or runs. A locator you did not open is a fabrication under AGENTS.md rule
      9, and it is the specific fabrication this task is most exposed to.
    - >-
      A timeout, crash, missing dependency, or exhausted budget is an
      operational observation and never mathematical evidence about the paper,
      the cost model, or any isogeny problem. An `undetermined` verdict is a
      RESULT and is not an operational failure; do not conflate the two in
      either direction.
    - >-
      Make no security, SQIsign, CSIDH, standardized-parameter, exponent, or
      asymptotic-complexity claim in any direction. Write no ledger or
      scientific record, change no status, and do not commit.
    - >-
      Never select a provider, backend, endpoint, or model identifier containing
      Bedrock, case-insensitively.
  deliverables:
    - paper_literals_verification.yaml
    - locator_table.json
    - check_literals.py
    - controls_report.yaml
    - anchor_reachability.yaml
    - runtime_session_receipt.yaml
  artifact_paths:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/tasks/TASK-20260904-d66403/paper_literals_verification.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/tasks/TASK-20260904-d66403/locator_table.json
    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/tasks/TASK-20260904-d66403/check_literals.py
    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/tasks/TASK-20260904-d66403/controls_report.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/tasks/TASK-20260904-d66403/anchor_reachability.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/tasks/TASK-20260904-d66403/runtime_session_receipt.yaml
  read_scope:
    - AGENTS.md
    - CLAUDE.md
    - docs/claims-and-verification.md
    - inputs/P13-WESOLOWSKI-2026
    - experiments/EXP-WESOVOW-001
    - ledger/decisions/DEC-20260904-166ab5.yaml
    - ledger/evidence/EV-SSI-5d954c.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424
  write_scope:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/tasks/TASK-20260904-d66403
  archived_by: TASK-20260904-977d04
  reviewed_by:
    - TASK-20260904-82665d
    - TASK-20260904-c8675d
  inference:
    policy: executor-implementation
    reasoning_effort: medium
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 3600
    memory_gb: 2
    maximum_runs: 6
  completion_gate:
    - All six artifacts exist at their exact declared paths and nothing else was written.
    - No file under experiments/ or inputs/ was modified, moved, staged, or executed, and cost_model.py was never run.
    - The preregistration block is present, matches the task card, and is stated to have been written before Section 4.1 was opened.
    - All ten numbers carry a verdict from exactly {faithful, mis_transcribed, undetermined}, each with a locator or a recorded failed search, and each with its comparison_form.
    - The composed verdict is computed by the pre-registered rule and the rule is shown being applied.
    - Any derivation performed to make a paper value comparable appears under derived_comparison and is NOT used as a verdict.
    - VC-0, VC-1, VC-2 and RC-2 each carry a verdict, the concrete failing input, the observed result on that input, and an entailment disclosure.
    - RC-2 exercises both failure directions on real inputs and reports both.
    - anchor_reachability.yaml was produced after the RC-1 verdict was final, and no RC-1 verdict changed after it.
    - The citation prohibition and its predicate extension are restated verbatim in every artifact, neither is lifted, and each artifact states whether either fired.
    - runtime_session_receipt.yaml records inference provenance and records no probe that was not run.
    - No ledger or scientific record was written, no status was changed, and nothing was committed.
  return_format: >-
    A short task report in the final message naming the composed RC-1 verdict,
    the per-value verdict counts, each control verdict, the RC-2 per-field
    reachability verdicts, and every limitation. Findings live in the artifacts;
    a result that exists only in a message did not happen.
  review_plan_copy_note: >-
    The `review_plan` below is IDENTICAL to the block on
    coordination/goals/GOAL-SSI-001/batches/BATCH-dc1424/tasks/TASK-20260904-d66403/task_card.yaml.
    It is duplicated here so the Coordinator's pre-recorded prior is a committed
    LEDGER record rather than only coordination state; the batch-directory copy
    is the one `tools/check_review_independence.py --batch` resolves, and it is
    the only `review_plan` block inside the batch directory. If the two ever
    diverge, that divergence is a finding and the resolution is a superseding
    record, never an edit to either.
  review_plan:
    claim_under_review: >-
      The package produced by TASK-20260904-d66403, as that task states it in
      its own artifacts: the per-value and composed RC-1 verdict on whether the
      five (log2 time, log2 memory) pairs literalized at
      experiments/EXP-WESOVOW-001/cost_model.py:61-65 are faithful to Section
      4.1 of inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, are mis-transcribed,
      or are undetermined for want of a directly comparable statement; and the
      RC-2 finding on whether the PAPER_PAIRS time is reachable by this cost
      model at each field size.
    coordinator_prior: >-
      Recorded before any task of this batch runs. I HAVE NOT READ SECTION 4.1
      and will not; this prior rests only on committed artifacts of BATCH-256a94
      and on the structure of the problem. (1) I expect the composed verdict to
      be `literals_faithful`, at perhaps half my belief, on the ground that the
      Red Team of BATCH-256a94 independently reproduced the fitted_opt anchor
      from the frozen contract with an independent Dickman rho to <= 2.5e-4
      bits, so the model side is reproducible and the residual divergence is
      more likely to live in the source's own optimization than in an arithmetic
      error here; and on the ground that the five signed
      paper-minus-attained-minimum deltas recorded in EV-SSI-5d954c (values
      deliberately not restated here - see batch.yaml blind_phase_hygiene) are
      small and of MIXED sign, which is the signature of a slightly different
      optimization or of rounding in the source, not of a typo, which is usually
      large and isolated. (2) I give roughly a third of my belief to
      `undetermined`, on a specific and checkable ground: Section 4.1 may state
      the pairs in a form that is not directly comparable - memory in bytes or in
      a different entry convention, or a formula to evaluate rather than a
      tabulated number. If that is what the section holds, the honest verdict is
      `undetermined` and the round's real finding is that PAPER_PAIRS was never a
      transcription of stated values, so the two anchors were never two estimates
      of one quantity and the whole reconciliation framing of BATCH-eb0a7e and
      BATCH-256a94 was mis-posed. That would be the most informative outcome
      available here. (3) I give the remainder to `literals_mis_transcribed`, and
      I name where I would look first WITHOUT naming it: the field size carrying
      the largest-magnitude delta in EV-SSI-5d954c, which I withhold here so the
      blind re-transcription is uncontaminated and which resolves uniquely
      against that immutable record. (4) On RC-2 I expect `off_curve` at three
      field sizes and `reachable` at two, reproducing EV-SSI-5d954c's recorded
      pattern from the committed literals; a DISAGREEMENT with that pattern would
      be the most informative thing RC-2 can produce, because it would mean one
      of the two computations of the same committed numbers is wrong. (5) I
      expect the controls to be the weak point again, and I name the specific
      failure I predict: a decoy perturbation chosen large enough to be rejected
      trivially, leaving the procedure's resolution unbounded at the 0.18-3.22
      bit scale that this campaign actually cares about. VC-2 exists because I
      expect that, and a VC-2 that reports resolution no tighter than 0.5 bits
      confirms it. (6) I expect the Red Team's blind re-transcription to AGREE
      with the producer on any value whose comparison_form is `direct`, and I
      expect the informative disagreement, if there is one, to be about FORM
      rather than about digits - one agent judging a value directly comparable
      and the other judging it to require a derivation. The findings that would
      most inform this program are the ones that overturn this prior: a
      demonstrated mis-transcription at any field size, an `undetermined`
      grounded in what the section actually says, or a demonstration that the
      reachability comparison is itself ill-posed because the paper's memory unit
      is not the model's.
    joints:
      - joint: J1 locator fidelity of the paper-side transcription
        assigned_to: TASK-20260904-82665d
        attack_plan: >-
          Do not accept the producer's quotations. Open
          inputs/P13-WESOLOWSKI-2026/paper_fulltext.md at every recorded line
          range yourself and check three things per entry: that the quoted_text
          is actually at those lines; that it contains the number attributed to
          it; and that the recorded number is the one the surrounding sentence
          attributes to that field size and that quantity rather than to a
          neighbouring one. Then go the other way: read the whole of Section 4.1
          and look for a SECOND statement of any of the ten quantities elsewhere
          in the section - a table beside a sentence, an example, a footnote -
          that the producer did not cite and that disagrees with the one it did.
          Where I think this breaks: a section that states the pairs twice, once
          roundly in prose and once precisely in a table, with the producer
          having found only one; or an entry whose quoted sentence contains the
          digits but attributes them to a different quantity, which is exactly
          what a hurried locator search returns.
        breaking_artifact: >-
          A recorded line range whose text does not contain the attributed
          number; a second, disagreeing statement of any of the ten quantities
          inside Section 4.1 that the package does not cite; or an entry whose
          quotation supports a different (field size, quantity) pair than the one
          it is filed under.
      - joint: J2 verdict composition and the undetermined discipline
        assigned_to: TASK-20260904-82665d
        attack_plan: >-
          Check the pre-registration against the task card word for word, then
          recompute the composed verdict from the ten per-value verdicts by the
          pre-registered rule and confirm it is what the package reports. Then
          attack the `undetermined` boundary in BOTH directions. Over-claiming:
          find any value marked `faithful` whose comparison_form should have been
          `requires_derivation` - a value arrived at by converting units,
          evaluating a formula, or reading a rounded figure at a precision the
          paper does not carry, with the conversion recorded under
          derived_comparison and the verdict nonetheless set to `faithful`.
          Under-claiming: find any value marked `undetermined` for which Section
          4.1 in fact states the quantity directly, i.e. an `undetermined` used
          to avoid recording a mismatch. Check that the tolerance actually
          applied per value equals the pre-registered one or a properly declared
          widening, and that no widening was chosen after the value was seen.
          Where I think this breaks: the derivation route. Deriving a comparable
          number and then reporting it as what the paper says is the single most
          likely way this task produces a confident wrong answer, and it looks
          identical to a correct answer unless someone reads derived_comparison
          against the verdict.
        breaking_artifact: >-
          A value whose verdict does not follow from its own comparison_form and
          tolerance; a composed verdict that is not what the pre-registered rule
          returns on the ten per-value verdicts; a tolerance widened without a
          declared reason; or a derivation used as a verdict.
      - joint: J3 control capability on real inputs
        assigned_to: TASK-20260904-82665d
        attack_plan: >-
          For each of VC-0, VC-1, VC-2 and RC-2, construct the concrete input
          that should make it fail and RUN THE PRODUCER'S OWN FUNCTION on it -
          import check_literals.py as a module into your own scratch script and
          call its control functions directly, as the Validator of BATCH-256a94
          did to refute RG-4. Do not accept a prose claim that a branch is
          reachable. Specifically: feed VC-1 a decoy differing from the committed
          set by less than the tolerance and confirm the procedure does NOT
          reject it; feed VC-2 the delta ladder yourself and check the reported
          resolution is the one the code produces; feed RC-2 the model's own
          per_field optimal pairs and a set placed below the minimum, and check
          both branches are actually taken. Then ask, for each control, whether
          its PASS is entailed by its construction - the RG-4 failure mode - and
          say so if it is. Where I think this breaks: VC-1 objects (i) and (ii)
          could both be rejected by a procedure that rejects everything, so check
          that the procedure ACCEPTS something, or its rejections carry no
          information either.
        breaking_artifact: >-
          A control with no reachable failure branch when called directly; a
          control whose pass is entailed by its own construction and was reported
          as confirmation; a reported resolution the code does not reproduce; or
          a procedure that rejects every input including one it must accept.
      - joint: J4 anchor reachability, the citation predicate, and what the package licenses
        assigned_to: TASK-20260904-82665d
        attack_plan: >-
          Recompute RC-2 yourself from the two committed sources - the literals
          at cost_model.py:61-65 and RUN-WESOVOW-001/raw-result.json's per_field
          optimal values - and check both the numbers and the key paths the
          package claims to have read. Then attack the interpretation rather than
          the arithmetic: `off_curve` says the anchor is not a value of this
          function ON THIS GRID, and the grid is log2 B in [1.0, 60.0] step 0.1
          with a tabulated Dickman rho; enumerate what else could produce
          `off_curve` besides a wrong literal - a grid that does not contain the
          paper's B, a different rho, a different unit of cost - and check
          whether the package's language admits those or forecloses them.
          Separately, apply the DEC-20260904-166ab5 citation predicate to this
          package yourself and decide whether it fires: the package computes no
          crossover, no T_DG comparison and no margin, so I believe it does not,
          but check that no artifact smuggles one in. Finally, enumerate every
          sentence that could be quoted as support for a claim about the paper's
          correctness, about SQIsign or CSIDH, about a standardized parameter
          set, about an exponent, or about the status of GOAL-SSI-001, and show
          the shortest path by which a later reader could over-read it. Where I
          think this breaks: `off_curve` reads as "the paper's number is
          impossible", which it is not - it is a statement about this model on
          this grid - and one careless sentence turns a reachability measurement
          into a claim about a published result.
        breaking_artifact: >-
          An RC-2 value that does not recompute from the committed sources; a key
          path the package claims to have read that does not exist; a
          demonstration that `off_curve` admits an explanation the package's
          language forecloses; a named sentence with a worked over-reading path;
          or a prohibited value or sign restated anywhere in the package.
      - joint: J5 blind independent re-transcription of the five pairs
        assigned_to: TASK-20260904-c8675d
        attack_plan: >-
          This joint is not an audit of the producer; it is a second, independent
          instance of the same measurement, and its value is entirely in the
          order you do it in. PHASE A, BLIND: read only
          inputs/P13-WESOLOWSKI-2026/paper_fulltext.md (and
          experiments/EXP-WESOVOW-001/specification.yaml for the model's units,
          which contains none of the ten values), locate Section 4.1, and write
          into your report YOUR OWN transcription of the five (log2 time, log2
          memory) pairs with a locator for each, together with your own judgement
          of whether the section states each in a form directly comparable to
          log2 F_{p^2}-operations and log2 table entries, and your own count of
          how many distinct places in Section 4.1 state any of these quantities.
          Commit to that before reading anything else. PHASE B: only then open
          experiments/EXP-WESOVOW-001/cost_model.py at lines 56-70 and compare
          your transcription against the committed literals, value by value,
          reporting agreement, disagreement, or incomparability. Where I think
          this breaks: I expect agreement on digits and disagreement on FORM -
          you and the producer judging comparability differently - and that
          disagreement is the round's most useful output, so record your form
          judgement in Phase A explicitly rather than letting it be implied by
          the comparison.
        breaking_artifact: >-
          A Phase A transcription that differs from the committed literals at any
          value; a Phase A finding that Section 4.1 states these quantities in
          more than one place, or in none; or a Phase A form judgement that would
          make the comparison the whole campaign has been running on ill-posed.
    blindness:
      mutual: true
      lifted_for: []
      rationale: null
    proves_too_much:
      objects:
        - >-
          DECOY SHIFT. The committed literal set with every one of the ten
          numbers shifted by +0.30 bits. At most one of {committed set, shifted
          set} can be faithful to Section 4.1, so "this set is faithful to
          Section 4.1" is known false for at least one of them and a procedure
          returning `faithful` for both has proved too much.
        - >-
          DECOY PERMUTATION. The committed pairs cyclically permuted across field
          sizes. The committed pairs are strictly increasing in log2 p, so the
          permuted set is not the committed set, and again at most one can be
          faithful.
        - >-
          NULL OBJECT. The pair set (log2 p / 2, 0.0) at every field size. "These
          are Section 4.1's (time, memory) pairs for the p^{1/3+o(1)} attack" is
          KNOWN FALSE: log2 p / 2 is the Delfs-Galbraith baseline the paper
          improves on, and a memory of 2^0 entries contradicts the paper's own
          M = Psi(X,B) X, which specification.yaml quotes from Section 4.1.
        - >-
          UNIT OBJECT. The committed memory values shifted by +6.0 bits, i.e. the
          same memory expressed per 64-byte entry rather than per entry. "This
          set is faithful, in the same unit, and directly comparable" is known
          false; a correct procedure must return `mis_transcribed` or
          `undetermined` and MUST NOT return `faithful` by silently accepting a
          unit conversion.
      failure_signature: >-
        On each object the procedure must return `mis_transcribed` or
        `undetermined` and never `literals_faithful`. A `faithful` on the shift
        or permutation objects together with a `faithful` on the committed set is
        a self-contradiction the procedure produced, and its verdict on the real
        literals then carries no information: say that explicitly rather than
        reporting the other rejections as robustness. A `faithful` on the unit
        object specifically indicates the procedure is comparing magnitudes
        without checking units, which is the exact defect that would make the
        whole anchor comparison meaningless. Report what the procedure DID on
        each object, not what it should have done.
      assigned_to: TASK-20260904-c8675d
    blind_rederivation:
      required: true
      quantity: >-
        The five (log2 time, log2 memory) pairs that Section 4.1 of
        inputs/P13-WESOLOWSKI-2026/paper_fulltext.md states for log2 p in {256,
        384, 512, 576, 768}, as the paper states them, in the units the paper
        states them in; together with, per value, whether the paper states it in
        a form DIRECTLY COMPARABLE to the cost model's declared units - log2 of
        F_{p^2}-operations for time and log2 of table entries for memory - or
        only in a form requiring a derivation the paper does not itself perform.
      parameters: >-
        The five field sizes log2 p in {256, 384, 512, 576, 768} declared in
        experiments/EXP-WESOVOW-001/specification.yaml
        scenario_definitions.field_sizes_log2p. The unit definitions are that
        file's model_definition.unit_of_cost and unit_of_memory. Section 4.1 is
        to be located in the paper by the re-transcriber, not handed to it.
      blind_from:
