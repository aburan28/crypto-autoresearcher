    red_team_on_L9: >-
      Verdict "closure CONFIRMED WITH SCOPE CORRECTION". The lane IS closed
      within its declared boundary, but NOT by the argument DEC-20260810-2c7e3c
      names as load-bearing. What holds it closed is EXP-CANL-1064e0's
