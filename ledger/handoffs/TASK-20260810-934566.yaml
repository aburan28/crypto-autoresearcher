      N(alpha) >= |D_E|/4 is a property of the PRINCIPAL CLASS, not of the
      order, because a rank-1 projective O-module is an ideal class whose
      Z-lattice has successive-minima ratio c/a of that class's reduced form.
      The dispatching Coordinator independently reproduced the reviewer's counts
      by direct enumeration of reduced forms: 44%, 49%, 62%, 53% of classes at
      D = -2003, -10007, -100003, -1000003 have c/a <= 4, observed minima 1.42,
      1.04, 1.15, 1.03, against a Lemma 1 prediction of a gap up to 250000 at
      the last. A1 CLEARS -- no discriminant is misused. Also: Theta(N) is right
      as an instance count but the pre-registered obstruction is a HEIGHT and
      Answer 3 derives Theta(N^{2/r}), contradicting it for r >= 3; Answer 4 leg
      (iii) is quantitatively vacuous; the automorphism-discounted rho control
      KN-TECH-018 is mandatory under the question record and absent.
    validator_on_SR3_v3: >-
      Verdict "v3 FROZEN WITH FINDINGS", terminal verdict passed. No numeric free
      parameter remains in any reachable state. ONE BLOCKING FINDING, F-V1.4:
      v3 freezes a MUST to report per-curve exactness against the reference, but
