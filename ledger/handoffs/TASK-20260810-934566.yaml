      RUN-ICINV-p4001-fixed and found row-level aggregates plus an n_curves
      COUNT only, no per-curve rate table at any depth. A9 forbids re-measuring
      the reference. Also material: F-V3.2, DEC-20260810-6b4554 rationale item 4
      drops a qualifier and calls 2.0e-3 the whole-gate false-failure
      probability, when corrected for F-V2.4 (sqrt(2) applied to z and w but
      omitted from G3b) G3b alone would fire at ~0.45 / ~0.35 on a fresh draw;
      F-V4.1, SR3-v3 is known IN ADVANCE to pass in its entirety, so the
      threshold is unexercised, disclosed piecewise but never as a conjunction;
      F-V5.1, the "not reverse engineered" rebuttal is vacuous rather than false.
      V6 clean, nothing downstream moved.
