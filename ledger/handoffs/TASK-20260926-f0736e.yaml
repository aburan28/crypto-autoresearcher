    - wdag.jsonl.gz and ann.jsonl.gz -- the certificates (BR-6)
    - seal.txt -- sha256 of rederivation.json, wdag.jsonl.gz and ann.jsonl.gz, and the UTC time, written before report.yaml
    - code/ -- your implementation source
    - report.yaml -- method, commands run, self-test results, ambiguities, missing systems with reasons, the BR-12 self-check, and the J6 verdict with its basis; no comparison with anything you did not compute
