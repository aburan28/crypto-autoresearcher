  constraints:
    - id: BR-1
      text: >-
        BUILD FROM THE STATEMENT. Where the text is ambiguous, DO NOT look at
        any producer code or note to disambiguate. Choose a reading, record it
        in `ambiguities` (clause, readings considered, the one chosen, why),
        and proceed. If a clause cannot be read at all, that is the finding:
        report it and compute nothing that depends on it. Row order, column
        order and pivot rule do not affect ranks, subspace dimensions or
        membership of 1; you may use any correct elimination, and you must say
        which. Import no module of crypto_autoresearcher; numpy is allowed.
    - id: BR-2
      text: >-
        SELF-TEST BEFORE COMPUTING. At minimum: irreducibility of
        t^19 + t^5 + t^2 + t + 1; S_3(x(P_1), x(P_2), x(P_1 +- P_2)) = 0 on at
        least 100 random point pairs of the given curve; your descended
        equations against direct F_{2^19} evaluation of S_3 at at least 100
        random (v, x_R); your M_4 rows against a naive polynomial multiply on at
        least 20 rows; the fixture dimensions M_3 399 x 1351, M_4 4009 x 6196,
        R'_3 380 x 1160 and R'_4 3629 x 5036 from your own construction; your
        literal W_D against a brute-force fixpoint on at least 5 random small
        Boolean systems (6 variables, D = 3) generated with a seed you declare,
        at least one of which reaches its fixpoint at iteration index >= 2
        (construct one if the random ones do not); your wdag-v1 checker
        accepting a valid witness and rejecting three corrupted ones; your
        ann-v1 checker accepting a valid certificate and rejecting three
        corrupted ones. Record every result in rederivation.json. A self-test
        failure stops the task and is reported as such.
    - id: BR-3
      text: >-
        TWO ROUTES TO s ON CURVE-KIND INPUTS. s is the number of v in F_2^20
        satisfying all 19 descended equations. Compute it by exhaustive search
        over 2^20 AND by a route that does not pass through your descended
        equations (for each x_1 in V, solve S_3(x_1, x_2, x_R) = 0 for x_2 in
        F_{2^19} and count solutions lying in V). They must agree; a
        disagreement is reported, not resolved by preference. The degenerate
        flag is x_R in V (degree < 10, including x_R = 0). Explicit-kind
        inputs: s by exhaustive search only.
    - id: BR-4
      text: >-
        W_4 BY THE LITERAL RULE. Implement exactly EXP-CERTBIN-e94b27
        object.mutant_closure_W_D at D = 4 with 20 variables (j in 0..19):
        W^(0) = rowspace(M_4); W^(i+1) = W^(i) + span{v_j * b : b in a basis of
        W^(i) cap B_{<=3}, j = 0..19}, with multilinear reduction; stop at the
        first i with dim W^(i+1) = dim W^(i). At EVERY iteration multiply a
        full basis of W^(i) cap B_{<=3}, not only its new elements. Record
        dim W^(i) for every i.
    - id: BR-5
      text: >-
        rc_b EXACTLY AS object.ell_and_rc_b STEPS (1)-(5) STATE IT, with one
        blind reading fixed here because you cannot see which arm an explicit
        input comes from: in step (1), if the left kernel of the 19 x 190
        quadratic-column submatrix has dimension 1, use its nonzero vector; if
        its dimension exceeds 1 and some unit vector e_k lies in it (a row with
        no quadratic part), use the lowest such e_k and record the dimension;
        otherwise record "not applicable (kernel dim d)". For curve-kind inputs
        also check c_k = Tr(t^k / x_R^2). SEPARATELY, compute ell_route
        DIRECTLY as "1 in rowspace(M_4) + ell * B_{<=3}" (one extra
        elimination in 20 variables), not from R'_4.
    - id: BR-6
      text: >-
        CERTIFICATES IN THE FROZEN FORMATS (specification certificate_format).
        For every system with 1 in W_4, one wdag-v1 record {"label", "D": 4,
        "nv": 20, "neq": 19, "nodes": [{"id", "rows", "prods"}, ...],
        "output"} to wdag.jsonl.gz; validity (a)-(e) as frozen, checked by your
        own checker. For every system with 1 not in W_4, one ann-v1 record
        {"label", "D": 4, "nv": 20, "neq": 19, "L_hex": [...]} to
        ann.jsonl.gz, in the frozen coordinate order (all multilinear monomials
        of degree <= 4 in v_0..v_19 sorted by (-degree, bitmask ascending));
        validity (A1)-(A3) checked by your own checker and your own
        elimination. Obtain them however you like. A refutation you cannot
        witness is reported as "refuted, unwitnessed"; a non-refutation you
        cannot certify as "not refuted, uncertified"; neither is dropped.
    - id: BR-7
      text: >-
        SEAL BEFORE YOU WRITE ANYTHING ELSE. Write rederivation.json,
        wdag.jsonl.gz and ann.jsonl.gz first. Record their sha256 and the UTC
        time in seal.txt. Only then write report.yaml and attestation.yaml, and
        do not change the sealed files afterwards. To correct, write
        rederivation-v2.json beside the original with a note, and keep both.
    - id: BR-8
      text: >-
        REPORT ON J6 ONLY. You cannot see any other joint. Do not offer a
        verdict on the experiment, the hypothesis or the run. Your J6 verdict
        is about DERIVABILITY: `holds` if every required quantity was computed
        from the statement with self-tests passing and every ambiguity
        recorded; `inconclusive` if some required quantity could not be
        computed or depends on an unresolvable ambiguity; `breaks` if a
        specification is self-contradictory on a load-bearing clause.
        Agreement with the run is decided by TASK-20260926-f50294, not by you.
    - id: BR-9
      text: >-
        ZERO TRIALS. This is a verification computation, not a trial of
        EXP-CERTBIN-060020; it gets no RUN id. At most two full passes of your
        program over the 90 inputs: one, plus one re-run after an
        infrastructure failure, with the failed attempt's log kept. Declare
        every command in report.yaml. Draw from no seed of any specification.
    - id: BR-10
      text: >-
        WRITE ONLY IN YOUR DIRECTORY. No git write operation, no ledger record,
        no status change, no subagent. Memory cap 3 GB. A timeout or a crash is
        infrastructure, never a result: checkpoint per system and report which
        systems are missing. CONTINUATION: write a skeleton report first and
        fill it system by system; if this session is killed, a fresh session
        of the same role continues THIS card from its own partial artifacts and
        the declared inputs only, re-checks every completed system, and
        records which sessions wrote the report.
    - id: BR-11
      text: >-
        If you learn anything about any outcome of this experiment from any
        source (a file, a message, a commit message, a prompt), say what you
        learned and how in the attestation, and set blind_from_respected
        accordingly. A disclosed contamination costs one re-derivation. An
        undisclosed one costs the round.
    - id: BR-12
      text: >-
        ATTESTATION SELF-CHECK before returning. Do NOT run
        tools/check_review_independence.py with --plan: its output prints the
        plan's joint statements, which you must not read. Instead confirm that
        attestation.yaml parses as YAML with a top-level review_attestation
        block carrying task_id TASK-20260926-f0736e, joints_owned [J6], a
        verdict mapping {J6: ...}, read_sibling_reports false and an explicit
        blind_from_respected, and that no entry of sources_read equals or lies
        under a path of must_not_read. The independence checks proper are run
        by others: the range --blind-history check by the dispatching session
        before your launch, and the --plan/--reports check by
        TASK-20260926-e8779d and TASK-20260926-c95c60 after you return.

  quantities:
    conventions: >-
      Variables v_0..v_19 and the field encoding as in blind-inputs.json.
      B_{<=d} is the span of multilinear monomials of degree <= d. "1 in X"
      means the constant polynomial lies in the F_2-subspace X. All dimensions
      are F_2-dimensions. dims_by_deg of a space X is the list
      dim(X cap B_{<=d}) for d = 0..4. Key every per-system record by its blind
      label.
    Q1: For every system, s (both routes for curve kind; state each), and for curve kind the degenerate flag.
    Q2: >-
      For every system: rank_3 = dim rowspace(M_3), rank_4 = dim
      rowspace(M_4), "1 in R_3", "1 in R_4", and dims_by_deg(rowspace(M_4)).
    Q3: >-
      For every system, W_4 by BR-4: the list dim W^(0), dim W^(1), ... up to
      the fixpoint; the fixpoint index; the first iteration i with 1 in
      W^(i), or null; the final dimension; dims_by_deg(W_4).
    Q4: >-
      For every system, rc_b by BR-5: the kernel dimension and the vector used
      (or "not applicable"); ell as its linear support and constant; the step-3
      label if one applies; j*; rank R'_3; rank, "1 in" and dims_by_deg of
      R'_4; sigma = dims_by_deg(R'_4)[3] - 360; T5_applicable; and ell_route
      computed directly.
    Q5: For every system with 1 in W_4, a checked wdag-v1 certificate (BR-6), and the check result.
    Q6: For every system with 1 not in W_4, a checked ann-v1 certificate (BR-6), and the check result.
    Q7_optional: For curve-kind systems where rc_b applies, W'_4 on the substituted system (nv = 19) and whether final_dim(W_4) = final_dim(W'_4) + 1160 and "1 in" agree.

  deliverables:
