        Run only packages reserved in trial-plan-v2-r3.json, only through the
        r3 wrapper, only in plan order. Never invoke v2_run_wrapper.py,
        a1_run_wrapper.py, the r1 wrapper or the r2 wrapper. Never use a
        retired id (124).
    - id: R3P-2
      text: >-
        THE REPAIRED GATE (PS-4; SE-4 with SF-4). G1 first. REG-1 (d-parsed)
        is evaluated by the r3 wrapper before it admits G2, and its complete
        output, with solver-events.json quoted in full, is quoted verbatim in
        execution-report-v2-r3.yaml whatever it finds (RC-7; SE-4 (e)). Any
        post-gate package runs only when G1..G4 each have run_status
        completed_valid with gate_pass true AND REG-1 passed (R-7).
        - A REG-1 failure ends the stage before G2. It is read as "the repair
          layer is not behaviour-neutral at 4111, or the pipeline is
          non-deterministic beyond the SSF re-solve rule", naming both, never
          as a result. A REG-1 (b) difference in any instructions_callgrind
          field is read by CG-4: REG-1 fails as frozen; the lineage STOPS at an
          impediment; G1 is never re-run to obtain a pass; no exclusion is
          added.
        - A failure of G1..G4 ends the stage at the gate, classified per
          DEC-20260923-e788a1 AC-5 unchanged. A frozen-checker failure
          attributable to the callgrind child's cap read-back is read by CC-3
          (an envelope outcome at S-3; in a gate package the lineage STOPS).
        - Neither is ever a mathematical result about the quotient. No
          contingency id is ever used for a gate package. The repair of a
          repair is a successor task under a new Coordinator decision.
    - id: R3P-3
      text: >-
        THE RE-SOLVE RULE (SE-2 with SF-1, SF-2, SF-3; SC-11), applied by the
        phase-A-bound layer, by code and never by hand, to every classified
        solve of every package. The Executor never re-runs a package, a target
        or a solve by hand, and never selects among attempts. Every attempt is
        preserved (.ssf-attempt<k> files and solver-events.json). A
        consistency violation (SE-2 (4), SF-2 (b)) ends that package failed as
        implementation_error, never a result. CC-8 (c): an SE-3 consistency
        raise after an ok attempt k >= 2 whose callgrind child already ran is
        an implementation signal for a new decision, never evidence.
    - id: R3P-4
      text: >-
        THE CALLGRIND SITE (CG-2; CG-3; CC-4; VA-6 (c)). S-3 is never
        re-solved. Its records are written by the layer into solver-events.json
        and counted in the manifest; they are RECORDED AND REPORTED ONLY and
        gate nothing. A non-ok callgrind child leaves instructions_user null;
        that cost measurement is reported missing, never estimated and never
        re-measured.
    - id: R3P-5
      text: >-
        MEMORY ENVELOPE, MACHINE PROTECTION (AC-1; RC-10; VA-10), identical to
        v2: child RLIMIT_AS 10737418240 set in the child and read back with
        getrlimit into each manifest; a child that cannot set it refuses to
        start; driver RSS at most 1 GiB, checked before each launch; one
        memory-heavy process at a time; task envelope at most 11 GiB; msolve
        -t 1; the lowered cap if the dispatcher's guard threshold is below
        12.0 GB, recorded; the full A-6 envelope tuple on every not_measured
        row; the A-7 pre-declared early stop. Watchdogs are exactly
        trial-plan-v2.json's (R-9). Every SE-2 attempt has the same cap and
        per-target timeout as attempt 1.
    - id: R3P-6
      text: >-
        LAUNCH RULE (PS-5; CORR-20260923-fb1be8 XD-2). Each package is launched
        directly through the r3 wrapper with no outer guard (no shell
        `timeout`, no wrapper around the wrapper) that the plan does not
        declare. The dispatching session's memory guard is declared in the task
        receipt before launch, with its threshold.
    - id: R3P-7
      text: >-
        SEGMENTS. Segment 1 is the gate (G1, REG-1, G2, G3, G4); later segments
        are contiguous blocks of post-gate packages in plan order. At each
        boundary the Executor appends a progress checkpoint to
        execution-report-v2-r3.yaml (packages completed, statuses, SSF counts,
        callgrind-site counts, next package id) and may renew the lane claim
        at epoch + 1. A segment never reorders, skips or repeats a package, and
        a checkpoint is never a result. On a wall-clock or claim expiry the
        Executor records every planned package not yet run as not_attempted
        with the reason, and returns.
    - id: R3P-8
      text: >-
        TIMEOUTS, OOM, CRASHES, positive_dimensional and
        degenerate_parametrisation outcomes (including an SSF class that
        persists after the last allowed attempt, and resolve_cap_reached) are
        recorded with their class and envelope tuple. They are never measured
        non-decompositions or evidence about D (AGENTS.md core rule 5; EC-7).
        Every per-cell watchdog that fires after a target with at least one
        re-solve is flagged watchdog_after_resolve; its not_attempted targets
        are never evidence (SF-2 (d); SJ-6).
    - id: R3P-9
      text: >-
        MANIFESTS (PS-5 manifest; RC-2; RC-3; SE-2 (5); SC-11 (b); HR-8; CG-3;
        CC-4). Each records: task_id TASK-20260924-4351ac (never any of the six
        R-13 ids); protocol_version "2-r3"; the amendment blocks for the nine
        VA-1 files with id, sha256 and decision or standing; derived_from;
        code.phase_a_commits literally (TASK-20260923-0fa03f
        fb4597b2014b44a0c9528d48d3ab9997b46f038c; TASK-20260924-f1fb0e phase
        A, with its source); clean flags for the implementation trees;
        resources.pari_stack with the start and exit read-backs and the
        redirection and SE-3 read-back; the `solver_events` block per site
        with the callgrind-site counts; PYTHONHASHSEED "0" read back from the
        driver process; gate.regression_REG-1 from G2 on; the child getrlimit
        read-back, threads executed, host RAM and swap; watchdogs and their
        equality with trial-plan-v2.json's; dependency versions with cypari2's
        version; and the inference block (requested policy
        executor-implementation, the resolved binding as the session provides
        it, fallback_used). No model id is invented.
    - id: R3P-10
      text: >-
        REPORTING (SE-2 (7); SF-2 (e); SC-4; HR-8 and CG-3 extended).
        execution-report-v2-r3.yaml tabulates, per package and per cell, SSF
        attempts per clause (i)-(v), re-solves, solves still SSF after the
        last attempt, every resolve_cap_reached and every
        watchdog_after_resolve, with their tags; the callgrind site separately
