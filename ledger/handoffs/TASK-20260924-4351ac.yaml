        naming any tag whose .ms.out was not retained. A violation is recorded
        verbatim and routed to review (SJ-5); it triggers no re-solve,
        reclassification or exclusion. These tables are reported, never tuned,
        and never read as information about D.
    - id: R3P-11
      text: >-
        CEILING AND CONTINGENCY. At most 31 packages under this card (27
        planned + 4 contingency), and at most 48 in the lineage over the eight
        plans (R-11; 44 reserved). A contingency id only under R-12 (within
        this plan; never for a gate package). Reaching a ceiling before the
        plan completes is an impediment for a new decision, never a result.
    - id: R3P-12
      text: >-
        WRITE ONLY INSIDE write_scope. Every v1, v2, v2-a1, r1, r2 and r3 layer
        path, and RUN-GFPN-ac4487 and RUN-GFPN-3377f1, are READ-ONLY. No run
        directory is overwritten. The r3 layer and plans are bound by phase A
