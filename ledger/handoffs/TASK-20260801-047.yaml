handoff:
  id: TASK-20260801-047
  from: coordinator
  to: idea-generator
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-025
  objective: >-
    Propose a fresh, falsifiable direct smoothness measurement of HEUR-DS-1 that
    repairs RV012-A1, RV012-A2, RV012-B2 and RV012-B3 by calibrating every
    distributional threshold against a measured null at the actual finite X,
    enumerating i < j, and factoring the declared ENC-B integers directly.
  inputs:
  - AGENTS.md
  - docs/inventor-protocol.md
  - docs/target-result-profile.md
  - ledger/goals/GOAL-ECDLP-001.yaml
  - ledger/decisions/DEC-20260801-011.yaml
  - ledger/hypotheses/H-SMTH-001.yaml
  - experiments/EXP-SMTH-001/specification.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-022/reviews/TASK-20260801-012/contract_review.yaml
  - experiments/EXP-DS-001/implementation/ds001_driver.py
  constraints:
  - >-
    Treat every predecessor as immutable and read-only. Do not edit EXP-SMTH-001,
    EXP-DS-001, any predecessor hypothesis, evidence, decision, or goal record.
  - >-
    A new experiment id and a new hypothesis id are required. Propose them but do
    not allocate official status; the Coordinator alone owns state transitions.
  - >-
    Separate the pre-data branch structure and threshold-substitution rule from
    measured-null numeric calibration, with an explicit anti-tuning safeguard.
  - >-
    Specify the exact object, actual X, sample count, i < j enumeration, encoding,
    null construction, factorization certificates, seeds, controls, metrics,
    budget, stopping rules and required artifacts.
  - >-
    Controls before belief: calibration precedes the real measurement and the
    downstream factorization and statistic code paths are identical across arms.
  - >-
    Include dominated_by and a quantitative sota_delta. Make no breakthrough,
    cost, exponent, crypto-scale, support, closure or impossibility claim.
  - No run, no official status transition and no commit.
  deliverables:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/tasks/TASK-20260801-047/design_proposal.yaml
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/tasks/TASK-20260801-047/design_proposal.yaml
  archived_by: TASK-20260801-048
  inference:
    policy: research-deep
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 1800
    memory_gb: 2
    maximum_runs: 0
  completion_gate:
  - >-
    YAML parses; the proposal is precise enough for Coordinator translation into
    a frozen contract; all predecessor defects are addressed explicitly; and no
    execution or official state mutation occurs.
