handoff:
  id: "TASK-20260725-002"
  from: "coordinator"
  to: "coordinator"
  objective: >-
    Commit exactly the TASK-20260725-001 frozen toy validation protocol artifacts
    as an isolated Coordinator snapshot before any independent review reads them.
  uncertainty_reduced: >-
    Whether the reviewer receives an immutable, hash-bound protocol package whose
    bytes cannot change after the snapshot seal.
  inputs:
    - "the two exact TASK-20260725-001 artifacts"
  constraints:
    - "Run alone; stage only the declared producer artifact paths and the snapshot receipt; preserve every unrelated dirty file."
    - "Record commit_sha, parent_sha, and SHA-256 for every committed path in the receipt after the commit; do not put a commit's own SHA inside that commit."
    - "Verify the producer inference receipt records the authorized fallback metadata before archival."
    - "Stop on any integrity failure; a failed snapshot gate is an evidence-integrity failure, not a negative result."
  deliverables:
    - "snapshot_commit_receipt.json"
  artifact_paths:
    - "coordination/goals/GOAL-ECDLP-001/batches/BATCH-003/archives/TASK-20260725-002/snapshot_commit_receipt.json"
  archived_by: "TASK-20260725-002"
  inference:
    policy: "coordinator-ultra-code"
    fallback_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 300
    memory_gb: 1
    maximum_runs: 1
  completion_gate:
    - "The post-commit verifier accepts exact paths, parent, message IDs, reachability from HEAD, and SHA-256 values."
  return_format: "Coordinator snapshot archive receipt JSON."
