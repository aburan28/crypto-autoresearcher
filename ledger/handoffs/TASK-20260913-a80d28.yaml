    - >-
      No Stage 1, Stage 2, or Stage 3 authorization or work. No gamma
      computation, shift-polynomial construction, lattice, LLL/BKZ, planted
      instance, p-ladder, scalar recovery, ECDLP solve, or ECDLP interpretation.
    - Observations only. Write no evidence, decision, hypothesis, or goal record.
    - Do not commit, push, merge, or create or update a PR.
