handoff:
  id: TASK-20260802-101
  from: coordinator
  to: executor
  objective: 'Retrieve the primary sources underlying GOAL-MLKEM-003''s standing findings and adjudicate
    KN-FIND-012, KN-FIND-013, KN-FIND-014 and KN-FIND-016 against the authoritative current text and code.
    Priority order: (1) ePrint 2022/1750 current revision (Carrier-Meyer-Hilfiger-Shen-Tillich) including
    its revision history, checked against the vendored HAL copy hal-05406481 the findings were derived
    from; (2) NIST FIPS 203; (3) Ducas-Pulles (ePrint 2023/302) on the dual-attack heuristics; (4) MATZOV
    2022 report; (5) Guo-Johansson dual attack. Then answer three adjudication questions, each with a
    verdict from {confirmed_in_current_source, corrected_by_authors, contradicted, unretrievable, indeterminate}
    and a quoted locus: Q1 does the Table C.2 CN/Kyber-512 log2(Tsample)=143.30 cell still read 143.30
    in the current revision; Q2 does the Pwrong=FFT/k_fft vs Pgood=raw score-scale asymmetry still hold
    at the current head of kevin-carrier/CodedDualAttack; Q3 does any retrieved source report Pwrong at
    or near the aligned Pgood operating threshold, i.e. the residual measurement KN-OPEN-016 names.'
  uncertainty_reduced: Whether the program's four standing Carrier findings are novel observations, already-corrected
    errata, or misreadings of a superseded revision -- a question that was structurally unanswerable while
    the network policy blocked every primary source, and that determines whether the campaign has anything
    to report.
  inputs:
  - knowledge/findings/KN-FIND-012.md, KN-FIND-013.md, KN-FIND-014.md, KN-FIND-016.md
  - knowledge/open-problems/KN-OPEN-016.md
  - ledger/evidence/EV-MLKEM-011.yaml, EV-MLKEM-012.yaml, EV-MLKEM-013.yaml, EV-MLKEM-015.yaml, EV-MLKEM-016.yaml
  - experiments/EXP-MLKEM-010/vendor-lock/ (the HAL PDF and optimizer pickle the findings were derived
    from)
  - ledger/goals/GOAL-MLKEM-003.yaml and DEC-20260731-006 (the pause decision this batch resumes)
  constraints:
  - Never fabricate a command, output, timing, statistic, citation, or run (AGENTS.md rule 9).
  - Every retrieved source records url, http_status, retrieved_at (UTC), sha256, and byte size. A source
    that could not be retrieved is recorded as unretrieved with its error, never paraphrased from memory.
  - Recollection is not evidence. A claim of the form 'I recall this is known' may be recorded only as
    an explicitly labelled unverified recollection, and may never adjudicate a finding in either direction.
  - Toy/estimate-tier results never become crypto-scale claims (AGENTS.md rule 7). No ML-KEM break claim.
  - Write only inside the declared write_scope. Do not edit prior batch artifacts or any ledger record.
  - Vendored source bytes go under inputs/MLKEM-DUAL-SOURCES-20260802/ ONLY. Do not modify experiments/EXP-MLKEM-010/vendor-lock/,
    which is an immutable run artifact.
  - 'Large binaries: record provenance and the extracted text/region actually used; do not commit a multi-megabyte
    PDF when the adjudication needs one table.'
  - The comparison baseline is the exact artifact the finding was derived from (hal-05406481). State the
    revision identifier of BOTH sides of every comparison; a finding cannot be adjudicated against an
    unidentified revision.
  - If a source is unreachable, record it as unretrieved and continue -- an unreachable source is an infrastructure
    fact, never evidence for or against a finding (AGENTS.md rule 5).
  deliverables:
  - 'provenance.json: one record per attempted source with url, http_status, retrieved_at, sha256, bytes,
    revision_id, and retrieved|unretrieved'
  - 'README.md: what was vendored, why, and the exact reuse boundary'
  - 'fetch_sources.py: the exact retrieval script actually run'
  - 'source_adjudication.md: Q1/Q2/Q3 with verdict, quoted locus, and both revision identifiers'
  - 'adjudication_results.json: machine-readable verdicts'
  artifact_paths:
  - inputs/MLKEM-DUAL-SOURCES-20260802/provenance.json
  - inputs/MLKEM-DUAL-SOURCES-20260802/README.md
  - coordination/goals/GOAL-MLKEM-003/batches/BATCH-007/tasks/TASK-20260802-101/fetch_sources.py
  - coordination/goals/GOAL-MLKEM-003/batches/BATCH-007/tasks/TASK-20260802-101/source_adjudication.md
  - coordination/goals/GOAL-MLKEM-003/batches/BATCH-007/tasks/TASK-20260802-101/adjudication_results.json
  archived_by: TASK-20260802-102
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 3000
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
  - provenance.json exists and every entry carries a sha256 or an explicit unretrieved reason
  - each of Q1, Q2, Q3 carries a verdict from the declared enum plus a locus citation
  - no adjudication rests on unverified recollection
