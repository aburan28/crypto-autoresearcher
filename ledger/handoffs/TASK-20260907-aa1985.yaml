  constraints:
  - Not alone in the codebase. Preserve other agents and immutable archives; write only the six exact output files.
    Read compatible modules without editing shared code. Do not commit, push, change ledger status or claim independent
    review.
  - Verify all source bindings and the additive experiment approval. Archived partial code is a reuse starting point,
    not validated arithmetic. Keep historical source, report and deviations intact. Implement new code under this
    new task directory.
  - Complete actual algorithms, deterministic fixture generators, frozen controls, scalar-label isolation, charging
    and future run/artifact pipeline. Callback signatures, metadata lists and TODOs are not implemented obligations.
    Unwritten routine code is work to complete rather than a source ambiguity.
  - Zero scientific runs. Do not execute scientific fixture generation, candidate search, pairing/isogeny measurement,
    frozen scientific controls, collision census or timing matrix. Implement these functions without invoking them.
    Default CLI is help/dry-run and all scientific entry paths require a genuine future launch authorization.
  - At most 20 total synthetic or mocked test-case executions INCLUDING reruns, each at most10 seconds, aggregate120
