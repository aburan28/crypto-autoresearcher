    exact actual checks and durations.
  - Lock verification must check actual code/spec/plan/runtime/resource bindings and real authenticity against a
    separately trusted Coordinator authorization. Boolean approval fields and nonempty signature strings do not
    verify a lock. No lock, review verdict, signature or trust root is fabricated. Missing future trust input prevents
    launch and is reported separately from implementation completeness.
  - If a concrete mathematical ambiguity, absent required dependency or incompatible frozen rule prevents implementation,
    report the exact item promptly and continue independent obligations. Do not substitute parameters, algorithms,
    controls, sample counts, decision thresholds or scientific scope.
  - Routine wall/CPU estimates are advisory under AGENTS.md and docs/research-budget-policy.md. Memory8GiB and worker1
    remain machine protection, and fixed zero scientific runs and synthetic check allowance remain binding. No resource
    estimate or watchdog stop is scientific evidence.
  - No empirical observation, algorithm improvement, hypothesis conclusion, independent validation or run is claimed
    here. Mathematical implementation notes distinguish deductions used by the code, retrieved support and unverified
    assumptions.
  - Implement canonical full rational3-torsion kernel enumeration, all four normalized odd-degree Velu maps, exact
    duals and their normalization/isomorphism, j=1728 automorphism, eigenvalue sign, beta=phi o i o psi=[3lambda],
    coordinate conjugation and conductor3 certificate payload. Do not omit factor3 or replace the frozen level rule.
    The required independent mathematical review remains before measurement.
  - Inspect harness/isogeny_class.py velu_odd/velu_image for exact reuse and audit its half-kernel convention; do
    not infer correctness from existence. Implement full discovery/point-count/factor/search charges, all scalar
    arms binary/wNAF2..5/pinned library, baseline selection, timing repetition loops, paired floors, every control
    and full prospective report.
