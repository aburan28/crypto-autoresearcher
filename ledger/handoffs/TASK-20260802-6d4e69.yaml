handoff:
  id: TASK-20260802-6d4e69
  from: coordinator
  to: coordinator
  objective: Freeze a superseding experiment contract that (a) replaces the defective extrapolation law
    of EXP-PEC-6be870 with one that carries the fitted intercept, and (b) specifies the IMPL-B extension
    that removes the ell=101/103 definitional seam - both pre-registered before any new datum, with the
    NC2b self-validation criterion fixed in advance.
  uncertainty_reduced: Whether the repair of a defective estimator is itself specified tightly enough
    to be checkable, rather than being an after-the-fact adjustment of a number that reviewers rejected.
  inputs:
  - experiments/EXP-PEC-6be870/specification.yaml (the SUPERSEDED contract - reference it, never edit
    it)
  - experiments/EXP-PEC-6be870/runs/RUN-PEC-6be870-a/raw-result.json (fit.windows.*.intercept and the
    C-NULL block are the NC2b inputs; they are already committed at 49166fa5)
  - ledger/decisions/DEC-20260802-8227b9.yaml (the adjudication and its standing prohibitions)
  - Both BATCH-002 review reports
  constraints:
  - This is a SUPERSEDING contract under a new id. Do not edit EXP-PEC-6be870, its run, or any BATCH-002
    record. State explicitly in a supersedes block what is replaced (the extrapolation law and the primary-response
    definition) and what is carried unchanged (the counting unit, the instrument, the controls that passed).
  - 'PRE-REGISTER the corrected law: c = [log2(A) + gamma*log2(B_opt)] / sqrt(log2 p), with A the fitted
    intercept, and state precisely how the intercept''s own p-dependence is handled. The BATCH-002 red
    team argued the intercept scales with log p because poly_powmod performs 2*log2(p) squarings, worth
    about +2.678 bits from 2^40 to 2^256. Decide now whether that scaling is applied, and if so with what
    justification and what falsification condition - do not leave it to be chosen after the number is
    seen.'
  - 'PRE-REGISTER the NC2b self-validation gate: the corrected estimator, applied to the run''s own C-NULL
    object, must return c_null ~ 0.77 at NIST-I (the null''s measured per-entry cost is ~2^12.3 and its
    gamma_null ~ 0, so any correct estimator must recover roughly 12.3/16). State the acceptance tolerance
    now. If the corrected estimator fails its own null, it is as defective as the one it replaces and
    must be reported as such rather than tuned.'
  - 'PRE-REGISTER NC2a: IMPL-B (Karatsuba) over ell 103..211 at the sample count you fix now, so the primary
    response is min(IMPL-A, IMPL-B) across the ENTIRE fitted range with no definitional seam. State the
    pre-registered expectation the reviewers named - that the seam-free min(A,B) slope must fall to <=
    0.9332 (IMPL-A''s homogeneous exponent) and that the W-ALL quadratic coefficient must move toward
    zero - and state what it means if it does not. A prediction that cannot fail is not pre-registration.'
  - 'Carry forward the controls that passed unchanged, and FIX the coverage defect the Validator found:
    C-NULL must cover the full fitted ell range this time, not stop at 101. The BATCH-002 execution order
    caused that gap by running the null before the extension was acquired; order the steps so it cannot
    recur.'
  - 'Address Validator finding F-4 explicitly: shared Cantor-Zassenhaus seeding made gamma_A and gamma_B
    non-independent, reducing C-ALT.2 to a test of the shared multiplication routine. Decide whether this
    contract separates the seeds, and record the trade - separate seeds buy independence but lose the
    paired variance reduction.'
  - Record that ell=97 remains absent from the superseded run and state whether this contract re-acquires
    it. The Validator measured its effect at 0.0013 on W-MID, so this is a completeness question, not
    a numerical one.
  - 'Declare stopping rules, budget, artifacts, validity statuses, the claim tier ceiling, and an explicit
    non-claims section. NC2b changes an estimator, not a measurement: it cannot by itself move any claim
    about the attack.'
  - Restate the standing prohibitions from DEC-20260802-8227b9 inside the contract so the Executor cannot
    cite forbidden values.
  - Assess docs/inventor-protocol.md Section 8 applicability and record the determination with its reason
    rather than omitting it.
  deliverables:
  - experiments/EXP-PEC-49c773/specification.yaml (frozen, approved, with a supersedes block)
  - opening_report.md stating what is superseded and why, the corrected law, the NC2b self-validation
    gate, the NC2a pre-registered expectation, and the Section 8 determination
  artifact_paths:
  - experiments/EXP-PEC-49c773/specification.yaml
  - coordination/goals/GOAL-P13-001/batches/BATCH-003/tasks/TASK-20260802-6d4e69/opening_report.md
  archived_by: TASK-20260802-b33bd4
  goal_id: GOAL-P13-001
  batch_id: BATCH-003
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: true
    independent_session_required: false
  budget:
    wall_clock_seconds: 1800
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
  - specification.yaml exists, is marked approved, carries a supersedes block naming EXP-PEC-6be870, and
    pre-registers the corrected law, the NC2b self-validation tolerance, the NC2a expectation and its
    failure meaning, full-range C-NULL coverage, and the F-4 seeding decision.
  - The opening report records the Section 8 determination and the standing prohibitions.
