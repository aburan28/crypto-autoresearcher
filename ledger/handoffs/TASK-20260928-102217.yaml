  title: >-
    Design and, if complete, approve the experiment for IDEA-20260928-4e2be7
    (collision harvest and the structural-excess census kappa) with
    IDEA-20260928-ce3ab0 Stage 0 (the generic collision floor, re-read on
    committed rows) as its calibration
  objective: >-
    Convert the selected proposals into specified hypotheses and frozen
    experiment contracts under RQ-PFDR-ae2fba, following
    .claude/skills/design-experiment/SKILL.md steps 2-5: hypothesis records,
    experiments/<EXP-ID>/specification.yaml with empty amendments/ and runs/,
    an approval decision under the standing user authorization of AGENTS.md
    when (and only when) every contract field is complete, and the executor
    handoff. Selection is made: the user asked (2026-09-28) for research into
    algebraic structure in prime-field factor bases, and IDEA-20260928-4e2be7
    is the proposal that measures it directly; IDEA-20260928-ce3ab0 Stage 0 is
    zero-compute and fixes the generic floor that kappa is read against.
  uncertainty_reduced: >-
    Whether any x-structured prime-field factor base (multiplicative coset,
    Dickson/composed-map, small_x) produces x-key collisions in excess of a
    matched random base (kappa > 1) that carry informative relation rank --
    the only non-generic relation source left open for structure by
    KN-FIND-007 and IDEA-20260928-ce3ab0 -- and whether the measured mitm
    exponents sit on the generic floor (1/2)sqrt(rN) as ce3ab0 predicts.
  inputs:
    - ledger/proposals/IDEA-20260928-4e2be7.yaml (selected; its minimal_test, controls, predictions and falsification_conditions are the design's starting point)
    - ledger/proposals/IDEA-20260928-ce3ab0.yaml (Stage 0 calibration; its section (D) numerical content)
    - ledger/proposals/IDEA-20260928-fd7f5d.yaml (not selected; may share the dickson builder)
    - ledger/questions/RQ-PFDR-ae2fba.yaml (its constraints bind: half-cells excluded, matched random base and rho mandatory, failed_infrastructure is never evidence)
    - ledger/handoffs/TASK-20260928-9c44f2.yaml (the ideation handoff)
    - src/crypto_autoresearcher/index_calculus/README.md sections 1-5 and results/*.jsonl.gz (committed rows; the harvest-off regression fixture)
    - src/crypto_autoresearcher/index_calculus/{tails,decompose,solver,factor_base,linalg,curve,__main__}.py (the engine the executor extends; no new solver)
    - templates/research-records.md (hypothesis, experiment, handoff, coordinator_decision schemas)
    - docs/research-budget-policy.md, docs/claims-and-verification.md, docs/inventor-protocol.md sections 3 and 6
  constraints:
    - >-
      RESERVED IDS (drawn by tools/allocate_id.py and confirmed free; you have
      no shell): hypotheses H-PFDR-0cc7e8, H-PFDR-4765e4; experiments
      EXP-PFDR-7c8bf2, EXP-PFDR-1b78f7; decisions DEC-20260928-b3afc2,
      DEC-20260928-ab2d31; handoffs TASK-20260928-51b8c8,
      TASK-20260928-f15632. Use one hypothesis/experiment pair if a single
      contract carries both stages cleanly, two if the floor re-analysis and
      the kappa census need separate outcomes; leave unused ids unused.
    - >-
      DISCLOSURE OF A PRE-PROTOCOL OBSERVATION. Before this design, the
      top-level session made an unrecorded scratch count (no run record, not
      evidence): for m=3 default |F|, h=2 tables at 20/24/28 bits, 4 curves
      each, the number of extra tails sharing an x-key divided by E^2/N was
      1.00/1.07/1.01 (small_x), 0.71/0.91/0.98 (random), 0.68/0.97/1.05
      (subgroup). The generator's null (kappa_TT = 1) was pre-committed
      independently. Record this disclosure in the hypothesis, keep the
      pre-registered prediction as the generator wrote it, and make the TT
      census at those cells a replication rather than a discovery.
    - >-
      NO SOLVER CHANGE, EXACT BASELINE. The executor extends the existing
      engine (collision harvest, a dickson base builder, a j=0 control-curve
      option, the known-log small-multiples control arm, per-class counters).
      With harvest off every committed row must be reproduced exactly
      (attempts, relations, rank, s3_solves, table_s3_solves, target_ops,
      la_ops under the recorded la_pivot); that reproduction is a frozen
      regression and a precondition for reading any harvest-on number.
    - >-
      CERTIFICATES. Every harvested row is re-verified as a group identity
      before it enters elimination, and every recovered logarithm is checked
      against kP = Q (docs/claims-and-verification.md). A harvested row that
      fails verification invalidates the run, never the hypothesis.
    - >-
      MACHINE. One 4-core, 15 GB cloud container; state memory and
      concurrency limits (machine protection) and treat time estimates as
      advisory (docs/research-budget-policy.md). Timeouts, OOM and crashes
      are failed_infrastructure.
    - >-
      CLAIM TIER. Toy scale (12..32 bits); no statement about deployed
      curves; a kappa-positive outcome is a lever candidate for independent
      review, not a result; no status change of any existing hypothesis.
