  review_plan:
    claim_under_review: >-
      As its producer stated it (report.md, Band census consequence): within
      the frozen 12-row registry, the measured ladders (p <= 16777259 ok
      cells; the 2^26-class tail prime checkpointed resource_exhaustion with
      values preserved), and the frozen probability normalisation -- NO
      natural coordinate statistic is simultaneously PGL_2-stable and
      spectrally distinct from the random-set level; every structured
      additive statistic (R01 interval, R02 AP, R03/R03B popcount level,
      R04 base-3, R05 base-10, R09 low-bit) is PGL_2-unstable (verdict
      artifactual per the frozen rule); the stable multiplicative-coset rows
      R06/R08 sit at the random-set Parseval level (lambda ~ 0.50, C02A
      0.4996, R08 exactly 0.5000); R07 (index-5 cosets, 0.5709 +- 0.0349 on
      4 points) is the only stable-above-Parseval candidate; R03 reproduces
      the KN-FIND-ffe1df 0.39 measurement marginally (0.4191, band edge
      0.42).
    coordinator_prior: >-
      Written before any analysis record of this round exists. I expect the
      review to CONFIRM the normalisation-INVARIANT core of the claim --
      (a) the Gauss-flat coset reading: for R08, v = 1_QR/|QR| gives
      |vhat(k)| = |G(k) - 1|/(2|QR|) ~ p^{-1/2} for EVERY k != 0 with
      |G(k)| = sqrt(p) exactly, so lambda = 1/2 is a DERIVABLE fact, not
      just a measurement; (b) the coset-vs-C02 level comparison and the
      PGL_2 stability DELTAS are invariant under any uniform rescaling of
      the transform, so they survive the disclosed normalisation conflict
      with commit 4785243985. I expect the review to find the GATE VERDICTS
      (corner/learning open-blocked, thresholds 1/4 and 1/6) NOT durable:
      they are convention-relative, and the concurrent unitary-normalisation
      edit shifts every lambda by -1/2 and would flip them. I expect it to
      flag as weaknesses: the R03 reproduction is marginal (point estimate
      0.4191 against the 0.42 edge, +-2SE interval overshoots); the
      hypothesis's pre-registered prediction "interval and AP lambda <=
      0.05" was falsified at the measured range (0.0806) and "coset
      lambda near 0" was flatly falsified (0.50); the frozen-rule term
      "artifactual" overstates the mathematical content -- PGL_2
      instability means lambda is an embedding property, which voids the
      row from the gate table per the frozen rule but does NOT by itself
      prove no construction can use the statistic at a fixed embedding.
      Net expected transition: weaken (scoped to the registry, ladders,
      and normalisation-invariant readings), strength strong (exact
      deterministic computation, internally replicated controls, checker
      re-derivations), with the independent adversarial review STILL OWED
      because this round runs self-reviewed under the runtime outage.
    joints:
      - joint: >-
          J1 TRANSFORM CORRECTNESS: the measured l1_nontrivial values are
          the exact nontrivial additive L1 norms of the frozen constructions.
        assigned_to: TASK-20260921-4888d4's checker.py (already executed; this
          round re-reads checker-report.json rather than re-running)
        attack_plan: >-
          The checker already attacked this joint three ways: naive O(p^2)
          DFT at the smallest ladder prime (two rows, agreement 1e-14), a
          second independently structured chirp-z at a mid prime (4e-16), and
          the vhat(0)=1 invariant across all 406 ok cells. Residual attack:
          confirm the checker's independent chirp-z genuinely differs in code
          path (padding-length policy, per-index placement) and that the
          naive-DFT primes are registry primes, not synthetic ones.
        breaking_artifact: >-
          A disagreement beyond 1e-9 between checker and census values, or a
          vhat0 != 1 cell, would void the corresponding rows.
        breaking_artifact_outcome: none observed
      - joint: >-
          J2 CONTROL SEMANTICS: the four frozen controls were evaluated
          with the semantics the frozen text specifies, including the R03
          reproduction band.
        assigned_to: this review round (in-session)
        attack_plan: >-
          Re-read the frozen band text ("fitted lambda in [0.36, 0.42]")
          against the implemented check. KNOWN DEVIATION TO ADJUDICATE: the
          first implementation used the stricter +-2SE-interval-inside-band
          reading, failed at 0.4191 (+-2SE [0.4068, 0.4314]), and was
          corrected to the frozen point-estimate semantics. Attack: is the
          point-estimate reading genuinely the frozen one, and is the
          marginality adequately disclosed everywhere (fits control_notes,
          manifest, report, PR)?
        breaking_artifact: >-
          If the frozen text is better read as interval-inside-band, the R03
          control FAILS, the census is void, and every reading is
          infrastructure-only.
        breaking_artifact_outcome: >-
          Adjudicated in analysis.md: the frozen text says "fitted lambda ...
          in [0.36, 0.42]" (specification controls list and success_criterion,
          and hypothesis baseline_embedding "Fitted lambda ... in [0.36,
          0.42]"), which names the fitted value, not its interval; the
          point-estimate semantics is the frozen one. The marginality is
          disclosed in fits.json control_notes, the manifest, the report, and
          the PR body. Residual honest reading: the reproduction is marginal
          and any successor promotion must treat 0.4191 as band-edge, not
          comfortable.
      - joint: >-
          J3 INVARIANCE: the readings promoted as durable (cosets at the
          random-set level; PGL_2 stability deltas) are invariant under the
          normalisation conflict between amendment DEC-20260921-f1d95a
          (probability normalisation, executed) and commit 4785243985
          (unitary normalisation, in-place edit, not executed).
        assigned_to: this review round (in-session)
        attack_plan: >-
          Derive, do not assert: (i) the Gauss-sum flatness proof that R08
          reads lambda = 1/2 under ANY scaling consistent with its
          construction; (ii) the shift-covariance argument -- a uniform
          prefactor c on vhat shifts every log||vhat||_1 by log c, cancelling
          in lambda differences (row vs row, row vs its Moebius image), so
          stability deltas and level comparisons are convention-free while
          absolute gate thresholds are not.
        breaking_artifact: >-
          A promoted finding that secretly depends on the executed
          normalisation (e.g. a threshold comparison) must be dropped from
          the durable set.
        breaking_artifact_outcome: >-
          Confirmed in analysis.md: gate verdicts (thresholds 1/4, 1/6) are
          convention-relative and are NOT promoted; the stability deltas and
          the coset-vs-random level comparisons are convention-free and ARE
          promoted. R03's 0.4191 reproduction is convention-BOUND (it
          reproduces ffe1df only under the executed normalisation) and is
          recorded as such, not promoted.
      - joint: >-
          J4 INTERPRETATION SCOPE: "artifactual" per the frozen rule vs the
          mathematical content of PGL_2 instability; and whether the scoped
          negative is stated at the exact scope the data cover.
        assigned_to: this review round (in-session)
        attack_plan: >-
          State the negative in the negative-result phrasing rules: measured
          registry, measured ladders, executed normalisation, and the
          distinction between "voided from the gate table per the frozen
          rule" (a protocol consequence) and "unusable as a construction key"
          (a stronger mathematical claim the census does NOT establish).
          Check every sentence of the report's consequence section against
          this distinction.
        breaking_artifact: >-
          Any sentence in the report or the evidence record that upgrades
          "unstable, voided per frozen rule" into "provably unusable", or
          that extends the negative beyond the frozen registry/ladders.
        breaking_artifact_outcome: >-
          One report sentence ("they carry no bias structure a construction
          can key on" for R06/R08) is tightened in analysis.md to
          "spectrally indistinguishable from a matched random set at these
          sizes", which is the measured statement; the stronger phrasing is
          not carried into the evidence record.
      - joint: >-
          J5 RESOURCE-EXHAUSTION HANDLING: the 26 tail-prime cells breached
          the frozen 8 GiB cap during measurement and were re-marked
          resource_exhaustion with values preserved; the ok set is
          genuinely within cap.
        assigned_to: this review round (in-session)
        attack_plan: >-
          Recompute from registry.json: the maximum recorded rss_highwater
          among ok cells vs among re-marked cells; confirm no ok cell's
          high-water exceeds 8 GiB; confirm the re-marked cells' values are
          excluded from every fit in fits.json (their cell ids must not
          appear in any family's primes list).
        breaking_artifact: >-
          An ok cell above cap, or a tail-prime value inside a fit, would
          invalidate the validity claim.
        breaking_artifact_outcome: >-
          Verified in analysis.md from registry.json: max ok-cell high-water
          6.63 GiB; all 26 re-marked cells are 67108879 cells and none
          appears in any fits.json primes list.
    blindness:
      mutual: true
      lifted_for: []
      rationale: >-
        Moot as declared: no second reviewer session exists this round. See
        procedure_deviations.
      note: >-
        DECLARED DEGRADATION, NOT DRIFT: the review-tier runtime is down
        (AWS DescribeInstances AuthFailure at bootstrap, five consecutive
        role-agent failures today: idea-generator 3x, coordinator 1x,
        executor 1x, recorded in DEC-20260921-4d1b40 next_actions). Every
        joint above that names "this review round (in-session)" is executed
        by the same session that produced the run -- a SELF-REVIEW. The
        independence the review architecture requires is NOT available and
        is NOT claimed. Consequences enforced by this plan: no claim tier
        above the runs' parameters; no knowledge promotion before an
        independent review confirms (see the decision's
        knowledge_promotion); the transition chosen is the conservative one
        (weaken, not reject_scoped); and the independent adversarial review
        of this evidence is recorded as an OWED next action, queued behind
        the runtime repair.
    proves_too_much:
      objects:
        - >-
          C02 itself: a genuinely random set. If the census's method or
          interpretation claimed to find stable bias-rich structure, it
          must NOT find it in C02 (measured 0.4996/0.5001, at exactly the
          random level -- the census passes this control by construction of
          its own conclusion).
        - >-
          C01 (all-ones): any method claiming to measure nontrivial
          spectral structure must read exactly zero here (it does).
        - >-
          The R06/R08 cosets under the Gauss-sum proof: if the
          "cosets-at-random-level" finding were an artifact of the
          normalisation or the fit, the derivation in J3 would fail for
          R08 -- it does not; R08's 0.5000 with SE 0.0000 is the analytic
          value, and a review that found cosets BELOW random level would
          be proving too much (contradicting the Gauss-sum lower bound).
      failure_signature: >-
        The census's conclusions must not extend to C02/C01 (no structure
        found where none exists) and must not read any coset below the
        Gauss-flat level. A reading below random level for R08 would prove
        too much and would indicate a transform or normalisation error.
      assigned_to: this review round (in-session)
      outcome: >-
        No proves-too-much failure: C01 exact zero, C02A/B at 0.4996/0.5001,
        R08 at exactly the analytic 0.5000, R06 within 2SE of it. R07
        (0.5709 on 4 points) is ABOVE the level and is recorded as the open
        candidate, not as structure.
    blind_rederivation:
      required: true
      quantity: >-
        lambda(R08) under the probability normalisation: the scaling
        exponent in p of ||vhat||_1^* for v = 1_QR/|QR|, stated from the
        definition of the QR set and the additive Fourier transform alone.
      parameters: >-
        primes <= 16777259 (the ok ladder), QR the nonzero quadratic
        residues of F_p, v = 1_QR/|QR|, vhat the additive Fourier
        transform, l1* the sum over k != 0.
      blind_from:
        - experiments/EXP-ECDLP-fac9ea/runs/TASK-20260921-4888d4/implementation.py
        - experiments/EXP-ECDLP-fac9ea/runs/TASK-20260921-4888d4/report.md
        - experiments/EXP-ECDLP-fac9ea/runs/TASK-20260921-4888d4/fits.json
      assigned_to: this review round (in-session, derivation-only)
      outcome: >-
        Re-derived in analysis.md from the classical quadratic Gauss sum
        G(k) = sum_x chi(x) e^{-2 pi i k x / p} with |G(k)| = sqrt(p) for
        every k != 0: sum_{x in QR} eta^{kx} = (G(k) - 1)/2, so
        |vhat(k)| = |G(k) - 1| / (2 |QR|) = Theta(sqrt(p)/p) = Theta(p^{-1/2})
        for every k != 0, whence ||vhat||_1^* = (p-1) * Theta(p^{-1/2}) =
        Theta(sqrt(p)) and lambda = 1/2 EXACTLY, matching the measured
        0.5000 (SE 0.0000). The derivation never opened the producer's
        implementation, report, or fits; it uses only the quantity's
        definition and the classical bound.
    procedure_deviations:
      - >-
        PLAN AND OUTCOMES IN ONE PASS: because this round is a single
        self-reviewed session with no reviewer reports to await, the joint
        outcome notes were drafted in the same pass as the plan itself.
        The PRE-COMMITMENT that survives this is the coordinator_prior
        above and the proves_too_much objects -- written before
        analysis.md, EV-ECDLP-81f4d4, or DEC-20260921-4516a0 exists, and
        verifiable as such because this handoff is committed in a
        plan-only commit BEFORE the analysis/ledger commit. The full
        adjudications live in analysis.md; the outcome notes here are the
        drafting pass's working record, not independent reviewer reports
        (there are none -- see the next deviation).
      - >-
        SELF-REVIEW UNDER RUNTIME OUTAGE: the coordinator subagent the skill
        prescribes for this round failed its environment bootstrap (AWS
        DescribeInstances AuthFailure), as did every other role agent
        attempted today. The review ran in the top-level coordinator
        session, which also produced the run. Independence is NOT claimed;
        the plan's blindness and ownership structure is retained for audit
        (each joint's attack, artifact, and outcome is recorded), the
        transition is the conservative one, promotion is deferred, and the
        independent adversarial review is an owed next action.
      - >-
        R03 CONTROL SEMANTICS CORRECTION DURING EXECUTION: the first
        implementation read the frozen band as "+-2SE interval inside
        [0.36, 0.42]" and failed at 0.4191; it was corrected to the frozen
        text's point-estimate reading ("fitted lambda ... in [0.36, 0.42]")
        BEFORE the final fits/report, with the marginality disclosed in all
        artifacts. Adjudicated as conformant in J2; recorded here because
        it happened after cells had run.
      - >-
        MEMORY-CAP BREACH DURING MEASUREMENT: 26 tail-prime cells were
        measured at 9.6-13.8 GiB high-water against the frozen 8 GiB cap
        before the breach was detected (an ru_maxrss units bug on darwin
        masked it). Per the frozen stopping rule they are checkpointed
        resource_exhaustion with values preserved and excluded from all
        fits; disclosed in the manifest and PR #1339.
      - >-
        CONCURRENT SPEC EDIT: commit 4785243985 (another session) rewrote
        specification.yaml in place (unitary normalisation) before this run
        executed but was not pulled before execution; the run executed
        v1 + amendments DEC-20260921-d3fafb/DEC-20260921-f1d95a exactly as
        its manifest records. The in-place edit bypasses the amendments
        path; adjudication of which normalisation is canonical is an owed
        next action (J3 records what survives either way).
    stopping_rules:
      - >-
        Validity first: an invalid run set goes back to the executor with
        concrete defects and the round stops there.
      - >-
        The transition is the conservative one under self-review: weaken,
        not reject_scoped; no promotion before independent confirmation.
