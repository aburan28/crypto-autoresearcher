# =============================================================================
# TASK-20260924-e39b50 -- EXECUTOR CARD: implement and run the frozen
# EXP-PFDR-b83f17 (power-residue coset and multiplicative-subgroup factor
# bases on prime-order E(F_p); exact census vs matched random null; E1/E2
# engines; Pollard rho comparator). Opened by DEC-20260924-7a4c2e.
# Its one archival task is TASK-20260924-4d06a8 (post-run snapshot archive).
# This card launches nothing by itself; it is dispatched by /run after the
# design snapshot archive TASK-20260924-91f3cd verifies and is pushed.
# =============================================================================
handoff:
  id: TASK-20260924-e39b50
  from: coordinator
  to: executor
  recorded_at: '2026-09-24'
  state: written_not_dispatched
  goal_id: GOAL-CRYPTO-001
  question_id: RQ-PFDR-ae2fba
  batch_id: BATCH-5e8a1c
  hypothesis_id: H-PFDR-6c1e94
  experiment_id: EXP-PFDR-b83f17
  opened_by_decision: DEC-20260924-7a4c2e
  run_invocation: /run EXP-PFDR-b83f17 under TASK-20260924-e39b50
  review_required: true
  reviewers_reserved: [TASK-20260924-c7e215, TASK-20260924-0b9d4a]

  objective: >-
    Implement the frozen protocol experiments/EXP-PFDR-b83f17/specification.yaml
    exactly and run it: Stage 0 parameters and curve certificates, Stage 1
    blocking gates, then per prime level (p = 16411 anchor; p_k for
    k = 14, 16, 18, 20) the E0 all-target census with 100 matched random
    draws per cell and every declared control, the E1 per-target engines,
    the E2 msolve cost arm and Pollard rho, and finally the zero-compute
    analysis run that computes every frozen reading mechanically. Record
    observations only; the evidence record, the verdict and every status
    transition are the Coordinator's.

  uncertainty_reduced: >-
    Whether multiplicative-coset x-coordinate factor bases (ell-th power
    cosets, and subgroups of order about p^(1/m)) have a per-target
    decomposition-count distribution different from matched random bases,
    and what a charged index-calculus projection with subgroup bases costs
    against Pollard rho measured on the same toy curves.

  inputs:
    - experiments/EXP-PFDR-b83f17/specification.yaml
    - ledger/hypotheses/H-PFDR-6c1e94.yaml
    - ledger/decisions/DEC-20260924-7a4c2e.yaml
    - ledger/handoffs/TASK-20260924-e39b50.yaml
    - knowledge/findings/KN-FIND-007.md
    - knowledge/open-problems/KN-OPEN-5b3a08.md
    - ledger/EV-FB-001.yaml
    - experiments/EXP-FB-001/analysis.md
    - agents/executor.md
    - AGENTS.md

  constraints:
    - id: EC-1
      text: >-
        FROZEN PROTOCOL. Implement exactly what the specification states:
        primes, curves, bases, streams, draw counts, target counts, engines,
        controls, thresholds and readings. Any needed change is reported to
        the Coordinator as a blocker; only an approved protocol_amendment
        under experiments/EXP-PFDR-b83f17/amendments/ may change the
        protocol. Do not tune after seeing any count.
    - id: EC-2
      text: >-
        WRITE SCOPE. Write only under experiments/EXP-PFDR-b83f17/implementation/
        and experiments/EXP-PFDR-b83f17/runs/. Do not edit the specification,
        any ledger record, harness/, tools/ or any other experiment. Do not
        commit; the Coordinator's archive task commits. Python runs with -B or
        PYTHONDONTWRITEBYTECODE=1 so no bytecode lands in the repository.
    - id: EC-3
      text: >-
        NO SHARED S_4. Do not import harness/semaev.py. Derive S_3 and S_4
        independently by the two routes of engines.semaev_polynomials and pass
        the s_validation_gate on every curve before any census.
    - id: EC-4
      text: >-
        EXACTNESS. Every count is exact integer arithmetic (python-flint);
        floating point is allowed only for the secondary Fourier bias. Every
        decomposition returned by E1 or E2 is certified by independent point
        addition.
    - id: EC-5
      text: >-
        GATES BEFORE READINGS. Stage 0 writes frozen-parameters.json and its
        sha256 is recorded before any count. Blocking controls (identity,
        ell = 1, conservation, positive small-multiples, GENERIC-ZN, engine
        agreement, rho comparator for the cost reading) are evaluated and
        recorded before any structured statistic is computed at that level;
        CTRL-NULL-REPLAY calibration is computed before the structured family
        statistics in the analysis run.
    - id: EC-6
      text: >-
        INFRASTRUCTURE IS NOT EVIDENCE. Timeouts, out-of-memory, crashes and
        msolve errors are failed_infrastructure or censored items, recorded
        with their logs, and never read as a mathematical result. msolve
        events follow msolve_nondeterminism_rule (one re-solve, then censor).
    - id: EC-7
      text: >-
        MACHINE PROTECTION. One worker (maximum_workers 1). Parent process
        under 8 GB; each msolve child under RLIMIT_AS 6 GiB (set in the child
        and read back), `-t 1`, watchdog 900 s; E1 watchdog 1800 s per target.
        Watchdog expiry censors the item and checkpoints; it does not exhaust
        the task.
    - id: EC-8
      text: >-
        IDENTIFIERS. Mint every run id with `python3 tools/allocate_id.py
        --next run --area PFDR` (or the tool's documented form for run ids)
        and confirm each with `--check` before any file names it; record them
        in implementation/run-ids.json before the first run. Never derive an
        id by scanning state.
    - id: EC-9
      text: >-
        BOUNDED OUTPUT. Full count vectors only where the specification says
        (anchor and k = 14 structured bases, draws r = 0 and 1); elsewhere the
        sha256 of the canonical count vector. No per-target stream beyond the
        declared jsonl files. Nothing written outside write_scope, including
        scratch (use the session scratchpad).
    - id: EC-10
      text: >-
        HONESTY. Report the tool versions actually found; if python-flint,
        msolve or any dependency differs from the declared versions, record
        it and ask the Coordinator before running (DP-4). Missing data stays
        missing. Amazon Bedrock is prohibited for any inference.

  deliverables:
    - experiments/EXP-PFDR-b83f17/implementation/ (code, README with exact commands, run-ids.json)
    - experiments/EXP-PFDR-b83f17/runs/<RUN-ID>/ for the gate run, the five prime-level runs and the analysis run, each with the files listed in the specification's required_artifacts
    - 'a return report (return_format) listing every file written with its sha256'

  artifact_paths:
    - experiments/EXP-PFDR-b83f17/implementation/
    - experiments/EXP-PFDR-b83f17/runs/
  artifact_paths_note: >-
    Run ids are minted by the executor under EC-8, so exact file paths are
    fixed by implementation/run-ids.json and the return report; the archive
    task TASK-20260924-4d06a8 binds exactly those paths with their sha256.
  write_scope:
    - experiments/EXP-PFDR-b83f17/implementation/
    - experiments/EXP-PFDR-b83f17/runs/
  archived_by: TASK-20260924-4d06a8

  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false

  budget:
    wall_clock_seconds: 172800
    memory_gb: 8
    maximum_runs: 14
    budget_note: >-
      wall_clock_seconds is a PROCESS WATCHDOG for the whole task (machine
      protection, CLAUDE.md): its expiry checkpoints the task with every
      completed run preserved; it does not exhaust the campaign and needs no
      further user approval. Scientific time and CPU are advisory and null in
      the specification. memory_gb is the parent-process cap; msolve children
      run under 6 GiB each. maximum_runs 14 = 7 planned runs plus
      infrastructure re-runs.

  completion_gate:
    - 'implementation/run-ids.json lists every run id, each minted and --check-confirmed before use'
    - 'the gate run exists with frozen-parameters.json (sha256 in its manifest, written before any count), s-validation.json showing the s_validation_gate passed on all 15 curves (or a recorded stop), gate-results.json and msolve-help.txt'
    - 'each of the five prime-level runs exists with a terminal validity status (valid | failed_infrastructure | invalid with reason) and every file required_artifacts lists for it, or a recorded stop under a declared stopping rule'
    - 'every blocking control result is recorded per level before any structured statistic of that level'
    - 'the analysis run exists with analysis-readings.json and analysis.md computing every frozen reading and outcome label mechanically, with MEASURED and MODELED cost columns separate'
    - 'every manifest satisfies the AGENTS.md artifact policy (command, commit and dirty state, environment and versions, seeds and stream keys, inference block, timings, peak RSS, validity status, stdout and stderr, sha256 of the specification and of every run file)'
    - 'nothing written outside write_scope; no ledger record, specification or harness file changed; no commit made'

  return_format: >-
    A report to the Coordinator: the run ids and their validity statuses; the
    gate outcomes; the tool versions found; for each level the list of files
    with sha256; the outcome labels the analysis run computed (reported, not
    interpreted); every censored item, engine event and deviation from the
    specification with its reason; and any blocker raised under EC-1 or
    EC-10.

  review_plan: null
  review_plan_note: >-
    This is a producer card. The claim-changing review round is opened later
    by the Coordinator on the Validator and Red Team cards (reserved
    TASK-20260924-c7e215 and TASK-20260924-0b9d4a), with its review_plan
    written before any reviewer runs.

  dispatch_preconditions:
    - id: DP-1
      text: >-
        archived_by is bound (TASK-20260924-4d06a8) and the design snapshot
        archive TASK-20260924-91f3cd has committed, verified and pushed the
        specification, H-PFDR-6c1e94, DEC-20260924-7a4c2e and this card.
        Dispatch before that verification is forbidden.
    - id: DP-2
      text: >-
        Declared inputs are committed and pushed (the files in inputs).
    - id: DP-3
      text: >-
        A lane is claimed with tools/goal_lanes.py claim on GOAL-CRYPTO-001's
        queue (or a disjoint lane is opened if another session works the
        goal), respecting max_concurrent; released with an outcome on return.
    - id: DP-4
      text: >-
        The dispatching session confirms on the host, before launch, that
        python3 imports flint (python-flint 0.9), numpy, sympy and galois,
        and that /usr/bin/msolve runs and reports 0.6.5; versions go into the
        gate-run manifest. A different version is recorded and brought to the
        Coordinator before any run.
