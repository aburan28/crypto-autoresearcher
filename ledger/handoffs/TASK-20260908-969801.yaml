  constraints:
  - You are not alone. Own only three declared outputs; preserve every other agent and immutable source/report.
    No producer/ledger/queue/claim/status changes, commits or pushes.
  - Use only declared inputs and own outputs. Verify hashes before review. Prior archived spectral reports are explicitly
    visible; no parent conversation or concurrent reviewer reports.
  - Zero scientific runs. At most160 TOTAL fixed static/arithmetic/synthetic/mock case executions including each
    parameterized numerical input, failed attempt and rerun, each<=10seconds and aggregate<=1800wall/CPU seconds,
    one worker2GiB. Count BEFORE every invocation and reserve one final suite. No per-method undercounting of parameterized
    cases. Never invoke a future-run/measurement CLI or prospective pipeline, even with mocks. Source/hash/parse
    checks are administrative and excluded. Record an exact case ledger and failed attempts. No frozen fixture searches,
    curve collision census, Cayley calibration, experimental controls/timing or future-run invocation. Record actual
    commands/counts/timings and preserve failed attempts.
  - Review the full frozen contract and final source, report only the assigned implementation joint. Separate reproduced
    defects, missing definitions, untested concerns and operational prerequisites. No whole-claim, scientific, launch
    or status verdict.
  - No fallback/degradation/Bedrock. Native review-adversarial gpt-5.6-sol/xhigh in an independent session.
  - Routine wall/CPU estimates remain advisory; machine protection/cancellation and exact scientific sample counts
    still bind. Do not demand superseded research spending caps.
