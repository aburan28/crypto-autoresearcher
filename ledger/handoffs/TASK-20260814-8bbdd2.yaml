handoff:
  id: TASK-20260814-8bbdd2
  recorded_at: '2026-08-14'
  from: coordinator
  to: executor
  objective: >-
    Measure the defected-minus-true difference in log2_Ahat_k at k = m = 17 using the SAME
    matched-pair design as TASK-20260809-a79e4f, on the SAME shards (5000, 6000), but on a
    GENUINELY NEW trial range disjoint from every trial index those shards have ever supplied in
    this campaign. For each of shard 5000 and shard 6000, for each decode variant (unmodified
    decode_blocks, V3-defected wrapper), call stage_a.py's real, unmodified _t_shard ONCE with
    n_trials = 5000 + 10000 = 15000 (trial indices 0..14999); retain only the trailing slice of
    per-trial data at indices [5000:15000) (10,000 new trials per shard, 20,000 pooled across
    both shards, matching TASK-20260809-a79e4f stage 2's T2=20,000) for every statistic; discard
    indices [0:5000) from all analysis (they are exactly TASK-20260809-a79e4f's already-consumed
    range on these shards) but still compute them, since stage_a.py's _t_shard has no
    trial-offset parameter and cannot be asked to start at trial index 5000 directly. Before
    trusting the retained tail, assert the discarded prefix [0:5000) of this run's own freshly
    generated S-histogram is bit-identical to TASK-20260809-a79e4f's committed per_trial_S arrays
    for the corresponding shard/variant -- this is BOTH the disjointness proof and a second
    determinism check. Add the new standing invariant: F[:, 0:n_e-1] (all blocks except the last)
    must be bit-identical, elementwise, between the defected and undefected decode of the SAME
    trial on the SAME shard, checked on the retained 10,000-trial slice of each shard. Report
    observations only.
  uncertainty_reduced: >-
    Whether BATCH-412513's alpha=1.4704932987763473 SE-vs-trial-count exponent anomaly -- which
    the Red Team and Validator both traced to being 100% concentrated in the step that
    simultaneously changed trial count AND shard identity (EV-HQC-3a0372 O8) -- is a property of
    shards 8001/8002 specifically, or a general property of this matched-pair estimator's SE
    scaling. This task holds shard identity fixed (5000, 6000) while extending trial count to
    T=20,000, isolating the variable the 3-point BATCH-412513 design could not separate. Also
    newly verifies, for the first time in this task family with a runtime structural assertion
    rather than a code-level argument alone, that the injection wrapper's
    zero-new-entropy-between-variants claim holds at the array level (F[:, 0:n_e-1] identity),
    not only at the level of the lossy row-sum S (EV-HQC-3a0372 O11).
  inputs:
  - coordination/goals/GOAL-HQC-001/batches/BATCH-6fddee/tasks/TASK-20260806-64b506/stage_a.py --
    import read-only and sha256-pinned exactly as TASK-20260809-a79e4f's matched_pair.py does
    (PARAM_SETS, sha_key, CTRStream, fixed_weight_support, ring_mul_sparse, decode_blocks,
    _t_shard, hist_of, batch_hists, evaluable_k, N_JACK_BATCHES, T_STAB_THRESHOLD, MASTER_SEED).
    Expected sha256 06a0a618432c00fe26c72ecf05a8d89489db61c5183931fdb76a378717681405, identical
    pin to every prior arm in this campaign.
  - coordination/goals/GOAL-HQC-001/batches/BATCH-0a65c0/tasks/TASK-20260806-cde749/measure.py --
    comb_matrix, log2_A_from_hists, reused exactly as before. Expected sha256
    a4fd1ecb63f0ddc83c02ef45f2c65ab31cf13d13e7ae94f500e67465b24f5dc8.
  - coordination/goals/GOAL-HQC-001/batches/BATCH-412513/tasks/TASK-20260809-a79e4f/matched_pair.py
    -- NEW to this task -- import this file too, read-only, and compute-and-record its own sha256
    (do not fabricate a hash value; measure it at run time exactly as the two files above are
    measured). Reuse make_defected_decode_blocks, matched_pair_stats, arm_hists, cell,
    load_module, sha256_file, core_seconds, git_state from it directly rather than re-deriving the
    matched-pair jackknife construction, so "the same matched-pair jackknife construction"
    (DEC-20260809-186c86's own words) is reused bit-for-bit, not merely re-implemented to the same
    formulas.
  - coordination/goals/GOAL-HQC-001/batches/BATCH-412513/tasks/TASK-20260809-a79e4f/matched_pair_results.json
    -- the committed per_trial_S arrays (stage_1.per_trial_S.shard_5000_defected /
    shard_5000_undefected / shard_6000_defected / shard_6000_undefected) this task's discarded
    prefix must reproduce bit-identically, and the committed T=5,000/T=10,000 SE_paired-at-k=17
    points this task's own T=20,000 point is compared against.
  - ledger/decisions/DEC-20260809-186c86.yaml -- the decision authorizing this task and stating
    its pass/fail framing (SE near 0.068-0.070 => shard-specific; collapse similar to BATCH-412513
    stage 2 => general refutation). You do NOT apply this framing; you supply the number it is
    applied to.
  - ledger/evidence/EV-HQC-3a0372.yaml -- observations O8 (the local-exponent decomposition
    motivating this task) and O11 (the F[:, 0:n_e-1] structural check named as the new standing
    invariant).
  constraints:
  - PRE-REGISTER BEFORE RUNNING. design.md must exist and state, before any data is generated -
    the discard-prefix technique and why it is necessary (stage_a.py's _t_shard has no
    trial-offset parameter), N_DISCARD_PREFIX=5000, N_NEW=10000 per shard, the two shard indices
    (5000, 6000), the exact slice [5000:15000), the primary cell k=m=17, the k range 2..26, the
    matched-pair jackknife construction (reused from matched_pair.py, not re-derived), and the
    F[:, 0:n_e-1] structural invariant construction.
  - THE DISCARD-PREFIX TECHNIQUE IS MANDATORY AND MUST BE IMPLEMENTED EXACTLY AS SPECIFIED - ONE
    call to _t_shard per (shard, variant) with n_trials=15000, never two separate calls of 5000
    and 10000. A second, independent call would restart trial indexing at 0 internally and
    silently re-derive the SAME already-consumed domain tags rather than a disjoint continuation,
    defeating the entire purpose of this task. If you find any way to make stage_a.py's real
    _t_shard accept a nonzero starting trial index without editing stage_a.py itself, prefer it
    and report the change; otherwise use the single-call-with-slicing technique specified here.
  - DISJOINTNESS SELF-CHECK, FAIL-CLOSED, RUN BEFORE ANY STATISTIC IS COMPUTED FROM THE RETAINED
    TAIL - for each of the 4 (shard, variant) calls, compute the S-histogram of the discarded
    prefix slice [0:5000) and assert it is BIT-IDENTICAL, elementwise, to the corresponding
    committed array in TASK-20260809-a79e4f's matched_pair_results.json.stage_1.per_trial_S. If
    any of the 4 checks fails, ABORT immediately and report infrastructure_error /
    invalid_measurement (AGENTS.md rule 5) - do not compute or report any statistic from the
    retained tail of a call whose prefix did not reproduce.
  - THE STANDING F[:, 0:n_e-1] INVARIANT, FAIL-CLOSED - for each shard (5000, 6000) separately, on
    the retained 10,000-trial tail, assert F_defected[:, 0:n_e-1] == F_undefected[:, 0:n_e-1]
    elementwise for every retained trial (both arrays exist in stage_a.py's _t_shard return dict
    as "F"; do not discard the full block-level array after computing S=F.sum(axis=1) the way
    TASK-20260809-a79e4f's matched_pair.py does - retain it for this comparison). Report the total
    mismatch count (expected 0) and PASS/FAIL per shard. A FAIL is infrastructure_error /
    invalid_measurement, not a result about the mathematics, per AGENTS.md rule 5.
  - REUSE THE REAL SAMPLER AND ESTIMATOR, DO NOT REBUILD THEM. Import matched_pair.py's
    make_defected_decode_blocks, matched_pair_stats, arm_hists, cell, load_module, sha256_file
    read-only rather than re-deriving them; the only genuinely new code is the discard-prefix
    driver, the disjointness self-check, and the F[:, 0:n_e-1] invariant check. If you find
    yourself rewriting any reused function to make this work, stop and report that instead - it is
    a finding, not an obstacle to route around.
  - USE PS-R3's PARAMETERS THROUGHOUT (n=7187, n_e=56, N=7168, k range 2..26,
    m_load_bearing_order=17), identical to TASK-20260809-a79e4f. Standardized HQC parameters are
    OUT OF SCOPE and unauthorized.
  - REPORT - per-shard and pooled matched-pair diff, matched-pair jackknife SE and z at k=17 and
    across the full k range; the UNPAIRED SE alongside the paired SE and their ratio at k=17; the
    fitted SE-vs-trial-count exponent refit across ALL THREE points on shards 5000/6000 (T=5,000
    from TASK-20260809-a79e4f's stage 1, T=10,000 from the same, T=20,000 from this task),
    reported descriptively, with no conclusion drawn about which of DEC-20260809-186c86's two
    named outcomes obtains.
  - D2/D3 hard invariants stay ON and fail-closed on all 4 calls (over the full 15,000-trial call,
    since _t_shard's counters are not sliceable by trial range); expected 0 violations on all 4.
  - STATE PRECISELY WHAT YOU TESTED AND DID NOT - which defect class, which injection point, which
    shards, which trial indices (explicitly - [5000,15000) per shard, [0,5000) discarded), which
    parameter set. Do not generalize past it.
  - REPORT ACTUAL SPEND - core-seconds and wall-clock, against the 500 core-second and 1,800
    wall-clock authorizations, so the ledger archive can debit a measured number.
  - YOU ARE THE EXECUTOR - OBSERVATIONS ONLY. Do NOT apply DEC-20260809-186c86's
    shard-specific-vs-general-refutation framing, do NOT conclude anything about A17, HQC's DFR,
    any standardized parameter set, or whether the campaign should scale up or pause, and do NOT
    change any record's status. Claim tier stays toy.
  - Write only under your own task directory. Do not touch experiments/EXP-HQC-982268/specification.yaml,
    stage_a.py, measure.py, TASK-20260809-a79e4f's matched_pair.py, any ledger record, or any
    other task's directory.
  deliverables:
  - design.md
  - matched_pair_repeat.py
  - matched_pair_repeat_results.json
  - matched_pair_repeat_report.md
  - run_manifest.yaml
  - stdout.log
  - stderr.log
  artifact_paths:
  - coordination/goals/GOAL-HQC-001/batches/BATCH-0e126d/tasks/TASK-20260814-8bbdd2/design.md
  - coordination/goals/GOAL-HQC-001/batches/BATCH-0e126d/tasks/TASK-20260814-8bbdd2/matched_pair_repeat.py
  - coordination/goals/GOAL-HQC-001/batches/BATCH-0e126d/tasks/TASK-20260814-8bbdd2/matched_pair_repeat_results.json
  - coordination/goals/GOAL-HQC-001/batches/BATCH-0e126d/tasks/TASK-20260814-8bbdd2/matched_pair_repeat_report.md
  - coordination/goals/GOAL-HQC-001/batches/BATCH-0e126d/tasks/TASK-20260814-8bbdd2/run_manifest.yaml
  - coordination/goals/GOAL-HQC-001/batches/BATCH-0e126d/tasks/TASK-20260814-8bbdd2/stdout.log
  - coordination/goals/GOAL-HQC-001/batches/BATCH-0e126d/tasks/TASK-20260814-8bbdd2/stderr.log
  archived_by: TASK-20260814-0bb33f
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 1800
    memory_gb: 2
    maximum_runs: 2
  budget_note: >-
    Also authorized - 500 core-seconds of compute, against an expected 30-90 by arithmetic on the
    committed throughput of about 2,100 trials/core-second applied to 60,000 total trial-decodes
    (4 calls x 15,000 trials, of which 40,000 are analyzed and 20,000 are the discarded prefix).
    No budget field is null. GOAL-HQC-001's campaign_budget.total_wall_clock_seconds is 10,800 and
    is a LIVE pause condition; roughly 4,944.9 seconds remained after BATCH-412513's close, per
    that batch's own stated debit convention (only executor-measured spend is debited).
  completion_gate:
  - design.md exists, predates matched_pair_repeat_results.json, and states the discard-prefix
    technique, N_DISCARD_PREFIX/N_NEW, the two shard indices, the exact slice, the primary cell
    k=m=17, the reused jackknife construction, and the F[:, 0:n_e-1] invariant construction.
  - The disjointness self-check is reported PASS (discarded-prefix S-histograms bit-identical to
    TASK-20260809-a79e4f's committed per_trial_S arrays on all 4 calls) or the run is reported
    ABORTED as an infrastructure outcome.
  - The F[:, 0:n_e-1] structural invariant is reported PASS with a stated mismatch count (expected
    0) on both shards, or ABORTED as infrastructure_error.
  - matched_pair_repeat_results.json carries per-shard and pooled matched-pair diff, paired SE,
    unpaired SE, their ratio, and z at k=17 and across k=2..26.
  - The refitted SE-vs-trial-count exponent across all three points on shards 5000/6000 (T=5,000,
    T=10,000, T=20,000) is reported, with no conclusion drawn about which named outcome obtains.
  - matched_pair_repeat.py reuses stage_a.py, measure.py, and TASK-20260809-a79e4f's
    matched_pair.py via sha256-pinned read-only import, with only the discard-prefix driver,
    disjointness self-check, and F-invariant check as new code.
  - run_manifest.yaml carries command, git commit and dirty-tree state, environment, seeds and
    shard indices, timings, core-seconds and wall-clock, and validity status.
  - No file outside the task's write_scope was created or modified.
  return_format: >-
    The executor's own report record per agents/executor.md - observations separated from
    interpretation, with the mechanical facts (disjointness self-check, invariant checks, run
    counts, spend) stated separately from the measured statistics. Do not return a verdict on
    which of DEC-20260809-186c86's two named outcomes obtains; the Coordinator applies that
    framing at the ledger archive.
