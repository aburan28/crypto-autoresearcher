  constraints:
  - >-
    RE-DERIVE, DO NOT ADOPT. Compute the nested-doubling relative-noise scale
    1/(2*sqrt(n_prev)) independently for each of the transitions 12->24, 24->48
    (and, as a check on the general formula, the further transitions the
    amendment declares) and compare against DEC-20260810-5aeeaa's stated
    figures (0.1443, 0.1021, ...). State explicitly whether you reproduce them,
    and if not, where the derivation diverges.
  - >-
    CHECK SKEWNESS AND TAIL WEIGHT AT ALL THIRTEEN DENSITY ROWS, at every rung
    reached (1, 2, 3), from the per-seed variance ratios in
    sr3v3-reference-sampling.json. Report a per-row skewness statistic and any
    other tail-weight diagnostic you compute (e.g. excess kurtosis, a
    quantile-based tail-heaviness measure), with the exact figures and the
    exact formula used for each.
  - >-
    CHECK THE TWO NAMED UPPER-SIDE EXCEEDANCES AGAINST COVERAGE 259/260: fb =
    11 (max per-seed ratio 3.3358 against a fitted upper endpoint 3.2614) and
    fb = 22 (max 4.8231 against 4.5123). Re-derive these two figures from the
    raw run artifacts rather than transcribing them from DEC-20260810-5aeeaa.
    State whether the observed exceedance count and its one-sided pattern
    (both exceedances on the upper side, none on the lower) across all
    thirteen rows and the seeds drawn is consistent with the Gaussian rule at
    the stated coverage, and whether the pattern changes your assessment of A
    versus B.
  - >-
    A VERDICT ON HEUR-INSTR-4 VERSUS THE COMPETING EXPLANATION IS REQUIRED,
    STATED AS ONE OF: (A) supports ordinary sampling noise / HEUR-INSTR-4, (B)
    supports a right-skewed or heavy-tailed sampling distribution, or
    INCONCLUSIVE with the specific reason the available data (one run, one
    prime, rungs 1-3 only) cannot discriminate. Do not force a verdict beyond
    what thirteen rows at up to 48 seeds can support; an honest INCONCLUSIVE
    with a stated basis is a valid outcome and is not a lesser deliverable
    than A or B.
  - >-
    THE STANDING CONTROL ABOVE (standing_control_restatement_v2_verbatim) IS
    BINDING ON ANYTHING YOU CITE FROM RUN-INSTR-36c8cf-phaseA-v2-57ca9a: that
    run's SR3 v3 characterisation measured the reference run's own sampler
    (targets_uniform) under clause (b), and anything you draw from it is an
    ADMISSIBILITY QUANTITY ONLY under clause (c) -- it inherits the
    H-ICINV-6c7920 dispute wholesale and may not support any within-class,
    between-class, curve-side or ECDLP claim in either direction. Your verdict
    is about the STATISTICAL BEHAVIOUR OF THE VARIANCE-RATIO ESTIMATOR, not
    about any curve or class property, and must not be worded as if it were.
  - >-
    NO NEW RUN, NO NEW HARNESS EXECUTION AGAINST EXP-INSTR-36c8cf OR ANY OTHER
    EXPERIMENT CONTRACT. This is a read-and-reason task over committed
    artifacts. You may write and run your own throwaway analysis scripts
    against the committed JSON to re-derive figures, but you may not invoke
    harness/run_saturation.py, harness/exp_icinv.py, or
    harness/exp_icinv_fullgroup.py against any live target, and you produce no
    experiments/EXP-*/runs/ artifact.
  - >-
    claim_tier toy on anything you state. NO ATTACK, NO EXPONENT, NO SPEEDUP.
    Nothing in this task's output may be read as bearing on H-ICINV-6c7920,
    EV-ENDO-10109d, endomorphism structure, |D_0|, or ECDLP difficulty in
    either direction; it bears only on whether a Coordinator-set stopping rule
    (E3, the 5% rung-to-rung threshold) and a Coordinator-set seed ladder are
    jointly satisfiable, and on the sampling behaviour of one statistic at one
    prime.
  - >-
    Never fabricate a command, output, timing, statistic, or figure. A
    quantity you did not compute stays missing and is reported as missing
    (AGENTS.md rule 5). If you cannot access or parse an artifact this task
    names, report that as a defect, not as a silently substituted value.
  - >-
    Do not repair anything you find wrong in DEC-20260810-5aeeaa,
    amendments/v2.yaml, or the run artifacts. Name the defect, evidence it, and
    state a concrete successor action. You do not change any hypothesis
    status, approve or withdraw the amendment, or edit any ledger, experiment,
    or run record.
  - >-
    Write only the declared report; make no ledger, queue, protocol,
    experiment, or run edit, and no commit.

