  objective: >-
    THIS IS V1 OF THE TWO VALIDATIONS DEC-20260810-5aeeaa REQUIRES BEFORE
    AMENDMENT v2 MAY BE APPROVED. Independently re-derive the nested-ladder
    noise arithmetic in DEC-20260810-5aeeaa
    (arithmetic_check_of_the_input_offered_by_the_archiving_session and
    what_the_corrected_arithmetic_says_about_the_observed_values) FROM
    RUN-INSTR-36c8cf-phaseA-v2-57ca9a'S OWN PER-SEED VARIANCE RATIOS -- the raw
    run artifacts under
    experiments/EXP-INSTR-36c8cf/runs/RUN-INSTR-36c8cf-phaseA-v2-57ca9a/,
    principally sr3v3-reference-sampling.json and sr3v3-interval-stability.json
    -- and return a verdict on whether the F4 firing at p = 4001 is (A) ordinary
    standard-deviation-estimator noise on a nested doubling, consistent with
    HEUR-INSTR-4 (amendments/v2.yaml declared_heuristic_HEUR_INSTR_4), under
    which more seeds is the correct repair, or (B) evidence of a right-skewed or
    heavy-tailed per-row sampling distribution of the variance-ratio statistic,
    under which the Gaussian tail rule HEUR-INSTR-3 is inadequate at coverage
    259/260 and the mean +- z*sd estimator itself is the wrong repair regardless
    of seed count (amendments/v2.yaml competing_explanation_not_excluded).

  uncertainty_reduced: >-
    Whether amendment v2 (extending the seed ladder to a declared terminal rung
    of 1536 while leaving the 5% rule, the estimator and the coverage
    unchanged) is the correct repair for F4's firing, or the wrong repair for a
    defect the amendment cannot fix. This is the single precondition
    DEC-20260810-5aeeaa names for the amendment ever being approved
    (what_would_clear_it, V1). It resolves nothing about H-INSTR-444c7b,
    H-ICINV-6c7920, endomorphism structure, |D_0|, or ECDLP difficulty -- see
    scope_and_honesty below.

  independence_requirement: >-
    THIS MUST RUN IN A SESSION THAT DID NOT ORIGINATE THIS CLAIM. It must not
    be the Executor session that produced RUN-INSTR-36c8cf-phaseA-v2-57ca9a and
    must not be the Coordinator session that wrote DEC-20260810-5aeeaa or filed
    amendments/v2.yaml. Record the session identifier, requested policy,
    resolved model identifier and reasoning effort actually used, and state
    plainly that this supplies SESSION independence and not necessarily MODEL
    independence if the same underlying model serves both roles under this
    harness's fallback (CLAUDE.md model policy note; DEC-20260810-5aeeaa
    inference.fallback_reason).

  standing_control_restatement_v2_verbatim: |-
    SAMPLER CONTROL, VERSION 2. THIS SUPERSEDES THE WORDING "targets_B
    (harness/exp_icinv_fullgroup.py), NEVER targets_uniform" WHEREVER IT APPEARS IN
    A GOAL-ENDO-001 DISPATCH ENVELOPE, HANDOFF OR TASK CARD FROM THIS DECISION
    ONWARD. IT EDITS NO COMMITTED RECORD: DEC-20260810-a4bec4 and every handoff
    already committed stand exactly as written, and this restatement supersedes them
    by reference in the way every correction in this campaign does. It must be
    transcribed VERBATIM into every future dispatch envelope in this campaign that
    draws a target.

    (a) EVERY NEW MEASUREMENT ARM USES exp_icinv_fullgroup.targets_B. targets_uniform
    is PROHIBITED for any new measurement arm, at any density row, in any contract of
    this campaign.

    (b) EXACTLY ONE EXCEPTION, AND IT IS NOT A LICENCE. A RE-MEASUREMENT OF A NAMED
    HISTORICAL REFERENCE RUN, at that run's own frozen parameters, for the sole
    purpose of characterising that run's own sampling variability or checking
    reproduction of it, USES THE REFERENCE RUN'S OWN SAMPLER, identified at run time
    from that run's own record and never assumed. Substituting a different sampler
    makes the object a different estimand and makes the reproduction check vacuous.

    (c) ANYTHING MEASURED UNDER (b) IS AN ADMISSIBILITY QUANTITY ONLY. It may not
    support any within-class, between-class, over-dispersion, curve-side or ECDLP
    claim in either direction, and it inherits the H-ICINV-6c7920 dispute wholesale:
    if that hypothesis is later supported, every quantity measured under (b) is an
    artifact of the sampler and any gate built on it certifies reproduction of a
    historical artifact and nothing more.

    (d) THE r-STRATIFICATION HALF OF THE CONTROL IS UNCONDITIONAL. Every measurement
    is stratified on r = #{x in F_p : x^3 + a x + b = 0} and the strata are reported
    wherever a target is drawn, under (a) and (b) alike. That reporting gates
    nothing.

    (e) AN EXECUTOR THAT FINDS AN ENVELOPE AND A FROZEN CONTRACT IN CONFLICT
    DECLARES THE CONFLICT BEFORE ANY MEASUREMENT, FOLLOWS THE FROZEN CONTRACT, ADDS
    NO UNDECLARED ARM, AND LEAVES THE ADJUDICATION TO THE COORDINATOR. That is what
    RUN-INSTR-36c8cf-phaseA-v2-57ca9a did and it is correct.

  no_compute_authorized_note: >-
    THIS TASK AUTHORIZES NO NEW RUN OF EXP-INSTR-36c8cf OR ANY OTHER
    EXPERIMENT. amendments/v2.yaml (experiments/EXP-INSTR-36c8cf/amendments/v2.yaml)
    is filed and status filed_pending_independent_validation_NOT_APPROVED,
    approved_by null, and stays that way until BOTH this validation (V1) and
    the paired red-team task TASK-20260810-854c12 (V2) return without dissent
    AND a successor Coordinator decision approves, amends or withdraws it.
    A DISSENT from either blocks approval outright; it is not outvoted. IF THIS
    VALIDATION RETURNS EXPLANATION B (the heavy-tail / right-skew reading), THE
    AMENDMENT MUST BE WITHDRAWN RATHER THAN APPROVED, AND THE GATE'S ESTIMATOR
    MUST BE REDESIGNED INSTEAD -- and that redesign is a USER decision, not a
    Coordinator one, because the user selected this gate replacement in
    DEC-20260810-a4bec4. This task itself performs no new measurement, runs no
    harness code that consumes budget against EXP-INSTR-36c8cf's contract, and
    dispatches nothing further; it reads and reasons over already-committed
    artifacts.

