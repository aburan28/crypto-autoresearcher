      thirteen rows at up to 48 seeds each, from JSON files already on disk,
      which is small relative to the SR3 v3 run itself
      (RUN-INSTR-36c8cf-phaseA-v2-57ca9a completed in 128.234 s). 2400 s is set
      generously above that to allow for careful independent derivation and
      report-writing rather than because the arithmetic itself is expected to
      approach it; maximum_runs 1 because this task produces one report, not a
      run in the experiments/ sense. Exhausting the wall-clock budget is a
      BUDGET EVENT under AGENTS.md rule 5, reported as such, never as a
      verdict.

  completion_gate:
  - >-
    A strict-YAML report at the declared path states an independent
    re-derivation of the nested-doubling relative-noise figures at each
    transition, with the exact formula used, and states explicitly whether it
    reproduces DEC-20260810-5aeeaa's figures or diverges and where.
  - >-
    Per-row skewness and tail-weight diagnostics are reported for all thirteen
    rows at every rung reached (1, 2, 3), with the exact statistic and formula
    named.
  - >-
    The fb = 11 and fb = 22 upper-side exceedances are independently re-derived
    from sr3v3-reference-sampling.json (not transcribed from
    DEC-20260810-5aeeaa) and assessed against the Gaussian rule at coverage
    259/260.
  - >-
    Exactly one verdict is returned on HEUR-INSTR-4 versus
    competing_explanation_not_excluded: A (ordinary sampling noise), B
    (right-skewed / heavy-tailed distribution), or INCONCLUSIVE with a stated
    basis. Neither A nor B is presupposed by this handoff; a genuine
    INCONCLUSIVE with a concrete stated basis satisfies this gate.
  - >-
    The report states explicitly whether it constitutes a DISSENT from
    amendment v2's HEUR-INSTR-4 attribution, since a dissent blocks approval
    per DEC-20260810-5aeeaa what_would_clear_it and
    amendments/v2.yaml validation_required_before_approval.
  - >-
    Independence (session, and model if determinable), scope, and the
    admissibility-only limitation on anything drawn from the targets_uniform
    reference measurement are stated explicitly, per
    standing_control_restatement_v2_verbatim clause (c).
  - No file outside the declared report was written and no commit was made.

  return_format: >-
    A YAML report at
    coordination/goals/GOAL-ENDO-001/batches/BATCH-d7e255/reviews/TASK-20260810-c9655a/validation-report.yaml
    containing: the re-derived nested-doubling noise arithmetic with formula
    and figures; the per-row skewness/tail-weight table for all thirteen rows
    at every rung reached; the independently re-derived fb = 11 / fb = 22
