  budget:
    wall_clock_seconds: 2400
    memory_gb: 4
    maximum_runs: 1
    total_cpu_hours: null
    budget_note: >-
      COORDINATOR-SET, BOUNDED, NOT DERIVED FROM ANY MEASUREMENT OF THIS
      TASK'S OWN COST. This is a read-and-reason task over already-committed
      artifacts with no new experiment execution: it re-derives closed-form
