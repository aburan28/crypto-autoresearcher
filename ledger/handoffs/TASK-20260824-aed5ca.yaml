    - RUNS ALONE. No other task may be running concurrently, and neither review may start before this commit exists and is verified.
    - STAGE ONLY THE DECLARED PATHS. A scope-expanding commit is an evidence-integrity failure, not a convenience.
    - >-
      MERGE origin/main, NEVER REBASE. Record the base commit checked and the merge
      outcome, and run tools/merge_digest.py because PR #530 has merged and this branch's
      base has moved. A sync conflict inside an immutable record is resolved by a NEW
      SUPERSEDING RECORD under a new id, never by editing the record and never by picking
      a side.
    - SUBJECT-LINE-ONLY COMMIT MESSAGES FROM THIS POINT UNTIL THE ROUND CLOSES (BR-1), and the blindness block extends to COMMITTED ARTIFACTS THAT RESTATE COMMIT HISTORY (BR-10).
    - >-
      THE PLAN CARRIES A POINTER TO THE SEALED PRIOR AND NOT THE PRIOR (BR-9). Its mandatory
      `coordinator_prior` field says the document is sealed and gives its path; NO PREDICTION
      AND NO MECHANISM APPEARS IN THE PLAN OR IN EITHER ASSIGNMENT. This is the exact channel
      through which round 2's seal leaked to BOTH reviewers.
    - >-
      `blind_from` NAMES coordination/goals/GOAL-DIFFP-84d641/sealed-priors AS A LITERAL PATH
      PREFIX WITH NO WILDCARD (BR-3), so the independence checker's leak test can match it.
    - THE ASSIGNMENT DOCUMENTS QUOTE NO PRODUCER-REPORTED VALUE FOR THE BLINDED QUANTITY (BR-5). This round's blinded quantity is THE DIFFERING-CELL COUNT.
    - EVERY JOINT CARRIES A SHORT `id` AND EVERY REVIEWER LISTS THOSE IDS IN joints_owned (BR-2); proves_too_much carries a TOP-LEVEL failure_signature roll-up as well as any per-object ones (BR-4).
    - EIGHT JOINTS, FOUR PER REVIEWER, AND NO MORE. The cut is declared at opening and the plan may not quietly restore joints the batch did not fund.
    - NEITHER ASSIGNMENT INSTRUCTS A REVIEWER TO COMMIT ITS OWN REPORT (BR-11). Reviewers leave output untracked at their write scope; the ledger archive commits it.
    - DO NOT INTERPRET ANY PRODUCER RESULT and record no research verdict. This task archives and plans; it does not review.
    - RECORD ONLY CHECKS THIS SESSION ACTUALLY RAN, with their verbatim output.
    - Do not read coordination/goals/GOAL-MD5-001/quarantine/** and attest non-reading.
    - Any scalar this receipt binds is either MEASURED by this session or quoted WITH ITS PROVENANCE AND MARKED UNVERIFIED (BR-6).
    - >-
      THE OPENING DECISION IS DEC-20260825-1dc43c AND IT IS FILED; THE CHECK THAT REMAINS IS
      WHETHER IT WAS COMMITTED BEFORE THE PRODUCER RAN. If it was not, SAY SO IN THE RECEIPT
      and do not proceed to dispatch the review: an unapproved contract cannot carry a
      claim-changing review round.
    - >-
      DISCLOSE THE DISPOSITION OF DEC-20260825-7c7d58, the review-round decision id, which WAS
      granted and is reserved for this task. Either file the record under it and name it in
      the receipt, or record it as ALLOCATED-AND-UNUSED with the reason -- that the receipt
      plus the committed review plan already carry the binding. An allocated identifier that
      vanishes from the record is worse than one recorded unused, and it may not be spent on
      anything else.
    - >-
      WRITE EVERY PROSE VALUE AS A BLOCK SCALAR OR QUOTED THE FIRST TIME (BR-13); the review
      plan and an assignment document are two of the five files this campaign has already
      shipped unparseable, and coordination/**.yaml is unparse-gated in CI.
