  constraints:
    - >-
      DA-1 Additive. Write exactly the three declared files, all new. Edit no
      proposal, hypothesis, experiment, decision, question, correction or goal
      record. Mint no identifier.
    - >-
      DA-2 Scope. S1 only, as DEC-20260928-63addc states it. Stage 0 (zero
      compute) recomputes claim (B) and claim (C) in Python: B_cap per m; the
      column T_gen = sqrt(N_prime / S) and P_gen at m in 4, 5, 6, 8, 16 with
      N_prime = r/262; the identity P_IC = P_gen at C = T_gen; the LA term
      below P_gen at every m >= 4; the m = 5 crossing window in g; the m = 4
      window stated exactly. Stage 1 is the instrument gate. Stage 2 is the
      heuristic validation on the n = 19 CERTBIN cell and the Koblitz n = 19
      sibling at m = 2 with oracle A, L in 1, 4, 16, 64, 256, certificates, 30
      seeds for rho per L, shared and per-target operations separately, usable
      fraction and retries per target, the pooling constant against
      IDEA-20260920-2e37b3's toy range. Stage 3 files the column conditional
      on H1, H2 and C. Excluded: the prime-field engine cells of the record's
      Stage 2 (ICPERF's to rank, PTR-ICPERF); any deployed-parameter run;
      4b65e3's Stages 1-2 (HOLD-X1).
    - >-
      DA-3 C1. Rho convention sqrt(pi r / (4 k)) with k = 131, 2^60.8090
      (CORR-20260922-81aeab); the record's sqrt(pi N_prime / 2) form may be
      kept with the equivalence stated.
    - >-
      DA-4 C2. The single-target comparator is the pinned D3 column of
      CORR-20260928-4cb669 (11.01, 33.08, 37.39, 42.52 bits at m = 4, 5, 6,
      8), never D1 and never a floor-to-rho gap. Claim (B)'s window arithmetic
      is restated against 33.08 with the record's 32.4 shown beside it, and
      claim (C)'s relaxation figures are recomputed against the pinned column;
      both columns are shown. The 4b65e3 Stage 0 section writes the pinned
      column beside 4b65e3's mu = 1 values with the 1.58-attempt factor (0.66
      bit) explained and the 0.34-bit residual at m = 8 resolved on paper or
      recorded as a definitional difference; 4b65e3 claim (A)'s D1 mislabel is
      noted and not repeated.
    - >-
      DA-5 C3, tripwire TW-01. The clause that an oracle below T_gen would be
      the first ECDLP algorithm below the S T^2 = N_prime line is not an
      outcome, a prediction or a success criterion. The outcome table
      certifies only the column, the identity, the window and the toy
      exponents. Any reading of an oracle below T_gen at n = 131, or of index
      calculus below the generic frontier on a deployed row, is pre-registered
      to review-breakthrough at max in the contract's own text.
    - >-
      DA-6 C4. The Z/NZ gate (full-log-vector solve and shared-table
      multi-target rho on a relabelled Z/NZ group of about 2^20 with a random
      base of 2^7 elements; both fitted exponents within 0.1 of -1 and -0.5)
      is committed as runnable Python code inside the audit sheet
      (fixture_code, a block scalar extractable verbatim) with its pass
      criterion stated before execution and placed in the specification's
      stopping and invalidation rules so that no curve cell is read before it
      passes. Specify the extension of linalg.py to a full log vector and the
      shared-DP-table mode of rho.py precisely enough to implement; write no
      code outside the declared files and run none.
    - >-
      DA-7 C5. H1 (uniform touching) and H2 (generic laws) keep numbered
      statements, random-model justification, supporting results with
      provenance, validation plans (sample, predicted distribution,
      comparison, tail check, transfer assumption) and falsification
      conditions; Stage 2 is their validation and is the pairing the dispatch
      bias requires. Kuhn-Struik's validity range is recalled and stays
      marked. Attempt Corrigan-Gibbs-Kogan's bound statement at source and
      record retrieved or the impediment; KN-LIT-013's corpus entry alone does
      not discharge H2's supporting result.
    - >-
      DA-8 C6. Memory beside time: the advice size S = B_cap words in bytes
      per m and the LA term, stated beside every time figure.
    - >-
      DA-9 C7. Forward guidance (iii) on the orbit-quotient advice size B/131
      is a per-orbit framing under CORR-20260925-649e25: conditional on the
      per-orbit unit no approved contract has fixed, cited only as a
      dependency, never stated as a movement.
    - >-
      DA-10 C8. Excluded reads as on this card. Zero runs. The
      IDEA-20260926-1ddce2 size column is cited by id as an input and not
      re-derived.
    - >-
      DA-11 Approval fields. The specification carries controls (the
      relabelled Z/NZ control, ordinary against Koblitz n = 19, certificates
      on every logarithm, single-target reproduction at L = 1, the rho pooling
      constant), metrics, budget, stopping rules, invalidation rules, required
      artifacts, a decidable success criterion with at least one negative
      outcome, a falsification criterion, interpretation limits, a
      proof_search_map and the observation-collision separation (usable
      fraction, retries, Z/NZ) in its rules; status review_required;
      approved_by null; an approval block stating it is approved if and only
      if DEC-20260928-cec92e is official with decision approve naming
      EXP-BINSTD-532d7f. The hypothesis has status specified, a mechanism,
      predictions, a test boundary and falsification criteria, and leaves
      asymptotic_claim at the record's cost-model reading with no exponent
      claimed for any oracle.
    - >-
      DA-12 Audit sheet. The four KN-TECH-080 audits and the strictness and
      interface obligations, each filled or with a not_applicable_reason; a
      C1 to C8 discharge table naming the clause that discharges each; the
      fixture code and its pass criterion; the Stage 0 recomputation output;
      and an attestation of every source read and at what depth.
    - >-
      DA-13 No sentence claims an ECDLP speedup, an exponent move, a
      deployed-curve verdict, an oracle below any budget, or a lane closure
      (plan tripwire TA-1).
    - >-
      DA-14 Zero runs. Execute no instrument, driver or solver; the Stage 0
      Python recomputation of arithmetic is permitted and its output is a
      design figure, never a result. Cite with provenance.
    - >-
      DA-15 No AUXIN census value, reviewer finding value, RUN-FROB value or
      EXP-FROB-30006a outcome; nothing about any EXP-QSP-70b731 run.
