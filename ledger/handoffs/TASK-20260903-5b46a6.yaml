  inference:
    policy: executor-implementation
    reasoning_effort: medium
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 288000
    memory_gb: 16
    maximum_runs: 60
    budget_note: >-
      Copied from the frozen contract with a bound: wall_clock_seconds_per_run
      7200 x maximum_runs 60 = 432000 s is the ceiling only if every run
      consumed its full window; the contract's total_cpu_hours 80 at
      maximum_workers 1 (288000 s) is the binding envelope and is what
      wall_clock_seconds carries. Per-run windows stay at 7200 s as
      frozen; memory_gb 16 is the contract's above-floor maximum_memory_gb,
      justified by the 5310 x 56751 cell.
  completion_gate:
    - >-
      G1: every planned run (the binary calibration run, the s = 1 run, the
      9 main (s, p) cells, the 3 s = 6 cells at D <= 6; re-runs only after
      an infrastructure stop) has a run directory with a manifest carrying
      a terminal status and the six required files; runs not started
      because a stopping rule fired, and cells aborted by pre-flight, are
      listed by name.
    - >-
      G2: raw-result.json and the analysis tables agree; every deficit,
      residual and fit value is reproducible from the raw per-cell records
      (rows, ncols, rank, koszul).
    - >-
      G3: every control is present and reported: CTRL-BINARY-CALIBRATION,
      CTRL-S1-SLICE, NULL-SUPPORT, NULL-TOPOLOGY, NEARBY-NON-CURVE-CUBIC,
      CTRL-P-LADDER, CTRL-CURVE-SPREAD, CTRL-CERTIFICATES,
      CTRL-MEMORY-PREFLIGHT, and the CTRL-CONFOUNDERS-NAMED statement.
    - >-
      G4: every manifest carries the meter's commit and per-file sha256,
      the deficit convention, the implementation commit and dirty-tree
      hash, seeds, parameters, timing, peak RSS, pre-flight counts,
      per-file sha256 of the run package, certificate results, and the
      inference block.
    - >-
      G5: the execution report is returned with stopping rules triggered,
      every deviation, and the observed values against each frozen
      criterion stated as observation.
    - >-
      G6: nothing outside experiments/EXP-PFDR-20ee58/ was written; no
      record was edited; no status changed.
  return_format: >-
    A short plain-text return listing: the run ids with terminal status;
    the binary calibration integers obtained; the s = 1 identity result;
    per-cell deficit vectors (D = 5..8) for SEM and each null with seed
    spreads; the deciding-cell result; the affine fit with CI; the
    p-ladder and curve-spread readings; the branch as declared by the
    pre-registered rule; aborted cells by name; any stop rule triggered
    and where; which of G1-G6 are met and which are not, with reasons; the
    inference block values. Observations only; no claim about the
    hypothesis; no summary files outside the write scope.
