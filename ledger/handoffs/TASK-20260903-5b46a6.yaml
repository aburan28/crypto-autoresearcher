  objective: >-
    Execute the frozen, approved contract EXP-PFDR-20ee58 exactly as
    specified: Stage 0 (zero compute, hard gate) the one-page derivation of
    (S2)-(S3) checked by hand (the degree-4 parts of E1 and E2; the
    counterexample f = a_1 + a_2 to f^2 = f); Stage 1 the shared F_p meter
    in MIXED mode (one free variable u) under the CUMULATIVE-multiplier
    deficit convention with the Koszul count, CALIBRATED on the committed
    GF(2) chained system at n = 12 (it must return deficit(3) = 1 and
    deficit(4) = 31 with null 0 before any prime-field number is read);
    Stage 2 the s = 1 slice at d = B in {4, 8} (generator list symbolically
    identical to IDEA-20260830-cb8e46's chained J; graded ranks recorded as
    a frozen fixture); Stage 3 the separating cells d = 2, s in {3, 4, 5},
    p in {4099, 16411, 65537}, 6 curves of generic j, planted targets,
    D in {5, 6, 7, 8}, arms SEM, NULL-SUPPORT, NULL-TOPOLOGY and the
    non-curve cubic, with the deciding cell (s = 3, D = 8) and s = 6 at
    D <= 6 only, (s = 6, D = 8) excluded by name; Stage 4 the p-ladder at
    s = 4 and the curve spread; Stage 5 (zero compute) the affine fit of
    the deficit(8) residual against s and the branch declaration M1 / M2 /
    M3 / unresolved by the pre-registered rule. Implement under
    experiments/EXP-PFDR-20ee58/ with implementation.md; one immutable run
    directory per planned run (granularity: one (s, p) cell over all
    curves, degrees and arms; the calibration run; the s = 1 run) under
    experiments/EXP-PFDR-20ee58/runs/<run-id>/ carrying manifest.yaml,
    command.txt, environment.json, stdout.log, stderr.log and
    raw-result.json per docs/evidence-and-reproducibility.md; an
    execution_report YAML; observations only, never interpretation beyond
    the contract's predefined branches.
  uncertainty_reduced: >-
    Whether KN-FIND-006's binary 8 dim V extra-syzygy deficit has any
    prime-field existence on the chained tree: M1 (characteristic-2
    artifact, deficit 0 at every D <= 8, the expected branch) against M2
    (chaining-graph property, deficit(8) affine in s with nonzero slope,
    p-independent, curve-independent) against M3 (neither); whether the
    support-matched null is exactly Koszul-only (deficit 0) within
    EXP-PFDR-fd901a's small-p budget; and whether the ported meter
    reproduces the binary known answer under the cumulative convention. A
    calibration miss or a nonzero null deficit beyond the budget is an
    instrument outcome and no twin value is read.
  inputs:
    - experiments/EXP-PFDR-20ee58/specification.yaml
    - ledger/hypotheses/H-PFDR-9aadc0.yaml
    - ledger/proposals/IDEA-20260903-cf63ad.yaml
    - ledger/decisions/DEC-20260903-93862f.yaml
    - ledger/decisions/DEC-20260903-8cdf8d.yaml
    - ledger/questions/RQ-PFDR-ae2fba.yaml
    - harness/macaulay_fp/ (the F_p meter from TASK-20260903-ba41aa, at its verified snapshot commit; mixed mode, cumulative convention, Koszul count, pre-flight gate)
    - harness/macaulay_fp/VALIDATION.md
    - ledger/handoffs/TASK-20260903-ba41aa.yaml
    - experiments/EXP-PFDR-fd901a/analysis.md (the rank-drop rate at p = 4099, the artifact budget; read only after that contract's snapshot archive verifies)
    - knowledge/findings/KN-FIND-006.md
    - experiments/EXP-DREG-001/DREG_harness.py
    - experiments/EXP-DREG-001/DREG_DEFICIT_CLOSED_FORM.md
    - ledger/proposals/IDEA-20260830-cb8e46.yaml
    - ledger/proposals/IDEA-20260808-11b8c7.yaml
    - docs/evidence-and-reproducibility.md
    - docs/claims-and-verification.md
    - ledger/handoffs/TASK-20260903-5b46a6.yaml
  constraints:
    - >-
      DEPENDENCY, BINDING: this contract requires exact F_p ranks in mixed
      mode under the cumulative convention and may not start before
      TASK-20260903-ba41aa has returned and its snapshot archive receipt has
      verified; refuse to start unless harness/macaulay_fp/ exists at a
      committed path with tests/test_macaulay_fp.py passing, and record the
      meter's commit and per-file sha256 in every manifest. ORDERING:
      dispatched after EXP-PFDR-fd901a has reported (its rank-drop rate is
      the artifact budget every null reading is compared against); if
      unavailable at dispatch, refuse and report.
    - >-
      Refuse to start unless experiments/EXP-PFDR-20ee58/specification.yaml
      is status approved with approved_by coordinator at a committed path
      in a verified snapshot archive. A message saying 'approved' is not an
      approval.
    - >-
      The preregistered prediction (NULL-SUPPORT 0; calibration 1 and 31
      with null 0; the M1 / M2 / M3 rule with its priors) and the criteria
      are read-only; any needed change is a versioned protocol_amendment
      under experiments/EXP-PFDR-20ee58/amendments/ requested from the
      Coordinator, never an edit.
    - >-
      Stopping rules are binding: stop before Stage 2 if the binary
      calibration does not return 1 and 31 with null 0; stop before Stage 3
      if the s = 1 slice is not symbolically identical to cb8e46's J; stop
      Stage 3 at the deciding cell if NULL-SUPPORT shows a nonzero deficit
      beyond the small-p budget on more than one seed; if SEM shows a
      nonzero deficit at the deciding cell, run the p-ladder and curve
      spread at s = 3 before advancing to s = 4.
    - >-
      Timeouts, OOM, crashes and pre-flight aborts (above 60,000 columns or
      4 GiB dense-equivalent working set) are failed_infrastructure or
      not-computable-in-budget with the cell named; never evidence about
      the deficit. The memory cap for this contract is 16 GB as frozen.
    - >-
      The deficit convention is identical across arms and identical to the
      calibration arm's; a deficit computed under a different convention,
      a subset-column rank, or a cell mixing arms with different frozen
      degree conventions invalidates the cell.
    - >-
      Record every deviation in the execution report and the manifest;
      never silently absorb one. Every planted decomposition carries a
      certificate re-verified by independent point addition; a failure
      invalidates the draw.
    - >-
      No Groebner degree is read; sol(D) is a covariate only; realised
      degree distributions of both null generators are reported.
    - >-
      No hypothesis, experiment, question or goal status change; no
      evidence record; observations only. An M2 branch is reported as the
      pre-registered branch and is NOT interpreted by the executor.
    - >-
      Write only under experiments/EXP-PFDR-20ee58/; never commit; never
      run git; never edit the specification, any hypothesis, or any other
      record.
    - >-
      Record the requested policy (executor-implementation, medium), the
      resolved model identifier, model_verified and fallback_used in every
      manifest's inference block and in the execution report; no Bedrock,
      no fallback, no degradation.
    - >-
      Seeds exactly as frozen: curve seeds 4101..4106 per prime; target
      seed 1 (seed 2 on the deciding cell only); null seeds 7, 11, 13, 17,
      19 per (cell, arm); non-curve cubic seeds 51, 53, 59.
  deliverables:
    - experiments/EXP-PFDR-20ee58/implementation.md
    - experiments/EXP-PFDR-20ee58/stage0-derivation.md ((S2)-(S3) written out and checked by hand)
    - experiments/EXP-PFDR-20ee58/stage2-s1-fixture.yaml (the symbolic identity with cb8e46's J and the recorded graded ranks)
    - one immutable run directory per planned run under experiments/EXP-PFDR-20ee58/runs/<run-id>/ with manifest.yaml, command.txt, environment.json, stdout.log, stderr.log, raw-result.json
    - experiments/EXP-PFDR-20ee58/analysis.md (deficit tables per arm, the affine fit with CI, p-ladder and curve-spread tables, branch declaration, aborted cells by name, tail checks, verdict against the frozen criteria as observation)
    - experiments/EXP-PFDR-20ee58/execution-report.yaml (per-run terminal status, stage report, stopping rules triggered, deviations, certificate results, pre-flight counts, inference block)
  artifact_paths:
