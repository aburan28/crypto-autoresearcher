handoff:
  id: TASK-20260801-012
  from: coordinator
  to: reviewer
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-022
  objective: >-
    Return PASS or REVISE on experiments/EXP-SMTH-001/specification.yaml at the
    TASK-20260801-011 snapshot. FIVE QUESTIONS DOMINATE AND EACH MUST BE ANSWERED
    EXPLICITLY AND SEPARATELY.
    (1) THE ATTAINABILITY DUTY, WHICH IS YOUR FIRST AND NAMED DUTY AND WHICH GETS ITS
    OWN DELIVERABLE FILE. Check ATTAIN-RR-SMTH-1 band by band and branch by branch -
    for M-0, M-5 (each of its three legs), M-1, M-2, M-4 and M-6, and for every rung of
    both frozen Bsm ladders, does some ACHIEVABLE measurement land there given this
    sampling design and these frozen thresholds? Redo the arithmetic yourself -
    C(513,2) = 131328, the factor-8 rate bands about the tabulated rho values, the KS
    threshold max(0.05, 1.63/sqrt(131328)), the two-sample threshold
    1.63*sqrt(2/131328), the expected smooth counts n*rho(u) at every rung, and the
    DECAY-1 threshold 100*rho(6)/rho(2). If ANY band or branch is unreachable at the
    chosen parameters, that is a REVISE. This duty exists because BATCH-021's map was
    exhaustive and honestly applied and its favourable branch D-2 was still
    arithmetically unreachable, so the experiment could not have confirmed the
    hypothesis even had it been true.
    (2) IS THE READING RULE GENUINELY PRE-REGISTERED - verify against Git yourself that
    the TASK-20260801-011 commit contains the contract and that its tree contains no
    run artifact of any kind; check that RR-SMTH-1 is exhaustive over the outcome space
    with a declared precedence order; check that its thresholds are inherited from
    EXP-DS-001 rather than invented, and that the two ADDED variables KS2-DS-1 and
    DECAY-1 are declared as additions with thresholds derived rather than chosen.
    (3) IS INT-1 THE INTERMEDIATE OR A NEW STAND-IN - this is the question the whole
    lane turns on. Attack the claim that the elementary symmetric functions of the
    roots of S_3(x_i, x_j, Z), encoded by ENC-B, are a faithful integer encoding of the
    half-arity Semaev partial map's image. Say whether a different faithful encoding
    could carry a different smoothness law, and whether the contract's scoping of the
    result to INT-1 and ENC-B is honest about that.
    (4) DOES EVERY DECISION VARIABLE VARY WITH THE THING IT MEASURES - attack the
    bijection argument in decision_variable_variation_check directly, and say whether
    any decision variable is a closed form in the protocol's own parameters in the way
    BATCH-021's charged-unit proxy was.
    (5) IS THE NULL GENUINELY MATCHED - matched in count, in range [1, p**2], and in
    code path, per docs/inventor-protocol.md section 3.2.
    Also rule explicitly on the declared D_formula reading and on the Bfb = 512
    departure from H-DS-001's test boundary. Independent session; do not author repairs.
  uncertainty_reduced: >-
    Whether an independent session concurs that every band and branch of the frozen
    reading rule is reachable, that the rule is frozen before the data, that the
    sampled quantity is the intermediate rather than another stand-in, and that no
    decision variable is degenerate.
  inputs:
  - experiments/EXP-SMTH-001/specification.yaml
  - ledger/hypotheses/H-SMTH-001.yaml
  - ledger/decisions/DEC-20260801-006.yaml
  - ledger/decisions/DEC-20260801-005.yaml
  - ledger/evidence/EV-DS-004.yaml
  - ledger/hypotheses/H-DS-001.yaml
  - experiments/EXP-DS-001/specification.v2.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-021/reviews/TASK-20260801-008/red_team_report.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-022/archives/TASK-20260801-011/snapshot_commit_receipt.json
  - docs/inventor-protocol.md
  - docs/claims-and-verification.md
  constraints:
  - INDEPENDENT SESSION REQUIRED. You did not author the contract.
  - Verdict PASS or REVISE only.
  - >-
    THE ATTAINABILITY CHECK IS A NAMED, EXPLICIT DUTY AND GETS ITS OWN DELIVERABLE
    FILE, attainability_check.md. A review that passes the contract without a
    band-by-band and branch-by-branch attainability verdict is itself incomplete, and
    this instruction exists so that the duty cannot be treated as implicit.
  - Redo every load-bearing arithmetic quantity yourself rather than accepting the contract's numbers.
  - If REVISE at any severity, the batch records non-execution for the run under the RC-22 one-cycle cap.
  - >-
    Test the pre-registration adversarially - try to construct a result the rule cannot
    classify, or classifies two ways, and say so if you find one.
  - >-
    Test INT-1 adversarially - name any way in which the sampled quantity could fail to
    be the half-arity Semaev intermediate, in the spirit of RT047-H2 and RT048-H1 which
    caught exactly that error in the previous sampling.
  - Confirm the contract expressly forbids the smoothness_abort flag-flip anti-pattern.
  - >-
    Confirm the contract reuses the EXP-DS-001 KS, rate-band and tail thresholds
    verbatim and redrafts none of them.
  - >-
    Confirm claim_tier toy; no S1_met, no support and no asymptotic path under any
    branch; promotion gates G1-G4 remain OPEN.
  - >-
    Confirm no file under experiments/EXP-DS-001/ is edited and that H-DS-001, H-IC-001
    and H-STR-002 are untouched.
  - >-
    Confirm the run declares manifest.yaml with the companion filenames
    tools/validate_ledger.py check_run requires - command.txt, environment.json,
    stdout.log, stderr.log, raw-result.json.
  - MAKE NO COMMIT. Do not author repairs; report defects.
  - Do not alter any ledger record.
  deliverables:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-022/reviews/TASK-20260801-012/contract_review.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-022/reviews/TASK-20260801-012/attainability_check.md
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-022/reviews/TASK-20260801-012/contract_review.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-022/reviews/TASK-20260801-012/attainability_check.md
  archived_by: TASK-20260801-013
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 5400
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
  - >-
    PASS or REVISE recorded with rationale bound to the TASK-20260801-011 snapshot,
    with SEPARATE explicit verdicts on (1) attainability of every band and every
    branch, delivered in attainability_check.md with the arithmetic redone
    independently, (2) pre-registration exhaustiveness and precedence, (3) whether
    INT-1 is the intermediate or a new stand-in, (4) whether every decision variable
    varies with what it measures, and (5) whether the null is genuinely matched in
    count, range and code path; plus explicit rulings on the declared D_formula reading
    and the Bfb = 512 departure.
