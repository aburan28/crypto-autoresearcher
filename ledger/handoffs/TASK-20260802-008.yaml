handoff:
  id: TASK-20260802-008
  from: coordinator
  to: coordinator
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-028
  role: coordinator
  archive_kind: snapshot
  objective: >-
    Commit the exact TASK-20260802-007 run package alone with this receipt, so
    the raw result is fixed in Git before any independent session reads it and
    before any reading clause is declared.
  uncertainty_reduced: >-
    Whether the instance-variance measurement is durable evidence rather than a
    working-tree artifact.
  inputs:
  - 'TASK-20260802-007 artifacts'
  constraints:
  - 'RUN ALONE. Stage exactly the sixteen paths in declared_commit_sets.TASK-20260802-008_snapshot.'
  - >-
    RUN tools/validate_ledger.py BEFORE STAGING and record the error count and
    any new line naming this run package. A NEW ERROR LINE ON THIS RUN IS A
    BLOCKING DEFECT AND GOES BACK TO THE EXECUTOR - it is the DEF-065-1 defect
    recurring.
  - 'DO NOT STAGE lpf001_driver.py, ivr001_driver.py, control_specification.yaml, reading_rule_ivr.yaml, specification.yaml, reading_rule.yaml, reading_rule_v2.yaml, the RUN-LPF-001-calib, RUN-LPF-001-plantz or RUN-LPF-001-measure packages, any tools/ file, ledger/goals/GOAL-ECDLP-001.yaml, ledger/hypotheses/H-LPF-001.yaml or any review file.'
  - >-
    RECORD ALL SEVEN NAMED SHA256 FIELDS - SPECIFICATION_SHA256,
    READING_RULE_V1_SHA256, READING_RULE_V2_SHA256, DRIVER_SHA256,
    CONTROL_SPEC_SHA256, RR_IVR_1_SHA256 and IVR_DRIVER_SHA256 - and REFUSE TO
    COMMIT if any differs from its bound value or if Git reports any of them as
    modified. THIS IS THE SELF-VOIDING CONDITION AT ITS MOST LOAD-BEARING
    ARCHIVE.
  - 'STATE NO INTERPRETATION, DECLARE NO READING CLAUSE, STATE NO DISPOSITION AND MAKE NO APPROVAL DETERMINATION. This receipt records that the artifacts exist and what they hash to, and nothing else.'
  - 'Commit message must contain TASK-20260802-008, TASK-20260802-007, EXP-LPF-001, RUN-LPF-001-ivr, RR-IVR-1, GOAL-ECDLP-001, BATCH-028.'
  - 'Do not push from this task.'
  deliverables:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/archives/TASK-20260802-008/snapshot_commit_receipt.json
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/archives/TASK-20260802-008/snapshot_commit_receipt.json
  archived_by: TASK-20260802-008
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 900
    memory_gb: 1
    maximum_runs: 1
  completion_gate:
  - >-
    Post-commit verifier accepts the exact sixteen-path diff and hashes; the
    validator run before staging with its output recorded and no new error line
    naming this run package; all seven named sha256 fields recorded and matching
    their bound values; no interpretation, no reading clause and no
    authorization stated.
