handoff:
  id: TASK-20261002-c5d9e7
  created_at: '2026-10-02'
  created_by: coordinator
  from: coordinator
  to: coordinator
  goal_id: GOAL-ECDLP2M-001
  batch_id: BATCH-4708f7
  lane: QSP-SUCC
  batch_composers: DEC-20261002-6e68d8 (round 1, TASK-20261002-55bec1) and DEC-20261002-0d2451 (round 2, TASK-20261002-1874c9)
  skill: /design-experiment (repair-design mode; no new hypothesis or experiment record)
  review_required: true
  review_required_note: >-
    True. The design gates the implementation, so it is reviewed by
    TASK-20261002-3b6a02 (JD1), TASK-20261002-323713 (JD2) and the blind
    TASK-20261002-c81b2e (JD3) under REVIEW-QSP-D-20261002-4708f7 before
    DEC-20261002-6e68d8 can accept it.
  title: >-
    Design the EXP-QSP-70b731 defect-return repair (QSP-SUCC): a repair design
    discharging D-1 to D-8, the carried conditions and CI-1 to CI-6 with
    executor work orders and acceptance checks, a per-cell I_indep route table
    from committed code, and, only if needed, amendment-v2.yaml inside
    R-AMEND-SCOPE
  objective: >-
    Read the frozen specification of EXP-QSP-70b731 and the archived validator
    report of TASK-20261002-7eb899, and write the repair design that two
    executors will implement under experiments/EXP-QSP-70b731/implementation/r1/
    with a successor plan experiments/EXP-QSP-70b731/trial-plan-r1.json.
    Decide, from the text, whether D-4 (I_indep resting on derivation (A),
    used on all census cells) and D-5 (where the blocking fixtures and
    controls run) can be discharged within the frozen fields; if not, and
    only then, write experiments/EXP-QSP-70b731/amendments/amendment-v2.yaml
    inside DEC-20261002-a63f13 R-AMEND-SCOPE. Zero runs; no instrument is run.
  uncertainty_reduced: >-
    Whether EXP-QSP-70b731 can be made executable as frozen, or only with an
    instrument-route or stage-order amendment, or not without a new record;
    and exactly what the executors must build so that no route choice is
    left to code.
  design_items:
    source: >-
      D-1 to D-8 and the carried conditions are DEC-20261002-e0aa2b
      defect_return, verbatim in substance; that decision is the authority
      where wording differs. CI-1 to CI-6, R-AMEND-SCOPE and R-ROUTE-PRIOR are
      DEC-20261002-a63f13's.
    items:
      - id: RD-1
        requirement: >-
          Discharge table. Every one of D-1 to D-8, the five carried
          conditions and CI-1 to CI-6 maps to (a) the specification clause or
          amendment clause it rests on, (b) a work order in WO-I (I_indep) or
          WO-R (runner and plan) precise enough to implement without further
          design, and (c) an acceptance check AC-n that a round-2 reviewer can
          run on synthetic cells and that can fail. Name which checks would
          fail the bound closure (PTM-D1).
      - id: RD-2
        requirement: >-
          Route table, from committed import-safe code (route_table_code, run
          by D-C3). For every cell the specification declares (stage 0;
          stage 1; C2 to C6; every census cell at n = 131) and every degree d
          it uses there: q, r, the bound max(2^(n'-r), d^(q+1)), its log2, the
          I_indep route (derivation (A), or a named substitute), and the
          reason. A substitute appears only where derivation (A) is shown
          infeasible by a stated cost argument against the specification's
          8 GB machine-protection ceiling, after you have looked for a
          derivation-(A)-faithful route that avoids a dense construction.
          Routes are keyed by cell name (CI-3).
      - id: RD-3
        requirement: >-
          D-4 calibration. Name the cells on which derivation (A) itself is
          cross-checked by C1 against I_direct before Band H, and show they
          exercise the code path Band H uses; the Stage-1 calibration
          exercises every route the census uses.
      - id: RD-4
        requirement: >-
          D-5 ordering. Read stages, controls C1 to C7 and stopping_rules;
          state where each blocking fixture and control runs relative to the
          census stages, and whether the text permits that order. If it does
          not, the order goes into the amendment (A2).
      - id: RD-5
        requirement: >-
          D-6 Stage 0. A mechanism in which the hand re-derivation of (A) at
          (n, n') = (4, 3) on X^2+X+1 and X^3+1 is produced and checked with
          no census code reachable, the blind_from paths' existence is
          confirmed, and M9 records a declared, checkable read set per run
          (never a constant). State who writes the hand note and when; no
          Stage-0 content is produced in this batch.
      - id: RD-6
        requirement: >-
          D-1, D-2, D-3, D-7, D-8 work orders. The manifest target is the
          run-record schema tools/validate_ledger.py check_run applies, with
          every AGENTS.md artifact-policy field (inference block, dirty-tree
          state, validity reason, dependency versions, command, commit);
          root-list certificate files for every N > 0 row, re-verified root by
          root by the wrapper; certificate_bearing counted from re-verified
          files on disk; M5 checked per stage before any headline;
          under-listing impossible or flagged; the checker without a fallback
          pass; internal RNG seeds declared; failed and expired attempts
          leaving a record validate_ledger.py can see.
      - id: RD-7
        requirement: >-
          Interface and layout. I_indep lives in
          experiments/EXP-QSP-70b731/implementation/r1/indep/ (written by
          TASK-20261002-e0b22e); the runner, writers, accounting, checker and
          Stage 0 mechanics in experiments/EXP-QSP-70b731/implementation/r1/runner/
          and r1/__init__.py (written by TASK-20261002-b72830). Fix the entry
          function, its arguments (the cell name, n, n', lambda) and its
          return schema (N, the root list as coefficient vectors over K, the
          route name, flags). State which unchanged modules of the bound
          closure, if any, the runner may reuse and at which digest; I_indep
          reuses none (CI-1).
      - id: RD-8
        requirement: >-
          Plan requirements for trial-plan-r1.json. All 20 trials with the
          specification's cells and candidate rule; the twenty run ids the
          session mints before TASK-20261002-b72830 (none equal to an earlier
          plan's or a bound directory's); the order from RD-4; a Linux
          requirement; task_id TASK-20261002-b72830 and approved_by null (an
          execution batch later rebinds it); supersession_reason naming
          DEC-20261002-5e691c R-CONTINUATION and DEC-20261002-a63f13 C-EQ;
          source_sha256 over the r1 files; specification_sha256 (and the
          amendment's sha256 if one is approved).
      - id: RD-9
        requirement: >-
          Synthetic test cells for the executors and reviewers (CI-6): a list
          of (n, n', modulus) with n outside {4, 7, 11, 12, 13, 31, 131} and n
          at most 18, chosen so that each route in the table is exercised on
          at least one synthetic cell.
      - id: RD-10
        requirement: >-
          Amendment, only if RD-2 or RD-4 shows it necessary. A
          protocol_amendment at experiments/EXP-QSP-70b731/amendments/amendment-v2.yaml:
          id the AMD id the session records in the queue's
          tasks_state_revisions before this card is dispatched; version 1 to
          2; kind additive; approved_by null with an approval block naming
          DEC-20261002-6e68d8; precedence over version 1; pre_data_assessment
          POST-DATA as to the owner session's exposure, with the statement
          that its author read nothing under runs/; each change labelled A1,
          A2, A3 or a tightening; the consequence of each change for S1 and
          for the pre-Band-H calibration; nothing outside R-AMEND-SCOPE. If no
          amendment is needed, say so per D-item in the design and write no
          amendment file.
  allowed_session_computations:
    authority: DEC-20261002-a63f13 R-WHO (1), stated in advance
    note: >-
      This producer holds no shell. It may ask the top-level session to
      perform these and only these, in <session scratchpad>/BATCH-4708f7/TASK-20261002-c5d9e7/,
      and embeds each command and its verbatim output in repair-design.yaml as
      a design figure, never a result. Code is run as written in the design
      and extracted by the pinned method. The session never exports or copies
      a whole git tree into scratch.
    items:
      - D-C1 extract each committed code block of repair-design.yaml by the pinned method and compute its sha256
      - >-
        D-C2 a syntax check and an import-safety check of each block in a
        fresh /usr/local/bin/python3 (CPython 3.11.15; importing executes
        nothing), and a yaml.safe_load parse of each returned YAML file,
        reported verbatim and never repaired
      - >-
        D-C3 run route_table_code through its __main__ entry: pure integer
        and floating-point arithmetic on the declared cells, degrees and the
        bound formula (q, r, B, log2 B, and any size estimate the design
        defines), relayed verbatim
      - >-
        D-C4 run candidate_count_code through its __main__ entry: counting
        polynomials of F_2[X] by exact degree under the specification's
        candidate rule (no field arithmetic on any cell), relayed verbatim
      - >-
        D-C5 sha256 of experiments/EXP-QSP-70b731/specification.yaml, the six
        trial-plan*.json files, the eight files of
        experiments/EXP-QSP-70b731/implementation/*.py, tools/validate_ledger.py
        and tools/experiment_execution.py, relayed verbatim
      - >-
        D-C6 extract, with a stated one-line python3 command, the trial ids,
        run ids and depends_on lists of the six trial-plan*.json files, relayed
        verbatim
    forbidden: >-
      Anything else. No instrument and no file of the bound closure is run or
      imported; no N, root, gcd with X^(2^n) - X, H polynomial or decision
      statistic is computed on any cell, declared or synthetic; nothing under
      experiments/EXP-QSP-70b731/runs/ is listed, read or imported; no
      tools/experiment_execution.py mode is run.
  inputs:
    - experiments/EXP-QSP-70b731/specification.yaml
    - coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-2d2fa1/reviews/TASK-20261002-7eb899/run-validation.yaml
