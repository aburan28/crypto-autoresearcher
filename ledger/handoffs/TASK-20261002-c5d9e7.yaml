    reasoning_effort: null
    fallback_allowed: true
    fallback_note: Runtime inheritance; backend substitution only. Record fallback_used true with the served model in the design.
    degraded_allowed: false
    independent_session_required: true
    independent_session_note: >-
      A fresh Coordinator-role /design-experiment session that did not author
      DEC-20261002-a63f13, either review plan, DEC-20261002-e0aa2b,
      DEC-20261002-5e691c or DEC-20261002-86a7e0; is not
      coordinator-qsp-run-20260921 (session wt-qsp-run); is not a producer,
      reviewer or composer of another lane in flight; and will not be an
      executor, reviewer or composer of BATCH-4708f7.
  budget:
    wall_clock_seconds: 14400
    memory_gb: 2
    maximum_runs: 0
  completion_gate:
    - repair-design.yaml exists at its declared path, is new and parses (D-C2); amendment-v2.yaml exists only if RD-10 required it, and parses
    - every RD item and every D-item, carried condition and CI item maps to a named clause in the discharge table
    - the route table covers every declared cell and degree, from committed code, with each substitute route justified by a stated cost argument
    - the D-5 reading and the D-6 mechanism stated; no Stage-0 content produced
    - WO-I and WO-R with acceptance checks that can fail, and the interface fixed
    - every code block import-safe with extraction method and reference sha256
    - no computation outside D-C1 to D-C6; zero runs; no TQ sentence
  review_plan: coordination/review/qsp-succ-d-20261002-4708f7/review-plan.yaml
  dispatch_preconditions:
