    - the conditional AMD id minted (random 6-hex token checked by a whole-tree search; allocate_id.py has no amendment type) and recorded in the queue's tasks_state_revisions (DEC-20261002-a63f13 R-IDS (a))
    - the R-QSP-RETURN check (bus; no live QSP claim; no foreign commit under experiments/EXP-QSP-70b731/)
    - a fresh Coordinator-role session meeting the independence note
    - the session's scratch subdirectory <session scratchpad>/BATCH-4708f7/TASK-20261002-c5d9e7/ exists for D-C1 to D-C6
