  read_scope_note: >-
    The bound closure (implementation/*.py) may be read to write WO-R; the
    I_indep work order WO-I is stated from the specification's I_indep
    definition and derivation (A) as H-QSP-cd0c90 and IDEA-20260916-3f7a1c
    record it, and carries no code of the bound i_indep.py, gf2_poly.py or
    i_direct.py. Not read: this batch's reviews/ and composition/ directories,
    in particular reviews/TASK-20261002-c81b2e/. Excluded reads
    (DEC-20261002-a63f13 R-READ): experiments/EXP-QSP-70b731/runs/;
    experiments/EXP-FROB-30006a/; the ref
    origin/cursor/semaev-2015-audit-program-5b8b; PR 1377; the branch
    cursor/ecdlp2m-revision-design-3d1a; the in-flight review and composition
    directories under BATCH-f6b7c5/ and BATCH-2e63c3/; every BATCH-ccfdc6
    record; every path in the specification's blind_from;
    ledger/evidence/EV-QSP-a6aa4b.yaml; the DEC-20260917-* decisions;
    knowledge entries carrying EXP-QSP-33b442 counts. A read_scope is widened
    only by a Coordinator decision.
  write_scope:
    - coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-4708f7/design/TASK-20261002-c5d9e7/
    - experiments/EXP-QSP-70b731/amendments/amendment-v2.yaml
  write_scope_note: >-
    amendment-v2.yaml is written only under RD-10. If written, the session
    appends its path to this card's queue artifact_paths before the snapshot
    (the queue's R-AMD-PATH note).
  constraints:
    - >-
      DD-1 Write exactly repair-design.yaml under the design directory, and
      amendment-v2.yaml only under RD-10; both new. Edit no specification,
      plan, implementation file, decision, hypothesis, proposal, question,
      plan of review or goal record. Mint no identifier; use the AMD id the
      session recorded.
    - DD-2 Discharge RD-1 to RD-10 by number in a discharge table.
    - >-
      DD-3 Every code block (route_table_code, candidate_count_code and any
      other) is a literal block scalar of repair-design.yaml with its
      extraction method and reference sha256 pinned, import-safe, and selects
      cells by name.
    - DD-4 Session computations limited to D-C1 to D-C6; each command and output embedded as a design figure.
    - DD-5 No computation of N, a root, a gcd with X^(2^n) - X, an H polynomial or a decision statistic on any cell (tripwire TQ-3).
    - DD-6 The amendment, if any, stays inside R-AMEND-SCOPE (tripwire TQ-2) and never touches the preregistered prediction or the criteria.
    - DD-7 No run value of EXP-QSP-70b731 or EXP-QSP-33b442; no reading of H-QSP-cd0c90's standing or of EV-QSP-a6aa4b (TQ-4).
    - DD-8 Every citation with provenance (recalled, retrieved, kb, internal); recalled references support nothing.
    - >-
      DD-9 YAML hygiene. Every prose value containing a colon followed by a
      space is a folded block scalar; code is a literal block scalar; check
      list-item and key indentation; write a complete skeleton first and
      fill it section by section; ask the session for D-C2's parse of every
      file you wrote before you hand back.
    - DD-10 Interpreter actually present is /usr/local/bin/python3, CPython 3.11.15; no random.binomialvariate or other 3.12+ API in any block or work order.
  deliverables:
    - >-
      repair-design.yaml with: the discharge table (RD-1); the route table
      and its code (RD-2, D-C3 output); the D-4 calibration statement (RD-3);
      the D-5 ordering reading (RD-4); the Stage 0 mechanism (RD-5); WO-I and
      WO-R with acceptance checks AC-n (RD-6, RD-7); the plan requirements
      (RD-8); the synthetic test-cell list (RD-9); the amendment-necessity
      statement per D-item (RD-10); the D-C4 to D-C6 outputs; every code
      block with extraction method and reference sha256; the read attestation
      (every path read, in order); and the served model with fallback_used
    - experiments/EXP-QSP-70b731/amendments/amendment-v2.yaml, only under RD-10
  artifact_paths:
    - coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-4708f7/design/TASK-20261002-c5d9e7/repair-design.yaml
  archived_by: TASK-20261002-f0f7e0
  inference:
