      GOAL-ECDLP2M-001 queue; a published lane claim on BATCH-4708f7 (TTL
      about 300 minutes) with the goal-wide live count at most 2 before the
      claim (DEC-20261002-a63f13 R-SLOT); released on return.
  runs_launched: 0
