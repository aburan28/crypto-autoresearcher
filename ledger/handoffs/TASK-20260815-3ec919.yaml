  - One red-team report binds the exact snapshot commit and reaches a scoped PASS, REVISE, or FAIL verdict with individually named objections.
  - The authorization surface, the cost model, the stopping rules, the controls, the preservation manifest, the resource_incomplete disposition, and the scope statement are each attacked and reported separately.
  - Estimates and package hashes are INDEPENDENTLY RECOMPUTED, not copied, and every optimistic assumption found is flagged as optimistic.
  - The report states explicitly that failing to break the plan is not evidence the plan is correct, and creates no experiment, JINV, ECDLP, status, closure, or breakthrough authority.
