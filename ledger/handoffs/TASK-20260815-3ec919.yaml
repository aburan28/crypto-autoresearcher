  objective: >-
    Try to falsify the planning-gate package: attack its cost model, its hidden
    assumptions, its stopping rules, its controls, and above all any place where the
    document quietly authorizes, presumes, or makes automatic something the goal-head
    next_action forbids.
  uncertainty_reduced: >-
    Whether the plan's estimates survive an adversarial recomputation rather than a
    reading, and whether any sentence in it functions as a grant of implementation,
    execution, or scope that the batch does not authorize.
  inputs:
  - Completed producer TASK-20260815-f04b54 and content-first snapshot TASK-20260815-39fd27.
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-25e27c/resource-implementation-planning-gate/tasks/TASK-20260815-f04b54/planning-gate.yaml
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-25e27c/resource-implementation-planning-gate/tasks/TASK-20260815-f04b54/preservation-manifest.yaml
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-25e27c/resource-implementation-planning-gate/archives/TASK-20260815-39fd27/snapshot-receipt.json
  - The GOAL-ENDO-001 goal head next_action and its eighteen preservation obligations, campaign_budget, completion_criteria C1-C4, and pause_conditions P1-P3.
  - DEC-20260813-d14d6b, EV-JINV-55ff88, the terminal v5 and reconciliation lineage, and the approved read-only v6 package.
  constraints:
  - This is an INDEPENDENT session at review-adversarial, xhigh, and is not degradable. It is not a continuation of the producer and not a continuation of the validator. Refuse rather than attack at a lower tier.
  - READ THE SNAPSHOT COMMIT, not the working tree.
  - 'ATTACK THE AUTHORIZATION SURFACE FIRST. Find any sentence, field, default, or omission by which the package authorizes, presumes, schedules, or makes automatic: implementation, Phase B, a control or experiment, target or curve access, JINV or transport work, N18, science, status change, ECDLP, closure, breakthrough, publication, network write, or execution. Quote it exactly. This is the highest-value finding available in this batch.'
  - 'ATTACK THE COST MODEL. Independently recompute the estimates rather than reading them. Name what hides in each: constant factors, memory beside time, time-memory tradeoffs, parallelization assumptions, I/O amplification, retained bytes, shard counts, and superpolynomial overhead concealed in a smooth-looking figure. Flag every optimistic assumption as optimistic.'
  - 'ATTACK THE STOPPING RULES for permissiveness: is any rule unfalsifiable, evaluable more than once, or written so that a budget exhaustion could be read as a pass or as a negative result? A rule that cannot refuse is not a rule.'
  - 'ATTACK THE CONTROLS: is each matched null object genuinely the same shape as the thing measured, and does the named parameter actually destroy the signal when increased? A control that cannot fail is decoration.'
  - 'ATTACK THE PRESERVATION MANIFEST: find any of the eighteen obligations that has been dropped, softened, reworded away from its verbatim form, bound to a value that does not match the committed tree, or resolved by an argument rather than by an artifact. Independently recompute the three approved v6 package hashes and sizes and the two suite manifest hashes; copying the producer''s numbers is forbidden.'
  - 'ATTACK resource_incomplete: find any route by which the package effectively clears, relaxes, re-disposes, or takes credit against the fail-closed disposition, including compression, deduplication, hash-only substitution, omitted cells, and budget widening.'
  - 'ATTACK THE SCOPE STATEMENT: find any place where a toy-scale, one-N N=19507 fact is written so that a later reader could carry it to cryptographic scale, to a second N that does not exist, or to an ECDLP claim.'
  - Name the CHEAPEST FALSIFICATION of each contract you attack. A concrete counterexample beats a paragraph.
  - Return PASS only if you found zero material objection. Otherwise REVISE or FAIL with explicit objections. Failing to break the plan is NOT evidence the plan is correct, and your report must say so. No verdict of yours is experiment evidence, JINV evidence, ECDLP evidence, a status change, a closure, or a breakthrough.
  - Write only inside your declared write_scope, which is disjoint from the validator's. Do not read, wait for, or coordinate with the validator. Never commit.
  - State plainly in the report that on this harness every policy alias currently falls back to one backend, so this review, the validator's review, and the reviewed work resolve to models on the SAME backend, and 'independent' means independent session, context, and a from-scratch reading rather than independent judgement from a different model family.
  - Record requested policy alongside the model that actually answered. If this session cannot honour review-adversarial at xhigh, REFUSE rather than downgrade. No fallback, no degradation, no Bedrock.
  - budget.maximum_runs=1 IS ONLY THE dispatch_queue.v1 MINIMUM POSITIVE SCHEMA BOUND AND IS NOT A RUN AUTHORIZATION. This task executes ZERO experiment runs.
