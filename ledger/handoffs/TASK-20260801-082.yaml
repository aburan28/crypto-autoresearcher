handoff:
  id: TASK-20260801-082
  from: coordinator
  to: red-team
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-027
  experiment_id: EXP-LPF-001
  hypothesis_id: H-LPF-001
  run_id: RUN-LPF-001-measure
  objective: >-
    Try to falsify the interpretation, the scope and the alternative-class
    declaration of whatever the measurement shows - in BOTH directions. If it looks
    like agreement with Dickman, attack the agreement; if it looks like a
    departure, attack the departure. Name the strongest alternative explanation for
    the observed distribution that is not the one the reading rule will assign.
  uncertainty_reduced: >-
    Whether the disposition the frozen rule is about to assign survives an
    adversary who wants it to be wrong.
  inputs:
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-measure/
  - experiments/EXP-LPF-001/results/measure/
  - experiments/EXP-LPF-001/results/calib/
  - experiments/EXP-LPF-001/reading_rule_v2.yaml
  - experiments/EXP-LPF-001/specification.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-026/reviews/TASK-20260801-068/
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-027/archives/TASK-20260801-080/snapshot_commit_receipt.json
  constraints:
  - >-
    INDEPENDENT SESSION. You did not author or execute any artifact under review,
    you did not serve TASK-20260801-077, and you do not read TASK-20260801-081's
    report.
  - >-
    ATTACK IN BOTH DIRECTIONS. A red team that only attacks favourable outcomes is
    an asymmetric instrument. State explicitly what you would have said had the
    result gone the other way.
  - >-
    CHECK THE ALTERNATIVE-CLASS RESTATEMENT FOR COMPLETENESS AND FOR SOFTENED
    WORDING. ALT-CLASS-LPF-1's uncertified classes V1 through V12 as restated by
    RR-LPF-2, and ABS-REL-LPF-1, must travel with any distributional statement. A
    DISTRIBUTIONAL RESULT STATED WITHOUT ITS UNCERTIFIED LIST IS AN OVERCLAIM BY
    OMISSION, and that is the specific failure you are hunting.
  - >-
    CARRY THE RTB-054-6 LIMB B DECLARATION INTO EVERY LIMB B OBJECTION. LIMB B is
    not a symmetric 8x test at these cells - the uniform arm already sits at 4.571
    of an 8.0 ceiling at bits-16 u=5, leaving about 1.75x headroom - so a band exit
    there is a weaker fact than [1/8, 8] makes it look, and a NON-exit is
    correspondingly weaker evidence of agreement.
  - >-
    READ DIRECTION ONLY FROM STAT-RATE-u, per OPEN-RR052-D as ruled and extended. A
    STAT-KS-DICK band exit is non-directional and same-signed excursions across
    cells are NOT directional agreement.
  - >-
    CARRY RT049-B6 SHARPENED - the factor base measured IS the narrow small-x
    window, so a departure could be a property of the window and a non-departure is
    a non-departure for that base only.
  - >-
    ATTACK THE SCOPE HARDEST OF ALL. Two toy cells at p = 46663 and p = 767551 with
    D = 2**32 and 2**40. Name every step of any argument that would carry this
    upward and say where it fails. NOTHING HERE TRANSFERS TO CRYPTOGRAPHIC SCALE.
  - >-
    APPLY THE CONTROLS-BEFORE-BELIEF TEST of docs/inventor-protocol.md section 3 -
    ask what the measured quantity SHOULD do as the parameter meant to destroy the
    signal increases, and say whether it does.
  - >-
    STATE dominated_by AND A QUANTITATIVE sota_delta. dominated_by may not be null,
    and an unchecked null is a fabrication under AGENTS.md rule 5.
  - >-
    DO NOT SELECT A BRANCH and do not state the disposition; TASK-20260801-083 owns
    that. Write objections and falsification routes.
  - 'MAKE NO COMMIT; TASK-20260801-083 archives this report.'
  - >-
    Record inference honestly (requested review-adversarial, independent session),
    and every YAML written must parse.
  deliverables:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-027/reviews/TASK-20260801-082/red_team_report.yaml
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-027/reviews/TASK-20260801-082/red_team_report.yaml
  archived_by: TASK-20260801-083
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 7200
    memory_gb: 8
    maximum_runs: 1
  completion_gate:
  - >-
    Objections and falsification routes filed in both directions with the
    counterfactual stated; the alternative-class restatement checked for
    completeness and softened wording with V1 through V12 enumerated; the LIMB B
    declaration carried into every LIMB B objection; direction read only from
    STAT-RATE-u; RT049-B6 carried sharpened; the scale gap attacked step by step;
    the controls-before-belief test applied; dominated_by non-null and sota_delta
    quantitative; no branch selected and no disposition stated; no commit made.
