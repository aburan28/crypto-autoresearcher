        closure, rc_b or certificate value.
    - id: SC-4
      text: >-
        EXTRACTION VALIDATION, performed by the script and recorded: V1 pool
        counts per group (40 / 5 / 5 / 5 / 5 / 10 / 10 / 5 / 1 x 5), unique
        labels and keys, and the sha256 order rule; V2 every curve-kind x_R in
        [2^10, 2^19), the script's OWN S_3 descent equal to the archived E_hex,
        and 64 random assignments per curve-kind system (declared seed
        20260926401) evaluated against direct F_{2^19} evaluation of S_3; V3
        the codec round trip and the archived E_sha256 for every pool system;
        V4 the curve literals and modulus equal to the specification's; V5 the
        exact key sets. Record the sha256 of blind-inputs.json and
        blind-inputs-key.json. Any failure is a STOP; nothing is committed with
        a failed validation.
