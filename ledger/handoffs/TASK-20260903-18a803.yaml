handoff:
  id: TASK-20260903-18a803
  from: coordinator
  to: idea-generator
  objective: >-
    Specify a falsifiable ML/RL mechanism for navigating ordinary
    prime-field isogeny graphs while jointly choosing factor-base
    presentations, with the aim of finding summation-polynomial point
    decomposition systems whose measured Groebner/root-solving cost is lower
    than matched baselines on held-out prime fields.
  inputs:
    - AGENTS.md
    - agents/idea-generator.md
    - docs/inventor-protocol.md
    - docs/target-result-profile.md
    - docs/claims-and-verification.md
    - docs/task-lifecycle.md
    - templates/research-records.md
    - ledger/goals/GOAL-ECTD-001.yaml
    - ledger/questions/RQ-ECTD-001.yaml
    - ledger/proposals/IDEA-20260903-47f358.yaml
    - analysis/isogeny-dreg-search/DESIGN.md
    - tools/isogeny_dreg_search.py
    - tools/isogeny_dreg_search_fast.py
    - tests/test_isogeny_dreg_search.py
    - tests/test_isogeny_dreg_search_fast.py
    - experiments/EXP-ECTD-001/specification.yaml
    - experiments/EXP-ECTD-9e4248/specification.yaml
    - ledger/hypotheses/H-ISO-001.yaml
    - ledger/evidence/EV-ISO-001.yaml
    - ledger/evidence/EV-ICINV-343679.yaml
    - arXiv:2602.02972v2
    - IACR-ePrint-2017-609
  constraints:
    - >-
      Zero experiment runs and zero implementation. This task designs the
      mechanism and protocol boundary only; it may not create an H-*, EXP-*,
      EV-*, DEC-*, KN-*, or breakthrough record.
    - >-
      Treat the search object as a pair: an F_p-isomorphism-class vertex in an
      ordinary F_p-isogeny class, and a typed factor-base / decomposition
      presentation. Do not define an environment that changes only curve
      coefficients while holding a class-constant presentation fixed.
    - >-
      Reuse the existing enumerator, exact census, codomain order checks, and
      F1/F2/F3 meters as correctness or baseline instruments. Learned scores
      may schedule measurements but may never replace them as evidence.
    - >-
      Include actions for legal small-degree rational isogeny moves, stop or
      restart, factor-base map family and parameters, decomposition arity or
      chain shape, and solver settings only where those settings are charged
      and compared fairly. Illegal actions must be masked deterministically.
    - >-
      The primary reward must be derived from actual solver telemetry on the
      same normalized polynomial system: wall time, peak memory, maximum
      Macaulay matrix size or row operations, solving degree, and verified root
      recovery. Proxy-only reward cannot satisfy success. Timeouts, OOMs,
      crashes, and invalid systems are censored operational outcomes with a
      predeclared penalty and may not be read as hardness evidence.
    - >-
      Prevent reward hacking: require on-curve and isogeny certificates,
      equivalent relation semantics, factor-base cardinality/density matching,
      target-point and seed matching, root verification, no instance-specific
      solver warm caches, and full preprocessing plus isogeny-evaluation cost.
    - >-
      Generalization is the decisive test. Split by prime and isogeny class,
      not by individual graph vertices. Hold out at least one bit-size band and
      one structural family; forbid train/test leakage through isogenous
      vertices, cached Groebner bases, or repeated target points.
    - >-
      Specify random walk, uniform presentation sampling, greedy best-first,
      Bayesian or bandit search where feasible, and exhaustive-oracle results
      at small p as baselines. RL must beat the best baseline at an equal
      end-to-end evaluation budget on held-out primes, not merely its own
      untrained policy.
    - >-
      Include a two-stage fidelity scheme only if every promoted survivor is
      re-measured by the true solver. State the bias introduced by the cheap
      screen and retain rejected as well as promoted samples.
    - >-
      Apply the proof_search_map audits: exact baseline reproduction,
      observation collisions, quantifier order, nearby-object/proves-too-much
      control, and method ceiling. Carry dominated_by and quantitative
      sota_delta across time, memory, and data/query axes.
    - >-
      The design must distinguish a presentation-level constant-factor
      improvement from an end-to-end ECDLP exponent improvement. No positive
      design outcome changes the Pollard-rho frontier by itself.
    - >-
      Every external citation carries provenance recalled, retrieved, kb, or
      internal. The local knowledge search returned an empty-index diagnostic;
      absence there may not support novelty.
    - >-
      Do not use or propose Amazon Bedrock. Record the exact requested policy,
      resolved model, session independence state, fallback state, and any
      unverified source limitation in the runtime receipt.
  deliverables:
    - coordination/goals/GOAL-ECTD-001/batches/BATCH-2b018c/tasks/TASK-20260903-18a803/mechanism-card.yaml
    - coordination/goals/GOAL-ECTD-001/batches/BATCH-2b018c/tasks/TASK-20260903-18a803/rl-environment-spec.yaml
    - coordination/goals/GOAL-ECTD-001/batches/BATCH-2b018c/tasks/TASK-20260903-18a803/proof-search-map.yaml
    - coordination/goals/GOAL-ECTD-001/batches/BATCH-2b018c/tasks/TASK-20260903-18a803/source-novelty-audit.yaml
    - coordination/goals/GOAL-ECTD-001/batches/BATCH-2b018c/tasks/TASK-20260903-18a803/runtime-session-receipt.json
  artifact_paths:
    - coordination/goals/GOAL-ECTD-001/batches/BATCH-2b018c/tasks/TASK-20260903-18a803/mechanism-card.yaml
    - coordination/goals/GOAL-ECTD-001/batches/BATCH-2b018c/tasks/TASK-20260903-18a803/rl-environment-spec.yaml
    - coordination/goals/GOAL-ECTD-001/batches/BATCH-2b018c/tasks/TASK-20260903-18a803/proof-search-map.yaml
    - coordination/goals/GOAL-ECTD-001/batches/BATCH-2b018c/tasks/TASK-20260903-18a803/source-novelty-audit.yaml
    - coordination/goals/GOAL-ECTD-001/batches/BATCH-2b018c/tasks/TASK-20260903-18a803/runtime-session-receipt.json
  archived_by: TASK-20260903-5026a1
  inference:
    policy: research-deep
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 3600
    memory_gb: 4
    maximum_runs: 1
    experiment_maximum_runs: 0
  completion_gate:
    - The MDP and every typed state, action, transition, terminal state, and illegal-action mask are explicit.
    - Actual solver telemetry is the primary reward and all proxy promotion paths end in true-solver remeasurement.
    - The train, validation, and held-out-prime split blocks every named leakage path.
    - Equal-budget random, greedy, bandit or Bayesian, and exhaustive-small-p baselines are specified.
    - Controls, budgets, stopping rules, artifacts, falsification criteria, and the exact claim ceiling are complete.
    - Every artifact parses and the runtime receipt hash-binds the other four deliverables.
  review_plan: null
