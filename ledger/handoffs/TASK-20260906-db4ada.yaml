  review_plan:
    plan_of_record: coordination/goals/GOAL-ECRANK-002/batches/BATCH-523fe1/review-plan.yaml
    claim_under_review: >
      The run records of EXP-ECRANK-73275e v1 (R1-R8) as frozen and approved by
      DEC-20260906-37d020: whether the decidable success criterion G1/G2 was met
      or missed EXACTLY as pre-registered (frozen slope window [0.699, 1.301],
      per-decade [5, 20], exact ops_cap_respected boolean, all controls
      IV-1..IV-9 untriggered-or-voided exactly as the rules state), and nothing
      beyond it. This round reviews the run records only: it does NOT promote
      C1, does NOT close anything, and does NOT touch the UNPROMOTED closure
      candidate of DEC-20260905-7adca0 (IMP-2; review-breakthrough at max,
      never degraded).
    coordinator_prior: >
      Recorded BEFORE any reviewer runs (full text in the plan of record).
      Expected: R2 audit PASSES on the snapshot-bound stream (the predecessor
      draw stream is deterministic and its sub-box construction is declared in
      committed source); R3 (n = 6) finds certified elliptic instances (a
      single univariate quadratic, no measured local obstruction); R5 (n = 8)
      is GENUINELY UNCERTAIN at the toy caps and a zero there is a first-class
      F3_n8 outcome; the run package itself should be HOLDABLE because the
      SR-3/SR-9/SR-10 discipline was designed in exactly because the
      predecessor package needed a pre-archive repair. Where a failure would
      hide, if there is one: (i) the counted-op accounting (an undercount
      silently breaches the frozen cap); (ii) the exactness of the
      ops_cap_respected boolean; (iii) control comparability between R6/R7
      and the construction arms.
    joints:
    - joint: 'J1 run-record integrity, determinism, and metric honesty'
      assigned_to: TASK-20260906-db4ada (validator)
      attack_plan: >
        Re-parse all eight manifests against the nested run: record schema and
        the artifact policy; re-check seeds against replication.seeds exactly;
        recompute the counted-op total from the raw op ledger of R3 and R8 and
        confirm the EXACT ops_cap_respected boolean (no 1% band); verify
        checkpoints every 1e7; verify R4 replay matches R3 deterministically;
        verify the frozen-prediction-only comparison with no post-hoc
        re-scoring anywhere.
    - joint: 'J3 controls, invalidations, and scope honesty'
      assigned_to: TASK-20260906-db4ada (validator)
      attack_plan: >
        Verify IV-1..IV-9 outputs are present and unvoided-or-voided exactly
        as invalidation_rules state; verify the R6 null object and the R7
        known-false objects fail as designed; verify the pre-analysis
        validation checks (run count, schema, seeds, raw/summary agreement,
        control comparability, deviations) in the execution report.
    - joint: 'J4 cost model and exhaustion inertness'
      assigned_to: TASK-20260906-db4ada (validator)
      attack_plan: >
        Recompute counted-op totals from the raw op ledger for R3, R5, and
        R8; confirm no run reports a result at or beyond the cap; confirm
        exhaustion (if any) is reported as exhaustion, never as a
        mathematical outcome; verify the IC-1 exclusion counts [SR-11] and
        the dual wall semantics [SR-10].
    blindness:
      within_round: >
        The validator (db4ada) and the red-team (1dad98) may not read each
        other's reports; each attests to exactly what it read.
      lifted_for: []
    proves_too_much:
      failure_signature: >
        The pipeline reports certified elliptic instances while the R7
        known-false objects (n = 6 and n = 8) or the IV-5
        corrupted-reconstruction self-test are NOT rejected as designed.
      objects:
      - 'R7 known-false at n = 6 and n = 8 (solver must find no instance where none exists)'
      - 'IV-5 corrupted-reconstruction self-test (audit must fail on the corrupted stream and void, never continue partially)'
    blind_rederivation:
      what: >
        Cross-check only (the BLIND re-derivation is the red-team's):
        recompute, from the recorded per-draw log and the declared |S|, the
        expected planted-meet count and compare it against the run records.
      blind_from: []
    procedure_deviations: []
