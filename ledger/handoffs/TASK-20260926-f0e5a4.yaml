  constraints:
    - id: VC-1
      text: >-
        BUILD FROM THE STATEMENT, WITH YOUR OWN GF(2) ARITHMETIC. Your own
        F_{2^17} arithmetic modulo t^17 + t^3 + 1; your own S_3 from
        KN-TECH-b18366, self-tested on at least 100 point pairs of the archived
        curve; your own descent E_S3(x_R) by TWO routes that must agree
        (symbolic expansion in F_{2^17}[v_0..v_17] with v^2 = v, and
        interpolation of each output bit from direct evaluation); your own
        E_layout decoder (object.E_layout: 17 rows, bit j = column j of
        mu_order(2, 18), degree ascending then ascending sorted index tuple);
        your own Boolean-ring monomial product, XOR and degree; your own
        exhaustive 2^18 evaluator. Import NOTHING from this repository: not
        crypto_autoresearcher (any module), not any impl/ or verifier/ module,
        and no sys.path insertion pointing at src/ or at an impl/ or verifier/
        directory. numpy may be used as a container. Record ambiguities and
        your reading of each.
    - id: VC-2
      text: >-
        INSTANCE BINDING AND KEPT PART. Parse each certificate's key and find
        its system in instances.jsonl.gz (fresh keys are "<ARM>:<slot>:<role>";
        archived arms keep the RC-1 keys; NELL-A20 keys are
        "NELL-A20:<label>"; a key with no system, or two, is a finding). Check
        sha256(json.dumps(E_hex)) against the record's E_sha256. For EVERY
        system of instances.jsonl.gz (not only certified ones), check the kept
        part per arm against your own construction: N-CONV quadratic columns
        equal those of your E_S3(x_R) and no low-column bit lies outside your
        S_L (object.union_support, from your own E_S3(0) and E_S3(t^j));
        N-CONVL quadratic and linear columns equal your E_S3(x_R) and its
        constant bits lie on S_L cap column 0, differ from B's own bits and
        are not all zero; N-CONV17 quadratic columns equal your Q_k and low
        bits lie on S_L; N-ELL144 rows 0..15 lie inside your U and row 16 is
        v_0 + v_9 + c; S3-* systems equal your E_S3(x_R); x_R of every N-CONV,
        N-CONVL and S3-* system equals the xr144 slot table built from
        instance-sets.json. Report the per-arm counts of systems checked and of
        violations.
    - id: VC-3
      text: >-
        VERIFY EVERY CERTIFICATE LINE, every format. flat-v1: build sum over
        (mu, k) in C of mu*f_k in B and check it equals exactly the constant 1.
        wdag-v1: check rules (a)-(e) of object.certificate_format with your own
        arithmetic: topological order, every |mu| <= 2 and 0 <= k <= 16, every
        child used in prods of degree <= 3, every node of degree <= 4, output
        exactly 1. Record per line: key, closure, format, verified true/false,
        the first violated rule or the residual's size and five of its
        monomials, |C| or node count, max |mu|, max child degree. Then classify
        each line by the FROZEN counting rule (flat-v1 counts toward M_4 only
        with max |mu| <= 2 and never toward W_4 unless max |mu| <= 2; only
        wdag-v1 counts toward w) and tabulate per (closure, arm, format).
        Record, without judging what it means, the numbers of systems per arm
        with a verified counted M_4 certificate and with a verified wdag-v1.
    - id: VC-4
      text: >-
        YOUR OWN NEGATIVE CONTROLS, for EVERY (closure, arm, format) kind
        present, at least 5 each: (a) one row removed; (b) one k changed; (c)
        one mu changed to another monomial of the same degree; (d) a
        certificate transplanted onto a different system of the same arm; and
        for wdag-v1 additionally (e) a rule-(b) violation (a row with |mu| = 3
        whose sum still reaches 1 where you can construct one, else a declared
        reason), (f) a rule-(c) violation (a child of degree 4 used in prods),
        (g) a rule-(a) violation (a forward reference). Declare the seed or
        rule you use to pick positions. All must reject.
    - id: VC-5
      text: >-
        SATISFIABILITY. With your own evaluator, re-decide s on EVERY system
        named by a certificate line and on EVERY satisfiable control of every
        arm; check every listed solution of every satisfiable control. A
        verified certificate on a system with s >= 1 would mean your
        construction or checker is wrong, or the arm label is wrong: stop and
        report it with both computations.
    - id: VC-6
      text: >-
        VERDICT ON J1: `holds` if every certificate line verifies or is
        rejected exactly where the frozen format says it must not count, every
        counted certificate verifies, every named system has the frozen kept
        part and s = 0, and every negative control rejects; `breaks` if a
        counted certificate fails under a construction whose self-tests pass
        (show the residual or the violated rule), or a counted system has
        s >= 1 or a wrong kept part; `inconclusive` if the failure localises
        to key mapping or decoding (an extraction question, not a certificate
        question). Report on J1 ONLY; no whole-claim verdict.
    - id: VC-7
      text: >-
        SEAL, THEN READ. Write verification.json first and record its sha256
        and the UTC time in seal.txt. Only then may you open the run's reports
        (never the must_not_read files), and only then write
        validation-report.yaml. Never change verification.json after sealing;
        a correction goes to verification-v2.json with a note.
    - id: VC-8
      text: >-
        ZERO TRIALS. Verification computations only; no RUN-id; no git write;
        write only in your directory; memory cap 3 GB;
        PYTHONDONTWRITEBYTECODE=1. A timeout is infrastructure, never a
        result: checkpoint and report what is missing.
    - id: VC-9
      text: >-
        DISCLOSED PRIOR (review-plan PD-R1). The Coordinator's review prior was
        written after it read the run's report. Attack J1 on its merits; do
        not compensate in either direction.

