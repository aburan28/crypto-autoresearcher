handoff:
  id: TASK-20260803-f81a66
  from: coordinator
  to: executor
  objective: 'TWO tasks, both zero new sampling. (A) CONTROL C1: build a properly constructed deep-tail
    Poisson dispersion test -- local smooth rate rather than plug-in lambda, leverage correction, windows
    binned to EXPECTED COUNT >= 10, and phi reported WITH ITS OWN STANDARD DEVIATION so the reader can
    tell signal from noise. EV-MLKEM-0cf1df S-11 records two prior attempts that disagree in opposite
    directions (0.20-0.81 biased low; 1.27-2.72 biased high); this decides whether ANY absolute reading
    in the deep tail, favourable or adverse, is interpretable, and hence whether the observation that
    every model sits 16-42 percent below the deep-tail floor means anything. (B) INDEPENDENTLY RECOMPUTE
    the two quantities on which this goal has just retired its main statistic: O-1''s effective degrees
    of freedom (reported 1.55 and 1.51 under the D-1 covariance min(1/lambda,1/lambda'')) and O-2''s attenuation
    identity (reported ratio^2 = 0.5919 + (measurable misfit variance)/209.126, implying a perfect model
    reads 0.769x). Derive both from the archived data yourself before reading how the red team did it.'
  uncertainty_reduced: Whether the deep-tail residuals carry information at all, and whether the decision
    to retire the whole-band statistic rests on arithmetic that a second party reproduces. Both the dof
    number and the attenuation identity have been computed exactly once, by the party that proposed retiring
    the statistic.
  inputs:
  - experiments/EXP-MLKEM-011/vendor-lock/data/ archived .out files (q=241, m=40, n=43 and n=50)
  - coordination/goals/GOAL-MLKEM-003/batches/BATCH-013/tasks/TASK-20260803-b214b1/ (red-team package)
  - coordination/goals/GOAL-MLKEM-003/batches/BATCH-012/tasks/ (producer and validator packages)
  - ledger/evidence/EV-MLKEM-0cf1df.yaml and EV-MLKEM-553b83.yaml
  constraints:
  - Never fabricate a command, output, timing, statistic, citation, or run (AGENTS.md rule 9).
  - ZERO NEW SAMPLING, no network, no G6K. Repository bytes only; the vendored PDF is READ ONLY.
  - Toy tier; resolved band only; raw undivided score scale; NO ML-KEM security claim.
  - 'AGENTS.md rule 12 stays UNMET and UNWAIVED: EV-MLKEM-011, EV-MLKEM-013 and EV-MLKEM-017 keep their
    status; KN-FIND-031 stays withdrawn.'
  - 'BINDING (DEC-20260803-52a750): do not quote a whole-band ratio without stating its effective degrees
    of freedom beside it. Report the C>=1000 comparison.'
  - Write only inside the declared write_scope. Do not edit any prior artifact or ledger record. Do not
    git commit.
  - You record OBSERVATIONS ONLY. Do not conclude that the whole-band statistic should or should not be
    retired, nor that Approximation 4.9 is validated or refuted. That is /review-evidence under Coordinator
    authority.
  - Derive C1 before reading the two failed attempts, so your construction is not anchored to either.
  - 'If phi comes back consistent with 1.0 within its own sd, say so plainly: that is a clean result and
    means the deep tail is Poisson after all.'
  - Declare the provenance fields the evidence doctrine requires INSIDE results.json (command, commit,
    dirty state, environment, seeds/determinism, memory or an explicit note if unmeasurable, stderr, validity,
    inference block). No runs/ tree is declared.
  deliverables:
  - 'dispersion_control_c1.py: the exact script run'
  - 'results.json: C1 output with phi and its sd per window, plus the independent dof and attenuation
    recomputations'
  - 'report.md: what C1 shows, and whether the two recomputed quantities agree with the red team'
  artifact_paths:
  - coordination/goals/GOAL-MLKEM-003/batches/BATCH-014/tasks/TASK-20260803-f81a66/dispersion_control_c1.py
  - coordination/goals/GOAL-MLKEM-003/batches/BATCH-014/tasks/TASK-20260803-f81a66/results.json
  - coordination/goals/GOAL-MLKEM-003/batches/BATCH-014/tasks/TASK-20260803-f81a66/report.md
  archived_by: TASK-20260803-ea29ce
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 3000
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
  - phi reported with its own sd for every window, windows binned to expected count >= 10
  - the dof and attenuation quantities each independently recomputed and compared to the red team
  - an explicit statement of whether the deep tail is or is not consistent with Poisson
