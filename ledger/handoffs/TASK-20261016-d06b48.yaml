# HANDOFF -- TASK-20261016-d06b48. WRITE-ONCE. Id minted as a random 6-hex token
# without tools/allocate_id.py; the driving session confirms with --check.
handoff:
  id: TASK-20261016-d06b48
  from: coordinator
  to: coordinator
  goal_id: GOAL-ECDLP2M-001
  experiment_id: EXP-CERTBIN-b4d29c
  objective: >-
    After TASK-20261016-a1f7d3 completes, archive its implementation outputs
    in one isolated snapshot commit and verify them against Git. Push, and
