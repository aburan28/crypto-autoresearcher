    - Verify that SOURCE_SHA256.json hashes match the staged bytes, and that the crypto PR commit named in trial-plan.json exists and is reviewed.
    - Do not approve, write a dispatch queue, or launch a trial.
  deliverables:
    - One exact-path snapshot commit with a verified archive receipt.
    - A pushed branch and a refreshed PR naming TASK-20261016-a1f7d3, TASK-20261016-d06b48 and EXP-CERTBIN-b4d29c.
    - A goal checkpoint for GOAL-ECDLP2M-001 with exactly one next action, which is the Coordinator approval re-check for EXP-CERTBIN-b4d29c.
  artifact_paths:
    - experiments/EXP-CERTBIN-b4d29c/implementation/
    - experiments/EXP-CERTBIN-b4d29c/trial-plan.json
  write_scope:
    - experiments/EXP-CERTBIN-b4d29c/implementation/
    - experiments/EXP-CERTBIN-b4d29c/trial-plan.json
    - the goal checkpoint file tools/shard_goal.py writes for GOAL-ECDLP2M-001
    - the archive receipt path the archive tool assigns for TASK-20261016-d06b48
  archived_by: TASK-20261016-d06b48
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
    delivery: interactive
  budget:
    maximum_runs: 0
  dispatch_preconditions:
    - TASK-20261016-a1f7d3 has a completed receipt, and its declared outputs exist with final bytes.
    - A live GOAL-ECDLP2M-001 claim within max_concurrent 3; the archive runs alone.
  completion_gate:
    - The commit binds exactly the declared implementation paths, the trial plan, the goal checkpoint and the receipt.
    - The receipt records commit, first parent, path sha256s, origin/main base, merge outcome and post-commit verifier verdict.
    - The branch is pushed and the PR is refreshed.
  return_format: Archive receipt, verifier verdict, commit sha and PR URL.
  review_plan: null
