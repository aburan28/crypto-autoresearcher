  constraints:
    - >-
      DB-1 Additive. Write exactly the three declared files, all new. Edit no
      proposal, hypothesis, experiment, decision, question, correction or goal
      record. Mint no identifier.
    - >-
      DB-2 Scope. S2 only, as DEC-20260928-63addc states it. Stage 0 (zero
      compute): the exact-capacity certificate of claim (B) (Theorem C's
      argument re-run on the composite ambient group of order 4l; alphabets
      in 1, 2, 4 below l), the ideal-tree table of claim (A) at k in 4, 8, 16,
      32 with and without orbit unknowns with the k = 8 slips reconciled
      (24.22 against 24.7 and 67.5 against 68.5), and the (C3) and (C4)
      floors, all committed before any run. Stage 1: on every cell, G(h) for
      the identity (M), the random label (1 plus order M^(-1/2)), Tr(x) (2),
      the E/4E map (4), and on the composite n = 17 Koblitz cell the
      alphabet-548 and -956 homomorphisms (M); d06324's two exact rows as
      calibration. Stage 2: the declared Koblitz-specific filter families at
      M in N^(1/3), N^(1/4), S = 2^20 pairs per cell, bootstrap intervals, the
      matched-marginal shuffle on every arm, the ordinary n = 19 control and
      the relabelled Z/lZ control with the log-interval key as the far-end
      positive control. Stage 3: the ladder n in 19, 23, 29, 31. Excluded: any
      k-tree run at deployed parameters; target-dependent filters; levels
      above 1; IDEA-20260926-d3c5a5's engine (H1 is validated by direct
      pair-sum counting at L = 2^8); d06324's full four-arm (L, b) table.
    - >-
      DB-3 C1, tripwire TW-02. The k = 16 stake of claim (A) is recorded only
      as the column's ceiling, labelled conditional on a filter that claim
      (B) excludes exactly. The outcome table states no below-rho cell. The
      lead threshold is pre-registered exactly as the record states it, and
      any lead reading is routed in the contract's own text to
      review-breakthrough at max and to independent replication before
      interpretation.
    - >-
      DB-4 C2. Matched rho 2^60.8090 (CORR-20260922-81aeab). Each line states
      its ambient: the target subgroup of order l for the Wagner accounting,
      the full group 4l for the capacity certificate, consistent with
      CORR-20260928-4cb669's scoping of the product law to N = 4r. The record
      uses no D1, D2 or D3 quantity and asserts no per-attempt oracle budget;
      the design says so.
    - >-
      DB-5 C3. Under CORR-20260925-649e25 the orbit-unknowns line of the
      stake (relations B/262) is a per-orbit relation-count framing
      conditional on the per-orbit unit no approved contract has fixed; label
      it so and keep the without-orbit line (2^55.6 at k = 16 as the record
      states, to be recomputed) as the unconditional one.
    - >-
      DB-6 C4. The Stage 1 instrument gate with its exact controls, and the
      two d06324 calibration rows, are committed as runnable Python code
      inside the audit sheet (fixture_code, a block scalar extractable
      verbatim) with pass criteria stated before execution and placed in the
      specification's stopping and invalidation rules so that no
      Koblitz-specific arm is read on a cell before its gate passes. The
      general-n binary field module, normal-basis conversion, point halving,
      the E/4E map (Tr(x(P)), Tr(x(P/2))) on 2E, the estimator with bootstrap
      and the matched-marginal shuffle are specified precisely enough to
      implement; write no code outside the declared files and run none.
    - >-
      DB-7 C5. Wagner 2002 is recalled; attempt it at source for the k-tree
      accounting and record retrieved or the impediment. Re-derive the E/2E
      halving criterion from the group law or read it from
      Fong-Hankerson-Lopez-Menezes at source; never relay it through
      IDEA-20260922-1b16d7, whose parity statement the round-1 review finds
      reversed.
    - >-
      DB-8 C6. Every cell's group order, primality of l and cyclic 2-Sylow
      are recomputed and proved at setup, in the procedure; the record's hand
      values t_19 = 797 and t_17 = 101 are inputs to be checked, never cited
      as results.
    - >-
      DB-9 C7. Memory beside time for the stake (k lists of L points, in
      bytes). H1 (uniform sums) and H2 (decay transfer) keep numbered
      statements, random-model justification, supporting results with
      provenance, validation plans (sample, predicted distribution,
      comparison, tail check) and falsification conditions; H2 is measured by
      the ladder and its transfer beyond n = 31 is stated as a heuristic,
      never a bound.
    - >-
      DB-10 C8. Excluded reads as on this card. Zero runs. The absorbed
      d06324 and the cited 153a90, faa8d2, 845a77 records are cited by id and
      not edited.
    - >-
      DB-11 Approval fields. The specification carries controls (identity and
      random-label calibration, the exact positive controls at 2 and 4, the
      composite n = 17 control, the ordinary n = 19 control, the relabelled
      Z/lZ control, the matched-marginal shuffle on every arm, the decay
      ladder; each blocking as the record states), metrics, budget, stopping
      rules, invalidation rules, required artifacts, a decidable success
      criterion with at least one negative outcome, a falsification
      criterion, interpretation limits and a proof_search_map; status
      review_required; approved_by null; an approval block stating it is
      approved if and only if DEC-20260928-9d9c47 is official with decision
      approve naming EXP-BINSTD-de9678. The hypothesis has status specified,
      a mechanism, predictions, a test boundary and falsification criteria,
      and leaves asymptotic_claim at the record's capacity-certificate
      reading with no exponent claimed.
    - >-
      DB-12 Audit sheet. The four KN-TECH-080 audits and the strictness and
      interface obligations (the extension of Theorem C to a composite-order
      group is its own proof obligation), each filled or with a
      not_applicable_reason; a C1 to C8 discharge table naming the clause
      that discharges each; the fixture and calibration code with pass
      criteria; the Stage 0 outputs; and an attestation of every source read
      and at what depth.
    - >-
      DB-13 No sentence claims an ECDLP speedup, an exponent move, a
      deployed-curve verdict, a filter of capacity above 2 bits on ECC2K-130,
      or a lane closure (plan tripwire TB-1).
    - >-
      DB-14 Zero runs. Execute no instrument or estimator; the Stage 0 Python
      recomputation of arithmetic is permitted and its output is a design
      figure, never a result. Cite with provenance.
    - >-
      DB-15 No AUXIN census value, reviewer finding value, RUN-FROB value or
      EXP-FROB-30006a outcome; nothing about any EXP-QSP-70b731 run.
