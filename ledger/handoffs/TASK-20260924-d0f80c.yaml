handoff:
  id: TASK-20260924-d0f80c
  from: coordinator
  to: coordinator
  archive_kind: snapshot
  kind: snapshot_archive
  recorded_at: '2026-09-25'
  source_task_ids: [TASK-20260924-a50c5b]
  question_id: RQ-CERTBIN-836ce2
  experiment_id: EXP-CERTBIN-060020
  hypothesis_id: H-CERTBIN-e3ac93
  run_id: the RUN_ID minted at dispatch of TASK-20260924-a50c5b (recorded in its manifest)
  depends_on: [TASK-20260924-a50c5b]
  state: written_not_executed

  objective: >-
    Commit exactly the producer artifacts of TASK-20260924-a50c5b: impl/,
    verifier/, trial-plan-v1.json and the single run package. Write a
    post-commit receipt with per-path sha256, the parent, the origin/main base
    commit and the merge outcome, and the E_hex bit layout. Push and refresh
    the PR.

  uncertainty_reduced: Whether the bytes a reviewer reads are the bytes the executor produced.

  inputs:
    - ledger/handoffs/TASK-20260924-a50c5b.yaml
    - experiments/EXP-CERTBIN-060020/specification.yaml
    - origin/main

  constraints:
    - id: SC-1
      text: >-
        VALIDITY CHECK BEFORE STAGING. Check mechanically: exactly one run
        directory (a second only with a recorded infrastructure failure, both
        retained); engine-provenance/ present with C-ENGINE passing and
        timestamps preceding every draws-*.jsonl.gz; build_info backend native
        and source hash equal to the pin; the seven seeds in the manifest; arm
        sizes against the trial plan (S3-U400 = 400 unless a shortfall is
        recorded); predictions.jsonl.gz hash recorded before phase 4;
        certificate-verification.json and annihilator-verification.json
        produced by a separate process; raw-result.json against
        cell-summary.json on MR19-1..3; impl-provenance.json stating no engine
        file copied; nothing under src/crypto_autoresearcher/gf2/ changed
        relative to 934bee5; the specification byte-identical; nothing outside
        write_scope. An invalid or incomplete package is ARCHIVED as produced,
        its defects listed and routed back to the executor. Nothing is
        repaired in place.
    - id: SC-2
      text: MERGE origin/main, NEVER REBASE. Record the base commit and the merge outcome.
    - id: SC-3
      text: STAGE ONLY THE DECLARED PATHS, excluding __pycache__. Run alone.
    - id: SC-4
      text: >-
        A receipt is not evidence. No hypothesis status changes. No measured
        value in any commit message, PR text or bus message before the review
        plan is written.
    - id: SC-5
      text: >-
        Write the E_hex bit layout (19 hex integers; bit j LSB first = column j
        of mu_order(2, 20)) and the ann-v1 coordinate order into the receipt
        (J1 F-1; DEC-20260924-e61f3b NA-5).
    - id: SC-6
      text: Launch nothing. maximum_runs is 0.

  deliverables:
    - one commit naming TASK-20260924-d0f80c, EXP-CERTBIN-060020 and the RUN_ID
    - coordination/design/certbin-n19-20260924/archives/TASK-20260924-d0f80c/snapshot-receipt.json

  artifact_paths:
    - experiments/EXP-CERTBIN-060020/impl/
    - experiments/EXP-CERTBIN-060020/verifier/
    - experiments/EXP-CERTBIN-060020/trial-plan-v1.json
    - experiments/EXP-CERTBIN-060020/runs/$RUN_ID/
    - coordination/design/certbin-n19-20260924/archives/TASK-20260924-d0f80c/snapshot-receipt.json
  write_scope:
    - coordination/design/certbin-n19-20260924/archives/TASK-20260924-d0f80c
  write_scope_note: The producer artifacts belong to TASK-20260924-a50c5b's write set and are STAGED by this task. This task writes only its receipt.

  archived_by: TASK-20260924-d0f80c

  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: true
    fallback_reason: Runtime inheritance (DEC-20260923-4d7a19 R-1 forward rule).
    degraded_allowed: false
    independent_session_required: false

  budget:
    wall_clock_seconds: 1800
    memory_gb: 2
    maximum_runs: 0

  completion_gate:
    - the archive commit changes exactly the declared paths
    - the receipt's path_sha256 covers every file under the declared directories (excluding __pycache__) and matches the committed tree
    - the receipt lists every SC-1 validity defect found, or states that none was found
    - the receipt records the origin/main base commit, the merge outcome, the E_hex bit layout and the ann-v1 coordinate order
    - experiments/EXP-CERTBIN-060020/specification.yaml is byte-identical to its approved version
    - no scientific trial was launched by this task

  return_format: The receipt, the archive commit sha, the SC-1 defect list, and the PR URL.
