  review_plan:
    claim_under_review: >-
      As the producer stated it (experiments/EXP-PFDR-c04716/runs/STATIC-001/
      execution-report.md, execution_report.observations, verbatim): "F1 null
      slice: strictly decreasing, argmin at the enumerative leaf at all 6
      fixture cells and all 54 table null curves; enumerative balance
      exponent 1.0 (N^1): PASS"; "F2 direct presentation: argmin k = m-1 from
      B = 16 on; slope of log2 ratio vs log2 B at B = 2^20 = 3.0000/2.9999/
      2.9998 (omega 2) and 4.6139/4.6139/4.6137 (omega 2.807) vs 2 omega - 1:
      PASS"; "F3 balance limits: C = 1 slope 2/(m+1) exactly; C = B^{m-1}
      2^{m-1} slope 1.0 exactly: PASS"; "Small-N tell: all 18 cells at 64
      bits lose by >= 2^9; min gap 9.1189 at (m 5, D_0 4, omega 2): PASS";
      "Hand comparison: 8 contract-listed cells max |disc| 0.15; H (D) extras
      max 0.19; dcf857-only 'about 2^150' cell (256, m 4, D_0 6, omega 2.807)
      script 151.60, +1.60 (above 1)"; "Thresholds at 256 bits: (m 5, omega
      2) between 8 and 10; (m 5, omega 2.807) between 4 and 6; (m 4, omega 2)
      between 2 and 4 i.e. T >= rho at D_0 = 4; all three match the frozen
      brackets"; "P3: k* = 0 at 50/54 table cells; k* = leaf at 4 cells, all
      at 64 bits"; "P5: binomial zero at 7/9 (m, D_0) pairs; k_c outside the
      guessing range at all 54 table cells"; "Cells with T < rho (time only,
      assuming HEUR-001, memory 2^53.9..2^61.6): (256, m 5, D_0 4, omega 2)
      108.76; (256, m 5, D_0 4, omega 2.807) 116.60; (256, m 5, D_0 6, omega
      2) 116.64; (256, m 5, D_0 8, omega 2) 124.13; all other 50 cells T >=
      rho". The hypothesis whose arithmetic this package is (H-PFDR-06fd60,
      title): "under a last fall degree bounded by D_0 the hybrid optimum of
      the digit-presentation decomposition oracle flips from full guessing
      (the semi-regular slice, reproducing IDEA-20260808-da1428's N^1
      exactly) to no guessing (k* = 0), crossbred degenerates to XL at degree
      D_0, and at log2 N = 256 the route ties with rho only at m = 4, D_0 =
      4, omega = 2 and beats it at m = 5 only for D_0 <= 6 at omega = 2".
    coordinator_prior: >-
      Written 2026-09-04 before any reviewer runs. ARITHMETIC: I expect the
      validator to find the package reproducible and compliant (holds on V1
      and V3, holds on V2 within 0.2 in log2 for every cell, the +1.60
      discrepancy being outside the contract's listed hand values and
      therefore not a failure of item (3) as written); I expect no zero-run
      breach. DERIVATION: I expect the red team to BREAK the m >= 3 cells of
      the table on a generator-degree error inherited from IDEA-20260830-
      84cdb7 and already corrected by IDEA-20260903-e1e38b and confirmed
      symbolically by EXP-PFDR-5726af (RUN-PFDR-5726af-htop: S_4 has total
      degree 12 = 3 x 2^2): the digit-substituted generator has reduced
      degree m 2^{m-1} (12 at m = 3, 32 at m = 4, 80 at m = 5 once s >= 2^{m-1}),
      not the '2m' of statement (A), so the null slice d_reg(k) = ceil((n - k
      + 2m)/2) is mis-specified for m >= 3 and every bounded-slice cell with
      D_0 in {4, 6, 8} at m in {3, 4, 5} charges a Macaulay matrix at a degree
      BELOW the generator's own degree, which has no rows at all; only m = 2
      (degree 4 = 2m) is a possible object, and at m = 2 the exponent
      2/(m+1) = 2/3 never beats rho. If that stands, the headline 'beats rho
      at m = 5 for D_0 <= 6' is void by derivation, independently of
      HEUR-001, and the honest content of the package is the null-slice
      reproduction of da1428 and the flip mechanism at m = 2. I also expect
      the red team to find a second, independent obstruction to HEUR-001's
      'bounded solve' half: with ONE non-field generator of degree delta in
      the multilinear quotient, the degree-D Macaulay matrix has
      Ncols(n, D - delta) rows against Ncols(n, D) columns, so no fixed D_0
      can determine the solutions once n = ms grows (the row count is below
      the column count minus N_sol until D is about n/2 + delta/2); a
      bounded solve is impossible for plain Macaulay linear algebra and
      possible only for a closure-type solve whose degree EXP-PFDR-cbdefb
      measured as 4 + floor(s/2) at m = 2 (growing). I expect P5's interior-
      band formula to be a derivation slip (binom(2(D_0 - m), D_0) = 0 for
      D_0 < 2m; the residual column count at k_c is 2^{2(D_0 - m)}), harmless
      to the qualitative 'exponential in n' claim. DECISION I EXPECT TO
      REACH: the package is valid at derivation tier (proof_status
      derivation), the fixtures and the m = 2 arithmetic hold, and
      H-PFDR-06fd60's conditional table at m >= 3 is superseded by the
      corrected generator degree; the hypothesis cannot rise above
      'analyzed' (promotion gates) and its conditional premise HEUR-001 has,
      in substance, failed its validation experiment (cbdefb's d_lf = 4 +
      floor(s/2) is not bounded), so the likely decision is weaken with a
      superseding derivation record for the corrected table, and a
      knowledge entry only for the proven boundary (the degree / row-count
      obstruction) if the red team's derivation note is complete. If the
      red team instead finds the '2m' degree defensible (e.g. a reading of
      D_0 as multiplier degree), that overturns this prior and the review
      must say so.
    joints:
      - joint: 'V1 package integrity, determinism and zero-run compliance'
        assigned_to: TASK-20260904-2bb29d
        attack_plan: >-
          Recompute sha256 of the six files listed in execution-report.md
          and compare byte for byte; list the STATIC-001 directory and
          confirm exactly seven files, no manifest.yaml, no seeds, no curve
          parameters, no sampled points, no solver code; read cost_table.py's
          imports and confirm only argparse, json, math, os, sys; run
          `python3 experiments/EXP-PFDR-c04716/runs/STATIC-001/cost_table.py
          --out <scratchpad>` twice and diff the five emitted YAML files
          against the archived ones and against each other. Where I think it
          breaks: nowhere; a hash mismatch would mean the archived files are
          not the script's output, and a nondeterministic float in the
          balance solver would show as a diff in the last digits.
        breaking_artifact: >-
          A file whose sha256 differs from the report's, an eighth file or a
          forbidden artifact in the package, a non-standard-library import,
          or a nonempty diff between two invocations or between an
          invocation and the archived YAML (attach the diff).
      - joint: 'V2 independent recomputation of fixtures, table cells and thresholds from the frozen formulas'
        assigned_to: TASK-20260904-2bb29d
        attack_plan: >-
          BEFORE opening cost_table.py, implement from H-PFDR-06fd60 (A)-(C)
          and the contract's inputs: Ncols(n', D) = sum_{i <= D} binom(n', i);
          C(k) = 2^k Ncols(n - k, D(k))^omega; null slice D(k) = ceil((n - k +
          2m)/2); bounded slice D(k) = min(D_0, d_reg(k)); the balance s =
          (log2 m! + m + omega log2 Ncols(n, D(0)) + log2 N)/(m + 1) with n =
          round(m s) iterated to a fixed point; log2 T = 1 + 2 s; memory s;
          rho = log2 0.886 + (log2 N)/2. Emit: (a) monotonicity and argmin of
          C(k) under the null at (m, s) in {(3, 6), (4, 8), (5, 8)}, both
          omega; (b) the direct-presentation ratio slope at B = 2^20 for m in
          {3, 4, 5} using residual degree ceil((r (B - 1) + D_S)/2) with
          D_S = m 2^{m-1} and dense columns binom(D + r, r); (c) the C = 1 and
          C = B^{m-1} 2^{m-1} balance slopes; (d) log2 T and memory for the 8
          contract-listed cells, the 4 'T < rho' cells and the (256, m 4,
          D_0 6, omega 2.807) cell; (e) the even-D_0 thresholds at 256 bits
          for (m, omega) in {(5, 2), (5, 2.807), (4, 2)}; (f) the 18 bounded
          cells at 64 bits and their gap to rho. Compare with fixtures.yaml,
          cost-table.yaml, thresholds.yaml. THEN open the script and record
          every modelling choice it makes that the formulas leave open (the
          report's D5 a-d) and whether each moves any cell by more than 0.2.
          Where I think it breaks: nowhere above 0.2 in log2; the rounding of
          n and the placement of the 2^m filter are the only free choices.
        breaking_artifact: >-
          Any cell differing from cost-table.yaml by more than 1 in log2, a
          fixture whose pass/fail flips, or a threshold bracket that moves,
          with your values and the archived values side by side.
      - joint: 'V3 literal accounting of the frozen success criterion (1)-(5) and predictions P1-P5'
        assigned_to: TASK-20260904-2bb29d
        attack_plan: >-
          Read specification.success_criterion and preregistered_prediction
          as frozen. Build a table: for each item and each of P1-P5, the
          frozen wording, the package's reported outcome, and whether the
          literal reading is met. Decide specifically (i) whether item (3)
          'every table cell within 1 in log2 of the hand values' refers to
          inputs.hand_values_to_reproduce (8 cells, max 0.15), to H-PFDR-
          06fd60 (D) (max 0.19) or to IDEA-20260903-dcf857 (D) (one cell at
          +1.60), and record all three readings; (ii) whether P3 'k* = 0 ...
          for n = ms in the hundreds' is contradicted by the 4 cells at 64
          bits (n = 84..100) or lies outside its stated scope; (iii) whether
          P5 as frozen was evaluable at all (binomial zero at 7 of 9 pairs)
          and whether the package reported it unrepaired; (iv) whether any
          prediction text was adjusted after the script ran (compare the
          contract at the approval commit c5742969 with the current file).
          Where I think it breaks: nowhere as a validity matter; item (3) is
          met on the contract's own list and the +1.60 cell is a
          dcf857-only approximate value.
        breaking_artifact: >-
          Evidence that a frozen prediction was edited after execution, or a
          contract-listed cell off by more than 1 in log2 that the package
          reported as within 1.
      - joint: 'R1 generator degree at m >= 3 and the Macaulay degree floor of every bounded-slice cell'
        assigned_to: TASK-20260904-6681da
        attack_plan: >-
          Derive the reduced total degree of the digit-substituted generator
          S~ = S_{m+1}(ell_1, ..., ell_m, x_R) in the multilinear quotient at
          d = 2: S_{m+1} has degree 2^{m-1} in each x_k (IDEA-20260903-e1e38b
          D3; RUN-PFDR-5726af-htop confirms degree 12 at m = 3 with top form
          x_1^4 x_2^4 x_3^4), and ell_k^{2^{m-1}} in s squarefree variables
          has degree min(2^{m-1}, s), so deg S~ = m min(2^{m-1}, s) = m 2^{m-1}
          whenever s >= 2^{m-1} (every table cell: s = 20..82). Then compute,
          for each headline cell (m, D_0) with D_0 < m 2^{m-1}, the row count
          of the degree-D_0 Macaulay matrix, Ncols(n, D_0 - deg S~), which is
          0. State exactly which of the 54 cells and which threshold rows
          survive (I expect: only m = 2 would, and m = 2 is not in the table;
          every m in {3, 4, 5} cell is below the generator degree). Also
          correct the null slice: d_reg(k) with generator degree m 2^{m-1}
          instead of 2m, and check whether F1 (strictly decreasing, argmin at
          the leaf) still holds under the corrected null. Then price the
          corrected minimum: the smallest admissible D_0 is deg S~ (80 at
          m = 5), and Ncols(269, 80)^omega must be compared with rho at 256
          bits. Where I think it breaks: at the first line; H-PFDR-06fd60 (A)
          says 'total degree at most 2m after multilinear reduction' and the
          contract's CTRL-CONFOUNDERS-NAMED (iv) asserts the reduction caps
          the degree at 2m = 10 at m = 5, which is false for s >= 3 (the cap
          is min(16, s) per block, not 2).
        breaking_artifact: >-
          A derivation note (archived under your task directory) giving
          deg S~ = m 2^{m-1}, the row count 0 at every m >= 3 headline cell,
          the corrected null slice, and the corrected minimum-D_0 cost at 256
          bits; or, if you find the 2m degree defensible under some reading of
          D_0 (e.g. multiplier degree), that reading written out with the
          cells it rescues.
      - joint: 'R2 bounded last fall versus bounded solve: the row-count obstruction to HEUR-001'
        assigned_to: TASK-20260904-6681da
        attack_plan: >-
          Independently of R1, take the cost model at face value (generator
          degree delta, one non-field generator, n = ms squarefree variables,
          quotient B) and derive the condition under which the degree-D
          Macaulay matrix can determine the solutions: rank <= rows =
          Ncols(n, D - delta) while solving needs rank >= Ncols(n, D) - N_sol;
          show for which D this is possible as n grows (I expect D >= about
          n/2 + delta/2, i.e. D_0 grows linearly in s, which is the null
          slice's own growth). Then ask what 'bounded solve' could mean that
          the table might price: the Huang-Kosters-Yeo closure (multiply
          fallen elements to a fixed point), whose degree EXP-PFDR-cbdefb
          measured as d_lf = d_ff = 4 + floor(s/2) at m = 2 with the ideal
          complete at that degree; compute the closure's cost as several
          ranks on Ncols(n, D) columns and state whether Ncols^omega charges
          it. Where I think it breaks: HEUR-001's second clause ('the
          degree-D_0 Macaulay matrix determines the solutions') is impossible
          for fixed D_0 by counting; the only solve the data supports has
          D growing with s.
        breaking_artifact: >-
          A derivation note with the row/column inequality and its
          consequence for fixed D_0 (a proven boundary, promotable), plus the
          closure-cost reading; or a construction showing a fixed-degree
          Macaulay solve is possible for this family (which would overturn
          the prior).
      - joint: 'R3 marginal-cost sign flip, null-slice reproduction, interior band and the k* anomalies'
        assigned_to: TASK-20260904-6681da
        attack_plan: >-
          Re-derive C(k+1)/C(k) under both slices with the finite-n
          correction: null: D(k) > (n - k)/2 so Ncols > 2^{n-k-1} and the
          ratio tends to 2^{1 - omega}; bounded: 2 (1 - D_0/(n - k))^omega
          from binom(n - k - 1, D_0)/binom(n - k, D_0) and the crossing
          n - k = D_0/(1 - 2^{-1/omega}); check the direct-presentation
          fixture's slope 2 omega - 1 and its claimed independence of D_S.
          Re-derive the interior band: k_c from d_reg(k) = D_0 gives residual
          count n - k_c = 2(D_0 - m); the P5 cost uses only the top binomial
          binom(2(D_0 - m), D_0), which is 0 when D_0 < 2m although the
          residual Macaulay matrix has Ncols(2(D_0 - m), D_0) = 2^{2(D_0 - m)}
          columns; write the corrected interior-band cost and state whether
          'exponential in n' survives. Explain A1 (root-finding leaf cheaper
          than C(0) at four 64-bit cells) and say which T the frozen model
          should have reported there. Where I think it breaks: P5 is a
          formula slip (harmless); A1 is the model's own leaf charge, not an
          error.
        breaking_artifact: >-
          A corrected derivation note for the interior band and the four
          cells recomputed at their true argmin; or a k at which the sign of
          the marginal cost differs from the derivation.
      - joint: 'R4 concrete-cost honesty, cost-unit bookkeeping and scope against the target profile'
        assigned_to: TASK-20260904-6681da
        attack_plan: >-
          Audit concrete-cost.yaml against docs/evidence-and-reproducibility.md
          'Concrete-cost estimation artifacts' and docs/target-result-profile.md
          A8 / C13-C15 and the red-team exemplar challenges 4-7: declared
          unit; both omega on every cell; memory as a first-class column;
          every optimistic assumption with its bias direction; the o(1)
          disclosure 2^m Ncols(ms, D_0)^omega per cell; parallelism; the
          absence of a van Oorschot-Wiener interpolation; affected versus
          safe scope; total cost as per-attempt cost x inverse success
          probability (B^m / (m! N) with the 2^m filter). Check the rho prior
          (0.886 sqrt N, O(1) memory) and whether any text treats a
          time-only advantage at 2^54..2^62 memory as domination. Check
          whether the S_{m+1} construction cost and the S_6 instrument
          (KN-OPEN-5b3a08) are charged or flagged. Where I think it breaks:
          the artifact is honest in form; its content is what R1 attacks.
        breaking_artifact: >-
          An unflagged optimistic assumption, a cell quoted without tags, a
          cost bookkeeping error (probability set to 1, unit omitted), or a
          scope statement not licensed by the cells.
    blindness:
      mutual: true
      lifted_for: []
      rationale: null
    proves_too_much:
      objects:
        - >-
          The direct presentation with membership degree B = 2^s under the
          same table machinery: the flip is KNOWN not to occur there
          (IDEA-20260808-da1428's full-guessing optimum, afe4ce's floor
          d_lf >= B). The bounded-slice arithmetic with D_0 in {4, 6, 8}
          applied to it must not produce sub-rho cells; if the machinery
          produces them, it prices an assumption the object is known to
