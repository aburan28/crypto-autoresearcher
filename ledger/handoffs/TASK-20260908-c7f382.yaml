handoff:
  id: TASK-20260908-c7f382
  from: coordinator
  to: executor
  goal_id: GOAL-ECDLP-001
  question_id: RQ-ECDLP-165d4b
  hypothesis_id: H-ECDLP-9f3c7a
  experiment_id: EXP-ECDLP-b2e5d1
  approval_decision_id: DEC-20260908-e19a04
  recorded_at: '2026-09-08'

  objective: >-
    Execute the frozen, approved contract experiments/EXP-ECDLP-b2e5d1/
    specification.yaml exactly as written: Stage 0 (zero-compute derivation
    and Stage-0 pre-declaration hash) through Stage 7 (verdict assembly),
    including every blocking control. Produce the run artifacts that let the
    Coordinator determine whether the endomorphism-orbit rho lane's corrected
    cost model supports Reading 1 (closure strengthened) or Reading 2 (a live
    non-unit cell), and whether the norm-form smoothness heuristic
    (HEUR-9f3c7a-01) holds at 256- and 384-bit discriminants.

  uncertainty_reduced: >-
    Whether gamma_min (the cheapest applicable non-unit endomorphism's charged
    application-cost ratio) exceeds the 1/4 break-even at every declared toy
    bit size, whether the closed-form ceiling formula G_max=1/(2*sqrt(gamma))
    is empirically calibrated by the planted dial, and whether the
    quadratic-form-constrained endomorphism norm obeys the Dickman-de Bruijn
    smoothness law at cryptographic-scale discriminants. Currently unknown;
    no run exists under this contract.

  inputs:
    - experiments/EXP-ECDLP-b2e5d1/specification.yaml
    - ledger/hypotheses/H-ECDLP-9f3c7a.yaml
    - ledger/proposals/IDEA-20260904-742c48.yaml
    - ledger/decisions/DEC-20260908-e19a04.yaml
    - harness/isogeny_class.py
    - harness/rho.py
    - harness/runner.py
    - knowledge/techniques/KN-TECH-018.md
    - knowledge/techniques/KN-TECH-005.md
    - knowledge/techniques/KN-TECH-006.md
    - knowledge/techniques/KN-TECH-031.md
    - AGENTS.md
    - agents/executor.md
    - docs/evidence-and-reproducibility.md
    - docs/research-budget-policy.md
    - templates/research-records.md

  constraints:
    - >-
      The contract is FROZEN (version 1). Do not alter its stages, controls,
      budget, stopping rules, or success/falsification criteria. A needed
      change is a versioned amendment recorded under
      experiments/EXP-ECDLP-b2e5d1/amendments/, never a silent edit.
    - >-
      Run Stage 0 first and hash the pre-declaration (prime list, cost-model
      definition, B grid, dial settings, discriminants, sample sizes, KS
      threshold) before any enumeration, benchmark, or sampling begins.
    - >-
      Measure gamma as the DIFFERENCE of two end-to-end charged walk costs at
      matched seeds, divided by h -- never as an isolated map timing (this is
      a blocking observation-collision separator named in H-ECDLP-9f3c7a's
      proof_search_map).
    - >-
      Run the Stage 4 matched random-integer null BEFORE reading the Stage 4
      signal arm, in the same invocation. Refuse (report as refused, not as
      agreement) any B-cell whose expected smooth count is below 30.
    - >-
      Do NOT apply the corrected cost model to any alpha whose ideal has an
      inert or ramified factor; fall back to Otilde(n) for those and report
      the fallback explicitly.
    - >-
      Every kernel, isogeny edge, and path claim must carry an independent
      re-verification certificate produced by code sharing no state with the
      producer; verification fraction must be reported and must equal 1.0 for
      the run to be evidence-eligible.
    - >-
      A timeout, crash, memory exhaustion, factorisation failure, or
      dependency failure is failed_infrastructure and must be reported as
      such -- never as a negative mathematical result (AGENTS.md rule 5).
    - >-
      Stop at maximum_runs (60) or total_cpu_hours (24.0), whichever binds
      first; budget exhaustion is a stop, not a finding.
    - >-
      Do not create, edit, or approve any ledger record (hypothesis,
      evidence, decision, goal). Do not commit or push. The Coordinator makes
      the snapshot archive and, after independent review, the ledger archive.
    - >-
      Lawful defensive cryptanalysis on public constructions and toy
      benchmarks only; no live keys, wallets, or deployed systems are
      touched, and this contract solves no DLP instance.
    - >-
      Report the manifest, raw results, the Stage-0 hashed pre-declaration,
      the certificate verification fraction, and every control's pass/fail
      honestly, including any that fail -- a failing blocking control voids
      readings from that run, and this must be stated plainly rather than
      omitted.

  deliverables:
    - experiments/EXP-ECDLP-b2e5d1/runs/TASK-20260908-c7f382/manifest.yaml
    - experiments/EXP-ECDLP-b2e5d1/runs/TASK-20260908-c7f382/raw-result.json
    - experiments/EXP-ECDLP-b2e5d1/runs/TASK-20260908-c7f382/stage0-predeclaration.yaml
    - experiments/EXP-ECDLP-b2e5d1/runs/TASK-20260908-c7f382/certificates.json
    - experiments/EXP-ECDLP-b2e5d1/runs/TASK-20260908-c7f382/obstruction-gamma_min.yaml
    - experiments/EXP-ECDLP-b2e5d1/runs/TASK-20260908-c7f382/implementation-report.yaml

  artifact_paths:
    - experiments/EXP-ECDLP-b2e5d1/runs/TASK-20260908-c7f382/manifest.yaml
    - experiments/EXP-ECDLP-b2e5d1/runs/TASK-20260908-c7f382/raw-result.json
    - experiments/EXP-ECDLP-b2e5d1/runs/TASK-20260908-c7f382/stage0-predeclaration.yaml
    - experiments/EXP-ECDLP-b2e5d1/runs/TASK-20260908-c7f382/certificates.json
    - experiments/EXP-ECDLP-b2e5d1/runs/TASK-20260908-c7f382/obstruction-gamma_min.yaml
    - experiments/EXP-ECDLP-b2e5d1/runs/TASK-20260908-c7f382/implementation-report.yaml

  write_scope:
    - experiments/EXP-ECDLP-b2e5d1/runs/TASK-20260908-c7f382/

  archived_by: null

  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false

  budget:
    wall_clock_seconds: 14400
    memory_gb: 8
    maximum_workers: 1
    maximum_runs: 60

  completion_gate:
    - >-
      Stage 0 pre-declaration is written and hashed before any enumeration,
      benchmark, or sampling.
    - >-
      The unit-case control reproduces EV-ENDO-10109d's reported means within
      their reported sd, OR the run reports this control's failure explicitly
      and stops per the stopping rule.
    - >-
      The planted-dial calibration (5 settings, 200 replicates each) is
      complete with a stated pass/fail against the 15 percent band.
    - >-
      The census smoothness enumeration is COMPLETE at every declared prime
      (16, 20, 24, 28 bits), with the deduplication and split-fraction logs
      recorded.
    - >-
      The Stage 4 matched random-integer null is executed and recorded before
      the signal arm, at both 256 and 384 bits, with tail checks reported for
      both.
    - >-
      The supersingular nearby-object control is executed and its gamma_min
      reported alongside the matched ordinary-curve measurement.
    - >-
      Certificate verification fraction is reported for every kernel,
      isogeny edge, and path claim.
    - >-
      Every blocking control's pass/fail is stated explicitly in
      implementation-report.yaml, including any failure, with no field left
      silently blank.

  return_format: >-
    A short report naming: the measured gamma_min and gamma_aut per bit size
    with CIs; the dial-calibration pass/fail; the smooth-split fraction table
    per B; N_0; the Stage 4 KS statistics and tail checks at 256 and 384 bits
    for both the signal arm and the null; the supersingular control's
    gamma_min; the certificate verification fraction; and an explicit
    Reading-1-or-Reading-2 classification with the reasoning shown, or a
    statement that a blocking control failed and every downstream reading is
    void. State plainly whether the run is evidence-eligible.

  review_plan: null
