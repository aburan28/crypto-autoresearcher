    - (C2) recorded as derived or with the exact failure point; (C3) criterion derived or recorded as an obligation with the trivial-direction qualifier settled; (D) names its two recalled inputs
    - stage1/instrument-pins.yaml present with blob ids and sha256 for every pinned path and no unexplained difference
    - SC1-SC3 zero failures; G1 zero failures at every curve and lambda; G1s agreement zero; G2 zero failures; G2c strictly positive failure count; G3 50 of 50 certified recoveries or the failing instances archived; G4 PASS, FAIL or DEFERRED with the exact reason
    - stage1/stage1-summary.yaml states each gate verdict by the pre-stated rule (STAGE1_PASS only if SC, G1, G1s, G2, G2c, G3 all pass)
    - Every run has manifest + raw-result + stdout under runs/ with termination_reason set (completed|timeout|memory_abort|crash) and the inference block recorded
    - No Stage 2 artifact, spectrum, spike statistic or null is produced
  return_format: >-
