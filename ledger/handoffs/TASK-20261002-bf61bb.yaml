handoff:
  id: TASK-20261002-bf61bb
  from: coordinator
  to: executor
  objective: >-
    Execute EXP-ECDLP-ff0559 Stages 0-1 only. Stage 0: write the derivation note
    for (A), (B), (C1) (every step numbered), (C2) (derived or failure point
    recorded), (C3) (Sigma additivity derived; criterion derived or an explicit
    obligation; trivial-direction qualifier settled), (D) (two recalled inputs
    named), freeze conventions and the Stage 2 library, and pass self-checks S0.1
    to S0.7. Stage 1 (only after stage0/gate.yaml is all true): implement exact
    dual-number affine arithmetic over F_p[eps]/eps^2 and the delta and Sigma
    pipelines, then run instrument self-checks SC1-SC3 and gates G1 (C1 exact
    identity, 5 curves, lambda in {1, 2, p-1}, every point, zero tolerance) with
    sentinel G1s, G2 (exhaustive homomorphism on all ordered pairs at one 12-bit
    curve) with control G2c, G3 (50 anomalous toy curves, recovery with
    independently re-verified certificates) and G4 ((C2) against the a26bde
    p-adic instrument at 10^3 points on each of three 16-bit curves, or deferral
    with the exact reason). Compute and report NO DL-spectrum statistic. Do not
    interpret or change any status.
  uncertainty_reduced: >-
    Whether the delta_KS derivations (A), (B), (C1) hold as written and whether
    the dual-number instrument reproduces the three exact identities at the
    declared curves, so that a later, separately designed Stage 2 census could be
    run on a calibrated instrument; and whether (C2) holds or where it fails.
  inputs:
    - experiments/EXP-ECDLP-ff0559/specification.yaml
    - ledger/hypotheses/H-ECDLP-4d92ee.yaml
    - ledger/decisions/DEC-20261002-a31a7b.yaml
    - ledger/proposals/IDEA-20260930-8e3b75.yaml
    - coordination/design/TASK-20261002-70c7e2/proof-search-map-audit.yaml
    - ledger/questions/RQ-ECDLP-c1b7b1.yaml
    - harness/toycurve.py
    - harness/runner.py
    - experiments/EXP-ECDLP-a26bde/driver/instrument.py
    - experiments/EXP-ECDLP-a26bde/driver/padic.py
    - experiments/EXP-ECDLP-a26bde/driver/formalgroup.py
    - experiments/EXP-ECDLP-184fc4/specification.yaml
    - experiments/EXP-ECDLP-184fc4/amendments/DEC-20260908-2521fa.yaml
  constraints:
    - Stages 0-1 ONLY. No DL-spectrum, no FFT over a log ordering, no spike statistic, no null, no 2-torsion control, no meter (L, b), no replication, no 2^32 work.
    - Never edit any existing record or any instrument under another experiment directory (EXP-ECDLP-a26bde, EXP-ECDLP-184fc4, EXP-ECDLP-1e6502, H-ECDLP-f1e714, harness/). Read-only; vendor a verbatim copy under implementation/vendor/ only with recorded blob ids.
    - Record in stage1/instrument-pins.yaml the git blob id (working tree and git rev-parse bbaf753d0b:path) and sha256 of every pinned file before any gate runs; on any difference stop as failed_infrastructure (instrument drift).
    - Stage 1 must not start before stage0/gate.yaml exists with S0.1 to S0.7 all true. If a step of (A), (B), (C1) or the recipe fails to derive, halt and report the exact step; do not run Stage 1.
    - Thresholds, panel rule, seeds, library and conventions are frozen verbatim; never loosen or re-read them. The anomalous panel is the first 50 admissible curves in generator order; never replace an instance after a failure.
    - 'Fixed sample counts are not advisory: every non-identity point on each G1 curve at each lambda, every ordered pair at G2, 50 instances at G3, 10^3 points per curve at G4.'
    - Certificates (G3) are re-verified with harness/toycurve.py EllipticCurve.mul, independent of the dual-number code.
    - On an implementation defect record BUG-EXP-ff0559-NNN, fix, and re-run ALL gates against the final implementation hash as a new run; never rewrite or delete voided runs.
    - Timeouts, crashes and missing dependencies are failed_infrastructure, never negative mathematical evidence.
    - Hand derivations in the contract (the recipe delta = alpha/(2 n y_P), the (C2) sketch, the oddness of delta, the C3 qualifier) are UNREVIEWED Coordinator notes, not facts; re-derive or refute them.
    - maximum_runs as in budget; do not exceed. Preserve all raw artifacts; never overwrite a prior run record.
    - Amazon Bedrock is prohibited.
    - Do not invent identifiers; mint RUN ids and BUG numbering per harness convention (python3 tools/allocate_id.py) and confirm before use.
    - Do not change hypothesis, experiment, idea or goal status fields; observations only. A Stage 1 PASS or VOID is reported, not decided.
  deliverables:
    - experiments/EXP-ECDLP-ff0559/stage0/derivation-note.md
    - experiments/EXP-ECDLP-ff0559/stage0/conventions-freeze.yaml
    - experiments/EXP-ECDLP-ff0559/stage0/library.yaml
    - experiments/EXP-ECDLP-ff0559/stage0/gate.yaml
    - experiments/EXP-ECDLP-ff0559/stage1/ (instrument-pins.yaml, curve-manifest.yaml, selfchecks.json, gate-G1-C1.json, gate-G2-homomorphism.json, gate-G3-anomalous-panel.json, gate-G4-C2.json, stage1-summary.yaml)
    - experiments/EXP-ECDLP-ff0559/implementation/
    - experiments/EXP-ECDLP-ff0559/runs/ (manifest, raw-result, stdout per run)
  artifact_paths:
    - experiments/EXP-ECDLP-ff0559/runs/
    - experiments/EXP-ECDLP-ff0559/implementation/
    - experiments/EXP-ECDLP-ff0559/stage0/
    - experiments/EXP-ECDLP-ff0559/stage1/
  write_scope:
