    - Do not change H-LHW-371a91, EXP-LHW-9adf78 or IDEA-20260930-750de2 status or text; observations only. A needed protocol change is an additive protocol_amendment proposal returned to the Coordinator, never an edit.
    - Do not invent identifiers; mint RUN ids with tools/allocate_id.py (--next run --area LHW, then --check) and never by scanning for the next free number.
    - A timeout, crash, memory abort or missing dependency is failed_infrastructure, never a negative mathematical result.
    - Preserve every raw artifact; never overwrite a prior run record.
    - Every threshold comparison is made by the integer cross-multiplication forms of the specification, never in floating point; floating-point values are display only.
    - Measured, recomputed and modeled quantities stay in separate columns; every C_M and R is labeled MODELED.
    - The two counting code paths (DP and direct enumeration) must be independent implementations; record their agreement on the declared cross-check set.
    - Keep every random stream exactly as specified (SeedSequence entropy 20261002; spawn_key (1, c, r) for NULL-1, (2, c) for the residue-planted control, (3, c) for the decay mixing) and record the numpy version.
    - Run the full Stage 1 pipeline a second time in a fresh process and record the sha256 equality of every table (determinism-rerun.json).
