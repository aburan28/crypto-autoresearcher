    Whether any odd modulus concentrates W(m, w) on few residue classes relative to
    sqrt(M) so that the guess-and-kangaroo family (residue-guess price G_M of a
    modular filter) falls below min(kangaroo, brute force) on the ladder (E2), or
    whether R >= 0.5 at every cell with M4 below 1 (E1); also whether Theorem 3's
    counting step G_M >= C(k, w) survives exhaustive testing.
