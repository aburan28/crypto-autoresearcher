handoff:
  id: TASK-20260904-e1420d
  from: coordinator
  to: coordinator
  objective: >-
    Convert the 8 remaining open RQ-CRYPTO-001 proposals into schema-complete
    hypothesis records and frozen experiment contracts, at status draft /
    review_required -- NOT approved. This is batch 1 of a backlog-conversion
    campaign covering 151 open ECDLP/CRYPTO proposals; it establishes the
    pipeline and its output shape.
  uncertainty_reduced: >-
    Whether each open proposal carries enough specification to become a
    runnable contract, and where the backlog's real conversion obstacles are.
    151 proposals sit unconverted; until they are contracts they cannot be
    ranked, budgeted, scheduled, or refused on their merits.
  inputs:
    - AGENTS.md
    - agents/coordinator.md
    - docs/task-lifecycle.md
    - 'templates/research-records.md -- the hypothesis and experiment schemas are AUTHORITATIVE; copy fields, do not invent them'
    - docs/claims-and-verification.md
    - docs/target-result-profile.md
    - ledger/questions/RQ-CRYPTO-001.yaml
    - ledger/proposals/IDEA-20260801-001.yaml
    - ledger/proposals/IDEA-20260805-52a0d1.yaml
    - ledger/proposals/IDEA-20260805-6253cf.yaml
    - ledger/proposals/IDEA-20260805-9430e9.yaml
    - ledger/proposals/IDEA-20260805-a749bc.yaml
    - ledger/proposals/IDEA-20260807-f73d98.yaml
    - ledger/proposals/IDEA-20260807-fa706a.yaml
    - ledger/proposals/IDEA-20260815-abcbbc.yaml

  id_assignment_use_exactly_these:
    note: >-
      These identifiers are pre-minted and VERIFIED FREE across the whole
      repository in a single indexed scan. Use them exactly. Do NOT mint your
      own, do NOT scan for a next free number, and do NOT reuse one for two
      records.
    pairs:
      - {proposal: IDEA-20260801-001,    hypothesis: H-CRYPTO-adebef, experiment: EXP-CRYPTO-c3ea8a}
      - {proposal: IDEA-20260805-52a0d1, hypothesis: H-CRYPTO-349006, experiment: EXP-CRYPTO-c7f88e}
      - {proposal: IDEA-20260805-6253cf, hypothesis: H-CRYPTO-37bda6, experiment: EXP-CRYPTO-b452e1}
      - {proposal: IDEA-20260805-9430e9, hypothesis: H-CRYPTO-d37a93, experiment: EXP-CRYPTO-3eac6b}
      - {proposal: IDEA-20260805-a749bc, hypothesis: H-CRYPTO-af8ef4, experiment: EXP-CRYPTO-37adcc}
      - {proposal: IDEA-20260807-f73d98, hypothesis: H-CRYPTO-21e529, experiment: EXP-CRYPTO-9389a1}
      - {proposal: IDEA-20260807-fa706a, hypothesis: H-CRYPTO-7dd003, experiment: EXP-CRYPTO-79832d}
      - {proposal: IDEA-20260815-abcbbc, hypothesis: H-CRYPTO-9a0aca, experiment: EXP-CRYPTO-fcc033}

  constraints:
    - >-
      STATUS IS DRAFT, NOT APPROVED. Every experiment specification gets
      `status: review_required` and `approved_by: null`. Approval is the gate
      that authorizes execution and spends compute, and it is reserved for a
      separate Coordinator act after human review. An experiment you mark
      approved is a budget commitment nobody sanctioned.
    - >-
      DO NOT EDIT ANY PROPOSAL. Proposals are immutable. You read them and
      derive new records; you never modify the source.
    - >-
      PRESERVE CONDITIONALITY. Copy `heuristic_assumptions` and
      `target_complexity` (or the proposal's equivalent claim-conditioning
      fields) into the hypothesis INTACT. A conditional claim stays
      conditional, with its validation route and exponents attached. Softening
      or dropping a stated heuristic is the specific corruption this
      instruction exists to prevent.
    - >-
      EVERY CONTRACT MUST BE DECIDABLE. The success criterion must be
      decidable from the predefined metrics, and there must exist a possible
      outcome that counts as NEGATIVE. Reject-and-report any proposal for
      which you cannot construct a falsification criterion, rather than
      writing a contract that cannot fail.
    - >-
      FILL EVERY REQUIRED FIELD or leave the record at review_required with
      the gap named. Required on the experiment: inputs, controls,
      independent_variables, metrics (primary and secondary), seeds and
      replication plan, budget, stopping_rules, invalidation_rules,
      success_criterion, falsification_criterion, required_artifacts. Null
      fields are acceptable ONLY where the template permits, and each must be
      justified in place.
    - >-
      SOME OF THESE ARE PROCESS OR PORTFOLIO PROPOSALS (notably f73d98,
      fa706a, abcbbc -- concerning blocked questions, uncited literature
      entries, and unranked goals). These are legitimately contractable as
      MEASUREMENT experiments over the repository's own state (e.g. citation
      coverage is a countable quantity with a decidable criterion). Contract
      them on their own terms. If one genuinely resists having any measurable
      quantity, say so explicitly and leave it unconverted with the reason --
      do not manufacture a fake metric to force a contract.
    - >-
      Set `source_proposal` on BOTH the hypothesis and the experiment to the
      originating IDEA id. This is the provenance link the backlog audit
      depends on; omitting it makes the record look unconverted.
    - >-
      Bind every hypothesis to `question_id: RQ-CRYPTO-001`, and every
      experiment to its paired `hypothesis_id`.
    - >-
      Claim tier honesty: label each contract's scale_relevance tier
      (toy | medium | crypto) by what it will ACTUALLY test, not by the
      ambition of the proposal it came from.
    - 'Zero compute. Write records only; run nothing. experiment_maximum_runs is 0 for this task.'
    - >-
      Create no DEC/EV/KN-*/CORR record, change no existing record's status,
      and mint no identifier beyond the assigned list.
    - >-
      YAML hygiene, re-checked with a strict parser by the orchestrator: no
      plain scalar containing an unescaped double-quote or a
      colon-followed-by-space (single-quote the WHOLE scalar if needed); no
      duplicate keys at any nesting level; no bare mapping key inside a block
      sequence without a leading '-'. If your session has no shell you cannot
      verify this yourself -- say so plainly rather than claiming a parse you
      did not run.

  deliverables:
    - '8 hypothesis records at ledger/hypotheses/H-CRYPTO-<tok>.yaml, one per assigned pair'
    - '8 experiment contracts at experiments/EXP-CRYPTO-<tok>/specification.yaml, status review_required, approved_by null'
    - >-
      conversion-report.yaml in the task directory: one row per proposal
      giving the assigned ids, whether conversion succeeded, the chosen
      scale tier, the falsification criterion in one line, and any field left
      null with its justification. Name explicitly any proposal you could NOT
      contract and why.
  artifact_paths:
    - coordination/goals/GOAL-ECDLP-001/proposals/B71-BACKLOG-CONVERT-20260904-e1420d/tasks/TASK-20260904-e1420d/conversion-report.yaml
  archived_by: TASK-20260904-f6fad7
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: null
    memory_gb: null
