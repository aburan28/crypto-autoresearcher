  axis: A1
  axis_title: >-
    Objects outside the point group: the twist pair, the shared x-line, and every object T4's what-varies list omits

  objective: >-
    Generate falsifiable proposals whose CENTRAL OBJECT IS NOT the point
    group G of a single curve. The campaign's fourteen lanes are indexed by RESOURCE
    (R1-R8) applied to one curve's ECDLP instance, and 146 committed proposals have
    worked inside that frame. This task is object-first in the sense of
    docs/inventor-protocol.md: name a new object, then ask what it makes computable.

    THE SPECIFIC GAP THIS TASK EXISTS TO PROBE, stated as [open] and NOT as a
    finding you may assume. DECOMPOSITION.md T4 fixes the isogeny class by fixing
    the trace t, and enumerates what varies inside it. The quadratic twist E^d has
    trace -t, so IT IS IN A DIFFERENT CLASS and T1/T2/T4 say nothing whatever about
    it -- yet E and E^d SHARE THE SAME x-LINE: the map E -> E/{+-1} = P^1 and the
    same map for E^d have the same image, and for x in F_p the value x^3+ax+b is
    either a square (x lifts to E), a non-square (x lifts to E^d), or zero (both).
    Index calculus and Semaev's summation polynomials consume x-coordinates AS FIELD
    ELEMENTS (resource R1), not group elements. So a factor base of x-values is
    simultaneously a factor base for E and for E^d, and #E(F_p) * #E^d(F_p) and
    #E + #E^d = 2p + 2 are exact relations across the pair.

    Ask, and let the answer be negative with a named obstruction if that is what is
    true: is the PAIR (E, E^d) -- or the x-line, or the Kummer line, or E(F_p) as a
    possibly-non-cyclic group, or a coset rather than a subgroup -- an object on
    which something is computable that is not computable on either curve alone?

    SECOND MANDATE, EQUALLY IMPORTANT. Audit the SCOPE of the admissibility filter
    itself. H-ENDO-001's argument is that G has prime order N, so End(G) = Z/N and
    every endomorphism acts on G as a scalar. That argument governs MAPS APPLIED TO
    POINTS OF G. Determine, with the quantifier order written out, exactly which
    maps it does NOT govern -- maps out of the x-line, maps between twists, maps
    defined only on a coset of G, maps into a different group, maps whose input is
    the curve equation rather than a point. A precise statement of the filter's own
    boundary is itself a deliverable, and if the boundary turns out to be airtight,
    say so and name why.

  uncertainty_reduced: >-
    Whether GOAL-ENDO-001 has a live path to a publication-grade result, or
    whether its fourteen-lane decomposition has already enumerated the reachable
    mechanisms and the remaining work is closure. The campaign has 146 committed
    proposals, a gating lane paused on instrument calibration at toy scale, and
    a documented convergence toward negatives. This axis tests one specific
    hypothesis about WHERE a live path could still be: that the lane structure
    is indexed by resource applied to a single curve's point group, and that
    objects outside that indexing have not been systematically generated. A
    well-argued finding that this axis is ALSO closed, with the obstruction
    named, reduces the same uncertainty and is an accepted deliverable.

  seed_note: >-
    DO NOT ASSERT ANY OF THE ABOVE AS TRUE. The x-line/twist observations are
    elementary and checkable; check them before building on them, and record any
    that fails. The campaign has been burned by hull-fitted claims and treats a
    clean negative with a named obstruction as an accepted deliverable.

