  constraints:
  - >-
      STANDING CONSTRAINT -- H-ENDO-001 IS THE ADMISSIBILITY FILTER AND IS NOT RETESTED. Every endomorphism acts on the prime-order subgroup G as multiplication by a scalar, so adding endomorphisms adds coordinates and no congruence. A proposal whose only use of an endomorphism is to apply it to points of G is INADMISSIBLE ON ITS FACE and must not be filed. Name your resource from the R1-R8 taxonomy in analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md section 2, or explain why the taxonomy needs a new entry.
  - >-
      STANDING CONSTRAINT -- KN-FIND-b7e091 IS BINDING AND IS EXTENDED, NEVER REVISITED. The generic-group closure of the incidence and endomorphism-image oracle classes at exponent 1/2 stands. Do not re-litigate it.
  - >-
      STANDING CONSTRAINT -- H-STR-002 IS `weakened` (DEC-20260727-009) AND ITS REPLICATION OBLIGATION DEFER-BATCH009-001 IS OPEN AND UNRETRACTED. Goal pause condition P2 fires if a result would bear on it IN EITHER DIRECTION. This campaign may not transition that hypothesis. If a proposal touches phi-stable factor bases, state explicitly which mechanism the weaken did NOT touch, and flag the proposal as P2-adjacent so the Coordinator can route it.
  - >-
      STANDING CONSTRAINT -- PAUSE CONDITION P3. If any candidate appears to exceed the automorphism-discounted rho baseline, DO NOT state the excess in any record. Flag it, stop, and hand it to the Coordinator for an independent review-adversarial session. The automorphism discount is a constant at most sqrt(6) (KN-TECH-018) and is BASELINE CALIBRATION, never an exponent.
  - >-
      NOVELTY SCREEN IS MANDATORY AND IS CHECKED IN REVIEW. 146 committed proposals already exist under this goal in ledger/proposals/ and the fourteen lanes are fixed in DECOMPOSITION.md. Before filing, grep the proposal corpus for your central object and cite what you screened against in the `novelty_screen` field, and use `discriminated_from` to name the nearest existing proposal and say how yours differs. A rediscovery filed as novel is the single most costly failure mode available to this task.
  - >-
      CORE RULE 5 -- NEVER FABRICATE. No invented commands, outputs, timings, statistics, citations, or runs. You are producing PROPOSALS, not evidence. Every non-citation claim is marked [fact] (elementary and verifiable, and you verified it) or [open] (to be tested). Missing data stays missing.
  - >-
      CLAIM DISCIPLINE. claim_tier stays `toy`. sota_delta is zero for every proposal in this batch -- nothing here is an attack and none is claimed. Fill `dominated_by` honestly: as an attack, everything in this campaign is currently dominated by parallel Pollard rho at 0.886*sqrt(N) group operations with O(1) memory.
  - >-
      YOU CHANGE NO STATUS. You do not assign work, do not move any hypothesis, do not approve anything, and do not edit any record outside your declared write_scope. You have no Bash tool: your IDEA identifiers are PRE-ALLOCATED below and verified free -- use those exact ids and no others, and do not mint new ones.

  deliverables:
  - >-
      Between 4 and 8 IDEA-*.yaml records, using ONLY the pre-allocated identifiers listed in `inputs.preallocated_idea_ids`, written to ledger/proposals/. Quality over count: 4 deep, genuinely novel, fully-controlled proposals beat 8 thin ones, and filing fewer than 8 is a correct outcome, not a shortfall.
  - >-
      Each record follows the field structure of the existing corpus (see ledger/proposals/IDEA-20260808-4d77a6.yaml as the format exemplar): id, added, proposed_by, status: proposed, question_id, goal_id, title, class, claim, mechanism, why_not_a_renamed_known_approach, predictions, minimal_test, controls, confounders, falsification_conditions, interpretation_limits, assumptions, heuristic_assumptions, target_complexity, sota_delta, dominated_by, estimated_cost, recommended_priority, honest_prior_of_survival, novelty_status, novelty_screen, discriminated_from, source_refs.
  - >-
      A `minimal_test` that is genuinely DISCRIMINATING and cheap: the smallest measurement or derivation that could kill the idea. An idea with no cheap killer is not yet an idea.
  - >-
      A matched NULL OBJECT for every proposal that measures anything (docs/inventor-protocol.md, controls before belief). State the null explicitly in `controls`.
  - >-
      For any proof-oriented proposal, a `proof_search_map` per section 8 of docs/inventor-protocol.md (KN-TECH-080): exact bottleneck and baseline reproduction, observation-collision search, quantifier order, method ceiling, and nearby-object control.
  - >-
      One report at the task's own path: coordination/goals/GOAL-ENDO-001/batches/BATCH-aeeb17/tasks/<TASK-ID>/idea-report.yaml -- listing the ids filed, the ids left unused, the axis coverage, what you screened against, which candidate objects you considered and REJECTED with the reason, and any P2/P3 flags raised.

