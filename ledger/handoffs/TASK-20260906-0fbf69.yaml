  objective: >-
    Discharge CF-9. For RUN-WESOVOW-001 and RUN-WESOVOW-201692-001, whose manifests
    record `dirty_tree: true`, establish from COMMITTED ARTIFACTS AND GIT HISTORY
    ONLY what can be attested about the execution provenance, limb by limb, and
    record each limb as attested with the artifact and checksum that attests it, or
    as UNATTESTABLE with the exact fact that is unrecoverable and what would recover
    it. Write a NEW record in your own task directory. Never edit a manifest, never
    re-run anything, never execute cost_model.py.
  uncertainty_reduced: >-
    Whether the execution provenance of the two runs this campaign's cost claims
    descend from is recoverable at all - an item held for two consecutive batches
    and one of the standing grounds on which the citation prohibition is retained.
  inputs:
    - experiments/EXP-WESOVOW-001/runs/RUN-WESOVOW-001/ and .../RUN-WESOVOW-201692-001/ - manifests, environment, runtime receipts, command, stdout and stderr; READ-ONLY AND IMMUTABLE
    - The repository's git history, read-only - git log, git show, git cat-file, git rev-list; you may compute the sha256 of committed blobs
    - ledger/decisions/DEC-20260904-166ab5.yaml (RC-7, the origin), DEC-20260904-4c81b6.yaml next_actions[2] and DEC-20260905-3b8e94.yaml next_actions[3] - what CF-9 has always asked for and why it was held twice
    - coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/review_plan.yaml joint J4 and its null object - what a reviewer will do to this record
    - A scratchpad OUTSIDE the repository for any script you write
  constraints:
    - WRITE A NEW RECORD. NEVER EDIT, ANNOTATE OR ADD A FIELD TO EITHER MANIFEST. Run records are immutable; an immutable record that turns out to be unattestable stays exactly as it is, and the attestation lives in your own task directory.
    - NEVER RE-RUN ANYTHING AND NEVER EXECUTE cost_model.py, with or without WESOVOW_RAW_PATH set. Its default output path names the committed run directory RUN-WESOVOW-201692-001 (CF-10), so a single careless invocation overwrites a committed run artifact. Re-running is not a way to attest anything - it would produce a new execution, not evidence about the old one.
    - ATTEST LIMB BY LIMB, THEN SUMMARISE PER RUN. At minimum - (i) does `git.commit_at_run_time` exist and is it reachable; (ii) where a `source_sha256_at_run` is recorded, does it match the sha256 of the committed blob at that commit, COMPUTED and quoted on both sides; (iii) which declared artifacts exist, are committed, and at which commit each was first added; (iv) what the recorded `dirty_summary` establishes and what it merely asserts; (v) what the environment and runtime receipt establish about the machine and interpreter.
    - >-
      BIND TO A CHECKSUM, NEVER TO A NARRATIVE (CF-17). `dirty_tree: true` means
      the executed bytes NEED NOT equal any committed bytes, so `the commit exists
      and is reachable` attests the COMMIT and not the EXECUTION; a record that
      slides from one to the other has overstated.
    - USE THREE VERDICTS AND DEFINE THEM - ATTESTED (the exact bytes executed are identified and match a recoverable object), PARTIALLY ATTESTED (named limbs recoverable, named limbs not), UNATTESTABLE (the exact unrecoverable fact, why, and what would recover it). UNATTESTABLE IS A COMPLETE RESULT AND IS CONTRACTED AS ONE IN ADVANCE.
    - AN INFRASTRUCTURE GAP IS NEVER A MATHEMATICAL RESULT. Nothing you find is evidence about the cost model, the contract, the paper or any isogeny problem in either direction, and your record must say so. Do not assert or imply that the runs' RESULTS are right or wrong because of what provenance you could recover.
    - >-
      RUN THE NULL OBJECT. Apply your procedure to a run manifest recording
      `dirty_tree: false`; find a committed one if it exists, and if none does,
      construct one in your scratchpad and say plainly that you did. A procedure
      that returns UNATTESTABLE for everything carries no information.
    - DO NOT COPY ANY VALUE OUT OF A RAW RESULT OR STDOUT. No PAPER_PAIRS value, delta, crossover, margin, sign or speedup may appear in your record; name rows and fields BY LOCATOR.
    - RESTATE THE CITATION PROHIBITION AND ITS PREDICATE EXTENSION VERBATIM, lift neither, and state whether either fired. CF-9 is ONE GROUND among several on which the prohibition is retained; discharging it lifts nothing by itself and your record may not suggest otherwise.
    - maximum_runs bounds executions of experiment code, producer implementations and anything that writes a run record; read-only git commands and your own scratch scripts are not runs. This batch authorizes ZERO new experiment runs.
    - Every git command appears in the record with its exact text and verbatim output, or is not claimed. NEVER RECONSTRUCT, ESTIMATE OR GUESS a commit sha, a parent sha or a hash.
    - RECORD YOUR INFERENCE PROVENANCE HONESTLY - requested policy, adapter-resolved model identifier, self-report if it differs, model_verified and whether a probe was actually run, effort, fallback status - escalate any divergence, never record a probe you did not run, and disclose what your launching prompt told you (CF-15).
    - Change no status, write no ledger record, commit nothing, approve nothing, repair no artifact, and make no security, SQIsign, CSIDH, standardized-parameter, exponent or asymptotic claim in either direction.
    - Never select a provider, backend, endpoint, or model identifier containing Bedrock, case-insensitively.
  deliverables:
    - >-
      run_provenance_attestation.yaml - per run: the verbatim provenance fields
      quoted with locators; limbs (i)-(v) each with its verdict, the exact command
      run, its verbatim output, and the artifact or checksum it rests on; a per-run
