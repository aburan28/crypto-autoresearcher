      would change it; the null-object result; an explicit statement that nothing
      here is evidence about the model, the contract or any isogeny problem; and the
      citation prohibition and predicate extension restated verbatim with whether
      either fired.
    - runtime_session_receipt.yaml - inference provenance, launching-prompt disclosure, wall clock used, and an explicit statement that no run record was created or modified, that cost_model.py was neither executed nor modified, and that nothing under experiments/ or inputs/ was written, with how you checked.
  artifact_paths:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/tasks/TASK-20260906-0fbf69/run_provenance_attestation.yaml
