    - Every ATTESTED limb binds to a checksum against recoverable bytes and not to a narrative; every UNATTESTABLE limb names the exact unrecoverable fact and what would recover it.
    - The null object was run and returned a different answer from the two dirty-tree runs, or the record states plainly that it did not and what that means about the procedure.
    - The record states in its own words that an infrastructure gap is never mathematical evidence and asserts nothing about whether the runs' results are right.
    - Neither manifest, and nothing else under experiments/ or inputs/, was modified; cost_model.py was neither executed nor modified; `git status --porcelain` shows nothing outside this task directory; and the record states how this was checked.
    - No value from any raw result, stdout or PAPER_PAIRS appears anywhere in the record; rows and fields are named by locator.
    - The citation prohibition and its predicate extension are restated verbatim, neither is lifted, and the record states that discharging CF-9 lifts nothing by itself.
