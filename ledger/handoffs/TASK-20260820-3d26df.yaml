  role: idea-generator
  from: coordinator
  to: idea-generator
  objective: 'Author protocol/BCP-2.yaml: a complete, dispatchable supersession of BCP-1 carrying every
    amendment in DEC-20260810-1163ec F-4, so that a later batch can dispatch the blind calibration run
    under BCP-2 without any further protocol change.'
  uncertainty_reduced: Whether a superseding protocol can make the calibration pre-dispatch gate mechanically
    decidable while keeping the firewall at least as strong as BCP-1's.
  inputs:
  - BCP-1 (protocol/BCP-1.yaml) — the text being superseded; carry forward its firewall, ordering guarantee
    and declared-not-checked list in substance
  - The BATCH-46254b red team report (reviews/TASK-20260810-b9d956/red-team-report.yaml) — the ranked
    amendments, joint verdicts, named obstruction
  - The BATCH-46254b validation report (reviews/TASK-20260810-23e0ea/validation-report.yaml) — the firewall-enforceability
    determination and defect list
  - implementation-pin.yaml — the pinned independent pair (IMPL-1/IMPL-3) the certificate rule must reference
  - quarantine/MANIFEST.yaml — the declared canonicalization and pre-registered digest that BCP-2 must
    pin (SHA256 AND CANONICALIZATION TEXT ONLY — NEVER THE PAYLOAD FILE)
  - harness/runner.py — what exists today (the kind BCP-2 must specify against)
  - kb/src/crypto_kb/ingest/repo_corpus.py — the real staging rules (RULES), for the corrected DEFECT-4
    reference
  constraints:
  - SC-1 FABRICATE NOTHING. No invented timing, measurement, throughput, citation, review verdict, model
    identifier or commit SHA. A field that is not yet knowable stays null and is named as such.
  - SC-2 CLAIM CEILING. Assert nothing about MD5 - no collision, no preimage, no complexity, no method
    ceiling, no obstruction, and no comparison against any published result in either direction.
  - SC-3 UNVERIFIED FIGURES STAY MARKED. Every figure not obtained in primary text stays marked unverified
    and is never cited as authority in either direction.
  - SC-4 A failed, halted or exhausted search is a BUDGET OUTCOME about a solver and NEVER evidence about
    MD5 (AGENTS.md rules 5 and 8).
  - SC-5 Anything not attempted is named OPEN AND UNATTEMPTED and is never recorded as tried, screened
    or negative.
  - SC-6 Change no hypothesis, question, experiment or goal status; approve no experiment; promote no
    knowledge; edit no committed record — BCP-1 in particular is IMMUTABLE; BCP-2 references it, never
    modifies it.
  - SC-7 HALT AT THE DECLARED wall_clock_seconds (900 s) and report the halt truthfully as infrastructure
    signal, naming the dropped work as scope rather than as an answer.
  - SC-8 Never select, configure, probe, contact or use Amazon Bedrock (AGENTS.md rule 16).
  - NEVER READ the quarantined payload (coordination/goals/GOAL-MD5-001/quarantine/MD5-COLLISION-PATH-WANG-2004-199.yaml).
    BCP-2 is specified against the MANIFEST's sha256 and canonicalization text, the reports, and BCP-1.
    Reading the payload would consume the very blindness this protocol exists to protect.
  - 'DO NOT CHOOSE A DIFFERENT canonical serialization than the one the committed MANIFEST declares (sha256
    of yaml.safe_dump(payload[''path''], sort_keys=True, default_flow_style=False), UTF-8). Pin that serialization
    byte-for-byte, with its exact command, and acknowledge its PyYAML-specificity as a declared limitation
    in BCP-2''s declared-not-checked list. If you judge a different serialization necessary, HALT and
    report instead of writing BCP-2: re-pinning the digest requires a superseding MANIFEST record, outside
    this batch''s ceiling.'
  - BCP-2 must tighten or hold BCP-1's firewall, never loosen it. A loosening is a batch-halting finding.
  deliverables:
  - 'protocol/BCP-2.yaml — the superseding protocol: (a) the pinned canonical serialization with its exact
    command and the pre-dispatch gate that compares the run''s serialization digest to the pre-registered
    one; (b) the md5_collision_pair certificate schema (messages m1/m2, digest, the two pinned independent
    implementations per implementation-pin.yaml, verified:false on any mismatch or m1==m2) matching what
    TASK-20260820-e4405b implements; (c) the null-object comparison with a NAMED tolerance and NAMED baseline
    and a decidable decision table (every outcome row labelled: what it shows, what it does not show);
    (d) the confound caveat block that any REDISCOVERY-eligible success must carry (partial-structure-recall
    not excluded by the control); (e) wrapper-measured wall_seconds as the charging convention; (f) the
    corrected staging-rules reference (RULES in kb/src/crypto_kb/ingest/repo_corpus.py, with the file
    sha256 at freeze time); plus the carried-forward firewall (quarantine marker, CONSUMPTION rule + INV-2,
    closed hash-manifested input set), the ordering guarantee (frozen before any calibration run), the
    declared-not-checked list (parametric channel, named obstruction), and a supersedes: BCP-1 block stating
    what changes and what carries forward, section by section.'
  - tasks/TASK-20260820-3d26df/authoring-report.yaml — what was written, the knowledge-retrieval query
    and outcome (attempted before any novelty claim), every declared limitation, the section-by-section
    BCP-1-to-BCP-2 delta, and a truthful budget account.
  artifact_paths:
  - coordination/goals/GOAL-MD5-001/batches/BATCH-312472/protocol/BCP-2.yaml
  - coordination/goals/GOAL-MD5-001/batches/BATCH-312472/tasks/TASK-20260820-3d26df/authoring-report.yaml
  archived_by: TASK-20260820-513ea9
  inference:
    policy: research-deep
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 900
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
  - 'BCP-2''s pre-dispatch gate is mechanically evaluable: a reader with only BCP-2, the committed quarantine
    MANIFEST, and harness/runner.py can decide dispatchability without any further protocol text.'
  - Every F-4 amendment is present and checkable; none is softened into a recommendation.
  - No firewall element is looser than BCP-1's; the delta table states each change and its direction.
  - The quarantine payload was not read (the authoring report attests it).
  - Knowledge retrieval attempted, query and outcome recorded, no novelty inference drawn from absence.
  - Nothing committed (the snapshot task stages these bytes); nothing written outside the write scope.
  return_format: A summary naming the two declared artifact paths, the section-by-section BCP-1-to-BCP-2
    delta (each change and its direction), the pinned canonical serialization with its exact command,
    the declared-not-checked list, the knowledge-retrieval query and outcome, the attestation that the
    quarantine payload was not read, and a truthful budget account.
