  objective: >-
    PRE-ARCHIVE SCHEMA CONFORMANCE REPAIR of the eight finalized run manifests
    of EXP-ECRANK-76a70d, and nothing else. tools/validate_ledger.py
    (check_run) currently fails on all eight with "expected top-level key
    'run'": the executor's drivers wrote FLAT manifests, while the ledger
    schema requires a nested `run:` record carrying id, experiment_id, status,
    code, environment, inputs, timing, and result, plus the companion files
    command.txt and environment.json in each run directory. Bring the eight
    records into schema WITHOUT altering one recorded value, so the snapshot
    archive TASK-20260906-cf7fcf can bind bytes that validate.
  uncertainty_reduced: >-
    Whether the executed run package can be archived at all: a ledger that
    does not validate blocks the snapshot, the blinded review round, and the
    disposition. This task removes that block and nothing else.
  why_this_task_exists: >-
    The frozen contract's required_artifacts clause names "runs/*/manifest.yaml,
    code.command + code.commit + dirty-tree state" but never names the
    ledger's nested `run:` schema, so the drivers satisfied the contract and
    still failed tools/validate_ledger.py. The defect is SCHEMA CONFORMANCE
    ONLY. It is not evidence about H-ECRANK-ee6e0e, not a control failure,
    not an invalidation under IV-1..IV-7, and not a re-scoring of any run
    (core rules 3 and 5). Because the manifests are still UNCOMMITTED worker
    output, they are repaired in place before any archive binds them; no
    durable record is edited and no supersession entry is created. The
    contract-wording gap is recorded for the closing decision
    DEC-20260906-7448cf so the next frozen contract names the schema.
