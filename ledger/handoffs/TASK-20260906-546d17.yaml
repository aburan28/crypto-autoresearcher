  constraints:
    - >-
      NO RE-SCORING, EVER. Every number, timestamp, seed, sha256, counter,
      validity string, and resource measurement already recorded stays
      byte-equivalent in meaning: the repair MOVES fields into the nested
      shape, it never edits, rounds, recomputes, backfills, or drops one.
      Where the schema needs a field the flat manifest does not carry, the
      value is derived ONLY from an existing recorded field of the same run
      (for example command.txt from code.command, environment.json from the
      environment block) and the derivation is named in the mapping note.
    - >-
      Core rule 9: fabricate nothing. A field whose value does not already
      exist in that run's recorded artifacts is written as an explicit null
      with a sibling note saying the run did not record it -- never guessed.
    - >-
      Preserve the executor's own classification verbatim: run.status carries
      the recorded validity_status ("completed" for R1-R5, R7, R8;
      "completed_not_evaluable" for R6) and result carries the recorded
      validity_reason text. R6's inertness is preserved as recorded, not
      upgraded to a result.
    - >-
      CERTIFICATE KIND MUST NOT OVERCLAIM. CERTIFICATE_KINDS is
      discrete_log | decomposition | key_recovery. These runs assert NONE of
      those claims, so run.result.certificate.kind is "none" with
      verified true and a verifier string naming the exact descent-free
      verifier stack actually used (certify76.py wrapping the committed
      exact_certify.py at its pinned sha256), plus a note that the
      experiment's own per-instance certificate artifacts live under
      experiments/EXP-ECRANK-76a70d/certificates/ and are verifier-checked
      there. Never record a kind the run does not assert.
    - >-
      Write ONLY the eight manifest.yaml files and the sixteen new companion
      files (command.txt, environment.json per run directory) inside
      experiments/EXP-ECRANK-76a70d/runs/. Do NOT touch raw-result.json,
      stdout.log, stderr.log, checkpoints/, diagnostics/, determinism-diff.txt,
      the attempt-*/ failure directories or their manifests, certificates/,
      source/, execution-report.yaml, the frozen specification.yaml, or
      anything outside the experiment directory. Workers never commit.
    - >-
      The attempt-*/ subdirectory manifests are PRESERVED FAILURE RECORDS
      (core rule 5) and are outside the validator's discovery glob
      (^experiments/[^/]+/runs/[^/]+/manifest.yaml$): leave them exactly as
      they are.
