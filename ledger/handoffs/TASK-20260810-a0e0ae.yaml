      does not pick a side, AND THE CAPABILITY PROBE BELOW IS THE RESOLUTION.
  constraints:
    - >-
      THE FOUR BINDING CLAUSES IN THE TASK CARD APPLY IN FULL AND ARE STATED THERE IN
      IDENTICAL LANGUAGE ACROSS PRODUCING AND ARCHIVAL CARDS: (i) THE C2 STAMP DUTY --
