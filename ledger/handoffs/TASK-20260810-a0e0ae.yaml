handoff:
  id: TASK-20260810-a0e0ae
  from: coordinator
  to: executor
  objective: >-
    RANK 2 OF BATCH-005. Run CTRL-810-A, THE SATURATING FRONTIER CENSUS. Compute the
    ACTUAL composed relation size |R^(n)(x)| for n = 1..5 BY DIRECT COMPOSITION under
    TWO EXPLICITLY SEPARATED COMPOSITION MODELS -- (M-AFFINE) Phi composed with
    itself, no nonlinear layer, and (M-NONLINEAR) Phi . SB composed, with the real AES
    S-box -- and report |R^(n)| against BOTH the modelled J^n AND the frontier ceiling
    q^(4(4 - dim K)). ADD ker(M+I) = span(1,1,1,1) TO THE GF(2^8) WITNESS LIST, and
    run HEUR-806-1's OWN GF(2^8) CENSUS as the secondary leg. THE THREE OUTCOMES ARE
    PRE-REGISTERED BY THE RED TEAM AND MAY NOT BE ADJUSTED AFTER MEASUREMENT:
    (i) |R^(n)| = min(J^n, ceiling) with the two models differing => RT-2 CONFIRMED and
    RT-3 CONFIRMED MATERIAL; (ii) |R^(n)| agrees with the UNCAPPED J^n anywhere at
    n >= 2 => RT-2 IS FALSIFIED, an outcome the red team named deliberately against
    itself and which YOU MUST REPORT AS SUCH IF IT OCCURS; (iii) M-nonlinear tracks
    M-affine closely => RT-3 materially weakened, n-axis survives with a stated class
    caveat. ON THE SECONDARY LEG: RT-1 predicts the GF(2^8) minimum is 2^24 attained
    exactly on ker(M+I) in dimension 1, and ANY KERNEL WITH J < 2^24 FALSIFIES
    HEUR-806-1.
  uncertainty_reduced: >-
    Whether three MAJOR red-team findings stand. RT-1, RT-2, RT-3 and RT-5 are settled
    by this ONE bounded control, and it IS HEUR-806-1's own already-specified
    validation experiment, which the Coordinator contract requires be paired with a
    conditional result in the same or the following batch. THAT OBLIGATION, NOT ITS
    RESEARCH RANK, IS WHY IT CANNOT BE DROPPED: it is NON-DEFERRABLE past BATCH-005,
    the last batch that may open new research questions. It is also the precondition
    for any knowledge promotion out of the BATCH-004 material.
