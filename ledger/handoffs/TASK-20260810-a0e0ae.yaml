      AND UNATTEMPTED and NOT as a bound on the minimum. LEG C -- GF(2^8) direct
      composition at n >= 2, the leg NR-3 names as needing numpy or C -- IS CONDITIONAL
      BEHIND A RECORDED ONE-SHOT CAPABILITY PROBE.
    - >-
      THE CAPABILITY PROBE IS YOUR FIRST COMPUTE ACT, after the C2 start stamp and
      BEFORE any census. Write capability_probe.json recording the EXACT commands and
      exit statuses of (i) `python3 -c 'import numpy; print(numpy.__version__)'` and
      (ii) a trivial C compile-and-link of a hello-world with the system compiler. NO
      NETWORK FETCH OF A PACKAGE IS REQUIRED OR ASSUMED; at most ONE bounded, recorded
      install attempt from an already-available local source may be made, and its
      failure is recorded as INFRASTRUCTURE SIGNAL and NOT RETRIED. IF THE PROBE
      SUCCEEDS, run leg C at the scale that fits and record the achieved n-range
      exactly. IF THE PROBE FAILS, LEG C IS OUT OF SCOPE FOR BATCH-005 AS
      INFRASTRUCTURE SIGNAL AND IS RECORDED AS OPEN AND UNATTEMPTED. IT IS NEVER
      RECORDED AS A NEGATIVE MATHEMATICAL RESULT, never as evidence about |R^(n)| over
      GF(2^8), and NEVER AS A CONFIRMATION OR A REFUTATION OF RT-2 OR HEUR-806-1
      (AGENTS.md rule 5). THE BATCH DOES NOT FAIL ON LEG C.
    - >-
      THE THREE PRE-REGISTERED OUTCOMES AND THE RT-1 SECONDARY-LEG PREDICTION ARE FIXED
      BEFORE MEASUREMENT AND MAY NOT BE ADJUSTED AFTER IT. Write them into the report
      in a section marked as written first, anchored in committed bytes, with the
      measured values beside them. IF THE MEASUREMENT FALSIFIES RT-2, REPORT THAT
      PLAINLY: the red team named that outcome deliberately against itself and
      suppressing it would be the exact failure this control exists to prevent.
    - >-
      THE TWO COMPOSITION MODELS ARE REPORTED SEPARATELY AND ARE NEVER MERGED, AVERAGED
      OR SUBSTITUTED FOR ONE ANOTHER. That separation IS RT-3: one horn means Phi^n is
      a single affine map whose branching SATURATES at the ceiling and is not J^n; the
      other means pi.SB is not F-linear and PROPOSITION 806-1 GOVERNS NO INTERFACE
      AFTER THE FIRST. Report both columns side by side for every n and every witness
      and state which horn the measurement supports, or that it supports neither
      cleanly.
    - >-
      THE LAYER-DEPENDENCE SCREEN v2 APPLIES. Write and freeze screen_ctrl810a.json
      FIRST, before any derivation or compute and before the capability probe, with the
      ordering anchored in committed bytes, the closed verdict set PURSUE /
      IN_SCOPE_VACUOUS / DEFERRED_UNBOUNDED, a separate tractability judgement for
      every PURSUE, both interface conversions, and DEFERRED_UNBOUNDED excluded from
      any count. IF THE SCREEN HAS LITTLE TO BITE ON HERE BECAUSE THIS IS A CENSUS AND
      NOT AN ARGUMENT, RECORD THAT PLAINLY RATHER THAN MANUFACTURING CANDIDATES.
    - >-
      EXHAUSTIVE WHERE THE SPACE PERMITS, NOT SAMPLED-AND-EXTRAPOLATED. Where you
      sample, state the size, the seed, the distribution and WHAT THE SAMPLE DOES NOT
      ESTABLISH. Label every analogue AS an analogue, state that its readings are NOT
      evidence about GF(2^8) and CERTAINLY NOT about AES, argue transfer rather than
      assuming it, and note the GF(2^2) analogue is additionally NOT MDS.
    - >-
      YOU MAY NOT REPAIR, REINSTATE, EXTEND OR QUOTE SECTION 5's COST TABLE AS A SOURCE
      OF NUMBERS. It is STRUCK AS UNUSABLE IN EITHER DIRECTION. Your measurements are
      INPUTS to a Coordinator decision, not a repair. Report what you measured and what
