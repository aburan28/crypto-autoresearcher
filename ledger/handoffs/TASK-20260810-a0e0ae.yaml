    - >-
      THE LEG SPLIT IS BINDING AND IS NOT YOURS TO RENEGOTIATE. LEG A -- the GF(2^4)
      census, n = 1..5, BOTH composition models, over the enumeration the producer
      already ran -- IS IN SCOPE, PRIMARY, PURE-PYTHON ADEQUATE, AND ALONE MEETS THIS
