      six producer witnesses PLUS ker(M+I) -- IS IN SCOPE AND DEPENDENCY-FREE BY
      DEMONSTRATED MEASUREMENT (RT-1, sub-second per call in pure Python); the seeded
      sample of 10^3 kernels per dimension is admitted ONLY AS FAR AS THE BUDGET
