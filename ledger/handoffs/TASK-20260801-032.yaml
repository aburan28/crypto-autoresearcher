handoff:
  id: TASK-20260801-032
  from: coordinator
  to: validator
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-023
  objective: >-
    Validate the integrity of the RUN-EQD-001-calib package on the TASK-20260801-022
    snapshot alone. Return ADMISSIBLE or INADMISSIBLE with concrete defects. FOUR CHECKS
    DOMINATE. (1) THE NULL ARM NEVER TOUCHED THE REAL DATA - confirm STRUCTURALLY, from
    the archived package itself, that no half-tuple of the frozen deterministic factor
    base was enumerated, that the package contains no OBJ-REAL sample, no deterministic
    factor-base x-list and no statistic computed from one, and that the real-arm entry
    point was not invoked. This is ATS-1 clause 2 and you check it against the artifact,
    not against the contract's sentence. (2) THE DRIVER IS COMPLETE AND ITS REAL-ARM
    ENTRY POINT IS PRESENT AND UNEXECUTED - read the source, confirm the real-arm entry
    point exists and is reachable, and confirm from the stdout, the raw record and the
    command line that it was not called. (3) THE DRIVER HASH IS BOUND - recompute the
    sha256 of experiments/EXP-EQD-001/implementation/eqd001_driver.py yourself and confirm
    it equals both the value recorded in the calibration manifest and the DRIVER_SHA256
    named in the TASK-20260801-022 snapshot receipt. A mismatch here means
    CTRL-EQD-DRIVER-HASH cannot be checked at the real arm at all. (4) THE MEASURED NULL
    NUMBERS ARE REPRODUCIBLE - regenerate a declared subset of the CAL-1 replicates from
    the recorded streams and seeds and confirm the archived statistic values, recompute
    the order statistics THR-EQD-1 will select from the archived replicate values, and
    recompute the CAL-2 detection rates and the CERT-EQD-1 certified-delta predicate.
    Report every recomputation as agreeing or disagreeing with a concrete number.
  uncertainty_reduced: >-
    Whether the calibration package is sound enough for a reading rule to be frozen
    against it - the question every later threshold in this batch depends on and which no
    other task in the chain asks.
  why_this_task_exists: >-
    THE CALIBRATION IS DECLARED NON-EVIDENTIAL ABOUT EVERY HYPOTHESIS, AND THAT IS NOT THE
    SAME THING AS NEEDING NO INTEGRITY CHECK. Every threshold in this experiment is an
    order statistic of the CAL-1 output and the certified delta is a predicate on the
    CAL-2 output, so a defect in the calibration package silently poisons the entire batch
    - it would produce a reading rule whose numbers look traceable and are wrong.
    TASK-20260801-025 audits whether the calibration TUNED the experiment; this task
    checks whether the calibration is SOUND. Those are different questions, they are
    deliberately assigned to different sessions, and collapsing them would leave the
    second unasked.
  inputs:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/archives/TASK-20260801-022/snapshot_commit_receipt.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/archives/TASK-20260801-020/snapshot_commit_receipt.json
  - experiments/EXP-EQD-001/specification.yaml
  - experiments/EXP-EQD-001/implementation/eqd001_driver.py
  - experiments/EXP-EQD-001/implementation/implementation.md
  - experiments/EXP-EQD-001/runs/RUN-EQD-001-calib/manifest.yaml
  - experiments/EXP-EQD-001/results/calib/null_replicate_statistics.json
  - experiments/EXP-EQD-001/results/calib/power_curve.json
  - experiments/EXP-EQD-001/results/calib/instrument_characterization.json
  - ledger/hypotheses/H-EQD-001.yaml
  constraints:
  - >-
    INDEPENDENT SESSION. You did not author the driver and did not run the calibration.
    Read only the TASK-20260801-022 snapshot commit.
  - >-
    REGENERATE, DO NOT ACCEPT. Rebuild both curve instances from master seed 2301 and
    regenerate a declared subset of the CAL-1 replicate draws from the recorded streams,
    and report agreement or disagreement with a concrete number rather than a verdict word
    alone.
  - >-
    Confirm every calibration arm carries exactly n = C(512, 2) = 130816 pairs, that the
    degenerate-draw count is exactly zero, and that every null redraw was counted.
  - >-
    Confirm CAL-1 used 200 INDEPENDENT DISJOINT replicate pairs per bit size, that is 400
    independent random factor bases per cell, and NOT a chained pool - the exact level of
    THR-EQD-1 depends on that independence and a chained pool would break exchangeability
    with the new observation.
  - >-
    Recompute the order statistics THR-EQD-1 selects - the 199th ascending of 200 for each
    one-sided statistic and the 3rd and 398th of 400 for STAT-DUP - and record them,
    WITHOUT freezing them into any file. TASK-20260801-023 owns the freeze; you own the
    arithmetic check.
  - >-
    Recompute the CAL-2 detection rate at every delta on the frozen ladder and evaluate the
    CERT-EQD-1 predicate yourself, and say whether a certified delta exists at both bit
    sizes or whether CAL-STOP-1 is met.
  - >-
    Report explicitly whether any statistic has a DEGENERATE null distribution under
    CAL-STOP-1 second_stop_leg - zero variance, an identically zero value, or a threshold
    the largest-delta plant cannot exceed - and name it with its measured reason. Do NOT
    exclude it yourself; that is TASK-20260801-023's pre-declared call.
  - Confirm every recorded e_1 and e_2 lies in [0, p) and that every OBJ-NULL-RFB admissible-support fraction is exactly 1.0.
  - >-
    Confirm the calibration package contains NO factorization, NO smoothness statistic, NO
    Dickman evaluation, NO search arm, NO timing decision variable, NO cost identity and
    NO R.
  - >-
    Confirm manifest.yaml is present with its required fields and that command.txt,
    environment.json, stdout.log, stderr.log and raw-result.json exist beside it.
  - >-
    TREAT NO CALIBRATION NUMBER AS EVIDENCE ABOUT ANY HYPOTHESIS. RUN-EQD-001-calib is
    expressly non-evidential about H-EQD-001, HEUR-DS-1 and H-SMTH-001 in either
    direction. Your report is about the instrument and may not state or imply a
    disposition about any hypothesis.
  - >-
    Do NOT interpret the calibration, do NOT freeze or propose any threshold, do NOT
    classify anything against a reading rule that does not yet exist, and do NOT state a
    disposition.
  - >-
    Do not audit whether the calibration TUNED the experiment - that is the named ATS-1
    duty of the reviewer at TASK-20260801-025 and it is deliberately assigned to a
    different session. Your question is whether the calibration is SOUND.
  - Timeouts and crashes are infrastructure, never mathematical negatives (AGENTS.md rule 5).
  - MAKE NO COMMIT. Do not alter any ledger record, any specification or any run artifact.
  - >-
    Do not read-modify, import, edit or stage any file under experiments/EXP-DS-001/ or
    experiments/EXP-SMTH-001/. Leave FAEST and XEDN alone.
  deliverables:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/reviews/TASK-20260801-032/calibration_validation_report.yaml
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/reviews/TASK-20260801-032/calibration_validation_report.yaml
  archived_by: TASK-20260801-031
  archived_by_note: >-
    ARCHIVED BY THE LEDGER COMMIT RATHER THAN BY THE TASK-20260801-024 SNAPSHOT, WHERE IT
    WOULD NATURALLY SIT, AND THE REASON IS STRUCTURAL. _validate_review_chains in
    tools/research_dispatch.py requires the archive of every independent review of a
    review_required producer to be a LEDGER archive that directly depends on that review;
    TASK-20260801-024 is a snapshot, so assigning this report to it would fail the very
    gate this task exists to satisfy. The exposure that creates - a report sitting in the
    working tree while the reading rule is frozen against it - is closed by binding this
    report's sha256 and its verdict as named fields in the TASK-20260801-024 snapshot
    receipt.
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 5400
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
  - >-
    ADMISSIBLE or INADMISSIBLE recorded with concrete defects if any; an explicit
    structural verdict that the calibration package contains no real-arm data; an explicit
    verdict that the driver carries an unexecuted real-arm entry point; an independently
    recomputed driver sha256 matching both the manifest and the TASK-20260801-022 receipt;
    independently recomputed CAL-1 order statistics, CAL-2 detection rates and the
    CERT-EQD-1 predicate, each reported with a concrete number; any CAL-STOP-1 degeneracy
    named with its measured reason; and no threshold frozen and no disposition stated.
