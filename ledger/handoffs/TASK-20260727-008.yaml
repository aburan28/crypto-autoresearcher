handoff:
  id: "TASK-20260727-008"
  from: "coordinator"
  to: "executor"
  goal_id: "GOAL-CRYPTO-001"
  authorized_by: "DEC-20260727-002"
  objective: >-
    Execute the frozen EXP-SCR-003 protocol exactly as specified and produce the immutable
    run records and execution report it requires. Experiment title: KN-OPEN-005 GGM-simulability screen: deterministic dedup audit against closed
    representation classes with the frozen NS-TX-PRIME-001 non-simulable transcript
    criterion.
  uncertainty_reduced: >-
    Apply the frozen screen (dedup classes plus criterion NS-TX-PRIME-001, predicates
    N1-N5 below) mechanically to the 8 frozen family items, producing a complete
    deduplicated family table with separate simulator-separation and relation-usefulness
    verdicts. Decide: zero admitted families (success; scoped absence supported) versus
    at least one family distinct from every closed class passing N1-N5 (fals
  inputs:
    - "experiments/EXP-SCR-003/specification.yaml (status approved, frozen: true; do not change)"
    - "ledger/hypotheses/H-SCR-003.yaml (status approved; do not change)"
    - "ledger/proposals/IDEA-20260723-005.yaml (context; do not change)"
    - "AGENTS.md, docs/task-lifecycle.md, docs/evidence-and-reproducibility.md, docs/claims-and-verification.md"
  constraints:
    - "The protocol is frozen. Any change requires a versioned protocol_amendment under experiments/EXP-SCR-003/amendments/ approved by the Coordinator; runs already executed are never re-scored against an amended criterion."
    - "Every run needs a manifest with exact command, git commit and dirty state, environment, seeds, stdout, stderr, raw results, validity status, timestamps, and resource measurements."
    - "claim_tier is toy: no conclusion above that tier; infrastructure failure is never evidence against the hypothesis (AGENTS.md rule 5)."
    - "Stopping and invalidation rules of the specification are binding; a timeout, crash, or implementation failure is reported as such, never as a result."
  deliverables:
    - "All artifacts enumerated in experiments/EXP-SCR-003/specification.yaml required_artifacts (per-run manifest.yaml, command.txt, environment.json, raw.json, summary.json, stdout.txt, stderr.txt)"
    - "experiments/EXP-SCR-003/execution-report.yaml"
  artifact_paths:
    - "experiments/EXP-SCR-003/specification.yaml"
    - "experiments/EXP-SCR-003/runs/"
    - "experiments/EXP-SCR-003/execution-report.yaml"
  write_scope:
    - "experiments/EXP-SCR-003/"
  archived_by: "TASK-20260727-902"
  inference:
    policy: "executor-implementation"
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 3600
    memory_gb: 4
    maximum_runs: 3
  completion_gate:
    - "Exactly 3 planned runs reach a terminal status (completed_valid, completed_invalid, failed_infrastructure, failed_implementation, resource_exhaustion, cancelled_by_budget)."
    - "Every required artifact in the frozen specification exists and is schema-valid."
    - "Validation checks pass: expected run count, no duplicated or missing seeds, raw/summary agreement, control comparability, no unrecorded protocol deviation."
    - "No claim above claim_tier toy; no status of any ledger record changed by the Executor."
  return_format: "Immutable run records per required_artifacts plus execution-report.yaml."
