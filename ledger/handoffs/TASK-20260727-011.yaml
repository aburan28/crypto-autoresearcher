handoff:
  id: "TASK-20260727-011"
  from: "coordinator"
  to: "executor"
  goal_id: "null"
  authorized_by: "DEC-20260727-002"
  objective: >-
    Execute the frozen EXP-PMA-001 protocol exactly as specified and produce the immutable
    run records and execution report it requires. Experiment title: Toy validation of the divisor-parity obstruction predicate for ordinary PMA4
    reciprocal-minor tables over k(t), char k != 2, against independent brute-force
    matrix existence.
  uncertainty_reduced: >-
    Implement the divisor-parity obstruction predicate of IDEA-20260726-012 over k(t)
    for small finite k (F_q, q in {3, 5, 7}) and k = Q, and validate it against
    exhaustive direct solving on small prescribed instances: for each prescribed
    reciprocal-minor table p_emptyset = 1, p_S = (t+1)/(t+d_S), decide ordinary 4x4
    matrix existence by an independent constructive solver (with witness matrices
    reverif
  inputs:
    - "experiments/EXP-PMA-001/specification.yaml (status approved, frozen: true; do not change)"
    - "ledger/hypotheses/H-PMA-001.yaml (status approved; do not change)"
    - "ledger/proposals/IDEA-20260726-012.yaml (context; do not change)"
    - "AGENTS.md, docs/task-lifecycle.md, docs/evidence-and-reproducibility.md, docs/claims-and-verification.md"
  constraints:
    - "The protocol is frozen. Any change requires a versioned protocol_amendment under experiments/EXP-PMA-001/amendments/ approved by the Coordinator; runs already executed are never re-scored against an amended criterion."
    - "Every run needs a manifest with exact command, git commit and dirty state, environment, seeds, stdout, stderr, raw results, validity status, timestamps, and resource measurements."
    - "claim_tier is toy: no conclusion above that tier; infrastructure failure is never evidence against the hypothesis (AGENTS.md rule 5)."
    - "Stopping and invalidation rules of the specification are binding; a timeout, crash, or implementation failure is reported as such, never as a result."
  deliverables:
    - "All artifacts enumerated in experiments/EXP-PMA-001/specification.yaml required_artifacts (per-run manifest.yaml, command.txt, environment.json, raw.json, summary.json, stdout.txt, stderr.txt)"
    - "experiments/EXP-PMA-001/execution-report.yaml"
  artifact_paths:
    - "experiments/EXP-PMA-001/specification.yaml"
    - "experiments/EXP-PMA-001/runs/"
    - "experiments/EXP-PMA-001/execution-report.yaml"
  write_scope:
    - "experiments/EXP-PMA-001/"
  archived_by: "TASK-20260727-903"
  inference:
    policy: "executor-implementation"
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 6300
    memory_gb: 4
    maximum_runs: 4
  completion_gate:
    - "Exactly 4 planned runs reach a terminal status (completed_valid, completed_invalid, failed_infrastructure, failed_implementation, resource_exhaustion, cancelled_by_budget)."
    - "Every required artifact in the frozen specification exists and is schema-valid."
    - "Validation checks pass: expected run count, no duplicated or missing seeds, raw/summary agreement, control comparability, no unrecorded protocol deviation."
    - "No claim above claim_tier toy; no status of any ledger record changed by the Executor."
  return_format: "Immutable run records per required_artifacts plus execution-report.yaml."
