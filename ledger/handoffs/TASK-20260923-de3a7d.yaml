    - id: ST-4
      text: >-
        THE RE-SOLVE WRAPPER (SE-2 with SF-1, SF-2, SF-3; SC-11). For EVERY
        call of v2_driver.solve with gb_only false, in every package of both
        r2 plans, by code and never by hand: attempt 1 is the frozen solve()
        unchanged; if an attempt has the SSF signature (SF-1 clauses
        (i)-(v); clause (v) reads the log text as solve() builds it,
        v2_driver.py lines 170-175) and fewer than K + 1 = 6 attempts have
        been made and the SF-2 (c) cap allows, the layer records the attempt
        (SE-2 (2)(a) fields plus start and end UTC with microseconds), renames
        its .ms.out, .ms.log and .ms.err by appending ".ssf-attempt<k>"
        (SC-11 (a)), waits at least 2.0 s from the recorded end (SC-11 (d)),
        and calls the frozen solve() again with identical arguments. The
        RECORDED result is the last attempt's. CONSISTENCY (SE-2 (4), SF-2
        (b)): every attempt's input sha256 equals attempt 1's, every printed
        quotient dimension agrees, and every attempt starts at least 2 s after
        the previous recorded end; a violation writes the attempt records and
        raises, and the package ends failed as implementation_error.
        CAP (SF-2 (c); SC-11 (c), (e)): attempt 2 always starts on an SSF
        attempt 1; attempt k + 1 (k >= 2) starts only if the summed wall
        seconds of attempts 2..k are below that call's timeout_s; otherwise
        the recorded result is attempt k's and solver-events.json records
        resolve_cap_reached. NEVER (SE-2 (6)): any other outcome class,
        gb_only solves, the callgrind child, package re-runs, discretion, or
        any changed flag, input or cap. RECORDING (SE-2 (5); SC-11 (b)):
        run-root solver-events.json, rewritten atomically after each event,
        and the manifest block `solver_events`; raw-result.json is written by
        the frozen driver from the recorded result only.
