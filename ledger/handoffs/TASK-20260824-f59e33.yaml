  constraints:
    - Create a new full standalone specification under TASK-20260824-f59e33; never overwrite or require an overlay with T33.
    - Bind T33, T34, T35, T36, and DEC-20260824-19b5fb as immutable provenance.
    - Preserve the T33 schemas, schema IDs, defs, all 63 local ref occurrences and targets, constraints, all fixtures, R1-R6, controls, budgets, and artifact namespaces exactly.
    - Do not change a schema, fixture, scientific value, control, resource value, or artifact path to ease mapping.
    - Add one exhaustive manual_satisfiability_mapping section inventorying every positive fixture and applicable constraint.
    - >-
      Give one deterministic row per applicable constraint at every positive
      instance location. Each row contains row_id, schema_id,
      positive_fixture_id, schema_path, keyword, positive_instance_path,
      subject, property_or_item_detail, concrete_value_or_value_summary,
      chosen_oneOf_branch, referenced_schema_path, and satisfaction_reason.
    - >-
      The row key contains at least schema_id, schema_path, keyword, and
      positive_instance_path, plus fixture ID and subject/property detail when
      needed to disambiguate. Duplicate keys are forbidden.
    - >-
      Sort rows lexicographically by schema_id, positive_fixture_id,
      schema_path, keyword, positive_instance_path, and subject, then assign
      sequential row IDs.
    - Map every root and nested required property membership individually; never aggregate several required properties in one row.
    - >-
      Map every root and nested object type and additionalProperties rule. For
      additionalProperties false, enumerate actual instance properties and why
      each is declared by properties or patternProperties.
    - >-
      Map every applicable scalar type, const, enum, pattern, minimum, maximum,
      exclusiveMinimum, exclusiveMaximum, multipleOf, minLength, and maxLength
      constraint with the concrete scalar or exact value summary.
    - >-
      Map every applicable array type, minItems, maxItems, uniqueItems, and
      items constraint. Expand items to every element path or provide an exact
      deterministic range expansion reconciled to every element path.
    - >-
      Map every local ref occurrence and resolved defs target. Preserve exactly
      the 63 frozen occurrence bindings and additionally map constraints reached
      through each applicable reference.
    - >-
      For each oneOf, record the chosen branch by exact schema path, why it
      holds, and one exact failing constraint for every nonchosen branch.
    - >-
      Completely map both identity and published character-basis descriptor
      fixtures through the unified R3/R6 descriptor.
    - >-
      Include a deterministic constraint inventory with one entry per
      applicable constraint application and reconcile it against mapping rows.
      Record expected, actual, missing, duplicate-key, and extraneous counts.
    - >-
      Completion requires missing, duplicate-key, and extraneous counts all
      zero. Never fabricate zero; return REVISE_REQUIRED on unresolved coverage.
    - Preserve exactly four Draft 2020-12 schemas, all 63 refs, full positive and exact negative fixtures, and both descriptor fixtures.
    - Preserve y_bar=Y/2 and y_bar=m_line*x+c_line throughout the exact line identity.
    - Preserve per_run_output_bytes 268435456, aggregate_output_bytes 27380416512, and 102*268435456=27380416512.
    - Preserve 102 run identities, six files each, 612 paths, and zero retry, replacement, or additional identities.
    - Preserve R1-R6 and both proves-too-much controls exactly.
    - Set scientific_disposition to complete_manual_satisfiability_mapping_independent_review_required.
    - Set executable false and approval_conferred false.
    - Run zero schemas, fixtures, code, experiments, campaign inputs, searches, replays, controls, benchmarks, or proof searches.
    - Confer no approval and claim no curve, rank, certificate, novelty, or goal completion.
    - budget.maximum_runs is one Idea Generator invocation and no research execution.
