handoff:
  id: TASK-20260801-020
  from: coordinator
  to: coordinator
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-023
  objective: >-
    Commit the exact TASK-20260801-019 contract and DEC-20260801-007 alone, with this
    receipt, so that THR-EQD-1, CERT-EQD-1, CAL-STOP-1, ATS-1, the statistic family, the
    resolution ladder, the binning rule, the plant construction and the delta ladder are
    HASH-BOUND BEFORE ANY CALIBRATION DATUM EXISTS. Record CALIBRATION_AUTHORIZATION for
    the NON-EVIDENTIAL calibration run RUN-EQD-001-calib in the receipt.
  uncertainty_reduced: >-
    Whether the frozen threshold rule provably predates the calibration it will be applied
    to, which is ATS-1 clause 1 and the only thing that makes calibrating on a null a
    substitution rather than a tuning channel.
  inputs:
  - TASK-20260801-019 artifacts
  constraints:
  - RUN ALONE. Stage exactly the paths in declared_commit_sets.TASK-20260801-020_snapshot - three paths.
  - >-
    Do not stage ledger/goals/GOAL-ECDLP-001.yaml or ledger/hypotheses/H-EQD-001.yaml -
    both are owned for archival purposes only by TASK-20260801-031.
  - >-
    Do not stage dispatch_queue.json, BATCH-023-OPENING.md, the handoff records, FAEST,
    XEDN, KN-FIND records, or any EXP-DS-001, EXP-SMTH-001 or BATCH-022 artifact.
  - >-
    The receipt must contain CALIBRATION_AUTHORIZATION with the literal value AUTHORIZED
    or NOT AUTHORIZED, and must state in the same breath that it authorizes ONLY the
    non-evidential calibration run on NULL AND PLANTED OBJECTS and authorizes NOTHING
    about the real arm.
  - >-
    AUTHORIZED only if the committed contract contains THR-EQD-1, CERT-EQD-1, CAL-STOP-1
    and ATS-1 in full and the committed tree contains NO run artifact of any kind for this
    experiment.
  - >-
    Commit message must contain TASK-20260801-020, TASK-20260801-019, EXP-EQD-001,
    H-EQD-001, DEC-20260801-007, GOAL-ECDLP-001, BATCH-023.
  - Do not push from this task.
  - State no interpretation in the receipt.
  - Do not start the Executor in this task.
  deliverables:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/archives/TASK-20260801-020/snapshot_commit_receipt.json
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/archives/TASK-20260801-020/snapshot_commit_receipt.json
  archived_by: TASK-20260801-020
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 900
    memory_gb: 1
    maximum_runs: 1
  completion_gate:
  - >-
    Post-commit verifier accepts - exact declared paths, expected parent, recorded hashes,
    reachable from HEAD; CALIBRATION_AUTHORIZATION recorded with its literal value and
    with an explicit statement that the real arm is not authorized by it.
