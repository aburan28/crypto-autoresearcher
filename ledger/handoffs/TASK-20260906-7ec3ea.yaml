        single-walk trials from uniform starts) / (trials whose terminal DP
        is in the table) / sqrt(N/T), the table being the top-T by
        S_d + 4 W h_d of a pool of 2T DISTINCT DPs generated by uniform-
        start walks with every walk charged to P and credited to its DP;
        re-derived on the validator's own instrument at N = 2^24 (T = 256,
        W = 128) and N = 2^20 (T = 64, W = 64), M = 40000 per key, >= 5
        keys, with the scaled precomputation P / sqrt(NT).
      parameters: >-
