    and the exact bound paths -- it names paths, not values)
  - >-
    AFTER SEALING J2 ONLY: experiments/EXP-ECDLP-612fb1/source,
    experiments/EXP-ECDLP-612fb1/runs, experiments/EXP-ECDLP-869870/source,
    experiments/EXP-ECDLP-869870/runs, and the two executor task
    directories coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-289698/tasks/TASK-20260906-3623b9
    and .../TASK-20260906-d17254 (execution_report.yaml,
    artifact_inventory.json)
  - >-
    Primary sources, fetched by you if needed and recorded with URL and
    retrieval date: Bernstein-Lange, "Computing small discrete logarithms
    faster", IACR eprint 2012/458 (cr.yp.to/dlog/cuberoot-20120919.pdf);
    the fixture's published values (1.79 after 1.24 at alpha = 1/2, N = 2T;
    Table 4.1) are binding as written in the contracts and are not
    re-derived from memory.
  constraints:
  - >-
    INDEPENDENT FRESH SESSION (independent_session_required true). You
    authored none of this batch's deliverables and did not run either
    executor task. This supplies SESSION independence; record honestly in
    your report whether it also supplies MODEL independence (state the
    resolved model identifier that answered and whether it equals the
    executor's).
  - >-
    ORDER IS BINDING: J2 before J1. Do not open, list contents of, or grep
    any blind_from path before blind_rederivation_sealed.json is written
    and its sha256 recorded. A directory listing (names and sizes only) of
    the executor task directories and the experiment directories is
    permitted before sealing and must be declared; reading any file body
    under blind_from before the seal voids J2 and must be reported as a
    procedure deviation, never hidden.
  - >-
    BLIND RE-DERIVATION SCOPE (J2): the contracts pin the walk only up to
    its class ("mix64(x XOR K) mod N with a fixed 64-bit mixer, e.g. the
    splitmix64 finaliser; DP predicate hash64(x) < floor(2^64 / W) with an
    independent key"); your instrument is your own implementation of that
    class with your own keys. Agreement with the executor is therefore
    expected at the level of the seed-to-seed spread (the executor's 5
    seeds versus your >= 5 keys; report both spreads and the two-sample
    comparison), NOT as a per-seed bit-identical value. A per-seed
    identical match would itself be a finding to explain, since it can only
    arise from a shared implementation. Compare also to the model
    C_max(1/4) = 0.39 (a MODEL number; the ratio band [0.85, 1.05] is gate
    G1's) and, for the fixture, to the published 1.79 within the contracts'
    tolerances (0.18 for 612fb1 G2; 0.10 for 869870's fixture gate).
  - >-
    BLIND RE-DERIVATION DEFINITIONS (from the statements, not the code):
    basin of DP d = the set of x whose forward orbit reaches d before any
    other DP within the cap 8W; the global oracle top-T share = (sum of the
    T largest basin sizes over ALL DPs, including in-degree-0 DPs whose
    basin is {d} itself) / N; cycle mass (points on DP-free cycles) and
    capped mass (orbits exceeding 8W without a DP) are excluded from every
    basin and reported. Fixture: pool of r T = 2T DISTINCT DPs generated by
    uniform-start walks capped at 8W, generation continuing until 2T
    distinct DPs are found with every walk charged to P and each walk's
    (length, +1) credited to its DP; weight S_d + 4 W h_d; table = top-T by
    weight (ties by a seeded permutation); M single-walk trials from
    uniform starts, cap 8W; scaled cost = (total walk steps over trials) /
    (number of trials whose terminal DP is in the table) / sqrt(N/T);
    scaled precomputation = P / sqrt(N T). The paper's own parameters
    (T = 64, W = 2^20, alpha = 1/2, N = 2T, i.e. l = 2^48) define the
    quantity; a reduced-M run at l = 2^48 is OPTIONAL and reported N/A with
    reason if it does not fit the budget.
  - >-
    J1 CHECKS, each ruled PASS / FAIL / N-A with evidence: (i) every
    executed run has a schema-complete manifest (exact command, git commit
    and dirty-tree state, environment and dependency versions, inputs, ALL
    seeds per the seed_policy offsets, requested policy, resolved model,
    fallback flag, wall clock, peak_rss_bytes), raw-result.json,
    summary.json, stdout and stderr; raw and summary agree on every number
    you spot-check (at least: every gate value, every S1-S6 / V1-V5 input,
    the NULL-A gains, and one full arm-round table per N); (ii) expected
    run count against each contract's stage_plan and the executor's stated
    first-batch scope, with cells not run listed as NOT YET RUN and never
    inferred; (iii) seeds: no duplicated or missing seed, every arm at the
    same s sharing walk key, pool and target sequence (compare pool
    identity hashes and the round-0 table hashes across arms); (iv) gate
    order: G1 at 2^20 reported before any Stage 1 interpretation; G2 at
    each N in {2^24, 2^30} reported before that N's arms; the 869870
    fixture gate at 2^24 reported before any 2^24/2^30 rule arm; (v) NULL
    IMPLEMENTATIONS, BY READING THE CODE: NULL-A must credit every batch
    evidence increment to a uniformly random EXISTING pool entry drawn from
    the 300 + s stream and admit new DPs with true log and ZERO evidence;
    NULL-B must run the pool bookkeeping and never re-select (its table
    equal to STATIC bit-for-bit -- verify from the table composition
    hashes); PHI(0) must equal STATIC bit-for-bit; the 869870 relabelling
    null must permute the ranking statistic among the generated DPs before
    selection; one code path for all arms with arm selection by
    configuration (grep for any arm-specific branch that touches the walk
    or the DP predicate: that is a leak); (vi) the LOWER bracket admits
    exactly the walks actually run by targets that were solved (the hitting
    walk plus that target's earlier missed walks that reached a DP; capped
    walks contribute nothing) and never a walk of an unsolved target;
    (vii) COUNTED-OPERATION ACCOUNTING identical across arms: one group
    operation per walk step; restart scalar multiplications (1.5 ceil(log2
    N) each) counted separately and identically; P = sum of generation walk
    lengths with capped walks at the cap; bits per entry frozen at 2
    ceil(log2 N) for every arm; S_peak = max pool entries x (2 ceil(log2 N)
    + 48) bits; re-selection integer operations counted; MEASURED and
    MODELED never in one column; (viii) CERTIFICATES on any curve-arm run
    that executed: re-verify every discrete_log certificate yourself with
    your own scalar multiplication [k]P == Q on the recorded curve
    (p, a, b, N, P) and check pass count equals solved / hit count exactly;
    also re-verify the curve record's point count; if no curve arm ran,
    rule N-A with the executor's NOT YET RUN statement quoted; (ix) every
    exact coverage at N <= 2^24 is <= the exact global top-T_sel share
    (re-add the basin sizes from raw-result.json yourself for at least one
    cell per N); (x) resource reconciliation: peak_rss_bytes against the
    8 GB ceiling and the analytic array sizes; wall clock under 3600 s per
    run, and any failed_infrastructure run recorded as such and never
    scored.
  - >-
    BLIND to coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-289698/tasks/TASK-20260906-90e7cf
    (the red-team directory): never list, open or read it; no report of J3
    or J4 exists to you. Report only on J1 and J2; a whole-claim verdict
    from you is an opinion formed from a fraction of the evidence and is
    not requested.
  - >-
    NO REPAIR AUTHORITY: a check failure is reported as FAIL with the
    defect located (path, line, number), never fixed, never re-run for the
    executor. Finding no defect is not a certification that none exists.
  - >-
    COMPUTE: budget maximum_runs 0 means zero EXPERIMENT runs under either
    contract; you may execute your own read-only re-derivation and
    re-verification code inside your task directory (scripts, sealed
    outputs and logs under src/ and logs/ there, exact commands recorded),
    within 3600 s wall clock and 4 GB. You write nothing outside
    coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-289698/tasks/TASK-20260906-7ec3ea
    and make no commit; you change no record anywhere.
  - >-
    INFERENCE PROVENANCE in the report: requested_policy review-adversarial;
    requested reasoning_effort xhigh (a floor, never lowered); backend;
    resolved model identifier exactly as answered; model_verified;
    fallback_used with reason if the resolved binding differs from the
    policy's primary (fallback is RECORDED, never silent; degraded_allowed
    false); independent_session true.
  - >-
    NETWORK: permitted only to fetch the Bernstein-Lange and
    Corrigan-Gibbs-Kogan primary texts, with URL and retrieval date
    recorded; nothing else.
  deliverables:
  - >-
    coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-289698/tasks/TASK-20260906-7ec3ea/validation_report.yaml
    -- strict YAML with: per-joint verdicts J1 and J2 in {HOLDS,
    HOLDS_WITH_FINDINGS, BROKEN} with findings (each finding: id, joint,
    severity load_bearing | not_load_bearing, evidence path and number,
    concrete repair action); the J1 check table (i)-(x) PASS/FAIL/N-A with
    evidence; the J2 sealed values beside the executor's numbers and the
    model / published values with the two-sample comparison; inference
    provenance; and the `review_attestation` block of
    templates/research-records.md with task_id TASK-20260906-7ec3ea,
    joints_owned exactly [J1, J2], sources_read = every path read BEFORE
    the seal (this is the list tools/check_review_independence.py tests
    against blind_from), sources_read_after_seal = every path read after
    the seal, honestly and completely, seal_sha256 and seal_utc,
    read_sibling_reports false, blind_from_respected true only if no
    blind_from file body was read before the seal, and verdict in {holds,
    breaks, inconclusive} for the joints owned (holds if J1 and J2 are
    HOLDS or HOLDS_WITH_FINDINGS; breaks if either is BROKEN; inconclusive
    only if a run set is too incomplete to rule).
  - >-
    coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-289698/tasks/TASK-20260906-7ec3ea/blind_rederivation_sealed.json
    -- the sealed J2 values with parameters, keys, code path (under src/),
    resample counts and UTC timestamp, written before any blind_from path
    is opened.
  - >-
    src/ and logs/ under the task directory: the re-derivation and
    re-verification code and their exact commands, stdout/stderr and
    resource measurements.
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-289698/tasks/TASK-20260906-7ec3ea/validation_report.yaml
  - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-289698/tasks/TASK-20260906-7ec3ea/blind_rederivation_sealed.json
  archived_by: TASK-20260906-aa3dd2
  write_scope:
  - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-289698/tasks/TASK-20260906-7ec3ea
  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 3600
    memory_gb: 4
    maximum_runs: 0
    maximum_runs_note: >-
      Zero EXPERIMENT runs under either contract. The validator's own
      read-only re-derivation and certificate re-verification code executes
      inside its task directory within the wall-clock and memory ceilings
      above; that is review work, not an experiment run, and it is recorded
      with exact commands in logs/.
  completion_gate:
  - "validation_report.yaml and blind_rederivation_sealed.json exist inside write_scope and parse as strict YAML / JSON."
  - "J2 sealed BEFORE any blind_from file body was read, with seal_sha256 and seal_utc in the attestation and the pre-seal / post-seal source lists complete."
  - "Every J1 check (i)-(x) ruled PASS / FAIL / N-A with evidence; every certificate on any executed curve-arm run re-verified independently; per-joint verdicts stated with findings and repair actions."
  - "review_attestation present with joints_owned exactly [J1, J2], read_sibling_reports false, verdict in {holds, breaks, inconclusive}; no path under the red-team directory read; nothing written outside the task directory; no commit."
  return_format: null
  review_plan:
    plan_note: >-
      Written by the Coordinator BEFORE any executor run exists and before
      either reviewer runs (AGENTS.md "Review architecture"). This block is
      byte-identical on ledger/handoffs/TASK-20260906-7ec3ea.yaml and
      ledger/handoffs/TASK-20260906-90e7cf.yaml; each reviewer card's
      review_plan_path points at its own handoff. Joints are named J1-J4
      and a reviewer's attestation lists them in joints_owned by those
      exact labels. The ledger archive TASK-20260906-aa3dd2 runs
      `python3 tools/check_review_independence.py --batch
      coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-289698 --plan
      ledger/handoffs/TASK-20260906-7ec3ea.yaml` before composing (the
      plan lives on the ledger handoffs, outside the batch directory, so
      --plan is passed explicitly).
    claim_under_review: >-
      Two producer claims, as the frozen contracts will state them once the
      executors report. EXP-ECDLP-612fb1 (H-ECDLP-37dc01, executor
      TASK-20260906-3623b9): "at a = 1/4, r = 2, k = 4 on the generic
      keyed-random-function instrument at both N = 2^24 and N = 2^30, with
      gate G1 reported at 2^20 and gate G2 passed at each N, the
      LOWER-bracket re-selected table of T/2 entries reaches the static T
      table's steady-state per-target success within the 95% CI by U = 8T
      (S1), with NULL-A's gain within CI of zero at every round and NULL-B
      and PHI(0) bit-identical to STATIC (S2), the phi decay non-decreasing
      with gain(0) = 0 and gain(1) - gain(0.1) CI-separated above zero
      (S3), and no re-selected table's hit rate exceeding the exact oracle
      top-T_sel share at N <= 2^24 nor 0.42 at 2^30 (S4)"; and for the
      mechanism clause S5 (gain strictly decreasing over r in {2, 4, 8},
      gain(8) <= 0.03) and S6 (UPPER minus LOWER below 0.05).
      EXP-ECDLP-869870 (H-ECDLP-3550b8, executor TASK-20260906-d17254): "the
      basin law (survival slope, cutoff), the unselected law (B1), the
      oracle ceiling (B2) and the published-rule constants measured at N in
      {2^20, 2^22, 2^24, 2^30} match the pre-registered closed forms within
      the stated bands (M1-M5) and are N-independent after the O(theta)
      trend (V5); the relabelling null equals the unselected control and
      the sigma decay is monotone (V2); no exact coverage exceeds the
      global oracle share and every sampled coverage is inside its Wilson
      interval (V3); and the Bernstein-Lange 1.79 case-study / Table 4.1
      seven-cell fixture reproduces within 0.10 in scaled cost and 12% in
      scaled precomputation at N = 2^24 (V1)". The first execution batch
      covers Stage G and Stages 1-2 of 612fb1 and Stages 1-2 of 869870;
      the curve arms and 869870's 2^30 stage may be reported NOT YET RUN,
      in which case the claim under review is the generic-instrument prefix
      actually executed and every reviewer says so.
    coordinator_prior: >-
      Recorded before any run exists. The only prior data are the
      coordinator's own scratch simulator (internal, unverified, two seeds,
      no null, no decay, no certificate; cited in IDEA-20260906-ee3543 and
      H-ECDLP-37dc01 as never evidence): at N = 2^30, T = 1024, a = 1/4,
      r = 2, k = 4 it showed the T/2 re-selected table matching the static
      T table's per-target success from about round 4-5 of 2000 targets,
      i.e. about 8T targets (0.68-0.71 versus 0.68-0.73), the full-T
      re-selected table at 0.83-0.85 versus static 0.67-0.73, UPPER within
      0.01-0.02 of LOWER, and (IDEA-20260906-aed829) a top-T basin share of
      about 0.637 at N = 2^21, a = 1 against the model 0.66. From that
      record the Coordinator's prior is: S1-S4 pass at both 2^24 and 2^30
      with rho_T(8T) near the model 0.51 (inside [0.45, 0.65]) and the
      exact top-T share at 2^20, a = 1/4 inside G1's band around the model
      0.39 (roughly 0.33-0.41, theta = 1/64 being large); the 1.79 fixture
      reproduces within 0.10 at 2^24 under the 8W cap and the paper's
      distinct-DP procedure, with about 0.3 probability that at least one
      of 869870's seven cells -- most likely an N/T = 1 cell, where the
      paper itself notes the duplicate-discard bias -- misses 0.10 at 2^24
      by an O(theta) residual, which would be an instrument-comparability
      failure (invalid, not negative) needing an amendment rather than a
      finding about the mechanism; the most likely GENUINE failure is a
      bookkeeping one -- unequal charging of P or of bits per entry between
      arms, restart multiplications counted in one arm and not another, or
      the LOWER bracket admitting a walk of an unsolved target or a walk
      never run -- and the Coordinator expects J1 to be where a break, if
      any, appears. The Coordinator does NOT expect NULL-A to show a gain
      (it may sit slightly BELOW static, since uniformly relabelled evidence
      is noise added to the weights; only a gain above zero is the artifact
      signature), expects NULL-B and PHI(0) bit-identity to hold if one code
      path is used, expects J2's blind numbers to agree with the executor's
      at the seed-spread level and not per seed, expects J3 to find that
      the UNCAPPED pool's S_peak (of order U k p_s entries, about 20T after
      8T targets) is the weakest point of the "fewer stored DPs" framing so
      that CAP(2T)/CAP(4T) are the only frontier-honest cells, and expects
      the proves-too-much objects to behave (permutation walk: G1 fails and
      S3 fails; a = 1/2 differential holds; NULL-A at zero). A review that
      overturns any of these is the more informative result and is wanted.
    joints:
    - joint: J1
      statement: >-
        Run-receipt validity and control integrity of both packages:
        schema-complete manifests, expected run counts, seed and
        replication integrity, gates G1/G2 and the fixture gate reported
        before other arms, certificate re-verification on any curve arm,
        the null implementations actually destroying the signal (read the
        code: NULL-A relabels evidence among existing pool entries, NULL-B
        freezes the table, the 869870 relabelling null permutes the
        statistic), the LOWER bracket admitting exactly the run walks of
        solved targets, and counted-operation accounting identical across
        arms (P, bits per entry, S_peak, restart scalar multiplications,
        lookups, re-selection integer operations).
      assigned_to: TASK-20260906-7ec3ea
      attack_plan: >-
        Recompute rather than read: re-add basin sizes from raw-result.json
        for one cell per N and compare to the reported exact coverage and
        to the top-T_sel share; diff the round-0 table composition hashes
        of every re-selected arm against its STATIC twin and NULL-B / PHI(0)
        against STATIC at every round; grep the source for any branch on
        the arm name that reaches the walk, the DP predicate or the
        restart draw (a leak); count the walks admitted to the LOWER pool
        per solved target in raw-result.json and confirm none belongs to an
        unsolved target and none was never run; tabulate P, bits, S_peak
        and restart counts per arm from the raw records and confirm they
        are computed by one function; re-verify every certificate with
        your own scalar multiplication; reconcile seeds against the
        seed_policy offsets (100 + s, 200 + s, 300 + s, 400 + s; 500 + s on
        869870). The Coordinator thinks this breaks, if anywhere, in the
        LOWER-bracket admission rule and in the charging of restart
        multiplications and pool bits.
      breaking_artifact: >-
        A located defect (path, line, cell, number): a re-selected arm
        whose round 0 differs from its STATIC twin; a NULL-B or PHI(0)
        table hash differing from STATIC; a pool entry from an unsolved or
        un-run walk; an arm charged differently for P, bits, S_peak or
        restarts; a certificate that fails independent re-verification; a
        manifest missing a required field; a raw/summary disagreement; or
        an exact coverage above the exact top-T_sel share. Any one of
        these makes the affected run set INVALID (not negative) under the
        contracts' invalidation rules.
    - joint: J2
      statement: >-
        BLIND RE-DERIVATION of the two load-bearing quantities from their
        statements alone: (a) the exact global oracle top-T basin share at
        N = 2^20, a = 1/4 (T = 64, W = 64, cap 8W) by independent
        enumeration of the functional graph of a keyed random function of
        the contract's class; (b) the Bernstein-Lange scaled
        main-computation cost fixture (published 1.79 (l/T)^{1/2} at
        alpha = 1/2, N/T = 2, cap 8W; paper parameters T = 64, W = 2^20)
        by an independent simulation of the paper's procedure at the
        contract cells N = 2^24 (T = 256, W = 128) and N = 2^20, plus the
        scaled precomputation P / sqrt(NT) beside 1.24.
      assigned_to: TASK-20260906-7ec3ea
      attack_plan: >-
        Implement both from the definitions in this handoff with your own
        mixer, your own DP hash key and your own keys, seal the numbers,
        then compare to the executor's per-seed values as two samples from
        one law (report means, spreads, a two-sample statistic) and to the
        model 0.39 and the published 1.79 / 1.24. Vary what the contract
        leaves open (mixer choice, tie-breaking, how a capped walk is
        charged, whether in-degree-0 DPs are counted in the global oracle)
        and report the sensitivity of each quantity to each choice: the
        Coordinator thinks the fixture is sensitive to the distinct-DP
        procedure and the cap charging (a pool that discards duplicate
        walks without charging them reads low in P and low in cost), and
        the top-T share is sensitive to whether capped mass is excluded.
      breaking_artifact: >-
        A sealed value that disagrees with the executor's beyond the
        combined seed spread (the two implementations differ and one is
        wrong), or a sealed fixture outside the contract tolerance of the
        published 1.79 while the executor's is inside (or the reverse),
        with the sensitivity table localising the choice responsible.
    - joint: J3
      statement: >-
        Interpretation and cost model of the 612fb1 claim: whether "fewer
        stored DPs" is charged honestly on RQ-ECDLP-78dbc5's (P, S, L,
        epsilon, U) frontier including the pool's S_peak and the
        early-batch penalty; whether the LOWER bracket really excludes
