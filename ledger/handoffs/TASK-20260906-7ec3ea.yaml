  dispatch_queue: coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-289698/dispatch_queue.json
  task_card: coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-289698/tasks/TASK-20260906-7ec3ea/task_card.yaml
  role: validator
  from: coordinator
  to: validator
  review_required: false
  id_note: >-
    Identifier pre-minted and --check'ed by the orchestrating session and
    reserved in DEC-20260906-2b1387 and both approved contracts' approval
    notes; the coordinator minted nothing and grepped for nothing.
  objective: >-
    Own joints J1 and J2 of the review plan below, in a FRESH INDEPENDENT
    SESSION, on the snapshot-committed execution packages of
    EXP-ECDLP-612fb1 (TASK-20260906-3623b9) and EXP-ECDLP-869870
    (TASK-20260906-d17254). J2 FIRST AND BLIND: before opening any path in
    blind_rederivation.blind_from, re-derive from the statement of the
    quantities alone (a) the exact global top-T basin share at N = 2^20,
    a = 1/4 (T = 64, W = 64, theta = 1/64, cap 8W = 512) on your own
    keyed-random-function instrument by full enumeration of the functional
    graph, over at least 5 of your own walk keys, and (b) the
    Bernstein-Lange scaled main-computation cost fixture (published 1.79
    (l/T)^{1/2} at alpha = 1/2, N/T = 2, cap 8W) by an independent
    simulation of the paper's procedure on your own instrument at the
    contract's cells N = 2^24 (T = 256, W = 128) and N = 2^20 (T = 64,
    W = 64), M = 40000 single-walk trials per key; SEAL both results
    (write blind_rederivation_sealed.json with the values, the parameters,
    the code path and the UTC timestamp; record its sha256 in your
    attestation) and only THEN open the executor packages. J1: audit
    run-receipt validity and certificate re-verification, the gate order,
    the null implementations by reading the code, seed and replication
    integrity, and identical counted-operation accounting across arms.
    Report per joint HOLDS | HOLDS_WITH_FINDINGS | BROKEN with evidence; you
    verify receipts and controls, you do not rule on the hypotheses.
  uncertainty_reduced: >-
    Whether the two run sets are valid evidence at all (schema-complete,
    seed-intact, gate-ordered, certificate-verified, nulls implemented as
    declared, costs charged identically across arms), and whether the two
    load-bearing quantities -- the exact oracle top-T share the effect is
    scored against and the 1.79 fixture that gates comparability to the
    paper -- come out the same when derived by someone who never saw the
    producer's implementation.
  inputs:
  - >-
    experiments/EXP-ECDLP-612fb1/specification.yaml and
    experiments/EXP-ECDLP-869870/specification.yaml (the frozen approved
    contracts: definitions, instrument, controls, gates G1/G2 and the
    fixture gate, seed_policy, invalidation_rules, required_artifacts)
  - ledger/hypotheses/H-ECDLP-37dc01.yaml and ledger/hypotheses/H-ECDLP-3550b8.yaml (the specified hypotheses; the quantities' statements)
  - ledger/proposals/IDEA-20260906-ee3543.yaml and ledger/proposals/IDEA-20260906-aed829.yaml (the idea records; model numbers, cited as MODEL only)
  - "ledger/handoffs/TASK-20260906-3623b9.yaml and ledger/handoffs/TASK-20260906-d17254.yaml (the executor handoffs: declared implementation paths, deliverables, seed offsets)"
  - >-
    coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-289698/archives/TASK-20260906-7a2446/snapshot-receipt.json
