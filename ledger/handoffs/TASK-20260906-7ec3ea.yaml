    proves_too_much:
      objects:
      - >-
        (i) A random PERMUTATION walk on [0, 2^20) (keyed bijection; no
        trees, basins of size about W with no heavy tail) at T = 64,
        W = 64, cap 8W: the oracle top-T share must collapse to order
        (T W / N) log(N/W) -- a few percent instead of the tree-walk 0.39
        -- every table's success must sit near the RHO floor, G1 must FAIL
        (slope and top-T share / C_max far outside band), S3 must FAIL
        (there is no gain to decay), and re-selection must buy nothing
        beyond the seed spread.
      - >-
        (ii) The a = 1/2 differential cell at N = 2^24 (and 2^30): the T/2
        re-selected table CANNOT reach STATIC(T) there because STATIC(T)'s
        success exceeds the exact top-T/2 share (model: 0.42 versus
        C_max(1/4) = 0.39); the pipeline must show RESEL-L(T/2)
        CI-separated BELOW STATIC(T) at every U, with its hit rate at or
        below the exact top-T/2 share (F6 of the contract if inverted).
      - >-
        (iii) NULL-A relabelled evidence at T_sel in {T, T/2}: must
        reproduce STATIC(T_sel) within CI at every round (a value slightly
        below static is a degraded null, not an artifact); the S1-S4 logic
