      - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-289698/tasks/TASK-20260906-d17254
      assigned_to: TASK-20260906-7ec3ea
      seal_protocol: >-
        The same validator owns J1, which requires reading the producer's
