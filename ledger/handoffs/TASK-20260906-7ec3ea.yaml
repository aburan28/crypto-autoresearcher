    blind_rederivation:
      required: true
      quantity: >-
        (a) The exact global oracle top-T basin share at N = 2^20, a = 1/4:
        with T = 64, W = sqrt(a N / T) = 64, theta = 1/64, cap 8W = 512,
        for a keyed random function f on [0, N) of the contract's class and
        an independent-keyed DP predicate of density 1/W, the basin of DP d
        is the set of x whose forward orbit reaches d before any other DP
        within the cap; the share is (sum of the T largest basin sizes over
        ALL DPs, in-degree-0 DPs included) / N, with cycle mass and capped
        mass excluded and reported. (b) The Bernstein-Lange scaled
        main-computation cost of the published-weight table at
