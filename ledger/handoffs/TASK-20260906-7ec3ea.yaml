      failure_signature: >-
        On each object the argument must visibly FAIL where its conclusion
        is false: (i) collapsed oracle share, G1 failed, S3 failed, all
        arms at the floor, no gain; (ii) the differential CI-separated
        below zero and the hit rate under the exact top-T/2 share; (iii)
        NULL-A gain within CI of zero and S1-S4 not met on it. If the
        pipeline reports a gain, a pass of S1-S4, or a T/2-reaches-T
        result on any of these, it has proved too much and the criterion
        that passed is wrong somewhere not yet read closely enough.
