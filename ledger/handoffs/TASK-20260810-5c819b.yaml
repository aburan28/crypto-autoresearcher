handoff:
  id: TASK-20260810-5c819b
  recorded_at: '2026-08-10'
  goal_id: GOAL-MD5-001
  question_id: RQ-MDFIVE-6870c1
  batch_id: BATCH-46254b
  task_card: coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/task-cards/TASK-20260810-5c819b.md
  role: coordinator
  from: coordinator
  to: coordinator
  objective: >-
    Commit the exact implementation-pin and acquisition artifacts, alone, before
    either independent review reads them, including every KN-LIT and quarantine
    path that kn-lit-manifest.json enumerates.
  uncertainty_reduced: >-
    Whether the two reviewers judge fixed bytes. The acquisition package in
    particular is the batch's only corpus-changing product, and a corpus that
    moves under a reviewer cannot be reviewed at all.
  inputs:
    - TASK-20260810-3e0793 and its two declared artifacts
    - >-
      TASK-20260810-bde128 and its two declared artifacts, plus every path its
      kn-lit-manifest.json enumerates
  constraints:
    - >-
      SC-1 FABRICATE NOTHING. No invented timing, measurement, throughput,
      citation, review verdict, model identifier or commit SHA. A field that is
      not yet knowable stays null and is named as such.
    - >-
      SC-2 CLAIM CEILING. Assert nothing about MD5 - no collision, no preimage,
      no complexity, no method ceiling, no obstruction, and no comparison
      against any published result in either direction.
    - >-
      SC-3 UNVERIFIED FIGURES STAY MARKED. Every figure not obtained in primary
      text stays marked unverified and is never cited as authority in either
      direction.
    - >-
      SC-4 A failed, halted or exhausted search is a BUDGET OUTCOME about a
      solver and NEVER evidence about MD5 (AGENTS.md rules 5 and 8).
    - >-
      SC-5 Anything not attempted is named OPEN AND UNATTEMPTED and is never
      recorded as tried, screened or negative.
    - >-
      SC-6 Change no hypothesis, question, experiment or goal status; approve no
      experiment; promote no knowledge; edit no committed record; record no
      attestation and no review verdict.
    - >-
      SC-7 Halt at the declared wall_clock_seconds and report the halt
      truthfully as infrastructure signal, naming the dropped work as scope
      rather than as an answer.
    - >-
      SC-8 Never select, configure, probe, contact or use Amazon Bedrock
      (AGENTS.md rule 16).
    - >-
      Run alone. Stage exactly the four declared producer artifacts, every path
      enumerated in kn-lit-manifest.json, and this task's own receipt. Stage
      nothing else, and stage nothing the manifest does not name.
    - >-
      EXTEND archive.record_ids IN THE RECEIPT with the KN-LIT identifiers the
      manifest reports. They could not be declared in this queue because they had
      not been minted when it was written, and the queue does not invent
      identifiers it has not checked.
    - >-
      Verify before staging that the collision-path KN-LIT entry under
      knowledge/literature/ contains no path data and that the payload sits under
      quarantine/. If it does not, HALT AND REPORT rather than committing: this
      is the one defect that cannot be repaired after the fact, because a corpus
      cannot un-learn.
    - >-
      Fetch origin/main and MERGE it into the working branch before committing;
      never rebase. Record the base commit checked and the merge outcome.
    - >-
      Push the branch and refresh the PR naming BATCH-46254b, the two producer
      task IDs and the minted KN-LIT identifiers.
  deliverables:
    - >-
      snapshot-receipt.json recording the commit, parent, full staged path set
      including manifest-enumerated paths, hashes, and the extended record_ids
    - an explicit pass or halt statement on the quarantine check
  artifact_paths:
    - >-
      coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/archives/TASK-20260810-5c819b/snapshot-receipt.json
  archived_by: TASK-20260810-5c819b
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 160
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
    - >-
      The archive verifier accepts the parent, the declared and
      manifest-enumerated path set, hashes, reachability, and the record_ids in
      the commit message.
    - The receipt's record_ids include the minted KN-LIT identifiers.
    - >-
      The quarantine check is recorded as an explicit pass, or the task halted
      and reported rather than committing.
    - The branch is pushed and the PR names the KN-LIT identifiers.
    - >-
      No status changed and nothing outside the declared and manifest-enumerated
      set was committed.
  return_format: >-
    A summary naming the commit and parent as observed, the full staged path set
    including every manifest-enumerated path, the extended record_ids with the
    minted KN-LIT identifiers, the explicit quarantine-check pass or halt, the
    origin/main base commit checked and the merge outcome, and the PR reference.
  archive:
    kind: snapshot
    source_task_ids:
      - TASK-20260810-3e0793
      - TASK-20260810-bde128
    commit_sha: null
    parent_sha: null
    path_sha256: {}
    record_ids:
      - GOAL-MD5-001
      - RQ-MDFIVE-6870c1
      - BATCH-46254b
      - DEC-20260810-9942ea
      - TASK-20260810-3e0793
      - TASK-20260810-bde128
      - TASK-20260810-5c819b
    note: >-
      commit_sha, parent_sha and path_sha256 are null or empty BY FACT. The
      minted KN-LIT identifiers are deliberately absent from record_ids here
      because they do not yet exist; this task's receipt extends record_ids with
      them from the manifest it observes.
