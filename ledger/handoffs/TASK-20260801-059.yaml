handoff:
  id: TASK-20260801-059
  from: coordinator
  to: red-team
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-025
  objective: >-
    Try to falsify the interpretation, the scope and the alternative-class declaration of the
    RUN-LPF-001-measure package. THE SINGLE MOST IMPORTANT QUESTION YOU ARE ASKED - is the
    comparison this experiment actually made the ABSOLUTE comparison HEUR-DS-1 is about, or did it
    collapse into a two-sample comparison against uniform integers somewhere along the way.
  uncertainty_reduced: 'What the measurement does NOT establish, and whether any deliverable is about to overclaim in either direction.'
  inputs:
  - experiments/EXP-LPF-001/specification.yaml
  - experiments/EXP-LPF-001/reading_rule.yaml
  - experiments/EXP-LPF-001/implementation/lpf001_driver.py
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-measure/
  - experiments/EXP-LPF-001/results/measure/
  - experiments/EXP-LPF-001/results/calib/
  - ledger/hypotheses/H-LPF-001.yaml
  - ledger/evidence/EV-EQD-001.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/reviews/TASK-20260801-054/
  constraints:
  - 'INDEPENDENT SESSION. You did not author or execute any artifact under review.'
  - >-
    ATTACK ABS-REL-LPF-1 FIRST AND HARDEST. Did LIMB B actually get tested against a theoretical
    reference, or did the measured band absorb the thing the claim is about? Is the V1 cost of the
    measured band stated honestly and is it larger than declared? Is the uniform arm anywhere
    treated as the comparison?
  - >-
    AUDIT ALT-CLASS-LPF-1 ADVERSARIALLY AGAINST SOURCE AND MEASURED DATA. Name any class the
    deliverables are about to claim and the ladders did not reach, and any class in V1 through V7
    that turns out wider or narrower than declared.
  - >-
    AUDIT THE PERTURBATION LADDERS POST HOC. Was any rung certified whose movement table row is
    within noise? Did any certifying statistic fail to move on any object, and was its non-firing
    then used as evidence? That is the BATCH-024 defect class RTB-040-2 and RTB-040-3 and it must be
    hunted here.
  - >-
    READ THE RESULT IN BOTH DIRECTIONS. If the branch is L-2, attack the consistency reading - what
    does it license and what does it not, and is anyone about to call HEUR-DS-1 validated. If the
    branch is L-3, attack the departure reading equally hard - a departure is also a claim, `weaken`
    needs its counterexample certificate independently checked, the DIRECTION must be stated because
    smooth and rough have opposite consequences, and `reject_scoped` is forbidden.
  - 'ATTACK THE SCALE TRANSFER EXPLICITLY. State whether anything in the package implies transfer from toy D to cryptographic D, and quantify how far the toy D is from any parameter that matters.'
  - 'STATE THE NARROWEST SUPPORTED STATEMENT, dominated_by (NEVER null) and a QUANTITATIVE sota_delta.'
  - 'Name the next required control and rank it.'
  - 'Rule explicitly on whether the HEUR-DS-1 line was blurred anywhere, on whether anything is presented as a replication, and on whether OPEN-BATCH023-A is properly discharged or not by this package.'
  - 'Recommend a disposition. You do not set status.'
  - 'MAKE NO COMMIT; TASK-20260801-060 archives this report.'
  - 'Record inference honestly (requested review-adversarial, independent session).'
  deliverables:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/reviews/TASK-20260801-059/red_team_report.yaml
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/reviews/TASK-20260801-059/red_team_report.yaml
  archived_by: TASK-20260801-060
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 7200
    memory_gb: 8
    maximum_runs: 1
  completion_gate:
  - 'Blocking constraints listed; an adversarial verdict on ABS-REL-LPF-1 and on ALT-CLASS-LPF-1 against source and data.'
  - 'A post-hoc audit of the perturbation ladders naming any rung certified without movement.'
  - 'The result attacked in whichever direction it points; the scale-transfer question answered quantitatively.'
  - 'The narrowest supported statement, non-null dominated_by and a quantitative sota_delta; the next required control named and ranked.'
  - 'Explicit verdicts on the HEUR-DS-1 line, the replication question and the OPEN-BATCH023-A discharge; a recommended disposition.'
