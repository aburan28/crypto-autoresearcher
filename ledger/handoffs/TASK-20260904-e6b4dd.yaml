  constraints:
    - >-
      START CONDITION: all ten reports exist at their declared paths and
      are committed (a report that exists only in a working tree is not a
      review), and each of the following passes with no problems:
      python3 tools/check_review_independence.py --plan
      ledger/handoffs/TASK-20260904-2bb29d.yaml --reports
      coordination/reviews/pfdr-battery-20260904/reviews/TASK-20260904-2bb29d
      coordination/reviews/pfdr-battery-20260904/reviews/TASK-20260904-6681da;
      the same for the pairs (4c0d7d, 8c5f97), (642cf5, ed0e8f), (a7eead,
      0d66e3), (42b33a, 3a2ff5) with the first handoff of each pair as the
      plan. A failing check is a procedure event: record it in the plan's
      procedure_deviations by a superseding note under the composition
      directory (never by editing the handoff) and either obtain a
      corrected report or compose with the affected joint marked unowned
      and the strength capped at preliminary for that experiment.
    - >-
      Compose, do not vote: a blinded reviewer reports on its joints; the
      whole-claim verdict is yours, built joint by joint, and every
      decision's rationale names the joint verdicts it rests on. Where two
      reviewers' joints disagree on a shared fact, the disagreement is
      inconclusive until localised, never averaged.
    - >-
      Compare every outcome with the coordinator_prior recorded in the
      review_plan and say explicitly, per experiment, whether the prior was
      confirmed, refined or overturned; an overturned prior is reported as
      such in review-analysis.md and in the decision's rationale.
    - >-
      Validity before interpretation: an invalid or incomplete run set
      (missing run, schema gap, seed mismatch, raw/summary disagreement,
      certificate failure, blind re-derivation disagreement not localised)
      goes back to the Executor with the defects listed and yields no
      evidence record; a timeout, crash or absent Sage is infrastructure
      signal and never a negative mathematical result (EXP-PFDR-4bfc6f).
    - >-
      Adverse transitions (weaken, reject_scoped, hypothesis to rejected)
      require the strongest checkable refutation artifact the result
      admits, archived BEFORE the decision that relies on it and cited in
      proof_refs with proof_status in {certificate, derivation,
      empirical_only}: for HEUR-002 of H-PFDR-c88f14 use the red team's
      derivation note from joint R3 of TASK-20260904-3a2ff5 if it
      establishes d_lf = d_ff = 4 + floor(s/2), otherwise declare
      empirical_only; for the m >= 3 cells of H-PFDR-06fd60 use the
      generator-degree derivation note from joint R1 of
      TASK-20260904-6681da (a counterexample certificate: rows(D_0) = 0) if
      it stands. reject_scoped on a single unreplicated empirical-only run
      is forbidden; use weaken plus replication.
    - >-
      Never change a success criterion after the fact: the literal
      failures of frozen criteria (fd901a criterion (2): first fall 66/130
      against frozen 65/129; 20ee58 calibration 32 against frozen 31 under
      the contract's cumulative formula; 5726af P3 nonzero fall_dim at the
      boundary cells; cbdefb's joint rule unreachable because d_lf = d_ff)
      are recorded as literal failures with the reviewers' adjudication of
      their substance beside them; a re-scoring needs a versioned
      protocol_amendment record, which this task does not create.
    - >-
      Claim tiers: no evidence record asserts above its tier
      (docs/claims-and-verification.md); EXP-PFDR-c04716 is derivation tier
      with certificate kind none; the other four are toy-tier measurements
      with decomposition certificates re-verified; no cryptographic-scale
      label anywhere (fd901a's 256-bit cells are exact ranks of a 64-column
      matrix reached by a fixed-shape shortcut, labelled as such). Every
      conclusion is scoped to the tested curves, primes, shapes, meter,
      convention and budget, with transfer assumptions stated.
    - >-
      Promotion gates: no hypothesis of this battery may move toward
      'supported' for an asymptotic-complexity claim (H-PFDR-06fd60's
      conditional exponent) without all four gates; at most 'analyzed'.
      Every decision fills knowledge_promotion: a support or reject_scoped
      on replicated or strong evidence promotes a KN-FIND (proven
      boundaries count) or states a concrete not_warranted reason; a
      promoted finding carries the same proof_status and proof_refs as its
      evidence record and never a stronger basis. Include the entries and
      the regenerated knowledge/INDEX.md in the same ledger archive.
    - >-
      Identifiers: use only the pre-allocated ids listed under deliverables;
      mint nothing; if a superseding record is needed (the corrected cost
      table at the generator degree m 2^{m-1}, or an annotation of
      H-PFDR-4148b8's ALPF-011 citation), name it in next_actions for the
      orchestrating session to allocate; never edit an existing record --
      corrections supersede.
    - >-
      Write only under coordination/reviews/pfdr-battery-20260904/
      composition/, ledger/evidence/, ledger/decisions/, the six hypothesis
      records' status fields (the transition, with the deciding DEC cited,
      is the one permitted mutation and is made in the ledger archive
      commit), knowledge/findings/ and knowledge/INDEX.md. Never commit
      yourself: the orchestrating session makes the ledger archive commit
      under an archive receipt that stages exactly the artifact_paths of
      this task plus the ten report directories; before generating, merge
      origin/main into the working branch (merge, never rebase); after the
      archive, push and refresh the PR naming every EV, DEC and KN record.
    - >-
      Inference: policy coordinator-orchestration-code at effort high; no
      fallback, no degradation; record the resolved model identifier in
      each decision's decided_by note if the runtime exposes it.
