    - >-
      G4: every adverse transition cites an archived refutation artifact
      with its declared proof_status; no reject_scoped rests on a single
      unreplicated empirical-only run; no hypothesis exceeds 'analyzed' on
      an asymptotic-complexity claim.
    - >-
      G5: hypothesis status transitions applied only as the decisions
      license, each citing its DEC; promoted findings carry the evidence
      record's proof_status; knowledge/INDEX.md regenerated; every written
      path is inside the write scope; tools/validate_ledger.py passes on
      the new records.
    - >-
      G6: the final response carries the six coordinator_decision blocks in
      summary with explicit next_actions, and names any superseding record
      the orchestrating session must allocate (the corrected cost table at
      generator degree m 2^{m-1}; the H-PFDR-4148b8 citation annotation).
