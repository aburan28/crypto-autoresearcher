  objective: >-
    Compose the ten blinded reviewer verdicts into official evidence and
    decisions for the five completed contracts of the battery, and record
    the disposition of the blocked sixth contract. Per completed experiment:
    (1) read the validator and red-team reports for that experiment against
    its review_plan (the identical block carried by both of its handoffs),
    joint by joint, and record each joint's verdict and the reviewer's
    breaking artifact if any; (2) run the validity gate (expected run
    count, schema-complete manifests, seed integrity, raw/summary
    agreement, control comparability, certificate re-checks, the blind
    re-derivation's agreement or the localisation of its disagreement) and
    send an invalid or incomplete run set back to the Executor with
    concrete defects instead of interpreting it; (3) write
    review-analysis.md with the four sections Observation / Comparison /
    Inference / Limitation; (4) write the evidence record with the claim
    tier, proof_status and proof_refs, strength, scale label, controls,
    confounders, the largest claim the data justify, and the review round's
    plan and report paths; (5) write the coordinator_decision with
    rationale, evidence_refs, limitations, next_actions and the mandatory
    knowledge_promotion field; (6) apply the hypothesis status transition
    the decision licenses; (7) promote findings under /curate-knowledge
    where the gate requires it and regenerate knowledge/INDEX.md. Then
    write DEC-20260904-28718f pausing EXP-PFDR-4bfc6f. Every decision is an
    official transition made only from committed review reports and
    committed run packages.
  uncertainty_reduced: >-
    Whether each of the five hypotheses' statuses may move, in which
    direction, at what evidence strength and scope; whether the review
    round's independence properties held (every joint owned and attested,
    no sibling reads, no re-deriver leak); whether the prior recorded in
    each review_plan was confirmed or overturned (a recorded prior the
    review overturns is among the most informative results this program
    can produce and must be named as such); and what the battery hands to
    the RQ-PFDR-ae2fba decision table: the degree column at the tested
    scale, the measured D_0(s) law against the cost table, and the
    corrected generator degree at m >= 3.
