handoff:
  id: TASK-20260915-532164
  from: coordinator
  to: red-team
  goal_id: GOAL-ICPERF-e6b6a4
  status: written_not_dispatched
  status_note: >-
    WRITTEN, NOT DISPATCHED. This card exists so the approval gate for
    EXP-ICPERF-025a52 has a named, budgeted, reviewable owner. It is not launched
    by DEC-20260915-674299: launching it requires the design records to be
    committed and pushed (TASK-20260915-60dc73) and a lane claim on
    GOAL-ICPERF-e6b6a4 via `tools/goal_lanes.py claim`, because BATCH-51e2aa is
    held by another session and the goal's max_concurrent is 2. A message or a
    task card is never a dispatch and never an approval.
  objective: >-
    Screen IDEA-20260915-5c407a and H-ICPERF-5f038b for DOMINATION before any
    implementation budget is spent: determine whether the distinct-node to
    tree-node sharing ratio in index-calculus descent has already been measured
    and reported as a function of depth, and -- the load-bearing half -- whether
    the published descent complexity analyses are stated on the descent TREE or
    already on the DAG. If they are already stated on the DAG, regime R3 has no
    exponent content even if rho_j grows, and the whole line collapses by argument
    rather than by experiment, which saves the entire implementation budget.
  uncertainty_reduced: >-
    Whether EXP-ICPERF-025a52 would measure something already known (dominated),
    something whose interpretation is already foreclosed (no exponent content), or
    something genuinely unmeasured in this program's corpus.
  inputs:
    - ledger/ideas/IDEA-20260915-5c407a.yaml
    - ledger/hypotheses/H-ICPERF-5f038b.yaml
    - experiments/EXP-ICPERF-025a52/specification.yaml
    - ledger/questions/RQ-ICPERF-94c86e.yaml
    - ledger/decisions/DEC-20260915-674299.yaml
    - AGENTS.md "Knowledge retrieval policy" and "Citation provenance" in templates/research-records.md
  constraints:
    - >-
      ZERO scientific runs. No descent is implemented, no experiment is executed,
      nothing under experiments/EXP-ICPERF-025a52/runs/ is created.
    - >-
      Every reference returned carries a provenance tag (recalled | retrieved | kb
      | internal). A `recalled` reference is a pointer for the next reader and may
      NOT be reported as establishing that anything is known or dominated; only a
      source an agent actually read or resolved through the index may do that, and
      it names the verifying agent in verified_by.
    - >-
      Absence of a search result is NOT evidence that something was not done
      (AGENTS.md, retrieval policy). If the kb index is empty or the MCP server is
      unavailable, say so as an infrastructure finding and report the screen as
      INCOMPLETE; do not convert silence into novelty.
    - >-
      Do not propose or perform a redesign of the contract. If the screen finds
      domination, report it with the citation; the supersession is a Coordinator
      act with its own record.
    - No status is changed, no record is edited; write only inside the declared write scope.
  deliverables:
    - >-
      A screen report answering, separately and explicitly: (Q1) has rho_j (or any
      equivalent distinct-node vs tree-node ratio) been measured and reported as a
      function of depth for any index-calculus descent? (Q2) are the standard
      descent cost analyses charged on the tree or on the DAG? (Q3) does any
      published implementation memoise descent nodes, and is the saving quantified
      anywhere?
    - >-
      A verdict from {dominated, partially_dominated, not_found, screen_incomplete}
      with the reasoning, and for anything other than not_found the exact citation
      with provenance and verified_by.
    - >-
      An explicit statement of what the screen could NOT cover (index coverage,
      unavailable sources), so the Coordinator can scope the approval decision to it.
  artifact_paths:
    - coordination/goals/GOAL-ICPERF-e6b6a4/tasks/TASK-20260915-532164/screen-report.md
    - coordination/goals/GOAL-ICPERF-e6b6a4/tasks/TASK-20260915-532164/sources.yaml
  write_scope:
    - coordination/goals/GOAL-ICPERF-e6b6a4/tasks/TASK-20260915-532164/
  read_scope: [ledger, experiments, knowledge, inputs, docs]
  archived_by: null
  archived_by_note: >-
    Deliberately null and not an omission. This card is not dispatched by
    DEC-20260915-674299, and an archival task identifier minted now would name a
    commit nobody has planned. The archive task for the screen report is minted
    with `tools/allocate_id.py --next handoff` at dispatch time and bound then, so
    that exactly one archival task owns the report -- which is the rule this null
    is protecting, not evading.
  depends_on:
    - TASK-20260915-60dc73
  dispatch_preconditions:
    - >-
      archived_by is bound to a freshly minted archival task, so that this card's
      report is owned by exactly one archive before any agent writes it. Dispatch
      with archived_by still null is forbidden.
    - >-
      TASK-20260915-60dc73 has committed and pushed the design records, so the
      screen reads committed inputs.
    - >-
      A lane is claimed or opened on GOAL-ICPERF-e6b6a4 with tools/goal_lanes.py,
      respecting max_concurrent 2 and BATCH-51e2aa's machine-quiet requirement.
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 3600
    memory_gb: 2
    maximum_runs: 0
  budget_note: >-
    maximum_runs is 0 because this is a zero-run screen; the wall-clock and memory
    figures are advisory machine-headroom numbers under
    docs/research-budget-policy.md, not an approval gate. No field here is null.
  completion_gate:
    - screen-report.md exists and answers Q1, Q2 and Q3 separately.
    - Every source carries provenance; every non-`recalled` source carries verified_by.
    - A verdict from the declared set is stated, with its uncovered scope named.
    - No file outside the declared write scope was modified and no run directory was created.
  return_format: >-
    Markdown report plus sources.yaml; the Coordinator composes the approval or
    supersession decision from it. The report asserts no research status.
  review_plan: null
  review_plan_note: >-
    Null on purpose. This is a priority/domination screen, not a claim-changing
    review round: it can move no hypothesis status and supports no headline claim
    by itself. A round that could move H-ICPERF-5f038b -- for instance a validator
    round on a completed Stage B -- will carry a review_plan written before its
    reviewers run, per AGENTS.md "Review architecture".
  recorded_at: '2026-09-15'
  decision_ref: DEC-20260915-674299
