handoff:
  id: TASK-20260731-701
  from: coordinator
  to: idea-generator
  objective: >-
    TWO deliverable groups, ranked in this order. (i) Author a STANDALONE,
    SELF-CONTAINED DERIVATION NOTE archiving the two durable negative facts
    recomputed in BATCH-001 — that AES supplies exactly ONE element of
    GL(4,GF(2^8)) on a column, the MixColumns matrix M, of multiplicative
    order 4, so the group it generates is cyclic of order 4 and is neither
    transitive nor 2-transitive and NO AGL/GL transitivity argument is
    available for column-local invariants; and that byte-wise inversion Inv
    PRESERVES GF(2^8)-collinearity, since Inv(lambda*v)_i = lambda^-1 *
    v_i^-1, so the GF(2)-affine layer L is the operative obstruction at
    SubBytes and not Inv. (ii) Perform object-first ideation on the ONE
    residual BATCH-001 retained and did not touch: cross-column /
    super-box-level objects at the 2-round 32-bit AES super-box, where
    ShiftRows sits on the OUTSIDE of the object rather than through it.
  uncertainty_reduced: >-
    (i) Whether the two negative facts stand as a checkable, independently
    reproducible artifact in their own right, separable from the validation
    report they currently live inside — which is the precondition, under
    docs/claims-and-verification.md ("Refutation artifacts"), for any later
    decision to rely on them or promote them to knowledge. (ii) Whether any
    named cross-column / super-box-level object admits a lossy projection
    surviving more than the one-and-a-half rounds that column-local objects
    achieve, or whether that lane too closes at the
    docs/inventor-protocol.md section 4 standard.
  inputs:
    - GOAL-AES-001 (objective, claim-tier ceiling, network policy, saturation stance)
    - RQ-AES-001
    - >-
      DEC-20260731-011 — the committed BATCH-001 checkpoint. Its dispositions
      are BINDING on this task: CAND-601-A is premise-undermined and
      repair-before-run; CAND-601-B's sota_delta and every recalled-baseline
      comparison are STRUCK; the residual open question is RETAINED and ranked
      first.
    - >-
      EV-AES-001 observations B-3, B-4, B-11 and C-1, which state the two
      negative facts and their recomputations, and the enumerated-closure audit.
    - >-
      The committed BATCH-001 producer snapshot 0185c0ff — in particular
      candidate_report.yaml's enumerated_closures, whose determinant closure
      already names the forward guidance this task acts on: "A multi-byte
      object must be defined on a SHIFTROWS-INVARIANT byte set (a diagonal, or
      a full 2-round super-box), not on a column."
    - >-
      The TASK-20260731-604 validation package (validation_report.yaml,
      ideation_screening_review.md) — recomputations B-R1 through B-R7.
    - >-
      The TASK-20260731-602 harness (aes_reduced.py, admitted as campaign
      infrastructure by DEC-20260731-011) as the certification target for any
      computation performed in this task.
    - docs/inventor-protocol.md sections 1, 2, 3, 4, 5, 6
    - docs/target-result-profile.md
    - docs/claims-and-verification.md (claim tiers, refutation artifacts)
    - The knowledge corpus under knowledge/ for deduplication
  constraints:
    # ---- Deliverable (i): the derivation note ----
    - >-
      The derivation note MUST BE SELF-CONTAINED. A reader with no access to
      the BATCH-001 validation report must be able to read the statement,
      follow the derivation, and reproduce the computation. It is the artifact
      that will be promoted to a KN-FIND in the BATCH-002 ledger archive, and
      under docs/claims-and-verification.md it must be committed in the
      TASK-20260731-704 snapshot BEFORE the ledger decision that promotes it.
      It may cite EV-AES-001 and TASK-20260731-604 as provenance but must not
      DEPEND on them for its argument.
    - >-
      State each fact as a numbered proposition with an explicit hypothesis and
      conclusion, give a derivation, and state its scope. Fact 1 concerns the
      group generated on a single column by the AES round function's linear
      layer, on DIFFERENCES (where translations act trivially); say so
      explicitly, because that restriction is what removes the translation
      subgroup and reduces T semidirect <M> to <M>. Fact 2 concerns byte-wise
      Inv on vectors over GF(2^8), including the behaviour at zero coordinates,
      where Inv(0) = 0 is the AES convention and must be handled explicitly
      rather than waved past.
    - >-
      Carry the consequences that make the note worth archiving: the order of M
      is 4; |<M>|/|GL(4,GF(2^8))| is astronomically small; the orbit of e1 under
      <M> has size 4 against q^4-1 = 4294967295, giving at least 1073741823
      orbits on nonzero vectors — hence nonconstant invariants of a single
      column difference exist IN ABUNDANCE and their non-existence may not be
      asserted by a transitivity argument. And: what survives is only the
      elementary fact that COLLINEARITY specifically is preserved by any
      invertible M.
    - >-
      Ship a verification script (or, if a script is genuinely inapplicable to
      a step, explicit reproduction instructions for that step) that recomputes
      every numerical claim in the note from scratch: the order of M in
      GL(4,GF(2^8)), the orbit size, the orbit count bound, Inv-collinearity
      preservation on sampled collinear pairs both with and without zero
      coordinates, and the failure of collinearity under L. The script runs
      inside the local envelope, seeds all randomness deterministically, prints
      a machine-checkable pass/fail line per claim, and its exact invocation and
      output are recorded in the note.
    - >-
      The note is a NEGATIVE STRUCTURAL RESULT about the algebra of AES
      components. It is NOT a cryptanalytic claim, not a distinguisher, not a
      barrier statement about AES security, and asserts nothing at any round
      count. State that limitation inside the note.
    - >-
      Record proof_status honestly: these are derivations checkable by
      recomputation, not empirical measurements. Do not label them `proven` in
      a sense the note does not establish, and do not label them
      `empirical_only`.
    # ---- Deliverable (ii): super-box ideation ----
    - >-
      Object-first: every candidate NAMES the concrete mathematical object it
      tracks, on which byte set, at which round count. "Attack the super-box" is
      not a candidate and must be rejected by the session itself.
    - >-
      Scope the ideation to the retained residual: cross-column /
      super-box-level objects at the 2-round 32-bit AES super-box, where
      ShiftRows sits on the OUTSIDE of the tracked object. This is the only
      exponent-relevant lane BATCH-001 left open. Column-local objects are
      CLOSED FOR THIS TASK by deliverable (i) plus the determinant closure:
      re-proposing one is a re-derivation, not a candidate.
    - >-
      Apply the lossy-projection test BEFORE proposing any experiment and record
      its outcome per candidate. A projection that discards nothing is a change
      of coordinates, not a new object. Report the object's survival depth in
      rounds explicitly and honestly — BATCH-001's column-local objects reached
      about one and a half rounds, and that is the bar this lane exists to beat.
    - >-
      Deduplicate every candidate explicitly against the NINE known families
      already mapped in BATCH-001's baseline_map.md — integral/square,
      impossible differential, meet-in-the-middle / Demirci-Selcuk, boomerang,
      biclique, division property, and the three further families that map
      records — and state the verdict per family. A renamed variant is recorded
      as a rediscovery, not as a candidate. Do not present anything as novel
      against the external literature: that question is UNRESOLVABLE in this
      environment.
    - >-
      Every candidate carries a FULL end-to-end cost boundary charging data,
      time, memory, precomputation and verification at the same round count as
      any named mechanism, plus dominated_by and a quantitative sota_delta.
      dominated_by: null only after checking every frontier row across time,
      memory, and data/queries; an unchecked null is a fabrication under
      AGENTS.md rule 9.
    - >-
      Every candidate names EXACTLY ONE cheap falsification gate that fits the
      local envelope (4 CPU cores, 15 GB RAM, no GPU, no sage; gcc 13.3.0 with
      -maes, python3 with pycryptodome 3.23.0, openssl CLI) and the remaining
      campaign budget, WITH its null-object control stated in the same place.
      Learn from defect I-3: the gate must be able to demonstrate its own
      SENSITIVITY — state what the gate reads on the null object and why that
      differs from what it reads on AES. A gate whose positive control fires on
      a byte-activity pattern rather than on the claimed structure is not a
      gate. If you cannot construct a discriminating control for your object at
      your depth, SAY SO IN WRITING; that concession is an acceptable and
      informative outcome.
    - >-
      NO_ADMISSIBLE_NEXT_MECHANISM is a COMPLETE and admissible outcome for
      deliverable (ii), provided it meets the docs/inventor-protocol.md section
      4 closure standard — named obstruction, argument, forward guidance naming
      what remains open. A count of screened-and-rejected mechanisms is a
      fatigue report and its honest status is `unverified`. Deliverable (i) is
      required regardless and is not excused by any outcome of (ii).
    - >-
      Premature closure is a failure mode symmetric with overclaiming. Do not
      decline to generate on the grounds that AES is exhaustively studied.
    # ---- Cross-cutting ----
    - >-
      EVERY literature number is UNVERIFIED-FROM-MEMORY under this network
      policy (csrc.nist.gov, eprint.iacr.org, arxiv.org, faest.info, ietf.org
      all blocked; zero primary sources readable). Mark each such number
      `unverified_from_memory` inline. Presenting a recalled number as if read
      is a fabrication under AGENTS.md rule 9.
    - >-
      Reduced-round scope only. No candidate, phrasing, or extrapolation may
      assert anything about full-round AES or deployed AES security. Academic
      defensive cryptanalysis only.
    - >-
      Any computation performed in this task runs against the admitted
      TASK-20260731-602 harness, read-only, and must respect its documented
      reduced-round convention (C1/C2/C3). Do not modify, re-run into, or
      supersede any BATCH-001 committed artifact: read them, cite them, and
      write only under this task's own directory.
    - >-
      Propose no hypothesis status, approve no experiment, create no ledger
      record, and change no official state.
  deliverables:
    - derivation_note_column_local_obstructions.md
    - verify_derivation.py
    - candidate_report.yaml
  artifact_paths:
    - coordination/goals/GOAL-AES-001/batches/BATCH-002/tasks/TASK-20260731-701/derivation_note_column_local_obstructions.md
    - coordination/goals/GOAL-AES-001/batches/BATCH-002/tasks/TASK-20260731-701/verify_derivation.py
    - coordination/goals/GOAL-AES-001/batches/BATCH-002/tasks/TASK-20260731-701/candidate_report.yaml
  archived_by: TASK-20260731-704
  inference:
    policy: research-deep
    requested_policy: research-deep
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
    standing_basis: >-
      inference-amendment commit 0137a051eb5828789eb267fa83c8278086578d4c
      (coordination/goals/GOAL-AES-001/batches/BATCH-001/inference-amendment-TASK-20260731-602.yaml).
      Under this Claude Code harness the orchestration/model-policies.yaml
      aliases cannot be resolved by subagent frontmatter (CLAUDE.md, "Model
      policy note"); all subagents run `model: inherit`, so a substitution is
      STRUCTURAL and expected.
    harness_note: >-
      Recording the substitution is mandatory, not optional. TASK-20260731-601
      attested nothing and that gap is defect D-1 in EV-AES-001; BATCH-002
      treats a missing inference block as a COMPLETION-GATE FAILURE AT DISPATCH.
      Never silently substitute; never infer a resolved model you did not
      observe (AGENTS.md rule 9).
  budget:
    wall_clock_seconds: 2400
    memory_gb: 4
    maximum_runs: 3
  completion_gate:
    - >-
      INFERENCE BLOCK REQUIRED. Every produced artifact carries an `inference`
      block recording: policy, requested_policy (research-deep), the ACTUAL
      resolved model identifier, fallback_used (true/false), model_verified
      (true/false, with `doctor --probe` not-run recorded as false), and the
      standing basis 0137a051. An unobserved resolved model is recorded as
      `unrecorded`, never guessed. A missing or partially filled inference block
      fails this task.
    - >-
      derivation_note_column_local_obstructions.md states both facts as numbered
      propositions with explicit hypotheses, derivations, consequences (order 4;
      orbit of e1 of size 4 against q^4-1; at least 1073741823 orbits on nonzero
      vectors; L rather than Inv as the operative obstruction at SubBytes), and
      scope statements, and is readable and reproducible WITHOUT the BATCH-001
      validation report.
    - >-
      verify_derivation.py recomputes every numerical claim in the note from
      scratch with recorded deterministic seeds, prints a pass/fail line per
      claim, and its exact invocation and output are transcribed into the note.
      Any claim the script cannot cover carries explicit reproduction
      instructions instead.
    - >-
      The note explicitly states that it asserts NO cryptanalytic claim about
      AES at any round count and is not a barrier statement about AES security.
    - >-
      candidate_report.yaml confines itself to cross-column / super-box-level
      objects at the 2-round 32-bit super-box with ShiftRows outside the object,
      and names per candidate: the tracked object and its byte set, the round
      count, assumptions, prediction, survival depth in rounds, lossy-projection
      test outcome, full end-to-end cost boundary, dominated_by, quantitative
      sota_delta, and a deduplication verdict against each of the nine mapped
      families.
    - >-
      Each candidate names exactly ONE falsification gate that fits the local
      envelope, stated together with its null-object control AND an explicit
      statement of what the gate reads on the null versus on AES — or an
      explicit written concession that no discriminating control exists for that
      object at that depth.
    - >-
      NO_ADMISSIBLE_NEXT_MECHANISM is accepted for deliverable (ii) if and only
      if it names the residual open question, states which object classes remain
      unexamined, and meets the section 4 closure standard rather than reporting
      a screening count. Deliverable (i) is required in every case.
    - >-
      No BATCH-001 committed artifact is modified; all writes are under this
      task's own directory.
  return_format: >-
    The three artifacts under the assigned task directory, plus a short summary
    naming: the terminal status of each of the two propositions in the note, the
    verification script's per-claim pass/fail lines, the number of super-box
    candidates generated and their survival depths, and whether the ideation
    outcome is candidates or NO_ADMISSIBLE_NEXT_MECHANISM.
