  what_the_two_reviews_established: >-
    Both independently confirm the raw numbers are correct AND both establish
    that the headline framing of execution_report.md overstates what was found.
    Validator: full-population recompute from raw per-curve arrays reproduces
    every class/control multiset in verdict.json exactly; the D-4 supersession
    diagnosis (RUN-ICINV-geom-m3's cross-check predicate wrongly compared
    rational roots against rational points) is independently confirmed
    concretely, including a hand-checked algebraic factorisation. Red team: the
    F4b "elimination F_p-factorisation type" family is NOT a new isogeny-class
    finding. It is a re-derivation, via expensive Groebner elimination, of the
    rational 2-torsion factorisation type of the curve's own defining cubic --
    a quantity harness/exp_icinv.py already computes (function
    two_torsion_x_count, committed 2026-08-07, three days before this batch)
    and whose docstring already states "z is NOT an isogeny-class invariant."
  independently_verified_by_this_coordinator_before_writing_anything: >-
    Do not re-derive these; they are settled. (1) THE F4B/2-TORSION IDENTITY,
    the most important fact in this archive: read all 138 per-curve records
    from RUN-ICINV-geom-m3-v2/per-curve-invariants.json directly and confirmed,
    via exact sympy polynomial arithmetic mod p=4001 (not string comparison,
    which is fooled by centered-vs-positive residue printing), that
    elimination.polynomial equals x^3+a*x+b on ALL 138 of 138 class curves, zero
    exceptions; and confirmed factorisation_type is a perfect deterministic
    function of two_torsion_x_count with zero exceptions across all 138 rows
    ((1,1,1) <-> ttc=3 on 66 curves; (1,2) <-> ttc=1 on 72 curves). (2) THE
    SOURCE-REPRODUCIBILITY GAP: read every run manifest's recorded source sha256
    for harness/exp_icinv_geometry.py directly. Three DISTINCT source versions
    were used across the five completed runs (7ac1030c... for gates and m3;
    8fb54bc5... for m3-v2 AND m4; 91384d9c... for m4-v3), every one recorded
    status: untracked at run time, and only the LAST version (91384d9c...,
    m4-v3's, the SECONDARY m=4 result) matches what this Coordinator's own
    snapshot commit 1721063e4 put into git. The PRIMARY m3-v2 result's exact
    source is NOT recoverable from git at any commit -- only its hash pin
    survives as a fingerprint. execution_report.md's "reproducible from recorded
    commands and pinned hashes" claim is therefore FALSE AS STATED for 4 of the
    5 completed runs, including the primary one. This does not cast doubt on the
    NUMBERS -- this Coordinator and the Validator each independently re-derived
    the headline results from scratch, in fresh sessions, without reading or
    trusting the uncommitted script -- but it is a genuine provenance gap for
    the record of record. (3) A WITNESS-CURVE ERROR IN THIS COORDINATOR'S OWN
    SNAPSHOT COMMIT MESSAGE (1721063e4), caught by the Validator's V2 check and
    independently reconfirmed: that commit message states curve (a,b)=(17,1345)
    has 0 F_p-rational points on the singular-locus variety. It does not --
    verified directly from per-curve-invariants.json, (17,1345) has 6 rational
    points. The zero-rational-points example the D-4 diagnosis actually rests on
    is (a,b)=(148,2766), which does have 0. This is an error in prose THIS
    Coordinator wrote, not in any run artifact -- every underlying number in the
    committed run records is correct and unaffected. (4) THE M4 STATUS-LABEL
    DISCREPANCY the Validator flagged: RUN-ICINV-geom-m4's own manifest.yaml
    records status: completed_invalid (confirmed by this Coordinator directly,
    matching what was independently read from that file before the executor was
    ever resumed); execution_report.md's summary table instead labels that same
    run failed_infrastructure. Both point at the identical underlying event (host
    disk exhaustion, OSError, SR1-3 passed before the crash) and both are
    consistent with AGENTS.md rule 5 (never negative mathematical evidence) --
    this is a vocabulary/documentation-layer inconsistency between the manifest
    field and the report's prose table, not a substantive disagreement about
    what happened or its evidential weight.
  what_remains_genuinely_new_and_class_invariant: >-
    Five of the six families measured -- S_3 monomial support (13 on all 138),
    graded Betti table, regularity of S/J, affine singular locus (dimension,
    degree), and elimination polynomial DEGREE (not its factorisation type) --
    are reported CLASS-INVARIANT across the whole 138-curve certified class, are
    computed by genuinely new exact symbolic machinery (not a restatement of any
    prior instrument), and this equivalence to a pre-existing quantity does NOT
    apply to them. This is the part of the result that is actually new. Whether
    it is itself surprising, expected, or trivially explained by the Koszul
    structure (C-KOSZUL found the Jacobian generators are NOT a regular
    sequence, so it is not an automatic Koszul-degeneration artifact) is a
    question for a future lane, not settled by this archive.
