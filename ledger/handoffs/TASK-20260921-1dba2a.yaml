  review_plan:
    claim_under_review: >-
      H-FROB-d93575, statement (verbatim): "Let E/F_q be an ordinary subfield
      curve considered over F_{q^n} with p not dividing n, let <G> be a
      prime-order subgroup of order N not contained in a proper subfield, and
      let x^n - 1 = (x-1)*f_1*...*f_s over F_q. For each partition P of
      {f_1,...,f_s} into m groups, let V_1,...,V_m be the corresponding
      Frobenius-stable F_q-subspaces of F_{q^n}, let B_j = {Q in <G>\{O} :
      x(Q) in V_j}, let p_m(P) be the exact fraction of <G>\{O} expressible
      as Q_1 + ... + Q_m with Q_j in B_j, and let U(P) be the exact number of
      relation columns of the union. Then, at fixed total slot dimension
      sum_j dim V_j = n - 1, the combinatorial cost ratio (U(P) + 1 +
      extra)/p_m(P) varies across P by at least a factor 4 in a cell whose
      x^n - 1 splits completely, its minimum is attained at a partition with
      m >= 2 and balanced slot dimensions, and the within-cell improvement
      factor is at least four times larger there than in a matched cell
      whose x^n - 1 has no non-trivial factorisation. Separately and
      independently, the direct sum of the kernels ker f_j(pi) over all j is
      exactly ker Tr_{F_{q^n}/F_q}, of dimension n - 1." This round is
      specifically about success_criterion clause (6) and
      falsification_criterion clause (c) -- read both verbatim from
      specification.yaml before ruling. Clauses (1)-(5) of success_criterion
      and (a),(b),(d),(e) of falsification_criterion were already resolved
      (all pass/not-triggered) by the first review round (EV-FROB-2fe225)
      and are NOT reopened here except insofar as the new run's data bears
      on them (it does not: the new run computes no new object-arm
      partition data beyond a consistency check).

    coordinator_prior: >-
      Recorded 2026-09-21, before this handoff is dispatched, by the
      session that dispatched the Executor for TASK-20260921-51bc02,
      independently re-verified its run package (arithmetic, hashes,
      cross-checked against the run's own checker.py), and made the
      snapshot commit (PR #1330) -- so this prior is informed by that
      verification work, not blind to the run's content; it is a prior on
      the INTERPRETIVE decision only. Prediction: the decision lands on
      WEAKEN, not reject_scoped and not support/inconclusive, for three
      reasons. First, success_criterion clause (6) requires ALL of C2, C3
      and C4 to show strictly-smaller spread than the object arm, in every
      completed cell; the measured data shows this fails in BOTH
      FROB-SPLIT-q11n5 (C3, C4 tie) and FROB-EQDEG-q19n5 (C2 exceeds; C3,
      C4 tie), so clause (6) is NOT MET and I predict the review confirms
      this. Second, falsification clause (c) ("any of C2, C3 or C4 shows a
      spread >= the object's") reads, on its face, as TRIGGERED here --
      and unlike the first round's PTM-2 problem, this is NOT a vacuous
      tie: the object arm has real, non-trivial variation on this curve
      (spread ~4.56 and ~7.15, not 1), so there is genuine variation for
      the comparison to be about. I predict the review's own
      proves-too-much check (PTM-2 below) will NOT find the same defect
      that invalidated the first round's naive reading, because C2 (a
      DIFFERENT, dimension-matched-but-not-cardinality-matched control)
      genuinely diverges from the object on both cells (sometimes smaller,
      once larger) rather than trivially matching it -- meaning the
      instrument still has discriminating power at this scale in general,
      and the specific C3/C4 tie is not an artifact of "nothing
      distinguishes anything at toy scale." Third, despite predicting
      clause (c) reads as triggered, I predict the decision is WEAKEN
      rather than reject_scoped, because this is a SINGLE run
      (maximum_runs extended by exactly one, not independently replicated)
      and the C3/C4 tie's own explanation (identical U_neg by
      construction, plus a MEASURED, not derived, zero-collision outcome
      on both the object and matched-cardinality arms) is empirical_only,
      not a proof -- AGENTS.md forbids reject_scoped on a single
      unreplicated empirical-only run. I additionally flag, for J4, a
      collision-count observation I made before writing this plan (read
      from metrics.json's raw block_sizes/prod_tuple_count/distinct_targets
      fields, NOT from report.md's prose): C2's [2,2] partition shows a
      genuine 2x collision factor on BOTH cells (36->18 tuples/targets for
      SPLIT, 576->288 for EQDEG) despite having SMALLER block products
      than the object/C3/C4 (which show ZERO collisions at LARGER block
      products), which is the opposite of what a naive "collisions are
      rarer at smaller cardinality" story would predict -- I predict this
      argues AGAINST treating the C3/C4 zero-collision match as a generic
      toy-scale artifact (since if it were generic-to-scale, C2's smaller,
      sparser construction should show it even more readily, and it does
      not), and therefore SUPPORTS treating the C3/C4 finding as a genuine,
      structure-dependent measurement rather than an instrument artifact.
      I record this as a prediction, not a finding: the review must verify
      the collision counts and this argument independently, not adopt it
      from this paragraph.

    joints:
      - joint: >-
          J1: RUN-FROB-91ee9c-51bc02 is valid -- complete, hash-bound,
          its object-arm consistency check against RUN-FROB-91ee9c-7119f2
          genuinely passes, and its C8 independent checker performed real,
          non-circular verification.
        assigned_to: coordinator
        attack_plan: >-
          Recompute sha256/bytes for every artifact in
          runs/TASK-20260921-51bc02/manifest.yaml's run.artifacts dict
          directly from disk; confirm 0 mismatches. Recompute the
          object-arm I and both endpoints for both cells from
          metrics.json's raw (p_m, U_neg) pairs and confirm exact
          agreement with RUN-FROB-91ee9c-7119f2's recorded curve-index-1
          values. Read checker.py directly and confirm it does not import
          implementation.py, core.py or lattice.py from either run
          directory, and that its cost-ratio reverifications are
          independently computed, not copied.
        breaking_artifact: >-
          Any artifact hash mismatch, any object-arm value that does not
          exactly match the first run's recorded curve-index-1 values, or
          a checker.py that imports driver code.
      - joint: >-
          J2: every reported spread (object, C2, C3 both seeds, C4 both
          seeds, both cells) in RUN-FROB-91ee9c-51bc02 is independently
          re-derived from the raw (p_m, U_neg) pairs in metrics.json, not
          merely re-read from report.md's summary tables.
        assigned_to: coordinator
        attack_plan: >-
          Using fresh code (not implementation.py/checker.py/aggregate.py
          from either run), compute cost_ratio_neg = (U_neg+1)/p_m for
          every ok partition in every arm, take max/min per arm, and
          confirm the spread values and every strictly-smaller/not verdict
          in report.md section 5's summary table exactly.
        breaking_artifact: >-
          Any spread or verdict in report.md not reproduced exactly by
          independent recomputation from the raw pairs.
      - joint: >-
          J3 (the load-bearing joint): does success_criterion clause (6)
          resolve to MET or NOT MET, and does falsification_criterion
          clause (c) resolve to TRIGGERED or NOT TRIGGERED, on the
          combined evidence of both runs?
        assigned_to: coordinator
        attack_plan: >-
          Read clause (6) and falsification (c) verbatim against the
          actual measured spread table for both cells (curve index 1).
          State explicitly whether clause (6)'s "STRICTLY SMALLER" holds
          for ALL of C2/C3/C4 in EACH completed cell (it does not: C3/C4
          tie or C2 exceeds). Apply a proves_too_much check (PTM-2 below)
          before ruling: is there a reading under which the observed
          ties/excess are NOT meaningfully attributable to the tested
          object (analogous to how the first round's vacuous curve-0 tie
          was not meaningfully attributable to anything)? If no such
          defect survives scrutiny, the honest reading is that clause (6)
          is NOT MET and falsification clause (c) fires on genuinely
          non-degenerate data -- state this plainly rather than searching
          for a reading that avoids it.
        breaking_artifact: >-
          A textual argument, grounded in the frozen spec's own language
          rather than in what makes a cleaner-sounding verdict, that the
          measured ties/excess here are analogous to the first round's
          vacuous-tie defect (i.e., that they carry no information about
          the object under test) that survives the PTM-2 attack below.
      - joint: >-
          J4: the collision-count asymmetry between C2 (which shows
          collisions, i.e. distinct_targets < prod_tuple_count, on both
          cells' [2,2] partition) and the object/C3/C4 arms (which show
          zero collisions on every ok partition, both cells) -- verify
          this is real and consider its bearing on whether the C3/C4 tie
          is a meaningful, structure-dependent finding or a generic
          toy-scale artifact.
        assigned_to: coordinator
        attack_plan: >-
          Read block_sizes, prod_tuple_count and distinct_targets directly
          from metrics.json for every ok partition, every arm, both cells.
          Confirm the specific collision counts (36->18 and 576->288 for
          C2's [2,2] partition; check whether C2's [4] partition and every
          object/C3/C4 partition genuinely shows prod_tuple_count ==
          distinct_targets). If confirmed, state explicitly whether a
          smaller block product (C2's) showing MORE collisions than a
          larger block product (object/C3/C4's) showing NONE is consistent
          with a generic "collisions are a function of scale alone"
          reading, or whether it argues that collision behavior here is
          structure-dependent (making the C3/C4 zero-collision match to
          the object a genuine, non-generic finding). This is secondary to
          J3, not independently load-bearing for the decision, but its
          conclusion is a required input to J3's proves_too_much test.
        breaking_artifact: >-
          A collision count that does not match what report.md states, or
          a demonstration that the same zero-collision pattern would occur
          for essentially ANY same-order-of-magnitude construction
          regardless of structure (which would support a genuine
          proves-too-much reading for J3).
      - joint: >-
          J5 (blind_rederivation, separately declared below): independently
          derive, from specification.yaml's success_criterion clause (6)
          and falsification_criterion clause (c) text and the raw
          (p_m, U_neg) pairs in RUN-FROB-91ee9c-51bc02's metrics.json
          ALONE -- never report.md, cost-model.json's own presentation, or
          this handoff's own framing above -- the strictly-smaller/not
          verdict table for both cells, then compare to report.md's
          stated table after opening it.
        assigned_to: coordinator
        attack_plan: See blind_rederivation block below.
        breaking_artifact: >-
          A materially different verdict table derived blind versus what
          report.md states, without a traceable arithmetic reason.

    blindness:
      mutual: true
      lifted_for: []
      rationale: null

    proves_too_much:
      objects:
        - >-
          PTM-1: RUN-FROB-91ee9c-51bc02 must not record any achievable
          partition beyond the two already established for these cells
          ([4] and [2,2]) -- e.g. no fabricated [3,1] or [2,1,1] "ok"
          entry for either curve, which would contradict the divisor
          lattice already verified in the first round for these (q,n)
          cells.
        - >-
          PTM-2 (the one that resolves J3): the reading that calls clause
          (c) "triggered" here must NOT also be forced to fire on data
          where the tie/excess carries no information about the object
          under test. Concretely: (i) confirm C2 -- a DIFFERENT,
          non-pi-stable but dimension-matched (not cardinality-matched)
          control -- genuinely DIVERGES from the object on both cells
          (smaller on SPLIT, larger on EQDEG), rather than also trivially
          matching it; if C2 also trivially matched the object on both
          cells, that would suggest NOTHING at this scale can be
          distinguished from anything else, and the C3/C4 tie would carry
          no information (a genuine proves-too-much failure, analogous to
          the first round's vacuous tie). Since C2 does NOT match, the
          instrument retains discriminating power in general, and the
          specific C3/C4 tie is not explained away by a blanket
          scale artifact. (ii) Separately, per J4, confirm the collision-
          count pattern (C2's smaller construction collides; the
          object/C3/C4's larger construction does not) argues against
          "smallness alone causes ties" as the explanation for the C3/C4
          match.
      failure_signature: >-
        PTM-1 firing (a fabricated partition) invalidates the instrument
        outright. PTM-2 firing (C2 ALSO trivially matching the object on
        both cells, or the collision-count pattern reversing so that
        smaller constructions collide LESS, consistent with a pure
        scale-artifact story) would mean the C3/C4 tie carries no
        information distinguishing this object from a generic toy-scale
        instance, and the correct reading of clause (6)/(c) would need to
        be revisited -- possibly toward "not evaluable at this scale"
        rather than "not met / triggered". The review must state plainly
        which outcome obtains and why, not assume the coordinator_prior's
        prediction.
      assigned_to: coordinator

    blind_rederivation:
      required: true
      quantity: >-
        For RUN-FROB-91ee9c-51bc02, both cells (FROB-SPLIT-q11n5 curve
        A=1,B=2,N=10061; FROB-EQDEG-q19n5 curve A=1,B=1,N=117991): derive
        the strictly-smaller-than-object verdict for C2, C3 (both seeds)
        and C4 (both seeds), computed ONLY from (a) specification.yaml's
        verbatim success_criterion clause (6) / falsification_criterion
        clause (c) text and its metrics.primary definition of
        cost_ratio_neg, and (b) the raw (p_m, U_neg) pairs recorded per
        partition per arm in RUN-FROB-91ee9c-51bc02/metrics.json's
        `measured` object -- NOT from report.md's own stated verdicts,
        section headers, or narrative framing, and NOT from this
        handoff's own coordinator_prior paragraph above (read metrics.json
        first, compute the table, THEN read report.md and compare).
      parameters: >-
        Both cells' full set of (partition, arm, seed) -> (p_m, U_neg)
        pairs, as recorded in metrics.json's `measured.FROB-SPLIT-q11n5`
        and `measured.FROB-EQDEG-q19n5` objects.
      blind_from:
        - experiments/EXP-FROB-91ee9c/runs/TASK-20260921-51bc02/report.md
        - experiments/EXP-FROB-91ee9c/runs/TASK-20260921-51bc02/cost-model.json
        - experiments/EXP-FROB-91ee9c/runs/TASK-20260921-51bc02/implementation.py
        - experiments/EXP-FROB-91ee9c/runs/TASK-20260921-51bc02/checker.py
        - experiments/EXP-FROB-91ee9c/runs/TASK-20260921-51bc02/aggregate.py
        - experiments/EXP-FROB-91ee9c/runs/TASK-20260921-51bc02/work/checker-report.json
      assigned_to: coordinator

    procedure_deviations:
      - >-
        PD-1: joints and blind_rederivation are assigned to the role
        address "coordinator" rather than a distinct reviewer TASK-* id,
        matching the same declared departure as the first round
        (TASK-20260921-da0399's PD-1) and the EXP-FROB-b8cf21 round
        (TASK-20260921-e107c8's PD-1). If this round's decision reaches
        support or reject_scoped at strength >= replicated/strong, a full
        multi-agent independence-checked round is a candidate escalation
        and must be named as a next_action rather than silently closed at
        that strength in this lighter round, per DEC-20260921-3678fc's own
        NA-5.
      - >-
        PD-2: this handoff's coordinator_prior was written by a session
        that had already independently verified the second run's content
        (hash-checking, arithmetic spot-checks, collision-count
        cross-reads) before writing this plan, as part of accepting the
        Executor's handback and making the PR #1330 snapshot commit. This
        is disclosed rather than presented as a blind prior: the prior
        concerns the INTERPRETIVE decision, which was not yet decided at
        the time this plan was written, not the underlying facts (which
        were already independently checked).
