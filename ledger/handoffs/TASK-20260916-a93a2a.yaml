handoff:
  id: TASK-20260916-a93a2a
  from: coordinator
  to: idea-generator
  recorded_at: '2026-09-16'
  goal_id: null
  question_id: RQ-QSP-f9bbdb
  batch_id: null
  objective: >-
    Generate three to five complete, schema-valid, novelty-unverified proposals on
    RQ-QSP-f9bbdb: quasi-subfield-polynomial index calculus as an alternative to
    rho on ECC2K-130 (F_{2^131}), starting from the frozen papers and the n = 131
    cost surface in analysis/qsp-ecc2k130/, which shows the published line
    dominated by rho on every row and leaves exactly two finite open items -- the
    existence of a non-linearized X^{2^33} + lambda(X) with about 2^33 roots and
    Frobenius-stable root set, and the measured cost of one chain-system
    decomposition attempt at m = 4.
  uncertainty_reduced: >-
    Whether any concrete, cheaply falsifiable route remains for the quasi-subfield
    line at n = 131 once Theorem 1 of KN-LIT-4fe9d2, Lemma 4.1 of KN-LIT-0a321c,
    the F_2-divisor census and the 2^131 - 1 factorisation are applied, or whether
    the honest deliverable is a scoped closure with a named obstruction and a
    successor object (section 4 of docs/inventor-protocol.md).
  inputs:
    - ledger/questions/RQ-QSP-f9bbdb.yaml
    - analysis/qsp-ecc2k130/README.md
    - analysis/qsp-ecc2k130/table.md
    - analysis/qsp-ecc2k130/qsp_ecc2k130.py
    - knowledge/literature/KN-LIT-0a321c.md
    - knowledge/literature/KN-LIT-4fe9d2.md
    - inputs/HUANG-2020-JMC-QSP/paper_fulltext.md
    - inputs/EULER-PETIT-2019-QSP/paper_fulltext.md
    - knowledge/literature/KN-LIT-096.md
    - knowledge/literature/KN-LIT-661e97.md
    - knowledge/techniques/KN-TECH-036.md
    - ledger/questions/RQ-FROB-7d8dd4.yaml
    - ledger/questions/RQ-ICPERF-94c86e.yaml
    - docs/object-frame-ideation.md
    - docs/inventor-protocol.md
    - docs/target-result-profile.md
    - agents/idea-generator.md
    - templates/research-records.md
  constraints:
    - >-
      OBJECT FRAME. Every candidate is a PAIR (representation of the point,
      operation set Sigma the tracked object must survive). Name both explicitly
      in `mechanism`. Index calculus is Class I, partial-action (translation by
      factor-base elements only); the quasi-subfield factor base is a
      target-independent, implicit-membership description (x^{2^{n'}} = lambda(x))
      and each candidate says which KN-OPEN-020 open class it occupies.
    - >-
      TRICHOTOMY and LOSSY-PROJECTION TEST per docs/object-frame-ideation.md
      section 3, against the named Sigma. A projection that loses nothing is not
      returned.
    - >-
      THE COST SURFACE IS THE STARTING POINT, NOT A TARGET TO RE-DERIVE. Cite
      analysis/qsp-ecc2k130/table.md rows by (n', d, m); a candidate that changes
      a row must say which factor it changes (attempts, M(E), the 3^{kappa m^2}
      solver factor, the 2^{2n'} linear algebra, the orbit count) and by how much,
      with exponents. Beating brute force (2^131) is the paper's own Remark 3.1
      and is not a result; the row to beat is rho at 2^60.9 with its Frobenius
      and negation speedups (KN-LIT-096).
    - >-
      THE TWO FINITE OPEN ITEMS COME FIRST. (i) Existence: for X^{2^33} + lambda(X)
      with lambda in F_2[X] non-linearized and 3 <= deg lambda <= 7 (at most 2^8
      candidates), the exact root count over F_{2^131} as deg gcd(X^{2^131} - X, L)
      -- design the certificate, the GF(2)[x] cost model (polynomial degree 2^33),
      the null control (a random lambda of the same degree; a linearized lambda,
      whose count is decided by Theorem 1), and what each outcome means. (ii)
      Solver cost: the chain system S^{(k)} = phi(S^{(k-1)}) of KN-LIT-0a321c
      Section 3.1 at an executable cell (n <= 41, m = 4, d = 3) measured per
      attempt against the resultant-model floor 2^{m(m-1)(1 + log2 d)}, on the
      ICPERF instrument (RQ-ICPERF-94c86e) if it fits, with a Weil-descent Semaev
      system of the same (n, m) as the nearby-object control. A proposal may cover
      one item or compose both; at least one proposal must address item (i).
    - >-
      GENERALISATIONS ARE WELCOME BUT PRICED. The rational-lambda, isogeny-L,
      double-large-prime and unbalanced variants named in KN-LIT-0a321c Section 5
      may be proposed only with the same cost-surface bookkeeping and a named
      reason the n = 131 constraints (Lemma 4.1 with 131 = -1 mod n', Theorem 1,
      the 2^131 - 1 factorisation) do or do not transfer.
    - >-
      OFF-LIMITS AS PRIMARY LENS: families F1-F7 of IDEA-20260802-002 except F2
      (this question IS a factor-base decomposition question); within F2 the
      Weil-descent Semaev/Nagao systems already owned by GOAL-SEMBIN-5078bc,
      GOAL-SEMBIN-fcb7a2 and GOAL-DREG-001 are not re-proposed here -- cite them as
      controls. Frobenius-orbit factor-base symmetry is RQ-FROB-7d8dd4's; use it as
      a component (the orbit column of the table), never as the idea.
    - >-
      PROOF SEARCH MAP before any compute (docs/inventor-protocol.md section 8):
      exact bottleneck, baseline embedding (the Theorem 3.2 row), observation
      collision, quantifier order, method ceiling with a nearby-object control
      (n = 127, where a Type 2 family exists, or n = 129).
    - >-
      HONEST ACCOUNTING. novelty_status: unverified unless checked against
      knowledge/ and ledger/proposals/; dominated_by checked against KN-LIT-096's
      rho row and the SEMBIN/ICPERF rows; sota_delta with exponents;
      target_complexity with time AND memory exponents; heuristic_assumptions
      each with a validation route; estimated_cost. A session that returns a
      closure instead of a candidate returns the section 4 closure standard
      (named obstruction as an `obstruction` block with resource_check) and is
      recorded as `unverified`.
    - >-
      CITATION PROVENANCE. Every reference carries provenance
      (recalled | retrieved | kb | internal). The two frozen papers are `retrieved`
      (read from inputs/); anything else recalled is marked `recalled` and
      supports nothing.
    - >-
      NO COMPUTE, NO STATUS CHANGE. Proposals only. Do not create hypotheses,
      experiments or decisions; do not edit any goal.yaml, question, knowledge
      entry or the analysis note. Do not run the census; design it.
    - >-
      Allocate each IDEA id with python3 tools/allocate_id.py --next idea --date
      20260916 and confirm with --check before writing. Write only under
      write_scope. Write a short producer report at
      coordination/investigations/QSP-ECC2K130/tasks/TASK-20260916-a93a2a/report.md
      listing the IDEA ids, the recommended first test, and any input you could
      not read.
