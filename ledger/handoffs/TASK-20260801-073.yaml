handoff:
  id: TASK-20260801-073
  from: coordinator
  to: red-team
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-026
  experiment_id: EXP-LPF-001
  hypothesis_id: H-LPF-001
  run_id: RUN-LPF-001-measure
  objective: >-
    Try to falsify the interpretation, the scope and the alternative-class declaration of
    the RUN-LPF-001-measure package. THE SINGLE MOST IMPORTANT QUESTION YOU ARE ASKED - is
    the comparison this experiment actually made the ABSOLUTE comparison HEUR-DS-1 is
    about, or did it collapse into a two-sample comparison against uniform integers
    somewhere along the way.
  uncertainty_reduced: >-
    What the measurement does NOT establish, and whether any deliverable is about to
    overclaim in either direction.
  inputs:
  - experiments/EXP-LPF-001/specification.yaml
  - experiments/EXP-LPF-001/reading_rule_v2.yaml
  - experiments/EXP-LPF-001/implementation/lpf001_driver.py
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-measure/
  - experiments/EXP-LPF-001/results/measure/
  - experiments/EXP-LPF-001/results/calib/
  - experiments/EXP-LPF-001/results/plantz/plant_z_tail_report.json
  - ledger/hypotheses/H-LPF-001.yaml
  - ledger/evidence/EV-EQD-001.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-026/reviews/TASK-20260801-068/
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/reviews/TASK-20260801-054/
  constraints:
  - 'INDEPENDENT SESSION. You did not author or execute any artifact under review.'
  - >-
    ATTACK ABS-REL-LPF-1 FIRST AND HARDEST, AND ATTACK IT WITH RTB-054-6 IN HAND. LIMB B is
    NOT a symmetric 8x test at these cells - the uniform arm sits at 4.571 of an 8.0
    ceiling at bits 16 u = 5 leaving about 1.75x of headroom, and the sole non-decidable
    rung is largely a definitional artifact of u being defined at D while samples live on
    [1, p**2]. Rule on whether any deliverable is about to read a LIMB B result as stronger
    than that asymmetry permits, and on whether the measured band absorbed the thing the
    claim is about.
  - >-
    AUDIT ALT-CLASS-LPF-1 ADVERSARIALLY AGAINST SOURCE AND MEASURED DATA. Name any class
    the deliverables are about to claim and the ladders did not reach, and any class in V1
    through V11 that turns out wider or narrower than declared. THE RESTATED V8 IS A
    SPECIFIC TARGET - is its measured near-disjointness claim recomputable from the
    archived plant-Z arrays, and is anyone reading it as the impossibility claim it
    replaced?
  - >-
    AUDIT THE PERTURBATION LADDERS POST HOC. Was any rung certified whose movement table
    row is within noise? THIS IS THE EXACT DEFECT THAT ENDED BATCH-025 (RTB-054-1) AND YOU
    SHOULD ASSUME IT CAN RECUR. Did any certifying statistic fail to move on any object,
    and was its non-firing then used as evidence?
  - >-
    READ THE RESULT IN BOTH DIRECTIONS. If the branch is L-2, attack the consistency
    reading and rule on whether anyone is about to call HEUR-DS-1 validated. If the branch
    is L-3, attack the departure reading equally hard - `weaken` needs its counterexample
    certificate independently checked, the DIRECTION must be stated and must be read from
    STAT-RATE-u and never from STAT-KS-DICK per OPEN-RR052-D, and `reject_scoped` is
    forbidden. If the branch is L-4, rule on whether anyone is about to read an
    inconclusive as a hint of departure - it is the single most likely non-L-2 null outcome
    at about 15 to 18 percent and carries no directional information whatever.
  - >-
    ATTACK THE SCALE TRANSFER EXPLICITLY. State whether anything in the package implies
    transfer from toy D to cryptographic D, and quantify how far the toy D of 2**32 and
    2**40 is from any parameter that matters.
  - >-
    RULE ON WHETHER THE RT049-B6 CONFOUND BITES THE RESULT - the factor base measured here
    IS the narrow small-x window, so state whether any departure found could be a property
    of the window rather than of the Semaev map.
  - 'STATE THE NARROWEST SUPPORTED STATEMENT, dominated_by (NEVER null) and a QUANTITATIVE sota_delta.'
  - Name the next required control and rank it.
  - >-
    Rule explicitly on whether the HEUR-DS-1 line was blurred anywhere, on whether anything
    is presented as a replication, and on whether OPEN-BATCH023-A is properly discharged or
    not by this package.
  - 'Recommend a disposition. You do not set status.'
  - 'MAKE NO COMMIT; TASK-20260801-074 archives this report.'
  - Record inference honestly (requested review-adversarial, independent session).
  deliverables:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-026/reviews/TASK-20260801-073/red_team_report.yaml
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-026/reviews/TASK-20260801-073/red_team_report.yaml
  archived_by: TASK-20260801-074
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 7200
    memory_gb: 8
    maximum_runs: 1
  completion_gate:
  - >-
    Blocking constraints listed; an adversarial verdict on ABS-REL-LPF-1 carrying the
    RTB-054-6 asymmetry and on ALT-CLASS-LPF-1 against source and data; a post-hoc audit of
    the perturbation ladders naming any rung certified without movement; the restated V8
    checked against the archived plant-Z arrays; the result attacked in whichever direction
    it points including the L-4 case; the scale-transfer question answered quantitatively;
    the RT049-B6 confound ruled on; the narrowest supported statement, non-null
    dominated_by and a quantitative sota_delta; the next required control named and ranked;
    explicit verdicts on the HEUR-DS-1 line, the replication question and the
    OPEN-BATCH023-A discharge; a recommended disposition.
