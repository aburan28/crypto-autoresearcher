  - >-
    Do not run anything. Do not touch the driver, the calibration package, any EXP-EQD-001 file
    or any ledger record.
  - 'MAKE NO COMMIT; TASK-20260801-039 archives.'
  - >-
    The file must parse as YAML; prose with a colon-space inside a block-sequence item must be a
    folded block scalar or quoted (CORR-20260801-002).
