  constraints:
  - Root Coordinator implements this correction directly. Own only eight new artifacts. Preserve every predecessor
    source, receipt, review and archive byte-identically; no task identifier remap. No scientific execution
    or hypothesis transition.
  - Base the new source package on all eight archived TASK-20260909-e5f500 files at f7c68d72d806b152c0fa1a8b8f943060baa69065,
    using review snapshot2f47553584863eb33c5163fed5893cd2e49e7848. Change only the five confirmed defect families,
    their necessary interface integration, current task/path provenance, checker and receipt discipline. Preserve
    the full previously approved operational protocol and all earlier17repairs. Do not reduce the implementation
    to mocks or relax capabilities, identities, controls or cleanup.
  - 'NF-01: Join the actual container report producer and host consumer across the complete payload, using
    crypto.autoresearch.group_oom_container_result.v2 as the one current wire schema. Check every field the
    host consumes against actual production serialization, including failure reports. Extract a pure serializer
    if useful, used by actual container production code. The positive integration test must feed actual producer
    output to actual host parsing through injected host commands; no hand-written substitute with the desired
    schema. Wrong schema, malformed/missing consumed fields and false completion must fail closed.'
  - 'NF-02: Cleanup must disable only helper-enabled memory delegation before migrating the supervisor into
    the non-root parent, then remove the owned supervisor subgroup. Preserve owned worker/helper termination/reap,
    primary error and cleanup observations. Exercise cgroup-v2 no-internal-process semantics through an injected
    stateful control that refuses the old ordering; verify exact safe order and all failure paths. No real
    cgroup operation.'
  - 'NF-03: Carry the generated nonce through full create-to-inspect validation. Require the exact expected
    task label, nonce label, full containerID and intended identity before payload copy/start and ownership-dependent
    cleanup. Correct, missing and mismatched nonce controls are required. A mismatched identity never licenses
    mutation of an unverified foreign container. Do not add privileges or broad-name cleanup.'
  - 'NF-04: Read back the supervisor subgroup membership after migration and before delegation or worker release,
    and preserve explicit membership evidence at the final appropriate pre-cleanup boundary. Require the expected
    own PID and reject empty/misdirected/foreign membership. Parent emptiness or process liveness alone is
    insufficient. Keep existing worker/auxiliary membership acknowledgement and baseline-to-final counter requirements.'
  - 'NF-05: Descriptor-relative child enumeration must propagate or explicitly fail closed on stat OSError,
    preserving the affected path/error. It must not convert an uninspectable child into absence. Test PermissionError,
    disappearing entries and another OSError while preserving valid enumeration and descriptor cleanup. Never
    inspect or mutate live cgroup paths.'
  - Keep the cap-drop ALL plus SETUID/SETGID-only profile. No CAP_KILL addition. If inner signalling cannot
    complete under that profile, retain failed classification and exact verified outer-container containment;
    do not report successful inner cleanup. Keep all frozen memory/swap/group configurations, counter-delta
    classifications, readiness ordering, bounded polling and outer-supervisor survival requirements.
  - 'No Docker CLI/API, container creation/start, live mount/cgroup read/write, privilege change, migration
    or pressure body execution. Inject those observations. Bounded benign POSIX pipe/fork/barrier/drain/wait/reap
    fixtures remain allowed: at most32totalstarts across all attempts, at most2concurrent,3second lifetime,1MiBdeliberate
    payload per fixture; retain every PID,terminal/reap outcome and descriptor disposition.'
  - At most512total fixed synthetic unit/control cases including failures and reruns. Each complete suite <=128cases;
    reserve one complete final suite. Preserve the intended coverage of the prior81cases and add the five defect-family
    controls, documenting any expectation changed because it encoded an old bug.10seconds/case,1800aggregate
    executed-check wall/CPU,one worker,2GiBmachine protection. Sample owned-process RSS with a parent watchdog;
    no RLIMIT_AS attempt on macOS and no hard-kernel-limit claim. Retain raw sample basis separately from post-exit
    unavailability.
  - Before every invocation reserve a unique temporary attempt directory and exact checker/source bytes. Preserve
    full outer tool response/session/polls/terminal exit and nested command,UTC,stdout,stderr,allcases and
    actual resources. Never use canonical check-receipt.json as an attempt sink. Create canonical receipt once
    after all intended attempts terminate. No overwritten failures, guessed outer exit, reconstructed prior
    custody or accounting restart.
  - Current protocol-binding/report metadata must explicitly distinguish current task/source, original specification,
    prior failed producer and historical review. Use one unambiguous current-source map. Bind the real tested
    source hashes, actual authority/claim and completed receipts without self-hash cycles; implementation_commit:null
    until actual Coordinator snapshot. Unknown resolved model stays null/unverified.
  - Prior251cases and15childstarts remain summary-only and prior producer remains failed. This correction does
    not retrovalidate them. Return eight exact hashes and full limitations. Archive then obtain fresh independent
    complete source review before any live operational handoff.
