handoff:
  id: TASK-20260803-f95b4e
  from: coordinator
  to: executor
  objective: Run the two discriminating checks DEC-20260802-359eca names, both zero-new-sampling. (A)
    EXPONENT-NEIGHBOURHOOD CONTROL. For EACH archived file (q=241/m=40/n=43 and n=50), scan the Approximation-4.9
    exponent p over a neighbourhood of that file's fitted value and report, per file, whether the file's
    OWN exponent minimises rms against its OWN data or whether a neighbour wins. TASK-20260803-bc8c1f
    found a neighbour winning for n=43 (p=24.5 gives rms 0.4965 against its own p=26 at 0.7055); one instance
    is not a result, so report the full curve of rms against p for both files with the argmin located
    explicitly. (B) JENSEN BIAS BOUND. Approximation (4.22) places the d_lsc integral INSIDE min(1,.),
    while the archived script computes min(1, Kbar*L^p). min(1,.) is concave, so the collapse is an upper
    bound. Evaluate the integral in its correct position at the two headline peak scores (471 for n=43,
    420 for n=50) and report the magnitude and sign of the difference, so the reported over-prediction
    (+1.5154 and +1.7109 bits) can be attributed, or not attributed, to Approximation 4.9 rather than
    to the implementation shortcut.
  uncertainty_reduced: Whether Approximation 4.9 is the model the archived data SELECT, or merely a member
    of a family that fits. BATCH-009 established shape compatibility with a fitted normalisation; it could
    not distinguish the approximation from its neighbours, and its headline residual is confounded by
    a bias of the same sign.
  inputs:
  - coordination/goals/GOAL-MLKEM-003/batches/BATCH-009/tasks/TASK-20260802-8bae8e/ (producer package,
    approx49_comparison.py and results)
  - coordination/goals/GOAL-MLKEM-003/batches/BATCH-009/tasks/TASK-20260803-bc8c1f/validation_report.yaml
    (defects D3/D4/D5 and the nearby-object control)
  - ledger/evidence/EV-MLKEM-019.yaml and ledger/decisions/DEC-20260802-359eca.yaml
  - experiments/EXP-MLKEM-011/vendor-lock/data/ archived Pwrong/Pgood outputs
  - inputs/MLKEM-DUAL-SOURCES-20260802/extracts/ archived Carrier text
  constraints:
  - Never fabricate a command, output, timing, statistic, citation, or run (AGENTS.md rule 9).
  - ZERO NEW SAMPLING. Use only the archived .out files already in experiments/EXP-MLKEM-011/vendor-lock/data/
    and the archived Carrier text extracts. No network, no G6K, no new simulation.
  - 'Stay inside the resolved band: scores 0..1802 for q=241/m=40/n=43, bounded below by the counting
    floor 1/(4000*241^3) = 2^-35.70445229. Never fit, anchor or extrapolate past it.'
  - Raw undivided score scale. The k_fft=3 asymmetry (KN-FIND-014) would shift every point silently if
    mishandled.
  - Toy tier. No ML-KEM security claim in either direction.
  - 'AGENTS.md rule 12 is UNMET and UNWAIVED: EV-MLKEM-011, EV-MLKEM-013 and EV-MLKEM-017 keep their status.
    Write nothing that changes them.'
  - Write only inside your declared write_scope. Do not git commit.
  - Reuse the archived comparison code where it is correct; do not silently re-derive it differently without
    saying so. Where you depart from it, state the departure and why.
  - (B) is a BIAS BOUND, not a re-fit. Do not re-optimise K to make the corrected model look better; hold
    the comparison's own K fixed and report the difference the correct integral position makes.
  - Report the argmin of rms over p for BOTH files even if it is the file's own exponent. A control that
    comes back favourable is still the control's result.
  deliverables:
  - 'exponent_neighbourhood_scan.py and jensen_bias_bound.py: the exact scripts run'
  - 'results.json: rms-vs-p curves with argmin per file, and the Jensen difference at each peak score
    with sign'
  - 'report.md: what was computed, what it shows, and every departure from the BATCH-009 implementation'
  artifact_paths:
  - coordination/goals/GOAL-MLKEM-003/batches/BATCH-010/tasks/TASK-20260803-f95b4e/exponent_neighbourhood_scan.py
  - coordination/goals/GOAL-MLKEM-003/batches/BATCH-010/tasks/TASK-20260803-f95b4e/jensen_bias_bound.py
  - coordination/goals/GOAL-MLKEM-003/batches/BATCH-010/tasks/TASK-20260803-f95b4e/results.json
  - coordination/goals/GOAL-MLKEM-003/batches/BATCH-010/tasks/TASK-20260803-f95b4e/report.md
  archived_by: TASK-20260803-408684
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 3000
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
  - rms-vs-p reported for both files with argmin located
  - Jensen difference reported at both peak scores with sign and magnitude
  - no new sampling and no extrapolation past the counting floor
