  constraints:
    - >-
      C-1: Obey the frozen specification exactly. Never retune
      preregistered_prediction, HEUR-GFPN-DFLAT4 or HEUR-GFPN-RATE4 after any
      run; amendments only under experiments/EXP-GFPN-659e34/amendments/.
    - >-
      C-2: SIMULATED ORACLE ONLY. d is generator-known and held by the oracle
      harness; the solver code path never receives d and never computes the
      DLP of any challenge. No real key, signature, protocol or live system
      is queried. Record the code/process separation in the manifest.
    - >-
      C-3: Every oracle answer Q = [d]P and every SDHP answer Y is verified by
      PARI/GP or Sage scalar multiplication sharing no code with the solver;
      every accepted decomposition lifts to four signed factor-base points
      summing to X_r and carries a certificate.
    - >-
      C-4: Query accounting: the model count is |F| (learning phase over all
      of F, JV section 5); the lazily-issued count is reported separately
      and never substituted.
    - >-
      C-5: Timeouts, OOM and attempt-cap hits are not_measured / censored,
      never evidence that D_4 is large or the rate is low.
    - >-
      C-6: Transfer to p = 2^64 is arithmetic-only under the two heuristics;
      never extrapolate wall time; label measured vs modeled; emit null with
      reason heur_failed where a heuristic fails.
    - >-
      C-7: Pass the jv_system_shape_anchor (5 equations, degree 8, 4
      variables; reduced degrevlex GB <= 329 generators at the smallest cost
      prime) before scoring any cell.
    - >-
      C-8: Reuse the committed EXP-GFPN-05ff43 m = 4 driver where it exists;
      do not modify any EXP-GFPN-05ff43 artifact; build what is missing under
      this contract's implementation/.
    - >-
      C-9: Public parameters only. Amazon Bedrock prohibited.
    - >-
      C-10: Observations only -- do not conclude either heuristic supported
      or refuted in the executor report; record comparison statistics,
      heur_dflat4_pass and heur_rate4_pass.

