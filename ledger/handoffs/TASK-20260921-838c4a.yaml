  objective: >-
    Under the APPROVED frozen contract
    experiments/EXP-GFPN-659e34/specification.yaml (DEC-20260921-b5c2da;
    standing user authorization 2026-09-06): (1) implement the simulated-
    oracle Joux-Vitse SDHP pipeline at n = 5, m = 4 -- factor base F,
    lazy oracle harness holding the generator-known d, modified descent
    X_r = [r]X, symmetrized 4-variable descended system for arms (i) raw,
    (ii) S_4, (iii) 2-torsion + S_4, Groebner/FGLM solve, root extraction and
    signed lifting, answer Y = [r^{-1}] sum eps_i Q_i -- reusing the
    committed m = 4 driver of experiments/EXP-GFPN-05ff43/implementation/
    where it exists and building the rest under this contract; (2) pass the
    jv_system_shape_anchor, simulated_oracle_verified, no_secret_leakage and
    degenerate_symmetrization_identity controls; (3) select and record the
    cost-ladder primes (>= 3, >= 12-bit span) and the rate-ladder primes
    (near 2^10, 2^11, 2^12); (4) measure |F|, D_4 and F_{p'} ops per attempt
    on the cost ladder; (5) run the rate ladder end to end (6 challenges per
    cell, attempt cap 8 x 24 p') with independent verification of every
    oracle answer and SDHP answer; (6) decide heur_dflat4_pass and
    heur_rate4_pass; (7) emit sdhp-projection-p64.yaml with measured vs
    modeled labels, the rho ruler row, and the (n-1) full-DLP attempts lower
    bound. Do not edit the approved specification, its
    preregistered_prediction or either heuristic.

  uncertainty_reduced: >-
    The oracle-assisted SDHP (queries, work) pair per curve at p = 2^64
    (RQ-GFPN-c01af8 decision target (c); goal criterion C2), and the
    measured m = 4 decomposition rate that closes IDEA-20260920-9e672a's
    bookkeeping (C5).

