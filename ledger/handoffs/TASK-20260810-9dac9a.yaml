  recorded_at: '2026-08-10'
  goal_id: GOAL-DREG-001
  question_id: RQ-DREG-001
  batch_id: BATCH-005
  role: coordinator
  from: coordinator
  to: coordinator
  kind: ledger_archive

  objective: >-
    Commit the GOAL-DREG-001 BATCH-005 closing Coordinator decision
    DEC-20260810-da7513 and this handoff record, alone, as an isolated
    Coordinator-only ledger archive, and publish them on a branch carrying an
    open PR against main -- so that BATCH-005 finally has a durable, reachable
    closing decision after the one its own archive declared was lost to an
    identifier collision.

  uncertainty_reduced: >-
    Whether GOAL-DREG-001's BATCH-005 closure exists as durable, published,
    verifier-accepted state, or continues to exist only as evidence with a
    dangling decision reference that resolves to another campaign's record.

  inputs:
    - ledger/decisions/DEC-20260810-da7513.yaml (the record this archive commits)
    - ledger/evidence/EV-DREG-008.yaml (committed; NOT staged by this task)
    - >-
      coordination/goals/GOAL-DREG-001/batches/BATCH-005/tasks/TASK-20260731-026/red_team_report.yaml
      (RT-20260731-013, verdict PASS; committed; NOT staged by this task)
    - >-
      coordination/goals/GOAL-DREG-001/batches/BATCH-005/archives/TASK-20260731-027/ledger-receipt.json
      (the unverifiable receipt this archive supersedes BY REFERENCE; NOT staged
      and NOT edited)
    - ledger/corrections/CORR-20260731-005.yaml (the ID-remap that caused the collision)
    - ledger/decisions/DEC-20260725-026.yaml (the BATCH-004 decision that opened BATCH-005)
    - ledger/goals/GOAL-DREG-001.yaml (read for its next_action directive; NOT staged, NOT edited)

  constraints:
    - >-
      SC-1 SUPERSESSION BY REFERENCE ONLY. This archive supersedes the
      unverifiable TASK-20260731-027 ledger receipt by reference -- the
      superseding statement lives inside DEC-20260810-da7513 -- and EDITS
      NEITHER coordination/goals/GOAL-DREG-001/batches/BATCH-005/archives/TASK-20260731-027/ledger-receipt.json
      NOR ledger/decisions/DEC-20260731-014.yaml. Both files must be byte-identical
      after this commit to what they were before it.
    - >-
      SC-2 NO IDENTIFIER REMAP IS PROPOSED OR PERFORMED. AGENTS.md rule 15:
      DEC-20260731-014 is named in a completed archive's binding fields, so it is
      superseded, never renamed. Renaming anything here is a contract violation.
    - >-
      SC-3 RUN ALONE. This is an isolated Coordinator archival task. No producer,
      reviewer, or other archival task runs concurrently in this worktree.
    - >-
      SC-4 COMMIT A STAGES EXACTLY THE TWO DECLARED artifact_paths AND NOTHING
      ELSE. In particular do NOT stage ledger/goals/GOAL-DREG-001.yaml in commit
      A or in commit B -- its BATCH-004/BATCH-005 checkpoint entries and its
      latest_verified_commit advance are a SEPARATE, LATER act
      (DEC-20260810-da7513 NA-2), deliberately ordered after this archive
      verifies, because verification precedes the checkpoint. THE ONE PERMITTED
      EXCEPTION, AND IT IS NOT IN COMMIT A: this task runs as TWO commits, and
      commit B stages EXACTLY ONE further path -- the post-commit receipt at
      coordination/goals/GOAL-DREG-001/batches/BATCH-005/archives/TASK-20260810-9dac9a/ledger-receipt.json
      (see archive.receipt_path and archive.note). Nothing else may be staged in
      either commit.
    - >-
      SC-5 MERGE, NEVER REBASE. Fetch origin/main and merge it into
      coord/harness-hourly-20260810-1010 before committing (branch forked from
      origin/main at 7df1972a4). Rebasing a branch carrying pushed evidence is
      forbidden. If a sync conflicts inside an immutable record, STOP -- the
      resolution is a new superseding record under a new id, never an edit that
      picks a side.
    - >-
      SC-6 FABRICATE NOTHING. No invented commit SHA, digest, timing, model
      identifier, review verdict, or attestation. A field not yet knowable stays
      null and is named as such. In particular the archive block's commit_sha,
      parent_sha and path_sha256 CANNOT be filled inside the commit that creates
      them (a commit's own SHA must not appear in an artifact within that
      commit); they stay null BY FACT.
    - >-
      SC-7 CHANGE NO SCIENTIFIC STATUS. H-DREG-001 stays `inconclusive`,
      H-SIG-001 is untouched, GOAL-DREG-001 stays `active`, no experiment is
      approved, no run is authorized, no knowledge entry is promoted, and no
      attestation is recorded -- none was obtained and the goal is not closing.
    - >-
      SC-8 CLAIM CEILING. Nothing committed by this task asserts anything beyond
      DEC-20260810-da7513's own claim_boundary: single cell n=12, t=3, ti=0,
      seed=2026, D=6; strength preliminary; claim_tier toy; is_d_reg_theorem
      false; is_crypto_scale false; raw 17947 headline stays
      quarantined_confounded.
    - >-
      SC-9 Re-run tools/validate_ledger.py on the merged tree before committing
      and record the outcome. A new validation error introduced by the merge is a
      STOP, not something to commit through.
    - >-
      SC-10 Push the branch and open or refresh a PR against main naming
      DEC-20260810-da7513 and TASK-20260810-9dac9a. A record that exists only in
      a local commit is unpublished and is not durable evidence.
    - >-
      SC-11 Never select, configure, probe, contact, or use Amazon Bedrock
      (AGENTS.md rule 16).
    - >-
      SC-12 Halt at the declared wall_clock_seconds and report the halt truthfully
      as infrastructure signal, naming the dropped work as scope rather than as a
      result.

  deliverables:
    - >-
      One isolated ledger commit containing exactly
      ledger/decisions/DEC-20260810-da7513.yaml and
      ledger/handoffs/TASK-20260810-9dac9a.yaml, whose message names
      GOAL-DREG-001, BATCH-005, DEC-20260810-da7513 and TASK-20260810-9dac9a.
    - >-
      A truthful report of the observed commit and parent SHAs, the origin/main
      base commit fetched, the merge outcome, the tools/validate_ledger.py result
      on the merged tree, and the PR reference.
    - >-
      A truthful statement that
      coordination/goals/GOAL-DREG-001/batches/BATCH-005/archives/TASK-20260731-027/ledger-receipt.json
      and ledger/decisions/DEC-20260731-014.yaml were NOT modified by this commit.
    - >-
      A truthful statement of ledger/goals/GOAL-DREG-001.yaml's checkpoints and
      latest_verified_commit values at commit time (expected: checkpoints hold
      BATCH-001..BATCH-003 only, latest_verified_commit bedd64c), recorded so
      that the later NA-2 act starts from an observed baseline rather than an
      assumed one.
    - >-
      THE VERIFIER-CHECKABLE POST-COMMIT RECEIPT, written in commit B at
      coordination/goals/GOAL-DREG-001/batches/BATCH-005/archives/TASK-20260810-9dac9a/ledger-receipt.json.
      It carries kind `ledger`, task_id TASK-20260810-9dac9a, record_ids
      [DEC-20260810-da7513, TASK-20260810-9dac9a], commit A's OBSERVED commit_sha
      and parent_sha, and a path_sha256 map giving the OBSERVED sha256 of
      ledger/decisions/DEC-20260810-da7513.yaml and
      ledger/handoffs/TASK-20260810-9dac9a.yaml AS COMMITTED IN A, plus the
      origin/main base commit checked and the merge outcome. Every value is read
      off commit A after it exists; none is self-referential and none is
      predicted. WITHOUT THIS ARTIFACT THE ARCHIVE CANNOT BE ACCEPTED BY THE
      POST-COMMIT VERIFIER, and this is the exact defect that stranded
      TASK-20260731-027.

  artifact_paths:
    - ledger/decisions/DEC-20260810-da7513.yaml
    - ledger/handoffs/TASK-20260810-9dac9a.yaml

  archived_by: TASK-20260810-9dac9a

  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false

  budget:
    wall_clock_seconds: 600
    memory_gb: 2
    maximum_runs: 1

  completion_gate:
    - >-
      The commit is reachable from HEAD, has the expected parent, and changes
      EXACTLY the two declared paths -- no more, no fewer.
    - >-
      coordination/goals/GOAL-DREG-001/batches/BATCH-005/archives/TASK-20260731-027/ledger-receipt.json
      and ledger/decisions/DEC-20260731-014.yaml are unchanged by the commit.
    - >-
      ledger/goals/GOAL-DREG-001.yaml is unchanged by the commit, and its
      observed checkpoints and latest_verified_commit values are reported.
    - >-
      tools/validate_ledger.py introduces no new error on the merged tree, and
      ledger/decisions/DEC-20260810-da7513.yaml parses under yaml.safe_load with
      required coordinator_decision fields present (id, decision, target_ids,
      knowledge_promotion, decided_by).
    - >-
      The branch is pushed and a PR against main names DEC-20260810-da7513 and
      TASK-20260810-9dac9a.
    - >-
      The receipt records the origin/main base commit checked and the merge
      outcome.
    - >-
      No hypothesis, experiment, question, or goal status changed, and no
      attestation was recorded.
    - >-
      THE POST-COMMIT RECEIPT EXISTS AND IS INDEPENDENTLY RE-CHECKABLE.
      coordination/goals/GOAL-DREG-001/batches/BATCH-005/archives/TASK-20260810-9dac9a/ledger-receipt.json
      is committed in commit B; it carries commit A's observed commit_sha and
      parent_sha and a path_sha256 entry for each of the two artifact_paths; and
      re-hashing those two paths at commit A reproduces the recorded digests
      exactly. Receipts bind to CONTENT first (CLAUDE.md, "Archive receipts bind
      to CONTENT first"), so a content mismatch is fatal while commit
      reachability is advisory -- the receipt therefore stays checkable even if
      main's merge strategy later makes the recorded SHA unreachable. This gate
      is NOT satisfied by the `archive` block of this handoff, whose commit_sha
      and path_sha256 are null and empty by fact.

  return_format: >-
    A short report naming the observed commit SHA and parent, the exact staged
    path set, the origin/main base commit fetched and the merge outcome, the
    validate_ledger.py result, the PR reference, the confirmation that the
    TASK-20260731-027 receipt and DEC-20260731-014 are untouched, and the
    observed checkpoints / latest_verified_commit values of
    ledger/goals/GOAL-DREG-001.yaml at commit time.

  archive:
    kind: ledger
    source_task_ids:
      - TASK-20260731-016
      - TASK-20260731-026
    commit_sha: null
    parent_sha: null
    path_sha256: {}
    record_ids:
      - DEC-20260810-da7513
      - TASK-20260810-9dac9a
    supersedes_by_reference:
      - >-
        coordination/goals/GOAL-DREG-001/batches/BATCH-005/archives/TASK-20260731-027/ledger-receipt.json
        (kind ledger, commit_sha null, verification status pending_post_commit;
        its declared BATCH-005 decision reference DEC-20260731-014 is superseded
        by DEC-20260810-da7513 and the receipt itself is NOT edited)
    receipt_path: coordination/goals/GOAL-DREG-001/batches/BATCH-005/archives/TASK-20260810-9dac9a/ledger-receipt.json
    receipt_path_note: >-
      DECLARED AS A POST-COMMIT ARTIFACT, DELIBERATELY NOT IN artifact_paths.
      artifact_paths pins what COMMIT A stages, and this receipt does not exist
      when commit A is made; it is written and staged in COMMIT B. Adding it to
      artifact_paths would make commit A's declared path set unsatisfiable, which
      is the mirror image of the defect this task exists to repair.
    note: >-
      THIS TASK RUNS AS TWO COMMITS, AND THAT IS WHAT MAKES IT VERIFIABLE.

      COMMIT A stages exactly the two artifact_paths -- the decision and this
      handoff -- and nothing else. commit_sha, parent_sha and path_sha256 stay
      null and empty IN THIS COMMITTED FILE, BY FACT rather than by omission: a
      commit's own SHA may not appear in an artifact inside that same commit
      (templates/research-records.md, "Coordinator archive receipt"), and this
      record is immutable once archived, so the values can never be backfilled
      here.

      COMMIT B, made afterwards, stages exactly one further path -- the
      post-commit receipt named in receipt_path above -- recording commit A's
      OBSERVED commit_sha, its OBSERVED parent_sha, and the OBSERVED sha256 of
      each of the two artifact_paths AS COMMITTED IN A, together with the
      origin/main base commit checked and the merge outcome. Every value is read
      off commit A after it exists, so nothing is fabricated and nothing is
      self-referential.

      THAT RECEIPT, NOT THIS `archive` BLOCK, IS THIS TASK'S VERIFIER-CHECKABLE
      RECEIPT. The dispatcher's GitRepositoryVerifier reads commit_sha and
      path_sha256; with both empty here there would be nothing for it to check
      and acceptance would be structurally unreachable -- precisely the defect
      that stranded TASK-20260731-027, whose repair is the whole reason
      DEC-20260810-da7513 exists. Per CLAUDE.md ("Archive receipts bind to
      CONTENT first"), path_sha256 is authoritative and commit reachability is
      advisory, so the commit-B receipt remains valid even if main's merge
      strategy later rewrites or orphans commit A's SHA; a content mismatch
      stays fatal.

      GOAL-DREG-001 and BATCH-005 are named in the commit message as context;
      NO goal record is staged or edited by either commit.
