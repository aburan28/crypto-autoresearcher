        - the commit changes exactly the declared paths
        - every path_sha256 verifies against the tree
        - the check_review_independence.py output is recorded in the receipt
        - commit message names TASK-20261004-5c21da, TASK-20261004-7d2fb6 and TASK-20261004-095926 and claims nothing about any verdict
