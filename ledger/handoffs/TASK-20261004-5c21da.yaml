        - >-
          SYNC. Merge origin/main first (merge, never rebase); record the base commit and merge outcome.
        - >-
          INDEPENDENCE CHECK. Run python3 tools/check_review_independence.py --plan coordination/goals/GOAL-SEMBIN-5078bc/review-plans/REVIEW-SEMBIN-20261004-a47503.yaml
          --reports coordination/goals/GOAL-SEMBIN-5078bc/reviews/TASK-20261004-7d2fb6 coordination/goals/GOAL-SEMBIN-5078bc/reviews/TASK-20261004-095926 and record its full output
          in the receipt. A failure is reported to the Coordinator, not fixed by editing a report, and does not stop the commit (the reports are archived as written either way; the failure
          is a finding about the round).
        - >-
          HASH CHECK. For each reviewer, compare the sha256 values the report lists for its other files with the tree; record every mismatch. Record sha256 of every staged file.
        - >-
          NO COMPOSITION. No evidence record, no decision and no status. The Coordinator composes after this receipt verifies.
        - >-
          OUTCOME HYGIENE. The commit message and PR text name the IDs and say "review reports snapshot, uncomposed". They state no joint verdict and no value of the quantity.
        - No edit to any existing file. Never select Bedrock.
      completion_gate:
