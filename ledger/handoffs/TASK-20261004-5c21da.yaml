    evidence record and no status is written by this card.
  uncertainty_reduced: >-
    Whether the plan, the prior and the cards were fixed before any reviewer ran (act A), and whether the Coordinator and
    every later reader see the same fixed bytes of the reports (act B). No scientific uncertainty is reduced.

