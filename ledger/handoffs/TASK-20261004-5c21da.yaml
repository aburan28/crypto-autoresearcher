        - coordination/goals/GOAL-SEMBIN-5078bc/reviews/TASK-20261004-095926/
        - coordination/goals/GOAL-SEMBIN-5078bc/archives/TASK-20261004-5c21da/reports-snapshot-receipt.yaml
      receipt: coordination/goals/GOAL-SEMBIN-5078bc/archives/TASK-20261004-5c21da/reports-snapshot-receipt.yaml
      record_ids: [TASK-20261004-5c21da]
      precondition: >-
        TASK-20261004-7d2fb6 and TASK-20261004-095926 have both returned terminal receipts and their declared directories exist and are non-empty. A missing report returns to its
        reviewer with concrete defects; it is not archived partially and not filled in by the Coordinator.
      constraints:
        - >-
          RUNS ALONE. Stage only the declared commit paths. Reports are archived EXACTLY as written, with every script and output file in the reviewers' directories. A file a
          report lists that is absent is reported, not recreated. If the blind lane ran in a sandbox, its out/ directory is copied into the write_scope unchanged BEFORE this act, and the
