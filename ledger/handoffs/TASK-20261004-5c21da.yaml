  acts:
    ACT-A:
      name: FREEZE (snapshot, before dispatch)
      commit_paths:
        - ledger/decisions/DEC-20261004-a47503.yaml
        - ledger/handoffs/TASK-20261004-7d2fb6.yaml
        - ledger/handoffs/TASK-20261004-095926.yaml
        - ledger/handoffs/TASK-20261004-5c21da.yaml
        - coordination/goals/GOAL-SEMBIN-5078bc/review-plans/REVIEW-SEMBIN-20261004-a47503.yaml
        - ledger/goals/GOAL-SEMBIN-5078bc/checkpoints/BATCH-9d649f-DEC-20261004-a47503.yaml
        - coordination/goals/GOAL-SEMBIN-5078bc/archives/TASK-20261004-5c21da/snapshot-receipt.yaml
      receipt: coordination/goals/GOAL-SEMBIN-5078bc/archives/TASK-20261004-5c21da/snapshot-receipt.yaml
      record_ids: [DEC-20261004-a47503, TASK-20261004-7d2fb6, TASK-20261004-095926, TASK-20261004-5c21da]
      precondition: TASK-20261004-208b23 receipt exists, is committed, verifies by path_sha256 and is pushed.
      constraints:
        - >-
          RUNS ALONE. Stage only the declared commit paths. Never git add -A. Do not stage anything under either run
