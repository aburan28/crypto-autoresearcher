# =============================================================================
# TASK-20261004-5c21da -- COORDINATOR ARCHIVE CARD of review round
# REVIEW-SEMBIN-20261004-a47503. TWO sequential snapshot acts under one card:
#   ACT A (before any reviewer runs): the FREEZE. Commits DEC-20261004-a47503, the
#         two reviewer cards, this card, the review plan, the goal checkpoint shard
#         and receipt A. Owns the records.
#   ACT B (after both reviewers return): the REPORTS. Commits exactly the two
#         reviewer directories and receipt B, and runs the independence check. Owns
#         the reports (the reviewer cards' archived_by).
# RUNS ALONE, EACH ACT SEPARATELY. WRITTEN, NOT DISPATCHED.
#
# WHY ONE CARD FOR TWO ACTS (PD-1 of DEC-20261004-a47503). Only one spare task id was
# minted for this round. The cards of the two reviewers must name an archival task
# before they are dispatched (AGENTS.md standing precondition 1), and the freeze must
# itself be owned. Every artifact is therefore assigned to exactly one archival task
# (this one), each act is its own isolated commit with its own receipt file, and
# neither act touches the other's paths. If a separate id for act B is preferred, it
# must be minted and the two reviewer cards regenerated BEFORE act A commits; after that
# no card may be edited.
# =============================================================================
handoff:
  id: TASK-20261004-5c21da
  from: coordinator
  to: coordinator
  kind: review_round_freeze_and_report_snapshot_archive
  goal_id: GOAL-SEMBIN-5078bc
  batch_id: BATCH-9d649f
