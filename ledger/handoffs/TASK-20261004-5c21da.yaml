        - >-
          SYNC. git fetch origin; merge origin/main into claude/ecdlp-index-calculus-grobner-xwr62t (merge, never rebase).
          Record the base commit checked and the merge outcome. A conflict inside any ledger record or run file STOPS the act and is
          resolved only by a new superseding record.
        - >-
          ORDER. Do not start until TASK-20261004-208b23's receipt verifies (its commit reachable from HEAD with the expected parent;
          path_sha256 of the declared files verifies; its checks passed or stopped). Record that check.
        - >-
          IDENTIFIERS. For DEC-20261004-a47503, TASK-20261004-7d2fb6, TASK-20261004-095926 and TASK-20261004-5c21da run
          python3 tools/allocate_id.py --check <ID> and git grep -l <token> HEAD on the merged tree. Expected hits are only the files this act commits, the
          sibling reviewer cards (which cite each other), the plan file and, for a47503, the plan id REVIEW-SEMBIN-20261004-a47503 (shares the token by design). Any other
          hit stops the act and returns the id to the Coordinator. Nothing is renamed here. A substring of a hash is not a collision.
        - >-
          PLAN INTEGRITY, MECHANICAL. python3 tools/validate_ledger.py before and after staging: zero NEW errors naming a staged path. Both reviewer cards carry
          review_plan as a path, so the validator loads the plan file for each; every requirement of check_review_plan must hold. Also run
          the plan's own consistency check through the tool's library function, because the command line exits 2 with "no review_attestation blocks found" when no report exists:
          python3 -c "import sys; sys.path.insert(0, 'tools'); import check_review_independence as c; p = c._plan_of(c._load('coordination/goals/GOAL-SEMBIN-5078bc/review-plans/REVIEW-SEMBIN-20261004-a47503.yaml')); print('\n'.join(c.check(p, [])))"
          and record its output. Before any report exists it MUST consist ONLY of lines of the form "joint '<full joint text, W1 to W10>' is assigned to TASK-20261004-..., which filed no
          review_attestation" (ten joints, three assigned to TASK-20261004-095926 and seven to TASK-20261004-7d2fb6) and one line "blind_rederivation is assigned to TASK-20261004-095926, which
          filed no review_attestation". Any other line (an unowned joint, a missing
          attack_plan, an empty proves_too_much, an empty blind_from, an empty prior, a duplicate owner) means the plan is defective: STOP and return to the Coordinator.
        - >-
          BYTE-FIXITY OF THE BLIND INPUTS. For each of the twelve .ms files named in the plan's blind_rederivation.parameters, compute sha256 of the working-tree
          file and compare it with the path_sha256 recorded for the same path in coordination/goals/GOAL-SEMBIN-5078bc/archives/TASK-20261004-342564/snapshot-receipt.yaml.
          Record the twelve pairs. A mismatch stops the act.
        - >-
          LANES AND CLAIMS. Run python3 tools/goal_lanes.py lanes GOAL-SEMBIN-5078bc and record the listing. The two reviewer tasks are not in any dispatch queue, so
          tools/goal_lanes.py claim (which requires a queue and a queued task) cannot be used for them: record "claim not possible: task not in any dispatch queue" and the reason,
          as TASK-20261004-342564 did, and do not edit the queue. goal max_concurrent is 2.
        - >-
          OUTCOME HYGIENE. The commit message and the PR text name the IDs and say "review plan freeze and reviewer cards, no reviewer has run". They state no measured
          value and no verdict label of either run and do not restate the plan's prior.
        - No edit to any existing file. Never select Bedrock.
