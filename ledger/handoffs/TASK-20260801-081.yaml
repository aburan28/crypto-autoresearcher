handoff:
  id: TASK-20260801-081
  from: coordinator
  to: validator
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-027
  experiment_id: EXP-LPF-001
  hypothesis_id: H-LPF-001
  run_id: RUN-LPF-001-measure
  objective: >-
    Verify run validity BEFORE anyone interprets it. Expected arm counts,
    schema-complete manifest, seed and stream integrity, driver-hash equality
    across the calibration and measurement boundary, raw versus summary agreement,
    control comparability, threshold traceability, the movement-at-every-rung
    discipline, and above all THE FACTORIZATIONS THEMSELVES.
  uncertainty_reduced: Whether the measurement is admissible as evidence at all.
  inputs:
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-measure/
  - experiments/EXP-LPF-001/results/measure/
  - experiments/EXP-LPF-001/results/calib/
  - experiments/EXP-LPF-001/specification.yaml
  - experiments/EXP-LPF-001/reading_rule_v2.yaml
  - experiments/EXP-LPF-001/implementation/lpf001_driver.py
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/archives/TASK-20260801-050/snapshot_commit_receipt.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-027/archives/TASK-20260801-080/snapshot_commit_receipt.json
  constraints:
  - >-
    INDEPENDENT SESSION. You did not author or execute any artifact under review,
    and you did not serve TASK-20260801-077.
  - >-
    RECOMPUTE, DO NOT READ. Regenerate the report from the archived raw arrays with
    your own code and compare at TOLERANCE ZERO. Reimplement at least one
    certifying statistic reusing NONE of the driver's code.
  - >-
    PRIORITY DUTY - INDEPENDENTLY REFACTOR at least 5000 uniformly random real-arm
    samples per cell by a factorization path that reuses none of the driver's code,
    and compare the largest prime factor. Report the exact agreement count. A
    SINGLE DISAGREEMENT IS A BLOCKING DEFECT and the package is NOT ADMISSIBLE.
  - >-
    ANTI-TUNING, MECHANICAL LEGS - VERIFY AGAINST GIT that ba1567ee is an ancestor
    of 104d32fa which is an ancestor of the measurement commit; that
    specification.yaml still hashes to
    0d6c946fb84073feae47865da9b787b7d7ba459617834644680a06bf886d1cda; that
    reading_rule.yaml still hashes to
    8bcb196fa620503c736da307281325d17bb3dc8b0299407b24b584067c979f1d; that
    reading_rule_v2.yaml still hashes to
    b633eaf1837ec876ffb7a52bdc6450baba8b1bb4d253dce3d8f3e6e13a7de328; and that
    lpf001_driver.py still hashes to
    786aeb0550d75fa3d0785aefbe50b121a24cacae584a4cadd79902c464722d65 with an EMPTY
    git diff across the calibration-to-measurement boundary. A MISMATCH ON ANY OF
    THEM IS BLOCKING and voids this batch's reduced duty set.
  - >-
    MOVEMENT AT EVERY RUNG - RE-RUN IN FULL. Regenerate all 210
    LPF_movement_beyond_noise_flag values from the archived shifts and check
    RR-LPF-2's 28 moving_rungs lists row by row - every gamma in every list must
    carry flag true and every flag-true gamma must be in its list. A DISAGREEMENT
    IS BLOCKING. This is the check that caught RTB-054-1 and it is not skipped
    because the rule has already been reviewed.
  - >-
    DECISION-VARIABLE VARIATION - VERIFY EVERY THRESHOLD IS TRACEABLE. Each band
    must equal the named order statistic of the named archived calibration array,
    recomputed by your own sort, and you must state for each leg of the branch
    conditions which arm produces the quantity it reads.
  - >-
    VERIFY THE ENUMERATION - exactly 130816 half-tuples per cell with i < j, the
    diagonal absent by construction, degenerate draws counted and excluded, and
    factor_base_sha256 equal to the EXP-EQD-001 archived value.
  - >-
    VERIFY SEED AND STREAM DISJOINTNESS between the measurement's fresh uniform arm
    and every archived calibration and plant-Z stream.
  - >-
    RUN tools/validate_ledger.py AND REPORT ITS OUTPUT FOR THIS RUN PACKAGE
    VERBATIM. Confirm the manifest is schema-complete under the keys the schema
    names. Confirm the RUN-LPF-001-plantz supersession entry still resolves cleanly
    and that neither pinned file has drifted - this is the first batch in which
    that mechanism carries weight.
  - >-
    RETURN ADMISSIBLE or NOT ADMISSIBLE with a concrete defect list. DO NOT APPLY
    THE READING RULE, do not select a branch and do not state a disposition.
  - 'MAKE NO COMMIT; TASK-20260801-083 archives this report.'
  - >-
    Record inference honestly (requested review-adversarial, independent session),
    and every YAML written must parse.
  deliverables:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-027/reviews/TASK-20260801-081/validation_report.yaml
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-027/reviews/TASK-20260801-081/validation_report.yaml
  archived_by: TASK-20260801-083
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 7200
    memory_gb: 8
    maximum_runs: 1
  completion_gate:
  - >-
    ADMISSIBLE or NOT ADMISSIBLE with a concrete defect list; the report
    regenerated at tolerance zero and one statistic reimplemented independently; at
    least 5000 real-arm factorizations per cell re-verified by a second code path
    with the exact agreement count; all five hash and ancestry legs verified
    against Git; all 210 movement rows and all 28 moving_rungs lists re-checked with
    the result stated; every threshold traced to its named archived array by an
    independent sort and every branch leg attributed to the arm that produces it;
    the enumeration, seeds and streams verified; validate_ledger.py output reported
    verbatim and the plantz supersession entry confirmed still resolving; no
    reading rule applied; no commit made.
