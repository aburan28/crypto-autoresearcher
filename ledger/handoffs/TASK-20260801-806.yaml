handoff:
  id: TASK-20260801-806
  from: coordinator
  to: executor
  objective: >-
    Attempt to convert PROP-701-I's QUALITATIVE group-growth argument into a
    QUANTITATIVE LOWER BOUND on the branching factor B that a bounded-branching
    per-word projection must pay for a given entropy loss across
    Phi = ARK . MC . SR, and report either the bound with its full cost
    accounting or a precise statement of why the argument does not yield one.
    THE OBJECT, stated exactly so it is not drifted from. Let F = GF(2^8), let
    pi : F^4 -> X be a per-word projection with ENTROPY LOSS
    L = 32 - log2|X| bits, applied at every super-box word. PROP-701-I assumes pi
    propagates DETERMINISTICALLY: there exist functions F_j : X^4 -> X with
    pi(word_j(Phi(s))) = F_j(pi(word_0(s)),...,pi(word_3(s))) for EVERY state s.
    OD-4 DROPS DETERMINISM to BOUNDED BRANCHING: relations
    R_j subset X^4 x X with |R_j(x)| <= B for every x, such that
    pi(word_j(Phi(s))) is in R_j(pi(word_0(s)),...,pi(word_3(s))) for every state
    s. B = 1 recovers PROP-701-I exactly, and PROP-701-I says NOTHING about
    B > 1. THE QUESTION: does the Step-1/Step-2/Step-3 machinery, run with B > 1,
    force an inequality relating B, L and the number of interfaces n over which
    the object must survive — of the shape "to sustain L bits of loss across n
    interfaces, B must be at least f(L, n)" — and does the resulting per-attempt
    cost B^n times the inverse success probability of following the object beat
    the trivial alternative at any in-scope round count? A CLEAN, ARGUED "NO SUCH
    BOUND FOLLOWS, AND HERE IS THE EXACT STEP THAT BREAKS AND WHY" IS A COMPLETE
    AND VALUABLE OUTCOME AND IS REPORTED AS THE RESULT, NOT AS A FAILURE.
    Manufacturing a bound that does not follow would be far worse than returning
    none.
  uncertainty_reduced: >-
    Whether this campaign's only exponent-relevant lane can produce a COST
    INEQUALITY at all. Every result GOAL-AES-001 has produced so far is
    qualitative — a closure, a graph fact, an instrument property — and
    docs/target-result-profile.md ranks exponent-moving cost statements above all
    of them. DEC-20260731-025 and DEC-20260731-026 both identify OD-4 as the
    single route from this campaign's material that would produce one, and
    therefore the single route that engages the four asymptotic promotion gates.
    This task determines whether that route is open or closed, and if closed,
    exactly where.
  inputs:
    - >-
      PROP-701-I as stated in the BATCH-002 candidate_report.yaml at snapshot
      ebac9ba8, READ-ONLY: hypothesis, conclusion, the full Step 1 / Step 2 /
      Step 3 proof, ingredients_and_where_checked, and the four scope
      restrictions. Step 1 produces a LOCAL invariance on an affine hyperplane
      from a single collision; Step 2 upgrades it to a GLOBAL translation
      invariance using that every entry of M is nonzero; Step 3 iterates through
      the (lambda,k) graph and closes under the group generated.
    - >-
      OD-4 as recorded in candidate_report.yaml open_directions: "projections
      whose one-step propagation is a relation of small out-degree B rather than
      a function. PROP-701-I says nothing about B > 1. The right first question
      is quantitative: does the proof's group-growth argument give a LOWER BOUND
      on B for a given entropy loss? That would convert a qualitative closure
      into a cost inequality, which is the form that could matter."
    - >-
      The TASK-20260731-705 validator's independent reading, which located where
      each qualifier is consumed: "deterministic" is consumed in the EXISTENCE OF
      THE FUNCTIONS F_j, and OD-4 "correctly notes that B > 1 branching is
      untouched, and asks the right follow-up".
    - >-
      TASK-20260801-801's measured graph geometry, exact and independently
      recomputed by two methods with no discrepancy: the directed 1020-node
      (lambda,k) graph over GF(2^8) has forward and reverse diameter 30, radius
      30, eccentricity distribution {30: 1020}, G^2 diameter 16, covering number
      n* = 15, vertex-transitive. Proposition 801-1's interface constant is
      2 + 2n* = 32.
    - >-
      DEC-20260731-026's IN-SCOPE VACUOUS ruling on Proposition 801-1 and its
      forward guidance, which is the basis of this task's mandatory pre-screen.
    - >-
      EV-AES-003 observation groups A and Z, and KN-FIND-028 (MixColumns
      generates a cyclic group of order 4 in GL(4,GF(2^8)) so no AGL/GL
      transitivity argument is available for column-local invariants; byte-wise
      Inv preserves GF(2^8)-collinearity; the entries of M are all nonzero with
      values {01,02,03}, ord(0x02) = 51, ord(0x03) = 255).
    - >-
      protocol-amendment-GOAL-AES-001-004 Part B, the per-artifact-class
      provenance gate, IN FORCE for this task.
    - >-
      Local tooling: python3 3.11.15, 4 cores, 15 GB RAM, no sage, no GPU, no
      network.
  constraints:
    - >-
      THE PRE-SCREEN IS MANDATORY, IS APPLIED BEFORE ANY DERIVATION OR COMPUTE,
      AND IS FROZEN AS AN ARTIFACT. WRITE prescreen_od4.json FIRST, BEFORE
      writing any part of the derivation and before running anything, and mark it
      as written first with a timestamp. For EACH candidate line of argument you
      intend to pursue it must record: (a) the candidate's one-line statement;
      (b) WHETHER ITS ARGUMENT SPREADS INVARIANCE (or any propagated property)
      THROUGH THE (lambda,k) GRAPH OR ITS SQUARE G^2, yes or no; (c) if YES, the
      INTERFACE CONSTANT n the argument would require — the number of consecutive
      super-box interfaces over which the object must survive before the argument
      says anything — exhibited as a number or an explicit upper bound; (d) the
      VERDICT: PURSUE if n <= about 7, IN_SCOPE_VACUOUS if n > about 7 or if no
      upper bound on n can be exhibited; (e) if NO to (b), an explicit statement
      of WHAT MACHINE the argument routes through INSTEAD and why the interface
      screen does not apply to it — and that statement is itself reviewed
      independently, so it must be substantive rather than a label.
    - >-
      THE PRE-SCREEN THRESHOLD AND ITS BASIS. RQ-AES-001 scopes in-scope round
      counts to 3-7. Under PROP-701-I's own identification of one interface with
      one round, an in-scope argument gets AT MOST 7 interfaces. The
      (lambda,k)-graph machine's cheapest possible constant is about 32
      interfaces, forced by its own geometry (diameter 30, G^2 diameter 16,
      covering number 15, vertex-transitivity), an order of magnitude outside
      scope — which is exactly why Proposition 801-1, correctly derived and
      independently checked, was ruled IN-SCOPE VACUOUS with a margin of 24
      interfaces AFTER it was proved. Note honestly that the
      one-interface-per-round identification is PROP-701-I's own modelling
      convention (residual R5) and is not established by anything in this
      campaign; if you believe a different conversion applies, state it, justify
      it, and apply the screen under BOTH conversions.
    - >-
      A CANDIDATE THE PRE-SCREEN KILLS IS NOT PURSUED. Record it in
      prescreen_od4.json with verdict IN_SCOPE_VACUOUS and the constant that
      killed it, and STOP WORK ON IT. Do not prove it anyway "for completeness".
      The screen exists because BATCH-003 spent a whole exponent-relevant task
      slot on a theorem discovered vacuous only after it was proved, and a screen
      applied after the effort saves nothing. Equally: DO NOT RELABEL A CANDIDATE
      TO DODGE THE SCREEN. The screen is on whether the argument's iteration
      count over interfaces exceeds about 7, however the iteration is packaged,
      and repackaging n steps as one lemma does not change n.
    - >-
      IF YOU STATE A BOUND, ALL FOUR ASYMPTOTIC PROMOTION GATES APPLY AND MUST BE
      ADDRESSED IN THIS PACKAGE RATHER THAN DISCOVERED LATE. GATE (1) PROOF
      DECOMPOSITION: state the bound as a numbered proposition and decompose its
      proof into SINGLE-RESPONSIBILITY LEMMAS, each doing one job, with the main
      statement ASSEMBLING them under EXPLICIT PER-ATTEMPT COST x INVERSE SUCCESS
      PROBABILITY bookkeeping — name the attempt, name its cost, name its success
      probability, and show the product. Proposition 801-1's four-lemma structure
      (index bookkeeping, global upgrade, one-G^2-step advance, monotonicity)
      assembled by a counting Assembly with a MEASURED rather than asserted
      constant is the structural precedent DEC-20260731-026 records for exactly
      this purpose.
    - >-
      GATE (2) HEURISTICS, WHICH APPLIES IMMEDIATELY AND IS THE ONE MOST LIKELY
      TO BITE. EVERY conditional dependence — every unproven regularity,
      independence, uniformity, genericity or equidistribution assumption the
      bound rests on — must be stated as an EXPLICIT NUMBERED HEURISTIC, labelled
      HEUR-806-1, HEUR-806-2, ..., each written as a FORMAL STATEMENT (what
      distribution, over what object, with what predicted behaviour) and not as
      prose. For each, supply EITHER archived validation evidence produced in
      this task OR a CONCRETE VALIDATION EXPERIMENT SPECIFICATION the Coordinator
      can schedule in the next batch, naming: the distribution to sample, the
      scale at which to sample it, the predicted distribution to compare against,
      the tail-consistency check, and the pre-registered outcome that would
      falsify the heuristic. A conditional result with an unnumbered or unpaired
      heuristic is INADMISSIBLE and this card says so before the work starts.
    - >-
      GATE (3) CONCRETE COST TABLE. If a bound is stated, produce a concrete-cost
      table at STANDARDIZED PARAMETER SETS (state which, and state that they are
      toy / reduced-round), with HONEST ACCOUNTING of: superpolynomial or large
      overhead hidden in o(1) terms, MEMORY, TIME-MEMORY TRADEOFFS, and
      PARALLELIZATION scaling. FLAG every optimistic assumption AS optimistic,
      individually. Give an explicit AFFECTED-VS-SAFE SCOPE STATEMENT naming
      which round counts and parameter regimes the bound pressures and which it
      does not reach and why. Note the BATCH-002 precedent this repairs: the
      CAND-601-B 0.0444 figure carried four cost-accounting defects (D-705-9
      through D-705-12) and an untabulated 46x memory ratio, and
      DEC-20260731-011's strikes on it remain in force.
    - >-
      GATE (4) IS NOT YOURS TO SATISFY AND YOU MUST NOT CLAIM IT. Independent
      review-xhigh review plus a red-team pass on the cost model and heuristics
      are performed by TASK-20260801-809 and TASK-20260801-810. Name gate (4) as
      REQUIRED AND NOT PERFORMED BY THIS TASK.
    - >-
      RECORD GATE STATUS MACHINE-READABLY AND HONESTLY. od4_results.json carries
      a `promotion_gates` object with one entry per gate (1)-(4), each valued
      `addressed_in_this_package` (with the artifact and section reference),
      `partially_addressed` (with exactly what is missing), or `not_addressed`
      (with why). IF YOU CANNOT CLEAR A GATE, NAME THE GATE. Do not request
      promotion, do not assert that a gate is satisfied, and do not describe a
      partial as a pass — promotion is the Coordinator's transition in
      TASK-20260801-811 and rests on the independent review and the red team, not
      on your assessment.
    - >-
      A NEGATIVE RESULT HERE IS A REAL RESULT AND MUST MEET THE CLOSURE STANDARD,
      NOT THE FATIGUE STANDARD. If the machinery does not yield a bound, report
      it at the docs/inventor-protocol.md section 4 standard: NAME the exact step
      that breaks (Step 1's hyperplane construction, Step 2's sweep of u_k over
      F, Step 3's graph closure, or the assembly), give the ARGUMENT for why
      B > 1 breaks it, and give FORWARD GUIDANCE naming what would have to be
      true instead. "We tried and it did not work" is a fatigue report and is not
      acceptable; "Step 2's sweep requires a single-valued u_k and with
      out-degree B the reachable set is X rather than F, so the union that
      removes the constraint is unavailable, and a replacement would need Y" is a
      closure.
    - >-
      ANY COMPUTATION MUST BE EXHAUSTIVE AND VERIFIABLE, NOT SAMPLED-AND-
      EXTRAPOLATED. If you compute in a scaled-down analogue (the GF(2^4)
      analogue used by GATE-701-C v2 is the established precedent in this
      campaign and its readings are 16 / 1 / 8 over all 65535 nonzero Delta),
      state that it IS an analogue, state that its readings are NOT evidence
      about GF(2^8) and certainly not about AES, and enumerate exhaustively where
      the space permits. Pre-register any prediction BEFORE measuring it, in a
      section marked as written first. A prediction adjusted after seeing the
      reading is a protocol violation, not a refinement.
    - >-
      NULL OBJECT BEFORE BELIEF, AND IT MUST ISOLATE. If you build any control or
      gate for a claim in this task, build the SIBLING NULL before believing the
      label: V-804-1 is this campaign's own demonstration that a control can
      DISCRIMINATE without ISOLATING the property it names — an equally
      admissible sibling null under the producer's own selection rule, negating
      the same named ingredient, read identically to the target and would have
      voided the gate. State explicitly which property your control isolates, and
      build the sibling that negates the same named ingredient differently.
    - >-
      SUPERSEDE, NEVER OVERWRITE. Every BATCH-001, BATCH-002 and BATCH-003
      artifact is committed and immutable. Write new, separately named files in
      this task's own directory; do not modify, re-run into, or delete any
      committed artifact. State in the report which prior specification, if any,
      each new file supersedes, and that the prior record stands as written.
    - >-
      NO INSTRUMENT WORK. Do not repair, extend, re-run or probe
      mutation_control_v3.py or any predecessor, and do not enumerate a
      mutation-control escape. If you believe instrument work is needed to
      complete this objective, report it as a BLOCKER and stop; do not perform
      it. DEC-20260731-026's stand-down is binding.
    - >-
      SCOPE AND CLAIM TIER. This is derivation plus toy-scale computation about
      the algebra of AES components. It is NOT a cryptanalytic result, NOT a
      distinguisher, NOT a key recovery, NOT a barrier statement about AES
      security, and it asserts nothing about full-round or deployed AES. Any
      bound is scoped to the object class defined above, the interfaces counted,
      the field worked in, and the budget spent. State that in the report.
    - >-
      Every literature statement is UNVERIFIED-FROM-MEMORY (eprint.iacr.org,
      csrc.nist.gov, arxiv.org unreachable) and must be marked inline at the
      point of use. Two agreeing recollections are not a citation, and novelty is
      unresolvable in this environment. Do not compare any bound against a
      recalled literature number as if the number were read.
    - >-
      Seed all randomness deterministically and record every seed. Record exact
      commands, exit statuses, resolved tool versions, git commit and dirty-tree
      state, timestamps, and every check that did NOT run with its reason. Do not
      fabricate a command, output, count, constant, bound or verdict (AGENTS.md
      rule 9). A quantity you did not compute is recorded as not computed.
    - >-
      A timeout, crash, or out-of-budget condition is INFRASTRUCTURE SIGNAL
      reported as such, never a negative mathematical result (AGENTS.md rule 5).
      This task's declared budget is a BINDING STOP CONDITION: halt at it and
      report what was reached.
    - >-
      Create no ledger record, propose no hypothesis status, promote nothing to
      knowledge, assign no evidence strength, propose no closure or
      reject_scoped, change no official state, and write only under this task's
      own directory.
  deliverables:
    - prescreen_od4.json
    - od4_branching.py
    - od4_results.json
    - od4_branching_bound_report.md
  artifact_paths:
    - coordination/goals/GOAL-AES-001/batches/BATCH-004/tasks/TASK-20260801-806/prescreen_od4.json
    - coordination/goals/GOAL-AES-001/batches/BATCH-004/tasks/TASK-20260801-806/od4_branching.py
    - coordination/goals/GOAL-AES-001/batches/BATCH-004/tasks/TASK-20260801-806/od4_results.json
    - coordination/goals/GOAL-AES-001/batches/BATCH-004/tasks/TASK-20260801-806/od4_branching_bound_report.md
  archived_by: TASK-20260801-808
  inference:
    policy: executor-implementation
    requested_policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
    standing_basis: >-
      inference-amendment commit 0137a051eb5828789eb267fa83c8278086578d4c.
      Cross-model independence is unavailable campaign-wide; nothing produced
      here may be treated as a closure attestation.
    provenance_basis: >-
      protocol-amendment-GOAL-AES-001-004 Part B, prospective from BATCH-004,
      which clarifies protocol-amendment-GOAL-AES-001-002 PER ARTIFACT CLASS and
      does not replace it: source code carries a comment-block stanza AND a
      manifest artifact_provenance entry; the machine-readable manifest carries a
      first-class inference block AND the complete artifact_provenance list; a
      prose report carries EITHER an in-text block OR a manifest pointer, both
      equally compliant.
  budget:
    wall_clock_seconds: 1600
    memory_gb: 4
    maximum_runs: 8
  budget_basis: >-
    Calibrated against MEASURED consumption, not worst-case imagination. Executor
    tasks in this campaign have actually consumed 890, 631, 1783, 792 and 892 s.
    This is the heaviest card the campaign has issued and is set just under the
    1783 s ceiling of that observed range, because its cost is writing a
    decomposed proof attempt plus a four-gate accounting package rather than
    running code — its compute is a bounded search in a scaled-down analogue,
    measured in seconds. The declaration is a BINDING STOP CONDITION, not an
    allowance.
  completion_gate:
    - >-
      INFERENCE BLOCK REQUIRED, AND PROVENANCE PER ARTIFACT CLASS UNDER
      protocol-amendment-GOAL-AES-001-004 PART B (which clarifies
      protocol-amendment-GOAL-AES-001-002 and does not replace it). Every
      declared artifact carries a filled `inference` block recording policy,
      requested_policy (executor-implementation), the ACTUAL resolved model
      identifier, fallback_used, model_verified (false if
      `python3 -m orchestration.adapter doctor --probe` was not run), and the
      standing basis 0137a051eb5828789eb267fa83c8278086578d4c; an unobserved
      resolved model is recorded as `unrecorded`, never guessed. BY CLASS: every
      SOURCE-CODE artifact (od4_branching.py) additionally carries a
      comment-block inference stanza in its own text; the covering
      MACHINE-READABLE MANIFEST (od4_results.json) carries a full inference block
      as a first-class field AND an `artifact_provenance` list with one entry per
      declared artifact carrying path, kind, sha256,
      comment_block_inference_stanza (boolean, stated honestly including when
      false) and covered_by_this_manifest_inference_block (boolean); the PROSE
      REPORT (od4_branching_bound_report.md) carries EITHER an in-text inference
      block OR a provenance pointer naming the covering manifest, both forms
      being equally compliant. Missing or partial fails this task.
    - >-
      prescreen_od4.json exists, is marked as written BEFORE any derivation or
      compute with a timestamp, and carries for every candidate line of argument:
      its statement, whether it spreads invariance through the (lambda,k) graph
      or G^2, the interface constant n it requires (or an explicit statement that
      no upper bound on n could be exhibited), the verdict PURSUE or
      IN_SCOPE_VACUOUS against the about-7 threshold, and for any candidate
      answering NO to the graph question an explicit substantive statement of
      what machine it routes through instead.
    - >-
      No candidate recorded IN_SCOPE_VACUOUS was pursued, and the report says so
      explicitly for each.
    - >-
      EITHER a lower bound on B is stated as a numbered proposition with explicit
      hypotheses and a derivation, OR the report states precisely and with an
      argument that no such bound follows, naming the exact step of PROP-701-I
      that breaks under B > 1, why it breaks, and what a replacement would need.
      A bare "no result" without the named breaking step fails this gate.
    - >-
      IF a bound is stated: its proof is decomposed into single-responsibility
      lemmas and the main statement assembles them under EXPLICIT
      per-attempt-cost x inverse-success-probability bookkeeping, with the
      attempt, its cost and its success probability each named and the product
      shown.
    - >-
      IF a bound is stated: every conditional dependence is a NUMBERED heuristic
      HEUR-806-n stated formally, and each carries either archived validation
      evidence produced in this task or a concrete validation-experiment
      specification naming distribution, scale, predicted distribution, tail
      check and falsifying outcome.
    - >-
      IF a bound is stated: a concrete-cost table at named standardized parameter
      sets is given, with hidden-overhead, memory, time-memory-tradeoff and
      parallelization accounting, every optimistic assumption individually
      flagged as optimistic, and an explicit affected-vs-safe scope statement.
    - >-
      od4_results.json carries a `promotion_gates` object valuing each of gates
      (1)-(4) as addressed_in_this_package / partially_addressed / not_addressed
      with an artifact-and-section reference or a concrete statement of what is
      missing; gate (4) is recorded as REQUIRED AND NOT PERFORMED BY THIS TASK;
      and the package requests NO promotion and asserts NO gate satisfied.
    - >-
      Any pre-registered prediction appears in a section marked as written before
      measurement, with the measured value beside it; any control built states
      which property it ISOLATES and is accompanied by a sibling null negating
      the same named ingredient differently, or states plainly that no control
      was built.
    - >-
      The report states that nothing here is a cryptanalytic claim about AES at
      any round count and is not a barrier statement about AES security;
      proposes no closure, no reject_scoped and no evidence strength; scopes
      every statement to the object class, interfaces, field and budget actually
      used; and names which prior specification each new file supersedes, if any.
    - >-
      od4_results.json is machine-readable and records exact commands, exit
      statuses, tool versions, git commit and dirty-tree state, all seeds,
      timestamps, and every check that did not run with its reason.
    - >-
      No BATCH-001, BATCH-002 or BATCH-003 committed artifact is modified; no
      mutation-control work of any kind was performed; all writes are under this
      task's own directory.
  return_format: >-
    The four artifacts, plus a plain statement of: (i) how many candidates the
    pre-screen killed and with what interface constants; (ii) whether a lower
    bound on B is stated, yes or no; (iii) if yes, the bound and the per-gate
    status of gates (1)-(3); (iv) if no, the exact step of PROP-701-I that breaks
    under B > 1.
