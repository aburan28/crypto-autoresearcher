  objective: >-
    Port experiments/EXP-SBRG-60c55e/driver/macaulay.py (the Boolean Macaulay
    / syzygy meter: fall_dim(D) = rank(M_D) - rank(H_D), syzygy_dim(D) =
    nrows - rank(M_D), degree-histogram-matched null generation) to an
    F_p Macaulay deficit meter as a new package harness/macaulay_fp/ with a
    test suite tests/test_macaulay_fp.py and a short validation note
    harness/macaulay_fp/VALIDATION.md. The port must expose, field-
    generically at any prime p (p = 2 included): (1) SQUAREFREE / DIGIT
    mode -- variables a with a(a - 1) = 0, rows reduced in the multilinear
    quotient a^2 -> a, coefficients mod p; (2) ORDINARY-MONOMIAL mode --
    few free variables with no quotient (for EXP-PFDR-fd901a's direct-
    presentation positive control and EXP-PFDR-4bfc6f's e-ring in three
    free variables e_1, e_2, e_3); (3) MIXED mode -- squarefree digit
    variables plus exactly one free variable u (EXP-PFDR-20ee58's chained
    tree); (4) both multiplier conventions -- PER-LAYER (multipliers of
    degree exactly D - deg f_i, macaulay.py's convention) and CUMULATIVE
    (all multipliers of degree <= D - deg f_i, the convention KN-FIND-006's
    DREG series used) -- selected explicitly and recorded in every output;
    (5) fall_dim(D), syzygy_dim(D), the full rank profile (row count,
    top_rank, full_rank, column count) per degree, and a Koszul count
    koszul(D) so that deficit(D) = rows(D) - rank(Mac_D) - koszul(D) is
    computable under the cumulative convention; (6) the leading-form /
    shrink-test localization bit of EXP-ALPF-013 (nontrivial kernel support
    on a declared row subset: nontriv_full minus nontriv_fb at a degree);
    (7) null generators -- the degree-histogram-matched null of macaulay.py
    carried to F_p with uniform nonzero coefficients on the sampled
    support, the support-matched null (uniform coefficients on the
    IDENTICAL support), and the block-factored null of H-PFDR-4148b8
    (product over digit blocks of a uniformly random form of declared
    degree e per block); (8) arbitrary-precision residues -- word-size
    arithmetic below 2^62 and Python integers above, so the P-256 prime is
    reachable; (9) a pre-flight column / row gate that computes the layer's
    row and column counts before allocation and aborts above declared caps,
    reporting the counts. Write an implementation note in the validation
    note stating which functions were ported unchanged, which were
    generalized, and every convention chosen (degree of a row after
    multilinear reduction; treatment of zero-product rows; how the top-degree
    projection is defined in mixed mode). This is a TOOLING task: zero
    experiment runs, no curve, no Semaev instance beyond the fixtures named
    below, no evidence record, no hypothesis or experiment status change.
  uncertainty_reduced: >-
    Whether a test-covered F_p Macaulay deficit meter can be built that (a)
    reproduces the program's one committed Boolean known answer exactly at
    p = 2 under the cumulative convention, (b) recovers a planted syzygy
    count and a planted fall exactly, (c) agrees with the Boolean meter on
    its own fixtures when reduced mod 2, and (d) reduces at s = 1 to the
    direct f_V presentation -- i.e. whether the instrument-gap floor of
    IDEA-20260903-399a18 Stage 0 can be closed before any prime-field
    degree number in the battery is read. Its failure is infrastructure
    signal about the repository, never evidence about any hypothesis.
