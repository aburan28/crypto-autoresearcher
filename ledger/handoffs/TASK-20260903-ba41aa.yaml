  constraints:
    - >-
      Refuse to start unless ledger/decisions/DEC-20260903-93862f.yaml is
      committed at a declared path in a verified snapshot archive. A
      message saying 'approved' is not an approval.
    - >-
      Write only under harness/macaulay_fp/ and tests/test_macaulay_fp.py;
      never commit and never run git; never edit any existing record, run
      directory, specification, or the Boolean meter at
      experiments/EXP-SBRG-60c55e/driver/macaulay.py (it is an archived
      artifact and is read-only; port by copying, not by modifying).
    - >-
      Zero experiment runs (maximum_runs 0): no run directory, no
      manifest.yaml, no raw-result.json. The known-answer, planted-control,
      mod-2 agreement and s = 1 checks are TESTS under tests/, not runs,
      and are not evidence about any hypothesis.
    - >-
      The p = 2 known answer is a HARD GATE: on the committed GF(2) chained
      Boolean fixture at n = 12 (k = 4) as built by the EXP-DREG-001
      builder (record the exact builder path, the exact fixture-generating
      command, and the fixture's sha256 in the validation note), under the
      CUMULATIVE multiplier convention that KN-FIND-006's DREG series used,
      the meter must return deficit(3) = 1 and deficit(4) = 31 exactly, and
      the support-matched null must return 0 at both degrees. If the
      committed fixture's convention cannot be established from the DREG
      artifacts, report the ambiguity with both conventions' outputs and
      do NOT pick the one that matches; a matching value chosen after the
      fact is not a known-answer test.
    - >-
      The planted-syzygy positive control is the redundant-generator
      construction of IDEA-20260903-afa56b: add exactly k generators that
      are declared polynomial combinations of existing generators, at
      chosen degrees, and require the meter to report exactly k
      unpredicted zero-reductions (syzygies beyond the Koszul / trivial
      count) at those degrees, for k in {1, 2, 4, 8}, in squarefree mode
      and ordinary-monomial mode. Also the planted-fall generator
      g = u f_1 + v f_2 + h with deg h < deg g: the meter must report a
      fall at deg g whose lower-degree content is h (needed by
      EXP-PFDR-cbdefb's closure known answer).
    - >-
      The s = 1 slice test: in squarefree / digit mode with one digit per
      unknown and base d = B, the generated membership generator
      prod_{j<B}(a - j) must equal the direct presentation's f_V(x) =
      prod_{v in [0, B)}(x - v) generator for generator, and the graded
      rank profile on a small fixed system must coincide with the direct
      f_V presentation computed in ordinary-monomial mode.
    - >-
      Mod-2 agreement: with p = 2 and per-layer convention, the port must
      reproduce every assertion of experiments/EXP-SBRG-60c55e/tests/
      test_macaulay.py on the Boolean meter's own fixtures (fall_dim,
      syzygy_dim, first_nonzero_fall, deterministic seeded nulls), read
      from that file and re-asserted against the port.
    - >-
      Record IDEA-20260903-399a18's Stage 0 instrument map (which battery
      cells now have a test-covered instrument and which two rows still
      have no solver instrument) in the validation note at the port's
      state; a floor, not a finding.
    - >-
      Exact arithmetic only; no floating point in any rank; residues
      reduced mod p at every step; a deterministic seeded RNG for every
      null; no CAS dependency (pure Python standard library, so the meter
      runs where Sage is absent).
    - >-
      Record the requested policy (executor-implementation, medium), the
      resolved model identifier, model_verified and fallback_used in the
      validation note; no Bedrock, no fallback, no degradation.
    - >-
      A failing test, a timeout or an OOM during this task is an
      infrastructure outcome to be reported as such with the failing
      assertion named; never adjust an expected value to make a test pass.
