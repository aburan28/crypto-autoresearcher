    - id: SC-2
      text: >-
        MERGE origin/main INTO THE BRANCH, NEVER REBASE. Record the base commit
        checked and the merge outcome. Confirm and record that the pre-merge
        HEAD is 265ae64 or a descendant of it. On a conflict inside a record,
        stop; never resolve it by editing a record.
    - id: SC-3
      text: >-
        EXTRACTION, MECHANICAL AND WHITELISTED (review plan,
        blind_rederivation.parameters). Pool: all 62 U62; the 10 lowest-idx
        S62; the 5 lowest-idx C20; the 10 lowest-idx N-AFF62; the 10
        lowest-idx N-F262 -- set, idx and key as in instance-sets.json. Order:
        ascending sha256 hex of the UTF-8 string
        "REVIEW-CERTBIN-20260924-3d7e1a|" + key; label BI-001..BI-097 in that
        order. Write
        coordination/review/certbin-20260924-3d7e1a/blind/blind-inputs.json
        with EXACTLY these keys:
        - schema: "certbin.rc1.blind_inputs.v1"
        - review_id: "REVIEW-CERTBIN-20260924-3d7e1a"
        - field: {n: 17, modulus: "t^17 + t^3 + 1", encoding: "17-bit integer, bit j = coefficient of t^j"}
        - m: 2
        - l: 9
        - V: "span{1, t, ..., t^8} (degree < 9)"
        - variables: "v_0..v_17; x_1 = sum_{j<9} v_j t^j, x_2 = sum_{j<9} v_{9+j} t^j"
        - monomial_encoding: "a multilinear monomial is the ascending list of its variable indices; [] is the constant 1"
        - curve: {A: int, B: int}, from RUN-CERTBIN-3b7e05 curve.json
        - instances: 97 objects in label order, each EITHER
          {label, kind: "curve", x_R: int} for sets U62, S62, C20, OR
          {label, kind: "explicit", equations: a list of 17 lists of monomials}
          for sets N-AFF62, N-F262, decoded from instance-sets.json E_hex with
          macaulay.EQ_MONS and instances.E_from_hex; equation k is row k.
        NEVER written into blind/: set, family, idx, key, s, stratum,
        degenerate, rank, any one_in_R flag, E_sha256, any closure value.
        Write coordination/review/certbin-20260924-3d7e1a/blind-inputs-key.json
        (NOT under blind/) with the mapping label -> {key, set, family, idx}
        and nothing else. Write
        coordination/review/certbin-20260924-3d7e1a/systems/null-systems.json
        with, for EVERY instance of N-AFF62 and N-F262 (124), key ->
        {set, family, idx, equations} in the same encoding, plus a
        "convention" string stating the decoder used; nothing else.
    - id: SC-4
      text: >-
        EXTRACTION VALIDATION. Check mechanically and record each result:
        V1 the pool counts per set are 62/10/5/10/10, every label occurs once,
           and the order matches the sha256 rule;
        V2 every curve-kind x_R equals instance-sets.json "archived.x_R" and
           the x_R of the same idx in RUN-CERTBIN-3b7e05 targets-F-S3.jsonl.gz;
           every x_R is an int in [0, 2^17); curve A, B equal curve.json;
        V3 for all 124 null instances, re-encoding the decoded equations with
           instances.E_to_hex reproduces instance-sets.json E_hex exactly, and
           each F-NULLF2 E_hex equals the E_hex of the same idx in
           targets-F-NULLF2.jsonl.gz;
        V4 decoding-convention cross-check: decode the E_hex of the 5
           lowest-idx U62 instances with the same decoder and, at 256 random v
           in F_2^18 (declare the seed), compare each decoded equation's value
           with bit k of S_3(x_1(v), x_2(v), x_R) computed in F_{2^17} with
           impl/gf2n.py; all must agree;
        V5 blind-inputs.json has exactly the SC-3 keys, and every object in
           instances has exactly the keys of its kind.
        Record the extraction and validation script text (or its path inside
        this task's archive directory) and the sha256 of all three files. Any
        failure is a STOP; nothing is committed with a failed validation.
    - id: SC-5
      text: >-
        BLIND-PHASE HYGIENE. Write
        coordination/review/certbin-20260924-3d7e1a/blind-phase-hygiene.yaml as
        `blind_phase_hygiene: {protected_sha256: {<sha256 hex of literal>: <label>}}`,
        one entry per protected literal supplied out of band; digest = sha256
        of the literal's UTF-8 bytes, as tools/check_review_independence.py
        tokenizes it. Each label is the opaque item label supplied with the
        literal ("protected RUN-CERTBIN-c417e0 item p01" and so on); a label
        never contains or describes the value.
        BEFORE the commit, dry-run `python3 tools/check_review_independence.py
        --blind-history HEAD --protected-from
        coordination/review/certbin-20260924-3d7e1a/blind-phase-hygiene.yaml`
        on the merged head and record the output verbatim. On a match apply
        DEC-20260924-5b1c8e R-10: if EVERY matching commit is an ancestor of
        ec215577869db85c5cae7980ae230349c257ea29 (git merge-base --is-ancestor) or touches no path containing
        "CERTBIN" or "certbin" (git show --name-only), the item is removed
        from the protected set and recorded under blind_phase_hygiene.removed
        as {label, commits, by: "DEC-20260924-5b1c8e R-10"} (never the value
        or its digest), and the dry run is repeated; any other match is a
        STOP, and TASK-20260924-1f6a3c may not run on this history until the
        Coordinator decides. AFTER the commit, run the same check on the new
        HEAD; it must PASS. Record both outputs.
    - id: SC-6
      text: >-
        PRIOR-COMMIT BINDINGS (DEC-20260924-5b1c8e R-6). Do not stage or edit
        experiments/EXP-CERTBIN-e94b27/runs/RUN-CERTBIN-c417e0/manifest_v2.yaml
