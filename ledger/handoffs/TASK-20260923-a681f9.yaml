      text: >-
        THE FIX (PS-1; RC-2). P-A: configure cypari2's process-wide PARI
        stack to parisize 67108864 and parisizemax 536870912 in every entry
        process BEFORE the first import of any v2 or v2-a1 module that can
        reach PARI. v2_common.curve_order_pari is NOT replaced under P-A.
