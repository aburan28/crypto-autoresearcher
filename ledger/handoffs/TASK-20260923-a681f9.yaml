        (parisizemax exact; parisize per the semantics DV-2 establishes), with
        VmHWM and VmRSS, into pari-stack.json. P-B only on the PS-1 trigger
        (addendum lines 299-313), with the trigger evidence verbatim in
        implementation-v2-r1.md: the replacement runs the same PARI expression
        in /usr/bin/gp in a capped child via v2_solver.run_child (RLIMIT_AS
        10737418240 read back with getrlimit; one memory-heavy child at a
        time; `default(parisize, 256000000); default(parisizemax,
        4000000000)`; 7200 s child timeout declared in each r1 plan's
        `repair` block, NOT in `watchdogs`). No other value may be used. The
        branch written into the plans is final.
