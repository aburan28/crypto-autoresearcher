handoff:
  id: TASK-20260908-b6c643
  from: coordinator
  to: validator
  objective: Validate S2CX cs_bound-swap-and-uniqueness and observation-not-disposition joints.
  uncertainty_reduced: Whether the cs_bound-swap is complete and remains an unclassified observation.
  inputs:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan_s2cx.yaml
  - experiments/EXP-ECDLP-5cad48/runs/RUN-ECDLP-5cad48-S2CX/raw-result.json
  constraints:
  - Do not classify W.
  - Do not fit a from a subset.
  - Do not authorize Stage 5 of EXP-ECDLP-a98ea9.
  - Do not change H-ECDLP-07c7c6.
  - Do not read sibling reports.
  deliverables:
  - validation-report.yaml
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/reviews/TASK-20260908-b6c643/validation-report.yaml
  archived_by: TASK-20260908-0b4566
  inference:
    policy: review-adversarial
    requested_policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: null
    memory_gb: null
    maximum_runs: 0
    experiment_maximum_runs: 0
  completion_gate:
  - Assigned joints record holds, breaks, or inconclusive.
  - SMALL_W_or_LARGE_W remains false.
  review_plan:
    opened_by: TASK-20260908-b6c643
    batch_id: BATCH-5a5091
    recorded_at: '2026-09-08'
    recorded_before_reviewers: true
    recorded_before_producer_run: true
    does_not_rewrite:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan_s2bd.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan_s2tp.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan_s2gx.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan_s2mx.yaml
    claim_under_review: >-
      Expected producer statement for RUN-ECDLP-5cad48-S2CX
      under a later authorization of v1_stage2_cs_bound_swap_audit,
      written before the run exists: S2CX status valid;
      certificate kind none; executable package
      stage2_cs_bound_swap; consume-only of
      RUN-ECDLP-5cad48-S2BD; n_holds 3; hold roles
      same_cell_hold and next_tightest_hold; aligned_ratio
      is G_exact / M_delta_exact; miss_would_hold_if_this_cs
      and this_would_hold_if_miss_cs are present per hold;
      n_this_cs_that_would_make_miss_hold,
      n_holds_flipped_by_miss_cs, and
      miss_cs_flips_only_next_tightest are present;
      SMALL_W_or_LARGE_W false; fit_of_a false;
      cs_bound_official_supported false;
      a98ea9_stage5_authorized false; a cs_bound-swap
      uniqueness or sharing is recorded as isolation of a
      derived quantity, not as a W class and not as an
      official supported bound.
    coordinator_prior: >-
      Written before RUN-ECDLP-5cad48-S2CX exists. The
      Coordinator expects the archived S2BD miss and the
      three official holds, with two defined cs_bound-swap
      flags per hold. The Coordinator does not pre-record
      whether miss cs_bound flips only the next-tightest hold.
      Occupancy contrast remains not a W class.
      PD-S2CXR1: same session will produce the run and
      the reviews. independent_session is false.
    procedure_deviations:
    - id: PD-S2CXR1
      description: >-
        The Coordinator session that will produce
        RUN-ECDLP-5cad48-S2CX is writing this prior and
        will also execute the review attacks.
        independent_session is recorded false.
    - id: PD-S2CXR2
      description: >-
        Reviewers are forbidden to run git log / git show.
        A --blind-history FAIL or UNCHECKABLE is not a pass.
    joints:
    - joint: cs_bound_swap_and_uniqueness
      assigned_to: TASK-20260908-b6c643
      attack_plan: >-
        From S2CX raw-result.json, confirm n_holds is 3,
        aligned_ratio is G_exact / M_delta_exact, and
        miss_would_hold_if_this_cs and
        this_would_hold_if_miss_cs are present per hold.
        Confirm n_this_cs_that_would_make_miss_hold,
        n_holds_flipped_by_miss_cs, and
        miss_cs_flips_only_next_tightest are present.
        Confirm the producer does not classify W.
      breaking_artifact: >-
        wrong hold count, wrong swap definition, missing
        uniqueness fields, or a W-class reading
    - joint: observation_not_disposition
      assigned_to: TASK-20260908-b6c643
      attack_plan: >-
        Proves-too-much. Holds only if SMALL_W_or_LARGE_W
        is false, fit_of_a is false, cs_bound_official_supported
        is false, the S2-P8219 miss is not read as a W
        class, a cs_bound-swap uniqueness or sharing is not
        read as a W class or as an official bound, and
        H-ECDLP-07c7c6 is not moved.
      breaking_artifact: any SMALL-W/LARGE-W reading, official bound claim, or fit of a
    blindness:
      mutual: true
      lifted_for: []
      rationale: null
    proves_too_much:
      objects:
      - >-
        An argument that a cs_bound-swap uniqueness or
        sharing classifies the S2-P8219 row as SMALL-W or
        LARGE-W. That conclusion is known false: a
        cs_bound-swap is still an observation, not a W class.
      - >-
        An argument that a counterfactual aligned_ratio
        versus another cell's cs_bound is an official
        cs_bound claim. That conclusion is known false:
        a derived swap is not an official supported bound.
      failure_signature: >-
        The argument must refuse to read a cs_bound-swap
        uniqueness or sharing as a W class or as an
        official bound.
      assigned_to: TASK-20260908-b6c643
    blind_rederivation:
      required: true
      quantity: >-
        miss_would_hold_if_this_cs and
        this_would_hold_if_miss_cs for the archived S2BD
        miss S2-P8219 M=9 floor(Mx/p) against the
        next-tightest hold S2-P32779 M=13 floor(Mx/p)
        and against one same-cell hold S2-P8219 M=20
        floor(Mx/p).
      parameters: >-
        Read only archived S2BD fields G_exact,
        M_delta_exact, and cs_bound_recorded for those
        three cells. Must not read the S2CX producer or
        its raw result.
      blind_from:
      - experiments/EXP-ECDLP-5cad48/implementation/stage2_cs_bound_swap.py
      - experiments/EXP-ECDLP-5cad48/runs/RUN-ECDLP-5cad48-S2CX/raw-result.json
      - experiments/EXP-ECDLP-5cad48/execution-report-s2cx.yaml
      assigned_to: TASK-20260908-163f2e
