    - GOAL-SCURVE-cef9f7
    - GOAL-SCURVE-137bd9
  opened_by_decision: DEC-20261016-82753f
  archive_kind: ledger
  archive_kind_note: >-
    The ledger archive of the evidence review of VAL-20261016-cd9156. It runs
    alone, after the TASK-20261016-670480 snapshot commit has landed and been
    verified. It is the archival task of record for the evidence record, the
    review decision, the correction, the promoted finding, this card and the
    decision report. TASK-20261016-670480 remains snapshot-only: its
    constraints forbid staging any ledger record or knowledge entry, and
    agents/coordinator.md runs the snapshot archive alone before the ledger
    archive alone. The dispatching brief asked for one combined commit. The
    contracts win, so there are two commits.
  executed_by: >-
    The top-level Claude Code session (session_01TPFiTk4kt2VfEauB3PKCbN), which
    allocated this id (tools/allocate_id.py --next handoff --date 20261016,
    then --check). It runs the git commands, because the Coordinator subagent
    has no shell. It must not be the Validator's session.
  depends_on:
    - TASK-20261016-670480
  objective: >-
    Archive in one isolated ledger commit the evidence review of
    VAL-20261016-cd9156: EV-SCURVE-e9d71b, DEC-20261016-82753f,
    CORR-20261016-10d498, KN-FIND-cee88d, this card, and the decision report
    with its rendered graphs and PDF. Then push the branch and refresh the PR.
  uncertainty_reduced: >-
    Whether the official support decision and the promoted finding rest on
    committed, hash-bound records that cite a committed snapshot of the
    Validator's artifacts. Until this commit is verified, DEC-20261016-82753f
    is not official and KN-FIND-cee88d is not part of the corpus.
  inputs:
    - research/nist_seed_provenance_20261016/archives/TASK-20261016-670480/receipt.yaml
    - research/nist_seed_provenance_20261016/validation-20261016/validation_report.yaml
    - ledger/evidence/EV-SCURVE-e9d71b.yaml
    - ledger/decisions/DEC-20261016-82753f.yaml
    - ledger/corrections/CORR-20261016-10d498.yaml
    - knowledge/findings/KN-FIND-cee88d.md
    - research/nist_seed_provenance_20261016/review-DEC-20261016-82753f/report.md
    - origin/main
  input_roles: >-
    The TASK-20261016-670480 receipt is the precondition: it must exist,
    record a verified snapshot commit, and show that the three freeze records
    are byte-identical to the freeze commit dbd1b8d15845579aaaa3af47b827955e2b625e77.
    The four records and report.md are the files to archive. Do not change
    their content. report.md names the graphs to render (its "Graphs to
    render" section). The harness refused the Coordinator subagent's write of
    report.md (subagents may not write report files), so the Coordinator sent
    its full text to the top-level session by in-session message. That session
    writes it verbatim to the report.md path and records the file's SHA-256 in
    the receipt. The message carries no authority. It only delivers the text
    this card names.
  constraints:
    - >-
      Start only after the TASK-20261016-670480 snapshot commit is made,
      verified against git and pushed. If that receipt is missing or records
      an integrity failure, stop and return the task to the Coordinator.
    - >-
      Run alone. Fetch and inspect origin/main immediately before the commit,
      and merge it, never rebase. A conflict inside a record is never resolved
      by editing the record: stop and report it.
    - >-
      Render the graphs named in report.md from the data tables it gives,
      which cite out/*.json in the committed snapshot. Write the plotting
      script, SVG and PNG renders, and report.pdf (report.md with the graphs
      embedded) under
      research/nist_seed_provenance_20261016/review-DEC-20261016-82753f/.
      Inspect the PDF before staging. Do not edit report.md except to embed
      the rendered graph links where it marks them. If no renderer works,
      archive the source and graphs and state the blocker in the receipt.
    - >-
      Stage exactly these paths and nothing else (never `git add -A`):
      ledger/evidence/EV-SCURVE-e9d71b.yaml;
      ledger/decisions/DEC-20261016-82753f.yaml;
      ledger/corrections/CORR-20261016-10d498.yaml;
      ledger/handoffs/TASK-20261016-a28b0d.yaml;
      knowledge/findings/KN-FIND-cee88d.md; every file under
      research/nist_seed_provenance_20261016/review-DEC-20261016-82753f/;
      and research/nist_seed_provenance_20261016/archives/TASK-20261016-a28b0d/receipt.yaml.
      Do not stage knowledge/INDEX.md. AGENTS.md ("Concurrency") makes it a
      gitignored generated artifact. That rule wins over the "include the
      regenerated INDEX.md" sentence in the Coordinator brief. Regenerate it
      locally and run --check only.
    - >-
      Do not edit research/nist_seed_provenance_20261016/README.md,
      ledger/decisions/DEC-20261016-264eed.yaml, or any freeze record.
      CORR-20261016-10d498 corrects the first two without editing them.
    - >-
      Before the commit, run python3 tools/validate_ledger.py,
      python3 tools/build_knowledge_index.py --check (after regenerating
      locally), python3 tools/build_source_index.py --check, and the
      branch-scoped python3 tools/check_merge_hygiene.py. Record each command's
      output in the receipt. A new error attributable to a staged path blocks
      the commit and returns the task to the Coordinator. Do not repair a
      record to make it pass.
    - >-
      After the commit, push the branch and open or refresh the PR against
      main, ready for review, not a draft. Name EV-SCURVE-e9d71b,
      DEC-20261016-82753f, CORR-20261016-10d498, KN-FIND-cee88d,
      TASK-20261016-a28b0d and VAL-20261016-cd9156 in it.
  deliverables:
    - ledger/evidence/EV-SCURVE-e9d71b.yaml
    - ledger/decisions/DEC-20261016-82753f.yaml
    - ledger/corrections/CORR-20261016-10d498.yaml
    - ledger/handoffs/TASK-20261016-a28b0d.yaml
    - knowledge/findings/KN-FIND-cee88d.md
    - research/nist_seed_provenance_20261016/review-DEC-20261016-82753f/report.md
    - research/nist_seed_provenance_20261016/review-DEC-20261016-82753f/report.pdf
    - research/nist_seed_provenance_20261016/archives/TASK-20261016-a28b0d/receipt.yaml
  artifact_paths:
    - ledger/evidence/EV-SCURVE-e9d71b.yaml
    - ledger/decisions/DEC-20261016-82753f.yaml
    - ledger/corrections/CORR-20261016-10d498.yaml
    - ledger/handoffs/TASK-20261016-a28b0d.yaml
    - knowledge/findings/KN-FIND-cee88d.md
    - research/nist_seed_provenance_20261016/review-DEC-20261016-82753f/
    - research/nist_seed_provenance_20261016/archives/TASK-20261016-a28b0d/receipt.yaml
  write_scope:
