    the constancy means anything at all; per falsification criterion F2 a
    control set exhibiting the same single values REFUTES the closure reading, and
    per F3 a Koszul degeneration explains it away. If a gate fires, report the
    numbers that caused it as fully as a completed run would be reported -- a
    PREMISE-FAILED or INVALID verdict is not a lesser deliverable.

  scope_and_honesty: >-
    claim_tier toy. One prime p = 4001 (about 12 bits), one trace t = 30, one
    isogeny class of 138 curves, arities m = 3 and m = 4, degrevlex, standard
    grading after homogenisation with respect to x0. NO ATTACK, NO EXPONENT, NO
    SPEEDUP. sota_delta ZERO on every axis. dominated_by parallel Pollard rho with
    distinguished points at 0.886 sqrt(N) group operations and O(1) memory
    (KN-TECH-001, KN-TECH-006) and, on CM curves, its automorphism-discounted
    variant (KN-TECH-018), under which any factor at or below sqrt(6) which is
    about 2.449 is BASELINE CALIBRATION and never an attack. NO TRANSFER IS
    CLAIMED to another prime, class, arity, grading or monomial order, and none to
    the deployed f_V-bearing formulation the harness actually runs -- removing f_V
    is what makes the measured object a functional of the curve and, by the same
    argument, what makes the result non-transferable to solving time. The
    committed -0.44% and -0.67% Groebner-time pair against an exact 23-31% drop in
    S_3 support is the standing demonstration of that non-transfer. A regularity
    difference found here is NOT a predicted Groebner speedup and must not be
    reported as one.

