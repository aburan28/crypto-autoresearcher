  constraints:
  - >-
    THE CONTRACT IS FROZEN AND IS READ-ONLY TO THIS TASK. Every threshold,
    definition, grading, monomial order and prediction in
    experiments/EXP-ICINV-e0cd8f/specification.yaml binds as written. Any change
    requires a versioned protocol_amendment authored by the COORDINATOR under
    experiments/EXP-ICINV-e0cd8f/amendments/ and filed BEFORE the affected data
    is generated. The executor does not write amendments.
  - >-
    THE DEFINING CONSTRAINT. NO factor-base membership polynomial f_V may appear
    in ANY ideal computed by this experiment. Including one makes the run INVALID.
    The ideal is I_m(E) = < S_m, dS_m/dx_1, ..., dS_m/dx_m > and nothing else.
  - >-
    STOPPING RULES RUN IN ORDER AND SR1 RUNS FIRST. SR1 support gate -- re-derive
    the support counts 13 / 9 / 10 symbolically and compute the S_3 support on all
    138 class members; if the derivation fails or any member's support is not 13,
    STOP and report the defect, and do not compute a single resolution. SR2 census
    gate -- re-emit the class enumeration and compare with the committed 138;
    disagreement terminates PREMISE-FAILED and is reported as a defect in a
    certified artifact. SR3 backend gate -- declare and record both backends and
    their versions before any resolution is computed (see second_backend_note).
    SR4 control first -- the control-set multisets are computed and WRITTEN TO THE
    RUN RECORD before the class multisets are read for interpretation. SR5 frozen
    scope. SR6 budget. SR7 no outcome shopping.
  - >-
    HOMOGENISATION AND GRADING ARE DECLARED, NOT DERIVED. Betti tables and
    regularity are computed on the ideal homogenised with respect to a new
    variable x0 over F_p[x0, x1, ..., x_m] with the standard grading, in
    degrevlex. The singular locus and its dimension and degree are computed on the
    UN-HOMOGENISED ideal. Both are reported and neither substitutes for the other.
  - >-
    C-GAUGE. Every invariant is recomputed on (u^4 a, u^6 b) for a recorded random
    u per curve with the induced weighted change of variables. Disagreement is an
    implementation defect and makes the run INVALID; it is never a curve
    difference.
  - >-
    C-ORDER. Betti numbers, regularity, singular-locus dimension and degree are
    recomputed under a second monomial order on the cross-check subsample. A
    dependence on the order is an implementation defect, reported as one, never as
    a curve difference.
  - >-
    C-KOSZUL. Test and report the regular-sequence condition on the m+1 Jacobian
    generators PER CURVE. If it holds everywhere, a constant Betti table is a
    function of the generator degrees alone and carries no information about the
    isogeny class; report it as a Koszul degeneration, never as invariance.
  - >-
    C-CONTROL-SET. The 138 random ordinary curves at p = 4001 from traces other
    than t = 30, identical pipeline, identical grading and monomial order, with
    the drawn traces and the RNG seed recorded. Comparison of exact multisets is
    DETERMINISTIC; no p-value is computed and none is admissible.
  - >-
    NO STATISTICS OF ANY KIND. Any p-value, null-object test, permutation test or
    dispersion statistic appearing anywhere in the output means the scope was
    exceeded and makes the run INVALID.
  - >-
    DO NOT EDIT harness/semaev.py OR harness/exp_icinv.py. Both are READ-ONLY.
    All new code goes under harness/exp_icinv_e0cd8f/, which is this task's own
    declared write scope, so that every already-committed run stays reproducible.
  - >-
    SOURCE PROVENANCE IS BLOCKING (the standing A6 precondition carried from
    EXP-ICINV-4d33aa amendment v2). Every run manifest must pin the hash of every
    source file executed, via harness/runner.py source_provenance(), and
    `python3 tools/check_run_source_provenance.py --experiment EXP-ICINV-e0cd8f
    --strict` must pass before any run is considered complete.
  - >-
    NO TRANSCRIBED REFERENCE VALUES. Any value quoted from a committed record --
    the 138-member census, the true 2-volcano levels, the 13 / 9 / 10 support
    counts -- must be READ FROM THAT RECORD AT RUN TIME and bound by a
    source_sha256 in the manifest. Transcription at any precision is PROHIBITED
    and makes the run INVALID (EXP-ICINV-4d33aa amendment v2 change A4,
    CORR-20260807-a24675). This applies equally to every figure in this handoff,
    including the probe figures in stage_0_gate_note.
  - >-
    SECOND-BACKEND CROSS-CHECK. See second_backend_note, which is a constraint of
    this handoff and not commentary. Run both available paths, record exactly
    which quantities each covers and which are covered by neither, label path (a)
    as not fully independent, and escalate at SR3 rather than working around
    C-BACKEND.
  - >-
    CONCURRENCY. See concurrency_note. This task runs ALONE. Do not start, spawn
    or parallelise any other BATCH-d7e255 task, and keep this task's own internal
    parallelism low enough that it does not add to a host already at load average
    21.6 / 25.8 / 40.2 on 14 cores.
  - >-
    THE EXECUTOR NEVER INTERPRETS RESULTS. Produce run records and an execution
    report of what ran, what did not, every deviation and the emitted verdict.
    Do not characterise what the verdict means for RQ-ICINV-475b5e,
    H-ICINV-d5e351, GOAL-ENDO-001 criterion C1 or C2, or the campaign.
  - >-
    THE EXECUTOR NEVER CHANGES A HYPOTHESIS STATUS. H-ICINV-d5e351 stays
    `specified`. H-ICINV-6c7920 stays `specified`. H-ENDO-001 stays `approved` and
    is USED as the admissibility filter, not retested. H-STR-002 stays `weakened`
    with DEFER-BATCH009-001 OPEN. Only the Coordinator moves a status, on a
    committed ledger archive after independent review.
  - >-
    THE EXECUTOR NEVER COMMITS. Do not run `git commit`, `git push`, or any
    history-modifying git command. Workers do not commit into a shared worktree
    (AGENTS.md, "Durable research commits"); the Coordinator makes the isolated
    snapshot commit. Read-only git inspection is permitted and encouraged.
  - >-
    NO COMPLETION CRITERION MAY BE CLAIMED MET. None of GOAL-ENDO-001's C1-C4 is
    met by this task and none may be asserted met by it. Record no attestation and
    no closure quorum.
  - >-
    Never fabricate a command, output, timing, statistic or run. A quantity not
    computed stays missing and is reported as missing (AGENTS.md rule 9). A
    timeout, crash or OOM is failed_infrastructure, never negative evidence
    (AGENTS.md rule 5).
  - >-
    Mint every new identifier with `python3 tools/allocate_id.py --next <type>`
    and confirm it with `--check` before use. Do not grep for the next free
    number.
  - >-
    Fetch origin/main and compare it with this branch before the run manifests are
    written; record the base commit checked and the merge outcome in the execution
    report. Merge new main changes into the branch; never rebase pushed run
    records.
  - >-
    SESSION SURVIVAL. Write artifacts to disk as each stage completes -- after
    SR1, after SR2, after the backend declaration, after the control set, after
    the class computation. Never hold results only in memory.
  - >-
    Lawful defensive cryptanalysis on public toy constructions only. p = 4001. No
    live key, wallet or deployed system is touched.

