  completion_gate:
  - >-
    SR1 passes -- the 13 / 9 / 10 support counts are re-derived symbolically and
    every one of the 138 class members has S_3 support exactly 13 -- or the run
    stops at SR1 and returns the defect.
  - >-
    SR2 passes -- the re-emitted class enumeration agrees with the committed
    138-member Hurwitz-Kronecker-certified census -- or the run terminates
    PREMISE-FAILED and reports the disagreement as a defect in a certified
    artifact.
  - >-
    SR3 passes -- both computer-algebra backends and their exact versions are
    declared and recorded in backend-provenance.json BEFORE any resolution is
    computed, with the independence limitation of each cross-check path stated
    explicitly, or the task stops at SR3 and returns to the Coordinator.
  - >-
    All four primary invariant families are computed at m = 3 on all 138 class
    members AND on all 138 control-set members, with every value gauge-rechecked.
  - >-
    SR4 ordering is honoured -- the control-set multisets are written to the run
    record BEFORE the class multisets are read for interpretation.
  - >-
    The cross-check is reported per quantity and per curve, covering at least 20
    curves including every curve carrying a claimed difference for the quantities
    a cross-check path can cover, with the quantities covered by NEITHER path
    listed explicitly and no claim of a clean two-backend cross-check anywhere.
  - >-
    The Koszul indicator is reported per curve.
  - >-
    The exact multisets of distinct values are reported for both sets, with every
    curve deviating from the class mode listed individually with its (a, b),
    j-invariant, true 2-volcano level, gauge-recheck and cross-check results.
  - >-
    The run emits EXACTLY ONE of the two frozen verdicts, CLASS-INVARIANT or
    CLASS-VARYING, computed inside the run and written to verdict.json, never
    selected afterwards.
  - >-
    `python3 tools/check_run_source_provenance.py --experiment EXP-ICINV-e0cd8f
    --strict` passes for every run.
  - >-
    No f_V polynomial appears in any computed ideal; no p-value, permutation test
    or dispersion statistic appears anywhere in the output.
  - >-
    The execution report names every deviation from the contract, every dropped
    curve with its reason, every infrastructure failure, and interprets nothing.

  return_format: >-
    The run directories plus the execution report at the path above. State the
    emitted verdict and the exact multisets that produced it, and STOP THERE. Do
    NOT write an evidence record, do not move any hypothesis status, and do not
    characterise what the verdict means for RQ-ICINV-475b5e, H-ICINV-d5e351,
    EV-ENDO-10109d, H-ICINV-6c7920 or GOAL-ENDO-001 -- those are Coordinator acts
