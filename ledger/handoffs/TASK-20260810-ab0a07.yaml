  objective: >-
    Execute the frozen, approved contract at
    experiments/EXP-ICINV-e0cd8f/specification.yaml, version 1, exactly as
    written. Read that file IN FULL before writing any code; it is READ-ONLY to
    this task. Compute, by exact symbolic computation over F_p and not by any
    statistic, the four invariant families of the f_V-FREE Semaev Jacobian ideal
    I_m(E) = < S_m, dS_m/dx_1, ..., dS_m/dx_m > on all 138 curves of the
    Hurwitz-Kronecker-certified ordinary isogeny class at p = 4001, t = 30,
    D = -15104 = -59 * 16^2, and on the 138-curve nearby-object control set of
    random ordinary curves at p = 4001 drawn from traces other than t = 30 --
    monomial support of S_3 and S_4; affine singular locus with its dimension
    and degree; graded Betti table and Castelnuovo-Mumford regularity of the
    homogenised ideal in degrevlex; and the degree and F_p-factorisation type of
    the elimination polynomial. Emit exactly one of the contract's two frozen
    verdicts, CLASS-INVARIANT or CLASS-VARYING, computed inside the run.

  uncertainty_reduced: >-
    Whether the Semaev geometry of a curve is an isogeny-class invariant, on the
    exact tested scope named above. This is the deterministic, statistic-free
    axis of RQ-ICINV-475b5e. It is DECISIVE IN BOTH DIRECTIONS per T3 and neither
    direction is preferred by this handoff -- constancy that survives the control
    set and the Koszul test closes the d_reg axis for THESE functionals at THIS
    class under THIS grading and monomial order with a named obstruction;
    variation exhibited by an explicit pair of class members hands the campaign
    min over E' isogenous to E of C(E') as a target and nothing else, because T5
    is binding and the reachability gate lives in EXP-VOLC-9f5571.

  dependency_note: >-
    THIS TASK RUNS FIRST IN BATCH-d7e255 AND IS BLOCKED BY NOTHING IN IT. It is
    not blocked by GOAL-ENDO-001 criterion C4 and EXP-INSTR-36c8cf does not block
    it, because this contract computes no statistic and criterion C4 governs
    instruments that ESTIMATE. It is likewise independent of the SR3 gate
    redesign recorded in DEC-20260810-a4bec4.

    DO NOT CONFLATE THIS CONTRACT WITH EXP-ICINV-4d33aa. RQ-ICINV-475b5e REMAINS
    PAUSED for EXP-ICINV-4d33aa, whose successor run is gated on the SR3 v3
    replacement and on the not-yet-written
    experiments/EXP-ICINV-4d33aa/amendments/v3.yaml. EXP-ICINV-e0cd8f is a
    DIFFERENT, deterministic contract with a different hypothesis
    (H-ICINV-d5e351), and that pause does not apply to it. Nothing this task
    produces bears on H-ICINV-6c7920 or EV-ENDO-10109d in either direction, and
    no output of this task may reference either as supported or refuted.

    NOTHING DOWNSTREAM DEPENDS ON THIS TASK SCIENTIFICALLY. TASK-20260810-c98659
    (EXP-INSTR-36c8cf) is dispatched after it for host-capacity reasons only, not
    because this contract feeds it. If this task terminates
    failed_infrastructure, PREMISE-FAILED or INVALID, that does not block
    TASK-20260810-c98659; it returns to the Coordinator as its own event.

  concurrency_note: >-
    DISPATCHED STRICTLY ONE AT A TIME. This task runs ALONE. No other
    BATCH-d7e255 task -- TASK-20260810-c98659, TASK-20260810-9c2e47 or
    TASK-20260810-820328 -- may be started until this one has returned a terminal
    receipt to the Coordinator.

    THE REASON, WITH THE MEASUREMENT THAT MOTIVATES IT. The execution host has 14
    cores and, at dispatch time, a load average of 21.6 over 1 minute, 25.8 over
    5 minutes and 40.2 over 15 minutes. It is already oversubscribed by other
    sessions. GOAL-ENDO-001's campaign_budget.max_concurrent is 6; THAT FIGURE IS
    NOT AUTHORIZATION HERE and is deliberately overridden downward to 1 for this
    batch. Sizing concurrency to what the machine can actually run without
    degrading is the dispatching Coordinator's responsibility (AGENTS.md,
    "Dynamic dispatch"), and the recorded cost of getting it wrong is
    GOAL-AES-003 BATCH-002 (DEC-20260802-b226fb, budget_accounting), which lost
    one producer's entire first segment and five of eight trials in another to
    exactly this condition.

    A TIMEOUT, STALL OR DEGRADED RUN CAUSED BY HOST LOAD IS AN INFRASTRUCTURE
    EVENT under AGENTS.md rule 5, recorded as failed_infrastructure with partial
    artifacts retained. IT IS NEVER NEGATIVE MATHEMATICAL EVIDENCE and in
    particular is NEVER evidence that an invariant is constant. If the host is
    too loaded to run within the declared budget, say so and stop; do not
    silently absorb the degradation into a wall-clock measurement that later
    reads as a result.

  stage_0_gate_note: >-
    SR3 BACKEND GATE, STAGE 0 -- CLEARED FOR THE PRIMARY BACKEND. THIS IS A
    FINDING ESTABLISHED BY THE DISPATCHING COORDINATOR SESSION, NOT BY ANY RUN OF
    ANY EXPERIMENT. It is recorded here so the executor does not repeat the
    search, and it is not evidence of anything about a curve.

    WHAT IS PRESENT. SageMath 10.9 is installed on the execution host and is
    reachable as the `sage` command-line interface. It is capable of minimal free
    resolutions over F_p and satisfies the contract's primary
    computer_algebra_backend requirement. The absence-is-infrastructure branch of
    the contract does NOT fire for the primary backend.

    WHAT IS ABSENT. Macaulay2 is absent. Standalone Singular is absent. Magma is
    absent.

    HOW SAGE MUST BE INVOKED. `sage` is NOT importable from the host python3 --
    `import sage` fails. The executor must SHELL OUT to the `sage` CLI rather
    than importing Sage into the harness process, and must record the exact
    invocation in command.txt and the exact reported Sage version in
    backend-provenance.json and environment.json.

    TWO IMPLEMENTATION NOTES, BOTH OBSERVED IN THE PROBE. (1) `Ideal.betti()`
    DOES NOT EXIST in Sage 10.9 and raises AttributeError; obtain graded Betti
    numbers from the resolution object returned by `graded_free_resolution()`,
    not from a `betti()` call on the ideal. (2) The affine singular-locus
    dimension is available as `Ideal.dimension()`.

    WHAT THE PROBE DID. It computed graded free resolutions over GF(4001) for the
    ideal generated by S_3 and its partial derivatives, homogenised, in
    degrevlex, on three hand-built curves, and it independently reproduced the
    campaign's committed hand-verified monomial supports -- 13 generic, 9 at
    j = 0, and 10 at j = 1728. `Ideal.dimension()` returned 1 on all three probe
    curves.

    THE PROBE IS NOT THE EXPERIMENT, AND THIS PARAGRAPH IS BINDING. It touched
    THREE HAND-BUILT CURVES, not the 138-curve class. It establishes only that
    the instrument exists and reproduces a known fact. IT MUST NOT BE CITED AS A
    RESULT anywhere in the run record, the execution report, or any later record.
    ITS THREE-CURVE AGREEMENT MUST NOT BE REPORTED AS CONSTANCY, and the
    dimension value 1 seen on three probe curves must not be carried into any
    output as an expected or predicted value. The contract's own SR1 support gate
    and C-SUPPORT control still run in full, from scratch, inside the run.

  second_backend_note: >-
    C-BACKEND AND SUCCESS CRITERION (3) CANNOT BE MET AS LITERALLY WRITTEN WITH
    THE SOFTWARE ON THIS HOST, AND THAT IS STATED HERE BEFORE EXECUTION RATHER
    THAN DISCOVERED AFTERWARDS. The contract requires a SECOND, INDEPENDENT
    computer-algebra backend to cross-check at least 20 curves including every
    curve on which any difference is claimed. Macaulay2 and standalone Singular
    are absent, so no second independent resolution engine exists on this host.

    THE ONLY TWO CROSS-CHECK PATHS AVAILABLE, WITH THEIR EXACT LIMITS.
    (a) SAGE'S BUNDLED SINGULAR INTERFACE, INVOKED DIRECTLY. This can be driven
    as a distinct code path, but it is NOT FULLY INDEPENDENT of Sage's own
    resolution code -- it shares the same installation, the same libraries and,
    for several operations, the same underlying engine. Any agreement it produces
    is a self-consistency check across two Sage code paths and MUST BE LABELLED
    AS SUCH, never as an independent backend.
    (b) SYMPY, for the monomial-support counts, the elimination-polynomial degree
    and its F_p-factorisation type ONLY. sympy can compute these and is GENUINELY
    INDEPENDENT of Sage. sympy computes no Betti tables and no minimal free
    resolutions, so it covers NONE of the Betti, regularity or resolution-derived
    quantities.

    INSTRUCTION. RUN BOTH. Record in backend-crosscheck.json, per quantity and
    per curve, EXACTLY WHICH cross-check path covered it and which quantities are
    covered by NEITHER -- specifically the graded Betti numbers and the
    Castelnuovo-Mumford regularity, for which no independent cross-check exists
    on this host. Record the independence limitation IN THE RUN RECORD as a
    stated limitation. DO NOT claim a clean two-backend cross-check anywhere.

    IF YOU CONCLUDE THE CROSS-CHECK CANNOT MEET THE CONTRACT, THAT IS A STOPPING
    RULE TO REPORT, NOT A THING TO WORK AROUND. Raise it at stage 0, at the SR3
    backend gate, BEFORE any resolution is computed -- SR3 runs before any
    resolution precisely so this decision is made before data exists. Return it
    to the Coordinator. The Coordinator will then either file a versioned
    protocol_amendment under experiments/EXP-ICINV-e0cd8f/amendments/ BEFORE the
    affected data is generated, or record failed_infrastructure. Do not relax
    C-BACKEND yourself, do not substitute a weaker check and call it the
    cross-check, and do not proceed past SR3 on the assumption that the
    Coordinator will accept a substitute.

