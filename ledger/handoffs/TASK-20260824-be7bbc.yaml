handoff:
  id: TASK-20260824-be7bbc
  from: coordinator
  to: coordinator
  goal_id: GOAL-DIFFP-84d641
  batch_id: BATCH-f8bf86
  question_id: RQ-DIFFP-a5c483
  objective: >-
    Snapshot-archive the exact batch-1 producer package -- the opening control
    plane, the idea-generator proposal set, and the adjudicator implementation
    with its runs, census, equivalence declaration and control results -- under a
    content_first binding, with pre-freeze checks, BEFORE either independent
    review runs. Then push the branch and open or refresh the PR against main.
  uncertainty_reduced: >-
    Whether the artifacts the two reviewers will attack are the exact bytes the
    producers wrote, fixed and reachable, rather than a working tree that can
    still move under them.
  inputs:
    - >-
      Terminal receipts and artifacts of TASK-20260824-531f8a,
      TASK-20260824-873dc9 and TASK-20260824-c6625a.
    - >-
      GOAL-MD5-001 quarantine payload sha256
      e44a3fed81e9e7621697432b2124b357fc2c3f502f4bc6779df5c377b0a3e3c5, for
      re-confirmation from bytes.
    - origin/main as of this pass, for the pre-archive merge.
    - tools/validate_ledger.py and tools/research_dispatch.py.
  constraints:
    - RUNS ALONE. No other task may be running concurrently.
    - >-
      STAGE ONLY THE DECLARED PATHS. A scope-expanding commit is an
      evidence-integrity failure, not a convenience.
    - >-
      MERGE origin/main, NEVER REBASE. Record the base commit checked and the
      merge outcome in the receipt. A sync conflict inside an immutable record is
      resolved by a new superseding record under a new id, never by picking a
      side.
    - >-
      Re-confirm the quarantine payload sha256 from its BYTES without parsing it,
      and record the comparison.
    - >-
      DO NOT INTERPRET ANY PRODUCER RESULT and record no research verdict. This
      task archives; it does not review.
    - >-
      RECORD ONLY CHECKS THIS SESSION ACTUALLY RAN, with their verbatim output.
      Never record a command that was not executed.
    - >-
      If the opening coordinator_decision has still not been minted and filed,
      say so in the receipt and do not proceed to dispatch the reviews: an
      unapproved contract cannot carry a claim-changing review round.
  deliverables:
    - >-
      snapshot-receipt.json -- content_first, with path_sha256 over the declared
      snapshot set, the commit sha and parent, the merge base and outcome, the
      tools/validate_ledger.py and tools/research_dispatch.py outputs verbatim,
      the quarantine sha256 comparison, and the staged_not_in_binding_set
      disclosures (the goal head, the harness/diffpath sibling modules, and every
      producer run directory).
    - >-
      A pushed branch and a refreshed PR (#530 on branch
      claude/differential-cryptanalysis-harness-5b5fdq, opened by the driving
      session on 2026-08-24) naming GOAL-DIFFP-84d641, RQ-DIFFP-a5c483,
      EXP-DIFFP-fe894e, DEC-20260824-4f74cd, AMD-20260824-DIFFP-ACQ-1,
      BATCH-f8bf86 and every TASK-20260824-* record.
    - >-
      THE MEASURED COMMIT SHA, recorded in the receipt and carried into the goal
      head's `latest_verified_commit`. That field is deliberately still null: the
      opening session had no shell and no sha was transmitted to it, so this task
      is the first to measure one, from git, rather than the first to restate one
      it was told.
  artifact_paths:
