handoff:
  id: TASK-20260801-054
  from: coordinator
  to: red-team
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-025
  queue_role: reviewer
  role_mapping_note: >-
    This harness has no dedicated reviewer subagent; the red-team contract in agents/red-team.md
    serves the reviewer role. The serving session must record the mapping, must not have authored,
    executed, validated or frozen any artifact under review, and must state that independence here
    is PROCEDURAL and not model-level.
  objective: >-
    Decide whether the frozen EXP-LPF-001 contract and the frozen RR-LPF-1 / ATTAIN-RR-LPF-1 pair
    constitute an apparatus that can actually measure what it claims, and return PASS or REVISE with
    a recommendation to TASK-20260801-055. FOUR NAMED DUTIES, FOUR DELIVERABLE FILES, AND A GAP IN
    ANY ONE IS A REVISE.
  uncertainty_reduced: >-
    Whether this is the fifth instrument in this lane that cannot measure what it claims, or the
    first that can. THE PRIOR IS NOT FAVOURABLE AND YOU SHOULD ACT ON IT - four consecutive
    predecessors failed, each for a different and individually non-obvious reason, and every one was
    caught by EXECUTING the artifact rather than reading it.
  inputs:
  - experiments/EXP-LPF-001/specification.yaml at the TASK-20260801-048 commit
  - experiments/EXP-LPF-001/reading_rule.yaml at the TASK-20260801-053 commit
  - experiments/EXP-LPF-001/implementation/lpf001_driver.py
  - experiments/EXP-LPF-001/results/calib/
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-calib/raw-result.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/reviews/TASK-20260801-051/calibration_validation_report.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/reviews/TASK-20260801-040/
  - ledger/hypotheses/H-LPF-001.yaml
  - ledger/decisions/DEC-20260801-010.yaml
  - experiments/EXP-SMTH-001/specification.yaml
  - AGENTS.md
  - CLAUDE.md
  - docs/inventor-protocol.md
  - docs/claims-and-verification.md
  constraints:
  - 'INDEPENDENT SESSION. You did not author, execute, validate or freeze any artifact under review. Record the role mapping and state that independence is PROCEDURAL and not model-level.'
  - >-
    RECOMPUTE AND EXECUTE, DO NOT READ. Recompute every quoted number from the named raw arrays with
    your own code; re-derive every structural claim from driver SOURCE and then re-test it by
    EXECUTING the driver's own functions on your own synthetic inputs. This is what caught all four
    BATCH-024 defects and none of them would have been caught by reading.
  - >-
    DUTY 1 - ATTAINABILITY, deliverable attainability_check.md. Branch by branch and band by band,
    with the MEASURED calibration numbers, classify each branch DEMONSTRATED-REACHABLE or
    REACHABLE-IN-PRINCIPLE. A branch UNREACHABLE BY CONSTRUCTION is a REVISE. Check the three
    extensions - no branch keys on a ledger status; NO CONTROL LEG IS AN UNBANDED EXISTENTIAL and
    you must RECOMPUTE each aggregating leg's false-fire probability from pre-datum quantities, a
    value above 0.02 being a REVISE; and NO BRANCH DEPENDS ON A QUANTITY THE MEASUREMENT ARM CANNOT
    CHANGE, which you check by naming, leg by leg, which arm produces what it reads. Verify the
    recorded end-to-end probability that a correct null reaches L-2 and rule on whether the
    favourable branch could have failed.
  - >-
    DUTY 2 - ANTI-TUNING, deliverable anti_tuning_check.md. Verify AGAINST GIT that the
    TASK-20260801-048 commit is an ancestor of the TASK-20260801-050 commit and that no run artifact
    existed in the tree at the contract freeze; recompute every quoted band from its named array;
    confirm by whitespace-normalised comparison that no statistic, rung, cut, band or branch was
    added, dropped, moved or reordered after calibration; verify DRIVER_SHA256 binds one file across
    both stages; and confirm STRUCTURALLY AND AT THE LEVEL OF OBJECTS, NOT LABELS, that the
    calibration contains no real-object sample. Rule on whether every declared strike of a statistic
    is justified by its measured numbers or is a post-hoc exclusion.
  - >-
    DUTY 3 - ALTERNATIVE CLASS, deliverable alternative_class_check.md. Verify ALT-CLASS-LPF-1
    against DRIVER SOURCE. RE-DERIVE DESIGN-TRAP-LPF-1 INDEPENDENTLY rather than accepting it as
    written, and state PER FAMILY at what part of the Z-distribution its replacement moves mass and
    why it is not invariant in law. RULE EXPLICITLY ON ABS-REL-LPF-1 - can any branch be satisfied by
    a two-sample agreement alone, is the uniform arm anywhere treated as the comparison rather than
    as the calibration, and is the V1 cost of the measured band stated honestly. Rule on whether the
    certified list overstates what the ladders reach and whether anything under V1 through V7 is
    silently claimed.
  - >-
    DUTY 4 - PERTURBATION MOVEMENT, deliverable perturbation_movement_check.md. FIRST derive from
    source, independently, whether each plant family can move each certifying statistic AT ALL. THEN
    check that derivation against perturbation_movement_report.json ROW BY ROW - every family, every
    rung, every cell, every statistic. A family invariant in law, a rung with no recorded movement
    that the reading rule certifies, or a certifying statistic incapable of moving on any object in
    this experiment, is a REVISE. THIS IS THE DUTY THE BATCH EXISTS TO ADD AND IT IS THE ONE
    BATCH-024 DID NOT HAVE.
  - 'RULE EXPLICITLY ON DREAD-LPF-1, the D_formula reading that EXP-SMTH-001 flagged and no review ever adjudicated - confirm or reject it. A rejection is a REVISE.'
  - >-
    RULE ON EVERY OPEN ITEM RR-LPF-1 ROUTED TO YOU, on textual grounds where the item is a question
    of what a frozen text means, and STATE EXPLICITLY WHETHER YOUR RULING COULD HAVE BEEN MADE
    WITHOUT THE MEASURED VALUE, with the counterfactual stated in both directions.
  - 'AUTHOR NO REPAIR AND MODIFY NO ARTIFACT UNDER REVIEW. Naming what a repair would have to be is your job; writing it is the Coordinator''s.'
  - 'State the narrowest supported statement, dominated_by (NEVER null) and a QUANTITATIVE sota_delta, per docs/inventor-protocol.md section 5.'
  - 'A REVISE MUST NAME AN OBSTRUCTION, GIVE AN ARGUMENT AND NAME WHAT REMAINS OPEN. Declining a direction as exhausted is premature closure and is forbidden.'
  - 'MAKE NO COMMIT; TASK-20260801-055 archives these deliverables.'
  - 'Record inference honestly (requested review-adversarial, independent session).'
  deliverables:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/reviews/TASK-20260801-054/contract_review.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/reviews/TASK-20260801-054/attainability_check.md
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/reviews/TASK-20260801-054/anti_tuning_check.md
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/reviews/TASK-20260801-054/alternative_class_check.md
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/reviews/TASK-20260801-054/perturbation_movement_check.md
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/reviews/TASK-20260801-054/contract_review.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/reviews/TASK-20260801-054/attainability_check.md
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/reviews/TASK-20260801-054/anti_tuning_check.md
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/reviews/TASK-20260801-054/alternative_class_check.md
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/reviews/TASK-20260801-054/perturbation_movement_check.md
  archived_by: TASK-20260801-055
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 10800
    memory_gb: 8
    maximum_runs: 1
  completion_gate:
  - 'PASS or REVISE returned in contract_review.yaml with a recommendation to TASK-20260801-055 and every blocking defect listed with its location and its consequence.'
  - 'All four duty deliverables written.'
  - 'Every quoted number recomputed and every structural claim re-derived from source and re-tested by execution.'
  - 'DESIGN-TRAP-LPF-1 re-derived independently; ABS-REL-LPF-1 ruled on explicitly; the movement table checked row by row.'
  - 'DREAD-LPF-1 confirmed or rejected; every routed open item ruled on with its counterfactual stated.'
  - 'Narrowest supported statement, non-null dominated_by and quantitative sota_delta present; no repair authored; no commit made.'
