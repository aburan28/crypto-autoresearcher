handoff:
  id: TASK-20260821-26ba34
  from: coordinator
  to: validator
  goal_id: GOAL-MD5-001
  batch_id: BATCH-7215fa
  question_id: RQ-MDFIVE-6870c1
  opening_decision: DEC-20260821-84a8f1
  task_card: coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/task-cards/TASK-20260821-26ba34/task_card.yaml
  objective: >-
    Work joints V1-V5 of the pre-committed plan review-plan-2de43d.yaml: verify
    as a mechanical fact, from your own command output, that the two-directional
    dependence gate ran FIRST in BOTH directions on the SAME observable and code
    path; re-derive any claimed certificate independently; recompute the HEUR-H1
    statistics and the VARIANCE across target draws; verify MD5-arm scope from
    primary run artifacts; and establish run-artifact, seed, suite and firewall
    integrity.
  uncertainty_reduced: >-
    Whether the observed BYTES -- instrument, run records, manifests, reports --
    actually satisfy what the package claims, as a mechanical fact established
    by your own commands rather than by reading.
  inputs:
    - coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/review-plan/review-plan-2de43d.yaml (pre-committed, with the Coordinator's recorded prior)
    - The frozen package at the TASK-20260821-e2ffe4 snapshot commit
    - experiments/EXP-MDFIVE-a8e71e/specification.yaml (the acceptance criteria, the seeds, and the MD5-run clause)
    - BATCH-af29f6's DEFECT-1601d6-01 and DEFECT-1601d6-02 as declared carry-forwards (DEC-20260821-1215e5 F-7)
    - The committed RFC pins, for your own from-scratch implementations
  constraints:
    - RE-RUN, DO NOT READ. Every verdict rests on your own command output. Batch
      4's validator built independent from-scratch simulators, which is what made
      its ANOM-1 confirmation definitional rather than merely empirical.
    - Read the committed tree at the snapshot commit.
    - >-
      SIBLING BLINDNESS -- do not read TASK-20260821-2de43d's report. Attest
      `read_sibling_reports: false`.
    - >-
      YOUR METHOD IS DELIBERATELY COMPLEMENTARY to the red team's on the same
      central question: you REPLICATE the gate from the producer's own artifacts
      (you may read the instrument module and run records) while the red team
      RE-DERIVES the same predicate blind. Agreement is evidence about the
      quantity; disagreement localises to one of two named implementations. That
      is destroyed if either of you reads the other.
    - Report on your OWN joints only. Issue no whole-claim verdict.
    - >-
      Establish the five validity checks BEFORE anything else: expected run
      count, schema-complete manifests, seed integrity (regenerate the fixed
      words and declared targets from the frozen seeds with your own code),
      raw/summary agreement, control comparability. An invalid or incomplete run
      set is NOT evidence and is reported as such.
    - >-
      BATCH-HALTING findings are reported and stop there, not softened: a
      declared-scale run executed BEFORE or WITHOUT a passing gate (an SC-2
      breach that voids every declared-scale observation), a claimed certificate
      your independent recomputation cannot reproduce, or an MD5 run absent from
      the frozen contract or wider than the MD4 arm.
    - Defects concrete and actionable, none softened into a caveat. Evidence that
      is strong but not exhaustively bisected is labelled as such.
    - >-
      V3 CARRIES A SPECIFIC CHECK batch 4 could not: compute the VARIANCE of the
      matching-window count across independent target draws. Batch 4's was
      EXACTLY ZERO across 1000 draws -- ANOM-1's empirical signature. A
      non-degenerate observable must show non-zero variance; a zero or
      near-zero variance recurring under a supposedly-corrected construction is
      a BREAK, reported as a finding about the construction, not as a statistic.
    - Never read the quarantined payload (SC-6); re-confirm its sha256 from
      MANIFEST.yaml and attest non-reading.
    - Halt truthfully at the 450 s ceiling (SC-7); no Bedrock (SC-8); record the
      requested policy (review-adversarial), the reasoning effort (xhigh), and
      the RESOLVED model identifier.
  deliverables:
    - coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/reviews/TASK-20260821-26ba34/validation-report.yaml
  artifact_paths:
    - coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/reviews/TASK-20260821-26ba34/validation-report.yaml
  archived_by: TASK-20260821-6ce8a8
  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
    requested_policy: review-adversarial
    resolved_model_id: null
    fallback_used: null
    degraded_requirements: []
    routing_note: >-
      review-adversarial, NOT review-breakthrough -- see the review plan's
      policy_routing_judgement. Escalation, if its pre-committed trigger fires,
      is a SEPARATE round at max in its own independent session.
  budget:
    wall_clock_seconds: 450
    memory_gb: 8
    maximum_runs: 1
  completion_gate:
    - V1 answers all four mechanical sub-checks (ORDER, BOTH DIRECTIONS
      SEPARATELY, OBSERVABLE IDENTITY, COLD RE-RUN) from your own output; if the
      gate failed, the honesty and completeness of the stop is verified.
    - V2 either reproduces the claimed certificate independently or reports
      non-reproducibility as batch-halting.
    - V3 recomputes every H1 statistic from raw counters and reports the variance
      across target draws as a number, with the zero-variance signature
      explicitly checked.
    - V4 verifies MD5 scope from PRIMARY run artifacts, not narrative.
    - V5 answers the five validity checks, reports exact suite counts against the
      37/1/1 baseline, re-confirms the quarantine sha, and attests non-reading.
    - >-
      A top-level `verdict` field and a full `review_attestation` with
      joints_owned copied verbatim from the plan, sources_read,
      `read_sibling_reports: false`, and the resolved model.
    - >-
        `procedure_deviations` present, even if empty.
    - No whole-claim verdict issued.
  return_format: >-
    The validation report at the declared path, plus a one-line run-integrity
    determination and an explicit PASS/FAIL on the gate-ordering check.
  review_plan_path: coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/review-plan/review-plan-2de43d.yaml
  review_plan_note: >-
    YOU ARE BOUND BY THE PLAN AT review_plan_path. READ IT BEFORE YOU START; it
    is the pre-committed contract for this round and it names your joints
    (V1-V5), your worked attacks, and the Coordinator's recorded prior. The
    schema field `review_plan` below is null on purpose, and that is a
    placement decision, not an omission.
    WHY. `tools/validate_ledger.py` `check_review_plan` requires `review_plan`,
    when present, to be a MAPPING -- a path string is rejected -- so the plan is
    either inlined into a handoff or validated by nothing before the round runs.
    It IS inlined, exactly once, on ledger/handoffs/TASK-20260821-bc91f0.yaml,
    where `check_review_plan` confirms before any reviewer runs that every joint
    is owned exactly once, that each carries a worked attack plan, that
    proves_too_much names known-false objects, and that blind_from is non-empty.
    IT IS NOT COPIED HERE. Copying a frozen artifact into every envelope bound
    by it is the pattern this program deliberately avoids: TASK-20260821-372d67
    is not handed an inline copy of EXP-MDFIVE-a8e71e either, it is handed the
    path, because a producer and a reviewer alike are bound by a frozen contract
    AT A DECLARED PATH. Three copies of one plan create the possibility of two
    plans and no way to say which bound you -- the precise ambiguity a
    pre-committed plan exists to remove.
    IT SITS ON THE OPENING HANDOFF RATHER THAN ON THE SNAPSHOT BECAUSE OF
    TIMING. TASK-20260821-e2ffe4 is the operational gate that makes you
    eligible, but it runs after the idea, the gate and the executor; a
    validated copy there could not show from its placement that the plan
    predates the results. TASK-20260821-bc91f0 is committed in the batch's
    opening commit, before any producer ran. The whole evidential value of
    `coordinator_prior` is that it separates "the reviewers concurred" from "the
    reviewers concurred with what the Coordinator already believed", and that
    separation is a fact about WHEN the prior was fixed.
    ON ANY DIVERGENCE between the file and the inline copy, THE FILE AT
    review_plan_path WINS, and the divergence is itself a defect for you to
    record in `procedure_deviations` -- never reconciled by editing either copy.
  review_plan: null
