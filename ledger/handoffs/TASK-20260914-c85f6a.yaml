      container-runtime environment variables that declare a memory ceiling
      (e.g. inspect environment for anything naming a memory limit); (c) whether
      this session's own harness documentation (if readable from inside the
      sandbox) discloses a configured container memory ceiling. If none of these
      yields a number, say so plainly: 'no aggregate memory ceiling is
      discoverable from inside this runtime class' is itself a complete and
      useful answer, not a failure to hide.
    - >-
      SAGE-BUNDLED PYTHON: capture, in a declared retained log, the resolved
      path, realpath and sha256 of the Python interpreter that 'sage -python'
      itself launches (e.g. via sys.executable and sys.version from inside a
      'sage -python' child, hashed the same way the existing probes hash
      python_path/sage_path). This must appear in the log file itself, not only
      in this task's own prose summary, so a future Coordinator can independently
      corroborate it the way this coordinator could not for the prior value.
    - >-
      BEDROCK IS PROHIBITED (AGENTS.md core rule 16). MACHINE PROTECTION IS NOT A
      RESEARCH BUDGET AND IS NOT WAIVED -- this task investigates and reports the
      memory guard, it does not weaken or bypass it.
    - >-
      RECORD YOUR OWN PROVENANCE TRUTHFULLY, matching TASK-20260914-861bb9's
      practice.
    - >-
      FAILURE IS A VALID RETURN. If neither open item can be closed, report that
      plainly with commands and outputs retained; this does not authorize
      inventing a value and does not constitute negative evidence about
      H-FROB-73df22.

