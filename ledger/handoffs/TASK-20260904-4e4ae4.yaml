handoff:
  id: TASK-20260904-4e4ae4
  from: coordinator
  to: executor
  created_at: '2026-09-04'
  experiment_id: EXP-MONO-4e6faa
  hypothesis_id: H-MONO-d4c511
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001

  objective: >-
    Execute EXP-MONO-4e6faa: find a curve where the m=4 symmetric-base
    census's own exact closed form (IDEA-20260904-4f614a) has a genuinely
    untested, nonzero contribution (h_->0), then exhaustively census its
    distinct-split stratum and check the formula's own prediction exactly.

  authorized_by: coordinator
  authorization_basis: >-
    DEC-20260904-dd58c3's own next_action (1), specialized to
    IDEA-20260904-4f614a's own named cheapest decisive test.

  background_you_need: >-
    Read `ledger/proposals/IDEA-20260904-4f614a.yaml` in full for the
    complete derivation and the closed form's own exact statement. In
    brief: for a curve with full rational 2-torsion (Z=3), the fixed
    points of the three nontrivial 2-torsion translation involutions on
    the x-line partition into "positive" (n_+) and "negative" (n_-)
    halvings, with n_+ + n_- + n_0 accounting for all admissible base
    points (n_0 being points fixed by no involution). h_+ =
    (#E(F_p)[4]-tau)/4 and h_- = (#E^d(F_p)[4]-tau)/4, where E^d is the
    QUADRATIC TWIST of E (same A, twisted B, or equivalently y^2 =
    x^3+A d^2 x + B d^3 for a fixed non-residue d -- #E^d(F_p) =
    2p+2-#E(F_p)). Read the idea's own mechanism field for the exact
    definitions and the closed-form formulas for #1^4, #2+1+1, #2+2 on
    the distinct-split stratum (D = h_+ n_- + h_- n_+).

  what_to_do:
    - >-
      STAGE 0: scan ordinary curves at toy primes in [101,2000] (vary A,B;
      you may also vary the prime if a systematic scan at one prime is
      unproductive) until you find one with Z=3 (full rational 2-torsion)
      AND h_- > 0 (i.e. #E^d(F_p)[4] > tau, meaning the quadratic twist
      has MORE than just its own 2-torsion rational -- extra rational
      4-torsion). Compute #E(F_p) via any correct method (e.g. brute-force
      point counting is fine at these toy primes), #E^d(F_p) = 2p+2-#E(F_p),
      tau (the number of rational 2-torsion points, matching this
      program's own established convention -- check EXP-MONO-0e6e8f's own
      code for the exact definition if unsure), and #E[4]/#E^d[4] (the
      number of points of order dividing 4 on E and on its twist
      respectively -- you will likely need to actually construct E^d and
      count its own 4-torsion directly, or use a known formula relating
      #E^d[4] to E's own arithmetic if you can derive/verify one; when in
      doubt, direct construction and counting is safest and this program's
      own established preference). Disclose the exact number of curves
      scanned before success, or report exhaustion if the declared range
      yields none.
    - >-
      STAGE 1: on the found curve, exhaustively enumerate the
      distinct-split (Z=3) residual stratum -- i.e. all (e1,e2,e3) such
      that g(X)=X^3-e1X^2+e2X-e3 splits into THREE DISTINCT F_p-rational
      roots (reuse EXP-MONO-0e6e8f's own already-verified
      implementation/run_uncond_census.py logic for constructing Q_e(T)
      and classifying its factorization pattern -- load by file path,
      read-only). Tabulate exact #1^4, #2+1+1, #2+2 counts (and the other
      two classes too, for completeness, though they are not the primary
      metric here).
    - >-
      STAGE 2: compute the closed form's own predicted #1^4 and #2+1+1
      from the found curve's own (n_+, n_-, h_+, h_-) values (per the
      idea's own exact formula), and report R1 = observed - predicted for
      #1^4, and R2 = observed - predicted for #2+1+1. Report these EXACTLY,
      whether zero or not -- do not round, do not average, do not discard
      a nonzero residual.

  constraints:
    - Do not silently widen the search range after seeing a Stage-1 or Stage-2 result.
    - Do not discard or "explain away" a nonzero residual -- report it as the headline finding if it occurs.
    - One run directory: runs/RUN-MONO-4e6faa-1/, full manifest per docs/evidence-and-reproducibility.md.
    - No network access. Budget per specification.yaml.
    - Any infrastructure failure is failed_infrastructure, never mathematical evidence.
    - >-
      If you cannot find a qualifying curve within a reasonable scan (say,
      a few hundred curves across a few primes) and budget allows,
      widening to a WIDER prime range declared BEFORE any Stage-1/2 result
      is acceptable and should be disclosed as part of Stage 0's own
      search description -- this is different from widening AFTER seeing
      a disconfirming result, which is prohibited.

  budget: see experiments/EXP-MONO-4e6faa/specification.yaml `budget` block.

  completion_gate: >-
    execution_report.yaml filed with Stage 0's exact search outcome (curve
    found with full parameter disclosure, or exhaustion reported), Stage
    1's exhaustive per-class counts, and Stage 2's exact R1/R2 residuals
    -- before any snapshot archive or dispatch to independent review.

  next_step_after_completion: >-
    Coordinator isolated snapshot archive of the run package (exact
    declared paths), then independent Validator + Red Team dispatch,
    continuing this sub-lane's own established review discipline.

  inference:
    requested_policy: executor-implementation
    reasoning_effort: medium
    runtime: claude_code
    resolved_model_id: claude-sonnet-5
    model_verified: true
    fallback_used: false
