    - the vendored binary_field.py sha256 matches its source and both are recorded
    - no degree of any kind is asserted anywhere in the output
    - no evidence record written and no hypothesis status changed
  return_format: >
    arm D first, with per-draw ratios and the verdict it forces. Then the derivation
    with c' and c and the surface shape in m. Then the builder and affine-invariance
    verdicts. Then the eight controls one by one and the two nearby objects. State
    plainly what you could not reach and why. No prose conclusion about the paper and
    no claim about any curve.
  review_plan: null
  review_plan_note: >
    null because this handoff dispatches PRODUCTION. A claim-changing review round
    over its output is a separate handoff and will carry its own plan. If a run under
    this handoff supports the exponent-localisation claim, that round is where it is
    tested -- and the review tier is review-adversarial, not review-breakthrough,
    because no degree measurement and hence no conditional exponent improvement can
    come out of this contract.
