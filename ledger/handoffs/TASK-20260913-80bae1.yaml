handoff:
  id: TASK-20260913-80bae1
  recorded_at: '2026-09-13'
  from: coordinator
  to: executor
  goal_ids: [GOAL-SEMBIN-cbf422]
  batch_id: BATCH-9d649f
  authority: DEC-20260913-cb5ee2
  objective: >
    Execute EXP-SEMBIN-92724f: test the four parts of H-SEMBIN-c59e50 that need no
    algebra engine, and separate them cleanly from the one part that does.
    (D) FIRST, and it gates everything: enumerate the coset-typed family
    prod_i (V + v_i) and the untyped multiset family from V exhaustively, count the
    distinct achievable sums EXACTLY, and compare the ratio against the predicted m!.
    (A) Confirm log2(m!) is the unique m-growing term in the balance of
    eqs. (15)-(16), that equating the stages returns c' = sqrt(2 ln 2) and
    c = 1.698644, and that the typed objective is monotone decreasing in m with no
    interior optimum. (B) Build the typed and untyped chained Boolean systems by Weil
    descent and compare them COEFFICIENT-WISE. (C) Expand deg_{F_2} S_3 and
    deg_{F_2} y_1 S_3 under the affine substitution x_i = v_i + y_i symbolically.
  uncertainty_reduced: >
    Whether Semaev's exponent constant 1.6986 is carried by the m! symmetry factor
    alone, and whether a published coset-typed factor base removes that factor at
    zero cost in the chained presentation. The first is a derivation; the second
    rests on a counting claim -- that typing multiplies the reachable image by m!
    because the domain is m! times larger and both maps are near-injective below
    saturation -- which is exactly measurable by enumeration at n <= 17 and is
    otherwise assumed.
  inputs:
    - experiments/EXP-SEMBIN-92724f/specification.yaml
    - ledger/hypotheses/H-SEMBIN-c59e50.yaml
    - ledger/proposals/IDEA-20260913-8138a0.yaml
    - ledger/decisions/DEC-20260913-cb5ee2.yaml
    - inputs/SEMAEV-2015-310/paper_fulltext.md
    - inputs/SEMAEV-2015-310/tables.yaml
    - knowledge/literature/KN-LIT-fa346d.md
    - knowledge/literature/KN-LIT-439.md
    - knowledge/techniques/KN-TECH-b18366.md
    - experiments/EXP-SEMBIN-354a75/code/binary_field.py
  constraints:
    - >
      MEASURE NO DEGREE. No Groebner engine is installed on this host and this
      program's own first-fall instruments import sage.all, so any degree number
      would be unmeasured. Do not report, estimate, guess, or assert a degree of
      regularity, a first-fall degree, or a d_F4 -- including the statement that a
      degree is PLAUSIBLY 4. HEUR-A1T is carried as an explicitly unvalidated
      premise and saying so is part of the deliverable.
    - >
      RUN ARM D FIRST. It costs seconds, it can refute the entire hypothesis, and
      the contract's stopping rules require it before the expensive arms. Running
      the cheap refutation last is the wrong order and is forbidden here.
    - >
      EXHAUSTIVE, NEVER SAMPLED. A cell that does not fit its cap is recorded
      UNREACHED with the domain size it needed. At small mk - n a sampled image size
      has variance comparable to the effect, so sampling is the cheapest way to
      manufacture a discrepancy that is not there.
    - >
      VENDOR THE FIELD ARITHMETIC, DO NOT IMPORT IT ACROSS EXPERIMENTS. Copy
      experiments/EXP-SEMBIN-354a75/code/binary_field.py byte-for-byte into your own
      code directory and record the sha256 of both copies plus a statement that they
      match. A run package must stay reproducible after the other experiment's
      directory changes. Do not edit the vendored copy; if it needs a fix, report the
      fix and the divergence rather than silently forking the arithmetic. Re-run its
      self-checks before trusting it -- every count flows through it.
    - >
      VERIFY THE COSET REPRESENTATIVES PER DRAW. A "random" v_i may accidentally lie
      in V or in a coset already used, silently collapsing the types so that the m!
      is not removed. Check pairwise distinctness modulo V per draw and REJECT rather
      than reporting a small saving.
    - >
      Report per-draw values, not their means: the image-size ratio for all 20 draws,
      the fibre-size distribution and its tail, and the largest coefficient-wise
      builder discrepancy over all draws rather than a pass rate. A mean of m! is
      consistent with some draws collapsing and others exceeding it.
    - >
      Do NOT edit IDEA-20260913-8138a0. It is an immutable ledger record carrying one
      inconsistent figure (its n = 283, m = 8 typed saving quotes log2(8!) = 15.299
      where the claim's log2((m-1)!) is log2(7!) = 12.299). Re-derive all three
      figures from scratch and report the corrected value in YOUR output.
    - >
      Observations only. Write no evidence record, move no hypothesis, and state no
      conclusion about the security of any curve. The polynomial-time branch is a
      reductio against a premise; if your report reads as "ECDLP in n^{14}", it is
      wrong.
  deliverables:
    - exact image sizes typed and untyped, per cell per draw, retained in full
    - the image-size ratio against the predicted m!, per draw and per cell
    - the fibre-size distribution per cell with its Poisson tail comparison
    - >
      the symbolic derivation of c' = sqrt(2 ln 2) and c = 1.698644 with every
      m-dependence exhibited term by term, not merely a numeric fit
    - >
      the full typed and untyped cost surfaces over (n, m) at every (omega, omega')
      and both k readings, as data rather than as argmins, with the near-optimal
      region width in m
    - the 36-cell Table 3 reproduction with residuals under both k readings
    - >
      the three re-derived typed stage-1 saving figures including the corrected
      n = 283, m = 8 value
    - coefficient-wise typed-versus-untyped builder comparison per cell per draw
    - >
      the written-out symbolic expansion of deg_{F_2} S_3(u, v_1+y_1, v_2+y_2) and
      deg_{F_2} y_1 S_3(u, v_1+y_1, v_2+y_2), with a verdict on whether the
      d_ff = 4 argument transfers
    - the required-degree floor re-derived with its coefficient at each omega
    - all eight control outcomes, each stated separately
    - >
      both proves-too-much nearby-object outcomes -- Galbraith-Gebregiyorgis's
      symmetrised presentation and Trimoska et al.'s search-side setting -- with the
      reason the argument does or does not go through on each
    - >
      an explicit statement that no degree was measured and that HEUR-A1T remains
      unvalidated on this host
  write_scope:
    - experiments/EXP-SEMBIN-92724f/code/
    - experiments/EXP-SEMBIN-92724f/runs/RUN-SEMBIN-cbd770/
  artifact_paths:
    - experiments/EXP-SEMBIN-92724f/runs/RUN-SEMBIN-cbd770/manifest.yaml
    - experiments/EXP-SEMBIN-92724f/runs/RUN-SEMBIN-cbd770/raw-result.json
