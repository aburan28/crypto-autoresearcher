handoff:
  id: TASK-20260916-ec9948
  from: coordinator
  to: coordinator
  role: coordinator
  kind: archive
  archive_kind: snapshot
  batch_id: BATCH-94168f
  goal_id: GOAL-ICPERF-e6b6a4
  recorded_at: '2026-09-16'
  state: queued

  title: >-
    BATCH-94168f snapshot archive: commit and push the nine design records of
    DEC-20260916-3c0cf5 in one isolated commit, verify the receipt against
    Git, and open or refresh the PR against main naming them

  objective: >-
    Make the BATCH-94168f design package DURABLE. DEC-20260916-3c0cf5 approves
    EXP-ICPERF-2f2e40, and an approval that exists only in a working tree is
    not an approval: AGENTS.md rule 7 says a ledger record is not official
    until the dispatcher's post-commit verifier accepts it, and
    agents/coordinator.md says a record that exists only in a local commit is
    unpublished and must not be treated as durable evidence. This task
    commits, verifies, pushes, and publishes.

  uncertainty_reduced: >-
    None. This is an archival act. It measures nothing, runs nothing, and
    changes no research state beyond making an already-recorded state durable.

  why_exactly_one_archival_task: >-
    AGENTS.md "Durable research commits": every theory, ledger record and goal
    checkpoint is assigned to EXACTLY ONE archival task. All nine records
    below are assigned to this one. No other task in this batch stages any of
    them, and this task stages nothing else.

  why_snapshot_and_not_ledger: >-
    Following the precedent this goal already set for a design package
    (TASK-20260915-6d72a0, which archived DEC-20260915-428a17 and its eight
    sibling design records as a SNAPSHOT at commit f4f2dfa80). A ledger
    archive binds evidence records and the state transitions they support;
    this batch composed no evidence record, assigned no evidence strength, and
    moved no hypothesis on evidence. Its transition is a protocol approval,
    which the decision record itself carries. The ledger archive for this lane
    is owed later, when a producer has run and been independently reviewed,
    and it will be a separate card.

  inputs:
    - ledger/goals/GOAL-ICPERF-e6b6a4/goal.yaml (READ ONLY -- not staged, not edited; BATCH-a33cda owns it)
    - coordination/goals/GOAL-ICPERF-e6b6a4/lanes/BATCH-94168f.lane.json (already committed; declares this lane and its write scope)
    - ledger/decisions/DEC-20260916-3c0cf5.yaml (this batch's decision, the authority for everything staged)

  constraints:
    - >-
      RUN THIS ARCHIVE ALONE. No concurrent worker commits into this worktree
      while it runs (AGENTS.md: "Workers do not commit into a shared
      worktree"; "Commit tasks run alone").
    - >-
      STAGE ONLY THE DECLARED PATHS. A scope-expanding commit is an
      evidence-integrity failure, not a convenience. In particular do NOT
      stage ledger/goals/GOAL-ICPERF-e6b6a4/goal.yaml,
      coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-a33cda/** , or
      anything under experiments/EXP-ICPERF-e21835/,
      experiments/EXP-ICPERF-13f001/ or experiments/EXP-ICPERF-66fd51/ --
      those belong to BATCH-a33cda and to frozen predecessors.
    - >-
      BEFORE COMMITTING: fetch origin/main and MERGE it into
      claude/index-calculus-graph-dag-3linyk. MERGE, NEVER REBASE -- rebasing
      a branch that carries pushed run records rewrites the commits those
      records were archived in. Re-run tools/validate_ledger.py on the merged
      tree. Record the base commit checked and the merge outcome in the
      receipt.
    - >-
      A SYNC CONFLICT INSIDE ANY IMMUTABLE RECORD IS NEVER RESOLVED BY PICKING
      A SIDE. If merging main conflicts inside a ledger record, an experiment
      contract or a knowledge entry, STOP and create a superseding record
      under a new identifier. Do not edit either side.
    - >-
      DO NOT EDIT ANY RECORD TO MAKE THIS ARCHIVE TIDIER. The nine files are
      frozen as written. If one of them is wrong, the remedy is a correction
      record, never an edit.
    - >-
      NO IDENTIFIER MAY BE MINTED BY THIS TASK. Every identifier in the
      package was pre-allocated and --check verified. If a new record turns
      out to be needed, stop and request an identifier.
    - >-
      AFTER COMMITTING: push the branch and open or refresh a PR against main
      NAMING the records (agents/coordinator.md "Branch and PR discipline").
      An archive that adds new H-*, EXP-*, DEC-* and TASK-* records and is not
      pushed to a branch with an open PR is unpublished.
    - This task launches no trial, runs no experiment, and writes no experiment implementation code.

  deliverables:
    - One isolated commit containing exactly the nine declared artifact_paths.
    - >-
      An archive receipt under
      coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-94168f/archives/,
      per templates/research-records.md "Coordinator archive receipt": kind
      snapshot, source_task_ids, commit_sha, parent_sha, path_sha256 for every
      declared path, and record_ids.
    - A post-commit verification of that receipt against Git, reported pass or fail.
    - The pushed branch and an open or refreshed PR against main naming the records.
    - The base commit of origin/main checked and the merge outcome, recorded in the receipt.

  artifact_paths:
    - ledger/decisions/DEC-20260916-3c0cf5.yaml
    - ledger/hypotheses/H-ICPERF-afe62e.yaml
    - ledger/hypotheses/H-ICPERF-81de5c.yaml
    - ledger/hypotheses/H-ICPERF-f08b1e.yaml
    - experiments/EXP-ICPERF-2f2e40/specification.yaml
    - experiments/EXP-ICPERF-61c136/specification.yaml
    - experiments/EXP-ICPERF-42ef30/specification.yaml
    - ledger/handoffs/TASK-20260916-ec9948.yaml
    - ledger/goals/GOAL-ICPERF-e6b6a4/checkpoints/BATCH-94168f.yaml

  also_staged_sha256:
    - coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-94168f/dispatch_queue.json
  also_staged_note: >-
    The queue is committed in the same commit but is NOT hash-bound as an
    artifact_path, for the fixed-point reason BATCH-a33cda recorded against
    TASK-20260915-1942e2: a queue file that records this task's own state
    transition cannot have its post-commit bytes declared before the commit
    that changes them.

  archived_by: TASK-20260916-ec9948
  archived_by_note: >-
    SELF-OWNED, WHICH IS CORRECT AND NOT A LOOP. An archival card is itself a
    record and must be owned by exactly one archival task; the only task that
    can stage it in the same isolated commit as the package it archives is
    this one. This mirrors TASK-20260915-6d72a0, whose completed archive bound
    "the 9 design records the receipt declared, plus the receipt".

  write_scope:
    - ledger/decisions/DEC-20260916-3c0cf5.yaml
    - ledger/hypotheses/H-ICPERF-afe62e.yaml
    - ledger/hypotheses/H-ICPERF-81de5c.yaml
    - ledger/hypotheses/H-ICPERF-f08b1e.yaml
    - experiments/EXP-ICPERF-2f2e40/
    - experiments/EXP-ICPERF-61c136/
    - experiments/EXP-ICPERF-42ef30/
    - ledger/handoffs/TASK-20260916-ec9948.yaml
    - ledger/goals/GOAL-ICPERF-e6b6a4/checkpoints/BATCH-94168f.yaml
    - coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-94168f/

  read_scope:
    - ledger/
    - experiments/
    - coordination/goals/GOAL-ICPERF-e6b6a4/
    - templates/research-records.md
    - AGENTS.md
    - agents/coordinator.md

  not_in_scope:
    - ledger/goals/GOAL-ICPERF-e6b6a4/goal.yaml
    - coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-a33cda/
    - coordination/review/icperf-20260915-a33cda/
    - experiments/EXP-ICPERF-e21835/
    - experiments/EXP-ICPERF-13f001/
    - experiments/EXP-ICPERF-66fd51/
    - ledger/hypotheses/H-ICPERF-5f038b.yaml
    - experiments/EXP-ICPERF-025a52/
  not_in_scope_reason: >-
    The first six belong to BATCH-a33cda, which another session is actively
    working; the last two belong to the descent-as-a-DAG lane
    (DEC-20260915-d8d413, approval withheld), which a third session may resume
    at any point without this one being told. GOAL-ICPERF-e6b6a4's head is
    excluded deliberately and at a stated cost: this batch's state lives in the
    write-once checkpoint shard and in the already-committed lane file instead,
    so a reader of goal.yaml alone will not see this batch and must run
    `tools/goal_lanes.py lanes GOAL-ICPERF-e6b6a4` or read the checkpoints
    directory. That cost is paid to avoid racing another live lane for one
    file (CLAUDE.md "Goal checkpoints are one file per batch").

  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false

  budget:
    wall_clock_seconds: 1800
    memory_gb: 2
    maximum_runs: 0
  budget_note: >-
    maximum_runs is 0 and is a HARD scientific constraint rather than an
    estimate: an archival task performs no trial. wall_clock_seconds and
    memory_gb are advisory machine-protection figures (CLAUDE.md research
    budget policy); no field here is null, so this card is not self-rejected
    by the Coordinator's own budget rule.

  dispatch_preconditions:
    - id: DP-1
      condition: >-
        No other task is writing this worktree. Archive commits run ALONE.
      binds: the dispatching session, before launch
    - id: DP-2
      condition: >-
        origin/main has been fetched and merged into
        claude/index-calculus-graph-dag-3linyk (merge, never rebase), and
        tools/validate_ledger.py reports no NEW errors on the merged tree.
      binds: the dispatching session, before launch
    - id: DP-3
      condition: >-
        All nine artifact_paths exist in the working tree with their final
        content, and none of the not_in_scope paths is dirty.
      binds: the dispatching session, before launch
    - id: DP-4
      condition: >-
        A lane is held on GOAL-ICPERF-e6b6a4 for BATCH-94168f
        (tools/goal_lanes.py), respecting max_concurrent = 2. The lane file
        coordination/goals/GOAL-ICPERF-e6b6a4/lanes/BATCH-94168f.lane.json is
        already committed; a TASK CLAIM is a separate act and is this
        precondition.
      binds: the dispatching session, before launch
  dispatch_preconditions_note: >-
    AGENTS.md "Dispatch preconditions bind the DISPATCHER, not the agent":
    these four bind the SESSION DOING THE LAUNCHING and must be satisfied
    BEFORE launch, not discovered afterwards. They are not waived by the work
    turning out fine. The three standing preconditions apply whether listed or
    not; `archived_by` is bound (to this card itself, see archived_by_note),
    the declared inputs are committed, and DP-4 is the lane claim.
    CORR-20260915-6708e4 records a violation of exactly these on this goal's
    other lane, caught by the dispatched agent rather than by the dispatcher.

  completion_gate:
    - The commit exists, is reachable from HEAD, and has the expected parent.
    - The commit changes EXACTLY the nine declared artifact_paths plus the one also_staged path, and nothing else.
    - Every declared path's sha256 in the receipt matches the committed tree.
    - The commit message names TASK-20260916-ec9948, DEC-20260916-3c0cf5, and the six H-/EXP- record ids.
    - The receipt records the origin/main base commit checked and the merge outcome.
    - The post-commit verifier ACCEPTS the receipt. Until it does, nothing in this package is official (AGENTS.md rule 7).
    - The branch is pushed and a PR against main is open or refreshed, naming the nine records.
    - '`tools/validate_ledger.py` passes on the committed tree with no new errors attributable to these nine files.'

  return_format: >-
    The archive receipt path; commit_sha and parent_sha; the verifier's
    pass/fail with its exact message; the origin/main base commit and merge
    outcome; the PR url or number; and the validate_ledger result. Report any
    refusal or scope expansion rather than working around it.

  review_plan: null
  review_plan_note: >-
    Null because this card opens no claim-changing review round. The review
    round that IS owed -- an independent validation of EXP-ICPERF-2f2e40's
    output once it has run -- needs its own card and its own plan, written
    before any reviewer runs, and no reviewer identifiers were allocated to
    this lane. DEC-20260916-3c0cf5 next_actions names the three joints that
    plan must own.
