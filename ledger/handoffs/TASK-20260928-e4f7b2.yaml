# =============================================================================
# TASK-20260928-e4f7b2 -- SNAPSHOT ARCHIVE for TASK-20260928-9e14ac's producer
# artifacts, and the carrier of the review_plan for the claim-changing round that
# follows it.
#
# WRITTEN AND NOT DISPATCHED. It cannot run before the producer it archives.
#
# The review_plan is written HERE AND NOW, before any implementation exists and
# before any outcome has been observed by anyone. That is the whole point: a
# prior recorded afterwards is indistinguishable from a prior that was never
# held, and the Coordinator's prior on this lane is unusually strong and must
# therefore be on the record before it can be flattered.
# =============================================================================
handoff:
  id: TASK-20260928-e4f7b2
  from: coordinator
  to: coordinator
  objective: >-
    Snapshot-commit exactly TASK-20260928-9e14ac's declared producer artifacts --
    code, run directory, RESULTS.md -- before any independent agent reviews them,
    and verify the receipt. Interpret nothing.
  uncertainty_reduced: >-
    Whether the producer's artifacts are fixed bytes that reviewers and the
    Coordinator are looking at the same version of. Reviewing an uncommitted
    working tree is reviewing something that can change under the reviewer.
  inputs:
    - experiments/EXP-SEMBIN-04ec3c/code/
    - experiments/EXP-SEMBIN-04ec3c/runs/
    - experiments/EXP-SEMBIN-04ec3c/RESULTS.md
    - ledger/handoffs/TASK-20260928-9e14ac.yaml
  constraints:
    - RUNS ALONE. Stages only the declared paths. No ledger record is staged by this card.
    - Merge origin/main in first; merge, never rebase. Record base commit and merge outcome.
    - >-
      DO NOT write, edit, or grade any EV-* record, and do not move any status.
      This card archives a producer; the evidence record and the decision belong
      to a later ledger archive after the review round below returns.
    - >-
      If the producer reported a stopped run under amendment A1's signature check,
      ARCHIVE THE STOPPED RUN AS IT IS. A halted run is a preserved observation
      with an infrastructure or defect reason, never a negative mathematical
      result and never something to re-run into a cleaner history.
  deliverables:
    - one isolated snapshot commit of exactly the declared producer paths
    - a post-commit receipt with base commit, merge outcome, and path_sha256 per path
    - a pushed branch and a refreshed PR naming the run id
  artifact_paths:
    - experiments/EXP-SEMBIN-04ec3c/code/
    - experiments/EXP-SEMBIN-04ec3c/runs/
    - experiments/EXP-SEMBIN-04ec3c/RESULTS.md
  archived_by: TASK-20260928-e4f7b2
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 1800
    memory_gb: 2
    maximum_runs: 0
  dispatch_preconditions:
    - TASK-20260928-9e14ac has returned a terminal receipt.
    - >-
      The declared producer paths exist and are non-empty. A missing deliverable
      is returned to the Executor with concrete defects listed; it is not
      archived partially and it is not filled in by the Coordinator in prose.
  completion_gate:
    - commit reachable from HEAD with the expected parent
    - changes exactly the declared artifacts
    - every declared path_sha256 verifies against the tree
    - commit message names TASK-20260928-e4f7b2 and the run id
    - branch pushed and PR refreshed

  # =========================================================================
  # REVIEW PLAN for the claim-changing round that follows this snapshot.
  # Written before any reviewer runs and before any result exists.
  # =========================================================================
  review_plan:
    id: REVIEW-SEMBIN-20260928-04ec3c
    opens_round_for: [EXP-SEMBIN-04ec3c, H-SEMBIN-8e7ae3]
    why_claim_changing: >-
      Its outcome is the only thing that can move H-SEMBIN-8e7ae3 off `specified`
      toward `analyzed`, and its negative reading would be quoted as a bound on
      the whole decomposition-oracle family over all summand counts. That is a
      family-wide statement and it gets a round.

    claim_under_review: >-
      AS ITS PRODUCER STATES IT, quoted from H-SEMBIN-8e7ae3.statement rather than
      restated by the Coordinator: "On a binary curve of prime extension degree n,
      an m-summand index calculus whose decomposition oracle is a generic m-SUM
      search cannot fall below the van Oorschot-Wiener rho baseline at any summand
      count without a store whose size exceeds rho's entire work. Concretely: the
      store exponent required for any sub-rho cell is bounded below by n/2, so the
      memory alone costs at least what the attack it replaces costs in total."
      Under review together with the artifacts EXP-SEMBIN-04ec3c produces for it
      and with the contract's own scoping: claim_tier heuristic_estimate,
      conditional on HEUR-GENERIC-MSUM and HEUR-VOW-CURVE, over the eleven listed
      prime binary degrees, with the store budget-constrained and reported on both
      sides rather than charged into any cost (amendment A5).

    coordinator_prior_meta:
      recorded_before_any_report: true
      recorded_before_any_implementation_exists: true
    coordinator_prior: >-
        I EXPECT P1, P2, P3a AND P4 TO BE CONFIRMED, AND I EXPECT THAT
        CONFIRMATION TO BE NEARLY WORTHLESS. I derived them myself from the
        contract's cost_model before approving it, and the contract's author
        derived them independently before writing it. Specifically I expect: total
        = m! * 2^(n + d(1-s)) under MITM_CAPPED, hence ENUM at s = 1 giving
        m! * 2^n independent of d; MITM with store free balancing against the
        linear-algebra term at d = n/(floor(m/2)+1) for cost 2^(2n/(floor(m/2)+1)),
        so m = 8 is the first row strictly below 2^60.8090 at n = 131 and m = 6
        lands at 2^65.5, near it and above; the minimum store exponent
        S/(S-1)*(n/2 + log2 m!) exceeding n/2 at every m and minimising near
        2^107.7 entries at m = 8 for n = 131; and no cell at B <= 2^80 below
        either baseline at any listed degree, with n = 97 the tightest at a
        required ~2^85 against the 2^80 budget -- roughly five bits of margin,
        which is the thinnest number in the whole sweep and the place P5 is most
        likely to break.
        WHAT WOULD OVERTURN THIS PRIOR: a sub-rho cell at a store the machine could
        hold; a P5 counterexample at n = 97 or n = 109, where my own margin is
        thinnest; or a demonstration that the closed forms above mis-account the
        relation count or the linear algebra.
        WHY RECORDING THIS IS NOT THE 992e73 DEFECT, stated because the resemblance
        is real and the difference is the whole engagement: DEC-20260918-4b7e21
        refused EXP-SEMBIN-992e73 because its predictions had been read AGAINST
        THEIR OWN OBSERVED OUTCOMES by the approving authority -- a run existed and
        was marked confirmed. Here no run exists, no outcome has been observed, and
        what I hold is a theoretical prior about what a model implies. The remedy
        for an anchored prior is to write it down and strip its confirmation of
        evidential force, which amendment A2 does. The remedy is NOT to pretend the
        prior is absent.

    joints:
      - joint: >-
          J1 -- THE COST-MODEL ALGEBRA. That relations x trials x oracle =
          m! * 2^(n + d(1-s)) under MITM_CAPPED; that the store-free MITM closed
          form is 2^(2n/(floor(m/2)+1)) when balanced against the linear-algebra
          term 2^(2d); and that the minimum store exponent admitting a sub-rho cell
          is S/(S-1)*(n/2 + log2 m!) with S = floor(m/2). Every reported cell rests
          on these three.
        assigned_to: TASK-20260928-a1c7e5
        attack_plan: >-
          Re-derive all three from specification.yaml's cost_model relations alone,
          then attack the two places I think they are weakest. FIRST, the relation
          count: the contract takes one relation per factor-base element and calls
          the excess a declared constant -- determine whether the excess is really
          O(1) in m or whether it grows, because it multiplies the entire stage-1
          product and a growing excess shifts every row. SECOND, AND THE ONE MY
          PRIOR DOES NOT COVER AT ALL: ODD m. The model pairs store |F|^s at
          s <= floor(m/2) with time |F|^(m-s), so at odd m the MITM time is
          |F|^ceil(m/2) against store |F|^floor(m/2) and the two do not balance; my
          closed forms were checked at EVEN m only. Compute whether any odd m beats
          both of its even neighbours in required store. I think it does not, but I
          have not checked, and if it does then P4's argmin is wrong.
        breaking_artifact: >-
          A worked counter-derivation exhibiting a specific (degree, m, d, s) cell
          whose correct total differs from the closed form by more than rounding,
          or an odd-m row with required store below its even neighbours.
      - joint: >-
          J2 -- WHETHER THE AMENDED C-FLOOR-REPRO STILL HAS FAILURE POWER. A1
          removed the offset magnitude from the gate because the authored 5-bit
          tolerance was unsatisfiable at m = 8, and replaced it with structure
          (ordering, monotone decrease in m, margin signs) plus a declared offset
          signature. The question is whether what remains can still fail.
        assigned_to: TASK-20260928-3f90b8
        attack_plan: >-
          Construct a WRONG implementation that PASSES the structural gate --
          ordering preserved, monotone decrease in m, m = 3 above rho and m = 4
          below -- while carrying a wrong oracle exponent. If you can build one, the
          A1 repair traded a control that fails on correct code for one that passes
          on incorrect code, and that is strictly worse. Then test whether the A1
          offset SIGNATURE (positive, monotone in m, within 1.5 bits of 2*log2 m)
          catches your construction. That signature is the part I added to carry the
          failure power and it is the part most likely to be either redundant or
          insufficient.
        breaking_artifact: >-
          A concrete wrong cost function that passes both the structural gate and
          the signature check. Its existence would mean C-FLOOR-REPRO must be
          replaced rather than amended.
      - joint: >-
          J3 -- HEUR-GENERIC-MSUM, which carries the entire result: that m-SUM over
          the point group of a binary elliptic curve admits no better generic
          time-store tradeoff than partial meet-in-the-middle, i.e. with store
          |F|^s the time is |F|^(m-s) for s at most floor(m/2). It is `unvalidated`
          with `validation_experiment_ids: []`.
        assigned_to: TASK-20260928-62ad14
        attack_plan: >-
          ATTACK THE HEURISTIC, NOT THE SWEEP. The group is not a generic group and
          the hypothesis's own falsification_condition names where to look:
          Frobenius, the 2-torsion, the low-degree function field. Concretely:
          Frobenius acts on the factor base and an F_2-subspace base is
          Frobenius-stable, so m-SUM over a Frobenius-stable set is a different
          problem from m-SUM over a random subset -- work out whether orbit
          structure buys a tradeoff better than |F|^(m-s) at store |F|^s. Then
          search the k-SUM literature for sub-generic tradeoffs over structured
          sets before conceding the heuristic, and mark every citation's provenance
          (`recalled` if you did not open it). TREAT THE PROGRAM'S ONE SUPPORTING
          DATUM AS WORTHLESS FOR THIS PURPOSE AND SAY WHY: it is at m = 3, the one
          arity where meet-in-the-middle confers no time advantage at all, so it
          cannot discriminate this heuristic from its alternatives.
        breaking_artifact: >-
          An m-SUM algorithm on this group, for any m, with time below |F|^(m-s) at
          store |F|^s -- or a citation to one, opened and marked `retrieved`. Either
          voids every row of the sweep and escalates to review-breakthrough at max.
      - joint: >-
          J4 -- SCOPE AND LANGUAGE. That nothing in RESULTS.md or in the evidence
          record proposed from it exceeds claim_tier heuristic_estimate, asserts
          anything about any curve's security in either direction, reads a
          conditional bound as a closure, mixes the two baseline columns inside one
          margin, or says memory was "charged" into a cost (amendments A5, A7).
        assigned_to: TASK-20260928-d8b371
        attack_plan: >-
          Read every sentence that names a curve degree and ask what a hostile
          quoter could extract from it in isolation. Check specifically: that all
          eleven degrees are treated as parameter labels in a cost formula; that no
          margin mixes the 0.886*2^(n/2) vOW column with the published 2^60.8090
          ECC2K-130 reference, which differ by 4.52 bits at n = 131; that every "no
          cell beats rho" statement is scoped to GIVEN generic m-SUM and names the
          sub-generic oracle as the surviving route; and that no sentence could
          become a KN-FIND title asserting more than the record supports. The
          failure mode is documented and recent: KN-FIND-9cba50's title carried an
          attribution its own source record disowned in six places.
        breaking_artifact: >-
          A quoted sentence that overstates, with the corrected wording proposed
          alongside it.

    blindness:
      mutual: true
      lifted_for: []
      rationale: null
      rationale_note: >-
        Null because lifted_for is empty; blindness is not lifted anywhere in this
        round. If a later hardening round should see these verdicts, that is a new
        plan with lifted_for populated and a rationale, never drift.

    proves_too_much:
      objects:
        - >-
          THE DISCRETE LOGARITHM PROBLEM IN F_q^*, where index calculus is KNOWN to
          beat generic square-root search decisively. Run this contract's own
          accounting -- relations |F|, trials per relation, oracle cost, linear
          algebra |F|^2, store budget -- with the appropriate smoothness
          probability substituted for the decomposition probability.
        - >-
          A HIGH-GENUS HYPERELLIPTIC JACOBIAN, where Gaudry-style decomposition is
          known to beat rho. Same accounting, same substitution of the relevant
          decomposition probability.
      failure_signature: >-
        ON BOTH OBJECTS THE ACCOUNTING MUST FIND SUB-RHO CELLS. If it concludes that
        no cell beats the square-root baseline where index calculus demonstrably
        does win, the argument has proved too much and the defect is in HOW THIS
        CONTRACT COUNTS rather than in the binary curve. If it does find them, the
        model discriminates, and the binary curve's negative is a property of that
        curve's decomposition probability rather than an artifact of the
        bookkeeping. This is the single strongest check available on the whole
        result and it costs one extra probability function.
      assigned_to: TASK-20260928-3f90b8
      assigned_to_note: >-
        Deliberately the same red-team session as J2, and disclosed as a shared
        owner rather than left to be noticed. Both are attacks on the machinery of
        the argument rather than on its subject matter, and both are constructions;
        splitting them would buy a second opinion on neither. J3 is kept in its own
        session because it is the highest-value joint and must not compete for
        attention with a control.

    blind_rederivation:
      required: true
      quantity: >-
        THE STATEMENT OF THE QUANTITY, not the method that produced it: the minimum
        store, in log2 entries, such that some factor-base dimension d admits a
        total cost strictly below the rho baseline at that degree, for a
        decomposition oracle whose time is |F|^(m-s) when its store is |F|^s.
        Report it for n = 131 at m = 8. This is the load-bearing number of P3a and
        P4 and the one any later reader will quote.
      parameters: >-
        n = 131; m = 8; |F| = 2^d with d swept over the same range the contract
        declares; N the prime subgroup order with decomposition probability
        p = |F|^m/(m! N); relations = |F|; linear algebra at |F|^2 time; baseline
        columns 0.886 * 2^(n/2) and the published 2^60.8090 ECC2K-130 reference,
        both carried separately.
      blind_from:
        - experiments/EXP-SEMBIN-04ec3c/code/
        - experiments/EXP-SEMBIN-04ec3c/RESULTS.md
        - experiments/EXP-SEMBIN-04ec3c/runs/
        - ledger/decisions/DEC-20260928-7c3d91.yaml
        - ledger/handoffs/TASK-20260928-e4f7b2.yaml
        - experiments/EXP-SEMBIN-04ec3c/specification.yaml#coordinator_amendments_pre_approval
      assigned_to: TASK-20260928-4e5c26
      legacy_key_note: >-
        `owner` was the Coordinator's invented field name and is removed;
        `assigned_to` is the schema's and is authoritative.
      may_read:
        - >-
          specification.yaml's cost_model, procedure and scope blocks, and the
          parameters n = 131, m = 8, rho baseline 0.886 * 2^(n/2) and the published
          2^60.8090 reference.
      blind_from_note: >-
        DEC-20260928-7c3d91 AND AMENDMENT A2 BOTH CONTAIN MY OWN ARITHMETIC FOR
        THIS EXACT QUANTITY, including the value 107.7. A re-deriver who reads
        either is reproducing me, not checking me, which is precisely the
        wrong-but-self-consistent failure that validation cannot see. This
        exclusion is what makes the re-derivation worth commissioning.
      agreement_means: evidence about the quantity
      disagreement_means: >-
        a defect localised to one of two named derivations -- the producer's
        implementation or the re-deriver's -- and NOT a finding about the family.

    attestation_required: >-
      Each reviewer attests to exactly what it read, names its joint, sets
      independent_session true, and records requested_policy and
      resolved_model_id. This was previously a second `blindness:` key of the
      Coordinator's own naming, which duplicated the schema key above -- removed,
      and its one non-duplicated obligation kept here.
    independence:
      required: true
      reviewers_must_not_have_originated_the_claim: true
      note: >-
        Neither the session that authored the contract nor this Coordinator may
        staff any joint. Both are anchored on P1-P4 by their own derivations and
        that is recorded in coordinator_prior above.
    policy_for_the_round:
      validator: review-adversarial at xhigh, independent session
      red_team: review-adversarial at xhigh, independent session
      why_not_review_breakthrough: >-
        RANKED, NOT OMITTED. AGENTS.md rule 12 reserves review-breakthrough at max
        for claimed breakthroughs, closure results, and contradictions of
        established evidence. This result is a conditional negative that leaves a
        lane where it already was, contradicts no validated evidence record, and
        carries claim_tier heuristic_estimate with an `analyzed` status ceiling. It
        is not a breakthrough claim and paying the top tier here would price review
        out of the loop elsewhere. IF J3 RETURNS A SUB-GENERIC m-SUM ROUTE, that IS
        a breakthrough-shaped claim and it escalates to review-breakthrough at max
        in its own independent session, un-degradable.
    composition: >-
      The Coordinator composes. A blinded reviewer owns one joint, cannot see the
      others by construction, and its opinion on the whole claim is not a vote.
      Run python3 tools/check_review_independence.py --batch <dir> before treating
      the round as complete, and record every departure in procedure_deviations.
    reviewer_cards_note: >-
      The individual reviewer handoffs are minted by the engagement that dispatches
      this round, from this plan, with fresh identifiers. They are not minted now
      because a card written before its producer's artifacts exist cannot name the
      run id it must read.

