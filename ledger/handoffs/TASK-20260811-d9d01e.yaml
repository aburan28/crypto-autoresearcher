handoff:
  id: TASK-20260811-d9d01e
  recorded_at: '2026-08-11'
  from: coordinator
  to: executor
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-d7e255
  experiment_id: EXP-ICINV-e0cd8f
  hypothesis_id: H-ICINV-d5e351
  question_id: RQ-ICINV-475b5e
  contract_version: 1
  objective: >-
    Execute EXP-ICINV-e0cd8f version 1 (approved by DEC-20260810-a4bec4, not
    yet dispatched): exact symbolic Semaev geometry (S_3/S_4 monomial support,
    singular locus, graded Betti table, Castelnuovo-Mumford regularity,
    elimination-polynomial factorisation), on all 138 curves of the
    Hurwitz-certified class p=4001, t=30, D=-59*16^2, with the factor-base
    membership polynomials f_V REMOVED from the ideal, against a size-matched
    control set of random ordinary curves outside the class. Read
    experiments/EXP-ICINV-e0cd8f/specification.yaml FIRST, IN FULL -- it is
    long and every threshold is frozen there. This is a DETERMINISTIC,
    non-statistical contract: no sampling, no null object, no p-value is
    computed anywhere, and any appearing is an invalidation, not a result.
  uncertainty_reduced: >-
    Whether the Semaev-geometry invariants this contract measures are
    constant across an isogeny class (closing the d_reg axis of
    RQ-ICINV-475b5e with a named obstruction) or vary (handing the campaign
    min_{E' ~ E} C(E') as a target). Distinct from and NOT gated by
    EXP-ICINV-4d33aa's SR3 statistical gate -- this contract computes no
    statistic at all, per the specification's own "ORDER IN THE BATCH" note.
  inputs:
    - experiments/EXP-ICINV-e0cd8f/specification.yaml
    - ledger/hypotheses/H-ICINV-d5e351.yaml
    - ledger/decisions/DEC-20260810-a4bec4.yaml
    - analysis/endomorphism-isogeny-decomposition/MATCHED-ORDER-DESIGN.md
    - analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md
    - coordination/goals/GOAL-ENDO-001/batches/BATCH-cb71b5/reviews/red-team/red_team_notes.md
    - harness/semaev.py
    - harness/isogeny_class.py
  constraints:
    - >-
      SR3 BACKEND GATE COMES FIRST AND IS A REAL, NOT PRO-FORMA, RISK. This
      environment has NO computer-algebra backend capable of minimal free
      resolutions installed as of this handoff (confirmed by the
      dispatching Coordinator: no Singular, Macaulay2, Sage, or GAP binary
      on PATH; sympy alone is explicitly disqualified by the contract's own
      text). BOTH `singular` and `macaulay2` ARE available as apt candidates
      in this environment's package archive (confirmed via `apt-cache
      policy`, not yet installed). As your OWN Stage-0 work, attempt
      `apt-get install -y singular` (primary backend) and `apt-get install
      -y macaulay2` (independent cross-check backend per C-BACKEND) within
      your declared budget. If either or both installs fail, time out, or
      are infeasible for a reason you can name (disk, permissions, network),
      STOP and report `failed_infrastructure` exactly as the contract's own
      `computer_algebra_backend.absence_is_infrastructure` and SR3 specify
      -- this is a legitimate, expected, honestly-reportable outcome, not a
      failure of this task, and it is never evidence that the invariants
      are constant. Do not substitute sympy or hand-roll a partial
      resolution computer to route around a failed install; the contract's
      f_V-prohibition and grading requirements assume a real Betti-table
      engine.
    - >-
      SR1 SUPPORT GATE, MINUTES, RUNS BEFORE ANY RESOLUTION. Symbolically
      re-derive the support counts 13 (generic) / 9 (a=0) / 10 (b=0) and
      confirm S_3's support is 13 on all 138 class members before computing
      a single Betti resolution. This is cheap and catches a wrong ideal
      definition before the expensive part runs.
    - >-
      THE f_V-PROHIBITION IS THE CONTRACT'S DEFINING CONSTRAINT, NOT A
      PREFERENCE. No factor-base membership polynomial may appear in any
      computed ideal. Read specification.yaml's "WHY THE FACTOR-BASE
      MEMBERSHIP POLYNOMIALS f_V ARE REMOVED" section before writing any
      ideal-construction code -- this is the whole point of this contract
      existing as a separate experiment from the harness's deployed
      formulation, and getting it wrong silently reproduces the
      already-explained null result (13->9/10 support change, ~0%
      Groebner-time change) this contract exists to route around.
    - >-
      harness/semaev.py and harness/isogeny_class.py MUST NOT BE EDITED.
      New code goes in a new module. Run manifests must pin the hash of
      every source file executed (harness/runner.py:source_provenance,
      audited by `tools/check_run_source_provenance.py --strict`).
    - >-
      GRADING IS DECLARED, NOT DERIVED (specification.yaml
      inputs.ideal_definition.grading): homogenise with a new variable x0,
      resolve over F_p[x0,...,x_m] with the standard grading, for Betti
      tables and regularity. State the grading explicitly in every output
      record.
    - >-
      EVERY CLAIMED DIFFERENCE NEEDS BOTH a gauge recheck (C-GAUGE, on a
      random gauge-transformed model) AND a second-backend cross-check
      (C-BACKEND, at least 20 curves including every curve carrying a
      claimed difference) before being reported as real. A claim not
      surviving either is withdrawn and reported as an artifact, per
      falsification criterion F5.
    - >-
      C-CENSUS FIRST: re-emit the 138-member class enumeration and confirm
      it agrees with the committed, Hurwitz-Kronecker-certified census
      before any class-wide computation (SR2). Disagreement terminates
      PREMISE-FAILED, reported as a defect in a certified artifact, not
      reinterpreted as a curve-geometry finding.
    - >-
      SR4 NULL-FIRST ORDERING: compute and write the control-set multisets
      to the run record BEFORE reading the class multisets for
      interpretation.
    - >-
      SR7 NO OUTCOME SHOPPING: the CLASS-INVARIANT / CLASS-VARYING verdict
      and every reported metric are computed inside the run and written to
      the run record; nothing is selected afterward and the set of reported
      metrics does not depend on which verdict fired.
    - >-
      Never fabricate a command, output, timing, or statistic. A
      measurement not taken stays missing and is reported as missing
      (AGENTS.md rule 9). A timeout, crash, OOM, or failed backend install
      is `failed_infrastructure`, never negative evidence (AGENTS.md
      rule 5).
    - >-
      Fetch origin/main and compare it with this branch before run
      manifests are written; record the base commit checked and the merge
      outcome in the execution report. Merge new main changes, never
      rebase pushed run records.
    - >-
      Mint every new identifier with `python3 tools/allocate_id.py --next
      <type>` and confirm it with `--check` before use.
    - >-
      Lawful defensive cryptanalysis on a public toy curve (p=4001) only.
      No live key, wallet, or deployed system is touched.
    - >-
      SESSION SURVIVAL. Commit after the backend declaration/install
      attempt (whichever way it resolves), again after SR1/SR2 gates pass,
      again after the m=3 class-wide computation completes, again after
      each remaining stage. Never hold results only in memory.
    - >-
      DO NOT INTERPRET AND DO NOT MOVE ANY STATUS. Produce run records and
      an execution report. The hypothesis status and any evidence record
      are the Coordinator's, on a separate ledger archive, after
      independent review.
  deliverables:
    - >-
      experiments/EXP-ICINV-e0cd8f/runs/<RUN-ID>/backend-provenance.json --
      the exact backend(s) declared, their versions, and the install
      attempt's own outcome (succeeded / failed_infrastructure and why),
      written before any resolution is computed.
    - Every required_artifact path listed in specification.yaml verbatim.
    - >-
      coordination/goals/GOAL-ENDO-001/batches/BATCH-d7e255/execution/EXP-ICINV-e0cd8f/execution_report.md
      -- what ran, what did not, every deviation, the emitted verdict
      (CLASS-INVARIANT / CLASS-VARYING / PREMISE-FAILED / failed_infrastructure),
      with no interpretation of what it means for the research question.
  artifact_paths:
    - experiments/EXP-ICINV-e0cd8f/runs/
    - coordination/goals/GOAL-ENDO-001/batches/BATCH-d7e255/execution/EXP-ICINV-e0cd8f/execution_report.md
  archived_by: null
  inference:
    policy: executor-implementation
    requested_policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
    independent_session_note: >-
      Under this Claude Code harness every policy alias resolves to the one
      model the session runs on (CLAUDE.md model policy note); "independent
      session" means independent context, not a different model. Record
      requested_policy alongside the resolved model id in the run manifest,
      with fallback_used: true and its reason if they differ.
  budget:
    wall_clock_seconds: 7200
    memory_gb: 8
    maximum_runs: 8
    total_cpu_hours: 6
    budget_note: >-
      Taken directly from specification.yaml's own budget block, unchanged.
      Backend install time (if attempted) counts against this same wall-clock
      budget; if installation alone would exhaust it, stop and report
      failed_infrastructure rather than let it crowd out the actual
      computation with no result either way.
  completion_gate:
    - >-
      Both backends are declared (or the install attempt's failure is
      recorded as failed_infrastructure) in backend-provenance.json before
      any resolution is computed.
    - SR1 and SR2 pass before any class-wide computation.
    - >-
      All four primary invariant families are computed at m=3 on all 138
      class members and all 138 control-set members, each gauge-rechecked.
    - >-
      The second-backend cross-check agrees on at least 20 curves including
      every curve carrying a claimed difference.
    - >-
      `python3 tools/check_run_source_provenance.py --experiment
      EXP-ICINV-e0cd8f --strict --since-commit <this task's starting
      commit>` passes.
    - >-
      The run emits exactly one of CLASS-INVARIANT, CLASS-VARYING,
      PREMISE-FAILED, or failed_infrastructure, computed inside the run,
      with every deviating curve and every tail check reported.
  return_format: >-
    An execution report at the path above plus the run directories. State
    the emitted verdict and the exact multisets that produced it, and stop
    there. Do NOT write an evidence record, do not move a hypothesis
    status, and do not characterise what the result means for
    RQ-ICINV-475b5e or GOAL-ENDO-001 -- those are Coordinator acts on a
    later ledger archive after independent review. If the backend install
    fails, report exactly what was tried and why it failed, as fully as a
    successful run would be reported -- failed_infrastructure is not a
    lesser deliverable.
  scope_and_honesty: >-
    Toy scale throughout (p=4001, ~12 bits), claim_tier: toy, sota_delta
    zero. No run of this contract can support or reject an ECDLP cost
    claim, in either direction (CLASS-INVARIANT closes an axis with a named
    obstruction; CLASS-VARYING licenses a target, not an attack). This
    contract computes no statistic and therefore produces no `preliminary`
    vs `replicated` evidence-strength question the way EXP-ICINV-4d33aa or
    EXP-CANL-96b0ad do -- its own success_criterion is the sole standard.
