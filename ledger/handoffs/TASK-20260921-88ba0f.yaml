      did for TASK-20260921-166063, so that a further whole-environment
      restart is discovered sooner rather than only when the run is next
      expected to have finished. THIS IS ADVISORY ONLY -- monitoring
      cadence, distinct from the DIFFERENT, process-lifetime cutoff
      question. It does NOT authorize any external timeout wrapper,
      watchdog script, or tool-call-duration bound around the trial process
      itself -- the trial plan's own watchdog_seconds=86400 remains the SOLE
      authorized cutoff on the process itself, exactly as the constraint
      immediately above states. Monitoring cadence (how often the launching
      session looks at the run's progress) and process-lifetime cutoff
      (what is authorized to actually terminate the process) are two
      DIFFERENT things and must not be conflated -- conflating them,
      specifically by wrapping the process itself in a short external
      timeout in the name of "checking in", is exactly how RUN-FROB-2404fa
      was lost. Checking in more often means reading logs/output-file sizes
      more often; it never means shortening, wrapping, or otherwise
      touching the process's own lifetime.
