    claim_under_review: Completeness and internal mathematical consistency of five prospective experimental amendments.
      All remain unapproved and unauthorized for execution; no scientific claim is under review.
    coordinator_prior: 'Before reviewers run: definitions and accounting are more explicit, but the Coordinator
      suspects the higher base-p digit definition may fail when a lower digit is nonzero. Other finite-null, sample-count
      and memory-scope gaps may remain. The prior is NEEDS_CORRECTION, not an approval presumption.'
