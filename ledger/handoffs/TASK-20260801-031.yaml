handoff:
  id: TASK-20260801-031
  from: coordinator
  to: coordinator
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-023
  objective: >-
    After the Validator and the Red Team complete - verify run validity FIRST, then file
    EV-EQD-001 for the real-arm package if admissible, apply the FROZEN reading rule RR-EQD-1
    to classify the result into exactly one of N-0, N-5, N-1, N-2, N-4 or N-6 in the declared
    precedence order, write the close decision as DEC-20260801-008 subject to the mandatory
    freshness re-check, transition H-EQD-001 only along the branch the rule assigns, and
    checkpoint GOAL-ECDLP-001 with exactly one next action.
  uncertainty_reduced: >-
    The official status of limb L2 at toy scale on the first measurement of the fibre
    invariants ever made in this program, and the single ranked next action for BATCH-024.
  inputs:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/reviews/TASK-20260801-032/calibration_validation_report.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/reviews/TASK-20260801-029/validation_report.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/reviews/TASK-20260801-030/red_team_report.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/archives/TASK-20260801-028/snapshot_commit_receipt.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/archives/TASK-20260801-026/snapshot_commit_receipt.json
  - experiments/EXP-EQD-001/specification.yaml
  - experiments/EXP-EQD-001/reading_rule.yaml
  constraints:
  - RUN ALONE.
  - >-
    VERIFY VALIDITY BEFORE INTERPRETING - expected arm count, schema-complete manifest, seed
    and stream integrity, driver-hash equality, raw versus summary agreement, null
    comparability. An invalid or incomplete set goes back to the Executor with concrete
    defects and is NOT evidence.
  - >-
    CONFIRM THE CALIBRATION CHAIN BEFORE READING THE REAL ARM. TASK-20260801-032 must have
    returned ADMISSIBLE, and the CALIBRATION_VALIDATION_REPORT_SHA256 named in the
    TASK-20260801-024 receipt must equal the sha256 of the report you are archiving. A
    mismatch means the report changed after the reading rule was frozen against it, which
    is an integrity failure and never a result.
  - >-
    APPLY THE FROZEN READING RULE AS WRITTEN, IN ITS DECLARED PRECEDENCE ORDER N-0, then N-5,
    then N-1, then exactly one of N-2, N-4, N-6. Do not amend it, do not add a branch, and do
    not read the result into a branch it does not satisfy. Quote the branch condition and the
    observed statistics against their named thresholds in the decision.
  - If any N-0 or N-5 condition fired, the rule is SUSPENDED and the outcome is inconclusive on the instrument - never a mathematical result in either direction.
  - >-
    Under N-4 the decision is `weaken`, scoped exactly to INT-2, the frozen deterministic
    factor-base policy at Bfb = 512, the two tested toy field sizes, m = 4 and the frozen
    resolution ladder, with the strongest available refutation artifact ARCHIVED IN OR BEFORE
    THIS SAME COMMIT and its basis declared - counterexample certificate first (the
    contingency-table cells carrying the excess with their real and null counts and the
    half-tuples that populate them), then derivation note, then declared `empirical_only`. A
    status_scope block goes into H-EQD-001 in the same commit. reject_scoped, and in
    particular reject_scoped-as-impossibility, is FORBIDDEN on this single unreplicated run.
  - >-
    Under N-4 state explicitly that a detected departure in the joint law is NOT an adverse
    finding about HEUR-DS-1, because this experiment measures no smoothness at all - it
    localizes where such a departure would have to come from.
  - Under N-2 the decision is `replicate`; H-EQD-001 stays `analyzed`; no `support`, no S1_met, no HEUR-DS-1 validation at any tier.
  - Under N-1 or N-6 the decision is `inconclusive` with the reason stated plainly, and under N-6 the passing cell may not be reported alone.
  - >-
    BEFORE WRITING THE RECORDS, re-list ledger/decisions and ledger/evidence and confirm
    DEC-20260801-008 and EV-EQD-001 are free in the CURRENT tree including anything merged
    from origin/main since this queue was opened. If either is occupied, renumber OUR record
    and never the other party's, and file a queue amendment binding the declared set,
    artifact_paths and write_scope together.
  - Do not claim crypto-scale, medium-scale or asymptotic support. Toy stays toy. Promotion gates G1-G4 stay OPEN.
  - >-
    Cite no calibration number as evidence about any hypothesis. RUN-EQD-001-calib is
    expressly non-evidential in either direction.
  - >-
    Record limb L1 as a DERIVATION and never as a finding, and record limb L3 as instrument
    characterization and never as a result about the Semaev map.
  - >-
    Do not alter H-SMTH-001, H-DS-001, H-IC-001 or H-STR-002, and do not re-score EV-DS-001
    through EV-DS-004. Do not edit any file under experiments/EXP-DS-001/ or
    experiments/EXP-SMTH-001/. Leave FAEST and XEDN alone.
  - Fill knowledge_promotion either way, with a concrete not_warranted reason if no KN-FIND is promoted.
  - >-
    Carry the declared open items forward stating for each whether it was repaired, mitigated
    or left open - OPEN-BATCH022-A, OPEN-BATCH022-B and OPEN-BATCH023-A - and rank the owed
    smoothness measurement into the BATCH-024 opening, with its two named repairs, rather
    than dropping it.
  - >-
    Rank the mandatory companions of N-2 and N-4 - a second-seed replication at a different
    curve instance per bit size - into the BATCH-024 opening if the branch that fired requires
    them.
  - Preserve every existing field and note in GOAL-ECDLP-001.yaml verbatim; supersede by addition and preserve exactly one next action.
  - >-
    Commit message must contain TASK-20260801-031, EV-EQD-001, the filed decision id,
    H-EQD-001, EXP-EQD-001, GOAL-ECDLP-001, BATCH-023.
  - Do not push from this task.
  deliverables:
  - ledger/evidence/EV-EQD-001.yaml
  - ledger/decisions/DEC-20260801-008.yaml
  - ledger/hypotheses/H-EQD-001.yaml
  - ledger/goals/GOAL-ECDLP-001.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/archives/TASK-20260801-031/ledger_commit_receipt.json
  artifact_paths:
  - ledger/evidence/EV-EQD-001.yaml
  - ledger/decisions/DEC-20260801-008.yaml
  - ledger/hypotheses/H-EQD-001.yaml
  - ledger/goals/GOAL-ECDLP-001.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/archives/TASK-20260801-031/ledger_commit_receipt.json
  archived_by: TASK-20260801-031
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 5400
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
  - >-
    Post-commit verifier accepts the exact Git diff and file hashes; the decision quotes the
    frozen branch condition it fired and the observed statistics against their named
    thresholds; the attainability and ATS-1 audits from the Red Team are answered on the
    record; the limb discipline and the HEUR-DS-1 line are restated; knowledge_promotion
    filled; all three declared open items carried; exactly one next action preserved in the
    goal record.
