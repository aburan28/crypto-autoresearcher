handoff:
  id: TASK-20260904-bb2f29
  from: coordinator
  to: [validator, red-team]
  created_at: '2026-09-04'
  experiment_id: EXP-MONO-cb905d
  hypothesis_id: H-MONO-1d50ac
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001

  objective: >-
    Independent review of EXP-MONO-cb905d's full run package: RUN-MONO-cb905d-1
    (Part A downgraded to not-evidentially-usable due to a group-uniform
    sampler defect; Part B, 100/100 cross-prime cells, transversal-only,
    unaffected) and RUN-MONO-cb905d-2 (corrected re-run of Part A only, under
    protocol amendment v1). Also review the out-of-band incident disclosure
    itself (CORR-20260831-ba2118) and the amendment
    (experiments/EXP-MONO-cb905d/amendments/v1.yaml) for correctness.

  review_plan:
    coordinator_prior: >-
      This Coordinator's own prior, recorded BEFORE either review is
      dispatched: (1) the amendment's independent mathematical
      re-derivation (2-torsion points overweighted 2x under v1's
      construction; the 2p+1-slot rejection sampler in v2 is a correct
      1/N-uniform sampler) is very likely CORRECT -- it was checked via a
      direct slot-counting argument and corroborates the Executor's own
      independently-disclosed protocol_deviation from a different angle.
      (2) RUN-MONO-cb905d-2's headline result (P1=2.398 outside OBJ-6's
      1.84-2.08x band, P2=2.063 inside it, P3 Fisher p=0.330) is most
      likely GENUINE SAMPLING NOISE around a common underlying effect
      given the small collision counts at n=20000 draws, rather than a
      real per-curve difference in the sampling artifact's magnitude --
      but this Coordinator has NOT independently recomputed the raw
      counts or their confidence intervals, and holds this prior with
      only moderate confidence. (3) the process-violation disposition in
      CORR-20260831-ba2118 (not adopting the out-of-band in-place edit;
      re-filing via amendment instead) is believed procedurally correct
      per this program's own stated rules, with high confidence.
    claim_under_review: >-
      Two independent claims: (A) the amendment's mathematical claim that
      v1's sampler was biased 2x on 2-torsion points and unreachable on O,
      and that v2's construction is genuinely 1/N-uniform. (B)
      RUN-MONO-cb905d-2's own empirical claim that P1, P2, and P3 are
      correctly computed from the corrected sampler and correctly compared
      against RUN-MONO-cb905d-1's superseded values and against OBJ-6's
      prior band.
    joints:
      - joint: J1-SAMPLER-MATH
        assigned_to: validator
        attack_plan: >-
          Independently re-derive, from first principles (not by reading
          the amendment's own derivation and agreeing), whether v1's
          construction genuinely overweights 2-torsion points 2x and
          whether v2's 2p+1-slot construction genuinely draws each of the
          group's N points with probability exactly 1/N. Worked attack:
          construct a small toy curve by hand (or via independent code) and
          empirically verify the two constructions' actual point-frequency
          distributions differ as claimed.
      - joint: J2-RERUN-CORRECTNESS
        assigned_to: validator
        attack_plan: >-
          Independently recompute P1, P2, P3 from RUN-MONO-cb905d-2's own
          raw-result.json (not by trusting the execution_report.yaml's own
          arithmetic), and confirm the transversal-arm counts it reused
          were actually read from RUN-MONO-cb905d-1's raw-result.json
          unchanged (not silently redrawn). Worked attack: recompute the
          Fisher-exact p-value independently and check it against 0.3300.
      - joint: J3-PROCESS-VIOLATION-ADEQUACY
        assigned_to: red-team
        attack_plan: >-
          Adversarially challenge the process-violation disposition in
          CORR-20260831-ba2118: is re-filing an out-of-band-verified-correct
          fix as a Coordinator-authored amendment actually sufficient, or
          does it risk laundering an unauthorized edit's content without
          genuine independent scrutiny of THIS Coordinator's own
          re-derivation (which is, after all, a single-session,
          single-model check)? Worked attack: assume the amendment's math
          is subtly wrong in some way this Coordinator didn't catch, and ask
          what would have caught it.
      - joint: J4-HEADLINE-INTERPRETATION
        assigned_to: red-team
        attack_plan: >-
          Adversarially challenge whether RUN-MONO-cb905d-2's result
          (P1 outside OBJ-6's band, P2 inside it, P3 not significant)
          should be read as "no per-curve difference, both consistent with
          sampling noise" or whether there is a double-counting risk,
          multiple-comparisons issue (this is now the THIRD headline
          statistic computed on data touching this same p=617 cell across
          EXP-MONO-64aaa4, RUN-MONO-cb905d-1, and RUN-MONO-cb905d-2), or a
          discriminating-power problem (is n=20000 draws/curve actually
          powered to distinguish a real ~10-20% per-curve difference in
          this ratio, given collision counts are only in the tens-to-low-
          hundreds range?).
    blindness:
      lifted_for: null
      rationale: null
      declaration: >-
        Both reviewers are launched as fresh subagents with no prior context
        from this Coordinator's own conversation; each must independently
        state in its own report whether it read the other's output or any
        sibling review directory before forming its own conclusions
        (expected: no, since both are dispatched in the same message).
    proves_too_much:
      objects:
        - >-
          A rejection-sampling construction that omits the point-at-infinity
          slot entirely (matching v1's own actual defect) -- J1's method must
          correctly flag THIS as biased, not merely conclude "looks fine."
        - >-
          A rejection-sampling construction that accepts a 2-torsion point
          unconditionally on any x-hit rather than splitting it 50/50 against
          the "wrong" bit (again matching v1's actual defect) -- J1's method
          must also correctly flag this one as biased.
      failure_signature: >-
        If J1's verification method reports "uniform" or "looks correct" for
        either known-biased object above, the method itself is not
        discriminating and the joint has not actually been covered.
    blind_rederivation:
      required: true
      quantity: "RUN-MONO-cb905d-2's P1, P2, P3, and the Fisher-exact p-value"
      assigned_to: validator
      blind_from:
        - experiments/EXP-MONO-cb905d/execution_report.yaml
        - experiments/EXP-MONO-cb905d/implementation/run_experiment_v2_part_a_corrected.py

  budget:
    wall_clock_seconds: 3600
    memory_gb: 4
    maximum_runs: 0

  constraints:
    - No git commands. This session's git CLI access remains broken; do not attempt git operations. Report findings in your review files; the Coordinator will archive them.
    - Stay strictly inside experiments/EXP-MONO-cb905d/reviews/{validator,red-team}/ for your own output files.
    - Do not read the sibling reviewer's directory before forming your own conclusions; disclose in your report whether you did.
    - Do not change any research status, ledger record, or hypothesis field. Report only.

  completion_gate: >-
    Both validation-report.yaml and red-team-report.yaml filed, each
    addressing its owned joints explicitly and disclosing blindness
    compliance, before the Coordinator composes evidence/decision records.

  inference:
    requested_policy: review-adversarial
    reasoning_effort: xhigh
    runtime: claude_code
    resolved_model_id: claude-sonnet-5
    model_verified: true
    fallback_used: false
    degraded_requirements: []
