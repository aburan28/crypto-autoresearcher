    - ledger/                                           # no ledger record is yours to write
  budget:
    wall_clock_seconds_per_run: 7200
    total_cpu_hours: 6
    maximum_memory_gb: 8
    maximum_runs: 8
  deliverables:
    - immutable run record(s) under experiments/EXP-ICINV-e0cd8f/runs/
    - experiments/EXP-ICINV-e0cd8f/execution_report.md
  requested_policy: executor-implementation
  inference:
