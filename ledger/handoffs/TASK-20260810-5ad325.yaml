handoff:
  id: TASK-20260810-5ad325
  recorded_at: '2026-08-10'
  goal_id: GOAL-ENDO-001
  question_id: RQ-ICINV-475b5e
  hypothesis_id: H-ICINV-d5e351
  experiment_id: EXP-ICINV-e0cd8f
  batch_id: BATCH-d7e255
  role: executor
  from: coordinator
  to: executor
  objective: >-
    Execute the approved contract EXP-ICINV-e0cd8f exactly as frozen: decide BY
    EXACT COMPUTATION, not by statistics, whether the Semaev geometry of a curve
    is an isogeny-class invariant, over all 138 curves of the
    Hurwitz-Kronecker-certified ordinary class at p = 4001, t = 30,
    D = -15104 = -59 * 16^2.
  why_this_contract_and_not_another: >-
    It is BATCH-d7e255's designated step (4), "run EXP-ICINV-e0cd8f FIRST", and
    it is the only one of that batch's four approved contracts that is fully
    unblocked. It is deterministic exact symbolic geometry, computes no
    statistic, draws no target and uses no null object, so it is gated by
    NEITHER criterion C4 NOR the SR3 gate of EXP-ICINV-4d33aa -- which remains
    PAUSED and is a different contract entirely. Do not touch EXP-ICINV-4d33aa.
  backend_gate_already_probed_by_the_dispatching_coordinator: >-
    SR3 requires both computer-algebra backends declared and recorded WITH
    VERSIONS before any resolution is computed. This session probed the host and
    found SageMath 10.9 (release 2026-05-04) present, with Singular 4.4.1
    (version string 44100) as its backend, and confirmed a minimal free
    resolution computes correctly: the ideal (xy, yz, zx) in QQ[x,y,z] returned
    S^1 <-- S^3 <-- S^2 <-- 0. Macaulay2, standalone Singular and Magma are
    ABSENT. You must still perform and record SR3 yourself from inside the run
    -- this probe is a precondition check, NOT the record, and you must not cite
    it as though the run had made it. If your own probe disagrees with it, the
    disagreement is itself a defect worth reporting.
  machine_conditions_at_dispatch: >-
    HOST IS ALREADY OVERSUBSCRIBED. 14 cores, 48 GB RAM, load average 17.68 at
    dispatch time from other worktrees running concurrently. You are dispatched
    ALONE for this reason and no second producer will run beside you. If wall
    clock is exhausted because of host contention, that is SR6 -- record
    status failed_infrastructure with partial artifacts retained. Per AGENTS.md
    rule 5 and this contract's own budget_provenance, an exhausted budget is a
    BUDGET EVENT, reported as such, and is NEVER negative mathematical evidence
    and NEVER evidence that an invariant is constant. Do not silently trade
    precision for speed to fit the budget; report the shortfall instead.
  stopping_rules_binding_verbatim_from_the_contract:
    - >-
      SR1 SUPPORT GATE, MINUTES, RUNS FIRST. Symbolically re-derive the support
      counts 13 / 9 / 10 and compute the S_3 support on all 138 class members.
      If the derivation fails, or any member's support is not 13, STOP and
      report the defect. Do not compute a single resolution.
    - >-
      SR2 CENSUS GATE. Re-emit the class enumeration and compare with the
      committed 138. On disagreement, terminate PREMISE-FAILED and report the
      disagreement as a defect in a certified artifact.
    - >-
      SR3 BACKEND GATE. Declare and record both backends and their versions
      before any resolution is computed. Absence of a working backend is a
      terminal infrastructure stop, recorded as failed_infrastructure, never as
      a result.
    - >-
      SR4 CONTROL FIRST. The control-set multisets are computed and WRITTEN TO
      THE RUN RECORD before the class multisets are read for interpretation.
      Null-first ordering is part of the protocol, not a convenience.
    - >-
      SR5 FROZEN SCOPE. Stop at the declared prime, class, arities, grading and
      monomial order. No additional prime, class, arity or grading without a
      versioned protocol_amendment filed BEFORE the extra data is generated.
    - >-
      SR6 BUDGET. On exceeding wall_clock_seconds_per_run, stop that run and
      record status failed_infrastructure with partial artifacts retained.
    - >-
      SR7 NO OUTCOME SHOPPING. The comparison verdicts are computed INSIDE the
      run and written to the run record. They are not selected afterwards, and
      the set of reported metrics does not depend on which verdict fired.
  constraints:
    - >-
      SC-1 FABRICATE NOTHING. No invented timing, measurement, backend version,
      citation or run. Every number in the run record must come from a command
      this run actually executed. A cell you did not reach is UNREACHED, never
      imputed and never interpolated.
    - >-
      SC-2 DO NOT INTERPRET. You execute and record. You do not decide whether
      the invariant is or is not class-constant, do not write an evidence
      record, and do not change any hypothesis, question, experiment or goal
      status. Interpretation is a separate Coordinator act after independent
      review.
    - >-
      SC-3 CLAIM CEILING. claim_tier toy, sota_delta zero. Assert nothing about
      ECDLP hardness in either direction and produce no speedup claim.
    - >-
      SC-4 SR4 IS ORDERING, NOT PAPERWORK. Controls are computed and written
      BEFORE class multisets are read for interpretation. If you find yourself
      reading the class result first, stop and restart that stage.
    - >-
      SC-5 REPRODUCIBILITY. Record deterministic seeds where any choice is made,
      the exact backend invocations, and the resolved model alongside the
      requested policy. The contract sets fallback_allowed false and
      degraded_allowed false: if this session cannot honour
      executor-implementation, REFUSE rather than downgrade.
    - >-
      SC-6 DO NOT COMMIT, and write nothing outside write_scope. The dispatching
      session performs the snapshot archive and its verification.
    - >-
      SC-7 STAY OUT of EXP-ICINV-4d33aa (paused, different contract),
      EXP-INSTR-36c8cf, EXP-JINV-bd141d and EXP-VOLC-9f5571.
  write_scope:
    - experiments/EXP-ICINV-e0cd8f/runs/
    - experiments/EXP-ICINV-e0cd8f/execution_report.md
    - experiments/EXP-ICINV-e0cd8f/implementation.md
  out_of_scope:
