handoff:
  id: TASK-20260802-103
  from: coordinator
  to: validator
  objective: 'Independently verify the TASK-20260802-101 adjudication package against the committed snapshot:
    re-fetch at least the highest-priority source yourself and confirm the recorded sha256 and revision
    identifier; confirm every quoted locus actually appears in the vendored bytes at the cited place;
    confirm each Q1/Q2/Q3 verdict is entailed by the cited locus and not by recollection; and confirm
    the producer compared like with like on revision identifiers. Report any verdict you cannot reproduce.'
  uncertainty_reduced: Whether the adjudication verdicts survive an independent re-derivation, or whether
    the batch is reporting a quotation that is not in the source.
  inputs:
  - The verified TASK-20260802-102 snapshot commit and its five artifacts
  - knowledge/findings/KN-FIND-012.md, KN-FIND-013.md, KN-FIND-014.md, KN-FIND-016.md
  - experiments/EXP-MLKEM-010/vendor-lock/
  constraints:
  - Never fabricate a command, output, timing, statistic, citation, or run (AGENTS.md rule 9).
  - Every retrieved source records url, http_status, retrieved_at (UTC), sha256, and byte size. A source
    that could not be retrieved is recorded as unretrieved with its error, never paraphrased from memory.
  - Recollection is not evidence. A claim of the form 'I recall this is known' may be recorded only as
    an explicitly labelled unverified recollection, and may never adjudicate a finding in either direction.
  - Toy/estimate-tier results never become crypto-scale claims (AGENTS.md rule 7). No ML-KEM break claim.
  - Write only inside the declared write_scope. Do not edit prior batch artifacts or any ledger record.
  - You did not produce this package and must not repair it. Report defects; do not edit producer artifacts.
  - 'Independent session. Re-derive rather than confirm: if you cannot reach a source, say so; do not
    accept the producer''s transcript as proof the source says what it claims.'
  - Return a verdict of ADMISSIBLE, ADMISSIBLE_WITH_DEFECTS, or INADMISSIBLE with numbered defects.
  deliverables:
  - validation_report.yaml with per-question reproduction status and a package verdict
  - validation_notes.md recording exactly what you re-fetched and re-read
  artifact_paths:
  - coordination/goals/GOAL-MLKEM-003/batches/BATCH-007/tasks/TASK-20260802-103/validation_report.yaml
  - coordination/goals/GOAL-MLKEM-003/batches/BATCH-007/tasks/TASK-20260802-103/validation_notes.md
  archived_by: TASK-20260802-105
  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 2400
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
  - every Q verdict marked reproduced, not_reproduced, or unable_to_check with a reason
  - at least one source independently re-fetched and its sha256 compared
