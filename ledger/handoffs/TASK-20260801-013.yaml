handoff:
  id: TASK-20260801-013
  from: coordinator
  to: coordinator
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-022
  objective: >-
    Archive the TASK-20260801-012 review and its attainability check, and record
    APPROVAL_DETERMINATION APPROVED or NOT APPROVED for EXP-SMTH-001 in the snapshot
    receipt. Committing a review is not silently approving it.
  uncertainty_reduced: Whether RUN-SMTH-001-heur is authorized.
  inputs:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-022/reviews/TASK-20260801-012/contract_review.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-022/reviews/TASK-20260801-012/attainability_check.md
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-022/archives/TASK-20260801-011/snapshot_commit_receipt.json
  constraints:
  - RUN ALONE. Stage exactly declared_commit_sets.TASK-20260801-013_snapshot.
  - The receipt must contain APPROVAL_DETERMINATION with the literal value APPROVED or NOT APPROVED.
  - >-
    APPROVED only if the TASK-20260801-012 verdict is PASS AND its
    attainability_check.md returns an ATTAINABLE verdict for every band and every
    branch. A PASS whose attainability check reports any unreachable band or branch is
    NOT APPROVED - that combination is precisely what BATCH-021 shipped.
  - A REVISE at any severity is NOT APPROVED and ends the run for this batch under RC-22.
  - Do not repair the contract in this task; RC-22 permits no second cycle.
  - Do not stage ledger/goals/GOAL-ECDLP-001.yaml or ledger/hypotheses/H-SMTH-001.yaml.
  - >-
    Commit message must contain TASK-20260801-013, TASK-20260801-012, EXP-SMTH-001,
    H-SMTH-001, GOAL-ECDLP-001, BATCH-022.
  - Do not push from this task.
  - Do not start the Executor in this task.
  deliverables:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-022/archives/TASK-20260801-013/snapshot_commit_receipt.json
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-022/archives/TASK-20260801-013/snapshot_commit_receipt.json
  archived_by: TASK-20260801-013
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 900
    memory_gb: 1
    maximum_runs: 1
  completion_gate:
  - >-
    APPROVAL_DETERMINATION recorded, with an explicit statement of the attainability
    verdict it relied on; post-commit verifier accepts exact declared paths.
