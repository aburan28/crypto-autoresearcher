handoff:
  id: TASK-20260824-9a489e
  from: coordinator
  to: executor
  goal_id: GOAL-DIFFP-84d641
  batch_id: BATCH-efcae7
  question_id: RQ-DIFFP-a5c483
  objective: >-
    Implement and run EXP-DIFFP-4b165f exactly, in its declared order, writing ONE
    new module (harness/diffpath/controlpower.py) and ONE new test file
    (tests/test_diffpath_controlpower.py) and MODIFYING NOTHING under harness/:
    (1) CTL-FROZEN pre-run digests over every harness/diffpath module plus
    harness/__init__.py and harness/runner.py, then CTL-REPRO against the contract's
    pre-registered comparison values -- CTL-PLANT 96/96, CTL-NULL 0/1000 per family
    in both modes, the 24 equivalence integers, and E6 step_range (0,0)
    conditions_satisfied at 2089 (the CORRECTED value of CORR-20260824-e0088c, not
    the 2094 execution-report.yaml states);
    (2) CTL-GEN-ACT, the generator action profile -- per generator the orbit images
    emitted, the key component names that change with it present versus absent, and
    the verdicts that change -- and CTL-TWOSIDED, the two-sided known-answer set
    T1..T5;
    (3) CTL-NULL-D, null family (d) `message_difference_perturbed` -- a planted
    entry with k bits of its MESSAGE DIFFERENCE flipped (delta_m for MD5, the DV for
    SHA-1), step_delta and every other field held fixed, k in {0,1,2,4,8,16}, one
    deterministic draw plus 64 seeded draws per (entry, k >= 1) -- WITH PER-DRAW
    COMPONENT ATTRIBUTION, plus the D-SHA1-INCODE and D-VD3-PROFILE sub-arms
    reported separately;
    (4) CTL-ABL group 1, the six declared ablation rows of EV-DIFFP-b878aa O-7,
    reported first and separately as the replication;
    (5) CTL-ABL group 2, the complete depth-1 single-deletion lattice, plus
    CTL-FROZEN's post-run digest re-verification.
    REPORT INTEGERS AND A PER-COMPONENT TABLE, NEVER A PASS.
  uncertainty_reduced: >-
    Whether this program's adjudicator control suite has ANY power against the
    deletion of the primary datum of a differential characteristic, and WHICH KEY
    COMPONENT ACTUALLY DECIDES EACH REJECTION. BATCH-f8bf86 reported CTL-PLANT 96/96
    and CTL-NULL 0/3000; review measured that an adjudicator blind to the message
    difference scores the identical pair to the digit, so the declared suite detects
    2 of 5 key-component ablations -- but that was single-session review-side
    computation with no run directory, no RUN-* id, no manifest, no armed deadline
    and no seed envelope. This task turns an outcome into a per-component power
    profile under run discipline.
  inputs:
    - >-
      experiments/EXP-DIFFP-4b165f/specification.yaml -- the frozen contract. Every
      hard term, control, invalidation rule, seed and criterion is binding and none
      may be reinterpreted. DO NOT BEGIN UNTIL ITS APPROVING coordinator_decision IS
      COMMITTED; a message saying it is approved is a pointer and never the approval.
    - >-
      The committed BATCH-f8bf86 adjudicator package under harness/diffpath/ plus
      harness/__init__.py and harness/runner.py -- READ-ONLY INPUTS. The reviewed
      source is fixed at commit 35c2159eee566f05c176e79ddfe7f1a2642d604e, a value
      QUOTED from validation-report joint_J2 and EV-DIFFP-b878aa O-3 and NOT measured
      by the Coordinator; recompute the digests yourself (CTL-FROZEN).
    - >-
      The eight declared seeds in the contract's inputs.seeds -- the seven inherited
      from EXP-DIFFP-fe894e byte-identically, plus 84064107 for family (d)'s seeded
      draws. Immutable.
    - >-
      EV-DIFFP-b878aa O-5, O-6, O-7, O-8, O-9 and O-10 -- the pre-registered
      comparison values for the battery rows, the generator action profile and the
      two-sided decoy answers. THEY ARE COMPARISON TARGETS MEASURED BY
      TASK-20260824-3bd362 AND TASK-20260824-c40847, not this Coordinator's numbers.
    - harness/runner.py -- every run is charged through run_wrapped with an armed deadline.
  constraints:
    - >-
      DO NOT MODIFY ANY COMMITTED FILE UNDER harness/ (IR-2). The instrument is an
      INPUT and is MEASURED, NOT REPAIRED. Only harness/diffpath/controlpower.py and
      tests/test_diffpath_controlpower.py may be written; tests/test_harness.py and
      tests/test_diffpath_adjudicator.py are explicitly out of scope. CTL-FROZEN
      measures this rule and its failure is a STOP.
    - >-
      DO NOT REPAIR VD-3, VD-4, THE {E4}/{E5} ZERO-IMAGE RESULT, OBJ-3's unguarded
      step_start drop, OBJ-4's cross-primitive closest-entry loop OR OBJ-10's missing
      well-formedness gate. They are measured here and fixed in a later batch by a
      ranked decision, because fixing an instrument whose controls cannot see the fix
      recreates the same position one layer up. IF YOU SEE THE FIX, WRITE IT DOWN AS
      AN OBSERVATION AND DO NOT APPLY IT.
    - >-
      BUILD THE ABLATIONS BY THE DECLARED PROJECTION, NOT BY EDITING serialize().
      An ablated adjudicator is the SAME committed class over the SAME census whose
      serialised key has named (name, value) pairs dropped, with the projection
      applied INSIDE the orbit minimisation. Report the inside-versus-outside
      comparison for the six declared rows (IR-8).
    - >-
      REPORT WHICH COMPONENT DECIDED EVERY k >= 1 REJECTION (hard term H-3). A
      control whose rejections are decided by a component OTHER than the one it
      perturbs has NO POWER over the component it was built for, and that is exactly
      how 0/3000 was over-read: family (a)'s draws all died on step_delta, so no
      declared draw ever tested whether the message difference was in the key.
    - >-
      NEVER REPORT "THE NULL PASSED" OR ANY SINGLE PASS/FAIL SUMMARY OF THE SUITE
      (IR-10). The required form is a per-component DETECTED / NOT DETECTED table,
      reported separately for the OLD suite and the STRENGTHENED suite. Where a
      component is not probed by any declared family, SAY SO BY NAME rather than
      reporting NOT DETECTED as though the suite had looked.
    - >-
      DO NOT READ, PARSE, EXTRACT, FETCH OR RECONSTRUCT
      coordination/goals/GOAL-MD5-001/quarantine/** OR THE SAME CONTENT BY ANY OTHER
      ROUTE (IR-1). BCP-1 quarantines CONTENT, not a file path. This contract does
      not even re-hash the payload. Attest non-reading and name the mechanism.
    - >-
      NO NETWORK ACQUISITION, BY ANY ROUTE (IR-6). You hold run_commands and
      deliberately NOT web_search under orchestration/roles.yaml; fetching via the
      shell would route around a declared role boundary.
    - >-
      NO SEARCH OVER THE DIFFERENCE SPACE, no collision attempt, no conforming-pair
      construction beyond the declared planted entries, no cost projection (IR-5).
    - >-
      STRICT AND PERMISSIVE ARE SEPARATE FIELDS AND ARE NEVER MERGED, and every
      ablation row names its drop-set beside its counts (IR-4).
    - >-
      DO NOT REPAIR A CONTROL IN-RUN AFTER SEEING ITS DATA. Changing k, R, the
      perturbation rule, a drop-set, a seed or a criterion after observing an outcome
      requires a versioned protocol_amendment and is not yours to make.
    - >-
      IF FAMILY (d) RETURNS MEMBER AT SOME k >= 1 ON THE HONEST ADJUDICATOR, REPORT
      THE DRAW IN FULL -- entry, k, flipped positions, both canonical forms and the
      attribution -- AND CONTINUE. That draw is a counterexample object and a
      required artifact.
    - >-
      A TIMEOUT, CRASH, CEILING HALT OR IMPLEMENTATION FAILURE IS INFRASTRUCTURE
      SIGNAL, never a negative mathematical result and never a finding about the
      null's power (AGENTS.md rule 5). Report unspent ceilings AS UNSPENT rather than
      reallocating them.
    - >-
      IF YOU FIND YOURSELF MEASURING WHETHER A CHARACTERISTIC-SEARCH SOLVER WORKS
      rather than measuring this adjudicator's controls, STOP and report the
      observation for handoff to GOAL-MD5-001 (IR-9).
    - >-
      Attempt search_knowledge before any assertion about what has or has not been
      tried, and record queries and outcomes verbatim. An empty index is a fact about
      the index and licenses no inference.
    - >-
      RECORD OBSERVATIONS ONLY. Compose no verdict on whether the instrument is
      validated, on whether any path is new, or on the difference space.
    - >-
      Every run manifest carries code_path_fingerprint, an armed deadline and the
      LITERAL experiment id EXP-DIFFP-4b165f at both run.experiment_id and
      run.inputs.parameters.experiment_id (IR-7), plus the full AGENTS.md Artifact
      Policy set including requested policy, backend, resolved model identifier and
      probe status.
    - >-
      Never Amazon Bedrock in any runtime, backend, endpoint, fallback or probe
      (AGENTS.md rule 16).
  deliverables:
    - >-
      harness/diffpath/controlpower.py -- the only new module: the key projection and
      ablated-canonical-form construction; the family-(d) perturbation generators
      (deterministic and seeded, both primitives, plus the in-code and VD3-profile
      sub-arms); the component-attribution function; the generator action profiler;
      the two-sided decoy constructors; and the drivers that run the suite once per
      ablation row.
    - >-
      tests/test_diffpath_controlpower.py -- a NEW dedicated test file covering the
      projection, the perturbation generators (exactly k bits change and no other
      field moves), the attribution function, and the inside-versus-outside
      minimisation comparison. NO EXISTING TEST FILE IS EDITED.
    - >-
      null-family-d-result.json -- per (primitive, k, mode, arm) integer counts, the
      component-attribution distribution, the closest non-matching draw per cell with
      its distance LABELLED AS A DIAGNOSTIC AND NOT A MARGIN, and every k >= 1 MEMBER
      verdict in full if any occurred.
    - >-
      ablation-battery-result.json -- one record per row: the drop-set, the
      run-time-derived key component list, CTL-PLANT, CTL-NULL per family per mode,
      CTL-NULL-D per cell, the DETECTED / NOT DETECTED verdict for the old and the
      strengthened suite, and for group 1 the pre-registered value beside the
      measured one.
    - >-
      generator-action-profile.json -- per generator and declared subset: orbit
      images per object per primitive, the key component names that change, and the
      verdict changes in each mode; plus the CTL-TWOSIDED table with both sides of
      T1..T5.
    - >-
      repro-and-frozen-result.json -- the CTL-REPRO comparison table with every
      pre-registered value beside its measured value, and the CTL-FROZEN pre-run and
      post-run digest sets with their comparison.
    - >-
      run-index.json -- the index of every executed run, CARRYING A sha256 FOR EVERY
      FILE OF EVERY EXECUTED RUN. This is how the runs are content-bound without
      being declared as queue artifact_paths.
    - >-
      Run directories under this task path for every executed run: command,
      environment, seeds, manifest with code_path_fingerprint and an armed deadline,
      raw machine-readable results, stdout and stderr.
    - >-
      execution-report.yaml in the contract's declared order, WHOSE HEADLINE IS THE
      PER-COMPONENT POWER TABLE AND NEVER A PASS, ending with the explicit statement
      that NO PATH IS CLAIMED NEW, NO SEARCH WAS RUN, NO SOURCE WAS ACQUIRED, NO
      INSTRUMENT WAS REPAIRED, and the MD5 LANE IS BLOCKED RATHER THAN CLOSED.
  artifact_paths: []
  archived_by: TASK-20260824-7175d9
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 1200
    memory_gb: 4
    maximum_runs: 6
  budget_note: >-
    1200 s is set from measurement rather than optimism: DEC-20260824-af6d5c records
    that batch 1's producer, which built an instrument from nothing and wrote eleven
    modules, measured a lower bound of 1698 s against a 900 s budget, and that the
    batch opening should have said so. This task writes one module and one test file
    against a frozen package. `maximum_runs` is 6 -- FIVE PLANNED RUNS PLUS ONE
    RESERVE for a single re-attempt after an infrastructure abort -- and counts
    CHARGED EXPERIMENT RUNS (run directory, RUN-* id, manifest, armed deadline,
    consumed ceiling), NOT script executions, probes or unit-test invocations.
  completion_gate:
    - >-
      CTL-FROZEN reports identical harness digests before and after the run set, or
      the run stopped and named the file that changed.
    - >-
      CTL-REPRO reports every pre-registered comparison value beside its measured
      value with the exact-agreement count as an integer fraction, and states which
      value E6 step_range (0,0) actually produced -- 2089 or 2094.
    - >-
      CTL-NULL-D reports MEMBER on all 16 k = 0 arms, integer fractions per
      (primitive, k, mode) for k >= 1, deterministic and seeded draws separately, and
      the COMPONENT-ATTRIBUTION DISTRIBUTION for every rejection. The D-SHA1-INCODE
      and D-VD3-PROFILE sub-arms are reported separately, and D-VD3-PROFILE is never
      counted into family (d)'s pass/fail.
    - >-
      CTL-ABL group 1 reports all six declared rows against their pre-registered
      values; group 2 reports the complete depth-1 lattice or names the rows not
      reached and why. The per-component DETECTED / NOT DETECTED table exists for
      BOTH the old and the strengthened suite, and row 2 (`message_difference`
      deleted) carries an explicit verdict.
    - >-
      CTL-GEN-ACT reports orbit images, key-component changes and verdict changes
      SEPARATELY per generator, so that "verified" and "does observable work" are
      visibly different properties.
    - >-
      CTL-TWOSIDED reports both sides of T1..T5 against their pre-registered pairs.
    - >-
      Quarantine non-reading attestation present and naming its mechanism; every
      manifest carries code_path_fingerprint, an armed deadline and the literal id
      EXP-DIFFP-4b165f; run-index.json carries a sha256 for every file of every
      executed run; unspent ceilings reported as unspent; and the execution report
      closes with the no-novelty, no-search, no-acquisition, no-repair statement.
  return_format: >-
    Paths written, the per-component power table for the old and the strengthened
    suite, the family-(d) counts with their component attribution, the generator
    action profile, the two-sided results, and every stop or deviation with its named
    cause and its measured wall clock.
  review_plan: null
