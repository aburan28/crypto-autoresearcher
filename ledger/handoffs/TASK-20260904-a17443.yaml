handoff:
  id: TASK-20260904-a17443
  from: coordinator
  to: [validator, red-team]
  created_at: '2026-09-04'
  experiment_id: EXP-MONO-e102a3
  hypothesis_id: H-MONO-403c01
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001

  objective: >-
    Independent review of EXP-MONO-e102a3: a second-object replication of
    EXP-MONO-bb6fa1's residual-cubic Galois group measurement, on curve
    E': y^2=x^3+x+2 over F_101 (j=4) and point R' (true order 50). Stage 1's
    corrected exact-tolerance controls both matched EXACTLY. R8 passed.
    Stage 0 gives R1=57/115, R2=58/115, R3=1523/10005, irreducible
    density=3436/10005 -- excluding A_3 and C_2 by the same logic as the
    first object, consistent with S_3. R3 does NOT equal 17/101 exactly
    this time (unlike the first object), suggesting the first exact match
    was object-specific. This is a lighter review than EXP-MONO-bb6fa1's
    own round: the enumeration method, S_4 construction, and Stage-1
    tolerance model are already independently verified and unchanged;
    this round focuses on the NEW numbers and one flagged tolerance-model
    question specific to Stage 0's own interpretation.

  review_plan:
    coordinator_prior: >-
      Recorded BEFORE either reviewer is dispatched. This Coordinator
      independently spot-checked the arithmetic: R1+R2=1 exactly (the
      same disc-square-iff-not-1+2 identity holds, a good consistency
      check), and confirmed R3=1523/10005 != 17/101 by exact fraction
      comparison. This Coordinator also checked the Executor's own claim
      that the result is "within 3 standard errors" of the S_3 asymptotic
      triple and found it likely WRONG under a naive iid-sampling-style
      error model (a 3-sigma envelope of about 0.0112 around 1/6, against
      an observed deviation of about 0.0144 -- outside it) -- but found
      the result IS comfortably within a theoretically more appropriate
      Weil-style O(1/sqrt(p)) RELATIVE error envelope (about 0.0166 around
      1/6, per HEUR-CHEB-1's own stated form in H-MONO-572e7e), which the
      Executor did not explicitly use. This Coordinator has not decided
      which framing is correct and is NOT deciding it unilaterally, given
      this is the third time this session a subtle finite-p/tolerance
      question has needed independent scrutiny (CORR-20260904-33fbf3,
      CORR-20260904-8cc20f).
    claim_under_review: >-
      (a) Are the new curve (E':y^2=x^3+x+2/F_101, j=4, order 100), point
      (R'=(53,82), true order 50, T0=53), and Stage 0/1/R8 numbers
      correct? (b) Does R3 genuinely NOT equal 17/101 exactly (confirm by
      independent exact-fraction computation, not floating point)? (c) Is
      the Executor's own "within 3 standard errors" claim for Stage 0's
      own R1/R3 correct, and if not, what is the theoretically appropriate
      error model for judging V_R's own deviation from the naive
      asymptotic triple (a Weil-style RELATIVE O(1/sqrt(p)) envelope, a
      different absolute form, or something else), and does the observed
      deviation pass or fail under the CORRECT standard? (d) Given (a)-(c),
      does this second object still support "consistent with, not
      confirming, G_R=S_3" (H-MONO-403c01's own framing), or does the
      larger-than-first-object deviation warrant a more cautious reading?
    joints:
      - joint: J1-SECOND-OBJECT-VERIFICATION
        assigned_to: validator
        attack_plan: >-
          Independently verify, with your own code (reusing only
          `experiments/EXP-MONO-0e6e8f/implementation/run_uncond_census.py`-
          style already-verified primitives if needed, or writing fresh
          group-law code): E':y^2=x^3+x+2 over F_101 has order 100, j=4,
          is ordinary; R'=(53,82) has true order 50 (hence not in E'[2]).
          Then independently re-run the exhaustive Stage-0 census (direct
          symmetric-coordinate enumeration, NOT solve-for-e3) and confirm
          |V_R'(F_101)|=10200, and the exact fractions R1=57/115,
          R2=58/115, R3=1523/10005, irreducible=3436/10005. Confirm R1+R2=1
          exactly as an internal consistency check.
      - joint: J2-R3-EXACT-COMPARISON
        assigned_to: validator
        attack_plan: >-
          Using exact fraction arithmetic (not floating point), confirm
          1523/10005 != 17/101 (cross-multiply: 1523*101 vs 17*10005).
          Report the exact difference as a fraction.
      - joint: J3-TOLERANCE-MODEL-FOR-VR
        assigned_to: red-team
        attack_plan: >-
          This is the substantive question, continuing J3's own line of
          inquiry from EXP-MONO-bb6fa1's own review round
          (`experiments/EXP-MONO-bb6fa1/reviews/red-team/red-team-report.yaml`
          -- read it for context on what was already found: V_R's own
          expected finite-p deviation has no known derivable closed form,
          unlike the two null objects). Determine which error model is
          actually appropriate for judging whether an observed deviation
          like 0.0144 (on R3, n~10005 points) from the naive 1/6 is
          "expected" or "concerning" under G_R=S_3. Is a Weil-style
          O(p^{-1/2}) RELATIVE envelope (as HEUR-CHEB-1 states) the
          correct framing, and if so does it actually apply cleanly to a
          DENSITY (a ratio of two point counts, each individually subject
          to a Weil bound) rather than to a raw point count -- work through
          whether the relative-error framing on the density itself is
          rigorously justified or merely a plausible heuristic scaling.
          Compare the first object's own deviation (0.0016 from 1/6) to
          this second object's own (0.0144) -- is an 8-9x difference in
          deviation between two toy-scale objects itself notable, or
          within the natural scatter two independent finite samples of
          this kind would show? State plainly whether this second result
          should be read as comfortably consistent with S_3, or as a
          mild yellow flag worth a third data point before saying even
          "consistent with" confidently.
      - joint: J4-OVERALL-READING
        assigned_to: red-team
        attack_plan: >-
          Given J3's own analysis, state the appropriate overall reading
          of EXP-MONO-e102a3 for H-MONO-403c01's own outcome: does two
          objects both excluding named rivals and both roughly matching
          the S_3 triple (with the second showing a larger, but per J3
          possibly still-expected, deviation) constitute real progress
          toward confirming G_R=S_3, or should the larger deviation
          temper that reading? Also confirm: does the NON-reproduction of
          R3=17/101 exactly settle (per this session's own prior
          disclosure) that the first object's exact match was very likely
          a coincidence, or is a third data point still needed to be
          confident of that too?
    blindness:
      lifted_for: null
      rationale: null
      declaration: >-
        Both reviewers launched as fresh subagents with no prior context;
        each must state whether it read the other's output before forming
        its own conclusions.
    proves_too_much:
      objects:
        - >-
          J1's own independent census, applied to a curve/R choice that
          reduces to a KNOWN degenerate case (e.g. checking what happens
          if R were mistakenly in E'[2], which this run's own selection
          rule explicitly avoided) should NOT be run as a positive
          control here (too expensive to justify for a lighter review
          round) -- instead, the required control is simply that R1+R2=1
          exactly, which is a property of ANY curve/R (a pure
          combinatorial identity, not evidence about G_R), and its
          confirmation here is a sanity check on the classifier's own
          continued correctness on a new object, not new evidence.
      failure_signature: >-
        If R1+R2 != 1 exactly on independent recomputation, the
        classifier or the reviewer's own method has a bug.
    blind_rederivation:
      required: false
      quantity: null
      assigned_to: null
      blind_from: []

  budget:
    wall_clock_seconds: 2400
    memory_gb: 4
    maximum_runs: 0

  constraints:
    - Do not commit or push. Report only, in your own review directory under experiments/EXP-MONO-e102a3/reviews/{validator,red-team}/.
    - Do not read the sibling reviewer's directory before forming your own conclusions; disclose whether you did.
    - Do not change any research status, ledger record, or hypothesis field.

  completion_gate: >-
    Both validation-report.yaml and red-team-report.yaml filed, each
    addressing its owned joints explicitly, before the Coordinator
    composes the evidence and decision records for EXP-MONO-e102a3.

  inference:
    requested_policy: review-adversarial
    reasoning_effort: xhigh
    runtime: claude_code
    resolved_model_id: claude-sonnet-5
    model_verified: true
    fallback_used: false
    degraded_requirements: []
