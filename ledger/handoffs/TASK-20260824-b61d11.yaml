handoff:
  id: TASK-20260824-b61d11
  from: coordinator
  to: validator
  goal_id: GOAL-DIFFP-84d641
  batch_id: BATCH-efcae7
  question_id: RQ-DIFFP-a5c483
  objective: >-
    Verify the integrity of the control-power package against its frozen contract,
    not its interestingness. THE COMMITTED REVIEW PLAN ASSIGNS THIS TASK'S JOINTS AND
    IS AUTHORITATIVE OVER THE SKETCH BELOW; this task may not be dispatched until
    that plan is committed, and any difference is recorded in the plan's
    procedure_deviations. Coordinator's intent at opening:
    (V-a) REPRODUCTION -- cold-re-run the deterministic checks from the declared
    seeds in fresh processes to EXACT INTEGER agreement, including E6 step_range
    (0,0) conditions_satisfied, where the contract pre-registers 2089 (the corrected
    value of CORR-20260824-e0088c) against execution-report.yaml's 2094.
    (V-b) ARE THE ABLATIONS GENUINE -- is each ablated adjudicator the SAME committed
    class over the SAME census with named pairs dropped by the declared projection,
    and is the projection applied INSIDE the orbit minimisation as the contract
    requires? Do the inside and outside forms differ?
    (V-c) THE PRE-REGISTERED BATTERY VALUES -- do the six declared rows reproduce
    EV-DIFFP-b878aa O-7? A disagreement localises to either the round-1 measurement
    or this batch's mechanism; say which if you can and say you cannot if you cannot.
    (V-d) COMPONENT ATTRIBUTION AND THE SHA-1 CONFOUND -- for every k >= 1 rejection,
    is the reported attribution correct? On SHA-1 at k in {8,16}, does
    `in_linearized_code` honestly recompute to False so that the FLAG decides the
    rejection rather than the message difference the family perturbs? If so, the
    primary SHA-1 arm has no power over the component it was built for.
    (V-e) TWO-SIDEDNESS AND CAPACITY TO FAIL -- are CTL-TWOSIDED's T1..T5 answers
    correct on BOTH sides, and does the k = 0 MEMBER arm exist and get really
    adjudicated rather than assumed?
    (V-f) {E4}/{E5} -- does CTL-GEN-ACT actually show that {E4} and {E5} emit no orbit
    image, that E5 changes no key and no verdict, and that E4's only key effect is a
    removal, with generator ACTION kept distinct from generator VERIFICATION status?
    (V-g) SCOPE AND THE OBSTRUCTION -- if an obstruction is stated, is its value
    recomputable from the runs in `measured_by`, does it carry units and honest error
    bars, and is it claimed over exactly the scope those runs cover? Is any
    per-component result reported as a bare fraction without its table? Does any "the
    null passed" summary appear (IR-10)? Is `closest_distance` labelled a diagnostic
    and never a margin? Is any path claimed new, any cost projected, any source
    acquired, any committed harness file modified, or the MD5 lane described as
    closed?
  uncertainty_reduced: >-
    Whether the reported per-component power profile is what the committed code
    produces from the declared seeds; whether the ablations are genuine
    single-component deletions of the SAME frozen key rather than re-implementations
    that flatter; whether family (d)'s rejections are decided by the component it
    perturbs or by another one; and whether any obstruction is claimed over exactly
    the scope its runs cover.
  inputs:
    - >-
      The committed review plan for TASK-20260824-9a489e, which assigns this task's
      joints and is authoritative over the objective sketch above.
    - The snapshot receipt and the exact paths it binds by path_sha256.
    - >-
      experiments/EXP-DIFFP-4b165f/specification.yaml -- the frozen contract, its
      hard terms H-3 and H-6, its invalidation rules, its eight declared seeds and its
      pre-registered comparison values.
    - >-
      The producer's execution report, null-family-d-result.json,
      ablation-battery-result.json, generator-action-profile.json,
      repro-and-frozen-result.json and run-index.json.
    - >-
      EV-DIFFP-b878aa and DEC-20260824-af6d5c, as the source of the pre-registered
      comparison values and of the defects this batch measures rather than repairs.
  constraints:
    - >-
      INDEPENDENT SESSION, SIBLING-BLIND AGAINST TASK-20260824-e9d21a (Red Team). Do
      NOT read
      coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7/reviews/TASK-20260824-e9d21a,
      and declare in your attestation exactly what you read.
    - >-
      STAY INSIDE YOUR SIDE OF THE BOUNDARY. You own whether the reported numbers ARE
      what the code produces and whether they are scoped honestly; the Red Team owns
      whether the CONCLUSION drawn from them survives objects for which it is known
      false. On component attribution: YOU check the producer's attribution is
      CORRECT, the Red Team checks whether correct attribution is SUFFICIENT. The
      proves-too-much object is not yours to build; if you see one, record it as an
      observation rather than substituting it for a joint you own. A joint attacked
      twice means another joint is attacked never.
    - >-
      BLINDNESS COVERS COMMIT MESSAGES, THE MERGE DIGEST AND
      coordination/events/main/** WHILE THIS ROUND IS OPEN. Use
      `git log --format=%H`. If you encounter a finding anywhere -- a commit body, a
      PR description, a bus message -- SAY SO IN THE ATTESTATION rather than quietly
      proceeding. Round 1's independence was broken in exactly this way and the
      reviewers' unprompted disclosure is the only reason the round remained
      composable.
    - >-
      COMMIT YOUR REPORT WITH A SUBJECT LINE AND NO FINDINGS IN THE BODY. The batch-3
      red-team pass reviews this batch's snapshot, so leaking this round's findings
      into commit metadata would contaminate a round that has not started.
    - >-
      REPORT ON THE JOINTS THE PLAN ASSIGNS YOU AND DO NOT COMPOSE A WHOLE-CLAIM
      VERDICT. You cannot see your sibling's joints by construction; composing is the
      Coordinator's job, and a whole-claim verdict from a reviewer who owns a subset
      of the joints is an opinion built from a fraction of the evidence.
    - >-
      RE-RUNS WRITE INTO THIS TASK'S OWN DIRECTORY ONLY. The archived run directories
      are immutable and are never edited or repaired.
    - Do not read coordination/goals/GOAL-MD5-001/quarantine/** and attest non-reading.
    - >-
      AN INFRASTRUCTURE FAILURE IN YOUR OWN RE-RUN IS INFRASTRUCTURE SIGNAL, not a
      finding against the producer. Report it as such and say what remained unverified.
    - >-
      `maximum_runs: 3` COUNTS CHARGED EXPERIMENT RUNS UNDER A CONTRACT -- a run
      directory, a RUN-* id, a manifest, an armed deadline and a consumed ceiling. IT
      DOES NOT COUNT SCRIPT EXECUTIONS, read-only probes, cold re-derivations or
      unit-test invocations, however many you run. This definition is given because
      round 1's two reviewers read the same field two different ways.
    - >-
      Record requested policy, resolved model identifier, backend, probe status and
      reasoning effort. A tier the backend cannot reach is a PAUSE, never a silent
      downgrade. If the probe verifies nothing -- as it did for both round-1 reviewers
      -- say so plainly and mark the identifier self-reported rather than measured.
    - >-
      Never Amazon Bedrock in any runtime, backend, endpoint, fallback or probe
      (AGENTS.md rule 16).
  deliverables:
    - >-
      validation-report.yaml with joint-by-joint findings under the plan's SHORT
      JOINT IDS, every re-derived integer shown beside the producer's, the
      exact-agreement count as a fraction, the component-attribution audit for the
      SHA-1 arm stated explicitly, a review_attestation block naming joints_owned by
      short id, sources_read honestly and completely, read_sibling_reports and the
      verdict, and the requested policy and resolved model with its probe status.
  artifact_paths:
    - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7/reviews/TASK-20260824-b61d11/validation-report.yaml
  archived_by: TASK-20260824-b3e02b
  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 600
    memory_gb: 4
    maximum_runs: 3
  budget_note: >-
    600 s, against batch 1's per-reviewer 360 s, and the increase is recorded against
    a named defect rather than granted casually: DEC-20260824-af6d5c PD-4 is against
    the Coordinator role for cutting review budgets without a basis and then asking
    for more than they bought. REVISED DOWNWARD FROM 720 s IN A DISCLOSED SECOND
    PASS, for a stated reason rather than to preserve a round number: 720 s was set
    when this task was the round's only reviewer and carried the adversarial joints
    as well as the integrity ones. TASK-20260824-e9d21a now owns the adversarial
    joints, so this task's load is smaller than the 720 s design assumed. 600 s is
    still a 67% increase over the budget the round-1 reviewers overran.
  completion_gate:
    - >-
      Every joint the committed plan assigns is reported with holds | breaks |
      inconclusive, under its short id, with the measurement it rests on.
    - >-
      The cold re-run's exact-agreement count is reported as an integer fraction with
      every disagreement listed by name and both values shown side by side, including
      the E6 step_range (0,0) value.
    - >-
      The ablation-genuineness check is reported: same class, same census, named pairs
      dropped, projection inside the minimisation, and the inside-versus-outside
      comparison.
    - >-
      The component-attribution audit is reported, with an explicit answer on whether
      the SHA-1 arm's large-k rejections are decided by `in_linearized_code`.
    - >-
      A review_attestation block is present, listing sources_read honestly and
      completely, with read_sibling_reports and, if the plan requires one,
      blind_from_respected set only if it is true.
    - >-
      Any encounter with a finding through commit metadata, the merge digest or a bus
      message is disclosed in the attestation.
  return_format: >-
    Joint-by-joint verdicts under short ids, the re-derived integers beside the
    producer's, the ablation-genuineness and component-attribution findings, anything
    you could not check with the reason, and your resolved model with its probe
    status.
  review_plan: null
