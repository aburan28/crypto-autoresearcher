      - Treating four cyclic kernels as four independent arithmetic classes at exceptional j.
      - Transport cost excluding discovery/setup while the scalar comparator is fully charged.
      - One missing class/coordinate or unresolved below-resolution timing block in an otherwise favorable panel.
      failure_signature: Reject wrong scalar or model identity and unsupported independence; preserve all transport-specific
