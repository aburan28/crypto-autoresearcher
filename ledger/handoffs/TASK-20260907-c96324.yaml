        distinguish proven defects from untested coverage.
    - joint: Blind transport identity, conductor-three level assumptions, exceptional multiplicities and charged
        finite-panel cost
      assigned_to: TASK-20260907-167cea
      attack_plan: From the original specification alone derive beta=phi composed with i composed with dual phi,
