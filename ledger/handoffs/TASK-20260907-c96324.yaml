    - joint: Executable protocol completeness, controls, scalar-label isolation, canonical custody and launch gate
      assigned_to: TASK-20260907-c96324
      attack_plan: Trace every specification obligation to actual code and output at the exact snapshot. Check fixture/RNG
        domains and counters, dual maps and point endpoint types, concrete full timing matrix and baseline selection,
        real controls and all validity branches, charged setup/repetitions, separate scalar-label evaluator inputs,
