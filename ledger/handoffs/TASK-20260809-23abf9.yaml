    the commit changed.
    THAT COMMIT IS NEITHER A LEDGER ARCHIVE NOR AN EVIDENCE ACT: it reviews no
    evidence, creates no EV-* record and transitions no status.
  inference:
    policy: coordinator-orchestration
    requested_policy: coordinator-orchestration
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
    standing_basis: >-
      inference-amendment commit 0137a051eb5828789eb267fa83c8278086578d4c.
      Cross-model independence is unavailable campaign-wide; nothing produced
      here may be treated as a closure attestation.
  budget:
    wall_clock_seconds: 900
    memory_gb: 1
    maximum_runs: 2
  budget_basis: >-
    The 900 s coordination-act line of GOAL-AES-002 campaign_budget.sizing_basis,
    itself borrowed from protocol-amendment-GOAL-AES-001-005 Part A's
    coordination_act figure for an amendment-and-decision act, sized by analogy
    with the ledger-archive role because that is the closest measured
    Coordinator work. NO measured GOAL-AES-002 datum exists and none is
    invented.
  completion_gate:
    - >-
      stamps.json exists, was written as the task's FIRST act, and carries
      start_utc, start_epoch, declared_wall_clock_seconds, a binding_stop_utc
      computed as start plus declared, a stamp at every major section boundary,
      and a truthful halted_on_budget with the dropped work named if it halted.
    - >-
      CM-1 fixes ALL SIX elements (a)-(f) of RQ-AES-002 claim_tier_ceiling R2,
      each explicitly labelled, for EACH of AES-128, AES-192 and AES-256, with
      the unit conversion stated, the success convention declared once and
      applied to both sides, the cost/p normalisation stated, data charged in
      queries and kind, memory stated beside time, and precomputation and
      verification charged end to end.
    - >-
      protocol-amendment-GOAL-AES-002-001 names BLK-1, adds `key_recovery`
      WITHOUT removing or altering `discrete_log`, `decomposition` or `none`,
      specifies the statement fields and the two-implementation
      independent-recompute verifier, and the `check_run` change accepts
      `key_recovery` while still erroring on anything outside the extended set.
    - >-
      The adoption record names amendment-005 Part B C1 through C6 and the
      amendment-004/005 provenance gate as IN FORCE FROM BATCH-001, by explicit
      adoption rather than inheritance.
    - >-
      protocol-act-manifest.json is designated THE COVERING MANIFEST in its own
      text and carries an artifact_provenance entry for EVERY declared artifact
      with path, kind from the closed case-insensitive vocabulary, sha256,
      comment_block_inference_stanza and
      covered_by_this_manifest_inference_block, its own entry recorded as SELF.
    - >-
      Every deliverable satisfies SC-4 as quoted, and no deliverable states a
      margin, a cost comparison, or any relation to the published state of the
      art in either direction.
    - >-
      The five artifacts are committed and pushed in an isolated coordination
      commit BEFORE either producer is dispatched, with the PR against `main`
      naming the amendment and this task.
    - >-
      No evidence record, hypothesis, knowledge entry or status transition was
      created; no cryptanalysis was performed; no AES measurement was taken;
      and nothing outside the declared write scope was written.
  return_format: >-
    The five artifact paths, the CM-1 element-by-element coverage table for
    (a)-(f) at all three key sizes, the exact diff summary of the two
    shared-file edits, the isolated commit sha and its parent as reported by
    the dispatching session, the PR reference, and a plain statement that no
    cryptanalysis, no measurement and no margin were produced.
