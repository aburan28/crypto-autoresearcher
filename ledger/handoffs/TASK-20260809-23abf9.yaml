handoff:
  id: TASK-20260809-23abf9
  from: coordinator
  to: coordinator
  goal_id: GOAL-AES-002
  question_id: RQ-AES-002
  batch_id: BATCH-001
  rank: 1
  parent_decision: DEC-20260809-16c8f4
  task_card: coordination/goals/GOAL-AES-002/batches/BATCH-001/task-cards/TASK-20260809-23abf9.md
  objective: >-
    AUTHOR AND COMMIT THE THREE GATE ARTIFACTS THAT EVERY LATER GOAL-AES-002
    CARD DEPENDS ON, AND NOTHING ELSE.
    (a) COST MODEL CM-1, frozen and independently reviewable, fixing ALL SIX
    elements (a)-(f) of RQ-AES-002 claim_tier_ceiling R2 for EACH of AES-128,
    AES-192 and AES-256: (a) UNIT — one full AES-k encryption of one block at
    10/12/14 rounds on the pinned FIPS-197-verified implementation, stating
    whether the key schedule is amortised or charged, with a STATED CONVERSION
    from S-box lookups, table accesses, XORs or "operations" into that unit,
    without which the comparison is void; (b) SUCCESS CONVENTION —
    average-case 2^(k-1) or worst-case 2^k, declared ONCE and applied to BOTH
    sides, because mixing conventions manufactures a factor of 2 that sits
    inside any plausible margin here; (c) SUCCESS PROBABILITY — an attack
    succeeding with probability p is charged at cost/p, and p is measured or
    derived and NEVER assumed; (d) DATA — charged in queries AND in their kind
    (known / chosen plaintext / chosen ciphertext / adaptive), with the
    reference's about-two-known-pairs requirement stated and with a
    large-chosen-data attack compared on the FULL PARETO FRONTIER of time,
    memory, data and success probability rather than on a single scalar;
    (e) MEMORY — stated always, beside time, a time-only comparison being
    incomplete and rejected; (f) PRECOMPUTATION AND VERIFICATION — charged end
    to end, including the cost of confirming a candidate key.
    (b) PROTOCOL-AMENDMENT-GOAL-AES-002-001 RESOLVING BLK-1: extend the
    certificate vocabulary of docs/claims-and-verification.md with a
    `key_recovery` kind whose STATEMENT carries key size, round count, the
    exact plaintext/ciphertext pairs and the recovered key, and whose VERIFIER
    is independent-recompute under BOTH pycryptodome AND the openssl CLI,
    re-computed by the run wrapper and NOT by the attack code; and make the
    corresponding `check_run` change in tools/validate_ledger.py, which today
    accepts only `discrete_log`, `decomposition` and `none` and therefore
    errors on any AES key-recovery certificate.
    (c) THE ADOPTION RECORD binding, from BATCH-001 rather than by assumption,
    the protocol-amendment-GOAL-AES-001-005 Part B clock convention C1-C6 and
    the artifact-provenance gate of protocol-amendment-GOAL-AES-001-004 Part B
    AS CORRECTED by amendment-005 Part C.
  uncertainty_reduced: >-
    Whether GOAL-AES-002 can dispatch any cryptanalytic work at all. RQ-AES-002
    makes CM-1 a HARD PRE-DISPATCH GATE and names BLK-1 as an infrastructure
    blocker that must be resolved before any card that could produce a solve is
    dispatched; pause condition P3 fires on BLK-1 remaining unresolved. This
    task determines whether both gates are open, before any producer slot is
    spent rather than after.
  inputs:
    - >-
      RQ-AES-002 claim_tier_ceiling R1-R7 in full, and its constraints block,
      which are the specification for CM-1 and for the amendment.
    - >-
      docs/claims-and-verification.md "Certificate discipline", whose current
      vocabulary is `discrete_log | decomposition | none`.
    - >-
      tools/validate_ledger.py `check_run`, whose certificate-kind branch
      currently errors on any kind outside that set. This Coordinator READ that
      code and states only what it read: the accepted set is `discrete_log`,
      `decomposition`, `none`.
    - >-
      protocol-amendment-GOAL-AES-001-005 Part B C1-C6 and Part C, and
      protocol-amendment-GOAL-AES-001-004 Part B as corrected by it.
    - >-
      GOAL-AES-002 budget_accounting and provenance_and_review_gates, which
      already ADOPT both by reference and which the adoption record makes
      operative and auditable.
  constraints:
    - >-
      SC-1 C2 STAMP DUTY, AND IT BINDS COORDINATOR TASKS EXACTLY AS IT BINDS
      PRODUCERS. As its FIRST act, before any other work, this task writes a
      stamp record in its own task directory carrying start_utc, start_epoch,
      declared_wall_clock_seconds and a binding_stop_utc COMPUTED AT DISPATCH
      TIME as start plus declared; writes a further stamp at EACH major section
      boundary carrying utc, elapsed_s and a marker naming what was completed;
      HALTS at binding_stop_utc, records halted_on_budget truthfully and NAMES
      the work dropped; and COMMITS those stamps as a DECLARED ARTIFACT of the
      task. The TASK-20260801-810 budget block is the reference
      implementation. A halt at binding_stop_utc is INFRASTRUCTURE SIGNAL,
      never a negative mathematical result (AGENTS.md rule 5), and dropped work
      is SCOPE, never an answer.
    - >-
      SC-2 C4 DECLARATION BASIS. The declared budget is calibrated against
      AUTHORING-INCLUSIVE session elapsed, and the COMPUTE component is
      reported SEPARATELY in its own field. Compute seconds are NOT the charged
      clock and may NOT be offered as evidence of budget compliance (C3).
      Discharging SC-1 is FULL COMPLIANCE even if the dispatcher-observed
      figure later exceeds the declaration; any residual is a campaign-side
      accounting fact and is never a producer defect.
    - >-
      SC-3 COVERING MANIFEST AND CLOSED CLASS VOCABULARY, under
      protocol-amendment-GOAL-AES-001-004 Part B as corrected by
      protocol-amendment-GOAL-AES-001-005 Part C, in force from BATCH-001. AT
      LEAST ONE machine-readable manifest of this task, DESIGNATED THE COVERING
      MANIFEST by this card and by the manifest itself, carries an
      `artifact_provenance` list covering EVERY declared artifact of the task,
      and EVERY OTHER MANIFEST OF THE TASK MUST APPEAR AS AN ENTRY IN IT. Entry
      fields: path, kind, sha256, comment_block_inference_stanza (boolean,
      stated honestly including when false),
      covered_by_this_manifest_inference_block (boolean). A self-referential
      digest is impossible and is recorded as SELF. THE `kind` VOCABULARY IS
      CLOSED AND CASE-INSENSITIVE — SOURCE_CODE, MACHINE_READABLE_MANIFEST,
      PROSE_REPORT, LEDGER_AND_COORDINATION_RECORD — matched ignoring
      underscore/hyphen/space differences; NO FIFTH CLASS MAY BE INVENTED, a
      value outside the vocabulary is a DEFECT TO REPORT rather than a class to
      create, and any machine-readable structured-data artifact resolves to
      MACHINE_READABLE_MANIFEST. Every declared SOURCE_CODE artifact
      additionally carries a comment-block inference stanza in its own text.
      THE COVERING MANIFEST OF THIS TASK IS protocol-act-manifest.json.
    - >-
      SC-4 R5 ANTI-LAUNDERING CLAUSE, QUOTED VERBATIM FROM RQ-AES-002
      claim_tier_ceiling AND BINDING AS A COMPLETION GATE ON EVERY DELIVERABLE
      OF THIS TASK: "R5. THE ANTI-LAUNDERING CLAUSE. Any record, in any
      location, that states a margin MUST in the SAME SENTENCE (i) name the
      reference as exhaustive key search at the stated key size under CM-1, and
      (ii) declare the published-state-of-the-art comparison UNADJUDICABLE in
      this environment. Transcribing a definitional-reference margin as a
      state-of-the-art margin — in a headline, an evidence record, a decision,
      a synthesis, a status line, a cross-reference, a knowledge entry, a PR
      title or a commit message — is a CLAIM-TIER VIOLATION and is handled
      exactly as docs/claims-and-verification.md handles dropping a conditional
      qualifier: as an assertion above what the record supports. OPERATIONALLY,
      under docs/inventor-protocol.md section 5: every ideation and closure
      deliverable under this question sets `dominated_by: "unresolvable in this
      environment: no primary source reachable; every recalled frontier row is
      unverified-from-memory"` and NEVER `null`, because `null` asserts the
      frontier was checked row by row and it cannot be. `sota_delta` records
      the DEFINITIONAL-REFERENCE delta, explicitly labelled as such, plus the
      word `unadjudicable` for the published frontier."
    - >-
      SC-5 EVERY DELIVERABLE STATING A MARGIN CARRIES THE R5 CLAUSE IN THE SAME
      SENTENCE AS THE MARGIN. Not in a footnote, not in an appendix, not in a
      later paragraph, not in a preamble that the sentence itself does not
      repeat.
    - >-
      SC-6 NO RECALLED LITERATURE FIGURE MAY BE CITED AS AUTHORITY, IN EITHER
      DIRECTION. Every literature statement is UNVERIFIED-FROM-MEMORY
      (eprint.iacr.org, csrc.nist.gov and arxiv.org are unreachable under this
      harness's network policy) and must be marked inline at the point of use.
      It may not be used to promote, dismiss, rank, screen or size anything.
      Using a recalled number to DISMISS a candidate is the same fabrication as
      using it to PROMOTE one, and is additionally the premature-closure
      failure mode CLAUDE.md names as symmetric with overclaiming. Two agreeing
      recollections are ONE draw from a correlated pair, not two.
    - >-
      SC-7 NO COMPARISON AGAINST THE PUBLISHED STATE OF THE ART IS ASKED FOR BY
      THIS CARD, AND NONE MAY BE SUPPLIED. The only quantitative reference
      under this question is the DEFINITIONAL exhaustive-key-search reference
      of R1. `dominated_by` is set to the R5 string and NEVER to null.
    - >-
      SC-8 NO REDUCED-ROUND FINDING IS ASSERTED UNDER THIS GOAL. Reduced-round
      work is admissible here only as a validation-ladder instrument for a
      full-round mechanism, carries `toy` tier, and where it yields a result
      ABOUT reduced-round AES it is recorded under RQ-AES-001's ceiling and
      cross-filed there, never asserted here.
    - >-
      SC-9 ANYTHING NOT ATTEMPTED IS NAMED OPEN AND UNATTEMPTED and is NEVER
      recorded as tried, screened or negative (AGENTS.md rules 5 and 8). A
      count of things not reached is not a finding about the problem.
    - >-
      SC-10 CONCURRENCY. max_concurrent is 3 ACROSS BOTH AES GOALS, not 3 each.
      If GOAL-AES-001 BATCH-005 is in flight and dispatching this task would
      exceed the cap, THIS BATCH WAITS: record WAITED_ON_CONCURRENCY_CAP with
      the time waited and dispatch later at full budget, full deliverable set
      and full review chain. Never run degraded. Measured at drafting time on
      the host by the dispatching session: 14 physical cores, 48 GB RAM, load
      averages 40.48 / 43.60 / 40.25 — heavily oversubscribed. That is a
      measurement at drafting time and NOT a forecast of the load at dispatch
      time; re-check the cap immediately before dispatch.
    - >-
      RUN ALONE AND COMMIT BEFORE ANY PRODUCER IS DISPATCHED. The five
      artifacts are committed and PUSHED in an ISOLATED COORDINATION COMMIT by
      the dispatching session before TASK-20260809-9b78b2 or
      TASK-20260809-8ab82c is dispatched, and the PR against `main` is opened
      or refreshed naming protocol-amendment-GOAL-AES-002-001 and this task. A
      gate uncommitted when the card it gates is issued is retroactive
      enforcement and is refused.
    - >-
      THE TWO SHARED-FILE EDITS ARE ADDITIVE AND MUST NOT REMOVE ANYTHING.
      docs/claims-and-verification.md gains `key_recovery` alongside
      `discrete_log`, `decomposition` and `none`; tools/validate_ledger.py
      `check_run` gains the matching branch. No existing kind is removed,
      renamed or re-scoped and no other program behaviour changes. Before
      editing, fetch origin/main and MERGE it into the working branch (merge,
      never rebase). If a sync conflict appears in either file, STOP and
      escalate — never resolve a conflict by editing a committed record, and
      never by weakening the existing vocabulary.
    - >-
      THE `key_recovery` VERIFIER IS DEFINED AS INDEPENDENT OF THE ATTACK. The
      wrapper re-encrypts the exact declared plaintexts under the recovered key
      and compares against the exact declared ciphertexts, under BOTH
      pycryptodome AND the openssl CLI, using code that shares nothing with the
      attack. A failed certificate invalidates the run as `invalid_measurement`,
      NEVER as a negative observation. State that rule in the amendment text.
    - >-
      CM-1 IS FROZEN AT COMMIT AND IS NOT TUNED LATER. Any subsequent change
      requires a versioned protocol_amendment on its own rationale; a cost
      model adjusted after a margin is observed is a success criterion changed
      after observing an outcome. Say so in CM-1's own text.
    - >-
      CM-1 STATES ITS OWN ATTACK SURFACE. Name, in CM-1, what a red team should
      attack in it, because a cost model naming no attack surface is not a cost
      model — TASK-20260809-33a159 is dispatched specifically to attack it.
    - >-
      NO CRYPTANALYSIS, NO MEASUREMENT, NO MARGIN. This task computes no attack
      cost, runs no AES experiment and states no margin against anything. It
      fixes the units in which a later margin could be charged, which is a
      different act and must be described as one.
    - >-
      CREATE NO EVIDENCE RECORD, NO HYPOTHESIS, NO KNOWLEDGE ENTRY and NO
      status transition. The adoption record is a coordination record, not a
      ledger transition. Write only within the declared write scope.
  deliverables:
    - stamps.json
    - CM-1-cost-model.yaml
    - protocol-amendment-GOAL-AES-002-001.yaml
    - adoption-record.yaml
    - protocol-act-manifest.json (THE COVERING MANIFEST)
  artifact_paths:
    - coordination/goals/GOAL-AES-002/batches/BATCH-001/tasks/TASK-20260809-23abf9/stamps.json
    - coordination/goals/GOAL-AES-002/batches/BATCH-001/tasks/TASK-20260809-23abf9/CM-1-cost-model.yaml
    - coordination/goals/GOAL-AES-002/batches/BATCH-001/tasks/TASK-20260809-23abf9/adoption-record.yaml
    - coordination/goals/GOAL-AES-002/batches/BATCH-001/tasks/TASK-20260809-23abf9/protocol-act-manifest.json
    - coordination/goals/GOAL-AES-002/amendments/protocol-amendment-GOAL-AES-002-001.yaml
  write_scope:
    - coordination/goals/GOAL-AES-002/batches/BATCH-001/tasks/TASK-20260809-23abf9
    - coordination/goals/GOAL-AES-002/amendments
    - docs/claims-and-verification.md
    - tools/validate_ledger.py
  archived_by: TASK-20260809-7bab1e
  archived_by_note: >-
    THE OPENING SNAPSHOT ARCHIVE, AND THE REASON IS SUBSTANTIVE RATHER THAN
    CLERICAL. This task's artifacts are the GATE for ranks 2 and 3, so they must
    be committed BEFORE those producers run; the batch's PRODUCER snapshot
    archive TASK-20260809-877f6b runs AFTER them and therefore cannot carry them
    without making the gate retroactive. TASK-20260809-7bab1e exists precisely
    to commit them first: it runs ALONE immediately after this task, stages this
    task's five artifacts and the two additive shared-file edits in an isolated
    coordination commit, verifies the provenance gate and the digests, pushes,
    and is the task ranks 2 and 3 actually depend on.
    THIS FIELD PREVIOUSLY READ `TASK-20260809-23abf9` (SELF), WITH THE COMMIT
    DESCRIBED AS AN ACT OF THE DISPATCHING SESSION. That was the defect
    tools/research_dispatch.py rejected: a commit that everything depends on and
    that no task owns, with no budget, no receipt and no completion gate. The
