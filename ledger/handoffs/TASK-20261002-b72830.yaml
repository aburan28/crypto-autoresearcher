  constraints:
    - ER-1 Write only inside the write scope, new files only; edit no bound file, no earlier plan, no r1/indep file and no record; mint no identifier.
    - >-
      ER-2 D-1. The manifest is the run-record schema tools/validate_ledger.py
      check_run applies (a top-level run key), with every AGENTS.md
      artifact-policy field: exact command, git commit and dirty-tree state,
      environment and dependency versions, parameters and seeds, requested
      policy, backend, resolved model and model_verified (null or not
      applicable for a non-model payload, stated as such), reasoning effort,
      fallback, stdout and stderr, raw results, validity status and reason,
      timestamps and resources. Show check_run accepting a manifest written
      by a synthetic run.
    - >-
      ER-3 D-2 and D-3. Every N > 0 row writes a root-list certificate file
      (coefficient vectors over K, Frobenius orbit grouping); the wrapper
      re-verifies every listed root (x^(2^n') = lambda(x) in K; pairwise
      distinct); certificate_bearing counts re-verified files on disk; M5 is
      checked per stage before any headline; a row with fewer listed roots
      than N and root_list_deferred false raises or is flagged and is never
      certificate-bearing; the checker has no fallback pass.
    - >-
      ER-4 D-6. Stage 0 runs no census code (no import path from the Stage-0
      payload to the census instruments); the hand re-derivation note is
      produced and checked as the design's RD-5 states; M9 records a declared,
      checkable read set per run, never a constant.
    - ER-5 D-7 and D-8. Every internal RNG seed is declared in the manifest; a failed or expired attempt leaves a record validate_ledger.py can see, as the design states.
    - >-
      ER-6 Plan. trial-plan-r1.json lists all 20 trials with the
      specification's cells and candidate rule, the twenty run ids the session
      recorded (none equal to an earlier plan's or a bound directory's), the
      order the design's RD-4 (or the approved amendment) fixes, a Linux
      requirement, task_id TASK-20261002-b72830, approved_by null, a
      supersession_reason naming DEC-20261002-5e691c R-CONTINUATION and
      DEC-20261002-a63f13 C-EQ, source_sha256 over every r1 file, and
      specification_sha256 (and the amendment's sha256 if approved). It must
      load in tools/experiment_execution.py; use only its read-only status
      mode to show this.
    - >-
      ER-7 CI-6. Unit and integration tests only on synthetic cells with
      field degree n outside {4, 7, 11, 12, 13, 31, 131}, writing only to
      your private scratch; never on a cell the specification declares; no
      RUN id; nothing under runs/; never tools/experiment_execution.py run or
      authorize.
    - ER-8 CI-5. Code runs under /usr/local/bin/python3, CPython 3.11.15 (no random.binomialvariate or other 3.12+ API); the manifest records the execution host's interpreter per run.
    - ER-9 Declared read set in your report, in order; private scratch only, <session scratchpad>/BATCH-4708f7/TASK-20261002-b72830/; no whole-tree export; memory within 8 GB.
    - ER-10 Folded block scalars for prose containing a colon followed by a space; check indentation; parse-check the report and validate the plan JSON before handing back.
    - ER-11 No run value of EXP-QSP-70b731 or EXP-QSP-33b442; no sentence about H-QSP-cd0c90's standing or EV-QSP-a6aa4b.
