handoff:
  id: TASK-20260825-7d3441
  from: coordinator
  to: idea-generator
  objective: >-
    Build the AES and deployed-block-cipher frontier shard, prioritizing AES-
    128/192/256 and recording differential, linear, differential-linear,
    boomerang/rectangle, impossible-differential, integral/division-property,
    zero-correlation, biclique, key-recovery, and related-key results under
    exact matched models.
  uncertainty_reduced: >-
    What the current public AES/block-cipher frontier actually is once trails,
    distinguishers, key recoveries, related-key models, and reduced/full rounds
    are separated, and which deployed ciphers lack a primary-source-backed row.
  inputs:
    - coordination/goals/GOAL-SYMF-c00fa1/batches/BATCH-303ce8/frontier-schema.yaml
    - coordination/goals/GOAL-SYMF-c00fa1/batches/BATCH-303ce8/coverage-manifest.yaml
    - ledger/goals/GOAL-AES-001.yaml
    - ledger/goals/GOAL-AES-002.yaml
    - ledger/goals/GOAL-AES-003.yaml
    - ledger/goals/GOAL-SIMSPK-001.yaml
    - knowledge/techniques/KN-TECH-076.md
  constraints:
    - AES-128, AES-192, and AES-256 are separate primitive variants.
    - Single-key and related-key, chosen-plaintext and known-plaintext, reduced and full-round, and distinguisher and key-recovery rows never share a comparison key.
    - A trail probability or active-S-box bound is not an end-to-end attack unless the source charges the conversion.
    - Read primary texts and give exact page/table/theorem locators for authoritative rows.
    - Preserve all cost axes and null reasons; do not infer unstated exponents or hide preprocessing.
    - Search knowledge before asserting absence and log every query and source open.
    - No attack implementation or cryptanalytic search.
  deliverables:
    - frontier-shard.yaml validating against the frozen schema, with AES first and explicit coverage states for every listed cipher.
    - source-index.yaml with primary URLs, stable identifiers, retrieval dates, exact claim locators, and provenance.
    - retrieval-log.yaml with all repository searches and web queries/opens.
    - report.md with the AES frontier partition, missing cost axes, cipher backlog, and any evidence overturning the Coordinator prior.
  artifact_paths:
    - coordination/goals/GOAL-SYMF-c00fa1/batches/BATCH-303ce8/tasks/TASK-20260825-7d3441/frontier-shard.yaml
    - coordination/goals/GOAL-SYMF-c00fa1/batches/BATCH-303ce8/tasks/TASK-20260825-7d3441/source-index.yaml
    - coordination/goals/GOAL-SYMF-c00fa1/batches/BATCH-303ce8/tasks/TASK-20260825-7d3441/retrieval-log.yaml
    - coordination/goals/GOAL-SYMF-c00fa1/batches/BATCH-303ce8/tasks/TASK-20260825-7d3441/report.md
  archived_by: TASK-20260825-568663
  inference:
    policy: research-deep
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 900
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
    - AES rows cover each key size and explicitly separate full/reduced and single/related-key models.
    - Every listed cipher has a terminal coverage state; no unsearched cell is called secure or attack-free.
    - Every authoritative row has primary-source provenance and all cost/success axes populated or explicitly null-reasoned.
  return_format: Paths written, row counts by provenance and eligibility, AES frontier candidates, other-cipher coverage, and unresolved gaps.
  review_plan: null
