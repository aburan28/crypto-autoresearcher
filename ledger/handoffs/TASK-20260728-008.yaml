handoff:
  id: TASK-20260728-008
  from: coordinator
  to: coordinator
  goal_id: GOAL-SSI-001
  batch_id: BATCH-002
  objective: >-
    Commit the independent review, the scoped evidence record EV-SSI-002, the
    batch decision DEC-20260728-004, and the GOAL-SSI-001 checkpoint, then record
    the official transition for this lane.
  inputs:
    - The TASK-20260728-007 red-team package
    - The verified TASK-20260728-006 producer snapshot
    - The BATCH-001 records EV-SSI-001 and DEC-20260725-002 that this batch continues
  constraints:
    - >-
      Run alone. Stage EXACTLY the six paths this archive commits: the two
      TASK-20260728-007 review artifacts plus the four declared archive artifacts.
      A commit that touches more paths than it declares is rejected; that failure
      has already made one batch of this program unrenderable.
    - Only the Coordinator writes official records.
    - >-
      EV-SSI-002 is derivation and literature evidence. Do not record it as
      empirical, do not assign a claim tier above theory, and do not assert a
      strength above what one unreplicated derivation with one independent review
      supports.
    - >-
      Record exactly one next_action in GOAL-SSI-001.yaml and preserve the
      does-not-count-toward-completion condition unless the review confirms a new
      attack mechanism.
    - >-
      Fill knowledge_promotion on DEC-20260728-004. A KN-FIND promotion requires
      support or reject_scoped on replicated or strong evidence; a derivation gate
      at theory tier will normally record a concrete not_warranted reason instead.
      Any warranted KN-TECH or KN-FIND entry is a SEPARATE successor task with its
      own declared paths and a regenerated knowledge/INDEX.md, because knowledge/
      is deliberately outside this archive's declared scope.
    - >-
      Do not edit ledger/proposals/IDEA-20260725-001.yaml. Any change to that
      idea's disposition is recorded in DEC-20260728-004's
      hypothesis_status_record, as DEC-20260725-002 did.
    - >-
      commit_sha, parent_sha, and path_sha256 are filled by the executing session
      from Git object content; a record may not contain the hash of the commit
      that creates it.
    - >-
      The commit message must contain TASK-20260728-008, TASK-20260728-007,
      EV-SSI-002, and DEC-20260728-004 literally.
  deliverables: [ledger_commit_receipt.json, EV-SSI-002.yaml, DEC-20260728-004.yaml, GOAL-SSI-001.yaml]
  artifact_paths:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-002/archives/TASK-20260728-008/ledger_commit_receipt.json
    - ledger/evidence/EV-SSI-002.yaml
    - ledger/decisions/DEC-20260728-004.yaml
    - ledger/goals/GOAL-SSI-001.yaml
  archived_by: TASK-20260728-008
  archive_role: ledger archive for TASK-20260728-007
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 600
    memory_gb: 1
    maximum_runs: 1
  completion_gate:
    - >-
      EV-SSI-002 preserves the exact reviewed scope, cites the derivation and
      review artifacts by path, and lists unresolved confounds including anything
      the red team named.
    - >-
      DEC-20260728-004 records one decision from the permitted set, cites evidence
      by ID, fills knowledge_promotion, and records the disposition of
      IDEA-20260725-001.
    - >-
      GOAL-SSI-001.yaml carries the BATCH-002 checkpoint, exactly one next_action,
      and status active unless a committed pause condition applies.
    - >-
      The post-commit verifier accepts the commit: reachable from HEAD, expected
      parent, exactly the six declared paths, hashes preserved, task and record
      IDs in the message. Until it does, nothing in the checkpoint is durable or
      official.
  authorized_by: DEC-20260725-002
  recorded_by: coordinator
  recorded_at: '2026-07-28'
