    - >-
      DO NOT RUN GIT HISTORY COMMANDS BEFORE SEALING -- no `git log`, no
      `git show`, no branch or PR listing. Two commit messages reachable from
      this branch state the a = 1/16 verdict in plain text (84233e8c3,
      376c6660e). This contamination is declared, not hidden, in
      specification.v2.BATCH-e9fd22-proposed.yaml `blind_history_contamination` and
      `review_plan.blind_phase_hygiene`; your job is not to pretend it does not
      exist but to avoid adding to it. If you see a protected value anyway,
      REPORT IT in your attestation. A contaminated seal honestly reported is
      worth far more than a clean-looking one.
    - >-
      DETERMINISM. Seed every RNG explicitly; do not derive any seed from
      Python's `hash()`. Your own predecessor's Stage A did, and its pool draw
      was not reproducible across processes -- a defect it disclosed itself.
    - >-
      VERIFY YOUR OWN CODE BEFORE YOU TRUST IT. Check your basin-closure
      implementation against exhaustive brute force at a small N and report that
      check INSIDE the seal. The prior Stage A found a real bug this way.
    - >-
      STATE YOUR THREE ACCUMULATION CHOICES EXPLICITLY, per J1's attack plan:
      whether S_d charges every pool walk terminating at d or only the first;
      how walk length is counted; and whether the pool stops at r*T distinct DPs
      or r*T walks. These are where a self-consistent divergence would hide.
    - >-
      REPORT ON YOUR OWN JOINTS ONLY. You own J1, J2 and J6. You are blind to
      TASK-20260907-3dff63's report and may not read it; a whole-claim verdict
      from you would be formed from half the evidence. The Coordinator composes.
    - >-
      YOU DO NOT CHANGE STATE. No hypothesis status, no evidence record, no
      decision. Write only inside write_scope, and never into BATCH-3c7493's
      directories -- in particular never edit
      sealed_blind_rederivation.json, which is immutable. Your re-seal is a NEW
      artifact under a NEW name in a NEW directory.

