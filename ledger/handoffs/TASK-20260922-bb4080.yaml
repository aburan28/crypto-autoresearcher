  budget:
    watchdog_seconds: 10800
    memory_mb: 8192
    max_concurrent: 1
    ladder_timeout_seconds: 600
    wall_clock_seconds: null
    maximum_batches: null
    budget_note: >-
      wall_clock_seconds and maximum_batches are null because ICPERF is a
      declared ECC area and CLAUDE.md rule 11 sets ECC budgets unlimited. The
      watchdog, memory cap and per-cell ladder timeout are machine protection.
  execution_notes:
    - >-
      The first launch failed in the degree-law phase on a JSON encoding error
      (Sage returns its own Integer type). Fixed by converting on serialisation
      rather than casting at each call site, and the run RESUMED from its
      checkpoints -- the self-test and budget-table phases were not recomputed.
      An encoding failure is execution status, never evidence (AGENTS.md rule 3).
    - >-
      The descent was rewritten to stay MULTILINEAR after the naive route --
      substitute into S_{m+1}, expand over K, then reduce v^k to v -- was
      measured taking over thirteen minutes on a single (n, m) = (8, 4) cell
      while holding 1.9 GB. Exploiting that every Frobenius power is F_2-linear
      keeps intermediate degree at m*min(m-1, l) instead of m*2^(m-1), and the
      same cell then built in 0.12 s. This is an instrument fix, not a result.
    - >-
      THREE SUPERSEDED LADDER ATTEMPTS, each an execution failure and none
      evidence about any cell (AGENTS.md rule 3). (1) A cysignals AlarmInterrupt
      escaped the handler and killed the phase. (2) With that fixed, a cell ran
      thirty minutes at 4.2 GB against a 300 s cap, because the alarm wrapped
      only the Groebner call and left the Weil descent outside the timeout
      window. (3) The RLIMIT_AS cap added for (2) made things worse: PolyBoRi
      calls abort() on an allocation failure instead of throwing, so the cap
      converted an out-of-memory cell into a SIGABRT that killed the run. The
      fix that held is per-cell isolation in a forked child, where a hang, an
      out-of-memory and an abort all become an exit status the parent records.
    - >-
      `sage` is not on PATH in a fresh container of this environment; it is at
      /opt/conda-sage/bin/sage (SageMath 10.9). The launcher resolves it rather
      than assuming a bare `sage`.
  receipt:
    branch: claude/frobenius-orbit-factor-bases-46r5z2
    merge_outcome: >-
      origin/main fetched and merged into the branch before this task's archival
      commit; no divergent changes touched ICPERF or FROB paths.
  constraints_observed:
    - No deployed curve used as an attack instance.
    - No discrete logarithm solved; certificate.kind = none.
    - Ladder cells exceeding the declared timeout are recorded censored and
      excluded from every fit; a censored cell is never read as difficulty.
    - Output bounded by construction; no per-instance stream.
    - Every identifier minted via tools/allocate_id.py and --check-confirmed.
