    - ledger/evidence is limited to EXACTLY ONE new file and ledger/decisions to EXACTLY ONE new file.
    - Merge origin/main before the archive (MERGE, NEVER REBASE), record the base and outcome, and push and refresh PR #561 after.
    - >-
      VERIFY VALIDITY BEFORE INTERPRETING ANYTHING. An invalid or incomplete run set goes
      back to the Executor with concrete defects listed; it is not evidence. A timeout, crash
      or check_run rejection is INFRASTRUCTURE SIGNAL and never a mathematical result.
    - >-
      COMPOSE, DO NOT COUNT. A blinded reviewer's scalar verdict is a lossy rollup the
      checker's schema requires; the per-joint maps govern. Where the two reports agree, treat
      the agreement as ONE observation unless mutual blindness demonstrably held, and state
      the rule you applied so it can be checked.
    - >-
      ADJUDICATE COMPLETION CRITERION 4 EXPLICITLY, from the reports actually received and
      never from the batch shape. It requires that BOTH sessions ADMIT, and the goal head
      additionally requires that J8, J11 and J13 were ANSWERED. A `breaks` on an owned joint
      is not an admission on that joint, and SILENCE ON AN ASSIGNED JOINT IS NOT AN ADMISSION
      EITHER -- reading it as one would be manufacturing an admission.
    - >-
      RULE ON THE ROUND'S INDEPENDENCE EXPLICITLY, from the attestations rather than from the
      plan's intent, and compose every disclosed exposure rather than absorbing it. Round 2's
      residual was wider than the round disclosed and the finding was against the plan; check
      whether BR-9's structural fix actually held and say so either way.
    - >-
      SCORE THE SEALED PRIOR ITEM BY ITEM. An overturned item is a first-class finding, not
      something to absorb. The prior is NEVER evidence: discount any concurrence a reviewer
      could have read and state the discount.
    - >-
      REPORT THE GRAPH, THE PARTITION AND THE MATRIX AS TABLES, NEVER AS A PASS AND NEVER AS
      A BARE FRACTION. Every verdict carries its basis and its primitive scope, and the
      differing-cell count carries its exclusions.
    - DO NOT CLAIM ANY PATH IS NEW, and do not let any NON-MEMBER verdict be written or implied as novelty. State the census's completeness beside every verdict cited.
    - Claim ceiling is `analyzed`. Do not round up and do not record `supported` on any record of this batch.
    - THE MD5 LANE IS BLOCKED, NOT CLOSED. AMD-20260824-DIFFP-ACQ-1 stands unchanged and the Tier B unblocking route is intact.
    - >-
      If any adverse transition is proposed, secure the strongest checkable refutation
      artifact the result admits FIRST -- counterexample certificate, then derivation note,
      then a declared empirical_only basis -- archive it before the decision, and record
      proof_status and proof_refs. `reject_scoped` on a single unreplicated empirical-only run
      is FORBIDDEN.
    - A failing control, a refuted partition, a GATED-NOT-RUN stage or an exhausted task budget ENDS A TASK, NOT THIS GOAL. Preserve exactly one concrete next action.
    - >-
      FILL knowledge_promotion AND DISCHARGE THE BOUNDED OBLIGATION. Either write the KN-TECH
      entry with the amended content DEC-20260824-c5bb72 specified, or retire the requirement
      by an explicit decision on the merits and say what replaces it. IF NO KN-TECH ID WAS
      GRANTED, TAKE THE SECOND BRANCH AND SAY THE REASON IS THE MISSING IDENTIFIER AND NOT
      THE MERITS.
    - If the round surfaced solver-validation work rather than instrument measurement, record the handoff to GOAL-MD5-001 explicitly rather than absorbing it.
    - >-
      Record only checks this session actually ran, with their verbatim output. NEVER INVENT
      A COMMIT SHA, and never attach a claim about a sha's position in history that was not
      measured -- CORR-20260824-ad7f2c records that at the BATCH-efcae7 close both the value
      and the assertion were wrong.
    - knowledge/INDEX.md is GENERATED AND GITIGNORED and is never committed.
    - >-
      WRITE EVERY PROSE VALUE AS A BLOCK SCALAR OR QUOTED THE FIRST TIME (BR-13).
      EV-DIFFP-b16b01 is one of the five files this campaign has already shipped unparseable,
      by a dedent that landed at mapping indent.
