    - tests/test_experiment_execution.py
    - orchestration/campaign/autopilot.py
    - plugins/crypto-autoresearcher-harness/skills/run/SKILL.md
  constraints:
    - >-
      T-1, EXACTLY AS DEC-20261005-138b51 tooling_change_T1 SPECIFIES.
      tools/ecc_priority.py open_ecc_ideas() reads committed decisions under
      ledger/decisions/ that carry `coordinator_decision.idea_dispositions`,
      and excludes their `applies_to_exactly[*].id` from the open list. It
      lists them instead in a separate, always-printed "disposed by
      decision" section, giving the idea id, the decision id and the
      disposition. Guards: membership only by explicit ID in
      applies_to_exactly, never by title, regex or area. The block is honoured
      only if its rule_9_fields carries non-empty evidence, budget,
      test_boundary, remaining_uncertainty and successor_or_revisit.
      Otherwise the tool warns on stderr and keeps the ideas open. A later
      decision whose idea_dispositions names the same ID with disposition
      `reopened` restores it ("later" means a later decided_at, with the
      decision id as a tie-break; record the ordering rule in the task
      report). In --json mode, keep stdout's existing shape and put the
      disposed section on stderr, or add a documented key ONLY if the
      existing --json consumers in the repository accept it. Choose one, and
      justify it in the report.
    - >-
      T-1 CENSUS. 138b51's T-1 census is NOT regenerated. It already exists,
      and the task cites
      coordination/archives/TASK-20261005-2af213/template-census.json. The
      task report states, report-only, whether each of the 47 ids in
      138b51's withheld_contracts.ids and the 104 in 98a823's appear in that
      census with status approved and empty run_dirs. It edits nothing.
    - >-
      T-2. tools/newest_experiments.py reads committed decisions under
      ledger/decisions/ that carry `coordinator_decision.withheld_contracts`,
      and drops their explicit `ids` from the selectable list returned by
      newest_runnable(). The guards mirror T-1. (i) Membership is by
      explicit ID in withheld_contracts.ids only, never by title, template,
      signature or area. (ii) The block is honoured only if
      withheld_contracts.rule_9_fields carries non-empty evidence, budget,
      test_boundary, remaining_uncertainty and successor_or_revisit.
      Otherwise warn on stderr, naming the decision, and keep its ids
      selectable. (iii) A later decision naming the ID under
      `released_contracts.ids` restores it, using the same ordering rule as
      T-1. (iv) Nothing becomes invisible: every run prints to stderr, in
      both text and --json modes, one count line naming each honouring
      decision and how many rows it dropped. A new flag `--show-withheld`
      prints the full list (id, deciding DEC id) to stderr in --json mode and
      to stdout after the selectable rows in text mode.
    - >-
      T-2 EXPLICIT REQUESTS. When --experiment names a withheld id, the row is
      still returned, with its shape unchanged. stderr names the hold and its
      DEC. The hold governs unqualified and goal-scoped selection, not an
      operator's explicit request (AGENTS.md "Harness entry point").
      --goal selection applies the hold.
    - >-
      BACKWARD COMPATIBILITY IS A HARD CONSTRAINT. `--json` stdout stays a
      JSON list of row objects with exactly the current keys (id,
      designed_at, goal_id, hypothesis_id, specification, ecc, plus the
      execution_progress keys). No key is added, removed or renamed. The run
      skill's documented commands, `python3 tools/newest_experiments.py
      --limit 3 --json` and `python3 tools/newest_experiments.py --goal
      <GOAL-ID> --limit 0 --json`, must still emit a parseable JSON list on
      stdout. newest_runnable()'s signature stays call-compatible for
      orchestration/campaign/autopilot.py. Any new parameter is keyword-only
      with a default that honours holds. execution_progress() is unchanged.
    - >-
      A decision file that fails to parse is skipped with a stderr warning.
      It never crashes selection and never silently withholds anything.
    - >-
      TESTS. tools/test_ecc_priority_dispositions.py pins T-1: a disposition
      is honoured; a guard failure (an empty rule_9 field) keeps the idea
      open; `reopened` restores it; the disposed section is always printed;
      and, on the real corpus, the three SSI ideas IDEA-20261004-e4c461,
      -edbd24 and -a09dd4 stay open. tools/test_newest_experiments_withheld.py
      pins T-2 on a temporary fixture repo: the hold is honoured; a guard
      failure keeps the rows; a release restores them; --experiment still
      returns a named withheld row; the --json row shape is byte-identical in
      keys to a no-hold baseline; and the stderr count line is present. Its
      real-corpus test asserts a FLOOR, never an exact number (CLAUDE.md
      "A test that counts the whole corpus asserts a floor"): at least the
      151 ids of the two decisions are withheld, and none of the 22 ids in
      98a823's excluded_from_hold is withheld by 98a823.
    - >-
      Edit only write_scope paths. Do not edit any decision, specification,
      handoff, proposal, goal or bus file. Do not run any experiment and do
      not create any runs/ or implementation/ directory. Do not commit. The
      Coordinator snapshot TASK-20261005-d59b5a commits the output.
    - Amazon Bedrock is prohibited. It is not selected, configured, probed or contacted.
