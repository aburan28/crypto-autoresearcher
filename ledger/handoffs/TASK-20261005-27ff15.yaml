# =============================================================================
handoff:
  id: TASK-20261005-27ff15
  id_provenance: >-
    Pre-minted and collision-checked by the dispatching session, relayed.
    TASK-20261005-2af213 re-checks it on the merged tree (stopping gate).
  from: coordinator
  to: executor
  created_at: '2026-10-05'
  recorded_under: DEC-20261005-98a823
  objective: >-
    Two Coordinator decisions now carry explicit-ID dispositions that the
    selection tools do not read. DEC-20261005-138b51 has idea_dispositions and
    withheld_contracts, and DEC-20261005-98a823 has withheld_contracts. This
    task makes tools/ecc_priority.py (open ECC ideas) and
    tools/newest_experiments.py (the /run worklist) honour those blocks. It
    must stay backward compatible, and every disposed or withheld row must
    remain visible with the decision that disposed of it. The uncertainty
    reduced is whether a committed Coordinator hold actually governs the two
    selection points that AGENTS.md rule 11 and the run skill consult.
  uncertainty_reduced: >-
    Today a hold recorded by explicit ID in a committed decision does not
    change what /run or --open-ideas lists. That is measured by the
    dispatching session on f2da001b72: three template contracts topped the
    /run worklist. After this task, whether a row is listed follows from
    committed decisions and can be audited from the tool's own output.
  inputs:
    - ledger/decisions/DEC-20261005-138b51.yaml
    - ledger/decisions/DEC-20261005-98a823.yaml
    - coordination/archives/TASK-20261005-2af213/template-census.json
    - tools/ecc_priority.py
    - tools/test_ecc_priority.py
    - tools/newest_experiments.py
