handoff:
  id: TASK-20261005-6f0685
  from: coordinator
  to: coordinator
  objective: >-
    Run alone after TASK-20261005-84070d is terminal and atomically archive
    exactly its thirteen preparation artifacts plus one self-neutral receipt,
    before any lane opens or downstream task is claimed or launched.
  uncertainty_reduced: >-
    Whether the entire C-star producer/review protocol is durably frozen and
    reproducible from one exact commit before scientific work begins.
  inputs:
    - TASK-20261005-84070d
    - the thirteen exact preparation artifacts listed under exact_archive_paths
  constraints:
    - Run alone as an isolated Coordinator archive task.
    - >-
      Use parent ad936f5b92e4c54a78d6c4aace9c1bffa1a9bb1b exactly. Do not
      substitute the local merge commit, origin/main, or a later branch tip.
    - >-
      Stage exactly the thirteen non-self preparation artifacts and
      preparation-receipt.json. No claim, lane, queue state, source, goal,
      checkpoint, scientific ledger, or unrelated path may enter the commit.
    - >-
      Do not read producer outputs because none may exist. Do not interpret
      science, change status, launch/claim a task, or edit any non-receipt byte.
    - >-
      The receipt uses schema crypto.autoresearch.snapshot_receipt.v1, kind
      snapshot, commit_sha null, and resolves to the unique qualifying
      commit under the exact parent/path/hash/record-ID rules. Bind SHA-256 for
      every thirteen non-self path and write the self-neutral receipt last.
    - >-
      After commit, independently verify parent, exact fourteen changed paths,
      thirteen non-self hashes, record IDs, reachability, and push before any
      lane opening or producer claim. A mismatch blocks dispatch.
    - Use no Bedrock and perform zero scientific or implementation runs.
  deliverables:
    - coordination/design/TASK-20261005-84070d/review-preparation/archives/TASK-20261005-6f0685/preparation-receipt.json
  artifact_paths:
    - coordination/design/TASK-20261005-84070d/review-preparation/archives/TASK-20261005-6f0685/preparation-receipt.json
  write_scope:
    - coordination/design/TASK-20261005-84070d/review-preparation/archives/TASK-20261005-6f0685/
  archived_by: TASK-20261005-6f0685
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: high
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 1200
    memory_gb: 2
    maximum_runs: 0
    experiment_maximum_runs: 0
  completion_gate:
    - The archive commit parent is exactly ad936f5b92e4c54a78d6c4aace9c1bffa1a9bb1b.
    - The commit changes exactly thirteen preparation paths plus the self-neutral receipt.
    - The receipt binds all thirteen non-self SHA-256 values and the frozen record IDs.
    - Post-commit verification, reachability, and push succeed before lane opening or dispatch.
    - No producer read, scientific interpretation, status change, launch, or unrelated write occurred.
  return_format: >-
    Receipt path, resolved archive commit, exact parent, fourteen paths,
    thirteen non-self hashes, record IDs, verification, and push result.
  review_plan: null
  dispatch_preconditions:
    - TASK-20261005-84070d is terminal and all thirteen non-self paths exist and validate.

