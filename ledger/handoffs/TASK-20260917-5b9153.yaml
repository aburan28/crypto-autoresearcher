  kind: ledger_archive
  objective: >-
    Ledger-archive the validity-gate output of lifecycle step 8 for
    EXP-QSP-33b442 BEFORE any reviewer of TASK-20260917-43701b is launched:
    the correction CORR-20260917-8b80cc (which records the 15 record-schema
    defects, the remediation route for each, and the rulings on both
    amendments), the review-round card TASK-20260917-43701b carrying the
    review_plan, and this archive card. Dispatch precondition DP-1 of
    TASK-20260917-43701b forbids launching a reviewer while that card's
    archived_by is null, and DP-2 requires its declared inputs to be committed
    and pushed; CORR-20260917-8b80cc is a declared input. This archive
    satisfies both.
  uncertainty_reduced: >-
    none (archival). It binds the bytes of the review plan and its recorded
    prior BEFORE any reviewer runs, which is the whole point of recording a
    prior: a plan that exists only in a dirty worktree could be edited after
    the verdicts return and would be worth nothing.
  inputs:
    - ledger/corrections/CORR-20260917-8b80cc.yaml
    - ledger/handoffs/TASK-20260917-43701b.yaml
  constraints:
    - Run ALONE in the shared worktree; no other task writes while this commit is made.
    - origin/main was fetched and MERGED (never rebased) into claude/ecc2k-130-quasi-subfield-poly-nhcj1f before this commit. Base commit and merge outcome are recorded in the receipt.
    - Stage ONLY the declared paths; commit alone; the commit message references TASK-20260917-5b9153, TASK-20260917-43701b, CORR-20260917-8b80cc, H-QSP-5540d7 and EXP-QSP-33b442.
    - Record the receipt in ledger/archives/TASK-20260917-5b9153.yaml after the commit, with path_sha256 for every declared path.
    - Push the branch and open a PR against main naming the new records. A record in a local commit only is unpublished.
    - Edit NO existing record, and touch NO run manifest, measured value, count, histogram, seed, timestamp or certificate payload. This card archives records ABOUT the run package; it does not remediate it. The D1/D2 remediation that CORR-20260917-8b80cc prescribes is a separate, later Executor task and is NOT performed here.
    - This archive does NOT make the ledger validator green. EXP-QSP-33b442 remains red on 15 errors until the remediation task runs, and those errors are declared as known debt in the receipt rather than suppressed. tools/validate_ledger_baseline.txt is prune-only and must not be touched.
  deliverables:
    - one commit containing exactly the declared paths
    - ledger/archives/TASK-20260917-5b9153.yaml
    - a pushed branch with an open PR against main naming CORR-20260917-8b80cc and TASK-20260917-43701b
  artifact_paths:
    - ledger/corrections/CORR-20260917-8b80cc.yaml
    - ledger/handoffs/TASK-20260917-43701b.yaml
    - ledger/handoffs/TASK-20260917-5b9153.yaml
  archived_by: TASK-20260917-5b9153
  archived_by_note: >-
    Self-bound: this is the archive card itself, and it rides the commit it
    declares. That is the established shape for an archive card in this
    repository (TASK-20260917-0ef594 lists itself in artifact_paths).
  disclosure:
    - what: >-
        ledger/handoffs/TASK-20260917-43701b.yaml was authored by a coordinator
        subagent that had NO Bash tool and therefore could not parse-check its
        own output. As written it was UNPARSEABLE: line 180 began a YAML plain
        scalar with a backtick ("- `python3 tools/check_review_independence.py`
        accepts the composition: ..."), which yaml.safe_load rejects with
        "found character '`' that cannot start any token".
      repair: >-
        The orchestrating session single-quoted that one scalar. No key, no
        value, no joint, no owner, no probability and no word of the recorded
        prior was changed; the file now parses under yaml.safe_load. This is a
        serialisation repair performed BEFORE the record was ever committed and
        before any reviewer read it, disclosed here rather than silently, and
        is the same class of repair as PD-5 of the execution report.
    - what: >-
        The commit for this archive is made by the orchestrating session rather
        than by the coordinator subagent, because the coordinator subagent on
        this runtime has no Bash tool and cannot commit. The Coordinator
        authored every record in the declared set; the orchestrating session
        performed only the staging, the commit and the push.
  budget:
    runs: 0
    wall_clock_seconds: 900
  what_this_card_does_not_do: >-
    It creates no evidence record, no decision record and no analysis, changes
    no hypothesis status, dispatches no reviewer, and remediates no manifest.
    It binds bytes so that the review round can legally start.
