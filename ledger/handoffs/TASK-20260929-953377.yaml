  quantities:
    what_you_are_testing: >-
      Whether a set of group orders, admissibility flags, alphabet sizes,
      sample sizes and gaps are determined by elementary arithmetic and
      elementary group theory on the stated definitions. A second
      implementation will be compared with yours.
    parameters:
      koblitz_family: >-
        For each n from 3 to 63 inclusive, the curve y^2 + x y = x^3 + 1 over
        the field with 2^n elements (any irreducible modulus of degree n; the
        group order does not depend on the choice). Its group of rational
        points E_n.
      admissibility_rule: >-
        A curve is admissible if and only if its group order equals 4 times
        an odd prime and its 2-Sylow subgroup is cyclic (it has a point of
        order 4).
      composite_control: The n = 17 member of koblitz_family.
      ordinary_control_one: >-
        y^2 + x y = x^3 + A x^2 + B over F_2[t]/(t^19 + t^5 + t^2 + t + 1),
        A = 46693, B = 306147, where an integer is read as a bit pattern in the
        polynomial basis (bit i is the coefficient of t^i).
      ordinary_control_two: >-
        y^2 + x y = x^3 + A x^2 + B over F_2[t]/(t^17 + t^3 + 1), A = 97044,
        B = 126251, integers read as above.
      generic_control: Z/lZ with l the odd prime factor of the order of the n = 19 member of koblitz_family.
      alphabet_rule: >-
        For a cell with group order #E and largest prime factor p, and for
        each exponent e in {1/3, 1/4}: under reading N = p and under reading
        N = #E, M_unrounded = N^e, and M = 2^round(e times log2 N) with halves
        rounded up. For the generic control, #E = p = l.
      composite_alphabets: [548, 956]
      sample_rule: >-
        S_min(M) = 100 times M^2 and S_pow2(M) = 2 to the power
        ceiling(log2(100 times M^2)).
      deployed_prime: 680564733841876926932320129493409985129
      deployed_prime_note: a prime of 129 bits; you may verify primality but need not
      deployed_orders:
        target_subgroup: the deployed prime l
        full_group: 4 times the deployed prime
      exact_filter_definition: >-
        For a finite abelian group G written additively, a map h from G onto a
        set of size M is exactly sum-compatible if there is a combining rule f
        such that h(P + Q) = f(h(P), h(Q)) for all P, Q in G and f is
        invertible in each argument. The capacity of G below a bound X is
        log2 of the largest M strictly less than X for which such an h exists.
      k_values: [4, 8, 16, 32]
      list_size_rule: >-
        For k = 2^j lists over a group of order N, the list size is
        L = N^(1/(j + 1)); the needed alphabet per internal level is L.
    Q0:
      name: undetermined choices
      definition: >-
        Every point at which the definitions above left you a choice (the
        rounding of M, the treatment of n where the order has no odd prime
        factor, real versus integer arithmetic, whether M = 1 counts). For
        each, quote the text, list the admissible readings, and say which
        quantities depend on it.
      report: A list. An empty list is a result and must be stated as such.
    Q1:
      name: Koblitz orders and admissibility
      definition: >-
        For each n from 3 to 63, #E_n, its full factorisation, whether it
        equals 4 times an odd prime, whether the 2-Sylow subgroup is cyclic,
        and the admissibility flag. For n = 17, the full set of divisors of
        #E_17.
      report: A table per n, and the divisor list for n = 17. State the method you used and how you checked it.
      tolerance: exact
    Q2:
      name: control-cell orders
      definition: >-
        The group orders of ordinary_control_one and ordinary_control_two,
        their factorisations and their largest prime factors, and l of the
        generic control.
      report: Each order, factorisation and largest prime factor, with the method and a second check.
      tolerance: exact
    Q3:
      name: alphabet grid
      definition: >-
        For every admissible n in Q1, for n = 17 (the composite control), for
        both ordinary controls and for the generic control: M_unrounded and M
        under both N readings and both exponents, as alphabet_rule states.
      report: A table per cell, reading and exponent, with log2 M_unrounded to four decimals and M.
      tolerance: exact on M given the reading and the rounding rule
    Q4:
      name: repriced sample sizes
      definition: >-
        For every (cell, reading, exponent) row of Q3, and for the composite
        control's alphabets 548 and 956: log2 S_min(M) and log2 S_pow2(M).
        Per cell and reading, the sum over its two exponents of S_min, in
        bits.
      report: A table per row with both values to four decimal bits, and the per-cell sums.
      tolerance: 0.01 bit per entry; 0.1 bit on sums
    Q5:
      name: ambient gap table
      definition: >-
        For each k in k_values and each of the two deployed_orders: log2 L by
        list_size_rule, the capacity of a group of that order below X = the
        deployed prime by exact_filter_definition (argue it from first
        principles), and log2 L minus that capacity, in bits.
      report: Per k and per ambient, the three values to four decimal bits, with the capacity argument in your own words.
      tolerance: 0.05 bit; exact on the capacities
    rules:
      - BL-1 Read only the four whitelisted repository paths. Every other repository path is out of scope.
      - BL-2 Run no git command that shows history (log, show, blame, diff) and read no pull-request text.
      - >-
