handoff:
  id: TASK-20260807-681e17
  recorded_at: '2026-08-07'
  from: coordinator
  to: executor
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-aa267f
  experiment_id: EXP-INSTR-85b102
  hypothesis_id: H-INSTR-fffbfb
  question_id: RQ-INSTR-f8faa0
  objective: >-
    Implement and execute the frozen, approved contract EXP-INSTR-85b102 exactly
    as written. Build harness/run_blocknull.py with the required new functions,
    then run stages S0 through S5 in order: S0 freezes the four declared pools at
    p = 4001 and p = 6007 BEFORE any functional is measured; S1 is a zero-compute
    arithmetic gate on committed numbers that can end the run in seconds; S2
    reproduces the committed sampler-free permutation fixtures; S3 measures every
    declared functional per curve; S4 runs the blocking ladder R0_FREE through
    R5_PERCLASS; S5 runs the control objects (CTRL-NULLOBJ, CTRL-SIZE0,
    CTRL-POWER, CTRL-NSURR). Deliver an INSTRUMENT characterisation with per-rung
    operating characteristics.
  uncertainty_reduced: >-
    Whether the campaign's free label-permutation null (NULL-C,
    harness/exp_icinv.py::permutation_null) can be replaced by a blocked
    permutation that simultaneously (i) removes the group-order contamination it
    currently reports as structure, (ii) keeps calibrated size on a
    trace-independent null object, and (iii) retains enough power to detect a
    planted between-class effect -- and, if no rung of the ladder does all three
    at the campaign's pools, to say so plainly and quantify the trade. This
    addresses DEC-20260807-c8aa8b next action N2, which BATCH-523510 discharged by
    CHARACTERISATION rather than replacement; the replacement is what remains
    undone.
  inputs:
  - experiments/EXP-INSTR-85b102/specification.yaml
  - ledger/hypotheses/H-INSTR-fffbfb.yaml
  - ledger/proposals/IDEA-20260807-34754f.yaml
  - ledger/evidence/EV-ENDO-10109d.yaml
  - ledger/decisions/DEC-20260807-41c173.yaml
  - harness/exp_icinv.py
  - harness/isogeny_class.py
  - harness/toycurve.py
  - harness/run_icinv.py
  - harness/runner.py
  constraints:
  - >-
    THE CONTRACT IS FROZEN. Pools, primes, functionals, rungs, replicate counts,
    thresholds, controls and the S0-S5 stage order were all fixed before any run
    exists. Any change requires a versioned protocol_amendment under
    experiments/EXP-INSTR-85b102/amendments/ filed BEFORE the extra data is
    generated.
  - >-
    NO EXISTING FUNCTION'S BEHAVIOUR MAY CHANGE. `_targets`, `targets_uniform`,
    `permutation_null`, `binomial_null_verdict`, `exact_null_verdict`,
    `decomposition_rate_m2`, `decomposition_rate_m3`, `liftable_density`,
    `factor_base_fixed_size`, `factor_base_window` and `two_torsion_x_count` are
    frozen; four committed runs depend on their current behaviour and this
    campaign has already been bitten twice by a silently altered sampler
    (CORR-20260807-a05e1e, CORR-20260807-9f83be). New capability goes in
    harness/run_blocknull.py as NEW functions, and a diff showing zero
    behavioural change to the frozen functions is a required artifact.
  - >-
    S0 FREEZES THE POOL BEFORE ANY FUNCTIONAL IS MEASURED. This is the quantifier
    order the contract exists to enforce -- choosing the pool after seeing the
    functional is the weaker statement and is forbidden. Record realized traces,
    N, class sizes, aut-order histogram, Delta_pool against 4*sqrt(p), dropped
    classes, and the full rung table, then stop touching the pool.
  - >-
    RUN S1 BEFORE SPENDING ANY COMPUTE. It re-derives mean_c Var(z_c)/4 against
    the committed 0.24938572928898783 and the closed-form free-permutation null
    mean against the committed 1.0357263552475702e-05, from committed numbers
    alone, in seconds. If either fails, the diagnosis that the committed 664x is
    the group order is WITHDRAWN, the run ENDS there, and that withdrawal is the
    deliverable -- not a failure to be worked around.
  - >-
    THE PERMUTATION STUDY MUST BE NUMPY-VECTORIZED. 4 pools x 7 rungs x 13
    functionals x 10000 permutations, plus 4 pools x 7 rungs x 6 effect sizes x
    200 replicates x 1000 permutations, will exceed the budget otherwise. An
    unvectorized study that blows the budget is an IMPLEMENTATION DEFECT reported
    as an infrastructure receipt, never as a result, and the correct response is a
    reduced replicate count (declared minimum 100 per cell) reported AS a
    reduction -- never a quietly smaller study presented as the planned one.
  - >-
    HONOUR THE STOPPING RULES AS WRITTEN. Any class_census failure, any
    sampler-free S2 fixture that fails to reproduce, R5_PERCLASS returning
    anything other than exactly 1.0, `order` returning nonzero within-class
    variance, or more than half the committed reproduction fixtures resolving
    UNREACHABLE -- each stops the run and makes the stop itself the deliverable.
    A rung whose CTRL-NULLOBJ or CTRL-SIZE0 rejection falls outside its exact
    binomial interval reports NO result from that rung.
  - >-
    A timeout, crash, OOM, missing dependency, unreadable artifact or unresolvable
    committed fixture is status failed_infrastructure with its cause recorded. It
    is NEVER negative mathematical evidence and never counts toward the
    falsification criterion (AGENTS.md rule 5).
  - >-
    DO NOT INTERPRET AND DO NOT MOVE ANY STATUS. This contract retires nothing:
    the committed free permutation is RETAINED and REPORTED at rung R0_FREE as the
    contamination diagnostic, because the gap between the free and blocked results
    IS the measure of N-contamination. Whether NULL-C is actually replaced is a
    Coordinator decision on a later ledger archive after independent review
    (AGENTS.md rule 1).
  - >-
    Never fabricate a command, an output, a timing, a statistic or a run. A
    measurement not taken stays missing and is reported as missing (AGENTS.md
    rule 9).
  - >-
    Fetch origin/main and compare it with this branch before the run manifests are
    written; record the base commit checked and the merge outcome in the execution
    report. Merge new main changes, never rebase pushed run records.
  - >-
    Mint every new identifier with `python3 tools/allocate_id.py --next <type>`
    and confirm it with --check before use. Do not grep committed state for the
    next free number.
  - >-
    Lawful defensive cryptanalysis on public toy constructions only (p in {4001,
    6007}). No live key, wallet or deployed system is touched.
  deliverables:
  - harness/run_blocknull.py
  - >-
    One immutable run directory per (prime, pool) under
    experiments/EXP-INSTR-85b102/runs/<RUN-ID>/, each carrying the full artifact
    set named in the contract's required_artifacts block.
  - >-
    results.json -- every primary and secondary metric keyed by (pool, functional,
    rung, statistic, B).
  - >-
    pool_table.json -- per class: trace, N, size, aut-order histogram, Var(z),
    sorted-z hash, census observed vs Hurwitz-predicted weighted count, agreement
    flag, dropped/kept.
  - >-
    rung_table.json -- per pool per rung: n_blocks, block composition by trace,
    Delta_max, blocks with >=2 and >=3 classes, degenerate flag.
  - per_curve.csv -- one row per curve with every declared functional.
  - >-
    controls.json -- CTRL-NULLOBJ and CTRL-SIZE0 rejection counts with exact
    binomial intervals; CTRL-POWER curves with delta*(rung) and power cost;
    CTRL-NSURR excess curves with each slope labelled EXACT or ESTIMATED and its
    standard error.
  - >-
    committed_fixture_table.json -- fixture, primary path, RESOLVED/UNREACHABLE,
    value read, signed difference.
  - >-
    prediction_scorecard.json -- P1-P8 scored MET / NOT MET / NOT DECIDABLE with
    the deciding number, each flagged IN-SAMPLE or OUT-OF-SAMPLE.
  - frozen_function_diff.txt -- behavioural diff status for every frozen harness function.
  - >-
    coordination/goals/GOAL-ENDO-001/batches/BATCH-aa267f/execution/EXP-INSTR-85b102/execution_report.md
    -- what ran, what did not, every deviation, every reduced replicate count and
    why, with no interpretation of what it means for the research question.
  artifact_paths:
  - harness/run_blocknull.py
  - experiments/EXP-INSTR-85b102/runs/
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-aa267f/execution/EXP-INSTR-85b102/execution_report.md
  archived_by: null
  inference:
    policy: executor-implementation
    requested_policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
    independent_session_note: >-
      The Executor runs in a session separate from the Coordinator session that
      drafted and approved this contract. Under this Claude Code harness every
      policy alias resolves to the one model the session runs on (CLAUDE.md model
      policy note), so "independent session" means independent context and a fresh
      reading, not a genuinely different model. Record requested_policy alongside
      the resolved model id in every run manifest, with fallback_used: true and
      its reason if they differ. Never silently substitute. The contract's own
      inference block records execution_policy_recommendation:
      executor-implementation, which this handoff adopts unchanged.
  budget:
    wall_clock_seconds: 5400
    memory_gb: 4
    maximum_runs: 16
    total_cpu_hours: 6
    budget_note: >-
      Taken verbatim from the contract's budget block. Measurement (O(p) liftable
      count and O(p) 2-torsion count per curve over roughly 1200 curves per
      twelve-class pool) is minutes; the committed RUN-ICINV-p4001-a measured 472
      curves in 43.4 s wall at 84.8 MB peak RSS. The only arm that can blow the
      budget is the permutation study, which REQUIRES vectorization -- see the
      constraint above.
  completion_gate:
  - >-
    harness/run_blocknull.py exists with all required new functions, and
    frozen_function_diff.txt shows ZERO behavioural change to every frozen harness
    function named in the contract.
  - >-
    S0 completed and the pool is frozen with its provenance recorded BEFORE any
    functional was measured; class_census agrees at both primes.
  - >-
    S1's arithmetic gate is reported with both re-derived values and their signed
    differences against the committed constants -- whether it passed or ended the
    run.
  - >-
    Every sampler-free committed fixture in S2 reproduced exactly on raw counts,
    not merely on rounded p-values, with the realized dict insertion order
    recorded.
  - >-
    Every (pool, functional, rung) cell reports T_obs for both statistics, the
    empirical and closed-form null means with their residual in Monte-Carlo
    standard errors, both tails' raw counts and p-values, ratio R, Delta_max, the
    nuisance budget, and the degeneracy flag.
  - >-
    R5_PERCLASS returns exactly 1.0 and `order` returns zero within-class
    variance; anything else is an implementation defect and stops the run.
  - >-
    CTRL-NULLOBJ, CTRL-SIZE0, CTRL-POWER and CTRL-NSURR are reported at every rung
    and pool, with realized size given against its exact binomial interval; no
    rung whose size is uncalibrated contributes a reported result.
  - >-
    prediction_scorecard.json scores P1-P8 with the deciding number and an
    IN-SAMPLE / OUT-OF-SAMPLE flag on each.
  - >-
    Any replicate-count reduction is reported AS a reduction with its realized
    count, and any budget or infrastructure failure is recorded as
    failed_infrastructure rather than as a result.
  return_format: >-
    An execution report at the path above plus the run directories. State what
    each rung's realized size, power and nuisance budget were, and stop there. Do
    NOT write an evidence record, do not move a hypothesis status, and do not
    declare NULL-C replaced or retained -- that is a Coordinator act on a later
    ledger archive after independent review. If S1 or S2 ends the run, report the
    withdrawal or the instrument instability as the deliverable, in full, and
    conclude nothing further.
  scope_and_honesty: >-
    Tier TOY and no downstream citation may raise it. sota_delta is zero. This is
    an INSTRUMENT characterisation: not an ECDLP attack, not a relation collection,
    not a solver run, not a cost or exponent claim, not an adjudication of
    RQ-ICINV-475b5e's isogeny-class invariance question in either direction, and
    not an investigation of the within-class over-dispersion, which is a different
    object handled by EXP-ICINV-4d33aa. The contract's divergence_from_parent_
    proposal block already records, from committed numbers and before any run,
    that twist blocking moves the variance ratio by only about 7% and leaves the
    p-value at the resolution floor -- contradicting IDEA-20260807-34754f's own
    recommended design. Report the measured outcome against that pre-registered
    contradiction whichever way it falls.
