  - https://safecurves.cr.yp.to/complete.html
  - https://safecurves.cr.yp.to/ind.html
  - https://safecurves.cr.yp.to/verify.html
  constraints:
  - Create exactly twenty goals and twenty bound research questions, one per intake
    row.
  - The intake tuple and expected matrix are user-supplied and unverified until primary-source
    reconciliation.
  - The first batch is planning and intake only and must not execute an attack or
    create evidence or conclusions.
  - Do not execute any generated task as part of this bootstrap.
  - Do not create hypotheses, experiments, findings, decisions, or safety or vulnerability
    conclusions.
  - Do not push or create a pull request from this task.
  - Never select a provider, backend, endpoint, or model identifier containing Bedrock,
    case-insensitively.
  - Every SafeCurves True or False cell is user-supplied, unverified intake and a
    preregistered comparison target; it is not evidence.
  - A failure of rigidity, ladder availability, completeness, or indistinguishability
    is not by itself an ECDLP break.
  - The Anomalous and BN(2,254) rows are positive-control candidates for the described
    transfer or small-discriminant behavior, not newly discovered attacks; their parameters
    and behavior still require sourced reproduction.
  - The declared diagnostic list is deliberately non-exhaustive; a sourced, measurable
    additional parameter-level weakness may be added through a later scoped handoff.
  - Infrastructure errors, timeouts, unavailable dependencies, and budget stops are
    operational observations, never mathematical evidence.
  deliverables:
  - Twenty persistent goal records
  - Twenty research-question records
  - Twenty planning-only first batches and bounded dispatch queues
  - Forty task cards and matching persisted handoffs
  - Machine-readable bootstrap manifest
  - Post-commit bootstrap snapshot receipt written by the control plane
