handoff:
  id: TASK-20260824-41038d
  from: coordinator
  to: coordinator
  objective: Bootstrap one durable, bounded, non-duplicative planning goal for each
    of the twenty user-supplied SafeCurves rows.
  uncertainty_reduced: Whether all twenty intake rows can be represented as schema-valid,
    independently auditable, bounded planning campaigns without duplicating an existing
    audit lane or treating the table as evidence.
  inputs:
  - User-supplied twenty-row SafeCurves table and exact parameter tuples
  - AGENTS.md
  - CLAUDE.md
