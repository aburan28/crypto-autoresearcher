handoff:
  id: TASK-20260801-050
  from: coordinator
  to: coordinator
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-025
  objective: >-
    Commit the exact TASK-20260801-049 driver, calibration run package, calibration results and
    execution report alone, with this receipt, and BIND DRIVER_SHA256 as a named receipt field so
    the measurement arm can be proved to have executed the identical file.
  uncertainty_reduced: >-
    Whether the calibration package and the driver that produced it are durable and hash-bound
    before any independent session reads them and before the reading rule is frozen against them.
  inputs:
  - TASK-20260801-049 artifacts
  constraints:
  - 'RUN ALONE. Stage exactly the paths in declared_commit_sets.TASK-20260801-050_snapshot - fifteen paths.'
  - 'Do not stage the reading rule, ledger records, the queue, the handoffs or any review file.'
  - 'Record DRIVER_SHA256 and the sha256 of each of the four calibration result files as named receipt fields.'
  - 'Record PILOT_PROJECTION_RESULT and BUDGET_EVENT with literal values, so a budget abort is visible in the receipt rather than only in the log.'
  - 'State NO interpretation and NO approval determination. This receipt authorizes nothing.'
  - 'Commit message must contain TASK-20260801-050, TASK-20260801-049, EXP-LPF-001, RUN-LPF-001-calib, GOAL-ECDLP-001, BATCH-025.'
  - 'Do not push from this task.'
  deliverables:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/archives/TASK-20260801-050/snapshot_commit_receipt.json
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/archives/TASK-20260801-050/snapshot_commit_receipt.json
  archived_by: TASK-20260801-050
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 900
    memory_gb: 1
    maximum_runs: 1
  completion_gate:
  - 'Post-commit verifier accepts the exact fifteen-path diff and file hashes.'
  - 'DRIVER_SHA256 and the four calibration result hashes recorded as named fields.'
  - 'PILOT_PROJECTION_RESULT and BUDGET_EVENT recorded; no interpretation and no authorization stated.'
