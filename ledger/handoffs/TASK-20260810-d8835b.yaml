handoff:
  id: TASK-20260810-d8835b
  recorded_at: '2026-08-10'
  goal_id: GOAL-AES-002
  question_id: RQ-AES-002
  batch_id: BATCH-2b0fd1
  task_card: coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/task-cards/TASK-20260810-d8835b.md
  role: idea-generator
  from: coordinator
  to: idea-generator
  objective: >-
    Generate, object-first under docs/inventor-protocol.md section 1, candidate
    tracked objects for single-key cryptanalysis of FULL-ROUND AES-128/192/256 at
    10/12/14 rounds, with the established families declared off-limits as the
    primary lens, the lossy-projection test applied to every candidate BEFORE any
    compute is requested, and each surviving candidate scored on three axes:
    genuinely new versus repackaging; concretely testable within the measured
    envelope; and how far it survives before the structure dissolves, with the
    FULL round count as the survival target.
  uncertainty_reduced: >-
    Whether any tracked object exists that is not a renamed variant of an
    established family, whose one-step propagation can be defined and measured
    inside this environment's envelope, and which is still alive at the full
    round count. This is the item the whole goal exists for and the campaign has
    no dispatched enumeration of its own.
  inputs:
    - RQ-AES-002
    - GOAL-AES-002
    - CM-1
    - protocol-amendment-GOAL-AES-002-001
    - KN-FIND-028
    - KN-FIND-029
    - coordination/goals/GOAL-AES-002/batches/BATCH-001/tasks/ideation
    - coordination/goals/GOAL-AES-002/batches/BATCH-001/tasks/ideation2
    - coordination/goals/GOAL-AES-002/redteam/findings.yaml
  constraints:
    - >-
      SC-1 C2 STAMP DUTY. As its FIRST act, before any research work, this task
      writes a stamp record carrying start_utc, start_epoch,
      declared_wall_clock_seconds and a binding_stop_utc COMPUTED as start plus
      declared; writes a further stamp at EACH major section boundary carrying
      utc, elapsed_s and a marker naming what was completed; HALTS at
      binding_stop_utc, records halted_on_budget truthfully and NAMES the work
      dropped; and COMMITS those stamps as a declared artifact, carried as a
      budget block inside this task's designated covering manifest. The
      TASK-20260801-810 budget block is the reference implementation. A halt at
      binding_stop_utc is INFRASTRUCTURE SIGNAL, never a negative mathematical
      result (AGENTS.md rule 5), and dropped work is SCOPE, never an answer
      (rule 8).
    - >-
      SC-2 C4 DECLARATION BASIS. The declared wall_clock_seconds is calibrated
      against AUTHORING-INCLUSIVE session elapsed; the compute component is
      reported SEPARATELY in its own field and may NOT be offered as evidence of
      budget compliance. Discharging SC-1 is FULL compliance even if the charged
      figure later exceeds the declaration, and any residual is a campaign-side
      accounting fact, never a producer defect.
    - >-
      SC-3 COVERING MANIFEST AND CLOSED CLASS VOCABULARY. Every declared
      source-code artifact carries a comment-block inference stanza in its own
      text. AT LEAST ONE machine-readable manifest of this task, DESIGNATED THE
      COVERING MANIFEST by this task's card and by the manifest itself, carries
      an artifact_provenance list covering EVERY declared artifact of the task,
      and EVERY OTHER manifest of the task appears as an ENTRY in it, with fields
      path, kind, sha256, comment_block_inference_stanza (boolean, stated
      honestly including when false) and
      covered_by_this_manifest_inference_block (boolean). A self-referential
      digest is impossible and is recorded as SELF. The kind vocabulary is CLOSED
      and CASE-INSENSITIVE - SOURCE_CODE, MACHINE_READABLE_MANIFEST,
      PROSE_REPORT, LEDGER_AND_COORDINATION_RECORD - matched ignoring
      underscore/hyphen/space differences; no fifth class may be invented, a
      value outside the vocabulary is a DEFECT TO REPORT, and any
      machine-readable structured-data artifact resolves to
      MACHINE_READABLE_MANIFEST.
    - >-
      SC-4 THE R5 ANTI-LAUNDERING CLAUSE, QUOTED VERBATIM FROM RQ-AES-002 AND
      BINDING AS A COMPLETION GATE ON EVERY DELIVERABLE OF THIS TASK: "R5. THE
      ANTI-LAUNDERING CLAUSE. Any record, in any location, that states a margin
      MUST in the SAME SENTENCE (i) name the reference as exhaustive key search
      at the stated key size under CM-1, and (ii) declare the
      published-state-of-the-art comparison UNADJUDICABLE in this environment.
      Transcribing a definitional-reference margin as a state-of-the-art margin
      — in a headline, an evidence record, a decision, a synthesis, a status
      line, a cross-reference, a knowledge entry, a PR title or a commit message
      — is a CLAIM-TIER VIOLATION and is handled exactly as
      docs/claims-and-verification.md handles dropping a conditional qualifier:
      as an assertion above what the record supports. OPERATIONALLY, under
      docs/inventor-protocol.md section 5: every ideation and closure deliverable
      under this question sets `dominated_by: "unresolvable in this environment:
      no primary source reachable; every recalled frontier row is
      unverified-from-memory"` and NEVER `null`, because `null` asserts the
      frontier was checked row by row and it cannot be. `sota_delta` records the
      DEFINITIONAL-REFERENCE delta, explicitly labelled as such, plus the word
      `unadjudicable` for the published frontier."
    - >-
      SC-5 NO RECALLED LITERATURE FIGURE MAY BE CITED AS AUTHORITY, IN EITHER
      DIRECTION. A recalled figure may be named as context with its status
      declared, and may never be used to compare, rank, screen, size, promote or
      DISMISS anything. Using an unverified recollection to dismiss is the same
      fabrication as using it to promote.
    - >-
      SC-6 NO COMPARISON AGAINST THE PUBLISHED STATE OF THE ART IS ASKED FOR OR
      ADMITTED. It is unadjudicable in this environment in both directions; the
      only quantitative reference this campaign may use is the DEFINITIONAL
      exhaustive-key-search reference under CM-1.
    - >-
      SC-7 EVERY DELIVERABLE STATING A MARGIN CARRIES THE R5 CLAUSE IN THE SAME
      SENTENCE, not in a footnote, an appendix, or a later paragraph.
    - >-
      SC-8 NO REDUCED-ROUND FINDING PRODUCED UNDER THIS GOAL MAY BE ASSERTED
      HERE. It belongs to RQ-AES-001's ceiling and is cross-filed there
      (GOAL-AES-002 non_completion_criteria (iii); RQ-AES-002
      relationship_to_RQ_AES_001 (iv)).
    - >-
      SC-9 ANYTHING NOT ATTEMPTED IS NAMED OPEN AND UNATTEMPTED and is NEVER
      recorded as tried, screened or negative (AGENTS.md rules 5 and 8).
    - >-
      SC-10 FABRICATE NOTHING. No invented timing, measurement, throughput,
      citation, review verdict, model identifier or commit SHA. A field that is
      not yet knowable stays null and is named as such.
    - >-
      SC-11 NEVER SELECT, CONFIGURE, PROBE, CONTACT OR USE AMAZON BEDROCK, in any
      runtime, backend, endpoint, model identifier, fallback or probe (AGENTS.md
      rule 16).
    - >-
      THE ESTABLISHED FAMILIES ARE DECLARED OFF-LIMITS AS THE PRIMARY LENS, per
      RQ-AES-002 objects_declared_off_limits_as_the_primary_lens: differential
      and truncated differential; linear and multidimensional linear; integral /
      square / division property; impossible differential; meet-in-the-middle and
      Demirci-Selcuk; boomerang and retracing boomerang; biclique; algebraic
      (XSL-family) and Groebner-basis; yoyo; mixture differential /
      exchange-attack; subspace trail; partial sums as a cost reorganisation. A
      candidate that is a renamed variant of any of these is recorded as a
      REDISCOVERY, not as a candidate. That list is RECALLED FROM MEMORY, is
      UNVERIFIED, and is a screening aid and never an authority: a candidate is
      NOT established as novel by failing to match it.
    - >-
      THE LOSSY-PROJECTION TEST IS APPLIED TO EVERY CANDIDATE BEFORE ANY COMPUTE
      IS REQUESTED. A projection that discards nothing is a change of
      coordinates, not a new object. This is the highest-value activity available
      in this environment because it costs no compute at all. Record the test
      result for every candidate, including the ones it kills.
    - >-
      SCORE EVERY SURVIVING CANDIDATE ON THREE AXES, EXPLICITLY AND SEPARATELY:
      (1) genuinely new versus repackaging; (2) concretely testable - can its
      one-step propagation be DEFINED and MEASURED within the measured envelope
      of TASK-20260810-2a0a37; (3) how far it survives before the structure
      dissolves, with the FULL round count (10/12/14, not a reduced one) as the
      survival target.
    - >-
      THE OBJECT ENUMERATION IS A REQUIRED ARTIFACT AND IS EXPLICITLY NOT A
      COMPLETION (GOAL-AES-002 non_completion_criteria (i)). Under
      docs/inventor-protocol.md section 4 a count of screened-and-rejected
      mechanisms is a FATIGUE REPORT, its honest status is unverified, and it is
      a statement about the search rather than about the problem. Write it that
      way. It may later be promoted to KN-OPEN; it does not close this goal and
      must not be presented as closing anything.
    - >-
      PREMATURE CLOSURE IS A FAILURE MODE SYMMETRIC WITH OVERCLAIMING. Do not
      decline to generate on the grounds that AES is exhaustively studied; "this
      space is mined" is a hypothesis about the search. Equally, do not pad: a
      short honest list beats a long one. A claimed closure of a named object
      class needs a named obstruction, an argument, and forward guidance naming
      what remains open, and no such closure is being asked for in this task.
    - >-
      THE HONEST-ACCOUNTING BLOCK IS MANDATORY (docs/inventor-protocol.md section
      5). Set dominated_by to the exact string "unresolvable in this environment:
      no primary source reachable; every recalled frontier row is
      unverified-from-memory" and NEVER to null. Record sota_delta as the
      DEFINITIONAL-REFERENCE delta, explicitly labelled as such, plus the word
      unadjudicable for the published frontier.
    - >-
      PRIOR WORKING-TREE ARTIFACTS UNDER THIS GOAL'S PATH ARE INPUTS, NOT
      EVIDENCE, AND ARE NOT ADOPTED BY THIS BATCH. Two undispatched ideation
      passes and a red-team report dated 2026-08-01 exist under
      coordination/goals/GOAL-AES-002/. Read them, deduplicate against them, and
      cite them by path with their status attached. You may NOT re-present their
      content as this task's new work, and you may NOT record any object they
      name as tried, screened, closed or negative on their authority: they were
      produced under no dispatched card, no budget, no stamps, no snapshot and no
      review.
    - >-
      Attempt knowledge retrieval and record the exact query and outcome. An
      unavailable index licenses no absence, novelty or prior-non-testing
      inference, and equally no non-novelty inference.
    - >-
      REQUEST NO COMPUTE IN THIS TASK. Zero experiments are authorized. A
      candidate whose cheapest falsification gate does not fit the measured
      envelope is recorded as OUT OF SCOPE FOR EXECUTION, never estimated into a
      result.
    - >-
      Claim ceiling is RQ-AES-002 R7, default tier toy. Assert no key recovery,
      no distinguisher, no margin, no barrier statement, no universal
      impossibility, and nothing about deployed AES.
    - >-
      Write only beneath the assigned write_scope, make no ledger, queue or
      committed-record edit, and make no commit. TASK-20260810-1a81be snapshots
      these bytes before review.
  deliverables:
    - object-enumeration.yaml, designated the covering manifest for this task
    - ideation-report.md, including the section-5 honest-accounting block
  artifact_paths:
    - coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/tasks/TASK-20260810-d8835b/object-enumeration.yaml
    - coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/tasks/TASK-20260810-d8835b/ideation-report.md
  archived_by: TASK-20260810-1a81be
  inference:
    policy: research-deep
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 1600
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
    - >-
      object-enumeration.yaml is strict parseable YAML in which EVERY entry
      carries its tracked object, its lossy-projection test result, its
      deduplication verdict against the named families, and all three axis scores
      with the full round count as the survival target.
    - >-
      The enumeration states in its own text that it is a required artifact and
      NOT a completion, with its honest status recorded as unverified per
      docs/inventor-protocol.md section 4.
    - >-
      The section-5 honest-accounting block sets dominated_by to the exact
      unresolvable-in-this-environment string and never to null, and records
      sota_delta as the definitional-reference delta plus unadjudicable for the
      published frontier.
    - >-
      SC-4 is satisfied on every deliverable; no sentence states a margin without
      the R5 clause in the same sentence, and no comparison against the published
      state of the art appears in either direction.
    - >-
      Prior 2026-08-01 working-tree artifacts are cited by path with their
      unadopted status attached, and nothing in them is recorded as tried,
      screened or negative.
    - >-
      Knowledge retrieval was attempted and its query and outcome recorded; no
      absence, novelty or non-novelty inference is drawn from it.
    - >-
      Zero compute was requested and zero experiments were run; anything not
      attempted is named OPEN AND UNATTEMPTED.
  return_format: >-
    A YAML summary naming the two written paths, the count of objects enumerated,
    how many were killed by the lossy-projection test, how many deduplicated to a
    named family as rediscoveries, how many survive at the full round count, the
    exact dominated_by string used, the knowledge-retrieval query and outcome,
    and the SC-1 budget stamp block with halted_on_budget stated truthfully and
    any dropped work named.
