handoff:
  id: TASK-20260721-008
  supersedes: TASK-20260721-002
  from: coordinator
  to: idea-generator
  objective: >-
    Produce at most two novel, cryptographically relevant verification or cost-model
    techniques that can make an ECDLP research decision more rigorous, reproducible,
    or cheaper, while actively searching for a path from the technique to reduced
    attack cost.
  uncertainty_reduced: >-
    Whether the current harness lacks a decision-critical certificate, lower-bound
    audit, multi-target accounting method, benchmark design, or falsification tool
    whose validation would materially improve prime-field ECDLP research.
  inputs:
    - AGENTS.md
    - docs/
    - harness/
    - tools/
    - templates/
    - ledger/
    - experiments/
    - knowledge/
    - ideas/
    - focus/
    - ledger/decisions/DEC-20260721-002.yaml
  constraints:
    - Deduplicate against every existing technique, experiment instrument, certificate rule, open problem, idea, rejected/preallocation record, and recent review report.
    - Preserve all pre-existing dirty ideas/ paths exactly and write only beneath the assigned task directory.
    - Favor methods that expose hidden preprocessing, source-replay, memory, parallelism, invalid-run, certificate, or claim-tier failures.
    - A workflow improvement must change a concrete cryptanalytic decision or cost; generic project-management advice is out of scope.
    - Include a credible route to ECDLP attack-cost reduction or state plainly that the value is rigorous methodology rather than an attack improvement.
    - Use public/toy fixtures only and never target live keys or deployed systems.
    - Do not implement tools, execute experiments, allocate canonical IDs, change official status, or claim a breakthrough.
    - Start only when the orchestrator selects exact model slug gpt-5.6-sol-high.
    - Record requested_policy research-sol-max, resolved_model_id gpt-5.6-sol-high, reasoning_effort high, fallback_used true, adapter_version, authorization decision DEC-20260721-002, and the exact corpus boundary inspected.
  deliverables:
    - methodology_frontier.yaml
    - cost_audit.md
  artifact_paths:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-001/tasks/TASK-20260721-008/methodology_frontier.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-001/tasks/TASK-20260721-008/cost_audit.md
  archived_by: TASK-20260721-009
  inference:
    policy: research-sol-max
    fallback_allowed: true
    fallback_model: gpt-5.6-sol-high
    authorization_ref: DEC-20260721-002
    required_resolution:
      requested_policy: research-sol-max
      resolved_model_id: gpt-5.6-sol-high
      reasoning_effort: high
      fallback_used: true
    independent_session_required: false
  budget:
    wall_clock_seconds: 3600
    memory_gb: 6
    maximum_runs: 1
  completion_gate:
    - Both deliverables exist at the exact paths and bind the inspected corpus by commit plus explicit dirty-tree boundary.
    - Every survivor names a decision-changing uncertainty, an auditable artifact, the cheapest validation, failure modes, and quantitative resource savings or rigor gain.
    - The deduplication section identifies the nearest existing harness component and the exact additional capability.
    - The inference receipt exactly records the authorized fallback fields; any different model or omitted field makes the task invalid.
    - If no technique survives, the report gives one precise methodological gap without treating it as cryptanalytic evidence.
  return_format: >-
    YAML terminal verdict TECHNIQUE | FRONTIER_ONLY | INVALID plus a Markdown
    decision-impact and complete-cost audit.
