  constraints:
    - id: RC-1
      text: >-
        BLINDNESS. Do not read anything under
        coordination/goals/GOAL-GFPN-380702/reviews/ except your own directory
        coordination/goals/GOAL-GFPN-380702/reviews/TASK-20260923-58953e/. If
        you encounter a sibling report, stop and declare it.
    - id: RC-2
      text: >-
        CHANGE NO RECORD. Write only inside your write_scope; do not write
        under experiments/; mint nothing. Where you judge a correction owed
        (for example the raw-arm decomposition_success_rate fields, K3), say
        so; the Coordinator writes it.
    - id: RC-3
      text: >-
        SCRATCH COMPUTATION, BOUNDED. Authorized: (a) one scratch script that
        re-derives or spot-checks one anchor equation of RUN-GFPN-61bba9 from
        the curve coefficients in its manifest (K4 (a)); (b) at most one
        re-invocation of /usr/bin/msolve on the archived
        experiments/EXP-GFPN-05ff43/runs/RUN-GFPN-bbed6f/anchor_t0.ms input
        with -g 1, under an explicit 12 GB address-space cap and a 600 s
        watchdog, output directed under your scratch/ (K4 (f)); (c) one spare.
        Record command, stdout, stderr and return code for each.
    - id: RC-4
      text: >-
        INFRASTRUCTURE IS NOT EVIDENCE, IN BOTH DIRECTIONS. The producer's
        exhaustion is not evidence of a large D; your own msolve crash is not
        a break (AGENTS.md core rule 5).
    - id: RC-5
      text: >-
        PROVENANCE. Rely only on sources you read; anything remembered is
        marked recalled and carries no verdict. Amazon Bedrock is prohibited.
    - id: RC-6
      text: >-
        MACHINE PROTECTION. Host about 15 GB, no swap; your msolve
        re-invocation runs alone.

