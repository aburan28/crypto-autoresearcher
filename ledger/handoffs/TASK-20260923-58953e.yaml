  objective: >-
    Attack, with the worked attacks of the review plan on
    TASK-20260923-fe27e4, the four classification-, rule-, separation- and
    control-integrity joints of EXP-GFPN-05ff43 assigned to you, and return a
    per-joint verdict of holds | breaks | inconclusive with the artifact that
    supports it. You verify evidence; you do not decide what it means for
    H-GFPN-9a29be or HEUR-GFPN-DFLAT (agents/validator.md).

  uncertainty_reduced: >-
    Whether the run set's absences are recorded as absences within an honestly
    stated envelope, whether the frozen rules were applied mechanically,
    whether constructed-solvable values stay out of the contract's metrics,
    and whether the n = 4 anchor control timed the right system and passed.

  joints_owned:
    - label: K1
      joint: >-
        K1. THE m = 5 ABSENCE IS CLASSIFIED AS AN ABSENCE: that every m = 5
        cell (RUN-GFPN-8f1b50 arm S5, RUN-GFPN-805701 and RUN-GFPN-61a67b
        arm torsion_S5, all at p' = 4111 on the EcGFp5-shaped curve) and
        every other cell that exhausted resources (including the raw-arm
        m = 4 cells RUN-GFPN-b1f5d2, RUN-GFPN-c7a3e9, RUN-GFPN-d8e114) is
        recorded not_measured with D null and certificate.kind none, that
        no artifact reads an exhaustion as evidence about D, and that the
        classification is honest about the resources and the arms actually
        attempted.
    - label: K2
      joint: >-
        K2. heur_dflat_pass not_applicable AND THE NULL BAND FOLLOW
        MECHANICALLY FROM THE FROZEN RULES: that applying the frozen
        success_criterion, measured_vs_modeled.modeled_note, stopping rules
        and falsification criteria F1-F4 literally to the archived run set
        yields exactly the recorded heur_dflat_pass (not_applicable for
        every arm and shape), the recorded null band with its reason, no
        fired falsification branch, and the recorded status of every
        blocking control.
    - label: K3
      joint: >-
        K3. THE SUPPLEMENTARY CONSTRUCTED-SOLVABLE CELLS ARE KEPT APART FROM
        THE CONTRACT'S CELLS EVERYWHERE THEY ARE REPORTED: that every value
        computed on a constructed_solvable target (success 1 by
        construction; D = 1 or 6; the supplementary flatness block and
        degree_ratios_measured of RUN-GFPN-ca7b88) is labelled as such and
        never enters decomposition_success_rate, heur_dflat_pass,
        D_variation_across_ladder or any band field, and that the
        supplementary D is recognised as a different quantity from the
        contract's D.
    - label: K4
      joint: >-
        K4. THE n = 4 ANCHOR: that RUN-GFPN-61bba9 (25-bit rung, median
        7.995 s against a published 17.01 s, ratio 0.470) timed the genuine
        Joux-Vitse system rather than an easier one, that the anchor run is
        the object the frozen control n4_published_timing_anchor names,
        whether that control passed under its literal band, and that
        RUN-GFPN-bbed6f (17-bit rung) is correctly recorded as measuring
        nothing (CORR-20260923-d4220b).
  joints_note: >-
    The joint statements above are verbatim from review_plan.joints of
    TASK-20260923-fe27e4. Their attack plans and breaking artifacts are in
    that card and bind you as a floor, not a ceiling. You do not own K5-K7 or
    the proves-too-much control; findings there go under "outside my joints".

