handoff:
  id: TASK-20260801-080
  from: coordinator
  to: coordinator
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-027
  experiment_id: EXP-LPF-001
  hypothesis_id: H-LPF-001
  run_id: RUN-LPF-001-measure
  archive_kind: snapshot
  objective: >-
    Commit the exact TASK-20260801-079 measurement package alone with this receipt,
    so the raw result is fixed in Git before any independent session reads it and
    before any branch is selected.
  uncertainty_reduced: >-
    Whether the measurement the campaign has owed for twenty-six batches is durable
    evidence rather than a working-tree artifact.
  inputs:
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-measure/
  - experiments/EXP-LPF-001/results/measure/
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-027/tasks/TASK-20260801-079/execution_report.yaml
  constraints:
  - >-
    RUN ALONE. Stage exactly the fourteen paths in
    declared_commit_sets.TASK-20260801-080_snapshot.
  - >-
    RUN tools/validate_ledger.py BEFORE STAGING and record the error count and any
    new line naming this run package. A NEW ERROR LINE ON THIS RUN IS A BLOCKING
    DEFECT AND GOES BACK TO THE EXECUTOR - it is the DEF-065-1 defect recurring.
  - >-
    DO NOT STAGE lpf001_driver.py, reading_rule.yaml, reading_rule_v2.yaml,
    specification.yaml, the RUN-LPF-001-calib or RUN-LPF-001-plantz packages, any
    tools/ file, ledger/goals/GOAL-ECDLP-001.yaml, ledger/hypotheses/H-LPF-001.yaml
    or any review file.
  - >-
    Record SPECIFICATION_SHA256, READING_RULE_V1_SHA256, READING_RULE_V2_SHA256 and
    DRIVER_SHA256 as named fields and REFUSE TO COMMIT if any differs from its
    bound value, or if Git reports any of them as modified.
  - >-
    STATE NO INTERPRETATION, SELECT NO BRANCH, STATE NO DISPOSITION AND MAKE NO
    APPROVAL DETERMINATION. This receipt records that the artifacts exist and what
    they hash to, and nothing else.
  - >-
    Commit message must contain TASK-20260801-080, TASK-20260801-079, EXP-LPF-001,
    RUN-LPF-001-measure, RR-LPF-2, GOAL-ECDLP-001, BATCH-027.
  - Do not push from this task.
  deliverables:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-027/archives/TASK-20260801-080/snapshot_commit_receipt.json
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-027/archives/TASK-20260801-080/snapshot_commit_receipt.json
  archived_by: TASK-20260801-080
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 900
    memory_gb: 1
    maximum_runs: 1
  completion_gate:
  - >-
    Post-commit verifier accepts the exact fourteen-path diff and hashes; the
    validator run before staging with its output recorded and no new error line
    naming this run package; the four named sha256 fields recorded and matching
    their bound values; no interpretation, no branch selection and no authorization
    stated.
