  open_items:
  - experiment_id: EXP-CZLIFT-17b7eb
    item: Code degenerate-rate definition drops vQ < vP rows that the hypothesis includes; criterion met under both.
      Needs an erratum naming the governing definition.
  - experiment_id: EXP-CZLIFT-a255fc
    item: 11a1 control and invalidation rule 3 fire as written at H = 10 (3 points, correct). Needs a ruling on
      their scope; the coverage instrument cannot detect spread excess, and the observed median 1.033 lies above
      a seeded same-shape null band (1.0010 to 1.0023).
  - experiment_id: EXP-CZLIFT-7c8d73
    item: harness/czlift_formal.py formal_series computes w only through z^k, so log_F = exp_F = z on every curve
      and the A z^5 term is lost on 18 of 29 curves; control C1 fails as written on two genuinely split pert_p lifts.
      Needs an amendment and a superseding run.
  - experiment_id: EXP-CZLIFT-8c50ea
    item: harness/czlift_cubic.py drops K-points through its primitivity skip and caps d through its height definition;
      replication is not independent of the main box. Criterion still met on the specification box (gain 1.38 /
      1.37). Needs an amendment and a superseding run.
  - experiment_id: EXP-CZLIFT-bdae69
    item: The naive-section excess depends on the unstated smallest-primitive-root generator; a random root gives
      expected z about 0.2.
  - experiment_id: EXP-CZLIFT-ed8113
    item: Sampler never draws y = 0; a literal random-point reading gives a dependence rate near 0.006.
  procedure_deviations:
  - id: PD-1
    text: 'Validation-only round as requested by the user: no red team ran, so interpretation and scope joints stay
      open for review-evidence.'
  - id: PD-2
    text: The plans gave the blind re-derivation (J3) and the custody and recomputation joints (J1, J2) to one task
      with no blind-phase split. Every validator sealed its J3 files by sha256 before opening a blind_from path
      and read those paths only afterwards, as the card directed. tools/check_review_independence.py cannot see
      seal ordering and reports these post-seal reads as blind_from violations on all ten tasks. Coordinator plan
      defect; the seals in each blind/ folder are the only ordering evidence.
  - id: PD-3
    text: The proves-too-much control was named PTM-1 under proves_too_much, not as a joint, so the checker reports
      each report's PTM-1 verdict as a claim on an unassigned joint (seven reports). Coordinator plan defect; no
      report was edited.
  - id: PD-4
    text: Two reports (ae0a13, f5e06c) also fail the checker's sources_read format test, and several record incidental
      exposure to sibling report folder names or commit subjects through git output; each discloses it in its attestation.
      No validator reports reading a sibling report or a producer decision.
  - id: PD-5
    text: 'Plan statement defects found by validators: ae0a13 J3 asked for anomalous primes, which the specification
      excludes (both readings sealed); 7c8d73 J3 and 8c50ea named only A = 0 or small-curve quantities that cannot
      reach the defects later found; a255fc PTM-1 asked for a coverage excess that no distinct-residue set can produce
      below one third coverage.'
  - id: PD-6
    text: Finished reports were committed one by one as they returned, before this archive, so they were durable
      in an ephemeral container; this receipt binds the final bytes of all ten.
  constraints:
  - id: LA-1
    text: Stage exactly the validation reports, this handoff and its receipt.
  - id: LA-2
    text: A validation verdict is admissibility, not a hypothesis transition.
