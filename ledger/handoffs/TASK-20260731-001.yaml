handoff:
  id: TASK-20260731-001
  from: coordinator
  to: idea-generator
  objective: >-
    Open GOAL-CRYPTO-001 BATCH-013 discovery/readiness literature screen under
    DEC-20260730-004 one-batch budget amendment (maximum_batches=13): search for
    newly retrieved primary sources or externally supplied formal mechanisms on
    ordinary large-prime-order E(F_p), with quoted source semantics and a
    field-by-field fingerprint showing a falsifiable gain outside prior CRYPTO
    routes; require every readiness cost and certificate field before any curve
    work. Resume from BATCH-012 FINAL_NO_CANDIDATE (EV-CRYPTO-012).
  uncertainty_reduced: >-
    Whether any newly retrieved or externally supplied ordinary-prime-field
    ECDLP mechanism passes discovery and experiment-readiness gates after
    BATCH-012 FINAL_NO_CANDIDATE.
  inputs:
    - EV-CRYPTO-012
    - DEC-20260730-004
    - DEC-20260724-014
    - BATCH-012 final_candidate_screen.md and coverage_repair.yaml
    - BATCH-012 red_team_report.yaml
  constraints:
    - Academic defensive literature research only; zero curve compute.
    - Do not fabricate candidates, certificates, or matched-rho advantage.
    - Do not claim crypto-tier breakthrough from literature alone.
    - Quote source semantics; field-by-field fingerprint required for any candidate.
    - Separate discovery (partial typed mechanism) from readiness (complete
      cost/certificate/oracle/descent interfaces) as in BATCH-012.
    - Archive per-query ordered result receipts with timestamps/URLs/counts
      where tool output permits; state tool limits exactly.
    - Resume from BATCH-012 FINAL_NO_CANDIDATE; do not reopen BATCH-001..012
      findings as new positive candidates without new primary-source evidence.
  deliverables:
    - discovery_readiness_screen.yaml
    - literature_screen_notes.md
  artifact_paths:
    - coordination/goals/GOAL-CRYPTO-001/batches/BATCH-013/tasks/TASK-20260731-001/discovery_readiness_screen.yaml
    - coordination/goals/GOAL-CRYPTO-001/batches/BATCH-013/tasks/TASK-20260731-001/literature_screen_notes.md
  archived_by: TASK-20260731-002
  inference:
    policy: research-deep
    requested_policy: research-deep
    resolved_model: cursor-grok-4.5-high-fast
    fallback_allowed: true
    fallback_used: true
    independent_session_required: false
    note: >-
      research-deep unresolved on this Cursor harness; fallback_used true
      recorded rather than silently claiming the requested policy.
  budget:
    wall_clock_seconds: 2400
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
    - >-
      Exactly one disposition: ADMIT_CANDIDATE or FINAL_NO_CANDIDATE, with
      separate discovery and readiness verdicts.
    - Every claimed retrieval has an archived receipt or explicit tool-limit note.
    - No curve execution, key recovery, or breakthrough claim.
  return_format: Write only the declared artifacts under write_scope and return a receipt.
