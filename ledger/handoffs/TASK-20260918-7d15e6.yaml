    blind_rederivation:
      required: true
      quantity: >-
        The number of n odd in 5..49 for which the multiplicative order of 2
        modulo n equals ceil(n/2), and separately the number for which it equals
        ceil(n/3). Stated as the quantity and its definition only; no method is
        prescribed and none should be inherited.
      parameters: >-
        n ranges over the odd integers from 5 to 49 inclusive. m = 2 gives the
        first count via ceil(n/2); m = 3 gives the second via ceil(n/3).
        ord_n(2) is the least positive e with 2^e congruent to 1 modulo n, which
        is well defined for every odd n in range. No other parameter is
        involved, and no seed, sample or trial count exists -- the quantity is
        exact.
      blind_from:
        - ledger/evidence/EV-ICPERF-a8080e.yaml
        - knowledge/findings/KN-FIND-9cba50.md
        - any artifact of github.com/aburan28/crypto
        - the `coordinator_prior` field of this review plan
