          program's, its output was never admissible evidence under this goal.
          (c) No `.rs` file exists in this repository and the instrument name
          matches only records authored by this work stream. Where I think this
          breaks: they were never the same object.
        breaking_artifact: >-
          A named path in this repository, or in its git history, to an
          instrument that GOAL-DREG-001 actually ran and that samples
          Frobenius-invariant subspaces of dimension ord_n(2) -- together with
          the specific cells it produced. Absent that, the attribution does not
          stand. Conversely, an explicit statement that GOAL-DREG-001's
          instrument is X at path P, sampling family F, breaks the attribution.
      - id: J2
        joint: >-
          THE DEFINITIONAL COUNT. That ord_n(2) = ceil(n/2) holds for 0 of 23
          cells with n odd in 5..49, and for exactly 2 cells at m = 3. This is
          the only quantitative support the mismatch claim has, and the record
          presents it as definitional rather than measured.
        assigned_to: TASK-20260918-7d15e6
        attack_plan: >-
          Compute it yourself from the definitions. ord_n(2) is the
          multiplicative order of 2 mod n; ceil(n/m) is the stated dimension.
          Enumerate n odd in 5..49, tabulate both, count coincidences at m = 2
          and m = 3, and emit the table as ord-table.json. Watch two traps.
          FIRST, n composite -- ord_n(2) requires gcd(n,2) = 1, which every odd
          n satisfies, but the record says nothing about whether n = 9, 15, 21,
          25, 27, 33, 35, 39, 45, 49 were handled like the primes; check whether
          any convention there changes the count. SECOND, cardinality -- verify
          that "23 cells" is right for n odd in 5..49 inclusive. A wrong
