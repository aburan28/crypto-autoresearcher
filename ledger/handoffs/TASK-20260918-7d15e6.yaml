        BEFORE reading any of the blind_from sources, then compare. THIS BRIEF
        DOES NOT STATE THE EXPECTED VALUES, deliberately: a previous round in
        this program (DEC-20260913-74e208, PD-2) put the answer inside the blind
        brief itself and so obtained blindness only to the implementation.
      why_not_mere_replication: >-
        Recomputing from a producer's own implementation reproduces a
        wrong-but-self-consistent implementation faithfully, which is the
        failure validation cannot see. Here there is no implementation to reuse
        and the quantity is elementary, which makes this the cheapest genuine
        blind re-derivation available anywhere in the portfolio.

