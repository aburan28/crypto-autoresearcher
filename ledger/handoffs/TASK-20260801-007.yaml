handoff:
  id: TASK-20260801-007
  from: coordinator
  to: validator
  objective: >-
    Validate the integrity of the RUN-DS-001-ctrl-matched-null package on the
    TASK-20260801-006 snapshot only. Return ADMISSIBLE or INADMISSIBLE with
    concrete defects.
  uncertainty_reduced: >-
    Whether the matched-null package is admissible as empirical_only toy-tier
    evidence, and in particular whether any pre-registered guard fired.
  inputs:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-021/archives/TASK-20260801-006/snapshot_commit_receipt.json
  - experiments/EXP-DS-001/controls/CTRL-RT047-MATCHED-NULL.yaml
  - experiments/EXP-DS-001/specification.v2.yaml
  - experiments/EXP-DS-001/runs/RUN-DS-001-ctrl-unplanted/raw-result.json
  constraints:
  - INDEPENDENT SESSION. Read only the TASK-20260801-006 snapshot commit.
  - >-
    Check ALGORITHM INVARIANCE by direct diff - naive_search and split_search must
    be mathematically unchanged from ds001_ctrl_unplanted.py and ds001_driver.py,
    and any delta must be declared.
  - >-
    Regenerate the 128-element signed factor base and the 200 targets from seed
    101 and confirm factor_base_sha256 and target_stream_sha256.
  - >-
    Confirm the group order is exactly 753848 and that the factor base is
    negation-closed with 128 distinct elements.
  - >-
    Independently re-verify a sample of relation certificates with your own
    modular arithmetic and report verified/total.
  - >-
    Reproduce R_matched_null, R_real_remeasure and R_null_legacy under BOTH
    proxies from the raw per-arm walls, charged units and n_usable.
  - >-
    Report whether ANY pre-registered guard in the disposition map's D-5 branch
    fired - INADMISSIBLE verdict, certificate verification below 100 percent,
    per_arm_capped_attempt_count greater than zero, claw-table amortization
    mismatch between the matched-null split arm and the real split arm, an arm
    short of 200 relations, an undeclared code change, or any timeout, crash,
    resource exhaustion or budget cancellation.
  - >-
    Confirm PER_TARGET_CAP_SECONDS = 5.0 appears in manifest, raw-result and
    summary with per-arm capped-attempt counts.
  - >-
    Confirm plant_applied false, plant_divisor 1.0 on every arm, and
    synthetic_known_answer_used false.
  - >-
    Do NOT interpret mechanism support, structure-dependence or S1_met, and do NOT
    classify the result against the disposition map.
  - Timeouts and crashes are infrastructure, never mathematical negatives.
  - MAKE NO COMMIT.
  - Do not alter H-DS-001, H-IC-001 or H-STR-002.
  deliverables:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-021/reviews/TASK-20260801-007/validation_report.yaml
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-021/reviews/TASK-20260801-007/validation_report.yaml
  archived_by: TASK-20260801-009
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 3600
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
  - >-
    ADMISSIBLE or INADMISSIBLE recorded with concrete defects if any, plus an
    explicit statement on every D-5 guard.
