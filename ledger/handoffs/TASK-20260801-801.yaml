handoff:
  id: TASK-20260801-801
  from: coordinator
  to: executor
  objective: >-
    THREE deliverable groups, in ONE task because they repair one object.
    (a) Compute the EXACT DIAMETER d of the directed 1020-node (lambda,k) graph
    of verify_derivation.py claim C11 — nodes (lambda,k) for lambda in GF(2^8)*
    and k in {0,1,2,3}, edges (lambda,k) -> (lambda*M[j][k], j) for every j,
    with M the AES MixColumns circulant of first row (02,03,01,01) — by
    all-pairs BFS, and state HONESTLY whether OD-1 thereby extends PROP-701-I
    from round-independent per-word projections to all objects surviving more
    than roughly 2d rounds, or whether the residual is real.
    (b) REDESIGN GATE-701-C so that it DISCRIMINATES, by building its second
    null from the negation of a NECESSARY ingredient of Step 3 — a matrix whose
    entries generate a PROPER subgroup of the multiplicative group, so the
    (lambda,k) graph is NOT strongly connected — rather than from the negation
    of Step 2's SUFFICIENT every-entry-nonzero hypothesis, which is exactly why
    null_2 failed; correct null_1's predicted stall dimension from 4 to 1; and
    RUN all three matrices. The task must RUN the redesigned gate, not merely
    specify it.
    (c) NAME the two scope holes D-705-5 identified.
  uncertainty_reduced: >-
    (a) Whether the scalar-index orbit closes in FEW interfaces. If d is small,
    the largest hole in this campaign's only closure — OD-1, layer-dependent
    projection families — mostly closes with a few lines of computation; if d is
    large, the residual is real. (b) Whether a genuinely DISCRIMINATING
    falsification gate for PROP-701-I exists at all: whether a second null built
    by negating the NECESSARY Step-3 ingredient reads differently from the
    AES-shaped target, or whether the conclusion is robust even to that
    negation — which would mean the proposition's control apparatus cannot be
    repaired in this form. Either answer is a complete outcome.
  inputs:
    - >-
      DEC-20260731-025 dispositions PROP_701_I and super_box_lane, BINDING: no
      reject_scoped of the round-independent single-word deterministic class may
      be considered until a redesigned gate returns a discriminating result;
      OD-1 is ranked first as the only exponent-relevant item.
    - >-
      EV-AES-002 observations A-10 (the three proof steps and where
      round-independence is consumed exactly once), A-11 (D-705-1 with the exact
      measured readings of the void gate), A-12 (D-705-5's two unnamed scope
      holes), and unresolved_confounds entries 2 and 3.
    - >-
      TASK-20260731-705 validation_report.yaml REPRO-705-3 and
      derivation_and_ideation_review.md section 7.4: AES-shaped M4 65535/65535
      at dim 16; null_1 0/65535 stalling at dim 1 rather than the predicted 4;
      null_2 circulant (02,00,01,01) 65535/65535 at dim 16, firing the gate's
      own pre-declared VOID condition.
    - >-
      verify_derivation.py claim C11 as committed at snapshot ebac9ba8, which
      defines the (lambda,k) graph exactly and establishes strong connectivity
      (1020 forward- and 1020 reverse-reachable), independently confirmed by the
      TASK-20260731-705 validator.
    - >-
      candidate_report.yaml OD-1, PROP-701-I and the GATE-701-C specification,
      read-only at snapshot ebac9ba8.
    - >-
      KN-FIND-028: the entries of M are all nonzero with values {01,02,03} and
      generate a subgroup of order 255; ord(0x02)=51, ord(0x03)=255.
    - "Local tooling: python3 3.11.15, 4 cores, 15 GB RAM, no sage, no GPU, no network."
  constraints:
    - >-
      PRE-REGISTER BEFORE YOU MEASURE. Write the redesigned gate's predicted
      readings for the AES-shaped matrix and BOTH nulls, and its VOID condition,
      into the report BEFORE recording any measured output, and mark that
      section as written first. A prediction adjusted after seeing the reading
      is a protocol violation, not a refinement.
    - >-
      THE SECOND NULL MUST NEGATE EXACTLY ONE THING, AND IT MUST BE THE
      NECESSARY INGREDIENT. Choose a 4x4 matrix over the working field whose
      entries are ALL NONZERO (so Step 2's sufficient hypothesis stays TRUE and
      is not what is being tested), which is INVERTIBLE, and whose entries lie
      in a PROPER subgroup of the multiplicative group, so the induced
      (lambda,k) graph is NOT strongly connected. VERIFY that non-strong-
      connectivity computationally BEFORE running the gate and record the
      component structure: that verification is construction validation of the
      null, not outcome selection, and it is the whole content of the redesign.
    - >-
      ONE REDESIGNED NULL, RUN ONCE. Select the null_2 replacement on the
      structural criterion above and run it. If no invertible matrix with all
      entries in a proper subgroup exists in circulant form, widen to general
      4x4 matrices over that subgroup, record the search, and if none exists at
      all report THAT as the finding. DO NOT iterate over candidate nulls until
      one produces a discriminating reading. If the redesigned gate STILL does
      not discriminate, that is a COMPLETE AND VALUABLE OUTCOME: report it
      plainly, state that the gate is void again and why, and stop.
    - >-
      RUN ALL THREE MATRICES — the AES-shaped target, null_1 (identity
      interface, predicted stall dimension CORRECTED from 4 to 1 and stated as a
      correction of the BATCH-002 report), and the redesigned null_2 — and then
      state EXPLICITLY, as a yes/no verdict rather than a narrative, whether the
      gate DISCRIMINATES: target and BOTH nulls giving distinguishable readings.
    - >-
      DIAMETER, EXACTLY. BFS from every one of the 1020 nodes on the forward
      graph; report the full eccentricity distribution, diameter, radius, at
      least one realizing pair at distance d, and the same for the reverse
      graph; re-confirm strong connectivity independently rather than assuming
      C11. This is seconds of compute: an estimated diameter would be a
      fabrication under AGENTS.md rule 9.
    - >-
      THE OD-1 EXTENSION CLAIM MUST BE ARGUED, NOT ASSERTED. State it as a
      numbered proposition with explicit hypotheses, give the derivation, and
      identify precisely where the layer-dependent case departs from PROP-701-I
      Step 3 — the point at which round-independence was consumed exactly once.
      If the diameter does NOT license the extension, say so and name the
      residual precisely. Per D-705-4, do not repeat the BATCH-002 phrase
      describing the argument as iterating "an unbounded number of times". A
      small diameter is a fact about a graph; the extension is a mathematical
      claim about projections and needs its own argument.
    - >-
      NO CLOSURE IS PROPOSED HERE AND NONE MAY BE. Do not propose a
      reject_scoped, do not declare the super-box lane or OD-1 closed, and do
      not assign evidence strength. Those are the Coordinator's transition in
      TASK-20260801-805, conditioned on the independent review in
      TASK-20260801-804.
    - >-
      NAME THE TWO D-705-5 SCOPE HOLES: (i) word-position-dependent families
      pi_0..pi_3 within a single layer, which is neither OD-1 nor OD-2 and which
      breaks the index bookkeeping of Steps 1-2; (ii) restriction of the "for
      EVERY state s" quantifier to a structured subset of states. State for each
      whether this task's work touches it.
    - >-
      SUPERSEDE, NEVER OVERWRITE. Every BATCH-001 and BATCH-002 artifact is
      committed and immutable (AGENTS.md core rule 4). Write a NEW gate script
      in this task's own directory; do not modify or re-run into
      verify_derivation.py, candidate_report.yaml or any other committed file.
      Name in the report which BATCH-002 specification each new file supersedes
      and that the BATCH-002 record stands as written.
    - >-
      SCOPE AND CLAIM TIER. Derivation and toy-scale computation about the
      algebra of AES components and a GF(2^4) analogue. NOT a cryptanalytic
      result, NOT a distinguisher, NOT a barrier statement about AES security;
      asserts nothing about AES at any round count or about deployed AES. State
      that in the report.
    - >-
      Every literature statement is UNVERIFIED-FROM-MEMORY (eprint.iacr.org,
      csrc.nist.gov, arxiv.org unreachable) and must be marked inline. Two
      agreeing recollections are not a citation; novelty is unresolvable here.
    - >-
      Seed all randomness deterministically and record every seed. Record exact
      commands, exit statuses, resolved tool versions, git commit and dirty-tree
      state, timestamps, and every check that did NOT run with its reason. Do
      not fabricate a command, output, count, dimension, distance or verdict
      (AGENTS.md rule 9).
    - >-
      A timeout, crash, or out-of-budget condition is INFRASTRUCTURE SIGNAL
      reported as such, never a negative mathematical result (AGENTS.md rule 5).
    - >-
      Create no ledger record, propose no hypothesis status, promote nothing to
      knowledge, change no official state, and write only under this task's own
      directory.
  deliverables:
    - od1_gate701c_v2.py
    - od1_gate701c_results.json
    - od1_and_gate_redesign_report.md
  artifact_paths:
    - coordination/goals/GOAL-AES-001/batches/BATCH-003/tasks/TASK-20260801-801/od1_gate701c_v2.py
    - coordination/goals/GOAL-AES-001/batches/BATCH-003/tasks/TASK-20260801-801/od1_gate701c_results.json
    - coordination/goals/GOAL-AES-001/batches/BATCH-003/tasks/TASK-20260801-801/od1_and_gate_redesign_report.md
  archived_by: TASK-20260801-803
  inference:
    policy: executor-implementation
    requested_policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
    standing_basis: >-
      inference-amendment commit 0137a051eb5828789eb267fa83c8278086578d4c.
      Cross-model independence is unavailable campaign-wide; nothing produced
      here may be treated as a closure attestation.
    provenance_basis: >-
      protocol-amendment-GOAL-AES-001-002, prospective from BATCH-003: each
      declared source-code artifact carries a comment-block inference stanza AND
      the covering manifest carries an artifact_provenance list binding each
      declared source path to its SHA-256.
  budget:
    wall_clock_seconds: 1500
    memory_gb: 4
    maximum_runs: 6
  budget_basis: >-
    Calibrated against MEASURED consumption, not worst-case imagination. The
    three BATCH-001/002 executor tasks actually consumed 890, 631 and 1783 s.
    This task is set BELOW the 1783 s maximum because its compute is seconds — a
    BFS on 1020 nodes and a 65535-delta closure in GF(2^4) — and its cost is
    writing, not running.
  completion_gate:
    - >-
      INFERENCE BLOCK REQUIRED, AND PROVENANCE UNDER
      protocol-amendment-GOAL-AES-001-002. Every declared artifact carries a
      filled `inference` block recording policy, requested_policy
      (executor-implementation), the ACTUAL resolved model identifier,
      fallback_used, model_verified (false if `python3 -m orchestration.adapter
      doctor --probe` was not run), and the standing basis 0137a051. An
      unobserved resolved model is recorded as `unrecorded`, never guessed.
      Additionally, every declared SOURCE-CODE artifact carries a comment-block
      inference stanza in its own text, and the covering manifest
      (od1_gate701c_results.json) carries an `artifact_provenance` list binding
      each declared source path to its SHA-256 and stating that the manifest's
      inference block covers it. Missing or partial fails this task.
    - >-
      The exact diameter d is reported from an all-pairs BFS with the
      eccentricity distribution, radius, a realizing pair, the reverse-graph
      figures, and an independent re-confirmation of strong connectivity. No
      estimated or asserted diameter appears anywhere.
    - >-
      The OD-1 extension is stated as a numbered proposition with explicit
      hypotheses and a derivation, OR explicitly declined with the residual
      named; either way the report states plainly whether OD-1 extends
      PROP-701-I to objects surviving more than roughly 2d rounds and where the
      layer-dependent case departs from Step 3.
    - >-
      The redesigned second null is documented with the proper subgroup and its
      order, proof that every entry is nonzero, proof of invertibility, and a
      COMPUTED demonstration that its (lambda,k) graph is NOT strongly
      connected with the component structure recorded — all verified BEFORE the
      gate was run.
    - >-
      Predicted readings and the VOID condition for all three matrices appear in
      a section marked pre-registered before measurement; measured readings
      appear beside them; the report returns an EXPLICIT yes/no verdict on
      whether the redesigned gate DISCRIMINATES.
    - >-
      Exactly one redesigned null_2 was run. If it does not discriminate, that
      outcome is reported plainly as the batch result, with no further candidate
      nulls attempted, and the report says so in those terms.
    - >-
      null_1's predicted stall dimension is corrected from 4 to 1, stated as a
      correction of the BATCH-002 candidate_report.yaml text, with the BATCH-002
      record left unedited.
    - >-
      Both D-705-5 scope holes are named, each with a statement of whether this
      task's work touches it.
    - >-
      The report states that nothing here is a cryptanalytic claim about AES at
      any round count and is not a barrier statement about AES security;
      proposes no closure, no reject_scoped and no evidence strength; and names
      which BATCH-002 specification each new file supersedes.
    - >-
      od1_gate701c_results.json is machine-readable and records exact commands,
      exit statuses, tool versions, git commit and dirty-tree state, all seeds,
      timestamps, and every check that did not run with its reason.
    - >-
      No BATCH-001 or BATCH-002 committed artifact is modified; all writes are
      under this task's own directory.
  return_format: >-
    The three artifacts, plus a plain statement of: the diameter d; whether the
    OD-1 extension follows or was declined; and whether the redesigned gate
    DISCRIMINATES, yes or no.
