          with the E/4E class census as the cheap test. Keep tripwire T5: the
          closure wording is reviewed at review-breakthrough when the revised
          record is designed; no sentence of this record states a closure as
          an outcome.
      - id: R1-e
        text: >-
          The halving criterion: Fong-Hankerson-Lopez-Menezes, CACR CORR
          2003-18, Section 4 (Lemma 4.1(iv), Tr(x) = Tr(a) on the
          prime-order subgroup), which the lane-B red team of BATCH-361e02
          retrieved (pointer in DEC-20260929-8c3cb2 HOLD-X11). Read it at
          source with provenance retrieved, verified_by this task, or
          re-derive the criterion from the group law in the record. Do not
          read that red team's report; cite the source itself.
      - id: R1-f
        text: >-
          Name IDEA-20260926-ae8f0a (HOLD-X11) as the constructive successor
          input that waits on this revision, without designing it.
