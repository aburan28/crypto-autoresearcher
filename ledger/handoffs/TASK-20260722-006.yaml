handoff:
  id: TASK-20260722-006
  from: coordinator
  to: idea-generator
  objective: Construct one exact, versioned schedule-to-receipt-to-rank conservation certificate contract, or return a decisive scoped no-go derivation at the first unsatisfied obligation.
  uncertainty_reduced: Whether frontier-B can be made mathematically and operationally precise enough for a later toy-only validation design.
  inputs:
    - ledger/evidence/EV-ECDLP-002.yaml
    - ledger/decisions/DEC-20260722-002.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-001/tasks/TASK-20260721-008/
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-001/reviews/TASK-20260722-002/
    - current claims, lifecycle, run-record, and dispatch contracts
  constraints:
    - Review-only theory and schema work; do not implement or execute any experiment.
    - Use public documentation and toy/public fixture descriptions only.
    - Seal a hash-bound pre-execution attempt schedule, seeds, retry graph, terminal vocabulary, field, canonical row format, and column schema.
    - Define an exact schedule-to-terminal-receipt bijection and independent relation, row, and incremental-rank verification.
    - Preserve all measured resources as a vector with explicit ownership and no illicit scalar sum.
    - Replace ceil(r/p_L) with a declared-alpha binomial or negative-binomial tail gate and state every model assumption.
    - Include planted omission, duplicate-ID, retry-cycle, field/schema mismatch, shared-work, certificate/row mismatch, and wrong-field controls.
    - Avoid the P1553 R4 operation and make no attack improvement, lower-bound, or cryptographic claim.
    - If construction fails, identify the first exact obligation and provide a reader-checkable scoped no-go derivation.
    - Preserve every pre-existing dirty ideas path and write only within the assigned scope.
  deliverables:
    - certificate_contract.yaml
    - derivation_and_no_go.md
  artifact_paths:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-002/tasks/TASK-20260722-006/certificate_contract.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-002/tasks/TASK-20260722-006/derivation_and_no_go.md
  archived_by: TASK-20260722-007
  inference:
    policy: research-sol-max
    fallback_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 1800
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
    - Both exact review-only artifacts exist and bind all relied-upon inputs.
    - Every schedule, schema, probability, rank, resource, control, and verification obligation is supplied or the first missing obligation has a scoped no-go derivation.
    - Exactly one recommended next action is recorded and no implementation or experiment is authorized.
  return_format: YAML certificate contract plus Markdown derivation or scoped no-go analysis.
