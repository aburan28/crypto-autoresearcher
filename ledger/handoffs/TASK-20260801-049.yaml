handoff:
  id: TASK-20260801-049
  from: coordinator
  to: executor
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-025
  objective: >-
    Implement the frozen EXP-LPF-001 contract COMPLETE - including the measurement entry point,
    which you do NOT execute - and run RUN-LPF-001-calib, which touches NO real object. Produce
    the 200 uniform-integer replicate sample sets per cell that supply every threshold, the
    apparatus-identity comparison, the derivable-smooth product control, and BOTH perturbation
    ladders at EVERY rung with the PERTURB-MOVE-1 movement table.
  uncertainty_reduced: >-
    What the null distribution of every statistic actually is at this n and this X, how far a
    KNOWN-uniform sample departs from the asymptotic Dickman prediction at each rung, and whether
    each perturbation family measurably moves each certifying statistic at each rung.
  inputs:
  - experiments/EXP-LPF-001/specification.yaml at the TASK-20260801-048 commit
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/archives/TASK-20260801-048/snapshot_commit_receipt.json
  - 'harness (curve generation and factor-base construction)'
  - 'experiments/EXP-EQD-001/results (READ-ONLY, for the factor_base_sha256 assertion only)'
  constraints:
  - 'DO NOT RUN WITHOUT CALIBRATION_AUTHORIZATION AUTHORIZED in the TASK-20260801-048 receipt. Check it and quote it in the execution report.'
  - >-
    AUTHOR THE DRIVER COMPLETE, INCLUDING run_measurement, AND DO NOT EXECUTE run_measurement.
    The driver is hash-bound at TASK-20260801-050 and the measurement stage must run this
    identical file.
  - >-
    THE CALIBRATION MUST BE STRUCTURALLY BLIND TO THE REAL OBJECT. run_calibration must contain
    no reference to the deterministic factor base, to the Semaev specialization or to the
    measurement entry point, and must write real_object_touched = false. The reviewer will check
    this at the level of OBJECTS and not merely of labels.
  - >-
    RUN THE PILOT BUDGET GATE FIRST - 10000 factorizations per cell, measure the rate,
    extrapolate, and ABORT BEFORE ANY BULK WORK if the projection exceeds the wall-clock budget.
    AN ABORT IS A BUDGET EVENT AND IS REPORTED AS ONE. DO NOT reduce R_CAL, the ladders, the
    cells or n to fit; a reduced-scope run reported as the planned one is the single most
    damaging thing this batch could produce, and any reduction requires a Coordinator
    protocol_amendment.
  - >-
    RE-VERIFY EVERY FACTORIZATION AT 100 PERCENT OF SAMPLES - each returned factor tested for
    primality and the product asserted equal to N - and write the counts to results/calib. STOP
    IMMEDIATELY on any verification failure; a wrong factorization silently poisons every
    statistic.
  - >-
    COMPUTE rho BY NUMERICAL SOLUTION OF THE DICKMAN DELAY EQUATION and record your own values
    beside the frozen table in dickman_reference_reproduction.json. Do not read rho from the
    frozen table.
  - >-
    WRITE THE PERTURB-MOVE-1 MOVEMENT TABLE AS MACHINE-READABLE ROWS - one row per family, rung,
    cell and statistic, carrying the measured shift in units of the measured null standard
    deviation. THIS IS THE NAMED PRIORITY DELIVERABLE OF THIS TASK. At BATCH-024 the analogous
    table was never produced and two plant families turned out incapable of moving the statistics
    they certified against.
  - >-
    BUILD BOTH PLANTS BY REPLACEMENT WITH INTEGERS OF KNOWN FACTORIZATION so no plant rung costs
    additional factorization, and record for each family which part of the Z-distribution its
    replacement moves mass into.
  - 'COMPUTE NO REAL-OBJECT STATISTIC OF ANY KIND. No OBJ-REAL sample, no deterministic factor-base x-list, no Semaev specialization in the calibration arm.'
  - 'ADD, DROP, MOVE OR REORDER NOTHING. No statistic, rung, cut, band, ladder or branch beyond what the frozen contract fixes.'
  - 'Archive a PRE-RUN `git status --porcelain` capture as git_status_prerun.txt.'
  - >-
    manifest.yaml with command.txt, environment.json, stdout.log, stderr.log and raw-result.json
    beside it - note .log and not .txt. Record the exact factorization module and version in
    environment.json.
  - 'RECORD OBSERVATIONS ONLY. State no interpretation, recommend no disposition, and set no status.'
  - 'MAKE NO COMMIT; TASK-20260801-050 archives.'
  - 'Record inference honestly - requested policy executor-implementation, resolved model, fallback_used, model_verified.'
  deliverables:
  - experiments/EXP-LPF-001/implementation/lpf001_driver.py
  - experiments/EXP-LPF-001/implementation/implementation.md
  - the RUN-LPF-001-calib run package with its seven declared files
  - experiments/EXP-LPF-001/results/calib/null_replicate_statistics.json
  - experiments/EXP-LPF-001/results/calib/perturbation_movement_report.json
  - experiments/EXP-LPF-001/results/calib/dickman_reference_reproduction.json
  - experiments/EXP-LPF-001/results/calib/apparatus_identity_report.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/tasks/TASK-20260801-049/execution_report.yaml
  artifact_paths:
  - experiments/EXP-LPF-001/implementation/lpf001_driver.py
  - experiments/EXP-LPF-001/implementation/implementation.md
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-calib/manifest.yaml
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-calib/raw-result.json
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-calib/command.txt
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-calib/environment.json
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-calib/stdout.log
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-calib/stderr.log
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-calib/git_status_prerun.txt
  - experiments/EXP-LPF-001/results/calib/null_replicate_statistics.json
  - experiments/EXP-LPF-001/results/calib/perturbation_movement_report.json
  - experiments/EXP-LPF-001/results/calib/dickman_reference_reproduction.json
  - experiments/EXP-LPF-001/results/calib/apparatus_identity_report.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/tasks/TASK-20260801-049/execution_report.yaml
  archived_by: TASK-20260801-050
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 14400
    memory_gb: 8
    maximum_runs: 1
  completion_gate:
  - 'Driver authored complete including an unexecuted run_measurement; pilot gate run and its projection recorded.'
  - '200 uniform replicates per cell completed with every statistic recorded; apparatus-identity, product-control and BOTH perturbation ladders completed at EVERY rung.'
  - 'The PERTURB-MOVE-1 movement table written with one row per family, rung, cell and statistic.'
  - 'The driver''s own Dickman solution recorded beside the frozen table; factorization verification at 1.0 with its count archived.'
  - 'real_object_touched false; the seven-file run package present with manifest.yaml and .log extensions.'
  - 'No interpretation stated; no commit made.'
