  review_plan: null
  review_plan_note: >-
    Not a claim-changing review round: it can move no hypothesis status, close
    no lane and support no headline claim; its only consumer is a protocol
    decision. Its design is written first, below, with one owner per joint,
    a worked attack per joint, a known-answer control and declared blindness;
    the Coordinator's prior is recorded in DEC-20260924-1d7614
    (review_design.prior), to which this reviewer is blind.
  review_design:
    owner_of_every_joint: TASK-20260924-be2daf (single reviewer)
    joints:
      BJ-0_known_answer_control:
        reading: failclosed RFR-0 (c), and CRI-4 (b)-(f)
        claim_under_attack: The reviewer's own method is sensitive enough to find the fail-open and planned-basis cases the previous rounds found, including the lost-record route CX-1, on rule text and on real package listings.
        worked_attack: >-
          Apply the method used for BJ-1..BJ-3, unchanged, to the objects CRI-4
          names, in the order (a)-(f). Report what the method actually did on
          each object, at record level and package level.
        failure_signature: A method that does not flag these objects cannot support "holds" on BJ-1 or BJ-2.
      BJ-1_counts_no_fail_open:
        reading: failclosed RFR-1 (definitions (i)-(v); (iv) read literally), applied to RI-1 and RI-2 and their interaction with RH-1, RG-1, RF-0..RF-3, RL-1, RL-2, RL-3 and RB-1
        claim_under_attack: >-
          With RI-1, no file written by a launch whose record is absent is
          attributed to another record, at re-solved tags, at tags solved
          more than once, or for any launch kind; RI-1 (d) opens no route; and
          the carried residuals (X1, X6b, X10; IV-1 under RH-1 (iv)) still have
          no supplying code.
        worked_attack: >-
          (1) Lost-record constructions against each count RI-1 (a) reads: a
          launch record lost at an event tag, at a non-event tag, at a
          gb_only pass-through, at S-2; a record lost together with one other
          counted entry (its RB-1 attempt record; its renamed_files key) -
          state whether every count RI-1 reads would have to be lost with it,
          and whether any count is DERIVED from the launch records rather than
          written independently (if one is, the check is circular there).
          (2) Launch kinds outside solver/ and health/: a lost child-job,
          callgrind, comparator or gp record where another record carries the
          same stdout_path, stderr_path or argv path; whether RI-1 (b) covers
          stderr_path and argv paths shared between records, not only
          stdout_path. (3) RI-1 (d): whether restricting the final files to
          the last record can leave a file attributed to a record of another
          launch. (4) Definition (iv) LITERALLY for any record RI-1 newly
          reads. (5) The residuals X1, X6b, X10 and IV-1 re-examined against
          the r3 base and, optionally, the installed third-party source. (6)
          For each, fail-open (a break) or fail-closed (a finding)?
        where_it_may_break: A count that the r4 layer derives from the launch records; a shared stderr_path or argv path of two records of different stdout paths; a lost record whose counted entries are written in the same atomic write.
      BJ-2_counts_no_planned_basis_refusal:
        reading: failclosed RFR-2, applied to RI-1 and RI-3
        claim_under_attack: >-
          On every normal path of either plan, every solver and health launch
          is counted exactly once by the records RI-1 (a) reads, no stdout_path
          of another launch kind is carried by two launch records, and so
          RI-1 names no gap on any planned basis outcome by design.
        worked_attack: >-
          (1) From the frozen code: for every call site of v2_driver.solve
          (v2_driver.py 358, 565, 693, 711, 786-787, 841, 1174 and any other),
          a1_health.run_system (a1_health.py 223-244), child_job (the call
          sites 94cc33 AJ-1 lists), callgrind_instructions and a1_pari, state
          whether any ordinary path of either plan launches two children with
          the same stdout_path in one package outside one SE-3 / HR-3 event
          (a tag solved twice; the health check run twice at one p into one
          directory; a callgrind child twice for one tag), and whether any
          S-1 or S-2 launch is not counted by RB-1 / RL-2 / the site counters
          (a refused_to_start attempt; a gb_only call; a health solve outside
          HR-3; the consistency-violation path). (2) THE COUNT CHECK on the
          four archived r3 gate packages: from each package's r3
          solver-events.json (events, their attempts, accepted_attempt,
          renamed_files, and the site counters attempts_total and
          passthrough_calls_gb_only_true) and its solver/ and health/
          listings, evaluate RI-1 (a) (ii) and (iii) with launch sets
          reconstructed (CRI-9), and list every mismatch. (3) The thirteen
          normal outcomes N-1..N-13 of review TASK-20260924-94cc33 and every
          PASS or PASS_ZL row of the close census's RKR-4 (b) table (md
          476-492) under attcount. (4) Whether the msolve flags of the cells
          and a1 invocations equal those of the gate invocations (review
          94cc33 B-9's transfer).
        where_it_may_break: A health or solve call that reuses a tag outside an event; an S-1 attempt the site counter does not count; a callgrind launch the gate never produced.
      BJ-3_definitional_scope_and_statements:
        reading: failclosed RFR-2, applied to RH-2 with RI-5 (a); RI-5 (b), (c) as wording
        claim_under_attack: >-
          RI-5 (a)'s statement of condition (iii) for the cap-mismatch class
