handoff:
  id: TASK-20260805-a1c3f9
  recorded_at: '2026-08-05'
  from: coordinator
  to: idea-generator
  objective: >-
    Acquire the FIPS 204 primary text and the primary fault-security-proof and
    fault-attack literature named in RQ-MLDSA-001's motivation, propose
    KN-LIT entries at their honest citation_verified level, and dedupe against
    the existing corpus. This discharges RQ-HQC-style precondition
    RQ-MLDSA-001.constraints[0]: "No experiment may be designed until the
    relevant primary sources are filed as KN-LIT entries." This task PROPOSES
    entries; it does not file them. Filing happens in the Coordinator ledger
    archive after independent review, exactly as GOAL-HQC-001 BATCH-001
    established (EV-HQC-9906b9, DEC-20260802-344883).
  uncertainty_reduced: >-
    Whether the sources RQ-MLDSA-001 depends on can actually be obtained under
    this harness's network policy, what they actually say (as opposed to the
    secondary-reporting/memory-sourced summary already in RQ-MLDSA-001's
    motivation field, which is explicitly flagged UNVERIFIED there), and
    therefore whether /propose-ideas RQ-MLDSA-001 can be run at all in a later
    batch.
  inputs:
    - AGENTS.md
    - CLAUDE.md
    - ledger/goals/GOAL-MLDSA-001.yaml
    - ledger/questions/RQ-MLDSA-001.yaml
    - coordination/goals/GOAL-MLDSA-001/batches/BATCH-001/batch.yaml
    - knowledge/SEEDING.md
    - knowledge/README.md
    - knowledge/INDEX.md
    - knowledge/literature/KN-LIT-056.md
    - knowledge/literature/KN-LIT-059.md
    - knowledge/literature/KN-LIT-3907.md
    - knowledge/literature/KN-LIT-1944.md
    - knowledge/literature/KN-LIT-1961.md
    - knowledge/literature/KN-LIT-054.md
    - knowledge/literature/KN-LIT-7620.md
    - knowledge/literature/KN-LIT-7662.md
    - knowledge/literature/KN-LIT-7668.md
    - knowledge/literature/KN-LIT-7669.md
    - docs/claims-and-verification.md
  constraints:
    - >-
      DEDUP BEFORE ACQUIRE. The corpus already carries at least 21
      Dilithium/ML-DSA-touching entries. KN-LIT-056 ("CRYSTALS-Dilithium - A
      Lattice-Based Digital Signature Scheme (ML-DSA / FIPS 204)") and
      KN-LIT-059 ("Fiat-Shamir with Aborts") are the closest to this goal's
      lane and are almost certainly NOT the FIPS 204 standard text itself
      (KN-LIT-056 reads as the original CRYSTALS-Dilithium submission paper).
      KN-LIT-3907 ("Fixing and Mechanizing the Security Proof of Fiat-Shamir
      with Aborts and Dilithium") may bear on the fault-security-proof
      boundary question. Check every one of these against what you obtain
      before proposing a new entry; upgrade an existing record's provenance
      in place of duplicating it, and say so in corpus_dedup_report.md.
    - >-
      PRIORITY SOURCES. In order of RQ-MLDSA-001's own motivation field, seek:
      (1) the FIPS 204 standard text itself (NIST, finalized 2024-08-13),
      distinct from the original CRYSTALS-Dilithium academic paper; (2) the
      2026-reported differential fault attack that identifies intended faults
      from public information alone; (3) the 2026-reported single-trace
      voltage-glitch attack on hedged ML-DSA recovering s1 with roughly 53%
      success on Cortex-M4; (4) the formal proof covering only a specific
      class of faults at internal function boundaries. Every one of these four
      claims is flagged UNVERIFIED in RQ-MLDSA-001 and none may be relied on
      until read from a primary source.
    - >-
      SOURCE-ROUTE HONESTY. Declare an access order before attempting it and
      log every attempt with its outcome and timestamp in
      source_access_log.yaml. RQ-MLDSA-001.provenance records csrc.nist.gov
      and nist.gov as unreachable via proxy CONNECT 403 under a PRIOR
      network-policy read; GOAL-HQC-001 BATCH-001 (D-5 in DEC-20260802-344883)
      found that record STALE by direct re-test. Re-test csrc.nist.gov and
      nist.gov yourself and record the current result; do not assume either
      the old blocked record or the HQC re-test transfers without checking. Do
      NOT attempt to circumvent a bot-protection challenge. Do NOT send
      outward-facing correspondence to any author; no decision in this
      campaign authorizes that.
    - >-
      PROPOSE, DO NOT FILE. Write proposed KN-LIT entries into
      proposed_kn_lit_entries.md inside your own write scope. Do NOT write
      into knowledge/ and do NOT touch knowledge/INDEX.md: filing is a
      ledger-archive act, gated on independent validator and red-team review
      of this task's artifacts.
    - >-
      Relay, never launder: every claim stays at the source's own hedging
      level, and a secondary-reporting figure (including anything from
      RQ-MLDSA-001's own motivation field, which is explicitly unverified)
      never becomes a KN-LIT claim without independent primary confirmation.
    - >-
      Third-party copyrighted PDFs are NOT committed; record URLs and sha256
      so a reviewer can re-acquire and verify byte-identity.
    - >-
      If a source cannot be obtained, say so and record the routes tried. A
      missing source stays missing. Never reconstruct a claim from memory and
      present it as read.
    - >-
      No experiment, no hypothesis, no security assessment of ML-DSA/MLWE/
      MSIS/SelfTargetMSIS in either direction. AGENTS.md rule 7: a fault
      result may never be scored as a break of MLWE, MSIS, or
      SelfTargetMSIS -- classify every attack found as mathematical or
      implementation/fault/side-channel in the summary.
    - AGENTS.md rule 5: an infrastructure or network blocker is never negative mathematical evidence.
  deliverables:
    - source_access_log.yaml: declared route order and every attempt with outcome
    - fips204_transcription.md: FIPS 204's statement of the three underlying problems (MLWE, MSIS, SelfTargetMSIS) and their role in the security proof, or an explicit statement that it could not be obtained
    - fault_literature_summary.md: the three fault/attack works, each classified mathematical vs. implementation/fault per AGENTS.md rule 7, with the formal proof's exact stated fault-class boundary
    - corpus_dedup_report.md: per-source verdict of already-filed / upgrade / new against the named census entries
    - proposed_kn_lit_entries.md: proposed entries at their honest citation_verified level
  artifact_paths:
    - coordination/goals/GOAL-MLDSA-001/batches/BATCH-001/tasks/TASK-20260805-a1c3f9/source_access_log.yaml
    - coordination/goals/GOAL-MLDSA-001/batches/BATCH-001/tasks/TASK-20260805-a1c3f9/fips204_transcription.md
    - coordination/goals/GOAL-MLDSA-001/batches/BATCH-001/tasks/TASK-20260805-a1c3f9/fault_literature_summary.md
    - coordination/goals/GOAL-MLDSA-001/batches/BATCH-001/tasks/TASK-20260805-a1c3f9/corpus_dedup_report.md
    - coordination/goals/GOAL-MLDSA-001/batches/BATCH-001/tasks/TASK-20260805-a1c3f9/proposed_kn_lit_entries.md
  archived_by: TASK-20260805-d47e12
  inference:
    policy: research-deep
    reasoning_effort: high
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
    fallback_note: >-
