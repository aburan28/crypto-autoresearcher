    - Every obtained source has an explicit already-filed / upgrade / new verdict against the named census entries
    - Every fault/attack source found is classified mathematical vs. implementation per AGENTS.md rule 7
    - No KN-LIT entry is filed directly; all proposals stay inside this task's write scope
  return_format: >-
