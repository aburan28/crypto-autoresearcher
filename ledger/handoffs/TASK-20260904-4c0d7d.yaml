handoff:
  id: TASK-20260904-4c0d7d
  from: coordinator
  to: validator
  goal_id: null
  batch_id: null
  batch_id_note: >-
    Review round of the RQ-PFDR-ae2fba battery, opened by the Coordinator on
    2026-09-04 under /review-evidence step 1 (review_plan written before any
    reviewer runs). Sibling review task on the same experiment:
    TASK-20260904-8c5f97 (red-team). Composition task after both reports:
    TASK-20260904-e6b4dd.
  experiment_id: EXP-PFDR-fd901a
  hypothesis_id: H-PFDR-09e1b0
  question_id: RQ-PFDR-ae2fba
  recorded_at: '2026-09-04'
  objective: >-
    Validate the six-run package of EXP-PFDR-fd901a (p-independence
    calibration of the (2, 2, 3) digit system at p = 4099, 2^64 - 59 and the
    P-256 prime; snapshot-archived, PR #713): run-set validity and manifest
    schema, seed and prime integrity, raw/summary agreement (flatness pair
    counts, the Clopper-Pearson interval, the Semaev-minus-null table),
    independent certificate re-verification and an independent rank-profile
    recomputation at the two large primes, control presence, and the literal
    accounting of the frozen success criterion (1)-(5) including the
    positive-control reading (66/130 measured first fall against the frozen
    65/129). Report holds | breaks | inconclusive on the joints assigned to
    this task in review_plan and nothing else.
  uncertainty_reduced: >-
    Whether the six runs are a valid, complete, schema-conformant run set
    whose summary tables are what the raw per-draw records say; whether the
    exact ranks the producer's meter reports at 2^64 - 59 and at the P-256
    prime are reproduced by an implementation that shares no code with the
    meter; whether every planted certificate holds under independent point
    addition; and whether the frozen criterion (2) fails as written while
    the control's forced disposition (strictly increasing in p) is met.
  inputs:
    - experiments/EXP-PFDR-fd901a/ (every file, including all six runs/ directories)
    - ledger/hypotheses/H-PFDR-09e1b0.yaml
    - ledger/proposals/IDEA-20260903-26aa81.yaml
    - ledger/proposals/IDEA-20260903-e1e38b.yaml (D3: the S_3 formula and the m = 2 top form)
    - harness/macaulay_fp/ (the shared meter, for reference only; V3 must not call it)
    - harness/macaulay_fp/VALIDATION.md
    - harness/semaev.py (the S_3 formula; V3 may read it to copy the formula, not to call it)
    - tests/test_macaulay_fp.py
    - ledger/handoffs/TASK-20260903-5a62de.yaml
    - ledger/decisions/DEC-20260903-93862f.yaml
    - docs/evidence-and-reproducibility.md
    - docs/claims-and-verification.md
    - templates/research-records.md
    - agents/validator.md
    - ledger/handoffs/TASK-20260904-4c0d7d.yaml
  constraints:
    - >-
      You own exactly the joints assigned to TASK-20260904-4c0d7d in
      review_plan (V1, V2, V3, V4). Attack them with the stated attack plans
      as a floor; report holds | breaks | inconclusive PER JOINT and one
      verdict for the joints owned; do not vote on the whole claim.
    - >-
      Blindness is mutual: do not read any report under
      coordination/reviews/pfdr-battery-20260904/reviews/ other than your
      own task directory, in this or any sibling experiment. If you
      encounter one, say so in review_attestation.read_sibling_reports.
    - >-
      Joint V3's rank recomputation must be written by you from the S_3
      formula and the digit substitution, using your own exact arithmetic
      (Python integers or sympy's DomainMatrix over GF(p)); it must not
      import harness/macaulay_fp. Certificate re-verification likewise uses
      your own affine addition, not harness/toycurve.
    - >-
      Report format: the validation_report block of agents/validator.md
      (id, task_id, run_ids, artifact_checks, metric_recomputations,
      control_checks, heuristic_validation_checks, cost_model_checks,
      proof_architecture_checks, verdict, limitations, artifact_paths)
      followed by the review_attestation block of templates/research-records.md
      (task_id, joints_owned copied VERBATIM from review_plan, sources_read
      complete, read_sibling_reports, blind_from_respected null (not a
      re-derivation task), verdict in {holds, breaks, inconclusive}).
    - >-
      Write only under
      coordination/reviews/pfdr-battery-20260904/reviews/TASK-20260904-4c0d7d/
      (validation-report.yaml plus scripts, tables and logs, each listed in
      artifact_paths with sha256) and the session scratchpad. Never edit
      any record, run package, script or ledger file. Never commit; never
      run git write commands (read-only git is permitted).
    - >-
      Never fabricate a number, a command, an output or a citation; a
      quantity you could not compute is reported as not computed with the
      reason. A timeout or crash in your own recomputation is an
      infrastructure event, never evidence about the ranks.
    - >-
      Scope: toy tier; the 256-bit cells are exact ranks of a 64-column
      matrix reached by a fixed-shape shortcut; nothing about the s-axis,
      yield, cost or ECDLP is validated here and nothing you write changes
      any status.
    - >-
      Inference: policy review-adversarial at its floor effort (xhigh) in an
      independent session; no fallback, no degradation; record the resolved
      model identifier, model_verified and fallback_used in the report.
  deliverables:
    - coordination/reviews/pfdr-battery-20260904/reviews/TASK-20260904-4c0d7d/validation-report.yaml
    - >-
      artifacts under the same directory: the manifest/sidecar check table
      (V1), the recomputed flatness, interval and difference tables (V2),
      the independent rank-profile and certificate script with its outputs
      (V3), the criterion-accounting table (V4)
  artifact_paths:
    - coordination/reviews/pfdr-battery-20260904/reviews/TASK-20260904-4c0d7d/validation-report.yaml
    - coordination/reviews/pfdr-battery-20260904/reviews/TASK-20260904-4c0d7d/
  write_scope:
    - coordination/reviews/pfdr-battery-20260904/reviews/TASK-20260904-4c0d7d/
  archived_by: TASK-20260904-e6b4dd
  archived_by_note: >-
    The report directory is staged in the ledger archive that follows the
    composition task TASK-20260904-e6b4dd, together with the evidence and
    decision records it produces; the archive commit itself is made by the
    orchestrating Coordinator session under an archive receipt.
  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 5400
    memory_gb: 8
    maximum_runs: 0
    budget_note: >-
      maximum_runs 0: re-checks and independent recomputations are not
      experiment runs and produce no run record. The rank recomputation is
      a 64-column matrix at 4 degrees per draw; a few draws per prime with
      256-bit residues take seconds in Python integers.
  completion_gate:
    - >-
      G1: validation-report.yaml exists at the declared path, parses
      strictly, and carries a review_attestation with task_id
      TASK-20260904-4c0d7d, joints_owned exactly the four joint strings
      assigned to this task in review_plan, a complete sources_read,
      read_sibling_reports false, and verdict in {holds, breaks,
      inconclusive}.
    - >-
      G2: every assigned joint has an entry recording the attack executed,
      the numbers obtained, the comparison, and a per-joint result; run_ids
      lists all six runs with their terminal status as you verified it.
    - >-
      G3: the V3 recomputation used no code from harness/ and says so; the
      draws recomputed are named (prime, curve seed, target seed).
    - >-
      G4: every produced artifact is under the write scope and listed in
      artifact_paths with its sha256; no record or package file was
      modified; the inference block is filled.
  return_format: >-
    A short plain-text return: the report path; per joint (V1-V4) the
    result and the one number or fact that decides it; the draws whose
    ranks or certificates you recomputed and whether each agreed; the
    literal reading of criterion (2); sources read (paths);
    read_sibling_reports; the inference block values. No whole-claim
    verdict; no status language.
  review_plan:
    claim_under_review: >-
      As the producer stated it (experiments/EXP-PFDR-fd901a/
      execution-report.yaml, observations.comparison_statistics and
      stage_3_sweep, verbatim): "criterion_3_flatness_64_vs_256: Semaev arm:
      40 of 40 paired draws identical on EVERY recorded invariant (full_rank,
      top_rank, fall_dim, syzygy_dim, deficit_series at D = 3..6, d_ff,
      cumulative profile); threshold 38 of 40 -> condition met (observation).
      Null arm 200 of 200; non-curve arm 40 of 40; secondary direct arm 6 of
      6."; "criterion_4_rank_drop_at_4099: Semaev arm: 0 rank-drop events in
      40 draws against the 64-bit modal profile; rate 0.0000, exact
      Clopper-Pearson 95% interval [0.0000, 0.0881]"; "criterion_5_semaev_
      minus_null: Identical table at 4099, 2^64 - 59 and the P-256 prime:
      nonzero differences only at D = 5: top_rank -4, fall_dim +4, and d_ff
      -1 (5 versus 6); every other invariant difference 0"; "semaev_profile_
      full_top_D3_to_D6: [(0,0),(1,1),(6,2),(15,1)] in 40 of 40 draws; d_ff =
      5; fall_dim = [0,0,4,14]" at each of the three primes; "noncurve_cubic_
      profile: identical to the Semaev arm at every p"; "stage_2_positive_
      control: B = 64: first-fall d_ff = 66 (6 of 6 draws); first D with
      top_rank = #monomials(D) = 65 (6 of 6); series d_reg = 65; frozen value
      65 ... B = 128: first-fall d_ff = 130; top-block-full-rank degree 129;
      frozen value 129; strictly_increasing: true; first_fall_equals_frozen_
      integer: false". The hypothesis (H-PFDR-09e1b0, title): "At fixed
      digit shape (m, d, s) the graded Macaulay invariants of the
      prime-field digit-presented decomposition system are p-independent
      above a small threshold prime, because the system is the
      specialization of one integer matrix family; the p-sweep to the P-256
      prime is a pipeline calibration that measures the small-p rank-drop
      rate, not a discovery axis".
    coordinator_prior: >-
      Written 2026-09-04 before any reviewer runs. I expect every
      validation joint to hold: the six runs are complete and pinned, the
      summary tables are the raw records, the certificates re-verify, and an
      independent elimination reproduces the profile [(1,1),(6,2),(15,1)] at
      both large primes. I expect the derivation (generic rank plus
      Schwartz-Zippel) to hold as a textbook argument and the red team to
      find that its planted-subvariety step is unproblematic here because
      the whole (2, 2, 3) profile is decided by the top form 16 a10 a11 a20
      a21 ... (H-PFDR-4148b8's tensor structure), whose only content primes
      are 2 and 3 (Stage 0 saw 0/24 at p = 2 and 23/24 at p = 3). The
      consequence I expect the red team to state is that the sweep's outcome
      was determined before it ran: criteria (3) and (5) could only fail by
      an instrument fault, and criterion (4)'s '0 of 40, interval [0, 0.088]'
      is an upper bound coarser than the derived Schwartz-Zippel bound
      30/4099 = 0.0073, so the 'small-p artifact budget' handed to the
      siblings is a derived bound restated, not a measurement. Criterion (2)
      as frozen (d_ff = 65 / 129) is, I expect, a transcription of the
      semi-regular d_reg = B + 1 of IDEA-20260808-093497 rather than a first
      fall: IDEA-20260903-e1e38b's mechanism section derives the direct
      presentation's first non-Koszul syzygy at degree B + 2, which is
      exactly the measured 66 / 130; the control's forced disposition
      (strictly increasing, instrument not blind to p) is met and no O1 bar
      applies. The Semaev-minus-null offset (top_rank -4, fall_dim +4, d_ff
      -1 at D = 5, identical at all three primes) is H-PFDR-4148b8's
      prediction, so HEUR-002 (shape determination) fails by exactly the
      pre-registered p-independent integers (the F5 'expected' reading) and
      IDEA-20260731-009's HEUR-FF-1 surrogate is valid for these invariants
      only after subtracting them. The non-curve cubic being identical to
      the Semaev arm at every prime means the p-axis carries nothing about
      the curve at this shape. DECISION I EXPECT: support for H-PFDR-09e1b0
      scoped to (2, 2, 3) at the three primes, with evidence strength
      replicated (three primes, two independent engines counting
      EXP-PFDR-5726af's profile on the same shape at 4099 and 65537) but
      with its information content honestly labelled as derivation
      confirmation; a knowledge entry (fixed-shape p-independence and the
      exact Semaev-minus-null offset, reached at the P-256 prime) is
      warranted if the red team confirms the derivation; no status for
      HEUR-FF-1 changes.
    joints:
      - joint: 'V1 run-set validity, manifest schema, seed and prime integrity'
        assigned_to: TASK-20260904-4c0d7d
        attack_plan: >-
          For each of the six run directories: the six required files
          present, checksums.sha256 recomputed and matching, manifest
          status completed_valid, code.commit 3a9c1b02 with dirty false,
          run_experiment.py sha256 identical across all six manifests, the
          meter per-file sha256 identical across runs and equal to
          harness/macaulay_fp/VALIDATION.md, selftest_in_this_lineage 52
          passed in every manifest, seeds equal to the contract's (curves
          1101..1108, targets 1..5, null labels 7..19 mixed per D3, positive
          control 2101..2103), degrees 3..6, window 8, timing_source named
          (D1), stderr empty. Re-confirm 2^64 - 59 prime and no prime in
          (2^64 - 59, 2^64) with your own Miller-Rabin over the 12 bases,
          and the P-256 prime. Check that the inference block discrepancy
          (executor-terra in run.inference, D9) is disclosed and that no run
          claims a model in the loop. Where I think it breaks: nowhere; the
          D9 shadowing is a harness finding, not a validity defect.
        breaking_artifact: >-
          A missing or mismatching file, a manifest whose pinned hashes
          differ from its siblings', a seed set differing from the
          contract, or a primality claim that fails.
      - joint: 'V2 raw/summary agreement: flatness pairing, rank-drop interval, Semaev-minus-null table, draw counts'
        assigned_to: TASK-20260904-4c0d7d
        attack_plan: >-
          From runs/*/raw-result.json ONLY (not analysis.json), with your own
          code: count draws per arm per prime (expect 40 / 200 / 40 / 6 and
          5 + 25 named-curve at 256 bits; totals 286 / 286 / 316); pair the
          64-bit and P-256 draws by (curve seed, target seed[, null label])
          and count pairs identical on every invariant (expect 40/40,
          200/200, 40/40, 6/6); compute the modal profiles; compute the
          rank-drop events at 4099 against the 64-bit modal profile and the
          exact Clopper-Pearson upper bound for 0 of 40 (1 - 0.025^{1/40};
          expect 0.0881) and 0 of 200 (expect 0.0183); rebuild the
          Semaev-minus-null table at each prime and confirm the only nonzero
          rows (top_rank@5 -4, fall_dim@5 +4, d_ff -1); check no flatness
          label mixes planted and unplanted draws (invalidation rule 5) and
          that the null RNG seeds (rng_seed_mixed) are distinct across
          (curve, target) as D3 claims. Diff your tables against analysis.md.
          Where I think it breaks: nowhere; a discrepancy would indicate
          analyze.py reading something other than the raw records.
        breaking_artifact: >-
          Any count, interval or difference that differs from analysis.md,
          or a null seed collision that collapses the 200 null draws.
      - joint: 'V3 independent certificate re-verification and rank-profile recomputation at the large primes'
        assigned_to: TASK-20260904-4c0d7d
        attack_plan: >-
          Write your own code: (a) affine point addition on y^2 = x^3 + A x +
          B and re-verify the decomposition certificate of at least 5 Semaev
          draws per prime, including all 5 named NIST P-256 draws (A = p - 3,
          B as recorded) and the S_3-root certificates of 3 non-curve draws
          per prime via the S_3 formula; (b) build S~ = S_3(ell_1, ell_2,
          x_R) reduced modulo a^2 = a with ell_k = a_{k,0} + 2 a_{k,1} +
          4 a_{k,2}, form the per-layer rows {mu S~ : deg mu = D - 4} for D
          in 4..6 over the 64 squarefree monomials, and compute full rank
          and top rank by your own exact elimination modulo p for at least 3
          Semaev draws at 2^64 - 59 and 3 at the P-256 prime (including one
          named-curve draw); expect (1, 1), (6, 2), (15, 1). Compare with the
          per-draw raw records. Where I think it breaks: nowhere; the
          fixture run cross-checked only at 4099, so this is the first
          non-meter rank at 256-bit residues.
        breaking_artifact: >-
          A certificate that fails independent re-addition, or a rank
          differing from the raw record at any degree for any recomputed
          draw (attach the row matrix and your elimination trace).
      - joint: 'V4 control presence and literal accounting of the frozen success criterion (1)-(5)'
        assigned_to: TASK-20260904-4c0d7d
        attack_plan: >-
          Table every control of the contract (CTRL-FROZEN-FIXTURE, CTRL-
          POSITIVE-P-DEPENDENCE, NULL-SUPPORT, NEARBY-NON-CURVE-CUBIC, CTRL-
          SECONDARY-DIRECT-FIXED-B, CTRL-NAMED-CURVE, CTRL-CONFOUNDERS-NAMED)
          with the run and draw counts that realise it. For the frozen
          fixture: confirm from git history that no EXP-PFDR-5726af run
          existed when RUN-PFDR-fd901a-fixture-p4099 executed (compare
          manifest timestamps: fd901a fixture versus RUN-PFDR-5726af-m2-s3
          at 2026-09-03T20:34 UTC), so the contract's fallback (independent
          second implementation) applied; record that the 'shared' instance
          differs from 5726af's (a = 941, b = 428, x_R = 3690 versus a = 527,
          b = 72, x_R = 2374) as a contract defect that invalidates nothing.
          For criterion (2): record the literal reading (first fall 66/130
          against frozen 65/129: NOT met) and the disposition reading
          (strictly increasing: met; top-block-full-rank degree 65/129: met),
          and confirm from the raw records that the prediction text was not
          altered (compare specification.yaml at commit c5742969). Where I
          think it breaks: criterion (2) fails literally; nothing else.
        breaking_artifact: >-
          A control absent or with fewer draws than the contract declares,
          a fixture fallback used while a 5726af run already existed, or
          evidence of a prediction edit after execution.
      - joint: 'R1 the derivation: generic rank, Schwartz-Zippel and the planted subvariety'
        assigned_to: TASK-20260904-8c5f97
        attack_plan: >-
          Check claim (A) line by line: entries of M_D are integer
          polynomials in (A, B, x_R) of degree <= 2 (verify by expanding
          S_3(ell_1, ell_2, x_R) symbolically); the maximal-minor product
          bound deg(P_D) <= 2 r_D; the specialization inequality rank_{F_p}
          <= generic rank; and the step 'the planted family is a subvariety
          on which the same argument holds': the planted x_R = x(P_1 + P_2)
          makes (A, B, x_R) lie on a subvariety that could sit INSIDE the
          zero locus of every maximal minor at some degree, in which case
          the planted generic rank is lower than the uniform one and the
          sweep could not see it. Test: with your own code, sample 20
          uniform (A, B, x_R) in F_p^3 at p = 4099 and at 2^64 - 59 and
          compare profiles with the planted ones (Stage 0 did 8 samples).
          Then attack the rate: find explicitly an (A, B, x_R) at p = 4099
          on which the D = 5 top block drops rank (solve a 2 x 2 minor of
          the 6 x 6 top block for x_R given A, B; count its roots) and state
          the true density of the rank-drop locus; compare with 0.0073 and
          with the measured 0 of 40. Where I think it breaks: nowhere for
          the derivation; the density is a few over p and the 0/40 is
          uninformative about it.
        breaking_artifact: >-
          A derivation note with the minor degrees and an explicit rank-drop
          point at p = 4099 (a certificate that the small-p locus exists), or
          a planted-versus-uniform profile difference.
      - joint: 'R2 information content of the sweep and the inverted structural tell'
        assigned_to: TASK-20260904-8c5f97
        attack_plan: >-
          Using H-PFDR-4148b8's tensor structure at (2, 2, 3) (top form
          16 a_{1,0} a_{1,1} ... in the digit form; kernel of multiplication
          by ell_1^2 ell_2^2), derive the ENTIRE per-layer profile (full
          rank, top rank at D = 4, 5, 6) over Q and identify its content
          primes (expect only 2 and 3, matching Stage 0's small-prime table).
          Conclude what criteria (3) and (5) could have shown: if the profile
          is forced for every p > 3, the sweep's 40/40 at three primes is a
          derivation confirmation and the experiment's evidence strength is
          that of the derivation, not of 120 draws. Then assess the 'small-p
          budget': the measured 0/40 with upper bound 0.088 versus the
          derived 30/4099; state what a real measurement of the rate would
          require (draw count of order p) and whether the siblings that
          consumed the budget (EXP-PFDR-20ee58, EXP-PFDR-cbdefb) relied on
          the number or on the bound. Where I think it breaks: not a break
          of the claim; a break of any reading that calls this a
          cryptographic-scale validation (the 256-bit cells are 64-column
          exact ranks whose value was forced).
        breaking_artifact: >-
          A derivation note giving the forced profile and its content
          primes, plus a statement of the sweep's actual information content
          and the correct label for the 'artifact budget'.
      - joint: 'R3 positive-control reading: provenance of the frozen 65/129 and the measured 66/130'
        assigned_to: TASK-20260904-8c5f97
        attack_plan: >-
          Re-derive, for the direct presentation at m = 2 with membership
          f_V of degree B and the monomial top form x_1^2 x_2^2, the degree
          of the first non-Koszul syzygy (IDEA-20260903-e1e38b mechanism:
          x_1^{B-2} S_top = x_2^2 x_1^B at degree B + 2) and the semi-regular
          d_reg = B + 1 of IDEA-20260808-093497; decide which integer the
          contract's own d_ff definition (first D with fall_dim > 0,
          per-layer) must return (I expect B + 2) and therefore whether the
          frozen 'd_ff = B + 1' was satisfiable at all. Check the secondary
          direct arm (B = 8: first fall 10 = B + 2, full top rank at 9) for
          consistency. Confirm from the raw records and analyze.py that the
          alternative reading (top-block-full-rank degree) was recorded, not
          substituted, and that the stopping rule's 'flat' test was applied
          to the first-fall reading. Where I think it breaks: the frozen
          integer was d_reg, not d_ff; a contract transcription error, not
          an instrument fault.
        breaking_artifact: >-
          A derivation showing the first fall should have been B + 1 (which
          would make 66/130 an instrument fault), or evidence that the
          reading was chosen after the fact to rescue criterion (2).
      - joint: 'R4 confounds and secondary arms: CRT artifact, output-degree proxy, nodal cubic, named curve'
        assigned_to: TASK-20260904-8c5f97
        attack_plan: >-
          Inspect run_experiment.py and analyze.py for any ideal-level
          quantity (quotient dimension, solution count, Groebner degree)
          entering a metric or a label; confirm every reported invariant is
          a generator-level graded rank (IDEA-20260830-cb8e46's CRT artifact
          and IDEA-20260807-899c5e's proxy excluded by construction, not by
          assertion). Explain the nodal cubic's identity with the Semaev arm
          at every prime from the top form (A, B enter only below the top
          degree) and state whether ANY sub-top term can move the (2, 2, 3)
          profile; state what the NIST P-256 named-curve cell adds beyond
          the random curves (I expect nothing at fixed shape). Check the
          null-seed mixing (D3) against the contract's '5 seeds per (curve,
          target, p)' and whether the executor's justification (verbatim
          seeds would collapse 40 draws to 5 objects) is right. Where I
          think it breaks: nowhere; the arms are uninformative about the
          curve by derivation, which is a scope finding.
        breaking_artifact: >-
          An ideal-level reading found in a metric, or an arm whose profile
          depends on the curve coefficients at this shape.
    blindness:
      mutual: true
      lifted_for: []
      rationale: null
    proves_too_much:
      objects:
        - >-
          The same (2, 2, 3) digit system at p = 2 and p = 3, the content
          primes of the top block (every degree-4 entry has content
          divisible by 16; Stage 0 observed 0/24 at p = 2 and 23/24 at
          p = 3): p-independence of the graded ranks is KNOWN FALSE there.
        - >-
          The inclusion map W_{1,3} (multiplication by ell^2 from degree 1
          to degree 3) on F_3[a_1..a_6]/(a_i^2), s = 6 > p = 3: Wilson's rank
          formula drops the i = 0 term because 3 divides binom(3, 1), so the
          rank is 5 < 6 = min(binom(6,1), binom(6,3)); a graded rank that is
          genuinely p-dependent below the threshold p_0 = s.
        - >-
          The direct presentation with B = round(p^{1/2}) (the positive
          control): the matrix size grows with p, so flatness is KNOWN FALSE
          and the argument's hypothesis (size independent of p) is absent.
      failure_signature: >-
        On the first two objects the derivation must PREDICT the drop (a
        content prime; a prime dividing a diagonal entry binom(k - i, t - i))
        and a direct exact rank must SHOW it; an argument or pipeline that
        reports the 2^64 profile at p = 2, or rank 6 at (p = 3, s = 6), has
        proved too much. On the third the argument must decline to conclude
        flatness because its size-independence hypothesis fails, and the
        measured first fall must move (66 to 130).
      assigned_to: TASK-20260904-8c5f97
    blind_rederivation:
      required: false
      quantity: null
      parameters: null
      blind_from: []
