    outcome, a preferred position or a suspected defect (CF-15).'
  - THIS ROUND IS SESSION-INDEPENDENT AND NOT MODEL-INDEPENDENT, blindness is DELIBERATELY LIFTED FOR
    YOU BY NAME, and your agreement with any RT-, F-, V- or AF-number is NOT independent of the reports
    you were given. State it in your limitations.
  - NETWORK IS NOT REQUIRED AND NO CONCLUSION MAY REST ON A RETRIEVAL. A model recollection is a `recalled`
    pointer under AGENTS.md rule 9 and is never support.
  - Never select a provider, backend, endpoint, or model identifier containing Bedrock, case-insensitively.
