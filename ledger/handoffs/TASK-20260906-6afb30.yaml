  constraints:
  - TAKE A POSITION. A ruling that describes the question, weighs it, and stops has NOT settled it, and
    P-1 IS NOT SATISFIED BY IT. State which position you take, in one sentence a reader cannot mistake,
    before you give your reasons.
  - 'SETTLE RT-4''s LICENSING QUESTION AND ONLY THAT. YOU MAY NOT SETTLE: AF-4''s INTERVAL RULING (whether
    clause_4''s raw-output status requirement is prospective, whether the one existing implementation
    is non-conforming from the instant of enactment, what clause_3''s unsubjected `deviation_sign_note`
    binds); F-J2-1''s NAMING of clause_4''s licence and its foreclosure among the effects enacted; CF-10''s
    placement or its `travels with` authority limb; F-2, F-3 or CF-22; RT-6, RT-9(a) or RT-12; AF-1, AF-2
    or AF-3; or whether the amendment should be enacted at all. YOU MAY CITE ANY OF THEM AS MATERIAL AND
    YOU MUST STATE EXPRESSLY THAT YOU DO NOT SETTLE THEM.'
  - YOU MAY NOT RULE ON HOW AN ENACTED clause_4 FORECLOSURE INTERACTS WITH THE STANDING CITATION PROHIBITION.
    DEC-20260906-f709b2 citation_boundary lists exactly that Coordinator ruling as a thing that WOULD
    SUPPORT A LIFT of the standing prohibition, and this batch lifts nothing. Note the question exists,
    note that you decline it, and move on.
  - ANCHOR EVERY OPERATIVE PROPOSITION IN COMMITTED BYTES AT A NAMED KEY PATH, WITH THE WORDS QUOTED.
    A proposition without a key path is unfalsifiable and the reviewer will report it as such. Confirm
    every clause text you rely on AGAINST THE FILE ITSELF, not through any report, and say which you confirmed
    and which you did not.
  - NAME YOUR OWN COUNTERFACTUAL - THIS IS THE ONLY CONTROL YOUR RULING CAN HAVE. Record (a) the positions
    available, at least two, each stated as a party could act on it; (b) which committed bytes decide
    between them; and (c) AT LEAST ONE COMMITTED ARTIFACT THAT, HAD IT READ DIFFERENTLY, WOULD HAVE FORCED
    THE OTHER POSITION, named by path and key path. A RULING THAT CANNOT NAME WHAT WOULD HAVE CHANGED
    IT HAS RESTATED RATHER THAN RULED, and the reviewer will open your counterfactual and ask whether
    it really bears.
  - 'STATE WHO IS BOUND BY YOUR RULING AND FROM WHEN. A ruling that does not say whom it binds is an opinion.
    And state expressly that it binds NOTHING until the closing decision adopts it: you write no ledger
    record and your artifact is a coordination artifact until then.'
  - 'WRITE FOR AN ADVERSARY. Your ruling exists so the enacting batch''s producer can ATTACK it. Make
    the attack surface visible on purpose: state the weakest point of your own reasoning, in your own
    words, in its own key. A ruling that hides its weakest point wastes the round it was written for.'
  - 'YOU WRITE NO LEDGER RECORD, CHANGE NO STATUS, COMMIT NOTHING, APPROVE NOTHING AND ENACT NOTHING.
    EXP-WESOVOW-001 stays `approved` and UNAMENDED at version 1 and the redraft stays `status: draft`,
    `in_force: false`, `approved_by: null` in every sentence you write. No version transition of any kind.'
  - DO NOT EDIT, ANNOTATE, MARK OR APPEND TO ANY IMMUTABLE ARTIFACT. The redraft, the red-team report,
    the BATCH-752ef2 analysis and every BATCH-314308 artifact are committed and snapshot-bound. A finding
    against one lives in a NEW record in your own task directory.
  - DO NOT EXECUTE experiments/EXP-WESOVOW-001/cost_model.py, and do not seek it out - it is not in your
    read scope. Do not open anything under inputs/. Do not open BATCH-2e6130.
  - RESTATE THE CITATION PROHIBITION AND ITS PREDICATE EXTENSION VERBATIM in your ruling, lift neither,
    and state whether either fired on anything you wrote. Do not state any crossover value, baseline-comparison
    sign, margin or speedup anywhere; name rows and fields BY LOCATOR. RT-2's antecedent `A > 0` IS the
    governed sign.
  - 'DO NOT ASSERT THAT A COMMITTED IMMUTABLE RECORD IS WRONG. Naming a defect and leaving the stronger
    claim UN-PROMOTED is correct; asserting the conclusion needs `review-breakthrough` at `max`, which
    is `degradable: false` and unservable here (IMP-1). Never substitute a lower tier.'
  - IF YOU CONCLUDE THAT RT-4's LICENSING QUESTION CANNOT BE SETTLED WITHOUT SETTLING SOMETHING RESERVED,
    SAY SO PLAINLY AND STOP. That is a COMPLETE AND VALUABLE RESULT - it would mean P-1 as specified is
    not achievable and that the enacting batch's precondition set needs amendment by a committed decision
    rather than by a ruling. Do not settle the reserved item to make the ruling possible.
  - maximum_runs IS 0. You execute nothing. AN EXHAUSTED BUDGET, A TIMEOUT OR A CRASH IS AN OPERATIONAL
    OBSERVATION AND IS NEVER NEGATIVE MATHEMATICAL EVIDENCE.
  - CLOSE WITH A TOP-LEVEL review_attestation MAPPING in rt4_licensing_ruling.yaml carrying task_id, joints_owned
    (empty list - you are a producer and own no review joint), sources_read (honest and complete), read_sibling_reports
    (TRUE - blindness is lifted for you by name, and you are given the prior rounds' reports), blind_from_respected
    (true; this plan declares no blind_from list) and verdict (holds, breaks or inconclusive, ON YOUR
    OWN RULING ONLY).
  - 'RECORD YOUR INFERENCE PROVENANCE HONESTLY: requested policy, adapter-resolved model identifier, your
    own self-report if it differs, model_verified and whether a probe was ACTUALLY run, reasoning effort,
    fallback status. ESCALATE a divergence rather than absorbing it. NEVER RECORD A PROBE OR A MODEL IDENTITY
