  budget:
    wall_clock_seconds: 160
    memory_gb: 8
    maximum_runs: 1
  completion_gate:
    - All ten pre-freeze checks are recorded in the receipt with their outcomes,
      including PF-1's independent ordering verification.
    - The content_first binding covers every declared producer path by sha256;
      anything staged but not bound is disclosed in staged_not_in_binding_set.
    - The commit changes exactly the declared paths and its message names the
      record ids.
    - The origin/main base commit checked and the merge outcome are recorded.
    - The branch is pushed and a PR against main is open or refreshed naming the
      new records.
    - The dispatcher's post-commit verifier accepts the receipt before either
      reviewer is dispatched.
  return_format: >-
    The snapshot receipt at the declared path, plus a one-line statement of the
    binding commit, the base commit merged, and any pre-freeze check that failed.
  review_plan_path: coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/review-plan/review-plan-2de43d.yaml
  review_plan_note: >-
    THIS TASK IS THE OPERATIONAL GATE OF THE REVIEW ROUND -- its completion_gate
    is what makes TASK-20260821-2de43d and TASK-20260821-26ba34 eligible -- so
    the pointer is recorded here. The plan's schema-validated inline copy lives
    on ledger/handoffs/TASK-20260821-bc91f0.yaml rather than here, deliberately:
    this handoff runs AFTER the idea, the gate and the executor, and a copy
    placed here could not show from its placement that the plan predates the
    results it will be used to judge. bc91f0 is committed in the batch's opening
    commit, before any producer ran. Full reasoning in that handoff's
    `review_plan_placement_rationale`.
    DO NOT FREEZE unless review-plan-2de43d.yaml is already committed and
    unchanged. A review plan amended after the bytes it judges exist is not a
    pre-commitment, and a snapshot that lets one through has spent the
    round's independence before it starts.
  review_plan: null
