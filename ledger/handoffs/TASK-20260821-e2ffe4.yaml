  task_card: coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/task-cards/TASK-20260821-e2ffe4/task_card.yaml
  objective: >-
    Snapshot the opening control plane, the idea record, the gate decision and
    frozen H/EXP contract, and the executor's implementation, gate result and
    runs under a content_first binding BEFORE either independent review, with
    the ten pre-freeze checks recorded.
  uncertainty_reduced: >-
    None. This is the mechanical freeze of the exact bytes the two independent
    reviews will run against; its entire value is in being isolated and exact.
  inputs:
    - The producer artifact paths at HEAD (the dispatch queue supplies the binding set)
    - The ten pre-freeze checks in the task card
    - origin/main, fetched and merged into the working branch before the commit
  constraints:
    - RUNS ALONE. No concurrency during the freeze; a byte that changes mid-freeze
      makes the binding a fiction.
    - >-
      PF-1 IS A STOP CONDITION: independently confirm from run manifests and
      timings -- not from the execution report's prose -- that the
      two-directional dependence gate run PRECEDES every declared-scale run. If
      it does not, DO NOT FREEZE: report an SC-2 breach, because every
      declared-scale observation is void under the frozen contract's own
      invalidation_rule.
    - Stage ONLY the declared paths. A scope-expanding commit blocks downstream
      review; it is an evidence-integrity failure, not a research result.
    - Merge origin/main before committing (MERGE, NEVER REBASE -- rebasing
      rewrites the commits run records were archived in). Record the base commit
      checked and the merge outcome in the receipt.
    - A sync conflict inside an immutable record is resolved by a NEW SUPERSEDING
      RECORD under a new id, never by editing a side.
    - Push the branch and open or refresh a PR against main naming the record
      ids. A record that exists only in a local commit is unpublished, not
      durable evidence.
    - Do not put this commit's own sha into an artifact inside that same commit.
    - Do not interpret, conclude, or repair anything. A failed pre-freeze check
      is reported, not fixed.
    - If TASK-20260821-fad775 revised/rejected, freeze the smaller idea +
      gate-only package and record that explicitly.
    - Never read the quarantined payload (SC-6); no Bedrock (SC-8).
  deliverables:
    - coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/archives/TASK-20260821-e2ffe4/snapshot-receipt.json
  artifact_paths:
    - coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/archives/TASK-20260821-e2ffe4/snapshot-receipt.json
  archived_by: TASK-20260821-6ce8a8
  archive:
