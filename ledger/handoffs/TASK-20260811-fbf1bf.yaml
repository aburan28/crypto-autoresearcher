  recorded_at: '2026-08-11'
  from: coordinator
  to: coordinator
  role: coordinator
  archive_kind: ledger
  authorized_by: DEC-20260810-616fd5
  authorized_by_note: >-
    DEC-20260810-616fd5 is the committed Coordinator decision that authored and
    authorized the two BATCH-014 reviews and whose next_actions name, in order,
    their dispatch and the ledger archive that follows them. This record is
    that ledger archive task and derives its authority from that decision and
