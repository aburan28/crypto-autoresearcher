      ledger/decisions/DEC-20260810-616fd5.yaml -- the authorizing decision. Its
      next_actions item 3 states the required order explicitly: AFTER both
      reviews return, write the evidence record, then a closing decision, then a
      ledger archive. This task performs the archival of the REVIEW REPORTS
      only; see scope_boundary for why it stops there.
    - ledger/handoffs/TASK-20260810-098fad.yaml (validator review handoff; committed and immutable)
    - ledger/handoffs/TASK-20260810-971cfa.yaml (red-team review handoff; committed and immutable)
    - >-
      coordination/goals/GOAL-SSIQ-001/batches/BATCH-014/archives/TASK-20260810-dae7ef-receipt.yaml
      -- the BATCH-014 SNAPSHOT archive receipt, which is the shape model for
      this task's receipt but is a different KIND of archive: it archived the
      producer package BEFORE review; this one archives review reports AFTER
      review. Read its process_deviation block before authoring this receipt,
      because that deviation is the reason this batch's archival chain must be
      unusually explicit about what each receipt does and does not certify.
    - >-
      ledger/goals/GOAL-SSIQ-001/checkpoints/BATCH-014.yaml -- the WRITE-ONCE
      checkpoint shard. READ ONLY. Its artifacts.ledger_archive_task field is
      null and its artifacts.reviews list is empty; those values are correct as
      of the commit that wrote them and MUST NOT be edited by this task or any
      other. The binding from shard to this task is resolved forward from this
      record, not backward by amending the shard.
    - >-
      AGENTS.md "Durable research commits" and "Required handoff envelope";
      templates/research-records.md "Agent handoff" and "Coordinator archive
      receipt"; CLAUDE.md "Archive receipts bind to CONTENT first".

  archives_review_tasks:
    - TASK-20260810-098fad
    - TASK-20260810-971cfa
  archives_review_tasks_note: >-
    THIS IS THE ARCHIVE BINDING, AND IT RUNS IN ONE DIRECTION ONLY -- FROM THIS
    RECORD TO THOSE TWO.
    Both review handoffs carry archived_by: null with an archived_by_note saying
    the ledger archive task "does not exist yet and will be minted by the
    Coordinator who dispatches and receives this review". This record is that
    task. Those two files are committed and therefore immutable under AGENTS.md
    rule 2 -- corrections supersede, never overwrite -- so their archived_by
    fields CANNOT and MUST NOT be edited to point here, and no such edit is
    proposed, permitted, or implied by this record. Editing them would be a
    worse defect than the dangling null it repairs.
    A FUTURE READER RESOLVES THE ARCHIVE BINDING FROM THIS SIDE: to learn which
    archive committed TASK-20260810-098fad's or TASK-20260810-971cfa's reports,
    do not read their archived_by field (it will read null forever, correctly,
    because it was authored before this task existed) -- search the handoff
    ledger for the archive record that NAMES them, which is this one, and then
    read this task's receipt at the declared archives/ path for the commit,
    parent, and per-path hashes.

  authoring_defect_in_an_input:
    id: AD-BATCH-014-validation-notes-undeclared-path
    severity: named_and_resolved_here_not_silently_repaired
    status: RESOLVED_BY_INSTRUCTION_TO_THE_VALIDATOR_BEFORE_DISPATCH
    what_is_wrong: >-
      TASK-20260810-098fad's deliverables list TWO items -- validation_report.yaml
      and validation_notes.md -- but its artifact_paths declares only TWO paths,
      and neither of them is a validation_notes.md:
      coordination/goals/GOAL-SSIQ-001/batches/BATCH-014/reviews/VAL-BATCH-014.md
      and
      coordination/goals/GOAL-SSIQ-001/batches/BATCH-014/reviews/TASK-20260810-098fad/validation_report.yaml.
      validation_notes.md therefore has NO declared path anywhere in the record.
      Its return_format compounds this by describing the deliverable pair
      ("validation_report.yaml ... plus validation_notes.md with the working")
      without ever binding the second to a path.
    why_it_matters: >-
      A card/queue path mismatch of exactly this shape makes `completed`
      unreachable in both directions and is a known, recurring failure mode of
      this program. If the Validator writes validation_notes.md at a path this
      archive has not declared, then either the archive stages an UNDECLARED
      path -- which the post-commit verifier rejects as scope expansion, failing
      the archive -- or the archive omits a named deliverable, which leaves the
      review task unable to satisfy its own deliverables list. Either way the
      batch stalls on an authoring error rather than on anything about the
      research.
    how_it_is_resolved: >-
      artifact_paths IS AUTHORITATIVE OVER deliverables. This is the general rule
      this record applies and states rather than assumes: a deliverables entry
      is a prose description of work product, while an artifact_paths entry is
      the binding write scope that an archive stages and a verifier checks, so
      where the two disagree the declared path governs and the undeclared
      deliverable name is treated as descriptive, not as a second file.
      Concretely, the Validator is being instructed AT DISPATCH -- before it
      writes anything, and therefore not as a post-hoc reinterpretation of work
      already done -- to put ALL of its working, the material that
      TASK-20260810-098fad's return_format calls "validation_notes.md with the
      working", into
      coordination/goals/GOAL-SSIQ-001/batches/BATCH-014/reviews/VAL-BATCH-014.md,
      which IS a declared path, and to write NO file named validation_notes.md
      at any path. Nothing is dropped: both deliverables' CONTENT lands, in two
      declared files instead of three, with the structured verdict/check
      outcomes/metadata in validation_report.yaml and the narrative working in
      VAL-BATCH-014.md.
    what_is_deliberately_not_done: >-
      TASK-20260810-098fad IS NOT EDITED. It is committed and immutable
      (AGENTS.md rule 2). Its deliverables list keeps naming validation_notes.md
      forever, and that is correct: the defect is recorded and resolved HERE, in
      the record that acts on it, not concealed by rewriting the record that
      contains it. Neither is a fourth path silently added to this archive's
      artifact_paths to "cover" a file that has been instructed not to exist --
      declaring a path for a file no one will write would move the same
      unreachability from one side of the gate to the other.
    what_invalidates_this_resolution: >-
      If the returned review nevertheless contains a validation_notes.md at any
      path, the resolution has failed and this archive DOES NOT commit around
      it. Halt, stage nothing, and record a superseding handoff that declares
      the actual path set. Staging an undeclared path is never the repair.

  scope_boundary:
    statement: >-
      THIS TASK COMMITS REVIEW REPORTS. IT DOES NOTHING ELSE, AND IT
      DELIBERATELY STOPS SHORT OF EVERYTHING ELSE.
    does_not_close_the_batch: >-
      BATCH-014 REMAINS OPEN after this archive. This task does not set, and its
      receipt must not assert, closed_at, closed_by, evidence_id or outcome.
      Those fields live in the write-once checkpoint shard
      ledger/goals/GOAL-SSIQ-001/checkpoints/BATCH-014.yaml, which is not touched
      here; per DEC-20260810-616fd5's next_actions, closing state is recorded in
      a later closing decision and a superseding record, NEVER by editing that
      shard.
    writes_no_evidence_record: >-
      NO EV-* IS WRITTEN, GRADED, OR IMPLIED. This archive makes reviewer output
      durable; it does not read it, weigh it, agree with it, or convert it into
      evidence. A reviewer verdict committed by this task is a committed report,
      not a graded evidence record, and no strength (anecdotal / preliminary /
      replicated / strong) is asserted anywhere by this task.
    moves_no_hypothesis: >-
      H-SSIQ-36e970 DOES NOT MOVE and neither does any other hypothesis. It
      remains at whatever status it already carries. BATCH-014's producer run
      deferred at G-0c and computed no delta_E value of any kind
      (n_sweep_points_attempted/succeeded/failed = 0/0/0), so there is nothing
      here to move a hypothesis with in either direction -- AGENTS.md rule 5.
    completes_no_goal: >-
      GOAL-SSIQ-001 is not completed, not paused, and not closed_at_budget by
      this task. No completion criterion is claimed met, no attestation is
      obtained, and none may be recorded. latest_verified_commit is NOT updated
      by this task.
    states_no_interpretation: >-
      The archive run states no verdict of its own, selects neither forward
      branch (A) matched host nor (B) re-baselined reference from
      DEC-20260810-616fd5's next_actions, and makes no approval determination.
      If the returned reviews contradict DEC-20260810-616fd5 -- which both
      handoffs explicitly invite them to do -- that contradiction is committed
      verbatim and adjudicated later, in a decision, by a Coordinator reading
      the committed reports. It is not adjudicated by the act of filing them.
    modelled_on: >-
      This boundary is written in the same spirit as DEC-20260810-616fd5's own
      scoping, which states in its context block that it "DOES NOT CLOSE
      BATCH-014, does not write an evidence record, and does not move any
      hypothesis", and whose decision_vocabulary_note narrows `approve` to an
      archive-and-validity act rather than a scientific reading.

  inputs_state_at_authoring:
    branch: research/ssiq-batch014-reviews
    base_commit_observed: daf91ae6b
    base_commit_note: >-
      The authoring worktree was checked out at origin/main = daf91ae6b with a
      clean tree, so every input above was read from committed state. This is
      recorded as the base this record was authored against, NOT as the base the
      archive will commit onto -- the archive run must re-fetch origin/main
      immediately before staging and record the base it actually merged.
    review_reports_present_at_authoring: false
    review_reports_present_note: >-
      None of the three declared review-report paths existed when this record
      was authored, which is expected and is the whole reason this task is
      pending: the reviews had not been dispatched. Their absence now is not a
      defect; their absence at archive time is a blocker.

  constraints:
    - >-
      RUN ALONE, AFTER BOTH REVIEWS RETURN. This is a Coordinator archival task
      and it is the ONLY task touching the worktree while it runs. Do not run it
      concurrently with any producer, reviewer, or other archival task
      (AGENTS.md: workers do not commit into a shared worktree).
    - >-
      BOTH REVIEWS OR NEITHER. If either TASK-20260810-098fad's or
      TASK-20260810-971cfa's declared report paths are missing or empty, HALT
      and commit NOTHING. A half-archived review chain is worse than an
      unarchived one: it makes one reviewer's output durable and citable while
      the other's is still deniable, which is precisely the asymmetry
      independent review exists to prevent. Report the missing paths and stop.
    - >-
      STAGE EXACTLY THE FOUR PATHS IN artifact_paths AND NOTHING ELSE. `git add`
      them by explicit path; never `git add -A`, never `git add` a directory.
      A commit that changes any other file is a scope-expanding commit and the
      post-commit verifier must reject it.
    - >-
      DO NOT STAGE, AND DO NOT MODIFY: ledger/goals/GOAL-SSIQ-001/goal.yaml or
      any goal record; ledger/goals/GOAL-SSIQ-001/checkpoints/BATCH-014.yaml (or
      any other checkpoint shard); ledger/handoffs/TASK-20260810-098fad.yaml;
      ledger/handoffs/TASK-20260810-971cfa.yaml; ledger/decisions/DEC-20260810-616fd5.yaml;
      any file under experiments/EXP-SSIQ-a85692/; knowledge/INDEX.md; any
      dispatch plan. Several of these are write-once or immutable and the rest
      belong to a later task.
    - >-
      DO NOT EDIT THE ARTIFACTS BEING ARCHIVED. The two reviewers' reports are
      committed VERBATIM, including any finding that contradicts
      DEC-20260810-616fd5, any BLOCK or CHALLENGE verdict, and any criticism of
      the Coordinator's own conduct or of the archival process deviation
      PD-ARCH-BATCH-014-producer-committed. Do not correct spelling, reformat,
      summarize, soften, or reorder. An archive that edits what it archives is
      not an archive.
    - >-
      COMMIT THE RECEIPT INSIDE THE SAME COMMIT, restoring this goal's
      BATCH-013 precedent (TASK-20260806-5af708) rather than repeating
      BATCH-014's snapshot deviation. Consequently commit_sha in the receipt is
      NULL BY CONSTRUCTION -- a commit's own sha cannot appear in an artifact
      inside that commit -- and the receipt is excluded from its own
      path_sha256 map for the same reason. parent_sha IS recorded, and
      path_sha256 covers exactly the three review-report paths.
    - >-
      FABRICATE NO HASH AND NO SHA. commit_sha, parent_sha and every
      path_sha256 value are produced BY THE ARCHIVE RUN ITSELF, by reading the
      committed tree -- they are unknowable at authoring time and are left null
      in this handoff for that reason and no other. Copying a plausible-looking
      sha from another record, or estimating one, is fabrication under AGENTS.md
      rule 5, exactly as an invented run would be.
    - >-
      FETCH origin/main AND MERGE IT BEFORE STAGING; NEVER REBASE. This branch
      carries pushed research records. Record in the receipt the base commit
      checked and the merge outcome. If the merge conflicts inside a ledger
      record, a run artifact, or a knowledge entry, DO NOT resolve it by editing
      either side -- halt and write a superseding record under a new id.
    - >-
      RUN tools/validate_ledger.py AGAINST THE TREE BEFORE STAGING and record
      the error count in the receipt. Run
      tools/check_merge_hygiene.py --base origin/main (the branch-scoped form;
      the bare invocation fails on pre-existing unparseable records on main and
      is not the check being asked for).
    - >-
      PUSH THE BRANCH AND OPEN OR REFRESH THE PR NAMING THE RECORDS after the
      commit. This archive adds no new GOAL-/RQ-/IDEA-/H-/EXP-/EV-/DEC-/KN-
      record, but it does add TASK-20260811-fbf1bf and the two reviewers'
      reports, and a record that exists only in a local commit is unpublished,
      not durable evidence. The driving session runs the git and gh commands.
    - >-
      STATE NO INTERPRETATION, GRADE NO EVIDENCE, SELECT NO FORWARD BRANCH, MOVE
      NO HYPOTHESIS, CLOSE NO BATCH, MAKE NO APPROVAL DETERMINATION. See
      scope_boundary. The receipt records an archival act and its verification
      only.
    - >-
      Commit message must contain, at minimum: TASK-20260811-fbf1bf,
      TASK-20260810-098fad, TASK-20260810-971cfa, DEC-20260810-616fd5,
      BATCH-014, GOAL-SSIQ-001.

  deliverables:
    - >-
      One isolated ledger-archive commit whose diff is exactly the four declared
      artifact_paths.
    - >-
      The archive receipt at the declared archives/ path, following
      templates/research-records.md's Coordinator archive receipt schema with
      kind: ledger, committed inside that same commit.

  artifact_paths:
    - coordination/goals/GOAL-SSIQ-001/batches/BATCH-014/reviews/VAL-BATCH-014.md
    - coordination/goals/GOAL-SSIQ-001/batches/BATCH-014/reviews/TASK-20260810-098fad/validation_report.yaml
    - coordination/goals/GOAL-SSIQ-001/batches/BATCH-014/reviews/RT-BATCH-014.md
    - coordination/goals/GOAL-SSIQ-001/batches/BATCH-014/archives/TASK-20260811-fbf1bf-receipt.yaml
  artifact_paths_note: >-
    THIS LIST IS AUTHORITATIVE AND EXHAUSTIVE, and it is transcribed from the
    two review handoffs' OWN artifact_paths rather than from their deliverables
    prose. The first two are exactly TASK-20260810-098fad's declared paths; the
    third is exactly TASK-20260810-971cfa's single declared path; the fourth is
    this task's own receipt, named in the archives/ directory using the same
    <TASK-ID>-receipt.yaml convention as the batch's existing snapshot receipt
    TASK-20260810-dae7ef-receipt.yaml. There is NO validation_notes.md entry,
    deliberately -- see authoring_defect_in_an_input.

  archive:
    kind: ledger
    source_task_ids:
      - TASK-20260810-098fad
      - TASK-20260810-971cfa
    commit_sha: null
    parent_sha: null
    path_sha256: {}
    record_ids:
      - TASK-20260811-fbf1bf
      - TASK-20260810-098fad
      - TASK-20260810-971cfa
    hash_note: >-
      commit_sha, parent_sha and path_sha256 are EMPTY/NULL HERE BY
      CONSTRUCTION, not by omission: they are produced by the archive run's own
      commit and are unknowable when a handoff is authored. This subagent
      session additionally has no Bash or git access and could not compute them
      even for an existing file. No value is fabricated, estimated, or copied
      from another record. In the receipt written by the run, commit_sha stays
      null (the receipt is committed inside the commit it describes -- BATCH-013
      precedent), parent_sha is filled, and path_sha256 carries exactly three
      entries: VAL-BATCH-014.md, TASK-20260810-098fad/validation_report.yaml,
      and RT-BATCH-014.md.
    record_ids_note: >-
      A NAMED AND DELIBERATE DEPARTURE from templates/research-records.md's
      guidance that a `ledger` archive's record_ids include the EV-* and DEC-*
      ids. NO EV-* AND NO CLOSING DEC-* EXIST FOR BATCH-014, and none may be
      invented to satisfy a schema. This archive commits review reports only;
      the evidence record and closing decision are a LATER, SEPARATE ledger
      archive under its own task id, per DEC-20260810-616fd5's next_actions
      ordering. Splitting them this way is the honest option: it lets the
      reviewers' output become durable and hash-bound BEFORE anyone writes the
      evidence record that will cite it, so the evidence record is authored
      against committed text rather than against recollection. Recorded here so
      a later reader does not mistake the absent EV-/DEC- ids for a dropped
      field.

  archived_by: TASK-20260811-fbf1bf
  archived_by_note: >-
    Self-archiving, as an archival task must be: this task's own receipt is
    among its declared artifact_paths and is committed by the commit it
    describes. Every artifact in this task is assigned to exactly one archival
    task, and that task is this one.

  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  inference_note: >-
    fallback_allowed is false because this task's correctness is an exact-path,
    exact-hash, exact-diff property and a substituted backend has no license to
    improvise around a missing file or a conflicted merge; the correct response
    to either is to halt. independent_session_required is false because an
    archival commit is a Coordinator act, not a review -- the INDEPENDENCE that
    matters for BATCH-014 was required of the two reviews being archived, both
    of which carry independent_session_required: true.

  budget:
    wall_clock_seconds: 1800
    memory_gb: 2
    maximum_runs: 1
  budget_note: >-
    Every field is non-null and this handoff would be rejected by its own author
    if any were null. Sizing: 1800 s covers fetch, merge of origin/main into the
    branch, validate_ledger and merge-hygiene runs, hashing three text reports,
    one commit, one push, and one PR refresh, with headroom for a merge that
    turns out to need a superseding record instead. 2 GiB is generous for text
    hashing and git operations and nothing here builds or executes research
    code. maximum_runs is 1 because this is one commit: a second attempt after a
    verifier rejection is a NEW task with a new id, never a silent retry of this
    one, since the first attempt's partial state must be inspected rather than
    overwritten.

  completion_gate:
    - >-
      Both reviews returned and all three review-report paths exist and are
      non-empty: VAL-BATCH-014.md, TASK-20260810-098fad/validation_report.yaml,
      and RT-BATCH-014.md. If any is missing, the gate is NOT met, nothing is
      committed, and the task ends as blocked rather than as completed.
    - >-
      No file named validation_notes.md exists at any path under
      coordination/goals/GOAL-SSIQ-001/batches/BATCH-014/. If one does, the
      authoring-defect resolution failed: HALT, commit nothing, and write a
      superseding handoff declaring the actual path set.
    - >-
      Exactly one commit was made; its diff is exactly the four declared
      artifact_paths and no other file; the three archived report files are
      byte-identical to what the reviewers returned (added, not modified).
    - >-
      The receipt exists at the declared archives/ path with kind: ledger,
      source_task_ids naming both TASK-20260810-098fad and TASK-20260810-971cfa,
      commit_sha null by construction with its note, parent_sha filled from the
      real parent, and path_sha256 carrying exactly three entries computed from
      the committed tree.
    - >-
      The base commit fetched from origin/main, the merge outcome, the
      validate_ledger.py error count, and the check_merge_hygiene.py --base
      origin/main result are all recorded in the receipt.
    - >-
      The dispatcher's post-commit verifier ACCEPTS the commit against this
      task's declared paths and recorded hashes. Until it does, the reviews are
      not durable and no BATCH-014 evidence record may cite them.
    - >-
      The branch is pushed and a PR against main is open or refreshed, naming
      TASK-20260811-fbf1bf, TASK-20260810-098fad and TASK-20260810-971cfa.
    - >-
      NOTHING ELSE HAPPENED: no EV-* written, no hypothesis moved, no batch
      closed, no checkpoint shard edited, no goal record touched, no forward
      branch selected, and no verdict of the Coordinator's own stated anywhere
      in the receipt.

  return_format: >-
    Report the receipt path, the commit's parent_sha, the three per-path sha256
    values, the base commit merged from origin/main and the merge outcome, the
    validate_ledger error count, and the verifier's accept/reject result -- plus
    a one-paragraph statement of what was committed and an explicit restatement
    that the batch remains open, no evidence record exists, and no hypothesis
    moved. Report each reviewer's VERDICT STRING verbatim as a pointer to the
    committed report, with no gloss, no agreement, and no disagreement: the
    reading of those verdicts belongs to a later decision record, not to this
    archive's return. Report to the Coordinator; do not write to ledger/, to any
    run artifact, or to the checkpoint shard.
