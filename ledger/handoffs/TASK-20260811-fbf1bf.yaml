    An archive run that finds a declared review path missing does not commit a
    partial set -- see constraints.

  objective: >-
    After BOTH BATCH-014 reviews return, make ONE isolated Coordinator LEDGER
    archive commit that stages exactly the four declared artifact_paths and
    nothing else, and that passes the dispatcher's post-commit verification.
    The commit's entire content is the two independent review reports plus this
    task's own archive receipt. Its purpose is to make the review reports
    durable evidence in Git -- not a working-tree artifact and not a claim in an
    agent response -- so that the BATCH-014 evidence record and closing decision
    can later be written ON TOP of committed, hash-bound reviewer output rather
    than on recollection of it.

  uncertainty_reduced: >-
    Whether the BATCH-014 independent review output exists as durable,
    content-bound, immutable evidence at declared paths that a later reader can
    verify by hash, or whether it exists only as uncommitted working-tree text.
    Until this archive's receipt is accepted, no BATCH-014 evidence record and
    no closing decision may cite the reviews at all, because under AGENTS.md
    "Durable research commits" they are not yet durable.

  inputs:
