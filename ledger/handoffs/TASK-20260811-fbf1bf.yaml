    approve an experiment, does not grade evidence, and does not move any
    hypothesis.
  goal_id: GOAL-SSIQ-001
  batch_id: BATCH-014
  status: pending
  status_note: >-
    WRITTEN AND PENDING. This task is not runnable yet and must not be started
    until BOTH TASK-20260810-098fad (validator) and TASK-20260810-971cfa (red
    team) have been dispatched and have RETURNED their reports to the declared
