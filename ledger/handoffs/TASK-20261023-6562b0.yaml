  - experiments/EXP-ICPERF-6c546e/runs/RUN-ICPERF-d566af/instances.json
  - coordination/tasks/TASK-20261023-5301b1/review_report.yaml
  - coordination/tasks/TASK-20261023-18b489/review_report.yaml
  constraints:
  - Fresh independent xhigh session; no inherited producer conversation.
  - Do not read any blind_from path, including base benchmark analysis source or producer
    validation summaries, at any time. Recompute raw statistics independently; use
    prior committed unchanged-worker audit for that dependency.
  - No science reruns. Offline arithmetic/certificate/scratch checker controls only.
  - Own exactly J-integrity and J-inference; attest exact sources, blind_from_respected
    and known-false controls.
  deliverables: &id001
  - coordination/tasks/TASK-20261023-6562b0/review_report.yaml
  - coordination/tasks/TASK-20261023-6562b0/derivation.md
  artifact_paths: *id001
  archived_by: TASK-20261023-e0567d
  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
    delivery: interactive
    runtime_native: true
    binding_note: Use the session's explicitly resolved runtime-native binding; no
      vendor substitution or API probe is implied.
  budget:
    memory_gb: 2
    wall_clock_seconds: 3600
    maximum_runs: 0
  completion_gate:
  - Own independent raw calculation and actual refusal controls recorded; report both
    joint verdicts and limitations.
  review_plan:
    claim_under_review: Any complete-solve wall-time advantage on the held-out balanced162-worker
      grid; no successor measurements exist yet.
    coordinator_prior: Unchanged arithmetic should preserve targets and operation
      savings. Prior timings were confounded; balanced new curves may reduce, remove
      or reverse that observed wall-time contrast.
    joints:
    - joint: 'J-integrity: exact held-out grid, balanced slots, environment/affinity,
        target/relation/certificate matches and complete costs.'
      assigned_to: TASK-20261023-6562b0
      attack_plan: Inspect all raw rows and successor schedule/affinity code, verify
        source/config locks and certificates, mutate slot/target/row/config in scratch
        and require refusals. Reuse prior independent unchanged-base-worker audit
        by matching its source hash; do not read base analysis source protected from
        blind metric derivation.
      breaking_artifact: Accepted confounded/tampered input or unreconciled full-cost/certificate/environment
        boundary.
    - joint: 'J-inference: independently recomputed raw-only statistic/uncertainty
        and exact scoped conclusion.'
      assigned_to: TASK-20261023-6562b0
      attack_plan: Before producer summaries/source analysis, derive all54 ratios
        and clustered5000 seed3065 interval from raw only; check slot crossing and
        per-slot heterogeneity. Identical reference candidate must fail strict advantage.
        Assess host-load limitations without claiming process census proves isolation.
      breaking_artifact: Mismatched statistic, accepted known-false advantage, hidden
        censoring or unsupported causal scope.
    blindness:
      mutual: true
      lifted_for: []
    proves_too_much:
      objects:
      - Original always-middle candidate schedule.
      - Candidate times replaced by mean of references (strict advantage known false).
      - Wrong recovered k, target digest, missing row or environment/affinity record.
      failure_signature: Balance/certificate/config changes refused; identical-time
        data cannot qualify.
      assigned_to: TASK-20261023-6562b0
    blind_rederivation:
      required: true
      quantity: Paired geometric complete-solve speedup, A/A factor and curve-clustered
        stratified percentile interval, derived independently from the frozen definition
        and raw rows only.
      parameters: Held-out bits12/14/16, seeds3/4/5, solver seeds0/1,3 repetitions,5000
        resamples seed3065; no performance rerun.
      blind_from:
      - experiments/EXP-ICPERF-6c546e/runs/RUN-ICPERF-d566af/validation.json
      - experiments/EXP-ICPERF-6c546e/runs/RUN-ICPERF-d566af/balance-validation.json
      - experiments/EXP-ICPERF-6c546e/reports/
      - tools/ic_target_benchmark.py
      assigned_to: TASK-20261023-6562b0
    procedure_deviations: []
