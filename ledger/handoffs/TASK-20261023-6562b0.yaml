handoff:
  id: TASK-20261023-6562b0
  role: reviewer
  from: coordinator
  to: reviewer
  objective: Independently verify the held-out balanced-slot integrity and raw-only
    timing inference.
  uncertainty_reduced: Whether any apparent gain survives slot/environment controls,
    independent certificates and raw metric rederivation.
  inputs:
  - experiments/EXP-ICPERF-6c546e/specification.yaml
  - experiments/EXP-ICPERF-6c546e/trial-plan.json
  - config/ic-target-balanced-benchmark.json
  - config/ic-target-balanced-environment.json
