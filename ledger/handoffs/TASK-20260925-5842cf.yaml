    - id: CRA-3
      text: >-
        REPORT ON JOINTS. Each of AJ-0..AJ-4 carries holds | breaks |
        inconclusive with the derivation it rests on, the files and lines
        read, and what would change the verdict. An UNSATISFIABLE predicate is
        a break of AJ-1, stated as the conjunction of texts (file and lines)
        that no development world the texts permit can meet. A
        READING-DEPENDENT predicate states both readings and what each gives.
        A predicate whose failure costs only a harness re-run is a fail-closed
        finding, listed separately with its cost.
    - id: CRA-4
      text: >-
        KNOWN-ANSWER CONTROL FIRST (AJ-0). Before AJ-1 is reported as holding,
        the reviewer's satisfiability method, unchanged, must flag: (a)
        readbackcover RB-5 (d) (lines 297-300) read with RB-4 (254-274) and
        childend RG-3 (d) (391-403), under launchkind as approved and WITHOUT
        admitdev, as unsatisfiable in every development world; and (b)
        failclosed RF-4 (c) (lines 463-471) AS FIRST WORDED ("exactly the r4
