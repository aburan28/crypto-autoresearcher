    - id: CRA-6
      text: >-
        OBSERVATIONS ONLY. No approval recommendation; no statement about D,
        the quotient, H-GFPN-9a29be or HEUR-GFPN-DFLAT; a finding is never
        evidence about them. A record of the r4 stage is a FEASIBILITY
