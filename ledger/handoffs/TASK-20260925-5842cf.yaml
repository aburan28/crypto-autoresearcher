          (note section 10.4, lines 426-433) agrees.
        failure_signature: A method that does not flag these cannot support "holds" on AJ-1.
      AJ-1_satisfiability_sweep:
        reading: admitdev ADR-1 (definitions satisfiable and reading-dependent)
        claim_under_attack: >-
          With AD-1 in place, every development predicate of the successor
          stage can be met by a delivered layer that implements every rule as
          worded, in a development world the texts permit.
        worked_attack: >-
          (1) Enumerate the predicates of CRA-9, each with file and lines. For
          each state: the world it is evaluated in; the expected failures and
          missing predecessors there; whether a correct layer can meet it; a
          feasibility witness in the preserved r4 record if one exists (note
          section and line, bundle member; labelled after-the-stop where it
          is); and any reading it depends on. (2) Give most attention to: a
          predicate that requires a PRODUCTION admission or verdict (RB-4,
          RL-4, RK-3, RF-3, PASS, PASS_ZL) to come out a given way on a
          development package; an exact count taken from an r3 package (RB-5
          (c)'s 19 capped children and 8 SC-4 rows; RL-6 (e)'s 2 calls); a
          predicate that needs a toy gate package to PASS, given that the toy
          G2 at 1039 kept the SSF signature on every attempt in both r3 and r4
          stages (note O-2, lines 683-684; 8.1, lines 359-365), and whether the
          r4 note's declared failed-toy-G2 rule (D-5, lines 622-624) is within
          VA-4's DV-7 as worded; the order rule (f) (xiv) and (xv) first; RH-5
          (d). (3) AD-1 (d2): derive whether RK-4 (e) (5)'s coherent copy set
          can carry a gate image whose r4 checker exits 0 with REG-1 recorded
          PASS, and whether emptying one list without re-running the RB-2
          collector keeps every other checked field coherent; read the r4
          (i) (5) records in the extracted bundle as the witness.
        where_it_may_break: A development check that conjoins a production outcome with a development world's expected failures; a sibling clause of one already repaired.
      AJ-2_discrimination:
        reading: admitdev ADR-2 (definitions wrong_wrappers)
        claim_under_attack: W-IGNORE fails AD-1 (d1) (ii) and (d2) (ii); W-STRICT fails AD-1 (d2) (i).
        worked_attack: >-
          From the texts and the preserved r4 wrapper's admission code (read
          as text), state for each wrong wrapper which required observation of
          (d1) and (d2) it violates, and whether any other wrong wrapper (one
          that reads only the frozen checker's exit, or only the r4 items)
          passes both.
      AJ-3_neutrality:
        reading: admitdev ADR-3; failclosed RFR-1 and RFR-2 applied to the difference only
        claim_under_attack: >-
          AD-1..AD-5 change no production predicate, verdict, admission,
          computed or recorded package value, frozen byte, argv or envelope.
        worked_attack: >-
          (1) List every rule the difference touches and its scope
          (development only, or also production). (2) RFR-1 and RFR-2 on the
          difference: does AD-2 or AD-4 change any package's outcome? (3) r4
          O-1 (note lines 675-682): can a child that execs be reached by the
          ESRCH path, given the go byte (v2_solver.py, read as text), so that
          a planned basis outcome FAILs? (4) LKA-7 (b): does the RL-5
          read-back load (r4_recorder.py 475, note section 12) lie within
          "each lies in the RL-1 installation" as worded?
      AJ-4_reissue_consistency:
        reading: admitdev ADR-4
        worked_attack: >-
          Check AD-3's counts and lists against the files: eighteen hashes;
          the 204 retired ids as the union of DEC-20260924-bea197 R-8,
          DEC-20260924-1ce186 R-5 and implementation-v2-r4/minted-run-ids.txt
          (the last read from the file, the first two from the decisions),
          with no duplicate; 6 existing packages; 48 over twelve plans; ten
          forbidden task ids.

