        AJ-1 is reported inconclusive, with the reason. Keep every version of
        any script and every output it produced, each under a distinct name.
    - id: CRA-5
      text: >-
        BLINDNESS AND EXACT ARGV. Do not open the files listed under
        blindness.blind_from. Record every path actually read in the
        attestation, and every command with its exact argv. Every program the
        reviewer runs is first written to a scratch file and run by its path
