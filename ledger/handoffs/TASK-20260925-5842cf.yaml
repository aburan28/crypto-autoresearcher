    - id: CRA-2
      text: >-
        INTEGRITY FIRST. Before any joint: (a) the admitdev draft's sha256
        equals the addendum_sha256 in TASK-20260925-3bd499's receipt and it
        reads status draft, approved_by null; (b) the seventeen amendment
