handoff:
  id: TASK-20260812-300522
  from: coordinator
  to: executor
  goal_id: GOAL-ARGON-001
  batch_id: BATCH-ba7b2f
  question_id: RQ-ARGON-141710
  experiment_id: EXP-ARGON-2608c2
  hypothesis_id: H-ARGON-ef2f0b

  objective: >-
    Implement and execute the approved, frozen EXP-ARGON-2608c2 protocol:
    measure rho = |S*_real| / |S*_unif| (greedy eps-depth-reducing-set ratio)
    for the Argon2 per-lane reference-index DAG against a window-matched
    uniform-reference null, for all three RFC 9106 variants (Argon2i/d/id) at
    t in {1, 3} and q in {512, 2048, 8192} required (q=16384 optional
    stretch), gated by IDEA-20260809-bcf891's REQUIRED independent-known-family
    calibration, which must run and pass BEFORE any Argon2 graph is
    constructed.

  uncertainty_reduced: >-
    Whether RFC 9106's recency-biased within-window reference-offset
    transform (Sec. 3.4.2) produces a real, materially-sized (rho<=0.5)
    depth-robustness deficit relative to a uniform-reference null at
    RFC-adjacent toy scale, per H-ARGON-ef2f0b, or falsifies it (rho>=0.8 or
    the KS precondition fails).

  inputs:
    - experiments/EXP-ARGON-2608c2/specification.yaml (the frozen, approved contract -- read in full; this handoff restates it, never replaces it)
    - ledger/hypotheses/H-ARGON-ef2f0b.yaml
    - ledger/proposals/IDEA-20260812-318db8.yaml
    - ledger/proposals/IDEA-20260809-bcf891.yaml (the calibration design being frozen as a required precondition)
    - knowledge/literature/KN-LIT-7f3c21.md (RFC 9106 primary source -- cite directly, not as RECALLED)
    - ledger/decisions/DEC-20260812-03fa10.yaml (the reconciliation ruling that authorized this design)

  constraints:
    - >-
      Follow docs/task-lifecycle.md steps 6-7 and the run-experiment skill
      exactly: validate the frozen contract first and refuse on any missing
      field rather than improvising; implement under
      experiments/EXP-ARGON-2608c2/ (implementation.md); execute every
      planned run inside budget with one immutable directory per run
      (runs/<RUN-ID>/{manifest.yaml,command.txt,environment.json,stdout.log,
      stderr.log,raw-result.json}); fill manifests per
      docs/evidence-and-reproducibility.md; classify every non-valid outcome
      per agents/executor.md's failure taxonomy.
    - >-
      THE CALIBRATION GATE IS BINDING, PROCEDURALLY, NOT JUST NUMERICALLY: do
      not construct any G_real/G_unif graph before the calibration_exact_tier
      stage completes and calibration_error_ratio falls in [1.0, 1.5] for
      BOTH family_A_doubling_graph and family_B_pure_chain, at every
      exact_tier_size. A run set that computes a rho value before this gate
      passed is INVALID per the contract's own invalidation_rules, regardless
      of the numeric result.
    - >-
      No real password, credential, leaked corpus, or third-party dataset
      enters this experiment at any stage (GOAL-ARGON-001 binding
      constraint, inherited unconditionally). Synthetic seed material only,
      generated fresh in-run.
    - >-
      The pre-registered prediction (rho<=0.5 confirms, rho>=0.8 falsifies,
      [0.5,0.8) partial; KS p<=0.05 precondition) is FROZEN. Do not adjust it
      after any run. Report the frozen prediction reference and the
      comparison statistics only -- never a conclusion that the hypothesis is
      supported or refuted. That judgment belongs to /review-evidence under
      Coordinator authority, not to this task.
    - >-
      Report per-variant results independently. One variant confirming and
      another falsifying is a fully decidable, expected-possible, reportable
      outcome per the contract's success_criterion -- not a contradiction to
      resolve before reporting.
    - >-
      A run truncated by tool timeout, infrastructure failure, or crash
      before reaching a declared stopping point is INVALID and reported as
      failed_infrastructure, never as a negative rho or KS reading (AGENTS.md
      rule 5).
    - >-
      Write scope: experiments/EXP-ARGON-2608c2/** only (implementation.md,
      runs/RUN-*/, execution_report.md). Do not touch
      ledger/goals/GOAL-ARGON-001.yaml, ledger/hypotheses/H-ARGON-ef2f0b.yaml,
      ledger/proposals/IDEA-20260812-318db8.yaml, or any other goal's
      records. Do NOT commit -- archival is a separate Coordinator step.

  deliverables:
    - implementation.md under experiments/EXP-ARGON-2608c2/
    - >-
      One immutable runs/RUN-ARGON-2608c2-<tok>/ directory per planned run
      (calibration exact-tier, calibration greedy-tier, per-variant
      construction+KS, G_unif null construction, greedy rho compute,
      reporting), each with manifest.yaml, command.txt, environment.json,
      stdout.log, stderr.log, raw-result.json per AGENTS.md's artifact
      policy.
    - calibration_derivation.md, calibration_greedy_tier_table (per specification.yaml required_artifacts)
    - argon2i_seed_consistency_report
    - implementation_snapshot (graph-builder + greedy heuristic + exact/ILP solver source)
    - >-
      execution_report.md: the final rho table (labeled interpretable /
      uninterpretable-per-precondition per variant), calibration tables, tail
      checks, rho_vs_q_scaling_trend, and the pre-analysis validation checks
      (run count, schema validity, duplicated/missing seeds, raw/summary
      agreement, control comparability, protocol deviations) required by
      docs/task-lifecycle.md step 7.

  artifact_paths:
    - experiments/EXP-ARGON-2608c2/implementation.md
    - experiments/EXP-ARGON-2608c2/runs/
    - experiments/EXP-ARGON-2608c2/execution_report.md

  archived_by: null
  archived_by_note: >-
    To be assigned by the Coordinator when this run package reaches a
    terminal outcome. A Coordinator-only snapshot archive commits the exact
    run package and execution report before any dependent review reads it,
    per docs/task-lifecycle.md step 7a.

  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: true
    fallback_note: >-
      Policy aliases resolve to the one session model under this Claude Code
      harness (CLAUDE.md "Model policy note"); not silently substituted.
    degraded_allowed: false
    independent_session_required: false

  budget:
    wall_clock_seconds: 7200
    memory_gb: 2
    maximum_runs: 200

  completion_gate:
    - Calibration gate (specification.yaml stopping_rules, first entry) run and its outcome (pass/fail) reported before any G_real/G_unif construction.
    - >-
      If calibration passes: rho, KS statistic/p-value, and the
      precondition-interpretability label reported for every required
      (variant, t, q) cell.
    - >-
      If calibration fails: CALIBRATION FAILURE reported as the terminal
      result for the whole run set, per specification.yaml's stopping_rules
      -- not a falsification of H-ARGON-ef2f0b.
    - All required_artifacts present (specification.yaml required_artifacts list).
    - No write outside the declared write_scope; nothing committed by this task.

  return_format: execution_report YAML/markdown per docs/task-lifecycle.md step 6.
