    - 'G2: T2 carries an explicit constant C and an explicit constant in delta, with the translate-comparison step written in full or its O(w) fallback declared.'
    - 'G3: tau_0 is derived with its chain and compared against the frozen prediction (0, 1/6); a value outside the interval is reported as such, not repaired.'
    - 'G4: T3 lemmas (i)-(iii) are written; lemma (iii) states the exact AGS obligation verbatim, marked recalled/unopened or retrieved with verified_by.'
    - 'G5: the HEUR-002 (one-percent regime) obligation is stated and not claimed.'
    - 'G6: the list of join primitives not covered by T1-T3 is recorded.'
    - 'G7: the placement on the IDEA-20260829-3f0f4b surface is recorded with dominated_by and sota_delta.'
    - 'G8: NULL-1 and NULL-2 carry the expected-time-N statement and the Pareto rows carry no domination claim.'
    - 'G9: no file exists outside experiments/EXP-JPR-402649/runs/STATIC-001/ and no manifest.yaml, code, curve parameters, or sampled points exist anywhere in the package.'
    - 'G10: every external statement in the package carries provenance (recalled with verified_by null, or retrieved with verified_by).'
    - 'G11: execution-report.md is present with the inference block and the explicit statement that zero runs occurred, no code was written, and no curve was sampled.'
