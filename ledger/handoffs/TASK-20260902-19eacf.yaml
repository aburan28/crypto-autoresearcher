  uncertainty_reduced: >-
    Whether the proposal's T1-T3 survive being written in full with
    constants: whether T1's dihedral argument fails at a named step on the
    composite and XOR objects and reproduces the identity order; whether T2
    yields an explicit constant and a threshold tau_0 strictly inside
