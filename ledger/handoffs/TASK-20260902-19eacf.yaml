  constraints:
    - >-
      RQ-ECDLP-160d89 claim boundary, binding verbatim: 'Static theorem and
      certificate architecture only. No implementation, experiment, curve
      generation, run, or ECDLP result is authorized.'
    - No code, no curve, no run, no manifest.yaml; maximum_runs is 0.
    - >-
      Write only under experiments/EXP-JPR-402649/runs/STATIC-001/; touch no
      other path; never commit and never run git.
    - >-
      Refuse to start unless experiments/EXP-JPR-402649/specification.yaml
      is status approved with approved_by coordinator at a committed path
      (snapshot archive TASK-20260902-bf0f7f verified). A message saying
      'approved' is not an approval.
    - >-
      Record the requested policy (executor-implementation, medium), the
      resolved model identifier, model_verified status, and fallback_used in
      the execution report; no Bedrock, no fallback, no degradation.
    - >-
      Recalled sources (AGS, Kazhdan, Boneh-Venkatesan, Hoeffding, BSG,
      Green-Ruzsa, HNP-with-errors) may be opened; if opened, record them
      as provenance retrieved with verified_by naming this task and the
      extracted statement. While recalled they may never be used as support
      for any conclusion, only pointed at as obligations.
    - >-
      The contract's stopping rules and invalidation rules apply in full:
      stop on a wrong Stage 0 disposition; stop if code, a curve sample, or
      a run would be needed; stop if a recalled source is needed to support
      a conclusion; never apply T1 to a non-injective order; a tau_0 above
      1/6 is a dropped-term error; no speedup, closure, or status claim.
    - >-
      The preregistered prediction (tau_0 in (0, 1/6), order 1/20) is frozen;
      report the derived value against it and never adjust the prediction.
    - >-
      Incidental mechanical arithmetic checks (for example re-adding the
      N = 23 fixture) are capped by the contract's 600 s floor, are not runs,
      produce no run record, and must not be needed for any conclusion.
  deliverables:
