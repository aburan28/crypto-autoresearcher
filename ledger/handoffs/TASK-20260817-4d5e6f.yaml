handoff:
  id: TASK-20260817-4d5e6f
  from: coordinator
  to: executor
  objective: 'Execute the FROZEN, coordinator-approved contract EXP-SSI-697354: a zero-compute, stdlib-only reconstruction
    of the Wesolowski crossover locus p*(w) against the matched Delfs-Galbraith baseline from already-committed numbers (T1
    cost-measurement table, T2 paper anchor, and the declared scalars T3) producing the 12 declared artifact files under experiments/EXP-SSI-697354/runs/RUN-SSI-697354-a/
    and the implementation at experiments/EXP-SSI-697354/crossover.py. Record observations only. Make no security claim. Assert
    no status change.'
  inputs:
  - experiments/EXP-SSI-697354/specification.yaml
  - coordination/goals/GOAL-SSI-001/batches/BATCH-b3c87f/tasks/TASK-20260806-976fd5/design_report.md
  - coordination/goals/GOAL-SSI-001/batches/BATCH-046/tasks/TASK-20260804-55952a/implementation/cost_measurements.json
  - coordination/goals/GOAL-SSI-001/batches/BATCH-046/tasks/TASK-20260804-55952a/red_team_concrete_cost.yaml
  - coordination/tasks/TASK-20260724-P13-VAL/repro/experiments/EXP-P13VOW-001/cost_model.py
  - inputs/P13-WESOLOWSKI-2026/paper_fulltext.md
  - ledger/evidence/EV-SSI-59f7a2.yaml
  - ledger/evidence/EV-WESO-001.yaml
  - ledger/evidence/EV-WESO-b6ceff.yaml
  - knowledge/findings/KN-FIND-4e7a92.md
  - knowledge/findings/KN-FIND-d1c853.md
  - knowledge/techniques/KN-TECH-050.md
  - docs/claims-and-verification.md
  - AGENTS.md
  constraints:
  - Follow experiments/EXP-SSI-697354/specification.yaml EXACTLY; it is frozen.
  - Primary path is standard-library ONLY. numpy may appear solely as the OPTIONAL secondary cross-check XCHK-2; if absent,
    record NOT_RUN with the ImportError text and leave every reported number unchanged. NO sagemath/sage/g6k/fpylll/scipy/mpmath;
    NO network access. An import of any forbidden module INVALIDATES the run.
  - Evaluation window log2 p in [256, 768] is a HARD boundary (refused, not extrapolated). Evaluation outside the window returns
    ROOT_OUTSIDE_WINDOW with direction; no numeric value is emitted.
  - 'RG-REPRODUCTION-GATE (RG-1..RG-5) is evaluated FIRST; on any assertion failure the run emits the gate report and stops
    (F1: run invalid).'
  - Both null arms run through the IDENTICAL code path with only E(.) swapped; a separate solver is forbidden. Both nulls
    are required by the batch handoff.
  - No sentence from claim_ceiling.forbidden_sentences appears in any artifact. No cost number appears without its memory
    requirement and Heuristic-1 conditionality in the same sentence. Claim tier stays medium; this is NOT a security claim.
  - Exactly one run; seed 0; deterministic. A re-run must be byte-identical apart from timing fields.
  - H-SSI-7fe2bf stays proposed; no hypothesis or experiment or goal status change. No C1/C2 statement. No ML-KEM/QI security
    statement.
  - 'The run must not perform or claim to resolve any of specification.yaml''s what_this_is_not clauses: no isogeny, no curve,
    no field element, no walk, no table is constructed at any scale.'
  deliverables:
  - experiments/EXP-SSI-697354/crossover.py
  - experiments/EXP-SSI-697354/runs/RUN-SSI-697354-a/ (the 12 declared artifact files per specification.yaml required_artifacts
    list, plus the execution_report.yaml the executor returns)
  - coordination/goals/GOAL-SSI-001/batches/BATCH-5a3d0a/tasks/TASK-20260817-4d5e6f/runtime-session-receipt.json
  artifact_paths:
  - experiments/EXP-SSI-697354/crossover.py
  - experiments/EXP-SSI-697354/runs/RUN-SSI-697354-a/
  archived_by: TASK-20260817-a1b2c3
  inference:
    policy: executor-implementation
    reasoning_effort: medium
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
    reasoning_effort_basis: Bound by .claude/agents/executor.md effort medium and orchestration/roles.yaml role executor ->
      default_policy executor-implementation -> reasoning_effort medium. Bounded, spec-following implementation work (reuse
      an already-frozen contract against 4480+ cells, run once); not design or ideation. Matches CLAUDE.md's model-policy
      table.
  budget:
    wall_clock_seconds: 3600
    memory_gb: 1
    maximum_runs: 1
  completion_gate:
  - specification.yaml frozen values (T1 rows, T2 columns, scalars T3, per-entry laws, the two MC formulations, the window
    256 to 768) are re-read and re-extracted; any input mismatch INVALIDATES the run as input drift
  - RG-1..RG-5 all pass and their per-law residuals are listed in bits; the run STOPS before any curve is computed if any
    RG fails
  - XCHK-1 (the second, independently written expression path for RG-1) agrees to within 1e-12
  - MONO-1,2,4,5 pass; MONO-3 returns a verdict or an explicit NOT_EVALUABLE(n=count), never a vacuous pass
  - both null arms N0 and N1 have run through the identical code path; D_null0 and D_null1 are reported with min, max, argmin,
    argmax, and per-P profiles; locus displacement between corrected and each null is reported
  - p_star_table is complete over all 4480 main cells and the 2240 null-arm cells; every cell has its declared categorical
    label; the 14 declared log2 w values are all used
  - every emitted p* lies in 256 to 768; a root outside the window is emitted ROOT_OUTSIDE_WINDOW with direction and no numeric
    value is reported
  - every emitted number carries fit_window_extrapolation true and extrapolation_ratio equal to P/40 in the range 6.4 to 19.2;
    a non-committed P is stamped interpolated_between_committed_rows with the two bracketing T2 rows named
  - undefined_segments.json, input_hashes.json, and environment.json are all present; environment.json records module presence/absence
    for numpy, sage, g6k, fpylll, scipy, mpmath, plus the no-forbidden-import assertion
  - cross_check_secondary.json is XCHK-2's result or NOT_RUN with the ImportError text
  - SCOPE-A, SCOPE-B, and SCOPE-C are reported separately with the axis name; the adversarial corner (S_struct=0.0, A=-1.736966,
    c=0.0, MC=MC_P13, log2_k_DG=0) is reported explicitly
  - the run manifest binds git commit, dirty flag, seed 0, environment, timing, and resources, per docs/evidence-and-reproducibility.md
