handoff:
  id: TASK-20260823-80125f
  from: coordinator
  to: red-team
  resume_of: TASK-20260822-87c429
  objective: >-
    RESUME of TASK-20260822-87c429, which FAILED on infrastructure (final
    synthesis turn truncated at the zai route's 32000-token output ceiling
    after 16 protocol-conform steps; recorded in DEC-20260822-d7c2d0 F-4;
    tier PAUSED under the committed amendment's own fallback clause). Execute
    the UNEXECUTED joints of review-plan-87c429.yaml: R1 (does the
    distribution separate seed-lottery from construction-defect from
    model-defect at the routing granularity, with both proves-too-much
    controls), R2 (is the RC-4 static mask-survival argument sound, with its
    two proves-too-much objects), R3 (is the cost model honest and the
    routing granularity adequate), plus the blind re-derivation of the
    injectivity threshold (1-eps)*2^k at both 32-bit and window/12-bit
    resolution. Produce the red-team report. No other work is in scope: the
    validator's joints V1-V4 have final verdicts and are not re-adjudicated.
  inputs:
  - >-
    the frozen review plan (joints R1-R3, proves-too-much objects,
    blind_from declaration, coordinator prior) at
    coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/review-plan/review-plan-87c429.yaml
  - >-
    the object under review, as frozen by the snapshot receipt at
    coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/archives/TASK-20260822-b325fe/snapshot-receipt.json
    and the bound paths (harness/run_md4_seed_sweep.py sha256
    4aa7b6f0c5d5c7883a463aebc9f49edf8581e64ad1bf4eeee4fa78b34a2b0fe9; the run
    directories under coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/tasks/TASK-20260822-767bb1/runs/;
    the execution report at coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/tasks/TASK-20260822-767bb1/execution-report.yaml)
  - >-
    the frozen criterion statement with declared k and eps (blind
    re-derivation input) at ledger/decisions/DEC-20260822-40bf14.yaml
    (next_actions item 3(a))
  - >-
    the batch-4 ANOM-1 S=9 object (proven independent of free word9; known
    verdict, zero discriminating power over word9) at
    coordination/goals/GOAL-MD5-001/batches/BATCH-af29f6/tasks/TASK-20260821-de817d/execution-report.yaml
    and its runs/ raw results; the blind proof is knowledge/techniques/KN-TECH-bb7e9f.md
  - >-
    the batch-5 package (the CTL-PO5(b) object, known collapse for a reason
    the mask argument does NOT name; source of the declared k) at
    coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/tasks/TASK-20260821-372d67/
    (execution-report.yaml, gate decision at ../TASK-20260821-fad775/gate-decision.yaml,
    runs/RUN-MDFIVE-b5-gate_and_controls/)
  - >-
    the RC-5 null objects (non-multiplexer mixer, same shape; known
    NON-collapse) at
    coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/tasks/TASK-20260822-767bb1/runs/RUN-MDFIVE-b6-null-md4-prod
    and RUN-MDFIVE-b6-null-md5-prod
  - >-
    the frozen experiment contract with declared ceilings (R3 cost model) at
    experiments/EXP-MDFIVE-8f0fe3/specification.yaml
  - the RFC 1320 (MD4) and RFC 1321 (MD5) standard step schedules (public standard; blind-re-derivation input)
  constraints:
  - >-
    ORDERING (the blindness protocol). PHASE 1 first. Re-derive the
    injectivity threshold count (1-eps)*2^k at BOTH 32-bit and window/12-bit
    resolution working ONLY from the frozen criterion statement
    (DEC-20260822-40bf14 next_actions 3(a)), the declared k, the declared eps,
    and the RFC 1320/1321 step schedules. Write the derivation to
    coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/reviews/TASK-20260823-80125f/blind-rederivation.yaml
    BEFORE reading any producer artifact listed in blind_from. PHASE 2 only
    then. Read the package under review and the known-verdict objects and
    execute R1, R2, R3.
  - >-
    blind_from (PHASE 1 must not have read these). harness/run_md4_seed_sweep.py;
    the run manifests under
    coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/tasks/TASK-20260822-767bb1/runs/;
    the producer's notes and execution report
    (coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/tasks/TASK-20260822-767bb1/execution-report.yaml
    and derived-analysis-b6.json). The batch-5 construction instrument is NOT
    blind_from (it is the source of the declared k and a different producer's
    record); the batch-4 and batch-5 reports are inputs from PHASE 2.
  - >-
    sibling-blind. Do NOT read
    coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/reviews/TASK-20260822-40389d/
    or coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/reviews/TASK-20260822-7f5ed3/
    (the validator's reports, including the V1 completion report). The
    Coordinator's prior is available ONLY as recorded in the review plan (it
    was written before any reviewer ran).
  - >-
    Do NOT read ledger/decisions/DEC-20260822-d7c2d0.yaml or
    ledger/evidence/EV-MDFIVE-b0def7.yaml. They are post-review Coordinator
    compositions; your reading of the distribution shape and the prior's fate
    must be yours.
  - >-
    Never read coordination/goals/GOAL-MD5-001/quarantine/ (isolation clause;
    its integrity rests on the snapshot receipt pre-freeze check and the
    non-reading attestations).
  - >-
    Write ONLY under
    coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/reviews/TASK-20260823-80125f/
    (your task directory. Report, re-derivation, working scripts and
    intermediate results). Never write into the archived run directories or
    any other task's directory (run records are immutable; a clobbered raw
    artifact is an evidence-integrity failure).
  - >-
    Claim ceiling, analyzed. You challenge and adjudicate; you do not
    promote. A proves-too-much control that fails is a first-class finding to
    be reported as such, not an error state; a criterion that passes its
    controls is still not proof (rules 4 and 6).
  - >-
    Inference provenance. Record in the report the requested policy
    (review-adversarial) and the declared model and effort (gpt-5.6-sol,
    xhigh) as given by this contract, and state that the authoritative
    session-level provenance is the run receipt written by the Coordinator
    after the run. Do NOT self-describe the runtime (the mis-description
    defect recorded in DEC-20260822-d7c2d0 F-6 must not repeat).
  deliverables:
  - >-
    coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/reviews/TASK-20260823-80125f/blind-rederivation.yaml
    (PHASE 1 output, written before any blind_from read). The derivation of
    (1-eps)*2^k at both resolutions from the frozen criterion statement +
    declared k + declared eps + RFC schedules alone, with the resulting
    integer thresholds and every arithmetic step.
  - >-
    coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/reviews/TASK-20260823-80125f/red-team-report.yaml
    with the red_team_report envelope (id, task_id, batch_id, goal_id,
    review_plan, snapshot_reviewed, role, verdict, verdict_one_line,
    claim_under_review); the blind_rederivation block (quantity, derived_from,
    ordering_attestation, the two derived thresholds,
    agreement_with_the_records_claim); per_joint_verdicts for R1, R2, R3
    (SOUND / OVERTURNED / INCONCLUSIVE each, with worked reasoning); the
    proves_too_much block (method, per-object results for the three objects,
    the explicit failure_signature test); coordinator_prior_comparison (the
    plan's falsifiable prediction vs what the distribution shows, the MD5
    limb assessed on its own numbers); a review_attestation block (task_id
    TASK-20260823-80125f, the exact list of paths read, explicit non-reading
    of the two validator report directories and the quarantine, the PHASE
    1/PHASE 2 ordering attestation); the inference block; and the stop reason.
  artifact_paths:
  - coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/reviews/TASK-20260823-80125f/blind-rederivation.yaml
  - coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/reviews/TASK-20260823-80125f/red-team-report.yaml
  archived_by: TASK-20260823-297ba4
  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 2400
    memory_gb: null
    maximum_runs: 1
  completion_gate:
  - both deliverable files exist and parse as YAML; the report carries the attestation, provenance, and stop-reason blocks
  - blind-rederivation.yaml exists and its ordering_attestation states it was completed before any blind_from read; the two derived thresholds are integers
  - each of R1, R2, R3 carries a verdict with worked reasoning; each of the three proves-too-much objects carries an outcome; the failure_signature test is stated explicitly
  - the attestation lists every path read and names the two sibling report directories and the quarantine as NOT read
  - no file outside coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/reviews/TASK-20260823-80125f/ was created or modified (Coordinator verifies by git status after the run)
  review_plan:
    claim_under_review: >-
      Carried over unchanged from review-plan-87c429.yaml. BATCH-ebac02
      phase 1 -- the RC-1 fixed-word-seed distribution (>=100 seeds, MD4 and
      MD5, 32-bit and 12-bit resolution, CTL-PO5 raw candidate count) and the
      RC-4 static (y XOR z) mask check, frozen by the TASK-20260822-b325fe
      snapshot receipt, and the routing answer (seed vs criterion vs
      construction) derived from them.
    coordinator_prior: >-
      Carried over unchanged from review-plan-87c429.yaml (recorded before
      any reviewer ran). The 12-bit distinct_fwd distribution is expected to
      concentrate at the LOW end (mass on 1..a small constant, far below
      (1-eps)*2^12), i.e. the collapse is NOT a seed lottery; the
      F-multiplexer mask kills the free word's varying bits (the RC-4
      mechanism), not the seed choice. Falsifiable prediction. If >= 50% of
      the >= 100 seeds reach the declared injectivity threshold at 12-bit on
      EITHER primitive, the batch-5 single-seed negative was a seed lottery,
      the construction is salvageable by seed re-draw, and the routing answer
      flips to SEED -- that outcome OVERTURNS the prior and is a first-class
      result to be reported as such rather than absorbed.
    joints:
    - joint: R1
      assigned_to: TASK-20260823-80125f
      attack_plan: >-
        proves-too-much controls. Apply the same criterion to the
        known-collapsed ANOM-1 S=9 object (batch 4; must be flagged
        collapsed) and to the known-good null mixer (RC-5; must pass). If it
        flags neither or both, the routing answer is void. Then check the
        reported distribution's shape and its confidence at n>=100 against a
        seed-lottery model at the declared tolerance.
    - joint: R2
      assigned_to: TASK-20260823-80125f
      attack_plan: >-
        proves-too-much. Run the identical (y XOR z) mask argument on the
        ANOM-1 S=9 construction, where the conclusion (zero discriminating
        power over word9) is KNOWN TRUE from the blind proof
        (KN-TECH-bb7e9f). The argument must reproduce it from the mask alone;
        if it needs anything beyond the mask, it is not the general predictor
        its claim requires. Then check against the batch-5 CTL-PO5(b) object
        (bits survive the mask, collapse for an unrelated reason) to verify
        the argument is stated as necessary-not-sufficient, or the report
        overclaims.
    - joint: R3
      assigned_to: TASK-20260823-80125f
      attack_plan: >-
        cost model. Compare the declared ceilings (120 s per sweep run)
        against the wrapper-measured wall-clock in the run manifests. A
        seconds claim resting on the ceiling with the actual time unreported
        is a misstatement. Verify the deadline was armed (term f) and would
        have fired on a 10x slowdown. Granularity. If the distribution is,
        say, a 60/40 split between two shapes, does the routing decision
        (seed vs criterion vs construction) actually change at that
        confidence, or is the honest output inconclusive-at-n=100 with a
        recommended n=X.
    proves_too_much:
      objects:
      - >-
        ANOM-1 S=9 construction (batch 4). The conclusion "zero
        discriminating power over free word9" is KNOWN from the blind proof;
        the criterion and the (y XOR z) mask argument must both reproduce it,
        and if they do not, the instruments are not measuring what they claim.
      - >-
        RC-5 null object (non-multiplexer mixer of the same shape). Known
        NON-collapse; the criterion must pass it and the mask argument must
        not flag it.
      - >-
        batch-5 CTL-PO5(b) object. Known collapse for a reason the mask
        argument does NOT name; tests that the mask argument is stated as
        necessary-not-sufficient.
      failure_signature: >-
        If the criterion flags neither the known-collapsed ANOM-1 object nor
        the known-good null mixer, or attributes the CTL-PO5(b) collapse to
        the mask, the routing answer derived from the distribution is void
        and the report must say so.
    blind_rederivation:
      required: true
      quantity: >-
        the injectivity threshold count (1 - eps) * 2^k at BOTH 32-bit and
        window/12-bit resolution, for the declared eps and the declared k of
        the batch-5 construction
      assigned_to: TASK-20260823-80125f
      blind_from:
      - harness/run_md4_seed_sweep.py
      - the run manifests under coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/tasks/TASK-20260822-767bb1/runs/
      - the producer's notes and execution report (execution-report.yaml, derived-analysis-b6.json)
    escalation_triggers:
    - >-
      any finding that the distributions were produced by code other than the
      snapshot-bound module (fingerprint mismatch), or that a seed list is
      shorter than declared, escalates to review-breakthrough handling of
      the affected claim
