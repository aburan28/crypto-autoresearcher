    claim_under_review: For p in {101, 211, 401, 809, 1601, 3203, 6421, 12809}, random y^2 = x^3 + a x + b over
      F_p, and r in {2, 3} random points lifted to symmetric integer representatives with the Weierstrass model
      fitted through them, the exact search for sum m_i P~_i = O with max |m_i| <= 6 finds no relation in any of
      100 trials per cell on either seed (dependence_rate_overall = 0, upper 95 percent bound below 0.002), while
      the planted control P~_2 = [2] P~_1 is detected in every one of 24 controls. The lifted points have naive
      log-height about 0.7 log p.
    coordinator_prior: I expect the near-zero dependence rate to hold, the single relation at p = 101 to be a known
      small-p coincidence, and the sampler's silent y != 0 restriction to be the main interpretation issue. This
      is a prior, not an outcome.
    joints:
    - id: R1
      joint: 'The measurements support H-CZLIFT-cb95b8 and the xedni-style obstruction: naive lifts of random points
        are independent with overwhelming probability.'
      assigned_to: TASK-20261023-62eb31
      attack_plan: Take the validator's finding that the sampler never draws y = 0 (a literal random-point reading
        gives a rate near 0.006, between the thresholds) and decide which reading the hypothesis meant and whether
        the claim must be restated. Check that 'independent within |m| <= 6' supports the obstruction claimed in
        RQ-CZLIFT-b9f765 and the xedni literature cited (Silverman-Suzuki, Jacobson-Koblitz-Silverman-Stein-Teske);
        flag recalled citations.
      breaking_artifact: A reading under which the claim fails, or a cited result that says something different.
    - id: R2
      joint: The relation search has the power to see the dependencies an attacker would use.
      assigned_to: TASK-20261023-62eb31
      attack_plan: Compare the coefficient bound 6 with the coefficient sizes an index-calculus or xedni attack
        would need; decide what the bound excludes and what it cannot.
      breaking_artifact: A dependence regime an attacker needs that the search cannot reach.
    blindness:
