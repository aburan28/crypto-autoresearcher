handoff:
  id: TASK-20260907-4a304a
  recorded_at: '2026-09-07'
  from: coordinator
  to: executor
  role: executor
  question_id: RQ-RELN-61638a
  hypothesis_id: H-RELN-427bfd
  experiment_id: EXP-RELN-141a86
  review_required: true
  phase: stage0a_only
  objective: >-
    Execute STAGE 0a ONLY of the frozen, APPROVED contract EXP-RELN-141a86
    version 1 (experiments/EXP-RELN-141a86/specification.yaml; status
    approved, approved_by coordinator, execution_authorized true, per
    DEC-20260907-93a502): with ZERO measured data read, produce
    candidate-list.yaml (the 19-entry candidate list of H-RELN-427bfd's
    candidate_invariants, each with its expression and canonical node
    count per the contract's node_counting_rule), grammar.yaml (operators,
    leaf sets by pack, node rule, C_max=12, tie-break seed 20260906),
    environment.lock.json (the PySR/Julia/SymbolicRegression.jl pinning --
    if PySR is not installed in this environment, record that explicitly
    and note the secondary engine is unavailable; do not guess a version),
    the control closed-form tables the contract's Stage-0a note requires,
    and candidate-list-hash.txt (sha256 over candidate-list.yaml +
    grammar.yaml + environment.lock.json concatenated in that exact
    order). THEN STOP. Per the contract's own stopping_rules ("Stop after
    Stage 0a and wait for the Coordinator snapshot archive... Stage 0b may
    not read a measured table before that archive is verified"), do NOT
    proceed to Stage 0b or read any of the FB3/DREG/sibling-enumeration
    tables in this dispatch. A continuation handoff for Stage 0b onward
    will follow after the Coordinator archives these files.
  uncertainty_reduced: >-
    Whether the frozen dual-engine pipeline (exhaustive grammar search plus
    optionally-pinned PySR) and its 19-entry candidate list can be
    correctly instantiated and hashed before any measured data biases it --
    this is a pure freeze-and-hash step, not a measurement.
  inputs:
    - experiments/EXP-RELN-141a86/specification.yaml (the frozen, approved contract; the ONLY protocol)
    - ledger/hypotheses/H-RELN-427bfd.yaml (the 19-entry candidate_invariants list to transcribe into candidate-list.yaml)
    - ledger/questions/RQ-RELN-61638a.yaml
    - ledger/proposals/IDEA-20260906-1f6bfe.yaml
  constraints:
    - >-
      FROZEN CONTRACT. Any needed change to the grammar, node-counting
      rule, complexity cap, or candidate list is a versioned
      protocol_amendment under experiments/EXP-RELN-141a86/amendments/ to
      the Coordinator -- NEVER an inline edit of specification.yaml or of
      candidate-list.yaml after this stage archives.
    - >-
      ZERO MEASURED DATA IS READ IN THIS DISPATCH. Do not open any FB3
      raw-result.json, any EV-DREG file, any EXP-RELN-f202be run artifact,
      or any EXP-RELN-82f487 table. This stage produces only the frozen
      instrument definition and its hash.
    - >-
      environment.lock.json: if PySR/Julia are unavailable in this
      execution environment, record `pysr_available: false` and the reason
      honestly; the contract's secondary_engine.pinning clause already
      anticipates this ("If the pinned release cannot be installed in the
      run environment, the same applies [failed_infrastructure for the
      PySR arm]") -- the primary exhaustive-grammar engine stands alone in
      that case, which is an acceptable and anticipated outcome, not a
      blocker for Stage 0a itself.
    - >-
      RUN RECORD must be immutable under
      experiments/EXP-RELN-141a86/runs/RUN-RELN-141a86-stage0a/ with a
      manifest.yaml (top-level key `run:`, fields id, experiment_id,
      status, code {commit, dirty, command}, environment, inputs, timing,
      result -- result.certificate.kind: none for this pure-freeze stage),
      command.txt, environment.json, stdout.log, stderr.log, and
      raw-result.json. WRITE manifest.yaml DIRECTLY, not manifest.json:
      tools/validate_ledger.py's check_run only discovers manifest.yaml,
      and a sibling experiment's executor lost a whole run package to this
      exact gap and had to be repaired afterward.
    - >-
      A TIMEOUT, crash, or PySR/Julia installation failure is
      failed_infrastructure for the affected arm and is never a result
      (AGENTS.md rule 3).
    - ZERO INTERPRETATION. No conclusion, no ledger write, no status change.
    - >-
      IMPLEMENTATION PATH: experiments/EXP-RELN-141a86/source/ per the
      contract's required_artifacts list (grammar_engine.py,
      constant_fit.py, pysr_harness.py at minimum for this stage),
      hash-pinned by commit in the run manifest.
  write_scope:
    - experiments/EXP-RELN-141a86/runs/RUN-RELN-141a86-stage0a/
    - experiments/EXP-RELN-141a86/source/
  artifact_paths:
    - experiments/EXP-RELN-141a86/runs/RUN-RELN-141a86-stage0a/
    - experiments/EXP-RELN-141a86/source/
  archived_by_note: >-
    The Coordinator snapshot-archives candidate-list.yaml, grammar.yaml,
    environment.lock.json, the control closed-form tables, and
    candidate-list-hash.txt in a SEPARATE later commit before any Stage-0b
    dispatch; this handoff does not perform that archive.
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 600
    memory_gb: 2
    maximum_runs: 1
  contract_budget_envelope:
    wall_clock_seconds_per_run: 21600
    total_cpu_hours: 40
    maximum_memory_gb: 16
    maximum_runs: 8
    maximum_workers: 4
  completion_gate:
    - >-
      candidate-list.yaml (19 entries with expression and canonical node
      count), grammar.yaml, environment.lock.json (or an honest
      pysr_available: false record), the control closed-form tables, and
      candidate-list-hash.txt all present and consistent (the hash file
      actually hashes the three inputs in the stated order and order).
    - No measured table read; no Stage 0b work performed.
  review_reservation: >-
    This stage is not itself claim-relevant (it reads no data), but the
    hash it produces gates every later claim per the contract's
    ordering_control: a candidate-list, grammar, or environment hash that
    does not match the archived Stage-0a files invalidates Stage 1 and 2.
