handoff:
  id: TASK-20260801-809
  from: coordinator
  to: validator
  objective: >-
    Independently verify the committed BATCH-004 producer package as TWO SEPARATE
    and SEPARATELY REPORTED checks whose verdicts are kept physically separate and
    are never merged, averaged or carried across: (a) the OD-4 branching-bound
    attempt — its pre-screen, its derivation or its argued absence of a bound,
    and, IF A BOUND IS STATED, its four-gate package; (b) the OD-3 screen and the
    D-705-5 hole (ii) quantifier computation. The BATCH-002 and BATCH-003
    precedent is binding: a sound derivation does not validate an unsound screen,
    and a defect in one group does not touch the other. Issue NO combined verdict.
  uncertainty_reduced: >-
    Whether the batch's only exponent-relevant output survives independent
    scrutiny: whether any stated lower bound on B actually FOLLOWS from a
    decomposition that assembles under honest per-attempt-cost x
    inverse-success-probability bookkeeping, or is a qualitative statement dressed
    as a cost inequality; whether every conditional dependence is really numbered
    and really paired with a validation experiment; and, if no bound was produced,
    whether the named breaking step is the RIGHT step and the closure meets the
    section 4 standard rather than the fatigue standard. And whether the
    pre-screen was applied honestly rather than used as a reason not to work.
  inputs:
    - The verified TASK-20260801-808 snapshot receipt
    - The committed TASK-20260801-806 artifacts
    - The committed TASK-20260801-807 artifacts
    - >-
      DEC-20260731-026 (its structural ruling, its dispositions, and its
      statement of the four promotion gates), DEC-20260731-028, EV-AES-003,
      KN-FIND-028 and KN-FIND-029
    - >-
      PROP-701-I and Proposition 801-1 as committed at snapshots ebac9ba8 and
      e2f8facb, read-only, together with the BATCH-003 defect V-804-1 (a control
      that discriminates without isolating the property it names)
    - >-
      protocol-amendment-GOAL-AES-001-004, in particular Part B's four artifact
      classes
    - GOAL-AES-001 and RQ-AES-001 scope, claim-tier ceiling and network policy
  constraints:
    - >-
      Read only COMMITTED artifacts. The TASK-20260801-808 snapshot receipt must
      verify against Git — reachable from HEAD, expected parent, exactly the
      declared paths, matching hashes — before any finding is recorded. If it
      does not, STOP and report an evidence-integrity failure.
    - >-
      TWO SEPARATE VERDICTS, PHYSICALLY SEPARATE. Check (a) in
      od4_bound_review.md, check (b) in od3_and_hole_ii_review.md.
      validation_report.yaml carries them side by side with NO combined verdict.
      Issue no overall grade.
    - >-
      CHECK (a), THE PRE-SCREEN FIRST AND IN BOTH DIRECTIONS. Verify that
      prescreen_od4.json was frozen before the derivation as far as the committed
      bytes permit, that every candidate carries a verdict, and that no
      IN_SCOPE_VACUOUS candidate was pursued. THEN AUDIT THE SCREEN ADVERSARIALLY
      IN THE OTHER DIRECTION: for each candidate killed, check whether the
      interface constant claimed for it is CORRECT, or whether a legitimately
      in-scope line of work was discarded on an inflated constant. Premature
      closure is a failure mode symmetric with overclaiming
      (docs/inventor-protocol.md), and a screen whose purpose is to decline work
      early can fail by declining too much. Report both directions.
    - >-
      CHECK (a), THE MATHEMATICS IS THE HIGH-STAKES ITEM AND MUST BE WORKED, NOT
      READ. If a bound on B is stated, work every lemma and the assembly step by
      step as TASK-20260731-705 worked PROP-701-I's three steps and
      TASK-20260801-804 worked Proposition 801-1's four. State explicitly whether
      the bound FOLLOWS, is OVERSTATED, or does not follow, and identify
      precisely where B > 1 enters and what it costs. In particular check the
      ASSEMBLY: does the main statement actually multiply a per-attempt cost by
      an inverse success probability, with both named, or does it assert a cost
      inequality that its lemmas do not deliver? A qualitative statement wearing
      a cost inequality's clothing is the specific defect to look for.
    - >-
      CHECK (a), IF NO BOUND WAS PRODUCED, JUDGE THE CLOSURE AND NOT THE OUTCOME.
      A clean, argued "no such bound follows" is a COMPLETE AND VALUABLE OUTCOME
      and is not a failing verdict. Verify instead that the NAMED BREAKING STEP
      is the right step — re-derive it yourself and say whether B > 1 breaks
      where the producer says it breaks or somewhere else — and that the report
      meets the section 4 closure standard (named obstruction, argument, forward
      guidance) rather than the fatigue standard. The failure mode to look for is
      a closure asserted without an argument, not a bound that honestly did not
      materialise.
    - >-
      CHECK (a), THE FOUR GATES, INDEPENDENTLY ASSESSED. If a bound is stated,
      return your OWN per-gate assessment: (1) is the proof genuinely decomposed
      into single-responsibility lemmas, and does the assembly carry explicit
      per-attempt-cost x inverse-success-probability bookkeeping; (2) is EVERY
      conditional dependence numbered and formally stated, and is each paired
      with archived validation evidence or a validation-experiment specification
      concrete enough to dispatch — name any unnumbered assumption you find,
      which is the highest-value defect available in this check; (3) does the
      concrete-cost table honestly account for hidden overhead, memory,
      time-memory tradeoffs and parallelization, are optimistic assumptions
      individually flagged, and is the affected-vs-safe scope statement present
      and correct; (4) record that gate (4) is satisfied by YOUR review together
      with the TASK-20260801-810 red team and by nothing the producer did. Where
      a gate is not met, NAME THE GATE. Do not recommend promotion: that is the
      Coordinator's transition.
    - >-
      CHECK (b), THE COMPUTATION IS RE-EXECUTED, NOT READ. Rebuild the
      reachable-set computation for u_k from your OWN arithmetic, taking no code
      or constants from the producer, over the same named families of structured
      subsets S, and report your own numbers. Any discrepancy with the producer's
      figures is a defect and is reported as one. Confirm the predicted behaviour
      was pre-registered before measurement as far as the committed bytes permit.
    - >-
      CHECK (b), THE NOVELTY SCREEN. Independently assess each set-valued
      candidate the producer admitted: does it in fact avoid reducing to a
      coordinate-wise sum or a single-byte multiset, or is it a rediscovery of
      the integral or DS-MITM family in new notation? A candidate wrongly
      admitted is a serious defect. Note at the point of use that any family
      identification is UNVERIFIED-FROM-MEMORY and that novelty against the
      external literature is unresolvable in this environment; do not resolve it
      by assertion.
    - >-
      CHECK (b), THE ANALOGUE. Confirm that every reading from a scaled-down
      field is identified AS an analogue, that no transfer to GF(2^8) or to AES
      is asserted without an argument, and that the argument for or against
      transfer is present. A toy reading presented as evidence about the cipher
      is the failure to look for.
    - >-
      SUPERSESSION AND IMMUTABILITY. Confirm by `git diff --name-status` that no
      BATCH-001, BATCH-002 or BATCH-003 committed artifact was modified in place,
      and that each new file names what it supersedes if anything.
    - >-
      STAND-DOWN AUDIT. Confirm that NEITHER producer performed mutation-control
      repair, escape enumeration or any instrument work, which DEC-20260731-026
      stood down and the BATCH-004 queue excludes. Report any instance as a scope
      violation.
    - >-
      PROVENANCE AUDIT, PER ARTIFACT CLASS. Confirm every one of the eight
      producer artifacts carries a filled inference block; that each SOURCE-CODE
      artifact carries the comment-block stanza; that each MACHINE-READABLE
      MANIFEST carries a first-class inference block and a complete
      artifact_provenance list; that each PROSE REPORT carries EITHER an in-text
      block OR a manifest pointer, both being equally compliant under Part B; and
      that every asserted digest matches the committed bytes you recompute.
      Report any gap as a completion-gate defect. Record your OWN inference
      block, and state plainly that under the 0137a051 amendment your
      independence is in SESSION and NOT in MODEL, and that this blocks any
      goal-closure attestation from your session.
    - >-
      Every literature statement you make is UNVERIFIED-FROM-MEMORY and must be
      marked as such at the point of use. Two agreeing recollections are not a
      citation.
    - >-
      Do not repair, edit, extend, or re-run producer artifacts to make them
      pass. Defects are reported, not fixed. Write only under this task's own
      directory.
    - >-
      Change no official state. Propose no hypothesis status, create no ledger
      record, promote nothing to knowledge, and assign NO evidence strength —
      those are the Coordinator's transition in TASK-20260801-811.
    - >-
      Distinguish absence of evidence from impossibility, and infrastructure
      failure from mathematical result (AGENTS.md rule 5). Everything here is TOY
      SCALE and none of it is crypto-scale evidence.
  deliverables:
    - validation_report.yaml
    - od4_bound_review.md
    - od3_and_hole_ii_review.md
  artifact_paths:
    - coordination/goals/GOAL-AES-001/batches/BATCH-004/tasks/TASK-20260801-809/validation_report.yaml
    - coordination/goals/GOAL-AES-001/batches/BATCH-004/tasks/TASK-20260801-809/od4_bound_review.md
    - coordination/goals/GOAL-AES-001/batches/BATCH-004/tasks/TASK-20260801-809/od3_and_hole_ii_review.md
  archived_by: TASK-20260801-811
  inference:
    policy: validator-independent
    requested_policy: validator-independent
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
    standing_basis: >-
      inference-amendment commit 0137a051eb5828789eb267fa83c8278086578d4c. This
      session supplies independence in SESSION and NOT in MODEL. Nothing it
      produces may be treated as a closure attestation, and its agreement with
      the producers, with the TASK-20260801-810 red team and with the Coordinator
      is CORRELATED rather than independent confirmation.
  budget:
    wall_clock_seconds: 1400
    memory_gb: 4
    maximum_runs: 8
  budget_basis: >-
    Calibrated against the 1071 s, 1375 s and 1046 s measured validator tasks,
    set near the top of that range because this review must independently
    re-execute a reachable-set computation, work a proof decomposition lemma by
    lemma, and audit a pre-screen in both directions across eight artifacts. The
    declaration is a BINDING STOP CONDITION: halt at it and record which checks
    were not run, naming each, so an unrun check is never read as a check that
    found nothing.
  completion_gate:
    - >-
      The snapshot receipt is confirmed against Git, or the task stops and
      reports an evidence-integrity failure.
    - >-
      Two verdicts are issued in two physically separate files, and
      validation_report.yaml carries them side by side with NO combined verdict.
    - >-
      od4_bound_review.md audits the pre-screen in BOTH directions — that no
      vacuous candidate was pursued, AND that no in-scope candidate was killed on
      an inflated interface constant — and reports both.
    - >-
      od4_bound_review.md returns an explicit verdict on the OD-4 outcome: if a
      bound is stated, FOLLOWS / OVERSTATED / DOES NOT FOLLOW, worked lemma by
      lemma with the assembly checked for genuine per-attempt-cost x
      inverse-success-probability bookkeeping; if no bound is stated, whether the
      named breaking step is the right step, independently re-derived, and
      whether the closure meets the section 4 standard.
    - >-
      IF a bound is stated, od4_bound_review.md returns the validator's OWN
      per-gate assessment of gates (1), (2) and (3) with any unnumbered
      conditional dependence named explicitly, records gate (4) as satisfied by
      this review together with the red team and by nothing the producer did, and
      NAMES any gate that is not met rather than recommending promotion.
    - >-
      od3_and_hole_ii_review.md reports the validator's OWN re-execution of the
      u_k reachable-set computation from its own arithmetic over the same subset
      families, with its own numbers and any discrepancy named as a defect.
    - >-
      od3_and_hole_ii_review.md returns an independent assessment of each
      admitted set-valued candidate against the integral and DS-MITM families,
      marking the family identification unverified-from-memory, and reports any
      wrongly admitted candidate as a serious defect.
    - >-
      Both reviews confirm that every scaled-down reading is identified as an
      analogue and that no transfer to GF(2^8) or AES is asserted without an
      argument.
    - >-
      validation_report.yaml records the stand-down audit (no instrument work by
      either producer, or the violation), the supersession and immutability
      check, and the per-artifact-class provenance audit for all eight artifacts
      with digests recomputed.
    - >-
      validation_report.yaml lists every defect with a severity, carries the
      validator's own inference block with the session-not-model independence
      statement, asserts no official state change, assigns no evidence strength,
      and recommends no promotion.
  return_format: >-
    The three artifacts, plus a plain statement of: the two separate verdicts;
    whether any stated bound FOLLOWS, is OVERSTATED or does not follow, or
    whether the named breaking step is right; the per-gate assessment if a bound
    exists; the pre-screen audit in both directions; and the count and severity
    of defects found.
