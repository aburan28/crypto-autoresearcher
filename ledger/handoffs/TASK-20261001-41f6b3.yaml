  review_plan:
    id: REVIEW-SEMBIN-20261001-04ec3c-v2
    opens_round_for: [EXP-SEMBIN-04ec3c, H-SEMBIN-8e7ae3]
    why_claim_changing: >-
      Its outcome decides whether this program holds ANY admissible evidence
      record for the model-level statement of DEC-20261001-5c9e7a R6, and is the
      only thing that can move H-SEMBIN-8e7ae3 off `specified` (ceiling
      `analyzed`) before its supersession.
    claim_under_review: >-
      AS THE PRODUCER WILL STATE IT, which does not exist yet; this plan reviews
      RESULTS-amd-e61f2b.md and the v2 run against the v2 model stated in
      AMD-20261001-e61f2b. The claim the v2 receipt is built to support is the
      R6 restatement: within the cost model with the oracle table's construction
      charged at one operation per entry, no cell of the generic oracle classes
      (ENUM, MITM, MITM_CAPPED) at the ten degrees falls below the vOW column at
      any store; claim tier heuristic_estimate; no curve touched.
    coordinator_prior_meta:
      recorded_before_any_report: true
      recorded_before_any_implementation_exists: true
      recorded_with_knowledge_of_reviewer_computations: true
    coordinator_prior: >-
      I EXPECT E-1 TO E-4 OF AMD-20261001-e61f2b TO HOLD, AND THAT EXPECTATION IS
      NOT INDEPENDENT: two reviewers of the previous round computed E-2 and a
      third implied E-1 analytically, and I read all three before writing the
      amendment. Confirmation will be evidence about the v2 implementation, not
      about the model. WHAT WOULD OVERTURN THIS PRIOR: (a) a wrong v2
      implementation that passes C-IMPL-GATE, which would mean the replacement
      gate repeats A1's failure; (b) the construction charge removing known
      index-calculus wins on the proves-too-much objects, which would mean the
      charge is mis-specified rather than merely conservative; (c) a defensible
      reading -- multi-instance or precomputation -- under which the table build
      amortises and some cell beats the RIGHT baseline for that reading; (d) any
      E-2 margin off by more than 0.1 bit, which localises to one of three named
      implementations. I think (c) is the live one: the s-sum table depends only
      on (E, V), and I have not seen it priced against rho with precomputation.
    joints:
      - joint: >-
          JV-1 -- THE CONSTRUCTION-CHARGED ALGEBRA AND ITS DOMAIN. That the v2
          driver computes the amendment's header-block formulas; that FILL = s d is
          a LOWER bound on building the table (not over- or under-charged); that
          the CALLS < 0 exclusion removes exactly the out-of-domain cells; and that
          single-instance accounting is the right reading for the vOW comparison.
        assigned_to: TASK-20261001-0e7f53
        attack_plan: >-
          Re-implement TOTAL from the amendment's header block alone and diff every
          primary cell. Then attack the reading, not the arithmetic: price the
          table as free PRECOMPUTATION amortised over T targets and compare against
          the correct baseline for that reading -- rho with precomputation
          (Bernstein-Lange 2012, KN-LIT-7cc07f; CGK S T^2 ~ N, KN-LIT-013) -- not
          against single-instance vOW. I think the family still loses there (J3
          section 3 says every store-free cell loses to Bernstein-Lange at matched
          store), but nobody has computed it on the v2 rows. Also check whether
          one-group-operation-per-entry is attainable (incremental s-sums) so FILL is
          not over-charged.
        breaking_artifact: >-
          A primary cell whose correct construction-charged total differs from the
          v2 value by more than rounding, or a precomputation-reading cell below
          the precomputation baseline for that reading.
      - joint: >-
          JV-2 -- FAILURE POWER OF C-IMPL-GATE. That the replacement gate fails on
          wrong code, i.e. that A1's failure is not repeated.
        assigned_to: TASK-20261001-b2c916
        attack_plan: >-
          Build a wrong v2 cost function that passes all of C-IMPL-GATE (a)-(e):
          errors the closed-form grid at d in {16, 24, 32} cannot see (an error only
          at d < 16 or d > 32, or only in FILL when s d > some threshold, or only
          at unlisted B), or an error shared by the driver and its own mutants'
          baseline. The self-test (e) only shows the gate catches the FOUR declared
          mutation classes; find a fifth it misses.
        breaking_artifact: >-
          A concrete wrong implementation passing (a)-(e) that changes any primary
          sub-rho count or any E-2 margin by more than 0.1 bit.
      - joint: >-
          JV-3 -- SCOPE AND LANGUAGE of RESULTS-amd-e61f2b.md, the v2 manifest, and
          the snapshot commit message.
        assigned_to: TASK-20261001-6a4d08
        attack_plan: >-
          Read every sentence naming a degree, a curve, "charge", "store", "rho" or
          "safe" for what a hostile quoter could extract alone. Check against
          CORR-20261001-a38d14's corrected wordings and AMD-20261001-e61f2b C-8:
          no probe-only total called a cost; no curve named as beaten or safe; PUB
          only at n = 131; every margin naming its column; exploratory X columns
          never entering a primary count; the generic-class conditional and the
          non-generic open routes stated wherever "no cell" is stated; and no
          sentence that would make an overstating KN-FIND title. The previous
          round's J4 found nine; expect the commonest to recur.
        breaking_artifact: A quoted sentence that overstates, with corrected wording.
    blindness:
