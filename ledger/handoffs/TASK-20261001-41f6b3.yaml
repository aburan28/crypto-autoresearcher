        - >-
          A HIGH-GENUS HYPERELLIPTIC JACOBIAN (g >= 5 at n ~ 160; g >= 4 at
          n ~ 256), where Gaudry/Harley-style decomposition beats rho: run the v2
          accounting, construction charge included, with (i) the object's real
          oracle (factoring the Mumford u-polynomial) and (ii) the generic MITM
          oracle.
        - >-
          F_q^* at n in {131, 256, 512, 1024}, where index calculus beats generic
          search: v2 accounting with (i) smoothness testing and (ii) the generic
          oracles.
      failure_signature: >-
        WITH THE REAL ORACLE the v2 accounting MUST STILL FIND SUB-RHO CELLS on both
        objects (the construction charge has no table to charge there, so it must
        not bleed into non-table oracles); WITH THE GENERIC ORACLES it must find
        NONE. If the real-oracle cells disappear, the charge is mis-specified and
        the v2 negative proves too much. If the generic-oracle cells appear, the
        generic-lower-bound flag has failed.
      assigned_to: TASK-20261001-b2c916
      assigned_to_note: >-
