handoff:
  id: TASK-20261002-01d26d
  created_at: '2026-10-02'
  created_by: coordinator
  from: coordinator
  to: coordinator
  goal_id: GOAL-ECDLP2M-001
  batch_id: BATCH-521e9d
  lane: QSP-SUCC-R
  batch_composers: DEC-20261002-ff2bd5 (round 1, TASK-20261002-eced26) and DEC-20261002-e23776 (round 2, TASK-20261002-c6bdf7)
  skill: /design-experiment (revision-design mode; no new hypothesis or experiment record)
  review_required: true
  review_required_note: >-
    True. The revision gates the implementation, so it is reviewed by
    TASK-20261002-865f15 (JRD1), TASK-20261002-820856 (JRD2) and the blind
    TASK-20261002-efd590 (JRD3) under REVIEW-QSP-RD-20261002-521e9d before
    DEC-20261002-ff2bd5 can accept it.
  title: >-
    Revise the EXP-QSP-70b731 repair design (QSP-SUCC-R): a new
    revision-design.yaml discharging DR-1 to DR-14 of DEC-20261002-6e68d8
    with D-1 to D-8, the carried conditions and CI-1 to CI-6, an engine
    declaration, a measured engine-rate table and a route table drawn by the
    frozen R-ROUTE-RULE, and, only if needed, AMD-20261002-09957b.yaml inside
    R-AMEND-SCOPE
  objective: >-
    Read DEC-20261002-6e68d8, the three round-1 reports, the refused design,
    the frozen specification and DEC-20261002-c01bb7, and write a NEW revision
    design that two executors will implement under
    experiments/EXP-QSP-70b731/implementation/r1/ with the successor plan
    experiments/EXP-QSP-70b731/trial-plan-r1.json. Discharge DR-1 to DR-14 by
    number, keep D-1 to D-8, CC-1 to CC-5 and CI-1 to CI-6 discharged, carry
    the refused design's holding parts only by citation and re-statement,
    declare the I_indep engine set (DR-5), have the session measure its rates
    on synthetic operands (R-C5, R-C6), and draw the route table by
    DEC-20261002-c01bb7 R-ROUTE-RULE from those measurements (R-C7). If any
    I_indep route other than derivation (A) remains, write
    experiments/EXP-QSP-70b731/amendments/AMD-20261002-09957b.yaml inside
    R-AMEND-SCOPE as R-AMD-PATH-2 fixes. Zero runs; no instrument is run.
  uncertainty_reduced: >-
    Whether every round-1 defect has a local repair with an acceptance check
    that fails the round-1 constructed inputs and passes legitimate routes,
    and where derivation (A) is infeasible on measured rates under a rule
    fixed in advance; i.e. whether EXP-QSP-70b731 can be made executable
    under the frozen specification plus one amendment.
  revision_items:
    source: >-
      DEC-20261002-6e68d8 defect_list_for_revision, verbatim in substance;
      that decision is the authority where wording differs. A remedy may be
      met by any equivalent route stated with its reason, except where that
      decision or DEC-20261002-c01bb7 fixes the route.
    items:
      - id: DR-1
        requirement: >-
          Every terminal failed record (exception path, Linux gate, and every
          other failure branch you can name, including those before the
          payload starts) writes raw-result.json carrying the error, stop code
          and count of finished rows before the terminal manifest, or, where
          the payload cannot run at all, the execution card's report records
          the attempt; AC-2's forced-exception branch and AC-15 run check_run
          and must fail round-1 case A8.
      - id: DR-2
        requirement: >-
          Certificates bound per row (row index plus lambda key, cell and N),
          or certificate_bearing defined per row against a re-verified file
          bound to that row; rules for repeated lambda (C5 draws with
          replacement) and for K-coefficient lambda; the checker exits 3
          unless identity_holds, recomputed from disk, is true; AC-3 adds the
          with-replacement case B7, the swap case B8 and the payload-skip
          case.
      - id: DR-3
        requirement: >-
          Read declarations are lists of bare canonical repo-relative POSIX
          paths with extents in a separate field; canonicalise before matching;
          a parent of, or a slashless form of, a blind_from entry is a hit; a
          non-canonical entry sets blind_from_respected false; AC-11 and AC-16
          add round-1 cases f to k and every further form you can construct;
          the execution-phase declaration's time scope is stated (append-only,
          committed before each launch, with a recorded exemption for the
          post-freeze sealed read).
      - id: DR-4
        requirement: >-
          Transitive import audit including kfield.py; AC-10 run through the
          plan's argv form; AC-12 mutation in the F-10 shape; Linux as an
          execution-card dispatch precondition with pre-payload failures
          recorded by the execution report; test trees required to define
          every synthetic cell. Each answered or repaired.
      - id: DR-5
        requirement: >-
          Declare the I_indep product engine set from the specification and
          CI-5, not narrower without a stated reason from the specification
          (standard-library decimal; numpy with its version recorded; or such
          a reason), and state whether I_direct may use the same engine (a
          shared primitive must be addressed by the independence argument and
          AC-7). Measure per-squaring and gcd seconds on random synthetic
          operands at the boundary degrees (at least 2^22, 2^24, 5^10, 5^11,
          6^10, 3^17) through R-C5 and R-C6, outputs verified exactly.
      - id: DR-6
        requirement: >-
          Draw the A1 line by DEC-20261002-c01bb7 R-ROUTE-RULE from the
          measured rates (R-C7), flag marginal rows, restate the
          horizon-robustness claim from measured figures, and recompute the
          per-trial projections and claim-TTL guidance. Do not choose another
          threshold, horizon or cost formula; you may print an alternative
          reading for information only.
      - id: DR-7
        requirement: >-
          Operand-provenance tokens in WO-I-10's trace (object provenance that
          survives copies, slices, views and re-wrapping, never value
          digests); AC-7 rules R1 to R3 or a stated successor; the six
          disguises D3a to D3f of REVIEW-QSP-RD-20261002-521e9d PTM-RD4 named
          as mutations that must fail, with legitimate S-BERL and A-DENSE
          passing on the same synthetic cells; the independence text rule
          restated so that S-BERL's own Q construction satisfies it.
      - id: DR-8
        requirement: >-
          The amendment's calibration consequence stated per composition
          depth (q + 1 in {2, 3, 4}; q + 1 = 4 has no exact declared
          reference); the A1 qualifier bound explicitly to the frozen
          success-criterion headline sentence; the dual-route requirement
          described as an A1-consequential tightening.
      - id: DR-9
        requirement: >-
          State A-TWIST's status on C5K-np33 with an argument for each reading
          (an A1 change, with the argument that the cell lies within "census
          or calibration cell"; or a reading of C5's own text needing no
          amendment), and say which you adopt. The composer rules.
      - id: DR-10
        requirement: >-
          Optional. The C6 exact count N = 2^(deg gcd(f, T^n - 1)) for
          linearized lambda may be added ONLY as a recorded, non-blocking
          diagnostic (DEC-20261002-c01bb7 R-C6-DIAG), with provenance recalled
          stated; it never changes C6's pass criterion.
      - id: DR-11
        requirement: List the I_indep author's minimum read set in WO-I-1 so AC-16 has a reference; it must lie within TASK-20261002-38ffea's read_scope.
      - id: DR-12
        requirement: >-
          Record, as a limitation carried to any later evidence review, that
          the C5 F_2 arm at d = 3 draws with replacement from only the census
          candidates at that degree, so at d = 3 it is a resample of the
          census rather than a distinct null object.
      - id: DR-13
        requirement: >-
          Every work order states that evaluating any H polynomial, root, gcd
          or count on a declared cell, by tool or by hand, is a TQ-3 event,
          and routes such checks to synthetic cells outside {4, 7, 11, 12, 13,
          31, 131}. You yourself evaluate nothing on a declared cell, not even
          mentally.
      - id: DR-14
        requirement: >-
          Write a new design file and, if needed, the new amendment under
          R-AMD-PATH-2; edit nothing of round 1 (the refused design,
          amendment-v2.yaml, the round-1 plans, reports, worksheet or
          decisions).
    carried_unchanged: >-
      D-1 to D-8 and carried_conditions (DEC-20261002-e0aa2b), CI-1 to CI-6
      (DEC-20261002-a63f13 R-CARRIED; CI-2 keeps r1/ and trial-plan-r1.json,
      DEC-20261002-c01bb7 R-CARRIED), R-AMEND-SCOPE (DEC-20261002-c01bb7
      R-AMEND-SCOPE-CARRIED), and the refused design's holding parts as
      DEC-20261002-6e68d8 R-DESIGN lists them (discharge clauses, route
      quantities, Stage-0 mechanism without census code, D-5 order, run-id
      rule, S-BERL definition, calibration naming, PTM-D1 statement): each
      relied-on part is cited by section of the refused design AND restated
      in the revision, so the revision stands alone.
  route_rule: >-
    DEC-20261002-c01bb7 R-ROUTE-RULE, binding and not to be re-chosen. For a
    census or calibration (cell, d): n = q n' + r, s = n' - r,
    B = max(2^s, d^(q+1)), G = candidates of exact degree d under the
    specification's candidate rule. Derivation (A) is INFEASIBLE iff (M) a
    modular squaring or the gcd at degree B on the I_indep engine does not
    complete under RLIMIT_AS = 8 GiB (measured where B is on the measured
    ladder; above it, the larger of 2B bits and the measured
    peak-address-space-per-bit ratio extrapolated linearly, against 2^36
    bits), OR (T) T_A = G x (131 x t_sq(B) + t_gcd(B)) exceeds 90 days, with
    t_sq the measured seconds per modular squaring at degree B on the fastest
    engine of the declared I_indep set and t_gcd the measured or fitted
    (labelled) seconds of the declared gcd at degree B. Composition and
    factorisation costs are excluded and disclosed. Rows with 30 < T_A <= 270
    days are flagged marginal. Bridge and Band H are never substituted.
  allowed_session_computations:
    authority: DEC-20261002-c01bb7 R-RATES and R-WHO (1), stated in advance
    note: >-
      This producer holds no shell. It may ask the top-level session to
      perform these and only these, by item id, in
      <session scratchpad>/BATCH-521e9d/TASK-20261002-01d26d/, under
      /usr/local/bin/python3 (CPython 3.11.15; no 3.12+ API; the bash time
      keyword, since /usr/bin/time is not installed; numpy only if the design
      declares it, its version printed). It embeds each command and its
      verbatim output in revision-design.yaml as a design figure, never a
      result. Code is run exactly as written in the design and extracted by
      the pinned method. The session never exports or copies a whole git tree
      into scratch; it checks out single declared files only. A block revised
      after a relay keeps the superseded block bound by its sha256 in the
      design, and both outputs are recorded.
    timing_conditions: >-
      Applies to R-C5 and R-C6. Each item runs in a fresh process, one
      measurement process at a time for this card, with RLIMIT_AS = 8 GiB set
      inside the block (resource.setrlimit) and the process wrapped as
      "timeout 3600" under the bash time keyword; the block prints its own
      perf_counter seconds, peak RSS (resource.getrusage), the interpreter
      version, platform.machine(), nproc and /proc/loadavg before and after,
      and the seed. Operands are uniformly random F_2[X] polynomials (or
      random F_2 matrices) of the stated degree or size from a declared seed;
      none is a lambda, L, H, composite iterate or X^(2^n) - X, and none is
      built from any declared cell. Every product or reduction is verified
      exactly by a method the block states (an independent second engine at
      the same size, or a randomised evaluation identity with its failure
      probability stated). A watchdog expiry or a MemoryError is relayed
      verbatim as an instrument condition, never as a result; the design then
      uses a labelled fit or extrapolation and says so. Contention by other
      lanes is recorded, never removed by discarding a measurement.
    items:
      - R-C1 extract each committed code block of revision-design.yaml by the pinned method and compute its sha256
      - >-
        R-C2 a syntax check and an import-safety check of each block in a
        fresh /usr/local/bin/python3 (importing executes nothing), a scan for
        any 3.12+ API, and a yaml.safe_load parse of each returned YAML file,
        reported verbatim and never repaired
      - >-
        R-C3 run route_quantities_code through its __main__ entry: pure
        integer and floating-point arithmetic on the declared cells and
        degrees (q, r, s, B, log2 B, G, the 2B-bit floor against 2^36),
        relayed verbatim
      - >-
        R-C4 run candidate_count_code through its __main__ entry: counting
        polynomials of F_2[X] by exact degree under the specification's
        candidate rule (no field arithmetic on any cell), relayed verbatim
      - >-
        R-C5 ENGINE RATES (DR-5). Run engine_bench_code through its __main__
        entry once per (engine, operation, degree) item the design lists: one
        product and one modular squaring (with the reduction the design
        declares) of random operands, for each engine of the declared I_indep
        engine set and for each excluded engine inside CI-5 the design names
        as a comparison, at least at degrees 2^22, 2^24, 5^10, 5^11, 6^10 and
        3^17 and at the degree of every row the design expects to be
        marginal, under timing_conditions; relayed verbatim
      - >-
        R-C6 GCD AND ELIMINATION RATES (DR-5, DR-6). Run gcd_bench_code
        through its __main__ entry for the declared gcd on random pairs of
        degree 2^16, 2^17, ... doubling up to the largest degree that completes
        inside the watchdog (at least 2^22 attempted), and run elim_bench_code
        for Gaussian elimination over F_2 on random m x m matrices with
        m = 2^k, k = 8 to 14 (S-BERL projections), under timing_conditions;
        relayed verbatim
      - >-
        R-C7 ROUTE LINE (DR-6). Run route_line_code through its __main__
        entry: R-ROUTE-RULE applied to the R-C3 quantities and to the R-C5 and
        R-C6 rates copied literally into the block from the relays (the block
        prints the sha256 of each relay it copied), printing per (cell, d)
        T_A in days, the memory verdict, the route, the marginal flag, the
        summary counts, and the per-trial projections and claim-TTL
        guidance; relayed verbatim
      - >-
        R-C8 DEMONSTRATIONS, only for blocks the design commits: the path
        canonicaliser on the case list the design states; the trace-audit
        rules on mock routes (legitimate S-BERL and A-DENSE, and D3a to D3f)
        over synthetic cells with n outside {4, 7, 11, 12, 13, 31, 131} and n
        at most 19; the certificate binding and accounting on synthetic
        fixtures; tools/validate_ledger.py check_run (imported as a function
        only) on synthetic manifests and failed records. Nothing of the bound
        closure is imported or run; relayed verbatim
      - >-
        R-C9 sha256 of experiments/EXP-QSP-70b731/specification.yaml, the six
        trial-plan*.json files, the eight files of
        experiments/EXP-QSP-70b731/implementation/*.py, the refused design,
        amendment-v2.yaml, tools/validate_ledger.py and
        tools/experiment_execution.py; and, with a stated one-line python3
        command, the trial ids, run ids and depends_on lists of the six plans;
        relayed verbatim
    forbidden: >-
      Anything else. No instrument and no file of the bound closure is run or
      imported; no N, root, gcd with X^(2^n) - X, H polynomial, composite
      lambda^(ok) or decision statistic is computed on any declared cell or on
      any synthetic cell with n in {4, 7, 11, 12, 13, 31, 131}, by tool or by
      hand; no timing operand is built from a declared cell; nothing under
      experiments/EXP-QSP-70b731/runs/ is listed, read or imported; no
      tools/experiment_execution.py mode is run; no RUN id is minted.
