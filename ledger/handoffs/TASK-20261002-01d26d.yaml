  read_scope_note: >-
    The bound closure may be read to write WO-R; WO-I carries no code of
    i_indep.py, gf2_poly.py or i_direct.py. The whole round-1 batch directory
    is readable (design, archives, reviews, composition) because you must
    discharge it; you may cite a round-1 reviewer figure only attributed to
    its report, never as your own measurement. Not read: this batch's
    reviews/ and composition/ directories (they do not exist yet and you
    never list them). Excluded reads (DEC-20261002-c01bb7 R-READ):
    experiments/EXP-QSP-70b731/runs/; experiments/EXP-FROB-30006a/; the ref
    origin/cursor/semaev-2015-audit-program-5b8b; PR #1377; the branch
    cursor/ecdlp2m-revision-design-3d1a; the in-flight design, review and
    composition directories under BATCH-d08b44/ and BATCH-bc5bd5/; every
    BATCH-ccfdc6 record; every path in the specification's blind_from;
    ledger/evidence/EV-QSP-a6aa4b.yaml; the DEC-20260917-* decisions;
    knowledge entries carrying EXP-QSP-33b442 counts. A read_scope is widened
    only by a Coordinator decision.
  write_scope:
    - coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-521e9d/design/TASK-20261002-01d26d/
    - experiments/EXP-QSP-70b731/amendments/AMD-20261002-09957b.yaml
  write_scope_note: >-
    Inside the design directory you write exactly revision-design.yaml.
    AMD-20261002-09957b.yaml is written only if a route other than derivation
    (A) remains on a census or calibration (cell, d), or A2 or A3 is needed.
    If written, the session appends its path to this card's queue
    artifact_paths and the AMD id to TASK-20261002-9831c4's archive.record_ids
    before the snapshot (the queue's R-AMD-PATH note).
  constraints:
    - >-
      RP-1 FORM. Write exactly revision-design.yaml under the design directory,
      new, and AMD-20261002-09957b.yaml only under the write_scope_note; edit
      no specification, plan, implementation file, round-1 file, decision,
      hypothesis, proposal, question, review plan or goal record; never touch
      amendment-v2.yaml. Mint no identifier.
    - >-
      RP-2 DISCHARGE. A discharge table maps DR-1 to DR-14, D-1 to D-8, CC-1 to
      CC-5, CI-1 to CI-6, R-AMEND-SCOPE, R-ROUTE-RULE and R-C6-DIAG each to (a)
      the specification, amendment or decision clause it rests on, (b) the
      WO-I or WO-R items that implement it, precise enough to implement
      without further design, and (c) the acceptance checks AC-n a round-2
      reviewer runs on synthetic cells and that can fail; and states which
      checks fail the bound closure (PTM-RD2) and which round-1 constructed
      input each repaired check fails (PTM-RD1).
    - >-
      RP-3 ROUTE RULE. The route table is R-ROUTE-RULE applied to the R-C3
      quantities and the R-C5 and R-C6 measurements by R-C7, keyed by cell
      name (CI-3). No other threshold, horizon or cost formula draws the line.
    - >-
      RP-4 ENGINE. Declare the I_indep engine set (DR-5) with its reason, the
      gcd used, whether I_direct may share an engine and how AC-7 addresses
      it; name every CI-5 engine you exclude and the specification reason.
    - >-
      RP-5 CODE. Every code block (route_quantities_code, candidate_count_code,
      engine_bench_code, gcd_bench_code, elim_bench_code, route_line_code and
      any demonstration block) is a literal block scalar of the design with its
      extraction method and reference sha256 pinned, guarded by
      if __name__ == '__main__', so that importing it executes nothing; it
      selects cells by name and builds no operand from a declared cell.
    - RP-6 Session computations limited to allowed_session_computations R-C1 to R-C9, requested by item id; each command and output embedded as a design figure.
    - >-
      RP-7 TRIPWIRES. No computation of N, a root, a gcd with X^(2^n) - X, an H
      polynomial, a composite lambda^(ok) or a decision statistic on any
      declared cell or synthetic cell with n in the declared set, by tool or by
      hand (TQR-3, DR-13); the amendment inside R-AMEND-SCOPE at R-AMD-PATH-2's
      path and id (TQR-2); no run value of EXP-QSP-70b731 or EXP-QSP-33b442 and
      no reading of H-QSP-cd0c90's standing or of EV-QSP-a6aa4b (TQR-4).
    - RP-8 Every citation with provenance (recalled, retrieved, kb, internal); recalled references support nothing.
    - >-
      RP-9 AMENDMENT FORM. If written: id AMD-20261002-09957b; version 1 to 2;
      kind additive; approved_by null with an approval block naming
      DEC-20261002-ff2bd5; precedence over version 1; refused_predecessor
      naming AMD-20261002-1303c4 (refused by DEC-20261002-6e68d8, never in
      force); pre_data_assessment POST-DATA as to the owner session's
      exposure, with the statement that its author read nothing under runs/;
      each change labelled A1, A2, A3, a tightening, or A1-consequential; the
      consequence of each change for S1 and for the pre-Band-H calibration per
      composition depth (DR-8); nothing outside R-AMEND-SCOPE.
