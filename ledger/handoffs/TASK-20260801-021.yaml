handoff:
  id: TASK-20260801-021
  from: coordinator
  to: executor
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-023
  objective: >-
    TWO ORDERED PHASES IN ONE TASK, AND THE ORDER IS PART OF THE CONTRACT. PHASE A -
    author experiments/EXP-EQD-001/implementation/eqd001_driver.py COMPLETE, INCLUDING THE
    REAL-ARM ENTRY POINT THAT IS NOT INVOKED IN THIS TASK, plus implementation.md. PHASE B
    - execute RUN-EQD-001-calib exactly as experiments/EXP-EQD-001/specification.yaml
    specifies, on NULL AND PLANTED OBJECTS ONLY - CAL-1 (200 independent replicate pairs of
    OBJ-NULL-RFB per bit size, recording STAT-CHI-16, STAT-CHI-64, STAT-KS1-E1, STAT-KS1-E2
    per pair and STAT-DUP for each of the 400 draws), CAL-2 (20 OBJ-PLANT-delta replicates
    per delta on the frozen ladder against fresh OBJ-NULL-RFB draws), CAL-3 (20
    OBJ-NULL-IND versus OBJ-NULL-RFB comparisons) and CAL-4 (#E(F_p), its 2-adic
    valuation, |X_E|, and the admissible-support fractions of one OBJ-NULL-UNIF2 draw and
    one OBJ-NULL-RFB draw), at both bit sizes. Observe and record only. Freeze no
    threshold, apply no reading rule, and interpret nothing.
  uncertainty_reduced: >-
    What the frozen statistics actually DO on objects whose law is known - the measured
    null distribution that THR-EQD-1 will be evaluated against, and the measured power
    curve that CERT-EQD-1 will be evaluated against.
  inputs:
  - experiments/EXP-EQD-001/specification.yaml
  - ledger/hypotheses/H-EQD-001.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/archives/TASK-20260801-020/snapshot_commit_receipt.json
  - harness/toycurve.py
  constraints:
  - >-
    run_authorized ONLY if TASK-20260801-020 records CALIBRATION_AUTHORIZATION AUTHORIZED;
    otherwise cancel with no run and say so.
  - >-
    THE CALIBRATION NEVER SEES THE REAL DATA, STRUCTURALLY AND NOT BY INSTRUCTION (ATS-1
    clause 2). Enumerate NO half-tuple of the deterministic factor base. Do not invoke the
    real-arm entry point. The run package must contain no OBJ-REAL sample, no
    deterministic factor-base x-list and no statistic computed from one.
  - >-
    THE DRIVER IS AUTHORED COMPLETE HERE AND IS NOT EDITED AGAIN (ATS-1 clause 5). The
    real-arm entry point must be present, reachable and unexecuted. Record the driver
    sha256 in the calibration manifest; TASK-20260801-027 must execute the IDENTICAL file
    with no edit.
  - >-
    IMPLEMENT THE FROZEN FORMS EXACTLY AS WRITTEN AND CHOOSE NOTHING. The statistic family,
    the resolution ladder K in {16, 64}, the binning rule, the plant construction, the
    delta ladder [0.005, 0.01, 0.02, 0.05, 0.10], M_PAIRS = 200 and R_REPS = 20 are frozen
    in the contract. Do not add, drop, retune or substitute any of them.
  - >-
    Enumerate i < j only. The diagonal is excluded BY CONSTRUCTION at n = C(512, 2) =
    130816 per sample set. If any arm records a single c_2 = 0 draw, stop and report it -
    that is an integrity failure, not a datum.
  - >-
    On the null side, maintain 512 DISTINCT x-coordinates by REJECT AND REDRAW on an
    x-collision, and record the rejection count. This is the only redraw permitted anywhere
    in this experiment.
  - >-
    Use the frozen streams - master seed 2301, calibration null stream 2301 + 10000 + bits,
    plant stream 2301 + 20000 + bits, independent-pair stream 2301 + 30000 + bits,
    uniform-pair stream 2301 + 40000 + bits. DO NOT TOUCH THE REAL-ARM NULL STREAM
    2301 + 50000 + bits. Record every stream hash.
  - >-
    The run manifest is manifest.yaml, NOT manifest.json, with companions command.txt,
    environment.json, stdout.log, stderr.log and raw-result.json - NOTE THE .log RATHER
    THAN .txt. The manifest must carry id, experiment_id, status, code with commit and
    command, environment, inputs with parameters, timing and result, and
    result.certificate.kind must be the literal string none.
  - >-
    Memory policy - retain per-replicate statistic values, stream hashes and one
    representative OBJ-NULL-RFB draw per cell. Do NOT archive the full 1.4 x 10**8 pairs.
  - >-
    NO FACTORIZATION, NO LARGEST PRIME FACTOR, NO SMOOTHNESS INDICATOR, NO DICKMAN
    EVALUATION, NO u LADDER, NO SEARCH ARM, NO TIMING DECISION VARIABLE, NO COST IDENTITY
    AND NO R anywhere in the driver or the package. wall_seconds_total is recorded for
    budget accounting only.
  - >-
    DO NOT FREEZE ANY THRESHOLD AND DO NOT COMPUTE ANY ORDER-STATISTIC THRESHOLD AS A
    DECISION. Emit the raw replicate values; TASK-20260801-023 applies THR-EQD-1 to them.
  - >-
    Do NOT classify anything against RR-EQD-1, which does not exist yet, and do not state a
    disposition of any kind.
  - >-
    THIS RUN IS EXPRESSLY NON-EVIDENTIAL about H-EQD-001, HEUR-DS-1 and H-SMTH-001 in
    either direction. Do not describe any calibration number as a result about the Semaev
    map.
  - Do not read-modify, import, edit or stage any file under experiments/EXP-DS-001/ or experiments/EXP-SMTH-001/.
  - AP-1 BINDS. Do not set smoothness_abort on any EXP-DS-001 arm and do not represent any such run as exercising anything.
  - Timeouts, crashes, memory exhaustion and budget cancellation are infrastructure signal, never mathematical negatives (AGENTS.md rule 5).
  - No new dependencies. If any new dependency proves necessary the run is cancelled and reported, not extended.
  - MAKE NO COMMIT; TASK-20260801-022 archives.
  - Record inference fallback honestly (requested executor-implementation).
  - Do not alter any ledger record. Leave FAEST and XEDN alone.
  deliverables:
  - experiments/EXP-EQD-001/implementation/eqd001_driver.py
  - experiments/EXP-EQD-001/implementation/implementation.md
  - experiments/EXP-EQD-001/runs/RUN-EQD-001-calib/manifest.yaml
  - experiments/EXP-EQD-001/runs/RUN-EQD-001-calib/raw-result.json
  - experiments/EXP-EQD-001/runs/RUN-EQD-001-calib/command.txt
  - experiments/EXP-EQD-001/runs/RUN-EQD-001-calib/environment.json
  - experiments/EXP-EQD-001/runs/RUN-EQD-001-calib/stdout.log
  - experiments/EXP-EQD-001/runs/RUN-EQD-001-calib/stderr.log
  - experiments/EXP-EQD-001/results/calib/null_replicate_statistics.json
  - experiments/EXP-EQD-001/results/calib/power_curve.json
  - experiments/EXP-EQD-001/results/calib/instrument_characterization.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/tasks/TASK-20260801-021/execution_report.yaml
  artifact_paths:
  - experiments/EXP-EQD-001/implementation/eqd001_driver.py
  - experiments/EXP-EQD-001/implementation/implementation.md
  - experiments/EXP-EQD-001/runs/RUN-EQD-001-calib/manifest.yaml
  - experiments/EXP-EQD-001/runs/RUN-EQD-001-calib/raw-result.json
  - experiments/EXP-EQD-001/runs/RUN-EQD-001-calib/command.txt
  - experiments/EXP-EQD-001/runs/RUN-EQD-001-calib/environment.json
  - experiments/EXP-EQD-001/runs/RUN-EQD-001-calib/stdout.log
  - experiments/EXP-EQD-001/runs/RUN-EQD-001-calib/stderr.log
  - experiments/EXP-EQD-001/results/calib/null_replicate_statistics.json
  - experiments/EXP-EQD-001/results/calib/power_curve.json
  - experiments/EXP-EQD-001/results/calib/instrument_characterization.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/tasks/TASK-20260801-021/execution_report.yaml
  archived_by: TASK-20260801-022
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 3600
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
  - >-
    Driver authored complete with an unexecuted real-arm entry point and its sha256
    recorded; CALIBRATION_AUTHORIZATION gate respected; CAL-1, CAL-2, CAL-3 and CAL-4
    complete at both bit sizes or an honest incomplete report; every arm at n = 130816 or
    reported short; zero c_2 = 0 draws recorded and every null redraw counted; no OBJ-REAL
    sample and no deterministic factor-base x-list anywhere in the package; no
    factorization, no smoothness statistic, no search arm, no timing decision variable and
    no R; no threshold frozen; no disposition stated; manifest.yaml present with its
    required fields and the five companion filenames beside it.
