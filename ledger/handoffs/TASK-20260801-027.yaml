handoff:
  id: TASK-20260801-027
  from: coordinator
  to: executor
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-023
  objective: >-
    Execute RUN-EQD-001-real exactly as experiments/EXP-EQD-001/specification.yaml specifies,
    using the IDENTICAL driver file archived at TASK-20260801-022 with NO EDIT. Build the two
    toy curve instances at bits 16 and 20 from master seed 2301; build the FROZEN
    DETERMINISTIC 512-element factor base at each; compute the fibre invariants under INT-2
    EXHAUSTIVELY over all C(512, 2) = 130816 unordered half-tuples with i < j to form
    OBJ-REAL; draw a fresh matched OBJ-NULL-RFB from the REAL-ARM null stream 2301 + 50000 +
    bits at the same n; compute every retained statistic of STAT-EQD-1 between them; re-run
    the certified OBJ-PLANT-delta object as the in-run power certificate PC-1; run the
    apparatus-identity pair DV-7 as two fresh independent OBJ-NULL-RFB draws; and run the
    controls CTRL-EQD-S3, CTRL-EQD-RANGE and CTRL-EQD-DRIVER-HASH. Observe and record only.
    Interpret nothing and classify nothing against the reading rule.
  uncertainty_reduced: >-
    Whether the fibre invariants of the frozen deterministic factor base are distinguishable,
    at the calibrated thresholds and the frozen resolutions, from those of a uniformly random
    factor base under the identical map and enumeration, at these two toy field sizes.
  inputs:
  - experiments/EXP-EQD-001/specification.yaml
  - experiments/EXP-EQD-001/reading_rule.yaml
  - experiments/EXP-EQD-001/implementation/eqd001_driver.py
  - ledger/hypotheses/H-EQD-001.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/archives/TASK-20260801-026/snapshot_commit_receipt.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/archives/TASK-20260801-022/snapshot_commit_receipt.json
  - harness/toycurve.py
  constraints:
  - >-
    run_authorized ONLY if TASK-20260801-026 records APPROVAL_DETERMINATION APPROVED;
    otherwise cancel with no run and say so. The CALIBRATION_AUTHORIZATION at
    TASK-20260801-020 does NOT authorize this run.
  - >-
    EXECUTE THE IDENTICAL DRIVER FILE WITH NO EDIT OF ANY KIND (ATS-1 clause 5). Record the
    driver sha256 in the manifest; if it differs from the DRIVER_SHA256 bound by the
    TASK-20260801-022 calibration snapshot receipt, STOP AND REPORT - that is CTRL-EQD-DRIVER-HASH
    failing and it invalidates the real run outright.
  - >-
    Enumerate i < j only, at exactly n = C(512, 2) = 130816 per arm. A short arm is reported
    short and is never padded, imputed or extrapolated. Any recorded c_2 = 0 draw on any arm
    is an integrity failure - stop and report it.
  - >-
    The real factor base is the frozen deterministic subset - the first 512 x-coordinates in
    F_p, in increasing integer order, that are x-coordinates of points of E(F_p). Record
    factor_base_sha256 over the canonical decimal newline-joined x-list.
  - >-
    The matched null must draw from the REAL-ARM null stream 2301 + 50000 + bits, disjoint
    from every calibration stream, must maintain 512 DISTINCT x-coordinates by reject and
    redraw, and must record the rejection count and its x-list sha256.
  - >-
    THE NULL PIPELINE MUST DIFFER FROM THE REAL PIPELINE IN THE SOURCE OF THE 512 POINTS AND
    IN NOTHING ELSE. Record that fact and how you ensured it.
  - >-
    CTRL-EQD-S3 IS MANDATORY - for the first 1000 half-tuples in enumeration order per cell,
    verify by ACTUAL POINT ARITHMETIC on E(F_p), through a code path that does not reuse the
    coefficient formula, that the root multiset of f_ij equals {x(P_i + P_j), x(P_i - P_j)},
    and record verified over total. Anything below 1000 of 1000 at either cell stops the run.
  - >-
    CTRL-EQD-RANGE IS MANDATORY - assert and record that every e_1 and e_2 lies in [0, p) and
    that every arm has exactly 130816 pairs.
  - >-
    PC-1 and DV-7 are CONTROLS AND NOT EVIDENCE. Run them, record them, and do not describe
    either as bearing on H-EQD-001 or HEUR-DS-1. DV-7's non-rejection is expressly NOT
    corroboration of anything.
  - Record the real-arm admissible-support fraction, which must be exactly 1.0, and every stream hash.
  - >-
    The run manifest is manifest.yaml, NOT manifest.json, with companions command.txt,
    environment.json, stdout.log, stderr.log and raw-result.json - NOTE THE .log RATHER THAN
    .txt - and result.certificate.kind must be the literal string none, because no discrete
    logarithm and no decomposition is claimed.
  - >-
    NO FACTORIZATION, NO SMOOTHNESS STATISTIC, NO DICKMAN EVALUATION, NO SEARCH ARM, NO CLAW
    TABLE, NO RELATION HARVEST, NO TIMING DECISION VARIABLE, NO COST IDENTITY AND NO R
    anywhere in the package. wall_seconds_total is recorded for budget accounting only.
  - >-
    DO NOT CLASSIFY THE RESULT AGAINST RR-EQD-1 and do not state a disposition; that is
    TASK-20260801-031's exclusive job.
  - Do not edit the specification, the reading rule or any ledger record.
  - Do not read-modify, import, edit or stage any file under experiments/EXP-DS-001/ or experiments/EXP-SMTH-001/.
  - Timeouts, crashes, memory exhaustion and budget cancellation are infrastructure signal, never mathematical negatives (AGENTS.md rule 5).
  - No new dependencies. MAKE NO COMMIT; TASK-20260801-028 archives.
  - Record inference fallback honestly (requested executor-implementation). Leave FAEST and XEDN alone.
  deliverables:
  - experiments/EXP-EQD-001/runs/RUN-EQD-001-real/manifest.yaml
  - experiments/EXP-EQD-001/runs/RUN-EQD-001-real/raw-result.json
  - experiments/EXP-EQD-001/runs/RUN-EQD-001-real/command.txt
  - experiments/EXP-EQD-001/runs/RUN-EQD-001-real/environment.json
  - experiments/EXP-EQD-001/runs/RUN-EQD-001-real/stdout.log
  - experiments/EXP-EQD-001/runs/RUN-EQD-001-real/stderr.log
  - experiments/EXP-EQD-001/results/real/EQD_report.json
  - experiments/EXP-EQD-001/results/real/matched_null_comparison.json
  - experiments/EXP-EQD-001/results/real/power_certificate.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/tasks/TASK-20260801-027/execution_report.yaml
  artifact_paths:
  - experiments/EXP-EQD-001/runs/RUN-EQD-001-real/manifest.yaml
  - experiments/EXP-EQD-001/runs/RUN-EQD-001-real/raw-result.json
  - experiments/EXP-EQD-001/runs/RUN-EQD-001-real/command.txt
  - experiments/EXP-EQD-001/runs/RUN-EQD-001-real/environment.json
  - experiments/EXP-EQD-001/runs/RUN-EQD-001-real/stdout.log
  - experiments/EXP-EQD-001/runs/RUN-EQD-001-real/stderr.log
  - experiments/EXP-EQD-001/results/real/EQD_report.json
  - experiments/EXP-EQD-001/results/real/matched_null_comparison.json
  - experiments/EXP-EQD-001/results/real/power_certificate.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/tasks/TASK-20260801-027/execution_report.yaml
  archived_by: TASK-20260801-028
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 1800
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
  - >-
    APPROVED gate respected; driver sha256 recorded and equal to the calibration-time hash;
    every arm at n = 130816 or an honest short report; zero c_2 = 0 draws; CTRL-EQD-S3 at
    1000 of 1000 at both cells or an honest failure report; CTRL-EQD-RANGE clean;
    admissible-support fraction 1.0 on the real arm; PC-1 and DV-7 recorded as controls; null
    pipeline identity recorded; no factorization, no smoothness statistic, no search arm, no
    timing decision variable and no R anywhere in the package; no fabricated statistic; no
    disposition stated.
