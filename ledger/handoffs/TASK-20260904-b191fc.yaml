      distinct-split (Z=3) residual stratum exactly as EXP-MONO-4e6faa did
      (reusing `EXP-MONO-0e6e8f/implementation/run_uncond_census.py`'s
      own already-verified construction). Tabulate exact #1^4, #2+1+1,
      #2+2 counts (and the other two classes for completeness).
    - >-
      STAGE 2: BEFORE reading Stage 1's own output, compute BOTH
      D_lin = h_+ n_- + h_- n_+ (the frozen, unchanged D3 formula) and
      D_quad = h_+ n_- + (h_-)^2 n_+ (the named quadratic rival) from the
