    compute a SECOND, named rival prediction (quadratic: D_quad =
    h_+ n_- + (h_-)^2 n_+) alongside the original linear one, BEFORE
    looking at Stage 1's own results, so the comparison is genuinely
    pre-registered and discriminating.

  what_to_do:
    - >-
      STAGE 0: adapt EXP-MONO-4e6faa's own search (same fixed ascending
      order: primes in [101,2000], A ascending, B ascending, first hit
      taken) to require Z=3 AND h_- >= 2 this time (change only the
