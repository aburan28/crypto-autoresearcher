      - The TASK-20261002-d08cff receipt (3 bound record paths), the
        TASK-20261002-1dc2ba receipt (1 bound path, the archived draft
        coordination/design/TASK-20261002-33047e/replication-design.yaml) and
        the TASK-20261002-e46042 receipt (4 bound record paths) still verify,
        every path they bind has its recorded path_sha256, and each receipt
        equals its committed blob.
      A mismatch is a custody failure: STOP, commit nothing, report.
      (d) GIT STATUS. git status --porcelain (untracked included) shows
      exactly one untracked path,
      coordination/design/TASK-20261002-729fc9/replication-design-corrected.yaml,
      plus this task's own receipt once written, and nothing else. No tracked
      file is modified. Nothing under ledger/ (no new or changed record),
      experiments/, coordination/review/, src/, tests/ or knowledge/ has
      changed, and nothing under coordination/design/TASK-20261002-33047e/.
      Bus-message files the top-level session's claim and release of
      TASK-20261002-729fc9 may have written under coordination/bus/ are NOT
