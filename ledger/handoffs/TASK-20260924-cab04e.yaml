      `-g` exclusion;
    - RLR-4: every read of another package's recorded result by any command
      of either plan or by the r3 wrapper (file, line, field, which package
      kind), whether RB-4 or RL-4 as worded covers it, and, for each package
      kind so read, whether any frozen checker item or r3 check fails a
      correctly recorded outcome that a dependent package's frozen logic acts
      on;
    - RLR-7: the ladder primes at which controls-a1 can run in a development
      world through an r4 a1 entry without a frozen-byte edit, with what it
      reads there and the frozen plan's watchdogs that bound it;
    - RLR-6 (informational): every reader of solver-events.json and whether a
      new top-level key changes what it computes.
    Report every value and every instance. Decide nothing and make no
    approval recommendation.

