# - lists every cross-package read of an r4-lineage package and whether the
#   frozen checkers fail any planned basis outcome by design (RLR-4);
# - states where controls-a1 can run in development (RLR-7);
# - lists every reader of solver-events.json (RLR-6, informational).
# It computes the draft's pre-declared readings, reports them, and decides
# nothing. Ordered by DEC-20260924-650068. Written by the Coordinator under
# TASK-20260924-53026a. Dispatched later by /run; this card launches nothing.
# Its one archival task is TASK-20260924-ddfb69.
