  constraints:
    - You are not alone. Own only the five listed write_scope paths; preserve all other work and immutable source records.
    - Maximum runs is zero. No fixture generation/evaluation, kernel/transcript computation, reference enumeration, panel scoring, experiments, or backend/transport measurement of any kind is authorized.
    - Do not import or execute fixtures.py, kernels.py, transcripts.py, reference.py, or certificates.py. Reading all implementation files as text is permitted. `python3 -m py_compile` static checks on touched files are permitted. Exactly one invocation of driver.main with NO binding arguments is permitted as a refusal demonstration (argparse must exit 2); any invocation with bindings supplied is forbidden.
    - C10 repair -- in driver.py check_launch_admission only, implement genuine content verification for all four bindings, each failure naming the exact piece -- (a) spec binding -- parse the spec file as YAML (host PyYAML), require experiment.status == 'approved' AND experiment.approved_by non-null AND sha256 equality with the caller-supplied hash; (b) manifest binding -- parse implementation-manifest.yaml, require its implementation_files_sha256 mapping, compare every declared per-file hash against actual on-disk bytes of the seven implementation .py files, refuse naming any missing entry or mismatched file; (c) review receipt binding -- parse the receipt as YAML, require top-level guard_recheck mapping with verdict exactly 'PASSED' and reviewed_commit a non-empty 40-character lowercase hex string, refuse otherwise; (d) launch-lock binding -- parse the lock as YAML or JSON, require non-empty task_id, owner, acquired_at, expires_at with expires_at strictly greater than acquired_at (lexicographic ISO-8601 comparison; no wall clock read), refuse otherwise. Update the module docstring only where its claims change; do not weaken any documented guarantee.
    - C9 disposal -- in transcripts.py and reference.py only, either wire TRAP_HORIZON (transcripts.py:150) into trap_real_distribution/trap_comparison_distribution and REFERENCE_TRAP_HORIZON (reference.py:325) into the reference trap functions so the step count derives from the constant (with the constant still 2, outputs must be textually-identical computations of x1,x2), or remove both constants with a stated reason. Do not change any numeric output for horizon 2; state the chosen option and the preservation argument in the report.
    - Update implementation-manifest.yaml implementation_files_sha256 entries for exactly the files changed (driver.py always; transcripts.py/reference.py iff touched), plus a one-paragraph repair annotation. No other manifest field changes.
    - Do not alter any kernel law, threshold, partition, ordering, certificate, or trap-classification logic. Do not implement panel scoring (deferred to the scientific successor by Coordinator decision, not this task).
    - Every null/unverifiable item carries its reason, never an invented value.
    - Bedrock providers/endpoints/model identifiers/fallbacks/probes are prohibited. No network calls.
