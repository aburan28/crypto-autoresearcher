# =============================================================================
# TASK-20260924-f6c337 -- Coordinator DESIGN SNAPSHOT ARCHIVE for N-CONV
# (DEC-20260924-833c70). Commits the proposal, hypothesis, frozen
# specification, approval decision and three task cards by exact path, BEFORE
# any executor is dispatched. Interprets nothing; runs nothing.
# Pattern: TASK-20260924-d3a90c.
#
# ID PROVENANCE: all IDs below were minted by the dispatching session with
# tools/allocate_id.py and checked with --check (relayed). SC-1 re-checks them.
# =============================================================================
handoff:
  id: TASK-20260924-f6c337
  from: coordinator
  to: coordinator
  archive_kind: snapshot
  kind: snapshot_archive
  recorded_at: '2026-09-24'
  question_id: RQ-CERTBIN-836ce2
  experiment_ids: [EXP-CERTBIN-ddfe75]
  hypothesis_ids: [H-CERTBIN-be6cbd]
  proposal_ids: [IDEA-20260924-8b28ea]
  approval_decision: DEC-20260924-833c70
  state: written_not_executed

  objective: >-
    Make the N-CONV design durable. Commit exactly the declared paths on the
    dispatching session's working branch (record its name in the receipt).
    Write a post-commit snapshot receipt with per-path sha256, the parent,
    the origin/main base commit checked and the merge outcome. Then push and
    open or refresh the PR naming the new records. Until this archive
    verifies, EXP-CERTBIN-ddfe75 is not approved in fact and
    TASK-20260924-7c1fb2 may not launch.

  uncertainty_reduced: Whether the bytes the executor implements against are the bytes that were approved, and whether the pinned engine is the engine on the branch.

  inputs:
    - ledger/decisions/DEC-20260924-833c70.yaml
    - origin/main

  constraints:
    - id: SC-0
      text: >-
        PLACE REFUSED FILES FIRST. If the runtime refused any of this
        subagent's writes, the dispatching session places the returned text
        verbatim at the declared path before anything else, and records that
        in the receipt.
    - id: SC-1
      text: >-
        ID CHECK. Run `python3 tools/allocate_id.py --check` on every ID in
        record_ids. On a collision, STOP: re-mint, and rename every reference
        in the declared files BEFORE the first commit (nothing binding them is
        committed yet). Record the rename in the receipt.
    - id: SC-2
      text: >-
        MERGE origin/main INTO THE BRANCH, NEVER REBASE. Record the base commit
        and the merge outcome. On a conflict inside a record, stop; never
        resolve it by editing a record.
    - id: SC-3
      text: >-
        VALIDATE. Parse every declared YAML file with a YAML loader. A parse
        error is a STOP and goes back to the Coordinator, since the files were
        written without a shell and checked by reading only. Then run
        tools/validate_ledger.py on the head and report no error line beyond
        the base's pre-existing set.
    - id: SC-4
      text: >-
        ENGINE PIN CHECK (EXP-CERTBIN-ddfe75 engine_provenance). Record the
        result of each:
        `git merge-base --is-ancestor 934bee5 HEAD`;
        `git rev-parse HEAD:src/crypto_autoresearcher/gf2` against
        `git rev-parse 934bee5:src/crypto_autoresearcher/gf2`;
        `sha256sum src/crypto_autoresearcher/gf2/_kernels.c` against
        c8f79d5961fffaf80428cdd29d0a53bfcc1e6d32ab07022931e3aacd926ca745.
        If any differs, STOP before the commit and return to the Coordinator:
        the pinned engine is not the branch's engine, and the specification
        needs a superseding decision, not an edit.
    - id: SC-5
      text: >-
        INPUTS DURABLE. Confirm that the archives binding the contract's inputs
        are committed and reachable: TASK-20260924-e27f93 (RUN-CERTBIN-c417e0),
        TASK-20260924-8f03d6 (red-team directory, DEC-20260924-e61f3b) and
        TASK-20260924-7b4e0d (KN-FIND-5a8d3e). Also confirm that the input
        sha256 values in EXP-CERTBIN-ddfe75 inputs.files equal the blobs on
        the branch. Record the results.
    - id: SC-6
      text: STAGE ONLY THE DECLARED PATHS, excluding any __pycache__. Run alone. Launch nothing (maximum_runs 0).
    - id: SC-7
      text: The PR text names the records, says that no executor has been dispatched, and carries no measured value.

  deliverables:
    - one commit naming TASK-20260924-f6c337 and every ID in record_ids
    - coordination/design/certbin-nconv-20260924/archives/TASK-20260924-f6c337/snapshot-receipt.json
    - the branch pushed, and the PR opened or refreshed naming the records

  record_ids:
    - IDEA-20260924-8b28ea
    - H-CERTBIN-be6cbd
    - EXP-CERTBIN-ddfe75
    - DEC-20260924-833c70
    - TASK-20260924-f6c337
    - TASK-20260924-7c1fb2
    - TASK-20260924-40b2ca

  artifact_paths:
    - ledger/proposals/IDEA-20260924-8b28ea.yaml
    - ledger/hypotheses/H-CERTBIN-be6cbd.yaml
    - experiments/EXP-CERTBIN-ddfe75/specification.yaml
    - experiments/EXP-CERTBIN-ddfe75/amendments/.gitkeep
    - experiments/EXP-CERTBIN-ddfe75/runs/.gitkeep
    - ledger/decisions/DEC-20260924-833c70.yaml
    - ledger/handoffs/TASK-20260924-f6c337.yaml
    - ledger/handoffs/TASK-20260924-7c1fb2.yaml
    - ledger/handoffs/TASK-20260924-40b2ca.yaml
    - coordination/design/certbin-nconv-20260924/archives/TASK-20260924-f6c337/snapshot-receipt.json
  write_scope:
    - coordination/design/certbin-nconv-20260924/archives/TASK-20260924-f6c337

  archived_by: TASK-20260924-f6c337

  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: true
    fallback_reason: Runtime inheritance (DEC-20260923-4d7a19 R-1 forward rule; DEC-20260924-8e2f47 R-E).
    degraded_allowed: false
    independent_session_required: false

  budget:
    wall_clock_seconds: 1800
    memory_gb: 2
    maximum_runs: 0

  completion_gate:
    - every ID in record_ids passes allocate_id.py --check (or was re-minted before commit, with the rename in the receipt)
    - SC-4 engine pin checks all pass and are recorded in the receipt
    - SC-5 input archives and input hashes confirmed and recorded
    - every declared YAML file parses, and tools/validate_ledger.py on the head reports no error line beyond the base's pre-existing set
    - the archive commit changes exactly the declared paths
    - the receipt's path_sha256 covers every declared file and matches the committed tree
    - the receipt records the branch, the origin/main base commit and the merge outcome
    - the branch is pushed and the PR names the records
    - no scientific trial was launched

  return_format: The receipt, the archive commit sha, the base commit checked, the merge outcome, the SC-4 and SC-5 results, any ID renames, and the PR URL.
