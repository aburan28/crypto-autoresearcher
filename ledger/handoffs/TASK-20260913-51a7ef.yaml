    - knowledge/literature/KN-LIT-012.md
    - knowledge/open-problems/KN-OPEN-86e7e1.md
    - knowledge/open-problems/KN-OPEN-94f456.md
  constraints:
    - >
      Derivation only. Instantiate no curve, solve no polynomial system, and
      claim no certificate. Assumption 1's degree bound of 4 is an INPUT taken
      from the paper, never a measurement.
    - >
      Every quoted formula comes from the frozen source. Where the source is
      ambiguous -- the k = n/m versus k = ceil(n/m) reading -- report BOTH and
      assert neither.
    - >
      Where a required comparator does not exist in the frozen source or the
      corpus, report the gap. Inventing a cost model and then validating the
      machinery against the invention is a fabricated comparator under core
      rule 9.
    - Observations only. Do not write an evidence record, move a hypothesis, or
      state a conclusion about any curve.
  deliverables:
