  objective: >
    Execute the two SEMBIN contracts whose execution DEC-20260913-ebd639
    authorized -- EXP-SEMBIN-f4a17b (memory-charged crossover against van
    Oorschot-Wiener parallel rho) and EXP-SEMBIN-81dc96 (Semaev's two-stage
    balance re-solved jointly over (m, t) with the n^{4 omega} cofactor
    charged) -- and retain every artifact the artifact policy requires. Record
    observations only.
  uncertainty_reduced: >
    Whether Semaev 2015's Section 4.5.2 conclusion about four FIPS binary curves
    survives charging the memory its relation store consumes (KN-OPEN-86e7e1),
    and whether the short-chain regime t < m that Section 3 step 3 declines is
    in fact the optimum of the paper's own cost model (KN-OPEN-94f456).
  inputs:
    - inputs/SEMAEV-2015-310/paper_fulltext.md
    - inputs/SEMAEV-2015-310/tables.yaml
    - experiments/EXP-SEMBIN-f4a17b/specification.yaml
    - experiments/EXP-SEMBIN-81dc96/specification.yaml
