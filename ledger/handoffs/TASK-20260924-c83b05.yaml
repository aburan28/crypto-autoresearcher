    - id: RV-5
      text: >-
        REPORT ON J2, J3 AND J4 ONLY. You cannot see J1 or J5-J10 by
        construction; a whole-claim verdict from you would be an opinion formed
        from a fraction of the evidence. The Coordinator composes the round.
    - id: RV-6
      text: >-
        AN INSTRUMENT DEFECT IS NOT A MATHEMATICAL RESULT. If J2 or J3 breaks,
        that is a statement about the measurement, never evidence for or
        against H-CERTBIN-5e71c9, E-A or E-G (INV-8). Say so in terms.
    - id: RV-7
      text: >-
        ZERO TRIALS. Verification computations permitted: the J2 constructions
        on at most 20 archived instances, the J3 checks and the J4
        aggregation. They run under your write scope, get no RUN-id and are
        declared command by command. You re-run no phase of the driver.
        Memory cap 3 GB.
    - id: RV-8
      text: >-
        CITE WITH PROVENANCE. A file you opened is `internal`. A source you
        recall but did not open is `recalled`, a pointer, never support.
    - id: RV-9
      text: >-
        DISCLOSED PRIOR (review-plan PD-R1). The Coordinator's review prior was
        written after it had read the run's results, so concurrence with it is
        weaker evidence than it looks. Attack the joints on their merits.
    - id: RV-10
      text: >-
        FLOOR/CEILING CAVEAT. For every J4 item, state whether the value sits
        at a floor or ceiling of its range, and therefore whether agreement is
        informative about the implementation.

