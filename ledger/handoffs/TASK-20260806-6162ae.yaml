handoff:
  id: TASK-20260806-6162ae
  recorded_at: '2026-08-06'
  from: coordinator
  to: executor
  objective: >-
    Execute the frozen contract EXP-REPL-1d1287: train the declared
    architectures at the declared capacities on real curve-point encodings and
    on the scrambled group, under identical budget, schedule and seeds, and
    report structure_gap -- the held-out advantage on the curve minus that on
    the scrambled null -- for every matched cell, with its combined standard
    error and its multiple of the pre-registered 5-sigma threshold. Place every
    trained model on the (S, T) preprocessing frontier against the reproduced
    table attack.
  uncertainty_reduced: >-
    Whether a learned model extracts ANY coordinate structure from
    elliptic-curve point encodings, isolated by a null that preserves the group
    and destroys the coordinates. Equivalently: whether a learned attack is
    generic, in which case the preprocessing bound applies verbatim and the lane
    is an occupied time-memory tradeoff, or non-generic, in which case there is
    a concrete artifact to interrogate.
  inputs:
    - IDEA-20260806-94676a
    - H-REPL-6c431d
    - experiments/EXP-REPL-1d1287/specification.yaml
    - KN-FIND-002
    - KN-FIND-b7e091
    - IDEA-20260806-c5d183
  constraints:
    - >-
      The contract is FROZEN. The 5-sigma threshold and the held-out sample
      sizes that realise it are part of the frozen prediction. The ONLY
      permitted adjustment is recomputing the comparison band from C6's measured
      seed variance, it happens before the curve arm is scored, and it may only
      WIDEN the band. Anything else is a protocol_amendment.
    - >-
      C6 (seed variance on the scrambled arm) runs FIRST. Deriving the band
      after seeing the curve arm is prohibited.
    - >-
      C2 (shuffled labels) and C3 (planted leaky encoding) are BLOCKING. C3 must
      reach at least 0.10 advantage; if it does not, halt and report -- a
      pipeline that has never detected structure cannot support a null result.
    - >-
      The dataset is the ONLY difference between the curve arm and the scrambled
      arm. Identical architecture, capacity, budget, schedule, seeds,
      tokenisation, preprocessing and early-stopping rule. Any other difference
      invalidates the pair.
    - >-
      Run BOTH split modes (random_by_logarithm and contiguous_block_by_logarithm)
      and report them separately. Reporting only the random split is prohibited.
    - >-
      Verify and record disjointness of the early-stopping slice from the
      reported held-out set. Do not assert it.
    - >-
      Report training-set accuracy separately and never as a headline number.
    - >-
      A gap in some cells but not all is INCONCLUSIVE by the frozen criterion,
      not a refutation. If any completed cell exceeds 5 sigma, stop extending
      the grid and redirect remaining budget to reproducing that cell across
      capacities, seeds and split modes.
    - >-
      Crashes, OOM and driver failures are infrastructure outcomes under
      AGENTS.md rule 5, never evidence about structure.
    - >-
      Observations only. No interpretation, no status change, no evidence record.
  deliverables:
    - immutable run records for every training run, with manifests
    - split manifests proving held-out and early-stopping-slice disjointness
    - per-run held-out predictions sufficient for independent recomputation
    - control outcomes C1-C6 with pass/fail and measured values
    - the C6 seed-variance measurement and resulting band, timestamped before
      any curve-arm scoring
    - S in bits raw and compressed per model, and the (S, T) frontier placement
    - execution report with the measured-vs-modeled table, columns unmixed, and
      the optimistic-assumption list with the direction of each bias
  artifact_paths:
    - experiments/EXP-REPL-1d1287/runs/
    - experiments/EXP-REPL-1d1287/curves.json
    - experiments/EXP-REPL-1d1287/execution-report.md
  archived_by: TASK-20260806-e7b1f7
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
    fallback_note: >-
      Policy aliases do not resolve to distinct models under this harness;
      record the resolved model in every run manifest with fallback_used set
      accordingly, and never silently substitute.
  budget:
    wall_clock_seconds: 720000
    memory_gb: 32
    maximum_runs: 400
  completion_gate:
    - C6 seed variance measured on the scrambled arm and the band fixed, before
      any curve-arm scoring, with a timestamp proving the order
    - C2 shuffled-label null at chance within 3 standard errors
    - C3 planted leaky encoding detected at >= 0.10 advantage
    - C5 table attack reproduced and its (S, T) measured
    - Split disjointness verified and recorded for both split modes
    - Every run carries a manifest with command, commit, environment, seed and
      resolved model identifier
    - structure_gap reported with combined standard error for every completed
      matched cell, alongside its matched scrambled-arm number in the same row
  return_format: >-
    Execution report plus immutable run records. Observations and measured
    values only; no interpretation, no status change, no evidence record.
