      and the smallest infeasible a falls, and whether the a = 1/4
      replication control reproduces EV-ECDLP-60e266's already-established
      G3-INFEASIBLE (FAIL 10/10 seeds) result at the larger N.
    coordinator_prior: >-
      Per the contract's own `preregistered_prediction` (an explicitly
      UNVERIFIED extrapolation from the N = 2^20 Stage 0 reading, not a
      re-derivation from a closed form): a = 1/16 is expected G3-FEASIBLE
      (5/5), extrapolating Stage 0's comfortably-clear-of-boundary margins;
      a = 1/8 is expected G3-FEASIBLE but BORDERLINE (around 4/5, possibly
      3/5 or 5/5), since Stage 0's own margins there straddle zero and
      N-dependence is genuinely untested -- this is the cell the
      Coordinator is least confident in and most expects to move; a = 3/16
      is expected G3-INFEASIBLE (around 1/5 or fewer); a = 1/4 (the
      replication control) is expected G3-INFEASIBLE 5/5, reproducing
      EV-ECDLP-60e266's 10/10 FAIL exactly. The crossing bracket is
      predicted to remain between a = 1/8 and a = 3/16, unchanged from the
      N = 2^20 reading, but this is exactly the thing under test: the most
      likely failure mode the Coordinator anticipates is NOT a genuine
      N-dependent reversal but a units/definition mismatch surfacing as
      disagreement between the blind and production readings at the
      borderline a = 1/8 cell specifically (the same class of defect
      F3/`distinguishable_outcomes` (b) names). A clean CONFIRMED result at
      a = 1/16 or a = 1/8 is this contract's most informative possible
      outcome and must be scrutinized hardest, not accepted on the first
      agreeing read.
    joints:
