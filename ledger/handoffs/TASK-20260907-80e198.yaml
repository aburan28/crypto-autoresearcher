  review_plan:
    claim_under_review: >-
      The contract's own claims as EXP-ECDLP-6ac801's Stage B/C will state
      them: at N = 2^24, r = 2, T_sel = T/2, for each a in
      {1/16, 1/8, 3/16, 1/4}, whether T_sel = T/2 is G3-feasible
