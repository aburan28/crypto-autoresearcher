          from the definitions in specification.yaml `definitions`, and
          SEAL the result (commit it to your own task directory with a
          hash and timestamp) -- exactly as TASK-20260906-bc1cfc's J2
          sealed its result before opening any run artifact. ONLY THEN open
          the executor's snapshot-archived Stage B/C output and the
          original v2 Stage 0 a-scan data. Compare cell by cell: same
          sign, margins within seed-to-seed noise, same per-a pass-count
          and G3-style verdict. Separately, re-read the executor's own
          reported criterion text against
          experiments/EXP-ECDLP-612fb1/specification.v2.yaml's
          `inputs.g3_gate_procedure` verbatim to catch any wording or
          units drift (control (d)). Evaluate the a = 1/4 cell's agreement
          with EV-ECDLP-60e266 as a first-order check on your own blind
          method's correctness (see `proves_too_much` below) before
          trusting your own reading of the three novel cells.
        breaking_artifact: >-
          Any (a, seed) cell where the sealed blind result disagrees with
          the production result beyond seed-to-seed noise in sign or in
          the resulting pass/fail classification; any a where the blind
          and production per-a G3-style verdicts disagree; the a = 1/4
          control failing to reproduce G3-INFEASIBLE under EITHER reading;
          or any demonstrable wording/units drift between the applied
          criterion and the v2 contract's own g3_gate_procedure text.
    blindness:
      mutual: false
      lifted_for: []
      rationale: >-
        This is a SINGLE-REVIEWER round: no red team is dispatched this
        batch, per the user's recorded approval choice ("Approve as frozen
        (Recommended)", which did not request a second reviewer, and per
        the contract's own `review_note` treating a red-team pass as
