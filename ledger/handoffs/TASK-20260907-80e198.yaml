          executor's pipeline)
      failure_signature: >-
        The sealed blind re-derivation must independently score this cell
        G3-INFEASIBLE (>= 4/5 seeds with exact top-T_sel share BELOW
        STATIC(T) exact coverage) under the reviewer's own from-scratch
