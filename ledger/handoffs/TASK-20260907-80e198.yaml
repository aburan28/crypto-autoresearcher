        the reviewer's own method is broken (a units, definition, or
        implementation error in the from-scratch computation), and no
        verdict this task reports at a in {1/16, 1/8, 3/16} may be trusted
        until that is understood and fixed.
      assigned_to: TASK-20260907-80e198
    blind_rederivation:
      required: true
      quantity: >-
        exact top-T_sel (= T/2) basin share and STATIC(T)_{r=2} exact
        coverage at each a in {1/16, 1/8, 3/16, 1/4}, N = 2^24, from the
        exact basin-partition definition alone (a uniformly random
        function on N points truncated at an independent Bernoulli(1/W)
        marking, per HEUR-BLT-1) -- NOT a re-read of any run's own
        analysis output and NOT an inspection of
        experiments/EXP-ECDLP-612fb1/source_v2/'s implementation before
        the seal.
      parameters: "N = 2^24; a_grid = {1/16, 1/8, 3/16, 1/4}; r = 2; T_sel = T/2 = 128; 5 seeds"
      blind_from:
        - experiments/EXP-ECDLP-612fb1/source_v2/
        - experiments/EXP-ECDLP-612fb1/runs/RUN-ECDLP-612fb1-v2-ascan-*/
        - experiments/EXP-ECDLP-612fb1/runs/RUN-ECDLP-612fb1-v2-analysis-001/
        - experiments/EXP-ECDLP-6ac801/runs/
      assigned_to: TASK-20260907-80e198
    procedure_deviations: []
  return_format: >-
