handoff:
  id: TASK-20260822-53748a
  from: coordinator
  to: red-team
  objective: Independent red-team review at the snapshot commit. Work ONLY your assigned joints in
    review_plan.
  uncertainty_reduced: whether the certified rank over Q and the stated gap survive scrutiny
  inputs:
  - coordination/goals/GOAL-ECQ-001/batches/BATCH-7e06d3/archives/TASK-20260822-66bacf/receipt.yaml
  - coordination/goals/GOAL-ECQ-001/batches/BATCH-7e06d3/tasks/TASK-20260822-81141a
  - coordination/goals/GOAL-ECRANK-002/batches/BATCH-e0caa5/tasks/TASK-20260822-a7a9e8
  - ledger/hypotheses/H-ECQ-cec3c4.yaml
  constraints:
  - Read the SNAPSHOT COMMIT, not the live worktree.
  - You may not read the other reviewer's report in this round.
  - You change no research status and no raw artifact.
  - 'ROUTING: this round is review-adversarial because the expected result is an ordinary bounded
    measurement. IF the producer actually certifies rank >= 31 over Q, that is a claimed breakthrough
    and routing_rules send it to review-breakthrough instead -- STOP and say so rather than reviewing
    a record claim at this tier.'
  - Record the model that actually answered alongside the requested policy; refuse rather than downgrade.
  deliverables:
  - coordination/goals/GOAL-ECQ-001/batches/BATCH-7e06d3/tasks/TASK-20260822-53748a/red_team_report.md
  artifact_paths:
  - coordination/goals/GOAL-ECQ-001/batches/BATCH-7e06d3/tasks/TASK-20260822-53748a/red_team_report.md
  archived_by: TASK-20260822-2fa82a
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 1800
    memory_gb: 2
    maximum_runs: 12
  completion_gate:
  - every assigned joint answered with a verdict and a supporting artifact
  - attestation block naming requested policy and resolved model
  return_format: role review report per the role contract
  review_plan:
    claim_under_review: 'As the producer states it: (a) the 8-point cubic pencil is a rational elliptic
      surface with 8 independent sections over Q(t); (b) the best CERTIFIED rank over Q found by
      sieving and certifying its specialisations; (c) the measured gap to 31 on two axes, base rank
      over Q(t) and sieve volume.'
    coordinator_prior: Recorded before any reviewer runs. The Coordinator expects P1 to HOLD (8 independent
      sections), P2 to hold marginally (certified rank 11-14, not more), and P3 to HOLD decisively
      -- nothing close to 31. The Coordinator further expects the SIEVE to look more productive than
      it is, because the Mestre-Nagao statistic already underperformed in GOAL-ECRANK-001. If the
      producer reports a large sieve yield, that is the first thing to disbelieve.
    joints:
    - joint: The 8 sections are genuinely independent, i.e. the 8 base points were in general position
        and the surface really has rank 8 over Q(t).
      assigned_to: TASK-20260822-0a0041
      attack_plan: Specialise at several independent t0 and recompute the 8x8 height regulator yourself.
        A dependent section set shows up as a near-singular regulator at EVERY t0, not just one.
        Also check the 9th base point was computed, not assumed, and that the pencil is not degenerate
        (a reducible member masquerading as a fibre).
      breaking_artifact: a singular or near-singular 8x8 regulator at multiple independent specialisations
    - joint: Every rank reported over Q is backed by that many exhibited independent points on that
        exact curve.
      assigned_to: TASK-20260822-0a0041
      attack_plan: 'For each claimed curve recompute: points on curve in exact arithmetic, and the
        r x r regulator. Check specifically that the producer did not inherit rank from the generic
        fibre by Silverman specialisation without recertifying on the specialised curve -- specialisation
        is a theorem about all but finitely many t, and "all but finitely many" is not a certificate
        for the t actually used.'
      breaking_artifact: a claimed rank whose points are fewer, dependent, or on a different curve
    - joint: The Mestre-Nagao statistic was used ONLY to order candidates and never contributed to
        a certified rank.
      assigned_to: TASK-20260822-53748a
      attack_plan: 'Trace every reported rank back to exhibited points. Then attack the sieve accounting:
        what fraction of certified candidates came from the top of the MN ordering versus a random
        sample of the same size? GOAL-ECRANK-001 measured MN ordering yielding nothing above rank
        4 in the top 400 of 364756. If no random control was run, the claimed sieve efficiency is
        unsupported.'
      breaking_artifact: a rank justified by an MN score, or a sieve-efficiency claim with no random
        control
    - joint: The gap to 31 is measured on BOTH axes and the result is not framed as progress toward
        the record.
      assigned_to: TASK-20260822-53748a
      attack_plan: The record is 30 (Alpoge-Howell 2026) and rests on a Q(t) base of roughly 18-20.
        A rank-8 base is not "most of the way" to that by any reading. Challenge any framing in which
        a rank-12-ish curve is presented as approaching 31, any extrapolation from sieve volume that
        ignores base rank, and any use of the word progress that is not attached to a number.
      breaking_artifact: a deliverable that reads as progress toward the record without the two-axis
        gap
    blindness:
      mutual: true
      lifted_for: []
      rationale: null
    proves_too_much:
      objects:
      - the Alpoge-Howell rank-30 curve, already re-verified by this program in RUN-ECRANK-e1e30e-003
        (30 points exact, regulator 1.07e37, least eigenvalue 0.294) -- the certification harness
        must return exactly 30 on it, no more
      - a curve of KNOWN small rank, e.g. conductor 37 with rank 1, on which the harness must return
        1 and not more
      - a specialisation deliberately chosen at a bad fibre, where the 8 sections are NOT expected
        to stay independent and the harness must not silently report rank 8
      failure_signature: On each object the harness must return the known value. A harness that reports
        more than 30 on the record curve, or more than 1 on the rank-1 curve, is counting dependent
        points and every number it produced is void.
      assigned_to: TASK-20260822-0a0041
    blind_rederivation:
      required: true
      quantity: 'the certified rank of the single best curve the producer reports over Q: the number
        of exhibited points that are pairwise independent under the Neron-Tate pairing'
      parameters: the a-invariants of that curve exactly as the producer reports them, and nothing
        else
      blind_from:
      - coordination/goals/GOAL-ECQ-001/batches/BATCH-7e06d3/tasks/TASK-20260822-81141a
      - coordination/goals/GOAL-ECQ-001/batches/BATCH-7e06d3/tasks/TASK-20260822-81141a/src
      assigned_to: TASK-20260822-0a0041
    procedure_deviations: []
