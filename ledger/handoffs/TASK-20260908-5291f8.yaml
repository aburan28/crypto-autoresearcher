  - Fresh seeds EXACTLY as declared (760906/760908/760910/760912/760914/760916); random.Random(seed) derivations; no seed adjustment ever; derived-seed practice forbidden.
  - Full artifact policy per run under experiments/EXP-ECRANK-73275e/runs/<RUN-ID>/ -- nested run-record [SR-3] carrying RUN_REQUIRED_TOP, plus command.txt, environment.json, stdout.log, stderr.log, raw-result.json, manifest.yaml.
