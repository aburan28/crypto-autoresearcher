    Seven enumerated runs in the amendment's fixed order -- CONTROL
    ADMISSION FIRST: R9 amended known-false d=(1..1) seed 760912 (IV-1R
    n=6 conic-rejection assertion: every object rejected
    degenerate_deg_s_2 with the nonzero x^2 coefficient recorded,
    certified n=6 total exactly 0; IV-1C n=8 certified-total 7 on all 8
    tuples at the top rung of the FIXED ladder 1500/10000/100000, all
    rungs reported, graded outcome PASS or CERTIFIER_LIMITED); R10
    planted ELLIPTIC n=6 seed 760908 (IV-3R: exactly 9 plants from the
    R3-family shape -- prescribed pattern + n=6 quadratic solve, deg s=4,
    distinct (b-tuple, pattern) pairs, builder frozen in run source
    before any R10 step, never importing R3's found list; detection 9/9;
    exponent window [0.699, 1.301]; per-decade [5, 20] where applicable);
    R11 planted n=8 seed 760914 (R7 family, elliptic at n=8, ladder
    applied); R15 null re-run seed 760916 (IV-4R: exactly 0 solutions,
    non-destructive b_index-0 proof per RD-1) -- THEN READINGS: R12
    construct-n6 replication seed 760906 (10^4 b-tuples, H in
    {10^2,10^3,10^4}, PLUS the N2R dual-convention reconciliation:
    record both height predicates VERBATIM from the frozen v2 source into
    the raw result BEFORE any count; report N_6 per H under convention A
    (r_height of the full r vector) and convention B (rat_height of the
    solved free coordinate in canonical minimal form); full per-instance
    cross-tabulation; decade ratios under BOTH conventions as frozen
    DESCRIPTIVE tail_checks against the x100 prediction -- report, never
    interpret); R13 bit-for-bit replay of R12 (IV-2R, string-keyed
    canonical comparison per RD-2); R14 construct-n8 rescoped seed
    760910 (10^4 b-tuples, counted-ops cap 2.0e9, IC-732-3 integer box
    [-min(H,20),min(H,20)]^2 RETAINED and disclosed verbatim in every raw
    result as the declared enumeration scope, H in {10^2,10^3}, counts
    under both conventions). Per-run stopping: counted-ops cap (1.0e8;
    R14: 2.0e9) OR 7200 s wall, whichever first; ops_cap_respected the
    EXACT boolean; exhaustion reported as exhaustion, inert in both
    directions. Control-admission stop: R9 IV-1R or R15 failure stops the
    batch before R12/R13/R14 with preserved receipts; R10 detection
    failure does NOT stop execution but voids R12/R14 COUNT readings
    (counts stay lower bounds) and is recorded. Record the actual
    machine/OS/Python/runtime/model provenance in every manifest plus the
    explicit same-machine independence disclosure required by the
    amendment. The Executor records observations only, interprets
    nothing, selects no interpretation branch, and changes no status.
  uncertainty_reduced: >
