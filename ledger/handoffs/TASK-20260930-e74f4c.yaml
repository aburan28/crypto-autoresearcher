# COMPOSER for the GOAL-MONO-001 rule-12 closure review, BATCH-44adf9. It
# implements the composition leg of DEC-20260930-3a0b7b NA-1: "a fresh
# Coordinator session composes J1-J4 into a decision that either adopts
# criterion (c) and/or (a) as met, moves GOAL-MONO-001 to completed together
# with the KN-OPEN-009 supersession, and promotes knowledge per the gate; or
# records the DISSENT and keeps the goal active."
#
# The top-level session pre-minted TASK-20260930-e74f4c and reports that
# --check found it free. Written by a Coordinator subagent that has no shell.
# Zero runs. This card changes no status. Only the decision it produces can
# do that, and only once TASK-20260930-f4f675 has verified it.
#
# RESERVED IDENTIFIERS. This subagent may not mint identifiers, and none is
# invented here. Three tokens stand in for identifiers that the top-level
# session mints with tools/allocate_id.py and confirms with --check. It then
# replaces every occurrence of each token in this file and in
# coordination/goals/GOAL-MONO-001/batches/BATCH-44adf9/dispatch_queue.json,
# BEFORE either file is first committed:
#   DEC-20260930-8553d4     composed decision
#       (`--next decision --date 20260930`, or the date of composition)
#   KN-FIND-fde7cf  finding, used on an
#       adopting outcome only
#   KN-OPEN-450599  successor open problem,
#       used on an adopting outcome only
# Committing either file while any token remains is forbidden (DP-C3). The
# same tokens appear in ledger/handoffs/TASK-20260930-f4f675.yaml.
handoff:
  id: TASK-20260930-e74f4c
  from: coordinator
  to: coordinator
  goal_id: GOAL-MONO-001
  batch_id: BATCH-44adf9
  authorized_by: DEC-20260930-3a0b7b
  reserved_ids:
    composed_decision_id: to be minted by the top-level session
    composed_decision_token: DEC-20260930-8553d4
    knowledge_finding_id: to be minted by the top-level session (used on an adopting outcome only)
    knowledge_finding_token: KN-FIND-fde7cf
    knowledge_open_problem_id: to be minted by the top-level session (used on an adopting outcome only)
    knowledge_open_problem_token: KN-OPEN-450599
    note: >-
      The composer uses only these identifiers. If an outcome needs a record
      these do not cover (for example an EV-*, CORR-* or a second KN-*
      entry), the composer stops that part, records the need in the
      worksheet, and returns. The top-level session mints the extra
      identifier and a Coordinator records it in a queue revision. The
      composer never invents or guesses an identifier. An unused reserved
      identifier is recorded as unused in the decision and is never reused.
  objective: >-
    Compose the per-joint verdicts of TASK-20260930-40470a (J1, J2, J3 and J4,
    plus the proves-too-much control and the blind re-derivation) under
    REVIEW-MONO-20260930-40470a. Compose them into ONE Coordinator decision,
    DEC-20260930-8553d4, that does exactly one of two
    things. EITHER it adopts completion criterion (c) and/or (a) of
    GOAL-MONO-001 as met, with the quote trail. In that case it moves
    GOAL-MONO-001 to completed, carries the KN-OPEN-009 supersession deferred
    by DEC-20260810-2f86db, and promotes knowledge per the gate. OR it
    records the DISSENT (or the non-adopting disposition the plan's
    composition section leads to), states which route or routes remain
    open, and keeps GOAL-MONO-001 active with exactly one next action.
    Compose only from the committed review bytes bound by TASK-20260930-a72623.
    Zero runs.
  uncertainty_reduced: >-
    None by measurement. This task decides whether GOAL-MONO-001 closes, and
    on which criterion. It is the program's strongest claim type, a goal
    closure, resting on DEC-20260810-2f86db (route c) and/or
    DEC-20260904-dd58c3 (route a) as reviewed.
  inputs:
    - coordination/review/mono-20260930-44adf9/review-plan.yaml
    - ledger/handoffs/TASK-20260930-40470a.yaml
    - ledger/decisions/DEC-20260930-3a0b7b.yaml
    - coordination/goals/GOAL-MONO-001/review/TASK-20260930-40470a/review_report.md
    - coordination/goals/GOAL-MONO-001/review/TASK-20260930-40470a/s4_construction/computations.json
    - coordination/goals/GOAL-MONO-001/batches/BATCH-44adf9/archives/TASK-20260930-a72623/snapshot-receipt.json
    - coordination/goals/GOAL-MONO-001/batches/BATCH-44adf9/archives/TASK-20260930-a72623/runtime-session-receipt.json
    - coordination/goals/GOAL-MONO-001/batches/BATCH-44adf9/dispatch_queue.json
    - ledger/goals/GOAL-MONO-001/goal.yaml
    - ledger/goals/GOAL-MONO-001/checkpoints/BATCH-003.yaml
    - ledger/decisions/DEC-20260810-2f86db.yaml
    - ledger/decisions/DEC-20260802-a51c82.yaml
    - ledger/decisions/DEC-20260904-67cde4.yaml
    - ledger/decisions/DEC-20260904-dd58c3.yaml
    - ledger/decisions/DEC-20260905-021e6e.yaml
    - ledger/evidence/EV-MONO-a0a89c.yaml
    - ledger/evidence/EV-MONO-e9dc3b.yaml
    - ledger/hypotheses/H-MONO-ebd400.yaml
    - ledger/corrections/CORR-20260802-1d8384.yaml
    - ledger/corrections/CORR-20260904-33fbf3.yaml
    - ledger/questions/RQ-MONO-001.yaml
    - knowledge/open-problems/KN-OPEN-009.md
    - knowledge/findings/KN-FIND-c41ea9.md
    - knowledge/findings/KN-FIND-edd62c.md
    - knowledge/findings/KN-FIND-19f5ea.md
    - knowledge/README.md
    - .claude/skills/curate-knowledge/SKILL.md
    - AGENTS.md
    - agents/coordinator.md
    - templates/research-records.md
    - docs/claims-and-verification.md
    - docs/concurrent-goal-lanes.md
    - docs/target-result-profile.md
  read_scope:
    - AGENTS.md
    - CLAUDE.md
    - agents/coordinator.md
    - templates/research-records.md
    - docs/
    - coordination/review/mono-20260930-44adf9/
    - coordination/goals/GOAL-MONO-001/review/TASK-20260930-40470a/
    - coordination/goals/GOAL-MONO-001/batches/BATCH-44adf9/
    - ledger/
    - knowledge/
    - .claude/skills/curate-knowledge/SKILL.md
  read_scope_note: >-
    The composer is not blind. It must see the whole report at once. It
    does not read experiments/EXP-MONO-4b50b6/ or
    coordination/goals/GOAL-MONO-001/batches/BATCH-003/. Those paths were
    the reviewer's blind_from, so the composer judges the reviewer's
    re-derivation on its own terms and does not re-derive from the
    producer.
  write_scope:
    - coordination/goals/GOAL-MONO-001/batches/BATCH-44adf9/composition/TASK-20260930-e74f4c/
    - ledger/decisions/DEC-20260930-8553d4.yaml
    - ledger/goals/GOAL-MONO-001/goal.yaml
    - ledger/goals/GOAL-MONO-001/checkpoints/BATCH-44adf9.yaml
    - knowledge/findings/KN-FIND-fde7cf.md
    - knowledge/open-problems/KN-OPEN-450599.md
    - knowledge/open-problems/KN-OPEN-009.md
  write_scope_note: >-
    The composer WRITES the decision, the checkpoint shard and the additive
    goal-head projection. On an adopting outcome only, it also writes the
    two knowledge entries and the superseded_by pointer on KN-OPEN-009.
    It does not DECLARE any of these as artifacts. TASK-20260930-f4f675 owns
    them, and it is the task that makes them official. The composer's only
    declared artifact is its worksheet.
  constraints:
    - >-
      CM-1 FIRST ACT, before reading the report: write the worksheet skeleton.
      It holds a header, the card id, a procedure section, an attestation stub
      naming this session, and every joint pending. Record in it verbatim
      what the top-level session pasted into the launch prompt: the sha256 of
      review_report.md, s4_construction/computations.json and
      runtime-session-receipt.json, and the verbatim output of
      tools/check_review_independence.py for this round, whatever it reports.
      Compare the three digests with the path_sha256 that TASK-20260930-a72623
      recorded (its receipt and the queue's archive block). A mismatch is a
      custody failure: stop, compose nothing, and report. This role has no
      shell, so every digest is the top-level session's report, recorded as
      such.
    - >-
      CM-2 VALIDITY BEFORE INTERPRETATION. Check the report against every
      TASK-20260930-40470a completion_gate item. Required: an explicit CONCUR,
      DISSENT or INCONCLUSIVE with reasons for each of J1-J4, and a reading
      declaration per joint. The proves-too-much result on BOTH objects,
      with the stopping or failing step named. A blind re-derivation covering
      m=3 and m=4, with at least 20 random factor-base tuples at m=4, on an
      S_4 the reviewer built itself, with the statement that the blind_from
      paths were not opened. A review_attestation with requested policy,
      served effort, runtime, model, fallback_used, model_verified and
      read_sibling_reports false. Zero runs, and nothing written outside the
      write scope (read the a72623 scope findings). Also check the runtime
      receipt: the served effort was max and the model identifier contains
      no "bedrock" (DP-3). A failed item is not evidence. List it
      concretely, and the decision returns the review for repair or re-run
      under a successor card. The goal stays active. A report missing the
      max tier is NOT a rule-12 review (composition entry C-9): no route may
      be adopted on it, and IMP-1 stands.
    - >-
      CM-3 COMPOSE UNDER THE PLAN. Apply the `composition` section of
      coordination/review/mono-20260930-44adf9/review-plan.yaml (entries
      C-1 to C-11, all quoted from the handoff, DEC-20260930-3a0b7b,
      DEC-20260810-2f86db and CLAUDE.md rule 8). Also apply any Coordinator
      plan amendment committed BEFORE TASK-20260930-40470a launched. Name the
      entry applied for every ruling. The reviewer's opinion on the whole
      goal, if it gives one, is not a vote (C-1).
    - >-
      CM-4 GAPS ARE NOT FILLED AFTER THE FACT. The plan lists four
      composition questions its sources leave open (unstated_in_sources). If
      the report actually lands in one of them and no pre-review amendment
      settles it, do not invent a key. Do not adopt the route the gap
      affects. Record the gap, the verdicts as reported, and, as the
      decision's first next action, a Coordinator protocol_amendment that
      settles the gap, after which a fresh composition is made. That
      disposition is not a DISSENT and not negative evidence. A gap the
      report does not touch needs nothing.
    - >-
      CM-5 PRIOR. In the worksheet, compare the outcome with the recorded
      coordinator_prior joint by joint (plan prior_by_joint). A prior the
      review overturns is reported plainly.
    - >-
      CM-6 ADOPTING OUTCOME. The decision quotes criterion (c) and/or (a)
      from ledger/goals/GOAL-MONO-001/goal.yaml and gives the quote trail to
      DEC-20260810-2f86db and/or DEC-20260904-dd58c3 as reviewed. Before
      recording closure, check and record: the refutation-artifact basis the
      no-go rests on, declared as derivation, certificate or empirical_only
      (docs/claims-and-verification.md "Refutation artifacts"); the
      agents/coordinator.md "Closure gate", naming the committed obstruction
      the closure cites, or stating that none is committed; and the scope
      statement (tested curves, primes, m, instrument, claim tier toy;
      composition entry C-11). If a binding gate is unmet, do not record
      closure, and make the missing artifact the first next action. On
      closure: GOAL-MONO-001 goes active -> completed in goal.yaml. Close
      IMP-1 as cleared by this review. Repeat the model-correlation
      disclosure (C-10). Change no hypothesis, experiment, evidence or
      question status (J3; C-11).
    - >-
      CM-7 KNOWLEDGE ON AN ADOPTING OUTCOME (C-4). Carry the KN-OPEN-009
      supersession. Use DEC-20260810-2f86db's intended split as the starting
      shape, adjusted for J2's staleness findings, since DEC-20260904-dd58c3
      settled the m=4 imprimitivity/monodromy disjunction at toy scale.
      Write knowledge/findings/KN-FIND-fde7cf.md
      and/or knowledge/open-problems/KN-OPEN-450599.md
      following /curate-knowledge and the knowledge/README.md frontmatter.
      Set `superseded_by` on knowledge/open-problems/KN-OPEN-009.md; that is
      its only permitted edit. Fill knowledge_promotion: promote when the
      gate is met (the decision is support or reject_scoped on
      replicated/strong evidence, and proven boundaries count), otherwise
      give a concrete not_warranted reason. List every knowledge path
      actually written, exactly, in the decision under
      `ledger_archive_scope_additions`, so that the top-level session can
      revise TASK-20260930-f4f675 before claiming it. knowledge/INDEX.md is
      generated and gitignored. Do not write it.
    - >-
      CM-8 NON-ADOPTING OUTCOME. Record the DISSENT or the other
      disposition, with every defect tied to its joint and to the plan's
      breaking_artifact. State which route (c) or (a) remains open under C-2.
      GOAL-MONO-001 stays active (CLAUDE.md rule 10: never paused). Record
      whether IMP-1 is cleared, because a tier-valid review was obtained, or
      still stands. Give exactly one next action. Write no knowledge file.
      KN-OPEN-009 stays as written. Record the two reserved KN identifiers
      as unused. `ledger_archive_scope_additions` is [].
    - >-
      CM-9 DECISION FILE. Write
      ledger/decisions/DEC-20260930-8553d4.yaml (with
      the minted id substituted) as a coordinator_decision per
      templates/research-records.md. Include: id, recorded_at, goal_id
      GOAL-MONO-001, batch_id BATCH-44adf9, decision, decision_label,
      target_ids, rulings (each naming the composition entry applied),
      rationale, evidence_refs (committed paths only), limitations
      (including C-10 and DEC-20260930-3a0b7b PD-B: one reviewer owns every
      joint), procedure_deviations, goal_checkpoint, next_actions (exactly
      one first), knowledge_promotion, ledger_archive_scope_additions,
      reserved_ids_used_and_unused, runs_launched 0, decided_by coordinator,
      and inference.
    - >-
      CM-10 GOAL HEAD, ADDITIVE ONLY. Write the write-once shard
      ledger/goals/GOAL-MONO-001/checkpoints/BATCH-44adf9.yaml in the
      BATCH-003.yaml format. In ledger/goals/GOAL-MONO-001/goal.yaml make
      only additive edits, per docs/concurrent-goal-lanes.md "Lanes" and
      DEC-20260930-3a0b7b goal_checkpoint.projection_note: this lane's
      checkpoint pointer and its dated next_action, plus the status scalar on
      an adopting outcome only. Rewrite no existing text. Do not use
      `paused` or `blocked`.
    - >-
      CM-11 NO EDITS ELSEWHERE. Edit no review report, runtime or snapshot
      receipt, plan, handoff, queue, hypothesis, evidence, experiment or
      question record. A defect found in any of them is recorded in the
      decision. It is never repaired in place.
    - >-
      CM-12 An infrastructure, custody, tool or provenance defect is not a
      mathematical result. A timeout or killed session is never negative
      evidence (C-8).
    - >-
      CM-13 CONTINUATION. Skeleton first, then joint by joint. If this
      session is killed, a FRESH Coordinator session of the same policy
      continues THIS card from its own partial worksheet and declared inputs
      only. It obtains fresh digests from the top-level session, compares
      them with those recorded first, redoes any incomplete joint from
      scratch, and discloses the continuation in the procedure section. A
      kill is infrastructure, never evidence.
    - >-
      CM-14 No git, no shell, no dispatch, no new identifier and zero runs.
      No review content goes into any message or bus post before the
      decision is official.
  deliverables:
    - >-
      coordination/goals/GOAL-MONO-001/batches/BATCH-44adf9/composition/TASK-20260930-e74f4c/composition-worksheet.yaml.
      It holds: the digests as received and their comparison with the
      a72623 receipt; the independence-check output; the CM-2 validity
      table; a joint-by-joint table giving each verdict as reported, the
      composition entry applied and the disposition; the proves-too-much and
      blind re-derivation dispositions; any composition gap hit (CM-4); the
      prior-versus-outcome table; and the procedure section.
    - >-
      ledger/decisions/DEC-20260930-8553d4.yaml (owned
      by TASK-20260930-f4f675).
    - >-
      ledger/goals/GOAL-MONO-001/checkpoints/BATCH-44adf9.yaml and the
      additive projection on ledger/goals/GOAL-MONO-001/goal.yaml (owned by
      TASK-20260930-f4f675).
    - >-
      Adopting outcome only: the knowledge entries and the KN-OPEN-009
      superseded_by pointer (CM-7). Each is listed exactly in the decision's
      ledger_archive_scope_additions.
  artifact_paths:
    - coordination/goals/GOAL-MONO-001/batches/BATCH-44adf9/composition/TASK-20260930-e74f4c/composition-worksheet.yaml
  archived_by: TASK-20260930-f4f675
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    reasoning_effort_note: null = policy default (high).
    fallback_allowed: true
    fallback_note: >-
      Runtime inheritance under the Claude Code harness. Backend or model
      substitution only, and never below the policy's effort. Record
      fallback_used, the resolved model identifier and model_verified
      truthfully. Never Bedrock.
    degraded_allowed: false
    independent_session_required: true
    independent_session_note: >-
      A FRESH Coordinator session. It is not the session that wrote
      DEC-20260930-3a0b7b or TASK-20260930-40470a, not the BATCH-44adf9
      opening session that wrote this card and the plan extraction, not the
      reviewer, and not the session that wrote DEC-20260810-2f86db.
  budget:
    wall_clock_seconds: 7200
    wall_clock_note: >-
      Advisory under docs/research-budget-policy.md. It is a watchdog
      checkpoint. Expiry checkpoints the task (CM-13) and records no verdict.
    memory_gb: 4
    maximum_runs: 0
  dispatch_preconditions:
    - id: DP-C1
      text: >-
        archived_by TASK-20260930-f4f675 is bound on this card. AGENTS.md
        standing precondition 1.
    - id: DP-C2
      text: >-
        TASK-20260930-a72623 is committed, its receipt VERIFIED by
        tools/research_dispatch.py, and pushed, with the PR refreshed. The
        review bytes are therefore committed inputs (standing precondition 2).
    - id: DP-C3
      text: >-
        Every reserved token has been replaced by an identifier minted with
        tools/allocate_id.py and confirmed with --check, in this file, in
        TASK-20260930-f4f675.yaml and in the queue, BEFORE those files were
        first committed. A grep for "TO-BE-MINTED-BY-THE-TOP-LEVEL-SESSION"
        over the three files returns nothing.
    - id: DP-C4
      text: >-
        Immediately before launch, the top-level session computes the sha256
        of the three committed review-side files and runs
        tools/check_review_independence.py for this round. It pastes both,
        verbatim, into the launch prompt (CM-1).
    - id: DP-C5
      text: >-
        A task claim, made after git fetch, via `python3 tools/goal_lanes.py
        claim coordination/goals/GOAL-MONO-001/batches/BATCH-44adf9/dispatch_queue.json
        TASK-20260930-e74f4c --as <addr> --ttl-minutes N --publish` before
        launch. It is released with --outcome on return. Standing
        precondition 3.
    - id: DP-C6
      text: >-
        A FRESH Coordinator session meeting independent_session_note.
  completion_gate:
    - The digests and the independence-check output were recorded in the worksheet before the report was read, and match the a72623 receipt.
    - The CM-2 validity table is complete. Any failed item is listed concretely, and no route is adopted on an invalid or non-max report.
    - Every joint (J1-J4), the proves-too-much control and the blind re-derivation has a composed disposition naming the plan composition entry applied. Any composition gap hit is recorded under CM-4 and not filled.
    - The prior-versus-outcome table is present.
    - The decision file carries the CM-9 field set, knowledge_promotion filled, runs_launched 0 and exactly one first next action.
    - An adopting decision records the refutation-artifact basis, the closure-gate check and the scoped statement, and lists every knowledge path in ledger_archive_scope_additions. A non-adopting decision keeps GOAL-MONO-001 active and lists [].
    - The checkpoint shard is written, the goal head is projected additively only, and no other record is edited. Zero runs.
  return_format: >-
    The decision id and disposition, the route adopted or left open, the
    ledger_archive_scope_additions list, and the worksheet path. No review
    content goes into any message.
  review_plan: null
  review_plan_note: >-
    The composer applies REVIEW-MONO-20260930-40470a. It opens no new round.
  runs_launched: 0
