          t_Delta different from the frozen formula's value; or a
          systematic difference between small_x_offset and small_x other
          than the x-height.
      - joint: J-DISP -- DISPERSION ROBUSTNESS. The outcome class does not depend on the dispersion model of the scored arm beyond what the frozen dispersion_robustness check reports.
        assigned_to: TASK-20261009-bfdc5b
        attack_plan: >-
          Recompute rho_A and rho_M with the curve-cluster bootstrap 95%
          interval, and z_A with V scaled by its upper end. Then vary the
          model: gamma-mixed per-curve rates, zero inflation, a heavy-tailed
          per-curve count law fitted to the null arms, leave-top-10-curves
          out, and per-rung splits. For each, recompute z_A and the
          governing upper bound.
        breaking_artifact: >-
          A dispersion model consistent with the null arms under which the
          outcome class changes, while the outcome id carries no
          dispersion-sensitive flag.
      - joint: J-COV -- THE UPPER BOUND U_A AND ITS COVERAGE. Both bounds of analysis.upper_bound_U_A, their simulated coverages at kappa 1.00, 1.10 and 1.15, the AR-3 choice of the governing bound, and X_rel are computed as frozen, and the governing bound's coverage holds under plausible departures from the simulation model.
        assigned_to: TASK-20261009-bfdc5b
        attack_plan: >-
          Re-implement the signed-quantile and |dev|-quantile bounds and the
          simulation rule (binomial thinning for kappa < 1) from the text.
          Re-simulate the coverage at kappa 1.00, 1.10 and 1.15 with at
          least 4000 synthetic designs each and independent seeds; report
          each coverage with its Monte Carlo SE, and whether the AR-3 choice
          is stable across seeds. Then re-simulate coverage under compound
          planting and under the departures J-DISP finds consistent with the
          null arms. Recompute X_rel under both plantings.
          Where it breaks if anywhere: the coverage simulation and the
          governing-bound choice.
        breaking_artifact: >-
          A recomputed governing bound on the other side of 1.15 from the
          recorded one; a governing-bound coverage at kappa 1.15 below 0.90
          under a departure consistent with the null arms; an AR-3 choice
          that flips with the seed in a way that changes the outcome class;
          or an X_rel on the other side of 1.15 from the recorded one.
      - joint: J-P0IN -- P0 INPUT PROVENANCE (DEC-20261008-8cb005 FP-2). No pinned script read a p0_inputs_not_used field of EXP-PFDR-011cd0 design.json (such as estimates.TT4), and the P0 values follow from the declared inputs.
        assigned_to: TASK-20261009-bfdc5b
        attack_plan: >-
          From design_a.py and analyze_a.py p0 (static reading of every file
          open and key access), list every input file and key P0 reads.
          Recompute n_b, mu_b, D_plan, K_plant, S and the height-screen list
          from the declared inputs only, and compare with design.json and
          power.json.
        breaking_artifact: >-
          A read of a p0_inputs_not_used field by any pinned script; or a P0
          value that differs from its recomputation from the declared
          inputs.
    blindness:
      mutual: true
      lifted_for: []
      rationale: null
    proves_too_much:
      objects:
        - random_sub_r0 scored as structured against (random_sub_r1, random_sub_r2, known_null_sub) -- a true null
        - random_sub_r1 scored against (random_sub_r0, random_sub_r2, known_null_sub) -- a true null
        - random_sub_r2 scored against (random_sub_r0, random_sub_r1, known_null_sub) -- a true null
        - known_null_sub scored against (random_sub_r0, random_sub_r1, random_sub_r2) -- a true null
        - planted_target -- a known excess of exactly K_plant TT relations per rung on the declared curves S (expected kappa about 1.15)
      failure_signature: >-
        The argument has proved too much if any of these holds:
        (a) on planted_target it concludes "no excess, bounded at the
            target": z <= t_dec together with a governing upper bound at or
            below 1.15. A known excess at the target would then be declared
            absent.
        (b) on the four null pseudo-cells, the number it calls an excess
            (z > t_dec) has P(K_null >= K) < 0.01 under the simulated joint
            law.
        (c) on the four null pseudo-cells, more governing upper bounds fall
            below 1.00 than the simulated coverage at kappa 1.00 makes
            plausible at the 0.01 level. An instrument that bounds true
            nulls below 1 is biased low on the scored arm.
        The correct behaviour is: planted_target detected (z > t_dec), or
        at least bounded above 1.15; the null cells inside the joint law,
        with bounds covering 1.00 at the stated rate.
      assigned_to: TASK-20261009-bfdc5b
    blind_rederivation:
