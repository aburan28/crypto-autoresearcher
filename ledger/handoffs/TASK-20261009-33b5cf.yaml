      quantity: >-
        For the cell small_x, TT, m = 4, pooled over the 30- and 32-bit rungs
        of this experiment's fresh curves, by specification.yaml
        analysis.statistic (CC-8 of EXP-PFDR-011cd0, pooled per CC-10):
        - C_A (small_x);
        - C_R (mean of random_sub_r0, r1, r2), reported also as 3 x C_R;
        - V = max(sum_j s_j^2, C_R);
        - z_A = (C_A - C_R)/sqrt(4V/3);
        - z_M for small_x_offset against the same randoms;
        - z_Delta = (C_A - C_M)/sqrt(2V) on the curves where M is admitted;
        - U_A: BOTH the signed-quantile bound and the |dev|-quantile bound
