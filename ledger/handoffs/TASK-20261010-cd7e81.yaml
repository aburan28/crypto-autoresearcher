  from: coordinator
  to: executor
  dispatch_state: written_not_dispatched
  status: written_not_dispatched
  objective: >-
    In a later run session, execute the frozen exact public affine
    x-sum census for EXP-ECTD-97777a once and record observations only.
    Preserve the complete hit list, including an explicit empty list
    if W=0, and the separate permuted-label null count.
