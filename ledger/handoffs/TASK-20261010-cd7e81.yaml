  constraints:
    - Keep p=89, a=b=1, pair eligibility, ordering, seed, and permutation frozen.
    - Run only RUN-ECTD-63f478 through the committed approved trial plan.
    - Verify prime, nonsingular, Hasse, ordinary, point and pair completeness, and group-law controls before scoring W.
    - Preserve candidate, eligible, exclusive exclusion, W, and W_perm counts and all hit witnesses.
