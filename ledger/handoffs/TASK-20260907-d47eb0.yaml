      (4) IV-1 IS WHERE I EXPECT THIS ROUND TO BREAK, and I record that
      before either report returns. The frozen control fixes certified
      totals on the known-false all-ones family at n minus 1, that is 5 at
      n equals 6 and 7 at n equals 8, and says IV-1 failure voids ALL runs.
