    - >-
      A COUNTEREXAMPLE IS THE STRONGEST AVAILABLE REFUTATION ARTIFACT AND IS PREFERRED
      TO AN ARGUMENT. DECLARE YOUR BASIS explicitly -- counterexample certificate,
      derivation note, or empirical_only, in that order of preference. AN UNDECLARED
