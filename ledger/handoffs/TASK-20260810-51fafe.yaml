handoff:
  id: TASK-20260810-51fafe
  from: coordinator
  to: executor
  objective: >-
    RANK 1 OF BATCH-005. Attempt CAND-806-A's BOUNDED-INDEX-SUBGROUP RESIDUAL: the
    bounded-index subgroup statement replacing Step 3's group closure. THE OBJECT,
    verbatim from the committed TASK-20260801-806 report section 3.3 route 2: "a
    bounded-index subgroup statement replacing the group closure: that the relation
    'pi(u), pi(u+v) share a <=B-set' contains a subgroup of translations of index
    bounded in B. That is a genuine open question and is not answered here." THE
    QUESTION: does such a subgroup exist; if it does, what is the index bound as a
    function of B; and does it actually REPAIR the Step-1/2/3 induction -- is it
    TYPE-STABLE, emitted by Step 1 under branching AND consumed by Step 1 again, so
    the induction closes? THREE OUTCOMES ARE ALL COMPLETE AND NONE IS A FAILURE:
    (A) a numbered proposition with an index bound and an explicit type-stability
    verdict; (B) a COUNTEREXAMPLE CERTIFICATE, re-verifiable from committed code,
    that no such subgroup exists in the named setting; (C) the named degenerate
    answer (a subgroup always exists but its index is not bounded in B, or only
    trivially by |X|). MANUFACTURING A STATEMENT THAT DOES NOT FOLLOW WOULD BE FAR
    WORSE THAN RETURNING NONE.
  uncertainty_reduced: >-
    Whether the campaign's ONLY exponent-relevant forward-looking item contains
    anything. This residual is EXPLICITLY OPEN AND HAS NEVER BEEN ATTEMPTED BY ANYONE:
    it was screened out at an interface constant of 30 under a rule its sibling screen
    says gives 1 (RT-8), an error traceable to the Coordinator's own prior guidance
    (D-811-2), and it is the type-stable invariant a repair of the induction would
    need. IT IS THE GROUND ON WHICH THIS CAMPAIGN WAS NOT PAUSED, and BATCH-005 -- the
    last batch that may open new research questions -- IS ITS LAST REALISTIC SLOT.
