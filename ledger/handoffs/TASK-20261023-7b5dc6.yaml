    claim_under_review: 'With the Grunewald-Zimmert (rank >= 8) and Brumer-Kramer (rank >= 9) curves retrieved from
      Dujella''s rank-history pages and the lane-1 rank-7 curve as overlap: N_E(10^5) on the two record curves is
