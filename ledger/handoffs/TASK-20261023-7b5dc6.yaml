      every coverage cell with N >= 30 has ratio to the uniform model in [0.5, 1.5] with median in [0.8, 1.2], and
      no H_half(p) is resolved on either record curve for p >= 1000 at H <= 3 x 10^5.'
    coordinator_prior: I expect the record curves to carry fewer small points than the rank-7 curve because of their
      large generators, so the result says more about regulators than about rank; the coverage result inherits the
      a255fc instrument limit. This is a prior, not an outcome.
    joints:
    - id: R1
      joint: 'The record curves support H-CZLIFT-27a184: higher rank does not buy more small points, and global
        lifts stay useless on record-rank curves.'
      assigned_to: TASK-20261023-7b5dc6
      attack_plan: Attribute the low counts to coefficient height and regulator versus rank, using the curve data;
        decide whether 'rank does not help' or 'these curves have large generators' is the supported reading. Check
        the rank labels (lower bounds; the rank-7 label recalled) and the LMFDB claim that could not be re-checked.
      breaking_artifact: A reading under which the data say nothing about rank, or a rank label the conclusion depends
        on that is not established.
    - id: R2
      joint: The coverage clauses carry evidence given the instrument limit found on EXP-CZLIFT-a255fc and the saturated-cell
        exclusion.
      assigned_to: TASK-20261023-7b5dc6
      attack_plan: Apply the a255fc finding (coverage ratio cannot exceed about 1.3 for distinct residues at small
        N/N_p) and the unstated saturated-cell exclusion; state what the coverage criterion can still test here.
      breaking_artifact: A coverage clause presented as evidence that the instrument cannot fail.
    blindness:
