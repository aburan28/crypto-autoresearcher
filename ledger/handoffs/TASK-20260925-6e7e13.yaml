  constraints:
    - >-
      CA-1 FIRST ACT, before reading any report. Write the worksheet skeleton
      and record in it, verbatim, report_digests_as_received (the six sha256
      digests the top-level session pasted: the three reports and the
      computations.json beside each) and the pasted output of python3
      tools/check_review_independence.py --plan
      coordination/review/nistbin-20260925-b67954/review-plan.yaml --reports
      <the three report files>, whatever it reports, with --blind-history
      recorded as UNCHECKABLE (R-CARRIED R8), never as passed. Compose only
      from bytes with those digests. This role holds no shell; custody becomes
      durable only when TASK-20260925-a9c531 reproduces them (plan
      custody_without_seal).
    - >-
      CA-2 COMPOSE UNDER THE FROZEN KEYS. Apply the plan's composition keys as
      written (K-approve, K-revise-defect, K-fixture, K-indeterminate, K-leak,
      K-duplicate, K-impediment, K-infra, any_tripwire) and name the key applied
      for every ruling. A whole-claim opinion from a blinded reviewer is not a
      vote. Relaxing a key after reading the reports needs a
      protocol_amendment and cannot be done in a composition.
    - >-
      CA-3 J9 FIRST. Before applying any key, compare J9 with v2 value by value
      (the Q1 rows; the Q2 values and optimising m under v2's numbered k
      reading; the Q3 D*(m) values) within the plan's tolerance. A divergence J9
      reports only between readings v2 declares and discloses does not fire
      K-indeterminate (the R-J5 lesson).
    - >-
      CA-4 GATE CHECK (R-PREREVIEW-GATE composer_check). Read
      whitelist-grep-v2.yaml, blind-inputs-amendment-01.yaml and the
      TASK-20260925-792b02 receipt, and check that every gate file is present,
      every hit is disposed of (redaction, exclusion or disclosed leak), the Q3
      m-set and omega-set are pinned as parameters, and the degree-extension
      statement is present. A retained hit fires K-leak. A misclassified hit or
      a missing file is a procedure finding disclosed in DEC-20260925-41f6dc,
      never repaired by silently re-running a review.
    - >-
      CA-5 TRIPWIRES. If any of TA-1 to TA-5 was reported or is found, apply its
      stated effect as the plan writes it (TA-5 is a custody failure and there
      is no composition until a scoped repair decision).
    - >-
      CA-6 PRIOR. Compare the outcome with the prior recorded in the plan, joint
      by joint, in the worksheet.
    - >-
      CA-7 DECISION FILE. Write DEC-20260925-41f6dc with DEC-20260924-124667's
      field set: decision (approve | revise | ...), decision_label, rulings,
      rationale, evidence_refs, limitations, next_actions with exactly one
      first, knowledge_promotion, inference, procedure_deviations,
      runs_launched 0, status_transitions, official_until. Under K-approve it
      approves 'EXP-NISTBIN-451dfa version 2' under the standing user
      authorization and its first next action opens an execution batch whose
      executor card is minted then; under any other key it lists every defect
      with its joint and breaking artifact and applies that key's stated next
      action.
    - >-
      CA-8 NO EDITS, NO OVER-PROMOTION. Edit no hypothesis, specification, plan,
      gate file, report or goal head; the approval, if any, takes effect only
      through the specification's conditional approval block when
      TASK-20260925-a9c531 verifies. Promote no claim beyond what the keys
      permit.
    - >-
      CA-9 HOLDS (R-ONE-BATCH; NA-8). Carry the HOLD-F and HOLD-G row-set
      condition if the revised row set changes it (DEC-20260924-124667 R-NA7),
      and apply X-KOBLITZ and X-CERTBIN if they have fired. Carry no lane-B
      hold.
    - >-
      CA-10 Fill knowledge_promotion; a protocol approval or refusal is expected
      to be not_warranted with a concrete reason.
    - >-
      CA-11 An instrument, custody, tool or provenance defect is not a
      mathematical result, and an infrastructure failure or a killed session is
      never negative evidence (plan K-infra).
    - >-
      CA-12 OUTCOME DISCIPLINE. No sentence opens or closes the 571 cell. No
      AUXIN census value, RUN-FROB-627924 value, EXP-FROB-30006a outcome,
      lane-B reviewer value or anything from experiments/EXP-QSP-70b731/runs/;
      do not read experiments/EXP-FROB-30006a/, experiments/EXP-QSP-70b731/runs/,
      the cursor/semaev-2015-audit-program-5b8b ref or PR #1377.
    - >-
      CA-13 R-CONTINUATION. Skeleton first (header, card id, the six digests,
      the independence-check output, a procedure section, an attestation stub,
      every joint pending), then joint by joint. A continuing fresh Coordinator
      session obtains fresh digests from the top-level session and compares
      them with those the worksheet recorded first and with the launch prompt
      (a mismatch is a custody failure), redoes any incomplete joint from
      scratch and discloses the continuation in the procedure section.
    - >-
      CA-14 ZERO RUNS, NO GIT, NO DISPATCH, NO NEW ID.
