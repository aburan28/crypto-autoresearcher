handoff:
  id: TASK-20260908-470642
  from: coordinator
  to: executor
  objective: >-
    Execute Stage 1 (pilot) of EXP-ECDLP-1de2ec per the frozen contract:
    N = 2^24, a = 1/4, r = 2, k = 4, T_0 in {T_BL, T_BL/2, 0}, U in
    {1, 2*T_BL, 16*T_BL} (= {1, 512, 4096} at N = 2^24), 3 seeds. Measure
    the precomputed-entry ratio T_0(U)/T_BL(1) at fixed (P per entry, L,
    epsilon) for the batch-grown table of IDEA-20260906-a3d6ae against the
    static Bernstein-Lange table built from the same pool, together with
    every control: the U = 1 baseline T_BL arm, the pure-Kuhn-Struik T_0 = 0
    arm, the LOWER/UPPER bracket accounting, the union-find-disabled null
    (NULL1), the first-10% binding slice, the capped/uncapped memory arms
    with S_peak, and the phi decay. The pilot must SEPARATE "the batch
    supplies coverage" from "the batch supplies only pending relations that
    never resolve" before any scale-up (F1 gate). Stages 2-4 are NOT
    authorized by this handoff; they are a separate Coordinator decision
    after the pilot.
  inputs:
    - experiments/EXP-ECDLP-1de2ec/specification.yaml
    - ledger/hypotheses/H-ECDLP-32fad8.yaml
    - ledger/decisions/DEC-20260908-23a12e.yaml
    - ledger/proposals/IDEA-20260906-a3d6ae.yaml
    - ledger/questions/RQ-ECDLP-78dbc5.yaml
    - ledger/hypotheses/H-ECDLP-37dc01.yaml
  constraints:
    - >-
      Execute Stage 1 (pilot) only, per the frozen contract. Stages 2-4 are
      NOT authorized by this handoff.
    - >-
      The contract is frozen (status: approved, frozen: true,
      execution_authorized: true). Do not modify any protocol field. Any
      post-hoc change to the T_0 grid, the U grid, the k grid, the
      tolerances, the success margin or the pre-registered prediction
      requires a versioned protocol_amendment; runs already executed are
      never re-scored.
    - >-
      Record observations only. Do not interpret, promote, or change any
      hypothesis or experiment status. The Coordinator alone may promote,
      reject, or expand a research direction.
    - >-
      Write only within the declared write_scope:
      experiments/EXP-ECDLP-1de2ec/{runs,implementation,execution-report.yaml}.
      Do not write outside this scope.
    - >-
      No commit, push, or PR. The Coordinator's archival task
      TASK-20260908-c8ce9e handles the snapshot commit.
    - >-
      Amazon Bedrock is prohibited as a cost guardrail. No runtime, agent,
      workflow, fallback, or model probe may select a provider, backend,
      endpoint, or model identifier containing "bedrock" (case-insensitive).
    - >-
      Every citation carries its provenance: recalled | retrieved | kb |
      internal. A recalled reference is a pointer, never support.
    - >-
      A timeout, crash, or implementation failure is not evidence against a
      mathematical hypothesis (AGENTS.md rule 5). Budget exhaustion is
      F-infra, never a negative.
    - >-
      The generic arm solves nothing and certifies nothing; only curve-arm
      cells may be quoted as solved logarithms.
    - >-
      Do not use B71, attack, speedup, novelty, support, completion, or
      breakthrough language.
    - >-
      Do not touch any frozen H-* record.
  deliverables:
    - >-
      experiments/EXP-ECDLP-1de2ec/runs/RUN-*/manifest.yaml with exact
      command, git commit and dirty-tree state, environment, requested
      policy, resolved model identifier and fallback flag, seeds, wall
      clock, peak_rss_bytes
    - >-
      experiments/EXP-ECDLP-1de2ec/runs/RUN-*/raw-result.json with one
      record per (arm, target): walks used, steps per walk, outcome type
      (i)-(iv), hit entry, time-of-resolution, and for the curve arm the
      certificate; per-target S, S_peak, union-find operations, restart and
      lookup counts
    - >-
      experiments/EXP-ECDLP-1de2ec/runs/RUN-*/summary.json with per-arm
      per-U solved fractions (batch average and first-10%), T_0(U)/T_BL(1)
      with bootstrap CIs, LOWER/UPPER brackets, S_peak, outcome-type
      histograms, time-of-resolution histograms, component-size
      distributions
    - >-
      experiments/EXP-ECDLP-1de2ec/execution-report.yaml per the executor's
      required output format
  artifact_paths:
    - experiments/EXP-ECDLP-1de2ec/runs/
    - experiments/EXP-ECDLP-1de2ec/implementation/
    - experiments/EXP-ECDLP-1de2ec/execution-report.yaml
  write_scope:
    - experiments/EXP-ECDLP-1de2ec/runs/
    - experiments/EXP-ECDLP-1de2ec/implementation/
    - experiments/EXP-ECDLP-1de2ec/execution-report.yaml
  archived_by: TASK-20260908-c8ce9e
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 3600
    memory_gb: 8
    maximum_runs: 20
  budget_note: >-
    Stage 1 (pilot) only: 20 runs (3 seeds x ~6 arm-cells + analysis). The
    full contract budget is 120 runs / 8 CPU-hours / 8 GB; this handoff
    dispatches the pilot subset. Time and CPU estimates are advisory
    (docs/research-budget-policy.md); the memory cap is machine protection.
  completion_gate:
    - >-
      All Stage 1 pilot cells executed: N = 2^24, a = 1/4, r = 2, k = 4,
      T_0 in {T_BL, T_BL/2, 0}, U in {1, 512, 4096}, 3 seeds, all arms
      (BASELINE, GROW-UNCAP, GROW-CAP, NULL1, KS, PHI).
    - >-
      F1 gate evaluated: (i) GROW-UNCAP(T_BL/2) shows a T_0 reduction
      CI-separated from BASELINE(T_BL/2) at U = 4096, AND (ii) NULL1(T_BL/2)
      shows NO T_0 reduction (equals BASELINE within CI) at U = 4096, AND
      (iii) the measured solved fraction is inside the LOWER/UPPER brackets
      at every pilot cell.
    - >-
      All required artifacts present: manifests, raw-result.json,
      summary.json, execution-report.yaml.
    - >-
      No protocol field modified; no frozen H-* record touched; no commit,
      push, or PR.
  review_plan: null
  review_note: >-
    Claim-relevant producer; on completion the dispatch card must carry
    review_required: true with a dependent Validator task (blind
    re-derivation of the T_0(U)/T_BL(1) ratio and of the LOWER/UPPER
    brackets at 2^24 from the statement of the quantities, blind to the
    producer's implementation) and a Red Team task on the null and decay
    design.
  uncertainty_reduced: >-
    Whether the batch-grown table of IDEA-20260906-a3d6ae reduces the
    precomputed entries needed at fixed (P, L, epsilon) below the
    Bernstein-Lange selected-table frontier, with the F1 gate separating
    "the batch supplies coverage" from "the batch supplies only pending
    relations that never resolve" before any scale-up.
