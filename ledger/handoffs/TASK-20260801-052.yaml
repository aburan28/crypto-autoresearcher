handoff:
  id: TASK-20260801-052
  from: coordinator
  to: coordinator
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-025
  objective: >-
    Freeze the reading rule RR-LPF-1 and its attainability argument ATTAIN-RR-LPF-1 in a SEPARATE
    FILE, substituting the measured calibration numbers into the branch conditions, bands and cuts
    already frozen in the specification, and DEMONSTRATING with measured numbers that some
    achievable measurement lands in every branch.
  uncertainty_reduced: >-
    Whether the frozen decision rule, once populated with real numbers, is a rule a real
    measurement can actually satisfy in every branch - the question whose negative answer ended
    BATCH-022 and BATCH-024.
  inputs:
  - experiments/EXP-LPF-001/specification.yaml
  - experiments/EXP-LPF-001/results/calib/
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-calib/raw-result.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/reviews/TASK-20260801-051/calibration_validation_report.yaml
  constraints:
  - 'PROCEED ONLY IF TASK-20260801-051 RETURNED ADMISSIBLE. A NOT ADMISSIBLE calibration is not a base for a freeze and the batch stops.'
  - >-
    SUBSTITUTION ONLY. No branch may be added, removed, merged, reordered or reworded; no cut may
    move; no statistic may be added or dropped except by the strike mechanisms the specification
    already defines (a statistic that cannot move under DVV-LPF-1 or PERTURB-MOVE-1), and every
    strike must be recorded with its measured justification.
  - 'EVERY NUMBER YOU WRITE MUST TRACE TO A NAMED ARCHIVED ARRAY and be reproducible from it by a stated operation - which order statistic of which array at which cell.'
  - >-
    DEMONSTRATE TAIL-LPF-1's ATTAINABILITY IN BOTH DIRECTIONS WITH MEASURED NUMBERS - the band, the
    measured minimum and maximum of the 200 calibration values, the product control's T_deep above
    the upper edge, and the rough ladder's top rung below the lower edge. A missing directional
    demonstration means that direction is UNCERTIFIED and the rule must say so; both missing means
    the statistic is STRUCK.
  - >-
    COMPUTE AND RECORD THE END-TO-END PROBABILITY THAT A CORRECT UNIFORM SAMPLE REACHES L-2, from
    the measured bands, BEFORE the measurement runs. A favourable branch that a correct null reaches
    with probability near 1 is a branch that could not have failed (RT048-B2), and a favourable
    branch a correct null almost never reaches is the BATCH-022 defect. Report the number either way.
  - >-
    WRITE THE EXACT BINOMIAL CUT FOR THE APPARATUS-IDENTITY LEG AS A FROZEN INTEGER, computed
    pre-datum from the per-comparison level and the comparison count, and record that computation.
    NO UNBANDED EXISTENTIAL LEG MAY APPEAR ANYWHERE IN THE RULE.
  - >-
    RECORD, DO NOT RESOLVE, ANY AMBIGUITY. Any clause admitting two readings is written with BOTH
    readings named, marked as an open item, and ROUTED TO TASK-20260801-054. You may not choose.
    Choosing after a calibration number exists is ATS-LPF-1 clause 4 latitude however it is
    justified.
  - 'CLASSIFY EVERY BRANCH DEMONSTRATED-REACHABLE or REACHABLE-IN-PRINCIPLE and say which, and state for each leg WHICH ARM PRODUCES THE QUANTITY IT READS.'
  - 'VERIFY AND STATE that no branch keys on any ledger status.'
  - 'Do not edit experiments/EXP-LPF-001/specification.yaml. Do not look at any real-object quantity; none exists yet.'
  - 'MAKE NO COMMIT; TASK-20260801-053 archives.'
  - 'Every YAML written must parse.'
  deliverables:
  - experiments/EXP-LPF-001/reading_rule.yaml carrying RR-LPF-1 and ATTAIN-RR-LPF-1
  artifact_paths:
  - experiments/EXP-LPF-001/reading_rule.yaml
  archived_by: TASK-20260801-053
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 5400
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
  - 'RR-LPF-1 frozen with every band traced to a named archived array and a stated operation.'
  - 'TAIL-LPF-1''s attainability demonstrated in both directions or the affected direction declared uncertified.'
  - 'The end-to-end probability that a correct null reaches L-2 computed and recorded.'
  - 'The apparatus-identity leg carrying a frozen exact-binomial integer cut with its computation.'
  - 'Every branch classified and every leg''s producing arm named; no branch keying on a ledger status.'
  - 'Every ambiguity recorded unresolved and routed to TASK-20260801-054; the specification unedited; no commit made.'
