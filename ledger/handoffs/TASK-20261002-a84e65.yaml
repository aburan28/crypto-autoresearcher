handoff:
  id: TASK-20261002-a84e65
  from: coordinator
  to: idea-generator
  objective: >-
    Draft a complete, approvable experiment contract (templates/research-
    records.md "Experiment", plus the "Heuristic-validation experiment" pattern
    of .claude/skills/design-experiment/SKILL.md) that tests HEUR-HARVEST-FV-1
    clause (a). The test asks whether N_2(F_V) has the same distribution as
    N_2(F*). N_2 counts unordered pairs {{a, b}, {c, d}} in F with a + b = c + d,
    excluding formal identities. F* is a uniformly random list of the same
    size, closed under negation, and also under pi on Koblitz curves with
    sigma-stable V. The test runs on toy binary curves with n in {31, 37, 41,
    43, 47}. The contract must be decidable from predefined metrics, include
    a positive control the test must flag, and be executable in seconds per
    cell.
  uncertainty_reduced: >-
    Whether the F_2-linear condition x(Q) in V imposes additive structure on
    <P> that a uniformly random closure-matched list does not have. Clause 1(a)
    is the cheapest discriminator in the restatement. A departure falsifies the
    distributional premise on which HEUR-HARVEST-FV-2's random-model
    justification rests, and would make F_V an object worth attacking (an
    exponent-relevant positive). A pass makes the restated family's numbers
    validatable for the first time, at toy scale and with transfer by
    assumption.
  inputs:
    - coordination/tasks/TASK-20261001-9b3e70/proposed-records/heuristic-restatement.md
    - coordination/tasks/TASK-20261001-9b3e70/proposed-records/H-SEMBIN-c7e1d4.yaml
    - coordination/tasks/TASK-20261001-9b3e70/DERIVATION.md
    - ledger/decisions/DEC-20261002-7a3f19.yaml
    - ledger/evidence/EV-SEMBIN-b6d042.yaml
