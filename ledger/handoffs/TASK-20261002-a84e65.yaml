    - .claude/skills/design-experiment/SKILL.md
    - templates/research-records.md
    - docs/claims-and-verification.md
    - docs/inventor-protocol.md
    - docs/target-result-profile.md
    - knowledge/findings/KN-FIND-ffe1df.md
  constraints:
    - >-
      ZERO SCIENTIFIC RUNS AND NO IMPLEMENTATION OF THE MEASUREMENT. No N_2, no
      decomposition count and no statistic of any F_V is computed by this
      task, at any scale. Scratch arithmetic to size samples (for example,
      lambda_2 ~ |F|^4/(8 l) at chosen D) is allowed and is reported as
      scratch. Curve selection is NOT done here. The contract specifies the
      selection procedure, with fixed seeds, for the executor's pre-run step.
    - >-
      STATE THE HEURISTIC EXACTLY. Copy HEUR-HARVEST-FV-1(a)'s formal statement
      from heuristic-restatement.md section 4. Do not edit it. Name every
      quantifier: curves, V, D, the closure group, and the exclusion set of
      formal identities, including the pi-image exclusions on Koblitz curves.
      If you find the statement ambiguous or untestable as worded, say so in a
      separate section with a proposed restatement. Do not silently design
      around it. REVIEW-SEMBIN-20261002-c7e1d4 JR-3 rules on the statement in
      parallel.
    - >-
      PRE-REGISTERED PREDICTION. The null F* defines the predicted
      distribution, and the contract says how lambda_2 is estimated from the
      null sample, NOT from the scratch formula, which the restatement itself
      says must not fix the constant. It also says what is compared: a
      two-sample KS of N_2(F_V) across subspaces against N_2(F*) across null
      lists; Poisson(lambda-hat_null) goodness of fit; and the largest
      standardised excess over all cells against the Bonferroni-corrected tail.
      State the alpha (the restatement proposes 10^-3, Bonferroni) and the
      multiplicity count before any run.
    - >-
      SAMPLE-SIZE JUSTIFICATION from the smallest effect the test must resolve
      at each lambda_2 in {2^-2, 2^0, 2^2, 2^4, 2^6}, as the design skill
      requires. At lambda_2 = 2^-2 most draws give N_2 = 0. Say what the test
      can and cannot detect there, and size the subspace and null counts
      accordingly. "10 subspaces / 100 null lists" from V1 is a starting
      point, not a requirement.
    - >-
      CONTROLS. (i) The null F*, generated as +-(r_i P) for random r_i (plus
      pi-orbits on Koblitz), which calibrates the counter and the test. (ii)
      The positive control F_AP = +-{P, 2P, ..., (|F|/2) P}, which must be
      flagged at p < 10^-6. (iii) A planted-coincidence control: lists with a
      known number of injected non-trivial coincidences, with the counter
      required to return exactly that number. (iv) A second scale (at least two
      n) so that the comparison is not scale-specific. (v) Seed independence
      across cells, declared. (vi) A nearby-object control: an object where
      additive structure is KNOWN to be present and is not an arithmetic
      progression, or a stated reason none is available at toy scale.
    - >-
      GATES THAT CAN FAIL, LEARNED FROM JV-2 (DEC-20261002-7a3f19 R3). The
      counter's correctness check is written from the definition with no
      shared code. That means an independent brute-force N_2 on small lists,
      and the planted control above. Enumerator completeness (every pair
      hashed exactly once) is checked independently of the enumerator. The
      formal-identity exclusion is tested on hand-built cases. A mutation
      self-test must include at least one mutant per defect class the design
      identifies, not only structural ones.
    - >-
      SCALE AND TRANSFER, STATED. Toy n only. Transfer to n >= 97 is BY
      ASSUMPTION and must be written as such. V3 (n in {131, 163}, D = 16,
      predicted N_2 = 0) may be included as a disclosed-weak arm. A zero there
      cannot confirm a dense-regime rate.
    - >-
      DECIDABLE OUTCOMES. Name the outcome that counts as a FALSIFICATION of
      HEUR-HARVEST-FV-1(a), the outcome that counts as a PASS, and the outcome
      that is INCONCLUSIVE (for example, the positive control not flagged or
      the null failing its own calibration). A timeout, crash or
      memory stop is infrastructure, never evidence.
    - >-
      The hypothesis link is H-SEMBIN-c7e1d4 prediction P3, which is NOT
      filed. The draft contract is written with hypothesis_id H-SEMBIN-c7e1d4
      and status review_required, and says it cannot be approved until that
      record, or a superseding one carrying HEUR-HARVEST-FV-1, is filed
      (DEC-20261002-7a3f19 R11).
    - >-
      PARETO HONESTY. dominated_by and sota_delta are required, checked against
      KN-FIND-ffe1df and the KR-RHO rows. A heuristic-validation experiment
      claims no attack. Its sota_delta is 0 unless it falsifies.
    - NO CLAIM ABOUT THE SECURITY OF ANY CURVE in either direction.
    - >-
      INDEPENDENCE: this session must not be the session that authored
      TASK-20261001-9b3e70, because the test's designer should not be the
      heuristic's author.
    - >-
      WRITE SCOPE: coordination/tasks/TASK-20261002-a84e65/ ONLY. Mint draft
      identifiers with `python3 tools/allocate_id.py --next experiment --area
      SEMBIN` if a shell is available. Otherwise disclose hand-chosen tokens.
