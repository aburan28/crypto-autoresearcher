handoff:
  id: TASK-20260801-810
  from: coordinator
  to: red-team
  objective: >-
    ADVERSARIAL review of the committed BATCH-004 producer package, on ONE of two
    branches determined by what TASK-20260801-806 actually produced. Determine the
    branch FIRST from the committed artifacts and state which you are on.
    BRANCH A — A COST OR ASYMPTOTIC STATEMENT EXISTS: this is the red-team half of
    promotion gate (4), which DEC-20260731-026 requires before any asymptotic
    claim may move toward `supported`. Attack the COST MODEL and the HEURISTICS:
    try to break the bound, find the assumption that is doing the work, find the
    cost the accounting omits, and find the parameter regime where the claimed
    advantage disappears.
    BRANCH B — NO COST STATEMENT EXISTS: attack THE PRE-SCREEN AND THE VACUITY
    JUDGEMENTS TAKEN UNDER IT, and the negative closure. This campaign has just
    built an instrument whose entire purpose is to DECLINE WORK EARLY, and an
    instrument like that needs an adversary at least as much as a bound does:
    premature closure is the failure mode docs/inventor-protocol.md names as
    symmetric with overclaiming, and BATCH-003 already lost a slot to the opposite
    error.
    Both branches are real work and neither is a formality. You are the first
    red-team task dispatched under GOAL-AES-001.
  uncertainty_reduced: >-
    Whether the batch's central output survives an adversary rather than a
    checker. The validator asks "is this correct"; you ask "how would this be
    wrong, and what would it take to show it". On BRANCH A that is the difference
    between a cost inequality that has been verified and one that has been
    attacked, and gate (4) requires the second. On BRANCH B it is whether the
    ~7-interface pre-screen is a sound filter or a licence to stop working — a
    question nobody in this campaign has an incentive to ask, which is why it is
    asked adversarially.
  inputs:
    - >-
      The verified TASK-20260801-808 snapshot receipt and the eight committed
      producer artifacts
    - >-
      DEC-20260731-026's promotion_gates_status block, which states all four
      gates verbatim and records that they become live if OD-4 delivers
    - >-
      DEC-20260731-026's IN-SCOPE VACUOUS ruling on Proposition 801-1 and the
      graph geometry it rests on (diameter 30, G^2 diameter 16, covering number
      15, vertex-transitivity, interface constant 2 + 2n* = 32) — the basis of
      the pre-screen you may be attacking
    - >-
      V-804-1: this campaign's own demonstration that a control can DISCRIMINATE
      without ISOLATING the property it names, which is the shape of confound to
      hunt for
    - >-
      The CAND-601-B cost-accounting precedent: four defects D-705-9 through
      D-705-12 and an untabulated 46x memory ratio attached to a 0.0444 figure,
      all still in force under DEC-20260731-011's strikes
    - >-
      docs/target-result-profile.md, and the honest-accounting fields
      dominated_by and sota_delta that every deliverable in this program must
      fill
    - >-
      GOAL-AES-001 and RQ-AES-001 scope, claim-tier ceiling, and the
      unverified-from-memory network policy
  constraints:
    - >-
      Read only COMMITTED artifacts, and confirm the TASK-20260801-808 snapshot
      receipt against Git before recording any finding. If it does not verify,
      STOP and report an evidence-integrity failure.
    - >-
      STATE YOUR BRANCH EXPLICITLY IN THE FIRST SECTION, with the evidence from
      the committed artifacts that determines it. If the package contains a cost
      or asymptotic statement of ANY strength — including one hedged, conditional
      or labelled preliminary — you are on BRANCH A. Do not take BRANCH B because
      the statement is weak; take BRANCH A and say the statement is weak.
    - >-
      BRANCH A, ATTACK THE COST MODEL. Work through the accounting and try to
      BREAK it, not to confirm it. At minimum: (i) find every cost the model
      omits or absorbs into a constant or an o(1) term, and say what it actually
      costs; (ii) check the per-attempt cost x inverse success probability
      product for double-counting, for a success probability that is asserted
      rather than derived, and for an attempt whose cost is amortized over work
      that is not actually shared; (iii) attack the MEMORY accounting and the
      time-memory tradeoff — a bound that needs memory it does not charge for is
      not a bound; (iv) attack the parallelization claim, if any, by asking what
      does not parallelize; (v) find the parameter regime, INSIDE the claimed
      affected scope, where the advantage disappears, and state it; (vi) check
      that the affected-vs-safe scope statement is honest in BOTH directions, and
      that nothing claimed safe is merely untested.
    - >-
      BRANCH A, ATTACK THE HEURISTICS. For each numbered heuristic: is the formal
      statement actually the assumption the proof uses, or a weaker statement
      standing in for a stronger one? Would the heuristic be false for a
      structured, adversarial or degenerate instance rather than a random one —
      and can you exhibit such an instance? Is the proposed validation experiment
      CAPABLE OF FALSIFYING the heuristic, or is it a confirmation exercise that
      cannot fail? Is there an UNNUMBERED conditional dependence — an
      independence, uniformity, genericity or equidistribution assumption
      smuggled in as an obvious step? An unnumbered assumption found is the
      single highest-value finding available on this branch and must be reported
      as MAJOR.
    - >-
      BRANCH B, ATTACK THE PRE-SCREEN. (i) Is the about-7 threshold CORRECT? It
      derives from RQ-AES-001's 3-7 round scope through PROP-701-I's own
      one-interface-per-round modelling convention, which residual R5 records as
      established by NOTHING in this campaign. If that conversion is wrong, the
      threshold is wrong in a knowable direction — say which. (ii) For each
      candidate killed as IN_SCOPE_VACUOUS, is the interface constant claimed for
      it correct, or inflated? Try to find a candidate that was discarded on a
      constant that a better argument would have reduced below 7. (iii) Is the
      screen DODGEABLE — can a candidate be repackaged to pass it while still
      requiring many interfaces, and did either producer do so, deliberately or
      not? (iv) Is the screen OVERBROAD — does it kill classes of argument that
      do not in fact need many interfaces, because they route through the graph
      only incidentally? (v) Is the "routes through a different machine" escape
      hatch substantive where it was used, or a label?
    - >-
      BRANCH B, ATTACK THE NEGATIVE CLOSURE. If the package reports that no bound
      on B follows: is the NAMED BREAKING STEP really the step that breaks, or
      the first one the producer reached? Try to construct the bound the producer
      says does not exist, even crudely, and report whether you can get further
      than the producer did. A negative closure that an adversary can walk past
      in one sitting is not a closure, and saying so is the most useful thing you
      can do on this branch.
    - >-
      BOTH BRANCHES: ATTACK THE ANALOGUE. Every scaled-down computation in this
      campaign runs in a field that is not the cipher's. Ask whether any
      conclusion is being transferred from the analogue to GF(2^8) or to AES
      without an argument, and whether the transfer argument, where present,
      actually holds. This campaign's standing exposure is that a toy reading
      gets read as evidence about the cipher.
    - >-
      BOTH BRANCHES: ATTACK THE HONEST ACCOUNTING. Check dominated_by and
      sota_delta wherever a deliverable claims anything, and check that no
      recalled literature number is used as if it had been read. Every literature
      statement anywhere in this campaign is UNVERIFIED-FROM-MEMORY and novelty
      is UNRESOLVABLE in this environment; a package that compares itself to a
      remembered baseline as if to a citation is committing the error, and so
      would you be if you rebutted it with another recollection.
    - >-
      PROPOSE THE NEXT CONTROL, WHICH IS YOUR DISTINCTIVE OUTPUT. For your
      strongest objection, name the CONCRETE, BOUNDED experiment or computation
      that would settle it, specific enough for the Coordinator to schedule it in
      BATCH-005 — what to compute or sample, at what scale, what the two outcomes
      would mean, and what would falsify your own objection. An objection without
      a settling control is an opinion.
    - >-
      DO NOT FIX ANYTHING. Do not repair, edit, extend or re-run producer
      artifacts, and do not write the bound you think should have been written.
      Objections are recorded, not remedied. Write only under this task's own
      directory.
    - >-
      DISTINGUISH AN OBJECTION FROM A REFUTATION, AND SAY WHICH YOU HAVE. If you
      demonstrate a concrete failure, say demonstrated and give the reproduction.
      If you have a reason for doubt you could not settle, say UNRESOLVED and say
      why — the BATCH-003 V-804-6 precedent, where a confounded probe was
      correctly recorded as unresolved rather than as refuted, is the standard.
      Absence of evidence is not evidence of absence, and an unrun probe is not a
      null result.
    - >-
      Change no official state. Propose no hypothesis status, create no ledger
      record, promote nothing to knowledge, assign NO evidence strength, and
      recommend no promotion — those are the Coordinator's transition in
      TASK-20260801-811. You may recommend AGAINST promotion and should, if
      warranted.
    - >-
      Record your OWN inference block, and state plainly that under
      inference-amendment 0137a051 your independence is in SESSION and NOT in
      MODEL — you resolve to the same model as both producers, the validator and
      the Coordinator — and that this blocks any goal-closure attestation from
      your session and makes agreement between you and the validator CORRELATED
      rather than independent confirmation.
    - >-
      A timeout, crash or out-of-budget condition is INFRASTRUCTURE SIGNAL
      reported as such, never a negative mathematical result. The declared budget
      is a BINDING STOP CONDITION: halt at it and report which attacks you did
      not run, naming each, so an unrun attack is never mistaken for an attack
      that found nothing.
  deliverables:
    - redteam_report.md
    - redteam_findings.yaml
  artifact_paths:
    - coordination/goals/GOAL-AES-001/batches/BATCH-004/tasks/TASK-20260801-810/redteam_report.md
    - coordination/goals/GOAL-AES-001/batches/BATCH-004/tasks/TASK-20260801-810/redteam_findings.yaml
  archived_by: TASK-20260801-811
  inference:
    policy: red-team-adversarial
    requested_policy: red-team-adversarial
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
    standing_basis: >-
      inference-amendment commit 0137a051eb5828789eb267fa83c8278086578d4c. This
      session supplies independence in SESSION and NOT in MODEL. It resolves to
      the same model as both producers, the TASK-20260801-809 validator and the
      Coordinator, so its agreement with any of them is CORRELATED rather than
      independent confirmation. Nothing it produces may be treated as a closure
      attestation.
  budget:
    wall_clock_seconds: 1000
    memory_gb: 4
    maximum_runs: 6
  budget_basis: >-
    NO MEASURED COMPARABLE EXISTS IN THIS CAMPAIGN — no red-team task has been
    run under GOAL-AES-001, so this figure has a WEAKER BASIS than the others in
    this batch and that is recorded rather than concealed. It is set below the
    measured validator range (1071, 1375, 1046 s) because the scope is one task's
    cost model and heuristics, or one pre-screen, rather than a whole package
    across two checks. The declaration is a BINDING STOP CONDITION: halt at it
    and name the attacks not run.
  completion_gate:
    - >-
      The snapshot receipt is confirmed against Git, or the task stops and
      reports an evidence-integrity failure.
    - >-
      The branch (A or B) is stated in the first section with the committed
      evidence that determines it, and BRANCH A is taken if any cost or
      asymptotic statement exists at any strength.
    - >-
      BRANCH A: the report attacks the cost model on omitted costs, the
      per-attempt-cost x inverse-success-probability product, memory, time-memory
      tradeoff, parallelization, the regime where the advantage disappears, and
      the honesty of the affected-vs-safe statement in both directions — each
      attempted and each reported with its outcome, including the ones that found
      nothing.
    - >-
      BRANCH A: every numbered heuristic is attacked on whether it is the
      assumption the proof uses, whether it fails on a structured or degenerate
      instance, and whether its validation experiment CAN falsify it; and an
      explicit search for UNNUMBERED conditional dependences is performed and
      reported, with any found recorded as MAJOR.
    - >-
      BRANCH B: the report attacks the about-7 threshold and its
      interface-per-round basis, the interface constant claimed for every killed
      candidate, the screen's dodgeability, its overbreadth, and the substance of
      any "different machine" escape; and attempts to construct the bound the
      producer says does not exist, reporting how far it got.
    - >-
      BOTH BRANCHES: the analogue-to-cipher transfer is attacked, and the
      honest-accounting fields and any use of recalled literature numbers are
      checked.
    - >-
      For the strongest objection, a concrete bounded settling experiment is
      specified — what to compute or sample, at what scale, what each outcome
      means, and what would falsify the objection itself.
    - >-
      Every finding is labelled DEMONSTRATED (with a reproduction) or UNRESOLVED
      (with why it could not be settled), and no unrun attack is presented as an
      attack that found nothing.
    - >-
      redteam_findings.yaml lists every objection with a severity and a settling
      control where one exists, carries the red team's own inference block with
      the session-not-model independence statement, asserts no official state
      change, assigns no evidence strength, and recommends no promotion.
    - >-
      No producer artifact is modified, and all writes are under this task's own
      directory.
  return_format: >-
    The two artifacts, plus a plain statement of: which branch you took and why;
    your strongest objection with its severity and whether it is DEMONSTRATED or
    UNRESOLVED; the settling control you propose for it; and the attacks you did
    not run.
