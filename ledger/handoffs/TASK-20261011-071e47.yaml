      and records task.yaml as an undeclared extra. Require the report
      to state old producer release absent, old snapshot incomplete and
      no scientific validity verdict. A failed report check stops
      archival completion; never edit the report to pass.
    - >-
      Verify the report's producer landing commit changed exactly
      verification-report.json; its bytes at that commit and HEAD
      equal the release-bound SHA-256. Verify source commit
      6a707e069f0a10b6e90b29c1c31b5243a207b5c6 is reachable,
      changed exactly the ten source files and that all ten files
      still match the report. Record the full source and landing
      commit parents and blob IDs.
    - >-
      Write only snapshot-receipt.json under this task's new archive
      directory. The receipt records task/decision/correction IDs,
      full base and merge outcome, producer landing commit/parent,
      release path/hash, source commit/parent, the report SHA and ten
      source path/hash/blob/size bindings, verifier SHA, and explicit
      old producer release absent, old snapshot incomplete,
      scientific_claim_change false, independent_validation_dispatched
      false. Do not put a self-referential receipt-commit SHA inside
      the receipt.
    - >-
      Commit exactly the one receipt path and verify its parent and
      changed-path set. After commit, run the packet-committed verifier
      with `--receipt` pointing to this receipt, `--head HEAD`, and
      `--json`; retain exact command, stdout, stderr and exit code.
      Only a passing verifier and pushed receipt commit complete this
      task. Then refresh or open a ready PR and stop without CI polling.
    - >-
      This task does not complete TASK-20261001-e8b6f6, fabricate a
      release for TASK-20261001-762c5f, dispatch the independent
      validator, or change any scientific status. A later Coordinator
      ruling decides completion and review routing.
  deliverables:
