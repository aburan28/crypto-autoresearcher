  completion_gate:
    - >-
      A real completed release for e1f957 binds exactly one report,
      whose producer landing commit changed exactly that path and
      whose bytes match the report at current HEAD.
    - >-
      Report and receipt bind the ten unchanged source files to their
      exact original added-files commit and four HTML source hashes;
      task.yaml remains recorded as undeclared extra.
    - >-
      Receipt commit changes only snapshot-receipt.json, is reachable
