  constraints:
    - >-
      Run only after TASK-20261011-e1f957's own completed
      goal_lanes.py release is committed and pushed, its one report
      path exists and hashes to the release, and its exact producer
      landing commit is reachable. Check official research_dispatch.py
      --ready-only on the write-once queue and claim this archive
      through goal_lanes.py on that queue; run alone with no competing
      archival task. No original TASK-20261001-762c5f release is claimed.
    - >-
      Fetch and merge origin/main, never rebase, before the receipt
      commit; record the full checked base SHA, merge outcome and
      expected receipt-commit parent. Verify the committed protocol
      packet, queue/addendum and verifier hashes still match.
    - >-
      Verify verification-report.json has schema
      scurve_l5_existing_output_verification_v1, names e1f957 and the
      exact source commit, lists exactly ten added source paths with
      per-path blob ID, SHA-256, size and equality at source, HEAD and
