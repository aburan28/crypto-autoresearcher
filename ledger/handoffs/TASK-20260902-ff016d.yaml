handoff:
  id: TASK-20260902-ff016d
  from: coordinator
  to: executor
  objective: >-
    Execute a REPLICATION run of the frozen, approved specification
    EXP-ECDLP-c373eb (RC-1: exact tabulation of ECDLP-IDEA-436's D1
    coordinate-valuation profile) on a SECOND, independently chosen toy
    instance (different curve, different n from RUN-ECDLP-c373eb-1's
    p=1009, n=47), per /run-experiment. This is the replication named in
    EV-ECDLP-f5c698's own limitations and DEC-20260902-4c82fd's/
    DEC-20260901-255ebd's forward guidance to move confidence from
    preliminary toward replicated.
  uncertainty_reduced: >-
    Whether RUN-ECDLP-c373eb-1's exact confirmation of Proposition E
    (D1's image exactly {0, >=8} across all tested pairs, and a genuinely
    different image on the discriminating null-lift control) holds on a
    SECOND, independently chosen toy instance, or was an artifact specific
    to the first instance's particular curve/n.
  inputs:
    - experiments/EXP-ECDLP-c373eb/specification.yaml (the frozen, approved specification -- implement exactly as written, unchanged)
    - experiments/EXP-ECDLP-c373eb/runs/RUN-ECDLP-c373eb-1/manifest.yaml (the prior run, for reference on the exact protocol followed -- read only, do not copy its specific curve/point choice)
    - experiments/EXP-ECDLP-c373eb/implementation/rc1_tabulation.py (the prior run's script, for reference on a working implementation approach -- may be reused or adapted, but the curve/point/n instance MUST be different from RUN-ECDLP-c373eb-1's)
    - ledger/hypotheses/H-ECDLP-a40416.yaml (the hypothesis this replication tests)
    - ledger/evidence/EV-ECDLP-f5c698.yaml (the prior evidence record, noting the single-instance limitation this replication addresses)
  constraints:
    - >-
      Implement EXACTLY the frozen specification EXP-ECDLP-c373eb.yaml,
      unchanged. Do not amend or edit the specification.
    - >-
      This run's write scope is exactly
      experiments/EXP-ECDLP-c373eb/runs/RUN-ECDLP-c373eb-2/ and, if any
      script changes are needed, experiments/EXP-ECDLP-c373eb/implementation/.
      Do NOT touch RUN-ECDLP-c373eb-1's directory or any of its files --
      runs are immutable.
    - >-
      Choose a DIFFERENT toy instance from RUN-ECDLP-c373eb-1's (p=1009,
      curve y^2=x^3+x+1, S=(286,680), n=47): a different p (still toy tier,
      well under 32 bits) and/or different curve coefficients and/or
      different n, so this is a genuine second data point, not a
      restatement of the first.
    - >-
      Use exact integer/p-adic arithmetic throughout (Python
      arbitrary-precision integers). No floating point for any p-adic
      quantity.
    - >-
      Part 1 must cover ALL pairs 1 <= j < k < n, not a sample.
    - >-
      Independently spot-check at least one tabulated (j,k) value by an
      independent, simpler recomputation path, exactly as
      RUN-ECDLP-c373eb-1 did, and report this spot-check explicitly.
    - >-
      The certificate block must have kind: none (pure measurement, no
      discrete-log solve claimed).
    - >-
      State explicitly, wherever a value hits the precision cap, that the
      computation observes only "at least r", never literal infinity.
    - >-
      Do NOT interpret whether the results support or falsify
      H-ECDLP-a40416, and do NOT change any hypothesis or experiment
      status, and do NOT create any B71, DEC, KN-FIND, KN-OPEN, or CORR
      record. Report facts only (per docs/task-lifecycle.md and this
      program's Executor/Coordinator separation of duties); interpretation
      is reserved for a subsequent /review-evidence pass.
    - >-
      Budget: this should run in well under one CPU-minute, matching
      RUN-ECDLP-c373eb-1. If it takes far longer, stop and reconsider
      rather than let it run indefinitely.
  deliverables:
    - experiments/EXP-ECDLP-c373eb/runs/RUN-ECDLP-c373eb-2/manifest.yaml
    - experiments/EXP-ECDLP-c373eb/runs/RUN-ECDLP-c373eb-2/command.txt
    - experiments/EXP-ECDLP-c373eb/runs/RUN-ECDLP-c373eb-2/environment.json
    - experiments/EXP-ECDLP-c373eb/runs/RUN-ECDLP-c373eb-2/stdout.log
    - experiments/EXP-ECDLP-c373eb/runs/RUN-ECDLP-c373eb-2/stderr.log
    - experiments/EXP-ECDLP-c373eb/runs/RUN-ECDLP-c373eb-2/raw-result.json
    - >-
      experiments/EXP-ECDLP-c373eb/runs/RUN-ECDLP-c373eb-2/execution-report.yaml
      (a NEW, run-scoped report inside the RUN-2 directory -- do NOT edit
      the existing experiment-level experiments/EXP-ECDLP-c373eb/execution-report.yaml,
      which is RUN-1's own record and must not be touched)
  artifact_paths:
    - experiments/EXP-ECDLP-c373eb/runs/RUN-ECDLP-c373eb-2/manifest.yaml
    - experiments/EXP-ECDLP-c373eb/runs/RUN-ECDLP-c373eb-2/command.txt
    - experiments/EXP-ECDLP-c373eb/runs/RUN-ECDLP-c373eb-2/environment.json
    - experiments/EXP-ECDLP-c373eb/runs/RUN-ECDLP-c373eb-2/stdout.log
    - experiments/EXP-ECDLP-c373eb/runs/RUN-ECDLP-c373eb-2/stderr.log
    - experiments/EXP-ECDLP-c373eb/runs/RUN-ECDLP-c373eb-2/raw-result.json
    - experiments/EXP-ECDLP-c373eb/runs/RUN-ECDLP-c373eb-2/execution-report.yaml
  archived_by: TASK-20260902-9cd2d9
  inference:
    policy: executor-implementation
    reasoning_effort: medium
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 600
    memory_gb: 1
