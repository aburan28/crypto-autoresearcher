    Red Team's own derivation first -- derive your own exact expectation
    for the number of colliding pairs per tuple under each sampling
    scheme, as a function of the curve's group invariants. Work out for
    yourself which invariants the answer depends on before checking
    whether it matches the Red Team's claimed (N, tau, #E(F_p)[4])
    dependence.

  do_this_blind_first_then_compare: >-
    Complete your own derivation and your own brute-force validation (on
    curves you construct yourself, at primes you choose yourself,
    independent of the Red Team's own 20-curve test set) BEFORE reading
    the Red Team's report in full. Only after locking in your own exact
    formula and its brute-force validation, read
    experiments/EXP-MONO-005b49/reviews/red-team-breakthrough/red-team-report.yaml's
    counterexample_or_mutation section (and its scripts exact.py, gu.py,
    gu2.py, verify.py, all archived alongside it) and compare. Report
    agreement or disagreement precisely -- if you find ANY discrepancy,
    however small, with the Red Team's claimed closed forms, that is the
    single most important finding this task could produce, per RC-B10's
    own stated falsification route.

  specific_checks_required:
    - >-
      Confirm or refute: does the transversal-arm expectation depend on
      the curve ONLY through (N, tau, #E(F_p)[4]), or does it also depend
      on the endomorphism ring, j-invariant, or CM discriminant in some
      way the Red Team's formula misses?
    - >-
      Confirm or refute the specific numerical claim that is the most
