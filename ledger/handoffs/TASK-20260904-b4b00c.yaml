    #E(F_p)[4]) alone. This is DEC-20260904-d79f75's next_action (1),
    RC-B10's own stated falsification route: a fresh, independent
    rederivation before any DETERMINISTIC-tier knowledge promotion.

  authorized_by: coordinator
  authorization_basis: DEC-20260904-d79f75 next_action (1).

  what_to_do: >-
    Read the construction actually implemented in
    experiments/EXP-MONO-64aaa4/implementation/run_experiment.py
    (measure_curve: 3 distinct factor-base x-coordinates drawn uniformly
    without replacement, lifted by a fixed sign rule, 4 signed sums formed
