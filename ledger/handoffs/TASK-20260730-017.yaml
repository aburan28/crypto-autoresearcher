handoff:
  id: TASK-20260730-017
  from: coordinator
  to: executor
  objective: >-
    Build a bounded exact reachable-state analyzer for small internal sieve
    instances computing p(v1,v2) and searching for zero-progress witnesses,
    and write a separate end-to-end recovery specification with W/R/B/M_tail
    and event F, under DEC-20260730-011 for IDEA-20260729-001.
  uncertainty_reduced: >-
    Whether small-instance exact analysis yields a zero-progress witness or
    motivates a uniform progress bound, and what the missing recovery/error
    schedule must contain.
  inputs:
    - DEC-20260730-011 / EV-SSI-012
    - RT-20260730-015 next_concrete_action
    - BATCH-012 process extraction; CollimationSieve@6f9188e4
  constraints:
    - Zero curve/isogeny/quantum-circuit computation; maximum_runs: 1.
    - Do not infer a global stopping tail from finite small-instance coverage.
    - Prefer a zero-progress witness or explicit non-uniformity over inventing a uniform bound.
    - Recovery specification stays separate; do not claim the pinned simulator implements it.
    - Do not reopen IDEA-20260725-001/002/003.
    - No numeric security, breakthrough, or completion claim.
  deliverables:
    - analyzer_report.md
    - analyzer_results.yaml
    - recovery_spec.md
    - mutation_status.yaml
    - classification.yaml
  artifact_paths:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-013/tasks/TASK-20260730-017/analyzer_report.md
    - coordination/goals/GOAL-SSI-001/batches/BATCH-013/tasks/TASK-20260730-017/analyzer_results.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-013/tasks/TASK-20260730-017/recovery_spec.md
    - coordination/goals/GOAL-SSI-001/batches/BATCH-013/tasks/TASK-20260730-017/mutation_status.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-013/tasks/TASK-20260730-017/classification.yaml
  archived_by: TASK-20260730-018
  inference:
    policy: executor-terra
    fallback_allowed: true
    independent_session_required: false
  budget:
    wall_clock_seconds: 2400
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
    - One of the three named FC0 dispositions.
    - Analyzer results with non-extrapolation statement.
    - Recovery spec with W/R/B/M_tail and F.
    - C2/C3/error-map status recorded.
  return_format: >-
    Write only under write_scope. Optional analyzer source may live under the
    same write_scope but only the five declared artifact_paths are archival
    deliverables unless you also list additional exact paths in classification.
    Prefer keeping helper code inside the write_scope directory. Record
    requested_policy, resolved_model, and fallback_used in classification.yaml.
