handoff:
  id: TASK-20260905-ac087e
  from: coordinator
  to: red-team
  objective: 'Independently stress-test every proposal filed by BATCH-23ec69 (the novel point-representation
    set under RQ-ECDLP-623a32 and the SAT/SMT relation-finding set under RQ-ECDLP-f0a7b0) as committed
    in the snapshot archive TASK-20260905-8443e4: mechanism distinctness from the nearest internal work,
    the lossy-projection audit, hidden assumptions, omitted end-to-end costs, the dominated_by and sota_delta
    honesty, the adequacy of the declared null and known-false controls, and the cheapest discriminating
    test for each.'
  uncertainty_reduced: Which of the filed proposals are renamed known approaches or reparametrisations,
    which carry an unpriced cost or an unstated assumption that voids their claimed stage change, and
    which survive with a cheap decisive test -- so the Coordinator's ranking decision rests on an adversarial
    reading rather than on the producers' own.
  inputs:
  - AGENTS.md
  - agents/red-team.md
  - docs/inventor-protocol.md
  - docs/target-result-profile.md
  - docs/claims-and-verification.md
  - templates/research-records.md
  - ledger/questions/RQ-ECDLP-623a32.yaml
  - ledger/questions/RQ-ECDLP-f0a7b0.yaml
  - ledger/handoffs/TASK-20260905-a6ea8a.yaml
  - ledger/handoffs/TASK-20260905-282872.yaml
  - coordination/ecdlp-ideas-20260905-23ec69/tasks/TASK-20260905-a6ea8a/
  - coordination/ecdlp-ideas-20260905-23ec69/tasks/TASK-20260905-282872/
  - coordination/ecdlp-ideas-20260905-23ec69/archives/TASK-20260905-8443e4/snapshot.md
  - coordination/ecdlp-ideas-20260905-23ec69/dispatch_queue.json
  - ledger/proposals/
  - ledger/hypotheses/
  - knowledge/
  constraints:
  - Review only the Coordinator-committed snapshot named in the batch dispatch queue receipt for TASK-20260905-8443e4;
    confirm the commit exists and the reviewed paths match its recorded hashes before reading them as
    durable artifacts.
  - Independent session. Do not read any other reviewer's report. Attest the paths actually read.
  - For every filed proposal report holds, breaks or inconclusive on each of these joints, with the attack
    actually run and its result named. J1 mechanism distinctness, the nearest internal record read in
    full and the claimed precise difference tested. J2 the lossy-projection audit (representation set)
    or the pipeline-stage and target-kind statement (SAT set), tested for the change-of- coordinates failure
    or the enumerator-in-disguise failure respectively. J3 hidden assumptions and omitted end-to-end costs
    (setup, transport, encoding, proof checking, memory, verification, relation yield, linear algebra,
    descent). J4 dominated_by and sota_delta, checked against every frontier row named in the record and
    against Pollard rho, BSGS and the closest specialised baseline. J5 controls, whether the declared
    null battery and known-false object can actually detect the artifact the record is exposed to, and
    whether a decay parameter is named. J6 recalled citations, located and checked where retrieval succeeds,
    with the delta reported.
  - Run the proves-too-much control where a record argues a stage change; choose objects the claim would
    find inconvenient and report where the argument survives.
  - Apply the obstruction reversal of agents/red-team.md item 8 to any record that closes a route, and
    file resource readings as findings, never as evidence.
  - Preserve the narrowest valid conclusion. A finding is a scoped objection with a named repair or a
    named cheapest test; never an impossibility claim, never a status change, never an edit to the reviewed
    records.
  - No experiments and no implementation; maximum_runs is 0. Symbolic checks and literature retrieval
    only.
  - Write one report only under the assigned write_scope, as YAML with a red_team_report root per agents/red-team.md,
    carrying per-proposal verdict blocks keyed by idea id and a closing review_attestation (joints owned,
    paths read, read_sibling_reports false, requested_policy review-adversarial, the inherited runtime
    provenance stated honestly, no probe invented).
  deliverables:
  - coordination/ecdlp-ideas-20260905-23ec69/tasks/TASK-20260905-ac087e/red_team_report.yaml
  artifact_paths:
  - coordination/ecdlp-ideas-20260905-23ec69/tasks/TASK-20260905-ac087e/red_team_report.yaml
  archived_by: TASK-20260905-5d72bc
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: null
    memory_gb: null
    maximum_runs: 0
  completion_gate:
  - The report exists, parses, covers every filed proposal id with a verdict on each of the six joints,
    names at least one cheapest discriminating test per proposal, and closes with a complete review_attestation.
  review_plan:
    claim_under_review: 'Each BATCH-23ec69 proposal''s own claim, as its producer stated it in the filed
      IDEA record: for the representation set (RQ-ECDLP-623a32), that the named point representation is
      a genuinely lossy, deterministically propagating object that makes a named non-generic operation
      cheaper at a stated attack stage; for the SAT/SMT set (RQ-ECDLP-f0a7b0), that the named constraint-technology
      use changes a stated pipeline stage by a stated exponent, amortised constant, or certifiability
      property. The exact claim text is read from each ledger/proposals record; the Coordinator does not
      restate it.'
    coordinator_prior: 'Recorded before any report returns. Representation set: most candidates will fail
      the lossy-projection joint as reparametrisations (the PGL_2 null reproduces them) or as projections
      that do not propagate; at most one or two survive with a genuinely different stage cost, and that
      cost is a constant, not an exponent. SAT/SMT set: no candidate moves the search exponent below the
      SATIC ceiling of ml - log2|G| bits or its prime-field analogue; the certificate, model-counting
      and amortisation ideas survive as tooling and measurement with honest constants; the learned-clause-to-ideal-membership
      bridge is the candidate most likely to return a surprising result in either direction. If the review
      finds an exponent-moving survivor in either set, that overturns this prior and is the most informative
      outcome of the round.'
    joints:
    - joint: 'J1 mechanism distinctness: the record''s stated precise difference from its nearest internal
        record changes the tracked object or the pipeline stage, not only the notation.'
      assigned_to: TASK-20260905-ac087e
      attack_plan: 'Read the nearest internal record named in each novelty_screen in full (mechanism,
        not title). Write the two tracked objects side by side and test whether a change of names maps
        one record onto the other; where the difference is a parameter choice (a specific d, model, encoding
        or solver), test whether the record derives a consequence the neighbour does not. Coordinator''s
        expected break: representation records that are degree-d maps in disguise (IDEA-20260808-2e14f7)
        and SAT records that restate IDEA-20260904-3c7a91''s ceiling.'
      breaking_artifact: A one-paragraph renaming map from the record to its neighbour under which every
        claim of the record is already asserted by the neighbour.
    - joint: 'J2 lossy projection or pipeline stage: a representation record discards information and
        the retained part propagates deterministically; a SAT record''s search is not a complete enumerator
        with a leaf test.'
      assigned_to: TASK-20260905-ac087e
      attack_plan: 'For each representation record, exhibit the fibre of the projection and the one-step
        propagation rule; if the pair {x, discarded data} is recoverable from the retained data the object
        is a change of coordinates (the KN-LIT-7595 (Delta, Pi) failure). For each SAT record, write the
        search as a tree over the declared variables and ask what conflict can occur above the leaf depth;
        if none, the record is an enumerator and any claimed exponent is the enumeration bound. Coordinator''s
        expected break: at least half the representation records fail the second clause exactly as IDEA-20260807-4cebed
        did.'
      breaking_artifact: Either an explicit recovery map showing nothing is discarded, or an explicit
        propagation failure (two preimages with different images), or a depth argument showing no above-leaf
        conflict exists.
    - joint: 'J3 hidden assumptions and omitted end-to-end costs: the record''s charged cost includes
        setup, transport, encoding, proof checking, memory, verification, relation yield, linear algebra
        and descent.'
      assigned_to: TASK-20260905-ac087e
      attack_plan: 'Recompute each record''s end-to-end path from its target_complexity block, adding
        every stage the record leaves implicit; compare the recomputed total with the record''s stated
        exponents and with Pollard rho at N^(1/2). Coordinator''s expected break: representation records
        that price the decomposition but not the membership test or the transport of the target into the
        representation; SAT records that price the solve but not encoding, proof checking or per-target
        amortisation setup.'
      breaking_artifact: A recomputed cost table in which an omitted stage dominates the claimed saving.
    - joint: 'J4 Pareto honesty: dominated_by was checked against every frontier row the record names
        and against Pollard rho, BSGS and the closest specialised baseline; sota_delta is quantitative
        or an explicitly unquantified boundary.'
      assigned_to: TASK-20260905-ac087e
      attack_plan: List the frontier rows each record names, add the rows it omits (rho with distinguished
        points, BSGS, the honest enumeration bound of IDEA-20260904-96c4f3 for SAT records, PKM small-root
        decomposition for prime-field records), and check dominance on time, memory and data/queries separately.
        An unchecked null dominated_by is a fabrication finding under AGENTS rule 5.
      breaking_artifact: A frontier row, omitted by the record, that dominates the record on every axis.
    - joint: 'J5 controls: the declared null battery and known-false object can detect the artifact the
        record is exposed to, and a decay parameter is named.'
      assigned_to: TASK-20260905-ac087e
      attack_plan: 'For each record name the artifact it is exposed to (reparametrisation, shape-only
        solver cost, planted-instance bias, seed dependence) and test whether the declared PGL_2 battery,
        translation-conjugate null, shape-matched random system, planted instance and known-false object
        would reproduce the record''s predicted signal if the artifact were the whole story. Ask what
        parameter should destroy the signal and whether the record says what the measurement looks like
        as it grows. Coordinator''s expected break: known-false objects chosen for convenience rather
        than inconvenience.'
      breaking_artifact: A control set under which the record's predicted signal and the artifact are
        indistinguishable, or a missing decay parameter.
    - joint: 'J6 recalled citations: every load-bearing recalled reference says what the record relies
        on.'
      assigned_to: TASK-20260905-ac087e
      attack_plan: 'For each citation with provenance recalled that a claim, heuristic or novelty argument
        leans on, locate the source (WebSearch and WebFetch), confirm the specific theorem or bound cited,
        and report the delta; where retrieval fails, record the reference as unlocated rather than as
        confirmed. Coordinator''s expected break: at least one recalled reference on finite-field SMT
        theories, model counters or theta normal forms is mis-attributed or does not state what is claimed.'
      breaking_artifact: The located source passage beside the record's paraphrase, with the discrepancy
        named.
    blindness:
      mutual: true
      lifted_for: []
      rationale: null
    proves_too_much:
      objects:
      - the same curve under a uniformly random PGL_2(F_p) reparametrisation of each coordinate (a representation
        on which no stage cost may change)
      - a shape-matched random Boolean or random F_p polynomial system with the same variable blocks and
        monomial supports (a system on which no elliptic-curve structure can be doing the work)
      - a prime cyclic group (Z/N, +) given only as a black-box group (an object on which every generic-group
        bound applies and no non-generic saving exists)
      failure_signature: On the random reparametrisation the record's argument must predict NO change
        in any stage cost; on the shape-matched random system it must predict NO solver saving attributable
        to structure; on the black-box prime cyclic group it must predict NO sub-N^(1/2) route. An argument
        that still yields its claimed saving on any of these objects has proved too much, and the reviewer
        reports the step at which it survives.
      assigned_to: TASK-20260905-ac087e
    blind_rederivation:
      required: false
      quantity: null
      parameters: null
      blind_from: []
      assigned_to: null
    procedure_deviations: []
  write_scope:
  - coordination/ecdlp-ideas-20260905-23ec69/tasks/TASK-20260905-ac087e/red_team_report.yaml
