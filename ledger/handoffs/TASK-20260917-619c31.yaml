        wrong than novel. Includes Theorem 1's equality case (control C4, forced
        4) and Type 2 at n = 7 (C2, forced 8) and n = 31 (C3, forced 32768).
      failure_signature: >-
        UNCHANGED FROM TASK-20260917-43701b. FAMILY 1: the derivation must
        become VACUOUS at r = 0, not merely satisfied, AND the vacuity must be a
