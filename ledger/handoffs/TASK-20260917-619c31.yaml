    proves_too_much:
      objects:
      - >-
        FAMILY 1 -- n' DIVIDES n (Diem's subfield family), where the conclusion
        of (B) is KNOWN FALSE: a subfield polynomial with d = 1 splits
        completely with N = p^{n'} and beta arbitrarily small. Executable
