    joints:
    - joint: >-
        J1. THE DERIVATION OF (A): that (q+1)n' = n + (n'-r) licenses
        x^{p^{n'(q+1)}} = x^{p^{n'-r}} for x in K; that every K-root of L is
        therefore a root of D(Y) = Lambda_{q+1}(Y) - Y^{p^{n'-r}}; that
        deg D <= max(d^{q+1}, p^{n'-r}) including at the equal-degree boundary;
        and that D != 0 off the degenerate case. Quantified over ALL p, while
        every numerical cell of the experiment is p = 2.
      assigned_to: TASK-20260917-34b637
      attack_plan: >-
        AS WRITTEN ON TASK-20260917-43701b, JOINT J1, CARRIED BY REFERENCE AND
        NOT REWRITTEN: (a) verify the identity and attack the step it licenses,
        checking whether any later step applies D to an x NOT in K; (b) attack
        the degree bound at the equal-degree boundary where the leading terms
        could cancel; (c) BUILD THE p != 2 SWEEP -- named there as "the
        highest-value missing datum in the entire experiment" -- written against
        the STATEMENT and not reusing the experiment's implementation; (d)
        cross-check the two Stage 0 hand cells at (4, 3).
      breaking_artifact: >-
        A tuple (p, n, n', lambda) with D != 0 and an independently re-verified
        K-root set of size strictly greater than max(d^{q+1}, p^{n'-r}); or a
        demonstration that a step of (A) is applied outside K.
      returned: >-
        HOLDS. 0 violations in 291997 deduplicated independent candidates at
        p in {2,3,5,7} (machine roll-up 292105) plus 2400 odd-p K-coefficient
        draws; 0 with deg D above the bound; largest N/bound exactly 1.0. The
        p != 2 evidence the prior called the cheapest missing datum now exists.
    - joint: >-
        J2. THE DEGENERATE-CASE CHARACTERISATION, WHICH CARRIES THE WHOLE OF
        COROLLARY (B) at its first step: that a degenerate L never splits
        completely.
      assigned_to: TASK-20260917-52b4e6
      attack_plan: >-
        AS WRITTEN ON TASK-20260917-43701b, JOINT J2, CARRIED BY REFERENCE AND
        NOT REWRITTEN: verify first the Coordinator's claim that no cell of the
        experiment can produce a degenerate candidate; (a) CONSTRUCT degenerate
        instances deliberately, since the experiment could not, and confirm
        N <= p^{n'-j} < p^{n'} on each; (b) attack the
        composition-equals-monomial argument in characteristic p against
        additive and p-th-power maps and inseparable f; (c) check the exclusion
        is an exclusion and not a gap; (d) exercise the degenerate_detection
        instrument on a constructed positive, since an instrument that has never
        returned a positive is an untested instrument.
      breaking_artifact: >-
        A degenerate L with N_K(L) = p^{n'}; or a char-p counterexample to the
        composition step; or a demonstration that degenerate_detection cannot
        return true on any input.
      returned: >-
        HOLDS, AND THE PRIOR'S STATED REASON WAS CORRECTED. The criterion is
        (q+1) | n, since n' - r = (q+1)n' - n; the prior argued from n' - r
        being small, which is FALSE on 56 of the 95 Stage-2 cells. The
        conclusion never changed and the affected candidate count grew from
        3192 to 45436. The control is vacuous by construction across all 111
        cells; 26 constructed instances and 164 full-K degenerate lambda supply
        the missing measurement from outside the contract.
    - joint: >-
        J3. THE BETA COROLLARY: that N = p^{n'} with r >= 1 forces
        d^{q+1} >= p^{n'}, hence beta >= n/(n + n' - r) > 1/2, and that the
        measured Stage 2 columns instantiate it correctly on all 65 complete
        splitters.
      assigned_to: TASK-20260917-34b637
      attack_plan: >-
        AS WRITTEN ON TASK-20260917-43701b, JOINT J3, CARRIED BY REFERENCE AND
        NOT REWRITTEN: (a) attack "> 1/2" as a SCOPE claim rather than an
        arithmetic one, since n' > 2n gives q = 0 and beta >= n/n' < 1/2;
        (b) recompute M3 independently on all 65 rows from (n, n', d) alone,
        trusting no instrument; (c) resolve the "equality at two splitters"
        imprecision; (d) check the weaken/reject split would be decidable from
        the archived rows alone.
      breaking_artifact: >-
        A complete splitter at r >= 1 with beta below the recomputed exact
        corollary; or a recomputed M3 column disagreeing with the archive; or a
        demonstration that (B)/(E) assert beta > 1/2 where it is false.
      returned: >-
        HOLDS WITH A REQUIRED NARROWING. 0 disagreements on any of 65 rows;
        min(beta - exact) = 0 exactly; min(beta - conservative) = 7/32. The
        narrowing is the n' < n clause, now stated with its two-conjunct reason
        in H-QSP-645a07 (B) and (E); a witness against (E)'s WRITTEN QUANTIFIER
        was produced at (2, 5, 11, X^2) with N = 32 and beta = 5/121. The
        equality count is EXACTLY THREE, correcting the execution report's
        "two".
    - joint: >-
        J4. INSTRUMENT INDEPENDENCE AND THE DIRECTION OF VERIFICATION: M2 = 0
        over 1260 candidates is evidence only if I1, I2 and I3 do not share a
        failure mode; and at n = 131 the census rests on I3 alone, checked by a
