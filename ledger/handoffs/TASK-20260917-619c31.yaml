        deviations compound: one creates the need to reconstruct a timeline, the
        other corrupts the record a reconstruction would use.
      remedy: >-
        HISTORY IS PUSHED AND IS NOT REWRITTEN. The correction travels in this
        record: c0b3125ec contains a FINAL report, not a snapshot, and any
        timeline built from that commit's subject line must be corrected
        accordingly.
