        derivation-tier bound could be overread as a closure of the QSP line.
      assigned_to: TASK-20260917-52b4e6
      attack_plan: >-
        AS WRITTEN ON TASK-20260917-43701b, JOINT J6, CARRIED BY REFERENCE AND
        NOT REWRITTEN: (a) apply the promotion gates directly and rule on
        whether a scheduled BUT BLOCKED validation route discharges gate (2);
