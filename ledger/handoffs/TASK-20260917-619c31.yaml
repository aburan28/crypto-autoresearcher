    procedure_deviations:
    - id: PROC-1
      what: >-
        THE ORCHESTRATING SESSION COMMITTED REVIEWER REPORTS AND IN-FLIGHT
        ARTIFACTS TO THE SHARED BRANCH WHILE THIS MUTUALLY-BLIND ROUND WAS STILL
        RUNNING. The sibling red team's COMPLETED report was committed at
        8f15567f6, and the other two reviewers' in-flight artifacts at 600bc97af
        and c0b3125ec, at a time when review_plan.blindness.mutual was `true` and
        review_plan.blindness.lifted_for was EMPTY.
      fault: >-
        THE ORCHESTRATING SESSION'S, NOT ANY REVIEWER'S, AND RECORDED THAT WAY
        DELIBERATELY. The evidence for the attribution, each piece of it from a
        committed artifact: the validator disclosed IN FULL what it saw -- a
        path via `git ls-tree` and a commit subject line, which names joints
        already in the plan it had been given and carries no verdict, finding or
        number -- and states that every verdict and number in its report was
        fixed by its own computation BEFORE that commit landed; the red team
        declares `read_sibling_reports: false`; and the blind re-deriver ran no
        git command of any kind, having deliberately suspended even the standing
        agent-bus inbox convention because two of its blind_from paths are bus
        records (recorded separately as PROC-4 and ruled the right call).
      effect: >-
        THE ROUND'S INDEPENDENCE SURVIVES ON THIS EVIDENCE, AND WHAT IT MEANS IS
        WEAKER THAN THE PLAN DECLARED. Blindness has been converted from a
        property of the round's SETUP into a property of three reviewers'
        RESTRAINT. Setup-blindness is checkable by anyone from the repository
        state; restraint-blindness rests on three self-reports, and is
        undetectable downstream unless written down. THIS IS WHERE IT IS WRITTEN
        DOWN. A reader weighing the composition's claim to independence must
        weigh it as restraint, not as construction.
      not_waived_by_outcome: >-
        The reports came back clean and the deviation is still a deviation.
        AGENTS.md: judging a precondition by its outcome is how it stops being a
        precondition.
      remedy: >-
        NONE AVAILABLE RETROSPECTIVELY, AND NONE ATTEMPTED. Blindness cannot be
        restored once destroyed; history is pushed and is not rewritten
        (AGENTS.md "Durable research commits"). TASK-20260917-43701b is NOT
        edited. What IS available is (i) this record and (ii) the forward rule
        below.
        WHAT IS NOT AVAILABLE, STATED SO NOBODY MISTAKES IT FOR A REMEDY:
        `tools/check_review_independence.py` was run against this composition
        and PASSED (ledger/archives/TASK-20260917-c706bb.yaml), and THAT PASS
        DOES NOT DISCHARGE PROC-1 AND IS NOT OFFERED AS DOING SO. The checker
        inspects the composition's declared independence -- every joint owned,
        every assigned reviewer attested, no undeclared sibling reads, no
        re-deriver whose declared sources intersect blind_from. PROC-1 is about
        WHEN THE ORCHESTRATING SESSION'S COMMITS LANDED RELATIVE TO A ROUND THAT
        WAS STILL RUNNING, which is not a property of the returned artifacts and
        which no after-the-fact tool can see. The gate passing afterwards and
        the ordering being wrong at the time are both true, and the second stays
        recorded here on its own terms.
      forward_rule: >-
        A MUTUALLY-BLIND ROUND'S ARTIFACTS ARE NOT COMMITTED TO A SHARED BRANCH
        WHILE THE ROUND IS RUNNING. If the artifacts must be made durable before
        the round closes -- and there are good reasons to want that -- they go
        to per-reviewer branches or non-overlapping paths that no sibling's
        ordinary tooling renders, and the dispatcher states which before the
        round opens. This belongs in the NEXT review plan as a dispatch
        precondition, not as a lesson in a decision record nobody re-reads.
    - id: PROC-2
      what: >-
        COMMIT c0b3125ec IS LABELLED A WORK-IN-PROGRESS SNAPSHOT AND IN FACT
        CONTAINS THE VALIDATOR'S FINAL 814-LINE REPORT.
      fault: >-
        THE ORCHESTRATING SESSION'S. The commit message is the orchestrating
        session's artifact; the report it carries is the validator's and is not
        in question.
      effect: >-
        NO ARTIFACT CONTENT IS AFFECTED AND NO NUMBER, VERDICT OR ATTESTATION IS
