      assigned_to: TASK-20260917-52b4e6
      attack_plan: >-
        AS WRITTEN ON TASK-20260917-43701b, JOINT J4, CARRIED BY REFERENCE AND
        NOT REWRITTEN: (a) build the actual call graph and state how many
