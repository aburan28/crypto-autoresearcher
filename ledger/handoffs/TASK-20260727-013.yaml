handoff:
  id: "TASK-20260727-013"
  from: "coordinator"
  to: "executor"
  goal_id: "GOAL-MLKEM-001"
  authorized_by: "DEC-20260727-002"
  objective: >-
    Execute the frozen EXP-MLKEM-008 protocol exactly as specified and produce the immutable
    run records and execution report it requires. Experiment title: End-to-end soft-oracle leakage budget: calibrated soft-model trace-cost prediction
    on protected Cortex-M4 ML-KEM with a stage-0 availability preflight.
  uncertainty_reduced: >-
    Measure, on one laboratory protected ML-KEM implementation on a Cortex-M4 target,
    whether calibrated soft-information models (soft-PC and adaptive-LDPC backend
    classes consuming frozen calibrated likelihoods) predict held-out median traces-to-
    key-recovery within a multiplicative factor of 2 across three predeclared noise or
    masking configurations, while a hard oracle-accuracy-only model misses by
  inputs:
    - "experiments/EXP-MLKEM-008/specification.yaml (status approved, frozen: true; do not change)"
    - "ledger/hypotheses/H-MLKEM-008.yaml (status approved; do not change)"
    - "ledger/proposals/IDEA-20260722-003.yaml (context; do not change)"
    - "AGENTS.md, docs/task-lifecycle.md, docs/evidence-and-reproducibility.md, docs/claims-and-verification.md"
  constraints:
    - "The protocol is frozen. Any change requires a versioned protocol_amendment under experiments/EXP-MLKEM-008/amendments/ approved by the Coordinator; runs already executed are never re-scored against an amended criterion."
    - "Every run needs a manifest with exact command, git commit and dirty state, environment, seeds, stdout, stderr, raw results, validity status, timestamps, and resource measurements."
    - "claim_tier is laboratory_implementation_conformance: no conclusion above that tier; infrastructure failure is never evidence against the hypothesis (AGENTS.md rule 5)."
    - "Stopping and invalidation rules of the specification are binding; a timeout, crash, or implementation failure is reported as such, never as a result."
  deliverables:
    - "All artifacts enumerated in experiments/EXP-MLKEM-008/specification.yaml required_artifacts (per-run manifest.yaml, command.txt, environment.json, raw.json, summary.json, stdout.txt, stderr.txt)"
    - "experiments/EXP-MLKEM-008/execution-report.yaml"
  artifact_paths:
    - "experiments/EXP-MLKEM-008/specification.yaml"
    - "experiments/EXP-MLKEM-008/runs/"
    - "experiments/EXP-MLKEM-008/execution-report.yaml"
  write_scope:
    - "experiments/EXP-MLKEM-008/"
  archived_by: "TASK-20260727-904"
  inference:
    policy: "executor-implementation"
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 14400
    memory_gb: 8
    maximum_runs: 4
  completion_gate:
    - "Exactly 4 planned runs reach a terminal status (completed_valid, completed_invalid, failed_infrastructure, failed_implementation, resource_exhaustion, cancelled_by_budget)."
    - "Every required artifact in the frozen specification exists and is schema-valid."
    - "Validation checks pass: expected run count, no duplicated or missing seeds, raw/summary agreement, control comparability, no unrecorded protocol deviation."
    - "No claim above claim_tier laboratory_implementation_conformance; no status of any ledger record changed by the Executor."
  return_format: "Immutable run records per required_artifacts plus execution-report.yaml."
