  objective: >-
    Reduce the uncertainty in whether one learned elimination trace of the
    per-attempt Macaulay matrix replays unchanged across relation attempts in
    regime A, at n = 17, m = 2, l = 9, D in {3, 4}. Implement
    experiments/EXP-CERTBIN-4e92d7/impl/ from the frozen specification (version
    1), run it once, and return observations. Interpret nothing beyond the
    mechanical application of the contract's decision rules DR-1..DR-8.

  uncertainty_reduced: >-
    E1 (the trace is unstable under re-targeting, generic F_2 degeneracy)
    against E2 (the S_3 target-independent block stabilises it), at one cell;
    the size of the only constant a trace could buy (the saving ratio); and
    whether the pruned matrices fit GPU on-chip budgets. Positive next
    decision: a T_set-level or pruned-replay GPU design contract, plus Stage 2
    (regime B). Negative next decision: strict replay is closed in regime A at
    this cell, and any GPU work there is trace-free masked batching.

  inputs:
    - >-
      experiments/EXP-CERTBIN-4e92d7/specification.yaml. The frozen contract,
      version 1, approved by DEC-20260923-b85c30. Its "object" block is the
      implementation spec. Implement it exactly, including the row order, the
      degrevlex column order with the constant LAST, the pivot rule, the four
      trace granularities and the fixed-schedule replay.
    - ledger/hypotheses/H-CERTBIN-a73f1c.yaml (predictions P1-P9 and HEUR-CERTBIN-TS1)
    - ledger/proposals/IDEA-20260923-5d0b8e.yaml (background; Proposition S in its mechanism)
    - >-
      knowledge/techniques/KN-TECH-b18366.md (the S_3 formula for Y^2 + XY =
      X^3 + AX^2 + B). Self-test it against point addition; do not trust it.
    - >-
      src/ic_first_fall_fast.py and src/macaulay_export.py. Reference only, for
      the Boolean monomial conventions. Do NOT reuse macaulay_rows' dynamic
      column set. This contract needs fixed-shape matrices.

  constraints:
    - id: EX-1
      text: >-
        SELF-TEST AND FIXTURE FIRST. Phase 0 must pass before any draw. It
        covers the modulus t^17 + t^3 + 1, field axioms, S_3 against point
        addition, descended equations against direct evaluation, Macaulay rows
        against naive multiplication, half-trace root finding, and the fixture
        dimensions 323 x 988 and 2924 x 4048. On failure, stop and report an
        implementation or contract defect. Never substitute a modulus or adjust
        a dimension to pass.
    - id: EX-2
      text: >-
        SEEDS AND COUNTS ARE FROZEN. Use exactly the 13 declared PCG64 seeds,
        the reference rule and the modal rule. Sample test targets WITHOUT
        replacement in x_R. Record every rejection. Never extend, trim, reseed
        or reorder a stream after seeing any output.
    - id: EX-3
      text: >-
        ARM MEMBERSHIP COMES FROM THE ORACLES, NEVER FROM THE SOLVER. Oracle A
        (O(2^l) root-finding) and oracle B (exhaustive 2^18) must agree on s for
        every curve-algebra instance. Re-verify every Boolean solution (C-WIT).
        A disagreement voids the arm-dependent metrics (INV-3); report it and
        do not patch it silently.
    - id: EX-4
      text: >-
        PROPOSITION S IS AN INSTRUMENT CHECK. PS0-PS3 run on every family at
        both D. Any violation voids the run as an implementation failure
        (INV-4). If no unsatisfiable reference has 1 in R_D at some D, record
        PS2 as VACUOUS there. That is a scope fact, not a failure.
    - id: EX-5
      text: >-
        ALL FOUR GRANULARITIES, ALWAYS. T_rank, T_set, T_strict and T_ops are
        reported for every family and D. Every verdict names its granularity
        and D (DR-8). The primary verdicts are T_strict at D = 4 on F-S3.
    - id: EX-6
      text: >-
        THE NULLS RUN THROUGH THE IDENTICAL PIPELINE: F-AFF-1..3 (paired r
        bytes), F-NULLF2 and F-RANDX, plus the F-S3-REV replicate, the
        F-PLANT arm and the phase-7 determinism re-run in a SEPARATE process.
        No family is dropped for cost. If time runs out, checkpoint and resume;
        the watchdog is machine protection (SR-5).
    - id: EX-7
      text: >-
        DECISION RULES ARE MECHANICAL. Apply DR-1..DR-8 exactly as written,
        including M3's ratio rule and the "not evaluable" outcomes, and record
        their inputs in decision-rules.json. Do not add a threshold, drop a
        reference or pick a granularity after seeing results.
    - id: EX-8
      text: >-
        OUTCOME HYGIENE. The top-level session ran an EXPLORATORY scratch
        script outside the repository. It is not a run of this contract. Do not
        read, import or copy its code or output. Do not use it to choose any
        parameter. Do not cite it anywhere. Write the implementation from the
        specification.
    - id: EX-9
      text: >-
        SCOPE AND TIER. Every deliverable states claim tier toy: a scoped
        measurement of this solver's trace stability on this family at this
        cell. No ECDLP cost claim is made, sota_delta is zero, and parallel
        Pollard rho dominates. Nothing is asserted about any deployed curve.
        certificate.kind is none.
    - id: EX-10
      text: >-
        OBSERVATIONS ONLY. Change no hypothesis status and write no evidence
        record, decision or knowledge entry. Do not edit the specification, any
        ledger record or any other experiment. Retain every failed attempt with
        its logs.
    - id: EX-11
      text: >-
        RESOURCES. Maximum memory 4 GB. One worker, unless the serial-vs-sharded
        byte-identity demonstration on the first 20 F-S3 targets passes; then
        at most 3 workers, recorded in the manifest. The watchdog is 86,400 s
        per run with --resume. maximum_runs is 2: one run, plus one re-run only
        after an INFRASTRUCTURE failure, with the failed attempt retained.
    - id: EX-12
      text: >-
        OUTPUT BOUND. Per-target records are gzipped JSONL with trace hashes
        only. Full op logs are kept for the F-S3 references only. The total run
        package must be under 50 MiB.

