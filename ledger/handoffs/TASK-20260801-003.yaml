handoff:
  id: TASK-20260801-003
  from: coordinator
  to: reviewer
  objective: >-
    Return PASS or REVISE on PA-DS-001-v2-ctrl-matched-null /
    CTRL-RT047-MATCHED-NULL.yaml at the TASK-20260801-002 snapshot. Two questions
    dominate and must each be answered explicitly. (1) IS THE DISPOSITION MAP
    GENUINELY PRE-REGISTERED - is it exhaustive over the two-proxy outcome space,
    are its thresholds inherited from H-DS-001 and R-1 rather than invented, is
    the middle band given a real reading rather than a placeholder, and could any
    plausible result be read into more than one branch or into no branch. (2) IS
    THE MATCHED-NULL CONSTRUCTION A FAIR MATCHED CONTROL - does Z/753848Z with a
    128-element negation-closed random signed factor base genuinely destroy
    elliptic-curve and Semaev structure while preserving the composition law, the
    order, the factor-base geometry, the arity, the representation density and
    above all the ALGORITHM, per docs/inventor-protocol.md section 3.2.
  uncertainty_reduced: >-
    Whether an independent session concurs that the reading rule is frozen before
    the data and that the null differs from the real object in structure only, or
    returns REVISE under RC-21.
  inputs:
  - experiments/EXP-DS-001/controls/CTRL-RT047-MATCHED-NULL.yaml
  - experiments/EXP-DS-001/amendments/v2_ctrl_matched_null.yaml
  - experiments/EXP-DS-001/specification.v2.yaml
  - experiments/EXP-DS-001/controls/CTRL-RT025-UNPLANTED.yaml
  - ledger/decisions/DEC-20260801-003.yaml
  - ledger/decisions/DEC-20260801-004.yaml
  - ledger/evidence/EV-DS-003.yaml
  - ledger/hypotheses/H-DS-001.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-020/reviews/TASK-20260731-047/red_team_report.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-021/archives/TASK-20260801-002/snapshot_commit_receipt.json
  constraints:
  - INDEPENDENT SESSION REQUIRED. You did not author the control addendum.
  - Verdict PASS or REVISE only.
  - >-
    If REVISE at any severity, the batch records non-execution for the control
    under the RC-21 one-cycle cap.
  - >-
    Test the pre-registration adversarially - try to construct a result the map
    cannot classify, or that it classifies two ways, and say so if you find one.
  - >-
    Test the matched null adversarially - name any structure the additive object
    accidentally retains, or any non-structural difference (per-operation cost of
    modular addition versus curve addition, table amortization, element encoding)
    that could move R_matched_null for a reason unrelated to structure.
  - Confirm PER_TARGET_CAP_SECONDS = 5.0 is declared with its bias direction and its suspension guard.
  - Confirm both cost proxies are required side by side with neither privileged.
  - Confirm claim_tier toy; no S1_met under any branch; no asymptotic path.
  - >-
    Confirm specification.v2.yaml, CTRL-RT025-UNPLANTED.yaml, the BATCH-020
    artifacts and EV-DS-001/002/003 are not edited.
  - >-
    Confirm the live plant is prohibited in this batch and CTRL-RT025-PLANT-LIVE
    stays undischarged.
  - MAKE NO COMMIT. Do not author repairs; report defects.
  - Do not alter H-DS-001, H-IC-001 or H-STR-002.
  deliverables:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-021/reviews/TASK-20260801-003/contract_review.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-021/reviews/TASK-20260801-003/preregistration_check.md
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-021/reviews/TASK-20260801-003/contract_review.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-021/reviews/TASK-20260801-003/preregistration_check.md
  archived_by: TASK-20260801-004
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 3600
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
  - >-
    PASS or REVISE recorded with rationale bound to the TASK-20260801-002
    snapshot, with an explicit separate verdict on pre-registration exhaustiveness
    and on matched-null fairness.
