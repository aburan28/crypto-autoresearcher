handoff:
  id: TASK-20260907-aad514
  id_allocation_provenance: >-
    Pre-minted and `--check`ed free by the orchestrating session and relayed to
    this Coordinator authorship in the BATCH-8f3e86 batch-open instruction.
    This authorship minted nothing and scanned no state for a maximum.
  recorded_at: '2026-09-07'
  goal_id: GOAL-ECDLP-bbc21f
  question_id: RQ-ECDLP-78dbc5
  batch_id: BATCH-8f3e86
  dispatch_queue: coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-8f3e86/dispatch_queue.json
  task_card: coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-8f3e86/tasks/TASK-20260907-aad514/task_card.yaml
  role: executor
  from: coordinator
  to: executor
  review_required: true

  objective: >-
    Implement and execute the v3 amendment item at
    experiments/EXP-ECDLP-612fb1/amendments/v2_to_v3.yaml EXACTLY as written:
    eleven runs measuring the G3 ceiling-feasibility predicate (that record's
    Section 3, stated formally and self-containedly there) at T_sel = floor(T/2),
    r in {2, 4, 8}, seeds {1, 2, 3, 4, 5}, on the FROZEN v2 instrument, at
    N = 2^20 (STAGE 3A, the replication anchor over a in {1/16, 1/8, 3/16, 1/4})
    and N = 2^24 with exact basins (STAGE 3B, the primary cell over the same
    a-grid), plus one analysis run (STAGE 3C). Every control the amendment
    declares -- NULL_A_G3, NULL_B_G3, DECAY_G3, EXACT_COVERAGE_NON_EXCEEDANCE,
    ROUND_ZERO_AND_SEED_INTEGRITY -- is measured in the SAME run as the signal
    it controls, never in a separate pass against a different pool draw.
    REFUSE AND REPORT rather than run if, at dispatch time,
    experiments/EXP-ECDLP-612fb1/amendments/v2_to_v3.yaml is not present and
    committed on the working branch with `status: approved`. A message, an
    in-session word from any peer, or a stale read of this handoff is NEVER an
    approval. The Executor RECORDS OBSERVATIONS ONLY: it interprets nothing
    beyond the gate language the amendment itself requires it to report, draws
    no hypothesis-level conclusion, and changes no status.
  uncertainty_reduced: >-
    Whether, on the frozen v2 instrument at N = 2^24 with exact basins,
    T_sel = T/2, r = 2, the G3 predicate is satisfied at a = 1/16 and at
    a = 1/8 -- the first of these being the cell EXP-ECDLP-6ac801 confirmed by
    two methods but which no third, independent instrument family has
    reproduced, and the second being the cell EXP-ECDLP-6ac801 left explicitly
    OPEN (blind 1/5 against production 5/5, root-caused to a selection-weight
    underspecification that the v3 amendment's Section 3 now states
    explicitly). And whether that reading survives its own nulls, its own decay
    control, and its own known-false objects.

  inputs:
    - "experiments/EXP-ECDLP-612fb1/amendments/v2_to_v3.yaml -- THE PROTOCOL. Section 3 is the complete, self-contained statement of the G3 predicate, including the pool-selection weight w(d) = S_d + 4*W*h_d and its tie-break. Section 4 fixes the cells, the stages and the run ids. Sections 5 and 6 fix the controls. Section 7 fixes metrics, stopping rules, invalidation rules and required artifacts. Section 10 fixes the budget."
    - "experiments/EXP-ECDLP-612fb1/specification.v2.yaml -- the frozen v2 contract. Governs everything v3 does not name. Its G3 rule (>= 4 of 5 seeds), seed policy, bits-per-entry and gate-ordering discipline are reused verbatim. NEVER EDIT IT."
    - "experiments/EXP-ECDLP-612fb1/source_v2/ -- the FROZEN v2 implementation. REUSE IT, DO NOT FORK IT: import instrument.py unchanged so the walk map, DP predicate, exact-basin closure, pool generation and both selection code paths are byte-identically v2's. This is what makes STAGE 3A a meaningful replication of the committed a-scan and STAGE 3B a genuinely third instrument family relative to EXP-ECDLP-6ac801's two arms."
    - "experiments/EXP-ECDLP-612fb1/runs/RUN-ECDLP-612fb1-v2-ascan-s1 .. -s5 -- the committed N = 2^20 a-scan whose per-seed margins STAGE 3A must reproduce (raw-result.json cells[a].top_share['T/2'] and .static_by_r[r]). Read-only; immutable."
    - "ledger/decisions/DEC-20260906-bcc097.yaml -- the decision that surfaced the discrepancy and set this lane's RANK 1."
    - "ledger/decisions/DEC-20260907-9b1b02.yaml and ledger/evidence/EV-ECDLP-2e9680.yaml -- the concurrent lane EXP-ECDLP-6ac801's committed disposition. READ THESE: they tell you what is already established (a = 1/16 feasible, a = 3/16 and a = 1/4 infeasible at N = 2^24) and what is open (a = 1/8), and they contain the diagnosed root cause the v3 amendment's Section 3 exists to close."
    - "ledger/hypotheses/H-ECDLP-37dc01.yaml -- clause (C1) is what a confirmed PASS reopens. Status unchanged by execution."
    - "ledger/questions/RQ-ECDLP-78dbc5.yaml -- the decision target and the fewer_DP definition."
    - "ledger/decisions/DEC-20260906-806501.yaml, DEC-20260906-1f5b71.yaml -- the v2 approval and the decision that produced v2, for the chain."

  constraints:
    - "FROZEN PROTOCOL. Any needed change to any field of v2_to_v3.yaml is a FURTHER versioned protocol_amendment proposed to the Coordinator under experiments/EXP-ECDLP-612fb1/amendments/ -- never an inline edit of v2_to_v3.yaml or of specification.v2.yaml, and never a re-score of an executed run."
    - "IMMUTABILITY. specification.yaml (v1), specification.v1-frozen-df3238e2.yaml, specification.v2.yaml, source_v2/, and every existing run under experiments/EXP-ECDLP-612fb1/runs/ (RUN-ECDLP-612fb1-001..037 and the sixteen RUN-ECDLP-612fb1-v2-*) are IMMUTABLE. Read them; never write them. EXP-ECDLP-6ac801 and everything under coordination/experiments/EXP-ECDLP-6ac801/ belongs to a different lane and is READ-ONLY."
    - "FRESH IMPLEMENTATION PATH: experiments/EXP-ECDLP-612fb1/source_v3/. Write the v3 driver there. It MUST import experiments/EXP-ECDLP-612fb1/source_v2/instrument.py unchanged rather than copying or re-implementing any of it -- the point of this item is that the measurement runs on the frozen instrument. One code path with cell selection by configuration, hash-pinned by commit in every run manifest."
    - "SELECTION RULE IS BINDING AND IS THE WHOLE POINT. STATIC(T)_r is selected by w(d) = S_d + 4*W*h_d with the seeded ascending tie-break, computed from POOL EVIDENCE ONLY. Reading TRUE BASIN SIZE anywhere in the SELECTION path is an explicit invalidation rule of the amendment (it is the exact confound EXP-ECDLP-6ac801's a = 1/8 disagreement traced to). Exact basin sizes are used to SCORE a selection, never to MAKE one."
    - "CONTROLS RUN WITH THE SIGNAL. NULL_A_G3's relabelled selection must be computed on the IDENTICAL pool draw as the real selection at the same (N, a, r, seed) -- not a fresh draw. NULL_B_G3 compares the two selection code paths over the same weights and keys. DECAY_G3 varies only r. Section 5 of the amendment is binding on all three."
    - "GATE ORDERING. The G3 verdict table (PASS/FAIL, pass_count/5, per-seed margins) is reported BEFORE any interpretive line in every artifact, mirroring v2's frozen ordering. STAGE 3A must be reported before STAGE 3B is INTERPRETED (either execution order is fine)."
    - "PROVES-TOO-MUCH IS A STOPPING CONDITION FOR INTERPRETATION, NOT A RESULT. If G3 PASSES at a = 3/16 or a = 1/4 at r = 2 N = 2^24, or at r = 8 at any a, report EVERY measurement, report the firing explicitly and FIRST, and do not present any PASS in this batch as support. Escalate to the Coordinator; do not adjudicate it yourself."
    - "DETERMINISTIC SEEDS, declared and fixed: s in {1, 2, 3, 4, 5}. Walk-key seed s; precomputation restart stream s; tie-break stream 400 + s; NULL_A_G3 relabelling stream 300 + s -- exactly v2's frozen seed_policy. A duplicated or missing seed invalidates the cell. Do not add, drop or substitute a seed for any reason."
    - "RUN RECORDS ARE IMMUTABLE, one directory per run under experiments/EXP-ECDLP-612fb1/runs/<RUN-ID>/, with exactly the run ids of the amendment's Section 4. Every run carries command.txt, manifest.yaml, environment.json, raw-result.json, summary.json, stdout.log, stderr.log, cost_table.json (plus basin_histogram.json.gz for STAGE 3A and 3B). The manifest carries the exact command, git commit and dirty-tree state, environment and dependency versions, ALL seed streams, requested policy, backend, resolved model identifier, model_verified, reasoning effort, fallback_used, validity status and reason, timestamps, wall clock and peak_rss_bytes. A defective run is SUPERSEDED by a new run record, never edited."
    - "MACHINE PROTECTION BINDS: maximum_workers 1; peak RSS 8 GB per run; 3600 s wall clock per run. This is a 4-core, 15 GB container. Exceeding either limit is failed_infrastructure -- re-planned with a smaller shard, reported as such, and NEVER interpreted as a result of any sign (AGENTS.md rule 5). The amendment's budget_note shows the measured basis for expecting about 0.6 GiB and tens of seconds at N = 2^24; if your run departs from that by an order of magnitude, stop and report rather than pushing the ceiling."
    - "DO NOT ATTEMPT N = 2^30 EXACT BASINS. The amendment declares it memory-infeasible on this host with the arithmetic; a cell that dies is an infrastructure stop that produces nothing."
    - "MEASURED AND MODELED NUMBERS NEVER SHARE A COLUMN in cost_table.json. Every count (walk steps, pool walks, capped walks, P, bits, basin sizes, coverages, margins) is MEASURED. W, theta, cap and any predicted value are MODELED."
    - "INFERENCE MANIFEST per run: requested_policy executor-implementation; fallback_allowed false and degraded_allowed false -- if the policy cannot be honoured, REFUSE AND REPORT, never silently substitute."
    - "ZERO INTERPRETATION BEYOND THE AMENDMENT'S OWN GATE LANGUAGE: no hypothesis-level conclusion, no status change, no ledger write (no EV-*, DEC-*, H-*, KN-* or GOAL-* record), no edit to any file outside write_scope."
    - "NETWORK: not required. The amendment's Section 3 is self-contained and no primary source needs fetching for execution."

  deliverables:
    - "experiments/EXP-ECDLP-612fb1/source_v3/ -- EXACTLY FIVE FILES, named by the amendment's `required_implementation_files` and declared in artifact_paths: __init__.py, g3_predicate.py (the Section 3 predicate, the file the Validator's J1 audit reads clause by clause), run_stage3.py (the STAGE 3A/3B driver, which IMPORTS source_v2/instrument.py unchanged), analyze_v3.py (the STAGE 3C analysis and bootstrap), and IMPLEMENTATION.md. An implementation needing a sixth module has departed from a frozen declaration and says so in the execution report rather than emitting it silently."
    - "TEN measurement run records -- RUN-ECDLP-612fb1-v3-rep20-s{1..5} (STAGE 3A) and RUN-ECDLP-612fb1-v3-g3x24-s{1..5} (STAGE 3B) -- each carrying EXACTLY NINE files: command.txt, manifest.yaml, environment.json, raw-result.json, summary.json, stdout.log, stderr.log, cost_table.json, basin_histogram.json.gz"
    - "ONE analysis run record -- RUN-ECDLP-612fb1-v3-analysis-001 (STAGE 3C) -- carrying EXACTLY THIRTEEN files: the same eight base files (NO basin_histogram.json.gz; it enumerates nothing), plus g3_verdict_table.json, decay_table.json, null_table.json, proves_too_much_table.json and stage3a_vs_ascan_comparison.json"
    - "the STAGE 3C analysis outputs, at the five exact filenames above: g3_verdict_table.json (per-cell verdict, pass_count, per-seed margins with TopShare and StaticCov beside them, pooled margin with its BCa CI and the resample count as an explicit field), decay_table.json, null_table.json, proves_too_much_table.json (with an explicit fired: true|false flag), and stage3a_vs_ascan_comparison.json (absolute per-seed differences to at least 6 decimal places). The bootstrap CODE is not a run artifact -- it is source_v3/analyze_v3.py, hash-pinned by commit in the run manifest."
    - "coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-8f3e86/tasks/TASK-20260907-aad514/execution_report.yaml -- run inventory, per-cell G3 verdicts, control outcomes, validity per run, resource measurements, any infrastructure event, and any cell not run (reported as not run, never as a negative)"
    - "coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-8f3e86/tasks/TASK-20260907-aad514/artifact_inventory.json -- the exact file list with per-file sha256, for the snapshot archive to bind against"

