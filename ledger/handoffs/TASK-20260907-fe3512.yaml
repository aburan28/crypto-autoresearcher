    - experiments/EXP-ECDLP-869870/execution-report.yaml
    - ledger/hypotheses/H-ECDLP-3550b8.yaml
  constraints:
    - Frozen scientific protocol. Additive amendment only. Never rewrite
      specification.yaml or v1 source/.
    - 16 runs, sequential, max_concurrent 1. Host is 4 cores / 15 GiB.
    - 8 GB RSS cap and 3600 s wall per run. OOM or timeout is
      failed_infrastructure, not a mathematical miss.
    - splitmix64 = v1 mix64. Walk index = top log2N bits. Seeds 1-5 are
      a determinism check against v1 RUN-ECDLP-869870-S-s{1..5}, not a
      re-score of those receipts.
    - murmur3_fmix64 = exact fmix64 from TASK-20260906-7ec3ea
      j2_rederive.py. Walk index = i mod N / low bits. Keys from
      sha256(f'ecdlp-869870-v2|{mixer}|{seed}|{i}').hexdigest()[:16],
      not v1 GOLDEN walk_keys.
    - Do not copy the validator's sealed 1.6814 / -0.109 numbers as this
      cell's result. Those are a prior, not a receipt.
    - Certificate required if any claimed solve or relation appears.
    - Core rules 4, 5, 9. No fabricated timings or outputs.
    - Bedrock prohibited.
    - Worker does not commit.
  deliverables:
    - experiments/EXP-ECDLP-869870/source_v2/instrument.py
    - experiments/EXP-ECDLP-869870/source_v2/run.py
    - experiments/EXP-ECDLP-869870/source_v2/run_generic_exact.py
    - experiments/EXP-ECDLP-869870/source_v2/README.md
    - 16 run directories RUN-ECDLP-869870-V2-{splitmix,murmur3}-s{1..8}
