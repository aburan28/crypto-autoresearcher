handoff:
  id: TASK-20260907-fe3512
  from: coordinator
  to: executor
  objective: >-
    Implement and execute the 16-run EXP-ECDLP-869870 v2 successor cell
    (PA-ECDLP-869870-v1-to-v2 / DEC-20260907-f394f5): N=2^24, T=256, a=1/4,
    8 keys, murmur3_fmix64 + splitmix64, sha256-derived keys, both
    published-weight and top-T-share gates. New code only under
    experiments/EXP-ECDLP-869870/source_v2/. Do not edit specification.yaml
    or source/. Do not re-score v1 runs. Record observations only.
    H-ECDLP-3550b8 stays specified.
  inputs:
    - experiments/EXP-ECDLP-869870/specification.yaml
    - experiments/EXP-ECDLP-869870/amendments/v2_rekeyed_fixture.yaml
    - experiments/EXP-ECDLP-869870/source/instrument.py
    - experiments/EXP-ECDLP-869870/source/run.py
    - experiments/EXP-ECDLP-869870/source/run_generic_exact.py
