handoff:
  id: TASK-20260907-b407d8
  id_allocation_provenance: Pre-minted and `--check`ed free by the orchestrating session and named exactly
    in this design task's instruction. This authorship minted nothing and grepped for no maximum.
  recorded_at: '2026-09-07'
  goal_id: GOAL-ECDLP-bbc21f
  question_id: RQ-ECDLP-78dbc5
  experiment_id: EXP-ECDLP-56117b
  hypothesis_id: H-ECDLP-37dc01
  batch_id: BATCH-473858
  dispatch_queue: coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-473858/dispatch_queue.json
  task_card: coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-473858/tasks/TASK-20260907-b407d8/task_card.yaml
  from: coordinator
  to: executor
  objective: Implement a G3 selector genuinely independent of experiments/EXP-ECDLP-612fb1/source_v2/instrument.py
    and of source_v3 and EXP-ECDLP-6ac801/source, then execute the frozen EXP-ECDLP-56117b cell grid (N=2^24
    exact basins; primary a=1/16 r=2 seeds 1-5; robustness a=1/8 r=2 seeds 1-20 with margin distribution;
    known-false a=1/4 r=2 seeds 1-5; decay r in {4,8} at a in {1/16,1/8} seeds 1-5) plus NULL_A on the
    primary pool and the analysis run RUN-ECDLP-56117b-analysis-001. Write every declared artifact path.
    Do not change hypothesis status.
  uncertainty_reduced: Whether an implementation that has not read source_v2/instrument.py (nor source_v3,
    nor EXP-ECDLP-6ac801/source) returns G3 PASS at a=1/16, r=2, N=2^24, T_sel=128 on seeds {1..5} --
    the cell EV-ECDLP-6783b8 explicitly does not retest -- and what the 20-seed margin distribution at
    a=1/8 looks like on that same independent family. Observations only; interpretation is reserved for
    EV-ECDLP-36c7c2.
  inputs:
  - experiments/EXP-ECDLP-56117b/specification.yaml
  - ledger/decisions/DEC-20260907-4c53a5.yaml
  - ledger/hypotheses/H-ECDLP-37dc01.yaml
  - ledger/questions/RQ-ECDLP-78dbc5.yaml
  - ledger/goals/GOAL-ECDLP-bbc21f/goal.yaml
  - experiments/EXP-ECDLP-612fb1/amendments/v2_to_v3.yaml
  - templates/research-records.md
  - docs/claims-and-verification.md
  constraints:
  - Independence is load-bearing. Do NOT read, import, copy, or sys.path-insert experiments/EXP-ECDLP-612fb1/source_v2/,
    experiments/EXP-ECDLP-612fb1/source_v3/, experiments/EXP-ECDLP-6ac801/source/, or any existing instrument.py
    in this lineage. Implement G3 from the formal statement in experiments/EXP-ECDLP-56117b/specification.yaml
    (copied from experiments/EXP-ECDLP-612fb1/amendments/v2_to_v3.yaml Section 3). Reading P2 is implemented
    by sampling a uniform random function on Z_N plus an independent Bernoulli(theta) DP-marking; reproducing
    mix64 is an invalidation.
  - Do not select distinguished points by true basin size. The selector uses only w(d) = S_d + 4*W*h_d
    with the declared seeded tie-break. Selecting by true basin size is a named invalidation.
  - Do not invent a NULL_T cell. NULL_A on the identical a16r2 pool is the only null. Do not add NULL_B.
  - Do not run N=2^30 exact basins. Do not run online RESEL-L arms.
  - Do not claim this experiment discharges residual R3 of BATCH-8f3e86. Whether EV-ECDLP-6783b8 discharges
    R3 at a=1/8 is an open question this contract does not decide.
  - Hypothesis H-ECDLP-37dc01 status stays analyzed. Do not edit ledger/hypotheses/H-ECDLP-37dc01.yaml,
    goal.yaml, any existing specification, any existing run, or experiments/EXP-ECDLP-6ac801/specification.v3.yaml.
  - Do not write ledger/evidence/EV-ECDLP-36c7c2.yaml. That identifier is reserved for /review-evidence.
  - Do not write TASK-20260907-e7bf9f, TASK-20260907-faef44, or TASK-20260907-2081a6.
  - Write ONLY under write_scope. Do not edit experiments/EXP-ECDLP-56117b/specification.yaml (Coordinator-owned,
    already frozen and approved).
  - 'maximum_workers: 1. Peak RSS 8 GB. 3600 s wall per run. Serial execution.'
  - BCa resampling unit is the seed. State that unit in g3_verdict_table.json. Do not claim 'stratified
    by seed' without defining the unit.
  - a8r2 (20 seeds) reports the margin distribution, not a binary 4/5 pass/fail. Do not apply a frozen
    4/5 threshold to that cell.
  - 'Known-false a=1/4: G3 FAIL is the expected outcome. A PASS fires proves-too-much.'
  - 'Decay: signal must be non-increasing in r. FAIL by r=8 is expected. A r=8 PASS is a decay-control
    failure.'
  - 'Run IDs are RUN-ECDLP-56117b-{cell}-s{seed} and RUN-ECDLP-56117b-analysis-001. Cells: a16r2, a8r2,
    a4r2, a16r4, a16r8, a8r4, a8r8.'
  - Claim tier is toy. Do not assert above toy.
  - A timeout, crash, or implementation failure is infrastructure signal, never a negative mathematical
    result.
  - Do not fabricate numbers. Missing data stays missing.
  - 'citation_provenance: every reference in execution_report.yaml carries provenance. Use internal for
    ledger/experiment records actually opened.'
  deliverables:
  - Independent G3 implementation under experiments/EXP-ECDLP-56117b/source/ as named in the specification.
  - 50 measurement run packages plus RUN-ECDLP-56117b-analysis-001, each with the exact required files.
