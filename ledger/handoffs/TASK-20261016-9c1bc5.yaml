    blindness:
      mutual: true
      lifted_for:
        - TASK-20261016-9c1bc5
      rationale: >-
        A single-reviewer round, so no sibling report exists. The lift is
        SEQUENCED and concerns the predecessor round, not a sibling. The
        reviewer is blind to coordination/goals/GOAL-MONO-001/review/TASK-20260930-40470a/
        until its blind re-derivation section and outputs are written, so that
        the re-derivation is not a replication of the predecessor's. After
        that it may read the predecessor report, because J2 and J3 must judge
        whether the cures answer that report's findings. The producer
        artifacts experiments/EXP-MONO-4b50b6/ and
        coordination/goals/GOAL-MONO-001/batches/BATCH-003/ stay closed
        throughout.
    proves_too_much:
      objects:
        - >-
          Object 1, a GENERIC base tuple: x_i drawn from F_p and NOT constrained
          to be x-coordinates of F_p-rational points. The census statistic
          varies there. An argument that also "proves" trivial Frobenius here
          proves too much.
        - >-
          Object 2, the D-4 factor-base-point count: fix T = x(R) and count
          factor-base-rational points on the fibre of the projection to the
          T-line. CORR-20261005-a53ac8 S3 says it is not condemned. An argument
          in the cured object that yields constancy for this count proves too
          much.
        - >-
          Object 3, an extension-field analogue (new in this round, tied to
          resource_check R2). E over F_{q^n} with q prime in 50-200 and n = 2,
          and the Gaudry/Diem-style factor base {P in E(F_{q^n}) : x(P) in
          F_q}. Take base points in that factor base. The group-law argument
          gives splitting of S_m(x_1..x_{m-1},T) over F_{q^n} only. Whether the
          roots lie in F_q (factor-base membership) is NOT forced, and the
          fraction of roots in F_q must vary. An argument that "proves" those
          roots lie in F_q, or that a q-Frobenius statistic is trivial there,
          proves too much.
      failure_signature: >-
        The argument succeeds (proves constancy, triviality or factor-base
        membership) on any object. Record the exact step that fails to stop at
        the locus boundary, which for object 3 is "rational over the field of
        definition of the points" versus "in the factor base". On object 3,
        also compute the fraction of roots in F_q over at least 20 random
        factor-base tuples at m=3 on one curve, to show the statistic is not
        constant there.
      assigned_to: TASK-20261016-9c1bc5
    blind_rederivation:
      required: true
      quantity: >-
        For p > 3, nonsingular E/F_p and affine P_1..P_{m-1} in E(F_p) with
        x_i = x(P_i): (i) the root multiset in P^1 of S_m(x_1..x_{m-1},T);
        (ii) its affine degree in T as a function of the base tuple; (iii) the
        fraction of generic fibres (squarefree, full degree 2^{m-2}) on which
        Frobenius acts non-trivially on the roots. Derive each from the group
        law and the defining property of Semaev polynomials (S_m(x_1..x_m) = 0
        iff there exist P_i with x(P_i) = x_i and P_1 + ... + P_m = O), using
        your OWN S_4 and S_5.
      parameters: >-
        At least two primes in 50-2000 and at least two curves of your choice.
        m=3 and m=4 exhaustive over factor-base tuples on at least one curve at
        a prime of at most 150. m=5 on at least 20 random factor-base tuples,
        plus the degenerate instances listed in J1's attack plan. The
        producers' curves (p=211, y^2 = x^3 + 3x + 8; the predecessor's
        C1-C5) are neither required nor forbidden. Declare what you used.
      blind_from:
        - experiments/EXP-MONO-4b50b6/
        - coordination/goals/GOAL-MONO-001/batches/BATCH-003/
        - coordination/goals/GOAL-MONO-001/review/TASK-20260930-40470a/
      blind_from_note: >-
        The third path is blind until the blind section is complete (RC-2;
        blindness.rationale). The first two are blind throughout.
      assigned_to: TASK-20261016-9c1bc5
