      test says "splits completely") on EVERY non-singular (A,B) pair for
      ALL primes in [101,199] (reuse the already-verified non-singularity
      check; do not skip pairs). If ANY disagreement is found, STOP
      immediately: do not run the real search, and instead write a
      complete manifest/execution_report classifying this as
      `specification_error` with the exact (p,A,B) counterexample(s).
    - >-
      If the gate passes: run the real Stage-0 search using the fast test
      as the PRIMARY splitting check for every (A,B) pair; ONLY when it
      says "splits completely" fall back to the existing, unmodified
      `cubic_roots(A,B,p)` to get the actual root values (needed for
      n_+/n_-/h_+/h_- and the downstream Q_e(T) construction, exactly as
      version 1 did once Z=3 was established). The declared search order
      (prime asc, A asc, B asc), range ([101,2000]), and qualifying
      filter (Z=3 AND h_+>=1 AND h_->=1 AND max(h_+,h_-)>=2) are
      UNCHANGED -- do not alter them in any way.
    - >-
      Once a qualifying curve is found: run the SAME M6 sanity check,
      Stage 1 (exhaustive census), and Stage 2 (D_sum/D_prod comparison)
      exactly as version 1's own script already implements (reuse that
      logic unmodified; only the Z-determination inside Stage 0 changes).

  constraints:
