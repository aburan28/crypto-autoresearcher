  what_to_do:
    - >-
      Implement the fast splitting test exactly as defined in the
      amendment's own `definitions_frozen.fast_splits_completely_test`:
      represent F_p[X]/(f(X)) via ordinary degree-<3 polynomial
      arithmetic mod p (reducing X^3 -> -AX-B mod f), compute X^p mod f(X)
      by repeated squaring (O(log p) polynomial multiplications, each
      O(1) since deg f < 3), and conclude f splits completely into 3
      distinct F_p-rational roots iff the result equals X exactly (the
      basis tuple for X in {1,X,X^2}) -- non-singularity (already checked
      before this test runs) rules out repeated roots for a short-
      Weierstrass cubic, so this single congruence check is sufficient.
    - >-
