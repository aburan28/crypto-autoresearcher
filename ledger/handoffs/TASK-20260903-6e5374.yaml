handoff:
  id: TASK-20260903-6e5374
  from: coordinator
  to: executor
  objective: >-
    Implement and run the frozen specification EXP-ECDLP-809375 (FG-1): an
    independent cross-implementation reproduction of the D1
    coordinate-valuation image on BOTH already-measured toy instances, using
    a group-theoretic order-n lift in affine Z/p^r arithmetic that shares no
    line, no lift method, and no group law with either existing script.
  uncertainty_reduced: >-
    Whether the D1 image {0, r} reported by RUN-ECDLP-c373eb-1 and -2 is a
    property of the mathematics or an artifact of the single implementation
    both runs share. The BATCH-e8a3a7 review round established those two runs
    share 266 of ~270 executable lines with every function byte-identical, so
    their agreement carries likelihood ratio 1 on exactly this question. A
    genuinely independent implementation agreeing (or disagreeing) is the one
    measurement that resolves it.
  inputs:
    - experiments/EXP-ECDLP-809375/specification.yaml (the frozen contract; implement exactly, do not amend)
    - ledger/hypotheses/H-ECDLP-a40416.yaml (the hypothesis under test)
    - ledger/decisions/DEC-20260903-9f1190.yaml (the decision commissioning this, and the J2 objection it must discharge)
    - ledger/evidence/EV-ECDLP-921b5d.yaml (the composed round evidence, incl. UC-1 and UC-2 which C-1 and C-3 close)
    - >-
      experiments/EXP-ECDLP-c373eb/runs/RUN-ECDLP-c373eb-1/manifest.yaml and
      RUN-ECDLP-c373eb-2/manifest.yaml -- READ ONLY for the recorded x_hat and
      y_hat values that control C-1 compares against, and for the instance
      parameters. Do NOT read either implementation script.
  constraints:
    - >-
      DO NOT OPEN, IMPORT, COPY, OR ADAPT
      experiments/EXP-ECDLP-c373eb/implementation/rc1_tabulation.py OR
      rc1_tabulation_run2.py. The entire purpose of this task is an
      implementation that shares nothing with them. If you open one, disclose
      it -- a disclosed deviation is recoverable, a concealed one destroys the
      task's only value.
    - >-
      Lift MUST be group-theoretic with no Hensel/Newton iteration:
      S_hat = [ p^(r-1) * ((p^(r-1))^{-1} mod n) ] L for any curve-satisfying
      lift L of S. Group law MUST be affine Z/p^r with explicit modular
      inverses, NOT Jacobian coordinates.
    - 'Exact integer arithmetic mod p^r throughout. No floating point for any p-adic quantity.'
    - 'Tabulate ALL pairs 1 <= j < k < n on both instances; no sampling.'
    - 'Run controls C-1 (per-digit uniqueness cross-check), C-2 (null lift), and C-3 (r and e sweeps) as the specification declares.'
    - 'certificate.kind must be none; state explicitly that a finite-precision computation observes only "at least r", never infinity.'
    - >-
      The run manifest MUST carry the full enforced schema from the start:
      top-level code, environment, inputs, timing, and result blocks. A prior
      run in this line omitted these and needed a follow-up fix; do not repeat
      it. experiments/EXP-SMTH-4403c4/runs/RUN-SMTH-4403c4-calib/manifest.yaml
      is a schema example.
    - >-
      Report observations only. Do NOT interpret whether the result supports or
      refutes H-ECDLP-a40416, do NOT change any hypothesis, experiment, or
      knowledge status, and do NOT create any B71/DEC/EV/KN-*/CORR record.
      Interpretation is a separate Coordinator step.
    - >-
      If your independent implementation DISAGREES with the recorded runs,
      that is a fully successful and highly valuable measurement. Report it
      plainly and do not attempt to reconcile, tune, or explain it away.
  deliverables:
    - experiments/EXP-ECDLP-809375/implementation/fg1_group_theoretic.py
    - experiments/EXP-ECDLP-809375/runs/RUN-ECDLP-809375-1/manifest.yaml
    - experiments/EXP-ECDLP-809375/runs/RUN-ECDLP-809375-1/command.txt
    - experiments/EXP-ECDLP-809375/runs/RUN-ECDLP-809375-1/environment.json
    - experiments/EXP-ECDLP-809375/runs/RUN-ECDLP-809375-1/stdout.log
    - experiments/EXP-ECDLP-809375/runs/RUN-ECDLP-809375-1/stderr.log
    - experiments/EXP-ECDLP-809375/runs/RUN-ECDLP-809375-1/raw-result.json
    - experiments/EXP-ECDLP-809375/execution-report.yaml
  artifact_paths:
    - experiments/EXP-ECDLP-809375/implementation/fg1_group_theoretic.py
    - experiments/EXP-ECDLP-809375/runs/RUN-ECDLP-809375-1/manifest.yaml
    - experiments/EXP-ECDLP-809375/runs/RUN-ECDLP-809375-1/command.txt
    - experiments/EXP-ECDLP-809375/runs/RUN-ECDLP-809375-1/environment.json
    - experiments/EXP-ECDLP-809375/runs/RUN-ECDLP-809375-1/stdout.log
    - experiments/EXP-ECDLP-809375/runs/RUN-ECDLP-809375-1/stderr.log
    - experiments/EXP-ECDLP-809375/runs/RUN-ECDLP-809375-1/raw-result.json
    - experiments/EXP-ECDLP-809375/execution-report.yaml
  archived_by: TASK-20260903-228c9e
  inference:
    policy: executor-implementation
    reasoning_effort: medium
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 600
    memory_gb: 1
