  objective: >-
    AUDIT ONE LANE CLOSURE AND ISSUE A DECISION EITHER WAY. Lane L5 of DEC-20260824-b7557b
    ("Substitute a published surface of high GEOMETRIC rank") is the closure that rules out the
    entire object class of high-geometric-rank elliptic surfaces as a route to rank >= 32 over Q.
    Every other lane closure in that decision is either external-dependency-gated (L4, L6) or rests
    on measured sieve economics. L5 does not. By the decision's own text L5 is closed on:
      (i)   ONE surface (Kloosterman arXiv:math/0502439 Thm 1.2);
      (ii)  a model TRANSCRIBED THROUGH THE EXPONENT-DROPPING RETRIEVAL TOOL, which the basis file
            itself says "SHOULD BE RE-RUN AGAINST A VERIFIED PDF BEFORE IT IS CITED";
      (iii) NO COMMITTED RUN RECORD for the 31 specialisations that produced the arithmetic-rank-0
            measurement;
      (iv)  a `remaining_open` field that states in the decision's own words: "Whether the descent
            gap is generic or particular to this surface is not established by one family. The
            obstruction's reversal is the live item."
    DETERMINE whether that basis is strong enough to carry the weight L5 bears, and issue a
    committed Coordinator decision that either (a) REAFFIRMS L5 with its limitations restated and
    the goal left `blocked`, or (b) SUPERSEDES it and opens a bounded measurement lane.

  why_this_lane_and_not_another: >-
    STATED SO THE SELECTION IS AUDITABLE RATHER THAN CONVENIENT. The Shioda-Tate ceiling that
    closes the elliptic-K3 route is PROVEN and is not in question: rho <= h^{1,1} = 20 caps
    Mordell-Weil at 18 over C, arXiv:0709.2908 rules out 18 over Q, so 17 is the maximum arithmetic
    generic rank on an elliptic K3 over Q. That ceiling applies to EULER CHARACTERISTIC 2 ONLY.
    For degree-d elliptic surfaces the same theorem gives rank MW <= 10d - 2, i.e. 28 at d = 3 and
    38 at d = 4. GENERIC RANK 32 OVER Q(t) IS THEREFORE NOT EXCLUDED BY SHIODA-TATE AT d >= 4.
    The scoping input coordination/goals/GOAL-ECQ-2298dc/inputs/SCOPING-recomputation-lane.md says
    of exactly this object class: "a different object class whose descent behaviour is UNSTUDIED
    HERE." An admitted gap is not a measured closure. L5 is the only lane closure standing between
    this campaign and that class, and L5 measured one surface.

  what_this_could_and_could_not_reach:
    could: >-
      A measured, committed statement of how arithmetic Mordell-Weil rank over Q(t) relates to
      geometric rank across several explicit families over Q -- the quantity L5 names and samples
      once. If the descent gap is total across all of them, L5 becomes a real measured closure with
      committed run records instead of a one-surface citation, and the campaign's blocked status is
      strengthened rather than weakened. That is a GOOD outcome, not a failed one.
    could_not: >-
      RANK 32 OVER Q. Nothing in this task produces a curve, a point, or a rank claim. It measures a
      descent gap. Even a maximally favourable result would only reopen a lane whose own next step
      is unpriced. NO DELIVERABLE OF THIS TASK MAY BE PRESENTED AS PROGRESS TOWARD C1, and the
      Coordinator must state that boundary in whatever it writes.
    prior: >-
      RECORDED BEFORE THE WORK. The honest prior is that the descent gap IS generic -- that is what
      Galois descent theory predicts and what Shioda's degree-829,440 example illustrates. The
      expected outcome of this audit is that L5 is REAFFIRMED. It is dispatched anyway because a
      closure whose own record calls its central question "the live item" has not been tested, and
      premature closure is a failure mode symmetric with overclaiming (docs/inventor-protocol.md).

  binding_constraints: >-
    1. THE OBJECTIVE IS RANK >= 32 OVER Q, LITERALLY. A rank over any number field -- quadratic,
       multiquadratic or otherwise -- is NOT this objective; a previous campaign's rank >= 31 over
       multiquadratic fields was rejected by the user for exactly this reason and that rejection
       binds here.
    2. GENERIC RANK OVER Q(t) IS NOT RANK OVER Q. It reaches rank over Q only by Silverman
       specialisation, and only at the value it actually attains.
    3. Only the Coordinator changes goal status or approves experiments. This task MAY change
       GOAL-ECQ-2298dc status and MAY approve a bounded protocol, because it is dispatched to the
       Coordinator for exactly that purpose. It may NOT run a search, and may NOT authorise one
       whose cost it has not priced.
    4. Records are immutable. DEC-20260824-b7557b is NOT to be edited. A different conclusion is a
       NEW decision that supersedes it and says so.
    5. Never fabricate commands, outputs, timings, statistics, citations, or runs. The
       arithmetic-rank-0 measurement in L5 HAS NO COMMITTED RUN RECORD; treat it as the decision
       already does -- a measurement of declared limited basis -- and do not cite it as though it
       had one.
    6. Every conclusion cites the experiment/run/evidence IDs supporting it, and is scoped to the
       surfaces, parameters and budget actually tested.

