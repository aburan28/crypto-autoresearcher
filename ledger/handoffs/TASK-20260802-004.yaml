handoff:
  id: TASK-20260802-004
  from: coordinator
  to: coordinator
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-028
  role: coordinator
  archive_kind: snapshot
  objective: >-
    Commit the exact TASK-20260802-003 contract package alone with this receipt,
    fixing the control contract, RR-IVR-1 and the wrapper in Git before any
    independent session reviews them and before any datum exists.
  uncertainty_reduced: >-
    Whether the pre-registration is durable, which is what makes every
    downstream number non-tunable.
  inputs:
  - 'TASK-20260802-003 artifacts'
  constraints:
  - 'RUN ALONE. Stage exactly the six paths in declared_commit_sets.TASK-20260802-004_snapshot.'
  - 'RUN tools/validate_ledger.py BEFORE STAGING and record the error count and any new error line naming these paths.'
  - 'DO NOT STAGE lpf001_driver.py, specification.yaml, reading_rule.yaml, reading_rule_v2.yaml, any existing run package, any tools/ file, ledger/goals/GOAL-ECDLP-001.yaml or ledger/hypotheses/H-LPF-001.yaml.'
  - >-
    RECORD SPECIFICATION_SHA256, READING_RULE_V1_SHA256, READING_RULE_V2_SHA256
    and DRIVER_SHA256 as named fields and REFUSE TO COMMIT if any differs from
    its bound value or if Git reports any of them as modified. ALSO RECORD
    CONTROL_SPEC_SHA256, RR_IVR_1_SHA256 and IVR_DRIVER_SHA256 as the newly
    bound values.
  - >-
    RECORD THE SEED-FAMILY TRIPWIRE - confirm from the contract report that
    real_object_touched is FALSE for 90001-90020 and that no file under
    experiments/EXP-LPF-001/results/ivr/ or
    experiments/EXP-LPF-001/runs/RUN-LPF-001-ivr/ exists yet. IF EITHER IS
    OTHERWISE, DO NOT COMMIT AND REPORT IT.
  - 'STATE NO INTERPRETATION, SELECT NO BRANCH, STATE NO DISPOSITION AND MAKE NO APPROVAL DETERMINATION.'
  - 'Commit message must contain TASK-20260802-004, TASK-20260802-003, EXP-LPF-001, RR-IVR-1, RUN-LPF-001-ivr, GOAL-ECDLP-001, BATCH-028.'
  - 'Do not push from this task.'
  deliverables:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/archives/TASK-20260802-004/snapshot_commit_receipt.json
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/archives/TASK-20260802-004/snapshot_commit_receipt.json
  archived_by: TASK-20260802-004
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 900
    memory_gb: 1
    maximum_runs: 1
  completion_gate:
  - >-
    Post-commit verifier accepts the exact six-path diff and hashes; the
    validator error count recorded; the four upstream sha256 fields matching
    their bound values and the three new ones recorded; the seed-family tripwire
    confirmed FALSE and no ivr run or result path existing; no interpretation,
    no branch selection and no authorization stated.
