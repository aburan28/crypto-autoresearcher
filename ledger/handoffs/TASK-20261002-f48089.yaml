  read_scope_note: >-
    The producer reads its lane's version-3 review reports and worksheet,
    which it must discharge (DEC-20261002-8cabf8 R-PRIOR-REPORTS), and may
    read the version-1 and version-2 lane-B files. Primary sources outside
