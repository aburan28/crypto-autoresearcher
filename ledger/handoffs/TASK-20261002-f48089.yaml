  created_at: '2026-10-02'
  created_by: coordinator
  from: coordinator
  to: coordinator
  goal_id: GOAL-ECDLP2M-001
  batch_id: BATCH-d08b44
  lane: LANE-B-V4
  batch_composers: DEC-20261002-962278 (written by TASK-20261002-b28b83)
  skill: /design-experiment
  review_required: true
  review_required_note: >-
    True. The contract gates a future execution, so it is reviewed by
    TASK-20261002-ed5777, TASK-20261002-1e7a71, TASK-20261002-bce101 and the
    blind TASK-20261002-997dbb at review-breakthrough at max under
    REVIEW-BINSTD-B-20261002-d08b44 before DEC-20261002-962278 can approve
    it.
  title: >-
    Revise lane B to version 4: write H-BINSTD-9b29a0 and EXP-BINSTD-811a2e
    (approved_by null) superseding H-BINSTD-17cf9d and EXP-BINSTD-c9c8a2, and
    a new audit sheet with every control, audit, rule-rate table and dry call
    as committed, import-safe code, discharging RV-1 to RV-15 of
    DEC-20260929-585602
  objective: >-
    Run /design-experiment on IDEA-20260926-136bd3 under RQ-BINSTD-b6f698 as a
    version-4 revision within DEC-20260928-63addc S2 scope and design
    conditions C1 to C8 unchanged, absorbing IDEA-20260926-d06324's two exact
    calibration rows and RC-1 controls as in versions 1 to 3. Write
    H-BINSTD-9b29a0 and EXP-BINSTD-811a2e (status review_required,
    approved_by null), each complete in itself and each carrying supersedes
    naming its version-3 record, and a new proof-search-map audit sheet in
    which every control, the exact-quotient audit, the degeneracy audit, the
    null false-fire table and the end-to-end stage3 dry call are committed,
    import-safe code with pass criteria stated before execution. Discharge
    RV-1 to RV-15 of DEC-20260929-585602 by number (revision_items below) and
    carry unchanged everything that decision's carried_unchanged names,
    except where an RV item requires a change, each change listed in a
    constants_delta or code_delta block. Zero runs.
  uncertainty_reduced: >-
    Whether a complete protocol exists whose stopping and invalidation rules
    leave a correctly functioning null run cleanly classified with high
    probability, whose degenerate declared rows cannot trigger a certificate
    refutation, whose every declared arm can reach every outcome its table
    assigns, and whose NEG and LEAD statements are scoped to floors measured
    on the path they are read on.
  revision_items:
    source: >-
      DEC-20260929-585602 revision_requirements RV-1 to RV-15, verbatim in
      substance; that decision is the authority where wording differs. Each
      remedy may be met by any equivalent route stated with its reason.
    breaking:
      - id: RV-1
        requirement: >-
          Make SR-6's image-size clause unable to fire on an arm that carries
          only the certificate's exact component up to a few points: count
          the image only over labels that occur in used conditioning cells,
          or require the clause's own exhaustive combining-rule verification
          before stopping. Audit every declared (arm, cell, M) for degeneracy
          (degeneracy_audit_form below) and record F5xF4 at M = 8 as
          degenerate, dropping or exempting it with the reason. Add a
          near-exact degenerate-label control (h4 plus a few exceptional
          points, on a permitted group) that SR-6 must not fire on.
      - id: RV-2
        requirement: >-
          Compute PC-16c's false-fail rate in code at design time on
          non-declared primes. Either plant a decay strong enough to push it
          below 0.01, or confine IR-23's PC-16c branch to LEAD and separate
          PC-16c from the clearance that NEG readings need, keeping L2
          guarded by a blocking control. Replace the hand slope with the
          computed one.
      - id: RV-3
        requirement: >-
          Identify every declared arm by role (for example F2@mid, F2@end) or
          map numeric offsets to roles before stage3 and heur_b2_held_out;
          report one verdict and one L2 interval per declared arm. Commit an
          end-to-end dry call of stage3 over the full declared (cell, M) name
          grid, with a planted excess per arm, showing that every declared arm
          can reach every outcome its table assigns.
      - id: RV-4
        requirement: >-
          Measure the resolving floor on the path NEG is read on (stratified
          shuffle, exact-saturated null, L3, on permitted groups of the
          declared shapes) for an exact-free and an exact-carrying planted
          mixture per declared (cell, M), and quote it beside NEG; or label
          the Z/l floor an underestimate with the measured ratio. Rewrite the
          NEG row, the mechanism and the method-ceiling sentences to the
          floor actually measured.
      - id: RV-5
        requirement: >-
          Scope the LEAD-reach sentence to what the controls show, with their
          rates. Add a curve-path LEAD-reach control (a planted exact-free
          and an exact-carrying filter on permitted groups of the lead
          shapes) beside PC-16, PC-16b and PC-16c. State the effective LEAD
          floor for exact-free arms (L1 against the exact-saturated null).
      - id: RV-6
        requirement: >-
          Run every design-time dry call, Monte Carlo and rule-rate
          computation only on permitted groups (DEC-20261002-8cabf8
          R-DECLARED-GROUPS; the declared_groups_rule of the plan). Correct
          the version-3 sheet's "no declared cell" statement in the new sheet
          and list every group, curve and label every design computation
          used. ISO-K13 and CELL-ZS16 may be kept as declared cells.
    non_breaking:
      - id: RV-7
        requirement: In stage3, return ART-DEF, never NEG or LEAD, when any ladder cell or lead key is missing or invalidated (IR-2, IR-6, IR-7), as SR-3 says; NEG requires at least one estimated (cell, M) per arm.
      - id: RV-8
        requirement: Align IR-1, IR-6 and IR-7 with issue_clearance, in either direction.
      - id: RV-9
        requirement: Delete the pre-written interpretation "exponent-relevant only in the counterfactual sense of the ceiling" (SR-4 says write no interpretation).
      - id: RV-10
        requirement: Keep the disclosed probable-prime scope of CODE-CERT and state it beside PC-CERT-4, or make the guard deterministic over the declared range.
      - id: RV-11
        requirement: >-
          Fix the two YAML scalars truncated by comment syntax; correct the F4
          summary prose; cite any version-2 review computation with its
          provenance.
      - id: RV-12
        requirement: >-
          Enforce the voiding of IR-17, IR-22 and SR-1 and the IR-2
          positivity check in code, or assign each explicitly to the driver.
          Give PC-9 on CELL-K17C a check that can detect a curve-sampler
          defect, or state the limitation.
      - id: RV-13
        requirement: >-
          Reconcile the itemised stage_split with the stated total. After RV-1
          and RV-2, price the expected attempts per cleanly classified run and
          the contingent review cost of any stop rule.
      - id: RV-14
        requirement: >-
          Report exhaustive purities at n = 23 or a non-degenerate interval at
          p-hat = 0. State in prose that the DF-8 type-II acceptance at n = 23
          is load-bearing for F3 at offset 0, and that CELL-O19 at p = 4 sits
          next to an R-M boundary.
      - id: RV-15
        requirement: >-
          Procedure; discharged by the plan (launch prompts stored verbatim).
          The audit sheet's discharge table names the plan clause and states
          that this producer's own launch prompt carried no review content.
    additional_design_items:
      - id: DI-FF
        source: DEC-20260929-585602 prior_versus_outcome what_this_says_about_the_prior; plan J3
        requirement: >-
          A null false-fire table. For every stopping, invalidation and
          admission rule of the contract as written, its firing rate under the
          contract's own null, computed in committed code by Monte Carlo on
          permitted groups of the declared shapes with seeds recorded; each at
          or below 0.05 or the rule redesigned; the aggregate probability that
          a correctly functioning null run ends cleanly classified (no stop,
          no voiding, no ART-DEF), at or above 0.8; and the expected attempts
          per clean run (RV-13).
      - id: DI-SP
        source: plan J3 attack (ii); DEC-20261002-a75609 NA-1 lesson
        requirement: >-
          A structural-premise statement per declared cell from parameter
          arithmetic only: the strata the stratified comparison uses (E/4E on
          Koblitz cells, E/2E on CELL-O19) and their compatibility with every
          declared M, stated before any calibration figure.
    carried_unchanged: >-
      DEC-20260929-585602 carried_unchanged: the capacity certificate and its
      four coded control readings; the Koblitz orders, admissibility, ladder
      and CELL-K41; R-M, R-S with constant 128 and the sample table; the
      ideal-tree, gap and closure tables and the threshold table as
      ceiling-model arithmetic; RR-1 route (a), the stratified shuffle and
      the exact-saturated null; PC-6c, PC-6d, PC-17, PC-18 and the XCO labels;
      CODE-AUDIT and its table; L2 as non-decay with per-seed widths; PC-16b;
      HEUR-B2 restated on L3; the RR-6 to RR-12 repairs; custody and approval
      fields; the stake as the column's ceiling; the lead route
      pre-registered and routed; the exclusions; PTM-A to PTM-E. Design
      conditions C1 to C8 of DEC-20260928-63addc S2, CORR-20260928-4cb669,
      CORR-20260925-649e25 and CORR-20260922-81aeab still bind.
  degeneracy_audit_form:
    name: the RV-1 degeneracy audit (CODE-AUDIT extended, or a new block)
    form: >-
      A committed, import-safe code block that reports, per declared (cell,
      arm, M) on CELL-K13, CELL-K19, CELL-K23, CELL-K41 and CELL-O19 at every
      declared alphabet, with labels on affine points only: (a) the image
      size, the number of non-empty label classes; (b) the smallest and the
      largest class size in points; (c) c_2, the least number of affine
      points on which the label differs from some function of the coset
      P + 2E, that is the sum over cosets of (affine points in the coset
      minus the largest number of them sharing one label), and on Koblitz
      cells c_4, the same for P + 4E; (d) purity_2 and, on Koblitz cells,
      purity_4 as CODE-AUDIT defines them. Exhaustive for n at most 23
      (RV-14); by a stated sample of at least 10^6 points with standard
      errors at n = 41, with a non-degenerate interval where an estimate is
      0. Its degeneracy rule (which rows are DEGENERATE, and what follows for
      SR-6 and the rules) is stated before execution. It never computes a
      bucket gain, a shuffle, a null draw, an estimator, a rule rate or a
      decision clause.
    output_table: Embedded in the audit sheet from C-4 as a design figure, with the command and seed.
  allowed_session_computations:
    authority: DEC-20261002-8cabf8 R-PRODUCER-COMPUTE, stated in advance
    note: >-
      This producer holds no shell. It may ask the top-level session to
      perform these and only these, in <session scratchpad>/BATCH-d08b44/TASK-20261002-f48089/,
      under /usr/local/bin/python3 (CPython 3.11.15), and embeds each command
      and its verbatim output in the audit sheet as a design figure, never a
      result. Code is run as written in the sheet and extracted by the pinned
      method. Every computation C-5 to C-8 runs only on permitted groups under
      R-DECLARED-GROUPS. The session never exports or copies a whole git
      tree into scratch.
    items:
      - C-1 extract each committed code block by the pinned method and compute its sha256; and recompute the version-3 reference sha256 of every block carried unchanged
      - >-
        C-2 a syntax check and an import-safety check of each block in a fresh
        /usr/local/bin/python3 (importing executes nothing), a scan for any
        3.12+ API, and a yaml.safe_load parse of each returned YAML file,
        reported verbatim and never repaired
      - C-3 run CODE-S0 through its __main__ entry and relay its output verbatim
      - >-
        C-4 run the committed exact-quotient audit and degeneracy audit on the
        declared curve cells (a deterministic enumeration of label classes
        against the 2E and 4E cosets, exhaustive at n at most 23, the stated
        sample at n = 41) and relay the output verbatim; this enumeration is a
        carve-out and never computes a gain, shuffle, null draw, estimator,
        rule rate or decision clause
      - >-
        C-5 run the committed false-fire code (DI-FF): Monte Carlo of every
        stopping, invalidation and admission rule under the contract's null,
        PC-16c's false-fail rate (RV-2) included, on permitted groups only,
        seeds recorded, output relayed verbatim
      - >-
        C-6 run the committed floor code: the NEG-path resolving floor for an
        exact-free and an exact-carrying planted mixture per declared (cell,
        M) shape (RV-4) and the effective LEAD floor for exact-free arms
        (RV-5), on permitted groups only, output relayed verbatim
      - >-
        C-7 run the committed end-to-end stage3 dry call over the full
        declared (cell, M, role) name grid with planted synthetic per-arm
        statistics (RV-3, RV-7), constructing no element of any excluded
        group, output relayed verbatim
      - >-
        C-8 dry calls of the stratified shuffle, the RR-2 control, the RR-10
        gate pin, SR-6 as revised and the near-exact degenerate control (RV-1)
        on synthetic data on permitted groups, output relayed verbatim
      - >-
        C-9 sha256 of the three version-3 files, the three version-2 files
        and the three version-1 files, relayed verbatim (custody baseline for
        constants_delta and code_delta)
    forbidden: >-
      Anything else. No bucket gain, shuffle, null draw, estimator, rule rate,
      decision clause or dry call on any declared cell or on any group in
      R-DECLARED-GROUPS outside the C-4 and C-7 carve-outs; no driver written
      or executed; no run; no file read outside the repository except the
      named primary sources and this card's scratch path.
  declared_groups:
    authority: DEC-20261002-8cabf8 R-DECLARED-GROUPS (RV-6); the plan's declared_groups_rule
    excluded: >-
      Every group isomorphic to the group of a declared cell of
      EXP-BINSTD-c9c8a2 or EXP-BINSTD-811a2e. Operationally no computation
      C-5 to C-8 on a group whose order is divisible by 2003, 130873,
      2095853, 549756390943, 261823, 32603, 137 or 239; on Z/2^17; or on any
      elliptic curve over F_(2^n) with n in 13, 17, 19, 23 or 41; and none on
      any further cell version 4 declares (list them).
    permitted: >-
      Groups of a declared cell's shape on primes outside that list (Z/(4 l')
      or Z/(2 l') with l' an adjacent non-declared prime of similar size;
      Z/2^k with k other than 17), synthetic labels, and non-declared toy
      curves over F_(2^n) with n outside 13, 17, 19, 23 and 41.
