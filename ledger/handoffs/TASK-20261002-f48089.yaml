  constraints:
    - >-
      DB4-1 Superseding and additive. Write exactly the three declared files,
      all new. H-BINSTD-9b29a0 carries supersedes H-BINSTD-17cf9d and
      EXP-BINSTD-811a2e carries supersedes EXP-BINSTD-c9c8a2, each with a
      supersession note citing DEC-20260929-585602, DEC-20261002-8cabf8 R-FORM
      and this card. Each record is complete in itself, not a diff. Edit no
      version-1, version-2 or version-3 file, no proposal (absorbed and cited
      records are cited by id), decision, correction, question, plan or goal
      record. Mint no identifier.
    - >-
      DB4-2 Scope unchanged: S2 of DEC-20260928-63addc only. No k-tree run at
      deployed parameters; no target-dependent filter family; no level above
      1; IDEA-20260926-d3c5a5's engine not used; IDEA-20260926-d06324's
      four-arm table not designed; the filter-gain measurement stays a
      control on a BINSTD certificate. Everything carried_unchanged names is
      carried.
    - DB4-3 RV-1 (breaking) -- SR-6 cannot fire on a near-exact degenerate arm; degeneracy audit in degeneracy_audit_form with its rule stated before execution; F5xF4 at M = 8 recorded degenerate and dropped or exempted with its reason; the near-exact control declared.
    - DB4-4 RV-2 (breaking) -- PC-16c's false-fail rate computed in code (C-5); the chosen remedy stated with its reason; L2 kept guarded by a blocking control; the computed slope replaces the hand slope.
    - DB4-5 RV-3 (breaking) -- every declared arm identified by role; one verdict and one L2 interval per arm; the end-to-end stage3 dry call committed and relayed (C-7).
    - DB4-6 RV-4 (breaking) -- the NEG-path floor measured per declared (cell, M) shape for exact-free and exact-carrying mixtures (C-6), quoted beside NEG with its scope; the NEG row, mechanism and method-ceiling sentences rewritten to it.
    - DB4-7 RV-5 (breaking) -- the LEAD-reach sentence scoped with rates; the curve-path LEAD-reach control declared; the effective LEAD floor for exact-free arms stated.
    - DB4-8 RV-6 (breaking) -- every design computation inside allowed_session_computations and on permitted groups (declared_groups); every group, curve and label used is listed; the corrected statement written.
    - DB4-9 RV-7 to RV-15, as revision_items states.
    - DB4-10 DI-FF and DI-SP -- the null false-fire table and the structural-premise statement, as additional_design_items states.
    - >-
      DB4-11 Carried blocks value-identical to the version-3 audit sheet bound
      by TASK-20260929-78e02e, or every difference listed in constants_delta
      with its arithmetic; every code block not changed is byte-identical to
      its version-3 reference sha256, and every changed or new block is
      listed in code_delta with what changed and why (plan J1 D-CARRY-B). If
      an arm definition, R-M, R-S or the degeneracy measure differs from the
      plan's blind card, say so as a rule change.
    - >-
      DB4-12 Every code block is a literal block scalar of the audit sheet with
      its extraction method and reference sha256 pinned; importing it
      executes nothing; it runs under CPython 3.11.15 (no
      random.binomialvariate or other 3.12+ API); every declared cell, arm and
      role is selected by name, never by an offset that varies with the cell.
      If code is revised after a session computation, the superseded block is
      bound by its sha256 in the sheet and both runs are recorded.
    - >-
      DB4-13 C1 to C8 of DEC-20260928-63addc S2 unchanged. No D1, D2 or D3
      quantity of CORR-20260928-4cb669 is used as a budget. Matched rho
      2^60.8090 (CORR-20260922-81aeab) on the ceiling and HEUR-B2 threshold
      lines only. Every per-orbit framing conditional under
      CORR-20260925-649e25. TW-02 routing kept.
    - DB4-14 Every approval field present; status review_required; approved_by null; an approval block naming DEC-20261002-962278 as the composing decision. The superseded status of versions 1 to 3 is not written here.
    - >-
      DB4-15 No sentence states an ECDLP speedup, a below-rho cell on
      ECC2K-130, a filter of capacity above 2 bits, or a closure, as an
      outcome (TV-1). Zero runs. No AUXIN census value, reviewer finding value
      of another lane, RUN-FROB value, EXP-FROB-30006a outcome, anything about
      an EXP-QSP-70b731 run, or any content of DEC-20261002-08c3f8,
      H-CERTBIN-6e6287 or EXP-CERTBIN-fad576.
    - >-
      DB4-16 YAML hygiene. Every prose value containing a colon followed by a
      space is a folded block scalar; code is a literal block scalar; check
      list-item and key indentation; write a complete skeleton first and fill
      it section by section; ask the session for C-2's parse of every file you
      wrote before you hand back.
    - DB4-17 Every citation carries provenance (recalled, retrieved, kb, internal); recalled references support nothing.
  deliverables:
    - ledger/hypotheses/H-BINSTD-9b29a0.yaml
    - experiments/EXP-BINSTD-811a2e/specification.yaml
    - >-
      proof-search-map-audit.yaml with: the proof_search_map audits; the C1 to
      C8 discharge table; the RV-1 to RV-15, DI-FF and DI-SP discharge table
      naming the clause that discharges each item; every code block with
