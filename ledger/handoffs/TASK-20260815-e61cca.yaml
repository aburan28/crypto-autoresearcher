  objective: >-
    PART A (new sampling, single-shard-only exponent completion). For EACH of shard 8001 and shard
    8002 SEPARATELY (no cross-shard pooling anywhere in Part A), for each decode variant (unmodified
    decode_blocks, V3-defected wrapper), call stage_a.py's real, unmodified _t_shard ONCE with
    n_trials = 10000 + 20000 = 30000 (single call per (shard, variant), exactly matching
    TASK-20260814-8bbdd2's discard-prefix technique, never two separate calls); retain only the
    trailing slice at indices [10000:30000) (20,000 new trials per shard) for every statistic;
    discard indices [0:10000) from all analysis (this is exactly TASK-20260809-a79e4f stage 2's
    already-consumed range on these two shards, T2_shard_8001 = T2_shard_8002 = 10000) but still
    compute them. Compute the single-shard-only (unpooled) local exponent for shard 8001 alone
    between its own committed T=10,000 se_paired at k=17 (TASK-20260809-a79e4f
    matched_pair_results.json stage_2.matched_pair.primary_cell_k17.shard_8001.se_paired) and this
    task's own new T=20,000 se_paired at k=17 on the retained tail; do the same for shard 8002
    alone. Report both, completing the four-shard table alongside the already-committed shard 5000
    (2.836) and shard 6000 (1.402) values (EV-HQC-469c08 O6) -- do NOT recompute 5000/6000, cite
    them. PART B (recomputation only, no new sampling). Using matched_pair_results.json's
    ALREADY-COMMITTED per-shard point estimates, compute an inverse-variance-weighted (IVW)
    combination (w_i = 1/se_paired_i^2, diff_ivw = sum(w_i*diff_i)/sum(w_i),
    se_ivw = 1/sqrt(sum(w_i))) at k=17 and, for every k in the intersection of both shards'
    evaluable_k ranges, for (a) shards 5000 and 6000 at their own committed T=5,000-each stage-1
    point estimates (stage_1.matched_pair.per_shard.shard_5000/shard_6000), reporting the IVW result
    alongside the existing concatenated-histogram pooled T=10,000 point
    (stage_1.matched_pair.primary_cell_k17.pooled), and (b) shards 8001 and 8002 at their own
    committed T=10,000-each stage-2 point estimates (stage_2.matched_pair.per_shard.shard_8001/shard_8002),
    reporting the IVW result alongside the existing concatenated-histogram pooled T=20,000-equivalent
    point (stage_2.matched_pair.primary_cell_k17.pooled). Report observations only.
  uncertainty_reduced: >-
    Whether the shard-to-shard estimator heterogeneity EV-HQC-469c08 O6/O7 found on shards 5000/6000
    (single-shard local exponents 2.836 and 1.402, both far outside [0.4,0.6], undercutting the
    "shard-specific to 8001/8002" reading) also holds on shards 8001/8002 themselves -- completing a
    confound-free, pooling-convention-free four-shard table rather than leaving it at two shards.
    Separately, whether the pooling-convention asymmetry EV-HQC-469c08 O8 named (arithmetic mean of
    per-shard SEs vs. SE of pooled data on the same log-log line) is materially compressing the
    reported pooled SE relative to an inverse-variance-weighted alternative that properly accounts
    for the now-measured between-shard heterogeneity.
