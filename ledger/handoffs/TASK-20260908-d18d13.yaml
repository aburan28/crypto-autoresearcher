  - path: coordination/experiment-reserve/BATCH-45b4d5/review-plan-TASK-20260908-89741c.yaml
    sha256: e4111202e16348a1231c603ccdd3aad02077771e7b9ba487004c115091a99cc3
  constraints:
  - You are not alone. Own only the five new final files; preserve all historical and concurrent work. Root retains
    all Git,queue,claim,archive and official-state authority.
  - Verify all hashes and read the complete predecessor, current review and governing writer. The mutable dispatch
    queue is deliberately excluded from same-commit source hashes.
  - Copy the complete fifth contract, schema and checker into a new five-file successor. Preserve all24 effective-contract
    sections other than artifact_custody, including the now-reviewed cost relations, all23 scientific sections,
    samples, seeds, arms, reducers, thresholds and public trust binding.
  - Add one closed top-level pre_run_outcome carrier alongside raw_cost, allocation_edge and full manifest. It is
    an operational receipt, never a RUN record. Require record_type, experiment_id, status, reason_code, stage,
    recorded_at_UTC, trusted_handoff and observed_authorization_input; permit optional detail and a conditional
    policy_resolution_failure block only.
  - The trusted_handoff object requires a canonical task_id and exact handoff_sha256 obtained from the trusted invoking
    Coordinator context before reading untrusted authorization bytes. Never copy those binding facts from the malformed
    payload. Missing trusted dispatch context is a harness invocation failure outside the CM run interface; no CM
    scientific entrypoint is admitted without it.
  - For pre_run_outcome, stage is authorize_and_claim_nonce. Derive permitted status/reason pairs exhaustively from
    the existing outcome_relation rows that permit that stage and have status refused_before_run or infrastructure_stopped.
    This includes all seven AUTH_* reasons and POLICY_RESOLUTION_FAILED. Preserve their existing meanings; arbitrary
    strings, completed-valid status and scientific branches are forbidden.
  - Observed authorization input is either a closed available object with the SHA256 and nonnegative integer byte
    length of the complete actually observed raw bytes, or a closed unavailable object with an explicit not_read,not_provided,read_failed
