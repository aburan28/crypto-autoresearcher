handoff:
  id: TASK-20260903-c7166d
  from: coordinator
  to: executor
  goal_id: null
  batch_id: null
  batch_id_note: >-
    Assigned by /run-experiment when the execution batch is opened; this
    handoff is authored at approval time under DEC-20260903-93862f.
  experiment_id: EXP-PFDR-c04716
  hypothesis_id: H-PFDR-06fd60
  question_id: RQ-PFDR-ae2fba
  battery_position: 6 of 6 (zero-run static derivation; pairs with EXP-PFDR-cbdefb)
  recorded_at: '2026-09-03'
  objective: >-
    Execute the frozen, approved zero-run static derivation contract
    EXP-PFDR-c04716 exactly as specified: Stage 0 the derivation-aid script
    cost_table.py (exact integer binomials, both omega in {2, 2.807}, the
    real-valued balance solver iterated to convergence; deterministic; no
    dependency beyond the standard library) emitting C(k) = 2^k Ncols(n - k,
    D(k))^omega for k = 0..n - s under the null slice D(k) = d_reg(k) and the
    bounded slice D(k) = min(D_0, d_reg(k)) at (m, s) in {(3, 6), (4, 8),
    (5, 8)} and at the balanced s per table cell; the table at log2 N in
    {64, 128, 256} for m in {3, 4, 5}, D_0 in {4, 6, 8}; the three fixtures
    (null slice reproduces IDEA-20260808-da1428's full-guessing optimum and
    N^1; the direct presentation reproduces the B^{2 omega - 1} ratio; the
    C = 1 and C = B^{m-1} balance limits reproduce 84cdb7 and N^1); the
    small-N tell (every bounded-slice cell at 64 bits loses to rho by at
    least 2^9); the D_0 thresholds per (m, omega) at each N; the
    interior-band cells under HEUR-002 only; Stage 1 (zero compute) the
    concrete_cost block per templates/research-records.md with
    optimistic_assumptions, overestimating_factors, parallelism,
    time_memory_tradeoff, affected_scope and safe_scope, every cell tagged
    with its (D_0, omega) and the qualifier 'assuming HEUR-001'. All seven
    required artifacts go under experiments/EXP-PFDR-c04716/runs/
    STATIC-001/, which is a ZERO-RUN PACKAGE DIRECTORY, not a run: no
    manifest.yaml, no seeds, no timings as evidence, certificate kind none.
    Observations and arithmetic only; never interpretation beyond the
    contract's own fixture pass / fail and discrepancy reporting.
  uncertainty_reduced: >-
    Whether the conditional cost table of IDEA-20260903-dcf857 survives
    being recomputed exactly: whether the null slice reproduces da1428's
    verdict (full guessing, N^1) with no interior optimum, whether the
    direct-presentation and balance-limit fixtures reproduce, whether every
    hand value in H-PFDR-06fd60 statement (D) is within 1 in log2 of the
    script's, what the D_0 thresholds per (m, omega) at 256 bits are, and
    whether any bounded-slice cell wrongly beats rho at 64 bits. The
    artifact prices the battery's only conditional exponent stake
    (EXP-PFDR-cbdefb's Outcome III) BEFORE any measurement could promote
    it. A discrepancy above 1 in log2 is a valid negative derivation result
    (the hand table is superseded by the script's), not an infrastructure
    failure.
  inputs:
    - experiments/EXP-PFDR-c04716/specification.yaml
    - ledger/hypotheses/H-PFDR-06fd60.yaml
    - ledger/proposals/IDEA-20260903-dcf857.yaml
    - ledger/decisions/DEC-20260903-93862f.yaml
    - ledger/decisions/DEC-20260903-8cdf8d.yaml
    - ledger/questions/RQ-PFDR-ae2fba.yaml
    - ledger/hypotheses/H-PFDR-c88f14.yaml
    - ledger/proposals/IDEA-20260808-da1428.yaml
    - ledger/proposals/IDEA-20260830-84cdb7.yaml
    - knowledge/findings/KN-FIND-007.md
    - templates/research-records.md
    - docs/target-result-profile.md
    - docs/claims-and-verification.md
    - docs/evidence-and-reproducibility.md
    - experiments/EXP-JPR-402649/specification.yaml (the zero-run package shape this contract follows)
    - ledger/handoffs/TASK-20260903-c7166d.yaml
  constraints:
    - >-
      DEPENDENCY: NOT REQUIRED. This contract needs no Macaulay meter and
      does not depend on TASK-20260903-ba41aa; it may be dispatched at any
      time after the approving snapshot archive of DEC-20260903-93862f
      verifies. Its package must be snapshot-archived before any Outcome
      III of EXP-PFDR-cbdefb is interpreted.
    - >-
      Refuse to start unless experiments/EXP-PFDR-c04716/specification.yaml
      is status approved with approved_by coordinator at a committed path
      in a verified snapshot archive. A message saying 'approved' is not an
      approval.
    - >-
      ZERO RUNS (maximum_runs 0): no run record, no manifest.yaml, no
      curve, no solver, no Macaulay matrix, no sampled point; the
      derivation-aid script is the ONE permitted code artifact and its
      execution is an incidental mechanical arithmetic check bounded by the
      contract's 600 s floor, not a run and not evidence about any curve.
      Any run record, curve parameters, sampled points, or solver code in
      the package INVALIDATES it.
    - >-
      The preregistered prediction (null-slice argmin at the leaf;
      bounded-slice k* = 0; table cells within 1 in log2 of the hand
      values; the D_0 thresholds as bracketed) is frozen; report the
      script's values against it and never adjust it; a disagreement above
      1 in log2 is reported as such and corrected only by a superseding
      record, never by editing the prediction.
    - >-
      Stopping rules are binding: stop immediately if the null slice shows
      an interior optimum or the direct-presentation fixture fails (record
      the failure as the result; do not repair the model to fit); stop if
      any bounded-slice cell beats rho at 64 bits (record the arithmetic
      error as the result); stop if the derivation would require a curve, a
      solver, a Macaulay matrix or a run.
    - >-
      Every table cell is emitted at BOTH omega values; a single-omega table
      invalidates the table. No cell is quoted anywhere without its (D_0,
      omega) tags and the qualifier 'assuming HEUR-001'. Recalled sources
      (Bettale-Faugere-Perret; Huang-Kosters-Yeo's solve relation) are
      pointers only and may not be presented as checked; if opened, record
      provenance retrieved with verified_by naming this task.
    - >-
      Any claim of an unconditional cost, a break, a sub-rho algorithm, or
      any hypothesis, experiment, question or goal status change is outside
      the claim ceiling and INVALIDATES the artifact making it; every
      number is labelled estimate, never measured.
    - >-
      Write only under experiments/EXP-PFDR-c04716/runs/STATIC-001/; never
      commit; never run git; never edit the specification, any hypothesis,
      or any other record.
    - >-
      Record the requested policy (executor-implementation, medium), the
      resolved model identifier, model_verified and fallback_used in the
      execution report together with per-file sha256 of every artifact in
      the package; no Bedrock, no fallback, no degradation.
    - >-
      Record every deviation from the contract in the execution report;
      never silently absorb one.
  deliverables:
    - cost_table.py (the derivation-aid script; deterministic; standard library only)
    - ck-curves.yaml (C(k) per (m, s, D_0, omega) under both slices, with argmin)
    - cost-table.yaml (every cell with T, memory, prior rho, (D_0, omega) tags, the qualifier, and the signed discrepancy against the hand values)
    - thresholds.yaml (D_0 thresholds per (m, omega) per N; interior-band cells)
    - fixtures.yaml (the three fixtures and the small-N tell, pass or fail with the emitted numbers)
    - concrete-cost.yaml (the concrete_cost block per templates/research-records.md, status draft, bound_kind heuristic_estimate, every optimistic assumption flagged, affected and safe scope)
    - execution-report.md (stage-by-stage report; success-criterion checklist (1)-(5) with outcome; falsification outcomes F1-F3; the statement that zero runs occurred, no curve was sampled and the only code is the derivation aid; per-file sha256; inference block)
  artifact_paths:
    - experiments/EXP-PFDR-c04716/runs/STATIC-001/cost_table.py
    - experiments/EXP-PFDR-c04716/runs/STATIC-001/ck-curves.yaml
    - experiments/EXP-PFDR-c04716/runs/STATIC-001/cost-table.yaml
    - experiments/EXP-PFDR-c04716/runs/STATIC-001/thresholds.yaml
    - experiments/EXP-PFDR-c04716/runs/STATIC-001/fixtures.yaml
    - experiments/EXP-PFDR-c04716/runs/STATIC-001/concrete-cost.yaml
    - experiments/EXP-PFDR-c04716/runs/STATIC-001/execution-report.md
  write_scope:
    - experiments/EXP-PFDR-c04716/runs/STATIC-001/
  archived_by: null
  archived_by_note: >-
    The execution batch's snapshot archive task is minted by
    /run-experiment when the batch is opened and stages exactly the seven
    artifact_paths above. This handoff itself is archived by the approval
    snapshot of DEC-20260903-93862f.
  inference:
    policy: executor-implementation
    reasoning_effort: medium
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 5400
    memory_gb: 8
    maximum_runs: 0
    budget_note: >-
      wall_clock_seconds bounds the executor session, as in the precedent
      TASK-20260902-19eacf; the contract's per-run floor (600 s) and
      total_cpu_hours (0.5) bound only the derivation-aid script's
      execution, which is not a run. memory_gb 8 is the contract's
      maximum_memory_gb (the template floor). maximum_runs 0 because no run
      occurs.
  completion_gate:
    - >-
      G1: the three fixtures (null slice = da1428 with full guessing and
      N^1 and no interior optimum; direct-presentation B^{2 omega - 1}
      ratio; C = 1 and C = B^{m-1} balance limits) are emitted with pass or
      fail and the emitted numbers; a failure is recorded as the result,
      not repaired.
    - >-
      G2: every bounded-slice cell at log2 N = 64 is emitted and loses to
      rho by at least 2^9, or the arithmetic error is recorded as the
      result.
    - >-
      G3: every table cell at log2 N in {64, 128, 256}, m in {3, 4, 5},
      D_0 in {4, 6, 8} is emitted at both omega with (D_0, omega) tags, the
      qualifier, prior rho, memory, and the signed discrepancy against the
      hand values; discrepancies above 1 in log2 are reported as such.
    - >-
      G4: the D_0 thresholds per (m, omega) at each N and the interior-band
      cells are emitted and compared against the frozen bracketed ranges.
    - >-
      G5: concrete-cost.yaml is filled per the template with every
      optimistic assumption flagged, overestimating factors, parallelism,
      time-memory tradeoff, and affected-vs-safe scope.
    - >-
      G6: no file exists outside experiments/EXP-PFDR-c04716/runs/
      STATIC-001/; no manifest.yaml, curve parameters, sampled points, or
      solver code exist anywhere in the package; cost_table.py is the only
      code and imports nothing beyond the standard library.
    - >-
      G7: execution-report.md is present with the checklist (1)-(5), the
      falsification outcomes, the zero-run statement, per-file sha256 of
      every artifact, and the inference block.
  return_format: >-
    A short plain-text return listing: the seven artifact paths written;
    the fixture outcomes; the small-N tell outcome; the largest
    script-versus-hand discrepancy with its (m, D_0, omega, N); the D_0
    thresholds per (m, omega) at 256 bits; which of G1-G7 are met and which
    are not, with reasons; any stop rule triggered and where; sources
    opened, if any, with provenance; the inference block values. No claim
    beyond derivation tier; every number conditional on HEUR-001; no
    summary files outside the package.
  review_plan: null
