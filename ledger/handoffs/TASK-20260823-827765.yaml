handoff:
  id: TASK-20260823-827765
  from: coordinator
  to: executor
  batch_id: BATCH-8b08ef
  goal_id: GOAL-ECQ-002
  hypothesis_id: H-ECQ-0ed5c8
  objective: >-
    TEST THE TUPLE LEVER WHERE IT HAS NEVER BEEN TESTED -- HIGH CEILING AT LOW CONTENT -- AND FINISH
    THE TRUNCATED NEGATIVE IN THE SAME RUN. Enumerate admissible canonical integer 6-tuples with the
    FREE SQUAREFREE-DISCRIMINANT PRE-FILTER APPLIED FIRST, over a spread box large enough to yield at
    least a few hundred families of Shioda-Tate ceiling >= 13 at log P2 below 6; then rank-search ALL
    of them PLUS the 2114 unsearched (family, t) pairs of BATCH-541940's 46 load-bearing families,
    across the full declared 73-value T-box with no height cap and no family cap; and report the
    COVERAGE FRACTION ACTUALLY REACHED, as numerator over denominator, beside the
    certified-rank-versus-height curve with the random-curve null next to it. THE JOB CHANGES WHAT IS
    ENUMERATED RATHER THAN SEARCHING THE SAME CENSUS HARDER, and the reason is a quantity rather than
    an adjective: ONE ceiling->=13 family below log P2 = 5 in an exhaustive census of 13077, twelve
    below 7.
  binding_text: >-
    The binding text is the red team's own next_concrete_action and resource_reading in
    coordination/goals/GOAL-ECQ-002/batches/BATCH-541940/tasks/TASK-20260823-33a825/objections.yaml
    (sha256 4f59a071490a6367021e14436887e0a962bb80c1a3ee5e600f8878a4521ead69). READ THEM DIRECTLY.
    They bind in preference to any paraphrase, including this objective.
  uncertainty_reduced: >-
    Whether the tuple lever moves the envelope AT CERTIFIED RANK 12 in the one stratum where it has
    never been tested, or whether the campaign's density-and-rate obstruction survives full coverage
    of a stratum deliberately built to be favourable.
  dispatch_precondition: >-
    AN EXP-ECQ-* CONTRACT FOR H-ECQ-0ed5c8 MUST BE MINTED, FROZEN AND COMMITTED BEFORE THIS TASK
    STARTS. Fourth consecutive batch owing it; DEC-20260823-ee9162 N1(h) states that a fifth instance
    should BLOCK DISPATCH rather than be recorded, so it is a precondition and not an open item. Mint
    with `python3 tools/allocate_id.py --next experiment --area ECQ`, then `--check` it. The
    Coordinator that authored this handoff has no shell and was issued no experiment identifier, so
    it could not write the contract itself.
  inputs:
  - ledger/hypotheses/H-ECQ-0ed5c8.yaml
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-8b08ef/review_plan.yaml
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-541940/tasks/TASK-20260823-33a825/objections.yaml
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-541940/tasks/TASK-20260823-e96bb6/verdict.yaml
  - ledger/decisions/DEC-20260823-ee9162.yaml
  - ledger/goals/GOAL-ECQ-002/checkpoints/BATCH-541940.yaml
  - coordination/goals/GOAL-ECQ-002/baseline/frontier_20260823.json
  - coordination/goals/GOAL-ECQ-002/baseline/icarm_database_20260823.json
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-541940/tasks/TASK-20260823-416e78/tuple_envelope_scan.json
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-541940/tasks/TASK-20260823-416e78/scripts/
  - knowledge/findings/KN-FIND-6b3e17.md
  constraints:
  - >-
    WRITE RUN RECORDS DIRECTLY TO experiments/EXP-ECQ-0e0cbb/runs/RUN-<id>/, with
    run.experiment_id set to EXP-ECQ-0e0cbb from the start. DO NOT write them under the batch
    tree. This is required by EXP-ECQ-0e0cbb's run_path_requirement and it is the MECHANICAL fix
    for a defect that has produced four post-hoc index shims across four batches
    (EXP-ECQ-89de3c, -139c9f, -7ea4c3, -a7d948): tools/validate_ledger.py indexes runs ONLY at
    experiments/*/runs/*/manifest.yaml, so runs written elsewhere make every evidence record that
    cites them unresolvable. A note in a record failed to prevent this three times. Your
    write_scope was amended before dispatch to include experiments/EXP-ECQ-0e0cbb for exactly
    this purpose. Deliverables still go in your batch task directory as declared. Your manifests
    must carry the validator's schema (code, environment, timing, result, inputs) and not only
    the producer-local field names, so that no mapping port is ever needed.
  - >-
    THE PRE-FILTER GOES FIRST. Apply the squarefree-discriminant test -- one resultant on the
    degree-20 discriminant over the finite T-line -- BEFORE any height evaluation, any Mestre-Nagao
    ordering and any rank search. Record its discard count and its cost, and state its soundness
    argument. It is an EFFICIENCY heuristic with measured support (extra <= 0 in 5169 searched fibres
    over |t| <= 800), NEVER an impossibility claim about the families it discards: the Shioda-Tate
    ceiling bounds the GENERIC rank, and a specialisation over Q can exceed it (KN-FIND-6b3e17).
  - >-
    READ EVERY FRONTIER AND BENCHMARK VALUE FROM THE FROZEN FILE AT RUN TIME AND ABORT THE RUN IF IT
    DIFFERS FROM THE AUDIT VALUE IN H-ECQ-0ed5c8. The r >= 12 cell is read from
    frontier_20260823.json (audit value 69.33884136527462); the construction-class benchmark is read
    from icarm_database_20260823.json entry id 1 (audit value 79.32867457792244). THE VALUE 79.329 IS
    WRONG AND MUST APPEAR NOWHERE -- validator F7 caught that rounding last batch, and it rounded in
    the direction that made the benchmark easier to beat.
  - >-
    PERSIST EVERY ATTEMPTED ROW with a status and a reason. Never let a dropped row fall into an
    arithmetic difference between attempted and measured: 462 families vanished that way in
    BATCH-541940 and a reviewer had to establish independently that the exclusion was mathematically
    correct.
  - >-
    REPORT COVERAGE AS A FRACTION, numerator over denominator, overall and per ceiling class, BESIDE
    EVERY NEGATIVE STATEMENT. BATCH-541940's load-bearing negative sat at 37.0 percent coverage and
    that number appears in no producer artifact. A negative without its coverage fraction is not a
    result.
  - >-
    COMPUTE EVERY CEILING FROM THE FAMILY'S OWN FIBRE CONFIGURATION as 18 - sum_v deg(v)(m_v - 1),
    with the Euler check sum(deg * v_disc) = 24 = 12d reported. THE CONSTRUCTION'S CAP IS 15, NOT THE
    GENERIC ELLIPTIC-K3 18: every admissible family measured so far carries a multiplicative fibre at
    T = infinity of type I_4 or I_6. Never read the generic bound.
  - >-
    THE STEERABLE QUANTITY IS THE NUMBER OF REDUCIBLE FINITE FIBRES, NOT THE FIBRE AT INFINITY, which
    is near-constant (I_4 on 13352 of 13391) and stratifies nothing. Do not reproduce BATCH-541940's
    section-3 column, which equalled sum(m_v - 1) + 1 on every row and was correct for 0.36 percent
    of them.
  - >-
    EVERY RANK IS A CERTIFIED LOWER BOUND from exhibited points verified in exact arithmetic; no
    floating point anywhere in a certification. Carry pari_ellrank_r_low, pari_ellrank_r_high and the
    alarm status into the ICARM-format record -- C1' names the ICARM verifier and BATCH-541940's
    submission-format deliverable dropped that field.
  - >-
    CHECK EVERY REPORTED CURVE AGAINST THE FROZEN SNAPSHOT BY curve_key AND BY a-invariants, AND
    AGAINST CREMONA'S TABLES. Both keys, and Cremona too: BATCH-541940 reported frozen board curve id
    108 as its own best at rank thresholds 3, 4 and 5, and no Cremona check has been performed
    anywhere in this campaign, though C1' names Cremona explicitly. A rediscovered board curve is a
    STRONG EXTERNAL POSITIVE CONTROL and must be claimed as one -- never as this program's own curve.
  - >-
    RUN THE REQUIRED NULL PROPERLY AND VERIFY IT (RT-CONTROL-2). A bottom rung with q irreducible of
    degree 6 whose Galois group admits no index-2 subgroup fixing a section pair (S_6 suffices), still
    solving phi = 0. VERIFY rather than assume: exhibit that ellrank finds no more points than the
    random-curve null at matched height, and check whether the trace P + P^sigma of a
    Galois-conjugate pair at the envelope argmin is a rational point of infinite order. The previous
    k = 0 rung was NOT a null object -- it gave 12 of 15 at rank >= 3 against 0 of 79 random curves at
    matched height.
  - >-
    EXTEND RT-CONTROL-3 to h approximately 60, 70, 80, 93 and 100 with n = 200, same instrument and
    same alarm. Below that it is a BOUND and not a distribution, and must be reported as a bound.
  - >-
    REPLICATE THE FLAT-ARM INTERCEPT REGRESSION (slope 0.8132, R^2 0.7732, n 13391) WITH A SECOND
    IMPLEMENTATION AND A RUN RECORD. It is the campaign's best positive result and it currently rests
    on one reviewer's unarchived code with no run record.
  - >-
    REPORT UNCERTAINTY. No median without its dispersion, no directional comparison without an
    interval, and no comparison between populations that is not matched on coefficient content AND on
    class size. Disclose every dropped or failed row of any ladder as generated-against-measured.
  - >-
    A TIMEOUT, PARI ALARM, CRASH OR MEMORY EXHAUSTION IS AN INFRASTRUCTURE OUTCOME AND NEVER NEGATIVE
    MATHEMATICAL EVIDENCE. Record time_budget_reached, alarm counts and exit status per run. If
    coverage of the target stratum is below 1.00 for any reason, report BRANCH C of H-ECQ-0ed5c8: the
    coverage fraction is the result and no negative is claimed.
  - >-
    DO NOT CHANGE THE TARGET THRESHOLDS after seeing the enumeration. Ceiling >= 13 and log P2 < 6 are
    pre-declared in H-ECQ-0ed5c8; changing either after the fact requires a versioned
    protocol_amendment record and must be reported as one.
  - >-
    PRIORITY ORDER IF WALL CLOCK BITES, and stop-and-report rather than silently truncating: (1)
    pre-filtered enumeration and the stratum population count; (2) full-coverage rank search of the
    target stratum; (3) the 2114 unsearched fibres of the existing 46; (4) RT-CONTROL-2; (5)
    RT-CONTROL-3 at n = 200; (6) the intercept replication; (7) identification of frozen board curve
    id 162 among the previous batch's 5092 certified curves and the board check on the r >= 2 row
    (25.4297). The provenance check on curves YOU report is not in this ordering -- it is mandatory on
    every reported curve.
  - >-
    NO CELL HAS BEEN TAKEN BY THIS CAMPAIGN IN THREE BATCHES, ON ANY METRIC, AT ANY THRESHOLD. A
    NEAR-MISS IS NOT A RECORD. Report a shortfall as a shortfall, with its exact gap, and do not round
    either way.
  - >-
    RANK >= 31 OVER Q REMAINS AN OPEN WORLD RECORD (30, Alpoge-Howell 2026). Nothing in this task is
    progress toward it and nothing may be presented as such.
  - DO NOT SUBMIT ANYTHING TO THE ICARM ENDPOINT AND MAKE NO NETWORK CALL.
  - WRITE ONLY INSIDE YOUR write_scope. NEVER COMMIT.
  deliverables:
  - >-
    coordination/goals/GOAL-ECQ-002/batches/BATCH-8b08ef/tasks/TASK-20260823-827765/stratum_enumeration.json:
    the pre-filtered enumeration. Per attempted tuple, a status and a reason; per surviving family,
    the canonical tuple, the spread, log P2, the full fibre census with the place at infinity,
    sum(m_v - 1), the Shioda-Tate ceiling, the Euler check, and the pre-filter decision with the
    resultant that produced it. Plus the headline counts: tuples tested, admissible, filter-discarded,
    and THE POPULATION COUNT of families with ceiling >= 13 and log P2 < 6.
  - >-
    coordination/goals/GOAL-ECQ-002/batches/BATCH-8b08ef/tasks/TASK-20260823-827765/rank_search_coverage.json:
    every attempted (family, t) pair with a status and a reason, and the coverage fraction as
    numerator over denominator -- overall, per ceiling class, and separately for the 2114 previously
    unsearched fibres of BATCH-541940's 46 families. Per searched fibre, the naive height, the
    certified rank lower bound, and the number of exhibited points.
  - >-
    coordination/goals/GOAL-ECQ-002/batches/BATCH-8b08ef/tasks/TASK-20260823-827765/best_candidates.json:
    the best (certified rank, minimal-model naive height) curves in ICARM format with their exhibited
    points, a-invariants, curve_key, pari_ellrank_r_low/r_high and alarm status, the frontier value
    read at run time for each threshold compared, cell_taken per row, and for EVERY curve the board
    check on both keys and the Cremona check with their outcomes.
  - >-
    coordination/goals/GOAL-ECQ-002/batches/BATCH-8b08ef/tasks/TASK-20260823-827765/null_controls.json:
    RT-CONTROL-2 (the verified section-free bottom rung, with the verification evidence and the
    P + P^sigma check) and RT-CONTROL-3 (the random-curve rank null at n = 200 across the height
    bands), with per-rung generated-against-measured counts and the rank distributions.
  - >-
    coordination/goals/GOAL-ECQ-002/batches/BATCH-8b08ef/tasks/TASK-20260823-827765/intercept_replication.json:
    the flat-arm intercept regression recomputed by a SECOND implementation over the same n = 13391
    population, with slope, R^2, n, the run id, and a statement of what code was and was not reused.
  - >-
    coordination/goals/GOAL-ECQ-002/batches/BATCH-8b08ef/tasks/TASK-20260823-827765/report.md: what
    was enumerated, what was searched, the coverage fraction reached, and WHICH BRANCH OF
    H-ECQ-0ed5c8 FIRED -- A, B or C -- named explicitly and defended against its own pre-declared
    condition. Every negative carries its coverage fraction; every claim carries its scope.
  artifact_paths:
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-8b08ef/tasks/TASK-20260823-827765/report.md
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-8b08ef/tasks/TASK-20260823-827765/stratum_enumeration.json
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-8b08ef/tasks/TASK-20260823-827765/rank_search_coverage.json
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-8b08ef/tasks/TASK-20260823-827765/best_candidates.json
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-8b08ef/tasks/TASK-20260823-827765/null_controls.json
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-8b08ef/tasks/TASK-20260823-827765/intercept_replication.json
  archived_by: TASK-20260823-8ea188
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 3600
    memory_gb: 4
    maximum_runs: 80
    artifact_size_budget:
      committed_total_mib: 25
      per_file_mib: 5
      exceptions_declared: []
      rule: >-
        Non-null per DEC-20260823-ee9162 R15, which binds from this handoff onward and which the
        Coordinator must refuse its own handoff for if left null. Raw per-fibre dumps that would
        exceed either figure are REDUCED AT SOURCE to per-family or per-fibre summary rows, or
        retained OUT OF BAND with their sha256, row count and exact regeneration command recorded in
        the run record. Never capped, whatever the budget: manifest.yaml, command.txt,
        environment.json, stdout.log, stderr.log and a machine-readable summary of results.
        BATCH-541940 committed 328.0 MiB across 100 files, three of them above 44 MB, and the only
        cost-free moment to act was before the producer wrote.
    budget_honesty: >-
      This 3600 s cap sits inside roughly 7.1 ks nominally remaining of the campaign's 21600 s. THAT
      REMAINING FIGURE USES THE CAMPAIGN'S OWN ACCOUNTING CONVENTION, WHICH CHARGES PRODUCER WALL
      CLOCK ONLY AND THEREFORE UNDERSTATES TRUE CONSUMPTION SUBSTANTIALLY -- the BATCH-541940 red team
      alone reported about 2600 s of its own compute, and validator and archival sessions are
      unmeasured. It is a measurement convention, not a claim, and it is carried unchanged only so the
      number stays comparable across batches. The true remaining headroom is smaller, and this batch
      is the last either way.
  completion_gate:
  - >-
    the squarefree-discriminant pre-filter applied BEFORE any height evaluation, with its discard
    count, its cost and its soundness argument recorded
  - >-
    the stratum population count reported: families with ceiling >= 13 and log P2 < 6 in the enlarged
    box
  - >-
    coverage reported as a fraction, numerator over denominator, overall and per ceiling class,
    including the 2114 previously unsearched fibres
  - every attempted row persisted with a status and a reason, with no row lost to an arithmetic difference
  - frontier and benchmark values READ at run time with the abort-on-mismatch assertion present and exercised
  - >-
    every reported curve checked against the frozen snapshot by curve_key AND by a-invariants and
    against Cremona's tables
  - RT-CONTROL-2 built and VERIFIED rather than assumed, and RT-CONTROL-3 run at n = 200
  - the flat-arm intercept regression replicated by a second implementation with a run record
  - >-
    branch A, B or C of H-ECQ-0ed5c8 named explicitly in report.md and defended against its
    pre-declared condition
  - nothing submitted to ICARM and no network call made
  return_format: >-
    executor execution report: what was run, what was measured, what failed, and what was NOT reached
    and why.
  review_plan:
    binding_text_note: >-
      SUMMARY ONLY. The binding plan is
      coordination/goals/GOAL-ECQ-002/batches/BATCH-8b08ef/review_plan.yaml, which is committed
      before this producer runs and carries the four recorded priors, the pre-committed disbelief
      list, the full attack plans, the proves_too_much objects and the blind_rederivation
      declaration. If this block and that file differ, THAT FILE GOVERNS and the difference is a
      defect to report.
    claim_under_review: >-
      That a pre-filtered enumeration over an enlarged spread box populates the high-ceiling
      low-content stratum; that a full-coverage rank search of it plus the 2114 unsearched fibres
      reaches a stated coverage fraction; and that the resulting minimum naive height at certified
      rank >= 12 does or does not fall below the construction-class benchmark read from the frozen
      snapshot at run time.
    coordinator_prior: >-
      I expect branch B and I expect not to reach it: I expect the stratum to populate (P1), the best
      certified rank->=12 height to land above 79.32867457792244 (P2), the genuine null rung to show
      clearly higher envelopes than the k = 6 treatment (P3), and FULL COVERAGE NOT TO BE REACHED
      inside 3600 s (P4), which would fire branch C rather than branch B and close the campaign at
      budget on a coverage fraction rather than on a closed lever.
    joints:
    - joint: >-
        J1 is the enumerated stratum what it claims to be -- pre-filter soundness, stratum
        population, and per-family ceilings against a cap of 15
      assigned_to: TASK-20260823-cb510c
      attack_plan: >-
        Re-enumerate a sub-box with your own squarefree test and hunt for the one artifact that
        invalidates the job: a family with ceiling >= 13 that the filter discarded. Re-derive at least
        six full fibre censuses from scratch with the Euler check, and recount the population at
        log P2 < 6 yourself.
      breaking_artifact: >-
        An exhibited ceiling->=13 family that the pre-filter discarded, or a population count
        materially below the reported one.
    - joint: >-
        J2 does the best candidate survive independent re-derivation, and is every reported curve this
        program's own
      assigned_to: TASK-20260823-cb510c
      attack_plan: >-
        Recompute c4, c6, Delta and the height in exact integer arithmetic from a-invariants alone,
        settle global minimality, re-certify rank with your own F_l certifier under positive and
        negative controls, then intersect the FULL certified set against the frozen snapshot on both
        keys and run the Cremona check that has never been run.
      breaking_artifact: >-
        A height or rank that does not reproduce, or a reported curve present in the frozen snapshot
        or in Cremona's tables.
    - joint: J3 is the coverage claim real, and is every conclusion bound to the set actually searched
      assigned_to: TASK-20260823-d03635
      attack_plan: >-
        Reconstruct numerator and denominator from the raw run records rather than the report, per
        ceiling class, and apply the quantifier test of H-ECQ-0ed5c8 proof_search_map.quantifier_order
        to every negative sentence in the report.
      breaking_artifact: >-
        A coverage fraction materially below the reported one, or a branch-B claim asserted at
        coverage below 1.00.
    - joint: J4 is the null actually a null, and would anything here satisfy C1' honestly
      assigned_to: TASK-20260823-d03635
      attack_plan: >-
        Do not accept irreducibility as proof of no rational sections: form the trace P + P^sigma of a
        Galois-conjugate pair at a rung family's envelope argmin and check for a rational point of
        infinite order. Then answer all four C1' conditions independently, including the ones made
        moot by an earlier failure.
      breaking_artifact: >-
        A rational point of infinite order on a rung declared section-free, or a C1' condition passed
        by assertion rather than by check.
    blindness:
      mutual: true
      lifted_for: []
      rationale: null
    proves_too_much:
      objects:
      - >-
        Mestre's published tuple A (-17, -16, 10, 11, 14, 17), rank >= 11 over Q(T): the ceiling code
        must not assign it below 11 and the pre-filter must not discard it
      - >-
        a generic ceiling-9 family with six finite I_2 fibres: the pre-filter MUST discard it, or it
        filters nothing
      - >-
        the BATCH-541940 k = 0 rung, known to retain forced rational rank: any
        no-sections-implies-no-rank argument must FAIL on it
      - >-
        frozen board curve id 108, ainvs [1, -1, 0, -415, 3481]: any provenance check must FLAG it
        rather than report it as novel
      failure_signature: >-
        An argument or filter that succeeds on the generic ceiling-9 family, or passes board curve 108
        as novel, or concludes rank 0 on the k = 0 rung, or assigns tuple A a ceiling below 11, has
        proved too much and is wrong somewhere it has not been read closely enough. State what each
        object's PASS looks like before running it, or the control cannot fail.
      assigned_to: >-
        TASK-20260823-cb510c owns the tuple-A and ceiling-9 objects; TASK-20260823-d03635 owns the
        k = 0 rung and board curve 108
    blind_rederivation:
      required: true
      quantity: >-
        The minimal-model naive height log max(|c4|^3, c6^2) of the best certified rank->=12 curve
        computed from its a-invariants alone; and the Shioda-Tate ceiling of a stated admissible
        6-tuple as 18 - sum_v deg(v)(m_v - 1) over its own fibre configuration including the place at
        infinity, with the Euler check sum(deg * v_disc) = 24 = 12d reported alongside.
      parameters: >-
        The tuple, the specialisation parameter t and the a-invariants exactly as recorded in the
        producer's machine-readable deliverable; nothing else. Do not take the producer's c4, c6,
        Delta, fibre list or ceiling as input.
      blind_from:
      - coordination/goals/GOAL-ECQ-002/batches/BATCH-8b08ef/tasks/TASK-20260823-827765/scripts
      - coordination/goals/GOAL-ECQ-002/batches/BATCH-8b08ef/tasks/TASK-20260823-827765/report.md
      - coordination/goals/GOAL-ECQ-002/batches/BATCH-8b08ef/tasks/TASK-20260823-827765/implementation.md
      - coordination/goals/GOAL-ECQ-002/batches/BATCH-541940/tasks/TASK-20260823-416e78/scripts
      assigned_to: TASK-20260823-cb510c
    procedure_deviations: []
