handoff:
  id: TASK-20260810-cbd708
  recorded_at: '2026-08-10'
  goal_id: GOAL-MD5-001
  question_id: RQ-MDFIVE-6870c1
  batch_id: BATCH-46254b
  task_card: coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/task-cards/TASK-20260810-cbd708.md
  role: coordinator
  from: coordinator
  to: coordinator
  objective: >-
    Open the first batch of GOAL-MD5-001 as a gate batch that asserts nothing
    about MD5, in a shape that discharges the two hard preconditions
    RQ-MDFIVE-6870c1 imposes before any experiment may be designed, and that
    freezes the blind-calibration scoring protocol BEFORE the acquisition it
    must survive.
  uncertainty_reduced: >-
    Whether a draft goal whose blindness requirement and whose acquisition
    requirement pull against each other admits a bounded, budgeted,
    archive-complete first batch that satisfies both - and if so, what the
    firewall between them actually has to be to remain auditable after the fact.
  inputs:
    - >-
      GOAL-MD5-001, status draft, campaign_budget 6 batches and 10800 s, no
      batch ever opened
    - >-
      RQ-MDFIVE-6870c1, whose constraints and claim_tier_ceiling bind this batch
    - >-
      BATCH-2b0fd1 of GOAL-AES-002, read as a render-verified structural
      template only and not as a source of content
    - >-
      docs/claims-and-verification.md for the claim tiers and the certificate
      discipline
    - >-
      docs/inventor-protocol.md, whose null-object control supplies the only
      available recall-vs-search discriminator
  constraints:
    - >-
      SC-1 FABRICATE NOTHING. No invented timing, measurement, throughput,
      citation, review verdict, model identifier or commit SHA. A field that is
      not yet knowable stays null and is named as such.
    - >-
      SC-2 CLAIM CEILING. Assert nothing about MD5 - no collision, no preimage,
      no complexity, no method ceiling, no obstruction, and no comparison
      against any published result in either direction. Under RQ-MDFIVE-6870c1
      claim_tier_ceiling, instrument-calibration results carry no cryptanalytic
      content at all, and this batch does not even reach one.
    - >-
      SC-3 UNVERIFIED FIGURES STAY MARKED. Every figure in RQ-MDFIVE-6870c1
      provenance is web-search excerpt not read in primary text - the ~2^123.4
      preimage complexity, every paper title, and the excerpt calling the 2009
      result the first practical preimage attack, which the RQ flags as an
      apparent error. Mark them unverified wherever mentioned; never cite one as
      authority in either direction; do not settle the flag by assertion.
    - >-
      SC-4 A failed, halted or exhausted search is a BUDGET OUTCOME about a
      solver and NEVER evidence about MD5 (AGENTS.md rules 5 and 8).
    - >-
      SC-5 Anything not attempted is named OPEN AND UNATTEMPTED and is never
      recorded as tried, screened or negative.
    - >-
      SC-6 Change no hypothesis, question, experiment or goal status; approve no
      experiment; promote no knowledge; edit no committed record; record no
      attestation and no review verdict.
    - >-
      SC-7 Halt at the declared wall_clock_seconds and report the halt
      truthfully as infrastructure signal, naming the dropped work as scope
      rather than as an answer.
    - >-
      SC-8 Never select, configure, probe, contact or use Amazon Bedrock, in any
      runtime, backend, endpoint, model identifier, fallback or probe (AGENTS.md
      rule 16).
    - >-
      Do NOT alter campaign_budget. Record the adequacy judgement as an
      observation with its reasoning and its named remedies; a budget change is
      a separate decision on its own merits and needs a measured sizing basis
      this batch has not yet produced.
    - >-
      Use only pre-allocated identifiers. This session has no Bash and cannot
      mint or check one; guessing an identifier is how two worktrees write
      different records under one name.
    - >-
      Do not write the ten handoff records, the task cards, or any edit to
      ledger/goals/GOAL-MD5-001.yaml. A second pass owns those, and this task
      must say so plainly rather than leave the omission to be discovered.
  deliverables:
    - >-
      batch record for BATCH-46254b carrying the ranked shape, the contamination
      firewall, the budget split and the campaign-budget observation
    - >-
      dispatch queue for the ten tasks with disjoint write scopes and exactly
      one archival task per producer
    - opening coordinator decision DEC-20260810-9942ea
  artifact_paths:
    - coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/batch.yaml
    - coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/dispatch_queue.json
    - ledger/decisions/DEC-20260810-9942ea.yaml
  archived_by: TASK-20260810-fc23ce
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 400
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
    - >-
      Exactly three files exist and no others: the batch record, this queue, and
      DEC-20260810-9942ea.yaml.
    - >-
      The batch record states why the protocol freeze outranks acquisition, what
      the firewall checks rather than asserts, and the residual risk it cannot
      eliminate.
    - >-
      DEC-20260810-9942ea target_ids contains only records that already exist on
      disk; EV-MDFIVE-1d470b and DEC-20260810-1163ec are named in prose as
      reservations and are absent from target_ids.
    - >-
      The 3300 s batch budget is split line by line and the split sums to 3300
      exactly.
    - >-
      campaign_budget is unchanged, the goal record is unedited, and no status of
      any kind changed.
  return_format: >-
    A summary naming the three written paths and confirming, item by item, that
    each completion-gate line above is met, with any omission named explicitly
    rather than left to be discovered.
  state_at_record_time: >-
    The dispatch queue records this task as state `completed` with completed_at
    2026-08-10. Its completion_note in
    coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/dispatch_queue.json is
    the authoritative account of what was and was not done, including that the
    ten handoff records, the task cards and the goal-head edit were deliberately
    left to a second pass. No commit exists for it yet; TASK-20260810-fc23ce is
    its archive.
