    - ledger/handoffs/TASK-20260804-60ec0d.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-d5007d/dispatch_queue.json
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-d5007d/tasks/TASK-20260804-60ec0d/draft_report.md
  archived_by: TASK-20260804-e304cc
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
