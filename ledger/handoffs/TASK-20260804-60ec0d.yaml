handoff:
  id: TASK-20260804-60ec0d
  from: coordinator
  to: coordinator
  objective: >-
    Draft a non-executable successor contract that resolves the five
    amendment-required reproducibility and comparability gaps identified by the
    independent REVISE review of EXP-SMTH-92d322.
  uncertainty_reduced: >-
    Whether a future toy-only measurement could be reviewed against explicit
    pre-run rules for construction, invariant encoding, factorization, resource
    checks, and comparability without relying on undefined methods.
  inputs:
