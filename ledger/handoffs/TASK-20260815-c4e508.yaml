    TASK-20260815-8cb1c0 as state: queued, not completed) — nothing about
    this task has been archived or committed yet, so this repair does not
    touch an immutable record.
  defect_class: >-
    A YAML block-sequence list item of the shape `- key: "quoted phrase"
    trailing unquoted text` is invalid: once the double-quoted scalar
    `"quoted phrase"` closes, no further scalar content may follow on the
    same line outside a new construct. PyYAML raises ParserError("while
    parsing a block mapping ... expected <block end>, but found
    '<scalar>'"). The fix wraps the entire list-item text in one pair of
    double quotes (escaping the inner quote marks that were causing the
    ambiguity, or simply removing them since they added no information),
    turning the line into a single valid quoted scalar list item.
  confirmed_defect_sites:
