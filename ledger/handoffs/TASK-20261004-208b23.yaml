        stops: A modified or staged tracked file under the run directory.
      - id: C1
        what: Sync.
        do: >-
          git fetch origin. Merge origin/main into claude/ecdlp-index-calculus-grobner-xwr62t (merge, never rebase). Record the base commit checked, the branch head before (the parent of the archive commit) and
          the merge outcome. If the merge is denied or impossible, record that as a deviation as TASK-20261004-342564's receipt did, and proceed on the branch head only if it already contains the run-package commit.
        stops: A conflict inside any ledger record or run file (resolved only by a new superseding record).
      - id: C2
        what: Lanes.
        do: python3 tools/goal_lanes.py lanes GOAL-SEMBIN-5078bc. Record the listing and whether a live lane or claim exists. This card is in no dispatch queue, so tools/goal_lanes.py claim cannot be used; record that, as TASK-20261004-342564 did. This card touches no shared file (the shard is write-once and new, goal.yaml is not touched), so it runs even if another session holds a lane.
      - id: C3
        what: Identifier checks.
        do: >-
          For DEC-20261004-6ac6bc and TASK-20261004-208b23 run python3 tools/allocate_id.py --check <ID> and git grep -l <token> HEAD on the merged tree. Expected hits are only the three files this card
          commits (and, after commit, its receipt), plus DEC-20261004-a47503 and the review-round cards if they are already in the working tree (they are NOT staged by this card). Any other hit stops. A substring of a hash is not a collision.
        stops: A real identifier collision.
      - id: C4
        what: Inventory of the run directory.
        do: >-
          T = `git ls-files -z -- experiments/EXP-SEMBIN-7e1371/runs/RUN-SEMBIN-9bb990` (sorted, relative to the run directory). Record count(T) (the dispatching session relays 977; the number is DERIVED here, not a gate). U =
          every file present under the run directory that is untracked or ignored (`git status --porcelain --ignored -- <run dir>`, then expand directories with find). Record count(U) and `du -sb` over U. Record whether each
          entry of U is present on disk at all.
        stops: An ignored file under the run directory (the .gitignore hold must be gone, see C9), or a file in U that is not in the exclusion list (C7).
      - id: C5
        what: path_sha256 of every tracked file.
        do: >-
          For every path in T record sha256 of the working-tree bytes and confirm it equals `git show HEAD:<path> | sha256sum` (clean tree). The receipt carries the full table (path to sha256). Do not stage, touch or re-commit any of them.
        stops: A working-tree hash that differs from the HEAD blob.
      - id: C6
        what: Comparison with artifact-digests.json (a flat map from run-relative path to sha256, written by code/assemble.py for every file of the package except itself at assembly time).
        do: >-
          D = the keys of artifact-digests.json. Compute A = D minus T, B = T minus D, M = the paths in both whose sha256 differs. Record each set. EXPECTED: A is exactly the 92 paths of excluded-large-instances.json (verified in C7);
          B is a subset of { artifact-digests.json (it cannot list itself), task-report.md, excluded-large-instances.json } plus any file the executor's post-digest pass created and which the dispatching session identifies by reading
          code/make_report.py and the run-package commit as an output of that pass (name each, with the evidence); M contains only NARRATIVE or DERIVED files (NOTES-deviations-and-limitations.md, manifest.yaml, summary.json, results-table.json,
          raw-result.json, task-report.md). The arithmetic must close: count(D) = count(T) minus count(B) plus 92. Record both hashes of every member of M and its commit history (C8).
        stops: >-
          A path in A that is not in the exclusion list, or an exclusion-list path not in A; a path in B outside the expected set that the session cannot identify as an output of the post-digest pass; a path in M that is a DATA file
          (any */cells/results.jsonl, any instances/* file, progress.log, command.txt, environment.json, stdout.log, stderr.log, LANE_COMPLETE, counts/*, light_*/*, soundness_*/*, null_*/*, sweeps, m4ri_defect_investigation/*, or a closure_m2*/crosscheck-style
          record); the arithmetic not closing.
        recorded_not_stopped: A mismatch on a NARRATIVE or DERIVED file is recorded with both hashes, and does not stop the archive.
      - id: C7
        what: The exclusion list.
        do: >-
          Parse excluded-large-instances.json. Check: schema string; run_id equals RUN-SEMBIN-9bb990; count equals the length of files equals 92; the sum of bytes equals total_bytes; every path lies under an instances/ directory
          and has bytes greater than 1048576; every path is in D with the same sha256; no tracked file under an instances/ directory is larger than 1048576 bytes; and, for every file of the exclusion list that is PRESENT on disk, its
          size and sha256 equal the listed values, and the set of on-disk files under instances/ directories with size above 1048576 bytes equals the listed set. Record, per entry, present or absent on disk. Record that regeneration was NOT performed.
        stops: Any mismatch in count, total, size, hash, path rule or completeness of the exclusion.
      - id: C8
        what: Write-once history.
        do: >-
          For each tracked run file record `git log --no-merges --format='%h %ad %s' --date=iso HEAD -- <path>` (condensed in the receipt to the files with more than one commit, plus the adding commit per file group). A file modified after
          it was first committed is RECORDED as a deviation with its commit list.
        stops: Any change, after the commit that first added it, to a */cells/results.jsonl, an instances/* file, a progress.log or a stdout/stderr log.
        recorded_not_stopped: A later change to NOTES-deviations-and-limitations.md, manifest.yaml, summary.json, results-table.json, raw-result.json or task-report.md.
      - id: C9
        what: Commit provenance and the .gitignore hunk.
        do: >-
          Record the short sha and subject of every commit that added run files, and READ each such commit's body. Record: whether the subject or body names a verdict label (sufficient, insufficient, unreached) or a measured value (a rank,
          count or standard-monomial number) beyond what the manifest's own validity text and the task-report's validity notice already state. The dispatching session relays that the body states results only as validity scoping; record
          what the body actually says, in words, without copying values. Record the `.gitignore` hunk of the run-package commit (the hold removed), and run `git check-ignore -v` over every path in T and U to confirm no ignore rule matches any file of the run directory.
        recorded_not_stopped: A verdict claim or value in a commit message is recorded as a deviation from the outcome-hygiene rule, not amended. A shared-file edit other than the .gitignore hold is recorded.
        stops: An ignore rule that still matches a file of the run directory.
      - id: C10
        what: Run state.
        do: >-
          Record tracked_files (count(T)), untracked_files (count(U)), untracked_bytes, and the IMP-SEMBIN-9BB990-STORAGE recheck, `git ls-files <run dir> | wc -l` against `find <run dir> -type f | wc -l`, with the explanation that the difference is the 92 files if they are on disk.
      - id: C11
        what: Validation before and after staging.
        do: >-
          python3 tools/validate_ledger.py before staging and after. The condition is zero NEW errors naming any staged path. Errors already present on origin/main are recorded, not fixed.
        stops: A new error naming a staged path.
      - id: C12
        what: Stage and commit.
        do: >-
          Stage ONLY the four commit paths. Never git add -A. Commit with a message that names TASK-20261004-208b23, DEC-20261004-6ac6bc and RUN-SEMBIN-9bb990 and claims nothing beyond "snapshot archive, digest-only"
          (no measured value, no verdict label). After the commit, confirm it changes exactly the four paths and nothing under either run directory.
        stops: A commit that changes any other path.
      - id: C13
        what: Publish.
        do: >-
          Push the branch. Open or refresh the PR against main (the run-package PR 1820 or its successor) naming DEC-20261004-6ac6bc, TASK-20261004-208b23 and RUN-SEMBIN-9bb990, with the commit sha. Per CLAUDE.md the PR is merged with the
          merge-commit method once every check is green and no blocking thread is open. The receipt cannot carry the sha of the commit that contains it; the dispatching session records it in the PR description.

