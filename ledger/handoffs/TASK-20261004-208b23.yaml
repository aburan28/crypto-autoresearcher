    steps:
      - id: C0
        what: Preconditions.
        do: >-
          Confirm DEC-20261004-6ac6bc, this card and the shard exist in the working tree and are non-empty. Confirm the run-package commit(s) are reachable from the branch head (PR 1820's head). Confirm
