  constraints:
    - >-
      DB-1 Superseding and additive. Write exactly the three declared files,
      all new. H-BINSTD-de2808 carries supersedes H-BINSTD-0126fe and
      EXP-BINSTD-6f1e66 carries supersedes EXP-BINSTD-de9678, each with a
      supersession note citing DEC-20260928-9d9c47. Each new record is
      complete in itself, not a diff. Edit no version-1 file, proposal,
      hypothesis, experiment, decision, question, correction or goal record.
      Mint no identifier.
    - >-
      DB-2 Scope unchanged. S2 only, as DEC-20260928-63addc states it. The
      items DEC-20260928-9d9c47 what_survived_and_carries_forward names (the
      capacity certificate and its composite-order extension; the ideal-tree
      entries, floors, rho and memory column; the k = 8 reconciliations; the
      halving criterion and the E/2E and E/4E constructions; the composite-cell
      alphabets given a verified generator; the labelling of the stake, the
      lead route, the orbit-unknowns line and the transfer heuristic; the
      exclusions; the Wagner accounting) change only as R-9, J3-OBJ-5,
      J3-OBJ-6 and J3-OBJ-7 require. Excluded as in version 1: any k-tree run
      at deployed parameters; target-dependent filters; levels above 1;
      IDEA-20260926-d3c5a5's engine; d06324's four-arm (L, b) table.
    - >-
      DB-3 R-1. Redefine the matched-marginal shuffle, in the definition and
      in the code, as a histogram-preserving resampling of h-values across
      points under a recorded seed (every bucket keeps its exact size; every
      arithmetic relation is destroyed). Pin it with gate checks it can fail:
      an exact control collapses to within the null width, and a planted
      marginal-only filter is preserved.
    - >-
      DB-4 R-2. Delete the closed-form allowance 4 x M^(-1/2); calibrate the
      null from the random-label arm's own measured distribution per (cell,
      M) on the same code path, drawn from independent random labels or
      independent samples and not from resamples of the arm it judges; state
      PC-2 and the family comparison against that distribution; restate SR-4
      clause 2 so a random label's occupancy-driven slope does not satisfy
      it; state the finite-sample null scale of the maximum statistic in the
      design, citing KN-FIND-ffe1df's averaged-versus-maximum record.
    - >-
      DB-5 R-3. Re-price S per (cell, filter, M) at or above about 100 x M^2
      and against any kept closed-form check's own need; re-derive the
      alphabet grid and the ladder from what the repriced budget reads (or
      lower MIN_CELL with the precision loss stated). State in one table, per
      (cell, M), the N reading used for M (l or #E, named), the rounding rule
      to a power of two, M, S and log2 S. The composite nearby-object control
      must be readable at its declared S.
    - >-
      DB-6 R-4. Recompute every ladder order at design time (zero compute)
      and declare only AR-B1-admissible cells; either extend the ladder with
      its cost priced, relax AR-B1 for ladder cells with the reason stated, or
      restate the success criterion and HEUR-B2's plan for the ladder that
      exists. A slope with an interval needs more than two cells.
    - DB-7 R-5. Replace the identity arm with a control the estimator can read (an exact filter of the largest alphabet the sample supports, criterion G = M), or exempt it from MIN_CELL with the vacuity stated and a different identity check chosen.
    - DB-8 R-6. Give the ordinary cells their own order route and skip the order-4 search where the cofactor is 2, in code and in AR-B1's text.
    - >-
      DB-9 R-7. Commit as code the Z/lZ object with the log-interval key
      (PC-7), the exhaustive-against-sampled check (PC-9), and a divisor-set
      certificate function with the three control readings of the audit sheet
      as its pass criteria.
    - DB-10 R-8. Cache the sampled points' labels before resampling; price the bootstrap in stage_split or reduce the resample count with the precision loss stated; restate the advisory ceilings to match.
    - DB-11 R-9. State the needed alphabet and the capacity in one named ambient on the gap column, the closure line and the per-level gap step, or report both ambients side by side, and carry the same into the CEIL row and the hypothesis; nothing else in the table moves.
    - DB-12 R-10. Replace to_nb with Gaussian elimination; have the fixture find and verify the composite cell's generator (order exactly N by the route B proof) and check the table has N entries; enumerate seeds 0 to 9 in gate_cell; record trial division as specified; add PC-7's factor and PC-14 to SR-1.
    - >-
      DB-13 R-11. In HEUR-B2's random_model_justification record that Theorem
      A-prime bounds the averaged agreement and not G and that the repaired
      bound reaches only M at most N^(1/4); state the consequent
      quantitatively (the c for which the tree at the exact capacity stays
      above matched rho) so the heuristic can fail; add to the with-orbit
      line's conditional_on that KN-FIND-47da4e declines to price materialised
      meet-in-the-middle oracles and is not a promoted finding.
    - >-
      DB-14 R-12. Add margin_reading to both k = 32 rows; change four to five
      in S3-2; head part (A) "unconditional subject to PO-1"; soften the DC-B1
      diagnosis sentence or leave it open; prove l prime or state that the
      certificate's divisor set rests on the primary source's primality
      statement.
    - >-
      DB-15 C4 as code. The fixture, the shuffle, the measured-null
      calibration, the certificate function and the PC-7 and PC-9 checks are
      block scalars of the audit sheet with their extraction method and
      reference sha256 pinned; every pass criterion is stated before execution
      and placed in the stopping and invalidation rules so that no
      Koblitz-specific arm is read on a cell before its gate passes. Write no
      code outside the declared files and run none.
    - >-
      DB-16 C1 to C8 unchanged. The stake only as the column's ceiling; no
      below-rho cell; the lead threshold pre-registered and routed to
      review-breakthrough and independent replication (TW-02); matched rho
      2^60.8090 with each line's ambient; no D1, D2 or D3 as a budget; the
      orbit-unknowns line conditional under CORR-20260925-649e25; Wagner and
      the halving criterion at source or re-derived, never relayed through
      IDEA-20260922-1b16d7; orders recomputed at setup; memory beside the
      stake; H1 and H2 with validation plans; exclusions and zero runs. State
      the instrument's resolving floor for approximate filters at the declared
      S as an interpretation limit.
    - >-
      DB-17 Approval fields. Controls (each blocking as stated), metrics,
      budget, stopping rules, invalidation rules, required artifacts, a
      decidable success criterion with at least one reachable negative
      outcome, a reachable LEAD branch, a falsification criterion,
      interpretation limits and a proof_search_map; status review_required;
      approved_by null; an approval block stating approval if and only if
      DEC-20260929-8c3cb2 is official with decision approve naming
      EXP-BINSTD-6f1e66. The hypothesis has status specified, a mechanism,
      predictions, a test boundary and falsification criteria, with no
      exponent claimed.
    - >-
      DB-18 Audit sheet. The four KN-TECH-080 audits and the strictness and
      interface obligations; a C1 to C8 discharge table; a revision discharge
      table mapping R-1 to R-12 by number to the clause that discharges each;
      the code blocks with extraction method and reference sha256; the Stage 0
      outputs (certificate readings, ideal-tree table in the named ambient,
      ladder orders and admissibility, the repriced S table); an attestation
      of every source read and at what depth.
    - >-
      DB-19 No sentence claims an ECDLP speedup, an exponent move, a
      deployed-curve verdict, a filter of capacity above 2 bits on ECC2K-130,
      or a lane closure (plan tripwire TB-1).
    - >-
      DB-20 Zero runs. Execute no instrument or estimator on any cell; the
      Stage 0 Python arithmetic is permitted and its output is a design
      figure, never a result. Cite with provenance.
    - >-
      DB-21 No AUXIN census value, reviewer finding value of another lane,
      RUN-FROB value or EXP-FROB-30006a outcome; nothing about any
      EXP-QSP-70b731 run.
