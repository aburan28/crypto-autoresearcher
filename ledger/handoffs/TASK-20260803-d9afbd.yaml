handoff:
  id: TASK-20260803-d9afbd
  from: coordinator
  to: executor
  objective: 'Investigate ANOM-5, the only unexplained measured effect open in this goal. In the archived
    q=241/m=40 files, the MID BAND of n=43 shows a sub-Poisson variance DEFICIT: phi = 0.8020 against
    its own null object at 0.9923 +/- 0.0806, i.e. -2.36 sd, stable while the rate model is given 6 to
    33 parameters, while n=50 reads +1.55 sd on the same statistic. A deficit BELOW Poisson cannot be
    produced by rate misfit, which can only inflate dispersion, so it points at the data-generating process,
    at the estimator, or at the archived file itself. Enumerate the candidate mechanisms and test each
    one you can test from archived bytes. At minimum consider: (a) the counts are not independent draws
    -- e.g. a fixed per-iteration structure, stratification, or a shared random source across the 4000
    iterations; (b) rounding, truncation or formatting in the .out writer; (c) an estimator artifact specific
    to the mid band, e.g. bin placement, the increment construction, or leverage; (d) the two files genuinely
    differ in how they were generated. SECOND DELIVERABLE, cheap and independent: archive residuals[T]
    per model per fit so that the four rows of BATCH-012''s deep-tail table currently flagged reconstruction_valid:
    false become checkable.'
  uncertainty_reduced: Whether a measured 20 percent sub-Poisson deficit in the authors' archived validation
    data is a property of that data, of this program's estimator, or of the file format. It currently
    bounds how far the BATCH-014 deep-tail null may be carried, and nobody knows which of the three it
    is.
  inputs:
  - experiments/EXP-MLKEM-011/vendor-lock/data/ archived .out files
  - coordination/goals/GOAL-MLKEM-003/batches/BATCH-014/tasks/ (C1 producer and validator packages)
  - coordination/goals/GOAL-MLKEM-003/batches/BATCH-012/tasks/TASK-20260803-36f572/ (the models whose
    residuals are to be archived)
  - ledger/evidence/EV-MLKEM-c50030.yaml, EV-MLKEM-0cf1df.yaml
  constraints:
  - Never fabricate a command, output, timing, statistic, citation, or run (AGENTS.md rule 9).
  - 'ZERO NEW SAMPLING of the physical system: no G6K, no network, no new .out bytes. Seeded randomness
    to calibrate YOUR OWN estimator against a synthetic null is expected; disclose it.'
  - Toy tier; raw undivided score scale; NO ML-KEM security claim.
  - 'AGENTS.md rule 12 stays UNMET and UNWAIVED: EV-MLKEM-011, EV-MLKEM-013 and EV-MLKEM-017 keep their
    status; KN-FIND-031 stays withdrawn.'
  - 'BINDINGS: no whole-band ratio without its effective degrees of freedom beside it; do NOT quote a
    specific dof value -- state O(1), cite the range 1.51-2.35, give the C>=1000 comparison.'
  - Write only inside the declared write_scope. Do not edit any prior artifact or ledger record. Do not
    git commit.
  - You record OBSERVATIONS ONLY. Do not conclude that the archived data is defective, nor that Approximation
    4.9 is validated or refuted. That is /review-evidence under Coordinator authority.
  - A sub-Poisson deficit is the kind of result that invites an accusation against the source. DO NOT
    MAKE ONE. Enumerate mechanisms, test what is testable, and report what remains open.
  - READ THE CODE of any control whose result is congenial before you summarise it. BATCH-014 corrected
    the Coordinator for exactly that failure.
  - If ANOM-5 turns out to be an artifact of THIS PROGRAM'S estimator rather than of the data, say so
    plainly -- that is the most useful outcome available and it retires a bound on the BATCH-014 null.
  - Declare the provenance fields the evidence doctrine requires INSIDE results.json. No runs/ tree is
    declared.
  deliverables:
  - 'anom5_investigation.py: the exact script run'
  - 'results.json: per-mechanism tests with their own uncertainties, plus residuals[T] per model per fit'
  - 'report.md: which mechanisms are excluded, which survive, and what remains open'
  artifact_paths:
  - coordination/goals/GOAL-MLKEM-003/batches/BATCH-015/tasks/TASK-20260803-d9afbd/anom5_investigation.py
  - coordination/goals/GOAL-MLKEM-003/batches/BATCH-015/tasks/TASK-20260803-d9afbd/results.json
  - coordination/goals/GOAL-MLKEM-003/batches/BATCH-015/tasks/TASK-20260803-d9afbd/report.md
  archived_by: TASK-20260803-f7700a
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 3000
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
  - each candidate mechanism recorded as excluded, surviving, or untestable WITH ITS REASON
  - residuals[T] archived per model per fit
  - an explicit statement of whether ANOM-5 is data, estimator, or format
