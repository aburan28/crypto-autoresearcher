  constraints:
    - id: SC-1
      text: >-
        ID CHECK FIRST. Run `python3 tools/allocate_id.py --check` on
        DEC-20260923-4d7a19, CORR-20260923-a86e3b, TASK-20260923-e3b590,
        TASK-20260923-7a2cd4, TASK-20260923-b8f163, TASK-20260923-29e7af,
