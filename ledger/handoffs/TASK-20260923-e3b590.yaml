        REVIEW-CERTBIN-20260923-c51f07 by path (no coordination/review/*c51f07*
        other than this round). On any collision, stop. Re-mint the ID and
        rename every reference to it in the files below BEFORE the first
        commit, and record the rename in the receipt. Nothing binding these IDs
        is committed yet.
    - id: SC-2
      text: >-
        MERGE origin/main INTO THE BRANCH, NEVER REBASE. Record the base commit
        checked and the merge outcome. On a conflict inside a record, stop.
        Never resolve it by editing a record.
    - id: SC-3
      text: >-
        EXTRACTION, MECHANICAL AND WHITELISTED. Write
        coordination/review/certbin-20260923-c51f07/blind/blind-inputs.json
        with EXACTLY these keys and nothing else:
        - schema: "certbin.blind_inputs.v1"
        - review_id: "REVIEW-CERTBIN-20260923-c51f07"
        - field: {n: 17, modulus: "t^17 + t^3 + 1", encoding: "17-bit integer, bit j = coefficient of t^j"}
        - m: 2
        - l: 9
        - D: [4]
        - curve: {A: int, B: int}, from curve.json
        - references: five objects {label, x_R}. x_R is the x_R of each F-S3
          reference in references.json. The five are SORTED BY x_R ASCENDING
          and labelled REF-a..REF-e in that order. Arm, s, D*, the run's
          U1/U2/U3/S1/S2 id, traces and modal status are NEVER written.
        - targets: one hundred objects {position, x_R}. Take the F-S3 test
          targets in draw order, which is the order of the run's own
          per-target index field in targets-F-S3.jsonl.gz, one entry per
          target (the file holds one record per target and D; de-duplicate).
          Assert that the index order agrees with the file order. Keep the
          targets at 1-based positions 10, 20, ..., 1000. Degenerate targets
          are included as they fall, with no flag.
        Write coordination/review/certbin-20260923-c51f07/blind-inputs-key.json,
        which is NOT in blind/, with the mapping label -> run reference id and
        position -> run target index, and nothing else.
        Then verify mechanically:
        - blind-inputs.json has exactly the keys above;
        - there are 5 references and 100 targets;
        - every x_R is an int in [0, 2^17);
        - curve A and B equal manifest inputs.curve.
        Record in the receipt the exact extraction command or script text, and
        the sha256 of both files. The extraction script, if it is a file, stays
        OUTSIDE the repository, or is committed inside this task's archive
        directory. Either way it is declared.
    - id: SC-4
      text: >-
        BLIND-PHASE HYGIENE. Write
        coordination/review/certbin-20260923-c51f07/blind-phase-hygiene.yaml as
        `blind_phase_hygiene: {protected_sha256: {<sha256 hex of literal>: <label>}}`.
        There is one entry per protected literal supplied out of band. The
        digest is the sha256 of the literal's UTF-8 bytes, exactly as
        tools/check_review_independence.py tokenizes it. Each label is a
        non-numeric description such as "F-S3 D4 unsat arm size". A label
        never contains the value. After the archive commit, run
        `python3 tools/check_review_independence.py --blind-history HEAD
        --protected-from coordination/review/certbin-20260923-c51f07/blind-phase-hygiene.yaml`
        and record the output in the receipt. If it FAILS, stop.
        TASK-20260923-7a2cd4 may not then run on this branch's history.
        Record a correction, and give the re-deriver a clean worktree whose
        reachable history passes.
    - id: SC-5
      text: >-
        RATIFIED PRIOR-COMMIT BINDINGS (DEC-20260923-4d7a19 R-5). Do not stage
        or edit experiments/EXP-CERTBIN-4e92d7/runs/RUN-CERTBIN-3b7e05/manifest_v2.yaml
        or tools/run_supersession_registry.yaml. Record in the receipt, under
        `prior_commit_bindings`, their sha256 at HEAD and the commit that
        introduced them (5016669). Assert that manifest_v2.yaml's sha256 equals
        the registry's superseding_sha256 (b801901e2678d17f1bcf105c8977d0f92befeaa1d0554c9571f4e3516579162c).
        Also assert that manifest.yaml is byte-identical to the c2e57b receipt
        (1ed4bd676ec61eb3f82aa3d44e7c3f43c49d9bf53fb6bba62caec60477039bda).
    - id: SC-6
      text: >-
        STAGE ONLY THE DECLARED PATHS. Never stage the top-level session's
        exploratory scratch script or its outputs, /home/user/certbin-dev/, or
        any reviewer directory. Run tools/validate_ledger.py on the head and
        report no error line beyond the base's pre-existing set.
    - id: SC-7
      text: >-
        OUTCOME HYGIENE. The commit message, the PR text and any bus message
        carry NO measured value and NO decision-rule verdict word. They name
        the records and say that the review round is opened and not yet
        dispatched.
    - id: SC-8
      text: Launch nothing. maximum_runs is 0. The extraction is a data copy, not a trial.

