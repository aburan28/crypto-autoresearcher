  title: >-
    Revise lane A to version 3: write EXP-NISTBIN-451dfa version 3
    (approved_by null) at the canonical path, one append-only version_3 block
    of H-NISTBIN-dec5e1, a version-3 audit sheet with committed import-safe
    code and a revision worksheet with a value-free newly_frozen_values
    section, discharging RD-1 to RD-9 of DEC-20260925-41f6dc
  objective: >-
    Run /design-experiment as a fresh Coordinator-role session on
    IDEA-20260922-7d6d43 Parts 1-2 under RQ-NISTBIN-06157b and write version 3
    of EXP-NISTBIN-451dfa under DEC-20261002-0983f2 R-FORM (DEC-20260925-89573b
    R-FORM extended to version 3). Discharge RD-1 to RD-9 of
    DEC-20260925-41f6dc by number (revision_items below), answer every
    non-breaking item and CO-1 in the worksheet, and carry the "What holds"
    list unchanged except where an RD item forces a change, each change in a
    constants_delta block with its forcing item. DEC-20260924-99ce20 S1 scope
    and design conditions C1-C8 still bind. Zero runs.
  uncertainty_reduced: >-
    Whether a version-3 lane-A protocol exists that discharges RD-1 to RD-9
    while keeping everything REVIEW-NISTBIN-20260925-b67954 found to hold,
    stated precisely enough for REVIEW-NISTBIN-20261002-f435ab to test it
    joint by joint and to re-derive every newly frozen value blind. It
    measures nothing about the 571 cell, the true solving degree or any curve.
  revision_items:
    source: >-
      DEC-20260925-41f6dc rationale, verbatim in substance; the decision is the
      authority where wording differs. A remedy may be met by any equivalent
      route stated with its reason, except where the decision fixes the route.
    breaking:
      - id: RD-1
        joint: J1 (D-1 residue)
        requirement: >-
          Stage 0's Certicom coverage check parses Appendix A of
          inputs/CERTICOM-CHALLENGE-2009/challenge-2009_text.md independently
          of certicom_rows (a whole-Appendix scan) and gates G1 on the curve
          count, so that an omitted row is detected (0 of 15 in version 2).
          Commit the check as an import-safe code block in the audit sheet,
          bind the run's Stage 0 to it by digest, and run it under C-3 on the
          unmodified inputs and on in-memory single-row omissions. It must
          detect every omission and must not fail on the unmodified inputs
          with readings CR-1, CR-2 and CR-3 in play. Count binary curves only.
      - id: RD-2
        joint: J2 (BA-J2-1; D-3)
        requirement: >-
          Put the Macaulay-matrix memory beside the macaulay4 and f4_std time
          figures at 571 and beside the 26.75-bit figure, at c8_scan (2), (3)
          and (6) and at the four version-2 places (specification
          proof_search_map bottleneck, hypothesis version_2 mechanism,
          hypothesis version_2 proof_search_map bottleneck, audit c8 index
          '2'). DERIVE it from the frozen instrument's variable counts (read
          experiments/EXP-SEMBIN-81dc96/code/joint_balance.py as text; do not
          execute it) at each figure's own parameter point (n, m, t, D, k
          reading, convention), never state it missing. The joint-convention
          figures sit at their own argmin, not at the block_n4w argmin.
          Commit the derivation as C-4 code.
      - id: RD-3
        joint: J2 (BA-J2-2; D-3)
        requirement: Memory beside MI-1's disclosed move at each of its places, or an explicit pointer at each place to the audit's figure.
      - id: RD-4
        joint: J8 (BA-J2-3; R-FORM)
        requirement: >-
          The hypothesis revision block (version_3) supersedes review_plan_id,
          design_audit, batch_id and specified_by_task, and declares
          proof_search_map.note and P-T. It also names every version-1 or
          version-2 field it supersedes and states its precedence rule, and
          agrees with the contract field by field.
      - id: RD-5
        joint: J4 (BA-J4-1; D-5 H1-L)
        requirement: >-
          Either support S_M as a lower bound, with an argument, or remove the
          lower edge from H1's formal statement AND its falsification
          condition. Reconcile E2's "at least D*_R" with the one-step
          tolerance.
      - id: RD-6
        joint: J4 (BA-J4-2; D-4)
        requirement: >-
          State M7's direction conditionally, or restrict it to the degree
          range where it is one-way, in H interpretation_limits, the
          specification's decision_mapping K4 revisit (ii), the audit's L-INT
          summary, and every other in-force sentence that states a one-way M7
          direction. A consistent binomial reading moves D* later for
          crossings at high degree. If a range is stated, its endpoint is a
          newly frozen value computed by C-4 code and listed as an NF-nn item.
      - id: RD-7
        joint: J6 (BA-J6-1; D-8 S-10)
        requirement: >-
          Rekey K4 revisit sub-condition (i) to a condition that can fail, and
          in the right direction. As written it holds in every run, because at
          small m the threshold is the grid's lower edge. Note DEC-20260925-41f6dc
          D-10: once F1 passes, this run's threshold table is fixed by closed
          forms, so a sub-condition keyed only to this run's own table is
          certain or impossible. State in the worksheet why the rekeyed
          condition can both hold and fail when the deprioritisation is made,
          and what event it keys to.
      - id: RD-8
        joint: J3 (J9 limb and J3 N-J3-1; D-7)
        requirement: >-
          Disclose MI-1's consequence at every degree where MI-1 is used (the
          283 pass-rule target and 359, not only 571), and give its direction
          (the ceiled reading lowers the stage-1 cost; Semaev's "at most"). A
          reviewer figure is cited attributed to its report (provenance
          internal); a figure the producer states as its own comes from C-4
          code and is an NF-nn item.
      - id: RD-9
        joint: J2 (N-J2-5; C8)
        requirement: >-
          Memory beside the carried SN-1 time-only figure at 409, and a C8
          sweep of carried figures, not only of the c8_scan locations: every
          time figure in force, including fields of the version-1 and
          version-2 bytes of the hypothesis that the version_3 block does not
          supersede.
    non_breaking:
      note: Answer each in the worksheet (change made, with location, or a stated reason for no change).
      items:
        - N-J1-1 (the level at which A_unresolved fires is unpinned)
        - N-J1-2 (pinned_coherent_row and the other coherent-baseline grids)
        - N-J2-1 (the block's FC-4 against the specification's falsification_criterion)
        - N-J2-2 (H2 and H6 wording in the objective and RT-3 against heuristic_under_test)
        - N-J2-3 (RT-4's other-than-571 wording against its table)
        - N-J2-4 (the block's interpretation_limits carry rule)
        - N-J2-6 (the execution inference policy field)
        - N-J3-2 (MI-1 carriage into every output template)
        - N-J3-3 (one label C-CEIL for three outputs)
        - N-J3-4 (what_the_run_adds item (4) is closed forms)
        - UNOWNED-1 (manifest fields per the artifact policy)
        - UNOWNED-2 (a version date)
        - UNOWNED-3 (a parallelization statement, target profile C15)
        - O-J4-1 (hand the ceiled threshold table beside the MI-1 table, or state the bias)
        - O-J4-2 (the d_star_sentence's m* value is the scored cell, not the threshold)
        - O-J4-3 (one k reading for H2 and D*)
        - O-J5-1 (the claim-(A) tables at 2.376 and 2.807 flagged unscored)
        - O-J5-2 (G4's slack under the ceiled reading)
        - O-J6-1 (RT-4 reads the MI-1 figure only)
        - O-J6-2 (IR-2 and the U-3 placement)
        - O-J7-1 (mark every edit, or retract the edit-marking claim)
        - K2x wording in decision_mapping
        - reused stopping-rule ids (S-3 and S-4 collide with D-8 item labels)
        - CO-1 (certicom_rows.row_set_rule; a label suffix is the bit length of the base-point order r, not of h r)
    what_holds_carried_unchanged: >-
      DEC-20260925-41f6dc rationale "What holds": the D-1 row set (fifteen
      Certicom curves, nine degrees, m and h, CR-1 to CR-3); the rho column and
      the four added rows; the UNRESOLVED rule; D-2's pin and C-BR1; D-9; MI-1
      as a numbered choice with its basis and carriage; the C2 fixture's
      identification, tolerance and PASS as frozen (two disjoint paths); D-10;
      the restriction branch of D-4, with every threshold as D*(m) over m; D-5
      H1-Q, H1-V, H1-C, H1-S, H2-U and H2-N; D-6's gating and G4 rule; D-8
      except S-10; everything J7 found regression-free; C1-C8; all seven
      proves-too-much controls; and J9's agreement on Q1 and Q2. Any change is
      listed in constants_delta with its forcing item. Every Q1 and Q2 value
      the version-2 contract freezes stays value-identical unless an RD item
      forces it (J1 D-CARRY).
  newly_frozen_values_obligation: >-
    The worksheet carries a separable section newly_frozen_values listing
    EVERY value version 3 freezes and version 2 did not (memory figures,
    variable counts, any D* or D*(m) value, any M7 range endpoint, any MI-1
    move the producer states as its own, any constant of the RD-1 code), each
    as NF-nn with (a) its location by file and field path, never its value,
    and (b) a value-free definition sufficient for an independent
    re-derivation (what is computed, from which primary inputs, under which
    rule and parameters, at which reading). The section attests
    definitions_are_value_free true. The pre-review gate copies each
    definition byte-exact to the blind card, so each must stand alone; flag
    any definition you cannot separate from its answer. Use the contract's own
    names (MR_B, MR_M, MR_C8, W, R-B, R-M, D*_R, D*real_B, A, MI-1) in every
    definition.
  allowed_session_computations:
    authority: DEC-20261002-0983f2 R-PRODUCER-COMPUTE, stated in advance
    note: >-
      The producer session may ask the top-level session to perform these and
      only these, in <session scratchpad>/BATCH-f435ab/TASK-20261002-23efd5/,
      and embeds each command and its verbatim output in the audit sheet as a
