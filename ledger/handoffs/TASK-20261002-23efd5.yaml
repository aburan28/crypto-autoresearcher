    items:
      - C-1 extract each committed code block by the pinned method and compute its sha256
      - C-2 a syntax check and an import-safety check of each block in a fresh interpreter (importing executes nothing)
      - >-
        C-3 run the committed Stage-0 coverage code (RD-1) through its
        __main__ entry against the primary inputs read-only, and its omission
        self-test on in-memory copies of the row list (fifteen single-row
        omissions, one spurious row, one mislabelled degree), and relay the
        output verbatim
      - >-
        C-4 run committed closed-form design-figure code of the contract's
        abstract model (memory columns from variable counts at each figure's
        own point; the k-reading comparison at 571, 283 and 359; any
        threshold table version 3 freezes; the M7-reading comparison), which
        imports neither experiments/EXP-SEMBIN-81dc96/code/joint_balance.py
        nor anything under experiments/*/runs/, instantiates no curve and runs
        no solver, and relay its output verbatim
    forbidden: >-
      Anything else: no execution of the frozen instrument or of any driver,
      no solver, no curve, no SEMBIN or SDEG quantity re-measured, no run.
