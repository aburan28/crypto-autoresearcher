handoff:
  id: TASK-20260831-8e6148
  from: coordinator
  to: executor
  objective: >-
    Execute the FROZEN, coordinator-approved contract EXP-MONO-64aaa4
    exactly as written: search for a genuine matched-(N,tau) CM/ordinary
    curve pair and compare their m=4 root-multiplicity collision rates
    directly. Record observations only — no verdict on H-MONO-1d50ac.
  uncertainty_reduced: >-
    Whether H-MONO-45183a Part B's collision-rate closed form
    6(tau-1)/N is complete as a function of (N,tau) alone, or whether a
    curve's endomorphism ring (beyond what N and tau encode) measurably
    moves the m=4 root-multiplicity collision rate — the exact
    exceptional-family question KN-OPEN-009 asks verbatim, at a locus
    already confirmed non-degenerate.
  inputs:
    - >-
      experiments/EXP-MONO-64aaa4/specification.yaml (READ IN FULL — it
      is self-sufficient; follow it literally, especially Stage 0's
      search requirement and Stage 1's hard gate before Stage 2)
    - ledger/hypotheses/H-MONO-1d50ac.yaml
    - ledger/hypotheses/H-MONO-45183a.yaml (Part B, B-1/B-2, read in full for the exact collision criterion and branch probabilities you must implement)
    - experiments/EXP-MONO-12ce1c/specification.yaml (for the exact curve/factor-base construction and seed-derivation conventions to reuse — arms_and_controls.treatment_b, factor_base_construction; do NOT execute that contract, only reuse its construction procedures under EXP-MONO-64aaa4's own domain)
    - AGENTS.md
  constraints:
    - >-
      Follow experiments/EXP-MONO-64aaa4/specification.yaml EXACTLY; it
      is frozen.
    - >-
      STAGE 0 IS A GENUINE SEARCH, NOT AN ASSUMPTION: for each prime in
      [101,3000], construct the ordinary curve and both CM candidates
      (j=0, j=1728) per the contract's own construction rules, compute
      (N,tau) for each, and find the smallest prime at which the
      ordinary curve and at least one CM candidate share the identical
      (N,tau). If NONE is found across the entire declared range, STOP
      and report this exhaustively as a bounded negative — do not
      fabricate or force a match.
    - >-
      STAGE 1 IS A HARD GATE: each matched curve must independently
      reproduce its own G6/G7-predicted collision rate (exactly 0 if
      tau=1; 6(tau-1)/N within 3 binomial standard errors otherwise)
      BEFORE Stage 2's direct comparison is computed, read, or reported.
      If either curve fails this, STOP — report as failed_infrastructure,
      implicating the implementation, not H-MONO-1d50ac's main claim.
    - >-
      STAGE 2, THE DIRECT CURVE-TO-CURVE COMPARISON, IS THE PRIMARY,
      HEADLINE RESULT: a Fisher-exact test on the 2x2 collision/
      no-collision table across the two curves' 20000 tuples each (for
      tau>1), or the exact pass/fail zero-collision check (for tau=1).
      Report this explicitly regardless of which direction it points —
      a disagreement is this record's single most consequential possible
      outcome and must be reported prominently, not absorbed.
    - >-
      RUN BOTH THE FIXED-SIGN AND RANDOM-SIGN ARMS (HEUR-COIN-1) for
      each matched curve, per the contract's own factor_base_construction
      text.
    - >-
      IF A SECOND MATCHED PAIR IS FOUND within the search range and
      budget permits, run Stage 3 (replication) on it too. This is not
      required if only one pair is found or budget does not permit a
      second full measurement — report explicitly which case applies.
    - >-
      No hypothesis, experiment, or goal status change. No ECDLP attack,
      cost, exponent, or cryptographic-scale claim.
    - >-
      Any timeout, crash, or construction failure is
      `failed_infrastructure`/`invalid`, never negative mathematical
      evidence (AGENTS.md rule 3).
    - "Single run, seed 20260901, per the contract's own `replication`."
    - >-
      Budget: 3600s wall clock, 512MB memory. If wall-clock trends past
      1800s with the Stage-0 search still running, STOP and report the
      exact prime reached and the cause as an infrastructure/budget
      signal — do not silently narrow the declared search range.
  deliverables:
    - experiments/EXP-MONO-64aaa4/implementation.md
    - experiments/EXP-MONO-64aaa4/implementation/ (source code)
    - experiments/EXP-MONO-64aaa4/runs/RUN-MONO-64aaa4-1/
    - execution_report.yaml (per docs/evidence-and-reproducibility.md)
  artifact_paths:
    - experiments/EXP-MONO-64aaa4/implementation.md
    - experiments/EXP-MONO-64aaa4/implementation/
    - experiments/EXP-MONO-64aaa4/runs/RUN-MONO-64aaa4-1/
  archived_by: TASK-20260831-4cb58f
  inference:
    policy: executor-implementation
    reasoning_effort: medium
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
    reasoning_effort_basis: >-
      Bound by .claude/agents/executor.md effort medium and
      orchestration/roles.yaml role executor -> default_policy
      executor-implementation -> reasoning_effort medium.
  budget:
    wall_clock_seconds: 3600
    memory_gb: 0.5
    maximum_runs: 1
  completion_gate:
    - "Stage 0's search outcome (found, with p/N/tau, or exhaustively not found) reported before any Stage 1-2 work."
    - "If found: Stage 1's independent reproduction result reported for BOTH curves before Stage 2."
    - "If Stage 1 passes both curves: Stage 2's direct comparison reported explicitly, both sign conventions."
    - "Stage 3's replication outcome (or explicit non-applicability) reported."
    - >-
      Run manifest binds git commit, dirty flag, seed, environment,
      timing, resources, per docs/evidence-and-reproducibility.md.
  return_format: >-
    Executor execution_report.yaml per docs/evidence-and-reproducibility.md:
    Stage-by-stage results in the contract's own order, the Stage-0
    search outcome as the headline gate, Stage 1's reproduction check,
    Stage 2's direct comparison as the headline result, any anomalies.
    Observations only — no verdict on H-MONO-1d50ac, no status change.
