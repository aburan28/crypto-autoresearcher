handoff:
  id: TASK-20260914-7119f2
  from: coordinator
  to: executor
  recorded_at: '2026-09-14'

  objective: >-
    Implement and execute EXP-FROB-91ee9c exactly as frozen: sweep the full
    direct-sum partition lattice of Frobenius-stable factor-base slots in the
    four named parameter cells, measure U and p_m exactly by exhaustive tuple
    enumeration over the whole prime-order subgroup, emit the concrete-cost
    table with measured, modelled and derived-from-measured columns kept
    strictly separate, reconcile peak RSS against the analytic size of the
    dominant structure, and verify or refute the ker Tr identity exactly.

  uncertainty_reduced: >-
    Whether the slot count m, at fixed total slot dimension n-1, moves the
    combinatorial relation-collection cost ratio (U + 1 + extra)/p_m enough to
    be a real factor-base design axis, and whether the divisor lattice of
    x^n - 1 is what bounds the achievable minimum - measured against a
    matched-dimension non-stable control, a matched-cardinality random control,
    and a matched non-subfield null curve, in a cell that has a partition
    lattice and in a matched cell that does not.

  inputs:
    - AGENTS.md
    - agents/executor.md
    - experiments/EXP-FROB-91ee9c/specification.yaml
    - ledger/hypotheses/H-FROB-d93575.yaml
    - ledger/proposals/IDEA-20260914-e2e0cf.yaml
    - ledger/decisions/DEC-20260914-d04668.yaml
    - ledger/questions/RQ-FROB-7d8dd4.yaml
    - docs/claims-and-verification.md
    - docs/evidence-and-reproducibility.md
    - knowledge/techniques/KN-TECH-b18366.md
    - knowledge/open-problems/KN-OPEN-d218ec.md
    - /home/user/crypto/src/cryptanalysis/koblitz_factor_base_search.rs (read-only reference for the metric definition; do not copy code and do not import it)

  constraints:
    - >-
      OWN NOTHING OUTSIDE write_scope. You are not alone in this worktree.
      experiments/EXP-FROB-91ee9c/specification.yaml is FROZEN and is not yours;
      do not edit it, and do not create or edit any ledger record.
    - >-
      One aggregate run (maximum_runs 1) covering the panel in the frozen
      cell_execution_order. Complete each cell fully before starting the next and
      preserve every terminal cell result.
    - >-
      Exact integer and rational arithmetic only. No floating point in any
      reported count, probability, ratio or improvement factor (invalidation rule
      IR-1). Report every rational with numerator and denominator separately.
    - >-
      p_m is measured by EXHAUSTIVE enumeration of all prod_j |B_j| ordered
      tuples in every core cell, deduplicated to DISTINCT representable targets,
      over the whole prime-order subgroup. No sampling in a core cell (IR-2).
    - >-
      Keep measured, modelled and derived-from-measured numbers in three
      mutually exclusive top-level objects in metrics.json and cost-model.json.
      Mixing them in one column, row or object invalidates the run (IR-6).
    - >-
      Report U_frob as null WITH A REASON on any arm whose slot set is not
      pi-stable, and never compare U_frob against U_neg (IR-4).
    - >-
      Refuse any configuration that repeats a subspace across slots or whose slot
      index sets overlap; it is not a partition and must not be credited as one
      (C6, IR-3). Record the refusal with its reason.
    - >-
      Record every rejected curve candidate, every empty base, every refused
      configuration, every denominator-zero configuration and both seeds. Nothing
      is dropped because it was empty, extreme or inconvenient (IR-5).
    - >-
      The checker must not import the driver's enumeration code and must
      re-verify every accepted tuple sum by independent signed point addition
      (C8, IR-8).
    - >-
      Record peak_rss_bytes and reconcile it against the analytic size of the
      dominant structure; report any measured/analytic ratio outside [0.5, 4] as
      an unexplained discrepancy in report.md rather than explaining it away
      (IR-7).
    - >-
      Memory cap 8 GiB and one worker are machine protection. Exceeding the cap
      checkpoints the task as resource_exhaustion with partial artifacts
      preserved; that is infrastructure signal and never a mathematical verdict
      (SR-3, AGENTS.md core rule 5). A missing runtime or a crash is reported as
      such with concrete defects, never as a negative result.
    - >-
      Make no claim. Report observations only. You may not state that any slot
      count is better, that any attack is improved, that any curve is weakened,
      or that any hypothesis is supported. Interpretation is a separate
      Coordinator step after independent review.
    - >-
      Any needed change to a parameter, metric, control, threshold or outcome rule
      stops execution and is returned to the Coordinator for an additive
      protocol_amendment. Do not adjust the frozen preregistered prediction (SR-6).
    - No Bedrock, and no silent inference downgrade. Record the resolved model identifier, model_verified, fallback_used and any degraded requirements truthfully.

  deliverables:
    - A complete, runnable driver implementing the frozen protocol, and an independent checker.
    - The full run package at the fifteen declared artifact paths, hash-bound and internally consistent.
    - cost-model.json carrying the measured / modelled / derived-from-measured tables and the per-configuration measured-versus-modelled discrepancy.
    - memory-accounting.json carrying analytic_bytes, measured peak_rss_bytes and their ratio per cell.
    - report.md stating every terminal cell status, every control outcome, both endpoints of every spread and improvement factor, and every unexplained discrepancy - and no interpretation.

