  review_required: true
  review_required_rationale: >-
    This is a claim-relevant scientific producer: its outputs are the intended
    basis of a future EV-* record on H-FROB-d93575. agents/coordinator.md
    requires review_required true with dependent independent review for such a
    task, and the plan below is written BEFORE any reviewer runs, as AGENTS.md
    "Review architecture" requires. Setting review_required false here - the
    zero-science route taken by TASK-20260909-4e8f94 and TASK-20260914-861bb9 -
    would be wrong: those tasks measure nothing and can move no claim, whereas
    this one measures the hypothesis's primary metric.

  review_plan:
    claim_under_review: >-
      As the producer will state it: "In cell FROB-SPLIT-q11n5 the exactly
      enumerated combinatorial cost ratio (U + 1 + extra)/p_m varies across the
      achievable direct-sum partitions at fixed total slot dimension n-1 by a
      within-cell improvement factor I >= 4 with its minimum at slot count
      m >= 2; I there is at least four times I in the matched no-lattice cell
      FROB-NOLATTICE-q13n5; the matched non-stable, matched-cardinality and
      null-curve control arms each show a strictly smaller spread; and the direct
      sum of the non-trivial kernels ker f_j(pi) is exactly ker Tr, of dimension
      n-1."
    coordinator_prior: >-
      RECORDED BEFORE ANY REPORT RETURNS. I expect: (1) the ker Tr identity to
      HOLD exactly in every completed cell - the module argument is elementary
      and squarefreeness is checked, so a failure would most likely indicate an
      implementation error in the pi matrix or the factorisation rather than a
      mathematical surprise; (2) the improvement factor in FROB-SPLIT-q11n5 to
      CLEAR the factor-4 threshold comfortably, because the classical
      factor-base balance is steep in q; (3) the no-lattice cell to show I close
      to 1; and (4) THE CONTROL COMPARISON TO BE THE PART THAT FAILS OR COMES
      OUT AMBIGUOUS. My specific worry, and the reason I wrote this prior down:
      the matched-cardinality random control C3 has IDENTICAL U_neg by
      construction, so the whole object-versus-control difference is carried by
      p_m alone, and a random set of the same size spread over the subgroup may
      well produce a LARGER p_m and hence a SMALLER, smoother cost ratio than the
      structured slots - which would make the control look better than the
      object and the "spread strictly smaller on the control" clause fail for a
      reason that has nothing to do with artefacts. EXP-FROB-b8cf21's null arm
      already out-performed its object arm on Delta_rank, so this is the second
      time the same shape of surprise would appear on this lattice. If the
      review overturns prior (2) or confirms this worry, that is the most
      valuable result available from this round and it must not be softened.
    joints:
      - joint: >-
          J1. p_m is the exact fraction of DISTINCT nonzero points of <G>
          representable as one summand per slot - not a count of tuples, not a
          fraction of E(F_{q^n}), and not a fraction of N.
        assigned_to: validator
        attack_plan: >-
          Recompute p_m in closed form where one exists and compare against the
          enumerator: at m = 1 with V = F_{q^n} the answer must be exactly 1; at
          m = 1 with any V the answer must be exactly |B|/(N-1); at V = {0} it
          must be 0 and trigger the denominator-zero rule rather than a division.
          Then attack the deduplication: construct a configuration with many
          coincident tuple sums (overlapping slots are permitted by the
          protocol) and check that the numerator counts DISTINCT targets. Check
          the denominator is N-1 and not N or #E. I expect this joint to hold
          and the deduplication to be where an error would hide.
        breaking_artifact: A named configuration with the enumerator's p_m and the closed-form p_m side by side, differing.
      - joint: >-
          J2. U_neg and U_frob are counted consistently, are never mixed across
          arms, and U_frob is null with a reason wherever the slot set is not
          pi-stable.
        assigned_to: validator
        attack_plan: >-
          Check |B| is divisible by 2n on every pi-stable arm (every signed
          Frobenius orbit has size exactly 2n because ord_N(mu) = n with n an odd
          prime, so mu is neither 1 nor -1) - an indivisible |B| means either the
          slot set is not pi-stable or the orbit accounting is wrong. Check
          U_neg = |B|/2 exactly. Then grep every table, statistic and sentence in
          cost-model.json and report.md for a comparison that places a U_frob
          value beside a U_neg value; the cross-arm comparison must use
          negation-only throughout.
        breaking_artifact: A pi-stable arm with |B| not divisible by 2n, or any table mixing the two presentations.
      - joint: >-
          J3. The control arms are actually matched to what they claim: C2 has
          matched dimension AND is genuinely not pi-stable; C3 has cardinality
          matched exactly; C4's curve is genuinely not defined over any proper
          subfield.
        assigned_to: red-team
        attack_plan: >-
          For C2, verify the certificate that some w in W has pi(w) not in W, and
          verify dim W equals the object slot's dimension exactly - a subspace
          that is "random" but accidentally pi-stable silently destroys the
          control. For C3, verify |B_j| matches the object's per slot, not merely
          in total, and that the sets are negation-closed (an odd-cardinality
          "negation-closed" set is a tell). For C4, verify j' is not in F_q by
          the j'^q = j' test on the recorded value, verify N/2 <= N' <= 2N, and
          check whether the recorded cofactor c' differs enough from c to explain
          the arm's p_m difference on its own. Where you think it breaks: C4
          changes two things at once (the curve and the subfield structure), so
          attack whether any difference attributed to structure is really a
          cofactor difference.
        breaking_artifact: A control arm whose declared matching property fails on its own recorded data, or a cofactor difference sufficient to explain the arm's gap without any structural cause.
      - joint: >-
          J4. The within-cell improvement factor I and the cross-cell comparison
          I(SPLIT) >= 4 * I(NOLATTICE) are not artefacts of field size, subgroup
          order, cofactor, or arithmetic that would move any quantity of this
          shape.
        assigned_to: red-team
        attack_plan: >-
          Build the strongest available null explanation and try to make it fit:
          compute what I would be under the frozen MODELLED sizing alone
          (modelled_|B_j| = q^{d_j}/c etc., which contains no Frobenius content
          beyond the dimensions), and see whether the modelled I already
          reproduces the measured I to within the reported discrepancy. If it
          does, the measurement is confirming arithmetic that follows from the
          dimensions alone, and the Frobenius-stability language is decoration.
          Separately, check whether the factor-4 thresholds were attainable at
          all given the achievable multisets - a threshold that no configuration
          could have failed is not a test. Then check whether I was computed over
          the FULL achievable set, including denominator-zero and empty-base
          configurations handled by the C7 rule rather than dropped (IR-9).
        breaking_artifact: A modelled I reproducing the measured I within the reported discrepancy, or an I computed over a pruned configuration set.
      - joint: >-
          J5. The ker Tr identity and the achievable slot-dimension table are
          exact statements about these cells, verified independently of the
          construction that predicts them.
        assigned_to: validator
        attack_plan: >-
          Confirm ker Tr was computed DIRECTLY from repeated q-th powering and not
          from h(pi) - deriving it from h(pi) and then "verifying" it against
          h(pi) is circular and is the obvious way this check fails without
          failing. Confirm the sum of kernels was certified DIRECT (dimensions
          add) rather than merely spanning. Confirm the achievable multiset table
          was enumerated from the factorisation rather than from the observed
          non-empty bases - reading the lattice off the data would make the
          lattice-agreement check vacuous. Finally, confirm ker (x-1)(pi) = F_q
          is NOT inside ker Tr in these cells (it would be only if p divided n,
          which is excluded), since that is the exact statement that makes the
          (x-1) exclusion meaningful.
        breaking_artifact: A circular derivation of ker Tr, a non-direct sum reported as direct, or a lattice table read off the measured bases.
    blindness:
      mutual: true
      lifted_for: []
      rationale: null
    proves_too_much:
      objects:
        - FROB-NOLATTICE-q13n5, where no non-trivial partition exists at total dimension n-1, so a large partition-lattice improvement factor is known to be impossible.
        - The C3 matched-cardinality random arm, which has identical U_neg and no linear structure whatsoever.
        - The C4 matched null curve, which has no q-power Frobenius endomorphism on its rational points.
        - The degenerate endpoints of C6, V = {0} and V = F_{q^n}, whose p_m values are known exactly in advance (0 and 1).
      failure_signature: >-
        On each of these objects the partition-lattice reasoning must produce
        I close to 1 and a spread strictly smaller than the object arm's, and on
        the C6 endpoints it must produce exactly the known values. If the same
        analysis yields a large improvement factor on the no-lattice cell, or the
        same spread on the random-set arm, then what is being measured is the
        arithmetic of splitting a fixed budget of points into m bins - which
        happens for any set of any origin - and not Frobenius-stable structure.
        An argument that still goes through where its conclusion is false is
        wrong somewhere nobody has read closely enough yet.
      assigned_to: red-team
    blind_rederivation:
      required: true
      quantity: >-
        p_m and U_neg for exactly one named configuration: cell
        FROB-SPLIT-q11n5, the first eligible object curve under the frozen
        selection rule, object arm, the two-slot partition whose slot dimensions
        are (2,2). p_m is defined as the number of DISTINCT points R in
        <G> \ {O} admitting R = Q_1 + Q_2 with Q_1 in B_1 and Q_2 in B_2,
        divided by N - 1. U_neg is defined as |B_1 union B_2| / 2. Both are exact
        rationals or integers. The definition above is the whole of what the
        re-deriver is given about the quantity; the METHOD of computing it is not
        specified and must not be sought.
      parameters: >-
        q = 11, n = 5; F_11 = Z/11Z; F_{11^5} = F_11[z]/(g) with g the
        lexicographically first monic irreducible of degree 5 ordered by
        coefficient tuple with the constant coefficient first; element encoding
        sum a_i * 11^i; curve family y^2 = x^3 + Ax + B with (A,B) scanned
        lexicographically over {0,...,10}^2, singular and supersingular curves
        discarded, N the largest prime dividing #E(F_{11^5}) to exponent exactly
        1 with N >= 17, N not dividing #E(F_11), and pi acting on the order-N
        subgroup as multiplication by mu with ord_N(mu) = n; G the first affine
        point in lexicographic order whose cofactor-cleared image is nonzero;
        B_j = {Q in <G>\{O} : x(Q) in V_j}; V_1 and V_2 the kernels of the two
        declared products of two linear factors of x^5 - 1 over F_11, in the
        frozen ordering of h by degree then coefficient tuple.
      blind_from:
        - experiments/EXP-FROB-91ee9c/runs/TASK-20260914-7119f2/implementation.py
        - experiments/EXP-FROB-91ee9c/runs/TASK-20260914-7119f2/checker.py
        - experiments/EXP-FROB-91ee9c/runs/TASK-20260914-7119f2/raw.jsonl
        - experiments/EXP-FROB-91ee9c/runs/TASK-20260914-7119f2/metrics.json
        - experiments/EXP-FROB-91ee9c/runs/TASK-20260914-7119f2/cost-model.json
        - experiments/EXP-FROB-91ee9c/runs/TASK-20260914-7119f2/memory-accounting.json
        - experiments/EXP-FROB-91ee9c/runs/TASK-20260914-7119f2/certificates.json
        - experiments/EXP-FROB-91ee9c/runs/TASK-20260914-7119f2/report.md
        - experiments/EXP-FROB-91ee9c/runs/TASK-20260914-7119f2/fixtures.json
        - experiments/EXP-FROB-91ee9c/runs/TASK-20260914-7119f2/stdout.log
      assigned_to: executor
      independence_note: >-
        The re-deriver runs in a session independent of the producing Executor,
        builds its own arithmetic from the definition and parameters above, and
        declares in its attestation every path it read. Agreement is then
        evidence about p_m; disagreement localises to one of two named
        implementations. This is NOT replication: recomputing from the producer's
        own implementation would reproduce a wrong-but-self-consistent
        implementation faithfully, which is the failure mode validation cannot
        see.
    procedure_deviations:
      - >-
        DECLARED AT WRITING TIME, NOT ABSORBED. `assigned_to` in this plan names
        ROLE ADDRESSES (validator, red-team, executor) rather than reviewer
        TASK-* identifiers, because this Coordinator subagent was allocated
        exactly five identifiers and may mint no more, and inventing a reviewer
        task identifier would be a fabrication under AGENTS.md core rule 9. The
        roles named are the real subagent roles declared in
        orchestration/roles.yaml and .claude/agents/. The dispatching session
        must mint one TASK-* per named owner and record the role-to-task binding
        in the handoff that OPENS the review round - a NEW record, never an edit
        of this immutable one. Until that binding exists,
        tools/check_review_independence.py cannot bind this plan to attestations,
        and the round is not complete.
      - >-
        This plan is attached to the PRODUCER handoff rather than to the
        review-opening handoff, so that the Coordinator prior is on the record
        before the measurement exists rather than merely before the reviewers
        run. That is stricter than the contract requires and is recorded so the
        ordering is auditable.
