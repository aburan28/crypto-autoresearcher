  read_scope_note: >-
    Out of scope: experiments/EXP-AUXIN-7e2e3d/runs/, every computations.json
    of BATCH-ba0b0d, this batch's batch.yaml, and anything concerning
    EXP-FROB-30006a. The BATCH-09aadd reports are readable because their
    findings define the defects to discharge. They carry control integers, and
    no integer from them may appear in either output file (DR-11).
  constraints:
    - >-
      DR-1 ADDITIVE. Write one new file. Do not edit specification.yaml,
      AMD-20260916-bands.yaml, AMD-20260923-d1d10.yaml, or any implementation,
      run, ledger or review file (D10).
    - >-
      DR-2 SELF-CONTAINED. Every recipe, rule, formula, threshold, tolerance,
      gate, convention and tool clause is stated IN THE FILE. A clause carried
      from d1d10 is restated in full, never incorporated by reference. A
      reference to another file may give provenance only, never the sole
      statement of a recipe, a rule or an integer (the root of Q0-1).
    - >-
      DR-3 SHAPE. Model the top-level shape on AMD-20260923-d1d10: id,
      experiment_id, recorded_at, kind additive_protocol_amendment,
      supersedes_fields, does_not_rewrite, cites, defect, change,
      authorization, non_claims. Add hypothesis_id H-AUXIN-6db354 and
      predecessor_amendment AMD-EXP-AUXIN-7e2e3d-20260923-d1d10. Include every
      field approval requires: controls, metrics, budget, stopping rules,
      invalidation rules, required artifacts, a decidable success criterion
      with at least one negative outcome, a falsification criterion,
      interpretation limits, and a proof_search_map whose audits are filled
      or carry a not_applicable_reason.
    - >-
      DR-4 APPROVAL GATE IN THE FILE. Set status review_required. Add an
      approval block stating that the amendment is approved if and only if
      DEC-20260926-96f970 is official with decision approve naming
      AMD-EXP-AUXIN-7e2e3d-20260926-typed. Nothing in the file is edited
      afterwards.
    - >-
      DR-5 DISCHARGE EVERY ENTRY. Each of the sixteen DEC-20260923-a4c3d5
      undischarged_defects entries (numbered 1-16 in the plan's
      undischarged_defect_coverage) maps to a quoted clause, with a test a
      reviewer can run. Specific requirements:
      - Q0-2, Q0-3, Q0-4, Q0-7, Q0-8, Q0-9 and Q0-10 each get a declared
        convention.
      - Q0-5, Q0-6, Q0-11 and Q0-12 are closed, or explicitly declared
        immaterial with a reason.
      - A mutation check with the equality clause disabled is required
        (entry 4).
      - A planted positive above the F2/F3 routing size is required (RC2,
        entry 14).
      - A declared-state BOUND evaluator control is required, whose expected
        status, witness, bound pair and bin the text fixes in advance (O9/RC1,
        entry 14).
    - >-
      DR-6 KEEP WHAT HELD. Carry forward the following, restated verbatim
      unless a listed defect requires a change, which is then stated with its
      reason:
      - the three construction recipes C-PLANT-M, C-PLANT-P and C-INERT;
      - the typed costs and input models;
      - the D3 predicate text;
      - the descriptive bins with a frozen null arm;
      - the stage order;
      - the certificate route with a library-free verifier;
      - the proves-too-much behaviour held in rules.
      Do not redesign what held.
    - >-
      DR-7 UNIT AND LABELLING. State the CORR-20260923-f5f060 unit statement
      beside the rho column, and label per CORR-20260923-187ea3. No sentence
      may state that the typed exponents and the rho exponent share a unit.
      Every new sentence is scoped to a typed, labelled arithmetic table at the
      frozen orders.
    - >-
      DR-8 TIME-DEPENDENT SOURCES. A source that can change is pinned to a
      revision that cannot drift. Add an executor step that archives the
      retrieved bytes with their sha256 before parsing. An unreachable pinned
      revision is an infrastructure stop, never a substitution. Where your
      role cannot verify a locator, say so in the design report; do not
      assert that it was checked.
    - >-
      DR-9 TOOLS. Name the tools and versions, and admission commands that
      report those versions. Fix the ECM curves-per-level column. Fix seconds
      recorded per cofactor, and a budget and timeout mechanism that is
      determinate with in-process PARI. Provisioning is not this card's job:
      absence at execution is an infrastructure stop (plan K-provision).
    - >-
      DR-10 CUSTODY. Forbid, or bind by path_sha256, every import from outside
      the implementation directory. Require a comparison of the snapshot-bound
      implementation bytes with the launch commit before any row is scored.
    - >-
      DR-11 NO VALUES. Neither file may contain any of the following: a census
      value, minimising divisor, escalated-curve list, BATCH-ba0b0d or
      BATCH-09aadd reviewer finding value, or control integer computed by
      anyone. Cite records by id. Every token of both files will be hashed
      against protected digests, and a hit returns the draft for revision.
    - >-
      DR-12 No Cheon run, no [x^i]P, no supply audit, and no vulnerability,
      weak-curve, safe-curve, deployed-system or ordinary-ECDLP sentence (plan
      tripwire T1).
    - >-
      DR-13 HYPOTHESIS. Cite and state the protocol against H-AUXIN-6db354,
      and do not edit it. If you find it cannot carry the protocol without
      change, put a hypothesis_restatement_proposal in the design report;
      composition decides under key K-hypothesis.
    - >-
      DR-14 ROUTE STOP RULE (DEC-20260926-0eed78 R6). If the amendment route
      cannot carry the revision, do NOT write the amendment file. Write the
      design report with route_ruling successor_experiment and the reasons,
      then stop and report. You resume only after a recorded queue revision
      supplies a minted EXP id and path.
    - >-
      DR-15 GOAL-TEXT READINGS. DEC-20260923-a4c3d5 does not rule two
      readings: pause condition 3's sqrt(r) scale on r + 1, and whether 256-bit
      controls discharge completion criterion 4. Raise them as
      goal_text_questions in the design report. The draft may not rely on a
      reading that no record fixes.
    - DR-16 ZERO RUNS. This role holds no shell; nothing is computed.
  deliverables:
    - experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml
    - >-
      design-report.yaml, containing:
      - the discharge table (entry 1-16 -> clause -> reviewer test);
      - the regression table (held item -> carried clause -> changed or
        unchanged, with reason);
      - the Q0-1..Q0-12 closure table;
      - route_ruling;
      - any hypothesis_restatement_proposal;
      - goal_text_questions;
      - an attestation of what was read.
