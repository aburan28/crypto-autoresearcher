  title: >-
    Design: draft AMD-EXP-AUXIN-7e2e3d-20260926-typed, the new additive
    amendment to EXP-AUXIN-7e2e3d, stated against H-AUXIN-6db354 and
    discharging every DEC-20260923-a4c3d5 undischarged defect, plus a design
    report with an entry-by-entry discharge table
  objective: >-
    Draft AMD-EXP-AUXIN-7e2e3d-20260926-typed at
    experiments/EXP-AUXIN-7e2e3d/amendments/AMD-20260926-typed.yaml. It is a
    NEW, versioned, additive protocol amendment to EXP-AUXIN-7e2e3d. It:
    - cites the refused AMD-EXP-AUXIN-7e2e3d-20260923-d1d10;
    - is stated against H-AUXIN-6db354;
    - follows CORR-20260923-f5f060 for the cost-unit statement;
    - keeps what held;
    - discharges every entry of DEC-20260923-a4c3d5 undischarged_defects;
    - is complete enough for approval.
    Write a design report mapping each of the sixteen entries, and each
    regression item, to the clause that discharges or keeps it.
  uncertainty_reduced: >-
    Whether a census protocol text exists that closes every instrument,
    custody, tool, provenance, labelling and convention defect
    DEC-20260923-a4c3d5 found, while keeping the three construction recipes
    that proved determinate. The test is whether two independent
    implementations reach the same values from its text alone.
  inputs:
