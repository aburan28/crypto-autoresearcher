handoff:
  id: TASK-20260731-601
  from: coordinator
  to: idea-generator
  objective: >-
    Produce an object-first map of the reduced-round AES cryptanalytic
    baseline and one or more novelty-screened, falsifiable candidate
    mechanisms, each naming the concrete mathematical object it tracks at a
    specific round count, or return NO_ADMISSIBLE_NEXT_MECHANISM with the
    residual open question named.
  uncertainty_reduced: >-
    Whether any concrete propagation object in reduced-round AES — a
    division-property/integral set at a named round count, a key-schedule
    differential relation, a Demirci-Selcuk meet-in-the-middle matching
    object, a partial-sum cost term, or an impossible-differential
    contradiction object — plausibly moves a cost boundary at a stated round
    count, or whether every candidate generated deduplicates to a known
    attack family.
  inputs:
    - GOAL-AES-001
    - RQ-AES-001
    - docs/inventor-protocol.md (sections 1, 2, 4, 5)
    - docs/target-result-profile.md
    - docs/claims-and-verification.md
    - The existing knowledge corpus under knowledge/ for deduplication
  constraints:
    - >-
      Object-first. Every candidate names the concrete mathematical object it
      tracks through the computation, at a specific round count. "Attack AES"
      is not a candidate.
    - >-
      Declare the established families off-limits as the primary lens and
      deduplicate every candidate explicitly against integral/square,
      impossible differential, meet-in-the-middle / Demirci-Selcuk,
      boomerang, biclique, and division property. A renamed variant is
      recorded as a rediscovery, not a candidate.
    - >-
      Apply the lossy-projection test before proposing any experiment and
      record its outcome per candidate: a projection that discards nothing is
      a change of coordinates, not a new object.
    - >-
      Reduced-round scope only (3–7 rounds). No candidate, phrasing, or
      extrapolation may assert anything about full-round AES or deployed AES
      security. Claim-tier ceiling: toy / reduced-round.
    - >-
      The AES specification is treated as pinned by locally reproducible
      FIPS-197 known-answer vectors produced by TASK-20260731-602, not by any
      read document.
    - >-
      Every literature baseline number is UNVERIFIED-FROM-MEMORY under this
      network policy (csrc.nist.gov, eprint.iacr.org, arxiv.org, faest.info,
      ietf.org all blocked; GitHub scoped to this repository; WebFetch of
      primary crypto sources fails). Mark each such number
      `unverified_from_memory` inline. Presenting a recalled number as if it
      had been read is a fabrication under AGENTS.md rule 9.
    - >-
      Premature closure is a failure mode symmetric with overclaiming. Do not
      decline to generate because AES is exhaustively studied. Any closure
      must meet the docs/inventor-protocol.md §4 standard — named
      obstruction, argument, forward guidance; a screening count is a fatigue
      report, not a closure.
    - >-
      Every candidate carries `dominated_by` and a quantitative `sota_delta`.
      An unchecked `dominated_by: null` is a fabrication under AGENTS.md
      rule 9.
    - >-
      Charge full end-to-end cost: data complexity, time, memory,
      precomputation, and verification, at the same round count as the named
      baseline.
    - >-
      Any proposed falsification gate must fit the local envelope: 4 CPU
      cores, 15 GB RAM, no GPU, no sage; gcc 13.3.0 with -maes, python3 with
      pycryptodome 3.23.0, openssl CLI. A gate that does not fit says so
      rather than being estimated.
    - >-
      Academic defensive cryptanalysis only. Propose no hypothesis status,
      approve no experiment, and change no official state.
    - Write only under the assigned task directory.
  deliverables:
    - baseline_map.md
    - candidate_report.yaml
  artifact_paths:
    - coordination/goals/GOAL-AES-001/batches/BATCH-001/tasks/TASK-20260731-601/baseline_map.md
    - coordination/goals/GOAL-AES-001/batches/BATCH-001/tasks/TASK-20260731-601/candidate_report.yaml
  archived_by: TASK-20260731-603
  inference:
    policy: research-deep
    requested_policy: research-deep
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
    harness_note: >-
      Under this Claude Code harness the subagent frontmatter cannot resolve
      the orchestration/model-policies.yaml identifiers (CLAUDE.md, "Model
      policy note"): all subagents run `model: inherit`. Record
      `requested_policy: research-deep` and the ACTUAL resolved model in the
      task's manifest `inference` block, with `fallback_used: true` if they
      differ. Never silently substitute.
  budget:
    wall_clock_seconds: 2400
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
    - >-
      baseline_map.md separates, per round count in 3–7, the known attack
      families and their recalled best-known parameters, with every recalled
      number explicitly marked `unverified_from_memory` and none presented as
      read from a source.
    - >-
      Every candidate in candidate_report.yaml names its tracked object, the
      round count at which the object is asserted to hold, explicit
      assumptions, a concrete prediction, a full end-to-end cost boundary,
      and its deduplication verdict against each of the six named attack
      families.
    - >-
      Every candidate records its lossy-projection test outcome,
      `dominated_by`, and a quantitative `sota_delta`.
    - >-
      Every candidate names exactly ONE cheap falsification gate runnable
      inside the local envelope and the campaign budget, with its expected
      wall-clock cost and its required null-object control stated together.
    - >-
      NO_ADMISSIBLE_NEXT_MECHANISM is an admissible and complete outcome,
      provided the report names the residual open question, states which
      object classes remain unexamined, and meets the §4 closure standard
      rather than reporting a screening count.
  return_format: >-
    baseline_map.md plus candidate_report.yaml under the assigned task
    directory, and a short session summary naming the tracked objects
    generated, the deduplication verdicts, and the single cheapest gate per
    surviving candidate.
