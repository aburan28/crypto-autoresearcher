handoff:
  id: TASK-20260921-008f2d
  from: coordinator
  to: idea-generator
  objective: >-
    Generate exactly four mechanism-distinct, schema-complete, falsifiable
    proposals for the active research question RQ-QSP-f9bbdb (quasi-subfield
    polynomials and an index-calculus / factor-base attack on the ECC2K-130
    Certicom challenge Koblitz curve y^2 + xy = x^3 + 1 over
    F_2[z]/(z^131 + z^13 + z^2 + z + 1), group order 4*l with l a 129-bit
    prime). Each proposal must search a (representation, operation set) pair
    against the recorded rigidity results rather than restating a known family
    in new notation, must consume a named non-generic resource, and must name
    the nearest existing QSP record plus the exact tracked-object delta from it.
  uncertainty_reduced: >-
    Whether any fresh mechanism survives the existing QSP lane corpus -- seven
    filed proposals, four hypotheses, and the recorded rigidity results for
    factor-base and point-representation design -- without regressing to a known
    family, and whether any such mechanism moves the asymptotic exponent rather
    than polishing a logarithmic cofactor.
