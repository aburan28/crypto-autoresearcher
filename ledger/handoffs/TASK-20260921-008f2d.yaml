  constraints:
    - Write exactly the four assigned proposal files and do not modify any existing record.
    - Use IDs IDEA-20260921-e280fa, IDEA-20260921-77537d, IDEA-20260921-0a8e63 and IDEA-20260921-c1c92d exactly; bind all four to RQ-QSP-f9bbdb with status proposed.
    - MANDATORY, because RQ-QSP-f9bbdb targets a heavily mined ECDLP lane (index calculus, factor-base design, point representations, quotient and coordinate objects) -- read docs/object-frame-ideation.md and apply its constraint block in full. Search over (representation, operation set) PAIRS against the recorded rigidity results. An idea that is a known family relabelled is not an idea; discard it and report the rigidity result that killed it.
    - Apply the exemplar search heuristics in agents/idea-generator.md and the target profile in docs/target-result-profile.md -- exponent-first ambition, hunting external structural ingredients (theorems, bounds, correspondences that convert a bottleneck step into a tractable one), meet-in-the-middle decompositions, distribution heuristics paired with re-randomization and a mixing-time justification, and reduction-network cascades.
    - Screen the complete QSP proposal and hypothesis corpus named in inputs, plus adjacent Semaev, summation-polynomial, factor-base, Koblitz, Frobenius and binary-field index-calculus records in knowledge/. Name the nearest record and the exact tracked-object delta for every idea.
    - Every idea must carry the complete idea-generator schema, including heuristic_assumptions with each heuristic numbered, formally stated, given a random-model justification and paired with its own experimental validation route; target_complexity stating BOTH the time and the memory exponent versus the best known; dominated_by, settable to null only after checking every row of the frontier across time, memory and data/queries; a quantitative sota_delta; same-shape null controls; falsification conditions; an obstruction block with a resource_check where applicable; proof_search_map where the proposal is proof-oriented; and full cost boundaries.
    - Do NOT strip or soften heuristic_assumptions or target_complexity. A conditional claim stays conditional, with its validation route and exponents intact, and is never presented as unconditional.
    - novelty_status remains unverified unless a source you actually read supports a narrower label. A recalled citation is a pointer and can never support novelty_status known or adaptation. Mark every citation provenance recalled | retrieved | kb | internal.
    - Premature closure is a failure mode symmetric with overclaiming. Do not decline to generate on the ground that this lane is already mined; a count of screened-and-rejected mechanisms is a fatigue report, not a closure.
    - Read-only context only for everything outside your write scope. An experiment is in flight in this worktree and a detached container is actively writing under experiments/EXP-QSP-70b731/runs/ -- do not read, write, list or clean anything under experiments/, and do not run tools/experiment_execution.py.
    - No experiment execution, implementation, hypothesis creation, approval, status transition, knowledge promotion, deployed-target interaction, live-key recovery, or breakthrough claim.
    - No git write command of any kind. The Coordinator runs an isolated snapshot archive task afterwards.
    - No Amazon Bedrock, fallback, or degradation.
    - Do not fabricate commands, outputs, timings, statistics, citations or successful runs.
