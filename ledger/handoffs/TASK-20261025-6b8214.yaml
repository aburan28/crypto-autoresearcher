handoff:
  archived_by: TASK-20261025-c7c93f
  publication_state: unpublished_local_draft
  constraints:
  - Local public-input/planted-test/tool engineering is authorized by the user. No
    commit, push, official state transition, experiment approval, scientific review
    dispatch or scientific launch while the recorded remote-access impediment persists.
  - Preserve all existing experiment, review, source and receipt bytes; all new work
    is additive.
  - Never inspect credential values or files. No private credentials are supplied
    or required for implementation.
  budget:
    maximum_runs: 0
    memory_gb: 2
  id: TASK-20261025-6b8214
  from: coordinator
  to: executor
  objective: Implement an opt-in prospective sealed-then-unblind review validator;
    preserve legacy strict independence semantics.
  inputs:
  - AGENTS.md
  - tools/check_review_independence.py
  - tests/test_review_independence.py
  - ledger/handoffs/TASK-20261025-5145ac.yaml
  - experiments/EXP-ECDLP-d6d8e8/reviews/TASK-20261025-5145ac/report.json
  - problems/prym-assisted-source-labelled-router.md
  deliverables:
  - tools/review_phase_seals.py
  - tools/check_review_independence.py
  - tests/test_review_phase_seals.py
  - docs/review-phase-seals.md
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-49720f/engineering-verification.json
  artifact_paths:
  - tools/review_phase_seals.py
  - tools/check_review_independence.py
  - tests/test_review_phase_seals.py
  - docs/review-phase-seals.md
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-49720f/engineering-verification.json
  write_scope:
  - tools/review_phase_seals.py
  - tools/check_review_independence.py
  - tests/test_review_phase_seals.py
  - docs/review-phase-seals.md
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-49720f/engineering-verification.json
  completion_gate:
  - New plans opt in only via blind_rederivation.phased_release.schema = sealed-blind-review/v1.
    No automatic phase inference from prose or historical phase2_allowed fields.
  - Validate the root-agreed schema below using actual file hashes and complete declared
    per-source read timeline; malformed or incomplete timelines fail closed.
  - Positive valid sealed-then-unblind case passes; negative controls reject pre-seal
    protected read, late/false/missing seal or release, wrong hash, missing/incomplete/duplicate/disordered
    source timeline, unknown schema, and unsafe or mismatched paths.
  - Legacy strict union-of-sources cases and existing scoped-lift/replacement/addenda
    controls retain their behavior; immutable TASK-20261025-5145ac records stay untouched
    and no historical pass is asserted.
  - Run focused meaningful checker tests and report exact commands/results. Explain
    that consistency validation cannot authenticate identity, prove undisclosed reads
    absent, or independently prove commit/publication timing.
  - Existing tests/test_review_independence.py is an unchanged reference/regression
    suite, not a required modified deliverable.
  inference:
    policy: executor-implementation
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
    delivery: interactive
    reasoning_effort: high
  return_format: Exact paths, commands and results, missing gates, and limitations.
    No scientific verdict.
  schema_agreement:
    plan:
      field: review_plan.blind_rederivation.phased_release
      schema: sealed-blind-review/v1
      fields:
      - schema
      - plan_path
      - phase1_allowed
      - phase2_allowed
      - derivation_path
      - seal_path
      - release_path
      recorded_at: review_plan.recorded_at is aware UTC; plan_path names the actual
        handoff YAML
    derivation:
      task_id: assigned blind re-deriver
      generated_at: aware UTC before seal
      sources_read: exact complete phase1 source set
      quantities: blind rederived values
    seal:
      schema: sealed-blind-review/v1
      fields:
      - schema
      - task_id
      - recorded_at
      - plan_sha256
      - derivation_path
      - derivation_sha256
    release:
      schema: sealed-blind-review/v1
      fields:
      - schema
      - task_id
      - recorded_at
      - plan_sha256
      - derivation_path
      - derivation_sha256
      - seal_path
      - seal_sha256
      ordering: strictly after seal
    attestation:
      field: review_attestation.phased_release.events
      events: ordered seq1..N; kind read|seal|unblind; at aware UTC; each read has
        source; seal/unblind bind matching files/timestamps/hashes
      coverage: Read-event source set equals sources_read exactly; phase1 read sources
        equal derivation.sources_read; protected reads occur only after release and
        within phase2_allowed. Exactly one seal and unblind.
    external_custody_obligation: Sealed derivation and Coordinator seal committed
      before release; the checker validates content/timeline, not undisclosed read
      absence or independent publication timing.
  local_engineering_authorized: true
  official_scientific_dispatch_authorized: false
  uncertainty_reduced: Prospective implementation and provenance readiness for the
    finite width follow-up, with no scientific acceptance labels collected.
