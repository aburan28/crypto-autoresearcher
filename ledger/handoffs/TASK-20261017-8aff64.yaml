    blindness:
      mutual: true
      lifted_for: []
      rationale: >-
        No lift of any kind, and no sequenced lift (lesson LS-2 of
        DEC-20261017-435b01). The blind re-derivation is its own task,
        TASK-20261017-ccd10c, blind throughout to every blind_from path. The
        joint owner TASK-20261017-8aff64 is not a re-deriver, so it may read the
        TASK-20260930-40470a report, which is the producer artifact of the
        claims under review, from the start. Mutual blindness: neither task
        reads the other's directory, claim or release records. The
        coordinator prior is kept out of both cards (LS-1); for the re-deriver
        its decision file is also a blind_from path.
      sequenced_lifts: none
    proves_too_much:
      objects:
        - >-
          PT-1 -- GENERIC POINTS OF E^{m-1}. Take the base to be the function
          field of E^{m-1} (the P_i generic points, so the y_i are in the base
          field). Every root x(P_1 + sum eps_i P_i) is then rational over the
          base and the group is trivial. An argument for RA-1 or RA-2 that
          would also give a nontrivial group here proves too much.
        - >-
          PT-2 -- THE [2]-GRAPH SUBVARIETY. Restrict the ordered base at m = 3
          to x_2 = x([2]P_1), the x-coordinate doubling map of x_1, with x_1
          free. Then f(x_2) = f(x_1) times a square in K(x_1), the roots are
          x([3]P_1) and x(P_1), both in K(x_1), and the group is trivial. An
          argument that gives the generic group on this curve proves too much.
          A correct delta-rule predicts complete splitting here at every
          x_1 in F_p with f(x_1) != 0, because chi(f(x_2)) = chi(f(x_1)).
        - >-
          PT-3 -- THE SQUARE-DISCRIMINANT COVER AT m = 4. Adjoin the square
          root of the discriminant of the cubic with roots x_1, x_2, x_3 to
          K(e_1, e_2, e_3), equivalently restrict to cubics with square
          discriminant. The S_3 factor becomes A_3 and the image must shrink
          to A_4 (order 12). An argument that gives S_4 there proves too much.
      failure_signature: >-
        On each object a correct argument yields the smaller group, and the
        report names the step that changes: PT-1, the y_i lie in the base, so
        the sign-change group is trivial; PT-2, the independence step fails
        because f(x_1) f(x_2) is a square in K(x_1); PT-3, the permutation
        part becomes A_3. Numerically: on PT-2 at m = 3, for at least 20 random
        x_1 in F_p on one curve, S_3(x_1, x([2]P_1), T) splits completely over
        F_p whatever chi(f(x_1)) is; on PT-3 at m = 4, among at least 2,000
        sampled square-discriminant cubics on one curve, no odd cycle type
        (2+1+1 or 4) occurs on squarefree full-degree fibres. An argument that
        succeeds (gives the generic group) on any object has proved too much.
      assigned_to: TASK-20261017-8aff64
    blind_rederivation:
      required: true
      quantity: >-
        Setting: p > 3 prime; E: y^2 = f(x) = x^3 + a x + b nonsingular over
        F_p; K an algebraic closure of F_p. S_m is the m-th Semaev summation
        polynomial of E, defined by S_2(x_1,x_2) = x_1 - x_2, S_3 the explicit
        polynomial with S_3(x_1,x_2,x_3) = 0 iff there are points P_i in E(K)
        with x(P_i) = x_i and P_1 + P_2 + P_3 = O, and S_m(x_1..x_m) =
        Res_X(S_{m-k}(x_1..x_{m-k-1},X), S_{k+2}(x_{m-k}..x_m,X)) for m >= 4,
        with the defining property S_m(x_1..x_m) = 0 iff there are P_i in E(K)
        with x(P_i) = x_i and P_1 + ... + P_m = O. Let F(T) =
        S_m(x_1,...,x_{m-1},T), a polynomial in T. Determine: Q1 (ordered base)
        the Galois group of the splitting field of F over K(x_1,...,x_{m-1}),
        with x_1..x_{m-1} independent indeterminates, as a permutation group on
        the roots of F: the degree of F in T, the group's order, its orbits,
        whether it is transitive, whether it is regular, and its isomorphism
        type; and the same over F_p(x_1,...,x_{m-1}) (arithmetic group), saying
        whether it equals the geometric one. Q2 (symmetric base) the same over
        K(e_1,...,e_{m-1}), where e_j are the elementary symmetric functions of
        x_1..x_{m-1} (F has coefficients there because S_m is symmetric): the
        group order for each m in 3..7 and its isomorphism type at m = 4, with
        primitivity or a block system for m = 5, 6, 7. Q3 (Frobenius rule) for
        x_1..x_{m-1} in F_p, NOT required to be x-coordinates of F_p-points,
        with f(x_i) != 0 for all i and F squarefree of full degree: a rule, if
        one exists, that predicts the cycle type of the p-power Frobenius on the
        roots of F from (E, x_1..x_{m-1}); state the rule and the set of cycle
        types that occur. Q4 dependence on the curve: whether any answer to Q1 to
        Q3 depends on (a, b), with explicit attention to a = 0, b = 0 and
        supersingular curves.
      parameters: >-
        Build your own S_3, S_4 and S_5 and check each against the defining
        property on at least 200 random tuples per m (points constructed from
        the group law). Use at least two primes in 50..2000 and at least three
        curves, including one with a = 0 at a prime p = 1 mod 3, one with b = 0
        at a prime p = 1 mod 4, and one supersingular curve. Ordered base:
        Frobenius cycle types exhaustively over F_p^{m-1} at m = 3 and m = 4 on
        at least one curve with p <= 150; at least 50,000 random tuples at m = 4
        and at least 2,000 at m = 5 on at least two curves with p >= 500.
        Symmetric base: Frobenius cycle types over at least 20,000 random
        F_p-points (e_1, e_2, e_3) at m = 4 on at least two curves. Compare
        cycle-type FREQUENCIES (not only which types occur) with the Chebotarev
        densities of the group you derive, using the exact finite-p count where
        you can compute it and a declared bound otherwise. Group orders at
        m = 6, 7 may rest on an explicit permutation-group computation, provided
        you derive the reduction of the Galois action to that computation and
        state it. Declare every curve, prime, sample size and seed.
      blind_from:
        - coordination/goals/GOAL-MONO-001/review/TASK-20260930-40470a/
        - coordination/goals/GOAL-MONO-001/review/TASK-20261016-9c1bc5/
        - coordination/goals/GOAL-MONO-001/review/TASK-20261017-8aff64/
        - coordination/goals/GOAL-MONO-001/batches/
        - coordination/review/
        - ledger/handoffs/TASK-20261017-8aff64.yaml
        - ledger/handoffs/TASK-20260930-40470a.yaml
        - ledger/handoffs/TASK-20261016-9c1bc5.yaml
        - ledger/decisions/
        - ledger/evidence/
        - ledger/corrections/
        - ledger/hypotheses/
        - ledger/proposals/
        - ledger/questions/
        - ledger/goals/
        - knowledge/
        - experiments/
        - analysis/
        - research/
      blind_from_note: >-
        Every path is blind THROUGHOUT the re-derivation task. There is no
        sequenced lift. The list covers the producer of the CU-9 derivations
        (the TASK-20260930-40470a review and its plan), every record that
        states their conclusions, the census implementations and runs
