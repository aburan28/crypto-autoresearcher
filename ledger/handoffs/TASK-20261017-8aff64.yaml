      assigned_to: TASK-20261017-ccd10c
      owner_joint: RB (listed under joints, owned by TASK-20261017-ccd10c)
    composition:
      - id: RA-C1
        rule: >-
          Amendment A01 K1 to K4 bind as pre-review keys (A01 K5a). Composed
          statuses are C, B-D, B-W and N-E as A01 defines them. Each joint
          states a claim of the J4 DISSENT or of CU-9, so C means that claim
          holds as composed.
      - id: RA-C2
        rule: >-
          Route (a) is adoptable only if RA-4 composes as broken on the merits
          (the reviewer's DISSENT meets RA-4's breaking artifact: a reading of
          criterion (a) anchored in committed text that the route-(a) object
          satisfies, with every ground G-i, G-ii, G-iii answered on the
          merits). The composing decision may then supersede the J4 DISSENT on
          the merits citing this review (A01 K1e) and revisit CS-K1d of
          DEC-20261017-435b01. Otherwise route (a) is not adoptable.
      - id: RA-C3
        rule: >-
          If RA-4 composes C (at least one ground sustained on the merits, and
          any sustained ground resting on RA-1 has RA-1 composing C), the
          composing decision DECLINES route (a) on the merits on the sustained
          grounds and records the J4 DISSENT as disposed by concurrence: the
          DISSENT objected to adopting route (a), and the Coordinator's
          committed ruling now declines that adoption on the DISSENT's own
          grounds, citing a fresh rule-12 review that sustains them, so no
          Coordinator position remains for the DISSENT to dissent from. This
          is the "disposes of the J4 DISSENT on the merits" of
          DEC-20261017-435b01 closure_revisit_condition (i). It is neither
          outvoting (proceeding with the act a DISSENT objects to) nor a
          recomposition of the same report (A01 K1e), and it relaxes no A01
          key. That composer then decides whether GOAL-MONO-001 moves to
          completed on criterion (c) under AGENTS.md "Goal closure quorum
          (suspended)": only if no other recorded DISSENT is outstanding and the
          closing text states or implies nothing a carried DISSENT ground
          denies (A01 K1d).
      - id: RA-C4
        rule: >-
          If RA-4 composes B-W, N-E or INCONCLUSIVE, the J4 DISSENT persists
          (A01 K1e), the goal stays active with criterion (c) recorded met, and
          the composer names the single next action (the missing cure or a
          fresh round).
      - id: RA-C5
        rule: >-
          If RA-1, RA-2 and RA-3 each compose C and the blind re-derivation (RB
          holds) agrees with each on Q1 to Q3 (A01 K4b), the composer may
          promote the CU-9 derivations as a derivation-tier finding scoped to
          p > 3, nonsingular E/F_p and generic monodromy, and supersede
          KN-OPEN-8a7432 Q2's text accordingly. The "every m" extent then rests
          on the derivations; measured corroboration covers only the curves,
          primes and m sampled, and the finding says so. A disagreement is
          localised under A01 K4b and blocks the promotion; it decides RA-4
          only through G-i.
      - id: RA-C6
        rule: >-
          A report not served at max, not from an independent fresh session,
          or missing review_attestation.yaml is not a rule-12 review, and
          nothing composes from it. A blind re-derivation whose attestation
          shows a blind_from path read composes as not independent (K4b
          cannot use it).
      - id: RA-C7
        rule: >-
          Narrowings carried into any adopting or declining text: toy tier; no
          statement about the relation-rate question, the D-4 count beyond
          "not condemned", extension fields or cryptographic scale
          (DEC-20261017-435b01 CS-D2, CS-N1; REVIEW-MONO-20261016-9c1bc5
          CU7-C7).
      - id: RA-C8
        rule: A reviewer's opinion on the whole goal, if given, is not a vote. The Coordinator composes.
      - id: RA-C9
        rule: >-
          Composition questions (A01 K5c). The Coordinator knows of three: Q-C
          and Q-OI, owned by RA-4; and CQ-1, settled here: if RA-4 is sustained
          only on G-ii and/or G-iii while RA-1 breaks, RA-C3 applies on the
          sustained grounds and RA-C5 does not promote. Any other composition
          question a reviewer identifies is listed in its report and composes
          N-E for the joint it bears on (A01 K2) until a Coordinator
          amendment, committed before a FRESH round, settles it.
