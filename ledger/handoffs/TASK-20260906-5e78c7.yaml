handoff:
  id: TASK-20260906-5e78c7
  recorded_at: '2026-09-06'
  goal_id: GOAL-ECDLP-bbc21f
  question_id: RQ-ECDLP-78dbc5
  batch_id: BATCH-f3a30a
  batch_id_note: >-
    Written by the approval task TASK-20260906-a01da6 (batch BATCH-252a44)
    per design-experiment skill step 5, mirroring the identical precedent on
    v1's own executor handoff (ledger/handoffs/TASK-20260906-3623b9.yaml
    `batch_id_note`): the EXECUTION batch for v2 is not yet opened, so its
    batch id is assigned when that batch opens, and dispatch_queue and
    task_card below are null for the same reason.
  dispatch_queue: coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-f3a30a/dispatch_queue.json
  task_card: coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-f3a30a/tasks/TASK-20260906-5e78c7/task_card.yaml
  role: executor
  from: coordinator
  to: executor
  review_required: true
  objective: >-
    Implement and execute the approved, frozen v2 contract
    experiments/EXP-ECDLP-612fb1/specification.v2.yaml (status approved,
    approved_by coordinator, frozen true, execution_authorized true, version
    2, per the approval recorded in DEC-20260906-806501) EXACTLY as written:
    the batch-reselected fixed-size distinguished-point table of
    H-ECDLP-37dc01 on the generic keyed-random-function instrument,
    re-gated by (a) a ceiling-feasibility gate G3 from exact basins before
    any re-selected arm's S1/F1 is interpreted, (b) a non-vacuity guard and
    relative tolerance on S1, (c) a one-sided S2, (d) a frontier-tuple
    headline that charges working storage, (e) a corrected HEUR-BLT-7 using
    the measured admitted-walk count, (f) a per-admission pool cap, (g) a
    permanent negative-fixture regression test on the analysis pipeline,
    and (h) a Stage 0 a-scan run first. REFUSE AND REPORT rather than run if,
    at dispatch time, specification.v2.yaml is not `status: approved` AND
    `execution_authorized: true` -- do not proceed on a message or a stale
    read of this handoff alone; re-read the committed contract at dispatch.
    The frozen v2 contract is the ONLY protocol. The Executor records
    observations only: it interprets nothing beyond what the contract's own
    gates require it to report (e.g. G3/G1 verdicts before S1/F1 lines), draws
    no hypothesis-level conclusion, and changes no status.
  uncertainty_reduced: >-
    Whether, at a = 1/4, r = 2, k = 4 on the generic instrument at N in
    {2^24, 2^30}, a re-selected table at T_sel in {0.65T, 0.75T} -- gated by
    G3 ceiling-feasibility from exact basins, scored by a non-vacuous,
    relatively-toleranced S1 and a one-sided S2, and reported as a frontier
    tuple charging S_peak -- reaches the static T-entry table's per-target
    success at equal precomputation, equal walk budget and equal bits per
    entry; and whether the Stage 0 a-scan (item h) locates any (a, r) at
    which a fixed-advice claim is feasible before any re-selected arm at
    that cell is run. The Executor produces the measurements; the
    Coordinator decides after independent review.
  inputs:
  - >-
    experiments/EXP-ECDLP-612fb1/specification.v2.yaml (the frozen, approved
    v2 protocol -- the ONLY protocol; four gate fields set by
    TASK-20260906-a01da6 under the recorded user approval; every other
    protocol field byte-identical to the drafted commit c39430554)
  - experiments/EXP-ECDLP-612fb1/amendments/v1_to_v2.yaml (the protocol_amendment record this contract implements, item by item)
  - experiments/EXP-ECDLP-612fb1/specification.v1-frozen-df3238e2.yaml (v1, preserved unchanged; NOT re-run or re-scored by this handoff)
  - ledger/hypotheses/H-ECDLP-37dc01.yaml (the specified hypothesis; status unchanged by execution)
  - ledger/questions/RQ-ECDLP-78dbc5.yaml (decision target, definitions and constraints)
  - ledger/decisions/DEC-20260906-1f5b71.yaml (the decision requiring this amendment; item (a)-(h) source text)
  - ledger/decisions/DEC-20260906-806501.yaml (the approval decision, once committed by TASK-20260906-773a2e)
  - >-
    coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-289698/tasks/TASK-20260906-90e7cf/src/pipeline_perm/
    and .../results/j4_perm/ (the red team's two permanent negative-fixture
    bijection seed sets, item g -- these are the red team's OWN task-scoped
    artifacts, not a separate location to search for; STAGE 4v2's analysis
    must score G1 FAIL, never PASS or crash, on both before any real-cell G1
    verdict is trusted)
  - knowledge/literature/KN-LIT-3060.md (Bernstein-Lange, abstract-level constants)
  - knowledge/literature/KN-LIT-013.md (Corrigan-Gibbs-Kogan, the S T^2 ceiling)
  - knowledge/techniques/KN-TECH-005.md (preprocessing / time-memory tradeoff technique note)
  - >-
    PRIMARY SOURCES: the coordinator's retrieved primary-text plain files
    from v1's design (scratchpad bl2012.txt, cgk.txt, SCRATCH_SUMMARY.md)
    are NOT in the repository. The primary source for the published weight,
    procedure, cap and Table 4.1 is Bernstein-Lange, "Computing small
    discrete logarithms faster", IACR eprint 2012/458
    (cr.yp.to/dlog/cuberoot-20120919.pdf); the primary source for the
    generic bound is Corrigan-Gibbs-Kogan, "The discrete-logarithm problem
    with preprocessing", IACR eprint 2017/1113. The Executor may re-fetch
    them itself if it needs them, exactly as v1's executor handoff
    (TASK-20260906-3623b9) allowed, and records the fetched URL and
    retrieval date in the run manifest; the contract's published numbers
    are binding as written and are not re-derived from memory.
  constraints:
  - >-
    FROZEN CONTRACT. Any needed change to any v2 protocol field is a further
    versioned protocol_amendment proposed under
    experiments/EXP-ECDLP-612fb1/amendments/ to the Coordinator -- NEVER an
    inline edit of specification.v2.yaml, and never a re-score of an
    executed run (v1's or v2's).
  - >-
    FRESH IMPLEMENTATION PATH:
    experiments/EXP-ECDLP-612fb1/source_v2/ -- a path distinct from v1's
    executor's experiments/EXP-ECDLP-612fb1/source/. This is required, not
    optional: the pool-admission algorithm (item f, per-admission cap
    truncation) and the G3/G1-permanent-fixture gate logic (items a, g)
    changed relative to v1's pinned source, so v2's implementation is a
    genuinely different code path, not a parameter change to v1's; reusing
    v1's source/ path in place would risk silently mixing the corrected and
    uncorrected pool-cap timing. One code path for all v2 arms with arm
    selection by configuration, hash-pinned by commit in every run
    manifest.
  - >-
    SHARED RUN DIRECTORY, FRESH RUN IDS: run records go under the SHARED
    experiments/EXP-ECDLP-612fb1/runs/ directory (the same directory v1's
    37 runs already occupy), using fresh RUN-* ids that never collide with
    v1's existing RUN-ECDLP-612fb1-001..037. v1's run records are immutable
    and are never touched, edited, or re-scored by this task.
  - >-
    STAGE ORDER IS BINDING: STAGE 0 (the a-scan, item h) MUST be run and its
    table reported (rho_ORACLE(a, r, T_sel) across the a-scan grid, the
    ordering check rho_ORACLE(1/4, r) vs rho_ORACLE(1/2, r)) BEFORE any
    STAGE 1v2/2v2 (re-selected-arm) cell is INTERPRETED (it may be run
    concurrently with Stage 1v2/2v2 for scheduling convenience, mirroring
    v1's own G1/G2-before-interpretation-not-before-execution practice per
    the amendment record's `judgment_calls`, but its table must be reported
    before any RESEL-L(T_sel) S1/F1 line is read). Within STAGE 1v2/2v2:
    gate G3 (item a) is evaluated per (a, r, T_sel) cell from that cell's
    own exact basins (STAGE 1v2, N = 2^24) or sampled ORACLE reading (STAGE
    2v2, N = 2^30, informational) BEFORE the corresponding RESEL-L(T_sel)
    arm's S1/F1 outcome is interpreted; a G3 FAIL makes that cell UNTESTABLE
    for S1/F1, never negative. Gate G1 (2^20, unchanged from v1) is reported
    before Stage 1v2 is interpreted, and G2 (each N) before that N's arms.
  - >-
    PERMANENT NEGATIVE FIXTURE (item g) IS BINDING: before STAGE 4v2's
    analysis run reports any G1 verdict on a real (STAGE 0/G/1v2/2v2) cell,
    it must first re-run its own G1 aggregation logic against the two
    committed permanent negative fixture result sets named in `inputs`
    above and confirm (i) no exception on fit_cutoff returning None, (ii) a
    reported G1 FAILED (not silently coerced to PASS, not a crash) on both.
    Failing either check is a STOPPING CONDITION for STAGE 4v2: repair the
    analysis code (using the red team's src/pipeline_perm/analysis.py.diff
    as the reference patch, or an equivalent None-guard) before any G1
    verdict from this batch is reported as trustworthy.
  - >-
    HEADLINE DISCIPLINE (item d): the frontier tuple (T_sel/T, S_peak/T,
    P/sqrt(NT), L per target, eps_ss, eps_cum, U, early-batch penalty) is
    the ONLY permitted way to report an advice ratio; a bare rho_T number
    reported alone, without S_peak in the same line, is a contract
    violation, not a reporting style choice.
  - >-
    DETERMINISTIC SEEDS exactly as the v2 contract's (unchanged) seed_policy:
    generic walk-key seed s in {1, 2, 3, 4, 5}, target seed 100 + s, and the
    other named offsets, every arm at the same s sharing the walk, the pool
    and the target sequence; a duplicated or missing seed invalidates the
    cell.
  - >-
    ALL COSTS IN COUNTED GROUP/WALK OPERATIONS, NEVER WALL CLOCK: one
    counted operation per walk step, with restart scalar multiplications,
    table lookups, re-selection integer operations counted separately per
    the contract's `instrument.charging` (unit unchanged; timing amended
    per item f -- charged per admission, not once at round end); S and
    S_peak in bits under the frozen bits_per_entry; wall clock recorded in
    the manifest for infrastructure accounting only and never a decision
    variable, per AGENTS.md and the v1 precedent (TASK-20260906-3623b9).
    MEASURED and MODELED numbers never share a column (the corrected
    HEUR-BLT-7 r_eff, item e, is MODELED; the v1 superseded formula is
    retained beside it, labelled, never dropped).
  - >-
    RUN RECORDS are immutable under experiments/EXP-ECDLP-612fb1/runs/<RUN-ID>/:
    manifest.yaml with the exact command, git commit and dirty-tree state,
    environment and dependency versions, inputs, ALL seeds, complete stdout
    and stderr, raw-result.json, summary.json, validity status and reason,
    timestamps, wall clock and peak_rss_bytes reconciled against the 8 GB
    ceiling. A defective run is superseded by a new run record, never
    edited.
  - >-
    INFERENCE MANIFEST per run: requested_policy executor-implementation,
    backend, resolved model identifier, model_verified, reasoning effort,
    fallback_used with reason; this handoff sets fallback_allowed false and
    degraded_allowed false -- if the policy cannot be honoured the Executor
    refuses and reports, never silently substitutes.
  - >-
    A TIMEOUT (3600 s per run), crash, memory exhaustion or dependency
    failure is failed_infrastructure and is NEVER a result, positive or
    negative (AGENTS.md rule 5; contract invalidation rule 2); it is
    reported as such and re-planned with a smaller shard within the
    contract's spare runs, never interpreted.
  - >-
    ZERO INTERPRETATION BEYOND THE CONTRACT'S OWN GATE LANGUAGE: no
    hypothesis-level conclusion, no status change, no ledger write (no
    EV-*, DEC-*, H-* or KN-* record); the Executor writes only inside its
    write_scope.
  - >-
    NETWORK: none required by the contract for execution; permitted only to
    re-fetch the two named primary sources, with the fetch recorded.
  deliverables:
  - experiments/EXP-ECDLP-612fb1/source_v2/ (the v2 instrument implementation, one code path, hash-pinned per run manifest)
  - >-
    experiments/EXP-ECDLP-612fb1/runs/RUN-*/ (fresh run ids, never colliding
    with v1's RUN-ECDLP-612fb1-001..037): one immutable run record per
    executed run -- manifest.yaml, raw-result.json, summary.json, stdout and
    stderr, exact basin-size histograms (including the STAGE 0 a-scan grid
    at N = 2^20), the G1/G2/G3 gate values and the permanent-negative-fixture
    regression check output, the per-run MEASURED/MODELED cost table
  - >-
    the analysis run's CI tables (rho_T(U), rho_ORACLE(U), rho_cum(U),
    differences, one-sided NULL-A gains, phi decay, r sweep, UPPER-LOWER,
    CAP retention with per-round S_peak <= c verified, early-batch penalty,
    U_ss, U*, the fixture table, the frontier tuple per (arm, T_sel, N),
    bootstrap code and resample count) over the stages completed in the
    batch
  - >-
    execution_report.yaml and artifact_inventory.json in the execution
    batch's own future task directory (path TBD -- assigned when that
    execution batch opens; not yet mintable by this handoff, mirroring v1's
    own precedent of leaving the execution report's path as "assigned at
    dispatch")
  artifact_paths:
  - experiments/EXP-ECDLP-612fb1/source_v2/
  - experiments/EXP-ECDLP-612fb1/runs/
  - execution_report.yaml and artifact_inventory.json (execution batch task directory, path TBD when that batch opens)
  archived_by: TASK-20260906-1e5ea4
  archived_by_note: >-
    Not yet assigned: the reserved snapshot-archive task for v2's execution
    batch is minted when that batch opens, mirroring v1's own precedent
    (TASK-20260906-3623b9 named TASK-20260906-7a2446 only once the execution
    batch existed to reserve it against). This task does not mint that id.
  write_scope:
  - experiments/EXP-ECDLP-612fb1/runs/
  - experiments/EXP-ECDLP-612fb1/source_v2/
  - the execution batch task directory (assigned at dispatch)
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 3600
    memory_gb: 8
    maximum_runs: 20
  contract_budget_envelope:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 4
    maximum_memory_gb: 8
    maximum_runs: 20
    maximum_workers: 1
  budget_note: >-
    Copied from specification.v2.yaml's own `budget`/`budget_note` block, sized
    proportionally to v1's actual accounting rather than to v1's grid size:
    v1's executor handoff (TASK-20260906-3623b9) carried wall_clock_seconds
    3600 (per-run ceiling), memory_gb 8, maximum_runs 48 (12 CPU-h ceiling)
    for a larger grid across three N values (2^20, 2^24, 2^30), a in {1/4,
    1/2}, r in {2, 4, 8}, plus a curve stage -- and actually used only 37
    runs / 0.14 of its 12 CPU-hour ceiling. v2's grid is smaller in the
    dimension that matters for run count (one N pair {2^24, 2^30} at two
    T_sel values, a = 1/4, r = 2 only, no curve re-run) but adds the new
    STAGE 0 a-scan (12 a-values x 3 r-values x 5 seeds, but a single
    exact-basin sweep per seed, seconds-to-minutes per v1's own Stage G
    experience). Per specification.v2.yaml's `budget_note` worked
    arithmetic: about 5 runs (Stage 0) + 5 (Stage 1v2) + 5 (Stage 2v2) + 2
    (Stage 4v2 analysis) = 17 runs, so maximum_runs 20 (3 spare for
    recorded infrastructure re-runs, same margin ratio as v1's 36+12=48).
    Per-run wall_clock_seconds stays 3600 (unchanged ceiling; v1's actual
    max observed was 85.8 s for a comparable-size cell). memory_gb stays 8
    (schema floor; v1's actual peak was about 2 GB). total_cpu_hours 4 is
    generously above the proportional expectation given v1's actual 0.14
    CPU-hours for a larger grid. maximum_workers 1, unchanged. These are
    advisory estimates per docs/research-budget-policy.md and CLAUDE.md
    "Research budgets: progress first": they require no repeated approval
    to revise upward if the actual run needs more, and are not a gate on
    this handoff's validity.
  completion_gate:
  - >-
    STAGE 0 (the a-scan, item h) is run and its table (rho_ORACLE(a, r,
    T_sel) across the a-scan grid, the a=1/4-vs-a=1/2 ordering check) is
    REPORTED FIRST, before any STAGE 1v2/2v2 cell's S1/F1 outcome is
    interpreted.
  - >-
    Gate G1 (2^20, unchanged from v1) is reported before STAGE 1v2 is
    interpreted; gate G2 is evaluated first at each N in {2^24, 2^30} before
    that N's arms; gate G3 (item a) is evaluated and reported per (a, r,
    T_sel) cell BEFORE that cell's RESEL-L S1/F1 outcome is interpreted; the
    permanent negative fixture (item g) reads G1 FAIL on BOTH bijection
    seed sets (never PASS, never a crash) before any real-cell G1 verdict
    from STAGE 4v2's analysis is reported as trustworthy.
  - >-
    Every interpreted cell's advice-ratio result is reported ONLY as the
    frontier tuple (item d) -- rho_T alone, without S_peak/T in the same
    line, does not satisfy this gate.
  - >-
    Every required artifact of the v2 contract is present for every
    executed run: schema-complete manifest, raw-result.json, summary.json,
    basin-size histograms including the Stage 0 grid, the analysis CI
    tables over the completed stages, and the G1/G2/G3 and permanent-fixture
    verdict tables.
  - >-
    execution_report.yaml and artifact_inventory.json are present in the
    execution batch's task directory, with run inventory, gate values per N
    and per cell, exhaustion and infrastructure events, validity per run,
    resource measurements, and stages not yet run (if budget-exhausted,
    reported as exhaustion, never as a negative).
  review_reservation: >-
    Results of this task are CLAIM-RELEVANT (review_required: true),
    exactly as v1's own review_note requires and unchanged by this
    amendment. On dispatch the execution batch's task card must carry a
    reserved snapshot-archive task, a dependent Validator task (blind
    re-derivation of the fixture, the exact top-T_sel share, and the G3
    comparison at 2^24 from the statement of the quantities, blind to the
    producer's implementation) and a Red Team task (the null design's
    one-sidedness, the non-vacuity guard's own non-vacuity on the real
    object, and the corrected per-admission pool-cap logic). No run under
    this handoff is evidence before that chain -- snapshot archive,
    independent Validator and Red Team reports, then a Coordinator ledger
    archive with the evidence and decision records -- has completed and
    been verified.
  execution_dispatch_note: >-
    Written by the approval task TASK-20260906-a01da6 (batch BATCH-252a44)
    per design-experiment skill step 5. Dispatched ONLY by the execution
    batch opened AFTER the approval decision DEC-20260906-806501 (authored
    by TASK-20260906-773a2e) is committed and merged to main, so the
    Executor starts from the approved, frozen v2 contract on the base
    branch. At dispatch time the Executor MUST re-read
    experiments/EXP-ECDLP-612fb1/specification.v2.yaml on the base branch
    and refuse if it is not `status: approved` and `execution_authorized:
    true`. A message or in-session word is never an approval; this handoff
    plus the committed decision are.
