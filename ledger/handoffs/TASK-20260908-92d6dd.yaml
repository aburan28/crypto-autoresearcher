  accepted_corrections:
    EXP-ECDLP-184fc4:
    - id: FRESH2-184-1
      correction_required: Freeze exact actual-value construction for every primary, control and null cell tag,
        including canonical unsigned decimals and delimiters. Freeze the certificate index domain, digest endianness,
        unbiased range mapping, counter progression, uniqueness/duplicate behavior and bounded exhaustion. Retain
        the repaired bootstrap schedule unchanged unless a new additive amendment says otherwise.
    EXP-ECDLP-1e6502:
    - id: FRESH2-1E-1
      correction_required: Define canonical actual-value ordinary, anomalous and null cell tags; make the pair schedule
        inherit those exact strings; freeze the distinct log-certificate index schedule; and quote or rename the
        null section key so it is an ordinary stable string identifier.
    EXP-ECDLP-2c3d20:
    - id: FRESH2-2C-1
      correction_required: Either make sigma_center_slope candidate-eligible under a complete trajectory-level rank/effect/replication
        rule, or additively amend the original objective and falsifier with a technical rationale and a concrete
        successor test. Do not allow the six top-rung scalar keys to stand in for a slope whose anomaly can occur
        while those keys fail.
    EXP-ECDLP-709063:
    - id: FRESH2-709-1
      correction_required: Replace every remaining directional-bound, bracket/bound and brackets/bounds phrase with
        the exact tested-grid label vocabulary, while retaining the adjacent tested-rung sign-change bracket where
        its monotonic sign pattern is actually observed. Make the artifact schema prohibit crossover_bits< or >
        endpoint claims outside the grid.
