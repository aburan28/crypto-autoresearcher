    inference:
      policy: review-adversarial
      reasoning_effort: xhigh
      independent_session_required: true
      fallback_allowed: false
      degraded_allowed: false
    joints:
    - joint: arithmetic_and_counter_coverage
      assigned_to: TASK-20260908-40e722
      role: reviewer
      scope: Coefficient kernel, selected SymPy callgraph/backend, mixed-int/power/division
        routes, all calibrators and19adapter admission cases.
      attack_plan: First independently derive typed counts from the blind definitions
        below. Then trace every known source bypass and new/from_dict path, test the
        proposed event semantics on paper against actual method dispatch, and identify
        any conversion/inherited method that can escape the kernel or change solver
        behavior.
      where_coordinator_thinks_it_breaks: A direct integer or native-domain operation
        bypasses declared methods, reverse division is double charged, or exact ring.rem/monic
        expectations omit a call.
    - joint: algebra_and_legal_certificates
      assigned_to: TASK-20260908-ab0e84
      role: reviewer
      scope: "Ordinary fixtures, subgroup/lifts, full S3/S4/Bareiss construction,\
        \ tracked Gr\xF6bner derivations, independent checking, signed columns, planted/random\
        \ controls and legal wrong-field rank."
      attack_plan: Independently derive the small F5/ell7 point relations and row
        ranks from public definitions; check simultaneous S4 binding and Bareiss divisions,
        then challenge DAG ideal-inclusion logic and every signed/duplicate target-column
        case. Verify both S3 and S4 have genuine planted-positive solver controls.
      where_coordinator_thinks_it_breaks: A remainder term is falsely treated as an
        ideal element, a signed point is absent from columns, or a wrong-field matrix
        is not realizable by the supplied legal certificates.
    - joint: paired_measurement_and_statistics
      assigned_to: TASK-20260908-020fc1
      role: reviewer
      scope: Seed/count schedule,1600roots,48000primary/48000warmup/24000profile components,
        mode pairing, timing-mode boundary attribution, load/drift targets and2000paired
        resamples.
      attack_plan: Reconstruct cell/component totals independently and map each primary
        time to its paired count and separate profile audit. Derive mutually exclusive
        delta categories from bare tolerances, then challenge missing-size, undefined-bootstrap
        and sign-unspecified drift cases. Demonstrate why a tiny significant delta
        can be practical agreement.
      where_coordinator_thinks_it_breaks: A profile clock leaks into primary timing,
        a seeded pair is duplicated/resampled inconsistently, or an incomplete size
        enters a survivor-only fit.
    - joint: resources_lifecycle_and_authority
      assigned_to: TASK-20260908-69a17c
      role: reviewer
      scope: Full resource stages, unique shared ownership, actual six-process topology,
        sealed schedules/receipts, calibration stop gate, checkpoints/terminal adapter
        and independent-review-before-implementation authority.
      attack_plan: Trace one full job and a failed-first-calibration campaign, accounting
        for every process, relation, shared object and receipt. Verify producer/verifier
        never overlap with four burners, rank costs are owned once, roots are not
        mislabeled unactivated, and inherited timeout/degree semantics are explicitly
        amended without goal cancellation.
      where_coordinator_thinks_it_breaks: A seventh process or duplicate rank/setup
        cost appears, a root lacks a final receipt, or a design output hash is mistaken
        for a completed activation gate.
    blindness:
      mutual: true
      lifted_for:
