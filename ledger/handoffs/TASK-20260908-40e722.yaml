        discrepancy. A reviewer already exposed to the expectations is ineligible
        for this slot.
      required: true
      assigned_to: TASK-20260908-ece27b
    proves_too_much:
      objects:
      - A counter sees only __mul__ and passes schoolbookM/A while missing DIV/POW/S/I
        routes.
      - Arbitrary rows are offered as decomposition certificates without legal point
        sums.
      - A precise0.01 paired delta is assigned both primary agreement and disagreement.
      - A profiled timing component is substituted for the unprofiled primary clock.
      - After first calibration failure, always-activated roots are falsely given
        NOT_ACTIVATED or omitted.
      failure_signature: Any argument accepting one of these objects without the declared
        rejection or scoped limitation fails its joint; no global protocol PASS from
        a partial joint report.
    work_limits: Protocol/source reasoning only before implementation. Do not execute
      solvers, fixtures, calibrations, tests or experiments under this review plan.
      Any need for such work is a named later task/gate, not an implicit launch authorization.
    dispatch_requirements:
    - Allocate/check concrete reviewer TASK IDs and archive owners, replace SLOT bindings
      through an additive pre-review binding record, and freeze exact read scopes
      including the redacted packet.
    - Obtain real independent native sessions satisfying review-adversarial/xhigh
      and record actual model/policy verification and access; do not reuse the originating
      Coordinator as an independent reviewer or fabricate availability.
    - Bind completed Coordinator snapshot hashes before any reviewer starts. This
      local slot plan alone is not a valid dispatch handoff.
    synthesis: Coordinator reviews the independent joint reports, resolves conflicts
      by evidence and records a separate approval/revision decision before implementation.
      A subsequent scientific claim-changing round requires its own preregistered
      plan/prior and actual evidence snapshot; this protocol round cannot stand in
      for it.
