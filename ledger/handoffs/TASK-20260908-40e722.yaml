      - coordination/design/BATCH-28dddb/readiness-map.md
      - coordination/design/BATCH-28dddb/review-plan.yaml
      - coordination/design/BATCH-28dddb/source-packet.json
      release_gate: Commit the blind derivation report/hash before releasing the complete
