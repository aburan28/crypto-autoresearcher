  title: >-
    Lane A blind re-derivation J5: the quantities Q0 to Q5 stated on this
    card, from their definitions and parameters alone
  objective: >-
    Compute every quantity that the quantities block of this card defines,
    from its definitions and parameters alone, and report every output it
    asks for. You are told what to compute and not how, and you read no
    other artifact of this program.
  uncertainty_reduced: >-
    Whether the lane-A deployed arithmetic (the generic preprocessing
    frontier column at matched advice, the precomputation identity, and the
    m = 5 crossing window) is determined by the stated model and parameters.
    A second implementation, written by someone who shares nothing with you,
    will be compared with yours afterwards. Disagreement localises to a model
    choice or to one of two named implementations.
  inputs:
    - ledger/handoffs/TASK-20260928-95abde.yaml
  read_scope:
    - ledger/handoffs/TASK-20260928-95abde.yaml
    - AGENTS.md
    - agents/validator.md
    - templates/research-records.md
  read_scope_note: >-
    A whitelist of four repository files. Every other repository path is out
    of scope, and every path in the plan's blind_rederivation.blind_from is
    forbidden by name, which you cannot see and need not: read nothing else.
    No git history of any kind, and no pull-request text. No external
    retrieval is needed; every parameter is on this card.
  quantities:
    what_you_are_testing: >-
      Whether a five-entry column of generic-frontier budgets, a
      precomputation identity, and a crossing window in one parameter are
      determined by elementary arithmetic on the stated model. A second
      implementation will be compared with yours afterwards.
    parameters:
      r: 680564733841876926932320129493409985129
      r_note: a prime of 129 bits; you may verify primality but need not
      N_prime: r divided by 262 (real number, not an integer)
      m_values: [4, 5, 6, 8, 16]
      two_to_n: 2 to the power 131
      rho_reference_definition: R = sqrt(pi times r divided by (4 times 131)), in bits
      shared_cost_model: >-
        For arity m, B_cap(m) = (m factorial times 2^131) to the power 1/m.
        With per-attempt oracle cost C, the shared cost is
        T_shared(C) = B_cap(m) times 1.58 times C plus m times B_cap(m)^2,
        and each additional target costs 1.6 times C. The total for L
        targets is IC(L) = T_shared(C) + 1.6 times L times C.
      generic_multi_target_law: rho_multi(L) = R times sqrt(L), with R as defined above
      generic_preprocessing_frontier: >-
        For advice size S words, the generic online cost is
        T_gen = sqrt(N_prime divided by S) and the generic precomputation is
        P_gen = sqrt(N_prime times S).
      m5_comparator_values_bits: [32.4, 33.08]
      m5_comparator_note: >-
        Two candidate single-target per-attempt budgets at m = 5, in bits;
        use each in turn as B5 and report both. They are inputs, not answers.
      g_values: [0, 2, 6, 10, 13, 13.2, 14]
    Q0:
      name: undetermined choices
      definition: >-
        Every point at which the definitions above left you a choice (a
        rounding, an ambiguity in the model, the treatment of the 1.58 and
        1.6 constants, real versus integer arithmetic). For each, quote the
        text, list the admissible readings, and say which quantities depend
        on it.
      report: A list. An empty list is a result and must be stated as such.
    Q1:
      name: cap locus in bits
      definition: log2 of B_cap(m) for each m in m_values.
      report: Per m, to four decimal bits, with the factorial you used.
      tolerance: 0.05 bit
    Q2:
      name: generic frontier column at matched advice
      definition: >-
        With S = B_cap(m), log2 of T_gen(m) and log2 of P_gen(m) for each m in
        m_values, using N_prime.
      report: Per m, both values to four decimal bits.
      tolerance: 0.05 bit
    Q3:
      name: precomputation identity and the linear-algebra term
      definition: >-
        (a) Whether B_cap(m) times sqrt(N_prime divided by B_cap(m)) equals
        sqrt(N_prime times B_cap(m)) as an identity, stated symbolically and
        checked numerically at each m. (b) log2 of m times B_cap(m)^2 at each
        m, and whether it is below log2 P_gen(m).
      report: The symbolic statement, the numeric check per m, and the per-m comparison with its sign.
      tolerance: exact on (a); exact on the sign in (b)
    Q4:
      name: m = 5 crossing window in the oracle excess g
      definition: >-
        At m = 5, with C = 2^(B5 + g) for each B5 in m5_comparator_values_bits
        and each g in g_values, find the set of L greater than or equal to 1
        for which IC(L) is strictly less than rho_multi(L), keeping every term
        of the shared cost model (do not drop the linear-algebra term or the
        1.58 factor). Report log2 of the lower and upper endpoints of that set
        (or state that it is empty), and the smallest g in the real numbers
        above which the set is empty, to 0.1.
      report: Per B5 and per g, the two endpoints in bits or empty; the critical g per B5.
      tolerance: 1 bit on each endpoint; 0.2 on the critical g
    Q5:
      name: rho reference
      definition: R in bits, as defined in parameters.
      report: To four decimal bits.
      tolerance: 0.05 bit
    rules:
      - BL-1 Read only the four whitelisted repository paths. Every other repository path is out of scope.
      - BL-2 Run no git command that shows history (log, show, blame, diff) and read no pull-request text.
      - >-
        BL-3 Choose your own libraries and algorithms and name them with
        versions. Do not transcribe any value from any source; compute it.
      - >-
        BL-4 If you find, in a source you were permitted to read, a value that
        looks like an already-computed answer to Q1 to Q5, stop and report a
        leak.
      - BL-5 Report on J5 only. Give no verdict on any contract or hypothesis, which you have not read.
      - BL-6 Zero experiment runs. This is arithmetic.
      - BL-7 Write nothing outside your write scope. Put every script, command and raw output inside computations.json.
    verdict_rule_for_your_attestation: >-
      Your review_attestation verdict on J5 is inconclusive by design: you
      are forbidden to compare. Report Q0 to Q5 in full; the composing
      Coordinator compares them with the contract's frozen column under the
      plan's keys.
  constraints:
    - BL-1 Read only the four repository paths in read_scope. Do not open any other file, any other card, or any report of this batch.
    - BL-2 Run no git log, git show, git blame or git diff of any kind, and read no pull-request text.
    - BL-3 Choose your own libraries and algorithms and name them with versions. Do not transcribe any value; compute it.
    - BL-4 If you find a computed Q1 to Q5 value anywhere you were permitted to read, stop and report a leak.
    - BL-5 Report on J5 only, with verdict inconclusive by design; you are forbidden to compare.
    - BL-6 Zero experiment runs.
    - >-
      BL-7 Write nothing outside your write scope. Put every script, command
      and raw output inside computations.json. sources_read lists files read,
      never files written.
  deliverables:
