    === QUESTION 1 -- Theorem 2.4 effectiveness ===

    ANSWER: The paper does NOT give an explicit/computable formula or
    algorithm for Theorem 2.4's implicit constant as a function of d and
    c(M). It only asserts non-constructive existence of such a constant, and
    an adjoining remark explicitly disclaims polynomial (i.e.
    effective/tractable) dependence on the complexity.

    CONFIDENCE: High. This is stated in the theorem's own text and
    reinforced by Remark 1.2, found by direct extraction, not inference.

    EXACT QUOTES (Section 2, "Algebro-geometric preliminaries", p. 13 of the
    v1 PDF):

    Theorem 2.4 (full statement, as extracted):
    "Theorem 2.4. Let k be a finite field and l a prime number different
    from the characteristic of k. Let X be a quasiprojective variety with a
    locally closed embedding in P^d_k for some integer d>=0. Let M be an
    object of D^b_c(X, Q_l) which is mixed of integral weights. Assume that
    there exists a positive integer m, a real number A and a real number
    B>=1 such that sum_{x in X(k_n)} |t_M(x;k_n)|^{2m} <= B|k_n|^A for all
    integers n>=1, where k_n denotes the extension of degree n of k in some
    algebraic closure of k. There exists a stratification of X into closed
    subschemes X^(w), defined for integers w, such that (1) We have X^(w)
    subset X^(w-1) for all w. (2) We have dim X^(w) <= floor(A)-mw for all
    w. (3) Each X^(w) is a union of subvarieties of total degree bounded
    only in terms of n and c(M). (4) For all n>=1 and x in
    (X\X^(w+1))(k_n), we have t_M(x;k_n) << |k_n|^(w/2), where the implicit
    constant depends only on d and c(M)."

    Note the wording in (3) and (4): "bounded only in terms of ... c(M)" and
    "depends only on d and c(M)" -- existential dependence, no formula
    given, no reference to a computable bound.

    Remark 1.2 (in full, Section 1, immediately after the statement of
    Theorem 1.1/mention of Theorem 2.4):
    "Remark 1.2. Our method is in one respect less efficient than that of
    [21]: whereas the latter provides estimates where the dependency on the
    complexity (when it applies) is polynomial, this is not the case in this
    paper, due to the use of qualitative results in Quantitative Sheaf
    Theory."

    I also checked the proof of Theorem 2.4 itself (immediately following,
    same page/next page): it invokes "[27, Lemma 6.26]" to produce
    subvarieties "Y_i" that are "the union of <=C subvarieties of degree
    <=C, for some integer C depending only on d and the complexity of M" --
    again purely existential ("for some integer C"), and then a further
    citation to Xu's Theorem 3.5 ([29]) for the exponential-sum estimate. No
    explicit formula for C or the implicit constant is given anywhere in the
    proof.

    I grepped the whole paper for "effective" and "explicit": the only
    other hit ("To be effective, the previous result requires a
    criterion...", Section 9.7, on hypergeometric sheaves with finite
    monodromy) is unrelated -- it concerns effectively deciding finiteness
    of a monodromy group, not computing Theorem 2.4's constant. There is no
    appendix in the paper (single "appendix" hit is a bibliography entry
    citing someone else's paper's appendix). So no later section supplies an
    effective version of Theorem 2.4.

    CONCLUSION: The paper is explicit and self-aware that its dependence on
    complexity is non-effective/non-polynomial (worse than a cited prior
    work [21], which did have polynomial dependence). Theorem 2.4 itself
    only claims existence of the stratification and its implicit constant,
    never gives a formula.

    === QUESTION 2 -- "Family L" (Legendre family R^1) presence ===

    ANSWER: NOT FOUND. I searched the full extracted text (all 57 pages)
    for "Legendre", "Legendre family", "Legendre normal form", and the
    equation patterns "z(z-1)(z-u)" / "x(x-1)(x-u)" / similar
    Legendre-pencil elliptic-curve equations. Zero matches anywhere in the
    paper.

    CONFIDENCE: High (exhaustive text search of the full paper, not just a
    summarized excerpt) -- though see the caveat under the control question
    below about search-methodology limits.

    WHERE I LOOKED: Section 9 ("examples of trace functions" -- the paper's
    dedicated examples/applications section) discusses hypergeometric
    sheaves, Kloosterman-type sheaves, orthogonal-monodromy sheaves
    (SO_4/O_4 twists), sheaves with finite monodromy, etc., but at no point
    defines, names, or uses a two-parameter Legendre-normal-form elliptic
    curve pencil v^2 = z(z-1)(z-u), nor any R^1 pushforward/cohomology sheaf
    built from such a family, under any name or notation.

    CONCLUSION: I found nothing matching this description anywhere in the
    paper. This is a clean negative result from a direct, full-text search
    of the primary source.

    === CONTROL QUESTION -- "Family K" (quadratic Kummer sheaf) presence ===

    ANSWER: Found only bare, generic notation -- not a developed treatment
    of the specific quadratic-character sheaf construction described.

    CONFIDENCE: High.

    EXACT QUOTE (Section 2, preliminaries, just before Proposition 2.3):
    "For a finite field k, an l-adic additive character psi of k or an
    l-adic multiplicative character chi, we use the usual notation L_psi or
    L_chi for the associated Artin-Schreier or Kummer sheaf, with trace
    functions x->psi(x) or x->chi(x)."

    This defines the general notation L_chi for "the" Kummer sheaf
    associated to any multiplicative character -- it is not specialized to
    the quadratic character (Legendre symbol) case, and there is no
    discussion of extension by zero at 0/infinity or of compatible
    quadratic norm characters over finite extensions specifically. The word
    "quadratic" appears three times elsewhere in the paper (line ~355,
    discussing Dirichlet L-functions "generalizing the quadratic case";
    line ~820, an orthogonal group "of the split quadratic form"; line
    ~1192, "up to a possible quadratic twist") -- none of these is the
    quadratic Kummer/Legendre-symbol sheaf on G_m either. I found no
    dedicated definition, lemma, or worked example built around a quadratic
    Kummer sheaf specifically.

    This matches the description given in the task: "a prior, non-blind
    reading found only 'bare notation'" -- my independent search
    corroborates that characterization: the paper has bare general notation
    (L_chi) for Kummer sheaves of arbitrary multiplicative characters, but
    no specific/developed quadratic instance.

    METHODOLOGY-CONFIDENCE NOTE: Because I DID find this control object
    (bare notation), even though only in minimal form, my search
    methodology is validated as sufficiently deep to detect a real (if
    minor) match when one exists. This gives me confidence that the
    negative finding on Family L (Question 2) is a genuine absence in the
    paper's text rather than a search-shallowness artifact -- the same
    full-text grep over the same extracted document surfaced the
    Kummer/quadratic hits but surfaced zero Legendre hits.

