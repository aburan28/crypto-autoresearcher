handoff:
  id: TASK-20260801-010
  from: coordinator
  to: coordinator
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-022
  objective: >-
    Author a FRESH, CLEAN frozen experiment contract under the new id EXP-SMTH-001 for
    RT048-CTRL-1, a hypothesis record under the new id H-SMTH-001 at status
    `specified`, and DEC-20260801-006 opening BATCH-022. The contract must fix the
    sampling procedure, the intermediate-generation method, the seeds, the mandatory
    null object, the KS, rate-band and tail thresholds REUSED UNCHANGED from
    EXP-DS-001, the u sweep, the required artifacts, the budget, the toy claim ceiling,
    and the PRE-REGISTERED READING RULE TOGETHER WITH ITS ATTAINABILITY ARGUMENT.
    Authorize no run.
  uncertainty_reduced: >-
    Whether the single next action recorded at the BATCH-021 close is frozen as a
    reviewable contract whose reading rule exists before its data AND whose every band
    and branch is demonstrably reachable.
  inputs:
  - ledger/goals/GOAL-ECDLP-001.yaml next_action at the BATCH-021 close
  - ledger/decisions/DEC-20260801-005.yaml
  - ledger/evidence/EV-DS-004.yaml
  - ledger/hypotheses/H-DS-001.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-021/reviews/TASK-20260801-008/red_team_report.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-021/reviews/TASK-20260801-007/validation_report.yaml
  - experiments/EXP-DS-001/specification.v2.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-021/dispatch_queue.json
  - docs/inventor-protocol.md
  - docs/target-result-profile.md
  - docs/claims-and-verification.md
  constraints:
  - >-
    NEW EXP ID IS MANDATORY. This may not be a control on EXP-DS-001, because it needs
    summation-polynomial arithmetic that CTRL-RT047-MATCHED-NULL.budget.new_dependencies
    forbids in that lane.
  - >-
    Do not read-modify, edit or stage ANY file under experiments/EXP-DS-001/, including
    specifications, controls, amendments, drivers, runs and results.
  - >-
    Do not alter H-DS-001, H-IC-001 or H-STR-002. Do not re-score EV-DS-001, EV-DS-002,
    EV-DS-003 or EV-DS-004.
  - >-
    REUSE the EXP-DS-001 KS, rate-band and tail thresholds VERBATIM. Do not redraft,
    relax or tighten them.
  - >-
    Sample at least 10^5 genuine half-arity Semaev partial-map intermediates per set at
    bits in {16, 20} with m = 4, recording the largest prime factor and the
    B-smoothness indicator of each.
  - >-
    The mandatory null object is the IDENTICAL measurement on uniform random integers
    of matched range, through a pipeline in which no code path differs except the
    source of the integers.
  - >-
    Sweep u over at least [2, 6] so that the required u^(-u(1+o(1))) decay is testable
    and a flat smooth fraction is recognizable as the artifact tell.
  - >-
    FREEZE THE READING RULE BEFORE THE RUN AND FREEZE AN ATTAINABILITY ARGUMENT
    ALONGSIDE IT - for every band and every branch, a concrete demonstration that some
    achievable measurement lands there given the sampling design and the frozen
    thresholds. This is the BATCH-021 lesson (RT048-B2) and it is binding.
  - >-
    CHECK THAT EVERY DECISION VARIABLE CAN ACTUALLY VARY WITH THE THING IT IS SUPPOSED
    TO MEASURE, and state that check in the contract. EV-DS-004 N-2 and RT048-B1
    recorded that the previous lane's charged-unit proxy was a closed form in the
    protocol's own matched parameters - a constant 40 units per enumeration with the
    object-free expectation 2/129 - so the object cancelled.
  - >-
    EXPRESSLY FORBID IN THE CONTRACT the anti-pattern of setting smoothness_abort = true
    on the existing EXP-DS-001 arms and calling the mechanism exercised. That tests a
    stand-in and produces a false ledger tick.
  - >-
    No search arms, no timing decision variable, no cost identity, no R. This is a
    distributional measurement, not a cost measurement.
  - >-
    Toy claim ceiling. Forbid S1_met, support, asymptotic promotion and
    reject_scoped-as-impossibility throughout. All four promotion gates G1-G4 stay OPEN.
  - Rule explicitly on manifest.yaml versus manifest.json for the new experiment and record the reason.
  - Carry the two unfiled defects into the batch record as declared open items.
  - CREATE NO RUN. Authorize nothing; TASK-20260801-013 is the approval gate.
  - MAKE NO COMMIT; TASK-20260801-011 archives.
  - Leave FAEST and XEDN alone.
  - >-
    Every YAML and JSON file written must parse; prose containing a colon-space inside
    a block-sequence item must be a folded block scalar or quoted (CORR-20260801-002).
  deliverables:
  - experiments/EXP-SMTH-001/specification.yaml
  - ledger/hypotheses/H-SMTH-001.yaml
  - ledger/decisions/DEC-20260801-006.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-022/dispatch_queue.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-022/BATCH-022-OPENING.md
  - ledger/handoffs/TASK-20260801-010.yaml through TASK-20260801-018.yaml
  - ledger/goals/GOAL-ECDLP-001.yaml repoint preserving every existing field and note verbatim
  artifact_paths:
  - experiments/EXP-SMTH-001/specification.yaml
  - ledger/decisions/DEC-20260801-006.yaml
  artifact_paths_note: >-
    The queue, the opening note, the handoffs, the H-SMTH-001 record and the GOAL
    repoint are control-plane artifacts committed outside any archive declared set per
    the queue's control_plane_batch022_open_note and hypothesis_record_ownership_note,
    so they are deliberately not in artifact_paths. Only the two archivable records
    above are claimed by TASK-20260801-011. H-SMTH-001 is owned for archival purposes
    by TASK-20260801-018 because research_dispatch.py permits exactly one owning task
    per path and AGENTS.md section 9a requires the ledger archive to commit the
    hypothesis-status update.
  archived_by: TASK-20260801-011
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 5400
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
  - >-
    Contract written with the sampling procedure, intermediate-generation method,
    seeds, null object, reused frozen thresholds, u sweep, required artifacts, budget
    and toy claim ceiling all fixed; RR-SMTH-1 frozen WITH ATTAIN-RR-SMTH-1 covering
    every band and branch; the decision-variable variation check stated; the
    anti-pattern expressly forbidden; H-SMTH-001 filed at `specified`; DEC-20260801-006
    filed; two declared open items carried; no run authorized; no EXP-DS-001 artifact
    touched.
