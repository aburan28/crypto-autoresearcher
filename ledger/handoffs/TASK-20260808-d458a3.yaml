handoff:
  id: TASK-20260808-d458a3
  recorded_at: '2026-08-07'
  from: coordinator
  to: executor
  authorized_by: DEC-20260808-c2a470
  objective: >-
    Execute the frozen contract experiments/EXP-SSIQ-a85692/specification_v11.yaml
    (version 11, approved_by: coordinator, frozen_at: 2026-08-07) exactly as
    written. This is a floor-straddling truncation sweep at budgets
    [1.1, 1.45] seconds per vertex over the p=2437 delta_E graph, testing
    whether delta_E>=5 convergence begins appearing as budget crosses the
    observed natural-completion floor, with a mandatory host-comparability
    gate evaluated BEFORE any sweep point runs.
  uncertainty_reduced: >-
    Per the specification's own contribution_accounting_v11: (1) the
    measured n_naturally_completed at b=1.45s, informative only above the
    pre-registered threshold of 58 (per P-1/P-2 and G-2b); (2) the
    final-pop overshoot distribution over the b=1.10s guaranteed-truncated
    arm -- the first direct measurement of that quantity anywhere in this
    lineage; (3) the execution host's own identity and load, which no
    prior run in this lineage (RUN-SSIQ-a85692-a through -j) ever recorded,
    and whose absence is what allowed the PF-26 defect (a Coordinator
    error mistaking orchestration-host figures for execution-host
    measurements) to survive two review rounds undetected; (4) the two
    pre-registered controls (the b=1.10s arm, expected exactly 0 natural
    completions; the naturally-completed-vertex equality cross-check,
    informative only on failure).
  inputs:
    - experiments/EXP-SSIQ-a85692/specification_v11.yaml
    - experiments/EXP-SSIQ-a85692/specification_v10.yaml (frozen predecessor, for any reused function signatures)
    - experiments/EXP-SSIQ-a85692/implementation/ (the v9/v10 modules this contract requires you to import unchanged, per amendment_scope)
    - ledger/hypotheses/H-SSIQ-36e970.yaml
    - ledger/decisions/DEC-20260808-c2a470.yaml (the freeze decision, including the round1-4 pre-freeze review chain it summarizes)
    - coordination/goals/GOAL-SSIQ-001/batches/BATCH-014/reviews/ (all four pre-freeze reports, for full context on why every gate/threshold/label in the frozen contract reads the way it does)
    - experiments/EXP-SSIQ-a85692/runs/RUN-SSIQ-a85692-h/ (the archived reference run every prediction in this contract is derived from)
  constraints:
    - >-
      Do not edit specification_v11.yaml. It is frozen; any change requires
      a new versioned protocol_amendment through the Coordinator, never a
      run-time edit.
    - >-
      HARD REQUIREMENT: evaluate load_defer_gate_v11 (G-0c, then G-0, G-0b,
      G-1, G-2, G-2b, in that exact order) BEFORE any sweep point executes.
      G-0c specifically compares this run's own platform.platform()/
      platform.machine()/os.cpu_count() against RUN-SSIQ-a85692-h's
      archived environment.json (Linux-6.18.5-fc-v18-x86_64-with-glibc2.39,
      cpus_available 4) and DEFERS the entire run if the OS family, ISA, or
      CPU count differ, or if RUN-h's own cpus_available cannot be read.
      DEFERRING ON A HOST MISMATCH IS A FULLY SUCCESSFUL OUTCOME OF THIS
      TASK, NOT A FAILURE -- it is an infrastructure result under AGENTS.md
      rule 3, and it is exactly what this gate exists to produce if this
      execution environment is not a matched host. Do not attempt to work
      around a defer by adjusting the comparison, relaxing the gate, or
      substituting a different reference host. If G-0c or any later branch
      defers, report exactly what deferred and why; do not attempt the
      sweep anyway.
    - >-
      Use the FROZEN LITERAL 1.32242279052734375 for G-2's threshold;
      do NOT evaluate 1.15 * A at runtime (one ULP different, per the
      specification's own explicit warning).
    - >-
      G-2b's threshold is 58 (not 10 -- an earlier draft value the frozen
      contract explicitly corrected and explains why).
    - >-
      Every artifact the specification's required_artifacts and
      round4_verification_plan reference must be produced: the portable
      host capture (platform.platform(), platform.machine(), sys.version,
      os.cpu_count(), os.getloadavg() wrapped against OSError) recorded in
      environment.json at run start AND end, and propagated into both
      execution_report.yaml and truncation_sweep_comparison.json adjacent
      to every n_naturally_completed figure.
    - >-
      This is a single run under maximum_runs: 1 and
      wall_clock_seconds_per_run: 1000. If the run defers at G-0c/G-0/G-0b,
      that single run is still the complete, correct execution of this
      task -- do not retry against a different host or loosen the gate to
      force a sweep to happen.
  artifact_paths:
    - experiments/EXP-SSIQ-a85692/
  archived_by: TASK-20260808-d458a3
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 1000
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
    - >-
      load_defer_gate_v11 evaluated in full, in order, before any sweep
      point runs, with its outcome (defer at G-0c/G-0/G-0b/G-1, or proceed
      stamped/unstamped at G-2/G-2b) recorded explicitly.
    - >-
      If proceeding: both sweep points (b=1.10s, b=1.45s) executed per the
      frozen contract, with n_naturally_completed, the delta_E histogram
      restricted to the naturally-completed subset, the equality
      cross-check, and the final-pop overshoot distribution over the
      b=1.10s arm all reported as raw data.
    - >-
      If deferring: the specific gate branch that fired, the measured
      values that triggered it, and the ~140s calibration cost reported
      as the complete, successful outcome of this task -- not as an
      incomplete or failed run.
    - Every run artifact present per the specification's own artifact list.
    - No interpretive judgment about H-SSIQ-36e970 or delta_E convergence offered -- observations only, per docs/task-lifecycle.md role boundaries.
