  statement_for_W5_quantity: >-
    The Coordinator's statement of the degree-capped closure, which W5 checks against closure.c
    (it is also the statement given to the blind lane; you read it here, the blind lane reads it
    on its own card). Work in the Boolean ring B = F_2[x_1..x_N]/(x_i^2 + x_i): every variable is
    idempotent, a polynomial is a set of square-free monomials, a monomial is a subset of {1..N}, the
    product of two monomials is their union. The generators are the M polynomials of the system as
    written, no field equation added. D = 4. deg f = the largest size of a monomial of f. ORDER: size
    first; among monomials of equal size, m is LARGER than m' iff the LARGEST variable index in the
    symmetric difference of m and m' belongs to m' (graded reverse lexicographic, x_1 the largest
    variable). LM(f) = the largest monomial of f. CLOSURE W_4 = the smallest F_2-subspace of
    {f in B : deg f <= 4} that contains every generator and, for every f in W and every square-free
    monomial mu with 1 <= |mu| <= 4 - deg f, contains mu*f (computed in B). The budget uses deg f,
    not the degree of the product. N_std = the number of square-free monomials of all sizes 0..N
    containing no member of LM(W) as a subset. Verdict: sufficient iff N_std = |V|; insufficient iff
    N_std > |V|; impossible iff N_std < |V|. The Coordinator derived the ORDER and the BUDGET from the
    column layout (descending size blocks, Gosper enumeration ascending within a block, leading
    monomial = first nonzero column) and the loops of closure.c, not from a published definition.
    Whether the statement equals the code is joint W5 (1).

