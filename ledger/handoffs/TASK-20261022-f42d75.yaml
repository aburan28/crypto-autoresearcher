    - >-
      LA-11 Stage exactly the seventeen expected paths, one by one. git add -A,
      git add . and directory adds are forbidden. Generated indexes
      (knowledge/INDEX.md, ledger/.index/, dispatch plans) are rebuilt if
      needed and never staged (AGENTS.md "Concurrency").
    - >-
      LA-12 Run tools/validate_ledger.py, tools/build_knowledge_index.py
