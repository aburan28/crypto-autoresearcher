handoff:
  id: TASK-20260824-873dc9
  from: coordinator
  to: idea-generator
  goal_id: GOAL-DIFFP-84d641
  batch_id: BATCH-f8bf86
  question_id: RQ-DIFFP-a5c483
  objective: >-
    Generate an object-first proposal set for where NEW MD5 and SHA-1
    differential paths could live, under docs/inventor-protocol.md: (1) candidate
    delta-m families for MD5 outside the published lineage, screened on condition
    count and surviving degrees of freedom; (2) disturbance-vector classes for
    SHA-1 outside the published families, exploiting that the DV lives in a
    LINEAR code and so admits enumeration and covering arguments the MD5 side
    does not; (3) step-reduced targets for either primitive that are actually
    reachable inside this campaign's remaining budget, meaning a claimed path
    could be driven to a literal conforming pair and certified rather than
    argued. Separately, produce the acquisition-target list naming the primary
    sources a batch-2 acquisition task must obtain for the census to become
    populatable at all.
  uncertainty_reduced: >-
    Whether a defensible, budget-feasible search target exists at all once the
    published families are declared off-limits as the primary lens -- and, if it
    does, which single proposal has the cheapest discriminating test, so that a
    later batch can be specified by measurement rather than by taste.
  inputs:
    - ledger/questions/RQ-DIFFP-a5c483.yaml -- the tracked object, the targets, and the claim-tier ceiling
    - >-
      ledger/goals/GOAL-DIFFP-84d641.yaml non_duplication -- what belongs to
      GOAL-MD5-001 and GOAL-SHA1-001 and may not be proposed here
    - >-
      experiments/EXP-DIFFP-fe894e/specification.yaml -- the adjudication
      machinery being built in parallel, in particular its
      equivalence_declaration: a proposal that cannot be adjudicated is not yet a
      proposal
    - >-
      docs/inventor-protocol.md sections 1, 2, 5 and 8 -- object-first generation
      with established families declared off-limits as the primary lens, the
      lossy-projection test, Pareto honesty, and the proof_search_map
    - >-
      knowledge/techniques/KN-TECH-066.md -- freedom-degree accounting, message
      modification, local collisions and disturbance vectors, with its own
      statement that this corpus holds no KN-LIT entry for the Wang et al. SHA-1
      work
    - knowledge/techniques/KN-TECH-080.md and knowledge/techniques/KN-TECH-056.md
    - >-
      coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/batch.yaml -- the
      Coordinator's prior recorded at opening, the claim ceiling, and the
      contamination firewall
    - >-
      COORDINATOR'S SURVEY RESULT, offered as a fact about this repository and
      not about the literature: knowledge/literature holds exactly one MD5
      collision-path source (KN-LIT-87e00e), whose entry carries no path data and
      points at a quarantined payload this goal may not open, and no SHA-1 entry
      carrying disturbance-vector data.
  constraints:
    - >-
      OBJECT-FIRST, AND THE PUBLISHED FAMILIES ARE OFF-LIMITS AS THE PRIMARY
      LENS. Name them, declare them off-limits, and score every candidate on
      whether it is genuinely new rather than a repackaging arriving in new
      notation.
    - >-
      APPLY THE LOSSY-PROJECTION TEST to every proposed tracked object before
      proposing an experiment for it: a projection that loses nothing is a change
      of coordinates, not a new object.
    - >-
      EVERY PROPOSAL CARRIES a minimal discriminating test runnable inside 300 s,
      an explicit falsification criterion, `dominated_by` (null ONLY after
      checking every row of the frontier across time, memory and data; an
      unchecked null is a fabrication under AGENTS.md rule 5), and a QUANTITATIVE
      `sota_delta` -- "faster" is not a value.
    - >-
      EVERY PROPOSAL CARRIES a proof_search_map or an explicit
      not_applicable_reason (templates/research-records.md; KN-TECH-080).
    - >-
      NOVELTY IS `unverified` BY DEFAULT and that is the honest answer. A
      `recalled` reference may never support novelty_status `known` or
      `adaptation`. Mark what you actually opened `retrieved`.
    - >-
      NOTHING YOU PRODUCE ENTERS THE CENSUS. The census is
      TASK-20260824-c6625a's and is built only from committed repository sources.
      Your web reads feed the acquisition-target list.
    - >-
      BCP-1 QUARANTINES CONTENT, NOT A FILE PATH, AND THEREFORE COVERS THE
      NETWORK. READ THIS BEFORE YOU FETCH ANYTHING. You are the only batch-1 task
      holding web_search, network acquisition IS reachable from this environment
      (the driving session measured HTTP 200 for eprint.iacr.org/2004/199,
      shattered.io and raw.githubusercontent.com/cr-marcstevens/hashclash), and
      fetching eprint 2004/199 would hand you the Wang MD5 characteristic exactly
      as completely as opening the quarantined file -- contaminating
      GOAL-MD5-001's blind-rediscovery criterion identically, while your receipt
      would read as ordinary acquisition. THAT IS THE TRAP AND IT IS EASY TO WALK
      INTO IN GOOD FAITH. Binding tiers, from AMD-20260824-DIFFP-ACQ-1
      (authorised by DEC-20260824-4f74cd): TIER A -- the Wang characteristic
      (eprint 2004/199) and ANY mirror, derivative or reproduction of its path
      data: DO NOT FETCH, by any route, no exception. TIER B -- any other
      published MD5 characteristic with real path or condition data (Stevens
      single-block and chosen-prefix path tables, tunnels, hashclash published
      paths): DO NOT FETCH; these are BLOCKED PENDING A GOAL-MD5-001 DECISION,
      which is a routing decision and NOT a closure. TIER C -- SHA-1 and SHA-0
      disturbance-vector and specification sources, which NO firewall in this
      program covers: FETCHING IS PERMITTED for the purpose of building the
      target list, and bibliographic metadata (title, authors, venue,
      identifiers, abstract) is permitted for Tier A and Tier B sources as long
      as NO path data is retained.
    - >-
      ATTEST PER FETCH, NOT PER SESSION, WHICH SIDE OF THE FIREWALL IT LANDED ON
      (AMD-20260824-DIFFP-ACQ-1 OB-2): the URL, the tier, what was retained, and
      an explicit statement that no Tier-A content was obtained. A fetch without
      its tier attestation is an invalid acquisition record and whatever it
      obtained may not be used.
    - Do not read coordination/goals/GOAL-MD5-001/quarantine/** and attest non-reading.
    - >-
      Do not propose another goal's work: no chosen-prefix cost model and no
      detector-evasion object (GOAL-SHA1-001); no blind-rediscovery calibration
      and no MITM preimage ceiling work (GOAL-MD5-001); no full-primitive
      collision attempt.
    - >-
      DO NOT DECLINE TO GENERATE ON SATURATION GROUNDS. Premature closure is a
      failure mode symmetric with overclaiming; a lane you conclude is dead needs
      a named obstruction, an argument and forward guidance, and a count of
      screened-and-rejected candidates is a fatigue report whose honest status is
      `unverified`.
    - >-
      Attempt search_knowledge before any assertion about what has or has not
      been tried and record queries and outcomes verbatim. The index is derived
      and may be empty; if it answers nothing, that is a fact about the index and
      licenses no inference.
    - >-
      No fabricated commands, outputs, timings, statistics, citations or runs.
      Never Amazon Bedrock in any runtime, backend, endpoint, fallback or probe.
  deliverables:
    - >-
      proposal-set.yaml -- four to eight proposals, each with class, claim,
      mechanism, tracked object, lossy-projection verdict, minimal discriminating
      test with its budget, falsification criterion, dominated_by with its
      frontier check, sota_delta, proof_search_map or not_applicable_reason,
      novelty_status with its screen, and citations each carrying provenance;
      ending with a RANKING and the single cheapest discriminating test across
      the whole set, named explicitly.
    - >-
      acquisition-targets.yaml -- the primary sources a batch-2 acquisition task
      must obtain, each with a stable identifier (eprint number, DOI, or standard
      document number), what specifically is needed from it (a characteristic, a
      disturbance-vector table, a condition set), its provenance level as of this
      task, and A MANDATORY TIER LABEL (A / B / C) per
      AMD-20260824-DIFFP-ACQ-1. Tier-B entries additionally carry status
      `blocked_pending_cross_goal_decision` and the named unblocking route (a
      committed GOAL-MD5-001 coordinator decision). An untiered entry is an
      incomplete entry.
    - >-
      retrieval-log.yaml -- every search_knowledge query and every web fetch,
      verbatim, with its outcome and what was actually opened.
    - >-
      An honest-accounting block per docs/inventor-protocol.md section 5,
      including enumerated closures at the section 4 standard and open
      directions, emitted even if the session concludes it found nothing.
  artifact_paths:
    - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/tasks/TASK-20260824-873dc9/proposal-set.yaml
    - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/tasks/TASK-20260824-873dc9/acquisition-targets.yaml
    - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/tasks/TASK-20260824-873dc9/retrieval-log.yaml
  archived_by: TASK-20260824-be7bbc
  inference:
    policy: research-deep
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 480
    memory_gb: 2
    maximum_runs: 1
  budget_note: >-
    maximum_runs is 1 because the dispatch schema rejects 0; this role has no
    run_commands capability under orchestration/roles.yaml and performs no
    experiment runs.
  completion_gate:
    - >-
      Four to eight proposals, each with a minimal discriminating test executable
      inside 300 s, an explicit falsification criterion, a checked dominated_by,
      and a quantitative sota_delta.
    - Every proposal carries a proof_search_map or an explicit not_applicable_reason.
    - >-
      The established MD5 and SHA-1 path families are named and declared
      off-limits as the primary lens, and every candidate is scored against the
      repackaging risk.
    - >-
      acquisition-targets.yaml names at least three primary sources with stable
      identifiers, states what specifically is needed from each, and carries a
      TIER LABEL (A / B / C) on every entry per AMD-20260824-DIFFP-ACQ-1, with
      Tier-B entries marked `blocked_pending_cross_goal_decision` and their
      unblocking route named.
    - >-
      Every fetch performed carries its per-fetch firewall attestation (URL,
      tier, what was retained, explicit no-Tier-A-content statement), and the
      report states plainly that no Tier-A or Tier-B path data was obtained.
    - >-
      retrieval-log.yaml records every query verbatim, and every citation in
      every artifact carries a provenance value.
    - >-
      The quarantine non-reading attestation is present, and no proposal requires
      reading the quarantined payload.
  return_format: >-
    Paths written, the ranked proposal list with the single cheapest
    discriminating test named, and anything you could not do with the reason.
  review_plan: null
  amendment_note: >-
    THIS HANDOFF WAS AMENDED ON 2026-08-24, BEFORE DISPATCH AND BEFORE ANY
    OBSERVATION, by AMD-20260824-DIFFP-ACQ-1 OB-3 (authorised by
    DEC-20260824-4f74cd). The additions are RESTRICTION-ONLY -- the three
    firewall-tier constraints, the per-fetch attestation obligation, and the
    mandatory tier label on every acquisition target. Budget, deliverables set,
    objective, uncertainty_reduced, claim ceiling and inference block are
    UNCHANGED. The amendment exists because this task is the only batch-1 task
    holding web_search and its original constraints named only the quarantine
    PATH, which would not have stopped a good-faith agent from fetching the same
    content by URL.
  no_ledger_idea_record_note: >-
    THIS TASK FILES NO LEDGER IDEA-* RECORD. No IDEA identifier was pre-allocated
    for this batch, this role cannot run tools/allocate_id.py, and inventing an
    id would collide by construction (AGENTS.md rule 14). Minting IDEA-* ids for
    the proposals the Coordinator ranks is deferred to a later coordinator task
    with real ids.
