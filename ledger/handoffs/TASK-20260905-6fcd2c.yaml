handoff:
  id: TASK-20260905-6fcd2c
  from: coordinator
  to: coordinator
  goal_id: GOAL-SSI-001
  batch_id: BATCH-752ef2
  task_card: coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/tasks/TASK-20260905-6fcd2c/task_card.yaml
  objective: >-
    Run alone and snapshot exactly the ten declared producer artifacts of
    TASK-20260905-28c89d and TASK-20260905-a210bd, plus this receipt, in ONE
    commit, before the independent reviewer reads them - so that the review
    attacks a bit-identical, immutably bound package and a later disagreement
    between reviewer and producer localizes to a claim rather than to a question
    about what the package said. Then verify mechanically that the tree handed to
    the reviewer states none of this batch's protected values in any reachable
    commit message.
  uncertainty_reduced: >-
    Whether both producer packages are bound to an immutable, exact-path archive
    whose content hashes verify independently, and whether the tree the blind
    half of the review will run in is clean of the one disclosure channel no
    read-scope rule can see.
  inputs:
    - The six declared artifacts under BATCH-752ef2/tasks/TASK-20260905-28c89d/
    - The four declared artifacts under BATCH-752ef2/tasks/TASK-20260905-a210bd/
    - coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/batch.yaml, including blind_phase_hygiene.protected_sha256
  constraints:
    - Run alone; both producers must have terminal receipts before this starts.
    - Stage exactly the eleven declared paths by exact pathspec, in one commit. Never `git add -A`, never stage a directory, never stage a frozen path, never stage a control-plane file.
    - The commit message states record identifiers and locators only - no protected value, no verdict, no characterization of what either package concluded. A commit message cannot be reverted (CORR-20260905-547849).
    - After committing, run `python3 tools/check_review_independence.py --blind-history HEAD --protected-from coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/batch.yaml` and record its verbatim output. A FAIL blocks the reviewer until it can be given a clean tree and never licenses rewriting history; an UNCHECKABLE result is recorded as UNCHECKABLE, not as a pass, and blocks the reviewer's blind phase equally.
    - Do not edit, stage, move or execute anything under experiments/ or inputs/, and write no ledger or scientific record.
    - Never reconstruct, estimate or guess a commit SHA, a parent SHA, or a path hash.
    - Fetch origin/main before committing and MERGE it into the working branch - never rebase - recording the base commit and merge outcome in the receipt. A conflict inside an immutable record is not resolved by picking a side; stop and report.
    - Push the branch and open or refresh the PR against main naming TASK-20260905-28c89d, TASK-20260905-a210bd and BATCH-752ef2.
    - No independent reviewer starts until this receipt is accepted by the post-commit verifier and the blind-history check is recorded.
    - Do not write a correction, note or commentary that affirms or characterizes any reviewed verdict (DEC-20260904-166ab5 PD-1).
    - If a producer stopped early, snapshot the package exactly as it is; an honest stop, an honest not_retrievable and an honest not_reproduced are archived like a complete package. If a producer wrote fewer than its declared artifacts, do not invent, complete or stub them: report the shortfall and return to the Coordinator.
    - Change no status, approve nothing, and make no interpretation of either package's contents.
    - Never select a provider, backend, endpoint or model identifier containing Bedrock, case-insensitively.
  deliverables:
    - snapshot_commit_receipt.json
  artifact_paths:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/archives/TASK-20260905-6fcd2c/snapshot_commit_receipt.json
  expected_commit_path_set_note: >-
    ELEVEN PATHS. tools/research_dispatch.py computes the expected set as this
    archive task's own artifact_paths UNION every source task's artifact_paths,
    requires the commit to change exactly that set with no duplicates, and
    requires path_sha256 to cover the whole union on a completed archive. The
    enumeration is on the task card under expected_commit_path_set. A gate stated
    more narrowly than this - "exactly the N declared paths" - is what got the
    previous batch's archive rejected.
  archived_by: TASK-20260905-6fcd2c
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 900
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
    - The snapshot commit changes exactly the eleven expected paths - this task's artifact_paths UNION both source tasks' artifact_paths - with no duplicates and nothing else, and path_sha256 covers all eleven.
    - No path under experiments/ or inputs/ appears in the commit, and no control-plane file of this batch appears in it.
    - The commit message names TASK-20260905-28c89d, TASK-20260905-a210bd, TASK-20260905-6fcd2c, GOAL-SSI-001 and BATCH-752ef2, and states no protected value, no verdict, and no characterization of either package's conclusions.
    - The receipt records only commit information and hashes obtained from Git, with the fetched origin/main base commit and the merge outcome.
    - The blind-history check was run against the post-commit ref and its ref, commit count and verbatim output are in the receipt; an UNCHECKABLE result is recorded as UNCHECKABLE and not as a pass.
    - The branch is pushed and a PR against main names the two producer tasks and BATCH-752ef2.
    - No ledger or scientific record is written, no status is changed, and no verdict is affirmed or characterized anywhere.
  return_format: >-
    A short report naming the commit sha, the parent, the eleven-path change set
    as verified, the origin/main base and merge outcome, the PR, and the verbatim
    blind-history result.
  review_plan: null
  recorded_by: coordinator
  recorded_at: '2026-09-05'
