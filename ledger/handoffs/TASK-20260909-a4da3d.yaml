handoff:
  id: TASK-20260909-a4da3d
  from: coordinator
  to: executor
  objective: >
    Implement and execute the approved frozen contract
    EXP-ECRANK-8156f9 v1 (hypothesis H-ECRANK-ef097f) exactly as
    written: R1 regression and admission FIRST (per-class match on the
    8 committed control classes, subgroup counts exactly 11,811 each,
    best totals exactly 20 and 8 with the committed coset among the
    achievers, both C7 synthetic known-answer controls; any mismatch
    stops the experiment as invalid), then R2 primary measurement on
    the frozen 32 bases x 127 classes at 30 s alarm with the full
    11,811 + 11,811 coset enumeration per base and the P1-P4 metrics,
    best-coset certificates through the committed independent verifier,
    then R3 censoring arm (320 descents at 240 s on the frozen 10-class
    subsample), then R4 fresh-process replay of every R2 statistic.
    Record observations only; interpret nothing.
  inputs:
  - experiments/EXP-ECRANK-8156f9/specification.yaml (approved, the authority)
  - ledger/hypotheses/H-ECRANK-ef097f.yaml
  - ledger/decisions/DEC-20260909-9ce59b.yaml
  - ledger/proposals/IDEA-20260829-173a32.yaml
  - experiments/EXP-ECRANK-e1e30e/source/twist_family.py (committed engine, READ)
  - experiments/EXP-ECRANK-e1e30e/source/verify_certificate.py (committed independent verifier, READ)
  - coordination/goals/GOAL-ECRANK-002/batches/BATCH-e0caa5/tasks/TASK-20260822-a7a9e8/highrank_pool.json (READ)
  - coordination/goals/GOAL-ECQ-001/batches/BATCH-7e06d3/tasks/TASK-20260822-81141a/certified_curves.json (READ)
  - experiments/EXP-ECRANK-e1e30e/runs/RUN-ECRANK-e1e30e-001/pool.json (READ)
  - experiments/EXP-ECRANK-e1e30e/certificates/cert_deg8_control.json (READ, regression target)
  constraints:
  - The frozen contract is the only authority; no run is authorized outside it.
  - NO network. PARI (cypari) is permitted ONLY as the committed descent engine for finding points; points are never trusted from PARI and every point entering a total is re-verified by the committed independent pure-Python verifier.
  - No Magma, no adaptive alarm, no support widening, no base re-selection, no coset space beyond the frozen enumeration.
  - timed_out contributes zero, is ledgered as timed_out, and is never rank 0; a timeout is an infrastructure outcome, never evidence (core rule 3).
  - R1 runs first and is a stop condition: on any mismatch the experiment stops invalid and is reported as an instrument failure.
  - NO early stop on a prediction mismatch; the runs complete so every outcome class and the censoring data are recorded.
  - The mask-0 (d = 1) entry in R2 is the committed base certificate, never a fresh descent.
  deliverables:
  - All 4 enumerated runs with the nested run: record schema, command.txt, environment.json, and the full required_artifacts list of the specification.
  - execution-report.yaml (observations only, no interpretation).
  artifact_paths:
  - experiments/EXP-ECRANK-8156f9/runs/
  - experiments/EXP-ECRANK-8156f9/execution-report.yaml
  - experiments/EXP-ECRANK-8156f9/certificates/
  write_scope:
  - experiments/EXP-ECRANK-8156f9/runs/
  - experiments/EXP-ECRANK-8156f9/execution-report.yaml
  - experiments/EXP-ECRANK-8156f9/certificates/
  archived_by: null
  archived_by_note: >
    The Coordinator snapshot-archive task for the run package is
    created after execution, before any independent review, per the
    durable-commit protocol; this field is bound there.
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 240000
    wall_clock_note: "per-run ceilings from the frozen contract: R1 7200, R2 130000, R3 90000, R4 3600 (serial worst case; intra-run parallelism up to 8 workers only shortens wall clock, totals are scheduling-independent by C8)."
    memory_gb: 8
    maximum_runs: 4
    maximum_workers: 8
    descent_ceiling: 4512
  completion_gate:
  - All 4 enumerated runs finalized with the nested run: record schema and every required artifact of the specification.
  - R1 regression passed exactly (or the experiment stopped invalid and reported as such).
  - validate_ledger.py adds no new violations relative to the branch base (the 67 inherited EXP-ECDLP-e962f6 manifest errors on origin/main b3b7a9e264 are NOT this task's and must not be fixed here).
  - The snapshot archive commits the full run package before any independent review.
  review_plan: null
  review_plan_note: >
    This handoff opens execution, not a claim-changing review round.
    The independent review round (frozen review plan with the
    Coordinator prior recorded first, owned joints, blind
    re-derivation of the load-bearing quantities, validator, red team)
    is composed as a separate later batch after the snapshot archive,
    matching the program pattern; only that round can move
    H-ECRANK-ef097f.
  batch_note: >
