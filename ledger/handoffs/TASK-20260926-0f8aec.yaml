  constraints:
    - id: RV-1
      text: >-
        READ ONLY THE COMMITTED PACKAGE, at or before the TASK-20260926-58d32c
        archive commit, from a dedicated worktree at that commit with
        PYTHONDONTWRITEBYTECODE=1. A finding about an uncommitted file is a
        finding no reviewer can reproduce.
    - id: RV-2
      text: >-
        DO NOT READ ANY SIBLING REVIEWER'S DIRECTORY. Blindness is mutual in
        this round and is lifted only for TASK-20260926-59169c. Your
        attestation declares what you read.
    - id: RV-3
      text: >-
        BUILD, DO NOT ONLY READ. J2 requires your own short replay of the
        N-CONV stream on slots 0..9 and of N-CONVL on slots 0..4 from the
        specification text (not by importing draws.py), a full sweep of the
        kept-part and S_L checks over every N-CONV and N-CONVL system, and your
        own union support. J3 requires a literal, slow M_4 rank and W_4 of your
        own run beside the archived records on 3 systems (one N-CONV
        unsatisfiable, one S3-U62 at the same slot, one N-CONV satisfiable
        control), a by-hand rc_b substitution on one N-CONV system, and a
        by-hand replay of one iteration-1 wdag. J5 requires your own exact
        aggregation over closures.jsonl.gz, certificates.jsonl.gz and
        certificate-verification.json. You may import impl/ modules and the
        engine to BUILD THE SAME SYSTEM for a bit-level comparison. You may
        NOT run analysis.py, stats.py or report.py to produce the numbers you
        check.
    - id: RV-4
      text: >-
        J2 AND J3 BEFORE J5 AND J6. Write J2's and J3's sections and verdicts
        before you aggregate any metric, so that a recomputed verdict cannot
        steer how hard you audit construction and closures. Record the order in
        the report.
    - id: RV-5
      text: >-
        REPORT ON J2-J6 ONLY. You cannot see J1 or J7-J12 by construction; a
        whole-claim verdict from you would be an opinion formed from a
        fraction of the evidence. The Coordinator composes the round.
    - id: RV-6
      text: >-
        AN INSTRUMENT DEFECT IS NOT A MATHEMATICAL RESULT. If J2, J3 or J4
        breaks, that is a statement about the measurement, never evidence for
        or against H-CERTBIN-be6cbd, E-TENSOR or E-LINEAR (INV-10). Say so in
        terms.
    - id: RV-7
      text: >-
        ZERO TRIALS. Verification computations permitted: the J2 replays and
        sweeps, the J3 constructions on at most 20 archived systems, the J4
        checks and the J5/J6 aggregation. They run under your write scope, get
        no RUN-id and are declared command by command. You re-run no phase of
        the driver and no C-ENGINE replay. Memory cap 3 GB.
    - id: RV-8
      text: >-
        CITE WITH PROVENANCE. A file you opened is `internal`. A source you
        recall but did not open is `recalled`, a pointer, never support.
    - id: RV-9
      text: >-
        DISCLOSED PRIOR (review-plan PD-R1). The Coordinator's review prior was
        written after it had read the run's report, so concurrence with it is
        weaker evidence than it looks. Attack the joints on their merits.
    - id: RV-10
      text: >-
        FLOOR/CEILING CAVEAT. For every J5 and J6 item, state whether the value
        sits at a floor or ceiling of its range, and therefore whether
        agreement is informative about the implementation.

