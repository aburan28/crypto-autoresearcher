handoff:
  id: TASK-20260801-009
  from: coordinator
  to: coordinator
  objective: >-
    After the Validator and Red Team complete - verify run validity first, then
    file EV-DS-004 for the matched-null package if admissible, apply the FROZEN
    disposition map to classify the result into exactly one of branches D-1
    through D-5, write the decision as DEC-20260801-005 subject to the mandatory
    freshness re-check, transition H-DS-001 only along the branch the map assigns,
    and checkpoint GOAL-ECDLP-001 with exactly one next action.
  uncertainty_reduced: >-
    The official status of the matched-null control relative to EV-DS-003 and
    H-DS-001, and the single ranked next action for BATCH-022.
  inputs:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-021/reviews/TASK-20260801-007/validation_report.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-021/reviews/TASK-20260801-008/red_team_report.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-021/archives/TASK-20260801-006/snapshot_commit_receipt.json
  - experiments/EXP-DS-001/controls/CTRL-RT047-MATCHED-NULL.yaml
  constraints:
  - RUN ALONE.
  - >-
    VERIFY VALIDITY BEFORE INTERPRETING - expected arm count, schema-complete
    manifest, seed integrity, raw versus summary agreement, control comparability.
    An invalid or incomplete run set goes back to the Executor with concrete
    defects and is not evidence.
  - >-
    APPLY THE FROZEN DISPOSITION MAP AS WRITTEN. Do not amend it, do not add a
    branch, and do not read the number into a branch it does not satisfy. Quote
    the branch condition and the observed two-proxy pair in the decision.
  - >-
    If any D-5 guard fired, the map is SUSPENDED and the decision is inconclusive
    on the instrument - never a mathematical result.
  - >-
    Under branch D-1, the decision is weaken with the win reattributed to generic
    meet-in-the-middle, the refutation artifact archived in or before this same
    commit, and replication plus the RT047-CTRL-2 B-sweep scheduled.
    reject_scoped-as-impossibility is forbidden.
  - >-
    Under branch D-2, the decision is replicate; H-DS-001 stays analyzed; no
    support and no S1_met.
  - >-
    BEFORE WRITING THE DECISION, re-list ledger/decisions and confirm
    DEC-20260801-005 is free in the CURRENT tree including anything merged from
    origin/main. If occupied, renumber OUR record and never the other party's,
    and file a queue amendment against the declared set, artifact_paths and
    write_scope, with an authoritative mapping in an id_assignment_note.
  - Do not claim crypto-scale or asymptotic support. Toy stays toy. Promotion gates G1-G4 stay OPEN.
  - Do not alter H-IC-001 or H-STR-002. Leave FAEST and XEDN alone.
  - >-
    Fill knowledge_promotion either way, with a concrete not_warranted reason if
    no KN-FIND is promoted.
  - >-
    Preserve every existing field and note in GOAL-ECDLP-001.yaml verbatim;
    supersede by addition and preserve exactly one next action.
  - >-
    Commit message must contain TASK-20260801-009, EV-DS-004, the filed decision
    id, GOAL-ECDLP-001, BATCH-021.
  - Do not push from this task.
  deliverables:
  - ledger/evidence/EV-DS-004.yaml
  - ledger/decisions/DEC-20260801-005.yaml
  - ledger/hypotheses/H-DS-001.yaml
  - ledger/goals/GOAL-ECDLP-001.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-021/archives/TASK-20260801-009/ledger_commit_receipt.json
  artifact_paths:
  - ledger/evidence/EV-DS-004.yaml
  - ledger/decisions/DEC-20260801-005.yaml
  - ledger/hypotheses/H-DS-001.yaml
  - ledger/goals/GOAL-ECDLP-001.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-021/archives/TASK-20260801-009/ledger_commit_receipt.json
  archived_by: TASK-20260801-009
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 3600
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
  - >-
    Post-commit verifier accepts the exact Git diff and file hashes; the decision
    quotes the frozen branch condition it fired and the observed two-proxy pair;
    knowledge_promotion filled; exactly one next action preserved in the goal
    record.
