handoff:
  id: "TASK-20260727-003"
  from: "coordinator"
  to: "executor"
  goal_id: "GOAL-ECDLP-001"
  authorized_by: "DEC-20260727-002"
  objective: >-
    Execute the frozen EXP-FIB-001 protocol exactly as specified and produce the immutable
    run records and execution report it requires. Experiment title: Target-dependent decomposition-difficulty predictor from Semaev fiber geometry:
    Spearman correlation of the decomposition-count invariant with per-target cost,
    calibrated by label-shuffled, exhaustive-truth, and quasirandom-distribution
    controls.
  uncertainty_reduced: >-
    Decide whether a cheap geometric invariant of the Semaev fiber — n_R, the number of
    factor-base decompositions of a target, computed from public data only — predicts
    per-target S_4 decomposition cost at toy scale strongly enough to drive a two-phase
    (IC / rho) target-selection strategy. The decisive metric is the Spearman rank
    correlation rho_s between n_R and measured decomposition cost across 20
  inputs:
    - "experiments/EXP-FIB-001/specification.yaml (status approved, frozen: true; do not change)"
    - "ledger/hypotheses/H-FIB-001.yaml (status approved; do not change)"
    - "ledger/proposals/IDEA-20260726-003.yaml (context; do not change)"
    - "AGENTS.md, docs/task-lifecycle.md, docs/evidence-and-reproducibility.md, docs/claims-and-verification.md"
  constraints:
    - "The protocol is frozen. Any change requires a versioned protocol_amendment under experiments/EXP-FIB-001/amendments/ approved by the Coordinator; runs already executed are never re-scored against an amended criterion."
    - "Every run needs a manifest with exact command, git commit and dirty state, environment, seeds, stdout, stderr, raw results, validity status, timestamps, and resource measurements."
    - "claim_tier is toy: no conclusion above that tier; infrastructure failure is never evidence against the hypothesis (AGENTS.md rule 5)."
    - "Stopping and invalidation rules of the specification are binding; a timeout, crash, or implementation failure is reported as such, never as a result."
  deliverables:
    - "All artifacts enumerated in experiments/EXP-FIB-001/specification.yaml required_artifacts (per-run manifest.yaml, command.txt, environment.json, raw.json, summary.json, stdout.txt, stderr.txt)"
    - "experiments/EXP-FIB-001/execution-report.yaml"
  artifact_paths:
    - "experiments/EXP-FIB-001/specification.yaml"
    - "experiments/EXP-FIB-001/runs/"
    - "experiments/EXP-FIB-001/execution-report.yaml"
  write_scope:
    - "experiments/EXP-FIB-001/"
  archived_by: "TASK-20260727-901"
  inference:
    policy: "executor-implementation"
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 9900
    memory_gb: 4
    maximum_runs: 8
  completion_gate:
    - "Exactly 8 planned runs reach a terminal status (completed_valid, completed_invalid, failed_infrastructure, failed_implementation, resource_exhaustion, cancelled_by_budget)."
    - "Every required artifact in the frozen specification exists and is schema-valid."
    - "Validation checks pass: expected run count, no duplicated or missing seeds, raw/summary agreement, control comparability, no unrecorded protocol deviation."
    - "No claim above claim_tier toy; no status of any ledger record changed by the Executor."
  return_format: "Immutable run records per required_artifacts plus execution-report.yaml."
