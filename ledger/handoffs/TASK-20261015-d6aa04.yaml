      breaking_artifact: Counterexample membership/norm/dimension/root/chain witness or a missing stage.
    - joint: Complete paid phase accounting and mathematical claim ceiling
      assigned_to: TASK-20261015-d6aa04
      attack_plan: Reconcile cold/online counters and inclusive time labels; identify unpriced discovery,failed
