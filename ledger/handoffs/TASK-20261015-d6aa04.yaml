        logarithm without oracle injection.
      breaking_artifact: Exact point/ring/power witness that fails a claimed certificate.
    - joint: Integer lattice preservation,strict HG norm implication,ideal dimension/root extraction and combined
        height/density interface
      assigned_to: TASK-20261015-453494
      attack_plan: Rebuild shift supports and weighted lattice on declared cases; attack arbitrary rational row
        deletion and near-bound norm equality. Use independent multiples of x-y as positive-dimensional control,nonrational
