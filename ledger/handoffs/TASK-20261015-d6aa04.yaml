      breaking_artifact: Independent count table/counterexample point or preserved disagreement.
    - joint: Miller/Weil compatibility and actual number-field element identities,field relations,anchored logs
        and descent normalization
      assigned_to: TASK-20261015-58c998
      attack_plan: Check shifted pairing divisors on zero/pole cases,degree2 covariance and exact image order; multiply
