        work; no tiny observations may imply NFS,prime-field or crypto advantage.
      breaking_artifact: An omitted cost/denominator or unsupported extrapolation with exact affected claim.
    - joint: Blind independent finite-field groups, rational fibers and ordered-tuple counts from statement and
        fixtures
      assigned_to: TASK-20261015-5fd82c
      attack_plan: Rebuild prime and quadratic arithmetic/group enumeration from integer formulas, cross-check DP
