  constraints:
    - id: DC-1
      text: >-
        DRAFT, DO NOT APPROVE. The amendment files carry status draft, with
        approved_by null. No experiment status, hypothesis status or frozen
        specification is edited. The frozen specification of EXP-GFPN-05ff43
        stays byte-identical, and the amendment is additive.
    - id: DC-2
      text: >-
        K7, RE-ANCHOR. Restate the preregistered prediction against the design
        note's actual object:
        - D_S5 ~ 2^20, which is the note's D;
        - D_raw ~ 5! * 2^20 (mixed volume 2^26.9);
        - D_torsion ~ 2^16 = 2^{(m-1)^2} for a genuine quotient, an
          extrapolation to be stated as such.
        State degree-drop thresholds against the MEASURED reference arm on the
        same targets (e.g. D_S5 / D_torsion >= 2^4 at free orbits, with the
        non-freeness gap reported), never against the constant 2^20. Restate
        F1 accordingly. Recompute the band with the inverse success probability
        charged: 1/5! for S_5, and 1/(2^4 5!) plus the factor-base halving for
        the torsion quotient (FHJRV lines 336-348 and 854). List every
        hard-coded constant the rerun's scoring code must replace:
        pdp_common.py lines 219-221; pdp_cell.py lines 451-455, 661, 679-681
        and 708. Keep the frozen-to-amended mapping explicit, so that no
        success criterion changes silently.
    - id: DC-3
      text: >-
        K5, REPLACE ARM (iii). Specify the F_p-rational (Z/2)^{m-1} x| S_m
        quotient on the rescaled factor base: b = lam^2 beta with beta in F_p*
        a non-square, factor base {P : x(P)/lam in F_p}, unknowns
        sigma(u_i + beta/u_i) and w = prod(u_i - beta/u_i), and
        w^2 = prod(t'_i^2 - 4 beta). Also specify lifting and certificates.
        Keep the old norm arm as a labelled negative control, expected
        D = D_S_m at n = m. Include a proof_search_map
        (docs/inventor-protocol.md section 8):
        - baseline fixture: the n = m = 3 square analogue as a BLOCKING
          control, expected D = 16 against 64 for S_3 and for the old arm;
        - identity control: the (sigma, w) system reproduces the rescaled raw
          u-system's solutions orbit by orbit;
        - nearby-object control: a curve without rational 2-torsion must
          refuse;
        - method ceiling;
        - an explicit statement that the construction is the red team's
          derivation and NOT FHJRV's Prop. 13 form, which needs b square.
        Read IDEA-20260920-0490f5 / THM_QUOTIENT_DESCENT1 for which
        translations act, and cite it only as far as its proof is checked.
    - id: DC-4
      text: >-
        K6, COST UNIT. Either specify an instrumented F_{p'}-operation count
        (a counter-instrumented F4, or executed-instruction counts in the F4
        core with a per-shape calibration), or declare F3 undecidable under
        the amendment. Report the nnz and reduction proxies only as a bracket,
        not as a bound. Charge construction identically in every arm,
        including raw. Replace the 150-mul inversion constant with the frozen
        source's figure or a measured one.
    - id: DC-5
      text: >-
        K4, ANCHOR CONTROL. Rule, in the amendment and before anything relies
        on it, on n4_published_timing_anchor. It FAILED its literal [0.5, 2.0]
        band at 0.470 on the fast side. The options are to accept the fast
        side, to re-pin the reference row (JV F4' 5.002 s gives 1.60), or to
        replace wall-clock calibration with system-identity plus
        trace-identity. Re-read the "n=4" label as the (n-1) = 4-point
        decomposition on F_{p^5}. Say which reading is adopted and why. Do not
        pick a band because it passes.
    - id: DC-6
      text: >-
        RECORD DEFECTS, fixed for the rerun:
        - record the in-force memory cap from the child, and the attempt
          counters from outcomes (CORR-20260923-3cbb89);
        - record not_attempted explicitly;
        - split success_rate_by_construction in cmd_raw, and write target_kind
          into every per-run table (CORR-20260923-57177b);
        - record anchor thread counts correctly (CORR-20260923-1e2e67);
        - flag positive-dimensional and degenerate-parametrisation outcomes
          instead of recording them as non-decompositions (red team OOS-6);
        - record a refusal in cmd_build instead of crashing (OOS-2);
        - make degree_ratios_measured like-for-like: same targets, same base
          (OOS-1);
        - state the modeled_note reason heur_dflat_not_applicable as a
          disclosed clarification;
        - discharge random_with_2torsion and random_without_2torsion at every
          ladder prime and for every arm they name;
        - commit the implementation BEFORE any rerun.
    - id: DC-7
      text: >-
        MEMORY ENVELOPE. State the envelope the rerun uses: host cap, threads,
        and any larger host. Scope any not_measured outcome to that envelope.
        Machine protection binds, and a cap is never a research budget.
    - id: DC-8
      text: >-
        EXP-GFPN-659e34 RULING. Decide in writing whether that frozen contract
        needs a companion amendment before /run:
        - its arm (iii) is the same norm construction (CORR-20260923-064d0d;
          by K5 it has the S4 shape and cost, and about 8x fewer
          decompositions on the phi-base);
        - its m = 4 driver has two silent loss paths (object A of
          TASK-20260923-404bf9: 295/324 recovered at p' = 11).
        If a companion amendment is needed, draft it here under the same
        constraints. If the ruling is that arms (i) and (ii) may run as frozen
        with arm (iii) dropped or labelled as a negative control, say so; the
        next action then becomes `/run EXP-GFPN-659e34` under
        TASK-20260921-838c4a.
    - id: DC-9
      text: >-
        NO SECURITY CLAIM. Re-anchored band figures are the design note's
        model. The draft states no security level for EcGFp5 or EcMasFp5. A
        draft reading that would imply a break or a closure is flagged for
        review-breakthrough, not written as a claim.
    - id: DC-10
      text: >-
        PROVENANCE. Cite frozen texts by path and line. A recalled citation is
        a pointer only and carries no step of the amendment.

