  batch_id: BATCH-aeeb17
  question_id: RQ-GGMB-6eaabc
  axis: A4
  axis_title: >-
    Constructive generic-group separation: the weakest oracle that provably escapes simulation, and the exact cost of the boundary

  objective: >-
    Generate proposals that CONSTRUCT generic-group separations rather than
    audit for simulability. Lane L12 (RQ-GGMB-6eaabc) is the campaign's internal
    falsifier: it takes oracles the other lanes invent and shows them GGM-simulable,
    hence closed at exponent 1/2. It has been used destructively and it has worked --
    KN-FIND-b7e091 closed the incidence oracle and the endomorphism-image oracle,
    and that finding is BINDING here and is to be EXTENDED, NEVER REVISITED.

    Invert the posture. Instead of asking "is this oracle simulable?", ask: WHAT IS
    THE WEAKEST ORACLE THAT IS PROVABLY NOT SIMULABLE, and where exactly does the
    boundary run? A tight characterisation, in the style of Shoup's original
    separation, of which curve-structured oracles admit a simulator and which
    provably do not, is a theory result requiring no compute, and it would be the
    most citable object this campaign has produced.

    THE CONCRETE TARGET THAT MATTERS MOST. Resource R1 in the decomposition's
    taxonomy is "x-coordinates as field elements" -- the resource index calculus and
    Semaev's summation polynomials ACTUALLY CONSUME, and the reason the whole
    index-calculus family is not covered by Shoup's bound. Is the
    x-coordinate-as-field-element oracle provably non-simulable? At what cost? Is
    there a tight quantitative statement -- a simulator that works up to some number
    of queries and provably fails beyond it, with the crossover located exactly?
    That crossover, if it can be pinned, is a genuine theorem about why index
    calculus is the only family that escapes, and it would tell the whole program
    where to spend.

    Also in scope: the right MODEL. Shoup's generic group model may simply be the
    wrong abstraction for curve-structured problems, and a better-fitted model --
    one that grants the adversary field structure on x-coordinates but nothing else
    -- may be definable and may have its own tight bound. Defining that model
    correctly and proving one bound in it is a complete deliverable.

  uncertainty_reduced: >-
    Whether GOAL-ENDO-001 has a live path to a publication-grade result, or
    whether its fourteen-lane decomposition has already enumerated the reachable
    mechanisms and the remaining work is closure. The campaign has 146 committed
    proposals, a gating lane paused on instrument calibration at toy scale, and
    a documented convergence toward negatives. This axis tests one specific
    hypothesis about WHERE a live path could still be: that the lane structure
    is indexed by resource applied to a single curve's point group, and that
    objects outside that indexing have not been systematically generated. A
    well-argued finding that this axis is ALSO closed, with the obstruction
    named, reduces the same uncertainty and is an accepted deliverable.

  seed_note: >-
    KN-FIND-b7e091 is BINDING per the goal record's standing constraints: it is
    extended by this lane, not reopened. Any proposal that re-litigates the
    incidence or endomorphism-image closures is inadmissible; a proposal that
    extends the technique to a new oracle class is exactly what is wanted.

