handoff:
  id: TASK-20260812-b1241e
  recorded_at: '2026-08-12'
  goal_id: GOAL-DREG-001
  question_id: RQ-DREG-001
  batch_id: BATCH-006
  role: coordinator
  from: coordinator
  to: coordinator
  kind: snapshot_archive

  objective: >-
    Snapshot the exact BATCH-006 opening control plane (goal head advance,
    batch.yaml, dispatch_queue.json, opener task card) as one isolated
    Coordinator-only archival commit with a verifier-checkable post-commit
    receipt.

  uncertainty_reduced: >-
    Whether the final-batch opening is durable bytes before the ranking task
    runs.

  inputs:
    - TASK-20260812-0dead9 (the opening this snapshot commits)

  constraints:
    - >-
      SC-1 RUN ALONE. No producer, reviewer, or other archival task runs
      concurrently in this worktree.
    - >-
      SC-2 COMMIT A STAGES EXACTLY the four declared source paths (goal.yaml,
      batch.yaml, dispatch_queue.json, task card) AND NOTHING ELSE. COMMIT B
      stages exactly the post-commit receipt at
      coordination/goals/GOAL-DREG-001/batches/BATCH-006/archives/TASK-20260812-b1241e/snapshot-receipt.json.
    - >-
      SC-3 NO FABRICATED VALUES. commit_sha, parent_sha and path_sha256 stay
      null and empty BY FACT inside the committed queue archive block (a
      commit's own SHA may not appear in an artifact within that commit); the
      receipt records observed values read off commit A after it exists.
    - >-
      SC-4 MERGE, NEVER REBASE. Fetch origin/main and merge it in before
      committing; record the base commit checked and the merge outcome in the
      receipt. A conflict inside an immutable record is a STOP.
    - >-
      SC-5 No research inference, no status changes, no attestations, no
      fallback, degradation, or Bedrock.

  deliverables:
    - >-
      A committed snapshot of the four opening paths plus the post-commit
      receipt carrying commit A's observed commit_sha and parent_sha and the
      observed sha256 of each staged path AS COMMITTED.

  artifact_paths:
    - coordination/goals/GOAL-DREG-001/batches/BATCH-006/archives/TASK-20260812-b1241e/snapshot-receipt.json

  archived_by: TASK-20260812-b1241e

  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false

  budget:
    wall_clock_seconds: 900
    memory_gb: 1
    maximum_runs: 1

  completion_gate:
    - >-
      The commit is reachable from HEAD, has the expected parent, and changes
      exactly the four declared paths; re-hashing them at commit A reproduces
      the recorded digests.
    - >-
      The receipt records the origin/main base commit fetched and the merge
      outcome; tools/validate_ledger.py introduces no new violations on the
      merged tree.

  return_format: >-
    A short report naming commit A and its parent, the exact staged path set,
    the base commit and merge outcome, and the receipt path.