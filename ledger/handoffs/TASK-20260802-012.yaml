handoff:
  id: TASK-20260802-012
  from: coordinator
  to: idea-generator
  objective: >-
    Generate a ledger-wide, literature-checked, object-first cohort of three to
    five genuinely distinct generic-prime-field ECDLP mechanisms after the
    focused queue returned no active candidate and BATCH-020 closed invalid.
  uncertainty_reduced: >-
    Whether any mechanism-new, non-dominated, falsifiable generic-prime-field
    ECDLP object survives complete corpus and primary-literature screening.
  inputs:
    - ledger/questions/RQ-ECDLP-002.yaml
    - ledger/goals/GOAL-ECDLP-001.yaml
    - focus/current_plan.json
    - research_ledger.md
    - ledger
    - ideas
    - knowledge
    - docs/inventor-protocol.md
    - docs/target-result-profile.md
  constraints:
    - Scan the complete ledger, ideas corpus, and relevant knowledge before proposing.
    - Use mechanism-level semantic deduplication; renamed known approaches do not survive.
    - Check nearby primary literature; novelty remains unverified unless directly supported.
    - Start from an exact secret-independent mathematical object and an explicit operation.
    - Preserve generic ordinary prime-field scope and matched Pollard-rho/Shoup boundaries.
    - Every candidate needs controls, falsification, named heuristics, validation, proof decomposition, and full-path time/memory/data accounting.
    - Include dominated_by and quantitative sota_delta after checking the frontier.
    - Use pre-ID handles only. Do not allocate or fabricate canonical IDEA ids.
    - Zero survivors is allowed but must preserve the full pre-ID screen, named obstructions, and forward guidance; fatigue is not closure.
    - Exclude further BATCH-020 instrument maintenance unless it dominates exponent-targeting objects on information gain.
    - MAKE NO COMMIT and do not assign work to an Executor.
  deliverables:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-026/tasks/TASK-20260802-012/idea_cohort.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-026/tasks/TASK-20260802-012/semantic_dedup.md
  artifact_paths:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-026/tasks/TASK-20260802-012/idea_cohort.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-026/tasks/TASK-20260802-012/semantic_dedup.md
  archived_by: TASK-20260802-013
  inference:
    policy: research-deep
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 5400
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
    - Full pre-ID screen is preserved and every survivor is schema-complete under agents/idea-generator.md and the inventor protocol.
