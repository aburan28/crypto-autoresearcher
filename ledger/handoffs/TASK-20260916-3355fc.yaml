  dispatch_preconditions_note: >-
    AGENTS.md, "Dispatch preconditions bind the DISPATCHER, not the agent":
    `objective`, `constraints`, `deliverables` and `completion_gate` bind the
    EXECUTOR; the nine conditions above bind the SESSION DOING THE LAUNCHING
    and must be CHECKED AND SATISFIED BEFORE the launch, not discovered
