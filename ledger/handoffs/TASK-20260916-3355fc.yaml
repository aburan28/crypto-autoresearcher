    - >-
      CHECK THE BUS ON WAKE AND BEFORE REPORTING DONE:
      `python3 tools/agent_bus.py inbox --as executor` (nothing is delivered;
      it is a feed). MSG-20260916-a27f8d is already assessed below. A bus
