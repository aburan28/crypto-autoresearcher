  # -------------------------------------------------------------------
  # COMPLETION GATE
  # -------------------------------------------------------------------
  completion_gate:
    - experiments/EXP-ICPERF-2f2e40/code/ exists, is non-empty, and CODE_SHA256.json records a sha256 for every file in it.
    - >-
      READ_DECLARATION.json exists, lists every path read, and reports
      `forbidden_paths_read` explicitly. If that list is NONEMPTY the task is
      COMPLETE AND THE RUN IS INVALID under the contract's invalidation rule --
      report it as such; an honest invalid run is a completed task, and the
      Coordinator, not the executor, decides what follows.
    - READ_DECLARATION.json records `convention_derived_from` and `convention_frozen_before_baseline_read`, and carries the dispatcher's DP-7 freshness attestation.
    - Exactly one run directory exists under experiments/EXP-ICPERF-2f2e40/runs/, named exactly RUN-ICPERF-36a173 (pre-minted; do not mint another).
    - >-
      manifest.yaml is schema-complete and carries: code.commit; the inference
      block (requested_policy, resolved model id, model_verified,
      reasoning_effort, fallback_used, degraded_requirements); the per-cell
      modulus with its bit pattern and its independent irreducibility check;
      the TWO distinct WDSat build hashes (default and __FIND_ALL_SOLUTIONS__)
      with their config_used.json; the measured ENTRY_BYTES used by AR-1; every
      seed; and the input commit plus per-file sha256 for the eight C-RECON /
      evidence artifacts and UPSTREAM_SHA256SUMS.txt.
    - results.jsonl is present and parsable, and summary.json agrees with it row for row -- no summary value that cannot be recomputed from the raw rows.
    - The upstream hash-check against UPSTREAM_SHA256SUMS.txt is recorded and passed (or the run stopped at that stopping rule and says so).
    - >-
      recon/ reports EVERY count C-RECON lists, with BOTH values on every line:
      60/60 status agreement; 30/30 shipped S certificates present as preimages
      of their own targets; 67 roots split 45 all-E / 1 all-twist / 21 mixed;
      all 21 mixed in n15l5-8-S; and per-cell |Fb_0|, |Fb_1| recomputed from the
      .in files and the curve. An exact, localised DISAGREEMENT satisfies this
      gate; a missing comparison does not.
    - C-SUM holds EXACTLY for every built (cell, side): sum of table counts = C(|Fb_s| + 2, 3). A table where it does not invalidates the run.
    - controls/ carries C-KF-BITFLIP (0 of 30), C-KF-CONVENTION (0 of 30) and C-NULL-CURVE (0 of 30), each with its measured count beside its declared chance rate.
    - root_classes.json gives every one of the 67 roots a class AND its deciding trace values, with the mixed split reported PER INSTANCE as M1/M2, and the x = 0 two-torsion factor-base point flagged wherever it appears (C-2TORSION).
    - Every candidate new cell is either ADMITTED with a table and a certified sampler, or REFUSED with its MEASURED binding quantity and the binding term named, in admission.json, at (cell, side) granularity for AR-1.
    - >-
      Every emitted certified-S instance carries its generating triple,
      re-verified by GF(2^n) arithmetic INDEPENDENT of the solver, and is SAT
      under both named complete solvers; every emitted certified-U target is
      absent from BOTH side tables and UNSAT under both. Any disagreement
      stopped the sampler for that cell and is reported with the instance.
    - 'Every prediction clause reports `evaluated: true|false` with a reason, every cell-quantified clause reports an explicit `unevaluable: [...]`, and any clause with a nonempty unevaluable list reports `holds: null`.'
    - Every stopping rule that fired, every refused admission, every timeout and every crash is recorded as an INFRASTRUCTURE OUTCOME with its exact cause and is nowhere described as a mathematical result.
    - The task receipt exists at the declared path, names the minted RUN-ID, lists every file written, and states that nothing was committed.
    - No file outside the three declared write_scope subtrees was created or modified, and specification.yaml is byte-identical to its committed state.
  completion_gate_note: >-
    THIS GATE IS SATISFIABLE BY AN INVALID RUN AND BY A STOPPED RUN, AND THAT
    IS DELIBERATE. The task completes when the declared artifacts exist and say
    truthfully what happened. A C-RECON disagreement, a forbidden path honestly
    declared, a watchdog checkpoint or a cell refused by AR-1 all COMPLETE this
    card; what fails it is a missing artifact, an unrecorded outcome, or a
    number that cannot be recomputed from the raw rows.

  return_format: >-
    The minted RUN-ID and the allocator commands with their output; the run
    directory path; which phases finished and which did not; the C-RECON table
    count by count with both values; the per-(cell, side) |Fb_s|, table entry
    count and C-SUM result; the admission verdict and measured binding quantity
    for every candidate cell and side; the four control counts beside their
    declared chance rates; the certified-U/S emission counts per cell and any
    table-versus-solver disagreement; every stopping rule that fired; every
    infrastructure outcome with its cause; the full read declaration summary
    including `forbidden_paths_read`; the resolved model identifier and whether
    it was probe-verified; and the exact list of files written. Report any
    refusal, any scope expansion you were tempted into, and anything in the
    contract you could not satisfy -- do not work around it and do not fill a
    gap with an estimate.

  review_plan: null
