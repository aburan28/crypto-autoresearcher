    binding term stated there (largest single table, bounded by AR-1's
    TABLE_MAX_ENTRIES and its 3 GiB projection, 1 GiB process headroom).
    `wall_clock_seconds: 28800` is an EXPLICITLY JUSTIFIED PROCESS WATCHDOG and
    machine protection, not a research budget: the contract sets
    executor_wall_clock_seconds null as advisory, AND its stopping rules
    already define the behaviour at expiry, so a watchdog is what the contract
    expects rather than an addition to it.
