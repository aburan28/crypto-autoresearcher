  # -------------------------------------------------------------------
  # CONSTRAINTS (bind YOU, the executor)
  # -------------------------------------------------------------------
  constraints:
    - >-
      OBSERVATIONS ONLY. Report values. Do not interpret them, do not say
      whether H-ICPERF-afe62e holds, do not assign evidence strength, do not
      write an evidence record, and do not change any status. The Coordinator
      decides; that separation is what makes your numbers usable.
    - >-
      C-INDEP IS THE FIRST CONSTRAINT AND THE ONE THAT CANNOT BE REPAIRED
      LATER. Obey c_indep_enforcement above in full. Write
      experiments/EXP-ICPERF-2f2e40/code/READ_DECLARATION.json listing EVERY
      path you read for ANY purpose in this session, with
      `forbidden_paths_read: []`, `advised_paths_read: []`,
      `convention_derived_from`, and an explicit
      `convention_frozen_before_baseline_read: true|false`. An honest `true` in
      forbidden_paths_read invalidates the run and is the correct outcome; a
      dishonest `[]` is a core-rule-9 violation and is worse than anything it
      could hide.
    - >-
      RUN C-RECON FIRST, BEFORE ANY NEW CELL IS TOUCHED. The contract's
      stopping rule is explicit: if C-RECON fails on any listed count, STOP
      before any new cell and report WHICH count and BOTH values. A
      disagreement with the committed enumeration localises to one of two named
      implementations and is the most informative outcome available here -- it
      is a result, not a failure, and it is not something to debug away.
    - >-
      EVERY CLAIMED DECOMPOSITION IS RE-VERIFIED WITH ARITHMETIC INDEPENDENT OF
      THE SOLVER. A triple is a decomposition only when your own GF(2^n)
      arithmetic confirms its sum equals +-R. A solver's SAT answer is never
      the certificate; it is a second opinion that must agree with the
      certificate (C-CERT-EMIT). Where the table and a complete solver
      disagree, STOP THE SAMPLER for that cell and report the instance -- do
      not pick a side, do not average, do not drop the row.
    - >-
      A TIMEOUT, CRASH, OOM, WATCHDOG STOP, REFUSED ADMISSION, OR UNFINISHED
      ALL-SOLUTIONS RUN IS AN INFRASTRUCTURE OUTCOME. It is never negative
      mathematical evidence, never evidence that an instance is unsatisfiable,
      and never a completeness failure (AGENTS.md rule 5; contract AR-3 and
      falsification_criterion). Record it as an infrastructure outcome with its
      exact cause and continue where the contract says to continue.
    - >-
      REPORT `evaluated: true|false` WITH A REASON ON EVERY PREDICTION CLAUSE,
      an explicit `unevaluable: [...]` list on every cell-quantified clause,
      and `holds: null` wherever that list is nonempty (contract
      every_clause_reports_evaluated_flag, inherited from EXP-ICPERF-13f001
      CH-5). The defect this repairs is measured: a frozen reduction in this
      goal reported two of six predictions as HOLDING when neither was
      evaluable.
    - >-
      ADMISSION RULES BIND AT (cell, side) FOR AR-1, AT (cell) FOR AR-2, AT
      (cell, build) FOR AR-3, AND THE CHEAP PRE-PASS RUNS BEFORE THE CELL IS
      ENTERED. A refusal is recorded with its MEASURED binding quantity
      (|Fb_s|, C(|Fb_s|+2,3), the projected memory, or the exact AR-2 failure)
      and stops neither the other side nor the other cells. ENTRY_BYTES is
      measured on the (17,6) side-0 table and recorded BEFORE any new cell is
      entered; AR-1's memory term is not evaluable without it.
    - >-
      DO NOT CHANGE A SUCCESS CRITERION, A THRESHOLD, A CONTROL'S PASS
      CONDITION, OR A SEED AFTER SEEING AN OUTCOME. The seeds are fixed by the
      contract (20260916 * 1000 + 100 * n + l per cell; the C-NULL-CURVE b'
      draw at the same rule offset by a recorded constant). Record the exact
      constant you used.
    - >-
      PRESERVE EVERY ANOMALY AND EVERY FAILED ATTEMPT. Unexpected observations
      are recorded, never silently discarded (AGENTS.md rule 8). A discarded
      outlier is the one row a reviewer needed.
    - >-
      NEVER EDIT A COMMITTED RECORD TO ADD A MISSING FIELD. If a schema field
      is missing from something already committed, SUPERSEDE it with a new file
      and register the supersession. CORR-20260916-5166fe records a session
      that edited an immutable epoch-1 manifest to add six schema fields and
      thereby made a completed archive permanently unverifiable.
    - >-
      DO NOT MINT A RUN IDENTIFIER. Use the pre-minted id `RUN-ICPERF-36a173`
      exactly (`python3 tools/allocate_id.py --check RUN-ICPERF-36a173` was
