  title: >-
    Implement the EXP-ICPERF-2f2e40 enumerator, classifier and certified-target
    sampler UNDER C-INDEP in a fresh session, then execute the frozen contract
    once: C-RECON first, the three shipped cells' side-split tables, the D1/D2
    root classes, the admission pre-passes for the three candidate cells, the
    four controls, and the certified-U / certified-S emission

  objective: >-
    Reduce exactly one uncertainty, and no other: whether an INDEPENDENTLY
    WRITTEN exhaustive V^3 enumerator, side classifier and certificate checker
    reproduce the committed point-decomposition ground truth behind
    EV-ICPERF-390707 joint V1 count for count, and what the exact per-(cell,
    side) decomposition tables, D1/D2 root classes and certified-target sampler
    contain at the cells the frozen contract admits. You produce OBSERVATIONS.
    You do not interpret them, do not evaluate the hypothesis, do not compose
    an evidence record, and do not change any status.

  uncertainty_reduced: >-
    The RQ-ICPERF-94c86e point-decomposition column currently has no ground
    truth: every downstream ICPERF certificate would rest on a single
    enumeration written by one agent. This task supplies a second, independent
    enumeration and the exact tables, so a shared implementation error becomes
    detectable rather than inherited. It reduces no uncertainty about any
    curve's security, any exponent, or any solver's speed.

  authority:
