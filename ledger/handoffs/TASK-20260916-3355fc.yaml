    does not require another user budget approval, and is categorically not
    evidence (CLAUDE.md "Research budgets: progress first"; AGENTS.md rule 5).
    On expiry, follow the contract's stopping rule exactly: STOP, KEEP every
    completed table and the partial results.jsonl, RUN THE REDUCTION, and
    record which phases finished and which did not. A checkpointed run is a
    valid partial observation set with an explicit unevaluable list -- never a
    failed experiment and never a negative result.

  resource_posture:
    this_contract_needs_no_quiet_host: >-
      STATED EXPLICITLY RATHER THAN ASSUMED, as the contract's
      `machine_headroom` block requires. Every PRIMARY metric here is a COUNT
      -- table entries, distinct x-coordinates, root classes, agreement counts,
      decomposable fractions, completeness ratios -- and counts are invariant
