      it produces may enter a boundary-table cell or any ratio. The cost of
      that design decision: this run contributes NOTHING to the seconds-valued
      columns of RQ-ICPERF-94c86e, which stay owed to batches that can hold the
      machine quiet.
    but_it_contributes_load_to_someone_else: >-
      THE CONCERN RUNS THE OTHER WAY AND IS THE ONE THAT ACTUALLY BINDS.
      GOAL-ICPERF-e6b6a4's `max_concurrent_basis` requires solver benchmarks to
      run with the machine otherwise quiet (load average below 0.5 on 4 CPUs),
      and BATCH-a33cda holds that requirement. This run drives WDSat and
      CryptoMiniSat thousands of times and builds multi-million-entry tables;
      it would contaminate a concurrent TIMING measurement even though its own
      numbers are immune. Hence DP-6.
    pinning: one core, one worker, 4 GB (contract maximum_workers 1). Do not parallelise across cells.
    goal_concurrency_accounting: >-
      GOAL-ICPERF-e6b6a4 `max_concurrent` is 2. As of 2026-09-16T08:28Z the
      live claims on this goal are: TASK-20260915-abf147 (BATCH-a33cda,
