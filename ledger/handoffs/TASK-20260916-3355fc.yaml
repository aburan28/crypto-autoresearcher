    - >-
      DO NOT COMMIT, STAGE, PUSH, MERGE, REBASE, OR OPEN A PR. Archival commits
      are Coordinator-only and run alone in the worktree (AGENTS.md "Durable
      research commits"). Your deliverables are owned by TASK-20260916-2c4679.
