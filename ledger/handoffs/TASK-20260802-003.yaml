  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/dispatch_queue.json
  - experiments/EXP-LPF-001/specification.yaml
  - experiments/EXP-LPF-001/reading_rule_v2.yaml
  - experiments/EXP-LPF-001/implementation/lpf001_driver.py
