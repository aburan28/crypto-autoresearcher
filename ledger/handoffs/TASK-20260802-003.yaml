  constraints:
  - >-
    EXECUTE NO EXPERIMENTAL RUN AND TOUCH NO INSTANCE OF THE FROZEN SEED FAMILY.
    The wrapper may be SELF-TESTED only on a declared throwaway family at
    bits = 12, which is not a declared cell and not in 90001-90020; the
