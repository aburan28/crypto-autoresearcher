    IMMEDIATE NOT-APPROVED AND AN EVIDENCE-INTEGRITY FAILURE.
  - >-
    DO NOT EDIT experiments/EXP-LPF-001/specification.yaml, reading_rule.yaml,
    reading_rule_v2.yaml or implementation/lpf001_driver.py. THE WRAPPER IMPORTS
    THE DRIVER; IT DOES NOT COPY IT, FORK IT, MONKEY-PATCH IT OR VENDOR IT.
    lpf001_driver.py must still hash to
    786aeb0550d75fa3d0785aefbe50b121a24cacae584a4cadd79902c464722d65 at the end
    of this task and you must report the hash you measure. IF THE FREE RIDER OR
    ANY REPORTED QUANTITY CANNOT BE COMPUTED WITHOUT MODIFYING THE DRIVER, SAY
    SO AND STOP - that is a finding, not a licence to edit.
  - >-
    TRANSCRIBE RR-IVR-1 VERBATIM from DEC-20260801-015 and from
    dispatch_queue.json key reading_rule_rr_ivr_1. You may ADD ONLY the
    numerical constants you derive from the archived calibration and the
    operational detail of how each quantity is computed. YOU MAY NOT ADD, REMOVE
    OR REWORD A CLAUSE, and you may not import any branch, band, cut, strike,
    certified ladder, gamma floor or disposition from RR-LPF-1 or RR-LPF-2.
  - >-
    ANSWER PRE-Q-1 FROM SOURCE - does generate_instance(seed, bits) vary the
    prime p, or only the curve at a p fixed by bits? State the answer in the
    control specification, state in RR-IVR-1 which of the two quantities the
    between-instance sd is, and quote the source lines you read it from.
  - >-
    DECLARE OBJ-REAL-FRESH PRECISELY - 20 distinct instances per cell from
    master seeds 90001 through 90020 at bits 16 and 20, the deterministic
    substitution rule from 90021 upward, the exhaustive i < j enumeration of
    C(512, 2) = 130816 half-tuples, INT-1 at m = 4 and d_half = 2, ENC-B,
    Bfb = 512, and the same frozen Bsm ladders and rungs u in {2, 3, 4, 5} plus
    STAT-KS-DICK.
  - >-
    SPECIFY EVERY ARCHIVED ARRAY. The 20 per-instance p_hat vectors per cell,
    the 20 STAT-KS-DICK values per cell, the 512 per-index smooth rates at every
    instance, cell and powered rung, the permutation-null distribution summary
    at R_PERM = 2000, and the instance registry with 20 primes, 20 curve
    coefficient pairs and 20 factor_base_sha256 values per cell. A STANDARD
    DEVIATION WHOSE UNDERLYING VALUES ARE NOT ARCHIVED IS UNAUDITABLE
    (PERTURB-TAIL-1).
  - >-
    SPECIFY THE FREE RIDER WITH BOTH NULLS. The closed-form
    sqrt(p_bar*(1 - p_bar)/511) comparison AND the permutation null over the
    130816 pair slots at R_PERM = 2000 holding the incidence structure and the
    total smooth count fixed. NEITHER MAY BE REPORTED ALONE. State that the
    permutation null is exact conditionally on the total.
  - >-
    SPECIFY THE BUDGET BEHAVIOUR YOU ACTUALLY IMPLEMENT and do not assert one
    you do not. If you implement a pre-flight projection, say exactly where it
    runs and what it aborts; if you do not, say that. THIS IS THE
    OPEN-BATCH027-A / DEV-079-1 LESSON APPLIED AT ITS FIRST OPPORTUNITY.
  - >-
    STATE THE CLAIM CEILING IN THE CONTRACT ITSELF - toy tier, no crypto-scale
    or asymptotic statement, no `support`, no `replicated`, no hypothesis
    transition, no re-adjudication of BATCH-027, and a variance ratio is
    evidence about the yardstick and never about HEUR-DS-1 in either direction.
  - 'CARRY V1 THROUGH V12, ABS-REL-LPF-1 AND LIMBB-DECL-RR066 INTO THE CONTRACT UNCHANGED, and add W1 through W5 verbatim from the queue.'
  - 'RECORD THE SHA256 OF EACH OF YOUR THREE FROZEN FILES in contract_report.yaml so the freeze is checkable, and state that no file you wrote will be edited after this task.'
  - 'AUTHOR NO LEDGER RECORD, MAKE NO COMMIT, SELECT NO BRANCH, STATE NO DISPOSITION AND MAKE NO APPROVAL DETERMINATION. TASK-20260802-004 archives.'
  - 'Record inference honestly (requested executor-implementation, fallback_used true, model_verified false), and every YAML, JSON and Python file written must parse.'
