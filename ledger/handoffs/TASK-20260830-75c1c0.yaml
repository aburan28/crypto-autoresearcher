handoff:
  id: TASK-20260830-75c1c0
  from: coordinator
  to: executor
  objective: >-
    Execute the FROZEN, coordinator-approved contract EXP-MONO-715694
    exactly as written: a pure combinatorics/statistics power analysis of
    this lane's own census instrument, using exact enumeration for S_4/A_4
    and real, already-archived per-point data for D_4/S_4's actual
    behaviour. Record observations only; render no verdict on
    H-MONO-819f2b.
  uncertainty_reduced: >-
    Whether S=2,000 (this lane's actual Chebotarev-density sample size,
    used by EXP-MONO-a20e48's N3/N5) and exhaustive p^2 enumeration (used
    by N1/N2/N2-twin) give the census enough statistical resolving power
    to distinguish S_4 from a proper transitive subgroup (A_4, primitive;
    D_4, imprimitive) at a stated confidence — and whether the identical-
    group null ever produces a spurious separation.
  inputs:
    - experiments/EXP-MONO-715694/specification.yaml (READ IN FULL)
    - ledger/hypotheses/H-MONO-819f2b.yaml
    - ledger/hypotheses/H-MONO-59f6a6.yaml (context: N1/N3's own construction and results)
    - experiments/EXP-MONO-a20e48/runs/RUN-MONO-a20e48-1/per_base_point_log/N1_k1_exhaustive.jsonl
    - experiments/EXP-MONO-a20e48/runs/RUN-MONO-a20e48-2/per_base_point_log/N1_k1_exhaustive.jsonl
    - experiments/EXP-MONO-a20e48/runs/RUN-MONO-a20e48-1/per_base_point_log/N3_k1.jsonl
    - experiments/EXP-MONO-a20e48/runs/RUN-MONO-a20e48-2/per_base_point_log/N3_k1.jsonl
    - AGENTS.md
  constraints:
    - >-
      Follow experiments/EXP-MONO-715694/specification.yaml EXACTLY; it is
      frozen. Do not modify, re-derive from a different source, or
      "improve" the real-data file paths in `inputs.real_data_sources` —
      read them exactly as declared, treat them as strictly read-only.
    - >-
      Pure Python 3 standard library ONLY (`random`, `math`, `itertools`,
      `json`, `collections`). No numpy, scipy, sympy, or any external
      statistics package. Any forbidden import invalidates the run.
    - >-
      Stage 0 and Stage 0b are HARD GATES: emit the exact S_4/A_4 cycle-
      type tables and the D_4-from-real-data tabulation (both runs) BEFORE
      any Monte Carlo code executes, exactly per the contract's `battery`
      ordering. A gate failure (e.g. a 3-cycle appearing in the real D_4
      data, or the two runs' derived D_4 laws disagreeing) is
      `failed_infrastructure`, escalate per AGENTS.md rule 12, never
      resolved by adjusting the classification logic silently.
    - >-
      The cycle-decomposition of a `perm` 4-tuple is a fixed, mechanical
      operation: trace each point's orbit under the permutation and record
      the multiset of cycle lengths. Implement it directly; do not import
      any group-theory or permutation library.
    - >-
      The LR-test calibration and Monte Carlo search must follow the exact
      procedure in `battery.STAGE2-N-REQUIRED-SEARCH`: threshold calibrated
      from S_4-generated trials at the SAME N being tested (not a fixed
      threshold reused across N), 20,000 trials per side per candidate N,
      doubling-then-bisection search up to search_ceiling_N=100,000.
    - >-
      Report Monte Carlo standard error on every power estimate and the
      bootstrap resampling's own variance, per `observation_requirements`.
    - >-
      No hypothesis, experiment, or goal status change. No relation-rate,
      ECDLP, cost, or exponent claim of any kind, in either direction.
    - >-
      Any timeout, crash, or construction failure is `failed_infrastructure`,
      never negative mathematical evidence (AGENTS.md rule 3).
    - "Exactly 2 runs, seeds 20260830 and 20260831 per the contract's `replication`."
  deliverables:
    - experiments/EXP-MONO-715694/implementation.md
    - experiments/EXP-MONO-715694/implementation/ (source code)
    - experiments/EXP-MONO-715694/runs/RUN-MONO-715694-1/
    - experiments/EXP-MONO-715694/runs/RUN-MONO-715694-2/
    - execution_report.yaml (per docs/evidence-and-reproducibility.md)
  artifact_paths:
    - experiments/EXP-MONO-715694/implementation.md
    - experiments/EXP-MONO-715694/implementation/
    - experiments/EXP-MONO-715694/runs/RUN-MONO-715694-1/
    - experiments/EXP-MONO-715694/runs/RUN-MONO-715694-2/
  archived_by: TASK-20260830-9227b1
  inference:
    policy: executor-implementation
    reasoning_effort: medium
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
    reasoning_effort_basis: >-
      Bound by .claude/agents/executor.md effort medium and
      orchestration/roles.yaml role executor -> default_policy
      executor-implementation -> reasoning_effort medium. Bounded,
      spec-following implementation of an already-fully-designed contract;
      not design or ideation.
  budget:
    wall_clock_seconds: 1800
    memory_gb: 2
    maximum_runs: 2
  completion_gate:
    - "Stage 0 and Stage 0b's exact tables reported before any Stage 1/2 Monte Carlo work."
    - "NULL-1/NULL-2 controls reported."
    - "N_required reported for both pairs with Monte Carlo standard error."
    - "Step 4a bootstrap-vs-simulation agreement reported explicitly."
    - "Step 4b's four real-data classifications reported (N1 x2 runs, N3 x2 runs, both pairwise tests each)."
    - >-
      Run manifests bind git commit, dirty flag, seeds, environment
      (confirming stdlib-only), timing, resources, per
      docs/evidence-and-reproducibility.md, using the NESTED manifest
      schema (run.status/code/environment/inputs/timing/result — see
      experiments/EXP-MONO-a20e48/runs/*/manifest.yaml for the exact
      required structure; a flat manifest will fail ledger validation and
      require correction before archiving).
  return_format: >-
    Executor execution_report.yaml per docs/evidence-and-reproducibility.md:
    Stage 0/0b results, the two N_required figures with error bars, control
    outcomes, Step 4a/4b results, any anomalies. Observations only — no
    verdict on H-MONO-819f2b, no status change.
