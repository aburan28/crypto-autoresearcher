handoff:
  id: TASK-20260810-26d0d5
  recorded_at: '2026-08-10'
  goal_id: GOAL-MD5-001
  question_id: RQ-MDFIVE-6870c1
  batch_id: BATCH-46254b
  task_card: coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/task-cards/TASK-20260810-26d0d5.md
  role: coordinator
  from: coordinator
  to: coordinator
  objective: >-
    Author BCP-1, id BCP-1, the frozen blind-calibration scoring protocol for
    GOAL-MD5-001: the declared-before-run fields, the blind-scoring rule
    separating rediscovery from consumption, the enforceable read-scope firewall
    and quarantine marker, the collision certificate format, the shared charging
    convention, the invalidity conditions, and the recall-versus-search
    null-object control. It is the only product of this batch that later batches
    are priced on, and it must be written to be attacked.
  uncertainty_reduced: >-
    Whether the blindness requirement of RQ-MDFIVE-6870c1 is enforceable at all
    in a repository that is about to import the published collision path, or
    whether it can only ever be asserted. If it can only be asserted, that must
    be recorded as such now - before the acquisition - because after the
    acquisition no evidence can tell the two apart.
  inputs:
    - >-
      RQ-MDFIVE-6870c1 constraints, especially the blindness constraint whose
      text rules that a run consuming the published path is invalid rather than
      a weaker pass
    - >-
      GOAL-MD5-001 completion criteria, whose second criterion names
      GOAL-SHA1-001 and GOAL-RSA-001 as sharing the charging convention
    - >-
      BATCH-46254b batch.yaml contamination_firewall block, which states the
      conflict and the four resolution elements this protocol must implement
    - >-
      docs/claims-and-verification.md certificate discipline and claim-tier
      ceiling
    - >-
      docs/inventor-protocol.md controls-before-belief clause, which is where
      the null-object control comes from
    - >-
      harness/runner.py, to establish what a run manifest can actually record
      and therefore what the firewall can actually check
  constraints:
    - >-
      SC-1 FABRICATE NOTHING. No invented timing, measurement, throughput,
      citation, review verdict, model identifier or commit SHA. A field that is
      not yet knowable stays null and is named as such.
    - >-
      SC-2 CLAIM CEILING. Assert nothing about MD5 - no collision, no preimage,
      no complexity, no method ceiling, no obstruction, and no comparison
      against any published result in either direction.
    - >-
      SC-3 UNVERIFIED FIGURES STAY MARKED. Every figure in RQ-MDFIVE-6870c1
      provenance is web-search excerpt not read in primary text, and none may be
      cited as authority in either direction.
    - >-
      SC-4 A failed, halted or exhausted search is a BUDGET OUTCOME about a
      solver and NEVER evidence about MD5 (AGENTS.md rules 5 and 8).
    - >-
      SC-5 Anything not attempted is named OPEN AND UNATTEMPTED and is never
      recorded as tried, screened or negative.
    - >-
      SC-6 Change no hypothesis, question, experiment or goal status; approve no
      experiment; promote no knowledge; edit no committed record; record no
      attestation and no review verdict.
    - >-
      SC-7 Halt at the declared wall_clock_seconds and report the halt
      truthfully as infrastructure signal, naming the dropped work as scope
      rather than as an answer.
    - >-
      SC-8 Never select, configure, probe, contact or use Amazon Bedrock
      (AGENTS.md rule 16).
    - >-
      BCP-1 MUST FIX, BEFORE ANY MEASUREMENT: (a) the declared-before-run fields
      - encoding, solver identity and version, seed, wall-clock ceiling - and
      the rule that a run altering any of them after starting is invalid; (b)
      the blind-scoring rule, stating exactly what counts as REDISCOVERY and
      what counts as CONSUMPTION; (c) the collision certificate format as a
      literal colliding pair re-verified by the second pinned implementation,
      the verification performed by the run wrapper and not by the attack code;
      (d) the charging convention for wall clock, peak memory and
      near-collision-block counts, including whether wall clock is
      authoring-inclusive session elapsed or compute-only, which is currently
      undefined and is the reason the campaign budget's adequacy cannot be
      adjudicated; (e) the rule that a failed search is a budget outcome about a
      solver and never evidence about MD5.
    - >-
      THE FIREWALL IS THE POINT OF THIS TASK AND MUST BE AUDITABLE RATHER THAN
      ASSERTED. Specify: which artifact paths a calibration agent may and may not
      read; the quarantine path and marker for the published collision path
      payload; the pre-registered expected-answer DIGEST, which scores a result
      without carrying one; and the CLOSED, HASH-MANIFESTED INPUT SET given to
      the solver, whose complete sha256 manifest is recorded in the run
      manifest. State plainly that read_scope alone is a declaration no runtime
      here enforces for reads, and that the input manifest is the checkable
      element.
    - >-
      STATE THE RESIDUAL RISK RATHER THAN ENGINEERING AROUND IT. Model prior
      knowledge is irreducible: published MD5 paths are in the training data of
      any model this harness resolves, and no file-system mechanism reaches the
      model's parameters. Record the two consequences - that the calibration is
      evidentially asymmetric, a failure being clean and a success confounded,
      and that the only discriminator available is a null-object control running
      the identical instrument at the identical budget against a shape-matched
      MD5 variant with permuted round constants or message schedule, where
      recall is worthless and structure is nearly preserved.
    - >-
      THE CHARGING CONVENTION IS AUTHORED IN A FORM OTHER GOALS CAN ADOPT AND
      BINDS NONE OF THEM. State explicitly that adoption by GOAL-SHA1-001,
      GOAL-RSA-001 or any other goal is that goal's own Coordinator decision,
      and that this task changes no record of any of them.
    - >-
      BCP-1 IS FROZEN ON COMMIT and is a pre-dispatch gate: no calibration run
      may be dispatched under a protocol that was not committed when its card
      was issued. Write it to be attacked - it is the primary target of
      TASK-20260810-b9d956, whose brief is to find how the blind calibration
      could be gamed.
    - >-
      Do not commit from this task. TASK-20260810-927ab5 snapshots these exact
      bytes before the producers run and before any reviewer reads them. Write
      strict parseable YAML with no duplicate keys.
  deliverables:
    - >-
      BCP-1.yaml, the frozen blind-calibration scoring protocol, carrying id
      BCP-1
    - an explicit invalidity list for calibration runs
    - >-
      an explicit statement of what the firewall checks versus what it merely
      declares, and of the residual risk it cannot eliminate
  artifact_paths:
    - coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/protocol/BCP-1.yaml
  archived_by: TASK-20260810-927ab5
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: max
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 600
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
    - >-
      BCP-1.yaml is strict parseable YAML with no duplicate keys and declares
      itself frozen on commit.
    - >-
      All five declared-before-run and scoring elements (a) through (e) are
      fixed explicitly and separately, including which clock the charging
      convention uses.
    - >-
      The firewall specifies the quarantine path and marker, the
      expected-answer digest, and the closed hash-manifested input set, and
      states which of these is checked from the run manifest and which is only
      declared.
    - >-
      The invalidity conditions are enumerated, and consuming the published path
      is recorded as invalid rather than as a weaker pass.
    - >-
      The residual model-prior-knowledge risk is stated, together with the
      evidential asymmetry it creates and the null-object control that is the
      only available discriminator.
    - >-
      No record of GOAL-SHA1-001, GOAL-RSA-001 or any other goal is edited, and
      no adoption by them is asserted.
    - >-
      Nothing in the artifact asserts anything about MD5, and no status changed.
  return_format: >-
    A summary naming the single written path, confirming element by element that
    (a) through (e) are fixed, naming the charging convention chosen and which
    clock it uses, stating which firewall elements are checked and which are
    only declared, and reporting the halt truthfully if the declared budget was
    reached.
