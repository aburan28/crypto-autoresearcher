    - No lane claim applies (no goal, no queue); record that in the dispatch note. If a queue exists by then, claim with tools/goal_lanes.py first.
    - The dispatching session reads this whole card, including these preconditions.

  completion_gate:
    - engine-provenance/ shows C-ENGINE passing (tree and ancestry, _kernels.c sha256, full replay 0 mismatches, pytest 0 failed 0 skipped, build_info native), all timestamped before the first draw
    - selftest.json shows C-SELF and C-FIX passing, and inputs.json shows C-SRC passing, before phase 1
    - trial-plan-v1.json exists with the power table, its sha256 is in the manifest, and it predates phase 0
    - C-CONSTRUCT, C-SUPPORT and C-REG pass before any fresh draw (phase-log timestamps)
    - draws-<ARM>.jsonl.gz exists for all four fresh arms; instances.jsonl.gz lists every kept system with its E_hex; EXHAUSTED slots are listed
    - predictions-t5.jsonl.gz is hashed in the phase log before phase 4
    - every kept system has M_4 and W_4 records, and every applicable system has rc_b and W'_4 records
    - certificate-verification.json, construction-verification.json and draw-replay-verification.json were produced by a separate process; every counted refutation is verified
    - instrument-checks.json reports every C-* with pass/fail and the violating systems
    - decision-rules.json applies NC-DR-1..9 with their inputs and both NC-DR-1 labels
    - the manifest records commands, git commit and dirty state, RUN_ID, environment, the engine block (build_info, package file hashes), input hashes, seeds, the inference block, per-phase timings, peak RSS, validity status and certificate kinds
    - raw-result.json agrees with cell-summary.json on MN1-MN3 (the executor states the check was run)
    - the run package is under 150 MiB; nothing was written outside write_scope; the specification is byte-identical to its approved version; no package file changed
    - no hypothesis status changed, no evidence record written, no knowledge promoted

