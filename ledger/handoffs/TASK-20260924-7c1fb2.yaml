handoff:
  id: TASK-20260924-7c1fb2
  from: coordinator
  to: executor
  recorded_at: '2026-09-24'
  goal_ids: []
  question_id: RQ-CERTBIN-836ce2
  experiment_id: EXP-CERTBIN-ddfe75
  hypothesis_id: H-CERTBIN-be6cbd
  approval_decision: DEC-20260924-833c70
  archived_by: TASK-20260924-40b2ca
  run_id: null
  run_id_note: >-
    Minted by the dispatching session at dispatch
    (`python3 tools/allocate_id.py --next run --area CERTBIN`, then
    `--check`) and passed to the executor as RUN_ID. The executor records it
    in the manifest. The card is not edited to add it.
  review_required: true
  depends_on: [TASK-20260924-f6c337]
  state: written_not_dispatched
  rank: 1 in CERTBIN (DEC-20260924-e61f3b rerank; DEC-20260924-833c70)

  objective: >-
    Reduce the uncertainty in whether the degree-4 W_4 refutation of
    unsatisfiable S_3 systems at the RC-1 cell is carried by S_3's exact
    quadratic part phi_{x_R}(Q) (E-TENSOR) or by S_3's lower-degree part
    (E-LINEAR). Implement experiments/EXP-CERTBIN-ddfe75/impl/ and verifier/
    from the frozen specification (version 1) on top of the pinned package
    crypto_autoresearcher.gf2. Run it once and return observations. Interpret
    nothing beyond the mechanical decision rules NC-DR-1..9.

  uncertainty_reduced: >-
    KN-OPEN-3c8f51 item (A) at n = 17 (H-CERTBIN-be6cbd C-T against E-LINEAR),
    and which control the n = 19 cell needs (NC-DR-7). Positive: CONVOLUTION
    TENSOR, and the n = 19 cell carries an N-CONV-type arm. Negative:
    LOWER-DEGREE PART REQUIRED, and N-ELL-type and N-CONVL-type arms carry the
    contrast. Inconclusive: an n = 17 successor before n = 19 quotes any
    specificity.

  inputs:
    - experiments/EXP-CERTBIN-ddfe75/specification.yaml (frozen v1; its engine_provenance, object, instance_sets, controls, decision_rules and execution blocks are the implementation spec)
    - ledger/hypotheses/H-CERTBIN-be6cbd.yaml (L-TOP, the T4 generalization, PN-1..PN-5)
    - src/crypto_autoresearcher/gf2/ at commit 934bee5 (IMPORT only; read README.md, closure.py, kernels.py)
    - tools/gf2_replay_rc1.py and tests/test_gf2_kernels.py (C-ENGINE)
    - experiments/EXP-CERTBIN-e94b27/specification.yaml (object definitions reused by reference; read only)
    - experiments/EXP-CERTBIN-e94b27/runs/RUN-CERTBIN-c417e0/ (instance-sets.json, closures.jsonl.gz, certificates.jsonl.gz), read only
    - experiments/EXP-CERTBIN-4e92d7/runs/RUN-CERTBIN-3b7e05/ (curve.json, checkpoint/p1-instances.json.gz), read only
    - coordination/review/certbin-20260924-3d7e1a/reviews/TASK-20260924-d95e70/ (red-team-report.yaml, j9-ptm/o2-declaration.yaml, j9-ptm/n-ell-instances.json, j9-ptm/o2-engine-and-own.json), read only

  constraints:
    - id: EX-1
      text: >-
        ENGINE FIRST (C-ENGINE), BEFORE ANY DRAW. Use CRYPTO_AR_GF2_BACKEND=native
        and PYTHONDONTWRITEBYTECODE=1 in every process. Check the tree and
        ancestry rule and the _kernels.c sha256. Run the FULL
        tools/gf2_replay_rc1.py sweep (1062 records, 268 certificates, 0
        mismatches required). Run tests/test_gf2_kernels.py with 0 failures
        and 0 skipped. Record kernels._native.build_info (backend native,
        source_sha256 = pin). All of it goes under engine-provenance/,
        timestamped before draws-*.jsonl.gz. On any failure, STOP and report;
        nothing is drawn.
    - id: EX-2
      text: >-
        IMPORT, NEVER COPY OR EDIT THE ENGINE. impl/ imports
        crypto_autoresearcher.gf2 and holds only N-CONV-specific code: family
        construction with your own F_{2^17} arithmetic and S_3 expansion,
        exhaustive 2^18 satisfiability, the ell substitution, the wdag-v1
        extractor, drivers, the self-test and analysis. Copy nothing from
        src/crypto_autoresearcher/gf2/, EXP-CERTBIN-4e92d7/impl/ or
        EXP-CERTBIN-e94b27/impl/. The wdag extractor may subclass
        closure.Closure or re-run the documented W_D iteration with kernels.*
        primitives; its dimensions must equal the engine record (C-WDAG). A
        suspected engine defect is a STOP and a report, never a patch.
    - id: EX-3
      text: >-
        INPUTS AND REGRESSION BEFORE FRESH DRAWS. C-SRC, C-SELF (including at
        least 3 small systems whose W_D fixpoint index is >= 2), C-FIX,
        C-CONSTRUCT (own E_S3 equals the archived E_hex on all 144 x_R),
        C-SUPPORT and C-REG (a)-(d) all pass before phase 2. Never adjust a
        dimension, input, rule or reference value to pass.
    - id: EX-4
      text: >-
        DRAWS EXACTLY AS FROZEN. Use one PCG64 generator per fresh arm with
        the frozen seed, numpy 2.4.6, slot order and attempt order, and the
        keep rule with its 256-attempt cap. Log every attempt. Unsatisfiability
        is decided only by exhaustive 2^18 evaluation. EXHAUSTED slots are
        reported, never redrawn.
    - id: EX-5
      text: >-
        PREDICTIONS BEFORE CLOSURES. Write predictions-t5.jsonl.gz (rc_b and
        T5 predictions) and record its sha256 in the phase log before phase 4.
    - id: EX-6
      text: >-
        CERTIFICATES OR IT DID NOT HAPPEN. A W_4 refutation counts only with a
        wdag-v1 certificate verified by verifier/verify_nconv.py in a SEPARATE
        PROCESS. An M_4 refutation counts only with a verified flat-v1 of max
        |mu| <= 2. verifier/ imports nothing from impl/, crypto_autoresearcher,
        any archived impl/ or any review directory. It rebuilds every system
        and replays every draw stream itself (V1-V5). An uncertified
        refutation is reported as UNCERTIFIED and not counted. A failing
        certificate voids the counts (INV-6); do not repair it silently.
        Build the C-VERIFIER negative controls per (closure, arm) kind,
        including the degree-violation type (c).
    - id: EX-7
      text: >-
        THEOREM CHECKS ARE INSTRUMENT CHECKS. A C-TOP, C-T4 or C-ELL violation
        voids the run (INV-8). Report it verbatim with the systems involved,
        and do not reinterpret it as a finding.
    - id: EX-8
      text: >-
        SOUNDNESS. A refuted satisfiable control, or codim(W_4) < s where
        s <= 31 (C-PS), voids the run (INV-5). Report it verbatim.
    - id: EX-9
      text: >-
        DECISION RULES ARE MECHANICAL. Apply NC-DR-1..9 as written, including
        both NC-DR-1 labels (L1, L2), with exact arithmetic for every
        interval, tail and the power table (RC-3). Add no threshold and drop
        no system after seeing results.
    - id: EX-10
      text: >-
        OBSERVATIONS ONLY. Change no hypothesis status. Write no evidence
        record, decision or knowledge entry. Edit no specification, ledger
        record, package file, or anything under EXP-CERTBIN-4e92d7,
        EXP-CERTBIN-e94b27 or coordination/review/. Retain every failed
        attempt with its logs. Do not commit; the Coordinator archives.
    - id: EX-11
      text: >-
        RESOURCES (machine protection). One process, at most 3 engine threads
        (CRYPTO_AR_GF2_THREADS <= 3, recorded), and a 3 GB memory cap. The
        run watchdog is 86,400 s, with checkpoint and --resume. maximum_runs 2:
        one run plus one re-run only after an INFRASTRUCTURE failure. Other
        CERTBIN executors may be running on this 4-core, 15 GB machine; lower
        the thread count rather than exceed the cap.
    - id: EX-12
      text: >-
        SCOPE AND TIER. Claim tier toy; no cost claim; sota_delta zero; oracle
        A and parallel rho dominate. Nothing about F4 step degree, other n,
        other curves or V, x(2E) modulation, or Semaev's Assumption 1.
    - id: EX-13
      text: >-
        INDEPENDENCE DISCLOSURE. The engine was written by the dispatching
        session, not by you. You write impl/ and verifier/, so your verifier
        is code-independent of the engine and of impl/, but not
        author-independent of impl/. Say so in run-report.md. The
        author-independent verification is the review round's.

