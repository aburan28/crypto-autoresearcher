    - All inputs are committed on the branch. Inputs are the RC-1 package (TASK-20260924-e27f93), the red-team directory (TASK-20260924-8f03d6), RUN-CERTBIN-3b7e05 and the engine at 934bee5.
    - >-
      Focus and machine. Run tools/autoresearch_focus.py and record that at
      most three critical experiments are active. Record how many other
      CERTBIN executors are running, and set CRYPTO_AR_GF2_THREADS
