handoff:
  id: TASK-20260912-85eb3e
  from: claude-code-session
  to: coordinator
  objective: >-
    /review-evidence EXP-ECDLP-e36df2: decide H-ECDLP-09125b (the
    resolution-matched, degeneracy-screened repair of H-ECDLP-6a9479 claim
    3), write experiments/EXP-ECDLP-e36df2/analysis.md, create
    ledger/evidence/EV-ECDLP-5b61eb.yaml and
    ledger/decisions/DEC-20260912-2a626b.yaml, and update
    H-ECDLP-09125b.yaml's status.
  uncertainty_reduced: >-
    Whether the repaired claim-3 test (m=1 tautology removed, cross-prime
    +-1-degeneracy screen, resolution-matched Poisson/CI statistic,
    independently-realized s_x/s_y, engineered positive control, random
    null object) reads as supported, falsified, split, or instrument-
    invalidated -- officially, for the first time since DEC-20260911-74c9dc
    carved claim 3 out of H-ECDLP-6a9479's otherwise-supported evidence.
  inputs:
    - ledger/hypotheses/H-ECDLP-09125b.yaml
    - experiments/EXP-ECDLP-e36df2/specification.yaml
    - experiments/EXP-ECDLP-e36df2/design_note.md
    - experiments/EXP-ECDLP-e36df2/pooled-summary.json
    - experiments/EXP-ECDLP-e36df2/orchestrate_manifest_summary.json
    - experiments/EXP-ECDLP-e36df2/runs/RUN-ECDLP-e36df2-001..028/
    - ledger/hypotheses/H-ECDLP-6a9479.yaml (the repaired hypothesis; immutable, do not edit)
    - ledger/evidence/EV-ECDLP-95ec68.yaml
    - ledger/decisions/DEC-20260911-74c9dc.yaml (the carve-out this review discharges)
  constraints:
    - Do not modify H-ECDLP-6a9479.yaml, EV-ECDLP-95ec68.yaml, or DEC-20260911-74c9dc.yaml.
    - Do not touch anything under experiments/EXP-ECDLP-a26bde/.
    - No Bash/Python/git tool; mint no IDs (EV-ECDLP-5b61eb and DEC-20260912-2a626b are pre-minted and verified free, use them as-is); the dispatching session stages, validates, and commits from your file writes.
    - If a "report file" restriction blocks writing analysis.md directly (as it did for the prior review of EXP-ECDLP-a26bde), return its full content in your final response instead; do not skip it.
  review_plan:
    claim_under_review: >-
      H-ECDLP-09125b's full statement (ledger/hypotheses/H-ECDLP-09125b.yaml):
      after excluding the m=1 tautology and any multiple flagged by the
      cross-prime +-1-degeneracy screen, and using a per-instance sample
      size chosen so a 3x-chance systematic effect is statistically
      resolvable, both s_x and s_y show a pooled agreement-rate ratio whose
      95% exact-Poisson CI is consistent with 1 and excludes any value >=3;
      s_rand reads as chance; the positive control's known m=2 coincidence
      is caught by the screen on 4/4 of its primes.
    coordinator_prior: >-
      NOT BLIND, disclosed as such rather than fabricated: the dispatching
      session performed /run-experiment's own required Coordinator-
      inspection step (docs/task-lifecycle.md step 5, "the Coordinator
      inspects actual outputs... before independent review") before this
      review_plan was written, and already independently re-derived the
      pooled k/mu0/rho_hat for all three sections (main and sensitivity)
      from the 24+4 raw-result.json files by summing n_agree/mu_0_i itself
      -- exact match to pooled-summary.json throughout -- and independently
      cross-checked the chi-square anomaly against N_i/n for all 24
      instances (ratio of ratios 0.96-1.13 throughout). The prior, honestly
      stated with that in hand: expect this review to reach `support` at
      strength `strong` or `moderate` (not `replicate`) on the ground that
      this is a null/absence-of-systematic-effect result matching the
      original theoretical prediction (KN-TECH-73630e's uniqueness
      theorem), triangulated internally by two independently-coded sections
      plus a null control plus a positive control plus a sensitivity check
      all agreeing -- not a surprising positive finding needing independent
      replication before being trusted. This prior is recorded so the
      coordinator's OWN independent path to the same (or a different)
      conclusion can be told apart from mere agreement with what it was
      told; the coordinator's blind_rederivation task below is the actual
      check, not this disclosure.
    joints:
      - joint: statistical_construction_validity
        assigned_to: coordinator
        attack_plan: >-
          Recompute rho_hat = k/mu0 and its 95% CI for s_x, s_y and s_rand
          (main pool, n=24) directly from the 24 raw-result.json files'
          n_agree/mu_0_i fields, WITHOUT reading pooled-summary.json's
          reported numbers first (read raw-result.json files, compute, THEN
          compare against pooled-summary.json and this handoff's prior).
          Separately verify the CI itself is a legitimate exact-Poisson
          interval (not just that the point estimate matches): check
          poisson_stats.py's CI construction against a textbook exact-
          Poisson CI formula (e.g. via the chi-square/gamma-quantile
          relationship) by hand on one instance's k and mu0.
        breaking_artifact: >-
          Any mismatch between an independently recomputed k, mu0, or
          rho_hat and the reported value; or a CI construction that does
          not match a legitimate exact-Poisson interval definition.
      - joint: outcome_classification_correctness
        assigned_to: coordinator
        attack_plan: >-
          Read specification.yaml's success_criterion and
          falsification_criterion verbatim (not from this handoff's
          paraphrase) and check each of the four named conditions for
          outcome (1) SUPPORTED against the actual reported numbers,
          independently of the executor's or the dispatching session's
          classification.
        breaking_artifact: >-
          Any of the four named conditions failing on direct inspection, or
          the specification's own text supporting a different one of the
          four disjoint outcomes than SUPPORTED.
      - joint: chi_square_periodicity_explanation_robustness
        assigned_to: coordinator
        attack_plan: >-
          The dispatching session and the executor already spot-checked the
          period-n explanation on p=14821/n=415 (digit recomputation at m
          and m+n) and p=12853/n=12958 (mu0 sweep). Independently check a
          THIRD, different instance not already spot-checked (e.g.
          p=7487/n=413, one of the more extreme ratios in
          pooled-summary.json's chi_square_by_instance) against the same
          N_i/n prediction, to avoid the appearance of the explanation being
          confirmed only on cherry-picked instances.
        breaking_artifact: >-
          A third instance whose chi-square ratio does NOT track N_i/n
          within a similar tolerance (~15%) to the already-checked
          instances.
    proves_too_much:
      failure_signature: >-
        s_rand's CI failing to contain 1 (the method itself inflates
        agreement counts, independent of s_x/s_y) OR the positive control's
        screen failing to flag its known, certain m=2 coincidence on any of
        its 4 primes (the corrected instrument is blind to the exact
        degeneracy it exists to exclude). Either is instrument invalidation
        that the argument for "supported" cannot survive.
      objects:
        - name: s_rand (null-object control)
          known_status: >-
            Engineered to have zero structure beyond the first p-adic digit;
            by construction, any real systematic effect in the measurement
            method itself (not specific to s_x/s_y) should show up here too.
          required_check: >-
            Confirm s_rand's CI [0.982,1.169] genuinely contains 1 by the
            same recomputation as the statistical_construction_validity
            joint -- if the METHOD were broken in a way that inflates
            agreement counts, s_rand would show it, and it must not.
        - name: positive_control_curve (engineered m=2 trap)
          known_status: >-
            Constructed with a known, certain m=2 coincidence (doubling
            slope 1, landing on x=-1). The screen MUST catch it, or the
            corrected instrument is blind to the exact degeneracy it exists
            to exclude.
          required_check: >-
            Confirm the 4/4 flag rate directly from
            frozen_positive_control_curve.json and the relevant raw-
            result.json files' flagged_x_degenerate_m fields, not merely
            from pooled-summary.json's summary field.
    blindness:
      mutual: false
      note: >-
        Single-reviewer (coordinator). The dispatching session's prior above
        is disclosed, not hidden, per the same precedent as
        TASK-20260911-6bf4f9; the blind_rederivation task is what actually
        guards against anchoring, not the disclosure's absence.
    blind_rederivation:
      required: true
      assigned_to: coordinator
      quantity: >-
        The main pool's k, mu0, and rho_hat for s_x, s_y, and s_rand
        (n=24 instances), recomputed directly from each raw-result.json's
        n_agree/mu_0_i fields (per the statistical_construction_validity
        joint above) before treating pooled-summary.json's reported values
        as ground truth.
      blind_from:
        - experiments/EXP-ECDLP-e36df2/pooled-summary.json
        - experiments/EXP-ECDLP-e36df2/design_note.md (section 4b's results table)
        - experiments/EXP-ECDLP-e36df2/driver/pooled_summary.py
    procedure_deviations:
      - >-
        The dispatching session is both this review's requester and, in
        effect, one of its checkers (it already re-derived the pooled
        statistics during /run-experiment's own required inspection step).
        This is the same overlap disclosed in TASK-20260911-6bf4f9 and has
        the same mitigation: the coordinator subagent dispatched here is an
        independent context that has not seen that prior work beyond what
        is stated in this handoff, and its blind_rederivation task is
        genuine (recompute before comparing, not confirm after).
      - >-
        The coordinator subagent has no Bash/Python tool; its
        blind_rederivation must be done by reading raw-result.json files
        directly and computing sums/ratios by hand or via its own reasoning,
        not by running a script. This is slower but not weaker as a check
        for a pool of only 24 instances with pre-aggregated per-instance
        counts (n_agree, mu_0_i) already computed -- summing 24 small
        integers and 24 floats is tractable by hand with care.
  deliverables:
    - experiments/EXP-ECDLP-e36df2/analysis.md
    - ledger/evidence/EV-ECDLP-5b61eb.yaml
    - ledger/decisions/DEC-20260912-2a626b.yaml
    - ledger/hypotheses/H-ECDLP-09125b.yaml (status update only)
  budget:
    wall_clock_seconds: null
    memory_gb: null
  completion_gate:
    - All three joints' attack_plans executed and their outcomes stated explicitly in analysis.md, not merely asserted as passing.
    - Both proves_too_much objects' required_checks confirmed directly from raw artifacts, not from pooled-summary.json's summary fields alone.
    - blind_rederivation actually performed (shown working, not just a restated conclusion) before comparing against pooled-summary.json.
    - knowledge_promotion field filled (promoted or not_warranted with a concrete reason) in the decision record.
  return_format: >-
    Confirm the four written/returned artifacts, the decision and evidence
    strength with rationale, and flag anything that deviated from the prior
    above or that the dispatching session should double-check before
    committing. Under 500 words.
