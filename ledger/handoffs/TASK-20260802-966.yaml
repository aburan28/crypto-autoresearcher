    - Adapter CLI integration and adapter-version bump.
    - Fixture-only unit tests covering approved happy, mismatch, ambiguity, privacy, path, immutability, and binding-check cases.
    - Focused documentation distinguishing session verification from backend verification.
    - Executor implementation report with exact commands, outputs, limitations, and inference provenance.
