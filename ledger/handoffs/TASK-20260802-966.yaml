handoff:
  id: TASK-20260802-966
  from: coordinator
  to: executor
  objective: >-
    Implement the snapshot-approved, session-scoped Codex CLI runtime
    provenance probe exactly as specified by TASK-20260802-964, using only
    standard-library code, fixture-only tests, and privacy-preserving receipts.
  inputs:
