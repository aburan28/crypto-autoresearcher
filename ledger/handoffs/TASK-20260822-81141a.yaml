handoff:
  id: TASK-20260822-81141a
  from: coordinator
  to: executor
  objective: 'Build the record-class pipeline for rank OVER Q and report the best rank it actually
    certifies. Three stages: (1) construct the pencil of plane cubics through 8 rational points in
    general position, giving a rational elliptic surface with 8 sections over Q(t); (2) sieve Q-rational
    specialisations with the Mestre-Nagao statistic; (3) certify the top candidates by descent and
    exhibited points over Q. Then MEASURE the gap to 31 on two axes: base rank over Q(t) achieved,
    and sieve volume covered.'
  uncertainty_reduced: What rank over Q this program can actually certify from scratch, and whether
    the binding constraint is the base rank over Q(t) or the sieve volume.
  inputs:
  - ledger/hypotheses/H-ECQ-cec3c4.yaml
  - ledger/questions/RQ-ECQ-80f23c.yaml
  - experiments/EXP-ECRANK-e1e30e/source/twist_family.py
  - experiments/EXP-ECRANK-e1e30e/runs/RUN-ECRANK-e1e30e-003/record_curve_input.json
  - coordination/goals/GOAL-ECRANK-002/batches/BATCH-e0caa5/tasks/TASK-20260822-a7a9e8
  constraints:
  - EVERY rank over Q is a certified LOWER BOUND from exhibited points on that exact curve. Never
    an analytic rank, never ellrank r_high, never a Selmer bound.
  - Silverman specialisation may motivate a search but NEVER certifies a specific curve. Recertify
    on the specialised curve with its own points and its own regulator.
  - The Mestre-Nagao statistic ORDERS candidates and nothing else. Run a random-sample control of
    the same size so its efficiency is measured rather than assumed.
  - DO NOT tune toward 31. Rank >= 31 over Q is an open world record (current record 30, Alpoge-Howell
    2026). Report what you certify. An honest 12 is the deliverable; a 31 that does not verify is
    worthless and will be caught.
  - A timeout or crash is an infrastructure outcome, never negative mathematical evidence.
  - Write ONLY inside your write_scope. Never commit.
  deliverables:
  - the Q(t) family with its 8 sections and the regulator confirming independence
  - the sieve log with volume covered and the random-sample control
  - certified curves over Q with exhibited points and regulators, best first
  - the two-axis gap to 31 as numbers
  artifact_paths:
  - coordination/goals/GOAL-ECQ-001/batches/BATCH-7e06d3/tasks/TASK-20260822-81141a/qt_family.json
  - coordination/goals/GOAL-ECQ-001/batches/BATCH-7e06d3/tasks/TASK-20260822-81141a/certified_curves.json
  - coordination/goals/GOAL-ECQ-001/batches/BATCH-7e06d3/tasks/TASK-20260822-81141a/gap_analysis.json
  - coordination/goals/GOAL-ECQ-001/batches/BATCH-7e06d3/tasks/TASK-20260822-81141a/report.md
  - coordination/goals/GOAL-ECQ-001/batches/BATCH-7e06d3/tasks/TASK-20260822-81141a/src/pipeline.py
  archived_by: TASK-20260822-66bacf
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 3000
    memory_gb: 4
    maximum_runs: 60
  completion_gate:
  - 8x8 regulator reported and nonsingular, or the failure reported
  - every certified rank backed by that many exhibited points, verified in exact arithmetic by your
    own code
  - random-sample control run alongside the MN sieve
  - gap stated as numbers on both axes
  return_format: 'executor execution report: what was run, what was measured, what failed. No interpretation
    of significance.'
