handoff:
  id: TASK-20260823-01d3d9
  from: coordinator
  to: executor
  objective: 'Build the FAMILY-AGNOSTIC pipeline that turns a Q(t) family into small, high-rank, certified
    curves over Q: specialise at small rational parameters -> order by Mestre-Nagao -> certify rank by
    EXACT descent from exhibited points -> compute minimal model, naive height, Faltings height and conductor
    -> emit an ICARM-format submission record. It must run against ANY family passed to it, because the
    base family is being chosen concurrently in TASK-20260823-d1cb76 and is not yours to wait on.'
  uncertainty_reduced: Whether specialising at small parameters actually keeps minimal-model height low
    -- the cheap pre-compute check that decides whether the whole approach in H-ECQ-d60d07 is viable.
  inputs:
  - ledger/goals/GOAL-ECQ-002/goal.yaml
  - ledger/hypotheses/H-ECQ-d60d07.yaml
  - coordination/goals/GOAL-ECQ-002/baseline/frontier_20260823.json
  - coordination/goals/GOAL-ECQ-002/baseline/icarm_database_20260823.json
  - experiments/EXP-ECRANK-e1e30e/source/twist_family.py
  - experiments/EXP-ECRANK-e1e30e/source/verify_certificate.py
  constraints:
  - 'RUN THE REPRODUCTION CHECK FIRST, before any search. Take curves already on the frozen ICARM snapshot
    -- including the small rank-14 #244 [0,0,0,-44788551847,2462203786988170] and the rank-15 incumbent
    #276 -- and recompute rank, naive height, Faltings height and conductor from a-invariants alone. If
    your numbers do not match theirs, your height definition is wrong and every later comparison is meaningless.
    Report the agreement explicitly. This gates everything.'
  - 'RUN THE CHEAP FALSIFIER SECOND: confirm that small parameters really do give small minimal models.
    Specialise any convenient family over a small parameter box and plot/report height against parameter
    size. If height does not stay low, say so immediately -- that falsifies the mechanism in H-ECQ-d60d07
    and is a genuinely useful negative result, not a failure.'
  - EVERY rank is a certified LOWER BOUND from exhibited points on that exact curve, verified in exact
    arithmetic. Never an analytic rank, never ellrank r_high alone, never a Selmer bound. Reuse the stdlib-only
    exact verifier discipline from EXP-ECRANK-e1e30e.
  - The Mestre-Nagao statistic ORDERS candidates and never certifies. Include a random-sample control
    of the same size so its efficiency is measured rather than assumed.
  - DO NOT submit anything to the ICARM endpoint. Submission is a Coordinator decision after review; your
    job is to produce the submission record, not to send it.
  - A timeout or crash is an infrastructure outcome, never negative mathematical evidence.
  - Write ONLY inside your write_scope. Never commit.
  deliverables:
  - 'pipeline_validation.json: the reproduction check against known leaderboard curves (theirs vs ours,
    per metric), the height-vs-parameter-size falsifier result, and the Mestre-Nagao control.'
  - the pipeline source, runnable, with a documented entry point taking a family and a parameter box
  - 'report.md: whether the mechanism survived its falsifier, what the pipeline certifies today, and what
    it needs from the base family to reach rank >= 15 under naive height 118.770.'
  artifact_paths:
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-f2341e/tasks/TASK-20260823-01d3d9/pipeline_validation.json
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-f2341e/tasks/TASK-20260823-01d3d9/report.md
  budget:
    wall_clock_seconds: 3600
    memory_gb: 4
    maximum_runs: 80
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  completion_gate:
  - reproduction check against known ICARM curves reported per metric, ours vs theirs
  - height-vs-parameter-size falsifier run and its verdict stated plainly
  - random-sample control run alongside the Mestre-Nagao ordering
  - every certified rank backed by that many exhibited points verified in exact arithmetic
  - nothing submitted to the ICARM endpoint
  return_format: 'executor execution report: what was run, what was measured, what failed. No interpretation
    of significance.'
  archived_by: TASK-20260823-744c38
