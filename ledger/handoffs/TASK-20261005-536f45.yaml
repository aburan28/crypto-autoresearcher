handoff:
  id: TASK-20261005-536f45
  from: coordinator
  to: executor
  objective: >-
    Enumerate the three primes of EXP-SSI-10147c, replay decryption from
    the normalized 5-torsion table, and record the norm-7 probe.
  uncertainty_reduced: >-
    Whether this toy decryption factors through the torsion table, and
    whether the tracer refuses a fresh-norm request.
  inputs:
    - ledger/hypotheses/H-SSI-1ed6df.yaml
    - ledger/proposals/IDEA-20261004-edbd24.yaml
    - experiments/EXP-SSI-10147c/specification.yaml
    - ledger/decisions/DEC-20261005-d18d0d.yaml
  constraints:
    - Implement only the API in the frozen specification.
    - Enumerate every matrix in GL_2(Z/5Z). Do not sample.
    - Do not mark the reverse End(E) arrow proved.
    - Do not claim a PKE, an attack, or a result at any other prime.
    - Write nothing outside the declared write scope.
    - Use no Bedrock endpoint or model.
  deliverables:
    - experiments/EXP-SSI-10147c/runs/<RUN-ID>/cells.json
    - experiments/EXP-SSI-10147c/runs/<RUN-ID>/ladder.json
    - experiments/EXP-SSI-10147c/runs/<RUN-ID>/command.txt
  artifact_paths:
    - experiments/EXP-SSI-10147c/runs/
  write_scope:
    - experiments/EXP-SSI-10147c/implementation/
    - experiments/EXP-SSI-10147c/runs/
  archived_by: TASK-20261005-c6b528
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: null
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
    - cells.json contains all three primes and both messages.
    - Each prime records disagreements, fiber size, and the norm-7 bit.
    - ladder.json lists the torsion-table to End(E) arrow as missing.
    - The run manifest records the git commit, the command, and an empty seed list.
  return_format: >-
    Run id, validity, the three primary counts, and the artifact paths.
  review_plan: null
  dispatch_preconditions:
    - archived_by TASK-20261005-c6b528 is committed and its receipt verifies.
    - The hypothesis, specification, and this handoff are committed and pushed.
    - A lane is claimed before launch.
    - >-
      A Coordinator decision after DEC-20261005-d18d0d explicitly releases
      this experiment. Until that decision, do not launch.
