handoff:
  id: TASK-20260813-e183e6
  from: coordinator
  to: validator
  goal_id: GOAL-ECDLP-001
  sub_goal_id: SG-ECDLP-002
  question_id: RQ-ECDLP-002
  hypothesis_id: H-ISOU-c5bfea
  experiment_id: EXP-ISOU-2ac81f
  batch_id: BATCH-009b1b
  decision_id: DEC-20260813-d61a99
  reviews_task_id: TASK-20260813-4bee82

  status: written_not_dispatched
  status_note: >-
    Written and reserved. NOT DISPATCHED. This is the dependent independent
    review DEC-20260813-e0077d required to EXIST before the Executor task was
    dispatched; it is dispatched only after TASK-20260813-4bee82's run artifacts
    exist and have been snapshot-archived by an isolated Coordinator commit, so
    that this Validator binds immutable bytes rather than a moving tree. It runs
    in an INDEPENDENT SESSION under review-adversarial. A message from any agent
    is not a dispatch and not an approval.

  objective: >-
    Independently verify the INTEGRITY of the EXP-ISOU-2ac81f complete-class
    ECDLP cost census run set produced by TASK-20260813-4bee82 -- its run
    receipts, its solution and edge certificates, its controls, and its
    reproducibility bindings -- and return a terminal verdict of PASS, REVISE or
    REJECT with blocking evidence. The question this task answers is whether the
    run set is ADMISSIBLE EVIDENCE AT ALL. It is not whether the hypothesis is
    true.

  uncertainty_reduced: >-
    Whether the census run set is complete, schema-complete, seed-faithful,
    internally consistent between raw records and summary, certificate-verified
    by a checker independent of the solver, and controlled well enough that any
    Q1, Q2 or Q3 number in it means what it appears to mean. An invalid or
    incomplete run set is not evidence and goes back to the Executor with
    concrete defects listed; the Coordinator may not interpret anything until
    this is settled.

  inputs:
    - >-
      experiments/EXP-ISOU-2ac81f/specification.yaml -- THE frozen contract at
      version 1, status approved. It is the only standard the run set is judged
      against: its controls, metrics, budgets, stopping rules, invalidation
      rules, required_artifacts list and run accounting. Where the run set and
      the contract disagree, the contract governs and the disagreement is a
      defect to report, not a discrepancy to reconcile.
    - >-
      experiments/EXP-ISOU-2ac81f/runs/ -- the immutable run records under
      review, including manifests, class enumerations, per-member per-seed solve
      records, certificate-verification output, null-object records, the frozen
      seed band and the defect log.
    - >-
      experiments/EXP-ISOU-2ac81f/implementation/ -- read to establish
      certificate-checker independence and instrumented-arithmetic behaviour.
      READ, NOT EXECUTED.
    - >-
      coordination/goals/GOAL-ECDLP-001/tasks/TASK-20260813-4bee82/receipt.yaml
      -- the Executor task receipt: commands, git state, environment, seeds,
      resolved inference block, terminal statuses and exact artifact paths.
    - >-
      ledger/handoffs/TASK-20260813-4bee82.yaml -- the producer's constraints and
      completion gate, which are the specific promises this review checks.
    - >-
      ledger/decisions/DEC-20260813-e0077d.yaml -- the approval, including the
      recorded RESOLUTION FLOOR (a null on Q1 means "no effect above the frozen
      band at the tested scale", never "no effect") and the recorded NULL-OBJECT
      STRENGTH limitation (the different-order control shows the meter tracks
      group order, not that it is sensitive to a within-class difference of the
      size the census would need to detect).
    - >-
      ledger/hypotheses/H-ISOU-c5bfea.yaml -- HEUR-ISOU-1 and the test boundary.
      Background: this task does not adjudicate the hypothesis.
    - >-
      ledger/evidence/EV-ECDLP-b3e847.yaml -- the closure whose obstruction 4
      this census audits. Context only; this task does not edit it.
    - >-
      AGENTS.md core rules 1-10, agents/validator.md, and
      docs/claims-and-verification.md (claim tiers and the solution-certificate
      requirement).

  constraints:
    - >-
      DO NOT RE-RUN THE EXPERIMENT. Do not execute the solver, do not launch a
      census, and do not spend census compute. Recomputation from recorded
      artifacts -- re-deriving a summary statistic from raw counts, checking an
      arithmetic identity, verifying a certificate against recorded values -- is
      expected and is not a re-run. Producing new cost data is out of scope; if
      the run set cannot be adjudicated without new data, say so and return
      REVISE naming exactly what is missing.
    - >-
      DO NOT INTERPRET. Do not state whether the hypothesis is supported or
      falsified, do not assign evidence strength, do not write or amend any
      ledger record, do not write an evidence record, and do not change any
      status. Observing that a datum meets a stated falsification condition is
      reported as the observation plus the condition it meets, and nothing
      further. Interpretation is the Coordinator's, on a separate decision,
      after this verdict.
    - >-
      CHECK THE DIFFERENT-ORDER NULL OBJECT ACTUALLY SEPARATED. For every run,
      adjudicate whether the null-object control (at least 8 curves over a
      declared smaller prime p' with N' <= N/16) separated from the class members
      AT THE RESOLUTION OF THE FROZEN SEED BAND. IF IT DID NOT SEPARATE, NO Q1 OR
      Q3 RESULT MAY BE REPORTED FROM THAT RUN IN ANY FORM -- including as
      preliminary, partial or indicative -- and the report must say so
      explicitly and mark that run's Q1/Q3 inadmissible. This gate is a STOP, not
      a caveat. Also verify the null objects ran under the SAME frozen solver
      parameters and seed schedule as the members they control; a control run
      under different parameters is not a control.
    - >-
      CHECK THE CLASS WALK CLOSED ON h(disc(End(E_0))) RATHER THAN MERELY
      TERMINATING. Verify that for every run both the enumerated vertex count and
      the class number computed INDEPENDENTLY OF THE WALK are reported, that they
      are compared side by side (including when they agree), and that the
      independent computation is genuinely independent of the enumeration. A walk
      that merely terminated is an incomplete subgraph; it invalidates every
      "no member is cheaper" statement, which is a claim about a complete class
      or nothing. Report the comparison per run in the review report.
    - >-
      CHECK Q1 AND Q2 WERE MEASURED IN THEIR SEPARATE COORDINATE REGIMES. Q1 must
      have been measured with EVERY member in the ONE declared common coordinate
      system, model family and arithmetic implementation, so the group-operation
      counter counted the same abstract events on every curve. Q2 must have been
      measured separately, with each member in its own cheapest reachable model,
      minimized over a candidate model set and cost rule DECLARED IN THE MANIFEST
      BEFORE MEASUREMENT. Mixing the two regimes invalidates Q1 under the
      contract's own invalidation rules and is the primary way this census could
      report a fake speedup; adjudicate it explicitly and by evidence, not by
      accepting the producer's assertion.
    - >-
      CHECK THE CERTIFICATE CHECKER SHARES NO STATE AND NO CODE PATH WITH THE
      SOLVER. Establish this by reading the implementation, not by trusting the
      receipt: separate module, no shared mutable state, no import of solver
      internals, independent re-derivation that the recovered k satisfies
      [k]P = Q on the base curve after pullback. Self-confirmation is not
      verification. Confirm every claimed solve carries independent verification
      output and that any member without one contributes NO cost datum and
      appears in the defect log.
    - >-
      CHECK RUN-SET VALIDITY IN FULL: expected run count against the contract's
      run accounting (two prime sizes times two independent instances, 20-bit
      censuses first); schema-complete manifests including the resolved inference
      block, environment and requested_policy; seed integrity and that the base
      curve tuple and the seed dispersion band carry timestamps PRECEDING the
      first between-member comparison; exact raw-versus-summary agreement,
      recomputed rather than assumed; control comparability across every control
      (positive control, BSGS cross-check, seed band, special-j segregation);
      deduplication by F_p-isomorphism class rather than j-invariant alone; and
      that every walk-cost component entering Q3 is labelled measured or
      modelled with the formula recorded for any modelled component.
    - >-
      A TIMEOUT, CRASH, BUDGET EXHAUSTION OR IMPLEMENTATION FAILURE IS
      INFRASTRUCTURE SIGNAL AND NEVER A NEGATIVE MATHEMATICAL RESULT (AGENTS.md
      rule 5). Classify a censored solve as censored with its step count at
      cutoff, never as a slow or resistant curve. A budget-exhausted 24-bit run
      yields an incomplete subgraph and no Q1 or Q3 claim, and the completed
      20-bit censuses still stand on their own.
    - >-
      REPORT DEFECTS CONCRETELY. Every defect gets an id, a severity, the exact
      artifact path and field it was found in, and enough detail for the Executor
      to reproduce and repair it. Vague objections are not actionable and are not
      a verdict.
    - >-
      INDEPENDENT SESSION, review-adversarial, xhigh. Not the session that
      produced the run set. No fallback, no degradation, no Bedrock (AGENTS.md
      rule 16). Record requested_policy alongside the resolved model identifier
      and set fallback_used with a reason if they differ; never silently
      substitute.
    - >-
      WRITE SCOPE. Write only
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-009b1b/reviews/TASK-20260813-e183e6/.
      Do not edit the specification, any run record, any ledger record, any
      knowledge entry, or knowledge/INDEX.md.
    - >-
      DO NOT COMMIT. Archival is a separate, isolated Coordinator step. Leave the
      report in the working tree and report its exact path.

  deliverables:
    - >-
      review-report.yaml carrying: a terminal verdict of PASS, REVISE or REJECT;
      a per-run integrity table covering expected run count, manifest schema
      completeness, seed integrity, raw-versus-summary agreement, certificate
      verification and control comparability; an EXPLICIT per-run statement of
      the null-object separation result and of whether that run's Q1 and Q3 are
      admissible at all; an EXPLICIT per-run statement of enumerated vertex count
      versus independently computed h(disc(End(E_0))), with closure distinguished
      from mere termination; an EXPLICIT finding on Q1/Q2 coordinate-regime
      separation with the evidence read; an EXPLICIT finding on
      certificate-checker independence with the evidence read; the exact paths
      and, where available, hashes of every artifact reviewed; and a concrete,
      id-bearing defect list for everything that fails.

  artifact_paths:
    - >-
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-009b1b/reviews/TASK-20260813-e183e6/review-report.yaml

  archived_by: null
  archived_by_note: >-
    Assigned by the Coordinator when the BATCH-009b1b ledger archive card is
    allocated. This report is archived by the LEDGER archive, which runs alone
    AFTER this review, never in the snapshot archive that precedes it. The
    Validator never commits. Recorded as OPEN-009B1B-NO-ARCHIVE-CARDS in
    coordination/goals/GOAL-ECDLP-001/batches/BATCH-009b1b/batch.yaml.

  review_required: false
  review_note: >-
    This IS the review. It is the dependent independent Validator
    DEC-20260813-e0077d required for the claim-relevant producer task
    TASK-20260813-4bee82, whose result bears on obstruction 4 of the recorded
    closure EV-ECDLP-b3e847.

  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: false
    fallback_note: >-
      Under this Claude Code harness every policy alias resolves to the one
      session model (CLAUDE.md "Model policy note"); what binds per subagent is
      the validator role's `xhigh` reasoning effort. The run report must carry
      requested_policy alongside the resolved model identifier, with
      fallback_used true and a reason if they differ. Not Bedrock (AGENTS.md
      rule 16).
    degraded_allowed: false
    independent_session_required: true

  budget:
    wall_clock_seconds: 3600
    memory_gb: 3
    maximum_runs: 1
    total_cpu_hours: 1
    maximum_workers: 1
    budget_note: >-
      Review budget only. NO CENSUS COMPUTE is authorized by this task and no
      experiment run is included: maximum_runs 1 counts this review session
      itself, not an experiment execution. Exhausting the budget ends the review
      with a budget terminal status and an explicit statement of what was and was
      not adjudicated; it is never reported as a PASS by default and never as a
      mathematical result.

  completion_gate:
    - >-
      The report binds by exact path every run artifact it reviewed and states
      one terminal verdict of PASS, REVISE or REJECT.
    - >-
      Null-object separation is adjudicated per run, and any run where the
      different-order control failed to separate is marked as carrying NO
      admissible Q1 or Q3 result in any form.
    - >-
      Vertex count versus independently computed h(disc(End(E_0))) is adjudicated
      per run, with class closure explicitly distinguished from mere walk
      termination.
    - >-
      Q1/Q2 coordinate-regime separation is adjudicated explicitly, with the
      declared candidate model set and M/S aggregation rule confirmed to predate
      measurement.
    - >-
      Certificate-checker independence from the solver is adjudicated from the
      implementation, with the evidence read stated.
    - >-
      Expected run count, manifest schema completeness, seed integrity,
      raw-versus-summary agreement and control comparability are each
      adjudicated, and every defect carries an id, a severity, an exact path and
      reproduction detail.
    - >-
      No experiment was run, no measurement was interpreted, no evidence strength
      was assigned, no ledger record was written or amended, no status was
      changed, no write occurred outside the declared write scope, and no commit
      was made.

  return_format: >-
    The review-report.yaml described above, plus a plain listing of its exact
    path, the terminal verdict, and the four gate results (null-object
    separation, class closure versus termination, Q1/Q2 regime separation,
    certificate-checker independence) stated one line each. State any blocker or
    inability to adjudicate explicitly and separately. Do not state a scientific
    conclusion.
