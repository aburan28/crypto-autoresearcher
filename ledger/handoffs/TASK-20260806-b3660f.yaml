handoff:
  id: TASK-20260806-b3660f
  recorded_at: '2026-08-06'
  from: coordinator
  to: executor
  objective: >-
    Execute the frozen contract EXP-RHO-60da4f: measure, in F_p multiplications,
    the fully charged cost of the {+-1}-quotient Pollard rho walk across the
    declared grid of fruitless-cycle escape rules at three subgroup sizes, and
    report the net gain ratio against an un-quotiented Teske r = 20 baseline
    instrumented in the same harness. Locate the escape-rule setting at which
    the ratio crosses 1.0, or state explicitly that no crossing occurs inside
    the tested grid.
  uncertainty_reduced: >-
    Whether the negation map's naive sqrt(2) gain survives fully charged
    accounting of cycle detection and escape, and where in the escape-rule
    parameter space the gain changes sign. No record in this ledger carries
    either number.
  inputs:
    - IDEA-20260806-37eab9
    - H-RHO-bc6ea6
    - experiments/EXP-RHO-60da4f/specification.yaml
    - KN-TECH-006
    - KN-TECH-018
    - KN-TECH-052
  constraints:
    - >-
      The contract is FROZEN. Any deviation requires a versioned
      protocol_amendment in experiments/EXP-RHO-60da4f/amendments/ BEFORE the
      affected runs execute. Do not adjust the preregistered 1/(2r) prediction
      under any circumstance; a revision is an amendment, and runs already
      executed are never re-scored against it.
    - >-
      Report every cost in F_p multiplications with the curve model named.
      Numbers reported in "group operations" are inadmissible and will be
      rejected at review.
    - >-
      Controls C1-C4 are BLOCKING and run in order before any net_gain_ratio is
      computed. C3 (no-escape) MUST show absorption; if it does not, halt and
      report rather than proceeding.
    - >-
      Censored walks (no collision within 64*sqrt(N/2) steps) are recorded as
      censored, never dropped. A cell above 10 percent censoring is reported as
      unresolved, not scored.
    - >-
      Any escape rule found to depend on walk history is inadmissible: exclude
      it before scoring and record the rejection with its reason.
    - >-
      Crashes, timeouts and memory exhaustion are infrastructure outcomes under
      AGENTS.md rule 5. Record them as such; they are never cost results.
    - >-
      Observations only. Do not interpret results, do not change hypothesis
      status, and do not write evidence or decision records.
  deliverables:
    - immutable run records for every executed cell, with manifests
    - execution report with the measured-vs-modeled table, columns unmixed
    - control outcomes C1-C5 with pass/fail and measured values
    - the optimistic-assumption list reproduced with the direction of each bias
    - net_gain_ratio per cell with bootstrap intervals, plus the located
      sign-change setting or its explicit absence
  artifact_paths:
    - experiments/EXP-RHO-60da4f/runs/
    - experiments/EXP-RHO-60da4f/curves.json
    - experiments/EXP-RHO-60da4f/execution-report.md
  archived_by: TASK-20260806-e7b1f7
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
    fallback_note: >-
      Policy aliases do not resolve to distinct models under this harness;
      record the resolved model in every run manifest with fallback_used set
      accordingly, and never silently substitute.
  budget:
    wall_clock_seconds: 900000
    memory_gb: 8
    maximum_runs: 7200
  completion_gate:
    - C1 reproduces the KN-TECH-006 convention within +-8 percent at all three sizes
    - C2 random-oracle walk lands at the ideal constant
    - C3 no-escape control is absorbed in fruitless cycles
    - C4 two implementations agree exactly on a frozen seed
    - Every run carries a manifest with command, commit, environment, seed and
      resolved model identifier
    - Censored fractions reported per cell; no cell scored with censored runs dropped
    - No number reported in group operations
  return_format: >-
    Execution report plus immutable run records. Observations and measured
    values only; no interpretation, no status change, no evidence record.
