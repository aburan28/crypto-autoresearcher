      slow the grid is too fine, not the budget too small.

  completion_gate:
    - ARM R passed, or the run stopped and reported its disagreement
    - ARM N reported with a verdict or as UNREACHED with a concrete missing piece named
    - every reported crossover carries all eight cell labels
    - all ten controls stated separately, degeneracies labelled degenerate
    - ARM I delivered with its cell-wise disagreement and the n = 571 cross-check
    - both nulls run and reported separately
    - C10 reported under both readings of the MB column, with neither picked
    - COST-* record verified by a transcription checker rather than by hand
    - determinism demonstrated by two executions
    - every preregistered prediction answered, including any missed
    - no degree measured, asserted, or estimated anywhere
    - manifest satisfies the artifact policy in AGENTS.md

  review_plan: null
  review_plan_note: >-
    None required: this handoff opens a PRODUCER task and cannot change a claim. It
