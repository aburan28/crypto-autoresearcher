handoff:
  id: TASK-20260913-39f7a4
  from: coordinator
  to: executor
  goal_ids: [GOAL-SEMBIN-5078bc]
  batch_id: BATCH-SEMBIN-20260913-9d649f
  opened_by_decision: DEC-20260913-74e208

  objective: >-
    Execute EXP-SEMBIN-2c40bb: replace COST-SEMBIN-8d123b's crossover-per-metric table
    with the two-parameter surface it is one undeclared slice of, and carry the four
    corrections REVIEW-SEMBIN-20260913-9d649f established.

    ARM R FIRST AND IT IS A GATE: reproduce COST-SEMBIN-8d123b exactly at
    (store_log2 = 30, processors = 1, kappa = 1, cofactor = 1) -- crossovers 303, 303,
    435, 375 and n = 409 margins +37.78, -8.79, +11.52 -- and agree with the red team's
    independent reimplementation in
    coordination/review/sembin-20260913-9d649f/red-team-cf9d98/recomputations.json to
    within its stated 4.8e-5 bits. Three independent implementations already agree at
    that point, so a fourth that disagrees is the defective one. STOP if it fails.

    ARM N SECOND: instantiate the prime-field index-calculus nearby-object control from
    EXP-ICEX-c32447's specification. It can void this experiment AND its parent, so it
    runs before the expensive grid rather than after.

    Then ARM S (the surface over the full declared grid, as data), ARM B (the baseline
    charged at the minimum of its own T x Mem and at the sect113r2-calibrated ratio,
    with Semaev charged at the minimum of his own curve), ARM F (fixed memory budget,
    hard and soft, plus memory-weighted time T x M^alpha), and ARM I (a second,
    independent implementation of the sparse working set).

  inputs:
    - experiments/EXP-SEMBIN-2c40bb/specification.yaml
    - ledger/hypotheses/H-SEMBIN-97ea23.yaml
    - ledger/decisions/DEC-20260913-74e208.yaml
    - ledger/evidence/EV-SEMBIN-71e5cd.yaml
    - experiments/EXP-SEMBIN-f4a17b/runs/RUN-SEMBIN-121b59/COST-SEMBIN-8d123b.yaml
    - experiments/EXP-SEMBIN-f4a17b/runs/RUN-SEMBIN-121b59/raw-result.json
    - experiments/EXP-SEMBIN-f4a17b/code/memory_charged_cost.py
    - experiments/EXP-SEMBIN-f4a17b/code/verify_record_transcription.py
    - experiments/EXP-SEMBIN-81dc96/code/run_wrapper.py
    - coordination/review/sembin-20260913-9d649f/red-team-cf9d98/report.md
    - coordination/review/sembin-20260913-9d649f/red-team-cf9d98/recomputations.json
    - coordination/review/sembin-20260913-9d649f/validator-da3982/report.md
    - coordination/review/sembin-20260913-9d649f/validator-da3982/work/j1_memory_from_text.json
    - coordination/review/sembin-20260913-9d649f/blind-rederivation-ec11c4/report-phase-two.md
    - inputs/SEMAEV-2015-310/paper_fulltext.md
    - inputs/SEMAEV-2015-310/tables.yaml
    - knowledge/literature/KN-LIT-e77232.md
    - knowledge/techniques/KN-TECH-006.md
    - knowledge/techniques/KN-TECH-035.md
    - knowledge/techniques/KN-TECH-036.md
    - knowledge/techniques/KN-TECH-001.md
    - knowledge/techniques/KN-TECH-018.md
    - experiments/EXP-ICEX-c32447/specification.yaml
    - knowledge/open-problems/KN-OPEN-001.md

  constraints:
    - >-
      RUN ARM R BEFORE ANYTHING ELSE AND STOP ON FAILURE. The reproduction gate is not a
      metric, it is admission. If the new implementation cannot return
      COST-SEMBIN-8d123b's four crossovers and three n = 409 margins at
      (store_log2 = 30, processors = 1, kappa = 1, cofactor = 1, degree bound 4), report
      the disagreement and stop. Do not report a surface whose reproduction point
      disagrees with three implementations that already agree.
    - >-
      RUN ARM N SECOND, before the expensive grid. It is the only control that can void
      both this experiment and its parent, and discovering that last is the wrong order.
      If EXP-ICEX-c32447's model cannot be instantiated inside the budget, RECORD A
      CONCRETE IMPEDIMENT naming exactly what is missing, mark ARM N UNREACHED with that
      reason, and continue with the remaining arms. DO NOT substitute a same-family
      object and count it as this control -- that substitution is precisely what the
      review round broke (EV-SEMBIN-71e5cd O-15 and O-16).
    - >-
      EVERY CROSSOVER CARRIES ITS FULL CELL LABEL: (metric, store_log2, processors_log2,
      baseline_charging_mode, kappa, cofactor, storage_reading, k_reading). A crossover
      reported without all eight is a FAILED deliverable regardless of its value. This is
      the single defect this experiment exists to fix, so reproducing it would be
      self-defeating.
    - >-
      MEASURE NO DEGREE AND ASSERT NONE. There is no Groebner engine on this host
      (IMP-SEMBIN-ENGINE) and this program's own first-fall instruments import sage.all.
      Degree bounds 4, 5 and 6 are swept as GIVEN PARAMETERS, never as measurements.
      Saying a degree is "plausibly 4" is a violation. Assumption 1 is carried as an
      explicitly unvalidated premise on both sides of every comparison, and stating that
      is part of the deliverable.
    - >-
      A DEGENERATE CONTROL IS REPORTED AS DEGENERATE, NEVER AS A NUMBER. Where a
      zero-memory comparator makes log2(memory) = -inf so that no crossover exists, the
      output is DEGENERATE. Converting "the control returned 0 where memory is inert and
      undefined where it is not" into "the share is zero" is the exact error the round
      overturned. Run BOTH the zero-memory null and the informative null (a baseline
      charged the 3n bits it actually needs) and report both separately.
    - >-
      SCAN n FROM 3, NOT FROM 250. The parent's crossover_curve hardcoded n_lo = 250 and
      so never saw that its cheaper set is {3} union [375, 700], where the n = 3 point is
      an artefact of charging a 2^30-point store in a group of 2^3 elements. Report the
      cheaper set as INTERVALS and report monotone_after_crossover per cell, so a first
      crossing and a persistent crossover are distinguishable. Label the artefact rather
      than excluding it.
    - >-
      IMPLEMENT THE SPARSE WORKING SET INDEPENDENTLY (ARM I). Write (nm)^4/24 columns at
      n^3/m nonzeros per row from KN-LIT-e77232's statement of the formula. DO NOT read
      memory_charged_cost.py's semaev_memory_log2 before writing yours, and do not import
      it. Then compare cell by cell and reproduce KN-LIT-e77232's own n = 571 arithmetic
      (2^46.38 columns, 2^23.89 nonzeros, 2^70.3 total against the record's 70.2718).
      This term moves the n = 409 verdict by about 20 bits, it is currently computed once
      in this repository, and the blind joint that should have checked it could not
      because the review plan misstated it. If your implementation disagrees, REPORT BOTH
      and do not pick one.
    - >-
      COMPARE AGAINST recomputations.json BUT NEVER IMPORT IT, AND DO NOT CALL THE
      AGREEMENT INDEPENDENT. This experiment consumes the red team's report as an input,
      so it computes what that report argued for. Agreement is a comparison against your
      own source. Say so in the manifest.
    - >-
      DO NOT EDIT ANY COMMITTED RECORD. COST-SEMBIN-8d123b, RUN-SEMBIN-121b59,
      RUN-SEMBIN-aa5161, joint_balance.py's published outputs, the reviewer reports, and
      every ledger record are immutable. Corrections supersede by reference and never
      overwrite (core rule 4). The four corrections travel in YOUR record.
    - >-
      DO NOT NARROW THE GRID TO MAKE A PREDICTION COME OUT. Eight numeric predictions are
      preregistered in the contract with a Coordinator prior recorded before execution. If
      a predicted value is missed, REPORT THE MISS. A miss is a result; a grid trimmed
      until the prediction lands is a fabrication.
    - >-
      OBSERVATIONS ONLY. Write no evidence record, move no hypothesis status, close no
      open problem, and state no conclusion about the security of any curve. This
      experiment corrects a comparison between two heuristic cost models. If your report
      reads as a statement about whether B-409 or K-409 is safe or attackable, it is
      wrong in both directions.
    - >-
      WRITE ONLY inside the declared write_scope below. Do not commit; the Coordinator
      makes the snapshot commit.
    - >-
      VERIFY THE COST RECORD'S FIGURES WITH A CHECKER, NOT BY HAND. Three vow_time_log2
      figures were mis-transcribed by hand into COST-SEMBIN-8d123b earlier in this batch,
      which is why verify_record_transcription.py exists. Reuse or extend it and run it
      against your own COST-* record before reporting done.
    - >-
      DEMONSTRATE DETERMINISM. Everything here is closed-form arithmetic with no
      randomness. Execute twice and diff, and report that the outputs differ only in
      timestamps.

  deliverables:
    - ARM R reproduction-gate comparison, cell by cell against COST-SEMBIN-8d123b and
      against recomputations.json, with the largest disagreement in bits
    - >-
      ARM N: the prime-field nearby-object control instantiated from EXP-ICEX-c32447,
      with its verdict, or an UNREACHED record naming the concrete missing piece
    - >-
      ARM S: the full surface as data, one record per grid cell, with crossover_n and
      margin_at_409 and every cell fully labelled
    - the collision pairs -- every pair of cells returning the same crossover for
      different reasons -- exhibited rather than merely counted
    - >-
      the crossover's range over store_log2 set BESIDE its range over the metric set, per
      storage reading, on both the parent contract's declared grid {30,40,48,60} and the
      full grid. This pair decides H-SEMBIN-97ea23's C2.
    - >-
      ARM B: the coherent-baseline shift in n and in bits, under both storage readings,
      for own_curve_product_minimum and sect113r2_calibrated_ratio, plus the
      Pareto min-of-own-curves comparison and the per-n product excess (predicted
      constant at 29.0 bits)
    - >-
      ARM F: the memory-budget disagreement band with its boundaries and the m attaining
      Semaev's cheapest memory, under both hard and soft readings; and the alpha flip
      threshold per storage reading per FIPS label
    - >-
      ARM I: the independent sparse working-set implementation, its largest cell-wise
      disagreement in bits, and the KN-LIT-e77232 n = 571 cross-check
    - >-
      the matched-null decomposition against BOTH nulls, with degeneracies labelled as
      degenerate
    - >-
      the corrected cofactor direction with its per-h shifts, and K-409 charged separately
      from B-409 with the Frobenius discount stated
    - the kappa sensitivity, with every crossover carrying its kappa
    - >-
      C10: every storage reading compared against the 34 MAGMA memory measurements in the
      frozen source's Tables 1-2, under BOTH readings of the MB column (peak and total
      over 100 systems), with per-row residuals in bits and whether each accounting
      upper-bounds every row. DO NOT PICK a reading of that column: two sources in this
      repository disagree and the disagreement is reported, not settled.
    - >-
      the widening of the dense/sparse gap with N -- about 7 bits at N ~ 50 where the
      measurements are, 19-21 bits at N = 2790-6286 where the claims are -- stated
      explicitly, because the parent did not disclose it
    - all ten control outcomes stated SEPARATELY, with C5 (eq. 4) explicitly labelled a
      typo detector rather than a validity check
    - the near-optimal region width in m per metric and per budget, not only the argmin
    - a COST-* concrete cost record, checker-verified
    - a determinism check showing two executions diffing only in timestamps
    - >-
      an explicit statement that no degree was measured, that Assumption 1 is unvalidated
      on this host, and that the degree-5 sensitivity (+19.4 bits at n = 409) exceeds
      every effect this experiment measures

  artifact_paths:
