handoff:
  id: TASK-20260830-a1cb32
  from: coordinator
  to: executor
  objective: >-
    Execute the FROZEN, coordinator-approved contract EXP-MONO-12ce1c
    exactly as written: determine, by symbolic derivation plus a
    categorical toy-scale census, whether the m-th Semaev summation
    cover's geometric monodromy is the elementary abelian sign group
    (Z/2)^{m-2} (Part A), and whether the factor-base-sublocus root-
    multiplicity collision rate matches the forced values driven by
    2-torsion (Part B). Record observations only; render no verdict on
    H-MONO-45183a.
  uncertainty_reduced: >-
    Whether the m-th Semaev summation cover's monodromy group is provably
    NOT the full symmetric group at m>=4 (contradicting KN-OPEN-009's
    stated premise) but rather the much smaller elementary abelian
    (Z/2)^{m-2}, acting regularly — a derivation this contract checks by a
    zero-compute symbolic identity plus a categorical (not distributional)
    Frobenius cycle-type census, and whether the factor-base sublocus's
    root-multiplicity partition carries a genuine, curve-dependent
    (tau-driven) signal where the already-established cycle-type statistic
    does not (EV-MONO-a0a89c OBS-5).
  inputs:
    - >-
      experiments/EXP-MONO-12ce1c/specification.yaml (READ IN FULL — it is
      extremely detailed and nearly self-sufficient — exact seed
      derivation rule, prime/curve/factor-base construction procedures,
      dual-path cross-check design, and every stopping/invalidation rule
      are already specified precisely; follow it literally, do not
      improvise around any underspecified-seeming detail without first
      re-reading the relevant section)
    - >-
      ledger/hypotheses/H-MONO-45183a.yaml (the full derivation this
      contract checks — Part A steps A-1 through A-3, Part B steps B-1
      through B-3)
    - >-
      ledger/evidence/EV-MONO-a0a89c.yaml (the m=3 baseline this
      contract's Stage 0 must reproduce exactly — OBS-2, OBS-3, OBS-5)
    - knowledge/open-problems/KN-OPEN-009.md
    - AGENTS.md
  constraints:
    - >-
      Follow experiments/EXP-MONO-12ce1c/specification.yaml EXACTLY; it is
      frozen. Every construction procedure (prime, curve, factor base,
      seed derivation) is specified as an exact, reproducible algorithm —
      implement it literally, not "in spirit."
    - >-
      STAGE 0 IS A HARD, ZERO-COMPUTE GATE. Verify the symbolic identity
      (freq_split(m=3) formula matches EV-MONO-a0a89c OBS-3's committed
      closed form exactly, including the diagonal correction) and evaluate
      both forms on the 105 curves of RUN-MONO-4b50b6-002 BEFORE writing
      any curve-construction or census code. A failure here means STOP —
      the derivation is wrong, report failed_infrastructure-adjacent
      Stage-0 failure (this is a genuine negative finding about the
      DERIVATION, not infrastructure — report it as such per the
      contract's own falsification_criterion (a), escalate per AGENTS.md
      rule 12, and do not proceed to any further stage).
    - >-
      THE TAU-COVERAGE PRECONDITION (tau in {1,2,4} on the 8-curve panel)
      IS A HARD PRECONDITION FOR STAGE 3. If the constructed panel does
      not achieve it, Stage 3 IS NOT RUN — report it as unmet, do not run
      a degraded 2-point control, and do not let this block Stages 0-2 and
      Stage 4's other arms from proceeding.
    - >-
      THE ORDERING CONTROL IS MANDATORY: both positive controls and both
      measured nulls must be generated, classified, and their outputs
      SHA-256-committed BEFORE any treatment specialization (Stage 2/3
      main arms) is classified. Report the commitment hashes and their
      timestamps relative to the treatment classification.
    - >-
      THE DUAL-PATH CROSS-CHECK IS MANDATORY: Path 1 (direct signed-sum
      construction in F_{p^2}, no summation polynomial) and Path 2
      (explicit S_m via the resultant recursion, sympy is available in
      this session's environment — the contract's own 2026-08-05
      environment note recording sympy's absence is stale for THIS
      session; pure-Python-only is still the contract's own requirement
      and either approach is compliant, but Path 2 may use sympy for the
      resultant if convenient, since the contract requires no CAS rather
      than forbidding one) must agree on >=2000 specializations per
      (curve, m) with ZERO disagreements. Run the required fixture check
      (deg_T S_4 = 4, deg_T S_5 = 8, S_3 vanishes at x(P+-Q)) before Path 2
      is trusted for anything.
    - >-
      POSITIVE CONTROL 1 (random quartics vs S_4 Chebotarev) is an
      absolute gate: if it fails, NO RESULT MAY BE REPORTED FROM ANY ARM,
      positive or negative, per the contract's own outcomes.instrument_failure.
    - >-
      Ramified and diagonal strata must be reported separately and NEVER
      pooled into the main statistic, at every stage.
    - >-
      No hypothesis, experiment, or goal status change. No relation-rate,
      ECDLP, cost, or exponent claim of any kind, in either direction —
      this contract determines a Galois/monodromy group and two induced
      statistics, nothing about attack cost.
    - >-
      Any timeout, crash, construction failure, or dual-path disagreement
      is `failed_infrastructure`/`invalid`, never negative mathematical
      evidence about H-MONO-45183a or any ECDLP proposition (AGENTS.md
      rule 3; the contract's own infrastructure_failure_disposition).
    - "Exactly 2 runs, seeds 20260805 and 20260806 per the contract's own `replication`."
  deliverables:
    - experiments/EXP-MONO-12ce1c/implementation.md
    - experiments/EXP-MONO-12ce1c/implementation/ (source code)
    - experiments/EXP-MONO-12ce1c/runs/RUN-MONO-12ce1c-1/
    - experiments/EXP-MONO-12ce1c/runs/RUN-MONO-12ce1c-2/
    - execution_report.yaml (per docs/evidence-and-reproducibility.md)
  artifact_paths:
    - experiments/EXP-MONO-12ce1c/implementation.md
    - experiments/EXP-MONO-12ce1c/implementation/
    - experiments/EXP-MONO-12ce1c/runs/RUN-MONO-12ce1c-1/
    - experiments/EXP-MONO-12ce1c/runs/RUN-MONO-12ce1c-2/
  archived_by: TASK-20260830-b17c06
  inference:
    policy: executor-implementation
    reasoning_effort: medium
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
    reasoning_effort_basis: >-
      Bound by .claude/agents/executor.md effort medium and
      orchestration/roles.yaml role executor -> default_policy
      executor-implementation -> reasoning_effort medium. Bounded,
      spec-following implementation of an already-fully-designed contract;
      not design or ideation.
  budget:
