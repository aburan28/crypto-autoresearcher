    memory_gb: 2
    maximum_runs: 2
  completion_gate:
    - "Stage 0's symbolic identity check (and its 105-curve evaluation) reported before any Stage 1-4 work."
    - "Stage 1 prior-art read log reported (or explicitly recorded as not performed if network is unavailable)."
    - "Both positive controls and both measured nulls reported, with pre-treatment commitment hashes and timestamps, before treatment arm results."
    - "M1-M4 reported for every applicable (curve, m) cell, both runs, with ramified/diagonal strata reported separately."
    - "Dual-path cross-check disagreement count reported (must be 0) for at least 2000 specializations per (curve, m)."
    - "tau-coverage precondition outcome reported explicitly (met/unmet) before any Stage-3 result is interpreted."
    - >-
      Run manifests bind git commit, dirty flag, seeds, environment,
      field_bits, timing, resources, per docs/evidence-and-reproducibility.md,
      using the NESTED manifest schema (see
      experiments/EXP-MONO-a20e48/runs/*/manifest.yaml for the exact
