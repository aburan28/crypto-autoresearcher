handoff:
  id: TASK-20260822-8df232
  from: coordinator
  to: executor
  objective: 'Measure the COSET STRUCTURE that decides whether degree 8 is reachable. On the committed
    GOAL-ECRANK-001 pool: (1) reproduce the k = 3 optimum of 20 as a regression fixture; (2) extend
    the twist support beyond 7 primes and re-run the k = 3 and k = 4 optimisation; (3) measure, across
    cosets, how the k = 3 total decomposes into the maximum single-class rank and the contribution
    of the other 7 classes, and whether those two are separable.'
  uncertainty_reduced: Whether the k = 3 total is approximately (max class rank) + (a constant),
    which is the assumption behind any claim about what base rank degree 8 would require.
  inputs:
  - experiments/EXP-ECRANK-e1e30e/runs/RUN-ECRANK-e1e30e-001/pool.json
  - experiments/EXP-ECRANK-e1e30e/source/twist_family.py
  - experiments/EXP-ECRANK-e1e30e/analysis.md
  constraints:
  - 'REGRESSION FIXTURE FIRST: reproduce k = 3 optimum = 20 on the committed pool with support [-1,2,3,5,7,11,13]
    before reporting any extended-support number. If you cannot reproduce it, STOP and report that
    -- it means the committed result or your re-implementation is wrong, and either way nothing downstream
    is believable.'
  - 'Certified counts only: a class contributes min(r_low, number of exhibited points).'
  - When a coset representative shares primes with a class, XOR cancels them and the points must
    be transported by (u,v) -> (u t^2, v t^3). GOAL-ECRANK-001 shipped this wrong once; it was caught
    by the exact verifier. Get it right and test it.
  - Descent timeouts contribute ZERO and are counted separately as timed_out, never as rank 0.
  - Write ONLY inside your write_scope. Never commit.
  deliverables:
  - regression fixture result (k = 3 optimum on committed pool and support)
  - extended-support k = 3 and k = 4 optima with the support used
  - 'a table of cosets: max single-class certified rank vs total, with the separability question
    answered by data'
  - the base rank that 31 at k = 3 would require under the measured relation, WITH the relation stated
    and its fit quality
  artifact_paths:
  - coordination/goals/GOAL-ECRANK-002/batches/BATCH-e0caa5/tasks/TASK-20260822-8df232/coset_structure.json
  - coordination/goals/GOAL-ECRANK-002/batches/BATCH-e0caa5/tasks/TASK-20260822-8df232/report.md
  - coordination/goals/GOAL-ECRANK-002/batches/BATCH-e0caa5/tasks/TASK-20260822-8df232/src/coset_structure.py
  archived_by: TASK-20260822-e7c486
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 2400
    memory_gb: 4
    maximum_runs: 40
  completion_gate:
  - regression fixture reproduced or explicitly reported as failed
  - separability question answered with a table, not an assertion
  return_format: 'executor execution report: measurements only, no interpretation of significance'
