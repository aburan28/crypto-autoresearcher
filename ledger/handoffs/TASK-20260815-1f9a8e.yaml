handoff:
  id: TASK-20260815-1f9a8e
  recorded_at: '2026-08-15'
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-86fd69
  task_card: coordination/goals/GOAL-ECDLP-001/batches/BATCH-86fd69/task-cards/TASK-20260815-1f9a8e/task_card.yaml
  role: coordinator
  archive_kind: snapshot
  runs_alone: true
  from: coordinator
  to: coordinator
  objective: >-
    Snapshot-commit the exact six declared TASK-20260815-3f7098 artifacts, plus
    this task's own self-neutral receipt, so that both independent reviews bind
    to immutable, hash-verified EXP-SYC-793304 bytes rather than to a working
    tree. This archive runs ALONE and before either review starts.
  uncertainty_reduced: >-
    Whether the independent Validator and Red Team can bind their recomputation
    to immutable, hash-verified successor bytes, which is the precondition for
    treating any later disposition as durable evidence.
  inputs:
    - TASK-20260815-3f7098
    - experiments/EXP-SYC-793304/specification.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-86fd69/tasks/TASK-20260815-3f7098/runtime-session-receipt.json
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-86fd69/tasks/TASK-20260815-3f7098/verification-and-null-kats.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-86fd69/tasks/TASK-20260815-3f7098/custody-and-executable-contract.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-86fd69/tasks/TASK-20260815-3f7098/physical-frontier-compiler.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-86fd69/tasks/TASK-20260815-3f7098/design-repair-report.yaml
  constraints:
    - >-
      Run ALONE. Never ask a concurrent worker to commit in this shared worktree;
      workers must not race on one Git index or HEAD.
    - >-
      Stage ONLY the declared paths: the six TASK-20260815-3f7098 artifacts plus
      this task's own snapshot-receipt.json. A scope-expanding commit is an
      evidence-integrity failure and blocks downstream review.
    - >-
      Fetch origin/main and MERGE it into the working branch before committing.
      Never rebase a branch carrying pushed run or archive records. Record the
      base commit checked and the merge outcome in the receipt.
    - >-
      Never resolve a sync conflict inside an immutable record by editing it; the
      resolution is a new superseding record under a new id.
    - >-
      Stop on any parse, diff, ledger-validation, or hash mismatch and report it
      as an infrastructure stop, never as a mathematical result.
    - >-
      Never rewrite or repair a producer artifact to make it commit cleanly. A
      defect returns to the producer as a scoped successor task.
    - >-
      No research inference, implementation, experiment execution, evidence
      promotion, or status transition. experiment_maximum_runs is 0.
    - No fallback, no degradation, no Amazon Bedrock.
  deliverables:
    - snapshot-receipt.json
  artifact_paths:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-86fd69/archives/TASK-20260815-1f9a8e/snapshot-receipt.json
  archived_by: TASK-20260815-1f9a8e
  archived_by_note: An archive task records its own receipt; it is self-archiving and self-neutral.
  covers_artifacts_of:
    - TASK-20260815-3f7098
  inference:
    policy: coordinator-orchestration-code
    requested_policy: coordinator-orchestration-code
    expected_resolved_model_id: anthropic:claude-opus-5
    resolution_command: python3 -m orchestration.adapter resolve --role coordinator
    resolution_command_output: coordinator-orchestration-code -> anthropic:claude-opus-5 (effort=high)
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 900
    memory_gb: 1
    maximum_runs: 1
    experiment_maximum_runs: 0
  completion_gate:
    - >-
      The commit stages exactly the six declared producer artifacts plus this
      task's self-neutral snapshot receipt, and nothing else.
    - >-
      The commit message names TASK-20260815-1f9a8e, TASK-20260815-3f7098, and
      EXP-SYC-793304.
    - >-
      The post-commit verifier accepts the exact parent, the exact changed-path
      set, every declared path_sha256, and the record IDs BEFORE either
      independent review starts.
    - >-
      origin/main was fetched and MERGED (never rebased) before this commit, and
      the base commit checked plus merge outcome are recorded in the receipt.
    - >-
      The branch is pushed and a PR against main is opened or refreshed naming
      EXP-SYC-793304, TASK-20260815-3f7098, and TASK-20260815-1f9a8e. A record
      that exists only in a local commit is unpublished, not durable evidence.
  return_format: >-
    A summary naming the snapshot receipt path, the commit and parent SHAs, the
    exact changed-path set with each path's SHA-256, the merge base checked and
    merge outcome, and the PR naming the archived records.
