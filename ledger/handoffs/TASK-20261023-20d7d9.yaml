    claim_under_review: 'For 40 primes 50 < p < 2000 with generator g and precision 4: the Teichmuller section is
      a homomorphism on every sampled pair and the functional log_p(s(x)^{p-1}) vanishes on it identically, so its
      Smart-style ratio is never defined; the naive-integer and random-Hensel sections are homomorphic on a fraction
      near 1/p of pairs and their ratio log_p(s(g^d)^{p-1})/log_p(s(g)^{p-1}) equals d mod p at a rate within 4
      standard errors of the mean of 1/p.'
    coordinator_prior: I expect the Teichmuller and Hensel clauses to hold and the naive-section falsification to
      be an artifact of the smallest-primitive-root choice that has no elliptic analogue; the risk is that the calibration
      is read as evidence about the elliptic case. This is a prior, not an outcome.
    joints:
    - id: R1
      joint: 'The F_p^* calibration says what the producer read: Teichmuller kills the functional, Hensel is at
        the random rate, and the naive excess is a small-integer effect, not p-adic leakage.'
      assigned_to: TASK-20261023-20d7d9
      attack_plan: 'Take the validator''s finding that a random primitive root gives expected z about 0.2: decide
        whether the hypothesis fixed the generator, whether ''falsified as posed'' is the right status, and whether
        the excess is a property of the section or of the generator. Decide what, if anything, transfers to the
        elliptic sections.'
      breaking_artifact: A reading under which the naive excess is a real section property, or an elliptic analogue
        the producer missed.
    - id: R2
      joint: The Fermat-quotient success test and its null are right.
      assigned_to: TASK-20261023-20d7d9
      attack_plan: 'Check the homomorphism-rate null (validator: true exactly when x y < p, expectation 9.35 and
        12.96, not 1/p) and the residual excess on seed 20261010 (7 observed against 3.24).'
      breaking_artifact: A null that misstates the expected rate, changing the falsification.
