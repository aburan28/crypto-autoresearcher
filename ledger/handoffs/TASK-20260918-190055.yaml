    degree at zero compute -- a very large extension bought very cheaply, which
    is exactly the shape of claim that must be broken before it is believed. If
    (2) holds, the FROB line's accumulated null results acquire a stated confound
    and a redesigned ladder. If either breaks, that is the cheaper and equally
    useful outcome.

