  objective: >-
    Attack two derivations and return a SEPARATE written verdict on each.
    (1) IDEA-20260918-6c07e1 (question RQ-QSP-f9bbdb): that no F_2-coefficient
    quasi-subfield polynomial X^(2^n') + lambda(X) splits completely over
    F_(2^131) at any n' in [2, 129], for any degree, because the root set is
    Frobenius-stable, 131 is prime so |V| = a + 131b with a in {0,1,2}, complete
    splitting demands |V| = 2^n' exactly, and 2^n' mod 131 lies in {1, 2} only at
    n' in {1, 130, 131} since ord_131(2) = 130.
    (2) IDEA-20260918-9abf42 (question RQ-FROB-7d8dd4): that for n an odd prime
    F_(2^n) has EXACTLY 2^f Frobenius-stable F_2-subspaces with
    f = 1 + (n-1)/ord_n(2), their dimensions being the subset sums of the
    irreducible factor degrees of T^n - 1; that at n = 131 this gives exactly
    four, of dimensions 0, 1, 130, 131; that this re-derives Proposition 2 of
    KN-LIT-4fe9d2; and that this program's toy ladders are uncontrolled for
    ord_n(2).
    Both are `status: proposed`, `novelty_status: unverified`, and BOTH WERE
    AUTHORED BY THE COORDINATOR THAT DISPATCHED THIS CARD. Treat that as an
    aggravating circumstance, not a mitigating one.

