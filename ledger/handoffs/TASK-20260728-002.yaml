handoff:
  id: TASK-20260728-002
  from: coordinator
  to: coordinator
  batch_id: BATCH-010
  goal_id: GOAL-ECDLP-001
  authorizing_decisions: [DEC-20260728-001]
  title: >-
    Snapshot-archive the EXP-RT1476-001 implementation and its 27 run records before any
    independent validation reads them

  objective: >-
    Commit the exact TASK-20260728-001 artifacts, unmodified, as ONE isolated snapshot commit, so
    that TASK-20260728-003 validates committed, hash-bound run records rather than working-tree
    text, and so that no later reader can be unsure which bytes were reviewed.
  uncertainty_reduced: >-
    Whether the run set and the implementation that produced it are durable and hash-bound before
    any judgement rests on them.

  inputs:
    - 'the exact TASK-20260728-001 artifacts at their declared paths, unmodified'
    - 'coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/batch.yaml'
    - 'docs/dynamic-subagent-dispatch.md, Commit and ledger gate'
    - 'templates/research-records.md, Coordinator archive receipt'
    - 'tools/research_dispatch.py'

  constraints:
    - 'RUN ALONE. No other task may hold the Git index or HEAD. This is an archival task and it is the only task in flight while it runs.'
    - 'Stage ONLY the declared paths (the TASK-20260728-001 artifacts plus this receipt). Preserve unrelated dirty files. Do not stage macOS AppleDouble siblings (._*), which are present throughout this repository.'
    - 'Do not edit, reformat, normalise, prettify or summarise any producer artifact. A snapshot commits what the producer wrote, verbatim. In particular do not touch any run record: run records are immutable and a gap in one is recorded, never filled.'
    - 'Compute every SHA-256 from GIT OBJECT CONTENT at the resulting commit (git show <commit>:<path> | shasum -a 256), never from the working tree. Never invent, estimate or back-fill a hash or a commit sha; a value that cannot be computed stays null and is reported as null.'
    - 'The commit message must contain the literal string TASK-20260728-002 and every entry of archive.record_ids. BATCH-004''s ledger archive is permanently blocked at 7 of 8 post-commit checks for omitting exactly this; do not repeat it.'
    - 'Run the full post-commit check: the commit resolves; it is an ancestor of HEAD; it has the declared first parent; it changes exactly the declared paths with no extras and no deletions; it matches every recorded SHA-256; and the message contains the task id and every record id. Record the per-check result and one verdict.'
    - 'THE RECEIPT MUST ACTUALLY EXIST AT ITS DECLARED PATH. BATCH-009 defect D3 was that TASK-20260727-004''s snapshot_commit_receipt.json was never written, leaving the artifacts a whole determination rested on bound by nothing. Write it, and if any check fails, record the failure and STOP.'
    - 'If any check fails, an archive failure is an EVIDENCE-INTEGRITY FAILURE, never a mathematical result, and never a reason to re-run or re-interpret the experiment.'
    - 'Change no ledger record, no experiment specification and no research status. This is a commit task and it exercises no judgement about the results.'
    - 'Do not read the results for meaning and do not form a view about the exponents. That is TASK-20260728-003''s and the Coordinator''s work, in that order.'

  deliverables:
    - 'coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/archives/TASK-20260728-002/snapshot_commit_receipt.json with kind snapshot, source_task_ids, record_ids, the declared path list, commit_sha, parent_sha, a COMPLETE path_sha256 over every declared path computed from Git object content, and a post_commit_verification block giving the per-check result and one verdict.'

  artifact_paths:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/archives/TASK-20260728-002/snapshot_commit_receipt.json
  write_scope:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/archives/TASK-20260728-002/
  read_scope:
    - experiments/EXP-RT1476-001/
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/
    - docs/dynamic-subagent-dispatch.md
    - templates/research-records.md
    - tools/research_dispatch.py
  archived_by: TASK-20260728-002
  archived_by_note: 'Self-archiving. An archival task carries its own receipt; this is the same pattern as TASK-20260727-004.'
  review_required: false
  depends_on: [TASK-20260728-001]

  archive:
    kind: snapshot
    source_task_ids: [TASK-20260728-001]
    commit_sha: null
    parent_sha: null
    path_sha256: {}
    record_ids: [BATCH-010, EXP-RT1476-001, TASK-20260728-001]
    declared_paths_fixed:
      - experiments/EXP-RT1476-001/subresultant_meter.py
      - experiments/EXP-RT1476-001/implementation_notes.md
      - experiments/EXP-RT1476-001/analysis.md
      - experiments/EXP-RT1476-001/results_summary.json
      - experiments/EXP-RT1476-001/runs/INDEX.json
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/tasks/TASK-20260728-001/execution_report.yaml
      - coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/archives/TASK-20260728-002/snapshot_commit_receipt.json
    declared_paths_expanded_from_index:
      source: experiments/EXP-RT1476-001/runs/INDEX.json
      rule: >-
        Every run-record file listed in INDEX.json is also staged and individually hash-bound. The
        expansion is MECHANICAL from a committed producer artifact, not discretionary: read the
        index, take the file list verbatim, stage exactly those files, and record a SHA-256 for
        each. Do not glob the directory and do not add or omit a file by judgement. If the
        directory contains a file the index does not list, or the index lists a file that is not
        present, STOP and record the discrepancy - that is a producer defect, not something for
        the archive to resolve.
      why_expressed_this_way: >-
        The effective declared-path set cannot be written out in advance because the run set does
        not exist until TASK-20260728-001 runs, and a stopping rule may legitimately reduce it. It
        is expressed as a fixed list plus a mechanical expansion so that "changes exactly the
        declared paths" stays a checkable property: the receipt records the FULL expanded list,
        and that list is what the post-commit verifier checks against.
    declared_paths_note: >-
      PATH-SHAPE REPAIR. The first draft listed 'experiments/EXP-RT1476-001/runs/ (every
      RUN-RT1476-* directory produced, ...)' here - a directory with a parenthetical, which is not
      a path at all. Replaced by the exact file INDEX.json plus the mechanical expansion rule
      above. The obligation is unchanged and if anything sharper: every run file is still staged
      and still individually hash-bound.
    expected_parent: 'the BATCH-010 opening commit, whose sha is recorded by the opening archive and must be read from Git rather than assumed'

  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false

  budget:
    wall_clock_seconds: 600
    memory_gb: 2
    maximum_runs: 1

  completion_gate:
    - 'The receipt EXISTS at its declared path and is committed.'
    - 'Exactly the declared paths were staged and committed, with no extras and no deletions, and no ._* AppleDouble file was staged.'
    - 'Every run FILE listed in experiments/EXP-RT1476-001/runs/INDEX.json is enumerated individually in path_sha256; a directory named only as a prefix is not a binding.'
    - 'The staged file set equals the INDEX.json file list exactly, plus the fixed declared paths. Any file present on disk but absent from the index, or listed but absent on disk, stopped the task with the discrepancy recorded.'
    - 'The receipt records the FULL expanded declared-path list, so that "changes exactly the declared paths" is checkable against it.'
    - 'Every SHA-256 was computed in this task from Git object content; no value was copied from an unverified source.'
    - 'The commit message contains the literal TASK-20260728-002 and every archive.record_ids entry.'
    - 'The post_commit_verification block records a result for each required check and exactly one verdict.'
    - 'No producer artifact was modified, no run record was touched, experiments/EXP-RT1476-001/specification.yaml is unchanged, and no ledger record or research status was altered.'
  return_format: 'Coordinator snapshot archive receipt JSON with a per-check post-commit verification block.'
  created_by: coordinator
  created_at: '2026-07-28'
