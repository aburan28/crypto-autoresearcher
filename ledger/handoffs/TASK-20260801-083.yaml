handoff:
  id: TASK-20260801-083
  from: coordinator
  to: coordinator
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-027
  experiment_id: EXP-LPF-001
  hypothesis_id: H-LPF-001
  run_id: RUN-LPF-001-measure
  archive_kind: ledger
  objective: >-
    After the Validator and the Red Team complete - verify run validity FIRST, then
    file EV-LPF-001 for the measurement package if admissible, apply RR-LPF-2 to
    classify the result into exactly one of L-0, L-1, L-5, L-2, L-3 or L-4 in the
    declared precedence order, write the close decision as DEC-20260801-014,
    transition H-LPF-001 only along the branch the rule assigns, and checkpoint
    GOAL-ECDLP-001 with exactly one next action.
  uncertainty_reduced: >-
    What the first measured smoothness distribution of a genuine Semaev
    intermediate in this campaign actually establishes, bounded exactly, and the
    single ranked next action for BATCH-028.
  inputs:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-027/reviews/TASK-20260801-081/validation_report.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-027/reviews/TASK-20260801-082/red_team_report.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-027/reviews/TASK-20260801-077/tool_change_review.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-027/archives/TASK-20260801-080/snapshot_commit_receipt.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-027/archives/TASK-20260801-078/snapshot_commit_receipt.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-026/reviews/TASK-20260801-068/contract_review.yaml
  - experiments/EXP-LPF-001/specification.yaml
  - experiments/EXP-LPF-001/reading_rule_v2.yaml
  constraints:
  - RUN ALONE.
  - >-
    VERIFY VALIDITY BEFORE INTERPRETING - expected arm counts, schema-complete
    manifest, seed and stream integrity, driver-hash equality, 100 percent
    factorization verification plus the validator's independent refactoring
    agreement count, raw versus summary agreement, control comparability. An
    invalid or incomplete set goes back to the Executor with concrete defects and
    is NOT evidence.
  - >-
    IF THE VALIDATOR RETURNED NOT ADMISSIBLE, DO NOT INTERPRET. File no evidence
    record, state the defects, and close the batch as an invalid run - which is not
    a mathematical result in either direction.
  - >-
    APPLY RR-LPF-2 AS WRITTEN, IN ITS DECLARED PRECEDENCE ORDER L-0, then L-1, then
    L-5, then exactly one of L-2, L-3, L-4. Do not amend it, do not add a branch,
    and do not read the result into a branch it does not satisfy. Quote the branch
    condition, the observed statistic values, the archived bands and the R(u) table
    for BOTH arms in the decision.
  - >-
    If any L-0, L-1 or L-5 leg fired, the rule is SUSPENDED, the outcome is
    inconclusive ON THE INSTRUMENT, and nothing is asserted about HEUR-DS-1 in
    either direction.
  - >-
    CARRY THE RTB-054-6 LIMB B DECLARATION WITH EVERY LIMB B STATEMENT. LIMB B is
    not a symmetric 8x test at these cells and a band exit at bits 16 u = 5 is a
    weaker fact than [1/8, 8] makes it look.
  - >-
    READ DIRECTION ONLY FROM STAT-RATE-u, per OPEN-RR052-D as ruled and extended. A
    STAT-KS-DICK band exit is non-directional and same-signed excursions across
    cells are not directional agreement.
  - >-
    OPEN-RR066-A BINDS - an empty certified list may be cited as absence of
    CERTIFIED POWER and NEVER as absence of MEASURED MOVEMENT.
  - >-
    UNDER L-3 THE REFUTATION ARTIFACT IS MANDATORY AND MUST BE ARCHIVED IN OR
    BEFORE THIS SAME COMMIT - the independently re-verified
    deviation_certificate.json, with proof_status `counterexample_certificate`
    rather than `empirical_only`, and THE DIRECTION OF THE DEPARTURE STATED. The
    disposition is `weaken` on HEUR-DS-1's TOY INSTANCE, scoped exactly.
    `reject_scoped`, and in particular reject_scoped-as-impossibility, is FORBIDDEN
    on a single unreplicated run.
  - >-
    UNDER L-2, `support` IS FORBIDDEN AND HEUR-DS-1 IS NOT VALIDATED AT ANY TIER.
    State the licensed English exactly and state the scale gap in numbers.
  - >-
    UNDER L-4, STATE PLAINLY THAT THE EVIDENCE CANNOT DISCRIMINATE AND THAT AN L-4
    OUTCOME CARRIES NO DIRECTIONAL INFORMATION. It is the single most likely non-L-2
    outcome on a correct null.
  - >-
    EVERY QUANTITATIVE SENTENCE MUST NAME THE ARCHIVED ARRAY IT IS COMPUTABLE FROM
    (PERTURB-TAIL-1). An unnamed array is a refusal to write the sentence.
  - >-
    STATE EXPLICITLY WHETHER OPEN-BATCH023-A IS DISCHARGED. It is discharged only by
    a valid measurement run, and if any suspending leg fired or the package was not
    admissible it SURVIVES INTACT and must be said to survive.
  - >-
    RECORD THE FINAL STATUS OF DEF-065-1 - DISCHARGED BY SUPERSESSION if
    TASK-20260801-077 passed, half-discharged otherwise - naming the registry entry
    as the evidence.
  - >-
    WRITE THE H-LPF-001 status_history ENTRIES FOR `approved` AND `running` with
    recorded_retrospectively true, each naming the task and the committed receipt
    that effected it, exactly as pre-declared in status_history_policy_batch025. Do
    not invent a date or an authorization.
  - >-
    BEFORE WRITING THE RECORDS, re-list ledger/decisions and ledger/evidence and
    confirm DEC-20260801-014 and EV-LPF-001 are BOTH free in the CURRENT tree
    including anything merged from origin/main since this queue was opened. If
    either is occupied, renumber OUR record and never the other party's, and file a
    queue amendment binding the declared set, artifact_paths and write_scope
    together.
  - >-
    RUN tools/validate_ledger.py BEFORE STAGING and record the error count in the
    receipt.
  - >-
    Do not claim crypto-scale, medium-scale or asymptotic support. Toy stays toy.
    Promotion gates G1-G4 stay OPEN. No `support` under any branch.
  - >-
    Cite no calibration number and no plant-Z number as evidence about any
    hypothesis. RUN-LPF-001-calib and RUN-LPF-001-plantz are expressly
    non-evidential in either direction under CAL-LPF-1.
  - >-
    Restate ABS-REL-LPF-1 and ALT-CLASS-LPF-1 IN FULL in the evidence record and in
    the decision, with V1 through V12 as RESTATED BY RR-LPF-2. A statement of a
    distributional result without its uncertified list is an overclaim by omission.
  - >-
    DO NOT EDIT experiments/EXP-LPF-001/reading_rule.yaml, reading_rule_v2.yaml,
    specification.yaml, lpf001_driver.py, any run package or any tools/ file. Do
    not alter H-SMTH-001, H-EQD-001, H-DEP-001, H-DS-001, H-IC-001 or H-STR-002, do
    not re-score EV-EQD-001 or EV-DS-001 through EV-DS-004, and do not edit any
    file under experiments/EXP-SMTH-001/, experiments/EXP-DS-001/,
    experiments/EXP-EQD-001/ or experiments/EXP-DEP-001/. Leave FAEST and XEDN
    alone.
  - >-
    FILL knowledge_promotion EITHER WAY. Judge KN-CAND-BATCH024-A against its
    trigger (b), which is now arguably met on the artifact since RTB-068 passed and
    this batch used the instrument. Judge KN-CAND-BATCH023-A on its route (b).
    Judge whether the measurement itself warrants a KN-FIND, remembering that
    promotion requires `support` or `reject_scoped` on replicated or strong
    evidence and that a single unreplicated toy run is neither. If promoted, the
    KN-FIND entry and the regenerated knowledge/INDEX.md go in THIS SAME commit
    under /curate-knowledge conventions and require a queue amendment enlarging the
    declared set first. If not, give a concrete not_warranted reason for each.
  - >-
    Carry every declared open item forward stating for each whether it was
    repaired, mitigated or left open, and rank the dependence-power repair,
    RT049-CTRL-5, RT049-CTRL-2, route (b) of KN-CAND-BATCH023-A, the CENTRED-LIMB-B
    successor contract, the deep-tail perturbation family and the signed-(D+, D-)
    driver revision into the BATCH-028 opening rather than dropping them.
  - >-
    Preserve every existing field and note in GOAL-ECDLP-001.yaml verbatim;
    supersede by addition and preserve exactly one next action.
  - >-
    Commit message must contain TASK-20260801-083, EV-LPF-001, the filed decision
    id, H-LPF-001, EXP-LPF-001, RR-LPF-2, GOAL-ECDLP-001, BATCH-027.
  - Do not push from this task.
  - Every YAML and JSON file written must parse.
  deliverables:
  - ledger/evidence/EV-LPF-001.yaml
  - ledger/decisions/DEC-20260801-014.yaml
  - ledger/hypotheses/H-LPF-001.yaml
  - ledger/goals/GOAL-ECDLP-001.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-027/archives/TASK-20260801-083/ledger_commit_receipt.json
  artifact_paths:
  - ledger/evidence/EV-LPF-001.yaml
  - ledger/decisions/DEC-20260801-014.yaml
  - ledger/hypotheses/H-LPF-001.yaml
  - ledger/goals/GOAL-ECDLP-001.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-027/archives/TASK-20260801-083/ledger_commit_receipt.json
  archived_by: TASK-20260801-083
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 7200
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
  - >-
    Post-commit verifier accepts the exact seven-path Git diff and file hashes;
    validity verified before interpretation with the validator verdict quoted; the
    decision quotes the frozen branch condition it fired, the observed statistic
    values against their archived bands and the R(u) table for both arms; the
    RTB-054-6 LIMB B declaration carried with every LIMB B statement and direction
    read only from STAT-RATE-u; every quantitative sentence naming the archived
    array it comes from; the L-3 deviation certificate archived and independently
    re-verified with its direction stated if that branch fired; ABS-REL-LPF-1 and
    ALT-CLASS-LPF-1 restated in full with V1 through V12; the OPEN-BATCH023-A
    discharge stated explicitly either way; the DEF-065-1 final status recorded with
    the registry entry as evidence; the H-LPF-001 retrospective status entries
    written with their effecting artifacts; both reading rules, the specification
    and the driver confirmed still unedited; the Red Team's objections answered on
    the record; knowledge_promotion filled with every candidate judged; every
    declared open item carried; exactly one next action preserved in the goal
    record.
