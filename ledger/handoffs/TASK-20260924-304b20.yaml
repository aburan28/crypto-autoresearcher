      - EXP-NISTBIN-451dfa
      - IDEA-20260922-7d6d43
      - BATCH-7d29e8
      - GOAL-ECDLP2M-001
      - TASK-20260924-fda726
      - TASK-20260924-304b20
    binding_mode: content_at_commit
    binding_mode_note: >-
      The hypothesis and specification have a life after this archive (later
