  constraints:
    - Stage only the three declared files and this receipt, one by one. git add -A is forbidden.
    - NEVER edit a file while staging. A malformed file is committed as malformed and reported.
    - >-
      Any file the producer wrote outside its declared artifact_paths is named in
      the receipt as a scope finding and NOT staged.
    - Merge origin/main first; merge, never rebase.
    - >-
      The commit message names TASK-20260924-304b20 and every archive record id
      literally, and states no value and no verdict.
    - ZERO RUNS.
  deliverables:
