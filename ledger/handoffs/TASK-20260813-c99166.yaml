handoff:
  id: TASK-20260813-c99166
  recorded_at: '2026-08-13'
  from: coordinator
  to: executor
  goal_id: GOAL-QRE-001
  batch_id: BATCH-973b49
  objective: Construct the reversible circuits for modular exponentiation (RSA-2048 shape)
    and elliptic-curve point addition (256-bit prime field shape) and report exact Toffoli
    and T counts as a function of bit width n, with every constant DERIVED from the construction
    rather than cited. Validate by simulating the identical circuits classically at small
    bit widths and checking they compute the right function on exhaustive or randomly sampled
    inputs.
  uncertainty_reduced: Whether this program can produce its own arithmetic-layer counts, which
    are the instrument for reproducing any published total and the one input every headline
    number is linear in.
  inputs:
  - GOAL-QRE-001
  - RQ-QRE-6dba8c
  constraints:
  - 'ABSOLUTE PROHIBITION, APPLIES TO EVERY ARTIFACT: no date, no timeline, no arrival probability,
    no forecast, no migration or policy advice. Admissible output is ''under these stated
    physical assumptions the pipeline gives X'' and how X moves when an assumption moves.'
  - 'PRE-REGISTER the counting convention BEFORE counting: gate set, whether T-count is derived
    from Toffoli at a declared ratio or counted directly, ancilla accounting, and measurement/uncomputation
    policy. A count without its convention is not comparable to anything.'
  - 'Every constant is DERIVED from the construction. No constant may be cited from a paper:
    no paper has been filed and RQ-QRE-6dba8c requires each constant sourced or derived.'
  - 'Validation is BLOCKING: a circuit whose classical simulation does not compute the intended
    function at small bit width is not counted, and its count is not reported.'
  - Report counts as a FUNCTION OF n with the fitted form and its residuals, not as a single
    number at one width -- the sensitivity deliverable needs the function.
  - Observations only. Do not interpret, do not compare against any published total (none
    is filed), do not change any status, and do not write evidence or decision records.
  deliverables:
  - PREREGISTRATION.md with the frozen counting convention
  - 'counts.json: Toffoli and T counts vs n for both circuits, with fitted forms'
  - 'validation.json: classical simulation results at small bit widths, per circuit'
  - execution_report.yaml
  artifact_paths:
  - coordination/goals/GOAL-QRE-001/batches/BATCH-973b49/tasks/TASK-20260813-c99166/PREREGISTRATION.md
  - coordination/goals/GOAL-QRE-001/batches/BATCH-973b49/tasks/TASK-20260813-c99166/counts.json
  - coordination/goals/GOAL-QRE-001/batches/BATCH-973b49/tasks/TASK-20260813-c99166/validation.json
  - coordination/goals/GOAL-QRE-001/batches/BATCH-973b49/tasks/TASK-20260813-c99166/execution_report.yaml
  archived_by: TASK-20260813-884e20
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 3000
    memory_gb: 4
    maximum_runs: 40
  completion_gate:
  - Counting convention pre-registered before any count
  - Classical simulation passes at every declared small bit width, per circuit
  - Counts reported as functions of n with residuals
  - Every constant derived, none cited
