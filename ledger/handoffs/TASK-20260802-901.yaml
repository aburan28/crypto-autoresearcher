    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 1800
    memory_gb: 4
    maximum_runs: 0
  completion_gate:
    - >-
      tools/test_validate_ledger.py::LedgerCoverageTests::test_legacy_inventory_covers_and_freezes_every_root_record
      passes (the `records` map again equals the observed root-level ledger set).
    - >-
      tools/test_validate_ledger.py::LedgerCoverageTests::test_legacy_id_remaps_resolve_to_canonical_records
      passes unchanged (remapped_ids was not edited).
    - >-
      tools/validate_ledger.py reports zero "new root-level ledger record is
      forbidden" errors and zero "duplicate ID" errors for
      DEC-20260724-001..004 and DEC-20260727-001..003.
