handoff:
  id: TASK-20260802-901
  from: coordinator
  to: coordinator
  kind: ledger_archive
  objective: >-
    Archive the (A)/(B) root-ledger relocation and ID remap authorized by
    DEC-20260802-001 and recorded in CORR-20260802-014, as one isolated ledger
    commit, then verify the post-commit receipt before the repair is treated as
    durable. This task carries no research claim.
  inputs:
    - ledger/decisions/DEC-20260802-001.yaml
    - ledger/corrections/CORR-20260802-014.yaml
    - tools/legacy_ledger_inventory.yaml
    - tools/test_validate_ledger.py
  constraints:
    - Stage ONLY the declared paths below. A scope-expanding commit blocks the repair.
    - >-
      Make no edit to tools/legacy_ledger_inventory.yaml. Neither `records` nor
      `remapped_ids` may gain an entry; see CORR-20260802-014 `affects`.
    - >-
      Make no edit to tools/validate_ledger_baseline.txt in this commit. The
      re-baseline is a separate decision and a separate commit.
    - Merge origin/main into the working branch before committing; never rebase.
    - >-
      Resolve no sync conflict inside a ledger record by editing it. A conflict is
      a new superseding record under a new id.
    - Run this task alone; no concurrent worker commits into this worktree.
  deliverables:
    - The ledger commit, reachable from HEAD, changing exactly the declared paths.
    - The commit receipt (commit sha, parent sha, per-path sha256, record ids).
    - >-
      A fresh `python3 tools/validate_ledger.py` run on the committed tree, with
      the total new-error count and the per-category breakdown reported back to
      the Coordinator before any further action on (D).
    - A pushed branch with an open or refreshed PR against main naming the records below.
  artifact_paths:
