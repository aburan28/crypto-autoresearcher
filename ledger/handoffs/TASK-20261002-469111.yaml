  constraints:
    - 'ZERO work beyond Stages 0-1. Stage 2 (the m = 3 wrapper), any SAT/SMT arm, the cells (29,10), (41,14), (47,16), a second curve per n, any D >= 6 closure, and any deployed-curve or n = 131 run are NOT authorized.'
    - 'Cell (35, 12) starts only after gate G1 (C-GATE) passes on (23, 8). Stage 1 starts only after the Stage-0 self-checks pass and stage0/precommit-hashes.json (hashes of every other stage0/ file with UTC timestamps) is written BEFORE the first closure invocation.'
    - 'The pinned instruments are read only and used UNCHANGED: closure.py, macaulay.py, gf2n.py, curve.py, elim.py, stats_exact.py, verify_cert.py (the latter reference only). Instrument by SUBCLASS in new files; a derived copy of closure.py only if a subclass cannot express the change, with a recorded unified diff, C-EQUIV and C-BASE re-run against the copy. C-PIN recomputes sha256 and git blob ids and STOPS on any difference from the contract table (an instrument mismatch voids the run and is never negative evidence).'
    - 'numpy must be 2.4.6 (PCG64 streams); a different version is a STOP. Set RLIMIT_AS to 3 GiB. One worker; OMP and OPENBLAS threads 1.'
    - 'maximum_runs 3 (one scientific run plus at most two re-runs after INFRASTRUCTURE failures; every failed attempt retained). Never overwrite a run record.'
    - 'Sample counts are fixed by the contract (60 unsatisfiable OBJ, 30 NULL, 20 PLANTED, up to 20 SAT-NAT, 10 EASY, 30 RANDU per cell) and are not truncated by wall-clock; a shortfall is recorded, never redrawn.'
    - 'Satisfiability ground truth is the exact enumeration oracle A, cross-checked by the verifier''s exhaustive 2^{2l} evaluation; never a closure.'
    - 'Every counted refutation requires a verified wdag-v1; every counted W_4 non-refutation of an OBJ or NULL instance requires a verified ann-v1 or is counted under the contract''s worst-case rule. A timeout, memory abort or crash is UNDETERMINED(budget) or failed_infrastructure, never a mathematical result. A D = 5 closure that cannot finish within the 3 GiB cap is UNDETERMINED(budget), never not refuted.'
    - 'The verifier verify_ladder.py runs as a SEPARATE PROCESS, imports nothing from impl/, from EXP-CERTBIN-e94b27, from EXP-CERTBIN-060020 or from crypto_autoresearcher, and asserts this.'
    - 'Any refuted satisfiable instance (planted or natural), any failed certificate, any C-BASE mismatch, an easy control not refuted at a rung that completed, or a pinned-instrument mismatch voids the run: stop, archive the evidence and report; do not continue past it.'
    - 'Amazon Bedrock is prohibited. Do not edit AUXIN records or paths. Do not edit any ledger, hypothesis, experiment, idea, decision or handoff record, and nothing under experiments/EXP-CERTBIN-e94b27, experiments/EXP-CERTBIN-4e92d7 or experiments/EXP-CERTBIN-060020.'
    - 'Do not invent identifiers; mint run ids with tools/allocate_id.py (--next run if supported, with --check) and record how each id was formed.'
    - 'Measured, recomputed and modeled columns stay separate. Report every rate with exact Clopper-Pearson 95 percent intervals under labellings L1, L2 and the adverse worst case; report satisfiable and unsatisfiable arms separately.'
    - 'You are the Executor: report observations and the contract''s mechanical decision-rule outputs; the Coordinator alone makes any official decision. Record that the candidate positive outcome is necessary, not sufficient, for the exponent claim (RATE IS NOT EXPONENT).'
