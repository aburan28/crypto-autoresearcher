handoff:
  id: TASK-20261002-469111
  from: coordinator
  to: executor
  objective: >-
    Implement and execute EXP-ECDLP-7d2a86 Stages 0-1 only. Stage 0 (zero
    scientific trials): the counting table, the size law and l* under H2, the
    power table, the inner-target stream rule, with a hash record written before
    any closure runs. Stage 1: the off-diagonal m = 2 ladder on the cells
    (n, l) = (23, 8) and (35, 12) (gate G1 passes on (23,8) first): W_3 and W_4
    (and M_3, M_4, and M_5 / W_5 as the contract states) on 60 unsatisfiable inner
    instances per cell, the same-support null (30), the planted-satisfiable (20)
    and natural-satisfiable (up to 20) controls, the deliberately easy control
    (10) and the random-u arm (30), the C-BASE regression on 15 archived n = 17
    systems, wdag-v1 certificates for every counted refutation, ann-v1
    certificates for every counted W_4 non-refutation of the object and the null,
    and a separate-process verifier. Record all artifacts under the write scope.
    Do not interpret results beyond the contract's decision rules and do not
    change any hypothesis, experiment or decision status.
  uncertainty_reduced: >-
    Whether the verified degree-4 mutant refutation rate of the unsatisfiable
    m = 2 inner S_3 object stays at or above 0.90 off Semaev's diagonal at
    (35, 12), the first approved cell where degree 4 is not generic by counting
    (E-BOUNDED-PARTIAL), or falls to or below 0.50 with the least refuting rung
    rising as the same-support null's does (E-DRIFT / E-DECAY), under certified
    soundness, visibility and null controls.
