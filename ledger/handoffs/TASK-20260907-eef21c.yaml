      breaking_artifact: A missing S0 file, a path_sha256 mismatch, a certificate
        other than none, or stage0.py bytes changed after the design snapshot.
    - joint: fixture_windows
      assigned_to: TASK-20260907-0ceec7
      attack_plan: From S0 raw-result.json alone, read checks and arms. Holds only
        if fixture_pass is true, all four checks are true, floor(Mx/p) M_delta is
        in [1.001, 1.004], floor(Mx/p) G is in [1.082, 1.086], sha G is in [1.080,
        1.084], and P2 G is in [19.9, 20.1]. Recompute each membership from the stored
        floats. Do not interpret W.
      breaking_artifact: A check false, fixture_pass false, or a stored value outside
        its frozen window.
    - joint: observation_not_disposition
      assigned_to: TASK-20260907-0ceec7
      attack_plan: Proves-too-much control. Read execution-report-stage0.yaml and
        the specification execution_authorized_stages. Holds only if SMALL_W_or_LARGE_W
        is false, execution_authorized_stages is exactly [0], a98ea9_stage5 is false,
        and the report does not change H-ECDLP-07c7c6. A recorded W value is an observation
        and is not a breaking artifact by itself.
      breaking_artifact: Report language that classifies W as SMALL-W or LARGE-W,
        authorizes Stage 1/2 or a98ea9 Stage 5, or changes H-ECDLP-07c7c6.
    blindness:
      mutual: true
      lifted_for: []
      rationale: null
    proves_too_much:
      objects:
      - A recorded W on floor(Mx/p), which is not a SMALL-W or LARGE-W outcome and
        does not license a Lemma 5 repair.
      - P2 G near 20 with W near 0, which is not an instrument failure and is not
        an attack.
      - A reading that would authorize Stage 1/2 or a98ea9 Stage 5 from this package.
      failure_signature: An argument that classifies SMALL-W or LARGE-W, supports
