        5 of EXP-ECDLP-a98ea9 has proved too much.
      assigned_to: TASK-20260907-0ceec7
    blind_rederivation:
      required: true
      quantity: 'At the frozen fixture curve y^2 = x^3 + 11 over F_65539 of prime
        order N=65287, M=40, let h(P) = floor(M * x(P) / p) with h(O)=0. Using the
        RT-EXP-1 exact convolution (analysis/o2-sum-compatible-filters/rt_exp_1.py
        bucket_gain): build the M-by-N indicator matrix of h on the dlog table, form
        W_s[k] by one M-axis FFT of the N-axis rFFTs, then num[s,c] = sum_{k: h(k)=c}
        W_s[k], den[s] = (n *_M n)[s], pi[s,c] = num/den. Report G = M * max_{s,c}
        pi[s,c] and Md = M * max_d of (sum_c num[(c-d) mod M, c] / N^2). Do not read
        experiments/EXP-ECDLP-5cad48/implementation/stage0.py, the S0 raw-result,
        the execution report, or the sibling validator report. Do not classify W.'
      parameters:
        p: 65539
        a: 0
        b: 11
        N: 65287
        M: 40
        filter: floor(Mx/p)
      blind_from:
      - experiments/EXP-ECDLP-5cad48/implementation/stage0.py
      - experiments/EXP-ECDLP-5cad48/execution-report-stage0.yaml
      - experiments/EXP-ECDLP-5cad48/runs/RUN-ECDLP-5cad48-S0/
