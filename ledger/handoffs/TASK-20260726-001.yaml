handoff:
  id: "TASK-20260726-001"
  from: "coordinator"
  to: "coordinator"
  objective: >-
    Convert IDEA-20260726-001 (multi-target IC amortization crossover) into a
    formal hypothesis H-IC-001 and a frozen, approved experiment contract
    EXP-IC-001 that measures T_desc vs sqrt(N) in group-operation equivalents
    and computes the crossover K* against the generic S*T^2 frontier.
  uncertainty_reduced: >-
    Whether the per-target descent cost in index calculus is below the birthday
    bound at toy scale, making the multi-target IC amortization question
    decidable.
  inputs:
    - "IDEA-20260726-001 (ledger/proposals/IDEA-20260726-001.yaml)"
    - "EV-FCP-002, EV-FCP-003 (Groebner timing data at 16-36 bits)"
    - "EXP-FCP-002 and EXP-FCP-003 run manifests (existing timing data)"
    - "AGENTS.md, docs/claims-and-verification.md, docs/evidence-and-reproducibility.md"
    - "templates/research-records.md, docs/task-lifecycle.md"
    - "harness/toycurve.py, harness/semaev.py, harness/fixed_curve_preprocessing.py"
  constraints:
    - "Review-only design work; do not implement, execute, or run any experiment."
    - "Create H-IC-001 in ledger/hypotheses/ with explicit test boundary, predictions, and falsification criteria."
    - "Create EXP-IC-001 specification in experiments/EXP-IC-001/specification.yaml with all required fields non-null."
    - "The experiment must convert Groebner wall-time to group-operation equivalents via a calibration step (measure rho wall-time per group-op at each bit size)."
    - "The experiment must measure T_desc (median Groebner solve time for S_{m+1} decomposition) in group-op equivalents across bit sizes 8-36."
    - "The experiment must compute K* = ceil((S_rel + S_LA) / (sqrt(N) - T_desc - T_verify)) when T_desc < sqrt(N), or K* = infinity when T_desc >= sqrt(N)."
    - "S_rel must be estimated or measured; at toy scale where no relations are found, use the generic heuristic S_rel ~ B * N^{m-1} / B^{m-1} * T_desc."
    - "The experiment must compare the crossover cost to the S*T^2 = Omega~(N) generic preprocessing frontier."
    - "Maximum claim tier is toy. No crypto-scale, breakthrough, or universal impossibility claim."
    - "The experiment should reuse existing FCP-002/003 Groebner timing data where possible and add the calibration step."
    - "Success criterion must be decidable from the predefined metrics — reject contracts where no possible outcome would count as negative."
    - "Record requested_policy coordinator-ultra-code, resolved model, fallback_used, and authorization_ref DEC-20260726-003."
  deliverables:
    - "ledger/hypotheses/H-IC-001.yaml"
    - "experiments/EXP-IC-001/specification.yaml"
  artifact_paths:
    - "ledger/hypotheses/H-IC-001.yaml"
    - "experiments/EXP-IC-001/specification.yaml"
  archived_by: "TASK-20260726-002"
  inference:
    policy: "coordinator-ultra-code"
    fallback_allowed: true
    fallback_model: "fireworks-ai/accounts/fireworks/models/glm-5p2"
    authorization_ref: "DEC-20260726-003"
    independent_session_required: false
  budget:
    wall_clock_seconds: 1800
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
    - "Both artifacts exist with all required fields non-null."
    - "The hypothesis has explicit predictions with metrics, directions, and minimum effects."
    - "The specification has inputs, controls, metrics, seeds, budget, stopping rules, success criterion, and falsification criterion."
    - "The success criterion is decidable and the experiment has a possible negative outcome."
    - "Exactly one next action is recorded."
  return_format: "YAML hypothesis record plus YAML experiment specification."
