handoff:
  id: TASK-20260726-001
  from: session
  to: coordinator
  objective: >-
    Review the draft JMV-2005 experiment suite (RQ-JMV-001, EXP-JMV-001..006) and decide
    approve / revise / reject per experiment. Decide whether RQ-JMV-001 is admitted to the
    ledger and whether it attaches to GOAL-ECDLP-001 (currently paused, three-batch budget
    exhausted) or opens a separate track.
  uncertainty_reduced: >-
    Whether a reduction-audit track on JMV 2005 is worth program budget, and at what scope,
    given that no experiment in the suite can produce an attack or an attack-cost improvement.
  inputs:
    - research/JMV2005_experiment_suite_20260726.md
    - ledger/questions/RQ-JMV-001.yaml
    - experiments/EXP-JMV-001/specification.yaml
    - experiments/EXP-JMV-002/specification.yaml
    - experiments/EXP-JMV-003/specification.yaml
    - experiments/EXP-JMV-004/specification.yaml
    - experiments/EXP-JMV-005/specification.yaml
    - experiments/EXP-JMV-006/specification.yaml
    - experiments/EXP-JMV-001/cpi_audit.py
    - ledger/EV-ISO-001.yaml
    - ledger/H-ISO-001.yaml
  constraints:
    - Only the Coordinator approves experiments or changes hypothesis status.
    - All six specifications are status=draft, approved_by=null. Do not treat any as approved.
    - >-
      The Figure 1 discrepancy in the suite doc Sec. 2 is SCOUTING, not evidence. It has no
      run record and no independent validation. It may not be cited as a finding until
      EXP-JMV-001 runs under review.
    - >-
      No experiment in this suite may be promoted as an attack, an attack-cost improvement,
      or a result bearing on GRH. Track B is a reduction cost audit and must not be framed
      as evading the D1 / BAR-AMORT-D2 exponent-neutrality barriers, which concern attacks.
    - EXP-JMV-006 is toy tier; a null result there closes the toy scope only.
    - Check non-duplication against RQ-ISO-001 / EV-ISO-001, ISOWALK-C1, and EXP-ISADV-001 (audited in suite doc Sec. 7).
  deliverables:
    - Per-experiment verdict (approve / revise / reject_scoped) with reasons
    - Decision on RQ-JMV-001 admission and its goal attachment
    - If any experiment is approved, a hypothesis record giving it a hypothesis_id
    - A ruling on whether the Figure 1 scouting result warrants a CORR- record path
    - A ruling on ingesting JMV 2005 as a KN-LIT entry (no entry exists; five other Jao papers are in the corpus)
  artifact_paths:
    - ledger/decisions/
    - ledger/questions/RQ-JMV-001.yaml
    - ledger/hypotheses/
  inference:
    policy: coordinator-ultra-code
    requested_policy: coordinator-ultra-code
    resolved_model: claude-opus-5
    fallback_allowed: true
    fallback_used: true
    independent_session_required: false
  budget: {wall_clock_seconds: 1800, memory_gb: 2, maximum_runs: 1}
  completion_gate:
    - Every experiment has an explicit verdict; none is left implicitly approved.
    - Any approval names the claim tier and the claim boundary it is approved under.
    - The scouting/evidence distinction is preserved in every written record.
  return_format: Write only declared artifacts and return a verdict summary.
  notes:
    - >-
      Model policy note per CLAUDE.md - this harness cannot resolve GPT-5.6 policy aliases;
      requested_policy is recorded with fallback_used=true and the actual resolved model.
