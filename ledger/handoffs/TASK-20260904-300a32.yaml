handoff:
  id: TASK-20260904-300a32
  from: coordinator
  to: idea-generator
  goal_id: GOAL-ECDLP-001
  batch_id: null
  batch_id_note: >-
    Ideation-only task opened under /propose-ideas step 3 on 2026-09-04 at
    user request ("create ideas for ssi and ecdlp"). NOT a batch of
    GOAL-ECDLP-001 and NOT part of BATCH-e6c1c9. It does not touch the D2
    lane, does not dispatch CAND-D2-A, and does not decide the admission of
    IDEA-20260901-b4e6eb -- all three are Coordinator actions ranked ahead of
    this one in the goal's next_action and are untouched by this task.
    Sibling ideation task on the SSI side of the same user request:
    TASK-20260904-9a7471.
  experiment_id: null
  hypothesis_id: null
  question_id: RQ-ECDLP-002
  recorded_at: '2026-09-04'
  objective: >-
    Generate SIX distinct, schema-complete, falsifiable proposals against
    RQ-ECDLP-002 -- does any novelty-screened public mechanism or verifiable
    methodology yield a fully charged reduction in prime-field ECDLP attack
    cost, or a credible independently checkable route toward one -- biased
    hard toward the exemplar profile in docs/target-result-profile.md
    (exponent-first, external structural ingredients, meet-in-the-middle
    splits, distribution heuristic + re-randomization, reduction-network
    cascades). The adjacent narrow questions RQ-ECDLP-165d4b (non-generic
    hardness census), RQ-ECDLP-160d89 (four-list join certificate) and
    RQ-ECDLP-912694 (special-j rational isogeny closure) are context and
    dedup surface, not the binding question.
  uncertainty_reduced: >-
    Which prime-field ECDLP mechanisms are worth the program's next unit of
    design budget given a 255-row ECDLP proposal pool, one live approved
    contract in the binary-digit cell, and a D2 lane whose remaining open
    object is a single unbounded degree gap.
  inputs:
    - ledger/questions/RQ-ECDLP-002.yaml (binding question)
    - ledger/questions/RQ-ECDLP-165d4b.yaml, RQ-ECDLP-160d89.yaml, RQ-ECDLP-912694.yaml (context)
    - ledger/proposals/IDEA-20260901-b4e6eb.yaml (unadmitted, 48KB; holds the transport lemma, prime-n settlement, r^3 cost point, redundant-not-lossy verdict, degree gap, composite-order control -- READ BEFORE proposing anything in that space)
    - docs/target-result-profile.md (checklist C1-C18)
    - inputs/P13-WESOLOWSKI-2026/paper_fulltext.md (exemplar; the transferable object is the METHOD, not the isogeny setting)
    - knowledge/techniques/KN-TECH-055.md, KN-TECH-056.md, KN-TECH-080.md
    - docs/inventor-protocol.md (whole, incl. section 8)
    - knowledge/open-problems/ (KN-OPEN-002 and neighbors)
    - knowledge/literature/ (7859 entries; grep by object name, do not enumerate)
    - ledger/proposals/ (1620 proposals; MANDATORY dedup, see constraints)
    - agents/idea-generator.md (schema and search heuristics)
    - templates/research-records.md ("Citation provenance")
    - AGENTS.md (core rules 1-16)
  constraints:
    - >-
      MANDATORY DEDUP BEFORE WRITING, and this goal has a STANDING PRACTICE
      about it. PD-1, adopted by the GOAL-ECDLP-001 coordinator on 2026-09-03:
      before generating on a named object, grep ledger/proposals/ for that
      object's identifier and read any hit. It was adopted because
      TASK-20260903-b1653a was dispatched without it and re-derived what the
      pool already held. A pre-built digest of the 255 existing ECDLP-adjacent
      proposal titles is at
      /tmp/claude-0/-home-user-crypto-autoresearcher/00e0faae-e3ef-5e1e-8042-c290e281f969/scratchpad/dedup_ecdlp.txt
      Read it in full FIRST, then grep per object. Every idea records
      `discriminated_from` naming the nearest existing IDEA-* by id.
    - >-
      DO NOT duplicate the LIVE approved contract in the binary-digit cell:
      H-ECDLP-a4be60 (specified) / EXP-ECDLP-56ee42 (approved, snapshot-archived
      2026-09-04). Read them before proposing in that cell; a proposal that
      re-poses their question is screened out, not filed.
    - >-
      The crypto-kb retrieval index is EMPTY in this environment
      (CRYPTO_KB_QDRANT_URL=':memory:'; search_knowledge returns nothing and
      says so in its startup log). You therefore have NO retrieval tool for
      external literature beyond WebSearch/WebFetch and the repo's own
      knowledge/ tree. Consequences, contract not preference: a reference you
      did not open is `provenance: recalled` with `verified_by: null`, an idea
      whose only literature is recalled is `novelty_status: unverified`, and no
      recalled citation may support `novelty_status: known` or `adaptation`.
      Naming the nearest work you can recall, hedged and marked, is WANTED;
      presenting a recollection as a checked source violates core rule 9.
    - Lawful defensive cryptanalysis using public constructions and toy benchmarks only. No targeting, recovery, or testing of live private keys, wallets, or deployed systems.
    - Pollard rho, BSGS, and the relevant generic-group and preprocessing lower bounds are MANDATORY matched controls in every minimal_test.
    - Every claimed solve or relation requires an independently reverifiable certificate; state what the certificate is and who re-verifies it.
    - Charge the full attack path -- preprocessing, memory, sparse linear algebra, serialization, transfer, and verification. State memory beside time and disclose what hides in o(1)/polylog.
    - >-
      A generic-group impossibility is a real constraint, not a formality: any
      idea claiming sub-rho on a generic prime-order group must name exactly
      which non-generic structure it consumes and where that structure is
      public. An idea that cannot name it is a `control` or `measurement`
      class proposal, not an `algorithm`.
    - >-
      Ideas are proposals only. Do not create or edit hypothesis, experiment,
      evidence, decision, or goal records; do not approve anything; do not
      assign work to the Executor.
    - >-
      Premature closure is a failure mode symmetric with overclaiming
      (docs/inventor-protocol.md). "Prime-field ECDLP is saturated" is a
      hypothesis about the search, not a reason to return fewer ideas.
  deliverables:
    - >-
      SIX idea records, one file each, written to the EXACT pre-allocated
      paths and ids below. Do not mint your own ids; you have no Bash and
      allocate_id.py is how ids are minted here.
    - ledger/proposals/IDEA-20260904-982159.yaml
    - ledger/proposals/IDEA-20260904-7caed1.yaml
    - ledger/proposals/IDEA-20260904-f68c7f.yaml
    - ledger/proposals/IDEA-20260904-ca8865.yaml
    - ledger/proposals/IDEA-20260904-f7ee90.yaml
    - ledger/proposals/IDEA-20260904-7582ba.yaml
  artifact_paths:
    - ledger/proposals/IDEA-20260904-982159.yaml
    - ledger/proposals/IDEA-20260904-7caed1.yaml
    - ledger/proposals/IDEA-20260904-f68c7f.yaml
    - ledger/proposals/IDEA-20260904-ca8865.yaml
    - ledger/proposals/IDEA-20260904-f7ee90.yaml
    - ledger/proposals/IDEA-20260904-7582ba.yaml
  write_scope:
