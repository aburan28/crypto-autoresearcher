handoff:
  id: TASK-20260724-249
  from: coordinator
  to: red-team
  objective: >-
    Try to falsify the interpretation and scope of the EXP-XEDN-002 result. The
    central target is model error, not arithmetic: whether the frozen surface
    family, section shape, and square predicate are the right formalization of the
    xedni lifting idea, and whether a closure of this family is being presented as
    more than it is.
  uncertainty_reduced: >-
    Whether a scoped closure of the function-field xedni census is honestly
    supported, or whether the exact answer settles a family that no serious
    lifting attack would have used.
  inputs:
    - experiments/EXP-XEDN-002 (verified snapshot)
    - experiments/EXP-XEDN-002/specification.yaml
    - ledger/hypotheses/H-XEDN-001.yaml
    - ledger/FINDING-PF-IC-001.md
    - ideas/artifacts/ECDLP-IDEA-005/p1543_global_lift_torsion_defect_gate.md
    - knowledge/literature/KN-LIT-020.md
    - knowledge/literature/KN-LIT-021.md
  constraints:
    - >-
      Write objections and falsification routes; do not change any official state
      and do not rewrite the executor's artifacts.
    - >-
      Attack specifically: the restriction a(t) = 0, the fixed section degrees,
      the exclusion of the y = 0 section, the choice of a uniform surface measure
      rather than a measure conditioned on specializing to a target instance,
      whether higher-degree or non-monic sections change the codimension, whether
      the Shioda-Tate rank bound is applied correctly, and whether the scoped
      codimension lemma silently assumes genericity.
    - >-
      State whether the conclusion is consistent with, weaker than, or stronger
      than the recorded ECFG-P1543 audited-route inconclusive result, and do not
      let this batch overwrite that record's scope.
  deliverables:
    - red_team_report.yaml with enumerated objections, each marked as fatal, scoping, or noted
    - objections.md with the cheapest next control that could overturn the conclusion
  artifact_paths:
    - coordination/goals/GOAL-ICLIFT-001/batches/BATCH-001/tasks/TASK-20260724-235/red_team_report.yaml
    - coordination/goals/GOAL-ICLIFT-001/batches/BATCH-001/tasks/TASK-20260724-235/objections.md
  archived_by: TASK-20260724-236
  inference:
    policy: review-xhigh
    fallback_allowed: true
    independent_session_required: true
  budget:
    wall_clock_seconds: 3600
    memory_gb: 2
    maximum_runs: 2
  completion_gate:
    - Every objection is classified and tied to a concrete artifact or claim sentence.
    - An explicit statement of the narrowest defensible claim boundary is provided.
    - The relationship to ECFG-P1543 and to KN-LIT-021 is stated explicitly.
  return_format: red_team_report
