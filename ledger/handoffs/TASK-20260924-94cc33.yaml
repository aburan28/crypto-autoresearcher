  review_plan_note: >-
    Not a claim-changing review round: it can move no hypothesis status, close
    no lane and support no headline claim; its only consumer is a protocol
    decision. Its design is written first, below, with one owner per joint,
    a worked attack per joint, a known-answer control and declared blindness;
