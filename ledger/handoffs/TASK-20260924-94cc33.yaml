          the sub-item the previous review left inconclusive. (3) Re-check
          RG-3 (a)-(d) with RH-3 (b) against r3_run_wrapper.py 437-440, 464 and
          r3_check_run.py 320-340.
      AJ-5_reads_reach_and_readers:
        reading: failclosed RFR-4, EXPLICITLY, and RFR-6 (informational), applied to RH-1, RH-2 and RH-4
        worked_attack: >-
          (1) RFR-4: CONFIRM, in the report's own words and with lines, that the
          values X-13 reads (a1_check_run.py 79-84) are the fields X-02 reads
          (r3_run_wrapper.py 190-196, called at 288-289), and that the carried
          RLR-2 / RKR-2 findings stand with no change since dd1034553 (CRG-2
          (d)); the previous review's card did not ask this. (2) RFR-6: list
          every reader, in the r3 base and the rules, of the RH-1 attribution,
          of solver-events.json's renamed_files as RH-1 (vi) reads it, of the
          spec files as RH-1 (v) reads them, of the RH-4 mark and of the RH-2
          class, and of raw_result_writer, the recorder-foreign file and the
          `undetermined` value as the difference changes them; state whether
          any changes what it computes (REG-1, the key and byte sweeps, the
          frozen checkers).
      AJ-6_value_classes_and_neutrality:
        reading: failclosed RFR-6 (informational), applied to RH-4 and RH-7
        worked_attack: >-
