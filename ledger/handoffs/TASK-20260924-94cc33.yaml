    (review_design.prior), to which this reviewer is blind.
  review_design:
    owner_of_every_joint: TASK-20260924-94cc33 (single reviewer)
    joints:
      AJ-0_known_answer_control:
        reading: failclosed RFR-0 (c), and CRG-4 (b)-(e)
        claim_under_attack: The reviewer's own method is sensitive enough to find the fail-open and planned-basis cases the previous rounds found, on rule text and on real package listings.
        worked_attack: >-
          Apply the method used for AJ-1..AJ-3, unchanged, to the objects CRG-4
          names, in the order (a)-(e). Report what the method actually did on
          each object, at record level and package level.
        failure_signature: A method that does not flag these objects cannot support "holds" on AJ-1 or AJ-2.
      AJ-1_attribution_and_callback_no_fail_open:
        reading: failclosed RFR-1 (definitions (i)-(v); (iv) read literally), applied to RH-1, RH-4 and their interaction with RG-1, RF-0..RF-3 and RL-1 / RL-3
        claim_under_attack: >-
          No RH-1 clause attributes a file written by a launch whose record is
          absent or by a process the rules do not know; RH-4 opens no route
          to a favourable child_end; and the RG-1 residuals the previous
          review recorded (an escaped child exiting 97, 98 or 99, or
          exec'ing; a second live child during a recorder call) have no
          supplying code in the repository or in the third-party code read.
        worked_attack: >-
          (1) For each RH-1 clause, construct a lost launch record whose files
          would be attributed to another record: two spec files naming the
          same out; a spec file rewritten after its launch; a renamed attempt
          file matched to the wrong attempt or to a launch of another tag; a
          callgrind argv naming a path another launch writes; a directory named
          by one argv only but written by two launches. (2) Definition (iv)
          LITERALLY: for the r3 / r4 wrapper's own records and for every
          exec'd argv program's outputs (build child, raw-grid child,
          comparator, msolve, valgrind, gp), state whether the writing process
          is known to the rules and whether the record is attributed, read by
          the verdict, or a gap. (3) RH-4 - a signal during the callback, and
          an exception inside the callback's own code. (4) The RG-1 residuals
          - X1, X6b, X10 of review TASK-20260924-1ecb7d (268-331) - re-examined
          against the r3 base and, optionally, the installed third-party
          source listed under inputs. (5) For each, fail-open (a break) or
          fail-closed (a finding)?
        where_it_may_break: Two launch records naming the same out; the attempt ordering in RH-1 (vi) where launches of one tag interleave; third-party code on an unwinding path.
      AJ-2_attribution_no_planned_basis_refusal:
        reading: failclosed RFR-2, applied to RH-1
        claim_under_attack: >-
          Every file that any launch of either plan writes on a normal path
          into child/, solver/, health/, comparator/ or pari/ is attributed by
          RH-1 or is on the non-launch list, so the gap rule refuses no planned
          basis outcome by design.
        worked_attack: >-
          (1) THE LISTING CHECK under gapattr: apply RH-1 (i)-(vi) and the
          non-launch list, as worded, to the full file listings of child/,
          solver/, health/, comparator/ and pari/ of RUN-GFPN-f6a21a,
          RUN-GFPN-902222, RUN-GFPN-f5412a and RUN-GFPN-bfe956 (launch sets
          reconstructed, CRG-9), and list EVERY file attributed to no launch
          record. (2) For each launch kind and normal outcome the r3 gate never
          produced - cells m = 5 and m = 4 (raw_grid, measured and
          not_measured targets), an SE-3 re-solve at S-1, an HR-3 re-solve at
          S-2, a failing and a timed-out callgrind child, the a1 gp and health
          children, uncached and cached builds, fixture4 - state from the
          frozen code which files are written and whether RH-1 attributes each.
          (3) For every unattributed file, whether its package is a planned
          basis outcome (definitions; RFR-2's enumeration).
        where_it_may_break: A valgrind side file, an msolve auxiliary file, a gp or health side file, a file of an HR-3 health re-solve, a file written on a refusal path of the child job.
      AJ-3_definitional_scope:
        reading: failclosed RFR-2, applied to RH-2 with childend RG-2
        claim_under_attack: >-
          No outcome RH-2 classes cap-mismatch stop is one the frozen
          sequencing is designed to act on as a planned basis, and RH-2
          changes no verdict; RG-2 and RH-2 together leave no PASS or PASS_ZL
          row of the close census's RKR-4 (b) table (md 476-492) changed.
        worked_attack: >-
          For each package kind of both r3 plans and each outcome with a
          collected pair unequal to the requested cap (P-8, P-9, and mixtures
          with other launches), state whether the frozen sequencing is
          designed to act on it, with lines, and whether RH-2 classes it.
          Check every RKR-4 (b) row. Report any other outcome that is a
          planned basis outcome by the definitions and FAILs by design,
          whatever its origin.
