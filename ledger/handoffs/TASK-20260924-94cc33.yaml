# AMD-EXP-GFPN-05ff43-20260924-gapattr and the DRAFT
# AMD-EXP-GFPN-05ff43-20260924-childend (RH-1..RH-8), and of that difference's
# interaction with everything incorporated.
# It runs no msolve, valgrind, callgrind_annotate, gp, Sage or builder child,
# creates no run package, and imports no module of the scanned trees.
