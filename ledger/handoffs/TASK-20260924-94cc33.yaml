# text. It must first reproduce known answers, including PB-2 and PB-3 on
# childend as worded. A fail-closed finding is reported and is never a bar.
# Ordered by DEC-20260924-61b22c. Written by the Coordinator under
# TASK-20260924-c9218d. This card launches nothing. Its one archival task is
# TASK-20260924-93f3ca.
# =============================================================================
