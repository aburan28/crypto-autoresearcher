handoff:
  id: TASK-20260907-d2164a
  from: coordinator
  to: executor-mechanical
  role: executor
  to_rationale: >-
    executor-mechanical, not executor: this task is a fully specified,
    judgment-free re-run of an already-existing, already-tested function
    (cost_ledger.py's model_charged_cost) at two named, fixed argument
    tuples, with a fixed, named output-recording format. Nothing needs
    debugging, interpreting, or completing.

  goal_id: GOAL-CRYPTO-001
  experiment_id: EXP-HZM-001
  hypothesis_id: H-HZM-001
  authorized_by: DEC-20260907-5b500d
  authorized_by_note: >-
    The ONLY citation used as this task's approval basis. This decision
    adopts experiments/EXP-HZM-001/amendments/v2_primary_gate_cost_check.yaml
    and authorizes exactly the one bounded computation this task performs.
  amendment: experiments/EXP-HZM-001/amendments/v2_primary_gate_cost_check.yaml

  objective: >-
    Call experiments/EXP-HZM-001/implementation/cost_ledger.py's
    model_charged_cost(N, L, d) function at EXACTLY two points --
    (N=4096, L=12, d=1) and (N=65536, L=16, d=1) -- and archive the
    complete output as a new run, RUN-HZM-001-c-primary-gate-only, under
    experiments/EXP-HZM-001/runs/. This is a closed-form, deterministic,
    curve-independent, seed-free computation: no toy curve instance is
    generated or read, no signature is constructed, and it does not
    depend on or resolve the general d in {1,2,3} manuscript-alignment
    question (H=1 at d=1 for any base, per the amendment's own
    verified_directly_by_this_coordinator section).

  constraints:
    - >-
      FROZEN SCOPE, NO DEVIATION. Call ONLY model_charged_cost(4096, 12, 1)
      and model_charged_cost(65536, 16, 1). Do not call it at any other
      (N, L, d). Do not import, call, or execute anything from
      signature_enumeration.py or brute_force_control.py. Do not generate
      or read any toy-curve instance. Do not attempt to resolve, re-audit,
      or re-open CTRL-HZM-MANUSCRIPT-ALIGNMENT at any d.
    - >-
      RECORD THE FULL OUTPUT VERBATIM. Every field of the returned
      ChargedCostModel (N, L, d, M_candidate_completions,
      H_signature_mass_as_pinned, q_success_probability,
      charged_expected_signatures, rho_bound, survives_rho_gate,
      optimistic_assumptions) for BOTH points, written into
      raw-result.json exactly as returned -- do not round, summarize, or
      omit the optimistic_assumptions list.
    - >-
      REQUIRED DISCLOSURE SENTENCE (verbatim, per the amendment's
      required_artifact): state explicitly, not merely by omission, that
      `charged_expected_signatures` is the H/q signature-count bottleneck
      term ONLY (per the function's own optimistic_assumptions
      disclosure), not a sum of all nine named charged_stages in
      specification.yaml's frozen_cost_ledger, and that the true
      fully-charged cost is therefore >= the reported figure at both gate
      sizes.
    - >-
      STATE H=1 EXPLICITLY. Record, in analysis.md or an equivalent
      summary field, that H_signature_mass_as_pinned=1 at both points
      because d=1 (binom(n,0)=1 for any base n), independent of the
      unresolved l-vs-l' manuscript base ambiguity.
    - >-
      NO CONCLUSION ABOUT H-HZM-001 OR THE GENERAL ALIGNMENT QUESTION. This
      run reports the two computed values and whether each survives the
      rho gate; it does not conclude that H-HZM-001 is supported or
      refuted (that is a Coordinator/Validator/Red-Team matter on review),
      and it makes no statement about CTRL-HZM-MANUSCRIPT-ALIGNMENT's
      general d in {1,2,3} status.
    - >-
      Timeouts and crashes are infrastructure signals, never negative
      results, per AGENTS.md rule 3.
    - >-
      Workers never commit. All artifacts are written only inside
      write_scope; the Coordinator alone performs the snapshot and ledger
      archival commits.

  deliverables:
    - "experiments/EXP-HZM-001/runs/RUN-HZM-001-c-primary-gate-only/manifest.yaml"
    - "experiments/EXP-HZM-001/runs/RUN-HZM-001-c-primary-gate-only/command.txt"
    - "experiments/EXP-HZM-001/runs/RUN-HZM-001-c-primary-gate-only/environment.json"
    - "experiments/EXP-HZM-001/runs/RUN-HZM-001-c-primary-gate-only/raw-result.json"
    - "experiments/EXP-HZM-001/runs/RUN-HZM-001-c-primary-gate-only/stdout.log"
    - "experiments/EXP-HZM-001/runs/RUN-HZM-001-c-primary-gate-only/stderr.log"
    - "experiments/EXP-HZM-001/runs/RUN-HZM-001-c-primary-gate-only/summary.json"

  artifact_paths:
    - experiments/EXP-HZM-001/runs/RUN-HZM-001-c-primary-gate-only/
  write_scope:
    - experiments/EXP-HZM-001/runs/RUN-HZM-001-c-primary-gate-only/
  write_scope_note: >-
    Does not touch experiments/EXP-HZM-001/runs/RUN-HZM-001-a/ or
    RUN-HZM-001-d/ (unaltered), does not touch
    experiments/EXP-HZM-001/implementation/ (cost_ledger.py is called,
    never edited), and does not touch specification.yaml or the amendment.

  review_required: true
  review_required_note: >-
    Per DEC-20260907-5b500d's review_requirement: independent
    review-adversarial review (validator + red-team, xhigh effort) is
    required before any evidence-review decision cites this run's
    charged-cost figures. Not satisfied by this handoff.

  inference:
    policy: executor-mechanical
    reasoning_effort: low
    fallback_allowed: true
    fallback_reason_if_used: >-
      Record the resolved model with fallback_used true and its reason if
      the harness cannot resolve the canonical policy alias. Never
      substitute silently (AGENTS.md rule 11).
    degraded_allowed: false
    independent_session_required: false

  budget:
    wall_clock_seconds: 300
    memory_gb: 1
    maximum_runs: 1
  budget_note: >-
    Trivially bounded: model_charged_cost is a pure closed-form
    combinatorial computation (sympy.binomial, float exponentiation),
    already timed at well under 1 second per call during this Coordinator's
    own independent verification.

  completion_gate:
    - >-
      raw-result.json contains the complete ChargedCostModel output for
      BOTH (4096,12,1) and (65536,16,1), every field present verbatim.
    - >-
      The required disclosure sentence (H/q bottleneck term, not a full
      9-stage sum) is present, and H=1-at-d=1 is stated explicitly.
    - >-
      No call to signature_enumeration.py, brute_force_control.py, or any
      toy-curve generator appears anywhere in command.txt or the run's own
      code.
    - >-
      No conclusion about H-HZM-001's status or the general alignment
      question is written anywhere in this run's artifacts.
    - >-
      Artifacts exist only under write_scope; nothing is committed by the
      Executor.

  archived_by: null
  archived_by_note: >-
    DELIBERATELY NULL. The dispatching session allocates the archival
    task id and sets this field before dispatch is treated as complete, or
    performs the snapshot commit directly as this session's own act.

  return_format: >-
    A short structured summary: both computed ChargedCostModel outputs in
    full, whether each survives_rho_gate, confirmation the required
    disclosure sentence and H=1 statement are present, confirmation no
    forbidden module/curve code path was touched, and actual wall-clock
    consumed.
