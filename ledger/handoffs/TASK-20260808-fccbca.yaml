  outcome_summary: >-
    CORR-20260808-d2568a: CONFIRMED WITH CAVEAT. T_A(256,1000)=72.211328
    under the superseded formula independently re-derived, 46.038672 bits
    outside band [118.25,118.75] -- matches. All red-team citations
    verbatim-accurate. One trivial prose slip found: "roughly 92 times the
    band's own half-width (0.25 bits)" should read full-width (0.5 bits);
    46.038672/0.25 is approximately 184, not 92. Immaterial to the
    substantive conclusion (the formula is false as written, confirmed).
    CORR-20260808-c792f8: CONFIRMED WITH CAVEAT. The central refutation (at
    w=2^30, the method loses to Delfs-Galbraith at all five sizes) is
    independently reproduced two ways -- from cost_model.py's own
    PAPER_PAIRS, and separately from cost_model.py's own fitted
    opt['log2T']/opt['log2M'] values in RUN-WESOVOW-001/raw-result.json
    (losses 12.37/19.62/25.82/28.63/36.28 bits under that anchor) -- and is
    therefore doubly confirmed and robust to anchor choice. The four
    newly-derived crossover values (69.6/77.7/91.8/109.0 at
    P=384/512/576/768), however, were computed from PAPER_PAIRS only;
    recomputing from cost_model.py's own fitted opt values instead gives
    69.2/81.6/87.3/102.6. At P=512 specifically this flips the qualitative
    conclusion within the tested range (w=2^30..2^80): PAPER_PAIRS puts the
    crossover at 77.7 (inside the tested range: method wins at w=2^80, by
    +1.15 bits); the model's own fitted anchor puts it at 81.6 (outside the
    tested range: method never wins within it, w=2^80 gives -0.82 bits).
    This anchor choice was not disclosed in the correction's text.
    P=384/576/768 are robust to the anchor choice (crossover conclusions do
    not flip). P=512's exact crossover value and its w=2^80 sign remain
    NOT citation-eligible until the anchor ambiguity is resolved.

