    budget_honesty: >-
      NO FIELD OF THIS BUDGET IS NULL; the Coordinator would reject its own handoff if one were.
      The per-part caps sum to 3300 s with 300 s reserved for artifacts, totalling the unchanged
      3600 s. Part A's cap drops from 1500 s to 200 s because it measured 1.9 s in v1 at the same
      bounds, and the released 1300 s goes to part C, which can use it. The 3 GB memory cap sits
      BELOW the templates/research-records.md floor of 8 GB and the reason is stated in the v1
      contract's objective as that template requires: every computation here is stdlib integer and
      Fraction arithmetic with an expected peak in the tens of megabytes, and v1 measured tens of
      MB against the cap. This 3600 s sits inside the campaign's declared 10800 s under an
      accounting convention that charges producer wall clock only and therefore understates true
      consumption -- a measurement convention, not a claim.
    budget_sizing_note: >-
      The frozen regions are sized to a PROJECTED consumption of about 1282 s, roughly 36 percent
      of the task budget and 39 percent of the 3300 s compute allocation, against v1's 23.8 s. The
      regions are deliberately NOT sized to fill the caps: a region sized to exactly fill its cap
      at a nominal throughput truncates on any slower machine, turning a COMPLETE measurement into
      a coverage fraction. The margin is about 2.5x against a sizing constant that itself carries
      1.4x over the v1-measured throughput -- roughly 3.5x end to end. See the amendment's
      `sizing_basis`.

