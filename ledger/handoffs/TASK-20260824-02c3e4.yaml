handoff:
  id: TASK-20260824-02c3e4
  from: coordinator
  to: executor
  goal_id: GOAL-ECQ-2298dc
  question_id: RQ-ECQ-e9b361
  experiment_id: EXP-ECQ-f5af06
  hypothesis_id: null
  hypothesis_id_note: >-
    No hypothesis of this program's own is under test, unchanged from v1. See
    experiments/EXP-ECQ-f5af06/specification.yaml hypothesis_id_note. This task certifies an
    external claim, tries to falsify that same external claim, and triages the object's neighbours
    under a corrected selection rule.
  batch_id: null

  record_status: >-
    THIS IS THE FIRST AND ONLY RECORD EVER WRITTEN AT THIS IDENTIFIER. It is authored on 2026-08-24
    BEFORE ANY RUN OF TASK-20260824-02c3e4 EXISTS. It dispatches a RE-RUN of EXP-ECQ-f5af06 under a
    versioned amendment; it does not retro-fit anything to TASK-20260824-261bb4, whose runs,
    deliverables and coverage fractions are immutable and stand as recorded.

  objective: >-
    RE-RUN THE THREE-PART PROTOCOL OF EXP-ECQ-f5af06 UNDER THE VERSIONED AMENDMENT
    experiments/EXP-ECQ-f5af06/amendments/PA-ECQ-f5af06-v2-triage-gate-sign.yaml, WHICH OVERLAYS
    THE IMMUTABLE v1 CONTRACT AT experiments/EXP-ECQ-f5af06/specification.yaml. TOGETHER THEY BIND
    IN PREFERENCE TO THIS PARAPHRASE. THE PURPOSE OF THE RE-RUN IS EXACTLY TWO THINGS AND NOTHING
    ELSE. FIRST, TO CORRECT A SIGN-INVERTED SELECTION RULE: v1's part-C gate took the TOP 20
    candidates by S = sum over p <= 500 of (a_p log p)/p, but S DECREASES with rank, so v1 gated
    the LOWEST-rank candidates in each arm. v2 gates the 200 candidates of SMALLEST S per arm --
    most negative first. THE DEFECT WAS THE COORDINATOR'S, NOT YOURS; v1's Executor applied the
    frozen rule exactly as written, refused to self-authorise a change, reported the inversion as a
    blocking finding and preserved every per-candidate score so this re-gate needs no new scoring
    run for the v1 candidates. That was correct on every count. SECOND, TO SPEND THE BUDGET: v1
    consumed 23.8 s of 3600 across 7 runs of 40, every frozen region sized far below what was
    available. v2 widens box B, the reduced box B-C, the twist range and the perturbation range,
    and gates 200 per arm instead of 20. EVERYTHING ELSE IS UNCHANGED, including the claim bar, the
    run-path requirement, the matched-null structure with the same rule on both arms, and the
    number-field interpretation limit.

  binding_text: >-
    TWO FILES BIND, IN THIS ORDER. experiments/EXP-ECQ-f5af06/specification.yaml is the parent
    contract and remains binding IN FULL. The overlay
    experiments/EXP-ECQ-f5af06/amendments/PA-ECQ-f5af06-v2-triage-gate-sign.yaml
    supersedes ONLY the clauses it names in its `changes`
    block; EVERY UNMENTIONED v1 CLAUSE REMAINS BINDING WORD FOR WORD. Where this handoff differs
    from either, THEY GOVERN and the difference is a defect to report. Read both directly rather
    than working from this envelope. A conflict between them that the overlay does not resolve
    explicitly is a BLOCKING SPECIFICATION DEFECT: report it and do not choose a preferred reading.

  uncertainty_reduced: >-
    Three things, in order of decision value. FIRST, whether the twist and near-neighbour
    neighbourhood of the record curve carries any certifiable rank when the triage gate points the
    RIGHT WAY -- the question v1 was supposed to answer and did not, and the cheapest available
    read on whether that neighbourhood deserves any further budget. SECOND, whether a 32nd
    independent point on no. 302 exists in a box roughly forty times larger than v1's, which is a
    cheap continued falsification test of the board's own rank-exactly-31 claim. THIRD, whether the
    twist arm and its matched null differ in triage-score distribution on a candidate set fifty
    times larger than v1's, with a threshold pre-registered on the subset that has never been
    scored.

  inputs:
  - experiments/EXP-ECQ-f5af06/specification.yaml
  - experiments/EXP-ECQ-f5af06/amendments/PA-ECQ-f5af06-v2-triage-gate-sign.yaml
  - coordination/goals/GOAL-ECQ-2298dc/tasks/TASK-20260824-261bb4/twist_search.json
  - coordination/goals/GOAL-ECQ-2298dc/tasks/TASK-20260824-261bb4/certification.json
  - coordination/goals/GOAL-ECQ-2298dc/tasks/TASK-20260824-261bb4/extension_search.json
  - coordination/goals/GOAL-ECQ-2298dc/tasks/TASK-20260824-261bb4/report.md
  - coordination/goals/GOAL-ECQ-2298dc/tasks/TASK-20260824-261bb4/scripts
  - coordination/goals/GOAL-ECQ-2298dc/inputs/ICARM-302.json
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-8b08ef/tasks/TASK-20260823-827765/scripts/exact_certify.py
  - coordination/goals/GOAL-ECQ-002/baseline/icarm_database_20260823.json
  - coordination/goals/GOAL-ECQ-002/baseline/frontier_20260823.json
  - ledger/goals/GOAL-ECQ-2298dc/goal.yaml
  - ledger/questions/RQ-ECQ-e9b361.yaml
  - ledger/handoffs/TASK-20260824-261bb4.yaml
  inputs_note: >-
    The v1 task directory is READ-ONLY INPUT. It is NOT in your write_scope and nothing in it may
    be edited, moved, regenerated or deleted, including its scripts. You MAY and SHOULD copy the v1
    scripts into your own task directory and modify the copies; the originals stay byte-identical
    so the diff between v1 and v2 is visible to a reviewer. exact_certify.py is REUSED, NOT
    REWRITTEN: any extension goes in a new file under your task directory that imports it.

  constraints:
  - >-
    THE GATE DIRECTION IS THE POINT OF THIS RE-RUN. SELECT THE 200 CANDIDATES OF SMALLEST S IN EACH
    ARM -- MOST NEGATIVE FIRST, equivalently the top 200 by -S -- and no others. S DECREASES WITH
    RANK; HIGH RANK IS THE MOST NEGATIVE END OF THE DISTRIBUTION. If your implementation sorts
    descending and takes the head, it has inverted the rule. Ties are broken by the v1 rule
    unchanged: smallest |D| (respectively smallest |v|), then positive sign before negative.
  - >-
    RUN CTL-GATE-DIRECTION BEFORE GATING ANYTHING, AND TREAT IT AS BLOCKING. Score 37a1, 389a1,
    5077a1 and ICARM no. 302 with the same implementation, prime bound and conventions used for
    both arms. PASS is S(37a1) > S(389a1) > S(5077a1) > S(no. 302) -- strictly decreasing against
    the certified rank lower bounds 1, 2, 3, 31 -- AND the gate routine returning them in the order
    302, 5077a1, 389a1, 37a1. Reference values under the v1 convention are about -4.06, -11.04,
    -18.10 and -38.83; a third-decimal difference is not a failure, a different ORDER or SIGN
    PATTERN is. Also score 11a1 for the record but DO NOT put it in the pass condition: rank 0 is a
    rank EQUALITY claim this program cannot certify. ON FAILURE, STOP: gate nothing in either arm,
    report the triage coverage and the score distributions only, and report the failure as a
    blocking defect.
  - >-
    THE FROZEN v2 NUMBERS ARE FROZEN AND ARE NOT YOURS TO CHOOSE. Box B: x = u/w^2 in lowest terms,
    w in [1, 100], gcd(u, w) = 1, |u| <= 30000000 for w = 1 and |u| <= 300000 for 2 <= w <= 100.
    Reduced box B-C: w in [1, 15], gcd(u, w) = 1, |u| <= 500000 for w = 1 and |u| <= 10000 for
    2 <= w <= 15. Twist arm: every squarefree D in [-10000, -2], every squarefree D in [2, 10000],
    and D = -1; D = 1 excluded. Null arm: a6 -> a6 + v for v in {-6000, ..., -1, 1, ..., 6000},
    zero-discriminant curves discarded WITH EVERY DISCARD RECORDED. Triage: S over p <= 500, same
    implementation and conventions in both arms, gate the 200 smallest S per arm. COMPUTE AND WRITE
    EVERY DENOMINATOR TO DISK BEFORE TESTING OR SCORING ANYTHING IN ITS REGION. The amendment
    carries the Coordinator's hand estimates for sizing only; THEY ARE NOT BINDING AND MUST NOT BE
    COPIED INTO ANY DELIVERABLE -- your exact counts govern, and if one disagrees with an estimate,
    the estimate is simply wrong.
  - >-
    A BUDGET SHORTFALL IS A COVERAGE FRACTION OVER THE UNCHANGED DENOMINATOR, NEVER A REDEFINITION
    OF THE DENOMINATOR. Report every coverage figure as numerator over denominator beside every
    negative statement in every deliverable. If a cap bites mid-region, stop and report the
    fraction. This is a contract term for the reason v1 states at length.
  - >-
    THE v1 SCORES ARE REUSED AND ARE THE VALUES OF RECORD FOR THE 443 CANDIDATES v1 SCORED. Read
    them from twist_search.json `all_candidates` -- 243 twist rows with 2 <= |D| <= 200 or D = -1,
    and 200 null rows with |v| <= 100 -- rather than re-deriving them, and tag every scored
    candidate with `score_source` valued `v1_reused` or `v2_scored`. NO NEW SCORING RUN IS NEEDED
    FOR THEM. BUT RUN CTL-SCORE-REUSE-AGREEMENT ANYWAY, because it costs about 2.4 s of a 600 s
    cap: re-score all 443 with your implementation and require agreement within 1.0e-06 absolute on
    every one. The reused v1 values remain the values of record; the re-score is a control. ON
    DISAGREEMENT the implementation has drifted, the pooled distribution is not one distribution,
    REUSE IS FORBIDDEN, and you report every disagreeing candidate with both values and stop the
    pooled statistics.
  - >-
    PIN THE TRIAGE CONVENTIONS EXACTLY AS v1 IMPLEMENTED THEM, because reuse depends on it. Include
    EVERY prime p <= 500, good or bad. #E(F_p) is the naive affine point count of the STATED MODEL
    over F_p plus the point at infinity, which at a bad prime is the count on the singular model --
    a uniform convention applied identically in both arms, NOT the arithmetic a_p of the curve.
    Score and gate both arms on the standard integral model [0, b2, 0, 8 b4, 16 b6]; twist arm
    [0, b2 D, 0, 8 b4 D^2, 16 b6 D^3]; null arm the same transformation applied to
    [1, 1, 1, a4, a6 + v].
  - >-
    THE MATCHED-NULL STRUCTURE IS UNCHANGED AND THE SAME RULE APPLIES TO BOTH ARMS. Same
    implementation, same prime bound 500, same gate rule, same gate depth 200, same reduced box.
    TRIAGE THE ARMS IN LOCKSTEP, alternating candidates, so a truncated run still yields a matched
    comparison rather than a complete twist arm and an empty null. Gate the arms in lockstep too,
    for the same reason. If an arm has fewer than 200 scored candidates, gate BOTH arms to the
    smaller count so they stay matched, and report the reduction as a fraction over 200.
    Differential attrition across arms voids the comparison whatever it shows; this program has
    manufactured a result that way once already.
  - >-
    NO FLOATING POINT IN ANY DECISION. Not in the torsion bound, the point counts, the mod-l linear
    algebra, the squareness test, a minimality decision or a classification. Floating point is
    permitted ONLY for reported logarithms of exact integers, for the Mestre-Nagao triage score,
    and for the descriptive between-arm statistics -- none of which decides a certification. State
    in the report where it appears and why it decides nothing.
  - >-
    EVERY GATED ROW IN BOTH ARMS CARRIES A NON-NULL `minimality_status` from the permitted values
    established_globally_minimal, minimal_at_all_primes_up_to_B_with_B_recorded, or
    not_established_with_reason. COMPUTE THE PARTIAL SCREEN: trial divide the exact discriminant by
    every prime p <= 100000 and, for each such p with p^12 dividing it, test whether the
    Kraus-Laska descent at p applies. LABEL THE RESULT PARTIAL. A partial screen DOES NOT satisfy
    claim-bar clause (1) and no artifact may say it does. Every part-C naive height is a height OF
    THE STATED MODEL and is labelled so. Global minimalisation is INFEASIBLE at any budget here --
    it needs the factorisation of 450-to-900-digit discriminants -- and you are not asked to
    attempt it. A certified rank lower bound from exhibited points is invariant under
    Q-isomorphism and needs no minimal model; minimality binds the CLAIM BAR, not the arithmetic.
  - >-
    THE NUMBER-FIELD TRAP, STATED CORRECTLY, BECAUSE AN EARLIER FRAMING OF IT WAS WRONG. What it
    forbids is ADDING RANKS: rank E(Q) + rank E^(D)(Q) = rank E(Q(sqrt D)), so pairing no. 302's
    rank >= 31 with a positive-rank twist to announce rank >= 32 OVER Q(sqrt D) is the rejected
    shape, and GOAL-ECQ-2298dc C1 is rank >= 32 OVER Q. What it does NOT forbid: a twist E^(D)
    whose OWN rank over Q is at least 32 IS a legitimate rank->=32 curve over Q and WOULD meet C1
    in full, subject to the claim bar. PART C'S DIRECTION IS SOUND; ONLY ITS GATE WAS BROKEN. NO
    ARTIFACT OF THIS TASK MAY DESCRIBE PART C AS STRUCTURALLY DISQUALIFIED, and no artifact may add
    a twist's rank to no. 302's. Report every part-C rank as a rank OVER Q of the named curve, with
    `field_of_the_reported_rank: Q` on every gated row.
  - >-
    RANK IS NOT TWIST-INVARIANT. The 31 points of no. 302 DO NOT TRANSFER to E^(D). E^(D) has its
    own Mordell-Weil rank, about which the rank of no. 302 says nothing, established from scratch
    by exhibited points on E^(D) itself. Any artifact that treats a twist as inheriting rank
    invalidates its own conclusion.
  - >-
    REPORT THE v1 RESULT BESIDE THE v2 RESULT AND NEVER IN PLACE OF IT. For each arm, reproduce
    v1's top-20 gated set with its certified ranks (0 in both arms) beside v2's bottom-200 gated
    set with its certified ranks, each labelled with the rule that produced it. THE v1 RESULT
    STANDS AS RECORDED. Deleting, overwriting or quietly superseding those rows is forbidden: the
    two gates answer different questions and both answers are part of the record. Likewise
    reproduce v1's B-NULL at 2347563 / 2347563 beside v2's box-B fraction.
  - >-
    CARRY v1's DESCRIPTIVE BETWEEN-ARM STATISTICS FORWARD UNCHANGED AND LABELLED DESCRIPTIVE:
    twist mean 1.479 against null mean 0.298, sd near 4.0 in both arms, ranges 20.1 and 23.1,
    Mann-Whitney z = +3.24, effect size 0.5895. NO SIGNIFICANCE THRESHOLD WAS PRE-REGISTERED IN v1
    AND NONE IS ASSERTED NOW. Note the direction when you report them: since S decreases with rank,
    the twist arm scoring HIGHER is the twist arm looking LOWER-rank than its null, the opposite
    direction from enrichment.
  - >-
    THE ONLY PRE-REGISTERED BETWEEN-ARM TEST APPLIES TO THE v2-ONLY SUBSET AND NOTHING ELSE: twist
    candidates with 200 < |D| <= 10000 and null candidates with 100 < |v| <= 6000, whose scores
    exist nowhere at dispatch time. Two-sided Mann-Whitney U with the normal-approximation z and
    the common-language effect size U / (n_twist * n_null). NOTABLE requires BOTH |z| >= 3.0 AND an
    effect size outside [0.45, 0.55]; both conditions, and the second is the operative one, because
    at twelve thousand per arm a z of 3.0 is reachable from an effect too small to mean anything.
    ANY POOLED STATISTIC OVER v1 AND v2 CANDIDATES TOGETHER IS DESCRIPTIVE ONLY and is labelled so.
    NOTABLE would license one replication on a fresh disjoint range and nothing else; it is not a
    rank result and the score certifies nothing.
  - >-
    WRITE RUN RECORDS DIRECTLY TO experiments/EXP-ECQ-f5af06/runs/RUN-<id>/, with run.experiment_id
    set to EXP-ECQ-f5af06 from the start, and manifests carrying the VALIDATOR'S schema -- id,
    experiment_id, status, code (commit and command), environment, inputs, timing, result -- not
    only producer-local field names. Each manifest sits beside command.txt, environment.json,
    stdout.log, stderr.log and raw-result.json in the same run directory. USE A v2 MARKER IN EVERY
    RUN ID so v1 and v2 runs are distinguishable at a glance, and DO NOT reuse or overwrite any v1
    run identifier. DO NOT write runs under the task tree. tools/validate_ledger.py indexes runs
    ONLY at experiments/*/runs/*/manifest.yaml; writing them elsewhere has cost this program FOUR
    post-hoc repair ports. Your write_scope includes experiments/EXP-ECQ-f5af06/runs for exactly
    this purpose and permits writing under runs/ ONLY -- specification.yaml AND the amendment file
    are FROZEN and are outside your write scope.
  - >-
    RUN ALL NINE CONTROLS AND REPORT EACH OUTCOME: the six from v1 -- CTL-CITED-INPUT-AGREEMENT,
    CTL-POSITIVE-INDEPENDENCE, CTL-NEGATIVE-INDEPENDENCE-PROVES-TOO-MUCH,
    CTL-SATURATION-DISTINCTION, CTL-MATCHED-NULL, CTL-PROVENANCE -- plus CTL-GATE-DIRECTION,
    CTL-SCORE-REUSE-AGREEMENT and CTL-MINIMALITY-DISCLOSURE. THE THREE MANDATORY ONES MUST PASS IN
    THIS RUN SET: claim-bar clause (5) requires it and a control that passed in v1 does not
    discharge it for v2. STANDING WARNING FROM v1's DEV-A-01: the 5077a1 triple
    {(-1,3), (0,2), (2,0)} IS DEPENDENT -- their sum is O -- and the correct rank-3 generators are
    {(-2,3), (-1,3), (0,2)}.
  - >-
    PART A IS RE-RUN FOR CALIBRATION, NOT FOR A NEW RESULT. Run the certifier at the v1-recorded
    bounds max_prime 1500, max_good_primes 250, torsion_primes 8, l in (2,3,5,7,11,13); raise them
    and record the exact values if you must. Re-run the independent re-verification that does NOT
    import the solver. A-FULL as recorded in v1 is NOT superseded, strengthened or re-earned by
    this. CTL-CITED-INPUT-AGREEMENT remains blocking: on_curve_failures must be EMPTY and the
    recomputed log max(|c4|^3, c6^2) and log|disc| must reproduce 468.2771 and 453.0469 to 4
    decimal places. A MISMATCH IS A BLOCKING DEFECT -- stop, report both values, interpret nothing
    further.
  - >-
    A PARTIAL PART-A CERTIFICATION IS A REPORTABLE RESULT, NOT A FAILURE. Report k of 31 with the
    point indices, the search bounds reached and the wall clock, carrying the certifier's own
    inconclusiveness wording verbatim: the uncertified remainder "may be dependent, or the search
    bound may be too small -- this is not evidence of low rank". k < 31 is a measurement of THIS
    INSTRUMENT at THIS budget, never evidence about the curve and never a defect in the board's
    claim.
  - >-
    CLASSIFY EVERY PART-B HIT BEFORE REPORTING IT. A point Q with m*Q in the subgroup generated by
    the 31 known points REDUCES THE INDEX and DOES NOT RAISE THE RANK. Pass every hit to the exact
    certifier as a 32-point set with the 31 known points and report it as rank-increasing ONLY if
    the certifier returns a certified rank lower bound of 32.
  - >-
    PERSIST EVERY ATTEMPTED CANDIDATE with an identifier, a status and a reason. Never let a
    dropped row fall into an arithmetic difference between attempted and reported: 462 families
    vanished that way in BATCH-541940. With roughly 24000 triage candidates, REDUCE AT SOURCE to
    summary rows if the per-candidate dump would breach the 25 MiB total or 5 MiB per-file artifact
    budget, and record sha256, row count and the exact regeneration command for anything retained
    out of band.
  - >-
    A TIMEOUT, ALARM, CRASH OR MEMORY EXHAUSTION IS AN INFRASTRUCTURE OUTCOME AND NEVER NEGATIVE
    MATHEMATICAL EVIDENCE (AGENTS.md rule 5). Record time_budget_reached, exit status and resource
    measurements per run. The only reportable consequence is a smaller numerator over an unchanged
    denominator. A run that dies on a bad flag is superseded by a successor run and BOTH stay on
    disk, exactly as v1 did with its two superseded runs.
  - >-
    REPORT MEASURED THROUGHPUT AGAINST THE AMENDMENT'S SIZING PROJECTIONS. The overlay projects
    about 10 s for part A, 192 s for part B, 131 s for part C triage, 934 s for the exact gate and
    15 s for the minimality screen, at a sizing constant of 2.0e-06 s per point test against a
    v1-measured 1.46e-06. State your actual seconds per point test and per triage score and your
    actual per-part consumption against both the caps and those projections. This is how the next
    contract gets sized correctly, and v1's under-spend is the reason it is asked for.
  - >-
    RANK >= 31 OVER Q IS THE LIVE WORLD RECORD AND IT IS CLAIMED (ICARM no. 302, posted
    2026-08-23). NO ARTIFACT MAY DESCRIBE IT AS UNCLAIMED; an earlier session in this program made
    exactly that error. Certifying no. 302 is a confirmation of SOMEONE ELSE'S result and an
    external positive control, never this program's own rank result.
  - >-
    CARRY THE PROVENANCE CAVEAT. The input was retrieved through a summarising fetch tool, not by
    direct page-source inspection, and the board comment string is unverified at source. Repeat
    that caveat wherever the board's data is relied on rather than dropping it.
  - >-
    IF A POSITIVE APPEARS -- a rank-increasing 32nd point in part B, or a gated part-C curve
    certifying rank >= 32 over Q for its own Mordell-Weil group -- DO NOT STOP the remaining
    coverage work, DO NOT attempt global minimality inline, and DO NOT state it as a result. Flag
    claim-bar clause (1) as OUTSTANDING, report the row, and let it route to independent
    `review-breakthrough` review at `max` effort in a separate session under AGENTS.md rule 12,
    with the six-clause claim bar discharged in full first. UNDER-CLAIM RATHER THAN OVER-CLAIM.
  - >-
    MAKE NO NETWORK CALL AND SUBMIT NOTHING TO THE ICARM ENDPOINT. A network call invalidates the
    run; a submission invalidates the experiment. The live-board re-read required by claim-bar
    clause (4) is a Coordinator step outside the runs.
  - >-
    cypari/PARI MAY NOT APPEAR IN ANY CERTIFICATION STEP. It is permitted only for the part-C
    Mestre-Nagao triage, where nothing is certified. v1 used it nowhere at all, including the
    triage, and matching that is preferred but not required.
  - WRITE ONLY INSIDE YOUR write_scope. NEVER COMMIT.

  write_scope:
  - coordination/goals/GOAL-ECQ-2298dc/tasks/TASK-20260824-02c3e4
  - experiments/EXP-ECQ-f5af06/runs
  write_scope_note: >-
    Two paths, non-overlapping with any other task. No other task in this campaign writes under
    either, and TASK-20260824-261bb4's task directory is DELIBERATELY EXCLUDED so v1's deliverables
    and scripts cannot be edited by this producer. The second path is included SOLELY so run
    records land where tools/validate_ledger.py indexes them, and it is scoped to runs/ and NOT to
    experiments/EXP-ECQ-f5af06 as a whole, so that BOTH the frozen v1 contract at
    experiments/EXP-ECQ-f5af06/specification.yaml AND the frozen overlay at
    experiments/EXP-ECQ-f5af06/amendments/PA-ECQ-f5af06-v2-triage-gate-sign.yaml sit outside the
    producer's write scope and cannot be edited by the agent executing them. Scripts and
    deliverables go under your own task directory.

  deliverables:
  - >-
    coordination/goals/GOAL-ECQ-2298dc/tasks/TASK-20260824-02c3e4/certification.json: part A. The
    a-invariants used; recomputed c4, c6 and discriminant as exact integers; recomputed naive
    height and log|disc| beside the cited 468.2771 and 453.0469 with agreement stated; the
    certifier's full output including on_curve_failures, the torsion bound and its primes, every
    independence attempt with its l and F_l-rank, the good primes used, and the indices certified
    independent; k as a number out of 31; the search bounds actually used; wall clock; and the
    outcomes of CTL-POSITIVE-INDEPENDENCE and CTL-NEGATIVE-INDEPENDENCE-PROVES-TOO-MUCH. State
    explicitly that part A is a calibration re-run and that v1's A-FULL is not superseded by it.
  - >-
    coordination/goals/GOAL-ECQ-2298dc/tasks/TASK-20260824-02c3e4/extension_search.json: part B.
    The frozen v2 box description reproduced verbatim; N_B_v2 computed and recorded BEFORE any
    candidate was tested; n_B; the coverage fraction; v1's 2347563 / 2347563 reproduced beside it;
    every hit with exact x and y and its classification as rank-increasing, index-reducing or
    dependent, with the certifier output that decided it; the outcome of
    CTL-SATURATION-DISTINCTION; measured seconds per point test; wall clock.
  - >-
    coordination/goals/GOAL-ECQ-2298dc/tasks/TASK-20260824-02c3e4/twist_search.json: part C. The
    frozen v2 twist range, perturbation range, reduced box and GATE DIRECTION reproduced verbatim,
    with the direction stated in words as "smallest S first"; the calibration table and the
    CTL-GATE-DIRECTION outcome; N_C_TWIST_v2, N_C_NULL_v2 and N_BC_v2 computed and recorded BEFORE
    any candidate was scored or tested; per arm the generated / discarded / scored / gated counts
    and coverage fractions; every scored candidate with its identifier, status, reason, S and
    `score_source`; the CTL-SCORE-REUSE-AGREEMENT outcome with the maximum absolute disagreement
    over the 443; the 200 gated curves per arm with exact c4, c6, discriminant, naive height
    labelled as of-the-stated-model, `minimality_status`, `field_of_the_reported_rank: Q`, the
    reduced-box coverage, the points found and the certified rank lower bound with its certificate;
    v1's top-20 gated set per arm with its certified ranks reproduced beside the v2 bottom-200 set,
    each labelled with the rule that produced it; v1's descriptive between-arm statistics carried
    forward unchanged and labelled descriptive; the v2 pre-registered comparison on the disjoint
    v2-only subset with its threshold restated and its verdict; and the provenance check outcome
    per reported curve.
  - >-
    coordination/goals/GOAL-ECQ-2298dc/tasks/TASK-20260824-02c3e4/report.md: what was run, what was
    measured, what failed, and WHAT WAS NOT REACHED AND WHY. The branch label for each part named
    explicitly and defended against its pre-declared condition, using the v2 part-C branches
    C2-NULL, C2-MODEST and C2-POSITIVE. A section stating THE GATE WAS INVERTED IN v1 AND IS
    CORRECTED HERE, naming PA-ECQ-f5af06-v2-triage-gate-sign, reproducing the calibration table,
    and stating in one sentence that S decreases with rank so the gate selects the most negative
    scores. A section reporting the v1 results beside the v2 results and stating that the v1
    results stand as recorded. The corrected statement of the number-field trap, including that a
    twist whose OWN rank over Q is at least 32 would meet C1 and that part C is NOT structurally
    disqualified. The minimality regime with its partial-screen results and the explicit statement
    that a partial screen does not discharge claim-bar clause (1). Budget consumption per part
    against both the v2 caps and the amendment's sizing projections, with measured throughput.
    Every negative carries its coverage fraction; every claim carries its scope; the provenance
