  expected_commit_path_set_note: >-
    EIGHT PATHS - this task's five artifact_paths UNION both source tasks' three.
    Under `content_first` binding the commit this task makes changes only the
    five; the other three were committed by TASK-20260905-06907f and are bound by
    their bytes at HEAD, which this task must re-verify. path_sha256 must cover
