  task_card: coordination/goals/GOAL-SSI-001/batches/BATCH-79a0cb/tasks/TASK-20260905-e1d527/task_card.yaml
  objective: >-
    Run alone after the red-team pass has returned and been snapshot-committed;
    compose its four per-joint verdicts into one evidence record and one
    decision; compare the recorded coordinator prior against the outcome element
    by element; state precisely what the pass does and does not settle about
    ENACTABILITY; carry forward every undispatched item with its origin;
    checkpoint the goal in a write-once shard; and commit exactly those records -
    without approving the amendment, moving any status, or inventing a result the
    report does not carry.
  uncertainty_reduced: >-
    Whether the round's outcome - an adversarial pass that held, broke, or was
    inconclusive on each of four joints - together with its scope limits and its
    consequences for the enactment path, is durably recorded before any successor
    batch or enacting decision is opened.
  inputs:
    - BATCH-79a0cb/reviews/TASK-20260905-6d5c9c/red_team_report.yaml and runtime_session_receipt.yaml
    - BATCH-79a0cb/archives/TASK-20260905-06907f/snapshot_commit_receipt.json, including its independence-gate output and its launching-prompt disclosure
    - coordination/goals/GOAL-SSI-001/batches/BATCH-79a0cb/review_plan.yaml, including the recorded coordinator_prior and its eight elements
    - The carried_forward list in coordination/goals/GOAL-SSI-001/batches/BATCH-79a0cb/batch.yaml
    - ledger/decisions/DEC-20260905-5f5592.yaml, ledger/evidence/EV-SSI-2aaf6f.yaml, ledger/goals/GOAL-SSI-001/goal.yaml and checkpoints/BATCH-752ef2.yaml
    - templates/research-records.md and docs/claims-and-verification.md
  constraints:
    - RUN ALONE, and stage only the five declared ledger-archive paths by exact pathspec, in one commit. path_sha256 must nevertheless cover all EIGHT expected paths, because binding_mode is content_first.
    - Check the ledger identifiers before writing them - `tools/allocate_id.py --check EV-SSI-1a95bc` and `--check DEC-20260905-3b8e94`. They were re-checked at authoring only by direct search, which is weaker than the tool. A substitution is a NEW identifier at every declared site, never a rename.
    - Re-verify the snapshot: recompute the sha256 of all three snapshot-committed paths, confirm they match snapshot_commit_receipt.json, and confirm the snapshot commit is an ancestor of HEAD. This is a completion gate and is this batch's substitute for the snapshot having been a dispatcher-verified archive record.
    - Run tools/validate_ledger.py on the merged tree and confirm the paths written here add no new error. Read the independence-gate result from the snapshot receipt rather than re-running it unless the plan or the report changed. If this task holds no shell, record each gate as OUTSTANDING with that reason and say plainly that reading the report is weaker than the tool (DEC-20260904-166ab5 PD-6).
    - Record the CF-16 discharge with its provenance and its residue. `check_review_independence.py --batch` on BATCH-752ef2 was run by the dispatching session and PASSED, exit 0, reporting every joint owned and attested, blindness respected and controls declared. Record it as DONE, preserve the verbatim output, exact command and ref here, and state that DEC-20260905-5f5592 and checkpoints/BATCH-752ef2.yaml record it as OUTSTANDING, are immutable, and are corrected by this successor record and never by an edit.
    - Compose the verdicts yourself. A joint with no verdict is UNCOVERED, never assumed to hold. Record that one adversarial agent ran, that the amendment has now been examined by two independent sessions and no more, and that blindness was deliberately lifted for the red team so its agreement with F-1, F-3 and F-7 is not independent of the first report.
    - Weight findings by what they change about enactability and say when the answer is nothing. For each finding state one of - blocks enactment; must be resolved in the enacting decision; belongs in a successor record and does not block; changes nothing. An all-holds round with no blocking finding is a complete and valuable result and is recorded as one.
    - Compare the recorded coordinator prior against the outcome element by element across all eight elements and say which were overturned, including the named candidate for widening, the named most-likely site for a second dead check, and the prediction about this round's own independence.
    - If the pass reported that the defect does not reproduce, halt on that object and do not compose it: it contradicts EV-SSI-2aaf6f at strength `replicated` and requires review-breakthrough at max, which this environment cannot serve. Record it precisely, record the impediment on the still-active goal, leave the claim un-promoted, and compose only the rest.
    - Do not approve or enact the amendment. EXP-WESOVOW-001 stays `approved` and UNAMENDED at version 1 and the draft stays a draft. Name in next_actions what the enacting decision must resolve - the CF-10 RAW_PATH placement question with the red team's recommendation marked as a recommendation; the F-7 over-reading path scoped explicitly to the frozen transcript; the F-2 and F-3 warrant defects by a successor record and never by superseding an immutable artifact; plus anything the pass added.
    - Do not edit experiments/, inputs/ or anything under BATCH-752ef2/. Do not execute cost_model.py. Do not make the F-1 fix (CF-13) and do not attach the provenance block to inputs/P13-WESOLOWSKI-2026/source_record.yaml (CF-19); both are carried forward, and the second would break this archive's enumerated path set.
    - Never reconstruct, estimate or guess a commit SHA, parent SHA or path hash; if a sha is read rather than computed, say where it was read from.
    - The evidence record is an adversarial reading, not a new measurement - certificate.kind none, run_ids only runs actually read (this batch read none), claim_tier no higher than document reading and contract algebra support, proof_status and proof_refs honest. State the tested scope and every transfer assumption, and do not record a third correlated session as an independent replication.
    - No hypothesis, experiment or goal status transition. GOAL-SSI-001 stays `active` and meets and approaches no completion criterion; `paused` and `blocked` are not permitted statuses. IMP-1 is re-confirmed rather than re-raised unless this round met an impediment its text does not cover.
    - Fill knowledge_promotion with a promotion or a concrete not_warranted reason, weighed against DEC-20260905-5f5592's standing reasoning rather than inherited from it - that decision asked for reconsideration once the amendment has a red-team pass behind it, and it now partly does.
    - If any part of the decision would close a lane it carries a complete obstruction block with a measured quantity, units, error bars, source artifacts, scope and a genuinely asked resource_check. An adversarial pass that found nothing is not an obstruction block.
    - Do not lift the citation prohibition unless this decision lifts it explicitly on the strength of the report, with the exact scope stated; otherwise retain both limbs verbatim, restate that the committed flag under-reports and must not be edited, and record the reasoning rather than inheriting it. This would be the fourth consecutive round in which the lift was available.
    - Record procedure_deviations IN THE DECISION. review_plan.yaml names the committed decision as their authoritative location, deliberately, because that file is not in this task's write scope and writing it would break the expected commit path set.
    - Carry forward every undispatched item with its origin - CF-2, CF-7 remainder, CF-8, CF-9, CF-10, CF-12(a) and (b), CF-13, CF-14, CF-15, CF-17, CF-18, CF-19 - and record what CF-1, CF-11 and CF-16 discharged and did not. CF-9 has now been held twice - dispatch it next or record a reason.
    - Checkpoint the goal in the write-once shard ledger/goals/GOAL-SSI-001/checkpoints/BATCH-79a0cb.yaml and make exactly one additive change to goal.yaml - its single next_action plus the pointers. Do not append new narrative keys, do not copy the superseded next_action into a new key, and preserve exactly one next action. Note again, without repairing them, that current_batch_id and dispatch_queue_path remain stale with respect to four batches.
    - The commit message states record identifiers and locators only - no verdict token, no finding, no severity.
    - Fetch origin/main before committing and MERGE it - never rebase. Record the base commit and the merge outcome, then push and open or refresh the PR against main naming EV-SSI-1a95bc, DEC-20260905-3b8e94, TASK-20260905-6d5c9c and BATCH-79a0cb. A sync conflict inside an immutable record is resolved by a superseding record under a new identifier, never by picking a side.
    - If the round returned inconclusive, say so plainly. An inconclusive round is a result and is never rewritten into a cleaner history, and neither is a round whose only finding is that nothing is wrong.
    - Never select a provider, backend, endpoint, or model identifier containing Bedrock, case-insensitively.
  deliverables:
