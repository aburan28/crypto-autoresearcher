  completion_gate:
    - The commit changes exactly the five ledger-archive paths, and archive.path_sha256 covers all eight expected paths as content_first binding requires.
    - The three snapshot-committed paths were re-hashed, matched against snapshot_commit_receipt.json, and the snapshot commit was confirmed an ancestor of HEAD; the result is recorded either way.
    - The ledger identifiers were checked with tools/allocate_id.py --check, any substitution is a new identifier recorded at every declared site, and the outcome is in the receipt.
    - Every joint R1-R4 has a composed verdict or is recorded as UNCOVERED, and the composition states that one adversarial agent ran and that blindness was deliberately lifted for it.
    - The coordinator prior is compared against the outcome element by element across all eight elements.
    - Every finding is classified by what it changes about enactability, and an all-holds round with no blocking finding is recorded as a complete result.
    - The CF-16 discharge is recorded as DONE with its verbatim output, exact command and ref, and with the statement that the two immutable records naming it OUTSTANDING are corrected by this successor record rather than edited.
    - The independence-gate result for this batch is recorded verbatim, and no gate is reported that was not run.
    - The evidence record carries claim_tier, proof_status, proof_refs and certificate.kind none, states its tested scope, cites only runs actually read, and does not record a third correlated session as an independent replication.
    - The decision fills knowledge_promotion, records procedure_deviations, approves no amendment, enacts nothing, and makes no status transition.
    - experiments/, inputs/ and every artifact of BATCH-752ef2 are unmodified; CF-13 and CF-19 are carried forward and not performed.
    - The citation prohibition and its predicate extension are retained verbatim or lifted with an explicit scope, with reasoning recorded rather than inherited.
    - Every undispatched carried_forward item appears in next_actions with its origin, CF-9's second consecutive holding is ended or given a recorded reason, and what CF-1, CF-11 and CF-16 discharged and did not is stated.
    - The goal checkpoint shard is written, GOAL-SSI-001 stays active, and exactly one next_action remains on the head.
    - The commit message states record identifiers and locators only.
    - The branch is pushed and the PR against main names the new records.
  return_format: >-
    A short report naming the composed per-joint verdicts, the decision and its
    scope, the prior-versus-outcome result element by element, which findings
    block enactment and which change nothing, the gates run and the gates
    outstanding, the carried-forward list, the single next action, and every
