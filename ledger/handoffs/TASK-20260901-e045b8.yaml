handoff:
  id: TASK-20260901-e045b8
  from: coordinator
  to: coordinator
  objective: 'Author a FOURTH protocol amendment to the frozen cost model CM-1 that supplies concrete,
    operative rule text closing EXACTLY the two reading gaps RT-20260901-1af5d9 objections 1 and 2 established
    against protocol-amendment-GOAL-AES-002-003, and no others.


    GAP A (element (a), ADMISSIBLE CONVERSION ROUTE 3). The phrase "no other bytewise operation (no independent
    ShiftRows/MixColumns computation...)" leaves "independent" undefined, and a FUSED TABLE-DRIVEN (T-table)
    AES implementation — one memory lookup performing SubBytes, ShiftRows and part of MixColumns simultaneously
    — is classifiable oppositely by two conforming readers: as "the S-box route" (Route 1''s N being a
    specification-structure count, agnostic to implementation fusion) or as "an independent ShiftRows/MixColumns
    computation" (the linear step did happen, merely for free). T-table implementations are the ORDINARY
    fast way to implement AES, not a contrived edge case. The red team''s own suggested shape, offered
    to you as a STARTING POINT AND NOT AS A CONCLUSION you must adopt: "an operation is independent of
    the S-box route if and only if its cost is not already fully absorbed into a single memory access
    whose count is already being charged under Route 1." Test that candidate rule yourself against at
    least the fused T-table case, a bitsliced implementation, and an AES-NI implementation before adopting,
    adapting or rejecting it, and record what you tested.


    GAP B (elements (c)/(f), the bundled-verification sentence). The operative test "generating a candidate
    and verifying it against the target ciphertexts are genuinely distinct computational acts" is under-determined
    on its literal wording: a naive reading (any two procedurally separate steps are distinct acts) also
    covers the DEFINITIONAL REFERENCE''s own pick-a-key-then-encrypt-and-compare loop, which the SAME
    resolving text explicitly classifies as BUNDLED encrypt-and-compare enumeration. The text therefore
    presupposes an UNSTATED narrower sense of "distinct" — distinct in computational KIND or COST, not
    merely in procedural sequencing — and a genuine guess-and-determine hybrid (algebraic pre-filter,
    then a final encrypt-and-compare on survivors) sits exactly on the unresolved boundary. Supply the
    narrower sense explicitly, and DEMONSTRATE that your rule text classifies the m=0 definitional reference
    as bundled (the proves-too-much check that both reviewers independently raised).


    AMENDMENT 004 SUPERSEDES 003 ONLY IN THE TWO SENTENCES IT REPLACES. It does not reopen, re-score or
    reinterpret 003''s other two resolving-text blocks (the two-axis data sub-lattice and the separate
    distinguisher axis), both of which the red team ATTACKED AND HELD. Never edit 003; supersede it.'
  uncertainty_reduced: Whether two conforming readers charging the same T-table or guess-and-determine
    attack under CM-1 can still reach different AEU-k figures. Closing this is a precondition on any cost-relevant
    dispatch that would depend on element (a) or (c)/(f) in its current form.
