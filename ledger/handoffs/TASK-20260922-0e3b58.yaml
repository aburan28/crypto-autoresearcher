handoff:
  id: TASK-20260922-0e3b58
  from: coordinator
  to: coordinator
  recorded_at: '2026-09-22'
  opened_by_decision: DEC-20260922-e9d35a
  goal_id: GOAL-FROB-6333a9
  batch_id: BATCH-5286b0
  question_id: RQ-FROB-7d8dd4
  kind: ledger_archive

  objective: >-
    Make the BATCH-5286b0 opening package durable and official in ONE isolated
    commit that stages exactly the nine declared SOURCE paths plus this
    archive's own receipt -- ten files -- and nothing else: the
    composing decision DEC-20260922-e9d35a, the correction CORR-20260922-9e402f,
    the additive protocol amendment
    AMD-EXP-FROB-30006a-20260922-nullcontrol, the write-once checkpoint shard,
    the checkpointed goal head, the dispatch queue, and this card and
    TASK-20260922-98729f. Then verify the receipt against Git, push, and open or
    refresh a PR against main naming every record id.

  uncertainty_reduced: >-
    NONE. This task measures nothing and asserts nothing mathematical. What it
    removes is the gap between a decision that exists as a working-tree file and
    a decision that is official -- and specifically it is what makes
    AMD-EXP-FROB-30006a-20260922-nullcontrol binding on the executor, which is
    why it must precede the run rather than follow it.

  inputs:
    - ledger/decisions/DEC-20260922-e9d35a.yaml
    - ledger/corrections/CORR-20260922-9e402f.yaml
    - experiments/EXP-FROB-30006a/amendments/AMD-20260922-nullcontrol.yaml
