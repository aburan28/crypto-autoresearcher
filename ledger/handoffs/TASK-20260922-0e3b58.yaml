  archive:
    kind: ledger
    source_task_ids:
      - TASK-20260922-5357bf
    source_task_ids_note: >-
      ONE SOURCE, AND IT IS TRUE RATHER THAN SCHEMA-SATISFYING. The first draft
      of this card wrote `[]`, reasoning that an opening archive closes no
      producer; `tools/research_dispatch.py` refused the queue with
