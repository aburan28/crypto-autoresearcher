      engagement that wrote the decision, the amendment, the correction, the
      checkpoint, the goal-head edit, the queue and both archival cards. That act
      was real and produced all eight artifacts staged below; the only thing
      missing was its card, and the repair is to write the card rather than to
      excuse its absence. It is now
      coordination/goals/GOAL-FROB-6333a9/batches/BATCH-5286b0/dispatch_queue.json
      tasks[0], `state: completed`, with those eight paths as its artifact_paths
      and `archived_by: TASK-20260922-0e3b58`, so the binding closes in both
      directions.

      IT IS NOT TASK-20260920-956d12, and naming that task was considered and
      REJECTED. It produced the DESIGN package and archived it on 2026-09-20 at
      commit 14ef07b83; none of the eight paths below appears in its
      staged_paths. Declaring it the source would make the error disappear by
      asserting something false, and would be the same declared-set-versus-
      actual-set mismatch that DEC-20260922-e9d35a ITEM-5 repairs on this very
      goal and that has GOAL-ICEX-001 and GOAL-SIG-001 in "needs repair".
    record_ids:
      - DEC-20260922-e9d35a
      - CORR-20260922-9e402f
      - AMD-EXP-FROB-30006a-20260922-nullcontrol
      - BATCH-5286b0
      - GOAL-FROB-6333a9
      - TASK-20260922-5357bf
      - TASK-20260922-0e3b58
      - TASK-20260922-98729f
      - TASK-20260922-cd6f21
    commit_sha: null
    parent_sha: null
    path_sha256: {}
    binding_mode: content_at_commit
    binding_mode_note: >-
      content_at_commit, and the choice matters here. The goal head is
      recheckpointed at every batch close and the contract will advance from
      `approved` to `running` to `completed`, so under content_first each of
      those legitimate moves would report this archive as corrupt -- the failure
      CORR-20260915-654160 records. Binding the bytes AT this commit asks the
      question a ledger archive actually makes. EXPECT every later archive in
      this batch to bind a different snapshot of the goal head and the queue.
    ledger_kind_note: >-
      kind `ledger` with NO EV-* record, which research_dispatch.py permits and
      CORR-20260822-7e98b5 HD-1 records the reason for: a ledger archive's whole
      content can BE the decision. Here it is a composition ruling, a protocol
      amendment, an ownership correction and a batch opening. It promotes nothing
      and moves no hypothesis status.

