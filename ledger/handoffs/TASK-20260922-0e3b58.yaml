    - coordination/goals/GOAL-FROB-6333a9/batches/BATCH-5286b0/archives/TASK-20260922-0e3b58/ledger-receipt.json
  staged_paths_note: >-
    TEN: nine sources plus this receipt. The ninth source,
    ledger/handoffs/TASK-20260922-cd6f21.yaml, was added when the merged executor
    card proved undispatchable.
    `ledger/handoffs/TASK-20260920-66a30e.yaml` IS DELIBERATELY ABSENT and must
    not be staged: it is merged and immutable, TASK-20260922-cd6f21 supersedes it
    by reference, and this commit leaves it untouched.

    THIS LIST IS DOCUMENTATION, NOT THE AUTHORITY. `research_dispatch.py` line
    931 derives the commit scope itself as
    `archive.artifact_paths | source.artifact_paths`, and line 944 requires
    `path_sha256` to equal exactly that set once this archive is `completed`. If
    this hand-written list and the tool's union ever disagree, THE TOOL IS RIGHT
    and this list is stale -- it has already drifted once, from nine to ten. It
    is kept so a reader can see the commit scope without running the tool, and it
    must never be used to justify staging a path the union does not contain.

  write_scope:
    - coordination/goals/GOAL-FROB-6333a9/batches/BATCH-5286b0/archives/TASK-20260922-0e3b58/
    - ledger/decisions/DEC-20260922-e9d35a.yaml
  write_scope_note: >-
    THE RECEIPT DIRECTORY PLUS THE ONE DECISION FILE. The second entry is forced,
    not chosen: line 875 requires `artifact_paths` to be inside `write_scope`, so
    the decision path this archive must own has to be in scope or the queue is
    refused a third time. IT IS A SCOPE, NOT A LICENCE TO EDIT -- this task
    stages the decision, it does not rewrite it, and LA-3 forbids editing any
    immutable record. The overlap with the opening card's write_scope is real and
    is harmless: `scope_overlaps` is checked only between RUNNING tasks (line
    993) and concurrently SELECTED ones, the opening card is `completed`,
    max_concurrent is 1 and an archive must run alone, so the two can never be
    live together.

    STILL OUT OF SCOPE, and deliberately: the correction, the amendment, the goal
    head, the checkpoint shard, the queue and the three handoff cards. They are
    this archive's SOURCES and reach the commit through line 931's union. And
    `experiments/EXP-FROB-30006a/specification.yaml` is out of scope of every
    card in this batch: the contract is frozen at version 1 and a change to it is
    an additive amendment under a derived id, authored by the opening card and
    never by its archive.

  archived_by: TASK-20260922-0e3b58
  archived_by_note: >-
    SELF. An archival task owns its own receipt -- the standard shape for a
    Coordinator archive, and the reason this card's artifact_paths includes its
