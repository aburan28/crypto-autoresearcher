    - coordination/goals/GOAL-FROB-6333a9/batches/BATCH-5286b0/dispatch_queue.json
    - ledger/handoffs/TASK-20260922-0e3b58.yaml
    - ledger/handoffs/TASK-20260922-98729f.yaml
    - ledger/handoffs/TASK-20260922-cd6f21.yaml

  constraints:
    - id: LA-0
      text: >-
        THE LITERAL STRING `TASK-20260922-5357bf` MUST NOT SURVIVE THIS
        COMMIT. It is a deliberately invalid placeholder for the opening card's
        identifier, which the authoring agent could not mint. Mint it with
        `python3 tools/allocate_id.py --next handoff --date 20260922`, confirm
        with `--check`, substitute it across this file, the queue, the decision
        and the checkpoint shard, and delete the queue's
        `BLOCKING_SUBSTITUTION_REQUIRED` key. If minting is unavailable, STOP and
        return to the Coordinator rather than substituting a plausible source
        task.
    - id: LA-1
      text: >-
        STAGE ONLY THE TEN PATHS IN staged_paths_declared -- the nine source
        records and this archive's own receipt -- PATH BY PATH, AND NEVER
        ledger/handoffs/TASK-20260920-66a30e.yaml, which is merged, immutable,
        superseded by reference and untouched. `git add -A` is
        forbidden: this repository is worked by many sessions in one tree, and a
        sweep would commit another lane's in-flight ledger edits into an archive
        that declares it changed exactly its own set.
    - id: LA-2
      text: >-
        MERGE origin/main INTO THE BRANCH FIRST -- merge, never rebase. Record
        the base commit checked and the merge outcome in the receipt. A sync
        conflict inside any immutable record is NEVER resolved by picking a side:
        it is a new superseding record under a new id, and this task stops and
        reports rather than resolving one.
    - id: LA-3
      text: >-
        EDIT NO IMMUTABLE RECORD. Not EV-FROB-b6e1e9, not either experiment
        specification, not KN-FIND-47da4e, not KN-OPEN-095df5, not
        TASK-20260920-66a30e, and not TASK-20260920-956d12's receipt. The goal
        head is the one file this commit MAY change, and only as the checkpoint
        DEC-20260922-e9d35a ITEM-4 declares -- additively, with the prior
        next_action preserved verbatim.
    - id: LA-4
      text: >-
        The checkpoint shard
        ledger/goals/GOAL-FROB-6333a9/checkpoints/BATCH-5286b0.yaml is
        WRITE-ONCE. If it already exists with different content, stop: that means
        another lane opened a batch under this id and the collision is a
        superseding record's problem, not this commit's.
    - id: LA-5
      text: >-
        ZERO RUNS. This card launches no trial, runs no solver, and writes no
        experiment implementation code. It is not a /run.
    - id: LA-6
      text: >-
        Commit message names TASK-20260922-0e3b58 and every record id in the
        archive block. Never rewrite history over pushed run records.

  deliverables:
    - >-
      coordination/goals/GOAL-FROB-6333a9/batches/BATCH-5286b0/archives/
      TASK-20260922-0e3b58/ledger-receipt.json -- with commit_sha, parent_sha,
      base_commit_checked, merge_outcome, path_sha256 over the eight declared
