    - ledger/handoffs/TASK-20260922-cd6f21.yaml
    - ledger/handoffs/TASK-20260920-66a30e.yaml
  read_scope_note: >-
    ADDED FOR PARITY WITH THE QUEUE CARD, which is what the dispatcher actually
    reads; this record previously carried no `read_scope` key at all and the two
    could therefore not be compared. It must cover every source artifact path:
    `research_dispatch.py` line 927 refuses an archive whose read_scope does not
    contain the union of its sources' artifact_paths. The merged
    TASK-20260920-66a30e is readable and is NEVER staged.

  artifact_paths:
    - coordination/goals/GOAL-FROB-6333a9/batches/BATCH-5286b0/archives/TASK-20260922-0e3b58/ledger-receipt.json
    - ledger/decisions/DEC-20260922-e9d35a.yaml
  artifact_paths_note: >-
    TWO PATHS. The first draft carried nine, then one, and the one-path form was
    REFUSED: `_validate_ledger_archive` (research_dispatch.py lines 735-763)
    rejects any `kind: ledger` archive whose own artifact_paths contain no
    `ledger/decisions/` entry, and `_ledger_record_matches_path` (line 728) then
    requires the record id to be visible in that filename, which
    DEC-20260922-e9d35a is.

    THE PRINCIPLE I ARGUED FOR YIELDS HERE, AND IT SHOULD. I narrowed this to the
    receipt alone so that the set a task PRODUCES and the set it STAGES stay
    disjoint and `git diff --name-only` is checkable against a declared list.
    That reasoning is right for a `kind: snapshot` archive, which never reaches
    this branch, and TASK-20260922-98729f keeps it. It does not survive the
    ledger branch, and under AGENTS.md rule 7 the dispatcher's verifier is what
    makes a record official -- so where its contract and my principle collide,
    the contract wins and the principle is recorded as having lost rather than
    quietly restated.

    MOST OF THE SEPARATION SURVIVES ANYWAY. Line 931 computes the commit scope as
    `archive.artifact_paths | source.artifact_paths`, so the other eight sources
    reach this commit through the union WITHOUT this archive claiming to have
    written them. What the ledger branch demands is narrower than "declare
    everything you stage": it demands that a ledger archive bind, in its own
    declared set, the DECISION it makes official -- an anti-drift check tying the
    record id to the path. No evidence artifact is owed, because `record_ids`
    names no EV-* (the CORR-20260822-7e98b5 HD-1 exemption commented at line
    746). This is the shape TASK-20260916-9d98ef used and dispatched with.

  staged_paths_declared:
    - ledger/decisions/DEC-20260922-e9d35a.yaml
    - ledger/corrections/CORR-20260922-9e402f.yaml
    - experiments/EXP-FROB-30006a/amendments/AMD-20260922-nullcontrol.yaml
