handoff:
  id: TASK-20260903-22c36b
  from: coordinator
  to: idea-generator
  question_id: RQ-PFDR-ae2fba
  objective: >-
    Run one bounded, user-directed ideation round against RQ-PFDR-ae2fba: for
    prime-field ECDLP (E/F_p, exemplar P-256, no Weil descent) the bottleneck
    is not writing down S_3 or S_4 but finding a REPRESENTATION or factor-base
    definition under which the point-decomposition polynomial systems stay
    low-degree AND still have useful solutions with adequate probability -
    which is exactly where the degree-of-regularity question becomes central.
    Return up to eight schema-complete, novelty-screened, falsifiable
    proposals across two lanes with disjoint pre-allocated ids, and an honest
    accounting for every corner that turns out to be already proposed,
    already closed, or not convertible into a discriminating test.
    Generation runs under docs/inventor-protocol.md: every candidate is
    framed as a tracked object and passed through the lossy-projection test
    before an experiment is proposed; a null-object control is named before
    any signal is believed; every idea carries numbered
    heuristic_assumptions with validation routes, target_complexity with
    time and memory exponents against the best known, a checked dominated_by
    and a quantitative sota_delta.
  uncertainty_reduced: >-
    Whether any representation of the factor base (auxiliary-variable digit
    presentations, nested digit ladders, symmetrized or lattice-windowed
    presentations, implicit membership) can move the per-relation
    decomposition cost exponent sigma (T_solve = B^{(m-1) sigma}) below the
    1 - 2/(m-1) threshold of IDEA-20260808-812554 while keeping the yield
    column at its conserved value (KN-FIND-007), and what the degree-side
    quantity actually is once the direct membership presentation's CRT
    degeneracy (IDEA-20260830-cb8e46) and the "d_reg = 2 flat" proxy
    (IDEA-20260807-1354d8) are set aside.
  inputs:
    - ledger/questions/RQ-PFDR-ae2fba.yaml (the host question; its motivation is the state summary)
    - ledger/questions/RQ-SDEG-001.yaml, ledger/questions/RQ-FBG-001.yaml, ledger/questions/RQ-DREG-001.yaml, ledger/questions/RQ-MODEL-e61cb2.yaml
    - ledger/proposals/IDEA-20260830-84cdb7.yaml (base-d digit map; the closest prior representation record; every lane-A idea must be discriminated from it at the operation level)
    - ledger/proposals/IDEA-20260808-093497.yaml (exact semi-regular null for the direct presentation)
    - ledger/proposals/IDEA-20260830-cb8e46.yaml and IDEA-20260829-bdca13.yaml (CRT degeneracy, arity-universal)
    - ledger/proposals/IDEA-20260808-da1428.yaml (hybrid guessing dominates under the null)
    - ledger/proposals/IDEA-20260807-1354d8.yaml, IDEA-20260826-2259f8.yaml, IDEA-20260807-899c5e.yaml (the d_reg meter had no dynamic range)
    - ledger/proposals/IDEA-20260808-486ae2.yaml, IDEA-20260808-e2315e.yaml, IDEA-20260802-003.yaml (lattice-window family, enumerate-and-join pinned at 1/2)
    - ledger/proposals/IDEA-20260808-9ef88c.yaml (coset base), IDEA-20260902-701458.yaml (CM-trace implicit membership), IDEA-20260902-a0ed78.yaml (cover-image bases)
    - ledger/proposals/IDEA-20260808-812554.yaml (sigma threshold), IDEA-20260829-b5a2c8.yaml (m=2 floor), IDEA-20260803-fa9839.yaml (arity threshold)
    - ledger/proposals/IDEA-20260731-012.yaml (large-prime variation, combinatorial), IDEA-20260731-009.yaml (crypto-size d_ff correspondence sampler)
    - ledger/proposals/IDEA-20260807-1ea327.yaml, IDEA-20260807-5ddccf.yaml, IDEA-20260830-1a08f9.yaml (symmetrization / invariant coordinates), IDEA-20260807-dadcd2.yaml (deck-group degree law)
    - ledger/proposals/IDEA-20260806-7ea402.yaml (deficit costs zero unless it moves the first-solve degree)
    - ledger/proposals/IDEA-20260801-021.yaml and ideas/artifacts/IDEA-20260801-021/bounded_degree_factor_base_theorem.md (Bezout no-go)
    - ledger/proposals/IDEA-20260902-2327a5.yaml, IDEA-20260902-7952e7.yaml, IDEA-20260902-63dbc0.yaml, IDEA-20260902-c17bf6.yaml (the 2026-09-02 round; do not re-file its corners)
    - ledger/handoffs/TASK-20260902-5b34ea.yaml (the prior round's constraints C1..C5, off-limits here)
    - ledger/FINDING-PF-IC-001.md, ledger/evidence/EV-FBG-001.yaml, ledger/EV-REP-001.yaml, ledger/EV-REP-002.yaml, ledger/EV-DREG-001.yaml..003
    - ledger/evidence/EV-ALPF-001.yaml (the one recorded prime-field early fall, EXP-ALPF-011; never replicated)
    - knowledge/findings/KN-FIND-006.md (binary deficit = 8 dim V structural syzygies), KN-FIND-007.md (yield conservation), KN-FIND-a8990a.md, KN-FIND-c41ea9.md
    - knowledge/open-problems/KN-OPEN-002.md, KN-OPEN-003.md, KN-OPEN-020.md, KN-OPEN-5b3a08.md
    - knowledge/literature/KN-LIT-009.md, KN-LIT-025.md, KN-LIT-7604.md, KN-LIT-7607.md, KN-LIT-7605.md, KN-LIT-024.md, KN-LIT-439.md, KN-LIT-029.md, KN-LIT-037.md
    - knowledge/techniques/KN-TECH-056.md, KN-TECH-080.md, KN-TECH-004.md, KN-TECH-015.md, KN-TECH-053.md
    - ideas/catalogue-20260805/A1-index-calculus.md (A1-11 restriction-of-scalars audit, A1-13 frontier table rows for dominated_by)
    - inputs/h100_session/EC_SIEVE_HONEST_LEDGER.md (D6 unresolved, H002 symmetrization exponent-neutral, H012 subset-column artifact)
    - experiments/EXP-SBRG-60c55e/driver/macaulay.py (test-covered Macaulay deficit meter, boolean), src/h012c_block_m4ri.py (exact GF(2) rank instrument), harness/semaev.py (S_3/S_4 builder; KN-OPEN-5b3a08 defect)
    - agents/idea-generator.md, docs/inventor-protocol.md, docs/target-result-profile.md, templates/research-records.md
  constraints:
    - >-
      LANE A (representation side) owns corners A1..A4 with ids
      IDEA-20260903-cf63ad, IDEA-20260903-fc1355, IDEA-20260903-e0a3e8,
      IDEA-20260903-0d0778 in that order of use. LANE B (mechanism,
      measurement and control side) owns corners B1..B4 with ids
      IDEA-20260903-e1e38b, IDEA-20260903-751062, IDEA-20260903-399a18,
      IDEA-20260903-8f80dc in that order of use. Each lane is told the
      other's corners and must not file on them. Unused ids remain unused and
      are accounted for in the lane's session accounting.
    - >-
      A1 (THE PRIME-FIELD DIGIT TWIN OF THE BINARY CHAINED SEMAEV SYSTEM).
      IDEA-20260830-84cdb7 substitutes the digit map into the direct S_{m+1}
      and measures d_ff against digit length s. The binary lane (RQ-DREG-001,
      KN-FIND-006) measured a Macaulay deficit of exactly 8 dim V structural
      syzygies on the CHAINED t=3 tree with boolean field equations. The
      corner: build the exact prime-field twin - same chaining graph, m-1
      copies of S_3 of bidegree (2,2), digit variables with a(a-1) = 0 over
      F_p on the leaves, internal-node variables free - and ask whether the
      binary deficit is a characteristic-2 artifact (Frobenius-linearity of
      squaring, a lossless projection in the sense of inventor-protocol
      section 2) or a property of the Semaev chaining graph that survives
      the change of characteristic. Tracked object: the degree-D Macaulay
      deficit of the twin against a support-matched null over F_p. A
      proposal must state the predicted deficit under each mechanism and the
      cell at which they separate; the twin at s = 1 must embed the direct
      presentation exactly (baseline slice). Discriminate from 84cdb7 (direct
      substitution, d_ff slope) and from IDEA-20260808-11b8c7 (topology-
      matched null over GF(2)).
    - >-
      A2 (THE NESTED DIGIT LADDER AS AN ALGEBRAIC LARGE-PRIME VARIATION). The
      digit map gives a nested family V_1 subset V_2 subset ... with |V_{s+1}|
      = d |V_s| and membership degree constant in s. A relation with m-1
      points in V_s and one in V_{s+1} is the large-prime variation of
      IDEA-20260731-012 made ALGEBRAIC: one extra digit variable and one
      extra degree-d generator buy a factor d in solution count. This is the
      RQ's degree-versus-yield coupling in its purest form. The proposal must
      derive the charged per-relation cost as a function of the ladder
      profile under the semi-regular null of 84cdb7 (ceil((ms(d-1)+2m)/2)
      with s varying per variable) and state the ladder profile, if any, at
      which the coupled cost beats the flat base at matched effective B; the
      yield column is FORCED by KN-FIND-007 and must be quoted as such, not
      measured. Discriminate from 731-012 (combinatorial near-miss harvest,
      no algebra) and from IDEA-20260726-005 (multi-level descent tree).
    - >-
      A3 (SYMMETRIZATION VERSUS SMALLNESS). Symmetrization in elementary
      symmetric coordinates (KN-LIT-004, IDEA-20260807-1ea327, H002 of
      HYPOTHESES_100: 6:1 orbit quotient, exponent-neutral) lowers the
      per-variable degree of S_{m+1}; lattice-window bases
      (IDEA-20260808-486ae2) need SMALL variables. The corner is whether the
      two compose: e_j of m window variables of size B has size about
      (mB)^j, so the product of bounds inflates from B^m to about
      B^{m(m+1)/2}, which appears to destroy the Coppersmith condition. The
      proposal is a zero-compute derivation of the composed feasibility
      band - the analogue of 486ae2's eps(m, tree) for the symmetrized
      system, using the Jochemsz-May Newton-polytope bound - with the
      nearby object stated (a coordinate in which symmetric functions of
      small values stay small, if one exists; the j = 0 invariant coordinate
      u = x^3 is NOT one, and the record must say why). Either outcome is a
      result: a closure with the obstruction named, or a band that is not
      empty.
    - >-
      A4 (FREE SLOT, LANE A). Use only if a genuinely new representation
      corner survives the lossy-projection test and discrimination from
      every input record; the KN-OPEN-020 escapes "target-dependent
      descriptions" and "implicit membership by source recovery" are the
      candidate cells, with IDEA-20260902-701458 and IDEA-20260830-c5c614
      as the records to discriminate from. Otherwise leave
      IDEA-20260903-0d0778 unused and say so.
    - >-
      B1 (THE p-ARY ALGEBRAIC IMMUNITY OF THE MULTILINEAR SEMAEV REDUCTION).
      At d = 2 the digit presentation of 84cdb7 makes S_{m+1} a multilinear
      polynomial in ms variables over F_p modulo a(a-1) = 0. Its first-fall
      degree is then the least D at which a degree-D multiple reduces below
      D modulo the field equations - the p-ary analogue of Boolean algebraic
      immunity (Courtois-Meier, Meier-Pasalic-Carlet; cite as recalled),
      whose generic ceiling ceil(n/2) coincides with 84cdb7's semi-regular
      null at d = 2. The corner: 84cdb7's H1 ("d_ff bounded in s") is
      exactly the statement that the Semaev multilinear reduction has
      anomalously LOW p-ary algebraic immunity. State the theorem-shaped
      ceiling, the null object (a random multilinear polynomial of the same
      degree and support), the exact linear-algebra test at s = 2..6, and
      what a low-immunity finding would and would not license. Discriminate
      from 84cdb7 (which measures the slope but names no mechanism) and from
      IDEA-20260808-afe4ce (last-fall floor for the direct presentation).
    - >-
      B2 (REPLICATE THE ONE PRIME-FIELD EARLY FALL UNDER A VALIDATED METER).
      EV-ALPF-001 / EXP-ALPF-011 record the campaign's only prime-field
      positive: a symmetric m = 3 representation with d_ff < D_reg, flat
      across three sizes. It has never been replicated with a matched null
      under the test-covered Macaulay meter (experiments/EXP-SBRG-60c55e/
      driver/macaulay.py, boolean; a prime-field port is part of the cost)
      and its S_4 dependence, if any, sits on the KN-OPEN-5b3a08 defect. The
      corner is a control-class proposal: reconstruct the exact ALPF-011
      representation from the archived Sage source, state the two mechanisms
      that could produce a flat d_ff below D_reg (a genuine early fall
      versus the CRT/meter artifact of IDEA-20260830-cb8e46 and
      IDEA-20260807-899c5e), and name the cell that separates them. This is
      the cheapest possible test of the RQ's degree column and must be
      framed as a superseding measurement of an immutable record, never a
      re-run.
    - >-
      B3 (THE COUPLED DEGREE-BY-YIELD TABLE AS A MEASUREMENT CONTRACT). The
      RQ's decision target is a per-representation table (d_ff, Macaulay
      deficit at D = 3, 4 against a support-matched null, decomposition
      count, charged per-relation cost, growth arm in log2 p) with the yield
      column forced by KN-FIND-007. No such table exists. The proposal is a
      tooling/measurement record that pre-registers the rows (direct f_V,
      digit d = 2, digit d = 4, coset of 9ef88c, window + lattice of
      486ae2, and the ALPF-011 representation), the matched B per row, the
      kill rule (every row tracks its null within CIs at every reachable
      p: scoped kill of the representation channel), and the alive rule (a
      row whose degree deficit or charged cost advantage grows with p).
      It must name which existing instrument covers each cell and which
      cells have no instrument, and must adopt the floor-not-exact-count
      discipline of CLAUDE.md for any corpus-derived quantity. Discriminate
      from IDEA-20260816-62354d (geometry-agnostic yield module) and
      IDEA-20260815-0902c7 (cost-model reconciliation).
    - >-
      B4 (FREE SLOT, LANE B). Use only if a mechanism or control survives
      that is distinct from B1..B3 and from every input record; candidates
      are the degree-quantization control of IDEA-20260806-7ea402 applied
      to the digit presentation (which deficits actually move the
      first-solve degree), or a Galois-conjugate-component classification
      of low-degree cut-outs as an enumeration of KN-OPEN-020's "multiple
      constructible predicates" escape (expected to collapse to the trivial
      product; a closure is an admissible deliverable). Otherwise leave
      IDEA-20260903-8f80dc unused and say so.
    - >-
      Zero compute and zero implementation. experiment maximum_runs is 0.
      Every quantitative statement is a derivation or a screening
      statement, never a reported execution. No imagined outcomes.
    - >-
      Knowledge retrieval: the orchestrating session probed the crypto-kb
      index before dispatch; it answered with the documented empty-index
      error (CRYPTO_KB_QDRANT_URL is ':memory:'), so retrieval is
      unavailable this round. Generators screen by direct Read and Grep
      over knowledge/, ledger/, analysis/ and ideas/ plus WebSearch and
      WebFetch; every record states in novelty_screen exactly what was read
      and grepped and treats absence of a hit as a floor, never as novelty.
    - >-
      No novelty label stronger than unverified rests on a recalled
      citation. Every citation carries provenance (recalled | retrieved |
      kb | internal) and verified_by where required. Internal records that
      were not opened are cited as recalled.
    - >-
      No idea is a re-parameterisation of an off-limits or already-filed
      record in new notation. discriminated_from names the nearest prior
      record and the operation-level difference. The families this program
      has closed at derivation level (summation-cover monodromy, box-
      saturated Newton polytopes, isogeny-class invariance by Tate, curve
      model as a degree lever, structured-base yield, the m! N free-oracle
      floor, CRT degeneracy of the direct presentation) may be cited as
      boundaries but not proposed against.
    - >-
      Every idea has at least two possible outcomes with stated meanings, at
      least one falsification condition a cheap test can trigger, and a
      null-object control of the same shape. A proof-oriented idea carries a
      proof_search_map with all four audits filled or marked not_applicable
      with a reason.
    - >-
      dominated_by is null only after checking every frontier row of
      catalogue A1-13 (parallel rho with negation, BSGS, kangaroo,
      automorphism-discounted rho, Pohlig-Hellman, generic preprocessing
      S T^2 = N, algebra-free MITM index calculus at N^{1/2+1/m}); an
      unchecked null is a fabrication under AGENTS rule 5. sota_delta is
      quantitative.
    - >-
      No hypothesis record, experiment record, or status change is written;
      this task assigns no work to the Executor.
    - >-
      Drafts are written to the session scratchpad (laneA/ or laneB/) as
      one YAML file per idea named by its id, and filed into
      ledger/proposals/ by the orchestrating session only after a strict
      schema check against agents/idea-generator.md and
      tools/validate_ledger.py. The generator never writes under ledger/.
  deliverables:
    - up to four idea records per lane, schema-complete, each with question_id RQ-PFDR-ae2fba and handoff_id TASK-20260903-22c36b
    - a per-lane session accounting naming every corner as filed, closed-by-derivation, or not-convertible, with the record that closes it
    - candidate external ingredients recorded as recalled or retrieved literature pointers where no idea follows
  artifact_paths:
    - ledger/questions/RQ-PFDR-ae2fba.yaml
    - ledger/handoffs/TASK-20260903-22c36b.yaml
    - ledger/proposals/IDEA-20260903-*.yaml
  inference:
    policy: research-deep
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 5400
    memory_gb: 4
    maximum_runs: 0
  completion_gate:
    - every filed idea parses and passes tools/validate_ledger.py with no new error
    - every filed idea names discriminated_from, a null-object control, heuristic_assumptions with validation routes, target_complexity, dominated_by checked against A1-13, and a quantitative sota_delta
    - unused pre-allocated ids are listed in the session accounting
  return_format: >-
    Per lane: the list of idea files written to the scratchpad, one line per
    corner with its disposition, and the recommended first test across the
    lane's filed ideas.
