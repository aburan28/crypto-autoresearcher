handoff:
  id: "TASK-20260727-012"
  from: "coordinator"
  to: "executor"
  goal_id: "GOAL-MLKEM-001"
  authorized_by: "DEC-20260727-002"
  objective: >-
    Execute the frozen EXP-MLKEM-007 protocol exactly as specified and produce the immutable
    run records and execution report it requires. Experiment title: Toy negacyclic isometry-orbit scoring with covariance-aware GLS fusion versus
    single-orbit and ablation baselines.
  uncertainty_reduced: >-
    Decide, at toy ML-KEM-like parameters only, whether reusing one short-vector pool
    across a selected negacyclic isometry orbit and fusing the orbit scores with
    covariance-aware GLS weights recovers planted secret components with materially
    fewer short vectors than the unfused single-orbit baseline — and whether any such
    gain survives naive-averaging ablation, random signed-permutation controls, and
  inputs:
    - "experiments/EXP-MLKEM-007/specification.yaml (status approved, frozen: true; do not change)"
    - "ledger/hypotheses/H-MLKEM-007.yaml (status approved; do not change)"
    - "ledger/proposals/IDEA-20260722-001.yaml (context; do not change)"
    - "AGENTS.md, docs/task-lifecycle.md, docs/evidence-and-reproducibility.md, docs/claims-and-verification.md"
  constraints:
    - "The protocol is frozen. Any change requires a versioned protocol_amendment under experiments/EXP-MLKEM-007/amendments/ approved by the Coordinator; runs already executed are never re-scored against an amended criterion."
    - "Every run needs a manifest with exact command, git commit and dirty state, environment, seeds, stdout, stderr, raw results, validity status, timestamps, and resource measurements."
    - "claim_tier is toy: no conclusion above that tier; infrastructure failure is never evidence against the hypothesis (AGENTS.md rule 5)."
    - "Stopping and invalidation rules of the specification are binding; a timeout, crash, or implementation failure is reported as such, never as a result."
  deliverables:
    - "All artifacts enumerated in experiments/EXP-MLKEM-007/specification.yaml required_artifacts (per-run manifest.yaml, command.txt, environment.json, raw.json, summary.json, stdout.txt, stderr.txt)"
    - "experiments/EXP-MLKEM-007/execution-report.yaml"
  artifact_paths:
    - "experiments/EXP-MLKEM-007/specification.yaml"
    - "experiments/EXP-MLKEM-007/runs/"
    - "experiments/EXP-MLKEM-007/execution-report.yaml"
  write_scope:
    - "experiments/EXP-MLKEM-007/"
  archived_by: "TASK-20260727-904"
  inference:
    policy: "executor-implementation"
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 6000
    memory_gb: 4
    maximum_runs: 4
  completion_gate:
    - "Exactly 4 planned runs reach a terminal status (completed_valid, completed_invalid, failed_infrastructure, failed_implementation, resource_exhaustion, cancelled_by_budget)."
    - "Every required artifact in the frozen specification exists and is schema-valid."
    - "Validation checks pass: expected run count, no duplicated or missing seeds, raw/summary agreement, control comparability, no unrecorded protocol deviation."
    - "No claim above claim_tier toy; no status of any ledger record changed by the Executor."
  return_format: "Immutable run records per required_artifacts plus execution-report.yaml."
