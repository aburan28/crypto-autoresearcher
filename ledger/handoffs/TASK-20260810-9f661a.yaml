  constraints:
    - >-
      SC-1 C2 STAMP DUTY. As its FIRST act, before any research work, this task
      writes a stamp record carrying start_utc, start_epoch,
      declared_wall_clock_seconds and a binding_stop_utc COMPUTED as start plus
