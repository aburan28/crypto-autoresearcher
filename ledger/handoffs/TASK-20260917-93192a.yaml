  objective: >-
    Implement the D1/D2 remediation route specified in CORR-20260917-8b80cc
    for the fifteen record-schema defects in the committed EXP-QSP-33b442 run
    package. The correction's own next_actions require this to be a separate
    executor task: "This session specified the route and may not implement
    it." Ten of the fifteen are clearable; five are not, and are carried as
    declared debt rather than closed.
  uncertainty_reduced: >-
    none (record hygiene). It makes the run package validate against the
    current schema without touching any measurement, and it removes ten of
    this campaign's contributions to the errors that main-health.yml sweeps
    on main.
  route_source: 'ledger/corrections/CORR-20260917-8b80cc.yaml -- follow route.D1_route, route.D2_route_S2, route.D2_route_S5 and route.D2_route_S0 exactly; they are specified to the file.'
  write_scope:
    - experiments/EXP-QSP-33b442/runs/**   # NEW FILES ONLY; no existing byte edited
    - tools/run_supersession_registry.yaml # ADDITIVE ENTRIES ONLY
  constraints:
    - 'NO EXISTING BYTE MAY BE EDITED under experiments/EXP-QSP-33b442/runs/. Every original manifest stays byte-identical at its original path. Supersession writes manifest_v2.yaml BESIDE the original; it never replaces it.'
    - 'TOUCH NO MEASUREMENT: no count, ratio, histogram, seed, timestamp, orbit decomposition or certificate payload may be read for modification, rewritten or recomputed. The certificate verifier and certified_candidates fields are carried over VERBATIM -- the root lists are real, were re-verified by qspcore.verify_roots_f2, and nothing here weakens them.'
    - 'NEVER FABRICATE. S0 has no stdout, stderr or raw result because no program ran; writing them would describe an execution that did not occur. The route rejects that escape with reasons and so must you.'
    - 'The S2 raw-result.json must carry a loud non-result key and NO count, ratio or measurement of any kind. An aborted run acquiring a file called raw-result.json is exactly the shape of a run appearing to have produced a result; the declaration exists to make that reading impossible.'
    - 'The S2 stderr.log is an explicit TRANSCRIPTION, never a copy of stdout.log. Copying those bytes would assert they came from fd 2, which is false.'
    - 'tools/validate_ledger_baseline.txt is PRUNE-ONLY and must not be touched. Suppression is unavailable and must not be attempted.'
    - 'Run tools/validate_ledger.py AFTER writing every file you intend to hand back, never before, and report its exact error count. A gate result only covers the tree it was run against.'
  deliverables:
    - 'four manifest_v2.yaml files beside the originals in RUN-QSP-33b442-S1, -S1B, -S2B, -S3 (certificate.kind none + kind_note + run.supersedes), and four additive entries in tools/run_supersession_registry.yaml with supersession_kind certificate_schema_label_correction, both sha256 pinned, decision_id CORR-20260917-8b80cc'
    - 'RUN-QSP-33b442-S2: stderr.log transcription, raw-result.json declared-absence record, and manifest_v2.yaml with supersession_kind aborted_run_companion_completion declaring both and restating that the run remains INVALID and is not evidence'
    - 'RUN-QSP-33b442-S5: the five companions produced by a genuine re-execution of make_report.py under the wrapper to a scratch dir, copied in only after metrics.json is verified byte-identical to the committed one, plus integrity-recovery.json binding each file to its source'
    - 'a report naming the exact validator error count before and after, and the five residual S0 errors by exact text'
  budget:
