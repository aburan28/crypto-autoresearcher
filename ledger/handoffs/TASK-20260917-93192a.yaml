    runs_note: 'the Stage 5 re-execution only, which route.D2_route_S5.budget_ruling establishes does not consume specification budget.maximum_runs = 6: Stage 5 takes no measurement and is not a compute stage, and both S0 and S5 recorded that reading BEFORE this defect was raised.'
