handoff:
  id: TASK-20260810-1b82fe
  recorded_at: '2026-08-10'
  from: coordinator
  to: coordinator
  objective: >-
    On the factual audit produced by TASK-20260810-c64cf0, write the
    reconciliation memo that dispositions every stale goal-head field and every
    stale dispatch-queue entry it found: for each, the correct value, the
    committed evidence for that value, and whether this task corrects it or
    defers it with a named successor. Discharge, or explicitly re-state, the
    gate TASK-20260807-dcfaee recorded against GOAL-MLDSA-001 -- that a
    goal-head reconciliation is required before its next batch opens.
  uncertainty_reduced: >-
    Whether the dispatch plans rendered from the active portfolio can be trusted
    to describe real pending work. They currently cannot: GOAL-MLDSA-001's plan
    presents TASK-20260805-d47e12 (snapshot archive) as READY although
    EV-MLDSA-faf2ec is filed, DEC-20260805-0d59ff is committed with five KN-LIT
    promotions, and both independent reviews are committed. A harness that
    dispatches that task would duplicate a completed archive or manufacture one
    for work it did not witness.
  inputs:
    - AGENTS.md
    - agents/coordinator.md
    - coordination/reconciliation/RECON-20260810-001/tasks/TASK-20260810-c64cf0/goal_head_audit.yaml
    - coordination/reconciliation/RECON-20260810-001/tasks/TASK-20260810-c64cf0/queue_state_audit.yaml
    - coordination/reconciliation/RECON-20260810-001/tasks/TASK-20260810-c64cf0/method.md
    - coordination/goals/GOAL-MLDSA-001/batches/BATCH-001/tasks/TASK-20260807-dcfaee/reconciliation.md
    - ledger/handoffs/TASK-20260807-48b8f2.yaml
    - templates/research-records.md
  constraints:
    - >-
      THIS IS A COORDINATION ACT, NOT A RESEARCH ACT. It opens no batch, moves
      no hypothesis status, files no evidence, promotes no knowledge entry,
      approves no experiment, and closes no goal. No claim tier moves. Nothing
      here is admissible toward a closure quorum.
    - >-
      Use ONLY facts present in the c64cf0 audit files. You have no shell. If a
      value you need is UNRESOLVED there, it stays unresolved here and is named
      as such -- do not reconstruct it, and do not infer a sha from a filename,
      a date, or an adjacent record. Filing a reconstructed hash is the exact
      fabrication AGENTS.md core rule 5 forbids and the reason this two-task
      split exists.
    - >-
      Correct by SUPERSESSION, never by overwriting an immutable record. A goal
      record's head fields are current-state and may be corrected in place; a
      committed decision, evidence record, run record or checkpoint may NOT be
      edited, and a disagreement with one is recorded as a new superseding note
      that cites it.
    - >-
      An artifact existing in committed history does NOT by itself discharge the
      task that declared it. Where the audit reports ARTIFACTS_PRESENT for a
      queued entry, state explicitly whether you are treating the task as
      discharged and on what committed evidence (a decision citing it, a
      review verdict, an evidence record) -- or leaving it queued.
    - >-
      Write only beneath the assigned write_scope. Do NOT edit dispatch queues
      or goal records in this task: this memo is the disposition, and any file
      edit it directs is a separate declared successor act. Say so for each.
    - >-
      Where the audit's evidence for staleness is weak (a later batch directory
      with no committed decision citing it), say so and defer rather than
      declaring a head stale on a directory listing.
  deliverables:
    - reconciliation.md
    - disposition.yaml
  artifact_paths:
    - coordination/reconciliation/RECON-20260810-001/tasks/TASK-20260810-1b82fe/reconciliation.md
    - coordination/reconciliation/RECON-20260810-001/tasks/TASK-20260810-1b82fe/disposition.yaml
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 2400
    memory_gb: 2
    maximum_runs: 1   # one execution of this task; experiment runs authorized = 0
  completion_gate:
    - >-
      disposition.yaml has one entry per goal the audit marked HEAD_STALE or
      UNRESOLVED, each with: goal id, the field(s) wrong, the correct value and
      the committed record evidencing it, action CORRECT_NOW | DEFER, and where
      DEFER, the named successor act and why it could not be done here.
    - >-
      Every queued entry the audit reported as ARTIFACTS_PRESENT is dispositioned
      explicitly as DISCHARGED (with the committed decision, evidence or review
      that discharges it) or LEFT_QUEUED (with the reason).
    - >-
      GOAL-MLDSA-001 is addressed by name, including whether the
      TASK-20260807-dcfaee gate on opening its next batch is now discharged or
      still stands, and the state of TASK-20260805-d47e12 specifically.
    - >-
      reconciliation.md states, in plain terms, what a harness operator may and
      may not now trust in a rendered dispatch plan, and what remains unaudited.
    - >-
      No value appears anywhere that the c64cf0 audit did not establish. Every
      UNRESOLVED in the audit remains UNRESOLVED or is named as needing a
      further task.
  return_format: >-
    A YAML terminal verdict: RECONCILED | PARTIALLY_RECONCILED | BLOCKED, counts
    of CORRECT_NOW vs DEFER, whether the GOAL-MLDSA-001 gate is discharged, the
    exact next action for the harness, and the paths written.
