    claim_under_review: Let E/F_p have a prime-order subgroup <P>, n != p, and let s_tor be the torsion section
      on a lift E^/Z_p (the CM canonical model or an arbitrary integer lift). For every digit function f(k) = a_i(x(s_tor([k]P)))
      or a_i(y(s_tor([k]P))), i = 1..4, and over the half-range k = 1..(n-1)/2, max over nontrivial additive psi
      of F_p and all characters chi of Z/n of |sum_k psi(f(k)) chi(k)|^2 / n_half is below ln((p-1) n) + 12, exactly
      as for the same digits re-indexed by a random permutation and for uniform random digits. Digit 0 (the F_p
      coordinate) is the control that must obey the same bound.
    coordinator_prior: 'I expect no spike, as observed, and the main issue to be scope: the statistic is blind on
      curves with n <= 41 and tests linear characters only, so the negative covers a narrower class of leakage than
      ''no digit correlates with the discrete log''. This is a prior, not an outcome.'
    joints:
    - id: R1
      joint: 'The clean spectrum supports H-CZLIFT-fba874 as stated: no digit of s_tor carries the discrete log
        at the tested scale.'
      assigned_to: TASK-20261023-792040
      attack_plan: Bound the class of dependencies the half-range character statistic can detect; exhibit a digit
        function that depends on k but is invisible to it (non-linear, or concentrated on a few k). Use the validator's
        blind-range result (30 of 72 curves with n <= 41) to restate the scope.
      breaking_artifact: A leaking digit function the statistic cannot see, or a scope statement wider than the
        curves that could register a spike.
    - id: R2
      joint: The null and the threshold are right and the controls are independent of the signal.
      assigned_to: TASK-20261023-792040
      attack_plan: Check the Bonferroni threshold ln((p-1) n) + 12 against the actual number of tests, and the shuffled
        control including the k = 0 placeholder. Check whether the D = -3 near-misses (order-3 automorphism) inflate
        the shuffled control as well, which would hide a real excess.
      breaking_artifact: A threshold set so high that a real correlation would pass, or a control contaminated by
        the same structure as the signal.
    blindness:
      mutual: true
      lifted_for:
      - TASK-20261023-792040
      rationale: 'Hardening round: the red team reads the sealed validation report VAL-20261022-55676f so that it
        attacks the admissible receipts and the defects already found, not the raw package from scratch. Other red-team
        reports of this round stay blind.'
    proves_too_much:
      objects:
      - id: PTM-1
        object: The planted digit floor(p k / n) mod p, a deterministic function of k.
        known_false_conclusion: No digit derived from s_tor carries the discrete log.
        expected_failure_signature: The statistic must spike on it where (n-1)/2 exceeds the threshold, which VAL-20261022-55676f
          confirms on 42 of 72 curves; the red team checks the inference is not stated on the other 30.
      failure_signature: The statistic must spike on it where (n-1)/2 exceeds the threshold, which VAL-20261022-55676f
        confirms on 42 of 72 curves; the red team checks the inference is not stated on the other 30.
      assigned_to: TASK-20261023-792040
