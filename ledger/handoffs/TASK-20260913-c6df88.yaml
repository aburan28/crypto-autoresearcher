handoff:
  id: TASK-20260913-c6df88
  from: coordinator
  to: executor
  objective: >-
    Formalize TASK-20260913-0d9fe6's literature digest plus
    specification.yaml's own text into the actual frozen audit-artifact
    deliverable for EXP-CRYPTO-6505c6: the 20 files specification.artifacts
    declares, with the 160-cell obligation matrix and 400-cell chart-
    coverage matrix each cell given an explicit status. This is the third
    stage of a three-stage pipeline corrected after TASK-20260913-4e7c6d's
    role-routing defect: (1) TASK-20260913-4e7c6d found and disclosed the
    routing error and did the one piece of in-scope literature verification
    it could; (2) TASK-20260913-0d9fe6 (idea-generator, in authority for
    web_search) produced a complete literature digest; (3) this task
    (executor, in authority for may_execute_experiments) formalizes that
    digest into the frozen schema without needing web access itself.
  uncertainty_reduced: >-
    Whether specification.yaml's 160+400 cells can actually be filled to
    real, source-grounded verdicts from the digest plus the specification
    text alone -- and, given the digest's own major findings (family L is
    entirely absent from the cited primary source; Theorem 2.4 is
    ineffective; Sections 5-6 containing the actual moment-bound proof were
    unretrievable), how much of the panel can be honestly CERTIFIED versus
    must be recorded OPEN with its exact missing prerequisite.
  inputs:
    - experiments/EXP-CRYPTO-6505c6/specification.yaml (the complete frozen
      contract -- read in full; this handoff does not repeat its content)
    - coordination/design/BATCH-aa0d38/audits/TASK-20260913-0d9fe6/source-digest.md
      (the literature digest this task formalizes -- read in full; its
      tagging convention, [QUOTE]/[INFERENCE]/[NOT FOUND]/[OUT OF SCOPE],
      tells you exactly what is source-grounded versus your own reasoning)
    - ledger/handoffs/TASK-20260913-4e7c6d.yaml (background on the
      role-routing correction; its coordinator_correction_20260913 field
      has the first-pass effectiveness finding the digest re-confirms)
    - coordination/design/BATCH-aa0d38/design-note.md
    - coordination/design/BATCH-aa0d38/checkpoint.md
  constraints:
    - >-
      Write only under
      experiments/EXP-CRYPTO-6505c6/audits/TASK-20260913-c6df88/, matching
      specification.artifacts' exact 20-file root layout (audit-manifest.yaml,
      source-readings.yaml, source-hypothesis-matrix.yaml, case-index.yaml,
      obligation-results.yaml, chart-coverage.yaml, normalization-and-weights.yaml,
      complexity-ledger.yaml, shared-constituents.yaml, moment-certificates.yaml,
      stratification-application.yaml, control-results.yaml, counterexamples.yaml,
      open-obligations.yaml, work-and-resources.yaml, audit-report.md,
      certificate-bundle.md, dependency-dag.yaml, checker-results.yaml,
      artifact-sha256.json). Do not modify specification.yaml, the digest, or
      any ledger record other than this one. You have no web_search
      capability and must not attempt to fetch or invent primary-source
      content beyond what source-digest.md already reports; where the
      digest says [NOT FOUND] or discloses a gap, that gap is real and
      stays real in your output too -- do not silently fill it in.
    - >-
      No numerical run, no code execution beyond reading, no invented
      citation, proof step, or certificate. Per specification's own
      independent_checker_plan.semantic_output, your verdicts are not yet
      an independent qualified review -- say so plainly in audit-report.md.
    - >-
      Carry forward, do not re-litigate, the digest's two major findings
      unless your own reading of specification.yaml plus the digest gives
      you a genuine reason to differ (state the reason explicitly if so):
      (a) Theorem 2.4 is ineffective as stated (no explicit formula for its
      implicit constant) -- obligation O06, and every cell whose CERTIFIED
      status would depend on a certified effective bound, must be OPEN with
      that exact missing prerequisite named, per specification.stopping_rule's
      "record missing ...effectiveness prerequisites as OPEN rather than
      silently assuming them"; (b) family L ("Legendre R^1") does not
      appear anywhere in the cited primary source -- every case row using
      family L (case-02, case-04, case-06, case-08, case-10, case-12,
      case-14 per specification.symbolic_cases) needs its own honest
      status reflecting that the primary source supplies no family-specific
      facts for L at all (rank/purity/ramification/boundary values must
      come from elsewhere or an independent derivation the digest itself
      flags as not performed here) -- this does not mean these cells are
      automatically REFUTED or CERTIFIED; work out and state the correct
      status per specification's own statuses list, most likely OPEN or
      NOT_APPLICABLE_WITH_CERTIFICATE depending on exactly what each
      specific obligation asks for that case.
    - >-
      Work case_order exactly as specified: case-15 and case-16 (known-false
      cancellation controls) first, then exceptional-geometry and
      matched-null cases, then excluded-base diagnostics, then case-01/
      case-02 (main targets) last.
    - >-
      Every one of the 160 obligation cells and 400 chart cells gets an
      explicit status from specification's own six-value statuses list --
      an absent or silently-skipped cell is a defect in this deliverable.
      Where the digest's own gaps (unretrieved Sections 5-6 and 3.1-3.2,
      the unresolved "n vs d" ambiguity) make a cell impossible to resolve
      honestly, that cell is OPEN or NOT_ATTEMPTED_AFTER_STOP with the
      exact reason quoted from the digest -- not invented, not silently
      resolved in whichever direction looks more complete.
    - >-
      No claim beyond specification.outcomes/success_criterion/
      falsification_criterion. Given the digest's findings, a realistic,
      honest overall outcome for this audit pass is likely INCONCLUSIVE for
      at least one family (very plausibly both, given L's total absence
      from the source and O06's ineffectiveness), not
      CERTIFIED_MAIN_SCOPE -- do not stretch the evidence to reach a more
      positive-sounding overall classification than the source material
      actually supports. An honestly INCONCLUSIVE audit that correctly maps
      every remaining obligation is a complete, useful deliverable; a
      falsely CERTIFIED one is not.
    - Never select a provider, backend, endpoint, or model identifier containing Bedrock, case-insensitively.
  deliverables:
    - experiments/EXP-CRYPTO-6505c6/audits/TASK-20260913-c6df88/ (all 20 root files per specification.artifacts)
  artifact_paths:
    - experiments/EXP-CRYPTO-6505c6/audits/TASK-20260913-c6df88/
  archived_by: null
  inference:
    policy: executor-implementation
    reasoning_effort: medium
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: null
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
    - All 160 obligation-results.yaml rows and all 400 chart-coverage.yaml rows carry one of the six declared statuses with a reason/certificate anchor traceable to either specification.yaml or source-digest.md.
    - case_order followed exactly; case-15/case-16 controls worked and recorded before case-01/case-02.
    - open-obligations.yaml explicitly lists O06's effectiveness gap and family L's total absence from the source, each with its exact missing prerequisite, not a vague "needs more work."
    - The overall per-family outcome is justified by what the digest and specification actually support, not inflated toward CERTIFIED_MAIN_SCOPE.
    - audit-report.md states plainly that these verdicts are not yet independently reviewed.
  review_plan: null
