        are satisfied in the repository as it is (frozen sources present;
        instrument named or its construction charged in the contract). If
        the design_now idea's prerequisite is a source freeze, write the
        zero-run freeze card (TASK-20260921-900fb3, to executor-mechanical
        or executor, maximum_runs 0, write_scope under inputs/<NEW-PACKAGE>/
        and one knowledge/literature/ entry) and record in the decision that
        the design is gated on that freeze; do not design against a recalled
        source. Designing is not approving (AGENTS.md ECC-first instruction
        3).
    - id: C-4
      text: >-
        A CONTRACT IS APPROVED ONLY IF COMPLETE. Use the design-experiment
        procedure and, for a cost-model deliverable, its cost-model pattern
        (measured vs modeled separation, optimistic-assumption disclosure,
        memory accounting, hidden-overhead honesty, standardized parameter
        sets). Every required field must be non-null and every criterion
        decidable: controls, metrics.primary, independent_variables,
        replication seeds, budget (advisory; memory_gb is machine
        protection), stopping_rules, invalidation_rules, success_criterion,
        falsification_criterion, required_artifacts, preregistered_prediction
        with source. If any field cannot be filled from committed state, leave
        status review_required and approved_by null, record the concrete
        impediment in the decision, and do not write an approval decision.
        If complete, record approval in DEC-20260921-b5c2da (kind
        protocol_approval) citing the standing user authorization of
        2026-09-06 exactly as DEC-20260920-fe73de does, set approved_by
        coordinator and approval_decision on the contract, and move the
        hypothesis to approved (pre-run; not supported).
    - id: C-5
      text: >-
        IDENTIFIERS AND PATHS, pre-minted and checked; use in order, leave
        the rest unused, mint nothing: decisions DEC-20260921-683a85 then
        DEC-20260921-b5c2da; hypotheses H-GFPN-3366ea then H-GFPN-6a2056;
        experiments EXP-GFPN-659e34 then EXP-GFPN-f5db54 (directory
