        every card you write is TASK-20260921-539d4e, the snapshot archive
        that binds this task's outputs; the dispatching session runs it.
    - id: C-6
      text: >-
        EDIT NO IMMUTABLE RECORD. Proposals, existing hypotheses, existing
        contracts, existing cards and existing decisions are read-only. The
        ONE existing file you may edit is ledger/goals/GOAL-GFPN-380702/
        goal.yaml, additively: append to active_hypothesis_ids, replace
        next_action with exactly one action naming its role and, if that
        action is a scientific trial, the /run invocation; set updated_at
