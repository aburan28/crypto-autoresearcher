    - id: C-7
      text: >-
        DECISION SCHEMA (tools/validate_ledger.py): a coordinator_decision
        needs id, decision, target_ids, knowledge_promotion (promoted list;
        an empty list needs a nonempty not_warranted reason), decided_by;
        follow DEC-20260920-fe73de's field set (context, decision_scope,
        authorization, rationale, evidence_refs as paths, limitations,
        next_actions, decided_at). A decision may not carry a citations
        entry with provenance recalled; cite frozen sources and committed
        records by path only. A hypothesis needs question_id, statement,
        mechanism, status; an experiment needs hypothesis_id, version,
        status, metrics, budget, success_criterion; a handoff needs id,
        from, to, objective, budget, plus the AGENTS.md envelope (inputs,
        constraints, deliverables, artifact_paths, archived_by, inference,
        completion_gate) and dispatch_preconditions.
    - id: C-8
      text: >-
        HONEST TIERS. No record asserts a result. A design of a constant-
        factor or instance-economics idea says so in its hypothesis
        asymptotic_claim (claim_kind constant_factor) and in the decision's
        rationale, and is ranked on what it decides for C1-C5, not on
        novelty. A hold is not a rejection: it names the reranking evidence.
        Do not deprioritize a plausible lead without recording the evidence,
        budget, boundary and revisit condition (AGENTS.md rule 9).
    - id: C-9
      text: >-
        RETURN FORMAT. Plain text: the ranking table (idea, disposition,
