handoff:
  id: TASK-20260803-f7a12c
  from: coordinator
  to: executor
  objective: 'Execute the check the BATCH-016 red team specified, verbatim and without redesign. Refit
    the archived degree-5 rate model on scores 551-851 of the n=43 file. Instead of collapsing to the
    mean, KEEP THE 301 PER-CELL TERMS t_T = (D_T - mu_T)^2 / (mu_T (1 - h_T)) and regress them on occupancy
    mu_T/4000. Calibrate the regression under the producer BATCH-015 own N1 (independent Poisson) and
    N2 (minimum-variance independent iterations) generators, so the null distribution of the slope is
    measured rather than assumed. The question it settles: BATCH-016 measured an occupancy SLOPE of +0.197
    against a floor-member null of -0.967 +/- 0.337 using terciles; a per-cell regression uses all 301
    cells and is the sharper instrument. Is the low-occupancy deficit STRUCTURAL -- i.e. is the slope
    genuinely positive, contradicting the floor-member prediction -- or is the tercile result an artifact
    of binning into three groups? Report the slope with its own standard error under each null, and the
    intercept. Run the same regression on the n=50 file as a second instance.'
  uncertainty_reduced: Whether the low-occupancy deficit that rejected the floor as a reference point
    is structural at per-cell resolution, or an artifact of tercile binning. BATCH-016 is currently the
    only measurement of it and it used three groups; this uses 301 cells.
  inputs:
  - experiments/EXP-MLKEM-011/vendor-lock/data/ archived .out files
  - coordination/goals/GOAL-MLKEM-003/batches/BATCH-016/tasks/TASK-20260803-6329c6/ (the red-team package
    specifying this check)
  - coordination/goals/GOAL-MLKEM-003/batches/BATCH-015/tasks/TASK-20260803-d9afbd/ (the N1/N2 generators
    and degree-5 model)
  - ledger/evidence/EV-MLKEM-ee220e.yaml and EV-MLKEM-ce1884.yaml
  constraints:
  - Never fabricate a command, output, timing, statistic, citation, or run (AGENTS.md rule 9).
  - 'ZERO NEW SAMPLING of the physical system: no G6K, no network, no new .out bytes. Seeded randomness
    for your own null objects is expected; disclose it.'
  - Toy tier; raw undivided score scale; NO ML-KEM security claim.
  - 'AGENTS.md rule 12 stays UNMET and UNWAIVED: EV-MLKEM-011, EV-MLKEM-013 and EV-MLKEM-017 keep their
    status; KN-FIND-031 stays withdrawn.'
  - 'BINDINGS IN FORCE: no whole-band ratio without its effective degrees of freedom; do NOT quote a specific
    dof value (state O(1), range 1.51-2.35, give the C>=1000 comparison); read a congenial control code
    before summarising it; a re-derivation reaching the same conclusion by the same route is NOT an independent
    check -- state which STEP you checked; decompose rms into bias and centred scatter before inferring
    fit-dependence; before asserting the archive LACKS something, open the directory and NAME THE COMMAND
    that established it; a minimum over a family is NOT the expected value of the statistic.'
  - Write only inside the declared write_scope. Do not edit any prior artifact or ledger record. Do not
    git commit.
  - You record OBSERVATIONS ONLY. Do not conclude that the floor is or is not the right reference, nor
    that Approximation 4.9 is validated or refuted.
  - IMPORT the BATCH-015 generators and rate model rather than retyping them, and say so. BATCH-015 Job
    B was trustworthy precisely because it imported rather than reimplemented.
  - The per-cell terms are heteroscedastic and NOT independent (they share a fitted rate model). Say how
    you handled that; an ordinary least-squares standard error would be wrong and quoting one without
    comment is a defect.
  - 'If the slope comes back consistent with the floor-member null after all, say so plainly: that would
    REINSTATE the floor as a reference point and reverse a BATCH-016 blocking objection.'
  deliverables:
  - 'percell_occupancy_regression.py: the exact script run'
  - 'results.json: slope and intercept with standard errors under each null, per file, plus the null calibrations'
  - 'report.md: whether the deficit is structural at per-cell resolution'
  artifact_paths:
  - coordination/goals/GOAL-MLKEM-003/batches/BATCH-017/tasks/TASK-20260803-f7a12c/percell_occupancy_regression.py
  - coordination/goals/GOAL-MLKEM-003/batches/BATCH-017/tasks/TASK-20260803-f7a12c/results.json
  - coordination/goals/GOAL-MLKEM-003/batches/BATCH-017/tasks/TASK-20260803-f7a12c/report.md
  archived_by: TASK-20260803-6b6f9d
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 2400
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
  - slope and intercept reported with standard errors under BOTH nulls, for BOTH files
  - the heteroscedasticity and shared-rate-model dependence explicitly handled and described
  - an explicit statement of whether the low-occupancy deficit is structural at per-cell resolution
