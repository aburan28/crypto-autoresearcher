handoff:
  id: TASK-20260801-016
  from: coordinator
  to: validator
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-022
  objective: >-
    Validate the integrity of the RUN-SMTH-001-heur package on the TASK-20260801-015
    snapshot only. Return ADMISSIBLE or INADMISSIBLE with concrete defects, and answer
    every M-0 and M-5 guard condition explicitly.
  uncertainty_reduced: >-
    Whether the sampling package is admissible as empirical_only toy-tier evidence, and
    in particular whether any pre-registered guard fired.
  inputs:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-022/archives/TASK-20260801-015/snapshot_commit_receipt.json
  - experiments/EXP-SMTH-001/specification.yaml
  - ledger/hypotheses/H-SMTH-001.yaml
  constraints:
  - INDEPENDENT SESSION. Read only the TASK-20260801-015 snapshot commit.
  - >-
    REGENERATE, DO NOT ACCEPT. Rebuild both curve instances from master seed 2201,
    rebuild both 512-element factor bases, and confirm factor_base_sha256 at each bit
    size.
  - >-
    Recompute INT-1 yourself on a sample of half-tuples from the specification alone
    and confirm the recorded N and M values, including the elementary symmetric
    functions and the ENC-B and ENC-A encodings.
  - >-
    Confirm the real sample sets are EXHAUSTIVE over the C(513,2) = 131328 unordered
    half-tuples with no duplicate and no omission.
  - >-
    Independently re-verify factorizations with your own arithmetic - recompute the
    product of recorded prime powers and re-check primality of every factor - and
    report verified over total per sample set.
  - Confirm every recorded sample lies in [1, p**2] and that p**2 <= D at both bit sizes.
  - >-
    Recompute every u from the frozen Bsm ladder and confirm the recorded rho values
    against your own evaluation of the Dickman function; flag any discrepancy above 1
    percent.
  - >-
    Recompute the KS statistic, the rate-band verdicts at every powered rung, the tail
    statistic with its exact p_ext, the two-sample KS statistics and the decay ratios,
    from the raw record.
  - >-
    Confirm the null pipeline differs from the real pipeline ONLY in the source of the
    integers, by direct source reading, and report any other difference as a defect.
  - >-
    Report explicitly whether ANY M-0 or M-5 guard fired - a short sample set, an
    out-of-range sample, a factorization mismatch, a primality failure, an undeclared
    degenerate-draw rate above 1 percent, an irreproducible INT-1, a timeout, crash,
    resource exhaustion or budget cancellation, a null that fails its own Dickman
    checks, an ENC-A power certificate that fails to reject, or an apparatus-identity
    control that rejects.
  - Confirm the run package contains NO search arm, NO timing decision variable, NO cost identity and NO R.
  - >-
    Confirm manifest.yaml is present with its required fields and that command.txt,
    environment.json, stdout.log, stderr.log and raw-result.json exist beside it.
  - >-
    Do NOT interpret the heuristic, do NOT classify the result against RR-SMTH-1, and
    do NOT state a disposition.
  - Timeouts and crashes are infrastructure, never mathematical negatives.
  - MAKE NO COMMIT.
  - Do not alter any ledger record.
  deliverables:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-022/reviews/TASK-20260801-016/validation_report.yaml
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-022/reviews/TASK-20260801-016/validation_report.yaml
  archived_by: TASK-20260801-018
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 5400
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
  - >-
    ADMISSIBLE or INADMISSIBLE recorded with concrete defects if any, plus an explicit
    statement on every M-0 and M-5 guard condition and an independent recomputation of
    every load-bearing statistic.
