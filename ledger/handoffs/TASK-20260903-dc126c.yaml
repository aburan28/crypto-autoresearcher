    - inputs/h100_session/EC_SIEVE_HONEST_LEDGER.md (D5, the Yokoyama semi-normality object, recovered and never implemented; D6 unresolved), inputs/h100_session/HYPOTHESES_100.md (H002 symmetrized Groebner, 6:1 orbit quotient, exponent-neutral; H011 d_reg - d_ff gap; H013 syzygy counts 1 at D3, 8n/3 at D4), inputs/h100_session/h002_symmetrized_gb.json
    - experiments/EXP-SBRG-60c55e/driver/macaulay.py, src/ic_first_fall_fast.py, src/h012c_block_m4ri.py, harness/semaev.py
