  constraints:
    - >-
      Ids, in order of use: IDEA-20260903-d52480, IDEA-20260903-afa56b,
      IDEA-20260903-f7e8a6, IDEA-20260903-26aa81, IDEA-20260903-dcf857,
      IDEA-20260903-958a4f. Unused ids remain unused and are accounted for.
    - >-
      C1 (LAST-FALL-DEGREE TRANSFER TO THE DIGIT PRESENTATION). KN-LIT-7605
      reports that the last fall degree of Weil-descent summation-polynomial
      systems over F_2 is bounded independently of the extension degree n,
      and KN-LIT-7607 defines the invariant order-independently. The
      prime-field digit presentation of IDEA-20260830-84cdb7 is the exact
      structural analogue (s digit variables per coordinate, field equations
      a(a-1) = 0 over F_p in place of a^2 = a over F_2). The corner: state
      the mechanism of the bounded-last-fall proof as far as it can be
      reconstructed or retrieved (WebFetch arXiv 2103.07282 if possible;
      provenance retrieved), identify which step uses characteristic 2 or
      the subfield structure, and derive whether the bound transfers to the
      digit presentation over F_p, transfers with a different constant, or
      fails. Then design the measurement (last fall degree on the s-ladder
      at d = 2, m = 2 and 3, with the semi-regular null of 84cdb7 and a
      random multilinear null) and state what a bounded last fall degree
      would license (it bounds one complexity measure; 7605 itself says it
      is not a breakthrough). Discriminate from 84cdb7 (first fall slope),
      afe4ce (last-fall FLOOR for the direct presentation), and lane B's B1
      (algebraic immunity, first fall).
    - >-
      C2 (THE YOKOYAMA SEMI-NORMALITY OBJECT AS A PRIME-FIELD SEMI-
      REGULARITY WITNESS). EC_SIEVE_HONEST_LEDGER item D5 reclassified the
      old "KILL (proxy)" to OPEN / wrong-object: the proxy measured
      normality, whereas Yokoyama's semi-normality is a signature/F5
      S-polynomial condition (NS(Syz), Phi(s), #G* counting nonzero
      S-polynomial remainders in the non-reduced basis), recovered in a
      D5_YOKOYAMA_OBJECT.md that may not be in this repository - if it is
      absent, say so and reconstruct the object from the literature with
      provenance marked. The corner is a measurement proposal: implement
      the #G* / reductions-to-zero census as the F5-criterion witness of
      semi-regularity on the direct and digit presentations over F_p, with
      a semi-regular random system of the same shape as the null (where
      every reduction to zero is predicted by the F5 criterion) and a
      planted-syzygy positive control of dialled size. State what a
      non-zero excess of unpredicted reductions would and would not mean.
      Discriminate from RQ-SIG-001 / H013 (syzygy counts on the BINARY
      chained system) and from IDEA-20260805-d38a8c (planted syzygy family
      as instrument-power audit).
    - >-
      C3 (THE MOLIEN-SERIES NULL FOR THE SYMMETRIZED SYSTEM). H002 of
      HYPOTHESES_100 measured a 6:1 orbit quotient and about 10x per
      doubling in BOTH arms for the symmetrized S_3 formulation and called
      the exponent unchanged - but no matched null for the symmetrized
      presentation was ever written down. The corner: derive the exact
      semi-regular reference for the system in elementary symmetric
      coordinates (or in the invariant ring of the relevant group) from the
      Molien series / Hilbert series of the invariant ring, so that the
      symmetrized system's degree profile has its own null rather than
      borrowing the raw system's; state what H002's 6:1 becomes under that
      null and whether any residual is left to explain. Discriminate from
      KN-TECH-012 (isotypic decomposition of the RELATION matrix, not the
      decomposition ideal), IDEA-20260830-1a08f9 (Galois tower over the
      symmetric base), IDEA-20260807-1ea327 and 5ddccf (invariant
      coordinates at special j).
    - >-
      C4 (THE p-INDEPENDENCE CONTROL). In the digit presentation at fixed
      (m, s, d) the only p-dependence is in the coefficients of the
      substituted S_{m+1}. If d_ff, last fall degree and the D = 3, 4
      Macaulay deficit do not move with p at fixed shape, the structure is
      carried by the shape and IDEA-20260731-009's HEUR-FF-1 (shape-
      determined regularity) is licensed on the prime-field side; if they
      do move, the coefficient distribution carries it and crypto-size
      shape sampling is not a valid surrogate. Design the control as a
      two-outcome test with the sizes, primes and seeds pre-registered, the
      structural tell named (a quantity that should vary with p and does
      not is the artifact signature, per inventor-protocol section 3), and
      the random-coefficient null of the same shape. Discriminate from
      731-009 (which proposes the surrogate but no p-sweep) and from
      IDEA-20260807-4fc635 (PGL_2 coordinate null).
    - >-
      C5 (THE CONDITIONAL CROSSBRED / XL COST TABLE UNDER A BOUNDED LAST
      FALL DEGREE). IDEA-20260808-da1428 shows that under semi-regularity
      full guessing beats every algebraic split. If C1's bound transfers
      (or 84cdb7's H1 holds), the residual system after guessing k digits
      has a bounded degree and the optimal crossbred split (KN-LIT-139)
      changes qualitatively. The corner is a composition record in the
      shape of a concrete_cost table (templates/research-records.md):
      charged cost of the digit-presentation decomposition oracle as a
      function of (m, s, d, k, D_bound), with every optimistic assumption
      flagged, the semi-regular case reproducing da1428 exactly as the
      baseline slice, and the standardized parameter sets log2 N in {64,
      128, 256}. It claims nothing unconditional. Discriminate from
      da1428, from IDEA-20260808-fc5e3e (crossbred on the BINARY Weil-
      descent attack), and from 84cdb7's own conditional exponent (which
      assumes a Macaulay solve, not a crossbred split).
    - >-
      C6 (FREE SLOT). Use only for a solver-side or degree-invariant corner
      distinct from C1..C5, lanes A and B, and every input record;
      candidates include the first-syzygy Betti taxonomy of the direct
      presentation across characteristic (discriminate from
      EV-ICINV-343679 and KN-FIND-006) or an order-independent solving-
      degree witness via polynomial-calculus degree (discriminate from
      IDEA-20260806-e4f96e). Otherwise leave IDEA-20260903-958a4f unused.
    - >-
      Zero compute and zero implementation; experiment maximum_runs is 0;
      every number is a derivation or a screening statement; no imagined
      outcomes. Retrieval index unavailable this round (empty embedded
      store): screen by Read and Grep and WebSearch/WebFetch, record what
      was read and grepped in novelty_screen, treat absence as a floor. No
      novelty label stronger than unverified on a recalled citation; every
      citation carries provenance and verified_by where required.
      discriminated_from, null object, two outcomes, cheap falsifier,
      heuristic_assumptions, target_complexity, dominated_by checked
      against catalogue A1-13, quantitative sota_delta: all mandatory. No
      hypothesis, experiment, or status change; drafts to the scratchpad
      laneC/ directory only, filed by the orchestrating session after a
      schema check.
  deliverables:
