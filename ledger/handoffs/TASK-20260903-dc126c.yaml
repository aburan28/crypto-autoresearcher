handoff:
  id: TASK-20260903-dc126c
  from: coordinator
  to: idea-generator
  question_id: RQ-PFDR-ae2fba
  related_handoffs: [TASK-20260903-22c36b]
  objective: >-
    Third lane of the RQ-PFDR-ae2fba ideation round, opened at the user's
    request for ideas on the GROEBNER-BASIS AND DEGREE-OF-REGULARITY
    MACHINERY ITSELF, as distinct from the representation side (lane A of
    TASK-20260903-22c36b) and the mechanism/measurement/control side (lane
    B). The object of study is the family of degree invariants of prime-
    field point-decomposition systems - first-fall degree, last-fall degree,
    degree of regularity of the homogenised ideal, solving degree of a
    named algorithm under a named order, Macaulay rank deficit against a
    named null - and the solvers that consume them (F4/F5, XL and its
    Wiedemann form, crossbred and hybrid splits, invariant-ring
    reductions). Return up to six schema-complete, novelty-screened,
    falsifiable proposals against the pre-allocated ids, and an honest
    accounting for every corner that is already proposed, closed, or not
    convertible into a discriminating test. Same protocol as
    TASK-20260903-22c36b: inventor-protocol object-first framing,
    lossy-projection test, null object before belief, numbered heuristic
    assumptions with validation routes, target_complexity, checked
    dominated_by, quantitative sota_delta.
  uncertainty_reduced: >-
    Which degree invariant actually governs the charged cost of prime-field
    decomposition under each presentation, whether any of them is bounded
    or sub-generic in a way that a named solver can exploit, and which
    solver-side lever (order, algorithm, split, symmetry reduction) has a
    matched null that has never been written down.
  inputs:
    - ledger/handoffs/TASK-20260903-22c36b.yaml (the parent handoff; its inputs, constraints and off-limits list apply verbatim; lanes A and B corners are off-limits here)
    - ledger/questions/RQ-PFDR-ae2fba.yaml
    - ledger/questions/RQ-SDEG-001.yaml, RQ-DREG-001.yaml, RQ-SIG-001 (ledger/RQ-SIG-001.yaml)
    - ledger/proposals/IDEA-20260830-84cdb7.yaml, IDEA-20260808-093497.yaml, IDEA-20260808-da1428.yaml, IDEA-20260808-afe4ce.yaml, IDEA-20260806-7ea402.yaml, IDEA-20260815-05c761.yaml, IDEA-20260815-ad4b55.yaml, IDEA-20260808-6a2b50.yaml, IDEA-20260806-e4f96e.yaml, IDEA-20260808-fc5e3e.yaml, IDEA-20260731-009.yaml, IDEA-20260807-1ea327.yaml, IDEA-20260807-5ddccf.yaml, IDEA-20260830-1a08f9.yaml, IDEA-20260803-202a15.yaml, IDEA-20260805-f49efb.yaml, IDEA-20260828-1cc572.yaml, IDEA-20260828-d91efa.yaml
    - ledger/hypotheses/H-SDEG-082f7f.yaml, H-PFGB-f9ae08.yaml, H-DREG-001 (ledger/H-DREG-001.yaml)
    - ledger/FINDING-PF-IC-001.md; ledger/EV-DREG-001.yaml..003; ledger/evidence/EV-SIG-008.yaml; ledger/evidence/EV-DREG-008.yaml
