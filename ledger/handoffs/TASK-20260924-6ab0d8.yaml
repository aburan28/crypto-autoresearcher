  objective: >-
    Reduce the uncertainty in whether the per-attempt Macaulay trace replays
    across relation attempts over F_{2^n} (regime B, D = 66) where it does not
    in regime A, on identical targets; whether the regime-B elimination
    decides the attempt at that D; and where satisfiable attempts diverge.
    Implement experiments/EXP-CERTBIN-a58c63/impl/ (regime A copied from the
    reviewed Stage-1 impl and generalized; regime B new) and verifier/ from the
    frozen specification (version 1), run it once over the four cells, and
    return observations. Interpret nothing beyond DB-1..DB-12.

  uncertainty_reduced: >-
    The regime-B P-GPU verdict per cell (DB-7), TS2B's break-count and n-decay
    predictions, E3 at the deciding cells, Lemma B-S per instance, and the
    regime-A replay-form law at l in {5, 6}. Positive: a regime-B replay cost
    contract at the solving degree becomes admissible. Negative: P-GPU has no
    remaining route among the idea's stages.

