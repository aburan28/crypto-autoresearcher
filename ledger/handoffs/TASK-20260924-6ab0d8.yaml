    - experiments/EXP-CERTBIN-a58c63/specification.yaml (frozen v1; object, seeds, counts and controls are the implementation spec)
    - ledger/hypotheses/H-CERTBIN-b20d4e.yaml (Lemma B-S, Lemma 2B, TS2B, TS2G) and H-CERTBIN-7c3a18.yaml
