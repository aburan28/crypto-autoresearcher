    - experiments/EXP-CERTBIN-4e92d7/runs/RUN-CERTBIN-3b7e05/ (curve.json for n = 17; references.json and targets-F-S3.jsonl.gz for C-PROV), read only
    - ledger/proposals/IDEA-20260923-5d0b8e.yaml (Stage 2 text; background)

  constraints:
    - id: EX-1
      text: >-
        SELF-TESTS, FIXTURES, C-PROV AND THE PILOT FIRST. C-SELF, C-FIX (both
        regimes, every cell), C-PROV on archived Stage-1 instances, then the
        timing pilot on S_selftest only (timings and self-test pass/fail are
        the ONLY pilot outputs). The count schedule (C_std or C_low) is decided
        by the specification's rule and written to pilot.json and the manifest
        before any frozen stream is drawn. Never substitute a modulus, adjust
        a dimension or pick a schedule by anything but the rule.
    - id: EX-2
      text: >-
        The n = 19 modulus is the lexicographically smallest irreducible
        pentanomial, found by exhaustive test and recorded; the n = 19 curve
        and points come from S_curve19 and S_pts19 by the Stage-1 rules. The
        n = 17 cells use the Stage-1 curve and points from curve.json.
    - id: EX-3
      text: >-
        SEEDS AND COUNTS ARE FROZEN (seeds.formula, seeds.fixed, the chosen
        schedule). Identical x_R bytes feed both regimes at a cell. Sample
        without replacement in x_R; record every rejection, including the
        rejection-sampling draws of F-SAT.
    - id: EX-4
      text: >-
        LEMMA B-S IS AN INSTRUMENT PREDICTION. Compute delta per regime-B unsat
        instance and check C-DELTA and C-RANKB exactly as written. A mismatch
        marks the cell's regime-B metrics INVALID pending adjudication; report
        it verbatim with the instance, and do not tune anything to remove it.
    - id: EX-5
      text: >-
        DIVERGENCE CLASSIFICATION AND BREAKS. Classify every first divergence
        (ZERO-PIVOT, ROW-ORDER, COLUMN, PREFIX); re-verify every regime-B
        ZERO-PIVOT break with the independent determinant module (C-BREAK);
        run the fixed-schedule replays exactly on the declared targets
        (C-REPLAYB); estimate K_B from S_probe only.
    - id: EX-6
      text: >-
        EVERY CONTROL CAN FAIL: implement each control's fails_if exactly,
        including C-PROPS' three modes with PS0' certificates verified by
        verifier/verify_cert.py in a SEPARATE PROCESS that imports nothing from
        impl/.
    - id: EX-7
      text: >-
        DECISION RULES ARE MECHANICAL. Apply DB-1..DB-12 as written, M3 with
        its first-match precedence, exact arithmetic for every interval and
        tail (RC-3). No threshold added, no cell or reference dropped, no
        granularity chosen after seeing results.
    - id: EX-8
      text: >-
        OBSERVATIONS ONLY. No status change, evidence, decision or knowledge
        record; no edit of any specification, ledger record or EXP-CERTBIN-
        4e92d7 file. Retain every failed attempt. Do not commit.
    - id: EX-9
      text: >-
        RESOURCES (machine protection). 4 GB cap; one worker, rising to at
        most 2 only after the serial-versus-sharded byte-identity check on the
        20 lowest-idx F-S3 targets of cell (17, 6), both regimes, is recorded
        in the manifest; watchdog 259,200 s with checkpoint and --resume;
        maximum_runs 2 (the second only after an INFRASTRUCTURE failure). Two
        other CERTBIN executors may share this 4-core, 15 GB machine; if the
        dispatching session reports memory pressure, stay at one worker.
    - id: EX-10
      text: >-
        SCOPE AND TIER. Claim tier toy; constant factor at most; sota_delta
        zero; oracle A per attempt and parallel rho dominate. No GPU is run.
        A "stable" regime-B verdict at l = 6 is not a P-GPU result (DB-7);
        write that in run-report.md.

