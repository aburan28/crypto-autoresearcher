  constraints:
  - Root Coordinator implements this correction directly. Own only nine exact new artifacts. You are not alone;
    no edits to predecessors,contracts,schema,other queues,claims or shared modules. Prior failed source and
    all custody gaps remain unchanged.
  - Read all declared inputs and verify exact hashes. The complete effective_contract approved by DEC-20260908-aa587b
    and d18d13 schema62060930e01b80306a7458623399555dedc80c61f6c77761f72ec2ee7884db3a govern. Scope is the
    complete cost_contract,baseline_selection,analysis_and_decision and cost-related hard-validity predicates,including
    their timing/certificate-context interfaces. No scientific statistic,threshold,matrix,seed or allocation
    convention changes.
  - Implement a complete connected component,not isolated demonstration helpers. costs.py owns strict carriers,typed
    raw records and physical-accounting validation; allocations.py owns validated context,all eligible edge
    construction and edge validation; reducers.py owns reductions from validated retained rows/edges/timing
    facts and cost-derived output coverage. Preserve useful predecessor logic only after checking it against
    the complete contract.
  - Use Python standard library plus already installed PyYAML6.0.3 and jsonschema4.26.0 where needed. Record
    Python/runtime identity. No installs,network,provider/model probes,arithmetic library subprocesses or scientific
    runtime. Modules are inert on import; input schemas contain no remote resolution or user-selected schema
    path/hash.
  - Closed schema and lexical validation are mandatory defaults,not optional caller-supplied component_phases.
    Strict UTF8 JSON rejects duplicate keys,nonfinite/floating tokens where forbidden,unpaired Unicode and
    non-JSON coercions. Apply exact raw_cost/allocation_edge schema domains and all semantic predicates. Enforce
    every component/phase/scope/plane/arm/owner relation,exact axes including kernel/class,repetition1..100,reason
    enums,observed/null pairs,capture identities and clock ordering. Retain invalid input observations with
    typed errors; no KeyError interface or missing-field defaults.
  - CSV reader/writer uses the frozen record_type,record_json header and canonical JSON record grammar. Decode
    and validate each record_json,require first-column equality,closed fields and the prescribed ordering.
    A generic CSV-string reader alone is insufficient.
  - Validate all logical and physical uniqueness keys without coercion,including scope-specific interval/kernel/class/owner
    axes and capture stream. Derived rollups name existing distinct exclusive leaves and have no edges; inclusive
    timers are never double charged. Validate resource availability without fabricated zero or arbitrary reason
    strings. Actual campaign totals count each observed exclusive leaf once and distinguish unavailable/partial
    completeness; RSS is not additive allocation.
  - Freeze exact callable and context schemas in integration-contract.json before the first test suite. Context
    maps actual supplied candidate ordinals/prefixes,canonical fixtures and two named two-label classes per
    fixture; it does not flatten classes or infer mathematical truth from labels. Map the retained timing/block/repetition
    facts needed for normalization and resolution checks explicitly to the frozen contract. Missing required
    context remains unresolved with retained actual-only data. Context is supplied data,not certificate or
    authorization verification.
  - Construct and validate the complete expected edge set from raw rows plus validated context. Enforce every
    edge_existence_rule,eligible target set,reason relation,canonical target order,integer remainder,closed
    scenario/view/target domain and duplicate group/key refusal. Global library initialization has72candidate7
    targets,then9derived strata; it is not split into9independent scenarios. Check missing/extra groups even
    when every supplied group sums to1. Propagate exact null/reason pairs using their real field names. Actual-only
    edges are unique1/1copies; rollups have none.
  - Connect selection and endpoint totals to retained allocations and timing facts. Normalize repeated leaves
    after integer allocation; preserve actual repetition counts and resolution status,all6candidates and8canonical
    endpoints per each of9strata,exact U_integer+Med7(B/n),lowest-arm ties and pre-confirmation winner reuse.
    Scalar cold totals retain all actual selection expenditure separately from the normalized selection score.
    No favorable defaults,alternative endpoint aliases,mean-of-ratios or second division by q.
  - Require exact complete output identities:288fixture/class/coordinate/seed/q cell tuples,8global alternatives
    and36q_star entries. Governing36cells each carry seven uniquely labelled joint omissions0..6; other cells
    have no LOO. Validate all seven original blocks before omission,hold winners/setup fixed,use exact Med6
    and Med7,exact1 and6/5 thresholds,and all earlier ladder cells for q_star. Reject noncanonical fractions,negative
    costs,boolean integer aliases,unknown/duplicate/missing keys,invalid or below-resolution blocks. Global
    summaries never replace cell gates.
  - Implement cost-projection checks for the frozen manifest relations without manufacturing full-manifest
    facts. Hard-validity aggregation only evaluates explicitly supplied prerequisites; it does not authenticate
    them. The component never sets whole-run authorization,certificate,resource/custody or source validity
    from constants or from the same untrusted object it is meant to verify. Full trusted launcher/receiver/arithmetic
    integration remains a named successor after independent review.
  - Use bounded-memory iteration or an explicit owned temporary indexing strategy for the fixed full protocol;
    do not require materializing the entire scientific workload as a precondition for processing. Expose cancellation/checkpoint
    boundaries through the component without allowing callbacks to replace required algorithms or validity
    checks. Do not invent new scientific exclusion thresholds or tighter data predicates absent an additive
    amendment.
  - No curve/map/fixture generation,calibration,discrete logarithm,key/signature/private material,RUN allocation
    or directory,launch lock/nonce consumption,Docker,cgroup,mount,privilege,pressure or scientific execution.
    All tests use explicitly artificial serialized cost/context/timing records. Synthetic canonical-shaped
    identifiers are test data only,never actual allocations or authority. Ordinary owned temporary file/index
    fixtures are allowed; no fixture child processes.
  - Before the first suite freeze coverage.json with every distinct named case,exact synthetic construction,expected
    predicate and contract pointer or retained function source plus bound defaults. Cover every crosswalk component
    and edge-rule family positively and negatively,strict JSON/CSV and numeric domains,null pairs,all ownership/scope
    variants,complete and partial candidate prefixes,all three possible two-pair class partitions,nondivisible
    integer splits,72target reconciliation,missing/extra edge groups,selection normalization reversals/ties/invalids,288/8/36identity
    coverage,LOO label permutations and invalid-label substitutions,all threshold/invalid/inconclusive/q_star
    branches. Explicitly map all26predecessor controls to preserved or corrected predicates; preserve historical
    failures rather than changing old artifacts.
  - At most1536fixed control executions in this successor including all failures/reruns,each complete suite<=512,reserve
    one complete final suite. Parameterized controls count separately; data rows processed inside one named
    algorithmic test are not fabricated independent replications. Up to10seconds/case and1800aggregate executed-check
    wall/CPU are process watchdogs,not campaign spending caps. One checker worker,2GiB sampled aggregate RSS,nominal<=100ms
    cadence; no RLIMIT_AS or kernel hard-limit claim. No fixture children; the checker process and parent observer
    are distinct from experimental runs.
  - Every checker,registry,compile or diagnostic invocation uses an exclusive pre-reserved temporary attempt
    directory,exact source copies,argv/cwd,raw log destinations and immediate checker PID/terminal custody.
    Use require_escalated for scoped owned-process monitoring/checker invocations. Persist each case start/result
    before advancing and raw output/launch exceptions before parsing; terminate/reap only the owned checker/group
    when necessary and preserve primary plus cleanup failures. No direct unrecorded diagnostics or post-receipt
    hidden tests. Canonical check-receipt.json is created once after all intended attempts terminate and retains
    all source versions,commands,outer tool responses/session/polls,case rows,raw samples,CPU/wall and every
    failure.
  - The predecessor remains failed:104retained suite rows with87passes17failures and a reported additional
    reducer diagnostic; four compile invocations and two JSON checks have incomplete original custody. Those
    historical counts are not reset or retrovalidated by this new envelope. Distinguish actual completed controls,started/interrupted
    controls and conservative reserved charges if a failure prevents exact counts.
  - Root uses coordinator-orchestration-code in the authenticated native session. No fallback,degradation,Bedrock
    or serving probe; unknown resolved model stays null/unverified. Return exact nine hashes and a requirement-by-requirement
    source/coverage map. Passing synthetic checks does not establish complete implementation acceptance; Coordinator
    snapshot,fresh independent component review and complete real runner integration precede any measurement
    admission.
  - Pinned runtime/public-trust files are metadata inputs for exact manifest binding comparisons only. Do not
    execute the calibration runtime or signing/verification binaries, read private material, or confuse the
    Python checker environment with the future approved calibration environment.
