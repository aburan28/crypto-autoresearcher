  completion_gate:
    - The commit exists, is reachable from HEAD, has the expected parent, and changes exactly the five declared paths.
    - Each declared path's sha256 in the receipt matches the committed tree.
    - The commit message names TASK-20260915-60dc73 and the five record IDs.
    - tools/validate_ledger.py reports no new error on the merged tree.
    - The branch is pushed and a PR against main names the five records.
    - ledger/goals/GOAL-ICPERF-e6b6a4/goal.yaml is unmodified by this commit.
  return_format: >-
    A receipt JSON under the declared archive path plus the PR URL, reported back
    to the Coordinator. Nothing in the receipt asserts a research conclusion.
  review_plan: null
  review_plan_note: >-
    An archival task opens no review round; there is no claim to assign. The
