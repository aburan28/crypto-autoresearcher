handoff:
  id: TASK-20260915-60dc73
  from: coordinator
  to: coordinator
  goal_id: GOAL-ICPERF-e6b6a4
  kind: snapshot_archive
  objective: >-
    Snapshot-archive, in one isolated commit that stages ONLY the declared paths,
    the design records produced by DEC-20260915-674299 -- hypothesis
    H-ICPERF-5f038b, experiment contract EXP-ICPERF-025a52 v1, the decision itself,
    and the two task cards -- and publish them on a branch with an open PR against
    main, so that the approval gate and the novelty screen rest on committed,
    pushed records rather than on a working tree.
  uncertainty_reduced: >-
    Whether these design records are durable program state. Until this commit is
    made, pushed, and accepted by the post-commit verifier they are unpublished and
    no downstream task may treat them as binding.
  inputs:
    - the five artifact paths below, as written on branch claude/index-calculus-graph-dag-3linyk
    - AGENTS.md "Durable research commits"; agents/coordinator.md "Branch and PR discipline"
  constraints:
    - >-
      This is an ARCHIVAL TASK AND NOTHING ELSE. It runs alone, stages only the
      declared paths, and must not touch ledger/goals/GOAL-ICPERF-e6b6a4/goal.yaml,
      coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-51e2aa/**, any experiment
      run directory, or any record it does not list.
    - >-
      BATCH-51e2aa is held by another session (claims exist for
      TASK-20260913-6c5729 and TASK-20260915-5ba08b). Do not edit its dispatch
      queue, do not open or close a lane on it, and do not alter the goal head's
      next_action, which belongs to that lane.
    - >-
      Merge origin/main into the branch before committing -- merge, never rebase --
      and record the base commit checked and the merge outcome in the receipt. A
      conflict inside an immutable record stops the task; it is resolved by a new
      superseding record, never by editing one side.
    - >-
      Re-run `python3 tools/validate_ledger.py` and branch-scoped
      `tools/check_merge_hygiene.py` on the merged tree before the commit; a
      validation error in any declared path blocks the archive.
    - >-
      Do not squash. The receipt binds a commit sha and a content hash per path;
      a squash merge makes every recorded sha unreachable.
    - No status transition is performed by this task. It commits records; it decides nothing.
  deliverables:
    - one commit whose message names TASK-20260915-60dc73 and the five record IDs
    - a post-commit receipt recording the commit sha, its parent, the declared paths and their sha256
    - a pushed branch with an open or refreshed PR against main naming H-ICPERF-5f038b, EXP-ICPERF-025a52, DEC-20260915-674299, TASK-20260915-532164, TASK-20260915-60dc73
  artifact_paths:
    - ledger/hypotheses/H-ICPERF-5f038b.yaml
    - experiments/EXP-ICPERF-025a52/specification.yaml
    - ledger/decisions/DEC-20260915-674299.yaml
    - ledger/handoffs/TASK-20260915-532164.yaml
    - ledger/handoffs/TASK-20260915-60dc73.yaml
  write_scope:
    - ledger/hypotheses/H-ICPERF-5f038b.yaml
    - experiments/EXP-ICPERF-025a52/specification.yaml
    - ledger/decisions/DEC-20260915-674299.yaml
    - ledger/handoffs/TASK-20260915-532164.yaml
    - ledger/handoffs/TASK-20260915-60dc73.yaml
    - coordination/goals/GOAL-ICPERF-e6b6a4/archives/TASK-20260915-60dc73/
  read_scope: [ledger, experiments, coordination, docs, tools]
  archived_by: TASK-20260915-60dc73
  archived_by_note: >-
    Self-referential because this IS the archival task for those five records.
    Every one of them is assigned to exactly one archival task, and it is this one.
