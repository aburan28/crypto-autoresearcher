    - 'assignment-TASK-20260826-422106.yaml and assignment-TASK-20260826-a9d51e.yaml -- split from the sealed prior, quoting no producer-reported value for the re-admitted count or its denominator.'
    - 'coordinator-prior-part-2-addendum.yaml -- a NEW write-once file at the sealed path, extending part 1 rather than editing it, written after the package exists and before either reviewer is dispatched. NOT AN artifact_path (BR-16).'
    - 'digests.json at the sealed path -- a sha256 for part 1 and for the part-2 addendum, DECLARED and bound.'
    - 'A pushed branch and this lane''s PR, naming BATCH-171407, EXP-DIFFP-f26790, GOAL-DIFFP-84d641, DEC-20260826-5aaddc and every TASK-20260826-* record of this batch, with no findings in the body while the round is open.'
