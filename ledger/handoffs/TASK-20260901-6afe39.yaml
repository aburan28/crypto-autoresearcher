handoff:
  id: TASK-20260901-6afe39
  from: coordinator
  to: idea-generator
  objective: 'Author a SUPERSEDING v2 of the C2 paired heuristic-validation design, fixing exactly the
    two load-bearing defects RT-20260901-1af5d9 objections 5 and 6 established. The v1 file (BATCH-286bcd
    TASK-20260901-354ef5/c2-paired-validation-design.yaml) is IMMUTABLE and must not be edited; v2 is
    a new file that supersedes it and names, verbatim, each v1 block it replaces.


    DEFECT 1 — SEED_POLICY CONTRADICTS ARM-NULL''s OWN CLAIM. v1''s seed_policy defines SEED(key_size,
    arm, tier) as ARM-INDEXED, "used ONLY for that (key_size, arm, tier) combination''s KEY draws; no
    seed is shared or reused across combinations". That means ARM-REAL (arm_idx=0) and ARM-NULL (arm_idx=1)
    draw K, K'' from DIFFERENT INDEPENDENT streams, so their (K,K'') values almost certainly differ. But
    the arms.ARM-NULL block asserts state_0 is "BYTE-IDENTICAL, sample for sample, to state_0 in ARM-REAL
    for the same (K,K'') pair." As literally specified those two cannot both hold, and the design''s central
    confound-control logic — holding the one nuisance variable constant across arms so a difference is
    attributable to the round-key CORRELATION STRUCTURE under test rather than to a different starting
    point — is false as written. An executor following seed_policy exactly would not be running the design
    the prose describes. RESOLVE IT — do not merely flag it. The red team''s suggested shape, offered
    as a starting point and not a conclusion: draw K and K'' from a SINGLE arm-independent stream per
    (key_size, tier, sample index), and reserve a SEPARATE arm-specific stream only for the additional
    2*R round-key draws ARM-NULL alone needs. Verify that whatever you adopt actually delivers byte-identical
    state_0 across arms, and state how an executor would CHECK that at run time.


    DEFECT 2 — THE DECAY CHECK DOES NOT CATCH A FLAT EXCESS. invalidation_rules item 1, labelled this
    design''s central invalidation rule, is worded "TVD_{r+1}(arm) must not exceed TVD_r(arm) + tau(N)"
    — a round-to-round JUMP/re-emergence detector, not a did-this-series-ever-decay detector. A FLAT,
    persistently-elevated, never-increasing TVD series passes it cleanly. item 4 is clearly intended to
    route an ARM-NULL failure to "instrument flag", but its trigger text points back at item 1''s narrow
    jump test, so a flat ARM-NULL excess trips nothing. Meanwhile falsification_criterion''s three enumerated
    outcomes do not explicitly cover "ARM-NULL alone fails to converge while ARM-REAL converges normally"
    — the mirror image of outcome (ii), distinct from outcome (iii)''s "both persist together". EXTEND
    the rule so that case routes to one of the three named falsification outcomes (or to a fourth you
    name explicitly), and make item 4 trigger on ANY failure of ARM-NULL to reach and remain at-or-below
    tau(N) by the convergence window falsification_criterion already applies to ARM-REAL.'
  uncertainty_reduced: Whether C2's paired design can be stated so that its confound control is real rather
    than asserted, and so that a null-control failure cannot pass undetected. Until both hold the design
    is not approvable for dispatch.
  inputs:
  - AGENTS.md
  - CLAUDE.md
  - docs/inventor-protocol.md
  - docs/claims-and-verification.md
  - templates/research-records.md
  - ledger/goals/GOAL-AES-002.yaml
  - ledger/questions/RQ-AES-002.yaml
  - ledger/decisions/DEC-20260901-1fc2f5.yaml
  - coordination/goals/GOAL-AES-002/batches/BATCH-241d37
  - coordination/goals/GOAL-AES-002/batches/BATCH-286bcd/tasks/TASK-20260901-354ef5/c2-paired-validation-design.yaml
  - coordination/goals/GOAL-AES-002/batches/BATCH-286bcd/tasks/TASK-20260901-354ef5/design-report.md
  - coordination/goals/GOAL-AES-002/batches/BATCH-286bcd/reviews/TASK-20260901-1af5d9/red-team-report.yaml
  constraints:
  - SC-1 through SC-11, identical language.
  - SC-1 the C2 stamp duty with a computed binding_stop_utc and the stamps committed as a declared artifact
  - SC-2 the C4 authoring-inclusive declaration basis with compute reported separately
  - SC-3 the covering-manifest clause and the closed case-insensitive class vocabulary
  - 'SC-4 the R5 anti-laundering clause quoted verbatim from RQ-AES-002, as a completion gate on every
    deliverable; where a margin is stated, dominated_by carries EXACTLY "unresolvable in this environment:
    no primary source reachable; every recalled frontier row is unverified-from-memory" and is never null'
  - SC-5 no card may cite a recalled literature figure as authority, in either direction
  - SC-6 no card may ask for a comparison against the published state of the art
  - SC-7 every deliverable stating a margin carries the R5 clause in the same sentence
  - SC-8 no reduced-round finding produced under this goal may be asserted here
  - SC-9 anything not attempted is named OPEN AND UNATTEMPTED and is never recorded as tried, screened
    or negative
  - SC-10 fabricate nothing; an unknowable field stays null
  - SC-11 never select, configure, probe, contact or use Amazon Bedrock
  - ZERO COMPUTE IN THIS TASK. No benchmark, no sample draw, no run of any kind. This is a design-and-preregistration
    act only.
  - v1 is IMMUTABLE. Do not edit it. v2 supersedes it and quotes verbatim each v1 block it replaces.
  - Follow templates/research-records.md's `experiment` schema fields exactly. Do not invent fields.
  - PARSE YOUR OWN YAML BEFORE RETURNING. v1 was returned with a block-sequence indentation defect that
    made it unparseable and the dispatching session had to repair it. Run `python3 -c "import yaml;yaml.safe_load(open(PATH))"`
    on your deliverable and record that you did.
  - 'Carry forward v1''s not_yet_approved_not_yet_executed block: approved/dispatched/executed/compute_run
    all false. Do NOT approve or dispatch; do not mint an EXP-* or H-* identifier. Only the Coordinator
    approves experiments.'
  - Preserve v1's below-default-confidence disclosure on the preregistered prediction and its citation-by-path
    of the measured envelope figure; do not re-measure and do not restate a throughput number you did
    not read from that path.
  - Fix EXACTLY the two named defects. Anything else you notice is REPORTED in the revision report and
    named OPEN AND UNATTEMPTED per SC-9, not silently changed.
  - State plainly, per SC-4, that no margin is claimed anywhere in this design and nothing about AES at
    any round count is asserted.
  deliverables:
  - c2-paired-validation-design-v2.yaml — the superseding design.
  - c2-v2-revision-report.md — the verbatim v1 text replaced per defect, why the replacement resolves
    it, the run-time check for byte-identical state_0, and anything noticed but left unattempted.
  artifact_paths:
