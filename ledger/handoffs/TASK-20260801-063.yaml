handoff:
  id: TASK-20260801-063
  from: coordinator
  to: executor
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-026
  experiment_id: EXP-LPF-001
  hypothesis_id: H-LPF-001
  run_id: RUN-LPF-001-plantz
  discipline: PERTURB-TAIL-1
  objective: >-
    Produce the machine-readable arrays that RR-LPF-2's restated D1 and V8 will rest on, so
    that no sentence of the superseding reading rule rests on an unarchived number.
    Regenerate every PLANTED value at every rung of both ladders at both cells from the
    frozen driver's own construction functions on the frozen driver's own streams, compute
    their Z, and archive the distribution, the per-replicate exceedance counts against each
    replicate's own null tenth-largest Z, and the eviction and insertion accounting.
  uncertainty_reduced: >-
    Whether the smooth family's planted-Z upper tail actually reaches the null deep tail
    and how often - the empirical question D1 asserted an impossibility about, whose
    per-sample arrays are absent from the calibration package and therefore uncheckable
    against the archive as it stands.
  inputs:
  - experiments/EXP-LPF-001/specification.yaml
  - experiments/EXP-LPF-001/implementation/lpf001_driver.py
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-calib/manifest.yaml
  - experiments/EXP-LPF-001/results/calib/null_replicate_statistics.json
  - experiments/EXP-LPF-001/results/calib/perturbation_movement_report.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/reviews/TASK-20260801-054/attainability_check.md
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/reviews/TASK-20260801-054/perturbation_movement_check.md
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-026/archives/TASK-20260801-062/snapshot_commit_receipt.json
  constraints:
  - 'PROCEED ONLY IF PLANT_TAIL_REGENERATION_AUTHORIZATION IS AUTHORIZED in the TASK-20260801-062 receipt. Otherwise stop and report.'
  - >-
    DO NOT MODIFY lpf001_driver.py. Write a SEPARATE auxiliary script
    experiments/EXP-LPF-001/implementation/plant_z_regen.py that IMPORTS it. The script
    must ASSERT sha256(lpf001_driver.py) ==
    786aeb0550d75fa3d0785aefbe50b121a24cacae584a4cadd79902c464722d65 before doing anything
    and refuse otherwise.
  - >-
    DO NOT MODIFY experiments/EXP-LPF-001/specification.yaml,
    experiments/EXP-LPF-001/reading_rule.yaml, the RUN-LPF-001-calib package, or any
    BATCH-025 review file. None is in your write scope.
  - >-
    STRUCTURAL BLINDNESS IS MANDATORY AND IS NOT A PROMISE. Call ONLY
    build_smooth_replacement, build_rough_replacement, the Stream and draw_seed machinery,
    draw_uniform for the plant BASES, apply_plant and all_statistics. NEVER call
    deterministic_factor_base, int1_fibre_invariants, upper_triangle_indices over the
    factor base, run_measurement or _independent_pmax_recheck. ASSERT the module tripwire
    _REAL_OBJECT_TOUCHED is False at exit and RECORD it false in raw-result.json.
  - >-
    NO FACTORIZATION IS REQUIRED OR PERMITTED for the planted values - their factorizations
    are known by construction. Do not call the Factorizer on plants.
  - >-
    USE THE ARCHIVED STREAM INDEXING EXACTLY - the calib_plant_smooth and calib_plant_rough
    streams at index g_i*1000 + k with bases the uniform replicates k = 0..19, exactly as
    run_calibration does. ANCHOR THE REGENERATION - reproduce and report the archived null
    values on replicate 0 at both cells, T_deep 6.060618052804848 at bits 16 and
    5.762382565494627 at bits 20 and STAT-KS-DICK 0.04919123043052837 and
    0.038236912915851275. IF THE ANCHOR DOES NOT REPRODUCE BIT-FOR-BIT, STOP AND REPORT.
  - >-
    ARCHIVE AS MACHINE-READABLE ARRAYS, PER (family, cell, rung) - the count of planted
    values; summary statistics of their Z (mean, sd, min, max, and the 99, 99.9 and 99.99
    percentiles); the FULL SORTED TOP-K planted Z values with K at least 100 so a future
    reader can recompute any upper-tail statistic without re-running; the per-replicate
    maximum planted Z; the per-replicate count of plants exceeding THAT REPLICATE'S OWN
    null tenth-largest Z; and the eviction and insertion accounting from which an
    eviction-to-insertion ratio is computable. DO NOT COMPUTE OR REPORT A RATIO AS A
    HEADLINE - report the counts and let the reading rule derive it.
  - >-
    ALSO ARCHIVE THE STRIKE-2 COUNTERPART - the per-(cell, rung) count of planted smooth
    values that are Bsm(u=6)-smooth, i.e. 40-smooth at bits 16 and 102-smooth at bits 20,
    so STRIKE-2's independently strengthened basis is archived rather than quoted.
  - >-
    REPORT OBSERVATIONS ONLY. Do not adjudicate D1, do not restate V8, do not write or edit
    any reading rule, do not select a branch and do not state a disposition.
  - >-
    Emit a complete run package - manifest.yaml with the five required companions
    command.txt, environment.json, stdout.log, stderr.log and raw-result.json, plus
    git_status_prerun.txt. Record the exact command, the git commit and dirty-tree state,
    the environment and dependency versions, the seeds, the requested policy and resolved
    model, timings and peak RSS.
  - >-
    BUDGET IS 900 SECONDS AND THE RUN NEEDS SECONDS. If it exceeds the budget that is a
    BUDGET EVENT reported as one, never a result.
  - 'MAKE NO COMMIT; TASK-20260801-064 archives.'
  - Every YAML and JSON file written must parse.
  deliverables:
  - experiments/EXP-LPF-001/implementation/plant_z_regen.py
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-plantz/manifest.yaml
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-plantz/raw-result.json
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-plantz/command.txt
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-plantz/environment.json
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-plantz/stdout.log
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-plantz/stderr.log
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-plantz/git_status_prerun.txt
  - experiments/EXP-LPF-001/results/plantz/plant_z_tail_report.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-026/tasks/TASK-20260801-063/execution_report.yaml
  artifact_paths:
  - experiments/EXP-LPF-001/implementation/plant_z_regen.py
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-plantz/manifest.yaml
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-plantz/raw-result.json
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-plantz/command.txt
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-plantz/environment.json
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-plantz/stdout.log
