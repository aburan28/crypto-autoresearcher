handoff:
  id: TASK-20260801-005
  from: coordinator
  to: executor
  objective: >-
    Execute RUN-DS-001-ctrl-matched-null. Run naive_search and split_search
    UNCHANGED - same code, smoothness_abort=false, same charge_backend_units,
    same frozen wall-derived cost identity, 200 relations, seed 101 - against the
    additive group Z/753848Z with a 128-element negation-closed random signed
    factor base and 200 uniform random targets. Also run the same-host real-arm
    re-measure arms and carry the legacy null arms for disclosure. Report
    R_matched_null, R_real_remeasure and R_null_legacy under BOTH the wall proxy
    AND the charged-unit proxy with neither privileged, plus per-arm n_enum, peak
    claw-table entries and peak RSS. Interpret nothing and classify nothing
    against the disposition map.
  uncertainty_reduced: >-
    Whether the split arm's measured advantage transfers to a group with no
    elliptic-curve or Semaev structure at all, which decides whether the BATCH-020
    win is generic meet-in-the-middle or structure-dependent.
  inputs:
  - experiments/EXP-DS-001/controls/CTRL-RT047-MATCHED-NULL.yaml
  - experiments/EXP-DS-001/amendments/v2_ctrl_matched_null.yaml
  - experiments/EXP-DS-001/specification.v2.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-021/archives/TASK-20260801-004/snapshot_commit_receipt.json
  - experiments/EXP-DS-001/implementation/ds001_driver.py
  - experiments/EXP-DS-001/implementation/ds001_ctrl_unplanted.py
  - experiments/EXP-DS-001/runs/RUN-DS-001-ctrl-unplanted/raw-result.json
  constraints:
  - >-
    run_authorized ONLY if TASK-20260801-004 records APPROVAL_DETERMINATION
    APPROVED; otherwise cancel with no run and say so.
  - >-
    Bind to specification.v2.yaml constraints as narrowed by
    CTRL-RT047-MATCHED-NULL.yaml. Do NOT execute v1.
  - >-
    ALGORITHM INVARIANCE - naive_search and split_search run unchanged; the only
    permitted difference is the object. If that cannot be achieved without
    touching the search logic, declare the exact diff as a protocol deviation.
  - >-
    Do NOT modify ds001_driver.py or ds001_ctrl_unplanted.py; record
    shared_backend_module_modified false. Append to implementation.md; never
    rewrite it.
  - Do not edit specification files, controls, amendments, or any BATCH-020 artifact.
  - >-
    Group is Z/753848Z under addition; the order must equal the BATCH-020 curve
    group order exactly.
  - >-
    Factor base is 128 signed elements, negation-closed, from 64 uniformly random
    unsigned residues under the declared rejection rules; record
    factor_base_sha256, the draw order and the rejection counts by class.
  - >-
    200 uniform random targets; planted m-sums forbidden as the yield source;
    record target_stream_sha256, attempted_targets and success_count.
  - smoothness_abort=false; relations_target=200 or an honest resource stop.
  - >-
    PER_TARGET_CAP_SECONDS is 5.0 and MUST appear in manifest.json,
    raw-result.json and summary.json with per_arm_capped_attempt_count for every
    arm.
  - >-
    NO LIVE PLANT. plant_divisor must be 1.0 on every arm; record plant_applied
    false and synthetic_known_answer_used false.
  - >-
    Every ratio reported as an ordered pair of wall proxy and charged-unit proxy,
    neither privileged; state verbatim that charged units never enter the frozen
    cost identity.
  - >-
    Every claimed relation carries a certificate re-verified by an independent
    verifier path; report verified/total per arm.
  - >-
    Timeouts, crashes and resource exhaustion are infrastructure signal, never
    mathematical negatives.
  - >-
    Do NOT classify the result against the disposition map and do not state a
    disposition; that is TASK-20260801-009's exclusive job.
  - Do not alter H-DS-001, H-IC-001 or H-STR-002.
  - MAKE NO COMMIT; TASK-20260801-006 archives.
  - Record inference fallback honestly (requested executor-implementation).
  - No new dependencies and no new mathematics.
  deliverables:
  - experiments/EXP-DS-001/runs/RUN-DS-001-ctrl-matched-null/manifest.json
  - experiments/EXP-DS-001/runs/RUN-DS-001-ctrl-matched-null/raw-result.json
  - experiments/EXP-DS-001/runs/RUN-DS-001-ctrl-matched-null/stdout.txt
  - experiments/EXP-DS-001/runs/RUN-DS-001-ctrl-matched-null/stderr.txt
  - experiments/EXP-DS-001/runs/RUN-DS-001-ctrl-matched-null/command.txt
  - experiments/EXP-DS-001/runs/RUN-DS-001-ctrl-matched-null/environment.json
  - experiments/EXP-DS-001/results/ctrl_matched_null/summary.json
  - experiments/EXP-DS-001/results/ctrl_matched_null/R_cell.json
  - experiments/EXP-DS-001/results/ctrl_matched_null/matched_null_report.json
  - experiments/EXP-DS-001/results/ctrl_matched_null/proxy_sensitivity_report.json
  - experiments/EXP-DS-001/implementation/ds001_ctrl_matched_null.py
  - experiments/EXP-DS-001/implementation/implementation.md
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-021/tasks/TASK-20260801-005/execution_report.yaml
  artifact_paths:
  - experiments/EXP-DS-001/runs/RUN-DS-001-ctrl-matched-null/manifest.json
  - experiments/EXP-DS-001/runs/RUN-DS-001-ctrl-matched-null/raw-result.json
  - experiments/EXP-DS-001/runs/RUN-DS-001-ctrl-matched-null/stdout.txt
  - experiments/EXP-DS-001/runs/RUN-DS-001-ctrl-matched-null/stderr.txt
  - experiments/EXP-DS-001/runs/RUN-DS-001-ctrl-matched-null/command.txt
  - experiments/EXP-DS-001/runs/RUN-DS-001-ctrl-matched-null/environment.json
  - experiments/EXP-DS-001/results/ctrl_matched_null/summary.json
  - experiments/EXP-DS-001/results/ctrl_matched_null/R_cell.json
  - experiments/EXP-DS-001/results/ctrl_matched_null/matched_null_report.json
  - experiments/EXP-DS-001/results/ctrl_matched_null/proxy_sensitivity_report.json
  - experiments/EXP-DS-001/implementation/ds001_ctrl_matched_null.py
  - experiments/EXP-DS-001/implementation/implementation.md
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-021/tasks/TASK-20260801-005/execution_report.yaml
  artifact_paths_note: >-
    The new driver ds001_ctrl_matched_null.py and the appended implementation.md
    are declared HERE AND NOW rather than by later amendment, because
    tools/research_dispatch.py derives TASK-20260801-006's expected commit scope
    as the union of that archive task's artifact_paths with this task's. This is
    the direct application of the BATCH-020 lesson recorded in
    QUEUE-AMEND-20260801-002 / DEC-20260801-002.
  archived_by: TASK-20260801-006
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 1800
    memory_gb: 8
    maximum_runs: 1
  completion_gate:
  - >-
    Declared deliverables written within write_scope; APPROVED gate respected;
    both cost proxies reported for every ratio; PER_TARGET_CAP_SECONDS and
    per-arm capped-attempt counts present; certificates re-verified; no fabricated
    metrics; no disposition stated.
