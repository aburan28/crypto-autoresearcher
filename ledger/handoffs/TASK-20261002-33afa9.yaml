      The diffs of factor_base.py and __main__.py against 38be58dad are
      recorded in the receipt by sha256 of the diff text (not judged here;
      judging the code is the review's job). Any __pycache__ directory found
      is recorded as a scope_finding, is not staged and is not deleted.
      (c) CHECKSUMS. Every attempt, run root and run directory that holds a
      manifest.yaml has a checksums.sha256 that matches every file beneath
      it.
      (d) STATE BY STOP POINT, as recorded in
      experiments/EXP-PFDR-0b3699/execution-report.yaml. In every branch the
      specification is unchanged (a).
      - S0 STOPPED IN ORDER STEP (a) (authority, interpreter, build base):
        implementation-notes.yaml and execution-report.yaml may or may not
        exist; no EC-A1 change, no script and no runs/ directory exist.
      - S1 STOPPED IN ORDER STEP (b) OR (c) (EC-A1, scripts, fixtures, pins):
        no runs/ directory exists; pins.scripts is absent unless the fixture
        exercise passed.
      - S2 STOPPED AT RA-01: pins.scripts present with pinned_at earlier than
        RA-01's earliest started_at, and its sha256 values equal the files;
        RUN-PFDR-0b3699-tests/ exists; no later run directory exists.
      - S3 STOPPED AT RA-02 (G-REPRO): as S2 with RA-01 completed_valid;
        RUN-PFDR-0b3699-repro/ exists; RUN-PFDR-0b3699-repro-attribution/
        exists iff the report records a G-REPRO failure; no -p0-design/
        directory exists.
      - S4 STOPPED AT RA-03 (P0X-A, G-FRESH or a design stop): as S3 with
        RA-02 completed_valid and no -repro-attribution/;
        RUN-PFDR-0b3699-p0-design/ exists; pins.design_json is absent or
        equals the sha256 of its design.json; no -table/ directory exists.
      - S5 STOPPED AT RA-04 (census, merge or checks): pins.design_json
        equals the sha256 of RA-03's design.json with a pinned_at earlier
        than the earliest RA-04 started_at; RUN-PFDR-0b3699-table/ exists
        with attempt directories; the run-root files exist iff the merge ran;
        no -calibrate/ directory exists.
      - S6 STOPPED AT RA-05: the RA-04 root finalized completed_valid or
        failed_infrastructure (never invalid) with row-verify.json and
        checks-report.json present; RUN-PFDR-0b3699-calibrate/ exists;
        pins.calibration_json is absent (stop before the pin, recorded) or
        equals the sha256 of calibration.json; no -analysis/ directory
        exists.
      - S7 COMPLETE (RA-06 finalized) or STOPPED AT RA-06:
        pins.calibration_json equals the sha256 of
        RUN-PFDR-0b3699-calibrate/calibration.json with a pinned_at earlier
        than RA-06's started_at; RA-06's command.txt carries that sha256;
        RUN-PFDR-0b3699-analysis/ exists; its manifest is present unless the
        report records a stop before finalize.
      Any state not listed above is a STOP. Record which branch applied.
      (e) MANIFEST BLOCKS. Every new manifest.yaml has run.task_id (or the
      equivalent field) TASK-20261002-8a6b8a, experiment id EXP-PFDR-0b3699,
