    - >-
      FAIL-FAST AND RECEIPT IN THE SAME COMMIT. Every command block runs with
      set -euo pipefail, or with an explicit exit check after every command.
      The receipt's path list is computed from this card's artifact_paths
      that exist, BEFORE staging, never from git status. The receipt is
      written self-neutral, parsed and staged before the commit, and
      committed in the same commit as the package. If any step after staging
      fails, nothing is committed: stop and report, and leave the staged
      index as is for the next session to inspect. Check scripts write only to
      absolute paths in the session scratch directory; git status is
      re-checked immediately before staging.
    - >-
      PRE-STAGING CHECKS, WITHOUT EDITING.
      (a) CUSTODY. Every path of the TASK-20261002-4b35db receipt still has
      its path_sha256 (in particular experiments/EXP-PFDR-0b3699/specification.yaml
      is unchanged); every path of the TASK-20261002-a3cee2,
