handoff:
  id: TASK-20260905-a6ea8a
  from: coordinator
  to: idea-generator
  objective: >-
    Generate five or six distinct, schema-complete, falsifiable proposals for
    RQ-ECDLP-623a32: genuinely new representations of points on a prime-field elliptic
    curve, outside the degree-2 Kummer-line paradigm the model lane already closed at
    lever 1, each with a lossy-projection audit, a named non-generic operation the
    representation makes cheaper, and a cheapest discriminating test.
  uncertainty_reduced: >-
    Whether any point representation outside the coordinate-function paradigm changes a
    charged stage cost of prime-field ECDLP attacks, or whether every candidate reduces to a
    reparametrisation under the PGL_2 null battery.
  inputs:
  - AGENTS.md
  - agents/idea-generator.md
  - docs/inventor-protocol.md
  - docs/target-result-profile.md
  - templates/research-records.md
  - ledger/questions/RQ-ECDLP-623a32.yaml
  - ledger/questions/RQ-ECDLP-002.yaml
  - ledger/questions/RQ-CRYPTO-001.yaml
  - ledger/questions/RQ-MODEL-e61cb2.yaml
  - ledger/proposals/IDEA-20260807-8027a2.yaml
  - ledger/proposals/IDEA-20260807-e6d79e.yaml
  - ledger/proposals/IDEA-20260807-dadcd2.yaml
  - ledger/proposals/IDEA-20260807-5f5ace.yaml
  - ledger/proposals/IDEA-20260807-4fc635.yaml
  - ledger/proposals/IDEA-20260808-2e14f7.yaml
  - ledger/proposals/IDEA-20260806-0c9de1.yaml
  - ledger/proposals/IDEA-20260808-fa1d80.yaml
  - ledger/proposals/IDEA-20260802-002.yaml
  - ledger/proposals/IDEA-20260806-071255.yaml
  - ledger/proposals/IDEA-20260807-4cebed.yaml
  - ledger/proposals/IDEA-20260811-fe0934.yaml
  - ledger/proposals/IDEA-20260905-0cc259.yaml
  - ledger/proposals/IDEA-20260902-701458.yaml
  - knowledge/open-problems/KN-OPEN-019.md
  - knowledge/open-problems/KN-OPEN-020.md
  - knowledge/findings/KN-FIND-a8990a.md
  - knowledge/findings/KN-FIND-c41ea9.md
  - knowledge/literature/KN-LIT-247.md
  - knowledge/literature/KN-LIT-1047.md
  - knowledge/literature/KN-LIT-828.md
  - knowledge/literature/KN-LIT-493.md
  - knowledge/literature/KN-LIT-1482.md
  - knowledge/literature/KN-LIT-025.md
  - knowledge/
  - ledger/proposals/
  - ledger/hypotheses/
  constraints:
  - Proposal-only task. No experiments, implementation, attack code, key-recovery
    procedure or third-party target operation; maximum_runs is 0. Every minimal_test is a
    design for a later approved contract.
  - Research at a conceptual and mathematical level only. Toy and symbolic scopes;
    lawful defensive cryptanalysis on public constructions.
  - Established families are OFF-LIMITS as the primary lens (docs/inventor-protocol.md
    section 1) and may appear only as nearest neighbours with a stated precise difference.
    Off-limits here means degree-2 coordinates on the same curve (Weierstrass x, Montgomery
    x, Edwards y, Hessian x+y, the Kummer line) closed at lever 1 by IDEA-20260807-8027a2,
    IDEA-20260807-e6d79e and IDEA-20260807-dadcd2; degree-d functions E -> P^1 in general
    (IDEA-20260808-2e14f7) unless a specific d, divisor class and new consequence is named;
    the X_1(N) torsor representation (IDEA-20260806-0c9de1); the split-quotient Igusa
    certificate (IDEA-20260808-fa1d80); canonical and p-adic lifts (the CANL and XEDN
    lanes); pairing transfer; isogeny-class transfer (ISO and ICINV lanes); the CM-trace
    factor base (IDEA-20260902-701458).
  - Enumerate candidate OBJECTS before ideas. Candidate classes the Coordinator asks you to
    consider, without quota and in addition to your own, are (1) level-n theta and Kohel
    normal-form embeddings E in P^(n-1) with biquadratic addition laws, factor bases cut by
    linear conditions in the embedding, and the un-eliminated quadric decomposition system;
    (2) elliptic-net and elliptic-divisibility-sequence valued representations (KN-LIT-247)
    read as a sequence object with two-dimensional recurrence structure; (3) cubical and
    biextension lifts over F_p and over the dual numbers F_p[eps], with the Schur-Zassenhaus
    splitting obstruction for gcd(n,p)=1 stated up front; (4) R1 field representations of
    x-coordinates in a quadratic order, F_p as O_K modulo a split prime, giving a
    two-dimensional notion of smallness for factor bases, with CM compatibility only as a
    labelled structured control; (5) higher-dimensional representations of the PAIR (P,Q)
    on E x E, its Kummer surface, or a (2,2)-glued genus-2 Jacobian (KN-LIT-1482,
    KN-LIT-493), framed as locating the graph of [k]; (6) Weil-restriction and
    F_(p^2)-twist decompositions; (7) translation frames and torsion-translate sets;
    (8) divisor-class and Miller-function representations; (9) distribution-valued objects
    such as the multiset of x(aP) over a structured index set with its dilation structure,
    with the generic-group ceiling stated; (10) anything genuinely new.
  - Every proposal runs the lossy-projection test of docs/inventor-protocol.md section 2
    INSIDE the record (what is discarded, whether the retained part propagates
    deterministically) and, where the object is a projection of the group, predicts the loss
    and branching meter values (L, b) of IDEA-20260802-002.
  - Every proposal names the non-generic operation the representation makes cheaper and the
    attack stage it changes (factor-base membership, decomposition, collision structure,
    linear algebra, descent), and fills target_complexity with exponents against Pollard rho
    at N^(1/2) and against the Petit-Kosters-Messeng and Semaev baselines, charging setup,
    transport, memory and verification.
  - 'Mandatory controls in every minimal_test: the PGL_2(F_p) random-reparametrisation
    battery and the translation-conjugate null of IDEA-20260807-4fc635, a matched random
    curve at the same p, and a known-false object on which the claimed effect must vanish.'
  - Novelty stays unverified unless a specific local record and an opened primary source
    support the exact distinction. No claim of global novelty from absent search results.
    search_knowledge is unavailable to this task; disclose that, use explicit local record
    searches (grep ledger/proposals, ledger/hypotheses, knowledge) and primary-source
    retrieval, and record every retrieval in sources.json.
  - Read mechanisms of nearest internal proposals, not only titles. Record at least one
    specific nearest internal record and the exact difference for each candidate.
  - Mark every citation with provenance recalled, retrieved, kb or internal; a recalled
    reference is a pointer and supports nothing. Name the verifying task for sources opened.
  - Proof-oriented records carry a complete proof_search_map (baseline embedding,
    observation collision, quantifier order, method ceiling with a nearby-object control,
    proof obligations). Conditional cost claims name numbered heuristics with validation routes.
  - dominated_by may be null only after every declared frontier row was checked; otherwise
    record the unresolved comparison. sota_delta is quantitative or an explicit unquantified
    boundary.
  - 'Required per-idea fields: id, title, class, claim, mechanism, question_id, question_ids,
    goal_ids, goal_applicability, status, proposed_by, recorded_at, task_id, batch_id,
    novelty_status, novelty_screen, citations, assumptions, predictions, minimal_test,
    falsification_conditions, confounders, interpretation_limits, heuristic_assumptions,
    target_complexity, estimated_cost, recommended_priority, proof_search_map, dominated_by,
    sota_delta, inference.'
  - 'Fixed values: question_id RQ-ECDLP-623a32; question_ids must include RQ-ECDLP-623a32,
    RQ-ECDLP-002 and RQ-CRYPTO-001 and may add RQ-MODEL-e61cb2 or RQ-RELN-001 where
    applicable; goal_ids must include GOAL-ECDLP-001 and GOAL-CRYPTO-001 and may add
    GOAL-ENDO-001, GOAL-RELN-001 or GOAL-ICEX-001 with a goal_applicability sentence each;
    status proposed; proposed_by idea-generator; recorded_at 2026-09-05; task_id
    TASK-20260905-a6ea8a; batch_id BATCH-23ec69; novelty_status unverified.'
  - 'Assigned identifiers, used in order and never re-minted: IDEA-20260905-d0fee4,
    IDEA-20260905-24b41a, IDEA-20260905-579fcc, IDEA-20260905-ab4a6e, IDEA-20260905-0e0982,
    IDEA-20260905-1af7ac, IDEA-20260905-2d77c3. Unused identifiers are left unused.'
  - Every idea stays status proposed and novelty_status unverified. No global novelty,
    asymptotic advance, verified mechanism or breakthrough is asserted.
  - 'Write ideas.yaml as a mapping with ideas: [one complete idea body per proposal, no
    wrapper key inside the list]. Do not write to ledger/ and do not commit. report.md
    records the objects enumerated, the honest-accounting block of
    docs/inventor-protocol.md section 5, the ranking rationale and the recommended first
    test. sources.json records every retrieval and every local record read.'
  - Do not read sibling producer outputs. Do not repair existing records.
