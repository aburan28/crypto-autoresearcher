      research_dispatch.py outcomes, and input_pins_TASK-20261023-4c12dc
      (LA-9).
    - One isolated commit, a pushed branch, an open or refreshed ready-for-review PR, and lane BATCH-7ca353 open.
  artifact_paths:
    - coordination/goals/GOAL-PATH-001/batches/BATCH-7ca353/archives/TASK-20261023-5c6d48/ledger-receipt.json
    - ledger/decisions/DEC-20261023-19c53b.yaml
  write_scope:
    - coordination/goals/GOAL-PATH-001/batches/BATCH-7ca353/archives/TASK-20261023-5c6d48
    - ledger/decisions/DEC-20261023-19c53b.yaml
