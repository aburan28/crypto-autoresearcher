    - One commit binds exactly the seven expected paths, and its receipt verifies under tools/research_dispatch.py.
    - validate_ledger.py and check_merge_hygiene.py show no new error attributable to a staged path.
    - The branch is pushed, a ready-for-review PR names every record id, and input_pins_TASK-20261023-4c12dc is recorded.
    - The release carries two non-empty artifact digests. Zero runs.
  return_format: >-
    The ledger receipt (commit_sha, parent_sha, path_sha256 map, OC-1 to OC-5
