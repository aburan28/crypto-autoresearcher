  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    reasoning_effort_note: null means the policy default (high). The shell-holding top-level session does the staging and hashing.
    fallback_allowed: true
    fallback_note: Runtime inheritance under the Claude Code harness. Backend or model substitution only. Never Bedrock.
    degraded_allowed: false
    independent_session_required: false
    delivery: interactive
  budget:
    wall_clock_seconds: 2700
    memory_gb: 1
    maximum_runs: 0
  dispatch_preconditions:
