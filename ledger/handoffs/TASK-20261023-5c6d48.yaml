# OPENING LEDGER ARCHIVE, GOAL-PATH-001, BATCH-7ca353. Stages the outputs of
# TASK-20261023-18665a (DEC-20261023-19c53b, the four handoffs and the
# additive goal-head update) in ONE isolated commit, ALONE, after checking
# DEC-20261023-19c53b conditions OC-1 to OC-5. Executed by the shell-holding
# top-level session in the coordinator role. Zero runs. The id was reserved by
# the top-level session.
handoff:
  id: TASK-20261023-5c6d48
  from: coordinator
  to: coordinator
  goal_id: GOAL-PATH-001
  batch_id: BATCH-7ca353
  authorized_by: DEC-20261023-19c53b conditions and NA-1
  objective: >-
    Commit and bind, in ONE isolated archive commit, exactly the seven
    expected paths: DEC-20261023-19c53b, the additive head update of
    ledger/goals/GOAL-PATH-001.yaml, the four BATCH-7ca353 handoffs and this
    card's receipt. First check OC-1 to OC-5 and record each in the receipt,
    together with the input pins of TASK-20261023-4c12dc (LA-9). Verify, push,
    and open or refresh the PR ready for review. This task runs ALONE.
  uncertainty_reduced: >-
    None about the mathematics. It makes the ranking, the owner assignment
    and the batch opening official together, or none of them.
  inputs:
    - ledger/decisions/DEC-20261023-19c53b.yaml
    - ledger/goals/GOAL-PATH-001.yaml
    - ledger/handoffs/TASK-20261023-18665a.yaml
    - ledger/handoffs/TASK-20261023-5c6d48.yaml
    - ledger/handoffs/TASK-20261023-4c12dc.yaml
    - ledger/handoffs/TASK-20261023-5bcc13.yaml
    - coordination/goals/GOAL-PATH-001/batches/BATCH-7ca353/dispatch_queue.json
    - tools/research_dispatch.py
    - tools/validate_ledger.py
    - tools/check_merge_hygiene.py
    - tools/ecc_priority.py
    - tools/allocate_id.py
    - tools/goal_lanes.py
  constraints:
    - >-
      LA-1 The opening commit comes first, in its own commit:
      coordination/goals/GOAL-PATH-001/batches/BATCH-7ca353/dispatch_queue.json
      only. Push it and render it with python3 tools/research_dispatch.py
      <queue> --ready-only, which must pass (OC-1). The queue is never staged
      by an archive. First record the output of python3 tools/goal_lanes.py
      lanes GOAL-PATH-001, which reads every ref. If another session holds an
      open GOAL-PATH-001 lane, record it in the receipt. Lanes are disjoint by
      construction, and this act wrote no file in another lane's scope. Then
      run: python3 tools/goal_lanes.py open-lane
      GOAL-PATH-001 BATCH-7ca353 --queue
      coordination/goals/GOAL-PATH-001/batches/BATCH-7ca353/dispatch_queue.json
      --decision DEC-20261023-19c53b --objective "Re-scope of
      IDEA-20260803-ff7415 onto KN-OPEN-62c870 Q3 as IDEA-20261023-f15270;
      zero runs" --as <addr> --publish.
    - >-
      LA-2 Before staging, merge origin/main into the working branch. Never
      rebase. Record base_commit_checked and merge_outcome. A conflict inside
      a record is never resolved by editing it: stop and report. If origin/main
      changed ledger/goals/GOAL-PATH-001.yaml or added a GOAL-PATH-001 lane,
      stop and report to a fresh Coordinator act (spare DEC-20261023-98005b).
    - >-
      LA-3 Goal-head check, mechanical (OC-3). The diff of
      ledger/goals/GOAL-PATH-001.yaml against the base may contain only these
      changes: current_batch_id changed from BATCH-002 to BATCH-7ca353;
      dispatch_queue_path changed from
      coordination/goals/GOAL-PATH-001/batches/BATCH-001/dispatch_queue.json
      to the BATCH-7ca353 queue path; four new keys,
      current_batch_id_before_BATCH-7ca353,
      dispatch_queue_path_before_BATCH-7ca353, current_batch_note_2026_10_23
      and open_batches (one item, BATCH-7ca353); and one new key,
      next_action_2026_10_23, under 1,000 characters. status stays active, and
      the existing next_action is byte-identical. Record the base sha256 of the
      file. Any other changed or removed line is a scope finding: stop and
      report, and do not repair it. Do not run tools/shard_goal.py in this
      archive (DEC-20261023-19c53b owner_assignment caveat 3).
    - >-
      LA-4 Queue and card check. Each of the four handoffs parses as YAML with
      a non-empty objective, deliverables and completion_gate. The queue's
      embedded handoffs agree with the ledger cards on id, role, write_scope,
      artifact_paths and archived_by. A disagreement stops the archive.
    - >-
      LA-5 Identifier check (OC-4). Run python3 tools/allocate_id.py --check
      for DEC-20261023-19c53b, BATCH-7ca353, TASK-20261023-18665a,
      TASK-20261023-5c6d48, TASK-20261023-4c12dc, TASK-20261023-5bcc13 and
      IDEA-20261023-f15270, and record each output. Expected: only this
      batch's own files reference them. Also confirm that
      ledger/proposals/IDEA-20261023-f15270.yaml does not exist yet.
    - >-
      LA-6 ECC check (OC-2). Run python3 tools/ecc_priority.py --classify on
      RQ-MONO-001, GOAL-PATH-001 and GOAL-ICEX-001, and run
      --budget-violations. Record the outputs verbatim. If RQ-MONO-001 or
      GOAL-PATH-001 is not ECC, or GOAL-PATH-001 has a budget violation, stop
      before staging and report to a fresh Coordinator act (spare
      DEC-20261023-98005b).
    - >-
      LA-7 Stage exactly the seven expected paths, one by one. git add -A,
      git add . and directory adds are forbidden. Generated indexes
      (knowledge/INDEX.md, ledger/.index/, dispatch plans) are rebuilt if
      needed and never staged.
    - >-
      LA-8 Before committing, run tools/validate_ledger.py and
      tools/check_merge_hygiene.py for the branch (OC-5). Stop on any new
      error attributable to a staged path. Record pre-existing errors on main
      as pre-existing, and do not repair them.
    - >-
      LA-9 Input pinning for TASK-20261023-4c12dc (lessons LD-1 and LD-2 of
      DEC-20261017-12e0f4). Before committing, record the sha256 of every file
      path in that card's inputs list in the receipt, under
      input_pins_TASK-20261023-4c12dc. Inputs staged here are pinned at their
      staged bytes; the others are pinned at their bytes in the merged tree.
      List a directory input as its files and their sha256, in sorted order.
      The receipt is never edited after the commit. 4c12dc VP-3 and 5bcc13
      SA-3 re-verify these pins.
    - >-
      LA-10 binding_mode content_at_commit: GOAL-PATH-001.yaml has a life
      after this archive. commit_sha, parent_sha and path_sha256 go into the
      queue's archive block in a later commit, with a tasks_state_revisions
      entry.
    - >-
      LA-11 The commit message names TASK-20261023-5c6d48 and every archive
      record_id literally. It states that the ranking and batch opening take
      effect only on verification of this archive, and it states zero runs.
      Verify the receipt with tools/research_dispatch.py. Push, and open or
      refresh the PR against main, ready for review (never a draft), naming
      every record id. A missing, dirty or scope-expanding commit makes nothing
      official. That is an integrity failure, not a result.
    - >-
      LA-12 Release this task with --outcome completed and --artifact
      <path>=<64-hex sha256> for each of its two artifact paths, computed at
      release; never --artifact <path> alone. Check that the release JSON
      carries two non-empty digests, and record them in the
      tasks_state_revisions entry.
    - >-
      LA-13 If any of OC-1 to OC-5 fails, stop before staging. Nothing in
      DEC-20261023-19c53b takes effect. Do not edit or archive it; report the
      failing condition to a fresh Coordinator act (spare
      DEC-20261023-98005b). A failure is an integrity or procedure finding,
      not negative evidence.
    - LA-14 Never edit a staged file while staging. Never amend, rebase or force-push. The lane stays open after this archive. Zero runs.
  deliverables:
    - >-
      coordination/goals/GOAL-PATH-001/batches/BATCH-7ca353/archives/TASK-20261023-5c6d48/ledger-receipt.json.
      It holds commit_sha (null inside the commit), parent_sha,
