      - GOAL-PATH-001
      - BATCH-7ca353
      - TASK-20261023-18665a
      - TASK-20261023-5c6d48
      - TASK-20261023-4c12dc
      - TASK-20261023-5bcc13
    expected_paths:
      - coordination/goals/GOAL-PATH-001/batches/BATCH-7ca353/archives/TASK-20261023-5c6d48/ledger-receipt.json
      - ledger/decisions/DEC-20261023-19c53b.yaml
      - ledger/goals/GOAL-PATH-001.yaml
      - ledger/handoffs/TASK-20261023-18665a.yaml
      - ledger/handoffs/TASK-20261023-4c12dc.yaml
      - ledger/handoffs/TASK-20261023-5bcc13.yaml
      - ledger/handoffs/TASK-20261023-5c6d48.yaml
    expected_paths_note: >-
      This card's artifact_paths together with those of its one source task,
