  objective: >-
    POST-ARCHIVE RUN-MANIFEST SCHEMA CONFORMANCE REPAIR of the eight committed
    run manifests of EXP-ECDLP-e962f6 (snapshot 09de8800d0, PR #1058 lane
    branch, unmerged), and nothing else. tools/validate_ledger.py check_run
    fails on all eight with 67 errors: the executor's drivers wrote the run
    data as FLAT top-level siblings of `run:` (command, git, code, environment,
    seeds, params, inference, timing, exit_code, protocol_deviations,
    artifacts), while the ledger run schema requires a NESTED `run:` record
    carrying id, experiment_id, status, code, environment, inputs, timing,
    result (incl. result.certificate.kind in discrete_log|decomposition|none),
    plus code.commit and code.command. Because the defective manifests are
    ALREADY COMMITTED (09de8800d0, pushed, unmerged) they are immutable
    (AGENTS.md rules 4-5; check_run_immutability.py): they are NOT edited,
    amended, squashed, renamed, or moved. Each is repaired by a NEW hash-pinned
    superseding record via the validator's run-supersession mechanism
    (tools/run_supersession_registry.yaml), transcribing every recorded value
    unchanged, so the repair snapshot TASK-20260909-7b23dc can bind bytes that
    validate.
  uncertainty_reduced: >-
    Whether the executed run package can pass the ledger-and-harness CI gate at
    all: 67 validator errors on the PR head block the merge and any downstream
    review or disposition. This task removes that block by adding conformant,
    hash-pinned superseding records, and changes no science.
  why_this_task_exists: >-
    The frozen contract's required-artifacts clause named the run manifest but
    not the ledger's nested `run:` schema, so the drivers satisfied the contract
    and still failed tools/validate_ledger.py. The defect is SCHEMA CONFORMANCE
    ONLY: the science outputs (raw-result.json, stdout, the derivation doc) are
    unaffected. Unlike the precedent TASK-20260906-546d17 (whose manifests were
    still uncommitted worker output and were repaired in place pre-archive),
    here the defective bytes are committed, so the repair is a NEW record per
    the run-supersession mechanism, not an in-place edit. No durable record is
    edited and no run is re-scored (core rules 3, 4, 5).
