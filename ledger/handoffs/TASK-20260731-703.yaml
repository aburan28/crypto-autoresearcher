handoff:
  id: TASK-20260731-703
  from: coordinator
  to: executor
  objective: >-
    Run GATE-601-B, and ONLY GATE-601-B, strictly limited to its three
    SELF-CONTAINED yields: (1) CORRECTNESS EQUIVALENCE — that the
    Walsh-Hadamard-transform reorganization of the key-guess aggregation and the
    partial-sums aggregation return IDENTICAL surviving-key sets on a
    small-scale AES-shaped cipher; (2) S-BOX INDEPENDENCE of the counted
    operation ratio under its null-object control (the same comparison re-run
    with the cell-alphabet S-box replaced by a freshly drawn random bijection);
    and (3) the MEASURED counted ratio on the fully enumerable 2^16 guess-space
    instance, against a re-implemented baseline. Nothing else.
  uncertainty_reduced: >-
    Whether the WHT reorganization is algebraically equivalent to partial sums
    on an exactly checkable instance, and whether the operation-count difference
    between them is an algebraic property (S-box-independent, as the
    reorganization predicts) or an implementation artifact (ratio moves when the
    S-box is randomized). These three questions are answerable inside this
    environment and need no literature at all.
  inputs:
    - >-
      DEC-20260731-011, disposition CAND_601_B: sota_delta STRUCK together with
      every comparison against the recalled 2^44 partial-sums baseline;
      GATE-601-B is otherwise sound and may be dispatched ONCE the struck claims
      are removed, limited to its three self-contained yields. It remains a
      cofactor-class candidate under docs/target-result-profile.md.
    - >-
      EV-AES-001 observations B-8 (defect I-6, why the margin is unadjudicable)
      and B-12 (what the gate could still establish).
    - >-
      TASK-20260731-604 validation_report.yaml, cand_601_b_gate_assessment — the
      independent judgement that the null control is "unusually sharp for a
      cost-term claim" and is the strongest single element in the ideation
      package.
    - >-
      The BATCH-001 candidate_report.yaml GATE-601-B specification, READ-ONLY,
      at snapshot 0185c0ff: 4-bit cells, 4x4 state (64-bit block), guess space
      4 cells x 4 bits = 2^16 fully enumerable, explicit operation counters
      counting table lookups, XORs and additions IDENTICALLY in both
      implementations, repeated at 3-bit and 5-bit cells for the scaling in cell
      width. Declared envelope fit: ~40 min to implement, < 5 min to run all
      cell widths and both S-box variants on 4 cores, < 500 MB.
    - >-
      Local tooling: gcc 13.3.0, python3 3.11.15 with pycryptodome 3.23.0,
      openssl 3.0.13, 4 CPU cores, 15 GB RAM, no GPU.
  constraints:
    - >-
      NO LITERATURE COMPARISON OF ANY KIND. CAND-601-B's sota_delta and EVERY
      comparison against a recalled baseline — the 2^44 partial-sums figure
      above all — are STRUCK by DEC-20260731-011 and must not reappear in any
      form, including as an aside, a footnote, a "for context" remark, a
      motivation sentence, or an extrapolation. Do not state or imply any
      comparison against literature, published work, best-known attacks, or a
      state of the art. The margin is smaller than the recall uncertainty in the
      number it would be measured against and is UNADJUDICABLE in this
      environment regardless of how the gate resolves. If you find yourself
      writing a bit-margin against anything not implemented in this task, stop
      and delete the sentence.
    - >-
      THE ONLY BASELINE IS THE ONE YOU IMPLEMENT. Yield (3) compares two
      implementations both written in this task, on an instance both actually
      run. That is the whole comparison. Report the ratio as a measured property
      of these two implementations at these cell widths, and nothing more.
    - >-
      THREE YIELDS, NO FOURTH. Do not extrapolate the ratio to 8-bit cells, do
      not predict a crossover, do not conclude "WHT beats / loses to partial
      sums at AES scale", and do not report the GATE-601-B PASS/FAIL escalation
      criterion as originally written, because its escalation leg depends on the
      struck extrapolation. Report instead: equivalence verdict, S-box
      independence verdict, measured ratios per cell width. The 3-bit and 5-bit
      runs are performed and their ratios reported as MEASUREMENTS at those
      widths; they are not fitted into a prediction.
    - >-
      COUNTED, NOT TIMED. The comparison is a COUNTED operation ratio, from
      explicit counters that count table lookups, XORs and additions IDENTICALLY
      in both implementations. State the counting convention precisely and show
      it is symmetric. Do not substitute wall-clock timing for the counted
      ratio; report wall clock separately as an observation if at all.
    - >-
      NULL-OBJECT CONTROL IS MANDATORY AND IS RUN BEFORE BELIEF. Re-run the
      identical comparison with the small-scale cipher's S-box replaced by a
      freshly drawn random bijection on the cell alphabet, with the draw seeded
      and the seed recorded. The reorganization is algebraically S-box-agnostic,
      so the counted ratio MUST be unchanged. A ratio that MOVES under S-box
      randomization proves the measured advantage is an implementation artifact,
      not an algebraic one, and that is a VOID outcome that must be reported as
      such (docs/inventor-protocol.md section 3). Use more than one random
      bijection draw if budget permits.
    - >-
      VOID CONDITIONS, reported honestly if they occur: the two implementations
      return DIFFERENT surviving-key sets (a correctness bug — the counted ratio
      then means nothing and must not be reported as a result), or the ratio
      depends on the S-box. Neither is a negative result about AES; both are
      results about this implementation pair.
    - >-
      SCOPE. This is a SMALL-SCALE AES-SHAPED CIPHER, not AES. Nothing measured
      here is a statement about AES at any round count, about full-round AES, or
      about deployed AES security. State that limitation in run_record.md. The
      full-scale form of this attack needs a 2^32-entry (4 GB) accumulator and
      is correctly declared NOT to fit the envelope — do not attempt it and do
      not estimate around it.
    - >-
      GATE-601-A IS NOT DISPATCHED. CAND-601-A is premise-undermined and
      repair-before-run under DEC-20260731-011. Do not run it, do not partially
      run it, and do not compute its statistic.
    - >-
      OBSERVATIONS ONLY. Make no cryptanalytic claim, propose no hypothesis,
      assign no evidence strength, and change no official state.
    - >-
      Seed all randomness deterministically and record every seed. Record exact
      commands, exit statuses, resolved tool versions, git commit and dirty-tree
      state, timestamps, and any check that did not run and why. Do not fabricate
      a command, output, count, timing or verdict (AGENTS.md rule 9).
    - >-
      Do not modify any BATCH-001 committed artifact. Write only under the
      assigned task directory.
    - >-
      A timeout, crash, or out-of-budget condition is INFRASTRUCTURE SIGNAL and
      is reported as such — never as a negative mathematical result (AGENTS.md
      rule 5).
  deliverables:
    - gate_601b_impl.c
    - gate_601b_results.json
    - run_record.md
  artifact_paths:
    - coordination/goals/GOAL-AES-001/batches/BATCH-002/tasks/TASK-20260731-703/gate_601b_impl.c
    - coordination/goals/GOAL-AES-001/batches/BATCH-002/tasks/TASK-20260731-703/gate_601b_results.json
    - coordination/goals/GOAL-AES-001/batches/BATCH-002/tasks/TASK-20260731-703/run_record.md
  archived_by: TASK-20260731-704
  inference:
    policy: executor-implementation
    requested_policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
    standing_basis: >-
      inference-amendment commit 0137a051eb5828789eb267fa83c8278086578d4c. Under
      this harness all subagents run `model: inherit`, so a substitution is
      structural and expected; recording it is mandatory.
    harness_note: >-
      Record requested_policy and the ACTUAL resolved model in the run manifest's
      inference block with fallback_used set accordingly. Never silently
      substitute; never guess a resolved model you did not observe.
  budget:
    wall_clock_seconds: 2700
    memory_gb: 4
    maximum_runs: 8
  completion_gate:
    - >-
      INFERENCE BLOCK REQUIRED. gate_601b_results.json and run_record.md each
      carry an `inference` block recording policy, requested_policy
      (executor-implementation), the ACTUAL resolved model identifier,
      fallback_used, model_verified (false if `doctor --probe` was not run), and
      the standing basis 0137a051. Missing or partial fails this task.
    - >-
      YIELD 1: both aggregations are run on at least 8 random keys at the 2^16
      guess space, and the surviving-key sets are compared EXACTLY. The verdict
      is identical / not identical, with the sets or their digests recorded per
      key and per seed.
    - >-
      YIELD 2: the identical comparison is re-run with a seeded random bijection
      replacing the S-box, and the counted ratio from both variants is reported
      side by side with the difference quantified. The verdict states whether the
      ratio is S-box-independent within the stated tolerance, and a moved ratio
      is reported as VOID (implementation artifact), not suppressed.
    - >-
      YIELD 3: the measured counted operation ratio is reported for the 2^16
      instance and for each cell width actually run (3, 4, 5 bits), with the raw
      counter totals for both implementations, the counting convention stated,
      and its symmetry across the two implementations demonstrated.
    - >-
      NO literature comparison, recalled baseline, sota_delta, bit-margin, 8-bit
      extrapolation, or crossover prediction appears anywhere in any artifact.
    - >-
      run_record.md states that the measurements concern a small-scale
      AES-shaped cipher and assert nothing about AES at any round count, and
      records the terminal status of every attempted run including any that
      failed or did not run, with the reason.
    - >-
      gate_601b_results.json is machine-readable and records exact commands,
      exit statuses, compiler and tool versions, git commit and dirty-tree state,
      all seeds, timestamps, and per-run resource measurements.
  return_format: >-
    The three artifacts under the assigned task directory, plus a short summary
    naming: the correctness-equivalence verdict, the S-box-independence verdict
    with both ratios, the measured counted ratios per cell width, and any VOID
    condition encountered. No comparison to anything not implemented in this
    task.
