  uncertainty_reduced: >-
    Whether the bundle's 160-cell obligation matrix and 400-cell
    chart-coverage matrix are genuinely complete and internally consistent;
    whether the two REFUTED counterexamples (CTREX-01/CTREX-02) are
    mathematically sound as claimed to be "checkable by inspection"; and
