  inputs:
    - ledger/handoffs/TASK-20260913-c6df88.yaml
    - experiments/EXP-CRYPTO-6505c6/audits/TASK-20260913-c6df88/ (all 20 files)
    - experiments/EXP-CRYPTO-6505c6/specification.yaml
    - coordination/design/BATCH-aa0d38/audits/TASK-20260913-0d9fe6/source-digest.md
  constraints:
    - Run alone through parent; exact paths only; preserve originals.
    - >-
      Do not trust any producer-reported tally or verdict without
      independently recomputing or re-deriving it: obligation-results.yaml's
      160-row coverage and status_tally recomputed from raw rows (not
      copied); chart-coverage.yaml's 400-row coverage and status_tally
      recomputed the same way; the two REFUTED counterexamples hand-derived
      against specification.yaml's own target_sum definition, not merely
      re-read; every path_sha256 recomputed via sha256sum against bytes on
      disk, not copied from the bundle's own artifact-sha256.json.
    - >-
      A found defect in a not-yet-archived, not-yet-committed deliverable is
      corrected before archiving, with the correction fully disclosed (never
      silently fixed and never left uncorrected) -- this differs from the
      immutable-record convention only in timing: the bundle was still
      untracked working-tree content from a background executor subagent
      when the defect was found, not yet an official record.
  deliverables:
    - coordination/design/BATCH-aa0d38/archives/TASK-20260913-627c97/snapshot.json
  artifact_paths:
    - coordination/design/BATCH-aa0d38/archives/TASK-20260913-627c97/snapshot.json
  archived_by: TASK-20260913-627c97
  inference:
