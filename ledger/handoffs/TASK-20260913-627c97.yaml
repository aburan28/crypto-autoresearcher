    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: null
    memory_gb: 4
    maximum_runs: 0
  completion_gate:
    - >-
      All 20 path_sha256 values independently recomputed via sha256sum
      against bytes on disk; 16 of 20 match artifact-sha256.json's stored
      values exactly, and the 4 that differ (counterexamples.yaml,
      moment-certificates.yaml, obligation-results.yaml,
      stratification-application.yaml) are exactly the files this task
      corrected before archiving, with the discrepancy explained in
      snapshot.json's meaning field.
    - >-
      obligation-results.yaml's 160 rows and chart-coverage.yaml's 400 rows
      were independently parsed and their coverage (all declared
      case/obligation and case/tag-pair combinations present exactly once)
      and status_tally both reconfirmed against an independent recount, not
      copied from the files' own self-reported tallies.
    - >-
      CTREX-01 and CTREX-02's REFUTED verdicts were hand-derived from
      specification.yaml's target_sum definition
      (S_F,n(Q,R)=sum_P t_F(f_Q(P))*conj(t_F(f_R(P)))): a constant trace
      t_F=c gives S_F,n(Q,R)=c^2*|E(F_(p^n))| for every (Q,R) (c^2, not c,
      since t_F ignores its argument and contributes c*conj(c) per term),
      so sum_{(Q,R)}|S_F,n(Q,R)|^4=c^8*q_n^6, which exceeds any
      n-independent B*q_n^5 bound as n->infinity for any fixed c>0 (q_n
      diverges by Hasse's bound) -- confirming REFUTED is sound for both
      C1 (c=1) and C2 (c=2), and that the arithmetic error found and fixed
      (the executor's draft used c^1 rather than c^2, invisible at c=1)
      does not change this conclusion.
    - >-
      open-obligations.yaml's HEADLINE-GAP-01 (O06 OPEN for case-01..case-14)
      and HEADLINE-GAP-02 (O01 OPEN for the 7 family-L cases, explicitly not
      NOT_APPLICABLE) were checked against the handoff's exact instruction
      and found compliant; no counterexample is claimed or fabricated
      against the main K/L target anywhere in the bundle; audit-report.md's
      overall INCONCLUSIVE-for-both-families outcome is a non-inflated,
      logically consistent reading of the underlying cell data.
    - >-
      This archive does not constitute the independent qualified semantic
      review specification.independent_checker_plan.semantic_output calls
      for; audit-report.md and checker-results.yaml both state this
      correctly and this snapshot does not overstate it either.
  review_plan: null
