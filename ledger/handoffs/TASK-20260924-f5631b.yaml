# TASK-20260924-f5631b -- RED-TEAM CARD, ZERO-RUN INDEPENDENT ADVERSARIAL
# REVIEW of the DRAFT AMD-EXP-GFPN-05ff43-20260924-failclosed.
# It runs no msolve, valgrind, callgrind_annotate, gp, Sage or builder child,
# creates no run package, and imports no module of the scanned trees.
# Its single question: can a package be PASSED, PASSED_ZL or ADMITTED by the
# draft's rules while a capped child that may have executed argv has no
# recorded cap read-back, or while its outcome was recorded by the wrapper
# rather than by the frozen driver (a FAIL-OPEN counterexample)? And does any
# planned basis outcome FAIL by design? It also checks the development harness
# DV-18 needs, and it must first reproduce a known answer.
# It replaces the static census that preceded every earlier approval act of
# this lineage (DEC-20260924-8fa3d4 change of approach). A fail-closed finding
# (a path on which the rules FAIL or say `undetermined`) is reported, and is
# never a bar.
# Ordered by DEC-20260924-8fa3d4. Written by the Coordinator under
# TASK-20260924-7e9d3e. This card launches nothing. Its one archival task is
# TASK-20260924-0c2fdc.
# =============================================================================
