  review_plan: null
  review_plan_note: >-
    Not a claim-changing review round: it can move no hypothesis status, close
    no lane and support no headline claim; its only consumer is a protocol
    decision. Its design is nevertheless written first, below, with one owner
    per joint, a worked attack per joint, a known-answer control and declared
    blindness; the Coordinator's prior is recorded in DEC-20260924-8fa3d4
    (review_design.prior), to which this reviewer is blind.
  review_design:
    owner_of_every_joint: TASK-20260924-f5631b (single reviewer)
    joints:
      J-1_recording_rule:
        reading: RFR-1 (definitions (i), (iii), (iv))
        claim_under_attack: >-
          RF-1 with RK-1 (a), (c), (d) and RL-1 never records child_created
          false for a created or possibly created child, never loses a pair
          the parent read at v2_solver.py 227, and detects every record ended
          in a process other than the installing one.
        worked_attack: >-
          (1) Take every row of the close census's path table (md 190-206:
          P-1..P-4, P-5a, P-5b, P-6..P-13, P-14a/b/c, P-16, P-F1, P-F2, P-C)
          and state what RF-1 records on each. (2) Construct further paths the
          census did not list: a raise inside the recorder itself after the
          frozen call returned (while writing the event file, or during the
          chain walk); an asynchronous exception delivered in the recorder
          between the frozen call's return and the durable write; exception
          chaining with __suppress_context__, `raise ... from`, or a chain
          longer than 16; a frozen _run_child_locked frame at 181 reached only
          through __cause__; a signal handler installed by any r3 module or
          entry (search signal.signal, faulthandler, atexit and threading in
          the r3 base and frozen trees). (3) For each, is the outcome
          fail-open (a break) or fail-closed (a finding)?
        where_it_may_break: >-
          The recorder's own failure path (RL-1 (d) calls a recording failure
          an SE-2 (4) consistency violation) and asynchronous exceptions
          inside the recorder.
      J-2_verdict_rules:
        reading: RFR-1 (definitions (ii), (v))
        claim_under_attack: >-
          Under RF-0 (b), RF-2 and RF-3 no package receives PASS or PASS_ZL,
          and no dependant is admitted, while a child that may have executed
          argv lacks a recorded pair equal to the cap or while the outcome is
          wrapper-recorded.
        worked_attack: >-
          (1) Enumerate every layer between v2_solver.run_child and each frozen
          command's entry point on both entries (the SE-3 wrapper of
          v2_driver.solve, the HR-3 wrapper of a1_health.run_system, P-B's
          curve_order_pari, the frozen drivers, the r3 entries) and find any
          handler that CATCHES an exception raised from run_child and lets the
          command finish with a driver-written raw-result.json; state RF-3's
          verdict on it. (2) Find any way raw_result_writer could be "driver"
          for a raw-result.json the frozen command's finish() did not write.
          (3) Check the route "driver died after 227; its raise-frame record
          carries the pair; the frozen item at v2_check_run.py 66-67 passes"
          under RK-3 (b) as worded and under RF-3. (4) Check that a class (C)
          child cannot reach exec (v2_solver.py 183-208), including an execv
          that raises after an "OK" report. (5) Check that every class (B)
          pair reaches the frozen checker's cap comparison (v2_check_run.py
          68-70) through the RB-2 / RL-3 union.
        where_it_may_break: >-
          A handler in the r3 SE-3 or HR-3 wrapper (r3_resolve and the a1
          health path) that converts a raise into a result.
      J-3_planned_basis_outcomes:
        reading: RFR-2
        claim_under_attack: >-
          No driver-logic outcome that a dependant's frozen logic acts on
          receives FAIL by design under RF-2 or RF-3.
        worked_attack: >-
          For each package kind of both r3 plans (from which the r4 plans are
          derived) and each driver-logic outcome in the close census's RKR-3
          and RKR-4 (b) tables (md 377-429, 476-492), including Z-C5 in both
          run_status variants, Z-F4, and normal outcomes carrying class (A)
          refusals or class (C) children, state the verdict and whether any is
          FAIL by design.
        where_it_may_break: >-
          RF-2 (vii)'s kind list, and outcomes of the contingency kind.
      J-4_development_harness:
        reading: RFR-3
        claim_under_attack: >-
          With RF-4 (a)'s closed list of replacements, DV-18's development
          packages of controls, anchor-identity and controls-a1 compute exactly
          as the plan packages would, apart from RF-4 (d)'s label fields; RF-4
          (b)'s expected refusals and (c)'s expected checker item are complete.
        worked_attack: >-
          (1) Confirm each replacement exists in the r3 base at the lines the
          close census lists (md 612-631). (2) Read cmd_controls,
          cmd_anchor_identity, the controls-a1 command and everything they
          call for every read of the run id, GFPN_RUN_DIR, the plan, EXP_DIR,
          RUNS_DIR, LADDER_PATH, FIXTURE_N3_JSON, FIXTURE_N4_JSON and the
          receipts; find any that changes seeds, streams, targets, argv, cap,
          watchdogs or thread count. (3) Check whether launch's receipt reads
          (r3_run_wrapper.py 437-440) raise without a receipt, whether the
          checkers' forbidden-id sweeps react to the label, and whether any
          other preflight predicate or checker item fails in a world without
          G1..G4.
        where_it_may_break: >-
          A seed or stream derived from a path or id; a1_driver's package
          checks (a1_driver.py 50-52); receipt reads at launch.
      J-5_known_answer_control:
        reading: RFR-0 (c)
        claim_under_attack: The reviewer's own method is sensitive enough to find fail-open cases.
        worked_attack: >-
          Apply the method used for J-1 and J-2, unchanged, to readbackclose's
          RK-1 and RK-3 as worded: it must report P-16 and P-F2 (after P-14a)
          as child_created false for a created child, and W-1 as PASS_ZL for a
          wrapper-recorded outcome. Then apply it to a deliberately weakened
          RF-1 ("false whenever no `pid` is found"): it must report P-16 as
          fail-open. Report what the method actually did on each object.
        failure_signature: >-
          A method that does not flag these objects cannot support "holds" on
          J-1 or J-2.
      J-6_reads_reach_and_readers:
        reading: RFR-4 and RFR-6 (informational)
        worked_attack: >-
          Confirm that X-13 (a1_check_run.py 79-84) reads the fields X-02
          (r3_run_wrapper.py 190-196) reads; confirm the carried RLR-2 / RKR-2
          findings with the RTR-2 (d) diff; list every reader of
          raw_result_writer, the recorder-foreign file and the `undetermined`
          value in the r3 base and the draft's rules, and whether any changes
          what it computes.

