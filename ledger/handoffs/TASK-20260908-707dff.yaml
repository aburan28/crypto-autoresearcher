        and an unrelated invalid extra queue task. Check locally trusted source pins for every loaded validator
        dependency, no external-commit code execution, no queue mutation, exact read/hash/output/release/archive
        correspondences and real ancestry. Trace the production spool and all artifact paths end to end: a
        large lazy payload, large single string, CSV/YAML keys, file copy and all-history cases must not materialize
        complete payloads before guarded chunks. Verify spool preservation, bounded current-cell state and
        compact reducers against all192cells and781824maximum certificate records. Verify every required scientific
        record remains serializable with unchanged types; rejecting an integer-key fixture is not enough if
        the real manifest requires that key. Test custody.finalize_run directly with payload rename, companion
        write/fsync, parent fsync, quarantine and cleanup failure injections. Success must leave both complete
        durable payload and stable companion; late failure must retain incomplete evidence and original typed
        stop without replacing it with a secondary exception. Check timing excludes only declared terminal
