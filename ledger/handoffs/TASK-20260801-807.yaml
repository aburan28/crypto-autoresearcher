handoff:
  id: TASK-20260801-807
  from: coordinator
  to: executor
  objective: >-
    TWO deliverable groups, in one task because both DROP THE SAME HYPOTHESIS
    (H2) of PROP-701-I — the demand that pi propagate deterministically FOR EVERY
    STATE s — at two strengths weaker than OD-4's.
    (a) OD-3, SET-VALUED OBJECTS: pi is currently a function of ONE state.
    Determine what PROP-701-I's machinery does and does not say about objects
    defined on a SET of states (a projection of a whole structured set, e.g. a
    coordinate-wise sum or a multiset profile), and identify precisely which of
    Steps 1-3 survives, which breaks, and where. NOVELTY SCREEN FIRST AND HARD:
    the two most obvious members of this class — integral/square balance and
    Demirci-Selcuk MITM multisets — are ALREADY OFF-LIMITS as known families
    under this campaign's screening, so a genuinely new member must be defined on
    something OTHER than a coordinate-wise sum or a single-byte multiset, and a
    candidate that reduces to either is recorded as a REDISCOVERY and dropped,
    not dressed up.
    (b) D-705-5 HOLE (ii), THE RESTRICTED STATE QUANTIFIER: (H2) demands
    deterministic propagation for EVERY state s. An object required to propagate
    only on a STRUCTURED SUBSET S of states — a coset, a delta-set, a set defined
    by fixing some bytes — falls outside the hypothesis entirely, and BOTH the
    BATCH-003 producer and the independent BATCH-003 validator confirmed the hole
    is untouched by anything proved so far. The proof's load-bearing use of the
    full quantifier is IDENTIFIED AND NAMED: Step 2's sweep needs
    u_k = sum_l M[k][l] y_l + (k_j)_k to range over ALL of F as u ranges over the
    hyperplane U_i, which is what removes the constraint and produces the GLOBAL
    invariance. QUANTIFY THAT: for structured subsets S, compute how much of F
    the coordinate u_k actually reaches, and determine how large or how
    structured S must be before the sweep still covers F — a finite, exhaustively
    computable question in a scaled-down analogue. Report whether the restriction
    breaks PROP-701-I cheaply, breaks it only for very small S, or does not break
    it at all.
  uncertainty_reduced: >-
    Whether PROP-701-I's closure is BRITTLE or ROBUST under the two cheapest
    weakenings of its quantifier, and therefore whether the campaign's remaining
    open super-box classes contain anything or are as empty as the deterministic
    sub-lane. (b) is the sharper of the two: if the sweep still covers F for
    every structured subset of interesting size, PROP-701-I's closure is far
    wider than it is stated to be and hole (ii) mostly closes; if it fails for a
    delta-set-shaped S, the hole is real and names a concrete class the closure
    does not reach. Either answer narrows the campaign's remaining search.
    (a) determines whether OD-3 contains any admissible object at all once the
    two known families are screened out, which three batches of ideation have not
    established either way.
  inputs:
    - >-
      PROP-701-I as stated in the BATCH-002 candidate_report.yaml at snapshot
      ebac9ba8, READ-ONLY: the full Step 1 / Step 2 / Step 3 proof and its four
      scope restrictions, in particular SINGLE-STATE ONLY (OD-3) and the "for
      EVERY state s" quantifier.
    - >-
      OD-3 as recorded in candidate_report.yaml open_directions, INCLUDING its
      warning: "its two most obvious members (integral balance, DS-MITM multiset)
      are already off-limits families. A genuinely new member must be defined on
      something other than a coordinate-wise sum or a single-byte multiset."
    - >-
      TASK-20260801-801 report section 5, which names both D-705-5 holes and
      answers NO for each on whether Proposition 801-1 touches it, and states for
      hole (ii): "Both Step 1's hyperplane construction and Step 2's sweep of u_k
      over all of F consume the full quantifier, so the proof does not survive the
      restriction even partially."
    - >-
      TASK-20260801-804 od1_and_gate_review.md section 7, in which the
      independent validator confirmed by reading (H1) and (H2) that NEITHER hole
      is touched and upheld the producer's NO on both.
    - >-
      TASK-20260801-801's measured graph geometry (diameter 30, G^2 diameter 16,
      covering number n* = 15, vertex-transitive) and DEC-20260731-026's IN-SCOPE
      VACUOUS ruling, which are the basis of this task's mandatory pre-screen.
    - >-
      KN-FIND-028, in particular that MixColumns generates a cyclic group of
      order 4 in GL(4,GF(2^8)) so no AGL/GL transitivity argument is available
      for column-local invariants, and that PROP-701-I is NOT to be cited as
      established.
    - >-
      protocol-amendment-GOAL-AES-001-004 Part B, the per-artifact-class
      provenance gate, IN FORCE for this task.
    - >-
      Local tooling: python3 3.11.15, 4 cores, 15 GB RAM, no sage, no GPU, no
      network, no MILP/SAT tooling.
  constraints:
    - >-
      THE PRE-SCREEN IS MANDATORY, IS APPLIED BEFORE ANY DERIVATION OR COMPUTE,
      AND IS FROZEN AS AN ARTIFACT. WRITE prescreen_od3.json FIRST, before
      writing any part of the derivation and before running anything, marked as
      written first with a timestamp. For EACH candidate closure or claim you
      intend to pursue in either group, record: (a) its one-line statement;
      (b) whether its argument spreads invariance or any propagated property
      through the (lambda,k) graph or its square G^2, yes or no; (c) if YES, the
      INTERFACE CONSTANT n the argument would require, exhibited as a number or
      an explicit upper bound; (d) the VERDICT PURSUE if n <= about 7,
      IN_SCOPE_VACUOUS if n > about 7 or if no upper bound on n can be exhibited;
      (e) if NO to (b), a substantive statement of what machine the argument
      routes through instead and why the interface screen does not apply. THE
      SAME SCREEN, THE SAME THRESHOLD, THE SAME BASIS as TASK-20260801-806,
      deliberately in identical language.
    - >-
      A CANDIDATE THE PRE-SCREEN KILLS IS NOT PURSUED. Record it with verdict
      IN_SCOPE_VACUOUS and the constant that killed it and STOP WORK ON IT. Do
      not prove it anyway. Do not relabel a candidate to dodge the screen: the
      screen is on the argument's iteration count over interfaces however the
      iteration is packaged, and repackaging n steps as one lemma does not change
      n. BATCH-003 lost an exponent-relevant slot to a theorem discovered vacuous
      only after it was proved, and that is what this gate exists to prevent.
    - >-
      NOVELTY SCREEN BEFORE COMPUTE, FOR GROUP (a). Every candidate set-valued
      object is screened against the known families before any effort:
      integral/square balance, Demirci-Selcuk MITM multisets, division property,
      impossible differential, boomerang, biclique. A candidate that reduces to a
      coordinate-wise sum or a single-byte multiset over a delta-set IS one of
      those families and is recorded as a REDISCOVERY with the family named, then
      dropped. Record the screen for every candidate, including the ones that
      pass. If EVERY candidate is a rediscovery, that is a complete and
      reportable outcome — record NO_ADMISSIBLE_MEMBER with the enumeration and
      the reason, exactly as BATCH-002's ideation recorded
      NO_ADMISSIBLE_NEXT_MECHANISM — and do NOT invent a member to have something
      to report.
    - >-
      GROUP (b) IS QUANTITATIVE AND EXHAUSTIVE WHERE THE SPACE PERMITS. The
      question "how much of F does u_k reach as u ranges over the constrained
      set" is finite and computable. Compute it, do not argue it: enumerate over
      a scaled-down analogue where exhaustive enumeration is feasible (the
      GF(2^4) analogue used by GATE-701-C v2 is this campaign's established
      precedent), report the reachable-set sizes for a NAMED and JUSTIFIED family
      of structured subsets S — at minimum: cosets of coordinate subspaces,
      delta-sets with one active byte, delta-sets with several active bytes, and
      sets defined by fixing some bytes — and state exactly which S break the
      sweep and which do not. State that the analogue IS an analogue, that its
      readings are NOT evidence about GF(2^8) and are certainly not about AES,
      and give the argument for whether the analogue's answer transfers, rather
      than assuming it does.
    - >-
      PRE-REGISTER BEFORE YOU MEASURE. Write your predicted reachable-set
      behaviour for each named family of subsets S into the report BEFORE
      recording any measured output, and mark that section as written first. A
      prediction adjusted after seeing the reading is a protocol violation, not a
      refinement. This is the direct repair of the D-705-1 shape.
    - >-
      NULL OBJECT BEFORE BELIEF, AND IT MUST ISOLATE. If you build any control or
      gate, build the SIBLING NULL before believing the label: V-804-1 is this
      campaign's own demonstration that a control can DISCRIMINATE without
      ISOLATING the property it names. State explicitly which property your
      control isolates and build the sibling that negates the same named
      ingredient differently, or state plainly that no control was built.
    - >-
      NO CLOSURE IS PROPOSED HERE AND NONE MAY BE. Do not propose a
      reject_scoped, do not declare OD-3 or hole (ii) closed, do not declare the
      super-box lane closed, and do not assign evidence strength. Those are the
      Coordinator's transition in TASK-20260801-811, conditioned on the
      independent review in TASK-20260801-809 and the red team in
      TASK-20260801-810. In particular: PROP-701-I is NOT established
      (KN-FIND-028 declines to assert it and instructs readers not to cite it as
      established, and its falsification gate still fails to isolate the
      ingredient it names, V-804-1), so do not build any claim in this task on
      PROP-701-I's TRUTH — you may reason about its PROOF, which is a different
      and permitted thing, and you must say which you are doing at each point.
    - >-
      IF EITHER GROUP PRODUCES A COST OR ASYMPTOTIC STATEMENT, the four promotion
      gates apply exactly as they do in TASK-20260801-806 and must be addressed
      in this package: single-responsibility lemma decomposition with explicit
      per-attempt-cost x inverse-success-probability bookkeeping; every
      conditional dependence as a NUMBERED heuristic HEUR-807-n stated formally
      and paired with archived validation evidence or a concrete
      validation-experiment specification (distribution, scale, predicted
      distribution, tail check, falsifying outcome); a concrete-cost table with
      hidden-overhead, memory, time-memory-tradeoff and parallelization
      accounting, individually flagged optimistic assumptions and an
      affected-vs-safe scope statement; and gate (4), independent review plus a
      red-team pass, named as REQUIRED AND NOT PERFORMED BY THIS TASK. Record
      gate status machine-readably in od3_results.json and, IF YOU CANNOT CLEAR A
      GATE, NAME THE GATE rather than requesting promotion. This task is not
      expected to produce a cost statement; the gates apply anyway if it does.
    - >-
      A NEGATIVE RESULT MEETS THE CLOSURE STANDARD, NOT THE FATIGUE STANDARD
      (docs/inventor-protocol.md section 4): named obstruction, argument, forward
      guidance. "We looked and found nothing" is a fatigue report. "Step 2's
      sweep still covers F for every S with at least k active bytes, by this
      computation, so hole (ii) closes for those S and remains open only for S
      below that threshold, which are exactly the delta-sets of the integral
      family and are off-limits" is a closure.
    - >-
      SUPERSEDE, NEVER OVERWRITE. Every BATCH-001, BATCH-002 and BATCH-003
      artifact is committed and immutable. Write new, separately named files in
      this task's own directory; modify, re-run into or delete nothing. State
      which prior specification each new file supersedes, if any, and that the
      prior record stands as written.
    - >-
      NO INSTRUMENT WORK. Do not repair, extend, re-run or probe
      mutation_control_v3.py or any predecessor and do not enumerate a
      mutation-control escape. If you believe instrument work is needed, report
      it as a BLOCKER and stop.
    - >-
      SCOPE AND CLAIM TIER. Derivation plus toy-scale computation about the
      algebra of AES components and a scaled-down analogue. NOT a cryptanalytic
      result, NOT a distinguisher, NOT a barrier statement about AES security;
      asserts nothing about AES at any round count or about deployed AES. State
      that in the report.
    - >-
      Every literature statement is UNVERIFIED-FROM-MEMORY (eprint.iacr.org,
      csrc.nist.gov, arxiv.org unreachable) and must be marked inline at the
      point of use. Two agreeing recollections are not a citation; novelty
      against the external literature is UNRESOLVABLE in this environment, so a
      rediscovery finding is stated as "matches a family recalled from memory"
      and never as "known to be known".
    - >-
      Seed all randomness deterministically and record every seed. Record exact
      commands, exit statuses, resolved tool versions, git commit and dirty-tree
      state, timestamps, and every check that did NOT run with its reason. Do not
      fabricate a command, output, count, set size or verdict (AGENTS.md rule 9).
    - >-
      A timeout, crash, or out-of-budget condition is INFRASTRUCTURE SIGNAL
      reported as such, never a negative mathematical result (AGENTS.md rule 5).
      The declared budget is a BINDING STOP CONDITION: halt at it and report what
      was reached.
    - >-
      Create no ledger record, propose no hypothesis status, promote nothing to
      knowledge, change no official state, and write only under this task's own
      directory.
  deliverables:
    - prescreen_od3.json
    - od3_quantifier.py
    - od3_results.json
    - od3_and_hole_ii_report.md
  artifact_paths:
    - coordination/goals/GOAL-AES-001/batches/BATCH-004/tasks/TASK-20260801-807/prescreen_od3.json
    - coordination/goals/GOAL-AES-001/batches/BATCH-004/tasks/TASK-20260801-807/od3_quantifier.py
    - coordination/goals/GOAL-AES-001/batches/BATCH-004/tasks/TASK-20260801-807/od3_results.json
    - coordination/goals/GOAL-AES-001/batches/BATCH-004/tasks/TASK-20260801-807/od3_and_hole_ii_report.md
  archived_by: TASK-20260801-808
  inference:
    policy: executor-implementation
    requested_policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
    standing_basis: >-
      inference-amendment commit 0137a051eb5828789eb267fa83c8278086578d4c.
      Cross-model independence is unavailable campaign-wide; nothing produced
      here may be treated as a closure attestation.
    provenance_basis: >-
      protocol-amendment-GOAL-AES-001-004 Part B, prospective from BATCH-004,
      which clarifies protocol-amendment-GOAL-AES-001-002 PER ARTIFACT CLASS and
      does not replace it: source code carries a comment-block stanza AND a
      manifest artifact_provenance entry; the machine-readable manifest carries a
      first-class inference block AND the complete artifact_provenance list; a
      prose report carries EITHER an in-text block OR a manifest pointer, both
      equally compliant.
  budget:
    wall_clock_seconds: 1200
    memory_gb: 4
    maximum_runs: 8
  budget_basis: >-
    Calibrated against the 890 s and 892 s measured executor tasks, with margin
    for two distinct objects (the OD-3 screen and the hole (ii) quantifier
    computation) in one card. Set below TASK-20260801-806 because its derivation
    load is narrower and its computation is a bounded enumeration in a
    scaled-down analogue. Note that TASK-20260801-802 finished essentially AT its
    declared 900 s stop condition, so this declaration does not assume headroom.
    The declaration is a BINDING STOP CONDITION, not an allowance.
  completion_gate:
    - >-
      INFERENCE BLOCK REQUIRED, AND PROVENANCE PER ARTIFACT CLASS UNDER
      protocol-amendment-GOAL-AES-001-004 PART B (which clarifies
      protocol-amendment-GOAL-AES-001-002 and does not replace it). Every
      declared artifact carries a filled `inference` block recording policy,
      requested_policy (executor-implementation), the ACTUAL resolved model
      identifier, fallback_used, model_verified (false if
      `python3 -m orchestration.adapter doctor --probe` was not run), and the
      standing basis 0137a051eb5828789eb267fa83c8278086578d4c; an unobserved
      resolved model is recorded as `unrecorded`, never guessed. BY CLASS: every
      SOURCE-CODE artifact (od3_quantifier.py) additionally carries a
      comment-block inference stanza in its own text; the covering
      MACHINE-READABLE MANIFEST (od3_results.json) carries a full inference block
      as a first-class field AND an `artifact_provenance` list with one entry per
      declared artifact carrying path, kind, sha256,
      comment_block_inference_stanza (boolean, stated honestly including when
      false) and covered_by_this_manifest_inference_block (boolean); the PROSE
      REPORT (od3_and_hole_ii_report.md) carries EITHER an in-text inference
      block OR a provenance pointer naming the covering manifest, both forms
      being equally compliant. Missing or partial fails this task.
    - >-
      prescreen_od3.json exists, is marked as written BEFORE any derivation or
      compute with a timestamp, and carries for every candidate: its statement,
      whether it spreads invariance through the (lambda,k) graph or G^2, the
      interface constant n (or an explicit statement that none could be
      exhibited), the PURSUE / IN_SCOPE_VACUOUS verdict against the about-7
      threshold, and for any NO answer a substantive statement of what machine it
      routes through instead.
    - >-
      No candidate recorded IN_SCOPE_VACUOUS was pursued, and the report says so
      explicitly for each.
    - >-
      GROUP (a): every set-valued candidate is screened against the named known
      families BEFORE any effort, with the screen recorded for candidates that
      pass as well as fail; every candidate reducing to a coordinate-wise sum or
      a single-byte multiset is recorded as a REDISCOVERY with the family named;
      and if no admissible member survives, NO_ADMISSIBLE_MEMBER is recorded with
      the enumeration and the reason rather than a member being invented.
    - >-
      GROUP (a): the report states which of PROP-701-I's Steps 1, 2 and 3
      survive, break, or are undefined for set-valued objects, with an argument
      for each, and identifies the exact point of departure.
    - >-
      GROUP (b): the reachable-set computation for u_k is EXECUTED, not argued,
      over a named and justified family of structured subsets S including at
      minimum cosets of coordinate subspaces, single-active-byte delta-sets,
      multi-active-byte delta-sets, and fixed-byte sets; the reachable-set sizes
      are reported per subset family; and the report states exactly which S break
      Step 2's sweep and which do not.
    - >-
      GROUP (b): predicted reachable-set behaviour for each named family appears
      in a section marked as written BEFORE measurement, with measured values
      beside it; any discrepancy between prediction and measurement is reported
      as a discrepancy and not silently reconciled.
    - >-
      The analogue is identified AS an analogue wherever it is used, with an
      explicit statement that its readings are not evidence about GF(2^8) and not
      about AES, and with an argument for or against transfer rather than an
      assumption of it.
    - >-
      IF any cost or asymptotic statement is made, od3_results.json carries a
      `promotion_gates` object valuing each of gates (1)-(4) as
      addressed_in_this_package / partially_addressed / not_addressed with
      references or concrete gaps, gate (4) is recorded as required and not
      performed here, and no promotion is requested and no gate is asserted
      satisfied. If no such statement is made, that is recorded as gates NOT
      ENGAGED with the reason.
    - >-
      Any negative outcome is reported at the closure standard — named
      obstruction, argument, forward guidance — and not as a count of things
      tried.
    - >-
      The report states that nothing here is a cryptanalytic claim about AES at
      any round count and is not a barrier statement about AES security; proposes
      no closure, no reject_scoped and no evidence strength; does not build any
      claim on PROP-701-I's truth and says at each point whether it is reasoning
      about the proposition or about its proof; and names which prior
      specification each new file supersedes, if any.
    - >-
      od3_results.json is machine-readable and records exact commands, exit
      statuses, tool versions, git commit and dirty-tree state, all seeds,
      timestamps, and every check that did not run with its reason.
    - >-
      No BATCH-001, BATCH-002 or BATCH-003 committed artifact is modified; no
      mutation-control work of any kind was performed; all writes are under this
      task's own directory.
  return_format: >-
    The four artifacts, plus a plain statement of: (i) how many candidates the
    pre-screen killed and with what interface constants; (ii) whether any
    admissible set-valued member survived the novelty screen, or
    NO_ADMISSIBLE_MEMBER; (iii) which structured subsets S break Step 2's sweep
    and which do not, as measured; (iv) whether hole (ii) is thereby narrowed,
    and to what.
