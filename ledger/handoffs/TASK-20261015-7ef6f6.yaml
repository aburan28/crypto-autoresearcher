handoff:
  id: TASK-20261015-7ef6f6
  from: coordinator
  to: executor
  objective: Add narrow explicit lost-session blind-phase replacement support to native independence composition,
    preserving full-joint ownership and old evidence.
  uncertainty_reduced: Whether native machinery can represent honest new-session blind derivation followed by the
    same replacement Reviewer comparison without stale identity or old-report exposure.
  inputs:
  - tools/check_review_independence.py
  - tools/test_review_independence_addenda.py
  - tools/test_check_review_independence.py
  - tools/test_blind_history.py
  - research/lattice_ic_experiments_20261015/coordinator/blind-replacement/prospective-addendum-draft.json
  constraints:
  - Exclusive source/test maintenance only; no scientific drivers, fixtures, producer code/results, Git writes,
    frozen records, queues or status changes.
  - 'Implement ONLY the explicit top-level review_plan_addendum.blind_phase_replacement directive in the supplied
    draft: exact full_task/replaces_blind_task/replacement_blind_task valid distinct native IDs, nonempty reason,
    retained_blind_archive binding and prior_artifacts_remain_required=true. Reject misplaced, malformed, unknown,
    stale, duplicate/replayed or conflicting directives instead of silently ignoring them. Preserve all existing
    legacy behavior and phase support.'
  - The full_task must already own an unchanged full joint and have an existing same-Reviewer phase binding to replaces_blind_task.
    replacement_blind_task must own a newly explicit joint; old blind joint/owner and its attestation remain required,
    full joint owner never changes. Preserve required/quantity/parameters and all blind_from entries, mutual=true,
    controls and other joints.
  - 'Record a machine-readable history of old phase assignment and exact old scoped grant before prospectively replacing
    the active full-task phase binding. Active scoped grant MUST become exactly the replacement own-artifact allowlist:
    do not union old Reviewer artifacts into new Reviewer authority. Old files/old grants remain immutable history,
    not readable inputs for the replacement Reviewer. Plain repeated splits remain refused.'
  - Enforce source protection for EVERY retained blind phase owner, historical as well as active, when checking
    the composed full round; new/current blind protection does not excuse old blind producer reads. Add old blind
    artifact paths to protected sources for the new task. No existing original or added blind_from path may disappear.
  - Explicit replacement permits exact scoped grant rebinding only to its named new blind task, with nonempty same-new-Reviewer
    rationale and exact non-directory seven-file allowlist. Reject cross-task paths, symlink escape, directory/wildcard
    grants, missing rationale, grants for other owners, and old+new union. Full comparison may read its own replacement
    blind artifacts only after external archive gate; checker cannot authenticate runtime identity/archive timing
    and must document that limit.
  - 'Meaningful synthetic-only tests: valid initial split then replacement composition/CLI passes only complete
    old+new+all-full attestations; old joint and full owner retained; original plan unmodified; replacement protected
    producer/old-review reads fail; old blind producer reads still fail; full owner reading old blind report fails;
    allowed new own files pass; missing old/new/full attestation fails; stale/unknown/duplicate replacement, unowned
    task, full-owner change, protection narrowing, broad lift, replay and malformed directives fail; existing checker/addenda/history
    test modules still pass.'
  - Accept source support only after actual test commands/returncodes and exact two-file hashes delivered. No whole-round
    actual PASS, actual reviewer identity, backend verification, scientific result or archive is invented.
  deliverables:
  - tools/check_review_independence.py
  - tools/test_review_independence_addenda.py
  artifact_paths:
  - tools/check_review_independence.py
  - tools/test_review_independence_addenda.py
  archived_by: TASK-20261015-04f399
  budget:
    memory_gb: 2
    maximum_runs: 0
  inference:
    policy: executor-implementation
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
    delivery: interactive
  completion_gate:
  - Actual meaningful synthetic maintenance tests pass with legacy tests; exact source hashes and actual receipts
    returned; no scientific execution.
  return_format: Exact two-file hash manifest, actual test commands/results, native composition behavior and limitations.
