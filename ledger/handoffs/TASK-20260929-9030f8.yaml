  review_required_note: False. This is a review, structurally blind.
  title: >-
    Lane B blind re-derivation J5 (version 3): the quantities Q0 to Q3 stated
    on this card, from their definitions and parameters alone
  objective: >-
    Compute every quantity that the quantities block of this card defines,
    from its definitions and parameters alone, and report every output it
    asks for. You are told what to compute and not how, and you read no other
    artifact of this program.
  uncertainty_reduced: >-
    Whether a table of elliptic-curve group orders over small binary fields,
    the alphabet and sample sizes derived from them by stated rules, the
    coset purities of stated label families on stated curves, and a threshold
    table under a stated cost model are determined by the stated definitions.
    A second implementation, written by someone who shares nothing with you,
    will be compared with yours afterwards. Disagreement localises to a model
    choice or to one of two named implementations.
  inputs:
    - ledger/handoffs/TASK-20260929-9030f8.yaml
  read_scope:
    - ledger/handoffs/TASK-20260929-9030f8.yaml
    - AGENTS.md
    - agents/validator.md
    - templates/research-records.md
  read_scope_note: >-
    A whitelist of four repository files. Every other repository path is out
    of scope, and every path in the plan's blind_rederivation.blind_from is
    forbidden by name, which you cannot see and need not: read nothing else.
    No git history of any kind, and no pull-request text. No external
    retrieval is needed; every parameter is on this card. (Excluded reads of
    this batch, carried for the record and all outside your whitelist:
    experiments/EXP-QSP-70b731/runs/; experiments/EXP-FROB-30006a/; the ref
    origin/cursor/semaev-2015-audit-program-5b8b; PR #1377; the branch
    cursor/ecdlp2m-revision-design-3d1a.)
  quantities:
    what_you_are_testing: >-
      Whether a set of group orders, alphabet sizes, sample sizes, coset
      purities of declared labelling families, and a threshold table under a
      stated cost model are determined by the stated definitions. A second
      implementation will be compared with yours.
    labels_note: >-
      Cell labels (CELL-*) are this card's own names. Where a definition below
      was written for another document, it is quoted exactly as written there;
      read "the contract" in a quotation as "this card".
    parameters:
      element_encoding: >-
        A field element of F_2[t]/(f) is a non-negative integer read as a bit
        pattern in the polynomial basis: bit j is the coefficient of t^j.
      field_polynomial_rule_DF8: >-
        Quoted exactly: "FIELD POLYNOMIAL (DF-8): the polynomial named for the
        cell where the contract names one (t^19 + t^5 + t^2 + t + 1 for
        CELL-K19 and CELL-O19; t^17 + t^3 + 1 for CELL-K17C and CELL-RC1);
        otherwise, where a type-II optimal normal basis exists, the recurrence
        polynomial f_n (f_0 = 1, f_1 = t + 1, f_(i+1) = t f_i + f_(i-1)),
        accepted only if irreducible, with t normal and multiplication
        complexity exactly 2n - 1; otherwise the lowest-weight irreducible
        polynomial, least as an integer. The irreducibility check is the
        Ben-Or form of the Rabin test. Recorded per cell." On this card the
        cell named CELL-K17C in that quotation is CELL-K17.
      normal_element_rule: >-
        Quoted exactly: "A normal element w: t where the type-II rule was
        accepted, otherwise the least integer whose n conjugates are
        F_2-independent. Coordinates by the inverse of the basis matrix
        computed by Gauss-Jordan elimination; Frobenius is the cyclic shift of
        the coordinate vector."
      curve: >-
        y^2 + x y = x^3 + A x^2 + B over the field of the cell, with A and B
        field elements encoded as above; its group of rational points E is the
        affine points (x, y) and the point at infinity. Koblitz cells have
        A = 0, B = 1.
      point_mass: The uniform distribution on the affine points of E (the point at infinity carries no mass).
      cells:
        - {id: CELL-K13, curve: 'Koblitz (A = 0, B = 1)', n: 13, field: by DF-8}
        - {id: CELL-K17, curve: 'Koblitz (A = 0, B = 1)', n: 17, field: 't^17 + t^3 + 1'}
        - {id: CELL-K19, curve: 'Koblitz (A = 0, B = 1)', n: 19, field: 't^19 + t^5 + t^2 + t + 1'}
        - {id: CELL-K23, curve: 'Koblitz (A = 0, B = 1)', n: 23, field: by DF-8}
        - {id: CELL-K41, curve: 'Koblitz (A = 0, B = 1)', n: 41, field: by DF-8}
        - {id: CELL-O19, curve: 'A = 46693, B = 306147', n: 19, field: 't^19 + t^5 + t^2 + t + 1'}
        - {id: CELL-RC1, curve: 'A = 97044, B = 126251', n: 17, field: 't^17 + t^3 + 1'}
        - {id: CELL-ZL13, object: 'Z/lZ, l the largest prime divisor of the group order of CELL-K13'}
        - {id: CELL-ZL19, object: 'Z/lZ, l the largest prime divisor of the group order of CELL-K19'}
        - {id: CELL-ZL23, object: 'Z/lZ, l the largest prime divisor of the group order of CELL-K23'}
        - {id: CELL-Z2, object: 'Z/2^17Z', alphabets: '8, 16, 32, 64, 128'}
      rule_R_M: >-
        Quoted exactly: "Rule R-M: M = 2^r with r = floor(log2(N) / p + 1/2),
        p = 3 for the N^(1/3) arm and 4 for the N^(1/4) arm, with N = l, the
        largest prime divisor of the cell's group order". Applied, with
        p = 3 and p = 4, to CELL-K13, CELL-K19, CELL-K23, CELL-O19, CELL-ZL13,
        CELL-ZL19 and CELL-ZL23 (for a CELL-ZL cell the group order is l).
      fixed_alphabets: >-
        M = 16 on CELL-K13, CELL-K19, CELL-K23 and CELL-K41; M = 548 and
        M = 956 on CELL-K17; M in 8, 16, 32, 64, 128 on CELL-Z2. A fixed
        alphabet that coincides with an R-M alphabet of the same cell is one
        row.
      rule_R_S: >-
        Quoted exactly: "Rule R-S: S = 2^ceil(log2(128 M^2)), mean occupancy
        at least 128 per conditioning cell and at or above 100 x M^2."
      label_families: >-
        Quoted exactly: "On a Koblitz cell at alphabet M = 2^r ... F1, the
        normal-basis Hamming weight of x in M quantile classes (the mid-CDF of
        Binomial(n, 1/2)); F2 at offsets 0, floor((n - r)/2), n - r, a cyclic
        window of r normal-basis coordinates of x; F3 at the same offsets, a
        window of r polynomial-basis coordinates of x; F4, the leading r
        coordinates of the least cyclic rotation of x's normal-basis vector
        (the Frobenius-canonical representative)". "On the ordinary cell, F2
        and F3 at the three offsets". The label of an affine point P = (x, y)
        is a function of x alone. The ellipsis marks one omitted family that
        is not in scope of this card.
      coset_purity: >-
        For a cell with group E, a label h on the affine points, and a
        subgroup H of E: a label class is the set of affine points with one
        value of h; the class is H-pure if every point P in it lies in the
        same coset P + H. purity_H(h) is the total point_mass of the H-pure
        classes. purity_2 takes H = 2E = {2Q : Q in E}; purity_4 takes
        H = 4E = {4Q : Q in E}.
      deployed_prime: 680564733841876926932320129493409985129
      deployed_prime_note: a prime of 129 bits; you may verify primality but need not
      rho: rho = log2 sqrt(pi l / (4 x 131)), with l the deployed prime. Compute it; it is given by its formula only.
      ceiling_model: >-
        Quoted exactly: "THE IDEAL k-LIST MODEL ... k = 2^j lists of size
        L = N^(1/(j + 1)); per-attempt cost k L; B = L; relations B without
        orbit unknowns and B/262 with them; linear algebra k R^2; total
        R k L + k R^2". "DECLARED AMBIENT: the TARGET SUBGROUP of order l,
        N = l." Here R is the number of relations (B, or B/262 with orbit
        unknowns) and l is the deployed prime.
      threshold_rule: >-
        Quoted exactly: "For each k, the largest per-level gain g*_k (log2 G)
        at which the ideal k-tree of the ceiling model, run with gain G at
        each of its j - 1 internal levels, keeps its total at or above matched
        rho, in the table's declared ambient (N = l). With gain G the main
        term is log2 R + log2(k L) + (j - 1)(log2 L - log2 G); the condition
        is 2^main + 2^LA >= 2^rho. c_k = g*_k / 129.0000, so the condition
        reads G <= l^(c_k). A tree whose total at G = M already lies above rho
        is unconstrained (g* = log2 L)." Matched rho is the rho of this card;
        LA is the linear-algebra term k R^2 in bits.
      k_values: [4, 8, 16, 32]
      orbit_switch: [without, with]
    Q0:
      name: undetermined choices
      definition: >-
        Every point at which the definitions above left you a choice. Examples
        of the kind meant, not a complete list: the reading of F1's "M quantile
        classes (the mid-CDF of Binomial(n, 1/2))"; the order of the
        normal-basis coordinates (which coordinate is index 0) and the
        direction of a cyclic window; which end of the least rotation is
        "leading"; the bit order of a polynomial-basis window; whether the
        type-II rule is accepted at each n; the reading of "G = M" in the
        threshold rule; real against rounded arithmetic. For each, quote the
        text, list the admissible readings, state the reading you used, and
        say which quantities depend on it (and, where cheap, by how much).
      report: A list. An empty list is a result and must be stated as such.
    Q1:
      name: orders, alphabets and the sample table
      definition: >-
        For every cell in parameters.cells except CELL-Z2: the group order,
        its full factorisation, N = its largest prime divisor and log2 N. For
        every cell to which rule_R_M applies: r and M for p = 3 and p = 4. For
        every (cell, M) row, R-M and fixed alphabets alike, and for the CELL-Z2
        grid: log2(128 M^2), log2 S and S by rule_R_S. For each Koblitz cell
        and CELL-O19, the field polynomial used and the normal element w.
      report: >-
        A table per cell (order, factorisation, N, log2 N to four decimals)
        and a table per (cell, M) (r where applicable, M, log2 S, S). State
        the method you used for each order and an independent second check.
    Q2:
      name: coset purities of the label families
      definition: >-
        purity_2 and purity_4 of every label of label_families on CELL-K13,
        CELL-K19 and CELL-K23: F1 to F4, with F2 and F3 at each of their three
        offsets, at every alphabet Q1 assigns the cell (its two R-M alphabets,
        and the fixed alphabet 16 where it differs). purity_2 of F2 and F3 at
        each of their three offsets on CELL-O19 at its two R-M alphabets.
      method: >-
        Exhaustive over all affine points for n at most 19. At n = 23,
        exhaustive, or at least 10^6 points drawn from point_mass with the
        standard error of each purity stated.
      report: >-
        One row per (cell, family, offset, M): the number of non-empty label
        classes, purity_2, purity_4 (Koblitz cells only), and whether the row
        is exhaustive (exact fraction and decimal to 1e-9) or sampled (sample
        size, seed, estimate and standard error).
    Q3:
      name: threshold table
      definition: >-
        For each k in k_values and each orbit_switch value, under ceiling_model
        and threshold_rule with N = l: j, log2 L, log2 R, the main term at
        G = L, LA, rho, g*_k and c_k, and whether the row is unconstrained.
        For each orbit_switch value, name the row with the smallest c_k.
      report: A table of the eight rows with every value to four decimals (bits for logarithms), and the named row per orbit line.
    reporting_precision: >-
      Q1 exact integers; Q2 exact fractions with decimals to 1e-9 on
      exhaustive rows, estimate and standard error on sampled rows; Q3 four
      decimals. You are given no agreement tolerance because you compare
      nothing.
    rules:
      - BL-1 Read only the four whitelisted repository paths. Every other repository path is out of scope.
