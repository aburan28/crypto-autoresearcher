handoff:
  id: TASK-20260728-007
  from: coordinator
  to: red-team
  goal_id: GOAL-SSI-001
  batch_id: BATCH-002
  objective: >-
    Try to falsify the BATCH-002 derivation: its regime split, its cost
    bookkeeping, the well-definedness of its low-memory collision-search
    analogue, and the matched-baseline recommendation it emits.
  inputs:
    - The verified TASK-20260728-006 snapshot receipt and the committed producer artifacts it binds
    - RT-20260725-503 required_scope_fixes, which this derivation was dispatched to discharge
    - IDEA-20260725-001, EV-SSI-001, DEC-20260725-002
  constraints:
    - >-
      INDEPENDENT SESSION REQUIRED, not sharing a conversation lineage with
      TASK-20260728-005 or with RT-20260725-503. DEC-20260725-002 records
      BATCH-001's weakened independence as a named limitation; repeating it is a
      defect, not a formality. If independence cannot be achieved, record that
      fact rather than proceeding silently.
    - >-
      Review only durable committed artifacts. Verify the snapshot commit's
      reachability, parent, exact changed-path set, and hashes yourself, and
      record what you verified and what you did not.
    - Distinguish absence of evidence from impossibility.
    - ZERO CURVE COMPUTE. Do not run isogeny, curve, or graph computations to check the derivation.
    - Change no producer artifact, no ledger record, and no official state.
    - Record requested policy, resolved model, fallback status, and independence status.
  deliverables: [red_team_report.yaml, falsification_review.md]
  artifact_paths:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-002/reviews/TASK-20260728-007/red_team_report.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-002/reviews/TASK-20260728-007/falsification_review.md
  archived_by: TASK-20260728-008
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 1200
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
    - >-
      R1 States whether the F_{p^2} and F_p regimes are genuinely separated or
      blended, and whether RT-20260725-503 objection F2 is discharged.
    - >-
      R2 Checks that one cost convention is applied identically to MITM, the
      low-memory analogue, and Delfs-Galbraith, and names any asymmetric charge.
    - >-
      R3 Checks every asserted exponent, constant, and bound for an archived
      source or an in-note derivation, and names any figure that is neither.
    - >-
      R4 Gives an independent verdict on the low-memory analogue: well-defined as
      specified, well-defined only under an uncharged oracle or nonstandard
      access, or falsified. Checks the walk law, the distinguished-point
      predicate, the collision-to-path reconstruction, and the any-collision
      versus golden-collision accounting.
    - >-
      R5 States whether the matched-baseline recommendation is decision-relevant
      or documentation-only, and whether the derivation overclaims relative to its
      evidence tier.
    - >-
      R6 Gives its own verdict on new_attack_mechanism_detected, independent of
      the producer's, and states explicitly whether anything in BATCH-002 could
      satisfy a GOAL-SSI-001 completion criterion.
    - >-
      R7 Enumerates all fatal and nonfatal objections with IDs; every surviving
      element has a bounded next gate or is recorded as closed on the exact tested
      scope.
    - R8 Records its snapshot verification result and its own independence and model-resolution status.
  authorized_by: DEC-20260725-002
  recorded_by: coordinator
  recorded_at: '2026-07-28'
