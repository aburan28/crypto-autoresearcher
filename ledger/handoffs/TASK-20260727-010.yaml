handoff:
  id: "TASK-20260727-010"
  from: "coordinator"
  to: "executor"
  goal_id: "GOAL-CRYPTO-001"
  authorized_by: "DEC-20260727-002"
  objective: >-
    Execute the frozen EXP-SEMAEV-002 protocol exactly as specified and produce the immutable
    run records and execution report it requires. Experiment title: Exhaustive computational theorem-check of the full-box target-sectioned Semaev
    Newton polytope claim at m = 3 and m = 4 with exceptional-target classification.
  uncertainty_reduced: >-
    Computationally verify the corner-coefficient induction claim of IDEA-20260723-006
    in its base cases: for m in {3, 4} over several small prime fields (4 primes per m),
    enumerate ALL targets t in F_p, compute the target-sectioned Newton polytope of
    f_{m,t} = S_m(x_1,...,x_{m-1}, t) symbolically and exactly, classify every target as
    SATURATED (full box [0, 2^(m-2)]^(m-1)) or EXCEPTION (lost box vert
  inputs:
    - "experiments/EXP-SEMAEV-002/specification.yaml (status approved, frozen: true; do not change)"
    - "ledger/hypotheses/H-SEMAEV-002.yaml (status approved; do not change)"
    - "ledger/proposals/IDEA-20260723-006.yaml (context; do not change)"
    - "AGENTS.md, docs/task-lifecycle.md, docs/evidence-and-reproducibility.md, docs/claims-and-verification.md"
  constraints:
    - "The protocol is frozen. Any change requires a versioned protocol_amendment under experiments/EXP-SEMAEV-002/amendments/ approved by the Coordinator; runs already executed are never re-scored against an amended criterion."
    - "Every run needs a manifest with exact command, git commit and dirty state, environment, seeds, stdout, stderr, raw results, validity status, timestamps, and resource measurements."
    - "claim_tier is toy: no conclusion above that tier; infrastructure failure is never evidence against the hypothesis (AGENTS.md rule 5)."
    - "Stopping and invalidation rules of the specification are binding; a timeout, crash, or implementation failure is reported as such, never as a result."
  deliverables:
    - "All artifacts enumerated in experiments/EXP-SEMAEV-002/specification.yaml required_artifacts (per-run manifest.yaml, command.txt, environment.json, raw.json, summary.json, stdout.txt, stderr.txt)"
    - "experiments/EXP-SEMAEV-002/execution-report.yaml"
  artifact_paths:
    - "experiments/EXP-SEMAEV-002/specification.yaml"
    - "experiments/EXP-SEMAEV-002/runs/"
    - "experiments/EXP-SEMAEV-002/execution-report.yaml"
  write_scope:
    - "experiments/EXP-SEMAEV-002/"
  archived_by: "TASK-20260727-903"
  inference:
    policy: "executor-implementation"
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 6300
    memory_gb: 4
    maximum_runs: 4
  completion_gate:
    - "Exactly 4 planned runs reach a terminal status (completed_valid, completed_invalid, failed_infrastructure, failed_implementation, resource_exhaustion, cancelled_by_budget)."
    - "Every required artifact in the frozen specification exists and is schema-valid."
    - "Validation checks pass: expected run count, no duplicated or missing seeds, raw/summary agreement, control comparability, no unrecorded protocol deviation."
    - "No claim above claim_tier toy; no status of any ledger record changed by the Executor."
  return_format: "Immutable run records per required_artifacts plus execution-report.yaml."
