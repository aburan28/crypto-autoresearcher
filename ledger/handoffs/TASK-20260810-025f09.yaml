handoff:
  id: TASK-20260810-025f09
  from: coordinator
  to: executor
  goal_id: GOAL-MCE-001
  batch_id: BATCH-73a1b7
  question_id: RQ-MCE-e65b3c
  idea_id: IDEA-20260808-3d3be9
  authorized_by: DEC-20260810-4eae48
  recorded_at: '2026-08-10'

  objective: >-
    Build this program's OWN instrument and its NULL CONTROLS for square-code
    distinguishing statistics at Classic McEliece's ISO-scoped parameter sets,
    by executing IDEA-20260808-3d3be9's minimal_test as written. Concretely:
    compute the Schur-square dimension of the public code's dual,
    dim (C-perp)^{*2}, and its defect against the generic value
    min(n, C(m*t + 1, 2)), on real public keys at each ISO-scoped set; run the
    IDENTICAL computation on a matched uniform-random [n, k] code (null 1) and
    on a constructed high-rate alternant code where the defect must be nonzero
    (null 2, the POSITIVE CONTROL); and report the defects and the saturation
    profiles.

  uncertainty_reduced: >-
    Whether this program can measure a public-key-computable distinguishing
    statistic at deployed Classic McEliece parameters at all, and whether the
    instrument it builds can be shown to FIRE on an object where the effect is
    expected -- i.e. whether a future null result from it would mean anything.
    Today the program has NO measured distinguishing statistic at these
    parameters, only unread corpus entries; every statement it could make about
    a distinguishing claim in this regime would rest on transcription it has not
    made. This task replaces that with an artifact any reviewer can regenerate.

  why_now: >-
    ITS VALUE WENT UP, NOT DOWN. On 2026-08-10 a third party claimed a
    quasipolynomial-time distinguisher for Goppa--McEliece in the asymptotic
    Classic McEliece regime (KN-LIT-7baf07, iacr:2026/1630) -- a regime that,
    per DEC-20260810-4eae48 D-3, the filed square-code/high-rate distinguisher
    line (KN-LIT-13a01d, superseded on tags by KN-LIT-3c9f21) does NOT reach.
    docs/inventor-protocol.md's "controls before belief" makes any reported
    signal an artifact until the identical measurement has been run against a
    null object of the same shape. Running the PUBLISHED POLYNOMIAL-TIME
    statistics at the ISO-scoped sets against matched nulls establishes exactly
    that null-object control -- the baseline against which any claim in this
    regime, from anyone, must eventually be read. It does this WITHOUT reading,
    implementing, or assessing 2026/1630, which is a separate and currently
    blocked problem (DEC-20260810-4eae48 NA-2).

  inputs:
    - ledger/proposals/IDEA-20260808-3d3be9.yaml
    - ledger/questions/RQ-MCE-e65b3c.yaml
    - ledger/goals/GOAL-MCE-001/goal.yaml
    - ledger/decisions/DEC-20260810-4eae48.yaml
    - ledger/corrections/CORR-20260810-c487ff.yaml
    - knowledge/literature/KN-LIT-84b674.md
    - knowledge/literature/KN-LIT-7baf07.md
    - docs/claims-and-verification.md
    - docs/inventor-protocol.md
  inputs_note: >-
    KN-LIT-7baf07 is supplied for CONTEXT ONLY -- so the Executor knows why this
    task is being run now. It is a literature entry whose citation only is
    verified, about a paper nobody here has read. NOTHING in it is to be
    implemented, reproduced, tested, or referred to in any measurement, and no
    deliverable of this task may cite it as a source for a statistic, a
    parameter, or a claim. KN-LIT-84b674 (the Classic McEliece specification, at
    sha256 dcc68788...) is the authority for parameters and key format.

  constraints:
    - >-
      THIS TASK ESTABLISHES A BASELINE AND A CONTROL ONLY. It implements NOTHING
      from iacr:2026/1630, which this program HAS NOT READ. It claims no break.
      It produces NO statement about Classic McEliece's security in either
      direction, and no deliverable may contain one.
    - >-
      POSITIVE CONTROL FIRST, AND IT IS A HARD GATE. Run null 2 -- the
      constructed high-rate alternant code where the defect must be nonzero --
      BEFORE the real keys, and DO NOT run the real keys until it fires. A
      negative result from an instrument never shown to produce a positive is a
      fatigue report, not evidence (docs/inventor-protocol.md, "controls before
      belief"). If it does not fire, STOP, report that, and draw no conclusion
      in either direction.
    - >-
      GENERIC-BOUND CONTROL. Verify the generic value min(n, C(m*t + 1, 2))
      against null 1 at several (n, k) BEFORE interpreting any defect. A nonzero
      reading on a uniformly random code means the generic bound is
      mis-implemented, which IDEA-20260808-3d3be9 names as the single most
      likely bug.
    - >-
      CONVENTION CONTROL. Fix and STATE whether C * C is taken to contain C
      (over F_2 every x satisfies x*x = x, so the convention changes the bound).
      Report BOTH conventions rather than silently choosing one. Likewise report
      all four variants of "which code to square" (public code, its dual, and a
      shortening of either) rather than picking one -- the published statements
      differ.
    - >-
      KEY-INDEPENDENCE CONTROL. At least 10 independently generated keys per
      set. A defect that appears on one key and not others is a WEAK-KEY
      observation and a completely different claim from a family-wide one; it
      must be reported as such and never generalised.
    - >-
      SCOPE OF PARAMETER SETS: the ISO-scoped sets, per
      GOAL-MCE-001.scheme_context, which records that the ISO set list contains
      no mceliece348864 variant. State explicitly which sets were run and which
      were not.
    - >-
      KEY PARSING IS A DECLARED HAZARD, NOT AN INCIDENTAL DETAIL. Classic
      McEliece's public key is a systematic matrix with the identity block
      omitted; reconstruct the full parity-check matrix EXACTLY per
      KN-LIT-84b674's specification or the code being squared is not the public
      code. The 6960119 set has n not a multiple of 8 and a documented last-byte
      convention; a mis-parsed key silently becomes a different code. Include a
      parse-verification step (e.g. re-derive a published KAT value) and report
      its outcome.
    - >-
      RQ-MCE-e65b3c's TOY CLAIM-TIER CEILING IS BINDING and this task does not
      relax it. "Distinguisher is not break" binds in BOTH directions: a
      measured zero defect is a statement about ONE statistic on ONE family of
      keys and is NOT a security claim about Classic McEliece.
    - >-
      A NONZERO DEFECT ON REAL KEYS IS AN IMMEDIATE STOP-AND-ESCALATE, NOT A
      RESULT TO PUBLISH FROM THIS TASK. Record it, halt, and route it to the
      Coordinator for independent review under AGENTS.md rule 12. Do not
      characterise it, do not extend it, and do not write it into any summary
      as a finding.
    - >-
      OBSERVATIONS ONLY. The Executor records what was measured. It does not
      change any hypothesis, question, goal, or evidence record, does not write
      to ledger/, does not promote anything into knowledge/, and does not
      commit. All writes go under the task's own artifact_paths.
    - >-
      A TIMEOUT, CRASH, DEPENDENCY FAILURE, OR INABILITY TO OBTAIN A REFERENCE
      IMPLEMENTATION OR KAT KEYS IS INFRASTRUCTURE SIGNAL AND IS NEVER NEGATIVE
      MATHEMATICAL EVIDENCE (AGENTS.md rule 5). Record the routes tried and
      their exact outcomes and stop; do not substitute, estimate, or
      reconstruct a missing number.
    - >-
      NEVER FABRICATE a command, output, timing, statistic, or run. Missing data
      stays missing and is reported as missing (AGENTS.md rule 9).
    - >-
      DO NOT attempt to fetch iacr:2026/1630 or iacr:2026/1232 by any route.
      Both PDF endpoints are recorded as blocked (path-scoped, reproducible) and
      circumvention is forbidden. Acquisition is a separate action
      (DEC-20260810-4eae48 NA-2) and is not part of this task.
    - >-
      GATE-B, carried forward from DEC-20260809-cb25a0 and still binding on
      every task in BATCH-73a1b7: report what surrounds any quotation, or state
      that the surrounding text was not read.

  deliverables:
    - >-
      An implementation of the statistic and its nulls, with exact commands,
      seeds, environment and dependency versions recorded per AGENTS.md
      "Artifact policy".
    - >-
      A results table: for every (parameter set) x (object: real key / null 1 /
      null 2) x (which-code-squared variant) x (C*C convention), the exact
      integer dim of the Schur square, the generic bound, and the defect.
      Exact integers, never approximations.
    - >-
      Saturation profiles: product count at saturation per object, reported
      alongside the final dimensions, since IDEA-20260808-3d3be9 predicts the
      profile may separate objects the final dimension does not.
    - >-
      A CONTROLS REPORT stating, per control, whether it fired: positive control
      (null 2 defect strictly positive), generic-bound control (null 1 defect
      zero), convention control (both conventions reported),
      key-independence control (>= 10 keys per set, per-key values shown).
    - >-
      A key-parsing verification note recording how the full parity-check matrix
      was reconstructed and how the parse was checked, with the 6960119
      last-byte convention handled explicitly.
    - >-
      A source-access log for every artifact fetched (reference implementation,
      KAT vectors, specification), with URL, HTTP status, byte count and sha256,
      or the exact failure if blocked.
    - >-
      An execution report containing the FULL break-attempt log for the
      implementation: every case tried to make the measurement produce a wrong
      answer, INCLUDING cases tried and found not to break it and cases tried
      and abandoned. If any part is reconstructed from notes rather than logged
      live, MARK IT AS RECONSTRUCTED. (This is the GATE-A discipline
      GOAL-MCE-001 has already paid for once; see DEC-20260809-769359.)
    - >-
      An explicit interpretation-limits section restating that this is a
      baseline and control only, that it implements nothing from 2026/1630, and
      that it asserts nothing about Classic McEliece's security.

  artifact_paths:
    - coordination/goals/GOAL-MCE-001/batches/BATCH-73a1b7/tasks/TASK-20260810-025f09/
  write_scope:
    - coordination/goals/GOAL-MCE-001/batches/BATCH-73a1b7/tasks/TASK-20260810-025f09/
  write_scope_note: >-
    NON-OVERLAPPING AND EXCLUSIVE. The Executor writes nowhere else. In
    particular it does not write to ledger/, knowledge/, experiments/, tools/,
    or any other task's directory, and it does not edit dispatch_queue.json --
    the Coordinator does that.
  archived_by: null
  archived_by_note: >-
    NOT YET ASSIGNED. A snapshot archival task must be minted by the Coordinator
    and run ALONE, before any independent review, per AGENTS.md "Durable
    research commits". Nothing this task produces is durable evidence until that
    commit is made, pushed, and accepted by the post-commit verifier. The
    Executor does not commit.

  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
    independent_session_note: >-
      false because this is a PRODUCER task, not a review. The independent
      session requirement attaches to the reviewer that must follow it before
      any of its numbers are interpreted (see completion_gate item 12 and
      DEC-20260810-4eae48 NA-3).

  budget:
    wall_clock_seconds: 5400
    memory_gb: 8
    maximum_runs: 200
  budget_note: >-
    Sized from IDEA-20260808-3d3be9's own estimate (compute order 10^3
    core-seconds; peak storage a few megabytes for the reduced basis, so 8 GB is
    generous headroom for key generation and the product buffer). maximum_runs =
    200 covers, with margin, 4 ISO-scoped-set slots x (10 real keys + 10 null-1
    codes + null-2 positive controls) plus re-runs of the convention and
    which-code-squared variants. NO FIELD IS NULL. An exhausted budget is
    reported AS an exhausted budget and never as a result; if the measurement
    cannot finish within it, stop and report what completed, with the per-object
    timings.

  completion_gate:
    - >-
      1. The POSITIVE CONTROL (null 2) fired -- strictly positive defect --
      BEFORE any real key was run, and the log shows that ordering. If it did
      not fire, the gate is satisfied instead by a report that says so, states
      that the instrument is blind, and draws NO conclusion in either direction.
    - >-
      2. The generic-bound control (null 1) returned zero defect at several
      (n, k), or the discrepancy is reported as a suspected implementation
      defect rather than as a measurement.
    - >-
      3. Both C*C conventions are reported, and all four which-code-squared
      variants are reported, for every object.
    - >-
      4. At least 10 independently generated keys per ISO-scoped set, with
      per-key values shown, not only aggregates.
    - >-
      5. Every reported number is an exact integer with the generic bound it is
      measured against printed beside it.
    - >-
      6. The key-parsing verification note exists and records an actual check
      (e.g. a KAT re-derivation), with the 6960119 last-byte convention handled
      explicitly and its outcome stated.
    - >-
      7. Exact commands, seeds, environment, dependency versions, stdout/stderr,
      timings and resource measurements are retained per AGENTS.md "Artifact
      policy", and the run manifest records requested_policy
      (executor-implementation), the resolved model identifier, and
      model_verified status -- with fallback_used and its reason if they differ.
    - >-
      8. The source-access log lists every fetch attempt with URL, HTTP status,
      byte count and sha256, or the exact failure text if blocked. No fetch of
      iacr:2026/1630 or iacr:2026/1232 appears in it.
    - >-
      9. The execution report contains the full break-attempt log including
      negative and abandoned attempts, with any reconstructed portion marked as
      reconstructed.
    - >-
      10. The deliverables contain NO statement about Classic McEliece's
      security, NO claim of a break or of its absence, and NO reference to
      2026/1630 as a source for any statistic, parameter or claim. An explicit
      interpretation-limits section says so.
    - >-
      11. If a nonzero defect appeared on any real key: the run HALTED at that
      point, the observation is recorded, and it is routed to the Coordinator
      for AGENTS.md rule 12 review rather than characterised in this task's
      deliverables.
    - >-
      12. All artifacts are written ONLY under the declared write_scope, the
      Executor made no commit, and the package is handed to the Coordinator for
      a snapshot archive to be followed by an INDEPENDENT reviewer session
      before any number in it is interpreted.

  return_format: >-
    A results table plus a controls report, both machine-readable (YAML or CSV
    beside a YAML index) under the declared write_scope, with a short prose
    summary that states what was measured, on which sets, under which
    conventions, which controls fired, what was not done, and what remains
    unknown. Report observations only; propose no conclusion, no status change,
    and no follow-on approval. If any part of the task could not be completed,
    say which part and why, and leave the corresponding cells EMPTY rather than
    estimated.
