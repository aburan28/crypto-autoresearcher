handoff:
  id: TASK-20261006-7d34e7
  from: coordinator
  to: validator
  objective: Independently rederive and adversarially validate both archived P-192 experiment results.
  uncertainty_reduced: Whether producer outcomes survive independent arithmetic, transcript, boundary, control, and scope checks.
  inputs:
    - experiments/EXP-SCURVE-29040c/specification.yaml
    - experiments/EXP-SCURVE-29040c/amendments/v1_to_v2.yaml
    - experiments/EXP-SCURVE-647ade/specification.yaml
    - experiments/EXP-SCURVE-647ade/amendments/v1_to_v2.yaml
    - experiments/EXP-SCURVE-29040c/runs/RUN-SCURVE-af5caf/
    - experiments/EXP-SCURVE-647ade/runs/RUN-SCURVE-81c5e4/
    - coordination/goals/GOAL-SCURVE-3e3cb4/batches/BATCH-00628c/archives/TASK-20261006-11f0a2/snapshot-receipt.json
  constraints:
    - Use an independent session and independent arithmetic/checker implementation; do not modify producer artifacts.
    - Recompute singular factor/order witnesses, seed/KDF/tag vectors, every nested residue, BSGS equation, and final replay.
    - Recompute the CM order/discriminant/roots, exact state count, theorem bound, relation HNFs, and map/payoff verdicts.
    - Missing orientation/maps/costs stays candidate-only; a CM null is scoped only to L<=2^48.
    - Preserve IMPLEMENTATION_WEAK versus valid-isogeny weakness separation.
  deliverables: &artifacts
    - coordination/goals/GOAL-SCURVE-3e3cb4/batches/BATCH-00628c/reviews/TASK-20261006-7d34e7/validation-report.yaml
    - coordination/goals/GOAL-SCURVE-3e3cb4/batches/BATCH-00628c/reviews/TASK-20261006-7d34e7/runtime-session-receipt.json
  artifact_paths: *artifacts
  read_scope:
    - experiments/EXP-SCURVE-29040c/specification.yaml
    - experiments/EXP-SCURVE-29040c/amendments/v1_to_v2.yaml
    - experiments/EXP-SCURVE-647ade/specification.yaml
    - experiments/EXP-SCURVE-647ade/amendments/v1_to_v2.yaml
    - experiments/EXP-SCURVE-29040c/runs/RUN-SCURVE-af5caf
    - experiments/EXP-SCURVE-647ade/runs/RUN-SCURVE-81c5e4
    - coordination/goals/GOAL-SCURVE-3e3cb4/batches/BATCH-00628c/archives/TASK-20261006-11f0a2
  write_scope:
    - coordination/goals/GOAL-SCURVE-3e3cb4/batches/BATCH-00628c/reviews/TASK-20261006-7d34e7
  archived_by: TASK-20261006-3d7ad9
  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: true
    fallback_note: Runtime-native backend substitution is permitted only at the full review-adversarial xhigh floor; no degradation is allowed.
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: null
    memory_gb: 16
    maximum_runs: 0
  completion_gate:
    - Every joint receives holds, breaks, or inconclusive with exact artifacts and commands.
    - Known-false controls are independently exercised and behave as preregistered.
    - Separate verdicts cover implementation recovery, CM algebra, map realization, and payoff.
  return_format: One immutable validation report and runtime independence receipt.
  review_plan:
    claim_under_review: >-
      Producer A claims fixed-seed recovery from the frozen x-only unchecked
      interface; Producer B claims a complete exact L<=2^48 relation
      classification and only such map/payoff conclusions as artifacts support.
    coordinator_prior: >-
      The implementation recovery will hold if the low-level path remains
      unchecked. The CM census will reproduce its counts and only scalar
      in-box relations; the symbolic C-degree relation will verify but fail payoff.
    joints:
      - joint: A-oracle-fidelity-and-sign-linkage
        assigned_to: TASK-20261006-7d34e7
        attack_plan: Recompute every tag from zx, mutate y/sign, and attempt independent factor signs; require exactly one global plus-or-minus class.
        breaking_artifact: A transcript showing y/full-point leakage, inconsistent tags, or more than the global sign pair.
      - joint: A-residual-bsgs-and-replay
        assigned_to: TASK-20261006-7d34e7
        attack_plan: Independently derive intervals, prove the shifted-center block union after final clipping, rebuild a BSGS checker, inject fingerprint collisions, and require exact [d]G=Q.
        breaking_artifact: A bounded counterexample or accepted hash collision yielding a wrong scalar.
      - joint: B-order-discriminant-and-boundary
        assigned_to: TASK-20261006-7d34e7
        attack_plan: Replay C Pocklington, derive fundamental D/conductor, and recompute roots/counts in a second enumeration order.
        breaking_artifact: A failed proof, wrong root, missing vector, or count mismatch.
      - joint: B-relation-certificate-and-map-payoff
        assigned_to: TASK-20261006-7d34e7
        attack_plan: Independently compose forms/HNFs, corrupt each certificate field, replay maps, and recompute raw HOT/COLD payoff inequalities.
        breaking_artifact: A hit that fails replay or a weakness label lacking a favorable explicit inequality.
    blindness:
      mutual: true
      lifted_for: []
      rationale: null
    proves_too_much:
      objects:
        - validated high-level P-192 ECDH, where singular inputs must be rejected
        - D=-23 g2^3 non-scalar relation, which must be detected
        - symbolic P-192 C-degree relation, which must verify but fail buildability/payoff
      failure_signature: >-
        Recovery must fail on validated ECDH; the CM verifier must accept both
        algebra controls while refusing to call the C-degree edge a weakness.
      assigned_to: TASK-20261006-7d34e7
    blind_rederivation:
      required: true
      quantity: Seed/tag vectors, residue class, final d, CM roots/counts, relations, and payoff classifications.
      assigned_to: TASK-20261006-7d34e7
      blind_from:
        - producer implementation source while constructing independent checkers
        - producer narrative conclusions until numerical rederivation is sealed
  dispatch_preconditions:
    - TASK-20261006-11f0a2 receipt verifies and binds both result sets.
