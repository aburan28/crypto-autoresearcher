  constraints:
    - >-
      DA-1 ADDITIVE. Write one new file. Do not edit specification.yaml,
      AMD-20260916-bands.yaml or any implementation, run or ledger file (D10).
    - >-
      DA-2 Model the file's top-level shape on AMD-20260916-bands.yaml (id,
      experiment_id, recorded_at, kind additive_protocol_amendment,
      supersedes_fields, does_not_rewrite, cites, defect, change, authorization,
      non_claims), and add every field approval requires. That means controls,
      metrics, budget, stopping rules, invalidation rules, required artifacts, a
      decidable success criterion with at least one negative outcome, a
      falsification criterion, interpretation limits, and a proof_search_map
      whose audits are filled or carry a not_applicable_reason.
    - >-
      DA-3 APPROVAL GATE IN THE FILE. Set status review_required and an approval
      block stating that the amendment is approved if and only if
      DEC-20260923-a4c3d5 is official with decision approve naming
      AMD-EXP-AUXIN-7e2e3d-20260923-d1d10. Nothing in the file is edited
      afterwards.
    - >-
      DA-4 CONTROLS FULLY DECLARED (D5). Each control recipe states search
      start, step order, primality test, acceptance rule, window and
      tie-breaks, so that it is determined by the text alone. Include a planted
      r + 1 positive control at deployed size and an inert-on-both-branches
      control (the TASK-20260922-0e10d1 PTM-2 construction), and state any other
      control the design needs. Do NOT state the integers the recipes produce;
      the reviewers compute them.
    - >-
      DA-5 CALIBRATION (D4). Either (a) a null arm of random primes with frozen
      sampler, size and seed runs in the same run BEFORE any deployed row is
      scored, and every threshold is a pre-registered function of that arm or of
      declared constants; or (b) escalate semantics are removed and the table is
      descriptive with the null arm reported beside it. No threshold may
      reference a deployed-row value.
    - >-
      DA-6 TYPED COSTS (D2) and PREDICATE (D3) per DEC-20260923-ce06a6 and
      CORR-20260923-187ea3, with the input model and bits of d on every row.
      Labelling per D9.
    - >-
      DA-7 TOOLS (D6, D7). Name the ECM-capable factoring backend and the
      certificate library and verifier with versions, and state an admission
      gate. The executor verifies their availability before any run, and
      absence is an infrastructure stop, never a silent substitution.
    - >-
      DA-8 NO CENSUS VALUE, minimising divisor, escalated-curve list or
      BATCH-ba0b0d reviewer finding value anywhere in the amendment or the
      report. Cite records by id.
    - >-
      DA-9 No Cheon run, no [x^i]P, no supply audit inside the amendment, and no
      vulnerability, weak-curve, safe-curve, deployed-system or ordinary-ECDLP
      sentence (plan tripwire T1).
    - >-
      DA-10 If the design finds that H-AUXIN-66e6fd's statement must change to be
      typed, do NOT write a new hypothesis. Put a
      hypothesis_restatement_proposal in the design report; composition decides
      under key K-hypothesis.
    - DA-11 ZERO RUNS. This role holds no shell; nothing is computed.
