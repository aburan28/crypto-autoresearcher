        wrapper before it admits G2, and its complete output is quoted
        verbatim in execution-report-v2-r1.yaml whatever it finds (RC-7).
        Any post-gate package runs only when G1..G4 each have run_status
        completed_valid with gate_pass true AND REG-1 passed (R-7).
