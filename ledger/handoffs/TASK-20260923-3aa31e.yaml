          layer is not behaviour-neutral at 4111, or the pipeline is
          non-deterministic", naming both, never as a result.
        - A failure of G1..G4 ends the stage at the gate, classified per
          DEC-20260923-e788a1 AC-5 unchanged: a mismatch confined to raw_u =
          384 or S3_rescaled = 64 is "implementation or derivation"; anything
          else is an infrastructure or implementation signal.
        - Neither is ever a mathematical result about the quotient. No
          contingency id is ever used for a gate package. The repair of a
          repair is a successor task under a new Coordinator decision, not a
          re-iteration inside this card.
    - id: R2-3
      text: >-
        MEMORY ENVELOPE, MACHINE PROTECTION (AC-1; RC-10), identical to v2:
        child RLIMIT_AS 10737418240 set in the child and read back with
        getrlimit into each manifest; a child that cannot set it refuses to
        start; driver RSS at most 1 GiB, checked before each launch; one
        memory-heavy process at a time; task envelope at most 11 GiB; msolve
        -t 1; the lowered cap if the dispatcher's guard threshold is below
        12.0 GB, recorded; the full A-6 envelope tuple on every not_measured
        row; the A-7 pre-declared early stop. Watchdogs are exactly
        trial-plan-v2.json's (R-9).
    - id: R2-4
      text: >-
        LAUNCH RULE (PS-5; CORR-20260923-fb1be8 XD-2). Each package is
        launched directly through the r1 wrapper with no outer guard (no
        shell `timeout`, no wrapper around the wrapper) that the plan does
        not declare. The dispatching session's memory guard is declared in
        the task receipt before launch, with its threshold.
    - id: R2-5
      text: >-
        SEGMENTS. The stage runs in segments, each a contiguous run of
        packages in plan order: segment 1 is the gate (G1, REG-1, G2, G3,
        G4); later segments are contiguous blocks of post-gate packages. At
        each segment boundary the Executor appends a progress checkpoint to
        execution-report-v2-r1.yaml (packages completed, their statuses, the
        next package id) and may renew the lane claim at epoch + 1. A segment
        never reorders, skips or repeats a package, and a checkpoint is never
        a result. On a wall-clock or claim expiry the Executor records every
        planned package not yet run as not_attempted with the reason, and
        returns.
    - id: R2-6
      text: >-
        TIMEOUTS, OOM, CRASHES, positive_dimensional and
        degenerate_parametrisation outcomes are recorded with their class and
        envelope tuple. They are never measured non-decompositions or
        evidence about D (AGENTS.md core rule 5; EC-7).
    - id: R2-7
      text: >-
        MANIFESTS (PS-5 manifest; RC-2; RC-3). Each records: task_id
        TASK-20260923-3aa31e (never TASK-20260923-cd932c or
        TASK-20260923-6c7f55); protocol_version "2-r1"; the v2 amendment and
