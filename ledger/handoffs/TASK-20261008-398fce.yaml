  title: Snapshot archive, as produced, of TASK-20261008-9456e8's outputs (EXP-PFDR-0b3699 RA-04 to RA-06; appended notes; continuation report)
  objective: >-
    Commit, alone and by exact path, every artifact TASK-20261008-9456e8
    produced, whatever its status, so that the complete run package is
    durable and content-bound before any validator, red team or Coordinator
    validity reading. No interpretation, no repair, no status change.
  uncertainty_reduced: >-
    Whether the continuation outputs are complete, hash-bound and published,
    and whether everything beneath them is unchanged. That covers the 5ea531
    package (with the one permitted append), the engine, the pins and the
    amendment.
  inputs:
    - ledger/handoffs/TASK-20261008-9456e8.yaml (its artifact_paths are this card's scope)
    - experiments/EXP-PFDR-0b3699/amendments/AMD-20261008-9c080d.yaml (A-4, A-5, A-6)
    - experiments/EXP-PFDR-0b3699/execution-report-9456e8.yaml (stop point; read by key)
    - coordination/design/TASK-20260928-102217/archives/TASK-20261008-5ea531/snapshot-receipt.json
    - coordination/design/TASK-20260928-102217/archives/TASK-20261008-5e4188/snapshot-receipt.json
    - coordination/design/TASK-20260928-102217/archives/TASK-20261008-6f12b8/ledger-receipt.json
  constraints:
    - >-
      RUN ALONE. Run only after all of the following:
      - TASK-20261008-9456e8 has returned (any status);
      - its session has ended;
      - its claim is released.
      No other archival task is running. No review agent has read the
      package. Nothing for EXP-PFDR-0b3699 is running.
    - >-
      ORDER.
      (1) git diff --cached --name-only is empty.
      (2) git fetch, then merge origin/main (merge, never rebase). Record the
          base commit checked and the outcome. A conflict inside a run
          artifact or record is a STOP.
      (3) Run checks (a) to (i), then stage, commit, verify, push and refresh
          the PR.
    - >-
      FAIL-FAST AND RECEIPT IN THE SAME COMMIT. Every command block runs with
      set -euo pipefail, or with an explicit exit check after every command.
      The receipt's path list is computed, BEFORE staging, from the files at
      or under this card's artifact_paths that exist, never from git status.
      The receipt is written self-neutral, parsed and staged before the
      commit, and committed in the same commit. If any step after staging
      fails, nothing is committed. Check scripts write only to absolute
      scratch paths. git status is re-checked immediately before staging.
    - >-
      NO READING FOR MEANING. The top-level session hashes, sizes, lists,
      parses and compares by key name as the checks name. It records no
      count, total, kappa, z, outcome id or verdict in the receipt summary
      fields, the commit message or the PR text.
    - >-
      PRE-STAGING CHECKS, WITHOUT EDITING.
      (a) CUSTODY.
      (a1) The TASK-20261008-5ea531, -5e4188 and -6f12b8 receipts verify with
           tools/research_dispatch.py (content_at_commit).
      (a2) Every path the 5ea531 receipt binds has its recorded path_sha256,
           EXCEPT experiments/EXP-PFDR-0b3699/implementation-notes.yaml. That
           file passes the AMD A-6 rule instead:
           - git show
             051be4c86:experiments/EXP-PFDR-0b3699/implementation-notes.yaml
             (sha256
             3efcee6cb21f4b81ebf0bb4b48eef7a6f0dc9a03e4dca1788d4ac79ca5ff94b1)
             is an exact byte prefix of the working-tree file;
           - the whole file parses with yaml.safe_load;
           - the key continuation_9456e8 occurs exactly once, as a direct
             child of implementation_notes;
           - nothing outside that key differs from the archived parse.
           Record the prefix length, the appended byte count and the new
           sha256.
      (a3) The files committed by TASK-20261008-6f12b8 (DEC-20261008-ef482f,
           AMD-20261008-9c080d and the three cards) equal their 6f12b8
           path_sha256.
      Any other mismatch is a STOP.
      (b) ENGINE AND SCOPE.
      - Every file of src/crypto_autoresearcher/index_calculus/ and every
        tests/test_index_calculus_*.py equals its 5ea531-bound sha256 (for
        files the 5ea531 receipt binds) or its 38be58dad bytes (for the
        rest). No file is added.
      - Every working-tree change, untracked files included, lies at or
        under one of this card's first five artifact_paths. Anything else is
        a scope_finding and a STOP, reported, not staged and not deleted.
      - runs/RUN-PFDR-0b3699-repro-attribution/ must be absent; it is a STOP
        if present.
      - __pycache__ and .pyc: PREEXISTING_IGNORED under the same four
        conditions as TASK-20261008-5ea531 (b), with the mtime bound
        2026-10-02T19:51:50Z. Anything else is a STOP.
      (c) CHECKSUMS. Every attempt, run root and run directory that holds a
      manifest.yaml has a checksums.sha256 listing every file beneath it, and
      only those, with matching hashes.
      (d) STATE BY STOP POINT, as execution-report-9456e8.yaml records it.
      Exactly one branch must hold:
      - C0 STOPPED IN ORDER STEP (a): no new run directory;
        execution-report-9456e8.yaml may or may not exist;
        implementation-notes.yaml is either byte-equal to its 5ea531 sha256
        or carries only the re-verification part of continuation_9456e8.
      - C1 STOPPED AT RA-04: RUN-PFDR-0b3699-table/ exists with attempt
        directories; its run-root files exist iff the merge ran; no
        -calibrate/ or -analysis/ directory exists.
      - C2 STOPPED AT RA-05: the RA-04 root is finalized completed_valid or
        failed_infrastructure (never invalid), with row-verify.json and
        checks-report.json present; RUN-PFDR-0b3699-calibrate/ exists;
        continuation_9456e8.pins_calibration_json is absent (stop before the
        pin, recorded) or equals the sha256 of calibration.json; no
        -analysis/ directory exists.
      - C3 COMPLETE (RA-06 finalized) or STOPPED AT RA-06: pins_calibration_json
        equals the sha256 of RUN-PFDR-0b3699-calibrate/calibration.json, with
        a pinned_at earlier than RA-06's started_at; RA-06's command line (in
        command.txt or the A-9 argv list) carries that sha256;
        RUN-PFDR-0b3699-analysis/ exists; its manifest is present unless the
        report records a stop before finalize.
      Any state not listed is a STOP. Record the branch and each clause.
      (e) MANIFEST BLOCKS (AMD A-5). Every new manifest.yaml has:
      - experiment id EXP-PFDR-0b3699;
      - run.task_id TASK-20261002-8a6b8a and run.protocol.output_archive
        TASK-20261002-33afa9 (the pinned launcher's constants, expected);
      - a certificate block of kind none with instances_claimed 0 and
        instances_verified 0;
      - an inference block naming executor-implementation.
      No new manifest names a Bedrock provider; a disclaimer string is
      recorded, not failed. Record also that execution-report-9456e8.yaml
      names TASK-20261008-9456e8 as the executing task and
      AMD-20261008-9c080d as the protocol.
      (f) BLINDING KEYS (by key name only; no value is read or printed).
      Record:
      - whether RA-05's arm-read-log.json lists any arm other than
        random_sub_r0, random_sub_r1, random_sub_r2 and known_null_sub;
      - whether row-verify.json or checks-report.json contains a key named
        rows_checked, failed or failure_count;
      - whether merge-report.json contains a key named
        canonical_staircase_records.
      These are recorded for the Coordinator's validity check; they are not a
      stop.
      (g) VALIDATORS. Run tools/validate_ledger.py and
      tools/check_merge_hygiene.py on the merged head. Record exit codes and
      counts against origin/main's count. Lines naming a path this task
      stages must be exactly the DEF-1 line,
      "experiments/EXP-PFDR-0b3699/runs/<RUN>/manifest.yaml: run.code.command missing (not reproducible)",
      for each of RUN-PFDR-0b3699-table, -calibrate and -analysis whose
      run-root manifest exists, and nothing else. Record them as
      known_defect_lines (AMD A-4). Any other line naming a staged path, and
      any hygiene failure naming one, is a STOP.
      (h) SIZE. No staged file exceeds 95 MB. Record the total. If
      experiments/EXP-PFDR-0b3699/ exceeds 1.0 GB, STOP.
      (i) VALIDITY FACTS. Record-only, never a STOP, and with no measured
      value:
      (i1) per run root and attempt: whether raw-result.json parses, and
           whether its top-level status equals the manifest's;
      (i2) the per-run occurrence counts of the token "finalize" in
           command.txt and manifest.yaml;
      (i3) per run root and attempt, the earliest started_at and latest
           finished_at; also:
           - the archived pins_design_json pinned_at;
           - the continuation pins_calibration_json pinned_at;
           - whether design pin < earliest RA-04 start;
           - whether calibration pin < RA-06 start;
      (i4) whether execution-report-9456e8.yaml parses, and how many argv
           entries its A-9 list holds;
      (i5) whether any RA-04, RA-05 or RA-06 view-map.json lists a file
           outside experiments/EXP-PFDR-0b3699/ and experiments/EXP-PFDR-011cd0/
           (path names only).
      Any other mismatch or failure in (a), (b), (c), (d), (e), (g) or (h) is
      a scope_finding and a STOP. It goes to a Coordinator decision and is
      never fixed by editing an artifact.
    - >-
      STAGE ONLY the files at or under the first five artifact_paths that
      exist, plus this card's receipt, one by one with literal pathspecs;
      git add -A is forbidden. Never stage a ledger record, a shared tool
      file (tools/run_supersession_registry.yaml included; HU-4), a scratch
      file or a __pycache__ file.
    - >-
      One commit, containing the package AND the receipt. Its message names
      TASK-20261008-398fce, TASK-20261008-9456e8, DEC-20261008-ef482f,
      AMD-20261008-9c080d, EXP-PFDR-0b3699, H-PFDR-2765d2 and every RUN id
      staged, and carries no measured value, outcome id or verdict. A
      suitable message is "snapshot(TASK-20261008-398fce): archive
      EXP-PFDR-0b3699 continuation package of TASK-20261008-9456e8 as
      produced (DEC-20261008-ef482f; AMD-20261008-9c080d; H-PFDR-2765d2;
      <RUN ids>)", followed by the session's attribution lines.
      Verify the receipt with tools/research_dispatch.py. Push, and refresh
      the open PR naming the same ids. The PR's ledger gate is expected to
      report the DEF-1 lines (HU-4). Never re-run, skip or work around a
      check, and never merge a red head.
    - Archive as produced. A stopped, partial, checkpointed or invalid run set is archived with its status; it is not evidence and not negative evidence. Never drop, split or recompress an artifact.
    - No hypothesis, experiment, evidence or goal status changes; nothing under ledger/hypotheses/ is touched.
    - Never select a provider, backend, endpoint or model identifier containing Bedrock.
