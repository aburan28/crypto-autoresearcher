# =============================================================================
# TASK-20261008-398fce -- Coordinator-only SNAPSHOT ARCHIVE of the outputs of
# TASK-20261008-9456e8 (EXP-PFDR-0b3699 RA-04 to RA-06; protocol v2,
# AMD-20261008-9c080d), AS PRODUCED, whatever the status, before any
# independent review.
# Designed with the lessons of 33afa9 and 5ea531 in from the start:
#   - custody of the 5ea531 package with the AMD A-6 prefix rule for
#     implementation-notes.yaml;
#   - the AMD A-5 launcher identity constants expected in manifests;
#   - the DEF-1 line class in check (g);
#   - an explicit state branch for every stop point.
# Runs ALONE after TASK-20261008-9456e8 returns. Mechanical only: no value,
# count, outcome id or verdict enters the receipt summary, the commit
# message or the PR text. Fail-fast; receipt in the same commit;
# content_at_commit.
# =============================================================================
