# superseding ff7415 by reference and without editing it. Zero runs, no code,
# no compute. The id IDEA-20261023-f15270 was reserved by the top-level
# session (5c6d48 LA-5 checks it).
handoff:
  id: TASK-20261023-4c12dc
  from: coordinator
  to: idea-generator
  goal_id: GOAL-PATH-001
  batch_id: BATCH-7ca353
  question_ids: [RQ-MONO-001]
  opened_by_decision: DEC-20261023-19c53b
  kind: zero_run_rescope_proposal
  objective: >-
    Write IDEA-20261023-f15270, a re-scope of IDEA-20260803-ff7415 anchored on
    KN-OPEN-62c870 Q3 and KN-FIND-007, with its root-set facts taken from
    KN-FIND-4f0d84 and not from the superseded KN-FIND-c41ea9. It keeps
    ff7415's pre-registered prediction, its dual-convention counting (multiset
    and ordered), the exhaustive toy scale n = 2..5, and an explicit null
    object and control. It adds the sampled heuristic-validation arm that
    DEC-20261017-12e0f4 requires, and a proof_search_map per
    docs/inventor-protocol.md section 8. Also write the search-round report
    and diagram for this re-scope.
  uncertainty_reduced: >-
    Whether the 2^(n-1) compounding clause over F_{q^n} can be specified as a
    discriminating hypothesis on a current anchor, and how. That includes
    which metric carries the discriminating power, and whether a derivation
    alone can reach the disposition. This is what unblocks
    /design-experiment (DEC-20261017-12e0f4 S-2 readiness (a) and (b)).
  inputs:
    - ledger/decisions/DEC-20261023-19c53b.yaml
    - ledger/handoffs/TASK-20261023-4c12dc.yaml
    - ledger/proposals/IDEA-20260803-ff7415.yaml
    - knowledge/open-problems/KN-OPEN-62c870.md
    - knowledge/findings/KN-FIND-007.md
    - knowledge/findings/KN-FIND-4f0d84.md
    - knowledge/findings/KN-FIND-bdcd60.md
    - knowledge/findings/KN-FIND-c41ea9.md
    - ledger/questions/RQ-MONO-001.yaml
    - ledger/hypotheses/H-MONO-663fb4.yaml
    - ledger/evidence/EV-MONO-04d447.yaml
    - ledger/evidence/EV-MONO-0e7ace.yaml
    - ledger/evidence/EV-MONO-1ef611.yaml
    - ledger/decisions/DEC-20261017-435b01.yaml
    - ledger/decisions/DEC-20261017-12e0f4.yaml
    - ledger/decisions/DEC-20260802-a51c82.yaml
    - ledger/corrections/CORR-20260802-1d8384.yaml
    - ledger/goals/GOAL-PATH-001.yaml
    - ledger/goals/GOAL-ICEX-001/goal.yaml
    - knowledge/frontiers/ecdlp/README.md
    - knowledge/techniques/KN-TECH-080.md
    - agents/idea-generator.md
    - docs/inventor-protocol.md
    - docs/target-result-profile.md
    - docs/claims-and-verification.md
    - templates/research-records.md
    - tools/validate_ledger.py
    - .claude/skills/research-visuals/SKILL.md
  inputs_note: >-
    Your context is the ff7415 proposal, KN-OPEN-62c870 Q3, KN-FIND-007 and
    KN-FIND-4f0d84 in full, and DEC-20261023-19c53b's C-Q3 assessment. Read
    everything else only at the parts named in the constraints:
    DEC-20261017-12e0f4 rerank.successor_after_this_lane and S-2 readiness;
    DEC-20261017-435b01 CS-D2; DEC-20260802-a51c82, the relation-rate formula
    instruction; CORR-20260802-1d8384, the OI-1 list; the GOAL-ICEX-001 and
    GOAL-PATH-001 lines that carry the clause (search for "2^{n-1}" or
    "compound"); H-MONO-663fb4's statement and the heuristic that names
    ff7415; tools/validate_ledger.py check_prior_art only. Open no run
    directory under experiments/. KN-FIND-c41ea9 is superseded: quote it
    only as superseded text, never as support.
  constraints:
    - >-
      IG-1 Write exactly one new proposal, ledger/proposals/IDEA-20261023-f15270.yaml,
      in the idea schema ff7415 uses. As a post-cutover idea it also needs a
      prior_art block that passes tools/validate_ledger.py check_prior_art,
      and a novelty_status in {known, adaptation, speculative, unverified}.
      Set question_id RQ-MONO-001, goal_id GOAL-PATH-001, status proposed,
      proposed_by idea-generator, proposed_at '2026-10-23'. Do not edit
      IDEA-20260803-ff7415 or any other existing file, and mint no other id.
    - >-
      IG-2 Re-anchor. Write supersedes_by_reference: IDEA-20260803-ff7415,
      with a carry map: every ff7415 field, marked kept, changed (with the
      reason) or dropped (with the reason). Anchor the premise on
      KN-OPEN-62c870 Q3 (CS-D2's R2 sentence) and on KN-FIND-007's identity.
      Take the root-set facts from KN-FIND-4f0d84's Statement: degree
      2^{m-2} over sign classes with eps_1 = +1. Derive, or refute, the index
      map between the number n of factor-base points in an F_{q^n}
      decomposition and the summation index m (expected m = n + 1, so a fibre
      of 2^{n-1} sign classes). Label it derived or proposed. Re-state
      ff7415's split-completeness known-answer control on KN-FIND-4f0d84. The
      "193/193" figure comes from the superseded entry and may be cited only
      as historical.
    - >-
      IG-3 Pre-registration. Carry ff7415's predictions and dispositions
      unchanged in substance: the conservation band [1/1.582, 1.582]; the
      trend-slope band [-0.15, 0.15] against a compounding prediction of 1.0;
      F1 at slope >= 0.5; F2 to F5; and the dispositions
      CLAUSE_REFUTED_AT_TOY, CLAUSE_SUPPORTED and
      CONVENTION_ARTIFACT_DIAGNOSED. For each metric, state whether it is
      vacuous by KN-FIND-007. The mean taken over all targets is an identity;
      a band on it has no power, which is the EV-FBG-001 lesson. Name the
      metric(s) that carry the discriminating power. A band or threshold that
      must change because of the re-anchoring is changed with its reason in
      the carry map. Nothing is loosened, and no data exist to loosen it
      against.
    - >-
      IG-4 Convention counting. Every cell reports the ordered point-tuple
      count and the point-multiset count, plus the sign-class or x-coordinate
      multiset count that matches KN-FIND-4f0d84's root multiset. Derive in
      closed form, where possible, the predicted ratios between the three
      conventions (n!, 2^{n-1} or 2^n, and the corrections for repeated
      points). The trend under each convention is then predicted before any
      measurement. A design that reports only one convention is inadmissible
      (ff7415 assumption 1).
    - >-
      IG-5 Exhaustive toy scale n = 2, 3, 4, 5. Declare the q ladder per n,
      the group (E(F_{q^n}) or a stated subgroup), the factor base (the
      subfield-line base, x in F_q), and the target set. Give each cell's
      enumeration size as a count derived from its parameters, not as a
      timing. Mark any cell that cannot be exhaustive as sampled, with its
      sampling error. Curves: state how they are generated, and their
      identity fields (q, n, coefficients, group order), so the design step
      can freeze them.
    - >-
      IG-6 Null object and controls, declared before belief
      (docs/inventor-protocol.md section 3): (a) the null base, a uniformly
      random base of matched size in the same group, whose mean ratio is 1 by
      KN-FIND-007, used as a counter-defect test; (b) the nearby object
      n = 1 (a prime field), where the clause predicts no compounding; (c) a
      positive control for power: a convention or object on which the trend
      slope is 1 or greater by construction (for example the ordered count's
      n! growth, or the 2^{n-1} sign-class multiplicity). The method must
      detect it, or it cannot claim a null; (d) the KN-FIND-4f0d84 known
      answer from IG-2.
    - >-
      IG-7 Heuristic-validation arm (DEC-20261017-12e0f4
      successor_after_this_lane; agents/coordinator.md "Dispatch bias";
      docs/target-result-profile.md C12). Specify a sampled arm at the
      largest feasible (q, n) beyond the exhaustive grid, including n >= 6
      at small q if feasible. Include the sampling method, the instance and
      seed policy, sample sizes with their power argument, the predicted
      distribution of the per-target decomposition count under a stated
      random model (with its parameter tied to the conservation mean),
      machine-readable CDF output, and tail-consistency checks. This is a
      design specification only.
    - >-
      IG-8 proof_search_map (docs/inventor-protocol.md section 8;
      KN-TECH-080; schema in templates/research-records.md). Fill all four
      audits, or mark one not_applicable with its reason. Baseline: the
      Gaudry-Diem 1/n! as KN-FIND-007's mean at B ~ q, N ~ q^n, m = n,
      reproduced symbolically. Observation collision: distinct counted
      events that give the same ratio trend, and the condition that
      separates them. Quantifier order: the clause's "n growing", including
      how q may depend on n and what a fixed toy q ladder can and cannot
      decide. Method ceiling and nearby-object control: the strongest claim
      exhaustive n <= 5 can certify ("no compounding detected at n <= 5 at
      the tested q", never "does not compound"), plus the IG-6 objects. Add
      proof_obligations with responsibilities, and the constructive
      transforms whose prerequisites are present, if any.
    - >-
      IG-9 Derivation first (docs/claims-and-verification.md, the refutation
      ladder). If the disposition can be reached by a derivation, because the
      convention ratios are combinatorial, write the derivation steps as
      proposed lemmas, each with a single responsibility. Then state the
      measurement's role as corroboration, and what the measurement adds that
      the derivation does not. Label every statement proposed, derived or
      measured. Measured applies only to committed numbers cited by record
      and key.
    - >-
      IG-10 Overlap and prior work. Check by key whether H-MONO-663fb4 or its
      evidence (EV-MONO-04d447, EV-MONO-0e7ace) already measured the
      ordered/multiset correspondence over F_p. Its statement calls the
      correspondence "a declared stage" and cites ff7415. Record what is
      reused as a fixture, and do not re-measure it. Address PF-1 of
      KN-OPEN-62c870: for each of the five CORR-20260802-1d8384 OI-1 repairs,
      either apply it or state why it does not apply to an F_{q^n}
      decomposition count. Fill dominated_by after checking the frontier map
      rows, sota_delta (quantitative, or "no attack; measurement/correction
      contribution only"), and prior_art with nearest entries and their
      provenance. Gaudry, Diem and Semaev are recalled unless an agent read
      them; a recalled citation supports nothing.
    - >-
      IG-11 Required content beyond the above: mechanism, assumptions,
      numbered heuristic_assumptions with validation plans, confounders,
      interpretation_limits, falsification_conditions, target_complexity,
      instrument_failure_guards, consumers, implementation_note, and
      estimated_cost. interpretation_limits carry toy tier, "moves no
      exponent in either direction", and KN-OPEN-62c870 CS-D2 and CS-R7 by
      reference. Consumers name GOAL-ICEX-001's mandated read
      (DEC-20260802-a51c82) and GOAL-PATH-001's BATCH-002 checkpoint
      (icex_feed_supersession), without asserting either goal's state. The
      implementation_note says what code a proof-of-concept needs and what
      existing code may be reused, by path if known; no code is written.
    - >-
      IG-12 If the corpus already decides the question, say so plainly and
      cite the record. Then the IDEA records the derivation and recommends
      the cheapest artifact that would make it official. Neither inflate the
      question nor shelve it. Do not declare the direction impossible.
    - >-
      IG-13 Search-round report (research-visuals "Deliverables for each
      search round"). In docs/reports/2026-10-23-idea-f15270-rescope/, write
      report.md: the question, the corpus screen with the paths searched, the
      carry map summary, the prior, the controls, and limitations, with each
      statement labelled. Also write convention-map.svg, a hand-written,
      editable diagram of the counted events under the three conventions and
      the predicted ratios between them, with conjectural edges dashed and
      labelled. No quantitative plot: no data exist.
    - >-
      IG-14 The inference block is truthful (requested policy, resolved model
      id if known, fallback_used, model_verified false unless probed). No
      attestation fields and no null-placeholder blocks.
    - IG-15 Zero runs, no code, no compute, no hypothesis or experiment record, no status change, no git.
    - >-
      RP-1 PDF step, done by the shell-holding dispatcher under this task's
      claim after the idea-generator returns. Render
      docs/reports/2026-10-23-idea-f15270-rescope/report.pdf from report.md
      with the SVG included (Pandoc or Typst, from a scratch virtualenv if
      needed), and inspect every page. Edit neither report.md nor the SVG.
      If rendering is blocked, record the exact blocker in the release, and
      do not reuse any other PDF.
