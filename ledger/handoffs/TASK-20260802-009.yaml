handoff:
  id: TASK-20260802-009
  from: coordinator
  to: validator
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-028
  role: validator
  objective: >-
    Verify run validity BEFORE anyone reads it. Expected instance and arm
    counts, instance distinctness, schema-complete manifest, seed and stream
    integrity, driver-hash equality, raw versus summary agreement, denominator
    traceability, interval correctness, and above all THE FACTORIZATIONS AND THE
    STANDARD DEVIATIONS THEMSELVES.
  uncertainty_reduced: 'Whether the instance-variance measurement is admissible as evidence at all.'
  inputs:
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-ivr/
  - experiments/EXP-LPF-001/results/ivr/
  - experiments/EXP-LPF-001/results/calib/
  - experiments/EXP-LPF-001/control_ivr/
  - experiments/EXP-LPF-001/implementation/lpf001_driver.py
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/archives/TASK-20260802-008/snapshot_commit_receipt.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/archives/TASK-20260802-004/snapshot_commit_receipt.json
  constraints:
  - 'INDEPENDENT SESSION. You did not author, freeze or execute any artifact under review, and you did not serve TASK-20260802-005.'
  - >-
    RECOMPUTE, DO NOT READ. Regenerate every reported quantity from the archived
    raw arrays with your own code and compare at TOLERANCE ZERO. RECOMPUTE ALL
    TEN s_between VALUES BY YOUR OWN ddof = 1 SORT AND SUM from
    per_instance_phat.json, and all ten VR values from the archived calibration
    denominators. A DISAGREEMENT AT ANY DIGIT IS A BLOCKING DEFECT.
  - >-
    PRIORITY DUTY - INDEPENDENTLY REFACTOR at least 5000 uniformly chosen
    real-arm samples per cell, drawn from at least 5 distinct instances, by a
    factorization path that reuses none of the driver's code, and compare the
    largest prime factor. Report the exact agreement count. A SINGLE
    DISAGREEMENT IS A BLOCKING DEFECT and the package is NOT ADMISSIBLE.
  - >-
    VERIFY INSTANCE DISTINCTNESS AND THE SUBSTITUTION RULE. Confirm 20 distinct
    instances per cell, recompute the 20 factor_base_sha256 values yourself,
    confirm pairwise distinctness of the varying components, confirm 2301 is
    absent from the family, and confirm every substitution follows the frozen
    deterministic rule from 90021 upward and no other criterion. VERIFY THE
    PRE-Q-1 ANSWER FROM SOURCE YOURSELF and confirm the report states what you
    find.
  - >-
    DENOMINATOR TRACEABILITY - THE DECISION-VARIABLE-VARIATION DISCIPLINE IN ITS
    FORM FOR THIS BATCH. Trace every VR denominator by YOUR OWN SORT to the
    named archived calibration array in experiments/EXP-LPF-001/results/calib/,
    confirm the bits-16 u = 2 denominator is 0.0012764339776488623, and STATE
    FOR EACH REPORTED RATIO WHICH ARM PRODUCES THE NUMERATOR AND WHICH THE
    DENOMINATOR. Confirm the run reads no quantity it also produces.
  - >-
    EVERY RATIO CARRIES ITS INTERVAL - THE MOVEMENT-AT-EVERY-RUNG DISCIPLINE IN
    ITS FORM FOR THIS BATCH, AND IT IS NOT SKIPPED. Recompute every reported
    sampling interval yourself from the chi-square distribution on nu = 19,
    confirm the multipliers, and confirm NO reported ratio anywhere in the
    package lacks one. Independently re-derive the two declaration floors and
    the power table and report the numbers YOU obtain.
  - >-
    VERIFY THE PERMUTATION NULL. Re-run the free rider's permutation null
    yourself at R_PERM = 2000 from the archived smooth indicators, confirm it
    permutes PAIR SLOTS and not indices, confirm the total smooth count is held
    fixed, and compare your null position with the archived one. ALSO CONFIRM
    BOTH NULLS ARE REPORTED and that neither is reported alone.
  - 'VERIFY THE ENUMERATION - exactly 130816 half-tuples per instance per cell with i < j, the diagonal absent by construction, degenerate draws counted and excluded, and each instance factor_base_sha256 recomputed by you from that instance own p.'
  - >-
    ANTI-TUNING, MECHANICAL LEGS - VERIFY AGAINST GIT that the TASK-20260802-004
    freeze commit is an ANCESTOR of the TASK-20260802-008 run commit, so the
    contract provably predates the datum; that specification.yaml still hashes
    to 0d6c946fb84073feae47865da9b787b7d7ba459617834644680a06bf886d1cda;
    reading_rule.yaml to
    8bcb196fa620503c736da307281325d17bb3dc8b0299407b24b584067c979f1d;
    reading_rule_v2.yaml to
    b633eaf1837ec876ffb7a52bdc6450baba8b1bb4d253dce3d8f3e6e13a7de328;
    lpf001_driver.py to
    786aeb0550d75fa3d0785aefbe50b121a24cacae584a4cadd79902c464722d65 with an
    EMPTY git diff; and that control_specification.yaml, reading_rule_ivr.yaml
    and ivr001_driver.py are BIT-IDENTICAL to their state at the freeze commit.
    A MISMATCH ON ANY OF THEM IS BLOCKING and voids the batch reduced duty set.
  - 'VERIFY SEED AND STREAM DISJOINTNESS between every control stream and every archived calibration, plant-Z and measurement stream, and among the control streams themselves.'
  - >-
    RUN tools/validate_ledger.py AND REPORT ITS OUTPUT FOR THIS RUN PACKAGE
    VERBATIM. Confirm the manifest is schema-complete under the keys the schema
    names. Confirm the RUN-LPF-001-plantz supersession entry still resolves
    cleanly and that neither pinned file has drifted (DEF-065-1 carry-forward
    check).
  - 'RETURN ADMISSIBLE or NOT ADMISSIBLE with a concrete defect list. DO NOT APPLY RR-IVR-1 READING CLAUSES, do not declare C-WIDE, C-TIGHT or C-INDET, and do not state a disposition. DO NOT READ C-MEAN.'
  - 'MAKE NO COMMIT; TASK-20260802-011 archives this report.'
  - 'Record inference honestly (requested review-adversarial, independent session, fallback_used true, model_verified false), and every YAML written must parse.'
  deliverables:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/reviews/TASK-20260802-009/validation_report.yaml
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/reviews/TASK-20260802-009/validation_report.yaml
  archived_by: TASK-20260802-011
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 7200
    memory_gb: 8
    maximum_runs: 1
  completion_gate:
  - >-
    ADMISSIBLE or NOT ADMISSIBLE with a concrete defect list; every reported
    quantity regenerated at tolerance zero and all ten s_between and all ten VR
    values recomputed independently; at least 5000 real-arm factorizations per
    cell across at least 5 instances re-verified by a second code path with the
    exact agreement count; 20 distinct instances per cell confirmed with
    recomputed factor_base_sha256 values, 2301 absent and every substitution
    rule-following; PRE-Q-1 re-determined from source; every VR denominator
    traced by your own sort to its named archived array with numerator and
    denominator arms stated; every sampling interval recomputed and the
    declaration floors and power table re-derived with your numbers; the
    permutation null re-run at R_PERM = 2000 with both nulls confirmed reported;
    the enumeration, seeds and streams verified; the freeze commit confirmed an
    ancestor of the run commit and all seven hashes verified against Git;
    validate_ledger.py output reported verbatim and the plantz supersession
    entry confirmed still resolving; no reading clause applied, C-MEAN not read,
    no commit made.
