handoff:
  id: TASK-20260908-d54138
  from: coordinator
  to: executor
  question_id: RQ-ECDLP-002
  objective: >-
    Complete the approved repair chain of EXP-ECDLP-56ee42 under amendment
    v5 (approved by DEC-20260908-a491ff): (a) apply the code fixes as one
    coherent change and re-run the corrected Stages 0-2 as NEW run records;
    (b) complete the RC-4 tooling subtask; (c) run V5-RA-1 re-verification
    and the V5-RA-2 production-timing confirmation (RC-3 reuse choice
    committed); (d) run the synthetic power check with the N=10 fallback
    planned as the likely outcome; (e) run the C2 calibration run and
    re-record the C3 amended provenance check passing; (f) ONLY if every
    gate above passes, run Stage 3 (and Stage 4 only if the LEAD branch
    fires on the frozen pre-registered rule). Produce immutable run
    records, an execution report naming exactly one branch outcome, and
    every required artifact. Record observations only; never interpret;
    never re-score any archived cell against a changed prediction.
  uncertainty_reduced: >-
    Whether, after the v5-corrected instrument (stage2.py static-
    provenance dict fix, estimator.py rename/add, selftest.py replacement),
    the matched-marginal shuffle control behaves as the o2-lane reference
    documents (C1 survival band, C2 comparator collapse), the synthetic
    power check is feasible within the confirmed budget (V5-RA-2), and the
    digit-statistic cell then yields a decidable branch outcome (CLOSURE /
    LEAD / INCONCLUSIVE) on the frozen metrics alone.
  inputs:
    - experiments/EXP-ECDLP-56ee42/specification.yaml (frozen v1 contract; read-only)
    - experiments/EXP-ECDLP-56ee42/specification.v2.yaml (approved contract layer; read-only)
    - experiments/EXP-ECDLP-56ee42/amendments/v2_control_c_recalibration.yaml (C1/C2/C3 control definitions)
    - experiments/EXP-ECDLP-56ee42/amendments/v3_comparator_and_t3_repair.yaml (V3-CHG-2 estimator rename/add; V3-CHG-1 power check)
    - experiments/EXP-ECDLP-56ee42/amendments/v4_power_check_and_selftest_repair.yaml (V4-CHG-5 selftest replacement; V4-CHG-6 power-check pinning)
    - experiments/EXP-ECDLP-56ee42/amendments/v5_stage2_provenance_and_power_check_budget_repair.yaml (V5-CHG-1..4; V5-RA-1/V5-RA-2; APPLIED per DEC-20260908-a491ff)
    - experiments/EXP-ECDLP-56ee42/reviews/amendment-v5-review/report.yaml (verdict SUSTAINED; required_controls dispositioned by the DEC; its verify_* scripts are prior independent evidence, citable per the chain's practice)
    - experiments/EXP-ECDLP-56ee42/reviews/round-1/ and reviews/amendment-v3-review/, reviews/amendment-v4-review/ (prior rounds, for gate context only)
    - experiments/EXP-ECDLP-56ee42/design/{select_ladder.py,ladder.json} (frozen ladder; selector must reproduce it exactly)
    - experiments/EXP-ECDLP-56ee42/implementation/ (existing code: estimator.py, stage0.py, stage1.py, stage2.py, runrecord.py, selftest.py; stage-cache/ enumeration)
    - experiments/EXP-ECDLP-56ee42/runs/RUN-ECDLP-56ee42-S0..S2 (archived; IMMUTABLE; never re-scored)
    - ledger/decisions/DEC-20260908-a491ff (this approval; RC-3 and RC-5 recorded there)
    - ledger/handoffs/TASK-20260903-087076.yaml (original handoff; its constraints carry forward where not superseded)
    - ledger/proposals/IDEA-20260815-f558e4.yaml (estimator definition; frozen fixture 284/529 at N=23, s=3)
  constraints:
    - >-
      The code fixes V5-CHG-1 (stage2.py static_provenance dict),
      V3-CHG-2 (estimator.py rename/add) and V4-CHG-5 (selftest.py
      replacement) are applied TOGETHER, as one coherent change, exactly
      as the amendments specify; do not apply any of them separably or
      re-derive them. selftest must pass after application, before any
      re-run stage.
    - >-
      The corrected Stage 0-2 re-run writes NEW run records under
      runs/ (new RUN-ECDLP-56ee42-* ids per the amendment's naming, or a
      disclosed successor naming if the amendment is silent); the
      archived S0-S2 directories are immutable and are never edited,
      re-scored, or deleted.
    - >-
      RC-3 (committed in DEC-20260908-a491ff): each rung's single
      V5-RA-2 confirmation-gate repetition is REUSED as repetition 0 of
      the eventual N=20 (or N=10) schedule, same seed. State this
      choice verbatim in the calibration-run task record; do not treat
      it as a discarded measurement.
    - >-
      RC-4 (required subtask, before the calibration run's execution
      begins): wire power_check_ancestor_commit_sha and
      power_check_artifact_sha256 into tools/validate_ledger.py's
      handoff schema as required fields, and add a small verification
      script (tools/power_check_verification.py) implementing both
      checks mechanically. Commit nothing; the Coordinator archives.
    - >-
      The N=10 fallback for the power-check schedule is the PLANNED
      likely outcome per the amendment-v5-review's own third-sandbox
      timing; schedule for it, and record the outcome (N=20 vs N=10)
      before sampling.
    - >-
      RC-5 (adopted in DEC-20260908-a491ff): the synthetic power check
      does not count against maximum_runs: 12; the per-invocation
      wall_clock_seconds_per_run: 7200 cap still binds it literally, so
      split across invocations as the amendment requires.
    - >-
      Stage 3 runs ONLY after: corrected Stage 0-2 re-run complete,
      V5-RA-1 and V5-RA-2 confirmations pass, power check complete, C2
      calibration run PASSES (C1 band [0.70,1.10] per rung; C2
      comparator collapse <= 0.5 per rung), and the C3 amended
      provenance check is RE-RECORDED passing (disclose the scanner
      change in the run record). If C2 fails, F3 stands: stop, archive,
      and report; no Stage 3, no digit numbers.
    - >-
      Exactness is a contract requirement: A(v) and q_maj are EXACT
      (exact integers/rationals with the integer-recovery check asserted
      on every convolution); floating-point-only values are not
      admissible as reported metrics.
    - >-
      Seeds are exactly as frozen in the contract and the amendments
      (base 0x56EE42; the named NULL-1 schedule; the 8 named shuffle
      seeds; the bootstrap seed; the amendment-pinned power-check and
      calibration seeds). No cell is re-run with a different seed.
    - >-
      Host is macOS arm64: do NOT call setrlimit/RLIMIT_AS (the kernel
      rejects it); measure peak RSS via resource.getrusage and record
      the 16 GiB budget as measured, not enforced.
    - >-
      Every run record: manifest.yaml (validating against
      schemas/run-manifest.schema.json, jsonschema 4.26.0 on host
      python3; run-level additionalProperties is False), command.txt
      (verbatim plain string -- a prior experiment was burned by a
      helper that JSON-encoded it), environment.json, stdout.log,
      stderr.log, raw-result.json. Manifests carry the git commit and
      honest dirty-tree state, seeds, environment/dependency versions
      (declare numpy if used), model policy requested
      (executor-implementation) with resolved runtime model id and
      probe-verification status, stdout+stderr, raw results, validity
      + reason, timestamps, wall-clock, peak RSS.
    - >-
      No run claims a discrete log (none is solved); certificate-like
      output is a harness enumeration artifact, labelled as such.
      A timeout, crash, or implementation failure is an infrastructure
      outcome (F6 or the contract's taxonomy), never evidence about the
      statistics.
  deliverables:
    - the coherent code-fix change (stage2.py + estimator.py + selftest.py), selftest passing
    - RC-4 tooling: tools/validate_ledger.py schema wiring + tools/power_check_verification.py
    - NEW run records for the corrected Stages 0-2 re-run (full manifest policy each)
    - V5-RA-1 re-verification record (citing the amendment-v5-review's verify_v5chg1_stage2_dict_fix_output.txt as prior independent evidence)
    - V5-RA-2 production-timing confirmation record (RC-3 reuse choice stated verbatim)
    - power check record: power_check_results.yaml (or the amendment's pinned name), schedule outcome (N=20 vs N=10), gate verdict, ancestor-commit and artifact-sha checks passing via the RC-4 script
    - C2 calibration run record (T4 and comparator, six rungs, pre-shuffle + 8 NULL-2 shuffles, stage-cache reuse) with C1 and C2 gate verdicts per rung
    - C3 amended provenance check re-recorded passing, disclosed in the Stage 3 manifest
    - Stage 3 raw results (A(v), q_maj, marginals per (arm, n, seed) before/after shuffle; NULL-1 distributions, all 256 replicates per rung, tail references; P2 fitted betas with bootstrap intervals and residuals; P5 marginals with NULL-1 reference) -- only if the gates pass
    - experiments/EXP-ECDLP-56ee42/execution-report.yaml naming exactly ONE branch outcome per the frozen success criterion, with the full gate table and resource accounting
  artifact_paths:
    - experiments/EXP-ECDLP-56ee42/implementation/
    - experiments/EXP-ECDLP-56ee42/runs/
    - experiments/EXP-ECDLP-56ee42/execution-report.yaml
    - tools/validate_ledger.py
    - tools/power_check_verification.py
  archived_by: TASK-20260908-d54138
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 86400
    memory_gb: 16
    maximum_runs: 12
  completion_gate:
    - the execution report names exactly one branch outcome per the frozen success criterion, decidable from the frozen metrics alone
    - the coherent code-fix change applied selftest-passing before any re-run stage, and no frozen/approved record was edited
    - RC-4 tooling complete and its verification script passing before the calibration run began
    - V5-RA-1 and V5-RA-2 confirmations recorded with the RC-3 choice stated verbatim
    - power check schedule outcome (N=20 vs N=10) recorded before sampling; RC-5 interpretation applied (not counted against maximum_runs; 7200s per-invocation cap respected with the required split)
    - C2 calibration gate verdicts per rung recorded; Stage 3 executed only if they passed and the C3 check was re-recorded passing
    - every reported metric row names n, the statistic, the lift convention and the estimator
    - the full artifact policy is satisfied per run (schema-valid manifests, verbatim command.txt, raw results, resource measurements)
    - no run record claims a discrete log on any instance
    - tools/validate_ledger.py reports no new error against the pre-existing baseline
  return_format: >-
    The list of new run record paths; the one-line branch outcome (or the
    gate that stopped the run, with its verdict); the gate table
    (pass/fail per gate with archived evidence of any failure); the power
    check schedule outcome; anomalies and protocol deviations; and the
    pointer to the execution report.
  review_plan: null
