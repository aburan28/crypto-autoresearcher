handoff:
  id: TASK-20260922-bd41fd
  from: coordinator
  to: executor
  objective: >-
    Execute experiments/EXP-DREG-ab3fee/specification.yaml. Report the
    within-class increment ranges or a blocked label. Do not interpret a gap
    as an isogeny effect; that is EXP-DREG-6de989.
  uncertainty_reduced: >-
    Whether last-fall and grevlex solving-degree increments from n=1 to n=2
    agree on the certified toy F_4-isogeny class.
  inputs:
    - experiments/EXP-DREG-ab3fee/specification.yaml
    - experiments/EXP-DREG-dd668d/specification.yaml
    - ledger/hypotheses/H-DREG-b6bfd1.yaml
    - ledger/decisions/DEC-20260922-e53e23.yaml
  constraints:
    - Do not edit either specification.
    - If the prerequisite label is instrument or homogeneous-no-op, stop with blocked-instrument and do not compute a class range.
    - Unfinished cells stay unmeasured.
    - Write only under experiments/EXP-DREG-ab3fee/runs/.
    - Mint the run id with tools/allocate_id.py --next run --area DREG.
  deliverables:
    - experiments/EXP-DREG-ab3fee/runs/<RUN-ID>/metrics.json
    - experiments/EXP-DREG-ab3fee/runs/<RUN-ID>/report.md
    - experiments/EXP-DREG-ab3fee/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-DREG-ab3fee/runs/<RUN-ID>/per_vertex.json
  artifact_paths:
    - experiments/EXP-DREG-ab3fee/runs/
  write_scope:
    - experiments/EXP-DREG-ab3fee/runs/
  archived_by: TASK-20260922-cc9327
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: null
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
    - metrics.json contains outcome_label and, unless blocked, the two ranges or an explicit unmeasured list
    - certified is true or the label is uncertified-class
    - report.md states whether the base left the first-fall floor
  dispatch_preconditions:
    - The design snapshot TASK-20260922-cc9327 is committed and pushed.
    - A completed EXP-DREG-dd668d metrics.json exists and its outcome_label is not instrument and not homogeneous-no-op.
    - Do not open a lane on GOAL-DREG-001.
  return_format: >-
    The outcome_label, both ranges or the blocked reason, coverage, and the artifact paths.
