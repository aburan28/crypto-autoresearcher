handoff:
  id: TASK-20260909-2989a0
  id_allocation_provenance: >-
    Pre-minted and verified free on origin/main by the orchestrating
    session before this design (2026-09-09); relayed in the design
    instruction for IDEA-20260906-ac100b. Not derived by scanning state.
  recorded_at: '2026-09-09'
  goal_id: null
  question_id: RQ-ECDLP-78dbc5
  batch_id: null
  batch_id_note: >-
    Standalone design task in worktree
    /Volumes/SSD990/llm/tmp/opencode/design-ecdlp-20260909, not a goal
    batch: no batch id, no dispatch queue, no task card. Dispatched ONLY
    after DEC-20260909-0d8274 is committed, so the Executor starts from
    the frozen approved contract.
  dispatch_queue: null
  task_card: null
  role: executor
  from: coordinator
  to: executor
  review_required: true
  objective: >-
    Implement and execute the frozen, APPROVED contract EXP-ECDLP-e962f6
    version 1 (experiments/EXP-ECDLP-e962f6/specification.yaml; status
    approved, approved_by coordinator, frozen true, execution_authorized
    true, per DEC-20260909-0d8274) EXACTLY as written -- Stages 1-2 ONLY
    (Stage 0, the validator audit, is a separate reserved validator task
    and is NOT part of this handoff): (1) write the derivation document
    experiments/EXP-ECDLP-e962f6/derivation/derivation-lemmas-1-6.md with
    Lemmas 1-6, each carrying the statement with explicit error terms,
    Route A (the idea's route), Route B (the independent route), the
    measured route agreement to four digits, the citations with
    provenance exactly as recorded in H-ECDLP-f2bdd0, and the per-lemma
    check box block, plus the quantifier statement, the baseline-
    embedding check, the permutation collapse argument, and the
    proves-too-much argument; (2) RUN-001 the quadrature table
    (deterministic); (3) RUN-002 the N = 2^26 exact-basin anchor (one
    array pass); (4) RUN-003/004/005 the permutation nearby-object
    control at N = 2^20, seeds 1-3; (5) RUN-006 the proves-too-much
    non-uniform-rule control at N = 2^20, seed 1; (6) RUN-007 the Stage 2
    read-only residual re-read over the committed summaries. The frozen
    contract is the ONLY protocol. The Executor records observations
    only: it interprets nothing, draws no conclusion, uses no hypothesis
    language in run records, and changes no status.
  uncertainty_reduced: >-
    Whether the quadrature reproduces the committed anchor values to
    within 5e-5 at all four a values with the assembly minimum at a in
    [0.2, 0.25] within 0.01 of 1.28 (Q1-Q3); whether |R(2^26)| <= 0.15
    (the decidable-negative band) and the corrected residual decays as
    N^{-1/3} across {2^20, 2^22, 2^24, 2^26} per checks D2-D3; whether
    the permutation top-T share collapses below 3 T W/N = 0.046875 at
    every seed without reproducing C_max(1/4) = 0.3889120129663709;
    whether the non-uniform {0, 2theta} object fails loudly (mean walk
    length deviating from W by more than 10%, or the KS test against
    Geometric(theta) rejecting at alpha = 0.01, or the top-T share
    deviating from C_max(1/4) by more than 15%); and whether the Stage 2
    re-read is read-only clean (sha256 match on every committed file
    read). The Executor produces the measurements; the Coordinator
    decides after independent review.
  inputs:
  - >-
    experiments/EXP-ECDLP-e962f6/specification.yaml (the frozen approved
    protocol, version 1 -- the ONLY protocol; five gate fields set by
    this design under DEC-20260909-0d8274; every protocol field
    untouched since design)
  - ledger/hypotheses/H-ECDLP-f2bdd0.yaml (the specified hypothesis; status unchanged by execution)
  - ledger/questions/RQ-ECDLP-78dbc5.yaml (decision target, definitions and constraints)
  - ledger/proposals/IDEA-20260906-ac100b.yaml (the idea record: Lemmas 1-6, proof_search_map, the (B1)-(B3) closed forms as a proof-shaped claim)
  - ledger/proposals/IDEA-20260906-aed829.yaml (the basin-model derivations (B1)-(B3) cited as MODEL numbers only)
  - ledger/decisions/DEC-20260909-0d8274.yaml (the approval decision)
  - >-
    COMMITTED RUNS (READ-ONLY, the Stage 2 residual source and the
    anchor fixture): experiments/EXP-ECDLP-869870/runs/RUN-ECDLP-869870-
    001..005-N20-s1..s5/summary.json, RUN-ECDLP-869870-006..010-N22-
    s1..s5/summary.json, RUN-ECDLP-869870-011..015-N24-s1..s5/summary.json
    (fields global_oracle.top_T_share_8W, global_oracle.
    ratio_to_c_max_numeric, global_oracle.model.c_max_numeric,
    basin_law.survival_slope_8W, cycle_mass_frac, capped_mass_8W_frac,
    exact_mean_online_walk_length_8W) and
    experiments/EXP-ECDLP-612fb1/runs/RUN-ECDLP-612fb1-002/summary.json
    (fields basins.top_T_share, basins.C_max_model, basins.x_star_model,
    basins.cycle_mass_frac, basins.capped_mass_frac). The anchor values
    are listed in the contract's inputs.residual_reread.anchor_values.
  - knowledge/literature/KN-LIT-013.md (Corrigan-Gibbs-Kogan, the S T^2 ceiling)
  constraints:
  - >-
    FROZEN CONTRACT. Any needed change to any protocol field (the
    quadrature grid or tolerance, the 2^26 anchor parameters, the
    permutation or non-uniform object parameters, the 15% band, the
    N^{-1/3} decay checks, the seeds, the run list) is a versioned
    protocol_amendment proposed under experiments/EXP-ECDLP-e962f6/
    amendments/ to the Coordinator -- NEVER an inline edit of
    specification.yaml, and never a re-score of an executed run.
  - >-
    DETERMINISTIC SEEDS exactly as the contract's seed_policy: RUN-001
    deterministic (no seed; method and grid recorded in the manifest);
    RUN-002 walk_key seed 1, dp_key seed 101, tie_break seed 401;
    RUN-003/004/005 permutation seed s in {1, 2, 3} for the Fisher-Yates
    draw, dp_key seed 101 + s; RUN-006 walk_key seed 1, dp_key seed 101,
    online seed 201; RUN-007 no seed (read-only). Seeds are recorded in
    every manifest; no seed adjustment ever; a duplicated or missing seed
    invalidates the run.
  - >-
    STAGE 2 IS READ-ONLY: RUN-007 re-reads the committed summaries and
    produces the residual table and the decay checks; it never
    re-simulates, never modifies, and records the sha256 of every
    committed file read in its manifest. Any committed file whose sha256
    at read time differs from the committed state invalidates the run.
  - >-
    STAGE 0 IS NOT THIS TASK: the validator audit of the derivation
    document is a separate reserved validator task (review-adversarial,
    independent session) dispatched after the snapshot archive
    TASK-20260909-b95f26. The Executor does not audit its own derivation,
    records no audit verdicts, and writes no verdict into the derivation
    document (it is immutable once archived).
  - >-
    DERIVATION DOCUMENT: per-lemma check box blocks (statement with
    explicit error terms, Route A, Route B, routes agree to four digits,
    citations with provenance, self-check complete); the citations carry
    provenance exactly as recorded in H-ECDLP-f2bdd0 (recalled entries
    stay recalled; none may be upgraded without a recorded fetch); the
    derivation is NEVER labelled "proved" -- it is a checkable derivation
    artifact.
  - >-
    RUN RECORDS are immutable under experiments/EXP-ECDLP-e962f6/runs/
    <RUN-ID>/: manifest.yaml with the exact command, git commit and
    dirty-tree state, environment and dependency versions, inputs, ALL
    seeds, complete stdout and stderr, raw-result.json, summary.json,
    validity status and reason, timestamps, wall clock and
    peak_rss_bytes reconciled against the 4 GB ceiling. A defective run
    is superseded by a new run record, never edited.
  - >-
    INFERENCE MANIFEST per run: requested_policy executor-implementation,
    backend, resolved model identifier, model_verified, reasoning effort,
    fallback_used with reason (this handoff sets fallback_allowed false
    and degraded_allowed false: if the policy cannot be honoured the
    Executor refuses and reports, never silently substitutes),
    degraded_requirements.
  - >-
    A TIMEOUT (600 s per run), crash, memory exhaustion or dependency
    failure is failed_infrastructure and is NEVER a result, positive or
    negative (AGENTS.md rule 5; contract invalidation rule 2); it is
    reported as such and re-planned within the contract's spare run,
    never interpreted.
  - >-
    ZERO INTERPRETATION: no conclusion, no status change, no hypothesis
    language, no ledger write (no EV-*, DEC-*, H-* or KN-* record); the
    Executor writes only inside its write_scope.
  - >-
    NO COMMIT: this task does not commit, push or open a pull request;
    the snapshot archive TASK-20260909-b95f26 commits the declared
    paths.
  - >-
    NO BEDROCK (AGENTS.md rule 16): no runtime, backend, endpoint or
    model identifier containing "bedrock" (case-insensitive) may be
    selected; refuse before making a network request.
  - >-
    PROVENANCE: every citation in every artifact carries its provenance
    (recalled | retrieved | kb | internal); a recalled reference is a
    pointer telling a reviewer where to look, never support (AGENTS.md
    rule 9).
  - >-
    IMPLEMENTATION PATH (declared here as the contract's
    required_artifacts require): experiments/EXP-ECDLP-e962f6/source/ --
    one code path for all objects with object selection by configuration
    (random function / permutation / non-uniform rule), so that controls
    differ from the treatment in exactly the declared way; hash-pinned by
    commit in every run manifest. Shared harness code may be used only
    where it is already committed and is referenced by commit; nothing
    under harness/ or src/ is modified by this task.
  - >-
    GATE ORDER IS BINDING: RUN-001 first -- if the quadrature fails to
    reproduce the committed anchor values to within 5e-5 at any a, the
    quadrature run is an implementation error (not a model failure);
    repair and re-run as a new run record before any other Stage 1
    number is interpreted. RUN-007 last (it consumes RUN-002's anchor
    value).
  deliverables:
  - experiments/EXP-ECDLP-e962f6/source/ (the instrument implementation, one code path, hash-pinned per run manifest)
  - >-
    experiments/EXP-ECDLP-e962f6/derivation/derivation-lemmas-1-6.md (the
    derivation document with the per-lemma check box blocks, the
    quantifier statement, the baseline-embedding check, the permutation
    collapse argument, and the proves-too-much argument)
  - >-
    experiments/EXP-ECDLP-e962f6/runs/RUN-ECDLP-e962f6-001..007/ (one
    immutable run record per executed run: manifest.yaml, raw-result.json,
    summary.json, stdout and stderr; RUN-001 the quadrature table with
    the anchor-reproduction table; RUN-002 the 2^26 anchor with the
    basin histogram, top-T share, cycle and capped mass, walk-length
    statistics and Spearman correlation; RUN-003/004/005 the permutation
    control per seed; RUN-006 the non-uniform object with the loudness
    verdict per threshold; RUN-007 the residual table per (N, seed) with
    the decay-check verdicts and the read-only verification)
  - >-
    execution report in the execution task directory (assigned at
    dispatch): run inventory, per-run validity, the quadrature anchor-
    reproduction table, the decay-check verdicts D1-D3, the control
    verdicts (permutation collapse, proves-too-much loudness),
    infrastructure events, stages not yet run
  artifact_paths:
  - experiments/EXP-ECDLP-e962f6/source/
  - experiments/EXP-ECDLP-e962f6/derivation/
  - experiments/EXP-ECDLP-e962f6/runs/
  - execution report (task directory assigned at dispatch)
  archived_by: TASK-20260909-b95f26
  archived_by_note: >-
    TASK-20260909-b95f26 is the RESERVED snapshot archive of this task:
    it stages exactly the declared source, derivation, run and report
    paths before the Stage 0 validator audit; the ledger archive follows
    the audit.
  write_scope:
  - experiments/EXP-ECDLP-e962f6/runs/
  - experiments/EXP-ECDLP-e962f6/source/
  - experiments/EXP-ECDLP-e962f6/derivation/
  - the execution task directory (assigned at dispatch)
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 600
    memory_gb: 4
    maximum_runs: 8
  contract_budget_envelope:
    wall_clock_seconds_per_run: 600
    total_cpu_hours: 0.5
    maximum_memory_gb: 4
    maximum_runs: 8
    maximum_workers: 1
  budget_note: >-
    Copied verbatim from the contract's budget block (advisory per
    docs/research-budget-policy.md): wall_clock_seconds is the PER-RUN
    ceiling (600 s; exceedance is failed_infrastructure); total_cpu_hours
    0.5 and maximum_runs 8 bind the task, whichever first; memory 4 GB is
    the machine-protection ceiling, not an expectation (the 2^26 arrays
    are about 1.3 GB); one worker. The contract's own run arithmetic is
    7 runs (1 quadrature + 1 anchor + 3 permutation + 1 non-uniform + 1
    Stage 2 re-read) with 1 spare for a recorded infrastructure re-run.
    A cell not reached is reported as not run, never as a negative.
  completion_gate:
  - >-
    The contract's stopping rules are met for every stage executed, or a
    budget exhaustion (runs or CPU-hours) is reported as exhaustion with
    the completed prefix and the cells not run listed.
  - >-
    Every required artifact of the contract is present for every executed
    run: schema-complete manifest (command, commit, dirty state,
    environment, requested policy, resolved model, fallback flag, seeds,
    wall clock, peak_rss_bytes), raw-result.json, summary.json, and the
    derivation document with the per-lemma check box blocks present and
    self-checked.
  - >-
    RUN-001's anchor reproduction (within 5e-5 at all four a values) is
    computed and REPORTED before any other Stage 1 number is interpreted;
    RUN-007's read-only guarantee is verified (sha256 match on every
    committed file read) and the decay checks D1-D3 are stated with their
    verdicts.
  - >-
    The control verdicts are stated per control: the permutation top-T
    share beside 3 T W/N = 0.046875 and C_max(1/4) at every seed; the
    proves-too-much loudness per threshold (mean walk length deviation,
    KS statistic and p-value, top-T share deviation).
  - >-
    Infrastructure failures, if any, are recorded as failed_infrastructure
    with the re-planned run; no protocol edit anywhere; no status
    language; runs immutable.
  review_plan: null
  review_note: >-
    The Stage 0 validator audit is a SEPARATE reserved validator task
    (review-adversarial, independent session), NOT part of this handoff
    and NOT a run of this experiment: it is dispatched after the snapshot
    archive TASK-20260909-b95f26 commits the derivation document, under a
    review_plan written by the Coordinator BEFORE the validator runs,
    with the Coordinator prior recorded in it. Reason for the separation:
    the audit is the hard gate on the ceiling claim and must be
    independent of the producer of the derivation document (the
    executor); the audit's input is the archived document, which cannot
    exist before the snapshot. The executor's Stages 1-2 measurements
    stand on their own (exact shares are measurements, not model claims)
    and do not wait on the audit; the ceiling claim waits on it. No run
    under this handoff is evidence before that chain -- snapshot archive,
    Stage 0 audit, then a Coordinator ledger archive with the evidence
    and decision records -- has completed and been verified.
  execution_dispatch_note: >-
    Written by the design task in worktree
    /Volumes/SSD990/llm/tmp/opencode/design-ecdlp-20260909 under
    DEC-20260909-0d8274. Dispatched ONLY after DEC-20260909-0d8274 is
    committed, so the Executor starts from the frozen approved contract.
    A message or in-session word is never an approval; this handoff plus
    the committed decision are.
