handoff:
  id: TASK-20260906-3623b9
  recorded_at: '2026-09-06'
  goal_id: GOAL-ECDLP-bbc21f
  question_id: RQ-ECDLP-78dbc5
  batch_id: null
  batch_id_note: >-
    Written by the approval batch BATCH-9c5410 (TASK-20260906-67f1ab) per
    design-experiment skill step 5. The EXECUTION batch is not yet opened:
    its batch id is assigned when that batch is opened after
    DEC-20260906-2b1387 lands on main, and dispatch_queue and task_card
    below are null for the same reason.
  dispatch_queue: null
  task_card: null
  role: executor
  from: coordinator
  to: executor
  review_required: true
  objective: >-
    Implement and execute the frozen, APPROVED contract EXP-ECDLP-612fb1
    version 1 (experiments/EXP-ECDLP-612fb1/specification.yaml; status
    approved, approved_by coordinator, frozen true, execution_authorized
    true, per DEC-20260906-2b1387) EXACTLY as written: the batch-reselected
    fixed-size table of H-ECDLP-37dc01 on the generic keyed-random-function
    instrument at N in {2^20, 2^24, 2^30} and on one certified toy
    prime-order curve at N about 2^24, under the contract's stage_plan,
    arms, per_target_protocol, fixture_procedure, exact_basins, controls
    (a)-(n), seed_policy, stopping_rules and invalidation_rules. The frozen
    contract is the ONLY protocol. The Executor records observations only:
    it interprets nothing, draws no conclusion, uses no hypothesis language
    in run records, and changes no status.
  uncertainty_reduced: >-
    Whether, at a = 1/4, r = 2, k = 4 on the generic instrument at both
    N = 2^24 and N = 2^30 with gate G1 reported and gate G2 passed, the
    LOWER-bracket re-selected T/2 table reaches the static T table's
    steady-state per-target success within CI by U = 8T (S1), with the
    relabelled-evidence null at zero and the frozen-table null bit-identical
    to static (S2), a monotone phi decay with gain(0) = 0 (S3), no
    re-selected table's hit rate above the exact oracle top-T_sel share
    (S4), the r-shrinkage tell (S5) and the UPPER-LOWER gap (S6); or whether
    F1 (still CI-separated below static T at U = 16T) holds. The Executor
    produces the measurements; the Coordinator decides after independent
    review.
  inputs:
  - >-
    experiments/EXP-ECDLP-612fb1/specification.yaml (the frozen approved
    protocol, version 1 -- the ONLY protocol; five gate fields set by
    TASK-20260906-67f1ab under DEC-20260906-2b1387; every protocol field
    untouched since design)
  - ledger/hypotheses/H-ECDLP-37dc01.yaml (the specified hypothesis; status unchanged by execution)
  - ledger/questions/RQ-ECDLP-78dbc5.yaml (decision target, definitions and constraints)
  - ledger/proposals/IDEA-20260906-ee3543.yaml (the idea record the contract is derived from)
  - ledger/proposals/IDEA-20260906-aed829.yaml (the basin-model derivations (B1)-(B3) cited as MODEL numbers only)
  - ledger/decisions/DEC-20260906-2b1387.yaml (the approval decision, once committed by TASK-20260906-2d30dd)
  - knowledge/literature/KN-LIT-3060.md (Bernstein-Lange, abstract-level constants)
  - knowledge/literature/KN-LIT-013.md (Corrigan-Gibbs-Kogan, the S T^2 ceiling)
  - knowledge/techniques/KN-TECH-005.md (preprocessing / time-memory tradeoff technique note)
  - >-
    PRIMARY SOURCES: the coordinator's retrieved primary-text plain files
    (scratchpad bl2012.txt, cgk.txt, SCRATCH_SUMMARY.md named in the
    contract and the hypothesis) are NOT in the repository. The primary
    source for the published weight, procedure, cap, the Section 4 case
    study (1.79 (l/T)^{1/2} after 1.24 (lT)^{1/2}) and Table 4.1 is
    Bernstein-Lange, "Computing small discrete logarithms faster", IACR
    eprint 2012/458 (cr.yp.to/dlog/cuberoot-20120919.pdf); the primary
    source for the generic bound is Corrigan-Gibbs-Kogan, "The
    discrete-logarithm problem with preprocessing", IACR eprint 2017/1113.
    The Executor fetches them itself if it needs them and records the
    fetched URL and retrieval date in the run manifest; the contract's
    published numbers are binding as written and are not re-derived from
    memory.
  constraints:
  - >-
    FROZEN CONTRACT. Any needed change to any protocol field (the T_sel
    grid, the U grid, the G1/G2 tolerances, the success margin, the
    pre-registered prediction, seeds, arms, charging) is a versioned
    protocol_amendment proposed under experiments/EXP-ECDLP-612fb1/amendments/
    to the Coordinator -- NEVER an inline edit of specification.yaml, and
    never a re-score of an executed run.
  - >-
    DETERMINISTIC SEEDS exactly as the contract's seed_policy: generic
    walk-key seed s in {1, 2, 3, 4, 5}, target seed 100 + s, PHI Bernoulli
    stream 200 + s, NULL-A relabelling stream 300 + s, tie-breaking
    permutation 400 + s, every arm at the same s sharing the walk, the pool
    and the target sequence; curve arm s in {1, 2, 3} with the same offsets
    plus curve-search seed 1000; 5 independent instances per (N, a) generic,
    3 on the curve. Seeds are recorded in every manifest; no seed adjustment
    ever; a duplicated or missing seed invalidates the cell.
  - >-
    CERTIFICATES on the curve arm: every solved target emits certificate
    kind discrete_log (curve_id, P, Q_u, k_u) re-verified by the run wrapper
    with an INDEPENDENT scalar multiplication [k_u]P == Q_u sharing no code
    with the walk, AND checked against the seeded logarithm x_u (read only
    by the checker; reading it anywhere in the solver path invalidates the
    run); verified: true and verifier_commit recorded per certificate;
    certificate pass count must equal solved count exactly; any failure is
    completed_invalid. Generic runs state certificate kind none explicitly
    and are never quoted as solving logarithms.
  - >-
    ALL COSTS IN COUNTED GROUP OPERATIONS (one per walk step), with restart
    scalar multiplications, table lookups, re-selection integer operations
    and certificate scalar multiplications counted separately as the
    contract's charging block says; S and S_peak in bits under the frozen
    bits_per_entry; wall clock recorded in the manifest and never a decision
    variable. MEASURED and MODELED numbers never share a column.
  - >-
    RUN RECORDS are immutable under experiments/EXP-ECDLP-612fb1/runs/<RUN-ID>/:
    manifest.yaml with the exact command, git commit and dirty-tree state,
    environment and dependency versions, inputs, ALL seeds, complete stdout
    and stderr, raw-result.json, summary.json, validity status and reason,
    timestamps, wall clock and peak_rss_bytes reconciled against the 8 GB
    ceiling. A defective run is superseded by a new run record, never
    edited.
  - >-
    INFERENCE MANIFEST per run: requested_policy executor-implementation,
    backend, resolved model identifier, model_verified, reasoning effort,
    fallback_used with reason (this handoff sets fallback_allowed false and
    degraded_allowed false: if the policy cannot be honoured the Executor
    refuses and reports, never silently substitutes), degraded_requirements.
  - >-
    A TIMEOUT (3600 s per run), crash, memory exhaustion or dependency
    failure is failed_infrastructure and is NEVER a result, positive or
    negative (AGENTS.md rule 5; contract invalidation rule 2); it is
    reported as such and re-planned with a smaller shard within the
    contract's spare runs, never interpreted.
  - >-
    ZERO INTERPRETATION: no conclusion, no status change, no hypothesis
    language, no ledger write (no EV-*, DEC-*, H-* or KN-* record); the
    Executor writes only inside its write_scope.
  - >-
    IMPLEMENTATION PATH (declared here as the contract's required_artifacts
    require): experiments/EXP-ECDLP-612fb1/source/ -- one code path for all
    arms with arm selection by configuration, so that controls differ from
    the treatment in exactly the declared way; hash-pinned by commit in
    every run manifest. Shared harness code may be used only where it is
    already committed and is referenced by commit; nothing under harness/
    or src/ is modified by this task.
  - >-
    GATE ORDER IS BINDING: Stage G (N = 2^20, both a, 5 seeds) with gate G1
    reported before any Stage 1 cell is interpreted; gate G2 evaluated FIRST
    at each N in {2^24, 2^30} before that N's arms; the ROUND-0 IDENTITY
    check (l), the NULL-B / PHI(0) bit-identity, and the exact-coverage
    ceiling check are computed and reported for every applicable cell.
  - >-
    NETWORK: none required by the contract for execution; permitted only
    to fetch the two named primary sources, with the fetch recorded.
  first_batch_scope: >-
    The FIRST execution batch runs Stage G (gates, N = 2^20, a in {1/4,
    1/2}, 5 seeds) and Stages 1-2 (N = 2^24 exact and N = 2^30 sampled, all
    arms the stage_plan names, 5 seeds each) and reports them, including an
    analysis run over the completed stages producing the CI tables for
    exactly those stages and labelled with its coverage. Stage 3 (the curve
    search run and the certified curve arms at N about 2^24, 3 seeds) may
    follow in the same batch ONLY if the per-run (3600 s) and total (12
    CPU-h, 48 runs) budgets allow after Stages G-2; otherwise Stage 3 is
    reported as NOT YET RUN -- never as failed, never as a negative -- and
    is scheduled by the Coordinator in a later batch under the same frozen
    contract.
  deliverables:
  - experiments/EXP-ECDLP-612fb1/source/ (the instrument implementation, one code path, hash-pinned per run manifest)
  - >-
    experiments/EXP-ECDLP-612fb1/runs/RUN-*/ (one immutable run record per
    executed run: manifest.yaml, raw-result.json, summary.json, stdout and
    stderr, the exact basin-size histograms per (N <= 2^24, a, seed) with
    cycle and capped mass, the curve record with point-counting
    verification and every certificate when Stage 3 runs, the per-run
    MEASURED/MODELED cost table)
  - >-
    the analysis run's CI tables (rho_T(U), differences, NULL gains, phi
    decay, r sweep, UPPER-LOWER, CAP retention, early-batch penalty, U_ss,
    U*, the fixture table beside the published values, bootstrap code and
    resample count) over the stages completed in the batch
  - >-
    execution report in the execution batch task directory (assigned at
    dispatch): run inventory, G1 and G2 gate values per N, round-0 identity
    and bit-identity outcomes, exceedance flags, certificate pass counts
    versus solved counts, exhaustion and infrastructure events, validity
    per run, resource measurements, stages not yet run
  artifact_paths:
  - experiments/EXP-ECDLP-612fb1/source/
  - experiments/EXP-ECDLP-612fb1/runs/
  - execution report (task directory assigned by the execution batch queue at dispatch)
  archived_by: TASK-20260906-7a2446
  archived_by_note: >-
    TASK-20260906-7a2446 is the RESERVED snapshot archive of the execution
    batch: it stages exactly the declared source, run and report paths
    before independent review; the ledger archive of that batch follows
    review.
  write_scope:
  - experiments/EXP-ECDLP-612fb1/runs/
  - experiments/EXP-ECDLP-612fb1/source/
  - the execution batch task directory (assigned at dispatch)
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 3600
    memory_gb: 8
    maximum_runs: 48
  contract_budget_envelope:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 12
    maximum_memory_gb: 8
    maximum_runs: 48
    maximum_workers: 1
  budget_note: >-
    Copied verbatim from the contract's budget block: wall_clock_seconds is
    the PER-RUN ceiling (3600 s; exceedance is failed_infrastructure);
    total_cpu_hours 12 and maximum_runs 48 bind the batch, whichever first;
    memory 8 GB is the schema floor and is not expected to be approached
    (exact basins at 2^24 about 0.4 GB); one worker. The contract's own
    run arithmetic is 36 runs with 12 spare for recorded infrastructure
    re-runs. A cell not reached is reported as not run, never as a negative.
  completion_gate:
  - >-
    The contract's stopping rules are met for every stage executed, or a
    budget exhaustion (runs or CPU-hours) is reported as exhaustion with
    the completed prefix and the cells not run listed.
  - >-
    Every required artifact of the contract is present for every executed
    run: schema-complete manifest (command, commit, dirty state,
    environment, requested policy, resolved model, fallback flag, seeds,
    wall clock, peak_rss_bytes), raw-result.json, summary.json, histograms,
    and the analysis CI tables over the completed stages.
  - >-
    Gates G1 (2^20) and G2 (at each of 2^24 and 2^30) are computed and
    REPORTED before any other arm at that N is reported; round-0 identity,
    NULL-B and PHI(0) bit-identity, and exact-coverage-versus-oracle-share
    outcomes are stated per cell.
  - >-
    Certificate pass counts are reported (equal to solved counts on every
    curve-arm run that executed; "not yet run" if Stage 3 did not execute).
  - >-
    Infrastructure failures, if any, are recorded as failed_infrastructure
    with the re-planned shard; no protocol edit anywhere; no status
    language; runs immutable.
  review_reservation: >-
    Results of this task are CLAIM-RELEVANT (review_required: true). The
    snapshot archive TASK-20260906-7a2446, the Validator TASK-20260906-7ec3ea
    (blind re-derivation of the fixture and of the exact top-T share at
    2^24 from the statement of the quantities, blind to the producer's
    implementation, per the contract's review_note) and the Red Team
    TASK-20260906-90e7cf (the null and decay design) are RESERVED for the
    execution batch. No run under this handoff is evidence before that
    chain -- snapshot archive, independent Validator and Red Team reports,
    then a Coordinator ledger archive with the evidence and decision
    records -- has completed and been verified.
  execution_dispatch_note: >-
    Written by approval batch BATCH-9c5410 (TASK-20260906-67f1ab) per
    design-experiment skill step 5. Dispatched ONLY by the execution batch
    opened AFTER DEC-20260906-2b1387 is committed and merged to main, so the
    Executor starts from the frozen approved contract on the base branch. A
    message or in-session word is never an approval; this handoff plus the
    committed decision are.
