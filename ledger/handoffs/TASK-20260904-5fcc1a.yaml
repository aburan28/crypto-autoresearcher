handoff:
  id: TASK-20260904-5fcc1a
  from: coordinator
  to: [validator, red-team]
  created_at: '2026-09-04'
  experiment_id: EXP-MONO-0e6e8f
  hypothesis_id: H-MONO-ebd400
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001

  objective: >-
    Independent review of EXP-MONO-0e6e8f: an unconditioned five-class
    census of 2,249,894 base points across 4 confirmed-non-isogenous
    curves, whose M1 per-subgroup existence checks robustly falsify A_4,
    D_4, C_4, and V_4 (each by hundreds of thousands of observed instances
    in a class it predicts impossible), leaving full S_4 as the sole
    surviving candidate -- while the M3 chi-square (2447.84, df=4) shows a
    real but, per the Executor's own diagnosis, apparently benign
    concentration of excess in only 2 of 5 classes, shrinking 3-7x at the
    larger tested prime.

  review_plan:
    coordinator_prior: >-
      Recorded BEFORE either reviewer is dispatched. This Coordinator finds
      the M1 falsification results very likely correct and robust: the
      margins are enormous (hundreds of thousands of instances per
      falsified class, smallest per-curve populated-class count 4,232),
      the exclusion-count-matches-theoretical-prediction check is a strong
      independent correctness signal, and the underlying S_4 construction
      is already independently verified three separate ways in
      EXP-MONO-815525's own review round. This Coordinator's own moderate-
      confidence open question is the M3 chi-square's own two-class excess:
      it is plausibly an ordinary O(1/sqrt(p))-scale finite-field
      correction (consistent with its shrinking at the larger prime), but
      this Coordinator has not independently derived or bounded the
      expected size of such a correction term, and this lane's own recent
      history (three consecutive rounds finding real, load-bearing defects
      in apparently strong results) argues for genuine scrutiny here
      rather than accepting the Executor's own plausible-sounding
      explanation at face value.
    claim_under_review: >-
      (a) Are the four M1 subgroup falsifications (A_4, D_4, C_4, V_4)
      correct and robust -- i.e. do the disclosed "impossible" classes for
      each subgroup actually follow from correct group theory, and are the
      observed instances genuinely in those classes (not a
      classification/factorization bug)? (b) Is the M3 chi-square excess's
      concentration in exactly the {1^4, 2+2} classes, and its shrinkage
      with p, actually consistent with an ordinary finite-field correction
      term (and can this be bounded or explained), or does it indicate
      something else -- e.g. a genuine, small structural bias, or a
      subtler classification/construction issue specific to those two
      classes?
    joints:
      - joint: J1-SUBGROUP-FALSIFICATION-AUDIT
        assigned_to: validator
        attack_plan: >-
          Independently re-derive, from the structure of AGL(2,2)=S_4 and
          its own subgroup lattice, which conjugacy classes each of A_4,
          D_4, C_4, V_4 does and does not contain -- WITHOUT reading the
          Executor's own stated table first -- and confirm your own answer
          matches experiments/EXP-MONO-0e6e8f/execution_report.yaml's own
          claimed impossible-class table for each subgroup. Then
          independently re-verify, by direct recomputation on a sample of
          at least 30 instances drawn from raw-result.json (spanning all
          four curves and multiple classes, including specifically several
          instances the record claims fall in each of the "impossible for
          A_4" and "impossible for D_4" classes), that the reported
          classification is correct -- reconstruct Q_e(T) from the
          recorded (curve, e1,e2,e3) and independently factor it yourself.
      - joint: J2-EXCLUSION-COUNT-VERIFICATION
        assigned_to: validator
        attack_plan: >-
          Independently verify the claimed exact exclusion counts (C1:
          10,301; C2: 1; C3: 101; C4: 305) by deriving, from first
          principles, the expected count of (e1,e2,e3) triples with
          Res(g,f)=0 for each curve's own f, and confirm your own
          prediction matches. This is presented as a strong correctness
          check in the record; independently confirm it actually is one
          (i.e. that the formula/reasoning behind the claimed exact match
          is sound), not merely that the numbers happen to match.
      - joint: J3-CHI-SQUARE-ANOMALY-INVESTIGATION
        assigned_to: red-team
        attack_plan: >-
          Investigate the M3 chi-square excess concentrated in classes
          `1^4` and `2+2` (over- and under-represented respectively
          relative to predicted S_4 Chebotarev density, shrinking 3-7x at
          the larger tested prime p=1009 vs p=101). Derive or bound, from
          first principles (e.g. via Weil-bound-style point-counting
          corrections, or by considering how g's own splitting behavior
          over F_p correlates with quadratic-residue-type biases), what
          size of deviation from the naive asymptotic Chebotarev density
          would be EXPECTED at these specific finite primes for exactly
          these two classes, and check whether the observed deviation is
          consistent with that expectation or is anomalously large. If
          you cannot derive a clean bound, at minimum construct a
          plausible mechanism and assess whether the observed p-scaling
          (shrinking as p grows) is the correct signature of that
          mechanism specifically, as opposed to some other explanation
          (e.g. a subtle bias in how e1,e2,e3 were sampled, or a
          classification asymmetry between 1^4 and 2+2 specifically).
      - joint: J4-ADVERSARIAL-RECONSTRUCTION-AND-SCOPE-CHECK
        assigned_to: red-team
        attack_plan: >-
          Adversarially attempt to construct a DIFFERENT null object (in
          the spirit of the null-object control that felled
          EXP-MONO-815525) that could ALSO reproduce this experiment's own
          M1 falsification pattern without actually having full S_4
          monodromy -- i.e., is there any conceivable non-S_4 construction
          that would independently populate all three of {2+1+1, 4, 3+1}
          at the observed rates while still being a "smaller" group in
          some sense? If you cannot construct one, say so explicitly and
          explain why the M1 test's own logic is airtight (each
          individual class's presence directly contradicts a specific
          named subgroup's own conjugacy-class structure, which is a much
          stronger form of evidence than the frequency-matching M3 test
          alone). Also verify the record's own claim_boundary: does ruling
          out A_4/D_4/C_4/V_4 actually leave ONLY S_4 among ALL transitive
          subgroups of S_4 (check the full subgroup lattice of S_4 -- are
          there other transitive subgroups not named in this record that
          also need to be considered, e.g. is there another conjugacy
          class of order-4 or order-8 subgroups not equivalent to the ones
          named)?
    blindness:
      lifted_for: null
      rationale: null
      declaration: >-
        Both reviewers are launched as fresh subagents with no prior
        context; each must independently state whether it read the other's
        output or any sibling review directory before forming its own
        conclusions.
    proves_too_much:
      objects:
        - >-
          J1's own re-derivation of each subgroup's conjugacy-class
          structure, if applied to S_4 ITSELF, must find that S_4 has NO
          impossible classes (all five classes are populated in S_4) --
          confirming the reviewer's own method doesn't spuriously produce
          "impossible" classes for the group that should have none.
      failure_signature: >-
        If J1's method reports any class as "impossible" for full S_4
        itself, the method is wrong and must be corrected before it can be
        trusted for the four proper subgroups.
    blind_rederivation:
      required: true
      quantity: >-
        The exact factorization classification of at least 10 specific
        (curve, e1, e2, e3) instances drawn from raw-result.json
      assigned_to: validator
      blind_from:
        - experiments/EXP-MONO-0e6e8f/execution_report.yaml
        - experiments/EXP-MONO-0e6e8f/implementation/run_uncond_census.py

  budget:
    wall_clock_seconds: 3600
    memory_gb: 4
    maximum_runs: 0

  constraints:
    - Do not commit or push. Report only, in your own review directory under experiments/EXP-MONO-0e6e8f/reviews/{validator,red-team}/.
    - Do not read the sibling reviewer's directory before forming your own conclusions; disclose whether you did.
    - Do not change any research status, ledger record, or hypothesis field.

  completion_gate: >-
    Both validation-report.yaml and red-team-report.yaml filed, each
    addressing its owned joints explicitly, before the Coordinator
    composes the decision determining how this result bears on
    IDEA-20260904-ad63fe's own broader full-S4 claim.

  inference:
    requested_policy: review-adversarial
    reasoning_effort: xhigh
    runtime: claude_code
    resolved_model_id: claude-sonnet-5
    model_verified: true
    fallback_used: false
    degraded_requirements: []
