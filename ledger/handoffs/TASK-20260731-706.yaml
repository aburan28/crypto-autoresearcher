handoff:
  id: TASK-20260731-706
  from: coordinator
  to: coordinator
  objective: >-
    Commit the independent TASK-20260731-705 validation package together with
    the scoped evidence record EV-AES-002, the batch decision DEC-20260731-025,
    and — if and only if the validator's promotion-fitness verdict supports it —
    the knowledge entry KN-FIND-028 carrying the two durable negative facts,
    then perform the official BATCH-002 state transition.
  uncertainty_reduced: >-
    Whether BATCH-002's three producer outputs — a promotable derivation note, a
    repaired instrument, and a self-contained gate measurement — plus the
    super-box ideation outcome yield an admissible next mechanism, a scoped
    closure, or a pause; recorded durably rather than left in a working tree.
  inputs:
    - The four TASK-20260731-705 validation artifacts
    - The verified TASK-20260731-704 producer snapshot
    - DEC-20260731-011, EV-AES-001, GOAL-AES-001, RQ-AES-001
  constraints:
    - >-
      Run alone. Stage only the declared review and ledger paths. No other task
      may hold the Git index or HEAD concurrently.
    - >-
      Only the Coordinator may write official records.
    - >-
      ORDERING IS LOAD-BEARING. KN-FIND-028 may be written here ONLY because its
      underlying derivation note was committed earlier, in the TASK-20260731-704
      snapshot, and independently reviewed in TASK-20260731-705. That is the
      docs/claims-and-verification.md refutation-artifact discipline
      DEC-20260731-011 deliberately deferred to this batch. If the validator's
      check (a) does NOT return the derivation note as fit for promotion as a
      standalone artifact, DO NOT promote: record a concrete `not_warranted`
      reason in knowledge_promotion instead, and do not write
      knowledge/findings/KN-FIND-028.md.
    - >-
      EV-AES-002 records the three validator checks as SEPARATE observations and
      carries claim_tier: toy. A repaired instrument and a passing derivation
      check are REPRODUCIBILITY and DERIVATION facts; neither may be upgraded
      into empirical cryptanalytic evidence about AES. The GATE-601-B
      measurements are scoped to a small-scale AES-shaped cipher and to the two
      implementations written in TASK-20260731-703.
    - >-
      No literature comparison, recalled baseline, sota_delta, bit-margin or
      extrapolation from the struck CAND-601-B material may enter EV-AES-002 or
      DEC-20260731-025 in any form. Any literature statement that does appear
      anywhere carries the unverified-from-memory qualifier.
    - >-
      DEC-20260731-025 records exactly ONE next action and fills
      knowledge_promotion (promoted KN-* IDs, or a concrete not_warranted
      reason). Scope every conclusion to the exact objects, round counts, cell
      widths, implementations and budget actually tested.
    - >-
      If the decision is adverse to any candidate, seek the strongest checkable
      refutation artifact the result admits and confirm it is already archived
      before the decision relies on it. `reject_scoped` on a single unreplicated
      empirical-only run is FORBIDDEN — use `weaken` plus replication.
    - >-
      Any asymptotic-complexity claim remains subject to all four promotion
      gates; none may transition toward `supported` on this batch's evidence.
      Record the gates' status rather than passing over them.
    - >-
      knowledge/INDEX.md must be regenerated per the /curate-knowledge
      conventions when KN-FIND-028 is written. Because this ledger commit must
      change EXACTLY its three declared artifact paths, commit the regenerated
      INDEX.md in a separate, isolated commit immediately preceding the ledger
      commit — the same pattern BATCH-001 used for the inference amendment
      (0137a051 as the snapshot's parent) — and record that predecessor SHA as
      this commit's parent in the receipt.
    - >-
      Update the GOAL-AES-001 checkpoint after this ledger archive, preserving
      exactly ONE next action, in its own follow-on commit. A record cannot carry
      the SHA of the commit that contains it, so the ledger commit SHA is bound
      to the goal record afterwards, never inside.
    - >-
      Do not write the commit's own SHA into an artifact inside that commit.
    - >-
      GOAL-AES-001 does NOT close on this batch. Under the 0137a051 amendment a
      three-distinct-model closure quorum is unobtainable in this harness, so
      `completed` is unreachable regardless of outcome. Record no attestation.
  deliverables:
    - EV-AES-002.yaml
    - DEC-20260731-025.yaml
    - KN-FIND-028.md
  artifact_paths:
    - ledger/evidence/EV-AES-002.yaml
    - ledger/decisions/DEC-20260731-025.yaml
    - knowledge/findings/KN-FIND-028.md
  archived_by: TASK-20260731-706
  inference:
    policy: coordinator-orchestration-code
    requested_policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
    standing_basis: >-
      inference-amendment commit 0137a051eb5828789eb267fa83c8278086578d4c.
  budget:
    wall_clock_seconds: 600
    memory_gb: 1
    maximum_runs: 1
  completion_gate:
    - >-
      The evidence and decision records preserve the exact reviewed scope,
      objects, round counts, cell widths and claim tier, and no record asserts
      anything about full-round or deployed AES.
    - >-
      KN-FIND-028 is written if and only if the validator returned the
      derivation note as fit for promotion as a standalone artifact; otherwise
      knowledge_promotion carries a concrete not_warranted reason and the file is
      not created.
    - >-
      Git verifies the commit is reachable from HEAD, has the expected parent,
      changes exactly the declared paths, matches the recorded SHA-256 hashes,
      and names the task and record IDs.
    - >-
      The decision records exactly one next action and a filled
      knowledge_promotion field.
    - >-
      archive.record_ids lists EV-AES-002, DEC-20260731-025 and KN-FIND-028, and
      each declared artifact filename contains one of those IDs.
  return_format: >-
    The ledger receipt plus the commit SHA, its parent, the changed paths, the
    promotion decision and its basis, and the single next action recorded for
    GOAL-AES-001.
