handoff:
  id: TASK-20260929-9dbd8a
  from: coordinator
  to: executor
  goal_ids: [GOAL-SEMBIN-fcb7a2]
  question_id: RQ-SEMBIN-9e8f82
  experiment_id: EXP-SEMBIN-e76704
  hypothesis_id: H-SEMBIN-934774
  run_id: RUN-SEMBIN-79996f
  authorised_by: DEC-20260929-79ba35
  archived_by: TASK-20260929-e3eed9
  archived_by_note: >-
    TASK-20260929-e3eed9 is the Coordinator's post-run snapshot archive of
    the run directory, minted and checked by the session on 2026-09-29. The
    executor makes no git write.

  objective: >-
    Execute the approved, frozen EXP-SEMBIN-e76704 exactly once, from a clean
    checkout of the approved commit, and preserve every output unaltered.
    Exact launcher, from the repository root:
    python3 experiments/EXP-SEMBIN-e76704/src/run_separation.py experiments/EXP-SEMBIN-e76704/runs/RUN-SEMBIN-79996f
  uncertainty_reduced: >-
    Whether the committed, sha256-pinned instrument reproduces the exploratory
    exhaustive counts of 2026-09-27 (T1-T4) with its controls C1/C2 passing.
    Scoring is the runner's own verdict block; the executor interprets
    nothing.

  inputs:
    - experiments/EXP-SEMBIN-e76704/specification.yaml (the frozen contract; read in full before launch)
    - experiments/EXP-SEMBIN-e76704/src/run_separation.py, ffd_semaev.py, recomb_search.py, fastfall.py (execute only; never edit)
    - ledger/decisions/DEC-20260929-79ba35.yaml
    - ledger/hypotheses/H-SEMBIN-934774.yaml
    - templates/research-records.md and tools/validate_ledger.py check_run (run-record schema for manifest.yaml)

  dispatch_preconditions:
    - >-
      The session's commit of the specification, IDEA-20260929-0238ee,
      H-SEMBIN-934774, DEC-20260929-79ba35 and this handoff is verified and
      pushed (DEC-20260929-79ba35 NA-1). Until then, do not launch.
    - >-
      sha256 of each src/*.py at the checkout equals
      specification.inputs.source_files (3ba1755a... run_separation.py,
      15acdaec... ffd_semaev.py, bc3ecf6d... recomb_search.py, 6eaae881...
      fastfall.py; full values in the specification). Mismatch: stop (SR-3).
    - >-
      experiments/EXP-SEMBIN-e76704/runs/RUN-SEMBIN-79996f/ does not exist.
      If it does, stop (SR-3).

  constraints:
    - >-
      Run the launcher exactly once (SR-1). A run that exits 0 is final
      whatever its verdict and is never re-run for a different verdict.
    - >-
      Never edit anything under experiments/EXP-SEMBIN-e76704/src/, the PRED
      block, or the specification. Never write outside the run directory.
    - >-
      Capture the process's stdout and stderr into stdout.log and stderr.log
      in the run directory by redirection; redirection does not change the
      launcher. Record the exact command line in command.txt.
    - >-
      Exit 3, any other non-zero exit, or a watchdog kill is an
      infrastructure event, not evidence (SR-2). Preserve every file the
      attempt wrote, report the traceback, do NOT re-attempt in this task;
      the Coordinator decides the re-attempt under a new RUN id.
    - >-
      Single process, no parallelism (maximum_workers 1). Watchdog: kill at
      86,400 s wall clock or 4 GB resident, and report which.
    - >-
      Do not interpret, re-score, summarise as support, or describe the
      result as a finding. Report the runner's verdict block and
      all_predictions_confirmed / controls_pass verbatim.
    - >-
      No git write operations, no subagents, no edits to any ledger record.
      Do not create EV-SEMBIN-c71cad.
    - >-
      Record in manifest.yaml inference.requested_policy
      executor-implementation and the model actually serving, with
      fallback_used and its reason if they differ; never silently substitute.

  deliverables:
    - results.json, manifest.json, log.txt -- written by the runner itself, unaltered
    - stdout.log, stderr.log, command.txt, environment.json -- captured by the executor
    - raw-result.json -- byte-identical copy of results.json, its sha256 recorded in manifest.yaml
    - >-
      manifest.yaml -- the run record in the run schema checked by
      tools/validate_ledger.py (top-level key run with id RUN-SEMBIN-79996f,
      experiment_id EXP-SEMBIN-e76704, status, code {commit, dirty, command},
      environment, inputs {parameters including field_bits [4, 6]}, timing,
      result {exit_code, verdict copied verbatim, all_predictions_confirmed,
      controls_pass, certificate {kind none, verified true, verifier
      no-claim}}), plus the sha256 of every src/*.py observed at launch
    - a short task report in the return message (not a file)

  artifact_paths:
    - experiments/EXP-SEMBIN-e76704/runs/RUN-SEMBIN-79996f/results.json
    - experiments/EXP-SEMBIN-e76704/runs/RUN-SEMBIN-79996f/manifest.json
    - experiments/EXP-SEMBIN-e76704/runs/RUN-SEMBIN-79996f/log.txt
    - experiments/EXP-SEMBIN-e76704/runs/RUN-SEMBIN-79996f/stdout.log
    - experiments/EXP-SEMBIN-e76704/runs/RUN-SEMBIN-79996f/stderr.log
    - experiments/EXP-SEMBIN-e76704/runs/RUN-SEMBIN-79996f/command.txt
    - experiments/EXP-SEMBIN-e76704/runs/RUN-SEMBIN-79996f/environment.json
    - experiments/EXP-SEMBIN-e76704/runs/RUN-SEMBIN-79996f/raw-result.json
    - experiments/EXP-SEMBIN-e76704/runs/RUN-SEMBIN-79996f/manifest.yaml
  write_scope:
    - experiments/EXP-SEMBIN-e76704/runs/RUN-SEMBIN-79996f/

  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false

  budget:
    wall_clock_seconds: 86400
    memory_gb: 4
    maximum_runs: 1
  budget_note: >-
    Machine-protection ceilings, not estimates (the exploratory duration was
    not recorded). Watchdog expiry checkpoints the task as an infrastructure
    event; it is never evidence and never exhausts the campaign.

  completion_gate:
    - The launcher exited 0 and results.json is written in the run directory; scoring is the runner's own verdict block.
    - manifest.json source_sha256 equals specification.inputs.source_files for all four files (IR-1).
    - Every path in artifact_paths exists and nothing outside write_scope was written.
    - raw-result.json is byte-identical to results.json.
    - >-
      A non-zero exit does NOT meet this gate: the task returns as an
      infrastructure failure with the preserved partial files and the
      traceback, and that is a complete, honest return rather than a result.

  return_format: >-
    Plain report: exit code; wall time; the results.json verdict block,
    all_predictions_confirmed and controls_pass copied verbatim; the four
    observed src sha256 values; the list of files written with sizes; any
    deviation from this card. No interpretation.

  review_required: true
  review_plan: null
  review_plan_note: >-
    This producer task opens no review round. The Coordinator writes the
    review_plan on the validator handoff after TASK-20260929-e3eed9 archives
    the run (DEC-20260929-79ba35 NA-3, NA-4), before any reviewer runs.
