handoff:
  id: TASK-20260826-9605ae
  from: coordinator
  to: validator
  goal_id: GOAL-MLKEM-005
  batch_id: BATCH-762807
  question_id: RQ-MLKEM-001
  opening_decision: DEC-20260824-5e222e
  objective: >-
    Independently verify, on the committed snapshot, that the three joints assigned
    to you hold or break: J1 -- re-derive the root-Hermite correction from the
    definition and the parameters ALONE and confirm the q^(1/2 - 1/(2d)) distortion,
    BLIND to the producer's D6 implementation and report; J2 -- attack the
    signal-safety of the SIGTERM handler and determine whether the STARTED stub and
    the KILLED_PARTIAL flush produce a usable record under a REAL kill or only on the
    happy path; J3 -- determine whether the recorded tour count is the number of
    TOURS or something else. Also verify receipt and artifact integrity, and return
    an admissibility_ruling.
  uncertainty_reduced: >-
    Whether the repaired instrument's three checkable core quantities and mechanisms
    -- the corrected root-Hermite factor, the kill-time record, and the tour count --
    are what the producer says they are, established by independent computation on
    artifacts rather than by reading the producer's account of them.
  assigned_joints:
    J1: >-
      D6, the root-Hermite correction. RE-DERIVE INDEPENDENTLY from the definition of
      the root Hermite factor and the parameters alone, and confirm the
      q^(1/2 - 1/(2d)) ratio -- 57.242 at (q=3329, d=512) -- from the formulas, not
      from the executor's implementation or report. BLIND RE-DERIVATION.
    J2: >-
      D1 and D2. Do the STARTED stub and the SIGTERM flush produce a record UNDER A
      REAL KILL, or only on the happy path? Attack the signal-safety of the handler:
      what it allocates, what it opens, what happens if the signal arrives mid-write,
      and what happens if SIGTERM lands while the process is inside an fplll C call.
      Try to produce a truncated, empty or unparseable results file.
    J3: >-
      D5. Is the value read from bkz.trace the number of TOURS, or something else the
      executor mistook for it -- child nodes of another label, preprocessing
      sub-calls, or an enumeration count? Check the label predicate against fpylll
      0.6.4's own tracer and cross-check against an independently instrumented driving
      loop on the same tiny lattice.
  inputs:
    - The committed snapshot of TASK-20260826-9e9d53 and its receipt.
    - >-
      review-plan/review_plan.yaml and review-plan/assignment-TASK-20260826-9605ae.yaml
      -- your joints, your attack plans, your read boundary and your blind_from list.
    - The producer's twelve declared artifacts and its implementation report.
    - >-
      ledger/decisions/DEC-20260815-3e8e9c.yaml conditions (i) and (v) -- what the
      fixes were required to be.
    - >-
      ledger/evidence/EV-MLKEM-59e4a4.yaml and both BATCH-f9780d reviews -- the
      committed statement of the defects under repair.
    - >-
      coordination/goals/GOAL-MLKEM-005/batches/BATCH-0d5018/tasks/TASK-20260815-f14d3c
      -- the committed precedent for the bkz.trace tour count and the standard delta_0
      formula.
  constraints:
    - >-
      INDEPENDENT SESSION. You did not produce, run, dispatch or archive any artifact
      under review, and you say so.
    - >-
      SIBLING-BLIND. Do NOT read
      coordination/goals/GOAL-MLKEM-005/batches/BATCH-762807/reviews/TASK-20260826-5ee48b
      or
      coordination/goals/GOAL-MLKEM-005/batches/BATCH-762807/review-plan/assignment-TASK-20260826-5ee48b.yaml.
      Attest to what you read.
    - >-
      J1 IS A BLIND RE-DERIVATION. Derive from the STATEMENT of the quantity and the
      parameters, never from the producer's implementation, notes or report. Record
      your derivation BEFORE reading theirs and declare the read order in your
      attestation.
    - >-
      REPORT ON YOUR OWN JOINTS, NOT ON THE WHOLE CLAIM. You cannot see the other
      joints by construction, so a whole-claim verdict from you would be an opinion
      formed from a fraction of the evidence. The Coordinator composes.
    - >-
      ZERO LATTICE COMPUTE AT SCALE. Your own probes stay at acceptance scale. DO NOT
      RUN ANY d=512 REDUCTION AND DO NOT RE-RUN THE 100-BIT CELL; that re-run is
      refused by DEC-20260824-5e222e and no review authorises it.
    - >-
      A TIMEOUT, CRASH OR MISSING DEPENDENCY IN YOUR OWN PROBE IS INFRASTRUCTURE
      SIGNAL, never a finding against the producer and never a mathematical result.
    - >-
      NEVER FABRICATE a command, an output, a timing or a hash. Recompute what you
      assert; attribute what you quote.
    - >-
      DO NOT MOVE ANY STATUS, do not write any ledger record, do not commit, and write
      nothing outside your own review directory.
    - >-
      AN UNREACHED JOINT IS REPORTED AS NOT REACHED WITH WHAT YOU TRIED. Do not
      silently drop one and do not quietly extend your budget; disclose any overrun in
      the attestation.
    - >-
      ASSERT NOTHING ABOUT ML-KEM AT ANY PARAMETER SET. Claim tier under review is toy
      and the batch is an instrument repair.
    - >-
      A PASSING ACCEPTANCE SUITE IS NOT A RESULT AND MAY NOT BE DESCRIBED AS ONE.
      Adjudicate a green board as carefully as a red one.
  deliverables:
    - >-
      reviews/TASK-20260826-9605ae/validation-report.yaml -- per-joint findings for
      J1, J2 and J3 with verdicts holds / breaks / inconclusive, every recomputation
      with its recomputed value beside the declared one, receipt and artifact
      integrity checks, any FAIL or NOT_REACHED in acceptance_results.json adjudicated
      for what it does and does not mean, and an admissibility_ruling block.
    - >-
      reviews/TASK-20260826-9605ae/attestation.yaml -- role, independent_session true,
      requested_policy and resolved model, model_verified with its basis, exactly what
      you read and in what order, the blind_from compliance statement for J1, the
      sibling-blindness statement, and any budget overrun disclosed.
  artifact_paths:
    - coordination/goals/GOAL-MLKEM-005/batches/BATCH-762807/reviews/TASK-20260826-9605ae/validation-report.yaml
    - coordination/goals/GOAL-MLKEM-005/batches/BATCH-762807/reviews/TASK-20260826-9605ae/attestation.yaml
  archived_by: TASK-20260826-70d800
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 900
    memory_gb: 2
    maximum_runs: 1
    charged_runs_authorised: 0
    charged_runs_note: >-
      ZERO CHARGED EXPERIMENT RUNS. A reviewer's own adversarial probes are NOT
      charged runs under this batch's maximum_runs definition. `maximum_runs: 1` is
      the dispatcher's minimum positive integer and is NOT an authorisation. See
      batch.yaml PD-1.
    justification: >-
      900 s. THREE ADVERSARIAL JOINTS AT THE MEASURED PER-JOINT RATE OF ROUGHLY 300 s
      (DEC-20260824-257f35 PD-1 measured 278 s and 322.5 s per joint across recent
      rounds). Overrun in AGENT time is expected, must be disclosed in the
      attestation, and must NOT be met by reallocating a ceiling; an unreached joint
      is reported as NOT REACHED with what was tried.
  completion_gate:
    - >-
      Each of J1, J2 and J3 has an explicit verdict (holds / breaks / inconclusive)
      with the artifact and the computation it rests on.
    - >-
      J1's re-derivation is recorded and its blind_from compliance is attested with
      the read order stated.
    - >-
      J2 reports what was actually observed under a real signal, including any attempt
      to produce a truncated, empty or unparseable record.
    - >-
      J3 states what quantity the instrument counts and whether it is the number of
      tours, with the cross-check that established it.
    - >-
      Every declared producer artifact's presence and integrity is checked against the
      snapshot receipt, with any mismatch reported as fatal.
    - >-
      Any FAIL or NOT_REACHED in acceptance_results.json is adjudicated rather than
      passed over, and a green board is adjudicated for what it does and does not
      confirm.
    - >-
      An admissibility_ruling block is returned as ADMIT / DO NOT ADMIT / NOT IN MY
      SCOPE with the reason.
    - No d=512 reduction was run and the 100-bit cell was not re-attempted.
    - The attestation names the sibling directory and assignment as unread.
    - >-
      No status moved, no ledger record was written, nothing was committed, and
      nothing was written outside the review directory.
  return_format: >-
    Per-joint verdicts with the computation each rests on, the integrity checks with
    recomputed values, the adjudication of the acceptance board, the admissibility
    ruling with its reason, the read order for J1, and any unreached joint reported as
    NOT REACHED.
