    - ledger/questions/RQ-XEDN-001.yaml
    - ledger/hypotheses/H-XEDN-001.yaml
    - experiments/EXP-XEDN-002/specification.yaml
    - experiments/EXP-FB3-001/amendment-001.yaml
    - coordination/goals/GOAL-ICLIFT-001/batches/BATCH-001/tasks/TASK-20260724-226/design_report.yaml
  archived_by: TASK-20260724-227
  inference:
    policy: coordinator-ultra-code
    fallback_allowed: true
    independent_session_required: false
  budget:
    wall_clock_seconds: 2400
    memory_gb: 1
    maximum_runs: 1
  completion_gate:
