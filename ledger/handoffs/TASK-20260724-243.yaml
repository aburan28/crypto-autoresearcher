handoff:
  id: TASK-20260724-243
  from: coordinator
  to: coordinator
  objective: >-
    Open GOAL-ICLIFT-001 BATCH-001: specify and approve RQ-XEDN-001 and
    H-XEDN-001, freeze the EXP-XEDN-002 exact-census contract, and freeze the
    EXP-FB3-001 exact-counting amendment, so that both producer tasks execute
    from immutable approved protocols.
  uncertainty_reduced: >-
    Whether the two remaining open measurement routes on the index-calculus and
    lifting lines have executable, pre-registered protocols at all: EXP-FB3-001
    was approved but names an implementation absent from this repository, and the
    EXP-XEDN-001 phase-2 gate was contracted as an infeasible rare-event
    measurement.
  inputs:
    - AGENTS.md
    - .claude/skills/coordinate-research-goal/SKILL.md
    - ledger/RQ-FB3-001.yaml
    - ledger/H-FB3-001.yaml
    - experiments/EXP-FB3-001/specification.yaml
    - inputs/h100_session/h016_base_yield.json
    - experiments/EXP-XEDN-001/contract.md
    - experiments/EXP-XEDN-001/xedni_sections.py
    - experiments/EXP-XEDN-001/smoke_results.json
    - knowledge/literature/KN-LIT-020.md
    - knowledge/literature/KN-LIT-021.md
  constraints:
    - Only the Coordinator may create or approve official records.
    - >-
      Do not modify the frozen EXP-FB3-001 specification or any frozen root-level
      ledger record; strengthen the protocol by an additive amendment only.
    - Do not modify anything under experiments/EXP-XEDN-001.
    - Do not run any experiment code in this task.
    - >-
      Record explicitly that the original EXP-XEDN-001 phase-2 design is
      infeasible as contracted, and that this is a methodology observation rather
      than evidence about the mathematics.
  deliverables:
