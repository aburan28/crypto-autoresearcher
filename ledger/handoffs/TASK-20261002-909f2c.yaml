      blind_from entry is a hit and a non-canonical entry sets
      blind_from_respected false; the execution-phase declaration's time
      scope is implemented as the design states.
    - ER-5 D-7 and D-8. Every internal RNG seed is declared in the manifest; the AC-12 mutation is the F-10 shape; a failed or expired attempt leaves a record validate_ledger.py can see.
    - >-
      ER-6 PLAN. trial-plan-r1.json lists all 20 trials with the
      specification's cells and candidate rule, the twenty run ids the session
      recorded (none equal to an earlier plan's or a bound directory's), the
      order the accepted design or amendment fixes, Linux as an execution-card
