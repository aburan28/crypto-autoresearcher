      every r1 file, specification_sha256 and the amendment's sha256 if
      approved, and the per-trial projections and claim-TTL guidance the
      design recomputed. It must load in tools/experiment_execution.py; use
      only its read-only status mode to show this.
    - >-
      ER-7 CI-6 and DR-13. Unit and integration tests only on synthetic cells
      with field degree n outside {4, 7, 11, 12, 13, 31, 131}, the test trees
      defining every synthetic cell the design names, writing only to your
