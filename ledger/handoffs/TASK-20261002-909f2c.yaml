    - ER-8 CI-5. Code runs under /usr/local/bin/python3, CPython 3.11.15 (no random.binomialvariate or other 3.12+ API); the manifest records the execution host's interpreter per run.
    - ER-9 Declared read set in your report, in order, as bare canonical paths; private scratch only, <session scratchpad>/BATCH-521e9d/TASK-20261002-909f2c/; no whole-tree export; memory within 8 GB.
    - ER-10 Folded block scalars for prose containing a colon followed by a space; no mapping key at list-item indent; parse-check the report and validate the plan JSON before handing back.
