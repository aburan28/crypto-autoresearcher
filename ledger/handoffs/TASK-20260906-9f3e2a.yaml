  completion_gate:
    - The six producer paths were re-hashed and matched against what was recorded before the review was dispatched, and the pre-review commit was confirmed an ancestor of HEAD; the result is recorded either way, and a mismatch stopped the archive.
    - The commit changes EXACTLY the five declared ledger-archive paths, and archive.path_sha256 covers ALL FOURTEEN expected paths as content_first binding requires.
    - The ledger identifiers were checked with tools/allocate_id.py --check, any substitution is a new identifier recorded at every declared site, and the outcome is in the receipt.
    - check_review_independence.py --batch was run on this batch and its exact command, verbatim output and exit code are in the receipt; --blind-history was not run and the receipt says why.
    - Every joint J1-J4 has a composed verdict or is recorded as UNCOVERED, and the composition states that one reviewer ran with blindness deliberately lifted.
    - The coordinator prior is compared against the outcome element by element across all eight elements.
    - Every finding is classified by what it changes about the enactment path, and a round in which both packages are sound is recorded as a complete result.
    - The decision states plainly that the redraft has had NO adversarial pass and that this round may not be treated as one.
    - CF-9's outcome is recorded at its own strength, with an explicit statement that it lifts no prohibition by itself and that unattestable provenance is never negative mathematical evidence.
    - The evidence record carries claim_tier, proof_status, proof_refs and certificate.kind none, states its tested scope, and does not record a second correlated session as an independent replication.
    - The decision fills knowledge_promotion on this round's evidence, records procedure_deviations including the batch's opening deviation, approves no amendment, enacts nothing, and makes no status transition.
    - experiments/, inputs/ and every artifact of BATCH-752ef2 and BATCH-79a0cb are unmodified; CF-13 and CF-19 are carried forward and not performed.
    - The citation prohibition and its predicate extension are retained verbatim or lifted with an explicit scope, with reasoning recorded for this round rather than inherited.
    - Every undispatched carried_forward item appears in next_actions with its origin, and what CF-1, CF-9, CF-11, CF-20 and CF-24 discharged and did not is stated.
    - The goal checkpoint shard is written, GOAL-SSI-001 stays active, and exactly one next_action remains on the head.
    - latest_verified_commit was advanced only if this task actually verified a commit, and otherwise left with its reason recorded.
    - The commit message states record identifiers and locators only; the branch is pushed and the PR against main names the new records.
  return_format: >-
    A short report naming the pre-review commit re-verification result; each gate run
    or recorded OUTSTANDING with its reason; the four composed joint verdicts; what
    the round changed about the enactment path and what it did not; CF-9's outcome at
