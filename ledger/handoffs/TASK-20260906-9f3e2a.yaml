  task_card: coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/tasks/TASK-20260906-9f3e2a/task_card.yaml
  objective: >-
    Run alone after both producers and the review have returned; RE-VERIFY THE
    PRE-REVIEW COMMIT; compose the four per-joint verdicts and both producer
    packages into one evidence record and one decision; compare the recorded
    coordinator prior against the outcome element by element; carry forward every
    undispatched item with its origin; checkpoint the goal in a write-once shard;
    and commit exactly the declared set - without approving the redraft, enacting
    anything, moving any status, or inventing a result the reports do not carry.
  uncertainty_reduced: >-
    Whether the round's outcome, its scope limits and its consequences for the
    enactment path are durably recorded before any successor batch or enacting
    decision is opened.
  inputs:
    - The two producer packages and the review report of this batch, at their declared paths
    - The dispatching session's record of the PRE-REVIEW COMMIT - its sha, its parent, and the sha256 of each of the six producer paths as they stood when the review was dispatched
    - coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/review_plan.yaml, including the recorded coordinator_prior and its eight elements
    - coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9/batch.yaml carried_forward, and ledger/decisions/DEC-20260906-78d9f7.yaml, this batch's opening decision
    - ledger/decisions/DEC-20260905-3b8e94.yaml, ledger/evidence/EV-SSI-1a95bc.yaml, ledger/goals/GOAL-SSI-001/goal.yaml and checkpoints/BATCH-79a0cb.yaml
    - templates/research-records.md and docs/claims-and-verification.md
  constraints:
    - RUN ALONE, and stage only the five declared paths by exact pathspec, in ONE commit. path_sha256 must nevertheless cover all FOURTEEN expected paths, because binding_mode is content_first.
    - RE-VERIFY THE PRE-REVIEW COMMIT FIRST, AND IT IS A COMPLETION GATE - recompute the sha256 of all six producer artifact paths, confirm they match what the dispatching session recorded BEFORE the review was dispatched, and confirm that commit is an ancestor of HEAD. A MISMATCH MEANS THE REVIEWED OBJECT CHANGED AFTER IT WAS REVIEWED - stop, record it, and return to the Coordinator. Never repair a mismatch by re-hashing.
    - CHECK THE LEDGER IDENTIFIERS BEFORE WRITING THEM - `tools/allocate_id.py --check EV-SSI-804e09` and `--check DEC-20260906-408595`. They were re-checked at authoring only by direct search, which is weaker than the tool. A substitution is a NEW identifier at every declared site, never a rename.
    - RUN `python3 tools/check_review_independence.py --batch coordination/goals/GOAL-SSI-001/batches/BATCH-60d6b9` and record the exact command, verbatim output and exit code. A failure is a FINDING and blocks the archive until the Coordinator rules. NEVER RECORD A PASS YOU DID NOT SEE. DO NOT RUN --blind-history - this batch declares no blind phase and that mode has no object here.
    - RUN `python3 tools/validate_ledger.py` on the merged tree and confirm the paths written here add no new error. IF THIS TASK HOLDS NO SHELL, record each gate as OUTSTANDING with that reason and say plainly that reading a file the tool renders is weaker than running the tool.
    - COMPOSE THE VERDICTS YOURSELF. A joint with no verdict is UNCOVERED, never assumed to hold. Record that ONE reviewer ran, of one model family, in one session, with blindness deliberately lifted.
    - WEIGHT FINDINGS BY WHAT THEY CHANGE ABOUT THE ENACTMENT PATH and say when the answer is nothing - blocks; must be resolved IN the enacting decision; belongs in a successor record and does not block; changes nothing. A round in which the redraft and the attestation are both sound is a COMPLETE AND VALUABLE RESULT and is recorded as one.
    - COMPARE THE RECORDED COORDINATOR PRIOR AGAINST THE OUTCOME ELEMENT BY ELEMENT across all eight elements, including the named prediction that the new control passes on the unamended file, the named candidate clause_4 for a new parse defect, and the named candidate RT-4 for an item carried in the wrong place. State the losses first.
    - >-
      DO NOT APPROVE OR ENACT THE REDRAFT. EXP-WESOVOW-001 stays `approved` and UNAMENDED at version 1 and the redraft stays `status: draft`. Name in next_actions what the enacting decision must still resolve - the CF-10 RAW_PATH placement question with the red team's recommendation marked as a recommendation and the `travels with` authority question expressly unresolved; the F-7 over-reading path scoped explicitly to the FROZEN TRANSCRIPT in the same sentence; the F-2/F-3 warrant defects by a SUCCESSOR record and never by superseding an immutable artifact, to which RT-2 adds CF-22; and RT-6, RT-9(a) and RT-12.
    - STATE PLAINLY WHETHER THE REDRAFT HAS HAD AN ADVERSARIAL PASS. IT HAS NOT - this round is a VALIDATOR review of integrity and controls, not a red-team pass on the redrafted record, and the enacting decision may not treat it as one.
    - RECORD WHAT CF-9 RETURNED AT ITS OWN STRENGTH AND NO HIGHER, and state explicitly that discharging CF-9 lifts no prohibition by itself and that an unattestable limb is never negative mathematical evidence.
    - Do not edit experiments/, inputs/, or anything under BATCH-752ef2/ or BATCH-79a0cb/. Do not execute cost_model.py. Do not make the F-1 fix (CF-13) and do not attach the provenance block to inputs/P13-WESOLOWSKI-2026/source_record.yaml (CF-19) - both are carried forward, and the second would break this archive's enumerated fourteen-path set.
    - NEVER RECONSTRUCT, ESTIMATE OR GUESS a commit SHA, parent SHA or path hash; if a sha is read rather than computed, say where it was read from.
    - THE EVIDENCE RECORD IS AN INTEGRITY REVIEW OF TWO DRAFTED/ATTESTING ARTIFACTS, NOT A NEW MEASUREMENT - certificate.kind none, run_ids only runs actually read as records, claim_tier no higher than document reading, parser behaviour and git archaeology support, proof_status and proof_refs honest per limb. State the tested scope and every transfer assumption, and do not record a second correlated session as an independent replication.
    - NO hypothesis, experiment or goal status transition. GOAL-SSI-001 stays `active` and meets and approaches no completion criterion; `paused` and `blocked` are not permitted statuses. IMP-1 is re-confirmed rather than re-raised unless this round met an impediment its text does not cover.
    - FILL knowledge_promotion with a promotion or a CONCRETE not_warranted reason, weighed on this round's evidence - DEC-20260905-3b8e94 named three transferable methodological candidates each "one implementation short of being a finding", and THIS BATCH IMPLEMENTS THE FIRST. If a KN entry is warranted, it and a regenerated knowledge/INDEX.md belong in a LATER archive that declares them in its path set, and this decision records the reason and names the successor.
    - If any part of the decision would close a lane it carries a complete obstruction block with a measured quantity, units, error bars, source artifacts, scope and a genuinely asked resource_check. A review that found nothing is NOT an obstruction block.
    - DO NOT LIFT THE CITATION PROHIBITION unless this decision lifts it explicitly on independently reviewed evidence with the exact scope stated; otherwise retain both limbs verbatim, restate that the committed flag under-reports and must not be edited, and RECORD THE REASONING FOR THIS ROUND rather than inheriting it. This would be the FIFTH consecutive round in which the lift was available, and CF-9's discharge removes at most one of several grounds.
    - RECORD procedure_deviations IN THE DECISION, including the one this batch OPENED with - no snapshot-archive task, four identifiers, the pre-review commit carried by a dispatch_precondition - and every departure from review_plan.yaml, which names this decision as their authoritative location.
    - CARRY FORWARD EVERY UNDISPATCHED ITEM WITH ITS ORIGIN - CF-2, CF-7's remainder, CF-8, CF-10, CF-12(a) and (b), CF-13, CF-14, CF-15's first limb, CF-17, CF-18, CF-19, CF-21, CF-22, CF-23's reserved items - and record what CF-1, CF-9, CF-11, CF-20 and CF-24 discharged and did not.
    - CHECKPOINT THE GOAL in the write-once shard ledger/goals/GOAL-SSI-001/checkpoints/BATCH-60d6b9.yaml and make exactly one additive change to goal.yaml - its single next_action plus the pointers. Do not append new narrative keys, do not copy the superseded next_action into a new key, and preserve EXACTLY ONE next action. Record whether current_batch_id and dispatch_queue_path were repaired at batch open.
    - ADVANCE latest_verified_commit ONLY IF THIS TASK ACTUALLY VERIFIED A COMMIT; otherwise leave the field and say why, exactly as BATCH-79a0cb's archive did.
    - THE COMMIT MESSAGE STATES RECORD IDENTIFIERS AND LOCATORS ONLY - no verdict token, no finding, no severity. A commit message cannot be reverted (CORR-20260905-547849).
    - Fetch origin/main before committing and MERGE it - never rebase. Record the base commit and the merge outcome, then push and open or refresh the PR against main naming EV-SSI-804e09, DEC-20260906-408595, DEC-20260906-78d9f7 and BATCH-60d6b9. A sync conflict inside an immutable record is resolved by a superseding record under a new identifier, never by picking a side.
    - RECORD THE LAUNCHING-PROMPT DISCLOSURE for every agent of this batch in the receipt (CF-15, second limb), verbatim for any statement about an expected outcome, a preferred verdict or a known finding.
    - IF THE ROUND RETURNED INCONCLUSIVE, SAY SO PLAINLY. An inconclusive round is a result and is never rewritten into a cleaner history, and neither is a round whose only finding is that nothing is wrong.
    - Never select a provider, backend, endpoint, or model identifier containing Bedrock, case-insensitively.
  deliverables:
