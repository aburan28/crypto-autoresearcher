    - Amazon Bedrock is prohibited.
    - The reachable negative is the contract's falsification criterion, a valid cell with d >= 3 whose special-over-null ratio interval includes 1 against either null. Record it when it occurs; do not reason it away and do not relabel it.
    - Do not edit the frozen specification, the hypothesis, or this handoff. Amendments only as additive files under experiments/EXP-ECDLP-2535ec/amendments/.
    - Use the run id RUN-ECDLP-d214b6 already named in the trial plan. Do not mint a second run id for this grid.
    - A timeout, crash, memory abort or resource_exhaustion is failed_infrastructure, never a negative mathematical result.
    - Preserve every raw artifact. Do not overwrite a prior run record.
    - maximum_runs is 72 cells, all under the one run id; one invocation of launcher.command covers the grid.
    - Do not add primes, arms, seeds or cells beyond the launcher.command, and do not change the frozen c list or the smoothness bound.
    - No attack claim. No discrete logarithm is computed and no key is recovered.
    - Do not edit RQ-ECDLP-002 and do not edit a goal head.
