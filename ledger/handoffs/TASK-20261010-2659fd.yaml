  uncertainty_reduced: >-
    Whether, on exactly the toy primes the curve-side contracts
    (EXP-ECDLP-6dacdb, EXP-ECDLP-3e8403, EXP-ECDLP-15534c) use, the
    polynomial form of p is a real, counted advantage for an NFS-style
    relation search in F_p^*: over an identical (a, b) box and identical
    smoothness bound, whether the SNFS polynomial arm yields more doubly
    smooth pairs than either null, with a bootstrap interval excluding 1.
    Without this row a null result on the curve side could mean the toy
    primes are not special enough to see anything.
  inputs:
    - experiments/EXP-ECDLP-2535ec/specification.yaml
    - experiments/EXP-ECDLP-2535ec/trial-plan.json
