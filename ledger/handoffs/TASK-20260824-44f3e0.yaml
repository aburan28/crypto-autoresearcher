handoff:
  id: TASK-20260824-44f3e0
  from: coordinator
  to: idea-generator
  objective: Retrieve primary or authoritative sources for E-521, reconcile the exact
    parameter tuple, and produce a falsifiable prioritized plan for certificate-bearing
    reproduction of all eleven comparison cells plus the declared additional diagnostics.
  uncertainty_reduced: Whether the user-supplied E-521 tuple agrees with retrieved
    primary or authoritative sources and which bounded, falsifiable audits can reproduce
    or challenge each preregistered comparison target.
  inputs:
  - ledger/goals/GOAL-SCURVE-8ba49a/goal.yaml
  - ledger/questions/RQ-SCURVE-3f11a5.yaml
  - ledger/proposals/IDEA-20260807-98a970.yaml
  - coordination/bootstrap/safecurves/TASK-20260824-41038d/manifest.yaml
  - https://safecurves.cr.yp.to/
  - https://safecurves.cr.yp.to/transfer.html
  - https://safecurves.cr.yp.to/disc.html
  - https://safecurves.cr.yp.to/rigid.html
  - https://safecurves.cr.yp.to/ladder.html
  - https://safecurves.cr.yp.to/twist.html
  - https://safecurves.cr.yp.to/complete.html
  - https://safecurves.cr.yp.to/ind.html
  - https://safecurves.cr.yp.to/verify.html
  constraints:
  - Every SafeCurves True or False cell is user-supplied, unverified intake and a
    preregistered comparison target; it is not evidence.
  - A failure of rigidity, ladder availability, completeness, or indistinguishability
    is not by itself an ECDLP break.
  - The Anomalous and BN(2,254) rows are positive-control candidates for the described
    transfer or small-discriminant behavior, not newly discovered attacks; their parameters
    and behavior still require sourced reproduction.
  - The declared diagnostic list is deliberately non-exhaustive; a sourced, measurable
    additional parameter-level weakness may be added through a later scoped handoff.
  - Infrastructure errors, timeouts, unavailable dependencies, and budget stops are
    operational observations, never mathematical evidence.
  - Retrieve and read sources during this task; record provenance for every citation
    and do not promote recalled references to support.
  - Define positive, parameter-matched negative, and same-shape null controls before
    interpreting any signal.
  - For every planned lane state mechanism, quantitative prediction, certificate or
    bound, budget, stopping rule, falsifier, and honest limitation.
  - Reuse IDEA-20260807-98a970 for embedding-degree, anomalous, and full-torsion coverage
    rather than duplicating that proposal.
  - Use only public parameters and generated controls; never test, request, store,
    or derive a live private key.
  - Do not run a curve attack, create an experiment result, or state that the curve
    is safe, unsafe, vulnerable, or free of vulnerabilities.
  - Never select a provider, backend, endpoint, or model identifier containing Bedrock,
    case-insensitively.
  deliverables:
  - Primary-source parameter capsule
  - Falsifiable prioritized audit plan
  - Task report with limitations and proposed successor handoffs
  artifact_paths:
  - coordination/goals/GOAL-SCURVE-8ba49a/batches/BATCH-4d32cd/tasks/TASK-20260824-44f3e0/parameter-capsule.yaml
  - coordination/goals/GOAL-SCURVE-8ba49a/batches/BATCH-4d32cd/tasks/TASK-20260824-44f3e0/audit-plan.yaml
  - coordination/goals/GOAL-SCURVE-8ba49a/batches/BATCH-4d32cd/tasks/TASK-20260824-44f3e0/task-report.yaml
  read_scope:
  - ledger/goals/GOAL-SCURVE-8ba49a/goal.yaml
  - ledger/questions/RQ-SCURVE-3f11a5.yaml
  - ledger/proposals/IDEA-20260807-98a970.yaml
  write_scope:
  - coordination/goals/GOAL-SCURVE-8ba49a/batches/BATCH-4d32cd/tasks/TASK-20260824-44f3e0
  archived_by: TASK-20260824-9894ae
  inference:
    policy: research-deep
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 1800
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
  - The parameter capsule distinguishes user intake from retrieved primary or authoritative
    sources and records provenance and unresolved conflicts.
  - The audit plan covers every one of the eleven criteria in the declared category,
    with a certificate or explicit bound, controls, falsifier, budget, and stopping
    rule.
  - The plan covers every declared additional diagnostic, or records a concrete reason
    and successor condition for a deferred diagnostic.
  - Positive, parameter-matched negative, and same-shape null controls are explicit
    and run before belief in any later task.
  - The report states that no curve attack ran and makes no safety or vulnerability
    conclusion.
  review_plan: null
