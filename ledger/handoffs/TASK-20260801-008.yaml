handoff:
  id: TASK-20260801-008
  from: coordinator
  to: red-team
  objective: >-
    Challenge any reading of the matched-null result stronger than a toy-scoped
    control observation, IN BOTH DIRECTIONS. If the result looks like an artifact
    confirmation, attack the inference that transfer to Z/753848Z proves the curve
    win was generic - name every non-structural difference between the two objects
    that could produce the same number. If the result looks like structure
    evidence, attack that reading at least as hard. Then state whether the frozen
    disposition map was applied honestly or whether the number was read into a
    branch it does not belong in.
  uncertainty_reduced: >-
    Whether the matched-null measurement genuinely discriminates generic
    meet-in-the-middle from structure-dependence, or whether a third explanation
    survives.
  inputs:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-021/archives/TASK-20260801-006/snapshot_commit_receipt.json
  - experiments/EXP-DS-001/controls/CTRL-RT047-MATCHED-NULL.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-020/reviews/TASK-20260731-047/red_team_report.yaml
  - ledger/evidence/EV-DS-003.yaml
  - ledger/decisions/DEC-20260801-003.yaml
  - ledger/hypotheses/H-DS-001.yaml
  constraints:
  - INDEPENDENT SESSION.
  - >-
    SYMMETRY IS MANDATORY. Premature closure is a failure mode symmetric with
    overclaiming (docs/inventor-protocol.md section 4). Attack a negative-looking
    result exactly as hard as a positive-looking one.
  - >-
    reject_scoped-as-impossibility is forbidden on this package under every
    branch; so are S1_met, support for H-DS-001, HEUR-DS-1 validation or
    refutation, any asymptotic or crypto-scale claim, and any affected-scheme
    statement.
  - dominated_by may not be null; carry a quantitative sota_delta.
  - >-
    Carry RT038-B1 through B7 plus M1 and RT047-B1 through B5 plus M1 forward and
    state each one's status.
  - Say explicitly whether the disposition map was applied as frozen or bent to the data.
  - >-
    Toy stays toy; promotion gates remain OPEN unless you prove otherwise with
    archived artifacts.
  - Do not alter H-DS-001, H-IC-001 or H-STR-002.
  - MAKE NO COMMIT.
  deliverables:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-021/reviews/TASK-20260801-008/red_team_report.yaml
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-021/reviews/TASK-20260801-008/red_team_report.yaml
  archived_by: TASK-20260801-009
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 3600
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
  - >-
    Blocking constraints, the narrowest supported statement, dominated_by, a
    quantitative sota_delta, the next required control, and a recommended
    disposition all recorded.
