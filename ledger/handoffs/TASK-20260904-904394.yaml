handoff:
  id: TASK-20260904-904394
  from: coordinator
  to: [validator, red-team]
  created_at: '2026-09-04'
  experiment_id: EXP-MONO-005b49
  hypothesis_id: H-MONO-1d50ac
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001

  objective: >-
    Independent review of EXP-MONO-005b49: the pre-registered replication
    at a second, independent same-prime matched-(N,tau) cell (p=3541,
    N=3600, tau=4, cm_variant=j0), testing whether the first cell's
    (p=617) corrected, nominally-significant P3 result (CORR-20260904-
    d0205d, EV-MONO-c0bf6d) replicates. Result: P3 not significant
    (p=0.5410), same direction as the first cell (P1>P2).

  review_plan:
    coordinator_prior: >-
      Recorded BEFORE either review is dispatched. (1) This Coordinator
      expects Stage 0's cell-selection procedure (ascending-p, first match,
      fixed before the run) to hold up under scrutiny -- it is a simple,
      mechanical, easily-audited procedure and the Executor's own report
      names an exact prime and scan count (66th admissible prime). (2) This
      Coordinator expects the pre-registered log-ratio delta-method test to
      be computed correctly from the raw counts (98, 94, 233, 201) --
      moderate confidence, not independently recomputed by this Coordinator
      before dispatch. (3) This Coordinator's own reading, PRE-REVIEW: a
      non-significant result at the second cell, in the same direction as
      the first, is most consistent with "the first cell's own corrected
      significant result was sampling noise inflated by that cell's own
      repeated post-hoc testing history" -- i.e. H-MONO-1d50ac should NOT
      advance toward "supported" on the strength of two cells (one
      borderline-significant after correction, one clearly not). This prior
      is held with moderate-to-high confidence but is exactly the kind of
      comforting, low-effort-to-accept conclusion a reviewer should
      scrutinize hardest, per this lane's own established discipline.
    claim_under_review: >-
      Two independent claims: (A) Stage 0's cell-selection procedure was
      genuinely fixed and mechanical, not influenced by any peek at later
      results, and the reported cell (p=3541, N=3600, tau=4) is correctly
      constructed. (B) Stage 1's four raw counts and Stage 2's P1/P2/P3/z/
      p-value are correctly computed via EXACTLY the pre-registered test,
      with no substitution of the known-defective same-curve Fisher test as
      an alternative headline.
    joints:
      - joint: J1-CELL-SELECTION-INTEGRITY
        assigned_to: validator
        attack_plan: >-
          Independently re-run or re-derive the Stage-0 search over
          [3001,20000] (or a representative sub-range sufficient to confirm
          p=3541 is genuinely the first admissible same-prime match in
          ascending order, not a later, cherry-picked one) and independently
          reconstruct the ordinary and CM curves at p=3541, confirming
          (N,tau)=(3600,4) for both from scratch.
      - joint: J2-TEST-CORRECTNESS
        assigned_to: validator
        attack_plan: >-
          From raw-result.json's own four counts alone (blind from
          execution_report.yaml and the implementation script's own printed
          summary, per this lane's own blindness discipline), independently
          recompute P1, P2, P3, z, and the two-sided p-value via the EXACT
          pre-registered formula in specification.yaml's
          `significance_test_pre_registered_before_any_draw`. Confirm no
          substitution of a different test occurred.
      - joint: J3-REPLICATION-LOGIC
        assigned_to: red-team
        attack_plan: >-
          Adversarially challenge the Coordinator's own prior (recorded
          above): is "non-significant at the second cell, same direction"
          actually clean evidence AGAINST the endomorphism-ring-linked
          reading, or could it be UNDERPOWERED in a way that makes this an
          uninformative null rather than a genuine disconfirmation? Compute
          the actual statistical power of THIS cell's own test (n=20000
          draws, counts in the ~100-230 range) to detect an effect the size
          of the first cell's own observed ~16% ratio-of-ratios departure.
          If power is low, the "replication failed" reading is itself
          premature.
      - joint: J4-CROSS-CELL-SYNTHESIS
        assigned_to: red-team
        attack_plan: >-
          Adversarially challenge whether combining the first cell's
          corrected P3 (p~0.025-0.033) and this cell's own P3 (p=0.5410)
          via a formal meta-analytic method (e.g. Fisher's combined
          probability test, or a direct pooled log-ratio estimate across
          both cells) changes the overall picture versus treating them as
          two separate, individually-inconclusive results. Also check: do
          the two cells' own P1 values (2.398 at p=617, 2.378 at p=3541)
          and P2 values (2.063, 2.138) show any pattern worth flagging
          (e.g. both P1 values sit close to each other and both above
          OBJ-6's reference band, while P2 values vary more) independent of
          the P3 significance question?
    blindness:
      lifted_for: null
      rationale: null
      declaration: >-
        Both reviewers are launched as fresh subagents with no prior
        context; each must independently state whether it read the other's
        output or any sibling review directory before forming its own
        conclusions.
    proves_too_much:
      objects:
        - >-
          A Stage-0 re-derivation method that would also "confirm" p=3541
          as the first match even if an earlier admissible prime in
          [3001,3541) actually had a same-prime match too (i.e. the method
          must actually check the FULL preceding range, not just verify
          p=3541 itself works, or it cannot actually confirm "first").
        - >-
          A power-calculation method (J3) that would report "adequately
          powered" even when applied to a deliberately tiny synthetic count
          (e.g. counts of 5 instead of ~100-230) -- the method must be
          sensitive to genuinely low power, not report high power
          regardless of input.
      failure_signature: >-
        If J1's re-derivation cannot distinguish "p=3541 is the first
        match" from "p=3541 is A match somewhere in range," or if J3's
        power method reports high power for a clearly underpowered
        synthetic case, the joint has not actually been covered.
    blind_rederivation:
      required: true
      quantity: "EXP-MONO-005b49's P1, P2, P3, z, and the two-sided p-value"
      assigned_to: validator
      blind_from:
        - experiments/EXP-MONO-005b49/execution_report.yaml
        - experiments/EXP-MONO-005b49/implementation/run_experiment.py
        - experiments/EXP-MONO-005b49/runs/RUN-MONO-005b49-1/manifest.yaml

  budget:
    wall_clock_seconds: 3600
    memory_gb: 4
    maximum_runs: 0

  constraints:
    - Do not commit or push. Report only, in your own review directory.
    - Do not read the sibling reviewer's directory before forming your own conclusions; disclose whether you did.
    - Do not change any research status, ledger record, or hypothesis field.

  completion_gate: >-
    Both validation-report.yaml and red-team-report.yaml filed, each
    addressing its owned joints explicitly, before the Coordinator composes
    the evidence/decision records.

  inference:
    requested_policy: review-adversarial
    reasoning_effort: xhigh
    runtime: claude_code
    resolved_model_id: claude-sonnet-5
    model_verified: true
    fallback_used: false
    degraded_requirements: []
