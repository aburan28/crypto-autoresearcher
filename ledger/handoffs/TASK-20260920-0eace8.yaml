  objective: >-
    Return four to six schema-complete idea records under RQ-GFPN-c01af8 that
    answer the user's question of 2026-09-20 -- "what are some hypotheses for
    speeding up Pollard rho over prime extension fields besides endomorphism"
    -- for the two deployed curves EcGFp5 and EcMasFp5 over
    F_{p^5} = F_p[z]/(z^5 - 3), p = 2^64 - 2^32 + 1. Four candidates were
    seeded in the same conversation and are handed over below as INPUT
    SKETCHES, not as records: (S1) the per-step cost floor of affine rho on
    this field against a matched random 320-bit prime-field curve; (S2)
    inversion through the field norm with the true inversion batched at the
    base-field level, using the diagonal Frobenius of the z^5 - 3 basis;
    (S3) multi-instance pooled rho (Kuhn-Struik) and its precomputation
    limit as the instance-economics speedup for a deployed curve with many
    keys; (S4) a control measuring whether an r-adding walk whose partition
    reads one base-field coefficient mixes as well as a hashed partition on
    this field. The generator may return each seeded sketch as a record,
    merge or split them, decline any with the section-5 honesty block, and
    add at most two candidates of its own that satisfy constraint C-2.

  uncertainty_reduced: >-
