  context_verified_this_session: >-
    The following were computed or read by the dispatching session on
    2026-09-20 and may be used as stated; each other number in a record is
    derived in the record or marked recalled.
    (V1) p mod 5 = 1; zeta = 3^((p-1)/5) mod p satisfies zeta != 1,
    zeta^5 = 1; so in the basis 1, z, ..., z^4 of F_p[z]/(z^5 - 3) the
    Frobenius a -> a^p multiplies coefficient i by zeta^i (four constant
    base-field multiplications).
    (V2) j(EcGFp5) and j(EcMasFp5), computed in F_{p^5} from the published
    equations y^2 = x(x^2 + 2x + 263 z) and y^2 = x^3 + 3x + 8 z^4, both lie
    OUTSIDE F_p and are neither 0 nor 1728; hence Aut(E) over F_{p^5} is
    {+1, -1} for both, neither is a twist of a subfield curve, and the
    field automorphism sends E to a different curve (its Galois conjugate),
    so no equivalence-class speedup beyond negation exists for rho on either
    curve. Translation by EcGFp5's rational 2-torsion point realises the
    quotient isogeny and leaves the odd-order step count unchanged.
    (V3) Word-product counts per F_{p^5} operation in this basis: schoolbook
    multiplication 25, Karatsuba (2+3 split) 15, squaring 15; one affine rho
    step with Montgomery-batched inversion is about 5M + 1S, i.e. about 140
    (schoolbook) or 90 (Karatsuba) word products, against about 55 word
    products for ONE multiplication in a generic 320-bit Montgomery prime
    field. Goldilocks reduction is a few adds per coefficient; the binomial
    modulus costs one multiplication by 3 per wrapped coefficient.
    (V4) Itoh-Tsujii in this basis: a^(p+p^2+p^3+p^4) costs two extension
    multiplications plus three diagonal Frobenius maps; the norm N(a) is the
    constant coefficient of a times that cofactor (5 word products plus one
    constant multiplication); the only true inversion is of N(a) in F_p and
    can be Montgomery-batched across walks with ONE-word prefix products.
    Per-element cost is about 2M + 26 word products against about 3M for
    extension-level Montgomery batching: a tie at schoolbook M = 25, a loss
    of about 10 word products at Karatsuba M = 15, and a 5x reduction in
    per-walk scratch state. That is why S2 is a measurement, not a claim.
    (V5) Neither sibling repository has a rho backend over F_{p^n}: the
    cryptanalysis library's rho core is F_p only (its header says extension
    fields live in the FPGA tree), and the crypto repository's rho
    engineering is the binary-field ECC2K-130 GPU client. Any S1/S2/S4
    instrument is new tooling and must be charged as such.
    (V6) The knowledge-retrieval MCP server (kb/) is NOT attached to this
    session; novelty is checked by grep over knowledge/ and ledger/ and by
    reading files, never by the index.

  recalled_not_verified: >-
    Kuhn-Struik pooled cost (about sqrt(2 L n) total group operations for L
