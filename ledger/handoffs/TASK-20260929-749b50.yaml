  title: >-
    Revise lane B to version 3: write H-BINSTD-17cf9d and EXP-BINSTD-c9c8a2
    (approved_by null) superseding H-BINSTD-de2808 and EXP-BINSTD-6f1e66, and
    a new audit sheet with every control and audit as committed, import-safe
    code, discharging RR-1 to RR-12 of DEC-20260929-8c3cb2
  objective: >-
    Run /design-experiment on IDEA-20260926-136bd3 under RQ-BINSTD-b6f698 as a
    version-3 revision within DEC-20260928-63addc S2 scope and design
    conditions C1 to C8 unchanged, absorbing IDEA-20260926-d06324's two exact
    calibration rows and RC-1 controls as in versions 1 and 2. Write
    H-BINSTD-17cf9d and EXP-BINSTD-c9c8a2 (status review_required, approved_by
    null), each complete in itself and each carrying supersedes naming its
    version-2 record, and a new proof-search-map audit sheet in which every
    control and the exact-quotient audit are committed, import-safe code with
    pass criteria stated before execution. Discharge RR-1 to RR-12 of
    DEC-20260929-8c3cb2 by number (listed under revision_items below) and carry
    unchanged everything that decision's what_survived_and_carries_forward
    names, except where an RR item requires a change, each change listed in a
    constants_delta block. Zero runs.
  uncertainty_reduced: >-
    Whether a complete protocol exists whose instrument measures every
    declared arm's excess beyond the certificate's exact components, reads an
    exact-content-only label as a null, pre-registers what L2 means, and
    states a HEUR-B2 consequent that marginal skew cannot satisfy or violate.
  revision_items:
    source: DEC-20260929-8c3cb2 revision_requirements, verbatim in substance; the decision is the authority where wording differs. The remedies may be met by any equivalent route stated with its reason.
    breaking:
      - id: RR-1
        requirement: >-
          Make every declared arm's comparison measure excess beyond every
          exact component the certificate already counts. Either (a) stratify
          the histogram-preserving shuffle, and the random-label reference
          where used, by h4 for every Koblitz arm and by h2 for every ordinary
          arm, generalising DF-7; or (b) sample Stage 2 points from the target
          subgroup 4E (Q uniform, then 4Q), where every exact component is
          constant and the capacity is 0 bits, matching the ceiling ambient
          N = l. State the choice in text and in code, and price it. Correct
          OC-1's classification of F1 as DEC-20260929-8c3cb2 RR-1 states it.
          Audit every declared arm for exact-quotient content with a stated,
          committed check (CODE-AUDIT, form below), including the ordinary
          arms. Restate the NEG prediction so that it is true of a null.
      - id: RR-2
        requirement: >-
          Add a blocking gate control, committed as code with its pass
          criterion stated before execution: an exact-content-only label must
          read NEG under the rules as applied to family arms (candidates: F1-
          style weight classes tied to the E/2E class, and 4r + h4 with a
          skewed r). Wire it into SR-1 and the invalidation rules.
      - id: RR-3
        requirement: >-
          Pre-register what L2 means. If non-decay is intended, test non-decay
          (for example the interval's upper end at least 0, or its lower end at
          least -delta with delta stated). If growth is intended, say so, state
          the LEAD floor, and add a flat-Z planted control beside PC-16. In
          either case make the L2 interval respect W's common-mode calibration
          error, by per-seed widths or by propagated W uncertainty. Replace
          "THE LEAD OUTCOME IS REACHABLE" with a sentence scoped to what PC-16
          and the added control show.
      - id: RR-4
        requirement: >-
          Restate HEUR-B2's consequent on a quantity that marginal skew and
          exact components can neither satisfy nor violate (for example the
          controlled lift over the stratified shuffle, or a restriction to
          equiprobable-marginal arms), and state for which declared arms it is
          defined. Remove or rescope the mapping from a raw G_131 above
          l^(c_k) to "the k-tree falls below matched rho under the ceiling
          model", so that no record sentence lets a reader derive a below-rho
          reading from a raw-G bound. State whether any consequent is testable
          at a tested N, and keep HEUR-B2 a heuristic, never a bound.
    non_breaking:
      - {id: RR-5, requirement: 'Extend the planted-mixture grid above 1/2 (for example 0.6 to 1) so the measured floor exists at M = 8, 16 and 32, including the fixed-alphabet M = 16 arm. Quote measured floors, or label the design figures as underestimates. Correct the two design-floor sentences DEC-20260929-8c3cb2 RR-5 names.'}
      - {id: RR-6, requirement: 'Stabilise the null width, with more draws or with a width less tied to the third-largest draw, and price it in stage_split.'}
      - {id: RR-7, requirement: 'Guard CODE-CERT with a primality and distinctness check on the supplied factors before forming divisors.'}
      - {id: RR-8, requirement: 'Either disclose PC-9''s redefinition (sampled against index-sampled; the exhaustive value reported, not checked) in the specification, in OC-2 and in the discharge row, or add the exhaustive pin to the code and to SR-1.'}
      - {id: RR-9, requirement: 'Commit HEUR-B1''s validation (pair-sum counting and the chi-squared test) as code, with binning and degrees of freedom fixed before execution, or correct inputs.instrument.missing_instruments and assign it before any run; remove the post-hoc binning freedom.'}
      - {id: RR-10, requirement: 'Give PC-9 a filter outside the declared family, or a separate stream label. Gate-pin the stratified-shuffle branch (or the subgroup sampler) with an exact-control and planted-marginal check of its own. Guard PC-10 ordering in code, or assign it explicitly to the driver.'}
      - {id: RR-11, requirement: 'Name the ambient of the carried (C3) and (C4) floors, or compute them in CODE-S0. Add the PO-1 and primality qualifiers to asymptotic_claim.time_exponent. Prove CELL-K41''s odd part by complete trial division in code, or mark the recalled bound as load-bearing. Reconcile maximum_runs 12 against 16. Correct mechanism (vi)''s "before any Koblitz arm is read". Align CODE-GATE''s docstring with the S1 order. Price the contingent cost of the LEAD route.'}
      - {id: RR-12, requirement: 'Record the version-2 red team''s retrieval of Fong-Hankerson-Lopez-Menezes, CACR CORR 2003-18 Section 4 (Lemma 4.1(iv) and the normal-basis statement of 4.2 that underlies RR-1) with provenance retrieved, verified_by TASK-20260929-7d8385, and restate IMP-FHLM''s boundary (the halving material is Section 4 in that version). Not a defect; K-impediment is satisfied.'}
    carried_unchanged: >-
      DEC-20260929-8c3cb2 carried_unchanged and
      approval_ruling.what_survived_and_carries_forward: the capacity
      certificate, its code and three coded control readings; the Koblitz
      orders, admissibility, the three-cell ladder and CELL-K41; rules R-M and
      R-S and the sample table; the ideal-tree table and the gap and closure
      lines in both ambients; the histogram-preserving shuffle and its PC-6a
      and PC-6b gate checks for arms without an exact component; the measured
      random-label null; CTL-MAXEXACT, the R-10 repairs, custody and every
      approval field; the labelling of the stake, the lead route, the
      orbit-unknowns line and HEUR-B2's random-model limits; the exclusions;
      PTM-A to PTM-D. Changed only where an RR item requires, each change in
      constants_delta (D-CARRY-B).
  code_audit_form:
    name: CODE-AUDIT, the exact-quotient audit of RR-1
    form: >-
      A committed, import-safe code block that reports, per declared (cell,
      arm, offset, M), purity_2: the fraction of affine-point mass (uniform on
      affine points) lying in label classes on which the coset P + 2E is
      constant; and, on Koblitz cells, purity_4: the same for P + 4E. Computed
      exhaustively for n at most 19, and exhaustively or by a stated sample of
      at least 10^6 points with its standard error at n = 23. Every declared
      Koblitz arm on CELL-K13, CELL-K19 and CELL-K23 and every ordinary arm on
      CELL-O19 is audited, at every declared alphabet. Its pass rule (which
      purity marks an arm as carrying an exact component, and what follows
      for the arm under RR-1) is stated before execution. It never computes
      the bucket gain, a shuffle, a null draw or any decision clause.
    output_table: The audit table is embedded in the audit sheet from C-4 below as a design figure, with the command and seed.
  allowed_session_computations:
    authority: DEC-20260929-4c7ffc R-PRODUCER-COMPUTE (DEC-20260929-8c3cb2 NA-1, PD-V4), stated in advance
    note: >-
      The producer session may ask the top-level session to perform these and
      only these, and embeds each command and its verbatim output in the audit
      sheet as a design figure, never a result.
    items:
      - C-1 extract each committed code block by the pinned method and compute its sha256
      - C-2 a syntax check and an import-safety check of each block in a fresh interpreter (importing executes nothing)
      - C-3 run CODE-S0 through its __main__ entry and relay its output verbatim
      - >-
        C-4 run the committed CODE-AUDIT, a deterministic enumeration (or the
        stated sample at n = 23) of label classes against the 2E and 4E cosets
        on the declared toy cells, and relay its output verbatim
      - >-
        C-5 dry calls of the stratified shuffle or the subgroup sampler, the
        RR-2 control and the RR-10 gate pin on synthetic data only (an
        exact-content-only label, an exact homomorphism and a planted
        marginal-only label), outputs relayed verbatim
    forbidden: >-
      Anything else: no bucket gain, shuffle, null draw, estimator or
      decision clause on any declared cell; no driver written or executed; no
      run.
