    - DB3-11 Every approval field present; status review_required; approved_by null; an approval block naming DEC-20260929-585602 as the composing decision. The superseded status of versions 1 and 2 is not written here.
    - DB3-12 Session computations limited to allowed_session_computations C-1 to C-5; no declared cell measured.
    - >-
