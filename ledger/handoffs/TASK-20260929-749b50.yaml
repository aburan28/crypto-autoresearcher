    - DB3-4 RR-2 (breaking) -- the blocking exact-content-only gate control, committed as code with its pass criterion stated before execution, wired into SR-1 and every invalidation rule.
    - DB3-5 RR-3 (breaking) -- L2 pre-registered as non-decay or as growth, with W's common-mode error respected and the over-scoped sentence replaced.
    - DB3-6 RR-4 (breaking) -- HEUR-B2's consequent restated; the arms on which it is defined named; no raw-G to below-rho mapping left in any record; testability at a tested N stated; HEUR-B2 a heuristic, never a bound.
    - DB3-7 RR-5 to RR-12, as revision_items states.
