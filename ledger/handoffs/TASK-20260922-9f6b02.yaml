handoff:
  id: TASK-20260922-9f6b02
  from: coordinator
  to: coordinator
  title: >-
    Ledger archive for DEC-20260922-10272e: commit the ranking-and-intake-refusal
    decision, its producer card, and this card in one isolated commit, verify the
    receipt against Git, push, and open or refresh the PR against main naming all
    three records

  objective: >-
    Make DEC-20260922-10272e durable. It is a Coordinator roadmap act -- it ranks an
    externally offered body of work against the open portfolio and declines to open any
    goal, question, hypothesis or batch for it -- and under AGENTS.md rule 7 and
    agents/coordinator.md "Branch and PR discipline" a decision that exists only in a
    working tree is unpublished, not official. This card commits, verifies, pushes and
    publishes it, together with its producer card TASK-20260922-ce7325. It is the ONLY
    archival owner of these records.

  uncertainty_reduced: >-
    None. An archival act measures nothing, runs nothing, and interprets nothing.

  archive_kind_note: >-
    Recorded as kind `ledger` rather than `snapshot`. AGENTS.md "Durable research
    commits" reserves a snapshot for producer artifacts committed BEFORE an independent
    agent reviews them, and a ledger archive for decision and state records committed
    before an official act. There is no producer here and no review round follows,
    because the decision moves no hypothesis, composes no evidence, closes no lane and
    asserts no claim -- it is a prioritization act, which agents/coordinator.md
    "Authority" makes exclusively the Coordinator's. The absence of a review chain is
    therefore a property of the act, not a review that was skipped. Recorded explicitly
    so a later reader does not read the missing chain as a defect.

  inputs:
    - >-
      ledger/decisions/DEC-20260922-10272e.yaml (the record being archived; final as
      written, not to be edited by this card)
    - >-
      ledger/handoffs/TASK-20260922-ce7325.yaml (the producer card this archive names
      as its sole archive.source_task_ids; final as written by that card, not edited
      here)
    - >-
      ledger/handoffs/TASK-20260922-9f6b02.yaml (this card; self-archiving, see
      archived_by_note)
    - >-
      coordination/2026-09-22-external-cache-intake-b9348f/dispatch_queue.json (the
      goal-less portfolio queue carrying this single card; also-staged, not hash-bound,
      see also_staged_note)
    - >-
      ledger/goals/GOAL-ICPERF-e6b6a4/goal.yaml (READ ONLY. Not staged, not edited, not
      checkpointed. The decision concurs with this goal's recorded next_action and adds
      nothing to the goal.)

  archived_by: TASK-20260922-9f6b02
  archived_by_note: >-
    SELF-ARCHIVING, and deliberately so. The standing precondition in AGENTS.md
    "Dispatch preconditions bind the DISPATCHER" is that `archived_by` is BOUND before
    dispatch, not that it names a different task; the precedent in this repository is
    TASK-20260916-8d493b on GOAL-ICPERF-e6b6a4, which also archives itself. Every record
    in this act has exactly one archival owner and none has zero: DEC-20260922-10272e,
    this card, and the producer card TASK-20260922-ce7325 (reached through
    archive.source_task_ids in the queue) are all owned here, and no other ledger record
    was written.

  constraints:
    - >-
      RUN THIS ARCHIVE ALONE. No concurrent worker commits into this worktree while it
      runs (AGENTS.md "Durable research commits").
    - >-
      STAGE ONLY THE DECLARED PATHS. A scope-expanding commit is an evidence-integrity
      failure, not a tidiness problem.
    - >-
      DO NOT STAGE, EDIT, CHECKPOINT OR SHARD ledger/goals/GOAL-ICPERF-e6b6a4/goal.yaml.
      The decision explicitly adds nothing to that goal, another session holds an open
      lane on it (BATCH-94168f on branch claude/index-calculus-graph-dag-3linyk), and
      touching the shared goal head from here would create a conflict where there is no
      semantic disagreement at all.
    - >-
      BEFORE COMMITTING: fetch origin/main and MERGE it into the working branch -- merge,
      NEVER rebase. Re-run `python3 tools/validate_ledger.py` on the merged tree and
      compare against the recorded BASELINE of 94 pre-existing errors (PRECOMP/GLV specs
      missing `budget`; AES/FROB/QSP run manifests missing fields; IDEA-20260920-b9f0c5
      citations missing `verified_by`). Record the base commit checked and the merge
      outcome in the receipt.
    - >-
      THE COMMIT MUST ADD NO NEW VALIDATION ERROR. The three records here must contribute
      ZERO errors; the count must stay at 94 or fall. If it rises, STOP and report which
      file caused it rather than editing a pre-existing record to compensate.
    - >-
      DO NOT REPAIR ANY PRE-EXISTING ERROR IN THIS COMMIT. Those 94 errors are on main,
      are owned by other campaigns, and are outside this card's write scope. Fixing one
      here would be a scope expansion and would also hide which branch introduced it.
    - >-
      A SYNC CONFLICT INSIDE AN IMMUTABLE RECORD IS NEVER RESOLVED BY PICKING A SIDE.
      STOP and create a superseding record under a NEW identifier.
    - >-
      DO NOT EDIT DEC-20260922-10272e TO MAKE THIS ARCHIVE TIDIER. It is frozen as
      written, including its limitations list.
    - >-
      DO NOT EDIT ledger/handoffs/TASK-20260922-ce7325.yaml. It is the producer card's
      final form as written by that card; commit it byte-for-byte.
    - >-
      MINT NO IDENTIFIER. All three identifiers were supplied pre-allocated and `--check`
      verified. If a new record turns out to be needed, STOP and request one.
    - >-
      AFTER COMMITTING: push the branch and open or refresh the PR against main, NAMING
      DEC-20260922-10272e, TASK-20260922-ce7325 and TASK-20260922-9f6b02. An archive that adds new DEC-* and
      TASK-* records and is not pushed to a branch with an open PR is unpublished, not
      durable evidence (agents/coordinator.md "Branch and PR discipline").
    - >-
      LAUNCH NO TRIAL. This is not a `/run`. Completing this card dispatches nothing and
      makes nothing dispatchable; the decision it archives deliberately dispatches no
      scientific work.

  deliverables:
    - >-
      One isolated commit containing exactly the two declared artifact_paths
      (DEC-20260922-10272e.yaml, TASK-20260922-9f6b02.yaml), the one source artifact path
      from TASK-20260922-ce7325 (its own handoff record), and the one also_staged path
      (dispatch_queue.json).
    - >-
      coordination/2026-09-22-external-cache-intake-b9348f/archives/TASK-20260922-9f6b02/ledger-receipt.json,
      per templates/research-records.md "Coordinator archive receipt": kind `ledger`,
      source_task_ids, commit_sha, parent_sha, path_sha256 for every declared and source
      path, and record_ids naming DEC-20260922-10272e, TASK-20260922-ce7325 and
      TASK-20260922-9f6b02.
    - A post-commit verification of that receipt against Git, reported pass or fail with its exact message.
    - The pushed branch and an open or refreshed PR against main naming all three records.
    - The origin/main base commit checked and the merge outcome, recorded in the receipt.
    - >-
      The `tools/validate_ledger.py` error count on the committed tree, stated beside the
      recorded baseline of 94, with any difference attributed to a named file.

  artifact_paths:
    - ledger/decisions/DEC-20260922-10272e.yaml
    - ledger/handoffs/TASK-20260922-9f6b02.yaml
  artifact_paths_note: >-
    Exact file paths. The dispatcher forbids trailing-slash artifact_paths, so no
    directory subtree appears here. The archive receipt itself is a deliverable written
    by this card and is not among its own hash-bound inputs. THE COMMIT CARRIES THREE
    DISTINCT CATEGORIES OF PATH, and they are not interchangeable: (1) these two
    artifact_paths, which this card OWNS and HASH-BINDS; (2) ONE SOURCE artifact,
    ledger/handoffs/TASK-20260922-ce7325.yaml, reached through the queue's
    archive.source_task_ids -- owned and written by the producer card, not by this one,
    but HASH-BOUND here, because tools/research_dispatch.py requires archive.path_sha256
    to cover every archive AND source artifact; and (3) ONE ALSO-STAGED path, the
    dispatch queue, committed in the same commit but deliberately NOT hash-bound (see
    also_staged_note).

  also_staged_sha256:
    - coordination/2026-09-22-external-cache-intake-b9348f/dispatch_queue.json
  also_staged_note: >-
    The queue file is committed in the same commit but is NOT hash-bound as an
    artifact_path, for the fixed-point reason BATCH-a33cda recorded against
    TASK-20260915-1942e2 and BATCH-94168f restated: a queue that records its own task's
    state transition cannot have its post-commit bytes declared before the commit that
    changes them. It is therefore in neither the artifact set nor the source set, and
    no path_sha256 entry is written for it.

  write_scope:
    - ledger/decisions/DEC-20260922-10272e.yaml
    - ledger/handoffs/TASK-20260922-9f6b02.yaml
    - coordination/2026-09-22-external-cache-intake-b9348f/
  write_scope_exclusivity: >-
    EXCLUSIVE. No other task in any open lane of this repository writes these paths. In
    particular this scope is DISJOINT from BATCH-94168f's open lane on
    GOAL-ICPERF-e6b6a4: it touches no ledger/goals/ path, no experiments/ path, no
    coordination/goals/ path, and no coordination/review/ path.
    TASK-20260922-ce7325's write_scope (ledger/handoffs/TASK-20260922-ce7325.yaml) is
    DISJOINT from this card's write_scope; this archive commits that file as a source
    artifact, but does not write it.

  read_scope:
    - ledger/decisions/DEC-20260922-10272e.yaml
    - ledger/handoffs/TASK-20260922-9f6b02.yaml
    - ledger/handoffs/TASK-20260922-ce7325.yaml
    - ledger/goals/GOAL-ICPERF-e6b6a4/goal.yaml
    - ledger/questions/RQ-ICPERF-94c86e.yaml
    - coordination/2026-09-22-external-cache-intake-b9348f/
    - templates/research-records.md
    - AGENTS.md
    - agents/coordinator.md

  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: true
    fallback_reason: >-
      Binding declared on the card before dispatch, the remedy named by the
      tools/research_dispatch.py inference advisory against this card. Requested policy
      coordinator-orchestration-code; `python3 -m orchestration.adapter resolve --role
      coordinator` on this host resolves the coordinator role to that policy on the
      `anthropic` backend, the default backend in orchestration/model-bindings.yaml,
      which is the canonical place the serving model is named. The dispatcher reports
      `anthropic` as not credentialed here; that is its reading of this machine's API-key
      environment variables only. Every session that has served BATCH-b9348f so far ran
      on the `anthropic` backend through an authenticated Claude Code session, a route
      AGENTS.md core rule 16 permits: the ranking act on the base tier; the structural
      two-card fix on the declared fallback_policy, coordinator-orchestration, after the
      base tier hit the account's weekly rate limit on 2026-09-22; and the session that
      recorded this declaration. That is the expected route for this archive too.
      fallback_allowed is true so that the session which runs this card -- on the base
      tier, on the declared fallback_policy coordinator-orchestration if the weekly limit
      still binds, or on another backend in defaults.backend_fallback_order that FULLY
      meets this policy's floor -- records requested_policy, resolved_policy, backend and
      fallback_used: true with its reason, instead of reporting a fallback against a
      card that forbids one. degraded_allowed stays false: no binding that misses the
      coordinator floor may run this card. No inference_amendment is recorded or implied.
    degraded_allowed: false
    independent_session_required: false
  inference_note: >-
    independent_session_required is false because no review round is opened, nothing is
    validated, and no claim changes; an archival commit has no independence property to
    preserve. reasoning_effort is null, taking the policy default, per
    templates/research-records.md. fallback_allowed was changed from false to true
    BEFORE this card ran, not amended afterwards, and is mirrored in both inference
    blocks of this card in
    coordination/2026-09-22-external-cache-intake-b9348f/dispatch_queue.json.
    requested_policy, resolved_policy and fallback_used are deliberately absent here:
    they are observations the session that runs this card records, not declarations.

  budget:
    wall_clock_seconds: 1800
    memory_gb: 2
    maximum_runs: 0
  budget_basis: >-
    NO NULL FIELD. Machine headroom measured 2026-09-22 on this host: 4 CPUs, 15 GB RAM
    with approximately 14 GB available, 18 GB disk free. A git merge, two small YAML
    writes, a validator pass over the ledger, a commit and a push fit inside 2 GB and
    well inside 30 minutes. maximum_runs is 0 because this card executes NO experiment;
    0 is a declared value, not a missing one. These are machine-protection figures, not a
    research budget -- CLAUDE.md "Research budgets: progress first" makes research cost
    estimates advisory, and exhausting this wall clock would checkpoint the task, never
    exhaust a campaign or constitute evidence of anything.

  dispatch_preconditions:
    - >-
      DP-1: `archived_by` is BOUND before dispatch. It is, to this card itself; see
      archived_by_note. Dispatching with it null is forbidden (CORR-20260915-6708e4).
    - >-
      DP-2: no other task is writing this worktree. Archive commits run ALONE.
    - >-
      DP-3: origin/main has been fetched and MERGED into the working branch (merge, never
      rebase), and `tools/validate_ledger.py` reports NO NEW errors on the merged tree
      against the recorded baseline of 94.
    - >-
      DP-4: both artifact_paths exist with their final content and no not_in_scope path is
      dirty -- in particular ledger/goals/GOAL-ICPERF-e6b6a4/goal.yaml is unmodified.
    - >-
      DP-5: NO LANE CLAIM IS REQUIRED OR PERMITTED for this card, and that is a deliberate
      departure from the third standing precondition rather than a waiver of it. That
      precondition binds when the GOAL being worked is already being worked; this card
      works no goal. It opens no batch on GOAL-ICPERF-e6b6a4, writes nothing under
      ledger/goals/ or coordination/goals/, and consumes none of that campaign's
      max_concurrent 2 -- the free slot beside BATCH-94168f stays free. Claiming a lane on
      a goal this card does not touch would misreport the portfolio by making an intake
      refusal read as ICPERF campaign work.
    - >-
      DP-6: its source, TASK-20260922-ce7325, is state `completed` before this card
      dispatches (it already is).
  dispatch_preconditions_note: >-
    These bind the SESSION DOING THE LAUNCHING, not the agent, and must be satisfied
    BEFORE the launch rather than discovered afterwards (AGENTS.md "Dispatch preconditions
    bind the DISPATCHER, not the agent"). They are not waived by the work turning out
    fine. Read the whole card, not only the half addressed to the callee.

  completion_gate:
    - The commit exists, is reachable from HEAD, and has the expected parent.
    - >-
      The commit changes EXACTLY the two declared artifact_paths, the one source artifact
      path from TASK-20260922-ce7325, and the one also_staged path, and nothing else. In
      particular it does not touch ledger/goals/GOAL-ICPERF-e6b6a4/goal.yaml.
    - Every declared and source path's sha256 in the receipt matches the committed tree.
    - >-
      The commit message names TASK-20260922-9f6b02, TASK-20260922-ce7325 and
      DEC-20260922-10272e.
    - The receipt records the origin/main base commit checked and the merge outcome.
    - >-
      `tools/validate_ledger.py` on the committed tree reports no error attributable to
      any of the three files, and the total error count has not risen above the recorded
      baseline of 94.
    - The post-commit verifier ACCEPTS the receipt.
    - The branch is pushed and a PR against main is open or refreshed, naming all three records.
    - >-
      No identifier was minted. GOAL-ICPERF-39248b, RQ-ICPERF-04399b, IDEA-20260922-30e9ec,
      DEC-20260922-2b2f88 and the five remaining unused TASK-20260922-* identifiers remain
      unused and free.
  completion_gate_note: >-
    WHICH CLAUSE IS CHECKED BY WHOM. Under the queue's archive.binding_mode
    `content_at_commit`, the post-commit verifier (tools/research_dispatch.py
    verify_archive) checks that the commit is reachable from HEAD with the declared
    parent, that path_sha256 covers exactly the two artifact_paths plus the one source
    artifact, that those hashes match the bytes at the archive commit, and that the
    commit message names this task and every record_id. It does NOT compare the
    commit's changed-path set; that comparison runs only under binding_mode `commit`.
    The "changes EXACTLY" clause above is therefore checked by the archiving session
    itself, from `git diff-tree --no-commit-id --name-status -r <commit_sha>`, and its
    output is reported with the receipt. Verifier acceptance alone does not satisfy
    that clause.

  return_format: >-
    The archive receipt path; commit_sha and parent_sha; the verifier's pass/fail with its
    exact message; the commit's changed-path list from git diff-tree; the origin/main base commit checked and the merge outcome; the
    validate_ledger error count beside the baseline of 94; the PR url or number; and
    confirmation that ledger/goals/GOAL-ICPERF-e6b6a4/goal.yaml is unmodified. Report any
    refusal or scope expansion rather than working around it.

  review_plan: null
  review_plan_note: >-
    Explicitly null, and the field is present rather than omitted so a reader cannot
    mistake an omitted field for an overlooked one. A review_plan is required on the
    handoff that OPENS a claim-changing review round. This card opens none: an archival
    commit is not a claim-relevant producer, and the decision it archives moves no
    hypothesis, composes no evidence, closes no lane and asserts no claim.

  recorded_at: '2026-09-22'
