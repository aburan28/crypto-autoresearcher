# OPENING LEDGER ARCHIVE, GOAL-MONO-001, BATCH-450ac7. It runs ALONE, before
# the CU-7 reviewer may be claimed. It makes DEC-20261016-5bdc04, the
# goal-head projection and the BATCH-450ac7 handoffs (including the
# pre-review plan carried by TASK-20261016-9c1bc5) official. It closes the
# gap that BATCH-8609e2 had to cure retroactively for DEC-20260930-6f1d85
# (TASK-20261005-41d1ff, FP-2). Zero runs. The ID was pre-minted by the
# top-level session and reported --check OK.
handoff:
  id: TASK-20261016-7e31b2
  from: coordinator
  to: coordinator
  goal_id: GOAL-MONO-001
  batch_id: BATCH-450ac7
  authorized_by: DEC-20261016-5bdc04
  archive_kind: ledger
  objective: >-
    Commit and bind, in ONE isolated archive commit, exactly these paths:
    ledger/decisions/DEC-20261016-5bdc04.yaml; ledger/goals/GOAL-MONO-001/goal.yaml;
    ledger/handoffs/TASK-20261016-2e9357.yaml; ledger/handoffs/TASK-20261016-7e31b2.yaml;
    ledger/handoffs/TASK-20261016-9c1bc5.yaml; ledger/handoffs/TASK-20261016-548959.yaml;
    and this card's receipt,
    coordination/goals/GOAL-MONO-001/batches/BATCH-450ac7/archives/TASK-20261016-7e31b2/ledger-receipt.json.
    Verify the receipt, push, and open or refresh the PR naming
    DEC-20261016-5bdc04, BATCH-450ac7, GOAL-MONO-001 and the four TASK ids.
    Then open the lane. This task runs ALONE.
  uncertainty_reduced: >-
    None about the mathematics. It makes the batch opening and the CU-7
    pre-review plan durable and verifiable before any reviewer runs, so that
    the plan is pre-registered in a committed and verified state.
  inputs:
    - ledger/decisions/DEC-20261016-5bdc04.yaml
    - ledger/goals/GOAL-MONO-001/goal.yaml
    - ledger/handoffs/TASK-20261016-2e9357.yaml
    - ledger/handoffs/TASK-20261016-7e31b2.yaml
    - ledger/handoffs/TASK-20261016-9c1bc5.yaml
    - ledger/handoffs/TASK-20261016-548959.yaml
    - coordination/goals/GOAL-MONO-001/batches/BATCH-450ac7/dispatch_queue.json
  constraints:
    - >-
      LA-1 The opening commit comes first, in its own commit:
      coordination/goals/GOAL-MONO-001/batches/BATCH-450ac7/dispatch_queue.json
      only. Push it, and render it with tools/research_dispatch.py, which must
      pass. The queue is never staged by this archive.
    - >-
      LA-2 Merge origin/main into the working branch first, and never rebase.
      Record base_commit_checked and merge_outcome in the receipt. If the merge
      touches ledger/goals/GOAL-MONO-001/goal.yaml, check that this lane's
      projection still applies without rewriting another lane's text. A
      conflict inside a record is never resolved by editing it. Stop and
      report.
    - >-
      LA-3 Goal-head check, mechanical. The goal.yaml diff against the base
      may contain only the following: the current_batch_id and
      dispatch_queue_path scalars changed to BATCH-450ac7 and its queue path;
      the new keys current_batch_id_before_BATCH-450ac7,
      dispatch_queue_path_before_BATCH-450ac7 and current_batch_note_2026_10_16;
      one appended open_batches item for BATCH-450ac7; and one new key,
      next_action_2026_10_16. Any other changed or removed line is a scope
      finding. Stop and report, and do not repair it.
    - >-
      LA-4 Stage exactly the seven declared paths, one by one. git add -A,
      git add . and directory adds are forbidden.
    - >-
      LA-5 Run tools/validate_ledger.py before committing. Stop on any new
      error attributable to the staged paths. Pre-existing errors on main (for
      example DEC-20260930-25e287/8af20f/ca32c7 referencing EXP-AUXIN-339fb0)
      are recorded as pre-existing and are not repaired.
    - >-
      LA-6 binding_mode content_at_commit, because goal.yaml has a life after
      this archive. commit_sha, parent_sha and path_sha256 go into the queue's
      archive block in a later commit, with a tasks_state_revisions entry.
    - >-
      LA-7 The commit message names TASK-20261016-7e31b2 and every archive
      record_id literally. Verify the receipt with tools/research_dispatch.py.
      Push, and open or refresh the PR against main naming every record id. A
      missing, dirty or scope-expanding commit blocks the review. It is an
      integrity failure, not a result.
    - >-
      LA-8 After verification: `python3 tools/goal_lanes.py open-lane
      GOAL-MONO-001 BATCH-450ac7 --queue
      coordination/goals/GOAL-MONO-001/batches/BATCH-450ac7/dispatch_queue.json
      --decision DEC-20261016-5bdc04 --objective "CU-7 rule-12 review of the
      cured route-(c) object" --as <addr> --publish`.
    - LA-9 Never edit a staged file while staging. Never amend, rebase or force-push. Zero runs.
  deliverables:
    - >-
      coordination/goals/GOAL-MONO-001/batches/BATCH-450ac7/archives/TASK-20261016-7e31b2/ledger-receipt.json.
      It holds commit_sha (null inside the commit), parent_sha,
      base_commit_checked, merge_outcome, binding_mode, path_sha256 for every
      staged path, record_ids, the LA-3 check, the validate_ledger.py outcome
      and the research_dispatch.py verification outcome.
    - One isolated commit, a pushed branch, an open or refreshed PR, and the lane opened.
  artifact_paths:
    - coordination/goals/GOAL-MONO-001/batches/BATCH-450ac7/archives/TASK-20261016-7e31b2/ledger-receipt.json
    - ledger/decisions/DEC-20261016-5bdc04.yaml
  archived_by: TASK-20261016-7e31b2
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    reasoning_effort_note: null means the policy default (high). The shell-holding top-level session executes the staging and hashing.
    fallback_allowed: true
    fallback_note: Runtime inheritance under the Claude Code harness. Backend or model substitution only. Never Bedrock.
    degraded_allowed: false
    independent_session_required: false
    delivery: interactive
  budget:
    wall_clock_seconds: 1800
    memory_gb: 1
    maximum_runs: 0
  dispatch_preconditions:
    - id: LP-1
      text: archived_by is bound (SELF). AGENTS.md standing precondition 1.
    - id: LP-2
      text: LA-1 is done. The queue is committed, pushed and renders clean.
    - id: LP-3
      text: >-
        A claim made after git fetch: `python3 tools/goal_lanes.py claim
        coordination/goals/GOAL-MONO-001/batches/BATCH-450ac7/dispatch_queue.json
        TASK-20261016-7e31b2 --as <addr> --ttl-minutes 45 --publish`, released
        with --outcome on return.
    - id: LP-4
      text: RUNS ALONE. No other GOAL-MONO-001 task is live (campaign_budget.max_concurrent 1).
  completion_gate:
    - origin/main was merged (never rebased), with base_commit_checked and merge_outcome in the receipt.
    - The LA-3 goal-head check passed.
    - One commit binds exactly the seven declared paths, and its receipt is verified by tools/research_dispatch.py.
    - validate_ledger.py shows no new error attributable to the staged paths.
    - The branch is pushed, the PR is open and names every record id, and the lane is opened.
    - Nothing was edited while staging. Zero runs.
  return_format: The ledger receipt (commit_sha, parent_sha, path_sha256 map, LA-3 outcome, validate_ledger and research_dispatch outcomes), the PR reference and the lane record path.
  review_plan: null
  runs_launched: 0
