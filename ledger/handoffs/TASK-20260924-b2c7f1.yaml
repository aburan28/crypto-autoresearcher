    - experiments/EXP-CERTBIN-e94b27/runs/RUN-CERTBIN-c417e0/ (instance-sets.json, closures.jsonl.gz, certificates.jsonl.gz, certificate-verification.json, cell-summary.json, decision-rules.json, manifest.yaml, manifest_v2.yaml)

