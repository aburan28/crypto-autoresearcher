    - coordination/review/certbin-20260924-3d7e1a/systems/null-systems.json
    - coordination/review/certbin-20260924-3d7e1a/archives/ (the a4f217 and 60b4ea receipts)
    - experiments/EXP-CERTBIN-e94b27/specification.yaml and experiments/EXP-CERTBIN-4e92d7/specification.yaml
