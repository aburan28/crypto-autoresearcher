    - "the executor's development outputs and return message; PR #1408 text; coordination/bus/"

  constraints:
    - id: CP-1
      text: >-
        VERIFY BEFORE COMPARING. (1) Both reviewer directories match the
        TASK-20260924-60b4ea receipt's path_sha256. (2) Each seal.txt matches
        its sealed files. (3) blind-inputs.json matches the
        TASK-20260924-a4f217 receipt. (4) The 60b4ea receipt reports no
        blocking defect. Then map labels to run keys with blind-inputs-key.json.
    - id: CP-2
      text: >-
        COMPARE EVERY ITEM BELOW and tabulate agree/disagree per item and per
        instance, for all 97 blind instances.
        Against instance-sets.json "archived" (Stage-1 values):
        - s (both routes where given), arm (s = 0 or not), degenerate flag;
        - rank_3, rank_4, "1 in R_3", "1 in R_4".
        Against closures.jsonl.gz (this run):
        - W_4: dim per iteration (where the run recorded it; otherwise mark
          "re-deriver only" and say so), fixpoint index, first iteration with
          1 (or none), final dimension, dim(W_4 cap B_{<=d}) for d = 0..4, and
          "1 in W_4";
        - the fall profile dim(R_4 cap B_{<=d}), d = 0..3, where the run
          recorded it (otherwise mark "re-deriver only");
        - Q5 (M_5 rank and "1 in R_5") where present.
        Against certificate-verification.json and certificates.jsonl.gz:
        - J1's per-certificate verdict against the run's, key by key;
        - MR1, MR2, MR3 and MR4 recounted from J1's verdicts only, with the
          resulting RC1-DR-1..4 verdicts re-applied by the frozen rules;
          state whether any verdict changes.
        Also: each re-deriver ambiguity and J1 ambiguity, set against how the
        run resolved it (trial-plan-v1.json, impl/README.md,
        implementation.md).
    - id: CP-3
      text: >-
        CHECK EVERY W-CERTIFICATE in wcerts.jsonl.gz with your own minimal
        checker, written before you read the re-deriver's code. Build f_k for
        explicit-kind instances from blind-inputs.json, and for curve-kind
        instances with the archived construction (impl/macaulay.py
        descended_E, decoded with EQ_MONS). Check: every mu in rows has degree
        <= 2; every product parent is an earlier id with degree <= 3; every
        element has degree <= 4; the output element is exactly 1. Report per
        instance: valid, invalid (with the first violated condition), or
        absent. Then state, per run key, whether "1 in W_4" is W-certified,
        engine-reported only, or contradicted.
    - id: CP-4
      text: >-
        LOCALISE EVERY DISAGREEMENT: (a) read both implementations at the
        specification clause concerned; (b) run a third, minimal,
        specification-literal check on that one instance, in your own code,
        declared; (c) name which side departs from the specification text, or
        the ambiguity both sides read differently. A disagreement in a
        per-iteration record where "1 in W_4" and the final dimension agree is
        reported as such; W_4 is a least fixpoint, so it may reflect the
        iteration schedule rather than the closure.
    - id: CP-5
      text: >-
        VERDICT ON J6: `holds` if every compared quantity agrees (or every
        disagreement localises to a re-deriver or verifier side, or to an
        encoding difference) AND every run-claimed W_4 refutation in the pool
        is W-certified; `breaks` if any disagreement localises to the
        producer's implementation, or a run-claimed W_4 refutation is
        contradicted; `inconclusive` if a disagreement cannot be localised, a
        genuine ambiguity was read differently by both sides (name the
        clause), or a run-claimed W_4 refutation is unwitnessed but not
        contradicted. State which compared items sit at a floor or ceiling for
        every instance, and therefore are weak evidence about the
        implementation.
    - id: CP-6
      text: >-
        REPORT ON J6 ONLY. Do not read the validator's or the red team's
        reports. No verdict on the claim. Zero trials; third checks on at
        most 20 archived instances plus the CP-3 checks on every W-certificate,
        declared. Memory cap 3 GB.
    - id: CP-7
      text: >-
        DISCLOSED PRIOR (review-plan PD-R1). The Coordinator's review prior
        names where it expects disagreements. Do not let that decide where you
        look hardest; compare everything in CP-2.

