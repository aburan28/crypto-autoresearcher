handoff:
  id: TASK-20260831-ea2561
  from: coordinator
  to: red-team
  objective: Independent red-team assessment of the GOAL-ECQ-e72c0b BATCH-3d8863 protocol review round, owning joints
    J2 (certificate route) and J3 (controls adequacy) plus the proves-too-much objects per review-plan.yaml.
  inputs:
  - coordination/goals/GOAL-ECQ-e72c0b/batches/BATCH-3d8863/review-plan.yaml
  - coordination/goals/GOAL-ECQ-e72c0b/batches/BATCH-3d8863/tasks/TASK-20260824-c85718/protocol.yaml
  - coordination/goals/GOAL-ECQ-e72c0b/batches/BATCH-3d8863/tasks/TASK-20260824-c85718/task-report.yaml
  - coordination/goals/GOAL-ECQ-e72c0b/baseline/icarm_curve_302_20260824.json
  - ledger/handoffs/TASK-20260824-c85718.yaml
  constraints:
  - Own ONLY joints J2 and J3 plus the proves_too_much control; never a whole-claim verdict.
  - BLINDNESS mutual this round; read no other reviewer report; attest exactly which files you read.
  - ZERO-EXECUTION REVIEW - no command execution, no computer algebra, no verifier runs; executed mathematics invalidates
    the report.
  - Record requested policy review-adversarial and the model that actually answered; disclose the absent reasoning-effort
    dial; never downgrade silently.
  artifact_paths:
  - coordination/goals/GOAL-ECQ-e72c0b/batches/BATCH-3d8863/reviews/TASK-20260831-ea2561/report.yaml
  write_scope:
  - coordination/goals/GOAL-ECQ-e72c0b/batches/BATCH-3d8863/reviews/TASK-20260831-ea2561
  budget:
    wall_clock_seconds: 7200
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
  - CONCUR or DISSENT per owned joint (J2, J3) plus the proves-too-much failure-signature analysis, each with the
    worked attack.
  - Files-read attestation present.
  - Zero commands executed; no mathematical execution.
  review_plan:
    claim_under_review: 'PROTO-ECQ-e72c0b-c85718 as its producer stated it: a finite, unconditional, two-stage decision-and-certification
      protocol (design only, zero execution) that either unconditionally closes the extension of frozen curve 302''s
      certified 31 independent points (Stage A exact 2-Selmer: dim = 31 implies rank exactly 31, no 32nd point,
      no conjecture load-bearing) or licenses a bounded Stage B point search (dim >= 32) and certifies any found
      32nd point by an exact F2-reduction independence certificate (Stage C), with five matched controls, frozen
      budgets and stopping rules, and a two-sided pre-declared decision gate. The protocol authorizes zero execution;
      the review round reviews the DESIGN.'
    coordinator_prior: 'Written before any reviewer ran. I expect CONCUR-with-required-changes at the design tier
      on J1 (the Selmer decision rule is standard 2-descent and I believe the two-sided reading is correct given
      trivial torsion), and I expect trouble at J2: the certificate route''s self-contained halving-induction is
      exactly where such designs usually hide a parity gap, and the producer never retrieved the real verify.ts,
      so the certificate route rests on recalled structure. I expect the controls block to be adequate but the null
      control (Q = -P1 duplicate row) to be weak evidence of independence sensitivity. My prior is that the round
      returns CONCUR on J1/J3, and that J2 (certificate route soundness) draws at least one substantive objection.
      A reviewer finding the Stage A gate itself unsound would overturn my prior and is the most informative possible
      outcome.'
    joints:
    - joint: 'J1 - THE STAGE A DECISION RULE. The claim that computing dim Sel_2(E) exactly over a finite prime
        set yields a two-sided decision: dim = 31 implies rank(E) = 31 exactly (no 32nd point, closure unconditional
        on no conjecture); dim >= 32 licenses (does not guarantee) a 32nd point. Load-bearing because every later
        stage and both terminal readings hang on it.'
      assigned_to: TASK-20260831-234e80
      attack_plan: 'Do not trust the producer''s chain. Re-derive from the exact 2-descent sequence 0 -> E(Q)/2E(Q)
        -> Sel_2(E) -> Sha(E)[2] -> 0 what each reading of dim Sel_2(E) implies given rank >= 31 and E(Q)[2] = 0:
        by hand, from the statement of the sequence alone. Then attack the gate as written in the protocol: (a)
        is the prime set S over which the protocol works declared so that L(S,2) actually contains Sel_2(E) - i.e.
        is the enumeration over 2^|S_L| classes genuinely exhaustive, or does it test a subgroup? (b) is the decision
        gate''s ''equal to E(Q)_tors[2]=0 plus the already-certified 31'' arithmetic right given trivial torsion?
        (c) name exactly which untested conjectures, if any, each reading is conditional on. Write the checks as
        hand verifications of the exact sequence''s bookkeeping. Where the Coordinator expects it to break: the
        enumeration may test a quotient rather than Sel_2 itself, silently turning ''dim = 31'' into a non-decisive
        lower bound.'
      breaking_artifact: A written demonstration that some class of Sha[2] survives outside the enumerated space,
        or that the gate's arithmetic double-counts the 31 certified points, so that 'dim = 31' does not imply closure.
    - joint: J2 - THE STAGE C CERTIFICATE ROUTE. The claim that the exact F2 reduction matrix (points reduced mod
        a frozen good-prime list), with matrixRank - torsionRank = n, proves Z-independence of the intended rational
        points - via a SELF-CONTAINED halving-induction soundness proof re-derived rather than imported, and with
        certificate-route provenance explicitly flagged as unverified (verify.ts never retrieved).
      assigned_to: TASK-20260831-ea2561
      attack_plan: '(1) Check the short-Weierstrass conversion identity and the resolvent-cubic argument''s preconditions
        (Delta_E = 16*disc(res) divisibility claim) by hand for an elliptic curve in general Weierstrass form with
        a1, a3 nonzero. (2) Attack the halving-induction argument in certificate_route.matrix_rank_implies_independence_proof:
        construct (on paper) a configuration of exact rational points that are Z-dependent (e.g. P32 = 2*P1) yet
        whose reduction rows could still show matrixRank - torsionRank = 32 if the route''s handling of the halving/parity
        structure is wrong; determine whether the route detects or misses it, and where the induction step needs
        a precondition it does not state. (3) Check the good-prime list preconditions: what exactly must ''good
        reduction'' exclude here (2, the discriminant primes, and anything else the row map needs), and does the
        route say so.'
      breaking_artifact: Either a specific unstated precondition of the halving induction, or a concrete configuration
        (relation between points, prime set) on which the pipeline's certificate would certify a false independence.
    - joint: J3 - CONTROLS ADEQUACY. The five controls (null Q = -P1; positive control on an independently documented
        rank-r curve; nearby-object control; rational-2-torsion applicability; the two proves-too-much objects)
        must each ISOLATE the property they name, per the inventor protocol's controls-before-belief rule.
      assigned_to: TASK-20260831-ea2561
      attack_plan: 'For each control, ask the sibling question: would this control PASS even if the property it
        claims to isolate were violated? The null control Q = -P1 duplicates a row; predict its outcome and ask
        what OTHER defect (e.g. a wrong reduction map at one prime, a mis-scaled character basis) would produce
        the same ''rank stays 31'' outcome. If a control''s failure signature is indistinguishable from the success
        signature, the control is decorative - say so, and state what control WOULD isolate it.'
      breaking_artifact: A named control whose predicted outcome is indistinguishable from the failure mode it is
        supposed to catch, with the missing sibling control named.
    - joint: J4 - BASELINE REPRODUCTION SPECIFICATION. Stage 0's claim that the frozen baseline (Delta = the exact
        frozen integer, 31 on-curve points, trivial torsion via >= 2 good primes, rank-31 certificate re-run) is
        reproducible by code independent of the ICARM verifier, and that the frozen JSON actually contains what
        the protocol says it contains.
      assigned_to: TASK-20260831-234e80
      attack_plan: Read the frozen JSON and check every constant the protocol quotes (discriminant digits, point
        coordinates, torsion claim, prime-set guidance) against it verbatim; any mismatch between the protocol's
        stated frozen values and the JSON is a break. Verify the short Weierstrass conversion's stated role (resolvent
        cubic discriminant argument) is coherent for THIS curve's invariants by symbolic inspection, and that the
        claimed torsion determination method (multiplicative order gcd across >= 2 good primes) is stated at a strength
        that actually proves E(Q)_tors = {O} and not merely |E(F_p)| constraints.
      breaking_artifact: Any frozen constant the protocol misquotes, or a Stage 0 sub-check whose stated requirement
        does not follow from the frozen record.
    blindness:
      mutual: true
      lifted_for: []
      rationale: Single round, no hardening stage yet; reviewers run concurrently and may not read each other's
        reports.
    proves_too_much:
      objects:
      - 'The null certificate object: the 31 frozen points plus Q = -P1, for which the TRUE independence count is
        31 - a route reporting 32 here has proved too much.'
      - 'A rank-0 curve with full rational 2-torsion (e.g. y^2 = x^3 - x): the true torsion 2-rank is 2, so a route
        reporting torsionRank = 0 or a rank of 3 from three independent rows is overcounting - known-false object
        for ''matrixRank - torsionRank = independence''.'
      failure_signature: The certificate route must FAIL (report the true, smaller number) on each object; where
        its conclusion is false it must refuse, not certify. A route that certifies independence on these has proved
        too much and is wrong somewhere unread.
      assigned_to: TASK-20260831-ea2561
    blind_rederivation:
      required: true
      quantity: 'From ONLY the statement ''E over Q, E(Q)_tors trivial, 31 certified Z-independent rational points,
        dim Sel_2(E) computed exactly over a finite prime set S equals 31'', derive: (i) the strict implication
        for rank(E(Q)) - exact value, unconditionally; (ii) the strict meaning of dim Sel_2(E) >= 32 - what is licensed,
        what is not; (iii) the complete dependency set: which untested conjectures (BSD, GRH, Sha) are load-bearing
        in either reading, if any.'
      parameters: The frozen curve-302 ainvs and 31 points, read ONLY from coordination/goals/GOAL-ECQ-e72c0b/baseline/icarm_curve_302_20260824.json.
      blind_from:
      - coordination/goals/GOAL-ECQ-e72c0b/batches/BATCH-3d8863/tasks/TASK-20260824-c85718/protocol.yaml
      - coordination/goals/GOAL-ECQ-e72c0b/batches/BATCH-3d8863/tasks/TASK-20260824-c85718/task-report.yaml
      - ledger/handoffs/TASK-20260824-c85718.yaml
      assigned_to: TASK-20260831-46a7e5
    procedure_deviations: []
  archived_by: TASK-20260831-2b729c
  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  uncertainty_reduced: Whether the certificate route and its controls can be broken on known-false objects; reduces
    the risk that the certificate route certifies a false independence.
