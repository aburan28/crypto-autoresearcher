  recorded_at: '2026-10-18'
  status: assigned
  goal_id: GOAL-ICPERF-e6b6a4
  batch_id: BATCH-4379b2
  objective: >-
    Implement a fail-closed race-safe process-tree RSS monitor and phase
    telemetry for the 63-bit prime solver path, validate them with synthetic
    process fault tests, and draft a prospective small m=2 planted-positive
    diagnostic. Do not launch a scientific solver trial.
  uncertainty_reduced: >-
    Whether a transient exit/zombie sampling race causes the natural-cell
    monitor exception, and whether source instrumentation can distinguish
    input preparation, polynomial-ring construction, Groebner work,
    model counting and root enumeration in a later bounded diagnostic.
  inputs:
  - ledger/decisions/DEC-20261018-eb6e00.yaml
  - ledger/decisions/DEC-20261018-e92c77.yaml
  - problems/icperf-prime63-monitor-and-positive-controls.md
  - experiments/EXP-ICPERF-891f7f/specification.yaml
  - experiments/EXP-ICPERF-891f7f/trial-plan.json
  - experiments/EXP-ICPERF-891f7f/runs/RUN-ICPERF-7ed866/execution-receipt.json
  - experiments/EXP-ICPERF-891f7f/runs/RUN-ICPERF-7ed866/raw-result.json
  - research/icperf_prime63_inflight_admission_20261017/execute.py
  - research/icperf_prime63_inflight_admission_20261017/check.py
  - research/icperf_prime_wide_backend_retry_20261017/backend.py
  - research/icperf_prime63_pilot_launcher_20261017/planted_public.json.gz
  - research/icperf_prime63_pilot_launcher_20261017/planted_witnesses.json
  - research/icperf_prime_475_target_systems_20261017/systems.json.gz
  constraints:
  - >-
    Write only under research/icperf_prime63_monitor_phase_20261018/.
    Preserve the approved EXP-ICPERF-891f7f specification, plan, original
    launcher/checker, RUN-ICPERF-7ed866, and BATCH-a45ce4 queue byte for byte.
  - >-
    Exercise only synthetic short-lived child processes and static archived
    input inspection in this task. No Sage Groebner call, natural relation
    search, planted-positive scientific trial, or fresh experiment run is
    authorized by this handoff. Set maximum_runs=0 for scientific trials.
  - >-
    Preserve fail-closed semantics. A truly live child whose RSS cannot be
    read must terminate with a distinct infrastructure classification and
    retained raw diagnostics; it must never be sampled as zero RSS. A child
    that has exited or become a zombie must not be misreported as an
    unmonitorable live child solely because of a poll/reap race.
  - >-
    Keep the 8 GiB process-tree RSS ceiling as a proposed safety limit for
    a later experiment. Any change to the approved scientific protocol or
    cap requires a prospective new experiment and Coordinator preapproval.
  - >-
    Phase events and resource samples must be append-only, flushed on each
    transition, written outside the final response, and hash-bound into the
    proposed raw custody even after a watchdog kill. The trace must identify
    the exact phase boundary and source version and distinguish missing
    telemetry from zero cost. Do not infer
    degree of regularity from input support or elapsed process wall time.
  - >-
    The diagnostic design must prelist the archived m=2 planted positive
    from each of the coset, random and small-x arms, a monitor fault-injection
    null control, independent witness/full-point checking, proposed per-call
    wall/RSS/scratch limits, a total cap, stop rules, raw custody and an
    inference table for certificate, timeout, contradiction and monitor fault.
    It remains a design proposal, not an approved experiment.
  deliverables: &outputs
  - research/icperf_prime63_monitor_phase_20261018/monitor.py
  - research/icperf_prime63_monitor_phase_20261018/phase.py
  - research/icperf_prime63_monitor_phase_20261018/instrumented_backend.py
  - research/icperf_prime63_monitor_phase_20261018/driver.py
