  - research/icperf_prime63_monitor_phase_20261018/report.md
  - research/icperf_prime63_monitor_phase_20261018/diagram.svg
  - research/icperf_prime63_monitor_phase_20261018/report.pdf
  artifact_paths: *outputs
  archived_by: TASK-20261018-a2cf7c
  inference:
    policy: executor-implementation
    delivery: interactive
    fallback_allowed: false
    degraded_allowed: false
  budget:
    maximum_runs: 0
    maximum_workers: 1
    memory_gb: 4
    watchdog_wall_clock_seconds: 7200
  completion_gate:
  - >-
    The validation record hashes the source files and shows deterministic
    pass/fail outcomes for normal exit, abrupt exit, zombie/NoSuchProcess
    during sampling, an unmonitorable live child, and sampled RSS-cap
    termination. It also exercises repeated fast exit/reap timing. No case
    silently charges zero RSS while a child remains live and unreadable.
  - >-
    A dry-run with synthetic phases shows monotonic phase timestamps,
    resource samples, exact trace hashes and durable partial telemetry
    outside the response after forced timeout or termination; it makes
    no Sage polynomial or scientific solver call.
  - >-
    The prospective m=2 design names all three fixed positive inputs,
    independent witness checks, exact planned limits, raw/censor custody,
    null control and decision impact. It is marked unapproved and has no
    run ID or result field.
  - >-
    The report, diagram and PDF describe implementation/test evidence and
    limits without claiming a factor-base speedup; the output archive binds
    all eleven declared files before any later scientific design cites them.
