      (DEC-20261008-e27b4a; EXP-PFDR-0b3699)", followed by the session's
      attribution lines.
      Verify the receipt, push, and refresh PR #2008. Never merge a red head.
    - No status changes; no shared tool or config file is written; never select a Bedrock provider.
