# =============================================================================
# TASK-20260922-98729f -- Coordinator SNAPSHOT ARCHIVE of the EXP-FROB-30006a run
# package, exactly as the executor produces it, BEFORE any reviewer reads it and
# BEFORE any decision cites it. Runs ALONE and AFTER the producer.
#
# WHY THIS CARD EXISTS. TASK-20260920-66a30e declares four artifact_paths for the
# run package and names `archived_by: TASK-20260920-956d12` -- an archive that
# completed on 2026-09-20 at 08:23:48Z (commit 14ef07b83) and whose staged_paths
# contains none of them. The run package therefore had NO owning archival task.
#
# THAT CARD IS NOW SUPERSEDED BY TASK-20260922-cd6f21, for a second and worse
# defect: it is undispatchable, because its artifact_paths and write_scope are
# one list and two entries are directories. The superseding card names THIS task
# in its own `archived_by`, so the ownership repair is carried on the card that
# will run rather than as a side overlay a dispatcher must remember to read.
# CORR-20260922-9e402f records both defects and both remedies.
# =============================================================================
handoff:
  id: TASK-20260922-98729f
  from: coordinator
  to: coordinator
  recorded_at: '2026-09-22'
  opened_by_decision: DEC-20260922-e9d35a
  authorizing_correction: CORR-20260922-9e402f
  goal_id: GOAL-FROB-6333a9
  batch_id: BATCH-5286b0
  experiment_id: EXP-FROB-30006a
  hypothesis_id: H-FROB-a5bf86
  question_id: RQ-FROB-7d8dd4
  kind: snapshot_archive

  objective: >-
    Commit the EXP-FROB-30006a run package exactly as TASK-20260920-66a30e
    produced it, in ONE isolated commit staging only the declared paths, and
    bind its bytes by sha256 -- so that the independent review round reads a
    committed, pushed, hash-bound run package rather than a working tree, and so
    that whatever the primary cell measured exists durably whether or not the
    producing session survives.

  uncertainty_reduced: >-
    NONE. Durability and custody only. This task reads no result for meaning,
    scores no verdict, interprets no conflict ratio, and asserts nothing about
    H-FROB-a5bf86 in either direction.

  inputs:
    - experiments/EXP-FROB-30006a/implementation.md
    - experiments/EXP-FROB-30006a/implementation/
    - experiments/EXP-FROB-30006a/trial-plan.json
    - experiments/EXP-FROB-30006a/RESULTS.json
    - experiments/EXP-FROB-30006a/runs/
  inputs_note: >-
    TASK-20260922-cd6f21's five deliverables and its write_scope. NOTE THAT THIS
    LIST IS LONGER THAN THAT CARD'S artifact_paths, AND DELIBERATELY SO: two
    entries -- implementation/ and runs/ -- could not appear there because their
    file names do not exist until the executor and the runner create them, and a
    dispatcher's artifact_paths must be exact files. THIS ARCHIVE IS WHERE THEY
    GET BOUND, hashed into path_sha256 at archive time when their names are
    facts. RESULTS.json is added to the contract by amendment clause A-5 and is
    what makes the runs/ set enumerable rather than merely listable.

    If the producer wrote outside its declared write_scope, THAT IS REPORTED AND
    NOT SILENTLY ABSORBED: a scope-expanding producer is an evidence-integrity
    finding, and this archive stages its declared set and names the extras rather
    than quietly widening to cover them.

  constraints:
    - id: SA-1
      text: >-
        STAGE ONLY THE DECLARED PATHS, PATH BY PATH. `git add -A` is forbidden:
        many sessions work this tree and a sweep commits another lane's in-flight
        edits into an archive declaring it changed exactly its own set.
    - id: SA-2
      text: >-
        NEVER EDIT A RUN ARTIFACT WHILE STAGING IT. Not a manifest, not a
        raw-result, not a certificate, not a log. A malformed artifact is
        committed as malformed and reported; repairing it in the archive destroys
        the only evidence of how it was produced.
    - id: SA-3
      text: >-
        COMMIT FAILED AND PARTIAL ATTEMPTS TOO. If the primary cell exhausted
        capacity, if the regression gate failed, if n = 43 timed out, or if an
        arm was invalidated, those artifacts are part of the package. A timeout or
        an instrument failure is infrastructure signal and is NEVER negative
        mathematical evidence; dropping such a run would convert an impediment
        into a silence.
    - id: SA-4
      text: >-
        RECORD, IN THE RECEIPT, WHETHER THE COORDINATOR READ ANY RUN ARTIFACT
        BEFORE THIS COMMIT EXISTED. A producer returning into a shared worktree
        ordinarily means it did; the honest mitigation is the receipt's hashes
        plus the fact that no write followed the producer's report, NOT a claim
        that custody was unbroken.
    - id: SA-5
      text: >-
        MERGE origin/main IN FIRST -- merge, never rebase. Rebasing a branch that
        carries pushed run records rewrites the commits those records were
        archived in, and a receipt whose commit no longer exists is not
        reproducible.
    - id: SA-6
      text: >-
        DO NOT SCORE THE VERDICT AND DO NOT WRITE AN EVIDENCE RECORD. Under the
        amendment AMD-EXP-FROB-30006a-20260922-nullcontrol the verdict is computed
        per search mode, a mode disagreement is `inconclusive`, and both arms plus
        r_s/r_r are reported. Reading which bin fired is the REVIEW round's and
        then the closing decision's work, not this archive's.
    - id: SA-7
      text: >-
        ZERO RUNS. This card is not a /run and launches nothing.

  deliverables:
    - >-
      coordination/goals/GOAL-FROB-6333a9/batches/BATCH-5286b0/archives/
      TASK-20260922-98729f/snapshot-receipt.json -- commit_sha, parent_sha,
      base_commit_checked, merge_outcome, path_sha256 over every declared path
      plus this receipt, record_ids, source_task_ids, and the custody disclosure
      SA-4 requires.

  artifact_paths:
    - coordination/goals/GOAL-FROB-6333a9/batches/BATCH-5286b0/archives/TASK-20260922-98729f/snapshot-receipt.json
  artifact_paths_note: >-
    ONE path. This archive's own artifact is its receipt; the run package is its
    SOURCE, declared in `inputs` and in `archive.path_sha256`, and is produced by
    TASK-20260922-cd6f21 rather than by this card. Keeping the two lists distinct
    is what makes `git diff --name-only` on this commit checkable against the
    declared set.

    WHY THIS CARD KEEPS THE ONE-PATH SHAPE AND TASK-20260922-0e3b58 DOES NOT.
    That card is `kind: ledger`, and `_validate_ledger_archive`
    (research_dispatch.py lines 735-763) requires a ledger archive to own at
    least one `ledger/decisions/` path in its own artifact_paths, so it carries
    the decision beside its receipt. THIS card is `kind: snapshot` and line 737
    returns before that check runs, so the separation survives here intact. The
    two records differ because the tool's two branches differ, not because the
    principle changed between them -- and where the ledger branch and the
    principle collided, the branch won (AGENTS.md rule 7: the dispatcher's
    verifier is what makes a record official).

  write_scope:
    - coordination/goals/GOAL-FROB-6333a9/batches/BATCH-5286b0/archives/TASK-20260922-98729f/
  write_scope_note: >-
    The receipt directory ONLY. This task stages files it does not write -- that
    is what an archive is -- and it may modify none of them.

  archived_by: TASK-20260922-98729f
  archived_by_note: SELF; an archival task owns its own receipt.

  archive:
    kind: snapshot
    source_task_ids:
      - TASK-20260922-cd6f21
    source_task_ids_note: >-
      RE-SOURCED from TASK-20260920-66a30e, which is superseded by
      TASK-20260922-cd6f21 and is not in BATCH-5286b0's queue. That merged card
      is undispatchable -- `research_dispatch.py` refuses its directory entries
      in artifact_paths -- so the producer whose output this archive binds is the
      card that will actually run. CORR-20260922-9e402f records why.
    record_ids:
      - EXP-FROB-30006a
      - GOAL-FROB-6333a9
      - BATCH-5286b0
      - TASK-20260922-cd6f21
      - TASK-20260922-98729f
    record_ids_note: >-
      RUN-* ids are added at archive time from the manifests the producer actually
      wrote, and only those. None is listed here, because none exists yet and
      inventing one would be a fabrication under AGENTS.md rule 5. If the producer
      writes zero runs, this list stays as written and the receipt says so.
    commit_sha: null
    parent_sha: null
    path_sha256: {}
    binding_mode: content_at_commit
    binding_mode_note: >-
      content_at_commit, consistently with every archive in this batch. Run
      artifacts are write-once and should not move, but this batch's ledger
      archives bind the goal head and the queue, which do move, and a batch with
      two binding modes is a batch whose reader has to work out which rule
      applies where.

  dispatch_preconditions:
    - >-
      This card's own `archived_by` is bound (SELF; satisfied on this card).
    - >-
      TASK-20260922-cd6f21 has RETURNED. This archive runs AFTER the producer,
      never concurrently with it: staging a directory a solver is still writing
      into binds bytes that are not the artifact.
    - >-
      CORR-20260922-9e402f is committed, so the supersession this archive's
      source rests on is itself durable rather than a working-tree claim.
    - >-
      RUNS ALONE. `max_concurrent` is 1 on this queue and on the goal.
    - >-
      The producer's lane claim is released with its outcome before this task
      claims one.

  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: true
    fallback_note: >-
      TRUE and declared up front, as on every card in this batch. No adapter
      backend is credentialed in this checkout; the runtime-native binding is the
      only route and `false` would be a claim the dispatch breaks.
    degraded_allowed: false
    degraded_requirements_expected:
      - >-
        model_verified false: no backend is probeable in this checkout, so the
        resolved identifier is self-reported.
    independent_session_required: false
    independent_session_note: >-
      FALSE. An archival act carries no judgement. Independence is reserved for
      the review round at DEC-20260922-e9d35a dispatch_ranking rank 4, whose whole
      value depends on reading THIS commit rather than a working tree.

  budget:
    wall_clock_seconds: 1800
    memory_gb: 1
    maximum_runs: 0

  completion_gate:
    - >-
      origin/main merged into the working branch (merge, never rebase), base
      commit and merge outcome recorded in the receipt.
    - >-
      Every path the producer actually wrote under its declared write_scope is
      either staged and hashed, or named in the receipt as absent with the reason
      -- including the case where the producer wrote nothing.
    - >-
      Any file the producer wrote OUTSIDE its declared write_scope is named in
      the receipt as a scope finding and is NOT staged by this archive.
    - >-
      ONE commit changing exactly the declared set, path_sha256 recomputed at
      archive time immediately before it.
    - >-
      `python3 tools/validate_ledger.py` run, with no new error attributable to
      the staged paths.
    - >-
      The post-commit receipt verified by `tools/research_dispatch.py`.
    - >-
      Branch pushed and the PR against main refreshed, naming the run ids the
      receipt actually records.
    - >-
      SA-4's custody disclosure present and truthful.
    - >-
      No verdict scored, no evidence record written, no hypothesis status
      touched, zero runs launched.

  return_format: >-
    The commit sha and its parent, the run ids bound, the declared paths staged
    and any absent with the reason, any out-of-scope write found, the validator
    outcome, and the custody disclosure. Report a refused or failed gate as a
    refusal.

  handoff_record: ledger/handoffs/TASK-20260922-98729f.yaml
  state: written_not_dispatched
  state_note: >-
    Accurate at the time of writing, and correct for longer than usual: this card
    is blocked until TASK-20260920-66a30e returns, which cannot happen until
    TASK-20260922-0e3b58's ledger archive verifies. Not to be edited to make a
    later dispatch look compliant.

  asserts_nothing_about: >-
    The science. Durability and custody of whatever the primary cell produced,
    including nothing. No measurement is interpreted, no verdict scored, no
    hypothesis moved, no completion criterion discharged, and no claim made about
    any curve.
