      process through run_wrapper.py exec; ru_maxrss recorded on any
      MemoryError, as DEV-1 implements). Per-instance watchdog 7200 s (the
      census default; pass no --instance-watchdog). Per-attempt watchdog
      86400 s: on expiry, checkpoint and resume the unfinished jobs in the
      next attempt-N (M-2). Task watchdog below. run_jobs.py starts no job
      while host MemAvailable is below 4 GB. Timeouts, memory stops,
      attempt-limit stops, pool breaks and crashes are failed_infrastructure,
      retained with their logs, never a mathematical result, and never re-run
      except as M-2 and M-4 state. Do not raise a cap or the worker count
      for any reason.
    - >-
      OUTPUT PATHS. Write only under artifact_paths. For R11: new
      subdirectories attempt-2/, attempt-3/ (only under M-4 or a watchdog
      continuation) and merged/ inside runs/RUN-PFDR-1b78f7-census-m4/. NEVER
