      CELLS, EXACTLY (version 1 `cells`, with v2 C-1 for the j0 curves). Main
      panel: c = 0..4, bits 12..32 step 2, m = 3, 4, 5, the arms of
      arm_order (known_log only at m = 3 and bits <= 24), modes census and
      on, A_fix = s_sub. Rho panel: c = 0..9. j0 panel: c = 0..4, bits
      12..24 step 2, m = 3, arms j0_coset and j0_random_r0..2, modes census
      and on, A_fix = s, rho on the same curves. The subgroup arm at (14,
      curve 4, m = 5) RUNS as frozen in both modes; it is classified by v2
      C-3 and excluded in analysis by C-4. No extra curve, seed, rung or arm,
      and no skipped cell. R11 re-runs only the M-2 resume set and the IE-1
      check job, whose rows never enter the canonical set.
    - >-
      GATES AND CERTIFICATES, UNRELAXED. Every harvested row is re-verified
      as sum_i c_i*F_i + kcoef*Q == rhs*P on an independent Curve instance
      before any elimination (G4: cert_fail == 0 and cert_pass ==
      rows_emitted in every class of every instance). Every solved instance
      satisfies kP = Q. Also G5 (SS-store identity), G6 (lambda check on P
      for every j0 curve; j0_coset formal_basis_rank == 2|F|/3) and G7 (base
      definitions). A certificate or gate failure stops that run as invalid
      (M-1 run_stop_rule), with rows retained. A gate failure is an
      implementation error, never evidence about the hypothesis.
    - >-
      CERTIFICATE FORMAT (tools/validate_ledger.py run schema). This task
      writes many manifests: every attempt, canonical location and run root.
      In each one whose result.certificate.kind is discrete_log (or any other
      kind in CERTIFICATE_KINDS), `result.certificate.verified` is the
      boolean `true`, and only when every claimed solve it covers has
      k_verified true (kP = Q re-checked). It is never a count, a string or
      null. The count goes in a separate key, `instances_verified` (and
      `instances_claimed` beside it), under result.certificate. If any
      claimed solve fails verification, the run is invalid and stops as
      version 1 says (I-3). A manifest must never be written with verified
      true in that case, and never with verified false to keep going. A
      manifest that claims no solve uses kind none. This corrects the format
      defect CI found in RUN-PFDR-1b78f7-census-m3 and -census-m4, where the
      count was written into `verified`. Those two archived manifests are not
      yours to touch.
