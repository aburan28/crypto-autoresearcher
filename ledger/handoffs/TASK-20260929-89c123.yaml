    - >-
      REQUIRED ARTIFACTS (AGENTS.md "Artifact policy", the specification's
      required_artifacts, and AMD-20260929-430f44 M-1, M-5 and M-6). Every
      attempt directory, every canonical location (merged/ or run root) and
