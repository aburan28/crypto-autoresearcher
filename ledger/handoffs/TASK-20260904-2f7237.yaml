handoff:
  id: TASK-20260904-2f7237
  from: coordinator
  to: coordinator
  objective: >-
    Deconflict the digit-statistic experiment cluster under GOAL-ECDLP-001 and
    return an admission recommendation for the one unapproved draft that
    descends from IDEA-20260901-b4e6eb. Three experiments now occupy one
    narrow area, one of them already executing, and no session has assessed
    them against each other.
  uncertainty_reduced: >-
    Whether EXP-ECDLP-a98ea9 (draft, from the b4e6eb line) measures something
    EXP-ECDLP-56ee42 (approved, already run once) does not; whether approving
    it would double-commit budget to one question; and where the proposed
    CAND-D2-A degree audit sits relative to all three. Until this is settled,
    approving any of them risks paying twice for one measurement, and the
    degree audit -- the single highest-value open measurement this goal has --
    cannot be safely dispatched.
  inputs:
    - AGENTS.md
    - agents/coordinator.md
    - docs/task-lifecycle.md
    - docs/claims-and-verification.md
    - templates/research-records.md
    - 'ledger/proposals/IDEA-20260901-b4e6eb.yaml -- 48KB, status proposed, the source of the H-ECDLP-07c7c6 line. READ IN FULL; this is the provenance question.'
    - ledger/proposals/IDEA-20260902-c17bf6.yaml
    - ledger/hypotheses/H-ECDLP-07c7c6.yaml
    - ledger/hypotheses/H-ECDLP-a4be60.yaml
    - ledger/hypotheses/H-ECDLP-af453b.yaml
    - experiments/EXP-ECDLP-a98ea9/specification.yaml
    - experiments/EXP-ECDLP-56ee42/specification.yaml
    - experiments/EXP-ECDLP-3930b1/specification.yaml
    - 'experiments/EXP-ECDLP-56ee42/runs/ -- the one run already executed; read its manifest and results'
    - 'ledger/decisions/DEC-20260903-e9dad9.yaml -- the D2 split verdict, its prior-art finding on b4e6eb, and the budget-conflict flag this task discharges'
    - coordination/goals/GOAL-ECDLP-001/proposals/B71-IDEA436-D2-RESIDUE-20260903-b1653a/tasks/TASK-20260903-b1653a/d2-disposition.yaml
  constraints:
    - >-
      ANSWER FOUR QUESTIONS, SEPARATELY AND IN ORDER. (Q1) Is
      EXP-ECDLP-a98ea9's measured quantity genuinely DISTINCT from
      EXP-ECDLP-56ee42's, or is it the same observable under a different
      name? Compare the actual metric definitions, not the titles. (Q2) Is
      the b4e6eb -> H-ECDLP-07c7c6 conversion FAITHFUL -- does the hypothesis
      preserve the proposal's stated test boundary, claims, and limits, or
      has it drifted? (Q3) Should EXP-ECDLP-a98ea9 be approved, revised, or
      dropped, and on what specific ground? (Q4) Where does the CAND-D2-A
      degree audit sit relative to all three -- upstream, duplicative, or
      complementary?
    - >-
      A verdict of `duplicative` on Q1 is a fully acceptable and valuable
      outcome. Do not strain to find distinctness in order to justify a third
      experiment. This program's standing discipline forbids dispatching work
      that cannot be ranked ahead of doing nothing, and paying twice for one
      measurement is the specific failure this task exists to prevent.
    - >-
      Do NOT change any status. You RECOMMEND; the orchestrating Coordinator
      records the decision. Create no DEC/EV/KN-*/CORR record and mint no
      identifier.
    - >-
      Do not edit any experiment specification, hypothesis, or proposal.
      EXP-ECDLP-56ee42 is approved and has an executed run; its contract is
      frozen and its run is immutable.
    - >-
      If you find that EXP-ECDLP-56ee42's existing run already answers, in
      whole or in part, what a98ea9 proposes to measure, say so explicitly and
      quantify how much is already covered.
    - 'Zero compute. No commands, no experiments, no implementation. experiment_maximum_runs is 0.'
    - >-
      Citation provenance mandatory: recalled | retrieved | kb | internal on
      every source. Do not fabricate a citation.
    - >-
      YAML hygiene, independently re-checked with a strict parser: no plain
      scalar containing an unescaped double-quote or a colon-followed-by-space
      (single-quote the WHOLE scalar if needed); no duplicate keys at any
      nesting level; no bare mapping key inside a block sequence without a
      leading '-'. NOTE: if your session has no shell you cannot run this
      check yourself -- say so plainly in your report and the orchestrating
      Coordinator will run it. Do not claim a parse you did not perform.
  deliverables:
    - >-
      deconfliction-report.yaml: Q1-Q4 answered separately, each with the
      specific evidence it rests on. Include an explicit
      recommended_disposition for EXP-ECDLP-a98ea9 (approve | revise | drop)
      with its ground, and a recommended ordering for CAND-D2-A relative to
      the cluster.
    - >-
      provenance-audit.yaml: the b4e6eb -> H-ECDLP-07c7c6 fidelity check
      (Q2), naming any claim, boundary, or limitation present in the proposal
      but absent from the hypothesis, or vice versa.
    - runtime-session-receipt.json: written last; artifacts, inference provenance, zero experiments, and any operational limitation including whether you could run the strict parse.
  artifact_paths:
    - coordination/goals/GOAL-ECDLP-001/proposals/B71-DIGITSTAT-DECONFLICT-20260904-2f7237/tasks/TASK-20260904-2f7237/deconfliction-report.yaml
    - coordination/goals/GOAL-ECDLP-001/proposals/B71-DIGITSTAT-DECONFLICT-20260904-2f7237/tasks/TASK-20260904-2f7237/provenance-audit.yaml
    - coordination/goals/GOAL-ECDLP-001/proposals/B71-DIGITSTAT-DECONFLICT-20260904-2f7237/tasks/TASK-20260904-2f7237/runtime-session-receipt.json
  archived_by: TASK-20260904-bdf6db
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: null
    memory_gb: null
