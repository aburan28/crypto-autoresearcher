      do not reproduce integer for integer on both meters, or if the
      meters disagree on any control (record the reconstruction finding and
      the absent-file finding); if the shrink test is strictly positive at
      any |FB| >= 5 on the Semaev arm, run NULL-S4 at that cell with all 5
