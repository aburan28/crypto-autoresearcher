    - >-
      Timeouts, OOM, Sage crashes and missing Sage are failed_infrastructure
      with the cell named; never evidence about the mechanism. A cell where
      the two meters disagree is void until the disagreement is localized
      to one named implementation.
    - >-
      The archived builders are run UNMODIFIED at seed 42 for the archived
