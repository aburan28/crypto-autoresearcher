    - >-
      Write only under experiments/EXP-PFDR-4bfc6f/; never commit; never
      run git; never edit the specification, any hypothesis, any evidence
      record, or any archived ALPF artifact.
    - >-
      Record the requested policy (executor-implementation, medium), the
      resolved model identifier, model_verified and fallback_used in every
      manifest's inference block and in the execution report, with the
      Sage version in environment.json; no Bedrock, no fallback, no
