handoff:
  id: TASK-20260731-029
  from: coordinator
  to: idea-generator
  goal_id: GOAL-ECTD-001
  batch_id: BATCH-001
  objective: >-
    Produce exactly three schema-complete IDEA-20260731-016..018 proposals for RQ-ECTD-001 under object-first
    discipline: each names the exact algebraic object that would serve as the private endpoint weakness
    (e.g. a Semaev/Macaulay heavy-tail fingerprint, a vertical conductor barrier plus private solver,
    a hidden correspondence, or a trapdoor-DDH oracle), never 'build a trapdoor for ECDLP', and each writes
    dominated_by and quantitative sota_delta against Pollard rho and against Teske/hidden-SNFS analogues.
  inputs:
  - Verified KN-LIT snapshot from TASK-20260731-028
  - inputs/ECTD-TESKE-20260731/briefing.md (secondary; do not treat as verified)
  - RQ-ECTD-001.yaml and GOAL-ECTD-001.yaml
  - docs/inventor-protocol.md and docs/target-result-profile.md
  - H-ISO-001 (rejected_scoped), IDEA-20260731-008, IDEA-20260726-009
  constraints:
  - >-
    OBJECT-FIRST: every proposal names the exact mathematical object (endpoint weakness + secret path
    object). 'A Teske analogue' without a named weakness is rejected as underspecified.
  - >-
    Respect deprioritization: do not propose hiding anomalous / low-embedding / smooth-order / supersingular
    endpoints behind F_p-isogenies as the main mechanism. Secret-GLV-only constant factors are low priority
    unless framed as a control.
  - >-
    Prioritize among: (1) secret isogeny-aligned factor bases / Semaev heavy tails, (2) large-conductor
    vertical traps, (3) hidden correspondences, (4) trapdoor DDH first. At least two of the three ideas
    must be from families (1)–(2).
  - >-
    Every idea carries predictions with metric+direction, minimal discriminating test with null-object
    controls (same meter on random isogenous neighbors / null End rings), falsification conditions, scope
    limits, numbered heuristics with validation routes, dominated_by, and sota_delta.
  - >-
    Novelty discipline: grep knowledge/ and ledger/; set novelty_status honestly; explicitly distinguish
    from H-ISO-001's short-neighbor negative and from IDEA-20260731-008's public transfer cost gate.
  - >-
    Exactly three IDEA records plus ideation_report.md. No hypothesis, experiment, evidence, or decision;
    no official state change.
  - Record requested policy, resolved model, fallback, and session independence in ideation_report.md.
  - Do not fabricate commands, outputs, timings, statistics, citations, or runs.
  deliverables:
  - IDEA-20260731-016.yaml
  - IDEA-20260731-017.yaml
  - IDEA-20260731-018.yaml
  - ideation_report.md
  artifact_paths:
  - ledger/proposals/IDEA-20260731-016.yaml
  - ledger/proposals/IDEA-20260731-017.yaml
  - ledger/proposals/IDEA-20260731-018.yaml
  - coordination/goals/GOAL-ECTD-001/batches/BATCH-001/tasks/TASK-20260731-029/ideation_report.md
  archived_by: TASK-20260731-030
  inference:
    policy: research-deep
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 3600
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
  - >-
    Exactly three schema-complete IDEA records exist with object-first mechanisms, null-object controls,
    dominated_by, and sota_delta.
  - ideation_report.md records novelty screen results and policy/model metadata.
  - No hypothesis, experiment, evidence, or decision record was created.
