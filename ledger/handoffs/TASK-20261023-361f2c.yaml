handoff:
  id: TASK-20261023-361f2c
  role: executor
  from: coordinator
  to: executor
  objective: Execute exactly the approved paired toy-IC grid through the supervisor.
  uncertainty_reduced: Whether full solve wall time changes with identical targets/relations
    after charged setup.
  inputs:
  - experiments/EXP-ICPERF-3065f9/specification.yaml
  - experiments/EXP-ICPERF-3065f9/trial-plan.json
  - config/ic-target-benchmark.json
  constraints:
  - Launch only after committed approval, ready selector, clean bound sources and
    published live claim.
  - No concurrent scientific producer, no adaptive workload or selective retries.
  - Retain every failure and complete the frozen grid; do not promote a claim.
  deliverables: &id001
  - experiments/EXP-ICPERF-3065f9/runs/RUN-ICPERF-842b51/launch.json
  - experiments/EXP-ICPERF-3065f9/runs/RUN-ICPERF-842b51/execution-receipt.json
  - experiments/EXP-ICPERF-3065f9/runs/RUN-ICPERF-842b51/command.txt
