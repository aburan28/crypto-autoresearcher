  - Every hash must be COMPUTED BY YOU from git, never copied from an existing receipt and never inferred.
    Where you cross-check against an existing receipt, say so and report both values.
  - If any of the 20 paths turns out NOT to be in the opening commit, or the true count is not 20, REPORT
