handoff:
  id: TASK-20260901-d88346
  from: coordinator
  to: executor
  objective: 'Validator finding F-VAL4c225b-1 (MEDIUM) established that BATCH-286bcd''s opening commit
    genuinely committed 22 files, but TASK-20260901-a666e6 declared only 2 of them in artifact_paths,
    so TASK-20260901-d10bc6''s archive machine-hash-pinned only those 2. The other 20 — dispatch_queue.json''s
    committed state at that time, 9 task cards and 10 ledger handoffs — are genuinely committed and reachable
    but were never individually bound by any receipt. DEC-20260901-1fc2f5 offers two routes; TAKE THE
    FIRST: author a supplementary binding document that hash-binds exactly those 20 paths at the opening
    commit.


    This follows the repair chain BATCH-2b0fd1''s DEF-3 already established (TASK-20260815-aa30e8 authors
    the content, TASK-20260815-0f5486 archives it): you AUTHOR, the Coordinator''s snapshot task commits.
    Do NOT edit BATCH-286bcd''s dispatch_queue.json to widen TASK-20260901-a666e6''s artifact_paths —
    that queue''s tasks all read `state: completed` and retroactively widening a completed archive''s
    declared scope would make the dispatcher recompute expected_paths against a commit that has already
    been verified under the narrower set, which is exactly the class of breakage this campaign hit in
    BATCH-2b0fd1''s DEF-3.


    METHOD: identify the opening commit from BATCH-286bcd''s own archive receipts and confirm it with
    `git log --diff-filter=A` / `git show --stat`; list the full set of paths that commit actually changed;
    compute each path''s sha256 AT THAT COMMIT with `git show <commit>:<path> | sha256sum`; separately
    compute each path''s sha256 AT CURRENT HEAD; and report BOTH, flagging every path where they differ
    and saying why (dispatch_queue.json IS expected to differ — it is a living state-tracker that this
    campaign has since updated repeatedly, and that fact is itself the reason it was never a good hash-pin
    target).'
  uncertainty_reduced: Whether the 20 unpinned opening files are byte-identical to what the opening commit
    actually contained. Until they are bound, the gap between what the dispatcher machine-verifies and
    what the task card required staged is undocumented.
