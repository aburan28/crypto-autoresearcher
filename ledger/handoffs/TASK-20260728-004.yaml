handoff:
  id: TASK-20260728-004
  from: coordinator
  to: coordinator
  batch_id: BATCH-010
  goal_id: GOAL-ECDLP-001
  authorizing_decisions: [DEC-20260728-001]
  title: >-
    Determine and ledger-archive the BATCH-010 outcome: the evidence record for
    EXP-RT1476-001, the close decision, any H-RT1476-001 status transition, the goal
    checkpoint, and this batch's queue

  objective: >-
    In two explicitly separated phases, (1) DETERMINE what the validated EXP-RT1476-001 run set
    supports - authoring the evidence record and the close decision in full and final form under
    this card's coordination directory - and then (2) INSTALL them as ONE isolated verified ledger
    commit together with any H-RT1476-001 status transition, the GOAL-ECDLP-001 BATCH-010
    checkpoint, and this batch's dispatch_queue.json.
  uncertainty_reduced: >-
    What the first measurement of the RT-1476-SUBRES-A1 exponents officially establishes, and
    whether that determination is durable, hash-bound and officially recorded.

  two_phase_structure_and_why_it_is_declared: >-
    AGENTS.md and agents/coordinator.md forbid exercising fresh judgement inside a commit task,
    and BATCH-009 handled this by splitting determination (TASK-20260727-005) from installation
    (TASK-20260727-006) across two cards. This batch has four cards, so the split is INTERNAL to
    this one and is declared rather than blurred. PHASE 1 writes
    coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/decisions/TASK-20260728-004/determination.yaml
    carrying complete, schema-conforming, installable-verbatim blocks. PHASE 2 stages and commits.
    No judgement is exercised in phase 2: if a phase-1 block is incomplete or non-conforming,
    phase 2 STOPS and records the defect. If the validator's verdict requires a substantive
    determination this card cannot make within its budget - for example a CANNOT_DETERMINE verdict
    or a favourable beta_deg that engages AGENTS.md rule 12 - phase 1 records that, installs no
    evidence record, and a successor determination card is opened by a NEW Coordinator decision.

  inputs:
    - 'coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/validation/TASK-20260728-003/validation_report.yaml and adversarial_notes.md - the terminal verdict this determination must rest on.'
    - 'coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/archives/TASK-20260728-002/snapshot_commit_receipt.json - the binding for the run set.'
    - 'experiments/EXP-RT1476-001/specification.yaml (frozen criteria and the pre-registered three-way landing), results_summary.json, analysis.md, and the 27 run directories.'
    - 'ledger/hypotheses/H-RT1476-001.yaml, ledger/decisions/DEC-20260728-001.yaml, ledger/decisions/DEC-20260728-002.yaml'
    - 'ledger/goals/GOAL-ECDLP-001.yaml AS IT STANDS AT COMMIT TIME, which may have been advanced by a concurrent co-driver.'
    - 'templates/research-records.md evidence, coordinator_decision, hypothesis and research_goal schemas; docs/claims-and-verification.md.'
    - 'tools/validate_ledger.py, tools/research_dispatch.py, docs/dynamic-subagent-dispatch.md, docs/task-lifecycle.md.'

  constraints:
    - >-
      AN INVALID OR INCOMPLETE RUN SET IS NOT EVIDENCE. If TASK-20260728-003 returns INVALID, no
      evidence record is written and no hypothesis status moves. The determination records the
      concrete defects, returns the work to the Executor as a scoped successor task, and the
      archive installs the decision and the goal checkpoint only. That is a completed batch with a
      returned run set, not a negative result about H-RT1476-001.
    - >-
      THE OUTCOME IS NOT PRE-DECIDED, AND THE ADVERSE PRIOR IS NOT A CONCLUSION. The specification
      records that the red team predicts beta_ops -> 3/2 and that the generic count predicts
      beta_deg = 0.6. That is a PRIOR. If the measurement contradicts it, saying so is the correct
      output; if it confirms it, saying so is the correct output; if the data cannot discriminate,
      INCONCLUSIVE is the correct output and must be stated plainly. Do not let the prior write the
      verdict.
    - >-
      HONOUR THE PRE-REGISTERED THREE-WAY LANDING in the specification's
      intermediate_outcome_branch_preregistered. In particular, a beta_deg in [0.3, 0.6) FAILS the
      gate while ALSO not reproducing the generic null, and that band must be reported as its own
      observation rather than rounded to either end.
    - >-
      CONTROL GATE IS BINDING AND BIDIRECTIONAL. If CTRL-POS failed INVALID-4, the meter is not
      demonstrated sound and NO primary conclusion may be drawn in either direction - the main arm
      may NOT be read as evidence against H-RT1476-001. State that explicitly if it applies.
    - >-
      STRENGTH AND TIER CEILINGS, BINDING. claim_tier toy, mechanically, from a 24-bit maximum
      field. Evidence strength from this single unreplicated run set may not exceed preliminary.
      H-RT1476-001 MAY NOT MOVE TO supported. reject_scoped on a single unreplicated
      empirical_only run set is FORBIDDEN: an adverse result takes weaken plus replication.
      Admissible landings for the hypothesis are specified, running, analyzed, weakened or
      inconclusive; choose exactly one, name it, and reason the rejected alternatives by name.
    - >-
      BEFORE ANY ADVERSE TRANSITION, name the strongest checkable refutation artifact the result
      admits - counterexample certificate, then derivation note, then declared empirical_only -
      cite where it is archived, and confirm it was archived BEFORE the decision that relies on it
      (docs/claims-and-verification.md, Refutation artifacts). An undeclared basis is the failure,
      not the absence of a proof. Record proof_status and proof_refs on the evidence record.
    - >-
      IF beta_deg COMES BACK BELOW 0.3 ON A VALID RUN SET, that is a claim in AGENTS.md rule 12's
      class - it would open the program's only sub-rho window. TASK-20260728-003 at
      review-adversarial does NOT discharge rule 12 for it. In that branch: record the measurement
      and its scope, record rule 12 as UNDISCHARGED, authorize no sub-rho reading, and name the
      conforming review-breakthrough-at-max re-review as a required successor. A favourable toy
      measurement is not a window.
    - >-
      SCOPE EVERY SENTENCE. Any negative finding closes exactly the tested scope: these sampled
      prime-order curves, these three moduli, this x-line factor base at L = round(q^(1/5)), the
      serial-S3 2|3 split at m = 5, this sympy/GF(p) implementation, this budget. It closes
      nothing about other arities, other splits, other geometries, larger fields, or prime-field
      ECDLP, and it is not a universal impossibility claim.
    - >-
      IDENTIFIER ALLOCATION, BINDING, AND A JUDGEMENT REVERSED BEFORE COMMIT. EV-RT1476-001 and
      DEC-20260728-003 are both PRE-ALLOCATED and reserved in DEC-20260728-001, and both were
      confirmed free across the UNION of ledger/*.yaml and the typed subdirectory at batch opening.
      RECONFIRM BOTH AT HEAD in phase 1, record the check, and STOP AND ESCALATE rather than shift
      the allocation if either is taken. The first draft of this card deliberately did NOT
      pre-allocate the close-decision id, on the reasoning that the close might fall on a later date
      and DEC-20260727-005 rationale item 10 requires allocating strictly above the union maximum AT
      ALLOCATION TIME. That reasoning is withdrawn for two concrete reasons and the withdrawal is
      recorded rather than quietly applied: the dispatcher requires every artifact_path to be an
      exact file path and rejected the placeholder, and deferring would have left this archive
      committing a path it had not declared, which fails the "changes exactly the declared paths"
      check. Reservation is established practice here - DEC-20260727-005 reserved DEC-20260727-006
      and -007 in advance and DEC-20260727-007 was issued at its reserved identifier - and a
      reservation binds even if the close falls on a later date, because identifiers are immutable
      and a reserved one is not re-dated. Name both ids in the receipt and in the commit message.
    - >-
      RUN THE COMMIT ALONE. Stage only the declared paths plus the phase-1 determination artifact.
      Preserve unrelated dirty files. Do not stage AppleDouble siblings (._*).
    - >-
      DO NOT OVERWRITE ANY PUBLISHED RECORD. Corrections supersede, never overwrite. Do not touch
      any run record, do not edit experiments/EXP-RT1476-001/specification.yaml, and do not touch
      anything under knowledge/ - the CORR-20260727-003 knowledge obligation is TASK-20260727-008
      and is outside this batch.
    - >-
      GOAL RECORD: re-read ledger/goals/GOAL-ECDLP-001.yaml AT COMMIT TIME and reconcile against
      its then-current committed content, not against any earlier copy. Apply
      campaign_budget.maximum_batches 8 -> 9 citing DEC-20260728-001; set current_batch_id
      BATCH-010 and dispatch_queue_path to this batch's queue; append the BATCH-010 checkpoint with
      its exact task ids, the validator verdict, the evidence and decision ids, the archive task
      ids and a claim_boundary; set latest_verified_commit ONLY to a commit whose full verification
      is recorded in a COMMITTED receipt; and preserve EXACTLY ONE next_action.
    - >-
      PRESERVE THE PRIOR next_action OR RECORD THE DIVERGENCE VERBATIM. The goal record's current
      single next_action is TASK-20260727-008, the CORR-20260727-003 knowledge action plus the
      Report 94 demotion of BAR-PATHDYN-CONDTAIL-D2. It is UNDISCHARGED and is not closed,
      countermanded or judged by this batch. If you replace it, quote its prior value verbatim in
      the checkpoint so nothing is lost, exactly as the BATCH-009 checkpoint did. TASK-20260727-009
      and TASK-20260727-010 remain open likewise, and TASK-20260727-001 stays reserved by
      ESC-20260727-001 section E and is not reused.
    - >-
      GOAL STATUS: paused, blocked, closed_at_budget and active are available; completed is NOT,
      under any outcome, because AGENTS.md rule 13 requires three CONCUR attestations with
      pairwise-distinct resolved_model_id, none exists, and no attestation may be recorded that was
      not obtained. State which status was set and which pause_condition, if any, was applied.
      Note DEC-20260728-001's terminal condition: a valid run set with beta_deg >= 0.3 closes
      RT-1476-SUBRES-A1 on the tested scope and the goal does NOT proceed to BATCH-011 by default -
      any further batch needs its own decision naming the new uncertainty.
    - >-
      STAGE THIS BATCH'S OWN QUEUE. Update
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/dispatch_queue.json card states FROM
      COMMITTED RECEIPTS ONLY, give each card a state_basis, and include the queue among the staged
      paths. Two consecutive batches closed with a stale queue because the verifier only checks
      paths the archive itself declared; this archive declares its own queue.
    - >-
      The commit message must contain the literal string TASK-20260728-004 and every entry of the
      effective archive.record_ids, and must also name TASK-20260728-001, TASK-20260728-002 and
      TASK-20260728-003. BATCH-004's ledger archive is permanently blocked for omitting its own
      task id; do not repeat it.
    - >-
      Compute every SHA-256 from Git object content at the resulting commit, never from the working
      tree. Never invent, estimate or back-fill a hash or a commit sha.
    - >-
      Run the full post-commit check (resolves; ancestor of HEAD; declared first parent; exactly
      the declared paths with no extras or deletions; every SHA-256 matching commit content; message
      contains the task id and every record id) and record the per-check result and one verdict.
      Stop on any failure and record it rather than a research conclusion. An archive failure is an
      evidence-integrity failure, never a mathematical result.
    - 'Authorize no execution of any experiment, including EXP-GGM-001 version 1 and any successor version of EXP-RT1476-001.'

  deliverables:
    - 'coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/decisions/TASK-20260728-004/determination.yaml - phase 1: the validator verdict quoted verbatim; the determined landing for H-RT1476-001 with rejected alternatives reasoned by name; the refutation-artifact basis if adverse; a complete proposed_evidence_record installable verbatim as ledger/evidence/EV-RT1476-001.yaml with claim_tier, proof_status, proof_refs, certificate_refs, run_ids and boundaries populated; a complete proposed_decision_record installable verbatim as ledger/decisions/DEC-20260728-003.yaml with knowledge_promotion filled; the exact goal-checkpoint field list; and every follow-up assigned to a successor rather than performed here.'
    - 'coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/archives/TASK-20260728-004/ledger_commit_receipt.json - phase 2: kind ledger, source_task_ids, record_ids, declared paths, commit_sha, parent_sha, complete path_sha256 from Git object content, and a post_commit_verification block with a per-check result and one verdict.'
    - 'ledger/evidence/EV-RT1476-001.yaml - installed verbatim from the determination, or deliberately absent with the reason recorded if the run set is invalid.'
    - 'ledger/decisions/DEC-20260728-003.yaml - the close decision, installed verbatim from the determination at its pre-allocated reserved identifier, with knowledge_promotion filled.'
    - 'ledger/hypotheses/H-RT1476-001.yaml - with at most one field changed, its status, and only if the determination authorises a transition.'
    - 'ledger/goals/GOAL-ECDLP-001.yaml - with the extended batch budget citing DEC-20260728-001, the BATCH-010 checkpoint, the applied status condition, and exactly one next_action.'
    - 'coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/dispatch_queue.json - card states set from committed receipts only, each with a state_basis.'

  artifact_paths:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/decisions/TASK-20260728-004/determination.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/archives/TASK-20260728-004/ledger_commit_receipt.json
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/dispatch_queue.json
    - ledger/evidence/EV-RT1476-001.yaml
    - ledger/decisions/DEC-20260728-003.yaml
    - ledger/hypotheses/H-RT1476-001.yaml
    - ledger/goals/GOAL-ECDLP-001.yaml
  artifact_paths_note: >-
    Every entry is an exact repository-relative FILE path. The first draft listed
    'ledger/decisions/<close-decision-id allocated in phase 1 across the union>.yaml' - a
    placeholder, not a path - which the dispatcher rejects. See the identifier-allocation
    constraint above for why the deferral was withdrawn.
  conditional_paths:
    - path: ledger/evidence/EV-RT1476-001.yaml
      condition: >-
        Created only if TASK-20260728-003 returns VALID or VALID_WITH_SCOPE_REDUCTION. If the run
        set is INVALID it is NOT created, and it is removed from the effective declared-path set
        AND from archive.record_ids, with the removal and its reason recorded in the receipt.
        Naming a record the archive did not create would make the verifier's message check pass
        for a false reason.
    - path: ledger/hypotheses/H-RT1476-001.yaml
      condition: >-
        Modified only if the determination authorises a status transition, and then in exactly one
        field. If no transition is authorised it is untouched and drops out of the effective
        declared-path set: staging an unchanged file produces an empty diff and fails the verifier.
    - rule: >-
        The effective declared-path set is fixed in phase 1, recorded in the determination and in
        the receipt, and is what the post-commit "changes exactly the declared paths" check is
        evaluated against. Dropping a conditional path is a recorded decision, never a silent
        omission.
  write_scope:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/decisions/TASK-20260728-004/
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/archives/TASK-20260728-004/
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/dispatch_queue.json
    - ledger/evidence/EV-RT1476-001.yaml
    - ledger/decisions/DEC-20260728-003.yaml
    - ledger/hypotheses/H-RT1476-001.yaml
    - ledger/goals/GOAL-ECDLP-001.yaml
  read_scope:
    - AGENTS.md
    - docs/
    - templates/
    - tools/
    - experiments/EXP-RT1476-001/
    - ledger/
    - coordination/goals/GOAL-ECDLP-001/
  archived_by: TASK-20260728-004
  archived_by_note: 'Self-archiving ledger archive, the same pattern as TASK-20260727-006. It claims TASK-20260728-003 as its source task.'
  review_required: false
  depends_on: [TASK-20260728-003]

  archive:
    kind: ledger
    source_task_ids: [TASK-20260728-003]
    commit_sha: null
    parent_sha: null
    path_sha256: {}
    record_ids: [EV-RT1476-001, DEC-20260728-003, H-RT1476-001, EXP-RT1476-001, GOAL-ECDLP-001,
      BATCH-010]
    record_ids_note: >-
      DEC-20260728-003 is the pre-allocated, reserved close-decision identifier; phase 1 reconfirms
      it free at HEAD across the union and stops rather than shifting if it is taken. If the run set
      is INVALID, EV-RT1476-001 is REMOVED from the effective set rather than named in a message for
      a record the archive did not create - naming a record the archive neither creates nor changes
      would make the verifier's message check pass for a false reason. Likewise H-RT1476-001 is
      removed if no status transition is authorised. The message check is evaluated against the
      EFFECTIVE set recorded in the receipt.

  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false

  budget:
    wall_clock_seconds: 900
    memory_gb: 2
    maximum_runs: 1

  completion_gate:
    - 'The phase-1 determination exists, quotes the TASK-20260728-003 verdict verbatim, and rests on it rather than on any Coordinator prior.'
    - 'Exactly one landing is determined for H-RT1476-001, with the rejected alternatives named and reasoned, or the run set is recorded INVALID and no status moves.'
    - 'H-RT1476-001 was NOT set to supported and no reject_scoped was recorded on this single unreplicated run set.'
    - 'If the determination is adverse, the strongest available refutation artifact is named, its archive location cited, and its archival confirmed to precede this decision.'
    - 'claim_tier does not exceed toy and evidence strength does not exceed preliminary.'
    - 'DEC-20260728-003 and EV-RT1476-001 were each RECONFIRMED free at HEAD across the UNION of ledger/*.yaml and the typed subdirectory in phase 1, the check is recorded, and both ids are named in the receipt and the commit message. If either was taken, the task stopped and escalated rather than shifting the allocation.'
    - 'The effective declared-path set and the effective record_ids set are recorded in the receipt, with any conditional path or record id dropped for a stated reason rather than silently omitted.'
    - 'proposed_evidence_record and proposed_decision_record were installed verbatim, or the archive stopped with the defect recorded; no fresh judgement was exercised in phase 2.'
    - 'At most one field of ledger/hypotheses/H-RT1476-001.yaml was changed, and no published record was overwritten.'
    - 'The goal record carries the extended batch budget citing DEC-20260728-001, the BATCH-010 checkpoint, the applied status condition, and exactly one next_action reconciled against its then-current committed content; any replaced next_action is quoted verbatim.'
    - 'GOAL-ECDLP-001 was not set to completed and no closure attestation was recorded.'
    - 'This batch dispatch_queue.json is among the staged paths and its card states are set from committed receipts only.'
    - 'The commit message contains the literal TASK-20260728-004, TASK-20260728-001, TASK-20260728-002, TASK-20260728-003 and every effective record id.'
    - 'Every SHA-256 was computed in this task from Git object content, and the post-commit verification block records a result for each required check and one verdict.'
    - 'Nothing under experiments/ or knowledge/ was modified and no execution was authorized.'
  return_format: >-
    A YAML determination carrying installable record blocks, then a Coordinator ledger archive
    receipt JSON with a per-check post-commit verification block, plus the installed immutable
    evidence, decision, hypothesis and goal records.
  created_by: coordinator
  created_at: '2026-07-28'
