handoff:
  id: TASK-20260907-7bf406
  id_allocation_provenance: >-
    Pre-minted and `--check`ed free by the orchestrating session and relayed to
    this Coordinator authorship in the BATCH-8f3e86 batch-open instruction.
    This authorship minted nothing and scanned no state for a maximum.
  recorded_at: '2026-09-07'
  goal_id: GOAL-ECDLP-bbc21f
  question_id: RQ-ECDLP-78dbc5
  batch_id: BATCH-8f3e86
  dispatch_queue: coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-8f3e86/dispatch_queue.json
  task_card: coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-8f3e86/tasks/TASK-20260907-7bf406/task_card.yaml
  role: coordinator
  from: coordinator
  to: coordinator (archive)
  review_required: false
  runs_alone: true

  objective: >-
    COORDINATOR-ONLY SNAPSHOT ARCHIVE, RUNS ALONE. Commit the exact,
    unmodified artifact package that the Executor TASK-20260907-aad514
    produced -- experiments/EXP-ECDLP-612fb1/source_v3/, the eleven new run
    directories under experiments/EXP-ECDLP-612fb1/runs/, and the executor's
    execution_report.yaml and artifact_inventory.json -- BEFORE either
    independent reviewer reads any of it. This task STAGES; it does not
    AUTHOR. Every byte it commits was written by the Executor, and this task
    creates no research content of its own beyond its own snapshot receipt.
  uncertainty_reduced: >-
    Whether the Executor's declared artifact set matches its own
    artifact_inventory.json hash for hash, and whether the reviewers will
    therefore be reading immutable, committed bytes rather than a live working
    tree. Per AGENTS.md "Durable research commits", a run package that has not
    passed this gate is not evidence and is not reviewable.

  inputs:
    - "coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-8f3e86/tasks/TASK-20260907-aad514/artifact_inventory.json -- the Executor's own binding declaration of every file it wrote, with per-file sha256. This is the authority for what gets staged; nothing else is."
    - "coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-8f3e86/tasks/TASK-20260907-aad514/execution_report.yaml -- the Executor's run inventory, per-cell verdicts, control outcomes and validity statuses."
    - "ledger/handoffs/TASK-20260907-aad514.yaml -- the Executor's declared artifact_paths and write_scope. A path in the inventory that is not in this declared scope is a SCOPE EXPANSION and blocks the archive."
    - "experiments/EXP-ECDLP-612fb1/amendments/v2_to_v3.yaml -- the approved protocol, for the run-id list of its Section 4."

  constraints:
    - "RUNS ALONE. No other task of BATCH-8f3e86 may be in flight while this one commits. Concurrent writers in one shared worktree is the failure mode this rule exists to prevent (AGENTS.md 'Durable research commits')."
    - "STAGE ONLY DECLARED PATHS. Stage exactly the repository-relative paths the Executor's artifact_inventory.json binds, and nothing else. A `git add -A`, a `git add .`, or any staging of an undeclared path is a scope-expanding commit and is an evidence-integrity failure, not a convenience."
    - "VERIFY BEFORE COMMITTING. Recompute the sha256 of every inventory-bound path and compare it to the recorded value. A single mismatch STOPS the archive: report it and do not commit."
    - "THIS TASK AUTHORS NO RESEARCH CONTENT. It writes exactly one file of its own, its snapshot receipt. It does not edit, repair, reformat, complete or 'tidy' any executor artifact, does not re-score any run, and does not write any ledger record (no EV-*, DEC-*, H-*, KN-*, GOAL-*). If an executor artifact is defective, that is a finding for the receipt and a matter for the Coordinator, never something to fix here."
    - "IMMUTABILITY. specification.v2.yaml, source_v2/, the v1 runs (RUN-ECDLP-612fb1-001..037) and the sixteen v2 runs are frozen. This commit adds new paths; it modifies none of them. Never rewrite history over pushed run records."
    - "BRANCH DISCIPLINE. Before committing, fetch origin/main and MERGE (never rebase) any new main commits into the working branch cursor/run-experiments-batch-93e3; record in the receipt the base commit checked and the merge outcome. A sync conflict inside a run artifact is NEVER resolved by editing the artifact -- stop and escalate for a superseding record (AGENTS.md 'Durable research commits')."
    - "PUBLISH. After the commit, push the branch and open or refresh the PR against main naming the records this commit carries (agents/coordinator.md branch/PR discipline). A record that exists only in a local commit is unpublished, not durable evidence."
    - "GIT EXECUTION NOTE: in this deployment the DRIVING SESSION runs the git commands. This handoff specifies exactly what must be staged, verified, committed and pushed; whoever executes it does so under that specification and records the resulting shas in the receipt."

  deliverables:
    - "coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-8f3e86/archives/TASK-20260907-7bf406/snapshot-receipt.json -- the post-commit receipt: commit_sha, parent_sha, the exact staged path list, per-path sha256 as committed, the base origin/main commit checked and the merge outcome, the push/PR reference, and any defect found in the executor package."

  artifact_paths:
    - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-8f3e86/archives/TASK-20260907-7bf406/snapshot-receipt.json
  archived_by: TASK-20260907-7bf406
  write_scope:
    - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-8f3e86/archives/TASK-20260907-7bf406/
  staging_scope:
    - experiments/EXP-ECDLP-612fb1/source_v3/
    - experiments/EXP-ECDLP-612fb1/runs/RUN-ECDLP-612fb1-v3-rep20-s1/
    - experiments/EXP-ECDLP-612fb1/runs/RUN-ECDLP-612fb1-v3-rep20-s2/
    - experiments/EXP-ECDLP-612fb1/runs/RUN-ECDLP-612fb1-v3-rep20-s3/
    - experiments/EXP-ECDLP-612fb1/runs/RUN-ECDLP-612fb1-v3-rep20-s4/
    - experiments/EXP-ECDLP-612fb1/runs/RUN-ECDLP-612fb1-v3-rep20-s5/
    - experiments/EXP-ECDLP-612fb1/runs/RUN-ECDLP-612fb1-v3-g3x24-s1/
    - experiments/EXP-ECDLP-612fb1/runs/RUN-ECDLP-612fb1-v3-g3x24-s2/
    - experiments/EXP-ECDLP-612fb1/runs/RUN-ECDLP-612fb1-v3-g3x24-s3/
    - experiments/EXP-ECDLP-612fb1/runs/RUN-ECDLP-612fb1-v3-g3x24-s4/
    - experiments/EXP-ECDLP-612fb1/runs/RUN-ECDLP-612fb1-v3-g3x24-s5/
    - experiments/EXP-ECDLP-612fb1/runs/RUN-ECDLP-612fb1-v3-analysis-001/
    - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-8f3e86/tasks/TASK-20260907-aad514/
  staging_scope_note: >-
    `write_scope` above is the set of paths this task AUTHORS, and it is
    DISJOINT from every other task's write_scope in this batch.
    `staging_scope` is the separate, larger set of already-written paths it
    STAGES into a commit. The distinction is deliberate and is why a snapshot
    archive does not collide with the producer whose output it commits: the
    Executor's task directory and run directories are authored by
    TASK-20260907-aad514 and merely committed here, unmodified and
    hash-verified. The same shape is used by this goal's previous batch
    (BATCH-f3a30a, TASK-20260906-1e5ea4).
  read_scope:
    - experiments/EXP-ECDLP-612fb1/
    - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-8f3e86/
    - ledger/handoffs/

  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  inference_note: >-
    Matches orchestration/model-policies.yaml `routing_rules` id
    `coordinator-code-path` (`task_requires_repo_orchestration: true`), which
    requires policy `coordinator-orchestration-code`. `fallback_allowed` is
    false because the substitution this task's fallback_policy would make
    (coordinator-orchestration) is a contract without the repository code
    path this task IS; a backend that cannot serve the code-path policy should
    stop rather than commit research artifacts under a weaker contract.
  budget:
    wall_clock_seconds: 900
    memory_gb: 2
    maximum_runs: 0
  budget_note: >-
    Zero-run task: it executes no experiment. 900 s and 2 GB match the
    equivalent snapshot archive of this goal's previous batch
    (TASK-20260906-1e5ea4, BATCH-f3a30a), which staged a strictly larger v2
    package (sixteen run directories plus source_v2/) inside the same
    envelope. Machine protection on a 4-core, 15 GB container; runs alone, so
    it has the host to itself.

  completion_gate:
    - "Every path in the Executor's artifact_inventory.json exists and matches its recorded sha256 at stage time, and every staged path lies inside TASK-20260907-aad514's declared artifact_paths / write_scope."
    - "All eleven run directories of the amendment's Section 4 are present with their full required-artifact sets, or the receipt states exactly which are missing and the archive is reported as BLOCKED rather than partially committed."
    - "The commit changes exactly the declared paths -- no more, no fewer -- and its message names TASK-20260907-7bf406, TASK-20260907-aad514, BATCH-8f3e86, EXP-ECDLP-612fb1 and the eleven run ids."
    - "snapshot-receipt.json records commit_sha, parent_sha, the per-path sha256 as committed, the origin/main base commit checked and the merge outcome, and the push/PR reference."
    - "The branch is pushed and an open PR against main names the records this commit carries."
    - "No ledger record was written, no hypothesis or experiment status was changed, and no executor artifact was modified."

  gate_note: >-
    NOTHING DOWNSTREAM MAY PROCEED ON AN UNVERIFIED SNAPSHOT. The Validator
    TASK-20260907-b2a8ad and the Red Team TASK-20260907-ee1ca7 both depend on
    this task precisely so that they read committed, immutable bytes. A
    missing, dirty, malformed or scope-expanding commit BLOCKS both reviews;
    that is an evidence-integrity failure and never a mathematical result
    about the G3 predicate (AGENTS.md core rule 5).
  return_format: >-
    snapshot-receipt.json at the declared path. Facts only: what was staged,
    what hashed, what committed, what was pushed, what was found defective. No
    interpretation of the G3 result and no verdict on the claim.
