handoff:
  id: TASK-20260801-053
  from: coordinator
  to: coordinator
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-025
  objective: >-
    Commit the exact TASK-20260801-052 reading rule alone, with this receipt, so that RR-LPF-1 and
    ATTAIN-RR-LPF-1 are HASH-BOUND BEFORE ANY INDEPENDENT SESSION READS THEM AND BEFORE THE REAL
    OBJECT IS TOUCHED, and bind the calibration validation report's sha256 as a named field.
  uncertainty_reduced: >-
    Whether the reading rule provably predates its data, which is the only thing that makes a
    pre-registration claim checkable.
