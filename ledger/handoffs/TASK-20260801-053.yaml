  - TASK-20260801-052 artifacts
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/reviews/TASK-20260801-051/calibration_validation_report.yaml
  constraints:
  - 'RUN ALONE. Stage exactly two paths - experiments/EXP-LPF-001/reading_rule.yaml and this receipt.'
  - >-
    DO NOT STAGE the calibration validation report. Bind its sha256 as a named receipt field
    instead. The report is owned by TASK-20260801-051 and archived by the ledger task
    TASK-20260801-060, because _validate_review_chains requires a review's archive to be a LEDGER
    archive depending directly on it.
  - 'Record READING_RULE_SHA256 and CALIBRATION_VALIDATION_REPORT_SHA256 as named fields.'
  - 'State NO interpretation and NO approval determination.'
  - 'Commit message must contain TASK-20260801-053, TASK-20260801-052, EXP-LPF-001, RR-LPF-1, GOAL-ECDLP-001, BATCH-025.'
  - 'Do not push from this task.'
  deliverables:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/archives/TASK-20260801-053/snapshot_commit_receipt.json
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/archives/TASK-20260801-053/snapshot_commit_receipt.json
  archived_by: TASK-20260801-053
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 900
    memory_gb: 1
    maximum_runs: 1
  completion_gate:
  - 'Post-commit verifier accepts the exact two-path diff and hashes.'
  - 'READING_RULE_SHA256 and CALIBRATION_VALIDATION_REPORT_SHA256 recorded as named fields.'
  - 'No interpretation and no authorization stated.'
