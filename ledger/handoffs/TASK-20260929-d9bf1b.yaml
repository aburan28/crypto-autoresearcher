  constraints:
    - >-
      Run only after BOTH TASK-20260929-accb8e and TASK-20260929-f29c96 have
      returned (any status) and both sessions have ended (no live writer),
      and after TASK-20260929-17b4a2's receipt has verified. No other
      archival task is running in this worktree, TASK-20260929-091c3a
      included.
    - >-
      THE PERSON RUNNING THIS TASK DOES NOT READ THE REPORTS' VERDICTS OR
      FINDINGS. The checks below are mechanical: parse, hash, run the
      checker, compare digests. Nothing from a report's content is
      summarised in the commit message, the receipt or the PR.
    - >-
      git fetch and merge origin/main into
      claude/point-decomposition-index-calculus-1rfntm first (merge, never
      rebase). Record the base commit checked and the merge outcome. A
      conflict inside a record or report is a stop, resolved only by a
      superseding record, never by picking a side.
    - >-
      PRE-STAGING CHECKS, WITHOUT EDITING. (a) Every path of the
      TASK-20260929-0f66ef and TASK-20260929-17b4a2 receipts still has its
      recorded path_sha256, so no reviewer changed the package or the plan.
      (b) Nothing was written outside the two write scopes in the shared
      tree (git status, reported), and each detached worktree the launch
      facts named is clean at a32e70808 (git -C <wt> status --porcelain and
      rev-parse HEAD, reported). (c) Each attestation.yaml and each report
      YAML parses with yaml.safe_load. (d) Seal custody: the sha256 of
      coordination/review/pfdr-1b78f7-20260929/reviews/TASK-20260929-accb8e/rederivation/sealed-section.yaml
      equals the digest logged at seal time in that task's
      checks/read-log.txt, and equals the attestation's
      sealed_artifact_sha256. (e) Run, read-only, `python3
      tools/check_review_independence.py --plan
      ledger/handoffs/TASK-20260929-accb8e.yaml --reports
      coordination/review/pfdr-1b78f7-20260929/reviews/TASK-20260929-accb8e/attestation.yaml
      coordination/review/pfdr-1b78f7-20260929/reviews/TASK-20260929-f29c96/attestation.yaml`
      and write its stdout, stderr and exit code verbatim to
      coordination/review/pfdr-1b78f7-20260929/independence-check.txt. The
      expected output is exactly one problem: the line reporting that
      re-deriver TASK-20260929-accb8e read blind_from paths (plan PD-2).
      (f) Run tools/validate_ledger.py on the merged head and record its
      output. (g) No file to be staged exceeds the remote's size limit.
    - >-
      ARCHIVE AS PRODUCED. A failed (a) or (d), an unexpected checker
      problem in (e), or a missing report is recorded in the receipt's
      scope_findings and reported to the Coordinator, and the reports are
      STILL archived as produced. The Coordinator decides what the finding
      means at composition. The exceptions are a merge conflict, an
      oversized file (g), and a file a reviewer wrote outside its scope:
      stop before committing and report the first two; list the third and
      do not stage it. Never edit, trim, re-run or regenerate a report to
      make a check pass.
    - >-
      Stage ONLY the paths under artifact_paths that exist, plus this card's
      receipt. A conditional path that does not exist is recorded as
      absent, not as a finding. Nothing from any scratch directory, and no
      __pycache__ file, is staged.
    - >-
      One commit whose message names TASK-20260929-d9bf1b,
      TASK-20260929-accb8e, TASK-20260929-f29c96, TASK-20260929-17b4a2,
      EXP-PFDR-1b78f7 and H-PFDR-4765e4, and carries no verdict, measured
      value or outcome id. Then write and verify the post-commit receipt with
      tools/research_dispatch.py (content_at_commit: path_sha256 for every
      staged path), push, and refresh PR #1487 (or open a PR against main)
      naming the same ids. The reports are not durable until the verifier
      accepts them.
    - No hypothesis, experiment, evidence or goal status changes in this task.
    - Never select a provider, backend, endpoint or model identifier containing Bedrock.
