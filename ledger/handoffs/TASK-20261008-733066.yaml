# =============================================================================
# TASK-20261008-733066 -- Coordinator-only LEDGER ARCHIVE of the sealing card
# TASK-20261008-5e4188 and of this card, with its receipt. It runs FIRST and
# alone, before 5e4188 runs, so that the sealing archive acts on a committed
# card (the orthodox order; no PD-1-style deviation).
# The adjudication report directory is present and untracked while this task
# runs. It is admitted by exact path in the git-status check and is never
# opened, staged or read.
# Carries a reference table: check (j) runs before anything is staged.
# =============================================================================
handoff:
  id: TASK-20261008-733066
  id_provenance: >-
    Minted by the top-level session with tools/allocate_id.py and confirmed
    free with --check, then supplied to this Coordinator. The Coordinator has
    no shell and minted no identifier.
  created_at: '2026-10-08'
  created_by: coordinator
  from: coordinator
  to: coordinator
  performed_by: the top-level session (Coordinator-only archival task; runs alone)
  status: written_not_dispatched
  archive_kind: ledger
  receipt_binding: content_at_commit
  goal_id: null
  batch_id: null
  review_plan_id: null
  experiment_id: EXP-PFDR-0b3699
  hypothesis_id: H-PFDR-2765d2
  question_id: RQ-PFDR-ae2fba
  authorised_by: DEC-20261008-8cb005 PD-3 (the sealing card is written by the Coordinator on e2830e's return)
  review_required: false
  title: Ledger archive of the sealing card TASK-20261008-5e4188 and this card, before the sealing snapshot runs
  objective: >-
    Commit the cards TASK-20261008-5e4188 and TASK-20261008-733066, with this
    receipt, in one isolated commit, after the check (j) of this card's
    reference_table passes. Then verify, push and refresh the PR.
  uncertainty_reduced: None scientific. This makes the sealing archive's authority durable before it runs.
  inputs:
    - ledger/handoffs/TASK-20261008-5e4188.yaml and this card (working tree)
    - ledger/handoffs/TASK-20261008-e2830e.yaml and ledger/decisions/DEC-20261008-8cb005.yaml (read-only, for check (j))
    - coordination/design/TASK-20260928-102217/archives/TASK-20261008-7457ec/ledger-receipt.json
  constraints:
    - >-
      ORDER.
      (1) Check (j): run every row SC-01 to SC-10 of this card's
          reference_table, read-only, per its machine_check_format, before
          anything is staged. Any MISS is a STOP with nothing committed, and
          the rows return to the Coordinator.
      (2) git diff --cached --name-only is empty.
      (3) git fetch, then merge origin/main (merge, never rebase). Record the
          base commit checked and the outcome. Re-run (j) if the merge changes
          a (j)-named file. A conflict inside a record is a STOP.
      (4) Custody: the TASK-20261008-7457ec, -13dfad and -5ea531 receipts
          still verify. A mismatch is a STOP.
      (5) Check git status, then parse, validate, hygiene and size; stage;
          commit; verify; push; refresh the PR.
    - >-
      RUN ALONE. No other archival task is running in this worktree, and no
      agent is writing any artifact_path or under
      coordination/review/pfdr-0b3699-pdi-20261008/. TASK-20261008-5e4188 has
      not run. Zero runs.
    - >-
      GIT STATUS. git status --porcelain --untracked-files=all shows exactly
      two kinds of entry:
      - the two card paths this task stages;
      - untracked files at or under
        coordination/review/pfdr-0b3699-pdi-20261008/TASK-20261008-e2830e/,
        each at or under one of TASK-20261008-e2830e's four artifact_paths.
      The report entries are admitted by path only. They are listed in the
      receipt under report_paths_present_unsealed, with names only: no
      content, size or hash is needed here, because 5e4188 hashes them. They
      are never opened, staged or read for meaning. Anything else is a STOP.
    - >-
      FAIL-FAST AND RECEIPT IN THE SAME COMMIT. Every command block runs with
      set -euo pipefail, or with an explicit exit check after every command.
      The path list comes from this card's artifact_paths, never from git
      status. The receipt is written self-neutral, parsed and staged before
      the commit, and committed in the same commit. If any step after staging
      fails, nothing is committed. Check scripts write only to absolute
      scratch paths.
    - >-
      PARSE, VALIDATE, HYGIENE, SIZE.
      - Both YAML cards parse.
      - tools/validate_ledger.py reports no error naming an artifact_path.
        Record the count against origin/main's at the merged base, with the
        three DEF-1 known_defect_lines.
      - tools/check_merge_hygiene.py raises nothing naming an artifact_path.
      - Record each staged file's size.
    - >-
      STAGE ONLY the artifact_paths, one by one, with literal pathspecs; git
      add -A is forbidden. Never stage any file under coordination/review/, a
      package file, a hypothesis, or a shared tool file.
    - >-
      One commit, containing the two cards and the receipt. Its message names
      TASK-20261008-733066, TASK-20261008-5e4188, TASK-20261008-e2830e,
      DEC-20261008-8cb005, EXP-PFDR-0b3699 and H-PFDR-2765d2, and carries no
      verdict or number. A suitable message is "ledger(TASK-20261008-733066):
      archive sealing card TASK-20261008-5e4188 for TASK-20261008-e2830e
      (DEC-20261008-8cb005 PD-3; EXP-PFDR-0b3699; H-PFDR-2765d2)", followed by
      the session's attribution lines.
      Verify the receipt with tools/research_dispatch.py. Push, and refresh
      PR #2008 naming the ids. Never merge a red head.
    - Never select a provider, backend, endpoint or model identifier containing Bedrock.
  deliverables:
    - >-
      One ledger commit with exactly the artifact_paths. The receipt
      records:
      - kind ledger and binding content_at_commit;
      - record_ids;
      - check (j): script sha256, this card's sha256 as checked, per-row
        results, MISS count 0;
      - the merge outcome and the custody results;
      - report_paths_present_unsealed (names only);
      - path_sha256 per staged path;
      - the parse, validate, hygiene and size results;
      - scope_findings and the verifier result.
    - the pushed branch and the refreshed PR
  artifact_paths:
    - ledger/handoffs/TASK-20261008-5e4188.yaml
    - ledger/handoffs/TASK-20261008-733066.yaml
    - coordination/design/TASK-20260928-102217/archives/TASK-20261008-733066/ledger-receipt.json
  receipt_path: coordination/design/TASK-20260928-102217/archives/TASK-20261008-733066/ledger-receipt.json
  archived_by: TASK-20261008-733066
  archived_by_note: this archival task owns its own card and receipt, committed with the 5e4188 card in one commit
  archive:
