    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 3600
    wall_clock_note: watchdog for check (j) (10 rows), the merge, custody, validation, one commit, verification and push; expiry is a checkpoint, not a result
    memory_gb: 2
    maximum_runs: 0
  completion_gate:
    - check (j) ran over SC-01 to SC-10 with no MISS before anything was staged, and its output is in the receipt
    - the 7457ec, 13dfad and 5ea531 receipts still verify
    - git status showed only the two cards and the admitted report paths; no report file was opened, staged or read
    - the commit changes exactly the artifact_paths; tools/research_dispatch.py verifies the receipt on content
    - validate_ledger.py and check_merge_hygiene.py raise nothing naming an artifact_path
    - the branch is pushed and the PR names every record id
  return_format: the check (j) summary, the merge outcome, the custody results, the commit sha, the receipt path, the verifier verdict, the validate_ledger count against the base, the hygiene result, the PR number and any scope_findings
  review_plan: null
  dispatch_preconditions:
    - archived_by bound (self).
    - TASK-20261008-e2830e has returned, its session has ended and its claim is released (MSG-20261008-3baf6b at d92759a4d).
    - The TASK-20261008-7457ec receipt has verified and the branch is pushed.
    - No other archival task is running; TASK-20261008-5e4188 has not run.
  unblocks:
    - TASK-20261008-5e4188 (the sealing snapshot), which runs next, alone
  runs_launched: 0

