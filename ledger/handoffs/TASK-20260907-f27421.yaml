    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan_s2fl.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan_s2dx.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-5a5091/review_plan_s2oc.yaml
    claim_under_review: >-
      Expected producer statement for RUN-ECDLP-5cad48-S2OS
      under a later authorization of v1_stage2_offslice_audit,
      written before the run exists: S2OS status valid;
      certificate kind none; executable package
      stage2_offslice; consume-only of
      RUN-ECDLP-5cad48-S2OC; n_cells 4; gap is G_exact /
      M_eff minus max_pi_c; n_off_slice_positive,
      all_four_off_slice_positive, and
      miss_unique_off_slice_positive are present;
      SMALL_W_or_LARGE_W false; fit_of_a false;
      cs_bound_official_supported false;
      a98ea9_stage5_authorized false; off-slice uniqueness
      or sharing is recorded as isolation of a gap, not as
      a W class.
    coordinator_prior: >-
      Written before RUN-ECDLP-5cad48-S2OS exists. The
      Coordinator expects four archived occupancy cells
      and a defined off-slice gap on each. The Coordinator
      does not pre-record whether the miss is unique.
      Occupancy contrast remains not a W class.
      PD-S2OSR1: same session will produce the run and
      the reviews. independent_session is false.
    procedure_deviations:
    - id: PD-S2OSR1
      description: >-
        The Coordinator session that will produce
        RUN-ECDLP-5cad48-S2OS is writing this prior and
        will also execute the review attacks.
        independent_session is recorded false.
    - id: PD-S2OSR2
      description: >-
        Reviewers are forbidden to run git log / git show.
        A --blind-history FAIL or UNCHECKABLE is not a pass.
    joints:
    - joint: offslice_count_and_uniqueness
      assigned_to: TASK-20260907-f27421
      attack_plan: >-
        From S2OS raw-result.json, confirm n_cells is 4,
        gap is G_exact / M_eff minus max_pi_c, and
        n_off_slice_positive, all_four_off_slice_positive,
        and miss_unique_off_slice_positive are present.
        Confirm the producer does not classify W.
      breaking_artifact: >-
        wrong cell count, wrong gap definition, missing
        uniqueness fields, or a W-class reading
    - joint: observation_not_disposition
      assigned_to: TASK-20260907-f27421
      attack_plan: >-
        Proves-too-much. Holds only if SMALL_W_or_LARGE_W
        is false, fit_of_a is false, cs_bound_official_supported
        is false, the S2-P8219 miss is not read as a W
        class, and H-ECDLP-07c7c6 is not moved.
      breaking_artifact: any SMALL-W/LARGE-W reading, official bound claim, or fit of a
    blindness:
      mutual: true
      lifted_for: []
      rationale: null
    proves_too_much:
      objects:
      - >-
        An argument that a unique or shared off-slice gap
        classifies the S2-P8219 row as SMALL-W or LARGE-W.
        That conclusion is known false: a gap census is
        still an observation, not a W class.
      - >-
        An argument that an off-slice gap is an official
        cs_bound claim. That conclusion is known false:
        a derived gap is not an official supported bound.
      failure_signature: >-
        The argument must refuse to read an off-slice gap
        as a W class or as an official bound.
      assigned_to: TASK-20260907-f27421
    blind_rederivation:
      required: true
      quantity: >-
        Off-slice gap equal to G_exact / M_eff minus max_pi_c
        for two archived S2OC cells: S2-P8219 M=9 floor(Mx/p)
        and S2-P32779 M=13 floor(Mx/p).
      parameters: >-
        Read only archived S2OC fields G_exact, M_eff, and
        max_pi_c for those two cells. Must not read the S2OS
        producer or its raw result.
      blind_from:
      - experiments/EXP-ECDLP-5cad48/implementation/stage2_offslice.py
      - experiments/EXP-ECDLP-5cad48/runs/RUN-ECDLP-5cad48-S2OS/raw-result.json
      - experiments/EXP-ECDLP-5cad48/execution-report-s2os.yaml
      assigned_to: TASK-20260907-4f9915
