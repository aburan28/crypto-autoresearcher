  constraints:
    - id: RT-1
      text: >-
        READ ONLY THE COMMITTED PACKAGE at commit a32e70808, from the detached
        worktree the top-level session names, with PYTHONDONTWRITEBYTECODE=1
        and PYTHONPATH=<worktree>/src. First check that the worktree's HEAD is
        a32e70808 and that it is clean. Write nothing into the worktree.
    - id: RT-2
      text: >-
        BUILD, DO NOT ONLY ARGUE. J6 needs your own null generator, the
        family-wise and Stage R calibration tables (null and power), the seed,
        replicate and order sweeps, and the design-evaluated comparators. J7
        needs the alternative-convention kappa and z at every excursion cell
        and the excursion count, the cluster-pair and dispersion analyses and
        the exclusion tables. J8 needs the timeline and a function-by-function
        account of DEV-A. proves_too_much needs PTM-1 to PTM-3 computed.
        Every computation is declared command by command with its seed.
        Before any alternative is computed, write down which alternative you
        chose and why.
    - id: RT-3
      text: >-
        ONE OWNER PER JOINT. You own J6, J7, J8 and proves_too_much. You do
        not re-validate the package, re-derive the archived numbers blind or
        re-execute the pinned scripts (J1-J5 are the validator's). You may
        recompute any statistic from the archived rows as an input to your
        attacks. Offer no whole-claim verdict and no status recommendation
        for H-PFDR-4765e4 or H-PFDR-0cc7e8. Give the narrowest supported
        statement per joint. The Coordinator composes the round.
    - id: RT-4
      text: >-
        TW-FLOOR IS REPORTED ONLY AS FIRED. Read from the producer's outputs
        only whether TW-FLOOR fired. Do not open, print, quote, compute or
        interpret any A7 floor ratio, and do not attack A7. If your tooling
        loads analysis.json, strip the A7 block before anything is printed or
        written. Routing is the plan's tripwire_routing.
    - id: RT-5
      text: >-
        NO NEGATIVE EVIDENCE FROM INFRASTRUCTURE. A crash, timeout or
        numerical failure in your own simulation is reported as such, and
        never as a finding about the claim. A failed_infrastructure instance
        in the rows is never evidence about any base, class or m.
    - id: RT-6
      text: >-
        ZERO RUNS, ZERO SOLVER. Your computations are analysis of the committed
        rows and synthetic simulation. They get no RUN id. Import no solver
        module (load stats.py by file path, not through the package
        __init__). Do not execute analyze_census.py, merge_census.py,
        run_jobs.py or the census CLI (J4 is the validator's); you may read
        them and reimplement any statistic yourself. Write nothing outside
        your write scope.
    - id: RT-7
      text: >-
        MACHINE PROTECTION. One computation process at a time, nice 19,
        OMP_NUM_THREADS, OPENBLAS_NUM_THREADS and MKL_NUM_THREADS set to 1,
        resident memory under 1 GB. Stream the large harvest-rows files;
        never load one whole. Launch only if the launch facts show at least
        3 GB MemAvailable. Never read, signal or touch another session's
        processes or files. Files over 50 MB go to your own scratch directory
        scratchpad/rt-f29c96/ and are recorded by path and sha256 only.
    - id: RT-8
      text: >-
        CITE WITH PROVENANCE. A file you opened is internal. A source you
        recall but did not open is recalled, a pointer, never support. Query
        the knowledge index (search_knowledge) before calling any statistical
        fact known, and record whether the index answered.
    - id: RT-9
      text: >-
        DISCLOSED PRIOR. The Coordinator's prior was written after it read the
        structural parts of the producer's report, and it names what it
        expects from you. A prior the review overturns is among the most
        valuable results available. Attack the joints on their merits.
    - id: RT-10
      text: >-
        TW-SCOPE. No statement in your report may imply anything about a
        deployed curve, a universal impossibility or an exponent below
        rho's. Every statement is scoped to the tested arms, m = 3, 4, 5,
        12..32 bits, this engine and these curves.
    - Never select a provider, backend, endpoint or model identifier containing Bedrock.
