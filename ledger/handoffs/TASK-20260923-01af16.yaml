  objective: >-
    Try to break the interpretation of EXP-GFPN-726eb2 before the Coordinator
    spends a decision on it: attack the figure-provenance tags (J5) and the
    scope of what the audit licenses (J6) with the plan's worked attacks, and
    run the audit pipeline, unchanged, against the four objects of the
    proves-too-much control on which its conclusions are known false. Return
    a per-joint verdict and a per-object outcome.

  uncertainty_reduced: >-
    Whether the provenance tags say what the frozen texts support, whether
    "audit complete" is an honest description of what was and was not
    examined for an F_{p^5} curve, and whether the audit pipeline can emit a
    FAIL at all on objects where it must.

  joints_owned:
    - label: J5
      joint: >-
        J5. FIGURE-PROVENANCE TAGS: that each of the 11 tagged figures (4
        in runs/RUN-GFPN-b71f2f/figure-provenance.yaml, 7 in
        runs/RUN-GFPN-3bbef2/figure-provenance.yaml) carries the tag its
        frozen source text supports under the table's own vocabulary
        (computed: derived in the note from its own stated computation and
        recomputed here; inherited: taken over from another document
        without recomputation; asserted: stated from a model or argument
        without a certifiable computation), with citations that say what
        the table says they say -- in particular field_security_142 tagged
        asserted on EcGFp5 and inherited on EcMasFp5, and
        twist_security_101_93 tagged computed.
    - label: J6
      joint: >-
        J6. SCOPE AND INTERPRETATION: that the audit, as frozen and as run,
        licenses exactly "a certificate-bearing parameter audit of the two
        named curves plus an instrument control" and nothing about attack
        cost, the 128-bit claims, index calculus, oracle-assisted static
        DH or cover attacks; that no committed GFPN record reads it as more;
        and that "audit complete" is an honest description given which
        SafeCurves-style criteria were and were not examined.
  proves_too_much_owned: true
  proves_too_much_objects: >-
    OBJECT A (supersingular curve, CM by -7 after confirming (-7/p) = -1),
    OBJECT B (subfield curve y^2 = x^3 + 3x + 8 over F_p viewed over
    F_{p^5}), OBJECT C (EcMasFp5 with tampered self-reports: order n + 2,
    twist security 101.95, CM integer altered in its last digit), OBJECT D
    (shifted rigidity claims: EcMasFp5 as (A = 3, c = 8, i = 3); EcGFp5 as
    b = 263z^2). Full statement and failure signature in
    review_plan.proves_too_much of TASK-20260923-cc166b.
  joints_note: >-
    The joint statements above are verbatim from review_plan.joints of
    TASK-20260923-cc166b; their attack plans bind you as a floor, not a
    ceiling (agents/red-team.md). You do not own J1-J4. In particular, the
    question whether the design note's 2^20 / 142 model describes the raw or
    the symmetrized Gaudry system is joint K7 of TASK-20260923-fe27e4 and is
    owned by another reviewer; do not attack it.

