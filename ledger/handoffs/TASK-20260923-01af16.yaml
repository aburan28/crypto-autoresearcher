    - The proves-too-much control is reported per object A-D with the row values the pipeline emitted, the expected failure, whether it failed as it must, and the code location that decides each label.
    - Every `breaks` verdict carries the plan's breaking_artifact, produced or quoted with path and line.
    - Nothing was written outside the write scope and no record was changed.

  return_format: >-
