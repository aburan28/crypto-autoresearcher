handoff:
  id: TASK-20260923-01af16
  from: coordinator
  to: red-team
  role: red-team
  recorded_at: '2026-09-23'
  goal_id: GOAL-GFPN-380702
  question_id: RQ-GFPN-c01af8
  experiment_id: EXP-GFPN-726eb2
