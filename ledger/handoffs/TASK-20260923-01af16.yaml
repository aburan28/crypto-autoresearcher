  constraints:
    - id: RC-1
      text: >-
        BLINDNESS. Do not read anything under
        coordination/goals/GOAL-GFPN-380702/reviews/ except your own directory
        coordination/goals/GOAL-GFPN-380702/reviews/TASK-20260923-01af16/. If
        you encounter a sibling report, stop and declare it.
    - id: RC-2
      text: >-
        CHANGE NO RECORD. Write only inside your write_scope; do not write
        under experiments/; mint nothing. Proves-too-much invocations of the
        producer's pipeline run from a scratch copy or with output directed
        under your scratch/ directory, never through run_wrapper.py into
        experiments/EXP-GFPN-726eb2/runs/.
    - id: RC-3
      text: >-
        RUN THE ARGUMENT UNCHANGED. The proves-too-much control uses the
        producer's gfpn_audit.py as committed; a harness that feeds it a
        different curve or self-report is allowed, a modification of its
        decision logic is not. Report exactly where in the code each row's
        result label is decided.
    - id: RC-4
      text: >-
        INFRASTRUCTURE IS NOT EVIDENCE. A scratch computation that cannot be
        built or does not finish makes the object's outcome inconclusive with
        the impediment named.
    - id: RC-5
      text: >-
        PROVENANCE. Rely only on sources you read; anything remembered is
        marked recalled and carries no verdict. If you name SafeCurves
        criteria, cite where this program operationalises them (the SCURVE
        lane records) or mark the list recalled. Amazon Bedrock is
        prohibited.
    - id: RC-6
      text: >-
        DO NOT REJECT A RESULT FOR BEING NARROW OR CONDITIONAL, and do not
        call a bounded check an impossibility result (agents/red-team.md).
        Preserve the narrowest valid conclusion.

