handoff:
  id: TASK-20260913-0d9fe6
  from: coordinator
  to: idea-generator
  objective: >-
    Produce a complete, thorough literature digest of EXP-CRYPTO-6505c6's
    primary source (https://arxiv.org/html/2511.09459v1, Fouvry-Kowalski-
    Michel-Sawin, "Bilinear forms with trace functions"), covering
    everything a later executor task needs to actually fill in the 160-cell
    obligation matrix and 400-cell chart-coverage matrix in
    specification.yaml, without itself producing those frozen audit
    artifacts. This corrects TASK-20260913-4e7c6d, which mis-routed the
    artifact-production step to this same role: idea-generator has
    web_search but may_execute_experiments: false in orchestration/roles.yaml,
    so it may research and report but may not write the experiment's
    execution deliverable. This task is purely the research/reporting half;
    a follow-on executor task (in authority: may_execute_experiments: true,
    but no web_search) will formalize your digest into the frozen artifact
    schema.
  uncertainty_reduced: >-
    What the source paper actually says, in enough completeness and
    precision that someone who cannot fetch the paper themselves could
    correctly fill in every one of specification.yaml's 160 obligation
    cells and 400 chart-pair cells from your digest plus the specification
    text alone -- exact theorem statements and hypotheses, exact sheaf/
    family definitions, what is proved effectively vs. ineffectively, and
    what the paper explicitly does not cover.
  inputs:
    - >-
      experiments/EXP-CRYPTO-6505c6/specification.yaml (read this FIRST and
      in full -- it names exactly which objects, theorems, and hypotheses
      matter -- families K/L/C1/C2, the main_base/degeneration_strata
      exclusions, the addition_charts precedence order, and
      obligation_matrix's ten obligation columns O01-O10)
    - https://arxiv.org/html/2511.09459v1 (fetch and read directly; this is
      dense ell-adic-sheaf-theory content -- expect to need multiple
      WebFetch calls targeting different sections, since a single fetch
      compresses/summarizes and may miss detail a 160-cell matrix needs)
    - ledger/handoffs/TASK-20260913-4e7c6d.yaml (the prior, mis-routed
      handoff; its coordinator_correction_20260913 field carries forward
      the one finding already independently verified -- Theorem 2.4's
      moment bound is ineffective, per Remark 1.2 and the theorem's own
      "implicit constant depends only on d and c(M)" phrasing -- do not
      re-verify this from scratch, but do re-read Theorem 2.4 and Remark
      1.2 yourself as part of your fuller pass and flag if your own reading
      disagrees with that prior finding)
    - ledger/proposals/IDEA-20260905-3e4bf0.yaml
    - ledger/hypotheses/H-CRYPTO-fde1f1.yaml
    - coordination/design/BATCH-aa0d38/design-note.md
  constraints:
    - >-
      Write only to
      coordination/design/BATCH-aa0d38/audits/TASK-20260913-0d9fe6/source-digest.md
      (a plain research note, not a ledger record and not the frozen audit
      artifact format) plus, if useful, supporting files in that same
      directory. Do not write anything under experiments/EXP-CRYPTO-6505c6/;
      that is the follow-on executor task's job, done from your digest.
    - >-
      Cover, at minimum, for each of the four sheaf families the
      specification names (K, L, C1, C2): the paper's own exact definition
      if it defines an analogous object, or an explicit statement that the
      paper does not define this family (Kummer/Legendre are classical
      objects the paper may take as given background rather than defining
      itself -- say which is the case). For Theorem 2.4 specifically: quote
      its full exact statement, every numbered hypothesis it requires
      (mixed-of-integral-weights, the moment-bound assumption with its A/B/m
      parameters, any complexity bound), and every exclusion/degenerate case
      the paper states around it (the SO4/"gallant" exceptional case,
      finite-vs-infinite monodromy split, any stated range restrictions).
      State plainly, per case, whether each specification obligation column
      (O01 through O10) is something this specific paper speaks to at all,
      or whether it is genuinely outside what this source covers and would
      need a different source or an independent derivation.
    - >-
      Distinguish sharply, for every claim you report, between "the paper
      states this directly" (with a section/theorem number and a short
      verbatim quote) and "I am inferring/interpreting this." Do not
      present an inference as a direct quote or vice versa.
    - >-
      This is research and reporting only: no numerical run, no code
      execution, no invented citation or theorem content, no ledger status
      change, no claim that this digest itself constitutes or completes the
      audit. Say plainly in the digest what you did NOT have time/budget to
      cover, so the follow-on executor task knows exactly what gap remains.
    - Never select a provider, backend, endpoint, or model identifier containing Bedrock, case-insensitively.
  deliverables:
    - coordination/design/BATCH-aa0d38/audits/TASK-20260913-0d9fe6/source-digest.md
  artifact_paths:
    - coordination/design/BATCH-aa0d38/audits/TASK-20260913-0d9fe6/
  archived_by: null
  inference:
    policy: research-deep
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: null
    memory_gb: 4
    maximum_runs: 0
  completion_gate:
    - Every one of the four families (K, L, C1, C2) is addressed -- paper definition quoted, or explicitly stated as not defined by this paper.
    - Theorem 2.4's full statement, all hypotheses, and all stated exclusions are quoted with section/theorem numbers, not paraphrased from memory.
    - Every obligation column O01-O10 gets an explicit in-scope/out-of-scope-of-this-source call.
    - Direct quotes and your own inferences are typographically/structurally distinguishable throughout.
    - The digest explicitly states what it did not cover, so the follow-on executor task has an honest gap list rather than a false impression of completeness.
  review_plan: null
