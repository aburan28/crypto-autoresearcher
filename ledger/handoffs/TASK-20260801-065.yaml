handoff:
  id: TASK-20260801-065
  from: coordinator
  to: validator
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-026
  experiment_id: EXP-LPF-001
  hypothesis_id: H-LPF-001
  run_id: RUN-LPF-001-plantz
  objective: >-
    Verify that the plant-Z arrays are real, reproducible, produced by an apparatus blind
    to the real object, and sufficient to support the RTB-054-2 restatement - BEFORE any
    sentence of RR-LPF-2 is written against them. THE PRIORITY DUTY IS TO REGENERATE THE
    ARRAYS YOURSELF, from the recorded seeds, with your own code, and compare at tolerance
    zero.
  uncertainty_reduced: >-
    Whether the numbers that will replace a falsified impossibility claim are themselves
    checkable against an archive, or whether the repair reproduces the defect it repairs.
  inputs:
  - experiments/EXP-LPF-001/implementation/plant_z_regen.py
  - experiments/EXP-LPF-001/implementation/lpf001_driver.py
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-plantz/
  - experiments/EXP-LPF-001/results/plantz/plant_z_tail_report.json
  - experiments/EXP-LPF-001/results/calib/
  - experiments/EXP-LPF-001/specification.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-026/archives/TASK-20260801-064/snapshot_commit_receipt.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-026/tasks/TASK-20260801-063/execution_report.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/reviews/TASK-20260801-054/attainability_check.md
  constraints:
  - 'INDEPENDENT SESSION. You did not author or execute any artifact under review.'
  - >-
    RECOMPUTE AND EXECUTE, DO NOT READ. Re-implement the stream and seed derivation from
    the manifest description rather than importing the executor's script, regenerate the
    planted values at a minimum of the top rung of both ladders at both cells, and compare
    every archived summary statistic and every archived top-K value at TOLERANCE ZERO.
  - >-
    PRIORITY DUTY 1 - THE ANCHOR. Confirm independently that the archived null values
    reproduce bit-for-bit on replicate 0 at both cells. An anchor that does not reproduce
    makes every downstream number unverifiable and is a BLOCKING defect.
  - >-
    PRIORITY DUTY 2 - THE EXCEEDANCE COUNTS. Recompute, per (cell, rung, replicate), the
    count of planted values whose Z exceeds THAT REPLICATE'S OWN null tenth-largest Z, and
    report your counts beside the archived ones. THIS IS THE QUANTITY THE WHOLE RESTATEMENT
    RESTS ON. Report explicitly whether any plant at any rung exceeds, and where.
  - >-
    PRIORITY DUTY 3 - THE DIRECT CONSEQUENCE. Independently confirm or refute, by executing
    the driver's own all_statistics, the reviewer's finding that at bits 20 gamma 0.05
    replicate 0 the planted arm returns T_deep 5.824044507159416 against the null's
    5.762382565494627 - i.e. that a plant MOVED T_DEEP UP. State which you found.
  - >-
    CONFIRM STRUCTURAL BLINDNESS AT THE LEVEL OF OBJECTS AND NOT LABELS. Take the
    transitive call-graph closure of the auxiliary script and confirm that
    deterministic_factor_base, int1_fibre_invariants, run_measurement and
    _independent_pmax_recheck are unreachable, and confirm the tripwire is recorded false.
  - >-
    CONFIRM AGAINST GIT that lpf001_driver.py, specification.yaml and reading_rule.yaml are
    unmodified and that their sha256 values match
    786aeb0550d75fa3d0785aefbe50b121a24cacae584a4cadd79902c464722d65,
    0d6c946fb84073feae47865da9b787b7d7ba459617834644680a06bf886d1cda and
    8bcb196fa620503c736da307281325d17bb3dc8b0299407b24b584067c979f1d respectively. ANY
    MODIFICATION IS A BLOCKING DEFECT AND AN EVIDENCE-INTEGRITY FAILURE.
  - >-
    RULE ON SUFFICIENCY EXPLICITLY - state whether the archived arrays are sufficient for a
    future reader to recompute the eviction-to-insertion ratio, the maximum planted Z and
    the per-replicate exceedance rate WITHOUT re-running anything. An insufficiency is a
    concrete defect and must be listed as one, because sufficiency is the entire purpose of
    this package.
  - Run tools/validate_ledger.py check_run on the manifest and report the error list verbatim.
  - >-
    RETURN ADMISSIBLE or NOT ADMISSIBLE with a concrete defect list. You do not set status,
    you do not adjudicate D1 or V8 and you do not interpret the numbers.
  - 'MAKE NO COMMIT; TASK-20260801-074 archives this report. Its sha256 is bound at TASK-20260801-067.'
  - >-
    Record inference honestly (requested review-adversarial, independent session, and state
    that independence is procedural and not model-level).
  deliverables:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-026/reviews/TASK-20260801-065/plant_z_validation_report.yaml
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-026/reviews/TASK-20260801-065/plant_z_validation_report.yaml
  archived_by: TASK-20260801-074
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 5400
    memory_gb: 8
    maximum_runs: 1
  completion_gate:
  - >-
    ADMISSIBLE or NOT ADMISSIBLE with a concrete defect list; the anchor independently
    reproduced bit-for-bit or reported as failing; the per-replicate exceedance counts
    independently recomputed and reported beside the archived ones; the T_deep
    upward-movement finding independently confirmed or refuted with the value stated;
    structural blindness confirmed at object level by call-graph closure; the driver,
    specification and reading rule confirmed unmodified against Git with their sha256
    values quoted; an explicit sufficiency ruling on whether the arrays let a future reader
    recompute the ratio without re-running; check_run output reported verbatim; no
    adjudication of D1 or V8; no commit made.
