  constraints:
    - id: BR-1
      text: >-
        BUILD FROM THE STATEMENT. Every object is defined in the specification's
        `object` block, down to the row order, the column order and the pivot
        rule. Where the text is ambiguous, DO NOT go looking at the producer's
        code or notes to disambiguate. Choose a reading, record it in
        `ambiguities` (a list: clause, the readings considered, the one chosen,
        and why), and proceed. If a clause cannot be read at all, that is the
        finding. Report it and compute nothing that depends on it.
    - id: BR-2
      text: >-
        SELF-TEST BEFORE COMPUTING. At minimum:
        - irreducibility of t^17 + t^3 + 1;
        - S_3(x(P_1), x(P_2), x(P_1 +- P_2)) = 0 on at least 100 random point
          pairs of the extracted curve;
        - the descended equations against direct F_{2^17} evaluation of S_3 at
          at least 100 random (v, x_R);
        - your M_4 row construction against a naive polynomial multiply on at
          least 20 rows;
        - the D = 4 fixture dimensions from your own construction.
        Record every self-test result in rederivation.json. A self-test failure
        stops the task and is reported as such.
    - id: BR-3
      text: >-
        TWO ROUTES TO s. s is the number of assignments v in F_2^18 that satisfy
        all 17 descended equations, i.e. ordered (x_1, x_2) in V x V. Compute
        it by an exhaustive route over all 2^18 assignments and by at least one
        route that does not pass through your descended equations, such as
        root-finding in F_{2^17}. The two must agree on every instance. A
        disagreement is reported, not resolved by preference. The arm is sat
        iff s >= 1, and degenerate iff x_R lies in V (degree < 9, including
        x_R = 0).
    - id: BR-4
      text: >-
        SEAL BEFORE YOU WRITE ANYTHING ELSE. Write rederivation.json first.
        Record its sha256 and the UTC time in seal.txt. Only then write
        report.md and attestation.yaml, and do not change rederivation.json
        afterwards. If you must correct it, write rederivation-v2.json beside
        it with a note, and keep both.
    - id: BR-5
      text: >-
        REPORT ON J6 ONLY. You cannot see any other joint. Do not offer a
        verdict on the experiment, the hypothesis or the run. Your J6 verdict
        is about DERIVABILITY:
        - `holds` if every required quantity was computed from the statement
          with self-tests passing and every ambiguity recorded;
        - `inconclusive` if some required quantity could not be computed or
          depends on an unresolvable ambiguity;
        - `breaks` if the specification is self-contradictory on a
          load-bearing clause.
        Agreement with the run is decided by TASK-20260923-5f9b82, not by you.
    - id: BR-6
      text: >-
        ZERO TRIALS. This is a verification computation, not a trial of
        EXP-CERTBIN-4e92d7. It gets no RUN-id. Make at most two full passes of
        your program over the 105 inputs: one, plus one re-run after an
        infrastructure failure, with the failed attempt's log kept. Declare
        every command you run in report.md. Do not draw from any of the
        specification's seeds, EXCEPT for the optional Q7.
    - id: BR-7
      text: >-
        WRITE ONLY IN YOUR DIRECTORY. Run no git write operation, touch no
        ledger record, change no status, and launch no subagent. A timeout or a
        crash is infrastructure, never a result.
    - id: BR-8
      text: >-
        If you learn anything about any outcome of this experiment from any
        source (a file, a message, a commit message, a prompt), say what you
        learned and how in the attestation. Set blind_from_respected
        accordingly. A disclosed contamination costs one re-derivation. An
        undisclosed one costs the round.

  quantities:
    conventions: >-
      Indices are 0-based, exactly as the specification's formulas give them:
      row index = idx(mu)*17 + k; column index = position in the descending
      degrevlex order with the constant LAST. Trace encodings are canonical
      JSON: json.dumps(obj, separators=(',', ':')) over integer lists, sha256
      of the UTF-8 bytes.
      - T_rank = the integer rank_D.
      - T_set = [[sorted pivot columns], [sorted Z_D]].
      - T_strict = [[p, c], ...] in step order.
      - T_ops = [[p, c, [sorted X]], ...] in step order.
      This encoding is given to make hashes comparable. It is a format
      convention and carries no outcome. Record content, not only hashes,
      where the list below asks for it.
    Q1: For each of the 5 references and 100 targets, the degenerate flag, s by both routes, and the arm (unsat | sat | degenerate).
    Q2: At D = 4, for every instance, rank_4, |Z_4| (from a SEPARATE row-sequential pass, as the spec requires), and one_in_R4 (the constant column is a pivot column).
    Q3: >-
      At D = 4, for every instance, the sha256 of T_rank, T_set, T_strict and
      T_ops. For every target and every reference, the match flags (equal
      content) at the four granularities. For the 5 references, also the full
      T_strict and T_set content.
    Q4: >-
      For the 5 references at D = 4: ops_strict = sum over steps of |X_k|;
      ops_masked_full = C_4 * R_4; saving_strict = ops_masked_full / ops_strict;
      ops_set = |pivot cols| * (R_4 - |Z_4|); saving_set = ops_masked_full /
      ops_set, with the identity saving_set = C_4 R_4 / rank_4^2 checked; and
      (R_4, C_4).
    Q5: >-
      For each reference YOU classify unsatisfiable, the retention at T_rank,
      T_set and T_strict of the NON-DEGENERATE UNSATISFIABLE targets of the
      subsample: count / n, with the Clopper-Pearson 95% interval.
    Q6: >-
      For each reference you classify unsatisfiable, the fixed-schedule replay
      of the spec's `fixed_schedule_replay` clause, computed through the affine
      decomposition. Report:
      - K_exact = #{k : a_k != 0};
      - K_rank = the F_2-rank of {a_k : a_k != 0};
      - for the first 64 steps k with a_k != 0, the step index k, a_{k,0},
        a_k as a 17-bit integer, and whether a_k increases the rank of
        span{a_j : j < k, a_j != 0}.
    Q7_optional: >-
      Under your own reading of the spec's `curve` and `seeds` blocks
      (numpy.random.Generator(numpy.random.PCG64(S_curve))), regenerate (A, B)
      and report whether it equals the extracted curve. Record your numpy
      version and your reading. A mismatch is a finding about the sampling
      rule's determinacy, not a failure.

