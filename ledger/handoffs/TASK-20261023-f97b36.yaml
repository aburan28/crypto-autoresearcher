  deliverables:
    - 'harness/czlift_cubic.py: enumerates the box |coords(alpha)| <= hmax, d <= dmax exactly, with no primitivity skip. It deduplicates by the exact x-value in K, in a canonical reduced form, and records for each point its minimal coordinate height and minimal d. The H ladder is a separate, explicit argument, so that dmax is reachable. It records the count of points at d = dmax.'
    - 'harness/czlift_cubic_check.py: an independent enumerator (two exact square tests that agree) and a seeded same-shape uniform coverage null (per cell: n_points uniform draws from N_p, declared reps and seed; it returns the band of medians and exact two-sided per-cell tails).'
    - 'tests/test_czlift_cubic.py: (a) 37a1 recovers x = -theta/2, theta^2 - theta/2 and -(theta + theta^2)/3, and the d = 5 points listed in VAL-20261022-833f7f; (b) both enumerators reproduce the specification-box counts of j2_recompute_output.json and the sealed blind 11a1 / 37a1 counts on both boxes; (c) the fixed and independent enumerators agree point for point on all six curves at a small box; (d) 11a1 stays at its torsion count (5) on both boxes; (e) the null sampler''s self-test: an injective set''s ratio equals the analytic ceiling n / (N_p (1 - (1 - 1/N_p)^n)), and a planted heavy-collision set falls below the null band; (f) the statistical median of an even-length list is the mean of the two middle values.'
    - 'experiments/EXP-CZLIFT-8c50ea/reports/return-DEC-20261023-fdc4af/defect_response.yaml: one row per defect D1-D8 with classification, the repair or the amendment item that answers it, test names and results, and the old and new sha256 of every file written.'
    - 'experiments/EXP-CZLIFT-8c50ea/reports/return-DEC-20261023-fdc4af/amendment_request.yaml: proposed superseding-contract text for every item in DEC-20261023-fdc4af superseding_contract_must. It covers the exact box and H-ladder definitions; an independent replication instance (disjoint split primes, a box not contained in the main box, and a non-zero count of points outside the main box); metric definitions (statistical median, gain over N_Q >= 10); the declared cell filter, reduction-root rule, split-prime rule and slope fit; replacement of the unreachable coverage bounds with the pre-registered uniform and kernel-floor null comparisons, with a stated expectation as p grows and a proof that each new bound is reachable; the 37a1 ramified-denominator positive control; independent-checker requirements with an equality re-run test; and a rewritten on_negative. Each item is marked proposed.'
    - 'experiments/EXP-CZLIFT-8c50ea/reports/return-DEC-20261023-fdc4af/test_output.log: the exact pytest command, its stdout and its return code.'
