handoff:
  id: TASK-20260724-246
  from: coordinator
  to: validator
  objective: >-
    Independently verify the integrity of the EXP-FB3-001 run package: artifact
    completeness, protocol conformance to the frozen specification and amendment
    EXP-FB3-001-AMD-001, control results, exact-count self-consistency, port
    fidelity against the recorded H016 and H017 statistics, and budget
    compliance. Re-derive at least one cell independently.
  uncertainty_reduced: >-
    Whether the EXP-FB3-001 run package is valid evidence under its frozen
    protocol, or whether any cell is an implementation artifact.
  inputs:
    - experiments/EXP-FB3-001 (verified snapshot)
    - experiments/EXP-FB3-001/specification.yaml
    - experiments/EXP-FB3-001/amendment-001.yaml
    - inputs/h100_session/h016_base_yield.json
    - coordination/goals/GOAL-ICLIFT-001/batches/BATCH-001/archives/TASK-20260724-230/snapshot-receipt.json
  constraints:
    - Verify receipts and integrity; do not reinterpret the research question.
    - Distinguish infrastructure failures from mathematical outcomes.
    - Change no official state and write only inside the assigned task directory.
    - >-
      Recompute at least one cell with an INDEPENDENT method (for example direct
      triple enumeration instead of convolution) and report exact agreement or
      disagreement.
  deliverables:
    - validation_report.yaml with an explicit pass, fail, or invalid verdict per required artifact and control
    - validation_notes.md
  artifact_paths:
    - coordination/goals/GOAL-ICLIFT-001/batches/BATCH-001/tasks/TASK-20260724-232/validation_report.yaml
    - coordination/goals/GOAL-ICLIFT-001/batches/BATCH-001/tasks/TASK-20260724-232/validation_notes.md
  archived_by: TASK-20260724-236
  inference:
    policy: review-xhigh
    fallback_allowed: true
    independent_session_required: true
  budget:
    wall_clock_seconds: 3600
    memory_gb: 4
    maximum_runs: 3
  completion_gate:
    - Every required artifact and control has an explicit verdict.
    - At least one independent recomputation is reported with its exact outcome.
    - Any protocol deviation from the frozen specification or amendment is named.
  return_format: validation_report
