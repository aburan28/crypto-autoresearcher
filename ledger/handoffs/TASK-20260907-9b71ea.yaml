      and also reads the goal head. If a concurrent change conflicts inside the goal
      record, the resolution is a SUPERSEDING RECORD UNDER A NEW ID -- never an edit that
      picks a side, and never a repair in place.
    - >-
      Overwrite no approved, frozen or historical record. Repair neither of the two
      defects DEC-20260905-6e8621 named for supersession; carry them forward by reference.
    - Stage exactly the declared paths. Merge origin/main first, never rebase; record the base commit and merge outcome.
