handoff:
  id: TASK-20260801-029
  from: coordinator
  to: validator
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-023
  objective: >-
    Validate the integrity of the RUN-EQD-001-real package on the TASK-20260801-028 snapshot,
    against the calibration package at the TASK-20260801-022 snapshot and the reading rule at
    the TASK-20260801-024 snapshot. Return ADMISSIBLE or INADMISSIBLE with concrete defects,
    and answer every N-0 and N-5 guard condition explicitly.
  uncertainty_reduced: >-
    Whether the real-arm package is admissible as empirical_only toy-tier evidence, and in
    particular whether any pre-registered guard fired.
  inputs:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/archives/TASK-20260801-028/snapshot_commit_receipt.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/archives/TASK-20260801-024/snapshot_commit_receipt.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/archives/TASK-20260801-022/snapshot_commit_receipt.json
  - experiments/EXP-EQD-001/specification.yaml
  - experiments/EXP-EQD-001/reading_rule.yaml
  - ledger/hypotheses/H-EQD-001.yaml
  constraints:
  - INDEPENDENT SESSION. Read only the named snapshot commits.
  - >-
    REGENERATE, DO NOT ACCEPT. Rebuild both curve instances from master seed 2301, rebuild
    both frozen deterministic 512-element factor bases, and confirm factor_base_sha256 at
    each bit size.
  - >-
    Recompute INT-2 yourself on a sample of half-tuples FROM THE SPECIFICATION AND THE
    MANIFEST ALONE - c_2 = (x_i - x_j)**2, c_1 = -2 * ((x_i + x_j) * (x_i * x_j + a) + 2 * b),
    c_0 = (x_i * x_j - a)**2 - 4 * b * (x_i + x_j), e_1 = (-c_1) * c_2**(-1) mod p,
    e_2 = c_0 * c_2**(-1) mod p - and confirm the recorded pairs. If the frozen map is not
    reproducible from the manifest alone, that fires N-0.
  - >-
    Confirm each real arm is EXHAUSTIVE over the C(512, 2) = 130816 unordered half-tuples with
    i < j, with no duplicate, no omission and no diagonal entry.
  - >-
    CHECK CTRL-EQD-DRIVER-HASH YOURSELF - the driver sha256 in the real manifest must equal
    the DRIVER_SHA256 bound by the TASK-20260801-022 calibration snapshot receipt. A
    difference fires N-0 and invalidates the real run outright. This is ATS-1 clause 5 made
    checkable and it is your duty, not the reviewer's.
  - >-
    CONFIRM STRUCTURALLY, FROM THE ARCHIVED CALIBRATION PACKAGE ITSELF, that the calibration
    run enumerated NO half-tuple of the deterministic factor base, contains NO OBJ-REAL
    sample and NO deterministic factor-base x-list, and that the real-arm entry point was not
    invoked there. Do not take the contract's sentence for it.
  - >-
    TRACE EVERY THRESHOLD IN THE READING RULE to a named order statistic of a named CAL-1
    output and RECOMPUTE IT from the archived replicate values. A threshold you cannot trace
    fires N-0.
  - Recompute every reported statistic - STAT-CHI-16, STAT-CHI-64, STAT-KS1-E1, STAT-KS1-E2 and STAT-DUP - from the raw record, including the empty-cell omission count and the degrees of freedom.
  - Confirm every recorded e_1 and e_2 lies in [0, p), that every arm has exactly 130816 pairs, and that the real-arm admissible-support fraction is exactly 1.0.
  - Confirm CTRL-EQD-S3 reports 1000 of 1000 at both cells and that its verification used a code path that does not reuse the coefficient formula.
  - >-
    Confirm the null pipeline differs from the real pipeline ONLY in the source of the 512
    points, by direct source reading, and report any other difference as a defect. Confirm
    the real-arm null stream is 2301 + 50000 + bits and is disjoint from every calibration
    stream.
  - >-
    Report explicitly whether ANY N-0 or N-5 condition fired - a sample set with other than
    130816 pairs, any c_2 = 0 draw, a real-arm support fraction other than 1.0, a driver hash
    mismatch, CTRL-EQD-S3 below 1000 of 1000, an untraceable threshold, an irreproducible
    INT-2, any timeout, crash, resource exhaustion or budget cancellation, PC-1 failing to
    reject, DV-7 rejecting, or in-run null-vs-null statistics outside the archived CAL-1
    distribution beyond the declared margin.
  - Confirm the package contains NO factorization, NO smoothness statistic, NO search arm, NO timing decision variable, NO cost identity and NO R.
  - Confirm manifest.yaml is present with its required fields and that command.txt, environment.json, stdout.log, stderr.log and raw-result.json exist beside it.
  - >-
    Do NOT interpret H-EQD-001 or HEUR-DS-1, do NOT classify the result against RR-EQD-1, and
    do NOT state a disposition.
  - Treat no calibration number as evidence about any hypothesis; the calibration run is expressly non-evidential.
  - Timeouts and crashes are infrastructure, never mathematical negatives.
  - MAKE NO COMMIT. Do not alter any ledger record.
  deliverables:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/reviews/TASK-20260801-029/validation_report.yaml
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/reviews/TASK-20260801-029/validation_report.yaml
  archived_by: TASK-20260801-031
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 5400
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
  - >-
    ADMISSIBLE or INADMISSIBLE recorded with concrete defects if any, plus an explicit
    statement on every N-0 and N-5 guard condition, an independent recomputation of every
    load-bearing statistic and of every reading-rule threshold from the archived CAL-1
    values, an independent CTRL-EQD-DRIVER-HASH check, and a structural confirmation that
    the calibration package contains no real-arm data.
