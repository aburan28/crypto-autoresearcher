handoff:
  id: TASK-20260824-261bb4
  from: coordinator
  to: executor
  goal_id: GOAL-ECQ-2298dc
  question_id: RQ-ECQ-e9b361
  experiment_id: EXP-ECQ-f5af06
  hypothesis_id: null
  hypothesis_id_note: >-
    No hypothesis of this program's own is under test; see EXP-ECQ-f5af06 hypothesis_id_note. This
    task certifies an external claim, tries to falsify that same external claim, and triages the
    object's neighbours.
  batch_id: null

  record_status: >-
    THIS IS THE FIRST AND ONLY RECORD EVER WRITTEN AT THIS IDENTIFIER. It is authored on 2026-08-24
    BEFORE ANY RUN OF TASK-20260824-261bb4 EXISTS. The task was once dispatched under this id with
    no envelope; the executor refused it and started nothing, so no artifact, no run and no receipt
    was produced under it and nothing is being retro-fitted here. See `procedure_deviation` below.

  objective: >-
    EXECUTE THE THREE-PART PROTOCOL FROZEN AT experiments/EXP-ECQ-f5af06/specification.yaml, WHICH
    BINDS IN PREFERENCE TO THIS PARAPHRASE. (A) INDEPENDENTLY CERTIFY rank(ICARM no. 302) >= 31 in
    exact arithmetic from its 31 published witness points -- a BASELINE CAPABILITY CHECK, because a
    program that cannot certify 31 cannot certify 32. (B) SEARCH FOR A 32ND INDEPENDENT POINT on
    no. 302 inside the search box frozen in the contract -- a cheap FALSIFICATION TEST of the
    board's own "BSD + GRH certified to rank 31" claim, whose expected result is a null and whose
    prior is recorded in the contract before the run. (C) TRIAGE THE QUADRATIC TWISTS AND NEAR
    NEIGHBOURS of no. 302 over a frozen discriminant range with a frozen selection rule, then apply
    an EXACT height and independence gate to the frozen number of survivors, against a matched null
    arm. REPORT EVERY COVERAGE FIGURE AS NUMERATOR OVER DENOMINATOR with the denominator computed
    and recorded BEFORE any candidate is tested or scored.

  binding_text: >-
    experiments/EXP-ECQ-f5af06/specification.yaml IS THE BINDING PROTOCOL. Where this handoff and
    that contract differ, THE CONTRACT GOVERNS and the difference is a defect to report. Read it
    directly rather than working from this envelope.

  uncertainty_reduced: >-
    Three things at once, in order of decision value. FIRST, whether this program's exact
    independence certifier works at record scale -- 31 points on a curve of naive height 468 -- which
    gates every future claim of rank >= 32 and fires GOAL-ECQ-2298dc pause condition P4 if it does
    not. SECOND, whether the board's implicit rank-exactly-31 claim for no. 302 survives a cheap
    frozen-box falsification attempt. THIRD, whether the twist neighbourhood of the record curve
    carries any certifiable rank at all relative to a matched null, which is the cheapest available
    read on whether that neighbourhood is worth any further budget.

  inputs:
  - experiments/EXP-ECQ-f5af06/specification.yaml
  - coordination/goals/GOAL-ECQ-2298dc/inputs/ICARM-302.json
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-8b08ef/tasks/TASK-20260823-827765/scripts/exact_certify.py
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-f2341e/tasks/TASK-20260823-01d3d9/pipeline/exact_certify.py
  - coordination/goals/GOAL-ECQ-002/baseline/icarm_database_20260823.json
  - coordination/goals/GOAL-ECQ-002/baseline/frontier_20260823.json
  - ledger/goals/GOAL-ECQ-2298dc/goal.yaml
  - ledger/questions/RQ-ECQ-e9b361.yaml
  - ledger/ideas/IDEA-20260824-155411.yaml
  - experiments/EXP-ECQ-0e0cbb/specification.yaml

  constraints:
  - >-
    WRITE RUN RECORDS DIRECTLY TO experiments/EXP-ECQ-f5af06/runs/RUN-<id>/, with run.experiment_id
    set to EXP-ECQ-f5af06 from the start, and manifests carrying the VALIDATOR'S schema -- code
    (commit and command), environment, timing, result, inputs, plus id, experiment_id and status --
    not only producer-local field names. Each manifest sits beside command.txt, environment.json,
    stdout.log, stderr.log and raw-result.json in the same run directory. DO NOT write runs under
    the task tree. tools/validate_ledger.py indexes runs ONLY at
    experiments/*/runs/*/manifest.yaml, so runs written elsewhere make every evidence record citing
    them unresolvable; that has cost this program FOUR post-hoc repair ports, a note in a record
    failed to prevent it three times, and the mechanical fix worked last batch. Your write_scope
    already includes experiments/EXP-ECQ-f5af06 for exactly this purpose, and it permits writing
    under runs/ ONLY -- specification.yaml is FROZEN and must not be modified.
  - >-
    NO FLOATING POINT IN ANY DECISION. Not in the torsion bound, the point counts, the mod-l linear
    algebra, the squareness test, a minimality decision or a classification. Floating point is
    permitted ONLY for reported logarithms of exact integers and for the part-C Mestre-Nagao triage
    score, neither of which decides a certification, and the report must state where it appears and
    why it decides nothing.
  - >-
    THE FROZEN NUMBERS ARE FROZEN AND ARE NOT YOURS TO CHOOSE. Part B box: x = u / w^2 in lowest
    terms, w in [1, 30], |u| <= 1000000 for w = 1 and |u| <= 10000 for 2 <= w <= 30. Part C twist
    range: squarefree D with 2 <= |D| <= 200 plus D = -1. Part C null arm: a6 -> a6 + v for v in
    {-100..-1, 1..100}. Part C triage: S = sum over p <= 500 of (a_p log p)/p, SAME implementation
    and conventions in both arms, and the exact gate applied to EXACTLY the top 20 by S in each arm,
    ties broken by smallest |D| (respectively |v|) then positive before negative. Part C reduced
    box: w in [1, 10], |u| <= 100000 for w = 1 and |u| <= 2000 for 2 <= w <= 10. COMPUTE AND RECORD
    EVERY DENOMINATOR BEFORE TESTING OR SCORING ANYTHING. If the budget forces fewer candidates,
    that is a COVERAGE SHORTFALL REPORTED AS A FRACTION, NEVER A REDEFINITION OF A DENOMINATOR.
    Changing any of these after a score or survivor is known requires a versioned protocol_amendment
    record and must be reported as one.
  - >-
    A PARTIAL PART-A CERTIFICATION IS A REPORTABLE RESULT, NOT A FAILURE. Report the largest
    independent subset certified as k of 31 with the point indices, the search bounds reached and
    the wall clock. Carry the certifier's own inconclusiveness wording verbatim: the uncertified
    remainder "may be dependent, or the search bound may be too small -- this is not evidence of low
    rank". k < 31 may NOT be reported as a defect in the board's claim or as evidence about the
    curve; it is a measurement of THIS INSTRUMENT at THIS budget.
  - >-
    YOU MAY RAISE THE CERTIFIER'S SEARCH BOUNDS (max_prime, max_good_primes, torsion_primes, the l
    candidates) AND SHOULD EXPECT TO NEED TO: reaching F_l-rank 31 needs at least 16 usable primes,
    and the witness points' denominators exclude several small primes outright. These are SEARCH
    BOUNDS, not claims. Record the exact values used. If you extend the certifier, do it in a NEW
    file that imports it, so the reused instrument stays byte-identical.
  - >-
    CITE THE MEMBERSHIP VERIFICATION, DO NOT RECOMMISSION IT. The orchestrating session already
    verified in exact rational arithmetic that all 31 points satisfy the Weierstrass equation, and
    recomputed log max(|c4|^3, c6^2) = 468.2771 and log|disc| = 453.0469. That computation carries no
    committed run record and is cited with that limitation. The certifier re-checks on-curve
    membership as step (0) of its own algorithm and cannot be asked not to, so COMPARE rather than
    assume: on_curve_failures must be EMPTY and the recomputed height and log|disc| must reproduce
    those two figures to 4 decimal places. A MISMATCH IS A BLOCKING DEFECT -- stop, report both
    values, and interpret nothing further.
  - >-
    RANK IS NOT TWIST-INVARIANT. The 31 points do not transfer to E^(D). Any artifact that treats a
    twist as inheriting rank invalidates its own conclusion.
  - >-
    THE NUMBER-FIELD TRAP. rank E(Q) + rank E^(D)(Q) = rank E(Q(sqrt D)), so any positive-rank twist
    gives rank >= 32 over the QUADRATIC FIELD Q(sqrt D). THAT IS NOT THIS GOAL'S OBJECTIVE. A
    previous campaign's rank->=31 result over multiquadratic fields was rejected for exactly this
    reason. Report a positive twist as a rank over Q of E^(D) -- a small number -- and never as
    meeting or approaching the objective.
  - >-
    CLASSIFY EVERY PART-B HIT BEFORE REPORTING IT. A point Q with m*Q in the subgroup generated by
    the 31 known points REDUCES THE INDEX and DOES NOT RAISE THE RANK. Pass every hit to the exact
    certifier as a 32-point set and report it as rank-increasing ONLY if the certifier returns 32.
  - >-
    RUN ALL SIX CONTROLS AND REPORT EACH OUTCOME: CTL-CITED-INPUT-AGREEMENT, CTL-POSITIVE-
    INDEPENDENCE, CTL-NEGATIVE-INDEPENDENCE-PROVES-TOO-MUCH, CTL-SATURATION-DISTINCTION,
    CTL-MATCHED-NULL, CTL-PROVENANCE. The proves-too-much and saturation controls are MANDATORY
    whatever the budget does: they are what stands between a 32-point claim and a false world
    record.
  - >-
    TRIAGE THE TWO PART-C ARMS IN LOCKSTEP, alternating candidates, so a truncated run still yields a
    matched comparison rather than a complete twist arm and an empty null. Report
    generated-against-scored-against-gated counts per arm; differential attrition across arms voids
    the comparison whatever it shows.
  - >-
    PERSIST EVERY ATTEMPTED CANDIDATE with an identifier, a status and a reason. Never let a dropped
    row fall into an arithmetic difference between attempted and reported: 462 families vanished
    that way in BATCH-541940.
  - >-
    A TIMEOUT, ALARM, CRASH OR MEMORY EXHAUSTION IS AN INFRASTRUCTURE OUTCOME AND NEVER NEGATIVE
    MATHEMATICAL EVIDENCE (AGENTS.md rule 5). Record time_budget_reached, exit status and resource
    measurements per run. The only reportable consequence is a smaller numerator over an unchanged
    denominator.
  - >-
    RANK >= 31 OVER Q IS THE LIVE WORLD RECORD AND IT IS CLAIMED (ICARM no. 302, posted 2026-08-23).
    NO ARTIFACT MAY DESCRIBE IT AS UNCLAIMED; an earlier session in this program made exactly that
    error. Certifying no. 302 is a confirmation of SOMEONE ELSE'S result and an external positive
    control, never this program's own rank result.
  - >-
    CARRY THE PROVENANCE CAVEAT. The input was retrieved through a summarising fetch tool, not by
    direct page-source inspection, and the board comment string is unverified at source. Repeat that
    caveat wherever the board's data is relied on rather than dropping it.
  - >-
    IF A POSITIVE APPEARS -- a rank-increasing 32nd point, or a gated curve certifying rank >= 32 --
    DO NOT STOP the remaining coverage work, and DO NOT state it as a result. It routes to
    independent `review-breakthrough` review at `max` effort in a separate session under AGENTS.md
    rule 12, and the six-clause claim bar in the contract must be discharged in full first.
    UNDER-CLAIM RATHER THAN OVER-CLAIM.
  - >-
    MAKE NO NETWORK CALL AND SUBMIT NOTHING TO THE ICARM ENDPOINT. A network call invalidates the
    run; a submission invalidates the experiment. The live-board re-read required by the claim bar is
    a Coordinator step outside the runs.
  - >-
    cypari/PARI MAY NOT APPEAR IN ANY CERTIFICATION STEP. It is permitted only for the part-C
    Mestre-Nagao triage, where nothing is certified.
  - WRITE ONLY INSIDE YOUR write_scope. NEVER COMMIT.

  write_scope:
  - coordination/goals/GOAL-ECQ-2298dc/tasks/TASK-20260824-261bb4
  - experiments/EXP-ECQ-f5af06/runs
  write_scope_note: >-
    Two paths, non-overlapping with any other task: no other task in this campaign writes under
    either. The second is included DELIBERATELY AND SOLELY so that run records land where
    tools/validate_ledger.py indexes them, which is the mechanical fix for the four-times-repeated
    defect described in the constraints. IT IS SCOPED TO runs/ AND NOT TO
    experiments/EXP-ECQ-f5af06 AS A WHOLE, so that the frozen contract at
    experiments/EXP-ECQ-f5af06/specification.yaml is outside the producer's write scope and cannot
    be edited by the agent executing it. Scripts and deliverables go under the task directory.

  deliverables:
  - >-
    coordination/goals/GOAL-ECQ-2298dc/tasks/TASK-20260824-261bb4/certification.json: part A. The
    a-invariants used; recomputed c4, c6 and discriminant as exact integers; recomputed naive height
    and log|disc| beside the cited 468.2771 and 453.0469 with agreement stated; the certifier's full
    output including on_curve_failures, the torsion bound and its primes, every independence attempt
    with its l and F_l-rank, the good primes used, and the indices certified independent; k as a
    number out of 31; the search bounds actually used; wall clock; and the outcomes of
    CTL-POSITIVE-INDEPENDENCE and CTL-NEGATIVE-INDEPENDENCE-PROVES-TOO-MUCH.
  - >-
    coordination/goals/GOAL-ECQ-2298dc/tasks/TASK-20260824-261bb4/extension_search.json: part B. The
    frozen box description reproduced verbatim; N_B computed and recorded BEFORE any candidate was
    tested; n_B; the coverage fraction; every hit with exact x and y and its classification as
    rank-increasing, index-reducing or dependent, with the certifier output that decided it; the
    outcome of CTL-SATURATION-DISTINCTION; wall clock.
  - >-
    coordination/goals/GOAL-ECQ-2298dc/tasks/TASK-20260824-261bb4/twist_search.json: part C. The
    frozen twist and perturbation ranges reproduced verbatim; N_C_TWIST and N_C_NULL computed and
    recorded BEFORE any candidate was scored; per arm the generated / scored / gated counts and
    coverage fractions; every scored candidate with its identifier and score; the 20 gated curves per
    arm with exact c4, c6, discriminant, naive height, reduced-box coverage, points found and
    certified rank lower bound with its certificate; and the provenance check outcome per reported
    curve.
  - >-
    coordination/goals/GOAL-ECQ-2298dc/tasks/TASK-20260824-261bb4/report.md: what was run, what was
    measured, what failed, and WHAT WAS NOT REACHED AND WHY. The branch label for each part named
    explicitly and defended against its pre-declared condition. Every negative carries its coverage
    fraction; every claim carries its scope; the provenance caveat repeated wherever the board's data
    is relied on; an explicit statement of where floating point appears and why it decides nothing.
  - >-
    experiments/EXP-ECQ-f5af06/runs/RUN-<id>/ for every run: manifest.yaml in the validator's schema
    with run.experiment_id set, plus command.txt, environment.json, stdout.log, stderr.log and
    raw-result.json.

  artifact_paths:
  - coordination/goals/GOAL-ECQ-2298dc/tasks/TASK-20260824-261bb4/certification.json
  - coordination/goals/GOAL-ECQ-2298dc/tasks/TASK-20260824-261bb4/extension_search.json
  - coordination/goals/GOAL-ECQ-2298dc/tasks/TASK-20260824-261bb4/twist_search.json
  - coordination/goals/GOAL-ECQ-2298dc/tasks/TASK-20260824-261bb4/report.md
  - experiments/EXP-ECQ-f5af06/runs

  archived_by: null
  archived_by_note: >-
    NO ARCHIVAL TASK IDENTIFIER HAS BEEN MINTED. The four identifiers issued to this campaign are
    GOAL-ECQ-2298dc, RQ-ECQ-e9b361, EXP-ECQ-f5af06 and TASK-20260824-261bb4, and the Coordinator
    that authored this record has no shell and could not mint a fifth. THIS IS A KNOWN GAP AND IT
    BINDS ON THE ARCHIVE SIDE, WHICH IS WHERE IT ACTUALLY BINDS: before this producer's artifacts are
    treated as durable, the orchestrating session mints a TASK-* with
    `python3 tools/allocate_id.py --next handoff --date 20260824`, confirms it with `--check`, and
    creates a Coordinator-only SNAPSHOT archive task naming TASK-20260824-261bb4 in its
    source_task_ids and this record's artifact_paths in its declared set. It runs ALONE, before
    independent review; the LEDGER archive is a second, separate task that runs alone after review.
