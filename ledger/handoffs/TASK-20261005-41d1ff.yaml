      on 2026-10-05, not a dispatched task, and has no ledger/handoffs file. Name any act in the interval that
      relied on either record as if official, if the top-level session knows
      of one; this batch's own opening (DEC-20260930-6f1d85 NA-1) is one, and
      is why TASK-20261005-fa2cf0 depends on this card.
    - >-
      RA-6 Stage exactly one path, the receipt. git add -A, git add . and
