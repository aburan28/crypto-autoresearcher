    - ledger/decisions/DEC-20260930-6f1d85.yaml
    - coordination/goals/GOAL-MONO-001/batches/BATCH-8609e2/dispatch_queue.json
    - ledger/handoffs/TASK-20261005-41d1ff.yaml
