      25cbc46924 (`git log 25cbc46924..HEAD -- <path>` showing a non-merge
      content change): stop, stage nothing, report. A mismatch is a custody failure to
      be resolved by a superseding record, never by editing either file.
    - >-
      RA-4 ORIGINAL COMMITS, mechanical. Record in the receipt, for each of
      0251414da7 and 25cbc46924: the full sha, the first parent, the exact
      changed-path list (it must be the one declared path, amendment alone and
