  binding_mode: content_first
  binding_mode_reason: >-
    `commit` cannot express this custody: the two records were committed
    BEFORE this task existed, in two separate commits, so no single archive
    commit changes the whole declared set. The archive commit changes only
    the receipt. `content_first` is the mode research_dispatch.py provides for
    exactly this case ("source packages committed before their archive task
    ran"). It binds every declared byte by sha256, still requires a real,
    reachable archive commit with the declared parent and the task and record
    ids in its message, and reads the bytes from HEAD on every verification.
    That is right for these two records because they are immutable: any later
    change to either would be a violation, and content_first will report it.
    `content_at_commit` is for records with a legitimate life after the
    archive (an experiment contract advancing state); neither record here has
    one, so it would only weaken the check.
