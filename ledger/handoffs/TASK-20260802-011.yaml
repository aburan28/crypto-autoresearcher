handoff:
  id: TASK-20260802-011
  from: coordinator
  to: coordinator
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-028
  role: coordinator
  archive_kind: ledger
  objective: >-
    After the Validator and the Red Team complete - verify run validity FIRST,
    then file EV-IVR-001 for the instance-variance control package if
    admissible, apply RR-IVR-1 as frozen to declare C-WIDE, C-TIGHT or C-INDET
    rung by rung under the both-cells rule, write the close decision as
    DEC-20260802-001, and checkpoint GOAL-ECDLP-001 with exactly one next
    action.
  uncertainty_reduced: >-
    Whether the frozen iid band is the correct yardstick for a deterministic
    exhaustive arm, and therefore whether the EV-LPF-001 detection-floor table
    is right by a factor of one or wrong by a factor of about sixteen.
  inputs:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/reviews/TASK-20260802-009/validation_report.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/reviews/TASK-20260802-010/red_team_report.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/reviews/TASK-20260802-005/contract_review.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/archives/TASK-20260802-008/snapshot_commit_receipt.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/archives/TASK-20260802-006/snapshot_commit_receipt.json
  - experiments/EXP-LPF-001/control_ivr/reading_rule_ivr.yaml
  - experiments/EXP-LPF-001/control_ivr/control_specification.yaml
  - ledger/decisions/DEC-20260801-014.yaml
  - ledger/evidence/EV-LPF-001.yaml
  constraints:
  - 'RUN ALONE.'
  - >-
    VERIFY VALIDITY BEFORE INTERPRETING - expected instance and arm counts,
    instance distinctness with 2301 absent, schema-complete manifest, seed and
    stream integrity, all seven hash legs, the freeze commit an ancestor of the
    run commit, 100 percent factorization verification plus the validator
    independent refactoring agreement count, raw versus summary agreement, and
    denominator traceability. An invalid or incomplete set goes back to the
    Executor with concrete defects and is NOT evidence.
  - 'IF THE VALIDATOR RETURNED NOT ADMISSIBLE, DO NOT INTERPRET. File no evidence record, state the defects, close the batch as an invalid run, and state that OBJ-RT082-1 SURVIVES INTACT - which is not a mathematical result in either direction.'
  - >-
    APPLY RR-IVR-1 AS WRITTEN. Evaluate I-0 FIRST; if any leg fires the rule is
    suspended, no ratio is reported as a measurement and the outcome is an
    INSTRUMENT outcome. Otherwise declare C-WIDE, C-TIGHT or C-INDET rung by
    rung UNDER THE BOTH-CELLS RULE, quote the clause text you apply, and quote
    the observed VR values with their intervals. DO NOT AMEND THE RULE, DO NOT
    ADD A CLAUSE, AND DO NOT READ A RESULT INTO A CLAUSE IT DOES NOT SATISFY.
  - >-
    THIS BATCH MAY NOT RE-ADJUDICATE BATCH-027. DEC-20260801-014 stands, branch
    L-4 is not re-selected, re-read or reversed, and EV-LPF-001 and
    DEC-20260801-014 are neither edited nor re-scored. IF C-WIDE FIRES, THE
    REPAIR IS A SUPERSEDING NOTE UNDER A NEW ID stating which detection-floor
    entries are conditionally wrong and by what measured factor with what
    interval - NEVER AN EDIT.
  - >-
    STATE IN TERMS THAT A VARIANCE RATIO IS EVIDENCE ABOUT THE YARDSTICK AND NOT
    ABOUT HEUR-DS-1 IN EITHER DIRECTION. A wide band does not mean the
    intermediates are uniform; a tight band does not mean they are not. This is
    the single most likely overclaim of the batch and it must be forbidden in
    the decision text, not only in the queue.
  - 'REPORT C-REPRO-1 AS PRIMARY FOR THE REPRODUCTION QUESTION AND C-REPRO-2 AS SECONDARY WITH ITS CIRCULARITY DECLARED. If C-WIDE fires at bits-16 u = 2, state that C-REPRO-2 arithmetic is VOID and report it as void.'
  - >-
    REPORT C-MEAN AND DO NOT READ IT. State in terms that its numbers are
    OBSERVATIONS ONLY, that RR-IVR-1 assigns it no licence, threshold or
    disposition, and that no conclusion about HEUR-DS-1, H-LPF-001 or the Semaev
    map follows from them in either direction. NAME THE SUCCESSOR CONTRACT THAT
    WOULD READ THEM AND RANK IT.
  - >-
    IF C-INDET FIRES AT EVERY RUNG, WRITE THE WEAKER SENTENCE AND NOT THE
    STRONGER ONE - "the iid band is not shown to be wrong by more than about a
    quarter in either direction at k = 20" and NEVER "the band is correct".
    Increasing k requires a versioned protocol_amendment recorded before any
    second run; do not quietly extend.
  - 'EVERY QUANTITATIVE SENTENCE MUST NAME THE ARCHIVED ARRAY IT IS COMPUTABLE FROM (PERTURB-TAIL-1). An unnamed array is a refusal to write the sentence.'
  - 'REPORT THE FREE RIDER WITH BOTH NULLS AND CARRY W3. A clean free rider licenses NO statement about VR, and a large VR with a clean free rider is a coherent outcome reported as such.'
  - 'STATE THE PRE-Q-1 ANSWER AS OBSERVED AND SCOPE THE FREE-RIDER SENTENCE TO IT - one shared small-x window or twenty different ones, with the RT049-B6 consequence stated either way.'
  - >-
    STATE EXPLICITLY WHAT THIS BATCH DOES AND DOES NOT DO TO RT049-CTRL-5. It
    PRODUCES the artifact that debt demands - measurements at fresh curve
    instances - but it does NOT transition H-LPF-001 to `replicated`, because
    that requires re-reading the certifying statistics under RR-LPF-2 at those
    instances and RR-LPF-2 bands are the very thing under test. Say that the
    successor adjudication is ranked and is not this batch, and DO NOT WRITE
    ledger/hypotheses/H-LPF-001.yaml.
  - 'RESTATE V1 THROUGH V12, ABS-REL-LPF-1 AND LIMBB-DECL-RR066 IN FULL in the evidence record and in the decision, and add W1 through W5 plus any W6 the Red Team proposed and you accept.'
  - 'ANSWER THE RED TEAM OBJECTIONS ON THE RECORD, including the normality assessment, the both-cells independence correction and the superseding-note capacity.'
  - >-
    BEFORE WRITING THE RECORDS, re-list ledger/decisions and ledger/evidence and
    confirm DEC-20260802-001 and EV-IVR-001 are BOTH free in the CURRENT tree
    including anything merged from origin/main since this queue was opened. If
    either is occupied, renumber OUR record and never the other party record,
    and file a queue amendment binding the declared set, artifact_paths and
    write_scope together.
  - 'RUN tools/validate_ledger.py BEFORE STAGING and record the error count in the receipt.'
  - 'Do not claim crypto-scale, medium-scale or asymptotic support. Toy stays toy. Promotion gates G1-G4 stay OPEN. No `support`, no `reject_scoped`, no `replicated` and no hypothesis transition of any kind under any clause.'
  - 'Cite no calibration number and no plant-Z number as evidence about any hypothesis. CAL-LPF-1 is unchanged - the calibration arrays are consumed here as DENOMINATORS and as apparatus statements only.'
  - >-
    DO NOT EDIT experiments/EXP-LPF-001/specification.yaml, reading_rule.yaml,
    reading_rule_v2.yaml, implementation/lpf001_driver.py, anything under
    control_ivr/, any run package, any review file or any tools/ file. Do not
    alter H-LPF-001, H-SMTH-001, H-EQD-001, H-DEP-001, H-DS-001, H-IC-001 or
    H-STR-002, do not re-score EV-LPF-001, EV-EQD-001 or EV-DS-001 through
    EV-DS-004, and do not edit any file under experiments/EXP-SMTH-001/,
    experiments/EXP-DS-001/, experiments/EXP-EQD-001/ or
    experiments/EXP-DEP-001/. Do not move, rename or edit ledger/EV-STR-001.yaml
    or ledger/DEC-20260718-003.yaml (OPEN-BATCH028-A). Leave FAEST and XEDN
    alone.
  - >-
    FILL knowledge_promotion EITHER WAY. Judge KN-CAND-BATCH024-A explicitly -
    its trigger (b) is MET and the remaining blocker is OPEN-BATCH028-B, the
    gate lack of any route for a methodological finding. Judge
    KN-CAND-BATCH023-A on its route (b). Judge whether the variance measurement
    itself warrants a KN-FIND, remembering that promotion requires `support` or
    `reject_scoped` on replicated or strong evidence. If promoted, the KN-FIND
    entry and the regenerated knowledge/INDEX.md go in THIS SAME commit under
    the /curate-knowledge conventions and require a queue amendment enlarging
    this declared set first. If not, give a concrete not_warranted reason for
    each.
  - 'RECORD WHETHER BATCH-028 INCREMENTS PATTERN-INSTR-5 OR SUPPLIES A THIRD CONSECUTIVE DISCONFIRMING CASE. This batch built an instrument, so it is a live test in both directions and the answer must be recorded either way.'
  - >-
    Carry every declared open item forward stating for each whether it was
    repaired, mitigated or left open, and rank the successor items - the
    RR-LPF-2 re-read at the fresh instances that would decide `replicated`,
    IDEA-20260802-004 and IDEA-20260802-001, RT082-CTRL-2 the windowed null,
    RT082-CTRL-3 the second encoding, the deep-tail perturbation family, the
    centred-LIMB-B successor, the signed (D+, D-) driver revision, the
    dependence-power repair, route (b) of KN-CAND-BATCH023-A, RT049-CTRL-3, the
    generated superseded-by index, OPEN-BATCH027-A superseding note,
    OPEN-BATCH028-A EV-STR-001 refiling and OPEN-BATCH028-B gate amendment -
    rather than dropping them.
  - 'Preserve every existing field and note in GOAL-ECDLP-001.yaml verbatim; supersede by addition and preserve exactly one next action.'
  - 'Commit message must contain TASK-20260802-011, EV-IVR-001, the filed decision id, EXP-LPF-001, RR-IVR-1, RUN-LPF-001-ivr, GOAL-ECDLP-001, BATCH-028.'
  - 'Do not push from this task.'
  - 'Every YAML and JSON file written must parse.'
  deliverables:
  - ledger/evidence/EV-IVR-001.yaml
  - ledger/decisions/DEC-20260802-001.yaml
  - ledger/goals/GOAL-ECDLP-001.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/archives/TASK-20260802-011/ledger_commit_receipt.json
  artifact_paths:
  - ledger/evidence/EV-IVR-001.yaml
  - ledger/decisions/DEC-20260802-001.yaml
  - ledger/goals/GOAL-ECDLP-001.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/archives/TASK-20260802-011/ledger_commit_receipt.json
  archived_by: TASK-20260802-011
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 7200
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
  - >-
    Post-commit verifier accepts the exact six-path Git diff and file hashes;
    validity verified before interpretation with the validator verdict quoted;
    I-0 evaluated first and the reading clauses declared rung by rung under the
    both-cells rule with the clause text and the observed VR values and
    intervals quoted; BATCH-027 not re-adjudicated and any repair issued as a
    superseding note under a new id; the yardstick-versus-heuristic prohibition
    written into the decision text; C-REPRO-1 primary and C-REPRO-2 secondary
    with its circularity declared or void; C-MEAN reported and expressly not
    read with its successor contract ranked; the weaker sentence written if
    C-INDET fires everywhere; every quantitative sentence naming its archived
    array; both free-rider nulls reported with W3 carried; the PRE-Q-1 answer
    stated with the RT049-B6 consequence; the RT049-CTRL-5 position stated and
    H-LPF-001 not written; V1-V12, ABS-REL-LPF-1, LIMBB-DECL-RR066 and W1-W5
    restated; the Red Team objections answered on the record;
    knowledge_promotion filled with every candidate judged; PATTERN-INSTR-5
    incremented or disconfirmed on the record; every declared open item carried;
    exactly one next action preserved in the goal record.
