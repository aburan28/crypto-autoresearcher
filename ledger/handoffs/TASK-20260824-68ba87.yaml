    (3) GATED ON (2): CTL-OFFDIAG, the off-diagonal cells adjudicated against the honest
    instrument and against the REUSED O-E, with every excluded cell carrying its reason;
    (4) CTL-NULL-OBJ, the counting rule against honest-vs-honest and two degenerate
    instruments;
    (5) CTL-RC1, the D-SHA1-INCODE refold BY RE-SCORING, and CTL-FROZEN-3 post-run.
    REPORT TABLES, PARTITIONS AND INTEGERS WITH THEIR POPULATIONS, NEVER A PASS.
