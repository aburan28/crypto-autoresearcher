    A structured report, not prose conclusions. (1) PER-STAGE STATUS: ran /
    partial / not run, with the reason for anything short of complete and the
    run IDs and manifest paths. (2) THE METRICS AS THE CONTRACT NAMES THEM: M1
    per cell with the attaining lambda, M2 as a matrix, M3 as the two tables, M4
