  completion_gate:
    - Stage 0's derivation note exists and its (4, 3) hand counts (1 and 0, with slack 2 on X^3 + 1) agree with the instrument, OR F0 is reported with the failing step archived.
    - All three instruments ran on all 1260 Stage 1 candidates and the agreement matrix is reported; any disagreement is listed candidate by candidate.
    - The four forced fixtures returned their forced values (C1 = 64, C2 = 8, C3 = 32768, C4 = 4), or the discrepancy is archived and the run is declared invalid.
    - Stage 3 covered 244 candidates at each of n' in {33, 44, 66} and every candidate with N > 0 has a wrapper-re-verified root-list certificate on disk.
    - Every stage invocation has a manifest carrying every AGENTS.md artifact-policy field; a stage without one is not complete.
    - Stage 4 returned counts for 200 draws at each cell AND the report either writes out the pole bookkeeping or records (D)(ii) as WITHDRAWN.
    - The Stage 5 report carries the section 4 closure block and the obstruction block with a filled resource_check.
    - execution-report.yaml names every stage that did not complete and why, with no estimated or reconstructed number anywhere in the deliverables.
