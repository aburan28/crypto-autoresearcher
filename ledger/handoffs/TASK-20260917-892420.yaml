  write_scope_exclusivity: >-
    EXCLUSIVE. No other task writes these paths. Explicitly OUT of scope and not
    to be touched by this task: experiments/EXP-QSP-33b442/specification.yaml
    (frozen, immutable), every file under ledger/ (records are the Coordinator's,
    and a status change is a Coordinator decision), knowledge/ (promotion is the
    Coordinator's alone), and analysis/qsp-ecc2k130/ (read-only context). Nothing
    outside experiments/EXP-QSP-33b442/ is written by this task.
