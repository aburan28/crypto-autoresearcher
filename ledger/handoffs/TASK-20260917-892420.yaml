handoff:
  id: TASK-20260917-892420
  from: coordinator
  to: executor
  recorded_at: '2026-09-17'
  goal_id: null
  question_id: RQ-QSP-f9bbdb
  kind: experiment_execution
  objective: >-
    Implement and execute the frozen contract
    experiments/EXP-QSP-33b442/specification.yaml (version 1, approved by
    DEC-20260917-73c49a) exactly as written, and return the observations. Run
    Stage 0 (the zero-compute hand re-derivation gate and its (4, 3) numeric
    check), Stage 1 (the five exhaustive F_2 cells, 1260 candidates, three
    instruments required to agree on every one), Stage 1b (the seeded
    K-coefficient arm, 1200 draws, seed 20260917), Stage 2 (the
    complete-splitting sweep over prime n in {7, 11, 13, 17, 19, 23, 29, 31}),
    Stage 3 (the n = 131 census at n' in {33, 44, 66}, 244 non-linearized
    lambda of degree 3..7 per cell, each count carrying an explicit,
    independently re-verified root list as its certificate), Stage 4 (the
    rational-lambda fixture at (11, 6) and (23, 12), 200 draws per cell), and
    the six controls C1-C6 including the four forced fixtures. Produce Stage 5's
    report with the docs/inventor-protocol.md section 4 closure block and the
    templates/research-records.md obstruction block with its resource_check.
    REPORT WHAT YOU MEASURED. Do not decide whether the hypothesis is supported:
    that is a Coordinator decision on a later review round.
  uncertainty_reduced: >-
    Whether any lambda at any tested cell exceeds max(d^{q+1}, 2^{n'-r}); whether
    any complete splitter falls below the corollary; what the EXACT, certified
    root counts are for all 732 non-linearized F_2-coefficient candidates of
    degree 3..7 at the three n = 131 cells RQ-QSP-f9bbdb left open; and whether
    three independent counting instruments agree on all 1260 exhaustive
    candidates. Before this task the program has an argument plus an
    out-of-harness pre-compute audit; after it, either certificates under
    manifests or a localised defect.
  inputs:
    - experiments/EXP-QSP-33b442/specification.yaml
    - ledger/hypotheses/H-QSP-5540d7.yaml
    - ledger/proposals/IDEA-20260916-5c9d6e.yaml
    - ledger/questions/RQ-QSP-f9bbdb.yaml
    - ledger/corrections/CORR-20260916-8d0b81.yaml
    - ledger/decisions/DEC-20260917-73c49a.yaml
    - knowledge/literature/KN-LIT-0a321c.md
    - knowledge/literature/KN-LIT-4fe9d2.md
    - inputs/HUANG-2020-JMC-QSP/paper_fulltext.md
    - inputs/EULER-PETIT-2019-QSP/paper_fulltext.md
    - analysis/qsp-ecc2k130/explore/ (CONTEXT AND REUSABLE CODE ONLY, never a source of numbers)
  constraints:
    - >-
      THE CONTRACT IS FROZEN AT VERSION 1. Execute the cells, candidate sets,
      instruments, seeds, controls, thresholds and metrics exactly as written.
      Any deviation -- a cell dropped, a candidate set narrowed, an instrument
      skipped, a seed changed, a threshold adjusted -- requires a VERSIONED
      protocol_amendment under experiments/EXP-QSP-33b442/amendments/ authored
      before the affected run, never a silent change and never a retro-fit.
      specification.yaml itself is IMMUTABLE and MUST NOT BE EDITED.
    - >-
      OBSERVATIONS ONLY, NO INTERPRETATION. Report counts, ratios, agreement
      cells, certificates, histograms and gate outcomes. Do not write that the
      hypothesis is supported, confirmed, or proved; do not change any ledger
      record's status; do not write an evidence record; do not promote anything
      to knowledge/. The pre-registered prediction is not yours to adjust, and a
      mismatch against a pre-registered exact value is reported as a
      discrepancy to be localised, not corrected.
    - >-
      EVERY CLAIMED COUNT CARRIES ITS CERTIFICATE. At n = 131 every candidate
      with N > 0 emits an explicit root list (coefficient vectors over
      F_2[z]/(z^131 + z^13 + z^2 + z + 1), grouped into Frobenius orbits) and
      the run wrapper INDEPENDENTLY re-verifies every listed root by evaluating
      x^{2^{n'}} - lambda(x) in K and asserting zero, and asserts pairwise
      distinctness. A count without a re-verified list is not a result. The same
      re-verification applies to any candidate anywhere that meets or exceeds
      the bound.
    - >-
      EVERY NUMBER IS PRODUCED BY THIS RUN. The code under
      analysis/qsp-ecc2k130/explore/ may be reused, copied, or adapted into
      experiments/EXP-QSP-33b442/implementation/ with its provenance stated. The
      JSON outputs and README tables of that directory MAY NOT be copied into
      runs/, cited as results, or used to fill a cell the run did not compute.
      Reading a number out of the analysis note and reporting it as a run result
      is fabrication under AGENTS.md core rule 5.
    - >-
      STOP WHERE THE CONTRACT SAYS STOP. Stage 0 gate failure, a forced fixture
      returning the wrong count, instrument disagreement, and a certified
      violation of the bound each STOP the affected work immediately, archive
      the failing evidence FIRST, and return. A certified violation is the most
      valuable outcome available here: archive it, stop sweeping, and return
      without interpreting it.
    - >-
      INFRASTRUCTURE IS NOT EVIDENCE. A timeout, crash, memory-cap kill, missing
      compiler, or budget exhaustion is an infrastructure outcome (F6, AGENTS.md
      rule 3). Record it as such with the partial per-candidate output
      checkpointed; never report it as a negative mathematical result and never
      estimate, interpolate, or reconstruct a number a run did not produce.
      Missing data stays missing and is reported as missing.
    - >-
      MANIFEST COMPLETENESS IS A GATE, NOT A FORMALITY. Each stage invocation
      writes a manifest carrying every AGENTS.md artifact-policy field: exact
      command; git commit and dirty-tree state; environment and dependency
      versions (including compiler and flags for any C helper); inputs, cell
      definitions, field polynomials, seeds and named sub-streams; requested
      model policy (executor-implementation), backend, resolved model identifier
      and probe status; reasoning effort; fallback_used and degraded
      requirements; stdout and stderr; raw machine-readable results; validity
      status and reason; timestamps, wall clock and peak_rss_bytes. Record
      `requested_policy` alongside the resolved model; if they differ, say so
      with `fallback_used: true` and a reason -- never substitute silently.
    - >-
      MACHINE PROTECTION BINDS: 4 GB peak memory, 1 worker, no descendant
      processes beyond the run process itself. The time and CPU estimates are
      ADVISORY (docs/research-budget-policy.md); exceeding them is recorded, not
      forbidden, and needs no further approval.
    - >-
      NO CURVE, NO KEY, NO GROUP. This contract is finite-field polynomial
      arithmetic only. Do not construct a curve, a point, or a group anywhere in
      the implementation.
  deliverables:
    - The Stage 0 derivation note (zero compute), archived before Stage 1 runs.
    - Per-stage run directories with schema-complete manifests and raw machine-readable results.
    - Per-cell JSON for Stages 1, 1b, 2, 3 and 4, one row per candidate or draw, with every column named in the contract's required_artifacts.
    - The Stage 3 root-list certificates, one file per n = 131 candidate with N > 0, each with the wrapper's independent re-verification result.
    - The instrument agreement matrix (M2) in full, with every disagreeing candidate listed if any.
    - The complete-splitter and near-complete tables (M3) with beta and both corollary values per row.
    - The gate record for Stage 0, C1-C4 forced fixtures, the C6 linearized cross-check, and certificate re-verification, with archived evidence of any failure.
    - The Stage 4 output plus EITHER the written-out pole bookkeeping for (D)(ii) OR an explicit statement that the extension is recorded as WITHDRAWN.
    - The Stage 5 report with the inventor-protocol section 4 closure block and the obstruction block including a completed resource_check.
    - execution-report.yaml recording per stage what ran, what did not, and why, with unfinished work reported as unfinished.
    - The implementation under experiments/EXP-QSP-33b442/implementation/, with provenance stated where code was adapted from analysis/qsp-ecc2k130/explore/.
  artifact_paths:
    - experiments/EXP-QSP-33b442/implementation/
    - experiments/EXP-QSP-33b442/runs/
    - experiments/EXP-QSP-33b442/execution-report.yaml
  write_scope:
