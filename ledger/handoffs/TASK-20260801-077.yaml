handoff:
  id: TASK-20260801-077
  from: coordinator
  to: reviewer
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-027
  experiment_id: EXP-LPF-001
  hypothesis_id: H-LPF-001
  objective: >-
    Review the run-supersession registry in tools/validate_ledger.py,
    tools/run_supersession_registry.yaml and tools/test_run_supersession.py ON ITS
    MERITS AS A GATE CHANGE, against seven named checks, and return PASS or REVISE.
    This change removed the blocker that ended BATCH-026; it is unreviewed; and
    CORR-20260801-003 and DEC-20260801-012 both require this review before the gate
    is relied on.
  uncertainty_reduced: >-
    Whether the validator's new notion of supersession repairs a record-integrity
    defect or weakens the gate that catches such defects.
  inputs:
  - tools/validate_ledger.py
  - tools/run_supersession_registry.yaml
  - tools/test_run_supersession.py
  - tools/validate_ledger_baseline.txt
  - tools/legacy_run_inventory.yaml
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-plantz/manifest.yaml
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-plantz/manifest_v2.yaml
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-calib/manifest.yaml
  - ledger/corrections/CORR-20260801-003.yaml
  - ledger/decisions/DEC-20260801-012.yaml
  - ledger/decisions/DEC-20260801-013.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-026/archives/TASK-20260801-069/snapshot_commit_receipt.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-026/archives/TASK-20260801-064/snapshot_commit_receipt.json
  - AGENTS.md
  constraints:
  - >-
    INDEPENDENT SESSION. You neither wrote nor verified this tool change, and you
    did not author CORR-20260801-003, DEC-20260801-012 or DEC-20260801-013.
  - >-
    RUN THE TOOL, DO NOT READ IT. Execute tools/validate_ledger.py at the parent
    commit and at the tool-change commit, capture BOTH full error sets, and DIFF
    THEM. Execute tools/test_run_supersession.py and report the pass and fail
    counts you actually observe. Quote the numbers you measure, never the numbers
    this handoff quotes.
  - >-
    CHECK 1 - REGISTRY FORMAT. The schema pin, the required-field set, the
    repository-relative and no-parent-directory path rules, the 64-hex sha256 rule,
    the duplicate-superseded-path rule, and that a MALFORMED registry makes the
    tool REFUSE TO RUN rather than half-apply. Try to break each one.
  - >-
    CHECK 2 - ROUTING IS EXACT-PATH ONLY. Confirm the routing key is the absolute
    superseded path and that NO glob, prefix, pattern or inference can make an
    unlisted manifest route anywhere. A path must be superseded only because it is
    named.
  - >-
    CHECK 3 - HASH MISMATCHES CANNOT BE HIDDEN. Confirm that a one-byte change to
    EITHER file produces an ERROR at force=True, that it cannot be downgraded to a
    legacy warning or suppressed by any flag or baseline line, and that a missing
    file on either side also errors. Demonstrate it rather than asserting it.
  - >-
    CHECK 4 - THE DUPLICATE-ID CHECK IS UNWEAKENED. Confirm a superseding record
    may not itself match experiments/*/runs/*/manifest.yaml, that both records must
    declare the SAME registered run id, that a mismatch errors, and that the run is
    still registered exactly once.
  - >-
    CHECK 5 - NOTHING WAS LAUNDERED. Verify AGAINST GIT that NO line was added to
    tools/validate_ledger_baseline.txt and NO entry to tools/legacy_run_inventory.yaml,
    and that experiments/EXP-LPF-001/runs/RUN-LPF-001-plantz/manifest.yaml is
    byte-unedited at
    c8812fb42bfc567259dbda36b5727ff19b466c093b8d57983d9a2b58409ab7a4.
  - >-
    CHECK 6 - THE ERROR-SET DIFF IS EXACTLY TWO LINES. Confirm the only difference
    between the two error sets is the removal of the two RUN-LPF-001-plantz lines,
    that nothing else moved in either direction, and that BOTH removed lines were
    in the NEW set and NOT in the baseline. Report the before and after counts you
    measure.
  - >-
    CHECK 7 - tier_of_run SEMANTICS. Confirm no TypeError on list-valued
    field_bits, that the tier is governed by the LARGEST cell and that this is the
    right semantics for a multi-cell run, that a bool or non-numeric cell yields
    None rather than a crash or a wrong tier, and that behaviour for a missing
    field_bits is unchanged.
  - >-
    ALSO VERIFY THE CHANGE IS ARCHIVED. It must be committed and reachable from
    HEAD, and you must record the commit sha you reviewed. AN UNCOMMITTED OR DIRTY
    GATE CHANGE IS NOT REVIEWABLE EVIDENCE AND IS ITSELF A REVISE.
  - >-
    ASK THE ADVERSARIAL QUESTION EXPLICITLY AND ANSWER IT ON THE RECORD - could
    this mechanism be used to make a real defect disappear rather than to record a
    real repair? Name the strongest abuse you can construct and say whether the
    implementation blocks it.
  - >-
    REPAIR NOTHING. You have no write scope over tools/. If you find a defect,
    return REVISE and name it; the repair is a separate task for a separate
    session.
  - >-
    RETURN PASS or REVISE with a concrete defect list and a
    recommendation_to_task_078 of APPROVE or DO_NOT_APPROVE. If you attach any
    precondition, state whether it is satisfiable by an artifact of the class you
    name - the BATCH-026 lesson.
  - >-
    STATE WHAT YOUR PASS DOES NOT CERTIFY. This review is about a validator, not
    about smoothness; it says nothing about H-LPF-001, HEUR-DS-1 or the Semaev map
    in either direction.
  - 'MAKE NO COMMIT; TASK-20260801-078 archives this report.'
  - >-
    Record inference honestly (requested review-adversarial, independent session),
    and every YAML written must parse.
  deliverables:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-027/reviews/TASK-20260801-077/tool_change_review.yaml
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-027/reviews/TASK-20260801-077/tool_change_review.yaml
  archived_by: TASK-20260801-078
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 5400
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
  - >-
    PASS or REVISE with a concrete defect list and a recommendation_to_task_078;
    all seven checks answered with measured evidence rather than reading; the tool
    run at both commits with both error sets captured and diffed and the counts
    reported as observed; the regression suite executed with its pass and fail
    counts reported; the tool-change commit sha recorded and confirmed reachable
    from HEAD; the baseline and legacy inventory confirmed unchanged against Git;
    the frozen plantz manifest confirmed byte-unedited; the strongest abuse route
    named and answered; what the pass does not certify stated; no repair authored
    and no commit made.
