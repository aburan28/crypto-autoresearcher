  read_scope_note: >-
    A WHITELIST. Every other path is out of scope, and every path in the plan's
    blind_rederivation.blind_from is forbidden by name. No git history of any
    kind, and no pull-request text.
  constraints:
    - >-
      BL-1 Read ONLY the six paths in read_scope. Do not open any other file
      under experiments/, ledger/, knowledge/, coordination/, analysis/ or
      inputs/, any other card, or any report of this batch.
    - >-
      BL-2 Run no git log, git show, git blame or git diff of any kind, and read
      no pull-request text. Commit messages are not files, and this
      repository's history contains values you must not see.
    - >-
      BL-3 Choose your own libraries and algorithms and name them with versions.
      Published mathematics from outside this repository is allowed and is
      cited with provenance. Do not transcribe any integer from any source.
    - >-
      BL-4 If you find a computed Q1, Q2 or Q3 value anywhere you were permitted
      to read, STOP and report a leak.
    - >-
      BL-5 Report on J4 only, with verdict inconclusive by design; you are
      forbidden to compare.
    - >-
      BL-6 ZERO experiment runs. No Cheon algorithm and no [x^i]P. This is an
      independent computation.
    - >-
      BL-7 Write nothing outside your write scope. Put every script, command and
      raw output inside computations.json. sources_read lists files read, never
      files written.
  deliverables:
    - >-
      rederivation-report.yaml, with every Q0-Q3 output blind-inputs.yaml
      requires, and the review_attestation block with task_id, joints_owned
      [J4], sources_read, read_sibling_reports false, verdict inconclusive and
