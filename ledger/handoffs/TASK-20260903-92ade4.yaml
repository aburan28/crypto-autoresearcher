handoff:
  id: TASK-20260903-92ade4
  recorded_at: '2026-09-03'
  goal_id: GOAL-AES-003
  question_id: RQ-AES-003
  batch_id: BATCH-b38667
  experiment_id: null
  experiment_id_note: >-
    No experiment exists or is approved. This card designs one; approval, if it ever
    comes, is a separate Coordinator decision with its own frozen contract.
  task_card: coordination/goals/GOAL-AES-003/batches/BATCH-b38667/tasks/TASK-20260903-92ade4/task_card.yaml
  dispatch_queue: coordination/goals/GOAL-AES-003/batches/BATCH-b38667/dispatch_queue.json
  role: idea-generator
  from: coordinator
  to: idea-generator
  objective: >-
    Design, but do not run, the adjudication of the residual floor's MAGNITUDE relative to
    the analytic comparator via the pooled-exposure route: state the estimator and pooling
    model, the preregistered fixed-order branch rule with its pre-arm domain, the
    empirically measured null object beside the computed comparator, the numbered
    heuristics with falsification conditions, and the AMEND-1-repriced exposure-to-decision
    arithmetic that says how much exposure buys which decision at what cost.
  uncertainty_reduced: >-
    Whether the residual floor's magnitude relative to the analytic comparator can be
    adjudicated at an affordable pooled exposure under AMEND-1, under exactly which
    preregistered rule and at what cost - the question that gates every floor-magnitude
    sentence and, through NARROW-1, every extinction sentence this campaign is currently
    barred from making.
  inputs:
  - ledger/decisions/DEC-20260903-be4472.yaml (RANK 1 statement; RAT-3/4/5; NARROW-4/5)
  - ledger/evidence/EV-AES-ac5c12.yaml (OBS-6 floor-alive restatement; obstruction block and resource_check)
  - ledger/evidence/EV-AES-868db1.yaml (OBS-6 floor-vs-null arithmetic; immutable SH2-MONOTONE-DECAY verdict)
  - ledger/corrections/CORR-20260903-d3cab5.yaml (exact Garwood CI for 17 hits)
  - ledger/decisions/DEC-20260901-6f9de3.yaml (AMEND-1 verbatim) and ledger/decisions/DEC-20260902-7ad3d9.yaml (NARROW-1/2/3 verbatim)
  - coordination/goals/GOAL-AES-003/batches/BATCH-060cb4/tasks/TASK-20260903-12a09f/red_team_report.yaml (RT-A2/B2/C2; successor requirements N1-N5)
  - coordination/goals/GOAL-AES-003/batches/BATCH-060cb4/tasks/TASK-20260903-d81052/validation_report.yaml
  - ledger/proposals/IDEA-20260903-8f26ac.yaml (the preceding batch's design, as a form precedent)
  constraints:
  - RANK 1 ONLY. Do not design or price RANK 2 (family extension k=5/6 or a finer (3,4] locator) except as the dominance comparison this proposal owes; do not adopt PINCTRL-1 (RANK 3, which needs a new Coordinator pin decision); do not open RANK 4-8.
  - 'ZERO ARMS: no build, no measurement, no run, no freeze, no ledger write, no commit, no identifier minted. budget.maximum_runs = 1 is the dispatch_queue.v1 minimum positive schema bound and is not a run authorization.'
  - NARROW-1 through NARROW-5 are binding paraphrase discipline and must be quoted VERBATIM from DEC-20260902-7ad3d9 (NARROW-1/2/3) and DEC-20260903-be4472 (NARROW-4/5). Every sentence must comply - the floor is a live decidable excess and never extinction; no count-level sentence without second seeds at the named k; exact re-runs are instrument determinism and never replication; (3,4] admits no cliff-at-4, completion or sub-sub-interval reading and the multiplicative prior stays BROKEN-AUTHORITY; k=8's two draws are BAND-level only and carry no count verdict.
  - 'RAT-3 discipline: every preregistered branch conjunct is written out IN FULL in preregistration-skeleton.md and that text is the binding version; no section may paraphrase a branch conjunct. The inverted CC3-NONMONO paraphrase (DEV-S2b-1) is why this rule exists.'
  - Carry the AMEND-1 counter-inconsistency gate VERBATIM from DEC-20260901-6f9de3 (standing gate for the frozen 582ea9 lineage, ratified RAT-2) and apply it to every analysis-bearing receipt the design would produce, including the saturation-aware overflow identity at the proposed exposure.
  - 'Reprice against the REALIZED readings, not the priced ones: h(4) = 17 (seed 531001) / 21 (seed 531002), h(8) = 13 / 18, h(16) = 12, each at 2^30 trials per arm, cell (1,1), r = 5, PIN-T0. The exact Garwood 95% CI for 17 hits is [9.903, 27.219] per CORR-20260903-d3cab5; 29.2 is a citation error and must not reappear.'
  - 'State the pooled-exposure route precisely: the estimator, the pooling model (independent draws pool exposure), the CI method (exact Garwood Poisson, lineage-consistent), the pre-declared treatment of between-seed heterogeneity and overdispersion, and the exposure-to-decision mapping. Name what pooling assumes and what breaks it.'
  - 'CONTROLS BEFORE BELIEF: pair the analytic comparator with an EMPIRICALLY MEASURED null object of the same shape at the same exposure. The lineage''s existing null objects are the k=0 ramp-zero arm and the r=6 dead anchor. A design that compares the floor only against a computed lambda is incomplete and must say so rather than omit the control.'
  - The decision rule is preregistered, fixed-order, mutually exclusive and exhaustive, with named branch outcomes and a DOMAIN (which k, which seeds, which exposure) fixed pre-arm. For each branch state exactly what it licenses AND what it does not; no branch may license an extinction, plateau or completion sentence the rule cannot decide.
  - 'Every conditional dependence is an explicit NUMBERED heuristic with a formal statement, a falsification condition and a validation route inside the same proposal: at minimum the Poisson counting model, independence across seeds, exposure additivity, instrument stationarity across a longer arm, and any HIT_LOG_CAP or overflow-counter interaction with the estimator.'
  - 'State instrument custody explicitly: whether the design runs on the frozen build (source ec748cef..., binary 74e3d65c...) or the certified frozen-build-plus-declared-extension (binary 3ccc377c..., R4 k=3 digest 922e24c9...), and whether any exposure or grid change requires a NEW freeze commitment with a pre-arm digest. A source change beyond a declared diff is out of scope.'
  - 'BLINDNESS-ENABLING SEPARATION: ALL statistical derivation - expected counts under each hypothesis, CI widths, discrimination power, exposure-to-decision arithmetic - lives ONLY in pooled-exposure-pricing.json. design-proposal.yaml references it by path and may restate only headline design totals (arm counts, wall-clock seconds). Restating the derivation in design-proposal.yaml spends the validator''s blind re-derivation and must be recorded as a procedure deviation.'
  - Fill dominated_by (null only after checking every frontier row across time, memory and number of draws) and a quantitative sota_delta, and state explicitly whether RANK 2 dominates this route on information per second (docs/inventor-protocol.md).
  - Say whether the KN-TECH-080 proof_search_map applies. Any quantity presented as exact (the null lambda, the CI method, the power arithmetic) carries a derivation note; an audit that does not apply records WHY rather than being omitted.
  - Price the successor batch inside this campaign's sizing basis (producer 1600 s, snapshot 500 s, validation 1400 s, red team 1000 s, ledger archive 900 s) and report the COMPUTE component in its own field, separate from authoring time, per the goal's C4 discipline. Use the lineage's measured cost basis of about 27 minutes per 2^30 four-thread arm and cite it.
  - 'Toy tier only (RQ-AES-003 R7 default): no distinguisher, no key recovery, no deployed-AES statement, no carrier/X-lane/rho-exclusion sentence, and no published-cryptanalysis comparison in either direction.'
  - Do not re-measure settled points and do not re-compose the immutable SH2-MONOTONE-DECAY verdict of EV-AES-868db1 or the additive content of EV-AES-ac5c12.
  - Write only inside the declared write_scope. Make no commits and mint no identifiers; this proposal becomes an IDEA-* ledger record only in the ledger archive TASK-20260903-6fa9ff, after independent review.
  - Use search_knowledge before asserting that a pooled-exposure or floor-adjudication route has been tried or is known to fail, and mark every citation's provenance (recalled|retrieved|kb|internal). A recalled reference is a pointer, never support.
  - A budget or tooling failure is reported as resource_exhaustion or infrastructure failure, never as a finding about the floor.
  deliverables:
  - design-proposal.yaml - the full IDEA-record body (class, claim, mechanism, novelty_status, numbered heuristics with falsification conditions and validation routes, arms and their custody, dominated_by, sota_delta, per-branch licensing statement, verbatim NARROW-1..5 and AMEND-1), referencing the pricing file by path and restating none of its derivation
  - pooled-exposure-pricing.json - the complete machine-readable exposure-to-decision arithmetic (per-arm and pooled exposure; expected counts under the constant-floor, continued-decay and analytic-null hypotheses; exact Garwood 95% CIs at 17, 21, 13, 18 and 12; discrimination power at the stated alpha; wall-clock and compute cost per candidate design)
  - preregistration-skeleton.md - the write-once preregistration text a successor batch would adopt VERBATIM (fixed-order branch rule with every conjunct in full, pre-arm domain, gates and anchors including AMEND-1, the dead anchor and the ramp-zero proves-too-much control, freeze and build-identity discipline, halt branches)
  artifact_paths:
  - coordination/goals/GOAL-AES-003/batches/BATCH-b38667/tasks/TASK-20260903-92ade4/design-proposal.yaml
  - coordination/goals/GOAL-AES-003/batches/BATCH-b38667/tasks/TASK-20260903-92ade4/pooled-exposure-pricing.json
  - coordination/goals/GOAL-AES-003/batches/BATCH-b38667/tasks/TASK-20260903-92ade4/preregistration-skeleton.md
  archived_by: TASK-20260903-d2e9f8
  write_scope:
  - coordination/goals/GOAL-AES-003/batches/BATCH-b38667/tasks/TASK-20260903-92ade4
  inference:
    policy: research-deep
    requested_policy: research-deep
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 1600
    memory_gb: 2
    maximum_runs: 1
    maximum_runs_note: >-
      ZERO experiment runs are authorized. 1 is the dispatch_queue.v1 schema's minimum
      positive bound for the field, not a run authorization.
    experiment_runs_authorized: 0
    compute_component_seconds: 0
  completion_gate:
  - All three artifacts exist under the declared write_scope; the YAML parses with yaml.safe_load and the JSON with json.load.
  - The proposal carries verbatim NARROW-1..5 and verbatim AMEND-1, the preregistered fixed-order rule with its pre-arm domain, the numbered heuristics with falsification conditions and validation routes, the measured null object beside the analytic comparator, dominated_by with a quantitative sota_delta, and a per-branch statement of what is and is not licensed.
  - All statistical derivation is confined to pooled-exposure-pricing.json so that the blind re-derivation of TASK-20260903-779393 is possible.
  - Every cited reading traces to EV-AES-ac5c12, EV-AES-868db1 or CORR-20260903-d3cab5, and no sentence exceeds toy tier or the tested scope.
  - Zero arms executed, no identifier minted, no ledger record written, no commit made.
  return_format: Only the output record this role contract declares; no prose summary in place of it.
  review_plan:
    claim_under_review: >-
      As the producer is required to state it: "The pooled-exposure design specified in
      preregistration-skeleton.md, at the exposure priced in pooled-exposure-pricing.json
      and under the AMEND-1 gate, discriminates between {the residual floor is a constant
      nonzero plateau across the tested k}, {the residual floor is still decaying with k},
      and {the residual floor is indistinguishable from the analytic comparator} at the
      stated power and alpha, within the priced budget, and licenses exactly the sentences
      enumerated per branch and no others."
    coordinator_prior: >-
      Recorded before any reviewer runs. (1) I expect the design to be FEASIBLE but for the
      pricing to split sharply in two: floor-versus-null is already decided at 2^30
      (EV-AES-868db1 OBS-6 gives P(h >= 12 | lambda = 1) = 8.3e-10 and floor-vs-null power
      0.989 at lambda = 13), so the informative target is floor-versus-floor - separating
      h(16) = 12 from h(4) = 17/21 - and continued-decay versus plateau. (2) I therefore
      expect the honest arithmetic to land in the tens of pooled 2^30 arms to separate 12
      from 17 at 95%, i.e. many hours of compute, and I expect this to be the proposal's
      real finding rather than its rule. (3) I expect the strongest temptation to be a
      slide toward a plateau or extinction sentence that the exposure cannot support -
      NARROW-1 bars it and I expect the red team to have to say so. (4) I expect the
      analytic comparator alone to be insufficient and a measured null object of the same
      shape to be required. (5) I expect dominated_by to be the weakest field, with RANK 2
      (family extension) plausibly dominating on information per second. If the review
      instead finds the separation cheap, or finds floor-versus-null still open, my prior
      is OVERTURNED and that is the more valuable outcome; it is recorded here so the
      difference is visible afterwards.
    joints:
    - joint: >-
        J-P - the exposure-to-decision arithmetic and the decidability of the preregistered
        rule: whether the priced pooled exposure actually separates the three named
        alternatives at the stated power, and whether every branch is reachable, ordered,
        mutually exclusive and domain-fixed pre-arm.
      assigned_to: TASK-20260903-779393
      attack_plan: >-
        Re-derive the arithmetic first, in fresh code, from the statement of the quantity
        and the committed readings alone - pooled exposure, expected counts under
        constant-floor, continued-decay and analytic-null, exact Garwood 95% CIs at 17, 21,
        13, 18 and 12, and the discrimination power at the stated alpha - and write it into
        the report BEFORE opening pooled-exposure-pricing.json. I expect the break, if
        there is one, at the point where the proposal converts a floor-vs-null power (which
        is already overwhelming) into a floor-vs-floor claim, or where pooling independent
        seeds is used to buy a precision that per-arm exposure does not support. Then route
        the realized readings AND a counterfactual set through the rule and show whether
        any branch is unreachable, overlapping, or decided only after seeing the data.
      breaking_artifact: >-
        A worked counter-derivation showing a different required exposure or power for at
        least one named alternative, or a reading that lands in two branches or in none.
    - joint: >-
        J-S - what the rule would LICENSE: scope, interpretation, the pooling assumptions,
        instrument custody at higher exposure, and Pareto honesty.
      assigned_to: TASK-20260903-4fdf77
      attack_plan: >-
        Apply the proposal's own rule to the known-false objects listed under
        proves_too_much and report its routing on each. Then attack the pooling model
        directly - independence across seeds, exposure additivity, between-seed
        heterogeneity, instrument stationarity across a longer arm, and whether HIT_LOG_CAP
        or the overflow counter interacts with the estimator at higher exposure under
        AMEND-1. Then audit the proposal sentence by sentence against NARROW-1..5, hunting
        for a smuggled extinction, plateau, completion, cliff-at-4, whole-curve, k=12
        coverage, count-verdict-at-k=8 or prior-rehabilitation sentence. I expect the break
        at the licensing statement of the plateau branch and at dominated_by.
      breaking_artifact: >-
        A sentence the design would license that its exposure cannot support, a null object
        on which the rule returns a floor verdict, or a cheaper route that dominates on
        information per second.
    blindness:
      mutual: true
      lifted_for: []
      rationale: null
    proves_too_much:
      objects:
      - The k=0 ramp-zero arm, where the count is 2^30 by construction and no residual-floor reading can be correct.
      - The r=6 dead anchor at 0 hits, where the floor is absent by construction.
      - Synthetic counts drawn from the analytic null at the proposed exposure, where 'indistinguishable from comparator' is the only correct verdict.
      - A synthetic still-decaying generator, where a 'constant plateau' verdict is known false.
      failure_signature: >-
        A correct rule returns 'indistinguishable from comparator' or a halt on the first
        three objects and 'still decaying' on the fourth. Returning 'live floor above
        comparator' on any of the first three, or 'plateau' on the fourth, means the rule
        has proved too much and is wrong somewhere nobody has read closely enough.
      assigned_to: TASK-20260903-4fdf77
    blind_rederivation:
      required: true
      quantity: >-
        The exposure-to-decision arithmetic: for each candidate design, the pooled exposure
        (arms times 2^30 trials), the expected hit counts under (i) the constant-floor
        hypothesis, (ii) the continued-decay hypothesis and (iii) the analytic null
        comparator, the exact Garwood 95% confidence intervals at the realized readings 17,
        21, 13, 18 and 12, and the resulting discrimination power at the stated alpha.
      parameters: >-
        Realized readings h(4) = 17 (seed 531001) / 21 (seed 531002), h(8) = 13 / 18,
        h(16) = 12; 2^30 trials per arm; cell (1,1); r = 5; PIN-T0; seeds 531001/531002;
        exact Garwood Poisson intervals at alpha = 0.05 unless the proposal preregisters
        another alpha, in which case use that one and say so.
      blind_from:
      - coordination/goals/GOAL-AES-003/batches/BATCH-b38667/tasks/TASK-20260903-92ade4/pooled-exposure-pricing.json
      blind_from_note: >-
        SEALED-FIRST ORDERING, not permanent prohibition: the re-derivation is written into
        validation_report.yaml before this path is opened, and the subsequent read is
        disclosed explicitly in review_attestation. Recomputing from the producer's own
        file reproduces a wrong-but-self-consistent implementation faithfully, which is
        exactly what validation cannot otherwise see.
      assigned_to: TASK-20260903-779393
    procedure_deviations: []
  authorizes_nothing: >-
    A PROPOSAL IS NOT AN APPROVAL. This handoff authorizes no experiment, arm, exposure
    increase, build change, status change, evidence record, knowledge promotion or
    successor batch.
