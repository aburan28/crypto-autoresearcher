handoff:
  id: TASK-20260724-244
  from: coordinator
  to: executor
  objective: >-
    Execute the approved EXP-FB3-001 factor-base geometry battery under
    amendment EXP-FB3-001-AMD-001: every pre-registered cell, exact
    full-target-space decomposition counting, the growth arm 2^14..2^18, the
    shared permutation null, the Holm family accounting, and the pre-registered
    analytic conservation arm.
  uncertainty_reduced: >-
    Whether ANY structured factor-base geometry has a decomposition-yield
    advantage over a matched random base that grows with N — the last open
    question in the F3 family (RQ-FB3-001) after the H016 and H017 kills.
  inputs:
    - experiments/EXP-FB3-001/specification.yaml
    - experiments/EXP-FB3-001/amendment-001.yaml
    - ledger/H-FB3-001.yaml
    - ledger/RQ-FB3-001.yaml
    - inputs/h100_session/h016_base_yield.json
    - experiments/EXP-FB-001/analysis.md
  constraints:
    - Observations only; do not change any hypothesis, experiment, or goal status.
    - Every pre-registered cell must reach a terminal state (measured, infeasible, or invalid); no early stopping on outcome.
    - >-
      Discrete logs are known by construction for measurement only; derive no
      cost, speedup, or attack claim from them.
    - >-
      Toy scale (N <= 2^18). No crypto-scale statement, no attack-improvement
      statement, and no claim that a passing control is a cryptanalytic result.
    - >-
      Report the port-fidelity comparison against the recorded H016 and H017
      statistics before any family verdict.
    - >-
      If a consequence of the analytic arm is contradicted by measurement, treat
      it first as an implementation-integrity finding and report it as such.
    - Stay inside write_scope experiments/EXP-FB3-001.
  deliverables:
    - Implementation under experiments/EXP-FB3-001/implementation/
    - Immutable run records under experiments/EXP-FB3-001/runs/
    - analysis.md with the Holm-corrected family table, growth fits, and the frozen-criteria verdict
    - conservation.md with the analytic arm, its proof, and its per-consequence confirmation status
    - execution-report.yaml
  artifact_paths: []
  archived_by: TASK-20260724-230
  inference:
    policy: executor-terra
    fallback_allowed: true
    independent_session_required: false
  budget:
    wall_clock_seconds: 7200
    memory_gb: 6
    maximum_runs: 12
  completion_gate:
    - Every pre-registered cell has a terminal state and is present in the Holm family accounting.
    - Exact total-triple counts match the closed-form total in every cell, or the mismatch is reported as an integrity failure.
    - Growth slopes are reported per geometry across 2^14, 2^16, 2^18.
    - The verdict is stated against the frozen success and falsification criteria with claim boundaries.
    - Raw results, resource metrics, and summaries agree; artifacts are checksummed.
  return_format: execution_report
