handoff:
  id: TASK-20260823-d1cb76
  from: coordinator
  to: idea-generator
  objective: 'Obtain an explicit elliptic family of generic Mordell-Weil rank r > 8 over Q(t), with EXACT
    coefficients, that this repo can re-certify. GOAL-ECQ-001 was capped at r = 8 by the rational-elliptic-surface
    ceiling (Shioda-Tate 10d-2 at d=1); every downstream claim in GOAL-ECQ-002 rests on breaking that
    cap. Known candidates to run down: Nagao (rank 13 over Q-bar(t), 12 over Q(t), 1994), Kihara (rank
    14), Elkies (elliptic K3, rank 17 over Q, from the Shimura curve of level 6*79 with u^2 = 16t^6 -
    19t^4 + 88t^2 - 48). Others are welcome; these are leads, not a closed list.'
  uncertainty_reduced: Which published high-rank Q(t) family is actually usable here -- exact coefficients
    recoverable, generic rank re-certifiable in this repo, and specialisations small enough to be useful.
  inputs:
  - ledger/goals/GOAL-ECQ-002/goal.yaml
  - ledger/hypotheses/H-ECQ-d60d07.yaml
  - ledger/questions/RQ-ECQ-80f23c.yaml
  - coordination/goals/GOAL-ECQ-002/baseline/frontier_20260823.json
  - experiments/EXP-ECRANK-e1e30e/source/twist_family.py
  constraints:
  - A published rank is a CLAIM TO REPRODUCE, not a fact to inherit. For every family you return, state
    precisely what you verified yourself versus what you are citing. Recovering the exact coefficients
    and checking the claimed sections actually lie on the curve is the minimum; say so explicitly when
    you could not.
  - CITE PRIMARY SOURCES with retrievable identifiers (arXiv id, DOI, journal, page). Never reconstruct
    an equation from memory and present it as published. If you cannot retrieve a paper, say the family
    is unavailable rather than approximating it.
  - Distinguish rank over Q(t) from rank over Q-bar(t) EVERY time. Nagao's is 13 over Q-bar(t) but 12
    over Q(t); conflating them silently inflates the base by one and would corrupt every downstream number.
  - State each family's surface degree d and therefore its exact Shioda-Tate ceiling 10d-2. A family whose
    claimed rank exceeds its own ceiling is a red flag to report, not to average away.
  - Write ONLY inside your write_scope. Never commit. Do not change any hypothesis or goal status.
  deliverables:
  - 'candidate_families.json: for each family, exact Weierstrass coefficients as strings (in the parameter
    t), claimed generic rank over Q(t) AND over Q-bar(t), surface degree d and ceiling, explicit generators/sections
    if published, full citation, and a verified/cited split for every claim made.'
  - 'report.md: which family you recommend as the base and why, what you re-derived versus cited, what
    you could not obtain, and the cheapest next check that would falsify the recommendation.'
  artifact_paths:
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-f2341e/tasks/TASK-20260823-d1cb76/candidate_families.json
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-f2341e/tasks/TASK-20260823-d1cb76/report.md
  budget:
    wall_clock_seconds: 3600
    memory_gb: 3
    maximum_runs: 40
  inference:
    policy: research-deep
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  completion_gate:
  - every family reports generic rank over Q(t) AND over Q-bar(t) separately
  - every family reports surface degree d and its Shioda-Tate ceiling 10d-2
  - every claim split into what was verified here vs what is cited, with a retrievable citation
  - a recommended base family, or an explicit statement that none was obtainable
  return_format: 'idea-generator proposal record: candidate families with predictions and the cheapest
    falsifying check. No status changes.'
  archived_by: TASK-20260823-744c38
