# TASK-20261016-5c0f78 -- ledger archive for the evidence reviews of
# EXP-ENDO-25ad84, EXP-ENDO-7494e7 and EXP-ENDO-33a1ee.
# Runs no trial. maximum_runs is 0 because the task only records custody.
# It makes DEC-20261016-5752c0, DEC-20261016-4f3a1a and DEC-20261016-f379af
# official once its commit is verified.
handoff:
  id: TASK-20261016-5c0f78
  from: coordinator
  to: coordinator
  objective: >-
    After the session has rendered the three decision reports, commit the
    review artifacts, evidence, decision, correction and hypothesis records
    of the three ENDO evidence reviews by exact path, alone, in one ledger
    archive commit; verify it; push; and open or refresh the PR naming every
    record id.
  uncertainty_reduced: >-
    Whether the three official transitions rest on one verified commit. This
    is not a scientific uncertainty, except for gate G2 (the independent
    recomputation of the arm-A identity), on which the arm-A part of
    DEC-20261016-5752c0 depends.
  depends_on:
    - TASK-20261016-cbf19d
    - TASK-20261016-d4363d
    - TASK-20261016-8a9451
    - TASK-20261016-1b5210
    - TASK-20261016-35d324
  inputs:
    - experiments/EXP-ENDO-25ad84/validation/TASK-20261016-1b5210.md
    - experiments/EXP-ENDO-7494e7/validation/TASK-20261016-35d324.md
    - experiments/EXP-ENDO-25ad84/runs/RUN-ENDO-d7cb69/rows.jsonl (lines 26 and 50, for G2)
  constraints:
    - Merge origin/main into the working branch first (merge, never rebase). Record base_commit_checked and merge_outcome in the receipt. A conflict inside a record is never resolved by editing it; stop and report.
    - Confirm each pre-minted id with python3 tools/allocate_id.py --check before staging (EV-ENDO-fb5823, EV-ENDO-7628a0, EV-ENDO-118b3a, DEC-20261016-5752c0, DEC-20261016-4f3a1a, DEC-20261016-f379af, CORR-20261016-ac9fc8, CORR-20261016-37897c, TASK-20261016-5c0f78).
    - Write the three analysis.md files verbatim from the Coordinator's handback; the subagent could not write .md files.
    - Render each decision report with its plot.py and Typst, then open and read every page of each PDF before staging. Never stage a PDF that has not been inspected.
    - Stage only the artifact_paths below, one by one. git add -A, git add . and directory adds are forbidden. If a declared validation report is already committed with identical bytes, record its committed sha256 in the receipt and do not restage it.
    - Do not edit any run record, frozen specification, snapshot receipt or run report. Corrections live in ledger/corrections/ only.
    - Run tools/validate_ledger.py before committing; stop on any new error attributable to the staged paths.
    - Never amend, rebase or force-push. Zero runs. Amazon Bedrock is prohibited.
  deliverables:
    - experiments/EXP-ENDO-25ad84/archive/TASK-20261016-5c0f78.receipt.yaml (kind ledger; commit_sha null inside the commit; parent_sha; base_commit_checked; merge_outcome; path_sha256 for every staged path; record_ids; the G2 outcome; validate_ledger and check_review_independence outputs)
    - Three rendered decision reports (decision.svg and report.pdf in each review-DEC directory)
    - One isolated commit, a pushed branch and an open or refreshed PR
  artifact_paths:
    - experiments/EXP-ENDO-25ad84/archive/TASK-20261016-5c0f78.receipt.yaml
    - ledger/handoffs/TASK-20261016-5c0f78.yaml
