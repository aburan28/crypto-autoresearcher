  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
    delivery: interactive
  budget:
    maximum_runs: 0
  completion_gate:
    - G1 origin/main was merged (never rebased); base_commit_checked and merge_outcome are in the receipt.
    - >-
      G2 Arm-A identity, recomputed with code that does not import
      harness/endosweep: for rows.jsonl lines 26 (bls/Bandersnatch) and 50
      (mnt/mnt1) of RUN-ENDO-d7cb69, with p = int(row["p"], 16) and
      t = row["trace"], t*t - 4*p == row["ascent"]["D_K"] *
      row["ascent"]["f_pi"]**2 holds exactly, and D_K is -8 and -19
      respectively. Record the outcome in the receipt. If either check fails,
      stop before committing and report: the arm-A part of
      DEC-20261016-5752c0 is then void and the Coordinator issues a
      superseding decision.
    - >-
      G3 Each plot.py ran from the repository root and wrote decision.svg.
      Its printed values match the records: for EXP-ENDO-25ad84, 7 arm-M
      positives and 2 arm-A hits; for EXP-ENDO-7494e7, corrected one-shot
      +2.20, +5.78, +5.78, +7.55, +7.55, +9.46; for EXP-ENDO-33a1ee, 17 of 41
      and 19 of 41 flagged repetitions and recorded medians equal to the
      median of the per-repetition ratios. A mismatch is reported, not
      patched.
    - G4 Each report.pdf was rendered from its report.typ and read page by page (opens, graph legible and labelled, run ids present).
    - G5 tools/validate_ledger.py shows no new error attributable to the staged paths; check_review_independence.py output is recorded.
    - G6 One commit binds exactly the declared paths; the post-commit verifier (tools/research_dispatch.py) accepts the receipt.
    - G7 The branch is pushed and a PR against main, ready for review, is open or refreshed, titled with the evidence ids and naming EV-ENDO-fb5823, EV-ENDO-7628a0, EV-ENDO-118b3a, DEC-20261016-5752c0, DEC-20261016-4f3a1a, DEC-20261016-f379af, CORR-20261016-ac9fc8, CORR-20261016-37897c, H-ENDO-5a33ae, H-ENDO-f58749, H-ENDO-c9f324 and TASK-20261016-5c0f78.
    - G8 After verification, checkpoint GOAL-ENDO-001 (tools/shard_goal.py) with exactly one next action, and write the review-evidence session receipt.
  return_format: Commit SHA, PR URL, the G2 outcome, the plot outputs, and the list of archived paths with sha256.
