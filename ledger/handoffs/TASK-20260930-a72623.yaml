# SNAPSHOT ARCHIVE of the GOAL-MONO-001 rule-12 closure review
# TASK-20260930-40470a, in BATCH-44adf9. It implements the snapshot leg of
# DEC-20260930-3a0b7b NA-1 ("On return: snapshot-archive the report alone")
# and DP-1/DP-4 of ledger/handoffs/TASK-20260930-40470a.yaml. The ID was
# pre-minted by the top-level session, which reports that --check found it
# free. Written by a Coordinator subagent that has no shell. Zero runs. No
# status change.
handoff:
  id: TASK-20260930-a72623
  from: coordinator
  to: coordinator
  goal_id: GOAL-MONO-001
  batch_id: BATCH-44adf9
  authorized_by: DEC-20260930-3a0b7b
  archive_kind: snapshot
  objective: >-
    Commit the review output of TASK-20260930-40470a exactly as returned,
    together with the review's runtime session receipt and this card's
    snapshot receipt, in ONE isolated commit. Bind the bytes by sha256 so that
    the composer TASK-20260930-e74f4c composes only from committed, pushed,
    hash-bound review bytes. This task runs ALONE, after the reviewer has
    returned and its claim is released, and before any composition.
  uncertainty_reduced: >-
    None about the mathematics. This task gives durability and custody to the
    review report that a closure-or-dissent decision on GOAL-MONO-001 will
    rest on.
  inputs:
    - coordination/goals/GOAL-MONO-001/review/TASK-20260930-40470a/review_report.md
    - coordination/goals/GOAL-MONO-001/review/TASK-20260930-40470a/s4_construction/computations.json
    - ledger/handoffs/TASK-20260930-40470a.yaml
    - ledger/decisions/DEC-20260930-3a0b7b.yaml
    - coordination/review/mono-20260930-44adf9/review-plan.yaml
    - coordination/goals/GOAL-MONO-001/batches/BATCH-44adf9/dispatch_queue.json
  read_scope:
    - coordination/goals/GOAL-MONO-001/review/TASK-20260930-40470a/
    - coordination/goals/GOAL-MONO-001/batches/BATCH-44adf9/
    - ledger/handoffs/TASK-20260930-40470a.yaml
    - ledger/handoffs/TASK-20260930-a72623.yaml
    - ledger/decisions/DEC-20260930-3a0b7b.yaml
    - coordination/review/mono-20260930-44adf9/review-plan.yaml
    - tools/research_dispatch.py
    - tools/validate_ledger.py
  read_scope_note: >-
    The review files are read to hash and stage them, not to interpret them.
    Nothing in them is quoted in a commit message, PR text or bus message
    before the composed decision is official.
  write_scope:
    - coordination/goals/GOAL-MONO-001/batches/BATCH-44adf9/archives/TASK-20260930-a72623/
  constraints:
    - >-
      RUNS ALONE. Start only after TASK-20260930-40470a has returned and its
      lane claim is released. No other BATCH-44adf9 card runs concurrently
      (queue max_concurrent 1). Zero runs.
    - >-
      Merge origin/main into the working branch first, and never rebase.
      Record base_commit_checked and merge_outcome in the receipt. A sync
      conflict inside a ledger record, run artifact or knowledge entry is
      never resolved by editing a record: stop and report. The resolution is
      a superseding record by Coordinator decision.
    - >-
      Stage exactly these four paths, one by one:
      coordination/goals/GOAL-MONO-001/review/TASK-20260930-40470a/review_report.md;
      coordination/goals/GOAL-MONO-001/review/TASK-20260930-40470a/s4_construction/computations.json;
      coordination/goals/GOAL-MONO-001/batches/BATCH-44adf9/archives/TASK-20260930-a72623/runtime-session-receipt.json;
      coordination/goals/GOAL-MONO-001/batches/BATCH-44adf9/archives/TASK-20260930-a72623/snapshot-receipt.json.
      git add -A, git add . and directory adds are forbidden. The queue file
      and claims/ files are NOT staged in this commit.
    - >-
      Any other file the reviewer wrote (under its write scope or outside
      it) is named in the receipt as a scope finding with its sha256 and is
      NOT staged. A file written outside
      coordination/goals/GOAL-MONO-001/review/TASK-20260930-40470a/ is also
      a custody finding. It goes to the composer as a disclosed procedure
      defect. It is not repaired by editing or deleting anything.
    - >-
      If review_report.md or s4_construction/computations.json is missing,
      stop: stage nothing and report. The review is then incomplete and goes
      back to the Coordinator. That is infrastructure or procedure signal,
      never a verdict (AGENTS.md core rule 5).
    - >-
      NEVER edit a review file while staging. A malformed file is committed
      as malformed and reported.
    - >-
      runtime-session-receipt.json is written by the top-level session from
      what the launched session reported. It records the subagent binding
      (validator-breakthrough), the requested policy (review-breakthrough),
      the served reasoning_effort, the resolved runtime and model identifier,
      fallback_used and its reason, model_verified, the claim epoch, the
      launch and return times as observed, and the DP-3 check output quoted
      verbatim. It must not estimate or fill in a field the runtime did not
      report: a missing field stays missing.
    - >-
      binding_mode commit. The commit must change exactly the four declared
      paths. path_sha256 is computed from the committed tree and filled into
      the queue's archive block in a later commit, together with commit_sha
      and parent_sha.
    - >-
      Run tools/validate_ledger.py before committing and record the result.
      Stop on any new error attributable to the staged paths.
    - >-
      The commit message names TASK-20260930-a72623 and every archive
      record_id literally (see deliverables). It states no verdict and quotes
      no review content. The same holds for the PR text.
    - >-
      Verify the receipt with tools/research_dispatch.py. A missing, dirty,
      malformed or scope-expanding commit blocks composition. It is an
      evidence-integrity failure, not a result.
    - >-
      Push the branch and open or refresh the PR against main naming the
      record ids, before TASK-20260930-e74f4c is launched.
    - >-
      Never amend, rebase or force-push.
  deliverables:
    - >-
      coordination/goals/GOAL-MONO-001/batches/BATCH-44adf9/archives/TASK-20260930-a72623/snapshot-receipt.json:
      commit_sha (null by convention inside the commit itself), parent_sha,
      base_commit_checked, merge_outcome, binding_mode commit, path_sha256 of
      the two review files and of runtime-session-receipt.json, record_ids,
      scope findings (or "none"), the validate_ledger.py outcome, and the
      research_dispatch.py verification outcome recorded after the commit.
    - >-
      coordination/goals/GOAL-MONO-001/batches/BATCH-44adf9/archives/TASK-20260930-a72623/runtime-session-receipt.json
      (top-level session, mechanical), as described in constraints.
    - >-
      One isolated commit whose message names TASK-20260930-a72623,
      TASK-20260930-40470a, REVIEW-MONO-20260930-40470a, BATCH-44adf9,
      GOAL-MONO-001 and DEC-20260930-3a0b7b. The branch is pushed and the PR
      opened or refreshed.
  artifact_paths:
    - coordination/goals/GOAL-MONO-001/batches/BATCH-44adf9/archives/TASK-20260930-a72623/snapshot-receipt.json
    - coordination/goals/GOAL-MONO-001/batches/BATCH-44adf9/archives/TASK-20260930-a72623/runtime-session-receipt.json
  archived_by: TASK-20260930-a72623   # SELF: an archive task archives itself.
