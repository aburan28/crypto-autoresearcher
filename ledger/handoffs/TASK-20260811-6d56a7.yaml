  axis: A5
  axis_title: >-
    Imported machinery: modular curves as the index-calculus surface, function-field analogues that already work, and the ordinary shadow of the quaternion method

  objective: >-
    Generate proposals built on OBJECTS THE DECOMPOSITION NEVER NAMES, imported
    deliberately from adjacent theories where an analogous problem is already
    better understood. Three concrete import channels, and you are not limited to
    them:

    (1) MODULAR CURVES AS THE SURFACE. Every idea in this campaign does index
    calculus, if at all, on the elliptic curve itself: factor bases of points,
    summation polynomials in x-coordinates. But the isogeny class is itself
    coordinatised by j-invariants satisfying the modular polynomial Phi_ell(j, j'),
    and Phi_ell is an explicit, computable, highly structured object. Is there an
    index calculus, or a relation-collection scheme, whose FACTOR BASE IS A SET OF
    j-INVARIANTS and whose relations are modular-polynomial incidences rather than
    point sums? What would such relations even compute -- the class-group action,
    the endomorphism ring, or nothing at all? Name what the relations solve for, or
    close the channel with the obstruction stated.

    (2) FUNCTION-FIELD AND DRINFELD ANALOGUES. Over function fields, and for
    Drinfeld modules, several analogues of these problems ARE tractable, sometimes
    subexponentially. That is a gift: it tells you exactly which structural
    ingredient does the work. Identify the ingredient, then determine PRECISELY
    WHICH STEP FAILS to transfer to a prime field F_p, and whether anything in the
    CM/endomorphism structure of an ordinary curve can substitute for it. "It does
    not transfer, and here is the exact step and why" is a complete and valuable
    deliverable.

    (3) THE ORDINARY SHADOW OF THE QUATERNION METHOD. The campaign's own exemplar,
    Wesolowski's p^{1/3+o(1)} result (full text at
    inputs/P13-WESOLOWSKI-2026/paper_fulltext.md), runs on the Deuring correspondence
    and maximal orders in a quaternion algebra -- the SUPERSINGULAR world. Ordinary
    prime-field curves have the commutative imaginary-quadratic order Cl(O) instead.
    Ask which specific structural feature the p^{1/3} argument consumes, and whether
    the commutative setting has any shadow of it, or whether commutativity is
    exactly what kills it. Again, a precise "commutativity kills it, here is the
    step" is a real result.

  uncertainty_reduced: >-
    Whether GOAL-ENDO-001 has a live path to a publication-grade result, or
    whether its fourteen-lane decomposition has already enumerated the reachable
    mechanisms and the remaining work is closure. The campaign has 146 committed
    proposals, a gating lane paused on instrument calibration at toy scale, and
    a documented convergence toward negatives. This axis tests one specific
    hypothesis about WHERE a live path could still be: that the lane structure
    is indexed by resource applied to a single curve's point group, and that
    objects outside that indexing have not been systematically generated. A
    well-argued finding that this axis is ALSO closed, with the obstruction
    named, reduces the same uncertainty and is an accepted deliverable.

  seed_note: >-
    Read the exemplar before proposing against it: docs/target-result-profile.md
    and inputs/P13-WESOLOWSKI-2026/paper_fulltext.md. Import means understanding the
    machinery well enough to say where it breaks, not name-dropping a theory.

