handoff:
  id: TASK-20260913-4df669
  recorded_at: '2026-09-13'
  from: coordinator
  to: executor
  goal_ids: [GOAL-SEMBIN-5078bc]
  batch_id: BATCH-9d649f
  authority: DEC-20260913-1a9c83
  objective: >
    Execute EXP-SEMBIN-354a75: measure, by exhaustive enumeration and never by
    solving or sampling, the realized decomposition yield of Semaev's chained
    S_3 system and of the single summation polynomial eq. (4) on the same target
    points, and report its ratio to eq. (11)'s prediction with a 95% interval
    per cell. Fix the SIGN of the bias eq. (11) puts into stage-1 relation cost.
  uncertainty_reduced: >
    Whether eq. (11) states the realized decomposition yield or an upper bound
    on it. The paper derives it inside P(first t-1 systems) >= P(n,m,t,k) >=
    P(solve eq. 5) and then assumes the right-hand relation is an equality; the
    probability sits in the DENOMINATOR of stage-1 cost in eqs. (15)-(17), so an
    upper bound substituted for the truth biases that cost downward. Also
    separates three readings of the 2^m-type discrepancy H-RELN-96e3ba reports
    against HEUR-SEMAEV-2015-4.3 at m = 2.
  inputs:
    - experiments/EXP-SEMBIN-354a75/specification.yaml
    - inputs/SEMAEV-2015-310/paper_fulltext.md
    - inputs/SEMAEV-2015-310/tables.yaml
    - knowledge/literature/KN-LIT-fa346d.md
    - knowledge/techniques/KN-TECH-b18366.md
    - ledger/hypotheses/H-SEMBIN-c5b2e0.yaml
  constraints:
    - >
      COUNT, NEVER SOLVE. No Groebner engine, no Macaulay matrix, no degree
      assumption. The contract's independence from Assumption 1 and Assumption 2
      is the reason it is runnable now and must not be spent.
    - >
      EXHAUSTIVE, NEVER SAMPLED, within a cell. A cell that does not fit its cap
      is recorded UNREACHED with the size of V^t it needed. Substituting
      sampling for enumeration in a cell that did not fit silently converts an
      unreached cell into a noisy measurement and is this experiment's principal
      false-positive route.
    - >
      Solutions whose y_i lie in F_{q^2} \ F_q are counted by the algebraic
      system and are NOT usable relations. Report them separately. A count that
      silently includes or silently excludes them is invalid, because the two
      conventions differ by exactly the quantity under measurement.
    - >
      Per-R counts are retained in full, not aggregated. The tail checks and the
      zero-decomposition fraction are unrecoverable from means, and the
      chained-minus-single comparison must be reported per R because a mean of
      zero is consistent with a chain that loses solutions on some R and gains
      on others.
    - >
      Do not add cells outside the declared window tk - n in [-6, +6] to
      strengthen a trend.
    - Observations only. Write no evidence record, move no hypothesis, and state
      no conclusion about any curve.
  deliverables:
    - per-R decomposition counts in full for both presentations
    - the zero-decomposition fraction per cell, reported separately from the mean
    - the Lemma-2 side-condition outcome and the F_{q^2}\F_q count per R
    - >
      measured ratio with 95% interval per cell, per presentation, per
      class-count variant
    - the Poisson fit, its goodness-of-fit statistic, and the fitted c(t)
    - all seven control outcomes
    - the four tail checks, including the m = t = 2 comparison against
      H-RELN-96e3ba stated either way
    - an explicit statement, either way, of whether HEUR-SEMAEV-2015-4.3 remains
      a sound comparator for EXP-RELN-164ad3
    - the sign of the bias entering stage-1 cost, with its derivation
  write_scope:
    - experiments/EXP-SEMBIN-354a75/code/
    - experiments/EXP-SEMBIN-354a75/runs/RUN-SEMBIN-1b9afe/
  artifact_paths:
    - experiments/EXP-SEMBIN-354a75/runs/RUN-SEMBIN-1b9afe/manifest.yaml
    - experiments/EXP-SEMBIN-354a75/runs/RUN-SEMBIN-1b9afe/raw-result.json
    - experiments/EXP-SEMBIN-354a75/runs/RUN-SEMBIN-1b9afe/per-R-counts.json
  archived_by: TASK-20260913-4df669
  archive:
    kind: snapshot
    source_task_ids: [TASK-20260913-4df669]
    commit_sha: null
    parent_sha: null
    record_ids: [RUN-SEMBIN-1b9afe]
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
    independent_session_note: >
      false for EXECUTION. Believing the result requires an independent round,
      which is a separate handoff; nothing produced here is evidence until then.
  budget:
    wall_clock_seconds: 3600
    memory_gb: 4
    maximum_runs: 200
  completion_gate:
    - eq. (11) reproduces the four published decimals, or the failure is
      reported as a procedure defect and the run stops
    - >
      the realized-random-map matched null returns ratio 1 within its interval;
      if it returns below 1 the pipeline is producing the effect itself and the
      whole run stops
    - >
      the known-false class count shifts the ratio by the expected t! factor,
      or the run is invalid
    - the exhaustiveness control shows order-independent per-R counts
    - >
      a measured ratio ABOVE 1 halts for diagnosis and is never reported as a
      finding, because it contradicts the paper's own inequality chain
    - every unreached cell recorded with the size of V^t it needed
    - no evidence record written and no hypothesis status changed
  return_format: >
    per-cell ratios with intervals, per-R counts retained, control outcomes, and
    the sign statement. No prose conclusion about the paper and no claim about
    any curve.
  review_plan: null
  review_plan_note: >
    null because this handoff dispatches PRODUCTION. A claim-changing review
    round over its output is a separate handoff and will carry its own plan.
