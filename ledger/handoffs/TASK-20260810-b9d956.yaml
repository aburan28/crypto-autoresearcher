handoff:
  id: TASK-20260810-b9d956
  recorded_at: '2026-08-10'
  goal_id: GOAL-MD5-001
  question_id: RQ-MDFIVE-6870c1
  batch_id: BATCH-46254b
  task_card: coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/task-cards/TASK-20260810-b9d956.md
  role: red-team
  from: coordinator
  to: red-team
  objective: >-
    ATTACK BCP-1. Find every way a calibration run could pass its blind-scoring
    rule without having searched: leakage routes the firewall does not close,
    scoring rules that reward recall, invalidity conditions that a determined or
    merely careless agent can satisfy while consuming the answer, and charging
    conventions that make a cheap run look like an expensive one. The target is
    the protocol, not MD5.
  uncertainty_reduced: >-
    Whether BCP-1's blindness guarantee is real, partial, or ceremonial. This is
    cheap to learn now and catastrophic to learn later: a protocol that fails
    before any calibration is run costs one review, while a protocol that fails
    afterwards invalidates the calibration and everything the five dependent
    goals priced on it.
  inputs:
    - >-
      BCP-1 as committed by TASK-20260810-927ab5, which is the primary target
    - >-
      the BATCH-46254b contamination_firewall block, whose claimed resolution
      should be attacked rather than accepted
    - >-
      RQ-MDFIVE-6870c1 blindness constraint, which is the requirement BCP-1
      claims to implement
    - >-
      docs/inventor-protocol.md controls-before-belief clause, against which the
      null-object control should be judged sufficient or insufficient
    - >-
      harness/runner.py, to test whether the manifest fields BCP-1 relies on can
      actually be produced
  constraints:
    - >-
      SC-1 FABRICATE NOTHING. No invented timing, measurement, throughput,
      citation, review verdict, model identifier or commit SHA. A field that is
      not yet knowable stays null and is named as such.
    - >-
      SC-2 CLAIM CEILING. Assert nothing about MD5 - no collision, no preimage,
      no complexity, no method ceiling, no obstruction, and no comparison
      against any published result in either direction. Attacking a protocol is
      not a claim about the primitive.
    - >-
      SC-3 UNVERIFIED FIGURES STAY MARKED. Every figure not obtained in primary
      text stays marked unverified and is never cited as authority in either
      direction.
    - >-
      SC-4 A failed, halted or exhausted search is a BUDGET OUTCOME about a
      solver and NEVER evidence about MD5 (AGENTS.md rules 5 and 8).
    - >-
      SC-5 Anything not attempted is named OPEN AND UNATTEMPTED and is never
      recorded as tried, screened or negative. An attack route you did not test
      is a hypothesis about the protocol, labelled as one.
    - >-
      SC-6 Change no hypothesis, question, experiment or goal status; approve no
      experiment; promote no knowledge; edit no committed record. Report
      objections; the disposition is the Coordinator's.
    - >-
      SC-7 Halt at the declared wall_clock_seconds and report the halt
      truthfully as infrastructure signal, naming the dropped work as scope
      rather than as an answer.
    - >-
      SC-8 Never select, configure, probe, contact or use Amazon Bedrock
      (AGENTS.md rule 16).
    - >-
      ATTACK AT LEAST THESE FIVE SURFACES, and say for each whether the attack
      succeeds, fails, or is untested: (i) LEAKAGE - can the quarantined payload
      reach a calibration run through corpus staging, git history, a
      search_knowledge result, a prior session transcript, a diff, or a PR body?
      (ii) SCORING - can a run that recalls the published path satisfy the
      rediscovery rule, and does the rule distinguish rediscovering a path from
      recognising one? (iii) THE INPUT MANIFEST - is it actually complete, or
      does it cover only what the wrapper chose to hash? (iv) CHARGING - can the
      declared clock be gamed by moving work outside the measured window, or by
      reporting compute-only time against an authoring-inclusive budget? (v) THE
      NULL-OBJECT CONTROL - does a permuted-constant MD5 variant really
      neutralise recall, or does it also destroy the structure the search needs,
      making the control uninformative in both directions?
    - >-
      JUDGE THE RESIDUAL-RISK STATEMENT ITSELF. The batch record concedes that
      model prior knowledge is irreducible and that a successful calibration is
      therefore confounded. Attack that concession in both directions: is it too
      pessimistic, so that a real success would be undersold, or too optimistic,
      so that BCP-1 still lets a confounded success be recorded as a pass?
    - >-
      PREMATURE CLOSURE IS A FAILURE MODE SYMMETRIC WITH OVERCLAIMING. If the
      conclusion is that blind calibration is unachievable here, that needs a
      named obstruction and an argument, not a count of leakage routes. A tally
      of holes is a fatigue report and its honest status is unverified.
    - Write only under this task's review directory.
  deliverables:
    - >-
      red-team-report.yaml with one entry per attack surface, each marked
      succeeded, failed, or untested, with its basis
    - >-
      an explicit verdict on whether BCP-1's blindness guarantee is real,
      partial, or ceremonial, with reasons
    - a judgement on the residual-risk concession in both directions
    - >-
      concrete amendments BCP-1 would need, ranked by how much of the guarantee
      each recovers
  artifact_paths:
    - >-
      coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/reviews/TASK-20260810-b9d956/red-team-report.yaml
  archived_by: TASK-20260810-ccfeb4
  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 350
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
    - >-
      All five named attack surfaces are addressed, each marked succeeded,
      failed, or untested, and no untested route is presented as closed.
    - The verdict on BCP-1's blindness guarantee is explicit and reasoned.
    - >-
      The residual-risk concession is judged in both directions rather than
      merely echoed.
    - >-
      Any claim that blind calibration is unachievable here carries a named
      obstruction and an argument, not a tally.
    - >-
      Proposed amendments are concrete and ranked, and nothing was written
      outside this task's review directory.
  return_format: >-
    A summary naming the single written path, one line per attack surface marked
    succeeded, failed or untested with its basis, the explicit real/partial/
    ceremonial verdict on BCP-1's blindness guarantee with reasons, the
    two-directional judgement on the residual-risk concession including whether
    the permuted-constant null-object control discriminates at all, and the
    ranked list of concrete amendments.
