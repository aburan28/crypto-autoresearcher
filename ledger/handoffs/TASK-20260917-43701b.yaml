    blindness:
      mutual: true
      lifted_for: []
      rationale: >-
        Not lifted. All three reviewers run in independent sessions and may not
        read each other's reports in this round. The blind re-derivation
        (TASK-20260917-5fa7d5) carries a STRICTER condition than mutual
        blindness and is specified separately under `blind_rederivation`: it is
        blind not only to its siblings but to the producer's artifacts and to
        the pre-registered values. A later hardening round may legitimately lift
        blindness; that would be a new plan with `lifted_for` populated and a
        rationale, never a drift out of this one.

    proves_too_much:
      objects:
        - >-
          FAMILY 1 -- n' DIVIDES n (Diem's subfield family), where the
          conclusion of (B) is KNOWN FALSE: a subfield polynomial with d = 1
          splits completely with N = p^{n'} and beta arbitrarily small. At
          n = 131 that is n' in {1, 131}. The executable analogue already in the
          run set is control C1, (n, n', lambda) = (12, 6, X), forced N = 64.
          Extend it: (8, 4, X), (9, 3, X), (12, 4, X), (12, 3, X) and at least
          one with d > 1, e.g. (12, 6, X^2).
        - >-
          FAMILY 2 -- THE LINEARIZED FAMILY OF KN-LIT-4fe9d2 THEOREM 1, where
          beta >= 3/4 is ALREADY KNOWN. Any argument here that proves something
          STRONGER than the literature on the literature's own slice is far more
          likely wrong than novel. Include Theorem 1's equality case
          X^{p^2} + X^p + X over F_{p^3} (control C4, forced N = 4 at p = 2) and
          Type 2 at n = 7 (control C2, forced N = 8) and at n = 31 (control C3,
          forced N = 32768).
      failure_signature: >-
        FAMILY 1: the derivation of (A) must become VACUOUS, not merely
        satisfied. At r = 0 the bound reads max(d^{q+1}, p^{n'}) >= p^{n'} =
        deg L, which carries no information -- that is why Diem's family is
        untouched. THE ARGUMENT HAS PROVED TOO MUCH IF, AT r = 0, THE DERIVATION
        STILL YIELDS A BOUND STRICTLY BELOW p^{n'}, because those objects
        demonstrably reach p^{n'}. Two things must be checked and they are
        different: (i) that the bound is vacuous at r = 0, and (ii) that the
        vacuity is a CONSEQUENCE of the derivation rather than an accident of
        arithmetic -- i.e. trace every step of (A) and (B) and confirm whether
        r >= 1 is USED where it is needed and not silently assumed where it is
        not. (B) states r >= 1 as a hypothesis; verify (A) does not, since (A)
        is claimed for r = 0 too, vacuously.
        FAMILY 2: the argument must NOT yield a bound on the linearized slice
        that contradicts, or improperly strengthens, Theorem 1. Note this is
        genuinely two-sided and the reviewer must resolve which side each cell
        is on: (B) gives 7/9 = 0.778 at (7,3) and 11/12 = 0.917 at (11,6), both
        ABOVE Theorem 1's 3/4, but 31/45 = 0.689 at (31,15), BELOW it. Where (B)
        is stronger, hunt the literature and the run data for a linearized
        complete splitter with beta strictly between n/(n + n' - r) and 3/4 --
        such an object would refute (B) while satisfying Theorem 1. Where (B) is
        weaker, confirm no claim of improvement is made. THE ARGUMENT HAS PROVED
        TOO MUCH IF IT DERIVES beta >= 3/4 GENERALLY, since that is Theorem 1's
        result and (B) is not restricted to linearized lambda.
        For both families: the four forced fixtures C1-C4 already returned
        (64, 8, 32768, 4). Do not re-report that. The question is not whether
        the counts are right; it is whether the ARGUMENT behaves correctly on
        objects where its conclusion must fail.
      assigned_to: TASK-20260917-52b4e6

    blind_rederivation:
      required: true
      quantity: >-
        THE STATEMENT ONLY. Over the field K = F_2[z]/(z^131 + z^13 + z^2 + z +
        1), for each lambda in F_2[X] of exact degree d in {3, 4, 5, 6, 7} that
        is NOT linearized (a linearized polynomial over F_2 is one all of whose
        monomials have exponent a power of 2, X^{2^i}), set
        L = X^{2^{33}} - lambda(X) and let N(lambda) be the number of DISTINCT
        roots of L lying in K. Report: (1) the maximum of N(lambda) over that
        candidate set; (2) every lambda attaining the maximum, written both as a
        bit-packed integer and as a printed polynomial; (3) the complete
        histogram of N(lambda) over the candidate set, and the size of that
        candidate set as you derive it; (4) for each attaining lambda, the
        decomposition of its root set into orbits under the 2-Frobenius
        x -> x^2, giving the orbit sizes; (5) for each attaining lambda, the
        explicit root list as F_2 coefficient vectors of length 131, together
        with your OWN independent re-verification that each listed x satisfies
        x^{2^{33}} = lambda(x) in K and that the listed roots are pairwise
        distinct.
      quantity_note: >-
        NO VALUE, NO CANDIDATE NAME, NO ORBIT SHAPE AND NO HISTOGRAM IS GIVEN
        ABOVE, DELIBERATELY. The producer's answer, the pre-registered answer,
        and the number of attaining candidates are all withheld. A re-derivation
        handed the answer is a confirmation exercise and tells the program
        nothing.
      why_this_quantity: >-
        It is the only load-bearing quantity measured at the ACTUAL TARGET FIELD
        of RQ-QSP-f9bbdb; it is the one an implementation bug would most
        plausibly fake, because at n = 131 it was produced by a single
        instrument with no cross-check and a root re-verifier that can only
        detect false positives; and its shape is anomalous and unexplained --
        the execution report flags under `anomalies` that the attaining
        candidates share properties it does not account for. A quantity that is
        simultaneously single-instrument, target-scale, and anomalous is exactly
        where an independent re-derivation earns its cost. I considered instead
        re-deriving the Stage 1 M1 values, and rejected that: Stage 1 already
        carries an independent brute-enumeration instrument, so re-deriving
        there would buy a third opinion where two already exist while leaving
        the single-instrument cell unchecked.
      parameters:
        field_polynomial: z^131 + z^13 + z^2 + z + 1
        field: F_2[z]/(z^131 + z^13 + z^2 + z + 1)
        n: 131
        n_prime: 33
        L: X^{2^33} - lambda(X)
        lambda_family: >-
          every NON-LINEARIZED lambda in F_2[X] of exact degree d, for d = 3, 4,
          5, 6, 7. Derive the size of this set yourself; it is not given.
        count: DISTINCT roots of L in K
      blind_from:
        - experiments/EXP-QSP-33b442/implementation/**
        - experiments/EXP-QSP-33b442/runs/**
        - experiments/EXP-QSP-33b442/execution-report.yaml
        - analysis/qsp-ecc2k130/**
        - experiments/EXP-QSP-33b442/specification.yaml
        - ledger/hypotheses/H-QSP-5540d7.yaml
        - experiments/EXP-QSP-33b442/amendments/**
        - ledger/corrections/CORR-20260917-8b80cc.yaml
        - ledger/handoffs/TASK-20260917-43701b.yaml
        - ledger/proposals/IDEA-20260916-5c9d6e.yaml
        - coordination/bus/messages/MSG-20260917-97a8d4.yaml
        - coordination/bus/messages/MSG-20260916-945e58.yaml
        - the reports of TASK-20260917-34b637 and TASK-20260917-52b4e6
      blind_from_note: >-
        THE LAST FOUR ENTRIES OF THE FIRST GROUP ARE THE ONES A DISPATCHER WILL
        BE TEMPTED TO OMIT, AND OMITTING THEM DESTROYS THE ROUND.
        specification.yaml is not merely the contract: its
        `preregistered_prediction.formula` field STATES THE ANSWER IN FULL --
        the maximum, the histogram, and all four attaining candidates by name.
        ledger/hypotheses/H-QSP-5540d7.yaml repeats the same values under
        `predictions` M4. THIS CARD ITSELF names figures in the coordinator
        prior and in joints J4 and J5. A re-deriver that reads any of them is
        not blind and its agreement is worthless. The re-deriver receives the
        `quantity` and `parameters` blocks above, transcribed into its own card,
        AND NOTHING ELSE FROM THIS EXPERIMENT.
      inference_note: >-
        TASK-20260917-5fa7d5 does NOT inherit this card's `review-breakthrough`
        block, and the departure is deliberate rather than an oversight. A blind
        re-derivation is an IMPLEMENTATION task -- build GF(2^131) arithmetic,
        twisted iterates, a gcd against X^{2^131} - X, root extraction and
        Frobenius orbits, from a statement -- not an adversarial judgement.
        Dispatch it as `executor-implementation` with `reasoning_effort: high`
        (raised above the policy default because a subtle arithmetic bug yields
        a confidently wrong number that would then be read as a disagreement
        about the mathematics), `independent_session_required: true`,
        `fallback_allowed: false`, `degraded_allowed: false`. This does not
        downgrade the round: AGENTS.md rule 12 binds the REVIEW of the claim,
        which is J1-J6 and the proves-too-much control, and both of those run at
        `review-breakthrough`/`max`. If a dispatcher judges otherwise, it may
        run this at `review-breakthrough` too -- the cost is tokens, not
        integrity -- but it may NOT run the other two below it.
      assigned_to: TASK-20260917-5fa7d5
      interpretation_rule: >-
        Fixed in advance so it cannot be chosen after the fact. AGREEMENT is
        evidence about the QUANTITY, and is the only evidence at n = 131 that
        does not pass through the producer's single instrument. DISAGREEMENT is
        NOT a refutation of H-QSP-5540d7 and must not be reported as one: it
        localises to one of two named implementations, and the next step is to
        find which, by hand, on the smallest disagreeing candidate. A
        disagreement in which the re-deriver finds MORE roots than the producer
        is the serious case, because that is the direction that could turn
        `N <= bound` into a violation; a disagreement in which it finds fewer is
        most likely a bug in the re-derivation. Either way, neither report is
        preferred by default and neither is adjusted to match the other.

