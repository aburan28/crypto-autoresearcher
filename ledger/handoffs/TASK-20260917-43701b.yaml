  dispatch_preconditions:
    - id: DP-1
      condition: >-
        `archived_by` on THIS card is bound to an existing archival TASK-* card
        before any reviewer is launched. Dispatch with `archived_by` null is
        FORBIDDEN (AGENTS.md standing precondition 1; CORR-20260915-6708e4).
    - id: DP-2
      condition: >-
        The declared inputs are COMMITTED AND PUSHED. The snapshot archive of
        the run package has run alone, its receipt's path_sha256 matches the
        tree for every declared path, the post-commit verifier has accepted the
        commit, and the branch is pushed with an open PR against main. A
        reviewer reading a run package that exists only in a dirty worktree is
        reading something no later reader can reproduce.
    - id: DP-3
      condition: >-
        origin/main has been fetched and merged (never rebased) into the working
        branch before the archive commit, with the base commit and merge outcome
        recorded in the receipt.
    - id: DP-4
      condition: >-
        `python3 -m orchestration.adapter doctor --probe` confirms a backend
        that serves `review-breakthrough` at `max`. IF IT CANNOT, DO NOT
        DISPATCH AT A LOWER TIER AND DO NOT SUBSTITUTE `validator` FOR
        `validator-breakthrough`. Record the impediment on the campaign, leave
        the CLAIM un-promoted, and report. `review-breakthrough` is
        `degradable: false` and this is the exact silent downgrade the policy
        layer forbids.
    - id: DP-5
      condition: >-
        The three reviewer cards are created with NON-OVERLAPPING write scopes,
        each under its own task directory, and each in its own independent
        session. Two reviewers sharing a write scope is two reviewers sharing a
        worktree.
    - id: DP-6
      condition: >-
        TASK-20260917-5fa7d5's card contains the `blind_rederivation.quantity`
        and `.parameters` blocks transcribed verbatim and NOTHING ELSE FROM THIS
        EXPERIMENT -- not this card, not the contract, not the hypothesis, not
        the run package. Handing it this card's `inputs` list, or this card
        itself, destroys the blindness before the round starts. This precondition
        is the single most fragile thing in the plan.
    - id: DP-7
      condition: >-
        The remediation of CORR-20260917-8b80cc is DISPATCHED (it need not have
        completed): reviewers should read the run package knowing the fifteen
        schema errors are classified, routed, and disclosed, so they attack the
        mathematics rather than re-deriving the bookkeeping. It is NOT a
        blocker for the review round, but it IS a blocker for the ledger archive
        that would follow it.

  what_this_card_does_not_do:
