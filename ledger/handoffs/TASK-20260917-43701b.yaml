handoff:
  id: TASK-20260917-43701b
  from: coordinator
  to: coordinator
  to_note: >-
    THIS CARD OPENS THE ROUND; IT DOES NOT ITSELF LAUNCH A REVIEWER. It carries
    the `review_plan` that AGENTS.md "Review architecture" and
    experiments/EXP-QSP-33b442/specification.yaml claim_tier_note require to
    exist BEFORE any reviewer runs. The three reviewer cards it names --
    TASK-20260917-34b637 (validator-breakthrough), TASK-20260917-52b4e6
    (red-team-breakthrough) and TASK-20260917-5fa7d5 (blind re-derivation) --
    are created and dispatched by the dispatching session from the joint
    assignments below. Each of those cards carries its own inference block,
    write scope, budget and completion gate; this card carries the plan they are
    all bound to.
  recorded_at: '2026-09-17'
  goal_id: null
  goal_id_note: >-
    RQ-QSP-f9bbdb is not attached to a goal head; recorded as a fact, not an
    omission (same basis as TASK-20260917-892420 DP-4).
  question_id: RQ-QSP-f9bbdb
  experiment_id: EXP-QSP-33b442
  hypothesis_id: H-QSP-5540d7
  kind: review_round_opening

  objective: >-
    Open the independent review round that is the only route by which
    H-QSP-5540d7 could be promoted on the strength of EXP-QSP-33b442, and fix --
    before any reviewer sees anything -- what the claim is, what the Coordinator
    expects the round to find, which load-bearing steps are attacked, by whom,
    and with what worked attack. The round must route to `review-breakthrough`
    at `max` effort: specification.yaml claim_tier_note states that a supported
    outcome here is a CLOSURE OF A RESEARCH LINE UNDER A STATED COST MODEL,
    which falls under AGENTS.md rule 12, and that policy is `degradable: false`.
    If `max` cannot be served on any available backend, the round does not run
    at a lower tier: the CLAIM stays un-promoted and the campaign stays active
    with the impediment recorded (AGENTS.md "Goals are never paused", item 2).

  uncertainty_reduced: >-
    Whether the derivation-tier bound (A) and its corollary (B) survive
    adversarial attack at their load-bearing joints, and -- separately, because
    they are separate questions and the round must not be allowed to blur them
    -- whether the closure reading (E) is promotable at all given that its
    heuristic H1 carries `validation_experiment_ids: []` and a blocked
    validation route. Before this round the program has a three-line argument, a
    reproduced set of pre-registered numbers, and a producer who stated no
    verdict. After it, the program has either a located break or a claim whose
    survival was measured against attacks named in advance.

  inputs:
    - experiments/EXP-QSP-33b442/specification.yaml
    - experiments/EXP-QSP-33b442/execution-report.yaml
    - experiments/EXP-QSP-33b442/runs/ (all eight run directories, their manifests, raw results, per-cell JSON and the 546 Stage 3 certificates)
    - experiments/EXP-QSP-33b442/implementation/
    - experiments/EXP-QSP-33b442/amendments/AMD-20260917-001-i3-feasibility-cap.yaml
    - experiments/EXP-QSP-33b442/amendments/v2.yaml
    - ledger/hypotheses/H-QSP-5540d7.yaml
    - ledger/questions/RQ-QSP-f9bbdb.yaml
    - ledger/proposals/IDEA-20260916-5c9d6e.yaml
    - ledger/decisions/DEC-20260917-73c49a.yaml
    - ledger/corrections/CORR-20260916-8d0b81.yaml
    - ledger/corrections/CORR-20260917-8b80cc.yaml
    - knowledge/literature/KN-LIT-0a321c.md
    - knowledge/literature/KN-LIT-4fe9d2.md
    - inputs/HUANG-2020-JMC-QSP/paper_fulltext.md
    - inputs/EULER-PETIT-2019-QSP/paper_fulltext.md
    - docs/target-result-profile.md
    - docs/claims-and-verification.md
  inputs_note: >-
    THE BLIND RE-DERIVER (TASK-20260917-5fa7d5) DOES NOT RECEIVE THIS INPUT
    LIST. Its inputs are exactly the quantity statement and the parameters in
    `review_plan.blind_rederivation`, and its forbidden set is
    `blind_rederivation.blind_from`, which includes several records on the list
    above. A dispatcher that hands it this card's `inputs` has destroyed the
    blindness before the round starts.

  constraints:
    - >-
      THE PLAN BELOW IS FIXED BEFORE ANY REVIEWER RUNS AND IS NOT EDITED
      AFTERWARDS. A prior written once the answer is known is not a prior. If
      the round departs from this plan -- a joint reassigned, a control dropped,
      a reviewer acting before a sibling's report returns, blindness lifted --
      the departure is appended to `review_plan.procedure_deviations` on a NEW
      record that supersedes this one, never edited into this card.
    - >-
      EACH REVIEWER REPORTS ON ITS OWN JOINTS, NOT ON THE CLAIM. A blinded
      reviewer cannot see the other joints by construction, so a whole-claim
      verdict from one is an opinion formed from a fraction of the evidence.
      Every report carries the `review_attestation` block of
      templates/research-records.md with `joints_owned`, `sources_read` read
      honestly and completely, `read_sibling_reports`, and a per-joint verdict
      of holds | breaks | inconclusive. The Coordinator composes.
    - >-
      NO REVIEWER CHANGES ANY LEDGER RECORD. No hypothesis status, no evidence
      record, no decision, no knowledge promotion. Reports go under the
      reviewer's own task directory in its assigned write scope.
    - >-
      INFRASTRUCTURE IS NOT EVIDENCE. If a reviewer's own verification code
      times out, crashes, or cannot be built for want of an engine, that is
      reported as an infrastructure outcome and never as a break of the joint
      (AGENTS.md rule 3). A joint the reviewer could not attack is
      `inconclusive` with the impediment named, which is a useful and honest
      result; a joint reported as `holds` because the attack could not be built
      is not.
    - >-
      THE ANALYSIS JSONs UNDER analysis/qsp-ecc2k130/explore/ ARE CONTEXT AND
      ARE FORBIDDEN AS RESULTS by the contract's own invalidation rule. A
      reviewer may read them to check the pre-registration story; a reviewer may
      not cite them as measurements, and must not treat agreement between a run
      value and an explore.json value as independent corroboration -- the
      contract pre-registered those values, so agreement is reproduction of a
      pre-registered number and is reported as that.
    - >-
      THE RUN SET CARRIES FIFTEEN LEDGER-SCHEMA ERRORS, ALL RECORD-LEVEL AND
      NONE ON A MEASUREMENT-BEARING RUN, with the remediation route and the
      five-error disclosed residue recorded in CORR-20260917-8b80cc. Reviewers
      read that record and are not required to re-litigate it. They ARE required
      to say if they think the classification "record-schema defect, no
      measurement touched" is wrong.

  deliverables:
    - The three reviewer cards created from the joint assignments below, each naming its joints verbatim from this plan.
    - One review report per reviewer under its own task directory, each carrying the templates/research-records.md `review_attestation` block.
    - The blind re-derivation's independently produced quantity, with its own re-verified root-list certificates, and its declared `sources_read` for checking against `blind_from`.
    - The Coordinator's composition of the three reports, written after all three return, naming per joint which reviewer owned it and what it returned.
  artifact_paths:
    - ledger/handoffs/TASK-20260917-43701b.yaml
  archived_by: TASK-20260917-5b9153
  archived_by_note: >-
    DELIBERATELY NULL AND THIS CARD MAY NOT BE DISPATCHED UNTIL IT IS BOUND.
    AGENTS.md standing dispatch precondition 1 requires exactly one archival task
    to own a deliverable before any agent writes it; dispatching with
    `archived_by` null was the violation recorded in CORR-20260915-6708e4, caught
    by the dispatched agent rather than the dispatcher. The authoring session had
    no shell and could not mint an archival TASK id with
    `python3 tools/allocate_id.py --next task --date 20260917`, so the field is
    left null and flagged rather than filled with an unconfirmed identifier.
    Bind it, and do not edit this card afterwards to make a past dispatch look
    compliant.

  inference:
    policy: review-breakthrough
    reasoning_effort: max
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
    policy_basis: >-
      AGENTS.md rule 12 and specification.yaml claim_tier_note. A supported
      outcome is a closure result under a stated cost model. `review-breakthrough`
      is the one policy that may never be degraded and refuses a backend that
      cannot reach `max`. Substituting `validator` for `validator-breakthrough`
      to get the claim moving is the exact silent downgrade the policy layer
      forbids.
    per_reviewer_note: >-
      TASK-20260917-34b637 and TASK-20260917-52b4e6 inherit this block exactly.
      TASK-20260917-5fa7d5 does NOT: see `review_plan.blind_rederivation.
      inference_note` for why, and for what it takes instead.

  budget:
    wall_clock_seconds: 3600
    memory_gb: 4
    maximum_runs: 0
  budget_note: >-
    THIS CARD RUNS NOTHING: it opens a round and dispatches, so `maximum_runs` is
    0 rather than null. Every field is filled because a handoff with a null
    budget field is rejected by the Coordinator contract. The reviewers' own
    budgets go on their own cards; the indicative sizing the dispatcher should
    use is wall_clock_seconds 7200, memory_gb 4, maximum_runs 4 for each of
    34b637 and 52b4e6 (they build and run counterexample searches), and
    wall_clock_seconds 7200, memory_gb 4, maximum_runs 3 for 5fa7d5 (the n = 131
    computation it must reproduce cost the producer 143.8 s and 52 MB, so the
    envelope is generous by an order of magnitude and the memory cap is machine
    protection, not a research budget).

  completion_gate:
    - All three reviewer cards exist, each naming its joints verbatim from this plan, each with a bound `archived_by`, and each dispatched into its own independent session.
    - Every joint J1-J6 has exactly one owner and every owner has returned a per-joint verdict. An unowned or unreturned joint blocks composition; it is not absorbed into an adjacent verdict.
    - The proves-too-much control has been run against BOTH named object families and its failure signature reported for each.
    - The blind re-derivation has returned, its report declares `sources_read`, and `blind_from_respected` is true. If any path in `blind_from` was read, the re-derivation is reported as a REPLICATION and loses its status as a blind check; that is recorded, not repaired.
    - '`python3 tools/check_review_independence.py` accepts the composition: every joint owned, every assigned reviewer attested, no undeclared sibling reads, no re-deriver whose declared sources intersect `blind_from`.'
    - The Coordinator's composition names, per joint, what was attacked, what was found, and what remains unattacked.

  return_format: >-
    Per reviewer: (1) the `review_attestation` block; (2) per owned joint, a
    verdict of holds | breaks | inconclusive with the artifact that supports it
    -- for `breaks`, the `breaking_artifact` named in the plan, produced, not
    described; (3) what the reviewer attacked and could NOT break, stated, since
    a failed attack named in advance is evidence and an unstated one is not;
    (4) anything found outside the assigned joints, reported separately and
    flagged as out-of-scope so the Coordinator does not read it as coverage;
    (5) an explicit statement of what the reviewer did not do.

  review_plan:
    claim_under_review: >-
      AS ITS PRODUCER STATED IT, WHICH REQUIRES A NOTE, BECAUSE THE PRODUCER
      STATED NO VERDICT AT ALL. experiments/EXP-QSP-33b442/execution-report.yaml
      observations.interpretation reads: "NONE OFFERED. Whether these
      observations support, weaken or refute H-QSP-5540d7 is a Coordinator
      decision on a later review round... The Executor states no verdict." That
      refusal is correct and is honoured here: there is no producer claim to
      quote.

      What is therefore put under review is the CONTRACT'S OWN success-criterion
      headline -- the sentence the frozen protocol pre-registered as the honest
      claim if and only if all five of S1-S5 hold -- quoted verbatim from
      experiments/EXP-QSP-33b442/specification.yaml success_criterion:

        "H-QSP-5540d7 is SUPPORTED AT DERIVATION TIER PENDING INDEPENDENT REVIEW
        -- a checkable argument, 1260 exhaustive toy candidates under three
        agreeing instruments, 65 complete splitters none below the corollary,
        and 732 certificate-bearing exact counts at n = 131 -- which proves
        nothing about any deployed curve, moves no attack exponent, and leaves
        the closure reading (E) conditional on the unvalidated H1."

      THIS IS THE CLAIM THAT WOULD BE MADE IF THE ROUND READS THE RESULT AS
      SUPPORTING, AND THAT IS WHAT IS BEING DONE HERE: the Coordinator is
      putting a conditional claim to the reviewers, not asserting it. The
      conditional is not idle -- the run reports every pre-registered value
      reproduced and no falsification branch reached, so S1-S5 are on their face
      met, and the round exists to find out whether "on their face" survives.

      Two riders bind every reviewer, both taken from the contract rather than
      added here. First, the headline's own last clause: the closure reading (E)
      stays CONDITIONAL whatever this experiment returns, because H1 is not
      tested here and cannot be (heuristic_under_test_note). Second, the scope:
      the derivation is quantified over all p but EVERY numerical cell is p = 2,
      and the n = 131 census certifies exactly 732 named F_2-coefficient
      polynomials of degree 3..7 -- every other lambda at those n' is covered by
      a derivation, not by a list.

    coordinator_prior: >-
      WRITTEN 2026-09-17, BEFORE ANY REVIEWER RAN, AND NOT BLIND. I must say the
      uncomfortable part first, because a prior that hides its contamination is
      worth nothing. I HAVE ALREADY READ THE EXECUTOR'S HEADLINE NUMBERS. I know
      that every pre-registered exact value is reported as reproduced, that
      M2 = 0 over 1260 candidates, that M6 = (64, 8, 32768, 4), that 0 of 65
      complete splitters fall below the corollary, and that no falsification
      branch F0-F6 was reached. I have gone further and recomputed several of
      those figures myself from the raw per-candidate rows -- the n' = 33
      histogram counted row by row, the four N = 132 candidates decoded from
      their bit patterns, the beta arithmetic at (7,3), (7,4) and (31,5) by hand
      -- and they reproduced. So my prior is anchored to the outcome, and
      agreement between me and the reviewers on the headline is close to
      worthless as evidence. What the program needs from me is not my
      expectation that the numbers are right. It is a record, made in advance,
      of WHERE I THINK THIS BREAKS.

      Where I expect it to break, with probabilities I am willing to be judged
      against:

      1. J2, THE DEGENERATE CASE -- 0.70 that the reviewer confirms a defect I
      found while writing this plan, and which is stated nowhere in the
      contract, the amendment or the execution report. Every cell reports "0
      degenerate candidates". That is not an observation: the degenerate case
      needs d = p^j with j(q+1) = n' - r, and evaluating that at all eight cells
      gives 3j = 2, 2j = 1, 2j = 1, 3j = 1, 3j = 2, 4j = 1, 3j = 1, 2j = 1 --
      not one integer solution. NO CELL IN THIS EXPERIMENT CAN PRODUCE A
      DEGENERATE CANDIDATE. So the degenerate-detection instrument returned no
      positive on any of 3192 candidates because it could not, and the branch
      that carries the whole of corollary (B) has no measurement behind it. I
      put 0.70 on the reviewer confirming this, 0.05 on it escalating into an
      actual error in the characterisation itself, and I expect the honest
      outcome to be a narrowed claim rather than a broken one.

      2. J4, INSTRUMENT INDEPENDENCE -- 0.65 that the reviewer establishes that
      "three agreeing instruments" overstates the redundancy, and this is the
      joint where I most expect the round to cost the claim something. I2 and I3
      both reduce to a repeated-squaring-mod plus a gcd over the same bit-packed
      GF(2)[X] primitives; a bug there corrupts both identically and M2 still
      reads 0 for that pair. The real independence in Stage 1 is two-fold, I1
      against the shared gcd path, not three-fold. Worse at n = 131, where I1
      and I2 are infeasible and ONLY I3 ran: its sole check is the wrapper's
      root re-verification, which confirms that listed roots ARE roots and
      cannot detect a MISSED root -- and missing roots lowers N, which is the
      direction that makes the bound look satisfied. The certificate
      architecture verifies only in the direction that favours the hypothesis. I
      put 0.08 on the reviewer actually turning up an I3 undercount.

      3. J6, THE CLOSURE READING (E) -- 0.60 that the red team reports (E) is
      not promotable at all, and I expect that report to be right. H1 carries
      `validation_experiment_ids: []` and its route IDEA-20260916-b84e2d is
      blocked by a recorded engine impediment, so promotion gate (2) in
      agents/coordinator.md -- every conditional dependence with archived
      validation evidence or a scheduled validation experiment -- is not
      satisfied by a route that is scheduled and blocked. I also expect the
      reviewer to notice that (E)'s robustness is much weaker than its rhetoric:
      the closure needs only kappa >= 0.992, not Rojas' 4.876, and the
      hypothesis's own assumptions block already concedes that a solver whose
      cost does not grow with d is NOT excluded by (E).

      4. J3, SCOPE -- 0.40 that the reviewer finds the quantifier "for every n'
      not dividing n" is not the scope the argument supports. With n' > 2n one
      gets q = 0 and beta >= n/n' < 1/2, so the headline "beta > 1/2" needs
      n' < n, which the QSP setting supplies but the statement does not say.
      Harmless to fix, embarrassing to ship.

      5. J1, THE DERIVATION OF (A) -- 0.02 that a certified counterexample
      appears. I re-derived (q+1)n' = qn' + n' = n + (n' - r) myself and it is
      an identity; the Frobenius bookkeeping is three lines and I believe it.
      The undefended flank is not the algebra but p: every numerical cell is
      p = 2 and the transfer to general p is by derivation alone, which the
      contract declares openly. A p = 3 sweep is the cheapest missing datum in
      the whole programme and I expect it to confirm.

      6. J5, CENSUS COVERAGE -- 0.20 that an enumeration error is found (I
      checked 248 = sum_{d=3..7} 2^d and the 4 degree-4 linearized exclusions by
      hand and both are right), 0.45 that the reviewer finds a sentence
      somewhere downstream that reads the 732 certificates as covering more than
      732 named polynomials.

      7. A GENUINE F1 AT n = 131 -- 0.01. It is the most valuable outcome
      available here and would answer RQ-QSP-f9bbdb decision target (a)
      positively. I do not expect it and I would very much like to be wrong.

      MODAL EXPECTATION, stated so it can be overturned: 0.70 that the round
      returns "(A) and (B) hold as stated on the tested scope; the empirical
      support is narrower than the headline's 'three agreeing instruments' and
      '732 certificate-bearing counts' suggest; (E) stays un-promoted." If that
      is what comes back, the honest decision is closer to `replicate` or a
      scoped `support` on (A)/(B) alone than to anything touching (E) -- and
      AGENTS.md's own rule that a surprising or high-impact result gets
      `replicate`, not `support`, on first observation applies with full force,
      because PD-6 records that no seventh invocation was spent on an
      independent replication.

    joints:
      - joint: >-
          J1. THE DERIVATION OF (A), AND SPECIFICALLY: that (q+1)n' = n + (n'-r)
          licenses x^{p^{n'(q+1)}} = x^{p^{n'-r}} for x in K; that every K-root
          of L is therefore a root of D(Y) = Lambda_{q+1}(Y) - Y^{p^{n'-r}};
          that deg D <= max(d^{q+1}, p^{n'-r}) including the case where the two
          terms have equal degree and the leading terms could cancel; and that
          D != 0 off the degenerate case. The claim is quantified over ALL p,
          and every numerical cell in this experiment is p = 2.
        assigned_to: TASK-20260917-34b637
        attack_plan: >-
          Do not re-read the derivation for plausibility; build the instrument
          that would find the counterexample if one exists.
          (a) Verify the identity arithmetically and then attack the step it
          licenses: confirm that the collapse x^{p^{n'(q+1)}} = (x^{p^n})^{p^{n'-r}}
          uses x^{p^n} = x, which needs x in K, and check whether any later step
          of (A) or (B) applies D to an x NOT in K. If it does, the injection is
          into the wrong set.
          (b) Attack the degree bound at the equal-degree boundary. Construct
          lambda with d^{q+1} = p^{n'-r} exactly and D != 0 and confirm
          deg D = max, i.e. that the leading terms differ. This is the one place
          the `max` form could quietly become the `sum` form.
          (c) BUILD THE p != 2 SWEEP. THIS IS THE HIGHEST-VALUE MISSING DATUM IN
          THE ENTIRE EXPERIMENT AND NOTHING IN IT TOUCHES p != 2. Implement the
          count over F_{p^n} for p = 3 and p = 5 at (n, n') = (5, 3), (7, 3),
          (7, 4), (11, 4) for every lambda of degree 2..4, with two independent
          instruments (brute enumeration over all p^n elements, and
          deg gcd(X^{p^n} - X, L)), and check N <= max(d^{q+1}, p^{n'-r}) on
          every one. Do not reuse this experiment's implementation: write it
          against the STATEMENT.
          (d) Cross-check the two Stage 0 hand cells at (4, 3) independently:
          lambda = X^2 + X + 1 should give N = 1 with slack 0, and lambda =
          X^3 + 1 should give N = 0 with D having 2 K-roots both failing the
          closing test.
          WHERE I THINK IT BREAKS: nowhere in the algebra. I expect (c) to
          confirm at p = 3 and 5, and I expect the useful output of this joint
          to be the p != 2 evidence the program does not currently have, plus a
          precise statement of what the equal-degree boundary case does.
        breaking_artifact: >-
          A tuple (p, n, n', lambda) with D != 0 and an explicitly listed,
          independently re-verified set of K-roots of L of size strictly greater
          than max(d^{q+1}, p^{n'-r}); or a demonstration that a step of (A) is
          applied to an element outside K.

      - joint: >-
          J2. THE DEGENERATE-CASE CHARACTERISATION, WHICH CARRIES THE WHOLE OF
          COROLLARY (B). The claim is that D = 0 forces d = p^j with
          j(q+1) = n'-r AND Lambda_{q+1} equal to the monomial Y^{p^{n'-r}},
          that the composition-equals-monomial argument then forces
          lambda = c X^{p^j} + b and L = M^{p^j} with deg M = p^{n'-j}, and
          hence that N_K(L) <= p^{n'-j} < p^{n'} so a degenerate L NEVER SPLITS
          COMPLETELY. (B) uses that last sentence as its first step: complete
          splitting implies non-degenerate implies p^{n'} <= max(d^{q+1},
          p^{n'-r}). If a degenerate L can split completely, (B) fails at step
          one.
        assigned_to: TASK-20260917-52b4e6
        attack_plan: >-
          THIS JOINT HAS NO MEASUREMENT BEHIND IT AND THE ROUND SHOULD START
          HERE. Every cell of the experiment reports 0 degenerate candidates,
          and I claim that is structural, not observed: d = p^j with
          j(q+1) = n' - r is unsatisfiable at all eight cells (3j = 2 at (7,3);
          2j = 1 at (11,6) and (13,7); 3j = 1 at (11,4); 3j = 2 at (13,5);
          4j = 1, 3j = 1, 2j = 1 at n = 131 for n' = 33, 44, 66). Verify that
          claim first -- if I am wrong, say so, it is load-bearing for
          everything below.
          (a) CONSTRUCT DEGENERATE INSTANCES DELIBERATELY, since the experiment
          could not. Solve j(q+1) = n' - r for integer j to find cells that
          admit them: e.g. p = 2, j = 1, q + 1 = 2 and n' - r = 2 gives q = 1,
          r = n' - 2, n = n' + r = 2n' - 2 -- so (n, n') = (6, 4) with d = 2,
          lambda = cX^2 + b. Build a handful across several (p, n, n', j) and
          run each through: symbolic detection of D = 0; the factorisation
          L = M^{p^j}; and an exhaustive count of distinct K-roots. Confirm
          N <= p^{n'-j} < p^{n'} on every one, and in particular that none
          splits completely.
          (b) ATTACK THE COMPOSITION ARGUMENT IN CHARACTERISTIC p, where the
          intuition from characteristic 0 is least reliable. The argument runs:
          if f o g = Y^m then for every root a of f, g - a has 0 as its only
          root, so g - a = cY^{deg g}, so f has exactly one root. Test it
          against additive and p-th-power maps -- g = Y^p, g = Y^p + Y,
          g = Y^{p^2} + Y^p -- and against inseparable f. Find, if it exists, an
          f o g = monomial in char p with g NOT of the form cY^e + b.
          (c) CHECK THE EXCLUSION IS AN EXCLUSION, NOT A GAP. (A) excludes
          degenerate lambda by hypothesis and (B) covers them by a separate
          argument. Confirm the two together are exhaustive: every lambda is
          either D != 0 (bounded by (A)) or D = 0 (bounded by p^{n'-j}), with no
          third case, and in particular that d not a power of p really does
          preclude degeneracy.
          (d) EXERCISE THE INSTRUMENT. specification.yaml lists
          `degenerate_detection` as an instrument and says D = 0 is detected
          symbolically, never by a numeric tolerance. Feed it a constructed
          degenerate candidate and confirm it returns true. An instrument that
          has never returned a positive is an untested instrument.
          WHERE I THINK IT BREAKS: not in the mathematics -- I believe the
          characterisation -- but in the CONTROL. I expect (a) and (d) to show
          that a declared blocking instrument was never exercised on any of 3192
          candidates, which narrows what the experiment established without
          touching what the derivation proves. That distinction is the whole
          output of this joint and must be stated sharply.
        breaking_artifact: >-
          A degenerate L (D = 0) over some F_{p^n} with N_K(L) = p^{n'}, which
          breaks (B) at its first step; or a char-p counterexample to the
          composition-equals-monomial step; or a demonstration that
          `degenerate_detection` as implemented cannot return true on any input,
          which would make the D = 0 exclusion unenforced rather than unfired.

      - joint: >-
          J3. THE BETA COROLLARY: that N = p^{n'} with r >= 1 forces
          d^{q+1} >= p^{n'}, hence (q+1) l >= n' with l = log_p d, hence
          beta := l n / n'^2 >= n / ((q+1) n') = n / (n + n' - r) > 1/2; and
          that the measured Stage 2 columns instantiate this correctly on all 65
          complete splitters.
        assigned_to: TASK-20260917-34b637
        attack_plan: >-
          (a) ATTACK THE "> 1/2" AS A SCOPE CLAIM, NOT AN ARITHMETIC ONE. The
          step beta >= n/(n + n' - r) > 1/2 needs n + n' - r < 2n, i.e.
          n' - r < n. That holds when n' < n. But the hypothesis quantifies over
          "every n' not dividing n", which as written also admits n' > n, where
          q = 0, r = n, (q+1)n' = n' = n + n' - n survives as an identity, and
          beta >= n/n' -- which is BELOW 1/2 whenever n' > 2n. Determine whether
          the QSP setting supplies n' < n as a definitional constraint, whether
          (B) and (E) say so where they are stated, and whether (E)'s "at any p,
          n, n'" therefore overreaches. Report the precise scope the argument
          supports.
          (b) RECOMPUTE M3 INDEPENDENTLY. beta depends on (n, n', d) ALONE and
          not on N -- which means the complete-splitter margins can be checked
          without trusting any instrument. Recompute beta, n/(n + n' - r) and
          n(n'-1)/(n'(n + n' - r)) for all 65 rows of
          RUN-QSP-33b442-S2B/raw-result.json M3_complete_splitters from
          (n, n', d) alone and compare column by column. Confirm the minima:
          min(beta - exact) = 0.000000 and min(beta - conservative) = 0.21875. I
          have hand-checked three rows -- (7,3,d=2) gives 7/9 - 7/9 = 0;
          (7,4,d=4) gives 0.875 - 0.65625 = 0.21875, which locates the
          conservative minimum; (31,5,d=8) gives 3.72 - 0.8857 = 2.834 -- and
          all three reproduce. Do all 65.
          (c) RESOLVE A KNOWN IMPRECISION. The execution report says
          "minimum beta - exact = 0.000000 (equality at two splitters)", but the
          raw result carries eight occurrences of `"beta_minus_exact": 0.0`, and
          by the arithmetic every d = 2 splitter at (7,3) and every d = 4
          splitter at (7,4) attains equality -- and the run reports 36 and 3 of
          those respectively. Establish the correct count. The metric (the
          minimum) is right; the parenthetical is what is in question, and
          CORR-20260917-8b80cc already classifies it as a prose imprecision
          rather than a measurement defect. Confirm or overturn that
          classification.
          (d) CHECK THE WEAKEN/REJECT SPLIT IS DECIDABLE. F2 splits on the
          conservative threshold if the exact one fails. Confirm the run
          recorded both values for every complete splitter, so that a future F2
          event would be decidable from the archived rows alone.
          WHERE I THINK IT BREAKS: (a). I expect the scope statement to be
          loose and the fix to be one clause.
        breaking_artifact: >-
          A complete splitter at r >= 1 with beta < n/(n + n' - r) recomputed
          from (n, n', d); or a recomputed M3 column disagreeing with the
          archived one; or a demonstration that (B)/(E) as stated assert
          beta > 1/2 over a parameter range where it is false.

      - joint: >-
          J4. INSTRUMENT INDEPENDENCE AND THE DIRECTION OF VERIFICATION. M2 = 0
          over 1260 candidates is evidence ONLY IF I1, I2 and I3 do not share a
          failure mode; gf2rc.c and the bit-packed primitives of qspcore.py are
          shared. Separately: at n = 131 neither I1 nor I2 ran at all, so the
          732-candidate census rests on I3 alone, checked only by a root
          re-verifier that can detect a false root but not a missing one.
        assigned_to: TASK-20260917-52b4e6
        attack_plan: >-
          (a) BUILD THE ACTUAL CALL GRAPH. Read
          experiments/EXP-QSP-33b442/implementation/{qspcore.py,gf2rc.c,runlib.py}
          and map which primitives each of I1, I2, I3 and verify_roots_f2
          actually calls. I2 is deg gcd(X^{2^n} - X, L) and I3's D-root
          extraction is gcd(X^{2^n} - X, D): both go through the same
          repeated-squaring-mod and the same gcd, which are the two most
          error-prone routines in the package. State plainly how many
          INDEPENDENT determinations of N each stage really has. My reading is
          two in Stage 1 (I1 against the shared gcd path), not three, and ONE at
          n = 131.
          (b) FAULT-INJECT. Perturb a shared primitive -- an off-by-one in the
          reduction, a dropped high word -- and check whether M2 still reads 0.
          If a single injected fault leaves the agreement matrix clean, the
          matrix is measuring shared code, not agreement, and P-D/S2 mean less
          than they say. This is the concrete, cheap experiment that settles the
          joint.
          (c) ATTACK THE VERIFICATION ASYMMETRY AT n = 131, WHICH IS WHERE THIS
          MATTERS. The wrapper verifies every listed root satisfies
          x^{2^{n'}} = lambda(x) and that listed roots are distinct. It cannot
          detect a root I3 never found. A missed root LOWERS N, and lower N is
          exactly what makes `N <= bound` hold. So a systematically
          under-counting I3 produces precisely the observed result. Build the
          missing check: the census EXCLUDES linearized lambda, so take a
          LINEARIZED lambda at n = 131, n' = 33, whose root count is decided
          independently by Proposition 2 of KN-LIT-4fe9d2
          (N = 2^{deg gcd(f, T^n - 1)}), run I3 on it, and compare. The
          experiment never did this at n = 131 -- C6 ran only in Stages 1 and 2
          -- and it is the one cheap independent determination available at the
          target field.
          (d) CHECK THE AMENDMENT'S REAL COST. AMD-20260917-001 is ratified
          (CORR-20260917-8b80cc), and its ratification is explicitly scoped NOT
          to cover its own characterisation: 10 OF THE 14 I3-EXCLUDED CANDIDATES
          ARE COMPLETE SPLITTERS, i.e. 10 of the 65 rows of M3, all at (31, 5)
          with d = 8 and N = 32, resting on I2 alone. Verify that decomposition
          in RUN-QSP-33b442-S2B/raw-result.json and assess whether an I2-only
          determination of completeness at those rows is sound. Note in
          mitigation that their beta margin is 2.834 and that I2 ran on all
          42244 candidates so no splitter can have been missed by the cap.
          (e) ASSESS PD-6. No independent replication run was spent. The
          substitute offered is a determinism cross-check: the 54 checkpoint
          cells of the aborted RUN-QSP-33b442-S2 against the corresponding cells
          of S2B, 23176 candidates, 0 mismatches. Say what that does and does
          not establish -- it is the same code on the same host twice, which
          tests determinism and not correctness.
          WHERE I THINK IT BREAKS: (a) and (c). I expect "three agreeing
          instruments" to be reported as overstated and the n = 131 census to be
          reported as single-instrument with one-directional verification. I put
          0.08 on (c) actually turning up a disagreement, which would be the
          most important result of the round.
        breaking_artifact: >-
          An n = 131 candidate where I3's count disagrees with an independent
          decision procedure; or an injected single-point fault that leaves
          M2 = 0; or a demonstrated shared failure mode that produces agreement
          without correctness.

      - joint: >-
          J5. THE n = 131 CENSUS'S COVERAGE CLAIM -- a claim about what was NOT
          found, and therefore a claim whose strength is exactly the
          completeness of its enumeration and the honesty of its scope. The
          asserted set is "every non-linearized lambda in F_2[X] of exact degree
          3..7, 244 per cell, 732 in total, affine included and marked,
          linearized excluded and handled by C6".
        assigned_to: TASK-20260917-34b637
        attack_plan: >-
          (a) RE-ENUMERATE FROM THE DEFINITION, not from the file. The count of
          lambda of EXACT degree d over F_2 is 2^d, so degrees 3..7 give
          8+16+32+64+128 = 248; the linearized ones of exact degree in 3..7 are
          those with exponents all powers of 2 and leading exponent in {4}, i.e.
          X^4 + aX^2 + bX with a, b in F_2, exactly 4; 248 - 4 = 244. I have
          checked this by hand and it holds. Now verify the FILE realises that
          set: read the 244 lambda_bits values from
          RUN-QSP-33b442-S3/cells/n131_np33.json, confirm they are exactly the
          integers in [2^3, 2^8) whose bit patterns are not the four excluded
          ones, and confirm no duplicate and no omission. Repeat for n' = 44 and
          66.
          (b) CONFIRM THE HISTOGRAM FROM THE ROWS, not the summary. I counted
          {0: 62, 1: 118, 2: 60, 132: 4} = 244 at n' = 33 and
          {0: 62, 1: 122, 2: 60} = 244 at each of n' = 44 and 66. Reproduce.
          (c) AUDIT THE SCOPE SENTENCES. 732 named F_2-coefficient polynomials
          of degree at most 7 is a measure-zero slice of F_{2^131}[X]: the
          K-coefficient case at n = 131 is UNTOUCHED (Stage 1b reaches
          K-coefficients only at n = 11 and 13), and degree is capped at 7.
          Read every sentence in execution-report.yaml, the Stage 5 report and
          H-QSP-5540d7 that mentions the census and flag any that reads it as
          covering more than 732 named polynomials, or that lets "no violation
          at n = 131" do work the derivation should be doing.
          (d) CHECK THE AFFINE MARKING. The contract says affine lambda are
          included and marked. Confirm the `affine` column is populated and
          correct on a sample, since an affine lambda is the nearest neighbour
          of the excluded linearized family and a mis-marking would put a
          C6-decidable candidate in the census unchecked.
          WHERE I THINK IT BREAKS: 0.20 on an enumeration error -- I have
          checked the arithmetic and expect none -- and 0.45 on (c) finding a
          downstream sentence that overreads the census.
        breaking_artifact: >-
          A lambda in the declared set absent from the 244, a duplicate, or a
          linearized lambda present in the census; or a quoted sentence in a
          committed artifact that asserts more than 732 certified polynomials.

      - joint: >-
          J6. THE CLOSURE READING (E) -- "under the cost model of Theorem 3.2 of
          KN-LIT-0a321c / Proposition 8 of KN-LIT-4fe9d2 (H1), no factor base of
          the form {x : x^{p^{n'}} = lambda(x)} with lambda polynomial and n'
          not dividing n beats generic algorithms, at any p, n, n'" -- which is
          conditional on the UNVALIDATED heuristic H1 and on Rojas' kappa =
          4.876, and which is the step by which a scoped derivation-tier bound
          could be overread as a closure of the QSP line.
        assigned_to: TASK-20260917-52b4e6
        attack_plan: >-
          (a) APPLY THE PROMOTION GATES DIRECTLY. agents/coordinator.md gate (2)
          requires every conditional dependence to be an explicit numbered
          heuristic with archived validation evidence OR a scheduled validation
          experiment. H1 is numbered and formally stated -- good -- but carries
          `validation_experiment_ids: []` and a route, IDEA-20260916-b84e2d,
          that is scheduled AND BLOCKED by a recorded engine impediment (no
          Groebner or resultant engine). Rule on whether a blocked route
          discharges gate (2). My reading is that it does not, and that (E)
          cannot move toward `supported` at all regardless of what this
          experiment returns -- which is also what the contract's own
          heuristic_under_test_note says.
          (b) ATTACK THE ROBUSTNESS OF THE CONSTANT. The closure argument is
          "beta > 1/2 forces kappa < 1, five times below Rojas' 4.876". Recompute:
          alpha_beta = 1/(2 kappa beta) exceeds 1 at beta = 0.504 only if
          kappa < 1/(2 x 0.504) = 0.992. So the closure needs kappa >= 0.992,
          not 4.876 -- a far weaker and far more robust sufficient condition
          than the rhetoric implies, and the record should claim the weaker one.
          Then push: is a solver with kappa < 0.992 excluded by an ARGUMENT or
          only by a citation? H-QSP-5540d7's own assumptions block concedes "A
          solver model in which the cost does not grow with d is not excluded by
          (E)". A linear-time solver sits at kappa = 1, on the boundary.
          (c) CHECK THE CITATION PROVENANCE. H1's `supporting_results` marks the
          generic-attainment (BKK/mixed-volume) statement as RECALLED and says
          it "supports nothing by itself"; the Petit-Kosters-Messeng [20]
          pointer behind (D)(iii) is RECALLED with `verified_by: null`. Under
          AGENTS.md rule 9 a recalled reference may not discharge a heuristic's
          supporting_results. Confirm nothing in (E) leans on one.
          (d) VERIFY M7 IS FENCED. M7 is arithmetic on (B), not measurement, and
          the contract requires it printed in a separate section. Check
          RUN-QSP-33b442-S5/report.md and metrics.json actually keep that fence,
          and that no sentence anywhere quotes "2^117.7 against rho's 2^60.9" as
          though it had been measured. This is the specific route by which a
          derivation-tier bound becomes a claimed attack ceiling.
          (e) RED-TEAM THE FORWARD GUIDANCE, because a closure is only as honest
          as what it leaves open. (E) names n' | n, correspondence shapes of
          conjugate degree >= 2 (IDEA-20260916-a17f43), and non-root-set factor
          bases as survivors. Is that list complete? In particular the rational
          lambda extension (D)(ii) is RECORDED AS WITHDRAWN by the Stage 5
          report -- so rational lambda are NOT closed and must appear in the
          survivor list, not be silently absorbed.
          WHERE I THINK IT BREAKS: (a), at 0.60, and I expect the reviewer to be
          right. (E) should not move on this evidence and the round's most
          likely real service is to say so before anyone tries.
        breaking_artifact: >-
          A stated cost model or solver with kappa < 0.992 not excluded by H1's
          formal statement; or an arithmetic error in the Proposition 8
          instantiation at integer m for n = 131; or a committed sentence
