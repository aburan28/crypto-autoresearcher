handoff:
  id: TASK-20260906-16e62c
  recorded_at: '2026-09-06'
  from: coordinator
  to: executor
  role: executor
  question_id: RQ-RELN-61638a
  hypothesis_id: H-RELN-41562a
  experiment_id: EXP-RELN-f202be
  review_required: true
  objective: >-
    Implement and execute the frozen, APPROVED contract EXP-RELN-f202be
    version 1 (experiments/EXP-RELN-f202be/specification.yaml; status
    approved, approved_by coordinator, execution_authorized true, per
    DEC-20260906-0b4030) EXACTLY as written: measure, exactly and with every
    count certified by a checked group identity, the dispersion index
    Delta = E_3/M - mu of the decomposition-count vector c_D(r) for
    x-interval and quadratic-residue-class bases on prime-order toy curves
    E/F_p at four rungs N near 2^14, 2^16, 2^18, 2^20, under both frozen
    base-size conventions (B_1, B_2) and all declared sign conventions
    (plain, unreduced, reduced), against the full control and null panel the
    contract names (NULL-A random x-classes, NULL-B random points and Z/N,
    the Z/N-interval positive control, the Bose-Chowla minimum-energy
    control, the forced-negation-gap trap control, the analytic selection
    null of INV-3, the label-permutation null, the q-decay ladder, and the
    code-independent spectral (FFT) cross-check), and decide, per the
    contract's own decidable success_criterion, between the pre-committed
    NULL outcome and the ALIVE outcome. The Executor records observations
    only: it interprets nothing, draws no conclusion beyond the contract's
    own decidable criterion classification, uses no hypothesis-promotion
    language, and changes no ledger status.
  uncertainty_reduced: >-
    Whether, on a complete run set (>=3 certified prime-order curves per
    rung, every INV-1/INV-2 accounting identity exact, every blocking control
    at its pre-committed value), the dispersion index Delta for x-interval
    and QR-class bases lies inside the NULL-A random-base band (mean +/- 3 SD)
    at every rung with a growth-slope interval containing 0 (NULL outcome),
    or exceeds it by more than 3 SD on every curve at the two largest rungs
    with the slope interval excluding 0 on the positive side (ALIVE outcome),
    or is INCONCLUSIVE per the contract's own falsification_criterion. The
    Executor produces the measurements and the mechanical classification; the
    Coordinator interprets and decides after independent review.
  inputs:
    - experiments/EXP-RELN-f202be/specification.yaml (the frozen, approved contract; the ONLY protocol)
    - ledger/hypotheses/H-RELN-41562a.yaml (the specified hypothesis; status unchanged by execution)
    - ledger/questions/RQ-RELN-61638a.yaml (decision target, scope, constraints)
    - ledger/proposals/IDEA-20260906-d1494b.yaml (the idea record the contract is derived from)
    - knowledge/findings/KN-FIND-007.md (the conservation identity, recovery control)
    - experiments/EXP-FB3-001/conservation.md (the sign-convention reference this contract's conventions are stated relative to)
    - docs/claims-and-verification.md
    - docs/research-budget-policy.md
  constraints:
    - >-
      FROZEN CONTRACT. Any needed change to any protocol field (curve
      recipe, base-size or sign conventions, predicate family, seeds,
      thresholds, the preregistered prediction) is a versioned
      protocol_amendment under experiments/EXP-RELN-f202be/amendments/ to the
      Coordinator -- NEVER an inline edit of specification.yaml, and never a
      re-score of an executed run against a changed prediction.
    - >-
      DETERMINISTIC SEEDS exactly as replication.seeds in the contract:
      curve_seed_scan sequential per rung until three prime-order curves are
      accepted; null_draw_master_seed 20260906 with the stated per-draw SHA256
      derivation; permutation_master_seed 20260907; q_decay_master_seed
      20260908. Re-running with the same seeds must reproduce every count
      vector bit-for-bit.
    - >-
      TWO INDEPENDENT IMPLEMENTATIONS: source/direct_enumerator.py and
      source/spectral_crosscheck.py must share no module, function, or
      imported helper beyond the standard library and numpy; the manifest
      records their independence. Every cell's spectral vector must agree
      with the direct vector exactly in every target, or the cell is
      failed_accounting per the contract's stopping rules.
    - >-
      ORDERING CONTROL: the forced-value table is written and sha256-hashed
      before any curve arm is enumerated; null and control-arm verdicts are
      recorded in accounting.json before any object-arm Delta is read.
    - >-
      ALL COSTS charged per the contract (point-addition counts, wall clock
      per stage, peak RSS); MEASURED and MODELED numbers never share a
      column (the Pareto rows are modeled-only formulas, not run).
    - >-
      RUN RECORDS are immutable under experiments/EXP-RELN-f202be/runs/<RUN-ID>/
      with every required_artifact the contract lists. A defective run is
      superseded by a new run record, never edited.
    - >-
      INFERENCE MANIFEST per run: requested_policy executor-implementation,
      backend, resolved model identifier, reasoning effort, fallback_used
      with reason (this handoff sets fallback_allowed false and
      degraded_allowed false: if the policy cannot be honoured the Executor
      refuses and reports, never silently substitutes).
    - >-
      A TIMEOUT (14400 s per run per the contract), crash, memory exhaustion,
      or numpy/FFT failure is failed_infrastructure and is NEVER a result,
      positive or negative (AGENTS.md rule 3; contract invalidation rule).
    - >-
      A curve seed scan exceeding 400 seeds without three accepted prime-order
      curves stops that rung and reports it not_run; never substitute a
      composite-order curve.
    - >-
      ZERO INTERPRETATION beyond the contract's own decidable success/
      falsification criterion classification: no hypothesis-status language,
      no ledger write outside write_scope (no EV-*, DEC-*, H-*, or KN-*
      record).
    - >-
      IMPLEMENTATION PATH: experiments/EXP-RELN-f202be/source/ per the
      contract's required_artifacts list (direct_enumerator.py,
      spectral_crosscheck.py, zn_integer_arms.py, analysis.py, SHA256SUMS),
      hash-pinned by commit in every run manifest.
    - >-
      NETWORK: none required for execution.
  write_scope:
    - experiments/EXP-RELN-f202be/runs/
    - experiments/EXP-RELN-f202be/source/
  artifact_paths:
    - experiments/EXP-RELN-f202be/runs/
    - experiments/EXP-RELN-f202be/source/
  archived_by_note: >-
    The snapshot archive of the executed run package (source/, runs/, and the
    execution report) is a SEPARATE later Coordinator task, dispatched after
    this handoff returns and before any independent review begins; it is not
    performed by this handoff.
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 14400
    memory_gb: 4
    maximum_runs: 8
  contract_budget_envelope:
    wall_clock_seconds_per_run: 14400
    total_cpu_hours: 12
    maximum_memory_gb: 4
    maximum_runs: 8
    maximum_workers: 4
  completion_gate:
    - >-
      A run set is COMPLETE when all four rungs have at least three certified
      prime-order curves, every cell passes INV-1 and INV-2 with deviation 0
      and the spectral cross-check exactly, and every blocking control (Z/N
      interval, Bose-Chowla, forced gap, NULL-A and NULL-B means, q-decay
      monotonicity, ordering) meets its pre-committed value, per the
      contract's success_criterion.
    - >-
      Every required_artifact of the contract is present for every executed
      run: manifest.json, environment.json, inputs.json, curves.json,
      forced-value-table.json, per-cell count vectors/histograms/spectral
      reports and hashes, accounting.json, metrics.json,
      predicate-lifts.json, bands.json, execution-report.md, stdout.log,
      stderr.log, and the source/ tree with SHA256SUMS.
    - >-
      Infrastructure failures, if any, are recorded as failed_infrastructure
      with a re-planned shard within the contract's spare runs; no protocol
      edit anywhere; no status language; runs immutable.
  review_reservation: >-
    Results of this task are CLAIM-RELEVANT (review_required: true). Per the
    contract's later_review_requirements: a committed Coordinator review_plan
    must precede any claim-changing review; an independent Validator checks
    receipts, curve certificates, cell counts, seed derivations, and the
    two-implementation independence, and blind-re-derives Delta, the k-rich
    counts, and one predicate lift from one object cell's count-vector alone;
    a Red Team attacks the band construction, the B-convention choice, the
    object-base selection rules, and the Holm family definition; both run at
    review-adversarial xhigh with no silent downgrade. No run under this
    handoff is evidence before that chain -- snapshot archive, independent
    validator and red-team reports, then a Coordinator ledger archive with
    the evidence and decision records -- has completed and been verified.
