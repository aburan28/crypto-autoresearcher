handoff:
  id: TASK-20260808-7865e0
  from: coordinator
  to: executor
  activation_status: ACTIVE
  activated_at: '2026-08-08'
  approved_by_decision: DEC-20260808-e75211
  goal_id: GOAL-ENDO-001
  question_id: RQ-ICINV-475b5e
  hypothesis_id: H-ICINV-82ee6a
  experiment_id: EXP-ICINV-fcb497
  protocol_version: 2

  objective: >-
    EXECUTE STAGE 0 OF EXP-ICINV-fcb497 EXACTLY ONCE MORE, under protocol version
    2 (experiments/EXP-ICINV-fcb497/amendments/v2.yaml), against the AMENDED
    retrieval list, writing to a NEW run directory
    experiments/EXP-ICINV-fcb497/runs/RUN-ICINV-kf-stage0-v3/. THIS IS A
    RETRIEVAL TASK, NOT A RESEARCH TASK, AND IT MUST NOT BE CONVERTED INTO ONE.
    Retrieve the square-root Velu source, pin every retrieved byte stream and its
    extracted text, extract every operation-count passage under the FROZEN search
    terms, byte-verify every quotation at recorded offsets, and emit the STAGE-0
    verdict from the FOUR FROZEN BRANCH RULES, computed inside the run.

  uncertainty_reduced: >-
    M0, the gating metric: whether the Otilde(sqrt ell) square-root Velu
    operation count is stated over the BASE FIELD or over the FIELD OF DEFINITION
    OF A KERNEL GENERATOR. Version 1 returned AMBIGUOUS because the frozen
    urls_in_order pinned all four URLs to eprint.iacr.org, whose PDFs are
    Cloudflare-walled at HTTP 403. A determinate verdict either keeps cost
    corollary CC of H-ICINV-82ee6a alive as a conditional claim (KERNEL_FIELD) or
    REFUTES it and inverts this lane's reading (BASE_FIELD); it also unblocks 127
    of 177 barrier-table rows, all of which carry one identical reason string
    keyed to this single gate.

  inputs:
    - experiments/EXP-ICINV-fcb497/specification.yaml (the FROZEN version-1 contract; body unchanged)
    - experiments/EXP-ICINV-fcb497/amendments/v2.yaml (the ONLY authorised deviation from it)
    - ledger/corrections/CORR-20260808-ba8792.yaml
    - ledger/decisions/DEC-20260808-e75211.yaml
    - experiments/EXP-ICINV-fcb497/validation-report.md
    - experiments/EXP-ICINV-fcb497/red-team-report.md
    - experiments/EXP-ICINV-fcb497/runs/RUN-ICINV-kf-stage0-v2/ (RETAINED, READ-ONLY, NEVER EDITED)
    - harness/velu_stage0.py
    - docs/claims-and-verification.md
    - AGENTS.md

  constraints:
    - >-
      URLS, IN THIS ORDER, PER AMENDMENT v2 CHANGE A1:
      (1) https://msp.org/obs/2020/4-1/obs-v4-n1-p05-s.pdf
      (2) https://arxiv.org/pdf/2003.10118
      (3) https://eprint.iacr.org/2020/341
      (4) https://eprint.iacr.org/2020/341.pdf
      The fallback_source paths_in_order are UNCHANGED, and the frozen rule that
      the KN-LIT-780 corpus note can NEVER return a determinate verdict and may
      return only AMBIGUOUS is UNCHANGED.
    - >-
      THE MSP / ANTS XIV VERSION IS AUTHORITATIVE WHERE THE VERSIONS DIFFER. A
      determinate verdict resting solely on the arXiv preprint must say so on its
      face and record the preprint's version string. If the retrieved versions
      DISAGREE on the field the count is stated over, the frozen S0_AMBIGUOUS
      branch fires on its existing "different byte-verified passages of the pinned
      sources disagree" clause. Do not resolve such a disagreement by judgement.
    - >-
      RECORD, FOR EACH QUOTATION, the URL actually used, the artifact sha256, and
      the source VERSION STRING as EXTRACTED FROM THE ARTIFACT ITSELF, subject to
      the same byte-verification rule as any other quoted text. If no version
      string can be extracted, record `version_string: null` with the reason. DO
      NOT SUPPLY ONE.
    - >-
      THE BYTE-VERIFICATION PATH IS UNCHANGED AND BLOCKING. Every quoted passage
      is programmatically re-checked as an EXACT BYTE substring of the pinned text
      file with start and end offsets recorded; a failing quote makes the run
      INVALID; reconstruction of any quotation from memory is PROHIBITED. Note the
      Validator's method finding: offsets are BYTE offsets into UTF-8, and slicing
      by character index fails on text containing "Velu" with an accent.
    - >-
      THE FOUR STAGE-0 BRANCH DEFINITIONS ARE UNCHANGED, VERBATIM, INCLUDING THE
      RECORD-INVERTING S0_BASE_FIELD BRANCH. The verdict is computed INSIDE the
      run from those rules and is never selected afterwards (SR7). Every
      pre-registered prediction and threshold in the contract is unchanged.
    - >-
      STANDING PROHIBITION, CARRIED VERBATIM FROM THE FROZEN CONTRACT: "The
      STAGE-0 verdict may cite ONLY the pinned artifacts. An assertion about what
      the paper says that is not supported by a byte-verified quotation is a
      rule-9 fabrication risk and makes the run INVALID. If the executor believes
      it knows the answer and cannot retrieve it, the verdict is
      UNRETRIEVED_INFRA, not the remembered answer."
    - >-
      THIS MATTERS MORE THAN USUAL ON THIS RUN BECAUSE THE EXPECTED ANSWER IS IN
      CIRCULATION. The archived red-team report states in the open what it read in
      sec. 4.14 "Irrational generators", including that the Frobenius eigenvalue is
      "of order e" and that "typically e is in O(ell)". THAT IS A LEAD, NOT AN
      ESTABLISHED FACT. You must establish any such passage from a FRESHLY
      RETRIEVED, PINNED artifact at recorded byte offsets, or return
      UNRETRIEVED_INFRA. COPYING RT-3's QUOTATIONS, OFFSETS OR HASHES FROM THE
      REPORT INSTEAD OF FROM YOUR OWN RETRIEVAL IS A RULE-9 FABRICATION AND MAKES
      THE RUN INVALID. RT-3's sha256 for the arXiv PDF
      (058162905a84b39fc6e23f12341b02899cce9328e9b45ac20750fa86cdfedd11) is a
      CHECKABLE PREDICTION you may falsify by reporting what you actually got; it
      is NOT a value to write into an artifact. If your retrieval's hash differs,
      REPORT THE DIFFERENCE -- do not reconcile it.
    - >-
      NEW RUN DIRECTORY ONLY: runs/RUN-ICINV-kf-stage0-v3/. EDITING, DELETING,
      RE-SCORING OR OVERWRITING ANY EXISTING RUN IS PROHIBITED AND MAKES THIS RUN
      INVALID. RUN-ICINV-kf-stage0 and RUN-ICINV-kf-stage0-v2 are retained
      unchanged. Declare supersession from the v3 run's own side, in its
      supersession_note, naming amendment v2.
    - >-
      ALL FILES UNDER runs/RUN-ICINV-kf-stage0-v3/sources/ MUST BE COMMITTED
      (amendment v2 change A6). `.gitignore` matches `*.raw`, so raw byte streams
      need an explicit force-add; state per file, in the run report, that it is
      tracked. A pinned artifact that exists only in a working tree is not a
      durable receipt.
    - >-
      DO NOT MODIFY THE FROZEN SPECIFICATION BODY, any ledger record, either
      review report, or any of the five harness modules under the standing edit
      prohibition. If harness/velu_stage0.py must change to accept the new URL
      list, that change is a code change to be declared with its diff and its
      sha256 pinned in the manifest -- and it may change RETRIEVAL ONLY, never
      classification, extraction, verification or branch logic.
    - >-
      DO NOT CHANGE THE CLASSIFIER. Both the windowed and the document-aware
      labels are reported as they fall; neither is tuned, and no label is moved
      after a verdict is seen.
    - >-
      NO CLAIM ABOVE claim_tier `toy` in any artifact you write. No attack claim,
      no speedup claim, sota_delta 0.0. A non-200 HTTP status is an
      INFRASTRUCTURE OUTCOME and is NEVER a BASE_FIELD verdict and never negative
      mathematical evidence.
    - >-
      STAGES 1-4 ARE NOT RE-RUN BY THIS TASK. Discharging the 127 pending barrier
      rows, if the verdict is determinate, is a SEPARATE handoff under a separate
      approval.

  deliverables:
    - experiments/EXP-ICINV-fcb497/runs/RUN-ICINV-kf-stage0-v3/manifest.yaml
    - experiments/EXP-ICINV-fcb497/runs/RUN-ICINV-kf-stage0-v3/stage0-verdict.json
    - experiments/EXP-ICINV-fcb497/runs/RUN-ICINV-kf-stage0-v3/sources/ (every retrieved byte stream and its extracted text, each with sha256, all COMMITTED)
    - experiments/EXP-ICINV-fcb497/runs/RUN-ICINV-kf-stage0-v3/raw-result.json
    - experiments/EXP-ICINV-fcb497/runs/RUN-ICINV-kf-stage0-v3/quotation-tail.json (full quotation tail with per-quotation url_used, artifact_sha256, version_string, byte_start, byte_end, verified_exact_substring)
    - experiments/EXP-ICINV-fcb497/execution-report-stage0-v3.yaml (execution report, deviations, per-file tracked status, resource use)

  artifact_paths:
    - experiments/EXP-ICINV-fcb497/runs/RUN-ICINV-kf-stage0-v3/
    - experiments/EXP-ICINV-fcb497/execution-report-stage0-v3.yaml
  write_scope:
    - experiments/EXP-ICINV-fcb497/runs/RUN-ICINV-kf-stage0-v3/**
    - experiments/EXP-ICINV-fcb497/execution-report-stage0-v3.yaml
    - harness/velu_stage0.py (retrieval-list handling ONLY; declare the diff)
  write_scope_note: >-
    Per DEC-20260807-4261e3 next action N5 (deviation D9): this write_scope is
    stated to cover EVERY deliverable this task requires, including the execution
    report. Anything outside it is a deviation to be declared, not performed
    silently.

  archived_by: TASK-20260808-7865e0

  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
    independent_session_note: >-
      This run must be executed by a session that did not write the correction or
      the amendment, and the run's own manifest must record its resolved model
      and `requested_policy: executor-implementation` with `fallback_used` and a
      reason if they differ.

  budget:
    wall_clock_seconds: 3600
    memory_gb: 4
    maximum_runs: 1
  budget_note: >-
    NO FIELD IS NULL. STAGE 0 is network-bound; version 1 completed its two
    STAGE-0 runs in seconds against a 7200 s per-run cap and used 99 MB peak RSS
    in total across all 13 runs. 3600 s is generous headroom for up to four
    sequential retrievals with a 120 s curl timeout each plus PDF text
    extraction. maximum_runs 1 means ONE run directory: a supersession, if one is
    genuinely needed, requires a new handoff. The experiment-level cap raised to
    16 by amendment v2 is PROSPECTIVE and does not authorise extra runs here.

  completion_gate:
    - >-
      runs/RUN-ICINV-kf-stage0-v3/ exists with a schema-complete manifest
      carrying code.source.all_pinned true and per-file sha256, and
      tools/check_run_source_provenance.py --strict exits 0 for it.
    - >-
      stage0-verdict.json emits M0 in {KERNEL_FIELD, BASE_FIELD, AMBIGUOUS,
      UNRETRIEVED_INFRA}, computed inside the run from the frozen branch rules,
      with the terminal state recorded and the branch named.
    - >-
      Every retrieved byte stream and every extracted text is pinned under
      sources/ with sha256, URL, HTTP status, final URL, Content-Type, byte
      length and retrieval timestamp -- AND IS COMMITTED, with tracked status
      stated per file.
    - >-
      Every quotation is byte-verified as an exact substring at recorded offsets,
      `quotations_failing_byte_verification` is empty, and each carries
      url_used, artifact_sha256 and version_string (or null with a reason).
    - >-
      For any DETERMINATE verdict: at least one byte-verified quotation with
      recorded offsets, plus the full quotation tail, plus the attribution check
      (extracted title and author list compared to the contract's attribution,
      any mismatch reported as an attribution defect rather than absorbed).
    - >-
      No existing run directory, no ledger record, no review report and no part
      of the frozen specification body is modified. `git status` shows no such
      path touched.
    - >-
      The execution report lists every deviation explicitly, states the resolved
      model and policy, and declares plainly whether any statement in the verdict
      rests on anything other than a pinned artifact. If any does, the run is
      INVALID and must be reported as such.

  return_format: >-
    An execution report at the path above, plus a short summary to the
    Coordinator stating: the verdict and the branch that fired; per URL, the HTTP
    status, final URL, byte length and sha256 ACTUALLY OBTAINED (including any
    that differs from the prediction in the amendment); which artifact and which
    version each deciding quotation came from; the count of quotations extracted
    and byte-verified; every deviation; and resource use against the budget
    above. IF RETRIEVAL FAILS, RETURN UNRETRIEVED_INFRA WITH THE PINNED FAILURE
    BODIES AND STOP -- that is a complete and acceptable outcome of this task,
    it is an infrastructure result and never a mathematical one, and it is
    strongly preferred to any verdict that outruns its artifacts.

