handoff:
  id: TASK-20260904-63e06e
  from: coordinator
  to: coordinator
  goal_id: GOAL-SSI-001
  batch_id: BATCH-256a94
  objective: >-
    Run alone after both independent reviews have returned, compose their
    per-joint verdicts into one evidence record and one decision, checkpoint
    the goal, and commit exactly those records without changing the frozen
    experiment, inventing a result, or making any transition the reviews do not
    support.
  uncertainty_reduced: >-
    Whether the reconciliation round's outcome, its scope limits, and its
    consequence for the P=512 citation prohibition are durably recorded before
    any official state transition or successor batch.
  inputs:
  - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/reviews/TASK-20260904-e13cf2/validation_report.md
  - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/reviews/TASK-20260904-22e444/red_team_report.md
  - The snapshot-bound producer package and the snapshot receipt from TASK-20260904-47c3ea
  - The review plan on TASK-20260904-1f4e2f, including the recorded coordinator_prior
  - templates/research-records.md and the existing GOAL-SSI-001 head
  constraints:
  - Run alone and stage only the declared ledger archive paths by exact pathspec.
  - Compose the verdicts yourself; each reviewer owned a subset of the joints and neither
    report is a vote on the whole claim. A joint with no verdict is recorded as uncovered,
    never assumed to hold.
  - Run `python3 tools/check_review_independence.py --batch
    coordination/goals/GOAL-SSI-001/batches/BATCH-256a94` before treating the round as
    complete, and record any departure from the review plan in procedure_deviations.
  - State per joint whether the recorded coordinator_prior was confirmed or overturned; a
    prior the review overturned must not be quietly dropped.
  - Record explicitly that the two reviews were session-independent but not
    model-independent, because only the local backend resolved in this environment, so their
    concurrence is correlated by construction.
  - Do not edit experiments/EXP-WESOVOW-001/ or anything under it, and do not reconstruct
    any commit SHA or path hash.
  - 'The evidence record is a reconciliation and review outcome, not a new experiment
    measurement: certificate.kind is none, run_ids names only runs actually read, claim_tier
    may not exceed what arithmetic on committed literals supports, and proof_status and
    proof_refs are set honestly including empirical_only where that is the truth.'
  - NO hypothesis status transition, NO experiment status transition, and NO goal status
    transition. GOAL-SSI-001 remains active and this batch meets no completion criterion.
  - 'Fill knowledge_promotion: promote a KN-FIND only on a support or reject_scoped decision
    backed by replicated or strong evidence, otherwise record a concrete not_warranted
    reason.'
  - If any part of the decision would close a lane, it carries a complete obstruction block
    with a measured quantity, value with units and error bars, source runs, scope, and
    resource_check; without that, do not close.
  - Do not lift the P=512 citation prohibition unless this decision itself lifts it on the
    strength of both independent reports, and then only with the exact scope of the lift
    stated.
  - 'Checkpoint the goal in the write-once shard
    ledger/goals/GOAL-SSI-001/checkpoints/BATCH-256a94.yaml and make exactly one additive
    change to goal.yaml: its single next_action plus the pointer to this decision. Do not
    append new narrative keys to the goal head and do not retrofit existing ones.'
  - Fetch origin/main before committing, merge rather than rebase, record the base commit and
    merge outcome in the receipt, then push and open or refresh the PR against main naming
    EV-SSI-5d954c, DEC-20260904-166ab5, TASK-20260904-e13cf2, TASK-20260904-22e444 and
    BATCH-256a94.
  - 'If a sync conflicts inside an immutable record, do not pick a side: stop and create a
    superseding record under a new identifier.'
  - If the round returned inconclusive, or the producer stopped at RG-0 indeterminate, say so
    plainly; an inconclusive round is a result and is never rewritten into a cleaner history.
  deliverables:
  - ledger_commit_receipt.json
  - ledger/evidence/EV-SSI-5d954c.yaml
  - ledger/decisions/DEC-20260904-166ab5.yaml
  - ledger/goals/GOAL-SSI-001/checkpoints/BATCH-256a94.yaml
  - The single next_action update on ledger/goals/GOAL-SSI-001/goal.yaml
  artifact_paths:
  - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/archives/TASK-20260904-63e06e/ledger_commit_receipt.json
  - ledger/evidence/EV-SSI-5d954c.yaml
  - ledger/decisions/DEC-20260904-166ab5.yaml
  - ledger/goals/GOAL-SSI-001/checkpoints/BATCH-256a94.yaml
  - ledger/goals/GOAL-SSI-001/goal.yaml
  read_scope:
  - AGENTS.md
  - agents/coordinator.md
  - templates/research-records.md
  - docs/claims-and-verification.md
  - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94
  - coordination/goals/GOAL-SSI-001/batches/BATCH-eb0a7e
  - ledger/goals/GOAL-SSI-001
  - experiments/EXP-WESOVOW-001/specification.yaml
  write_scope:
  - coordination/goals/GOAL-SSI-001/batches/BATCH-256a94/archives/TASK-20260904-63e06e
  - ledger/evidence/EV-SSI-5d954c.yaml
  - ledger/decisions/DEC-20260904-166ab5.yaml
  - ledger/goals/GOAL-SSI-001/checkpoints/BATCH-256a94.yaml
  - ledger/goals/GOAL-SSI-001/goal.yaml
  archived_by: TASK-20260904-63e06e
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 1800
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
  - The commit changes exactly the five declared paths and preserves their recorded hashes.
  - Every joint in the review plan has a composed verdict, or is recorded as uncovered.
  - The coordinator_prior is compared against the outcome per joint, and the correlated-review
    limitation is recorded.
  - The evidence record carries claim_tier, proof_status, proof_refs, and certificate.kind
    none, and cites only runs actually read.
  - The decision fills knowledge_promotion, records procedure_deviations, and makes no
    hypothesis, experiment, or goal status transition.
  - The P=512 prohibition is either retained or lifted with an explicit scope, by this
    decision and nothing else.
  - The goal checkpoint shard is written, GOAL-SSI-001 stays active, and exactly one
    next_action remains on the head.
  - The branch is pushed and the PR against main names the new records.
  review_plan: null
