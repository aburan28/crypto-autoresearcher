handoff:
  id: TASK-20260906-a29dee
  id_status: >-
    RESOLVED. The authoring Coordinator session proposed TASK-20260906-9be201
    (hand-generated, no Bash tool available to it). The dispatching
    (top-level) session minted and verified the real id via
    `python3 tools/allocate_id.py --next handoff` followed by `--check`
    (0 occurrences across the union at mint time): TASK-20260906-a29dee. This
    file was renamed and this field updated accordingly before commit, per
    CLAUDE.md's "Do not grep for the next free number" rule.
  from: coordinator
  to: executor
  role: executor
  to_rationale: >-
    Executor, because the deliverable is a bounded, deterministic analytic
    computation (a cost-model evaluation, zero instances) against a frozen,
    already-approved contract (branch (a) status: approved, per
    specification.yaml's own status_enactment_note) with no protocol design
    or hypothesis-status decision left to make. The Coordinator does not run
    experiments (agents/coordinator.md "Authority").

  goal_id: null
  goal_id_note: >-
    Deliberately null, not GOAL-ECDLP-001. RQ-JMV-001 is a STANDALONE track,
    explicitly detached from GOAL-ECDLP-001 and GOAL-CRYPTO-001 by the
    contract's own control C2 ("must not be attached to GOAL-ECDLP-001 or
    GOAL-CRYPTO-001, from which RQ-JMV-001 is explicitly detached") and by
    DEC-20260906-27fa94's rationale (same standalone-track resource-fit
    finding as its sibling DEC-20260906-b083ce). Labelling this task under
    GOAL-ECDLP-001 would itself violate C2's framing discipline.
  question_id: RQ-JMV-001
  experiment_id: EXP-JMV-004
  hypothesis_id: H-JMV-002
  branch_scope: >-
    BRANCH (a) ONLY. Branch (b) (lambda_2 measured by EXP-JMV-003) remains
    BLOCKED per DEC-20260726-002, which also blocks EXP-JMV-003 outright, and
    is explicitly OUT OF SCOPE for this task and this handoff. Nothing in
    this record authorizes, revisits, or comments on EXP-JMV-003 or branch
    (b), exactly as DEC-20260906-27fa94 itself scopes ("This approval covers
    branch (a) ONLY").
  authorized_by: DEC-20260906-27fa94
  authorized_by_note: >-
    This is the ONLY valid authorization citation for this task. It is a
    real, checkable Coordinator approval decision (committed 2026-09-06),
    and covers branch (a) only. It is NOT DEC-20260726-001 -- the
    specification.yaml's own `approved_under` field cites that decision, but
    DEC-20260906-27fa94's context section documents, from an independent
    full read, that DEC-20260726-001 concerns EXP-FCP-001 (a fixed-curve
    preprocessing pilot) and contains zero mentions of JMV, H-JMV-002, or
    arXiv:math/0411378, matching DEC-20260807-5adc24's earlier finding. Do
    not cite DEC-20260726-001 anywhere in this task's artifacts as the
    approval basis; cite DEC-20260906-27fa94.
  supersedes_handoff: >-
    None. This is the FIRST handoff ever filed for EXP-JMV-004, at any
    version or branch. Confirmed this session (and independently confirmed
    by DEC-20260906-27fa94's own context/limitations): no run, manifest, or
    evidence record exists for EXP-JMV-004 at any version, and no prior
    ledger/handoffs/TASK-*.yaml ever cited it.

  objective: >-
    Execute experiments/EXP-JMV-004/specification.yaml (frozen contract,
    version 2, BRANCH (a) status approved) EXACTLY as frozen, branch (a)
    ONLY: convert Corollary 1.2's polylog(q) ORACLE QUERIES into a concrete
    field-operation cost under the fully stated cost model (walk length from
    Proposition 3.1, per-step modular-polynomial cost, the PROVEN
    GRH-conditional explicit-constant Lemma 4.1 bound), across the full
    (q bit size, delta, log convention, per-step variant) grid in
    specification.yaml's inputs block, and determine the CONCRETE NON-VACUITY
    of the proven eigenvalue separation when the model is evaluated at
    q = 2^256. Nothing is instantiated and nothing is measured: q enters only
    as a model parameter. THE RUN STOPS AT THE MODEL, THE GRIDS, AND THE
    CONSTANTS TABLE: no conclusion about vacuity/non-vacuity, about
    Corollary 1.2's status, or about whether a crossover exists may be
    written by this task; that is gated on the independent C1 review, which
    this task does not perform (analysis.md must carry a "C1 STATUS: PENDING"
    banner throughout).

  uncertainty_reduced: >-
    Whether the paper's PROVEN (not merely asymptotic) eigenvalue separation
    yields a non-vacuous walk-length guarantee at deployed field sizes under
    an honestly stated cost model with a declared precomputation term and
    both logarithm/degree conventions reported -- extending the unreviewed
    scouting result in research/JMV004_branch_a_scouting_20260726.md (which
    found the separation "vacuous for small delta at 2^256" and the
    reduction "infeasible" under the paper's own per-step cost at some
    delta) to a complete, artifact-backed run for the first time, with the
    convention-sensitivity and precomputation-cost gaps the scouting script
    left open (per specification.yaml's version-2 tightening) closed.

  inputs:
    - experiments/EXP-JMV-004/specification.yaml
    - ledger/hypotheses/H-JMV-002.yaml
    - ledger/decisions/DEC-20260906-27fa94.yaml
    - experiments/EXP-JMV-004/cost_model.py
    - research/JMV004_branch_a_scouting_20260726.md
    - ledger/questions/RQ-JMV-001.yaml
    - ledger/corrections/CORR-20260906-a6a296.yaml
  inputs_note: >-
    ledger/questions/RQ-JMV-001.yaml and cost_model.py / the research/*.md
    scouting note are read for CONTEXT AND AS THE HELD TRANSCRIPTION SOURCE
    ONLY. RQ-JMV-001.yaml's own `admitted_by`/`approved_experiments`
    citations of DEC-20260726-001 are documented fabrications
    (CORR-20260906-a6a296): do not cite them as this task's authorization.
    cost_model.py and the research/*.md write-up are the SCOUTING
    implementation and result -- "not an approved run, no run record, no
    independent validation. Nothing here may be cited as evidence" per the
    research doc's own banner -- and are inputs to extend/reproduce
    independently, never artifacts to copy forward as this run's output. No
    copy of arXiv:math/0411378v3 itself exists anywhere in this repository's
    inputs/ corpus (verified this session); Theorem 1.1, Corollary 1.2,
    Proposition 3.1's inequality, and Lemma 4.1's bound as transcribed in
    cost_model.py's module docstring and the research note ARE the complete
    "theorem_transcription_artifact" referenced by specification.yaml -- there
    is no separate, cleaner source file. This task must archive that
    transcription VERBATIM as held into source_statements.md per
    required_artifacts, with version/section/equation numbers and an
    explicit UNCHECKED-AGAINST-SOURCE banner; it must not paraphrase it
    (specification.yaml stopping_rules: "A paraphrased theorem cannot be
    digit-level checked").

  constraints:
    - >-
      FROZEN PROTOCOL, NO AMENDMENT. specification.yaml version 2 is frozen
      and approved for branch (a); this task may not alter it in any way.
      Any perceived gap or needed loosening is reported and PROPOSED as a
      versioned protocol_amendment to the Coordinator, never written
      directly (AGENTS.md rule 4).
    - >-
      AUTHORIZED_BY DEC-20260906-27fa94 ONLY, BRANCH (a) ONLY. Do not cite
      DEC-20260726-001 as this task's approval basis in any artifact; see
      authorized_by_note above. Do not treat this authorization as covering
      branch (b) under any circumstance; see branch_scope above.
    - >-
      BRANCH (b) AND EXP-JMV-003 ARE HARD STOPS. If any input, constant, or
      code path would require a value from EXP-JMV-003, STOP and report the
      dependency (specification.yaml stopping_rules). Do not estimate it, do
      not substitute a literature proxy for it, and do not start EXP-JMV-003
      in any form. Executing branch (b) or using any EXP-JMV-003-measured
      constant invalidates the entire run (condition E1 /
      invalidation_rules) -- this is not a partial-credit failure, it
      invalidates everything produced.
    - >-
      SHARED BUDGET POOL -- READ BEFORE COUNTING RUNS. specification.yaml's
      own budget block for THIS experiment is wall_clock_seconds_per_run
      600, total_cpu_hours 1, maximum_runs 5, maximum_memory_gb 2. That is
      NOT an independent allocation: specification.yaml's own
      budget_provenance states it is "funded from the standalone RQ-JMV-001
      track budget (2 CPU-hours, 10 runs total across EXP-JMV-001 and
      EXP-JMV-004 branch (a))" -- i.e. ONE shared pool split between the two
      experiments, where this experiment's 1 CPU-hour / 5 runs is already
      exactly this experiment's half-share of that pool, not an additional
      draw on top of it. THE HAZARD THIS CONSTRAINT NAMES EXPLICITLY: a
      dispatcher who reads the "2 CPU-hours / 10 runs total" language on
      EACH experiment's own spec and treats it as a PER-EXPERIMENT
      entitlement (rather than one pool the two specs both quote) could
      authorize this task's 5 runs / 1 CPU-hour AND EXP-JMV-001's handoff
      for a further, independently-counted 5 runs / 1 CPU-hour on top of
      what each already implies as its half, silently doubling the real
      ceiling to 10 CPU-hours / 20 runs. This task's authorization is capped
      at maximum_runs: 5, wall_clock_seconds_per_run: 600 (<= 1 CPU-hour
      total), maximum_memory_gb: 2, and the dispatching session must track
      this task's actual consumption against the combined RQ-JMV-001 track
      pool (2 CPU-hours / 10 runs total) jointly with whatever EXP-JMV-001's
      sibling handoff (TASK-20260906-e2719b) consumes, before authorizing any
      further run of either experiment.
    - >-
      NO CONCLUSION ABOUT VACUITY OR THE COROLLARY. Per stopping_rules and
      invalidation_rules: the run stops at the model, the grids, and the
      constants table. analysis.md must carry a "C1 STATUS: PENDING" banner
      at the top throughout. No artifact may state that the separation is
      vacuous or non-vacuous, that Corollary 1.2 is or is not concretely
      proven, or that a crossover does or does not exist, before the C1
      review completes. Asserting Corollary 1.2 is FALSE (rather than
      concretely unproven at evaluated parameters) invalidates the analysis
      unconditionally, at any time.
    - >-
      NOT A REVIEW TASK. This task does NOT satisfy control C1 (the
      digit-level transcription-fidelity gate). It archives the four source
      statements with a required UNCHECKED-AGAINST-SOURCE banner and stops;
      the C1 review by a reviewer who did not produce the transcription is a
      SEPARATE, later Coordinator-dispatched task and is a precondition this
      task's completion does not satisfy.
    - >-
      BOTH LOGARITHM CONVENTIONS, BOTH DEGREE-RECONCILIATION STATEMENTS,
      BOTH PER-STEP VARIANTS. Reporting one logarithm convention without the
      other invalidates the conclusion (E2). A result that flips sign
      between conventions is reported as CONVENTION-DEPENDENT, never as a
      result.
    - >-
      PRECOMPUTATION TERM MUST BE STATED EXPLICITLY (E4). A cost that
      silently assumes free precomputation for Phi_l is not a cost and
      invalidates the cost model.
    - >-
      EVERY CONSTANT TRACEABLE TO A CITED SOURCE (CTRL-CONSTANT-PROVENANCE).
      No constant invented or silently set to 1; if one is fixed by choice,
      the choice and its effect on the sign of log(k/c) must be reported.
    - >-
      EVERY QUANTITATIVE STATEMENT LABELLED GRH-CONDITIONAL (CTRL-GRH).
      Nothing here confirms or disconfirms GRH.
    - >-
      THE EXP-JMV-005 TOY SANITY ANCHOR DOES NOT EXIST (CTRL-SANITY-DEFERRED).
      It must not be reported as attempted, passing, or failing; EXP-JMV-005
      is unapproved.
    - >-
      Claim tier is `not_applicable` / type `theoretical` / proof_status
      `derivation`, per condition E3 -- NEVER `crypto` or any other tier, on
      this experiment or on any record derived from it, whatever q the model
      is evaluated at. Zero instances are tested at any size.
    - >-
      Exact rational or high-precision arithmetic is mandatory for the sign
      of log(k/c); a sign from double-precision floating point at a cell
      where |log(k/c)| is small is not a result. The precision used must be
      stated in the manifest.
    - >-
      No attack framing of any kind; not attached to GOAL-ECDLP-001 or
      GOAL-CRYPTO-001; no statement that this bears on GRH, ECDLP hardness,
      attack cost, or the D1/BAR-AMORT-D2 barriers (control C2).
    - >-
      Timeouts and crashes are infrastructure signals, never negative
      results, per specification.yaml's own stopping_rules and AGENTS.md
      rule 3.
    - >-
      Workers never commit. All artifacts are written only inside
      write_scope; the Coordinator alone performs the snapshot and ledger
      archival commits.

  deliverables:
    - "experiments/EXP-JMV-004/runs/<RUN-ID>/manifest.yaml"
    - "experiments/EXP-JMV-004/runs/<RUN-ID>/raw.json"
    - "experiments/EXP-JMV-004/runs/<RUN-ID>/stderr.txt"
    - "experiments/EXP-JMV-004/runs/<RUN-ID>/analysis.md"
    - "experiments/EXP-JMV-004/runs/<RUN-ID>/crossover.csv"
    - "experiments/EXP-JMV-004/runs/<RUN-ID>/cost_model.md"
    - "experiments/EXP-JMV-004/runs/<RUN-ID>/constants_table.csv"
    - "experiments/EXP-JMV-004/runs/<RUN-ID>/source_statements.md"
  deliverables_note: >-
    Exact required_artifacts list from specification.yaml, verbatim.
    cost_model.md is the experiment's own declared `proof_refs` target
    (type: theoretical, proof_status: derivation) and must carry the single
    stated degree convention with its written reconciliation to Prop 3.1 and
    Lemma 4.1 (E2), the explicit precomputation term or declared assumption
    with storage figures (E4), the named cost unit, and GRH conditionality.
    <RUN-ID> is assigned by the Executor at run time.

  artifact_paths:
    - experiments/EXP-JMV-004/runs/
  artifact_note: >-
    Canonical index artifact declared at open, per the deliverables list
    above; the exact per-run-ID file inventory is amended into this task's
    artifact_paths after the Executor's terminal receipt and BEFORE the
    Coordinator's snapshot archive binds.

  write_scope:
    - experiments/EXP-JMV-004/runs/
  write_scope_note: >-
    Non-overlapping with EXP-JMV-001's sibling task (TASK-20260906-e2719b),
    which writes only under experiments/EXP-JMV-001/runs/. This task writes
    nothing under ledger/, nothing under experiments/EXP-JMV-004/specification.yaml,
    nothing under experiments/EXP-JMV-001/, and nothing that starts,
    pilots, or partially runs EXP-JMV-003 in any location.

  review_required: true
  review_required_note: >-
    Claim-relevant producer task (AGENTS.md "Dynamic dispatch"): it produces
    a cost-model evaluation bearing on the concrete (non-)vacuity of a
    published corollary. Per AGENTS.md rule 12 and specification.yaml's own
    notes, a claimed vacuity of a published corollary requires independent
    review-xhigh review by an agent that did not originate the claim, PLUS
    the separate C1 reviewer who did not produce the transcription
    (specification.yaml control C1). Neither review is opened by this
    handoff; the Coordinator must author a `review_plan` and dispatch both
    before any evidence-review decision is recorded on this run's output.
    review_plan is null here because this handoff is the PRODUCER task, not
    the review round.

  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: true
    fallback_reason_if_used: >-
      Record the resolved model with fallback_used true and its reason if
      the harness cannot resolve the canonical policy alias. Never
      substitute silently (AGENTS.md rule 11).
    degraded_allowed: false
    independent_session_required: false

  budget:
    wall_clock_seconds: 600
    memory_gb: 2
    maximum_runs: 5
  budget_note: >-
    Exactly specification.yaml's own budget block for this experiment
    (wall_clock_seconds_per_run 600, maximum_memory_gb 2, maximum_runs 5,
    total_cpu_hours 1). This is this experiment's half-share of the combined
    RQ-JMV-001 track pool (2 CPU-hours / 10 runs total); see the
    shared-budget constraint above. Do not raise maximum_runs above 5 for
    this task under any reading of the shared-pool language.

  completion_gate:
    - >-
      All 8 required_artifacts present under a single <RUN-ID> directory (or
      one directory per run if more than one run is executed within the
      5-run cap), each matching specification.yaml's manifest_requirements
      (inference block with requested_policy/resolved_model/fallback_used;
      exact software versions and arbitrary-precision settings, with any
      floating-point use declared with its precision; explicit
      seeds-not-applicable statement; explicit statement that branch (b) was
      not executed and no EXP-JMV-003 value was consumed).
    - >-
      The complete (q bit size, delta, log convention, per-step variant)
      grid from specification.yaml's inputs block is covered in crossover.csv,
      with the sign of log(k/c) per cell under BOTH logarithm conventions,
      modelled overhead and its ratio to sqrt(n), and either a crossover bit
      size or an explicit no-crossover statement.
    - >-
      cost_model.md states the single degree convention with its written
      reconciliation to Prop 3.1/Lemma 4.1, both logarithm conventions
      computed side by side, the explicit precomputation term or declared
      assumption with storage figures, the named cost unit, and GRH
      conditionality on every quantitative statement.
    - >-
      constants_table.csv lists every implied constant with its source,
      statement number, and the hypotheses under which it holds; no constant
      invented or silently fixed without disclosure.
    - >-
      source_statements.md carries the verbatim Theorem 1.1, Corollary 1.2,
      Proposition 3.1 inequality, and Lemma 4.1 bound and normalization, with
      version/section/equation numbers, provenance, and an explicit
      UNCHECKED-AGAINST-SOURCE banner.
    - >-
      analysis.md carries the "C1 STATUS: PENDING" banner throughout and
      contains no statement of vacuity/non-vacuity, no claim about
      Corollary 1.2's truth or falsity, and no crossover conclusion.
    - >-
      No cell's sign is reported as a result when it flips between
      conventions; such cells are reported as convention-dependent.
    - >-
      No claim_tier other than `not_applicable` (type `theoretical`,
      proof_status `derivation`) appears anywhere in the run's artifacts.
    - >-
      Manifest and analysis.md both explicitly confirm branch (b) was not
      executed and no EXP-JMV-003 value was consumed.
    - >-
      Artifacts exist only under write_scope; nothing is committed by the
      Executor. A Coordinator snapshot archival task, run alone, stages
      exactly these artifacts, and the post-commit verifier accepts the
      receipt before this result is treated as durable (AGENTS.md;
      CLAUDE.md).

  archived_by: TASK-20260906-426de9
  archived_by_note: >-
    Allocated and verified free by the dispatching session
    (`tools/allocate_id.py --next handoff` then `--check`, 0 occurrences at
    mint time). TASK-20260906-426de9 is the single Coordinator-run snapshot
    archival task covering both this handoff's and EXP-JMV-001's sibling
    handoff's (TASK-20260906-e2719b) producer output, dispatched together as
    one batch. That archival task's own record is authored when the
    Coordinator performs the snapshot commit, per AGENTS.md's archival
    discipline (isolated snapshot before ledger commit).

  return_format: >-
    A short structured summary naming: the run id(s) actually executed (up
    to 5, within the 600s/run, 2GB, 1-CPU-hour cap); the crossover.csv grid
    coverage and cell count; the degree convention adopted and its
    reconciliation; the precomputation assumption made; confirmation that
    source_statements.md carries the complete verbatim transcription with
    its UNCHECKED-AGAINST-SOURCE banner and that analysis.md carries the
    "C1 STATUS: PENDING" banner; explicit confirmation that branch (b) and
    EXP-JMV-003 were not touched; cumulative wall-clock and CPU-hours
    consumed BY THIS TASK, stated explicitly so the dispatching session can
    reconcile it against the shared RQ-JMV-001 track pool alongside
    EXP-JMV-001's consumption; and confirmation that no vacuity/non-vacuity
    or Corollary 1.2 conclusion language was used anywhere. If any
    convention-flip or invalidation_rule was triggered, report it plainly,
    not as a directional finding.
