handoff:
  id: TASK-20260801-017
  from: coordinator
  to: red-team
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-022
  objective: >-
    Challenge any reading of this measurement stronger than a toy-scoped distributional
    observation, IN BOTH DIRECTIONS AND WITH EQUAL FORCE. If the sample looks consistent
    with Dickman, attack that - name every way the apparatus could manufacture
    agreement, starting with the possibility that the encoding rather than the Semaev
    map is producing near-uniformity, and say whether the power certificate genuinely
    establishes that the statistic could have rejected. If the sample looks like a
    deviation, attack that at least as hard - name every non-structural channel that
    could produce it, including the degenerate diagonal half-tuples, the finite factor
    base, the recomputed-u rounding, the range relationship between [1, p**2] and D, and
    any bias in the null stream. Then state whether the frozen reading rule was applied
    honestly or whether the result was read into a branch it does not belong in, AND
    WHETHER THE ATTAINABILITY ARGUMENT HELD UP AGAINST THE ACTUAL DATA - that is,
    whether the branch that fired was one your own arithmetic confirms was reachable,
    and whether any branch that did NOT fire turns out to have been unreachable after
    all.
  uncertainty_reduced: >-
    Whether this measurement genuinely bears on HEUR-DS-1, or whether a third
    explanation - the encoding, the apparatus, the finite factor base, or the sampling
    design - survives.
  inputs:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-022/archives/TASK-20260801-015/snapshot_commit_receipt.json
  - experiments/EXP-SMTH-001/specification.yaml
  - ledger/hypotheses/H-SMTH-001.yaml
  - ledger/hypotheses/H-DS-001.yaml
  - ledger/evidence/EV-DS-004.yaml
  - ledger/decisions/DEC-20260801-005.yaml
  - ledger/decisions/DEC-20260801-006.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-021/reviews/TASK-20260801-008/red_team_report.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-022/reviews/TASK-20260801-012/attainability_check.md
  constraints:
  - INDEPENDENT SESSION.
  - >-
    SYMMETRY IS MANDATORY. Premature closure is a failure mode symmetric with
    overclaiming (docs/inventor-protocol.md section 4). Attack a negative-looking
    result exactly as hard as a positive-looking one.
  - >-
    AUDIT THE ATTAINABILITY ARGUMENT AGAINST THE ACTUAL DATA and say plainly whether
    any band or branch turned out unreachable after all. This is the BATCH-021 defect
    RT048-B2 and you are the last line on it.
  - >-
    reject_scoped-as-impossibility is forbidden on this package under every branch; so
    are S1_met, F1_met, F2_met, structure_gate_passed, support for H-SMTH-001 or
    H-DS-001, HEUR-DS-1 validation or refutation above the toy tier, any asymptotic or
    crypto-scale claim, and any affected-scheme statement.
  - >-
    dominated_by may not be null; carry a quantitative sota_delta, and note that for a
    distributional measurement the relevant frontier row is the published
    Dickman-de Bruijn law itself rather than any algorithm.
  - >-
    Carry RT047-B5, RT048-B1, RT048-B2, RT048-B5, RT048-B9, RT048-H1, RT048-H2 and
    RT048-M1 forward and state each one's status, saying explicitly whether RT048-H1
    and RT048-H2 are discharged, partially discharged or still open after this run.
  - Say explicitly whether the reading rule was applied as frozen or bent to the data.
  - >-
    Attack the claim that INT-1 is the intermediate rather than a stand-in, with the
    same force RT047-H2 applied to the previous sampling.
  - Toy stays toy; promotion gates G1-G4 remain OPEN unless you prove otherwise with archived artifacts.
  - Do not alter H-SMTH-001, H-DS-001, H-IC-001 or H-STR-002.
  - MAKE NO COMMIT.
  deliverables:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-022/reviews/TASK-20260801-017/red_team_report.yaml
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-022/reviews/TASK-20260801-017/red_team_report.yaml
  archived_by: TASK-20260801-018
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 5400
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
  - >-
    Blocking constraints, an explicit post-hoc audit of the attainability argument, the
    narrowest supported statement, dominated_by, a quantitative sota_delta, the next
    required control, and a recommended disposition all recorded.
