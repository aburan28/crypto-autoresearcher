handoff:
  id: TASK-20260826-82c660
  from: coordinator
  to: executor
  goal_id: GOAL-DIFFP-84d641
  batch_id: BATCH-171407
  question_id: RQ-DIFFP-a5c483
  experiment_id: EXP-DIFFP-f26790
  objective: >-
    Implement and run EXP-DIFFP-f26790 exactly, in its declared gated order, writing ONE new
    module and ONE new test file and MODIFYING NOTHING under harness/.
    ARM (a): implement the per-instrument forcing predicate FROM THE CONTRACT'S WRITTEN
    STATEMENT, measuring BOTH admissible composition orders and reporting both; run CTL-FORCE-PI
    two-sided; then adjudicate every cell not forced for each instrument against the honest
    instrument and the REUSED O-E, reporting the differing count beside its denominator and every
    exclusion's forcing edge.
    ARM (b): construct the consistent-pair flag-and-dv family, gate it two-sided under
    CTL-PAIR-WF, measure its ACTUAL moved-component set against its declared one under
    CTL-PAIR-DECL, and -- gated on constructibility -- adjudicate its cells.
    Then CTL-READMIT-NULL through the identical counting path with the pinning field, and
    CTL-FROZEN-4 post-run. REPORT TABLES AND INTEGERS WITH THEIR POPULATIONS AND DENOMINATORS,
    NEVER A PASS.
  uncertainty_reduced: >-
    Whether the single differing cell RT-J8-4 measured is a property of the per-instrument
    forcing RULE or of one session's IMPLEMENTATION of it -- and whether a family that perturbs
    the flag and the dv together so the pair stays mutually consistent can be built at all, and
    if so whether it populates cells the existing family set cannot reach. BOTH ANSWERS ARE
    RESULTS AND THE CONTRACT PRE-REGISTERS BOTH BEFORE ANY RUN.
  inputs:
    - 'experiments/EXP-DIFFP-f26790/specification.yaml -- the frozen contract; every hard term, control, invalidation rule, gate, seed, pre-registration and criterion is binding. DO NOT BEGIN UNTIL ITS APPROVING coordinator_decision DEC-20260826-5aaddc IS COMMITTED.'
    - 'The committed adjudicator package under harness/diffpath/ INCLUDING depgraph.py and controlpower.py, plus harness/__init__.py and harness/runner.py -- READ-ONLY INPUTS. Recompute their digests yourself (CTL-FROZEN-4).'
    - 'The EIGHT declared seeds inherited byte-identically with a top-level seed of 84064107. NO NINTH SEED EXISTS OR MAY BE CREATED.'
    - 'coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7/reviews/TASK-20260824-e9d21a/constructions/rt_instruments.py and j8_results.json -- O-E is REUSED FROM HERE, not rebuilt (IR-11). This is BATCH-efcae7 and is NOT the forbidden path.'
    - 'coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-145531/tasks/TASK-20260824-68ba87/offdiagonal-matrix-result.json and dependency-graph-result.json -- the six forced cells with their forcing edges, the 9 + 27 = 36 exclusion split, and the four derived_and_witnessed edges E1..E4.'
    - 'ledger/decisions/DEC-20260824-257f35.yaml and ledger/evidence/EV-DIFFP-afd96c.yaml -- the STATEMENT of the control being replicated, the identity of the differing cell and the integer 1 of 30. READ THESE: they are committed research records and you must know what you are replicating.'
    - 'The corrections CORR-20260824-cc2d27, -e0088c, -c1c8b1, -a6fc43, -ad7f2c and CORR-20260826-f170d2 -- read them before quoting any integer from a batch-1, batch-2 or batch-3 artifact.'
  constraints:
    - >-
      DO NOT READ, OPEN, IMPORT, COPY, EXECUTE, DIFF OR RECONSTRUCT ANYTHING UNDER
      coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-145531/reviews/TASK-20260824-7d9f92/constructions.
      THAT IS THE ONE IMPLEMENTATION THAT HAS EVER COMPUTED THIS CONTROL AND THIS TASK EXISTS TO
      REPLICATE IT INDEPENDENTLY. Implement the forcing predicate from the contract's written
      STATEMENT. ATTEST BY MECHANISM where a mechanism exists -- a run-time assertion, a recorded
      traversal-root list -- and by an honest boolean where it does not, AND SAY WHICH.
    - 'DO NOT MODIFY ANY COMMITTED FILE UNDER harness/ (IR-2). Only harness/diffpath/readmit.py and tests/test_diffpath_readmit.py may be written. CTL-FROZEN-4 measures this and its failure is a STOP.'
    - 'ARM (a) CONSTRUCTS NOTHING NEW (H-2). Reuse the six forced cells, the three constructible families and the existing draw sets; no new seed, no new family, no acquisition.'
    - 'MEASURE BOTH COMPOSITION ORDERS AND REPORT BOTH. Choosing an order after seeing which gives a nonzero count is an IR-6 violation.'
    - 'RUN THE NULL-OBJECT CONTROLS BEFORE YOU BELIEVE ANYTHING (H-6). If CTL-FORCE-PI''s identity known-answer fails, or the forced set is invariant across every instrument, NO RE-ADMITTED COUNT IS REPORTED AT ALL.'
    - 'EVERY EXCLUDED CELL CARRIES THE FORCING EDGE THAT EXCLUDES IT, PER INSTRUMENT AND PER PRIMITIVE, and every cited edge is one of the four derived_and_witnessed edges (H-3). DO NOT INHERIT RT-J8-4''S DENOMINATOR OF 30; DERIVE YOUR OWN AND REPORT THE DERIVATION (H-13).'
    - >-
      A PER-PRIMITIVE QUANTITY IS COMPUTED PER PRIMITIVE (H-12). BATCH-145531's probing_profile()
      was computed once over both primitives and indexed inside the per-primitive loop, so both
      branches got an identical primitive-blind profile. State for each emitted per-primitive
      field that it was computed per primitive.
    - 'EVERY EMITTED RULE TEXT MUST BE TRUE OF THE FUNCTION THAT EMITS IT (H-7). A reader must be able to reproduce every cell from the artifact''s own account of its rule.'
    - 'IF THE CONSISTENT-PAIR FAMILY IS NOT CONSTRUCTIBLE, REPORT IT AS NOT CONSTRUCTIBLE WITH ITS DERIVATION AND THE GATE CLAUSE THAT REJECTED IT, AND NEVER AS A FAMILY THAT PRODUCED ZERO DETECTIONS.'
    - 'REPORT arm_was_arithmetically_pinned FOR EACH DEGENERATE ARM WITH THE COUNT THAT MAKES IT SO. Round 3''s always_non_member arm was pinned at 0 because the honest instrument reported DETECTED on zero adjudicated cells, so it could not fail and its met extreme was bookkeeping.'
    - 'NEVER REPORT A PASS OR A BARE FRACTION (IR-10, H-5). Every count appears beside its denominator, its exclusion list and every exclusion''s reason.'
    - 'EVERY EDGE, CELL AND VERDICT CARRIES ITS PRIMITIVE SCOPE AND THE CENSUS COMPLETENESS BESIDE IT (H-4), never summed.'
    - 'EMIT `null` AND NEVER 0 FOR AN UNMEASURED CELL, COLUMN, MODE OR INSTRUMENT (H-8), AND NAME AGGREGATE KEYS AS AGGREGATES (H-9).'
    - 'DERIVE THE STRICT KEY COMPONENT LIST AT RUN TIME FROM THE COMMITTED SERIALISER (IR-13). A difference from the six names is a STOP and a finding about the contract.'
    - 'REUSE O-E, DO NOT REBUILD IT (IR-11). Any mechanical re-expression is checked against j8_results.json and a disagreement is a STOP.'
    - 'WRITE EVERY DECLARED RESULT FILE EVEN IF ITS RUN IS GATED-NOT-RUN OR STOPPED, carrying that status, the gate that fired, and nulls.'
    - >-
      WRITE RUNS TO experiments/EXP-DIFFP-f26790/runs/<RUN-ID>/ (H-10), THEN RUN
      tools/validate_ledger.py AND RECORD ITS OUTPUT VERBATIM BEFORE THE SNAPSHOT, whether it
      passes or fails. If check_run rejects a manifest, DO NOT edit harness/runner.py and DO NOT
      hand-edit a manifest: write a manifest-supplement.yaml with the full AGENTS.md Artifact
      Policy field set, report the rejection verbatim as an INFRASTRUCTURE FINDING, and continue.
    - 'WHILE THE ROUND IS OPEN, NAME COMMITS BY ROLE AND NOT BY SHA IN ANY ARTIFACT A REVIEWER WILL READ, and describe no commit''s contents (BR-10).'
    - 'DO NOT READ coordination/goals/GOAL-DIFFP-84d641/sealed-priors/** (IR-14). The Coordinator''s prior is sealed and is not yours.'
    - 'DO NOT READ, PARSE, EXTRACT, FETCH OR RECONSTRUCT coordination/goals/GOAL-MD5-001/quarantine/** OR THE SAME CONTENT BY ANY OTHER ROUTE (IR-1). Attest non-reading AND NAME THE MECHANISM.'
    - 'NO NETWORK ACQUISITION BY ANY ROUTE (IR-3). You hold run_commands and deliberately NOT web_search; fetching via the shell would route around a declared role boundary.'
    - 'NO SEARCH OVER EITHER DIFFERENCE SPACE, no collision attempt, no cost projection (IR-4).'
    - 'DO NOT REPAIR A CONTROL IN-RUN AFTER SEEING ITS DATA (IR-6). Changing a family, a projection, a seed, a criterion, an exclusion rule, a composition order or the counting rule after observing an outcome requires a versioned protocol_amendment.'
    - 'A TIMEOUT, CRASH, CEILING HALT OR IMPLEMENTATION FAILURE IS INFRASTRUCTURE SIGNAL, never a negative mathematical result and never a finding about the instrument (IR-16, AGENTS.md rule 5). Report unspent ceilings AS UNSPENT.'
    - 'IF YOU FIND YOURSELF MEASURING WHETHER A CHARACTERISTIC-SEARCH SOLVER WORKS, STOP and report the observation for handoff to GOAL-MD5-001 (IR-9).'
    - 'Attempt search_knowledge before any assertion about what has or has not been tried, and record queries and outcomes verbatim. An empty or unavailable index licenses no inference.'
    - 'RECORD OBSERVATIONS ONLY (IR-8, H-11). Compose no verdict on whether the replication succeeded, on what it bought, on whether any path is new, or on either difference space.'
    - 'Every run manifest carries code_path_fingerprint, an armed deadline and the LITERAL id EXP-DIFFP-f26790 at both run.experiment_id and run.inputs.parameters.experiment_id (IR-7).'
    - 'Never Amazon Bedrock in any runtime, backend, endpoint, fallback or probe (AGENTS.md rule 16).'
  deliverables:
    - 'harness/diffpath/readmit.py -- the ONLY new module: the per-instrument forcing predicate implemented from the statement under both composition orders, the consistent-pair family constructor, the per-instrument cell selector, the two degenerate instruments through the identical counting path, and the drivers. It imports the committed modules and modifies none.'
    - 'tests/test_diffpath_readmit.py -- a NEW dedicated test file covering the forcing predicate against the identity known-answer and against a moving instrument, the consistent-pair gate on both sides, and the counting rule against both degenerate instruments. NO EXISTING TEST FILE IS EDITED.'
    - 'forcing-predicate-per-instrument.json -- the forced set per instrument, per primitive, per composition order, each cell''s forcing edge, and the CTL-FORCE-PI two-sided result.'
    - 'readmitted-cells-result.json -- the per-cell verdict pair for every re-admitted cell, the differing count beside its denominator, the excluded list with reasons and edges, and the honest-DETECTED cell count.'
    - 'consistent-pair-family-result.json -- constructibility per primitive, the two-sided gate result, the declared perturbation text and the MEASURED moved-component set.'
    - 'consistent-pair-cells-result.json -- the per-cell table for the consistent-pair family, or the file written with status GATED-NOT-RUN, its gate named and nulls.'
    - 'readmit-null-object-result.json -- both degenerate instruments through the identical counting path, each with arm_was_arithmetically_pinned and the count that makes it so.'
    - 'frozen-recheck-4-result.json -- CTL-FROZEN-4 before and after, with this contract''s own required new artifacts reported SEPARATELY and never inside the criterion set.'
    - 'independence-attestation.json -- the forbidden path named literally, the run-time assertion and its result, every traversal root used, and whether non-reading is MECHANICALLY DEMONSTRATED or ATTESTED.'
    - 'run-index.json -- a sha256 for every file of every executed run.'
    - 'execution-report.yaml -- headline is the per-instrument cell table and NEVER a pass; the verbatim tools/validate_ledger.py output measured after the runs exist and before the snapshot; the quarantine attestation with its mechanism; the search_knowledge log verbatim; every deviation declared; unspent ceilings AS UNSPENT; and closing with the explicit statement that NO PATH IS CLAIMED NEW, NO SEARCH WAS RUN, NO SOURCE WAS ACQUIRED, NO COMMITTED INSTRUMENT WAS REPAIRED, AND THE MD5 LANE IS BLOCKED RATHER THAN CLOSED.'
    - 'Run directories under experiments/EXP-DIFFP-f26790/runs/<RUN-ID>/ for every executed run, with manifest-supplement.yaml wherever the wrapper''s inference block is incomplete.'
  artifact_paths:
    - harness/diffpath/readmit.py
    - tests/test_diffpath_readmit.py
    - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-171407/tasks/TASK-20260826-82c660/execution-report.yaml
    - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-171407/tasks/TASK-20260826-82c660/forcing-predicate-per-instrument.json
    - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-171407/tasks/TASK-20260826-82c660/readmitted-cells-result.json
    - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-171407/tasks/TASK-20260826-82c660/consistent-pair-family-result.json
    - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-171407/tasks/TASK-20260826-82c660/consistent-pair-cells-result.json
    - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-171407/tasks/TASK-20260826-82c660/readmit-null-object-result.json
    - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-171407/tasks/TASK-20260826-82c660/frozen-recheck-4-result.json
    - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-171407/tasks/TASK-20260826-82c660/independence-attestation.json
    - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-171407/tasks/TASK-20260826-82c660/run-index.json
  archived_by: TASK-20260826-30e97f
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 330
    memory_gb: 4
    maximum_runs: 4
  completion_gate:
    - 'CTL-FROZEN-4 reports identical digests before and after over a criterion set that EXCLUDES this contract''s own required new artifacts, or the run stopped and named the file that changed.'
    - 'CTL-FORCE-PI is reported TWO-SIDED: the identity forced set against the committed six cells with each forcing edge, AND whether the forced set varies across instruments. Either side failing is a STOP and no re-admitted count is reported.'
    - 'Both composition orders are measured and both are reported, with a statement of whether they agree.'
    - 'CTL-READMIT reports the per-cell verdict pair for every re-admitted cell, per instrument and per primitive, with the differing count beside its denominator and every exclusion''s forcing edge named -- or the run is reported GATED-NOT-RUN with its result file written and its gate named.'
    - 'CTL-PAIR-WF is two-sided and its result is reported per primitive; if the family is not constructible that is reported WITH ITS DERIVATION and the gate clause, and never as zero detections.'
    - 'CTL-PAIR-DECL reports the DECLARED perturbation text beside the MEASURED moved-component set per primitive, with any discrepancy reported as a first-class finding.'
    - 'CTL-READMIT-NULL reports both degenerate arms through the identical counting path, each carrying arm_was_arithmetically_pinned and the count that makes it so.'
    - 'CTL-O-E-REUSE reports agreement with j8_results.json on all 30 committed comparisons, or the run stopped.'
    - 'independence-attestation.json exists, names the forbidden path literally, and states whether non-reading is MECHANICALLY DEMONSTRATED or ATTESTED.'
    - 'tools/validate_ledger.py was run AFTER the run directories existed and BEFORE the snapshot, and its output is in the execution report VERBATIM.'
    - 'Quarantine non-reading attestation present and naming its mechanism; every manifest carries code_path_fingerprint, an armed deadline and the literal id EXP-DIFFP-f26790; run-index.json carries a sha256 for every file of every executed run; every declared result file exists; unspent ceilings reported as unspent; and the report closes with the no-novelty, no-search, no-acquisition, no-repair statement.'
  return_format: >-
    Paths written, the per-instrument forced sets under both composition orders, the re-admitted
    cell table with its differing count and denominator, the consistent-pair family's
    constructibility and its measured moved-component set, its cell table or its gate, both
    degenerate arms with their pinning fields, the independence attestation and its mode, the
    verbatim validate_ledger output, and every stop or deviation with its named cause and its
    measured wall clock.
  review_plan: null
