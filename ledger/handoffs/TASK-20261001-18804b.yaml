    - Do not edit AUXIN records or paths.
    - Do not change H/EXP/IDEA status fields; observations only.
    - Do not invent identifiers; mint run ids via allocate_id if needed.
    - Timeouts/crashes are failed_infrastructure, never negative math evidence.
