    lattice, preregistered predictions; Stage 1 primary toy pair
    ((d,k)=(2,17) vs n=37) curve construction with order verification;
    Stage 4 f certificates for n=37 (expect 2) and n=31 contrast (expect 7).
    Optionally probe WDSat for Stages 2–3; if absent write
    instrument_unavailable. Record all artifacts under the experiment
    write_scope. Do not interpret or change hypothesis status. Do NOT
    claim a break or rho competitiveness. Do NOT treat n=31 as a null arm.
