      pure cost observations use none unless a verified decomposition is
      independently re-checked.
    - No scientific attack runs at deployed n>=131.
    - Do NOT claim a break or rho competitiveness.
    - instrument_unavailable for Stage 2/3 is infrastructure (DO-6), not reject_scoped.
