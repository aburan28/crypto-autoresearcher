handoff:
  id: TASK-20260903-b1653a
  from: coordinator
  to: idea-generator
  objective: >-
    Dispose of, or sharpen, disjunct D2 of ECDLP-IDEA-436's hypothesis H --
    the one half of that disjunction still not gated. D2 asks whether a fixed
    statistic T of the precision-r coordinate digits of a SINGLE lifted point
    [k]S_hat can be a nonconstant "homomorphism-like" map <S> -> (small
    target). Split the question into the strict-homomorphism reading and the
    genuinely "-like" residue, and report which half (if either) this
    program's existing corpus already closes.
  uncertainty_reduced: >-
    Whether D2 is closable now from results this program already holds, or
    whether it names a genuinely open object requiring new work. D1 was
    disposed and its implementation-independence discharged
    (DEC-20260903-256c7c); D2 is the remaining half of H and has never been
    gated, only assessed at a weaker relative tier on the strength of a move
    (M1) that the anomalous-curve control subsequently BROKE.
  inputs:
    - AGENTS.md
    - agents/idea-generator.md
    - docs/inventor-protocol.md
    - docs/target-result-profile.md
    - templates/research-records.md
    - >-
      ideas/artifacts/ECDLP-IDEA-436/ggm_simulability_gate_erratum_20260831.md
      -- READ Part 2 of section B (D2 NOT GATED, returned to the record) and
      section I item 3 (the D2 residue). These state the sub-question verbatim
      and attach the KN-TECH-033 bar to it.
    - ideas/ECDLP-IDEA-436_local_torsion_coordinate_valuation_profile_hypothesis.md
    - knowledge/findings/KN-FIND-ffe1df.md (Theorem C -- the prime-order / no-nontrivial-quotient argument, Validator-confirmed)
    - knowledge/techniques/KN-TECH-73630e.md (the lift is information-theoretically empty; S_hat is a deterministic function of S)
    - knowledge/techniques/KN-TECH-033.md (the "name your coincidence" bar, carried WITH that record's own self-label that the reading is a framing, not a result)
    - knowledge/findings/KN-FIND-1ba0fe.md (the disposed D1 half, for contrast -- D2 is a DIFFERENT object)
    - ledger/decisions/DEC-20260903-256c7c.yaml
    - ledger/decisions/DEC-20260902-4c82fd.yaml
  constraints:
    - >-
      SPLIT THE QUESTION FIRST. (a) STRICT reading: T is an actual group
      homomorphism <S> -> G for some group G with |G| < n. (b) "-LIKE"
      residue: everything the erratum's deliberately looser phrase
      "homomorphism-like" admits that is NOT an actual homomorphism --
      approximate, partial, statistical, or structure-preserving-on-a-subset
      maps. Report on both halves separately; do not let a clean verdict on
      one silently stand in for the other.
    - >-
      ASSESS, DO NOT ASSUME, whether KN-FIND-ffe1df's Theorem C applies to
      the strict reading. Its core is that a surjective homomorphism onto a
      smaller structure is impossible when the source has PRIME order. State
      explicitly whether <S> (prime order n) and the D2 target satisfy that
      argument's hypotheses. If it applies, say so and cite it precisely
      rather than re-deriving it. If it does NOT apply, say exactly why --
      that would be the more interesting finding.
    - >-
      For the "-like" residue, apply KN-TECH-033's bar: a proposal must NAME
      ITS COINCIDENCE for an ORDINARY curve. Carry that record's own
      self-label -- it states the representation-attack reading is this
      program's own interpretation, a framing and not a result. Do not
      present the bar as stronger than its source does.
    - >-
      Respect the standing information-theoretic boundary: KN-TECH-73630e
      establishes S_hat is a deterministic function of S, so ANY statistic of
      S_hat's digits is a deterministic function of data the querying party
      already holds. Whatever D2 could offer is therefore COMPUTATIONAL at
      most, never informational. Any candidate claiming otherwise is refuted
      before it is costed.
    - >-
      Apply docs/inventor-protocol.md's lossy-projection test and a
      null-object control to any surviving candidate. If your argument for
      closing a reading would also close a nearby object where the conclusion
      is KNOWN FALSE, it proves too much and is wrong -- report that outcome
      explicitly.
    - 'Zero compute. No commands, no experiments, no implementation. experiment_maximum_runs is 0.'
    - >-
      Create no B71/H-*/EXP-*/EV-*/DEC-*/KN-*/CORR record and change no
      status. Propose; the Coordinator ranks and admits.
    - >-
      Citation provenance mandatory: recalled | retrieved | kb | internal on
      every source. Do not fabricate a citation.
    - >-
      YAML hygiene, independently re-checked with a strict parser: no plain
      scalar containing an unescaped double-quote or a colon-followed-by-space
      (single-quote the WHOLE scalar if needed); no duplicate keys at any
      nesting level; no bare mapping key inside a block sequence without a
      leading '-'. This defect class has broken artifacts repeatedly on this
      goal.
  deliverables:
    - >-
      d2-disposition.yaml: the split verdict. For the STRICT reading, whether
      it is closed and by exactly what; for the "-LIKE" residue, either a
      named surviving candidate with its coincidence named for an ordinary
      curve, or an honest statement that the residue is open with the
      cheapest next probe identified. State plainly if the two halves get
      different verdicts.
    - >-
      proof-search-map.yaml: docs/inventor-protocol.md section 8's four audits
      applied to whichever half you reach a verdict on, including the
      nearby-object control.
    - source-novelty-audit.yaml: provenance-labelled sources, with an overlap audit against this goal's own prior D1 work so a D1 argument is not silently reused on the different D2 object.
    - runtime-session-receipt.json: written last; artifacts, inference provenance, zero experiments, any operational limitation.
  artifact_paths:
    - coordination/goals/GOAL-ECDLP-001/proposals/B71-IDEA436-D2-RESIDUE-20260903-b1653a/tasks/TASK-20260903-b1653a/d2-disposition.yaml
    - coordination/goals/GOAL-ECDLP-001/proposals/B71-IDEA436-D2-RESIDUE-20260903-b1653a/tasks/TASK-20260903-b1653a/proof-search-map.yaml
    - coordination/goals/GOAL-ECDLP-001/proposals/B71-IDEA436-D2-RESIDUE-20260903-b1653a/tasks/TASK-20260903-b1653a/source-novelty-audit.yaml
    - coordination/goals/GOAL-ECDLP-001/proposals/B71-IDEA436-D2-RESIDUE-20260903-b1653a/tasks/TASK-20260903-b1653a/runtime-session-receipt.json
  archived_by: TASK-20260903-f390d2
  inference:
    policy: research-deep
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
