handoff:
  id: TASK-20260810-122b59
  recorded_at: '2026-08-10'
  from: coordinator
  to: executor
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-74ebef
  experiment_id: EXP-CANL-96b0ad
  hypothesis_id: H-CANL-e59a06
  question_id: RQ-CANL-63098f
  contract_version: 1
  objective: >-
    Execute EXP-CANL-96b0ad -- the frozen, approved contract at
    experiments/EXP-CANL-96b0ad/specification.yaml, testing H-CANL-e59a06's
    two claims C1 and C2. Read the specification FIRST, IN FULL, then
    H-CANL-e59a06 IN FULL (the mechanism section derives every formula the
    contract uses; do not treat the contract's formulas as self-justifying
    without reading where they come from), then RQ-CANL-63098f, then
    CORR-20260810-6e4fa7 for how this lane got here. This is a FIRST
    execution of a brand-new experiment: three new code modules
    (harness/exp_canl.py, harness/canonical_height.py, harness/run_canl.py)
    must be written, not extended from an existing driver.
  uncertainty_reduced: >-
    Whether CM structure on the Serre-Tate canonical lift changes the exact
    quantity that makes Xedni calculus fail (the JKSST canonical-height
    budget / reachable-instance-count exponent), across the FULL range of
    the CM discriminant -- not just one regime. C1 (large |D_E|, the
    generic case): does CM strictly fail to help, as Lemma 1 predicts, and
    by exactly how much worse. C2 (small |D_E|, including j=0/j=1728/
    secp256k1's own class): does a genuine, bounded, non-tautological gain
    survive after subtracting the forced unit-group tautology, and is it
    still exponent-neutral. Both are pre-registered to leave the
    N-exponent at 1 against rho's 1/2 -- an honest, modest, negative-leaning
    prediction this design is built so that either claim can lose.
  inputs:
    - experiments/EXP-CANL-96b0ad/specification.yaml
    - ledger/hypotheses/H-CANL-e59a06.yaml
    - ledger/questions/RQ-CANL-63098f.yaml
    - ledger/corrections/CORR-20260810-6e4fa7.yaml
    - ledger/proposals/IDEA-20260807-fd5a24.yaml
    - ledger/proposals/IDEA-20260807-11b93d.yaml
    - ledger/proposals/IDEA-20260807-761a8c.yaml
    - harness/isogeny_class.py
    - harness/toycurve.py
    - docs/claims-and-verification.md
    - docs/inventor-protocol.md
  constraints:
    - >-
      NEW MODULES ONLY. harness/toycurve.py and harness/isogeny_class.py
      MUST NOT be edited -- every already-committed run in this goal
      (including EXP-ICINV-4d33aa's, at every version) must stay
      reproducible against them unmodified. Build harness/exp_canl.py
      (imaginary-quadratic-order arithmetic: norm form, unit group, shell
      enumeration with unit/non-unit split, alpha_min computation, lambda
      reduction), harness/canonical_height.py (mpmath-based canonical
      height via local-height decomposition, >= 12 significant digits --
      GENUINELY NEW, toycurve.py has no number-field or archimedean height
      code today), and harness/run_canl.py (the orchestrating driver,
      computing the frozen decision rule's terminal state from the run's
      own measured values). Reuse harness/isogeny_class.py's
      trace_of_frobenius, frobenius_discriminant, fundamental_discriminant,
      cm_eigenvalues, j_invariant, and twists_of_j UNMODIFIED -- do not
      reimplement any of these.
    - >-
      alpha_min, NOT the raw generator w. H-CANL-e59a06's own provenance
      block documents a real bug the design corrected: the source
      proposal's literal "ratio_of_minima" metric used w = (D_E +
      sqrt(D_E))/2 (norm ~ D_E^2/4), not the Lemma-1-minimizing element
      alpha_min (b=1, a=round(-D_E/2), norm |D_E|/4 exactly for D_E even,
      (|D_E|+1)/4 for D_E odd). EVERY measurement in this contract named
      "ratio_of_minima" or "companion-height ratio" (predictions P2, P12;
      the C1 null object; CTRL's null N3) uses alpha_min. Measuring the
      raw generator instead reproduces a KNOWN, ALREADY-DIAGNOSED
      instrumentation bug, not a new result -- verify which element you
      are computing with before running the sweep, not after.
    - >-
      GLOBAL GATES RUN IN ORDER, FIRST. G0 (instrument self-check: known-
      answer height cases, CTRL's rank-1 closed form) -> G1 (Lemma-1
      Stage-0 integer search, |a|,|b|<=50 per swept D_E) -> G2 (CTRL's
      full calibration certificate: covering-fraction slope -1.00+/-0.15
      on every arm including all five nulls, plus both directions of the
      planted-signal check) -> G4 (shared Z-baseline reproduces its
      closed-form count exactly). G3 (C2's tautology hard gate, 1000
      points) gates C2 ONLY and does not stop C1's waterfall. Do not read
      or report ANY C1 or C2 verdict before its gating global gates have
      passed and been WRITTEN to decision-rule-evaluation.json, even if
      computed in parallel for wall-clock efficiency (specification.yaml
      frozen_decision_rule.evaluation_order and stopping_rules SR1-SR4).
    - >-
      COST SHARING IS MANDATORY, NOT AN OPTIMIZATION. The Z-baseline
      reachable-count fixture is a function of (prime, C_0, r_Z, auxiliary
      tuple) ALONE. Compute it ONCE per cell and reuse it for both C1's
      and C2's arm contrasts. Recomputing it per regime is a defect even
      if the numbers agree (invalidation_rules).
    - >-
      DUAL AUXILIARY TUPLES. Every exact reachable-count measurement runs
      TWICE with the two independently fixed auxiliary-k tuples
      (auxiliary_k_rule_frozen) and the two counts must agree EXACTLY. A
      disagreement is a code defect (not measurement noise) and makes
      that cell INVALID.
    - >-
      CERTIFICATE SEMANTICS (docs/claims-and-verification.md), per
      specification.yaml certificate_semantics: the tautology check is a
      `kind: decomposition` certificate, independently re-verified by
      literally recomputing the point sum with toycurve.py:add. A
      Lemma-1 counterexample, if one is ever found, is packaged as a
      refutation-artifact with a SECOND, separately-written norm
      computation (direct high-precision floating point, cross-checked
      against the exact-integer search) before it is treated as anything
      other than a search-code defect. Exact counts are `kind: none`
      (pure measurement) but every cell gets a 1% independent spot-check
      by a second, separately-written reducer; a spot-check disagreement
      makes that cell INVALID.
    - >-
      PRIME LADDERS ARE CONSTRUCTED AND INDEPENDENTLY RE-VERIFIED, NEVER
      HAND-ASSERTED. prime_ladder_rule_frozen and
      c2_congruence_ladder_rule_frozen (specification.yaml inputs) name
      the exact sympy construction; log all five (main) and four
      (C2-congruence) resulting primes with their independent isprime()
      re-check in prime-verification.json BEFORE using any of them. Only
      i=2,3,4 (101, 1009, 10007) are asserted in advance by the frozen
      contract; i=5,6 are NOT -- do not substitute a different prime if a
      candidate ever fails its own isprime() check, that makes the run
      INVALID (construction defect).
    - >-
      MEMORY-BOUNDED ENUMERATION IS A CORRECTNESS REQUIREMENT, NOT A
      PERFORMANCE ONE (specification.yaml budget_note). At the largest
      tested C_0=8, some cells' naive tuple materialization risks
      exceeding maximum_memory_gb=8. Stream/chunk the enumeration and
      accumulate a running distinct-count (e.g. a bounded hash set with
      incremental reporting) rather than materializing the full tuple
      list wherever this risk applies. This is stated in the frozen
      contract precisely so it is not left to your discretion.
    - >-
      f_E STRATIFICATION. Every realized curve's conductor f_E is
      computed and reported. f_E > 1 cells are NEVER pooled with f_E = 1
      cells in any aggregate (H-CANL-e59a06's own open assumption on
      non-maximal orders; invalidation_rules).
    - >-
      EVIDENCE_STRENGTH_CALIBRATION IS FROZEN BEFORE THIS RUN, NOT AFTER.
      `replicated` strength requires BOTH C1 and C2 to reach a
      *_SUPPORTED or clean-refuted state at all three seeds and on at
      least 4 of 5 main-ladder primes. Anything less caps the resulting
      evidence record at `preliminary` for the affected regime, and the
      dissenting prime/seed must be named. This is specification.yaml's
      own frozen calibration, not something the Executor sets.
    - >-
      DO NOT INTERPRET AND DO NOT MOVE ANY STATUS. Produce run records and
      an execution report. The hypothesis status, the evidence record, and
      any knowledge promotion are the Coordinator's, on a separate ledger
      archive, after independent review.
    - >-
      Never fabricate a command, output, timing, or statistic. A
      measurement not taken stays missing and is reported as missing
      (AGENTS.md rule 9). A timeout, crash, or OOM is
      failed_infrastructure, never negative evidence (AGENTS.md rule 5).
    - >-
      ESCALATION STOP (SR8). If C1_REFUTED_REOPEN, C2_GAIN_EXCESSIVE, or
      an independently-reproduced Stage-0 Lemma-1 counterexample fires,
      STOP dispatch on this lane after recording the run and flag it
      prominently in the execution report -- these trigger GOAL-ENDO-001
      pause condition P3 and require an independent review-breakthrough
      session (AGENTS.md rule 12) before any record states the excess. Do
      not soften, hide, or bury this in a longer report if it happens;
      state it as the headline.
    - >-
      Fetch origin/main and compare it with this branch before the run
      manifests are written; record the base commit checked and the merge
      outcome in the execution report. Merge new main changes, never
      rebase pushed run records.
    - >-
      Mint every new identifier with `python3 tools/allocate_id.py --next
      <type>` and confirm it with `--check` before use.
    - >-
      Lawful defensive cryptanalysis on public toy constructions only (p
      up to the ladder's top rung, ~10^6). No live key, wallet, or
      deployed system is touched.
    - >-
      SESSION SURVIVAL, THIS TASK ESPECIALLY. This is a large build (three
      new modules) plus a large sweep. Commit after each new module's own
      known-answer self-test passes, again after G0-G2 calibration
      completes, again after each ladder prime's C1 measurement, again
      after each C2-congruence prime's measurement. Never hold results
      only in memory; a session-limit failure that loses uncommitted work
      is exactly the failure mode N7's own history (three prior dispatches
      on this campaign) exists to avoid repeating.
  deliverables:
    - harness/exp_canl.py
    - harness/canonical_height.py
    - harness/run_canl.py
    - experiments/EXP-CANL-96b0ad/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-CANL-96b0ad/runs/<RUN-ID>/raw-result.json
    - experiments/EXP-CANL-96b0ad/runs/<RUN-ID>/prime-verification.json
    - experiments/EXP-CANL-96b0ad/runs/<RUN-ID>/calibration-certificate.json
    - experiments/EXP-CANL-96b0ad/runs/<RUN-ID>/lemma1-search.json
    - experiments/EXP-CANL-96b0ad/runs/<RUN-ID>/c1-measurements.json
    - experiments/EXP-CANL-96b0ad/runs/<RUN-ID>/c2-measurements.json
    - experiments/EXP-CANL-96b0ad/runs/<RUN-ID>/decision-rule-evaluation.json
    - experiments/EXP-CANL-96b0ad/runs/<RUN-ID>/tail-checks.json
    - experiments/EXP-CANL-96b0ad/runs/<RUN-ID>/certificates/
    - >-
      coordination/goals/GOAL-ENDO-001/batches/BATCH-74ebef/execution/EXP-CANL-96b0ad/execution_report.md
      -- what ran, what did not, every deviation from the frozen contract,
      the emitted terminal state(s) (global, and the C1/C2 pair), the
      check_run_source_provenance.py --strict result, with no
      interpretation of what it means for the research question.
  artifact_paths:
    - experiments/EXP-CANL-96b0ad/runs/
    - harness/exp_canl.py
    - harness/canonical_height.py
    - harness/run_canl.py
    - coordination/goals/GOAL-ENDO-001/batches/BATCH-74ebef/execution/EXP-CANL-96b0ad/execution_report.md
  archived_by: null
  inference:
    policy: executor-implementation
    requested_policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
    independent_session_note: >-
      Under this Claude Code harness every policy alias resolves to the
      one model the session runs on (CLAUDE.md model policy note);
      "independent session" means independent context, not a different
      model. Record requested_policy alongside the resolved model id in
      every run manifest, with fallback_used: true and its reason if they
      differ.
  budget:
    wall_clock_seconds: 21600
    memory_gb: 8
    maximum_runs: 30
    total_cpu_hours: 24
    budget_note: >-
      Taken from specification.yaml budget block. Dominant cost is exact
      reachable-count enumeration (up to ~10^8-10^9 basic operations
      across the full C_0 x r_Z grid, 5 primes, 2 auxiliary tuples,
      estimated low tens of minutes to a few hours per prime in pure
      Python); no full isogeny-class enumeration occurs anywhere on this
      contract's critical path, unlike EXP-ICINV-4d33aa. One run record
      per (arm, prime) pair: 5 CTRL-ladder + 5 C1 + up to 4 C2-congruence
      + Stage-0 gates counted as their own quick runs + headroom for the
      i=5,6 ladder primes' construction/verification. If module
      development or the sweep itself risks the wall-clock ceiling,
      commit progress and report status honestly rather than truncating
      silently.
  completion_gate:
    - >-
      Global gates G0, G2, G4 all pass, and G1's outcome (pass, or an
      INVALID / escalated Lemma-1 finding) is recorded, before any C1 or
      C2 substantive result is reported.
    - >-
      The dual-auxiliary-tuple consistency check and the certificate
      spot-check pass on every measured cell.
    - >-
      The shared Z-baseline reproduces its closed-form expected count
      exactly.
    - >-
      C1's waterfall terminates in exactly one of its four states, with
      all six tail checks reported.
    - >-
      IF G3 (C2's tautology gate) passes, C2's waterfall ALSO terminates
      in exactly one of its five states, with all tail checks reported;
      IF G3 fails, the run is still reported as a SUCCESS covering C1
      alone, with C2 explicitly withdrawn as mis-specified, never silently
      omitted.
    - >-
      At least 4 of 5 main-ladder primes yield a C1 verdict and (when G3
      passes) at least 2 of 4 C2-congruence primes yield a C2 verdict.
    - >-
      `python3 tools/check_run_source_provenance.py --experiment
      EXP-CANL-96b0ad --strict` passes for every run this task writes.
    - >-
      The execution report names every deviation from the contract, every
      dropped curve or cell with its reason, and every infrastructure
      failure, and interprets nothing.
  return_format: >-
    An execution report at the path above plus the run directories,
    the three new harness modules, and the empty-directory-no-longer-empty
    runs/ tree. State the emitted terminal state(s) -- the global state if
    one fired, or the (C1_state, C2_state) pair -- and the numbers that
    produced them, and stop there. Do NOT write an evidence record, do not
    move a hypothesis status, and do not characterise what either result
    means for H-CANL-e59a06, RQ-CANL-63098f, or GOAL-ENDO-001 -- those are
    Coordinator acts on a later ledger archive after independent review.
    Every one of C1_SUPPORTED, C1_REFUTED_REOPEN, C2_SUPPORTED,
    C2_TAUTOLOGY_TOTAL, C2_GAIN_ABSENT, and C2_GAIN_EXCESSIVE is a genuine,
    reportable outcome this design was built to allow -- report whichever
    one actually fired with the same clarity as any other, including (per
    SR8) flagging C1_REFUTED_REOPEN or C2_GAIN_EXCESSIVE prominently if
    either occurs.
  scope_and_honesty: >-
    Toy scale throughout (p up to ~10^6, ~20 bits), claim_tier: toy,
    sota_delta zero on every tested axis in both regimes, even under C2's
    best-case predicted gain. No run of this contract can support or
    reject an ECDLP cost claim, and neither claim (even confirmed) is a
    lower bound on ECDLP or a statement about any deployed curve beyond
    citing that secp256k1's CM class sits in C2's escape regime -- no
    attack on it is proposed, implied, or implemented anywhere in this
    contract.
