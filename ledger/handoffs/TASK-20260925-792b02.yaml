handoff:
  id: TASK-20260925-792b02
  created_at: '2026-09-25'
  created_by: coordinator
  from: coordinator
  to: coordinator
  goal_id: GOAL-ECDLP2M-001
  batch_id: BATCH-b67954
  lane: A
  review_required: false
  title: >-
    Snapshot-archive lane A exactly as returned plus the lane-A pre-review gate
    (R-PREREVIEW-GATE), before any lane-A reviewer
  objective: >-
    Commit the lane-A producer's four R-FORM files exactly as returned, together with
    the lane-A pre-review gate files and this receipt, in ONE isolated
    content_at_commit commit, and bind their bytes by sha256, so that every lane-A
    reviewer reads committed, pushed, hash-bound bytes and the blind card
    TASK-20260925-a43591 is dispatched only after its whitelist value grep and
    value-free amendment are recorded (DEC-20260925-89573b R-FORM, R-PREREVIEW-GATE).
  uncertainty_reduced: >-
    None about the mathematics; durability and custody of the object under review,
    and a recorded blind-whitelist value grep before the blind re-derivation.
  inputs:
    - experiments/EXP-NISTBIN-451dfa/specification.yaml
    - ledger/hypotheses/H-NISTBIN-dec5e1.yaml
    - coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-b67954/design/TASK-20260925-c38ac6/proof-search-map-audit.yaml
    - coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-b67954/design/TASK-20260925-c38ac6/revision-worksheet.yaml
    - experiments/EXP-NISTBIN-451dfa/specification.v1-frozen-1088d03f.yaml
    - coordination/review/nistbin-20260925-b67954/review-plan.yaml
    - coordination/review/nistbin-20260925-b67954/blind-inputs.yaml
    - ledger/handoffs/TASK-20260925-a43591.yaml
    - ledger/decisions/DEC-20260925-89573b.yaml
  read_scope:
    - experiments/EXP-NISTBIN-451dfa/
    - ledger/hypotheses/H-NISTBIN-dec5e1.yaml
    - coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-b67954/design/TASK-20260925-c38ac6/
    - coordination/review/nistbin-20260925-b67954/
    - ledger/handoffs/TASK-20260925-a43591.yaml
    - ledger/decisions/DEC-20260925-89573b.yaml
    - coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-b67954/dispatch_queue.json
    - tools/research_dispatch.py
    - tools/validate_ledger.py
  read_scope_note: >-
    The top-level session also greps every file on the lane-A blind whitelist (as
    listed in coordination/review/nistbin-20260925-b67954/blind-inputs.yaml,
    including the card and blind-inputs.yaml itself), and reads the frozen v1 copy
    only to hash it. The gate sub-session reads the producer's v2 files, the grep
    record and the plan (R-PREREVIEW-GATE gate_session_independence). Excludes
    experiments/EXP-FROB-30006a/, experiments/EXP-QSP-70b731/runs/, the
    cursor/semaev-2015-audit-program-5b8b ref and PR #1377.
  constraints:
    - >-
      RUNS ALONE, after TASK-20260925-c38ac6 returns and its lane claim is released;
      never concurrently with any other card or archive.
    - >-
      Order (R-PREREVIEW-GATE order_inside_each_snapshot_card): (1) the top-level
      session hashes the producer's four paths (pre-gate digests) and runs the R-FORM
      snapshot_checks. (2) It runs the lane-A whitelist value grep and writes the
      mechanical record whitelist-grep-v2.yaml. (3) ONE fresh Coordinator gate
      sub-session, under coordinator-orchestration-code, whose write scope is only
      its gate file, writes blind-inputs-amendment-01.yaml. (4) The top-level session
      greps the amendment for every search term; any hit is a stop, and the gate
      sub-session rewrites. (5) It re-hashes the producer's four paths against the
      pre-gate digests and stops on any difference, a custody failure. (6) It makes
      one isolated commit and writes the receipt, verifies, pushes and refreshes the
      PR.
    - >-
      R-FORM snapshot_checks: before committing, check that the leading v1
      byte-length of ledger/hypotheses/H-NISTBIN-dec5e1.yaml hashes to
      b83b2a358bea10a29b6fca0fea4184e19ff9b257ade3a27ab5608ab33caa0b23 (the v1 length
      is that of the file bound by TASK-20260924-304b20), and that
      experiments/EXP-NISTBIN-451dfa/specification.v1-frozen-1088d03f.yaml still
      hashes to 1088d03f25e7cff8f581a0ed83c299301bba48013a4f26df560371b9e90b0d2d.
      Stop on either mismatch: a custody failure, not a result (tripwire TA-5 of
      REVIEW-NISTBIN-20260925-b67954).
    - >-
      Bind exactly the producer's four R-FORM paths
      (experiments/EXP-NISTBIN-451dfa/specification.yaml;
      ledger/hypotheses/H-NISTBIN-dec5e1.yaml;
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-b67954/design/TASK-20260925-c38ac6/proof-search-map-audit.yaml;
      coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-b67954/design/TASK-20260925-c38ac6/revision-worksheet.yaml)
      PLUS coordination/review/nistbin-20260925-b67954/whitelist-grep-v2.yaml,
      coordination/review/nistbin-20260925-b67954/blind-inputs-amendment-01.yaml and
      the snapshot receipt, and nothing else, in ONE isolated content_at_commit
      commit. Stage them one by one; git add -A is forbidden. The producer's four
      paths are hashed before the gate work starts and must be unchanged at commit.
    - >-
      Whitelist value grep (lane-A plan blind_rederivation forward_precondition steps
      (1)-(2)), by the top-level session: grep every whitelisted file (including the
      card and blind-inputs.yaml itself) for each value the v2 contract freezes for
      Q1, Q2 and Q3: every decimal at two to four places, 2^x and scientific forms,
      each frozen optimising m in 'm = ' and list forms, and each frozen D*(m) value.
      Record the command and every hit as file:line in whitelist-grep-v2.yaml. It may
      print search terms, so it is in lane-A blind_from and never whitelisted.
    - >-
      Amendment (forward_precondition step (3)), by the gate sub-session:
      blind-inputs-amendment-01.yaml is value-free and additive. Each hit is removed
      by a new redaction or an exclusion, or recorded as a disclosed leak. The Q3
      m-set and omega-set are pinned as parameters. It states, never as a value, any
      contract-specific degree-extension reading under which v2 freezes a D*(m), or
      states that v2 freezes no D*(m) value.
    - >-
      Every gate file is ALWAYS written, so each declared artifact exists whatever the
      grep finds. When nothing is found the file says 'no hits, no change' and is
      still committed.
    - >-
      The gate sub-session is never the lane's producer, never a reviewer of either
      lane, and never later that lane's composer (TASK-20260925-6e7e13). It reads the
      producer's v2 files, the grep record and the plan. Its judgments are
      Coordinator procedure, not review verdicts, and they move no key of the plan.
      The top-level session itself runs only the greps, hashing and git, and records
      the gate's outputs verbatim.
    - NEVER edit a producer file while staging. A malformed file is committed as malformed and reported.
    - >-
      Any file the producer wrote outside its declared artifact_paths is named in the
      receipt as a scope finding and NOT staged. A producer change to a path outside
      its four R-FORM paths is also tripwire TA-5: stop and report a custody failure,
      not a result; no composition until a scoped repair decision.
    - >-
      Merge origin/main first; merge, never rebase. Record the base commit checked and
      the merge outcome in the receipt.
    - >-
      If tools/validate_ledger.py reports a NEW error on the version-2 specification
      or on the hypothesis's version_2 block, or tools/research_dispatch.py refuses
      the layout, stop and report. Switching lane A to form (ii) under
      H-NISTBIN-e456ff and EXP-NISTBIN-8d210c needs a new Coordinator decision and is
      never improvised (R-FORM stop_conditions).
    - >-
      The commit message names TASK-20260925-792b02 and every archive record id
      literally, and states no value and no verdict. Neither it nor the PR text
      carries a search term or any value.
    - >-
      A killed gate sub-session is continued under R-CONTINUATION by a fresh session
      of the same role and policy, from the gate file's own partial content and its
      declared inputs only (DEC-20260925-89573b NA-3).
    - >-
      No lane-A reviewer (TASK-20260925-087d4e, TASK-20260925-8e9c3e,
      TASK-20260925-a43591) is dispatched before this snapshot, with its gate files,
      is committed, verified and pushed.
    - >-
      No AUXIN census value, minimising divisor, escalated-curve list, control
      integer or reviewer-computed value; no RUN-FROB-627924 value; no
      EXP-FROB-30006a outcome; nothing from experiments/EXP-QSP-70b731/runs/.
    - ZERO RUNS.
  deliverables:
    - >-
      snapshot-receipt.json with commit_sha (null by convention), parent_sha,
      base_commit_checked, merge_outcome, the pre-gate digests of the producer's four
      paths, the R-FORM snapshot_checks results, path_sha256, record_ids and any scope
      findings
    - >-
      coordination/review/nistbin-20260925-b67954/whitelist-grep-v2.yaml (top-level
      session, mechanical): the grep command and every hit as file:line
    - >-
      coordination/review/nistbin-20260925-b67954/blind-inputs-amendment-01.yaml (the
      gate sub-session, value-free)
  artifact_paths:
    - coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-b67954/archives/TASK-20260925-792b02/snapshot-receipt.json
    - coordination/review/nistbin-20260925-b67954/whitelist-grep-v2.yaml
    - coordination/review/nistbin-20260925-b67954/blind-inputs-amendment-01.yaml
  archived_by: TASK-20260925-792b02
  archive:
    kind: snapshot
    source_task_ids: [TASK-20260925-c38ac6]
    record_ids:
      - H-NISTBIN-dec5e1
      - EXP-NISTBIN-451dfa
      - IDEA-20260922-7d6d43
      - BATCH-b67954
      - GOAL-ECDLP2M-001
      - REVIEW-NISTBIN-20260925-b67954
      - TASK-20260925-c38ac6
      - TASK-20260925-792b02
    binding_mode: content_at_commit
    binding_mode_note: >-
      The hypothesis and the version-2 specification have a life after this archive
      (later status advances), so content_at_commit reads their bytes, and the gate
      files' bytes, from this archive's own commit (DEC-20260924-f0a9c7 R3;
      DEC-20260925-89573b R-FORM and R-PREREVIEW-GATE). commit_sha, parent_sha and
      path_sha256 are filled at archive time.
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: true
    fallback_note: >-
      Runtime inheritance: Cursor Cloud Agent subagents launched with model inherit
      are served by the session model claude-opus-5-5-max (max effort); backend
      substitution only; served effort not below policy; model_verified false
    degraded_allowed: false
    independent_session_required: false
  gate_sub_session:
    role: coordinator
    sessions: one fresh Coordinator gate sub-session
    writes_only:
      - coordination/review/nistbin-20260925-b67954/blind-inputs-amendment-01.yaml
    reads: >-
      the producer's v2 files, coordination/review/nistbin-20260925-b67954/whitelist-grep-v2.yaml
      and coordination/review/nistbin-20260925-b67954/review-plan.yaml
    never: >-
      TASK-20260925-c38ac6's session, a reviewer of either lane, or later
      TASK-20260925-6e7e13's session
    inference:
      policy: coordinator-orchestration-code
      reasoning_effort: null
      fallback_allowed: true
      fallback_note: >-
        Runtime inheritance: Cursor Cloud Agent subagents launched with model inherit
        are served by the session model claude-opus-5-5-max (max effort); backend
        substitution only; served effort not below policy; model_verified false
      degraded_allowed: false
      independent_session_required: true
    budget:
      wall_clock_seconds: 3600
      memory_gb: 4
      maximum_runs: 0
    budget_note: >-
      Separate from this card's archival budget, which covers the top-level
      session's greps, hashing and git. The runtime kills a subagent after about
      1800 s of activity; R-CONTINUATION governs.
  budget:
    wall_clock_seconds: 1800
    memory_gb: 1
    maximum_runs: 0
  completion_gate:
    - the producer TASK-20260925-c38ac6 returned and its lane claim is released
    - >-
      R-FORM snapshot_checks pass: the v1 prefix of ledger/hypotheses/H-NISTBIN-dec5e1.yaml
      hashes to its v1 prefix digest and the frozen v1 copy to its must_hash_to value
    - >-
      whitelist-grep-v2.yaml written by the top-level session and
      blind-inputs-amendment-01.yaml by one fresh gate sub-session, both always
      written; the amendment greps clean for every search term
    - the producer's four paths re-hashed unchanged against the pre-gate digests
    - >-
      one commit changing exactly the declared set (the producer's four paths, both
      gate files and the receipt); path_sha256 recomputed immediately before it;
      receipt verified by tools/research_dispatch.py (content_at_commit)
    - validate_ledger.py with no new error attributable to the staged paths
    - branch pushed and PR refreshed before any lane-A reviewer is dispatched
    - no producer file edited, zero runs
  dispatch_preconditions:
    - archived_by is bound before dispatch (AGENTS.md standing precondition 1)
    - every declared input is committed and pushed (standing precondition 2)
    - >-
      a task claim via python3 tools/goal_lanes.py claim <queue> <TASK> --as <addr>
      --ttl-minutes N --publish before launch, released with --outcome on return
      (standing precondition 3)
    - archived_by bound (SELF)
    - >-
      Standing precondition 2 as it applies to an archive: the committed base is
      fetched and merged first; the producer files this card exists to commit are
      uncommitted by construction and must exist in the working tree.
    - TASK-20260925-c38ac6 RETURNED; this archive runs after it, never concurrently
    - >-
      TASK-20260925-d2efb5 verified, so the lane-A plan, its blind inputs and the
      frozen v1 copy are committed and pushed
    - >-
      The gate sub-session is launched only after whitelist-grep-v2.yaml is written,
      in a fresh session that is not TASK-20260925-c38ac6's, not a reviewer's of
      either lane and not TASK-20260925-6e7e13's
    - RUNS ALONE
  runs_launched: 0
