handoff:
  id: TASK-20260904-35fbe5
  from: coordinator
  to: coordinator
  objective: >-
    Convert 8 open RQ-ECDLP-002 proposals into schema-complete hypothesis
    records and frozen experiment contracts at status draft / review_required
    -- NOT approved. This is batch 2 of the backlog-conversion campaign under
    GOAL-ECDLP-001. Batch 1 (TASK-20260904-e1420d) closed RQ-CRYPTO-001
    entirely and corrected the campaign's audit query; this batch begins the
    97-proposal ECDLP slice, of which RQ-ECDLP-002 holds 73.
  uncertainty_reduced: >-
    Whether the substantive measurement-shaped proposals in the RQ-ECDLP-002
    backlog carry enough specification to become decidable contracts, and
    which of them are duplicates of each other. Until a proposal is a
    contract it cannot be ranked, budgeted, scheduled, or refused on its
    merits. This goal's evidence to date is almost entirely negative results
    and closures; several proposals in this batch are baseline measurements
    (Pollard rho's constant, the BSGS memory crossover, multi-target
    amortization) whose absence is a standing gap in the goal's ability to
    state what any future result would be compared against.

  inputs:
    - AGENTS.md
    - agents/coordinator.md
    - docs/task-lifecycle.md
    - 'templates/research-records.md -- the hypothesis and experiment schemas are AUTHORITATIVE; copy fields, do not invent them'
    - docs/claims-and-verification.md
    - docs/target-result-profile.md
    - 'docs/inventor-protocol.md -- the lossy-projection test and null-object controls apply to any contract you write'
    - ledger/questions/RQ-ECDLP-002.yaml
    - 'ledger/handoffs/TASK-20260904-e1420d.yaml -- batch 1, for the output shape and the duplicate-refusal precedent'
    - ledger/proposals/IDEA-20260801-003.yaml
    - ledger/proposals/IDEA-20260815-3c9919.yaml
    - ledger/proposals/IDEA-20260815-f81c17.yaml
    - ledger/proposals/IDEA-20260815-284aff.yaml
    - ledger/proposals/IDEA-20260731-013.yaml
    - ledger/proposals/IDEA-20260807-291968.yaml
    - ledger/proposals/IDEA-20260808-2e14f7.yaml
    - ledger/proposals/IDEA-20260808-d6d973.yaml

  id_assignment_use_exactly_these:
    note: >-
      These identifiers are pre-minted and VERIFIED FREE across the whole
      repository in a single indexed scan (git grep over tracked content and
      paths, 0 hits for all 19). Use them exactly. Do NOT mint your own, do
      NOT scan for a next free number, and do NOT reuse one for two records.
      An identifier you do not spend is simply left unspent and reported as
      such -- that is always preferable to spending it on a duplicate.
    pairs:
      - {proposal: IDEA-20260801-003,    hypothesis: H-ECDLP-b6ce8f, experiment: EXP-ECDLP-4034c4}
      - {proposal: IDEA-20260815-3c9919, hypothesis: H-ECDLP-f3d2fd, experiment: EXP-ECDLP-4320a7}
      - {proposal: IDEA-20260815-f81c17, hypothesis: H-ECDLP-3ac227, experiment: EXP-ECDLP-709063}
      - {proposal: IDEA-20260815-284aff, hypothesis: H-ECDLP-4d21c2, experiment: EXP-ECDLP-7dba4b}
      - {proposal: IDEA-20260731-013,    hypothesis: H-ECDLP-fcbe34, experiment: EXP-ECDLP-e6178c}
      - {proposal: IDEA-20260807-291968, hypothesis: H-ECDLP-98b2a2, experiment: EXP-ECDLP-f53745}
      - {proposal: IDEA-20260808-2e14f7, hypothesis: H-ECDLP-cecbe4, experiment: EXP-ECDLP-4b1413}
      - {proposal: IDEA-20260808-d6d973, hypothesis: H-ECDLP-e2a063, experiment: EXP-ECDLP-2cc3ab}

  constraints:
    - >-
      CHECK CONVERSION STATUS BEFORE MINTING ANYTHING. Batch 1 found that 4 of
      its 8 assigned proposals were ALREADY converted, and correctly refused
      to mint their assigned pairs. The audit that selected this batch used a
      WIDENED query -- any IDEA id appearing anywhere in any
      ledger/hypotheses/*.yaml or experiments/*/specification.yaml -- and
      these 8 came back unreferenced. Re-verify each one yourself before you
      write its records. If a proposal turns out already converted, DO NOT
      MINT; report it with the existing record's id and leave the pair
      unspent.
    - >-
      TWO OF THESE MAY BE THE SAME OBJECT. IDEA-20260815-284aff
      (multi-target amortization) and IDEA-20260731-013 (shared
      distinguished-point table for T-target Pollard rho) both concern the
      multi-target gain. Compare their MEASURED QUANTITIES, not their titles,
      before writing two contracts. If they measure the same observable,
      convert one and report the other as duplicative with the specific
      ground -- a verdict of `duplicative` is a fully acceptable and valuable
      outcome, and paying twice for one measurement is a failure this
      campaign has already had to correct once. Check the other six for
      pairwise overlap too, and against existing experiments under
      experiments/EXP-ECDLP-*.
    - >-
      STATUS IS DRAFT, NOT APPROVED. Every experiment specification gets
      `status: review_required` and `approved_by: null`. Approval is the gate
      that authorizes execution and spends compute, and it is reserved for a
      separate Coordinator act after human review. An experiment you mark
      approved is a budget commitment nobody sanctioned.
    - >-
      DO NOT EDIT ANY PROPOSAL. Proposals are immutable. You read them and
      derive new records; you never modify the source.
    - >-
      PRESERVE CONDITIONALITY. Copy `heuristic_assumptions` and
      `target_complexity` (or the proposal's equivalent claim-conditioning
      fields) into the hypothesis INTACT. A conditional claim stays
      conditional, with its validation route and exponents attached.
      Softening or dropping a stated heuristic is the specific corruption
      this instruction exists to prevent.
    - >-
      EVERY CONTRACT MUST BE DECIDABLE. The success criterion must be
      decidable from the predefined metrics, and there must exist a possible
      outcome that counts as NEGATIVE. Reject-and-report any proposal for
      which you cannot construct a falsification criterion, rather than
      writing a contract that cannot fail.
    - >-
      SEVERAL OF THESE ARE BASELINE MEASUREMENTS (3c9919 rho's constant,
      f81c17 the BSGS memory crossover, 284aff/013 multi-target gain). For
      these, docs/design-experiment's cost-model measurement pattern applies:
      separate MEASURED from MODELED numbers in every table, disclose each
      optimistic assumption with the direction of its bias, treat peak memory
      as a first-class metric alongside time, and state the time-memory
      tradeoff with its interpolation range where one exists. A baseline
      measured without memory accounting is not a baseline for BSGS.
    - >-
      FILL EVERY REQUIRED FIELD or leave the record at review_required with
      the gap named. Required on the experiment: inputs, controls,
      independent_variables, metrics (primary and secondary), seeds and
      replication plan, budget, stopping_rules, invalidation_rules,
      success_criterion, falsification_criterion, required_artifacts. Null
      fields are acceptable ONLY where the template permits, and each must be
      justified in place.
    - >-
      Set `source_proposal` on BOTH the hypothesis and the experiment to the
      originating IDEA id. The campaign's audit no longer depends on this
      field alone, but it remains the clearest provenance link and every new
      record must carry it.
    - >-
      Bind every hypothesis to `question_id: RQ-ECDLP-002`, and every
      experiment to its paired `hypothesis_id`.
    - >-
      CLAIM TIER HONESTY. Label each contract's scale_relevance tier by what
      it will ACTUALLY test, not by the ambition of the proposal it came
      from. Batch 1 assigned tier `null` rather than `toy` where no contract
      instantiated a curve at any size, and that was correct: `toy` asserts
      evidence at a scale, and a contract that instantiates nothing has no
      scale. Use `toy` only for <= 32-bit instances actually constructed.
    - 'Zero compute. Write records only; run nothing. experiment_maximum_runs is 0 for this task.'
    - >-
      Create no DEC/EV/KN-*/CORR record, change no existing record's status,
      and mint no identifier beyond the assigned list.
    - >-
      Citation provenance mandatory: recalled | retrieved | kb | internal on
      every source. Do not fabricate a citation, a measurement, or a prior
      result.
    - >-
      YAML hygiene, re-checked with a strict parser by the orchestrator: no
      plain scalar containing an unescaped double-quote or a
      colon-followed-by-space (single-quote the WHOLE scalar if needed); no
      duplicate keys at any nesting level; no bare mapping key inside a block
      sequence without a leading '-'. This defect class has broken artifacts
      repeatedly on this goal. If your session has no shell you cannot verify
      this yourself -- say so plainly rather than claiming a parse you did
      not run.

  deliverables:
    - 'Up to 8 hypothesis records at ledger/hypotheses/H-ECDLP-<tok>.yaml, one per CONVERTED pair'
    - 'Up to 8 experiment contracts at experiments/EXP-ECDLP-<tok>/specification.yaml, status review_required, approved_by null'
    - >-
      conversion-report.yaml in the task directory: one row per proposal
      giving the assigned ids, whether conversion succeeded, the chosen scale
      tier, the falsification criterion in one line, and any field left null
      with its justification. Name explicitly any proposal you could NOT
      contract and why, any you found already converted, and any you judged
      duplicative of another in this batch. List every identifier left
      UNSPENT.
    - runtime-session-receipt.json: written last; artifacts, inference provenance, zero experiments, and any operational limitation including whether you could run the strict parse.
  artifact_paths:
    - coordination/goals/GOAL-ECDLP-001/proposals/B71-BACKLOG-CONVERT-20260904-35fbe5/tasks/TASK-20260904-35fbe5/conversion-report.yaml
    - coordination/goals/GOAL-ECDLP-001/proposals/B71-BACKLOG-CONVERT-20260904-35fbe5/tasks/TASK-20260904-35fbe5/runtime-session-receipt.json
  archived_by: TASK-20260904-a21224
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: null
    memory_gb: null
