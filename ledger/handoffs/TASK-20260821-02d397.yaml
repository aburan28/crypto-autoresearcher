handoff:
  id: TASK-20260821-02d397
  from: coordinator
  to: red-team
  objective: 'Red-team the frozen batch-4 package under the pre-committed plan review-plan-02d397.yaml:
    joints L1-L5 (frontier-ledger provenance; scope Pareto honesty; MD4 run identity + cost transfer;
    decision-table + cost honesty; scope honesty / no premature closure), the proves-too-much objects
    G/H/I, and the blind re-derivation of the BCP-2 decision-table row predicate. Attempt to falsify the
    package; a prior the review overturns is a result, recorded as such.'
  uncertainty_reduced: Where the frozen package (frontier ledger + scope + MD4 control runs) does not
    support the verdicts it claims, if anywhere.
  inputs:
  - coordination/goals/GOAL-MD5-001/batches/BATCH-04272f/review-plan/review-plan-02d397.yaml
  - the frozen package at the snapshot commit (frontier-ledger.yaml, instrument-class-scope.yaml, run_md4_calib.py,
    both run records + reports, the snapshot receipt)
  constraints:
  - 'sibling-blind: do NOT read TASK-20260821-6a36a4''s report or its directory; attest read_sibling_reports:
    false'
  - never read the MD5 quarantined payload (hash-only; object G uses the MANIFEST sha)
  - 'blind_from: the BCP-2 self_report section, the R1/R2/R3 task cards and handoffs - never read; attest
    blind_from_respected'
  - no status change, no edits to committed records, no commits; write only under the declared write_scope
  deliverables:
  - coordination/goals/GOAL-MD5-001/batches/BATCH-04272f/reviews/TASK-20260821-02d397/red-team-report.yaml
  artifact_paths:
  - coordination/goals/GOAL-MD5-001/batches/BATCH-04272f/reviews/TASK-20260821-02d397/red-team-report.yaml
  archived_by: TASK-20260821-5b74dc
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
    reasoning_note: 'claim-changing round: can move the method-ceiling evidence forward; review-adversarial
      xhigh per the role policy'
  budget:
    wall_clock_seconds: 450
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
  - per-joint verdicts L1-L5 with grounding
  - proves-too-much results G/H/I object by object
  - the blind re-derivation (predicate + test objects + blind_from_respected)
  - prior-overturn notes
  - the defect list
  - the review_attestation block
  review_plan:
    plan_record: coordination/goals/GOAL-MD5-001/batches/BATCH-04272f/review-plan/review-plan-02d397.yaml
    claim_under_review: 'The frozen batch-4 package (frontier ledger + instrument-class scope + MD4 control
      runs): that it honestly records the published frontier in primary text with retrieved provenance,
      scopes the instrument class as a falsifiable record, executes the MD4 control per the ruled scope,
      and that the verdicts it lands on (cost-transfer, partial-hit signature, decision-table row, scope
      statements) are the ones the bytes support.'
    coordinator_prior: 'Recorded before any report returns (full text in the plan record): L1 frontier-ledger
      provenance holds with named gaps (a mislabeled retrieved entry is the expected attack; an honest
      paywalled-recalled gap is not a break); L2 scope candidates falsifiable with recorded Pareto checks;
      L3 the MD4 pair lands on R5/R6 (FAIL/FAIL at the declared space) with cost transferring within TOL
      = 2 and the variant exactly the declared shift; L4 row from the outcomes + R, wrapper timing, build-vs-run
      cost labeled; L5 the package keeps the method-ceiling STATEMENT open (a closure without named obstruction
      + argument + forward guidance would be the batch-halting break). The informative overturns are named
      in the plan record and are results, recorded as such.'
    joints:
    - joint: L1 Frontier-ledger provenance
      assigned_to: TASK-20260821-02d397
      attack_plan: Per-entry URL/date/verification-note/filed-text check; re-derive one entry from the
        filed text; hunt a mislabeled retrieved entry or an unexhausted source-preference order.
    - joint: L2 Scope Pareto honesty
      assigned_to: TASK-20260821-02d397
      attack_plan: Per-candidate mechanism/cost/feasibility/prediction/falsification presence; dominated_by
        nulls against the recorded frontier check (time, memory, data/queries); sota_delta quantitative.
    - joint: L3 MD4 run identity + cost transfer
      assigned_to: TASK-20260821-02d397
      attack_plan: Diff the two run records; recompute the T-prime table from the filed RFC text + shift
        16 and diff; hunt a second unannounced difference; recompute both R ratios from the run records
        (MD4 pair + MD5 anchor), not the reports.
    - joint: L4 Decision-table + cost honesty
      assigned_to: TASK-20260821-02d397
      attack_plan: Row the pair actually produces vs the row named (does_not_show carried); wrapper timing;
        build-vs-run cost labeling; weaker-acceptance-path disclosure if any success.
    - joint: L5 Scope honesty / no premature closure
      assigned_to: TASK-20260821-02d397
      attack_plan: Hunt any ceiling assertion, obstruction-as-established, or closure claim in the frozen
        package; check the closure standard (named obstruction + argument + forward guidance) is not met
        by a screened-and-rejected count; the partial-hit comparison stated as first discrimination data.
    - joint: L6 Run-integrity seven checks
      assigned_to: TASK-20260821-6a36a4
      attack_plan: 'Re-run, do not read: the standalone MD4 against ALL RFC 1320 vectors with the validator
        own driver; the T-prime table; wrapper timing; sealing + completeness intersections; the cost-transfer
        recomputed; the 35-test suite; the firewall carry-over.'
    proves_too_much:
      objects:
      - G provenance mislabel (recalled memory carried as retrieved)
      - H cost tampering (caller timing / below-ceiling halt cost)
      - I closure without obstruction (fatigue report accepted as closure)
      failure_signature: A package (or gate) that carries G as retrieved, accepts H cost as the anchor,
        or accepts I as a closure has proved too much and is wrong somewhere it has not been read closely
        enough.
    blindness:
      within_round: Two-reviewer round; the validator TASK-20260821-6a36a4 is a sibling running concurrently
        in the same round; neither reads the other report; attestations say so. No lifted_for.
      no_quarantine_reads: No reviewer reads the MD5 quarantined payload; objects G/H/I use synthetic
        structures.
