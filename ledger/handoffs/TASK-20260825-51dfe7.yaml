handoff:
  id: TASK-20260825-51dfe7
  from: coordinator
  to: idea-generator
  objective: >-
    Build the legacy-hash frontier shard for MD4, MD5, SHA-0, SHA-1, and
    RIPEMD-160 from primary sources, using ePrint 2026/1744 as a mandatory seed
    and resolving the user's "SHA-1 is about 2^61" statement into exact,
    incomparable notion-specific rows.
  uncertainty_reduced: >-
    Which paper-reported legacy-hash results are actually frontier rows under
    matched notions and costs, and which familiar scalar summaries conflate
    chosen-prefix, identical-prefix, practical, theoretical, full, or
    reduced-round results.
  inputs:
    - coordination/goals/GOAL-SYMF-c00fa1/batches/BATCH-303ce8/frontier-schema.yaml
    - coordination/goals/GOAL-SYMF-c00fa1/batches/BATCH-303ce8/coverage-manifest.yaml
    - coordination/goals/GOAL-MD5-001/batches/BATCH-04272f/tasks/TASK-20260821-cbb510/frontier-ledger.yaml
    - ledger/goals/GOAL-DIFFP-84d641.yaml
    - ledger/goals/GOAL-SHA1-001.yaml
    - https://eprint.iacr.org/2026/1744.pdf
  constraints:
    - Read primary texts and give an exact page, section, table, or theorem locator for every authoritative row.
    - Keep collision, chosen-prefix collision, semi-free-start collision, preimage, and second-preimage rows separate.
    - Preserve every stated time, data, memory, preprocessing, query, and success axis; use an explicit null reason when unstated.
    - Do not turn "practical" into a 2^N estimate unless the primary source provides the operation count.
    - >-
      GOAL-MD5-001 quarantines MD5 path content by every route.  Do not fetch,
      read, transcribe, or reconstruct ePrint 2004/199 path data, HashClash path
      tables, or any quarantined payload.  Use only the committed internal
      frontier ledger for MD4/MD5 facts and attest non-reading.
    - Search knowledge before claiming a result is absent, and record the exact query and outcome.
    - A remembered citation is recalled and cannot support an authoritative frontier row.
    - No cryptanalytic search, collision generation, or attack execution.
  deliverables:
    - frontier-shard.yaml validating against the frozen schema and containing candidate and authoritative rows.
    - source-index.yaml with primary URLs, stable identifiers, retrieval dates, exact claim locators, and provenance.
    - retrieval-log.yaml with all repository searches and web queries/opens.
    - report.md explaining the SHA-1 partition, the RIPEMD-160 delta introduced by ePrint 2026/1744, coverage gaps, and the quarantine attestation.
  artifact_paths:
    - coordination/goals/GOAL-SYMF-c00fa1/batches/BATCH-303ce8/tasks/TASK-20260825-51dfe7/frontier-shard.yaml
    - coordination/goals/GOAL-SYMF-c00fa1/batches/BATCH-303ce8/tasks/TASK-20260825-51dfe7/source-index.yaml
    - coordination/goals/GOAL-SYMF-c00fa1/batches/BATCH-303ce8/tasks/TASK-20260825-51dfe7/retrieval-log.yaml
    - coordination/goals/GOAL-SYMF-c00fa1/batches/BATCH-303ce8/tasks/TASK-20260825-51dfe7/report.md
  archived_by: TASK-20260825-568663
  inference:
    policy: research-deep
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 900
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
    - The user-supplied ePrint 2026/1744 is read and its 42-step RIPEMD-160 result is represented as reduced-round only.
    - SHA-1 has separate theoretical/demonstrated and identical-prefix/chosen-prefix rows, or each missing cell has a named primary-source gap.
    - Every authoritative row has primary-source provenance and all six cost/success axes populated or explicitly null-reasoned.
    - No quarantined MD5 path content was accessed by any route, and the report attests this explicitly.
  return_format: Paths written, row counts by provenance and eligibility, frontier candidates, unresolved gaps, and any prior overturn.
  review_plan: null
