# =============================================================================
# TASK-20260924-5dfbfd -- EXECUTOR CARD, ZERO-RUN AND ZERO-SOLVE CONSUMER
# CENSUS for the DRAFT AMD-EXP-GFPN-05ff43-20260924-consumercover.
# It runs no msolve, valgrind, callgrind_annotate, gp, Sage or builder child,
# creates no run package, and imports no module of the scanned trees.
# Reading source code and archived bytes only, it:
# - compares the draft's fully stated site table with census.json (CU-1);
# - enumerates EVERY consumer of EVERY field of every child record of the
#   three classified msolve sites, and of every value derived from one, by
#   every access mode (literal keys, generic key-name collectors, recursive
#   walkers, whole-entry comparisons, serialization tests, key iteration,
#   derived values to a fixpoint, and file readers), across every tree and
#   every lineage's wrappers and checkers, plus repository tools that read
#   run packages (CU-2);
# - lists the gating consumers of the other child records (CU-4).
# It computes the draft's pre-declared readings, reports them, and decides
# nothing.
# Ordered by DEC-20260924-a7453e. Written by the Coordinator under
# TASK-20260924-410b46. Dispatched later by /run; this card launches nothing.
# Its one archival task is TASK-20260924-ad3f9a.
# =============================================================================
