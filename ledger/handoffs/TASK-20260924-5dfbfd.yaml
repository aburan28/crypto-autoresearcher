      class and reachability; the S-3 consumers against the CC-2 value table
      (V-1..V-6, K-1..K-5); the S-1 and S-2 consumers against the class rule
      (alpha, beta, frozen-body exception);
    - CU-4: the gating consumers of every other child record.
    Report every value and every instance. Decide nothing and make no
    approval recommendation.

