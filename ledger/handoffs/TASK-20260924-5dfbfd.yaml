        EQUALITY RULE, and count unstated fields. Record every difference.
        State the CU-1 reading as the draft words it.
    - id: KQ-4
      text: >-
        CU-2, EXACTLY AS THE DRAFT DEFINES IT.
        - For EACH access mode m1-m8, state the method used (for example: m1
          tokenize string literals and attribute names; m2 and m3 ast
          detection of recursive functions over mappings and lists, and of
          their call sites; m4 == / != / hashing of mappings that can hold a
          site record, and strip-based comparisons; m5 json.dumps or str
          followed by `in` or re; m6 .items() / .keys() / iteration over a
          mapping that can hold a site record; m7 the derived-value set,
          built from every write of a site-record field into another
          structure or file, followed to a fixpoint, and the readers of each
          derived value; m8 open(), glob, os.listdir or path joins over the
          solver/ directory and the <tag>.ms / .ms.out / .ms.log / .ms.err /
          .callgrind.* / .cg.ms.out / .ssf-attempt<k> names).
        - List EVERY hit with file, line, enclosing function, site, record or
          derived value, field, mode, effect class (E1-E7), reachability, and
          the rule or recorded manual reading that classified it. Count
          unclassified hits.
        - For every S-3 consumer with effect E1-E4, give the CC-2 value
          (V-1..V-6) and row (K-1..K-5) it falls under, or NOT COVERED.
        - For every S-1 or S-2 consumer with effect E1-E4, give its class
          (alpha, beta, frozen-body exception) or OUTSIDE THE CLASS RULE.
        - For every CC-2 row K-1..K-5, whether it is found, with
          reachability.
        State the CU-2 reading as the draft words it.
