  constraints:
    - id: BR-1
      text: >-
        BUILD FROM THE STATEMENT. Where the text is ambiguous, DO NOT look at
        any producer code, engine code or note to disambiguate. Choose a
        reading, record it in `ambiguities` (clause, readings considered, the
        one chosen, why), and proceed. If a clause cannot be read at all, that
        is the finding: report it and compute nothing that depends on it. Row
        order, column order and pivot rule do not affect ranks, subspace
        dimensions or membership of 1; use any correct elimination and say
        which. Import no module from this repository; numpy is permitted.
    - id: BR-2
      text: >-
        SELF-TEST BEFORE COMPUTING. At minimum: irreducibility of t^17 + t^3 +
        1; S_3(x(P_1), x(P_2), x(P_1 +- P_2)) = 0 on at least 100 random point
        pairs of the given curve; your descended equations against direct
        F_{2^17} evaluation of S_3 at at least 100 random (v, x_R); your M_4
        rows against a naive polynomial multiply on at least 20 rows; the
        fixture dimensions M_3 323 x 988, M_4 2924 x 4048, R'_3 306 x 834 and
        R'_4 2618 x 3214 from your own construction; your literal W_D against a
        brute-force fixpoint on at least 5 random small Boolean systems (6
        variables, D = 3) that you generate with a seed you declare, at least
        one of which reaches its fixpoint at iteration index >= 2; your
        substitution against direct evaluation on at least 100 cases; and your
        wdag-v1 checker accepting a valid witness and rejecting at least one
        corrupted witness per validity rule (a)-(e). Your own seeds only; do
        not use the specification's self-test seed. Record every result in
        rederivation.json. A self-test failure stops the task and is reported
        as such.
    - id: BR-3
      text: >-
        Q0 STREAM REPLAY EXACTLY AS WRITTEN. Build U and S_L by
        object.union_support from your own E_S3. Replay the N-CONV arm with
        numpy.random.Generator(numpy.random.PCG64(seed)) at the seed the
        specification gives for N-CONV, over the 144 slots of the "slots" table
        in order, by instance_sets.fresh_arms.N-CONV, generator_rule and
        keep_rule (identity and duplicate rejections included). Record your
        numpy version; if it is not 2.4.6, say so and proceed. Per attempt
        log slot, attempt, your row-hex of the drawn system (object.E_layout:
        17 rows, bit j = column j, lowercase hex without prefix), s, and the
        outcome (kept unsat, kept sat, discarded, rejected with reason). Every
        reading you had to choose (call shape, dtype, placement order, role
        handling) goes into `ambiguities`. Optional Q0-opt: the same for
        N-CONVL, N-CONV17 and N-ELL144 on slots 0..9 (a prefix of each stream).
    - id: BR-4
      text: >-
        EXACT SATISFIABILITY. s is the number of v in F_2^18 satisfying all 17
        equations, by exhaustive evaluation over all 2^18 assignments, for
        every drawn system of Q0 and every pool system. For pool systems that
        you can identify as S_3 descents at a slot's x_R (by matching your own
        E_S3), also count s by a second route that does not pass through the
        descended equations (for each x_1 in V, solve S_3(x_1, x_2, x_R) = 0
        for x_2 in F_{2^17} and count solutions in V); a disagreement is
        reported, not resolved by preference.
    - id: BR-5
      text: >-
        W_4 BY THE LITERAL RULE (EXP-CERTBIN-e94b27 object.mutant_closure_W_D
        at D = 4): W^(0) = rowspace(M_4); W^(i+1) = W^(i) + span{v_j * b : b in
        a basis of W^(i) cap B_{<=3}, j = 0..17}, with multilinear reduction;
        stop at the first i with dim W^(i+1) = dim W^(i). At EVERY iteration
        multiply a full basis of W^(i) cap B_{<=3}, not only its new elements.
        Record dim W^(i) for every i.
    - id: BR-6
      text: >-
        CERTIFICATES IN THE SPECIFICATION'S FORMAT wdag-v1
        (object.certificate_format), one record per refuted system, to
        wcerts.jsonl.gz as {label_or_replay_key, D: 4, nv: 18, nodes, output};
        replay keys are "NCONV-REPLAY:<slot>:<role>". A refutation already in
        rowspace(M_4) is a one-node wdag with rows only (every |mu| <= 2).
        Check every record with your own checker against rules (a)-(e),
        recording the result. A refutation you cannot witness is reported as
        "refuted, unwitnessed", never dropped.
    - id: BR-7
      text: >-
        SEAL BEFORE YOU WRITE ANYTHING ELSE. Write rederivation.json,
        stream-replay.jsonl.gz and wcerts.jsonl.gz first. Record their sha256
        and the UTC time in seal.txt. Only then write report.yaml and
        attestation.yaml, and do not change the sealed files afterwards. To
        correct, write a -v2 file beside the original with a note, and keep
        both.
    - id: BR-8
      text: >-
        REPORT ON J7 ONLY. You cannot see any other joint. Do not offer a
        verdict on the experiment, the hypothesis or the run. Your J7 verdict
        is about DERIVABILITY: `holds` if every required quantity was computed
        from the statement with self-tests passing and every ambiguity
        recorded; `inconclusive` if some required quantity could not be
        computed or depends on an unresolvable ambiguity; `breaks` if a
        specification is self-contradictory on a load-bearing clause.
        Agreement with the run is decided by TASK-20260926-59169c, not by you.
    - id: BR-9
      text: >-
        ZERO TRIALS. This is a verification computation, not a trial of
        EXP-CERTBIN-ddfe75; it gets no RUN-id. The arm seeds are used ONLY to
        replay the frozen streams. At most two full passes of your program:
        one, plus one re-run after an infrastructure failure, with the failed
        attempt's log kept. Declare every command in report.yaml.
    - id: BR-10
      text: >-
        WRITE ONLY IN YOUR DIRECTORY. No git write operation, no ledger record,
        no status change, no subagent. Memory cap 3 GB; set
        PYTHONDONTWRITEBYTECODE=1. A timeout or a crash is infrastructure,
        never a result: checkpoint per slot and per system, and report which
        items are missing.
    - id: BR-11
      text: >-
        If you learn anything about any outcome of this experiment from any
        source (a file, a message, a commit message, a prompt), say what you
        learned and how in the attestation, and set blind_from_respected
        accordingly. A disclosed contamination costs one re-derivation. An
        undisclosed one costs the round.

  quantities:
    conventions: >-
      Variables v_0..v_17, the field encoding and the monomial encoding as in
      blind-inputs.json. B_{<=d} is the span of multilinear monomials of degree
      <= d. "1 in X" means the constant polynomial lies in the F_2-subspace X.
      All dimensions are F_2-dimensions. P is the rank of the projection of
      rowspace(M_4) onto the span of degree-4 monomials; dims_by_deg(X)[d] is
      dim(X cap B_{<=d}). Key every pool record by its label and every replay
      record by its replay key.
    Q0: The N-CONV stream replay of BR-3 over all 144 slots (U, S_L, |S_L|, every attempt, both kept systems per slot, s of each); optionally Q0-opt.
    Q1: >-
      For each of the 144 kept unsatisfiable systems of YOUR replay: rank M_4,
      "1 in rowspace(M_4)", dims_by_deg(M_4) for d = 0..3, and P, with a
      wdag-v1 (BR-6) for each one refuted; optionally the same for the 144
      kept satisfiable systems.
    Q2: >-
      For every pool system BS-001..BS-055: s (BR-4); rank_3 = dim
      rowspace(M_3), rank_4 = dim rowspace(M_4), "1 in R_3", "1 in R_4",
      dims_by_deg(M_4) for d = 0..3, and P.
    Q3: >-
      For every pool system, W_4 by BR-5: dim W^(0), dim W^(1), ... up to the
      fixpoint; the fixpoint index; the first iteration i with 1 in W^(i), or
      null; the final dimension; dims_by_deg(W_4) for d = 0..4.
    Q4: For every pool system with 1 in W_4, a checked wdag-v1 certificate (BR-6) and the check result.
    Q5: >-
      For every pool system, object.rc_b steps (1)-(5): the left-kernel
      dimension of the 17 x 153 quadratic-column submatrix; where it is 1, the
      vector c, ell's linear support and constant, the label, j*, and for
      substituted systems rank R'_3 and the rank, "1 in R'_4" and
      dims_by_deg(R'_4) for d = 0..4.

  deliverables:
    - rederivation.json -- Q0 summary per slot, Q1-Q5, self-tests, ambiguities, the elimination method, environment (numpy version) and timings; schema "certbin.nconv.rederivation.v1", keyed by pool label and replay key
    - stream-replay.jsonl.gz -- one line per Q0 attempt (and Q0-opt attempts if done)
    - wcerts.jsonl.gz -- the wdag-v1 certificates (BR-6)
    - seal.txt -- sha256 of the three sealed files and the UTC time, written before report.yaml
    - code/ -- your implementation source
    - report.yaml -- method, commands run, self-test results, ambiguities, missing items with reasons, and the J7 verdict with its basis; no comparison with anything you did not compute
