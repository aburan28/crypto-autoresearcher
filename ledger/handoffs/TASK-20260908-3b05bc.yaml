  constraints:
  - You are not alone. Own only the eight exact new files. Preserve all other work; no Git, ledger, queue,
    claims, release, approval or status mutations. Read complete declared inputs and verify every hash before
    editing.
  - Implement the exact approved portable physical table and charged BSGS kernels as a source component. This
    task does not implement or invoke a scientific runner. Its outputs are prerequisites for the full unchanged
    experiment, not a substitute experiment or measured comparison.
  - Use separate logical-point, hash-preimage and physical-slot encoders/decoders with the exact bytes in the
    effective contract. Physical slots are <IIII x,y,exponent,state,16 bytes; empty=0,affine=1,O=2. Enforce
    coordinate/exponent domains and reject bools as integers, malformed lengths, reserved states and noncanonical
    O/empty fields. No physical 13-byte layout.
  - The caller supplies one bytearray of exactly16*S zero bytes for C, S=floor(C/16), E=floor(7*S/10). C=8
    has no table allocation. The table keeps only a bounded buffer view and scalar counters; no dictionary,
    secondary point index, growth, resize, rehash or spill. Validate every slot address. Hash and probe order
    are exactly the approved domain and linear sequence. Insert at occupied=E returns TABLE_FULL before any
    write. A conflicting exponent for an existing key is completed_invalid; identical duplicates below capacity
    do not increase occupancy. Return explicit operation/probe/byte counters and unchanged-buffer evidence
    on refusal.
  - Implement common BSGS, unbounded NULL1, ArmA and ArmB using a supplied complete-group interface and counting
    wrapper. Solvers receive public curve,P,Q,N only; no known scalar argument or secret read. Baby construction
    costs M-1 additions with no unused final update. H=[M]P and every certificate use the frozen left-to-right
    multiplication; negative scalars reject and zero returns O without operations. Every actual complete E.add,
    including O and doubling, charges once. Negation has its own counter and no group-addition charge. Hash/probe/integer
    work remains separate.
  - Unbounded M=isqrt(N-1)+1 with S=ceil(10*M/7). ArmA refuses m>E before H or solve work. ArmB uses M=min(E,N),
    not min(E,sqrt(N)). Giant lookup ell spans0 through ceil(N/M)-1; certify a hit through the public equation
    before success. No extra giant addition after the final unsuccessful lookup. A false hit/invalid certificate
    invalidates and stops; forbidden early TABLE_FULL is an instrument failure. Preserve component sums for
    baby,scalar-precompute,giant,certificate and separately typed hash/probe/negation work.
  - Create rho-corrected.py as an exact byte copy of pinned harness/rho.py except for the nested _count_mul
    source span, replaced with replacement_python from the approved contract using its existing indentation.
    No import, RNG, branch, restart, collision, signature or remaining solve byte may change. Preserve relative
    imports. Record base and complete derivative hashes and exact before/after span proof; if loading a module
    for fixed tests requires package context, establish it in the test loader without editing the derivative.
  - Implement no fixture generation, seed search, shared-instance materialization, scientific rho stream, public
    solver experiment CLI, future panel, production runtime invocation or real RUN allocation. Tests use only
    fixed synthetic complete-group objects and fixed encoded point objects, never generated elliptic curves
    or declared experiment cells. The exact derivative may be parsed/compiled and its scalar body tested with
    a synthetic E.add; do not call its full solve in this source task.
  - Golden fixed cases must cover all three representation domains and O/empty distinction, exact capacities0/179/1433/11468,
    bounds, E+1 unchanged buffer, retained lookup, duplicate keys, forced collisions, partial buffer and invalid
    fields. Exercise the production BSGS functions on a fixed tiny synthetic cyclic group, including M>N/2,
    last giant block, zero scalar, bad certificate and ArmA refusal. A mock containing an oracle secret must
    raise if the solver reads it. Check operation counts independently from the frozen formulas and a call
    log, not a mirror of implementation counters.
  - Expose cancellation/progress hooks at bounded table/hash/scalar/baby/giant opportunities and preserve completed
    component counters when a hook stops. Hooks cannot change RNG, group operation order, table capacity or
    outcomes. No polling-based hook is described as the required Linux aggregate guard. The future runner must
    supply admission, physical memory guard, telemetry, row durability and final custody.
  - 'Freeze source and test dependency identities in solver-source-bindings.json: Python executable/version
    and exact harness/rho.py, harness/toycurve.py, harness/walk.py bytes. Kernel uses Python standard library
    and a passed group interface; no dependency installation or serving probe. Preserve canonical code and
    output hashes without receipt self-hashing.'
  - Retain full process handles, redirect stdout/stderr before each invocation, reserve exact case counts and
    record absolute UTC, exit and actual CPU/wall/RSS. Count every parameter, failure and rerun toward320TOTAL
    fixed cases; reserve a complete final suite before intermediate attempts.10seconds per case,1800aggregate
    executed-check wall/CPU,one worker2GiB. A failed hard-limit setup is disclosed, not converted to enforcement
    success. Source/hash/parse comparisons are administrative.
