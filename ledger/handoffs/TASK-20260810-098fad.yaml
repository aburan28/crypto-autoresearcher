handoff:
  id: TASK-20260810-098fad
  recorded_at: '2026-08-10'
  from: coordinator
  to: validator
  authorized_by: DEC-20260810-616fd5
  goal_id: GOAL-SSIQ-001
  batch_id: BATCH-014
  status: pending
  status_note: >-
    WRITTEN AND PENDING, NOT DISPATCHED. The session that authored this
    record was not authorized to dispatch reviews. No verdict, attestation,
    or reviewer output exists for BATCH-014.
  objective: >-
    Independently verify the validity of the BATCH-014 run package
    (RUN-SSIQ-a85692-k) BEFORE any interpretation of it. The run deferred at
    G-0c and produced zero sweep points, so the usual run-count/seed-integrity
    battery is nearly vacuous -- what must be verified instead is that the
    DEFER ITSELF is correct, complete, and honestly reported: that the gate
    fired for the reason claimed, that no sweep-derived quantity leaked into
    the artifacts, that the disclosed interpretive choice could not have
    changed the outcome, and that the unenforced memory bound had no effect
    on this run. Recompute; do not trust the execution report's own summary.
  uncertainty_reduced: >-
    Whether RUN-SSIQ-a85692-k is admissible as a valid (if measurement-empty)
    execution of the frozen contract at all, and whether its recorded outcome
    DEFERRED_AT_G0C is the outcome specification_v11's frozen gate actually
    implies from the raw data.
  inputs:
    - >-
      The content-verified BATCH-014 package at commit 5471247e6, archived by
      TASK-20260810-dae7ef. Read the receipt
      coordination/goals/GOAL-SSIQ-001/batches/BATCH-014/archives/TASK-20260810-dae7ef-receipt.yaml
      FIRST, including its process_deviation block -- this was a
      producer-committed package, not a Coordinator snapshot, and the
      Coordinator's own checks were performed after the fact.
    - experiments/EXP-SSIQ-a85692/specification_v11.yaml (frozen, approved, frozen_at 2026-08-07)
    - experiments/EXP-SSIQ-a85692/runs/RUN-SSIQ-a85692-k/ (all nine run artifacts)
    - experiments/EXP-SSIQ-a85692/implementation/delta_e_floor_straddling_sweep_v11.py
    - experiments/EXP-SSIQ-a85692/runs/RUN-SSIQ-a85692-h/ (the archived reference run G-0c compares against)
    - ledger/handoffs/TASK-20260808-d458a3.yaml (the dispatching handoff, including its stated evaluation order)
    - ledger/decisions/DEC-20260808-c2a470.yaml (the freeze decision and its round-1..4 review chain)
    - ledger/decisions/DEC-20260810-616fd5.yaml (this Coordinator's adjudication, which you are free to contradict)
    - coordination/goals/GOAL-SSIQ-001/batches/BATCH-014/reviews/ (all five pre-freeze reports)
  constraints:
    - >-
      independent_session: true REQUIRED. Do not originate, edit, repair, or
      re-run the artifacts under review. Write findings only.
    - >-
      Verdict vocabulary: valid | invalid | incomplete, plus your own
      independently recomputed gate outcome (which gate branch the frozen
      text actually implies from the raw recorded host data).
    - >-
      A G-0c DEFER IS AN INFRASTRUCTURE OUTCOME, NEVER NEGATIVE MATHEMATICAL
      EVIDENCE (AGENTS.md rule 5). Do not report the absence of a delta_E
      measurement as a result about delta_E, H-SSIQ-36e970, or lever L4. By
      the same token, do not report the gate's correct operation as a
      positive mathematical result.
    - >-
      An invalid or incomplete run set is an evidence-integrity finding, not
      a negative result on any hypothesis. If you find one, list concrete
      defects against named artifacts and line-level facts.
    - >-
      DO NOT cite the pre-execution CAL-1 figures (8 records, wall range
      [0.5095, 0.5937] s, ratio range [0.4308, 0.4703]) as measurements of
      RUN-SSIQ-a85692-k. They are not: they came from a verification
      exercise outside the official run and were never written to the run's
      artifacts, and RUN-k recorded cal1_records = [] and cal2_records = [].
      You may reason about them; you may not attribute them to the run.
    - Record policy / model / independence metadata, including any fallback actually used.
  required_checks:
    - id: VC-1
      check: >-
        RE-VERIFY THE G-0c COMPARISON INDEPENDENTLY AGAINST RUN-h's ARCHIVED
        environment.json. Read
        experiments/EXP-SSIQ-a85692/runs/RUN-SSIQ-a85692-h/environment.json
        DIRECTLY -- do not take the values from RUN-k's execution report, its
        truncation_sweep_comparison.json, or the archive receipt. Confirm or
        refute: that it records platform
        Linux-6.18.5-fc-v18-x86_64-with-glibc2.39 and cpus_available 4; that
        RUN-k's own recorded host is macOS-26.6-arm64-arm-64bit-Mach-O /
        arm64 / os.cpu_count() 14; that the frozen G-0c text, applied to
        those two triples, MANDATES a defer rather than merely permitting
        one. Also verify that RUN-h's directory was not modified by
        5471247e6 -- a gate that reads a mutated reference is not a gate.
    - id: VC-2
      check: >-
        CONFIRM THE CLOSED-LIST DEFER ARTIFACT REALLY OMITS EVERY
        SWEEP-DERIVED FIELD. Enumerate truncation_sweep_comparison.json's
        keys yourself, at every level, not just the top level the
        Coordinator checked. Confirm no n_naturally_completed, no delta_E
        histogram, no equality cross-check, no final-pop overshoot
        distribution, and no per-vertex sweep record appears anywhere in the
        file -- and separately that no such quantity leaked into
        raw-result.json, execution_report.yaml, or stdout.log. A defer that
        nevertheless carries a sweep-derived number is a defer that did not
        happen cleanly.
    - id: VC-3
      check: >-
        TEST WHETHER THE DISCLOSED CAL-1/CAL-2 ORDERING INTERPRETATION COULD
        HAVE CHANGED THE RECORDED OUTCOME. The Executor disclosed that
        load_defer_gate_v11's frozen text does not pin down whether CAL-1/
        CAL-2 run before G-0c is evaluated or whether G-0c gates whether they
        run at all, and adopted the latter (gated) reading, producing
        cal1_records = [] and cal2_records = []. Determine, from the frozen
        text and the real module: (a) whether the OTHER reading is also
        admissible on the frozen text; (b) whether adopting it could have
        produced ANY different recorded outcome, or only additional
        calibration records alongside the identical G-0c defer; (c) whether
        anything downstream in the contract depends on cal1_records being
        non-empty; (d) whether the frozen text should be amended for future
        runs regardless of (b). If the two readings are outcome-equivalent
        here, say so explicitly -- that is a materially different finding
        from "the Executor guessed correctly".
    - id: VC-4
      check: >-
        CHECK THAT THE UNENFORCED `ulimit -v` GENUINELY HAD NO EFFECT ON THIS
        RUN. The frozen budget.maximum_memory_gb = 2 was enforced for runs
        a..j via `ulimit -v 2097152`, which is unsupported on macOS
        (setrlimit rejects RLIMIT_AS) and was NOT applied here; the only
        binding cap in force was `timeout 1000`. Verify from command.txt and
        the module what was actually executed, and determine whether the
        missing memory bound could have altered ANY recorded value on a run
        that built one 203-vertex graph and then deferred. Note that no
        peak-memory figure was measured, so the Coordinator's "trivially far
        under 2 GiB" is an inference, not a measurement -- test it rather
        than adopt it. Separately: state whether this enforcement gap must be
        repaired before any FUTURE run of this contract on a non-Linux host.
    - id: VC-5
      check: >-
        VERIFY THE GATE ORDER AND SHORT-CIRCUIT AGAINST THE REAL MODULE.
        Confirm from delta_e_floor_straddling_sweep_v11.py -- not from the
        report -- that the evaluation order is exactly
        [G-0c, G-0, G-0b, G-1, G-2, G-2b, G-3], that G-0c is evaluated
        before any sweep point can run, and that G-0/G-0b/G-1/G-2/G-2b/G-3
        genuinely were never evaluated rather than evaluated-and-unreported.
        gate_g0_result, gate_g0b_result and gate_g1_result are present as
        keys in the defer artifact. THE ORCHESTRATING COORDINATOR HAS
        ALREADY READ THEM and reports all three as null, alongside
        f_cal_seconds null, cal1_records [], cal2_records [],
        measured_load_inflation_ratio_median_non_timed_out null, and
        load_adjusted_predicted_counts carrying an explicit
        {value: null, reason: "undefined: G-0c fired before CAL-1
        calibration was run/interpreted"} at both b = 1.1 and b = 1.45 --
        i.e. the keys are present because the closed-list schema requires
        them, carrying null rather than a fabricated zero, which is
        PF-29(b)'s "ABSENT, not zero" discipline behaving correctly and NOT
        a contradiction of the "never evaluated" claim. This is reported to
        you as a finding to CONFIRM OR REFUTE against the real module, not
        as a settled fact you should assume: the open question is whether
        the code can reach those assignments at all on the G-0c path, or
        whether a null there could also mean "evaluated and produced
        nothing", which the artifact alone cannot distinguish.
    - id: VC-6
      check: >-
        VERIFY STEP (0)'s GRAPH-IDENTITY RE-VERIFICATION INDEPENDENTLY.
        n_built_vertices = 203 against archived 203,
        degree_sequence_check.pass = true, vertex_count_match = true. This is
        the only genuine computation the run performed against the p = 2437
        graph. Confirm it ran exactly once, that it ran BEFORE G-0c, and that
        its comparison target is the archived graph it claims.
    - id: VC-7
      check: >-
        VERIFY THE MANIFEST'S CODE-COMMIT BINDING AND ITS dirty: true FLAG.
        run.code.commit is a58be63848492aa45c75b8d2d6973a352166de96, claimed
        to be exactly the freeze-and-dispatch commit with no intervening
        commit. The manifest also records dirty: true with a dirty_note
        scoping the dirtiness to the run's own two new untracked paths.
        Verify that scoping: a dirty flag whose note understates what was
        modified would undermine every reproducibility claim in the package.
    - id: VC-8
      check: >-
        AUDIT THE ARCHIVE RECEIPT ITSELF, INCLUDING ITS PROCESS DEVIATION.
        TASK-20260810-dae7ef is a content-verified after-the-fact receipt,
        not a Coordinator snapshot -- the Executor committed the package at
        5471247e6 first. Independently recompute at least three of the ten
        declared sha256 values against the tree, confirm the receipt's
        declared_paths matches exactly the file set added by 5471247e6, and
        state whether you regard the content-first binding as sufficient
        here or whether the lost before-history inspection window is a
        material integrity gap. Disagreeing with the Coordinator's
        characterization is an in-scope finding.
  deliverables:
    - validation_report.yaml
    - validation_notes.md
  artifact_paths:
    - coordination/goals/GOAL-SSIQ-001/batches/BATCH-014/reviews/VAL-BATCH-014.md
    - coordination/goals/GOAL-SSIQ-001/batches/BATCH-014/reviews/TASK-20260810-098fad/validation_report.yaml
  archived_by: null
  archived_by_note: >-
    Null pending dispatch. The ledger archive task that will commit this
    review's reports does not exist yet and will be minted by the
    Coordinator who dispatches and receives this review.
  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 2700
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
    - Verdict (valid | invalid | incomplete) recorded with rationale tied to raw artifacts, not to summaries or to DEC-20260810-616fd5.
    - All eight required checks VC-1..VC-8 answered explicitly, each with the concrete artifact and value it rests on; a check you could not perform is reported as not-performed with the reason, never silently dropped.
    - Your independently recomputed gate outcome stated explicitly, matching or contradicting the recorded DEFERRED_AT_G0C.
    - independent_session true and policy/model metadata recorded, with fallback_used and reason if the requested policy did not resolve.
    - No interpretive claim offered about delta_E, H-SSIQ-36e970, lever L4, or the p^{1/3+o(1)} exponent budget in either direction.
  return_format: >-
    validation_report.yaml carrying the verdict, the eight check outcomes,
    the recomputed gate outcome, and metadata; plus validation_notes.md with
    the working. Report to the Coordinator; do not write to ledger/ or to
    any run artifact.
