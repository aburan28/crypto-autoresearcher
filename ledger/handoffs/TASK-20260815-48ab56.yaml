  role: coordinator
  archive_kind: snapshot
  runs_alone: true
  from: coordinator
  to: coordinator
  objective: >-
    Snapshot-commit the exact six declared TASK-20260815-6f4429 artifacts, plus
    this task's own self-neutral receipt, so that both independent reviews bind
    to immutable, hash-verified EXP-SYC-ff777e bytes rather than a working
