  uncertainty_reduced: >-
    Whether the independent Validator and Red Team can bind their
    recomputation to immutable, hash-verified successor bytes rather than to a
    working tree.
  inputs:
    - TASK-20260815-6f4429
  constraints:
    - >-
      Run alone. Never ask a concurrent worker to commit in this shared
      worktree.
    - >-
      Stage ONLY the declared paths. A scope-expanding commit is an
      evidence-integrity failure and blocks review.
    - >-
      Fetch origin/main and MERGE it into the working branch before
      committing. Never rebase pushed evidence. Record the base commit
      checked and the merge outcome in the receipt.
    - >-
      Stop on any parse, diff, ledger-validation, or hash mismatch and report
      it as an infrastructure stop, never as a mathematical result.
    - >-
      Never rewrite or repair a producer artifact to make it commit cleanly;
      a defect returns to the producer as a scoped successor task.
    - >-
      No research inference, implementation, experiment execution, status
      transition, or evidence promotion.
    - No fallback, no degradation, no Amazon Bedrock.
  deliverables:
    - snapshot-receipt.json
  artifact_paths:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-8c58a3/archives/TASK-20260815-48ab56/snapshot-receipt.json
  archived_by: TASK-20260815-48ab56
  archived_by_note: An archive task records its own receipt; it is self-archiving and self-neutral.
