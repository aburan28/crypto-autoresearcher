  experiment_id: EXP-PFDR-20ee58
  hypothesis_id: H-PFDR-9aadc0
  question_id: RQ-PFDR-ae2fba
  recorded_at: '2026-09-04'
  objective: >-
    Attack the derivation and interpretation of EXP-PFDR-20ee58 on the
