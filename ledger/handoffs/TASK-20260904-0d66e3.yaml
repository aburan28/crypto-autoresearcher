  return_format: >-
    A short plain-text return: the report path; per joint (R0-R4) the
    result and the one derivation step or number that decides it; the
    planted-syzygy deficits the meter returned; the proves-too-much outcome
    per object; the narrowest supported statement; sources read (paths);
