  quantities:
    what_you_are_testing: >-
      Whether a set of group orders, alphabet sizes, and the class structure
      of declared labelling families on four small binary curves are
      determined by the stated definitions. A second implementation will be
      compared with yours.
    labels_note: >-
      Cell labels (CELL-*) are this card's own names. Where a definition below
      was written for another document, it is quoted exactly as written there;
      read "the contract" in a quotation as "this card".
    parameters:
      element_encoding: >-
        A field element of F_2[t]/(f) is a non-negative integer read as a bit
        pattern in the polynomial basis: bit j is the coefficient of t^j.
      field_polynomial_rule_DF8: >-
        Quoted exactly: "FIELD POLYNOMIAL (DF-8): the polynomial named for the
        cell where the contract names one (t^19 + t^5 + t^2 + t + 1 for
        CELL-K19 and CELL-O19; t^17 + t^3 + 1 for CELL-K17C and CELL-RC1);
        otherwise, where a type-II optimal normal basis exists, the recurrence
        polynomial f_n (f_0 = 1, f_1 = t + 1, f_(i+1) = t f_i + f_(i-1)),
        accepted only if irreducible, with t normal and multiplication
        complexity exactly 2n - 1; otherwise the lowest-weight irreducible
        polynomial, least as an integer. The irreducibility check is the
        Ben-Or form of the Rabin test. Recorded per cell." CELL-K17C and
        CELL-RC1 in that quotation are not cells of this card.
      normal_element_rule: >-
        Quoted exactly: "A normal element w: t where the type-II rule was
        accepted, otherwise the least integer whose n conjugates are
        F_2-independent. Coordinates by the inverse of the basis matrix
        computed by Gauss-Jordan elimination; Frobenius is the cyclic shift of
        the coordinate vector."
      curve: >-
        y^2 + x y = x^3 + A x^2 + B over the field of the cell, with A and B
        field elements encoded as above; its group of rational points E is the
        affine points (x, y) and the point at infinity. Koblitz cells have
        A = 0, B = 1.
      affine_points: >-
        Every class, class size and count below is over the affine points of
        E only; the point at infinity belongs to no class and carries no
        mass. point_mass is the uniform distribution on the affine points.
      cells:
        - {id: CELL-K13, curve: 'Koblitz (A = 0, B = 1)', n: 13, field: by DF-8}
        - {id: CELL-K19, curve: 'Koblitz (A = 0, B = 1)', n: 19, field: 't^19 + t^5 + t^2 + t + 1'}
        - {id: CELL-K23, curve: 'Koblitz (A = 0, B = 1)', n: 23, field: by DF-8}
        - {id: CELL-O19, curve: 'A = 46693, B = 306147', n: 19, field: 't^19 + t^5 + t^2 + t + 1'}
      rule_R_M: >-
        Quoted exactly: "Rule R-M: M = 2^r with r = floor(log2(N) / p + 1/2),
        p = 3 for the N^(1/3) arm and 4 for the N^(1/4) arm, with N = l, the
        largest prime divisor of the cell's group order". Applied, with p = 3
        and p = 4, to each cell of this card.
      fixed_alphabets: >-
        M = 16 on CELL-K13, CELL-K19 and CELL-K23. A fixed alphabet that
        coincides with an R-M alphabet of the same cell is one row.
      label_families: >-
        Quoted exactly: "On a Koblitz cell at alphabet M = 2^r, twelve arms:
        F1, the normal-basis Hamming weight of x in M quantile classes (the
        mid-CDF of Binomial(n, 1/2)); F2 at offsets 0, floor((n - r)/2),
        n - r, a cyclic window of r normal-basis coordinates; F3 at the same
        offsets, a window of r polynomial-basis coordinates; F4, the leading r
        coordinates of the least cyclic rotation of x's normal-basis vector;
        F5, the composites 4 t + h4 for t in F1, F2@0, F3@0 and F4 at
        alphabet M/4. On the ordinary cell, F2 and F3 at the three offsets
        (six arms, ORD-*)." Here x is the x-coordinate of the affine point
        P = (x, y); the labels F1 to F4 and ORD-* are functions of x alone. An
        F5 label depends on P through h4.
      h4: >-
        h4(P) is the coset P + 4E in E/4E, where 4E = {4Q : Q in E}. The
        composite 4 t + h4 is read as the pair (t(x), h4(P)), with t the named
        family at alphabet M/4 (so r replaced by log2(M/4) in its definition,
        offset 0 for F2@0 and F3@0). Any fixed bijection of the cosets of 4E
        onto 0, 1, 2, ... gives the same partition of the affine points into
        classes, and every quantity below depends only on that partition.
      coset_purity: >-
        For a cell with group E, a label h on the affine points, and a
        subgroup H of E: a label class is the set of affine points with one
        value of h; the class is H-pure if every point P in it lies in the
        same coset P + H. purity_H(h) is the total point_mass of the H-pure
        classes. purity_2 takes H = 2E = {2Q : Q in E}; purity_4 takes
        H = 4E.
      coset_distance: >-
        For a label h and a subgroup H of E: c_H(h) is the least number of
        affine points on which h differs from some function of the coset
        P + H. Equivalently, the sum over the cosets C of H in E of (the
        number of affine points in C minus the largest number of affine points
        in C that share one value of h). c_2 takes H = 2E; c_4 takes H = 4E.
    Q0:
      name: undetermined choices
      definition: >-
        Every point at which the definitions above left you a choice. Examples
        of the kind meant, not a complete list: the reading of F1's "M
        quantile classes (the mid-CDF of Binomial(n, 1/2))"; the order of the
        normal-basis coordinates (which coordinate is index 0) and the
        direction of a cyclic window; which end of the least rotation is
        "leading"; the bit order of a polynomial-basis window; whether the
        type-II rule is accepted at each n; how F1 and F4 are read at alphabet
        2 (r = 1) inside F5; real against rounded arithmetic in R-M. For each,
        quote the text, list the admissible readings, state the reading you
        used, and say which quantities depend on it (and, where cheap, by how
        much).
      report: A list. An empty list is a result and must be stated as such.
    Q1:
      name: orders, alphabets and structure
      definition: >-
        For every cell in parameters.cells: the field polynomial used and the
        normal element w; the group order (affine points plus the point at
        infinity), its full factorisation, N = its largest prime divisor and
        log2 N to four decimals; the sizes of E/2E and, on Koblitz cells,
        E/4E; r and M for p = 3 and p = 4 by rule_R_M; and the resulting row
        set of alphabets per cell (R-M alphabets and the fixed alphabet).
      report: >-
        A table per cell. State the method you used for each order and an
        independent second check.
    Q2:
      name: class structure of the label families
      definition: >-
        For every (cell, family, offset, M) row: every label of
        label_families on CELL-K13, CELL-K19 and CELL-K23 (F1; F2 and F3 at
        each of their three offsets; F4; the four F5 composites) at every
        alphabet Q1 assigns the cell, and every ORD-* label on CELL-O19 at
        every alphabet Q1 assigns it. For each row: the number of non-empty
        label classes; the smallest and the largest class size in points;
        c_2; purity_2; and on Koblitz cells c_4 and purity_4.
      method: Exhaustive over all affine points of each cell, including CELL-K23.
      report: >-
        One row per (cell, family, offset, M) with exact integers (class
        count, smallest and largest class size, c_2, c_4) and exact fractions
        with decimals to 1e-9 (purity_2, purity_4). If any row could not be
        computed exhaustively within your budget, say so for that row, give a
        sample estimate with sample size, seed and standard error, and give
        the interval [0, 3/N] where an estimate is 0 over N sampled points.
    reporting_precision: >-
      Q1 exact integers and log2 N to four decimals; Q2 exact integers and
      exact fractions with decimals to 1e-9. You are given no agreement
      tolerance because you compare nothing.
