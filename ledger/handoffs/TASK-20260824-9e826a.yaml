    - coordination/goals/GOAL-ECQ-bef741/batches/BATCH-9fa73f/tasks/TASK-20260824-e3992d/task-report.yaml
  constraints:
    - >-
      This is a Coordinator-only opening archive task. Perform zero mathematical
