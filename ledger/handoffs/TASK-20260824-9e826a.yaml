      committed receipt because the receipt is part of the commit it describes.
    - >-
      Exclude the receipt itself from path_sha256 to avoid a self-referential
      hash. Include every one of the nine source artifact paths.
    - >-
      Stage only the nine exact source artifact paths and this task's receipt.
      Do not use broad staging, amend, reset, rebase, or rewrite history.
    - >-
      Use the exact commit subject
      research(TASK-20260824-9e826a): open GOAL-ECQ-bef741.
    - >-
      Do not update the operational dispatch_queue.json after the archive
      commit within this strict archive diff. Its post-archive state transition
      is a separate operational commit; strict verification reads the immutable
      queue blob from this archive commit.
  deliverables:
    - >-
      A strict archive commit whose diff is exactly the nine source artifacts
      plus the archive receipt.
    - >-
      A receipt binding snapshot kind, source task, parent commit, all source
      hashes, and the opening goal and decision record identifiers.
    - >-
      Post-commit verification of reachability, exact parent, exact subject,
      exact changed paths, committed blob hashes, and a clean undeclared-path state.
  write_scope:
