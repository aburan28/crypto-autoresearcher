handoff:
  id: TASK-20260902-5b34ea
  from: coordinator
  to: idea-generator
  objective: >-
    Run one bounded, user-directed ideation round against RQ-ECDLP-002 on a
    NAMED frontier: the five corners of prime-field summation-polynomial
    index calculus that this program has not closed, identified in the
    2026-09-02 portfolio read that produced this handoff. Return up to five
    schema-complete, novelty-screened, falsifiable proposals, one per
    pre-allocated id, and an honest accounting for every corner that turns
    out to be already proposed, already closed, or not convertible into a
    discriminating test. Generation runs under docs/inventor-protocol.md:
    every candidate is framed as a tracked object and passed through the
    lossy-projection test before an experiment is proposed; a null-object
    control is named before any signal is believed; every idea carries
    numbered heuristic_assumptions with validation routes, target_complexity
    with time and memory exponents against the best known, a checked
    dominated_by and a quantitative sota_delta. The user's stated prior is
    that there exists a curve over a prime field on which the summation-
    polynomial method runs faster; the round's job is to convert that prior
    into the cheapest measurements that could confirm or refute it, not to
    argue for or against it.
  uncertainty_reduced: >-
    Whether any of five specific, currently unmeasured levers can move the
    per-relation decomposition cost exponent sigma of prime-field point-
    decomposition index calculus on a structured curve or a structured factor
    base, where sigma is the exponent in T_solve = B^sigma for a factor base
    of size B, and the program's own arity-threshold analysis (H-ICEX-9e54c2,
    IDEA-20260808-812554) says the window in which any solver beats rho is
    empty for arity m <= 4, widest at m in {6, 7}, and requires
    sigma < 1 - 2/(m-1). The five corners, with the evidence that leaves each
    open, are listed under constraints as C1..C5.
  inputs:
    - ledger/questions/RQ-ECDLP-002.yaml
    - ledger/goals/GOAL-ECDLP-001/goal.yaml (head fields and live next_action only; grepped, never read end to end)
    - ledger/FINDING-PF-IC-001.md (the program's candidate negative result: d_reg = 2 flat, total exponent 2.05 with CI [1.86, 2.29] at m = 3)
    - ledger/EV-ISO-001.yaml and ledger/H-ISO-001.yaml (isogeny neighbours, d_reg = 2 everywhere)
    - ledger/EV-FB-001.yaml (factor-base structure invariance; the subgroup base was EXCLUDED for a toy reason: too few liftable points at d <= 12)
    - ledger/EV-R6-001.yaml (the R6-firmed cost exponent; the m = 4, F = 6 cell was killed at 300 s and is censored infrastructure state)
    - ledger/hypotheses/H-ICEX-9e54c2.yaml (the arity window closed form)
    - ledger/proposals/IDEA-20260808-812554.yaml (the sigma threshold)
    - ledger/evidence/EV-ICINV-6b6264.yaml (the a^3 + 8 b^2 = 0 locus, one j-invariant, where 48 of 439 S_4 coefficients vanish over Q[a,b])
    - ledger/evidence/EV-ICINV-343679.yaml (Betti table, regularity, singular locus, elimination degree identical on in-class and out-of-class curves)
    - ledger/evidence/EV-ENDO-e8d3e5.yaml (S_3 support 13 / 9 / 10 for generic / j = 0 / j = 1728)
    - ledger/hypotheses/H-JINV-0e8819.yaml (the specialised m = 2 system has identical support, Newton polygon and BKK bound at every j; the single open question is S_4's mu_3 confinement after x_4 := x_R)
    - experiments/EXP-JINV-6c5b8e/runs/RUN-JINV-p1009-a/raw-result.json and experiments/EXP-JINV-dd60d3/runs/*/raw-result.json (j = 0 and j = 1728 vs generic at p = 1009, B = 20, m = 2: Groebner time ratio 0.99 to 1.01)
    - ledger/evidence/EV-JINV-a8c812.yaml (the matched-order family N = 19507, 59 classes, designed and never measured: the specification never instantiated factor_base_sizes, and the transport certificate was unreachable)
    - ledger/hypotheses/H-STR-002.yaml, ledger/decisions/DEC-20260727-009.yaml, ledger/evidence/EV-STR-003.yaml, ledger/evidence/EV-STR-004.yaml (the phi-orbit block-circulant line: weakened on INSTRUMENT grounds; the mechanism is untested by the program's own statement, EV-STR-003 item 4)
    - ledger/proposals/IDEA-20260807-0e4d83.yaml (informative rank: appending phi-orbit rows adds zero usable rank; this may close C4 at derivation level and the generator must engage it)
    - ledger/proposals/IDEA-20260807-1e673d.yaml (the matched null the STR lane never had)
    - ledger/proposals/IDEA-20260808-9ef88c.yaml (multiplicative-coset factor base: derived solving degree exactly B - 1 and cost O~(B^m), which loses to meet-in-the-middle; the generator must engage this before proposing C2)
    - ledger/proposals/IDEA-20260829-4b34c5.yaml and ledger/proposals/IDEA-20260808-726aa3.yaml (multiplicative-subgroup and Kummer bases via character sums)
    - ledger/proposals/IDEA-20260902-701458.yaml (the CM-trace factor base, the latest filed exemplar of the required record shape)
    - ledger/proposals/IDEA-20260811-473c2e.yaml, ledger/proposals/IDEA-20260811-18bbf9.yaml, ledger/proposals/IDEA-20260811-97e244.yaml (the |D_0| arm with pre-registered zero slope, the sham-curve null, and the Newton-polytope measurement; C5 must be discriminated from all three)
    - knowledge/literature/KN-LIT-009.md and knowledge/literature/KN-LIT-025.md (Semaev 2015 and Petit-Kosters-Messeng 2016: both entries say the full paper was NOT read)
    - knowledge/literature/KN-LIT-7604.md, KN-LIT-004.md, KN-LIT-010.md, KN-LIT-005.md
    - knowledge/open-problems/KN-OPEN-001.md, KN-OPEN-002.md, KN-OPEN-003.md, KN-OPEN-020.md
    - knowledge/findings/KN-FIND-a8990a.md, KN-FIND-c41ea9.md, KN-FIND-017.md, KN-FIND-019.md, KN-FIND-007.md
    - knowledge/techniques/KN-TECH-056.md, KN-TECH-080.md, KN-TECH-004.md
    - agents/idea-generator.md
    - docs/inventor-protocol.md
    - docs/target-result-profile.md
    - templates/research-records.md
    - the compiled screening list supplied to the session by the orchestrator (every proposal bound to RQ-ECDLP-* or RQ-CRYPTO-001, plus the nearest prior records per corner)
  constraints:
    - >-
      C1 (ARITY m >= 5 ON A SPECIAL-CURVE PANEL). Every measured prime-field
      decomposition cost in this ledger is at m <= 3; the m = 4 cell is
      censored. The arity window is empty for m <= 4 and widest at m in
      {6, 7}. The panel to consider: j = 0, j = 1728, class-number-one CM
      discriminants, rational 2- and 3-torsion, the a^3 + 8 b^2 = 0 locus,
      each against matched random controls at the same p and N. The metric is
      sigma, never d_reg, which is pinned at 2 for membership-constrained
      systems. A proposal here must say what S_6 or S_7 costs to even WRITE
      DOWN at toy p, and what the exhaustive V^{m-1} baseline is, before any
      Groebner claim.
    - >-
      C2 (MULTIPLICATIVE-SUBGROUP FACTOR BASE AT SCALE). EV-FB-001 excluded
      the subgroup base because at d <= 12 too few elements lift to points,
      which is a toy reason. IDEA-20260808-9ef88c already DERIVES that the
      coset base has solving degree B - 1 and cost O~(B^m) and loses to meet-
      in-the-middle. A C2 proposal is admissible only if it names what
      9ef88c's derivation leaves unmeasured or names a solver that exploits
      the sparse membership x^d - 1 (circulant or FFT structure) with a
      derived sigma below the exhaustive V^{m-1}; otherwise the honest
      deliverable is a one-paragraph closure citing 9ef88c.
    - >-
      C3 (PETIT-KOSTERS-MESSENG 2016 AND SEMAEV 2015, READ IN FULL). The two
      papers that make the user's claim are in the corpus as abstract-level
      entries only. Lane B retrieves the full texts (WebFetch; eprint or
      Springer; a Wayback mirror is acceptable, provenance marked), extracts
      the exact construction of the decomposition base and the rational-map
      conditions, re-derives the cost model and the heuristic it rests on,
      writes the section-8 proof_search_map (baseline slice, observation
      collision, quantifier order, method ceiling, nearby-object control),
      and designs a frozen replication at the papers' own small parameters
      with a matched random-base null. If the full text cannot be retrieved,
      the record says so and the corner returns a literature-gap accounting,
      not a design.
    - >-
      C4 (THE PHI-ORBIT BLOCK-CIRCULANT MECHANISM, TESTED DIRECTLY). H-STR-002
      was weakened because its instrument failed, not because its mechanism
      was tested. IDEA-20260807-0e4d83 argues at derivation level that phi-
      orbit rows add zero informative rank. A C4 proposal must first decide,
      by derivation, whether 0e4d83 closes the mechanism; if it does, the
      deliverable is that closure with the nearby object on which it fails;
      if it does not, the proposal is a zero-compute-first test of the
      mechanism on the synthetic matched null of IDEA-20260807-1e673d, with
      the ceiling stated: this is a linear-algebra lever, B^2 to B polylog at
      best, which cannot pass rho unless relation collection is also cheap.
    - >-
      C5 (SPECIAL j AT REAL FACTOR-BASE SIZES). The only special-j Groebner
      measurement is at p = 1009, B = 20, m = 2. The matched-order family was
      designed and never measured. IDEA-20260811-473c2e already proposes the
      |D_0| arm, 18bbf9 the sham-curve null, and 97e244 the Newton-polytope
      measurement. A C5 proposal must be discriminated from all three at the
      operation level; the natural residual is the |Aut| arm on a B-ladder at
      m = 3 with sigma as the metric and the sham curve as the null, plus the
      single open symbolic question of H-JINV-0e8819. If nothing survives
      discrimination, say so.
    - >-
      Two lanes run as independent subagent sessions with disjoint pre-
      allocated ids. Lane A owns C1, C2 and C5 (ids IDEA-20260902-2327a5,
      IDEA-20260902-7952e7, IDEA-20260902-3490b0, in that order of use).
      Lane B owns C3 and C4 (ids IDEA-20260902-6a8a7f, IDEA-20260902-b09d88).
      Each lane is told the other's corners and must not file on them.
    - >-
      Zero compute and zero implementation. experiment maximum_runs is 0.
      Every quantitative statement is a derivation or a screening statement,
      never a reported execution. No imagined outcomes.
    - >-
      Knowledge retrieval: the orchestrating session probes the crypto-kb
      index once before dispatch and records the outcome in the snapshot
      receipt. Generators hold no MCP tool and screen by direct Read and Grep
      over knowledge/, ledger/, analysis/ and ideas/ plus WebSearch and
      WebFetch; every record states in novelty_screen exactly what was read
      and grepped and treats absence of a hit as a floor, never as novelty.
    - >-
      No novelty label stronger than unverified rests on a recalled
      citation. Every citation carries provenance (recalled | retrieved | kb
      | internal) and verified_by where required. Internal records that were
      not opened are cited as recalled.
    - >-
      No idea is a re-parameterisation of an off-limits or already-filed
      record in new notation. discriminated_from names the nearest prior
      record and the operation-level difference. The families this program
      has closed at derivation level (summation-cover monodromy, box-
      saturated Newton polytopes, isogeny-class invariance by Tate, cross-
      genus Poincare embedding, extension-field isogeny bridge) may be cited
      as boundaries but not proposed against.
    - >-
      Every idea has at least two possible outcomes with stated meanings, at
      least one falsification condition a cheap test can trigger, and a null-
      object control of the same shape. A proof-oriented idea carries a
      proof_search_map with all four audits filled or marked not_applicable
      with a reason.
    - >-
      dominated_by is null only after checking every frontier row (parallel
      rho with negation, BSGS, kangaroo, automorphism-discounted rho, Pohlig-
      Hellman, generic preprocessing S T^2 = N); an unchecked null is a
      fabrication under AGENTS rule 5. sota_delta is quantitative.
    - >-
      No hypothesis record, experiment record, or status change is written;
      this task assigns no work to the Executor. Proposals use only the pre-
      allocated ids, in order; unused ids remain unused and are accounted for
      in the session accounting.
    - >-
      Drafts are written to the session scratchpad and filed into
      ledger/proposals/ by the orchestrating session only after a strict
      duplicate-key YAML parse and a schema gate; a draft returned incomplete
      is completed by its author, not repaired by the orchestrator. Files are
      ASCII only, no tabs, every multi-line value a folded block scalar,
      dates single-quoted.
  deliverables:
    - Up to five idea records, one per pre-allocated id, complete per the schema in agents/idea-generator.md plus the fields the current filed exemplar IDEA-20260902-701458 carries (question_id, added, novelty_screen, citations, proof_search_map, object_first_candidate, null_object_control, discriminated_from, dominated_by, sota_delta, honest_prior_of_survival, yaml_parse_disclosure, status, proposed_by, proposed_at, source_refs).
    - One session-accounting record per lane carrying the inventor-protocol section 5 block (objects considered, depth of verified structure, dominated_by, sota_delta, enumerated closures with mechanisms, open directions), a per-corner disposition (filed | closed-by-prior-record | not-convertible, with the reason), and a one-paragraph ranking rationale naming the single idea to test first.
    - Lane B additionally returns, for each retrieved paper, the exact construction and cost statement extracted from the full text with page or section references, suitable for a later /curate-knowledge update of KN-LIT-009 and KN-LIT-025; it does not edit those files.
  artifact_paths:
    - ledger/proposals/IDEA-20260902-2327a5.yaml
    - ledger/proposals/IDEA-20260902-7952e7.yaml
    - ledger/proposals/IDEA-20260902-3490b0.yaml
    - ledger/proposals/IDEA-20260902-6a8a7f.yaml
    - ledger/proposals/IDEA-20260902-b09d88.yaml
  archived_by: TASK-20260902-c4cb67
  inference:
    policy: research-deep
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 7200
    memory_gb: 4
    maximum_runs: 0
  completion_gate:
    - Every filed record parses under a strict duplicate-key YAML load and carries the REQUIRED idea fields (id, title, class, claim, mechanism, novelty_status) plus heuristic_assumptions and target_complexity.
    - Every record's novelty_screen names the grep terms and the records read, and states the retrieval-index status recorded by the orchestrator.
    - Every record's citations carry provenance, and no record with only recalled literature claims novelty_status stronger than unverified.
    - Every record names a null-object control and at least one falsification condition reachable by a low-cost test, and names sigma or an equivalent exponent-level metric rather than d_reg where the corner concerns solver cost.
    - Every record's discriminated_from names the nearest prior record listed for its corner.
    - tools/validate_ledger.py reports no NEW error on the touched paths.
    - The orchestrating session files the accepted records, commits them with this handoff and the snapshot receipt under TASK-20260902-c4cb67, pushes the branch, and opens a draft pull request against main naming the RQ and IDEA ids.
  return_format: >-
    Per lane, the list of drafted idea ids with one-line summaries (class,
    claim, novelty_status, cost), the per-corner disposition, the session-
    accounting block, and the recommended first test with its cheapest valid
    discriminator.
  review_plan: null
