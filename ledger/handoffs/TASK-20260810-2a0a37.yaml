handoff:
  id: TASK-20260810-2a0a37
  recorded_at: '2026-08-10'
  goal_id: GOAL-AES-002
  question_id: RQ-AES-002
  batch_id: BATCH-2b0fd1
  task_card: coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/task-cards/TASK-20260810-2a0a37.md
  role: executor
  from: coordinator
  to: executor
  objective: >-
    Resolve BY MEASUREMENT, not by assertion, the named contradiction between two
    committed records about the C toolchain, and produce a machine-readable
    receipt carrying whether gcc exists and whether -maes compiles and runs,
    measured AES-NI and pure-Python throughput in AES evaluations per second per
    core, usable RAM, and the resulting per-task and per-campaign ceiling in AES
    evaluations.
  uncertainty_reduced: >-
    Two committed records disagree: RQ-AES-001's constraints record gcc 13.3.0
    with -maes as AVAILABLE, and GOAL-AES-001's next_action records a GF(2^8)
    census leg blocked because neither numpy nor a small C program is INSTALLED.
    Until the disagreement is measured, every budget in this campaign that
    depends on throughput rests on an assertion, and no card in any later batch
    may declare such a budget.
  inputs:
    - RQ-AES-002
    - RQ-AES-001
    - GOAL-AES-002
    - GOAL-AES-001
    - CM-1
    - coordination/goals/GOAL-AES-002/throughput_receipt.json
  constraints:
    - >-
      SC-1 C2 STAMP DUTY. As its FIRST act, before any research work, this task
      writes a stamp record carrying start_utc, start_epoch,
      declared_wall_clock_seconds and a binding_stop_utc COMPUTED as start plus
      declared; writes a further stamp at EACH major section boundary carrying
      utc, elapsed_s and a marker naming what was completed; HALTS at
      binding_stop_utc, records halted_on_budget truthfully and NAMES the work
      dropped; and COMMITS those stamps as a declared artifact, carried as a
      budget block inside this task's designated covering manifest. The
      TASK-20260801-810 budget block is the reference implementation. A halt at
      binding_stop_utc is INFRASTRUCTURE SIGNAL, never a negative mathematical
      result (AGENTS.md rule 5), and dropped work is SCOPE, never an answer
      (rule 8).
    - >-
      SC-2 C4 DECLARATION BASIS. The declared wall_clock_seconds is calibrated
      against AUTHORING-INCLUSIVE session elapsed; the compute component is
      reported SEPARATELY in its own field and may NOT be offered as evidence of
      budget compliance. Discharging SC-1 is FULL compliance even if the charged
      figure later exceeds the declaration, and any residual is a campaign-side
      accounting fact, never a producer defect.
    - >-
      SC-3 COVERING MANIFEST AND CLOSED CLASS VOCABULARY. Every declared
      source-code artifact carries a comment-block inference stanza in its own
      text. AT LEAST ONE machine-readable manifest of this task, DESIGNATED THE
      COVERING MANIFEST by this task's card and by the manifest itself, carries
      an artifact_provenance list covering EVERY declared artifact of the task,
      and EVERY OTHER manifest of the task appears as an ENTRY in it, with fields
      path, kind, sha256, comment_block_inference_stanza (boolean, stated
      honestly including when false) and
      covered_by_this_manifest_inference_block (boolean). A self-referential
      digest is impossible and is recorded as SELF. The kind vocabulary is CLOSED
      and CASE-INSENSITIVE - SOURCE_CODE, MACHINE_READABLE_MANIFEST,
      PROSE_REPORT, LEDGER_AND_COORDINATION_RECORD - matched ignoring
      underscore/hyphen/space differences; no fifth class may be invented, a
      value outside the vocabulary is a DEFECT TO REPORT, and any
      machine-readable structured-data artifact resolves to
      MACHINE_READABLE_MANIFEST.
    - >-
      SC-4 THE R5 ANTI-LAUNDERING CLAUSE, QUOTED VERBATIM FROM RQ-AES-002 AND
      BINDING AS A COMPLETION GATE ON EVERY DELIVERABLE OF THIS TASK: "R5. THE
      ANTI-LAUNDERING CLAUSE. Any record, in any location, that states a margin
      MUST in the SAME SENTENCE (i) name the reference as exhaustive key search
      at the stated key size under CM-1, and (ii) declare the
      published-state-of-the-art comparison UNADJUDICABLE in this environment.
      Transcribing a definitional-reference margin as a state-of-the-art margin
      — in a headline, an evidence record, a decision, a synthesis, a status
      line, a cross-reference, a knowledge entry, a PR title or a commit message
      — is a CLAIM-TIER VIOLATION and is handled exactly as
      docs/claims-and-verification.md handles dropping a conditional qualifier:
      as an assertion above what the record supports. OPERATIONALLY, under
      docs/inventor-protocol.md section 5: every ideation and closure deliverable
      under this question sets `dominated_by: "unresolvable in this environment:
      no primary source reachable; every recalled frontier row is
      unverified-from-memory"` and NEVER `null`, because `null` asserts the
      frontier was checked row by row and it cannot be. `sota_delta` records the
      DEFINITIONAL-REFERENCE delta, explicitly labelled as such, plus the word
      `unadjudicable` for the published frontier."
    - >-
      SC-5 NO RECALLED LITERATURE FIGURE MAY BE CITED AS AUTHORITY, IN EITHER
      DIRECTION. A recalled figure may be named as context with its status
      declared, and may never be used to compare, rank, screen, size, promote or
      DISMISS anything. Using an unverified recollection to dismiss is the same
      fabrication as using it to promote.
    - >-
      SC-6 NO COMPARISON AGAINST THE PUBLISHED STATE OF THE ART IS ASKED FOR OR
      ADMITTED. It is unadjudicable in this environment in both directions; the
      only quantitative reference this campaign may use is the DEFINITIONAL
      exhaustive-key-search reference under CM-1.
    - >-
      SC-7 EVERY DELIVERABLE STATING A MARGIN CARRIES THE R5 CLAUSE IN THE SAME
      SENTENCE, not in a footnote, an appendix, or a later paragraph.
    - >-
      SC-8 NO REDUCED-ROUND FINDING PRODUCED UNDER THIS GOAL MAY BE ASSERTED
      HERE. It belongs to RQ-AES-001's ceiling and is cross-filed there
      (GOAL-AES-002 non_completion_criteria (iii); RQ-AES-002
      relationship_to_RQ_AES_001 (iv)).
    - >-
      SC-9 ANYTHING NOT ATTEMPTED IS NAMED OPEN AND UNATTEMPTED and is NEVER
      recorded as tried, screened or negative (AGENTS.md rules 5 and 8).
    - >-
      SC-10 FABRICATE NOTHING. No invented timing, measurement, throughput,
      citation, review verdict, model identifier or commit SHA. A field that is
      not yet knowable stays null and is named as such.
    - >-
      SC-11 NEVER SELECT, CONFIGURE, PROBE, CONTACT OR USE AMAZON BEDROCK, in any
      runtime, backend, endpoint, model identifier, fallback or probe (AGENTS.md
      rule 16).
    - >-
      MEASURE, DO NOT ASSERT. The receipt must carry, each as a measured
      observation with its exact command and raw output preserved: (i) whether
      gcc exists and its reported version; (ii) whether a program using -maes
      COMPILES and whether the resulting binary RUNS, both checked, since
      compiling is not running; (iii) measured AES-NI throughput in AES
      evaluations per second per core; (iv) measured pure-Python throughput in
      AES evaluations per second per core; (v) usable RAM; (vi) the derived
      per-task and per-campaign ceiling in AES evaluations, with the derivation
      shown.
    - >-
      NEITHER COMMITTED RECORD IS EDITED. RQ-AES-001 and GOAL-AES-001 are read
      only. The receipt is the correction of record and states which record the
      measurement supports on which exact point, and on what it is silent.
    - >-
      STATE WHAT IS DERIVED VERSUS MEASURED. Multi-core scaling is ASSUMED LINEAR
      unless it is measured; if it is not measured, say so in the field itself
      rather than in prose. A ceiling derived from an assumed scaling is labelled
      as derived-under-an-assumption at the point of use.
    - >-
      THE PRIOR RECEIPT IS AN INPUT, NOT AN ANSWER, AND MUST NOT BE COPIED.
      coordination/goals/GOAL-AES-002/throughput_receipt.json (id
      MEAS-GOAL-AES-002-001) exists in the working tree from an undispatched
      2026-08-01 session, carries no dispatched card, no budget, no stamps, no
      snapshot and no review, and itself declares four-core scaling assumed
      rather than measured. Re-measure independently, then state explicitly
      whether this task's measurement AGREES or DISAGREES with it and on which
      fields. Do not restate its numbers as this task's own.
    - >-
      A COMPILE FAILURE, A MISSING TOOLCHAIN, A CRASH OR A TIMEOUT IS
      INFRASTRUCTURE SIGNAL AND IS RECORDED AS SUCH. It is never negative
      mathematical evidence about AES (AGENTS.md rule 5), and it does not license
      any statement about which mechanisms are or are not viable beyond the exact
      resource fact measured.
    - >-
      NO CRYPTANALYSIS. This task runs a benchmark and an inventory. It attempts
      no key recovery, computes no distinguisher, and asserts nothing about AES
      security at any round count. The receipt is infrastructure and is expressly
      NOT a completion (GOAL-AES-002 non_completion_criteria (vi)).
    - >-
      Preserve the exact command, the environment, stdout and stderr, and the raw
      machine-readable result for every measurement, per the AGENTS.md artifact
      policy. measure_envelope.c carries a comment-block inference stanza in its
      own text under SC-3.
    - >-
      Write only beneath the assigned write_scope, make no ledger, queue or
      committed-record edit, and make no commit. TASK-20260810-1a81be snapshots
      these bytes before review.
  deliverables:
    - envelope-receipt.json, designated the covering manifest for this task
    - measure_envelope.c, with its comment-block inference stanza
    - execution-report.md
  artifact_paths:
    - coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/tasks/TASK-20260810-2a0a37/envelope-receipt.json
    - coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/tasks/TASK-20260810-2a0a37/measure_envelope.c
    - coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/tasks/TASK-20260810-2a0a37/execution-report.md
  archived_by: TASK-20260810-1a81be
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 1600
    memory_gb: 4
    maximum_runs: 3
  completion_gate:
    - >-
      envelope-receipt.json is valid JSON carrying all six measured items, each
      with its exact command and raw output preserved, and each field labelled
      measured or derived.
    - >-
      The receipt states which of the two contradicting committed records the
      measurement supports, on which exact point, and on what it is silent;
      neither record is edited.
    - >-
      Agreement or disagreement with MEAS-GOAL-AES-002-001 is stated field by
      field, and none of its numbers is restated as this task's own.
    - >-
      Any infrastructure failure is recorded as infrastructure signal and never
      as negative evidence about AES.
    - >-
      No cryptanalysis was attempted and no claim about AES at any round count
      appears; the receipt states in its own text that it is not a completion.
    - >-
      SC-4 is satisfied on every deliverable, and measure_envelope.c carries its
      comment-block inference stanza.
  return_format: >-
    A JSON receipt carrying the six measured items with commands and raw outputs,
    each field labelled measured or derived, the per-task and per-campaign
    ceiling with its derivation, the field-by-field comparison against
    MEAS-GOAL-AES-002-001, the statement of which committed record the
    measurement supports and on what it is silent, and the SC-1 budget stamp
    block with compute seconds reported separately from session elapsed.
