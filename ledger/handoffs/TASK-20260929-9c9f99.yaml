  title: >-
    EXP-ECDLP-64fa3d plan-authoring and implementation task: build the driver,
    the independent checker and the calculator library, mint run identifiers, and
    freeze a trial plan that tools/experiment_execution.py status accepts. ZERO
    scientific trials.
  objective: >-
    Implement exactly the frozen protocol of
    experiments/EXP-ECDLP-64fa3d/specification.yaml (approved by
    DEC-20260929-b371e1) as a driver, an independent checker and a calculator
    library, then author and freeze experiments/EXP-ECDLP-64fa3d/trial-plan.json
    enumerating exactly the eight trials of the specification's trial_graph with
    its depends_on edges, so that the Coordinator can author the run card
    TASK-20260929-402d5b against a plan that the supervisor already accepts. This
    task runs NO scientific trial and produces NO scientific result.
  uncertainty_reduced: >-
    None about the mathematics. It removes the 2026-09-27 stall in which
    approved ECC experiments sat at needs_implementation_or_plan with only a
    specification.yaml: after this task the experiment has code, an independent
    checker and a frozen supervisor-accepted plan, so the run is executable.
