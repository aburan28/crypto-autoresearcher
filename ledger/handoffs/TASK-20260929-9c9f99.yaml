    - ledger/decisions/DEC-20260929-821525.yaml
    - ledger/proposals/IDEA-20260923-9e4b71.yaml
    - coordination/design/BATCH-93eb65/dispatch_queue.json
  constraints:
    - >-
      ZERO SCIENTIFIC TRIALS. Do not execute driver.py or check.py on any trial
      of the plan and create nothing under experiments/EXP-ECDLP-64fa3d/runs/
      except the existing .gitkeep. A run made outside the supervisor is an
      unreconciled attempt. Unit tests of jsfamily.py are allowed ONLY on the
      inputs whose expected values the specification states in advance
      (execution_plan_requirements.implementation_self_tests); their outputs are
      not evidence.
    - >-
      Implement the specification as written. Every definition, order,
      threshold, convention, control and trial is frozen. You may not change,
      reinterpret or add to them; a contradiction or ambiguity you cannot
      resolve from the specification text is an impediment to report in the
      implementation report, not an invitation to choose. Changes are additive
      protocol_amendments authorised by a Coordinator decision.
    - >-
      INDEPENDENCE. check.py must be a second implementation: it may not import
      jsfamily.py or driver.py. It recomputes the exponent sums by explicit
      polynomial expansion for t <= 4 and by a different set-arithmetic routine
      above that, enumerates the linear-programming vertices by a different
      routine, and re-implements the verdict rules of decision_rules. The
      standard library, numpy and sympy are permitted in both; a shared
      helper is not.
    - >-
      CONVENTIONS. Implement HG and TOOL exactly as D4 states and never let TOOL
      reach the verdict path. Do not import tools/smallroot_reach.py into the
      calculator; the driver may import it only inside the R-TOOL-repro
      comparison, and it is then a hash-bound source.
    - >-
      RUN IDENTIFIERS. Mint one per trial with python3 tools/allocate_id.py --next
      run --area ECDLP, confirm each with --check, and confirm each absent on
      origin/main and on every other origin ref (git fetch origin; git
      for-each-ref refs/remotes/origin; a path and content search of each ref)
      BEFORE writing the plan or any directory. Record the commands and outputs
      in implementation-report.yaml. If the allocator or the origin refs cannot
      be consulted, stop and report; never pick, derive or reuse an identifier.
      No RUN identifier appears in the specification, the hypothesis, any
      handoff or the queue.
    - >-
      PLAN SCHEMA. Read PLAN_SCHEMA from tools/experiment_execution.py at your
      HEAD and use that exact string. At the design checkout it is
      crypto.autoresearch.trial_plan.v1 (no v2 exists there). Do not invent a
      schema; record the string and the file's git blob hash in the report.
    - >-
      PLAN FIELDS. task_id is TASK-20260929-402d5b (reserved for the run card;
      that card does not exist yet and is authored by the Coordinator after this
      task is snapshotted), approved_by is DEC-20260929-b371e1, queue is
      coordination/design/BATCH-93eb65/dispatch_queue.json, specification is
      experiments/EXP-ECDLP-64fa3d/specification.yaml with its exact sha256, and
      source_sha256 binds the complete closure of driver.py, check.py,
      jsfamily.py, requirements.lock and every repository file they import
      (including tools/smallroot_reach.py if imported). Each trial has argv and
      check_argv as argv arrays containing a hash-bound source literally,
      artifacts including manifest.yaml and raw-result.json plus the named
      artifacts of the trial_graph, memory_mb at most 8192, and
      watchdog_seconds null unless you give an explicit machine-protection
      reason. A dependent trial receives its dependencies' run directories as
      explicit argv arguments.
    - >-
      Bedrock providers, endpoints, models and probes are prohibited. Run
      manifests must record requested policy and the resolved model
      (AUTORESEARCH_POLICY, AUTORESEARCH_BACKEND) per harness/runner.py.
    - >-
      Write only the seven declared files. You are not alone: preserve every
      other file and every immutable record. Do not edit the specification,
      the hypothesis, any decision, the queue or tools/.
    - >-
      Never fabricate a command output, a hash, an allocator result or a status
      report. Every null carries its reason.
  deliverables:
    - experiments/EXP-ECDLP-64fa3d/implementation/jsfamily.py
    - experiments/EXP-ECDLP-64fa3d/implementation/driver.py
    - experiments/EXP-ECDLP-64fa3d/implementation/check.py
