    maximum_runs: 0
    maximum_workers: 1
    total_cpu_hours: null
    note: >-
      maximum_runs 0 means zero scientific trials, consistent with the
      supervisor's refusal to execute trials from a zero-run task; the run card
      TASK-20260929-402d5b carries the run budget (maximum_runs 8). Wall clock
      and CPU are advisory.
  stopping_rules:
    - >-
      Finish the seven declared files and stop before any trial. If the
      supervisor's status command rejects the plan, fix the plan (not the
      specification) until it accepts it or report the concrete refusal.
    - >-
      A specification ambiguity or contradiction is reported, with the exact
      text, as an impediment; do not improvise a reading.
    - >-
      A missing allocator, a missing origin ref, or a run identifier already
      present on any origin ref is a stop, never a workaround.
  completion_gate:
    - >-
      python3 tools/experiment_execution.py status --plan
      experiments/EXP-ECDLP-64fa3d/trial-plan.json exits 0 and its JSON report
      states required 8, output_validated 0, remaining 8, planned 1,
      waiting_on_dependencies 7, needs_reconciliation 0 and
      measurement_complete false; the exact stdout is pasted into
      implementation-report.yaml.
    - >-
      The plan's trial ids and depends_on edges equal the specification's
      trial_graph exactly, shown by a correspondence table in the report; the
      plan's specification_sha256 equals the sha256 of the committed
      specification bytes and every source_sha256 entry equals the file's sha256.
    - >-
      Eight distinct RUN identifiers minted by tools/allocate_id.py, each with its
      --check output and its origin-ref absence check recorded; none appears in
      any file outside trial-plan.json and the report.
    - >-
      Unit tests in test_jsfamily.py on the specification's stated self-test
      inputs pass, and check.py imports neither jsfamily.py nor driver.py (shown
      by a static import listing in the report).
    - >-
      No directory or file exists under experiments/EXP-ECDLP-64fa3d/runs/ other
      than .gitkeep, and git status shows changes only to the seven declared
      paths.
    - >-
      The report states, for each of the specification's controls and D3
      properties, which function in the driver implements it and which function in
      check.py re-implements it, and lists every impediment or interpretation
      question found in the specification, or says none was found.
  return_format: >-
    implementation-report.yaml plus a short message naming the seven paths, the
    schema string read, the status command's exit code, and the eight trial ids.
