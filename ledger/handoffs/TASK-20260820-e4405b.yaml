handoff:
  id: TASK-20260820-e4405b
  recorded_at: '2026-08-20'
  goal_id: GOAL-MD5-001
  question_id: RQ-MDFIVE-6870c1
  batch_id: BATCH-312472
  task_card: coordination/goals/GOAL-MD5-001/batches/BATCH-312472/task-cards/TASK-20260820-e4405b.md
  role: executor
  from: coordinator
  to: executor
  objective: 'Make the certificate rule and charging convention that BCP-2 will require actually exist
    in harness/runner.py: a md5_collision_pair certificate kind verified by two pinned independent implementations,
    and wall_seconds measured by the wrapper rather than trusted from the caller.'
  uncertainty_reduced: Whether the runner can verify a collision certificate end-to-end with the pinned
    independent pair, and whether the charging convention can be made caller-independent, before BCP-2
    is frozen against them.
  inputs:
  - harness/runner.py — the current implementation; extend, do not rewrite
  - implementation-pin.yaml — the pinned pair (IMPL-1 hashlib.md5/OpenSSL, IMPL-3 _md5/CPython) the certificate
    rule must use
  - BCP-1 section (c) collision_certificate_format — the schema and independence rule BCP-2 will carry
    forward
  - DEC-20260810-1163ec F-4(b) and (e) — the two requirements this task discharges
  constraints:
  - SC-1 FABRICATE NOTHING. No invented timing, measurement, throughput, citation, review verdict, model
    identifier or commit SHA. A field that is not yet knowable stays null and is named as such.
  - SC-2 CLAIM CEILING. Assert nothing about MD5 - no collision, no preimage, no complexity, no method
    ceiling, no obstruction, and no comparison against any published result in either direction. Implementing
    verification code is a record about the harness, not about MD5.
  - SC-3 UNVERIFIED FIGURES STAY MARKED. Every figure not obtained in primary text stays marked unverified
    and is never cited as authority in either direction.
  - SC-4 A failed, halted or exhausted search is a BUDGET OUTCOME about a solver and NEVER evidence about
    MD5 (AGENTS.md rules 5 and 8).
  - SC-5 Anything not attempted is named OPEN AND UNATTEMPTED and is never recorded as tried, screened
    or negative.
  - SC-6 Change no hypothesis, question, experiment or goal status; approve no experiment; promote no
    knowledge; edit no committed record. Extending harness/runner.py is an authorized implementation change,
    not a record edit; the change is additive and must not alter the behavior of existing certificate
    kinds or existing run records (they are immutable and were written under the old API).
  - SC-7 HALT AT THE DECLARED wall_clock_seconds (600 s) and report the halt truthfully as infrastructure
    signal, naming the dropped work as scope rather than as an answer.
  - SC-8 Never select, configure, probe, contact or use Amazon Bedrock (AGENTS.md rule 16).
  - 'NEVER READ the quarantined payload (coordination/goals/GOAL-MD5-001/quarantine/MD5-COLLISION-PATH-WANG-2004-199.yaml).
    Self-tests use known-false objects (two messages with different MD5 digests, a tampered digest, m1==m2,
    single-implementation agreement) and MOCK implementations for the verified:true logic path. A genuine
    collision pair is infeasible within budget, and the quarantined pair must stay untouched until a calibration
    run''s closed input manifest declares it. State this coverage boundary in the self-test report: the
    true path is tested at logic level (mock), end-to-end true path UNTESTED within budget.'
  deliverables:
  - 'The harness/runner.py change: (1) a md5_collision_pair certificate kind in the verification path
    — fields messages (m1, m2), digest, implementations (the two pinned names from implementation-pin.yaml);
    the runner computes MD5 of both messages with both pinned implementations and sets verified: true
    only if m1 != m2 and all four digests equal the claimed digest, verified: false otherwise, recording
    which check failed; (2) wrapper-measured wall_seconds — the run wrapper measures wall time itself
    (monotonic clock around the wrapped call) and writes it, so a caller can no longer report a fabricated
    started/finished pair; the old fields remain readable for existing records but are no longer trusted
    for new ones. Design minimally; record the exact new API in the self-test report.'
  - 'tasks/TASK-20260820-e4405b/runner-selftest-report.yaml — the self-test suite and its results object
    by object (each known-false object: expected verified:false, observed, which check fired; the mock
    true object: expected verified:true, observed), the exact new API, the coverage boundary (end-to-end
    true path untested, reason), the commands run, and a truthful budget account.'
  artifact_paths:
  - coordination/goals/GOAL-MD5-001/batches/BATCH-312472/tasks/TASK-20260820-e4405b/runner-selftest-report.yaml
  archived_by: TASK-20260820-513ea9
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 600
    memory_gb: 2
    maximum_runs: 2
  completion_gate:
  - Every known-false object comes out verified:false with the failing check named.
  - The mock true object comes out verified:true, with the mock explicitly labelled as logic-level coverage.
  - Existing certificate kinds and existing run records are behaviorally unchanged (the self-test report
    states how this was checked).
  - wall_seconds is wrapper-written for new runs; the self-test demonstrates a caller-supplied timing
    no longer lands in the record.
  - The quarantine payload was not read (attested in the self-test report).
  - Nothing committed (the snapshot task stages these bytes); nothing written outside the write scope.
  return_format: A summary naming the runner change (the exact new API), the self-test results object
    by object (expected vs observed, failing check named), the coverage boundary (end-to-end true path
    untested, reason), the attestation that the quarantine payload was not read, and a truthful budget
    account.
