  constraints:
  - You are not alone. Own only the six exact output files; preserve all other agents, archived sources, reviews
    and ledger. No shared module edits, commits, pushes, claim releases or scientific-status changes.
  - Effective protocol is the original specification plus original approval and the prospective DEC-20260907-38017a
    amendment. Verify all source hashes. Implement actual algorithms and a concrete end-to-end future runner, never
    callback scaffolds, method-description controls or TODOs.
  - Zero scientific runs. Do not generate the experimental fixtures, perform frozen candidate searches or run the
    experimental census/control/timing panel. Implement scientific functions without invoking them. Default CLI
    is help/dry-run; every scientific entry path requires real future authority.
  - At most60 TOTAL fixed synthetic/static/mock case executions INCLUDING reruns; each<=10seconds and aggregate<=300wall/CPU
    seconds. This new fixed allowance permits regression coverage, not scientific controls relabeled as unit tests.
    Static parse, version checks and source inspection allowed. Record every actual command, case count, result
    and duration.
  - Use published reviewer checks and worked counterexamples as regression requirements. Preserve their original
    bytes. Copy/adapt checks only in your own tests.py; explicitly mark obsolete wall/CPU-cap expectations as superseded
    by the new amendment rather than making the implementation violate current policy. A skipped check is not PASS.
  - 'Resolve every accepted finding: discard and record singular candidates; execute constant-O all-start coefficient-reset
    census and verify zero solves; distinguish failed certificates from fruitless denominators; reduce every named
    control into validity; preserve progress incrementally across all stages and checkpoints; produce full canonical
    manifest/companions, rejected candidates, cost splits, Cayley gap and exact all-u decision; atomically publish
    verified artifacts.'
  - Check cancellation and process-group memory inside long loops; one worker. Distinguish cancellation, memory/watchdog,
    I/O and implementation failures from invalid scientific controls. Ordinary wall/CPU estimates remain advisory,
    but total/stage actual costs must be recorded. No silent loss of completed cells, starts or fixture rejections
    on interruption.
  - Lock verification must authenticate externally supplied Coordinator authority and bind actual spec/amendment/driver/plan/runtime/resource
    bytes and an archived review admission decision naming the corrected snapshot and report hashes. Verify required
    review verdict, source identity and reachable archive commit. Never treat arbitrary hash-bound text as an admission
    receipt. Missing real future trust input refuses launch but is not permission to leave code unfinished. Do not
    mint a real lock, key, signature, RUN or review verdict.
  - No ordinary implementation work may be reported as a mathematical blocker. For a genuine conflicting frozen
    requirement or unavailable dependency, report the exact item promptly and complete independent obligations.
    Keep all scientific scope/parameters fixed.
  - Before relinquishing, statically trace every frozen obligation to executable code and a canonical artifact.
    Complete means implementation ready for independent review, not scientific or launch approval. If an obligation
    remains unwritten, label it partial and name it, never claim backend completeness.
