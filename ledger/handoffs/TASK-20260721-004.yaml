handoff:
  id: TASK-20260721-004
  from: coordinator
  to: reviewer
  objective: >-
    Independently reconstruct and try to falsify every surviving mechanism,
    novelty distinction, and complete-cost claim in TASK-20260721-001.
  uncertainty_reduced: >-
    Whether any proposed mechanism is genuinely non-duplicate, non-tautological,
    scope-correct, and credible enough for a frozen theorem or toy experiment.
  inputs:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-001/tasks/TASK-20260721-001/mechanism_frontier.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-001/tasks/TASK-20260721-001/novelty_matrix.md
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-001/archives/TASK-20260721-003/snapshot_commit_receipt.json
    - ledger/
    - experiments/
    - knowledge/
    - ideas/
  constraints:
    - Use a non-originating independent session with review-xhigh and no fallback.
    - Review only the verified snapshot; do not edit producer or shared ledger artifacts.
    - Recompute operation novelty, information source, asymptotic exponents, concrete costs, memory, preprocessing amortization, success probability, source replay, factor logs, descent, and verification.
    - Test generic-group simulability and nearest semantic predecessors before accepting representation leverage.
    - Distinguish a useful identity or local stage improvement from an end-to-end ECDLP improvement.
    - No live keys, deployed systems, unrestricted lower bound, or breakthrough claim.
    - Record requested_policy, exact resolved_model_id, reasoning_effort, fallback_used, adapter_version, originating-session separation, and snapshot commit.
  deliverables:
    - review_report.yaml
    - adversarial_notes.md
  artifact_paths:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-001/reviews/TASK-20260721-004/review_report.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-001/reviews/TASK-20260721-004/adversarial_notes.md
  archived_by: TASK-20260721-006
  inference:
    policy: review-xhigh
    fallback_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 1800
    memory_gb: 6
    maximum_runs: 1
  completion_gate:
    - Both reports bind the verified snapshot commit and every reviewed input by SHA-256.
    - Each candidate receives PASS | REVISE | FAIL with exact mathematical, novelty, and cost rationale.
    - Any potential breakthrough is explicitly withheld pending a separate approved experiment, certificates, and independent replication.
    - The report recommends exactly one next action for this lane.
  return_format: Independent YAML verdict plus Markdown adversarial reconstruction.
