  axis_title: >-
    The isogeny class as one algorithmic object: advice, preprocessing and multi-instance asymptotics charged in a full cost model

  objective: >-
    Generate proposals that treat THE WHOLE ISOGENY CLASS as a single
    algorithmic object rather than a set of separate instances. The class contains
    about h(O) ~ |D|^{1/2+o(1)} ~ p^{1/2+o(1)} curves; every one of them has the
    same N, and transport theorem T1 moves an instance between any two of them at
    the cost of an isogeny path, with a UNIFORMLY RANDOM member reachable in
    O(log p) steps under the GRH-conditional rapid mixing cited as T5.

    The sharp question lane L13 opens but has only ever posed at toy scale: does
    that structure give an ADVICE or PREPROCESSING advantage that a generic group of
    the same order does not have? The generic bounds to beat or match are explicit
    and must be cited and charged, not gestured at: the Corrigan-Gibbs--Kogan
    preprocessing tradeoff for discrete log (roughly S * T^2 ~ N for advice size S
    and online time T), Bernstein--Lange and Mihailescu preprocessing bounds, and
    the AT^2 lower bounds. A claim that ignores the cost of the advice, of the
    transport, or of the memory access pattern is not a claim.

    THE TWO OUTCOMES ARE BOTH PUBLICATION-SHAPED AND BOTH ARE IN SCOPE. Either (a) a
    separation: class structure buys something the generic model forbids, stated
    with its exact advice/time exponents and the heuristics it rests on; or (b) a
    matching LOWER BOUND in a class-structured preprocessing model that you define
    precisely -- showing that the isogeny class, despite being highly structured,
    buys nothing beyond the generic tradeoff. Outcome (b) requires no
    cryptographic-scale compute at all and would be the cleanest citable negative
    this campaign could produce.

    Note the tension you must resolve rather than dodge: transport to a RANDOM class
    member is cheap, transport to a SPECIFIED one is vectorization-hard (T5). Any
    preprocessing scheme has to say which kind of transport it needs, and pay for
    it.

  uncertainty_reduced: >-
    Whether GOAL-ENDO-001 has a live path to a publication-grade result, or
    whether its fourteen-lane decomposition has already enumerated the reachable
    mechanisms and the remaining work is closure. The campaign has 146 committed
    proposals, a gating lane paused on instrument calibration at toy scale, and
    a documented convergence toward negatives. This axis tests one specific
    hypothesis about WHERE a live path could still be: that the lane structure
    is indexed by resource applied to a single curve's point group, and that
    objects outside that indexing have not been systematically generated. A
    well-argued finding that this axis is ALSO closed, with the obstruction
    named, reduces the same uncertainty and is an accepted deliverable.

  seed_note: >-
    Charge every cost end to end. The campaign's red-team contract exists
    largely to catch omitted end-to-end costs, and a preprocessing proposal is the
    single easiest place in this program to hide one.

