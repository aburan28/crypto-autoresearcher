handoff:
  id: TASK-20260801-044
  from: coordinator
  to: validator
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-024
  objective: >-
    Independently validate the RUN-DEP-001-measure package and return ADMISSIBLE or INADMISSIBLE
    with a concrete defect list, BEFORE the Coordinator interprets anything.
  uncertainty_reduced: 'Whether the measurement is evidence at all.'
  inputs:
  - experiments/EXP-DEP-001/specification.yaml
  - experiments/EXP-DEP-001/reading_rule.yaml
  - experiments/EXP-DEP-001/implementation/dep001_driver.py
  - experiments/EXP-DEP-001/runs/RUN-DEP-001-measure/
  - experiments/EXP-DEP-001/results/measure/
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/archives/TASK-20260801-043/snapshot_commit_receipt.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/archives/TASK-20260801-036/snapshot_commit_receipt.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/tasks/TASK-20260801-042/execution_report.yaml
  constraints:
  - 'INDEPENDENT SESSION. Recompute rather than reason wherever recomputation is possible.'
  - >-
    VERIFY EXPECTED RUN AND ARM COUNTS - every rung of all three ladders at R_REPS = 200 at both
    cells, every arm at n = 130816.
  - >-
    RE-VERIFY CTRL-DEP-MARG INDEPENDENTLY on at least one reconstructed arm per family per cell.
    Do not accept the driver's self-report.
  - >-
    RE-VERIFY THE MAXIMAL-DEVIATION CERTIFICATE INDEPENDENTLY - rebuild the topmost-rung object
    from the recorded seeds, recompute its marginal digests, its rank correlation and its four
    statistics, and confirm each against its archived threshold. This certificate is the
    refutation artifact a D-3 reading would rest on and it must be checkable rather than
    asserted.
  - >-
    RECOMPUTE THE BINOMIAL INTERVALS. Verify that every reported Clopper-Pearson bound is correct
    arithmetic and that DET-DEP-1's two clauses were applied as written.
  - >-
    Verify schema completeness, seed and stream integrity including disjointness, driver-hash
    equality with the calibration receipt, CTRL-DEP-EQDHASH, raw versus summary agreement at
    tolerance zero where exact agreement is expected, and that no file under
    experiments/EXP-EQD-001/ changed.
  - >-
    Verify that dup_residual is present as a machine-readable field and report its value; verify
    that NO statistic of OBJ-REAL against any null was computed.
  - Run tools/validate_ledger.py check_run on the manifest and quote its error list verbatim.
  - >-
    STATE NO DISPOSITION AND DO NOT APPLY THE READING RULE. Report what is admissible; the
    classification is the Coordinator's at TASK-20260801-046.
  - 'MAKE NO COMMIT; TASK-20260801-046 archives this report.'
  - 'Record inference honestly (requested review-adversarial, independent session).'
  deliverables:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/reviews/TASK-20260801-044/validation_report.yaml
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/reviews/TASK-20260801-044/validation_report.yaml
  archived_by: TASK-20260801-046
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 7200
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
  - >-
    A literal ADMISSIBLE or INADMISSIBLE verdict with a concrete defect list; arm counts,
    marginal bit-identity, the maximal-deviation certificate and the binomial arithmetic each
    independently re-verified and reported; check_run error list quoted verbatim; no disposition
    stated.
