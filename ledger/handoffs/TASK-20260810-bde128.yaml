handoff:
  id: TASK-20260810-bde128
  recorded_at: '2026-08-10'
  goal_id: GOAL-MD5-001
  question_id: RQ-MDFIVE-6870c1
  batch_id: BATCH-46254b
  task_card: coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/task-cards/TASK-20260810-bde128.md
  role: executor
  from: coordinator
  to: executor
  objective: >-
    Discharge the RQ-MDFIVE-6870c1 acquisition gate: obtain in primary text the
    MD5 preimage literature and at least one published MD5 collision path, file
    them as KN-LIT entries at stated provenance levels, quarantine the
    collision-path payload under BCP-1's marker so the corpus gains the
    bibliography without gaining the answer, and settle against primary text the
    apparent error the RQ flags in its own provenance block.
  uncertainty_reduced: >-
    Whether the figures this campaign will be reasoning against are real. Every
    number in RQ-MDFIVE-6870c1 provenance is a web-search excerpt that nobody in
    this program has read - including the ~2^123.4 complexity, the paper titles,
    and one excerpt's claim of the first PRACTICAL preimage attack, which the RQ
    flags as an apparent error precisely because 2^123.4 is not practical. This
    task is where those become verified, corrected, or recorded as unobtainable.
  inputs:
    - >-
      RQ-MDFIVE-6870c1 provenance block, whose every figure is UNVERIFIED and is
      the target of this task rather than a source for it
    - >-
      RQ-MDFIVE-6870c1 constraint 1, which forbids designing any experiment
      until the preimage papers and at least one published collision path are
      filed as KN-LIT at stated provenance levels
    - >-
      BCP-1, which defines the quarantine path and marker this task must apply
      and which was committed before this task ran
    - >-
      GOAL-MD5-001 pause condition covering the case where primary text cannot
      be obtained under the network policy
    - >-
      knowledge/README.md and the KN-LIT conventions, plus tools/allocate_id.py
      for minting the identifiers
  constraints:
    - >-
      SC-1 FABRICATE NOTHING. No invented timing, measurement, throughput,
      citation, review verdict, model identifier or commit SHA. A field that is
      not yet knowable stays null and is named as such. THIS IS THE LOAD-BEARING
      CONSTRAINT FOR THIS TASK: a KN-LIT entry reconstructed from recollection
      rather than from text is a fabricated citation, and is worse than an
      absent entry.
    - >-
      SC-2 CLAIM CEILING. Assert nothing about MD5 - no collision, no preimage,
      no complexity, no method ceiling, no obstruction, and no comparison
      against any published result in either direction. Recording what a source
      CLAIMS, attributed and at a stated provenance level, is not asserting it.
    - >-
      SC-3 UNVERIFIED FIGURES STAY MARKED. Anything not obtained in primary text
      stays marked unverified and is never cited as authority in either
      direction. Do not smooth over the apparent error the RQ flags; settle it
      against text, or record it as unsettled with the reason.
    - >-
      SC-4 A failed, halted or exhausted search is a BUDGET OUTCOME about a
      solver and NEVER evidence about MD5 (AGENTS.md rules 5 and 8). An
      unreachable source is an acquisition outcome and is never evidence about
      the underlying cryptanalysis.
    - >-
      SC-5 Anything not attempted is named OPEN AND UNATTEMPTED and is never
      recorded as tried, screened or negative.
    - >-
      SC-6 Change no hypothesis, question, experiment or goal status; approve no
      experiment; promote no internal finding; edit no committed record; record
      no attestation and no review verdict. Filing KN-LIT is acquisition, not
      promotion; KN-FIND promotion remains the Coordinator's alone.
    - >-
      SC-7 Halt at the declared wall_clock_seconds and report the halt
      truthfully as infrastructure signal, naming the dropped work as scope
      rather than as an answer.
    - >-
      SC-8 Never select, configure, probe, contact or use Amazon Bedrock
      (AGENTS.md rule 16).
    - >-
      THE QUARANTINE IS MANDATORY AND IS THE REASON BCP-1 WAS COMMITTED FIRST.
      The KN-LIT entry for the collision path carries bibliography, provenance
      level and what the source claims, and carries NO path data - no
      differential characteristic, no message-block values, no colliding pair.
      The payload itself goes under coordination/goals/GOAL-MD5-001/quarantine/
      with BCP-1's marker, and the KN-LIT entry references it BY SHA256 ONLY.
      Filing the payload into knowledge/literature/ would make the blindness
      requirement unfalsifiable for the whole campaign.
    - >-
      MINT KN-LIT IDENTIFIERS WITH tools/allocate_id.py AND --check THEM BEFORE
      USE. Do not grep for the next free number. Because the Coordinator session
      that wrote this card had no Bash and could not mint them, the identifiers
      could not be pre-declared in artifact_paths; kn-lit-manifest.json is the
      declared artifact that closes that gap and MUST enumerate every file this
      task wrote under knowledge/literature/ and under quarantine/, each with its
      path, minted identifier, sha256, and quarantine status.
    - >-
      STATE THE PROVENANCE LEVEL OF EVERY ENTRY EXPLICITLY: primary text
      obtained and read, abstract or metadata only, or unobtainable. If a source
      is unobtainable under the network policy, record that as the outcome and
      name the GOAL-MD5-001 pause condition it engages rather than substituting a
      recollection.
    - >-
      Attempt knowledge retrieval before asserting that any of this is not
      already filed, and record the query and its outcome. An unavailable index
      licenses no absence, novelty or prior-non-testing inference in either
      direction.
    - >-
      Write only under this task's directory, under quarantine/, and under
      knowledge/literature/. Do not write anywhere in the concurrently-running
      TASK-20260810-3e0793 write scope. Do not create or edit
      knowledge/INDEX.md, which is generated and gitignored.
    - >-
      Do not commit. TASK-20260810-5c819b snapshots these bytes, including every
      path enumerated in kn-lit-manifest.json.
  deliverables:
    - >-
      acquisition-report.yaml recording each source, its provenance level, what
      it claims, and how the RQ's flagged apparent error was settled or why it
      could not be
    - >-
      KN-LIT entries under knowledge/literature/ for the preimage literature and
      one published MD5 collision path, the latter carrying no path data
    - >-
      the quarantined collision-path payload under
      coordination/goals/GOAL-MD5-001/quarantine/ with BCP-1's marker, if
      primary text was obtained
    - >-
      kn-lit-manifest.json enumerating every written file with path, minted
      identifier, sha256 and quarantine status
  artifact_paths:
    - >-
      coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/tasks/TASK-20260810-bde128/acquisition-report.yaml
    - >-
      coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/tasks/TASK-20260810-bde128/kn-lit-manifest.json
  archived_by: TASK-20260810-5c819b
  inference:
    policy: research-deep
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 450
    memory_gb: 2
    maximum_runs: 2
  completion_gate:
    - >-
      Every KN-LIT entry states its provenance level explicitly, and nothing
      reconstructed from recollection is filed as if it were read.
    - >-
      The collision-path KN-LIT entry contains no path data and references its
      payload by sha256 only; the payload, if obtained, sits under quarantine/
      with BCP-1's marker.
    - >-
      kn-lit-manifest.json enumerates every file written under
      knowledge/literature/ and quarantine/ with path, minted identifier, sha256
      and quarantine status.
    - >-
      The RQ's flagged apparent error about a first PRACTICAL preimage attack is
      either settled against primary text with the correction recorded, or
      recorded as unsettled with the reason.
    - >-
      Knowledge retrieval was attempted and its query and outcome recorded, with
      no absence or novelty inference drawn.
    - >-
      Nothing was written into the TASK-20260810-3e0793 write scope, and
      knowledge/INDEX.md was not created or edited.
  return_format: >-
    A summary naming the two declared paths plus every path enumerated in
    kn-lit-manifest.json, the provenance level of each source, the minted KN-LIT
    identifiers, the sha256 and quarantine status of the payload if obtained,
    the disposition of the RQ's flagged apparent error as settled or unsettled
    with its reason, the knowledge-retrieval query and outcome, and a truthful
    halt statement if the declared budget was reached.
