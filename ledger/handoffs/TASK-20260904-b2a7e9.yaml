  from: coordinator
  to: coordinator
  objective: DESIGN ONLY. Convert the 4 untested prime-field ECDLP proposals in batch BATCH-2eaca1 (theory-gov)
    into specified hypotheses and frozen experiment contracts. No execution, no run records, no approval.
  uncertainty_reduced: Whether each backlog proposal is testable as stated, and at what scope and cost. A ledger
    audit found 1620 proposals against 434 hypotheses; 131 live prime-field ECDLP proposals are referenced nowhere
    outside their own file.
