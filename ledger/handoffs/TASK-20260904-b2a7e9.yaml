  - One experiment contract per hypothesis at experiments/<EXP-ID>/specification.yaml, status 'draft' (NOT approved; AGENTS.md line 539: draft -> review_required -> approved).
  - Each contract states the falsifiable prediction, the exact measured quantity with units, the null/control object,
