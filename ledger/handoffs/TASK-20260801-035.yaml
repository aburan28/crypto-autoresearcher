handoff:
  id: TASK-20260801-035
  from: coordinator
  to: executor
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-024
  objective: >-
    TWO ORDERED PHASES IN ONE TASK, AND THE ORDER IS PART OF THE CONTRACT. PHASE A - author
    experiments/EXP-DEP-001/implementation/dep001_driver.py COMPLETE, INCLUDING THE MEASUREMENT
    ENTRY POINT THAT IS NOT INVOKED IN THIS TASK, plus implementation.md. PHASE B - execute
    RUN-DEP-001-calib exactly as experiments/EXP-DEP-001/specification.yaml specifies, on NULL
    AND PLANT-MACHINERY OBJECTS ONLY - DEP-CAL-A through DEP-CAL-F at both cells. Observe and
    record only. Freeze no threshold, apply no reading rule, run no ladder rung and interpret
    nothing.
  uncertainty_reduced: >-
    What the frozen statistics do on objects whose law is known - the fresh measured null
    distribution, the reproduction of the archived EXP-EQD-001 thresholds, the behaviour of the
    plant machinery at rho = 0, and the attainability anchor.
  inputs:
  - experiments/EXP-DEP-001/specification.yaml
  - ledger/hypotheses/H-DEP-001.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/archives/TASK-20260801-034/snapshot_commit_receipt.json
  - 'experiments/EXP-EQD-001/implementation/eqd001_driver.py (READ-ONLY)'
  - 'experiments/EXP-EQD-001/results/calib/null_replicate_statistics.json (READ-ONLY)'
  - harness/toycurve.py
  constraints:
  - >-
    run_authorized ONLY if TASK-20260801-034 records CALIBRATION_AUTHORIZATION AUTHORIZED;
    otherwise cancel with no run and say so.
  - >-
    IMPORT THE FIBRE-INVARIANT MAP AND THE FOUR STATISTICS READ-ONLY FROM
    experiments/EXP-EQD-001/implementation/eqd001_driver.py AND ASSERT ITS sha256 EQUALS
    bdb2601b195f314a4430fa80fcf8ab15ec0b605335a8386a93c2b9b3c7d7b02f AT STARTUP
    (CTRL-DEP-EQDHASH). Do not re-implement them. A mismatch ABORTS the run and is an integrity
    failure, never a datum.
  - >-
    DO NOT WRITE, EDIT, RENAME, APPEND TO, MOVE OR STAGE ANY FILE UNDER experiments/EXP-EQD-001/.
    Read-only access only.
  - >-
    THE CALIBRATION NEVER SEES THE REAL DATA, STRUCTURALLY AND NOT BY INSTRUCTION (ATS-DEP-1.3).
    Enumerate NO half-tuple of the deterministic factor base, run NO rung of any of the three
    ladders, and emit NO duplicate decomposition. Set the tripwire field
    calibration_saw_real_object false and make it structurally checkable.
  - >-
    THE DRIVER IS AUTHORED COMPLETE HERE AND IS NOT EDITED AGAIN (ATS-DEP-1.5). The measurement
    entry point must be present, reachable and unexecuted. Record the driver sha256 in the
    calibration manifest; TASK-20260801-042 must execute the IDENTICAL file with no edit.
  - >-
    IMPLEMENT THE FROZEN FORMS EXACTLY AS WRITTEN AND CHOOSE NOTHING. The three plant
    constructions, the three ladders, rho_star, eps_star, DET-DEP-1, CERT-DEP-1, R_REPS = 200,
    R_ANCHOR_REPS = 20 and the statistic family are frozen in the contract. Do not add, drop,
    retune or substitute any of them.
  - >-
    IMPLEMENT CTRL-DEP-MARG ON EVERY PLANTED ARM WITHOUT EXCEPTION - the four sorted-marginal
    sha256 digests plus the K = 16 and K = 64 one-dimensional marginal histograms of e_1 and e_2
    on source and plant. A MISMATCH ABORTS THE ARM AND IS RECORDED WITH ITS RUNG AND REPLICATE
    INDEX. IT IS INSTRUMENT FAILURE AND NEVER A RESULT.
  - >-
    Implement DIAG-DEP-RHO on every planted arm - the measured Spearman rank correlation on
    source and plant, and for the CELL and BLOCK families the K = 16 joint total variation
    distance. A plant that leaves the joint table unmoved is a null object wearing a plant's name
    (DESIGN-TRAP-1).
  - >-
    Enumerate i < j only. The diagonal is excluded BY CONSTRUCTION at n = C(512, 2) = 130816 per
    sample set. If any arm records a single c_2 = 0 draw, stop and report it - that is an
    integrity failure, not a datum.
  - >-
    On the null side, maintain 512 DISTINCT x-coordinates by REJECT AND REDRAW on an x-collision,
    and record the rejection count. This is the only redraw permitted anywhere in this experiment.
  - >-
    USE THE FROZEN STREAMS AND VERIFY DISJOINTNESS - calibration null 2301 + 60000 + bits, source
    null for plants 2301 + 70000 + bits, copula noise 2301 + 80000 + bits, cell transfer
    2301 + 90000 + bits, block permutation 2301 + 110000 + bits, apparatus identity
    2301 + 120000 + bits, faithfulness sample 2301 + 130000 + bits. EVERY ONE MUST BE DISJOINT
    FROM THE ARCHIVED EXP-EQD-001 STREAMS 2301 + 10000, 20000, 30000, 40000 and 50000 plus bits.
    Record every stream seed and hash.
  - >-
    CTRL-DEP-S3 samples its 1000 half-tuples UNIFORMLY AT RANDOM from the full enumeration and
    NOT as a prefix. This is the RANK 6 cheap repair the BATCH-023 close ranked and it costs
    nothing.
  - >-
    The run wrapper writes git_status_prerun.txt capturing `git status --porcelain` BEFORE
    invoking the driver. This is the second RANK 6 cheap repair.
  - >-
    The run manifest is manifest.yaml, NOT manifest.json, with companions command.txt,
    environment.json, stdout.log, stderr.log and raw-result.json - NOTE THE .log RATHER THAN
    .txt. The manifest must carry id, experiment_id, status, code with commit and command,
    environment, inputs with parameters and every seed, timing, resources and result, and
    result.certificate.kind must be the literal string none.
  - >-
    Memory policy - retain per-replicate statistic values, marginal digests, stream hashes and
    one representative OBJ-NULL-RFB draw per cell. Do NOT archive the full per-pair invariant
    arrays.
  - >-
    NO FACTORIZATION, NO LARGEST PRIME FACTOR, NO SMOOTHNESS INDICATOR, NO DICKMAN EVALUATION, NO
    u LADDER, NO SEARCH ARM, NO TIMING DECISION VARIABLE, NO COST IDENTITY AND NO R anywhere in
    the driver or the package. wall_seconds_total is recorded for budget accounting only.
  - 'DO NOT FREEZE ANY THRESHOLD. Emit the raw replicate values; TASK-20260801-038 applies THR-DEP-1 to them.'
  - 'Do NOT classify anything against RR-DEP-1, which does not exist yet, and do not state a disposition of any kind.'
  - >-
    THIS RUN IS EXPRESSLY NON-EVIDENTIAL about H-DEP-001, H-EQD-001, HEUR-DS-1 and H-SMTH-001 in
    either direction. Do not describe any calibration number as a result about the Semaev map.
  - 'AP-1 BINDS. Do not set smoothness_abort on any EXP-DS-001 arm and do not represent any such run as exercising anything.'
  - 'Timeouts, crashes, memory exhaustion and budget cancellation are infrastructure signal, never mathematical negatives (AGENTS.md rule 5).'
  - 'No new dependencies. If any new dependency proves necessary the run is cancelled and reported, not extended.'
  - 'MAKE NO COMMIT; TASK-20260801-036 archives.'
  - 'Record inference fallback honestly (requested executor-implementation).'
  - Do not alter any ledger record. Leave FAEST and XEDN alone.
  deliverables:
  - experiments/EXP-DEP-001/implementation/dep001_driver.py
  - experiments/EXP-DEP-001/implementation/implementation.md
  - experiments/EXP-DEP-001/runs/RUN-DEP-001-calib/manifest.yaml
  - experiments/EXP-DEP-001/runs/RUN-DEP-001-calib/raw-result.json
  - experiments/EXP-DEP-001/runs/RUN-DEP-001-calib/command.txt
  - experiments/EXP-DEP-001/runs/RUN-DEP-001-calib/environment.json
  - experiments/EXP-DEP-001/runs/RUN-DEP-001-calib/stdout.log
  - experiments/EXP-DEP-001/runs/RUN-DEP-001-calib/stderr.log
  - experiments/EXP-DEP-001/runs/RUN-DEP-001-calib/git_status_prerun.txt
  - experiments/EXP-DEP-001/results/calib/null_replicate_statistics.json
  - experiments/EXP-DEP-001/results/calib/marginal_integrity_report.json
  - experiments/EXP-DEP-001/results/calib/archived_threshold_reproduction.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/tasks/TASK-20260801-035/execution_report.yaml
  artifact_paths:
  - experiments/EXP-DEP-001/implementation/dep001_driver.py
  - experiments/EXP-DEP-001/implementation/implementation.md
  - experiments/EXP-DEP-001/runs/RUN-DEP-001-calib/manifest.yaml
  - experiments/EXP-DEP-001/runs/RUN-DEP-001-calib/raw-result.json
  - experiments/EXP-DEP-001/runs/RUN-DEP-001-calib/command.txt
  - experiments/EXP-DEP-001/runs/RUN-DEP-001-calib/environment.json
  - experiments/EXP-DEP-001/runs/RUN-DEP-001-calib/stdout.log
  - experiments/EXP-DEP-001/runs/RUN-DEP-001-calib/stderr.log
  - experiments/EXP-DEP-001/runs/RUN-DEP-001-calib/git_status_prerun.txt
  - experiments/EXP-DEP-001/results/calib/null_replicate_statistics.json
  - experiments/EXP-DEP-001/results/calib/marginal_integrity_report.json
  - experiments/EXP-DEP-001/results/calib/archived_threshold_reproduction.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/tasks/TASK-20260801-035/execution_report.yaml
  archived_by: TASK-20260801-036
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 1800
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
  - >-
    Driver authored complete with an unexecuted measurement entry point and its sha256 recorded;
    CTRL-DEP-EQDHASH verified and recorded; CALIBRATION_AUTHORIZATION gate respected; DEP-CAL-A
    through DEP-CAL-F complete at both cells or an honest incomplete report; every arm at
    n = 130816 or reported short; CTRL-DEP-MARG run on every planted arm with its digests
    recorded; every stream seed recorded and verified disjoint from the archived EXP-EQD-001
    streams; zero c_2 = 0 draws recorded and every null redraw counted; no OBJ-REAL sample, no
    deterministic factor-base x-list and no ladder rung anywhere in the package with the tripwire
    false; no factorization, no smoothness statistic, no search arm, no timing decision variable
    and no R; no threshold frozen; no disposition stated; manifest.yaml present with its required
    fields, the five companion filenames and git_status_prerun.txt beside it.
