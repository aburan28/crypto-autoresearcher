handoff:
  id: TASK-20260724-247
  from: coordinator
  to: red-team
  objective: >-
    Try to falsify the interpretation, scope, and cost relevance of the
    EXP-FB3-001 result and of its pre-registered conservation arm. Attack the
    claim boundary, not the arithmetic: identify every way the stated conclusion
    could over-reach, every factor-base channel the tested convention does NOT
    cover, and the cheapest control that would break the conclusion.
  uncertainty_reduced: >-
    Whether a scoped kill of the F3 factor-base family is honestly supported, or
    whether the convention, the counting model, or the yield-versus-solving-cost
    distinction leaves the question open.
  inputs:
    - experiments/EXP-FB3-001 (verified snapshot)
    - experiments/EXP-FB3-001/specification.yaml
    - experiments/EXP-FB3-001/amendment-001.yaml
    - ledger/H-FB3-001.yaml
    - ledger/EV-FB-001.yaml
    - knowledge/techniques/KN-TECH-003.md
  constraints:
    - >-
      Write objections and falsification routes; do not change any official
      state and do not rewrite the executor's artifacts.
    - >-
      Attack specifically: whether the conservation identity is convention-bound
      (multisets versus signed x-coordinate bases versus typed bases), whether
      coverage rather than mean yield could still be a lever, whether a geometry
      outside the six could evade the argument, and whether closing the yield
      channel is being conflated with closing index calculus.
    - Toy scale; a passing control is not a cryptanalytic result.
  deliverables:
    - red_team_report.yaml with enumerated objections, each marked as fatal, scoping, or noted
    - objections.md with the cheapest next control that could overturn the conclusion
  artifact_paths:
    - coordination/goals/GOAL-ICLIFT-001/batches/BATCH-001/tasks/TASK-20260724-233/red_team_report.yaml
    - coordination/goals/GOAL-ICLIFT-001/batches/BATCH-001/tasks/TASK-20260724-233/objections.md
  archived_by: TASK-20260724-236
  inference:
    policy: review-xhigh
    fallback_allowed: true
    independent_session_required: true
  budget:
    wall_clock_seconds: 3600
    memory_gb: 2
    maximum_runs: 2
  completion_gate:
    - Every objection is classified and tied to a concrete artifact or claim sentence.
    - An explicit statement of the narrowest defensible claim boundary is provided.
  return_format: red_team_report
