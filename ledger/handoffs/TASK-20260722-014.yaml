  from: "coordinator"
  to: "reviewer"
  objective: "Independently falsify the revised certificate's schedule completeness, rank semantics, probability gate, resource ownership, controls, novelty, and claim boundaries."
  uncertainty_reduced: "Whether the revised proposal is concrete enough for a separately frozen toy validation protocol."
  inputs:
    - "verified TASK-20260722-013 snapshot"
    - "complete lifecycle, claims, harness, tools, and ledger contracts"
  constraints:
