handoff:
  id: TASK-20260906-b44b88
  from: coordinator
  to: coordinator
  to_rationale: >-
    Coordinator, because this is an archival commit into the shared worktree and
    the Coordinator alone stages declared research paths (AGENTS.md; CLAUDE.md
    "Conventions"). tools/research_dispatch.py validate_archive_shape enforces the
    same thing mechanically: an archive task must have the coordinator role. NO
    EXECUTOR IS APPROPRIATE: nothing is implemented, run, or computed. NO VALIDATOR
    OR RED TEAM IS APPROPRIATE: there is no claim to review -- this task commits
    bytes and records their hashes.
  authorized_by: DEC-20260906-dc6694
  goal_id: GOAL-PATH-001
  batch_id: BATCH-002

  why_this_task_exists: >-
    IT IS THE DISCHARGE OF A STANDING INSTRUCTION IN A COMMITTED RECORD, NOT AN
    INVENTION OF THIS BATCH. ledger/handoffs/TASK-20260810-9e7f4c.yaml carries
    `archived_by: null` with this note, verbatim: "DELIBERATELY NULL, NOT AN
    OMISSION. Exactly one snapshot archival task must own this task's artifacts,
    and its TASK-* identifier could not be minted by the authoring session: IDs
    must come from python3 tools/allocate_id.py --next handoff and no shell was
    available. THE DISPATCHING SESSION MUST ALLOCATE THAT ARCHIVAL TASK AND SET
    THIS FIELD BEFORE DISPATCH. A task whose archive receipt is never written
    cannot reach completed and must be closed invalid instead." TASK-20260906-b44b88
    IS THAT ARCHIVAL TASK. It was minted and `--check`ed free by the driving
    session; the Coordinator subagent that authored this record holds no shell and
    minted nothing.
    coordination/remediation/FINDING-20260904-path-001-batch-002-undispatchable.md
    concluded that dispatching this batch would require "inventing an archive task
    the decision never authorized". That conclusion is retired on the text above:
    the decision's own handoff ordered it.

  the_field_that_cannot_be_set: >-
    RECORDED AS PROCEDURE DEVIATION PD-1 IN
    coordination/goals/GOAL-PATH-001/batches/BATCH-002/batch.yaml AND IN
    DEC-20260906-dc6694, NOT LEFT FOR A READER TO TRIP OVER. The envelope orders
    the dispatching session to SET `archived_by`. That cannot be done: the record
    is committed and immutable, and AGENTS.md rule 2 permits supersession, never
    overwriting. `archived_by` therefore stays null in
    ledger/handoffs/TASK-20260810-9e7f4c.yaml permanently. THE SUBSTANCE IS
    DISCHARGED BY THE FIELD THE DISPATCHER ACTUALLY ENFORCES: this task's
    `archive.source_task_ids: [TASK-20260810-9e7f4c]` in
    coordination/goals/GOAL-PATH-001/batches/BATCH-002/dispatch_queue.json, which
    validate_queue checks makes exactly one archival task own the producer's
    artifacts. The driving session reports that the string `archived_by` does not
    appear in tools/research_dispatch.py at all, so the envelope's instruction
    named a field that could never have carried the binding.

  objective: >-
    Commit, ALONE, exactly the two artifacts TASK-20260810-9e7f4c declares, plus
    this task's receipt, and bind them by content so the reconciliation becomes
    durable. Nothing else is staged, nothing is edited, and no record is authored.

  uncertainty_reduced: >-
    Whether the reconciliation package is durable and content-bound. Until this
    receipt is accepted by the post-commit verifier, TASK-20260810-9e7f4c's result
    is complete as WORK and not yet durable as EVIDENCE, and NO DREG BATCH MAY BE
    OPENED ON IT.

  inputs:
  - coordination/goals/GOAL-PATH-001/batches/BATCH-002/tasks/TASK-20260810-9e7f4c/reconciliation_report.md
  - coordination/goals/GOAL-PATH-001/batches/BATCH-002/tasks/TASK-20260810-9e7f4c/ladder_state.yaml
  - coordination/goals/GOAL-PATH-001/batches/BATCH-002/batch.yaml
  - ledger/decisions/DEC-20260906-dc6694.yaml
  - ledger/handoffs/TASK-20260810-9e7f4c.yaml
  - ledger/handoffs/TASK-20260906-b44b88.yaml

  constraints:
  - >-
    RUN ALONE. Workers do not commit into a shared worktree and two archives must
    not race on one Git index or HEAD.
  - >-
    STAGE ONLY THE DECLARED PATHS: TASK-20260810-9e7f4c's two artifacts and this
    receipt. Stage nothing else, and in particular stage no ledger record, no goal
    record, and no knowledge/INDEX.md, which is generated and gitignored.
  - >-
    EDIT NOTHING. This task authors no ledger record, edits no goal head, mints no
    identifier, and performs no supersession. It commits and it writes one receipt.
  - >-
    ZERO RUNS AND ZERO COMPUTE. maximum_runs is 0 and it is the binding bound. No
    experiment, no solver, no measurement.
  - >-
    ASSERT NO MATHEMATICAL RESULT AND NO CLAIM OF ANY KIND. This receipt says which
    bytes were committed. It says nothing about d_reg, about GOAL-DREG-001's
    ladder, or about the reconciliation's conclusions, and it neither endorses nor
    disputes them.
  - >-
    DISCLOSE
    coordination/goals/GOAL-PATH-001/batches/BATCH-002/dispatch_queue.json BY NAME
    IN `staged_not_in_binding_set`. It is deliberately bound by no receipt of this
    batch, because a content-bound archive stores its sha256 map inside the queue
    and binding it would need a hash fixed point no write ordering satisfies. See
    batch.yaml `queue_binding_note`.
  - >-
    Before committing, fetch origin/main and merge it into the working branch --
    merge, never rebase -- and record the base commit checked and the merge
    outcome in the receipt. NEVER RESOLVE A SYNC CONFLICT BY EDITING A RECORD;
    stop and report it.
  - >-
    A FAILED VERIFICATION IS AN INFRASTRUCTURE FINDING, NEVER NEGATIVE EVIDENCE
    about anything the reconciliation examined (AGENTS.md rule 5). Report the exact
    path and the exact check that failed, and change no record to make it pass.

  deliverables:
  - >-
    snapshot-receipt.json at the declared path, recording kind, source_task_ids,
    record_ids, the recomputed path_sha256 for every archive and source artifact,
    the commit sha and parent, the base commit fetched from origin/main and the
    merge outcome, and `staged_not_in_binding_set` naming the dispatch queue.
  - >-
    A one-line statement in the receipt that GOAL-PATH-001's dispatch_queue_path
    repair authorised by DEC-20260906-dc6694 OB-3 was applied by the driving
    session in an earlier commit and is NOT staged by this task.

  artifact_paths:
  - coordination/goals/GOAL-PATH-001/batches/BATCH-002/archives/TASK-20260906-b44b88/snapshot-receipt.json
  write_scope:
  - coordination/goals/GOAL-PATH-001/batches/BATCH-002/archives/TASK-20260906-b44b88/
  write_scope_note: >-
    The receipt directory only. The two source artifacts are COMMITTED by this task
    but are not written by it: they are produced under TASK-20260810-9e7f4c's own
    write_scope, which this task reads and never writes.

  archived_by: TASK-20260906-b44b88
  archived_by_note: >-
    An archive task terminates its own chain, exactly as GOAL-PATH-001 BATCH-001's
    TASK-20260725-671 did. This is NOT self-archiving in the prohibited sense: the
    dispatcher's assignment field is `archive.source_task_ids`, which names
    TASK-20260810-9e7f4c and never this task, and tools/research_dispatch.py
    refuses an archive whose source is itself an archive.

  archive:
    kind: snapshot
    binding_mode: content_first
    source_task_ids:
    - TASK-20260810-9e7f4c
    record_ids:
    - GOAL-PATH-001
    - GOAL-DREG-001
    commit_sha: null
    parent_sha: null
    path_sha256: {}
  archive_note: >-
    IDENTICAL TO THE `archive` BLOCK IN THE QUEUE BY CONSTRUCTION. commit_sha and
    parent_sha are null and path_sha256 is empty because the archive is `queued`:
    the completed-archive rules that demand full hash coverage apply only at
    `state: completed`, and THE DRIVING SESSION FILLS THESE AT ARCHIVE TIME. THIS
    SESSION FABRICATED NO HASH AND NO COMMIT SHA and had no shell to compute one.
  record_ids_note: >-
    `record_ids` names GOAL-PATH-001 and GOAL-DREG-001 because those are the
    records this package RECONCILES AGAINST, following BATCH-001's precedent of
    naming the records its snapshot covers. NEITHER GOAL RECORD IS STAGED, EDITED
    OR OWNED BY THIS ARCHIVE, and no ledger record is committed by this task at all.
  binding_mode_note: >-
    `content_first` is a CHOICE, not a default -- the field is optional and
    BATCH-001's archive carries none. GOAL-PATH-001 already has one dead commit
    binding: CORR-20260802-7787de records that its prior latest_verified_commit
    9f80eebbef2df9a521a9cce8da66391cfcb63e73 does not resolve while its recorded
    parent does, "the signature of a branch tip replaced by a squash merge", and
    that no commit reproduces the 61 declared path hashes of the BATCH-001 receipt.
    CLAUDE.md's answer to exactly that is that receipts bind to CONTENT first and
    commit reachability is advisory. A CONTENT MISMATCH REMAINS FATAL.

  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: true
    fallback_reason_if_used: >-
      Record the resolved model with fallback_used true and its reason if the
      harness cannot resolve the canonical policy alias. Never substitute silently
      (AGENTS.md rule 11).
    degraded_allowed: false
    independent_session_required: false
    independent_session_note: >-
      false because this task makes no claim and reviews nothing. It commits
      declared bytes and records their hashes.

  budget:
    wall_clock_seconds: null
    memory_gb: null
    maximum_runs: 0
  budget_note: >-
    ZERO-COMPUTE, DECLARED HONESTLY, ON THE PRECEDENT OF THE ENVELOPE THIS BATCH
    ARCHIVES. A Coordinator archive task runs no experiment, so maximum_runs is 0
    and it is the binding bound; wall_clock_seconds and memory_gb are null because
    NO COMMITTED RECORD FIXES A BUDGET FOR A COORDINATOR ARCHIVE TASK and
    inventing one would be a fabricated number under AGENTS.md rule 9 -- the same
    reasoning ledger/handoffs/TASK-20260810-9e7f4c.yaml's own budget_note gives.
    tools/research_dispatch.py `declares_zero_compute` (lines 105-127, called from
    validate_handoff at lines ~404-422) exists for exactly this case and accepts
    this shape; its docstring names GOAL-ECDLP-001 BATCH-e6c1c9 and GOAL-MD5-001
    BATCH-ebac02, which sat undispatchable "over a compute ceiling for compute that
    is never spent". NO POSITIVE CEILING IS INVENTED HERE AND `maximum_runs: 1` IS
    NOT WRITTEN: the dispatcher's floor for a zero-compute task is 0, and 1 would
    assert an authorisation this batch does not hold. This batch's charged
    experiment runs are ZERO.
    THIS TOLERANCE DOES NOT TRANSFER: any successor handoff that authorizes a DREG
    measurement MUST carry non-null wall_clock_seconds and memory_gb, derived from
    a committed cell cost, and a Coordinator must reject it otherwise
    (DEC-20260810-2f92d8 limitations; GOAL-PATH-001 next_action).

  completion_gate:
  - >-
    The commit contains exactly the declared paths and nothing else.
  - >-
    Every declared path_sha256 is recomputed from the committed tree, and a content
    mismatch is fatal.
  - >-
    The post-commit verifier accepts the receipt. UNTIL IT DOES, THE RECONCILIATION
    IS NOT DURABLE AND NO DREG BATCH MAY BE OPENED ON IT.
  - >-
    The base commit fetched from origin/main and the merge outcome are recorded in
    the receipt.
  - >-
    coordination/goals/GOAL-PATH-001/batches/BATCH-002/dispatch_queue.json is
    disclosed by name in `staged_not_in_binding_set`.

  return_format: >-
    The receipt path, the commit and parent sha, the count of paths bound, the base
    commit and merge outcome, and the verifier's verdict. If verification fails,
    report it as an infrastructure finding with the exact failing check and change
    no record to make it pass.

  what_this_task_does_not_do:
  - It approves no experiment, freezes no protocol, and authorises no measurement.
  - >-
    It opens no GOAL-DREG-001 batch. The standing prohibition stands: NO DREG BATCH
    MAY BE OPENED BEFORE THE RECONCILIATION IS COMMITTED -- and this task is what
    commits it, not what acts on it.
  - >-
    It does not disposition the reconciliation, checkpoint any goal, or set any
    next action. That is DEC-20260906-dc6694 N-3, a separate Coordinator decision
    under an identifier not yet minted.
  - >-
    It does not repair CD-1, does not edit or rename DEC-20260731-014, and does not
    touch the completed GOAL-DREG-001 BATCH-005 ledger receipt.
  - >-
    It changes no hypothesis status, no goal status and no claim tier, and asserts
    no mathematical result in either direction.

  authoring_session_limits: >-
    Written by a Coordinator subagent with Read, Grep, Glob, Write and Edit and NO
    BASH. It ran no git command, no tools/allocate_id.py, no
    tools/validate_ledger.py and no tools/research_dispatch.py; it minted no
    identifier, computed no sha256, measured no timing and asserted no commit sha.
    Every dispatcher behaviour cited above is cited by file, function and line so
    the next reader can re-check it rather than inherit it.
