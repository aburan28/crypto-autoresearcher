handoff:
  id: TASK-20260901-354ef5
  from: coordinator
  to: idea-generator
  objective: >-
    Produce a fully specified, NOT-executed heuristic-validation experiment
    design for candidate C2 (object-enumeration.yaml, id C2): the
    round-by-round Hamming-distance histogram between two
    independently-uniform-random-key trajectories at full round count,
    against a Binomial(128,1/2) null, against a matched null control of
    independent uniformly random round-key sequences, plus the round-count
    decay check and a round-1 sensitivity anchor.
  uncertainty_reduced: >-
    Whether C2's minimal_test_sketch (object-enumeration.yaml) can be
    converted into a preregistered, budgeted, control-bearing experiment
    contract meeting docs/target-result-profile.md's heuristic-validation-
    experiment standard and docs/inventor-protocol.md section 3's
    controls-before-belief discipline, before any compute is spent on it.
  inputs:
    - "C2 (object-enumeration.yaml)"
    - H-AES-77230c
    - protocol-amendment-GOAL-AES-002-003
  constraints:
    - "SC-1 through SC-11, identical language."
    - >-
      ZERO COMPUTE IN THIS TASK. No benchmark, no sample, no run of any kind.
      This is a design-and-preregistration act only.
    - >-
      Follow templates/research-records.md's `experiment` schema fields
      exactly: preregistered_prediction, scale_relevance, tail_checks,
      replication, budget, stopping_rules, invalidation_rules,
      success_criterion, falsification_criterion, required_artifacts. Do not
      invent fields.
    - >-
      Preregister the prediction BEFORE any data exists: h_r reaches
      Binomial(128,1/2) by round 2-4 and does not retain exploitable structure
      at the full round count, stated at BELOW-DEFAULT CONFIDENCE per
      object-enumeration.yaml's own disclosure (the H-AES-77230c key-schedule
      non-saturation precedent).
    - >-
      The null control is a SEPARATE, EXPLICITLY SPECIFIED arm: independent
      uniformly random round-key sequences replacing the real key schedule,
      with the whitening key RK[0] preserved.
    - >-
      The round-count decay check is a named, explicit invalidation rule: the
      excess |h_r distribution - null| must decay monotonically with round
      for BOTH the real cipher and the null; a quantity that does not decay is
      the canonical artifact tell (docs/inventor-protocol.md section 3) and
      the design must state this as a stopping/invalidation condition, not
      merely mention it.
    - >-
      State a concrete sample-size and budget estimate, scoped to this
      environment's measured envelope (CM-1 element (a) resource envelope;
      the RANK 3 envelope receipt's 1-core pure-Python throughput figure,
      cited by path, not re-measured here).
    - >-
      Do NOT approve, dispatch, or execute the design. Do not mint an EXP-* or
      H-* ledger identifier; this is a draft artifact for Coordinator review
      in a later batch, per AGENTS.md's rule that only the Coordinator
      approves experiments.
    - >-
      State plainly, per SC-4, that no margin is claimed anywhere in this
      design and nothing about AES at any round count is asserted.
  deliverables:
    - c2-paired-validation-design.yaml (draft experiment contract)
    - design-report.md
  artifact_paths:
    - coordination/goals/GOAL-AES-002/batches/BATCH-286bcd/tasks/TASK-20260901-354ef5/c2-paired-validation-design.yaml
    - coordination/goals/GOAL-AES-002/batches/BATCH-286bcd/tasks/TASK-20260901-354ef5/design-report.md
  archived_by: TASK-20260901-a5374b
  inference:
    policy: research-deep
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 1600
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
    - "The design carries a preregistered prediction, a real-cipher arm, a matched-null arm, a round-1 sensitivity anchor, and an explicit round-count decay invalidation rule, following templates/research-records.md's experiment schema fields."
    - "Zero compute was run; the design states this explicitly."
    - "No EXP-* or H-* identifier is minted; the design is explicitly NOT approved or dispatched."
    - "SC-4 is satisfied: no margin, no AES-round-count assertion."
  return_format: null
  review_plan: null
