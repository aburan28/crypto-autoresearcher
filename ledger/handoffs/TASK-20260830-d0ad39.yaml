    memory_gb: 2
    maximum_runs: 2
  completion_gate:
    - "Stage 0/1 hard gates reported before any later stage."
    - "Operation count reported for every m in {3,...,8}, both p, with the exact call-count reconciliation."
    - "Partial-locus cost reported for m in {4,5}, both p, whichever direction measured."
    - "Every reachable committed SDEG/DREG/SIG/ICEX cell receives a label or explicit not_located/not_labellable, with the search method documented."
    - >-
      Run manifests bind git commit, dirty flag, seeds, environment,
      timing, resources, per docs/evidence-and-reproducibility.md, using
      the NESTED manifest schema (run.status/code/environment/inputs/
      timing/result -- see experiments/EXP-MONO-a20e48/runs/*/manifest.yaml
      for the exact required structure).
  return_format: >-
    Executor execution_report.yaml per docs/evidence-and-reproducibility.md:
    Stage-by-stage results, the operation-count table, the partial-locus
    measurement, the full Step-6 labelling table with counts, any
    anomalies. Observations only -- no verdict on H-MONO-40aca5, no status
    change to any record including those read in Stage 6.
