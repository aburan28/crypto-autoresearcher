handoff:
  id: TASK-20260830-d0ad39
  from: coordinator
  to: executor
  objective: >-
    Execute the FROZEN, coordinator-approved contract EXP-MONO-805a02
    exactly as written: (1) pin D_trial(E)'s exact operation count via
    fixture reproduction, extension, and instrumentation; (2) measure the
    genuinely open partial-locus fibre cost; (3) perform a READ-ONLY
    cross-goal labelling pass over other goals' already-committed
    measurement cells. Record observations only; render no verdict on
    H-MONO-40aca5.
  uncertainty_reduced: >-
    Whether the enumerate-and-test relation-search formulation's
    per-attempt cost is genuinely pinned at m-1 group additions (no
    polynomial root-find), and whether this lane's own already-committed
    solving-degree measurements (SDEG, DREG, SIG) and the ICEX threshold
    contract are measuring that same quantity or a different one
    (formulation S with an extension-field membership predicate).
  inputs:
    - experiments/EXP-MONO-805a02/specification.yaml (READ IN FULL)
    - ledger/hypotheses/H-MONO-40aca5.yaml
    - ledger/proposals/IDEA-20260806-9d47e2.yaml (the original, unusually detailed proposal)
    - knowledge/findings/KN-FIND-c41ea9.md
    - knowledge/findings/KN-FIND-007.md
    - harness/semaev.py (READ IN FULL -- s3_expr, s4_expr, build_factor_base)
    - harness/toycurve.py (READ IN FULL -- EllipticCurve, Point, ECDLPInstance)
    - AGENTS.md
  constraints:
    - >-
      Follow experiments/EXP-MONO-805a02/specification.yaml EXACTLY; it is
      frozen. REUSE `harness/semaev.py`'s `s3_expr`/`s4_expr` and
      `harness/toycurve.py`'s `EllipticCurve`/`Point` directly by
      importing them -- do not reimplement curve arithmetic or S_3/S_4
      from scratch. Build S_5 by extending `s4_expr`'s own resultant
      pattern one further step (Res_t of two copies of S_3/S_4
      appropriately split), evaluated numerically mod p, not symbolically
      over Z.
    - >-
      Stage 0 (m=3 known-answer edge) and Stage 1 (m=4 fixture
      reproduction against KN-FIND-c41ea9's own committed 193/193 census)
      are HARD GATES. Do not proceed to m=5, the operation count, or any
      other stage until both pass exactly. A gate failure is
      `failed_infrastructure`, escalate per AGENTS.md rule 12, never
      resolved by adjusting the construction silently.
    - >-
      Stage 3 (the operation-count instrumentation) must contain NO
      summation-polynomial evaluation, root-finding, or polynomial
      arithmetic in its instrumented code path -- only calls to
      `EllipticCurve.add` (and one hash/set lookup for membership). Any
      such call appearing voids that cell per the frozen falsification
      criterion.
    - >-
      Stage 6 (the cross-goal labelling pass) is STRICTLY READ-ONLY.
      Search `ledger/goals/GOAL-{SDEG,DREG,SIG}-001/`,
      `coordination/goals/GOAL-{SDEG,DREG,SIG}-001/`,
      `ledger/proposals/IDEA-20260803-fa9839.yaml`, and
      `experiments/EXP-ICEX-146ff5/` (check
      `tools/schema_supersession_registry.yaml` /
      `tools/run_supersession_registry.yaml` for any supersession before
      concluding a name is missing). WRITE NOTHING under any of those
      paths, under `ledger/goals/`, or under `coordination/goals/` for any
      goal other than none at all -- your only writes are under
      `experiments/EXP-MONO-805a02/`. If a goal's relevant contract cannot
      be located after a documented search, report `not_located` for it
      and continue with the others.
    - >-
      No group-operation-to-field-operation unit conversion is declared
      anywhere in this contract. Any code path that would need one (a
      cross-formulation D_trial ratio) MUST refuse and report
      `refused_no_declared_conversion: true` rather than compute a number.
    - >-
      Pure Python 3 standard library plus `sympy` only (matching
      `harness/semaev.py`'s own existing dependency). No numpy, SageMath,
      or external solver.
    - >-
      No hypothesis, experiment, or goal status change -- for
      H-MONO-40aca5 OR for any goal read in Stage 6. No relation-rate,
      ECDLP, cost, or exponent claim of any kind, in either direction.
    - >-
      Any timeout, crash, or construction failure is `failed_infrastructure`,
      never negative mathematical evidence (AGENTS.md rule 3).
    - "Exactly 2 runs, seeds 20260830 and 20260831 per the contract's `replication`."
  deliverables:
    - experiments/EXP-MONO-805a02/implementation.md
    - experiments/EXP-MONO-805a02/implementation/ (source code)
    - experiments/EXP-MONO-805a02/runs/RUN-MONO-805a02-1/
    - experiments/EXP-MONO-805a02/runs/RUN-MONO-805a02-2/
    - execution_report.yaml (per docs/evidence-and-reproducibility.md)
  artifact_paths:
    - experiments/EXP-MONO-805a02/implementation.md
    - experiments/EXP-MONO-805a02/implementation/
    - experiments/EXP-MONO-805a02/runs/RUN-MONO-805a02-1/
    - experiments/EXP-MONO-805a02/runs/RUN-MONO-805a02-2/
  archived_by: TASK-20260830-1f92df
  inference:
    policy: executor-implementation
    reasoning_effort: medium
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
    reasoning_effort_basis: >-
      Bound by .claude/agents/executor.md effort medium and
      orchestration/roles.yaml role executor -> default_policy
      executor-implementation -> reasoning_effort medium. Bounded,
      spec-following implementation of an already-fully-designed contract
      reusing existing harness infrastructure; not design or ideation.
  budget:
