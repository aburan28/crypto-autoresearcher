      what: >-
        (1) The step "N_K(L) = p^{n'} forces p^{n'} <= |K| = p^n and hence
        n' < n" did NOT follow: cardinality yields only n' <= n. At n' = n
        complete splitting is possible (lambda = X gives L = X^{p^n} - X,
        N = p^n = p^{n'}), where r = 0 and the corollary's bound is exactly
        n/(n + n' - r) = 1/2, so beta > 1/2 fails at equality. The clause now
        gives both conjuncts -- cardinality for n' <= n, and (B)'s own
        hypothesis that n' does not divide n to exclude n' = n -- and records
        that n' = n is an instance of proves-too-much FAMILY 1, where at r = 0
        the bound's second term is p^{n'-r} = p^{n'} = deg L and (A) is
        vacuous. Same boundary from two sides.
        (2) "186 of 732 (34%)" glued a correct count to the other
        denominator's percentage: 186/732 = 0.2541 and 186/546 = 0.3407.
      origin: >-
