  constraints:
  - You are not alone. Write only six exact output files. Preserve every original design, amendment, review, other
    agent file, shared module and ledger/queue. No commits, pushes, task assignments, official status changes or
    experiment approval.
  - This task uses research-deep for mathematical design, explicitly calibrated max. Request native gpt-5.6-sol/max.
    No fallback, degradation, Bedrock, hidden model substitution or invented API probe. If unavailable, report infrastructure
    failure, never scientific evidence.
  - Verify exact sources and implement every accepted correction in DEC-20260907-a6c2ec. Keep prior correct definitions/counts
    and scientific scope. Produce complete effective contracts with an explicit precedence/source map so no ambiguous
    older field silently remains in force. Do not merely list proposed fixes.
  - All new artifacts retain approved_by:null, execution_authorized:false and evidence_eligible:false. Existing
    EXP identifiers are references, not newly minted IDs; use a descriptive revision label rather than inventing
    an unallocated AMEND identifier.
  - Specify exact finite quantile and tie conventions, canonical byte-level RNG domains, missing-data and zero-dispersion
    cases, control generators, censoring schedules and typed counts. A generic instruction to use deterministic
    points or a later execution-plan choice is not a definition.
  - Stage accounting must include explicit null advisory CPU/wall estimates where unknown, actual measured outputs,
    machine-checkable encoded sizes, object lifetimes, streaming order and a real process-group memory guard. Distinguish
    payload estimates from actual interpreter/workspace/RSS costs; never invent a peak measurement. OOM/watchdog/infrastructure
    failure preserves partial data and is not a scientific conclusion.
  - Do not widen curve ranges, alter fixed sample/replicate/null counts, replace controls, silently add favorable
    resampling, lower thresholds or infer hypotheses false from incomplete implementations. New exact choices resolving
    old ambiguity must be explicitly disclosed in readiness.md for Coordinator review.
  - 'Zero scientific runs: no future curve/fixture searches, experiment panels, census, bootstrap simulation, timing
    or scientific controls. At most60 TOTAL fixed arithmetic/static/mock consistency cases including reruns, each<=10sec
    aggregate<=300wall/CPU sec; record actual checks and cumulative counts. YAML/JSON parsing, static source inspection
    and hash verification are allowed. No scientific output disguised as a test.'
  - Use both archived independent reports after their completed review round; their former mutual blindness is deliberately
    lifted for this correction producer. Preserve the distinction between a valid blind formula and approval of
    an unseen contract.
  - Do not fabricate novelty, citations or dominated_by:null. Retain existing unverified scope and source attribution;
    new claims require actual support. If a concrete mathematical contradiction prevents a requested definition,
    name it and continue other corrections. Ordinary unfinished design work is to complete, not a blocker.
  accepted_corrections:
    EXP-ECDLP-184fc4:
    - Freeze median and both finite percentile indices for 64 null values. State one-based versus zero-based conventions
      and every tie/zero-dispersion rule.
    - Add explicit stage accounting, null advisory wall/CPU estimates, typed encodings, memory lifetimes, streaming
      and 8GiB enforcement semantics.
    EXP-ECDLP-0c717c:
    - Replace the undefined bootstrap analysis-key with exact canonical UTF-8 serialization including every analysis
      dimension and explicitly intended resample sharing. Preserve all original scientific sample counts.
    - Add the stage and memory-conformance contract; preserve the already explicit null/envelope/slope counts and
      percentile definitions.
    EXP-ECDLP-1e6502:
    - Correct universal base-p digit extraction to floor(C/p^j) mod p or remove ALL lower digits before exact division.
      Update every caller, including the Teichmuller higher digit, and state precision compatibility.
    - Freeze the exact R-index sequence for all10000 SC4 pairs, eligible-point ordering, duplicate/cycling policy
      and exhaustion behavior. Preserve the already fixed z schedule.
    - Add stage accounting and memory-lifetime/enforcement semantics.
    EXP-ECDLP-2c3d20:
    - Make class-null statistics total when the size-matching rule has no eligible null class. Freeze missing-match
      eligibility, rank denominator/scope, center/scale and zero-dispersion behavior, and the exact standardized-effect
      statistic. Do not silently redraw nulls or delete missing cases.
    - 'Specify the complete deterministic order-2q curve and generator candidate algorithm: p,A,B mapping, exact
      point-stream serialization, search cap and typed exhaustion. Audit the named toycurve helper rather than assuming
      a prime-order generator supplies order2q.'
    - Specify typed index/map encodings and a streaming/lifetime plan that avoids keeping260 maps resident. Account
      for labels, partitions and numerical workspaces, not only map payloads. Make all count fields integer scalars
      with derivations separate.
    EXP-ECDLP-709063:
    - Freeze the exact rho iteration/censoring formula in the prospective contract rather than delegating a decision-changing
      choice to a future executor launch plan. State how it interacts with the12of16 usability rule and retain every
      censored stream.
    - 'Provide a fully charged discrete model OR explicitly label the existing expression as a partial proxy with
      each omitted or upper-bounded term and its bias direction. Do not assert the net proxy is optimistic unless
      proved: omitted setup lowers cost while a full giant-step ceiling can overstate stopping-dependent cost. Include
      scalar precompute, exact baby convention, actual/expected giant stopping, final certificate and measured comparator
      distinction.'
    - Store total_algorithm_rows=368 and total_representation_control_records=8 as integers, with arithmetic derivations
      in separate text fields.
