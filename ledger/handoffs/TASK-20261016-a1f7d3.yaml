# HANDOFF -- TASK-20261016-a1f7d3. WRITE-ONCE. Id minted as a random 6-hex token
# without tools/allocate_id.py; the driving session confirms with --check.
handoff:
  id: TASK-20261016-a1f7d3
  from: coordinator
  to: executor
  goal_id: GOAL-ECDLP2M-001
  experiment_id: EXP-CERTBIN-b4d29c
  objective: >-
    Implement what EXP-CERTBIN-b4d29c needs to reach execution_state ready:
    the three-limb GF(2^131) field and ECC2K-130 curve layer, the bound
    lift_scan canonicalizer, the Bailey (B), 8-branch canonicalizing (K) and
    B-poly walks, the launcher, the independent checker, and the frozen
    trial plan. Produce source and plan only. Run no Stage-1, Stage-2 or
    Stage-2b trial under this card.
  uncertainty_reduced: >-
    Whether the frozen contract can be executed at all. This is engineering,
    not research. It settles the M1-M5 readiness gaps listed in the
    specification's readiness block.
  inputs:
    - experiments/EXP-CERTBIN-b4d29c/specification.yaml (worker context; the binding contract)
    - ledger/hypotheses/H-CERTBIN-7e3a51.yaml (worker context; predictions only, so the instrument measures what is scored)
    - ledger/decisions/DEC-20261016-e8c05f.yaml
    - ledger/proposals/IDEA-20261015-c6f017.yaml (background: mechanism and cited anchors)
    - knowledge/frontiers/ecdlp/generic-rho/KR-RHO-18cc42.yaml
    - aburan28/crypto origin/main (research/n83_evaluation_20261012/, docs/ic/BOUNDARY_TARGETS.md, the StrongRhoG/WideGf2 sources); fetch fresh, because the local /home/user/crypto checkout is stale
    - aburan28/cryptanalysis canon-n131-loop-20261014 (lift_scan)
  constraints:
    - Wait for TASK-20261016-5c92be's verified, committed and pushed design archive before starting.
    - >-
      In this repository, write only under
      experiments/EXP-CERTBIN-b4d29c/implementation/ and
      experiments/EXP-CERTBIN-b4d29c/trial-plan.json. Walk and field code
      belongs in aburan28/crypto on a branch named
      `exp-certbin-b4d29c-three-limb` and goes through that repository's
      PR review. Pin the reviewed commit sha in trial-plan.json.
    - >-
      First verify the idea's anchors at crypto origin/main: MAX_N = 127,
      StrongRhoG<WideGf2,u64>, and the n=83 tuned policy. Pin the base
      commit sha. A missing anchor is a defect to report, not to build
      around.
    - Do not change the existing n=83 walk's behavior. T0.7 must pass bit-identically against the pinned base binary.
    - check.py must be independent. It is pure Python, imports no walk or field code, reads no producer summary, and recomputes from raw records.
    - Freeze in trial-plan.json every arm, seed string, target index, DP threshold c_n (from the exact binomial tail), Latin order, command, artifact path and the run id, plus source, binary and input hashes.
    - Do not alter the frozen field polynomial, curve, predicate, thresholds, sample sizes or gates. A needed change is reported to the Coordinator for a protocol_amendment.
    - Developer unit tests and the T0 suite may run during development. Results from them are never recorded as run evidence, and no run directory is written.
    - Do not approve the experiment, write a dispatch queue, change any status, or edit any existing record.
    - Amazon Bedrock is prohibited.
  deliverables:
    - experiments/EXP-CERTBIN-b4d29c/implementation/launch.py
    - experiments/EXP-CERTBIN-b4d29c/implementation/check.py
    - experiments/EXP-CERTBIN-b4d29c/implementation/SOURCE_SHA256.json (this-repo sources, the crypto base and PR commit shas, lift_scan provenance, and build recipe)
    - experiments/EXP-CERTBIN-b4d29c/implementation/READINESS.md (anchor verification, T0 developer-run summary labelled non-evidence, and the newest_experiments output)
    - experiments/EXP-CERTBIN-b4d29c/trial-plan.json
    - A reviewed aburan28/crypto PR carrying the three-limb type, lifted guard, designs B/K/B-poly and their unit tests
  artifact_paths:
    - experiments/EXP-CERTBIN-b4d29c/implementation/
    - experiments/EXP-CERTBIN-b4d29c/trial-plan.json
  write_scope:
    - experiments/EXP-CERTBIN-b4d29c/implementation/
    - experiments/EXP-CERTBIN-b4d29c/trial-plan.json
    - crypto:branch exp-certbin-b4d29c-three-limb
  archived_by: TASK-20261016-d06b48
  inference:
    policy: executor-implementation
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
    delivery: interactive
  budget:
    maximum_runs: 0
    memory_gb: 4
  dispatch_preconditions:
    - TASK-20261016-5c92be archive completed, verified and pushed; every declared input committed and pushed.
    - A GOAL-ECDLP2M-001 lane claimed (tools/goal_lanes.py claim) within max_concurrent 3.
    - TASK-20261016-d06b48 committed as the sole archive owner of these outputs.
  completion_gate:
    - launch.py, check.py, SOURCE_SHA256.json, READINESS.md and trial-plan.json exist and are hash-listed.
    - trial-plan.json parses, names a run id, and covers every frozen arm, stage, seed and artifact of the specification.
    - The crypto PR is reviewed and its commit sha matches trial-plan.json; the base anchors are verified or reported as defects.
    - >-
      `python3 tools/newest_experiments.py --experiment EXP-CERTBIN-b4d29c --json`
      reports needs_dispatch_queue (plan present, queue owed at approval) or
      a precise defect. ready is reached only after the Coordinator's
      approval writes the queue.
    - No run directory, status transition or record edit is written.
  return_format: >-
    Base and PR commit shas, source hashes, trial-plan path and sha256, the
    newest_experiments output, and any unresolved defect with its exact
    location.
  review_plan: null
