    TASK-20260809-23abf9 requires an independent reviewer, validator, or
    red-team successor`. tools/research_dispatch.py `_validate_review_chains`
    requires a DIRECT red-team, validator or reviewer successor for every task
    with review_required true, and requires that reviewer to depend on the
    producer's snapshot archive as well. HERE THE EXPLICIT EDGE IS PARTICULARLY
    OVERDUE: THIS TASK EXISTS SPECIFICALLY TO ATTACK CM-1, WHICH IS A
    TASK-20260809-23abf9 ARTIFACT, so the review relation was always intended
