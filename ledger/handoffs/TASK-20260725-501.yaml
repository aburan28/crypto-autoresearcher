handoff:
  id: TASK-20260725-501
  from: coordinator
  to: idea-generator
  objective: >-
    Map the post-SIDH-break supersingular-isogeny cryptanalytic baseline and
    produce one novelty-screened, falsifiable algorithmic candidate against a
    surviving hardness assumption.
  inputs:
    - ledger/goals/GOAL-SSI-001.yaml
    - ledger/questions/RQ-SSI-001.yaml
    - knowledge spine KN-LIT-062..079, KN-TECH-024..029, KN-OPEN-013..015
    - coordination/goals/GOAL-SSI-001/batches/BATCH-001/inference-amendment-TASK-20260725-501.yaml
  constraints:
    - Academic defensive literature research only; no operational attacks.
    - Separate established literature, derivation, speculation, and proposed tests.
    - SIDH/SIKE torsion-image key recovery is a closed known attack — not a novelty target.
    - Do not reuse RQ-ISO-001 ordinary-curve Semaev-neighbor scope.
    - Charge preprocessing, memory, oracles, quantum queries, and verification.
    - Make no breakthrough claim and change no official state.
  deliverables: [baseline_map.md, candidate_report.yaml]
  artifact_paths:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-001/tasks/TASK-20260725-501/baseline_map.md
    - coordination/goals/GOAL-SSI-001/batches/BATCH-001/tasks/TASK-20260725-501/candidate_report.yaml
  archived_by: TASK-20260725-502
  inference:
    policy: research-sol-max
    fallback_allowed: true
    independent_session_required: false
  budget:
    wall_clock_seconds: 2400
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
    - The baseline map covers endomorphism-ring/path-finding, CSIDH/hidden-shift, CGL, and the SIDH-break lesson, with survivors vs broken schemes separated.
    - The candidate is deduplicated against the cited knowledge spine and known SIDH attacks.
    - The mechanism has explicit assumptions, predictions, full-cost boundary, and one cheap falsification gate — or the report returns NO_ADMISSIBLE_NEXT_MECHANISM with the residual open question named.
