      - joint: >-
          J4. RIGIDITY RE-ENUMERATION: that the published parameter searches
          (EcGFp5: b = +/- c z^i, c = 1, 2, ..., i = 1..4, quadratic-residue
          pre-filter as published, acceptance #E = 2*prime; EcMasFp5:
          find_ec_over_gfp5, A from 0, c = 1..49, i = 1..4, acceptance prime
          order) were re-enumerated in the published order, that every one of
          the 2096 EcGFp5 and 619 EcMasFp5 predecessors was correctly
          rejected (1552 pre-filter + 445 early abort + 99 composite full
          count; 398 early abort + 221 composite full count), and that the
          first accepted candidate is the published curve in each case.
        assigned_to: TASK-20260923-2d8db0
        attack_plan: >-
          THE VERIFICATION HERE RUNS ONLY IN THE DIRECTION THAT FAVOURS THE
          CLAIM: a wrong rejection makes the published curve look first.
          So make every rejection self-certifying instead of re-trusting the
          tool that produced it.
          (a) PIN THE PROCEDURE TO THE FROZEN TEXT. Quote the search
          description from inputs/PORNIN-2022-274-ECGFP5/paper_fulltext.md
          (the section on parameter choice) and the find_ec_over_gfp5 script
          from inputs/ECMASFP5-HACKMD-2025/note_fulltext.md; compare with the
          enumeration actually implemented in each run's
          certificates/pari/rigidity.gp. Report every point the frozen text
          leaves open (sign order, pre-filter conditions, loop nesting) and
          which reading the producer chose.
          (b) WITNESS EVERY EARLY-ABORT REJECTION (445 + 398). For each,
          produce a small prime l and a point Q on that candidate curve with
          Q != O and [l]Q = O, verified in arithmetic that is not PARI's SEA
          (Sage's own group law, or code you write). A point of order l is a
          proof that l | #E and needs no trust in the counting algorithm; for
          EcMasFp5 it refutes prime order, for EcGFp5 (odd l) it refutes
          #E = 2*prime. A candidate for which no witness can be found is
          re-counted in full and reported.
