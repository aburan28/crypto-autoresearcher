    proves_too_much:
      objects:
        - >-
          OBJECT A -- A SUPERSINGULAR CURVE, where the embedding-degree
          criterion is KNOWN TO FAIL. Construct a curve over F_p (p = 2^64 -
          2^32 + 1) with CM by an order in Q(sqrt(-7)), e.g. j = -3375, after
          confirming (-7/p) = -1 (my hand computation gives p = 6 mod 7, and 6
          is a non-residue mod 7, so -7 should be inert -- verify, do not
          trust this); such a curve is supersingular, has trace 0 over F_p,
          and over F_{p^5} has #E = p^5 + 1 and embedding degree 2. Run the
          producer's audit pipeline (gfpn_audit.py, scratch invocation
          outside experiments/) on it over F_p[z]/(z^5 - 3).
        - >-
          OBJECT B -- A SUBFIELD CURVE, where the prime-order and rigidity
          criteria are KNOWN TO FAIL. E0: y^2 = x^3 + 3x + 8 over F_p, viewed
          over F_{p^5}: #E0(F_p) divides #E0(F_{p^5}), so the order is
          composite and no "prime order" acceptance is possible.
        - >-
          OBJECT C -- TAMPERED SELF-REPORTS ON A REAL CURVE, where the
          matches-self-report rows are KNOWN TO FAIL. EcMasFp5 with the
          self-reported order changed to n + 2, the twist security changed to
          101.95 (outside the 0.01 tolerance), and the CM integer changed in
          its last digit.
        - >-
          OBJECT D -- A SHIFTED RIGIDITY CLAIM, where rigidity is KNOWN TO
          FAIL. EcMasFp5 declared as (A = 3, c = 8, i = 3), and EcGFp5 declared
          as b = 263z^2.
      failure_signature: >-
        A correct audit must FAIL the named row on every object: A -- the
        embedding_degree row reports e = 2 (or another small value) and FAIL;
        B -- the order_certificate / cofactor rows cannot certify a prime n
        with the declared cofactor and report FAIL, and rigidity reports "not
        reproduced"; C -- each tampered figure yields matches_self_report
        false AND the row's result FAIL (not PASS); D -- rigidity_reproduced
        FAIL. THE PIPELINE HAS PROVED TOO MUCH if any object passes the row
        it should fail. Object C is the sharpest: in the actual runs the one
        genuine mismatch (EcMasFp5 cm_discriminant_bits) was labelled PASS,
        so if C's tampered order and twist figures are ALSO labelled PASS,
        the pipeline cannot express a failed self-report at all and the
        contract's falsification criterion is unreachable by construction.
        Report, per object, the row values emitted and where in the code the
        result label is decided.
      assigned_to: TASK-20260923-01af16

    blind_rederivation:
      required: false
      decision_rationale: >-
        DECIDED EXPLICITLY, NOT OMITTED. A blind re-derivation exists to catch
        an implementation that is wrong and self-consistent, which validation
        from the producer's own artifacts cannot see. Every load-bearing
        quantity in this audit is instead SELF-CERTIFYING: the order by an
        ECPP primality proof plus a point of order n plus Hasse-interval
        uniqueness; the twist by N' = 2q + 2 - N, a factorization whose
        product is checkable and whose factors carry primality proofs; e and
        D by exact arithmetic on those certified integers. A certificate
        verified by code that shares nothing with the producer (J1) cannot be
        wrong-and-self-consistent in the direction that matters, so a blind
        re-derivation would buy a third opinion where a proof already exists.
        The one quantity that is NOT self-certifying as produced is the
        rigidity first-hit index, because a wrong rejection is invisible; J4
        converts every rejection into a witness (a point of small order, a
        factor, a square test) checkable without trusting the counting
        algorithm, which is strictly stronger than a second independent
        search that could share the same blind spot. I considered a blind
        re-derivation of EcGFp5's twist security (120.66 bits, which has no
        self-report and so only one determination) and rejected it for the
        same reason: its certificate is complete and J1 re-verifies it
        independently.
      quantity: null
      parameters: null
      blind_from: []
      assigned_to: null

    procedure_deviations: []
    procedure_deviations_note: >-
      Empty at authoring. Departures are appended by a SUPERSEDING record,
      never edited into this card.

