  review_plan:
    claim_under_review: >-
      AS THE PRODUCER STATED IT. The producer stated observations and
      explicitly no verdict: experiments/EXP-GFPN-726eb2/implementation.md
      opens "This note records what was implemented, every deviation from the
      approved protocol, every failed or unfinished attempt, and observations
      only — no support/reject judgement on the hypothesis." That refusal is
      honoured; what is put under review is the producer's own statement of
      what the audit established, quoted from implementation.md and the
      committed run tables:

        (P1) order: "The certified order equals the SEA count for both
        curves, and equals the self-reported integer for both curves."
        (section 4); cofactor 2 (EcGFp5) and 1 (EcMasFp5).
        (P2) embedding degree: "Both factorizations are complete; e =
        ord_n(q) is computed exactly from them." EcGFp5 e = (n−1)/5 (317
        bits); EcMasFp5 e = n−1 (320 bits).
        (P3) CM discriminant: "|D| is 322 bits for both curves ... EcMasFp5's
        self-reported D integer reproduces exactly; its stated '323 bits'
        does not equal the integer's binary length (322 ...). Recorded as an
        observation with a plausible explanation (sign character counted);
        not adjudicated here." (The committed audit table
        runs/RUN-GFPN-3bbef2/audit-table.yaml labels this row "result: PASS"
        with "matches_self_report: false".)
        (P4) twist: EcMasFp5 "Twist security = ... 101.9321 bits, |Δ| =
        0.0021 from the self-reported 101.93 (tolerance 0.01)"; EcGFp5 twist
        security 120.66 bits, with "no self-report to compare against".
        (P5) rigidity: EcMasFp5 "the first prime-order curve is candidate
        #620 = (A=3, c=8, i=4), the published one"; EcGFp5 "the first curve
        with #E = 2·prime is candidate #2097 = (c = 263, i = 1, sign +), i.e.
        the published b = 263z." (sections 4 and 6).
        (P6) provenance: "field_security_142 is tagged asserted on EcGFp5 ...
        and inherited on EcMasFp5"; "twist_security_101_93 is tagged computed
        and recomputed (101.9321)." (section 4).
        (P7) control: "hash match true; 18/18 values identical ...
        scurve_control_certificate_match: true", under the producer's own
        operationalisation, deviation D-1, "No amendment was filed; the
        Coordinator/Validator may judge whether this reading satisfies the
        control." (sections 3 and 7).

      THE CLAIM THAT WOULD BE MADE IF THE ROUND READS THE RESULT AS
      SUPPORTING is the frozen contract's success criterion, quoted verbatim
      from experiments/EXP-GFPN-726eb2/specification.yaml:
      "scurve_control_certificate_match is true; for both EcGFp5 and EcMasFp5
      every primary metric is present with a regenerated certificate or an
      explicit not_verifiable reason; figure_provenance_table includes tags
      for field_security_142 and twist_security_101_93. Success is audit
      completeness, not agreement with self-reports." The Coordinator is
      putting that conditional claim to the reviewers, not asserting it.
      Scope rider from the contract, binding every reviewer: "Parameter audit
      only. No Semaev S_m evaluation, no Groebner/FGLM PDP, no OA-SDH, no GHS
      cover genus, no DLP solve, no rho beat claim."

    coordinator_prior: >-
      WRITTEN 2026-09-23, BEFORE ANY REVIEWER RAN, AND NOT BLIND. I have read
      the producer's implementation note, all three audit tables and both
      provenance tables, the snapshot receipt (including the dispatching
      session's independent PARI re-check of both orders and both twists),
      and the frozen paper text. I have recomputed nothing numerically: I have
      no shell. What I checked by hand: the EcMasFp5 D hex string in the
      provenance table has 81 hex digits with leading nibble 3, so its binary
      length is 80*4 + 2 = 322, which agrees with the producer; the rigidity
      counts add up (EcGFp5 1552 + 445 + 99 = 2096 predecessors; EcMasFp5
      398 + 221 = 619 predecessors); and 2097 = 262*8 + 1 is exactly the
      position of (c = 263, i = 1, +) in a c-major, i-then-sign order with
      8 candidates per c, and 620 = 3*196 + 7*4 + 4 is exactly (A = 3, c = 8,
      i = 4) in an A-major order with 49*4 candidates per A. So my prior is
      anchored to the producer's numbers and agreement with me on them is
      worth little. What follows is where I think the audit is weaker than it
      reads.

      1. J2, THE CM ROW'S LABEL -- 0.65 that the validator rules the EcMasFp5
      cm_discriminant_bits row must read FAIL under the frozen falsification
      criterion (which names cm_discriminant_bits among the self-reported
      figures whose non-reproduction makes "that criterion row ... FAIL and
      ... the finding"), where the committed table says PASS with
      matches_self_report false. 0.35 that it rules the self-reported figure
      is the integer D, which reproduces exactly, and the "(323 bits)"
      annotation is a label, so PASS stands with a noted labelling error in
      the note. Either way I expect no mathematical discrepancy: 0.03 that
      the recomputed D itself differs.

      2. J3, THE CONTROL -- 0.60 that the validator finds the SCURVE control
      (RUN-GFPN-17ed52, Ed448-Goldilocks/curve448 values regenerated by
      scurve_control.py) shares little or no code with the path that scored
      the GFPN rows (gfpn_audit.py, gfpn_arith.py, PARI SEA/primecert), so it
      certifies the analyst's arithmetic on a different curve family rather
      than the instrument; and 0.50 that D-1 is judged an unamended
      reinterpretation of a blocking control. But 0.80 that the GFPN rows
      stand anyway, because each is self-certifying (J1) and does not need
      the control to be believed. I expect the honest outcome to be "the
      control is weaker than the contract intended; the rows do not depend
      on it" rather than "the rows are invalid".

      3. J4, RIGIDITY -- 0.05 that a false rejection is found (an earlier
      candidate that actually meets the acceptance criterion). The
      verification asymmetry is the concern, not the arithmetic: an
      early-abort rejection that is wrong makes the published curve look
      first, which is the direction that favours "reproduced". 0.40 that the
      validator finds the implemented enumeration order is not fully pinned
      by the frozen text for one curve (the EcGFp5 sign order and the exact
      quadratic-residue pre-filter are the likely places), which narrows
      "rigidity reproduced" to "reproduced under the producer's reading of
      the published procedure".

      4. J1, CERTIFICATES -- 0.03 that any certificate fails independent
      re-verification; 0.25 that the validator finds a procedural gap in the
      regenerated_not_copied control (for example a published integer used
      as an input before the SEA count existed), which would weaken the
      control without changing a number.

      5. J5 AND J6, PROVENANCE AND SCOPE -- 0.35 that the red team argues
      EcGFp5's field_security_142 should be tagged "computed from a stated
      model, not recomputed" rather than "asserted" under the table's own
      vocabulary; 0.70 that it flags that the SafeCurves-style criterion
      most relevant to an F_{p^5} curve -- transfer by Weil descent / cover
      attacks -- is outside this audit (owned by IDEA-20260920-10547b) and
      must be named in any support decision's scope; 0.50 that it finds a
      committed sentence somewhere in the GFPN records (more likely the goal
      or question framing than the producer artifacts) that reads the audit
      as bearing on the 128-bit claim.

      6. PROVES-TOO-MUCH -- 0.35 that at least one known-false object PASSES
      the row it should fail, and the likeliest is the tampered self-report:
      the one real mismatch in the runs (P3) was labelled PASS, so the
      pipeline may be unable to emit FAIL for a non-reproducing self-report
      at all. If so, the contract's falsification criterion is unreachable
      by construction and that is the most important finding of the round.

      MODAL EXPECTATION, stated so it can be overturned: 0.65 that the round
      returns "every numeric row is certified and reproduces; the control is
      weaker than the contract intended but no row depends on it; the one
      frozen-rule mismatch is the EcMasFp5 CM bit-length label; rigidity is
      reproduced with rejection witnesses under the published procedures;
      the audit licenses nothing about attack cost, 128-bit security or
      cover attacks." If that comes back, the honest decision is a scoped
      support of H-GFPN-ee4d45 at observational tier for the two named
      curves, with the CM row reclassified as the audit's one self-report
      finding and the transfer criterion named as out of scope.

    joints:
      - joint: >-
          J1. ORDER AND TWIST CERTIFICATES: that for each curve the order
          #E = h*n is proved (n prime by an ECPP certificate re-verified by
          code independent of PARI; a point P != O with [n]P = O; for EcGFp5
          the rational 2-torsion argument giving 2 | #E and 4 does not divide
          #E; exactly one multiple of h*n in the Hasse interval), that the
          curve certified is the published curve (EcGFp5's short-Weierstrass
          model derived from y^2 = x(x^2 + 2x + 263z) over F_p[z]/(z^5 - 3);
          EcMasFp5 y^2 = x^3 + 3x + 8z^4), that the integer was regenerated
          by SEA before any comparison with the published value
          (regenerated_not_copied), and that the twist order N' = 2q + 2 - N,
          its complete factorization with primality proofs, and the twist
          security 0.5*log2(pi*l'/4) (101.9321 and 120.6583 bits) follow.
        assigned_to: TASK-20260923-2d8db0
        attack_plan: >-
          Build the independent instrument; do not re-read for plausibility.
          (a) Re-verify every certificate in both runs' certificates/ with a
          code path that shares nothing with gfpn_arith.py and nothing with
          PARI primecert: Sage 10.9 is recorded as present at
          /opt/conda-sage/envs/sage/bin/sage (implementation.md section 1);
          use its own GF(p^5) arithmetic (modulus z^5 - 3) for [n]P = O and
          for the 2-torsion point, and write a minimal step-by-step ECPP
          chain checker (or reuse check_run.py only as a second opinion, and
          say which). Negative-control your own verifier: flip one digit in
          n.cert and swap one twist factor; it must reject both.
          (b) Re-derive the EcGFp5 short-Weierstrass constants from the
          double-odd equation yourself (A = (3b - a^2)/3, B = a(2a^2 - 9b)/27
          with a = 2, b = 263z) and confirm the certified curve is that one,
          and that the Hermez note's restated constants agree.
          (c) Recompute N + N' = 2q + 2, the product of each twist
          factorization, primality of every factor, and the twist-security
          arithmetic to 4 decimals.
          (d) Attack regenerated_not_copied: read gfpn_audit.py and each
          run's raw-result.json / stdout.log in execution order and establish
          whether the published integer entered the pipeline anywhere before
          the SEA count (e.g. as an ECPP candidate or a Hasse-interval seed).
          WHERE I THINK IT BREAKS: nowhere in the arithmetic (0.03); if
          anywhere, in the procedural order of (d) (0.25).
        breaking_artifact: >-
          A certificate step that fails independent re-verification (named
          file, step, and the failing check); a mismatch between the certified
          curve and the published equation; a twist product or primality
          check that fails; or a quoted code path / log line showing a
          published integer used as input before its regeneration.

      - joint: >-
          J2. EMBEDDING DEGREE AND CM DISCRIMINANT, INCLUDING THE 322-VS-323
          OBSERVATION: that e = ord_n(q) is (n-1)/5 for EcGFp5 and n-1 for
          EcMasFp5, computed exactly from complete, proved factorizations of
          n-1; that D = t^2 - 4q with t = q + 1 - N has |D| of 322 bits for
          both curves, with the stated squarefree part, conductor (2 for
          EcGFp5, 1 for EcMasFp5) and fundamental discriminant; and that the
          EcMasFp5 cm_discriminant_bits row is correctly labelled PASS with
          matches_self_report false under the frozen contract.
        assigned_to: TASK-20260923-2d8db0
        attack_plan: >-
          (a) From the committed factorization-n-minus-1.json of each run,
          verify the factors multiply to n-1 and are proved prime, then
          compute e by the standard order test: e | n-1 and q^(e) = 1 mod n
          and q^(e/l) != 1 mod n for every prime l | e. Report e and its bit
