          independent code) satisfies it without an amendment, that it ran
          before any GFPN scoring, and that it controls the instrument that
          scored the GFPN rows.
        assigned_to: TASK-20260923-2d8db0
        attack_plan: >-
          (a) BUILD THE CALL GRAPH. Map which functions scurve_control.py
          executes and which functions the GFPN audit path executes
          (gfpn_audit.py, gfpn_arith.py, PARI calls, check_run.py). List every
          shared function. If the intersection is empty, the control
          exercises a different instrument.
          (b) Verify the two sha256 values of the prior SCURVE package
          (base-point-audit.yaml, raw-transcription.yaml) and regenerate at
