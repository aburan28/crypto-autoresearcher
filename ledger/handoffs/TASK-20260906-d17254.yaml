handoff:
  id: TASK-20260906-d17254
  recorded_at: '2026-09-06'
  goal_id: GOAL-ECDLP-bbc21f
  question_id: RQ-ECDLP-78dbc5
  batch_id: null
  batch_id_note: >-
    Written by the approval batch BATCH-9c5410 (TASK-20260906-67f1ab) per
    design-experiment skill step 5. The EXECUTION batch is not yet opened:
    its batch id is assigned when that batch is opened after
    DEC-20260906-2b1387 lands on main, and dispatch_queue and task_card
    below are null for the same reason.
  dispatch_queue: null
  task_card: null
  role: executor
  from: coordinator
  to: executor
  review_required: true
  objective: >-
    Implement and execute the frozen, APPROVED contract EXP-ECDLP-869870
    version 1 (experiments/EXP-ECDLP-869870/specification.yaml; status
    approved, approved_by coordinator, frozen true, execution_authorized
    true, per DEC-20260906-2b1387) EXACTLY as written: the basin-partition
    coverage instrument of H-ECDLP-3550b8 -- exact basin multisets at N in
    {2^20, 2^22, 2^24} on the generic keyed-random-function instrument,
    sampled coverage at 2^30, the certified toy-curve transfer arm at N
    about 2^24 -- under the contract's stage_plan, selection_rules,
    unselected_law_arm, fixture_procedure, null_and_decay,
    heuristic_validation, controls, seed_policy, stopping_rules and
    invalidation_rules, and refusing to report any arm from 2^24 upward
    until the published-weight arm reproduces Bernstein-Lange's Section 4
    case study and Table 4.1 within the contract's gate tolerances. The
    frozen contract is the ONLY protocol. The Executor records observations
    only: it interprets nothing, draws no conclusion, uses no hypothesis
    language in run records, and changes no status.
  uncertainty_reduced: >-
    Whether the instrument is VALIDATED (V1-V5: the seven fixture cells
    reproduce the published scaled cost within 0.10 and scaled
    precomputation within 12% at N >= 2^24; the relabelling null equals the
    unselected control within CI and the sigma decay is monotone at every
    cell; no exact coverage exceeds the global oracle share and every
    sampled coverage lies within its Wilson interval of the exact value;
    the r_walk = 32 curve walk gives constants within CI of the generic
    instrument with KS not rejecting in a majority of seeds; no constant
    drifts between 2^24 and 2^30 beyond CI after the O(theta) trend), and
    whether the pre-registered closed forms (M1-M5: Borel slope and cutoff,
    (B1), (B2), the estimation-loss closure with r, the N/T = 8 fixture
    cells against the model 1.35 / 1.51) hold on the tested grid. The
    Executor produces the measurements; the Coordinator decides after
    independent review.
  inputs:
  - >-
    experiments/EXP-ECDLP-869870/specification.yaml (the frozen approved
    protocol, version 1 -- the ONLY protocol; five gate fields set by
    TASK-20260906-67f1ab under DEC-20260906-2b1387; every protocol field
    untouched since design)
  - ledger/hypotheses/H-ECDLP-3550b8.yaml (the specified hypothesis carrying HEUR-BLT-1 and HEUR-BLT-2; status unchanged by execution)
  - ledger/questions/RQ-ECDLP-78dbc5.yaml (decision target, definitions and constraints)
  - ledger/proposals/IDEA-20260906-aed829.yaml (the idea record the contract is derived from; (B1)-(B3) as MODEL numbers only)
  - ledger/decisions/DEC-20260906-2b1387.yaml (the approval decision, once committed by TASK-20260906-2d30dd)
  - knowledge/literature/KN-LIT-3060.md (Bernstein-Lange, abstract-level constants)
  - knowledge/literature/KN-LIT-013.md (Corrigan-Gibbs-Kogan, the S T^2 ceiling)
  - knowledge/techniques/KN-TECH-005.md (preprocessing / time-memory tradeoff technique note)
  - >-
    PRIMARY SOURCES: the coordinator's retrieved primary-text plain files
    (scratchpad bl2012.txt, cgk.txt, SCRATCH_SUMMARY.md named in the
    contract and the hypothesis) are NOT in the repository. The primary
    source for the published weight S_d + 4 W h_d, the distinct-DP pool
    procedure, the cap 8W, the Section 4 case study (1.79 (l/T)^{1/2} after
    1.24 (lT)^{1/2}, alpha = 1/2, N = 2T) and Table 4.1 (alpha = 0.707 and
    alpha = 1 rows at N/T in {1, 2, 8}) is Bernstein-Lange, "Computing small
    discrete logarithms faster", IACR eprint 2012/458
    (cr.yp.to/dlog/cuberoot-20120919.pdf); the primary source for the
    generic bound is Corrigan-Gibbs-Kogan, "The discrete-logarithm problem
    with preprocessing", IACR eprint 2017/1113. The Executor fetches them
    itself if it needs them and records the fetched URL and retrieval date
    in the run manifest; the contract's published fixture values are
    binding as written and are not re-derived from memory.
  constraints:
  - >-
    FROZEN CONTRACT. Any needed change to any protocol field (the a, r, m,
    sigma or cap grids, the fixture cells or tolerances, the pre-registered
    forms, seeds, rules, charging) is a versioned protocol_amendment
    proposed under experiments/EXP-ECDLP-869870/amendments/ to the
    Coordinator -- NEVER an inline edit of specification.yaml, and never a
    re-score of an executed run.
  - >-
    DETERMINISTIC SEEDS exactly as the contract's seed_policy: walk-key
    seed s in {1, 2, 3, 4, 5} with target/online seed 100 + s, tie-break
    permutation 400 + s, relabelling stream 300 + s, noise stream 500 + s;
    5 seeds at N in {2^20, 2^22, 2^24}; 3 seeds (s in {1, 2, 3}) at 2^30
    and on the curve, with curve-search seed 1000; every rule at the same s
    shares the walk, the generated pool and the M = 40000 online walks so
    that rules differ only in the selection. Seeds are recorded in every
    manifest; no seed adjustment ever; a duplicated or missing seed
    invalidates the cell.
  - >-
    CERTIFICATES on the curve arm: every online hit emits certificate kind
    discrete_log (curve_id, P, Q, k) re-verified by the run wrapper with an
    INDEPENDENT scalar multiplication [k]P == Q sharing no code with the
    walk, AND against the seeded logarithm (read only by the checker);
    verified: true and verifier_commit recorded per certificate;
    certificate pass count must equal hit count exactly; any failure is
    completed_invalid. Generic runs state certificate kind none explicitly
    and are never quoted as solving logarithms.
  - >-
    ALL COSTS IN COUNTED GROUP OPERATIONS (one per walk step), with restart
    scalar multiplications and lookups counted separately; precomputation
    P as the sum of all generation walk lengths with capped walks charged
    at the cap; bits per entry frozen at 2 ceil(log2 N) and reported; wall
    clock recorded in the manifest and never a decision variable. MEASURED
    and MODELED numbers never share a column; the global oracle (all DPs,
    including in-degree-0 basins of size 1) and the generated-set oracle
    (reached DPs) are never confused in any reported number.
  - >-
    RUN RECORDS are immutable under experiments/EXP-ECDLP-869870/runs/<RUN-ID>/:
    manifest.yaml with the exact command, git commit and dirty-tree state,
    environment and dependency versions, inputs, ALL seeds, complete stdout
    and stderr, raw-result.json, summary.json, validity status and reason,
    timestamps, wall clock and peak_rss_bytes reconciled against the 8 GB
    ceiling and the analytic 5 x 4 x N bytes at 2^24. A defective run is
    superseded by a new run record, never edited.
  - >-
    INFERENCE MANIFEST per run: requested_policy executor-implementation,
    backend, resolved model identifier, model_verified, reasoning effort,
    fallback_used with reason (this handoff sets fallback_allowed false and
    degraded_allowed false: if the policy cannot be honoured the Executor
    refuses and reports, never silently substitutes), degraded_requirements.
  - >-
    A TIMEOUT (3600 s per run), crash, memory exhaustion or dependency
    failure is failed_infrastructure and is NEVER a result, positive or
    negative (AGENTS.md rule 5; contract invalidation rule 2); it is
    reported as such and re-planned with a smaller shard within the
    contract's spare runs, never interpreted.
  - >-
    ZERO INTERPRETATION: no conclusion, no status change, no hypothesis
    language, no ledger write (no EV-*, DEC-*, H-* or KN-* record); the
    Executor writes only inside its write_scope.
  - >-
    IMPLEMENTATION PATH (declared here as the contract's required_artifacts
    require): experiments/EXP-ECDLP-869870/source/ -- one code path for all
    selection rules with rule selection by configuration; exact coverage
    computed from the enumerated basins and cross-checked against sampled
    coverage at every exact cell; hash-pinned by commit in every run
    manifest. Shared harness code may be used only where it is already
    committed and is referenced by commit; nothing under harness/ or src/
    is modified by this task. Code shared with EXP-ECDLP-612fb1 (the same
    generic walk, DP predicate and basin enumeration) may be committed once
    under either experiment's source/ directory and referenced by commit
    from the other's manifests.
  - >-
    GATE ORDER IS BINDING: Stage 1 (N = 2^20) first, with its slope and
    top-T-share flags reported; the FIXTURE GATE at N = 2^24 (seven cells:
    scaled cost within 0.10 of 1.79 / 2.14 / 1.62 / 1.38 / 2.01 / 1.62 /
    1.50, scaled precomputation within 12% of 1.24 / 0.85 / 1.90 / 15.7 /
    1.34 / 3.66 / 36.9) is evaluated and REPORTED before any 2^24 or 2^30
    rule arm is reported; at 2^20 and 2^22 the fixture is reported with its
    O(theta) residual; the exact-coverage-versus-global-oracle check and
    the relabelling-null-versus-unselected check are computed for every
    applicable cell; depth-profile histograms are stored, not analysed.
  - >-
    NETWORK: none required by the contract for execution; permitted only
    to fetch the two named primary sources, with the fetch recorded.
  first_batch_scope: >-
    The FIRST execution batch runs Stage 1 (generic exact, N = 2^20, 5
    seeds, a in {1/8, 1/4, 1/2, 1}, all cells the stage_plan names) and
    Stage 2 (generic exact, N in {2^22, 2^24}, 5 seeds each, the same
    cells, the BLOCKING fixture gate at 2^24, the HEUR-BLT-2 regression at
    T_gen = 16 T, the M = 40000 exact-versus-sampled cross-check) and
    reports them, including an analysis run over the completed stages
    producing the constants table for exactly those stages and labelled
    with its coverage. Stage 3 (generic sampled, N = 2^30, 3 seeds) and
    Stage 4 (the curve search run and the certified curve arms at N about
    2^24, 3 seeds, a in {1/4, 1/2}, r_walk in {16, 32}) may follow in the
    same batch ONLY if the per-run (3600 s) and total (16 CPU-h, 40 runs)
    budgets allow after Stages 1-2; otherwise they are reported as NOT YET
    RUN -- never as failed, never as a negative -- and are scheduled by the
    Coordinator in a later batch under the same frozen contract.
  deliverables:
  - experiments/EXP-ECDLP-869870/source/ (the instrument implementation, one code path, hash-pinned per run manifest)
  - >-
    experiments/EXP-ECDLP-869870/runs/RUN-*/ (one immutable run record per
    executed run: manifest.yaml, raw-result.json with the exact basin-size
    multiset as a compressed histogram plus the top 1000 sizes per (N, a,
    cap, seed), cycle and capped mass, the generated pool (DP, h_d, S_d,
    exact basin size) per (a, r, seed), every selected table's identity
    hash and exact coverage, the M online walks' terminal DPs, and every
    certificate when the curve arm runs; summary.json with every primary
    and secondary metric per cell, Wilson and bootstrap intervals, the
    fixture table beside the published values and the gate verdict, KS
    statistics and regression outputs; stdout and stderr; the curve record
    with point-counting verification when Stage 4 runs; depth-profile
    histograms per basin-size bin per (N, a, seed))
  - >-
    the analysis run's constants table (measured value with CI, model
    value, ratio, per (N, a, r, rule), MEASURED and MODELED never in one
    column) over the stages completed in the batch
  - >-
    execution report in the execution batch task directory (assigned at
    dispatch): run inventory, the Stage 1 flags, the fixture gate values
    and verdict per N, exceedance flags, relabelling-null outcomes,
    certificate pass counts versus hit counts, exhaustion and
    infrastructure events, validity per run, resource measurements, stages
    not yet run
  artifact_paths:
  - experiments/EXP-ECDLP-869870/source/
  - experiments/EXP-ECDLP-869870/runs/
  - execution report (task directory assigned by the execution batch queue at dispatch)
  archived_by: TASK-20260906-7a2446
  archived_by_note: >-
    TASK-20260906-7a2446 is the RESERVED snapshot archive of the execution
    batch: it stages exactly the declared source, run and report paths
    before independent review; the ledger archive of that batch follows
    review.
  write_scope:
  - experiments/EXP-ECDLP-869870/runs/
  - experiments/EXP-ECDLP-869870/source/
  - the execution batch task directory (assigned at dispatch)
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 3600
    memory_gb: 8
    maximum_runs: 40
  contract_budget_envelope:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 16
    maximum_memory_gb: 8
    maximum_runs: 40
    maximum_workers: 1
  budget_note: >-
    Copied verbatim from the contract's budget block: wall_clock_seconds is
    the PER-RUN ceiling (3600 s; exceedance is failed_infrastructure);
    total_cpu_hours 16 and maximum_runs 40 bind the batch, whichever first;
    memory 8 GB is the schema floor (exact basins at 2^24 about 0.4 GB);
    one worker. The contract's own run arithmetic is 24 runs with 16 spare
    for recorded infrastructure re-runs. A cell not reached is reported as
    not run, never as a negative.
  completion_gate:
  - >-
    The contract's stopping rules are met for every stage executed, or a
    budget exhaustion (runs or CPU-hours) is reported as exhaustion with
    the completed prefix and the cells not run listed.
  - >-
    Every required artifact of the contract is present for every executed
    run: schema-complete manifest (command, commit, dirty state,
    environment, requested policy, resolved model, fallback flag, seeds,
    wall clock, peak_rss_bytes), raw-result.json, summary.json, histograms,
    and the analysis constants table over the completed stages.
  - >-
    The Bernstein-Lange reproduction gate (the seven fixture cells at
    N = 2^24, and at 2^30 if Stage 3 runs) is computed and REPORTED with
    its verdict before any other arm at that N is reported; the Stage 1
    flags, the exact-coverage-versus-global-oracle outcome and the
    relabelling-null-versus-unselected outcome are stated per cell.
  - >-
    Certificate pass counts are reported (equal to hit counts on every
    curve-arm run that executed; "not yet run" if Stage 4 did not execute).
  - >-
    Infrastructure failures, if any, are recorded as failed_infrastructure
    with the re-planned shard; no protocol edit anywhere; no status
    language; runs immutable.
  review_reservation: >-
    Results of this task are CLAIM-RELEVANT (review_required: true). The
    snapshot archive TASK-20260906-7a2446, the Validator TASK-20260906-7ec3ea
    (blind re-derivation of C_max(1/4) and of the exact top-T share at 2^24
    from the statement of the quantities, blind to the producer's
    implementation and to IDEA-20260906-ac100b's derivation, per the
    contract's review_note) and the Red Team TASK-20260906-90e7cf (the
    fixture procedure -- cap, distinct-DP pool, duplicate handling at
    N = T -- and the null design) are RESERVED for the execution batch. No
    run under this handoff is evidence before that chain -- snapshot
    archive, independent Validator and Red Team reports, then a
    Coordinator ledger archive with the evidence and decision records --
    has completed and been verified.
  execution_dispatch_note: >-
    Written by approval batch BATCH-9c5410 (TASK-20260906-67f1ab) per
    design-experiment skill step 5. Dispatched ONLY by the execution batch
    opened AFTER DEC-20260906-2b1387 is committed and merged to main, so the
    Executor starts from the frozen approved contract on the base branch. A
    message or in-session word is never an approval; this handoff plus the
    committed decision are.
