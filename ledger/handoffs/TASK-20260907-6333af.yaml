  constraints:
    - >-
      FROZEN CONTRACT UNCHANGED. Grammar, leaf sets, node-counting rule,
      complexity cap 12, and the candidate list are unchanged; this is a
      SEARCH METHOD change only, explicitly authorized by the contract's
      own secondary-recovery-method allowance (referenced in
      TASK-20260907-f41930) and DEC-20260907-2a3727.
    - >-
      IMPLEMENT PER-LEVEL CHECKPOINTING FIRST, before attempting any
      target: after each complexity level's enumeration completes, write
      that level's results (or at minimum: complete, count of forms,
      whether any numeric match to any pending target was found) to disk
      immediately, so that a wall-clock kill at level k preserves levels
      1..k-1 durably. This is the one infrastructure gap both prior runs
      disclosed; fix it before repeating any search.
    - >-
      For each target: run the checkpointed enumeration up to complexity
      target_complexity - 1 ONLY (not to the target complexity itself --
      that is the blind-search method already tried and already failed
      twice; do not repeat it). Under the SAME monitored-subprocess
      discipline as the second attempt (continuous /proc memory sampling,
      a real hard wall-clock/memory cap you set and justify -- 6000s per
      target is a reasonable starting point, but you may extend it if the
      checkpointed, smaller search is progressing well within memory
      headroom, since you now have real data that memory was not the
      binding constraint for three of four targets).
    - >-
      Separately and cheaply: construct the known closed-form expression
      directly (from candidate-list.yaml) in the grammar's own
      representation, evaluate it against the target's control table
      (zero residual required), and confirm its node count under
      node_counting_rule.py's own function equals the canonical complexity
      exactly.
    - >-
      REPORT (a) and (b) SEPARATELY and EXPLICITLY per target, and the
      combined verdict AS "recovered by targeted minimality" -- never
      merge this into the recovery-controls.json PASS/FAIL language used
      for blind-search recovery without the distinguishing label.
    - >-
      Attempt INV-7 p_exist's minimality (level <=10) only if the other
      three targets complete with substantial time remaining; it is
      expected, and fully acceptable, to report it as still open /
      resource_exhaustion / not attempted.
    - >-
      RUN RECORD immutable under
      experiments/EXP-RELN-141a86/runs/RUN-RELN-141a86-stage0c-minimality/
      with a real manifest.yaml (top-level key `run:`), command.txt,
      environment.json, stdout.log, stderr.log, raw-result.json, plus the
      checkpoint files and the (a)/(b) verdict tables. Do NOT touch
      RUN-RELN-141a86-stage0a, -stage0bcde, or -stage0c-repair (all
      immutable).
    - >-
      IF ALL THREE (INV-1, INV-7 p_fail, INV-8) clear: the Stage-0c gate
      is affirmatively passed for those three (INV-A4 and INV-A6 already
      passed; only INV-7 p_exist remains open). Report clearly whether
      this constitutes a complete Stage-0c pass under the contract's own
      wording ("any recovery control is not recovered... Stage 1 does not
      run") -- p_exist not being recovered by EITHER method may still
      block Stage 1 under a strict reading; do not unilaterally decide to
      proceed to Stage 1 if p_exist remains unrecovered. Report the
      situation and stop for a Coordinator decision on whether a partial
      four-of-five pass (with p_exist's exact status) is sufficient to
      proceed, per the contract's own text -- this is a judgment call the
      contract does not fully resolve and should not be made
      unilaterally by the executor.
    - A TIMEOUT, OOM, or crash is failed_infrastructure, never a result.
    - ZERO INTERPRETATION beyond the contract's own decidable classification.
