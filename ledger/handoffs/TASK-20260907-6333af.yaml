  objective: >-
    Under the same, unchanged, already-approved contract (status approved,
    per DEC-20260907-93a502), attempt STRUCTURAL RECOVERY of the three
    still-open Stage-0c controls (INV-1 conservation mean, canonical
    complexity 9; INV-7 p_fail, complexity 9; INV-8 d_reg, complexity 10)
    by TARGETED MINIMALITY rather than blind full-level enumeration,
    per DEC-20260907-2a3727: (a) exhaustively enumerate every expression
    in the target's leaf pack at complexity STRICTLY BELOW the target's
    canonical complexity and confirm none numerically matches the target
    on its control-table rows (proves minimality); (b) directly construct
    the KNOWN closed-form expression in the grammar and confirm it
    evaluates with zero residual and has EXACTLY the canonical node count
    under the frozen node-counting rule (confirms existence at that
    level). Together, (a)+(b) prove the known form is the UNIQUE
    minimal-complexity match -- a stronger, methodologically DISTINCT
    claim from blind discovery, and must be reported and labeled as such,
    never conflated with "found by blind search."
  uncertainty_reduced: >-
    Whether a search strictly smaller than the one that failed twice
    (level <= target-1 instead of level == target) completes within one
    session for INV-1, INV-7 p_fail, and INV-8, clearing the Stage-0c gate
    for at least these three and unblocking Stage 1 for the first time
    under this contract. INV-7 p_exist (complexity 11, requiring level
    <=10 on the same pack that failed at level 9 twice) is NOT expected to
    clear by this method in one session and may legitimately remain open.
  inputs:
    - experiments/EXP-RELN-141a86/specification.yaml (frozen contract; unchanged; the ONLY protocol)
    - ledger/decisions/DEC-20260907-2a3727.yaml (the design decision this handoff implements)
    - >-
      experiments/EXP-RELN-141a86/runs/RUN-RELN-141a86-stage0a/ (immutable;
