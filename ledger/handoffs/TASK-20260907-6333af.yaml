      before anything else, exactly as both prior dispatches did)
    - >-
      experiments/EXP-RELN-141a86/runs/RUN-RELN-141a86-stage0bcde/ and
      .../RUN-RELN-141a86-stage0c-repair/ (immutable; recovery-controls.json
      and target-enumeration-raw-results.json name the exact targets,
      their canonical complexities, and the prior failure data -- read
