handoff:
  id: TASK-20260825-9eda3a
  from: coordinator
  to: red-team
  objective: >-
    Independently challenge the primary-source transcription, omitted-source
    risk, frontier status, SHA-1 partition, RIPEMD-160 scope, and AES model
    separation of the three frozen shards and their pre-snapshot correction addendum.
  uncertainty_reduced: Whether a newer, stronger, incomparable, or mis-transcribed primary result invalidates any claimed frontier row or coverage statement.
  inputs:
    - coordination/goals/GOAL-SYMF-c00fa1/batches/BATCH-303ce8/frontier-schema.yaml
    - coordination/goals/GOAL-SYMF-c00fa1/batches/BATCH-303ce8/coverage-manifest.yaml
    - coordination/goals/GOAL-SYMF-c00fa1/batches/BATCH-303ce8/review-plan.yaml
    - Snapshot-bound artifacts of TASK-20260825-51dfe7, TASK-20260825-3da758, TASK-20260825-7d3441, and TASK-20260825-ced8f2
  constraints:
    - Work in an independent session under review-adversarial at xhigh.
    - Own J2 and J3; do not read the sibling Validator report.
    - Perform the SHA-1 blind re-derivation from primary sources without reading TASK-20260825-51dfe7 artifacts first; record sources read, then compare only after sealing the derivation.
    - Exercise all three proves-too-much objects and treat acceptance of any as a batch-invalidating break.
    - Absence of a newly found source is a bounded search result, never proof of completeness.
    - Respect the GOAL-MD5-001 content firewall by every retrieval route.
  deliverables:
    - red-team-report.yaml with source-level spot checks, blind SHA-1 re-derivation, omitted-source search log, proves-too-much results, and J2/J3 verdicts.
  artifact_paths:
    - coordination/goals/GOAL-SYMF-c00fa1/batches/BATCH-303ce8/reviews/TASK-20260825-9eda3a/red-team-report.yaml
  archived_by: TASK-20260825-6b0c89
  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget: {wall_clock_seconds: 1200, memory_gb: 3, maximum_runs: 1}
  completion_gate:
    - J2 and J3 have separate verdicts with source URLs and exact locators.
    - The SHA-1 re-derivation is sealed before producer artifacts are read and declares blind_from compliance.
    - Every claimed SHA-1, RIPEMD-160, and AES frontier row plus at least one row per other family is spot-checked.
    - All proves-too-much objects are rejected for the correct field-level reason.
  return_format: J2/J3 verdicts, prior overturns, source discrepancies, omitted rows, control outcomes, and report path.
  review_plan:
    claim_under_review: >-
      The three archived literature shards plus their pre-snapshot correction
      addendum faithfully transcribe primary sources into the frozen schema and
      identify only notion-matched, cost-complete nondominated rows as frontier
      rows as of 2026-08-25.
    coordinator_prior: >-
      Expect transcription and completeness gaps, no practical full-round
      single-key AES key recovery, a multi-row SHA-1 frontier, and a
      reduced-round-only RIPEMD-160 result from ePrint 2026/1744.
    joints:
      - joint: J1_schema_and_comparison_key_separation
        assigned_to: TASK-20260825-bb6d5d
        attack_plan: >-
          Reconstruct every comparison key and recompute declared dominance;
          flag any merge across notion, model, target, rounds, result kind, or
          success convention.
        breaking_artifact: validation-report.yaml with row ids and mismatched fields.
      - joint: J2_primary_source_transcription
        assigned_to: TASK-20260825-9eda3a
        attack_plan: >-
          Independently open every claimed SHA-1, RIPEMD-160, and AES frontier
          source plus a risk-based sample of the rest and compare every field
          with the cited page, table, or theorem.
        breaking_artifact: red-team-report.yaml with source-level discrepancies.
      - joint: J3_coverage_and_frontier_overclaim
        assigned_to: TASK-20260825-9eda3a
        attack_plan: >-
          Search for a newer or stronger primary result per shard and a missing
          incomparable tradeoff; attempt to dominate each frontier row with an
          omitted source.
        breaking_artifact: red-team-report.yaml with omitted rows or a bounded unchanged verdict.
    blindness: {mutual: true, lifted_for: [], rationale: null}
    proves_too_much:
      objects:
        - A flattened SHA-1 statement that the global best attack is 2^61.
        - The 42-of-80-step RIPEMD-160 collision restated as a full break.
        - A related-key reduced-round AES attack restated as full-round single-key key recovery.
      failure_signature: Any control accepted as a valid canonical frontier statement invalidates compilation.
      assigned_to: TASK-20260825-9eda3a
    blind_rederivation:
      required: true
      quantity: The exact SHA-1 frontier partition and each row's costs, success convention, and demonstration status.
      parameters: Primary sources and the frozen frontier schema only.
      blind_from:
        - coordination/goals/GOAL-SYMF-c00fa1/batches/BATCH-303ce8/tasks/TASK-20260825-51dfe7
      assigned_to: TASK-20260825-9eda3a
    procedure_deviations:
      - id: PD-1-pre-snapshot-correction
        rationale: DEC-20260825-46598a added TASK-20260825-ced8f2 before review after producer-disclosed defects.
        effect_on_plan: Review the original shards and correction together; joint ownership and blindness are unchanged.
