handoff:
  id: TASK-20260903-b5d2ae
  from: coordinator
  to: coordinator
  question_id: RQ-PFDR-ae2fba
  related_handoffs: [TASK-20260903-22c36b, TASK-20260903-dc126c]
  objective: >-
    Convert the eleven proposals filed against RQ-PFDR-ae2fba on 2026-09-03
    (lanes A, B and C) into a PRE-REGISTERED EXPERIMENT BATTERY: up to six
    hypothesis records and six frozen experiment contracts, ordered so that
    calibration and instrument-validation cells run before discovery cells,
    every contract decidable from predefined metrics with a matched null and
    a planted positive control where the instrument is new, and every
    budget sized to the work per the template floors. The battery is
    DESIGNED HERE AND NOT APPROVED HERE: every contract is left at status
    review_required with approved_by null, because approval is the gate that
    spends compute and is presented to the user for confirmation (design-
    experiment skill, step 4). One coordinator decision record binds the
    design, names the recommended execution order, and states the approval
    condition.
  uncertainty_reduced: >-
    Whether the prime-field degree column of RQ-PFDR-ae2fba can be measured
    at all with a validated instrument (the F_p Macaulay deficit meter does
    not exist as a test-covered artifact, per IDEA-20260903-399a18), and
    then, in order: whether fixed-shape ranks are p-independent (calibration,
    IDEA-20260903-26aa81); whether the derived first-fall law of
    IDEA-20260903-e1e38b holds on a curve system and its block-factored null;
    whether the last fall degree on the digit ladder is bounded, grows at the
    null slope, or shows isolated early falls (IDEA-20260903-d52480);
    whether the binary chained-Semaev deficit survives the change of
    characteristic (IDEA-20260903-cf63ad); and whether the campaign's only
    recorded prime-field early fall survives its own archive
    (IDEA-20260903-751062).
  inputs:
    - ledger/questions/RQ-PFDR-ae2fba.yaml
    - ledger/proposals/IDEA-20260903-cf63ad.yaml, IDEA-20260903-fc1355.yaml, IDEA-20260903-e0a3e8.yaml (lane A)
    - ledger/proposals/IDEA-20260903-e1e38b.yaml, IDEA-20260903-751062.yaml, IDEA-20260903-399a18.yaml (lane B)
    - ledger/proposals/IDEA-20260903-d52480.yaml, IDEA-20260903-afa56b.yaml, IDEA-20260903-f7e8a6.yaml, IDEA-20260903-26aa81.yaml, IDEA-20260903-dcf857.yaml (lane C)
    - ledger/handoffs/TASK-20260903-22c36b.yaml, ledger/handoffs/TASK-20260903-dc126c.yaml
    - templates/research-records.md (hypothesis, experiment, coordinator decision, handoff schemas; budget floors in the experiment block)
    - .claude/skills/design-experiment/SKILL.md (heuristic-validation and cost-model experiment class patterns; the approval rule)
    - agents/coordinator.md (proof-oriented dispatch gate, decision checklist, required output)
    - docs/claims-and-verification.md, docs/evidence-and-reproducibility.md
    - experiments/EXP-JPR-402649/specification.yaml (the latest approved contract, as a shape exemplar; a zero-run static derivation)
    - experiments/EXP-DREG-001/specification.yaml (the exemplar for a rank-instrument ladder with validation anchors and censoring rules)
    - experiments/EXP-SBRG-60c55e/driver/macaulay.py and tests/test_macaulay.py (the boolean Macaulay meter whose F_p port is the shared prerequisite)
    - ledger/proposals/IDEA-20260830-84cdb7.yaml (the digit presentation the battery instruments)
    - knowledge/findings/KN-FIND-006.md, KN-FIND-007.md; ledger/evidence/EV-ALPF-001.yaml; ledger/EV-DREG-001.yaml
  constraints:
    - >-
      Pre-allocated ids, used in order and never re-minted: hypotheses
      H-PFDR-09e1b0, H-PFDR-4148b8, H-PFDR-c88f14, H-PFDR-9aadc0,
      H-PFDR-e02f3b, H-PFDR-06fd60; experiments EXP-PFDR-fd901a,
      EXP-PFDR-5726af, EXP-PFDR-cbdefb, EXP-PFDR-20ee58, EXP-PFDR-4bfc6f,
      EXP-PFDR-c04716; decision DEC-20260903-8cdf8d. Unused ids are listed
      in the decision's limitations. Hypothesis k pairs with experiment k.
    - >-
      Battery composition is the Coordinator's call, but the following
      ordering constraint binds: the first contract is the p-independence
      calibration of IDEA-20260903-26aa81 at (m, d, s) = (2, 2, 3) on
      p in {2^12-scale, 2^64-scale, the P-256 prime}, because it scopes the
      rank-drop artifact budget every later toy cell needs; the second is
      the single forced cell of IDEA-20260903-e1e38b (m = 2, d = 2, s = 3:
      Semaev arm, block-factored null, support-matched null) because its
      outcome decides whether the 84cdb7 ladder runs at all; the
      last-fall/first-fall slope ladder of IDEA-20260903-d52480, the
      digit-twin deficit cell of IDEA-20260903-cf63ad (with its binary n=12
      calibration of the ported meter), and the ALPF-011 mechanism
      separation of IDEA-20260903-751062 follow. The coupled table of
      IDEA-20260903-399a18 is the integrating contract: either the sixth
      experiment or, if the Coordinator judges it better held until the
      instrument exists, a named next_action. Closure-class derivations
      (IDEA-20260903-fc1355, e0a3e8, f7e8a6, dcf857) are not experiments
      unless bound as zero-run static derivations in the EXP-JPR-402649
      shape; state the disposition of each in the decision.
    - >-
      SHARED PREREQUISITE, STATED ONCE AND CHARGED: no test-covered F_p
      Macaulay deficit meter exists. Every contract that needs exact graded
      ranks over F_p names the port of experiments/EXP-SBRG-60c55e/driver/
      macaulay.py to F_p (with the p = 2 known-answer against KN-FIND-006 and
      the planted-syzygy positive control) as an explicit input, and the
      decision's next_actions carry the tooling handoff for it as the first
      item. A contract must not silently assume the meter.
    - >-
      Every experiment contract fills every template field: objective,
      inputs, controls (matched null of the same shape; planted positive
      control where the instrument is new; the CRT/complete-splitting
      artifact of IDEA-20260830-cb8e46 and the output-degree proxy of
      IDEA-20260807-899c5e named as confounders where relevant), independent
      variables, primary and secondary metrics, preregistered_prediction
      with formula and source (the derived laws of e1e38b, d52480, 26aa81
      are the predictions; write them before any run), scale_relevance with
      tier toy and explicit transfer assumptions, tail_checks, replication
      (seeds listed, >= 3 independent curve instances where a curve enters),
      budget at or above the floors (wall_clock_seconds_per_run >= 600,
      maximum_memory_gb >= 8, or an explicit reason in the objective),
      stopping_rules, invalidation_rules (timeouts and OOM are
      failed_infrastructure, never evidence), success_criterion and
      falsification_criterion each decidable from the metrics with at least
      one outcome that counts as negative, required_artifacts (manifests
      with commit, dirty-tree hash, per-file sha256, timing, peak RSS),
      assigned_to executor, approved_by null, status review_required.
    - >-
      Every hypothesis record fills statement, mechanism, assumptions,
      predictions with minimum_effect, test_boundary, falsification_conditions,
      interpretation_limits, status proposed, proposed_by idea-generator,
      question_id RQ-PFDR-ae2fba, and cites the source IDEA id. A
      hypothesis that conditions on a heuristic carries it as a numbered
      HEUR-* entry with falsification_condition. proof_search_map is filled
      for the derivation-backed hypotheses (e1e38b, 26aa81, d52480) or
      marked not_applicable with a reason.
    - >-
      No status change to any existing record; no approval; no executor
      handoff (executor handoffs are written only on approval). The decision
      record uses a non-approve decision value, targets RQ-PFDR-ae2fba and
      the new H/EXP ids, records the recommended order, the shared
      prerequisite, the approval condition ("user confirms the frozen
      contracts; then approved_by coordinator and executor handoffs"), the
      disposition of every one of the eleven proposals (bound to a
      hypothesis, held as a pre-registered prediction, or held as a
      closure-by-derivation), knowledge_promotion.not_warranted with a
      reason, decided_by coordinator, decided_at 2026-09-03.
    - >-
      Write files directly into the repository at their final paths:
      ledger/hypotheses/H-PFDR-<tok>.yaml, experiments/EXP-PFDR-<tok>/
      specification.yaml, ledger/decisions/DEC-20260903-8cdf8d.yaml. Never
      edit any existing record. Put all prose in folded (>-) blocks. Use
      only the pre-allocated ids.
  deliverables:
    - up to six hypothesis records and six experiment specifications at their final paths
    - ledger/decisions/DEC-20260903-8cdf8d.yaml binding the battery, its order, its shared prerequisite, and its approval condition
    - a return summary, one paragraph per experiment, naming the cell that decides it and the cheapest negative outcome
  artifact_paths:
    - ledger/hypotheses/H-PFDR-*.yaml
    - experiments/EXP-PFDR-*/specification.yaml
    - ledger/decisions/DEC-20260903-8cdf8d.yaml
    - ledger/handoffs/TASK-20260903-b5d2ae.yaml
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 5400
    memory_gb: 4
    maximum_runs: 0
  completion_gate:
    - every written record parses and passes tools/validate_ledger.py with no new error against origin/main
    - every experiment specification has approved_by null and status review_required, and no field null except approved_by
    - every hypothesis cites its source IDEA id and RQ-PFDR-ae2fba
    - the decision names the recommended execution order and the shared F_p meter prerequisite
  return_format: >-
    Files written; one paragraph per experiment (hypothesis id, experiment
    id, source idea, deciding cell, prediction, cheapest negative outcome,
    budget); the recommended order; the shared prerequisite; unused ids.
