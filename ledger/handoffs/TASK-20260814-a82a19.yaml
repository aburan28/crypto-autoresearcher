handoff:
  id: TASK-20260814-a82a19
  from: coordinator
  to: executor

  objective: >-
    Run EXP-CSIDH-c65945 (experiments/EXP-CSIDH-c65945/specification.yaml),
    the frozen, Coordinator-approved contract for H-CSIDH-3eaede: (1)
    independently re-obtain CSIDH-512's exact class-group order N from
    CSI-FiSh (Beullens-Kleinjung-Vercauteren 2019), with its full prime
    factorization, cross-verified against >= 2 independent sources; (2)
    audit, with exact primary-source citations, whether Simon 2026's
    (KN-LIT-e204ab) zero-noise (a(n) -> infinity) DCP specialization is a
    legitimate instantiation of the paper's own stated theorem at this
    actual N, versus an extrapolation beyond it.

  do_not_dispatch_until: >-
    THIS HANDOFF MUST NOT BE DISPATCHED TO THE EXECUTOR until
    TASK-20260814-11516e's red-team report (coordination/goals/GOAL-QALG-001/
    batches/BATCH-dbf57a/tasks/TASK-20260814-11516e/red_team_report.yaml) has
    been read by the Coordinator and any objection it raises against
    EXP-CSIDH-c65945 or H-CSIDH-3eaede has been resolved. This handoff record
    being written and archived is administrative filing only -- it is NOT
    itself authorization to run. Authorization to dispatch is a SEPARATE,
    later Coordinator act after TASK-20260814-11516e clears (see
    TASK-20260814-5870c1's own completion_gate in dispatch_queue.json).

  uncertainty_reduced: >-
    Whether Simon 2026's construction, specialized to the zero-noise limit,
    is even applicable -- as the paper's own text states it -- to a dihedral
    group of CSIDH-512's actual class-group order, before any further effort
    is spent on Lemma 3's own correctness or on a crossover-order/cost
    comparison against Kuperberg's sieve. This is this program's single
    strongest exponent-moving CSIDH candidate this wave
    (ledger/goals/GOAL-QALG-001/checkpoints/BATCH-d4b33f.yaml); this task
    resolves the cheapest, most decisive gate on it.

  inputs:
    - H-CSIDH-3eaede
    - experiments/EXP-CSIDH-c65945/specification.yaml
    - IDEA-20260813-e6d55d
    - KN-LIT-e204ab
    - KN-TECH-d1bc4f
    - KN-LIT-071

  constraints:
    - >-
      MUST NOT be dispatched until TASK-20260814-11516e's red-team report is
      read and any objection resolved (see "DO NOT DISPATCH YET" above).
    - >-
      Simon 2026 (KN-LIT-e204ab) is an UNVERIFIED, unrefereed preprint. The
      executor must not state or imply, anywhere in the run's artifacts,
      that Lemma 3 or any other part of the paper is established --
      "unverified" status is carried through every reference to it, per
      this program's own corpus entry and per H-CSIDH-3eaede's own
      statement.
    - >-
      No numeric class-group-order value may be asserted from memory or
      invented; it must be obtained from and cited to the primary CSI-FiSh
      source and a second independent citation, per
      EXP-CSIDH-c65945.inputs and .controls.
    - >-
      The frozen protocol (EXP-CSIDH-c65945/specification.yaml) is not to be
      altered during the run. Any change requires a versioned
      protocol_amendment under experiments/EXP-CSIDH-c65945/amendments/,
      never a silent edit.
    - >-
      Scope discipline: this run tests ONLY H-CSIDH-3eaede's premise (i)
      (applicability) plus independently establishing N. It must NOT attempt
      to verify Simon 2026's Lemma 3, must NOT compute or compare any
      concrete time/query cost against Kuperberg's sieve, and must NOT draw
      any conclusion about premise (ii) or about CSIDH's security -- all
      explicitly out of this contract's scope per
      H-CSIDH-3eaede.interpretation_limits.
    - >-
      A timeout, access failure, or infrastructure error while reaching the
      primary CSI-FiSh source is reported as an infrastructure outcome
      (AGENTS.md rule 3/5), never as a negative applicability finding.

  deliverables:
    - >-
      A run record under experiments/EXP-CSIDH-c65945/runs/ reaching one of
      the terminal statuses in docs/task-lifecycle.md step 6.
    - The required_artifacts listed in EXP-CSIDH-c65945/specification.yaml.

  artifact_paths:
    - experiments/EXP-CSIDH-c65945/runs/

  archived_by: TASK-20260814-8a0fea

  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false

  budget:
    wall_clock_seconds: 1800
    memory_gb: 2
    maximum_runs: 1

  completion_gate:
    - >-
      Both required primary metrics (class_group_order_match,
      applicability_outcome) are reported with the required artifacts and
      citations, OR the run terminates at an explicit
      NOT-COMPUTED/BLOCKED or invalidation outcome per
      EXP-CSIDH-c65945.stopping_rules / .invalidation_rules -- in every case
      the run reaches a terminal status, never a silent partial result.
    - >-
      Every applicability-audit claim carries an exact primary-source
      citation (page/section/lemma), per EXP-CSIDH-c65945's
      citation-completeness control.
    - >-
      No claim in the run's artifacts exceeds EXP-CSIDH-c65945's declared
      scope (premise (i) plus N only).

  return_format: >-
    A completed run record plus the required_artifacts listed in
    EXP-CSIDH-c65945/specification.yaml, filed under
    experiments/EXP-CSIDH-c65945/runs/, ready for the Coordinator's isolated
    snapshot archive and subsequent independent review.
