handoff:
  id: TASK-20260822-a7a9e8
  from: coordinator
  to: executor
  objective: 'Construct elliptic curves over Q of the highest rank you can certify within budget,
    using a MESTRE-STYLE construction (build a curve through many prescribed rational points / force
    many simultaneous square conditions), NOT a quadratic-twist search. GOAL-ECRANK-001 measured
    the twist route: no twist of rank >= 5 in 364756 candidates, only 2 curves of rank 4 in 49692
    enumerated. Target rank >= 6, stretch >= 8. Report the maximum ACTUALLY reached.'
  uncertainty_reduced: Whether the binding constraint identified by DEC-20260822-5a5635 -- base rank
    over Q -- can be moved at all by a different construction.
  inputs:
  - experiments/EXP-ECRANK-e1e30e/analysis.md
  - experiments/EXP-ECRANK-e1e30e/source/twist_family.py
  - ledger/hypotheses/H-ECRANK-f2a2f7.yaml
  - knowledge/techniques/KN-TECH-eb06ea.md
  constraints:
  - 'EVERY rank you report is a certified LOWER BOUND from exhibited points. Never report an analytic
    rank, never report ellrank r_high, and never count a twist for which ellrank proved a bound but
    returned NO point (GOAL-ECRANK-001 saw exactly that: [1,1,0,[]]).'
  - Verify independence of the exhibited points with a height pairing matrix and report the determinant;
    a singular determinant means the points are NOT independent and the rank claim drops accordingly.
  - cypari (bundled PARI 2.15.4) and numpy are installed; there is no Sage and no sympy.
  - A timeout or crash is an infrastructure outcome, NEVER negative mathematical evidence. Record
    it as such.
  - Write ONLY inside your write_scope. Never commit; the Coordinator archives.
  - Report the maximum rank you actually reached even if it is below target. An honest 4 is worth
    more to this campaign than an unverifiable 8.
  deliverables:
  - a JSON pool of constructed curves with, for each, the a-invariants, the exhibited independent
    points, and the height regulator determinant
  - a short report stating the construction used, the maximum certified rank reached, the search
    volume, and where the method stopped paying off
  artifact_paths:
  - coordination/goals/GOAL-ECRANK-002/batches/BATCH-e0caa5/tasks/TASK-20260822-a7a9e8/highrank_pool.json
  - coordination/goals/GOAL-ECRANK-002/batches/BATCH-e0caa5/tasks/TASK-20260822-a7a9e8/report.md
  - coordination/goals/GOAL-ECRANK-002/batches/BATCH-e0caa5/tasks/TASK-20260822-a7a9e8/src/construct_highrank.py
  archived_by: TASK-20260822-e7c486
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 2400
    memory_gb: 4
    maximum_runs: 40
  completion_gate:
  - pool JSON parses and every listed rank is backed by that many exhibited points
  - every exhibited point verified on its curve in exact arithmetic by your own code
  - regulator determinant reported for every multi-point curve
  return_format: 'executor execution report: what was run, what was measured, what failed, no interpretation
    of significance'
