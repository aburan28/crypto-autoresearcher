# DECISION REPORT, GRAPH AND PDF, GOAL-MONO-001, BATCH-3186a5. The
# research-visuals "Every evidence review" rule requires a decision report
# for DEC-20261017-435b01, which composes the review of EV-MONO-1ef611. The
# composing subagent holds no shell, so the shell-holding top-level session
# produces and renders the report in the coordinator role. TASK-20261017-517bbe
# archives it in the same ledger commit as the decision. It stages nothing and
# commits nothing. Zero runs. The ID was reserved by the top-level session.
handoff:
  id: TASK-20261017-5aa462
  from: coordinator
  to: coordinator
  goal_id: GOAL-MONO-001
  batch_id: BATCH-3186a5
  authorized_by: DEC-20261017-435b01 (decision_report; AC-5)
  objective: >-
    Produce the decision report for DEC-20261017-435b01, with its graph and an
    inspected PDF, in
    experiments/EXP-MONO-4b50b6/reports/review-DEC-20261017-435b01/. Follow
    .claude/skills/research-visuals/SKILL.md "Every evidence review" and
    "Rendering". Add no claim, number or interpretation beyond the decision and
    the committed review artifacts.
  uncertainty_reduced: >-
    None about the mathematics. It discharges the visual-record duty
    (AGENTS.md "Visual research record") for this evidence-review decision.
  inputs:
    - ledger/decisions/DEC-20261017-435b01.yaml
    - ledger/evidence/EV-MONO-1ef611.yaml
    - coordination/goals/GOAL-MONO-001/review/TASK-20261016-9c1bc5/review_report.md (Part 1.3 Checks 2 and 4; Part 5 object 1 table)
    - coordination/goals/GOAL-MONO-001/review/TASK-20261016-9c1bc5/computations.json (by key, for the plotted values)
    - knowledge/frontiers/ecdlp/ (canonical-graph check only)
    - .claude/skills/research-visuals/SKILL.md
  inputs_note: >-
    The worker's context is the decision and the cited report sections.
    Nothing else under experiments/EXP-MONO-4b50b6/ is opened.
  constraints:
    - RV-1 Executed by the shell-holding top-level session in the coordinator role. Write only the five declared files. Never write into a run directory. Zero runs.
    - >-
      RV-2 The first paragraph says the decision is a CONDITIONAL adoption that
      takes effect only when TASK-20261017-517bbe verifies, and that goal status
      is unchanged. Then state the decision, evidence strength (replicated, by
      CORR-20261017-4ac525), claim tier (toy) and the exact scoped claim
      (EV-MONO-1ef611 obstruction.scope (i) with CS-D2). Name EV-MONO-1ef611,
      CORR-20261005-a53ac8, CORR-20261017-4ac525, DEC-20261017-435b01,
      DEC-20260810-2f86db, RUN-MONO-4b50b6-002, TASK-20261016-9c1bc5,
      TASK-20261016-548959 and TASK-20260930-40470a. Keep Observation,
      Comparison, Inference and Limitation separate. Carry CS-QA, CS-N1,
      CS-K1d, CS-D2, CS-QB and CS-C10 verbatim. State the independence ruling,
      and list NA-1 and the declared successor.
    - >-
      RV-3 obstruction.svg shows, per (curve, m) cell, the fraction of generic
      fibres with non-trivial Frobenius ON the factor-base locus
      (TASK-20261016-9c1bc5 review_report.md Part 1.3 Checks 2 and 4) beside the
      proves-too-much null object OFF the locus (Part 5, object 1 table), with N
      on each bar. For every 0/N cell, plot the one-sided 95% upper bound
      1 - 0.05^(1/N), labelled "derived". Add the RUN-MONO-4b50b6-002 V4 m=3
      point (0 of 1,196, as EV-MONO-a0a89c OBS-4 records it), labelled with its
      source, and a reference line at 0 labelled "by derivation".
      obstruction-data.json records each plotted value with its source
      (computations.json key or report section) and a measured or derived
      label. plot.py regenerates the SVG from obstruction-data.json.
    - RV-4 Read every number from the committed review artifacts by key or section, and check it against the report tables. A disagreement stops the task and is reported to the Coordinator. It is never repaired.
    - >-
      RV-5 Canonical graphs: check knowledge/frontiers/ecdlp/ (README.md,
      KR-IC-1fcdbc, KR-IC-5765d2, KR-IC-5931ee, KR-IC-5a43e5, KR-IC-889857,
      KR-IC-955fd6, KR-IC-fbdb61, KR-RHO-53c89f and any graph source or
      rendering there). List them in the report as checked and unchanged. If
      one would need to change, stop and report it as a scope finding. Do not
      edit it.
    - RV-6 Render with Typst from a scratch virtualenv outside the repository, with the SVG embedded. Open the PDF, read every page, and check legibility, labels, IDs and citations. If no renderer can be installed, stop and report the exact blocker to the Coordinator. Commit no placeholder PDF.
    - RV-7 Input pinning (queue note input_pinning). Release with --artifact path=sha256 for every output. Stage nothing and commit nothing.
  deliverables:
    - experiments/EXP-MONO-4b50b6/reports/review-DEC-20261017-435b01/report.typ
    - experiments/EXP-MONO-4b50b6/reports/review-DEC-20261017-435b01/report.pdf (inspected)
    - experiments/EXP-MONO-4b50b6/reports/review-DEC-20261017-435b01/obstruction.svg
    - experiments/EXP-MONO-4b50b6/reports/review-DEC-20261017-435b01/obstruction-data.json
    - experiments/EXP-MONO-4b50b6/reports/review-DEC-20261017-435b01/plot.py
  artifact_paths:
    - experiments/EXP-MONO-4b50b6/reports/review-DEC-20261017-435b01/report.typ
    - experiments/EXP-MONO-4b50b6/reports/review-DEC-20261017-435b01/report.pdf
    - experiments/EXP-MONO-4b50b6/reports/review-DEC-20261017-435b01/obstruction.svg
    - experiments/EXP-MONO-4b50b6/reports/review-DEC-20261017-435b01/obstruction-data.json
    - experiments/EXP-MONO-4b50b6/reports/review-DEC-20261017-435b01/plot.py
  archived_by: TASK-20261017-517bbe
  inference:
