  objective: >-
    LEDGER ARCHIVE, RUN ALONE, AFTER BOTH REVIEWS. Compose the two blinded
    reviewers' joint-level verdicts into the batch's evidence record
    EV-ECDLP-9875b0 and the official decision DEC-20260907-7328d4, commit them
    together with both review reports and the goal checkpoint shard, and write
    the post-commit receipt. This is the only task in BATCH-e9fd22 permitted to
    make an official research-state statement.
  uncertainty_reduced: >-
    What the batch actually establishes about G3-feasibility at a = 1/8 (and,
    with reduced independence weight, at a = 1/16) at N in {2^20, 2^24},
    T_sel = T/2, r = 2 -- scoped exactly to the tested grid -- and what remains
    open for the goal's next lane.

  inputs:
    - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-e9fd22/tasks/TASK-20260907-6a2b2e/validation_report.yaml (J1, J2, J6)
    - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-e9fd22/tasks/TASK-20260907-3dff63/red_team_report.yaml (J3, J4, J5)
    - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-e9fd22/tasks/TASK-20260907-3dff63/proves_too_much_results.json
    - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-e9fd22/tasks/TASK-20260907-e423d5/execution_report.yaml
    - ledger/handoffs/TASK-20260907-e423d5.yaml `review_plan` (the prior, the joints, the declared blindness -- read the prior BEFORE reading the reports)
    - experiments/EXP-ECDLP-6ac801/specification.v2.BATCH-e9fd22-proposed.yaml (the only criteria that may be applied for this batch)
    - ledger/decisions/DEC-20260907-9b1b02.yaml (the RANK 1 this batch discharges) and DEC-20260907-4e34c5.yaml (the approval)
    - ledger/goals/GOAL-ECDLP-bbc21f/goal.yaml

  constraints:
    - "Run ALONE. Stage only the declared paths. Commit on branch cursor/ecdlp-bbc21f-g3-feasibility-review-276e; merge origin/main in first if it moved, never rebase."
    - >-
      VALIDITY BEFORE INTERPRETATION. Before reading any verdict, confirm from
      the producer's and reviewers' own reports: expected run count, schema-
      complete manifests, no duplicate or missing seed, raw/summary agreement,
      the seal genuinely predating every blind_from read, and every control
      evaluated in the declared order. An invalid or incomplete run set goes
      back to the executor with concrete defects; it is not evidence.
    - >-
      APPLY specification.v2.BATCH-e9fd22-proposed.yaml's OWN CRITERIA, EXACTLY AS WRITTEN, PER CELL.
      Do not composite S1/S2/S3/S4 across cells into one verdict; that erases
      the distinction between a confirmed result, a confirmed negative, an
      honestly unresolved cell, and a genuine disagreement. Do not change any
      criterion after seeing an outcome -- that requires a versioned
      protocol_amendment and a new approval gate.
    - >-
      IF ANY CONTROL FIRED THE WRONG WAY, no feasibility verdict is reported at
      any a (specification.v2.BATCH-e9fd22-proposed.yaml `invalidation_rules`, `falsification_criterion`
      F4). An artifact finding is the result, and it is reported as one rather
      than as a weaker version of the result that was hoped for.
    - >-
      COMPOSE; DO NOT COUNT VOTES. Each reviewer saw half the joints by
      construction. Read your own recorded prior first and state, in the
      decision, where the round CONFIRMED it and where it OVERTURNED it -- the
      overturned parts are the round's most valuable output and are worthless if
      not named.
    - >-
      RUN `python3 tools/check_review_independence.py --batch
      coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-e9fd22` and record its
      EXACT output in the decision. If it reports a finding, that finding is
      either a real independence defect or a disclosed and justified false
      positive -- say which, with the reason, and never absorb it silently.
    - >-
      RECORD `procedure_deviations` on the review plan if anything departed from
      it. Acting before a report returned, reassigning a joint, or dropping a
      control may each be right; none is self-documenting.
    - >-
      THE a = 1/16 CELL CARRIES A PERMANENT INDEPENDENCE CAVEAT
      (specification.v2.BATCH-e9fd22-proposed.yaml `blind_history_contamination`; two commit messages
      leak its verdict). Whatever J5 recommends, the evidence record must state
      the caveat beside that cell and must not present its agreement as
      independence of the same quality as a = 1/8's.
    - >-
      SCOPE EVERY CONCLUSION to the tested (N, a, r, T_sel, seed set,
      instrument) at claim_tier toy under KN-LIT-013. A CONFIRMED-FEASIBLE cell
      is a CEILING result and does not by itself move H-ECDLP-37dc01's status;
      DEC-20260907-9b1b02 RANK 2's online RESEL-L batch and RANK 3's v3
      amendment items both remain outstanding prerequisites.
    - >-
      FILL `knowledge_promotion` ON THE DECISION. Promote a KN-FIND only on
      `support` or `reject_scoped` backed by `replicated`/`strong` evidence;
      otherwise record a concrete `not_warranted` reason. If you do promote,
      the KN-FIND entry and the regenerated knowledge/INDEX.md ship in THIS
      commit.
    - >-
      IF a = 1/16 COMES BACK INFEASIBLE, that contradicts committed evidence
      (EV-ECDLP-2e9680) and requires independent review-breakthrough review at
      max effort per AGENTS.md rule 12 BEFORE it is recorded as anything. Do not
      downgrade the tier to get it moving; leave the claim un-promoted, record
      the impediment on the still-active goal, and stop.
    - "The commit message must name the task and record IDs and must state no numeric result."
    - "Do not commit dispatch_plan.* or coordination/**/claims/."

  deliverables:
    - ledger/evidence/EV-ECDLP-9875b0.yaml (per-cell, with strength, scope, and an `obstruction` block with a genuinely asked `resource_check` if any cell resolves INFEASIBLE)
    - ledger/decisions/DEC-20260907-7328d4.yaml (the official decision, with `knowledge_promotion` filled)
    - ledger/goals/GOAL-ECDLP-bbc21f/checkpoints/BATCH-e9fd22.yaml (write-once checkpoint shard, preserving exactly one next action)
    - one ledger commit staging exactly the declared paths
    - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-e9fd22/archives/TASK-20260907-022c19/ledger-receipt.json

