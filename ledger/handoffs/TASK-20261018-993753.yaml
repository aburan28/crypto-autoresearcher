  objective: Implement the exact six frozen finite worksheets, two non-importing arithmetic/counting routes
    per contract, separate measurement/checker controls, and honest direct native metadata; prepare source-bound
    trial layouts without scientific launches or frozen contract edits.
  uncertainty_reduced: Whether the approved finite worksheet definitions have complete source implementations,
    independent arithmetic routes and artifact-preserving native interfaces.
  inputs:
  - experiments/EXP-ECDLP-080496/specification.yaml
  - experiments/EXP-ECDLP-4a3f03/specification.yaml
  - experiments/EXP-ECDLP-5a293e/specification.yaml
