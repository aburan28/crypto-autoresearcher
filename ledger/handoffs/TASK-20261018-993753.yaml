  constraints:
  - Write only NEW files inside the exact six implementation directories and your own preparation directory;
    never overwrite an existing source file without returning its exact conflict.
  - Do not edit frozen specifications, hypotheses, approvals, old source/run artifacts, canonical trial-plan.json,
    queues or supervisor/validator code. Coordinator owns all IDs, canonical plans, metadata amendments,
    approval, queue/archive records and publication.
  - No actual scientific driver/census/worksheet trial, native claim, ledger interpretation, commit or
    push. Compile/source checks and synthetic controls distinct from complete frozen cells are permitted.
  - Preserve every original input, criterion, control, negative reading, route count and stopping rule.
    A valid measurement can miss a prediction; checker validity must not require prediction_match:true.
  - Two non-importing scientific routes remain independent. Share only explicitly named metadata plumbing;
    checkers must rederive the measurement/witness without importing the measured route or asserting the
    expected table.
  - Use two separately allocated native RUN IDs where the frozen protocol says two runs (one per route).
    Do not collapse both into a single supervised trial. Coordinator will allocate/freeze IDs later. A
    proposed second trial may depend on the first for explicit final route comparison.
  - Use a direct native envelope bound to actual launch.json/environment.json/command.txt, source/plan/spec
    hashes, actual start/end/timing/resource boundaries and no-overwrite writes. Honest deterministic
    seed:null; never invent0. Outer certificate.kind:none unless a genuine supported certificate exists;
    required certificate.yaml can be an explicitly limited finite worksheet witness, never fabricated
    proof/ECDLP certificate.
  - Exact required scientific outputs include raw-result.json and certificate.yaml plus native manifest;
    supervisor owns GENERATED8 and they are not declared as driver artifacts. Every extra output must
    be listed prospectively.
  - Each prospective trial-layout.json names every frozen cell/route, required artifact, method, parameter
    source, dependency, invalidation/control and unresolved ambiguity; use placeholders for unallocated
    IDs and do not claim approval/readiness.
  - No Bedrock, unavailable-model substitution, inference verification, formal proof, speedup or scientific
    interpretation claim.
