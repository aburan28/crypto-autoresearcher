handoff:
  id: TASK-20260728-005
  from: coordinator
  to: idea-generator
  goal_id: GOAL-SSI-001
  batch_id: BATCH-002
  objective: >-
    Under one named cost convention, derive separately for the F_{p^2} and F_p
    regimes what the honest matched classical baseline for supersingular isogeny
    path-finding is, and either define the low-memory isogeny-graph collision-
    search analogue precisely or falsify it.
  inputs:
    - IDEA-20260725-001 as revised by DEC-20260725-002 (ADMIT_BASELINE_DERIVATION_FOR_BATCH_002)
    - EV-SSI-001 observations and unresolved_confounds
    - RT-20260725-503 objections F1, F2, N1, N2, N4 and its required_scope_fixes
    - TASK-20260725-501 baseline_map.md and candidate_report.yaml at snapshot 1d907a5
    - Repository knowledge spine KN-TECH-024..029, KN-TECH-035, KN-TECH-044, KN-LIT-094, KN-OPEN-013..015
  constraints:
    - >-
      ZERO CURVE COMPUTE. No isogeny evaluation, no j-invariant computation, no
      graph sampling, no timing run, no experiment. Derivation only.
    - >-
      Treat F_{p^2} generic path-finding and F_p-rational Delfs-Galbraith-eligible
      instances as two separate regimes with separate verdicts. A blended ranking
      does not discharge RT-20260725-503 objection F2.
    - >-
      Name exactly one cost convention and apply it identically to every algorithm
      compared. Asymmetric charging invalidates the comparison.
    - >-
      Every exponent, constant, or bound asserted must cite an archived source by
      ID or be derived in the note. Do not import a numeric expectation from an
      unarchived probe or recollection; where a quantity is not established by an
      archived source, label it an untested expectation in place.
    - >-
      State every heuristic as a numbered assumption with an explicit
      falsification condition. A conditional statement is never written as
      unconditional.
    - >-
      Maximum claim strength is a matched-baseline recommendation plus at most a
      proposed KN-TECH baseline note. Claim no break, no sub-p^{1/4}
      endomorphism-ring attack, and no GOAL-SSI-001 completion criterion.
    - >-
      Charge memory, wiring, preprocessing, and verification. Charge no quantum
      queries and no torsion-image oracle; those lanes are out of scope here.
    - SIDH/SIKE torsion-image key recovery is a closed known attack and not a novelty target.
    - Change no official state; create no evidence, decision, or hypothesis record.
    - Record requested policy, resolved model identifier, fallback status, and session independence.
  deliverables: [derivation_note.md, baseline_recommendation.yaml]
  artifact_paths:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-002/tasks/TASK-20260728-005/derivation_note.md
    - coordination/goals/GOAL-SSI-001/batches/BATCH-002/tasks/TASK-20260728-005/baseline_recommendation.yaml
  archived_by: TASK-20260728-006
  inference:
    policy: research-deep
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 1800
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
    - >-
      G1 F_{p^2} regime: MITM time exponent and space exponent stated separately,
      the named full-cost convention applied to the table, and a reported verdict
      on whether MITM's full-cost exponent strictly exceeds its step-count
      exponent or provably collapses to it. Wiring/access model stated as a
      numbered assumption.
    - >-
      G2 F_p regime: Delfs-Galbraith step count and memory stated under the same
      convention, with an explicit decision on whether MITM is ever competitive on
      F_p-rational instances, addressing objection F2 by name.
    - >-
      G3 Low-memory analogue defined or falsified: either an explicit walk law,
      distinguished-point predicate, collision-to-path reconstruction,
      any-collision versus golden-collision accounting, and expected cost with
      numbered heuristics; or a falsification naming exactly what the construction
      requires that is unavailable without an uncharged oracle or nonstandard
      graph access. 'Underspecified' with no resolution does not close this gate.
    - >-
      G4 Recommendation: one matched-baseline verdict per regime, the cost
      convention named, what remains uncharged listed, and which of the three
      pre-registered IDEA-20260725-001 falsification outcomes fired, or that none
      did.
    - >-
      G5 Completion-condition flag: new_attack_mechanism_detected set true or
      false with justification. If true, described as a candidate for a separate
      Coordinator decision and not claimed; if false, stated plainly that BATCH-002
      does not count toward GOAL-SSI-001 completion criteria.
    - >-
      G6 Limits: established literature, derivation, and speculation separated,
      and what the derivation cannot establish listed, including that asymptotic
      full-cost statements settle baseline identity and not concrete bit-security.
  authorized_by: DEC-20260725-002
  recorded_by: coordinator
  recorded_at: '2026-07-28'
