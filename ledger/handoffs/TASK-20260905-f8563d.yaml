handoff:
  id: TASK-20260905-f8563d
  from: coordinator
  to: idea-generator
  objective: >-
    Write the ECDLP tracked-object enumeration that docs/inventor-protocol.md
    section 1 and KN-OPEN-019 are waiting on, as a knowledge technique entry:
    for every established attack family, the object tracked, the operation it
    must survive, and the named obstruction that stops it, in the form of
    KN-TECH-056 component 7 -- then state, with an argument drawn only from
    committed records, which of the three KN-OPEN-019 outcomes the enumeration
    supports and what remains open. User-requested on 2026-09-05 as the
    prerequisite for object-first generation of new ECDLP arithmetic.
  uncertainty_reduced: >-
    Whether the program's saturation conclusions about the classical ECDLP
    space rest on an enumeration and an argument (KN-OPEN-019 outcomes 2 or 3)
    or only on a tally of rejected mechanisms (outcome 1 or unverified), and
    which candidate-object classes remain generatable after the recorded
    rigidity results.
  inputs:
  - knowledge/open-problems/KN-OPEN-019.md
  - knowledge/techniques/KN-TECH-056.md
  - docs/inventor-protocol.md
  - docs/object-frame-ideation.md
  - ledger/proposals/IDEA-20260802-002.yaml
  - ledger/proposals/IDEA-20260806-c5d183.yaml
  - ledger/proposals/IDEA-20260807-df906f.yaml
  - ledger/proposals/IDEA-20260815-f558e4.yaml
  - ledger/proposals/IDEA-20260901-863e36.yaml
  - ledger/hypotheses/H-TLD-f4c8ba.yaml
  - knowledge/findings/KN-FIND-ffe1df.md
  - knowledge/open-problems/KN-OPEN-020.md
  - knowledge/open-problems/KN-OPEN-003.md
  - ledger/questions/RQ-ECDLP-623a32.yaml
  - knowledge/README.md
  - agents/idea-generator.md
  constraints:
  - >-
    Synthesis only. Every row of the enumeration and every step of the
    argument cites the committed record it is read from (IDEA-*, KN-*, H-*,
    EV-*, DEC-*). Nothing is derived here that is not already derived in a
    cited record; a gap in the corpus is written down as a gap, not filled.
  - >-
    Corpus reads only; do not use web search. External literature enters only
    through existing KN-LIT entries, cited by id.
  - >-
    Entry id KN-TECH-ee6696, type technique, confidence reported, frontmatter
    per knowledge/README.md (id, type, title, tags, confidence, complexity,
    applicability, source_refs, added 2026-09-05, superseded_by null). Do not
    edit KN-OPEN-019 or any other existing record; the entry cites it and
    says which outcome it supports.
  - >-
    The table has one row per family F1-F7 of IDEA-20260802-002 (add a row
    only for a family a committed record names), with columns: tracked
    object; operation the object must survive; what the projection discards;
    trichotomy class of IDEA-20260806-c5d183 (partial-action, branching,
    coordinate-dependent, or none because injective); named obstruction with
    the record it is read from; what remains open for that family.
  - >-
    The argument section states the rigidity results at the tier actually
    verified: KN-FIND-ffe1df Theorem C is validator-confirmed; the orbit
    argument of IDEA-20260806-c5d183 and the block-system classification of
    IDEA-20260901-863e36 are proposal-tier derivations, novelty unverified,
    and are labelled as such. Do not promote a proposal-tier derivation to a
    finding.
  - >-
    Forward guidance names the classes that remain generatable -- at minimum
    the (representation, operation set) pairs of search bias 6, the
    branching class with the (L, b) meter, and the KN-OPEN-020 open
    factor-base classes -- and proposes no candidate object of its own.
  - >-
    No closure is claimed. If the enumeration supports KN-OPEN-019 outcome 2
    (a common frame), say so with the argument; outcome 3 (a closing
    transitivity-style argument) may be stated only as what such an argument
    would need, since no committed record supplies it. A count of rejected
    mechanisms is not an argument.
  - >-
    No proposals, no compute, no status change, no new identifiers beyond the
    two deliverable paths. Honest-accounting block of
    docs/inventor-protocol.md section 5 at the end of the report, with
    dominated_by "n/a (no result claimed)" and sota_delta "no attack;
    methodological synthesis only".
  deliverables: &id001
  - knowledge/techniques/KN-TECH-ee6696.md
  - research/ecdlp_tracked_object_enumeration_20260905.md
  artifact_paths: *id001
  archived_by: TASK-20260905-60e3a6
  inference:
    policy: research-deep
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 1800
    memory_gb: 4
    maximum_runs: 0
  completion_gate:
  - KN-TECH-ee6696.md parses under tools/build_knowledge_index.py and carries
    the frontmatter fields listed above.
  - Every family row and every argument step carries at least one record id
    that exists in the repository.
  - The entry states which KN-OPEN-019 outcome it supports and names what
    remains open; it claims no closure and proposes no candidate object.
  - The report carries the section 5 honest-accounting block.
  return_format: >-
    One knowledge technique entry and one Markdown report, plus a one-paragraph
    summary naming which outcome of KN-OPEN-019 the enumeration supports and
    the single largest gap it found.
  review_plan: null
