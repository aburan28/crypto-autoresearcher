handoff:
  id: TASK-20260824-c40847
  from: coordinator
  to: validator
  goal_id: GOAL-DIFFP-84d641
  batch_id: BATCH-f8bf86
  question_id: RQ-DIFFP-a5c483
  experiment_id: EXP-DIFFP-fe894e
  objective: >-
    Verify the integrity of the adjudicator package against its frozen contract,
    not its interestingness: (V-a) cold re-run of the deterministic checks from
    the seven declared seeds, in fresh processes, to EXACT INTEGER agreement with
    the producer's reported counts; (V-b) run-artifact, seed and manifest
    integrity -- code_path_fingerprint present, armed deadline present, the
    literal experiment id EXP-DIFFP-fe894e in every manifest, seeds exactly the
    seven declared, no undeclared run, module sha256s matching the snapshot
    receipt; (V-c) criterion compliance -- every generator's VERIFIED/EXCLUDED
    verdict traceable to its own check's integer counts, the strict group exactly
    the verified subset, strict and permissive verdicts reported separately and
    never merged, the three census counts separated and never summed; (V-d) THE
    CONTROLS ARE NON-VACUOUS -- confirm from the artifacts that CTL-NULL ran
    against a census containing entries a draw could have matched, and that
    CTL-PLANT covered every planted path AND every verified-generator image;
    (V-e) scope -- no search over the difference space, no quarantined read, the
    payload sha256 unchanged, no cost projection, the `analyzed` ceiling
    respected, and no NON-MEMBER verdict written or implied as novelty.
  uncertainty_reduced: >-
    Whether the reported integers are what the committed code actually produces
    from the declared seeds, and whether the two controls are CAPABLE OF FAILING
    at all -- which is the only thing that makes their passing mean anything.
  inputs:
    - >-
      THE COMMITTED REVIEW PLAN for TASK-20260824-c6625a, which assigns this
      task's joints and is AUTHORITATIVE over the objective sketch above. It is
      written by a separate coordinator handoff after the snapshot lands and
      before this task runs; THIS TASK MAY NOT BE DISPATCHED BEFORE IT EXISTS.
    - The snapshot receipt and the exact paths it binds by path_sha256.
    - >-
      experiments/EXP-DIFFP-fe894e/specification.yaml -- the frozen contract,
      including its invalidation rules and its declared seeds.
    - >-
      The producer's execution report, census.yaml, equivalence-declaration.yaml
      and null-control-result.json.
    - >-
      coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/batch.yaml -- the
      Coordinator's prior recorded at opening, P-1 through P-5.
  constraints:
    - >-
      INDEPENDENT SESSION, SIBLING-BLIND. Do NOT read
      coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/reviews/TASK-20260824-3bd362,
      and declare in your attestation exactly what you read.
    - >-
      Re-runs write into THIS TASK'S OWN DIRECTORY ONLY. The archived run
      directories are immutable.
    - Do not read coordination/goals/GOAL-MD5-001/quarantine/** and attest non-reading.
    - >-
      REPORT ON THE JOINTS YOU OWN. Do not compose a whole-claim verdict: you
      cannot see the other joints by construction, so a whole-claim verdict from
      you would be an opinion formed from a fraction of the evidence.
    - >-
      An infrastructure failure in your own re-run is infrastructure signal, not
      a finding against the producer; report it as such and say what remained
      unverified.
    - >-
      Record requested policy, resolved model identifier, backend, probe status
      and reasoning effort. A tier the backend cannot reach is a PAUSE, never a
      silent downgrade. Never Amazon Bedrock.
    - No fabricated commands, outputs, timings, statistics, citations or runs.
  deliverables:
    - >-
      validation-report.yaml with joint-by-joint findings (holds | breaks |
      inconclusive), every re-derived integer shown beside the producer's with
      the exact-agreement fraction, an explicit confirmation or denial of each
      control's non-vacuity from the artifacts, a review_attestation block naming
      task_id, joints_owned, sources_read, read_sibling_reports false and
      verdict, the quarantine non-reading attestation and payload sha256
      comparison, and the requested policy with the resolved model identifier.
    - >-
      An explicit statement of where your findings DEPART from the Coordinator's
      recorded prior P-1..P-5, if they do.
  artifact_paths:
    - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/reviews/TASK-20260824-c40847/validation-report.yaml
  archived_by: TASK-20260824-b03556
  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 360
    memory_gb: 3
    maximum_runs: 3
  completion_gate:
    - >-
      Every joint assigned to this task by the committed review plan has an
      explicit verdict of holds, breaks or inconclusive, with its evidence.
    - >-
      The cold re-run's agreement is reported as an integer fraction, not as a
      percentage alone.
    - >-
      The non-vacuity of both controls is explicitly confirmed or explicitly
      denied, from the artifacts.
    - >-
      A review_attestation block is present with sources_read and
      read_sibling_reports: false.
    - The quarantine non-reading attestation and the payload sha256 comparison are present.
  return_format: >-
    Joint-by-joint verdicts, the re-derived integers beside the producer's, any
    departure from the Coordinator's recorded prior, and anything that remained
    unverified with the reason.
  review_plan: null
  review_plan_note: >-
    NULL BY DESIGN AND NOT BY OVERSIGHT. This handoff does not OPEN the review
    round; it is authored at batch opening so the task exists in the queue with a
    budget and a scope. The round is opened by a SEPARATE coordinator handoff
    carrying the review_plan, written after the snapshot archive lands and before
    any reviewer runs (AGENTS.md, "Review architecture"). Dispatching this task
    without that committed plan is a procedure violation, not a shortcut.
