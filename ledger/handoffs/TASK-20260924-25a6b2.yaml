  completion_gate:
    - the row count in ranking-report.yaml equals the pool count in the pasted tool output, and every pool id has exactly one row with all nine fields
    - every cluster in dedup-map.yaml names its members and a recommended survivor or merge
    - every rho-convention deviation is quoted with its field, and none is corrected
    - a ranked top three with reasons, and the zero-compute certificate shortlist, are present
    - no record edited, no identifier minted, no disposition beyond a recommendation, zero runs
    - nothing read from the excluded paths, attested in the report
  review_plan: null
  dispatch_preconditions:
    - TASK-20260924-4406f3's ledger receipt VERIFIED and pushed
    - archived_by TASK-20260924-0b795b bound (on this card)
    - >-
      The ecc_priority.py output for all four areas is pasted verbatim into the
