handoff:
  id: TASK-20260924-25a6b2
  created_at: '2026-09-24'
  created_by: coordinator
  from: coordinator
  to: idea-generator
  goal_id: GOAL-ECDLP2M-001
  batch_id: BATCH-81fda1
  review_plan_id: null
  title: >-
    Read-only ranking of the open proposals under RQ-BINSTD-b6f698,
    RQ-NISTBIN-06157b, RQ-OAKLEY-264353 and RQ-CERTBIN-836ce2: deduplicate,
    audit, classify, and recommend the /design-experiment candidates
  objective: >-
    Produce one audited row per open ECC proposal in the pool, a deduplication
    map across the four questions, and a ranked shortlist of the top three
    /design-experiment candidates. DEC-20260924-99ce20 uses it as advisory
    input. This card closes, rejects and edits nothing.
  uncertainty_reduced: >-
    Which open proposals in the binary-standard cluster are distinct, sound
    enough to design, and decision-changing per unit cost, and which duplicate
    each other, inherit the matched-rho convention defect recorded in
    CORR-20260922-81aeab, lack a proof_search_map audit, or ask for work out of
    their question's scope.
  inputs:
    - >-
      THE POOL, pasted VERBATIM into the launch prompt by the top-level session
      at dispatch: the output of `python3 tools/ecc_priority.py --open-ideas
      --area X` for X in BINSTD, NISTBIN, OAKLEY, CERTBIN. The pasted tool
      output governs. The authoring Coordinator read these ids by question_id
      on 2026-09-24 and expects them. BINSTD (30): IDEA-20260922-6237e5,
      -faa8d2, -77bf31, -0e3641, -99294c, -845a77, -b19793, -6cf862, -7ab503,
      -c07598, -2e2a58, -9e5383, -2a3771, -d11575, -1b16d7, -6028ed, -c2bbe6,
      -dacfc2, -818b73, -1a081a, -8ac1ea, -9d12bd, -29b1c5, -493606, -261004,
      -f37254, -8278db, -793fd8, -153a90, -e3048d. NISTBIN (4):
      IDEA-20260922-c48e7d, -cdca3a, -40003d, -7d6d43. OAKLEY (2):
      IDEA-20260922-af7396, -70a67c. CERTBIN (0). Any difference between this
      list and the pasted output is reported, not reconciled.
    - ledger/questions/RQ-BINSTD-b6f698.yaml
    - ledger/questions/RQ-NISTBIN-06157b.yaml
    - ledger/questions/RQ-OAKLEY-264353.yaml
    - ledger/questions/RQ-CERTBIN-836ce2.yaml
    - ledger/decisions/DEC-20260924-4f8a03.yaml (R2 is the ownership rule to apply)
    - ledger/corrections/CORR-20260922-81aeab.yaml
    - ledger/corrections/CORR-20260922-0d365e.yaml
    - analysis/binstd-curve-audit/
    - analysis/frobenius-orbit-ecc2k130/
    - ledger/decisions/DEC-20260922-61cdc1.yaml
    - experiments/EXP-CERTBIN-4e92d7/specification.yaml
    - ledger/decisions/DEC-20260923-f25b97.yaml
  read_scope:
    - AGENTS.md
    - agents/idea-generator.md
    - templates/research-records.md
    - docs/target-result-profile.md
    - docs/inventor-protocol.md
    - docs/claims-and-verification.md
    - knowledge/techniques/KN-TECH-080.md
    - knowledge/techniques/KN-TECH-056.md
    - orchestration/research-priority.yaml
    - ledger/questions/
    - ledger/proposals/
    - ledger/corrections/
    - ledger/hypotheses/
    - ledger/decisions/DEC-20260924-4f8a03.yaml
    - ledger/decisions/DEC-20260922-61cdc1.yaml
    - ledger/decisions/DEC-20260923-f25b97.yaml
    - analysis/binstd-curve-audit/
    - analysis/frobenius-orbit-ecc2k130/
    - experiments/EXP-CERTBIN-4e92d7/specification.yaml
    - experiments/EXP-SEMBIN-992e73/
    - knowledge/
  read_scope_note: >-
    ledger/proposals/ includes proposals that are not open (for example
    CERTBIN ones already designed); read them for deduplication only and do
    not rank them. Knowledge retrieval (search_knowledge) is used before
    asserting that an avenue was tested or is known to fail; if the index is
    empty, say so and do not treat an empty result as evidence.
  constraints:
    - >-
      READ-ONLY and ZERO RUNS. Write only the two declared files. Edit no
      proposal, question, correction, decision or any other record. Mint no
      identifier. Write no hypothesis or experiment. Run no solver and no
      program. Any arithmetic check is written out in the report, step by step.
    - >-
      NO DISPOSITION BEYOND A RECOMMENDATION. Do not close, reject, withdraw,
      weaken or supersede any proposal or lane. A recommendation to hold or
      deprioritise names its evidence, test boundary, remaining uncertainty
      and a concrete revisit condition (AGENTS.md "Research-direction
      integrity").
    - >-
      APPLY DEC-20260924-4f8a03 R2. BINSTD owns the reachability table and
      structural-emptiness certificates only; CERTBIN, NISTBIN and OAKLEY own
      measured decomposition cost on their own families; mechanism owners are
      as RQ-BINSTD-b6f698 constraints list them. A proposal that re-measures
      another owner's quantity is flagged, not ranked as new work.
    - >-
      MATCHED-RHO CONVENTION. Check every proposal's rho baseline against the
      corrected convention of CORR-20260922-81aeab: 0.886 sqrt(r)/sqrt(k),
      equivalently sqrt(pi r/(4k)), where the negation gain is already inside
      0.886. Report each deviation with the exact field and the formula as
      written. Do not correct it.
    - >-
      SCOPE. Any proposal whose minimal test runs an attack on a curve at
      m >= 131 is flagged out of scope under RQ-BINSTD-b6f698's "ARITHMETIC
      ONLY AT DEPLOYED PARAMETERS" constraint (and the siblings' equivalents).
      Arithmetic-only rows at deployed parameters are in scope.
    - >-
      CITATION PROVENANCE (AGENTS.md rule 9). Record, per proposal, any
      reference marked or effectively `recalled` that the proposal leans on
      for novelty_status known or adaptation, or for a load-bearing number.
      IDEA-20260922-d11575's dependence on the Maurer-Menezes-Teske body text
      is one known case.
    - >-
      EXCLUDED FROM READING. Nothing under experiments/EXP-FROB-30006a/, the
      ref origin/cursor/semaev-2015-audit-program-5b8b, PR #1377, or
      experiments/EXP-QSP-70b731/runs/. A proposal that cites any of them is
      cited by id only. No AUXIN census value, reviewer finding value,
      RUN-FROB-627924 value or EXP-FROB-30006a outcome appears in either file.
    - >-
      INDEPENDENCE. Not the session that authored DEC-20260924-4f8a03, and not
      a session that authored any proposal in the pool.
  deliverables:
    - >-
      ranking-report.yaml. One row per pool proposal, in the pool's order, with
      nine fields: (1) dedup_cluster, its members across all four questions,
      and the owning question or mechanism owner under R2; (2)
      reachability_cells, the curve rows and index-calculus lines it fills,
      each typed structurally_empty, computed_cost or open as in
      RQ-BINSTD-b6f698's decision_target; (3) proof_search_map_audit, for each
      of the four KN-TECH-080 audits (baseline reproduction, observation
      collision, quantifier order, method ceiling with nearby-object control)
      one of present, not_applicable with the proposal's reason, or missing;
      (4) pareto_check, whether dominated_by and sota_delta are filled and
      consistent with the corrected rho convention, with any deviation quoted;
      (5) result_class, exponent_moving, constant_factor,
      structural_certificate or tooling, judged against
      docs/target-result-profile.md C1; (6) citation_provenance_flags;
      (7) compute_class, zero_compute_derivation, arithmetic_only_deployed,
      executable_toy_cell (n <= 41) or out_of_scope; (8) first_decisive_deliverable,
      its cost and the decision it would change; (9) recommended_disposition,
      design_now, design_after (naming the prerequisite), merge_into (naming
      the survivor), return_for_revision (naming the defect) or hold (with
      evidence, boundary and revisit condition). Then a ranked top three for
      /design-experiment with reasons, a shortlist of zero-compute
      structural-certificate proposals that could be designed as derivation
      notes, any tripwire item (a breakthrough, closure or
      contradiction-of-validated-evidence claim), and an attestation of what
      was read and the exact tool output received.
    - >-
      dedup-map.yaml. Clusters of overlapping proposals across the four
      questions, each with members, the shared object or quantity, and a
      recommended survivor or merge.
  artifact_paths:
    - coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-81fda1/ranking/TASK-20260924-25a6b2/ranking-report.yaml
    - coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-81fda1/ranking/TASK-20260924-25a6b2/dedup-map.yaml
  archived_by: TASK-20260924-0b795b
