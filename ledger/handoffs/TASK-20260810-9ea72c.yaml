      pre-registration held, and IF THE MEASUREMENT FALSIFIED RT-2 AND THE PACKAGE DID
      NOT SAY SO, RECORD THAT AS A MAJOR DEFECT.
    - >-
      THE FOUR GATES, INDEPENDENTLY ASSESSED, IF ANY COST OR ASYMPTOTIC STATEMENT
      EXISTS: (1) genuine single-responsibility decomposition with the assembly carrying
      explicit per-attempt-cost x inverse-success-probability bookkeeping; (2) every
