      DISPATCHABLE specification -- NAMING ANY UNNUMBERED ASSUMPTION IS THE
      HIGHEST-VALUE DEFECT AVAILABLE HERE; (3) honest hidden-overhead, memory,
      time-memory-tradeoff and parallelization accounting with individually flagged
      optimistic assumptions and an affected-vs-safe scope statement; (4) recorded as
      satisfied by YOUR review together with the TASK-20260810-37042c red team and by
      NOTHING THE PRODUCER DID. NAME ANY UNMET GATE. DO NOT RECOMMEND PROMOTION.
    - >-
      PROVENANCE AUDIT PER ARTIFACT CLASS under the PART C COVERING-MANIFEST CLAUSE and
      the CLOSED CASE-INSENSITIVE CLASS VOCABULARY, with every asserted digest
      RECOMPUTED BY YOU. Confirm one designated covering manifest per task, complete
      coverage of every declared artifact, every other manifest present as an ENTRY, no
      invented fifth class, comment-block stanzas in SOURCE_CODE, and EITHER an in-text
      block OR a manifest pointer in each PROSE_REPORT, BOTH EQUALLY COMPLIANT.
    - >-
      C2 STAMP AUDIT of both producers, plus SUPERSESSION, IMMUTABILITY and STAND-DOWN
      audits; confirm neither producer quoted, extended or reasoned from the STRUCK
      section 5 cost table, and that any citation of Proposition 806-1 is at ONE
