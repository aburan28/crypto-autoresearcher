      in-scope candidate killed on an inflated constant -- PREMATURE CLOSURE IS
      SYMMETRIC WITH OVERCLAIMING and this campaign has already committed one instance
      of it (RT-8).
    - >-
      CHECK (b): RE-EXECUTE, DO NOT READ. Rebuild the GF(2^4) composition census from
      YOUR OWN arithmetic, taking no code and no constants from the producer, for
      n = 1..5 under BOTH models, and report YOUR OWN numbers; independently recompute
