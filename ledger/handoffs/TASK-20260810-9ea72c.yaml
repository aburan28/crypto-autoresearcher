    census (TASK-20260810-a0e0ae) -- its capability probe, its leg A / leg B / leg C
    dispositions, its two composition models, and its pre-registered outcomes,
    RE-EXECUTED FROM YOUR OWN ARITHMETIC. ISSUE NO COMBINED VERDICT.
