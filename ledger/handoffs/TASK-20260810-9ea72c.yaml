      marked `on_record_not_charged` with its source named, and NO SPREAD RESOLVED
      SILENTLY -- D-811-3 arose from exactly this.
    - >-
      TWO SEPARATE VERDICTS IN TWO PHYSICALLY SEPARATE FILES, carried side by side in
      validation_report.yaml WITH NO COMBINED VERDICT. Issue no overall grade.
    - >-
      CHECK (a): WORK THE MATHEMATICS, DO NOT READ IT. Work every lemma and the
      assembly from YOUR OWN arithmetic and state whether any stated proposition
      FOLLOWS, is OVERSTATED, or DOES NOT FOLLOW. ATTACK THE TYPE-STABILITY CLAIM
