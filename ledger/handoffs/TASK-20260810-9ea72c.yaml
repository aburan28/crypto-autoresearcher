    - >-
      Every literature statement is UNVERIFIED-FROM-MEMORY and marked at the point of
      use. DO NOT REPAIR, EDIT, EXTEND OR RE-RUN producer artifacts to make them pass --
      defects are reported, not fixed. CHANGE NO OFFICIAL STATE: no hypothesis status,
