handoff:
  id: TASK-20260907-b58c5b
  from: coordinator
  to: validator
  objective: >-
    Independently validate the EXP-ECDLP-a98ea9 Stage 0-1 run package
    on joints artifact_binding, raw_rate_recompute, provenance_ast, and
    null2_width_zero_not_sold_as_evidence.
  uncertainty_reduced: >-
    Whether the Stage 0-1 receipts are admissible and whether the two
    blocking gates hold on the committed artifacts.
  inputs:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-fcfba9/review_plan.yaml
    - experiments/EXP-ECDLP-a98ea9/specification.yaml
    - experiments/EXP-ECDLP-a98ea9/execution-report.yaml
    - experiments/EXP-ECDLP-a98ea9/runs/RUN-ECDLP-a98ea9-S0/
    - experiments/EXP-ECDLP-a98ea9/runs/RUN-ECDLP-a98ea9-S1/
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-9a5be4/archives/TASK-20260907-a9e3d8/snapshot-receipt.json
    - agents/validator.md
  constraints:
    - Own only the four assigned joints. Do not verdict the whole claim.
    - Do not read TASK-20260907-15dab7 artifacts.
    - Do not change hypothesis or experiment status.
    - Do not interpret ADV or D2.
    - Certificate kind must remain none.
  deliverables:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-fcfba9/reviews/TASK-20260907-b58c5b/validation-report.yaml
  artifact_paths:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-fcfba9/reviews/TASK-20260907-b58c5b/validation-report.yaml
  archived_by: TASK-20260907-157483
  inference:
    policy: review-adversarial
    requested_policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 1800
    memory_gb: 4
    maximum_runs: 1
    experiment_maximum_runs: 0
  completion_gate:
    - review_attestation present with joints_owned and verdict holds|breaks|inconclusive
    - Each assigned joint has a holds/breaks/inconclusive result
    - sources_read is complete
    - read_sibling_reports is false
  review_plan_ref: coordination/goals/GOAL-ECDLP-001/batches/BATCH-fcfba9/review_plan.yaml
  review_plan:
    opened_by: TASK-20260907-b58c5b
    batch_id: BATCH-fcfba9
    recorded_at: '2026-09-07'
    recorded_before_reviewers: true
    claim_under_review: >-
      Producer statement (execution-report.yaml, RUN-ECDLP-a98ea9-S1):
      static provenance passed; six instances times 10000 sampled k;
      digit-for-digit agreement rate exactly 1 at r in {1,2,3,4};
      NULL-2 agrees at r=1 and differs at r in {2,3,4}; [n] of the
      constructed lift is infinity and the lift reduces to the F_p point.
      Certificate kind none. No ADV claimed.
    coordinator_prior: >-
      Written before the reviewers of this round run, after the same
      session produced the Stage 0-1 package. The Coordinator expects
      the validator joints to hold. PROCEDURE DEVIATION PD-R1: this
      prior is contaminated by the producer session.
    procedure_deviations:
      - id: PD-R1
        description: Coordinator session produced the run and the prior.
      - id: PD-R2
        description: Branch commit messages contaminate blind history.
    joints:
      - joint: artifact_binding
        assigned_to: TASK-20260907-b58c5b
        attack_plan: >-
          Confirm required artifacts exist, snapshot hashes match,
          manifests bind EXP-ECDLP-a98ea9 / H-ECDLP-07c7c6 /
          TASK-20260907-cd0cf9, seeds [3,5,7,11,13,17,19,23],
          certificate.kind none, authorized stages [0,1] only.
        breaking_artifact: missing file, hash mismatch, wrong seeds, or certificate not none
      - joint: raw_rate_recompute
        assigned_to: TASK-20260907-b58c5b
        attack_plan: >-
          Recompute agree/compared per (instance, r) from
          raw-result.json. Holds only if every compared is 10000 and
          agree equals compared.
        breaking_artifact: any cell with compared != 10000 or agree != compared
      - joint: provenance_ast
        assigned_to: TASK-20260907-b58c5b
        attack_plan: >-
          Re-run static_provenance.py on committed kfree_transport.py.
        breaking_artifact: AST failure or forbidden scalar parameter
      - joint: null2_width_zero_not_sold_as_evidence
        assigned_to: TASK-20260907-b58c5b
        attack_plan: >-
          Confirm r=1 NULL-2 is labeled width-zero. Confirm the lift
          refuses gcd(n,p)!=1.
        breaking_artifact: r=1 sold as discriminating, or a lift on an anomalous input
    blindness:
      mutual: true
      lifted_for: []
      rationale: null
    proves_too_much:
      objects:
        - The r=1 NULL-2 versus treatment identity (forced).
        - An anomalous curve where the order-n lift does not exist.
      failure_signature: >-
        Citing r=1 NULL-2 agreement as support for a digit-family claim,
        or returning a lift when gcd(n,p)!=1.
      assigned_to: TASK-20260907-b58c5b
    blind_rederivation:
      required: true
      quantity: >-
        Ordinary-base-p-digit agreement of affine x between [k] of the
        canonical order-n lift of S and the canonical order-n lift of
        [k]S at r=4.
      parameters:
        seeds: [3, 5, 7, 11, 13, 17, 19, 23]
        min_samples_per_instance: 50
        precision: 4
      blind_from:
        - experiments/EXP-ECDLP-a98ea9/implementation/
        - experiments/EXP-ECDLP-a98ea9/execution-report.yaml
        - experiments/EXP-ECDLP-a98ea9/runs/RUN-ECDLP-a98ea9-S1/
        - experiments/EXP-ECDLP-a98ea9/runs/RUN-ECDLP-a98ea9-S0/raw-result.json
        - experiments/EXP-ECDLP-c373eb/implementation/
      assigned_to: TASK-20260907-15dab7
