  review_plan:
    round: claim-changing review of EXP-PFDR-011cd0 under protocol v6 (whole run set; R12-R16 new, R01-R11 archived and ruled valid earlier)
    reviewers: [TASK-20261002-0114ff (validator), TASK-20261002-87ffc4 (red-team)]
    tier: review-adversarial (xhigh) for both reviewers; basis DEC-20261002-1ebedd tier_determination (TW-ALIVE did not fire); review-breakthrough at max is the route for any O-CANDIDATE a reviewer finds and for any later closure proposal
