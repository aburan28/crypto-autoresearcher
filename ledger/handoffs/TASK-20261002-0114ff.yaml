    - id: RV-5
      text: >-
        AN INSTRUMENT OR PACKAGE DEFECT IS NOT A MATHEMATICAL RESULT. A break
        in J1, J5 or J7 is a statement about the run set or the code, never
        evidence for or against any hypothesis. A timeout, crash or memory stop
