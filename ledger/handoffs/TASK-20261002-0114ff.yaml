      As the producer's outputs state it (execution-report-236691.yaml and
      runs/RUN-PFDR-011cd0-analysis/analysis.json, read with the earlier
      execution reports): the EXP-PFDR-011cd0 run set under protocol v6 is
      complete and completed_valid. R01-R11 as archived earlier; R12 (table
      panel, 77020 instances), R13 (search panel, 6226), R14 (264), R15
      (calibration) and R16 (unmask) completed_valid; R17 and R18 not
      triggered. Every invalidating gate passed (G1', G2', G3', G-FIX, P0X
      earlier; G4-G7 in process; G4-D, G4-R, G-TAB, G-SRCH, G-CURVE, G-REL);
      PC-NULL, PC-1 and PC-R pass. R16's outcome ids are O-NULL-BOUNDED and
      O-HEUR: no FAM-1 cell has z > t* and CARRY-1 has z <= t_carry; per FAM-1
      cell, kappa_rel, its calibrated 95% upper bound and its achieved X_rel
      are as R16's analysis.json states; the O-HEUR readings of H1a, H1b,
      H1c, H3, H4 and H5 are as heuristics.json states. Scope as frozen: toy
      scale, 20..32 bits (FAM-1 at 30-32 pooled), generated prime-order
      curves with fresh seeds c >= 10, one mitm engine at default arity and
      min_fill, m = 3, 4, 5, the declared arms. The SS m = 4 predicted power
      rests on TA-1 (assumed, not verified by P0).
    coordinator_prior:
      exposure_disclosure: >-
        Written before any reviewer runs, after this Coordinator read (for the
        validity decision DEC-20261002-1ebedd): execution-report-236691.yaml
        in full (outcome ids, gate and control booleans and counts, the A-TAIL
        cell labels, the CC-6 lists, G-SRCH's prefix-compared count); and R16
        analysis.json lines 1-22 and 190-231, which carry t*, t_carry, the
        FAM-1 exceedance and deficit lists, the family maximum z with its
        calibrated p, four FAM-1 band calibrated p values, the CARRY_1 block
        and the PC_NULL, PC_1 and PC_R blocks. NOT read: heuristics.json,
        cells.jsonl, calibration.json (except its design hash), the rest of
        analysis.json (A_INT, A2R, A_TAIL, the per-rung p values), design.json,
        power.json, and every row file. So this prior is informed about the
        outcome and the control verdicts, and uninformed about X_rel, the
        heuristic readings and every count.
