      blind_from_note: >-
        Paths are relative to the object under review. The rows the re-deriver
        may read before the seal are the raw harvest rows, bases files and
        (through the sealed whitelist) the census rows; every summary,
        recount, verification and analysis output derived from them, and every
        implementation of a relation count (the producer's and the earlier
        EXP-PFDR-1b78f7 reviewers'), is above. After the seal, J1, J5 and J7
        require reading these paths (PD-2).
      assigned_to: TASK-20261002-0114ff
    tripwire_routing:
      TW-ALIVE: >-
        Did not fire on the producer's outputs (DEC-20261002-1ebedd). If a
        reviewer's recomputation under the frozen text gives O-CANDIDATE, the
        report says so with no interpretation; the composition records it as
        input only, no reading or status change follows, and the Coordinator
        opens a review-breakthrough (max) round and the R17 question as a
        separate act, ids minted then.
      TW-FLOOR-INDEPENDENCE: >-
        No reviewer computes, prints, writes or reads a floor ratio or any A7
        quantity. If an attack seems to need one, the need is reported and the
        attack is declared blocked on that point.
      TW-SCOPE: >-
        Binding on both reports. No deployed-curve implication, universal
        impossibility, exponent below rho's or floor-relative reading.
    procedure_deviations:
      - id: PD-1
        text: >-
          The Coordinator's prior was written after it read the parts of R16's
          outputs listed in coordinator_prior.exposure_disclosure (outcome ids,
          t*, t_carry, the family maximum and its calibrated p, four band p
          values, the CARRY_1 block, the control blocks) and the execution report
          in full. Recorded so that concurrence is weighed accordingly.
      - id: PD-2
        text: >-
          The blind re-deriver (TASK-20261002-0114ff) also owns J1, J5 and J7,
          whose attacks require reading blind_from paths after the seal. This is
          a declared property of the plan (RV-2), not a leak. The independence
          checker is order-blind, so its expected output is exactly one
          problem: the line reporting that re-deriver TASK-20261002-0114ff read
          blind_from paths. Any other problem is a finding for composition.
          Custody: TASK-20261002-fa1154 checks that sealed-section.yaml still
          hashes to the digest logged at seal time.
      - id: PD-3
        text: >-
          The re-derivation is blind to the producer's values and
          implementation, not to labels. This card discloses the outcome ids
          and that no FAM-1 cell exceeded t* and CARRY-1 did not exceed t_carry;
          the design.json the re-deriver must read discloses the final n. No
          census value is disclosed.
      - id: PD-4
        text: >-
          Bounded recomputations (RV-6) are scoped in a round that otherwise runs
          no experiment: two R10 census-job re-executions with full retention,
          three attempt re-finalizations, five write_raw re-runs, harness
          controls, the P0 design-path re-derivation and one test run. They are
          chosen by rule now, carry no RUN id, and are never evidence about any
          base; a memory or time stop is blocked, not a finding.
      - id: PD-5
        text: >-
          Two reviewers own eight joints. The red team owns both the lemma check
          (J2) and the calibration (J4) that uses the lemmas' first moment;
          their independence from each other is within one session, which is
          declared. TASK-20261002-2d9fb9 was available as a third reviewer and
          is not used (DEC-20261002-1ebedd rationale).
    composition: >-
      The Coordinator composes J1-J8 and the proves-too-much control itself,
      joint by joint, after TASK-20261002-fa1154 verifies. Before treating the
      round as complete it reads the archived output of `python3
      tools/check_review_independence.py --plan
      ledger/handoffs/TASK-20261002-0114ff.yaml --reports
      coordination/review/pfdr-011cd0-20261002/reviews/TASK-20261002-0114ff/attestation.yaml
      coordination/review/pfdr-011cd0-20261002/reviews/TASK-20261002-87ffc4/attestation.yaml`
      and records every departure from this plan. It compares the result with
      the prior above and applies the tripwire routing. Ceilings fixed now:
      toy scale and one engine; H-PFDR-2765d2 can reach analyzed on this
      experiment, never supported (four promotion gates); the strongest
      structural transition is weaken of the structural branch for the cells
      whose achieved X_rel meets target, with an independent replication
      scheduled; a single-run, empirical-only census supports no
      reject_scoped. Every heuristic refutation carries its refutation artifact
      archived before the decision. If J2 finds L1 correct, the composing
      decision records whether EV-PFDR-1faf10's refutation of HEUR-4765e4-H1
      and HEUR-0cc7e8-H1 as stated may cite L1 at derivation tier
      (DEC-20261001-56f873 NA-8), by a new record. A KN-TECH entry is
      considered for the P-FA pattern and for CD-12.
