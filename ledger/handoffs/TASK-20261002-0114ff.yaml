        PD-71B610-2). Never read, signal or touch another session's processes
        or files.
    - id: RV-8
      text: >-
        LARGE OUTPUTS. Files over 50 MB (re-executed job rows, re-finalized
        attempt copies) go to your own scratch directory scratchpad/rv-0114ff/
        and are recorded in your report by path and sha256 only. Everything
        the report rests on that is under 50 MB goes under your write scope.
    - id: RV-9
      text: >-
        CITE WITH PROVENANCE. A file you opened is internal. A source you
        recall but did not open is recalled, a pointer, never support. Query
        the knowledge index (search_knowledge) before calling a fact known,
