    - id: RV-7
      text: >-
        MACHINE PROTECTION. One heavy computation process at a time, nice 19,
        OMP_NUM_THREADS, OPENBLAS_NUM_THREADS and MKL_NUM_THREADS set to 1;
        resident memory under 3.0e9 bytes per process (poll VmRSS and stop
