    - id: RV-6
      text: >-
        ZERO RUNS, WITH BOUNDED RECOMPUTATIONS. No run of the experiment and no
        RUN id. Permitted, each declared command by command with its seed and
        written into recompute/ or scratch: (a) J5: re-execute the two R10
