    - >-
      Q2 -- PC-NULL-R CRITERION (ii), PRE-DATA, ON SYNTHETIC DRAWS ONLY. Use
      the frozen definitions only: analysis.PC-NULL-R_rule, the CC-8 scoring
      of the null pseudo-cells as the specification states it, the pooled z,
      and the simulated joint law.
      (a) Show algebraically whether the four null pseudo-cells' numerators
          sum to zero for every curve, and what the mean of the four pooled
          null z therefore depends on.
      (b) Simulate at the specification's declared n and at each multiplier
          of the P0 RULE ladder the specification states. Use synthetic
          per-curve Poisson or negative-binomial counts with means in a range
          you justify from the specification's own planning figures. Report
          the probability that (ii) fails:
          - under the null;
          - under D1, one of the four null arms with a multiplicative excess
            kappa of 1.10 and of 1.15 on every curve;
          - under D2, an over-dispersed null (index of dispersion 1.3) in
            one arm only;
          - under D3, a common-mode excess on all four null arms.
          Do the same for criterion (i).
      (c) Give a verdict on (ii): informative, weak or degenerate, with the
          numbers.
      (d) List the minimal pre-data options in the specification's own terms:
          keep as is; report-only; or a replacement criterion stated
          exactly. Give each option's consequence for O-A-UNCAL. Do not
          recommend one on any ground other than (a) to (c).
      Scripts, seeds and outputs go under attacks/ in your review directory.
      Each script uses only synthetic draws and reads no data file. These
      are not runs of any experiment.
