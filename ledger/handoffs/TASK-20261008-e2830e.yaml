      (d) Name any key the text leaves undecided.
    - >-
      Q1 -- PDI-1 TO PDI-10. For each, record:
      - a verdict, exactly one of: follows_from_text,
        admissible_reading_of_open_detail, departs_from_text,
        cannot_decide;
