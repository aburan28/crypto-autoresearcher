    - coordination/design/TASK-20260928-102217/archives/TASK-20261002-07fdcb/snapshot-receipt.json (the stopped package; every path must be unchanged)
    - coordination/design/TASK-20260928-102217/archives/TASK-20261002-d2a99c/ledger-receipt.json
