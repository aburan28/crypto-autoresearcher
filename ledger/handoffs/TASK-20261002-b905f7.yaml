  constraints:
    - >-
      Run only after TASK-20261002-7cf711 has returned (any status) and its
      session has ended (no live writer). No other archival task is running
      in this worktree.
    - >-
      git fetch and merge origin/main into
      claude/point-decomposition-index-calculus-1rfntm first (merge, never
      rebase). Record the base commit checked and the merge outcome. A
      conflict inside a run artifact or record is a stop, resolved only by a
      superseding record, never by picking a side.
    - >-
      PRE-STAGING CHECKS, WITHOUT EDITING.
      (a) Every path of the TASK-20261002-1a4023, TASK-20261002-07fdcb,
      TASK-20261002-d2a99c and TASK-20261001-cb35e7 receipts still has its
      path_sha256. Every path of the TASK-20261001-b64be7 receipt still has
      its path_sha256. That includes the whole first package (in
      particular the archived analyze_relcensus.py at 96d3b2df...) and the
      whole stopped package (in particular amd-280481/analyze_relcensus.py
      at e80f6d6c... and the two -amd280481.yaml records).
      (b) Every EXP-PFDR-1b78f7 and EXP-PFDR-7c8bf2 path of the f15632,
      599b4b, 0f66ef and d9bf1b receipts still matches, except exactly these
      KNOWN conditions, which are recorded and are not a stop. (i) The two
      manifest paths of CORR-20261001-6cc5cd (599b4b). (ii)
      experiments/EXP-PFDR-1b78f7/analyze_census.py against its
      TASK-20260928-f15632 path_sha256 only; it must equal its
      TASK-20260929-599b4b path_sha256 (c40ea02f...;
      DEC-20261002-1efb1f OR-6). Any other mismatch is a STOP.
      (c) Every engine_files_unchanged_byte_for_byte file of the
      specification is byte-equal to its a32e70808 bytes. The four modified
      engine files and both new test files equal their b64be7 path_sha256.
      The working-tree changes are exactly paths inside
      TASK-20261002-7cf711's write_scope. Any __pycache__ directory found
      (for example under amd-280481/) is recorded as a scope_finding, is
      not staged and is not deleted by this task; the Coordinator rules on
      it.
      (d) Every new attempt, job, canonical location and run directory has a
      checksums.sha256 that matches its files.
      (e) PINS, BY STOP POINT. In every branch, amd-280481/analyze_relcensus.py
      has sha256 e80f6d6caceb6ff0de9982e945f66016c1b401ee393741111fe88c0b64d709b7
      (unchanged from the 07fdcb receipt). The expected state of
      implementation-notes-c7ccde.yaml then depends on where the task
      stopped:
      - STOPPED BEFORE THE PIN (in step (a) or (b) of 7cf711's ORDER):
        pins.a3_copy is null or absent, no runs/ directory of this task
        exists, and the stop is recorded in execution-report-c7ccde.yaml.
        This is the expected state, not a finding.
      - PINNED: pins.a3_copy.sha256 equals e80f6d6c... and has a timestamp
        earlier than the started_at of R11 attempt-3's manifest, where that
        manifest exists.
      - design.json and calibration.json, where produced, equal their pins
        in implementation-notes-c7ccde.yaml. A produced design.json without
        a pin is expected only if the task stopped between writing it and
        pinning it, and the execution report must say so; otherwise it is a
        STOP.
      - The amd-c7ccde/ files that the task's B-3 step reached exist.
      Record which branch applied. Judging the code is not this task's job.
      (f) Every new manifest whose result.certificate.kind is discrete_log
      has verified equal to the boolean true, with instances_claimed and
      instances_verified.
      (g) Run tools/validate_ledger.py and check_merge_hygiene.py on the
      merged head and record the output. Any error naming a path this task
      would stage is a STOP.
      (h) LARGE FILES. No staged file exceeds 95 MB. Record the total staged
      size. If experiments/EXP-PFDR-011cd0/ exceeds 1.5 GB, STOP and report.
      Any other mismatch or failure in (a)-(h) is a scope_finding and a STOP.
      It goes to a Coordinator decision. It is never fixed by editing an
      artifact, and the archive never proceeds past a STOP on its own reading
      (DEC-20261002-1efb1f PD-2).
    - >-
      Stage ONLY paths inside TASK-20261002-7cf711's artifact_paths that
      exist, plus this card's receipt. A conditional path that does not
      exist is recorded as absent, not as a finding. A file written outside
      scope is not staged; it is listed in scope_findings and reported. No
      __pycache__, .pyc or scratch file is staged; that includes the R15/R16
      view and the rebuilt fixtures. No file of the TASK-20261001-b64be7 or
      TASK-20261002-07fdcb package is re-staged. This card itself was
      committed by TASK-20261002-1a4023 and is not re-staged.
    - >-
      One commit. Its message names TASK-20261002-b905f7,
      TASK-20261002-7cf711, DEC-20261002-88c731, AMD-20261002-c7ccde,
      DEC-20261002-1efb1f, AMD-20261002-280481, DEC-20261001-56f873,
      EXP-PFDR-011cd0, H-PFDR-2765d2 and every RUN id staged. It carries no
      measured value, outcome id or verdict. Then write and verify the
      post-commit receipt with tools/research_dispatch.py
      (content_at_commit: path_sha256 for every staged path), push, and
      refresh the open PR for this branch (or open one against main) naming
      the same ids. The package is not durable until the verifier accepts
      it.
    - >-
      Archive as produced. A failed, partial, checkpointed, stopped or
      invalid run set is archived with its status. It is not evidence and not
      negative evidence (AGENTS.md core rule 5).
    - Never drop, split or recompress an artifact to fit a size limit.
    - No hypothesis, experiment, evidence or goal status changes in this task.
    - Never select a provider, backend, endpoint or model identifier containing Bedrock.
