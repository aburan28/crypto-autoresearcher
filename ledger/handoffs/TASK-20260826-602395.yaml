    - >-
      coordination/goals/GOAL-MLKEM-005/batches/BATCH-0d5018/tasks/TASK-20260815-f14d3c/environment.json
      -- the committed shape precedent for D4's environment record.
    - >-
      knowledge/techniques/KN-TECH-14efa5.md and KN-TECH-797223.md -- how fpylll was
      obtained in this container and the recipe's container dependence.
    - >-
      knowledge/findings/KN-FIND-f54a82.md -- an isolated-step probe is not evidence
      about the full tour it stands in for. It binds how the tiny acceptance cell may
      be described.
  constraints:
    - >-
      ZERO LATTICE COMPUTE AT SCALE. DO NOT RUN ANY d=512 REDUCTION, AT ANY
      PRECISION, UNDER ANY LABEL. DO NOT RE-ATTEMPT THE mpfr_bits=100 CELL --
      DEC-20260824-5e222e REFUSES IT UNTIL THIS INSTRUMENT EXISTS, AND THAT REFUSAL
      IS THE AUTHORITY YOU ARE WORKING UNDER. DO NOT RE-ATTEMPT THE 75-BIT CELL AS A
      RESEARCH MEASUREMENT.
    - >-
      DO NOT EDIT THE PINNED PREDECESSOR.
      coordination/goals/GOAL-MLKEM-005/batches/BATCH-f9780d/tasks/TASK-20260824-b3e9da/rt_ctrl_1_matched_pair.py
      is IMMUTABLE and is bound by a completed archive receipt; editing it would
      break that archive permanently. The successor is a NEW file in your own task
      directory.
    - >-
      PRESERVE EVERY ARTIFACT OF EVERY EXECUTION, INCLUDING AN INFRASTRUCTURE-KILLED
      ONE, UNDER A `failed_infrastructure` LABEL. Do not direct their deletion.
      (DEC-20260815-3e8e9c condition (v), VERBATIM. It binds your
      deliberately-killed surrogate too.)
    - >-
      PROVE THE FIX FIRES, DO NOT ASSERT THAT THE CODE CONTAINS IT. Every acceptance
      test must OBSERVE the repaired behaviour in an artifact. A test that reads the
      source and concludes the fix is present is not an acceptance test.
    - >-
      A FAIL IS A LEGITIMATE, REPORTABLE OUTCOME AND IS REPORTED AS ONE. So is
      NOT_REACHED, with what was tried. DO NOT RETUNE A TEST UNTIL IT PASSES, do not
      weaken an assertion after seeing it fail, and do not move a threshold to make a
      board green.
    - >-
      AGENTS.md RULE 3. A timeout, crash, container failure or missing dependency
      inside an acceptance test is INFRASTRUCTURE SIGNAL and is NEVER evidence that a
      fix is impossible or that a mathematical claim is false. Report it verbatim and
      stop; do not retune.
    - >-
      NEVER FABRICATE a command, an output, a timing, a statistic, a citation or a
      run. Missing data stays missing and is reported as missing.
    - >-
      WRITE EVERY DECLARED ARTIFACT EVEN WHEN ITS TEST DOES NOT RUN, carrying status
      NOT_REACHED and the reason, rather than leaving it absent. An absent declared
      file makes the snapshot archive unsatisfiable.
    - >-
      ROUTE THE ACCEPTANCE TESTS THROUGH THE V2 INSTRUMENT'S OWN CODE PATHS, never
      through a re-implementation of the mechanism under test. A test that exercises
      a copy of the stub/handler/flush proves nothing about the stub/handler/flush.
    - >-
      FOR D5, STATE THE DEFINITION USED AND WHY IT IS THE NUMBER OF TOURS. If
      bkz.trace is unavailable in the installed fpylll 0.6.4, count tours in the
      driving loop and SAY SO EXPLICITLY IN THE RECORD -- do not silently substitute
      one quantity for another.
    - >-
      FOR D2, STATE THE SIGNAL-SAFETY MECHANISM AND ITS LIMITS HONESTLY. Claim no
      more safety than the mechanism supports, and say what happens if the signal
      arrives while the results file is mid-write or while the process is inside an
      fplll C call.
    - >-
      FOR D6, ASSERT THE CORRECTION IN CLOSED FORM. The written form is smaller than
      the correct one by q^(1/2 - 1/(2d)); reproduce the committed cross-checks --
      57.242 at (q=3329, d=512) and 54.8457 = 3329^(1/2 - 1/160) at d=80 -- rather
      than quoting them.
    - >-
      LABEL EVERY SURROGATE AS A SURROGATE. Say which kind you used (tiny lattice or
      sleep stub) and record surrogate true with its kind. NAME WHAT THE SURROGATE
      CANNOT SHOW rather than letting a green board imply it.
    - >-
      OBSERVATIONS ONLY. Do not interpret, do not move a hypothesis, do not write any
      ledger record, do not write or regenerate knowledge/INDEX.md, and NEVER COMMIT.
    - >-
      WRITE NOTHING OUTSIDE
      coordination/goals/GOAL-MLKEM-005/batches/BATCH-762807/tasks/TASK-20260826-602395.
    - >-
      NOTHING YOU WRITE MAY STATE OR IMPLY THAT THIS WORK SAYS ANYTHING ABOUT ML-KEM
      AT ANY FIPS 203 PARAMETER SET. Carry an explicit toy-scale / transfer statement.
    - >-
      USE THE DECLARED INTERPRETER. The system python has neither fpylll nor numpy;
      BATCH-f9780d's task card records the working interpreter and KN-TECH-14efa5
      records how it was obtained. Install nothing and create no venv without saying
      so.
  deliverables:
    - >-
      rt_ctrl_1_matched_pair_v2.py -- the successor instrument, a NEW file, repairing
