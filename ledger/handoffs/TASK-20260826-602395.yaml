  task_card: coordination/goals/GOAL-MLKEM-005/batches/BATCH-762807/tasks/TASK-20260826-602395/task_card.yaml
  objective: >-
    Build rt_ctrl_1_matched_pair_v2.py as a NEW file repairing the six named defects
    D1..D6 of the pinned RT-CTRL-1 runner, and prove EACH FIX FIRES with one cheap
    acceptance test per defect, writing a machine-readable acceptance_results.json
    mapping D1..D6 to PASS / FAIL / NOT_REACHED with the evidence path for each. ZERO
    LATTICE COMPUTE: no d=512 reduction of any kind, no mpfr_bits=100 cell, no
    re-measurement of the 75-bit cell. Observations only; no interpretation, no
    hypothesis movement, no ledger record, no commit.
  uncertainty_reduced: >-
    Whether DEC-20260815-3e8e9c's binding condition (i) is IMPLEMENTABLE AND
    OBSERVABLE at zero lattice cost -- specifically, whether a STARTED stub plus a
    signal-safe SIGTERM flush actually leave a usable record under a real kill,
    whether fpylll 0.6.4's bkz.trace yields a genuine integer tour count, whether
    .cpu_times() plus a load average plus a stdout_tail can be captured for a cell
    that never returns, and whether the corrected root-Hermite formula reproduces the
    q^(1/2 - 1/(2d)) distortion the committed reviews measured. It reduces NO
    uncertainty about ML-KEM, about lattice hardness, or about precision response at
    tour level.
  the_six_defects_in_one_line_each:
    D1: >-
      Results JSON written only AFTER worker_main_cell returns (line 112), so a
      SIGTERM'd cell leaves no record at all. FIX: a per-cell STARTED stub written
      and flushed BEFORE the cell runs.
    D2: >-
      No SIGTERM handler. FIX: a signal-safe SIGTERM and SIGINT handler flushing
      tours-so-far, elapsed time and status KILLED_PARTIAL, then exiting.
    D3: >-
      No per-tour progress, so a timeout teaches one bit instead of a tours-per-hour
      curve. FIX: per-tour progress to the results file and stdout, flushed each tour.
    D4: >-
      No machine-readable resource record. FIX: peak RSS and CPU time via
      .cpu_times() on the psutil handle, load average into environment.json, and
      stdout_tail retained for a timed-out cell.
    D5: >-
      `tours` read from a getattr on an attribute fpylll never assigns, so always
      None (line 75). FIX: the tour count from bkz.trace, with the definition stated;
      if unavailable, count in the driving loop and SAY SO.
    D6: >-
      root_hermite_factor computed as b0^(1/d)/q^(1/2) instead of (b0/q^(1/2))^(1/d)
      (line 78), smaller than the correct value by q^(1/2 - 1/(2d)). FIX: the correct
      formula, with a closed-form acceptance test.
  inputs:
    - >-
      coordination/goals/GOAL-MLKEM-005/batches/BATCH-f9780d/tasks/TASK-20260824-b3e9da/rt_ctrl_1_matched_pair.py
