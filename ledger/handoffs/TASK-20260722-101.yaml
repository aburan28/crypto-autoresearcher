handoff:
  id: TASK-20260722-101
  from: coordinator
  to: idea-generator
  objective: >-
    Produce one genuinely mechanism-new, falsifiable path to a fully charged
    prime-field ECDLP exponent below one half after screening the complete
    internal negative corpus and established generic lower bounds.
  uncertainty_reduced: >-
    Whether any unclosed non-generic representation supplies complete
    relations, source recovery, factor logs, and blind descent below rho.
  inputs:
    - GOAL-CRYPTO-001
    - RQ-CRYPTO-001
    - knowledge/INDEX.md
    - ledger/FINDING-PF-IC-001.md
    - focus/current_plan.json
  constraints:
    - Separate established facts, speculation, derivation, and proposed tests.
    - Do not rename backend substitutions as new mechanisms.
    - Include complete cost accounting and the cheapest decisive falsification gate.
    - Make no breakthrough claim and change no official state.
  deliverables:
    - candidate_report.yaml
    - mechanism_note.md
  artifact_paths:
    - coordination/goals/GOAL-CRYPTO-001/batches/BATCH-001/tasks/TASK-20260722-101/candidate_report.yaml
    - coordination/goals/GOAL-CRYPTO-001/batches/BATCH-001/tasks/TASK-20260722-101/mechanism_note.md
  archived_by: TASK-20260722-102
  inference:
    policy: research-sol-max
    fallback_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 1800
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
    - The candidate is explicitly deduplicated against the corpus.
    - The mechanism includes relation supply, source recovery, factor logs, descent, and a rho comparison.
    - One bounded next experiment or derivation can falsify its central claim.
