      text: >-
        AN INSTRUMENT DEFECT IS NOT A MATHEMATICAL RESULT. If J2, J3 or J5
        breaks, that is a statement about the measurement, never evidence for
        or against H-CERTBIN-e3ac93, C-P, E-DECAY or C-M (INV-10). A defect
        localised in src/crypto_autoresearcher/gf2/ is an engine defect,
        reported, never patched. Say so in terms.
    - id: RV-7
      text: >-
        ZERO TRIALS. Verification computations permitted: the J2 replays, the
        J3 constructions on at most 20 archived systems, the J5 checks and the
        J4 aggregation. They run under your write scope, get no RUN id and are
        declared command by command. You re-run no phase of the driver. Memory
        cap 3 GB.
    - id: RV-8
      text: >-
        CITE WITH PROVENANCE. A file you opened is `internal`. A source you
        recall but did not open is `recalled`, a pointer, never support.
    - id: RV-9
      text: >-
        DISCLOSED PRIOR (review-plan PD-R1). The Coordinator's review prior was
        written after it had read the run's results, so concurrence with it is
        weaker evidence than it looks. Attack the joints on their merits.
