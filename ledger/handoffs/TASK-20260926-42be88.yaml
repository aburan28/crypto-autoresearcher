      text: >-
        J2 AND J3 BEFORE J4. Write J2's and J3's sections and verdicts before
        you aggregate any metric, so that a recomputed verdict cannot steer
        how hard you audit the population and the closure. Record the order in
        the report.
    - id: RV-5
      text: >-
        REPORT ON J2, J3, J4 AND J5 ONLY. You cannot see J1 or J6-J14 by
        construction; a whole-claim verdict from you would be an opinion formed
        from a fraction of the evidence. The Coordinator composes the round.
