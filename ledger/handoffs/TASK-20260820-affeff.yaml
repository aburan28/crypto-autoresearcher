  - SC-6 Change no hypothesis, question, experiment or goal status; approve no experiment; promote no
    knowledge; edit no committed record. Report findings; the disposition is the Coordinator's.
  - SC-7 Halt at the declared wall_clock_seconds (450 s) and report the halt truthfully as infrastructure
    signal, naming the dropped work as scope rather than as an answer.
  - SC-8 Never select, configure, probe, contact or use Amazon Bedrock (AGENTS.md rule 16).
  - 'BLINDNESS per the review plan: single-reviewer round, no sibling reports; the blind rederivation
    reads only the BCP-2 sections the plan names (blind_from is enforced and attested).'
  - NEVER READ the quarantined payload. Synthetic objects only.
  - Any claim that BCP-2 still cannot host a blind calibration carries a NAMED OBSTRUCTION and an argument,
    not a tally (docs/inventor-protocol.md).
