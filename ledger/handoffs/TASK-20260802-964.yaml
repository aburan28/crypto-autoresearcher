handoff:
  id: TASK-20260802-964
  from: coordinator
  to: coordinator
  objective: >-
    Freeze a safe protocol for extending orchestration.adapter to verify a
    Codex CLI session's exact resolved model and accepted reasoning effort from
    runtime-persisted metadata, so RECON R3/R4 can later obtain compliant
    independent-review receipts.
  inputs:
    - codex-cli 0.144.6
    - probe thread 019fc3a3-5f11-7812-9570-e1b96ac49833
    - successful read-only output PROBE_OK
    - matching thread-local state row, session_meta, and turn_context
    - orchestration/adapter/cli.py
    - orchestration/adapter/manifest.py
    - orchestration/adapter/config.py
    - orchestration/providers.yaml
    - docs/inference-backends.md
  constraints:
    - This is harness tooling, not ECDLP evidence and not an inference amendment.
    - Create one new non-ephemeral read-only Codex exec thread and query only its exact thread.started ID.
    - Never enumerate or expose unrelated threads, prompts, credentials, tokens, environment dumps, or base instructions.
    - Require matching values from the thread row and thread-local rollout turn_context and fail closed on every mismatch.
    - Record session-scoped provenance only; do not mutate global model bindings or claim backend-wide verification.
    - Unit tests use fake executable output, temporary SQLite, and rollout fixtures only.
    - No reviewer may be dispatched until implementation is snapshot-committed and independently validated.
    - Do not implement code, merge, stage, commit, or alter research state in this task.
  deliverables:
    - Coordinator APPROVE or REVISE protocol with exact CLI and receipt contracts.
    - Fail-closed acceptance, privacy, failure, and downstream-use gates.
    - Coordinator task report.
  artifact_paths:
    - coordination/reconciliation/RECON-20260802-001/tasks/TASK-20260802-964/coordinator_protocol.yaml
    - coordination/reconciliation/RECON-20260802-001/tasks/TASK-20260802-964/task_report.md
    - coordination/reconciliation/RECON-20260802-001/runtime_probe_dispatch_queue.json
    - coordination/reconciliation/RECON-20260802-001/runtime_probe_dispatch_plan.json
    - coordination/reconciliation/RECON-20260802-001/runtime_probe_dispatch_plan.md
    - ledger/handoffs/TASK-20260802-964.yaml
  archived_by: TASK-20260802-965
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: high
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 1800
    memory_gb: 2
    maximum_runs: 0
  completion_gate:
    - Protocol is implementation-ready, fail-closed, privacy-scoped, and makes no research or global backend verification claim.
