    RUN-PFDR-cd03e2, analyze-final as RUN-PFDR-089edc), each validated by check.py. Record the primary metrics as
    observations.
  uncertainty_reduced: >-
    The pre-registered predictions P1, P-detect and P2 of H-PFDR-727bfc at the frozen toy scope: whether the x-label
    sets of rank-r log-GAP bases carry pair-sum coincidence counts different from a matched uniform random label set
    at bits 20, 24 and 28, r in {1,2,3}, n in {256, ..., 4096} (heuristic H1 of IDEA-20261017-078074). Toy curves only.
