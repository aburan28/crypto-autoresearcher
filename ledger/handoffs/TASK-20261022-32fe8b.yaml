  constraints:
  - id: EX-1
    text: >-
      Run only through tools/runbook.py (lint, run, verify, report, publish-paths, status) with a published live claim
      on lane BATCH-8d6d84; launch no command except the frozen argv.
  - id: EX-2
    text: >-
      Do not edit the specification, hypothesis, trial plan, runbook or any file under implementation/; protocol
      changes only as amendments under experiments/EXP-PFDR-bb0d26/amendments/.
  - id: EX-3
    text: >-
      A timeout, crash, memory kill, kernel failure or watchdog expiry is failed_infrastructure, never a metric value
      and never a refutation; a job recorded failed_infrastructure stays in the jobs file as written.
  - id: EX-4
    text: >-
      No interpretation; metrics are recorded. Do not overwrite a run directory once it exists, and do not run a sixth
      trial.
  - id: EX-5
    text: >-
      Run the trials strictly in dependency order; census-toy-rep with no flagged cell records an empty
      toy-rep-jobs.jsonl and is not skipped.
  - id: EX-6
    text: >-
      Toy scope only. Touch no standardized or deployed curve, no key, no target point and no logarithm; the real-curve
      extension of the idea is held for a user decision and is not part of this task.
  - id: EX-7
    text: >-
      The other lane of this goal (BATCH-286bd3) must not run a census concurrently: the census uses 4 worker
      processes, so start only when no census of the other lane is running (machine headroom, not a research budget).
