handoff:
  id: TASK-20260801-022
  from: coordinator
  to: coordinator
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-023
  objective: >-
    Commit the exact TASK-20260801-021 driver, implementation note, calibration run package
    and calibration results alone, with this receipt, and BIND THE DRIVER sha256 IN THE
    RECEIPT. This is the calibration snapshot that ATS-1 clause 5 and CTRL-EQD-DRIVER-HASH
    both refer to - the real arm at TASK-20260801-027 must execute a file with exactly this
    hash, and a code change between calibration and the real arm would otherwise be an
    undetected route to tuning.
  uncertainty_reduced: >-
    Whether the calibrated instrument, including the exact code that produced it, is
    immutable and reproducible before the reading rule is frozen against it.
  inputs:
  - TASK-20260801-021 artifacts
  constraints:
  - RUN ALONE. Stage exactly declared_commit_sets.TASK-20260801-022_snapshot - 13 paths.
  - >-
    The 13 include experiments/EXP-EQD-001/implementation/eqd001_driver.py and
    implementation.md, which command.txt and manifest.yaml point at. Staging fewer would
    attest a non-reproducible run package.
  - >-
    The receipt must record DRIVER_SHA256 for eqd001_driver.py as an explicitly named
    field, so that CTRL-EQD-DRIVER-HASH is checkable by the Validator from the receipt
    alone.
  - >-
    Do not stage ledger/goals/GOAL-ECDLP-001.yaml, ledger/hypotheses/H-EQD-001.yaml,
    experiments/EXP-EQD-001/specification.yaml, reading_rule.yaml, dispatch_queue.json, any
    EXP-DS-001 or EXP-SMTH-001 artifact, FAEST or XEDN.
  - >-
    Commit message must contain TASK-20260801-022, TASK-20260801-021, EXP-EQD-001,
    RUN-EQD-001-calib, GOAL-ECDLP-001, BATCH-023.
  - Do not push from this task.
  - >-
    State no interpretation and no disposition in the receipt, and do not record any
    threshold. This receipt archives an instrument measurement that is expressly
    non-evidential about every hypothesis.
  deliverables:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/archives/TASK-20260801-022/snapshot_commit_receipt.json
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/archives/TASK-20260801-022/snapshot_commit_receipt.json
  archived_by: TASK-20260801-022
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 900
    memory_gb: 1
    maximum_runs: 1
  completion_gate:
  - >-
    Post-commit verifier accepts exact declared paths, parent and hashes; DRIVER_SHA256
    recorded as a named field in the receipt; no interpretation and no threshold in the
    receipt.
