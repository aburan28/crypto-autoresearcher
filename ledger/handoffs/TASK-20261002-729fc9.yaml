      text: >-
        State in the contract text the simulation rule for kappa_hat < 1:
        either binomial thinning of the simulated count (the rule
        experiments/EXP-PFDR-011cd0/amd-280481/analyze_relcensus.py
        implements, described in words, because analyze_a.py is written from
