        coverage simulation (including its kappa = 1.00 point), in the |dev|
        fallback, and in every other clause of the draft that simulates a
        planted excess at kappa_hat or at kappa = 1.00 (for example any P0
        clause predicting U_A at kappa = 1); list each such clause in the map.
        State the label the bound carries when the rule applies.
    - id: CD-3.D-2
      text: >-
        Remove exact equality on floats from P0X-A (experiment.gates entry
        P0X-A), experiment.power_analysis.P0_rule step (2) and
        proof_search_map.baseline_embedding.reproduction_check. Either compare
        the integer-valued quantities 3 x C_R and 6 x sum_s2 after rounding to
        the nearest integer, or declare an absolute tolerance, before data.
        Read calibration.json PC_NULL.known_null_band_cells["known_null_sub|TT4|band"].C_R
        and .sum_s2 yourself and state the expected integers by hand as a
        planning approximation; DEC-20261002-d0594a's by-hand figures 3105 and
        6296 are inputs to confirm, not results. The design_stop clause that
        a P0X-A failure stops before RA-04 is carried unchanged.
    - id: CD-3.D-3
      text: >-
        Choose option (i) or option (ii) of D-3's required_fix and make the
        blinding sentence (experiment.stopping_rules entry 5), the fixed order
        (stopping_rules entry 0), runs RA-04 to RA-06, the gates G-REL,
        G7-OFFSET and PC-R-iii, and the invalidation rules I-A4 and I-A7
        mutually consistent. Under (i): RA-05 parses no structured-arm count
        (I-A7), and the RA-04 checks on structured and planted arms emit only
        per-instance PASS/FAIL and mismatch keys, never a count, total, kappa
        or z, to any log or file before RA-06 -- say what a mismatch key may
        and may not contain. Under (ii): move the structured-arm G-REL,
        G7-OFFSET and PC-R-iii checks to after the RA-05 pin and before the
        RA-06 statistic, and adjust I-A4 and I-A7.
