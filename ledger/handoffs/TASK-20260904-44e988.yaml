handoff:
  id: TASK-20260904-44e988
  from: coordinator
  to: [validator, red-team]
  created_at: '2026-09-04'
  experiment_id: EXP-MONO-815525
  hypothesis_id: H-MONO-5b6617
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001

  objective: >-
    Independent review of EXP-MONO-815525: a near-exhaustive census
    (688,300 g-irreducible base points, including two complete sweeps over
    all of F_101^3) of the m=4 symmetric-base Semaev quartic's Frobenius
    factorization pattern. Under a literal affine reading, 0.98%
    (6,762/688,300) of instances deviate from the predicted (linear,
    irreducible-cubic) pattern; every deviation traces to one root moving
    to the point at infinity, and under a projective reading (treating
    infinity as a legitimate rational fibre point) the prediction holds in
    ALL 688,300 instances. The Executor explicitly declined to adjudicate
    which reading is correct and flagged that the point-at-infinity
    identification was verified on the split-g locus (269 probes) but NOT
    independently re-verified via direct point arithmetic in the actual
    g-irreducible regime (which needs F_{p^3}/F_{p^6} arithmetic the
    Executor did not implement).

  review_plan:
    coordinator_prior: >-
      Recorded BEFORE either reviewer is dispatched. This Coordinator's own
      prior, held with moderate-to-high confidence: the projective reading
      is almost certainly the mathematically intended one -- a degree-4
      rational map to P^1 has exactly 4 preimages counted projectively, and
      "the quartic drops to degree 3 in one affine chart" is the ordinary,
      expected signature of one preimage sitting at infinity, not a
      genuine failure of the map to have 4 well-defined preimages. Under
      this reading, the original idea's own (C3)(c) prediction was simply
      underspecified (written for an affine chart without considering the
      point at infinity), not wrong, and the census result is a strong,
      near-exhaustive confirmation of full S_4 monodromy at m=4. This
      Coordinator holds this with real but not total confidence, because
      (a) it has not independently verified the point-at-infinity
      identification in the actual g-irreducible regime (the Executor's own
      disclosed gap), and (b) this session's own recent history (the
      HEUR-KUM-2 saga) showed that a confident-sounding resolution to a
      subtle algebraic-geometry question can still hide a real error that
      only independent review catches.
    claim_under_review: >-
      (a) Is the projective reading (point at infinity counted as a
      rational fibre point) the correct interpretation of "full S_4
      monodromy implies cycle type (1,3) whenever g is irreducible", such
      that the census result should be read as CONFIRMING the prediction
      in all 688,300 tested instances? (b) Independently of that
      adjudication, is the "degree drop = root at infinity" identification
      itself correct in the g-irreducible regime specifically (not merely
      on the split-g locus where it was checked)?
    joints:
      - joint: J1-PROJECTIVE-VS-AFFINE-ADJUDICATION
        assigned_to: validator
        attack_plan: >-
          Independently work out, from first principles (the structure of
          S_4 as a degree-4-in-T polynomial and what it means for its
          leading coefficient to vanish at a specific base point), whether
          the vanishing of c_4(e) at a base point genuinely corresponds to
          "one of the four projective preimages is the point at infinity"
          or whether it could instead signal something else (e.g. a
          genuine multiplicity collapse, a repeated root, or an artifact
          of the specific resultant-elimination construction used).
          Consult experiments/EXP-MONO-815525/implementation/derive_s4.py
          and derivation_checks.json for the actual construction, but
          derive your own answer to "what does c_4=0 mean" before treating
          the Executor's own framing as settled.
      - joint: J2-DIRECT-VERIFICATION-IN-THE-IRREDUCIBLE-G-REGIME
        assigned_to: validator
        attack_plan: >-
          Implement F_{p^3} arithmetic (a cubic extension of F_p via an
          irreducible defining polynomial) and, for at least 5 of the
          6,762 disclosed degree-drop instances in
          experiments/EXP-MONO-815525/runs/RUN-MONO-815525-1/raw-result.json,
          directly verify by ACTUAL POINT ARITHMETIC (lifting the three
          F_{p^3}-conjugate x-coordinates to points on E over an
          appropriate extension, computing the four signed sums P1+P2+P3
          for eps in {(+,+,+),(+,+,-),(+,-,+),(+,-,-)}) that exactly one
          of the four signed sums is the point at infinity O. This is the
          exact verification the Executor itself disclosed as NOT done --
          closing it, in either direction, is the single most valuable
          thing this review round can do.
      - joint: J3-ADVERSARIAL-CONSTRUCTION-AUDIT
        assigned_to: red-team
        attack_plan: >-
          Independently audit the S_4 derivation
          (implementation/derive_s4.py) for correctness, using a DIFFERENT
          method than the three the Executor already used (symbolic
          nested resultant, numeric via Frobenius powers, independent
          runtime resultant) -- e.g. direct brute-force verification on
          several small curves by explicitly enumerating all points and
          checking the polynomial vanishes exactly where predicted
          (similar to this session's own S_3 brute-force verification
          method used earlier for the D-5 check and H-MONO-93bc4d). Also
          adversarially probe: is 688,300 instances, concentrated on only
          5 curves and 4 primes (two of which are the SAME prime p=101 on
          different curves), actually a fair test of "monodromy is full
          S_4 for EVERY non-singular ordinary curve", or could the
          specific curves tested share some structural property that
          makes this a less general test than its raw sample size
          suggests?
      - joint: J4-INTERPRETATION-AND-SCOPE-CHECK
        assigned_to: red-team
        attack_plan: >-
          Regardless of the J1/J2 adjudication outcome, verify the
          record's own claim_boundary is honest: does a pass on this ONE
          diagnostic (however exhaustive) actually establish full S_4
          monodromy, or only rule out specific alternative subgroups that
          would have predicted a different g-irreducible pattern? Which
          proper subgroups of S_4 (if any) would ALSO predict cycle type
          (1,3) whenever g is irreducible, and are they ruled out by this
          diagnostic alone or only by the OTHER arms of
          IDEA-20260904-ad63fe's own full calibration ladder (which this
          experiment deliberately did not test)?
    blindness:
      lifted_for: null
      rationale: null
      declaration: >-
        Both reviewers are launched as fresh subagents with no prior
        context; each must independently state whether it read the
        other's output or any sibling review directory before forming its
        own conclusions.
    proves_too_much:
      objects:
        - >-
          J1's own reasoning about c_4=0, if it would ALSO conclude "this
          is just a point at infinity, nothing to see" for a genuinely
          different, real monodromy anomaly (e.g. an actual repeated
          root, a genuine degree-drop caused by two roots colliding rather
          than one going to infinity), is not actually discriminating and
          should be rejected. The reviewer must check that a repeated-root
          case (if one exists among the 6,762) is correctly distinguished
          from a root-at-infinity case.
      failure_signature: >-
        If J1/J2's method cannot distinguish "root moved to infinity" from
        "two roots collided (a genuine ramification/repeated-root event,
        which WOULD be real evidence against full S_4, since S_4 acting
        2-transitively on 4 points has no fixed nontrivial stabilizer
        pattern that produces a forced repeated root)", the joint has not
        actually been covered.

  budget:
    wall_clock_seconds: 3600
    memory_gb: 4
    maximum_runs: 0

  constraints:
    - Do not commit or push. Report only, in your own review directory under experiments/EXP-MONO-815525/reviews/{validator,red-team}/.
    - Do not read the sibling reviewer's directory before forming your own conclusions; disclose whether you did.
    - Do not change any research status, ledger record, or hypothesis field.

  completion_gate: >-
    Both validation-report.yaml and red-team-report.yaml filed, each
    addressing its owned joints explicitly, before the Coordinator
    composes the decision determining how EXP-MONO-815525's result bears
    on IDEA-20260904-ad63fe's own broader full-S4 claim.

  inference:
    requested_policy: review-adversarial
    reasoning_effort: xhigh
    runtime: claude_code
    resolved_model_id: claude-sonnet-5
    model_verified: true
    fallback_used: false
    degraded_requirements: []
