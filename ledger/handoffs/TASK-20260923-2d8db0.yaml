  objective: >-
    Attack, with the worked attacks of the review plan on
    TASK-20260923-cc166b, the four artifact-, certificate- and
    control-integrity joints of EXP-GFPN-726eb2 assigned to you, and return a
    per-joint verdict of holds | breaks | inconclusive with the artifact that
    supports it. You verify evidence; you do not decide what it means for
    H-GFPN-ee4d45 (agents/validator.md).

  uncertainty_reduced: >-
    Whether every numeric row of the EcGFp5 and EcMasFp5 audit stands on a
    certificate that independent code accepts; whether the one self-report
    mismatch is labelled as the frozen contract requires; whether the SCURVE
    control is a control of the instrument that scored the GFPN rows; and
    whether "rigidity reproduced" survives when every rejection must carry a
    witness.

  joints_owned:
    - label: J1
      joint: >-
        J1. ORDER AND TWIST CERTIFICATES: that for each curve the order
        #E = h*n is proved (n prime by an ECPP certificate re-verified by
        code independent of PARI; a point P != O with [n]P = O; for EcGFp5
        the rational 2-torsion argument giving 2 | #E and 4 does not divide
        #E; exactly one multiple of h*n in the Hasse interval), that the
        curve certified is the published curve (EcGFp5's short-Weierstrass
        model derived from y^2 = x(x^2 + 2x + 263z) over F_p[z]/(z^5 - 3);
        EcMasFp5 y^2 = x^3 + 3x + 8z^4), that the integer was regenerated
        by SEA before any comparison with the published value
        (regenerated_not_copied), and that the twist order N' = 2q + 2 - N,
        its complete factorization with primality proofs, and the twist
        security 0.5*log2(pi*l'/4) (101.9321 and 120.6583 bits) follow.
    - label: J2
      joint: >-
        J2. EMBEDDING DEGREE AND CM DISCRIMINANT, INCLUDING THE 322-VS-323
        OBSERVATION: that e = ord_n(q) is (n-1)/5 for EcGFp5 and n-1 for
        EcMasFp5, computed exactly from complete, proved factorizations of
        n-1; that D = t^2 - 4q with t = q + 1 - N has |D| of 322 bits for
        both curves, with the stated squarefree part, conductor (2 for
        EcGFp5, 1 for EcMasFp5) and fundamental discriminant; and that the
        EcMasFp5 cm_discriminant_bits row is correctly labelled PASS with
        matches_self_report false under the frozen contract.
    - label: J3
      joint: >-
        J3. THE SCURVE CONTROL AND DEVIATION D-1: that RUN-GFPN-17ed52 is
        the contract's blocking control scurve_control_curve ("One curve
        already carrying a SCURVE certificate package; re-run must match
        prior certificate bytes (or hash) before GFPN scoring"), that the
        producer's operationalisation (sha256 re-verification of the prior
        dossier plus value-for-value regeneration of 18 numeric entries by
        independent code) satisfies it without an amendment, that it ran
        before any GFPN scoring, and that it controls the instrument that
        scored the GFPN rows.
    - label: J4
      joint: >-
        J4. RIGIDITY RE-ENUMERATION: that the published parameter searches
        (EcGFp5: b = +/- c z^i, c = 1, 2, ..., i = 1..4, quadratic-residue
        pre-filter as published, acceptance #E = 2*prime; EcMasFp5:
        find_ec_over_gfp5, A from 0, c = 1..49, i = 1..4, acceptance prime
        order) were re-enumerated in the published order, that every one of
        the 2096 EcGFp5 and 619 EcMasFp5 predecessors was correctly
        rejected (1552 pre-filter + 445 early abort + 99 composite full
        count; 398 early abort + 221 composite full count), and that the
        first accepted candidate is the published curve in each case.
  joints_note: >-
    The joint statements above are verbatim from review_plan.joints of
    TASK-20260923-cc166b. Their attack plans and breaking artifacts are in
    that card and bind you as a floor, not a ceiling. You do not own J5, J6
    or the proves-too-much control; findings there go under "outside my
    joints" and are not coverage.

