    - id: RC-2
      text: >-
        CHANGE NO RECORD. Write only inside your write_scope. Do not edit any
        run package, implementation file, specification, hypothesis,
        decision, correction, receipt, card or knowledge entry, and do not
        write under experiments/. Do not mint any identifier.
    - id: RC-3
      text: >-
        SCRATCH COMPUTATION, BOUNDED. Recomputation is authorized only for J1
        (independent certificate re-verification) and J4 (rejection
        witnesses), at most budget.maximum_runs invocations, each recorded
        under scratch/ in your directory with its exact command, script,
        stdout and outputs. These are review checks, not experiment runs:
        they create no RUN-* record and are never cited as measurements of
        the curves.
    - id: RC-4
      text: >-
        INFRASTRUCTURE IS NOT EVIDENCE. If a check cannot be built or does not
        finish, the joint is inconclusive with the impediment named -- never
        breaks, never holds by default (AGENTS.md core rule 5).
    - id: RC-5
      text: >-
        PROVENANCE. Rely only on sources you read: frozen inputs, committed
        artifacts, KN-LIT entries. Anything remembered is marked recalled and
        carries no verdict (AGENTS.md core rule 9). Amazon Bedrock is
        prohibited.
    - id: RC-6
      text: >-
        MACHINE PROTECTION. At most 8 GB address space per process; PARI
        stack sized explicitly; no concurrent solver-heavy process from
        another reviewer.

