    - >-
      Verify the five originating commits: G1
      7d7ca64dfb6eadccc234bdbf3e3aeff0435d5898 (337 paths), G2
      fbd12d5b9284dd849ed1806b3d4d811809e089e0 (319), G3
      61004685f4750553a59bc4ee7a776cb5e69754f2 (13), G4
      fdf9aa1c942050d77ead194dbe3878cde054d17f (101), and
