      Record a mapping for every bound repository-relative path:
      lowercase SHA-256, size, originating full commit SHA, and
      the source commit tree's blob id. Preserve the four source
      status values and report bytes verbatim. Never edit these files.
    - >-
      Carry out the applicable Phase-B pre_commit_checks from
      TASK-20260925-0ed1be and record raw checker output, not a
      pass-only summary: Phase-A and earlier run hashes; isolated
