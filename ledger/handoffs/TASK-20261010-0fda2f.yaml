      solver-events presence; VA-7 ten-id byte sweep outside
      scanned trees; reserved-id accounting; RB-4 admission, SSF,
      callgrind, and gate readings. A failure is a custody finding.
    - >-
      Preserve G3's absent-comparator infrastructure classification
      and G4's post-failure sequencing deviation. Do not call G4 an
      admissible post-gate sample or G3 a mathematical negative.
    - >-
      The receipt's own commit changes only its declared new path.
      It names this task, CORR-20261010-db44b4,
      DEC-20261010-fb6792, TASK-20260925-480d02 and the four RUN
      ids. It explicitly labels the five producer commits as the
      content-owning commits and itself as the custody-receipt commit.
    - >-
      The packet-archived verifier at
      tools/verify_content_first_custody.py is the post-commit gate.
      Record its committed source SHA-256 in the receipt; run
      `python3 tools/verify_content_first_custody.py --receipt
      coordination/goals/GOAL-GFPN-380702/archives/TASK-20261010-0fda2f/content-first-receipt.json
      --head HEAD --json` after the receipt commit. Exit zero is
      required. Keep its full JSON and stderr in the task return.
    - >-
      If the verifier cannot establish exact path inventory,
      content equality, source-commit reachability, or a required
      receipt field, stop and report an integrity failure; no
      completion claim, R2b-r5 launch, review, or status change.
