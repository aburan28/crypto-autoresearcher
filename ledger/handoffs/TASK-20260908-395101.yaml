  constraints:
  - Coordinator control-plane definition work only. You are not alone; write only five new declared files and preserve
    all other files.
  - Use complete effective successor contracts with exact source/hash/precedence maps. All new contracts remain
    unapproved, execution_authorized:false and evidence_eligible:false pending archive and independent review.
  - Zero scientific executions. No fixtures, searches, null panels, bootstraps, controls or measurements. Up to40
    fixed arithmetic/static consistency cases including reruns,10seconds each,300seconds aggregate. Administrative
    parsing/source/hash checks are separate; record actual commands and counts.
  - Preserve scientific sample counts, controls and decision thresholds. Disclose every newly selected deterministic/statistical
    or scalar-wrapper convention before any data.
  - No fabricated source retrieval, model verification, novelty or scientific status. This is native parent Coordinator
    administrative/code-aware design work, not an independent review.
  accepted_corrections:
    EXP-ECDLP-184fc4:
    - id: FRESH-184-1
      correction_required: Freeze a canonical member identifier, stratum, statistic or named sharing group, draw
        and slot indices, unbiased digest-to-label mapping, counter rejection rule, and every intentional shared
        resample. Preserve the 10,000 count.
    EXP-ECDLP-1e6502:
    - id: FRESH-1E-1
      correction_required: Freeze ordinary and anomalous pair domains, canonical index tuples, digest rejection
        or cycling rules, duplicate/exhaustion behavior, and the intended SC1/SC2 sharing. Also name the exact non-anomalous
        bundle used by SC5's refusal control.
    EXP-ECDLP-2c3d20:
    - id: FRESH-2C-1
      correction_required: Freeze a complete statistic-key inventory with its one-sided direction, class/map scope,
        depth and partition identity, and state which keys may trigger the replicated candidate rule.
    - id: FRESH-2C-2
      correction_required: Either require positive finite scale for the standardized-effect threshold, or define
        a separately named zero-dispersion separation branch with its own candidate rule and interpretation. Do
        not call a null numeric effect an absolute standardized effect at least two.
    EXP-ECDLP-709063:
    - id: FRESH-709-1
      correction_required: Name each encoding domain separately and make the physical baby slot exactly <IIII> with
        state 2 for O. If <BII> is retained for artifacts, prohibit it from table storage and state its conversion
        and hash-only role explicitly.
    - id: FRESH-709-2
      correction_required: Either bind an additive rho implementation that actually uses the common routine, or
        declare and componentize the source's actual right-to-left calls while retaining group additions as the
        common cost unit. Any normalization must be explicit and must not be labeled measured source operations.
    - id: FRESH-709-3
      correction_required: Put the finalized manifest hash in a separate receipt or archive, or define a canonical
        payload digest that explicitly excludes the digest field. Every arm may then bind that external digest.
    - id: FRESH-709-4
      correction_required: Report NO_NONNEGATIVE_TESTED_RUNG_THROUGH_28 or NO_NEGATIVE_TESTED_RUNG_FROM_16, or state
        and justify the exact monotonicity/transfer assumption under which the endpoint labels become bounds.
