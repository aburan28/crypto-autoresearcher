handoff:
  id: TASK-20260810-dca469
  recorded_at: '2026-08-10'
  goal_id: GOAL-ENDO-001
  question_id: RQ-ICINV-475b5e
  batch_id: BATCH-de621d
  task_card: coordination/goals/GOAL-ENDO-001/batches/BATCH-de621d/task-cards/TASK-20260810-dca469.md
  role: coordinator
  from: coordinator
  to: coordinator
  objective: >-
    Author and freeze protocol_amendment v3 for EXP-ICINV-4d33aa, replacing the
    SR3 baseline-reproduction control's literal [1.3, 3.6] band membership with
    a statistical comparison against the reference run's own estimated sampling
    uncertainty. Freeze the full numeric specification BEFORE any execution, to
    the same discipline v2 was held to. Do NOT execute the experiment.
  pause_cleared_by: >-
    DEC-20260809-de11f9 paused this lane pending a GATE-DESIGN DECISION reserved
    explicitly to the user ("is a user decision, not dispatched automatically").
    On 2026-08-10 the user elected candidate (b) of that decision's N10-v3
    next_action: replace literal band membership with a statistical comparison
    against the reference run's own estimated sampling uncertainty, rather than
    a fixed hull. That election is the authority for resuming this lane and is
    recorded in DEC-20260810-6b4554. It clears the pause for gate design ONLY.
  uncertainty_reduced: >-
    Whether SR3 can be stated as a control that survives a fresh draw. Twice the
    gate has emitted INVALID: first because it compared measurements taken at
    different parameters (CORR-20260807-14431d, repaired by v2's A1), and then,
    with A1 working exactly as designed and Arm A0 reproducing the frozen grid
    at 13 of 13 rows with delta 0.0, because the correctly re-measured baseline
    ITSELF crosses below the band floor at its two lowest-density rows
    (fb = 4: 1.2315, fb = 5: 1.1125). The [1.3, 3.6] hull was fitted to one
    historical sample with under 2% floor margin, so it encodes that sample's
    noise rather than the estimator's.
  inputs:
    - experiments/EXP-ICINV-4d33aa/specification.yaml
    - experiments/EXP-ICINV-4d33aa/amendments/v2.yaml
    - DEC-20260809-de11f9 (the pause, and the three named candidates)
    - CORR-20260807-14431d (the v1 defect A1 repaired)
    - >-
      the v2 execution report and RUN-ICINV-f09176 / RUN-ICINV-c670c2 /
      RUN-ICINV-99f722 raw results, for the observed baseline rows only
  constraints:
    - >-
      SC-1 FABRICATE NOTHING. No invented timing, measurement, citation, review
      verdict, model identifier or commit SHA. This role has no Bash; state no
      command output as if it had been run. Any number you cite must be read
      from a committed artifact and attributed to it.
    - >-
      SC-2 FREEZE BEFORE EXECUTION. The amendment must specify the test
      statistic, the uncertainty estimator, the acceptance threshold and the
      per-row and aggregate decision rules NUMERICALLY and COMPLETELY, such that
      no free parameter remains to be chosen after seeing a result. An amendment
      that leaves a threshold to be picked later is not frozen and must not be
      filed.
    - >-
      SC-3 NAME THE POST-HOC RISK HONESTLY. This is the third gate design after
      two INVALID terminations, and redesigning a control after seeing which
      rows failed is a real threat to its evidential value. The amendment must
      state that risk in its own words and state precisely how this design
      mitigates it -- the mitigation being that the acceptance region is derived
      from the estimator's sampling distribution, which is fixed by n_targets
      and the row's own decomposition probability, and NOT from which rows
      happened to fail. If any element of the design is in fact chosen with
      reference to the observed failures, say so rather than presenting it as
      derived.
    - >-
      SC-4 THIS IS A CONTROL REDESIGN, NOT A RELAXATION OF THE HYPOTHESIS TEST.
      The lane's substantive question (H-ICINV-6c7920, the within-class
      over-dispersion and its cause) is untouched. Every downstream stopping
      rule, arm definition, null and operating-row tolerance not explicitly
      changed here stays frozen and must be listed as unchanged, as v2 did.
    - >-
      SC-5 A LOOSER GATE MUST NOT BUY A STRONGER CLAIM. State explicitly that
      passing the redesigned SR3 licenses no conclusion the prior gate would
      have denied, and that the amendment changes admissibility only.
    - >-
      SC-6 NEITHER PRIOR TERMINATION IS EVIDENCE. Both INVALID terminations are
      admissibility failures in the gate and bear on H-ICINV-6c7920 and
      EV-ENDO-10109d in NEITHER direction (DEC-20260809-de11f9). Do not record
      them as negative results.
    - >-
      SC-7 DO NOT EXECUTE and DO NOT DISPATCH EXECUTION. This task ends at a
      filed, frozen, approved amendment. Execution is a separate Executor task
      under a separate handoff.
    - >-
      SC-8 Toy scale throughout (p in {2003, 4001, 6007}), claim_tier toy,
      sota_delta zero. Assert nothing about ECDLP hardness in either direction.
    - >-
      SC-9 DO NOT COMMIT. Write files only; the dispatching session performs the
      archive commit and its post-commit verification.
  write_scope:
    - experiments/EXP-ICINV-4d33aa/amendments/v3.yaml
    - ledger/decisions/DEC-20260810-6b4554.yaml
    - coordination/goals/GOAL-ENDO-001/batches/BATCH-de621d/
  out_of_scope:
