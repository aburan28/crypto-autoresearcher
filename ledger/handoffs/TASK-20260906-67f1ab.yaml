handoff:
  id: TASK-20260906-67f1ab
  recorded_at: '2026-09-06'
  goal_id: GOAL-ECDLP-bbc21f
  question_id: RQ-ECDLP-78dbc5
  batch_id: BATCH-9c5410
  dispatch_queue: coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-9c5410/dispatch_queue.json
  task_card: coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-9c5410/tasks/TASK-20260906-67f1ab/task_card.yaml
  role: coordinator
  from: coordinator
  to: coordinator (approval authorship)
  objective: >-
    Author the approval artifacts for EXP-ECDLP-612fb1 and EXP-ECDLP-869870
    under the user's answer to the approval question of BATCH-9c5410, once
    the orchestrating session has recorded that answer -- and not before.
    BRANCH A, APPROVE (per contract the user names): the gate-field update of
    that contract's specification.yaml (status review_required -> approved;
    approved_by null -> coordinator; frozen false -> true;
    execution_authorized false -> true; approval_note superseded by an
    approval record citing DEC-20260906-2b1387 with the pre-approval
    'DESIGNED, NOT APPROVED' text preserved verbatim inside it -- every
    protocol field untouched, version stays 1), the executor handoff for that
    contract (TASK-20260906-3623b9 for EXP-ECDLP-612fb1; TASK-20260906-d17254
    for EXP-ECDLP-869870) carrying the contract's budget envelope verbatim.
    BRANCH B, DECLINE (per contract the user does not approve): no field of
    that specification changes and no executor handoff for it is written; a
    revision is a new versioned contract, never an edit of the frozen one. A
    partial answer ('Approve X only') applies branch A to X and branch B to
    the other. The decision record DEC-20260906-2b1387 (approve_experiment
    with the verbatim user_confirmation_record, or revise with the stated
    reason) is NOT written by this task: as in the precedent BATCH-832f3d
    (e02495 / 59fb55), the ledger archive TASK-20260906-2d30dd authors it,
    so that no artifact path has two owners. In every branch this task's
    approval-note.md records which branch was taken, the authorship, the
    diff scope, and that decision authorship sits with TASK-20260906-2d30dd.
    Executed inline by the Coordinator session under the declared fallback;
    disclosed in the ledger receipt.
  uncertainty_reduced: >-
    None (mechanical authorship under a recorded user answer); the task
    exists so the approval artifacts -- or the recorded decline -- are
    source-bound into the ledger archive and the gate is discharged on a
    committed record rather than in conversation.
  inputs:
  - >-
    experiments/EXP-ECDLP-612fb1/specification.yaml (frozen contract, version
    1; budget 3600 s/run, 12 CPU-h, 8 GB, 48 runs, 1 worker; approval_note
    'DESIGNED, NOT APPROVED' to be preserved verbatim)
  - >-
    experiments/EXP-ECDLP-869870/specification.yaml (frozen contract, version
    1; budget 3600 s/run, 16 CPU-h, 8 GB, 40 runs, 1 worker; approval_note
    'DESIGNED, NOT APPROVED' to be preserved verbatim)
  - >-
    ledger/hypotheses/H-ECDLP-37dc01.yaml and
    ledger/hypotheses/H-ECDLP-3550b8.yaml (status specified; unchanged by
    this task)
  - >-
    ledger/questions/RQ-ECDLP-78dbc5.yaml (decision target and constraints
    the executor handoffs restate)
  - >-
    the user's recorded answer to the BATCH-9c5410 approval question, relayed
    by the orchestrating session (not an in-repo path)
  - >-
    ledger/decisions/DEC-20260905-2d466e.yaml (the precedent approval
    decision whose shape DEC-20260906-2b1387 imitates)
  constraints:
  - >-
    GATE FIELDS ONLY. On approval of a contract, exactly five fields of its
    specification.yaml change: status, approved_by, approval_note, frozen,
    execution_authorized. frozen and execution_authorized are gate fields of
    THESE contracts' own schema -- invalidation rule 1 of each reads
    execution_authorized, so leaving it false would make every run
    non-evidence by the contract's own rule; the precedent contract
    EXP-ECRANK-76a70d did not carry them, which is why the precedent names
    three. Every protocol field byte-identical; version stays 1; any later
    protocol change is a versioned protocol_amendment under
    experiments/<EXP>/amendments/, never an edit.
  - >-
    The pre-approval approval_note text ('DESIGNED, NOT APPROVED ...') is
    preserved verbatim inside the new note.
  - >-
    Each executor handoff carries its contract's budget envelope VERBATIM --
    TASK-20260906-3623b9 / EXP-ECDLP-612fb1: wall_clock_seconds_per_run 3600,
    total_cpu_hours 12, maximum_memory_gb 8, maximum_runs 48, maximum_workers
    1, seeds 1-5 generic and 1-3 curve; TASK-20260906-d17254 /
    EXP-ECDLP-869870: wall_clock_seconds_per_run 3600, total_cpu_hours 16,
    maximum_memory_gb 8, maximum_runs 40, maximum_workers 1, seeds 1-5 exact
    and 1-3 at 2^30 and curve -- targets the executor under policy
    executor-implementation, carries review_required true with the dependent
    validator and red-team tasks each contract's review_note requires
    (reserved ids TASK-20260906-7ec3ea / TASK-20260906-90e7cf), names the
    implementation path and the required-artifact manifest, and states that
    it is dispatched only by the execution batch opened after
    DEC-20260906-2b1387 merges to main.
  - >-
    On decline of a contract: no gate field of that contract changes and no
    executor handoff for it is written. Nothing asserting an answer is
    written before the orchestrating session has recorded the user's answer.
  - >-
    This task does NOT write ledger/decisions/DEC-20260906-2b1387.yaml; the
    decision (both branches) is authored by the ledger archive
    TASK-20260906-2d30dd, exactly as 59fb55 wrote DEC-20260905-2d466e in the
    precedent. This task changes no hypothesis status (both stay
    `specified`) and promotes nothing.
  - >-
    No other file written; no identifier minted (every id used here was
    pre-minted by the orchestrating session).
  deliverables:
  - experiments/EXP-ECDLP-612fb1/specification.yaml (gate fields updated -- approve branch only)
  - experiments/EXP-ECDLP-869870/specification.yaml (gate fields updated -- approve branch only)
  - ledger/handoffs/TASK-20260906-3623b9.yaml (approve branch for EXP-ECDLP-612fb1 only)
  - ledger/handoffs/TASK-20260906-d17254.yaml (approve branch for EXP-ECDLP-869870 only)
  - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-9c5410/tasks/TASK-20260906-67f1ab/approval-note.md (every branch; records that DEC-20260906-2b1387 is authored by TASK-20260906-2d30dd)
  artifact_paths:
  - experiments/EXP-ECDLP-612fb1/specification.yaml
  - experiments/EXP-ECDLP-869870/specification.yaml
  - ledger/handoffs/TASK-20260906-3623b9.yaml
  - ledger/handoffs/TASK-20260906-d17254.yaml
  - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-9c5410/tasks/TASK-20260906-67f1ab/approval-note.md
  archived_by: TASK-20260906-2d30dd
  write_scope:
  - experiments/EXP-ECDLP-612fb1/specification.yaml
  - experiments/EXP-ECDLP-869870/specification.yaml
  - ledger/handoffs/TASK-20260906-3623b9.yaml
  - ledger/handoffs/TASK-20260906-d17254.yaml
  - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-9c5410/tasks/TASK-20260906-67f1ab
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 900
    memory_gb: 2
    maximum_runs: 0
  completion_gate:
  - >-
    For each APPROVED contract: spec parses; status approved; approved_by
    coordinator; frozen true; execution_authorized true; version 1; protocol
    fields byte-identical outside the five gate fields (diffed against the
    committed bytes). For each DECLINED contract: spec byte-identical to the
    committed bytes.
  - >-
    Each executor handoff written parses with its contract's budget envelope
    verbatim and validate_ledger stays clean.
  - >-
    approval-note.md records the branch taken per contract, the authorship,
    the resolved model, the diff scope, and that DEC-20260906-2b1387 is
    authored by TASK-20260906-2d30dd.
  - ledger/decisions/DEC-20260906-2b1387.yaml is NOT among this task's outputs.
