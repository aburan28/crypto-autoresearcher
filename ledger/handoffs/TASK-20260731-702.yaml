handoff:
  id: TASK-20260731-702
  from: coordinator
  to: executor
  objective: >-
    Repair the two tracked mutation-control defects in the admitted
    TASK-20260731-602 harness, in a NEW BATCH-002 task directory that supersedes
    rather than overwrites. H-1: the mutation-control scoring can still credit an
    import-time AssertionError UNRELATED to the injected fault as
    rejected_by_module_self_check / detected: true, returning `pass` on mutants
    none of which was ever compared against anything — narrow this so that ONLY
    a genuine comparison-based detection counts, and PROVE the fix by injecting
    both failure shapes. H-3: no mutant probes reduced-round round-structure
    logic — add mutants that do, and demonstrate that the repaired control
    detects them.
  uncertainty_reduced: >-
    Whether the harness's detection-power claim can be extended from the
    full-round path (where it is externally pinned) to the reduced-round path
    (where this campaign's research actually happens), and whether the mutation
    control's green can be trusted to mean "a comparison ran and caught the
    fault" rather than "an exception happened during import".
  inputs:
    - >-
      DEC-20260731-011, disposition harness_TASK_20260731_602: the harness is
      ADMITTED as campaign infrastructure; H-1 and H-3 are tracked repair items
      that must be closed before any cryptanalytic measurement is certified
      against the reduced-round path; H-2 is recorded; H-4 is a declared,
      irreducible limitation and is NOT a defect to repair.
    - >-
      EV-AES-001 observations A-8 (the reproduced mutation table and the
      control-of-the-control), A-9 (H-1), A-10 (H-2), A-11 (H-3), A-12 (H-4).
    - >-
      TASK-20260731-604 validation_report.yaml, mutation_control_audit: the
      exact probes that exposed H-1 (an import-time AssertionError unrelated to
      the mutation returned verdict=pass with all three rows
      rejected_by_module_self_check, detected: True) and that confirmed the
      earlier AttributeError fix genuine (verdict=FAIL, detected: False).
    - >-
      The committed BATCH-001 artifacts, READ-ONLY, at snapshot commit
      0185c0ff2d3878101d8f6cf5bdef48906ffb197b: aes_reduced.py,
      vector_check_receipt.json, run_record.md (which carries the archived
      verification driver verbatim, sha256
      675ff4d568c03f6b12aa5d8931c6185ec7c5b08344ef826616fd9580d4c84a6d).
    - >-
      Local tooling: python3 3.11.15 with pycryptodome 3.23.0, openssl 3.0.13,
      gcc 13.3.0 with -maes, 4 CPU cores, 15 GB RAM.
  constraints:
    - >-
      IMMUTABILITY. Do NOT modify, overwrite, delete, or re-run into any
      BATCH-001 committed artifact. Read them; copy what you need into THIS
      task's own directory; supersede by producing a new, separately named
      control module. AGENTS.md core rule 4: results are immutable records and
      corrections create new records. State in repair_report.md exactly which
      BATCH-001 artifact each new file supersedes, and that the BATCH-001
      archived green stands as recorded.
    - >-
      H-1 REPAIR. Narrow the scoring so that ONLY a genuine comparison-based
      detection is scored `detected: true`. Either require the AssertionError to
      be provably the module's own self-check AND related to the injected fault,
      or — preferred, and simpler to defend — REMOVE the self-check detection
      path entirely and require every mutant to be caught by an actual
      differential comparison. Any import-time exception of any kind must be
      scored as an INFRASTRUCTURE OUTCOME (verdict FAIL / detected: false /
      status naming the exception class), never as a detection. A control that
      cannot run its comparison has produced no evidence about detection power
      (AGENTS.md rule 5).
    - >-
      H-1 PROOF OBLIGATION. Prove the fix by injecting BOTH failure shapes into
      the repaired control and recording the outcome of each: (a) an import-time
      AssertionError UNRELATED to the injected fault — the exact H-1 shape — and
      (b) an import-time non-AssertionError, the original false-green shape
      (AttributeError: 'NoneType' object has no attribute '__dict__'). Both must
      yield detected: false and a non-passing verdict. Record the injected
      source, the exact exception raised, and the control's full scored output
      for each.
    - >-
      H-3 REPAIR. Add mutants that perturb REDUCED-ROUND ROUND-STRUCTURE logic —
      at minimum: _is_final_round, encrypt_partial level bounds, and round-key
      indexing at r < Nr. These are bugs that are INVISIBLE at r = Nr and would
      silently corrupt every later reduced-round measurement, so a mutant that
      is caught only at full rounds does not close H-3. Each new mutant must be
      detected by a comparison performed at r < Nr.
    - >-
      H-3 REFERENCE PROBLEM. Per H-4 the reduced-round path has NO external
      reference and cannot obtain one. Therefore state EXPLICITLY what each
      reduced-round mutant is compared AGAINST — an independently authored
      implementation of the documented C1/C2/C3 convention, a differential
      oracle derived from the convention, or the unmutated module itself — and
      state honestly what that comparison does and does not establish. Comparing
      a mutant to the unmutated module establishes SENSITIVITY of the control,
      not correctness of the convention. Do not present the former as the
      latter, and do not claim to have removed H-4.
    - >-
      CONTROL OF THE CONTROL. Include at least one semantics-preserving no-op
      mutant on the reduced-round path (source text changed, function unchanged)
      and demonstrate it is scored detected: false. A control that fires on
      everything is vacuous; this is the check that its green discriminates.
    - >-
      H-2 IS RECORDED, NOT REPAIRED. State this explicitly in repair_report.md:
      the module's import-time self-check is an assert and is stripped under
      python3 -O, so a module with provably inconsistent MixColumns /
      inverse-MixColumns matrices imports cleanly under -O. This task does not
      repair it. Note the interaction with the H-1 repair — if the self-check
      detection path is removed entirely, H-2's practical impact narrows further
      — but do not report H-2 as closed.
    - >-
      OBSERVATIONS ONLY. Make no cryptanalytic claim, propose no mechanism,
      assign no evidence strength, and change no official state. A repaired
      control is a REPRODUCIBILITY FACT about an instrument, never a result
      about AES.
    - >-
      Record exact commands, exit statuses, resolved tool versions, git commit
      and dirty-tree state, deterministic seeds, timestamps, and every check that
      did NOT run and why. Do not fabricate a command, version string, output, or
      passing check (AGENTS.md rule 9). A mutant that could not be scored is
      recorded as unscored.
    - >-
      No literature baseline is relevant to this task and none may be invoked.
    - >-
      If a required check cannot be performed, report the exact failure as an
      infrastructure limitation — a task-scope result, never negative
      mathematical evidence (AGENTS.md rule 5).
    - Write only under the assigned task directory.
  deliverables:
    - mutation_control_v2.py
    - repair_receipt.json
    - repair_report.md
  artifact_paths:
    - coordination/goals/GOAL-AES-001/batches/BATCH-002/tasks/TASK-20260731-702/mutation_control_v2.py
    - coordination/goals/GOAL-AES-001/batches/BATCH-002/tasks/TASK-20260731-702/repair_receipt.json
    - coordination/goals/GOAL-AES-001/batches/BATCH-002/tasks/TASK-20260731-702/repair_report.md
  archived_by: TASK-20260731-704
  inference:
    policy: executor-implementation
    requested_policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
    standing_basis: >-
      inference-amendment commit 0137a051eb5828789eb267fa83c8278086578d4c. Under
      this harness all subagents run `model: inherit`, so a substitution is
      structural and expected; recording it is mandatory.
    harness_note: >-
      Record requested_policy and the ACTUAL resolved model in the artifact's
      inference block with fallback_used set accordingly. Never silently
      substitute (AGENTS.md rule 11); never guess a resolved model you did not
      observe (rule 9).
  budget:
    wall_clock_seconds: 1500
    memory_gb: 4
    maximum_runs: 6
  completion_gate:
    - >-
      INFERENCE BLOCK REQUIRED. repair_receipt.json and repair_report.md each
      carry an `inference` block recording policy, requested_policy
      (executor-implementation), the ACTUAL resolved model identifier,
      fallback_used, model_verified (false if `doctor --probe` was not run), and
      the standing basis 0137a051. Missing or partial fails this task.
    - >-
      H-1: the repaired control scores NO import-time exception as a detection.
      Both injected failure shapes — an unrelated import-time AssertionError and
      an import-time non-AssertionError — are recorded with their injected
      source, the exception raised, and the control's full scored output, and
      both yield detected: false with a non-passing verdict.
    - >-
      H-3: at least three new mutants perturb reduced-round round-structure
      logic (_is_final_round, encrypt_partial level bounds, round-key indexing at
      r < Nr), each is detected by a comparison performed at r < Nr, and the
      receipt records per mutant: the perturbation, the round counts compared,
      the comparison target, the counts flagged, and the detection verdict.
    - >-
      The comparison target for every reduced-round mutant is named explicitly,
      with an honest statement of what it establishes and what it does not. H-4
      is not claimed to be removed.
    - >-
      At least one semantics-preserving no-op mutant on the reduced-round path is
      scored detected: false, demonstrating the repaired control discriminates.
    - >-
      repair_report.md states that H-2 is RECORDED AND NOT REPAIRED, and names
      exactly which BATCH-001 artifact each new file supersedes, confirming no
      BATCH-001 committed artifact was modified in place.
    - >-
      repair_receipt.json is machine-readable and records exact commands, exit
      statuses, resolved tool versions, git commit and dirty-tree state, seeds,
      timestamps, and every check that did not run with its reason.
  return_format: >-
    The three artifacts under the assigned task directory, plus a short summary
    naming: the H-1 repair actually implemented, the scored outcome of each of
    the two injected failure shapes, each new reduced-round mutant and whether it
    was detected at r < Nr, the no-op control result, and the explicit statement
    that H-2 remains open.
