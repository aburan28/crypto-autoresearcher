handoff:
  id: TASK-20260803-83e457
  from: coordinator
  to: validator
  objective: Independently verify the C1 dispersion control and the two recomputations. Re-derive phi
    yourself with your own windowing and your own rate estimator; check that windows really are binned
    to expected count >= 10 and that the leverage correction is applied where it belongs; and re-derive
    the effective degrees of freedom and the attenuation identity a THIRD time. State whether the deep
    tail is consistent with Poisson.
  uncertainty_reduced: Whether C1 settles what two prior attempts could not, and whether the retirement
    of the whole-band statistic survives a third computation of its basis.
  inputs:
  - The verified TASK-20260803-ea29ce snapshot commit and its three artifacts
  - EV-MLKEM-0cf1df, EV-MLKEM-553b83
  - The BATCH-013 red-team package
  constraints:
  - Never fabricate a command, output, timing, statistic, citation, or run (AGENTS.md rule 9).
  - ZERO NEW SAMPLING, no network, no G6K. Repository bytes only; the vendored PDF is READ ONLY.
  - Toy tier; resolved band only; raw undivided score scale; NO ML-KEM security claim.
  - 'AGENTS.md rule 12 stays UNMET and UNWAIVED: EV-MLKEM-011, EV-MLKEM-013 and EV-MLKEM-017 keep their
    status; KN-FIND-031 stays withdrawn.'
  - 'BINDING (DEC-20260803-52a750): do not quote a whole-band ratio without stating its effective degrees
    of freedom beside it. Report the C>=1000 comparison.'
  - Write only inside the declared write_scope. Do not edit any prior artifact or ledger record. Do not
    git commit.
  - Independent session. RE-DERIVE, do not confirm.
  - You did not produce this package and must not repair it. Report defects; do not edit producer artifacts.
  - If C1 is inconclusive too, say so plainly rather than forcing a verdict. Three inconclusive attempts
    is itself a finding about the instrument.
  - Return ADMISSIBLE, ADMISSIBLE_WITH_DEFECTS or INADMISSIBLE with numbered defects.
  deliverables:
  - validation_report.yaml with per-claim reproduction status and a package verdict
  - validation_notes.md recording exactly what you recomputed
  artifact_paths:
  - coordination/goals/GOAL-MLKEM-003/batches/BATCH-014/tasks/TASK-20260803-83e457/validation_report.yaml
  - coordination/goals/GOAL-MLKEM-003/batches/BATCH-014/tasks/TASK-20260803-83e457/validation_notes.md
  archived_by: TASK-20260803-0d2548
  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 3000
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
  - every quantitative claim marked reproduced, not_reproduced or unable_to_check with a reason
  - an explicit statement on whether the deep tail is consistent with Poisson
  - a package verdict
