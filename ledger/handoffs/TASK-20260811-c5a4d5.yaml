  recorded_at: '2026-08-11'
  from: coordinator
  to: executor
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-d7e255
  experiment_id: EXP-INSTR-36c8cf
  hypothesis_id: H-INSTR-444c7b
  question_id: RQ-INSTR-f8faa0
  contract_version: 3
  not_a_new_experiment_contract: >-
    Same shape as TASK-20260811-409237 and TASK-20260811-bc336d
    (CTRL-VALUESHUFFLE precedent): a bounded reanalysis producing a new
    immutable run under the existing, approved EXP-INSTR-36c8cf contract.

  objective: >-
    FORMALIZE, AS A PROPER COMMITTED RUN, WORK ALREADY TRIPLE-INDEPENDENTLY
    VERIFIED BUT NOT YET ADMISSIBLE EVIDENCE. RUN-INSTR-d5check-b8faf7
    (TASK-20260811-409237) checked whether amendment v3 change E11's D3/D4/D5
    diagnostic catches the Student-t(df=5) alternative within T2's own
    truncated stopping window (headline: 94/94, 100%) but never checked the
    matched-shape GAUSSIAN arm (the null-object control docs/inventor-
    protocol.md section 3 requires before ANY reported catch-rate is read as
    evidence rather than an artifact) -- an omission both VAL-20260811-1045a7
    and this batch's red-team review independently flagged as material,
    citing this SAME batch's own earlier lesson (the raw exceedance-count
    diagnostic's apparent 100%-vs-0% separation turned out to be
    100%-vs-12.6% once the Gaussian arm was actually checked). This
    Coordinator performed a preliminary, OFF-LEDGER, ad hoc check of the
    Gaussian arm (not admissible evidence -- no committed script, no
    dispatched task, no write_scope); both the Validator and Red Team
    independently reproduced it from scratch (each catching and fixing a
    real bug in their OWN first attempt -- see "known hazard" below) and
    both converged on the identical figure: 21/485 (4.330%) of the Gaussian
    arm's own accepted replications also fire D5, versus 94/94 (100%) for
    Student-t(5). The Red Team additionally found, and empirically verified,
    that comparing abs(D3's LOO z-score) against D4's own (one-sided,
    max-only-calibrated) 99th-percentile threshold gives an ACTUAL per-
    rung-per-row false-positive rate of ~2%, not the nominal 1% -- and that
    recalibrating D4 to the actual D3 statistic (the LOO z-score of
    whichever point, max or min, is more extreme by absolute deviation, not
    just the max) drops the Gaussian-arm false-fire rate to 7/485 (1.44%)
    while leaving the Student-t headline UNCHANGED at 94/94 (100%). Neither
    the 21/485 nor the 7/485 figure exists as a citable, committed record.
    This task creates that record.

  uncertainty_reduced: >-
    Whether amendment v3's own E11 repair is a genuinely well-calibrated
    discriminator (as opposed to a diagnostic that merely fires often,
    which the earlier D1/D2 exceedance-count diagnostic turned out to be),
    formalized as citable evidence rather than off-ledger prose. This
    directly informs whether DEC-20260811-45583f's pause on dispatching a
    real successor run against v3 should clear, be narrowed, or be
    reaffirmed.

  inputs:
    - ledger/decisions/DEC-20260811-45583f.yaml
    - ledger/handoffs/TASK-20260811-409237.yaml
    - coordination/goals/GOAL-ENDO-001/batches/BATCH-d7e255/execution/EXP-INSTR-36c8cf/execution_report_d5check.md
    - harness/exp_instr_36c8cf/ctrl_r3r4_d5check.py (the module you extend via
      a NEW sibling module -- READ IN FULL, especially d3_loo,
      window_for_replication, compute_d4_calibration, and the "abs vs
      one-sided" judgment-call docstring in analyse_replication)
    - >-
      harness/exp_instr_36c8cf/ctrl_r3r4.py -- R4_GAUSSIAN_MASTER_SEED=271828182
      and the "gaussian" branch of draw_null_object_replication, exact draw
      formula rng.normal(loc=loc, scale=scale, size=n_max)
    - experiments/EXP-INSTR-36c8cf/runs/RUN-INSTR-r3r4-nullobj-d3efd7/r4-gaussian-calibration-optional.json
      (the Gaussian arm's own committed accepted_rung records -- your
      faithfulness-gate target for this arm)
    - experiments/EXP-INSTR-36c8cf/runs/RUN-INSTR-d5check-b8faf7/d4-calibration.json
      (the ALREADY-COMMITTED D4 max-only calibration -- reuse its p99
      thresholds for the FIRST (uncorrected) variant rather than
      recomputing; recompute only for the corrected-D4 variant, item 3
      below)
    - experiments/EXP-INSTR-36c8cf/amendments/v3.yaml (change E11, the exact
      spec)

  known_hazard_both_prior_reviewers_hit_and_you_must_avoid: >-
    numpy.random.SeedSequence.spawn() IS STATEFUL: calling .spawn(k) on the
    SAME SeedSequence object a second time returns DIFFERENT child
    sequences than the first call, not the same ones. Both the Validator
    and the Red Team, in their own independent from-scratch reproductions
    of this exact Gaussian-arm check, initially got a WRONG answer (20/485
    instead of 21/485) because their first-draft scripts called .spawn() on
    the same top-level SeedSequence twice (once for a faithfulness
    spot-check, once for the full pass), silently substituting different
    draws for whichever replication indices happened to be checked in both
    passes. STRUCTURE YOUR CODE THE WAY ctrl_r3r4_d5check.py's OWN
    faithfulness_gate() and run_full_analysis() already do it correctly:
    each function instantiates its OWN fresh
    numpy.random.SeedSequence(master_seed) and calls .spawn() exactly ONCE
    on it. Follow that same pattern exactly; do not share a spawned-from
    SeedSequence object across two different check passes in your new code.

  what_to_build:
    - >-
      A NEW MODULE ONLY: harness/exp_instr_36c8cf/ctrl_r3r4_d5check_gaussian.py.
      Do not edit ctrl_r3r4_d5check.py, ctrl_r3r4.py, or any other existing
      file. Import ctrl_r3r4_d5check's own d3_loo, window_for_replication,
      and compute_d4_calibration functions (reuse, do not retype); import
      ctrl_r3r4's own R4_GAUSSIAN_MASTER_SEED, R4_RUNG_SIZES,
      R4_REPLICATIONS.
    - >-
      MANDATORY FAITHFULNESS GATE, RUN FIRST, structured as a single pass
      per the hazard warning above: reimplement the Gaussian draw generation
      (numpy.random.SeedSequence(271828182).spawn(500) called ONCE, then per
      replication rep_seed.spawn(13) in ascending fb order, then per row
      rng.normal(loc=loc, scale=scale, size=1536) -- loc/scale from the
      row's own rung-3 mean/sd, exactly as ctrl_r3r4.py's "gaussian" branch),
      run through sr3v3.interval_for_rung/stability_check, and check
      accepted_rung/terminal_rung/exceed_total_at_terminal against
      r4-gaussian-calibration-optional.json's own committed records for AT
      LEAST 25 replication indices spread across the full 0-499 range
      (mirroring ctrl_r3r4_d5check.py's own faithfulness_check_indices
      helper -- reuse it). If it does not match exactly, stop and report a
      defect; do not proceed.
    - >-
      VARIANT 1 (as-implemented D4, reused not recomputed): for all 500
      Gaussian-arm replications, using the ALREADY-COMMITTED D4 p99
      thresholds from RUN-INSTR-d5check-b8faf7/d4-calibration.json (read
      that file directly, sha256-pin it as a source), compute D3/D5 exactly
      as ctrl_r3r4_d5check.py's analyse_replication does (abs(D3 loo_z) vs
      D4's p99, fb=18/fb=22, truncated to window_for_replication(accepted_rung)
      using the GAUSSIAN arm's own committed accepted_rung per replication).
      Report the headline: of the 485 replications with accepted_rung set,
      how many/what fraction have D5 fire. Expected (per two independent
      prior reproductions): 21/485 (4.330%) -- if you get a different
      number, do NOT silently reconcile it to match; investigate, and if
      still different after investigation, report your own number plainly
      with your reasoning, flagged prominently.
    - >-
      VARIANT 2 (corrected D4, recalibrated to the actual D3 statistic, per
      the Red Team's own tested fix): compute a NEW D4 calibration where,
      instead of tracking only the sample MAXIMUM's LOO z-score, you track
      the LOO z-score of WHICHEVER point (max or min) is most extreme by
      absolute deviation from the mean -- i.e. the exact same selection rule
      D3 itself uses -- for each of n i.i.d. N(0,1) draws, at least 20000
      trials per n (rungs 4-8's own seed counts), with your own declared,
      disclosed master seed distinct from every seed already in use in this
      contract (314159265, 271828182, 141421356 -- state your new choice
      explicitly). Report the resulting p99 thresholds, then rerun BOTH the
      Gaussian-arm (485 accepted) AND, for completeness/cross-check, the
      Student-t(5) arm (94 accepted, same draws as RUN-INSTR-d5check-b8faf7,
      reusing ctrl_r3r4_d5check's own machinery for that arm) through this
      recalibrated threshold. Expected (per the Red Team's own prior
      finding): Gaussian 7/485 (1.443%), Student-t UNCHANGED at 94/94
      (100%). Report both, with the same "do not silently reconcile a
      mismatch" instruction as Variant 1.
    - >-
      Report both variants' binomial 95% (Wilson) confidence intervals
      alongside the point estimates, per both reviewers' own required
      controls (do not report bare percentages without them).

  deliverable:
    - >-
      A NEW IMMUTABLE RUN RECORD under experiments/EXP-INSTR-36c8cf/runs/,
      via harness.runner.write_run, certificate {kind: none}, source-
      provenance pinning ctrl_r3r4_d5check_gaussian.py,
      ctrl_r3r4_d5check.py, ctrl_r3r4.py, sr3v3.py,
      r4-gaussian-calibration-optional.json's and
      RUN-INSTR-d5check-b8faf7/d4-calibration.json's sha256.
    - >-
      Full per-replication records for both variants (not just aggregates),
      analogous to d3-d5-per-replication.json's own shape.
    - >-
      An execution report at
      coordination/goals/GOAL-ENDO-001/batches/BATCH-d7e255/execution/EXP-INSTR-36c8cf/execution_report_d5check_gaussian.md,
      stating both variants' headlines with their Wilson CIs, whether they
      matched the two prior independent reproductions' expected figures, and
      any underspecified judgment calls (same discipline as every prior task
      in this thread).

  what_this_does_not_do:
    - >-
      DOES NOT ITSELF CLEAR OR REAFFIRM DEC-20260811-45583f's PAUSE. That is
      a Coordinator act, after independent review, in a decision record.
    - >-
      DOES NOT APPROVE, REJECT OR AMEND amendments/v3.yaml or draft a v4.
    - >-
      DOES NOT EDIT any existing file. Does not touch
      RUN-INSTR-r3r4-nullobj-d3efd7, RUN-INSTR-d5check-b8faf7, or
      RUN-INSTR-36c8cf-phaseA-v2-57ca9a (all read-only inputs).
    - >-
      MAKES NO CURVE-SIDE CLAIM. claim_tier toy, sota_delta zero. Does not
      move any hypothesis status.

  constraints:
