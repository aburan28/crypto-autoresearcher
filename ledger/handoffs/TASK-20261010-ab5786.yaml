# H-ECDLP-bd1572: embedding-degree census, part A, and the deployed-curve
# transfer-threshold table, part B). WRITTEN, NOT DISPATCHED. This
# design-approval cycle does not launch the executor and does not invoke
# /run. A later /run may use this card only after the snapshot commit is
# pushed and the dispatch preconditions below hold. Archived by snapshot
# TASK-20261010-83f19b. Public parameters only; no key recovery.
# =============================================================================
handoff:
  id: TASK-20261010-ab5786
  from: coordinator
  to: executor
  dispatch_state: written_not_dispatched
  objective: >-
    Execute the frozen contract experiments/EXP-ECDLP-6dacdb/specification.yaml
    exactly as its launcher.command states: python3
    experiments/EXP-ECDLP-6dacdb/implementation/run.py --part A B --seeds
    1 2 3 --curves 64 --out <run_dir>, writing part A to the run directory
    RUN-ECDLP-c770f6 and part B to the run directory RUN-ECDLP-393d10 as the
    trial plan names them, then run implementation/check.py on each.
    Record observations only. Do not interpret beyond the recorded fields,
    do not change a hypothesis status, and do not approve anything.
  uncertainty_reduced: >-
    (A) Whether the polynomial form of p shifts the distribution of the
    embedding degree k of the largest prime-order subgroup of a random
    curve E/F_p at toy scale, the one statistic through which the
    F_{p^k}^* sieve could ever reach E; H-ECDLP-bd1572 predicts no shift.
    (B) For each deployed special-prime curve, by exact modular
    exponentiation on public constants, whether the order of p modulo l
    exceeds 10^6, and the size of the gap between that and the transfer
    threshold k* under stated, recalled, optimistic constants. The
    deliverable of (B) is the gap, not a key-size statement.
  inputs:
    - experiments/EXP-ECDLP-6dacdb/specification.yaml
    - experiments/EXP-ECDLP-6dacdb/trial-plan.json
    - experiments/EXP-ECDLP-6dacdb/implementation/run.py
    - experiments/EXP-ECDLP-6dacdb/implementation/check.py
    - experiments/EXP-ECDLP-6dacdb/implementation/primeset.py
    - experiments/EXP-ECDLP-6dacdb/implementation/queue.json
    - ledger/hypotheses/H-ECDLP-bd1572.yaml
    - ledger/decisions/DEC-20261010-81ff18.yaml
    - ledger/questions/RQ-ECDLP-002.yaml
    - knowledge/literature/KN-LIT-086.md
    - knowledge/literature/KN-LIT-3743.md
  constraints:
    - Do not self-dispatch. This card is launched only by a later /run session that meets dispatch_preconditions.
    - Amazon Bedrock is prohibited.
    - The reachable negative is the contract's falsification criterion, a pre-registered part A test rejecting at alpha = 0.01 with the controls passing, or a deployed special-prime curve with k_actual <= k* under any constant. Record it when it occurs; do not reason it away. A part B row of the second kind is routed by the Coordinator to review-breakthrough before anyone repeats it; the executor records and stops.
    - Do not edit the frozen specification, the hypothesis, or this handoff. Amendments only as additive files under experiments/EXP-ECDLP-6dacdb/amendments/.
    - Use the run ids RUN-ECDLP-c770f6 (part A) and RUN-ECDLP-393d10 (part B) already named in the trial plan. Do not mint another run id.
    - A timeout, crash, memory abort or resource_exhaustion is failed_infrastructure, never a negative mathematical result.
    - Preserve every raw artifact. Do not overwrite a prior run record.
    - maximum_runs is 6 as the specification counts them; one invocation of launcher.command covers both parts and all seeds.
    - No key recovery and no discrete logarithm on any curve. Part B uses public parameters only, in exact arithmetic, with no secret scalar; the Ed448 order is recalled and its row must say so.
    - Do not add primes, curves, parameter sets, constants or arms beyond the launcher.command and the frozen part B table.
    - No attack claim and no key-size statement.
    - Do not edit RQ-ECDLP-002 and do not edit a goal head.
