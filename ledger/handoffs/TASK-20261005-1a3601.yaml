handoff:
  id: TASK-20261005-1a3601
  from: coordinator
  to: executor
  objective: >-
    Enumerate the six frozen cells of EXP-SSI-be32d2 and emit the
    unlabeled-fiber counts, the oriented-control disagreements, and one
    checkable certificate per counted conflict.
  uncertainty_reduced: >-
    Whether a deterministic evaluator that sees only a j-invariant can
    agree on every depth-two labeling at these three primes, and whether
    the oriented control is a valid harness.
  inputs:
    - ledger/hypotheses/H-SSI-072490.yaml
    - ledger/proposals/IDEA-20261004-e4c461.yaml
    - experiments/EXP-SSI-be32d2/specification.yaml
    - ledger/decisions/DEC-20261005-fb3a2e.yaml
  constraints:
    - Implement only the API in the frozen specification.
    - Exhaustive enumeration of depth two. No sampling and no larger prime.
    - A positive-control disagreement invalidates the run. Do not retune labels to remove it.
    - Do not claim a PKE construction, an attack, or a result beyond the six cells.
    - Write nothing outside the declared write scope.
    - Use no Bedrock endpoint or model.
  deliverables:
    - experiments/EXP-SSI-be32d2/runs/<RUN-ID>/cells.json
    - experiments/EXP-SSI-be32d2/runs/<RUN-ID>/certificates.json
    - experiments/EXP-SSI-be32d2/runs/<RUN-ID>/command.txt
  artifact_paths:
    - experiments/EXP-SSI-be32d2/runs/
  write_scope:
    - experiments/EXP-SSI-be32d2/implementation/
    - experiments/EXP-SSI-be32d2/runs/
  archived_by: TASK-20261005-6dce7a
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: null
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
    - cells.json contains all six (prime, degree) cells and the one-step control.
    - Every cell records oriented_composition_disagreement_count and conflicting_unlabeled_fiber_count.
    - Each counted conflict has a certificate with both labelings, one shared j-invariant, and two codomain j-invariants, plus the isomorphism bit.
    - The run manifest records the git commit, the command, and seeds as an empty list.
  return_format: >-
    Run id, validity, the six primary counts, certificate count, and the
    artifact paths.
  review_plan: null
  dispatch_preconditions:
    - archived_by TASK-20261005-6dce7a is committed and its receipt verifies.
    - The hypothesis, specification, and this handoff are committed and pushed.
    - A lane is claimed before launch.
    - >-
      A Coordinator decision after DEC-20261005-fb3a2e explicitly releases
      this experiment. Until that decision, do not launch. The C-star
      continuation on GOAL-SSI-2fa82a is a different task.
