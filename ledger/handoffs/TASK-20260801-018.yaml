  - ledger/decisions/DEC-20260801-007.yaml
  - ledger/hypotheses/H-SMTH-001.yaml
  - ledger/goals/GOAL-ECDLP-001.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-022/archives/TASK-20260801-018/ledger_commit_receipt.json
  artifact_paths:
