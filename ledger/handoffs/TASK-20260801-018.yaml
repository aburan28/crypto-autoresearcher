handoff:
  id: TASK-20260801-018
  from: coordinator
  to: coordinator
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-022
  objective: >-
    After the Validator and the Red Team complete - verify run validity FIRST, then
    file EV-SMTH-001 for the sampling package if admissible, apply the FROZEN reading
    rule RR-SMTH-1 to classify the result into exactly one of M-0, M-5, M-1, M-2, M-4
    or M-6 in the declared precedence order, write the decision as DEC-20260801-007
    subject to the freshness re-check, transition H-SMTH-001 only along the branch the
    rule assigns, and checkpoint GOAL-ECDLP-001 with exactly one next action.
  uncertainty_reduced: >-
    The official status of HEUR-DS-1 at toy scale on the first measurement ever made of
    the correct object, and the single ranked next action for BATCH-023.
  inputs:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-022/reviews/TASK-20260801-016/validation_report.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-022/reviews/TASK-20260801-017/red_team_report.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-022/archives/TASK-20260801-015/snapshot_commit_receipt.json
  - experiments/EXP-SMTH-001/specification.yaml
  constraints:
  - RUN ALONE.
  - >-
    VERIFY VALIDITY BEFORE INTERPRETING - expected sample-set count, schema-complete
    manifest, seed integrity, raw versus summary agreement, null comparability. An
    invalid or incomplete set goes back to the Executor with concrete defects and is
    not evidence.
  - >-
    APPLY THE FROZEN READING RULE AS WRITTEN, IN ITS DECLARED PRECEDENCE ORDER. Do not
    amend it, do not add a branch, and do not read the result into a branch it does not
    satisfy. Quote the branch condition and the observed statistics in the decision.
  - >-
    If any M-0 or M-5 condition fired, the rule is SUSPENDED and the outcome is
    inconclusive on the instrument - never a mathematical result.
  - >-
    Under M-4 the decision is `weaken`, scoped exactly as the branch states, with the
    strongest available refutation artifact archived in or before this same commit and
    its tier declared, and with a status_scope block written into H-SMTH-001.
    reject_scoped-as-impossibility is forbidden.
  - >-
    Under M-2 the decision is `replicate`; H-SMTH-001 stays `analyzed`; no `support`,
    no S1_met, no HEUR-DS-1 validation above toy.
  - Under M-1 or M-6 the decision is `inconclusive` with the reason stated plainly.
  - >-
    BEFORE WRITING THE RECORDS, re-list ledger/decisions and ledger/evidence and
    confirm DEC-20260801-007 and EV-SMTH-001 are free in the current tree including
    anything merged from origin/main since this queue was opened. If either is
    occupied, renumber OUR record, never the other party's, and file a queue amendment
    against the declared set, artifact_paths and write_scope.
  - >-
    Do not claim crypto-scale, medium-scale or asymptotic support. Toy stays toy.
    Promotion gates G1-G4 stay OPEN.
  - >-
    Do not alter H-DS-001, H-IC-001 or H-STR-002, and do not re-score EV-DS-001 through
    EV-DS-004. Leave FAEST and XEDN alone. Do not edit any file under
    experiments/EXP-DS-001/.
  - Fill knowledge_promotion either way, with a concrete not_warranted reason if no KN-FIND is promoted.
  - >-
    Carry the two declared open items OPEN-BATCH022-A and OPEN-BATCH022-B forward in
    the close, stating for each whether it was repaired, mitigated or left open.
  - >-
    Rank RT048-CTRL-3 and RT048-CTRL-4 into BATCH-023 if this batch did not reach them,
    and record the carry-forward rather than dropping it.
  - >-
    Preserve every existing field and note in GOAL-ECDLP-001.yaml verbatim; supersede
    by addition and preserve exactly one next action.
  - >-
    Commit message must contain TASK-20260801-018, EV-SMTH-001, the filed decision id,
    H-SMTH-001, EXP-SMTH-001, GOAL-ECDLP-001, BATCH-022.
  - Do not push from this task.
  deliverables:
