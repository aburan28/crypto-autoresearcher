  completion_gate:
  - Three exact source-review artifacts with full binding and execution accounting.
  - No live operational/scientific result; Coordinator archive and adjudication remain separate.
  review_plan:
    claim_under_review: Source conformance of the confined group-OOM supervisor and native descriptor/process
      adapters before any live operational test.
    coordinator_prior: 'The final native correction may resolve the 17 earlier findings, but producer evidence
      is incomplete: final 81 cases have retained custody while prior 251 cases and 15 child starts do not.
      The failed producer remains failed. Review current exact source independently, especially actual process
      adapters, cgroup identity, acknowledgement ordering, event deltas, cleanup and exact-container containment.
      Source acceptance cannot retrospectively validate missing attempts or permit live operational execution.'
    recorded_before_reviewers: true
    source_snapshot: f7c68d72d806b152c0fa1a8b8f943060baa69065
    joints:
    - joint: complete_supervisor_source_confinement_ordering_and_custody
      assigned_to: TASK-20260909-a599db
      attack_plan: 'Read the entire frozen operational protocol, all eight final source/metadata files, all
        17 earlier findings, and the failure disposition. Independently trace every obligation through actual
        supervisor.py, container.py and host.py production paths. Challenge no-follow descriptor traversal,
        Linux/cgroup2 fstatfs and mountinfo identity, own membership and writable-mount checks, partial writes/creates,
        root/subtree refusal, exact inspected container identity, host create/inspect/copy/start/stdin/terminal/kill/remove
        integration, and confinement of every exception path. Verify supervisor separation, pre-fork profile
        readback, paused-child migration/readback, writable-descriptor closure, groups/GID/UID/capability/OOM
        postconditions before worker body. Trace both-member acknowledgement before pressure, baseline-to-final
        event deltas, bounded terminal polling, supervisor survival, and rejection of manual/watchdog/outer-OOM
        or stale counters. Independently exercise native pipe/fork/barrier/drain/wait/reap/descriptor paths
        using bounded benign owned processes where allowed, plus injected malformed syscall/transport observations.
        No pressure body, privilege change, cgroup operation, or Docker invocation. Check failed-signal behavior
        under the frozen SETUID/SETGID-only profile: no added CAP_KILL, no false inner-cleanup success, exact
        owned-container containment and failed classification. Ensure all partial-failure paths retain primary
        error, drain/capture logs, reap owned processes and close descriptors; distinguish untestable platform
        paths explicitly. Recheck all 17 historical findings against final source, and inspect whole component
        for new defects instead of checking only the reported repairs. Verify final 81-case receipt hashes
        and outer/nested data; prior 251 cases and 15 starts remain incomplete without reconstruction. Verify
        protocol-binding and report metadata consistently distinguish current source, producer execution, failed
        history and actual snapshot.'
      breaking_artifact: Exact source line and independent fixed counterexample,unimplemented native path,or
        missing confinement/ordering/custody obligation.
    blindness:
      mutual: false
      lifted_for:
      - TASK-20260909-a599db
      rationale: Fresh independent source-aware hardening review. The declared earlier review is deliberately
        visible to verify its 17 findings. No parent/producer conversation, concurrent image-audit report or
        other undeclared reviewer report.
    proves_too_much:
      objects:
      - A correct suffix attached to the wrong parent/root path or a symlink component.
      - A changed inspected container identity or unexpected existing child cgroup.
      - Partial controller writes or a profile asserted without readback.
      - A worker released before migration or retaining writable descriptors/capabilities.
      - A group0 or wrong-memory worker that still reaches allocation.
      - An OOM-looking signal without required group counters or supervisor separation.
      - Cleanup/transcript failures that erase the primary cause or leave a falsely complete outcome.
      failure_signature: Known-invalid identities,unsafe writes,early worker release,missing observations or
        manual kills must not pass the claimed operational classification.
      assigned_to: TASK-20260909-a599db
    blind_rederivation:
      required: false
      quantity: No mathematical quantity or cryptanalytic claim.
      parameters: Fixed operational interface and mocked observations.
      blind_from: []
      assigned_to: TASK-20260909-a599db
      not_repeated_reason: Source/operational design review only; no new mathematical result.
    scope_limit: Final source conformance only, including bounded benign POSIX fixtures. No live Docker/cgroup/privilege/migration/pressure
      action, scientific result, measurement admission or retrospective repair of missing producer records.
    procedure_deviations: []
  review_plan_path: coordination/experiment-reserve/BATCH-635652/review-plan-TASK-20260909-a599db.yaml
