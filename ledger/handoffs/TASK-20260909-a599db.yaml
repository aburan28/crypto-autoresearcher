  constraints:
  - You are not alone. Own only three exact new outputs. No source, Git, ledger, queue, claim, release, status
    or approval mutation.
  - Read full declared inputs and verify every hash. No parent/producer conversation or concurrent image-auditor
    report. Earlier explicitly bound review is visible as declared in the plan.
  - Fresh native review-adversarial gpt-5.6-sol/xhigh, no fallback, degradation, Bedrock or serving probe.
  - At most 384 total fixed cases including parameters, failures and reruns. Each complete suite at most 128
    cases; reserve one complete final suite. 10 seconds per case and 1800 aggregate executed-check wall/CPU
    seconds; one worker, 2 GiB. Source/hash comparisons are administrative and counted separately.
  - At most 32 benign owned POSIX child starts across all attempts, at most two child processes concurrently,
    each with 3-second lifetime and at most 1 MiB fixture payload. Real pipe/fork/barrier/drain/wait/reap and
    small ordinary temporary-file fixtures are allowed. Record every start and terminal/reap outcome. No privilege
    change, cgroup operation, migration, memory pressure body, Docker CLI/API or container execution. Inject
    those observations; never instantiate native cgroup adapters against live system paths.
  - 'Preserve the frozen capability profile: SETUID and SETGID with cap-drop ALL. No CAP_KILL or other permission
    addition. Inspect failure-closed exact-container fallback through injected host commands only.'
  - Independently test production code rather than rerunning producer tests. Report untested platform paths
    and integration prerequisites explicitly. Missing prior 251 cases and 15 child records remain unavailable;
    do not reconstruct from current source.
  - Before each invocation reserve a unique exclusive receipt path and preserve the exact checker/source version.
    Keep complete outer tool response/session/polls/terminal exit plus nested commands, UTC, stdout, stderr,
    all cases and CPU/wall/RSS. No overwritten receipt, guessed exit, omitted failure or accounting restart.
    Use -B/PYTHONDONTWRITEBYTECODE.
  - Return three hashes, assigned-joint verdict and complete limits. No scientific, live guard or launch verdict.
