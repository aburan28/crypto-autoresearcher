handoff:
  id: TASK-20260721-005
  from: coordinator
  to: reviewer
  objective: >-
    Independently reconstruct and try to falsify every novelty, decision-impact,
    and cost claim in the methodology package from TASK-20260721-002.
  uncertainty_reduced: >-
    Whether any proposed technique adds a non-duplicate, auditable capability that
    materially improves ECDLP experimentation or creates a credible attack-cost path.
  inputs:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-001/tasks/TASK-20260721-002/methodology_frontier.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-001/tasks/TASK-20260721-002/cost_audit.md
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-001/archives/TASK-20260721-003/snapshot_commit_receipt.json
    - AGENTS.md
    - docs/
    - harness/
    - tools/
    - templates/
    - ledger/
    - experiments/
    - knowledge/
    - ideas/
  constraints:
    - Use a non-originating independent session with review-xhigh and no fallback.
    - Review only the verified snapshot; do not edit producer or shared ledger artifacts.
    - Reject generic workflow advice, rebranding of existing certificates, and tools that cannot change a concrete research decision.
    - Recompute claimed rigor gains, failure detection, reproducibility, implementation burden, and any path to attack-cost reduction.
    - Preserve explicit boundaries between methodological value and cryptanalytic improvement.
    - No live keys, deployed systems, experiment execution, official state change, or breakthrough claim.
    - Record requested_policy, exact resolved_model_id, reasoning_effort, fallback_used, adapter_version, originating-session separation, and snapshot commit.
  deliverables:
    - review_report.yaml
    - adversarial_notes.md
  artifact_paths:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-001/reviews/TASK-20260721-005/review_report.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-001/reviews/TASK-20260721-005/adversarial_notes.md
  archived_by: TASK-20260721-006
  inference:
    policy: review-xhigh
    fallback_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 1800
    memory_gb: 6
    maximum_runs: 1
  completion_gate:
    - Both reports bind the verified snapshot commit and every reviewed input by SHA-256.
    - Each technique receives PASS | REVISE | FAIL with exact novelty, decision-impact, and implementation-cost rationale.
    - The report states whether value is methodological only or supports a separately testable attack-cost hypothesis.
    - The report recommends exactly one next action for this lane.
  return_format: Independent YAML verdict plus Markdown adversarial reconstruction.
