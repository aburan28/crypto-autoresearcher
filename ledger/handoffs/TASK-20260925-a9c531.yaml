    - >-
      Never edit a review report, the worksheet, the decision, the plan or any
      archived handoff while staging. Never amend, rebase or force-push.
    - >-
      Verify the receipt with tools/research_dispatch.py. A missing, dirty,
      malformed or scope-expanding commit blocks promotion; it is an
      evidence-integrity failure, not a result.
    - >-
      Push the branch and open or refresh the PR against main naming every record
      id. If DEC-20260925-41f6dc approves, the approval takes effect through the
      version-2 specification's conditional approval block only once this archive
