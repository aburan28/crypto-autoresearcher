handoff:
  id: TASK-20260802-007
  from: coordinator
  to: executor
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-028
  role: executor
  run_id: RUN-LPF-001-ivr
  objective: >-
    Run the instance-variance control ONCE against the FROZEN control contract
    and the FROZEN RR-IVR-1 - at 20 distinct curve instances per cell from
    master seeds 90001 through 90020, enumerate all C(512, 2) = 130816 unordered
    i < j half-tuples of each instance's frozen deterministic factor base under
    INT-1 and ENC-B, FACTOR EVERY ONE, and report the between-instance standard
    deviation of p_hat(u) for u in {2, 3, 4, 5} and of STAT-KS-DICK against the
    archived iid null sds, plus the 512 per-factor-base-index smooth rates with
    both nulls. RECORD OBSERVATIONS ONLY.
  uncertainty_reduced: >-
    The between-instance fluctuation scale of the exhaustive real arm - the only
    noise source this design has, never measured, and the quantity on which the
    entire EV-LPF-001 detection-floor table is conditional (OBJ-RT082-1).
  inputs:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/archives/TASK-20260802-006/snapshot_commit_receipt.json
  - experiments/EXP-LPF-001/control_ivr/control_specification.yaml
  - experiments/EXP-LPF-001/control_ivr/reading_rule_ivr.yaml
  - experiments/EXP-LPF-001/control_ivr/implementation/ivr001_driver.py
  - experiments/EXP-LPF-001/implementation/lpf001_driver.py
  - experiments/EXP-LPF-001/results/calib/
  constraints:
  - 'PROCEED ONLY IF APPROVAL_DETERMINATION IS APPROVED in the TASK-20260802-006 receipt. Otherwise stop and report. RUN EXACTLY ONCE.'
  - >-
    USE THE FROZEN CONTRACT AND RR-IVR-1 AS FROZEN. DO NOT EDIT
    experiments/EXP-LPF-001/control_ivr/control_specification.yaml,
    reading_rule_ivr.yaml or implementation/ivr001_driver.py, and DO NOT EDIT
    experiments/EXP-LPF-001/specification.yaml, reading_rule.yaml,
    reading_rule_v2.yaml or implementation/lpf001_driver.py. lpf001_driver.py
    must still hash to
    786aeb0550d75fa3d0785aefbe50b121a24cacae584a4cadd79902c464722d65 at the end
    of this task and you must report the hash you measure. IF A CONTRACT DEFECT
    MAKES THE RUN IMPOSSIBLE, STOP AND REPORT IT - that is a finding and a
    Coordinator matter, never a licence to edit a frozen file.
  - >-
    DO NOT SILENTLY REDUCE SCOPE. k = 20 distinct instances per cell, both
    cells, all four powered rungs plus STAT-KS-DICK, n = 130816 per instance,
    R_PERM = 2000. Reducing any of them requires a Coordinator
    protocol_amendment. A REDUCED-SCOPE RUN REPORTED AS THE PLANNED ONE WOULD BE
    THE SINGLE MOST DAMAGING THING THIS BATCH COULD PRODUCE. INCREASING k AFTER
    SEEING RESULTS IS OPTIONAL STOPPING AND IS EQUALLY FORBIDDEN.
  - >-
    APPLY THE FROZEN SUBSTITUTION RULE MECHANICALLY. If a seed fails or two
    instances coincide in every varying component, take the next unused integer
    upward from 90021 in increasing order until 20 distinct instances exist at
    that cell, and REPORT EVERY SUBSTITUTION AND ITS REASON. Do not choose seeds
    by any other criterion.
  - 'RE-VERIFY EVERY FACTORIZATION AT 100 PERCENT - each returned factor tested for primality and the product asserted equal to N - and archive the verification count per instance and any failures. A FACTORIZATION THIS RUN DID NOT VERIFY IS NOT A MEASUREMENT.'
  - >-
    ARCHIVE THE ARRAYS, NOT ONLY THE SUMMARIES. per_instance_phat.json must
    carry the 20 p_hat vectors and 20 STAT-KS-DICK values per cell;
    per_index_smooth_rates.json must carry the 512 per-index rates at every
    instance, cell and powered rung; first_order_projection.json must carry BOTH
    the closed-form ratio and the permutation-null position at R_PERM = 2000;
    instance_registry.json must carry the 20 primes, the 20 curve coefficient
    pairs, the 20 factor_base_sha256 values per cell, the pairwise-distinctness
    result and the PRE-Q-1 answer as observed. A STANDARD DEVIATION WHOSE
    UNDERLYING VALUES ARE NOT ARCHIVED IS UNAUDITABLE.
  - 'REPORT EVERY RATIO WITH ITS INTERVAL. Every VR and every dispersion ratio carries its sampling interval, computed as RR-IVR-1 specifies. A RATIO WITHOUT ITS INTERVAL IS NOT A REPORTED QUANTITY.'
  - 'VERIFY AND REPORT SEED AND STREAM DISJOINTNESS between every control stream and every archived calibration, plant-Z and measurement stream, and among the control streams themselves. Confirm 2301 is not in the family.'
  - >-
    RECORD OBSERVATIONS ONLY. Do not apply RR-IVR-1's reading clauses to declare
    C-WIDE, C-TIGHT or C-INDET, do not state a disposition, do not interpret,
    and do not compare to any hypothesis. TASK-20260802-011 owns the reading.
    C-MEAN IS COMPUTED AND REPORTED AND IS EXPRESSLY NOT READ BY ANYONE,
    INCLUDING YOU.
  - >-
    Emit a complete run package - manifest.yaml with command.txt,
    environment.json, stdout.log, stderr.log and raw-result.json beside it, plus
    git_status_prerun.txt - and the seven declared result files. THE MANIFEST
    MUST BE SCHEMA-COMPLETE AGAINST tools/validate_ledger.py, WITH
    `environment`, `inputs` AND `resources` PRESENT UNDER THE KEYS THE SCHEMA
    NAMES. RUN tools/validate_ledger.py AGAINST YOUR OWN PACKAGE BEFORE
    REPORTING COMPLETE - this is the exact defect DEF-065-1 recorded and it must
    not recur.
  - 'Record the exact command, the git commit and dirty-tree state, environment and dependency versions, inputs and seeds, the requested policy and the resolved model with fallback_used, stdout and stderr, validity status and reason, timings and peak RSS.'
  - 'A TIMEOUT OR CRASH IS INFRASTRUCTURE SIGNAL AND IS REPORTED AS SUCH, never as a negative result about instance variance or about anything else.'
  - 'MAKE NO COMMIT; TASK-20260802-008 archives.'
  - 'Every YAML and JSON file written must parse.'
  deliverables:
  - 'experiments/EXP-LPF-001/runs/RUN-LPF-001-ivr/ (manifest.yaml, raw-result.json, command.txt, environment.json, stdout.log, stderr.log, git_status_prerun.txt)'
  - 'experiments/EXP-LPF-001/results/ivr/ (IVR_report.json, per_instance_phat.json, between_instance_sd.json, per_index_smooth_rates.json, first_order_projection.json, instance_registry.json, factorization_verification.json)'
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/tasks/TASK-20260802-007/execution_report.yaml
  artifact_paths:
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-ivr/manifest.yaml
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-ivr/raw-result.json
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-ivr/command.txt
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-ivr/environment.json
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-ivr/stdout.log
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-ivr/stderr.log
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-ivr/git_status_prerun.txt
  - experiments/EXP-LPF-001/results/ivr/IVR_report.json
  - experiments/EXP-LPF-001/results/ivr/per_instance_phat.json
  - experiments/EXP-LPF-001/results/ivr/between_instance_sd.json
  - experiments/EXP-LPF-001/results/ivr/per_index_smooth_rates.json
  - experiments/EXP-LPF-001/results/ivr/first_order_projection.json
  - experiments/EXP-LPF-001/results/ivr/instance_registry.json
  - experiments/EXP-LPF-001/results/ivr/factorization_verification.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/tasks/TASK-20260802-007/execution_report.yaml
  archived_by: TASK-20260802-008
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 10800
    memory_gb: 8
    maximum_runs: 1
  completion_gate:
  - >-
    APPROVAL_DETERMINATION confirmed APPROVED before starting; 20 distinct
    instances per cell with every substitution reported; no scope reduction and
    no scope increase anywhere - k, both cells, all rungs, n = 130816 and
    R_PERM = 2000 exactly as frozen; every factorization re-verified at 100
    percent with per-instance counts archived; all seven result files emitted
    with the arrays archived and not only the summaries; every ratio carrying
    its interval; seed and stream disjointness verified and reported; the
    PRE-Q-1 answer reported as observed with the 20 primes and 20
    factor_base_sha256 values; both frozen drivers, both frozen reading rules
    and both specifications confirmed unmodified by measured hash; the manifest
    schema-complete and tools/validate_ledger.py run against the package with
    its output recorded; no reading clause declared, no disposition stated, no
    interpretation offered, C-MEAN reported and not read; no commit made.
