handoff:
  id: "TASK-20260727-014"
  from: "coordinator"
  to: "executor"
  goal_id: "GOAL-SSI-001"
  authorized_by: "DEC-20260727-002"
  objective: >-
    Execute the frozen EXP-SSI-001 protocol exactly as specified and produce the immutable
    run records and execution report it requires. Experiment title: Full-cost re-baselining of classical supersingular path-finding: measured toy-scale
    anchors plus pinned-formula cost tables for MITM, low-memory collision search, and
    Delfs-Galbraith, split by F_p2 vs F_p regime..
  uncertainty_reduced: >-
    Decide, under the pinned convention wiener_full_cost_plus_isogeny_step_count,
    whether full-cost accounting changes the classical-cost ranking of pure
    supersingular path-finding algorithms relative to the quoted step-count ranking (KN-
    TECH-024, KN-TECH-029), separately in the F_p2 and F_p regimes, and produce the
    fully disclosed cost table (measured vs modeled columns separated, memory beside
    time,
  inputs:
    - "experiments/EXP-SSI-001/specification.yaml (status approved, frozen: true; do not change)"
    - "ledger/hypotheses/H-SSI-001.yaml (status approved; do not change)"
    - "ledger/proposals/IDEA-20260725-001.yaml (context; do not change)"
    - "AGENTS.md, docs/task-lifecycle.md, docs/evidence-and-reproducibility.md, docs/claims-and-verification.md"
  constraints:
    - "The protocol is frozen. Any change requires a versioned protocol_amendment under experiments/EXP-SSI-001/amendments/ approved by the Coordinator; runs already executed are never re-scored against an amended criterion."
    - "Every run needs a manifest with exact command, git commit and dirty state, environment, seeds, stdout, stderr, raw results, validity status, timestamps, and resource measurements."
    - "claim_tier is toy: no conclusion above that tier; infrastructure failure is never evidence against the hypothesis (AGENTS.md rule 5)."
    - "Stopping and invalidation rules of the specification are binding; a timeout, crash, or implementation failure is reported as such, never as a result."
  deliverables:
    - "All artifacts enumerated in experiments/EXP-SSI-001/specification.yaml required_artifacts (per-run manifest.yaml, command.txt, environment.json, raw.json, summary.json, stdout.txt, stderr.txt)"
    - "experiments/EXP-SSI-001/execution-report.yaml"
  artifact_paths:
    - "experiments/EXP-SSI-001/specification.yaml"
    - "experiments/EXP-SSI-001/runs/"
    - "experiments/EXP-SSI-001/execution-report.yaml"
  write_scope:
    - "experiments/EXP-SSI-001/"
  archived_by: "TASK-20260727-905"
  inference:
    policy: "executor-implementation"
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 18900
    memory_gb: 8
    maximum_runs: 12
  completion_gate:
    - "Exactly 11 planned runs reach a terminal status (completed_valid, completed_invalid, failed_infrastructure, failed_implementation, resource_exhaustion, cancelled_by_budget)."
    - "Every required artifact in the frozen specification exists and is schema-valid."
    - "Validation checks pass: expected run count, no duplicated or missing seeds, raw/summary agreement, control comparability, no unrecorded protocol deviation."
    - "No claim above claim_tier toy; no status of any ledger record changed by the Executor."
  return_format: "Immutable run records per required_artifacts plus execution-report.yaml."
