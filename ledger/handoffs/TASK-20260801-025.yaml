handoff:
  id: TASK-20260801-025
  from: coordinator
  to: reviewer
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-023
  objective: >-
    Return PASS or REVISE on experiments/EXP-EQD-001/specification.yaml at the
    TASK-20260801-020 snapshot together with experiments/EXP-EQD-001/reading_rule.yaml at
    the TASK-20260801-024 snapshot and the calibration package at the TASK-20260801-022
    snapshot. SIX QUESTIONS DOMINATE AND EACH MUST BE ANSWERED EXPLICITLY AND SEPARATELY.
    (1) THE ONE-EIGHTH DENSITY DERIVATION, ATTACKED FIRST - the contract declines the
    reviewer's own forward guidance on the ground that (e_1, e_2) has admissible support of
    density about 1/8 in F_p x F_p, because the roots of S_3 are x-coordinates of points of
    E(F_p) and |X_E| is about p/2. Redo that derivation against the CAL-4 measured numbers,
    including the 2-torsion caveat - if #E(F_p) is even, halving is not a bijection on E and
    the realizable set of root pairs is smaller than all of X_E choose 2. IF THE DERIVATION
    IS WRONG THE DESIGN SHOULD MOVE BACK TOWARD THE GUIDANCE AS WRITTEN, and say so.
    (2) THE ATTAINABILITY DUTY, WHICH IS A NAMED DUTY WITH ITS OWN DELIVERABLE FILE - check
    ATTAIN-RR-EQD-1 band by band and branch by branch for N-0, N-5 (each of its three legs),
    N-1, N-2, N-4 and N-6, and for every rung of the resolution ladder, that some ACHIEVABLE
    measurement lands there GIVEN THE MEASURED CALIBRATION NUMBERS. Redo the arithmetic
    yourself - C(512, 2) = 130816, 130816/256 = 511 and 130816/4096 = 31.9375 expected per
    cell, the exact level 2/201 = 0.00995, the two-sided level 5/401 = 0.01247, the
    family-wise (1 - 0.00995)**8 = 0.9234, and the CAL-2 detection rates at every delta. IF
    ANY BAND OR BRANCH IS UNREACHABLE, THAT IS A REVISE. (3) THE ATS-1 ANTI-TUNING DUTY,
    WHICH IS A SEPARATE NAMED DUTY WITH ITS OWN DELIVERABLE FILE - verify AGAINST GIT that
    the frozen threshold rule PREDATES the calibration commit (the TASK-20260801-020 commit
    must be an ancestor of the TASK-20260801-022 commit and its tree must contain THR-EQD-1,
    CERT-EQD-1, CAL-STOP-1 and ATS-1 in full and no run artifact); that every number
    substituted into the reading rule IS the number the calibration actually measured, by
    recomputing the named order statistics from the archived replicate values yourself; that
    NO SELECTION AMONG ALTERNATIVES occurred where the contract permitted only a
    SUBSTITUTION; that any CAL-STOP-1 exclusion removed a variable and added none; and that
    the calibration package contains NO OBJ-REAL sample, no deterministic factor-base x-list
    and no statistic computed from one. IF THE CALIBRATION APPEARS TO HAVE TUNED RATHER THAN
    SUPPLIED, THAT IS A REVISE. (4) IS INT-2 THE INTERMEDIATE OR A NEW STAND-IN - attack the
    claim that (e_1, e_2) is a complete invariant of the half-arity partial map's image, and
    say whether CTRL-EQD-S3's 1000-per-cell point-arithmetic check through a non-reusing code
    path actually settles it. (5) IS THE NULL GENUINELY MATCHED - in count, map, enumeration,
    dependency structure, field, curve and code path, with the ONLY difference the source of
    the 512 points, per docs/inventor-protocol.md section 3.2; and does DV-1 through DV-4
    vary with what it measures, or is any of them a closed form in the protocol's own matched
    parameters in the way BATCH-021's charged-unit proxy was. (6) IS THE HEUR-DS-1 SCOPING
    HONEST - does the contract's relation_to_HEUR_DS_1_stated_precisely block, and the L1/L2/L3
    limb decomposition, hold up, or does any part of the design let an equidistribution result
    be read as a smoothness result. Independent session; do not author repairs.
  uncertainty_reduced: >-
    Whether an independent session concurs that the one-eighth derivation is sound, that
    every band and branch is reachable against the MEASURED calibration, that the calibration
    supplied numbers rather than tuning the experiment, that INT-2 is the intermediate rather
    than a stand-in, that the null is genuinely matched, and that the HEUR-DS-1 scoping is
    honest.
  inputs:
  - experiments/EXP-EQD-001/specification.yaml
  - experiments/EXP-EQD-001/reading_rule.yaml
  - experiments/EXP-EQD-001/implementation/eqd001_driver.py
  - experiments/EXP-EQD-001/implementation/implementation.md
  - experiments/EXP-EQD-001/results/calib/null_replicate_statistics.json
  - experiments/EXP-EQD-001/results/calib/power_curve.json
  - experiments/EXP-EQD-001/results/calib/instrument_characterization.json
  - experiments/EXP-EQD-001/runs/RUN-EQD-001-calib/manifest.yaml
  - ledger/hypotheses/H-EQD-001.yaml
  - ledger/decisions/DEC-20260801-007.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/archives/TASK-20260801-020/snapshot_commit_receipt.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/archives/TASK-20260801-022/snapshot_commit_receipt.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/archives/TASK-20260801-024/snapshot_commit_receipt.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-022/reviews/TASK-20260801-012/attainability_check.md
  - docs/inventor-protocol.md
  - docs/claims-and-verification.md
  constraints:
  - INDEPENDENT SESSION REQUIRED. You did not author the contract, the driver or the reading rule.
  - Verdict PASS or REVISE only.
  - >-
    THE ATTAINABILITY CHECK AND THE ANTI-TUNING CHECK ARE TWO SEPARATE NAMED DUTIES AND EACH
    GETS ITS OWN DELIVERABLE FILE - attainability_check.md and anti_tuning_check.md. A review
    that passes the contract without both verdicts is itself incomplete, and this instruction
    exists so that neither duty can be treated as implicit.
  - >-
    Redo every load-bearing arithmetic quantity yourself rather than accepting the contract's
    or the reading rule's numbers, INCLUDING recomputing the named CAL-1 order statistics
    from the archived replicate values.
  - >-
    MEASURE RATHER THAN REASON WHERE MEASURING IS CHEAP. That is the BATCH-022 lesson - two
    minutes of CPU caught two fatal defects that argument had missed.
  - If REVISE at any severity, the batch records NON-EXECUTION for the real arm under the one-cycle cap.
  - Test the pre-registration adversarially - try to construct a result the rule cannot classify, or classifies two ways, and say so if you find one.
  - >-
    Confirm the diagonal is excluded BY CONSTRUCTION at n = 130816 and that no arm can record
    a c_2 = 0 draw without firing N-0 - this is the RV012-A2 repair and you found that defect.
  - >-
    Confirm NO analytic-reference threshold exists anywhere - not chi-square, not uniform, not
    Dickman - which is the RV012-A1 repair, and say whether the repair is structural or
    cosmetic.
  - Confirm K = 256 is declared unattainable IN ADVANCE under POW-EQD-1 with its powering sample sizes stated, and that it is retained for nothing.
  - Confirm claim_tier toy; no S1_met, F1_met, F2_met, structure_gate_passed, no `support` and no asymptotic path under any branch; promotion gates G1-G4 remain OPEN.
  - Confirm no file under experiments/EXP-DS-001/ or experiments/EXP-SMTH-001/ is edited, and that H-DS-001, H-IC-001, H-STR-002 and H-SMTH-001 are untouched.
  - Confirm both runs declare manifest.yaml with the companion filenames tools/validate_ledger.py check_run requires - command.txt, environment.json, stdout.log, stderr.log, raw-result.json.
  - >-
    State explicitly that your review is independent in the AGENTS.md sense but NOT in the
    model sense under this harness, and that it is not admissible toward the three-model
    closure quorum of AGENTS.md rule 13.
  - MAKE NO COMMIT. Do not author repairs; report defects.
  - Do not alter any ledger record, and do not run the real arm or any part of it.
  deliverables:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/reviews/TASK-20260801-025/contract_review.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/reviews/TASK-20260801-025/attainability_check.md
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/reviews/TASK-20260801-025/anti_tuning_check.md
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/reviews/TASK-20260801-025/contract_review.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/reviews/TASK-20260801-025/attainability_check.md
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/reviews/TASK-20260801-025/anti_tuning_check.md
  archived_by: TASK-20260801-026
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 5400
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
  - >-
    PASS or REVISE recorded with rationale bound to the three named snapshots, with SEPARATE
    explicit verdicts on (1) the one-eighth density derivation against the CAL-4 numbers
    including the 2-torsion caveat, (2) attainability of every band and every branch
    delivered in attainability_check.md with the arithmetic redone independently against the
    MEASURED calibration, (3) ATS-1 compliance delivered in anti_tuning_check.md with the
    ancestry checked against Git and the substituted numbers recomputed, (4) whether INT-2 is
    the intermediate or a stand-in, (5) whether the null is genuinely matched and whether any
    decision variable is degenerate, and (6) whether the HEUR-DS-1 scoping and the L1/L2/L3
    limb decomposition are honest.
