  objective: >-
    Independently validate protocol_amendment v3 for EXP-ICINV-4d33aa at the
    committed snapshot 7b5575592, BEFORE any third execution is contracted. The
    question is whether SR3-v3 is genuinely frozen, arithmetically correct, and
    an admissibility control that has not been quietly sized to pass.
  why_now_and_not_after_execution: >-
    The gate has emitted INVALID twice and each attempt costs a full execution.
    Validating the rule before spending a third run is the higher-value ordering,
    and it is the ordering the campaign's own freeze-before-execution discipline
    implies. A defect found here costs nothing; the same defect found after
    execution costs the run and risks a third INVALID.
  target_of_review:
    - experiments/EXP-ICINV-4d33aa/amendments/v3.yaml
    - ledger/decisions/DEC-20260810-6b4554.yaml
  snapshot_commit: 7b5575592
  already_verified_by_the_dispatching_coordinator: >-
    Do not re-do these unless you dispute them; they are recorded so your effort
    goes elsewhere. Family-wise false-rejection probability recomputed as
    0.023909 against the recorded 0.023908. Sidak threshold for a 1% family-wise
    rate over 52 tests recomputed as 3.7277 against the recorded 3.7276,
    confirming 3.5 rejects MORE readily and the gate is therefore stricter, not
    relaxed. Kurtosis inflation at p = 6007, fb = 4 recomputed as 1.0344. The
    retired band's admissible deviation at the operating row recomputed as 128%.
    Both amendments parse; specification.yaml and amendments/v2.yaml are byte
    unchanged.
  checks_required:
    - >-
      V1. IS IT ACTUALLY FROZEN? Walk every rule in SR3-v3 and confirm no free
      parameter remains that a later session could choose after seeing a result.
      Any quantity described in prose but not pinned to a number, any threshold
      stated as a range, any estimator whose form is not fully determined, is a
      finding. This is the single most important check.
    - >-
      V2. ARE se_j AND sd_j CORRECT? The per-row tolerances are
      se_j = sqrt(2*mbar(1-mbar)/(n*T)) and
      sd_j = sqrt(2)*VR_ref*sqrt(2/(n-1) + gamma2/n). Derive both independently
      and confirm they are the sampling standard deviations of the differences
      they are applied to, with the factor-of-2 and factor-of-sqrt(2) terms
      justified by the two-sample structure rather than assumed.
    - >-
      V3. DOES THE FAMILY DEFINITION MATCH THE DECISION RULE? The family is
      declared as 13 rows x 2 primes x 2 statistics = 52 tests, but the
      aggregate rule is applied PER PRIME (at most 1 of 13 rows failing). Check
      the multiple-comparison accounting is coherent with how the rule actually
      fires, and that 52 is the right family size for the claim being made.
    - >-
      V4. IS THE POST-HOC DISCLOSURE COMPLETE? The amendment declares its
      direction post-hoc, flags G3b/G4 retention as a permissive post-hoc
      choice, and discloses the kurtosis correction's effect being largest at
      the failed rows. Look for any element chosen with reference to the
      observed failures that is NOT disclosed. An undisclosed one is a material
      finding; a disclosed one is not a defect.
    - >-
      V5. IS THE "NOT REVERSE ENGINEERED" ARGUMENT SOUND? The amendment argues
      the aggregate tolerance would not have rescued the observed failure, since
      two rows crossed and G2 permits one, so the cure is retiring the band (A8)
      rather than a tolerance sized to absorb it. Verify this holds, including
      whether the two failing rows would now pass their per-row z and w tests
      individually -- and if they would, whether that changes the argument.
    - >-
      V6. DOES ANYTHING DOWNSTREAM MOVE? The amendment asserts every rule
      converting measurements into claims is untouched (the 1.3 persistence
      threshold on Arm B, F_p >= 1/2, the three-prime majority, S1/S2/S3,
      OUTCOME-A/B/C, F-i to F-v, exploratory_only, the preliminary evidence cap).
      Diff the unchanged_and_still_frozen list against v2 and the specification
      and confirm nothing gating moved.
  constraints:
    - >-
      SC-1 FABRICATE NOTHING. Recompute what you verify; if you cannot check
      something, record it as unchecked rather than passing it.
    - >-
      SC-2 YOU MAY NOT CHANGE RESEARCH STATUS. Write your report only. Edit no
      committed record, including v3.yaml and DEC-20260810-6b4554. Do not commit.
    - >-
      SC-3 A CLEAN VALIDATION IS A VALID OUTCOME. You are not required to find a
      defect; manufactured findings are as damaging as missed ones.
    - >-
      SC-4 STAY OUT of RQ-CANL-63098f, DEC-20260810-2c7e3c and all EXP-CANL-*,
      which a concurrent red-team task is reviewing.
    - >-
      SC-5 DO NOT EXECUTE the experiment and do not dispatch execution.
    - >-
      SC-6 Toy scale, claim_tier toy, sota_delta zero. Assert nothing about
      ECDLP hardness in either direction.
