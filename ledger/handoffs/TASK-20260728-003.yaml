handoff:
  id: TASK-20260728-003
  from: coordinator
  to: validator
  batch_id: BATCH-010
  goal_id: GOAL-ECDLP-001
  authorizing_decisions: [DEC-20260728-001]
  title: >-
    Independently validate the EXP-RT1476-001 run set: integrity, controls, certificates,
    recomputed exponents, and whether the frozen protocol could have produced its stated
    conclusions at all

  objective: >-
    Decide, from the committed artifacts alone and without reading the Executor's analysis first,
    whether the EXP-RT1476-001 run set is VALID EVIDENCE, and independently recompute beta_deg and
    beta_ops from raw-result.json. Then, and separately, return a DESIGN-adequacy finding: whether
    this frozen protocol, as written and as implemented, was capable of returning a different
    answer than the one it returned.
  uncertainty_reduced: >-
    Whether the first measurement of the RT-1476-SUBRES-A1 exponents is admissible as evidence at
    all, and whether its numbers survive independent recomputation. An invalid or incomplete run
    set is not evidence; it goes back to the Executor with defects listed.

  inputs:
    - 'coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/archives/TASK-20260728-002/snapshot_commit_receipt.json - the binding for everything you review.'
    - 'experiments/EXP-RT1476-001/specification.yaml - the frozen protocol, including its stopping rules, seven invalidation rules, both criteria, the pre-registered three-way landing, and deviations_from_frozen_contract.'
    - 'experiments/EXP-RT1476-001/subresultant_meter.py - READ THE SOURCE. Do not accept any reported number without establishing what the code that produced it actually computes.'
    - 'experiments/EXP-RT1476-001/implementation_notes.md'
    - 'all 27 run directories under experiments/EXP-RT1476-001/runs/ - manifest.yaml, raw-result.json, certificates.json, command.txt, environment.json, stdout.log, stderr.log'
    - 'experiments/EXP-RT1476-001/results_summary.json and analysis.md - READ THESE LAST, after you have formed your own numbers.'
    - 'ledger/hypotheses/H-RT1476-001.yaml, ledger/decisions/DEC-20260728-002.yaml'
    - 'inputs/idea_generation_20260718_batch2.md lines 1286-1319 and 1388-1397 - the frozen contract and its red-team amendment'
    - 'coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/reviews/TASK-20260727-002/review_report.yaml - REV-20260727-002, the review that found EXP-GGM-001''s control gate tautological. Its method is the standard this validation is held to.'
    - 'AGENTS.md rules 3, 4, 5, 6, 7, 8, 9, 10; docs/claims-and-verification.md (claim tiers, certificates, refutation artifacts); docs/evidence-and-reproducibility.md'
    - 'harness/semaev.py and harness/toycurve.py - so you can re-verify certificates yourself'

  constraints:
    - >-
      INDEPENDENT NON-ORIGINATING SESSION. You did not author EXP-RT1476-001''s specification,
      H-RT1476-001, DEC-20260728-001 or DEC-20260728-002, and you did not implement or execute
      TASK-20260728-001. Attest all of that explicitly, and additionally state whether this session
      resolves the same model as the Executor's session, so any correlation is VISIBLE rather than
      assumed absent.
    - >-
      ESTABLISH THE BINDING FIRST. For every artifact you review, resolve the commit that supplies
      it, confirm it is clean at HEAD, and compute its SHA-256 from Git object content, never from
      the working tree. Check those values against the TASK-20260728-002 receipt. If the binding
      cannot be established, STOP and report a binding failure instead of a validation verdict.
      BATCH-009 proceeded past a missing snapshot receipt; do not repeat that.
    - >-
      FORM YOUR OWN NUMBERS BEFORE READING THE EXECUTOR''S. Recompute beta_deg and beta_ops
      yourself from raw-result.json - pooled, per seed, and all pairwise slopes - and only then
      open results_summary.json and analysis.md. Report any disagreement as a disagreement; do not
      reconcile it silently.
    - >-
      VALIDITY BEFORE INTERPRETATION. Check, and report a result for each: expected run count (27,
      or every absence accounted for by a named stopping rule); schema-complete manifests carrying
      the full AGENTS.md artifact policy block; seed integrity (does each recorded seed reproduce
      its recorded inputs?); raw-versus-summary agreement; and control comparability (do the three
      arms of each cell share p, n, L, seed stream, target count, PRS variant and operation
      counter, and differ in exactly the one declared respect each?).
    - >-
      RUN THE BYTE-IDENTITY CHECK EXPLICITLY. Hash all 27 raw-result.json files and report whether
      any two with differing inputs are identical. EXP-GGM-001 shipped nine byte-identical
      raw-result.json files from one computation and called it nine runs; this check exists because
      of that.
    - >-
      RE-VERIFY THE CERTIFICATES YOURSELF, independently of the Executor''s wrapper. For every
      claimed relation, check that the five signed summand points lie on E and sum to the target
      under the group law. Report the count checked, the count passing, and name every failure.
      An unverified success is not a success and one failure invalidates its cell (INVALID-3).
    - >-
      CHECK THE ANTI-TAUTOLOGY RULE BY READING THE SOURCE. Confirm that no threshold, expected
      value, verdict or answer key is visible to the measuring code path; that the module emits no
      pass/fail verdict; and that every per-run gate quantity actually appears in raw-result.json
      rather than only in stdout. A gate whose operands are two literals in the same source file
      carries zero information, and a figure that appears in no run artifact does not exist.
    - >-
      ADJUDICATE THE TWO CONTROLS AGAINST INVALID-4 AND INVALID-5 EXPLICITLY, and state the
      consequence in terms. If CTRL-POS fails to report beta_deg < 0.3 - i.e. the meter cannot see
      a PLANTED threefold exponent drop - then NO PRIMARY CONCLUSION MAY BE DRAWN IN EITHER
      DIRECTION, and in particular the main arm may NOT then be read as evidence against
      H-RT1476-001. Say so plainly if it happens.
    - >-
      CHECK THE SUCCESS-SUBSET RESTRICTION WAS ACTUALLY HONOURED. Confirm from the raw data that
      beta_ops was fitted on certified successes only and that ops_all was not pooled in. This is
      the red-team amendment and it is the single most likely place for the result to be quietly
      wrong in the favourable direction.
    - >-
      DESIGN-ADEQUACY FINDING, REQUIRED AND SEPARATE. No independent pre-execution design review of
      this specification exists; you are the compensating control and DEC-20260728-002 records that.
      Answer directly: could this protocol, as frozen and as implemented, have returned a different
      answer than it did? Name any step that could not have failed. Name any conclusion the
      protocol structurally cannot support. Report this SEPARATELY from the integrity finding.
    - >-
      SEPARATE PROCESS FROM SUBSTANCE, AND NEVER LET ONE STAND IN FOR THE OTHER. A defect in an
      artifact is a statement about that artifact. A timeout, crash or memory exhaustion is
      INFRASTRUCTURE SIGNAL under AGENTS.md rule 5 and is never negative evidence about
      H-RT1476-001. A process-invalid execution is not evidence in either direction.
    - >-
      RECOMMEND CEILINGS, DO NOT SET THEM. Recommend a claim_tier and a proof_status ceiling for
      any evidence record about this run set, and state the strongest refutation artifact the
      result admits if it is adverse (counterexample certificate, then derivation note, then
      declared empirical_only). Only the Coordinator records evidence, changes status, or closes a
      gate. RECOMMEND AT MOST; CHANGE NOTHING.
    - >-
      DO NOT RE-RUN THE EXPERIMENT. You may execute certificate re-verification and your own
      recomputation from the raw files, and nothing else. If you conclude that re-execution is
      necessary to decide the question, that conclusion IS a deliverable: record it as a required
      successor task.
    - >-
      Edit nothing under experiments/, ledger/ or knowledge/. Write only within your own write
      scope.
    - >-
      Nothing you write is evidence for or against ECDLP hardness. Maximum claim tier available to
      this task is toy. Record requested_policy review-adversarial, the resolved model identifier,
      reasoning effort actually used, probe status, fallback_used, and
      equivalence_to_requested_policy_claimed false if any substitution occurred.

  deliverables:
    - >-
      validation_report.yaml containing: independence_attestation (non-origination from the
      specification, the hypothesis, both decisions and the execution, plus the model-correlation
      statement); snapshot_validation (per-path commit and SHA-256 computed in this task from Git
      object content, checked against the TASK-20260728-002 receipt); runtime_receipt;
      integrity_findings with an explicit result for run count, manifest schema completeness, seed
      integrity, raw-versus-summary agreement, byte-identity, and control comparability;
      certificate_verification (checked, passing, failures named);
      independently_recomputed_exponents (beta_deg and beta_ops, pooled, per seed and all pairwise
      slopes, computed by you from raw-result.json before reading the Executor's analysis) with an
      agreement statement against results_summary.json; control_adjudication against INVALID-4 and
      INVALID-5 with the consequence stated in terms; success_subset_restriction_check;
      anti_tautology_source_check; design_adequacy_finding kept strictly separate from the
      integrity findings, answering whether the protocol could have returned a different answer;
      fired_stopping_and_invalidation_rules; recommended_claim_tier and recommended_proof_status
      ceilings; recommended_evidence_strength_ceiling; blocking_defects and non_blocking_defects
      each with a concrete fix; exactly one terminal_verdict from
      {VALID, VALID_WITH_SCOPE_REDUCTION, INVALID, CANNOT_DETERMINE}; verdict_rationale; and
      exactly one recommended_next_action.
    - >-
      adversarial_notes.md giving the strongest case that the measured exponents mean what the
      Executor says they mean, and the strongest case that they do not, in that order, and stating
      which one you could not break. Include the one check a third party could run on paper or on
      the committed raw files to decide between them.

  artifact_paths:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/validation/TASK-20260728-003/validation_report.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/validation/TASK-20260728-003/adversarial_notes.md
  write_scope:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/validation/TASK-20260728-003/
  read_scope:
    - AGENTS.md
    - CLAUDE.md
    - docs/
    - templates/
    - harness/
    - experiments/EXP-RT1476-001/
    - experiments/EXP-GGM-001/
    - ledger/hypotheses/H-RT1476-001.yaml
    - ledger/decisions/
    - ledger/goals/GOAL-ECDLP-001.yaml
    - inputs/idea_generation_20260718_batch2.md
    - inputs/main_research_ledger.md
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/
  archived_by: TASK-20260728-004
  review_required: false
  review_required_note: >-
    false because this card IS the independent review of the batch's only producer. Setting it
    true would demand a reviewer of the reviewer, which this batch neither budgets nor needs. This
    matches the BATCH-006 and BATCH-009 treatment and is recorded rather than assumed.
  depends_on: [TASK-20260728-001, TASK-20260728-002]

  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
    note: >-
      review-adversarial at xhigh, not review-breakthrough at max: this task validates a toy-tier
      measurement, not a claimed break, closure result or contradiction between validated evidence
      records, so AGENTS.md rule 12 is not engaged by it. IF the run set is valid AND beta_deg
      comes back below 0.3 - i.e. if the measurement would OPEN the only sub-rho window in the
      program - then that becomes a claim in rule 12's class, this validation does NOT discharge
      rule 12 for it, and a conforming review-breakthrough-at-max session on a backend that can
      reach that floor is required before any such reading is recorded. Say so in your report if
      that branch is reached. Record requested_policy, resolved model id, reasoning effort,
      fallback_used, and equivalence_to_requested_policy_claimed false if a fallback is used.

  budget:
    wall_clock_seconds: 3600
    memory_gb: 4
    maximum_runs: 1

  completion_gate:
    - 'Both artifacts exist and attest a non-originating independent session, including the model-correlation statement against the Executor session.'
    - 'Every reviewed path is bound to a resolved commit and a SHA-256 computed in this task from Git object content and checked against the TASK-20260728-002 receipt, or the task stopped with a binding failure and returned no verdict.'
    - 'An explicit result is recorded for run count, manifest schema completeness, seed integrity, raw-versus-summary agreement, byte-identity across all 27 raw-result.json files, and control comparability.'
    - 'Certificates were re-verified independently in this task, with counts and every failure named.'
    - 'beta_deg and beta_ops were recomputed in this task from raw-result.json before the Executor analysis was read, and the agreement or disagreement is stated.'
    - 'CTRL-POS and CTRL-NEG are adjudicated against INVALID-4 and INVALID-5 with the bidirectional consequence stated in terms.'
    - 'The design-adequacy finding is present and separate from the integrity findings, and answers whether the protocol could have returned a different answer.'
    - 'Exactly one terminal_verdict is returned, with recommended claim_tier, proof_status and evidence-strength ceilings.'
    - 'No experiment, ledger or knowledge file was modified, no record status was changed, and the experiment was not re-run.'
    - 'The report states plainly that nothing in it is evidence for or against ECDLP hardness, and that a timeout or crash is never negative evidence about the hypothesis.'
  return_format: >-
    Independent YAML validation verdict with recomputed exponents and a separate design-adequacy
    finding, plus a Markdown two-sided adversarial reconstruction.
  created_by: coordinator
  created_at: '2026-07-28'
