handoff:
  id: TASK-20260806-411ffd
  from: coordinator
  to: coordinator
  objective: >-
    Archive the validator report, mint and file a new EV-ECTD-* evidence
    record and a new DEC-YYYYMMDD-* decision, set H-ECTD-001 status per the
    validated decision_branch, and checkpoint GOAL-ECTD-001 (batch_checkpoints
    entry, current_batch_id, latest_verified_commit advanced to this commit,
    exactly one next_action).
  uncertainty_reduced: >-
    Whether BATCH-fca4e2's result is official, and what GOAL-ECTD-001's next
    action is.
  inputs:
  - TASK-20260806-4455ac snapshot receipt
  - TASK-20260806-5bc785 validation report
  constraints:
  - >-
    Only dispatch this task after TASK-20260806-5bc785 records a verdict; a
    validator invalid/incomplete verdict returns to the Executor with
    concrete defects instead of proceeding to a decision.
  - >-
    If decision_branch is scoped_homogeneity: record decision weaken (not
    reject_scoped) -- AGENTS.md binding rule forbids reject_scoped on a
    single unreplicated empirical-only run; forward guidance from
    H-ECTD-001/EXP-ECTD-001 stands (path-hiding, detection, vertical
    (017)/DDH (018) lanes remain open).
  - >-
    If decision_branch is heavy_tail_hit: record decision replicate, not
    support; do NOT authorize any trapdoor or asymptotic language; schedule
    a dedicated Red Team pass in the next batch before any stronger
    disposition, per GOAL-ECTD-001.completion_criteria (Validator AND Red
    Team must admit the decisive package) -- this batch's Validator alone
    does not satisfy that bar.
  - >-
    If decision_branch is instrument_void: record pause or a scoped
    harness-repair next_action; explicitly state this is not a mathematical
    negative on H-ECTD-001 (AGENTS.md rule 5).
  - >-
    If decision_branch is resource_incomplete: record a budget-scoped
    continuation next_action; explicitly not a homogeneity claim.
  - >-
    Fill knowledge_promotion on the decision: this is a first, unreplicated
    run set, so strength cannot exceed preliminary regardless of outcome;
    promote a KN-FIND only if a later replication independently confirms a
    heavy_tail_hit at strength replicated/strong; otherwise not_warranted
    with a concrete reason.
  - >-
    Advance ledger/goals/GOAL-ECTD-001.yaml.latest_verified_commit to this
    archive's own verified commit (do not leave it pointing at the prior
    batch's design snapshot -- see SCOPE-DECISION.md Section 4).
  - Exactly one next_action in the goal record.
  - >-
    Mint all new IDs via tools/allocate_id.py --next <type> --area|--date
    <x> --check; never invent an ID by inspection.
  deliverables:
  - EV-ECTD-8c098d.yaml
  - DEC-20260806-4a9604.yaml
  - updated GOAL-ECTD-001.yaml
  - ledger-receipt.json
  artifact_paths:
  - ledger/evidence/EV-ECTD-8c098d.yaml
  - ledger/decisions/DEC-20260806-4a9604.yaml
  - ledger/goals/GOAL-ECTD-001.yaml
  - coordination/goals/GOAL-ECTD-001/batches/BATCH-fca4e2/archives/TASK-20260806-411ffd/ledger-receipt.json
  archived_by: TASK-20260806-411ffd
  inference:
