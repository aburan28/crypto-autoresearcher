handoff:
  id: TASK-20260905-7ba385
  from: coordinator
  to: executor
  created_at: '2026-09-05'
  hypothesis_id: H-MONO-6adf3c
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001
  experiment_id: EXP-MONO-7f39bf

  objective: >-
    Implement and run EXP-MONO-7f39bf exactly as specified in
    `experiments/EXP-MONO-7f39bf/specification.yaml`: build the
    C_2^{m-2} character tower for the free summation coordinate with the
    m-2 factor-base coordinates fixed to concrete on-curve values and the
    target T held generic/symbolic during construction (NOT the
    already-decided full-locus case H-MONO-39b1f0 confirmed), then
    measure IDEA-20260807-5126f4's own two open predictions -- the
    filter's false-positive rate and its field-operation cost against the
    enumerate-and-test baseline -- at m in {4,5} and p in {211, 431,
    1009}. Stage 0 of the specification is a hard precondition gate: no
    number from a cell that fails or is flagged degenerate there may be
    reported as evidence for or against the idea's predictions.

  uncertainty_reduced: >-
    Whether IDEA-20260807-5126f4's actual, still-open partial-locus claim
    (as opposed to its already-decided full-locus null control) holds at
    toy scale: does the corrected character-tower filter achieve a
    false-positive rate substantially below 1, and does it cost fewer
    field operations than enumerate-and-test, once the construction is
    verified to be genuinely non-degenerate (T-dependent, not collapsed).

  inputs:
    - experiments/EXP-MONO-7f39bf/specification.yaml
    - ledger/hypotheses/H-MONO-6adf3c.yaml
    - ledger/hypotheses/H-MONO-39b1f0.yaml
    - ledger/decisions/DEC-20260905-7c2ad9.yaml
    - ledger/handoffs/TASK-20260905-153d93.yaml
    - harness/semaev.py
    - harness/toycurve.py
    - experiments/EXP-MONO-805a02/implementation/run_experiment.py (read-only reference; see specification's own `inputs.reference_implementation_read_only`)
    - knowledge/findings/KN-FIND-c41ea9.md

  constraints:
    - >-
      This handoff is issued while the contract's own `execution_authorized`
      is `false` and `approved_by` is `null`. DO NOT BEGIN EXECUTION until
      the Coordinator separately amends the specification to
      `execution_authorized: true` with `approved_by: coordinator` set. A
      dispatched Executor that finds this handoff without that amendment
      having been made is being asked to implement and dry-run
      (e.g. build the implementation, run Stage 0 only, or run against a
      tiny sample) is out of scope for this task card unless a fresh
      handoff says otherwise; treat an unamended `execution_authorized:
      false` as a stop condition, not a formality.
    - >-
      The reused-infrastructure paths (`harness/semaev.py`,
      `harness/toycurve.py`) are frozen as the required implementation
      base per the specification's own `invalidation_rules`; do not
      substitute a different S_m or curve-arithmetic implementation
      without a `protocol_amendment`.
    - >-
      `experiments/EXP-MONO-805a02/` is `frozen: true` and must not be
      modified, imported as a live code dependency, or re-executed; it is
      read-only reference material for the construction pattern only. A
      new, independent implementation is written under
      `experiments/EXP-MONO-7f39bf/implementation/`.
    - >-
      Stage 0's own construction (the two-branch discriminant/character
      derivation in the specification's `objective` and in
      H-MONO-6adf3c's own `mechanism` field) is a starting hypothesis
      about HOW the tower decomposes, not a guaranteed fact. If Stage 0
      finds a different branch structure or a different count of
      T-dependent character levels than predicted (named risks R1, R2 in
      the specification), report the actual construction found and
      proceed with Stage 1/2 using it, per the specification's own
      `invalidation_rules` -- do not silently patch the specification.
    - >-
      Never fabricate a run result, timing, or field-operation count.
      Where the UNIT-DECLARATION-TRIPWIRE control applies and no
      group-to-field-operation conversion is declared, report
      `refused_no_declared_conversion: true` rather than estimating one.
    - >-
      A `failed_infrastructure` abort at any stage (timeout, degenerate
      construction, Stage-0 root-set mismatch) is reported as
      infrastructure signal per AGENTS.md rule 5, never as evidence for
      or against IDEA-20260807-5126f4's predictions.

  deliverables:
    - experiments/EXP-MONO-7f39bf/implementation.md
    - experiments/EXP-MONO-7f39bf/implementation/ (source code)
    - experiments/EXP-MONO-7f39bf/runs/RUN-MONO-7f39bf-1/
    - experiments/EXP-MONO-7f39bf/runs/RUN-MONO-7f39bf-2/
    - experiments/EXP-MONO-7f39bf/execution_report.yaml

  artifact_paths:
    - experiments/EXP-MONO-7f39bf/

  archived_by: null

  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false

  budget:
    wall_clock_seconds: 3600
    memory_gb: 2
    maximum_runs: 2

  completion_gate:
    - >-
      Stage 0 gate reported pass/fail/degenerate per (p, m) cell,
      including the exact T-dependent character-level count versus the
      predicted m-2, per specification `observation_requirements`.
    - >-
      For every Stage-0-passing cell: false-positive rate, true-negative
      guarantee check, random-subset null, and field-operation cost
      comparison (amortized and un-amortized tower construction) all
      reported, at all three primes and both m values.
    - >-
      p=431 curve found by the specification's own deterministic search
      procedure, reported with #E(F_431) and its largest prime-order
      subgroup.
    - success_criterion in experiments/EXP-MONO-7f39bf/specification.yaml is met, per its own text.

  return_format: >-
    execution_report.yaml plus per-run run_record.yaml under
    runs/RUN-MONO-7f39bf-{1,2}/, following EXP-MONO-805a02's own
    battery-stage reporting convention (one block per STAGE id, forced
    outputs stated explicitly, pass/fail/degenerate reported per cell).
    This handoff does not itself authorize an evidence record; the
    Coordinator composes EV-MONO-* and a decision after independent
    review of the returned artifacts, per the completion_gate above and
    per AGENTS.md's validity checks before any result is treated as
    evidence.

  review_plan: null
