  constraints:
  - You are not alone in this codebase. Own only the three exact outputs. Preserve all other agents and historical
    files. No source, ledger, queue, claim, release, commit, push or status changes.
  - Verify input hashes. Use only declared inputs and own outputs. Read historical reports under the declared lift;
    no parent conversation or concurrent report. If live administrative bytes drift, read the hash-matching authority-commit
    version and disclose it.
  - Zero scientific runs. At most 160 TOTAL fixed static/arithmetic/synthetic/mock case executions INCLUDING every
    parameterized input, failed attempt and rerun. Keep a running count BEFORE each invocation and refuse a command
    that could exceed the remaining count. Reserve sufficient cases for one final fixed rerun; no extra arithmetic
    probes after completion. File hash/parse/source comparisons are administrative, not numerical cases. Each case
    <=10 seconds, aggregate executed-check wall and CPU <=1800 seconds, one worker, 2 GiB memory. Watchdogs protect
    the machine and checkpoint failures; they do not exhaust research.
  - No curve generation, experimental fixture or candidate search, real rho/BSGS experiment, null/bootstrap/control/timing
    panel, future-run entrypoint, launch signature or RUN record. Abstract mock arithmetic and fixed serialization
    predicates only. Record actual case counts, commands, failures, reruns, wall/CPU timing and limitations without
    fabricating telemetry.
  - Report PASS/NEEDS_CORRECTION/UNCHECKABLE separately for each of the four targets with exact scope, worked attacks,
    unresolved definitions and remaining implementation prerequisites. A pass is only prospective definition conformance,
    not scientific evidence or launch admission.
  - Native review-adversarial gpt-5.6-sol/xhigh independent session; no fallback, degradation or Bedrock. Do not
    read any private signing key.
