    - id: RC-2
      text: >-
        CHANGE NO RECORD. Write only inside your write_scope; do not write
        under experiments/; mint nothing. You do not amend the frozen
        prediction or correct H-GFPN-9a29be or RQ-GFPN-c01af8 even if K7
