        Coordinator acts.
    - id: RC-3
      text: >-
        RUN THE ARGUMENT UNCHANGED. Proves-too-much objects A and B use the
        producer's implementation/ code as committed (pdp_cell.py,
        gfpn5_core.py, symmetrize.py, verify_independent.py), driven by a
        harness under your scratch/ that supplies the curve, prime, arm and
        target seed; modifying its decision or lifting logic is not allowed.
        The exact enumeration of object A's fraction f is your own code and
        must not use the producer's solver path.
    - id: RC-4
      text: >-
        INFRASTRUCTURE IS NOT EVIDENCE. An msolve crash, timeout or cap hit in
        your scratch runs is reported as infrastructure; choose another
        prime from the set or report inconclusive (AGENTS.md core rule 5).
    - id: RC-5
      text: >-
        PROVENANCE. The FHJRV text is in-repo at
        research/equation-schemes-20260905/retrieved-pages/hal-00935050.txt;
        Joux-Vitse and Pornin are frozen under inputs/. Anything you recall
        rather than read is marked recalled and carries no verdict (AGENTS.md
        core rule 9). Amazon Bedrock is prohibited.
    - id: RC-6
      text: >-
        MACHINE PROTECTION. Every solver process under an explicit
        address-space cap at or below 12 GB, one at a time, never concurrent
        with another reviewer's solver process (host about 15 GB, no swap).
    - id: RC-7
      text: >-
        DO NOT CALL A BOUNDED CHECK AN IMPOSSIBILITY, and do not read any
        result here as closing the 2-torsion symmetrization lane or as
        deciding EcGFp5's security level; that would be a closure claim
        requiring review-breakthrough (AGENTS.md core rule 12).

