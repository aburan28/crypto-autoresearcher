  objective: >-
    Try to break the interpretation and the cost model of EXP-GFPN-05ff43
    before the Coordinator spends a decision or a rerun on it: attack whether
    arm (iii) as built can test the 2-torsion symmetrization (K5), whether
    the *_proxy operation counts can carry the conclusions they are used for
    (K6), and whether the frozen prediction is anchored to the system the
    design note actually costed (K7); and run the three proves-too-much
    objects on which the producer's arguments must fail. Return a per-joint
    verdict and a per-object outcome.

  uncertainty_reduced: >-
    Whether a rerun of EXP-GFPN-05ff43 as the producer recommends would test
    what H-GFPN-9a29be says it tests, against a correctly anchored
    prediction, in a unit that can carry the falsification criteria -- and
    whether the m = 4 random-target driver that EXP-GFPN-659e34 will reuse
    finds decompositions at the rate exact enumeration predicts.

  joints_owned:
    - label: K5
      joint: >-
        K5. ARM (iii) IS A VALID TEST OF THE 2-TORSION SYMMETRIZATION:
        whether the producer's construction (deviation D-6: the product
        S_{m+1}(x; X) * S_{m+1}(x^(1); X) with x^(1) = (b/x_1, x_2, ...,
        x_m), normalised into a polynomial in t_R = X + b/X and in the
        elementary symmetric functions of t_i = x_i + b/x_i, over the
        phi-factor base {P : x(P) + b/x(P) in F_p'}) realises the
        (Z/2)^{m-1} x| S_m quotient whose degree drop H-GFPN-9a29be
        predicts, or yields systems whose solution count cannot fall below
        arm (ii)'s, so that its m = 5 exhaustion carries no information
        about the FHJRV construction.
    - label: K6
      joint: >-
        K6. THE *_proxy OPERATION COUNTS ARE FIT FOR THE PURPOSES THE
        REPORT USES THEM FOR (deviation D-2): fp_operations_per_pdp is
        ops_proxy_reduction_total, a dense-elimination estimate from
        msolve's printed per-round matrix shapes plus an FGLM estimate and
        counted specialisation/lifting operations at 1 F_q mul = 29 F_p mul
        and 1 F_q inv = 150 F_q mul; it is used for per-PDP cost, for
        cross-arm ratios (fp_ops_ratio_raw_over_sym), for p-flatness
        (fp_ops_relative_variation), and would score F3's 2^36 threshold.
    - label: K7
      joint: >-
        K7. THE COST-MODEL PREMISE OF THE FROZEN PREDICTION: that the design
        note's "D ~ 2^{k(k-1)} = 2^20" and ">= 2^142" describe the RAW
        descended n = 5, m = 5 system, as H-GFPN-9a29be's statement and
        RQ-GFPN-c01af8's motivation assert, so that the frozen predictions
        D_raw about 2^20, D_S5 about 2^20/120, D_torsion_S5 about 2^20/1920
        and the band 2^121 to 2^132 are anchored to the right object.
  proves_too_much_owned: true
  proves_too_much_objects: >-
    OBJECT A (the "0/20 is the expected regime" argument at a small prime
    p' in {11, 31, 41}, with the exact m = 4 decomposable fraction f computed
    by enumeration and the producer's random-target path run on N targets
    with N*f >= 10), OBJECT B (arm (iii) built on the random_no2torsion
    curve at p' = 4111, m = 3, constructed-solvable), OBJECT C (the
    supplementary flatness reading applied to the planted-orbit size). Full
    statement and failure signature in review_plan.proves_too_much of
    TASK-20260923-fe27e4.
  joints_note: >-
    The joint statements above are verbatim from review_plan.joints of
    TASK-20260923-fe27e4; their attack plans bind you as a floor, not a
    ceiling (agents/red-team.md). You do not own K1-K4.

