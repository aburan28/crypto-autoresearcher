handoff:
  id: TASK-20260802-1f3aeb
  from: coordinator
  to: coordinator
  objective: 'Freeze, before any datum is produced, the complete experiment contract for red-team next-control
    NC-2: measure the true per-entry cost of Algorithm 1''s table construction in F_{p^2}-operations at
    p ~ 2^40, as a function of the isogeny degree ell and hence of the smoothness bound B, and state the
    extrapolation law that carries a measured exponent to the overhead parameter c of EXP-WESOVOW-001 BEFORE
    any measurement is taken.'
  uncertainty_reduced: Whether the deciding measurement for the NIST-I concrete question is specified
    tightly enough - controls, metrics, stopping rules, artifacts, and pre-registered extrapolation law
    - that its result cannot be reinterpreted after the fact.
  inputs:
  - inputs/P13-WESOLOWSKI-2026/paper_fulltext.md (Algorithm 1, Lemma 3.3, Section 4.1)
  - inputs/P13-PANNY-POC/p-one-third.py (SHA-256 4f43780404a7ab5db84db4bf7a3b6671d1503f75c5ca5305c1b2f9fb6cd32f9b,
    fetched 2026-08-02 from https://yx7.cc/files/p-one-third.py, Last-Modified 2026-07-23)
  - coordination/tasks/TASK-20260724-P13-RT/red_team_report.yaml (RT-C1, RT-S1, NC-2)
  - ledger/decisions/DEC-20260724-016.yaml (NC-2 as highest-priority next control)
  constraints:
  - 'The contract is frozen: it is written before the Executor runs and is not revised in light of results.
    A needed change is a superseding contract under a new id, never an edit.'
  - 'State the measured quantity exactly: cost(ell) = (F_{p^2} multiplications to instantiate Phi_ell(j,
    x) at a sampled supersingular j) + (F_{p^2} multiplications to find all its roots in F_{p^2}); entries(ell)
    = number of distinct non-backtracking ell-neighbours obtained; per_entry(ell) = cost(ell)/entries(ell).
    Counting unit is the F_{p^2} multiplication, because that is the unit paper Section 4.1 costs at 1
    per entry.'
  - 'PRE-REGISTER the fit and the extrapolation law before any datum: log2 per_entry(ell) = gamma * log2(ell)
    + const over a declared ell grid; the map to the EXP-WESOVOW-001 overhead knob is c = gamma * log2(B_opt)
    / sqrt(log2 p), with B_opt taken from RUN-WESOVOW-001''s recorded optima. Declare the grid, the sample
    size per ell, and the acceptance band for gamma in the contract, not afterwards.'
  - 'REQUIRE these controls, per docs/inventor-protocol.md ''controls before belief'': (C-NULL) a null
    object of the same shape - run the identical counting harness over a construction whose per-entry
    cost is O(1) by construction (fixed ell = 2 walk steps) and require the instrument to report gamma
    ~ 0 there; a counter that reports growth on the null object is an instrument artifact and voids the
    measurement. (C-INSTR) instrument fidelity on a case with an exactly known count, e.g. a schoolbook
    product of two degree-d polynomials over F_{p^2} must count exactly (d+1)^2 multiplications. (C-BASE)
    baseline reproduction: the re-implemented table build must agree with the frozen PoC''s own count()
    estimator for small (B, X), and any isogeny chain reported must satisfy Phi_ell(j_i, j_{i+1}) = 0
    at every step, verified independently of the code that produced it. (C-ALT) at least two independent
    root-finding implementations, so gamma is a property of the problem and not of one implementation;
    if they disagree, both are reported and the SMALLER per-entry cost is carried forward, because the
    attack-favourable corner is the honest one to hand the attacker.'
  - 'Declare the modular-polynomial provenance rule: Phi_ell must come from a recorded primary source
    with a fetch URL and SHA-256, or be computed in-repo by a method stated in the contract. Which route
    was used is recorded per run. If neither is obtainable inside budget, that is a recorded fetch obstruction,
    not a result.'
  - 'Declare stopping rules and the meaning of exhaustion: a truncated ell grid yields a gamma confidence
    interval over the range actually reached and is scoped evidence; a timeout, crash, or missing dependency
    is an infrastructure outcome and never mathematical evidence about the attack (AGENTS.md rule 5).'
  - 'Declare the non-claims explicitly in the contract: this measures a toy-scale exponent at p ~ 2^40
    over a small ell range; any statement about NIST-I is an extrapolation under the pre-registered law
    and must be reported as conditional, never as a measurement of a cryptographic-scale margin.'
  - Also write inputs/P13-PANNY-POC/source_record.yaml recording the PoC's URL, fetch date, byte length,
    SHA-256, upstream Last-Modified, its stated SageMath dependency, and the plain fact that SageMath
    is NOT installed in this environment - so the PoC serves as a frozen algorithmic reference for the
    re-implementation, not as the executed program. Do not editorialize the frozen file and do not modify
    it.
  - Assess whether docs/inventor-protocol.md Section 8 requires a proof_search_map here. This control
    is a measurement, not a proof-oriented proposal; if you conclude no map is required, record that conclusion
    and its reason in the opening report rather than silently omitting it.
  - Only the Coordinator may approve an experiment. This task approves EXP-PEC-6be870 for execution; it
    changes no hypothesis status and asserts no result.
  deliverables:
  - experiments/EXP-PEC-6be870/specification.yaml (frozen, approved, schema per templates/research-records.md)
  - inputs/P13-PANNY-POC/source_record.yaml
  - opening_report.md stating the batch objective, the pre-registered fit and extrapolation law, the control
    set, and the Section 8 applicability determination
  artifact_paths:
  - experiments/EXP-PEC-6be870/specification.yaml
  - inputs/P13-PANNY-POC/source_record.yaml
  - coordination/goals/GOAL-P13-001/batches/BATCH-002/tasks/TASK-20260802-1f3aeb/opening_report.md
  archived_by: TASK-20260802-df7df5
  goal_id: GOAL-P13-001
  batch_id: BATCH-002
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: true
    independent_session_required: false
  budget:
    wall_clock_seconds: 1800
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
  - 'specification.yaml exists, is marked approved, and contains: measured quantity, ell grid, sample
    sizes, controls C-NULL/C-INSTR/C-BASE/C-ALT, stopping rules, required artifacts, the pre-registered
    gamma fit and c extrapolation law, and an explicit non-claims section.'
  - source_record.yaml records the PoC provenance and the SageMath-unavailable fact.
  - The opening report records the Section 8 proof_search_map applicability determination.
