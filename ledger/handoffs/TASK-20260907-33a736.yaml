handoff:
  id: TASK-20260907-33a736
  id_allocation_provenance: >-
    Pre-minted and `--check`ed free by the orchestrating session and relayed to
    this Coordinator authorship in the BATCH-8f3e86 batch-open instruction.
    This authorship minted nothing and scanned no state for a maximum.
  recorded_at: '2026-09-07'
  goal_id: GOAL-ECDLP-bbc21f
  question_id: RQ-ECDLP-78dbc5
  batch_id: BATCH-8f3e86
  dispatch_queue: coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-8f3e86/dispatch_queue.json
  task_card: coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-8f3e86/tasks/TASK-20260907-33a736/task_card.yaml
  role: coordinator
  from: coordinator
  to: coordinator (archive)
  review_required: false
  runs_alone: true

  objective: >-
    COORDINATOR LEDGER ARCHIVE, RUNS ALONE, AFTER BOTH REVIEWS RETURN.
    Compose the two blinded reviewers' joint verdicts into one official
    disposition and commit it: the evidence record EV-ECDLP-6a4ebc, the
    coordinator decision DEC-20260907-6d9427 (which is ALSO the archival act
    that makes the v3 amendment's already-authored approval durable), the two
    reviewer reports, and a goal checkpoint shard for GOAL-ECDLP-bbc21f. This
    is the only task in BATCH-8f3e86 permitted to change official research
    state, and it is the point at which this batch's results become evidence
    at all.
  uncertainty_reduced: >-
    What the program officially concludes about T_sel = T/2 G3-feasibility at
    a in {1/16, 1/8} on EXP-ECDLP-612fb1 at N = 2^24 -- and whether clause
    (C1) of H-ECDLP-37dc01 reopens at a smaller a, stays closed, or remains
    contested. Also: whether GOAL-ECDLP-bbc21f's stale `next_action` (which
    still reads as if RANK 1 were unstarted, though the concurrent
    EXP-ECDLP-6ac801 lane executed much of it) is corrected in the checkpoint.

  inputs:
    - "coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-8f3e86/tasks/TASK-20260907-b2a8ad/validation_report.yaml -- the Validator's verdicts on J1, J2, J3, its j2_seal_manifest.yaml, and its review_attestation."
    - "coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-8f3e86/tasks/TASK-20260907-ee1ca7/red_team_report.yaml -- the Red Team's verdicts on J4, J5, J6, its objections and any obstruction block, and its review_attestation."
    - "coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-8f3e86/tasks/TASK-20260907-aad514/execution_report.yaml -- the producer's observations."
    - "coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-8f3e86/archives/TASK-20260907-7bf406/snapshot-receipt.json -- proof that the reviewed bytes were committed before review."
    - "ledger/handoffs/TASK-20260907-b2a8ad.yaml -- the AUTHORITATIVE copy of the review_plan, including the Coordinator's pre-recorded prior. The decision must compare that prior against what the review actually found and say plainly whether the prior was confirmed or overturned."
    - "experiments/EXP-ECDLP-612fb1/amendments/v2_to_v3.yaml -- the approved protocol whose approval this task's decision record finally archives."
    - "ledger/hypotheses/H-ECDLP-37dc01.yaml, ledger/evidence/EV-ECDLP-2e9680.yaml, EV-ECDLP-60e266.yaml, EV-ECDLP-f6b3f5.yaml, ledger/decisions/DEC-20260906-bcc097.yaml, DEC-20260907-9b1b02.yaml -- the chain this disposition must be consistent with."
    - "templates/research-records.md -- the schemas for evidence_record, coordinator_decision, goal checkpoint, obstruction, and knowledge_promotion."

  constraints:
    - "RUNS ALONE, AFTER BOTH REVIEWS. depends_on TASK-20260907-b2a8ad and TASK-20260907-ee1ca7. A missing, failed or cancelled review BLOCKS this task; it does not license composing the disposition from the half that returned."
    - "VERIFY VALIDITY BEFORE INTERPRETING ANYTHING (agents/coordinator.md): expected run count, schema-complete manifests, seed integrity, raw/summary agreement, control comparability. An invalid or incomplete run set goes BACK to the Executor as a scoped repair task with concrete defects listed -- it is not evidence and is not written up as a weak result."
    - "COMPOSE JOINTS; DO NOT AVERAGE OPINIONS. Each reviewer reported on its own three joints and is blind to the other three. The decision states the per-joint verdicts separately and then the composed disposition. A joint reported `breaks` is not outvoted by five that hold: name what it breaks and what follows."
    - "THE PRE-RECORDED PRIOR MUST BE ADJUDICATED EXPLICITLY. review_plan.coordinator_prior expects PASS at both a = 1/16 and a = 1/8, flags a = 3/16 as the thin proves-too-much object, and flags NULL_A_G3 as never previously measured. The decision record must state whether each of those expectations held. A prior the review overturns is one of the most informative results this program can produce and must be reported as such, not quietly dropped."
    - "PROVES-TOO-MUCH FIRING IS ADJUDICATED HERE AND NOWHERE ELSE. If the Red Team reports a PASS at a = 3/16 or a = 1/4 at r = 2 N = 2^24, or at r = 8 at any a, then per the amendment's own invalidation_rules NO PASS in this batch may be reported as support until the Coordinator explains it. The honest disposition in that case is `inconclusive`, with the firing stated first."
    - "REFUTATION ARTIFACT BEFORE ANY NEGATIVE DECISION. If the disposition is `weaken` or `reject_scoped`, seek the strongest checkable refutation artifact the result admits -- counterexample certificate, then derivation note, then a declared `empirical_only` basis -- and archive it in this same commit. `reject_scoped` on a single unreplicated empirical-only run is FORBIDDEN; use `weaken` plus replication."
    - "SCOPE EVERY CONCLUSION. Tested cells only: the generic keyed-random-function instrument, N in {2^20, 2^24}, T in {64, 256}, T_sel = floor(T/2), a in {1/16, 1/8, 3/16, 1/4}, r in {2, 4, 8}, seeds 1..5, exact basins. Claim tier TOY. No curve arm, no cryptographic N, no exponent claim -- the four asymptotic promotion gates of agents/coordinator.md are not engaged and must not be invoked."
    - "A G3 PASS IS A CEILING, NOT A MECHANISM. Zero online arms ran. The decision may say clause (C1) REOPENS at a smaller a; it may not say the online re-selection procedure attains that ceiling at any batch size U. DEC-20260907-9b1b02 already recorded this exact slide once."
    - "KNOWLEDGE PROMOTION IS A REQUIRED FIELD, NOT AN OPTION. Per agents/coordinator.md, fill `knowledge_promotion` on the decision: promote a KN-FIND when the disposition is `support` or `reject_scoped` on `replicated`/`strong` evidence (a proven boundary counts), otherwise record a concrete `not_warranted` reason. If promoted, follow /curate-knowledge and include the entry AND a regenerated knowledge/INDEX.md in THIS commit."
    - "GOAL CHECKPOINT, ONE SHARD PER BATCH, ADDITIVE. Write ledger/goals/GOAL-ECDLP-bbc21f/checkpoints/BATCH-8f3e86.yaml, at exactly that path -- it is declared in artifact_paths and the snapshot/ledger archive binds it. Shards are WRITE-ONCE. Preserve exactly ONE next action. Do NOT rewrite goal.yaml's history; if the head's next_action must change, do it additively per the sharded-goal convention. The goal STAYS `active`: a scoped rejection, an invalid run set, an exhausted batch or an impediment ends a TASK, never the campaign, and `paused`/`blocked` are not permitted statuses."
    - "GOAL HEAD IS STALE AND THAT IS ITSELF REPORTABLE. GOAL-ECDLP-bbc21f's committed next_action still reads as though RANK 1 were unstarted, while the concurrent lane BATCH-3c7493 / EXP-ECDLP-6ac801 executed much of it and closed with DEC-20260907-9b1b02 carrying `goal_id: null`. Record that in the checkpoint so the next session is not scoped against stale state."
    - "STAGE ONLY DECLARED PATHS, VERIFY HASHES, RECORD A RECEIPT. No `git add -A`. The commit changes exactly the declared artifacts and its message names the task and record IDs. Never rewrite history over pushed run records."
    - "BRANCH DISCIPLINE. Fetch origin/main and MERGE (never rebase) before committing; record the base commit and merge outcome in the receipt. Push and open or refresh the PR naming EV-ECDLP-6a4ebc, DEC-20260907-6d9427, TASK-20260907-33a736 and BATCH-8f3e86. A record that exists only in a local commit is unpublished, not durable. A sync conflict inside a ledger record is resolved by a NEW SUPERSEDING RECORD under a new id, never by editing one side."
    - "MINT NOTHING. EV-ECDLP-6a4ebc and DEC-20260907-6d9427 are pre-minted and reserved for this task. Any further identifier is allocated with `python3 tools/allocate_id.py --next <type> ... ` and `--check`ed -- never by grepping for a maximum."
    - "VALIDATE BEFORE COMMITTING: run tools/validate_ledger.py on the staged tree, and tools/check_review_independence.py on this review round. The independence checker may flag TASK-20260907-b2a8ad because its declared sources intersect its own blind_from -- that is the post-seal read the protocol requires, is declared in advance in review_plan.blind_rederivation.independence_checker_note, and is answered by the seal manifest's timestamp and read-list. Confirm it against the seal; do not wave it through unexamined."
    - "GIT EXECUTION NOTE: in this deployment the DRIVING SESSION runs the git commands. This handoff specifies exactly what must be authored, staged, verified, committed and pushed."

  deliverables:
    - "ledger/evidence/EV-ECDLP-6a4ebc.yaml -- the evidence record: the per-cell G3 verdict table at both N, the per-seed margins with TopShare and StaticCov beside them, every control outcome (NULL_A_G3 with its margin/margin_null ratio, NULL_B_G3, DECAY_G3 monotonicity, the proves-too-much verdicts), the STAGE 3A replication comparison, the blind re-derivation's sealed verdict and its agreement or disagreement at sign level, an honest evidence_strength, the disclosed independence limitation from review_plan.blind_rederivation.disclosed_limitation, and an obstruction block if the Red Team recorded one (with its resource_check)."
    - "ledger/decisions/DEC-20260907-6d9427.yaml -- the coordinator decision: the disposition (support | replicate | expand | refine | weaken | reject_scoped | inconclusive) with rationale and evidence references; the explicit adjudication of the pre-recorded prior; the per-joint verdict composition; the required `knowledge_promotion` field; the effect (if any) on clause (C1) of H-ECDLP-37dc01; the review-tier justification naming routing_rules id `unrecoverable-result-review`; any `procedure_deviations`; and -- STATED EXPLICITLY -- that this record is ALSO the archival act for the v3 amendment's approval, which experiments/EXP-ECDLP-612fb1/amendments/v2_to_v3.yaml carries as `approving_decision_ref: DEC-20260907-6d9427` with `approving_decision_status` recording that the record was authored later, by this task."
    - "ledger/goals/GOAL-ECDLP-bbc21f/checkpoints/BATCH-8f3e86.yaml -- the write-once batch checkpoint, AT EXACTLY THAT PATH: what BATCH-8f3e86 established, exactly one next action, the stale-head note, and the batch's budget accounting."
    - "coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-8f3e86/archives/TASK-20260907-33a736/ledger-receipt.json -- the post-commit receipt: commit_sha, parent_sha, per-path sha256, the origin/main base checked and merge outcome, the push/PR reference, and the validator/independence-checker outcomes."
    - "OPTIONAL AND CONDITIONAL: knowledge/findings/KN-FIND-<token>.md plus a regenerated knowledge/INDEX.md, in THIS commit, if and only if `knowledge_promotion` promotes."

  artifact_paths:
    - ledger/evidence/EV-ECDLP-6a4ebc.yaml
    - ledger/decisions/DEC-20260907-6d9427.yaml
    - ledger/goals/GOAL-ECDLP-bbc21f/checkpoints/BATCH-8f3e86.yaml
    - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-8f3e86/archives/TASK-20260907-33a736/ledger-receipt.json
  archived_by: TASK-20260907-33a736
  write_scope:
    - ledger/evidence/EV-ECDLP-6a4ebc.yaml
    - ledger/decisions/DEC-20260907-6d9427.yaml
    - ledger/goals/GOAL-ECDLP-bbc21f/checkpoints/
    - knowledge/findings/
    - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-8f3e86/archives/TASK-20260907-33a736/
  staging_scope:
    - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-8f3e86/tasks/TASK-20260907-b2a8ad/
    - coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-8f3e86/tasks/TASK-20260907-ee1ca7/
  staging_scope_note: >-
    The two reviewer task directories are AUTHORED by the reviewers and merely
    STAGED here, unmodified and hash-verified, so the reports are committed in
    the same act as the disposition they support. write_scope above -- the set
    this task authors -- is disjoint from every other task's write_scope in
    BATCH-8f3e86. knowledge/findings/ is in write_scope conditionally: it is
    written only if `knowledge_promotion` promotes, and a regenerated
    knowledge/INDEX.md accompanies it in the same commit.
  read_scope:
    - experiments/EXP-ECDLP-612fb1/
    - coordination/goals/GOAL-ECDLP-bbc21f/
    - coordination/experiments/EXP-ECDLP-6ac801/
    - ledger/
    - knowledge/
    - templates/
    - docs/

  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  inference_note: >-
    Matches orchestration/model-policies.yaml `routing_rules` id
    `coordinator-code-path` (`task_requires_repo_orchestration: true`), which
    requires `coordinator-orchestration-code`; that policy's own
    `may_change_official_state: true` is what this task needs and what no
    review policy has. `fallback_allowed: false` because the declared fallback
    (`coordinator-orchestration`) is the contract WITHOUT the repository code
    path, and this task stages, hashes, validates and commits repository
    state. NOTE THE ASYMMETRY AND IT IS DELIBERATE: the REVIEW tasks run at
    `review-breakthrough`/`max` because the routing rules send a
    prior-evidence contradiction there; the ARCHIVE tasks are orchestration,
    not review, and the tier that reviews a claim is not the tier that commits
    it. This task composes verdicts it did not produce and may not re-litigate
    them.
  budget:
    wall_clock_seconds: 1800
    memory_gb: 2
    maximum_runs: 0
  budget_note: >-
    Zero-run task: it executes no experiment. 1800 s against the 1200 s used
    by the equivalent ledger archive of this goal's previous batch
    (TASK-20260906-ae5bb4, BATCH-f3a30a); the increase is for composing SIX
    owned joints across two blinded reports plus adjudicating a pre-recorded
    prior and a possible proves-too-much firing, which that batch did not
    carry. 2 GB is ample for YAML authorship, hashing and validator runs; it
    runs alone on a 4-core, 15 GB container. Both figures are machine
    protection, not a research cap.

  completion_gate:
    - "Both reviewer reports are present with complete review_attestation blocks, and the review round's independence is checked: every joint owned, every assigned reviewer attested, read_sibling_reports false on both, and the Validator's blind_from respected per its seal manifest's timestamp and read-list."
    - "The run set has been validated for expected run count, schema-complete manifests, seed integrity, raw/summary agreement and control comparability BEFORE any interpretation, and an invalid set was returned to the Executor as a scoped repair task rather than written up."
    - "EV-ECDLP-6a4ebc.yaml exists with the full per-cell verdict table, per-seed margins with TopShare and StaticCov reported separately, every control outcome, the blind re-derivation comparison at verdict and sign level, an honest evidence_strength, and the disclosed independence limitation."
    - "DEC-20260907-6d9427.yaml exists, states the disposition with rationale and evidence references, ADJUDICATES THE PRE-RECORDED PRIOR expectation by expectation, composes the six joint verdicts, fills `knowledge_promotion` (promotion or a concrete not_warranted reason), names routing_rules id `unrecoverable-result-review` as the review tier's basis, and states plainly that it is also the archival act for the v3 amendment's approval."
    - "The write-once goal checkpoint shard exists at exactly ledger/goals/GOAL-ECDLP-bbc21f/checkpoints/BATCH-8f3e86.yaml, preserving exactly ONE next action, recording the stale-head finding, and leaving the goal `active`."
    - "If the disposition is `weaken` or `reject_scoped`, the refutation artifact it rests on is archived in this same commit, and `reject_scoped` is not asserted on a single unreplicated empirical-only run."
    - "tools/validate_ledger.py passes on the staged tree; tools/check_review_independence.py has been run and any flag on TASK-20260907-b2a8ad is answered against its seal manifest rather than waved through."
    - "The commit changes exactly the declared paths, names the task and record IDs, records commit_sha/parent_sha/per-path sha256 in ledger-receipt.json together with the origin/main base and merge outcome, and the branch is pushed with a PR open against main naming the new records."
    - "goal.yaml's history was not rewritten, no existing ledger record was overwritten, and no run record, specification or amendment was modified."

  return_format: >-
    The committed records plus ledger-receipt.json. State the disposition in
    one sentence first, then the six joint verdicts, then whether the
    Coordinator's pre-recorded prior held, then the single next action. If the
    evidence cannot discriminate between explanations, say `inconclusive`
    plainly -- do not manufacture a disposition the runs do not support.
