  objective: >-
    PART A -- THE CONFOUND-BREAKING 2x2 FACTORIAL (new sampling). For shard 5000
    and shard 8002 SEPARATELY (no cross-shard pooling anywhere), for each decode
    variant (unmodified decode_blocks, V3-defected wrapper), make EXACTLY ONE
    call to stage_a.py's real, unmodified _t_shard via matched_pair.py's run_arm
    at n_trials=75000 -- never split into separate calls, because a second call
    restarts trial indexing at 0 and silently re-derives an already-consumed
    domain. Discard indices [0:30000) from every statistic (computed, never
    skipped -- they carry the disjointness proof) and slice four retained
    windows, identical for both shards: P1=[30000:35000) (T=5,000, batch size
    25), P2=[35000:45000) (T=10,000, batch size 50), N1=[45000:55000)
    (T=10,000, batch size 50), N2=[55000:75000) (T=20,000, batch size 100).
    START_INDEX=30000 is strictly above every previously consumed index on
    either shard and is set EQUAL for both arms so absolute trial-index position
    is common to both rather than confounded with which arm it is. Compute, per
    shard, using matched_pair.py's own arm_hists / evaluable_k /
    matched_pair_stats (imported read-only, never re-derived), at k=17 and every
    k in 2..26 intersected with each window's evaluable range: diff, se_paired,
    se_unpaired, unpaired/paired ratio, z_paired, z_unpaired. Then compute FOUR
    single-shard-only 2-point local exponents by the same
    alpha = -[log(SE_hi)-log(SE_lo)]/[log(T_hi)-log(T_lo)] method
    TASK-20260814-8bbdd2 and TASK-20260815-e61cca used: alpha(5000,P) from
    P1->P2, alpha(5000,N) from N1->N2, alpha(8002,P) from P1->P2, alpha(8002,N)
    from N1->N2. Report the three pre-registered contrasts: regime main effect =
    mean(P cells) - mean(N cells); shard main effect = mean(5000 cells) -
    mean(8002 cells); interaction = (alpha(5000,P)-alpha(5000,N)) -
    (alpha(8002,P)-alpha(8002,N)). CITE, never recompute, the four historical
    cells (5000 regime P = 2.836 and 6000 regime P = 1.402 from EV-HQC-469c08
    O6; 8001 regime N = -0.2682495157085447 and 8002 regime N =
    -0.8662355237627483 from EV-HQC-927899 O3-O4), and report alpha(5000,P)
    beside the historical 2.836 and alpha(8002,N) beside the historical
    -0.8662355237627483 as the family's FIRST fresh-range replications of an
    existing cell at the same (shard, regime).
    PART B -- THE NULL-OBJECT CONTROL ON THE DIAGNOSTIC ITSELF (no decoder
    calls). Build a decoder-free, shard-free, defect-free i.i.d. parametric null
    object: per-trial S drawn as the sum of n_e=56 independent Bernoulli(p)
    block indicators, i.e. S ~ Binomial(56, p), with p calibrated ONCE before
    any ladder replicate by matching E[S] to the mean per-trial S of the real
    UNDEFECTED arm at window P2 of shard 5000, then frozen in design.md and held
    fixed for every rung, replicate, arm and the sensitivity leg. Both arms of
    every synthetic matched pair share the IDENTICAL law and differ only in RNG
    stream, so THREE quantities are forced analytically: log2 A_k = 0 exactly at
    every k (A_k = 1 is a theorem on the independent-block null), paired diff =
    0 exactly at every k, and the 2-point local exponent alpha = 0.5 exactly.
    Feed synthetic arrays through the SAME arm_hists / evaluable_k /
    log2_A_from_hists / matched_pair_stats / 2-point-OLS path Part A uses -- the
    pipeline IS the object under test, so no stage may be bypassed or
    reimplemented. Run the ladder at T in {5000, 10000, 20000, 40000} (batch
    sizes 25, 50, 100, 200; the adjacent pairs 5000->10000 and 10000->20000 ARE
    the two contested regimes exactly) at R=200 independent replicates per rung,
    streaming one replicate at a time. Report, per rung, log2 A_k and paired
    diff against their forced zeros; per adjacent rung pair, the alpha replicate
    distribution (mean, SD, 2.5/50/97.5 percentiles) against the forced 0.5; the
    four-rung full-ladder OLS exponent with 2 residual degrees of freedom and
    the scatter of 2-point estimates about it; and an explicit comparison of the
    5000->10000 and 10000->20000 null distributions, which is a decoder-free,
    shard-free test of the confound hypothesis itself.
    PART B SENSITIVITY LEG (mandatory, anti-blindness). At the T=20,000 rung,
    generate a dispersion-scaled variant arm for each pre-registered g in
    {1.25, 1.5, 2.0}; MEASURE (never predict) rho_g = se_paired(planted) /
    se_paired(unmodified) over the same R replicates; check the forced identity
    alpha_planted = alpha_unmodified - log2(rho_g) (since log2(20000/10000)=1)
    and report its residual; and report per g whether the planted distribution
    lies outside the unmodified null 95% band. OBSERVATIONS ONLY throughout.
  uncertainty_reduced: >-
    Whether the sign and magnitude of this family's single-shard-only 2-point
    local exponent track the SHARD or the TRIAL-COUNT/BATCH-SIZE TRANSITION
    REGIME -- currently indistinguishable, because the two are exactly collinear
    in all four measurements ever made and no shard has ever been run at the
    other pair's regime. And, prior to that, whether the diagnostic can resolve
    anything at all: a two-point log-log slope has zero internal degrees of
    freedom and its sampling distribution has never been measured, so the
    null-object control establishes for the first time what value the diagnostic
    returns on an object whose answer is known analytically (0.5), how far it
    scatters at each batch size, whether that scatter is itself batch-size
    dependent on an object with no shards and no decoder, and whether a planted
    departure can be detected at all.
