  title: >-
    Revise S1 to version 4: write H-BINSTD-14f77e and EXP-BINSTD-a222b4
    (approved_by null) superseding H-BINSTD-099d93 and EXP-BINSTD-8cb697, and
    a new audit sheet with committed, import-safe code and a false-pass sweep,
    discharging every revision requirement of DEC-20260929-54dcd8
  objective: >-
    Run /design-experiment on IDEA-20260926-20ba8f under RQ-BINSTD-b6f698 as a
    version-4 revision within DEC-20260928-63addc S1 scope and design
    conditions C1 to C8 unchanged. Write H-BINSTD-14f77e and EXP-BINSTD-a222b4
    (status review_required, approved_by null), each complete in itself and
    each carrying supersedes naming its version-3 record, and a new
    proof-search-map audit sheet whose code blocks are committed and
    import-safe. Discharge DEC-20260929-54dcd8's breaking item R3-J3-1 and
    every required_moderate and required_minor item by number (listed under
    revision_items below), and answer every recommended_not_required item,
    with the constants, the committed m = 4 range and the Stage 0 arithmetic
    unchanged or every change listed in a constants_delta block. Zero runs.
  uncertainty_reduced: >-
    Whether a complete protocol exists whose decision table routes every
    consequence it declares tested out of POSITIVE when its own statistic
    flags it at its own threshold, with every gate's false-fail rate under its
    own model small at every cell regime and every coset factor it admits.
  revision_items:
    source: DEC-20260929-54dcd8 revision_requirements, verbatim in substance; the decision is the authority where wording differs
    breaking:
      - id: R3-J3-1
        requirement: >-
          Make the decision table route every consequence the contract
          declares tested. PREFERRED REMEDY: add two per-cell gated tests to
          gate_tests, and so to G1 (a). T_kappa: |z_kappa| at most 3.3, low
          when z is below 0. T_rho: |ln rho_rel| at most 3.3 sqrt(exp(-mu_c) /
          B_c), low when rho_rel is high. Keep both out of COVERAGE_TESTS so a
          coverage deficit classes LOW-RETRY. Then restate
          outcome_table.per_cell_class (the R2-J3-4 mapping) and
          H1-NEGATIVE-YIELD to match the code exactly. Add generative patterns
          for 5 and 10 percent low-dispersion matched-mean deficits to
          outcome_patterns with their declared assignments, and have the
          session re-run the outcome patterns and the calibration Monte Carlo
          as producer computations (C-4, C-6), restating the per-cell
          false-fail rates with the new tests. PERMITTED ALTERNATIVE, only with
          a recorded reason why gating is not adopted: declare H1 (e)
          reported-not-gated, and remove target coverage and the
          relation-phase yield from statement (D), from H1's tested
          consequences, from the H1 validation_plan power sentence and from
          certifies_only, stating the deficit range the table routes to PASS.
          EITHER WAY, the audit sheet adds a false-pass sweep: for every
          consequence the contract says it tests and every certifies_only
          item, it records the smallest deviation the contract's own statistic
          flags at its own threshold and the class and outcome the committed
          table assigns to it (produced by committed code, C-5).
        opener_note: >-
          Not a relaxation and not a new requirement; a pointer to the
          cheapest falsification (DEC-20261002-f61a75 rationale). The
          preferred remedy's T_kappa band (|z| at most 3.3) and the contract's
          own deficit flag (yield_audit, z at or below -3) differ, so a
          deficit with z in (-3.3, -3] is flagged by the contract and passes
          the gate. The false-pass sweep governs: close the seam (align the
          thresholds and restate the per-cell false-fail rates accordingly)
          or declare it with its routing under the permitted alternative's
          honesty rule. State which, and why.
    required_moderate:
      - id: R3-J4-1
        requirement: >-
          Wording only. Beside the column-value c-range of the TW-01
          containment clause (tw01_caution; tripwire_preregistration; D-12),
          state the matched-advice range: the first-below-the-line restatement
          holds for c below about 1.67 on the committed m = 4 range, about
          1.54 with the online attempt constant charged, and 1.54 to 1.60 at
          B = B_cap(m) on that basis. State that the failure description at
          the Bernstein-Lange constants already applies from c of about 1.67
          for bases above B_cap(4). The routing rule is unchanged.
    required_minor:
      - id: R3-J3-2
        requirement: >-
          Charge the coset factor: predict the binary cells at the measured
          f mu_c (the |F_i| are counted at setup), or admit f at most 1.02 as
          an admission rule. Disclose the coset-subgraph structure of the
          binary relation graphs in A5. Whichever is chosen, f enters every
          prediction it affects (a_pred, kappa_pred, the band widths) the same
          way, and the per-cell false-fail table of C-4 is stated at
          f = 1, 1.02, 1.05 and 1.10 under that choice.
      - {id: R3-J3-3, requirement: 'Align the text of IR-5 (a) and RB-IR5 with ir5_check, or split the flag so the text and the code assign the same consequence.'}
      - {id: R3-J3-4, requirement: 'Make the null arm''s extra target attempt every 4 B relations fire independently of the check cadence, or state the cadence dependence.'}
      - {id: R3-J3-5, requirement: 'Reword "equal per-test false-fail rates on all three cells, by construction": the per-cell bands equalise the nominal sd multiple only.'}
      - {id: R3-J1-1, requirement: 'Correct the LA-iteration-constant restatements (H statement (B), H asymptotic_claim.hidden_cofactor, E definitions.cap_locus_and_constants): the m = 4 cap slice lower edges rise by up to 2.00 and 3.17 bits at k = 2, 3; the critical and closing values move by at most 0.02. Optionally print the cap slice in la_sensitivity.'}
    recommended_not_required:
      - 'RC-3: a physical negative-control cell for H1 (for example a Z/NZ cell with a structured repeated-sums base of KN-FIND-007''s type, expected to read LOW-RETRY with a coverage deficit). If not added, state why.'
      - 'O-J2-1: null the axis labels in stage2_outcome when the contract label is RUN-ARTIFACT.'
      - 'O-J2-2: read the in-cell certificates as a second guard beside verify.py IR2_fired.'
      - 'J3-O7: a cheap gate on per-target generic group operations (at most a fixed multiple of attempts).'
      - 'OI-5: a code-review card for the I3 to I5 code in the execution batch before Stage 2 (the contract recommends it and cannot bind it).'
      - 'OI-2: vendor the three retrieved PDFs under inputs/ with their sha256. If done, the vendored files are a scope change returned to the Coordinator, not written by this card.'
    carried_unchanged: >-
      Everything DEC-20260929-54dcd8 records as holding: the constants, the
      column, the windows, the committed m = 4 range, Stage 0 code, the
      conventions, wording, exclusions, controls, the IR-5 scoping, the
      per-cell bands and the self-test wiring. Any edit to any code block
      re-pins its reference sha256, and IR-6 and S1b name
      TASK-20261002-c21ce2's extracted_sha256.
  allowed_session_computations:
    authority: DEC-20261002-f61a75 R-PRODUCER-COMPUTE, stated in advance
    note: >-
      The producer session may ask the top-level session to perform these and
      only these, in the scratch subdirectory
      <session scratchpad>/BATCH-f6b7c5/TASK-20261002-b75ae9/, and embeds each
      command and its verbatim output in the audit sheet as a design figure,
      never a result. Each is run against the code blocks as written in the
      audit sheet and extracted by the pinned method.
    items:
      - C-1 extract each committed code block (fixture_code, stage0_code, and any calibration, sweep or outcome-pattern block) by the pinned method and compute its sha256
      - C-2 a syntax check and an import-safety check of each block in a fresh interpreter (importing executes nothing)
      - C-3 run stage0_code through its __main__ entry and relay its output verbatim
      - >-
        C-4 run the committed Monte Carlo of the contract's abstract model (no
        curve, no oracle, no instrument, no fixture) for the per-cell
        false-fail calibration with the version-4 gate set, on CTRL-ZN and both
        binary cells, at coset factors f = 1, 1.02, 1.05 and 1.10 as the
        contract charges f, with its seed recorded, and relay its output
        verbatim
      - >-
        C-5 run the committed false-pass sweep: synthetic test results fed
        through the committed classify_cell and stage2_outcome, recording for
        every consequence the contract declares tested and every
        certifies_only item the smallest deviation the contract's own
        statistic flags at its own threshold (both directions where
        two-sided; low and high dispersion where a mean is matched) and the
        class per cell and contract label assigned; relay its output verbatim
      - C-6 run the committed code's outcome-patterns entry (including the 5 and 10 percent low-dispersion matched-mean deficit patterns) and relay its output verbatim
    forbidden: >-
      Anything else: no fixture run, no oracle call, no curve arithmetic
      beyond Stage 0, no cell measured, no driver written or executed, nothing
      importing anything under experiments/*/runs/.
