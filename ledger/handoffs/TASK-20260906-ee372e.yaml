    - DO NOT REPAIR CF-14 - RT-8 asks for a disclosure note and expressly NOT a repair; repairing it is unmandated widening and is a stop condition.
    - DO NOT RESOLVE RT-6, RT-9(a) OR RT-12; they are reserved to the ENACTING decision. If your text touches what they concern, say what you did NOT decide.
    - THE R3 WARRANT SENTENCE - you may NOT rest on the refuted derivation and may NOT silently substitute the repaired one. State that C3's second clause instantiated at w = M IS C4, so the C3 route is the same inference from a strictly stronger premise and not a second source; and where you rely on the repaired monotonicity route, NAME IT AS REPAIRED and state the two restored premises. Do not assert that any committed record is wrong.
    - IMPLEMENT THE CONTROL AS A STANDALONE COMMITTED SCRIPT asserting P1 (the amended text parses), P2 (metrics is a list of exactly 7 items), P3 (metrics[5] is a single-key mapping) and P4 (metrics[5] equals the parse of clause_1's own replacement text), exiting nonzero and naming the failing assertion.
    - P4 IS NOT OPTIONAL - the UNAMENDED file already has a 7-element metrics list whose item 5 is a single-key mapping, so a control asserting only P1-P3 PASSES ON THE FILE IT EXISTS TO DETECT THE AMENDMENT OF. That is RT-3's failure mode inside the control written to answer RT-1.
    - EXERCISE THE CONTROL ON FIVE NAMED OBJECTS and report what it actually did on each - the unamended file (FAIL on P4), the superseded clause_1 spliced (FAIL on P1, parse error named), a parsing replacement with a metrics length other than 7 (FAIL on P2), a parsing replacement making metrics[5] a string (FAIL on P3), and the real redraft (PASS).
    - SPLICE AND PARSE ALL FOUR CLAUSES and report the resulting key lists; clause_4 is the clause being edited most and nobody has spliced it in a repaired form.
    - WRITE NOTHING OUTSIDE YOUR TASK DIRECTORY; no __pycache__ inside a snapshot-bound directory - set PYTHONDONTWRITEBYTECODE=1 and sys.dont_write_bytecode - and verify with `git status --porcelain`, reporting what it showed.
    - CONSTRAINT (i) IS ABSOLUTE - no clause may change, replace, adjust or condition itself on any of the ten source-derived anchor values. If the redraft would need one, stop and return the object to the Coordinator.
    - RESTATE THE CITATION PROHIBITION AND ITS PREDICATE EXTENSION VERBATIM, lift neither, and state whether either fired. Quoting the contract's text and the replacement text is permitted; deriving, recomputing, tabulating or citing a crossover, a baseline-comparison sign, a margin or a speedup is NOT, including while arguing that the draft should have stated one.
    - maximum_runs bounds executions of experiment code, producer implementations and anything that writes a run record; your control script and scratch scripts are NOT runs (DEC-20260904-166ab5 PD-4). This batch authorizes ZERO new experiment runs.
    - RECORD YOUR INFERENCE PROVENANCE HONESTLY - requested policy, adapter-resolved model identifier, self-report if it differs, model_verified and whether a probe was actually run, effort, fallback status - escalate any divergence, never record a probe or a model identity you did not obtain, and disclose what your launching prompt told you (CF-15).
    - Change no status, write no ledger record, commit nothing, approve nothing, repair no other artifact, and make no security, SQIsign, CSIDH, standardized-parameter, exponent or asymptotic claim in either direction.
    - Never select a provider, backend, endpoint, or model identifier containing Bedrock, case-insensitively.
