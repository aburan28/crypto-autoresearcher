    - NEVER EDIT, ANNOTATE, MARK OR DELETE THE SUPERSEDED DRAFT. BATCH-752ef2 is immutable and snapshot-bound. Your record states the supersession from ITS OWN SIDE, which is the only side that may.
    - NEVER EDIT specification.yaml - not one line, not a comment, not a reformat - and NEVER write an amended copy of it anywhere inside the repository, even temporarily, even under another name. Splice in memory or in a scratchpad outside the repository.
