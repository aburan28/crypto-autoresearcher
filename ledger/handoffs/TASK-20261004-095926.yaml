  attack_plans:
    W1: >-
      W1 -- RANK, STANDARD-MONOMIAL ARITHMETIC AND THE VERDICT RULE. That the quantities a degree-capped closure reports (the number of monomials
      of size at most D, the rank, the standard-monomial count over ALL sizes, the leading-monomial data) mean what the verdict rule needs:
      "sufficient" is std = |V|, "insufficient" is std > |V|, "std < |V|" is impossible for a closure inside the ideal; std can exceed (columns
      minus rank) because standard monomials above degree D are counted; a missing product can only RAISE std while an out-of-ideal row can lower
      it; and which polarity depends on the monomial order.
      ATTACK. BLIND LANE, from the statement of the quantity alone. (1) Implement the closure twice with different code (a plain reference for N up
      to about 22, and a packed-bit implementation for window sizes) and diff them on random Boolean systems you generate yourself, N in 10..24, with
      quadratic and cubic generators. (2) Compute the ground truth at small N WITHOUT any closure: B/I is F_2^V, so the ideal is the kernel of
      evaluation on V, and its leading-monomial set under the stated order is exact linear algebra on the evaluation matrix; sufficiency at D is then
      "W_4's leading monomials equal that set". Compare your closure's verdict to it on every small system. (3) Prove or break the polarity statement:
      if W' is inside W and W is inside I then std(W') >= std(W) >= |V|. Build a counterexample if you believe it false. State what it implies for
      each polarity. (4) Order dependence: on your small systems compute both polarities under degrevlex (the stated order), deglex and a random
      graded order. Report any system on which the verdict flips, and say what that means for a verdict recorded under one order. (5) State and prove
      the relation between rank, columns, std and the number of standard monomials of size above D. I think it breaks, if anywhere, at (4): the
      insufficient polarity is order-dependent and the contract never names an order.
    W2: >-
      W2 -- THE EXACT COUNT AS DENOMINATOR. That |V| = the number of points of F_2^N satisfying every generator is the right denominator (it equals
      dim B/I because the Boolean ring makes every point F_2-rational and the ideal radical), and that the count for each of the twelve window
      systems is reproducible by a method independent of the closure and of any other counter.
      ATTACK. BLIND LANE. Write your own exact counter (the systems appear to have M equations in N = 2k variables in two halves of k variables each,
      check this on the files; if the equations are affine in the second half for a fixed first half, one linear solve per assignment is a candidate
      method; use any method you trust and say which). Validate the counter against brute force on small random systems and on a hand-checkable system, and test the .ms parser on operator
      precedence, the trailing comma and the constant term. Prove the denominator identity. Report |V| for all twelve instances BEFORE you start any
      closure on them. I expect no break; the realistic failure is a parse ambiguity.
    W3: >-
      W3 -- CONTRACT CONFORMANCE OF THE CLOSURE CERTIFICATE (DV-7, both runs). Whether (a) the implicit Boolean ring is equivalent to the field
      equations "as explicit generators" that invalidation rule 2 requires, (b) invalidation rule 1's "degree 3" generators can be read to cover the
      m = t = 2 cells whose generators have degree 2, and (c) the ITERATED degree-capped closure answers the same sufficiency question as the
      contract's literal certificate (the single-level degree-4 Macaulay block).
      ATTACK. Read experiments/EXP-SEMBIN-7e1371/specification.yaml (certificate, invalidation rules 1 and 2) ONLY AFTER your blind derivation is written
      and hashed. (a) At small N, build the polynomial-ring degree-D Macaulay matrix with the field equations as explicit generators and non-square-free
      multipliers, reduce modulo x_i^2 = x_i, and compare its row space and leading-monomial set with the Boolean-ring single-level span; find a system where
      they differ, or prove they coincide. (b) Report the degree of the generators of the window systems from the .ms files and what rule 1 would require.
      (c) Compare the single-level span with the iterated closure at small N: report systems where the iterated closure is strictly larger and whether the
      verdict changes. I expect (a) to coincide, (b) a t >= 3 phrasing, and (c) the iterated closure to be strictly larger on some systems, which makes the
      recorded verdict a statement about the iterated closure and not about the literal certificate.
  breaking_artifacts:
    W1: >-
      A small system on which your two implementations disagree, or on which the closure's verdict disagrees with the evaluation-kernel ground truth, or a
