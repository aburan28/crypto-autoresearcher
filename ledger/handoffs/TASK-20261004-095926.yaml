  proves_too_much_control:
    assigned_to_this_task: true
    argument_tested: >-
      A soundness argument for a recorded closure verdict: two elimination routines (different algorithms, same product generation) give the same
      leading-monomial set; an evaluation check at ONE verified common zero of the generators is clean on every elimination; a structural check of every
      elimination's output passes; therefore the recorded verdict is sound. Implement that argument on YOUR closure (an evaluation check at one zero is a
      few lines; two elimination routines are two of your own) and run it against the objects below.
    objects:
      - >-
        PT-1 MISSING-PRODUCT MUTANTS of your closure: (a) multiplier budget one lower than stated; (b) rows multiplied only when their leading monomial is new,
        not when their tail changed after reduction by a later pivot; (c) generators multiplied only (degenerates to the single-level span); (d) the last
        batch of products dropped in each iteration. Use small systems (N about 14..24) whose true closure verdict at D = 4 is known from the
        evaluation-kernel ground truth, chosen so that your unmutated closure says "sufficient" and a mutant says "insufficient".
      - >-
        PT-2 CORRUPTION MUTANTS of the elimination step of your closure, on a small system with |V| >= 2: (a) corrupt a large fraction of output rows (bulk); (b) add
        ONE row that vanishes at the zero used for the evaluation check but not at another zero and is not in the ideal.
      - >-
        PT-3 KNOWN-SUFFICIENT AND KNOWN-INSUFFICIENT CONTROLS for the verdict rule, from the independent ground truth: (a) a system with a planted degree-2 solution
        structure for which a degree-2 closure is already sufficient; (b) a system for which an independent exact Groebner computation (not M4RI) shows a reduced
        basis element of size above 4, so that a correct degree-4 closure must report "insufficient".
    failure_signature: >-
      On PT-1 the argument "two routines agree, evaluation check clean, structural check clean, hence sound" MUST be shown to go through (no flag) on mutants (a) to
      (d), because every such check shares the product generation; that outcome is the CONFIRMED BLIND SPOT: the argument is necessary and not sufficient, and it proves
      too much if it is quoted as certifying an "insufficient" verdict. The check that must flag PT-1 mutants is comparison with an independent closure or a saturation
      verifier; report which flags and which does not. On PT-2(a) the evaluation check MUST flag (else it is vacuous); on PT-2(b) it MUST stay clean (else the "necessary at
      one zero, not sufficient" statement is wrong); report which. On PT-3 the verdict rule MUST return "sufficient" on (a) and "insufficient" on (b); a rule that returns
      "sufficient" on (b) has proved too much, and one that returns "insufficient" on (a) is mis-measuring. A reviewer who finds the argument fails on none of these has not
      found an anomaly: it must say which object was inconvenient to the argument and why.
    note: >-
      The validator's producer-code variants of PT-1 and PT-2 are NOT yours; you build yours from the statement, with no producer code.

