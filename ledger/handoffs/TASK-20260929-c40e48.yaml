  # ---------------------------------------------------------------------------
  review_plan:
    round: Stage 0 review of EXP-PFDR-7c8bf2 (RUN-PFDR-7c8bf2-stage0)
    reviewers: [TASK-20260929-c40e48 (validator), TASK-20260929-69b7c5 (red-team)]
    claim_under_review: >-
      As the producer stated it (experiments/EXP-PFDR-7c8bf2/execution-report.yaml):
      RUN-PFDR-7c8bf2-stage0 is completed_valid; invalidation checks I-1..I-4
      pass; the frozen P0-P7 analysis of the five committed sweep files yields
      outcome OUT-SLOPE-INTERVAL, met by the series S6-smallx alone (its
      12..32 primary slope interval excludes 1/(2m) at m = 6, falsification
      condition F-3 as worded); no IC row has ratio below 1.0 and TW-FLOOR did
      not fire. Two anomalies are recorded: the P7(a) cross-file rho
      de-duplication leaves the unfiltered rho set at n = 92 rather than 110,
      and the descriptive-only P7(c) randomized-PIT KS rejects at 1% for m = 7.
    coordinator_prior: >-
      Written after reading the producer's execution report (disclosed; RV-9
      and PD-1). J1-J3: the package is complete and correctly bound, the
      re-derivation reproduces all eight primary fits exactly with the frozen
      method and the outcome id mechanically, and the analysis re-executes
      byte-identically; I expect holds on all three. J4: the S6 exclusion is
      marginal (its lower end sits just above 1/12), the 20..32 sensitivity
      interval contains 1/12, and with five curves per rung the stratified
      percentile bootstrap probably undercovers while eight per-series
      interval tests run without multiplicity control; I expect the red team
      to find OUT-SLOPE-INTERVAL correctly computed but consistent with the
      even-m model at a non-negligible rate, so that it supports at most a
      scoped weaken with replication or a derivation note, never
      reject_scoped (the specification already forbids that). J5: I expect
      the n = 92 count to be the correct number of distinct curves (the two
      curve sets share 18 curves because the filter accepted the first prime)
      and a labelling artefact of first-seen de-duplication rather than a data
      defect, with no effect on any outcome condition. J6: I expect the m = 7
      rejection to be a borderline descriptive result, confounded by the
      stopping rule and not decision-bearing.
    joints:
      - joint: >-
          J1 -- package and bindings. The run directory is complete per the
          specification's required_artifacts; every file matches
          checksums.sha256 and the f15632 receipt; the five input digests
          equal those at the design-archive commit c06f1ad8c; no solver module
          was loaded and no results file was written (I-3); the twin check P1
          holds.
        assigned_to: TASK-20260929-c40e48
        attack_plan: >-
          Re-hash every file under the run directory and compare with
          checksums.sha256 and with the receipt's path_sha256. Hash each input
          as `git show c06f1ad8c:<path> | sha256sum` and compare with the
          manifest. Walk the manifest against required_artifacts.per_run field
          by field (inference block included). Read analyze_floor.py's imports
          and confirm raw-result.json's solver_modules_loaded is consistent
          with them. Recompute P1 from the committed files yourself: for every
          mitm row of each min_index twin, find the min_fill row with the same
          key and compare the twelve listed fields. Where I think it breaks: a
          manifest that omits a required field, or a twin comparison that
          silently skips rows lacking a field.
        breaking_artifact: a hash mismatch, a missing required artifact or manifest field, a solver import, or a twin mismatch the run did not report
      - joint: >-
          J2 -- the outcome follows from the frozen analysis. The eight primary
          slopes and 95% intervals (12..32; 20..32 sensitivity), the minimum
          ratio, the m = 3 base intervals and the outcome id are what the
          specification's definitions give on the committed rows.
        assigned_to: TASK-20260929-c40e48
        attack_plan: >-
          From the specification text only (blind_from respected): select rows
          (method starting ic_, ok true), build S, T, r, N, floor and ratio per
          P2; form the eight P3 series (mitm only; min_index twins never
          fitted; the arity67 enumerate rows excluded from fits); fit per P4
          with stats.bootstrap_slope and with your own bootstrap (RV-3); apply
          P5 and P6; apply the analysis_outcomes table in its stated order.
          Where I think it breaks: series membership (enumerate rows or twin
          rows leaking into a fit), the regressor (row log2N versus bits), the
          groups argument, or the interval endpoints at S6, where the
          exclusion margin is small enough that a membership slip could flip
          the outcome id.
        breaking_artifact: any primary interval or the outcome id that differs from the archived one under the frozen method, or stats.bootstrap_slope disagreeing with its own description beyond Monte Carlo error
      - joint: >-
          J3 -- raw/summary agreement and reproducibility. floor-rows,
          fits.json, raw-result.json and execution-report.yaml agree with
          each other, and analyze_floor.py re-executed on the same inputs
          reproduces the archived outputs.
        assigned_to: TASK-20260929-c40e48
        attack_plan: >-
          Re-execute analyze_floor.py once into your own scratch directory with
          the task venv interpreter and diff every output against the archive
          (floor-rows.jsonl.gz decompressed, fits.json, raw-result.json).
          Cross-check every number the execution report quotes against
          fits.json and raw-result.json. Where I think it breaks: values
          transcribed into the report by hand, or a nondeterministic ordering
          in floor-rows.
        breaking_artifact: a non-reproducing output, or a reported value that is not in the raw outputs
      - joint: >-
          J4 -- OUT-SLOPE-INTERVAL is not overread. The S6 interval's exclusion
          of 1/12 is evidence against the even-m gap explanation at the
          strength the outcome table assigns, and no stronger.
        assigned_to: TASK-20260929-69b7c5
        attack_plan: >-
          Build the S6 design exactly (the rows' log2N values, five curves per
          rung, 11 rungs), simulate series with true slope 1/12 and residuals
          resampled within rung from S6's own OLS residuals (and, second, from
          a pooled Gaussian with S6's residual variance), and apply
          stats.bootstrap_slope with the frozen settings to at least 200
          synthetic series: estimate the empirical coverage of the nominal 95%
          interval and the probability that its lower end exceeds 1/12. Do the
          same for S4 against 1/8 and for one odd-m series against 0. From
          these, estimate the probability that at least one of the eight
          per-series tests (F-2 or F-3) excludes its model value when every
          model value is true. Fit S6 with a lower-order term (a 1/log2N or
          curvature term) and report whether the exclusion survives. Where I
          think it breaks: coverage well below 95% with five curves per rung,
          and a family-wise exclusion probability of order 0.2-0.4.
        breaking_artifact: a coverage and family-wise table showing that an exclusion like S6's is expected under the model, or conversely a robust excess (surviving the lower-order fit and the 20..32 range) that the outcome table understates
      - joint: >-
          J5 -- the rho de-duplication anomaly (P7(a), n = 92 vs 110). The
          frozen de-duplication key (p, a, b, curve, bits) and first-seen rule
          do what the specification intends, and the anomaly affects no
          outcome condition.
        assigned_to: TASK-20260929-69b7c5
        attack_plan: >-
          List the rho rows of every input file with their keys; identify the
          (bits, curve) pairs whose curve is identical in the filtered and
          unfiltered sets and check whether it is the same instance (same p,
          a, b, N, walk_ops) or merely the same key; recompute the rho walk
          exponent per set under the alternative convention in which each set
          keeps its own copy, beside the archived value; state whether any
          outcome condition or tripwire reads the rho set. Where I think it
          breaks: if key-equal rows differ in walk_ops (different runs of one
          curve), the first-seen rule is silently discarding data rather than
          duplicates.
        breaking_artifact: key-equal rho rows that are not the same instance, or an outcome condition that depends on the de-duplicated count
      - joint: >-
          J6 -- hidden assumptions and the descriptive m = 7 Poisson rejection.
          The outcome rests only on assumptions the specification declares,
          and the P7(c) rejection is correctly labelled non-decision-bearing.
        assigned_to: TASK-20260929-69b7c5
        attack_plan: >-
          Enumerate the assumptions the ratio and its slope depend on (S
          includes table S_3; r is the logged relation count at a
          data-dependent stop; two encodings per S_3 unit; log2N as the
          regressor; min_fill rows only; default |F|) and, for each, compute
          the S4 and S6 slopes under the most plausible alternative the
          specification did not choose (for example S excluding table S_3, or
          r replaced by rank) to show whether the outcome id is sensitive to
          it. For P7(c), compute the probability of at least one 1% rejection
          among the five m tests and check whether the stopping rule alone can
          produce the m = 7 rejection (simulate relations under the engine's
          stop at rank |F| + 1 with Poisson arrivals). Where I think it breaks:
          an undeclared convention that moves S6 across 1/12.
        breaking_artifact: an undeclared assumption whose alternative changes the outcome id, or evidence that the P7(c) rejection is not explained by the stopping-rule confound
    blindness:
      mutual: true
      lifted_for: []
      rationale: null
    proves_too_much:
      objects:
        - >-
          The rho r = 1 slice of the same committed files: the walk exponent
          of log2(walk_ops) against log2N, whose value 1/2 is known for
          Pollard rho (README reports 0.50-0.51).
        - >-
          Synthetic series built on the S6 and S4 designs with the model slope
          (1/12, 1/8) true by construction (J4).
      failure_signature: >-
        The frozen interval procedure applied to these objects must include
        the known-true slope in about 95% of synthetic replicates and should
        include 1/2 on the rho slice. A procedure that excludes the known-true
        value materially more often than 5% proves too much, and S6's
        exclusion then does not by itself falsify the even-m explanation.
      assigned_to: TASK-20260929-69b7c5
    blind_rederivation:
      required: true
      quantity: >-
        For each of the eight primary series of EXP-PFDR-7c8bf2 P3, the OLS
        slope of log2(S_3 / (0.5 * sqrt(r * N))) against row log2N and its
        95% stratified percentile bootstrap interval (stats.bootstrap_slope,
        groups = bits, reps = 2000, level = 0.95, seed = 0), over 12..32 and
        over 20..32; the minimum ratio over every IC row of the five files;
        the three m = 3 base geometric-mean intervals of P6; and the outcome
        id under analysis_outcomes.
      parameters: >-
        The five committed files at commit 1a037688c (digests equal to those
        at c06f1ad8c), the specification text, and stats.py as committed.
      blind_from:
        - experiments/EXP-PFDR-7c8bf2/analyze_floor.py
        - experiments/EXP-PFDR-7c8bf2/runs/RUN-PFDR-7c8bf2-stage0/
        - experiments/EXP-PFDR-7c8bf2/execution-report.yaml
        - experiments/EXP-PFDR-1b78f7/execution-report.yaml
        - ledger/decisions/DEC-20260929-523aab.yaml
        - coordination/review/pfdr-7c8bf2-20260929/reviews/TASK-20260929-69b7c5/
      assigned_to: TASK-20260929-c40e48
    procedure_deviations:
      - id: PD-1
        text: >-
          The Coordinator's prior was written after it read the producer's
          execution report (the round is opened on a completed run). Recorded
          so that concurrence is weighed accordingly.
      - id: PD-2
        text: >-
          The claim_under_review names the series (S6-smallx) that meets the
          outcome condition, so the J2 re-derivation is blind to the
          producer's values and implementation, not to the outcome label.
          Every number is withheld from this card.
      - id: PD-3
        text: >-
          The reports are archived by TASK-20260929-599b4b together with the
          EXP-PFDR-1b78f7 continuation's outputs, because no separate archival
          id was reserved; composition waits for that snapshot.
    composition: >-
      The Coordinator composes J1-J6 itself after TASK-20260929-599b4b
      verifies, runs `python3 tools/check_review_independence.py --batch
      coordination/review/pfdr-7c8bf2-20260929` before treating the round as
      complete, and records any departure from this plan.
