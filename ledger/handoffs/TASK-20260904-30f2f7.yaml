  recorded_at: '2026-09-04'
  goal_id: GOAL-AES-003
  question_id: RQ-AES-003
  batch_id: BATCH-e479db
  experiment_id: null
  experiment_id_note: >-
    No experiment exists or is approved. This card revises a design; approval
    of any execution, if it ever comes, is a separate Coordinator decision
    with its own frozen contract, still gated on SR-2 and SR-3.
  task_card: coordination/goals/GOAL-AES-003/batches/BATCH-e479db/tasks/TASK-20260904-30f2f7/task_card.yaml
  dispatch_queue: coordination/goals/GOAL-AES-003/batches/BATCH-e479db/dispatch_queue.json
  role: idea-generator
  from: coordinator
  to: idea-generator
  objective: >-
    Produce the SCOPED SUCCESSOR REVISION of the FM-cascade floor-magnitude
    adjudication design promoted as IDEA-20260903-bd730d, discharging the two
    BLOCKING successor requirements from TASK-20260903-4fdf77's red-team
    report (SR-2: quantified FM-PLATEAU-CONSISTENT false-positive bound under
    seed heterogeneity phi = 1.0 to 2.0; SR-3: tightened Branch-4
    admissibility conjunct or raised arm count), folding in SR-1 and SR-6 at
    zero cost, and carrying SR-4, SR-5, SR-7, SR-8 as disclosure/completeness
    items on this same pass.
  uncertainty_reduced: >-
    Whether the FM-cascade design's PLATEAU branch can be given a quantified
    heterogeneity false-positive bound and an explicit admissibility remedy
    (SR-2, SR-3) - the one gap DEC-20260903-afdd06 named as blocking any
    future execution authorization for D-1, D-2, or any successor that could
    compose an FM-PLATEAU-CONSISTENT sentence.
  inputs:
  - ledger/proposals/IDEA-20260903-bd730d.yaml (the reviewed design being revised)
  - ledger/decisions/DEC-20260903-afdd06.yaml (closing decision of BATCH-b38667; decision verb revise; successor requirements named)
  - coordination/goals/GOAL-AES-003/batches/BATCH-b38667/tasks/TASK-20260903-4fdf77/red_team_report.yaml (successor_requirements 1-8; OBJ-5 breaking artifact; verdict breaks on the PLATEAU branch only)
  - coordination/goals/GOAL-AES-003/batches/BATCH-b38667/tasks/TASK-20260903-779393/validation_report.yaml (joint J-P holds; sealed blind re-derivation precedent)
  - coordination/goals/GOAL-AES-003/batches/BATCH-b38667/tasks/TASK-20260903-92ade4/ (the three deliverables being revised)
  - ledger/decisions/DEC-20260901-6f9de3.yaml (AMEND-1 verbatim)
  - ledger/decisions/DEC-20260902-7ad3d9.yaml (NARROW-1/2/3 verbatim)
  - ledger/decisions/DEC-20260903-be4472.yaml (NARROW-4/5 verbatim; RAT-3/4/5)
  - ledger/corrections/CORR-20260903-d3cab5.yaml (exact Garwood CI for 17 hits)
  - ledger/goals/GOAL-AES-003.yaml (revised RANK 1 next_action text)
  constraints:
  - >-
    SCOPED SUCCESSOR REVISION ONLY. Revise the IDEA-20260903-bd730d package to
    discharge SR-2 and SR-3 and fold SR-1 and SR-6; carry SR-4, SR-5, SR-7,
    SR-8 as disclosure items on the same pass. Do NOT redesign the ladder, the
    comparator, the gates P1-P5/G1-G4, or the DECAY branch beyond what the
    eight requirements touch; do NOT open RANK 2 (family extension), RANK 3
    (PINCTRL-1), or any other rank.
  - >-
    ZERO ARMS: no build, no measurement, no run, no freeze, no ledger write,
    no commit, no identifier minted. budget.maximum_runs covers the
    heterogeneity-bound DERIVATION code only (fresh scipy, no instrument);
    budget.experiment_runs_authorized = 0.
  - >-
    SR-2 must be an explicit, disclosed QUANTITATIVE bound: a
    plateau_heterogeneity_sensitivity table analogous to the decay branch's
    overdispersion_sensitivity table, covering phi = 1.0 to 2.0 at named grid
    points (at minimum 1.0, 1.25, 1.5, 1.75, 2.0), stating the
    FM-PLATEAU-CONSISTENT false-positive rate at each, the model used, and
    what breaks the bound. The OBJ-5 object from the red-team report
    (heterogeneous seeds within the disclosed phi range) is the calibration
    target.
  - >-
    SR-3 must pick and specify ONE remedy: (a) a tightened explicit secondary
    conjunct on Branch 4 requiring the dispersion index to fall MATERIALLY
    BELOW its critical value (name the margin and its rationale), or (b) a
    raised n with the heterogeneity-risk arithmetic stated. If (a), the
    conjunct must be shown satisfiable under the design's own homogeneous null
    (no vacuous admissibility); if (b), the arm-count increase must be priced
    inside the campaign's sizing basis.
  - >-
    SR-1: extend the RAT-3 verbatim-quotation discipline in
    preregistration-skeleton.md to cover each branch's NOT-licensed
    prohibition text as well as its firing conjunct, for any downstream
    evidence, decision, or knowledge-promotion record composing a fired
    branch's outcome sentence.
  - >-
    SR-6: name the exact tail-construction convention for the exact two-sided
    conditional binomial test of pi = 0.5 in the adopted preregistration text
    (minimum-likelihood, matching scipy.stats.binomtest's default, versus
    equal-tail), and state which branch-boundary cases the two conventions can
    disagree on.
  - >-
    SR-7: price the cheapest same-pair alternative (one new arm at k=4, one at
    k=16, n=1, 2 floor arms total) as its own explicit dominated_by row for
    the actual k=4/k=16 pair, and state the sufficient design-specific
    argument that the per-point dispersion index has zero residual degrees of
    freedom at n=1, so the H1/H3 homogeneity gate cannot be computed at all -
    not a precedent citation from IDEA-20260903-8f26ac.
  - >-
    SR-8: resolve or delete the orphaned count_threshold_at_n_6_lambda_op_1:
    15 entry in the revised pooled-exposure-pricing.json branch_thresholds
    block, and record which resolution was chosen and why.
  - >-
    SR-4: name G4's use of the committed k=16 reading's exact Garwood lower
    bound as a disclosed third use of the five committed readings.
  - >-
    SR-5: add per-arm or periodic build-identity and KAT re-verification
    checkpoints to the preregistration text for any design running
    substantially more arms or a substantially longer wall-clock span than any
    predecessor batch.
  - >-
    NARROW-1 through NARROW-5 are binding paraphrase discipline and must be
    quoted VERBATIM from DEC-20260902-7ad3d9 (NARROW-1/2/3) and
    DEC-20260903-be4472 (NARROW-4/5); every sentence in the revision must
    comply. No extinction, plateau-as-completion, cliff-at-4, whole-curve,
    k=12-coverage, count-verdict-at-k=8, or prior-rehabilitation sentence.
  - >-
    Carry the AMEND-1 counter-inconsistency gate VERBATIM from
    DEC-20260901-6f9de3 and apply it to every analysis-bearing receipt the
    revised design would produce.
  - >-
    Reprice against the REALIZED readings only: h(4) = 17 (seed 531001) / 21
    (seed 531002), h(8) = 13 / 18, h(16) = 12, each at 2^30 trials per arm,
    cell (1,1), r = 5, PIN-T0. Exact Garwood 95% CI for 17 hits is [9.903,
    27.219] per CORR-20260903-d3cab5; 29.2 must not reappear.
  - >-
    BLINDNESS-ENABLING SEPARATION: ALL new statistical derivation - the
    plateau_heterogeneity_sensitivity table, expected false-positive rates
    under phi heterogeneity, any raised-n arithmetic, power re-checks - lives
    ONLY in pooled-exposure-pricing.json. design-revision.yaml references it
    by path and restates only headline totals. Restating the derivation spends
    the validator's blind re-derivation and must be recorded as a procedure
    deviation.
  - >-
    Instrument custody unchanged: the revised design runs on the certified
    frozen-build-plus-declared-extension (binary 3ccc377c..., R4 k=3 digest
    922e24c9...) exactly as IDEA-20260903-bd730d declares; any exposure or
    grid change beyond the priced design still requires a NEW freeze
    commitment with a pre-arm digest.
  - >-
    Fill dominated_by (null only after checking every frontier row across
    time, memory and number of draws) and a quantitative sota_delta; update
    the RANK-2 dominance comparison only if the SR-3 remedy changes it.
  - >-
    Toy tier only (RQ-AES-003 R7 default): no distinguisher, no key recovery,
    no deployed-AES statement, no carrier/X-lane/rho-exclusion sentence, and
    no published-cryptanalysis comparison in either direction.
  - >-
    Write only inside the declared write_scope. Make no commits and mint no
    identifiers; the revision becomes IDEA-20260904-06c396 only in the ledger
    archive TASK-20260904-7760d7, after independent review.
  - >-
    Use search_knowledge before asserting that a heterogeneity bound or
    dispersion-gate remedy has been tried or is known to fail, and mark every
    citation's provenance (recalled|retrieved|kb|internal). A recalled
    reference is a pointer, never support. If the KB index is missing, use
    internal ledger search and record the missing index as an infra note.
  - A budget or tooling failure is reported as resource_exhaustion or infrastructure failure, never as a finding about the floor.
  deliverables:
  - >-
    design-revision.yaml - the full revised IDEA-record body (class, claim,
    mechanism, novelty_status as revision-of IDEA-20260903-bd730d, numbered
    heuristics, SR discharge table mapping each of SR-1..8 to its exact
    location in the package, per-branch licensing statements, verbatim
    NARROW-1..5 and AMEND-1), referencing the pricing file by path and
    restating none of its derivation
  - >-
    pooled-exposure-pricing.json - the REVISED machine-readable arithmetic:
    all retained content of the BATCH-b38667 pricing file consistent with the
    revision, PLUS the plateau_heterogeneity_sensitivity table (phi grid,
    false-positive rates, model, bound-breakage statement), the SR-3 remedy
    arithmetic, the SR-7 dominated_by pricing row, and the SR-8 resolution
  - >-
    preregistration-skeleton.md - the REVISED write-once preregistration text:
    tightened Branch-4 conjunct or raised n per SR-3, named tail convention
    per SR-6, extended RAT-3 scope per SR-1, SR-5 re-verification checkpoints,
    every branch conjunct and prohibition written out IN FULL
  artifact_paths:
  - coordination/goals/GOAL-AES-003/batches/BATCH-e479db/tasks/TASK-20260904-30f2f7/design-revision.yaml
  - coordination/goals/GOAL-AES-003/batches/BATCH-e479db/tasks/TASK-20260904-30f2f7/pooled-exposure-pricing.json
  - coordination/goals/GOAL-AES-003/batches/BATCH-e479db/tasks/TASK-20260904-30f2f7/preregistration-skeleton.md
  archived_by: TASK-20260904-6d791a
  write_scope:
  - coordination/goals/GOAL-AES-003/batches/BATCH-e479db/tasks/TASK-20260904-30f2f7
  inference:
    policy: research-deep
    requested_policy: research-deep
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 1600
    memory_gb: 2
    maximum_runs: 2
    maximum_runs_note: >-
      Covers the heterogeneity-bound derivation script and one re-check in
      fresh scipy. ZERO experiment arms are authorized.
    experiment_runs_authorized: 0
    compute_component_seconds: 0
  completion_gate:
  - All three artifacts exist under the declared write_scope; the YAML parses with yaml.safe_load and the JSON with json.load.
  - design-revision.yaml carries an SR discharge table mapping each of SR-1..8 to the exact file and section where it is discharged, and every mapping is true.
  - The plateau_heterogeneity_sensitivity table exists in pooled-exposure-pricing.json with at least the five named phi grid points, a stated model, and a bound-breakage statement.
  - preregistration-skeleton.md carries exactly one SR-3 remedy (tightened conjunct with named margin, or raised n with priced arithmetic), the SR-6 tail convention, and the SR-1 extended RAT-3 scope, with every branch conjunct and prohibition in full.
  - All NEW statistical derivation is confined to pooled-exposure-pricing.json so the blind re-derivation of TASK-20260904-f9ad79 is possible.
  - Every cited reading traces to EV-AES-ac5c12, EV-AES-868db1 or CORR-20260903-d3cab5, and no sentence exceeds toy tier or the tested scope.
  - Zero arms executed, no identifier minted, no ledger record written, no commit made.
  return_format: Only the output record this role contract declares; no prose summary in place of it.
  review_plan:
    claim_under_review: >-
      As the producer is required to state it: "The scoped successor revision
      of the FM-cascade design discharges successor requirement 2 (an
      explicit, disclosed quantitative bound on the FM-PLATEAU-CONSISTENT
      false-positive rate under seed heterogeneity phi = 1.0 to 2.0) and
      successor requirement 3 (a tightened Branch-4 admissibility conjunct or
      a specified raised arm count bounding heterogeneity risk), folds in
      requirements 1 and 6, and carries requirements 4, 5, 7 and 8 as
      disclosure items - such that the revised preregistration in
      preregistration-skeleton.md, at the exposure priced in
      pooled-exposure-pricing.json and under the AMEND-1 gate, still
      discriminates the three named floor alternatives at the stated power and
      alpha, and licenses exactly the sentences enumerated per branch and no
      others, with the PLATEAU branch now provably bounded against
      heterogeneous seeds in the disclosed phi range."
    coordinator_prior: >-
      Recorded before any reviewer runs. (1) For SR-2, I expect the honest
      phi-stratified false-positive table to show the PLATEAU branch's
      false-positive rate RISING materially with phi above 1.0 - OBJ-5 already
      broke the unbounded rule at heterogeneous seeds - so the bound will
      either force a phi cap below 2.0, a raised n, or a tightened conjunct
      that pays for itself; whichever it is, that trade is the revision's real
      content. (2) For SR-3, I expect option (a), the tightened conjunct,
      because it costs zero arms - but I expect the interaction with small-n
      dispersion degrees of freedom to be the weak point: at the design's
      current n the dispersion index has few residual df, so 'materially below
      critical' may be either vacuous (never fires under the homogeneous null)
      or uncheckable (cannot be distinguished from noise). I expect the red
      team's vacuous-admissibility check to be the decisive test. (3) I expect
      the strongest overclaiming temptation to be a smuggled sentence that the
      PLATEAU branch is NOW safe for any phi up to 2.0 when the bound actually
      holds only for a subrange - NARROW-1 bars extinction either way. (4) I
      expect SR-1 and SR-6 to be cleanly discharged (textual). (5) I expect
      SR-7's zero-residual-df argument to be correct and to make the n=1
      alternative dominated by construction rather than by precedent. If the
      review instead finds the heterogeneity bound is already implied by the
      existing overdispersion_sensitivity table (SR-2 cheap), or finds the
      tightened conjunct satisfiable with room to spare at the current n, my
      prior is OVERTURNED and that is the more valuable outcome; it is
      recorded here so the difference is visible afterwards.
    joints:
    - joint: >-
        J-R1 - the SR-2 heterogeneity-bound arithmetic and the SR-3 remedy's
        effect on Branch-4 admissibility and rule decidability: whether the
        phi-stratified false-positive rates are independently reproducible
        from the stated model and committed readings, and whether the rule
        with the remedy applied is still reachable, ordered, mutually
        exclusive and domain-fixed pre-arm.
      assigned_to: TASK-20260904-f9ad79
      attack_plan: >-
        Re-derive the arithmetic first, in fresh code, from the statement of
        the quantity and the committed readings alone - the
        FM-PLATEAU-CONSISTENT false-positive rate at phi = 1.0, 1.25, 1.5,
        1.75, 2.0 under the revision's stated heterogeneity model, the
        tightened conjunct's firing region under the homogeneous null, and the
        rule's branch routing on the realized readings - and write it into the
        report BEFORE opening pooled-exposure-pricing.json. I expect the
        break, if there is one, where the revision converts a bound derived
        under one pooling model into a claim about another, or where the
        tightened conjunct's margin was chosen after looking at the OBJ-5
        outcome rather than pre-registered from the model.
      breaking_artifact: >-
        A worked counter-derivation showing a materially different
        false-positive rate at any named phi grid point, or a reading/routing
        where the tightened rule is unreachable, overlapping, or decided only
        after seeing the data.
    - joint: >-
        J-R2 - what the TIGHTENED rule licenses and whether the SR-3 remedy is
        adequate and non-vacuous: scope, interpretation, proves-too-much on
        the revised rule, and the completeness of SR-1/4/5/6/7/8.
      assigned_to: TASK-20260904-937822
      attack_plan: >-
        Route the five proves-too-much objects (the four inherited from
        BATCH-b38667 plus the new synthetic heterogeneous generator within phi
        = 1.0 to 2.0 where PLATEAU-CONSISTENT is known false) through the
        TIGHTENED rule and report each routing. Construct the homogeneous-null
        case and test whether the SR-3 conjunct can fire at all (vacuous
        admissibility). Audit the revision sentence by sentence against
        NARROW-1..5 and RAT-3-with-SR-1, hunting a smuggled plateau-safe-for-
        all-phi sentence. Check SR-4/5/6/7/8 discharge completeness. I expect
        the break at the PLATEAU licensing statement or at the conjunct
        margin's provenance.
      breaking_artifact: >-
        A sentence the revised design would license that its bound cannot
        support, a null or heterogeneous object on which the tightened rule
        returns a floor verdict it should not, or a vacuous Branch-4 that can
        never fire.
    blindness:
      mutual: true
      lifted_for: []
      rationale: null
    proves_too_much:
      objects:
      - The k=0 ramp-zero arm, where the count is 2^30 by construction and no residual-floor reading can be correct.
      - The r=6 dead anchor at 0 hits, where the floor is absent by construction.
      - Synthetic counts drawn from the analytic null at the proposed exposure, where 'indistinguishable from comparator' is the only correct verdict.
      - A synthetic still-decaying generator, where a 'constant plateau' verdict is known false.
      - A synthetic heterogeneous generator with per-seed rates inside the disclosed phi = 1.0 to 2.0 range and a true pooled mean at the analytic null, where a PLATEAU-CONSISTENT verdict is known false (the OBJ-5 family).
      failure_signature: >-
        A correct tightened rule returns 'indistinguishable from comparator'
        or a halt on the first three objects, 'still decaying' on the fourth,
        and NOT 'PLATEAU-CONSISTENT' on the fifth. Returning 'live floor above
        comparator' on any of the first three, 'plateau' on the fourth, or
        PLATEAU-CONSISTENT on the fifth means the tightened rule has proved
        too much and is wrong somewhere nobody has read closely enough.
      assigned_to: TASK-20260904-937822
    blind_rederivation:
      required: true
      quantity: >-
        The SR-2 heterogeneity-bound arithmetic: for each phi grid point
        (1.0, 1.25, 1.5, 1.75, 2.0), the FM-PLATEAU-CONSISTENT false-positive
        rate under the revision's stated heterogeneity model at the design's
        priced exposure; and the SR-3 remedy's firing region: the tightened
        Branch-4 conjunct's satisfiability under the homogeneous null and its
        effect on the realized-reading routing.
      parameters: >-
        Realized readings h(4) = 17 (seed 531001) / 21 (seed 531002), h(8) =
        13 / 18, h(16) = 12; 2^30 trials per arm; cell (1,1); r = 5; PIN-T0;
        seeds 531001/531002; exact Garwood Poisson intervals at alpha = 0.05
        unless the revised preregistration names another alpha, in which case
        use that one and say so; heterogeneity model and phi grid exactly as
        stated in the revision's design-revision.yaml (read permitted) - but
        NOT the derivation in pooled-exposure-pricing.json until after the
        seal.
      blind_from:
      - coordination/goals/GOAL-AES-003/batches/BATCH-e479db/tasks/TASK-20260904-30f2f7/pooled-exposure-pricing.json
      blind_from_note: >-
        SEALED-FIRST ORDERING, not permanent prohibition: the re-derivation is
        written into validation_report.yaml before this path is opened, and
        the subsequent read is disclosed explicitly in review_attestation.
        Recomputing from the producer's own file reproduces a
        wrong-but-self-consistent implementation faithfully, which is exactly
        what validation cannot otherwise see.
      assigned_to: TASK-20260904-f9ad79
    procedure_deviations: []
  authorizes_nothing: >-
    A REVISION PROPOSAL IS NOT AN APPROVAL. This handoff authorizes no
    experiment, arm, exposure increase, build change, status change, evidence
    record, knowledge promotion or successor batch. Execution of D-1/D-2 or
    any successor remains gated on a later Coordinator decision finding SR-2
    and SR-3 discharged.
