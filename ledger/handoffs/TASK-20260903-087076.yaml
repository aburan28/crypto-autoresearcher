handoff:
  id: TASK-20260903-087076
  from: coordinator
  to: executor
  question_id: RQ-ECDLP-002
  objective: >-
    Execute the approved contract EXP-ECDLP-56ee42 (version 1) exactly as
    frozen: the digit-statistic cell of the probabilistic regime. Validate
    the frozen specification, implement the estimator per its definition
    (q_maj by exact integer cyclic convolutions with the integer-recovery
    check; A(v) by one length-n DFT; complete enumeration of each frozen
    subgroup), run Stages 0-3 (and Stage 4 only if the LEAD branch fires)
    with the named seeds, and produce immutable run records, an execution
    report, and every required artifact. The pre-registered two-branch rule
    is frozen: do not adjust it, do not re-score any executed cell against a
    changed prediction, and do not interpret results -- record observations
    only. No attack is run; every instance is toy and self-generated; no
    key is involved.
  uncertainty_reduced: >-
    Whether the balanced Thue-Morse and Rudin-Shapiro digit signs of a
    coordinate's integer lift carry a discrete-log-coordinate advantage
    (A(v) / q_maj - 1/2) beyond the x-top-bit comparator at the tested
    toy scale -- the one cheap family for which the program's
    probabilistic-regime closure (f558e4 (E)) has no proof because its
    members' F_p spectral norm is a power of p.
  inputs:
    - experiments/EXP-ECDLP-56ee42/specification.yaml (the frozen contract; status approved, version 1)
    - ledger/hypotheses/H-ECDLP-a4be60.yaml
    - ledger/proposals/IDEA-20260902-c17bf6.yaml (source proposal; the contract's pre-registered content is authoritative over the proposal where they differ)
    - experiments/EXP-ECDLP-56ee42/design/select_ladder.py, design/ladder.json (frozen ladder; re-running the selector must reproduce it exactly)
    - ledger/proposals/IDEA-20260815-f558e4.yaml (estimator definition; frozen fixture 284/529 at N = 23, s = 3)
    - knowledge/techniques/KN-TECH-006.md, KN-TECH-018.md, KN-TECH-030.md (baselines for the interpretation section of the report)
  constraints:
    - >-
      The contract is frozen at version 1: any deviation requires a versioned
      protocol_amendment in experiments/EXP-ECDLP-56ee42/amendments/ BEFORE
      the affected stage runs, and is never an edit of the frozen
      specification or prediction. Runs already executed are never
      re-scored against a new prediction.
    - >-
      Exactness is a contract requirement: A(v) and q_maj are EXACT (exact
      integers / rationals with the integer-recovery check asserted on every
      convolution); floating-point-only values are not admissible as
      reported metrics.
    - >-
      The static provenance check (no T1-T4 or COMPARATOR code path reads k)
      is recorded BEFORE Stage 3 and is part of the Stage 3 manifest.
    - >-
      Seeds are as frozen in the contract (base 0x56EE42; the named NULL-1
      schedule; the 8 named shuffle seeds; the bootstrap seed). No cell is
      re-run with a different seed.
    - >-
      Every run keeps the full artifact policy: exact command, git commit
      and dirty-tree state, environment and dependency versions, input
      parameters and seeds, requested model policy and resolved runtime
      model identifier, model provenance and probe-verification status,
      reasoning effort, fallback and degraded flags, stdout and stderr, raw
      machine-readable results, validity status and reason, timestamps and
      resource measurements (wall-clock, peak_rss_bytes).
    - >-
      Gate failures stop and archive per the contract's stopping/invalidation
      rules (F1-F3); budget exhaustion is F6, an infrastructure outcome,
      never evidence about the statistics.
    - >-
      Write scope: experiments/EXP-ECDLP-56ee42/implementation/,
      experiments/EXP-ECDLP-56ee42/runs/,
      experiments/EXP-ECDLP-56ee42/amendments/ (new files only), and
      experiments/EXP-ECDLP-56ee42/execution-report.yaml. Do not edit the
      frozen specification, the hypothesis, the proposal, or any other
      record.
  deliverables:
    - implementation of the estimator and the statistic/statistics code paths, with the provenance-check record
    - Stage 0 artifacts: the vacuity derivation document and the computed F_p spectral norms per statistic per prime with fitted growth exponents (gate P3)
    - the Stage 1 fixture reproduction (284/529 at N = 23, s = 3, exact rationals) and the f558e4 (G) smoke check (diagnostic)
    - Stage 2 control gates: POS-A (|A - 2/pi| <= 0.005 every rung, flat), POS-B (beta in [0.10, 0.35], A within [0.5, 2] x n^{-0.21}), CONTROL C artifact-removal
    - Stage 3 raw results: A(v), q_maj, and the marginal per (arm, n, seed) before and after shuffle; the NULL-1 distributions (all 256 replicates per rung) and tail references; P2 fitted betas with bootstrap intervals and residuals; P5 marginals with the NULL-1 marginal reference
    - one immutable run record per stage invocation with the full manifest, and an execution report naming the branch outcome (CLOSURE / LEAD / INCONCLUSIVE / gate failure / F6) exactly per the success criterion, with observations only
  artifact_paths:
    - experiments/EXP-ECDLP-56ee42/implementation/
    - experiments/EXP-ECDLP-56ee42/runs/
    - experiments/EXP-ECDLP-56ee42/execution-report.yaml
  archived_by: TASK-20260903-087076
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 86400
    memory_gb: 16
    maximum_runs: 12
  completion_gate:
    - the execution report names exactly one branch outcome per the contract's success criterion, decidable from the frozen metrics alone
    - every reported metric row names n, the statistic, the lift convention and the estimator
    - every gate's pass/fail is recorded with the archived evidence of any failure
    - the full artifact policy is satisfied per run (manifest fields, raw results, resource measurements)
    - no run record claims a discrete log on any instance (none is solved); any certificate-like output is a harness enumeration artifact, labelled as such
    - tools/validate_ledger.py reports no new error against the pre-existing baseline
  return_format: >-
    The list of run record paths, the one-line branch outcome, the gate
    table (pass/fail per gate), and the pointer to the execution report.
  review_plan: null
