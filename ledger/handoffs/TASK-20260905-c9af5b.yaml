handoff:
  id: TASK-20260905-c9af5b
  from: coordinator
  to: executor
  objective: >-
    Implement and, once separately authorized, execute EXP-MONO-2114ea:
    the graded, multi-curve positive-control test of whether
    H-MONO-663fb4's own Fisher-combined statistic has any power to detect
    a planted effect in the many-mild-curves regime it was introduced for.
    THIS HANDOFF DOES NOT ITSELF AUTHORIZE EXECUTION. EXP-MONO-2114ea is
    currently `status: review_required`, `frozen: false`,
    `execution_authorized: false`, `approved_by: null`. The Coordinator
    reviews and approves that contract in a SEPARATE decision before any
    implementation or run work under this handoff begins (AGENTS.md rule
    1; this handoff is issued now only to pre-stage the task in the
    dispatch queue, not as an implicit approval).
  uncertainty_reduced: >-
    Whether H-MONO-663fb4's Fisher-combined panel-level statistic has ANY
    demonstrated sensitivity to a genuine, non-extreme, multi-curve effect
    -- the regime it was actually introduced for -- as opposed to the
    single-extreme-outlier regime EXP-MONO-b1423c already showed it
    structurally cannot detect (permutation-floor cap). Resolves between
    H-MONO-d9dc51's two mutually exclusive outcomes (A: genuine detection
    power in the many-mild-curves regime; B: the statistic fails
    everywhere it has now been tested).
  inputs:
    - ledger/hypotheses/H-MONO-d9dc51.yaml
    - experiments/EXP-MONO-2114ea/specification.yaml
    - experiments/EXP-MONO-b19c6b/implementation/{fields,curve,conv,groupstate,stats}.py
    - experiments/EXP-MONO-b19c6b/runs/RUN-MONO-b19c6b-1/raw-result.json
    - experiments/EXP-MONO-c819ba/implementation/controls.py
    - experiments/EXP-MONO-b1423c/implementation/{run.py,controls.py}
    - experiments/EXP-MONO-b1423c/execution_report.yaml
  constraints:
    - >-
      HARD GATE: do not write, run, or execute any implementation code
      under this handoff until EXP-MONO-2114ea's own specification.yaml
      shows `frozen: true`, `execution_authorized: true`, and
      `approved_by: coordinator`, in a committed ledger state. If those
      fields are not yet set when this handoff is picked up, stop and
      report back rather than proceeding.
    - >-
      Reuse experiments/EXP-MONO-b19c6b/implementation/{fields,curve,conv,
      groupstate,stats}.py BYTE-IDENTICAL. Do not modify or reimplement
      `fisher_combined_pvalue`, `permutation_pvalue`, `holm_bonferroni`,
      `chi2_sf_even_df`, `character_spectrum`, `var_from_character_side`,
      `max_C`, `convolution_tower`, `exact_stats`, `cell_stats_fft`, or
      `stat_bundle_from_coords`. Import and call them directly.
    - >-
      Reuse experiments/EXP-MONO-c819ba/implementation/controls.py::
      subgroup_control VERBATIM (byte-for-byte, diffed at run time) for
      the Stage 1 RO3 reproduction cells only, exactly as
      EXP-MONO-b1423c's own implementation/run.py::
      verify_subgroup_control_source_verbatim already does.
    - >-
      Reuse EXP-MONO-b19c6b's own RUN-MONO-b19c6b-1 archived
      random-ordinary panel and per-curve raw p-values by READING
      raw-result.json directly; do not recompute or reconstruct any
      curve in that panel.
    - >-
      One 20000-draw null population per selected curve, keyed on
      (p, F, curve_ordinal), reused across every perturbation-fraction and
      panel-size cell that curve participates in -- per
      specification.yaml `inputs.null_draws_note`. Redrawing per grid
      cell is a protocol deviation and must be disclosed, not silently
      absorbed.
    - >-
      Follow specification.yaml's own stage order exactly: Stage 0 (exact
      planted-elevation precommitment + Fisher floor-vs-threshold check)
      before any draw; Stage 1 (RO3 reproduction, hard gate) before any
      new cell; Stage 2 (planted-panel measurement + matched null-panel
      control) before Stage 3 (detection-power surface).
    - >-
      Report observations only. No hypothesis, experiment, or goal status
      change; no verdict on H-MONO-d9dc51 or H-MONO-663fb4. Interpretation
      is reserved for the Validator, Red Team, and Coordinator.
    - Any timeout, crash, or construction/gate failure is `failed_infrastructure`, never negative mathematical evidence (AGENTS.md rule 3).
  deliverables:
    - experiments/EXP-MONO-2114ea/implementation.md
    - experiments/EXP-MONO-2114ea/implementation/ (new perturbation/panel-construction modules only; reused files imported, not copied)
    - experiments/EXP-MONO-2114ea/runs/RUN-MONO-2114ea-1/{command.txt,environment.json,stdout.log,stderr.log,raw-result.json,manifest.yaml}
    - experiments/EXP-MONO-2114ea/execution_report.yaml
  artifact_paths:
    - experiments/EXP-MONO-2114ea/implementation.md
    - experiments/EXP-MONO-2114ea/implementation/
    - experiments/EXP-MONO-2114ea/runs/RUN-MONO-2114ea-1/
    - experiments/EXP-MONO-2114ea/execution_report.yaml
  archived_by: null
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 600
    memory_gb: 0.5
    maximum_runs: 1
  completion_gate:
    - "EXP-MONO-2114ea shows frozen: true, execution_authorized: true, approved_by: coordinator in a committed ledger state before any implementation or run work begins."
    - "Stage 0 gates (exact planted-elevation precommitment; Fisher floor-vs-threshold check) reported before any draw is spent."
    - "Stage 1 RO3 reproduction cells match EXP-MONO-b1423c's own archived S5/S1-S4 values to 1e-9 relative tolerance before any Stage 2/3 cell is computed."
    - "T1-T5 (full-panel, oracle, matched-null-panel, per-curve-Holm, Stage-1-reproduction) reported with exact values at every declared grid cell."
    - "Dual-path control reported on every real-arm cell, within 1e-9 relative tolerance."
    - "Run manifest binds git commit, dirty-tree state, environment, seed, timing, and resource usage."
    - "execution_report.yaml states explicitly which of specification.yaml's `outcomes` block labels applies, or that none cleanly applies, per success_criterion."
  return_format: >-
    experiment_id, run status per run_id, wall_seconds and peak_rss_bytes
    per run, Stage 0/1 gate pass/fail with exact values, T1-T5 exact
    values at every grid cell (both statistics, both full-panel and oracle
    arms), matched-null-panel results at every panel size, dual-path
    control results, outcome label per specification.yaml `outcomes`,
    and any anomalies or protocol deviations disclosed in full. No
    verdict on H-MONO-d9dc51 or H-MONO-663fb4.
  review_plan: null
