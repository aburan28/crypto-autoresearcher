handoff:
  id: TASK-20260802-8e00fe
  from: coordinator
  to: red-team
  objective: Attack the repair. You raised RT2-C1 and the intercept objection that forced this batch;
    now try to break your own fix. Is the corrected law right, or does it merely move the error? Attack
    the p-scaling of the intercept, whether charging the full per-entry cost at B_opt is the correct accounting
    for the attack's actual table build, and whether the seam-free refit changes the exponent enough to
    matter across 7.5 unmeasured octaves.
  uncertainty_reduced: Whether the corrected overhead estimate is defensible enough for any downstream
    record to cite, and whether the NIST-I position should move.
  inputs:
  - experiments/EXP-PEC-49c773/specification.yaml and runs/RUN-PEC-49c773-a/
  - Your own BATCH-002 report, especially RT2-C1, RT2-C3 and RT2-C4
  - The Validator's BATCH-002 report, especially its homogeneous curvature 0.0225 which contradicted part
    of your composition-artifact argument
  - ledger/decisions/DEC-20260802-8227b9.yaml (how the Coordinator adjudicated between you)
  constraints:
  - Independent session. Attack, do not confirm.
  - 'Your BATCH-002 report retracted RT-C1''s gamma = 2 on an arithmetic error. Hold yourself to the same
    standard here: if any part of RT2-C1 as you wrote it is also wrong, say so explicitly.'
  - The Coordinator upheld the Validator over you on the homogeneous curvature. Engage that adjudication
    directly - either accept it with reasons or contest it with new arithmetic, but do not ignore it.
  - 'RT2-C4 argued batched Sutherland-type evaluation could remove up to ~13.25 of the corrected overhead
    bits, the single largest term and pro-attack. Press it: does the corrected law make that term larger
    or smaller, and does it remain the dominant uncertainty?'
  - State whether the corrected c is now defensible enough to be cited by a downstream record, and whether
    concrete_threat_nist1 should move off INCONCLUSIVE. If it should not, say what would move it and at
    what cost.
  - Every objection names its cheapest discriminating control. Carry dominated_by and a quantitative sota_delta;
    an unchecked null dominated_by is a fabrication.
  - A scoped failure is not an impossibility result; a toy-scale exponent is not a crypto-scale fact.
  - Record requested_policy, resolved model identifier, fallback_used, and degraded_requirements.
  - You change no research status and edit no raw artifact.
  deliverables:
  - red_team_report.yaml with per-objection severity, an end-to-end baseline statement, named next controls,
    and an explicit position on whether the corrected c is citable
  artifact_paths:
  - coordination/goals/GOAL-P13-001/batches/BATCH-003/reviews/TASK-20260802-8e00fe/red_team_report.yaml
  archived_by: TASK-20260802-c1f7c8
  goal_id: GOAL-P13-001
  batch_id: BATCH-003
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: true
    independent_session_required: true
  budget:
    wall_clock_seconds: 3600
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
  - The report states whether the corrected c is citable, engages the BATCH-002 adjudication directly,
    and names at least one concrete next control.
