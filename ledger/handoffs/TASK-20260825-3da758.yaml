handoff:
  id: TASK-20260825-3da758
  from: coordinator
  to: idea-generator
  objective: >-
    Build the modern-hash and permutation frontier shard for SHA-2, SHA-3/SHAKE
    and Keccak-f[1600], BLAKE2, BLAKE3, and the standardized Ascon hash/XOF
    variants, separating construction, compression-function, and permutation
    results.
  uncertainty_reduced: >-
    Which current reduced-round collision, preimage, internal-differential, and
    distinguisher rows define the published margin for modern hashes, and where
    the corpus lacks a primary-source-backed row.
  inputs:
    - coordination/goals/GOAL-SYMF-c00fa1/batches/BATCH-303ce8/frontier-schema.yaml
    - coordination/goals/GOAL-SYMF-c00fa1/batches/BATCH-303ce8/coverage-manifest.yaml
    - ledger/goals/GOAL-SHA2-001.yaml
    - ledger/goals/GOAL-SHA3-001.yaml
    - ledger/goals/GOAL-BLAKE-001.yaml
    - ledger/goals/GOAL-ASCON-001.yaml
    - knowledge/techniques/KN-TECH-066.md
  constraints:
    - Read primary texts and give an exact page, section, table, or theorem locator for every authoritative row.
    - Never treat a Keccak permutation distinguisher as a SHA-3 collision, or a compression-function result as a standard hash break.
    - Distinguish digest size, capacity/rate, initialization freedom, and round convention in every comparison key.
    - Preserve all cost axes and explicit null reasons; do not infer unstated exponents.
    - Search knowledge before asserting absence and log every query and source open.
    - A remembered citation is recalled and ineligible for the authoritative frontier.
    - No cryptanalytic search, message generation, or attack execution.
  deliverables:
    - frontier-shard.yaml validating against the frozen schema.
    - source-index.yaml with primary URLs, stable identifiers, retrieval dates, exact claim locators, and provenance.
    - retrieval-log.yaml with all repository searches and web queries/opens.
    - report.md with coverage counts, construction/permutation anti-laundering checks, and unresolved cells.
  artifact_paths:
    - coordination/goals/GOAL-SYMF-c00fa1/batches/BATCH-303ce8/tasks/TASK-20260825-3da758/frontier-shard.yaml
    - coordination/goals/GOAL-SYMF-c00fa1/batches/BATCH-303ce8/tasks/TASK-20260825-3da758/source-index.yaml
    - coordination/goals/GOAL-SYMF-c00fa1/batches/BATCH-303ce8/tasks/TASK-20260825-3da758/retrieval-log.yaml
    - coordination/goals/GOAL-SYMF-c00fa1/batches/BATCH-303ce8/tasks/TASK-20260825-3da758/report.md
  archived_by: TASK-20260825-568663
  inference:
    policy: research-deep
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 900
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
    - Every required primitive has at least one terminal coverage state and no blank attack-notion cell is described as secure.
    - Construction, compression-function, and permutation results have distinct comparison keys.
    - Every authoritative row has primary-source provenance and all cost/success axes populated or explicitly null-reasoned.
  return_format: Paths written, row counts by provenance and eligibility, frontier candidates, unresolved gaps, and anti-laundering failures.
  review_plan: null
