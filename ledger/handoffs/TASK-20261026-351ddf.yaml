handoff:
  id: TASK-20261026-351ddf
  from: coordinator
  to: executor
  objective: Repair normal report-workflow artifact configuration and use an opt-in
    packaging-only CI probe to test the existing configured canonical store identity
    and hydrate two already completed public native objects.
  uncertainty_reduced: Whether the existing Actions ARTIFACTS credential selector
    provides actual canonical Put/Get/readback and old-object hydration without new
    user keys.
  inputs:
  - AGENTS.md
  - docs/agent-contract-supplement.md
  - docs/experiment-protocol.md
  - .github/workflows/reports-s3.yml
  - .artifacts/config.json
  - research/prym_factor_base_width_20261025/execute_with_storage.py
  - research/prym_factor_base_width_20261025/contract.json
  - experiments/EXP-ECDLP-d6d8e8/runs/RUN-ECDLP-ea49a6/raw-result.json.gz.blob.json
  - experiments/EXP-ECDLP-d6d8e8/runs/RUN-ECDLP-ea49a6/events.jsonl.gz.blob.json
  constraints:
  - Engineering storage probe only; no scientific run/collector/native launch, experiment
    approval, target acceptance or old sealed-file edit. Existing Actions credentials
    remain in configured runtime only; never inspect values or print environment/secret-bearing
    URLs.
  - Probe writes only public synthetic payload via normal canonical store/us-east-2
    and reads exactly the two known completed native objects; content-addressed writes
    only, no deletion/overwrite, no reports-prefix write in probe mode.
  - Normal report upload job must skip probe-mode dispatch. Ordinary report behavior
    keeps its original publication scope.
  - Do not enable auto-merge or bypass automatic approval review. Root owns source
    publication and the normal workflow_dispatch API call; if rejected, record exact
    operation/reason and stop that action.
  deliverables: &id001
  - .github/workflows/reports-s3.yml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-49720f/ci-storage-probe/plan.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-49720f/ci-storage-probe/workflow-verification.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-49720f/ci-storage-probe/result.json
  artifact_paths: *id001
  write_scope:
  - .github/workflows/reports-s3.yml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-49720f/ci-storage-probe/
  archived_by: TASK-20261025-c7c93f
  inference:
    policy: executor-implementation
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
    delivery: interactive
  budget:
    maximum_runs: 0
    memory_gb: 2
  local_engineering_authorized: true
  engineering_storage_probe_authorized: true
  official_scientific_dispatch_authorized: false
  engineering_dispatch_preconditions:
  - Publish reviewed exact workflow/source bytes on the existing feature branch; root
    verifies actual ref/SHA and safe probe-only input before dispatch.
  - workflow_dispatch input storage_probe=true selects a distinct job; normal report-upload
    job is false for this dispatch.
  - Retain safe workflow/job/commit identity, exact commands and content hashes, never
    credential values.
  completion_gate:
  - Add .artifacts/config.json to sparse read scope and configure the selected existing
    role/key identity before any artifact pull; remove stale region/config ordering
    defect without weakening normal report selection.
  - Add opt-in storage_probe workflow_dispatch mode using existing ARTIFACTS role/key
    selectors. Run only the new wrapper probe mode and digest-verified hydration of
    the known old raw/events objects, with bounded machine resources; no native run
    mode or scientific command.
  - Upload only safe small proof metadata plus compressed public old-object bytes
    as an Actions artifact, retaining canonical object/stored/content hashes; large
    data are not committed to Git.
  - After published feature ref verification, root may dispatch this declared engineering
    probe through the normal existing workflow API. Only actual successful Put/Get
    and object digests establish CI identity readiness; prior successful/skipped jobs
    or masked selector presence establish none.
  - Write result.json for actual success/failure/rejection with workflow run/job/ref
    and exact custody limits. A missing identity, denied IAM operation or infrastructure
    failure remains an access result, not a mathematical finding.
  - CI readiness can support a separately declared future storage/execution route,
    but does not configure local credentials, authorize science or replace native
    preapproval/approval/ready/claim gates.
  return_format: Exact workflow diff/source SHA, actual workflow dispatch/run/job
    identity and status, safe proof/digests/hydration path or precise refusal; no
    secrets or science.
