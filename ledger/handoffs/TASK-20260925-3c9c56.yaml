  constraints:
    - >-
      CB-1 FIRST ACT, before reading any report. Write the worksheet skeleton
      and record in it, verbatim, report_digests_as_received (the six sha256
      digests the top-level session pasted: the three reports and the
      computations.json beside each) and the pasted output of python3
