      from bytes with those digests. This role holds no shell; custody becomes
      durable only when TASK-20260925-b25565 reproduces them (plan
      custody_without_seal).
    - >-
      CB-2 COMPOSE UNDER THE FROZEN KEYS. Apply the plan's composition keys as
      written (K-approve, K-revise-defect, K-indeterminate, K-row-failure,
      K-impediment, K-escalation-breach, K-infra, any_tripwire) and name the
      key applied for every ruling. A whole-claim opinion from a blinded
      reviewer is not a vote. Relaxing a key after reading the reports needs a
      protocol_amendment and cannot be done in a composition.
    - >-
      CB-3 COMPARE BEFORE KEYS (plan compare_before_keys). Compare J5 with v2's
      frozen values value by value (Q1, Q2, Q3, Q4) and record J2's table
      against v2's, before applying any key. NOT COMPUTED entries are compared
      under v2's own D8 comparison rule if J7 finds it decided by rule, and
      otherwise under the prior round's not_computed_comparison_rule. For an NF
      id that A1 records as 'definition not separable', apply the rule to J5's
      raw values.
    - >-
      CB-4 GATE CHECK (R-PREREVIEW-GATE composer_check). Read A1, both parts of
      gate-worksheet.yaml and the TASK-20260925-6e5a63 receipt blocks
      escalation_test and blind_whitelist_value_grep, and check that every
      gate file is present, every hit is classified and disposed of (an ANSWER
      hit excluded in A1 or disclosed as a leak, with J5's agreement on that
      quantity then recorded as not blind), each A1 definition is a verbatim
      copy, and the lane-B tier follows escalation_test (FIRED requires all
      three reviews at review-breakthrough at max). A tier that does not follow
      the recorded test fires K-escalation-breach. A misclassified hit is a
      procedure finding disclosed in DEC-20260925-a84b16, never repaired by
      silently re-running a review.
    - >-
      CB-5 TRIPWIRES. If any of TB-1 to TB-4 was reported or is found, apply its
      stated effect as the plan writes it (TB-1 after a NOT_FIRED ESC-B means
      the round is re-run at review-breakthrough at max and these reports
      cannot compose to approve; TB-3 applies K-row-failure).
    - >-
      CB-6 PRIOR. Compare the outcome with the prior recorded in the plan, joint
      by joint, in the worksheet.
    - >-
      CB-7 DECISION FILE. Write DEC-20260925-a84b16 with DEC-20260924-124667's
      field set: decision (approve | revise | ...), decision_label, rulings,
      rationale, evidence_refs, limitations, next_actions with exactly one
      first, knowledge_promotion, inference, procedure_deviations,
      runs_launched 0, status_transitions, official_until. Under K-approve it
      approves 'EXP-BINSTD-178742 version 2' under the standing user
      authorization and its first next action opens an execution batch whose
      executor card is minted then, status fields advancing only in that batch
      (R-CARRIED R4); under any other key it lists every defect with its joint
      and breaking artifact and applies that key's stated next action.
    - >-
      CB-8 NO EDITS, NO OVER-PROMOTION. Edit no hypothesis, specification, plan,
      gate file, report or goal head; the approval, if any, takes effect only
      through the specification's conditional approval block when
      TASK-20260925-b25565 verifies. Promote no claim beyond what the keys
      permit; an approval asserts nothing about any deployed curve's security.
    - >-
      CB-9 HOLDS (R-ONE-BATCH; NA-8). Carry HOLD-B, HOLD-C and HOLD-M
      (DEC-20260924-286589 R-HOLDS), and apply X-KOBLITZ and X-CERTBIN if they
      have fired. Carry no lane-A hold.
    - >-
      CB-10 Fill knowledge_promotion; a protocol approval or refusal is expected
      to be not_warranted with a concrete reason.
    - >-
      CB-11 An instrument, custody, tool or provenance defect is not a
      mathematical result, and an infrastructure failure or a killed session is
      never negative evidence (plan K-infra). J5's inconclusive attestation by
      design is not K-infra.
    - >-
      CB-12 OUTCOME DISCIPLINE. No c2pnb value from the TASK-20260924-624abf
      report, no AUXIN census value, RUN-FROB-627924 value, EXP-FROB-30006a
      outcome, lane-A reviewer value or anything from
      experiments/EXP-QSP-70b731/runs/; do not read experiments/EXP-FROB-30006a/,
      experiments/EXP-QSP-70b731/runs/, the cursor/semaev-2015-audit-program-5b8b
      ref or PR #1377.
    - >-
      CB-13 R-CONTINUATION. Skeleton first (header, card id, the six digests,
      the independence-check output, a procedure section, an attestation stub,
      every joint pending), then joint by joint. A continuing fresh Coordinator
      session obtains fresh digests from the top-level session and compares
      them with those the worksheet recorded first and with the launch prompt
      (a mismatch is a custody failure), redoes any incomplete joint from
      scratch and discloses the continuation in the procedure section.
    - >-
      CB-14 ZERO RUNS, NO GIT, NO DISPATCH, NO NEW ID.
