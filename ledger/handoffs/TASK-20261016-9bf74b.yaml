handoff:
  id: TASK-20261016-9bf74b
  from: coordinator
  to: validator
  goal_ids:
    - GOAL-SCURVE-be9707
    - GOAL-SCURVE-cef9f7
    - GOAL-SCURVE-137bd9
  opened_by_decision: DEC-20261016-7bcdd6
  objective: >-
    Independent validation of the internal reproduction of the NIST / X9.62
    curve seed provenance (research/nist_seed_provenance_20261016/), under the
    frozen review_plan below. The Validator owns joints J1-J7, the
    proves-too-much control and the blind re-derivation. It reports holds,
    breaks or inconclusive per joint, and recommends an evidence strength. It
    does not decide what the result means for any goal or record.
  uncertainty_reduced: >-
    Whether the bundle's claims C1-C4 survive an independent implementation
    that never saw the producer's code. Only that can show whether an
    evidence record of strength replicated or strong may be written, and
    whether KN-FIND-cee88d may then be promoted (DEC-20261016-fb3a6f). Also
    whether C5 is labelled and provenanced as the README says.
  inputs:
    - ledger/handoffs/TASK-20261016-9bf74b.yaml
    - ledger/decisions/DEC-20261016-7bcdd6.yaml
    - research/nist_seed_provenance_20261016/README.md
    - research/nist_seed_provenance_20261016/SOURCE.md
    - research/nist_seed_provenance_20261016/PREREGISTRATION.md
    - research/nist_seed_provenance_20261016/census/orders_863711343.txt
    - research/nist_seed_provenance_20261016/census/orders_863966734.txt
    - research/nist_seed_provenance_20261016/census/orders_871002724.txt
    - research/nist_seed_provenance_20261016/census/orders_871696354.txt
    - research/nist_seed_provenance_20261016/census/orders_872952608.txt
    - research/nist_seed_provenance_20261016/census/orders_891607927.txt
    - research/nist_seed_provenance_20261016/census/summary.json
    - ledger/decisions/DEC-20261016-fb3a6f.yaml
    - knowledge/literature/KN-LIT-d2f917.md
    - problems/nist-seed-selection-rule-unexplained.md
    - agents/validator.md
    - templates/research-records.md
  input_roles: >-
    Your context is this card and its review_plan (the assignment), plus
    DEC-20261016-7bcdd6 (why the round is open, and the Coordinator's
    pre-committed strength reading). README.md states the claim. It is the
    object of review, never a method source. SOURCE.md is the J6 hash table.
    The six orders files are the recorded data under test ("i N0 Nt", 0 =
    early abort). summary.json is the producer's classifier output; open it
    only after constraint 4 is met. PREREGISTRATION.md, DEC-20261016-fb3a6f,
    KN-LIT-d2f917 and the problem record are read for J7 only.
    agents/validator.md is your contract ("Working under a review plan",
    "Blind re-derivation tasks"). templates/research-records.md gives the
    review_attestation shape.
  source_snapshot:
    commit: >-
      Validate the bundle as it stands at the freeze commit, the commit that
      first adds this card (`git log --diff-filter=A --format=%H --
      ledger/handoffs/TASK-20261016-9bf74b.yaml`). Its base is origin/main
      6c775b663, which contains PR #2278. Record the full SHA in the report.
    binding: >-
      Content first, by the 14 SHA-256 values in SOURCE.md. These are the same
      values that TASK-20261016-714367 recorded as input_bindings. No
      Coordinator snapshot task archived the bundle; the deviation is
      recorded in review_plan.procedure_deviations.
  constraints:
    - >-
      1. Independence. Run in a fresh session that did not produce, copy or
      archive the bundle, and that did not take part in DEC-20261016-fb3a6f
      or DEC-20261016-7bcdd6. Read no path in
      review_plan.blind_rederivation.blind_from at any point in this task.
      The checker treats any such read as a leak, and this round has no
      separate blind phase. The README says the Rust receipt in
      /home/user/crypto may be read. That is overridden here: it is in
      blind_from.
    - >-
      2. Opaque operations are allowed on blind_from paths and must be
      listed separately from sources_read, under `opaque_operations` in
      validation_report.yaml. Allowed: byte hashing (`sha256sum`,
      `git show <rev>:<path> | sha256sum`), `cmp` exit codes, `git ls-tree`,
      and `git log --format='%H %cI %s' -- <path>`. Never print file content,
      diffs or commit bodies of a blind_from path. If you learn content by
      accident, say so in the attestation.
    - >-
      3. Specifications are retrieved, not recalled. Name the exact source
      you implemented from in sources_read: drand48, lrand48 and srand48 from
      the POSIX / Open Group drand48 page (the glibc manual is a fallback);
      the X9.62 verifiably-random seed-to-r map from ANSI X9.62 A.3.3.1, or
      from the corresponding appendix of FIPS 186-2 or SP 800-186; and the
      published curve parameters (seed, p, a, b, n) for the 10 prime curves
      and B-233/283/409/571. For the parameters, `openssl ecparam -name
      <curve> -param_enc explicit -text` prints the seed, or use the
      standards text. If two sources disagree, report it. Do not copy code
      listings from the two primary posts (KN-LIT-d2f917) for drand48, the
      X9.62 map or the classifier.
    - >-
      4. Ordering. Write your own outputs before you read the producer's
      corresponding outputs, and log the SHA-256 and a UTC timestamp of each
      in validation-20261016/logs/order.log: the regenerated seeds, the
      candidate index sets, your point counts, and your classification.
      Only then open census/summary.json, or the two posts if you read them
      at all. The README's stated counts are part of the claim and are
      visible from the start. This round blinds you to the producer's
      implementation, not to the target values (DEC-20261016-7bcdd6,
      limitations).
    - >-
      5. Write only under
      research/nist_seed_provenance_20261016/validation-20261016/. Never edit
      the bundle, any ledger record, knowledge entry, goal record, or
      anything in /home/user/crypto. Do not commit. The top-level session
      archives your outputs under TASK-20261016-670480.
    - >-
      6. Preserve every mismatch, failed attempt and crash. A check that
      fails is a finding, and nothing is tuned to pass. A crash, timeout or
      missing tool is infrastructure signal: report the check as
      `not_run` and give the reason. It is never a negative or positive
      result. If an encoding is underspecified (for example the lrand48 word
      layout of the binary seeds), try a declared, enumerated family of
      readings. Report the family size and which members match, and widen
      the chance bound by log2 of the family size. Do not read producer code
      to pick a reading.
    - >-
      7. Environment (as reported by the dispatching session; verify and
      record actual versions): PARI/GP 2.15.4 with seadata at /usr/bin/gp;
      Python 3 with gmpy2 and fpylll; about 2.4 GB of free disk (no cargo
      builds); 4 cores. Record the interpreter path and the versions you
      used. Keep logs under about 200 MB in total.
    - >-
      8. These verification computations are not experiment runs. Write no
      run record, no EXP and no EV.
  deliverables:
    - research/nist_seed_provenance_20261016/validation-20261016/validation_report.yaml
    - research/nist_seed_provenance_20261016/validation-20261016/validation.md
    - research/nist_seed_provenance_20261016/validation-20261016/logs/order.log
  artifact_paths:
    - research/nist_seed_provenance_20261016/validation-20261016/
  write_scope:
    - research/nist_seed_provenance_20261016/validation-20261016/
  archived_by: TASK-20261016-670480
  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
    delivery: interactive
  budget:
    maximum_runs: 0
  dispatch_preconditions:
    - >-
      The freeze commit (DEC-20261016-7bcdd6, this card,
      TASK-20261016-670480) is committed, pushed, and named in a
      ready-for-review PR against main before the Validator starts. The
      nonce depends on that commit's SHA.
    - >-
      Before launch, run tools/goal_lanes.py for the three goals. If another
      session holds a live claim on any of them, claim a non-overlapping lane
      for this write_scope.
    - >-
      Launch with the validator role (.claude/agents/validator.md, policy
      review-adversarial), not with validator-sweep.
  completion_gate:
    - >-
      validation_report.yaml exists with id VAL-20261016-cd9156 and task_id
      TASK-20261016-9bf74b, in the agents/validator.md schema. Each check
      is a separate entry with status pass | fail | concern | not_run, the
      claim (C1-C5) and joint (J1-J7) it bears on, the evidence path, and
      the values compared. Every mismatch is listed verbatim, none dropped.
    - >-
      The report carries a review_attestation (templates/research-records.md)
      with task_id TASK-20261016-9bf74b, joints_owned [J1, J2, J3, J4, J5,
      J6, J7], a verdicts mapping with one holds | breaks | inconclusive per
      joint label, a complete sources_read, a separate opaque_operations
      list, read_sibling_reports, and blind_from_respected set to true only
      if it is true.
    - >-
      A recommended evidence strength on the repository hierarchy
      (docs/evidence-and-reproducibility.md: anecdotal | preliminary |
      replicated | strong | inconclusive | contradictory), stated separately
      for C1, C2, C3 and C4, with rationale. C5 gets a labelling and
      provenance verdict only.
    - >-
      The nonce, the sampled row list, and the per-run counts of sampled
      zero and nonzero rows are recorded, so the sample can be re-derived
      from the freeze commit.
    - >-
      validation.md separates Observation, Comparison, Inference and
      Limitation. Every file under validation-20261016/ is listed in
      artifact_paths with its SHA-256.
  return_format: >-
    Paths of validation_report.yaml and validation.md; a per-joint verdict
    table; every fail and concern, one line each; the strength recommendation
    per claim; the nonce and the freeze-commit SHA; any blindness or
    procedure departure.
  review_plan:
    claim_under_review: >-
      As the producer states it in research/nist_seed_provenance_20261016/README.md
      (the Coordinator's index C1-C5 is added for joint bookkeeping, and the
      wording is the README's).
      C1 (README "Claim"): every X9.62 / FIPS 186-2 prime-curve seed (P-192,
      P-224, P-256, P-384, P-521, prime192v2/v3, prime239v1-v3) is one 20-byte
      block of (int)(drand48() * 256) output after srand48(t), with t a UNIX
      time between May 1997 and April 1998, and each block is tried as an
      X9.62 seed. Four of the five binary-curve seeds (B-233, B-283, B-409,
      B-571) are five lrand48() words after srand48(t / 2) on 1998-04-17.
      The native tests listed in the README check: all 10 prime seeds are
      regenerated at the stated block; r(seed) * b^2 = -27 (mod p) for all
      10 (X9.62 A.3.3.1, a = -3); B-233/283/409/571 are regenerated; and a
      control that neither the previous block nor the next second's run
      matches.
      C2 (README "How strong the attribution is"): a 48-bit LCG state that
      regenerates all 160 bits of a seed occurs by chance with probability
      about 2^-112. Walking the state backwards reaches an srand48-form
      state (low 16 bits 0x330E) every 65,536 steps. Within 8,000 blocks,
      at most one such state is block-aligned, and for each of the ten seeds
      that state is the claimed 1997-98 timestamp. Two triples of seeds land
      on identical values. Six such dates by chance: about 10^-11.
      C3 (README "The census"): for each run, up to the run's last
      published seed, the candidates are the blocks where b^2 = -27/r is a
      square. The curve with b0 = (b^2)^((p+1)/4) (any root when p = 1 mod
      4) and its quadratic twist are point-counted with ellsea early abort,
      recorded as census/orders_<run>.txt, "i N0 Nt", with 0 meaning early
      abort. Classification uses prime order, bitlen(n) <= bitlen(p),
      n != p, and p^k != 1 (mod n) for k < 2^10. The measured table: 21,753
      blocks; 11,042 with b; 47 twist only prime; 17 with n longer than p;
      21 accepted; 10 published and 11 skipped; matches the posts 21 of 21.
      Per run: 863711343 p239 3,048/1,555/9/0/8; 863966734 p192
      6,013/3,061/14/7/5; 871002724 p521 1,136/584/0/0/1; 871696354 p256
      1,842/960/4/0/2; 872952608 p384 2,688/1,337/4/2/1; 891607927 p224
      7,026/3,545/16/8/4. Also: the bitlen rule can never apply at p239 or
      p256; in the four p = 3 (mod 4) runs, 31 seeds were lost because -b
      was never tried.
      C4 (README "Derived observations"): on every curve with p = 3 (mod 4)
      (nine published curves), b is the (p+1)/4 root. P-224's b is the
      negative of the Tonelli-Shanks root taken with the smallest
      non-residue (11).
      C5 (README "External analyses"): the skip-filter screen, the
      RNG-consumption models and the generator scan ran outside both
      repositories. They are reported as observations, not repository
      evidence. The skip-filter protocol was frozen before any curve order
      was seen (PREREGISTRATION.md, verbatim).
      Out of scope: the security-consequences table, the base points, B-163,
      the 30-bit freedom figure (attributed to Valsorda), and any ECDLP
      statement.
    coordinator_prior: >-
      Written 2026-10-16, before any reviewer ran.
      C1 and C4: high confidence that they hold. Two independent sources
      claim them, and they are exactly checkable. A break here would most
      likely be a convention error in the review itself (index base, byte
      order), not in the claim.
      C3: moderate-high. The computation is large, and the early-abort
      semantics are the weak point: a 0 row whose true order is prime would
      be a missed acceptance that the 21-of-21 match would not reveal if
      the posts used the same tool. I expect the counts to reproduce. I
      expect at least one wording concern: "the four p = 3 (mod 4) runs".
      Five of the six runs have p = 3 (mod 4), and the p521 run contributes
      0 twist-only rows, so 31 = 9+14+0+4+4 is probably right while "four"
      is a miscount.
      C2: moderate on the "at most one block-aligned state within 8,000
      blocks" detail and the 10^-11 arithmetic; high that state recovery
      reaches the stated t.
      C5: I expect the labelling to hold. I have low confidence in the
      preregistration's timing claim. The file says it was written at about
      19:27 UTC in a scratch directory and was not committed then, so no
      immutable timestamp shows it preceded the data. Its own amendment
      says it was added after the P-192 run reproduced. I expect J7 to
      return concern, not holds.
      Overall: I expect C1-C4 to hold, with one or two wording concerns,
      and C5's preregistration to be unverifiable as to timing.
    joints:
      - joint: >-
          J1 -- BYTE MAPPING AND BLOCK INDEXING. Seed byte j of block i of
          run t is (int)(drand48()*256) from the (20*i + j)-th call after
          srand48(t), under the index base the bundle uses. The first byte
          generated is the first byte of the seed.
        assigned_to: TASK-20261016-9bf74b
        attack_plan: >-
          Implement srand48 and drand48 from the POSIX text alone. Show that
          (int)(drand48()*256) equals the top 8 bits of the 48-bit state, and
          check by direct double arithmetic. For each prime run t, generate
          blocks forward up to the README's block count and search for each
          published seed. Do not start from a stated index. Record the
          position found, both 0-based and 1-based. Then determine which base
          makes it the last element of that run's census/summary.json
          accepted list (for single-curve runs), and that the README's
          block count equals the last published index. Vary: reverse the byte
          order in the block; shift by one byte; shift by one block; use t-1
          and t+1. Each must fail. I expect any break here to be an index
          base mismatch between the README's block count and summary.json.
        breaking_artifact: >-
          A published seed not found in its run, found only under a
          different byte order or offset, or found at a position that matches
          neither convention of the recorded indices.
      - joint: >-
          J2 -- X9.62 SEED-TO-r EXPANSION. r is computed from the seed by
          ANSI X9.62 A.3.3.1: SHA-1 of the seed, the rightmost v bits, the
          leftmost bit of that chunk cleared, then SHA-1 of (seed + i) mod
          2^g for the remaining chunks, concatenated. The published b then
          satisfies r * b^2 = -27 (mod p) for all ten prime curves.
        assigned_to: TASK-20261016-9bf74b
        attack_plan: >-
          Implement the map from the retrieved standard text. Compute r for
          the 10 published seeds and check r*b^2 + 27 = 0 mod p with the
          published b. Then run each wrong variant on all 10 curves: (a) top
          bit not cleared; (b) leftmost v bits instead of rightmost; (c) seed
          + i without the mod-2^g wrap; (d) seed + i on a little-endian
          reading; (e) i starting at 0 instead of 1. A variant that also
          passes on all 10 means the check cannot identify that detail.
          Report it as non-identifying, not as a failure. Then compute the
          candidate index set (blocks where -27/r is a nonzero square mod p)
          for all 21,753 blocks of the six runs with your own code. Compare
          it with the i column of each orders file, as a set and as a count
          per run, against 1,555 / 3,061 / 584 / 960 / 1,337 / 3,545. I
          expect it to hold. Where it breaks, it would break on v at P-521
          (v = 41) or at P-192 (v = 32).
        breaking_artifact: >-
          A published curve failing r*b^2 = -27, or an index set that
          differs from the recorded rows: a missing row, an extra row, or a
          count mismatch.
      - joint: >-
          J3 -- POINT COUNTS AND EARLY ABORT. Every nonzero N0 and Nt in the
          orders files is the true group order of the curve, or of its
          quadratic twist, with b0 = (b^2)^((p+1)/4). A 0 entry means the
          true order has a small prime factor, so it is never prime.
        assigned_to: TASK-20261016-9bf74b
        attack_plan: >-
          With full ellcard (no early abort), count the curve for each of
          these rows: all 21 accepted, all 17 bitlen rejects, all 47
          twist-only rows, and the nonce sample. The nonce is
          SHA-256(ASCII of the 40-hex freeze-commit SHA). For each run,
          among the rows outside those 85, key(row) = SHA-256(nonce_hex +
          ":" + t + ":" + i). Take the 34 rows with the smallest keys, which
          gives at least 204 rows in total. If fewer than 5 of a run's
          selection have N0 = 0, add that run's smallest-key N0 = 0 rows
          until there are 5. Do the same for Nt = 0. Compute Nt' = 2(p+1) -
          N. Check: every recorded nonzero N0 equals N, and every nonzero Nt
          equals Nt'. Every N0 = 0 row has a non-prime N; give its smallest
          prime factor, and flag any whose smallest factor exceeds 1000 as a
          concern about the early-abort semantics. The same holds for Nt =
          0. For every prime N, check N*P = O for three random points, and
          that N lies in the Hasse interval; for prime N that certifies the
          order without relying on SEA. Recommended, and required for a
          strong recommendation on C3: an independent early-abort re-census
          of all 11,042 rows with your own driver (about 1.5 CPU-hours per
          the README), compared row by row. I expect a break, if any, in a
          zero row whose true order is prime.
        breaking_artifact: >-
          A row where the recorded value differs from the full count, a zero
          entry whose true order is prime, or a twist value inconsistent with
          2(p+1) - N.
      - joint: >-
          J4 -- TWIST BOOKKEEPING. "Twist only prime" counts curves whose
          quadratic twist, but not the curve itself, has prime order. For p =
          3 (mod 4) the twist is y^2 = x^3 - 3x - b, an a = -3 curve the
          1997 code could have reached with -b. For p = 1 (mod 4) (P-224),
          the twist is not representable with a = -3, so the "lost seed"
          reading cannot apply there.
        assigned_to: TASK-20261016-9bf74b
        attack_plan: >-
          From your J3 counts, and the recorded orders where J3 did not
          recount, recompute the twist-only count per run: 9 / 14 / 0 / 4 /
          4 / 16, total 47. Show algebraically and numerically that for p =
          3 (mod 4), y^2 = x^3 - 3x - b0 has order 2(p+1) - N. Show that for
          P-224, -1 is a square mod p, so b -> -b is isomorphic and the twist
          needs a non-square d, giving a = -3 d^2 != -3. Check that the
          README's "31 seeds lost" is scoped to p = 3 (mod 4) runs only, and
          equals 47 - 16. Check the word "four": count the p = 3 (mod 4)
          runs. Check that no record in this repository presents P-224's 16
          twist-only rows as seeds lost to the -b choice.
        breaking_artifact: >-
          A twist-only count that differs from the claim, a "lost" count that
          includes P-224 rows, or a twist order that is not 2(p+1) - N.
      - joint: >-
          J5 -- CLASSIFIER CRITERIA. Applied to the recorded orders, the
          criteria (prime n, bitlen(n) <= bitlen(p), n != p, p^k != 1 mod n
          for 1 <= k < 2^10) give exactly the accepted lists: 21 in total,
          8/5/1/2/1/4 per run, and 17 bitlen rejects, 7/2/8 at p192, p384 and
          p224.
        assigned_to: TASK-20261016-9bf74b
        attack_plan: >-
          Write your own classifier from the stated criteria and apply it to
          the six recorded files. Write and hash its output (constraint 4),
          then compare it with summary.json list by list. Sensitivity, as a
          proves-too-much check on the criteria: (a) replace the bitlen rule
          by n < p. The dispatching brief reports that prime239v2 has p < n,
          which the Coordinator has not checked. First verify it from the
          published n. If it is true, the n < p rule must reject a published
          curve; confirm that it does. List every row where the two rules
          differ. (b) Replace k < 2^10 by the X9.62 MOV bound
          from the retrieved standard (record the B you used), and by k <=
          100. Report any row whose class changes; I expect none. (c) Check
          that the bitlen rule cannot fire at p239 or p256, from p and the
          Hasse bound. Then identify the published seeds' indices from J1,
          and check that published is a subset of accepted with 10 / 11
          published / skipped. If you read the posts, do it only after the
          logged comparison, and compare their accepted lists with yours.
        breaking_artifact: >-
          An accepted, rejected or twist-only list that differs from
          summary.json; a published seed that is not accepted; or a criterion
          variant under which the claimed list is not reproduced although the
          README says it should be.
      - joint: >-
          J6 -- BUNDLE INTEGRITY. The 14 files listed in SOURCE.md have the
          stated SHA-256 at the freeze commit. They are byte-identical to
          research/nist_seed_provenance_20261016/ in aburan28/crypto on
          branch claude/nist-seed-provenance, the stated source of truth.
        assigned_to: TASK-20261016-9bf74b
        attack_plan: >-
          sha256sum the 14 files at HEAD, and at the freeze commit via git
          show. Then, opaquely, sha256sum the same 14 paths from
          `git -C /home/user/crypto show
          origin/claude/nist-seed-provenance:research/nist_seed_provenance_20261016/<f>`.
          Use the local branch if origin's ref is absent, and record which
          ref and commit SHA you used. List any file present in this bundle
          but absent from SOURCE.md, and any
          path the README refers to that does not exist in this repository.
          Exclude from that list SOURCE.md itself, your own validation-20261016/,
          and archives/.
          The README refers to census.sh, plot_streams.py and examples/;
          SOURCE.md says they are not copied, so check that the README is
          consistent with that. Report missing refs as not_run, not as fail.
        breaking_artifact: >-
          A hash mismatch at HEAD, at the freeze commit, or against the
          crypto source of truth.
      - joint: >-
          J7 -- PREREGISTRATION PROVENANCE AND EXTERNAL LABELLING. The
          external analyses (C5) are labelled everywhere as observations and
          not as repository evidence. PREREGISTRATION.md's claim that it was
          frozen before any curve order was seen is supported by an immutable
          record.
        assigned_to: TASK-20261016-9bf74b
        attack_plan: >-
          Do not re-run the science. (a) Find the earliest immutable
          timestamp for PREREGISTRATION.md and for the census orders files.
          Use opaque `git log --format='%H %cI %s' --` in /home/user/crypto
          and in this repository, and look for any third-party timestamp the
          bundle cites. Say whether any record shows the preregistration
          preceded the census data. Committing it in the same commit as the
          data shows nothing. (b) Its amendment says it was added after the
          P-192 run reproduced. Check whether "frozen before any curve order
          was seen" (README) is consistent with that, given that the POSTHOC
          feature is labelled. (c) Read README "External analyses",
          DEC-20261016-fb3a6f, KN-LIT-d2f917 and
          problems/nist-seed-selection-rule-unexplained.md. List every
          sentence that presents a C5 result as a repository measurement or
          as validated. Expected: labelling holds; timing concern.
        breaking_artifact: >-
          A record presenting C5 as repository evidence, or evidence that
          the preregistration was written after the census orders were
          inspected.
    blindness:
      mutual: true
      lifted_for: []
      rationale: null
      note: >-
        One reviewer owns all seven joints, so mutual blindness is vacuous
