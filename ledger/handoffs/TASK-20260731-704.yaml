handoff:
  id: TASK-20260731-704
  from: coordinator
  to: coordinator
  objective: >-
    Commit and verify the exact BATCH-002 producer artifacts — the standalone
    derivation note and its verification script plus the super-box ideation
    package (TASK-20260731-701), the harness repair package (TASK-20260731-702),
    and the GATE-601-B run package (TASK-20260731-703) — before any independent
    review reads them.
  uncertainty_reduced: >-
    Whether the validator inspects an immutable, source-bound producer snapshot
    rather than a mutable working tree; and, decisively for this batch, whether
    the standalone derivation note exists as a COMMITTED artifact BEFORE the
    ledger decision that relies on it and promotes it to KN-FIND-028. Under
    docs/claims-and-verification.md ("Refutation artifacts") that ordering is the
    whole reason this batch was structured as it was.
  inputs:
    - The three TASK-20260731-701 artifacts
    - The three TASK-20260731-702 artifacts
    - The three TASK-20260731-703 artifacts
  constraints:
    - >-
      Run alone. No other task may hold the Git index or HEAD concurrently.
    - >-
      Stage ONLY the nine declared producer artifact paths and this task's own
      receipt path. A scope-expanding commit blocks downstream review; it is an
      evidence-integrity failure, not a research result.
    - >-
      The commit message names TASK-20260731-701, TASK-20260731-702,
      TASK-20260731-703, TASK-20260731-704, and GOAL-AES-001.
    - >-
      Verify BEFORE committing that every producer artifact carries a filled
      inference block (policy, requested_policy, resolved model identifier,
      fallback_used, model_verified). A missing inference block is a
      COMPLETION-GATE FAILURE at dispatch: the producing task is returned as
      incomplete rather than snapshotted, and the defect is named concretely.
      This is the prospective repair of EV-AES-001 defect D-1.
    - >-
      Do not write the commit's own SHA into any artifact inside that commit;
      the dispatch verifier binds the receipt to Git after the commit.
    - >-
      Create NO evidence, decision, hypothesis, or knowledge record in this task.
      This is a snapshot archive, not a ledger archive: record_ids is empty.
    - >-
      Do not repair, edit, extend, or re-run any producer artifact to make it
      pass. Defects are recorded and returned, never fixed here.
  deliverables:
    - snapshot-receipt.json
  artifact_paths:
    - coordination/goals/GOAL-AES-001/batches/BATCH-002/archives/TASK-20260731-704/snapshot-receipt.json
  archived_by: TASK-20260731-704
  inference:
    policy: coordinator-orchestration-code
    requested_policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
    standing_basis: >-
      inference-amendment commit 0137a051eb5828789eb267fa83c8278086578d4c.
  budget:
    wall_clock_seconds: 300
    memory_gb: 1
    maximum_runs: 1
  completion_gate:
    - >-
      Every one of the nine producer artifacts carries a filled inference block,
      or the offending producer task is returned as incomplete and NOT
      snapshotted, with the defect named.
    - >-
      Git verifies the commit is reachable from HEAD, has the expected parent,
      changes exactly the declared paths, and matches the recorded SHA-256
      hashes.
    - >-
      The receipt names the three source task IDs, the archive kind `snapshot`,
      the parent SHA, and a SHA-256 for every committed path; record_ids is
      empty because a snapshot archive commits no ledger record.
    - >-
      The derivation note and its verification script are among the committed
      paths, so that the artifact precedes the decision that will rely on it.
  return_format: >-
    The snapshot receipt, plus the commit SHA, its parent, the exact list of
    changed paths, and confirmation that every producer artifact carried an
    inference block.
