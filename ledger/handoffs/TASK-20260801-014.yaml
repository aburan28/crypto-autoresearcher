handoff:
  id: TASK-20260801-014
  from: coordinator
  to: executor
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-022
  objective: >-
    Execute RUN-SMTH-001-heur exactly as experiments/EXP-SMTH-001/specification.yaml
    specifies. Build the two toy curve instances at bits 16 and 20 from master seed
    2201; build the frozen 512-element deterministic factor base at each; compute the
    frozen intermediate map INT-1 EXHAUSTIVELY over all C(513,2) = 131328 unordered
    half-tuples under the primary encoding ENC-B and the power-certificate encoding
    ENC-A; draw the matched null OBJ-NULL-UNIF uniformly on [1, p**2] and the
    apparatus-identity control OBJ-NULL-SYNTH at the same count; factor every sample,
    record its largest prime factor and its Bsm-smoothness indicator at every rung of
    the frozen Bsm ladder; compute the KS, rate-band, tail, two-sample KS and decay
    statistics; and re-verify every factorization through an independent verifier path.
    Observe and record only. Interpret nothing and classify nothing against the reading
    rule.
  uncertainty_reduced: >-
    Whether the integer invariants of the half-arity Semaev partial map obey the
    Dickman smoothness law at toy scale - the question HEUR-DS-1 asserts an answer to
    and which has never been measured on the correct object.
  inputs:
  - experiments/EXP-SMTH-001/specification.yaml
  - ledger/hypotheses/H-SMTH-001.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-022/archives/TASK-20260801-013/snapshot_commit_receipt.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-022/reviews/TASK-20260801-012/contract_review.yaml
  - harness/toycurve.py
  constraints:
  - >-
    run_authorized ONLY if TASK-20260801-013 records APPROVAL_DETERMINATION APPROVED;
    otherwise cancel with no run and say so.
  - >-
    DO NOT READ-MODIFY, IMPORT, EDIT OR STAGE ANY FILE UNDER experiments/EXP-DS-001/.
    The driver is new and standalone.
  - >-
    FORBIDDEN ANTI-PATTERN AP-1 - do NOT set smoothness_abort = true on any EXP-DS-001
    arm and do not represent any such run as exercising this mechanism. That calls
    is_B_smooth on an identity-encoded x-coordinate below 2**20, a stand-in and not the
    Semaev intermediate, and produces a false ledger tick while testing nothing.
  - >-
    NO SEARCH ARMS, NO TIMING DECISION VARIABLE, NO COST IDENTITY, NO R, no naive arm,
    no split arm, no claw table, no relation harvest. wall_seconds_total is recorded
    for budget accounting only and is never a decision variable.
  - >-
    The run manifest is manifest.yaml, NOT manifest.json, and the companion artifacts
    are command.txt, environment.json, stdout.log, stderr.log and raw-result.json - the
    exact filenames tools/validate_ledger.py check_run requires beside an indexed
    manifest.
  - >-
    The manifest must carry id, experiment_id, status, code with commit and command,
    environment, inputs with parameters, timing and result; result.certificate.kind
    must be the literal string none, because no discrete logarithm and no decomposition
    is claimed.
  - >-
    n = 131328 per sample set, exhaustive over half-tuples for the real sets. Report any
    short set as short; never pad, impute or extrapolate a sample.
  - >-
    Bfb is the FACTOR-BASE SIZE (512) and Bsm is the SMOOTHNESS BOUND. Never write
    either as B anywhere in the driver or the artifacts.
  - >-
    Every u used for a rho evaluation must be RECOMPUTED from the frozen integer Bsm
    ladder by u = ln(D)/ln(Bsm). Never assert a u.
  - >-
    Record your own computed rho values beside the contract's frozen reference table
    and flag any discrepancy above 1 percent.
  - >-
    The null pipeline must differ from the real pipeline in the source of the integers
    and in nothing else. Record that fact and how you ensured it.
  - >-
    Re-verify every factorization by recomputing the product of the recorded prime
    powers and re-checking the primality of every factor, through a verifier path that
    does not reuse the factoring call. Report verified over total per sample set.
  - >-
    Record the degenerate-draw count (leading coefficient zero mod p),
    factor_base_sha256, null_stream_sha256, synth_stream_sha256 and
    intermediate_map_sha256.
  - Assert and record that every sample lies in [1, p**2] and that p**2 <= D.
  - >-
    Timeouts, crashes, memory exhaustion and budget cancellation are infrastructure
    signal, never mathematical negatives (AGENTS.md rule 5).
  - >-
    Do NOT classify the result against RR-SMTH-1 and do not state a disposition; that
    is TASK-20260801-018's exclusive job.
  - Do not alter H-SMTH-001, H-DS-001, H-IC-001 or H-STR-002, or any ledger record.
  - MAKE NO COMMIT; TASK-20260801-015 archives.
  - Record inference fallback honestly (requested executor-implementation).
  - No new dependencies beyond the recorded sympy 1.14.0 and no new mathematics.
  - Leave FAEST and XEDN alone.
  deliverables:
  - experiments/EXP-SMTH-001/runs/RUN-SMTH-001-heur/manifest.yaml
  - experiments/EXP-SMTH-001/runs/RUN-SMTH-001-heur/raw-result.json
  - experiments/EXP-SMTH-001/runs/RUN-SMTH-001-heur/command.txt
  - experiments/EXP-SMTH-001/runs/RUN-SMTH-001-heur/environment.json
  - experiments/EXP-SMTH-001/runs/RUN-SMTH-001-heur/stdout.log
  - experiments/EXP-SMTH-001/runs/RUN-SMTH-001-heur/stderr.log
  - experiments/EXP-SMTH-001/results/heur/HEUR_SMTH_report.json
  - experiments/EXP-SMTH-001/results/heur/null_comparison.json
  - experiments/EXP-SMTH-001/results/heur/decay_table.json
  - experiments/EXP-SMTH-001/results/heur/power_certificate.json
  - experiments/EXP-SMTH-001/implementation/smth001_driver.py
  - experiments/EXP-SMTH-001/implementation/implementation.md
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-022/tasks/TASK-20260801-014/execution_report.yaml
  artifact_paths:
  - experiments/EXP-SMTH-001/runs/RUN-SMTH-001-heur/manifest.yaml
  - experiments/EXP-SMTH-001/runs/RUN-SMTH-001-heur/raw-result.json
  - experiments/EXP-SMTH-001/runs/RUN-SMTH-001-heur/command.txt
  - experiments/EXP-SMTH-001/runs/RUN-SMTH-001-heur/environment.json
  - experiments/EXP-SMTH-001/runs/RUN-SMTH-001-heur/stdout.log
  - experiments/EXP-SMTH-001/runs/RUN-SMTH-001-heur/stderr.log
  - experiments/EXP-SMTH-001/results/heur/HEUR_SMTH_report.json
  - experiments/EXP-SMTH-001/results/heur/null_comparison.json
  - experiments/EXP-SMTH-001/results/heur/decay_table.json
  - experiments/EXP-SMTH-001/results/heur/power_certificate.json
  - experiments/EXP-SMTH-001/implementation/smth001_driver.py
  - experiments/EXP-SMTH-001/implementation/implementation.md
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-022/tasks/TASK-20260801-014/execution_report.yaml
  artifact_paths_note: >-
    The new driver smth001_driver.py and implementation.md are declared HERE AND NOW
    rather than by later amendment, because tools/research_dispatch.py derives
    TASK-20260801-015's expected commit scope as the union of that archive task's
    artifact_paths with this task's. This is the direct application of the BATCH-020
    lesson recorded in QUEUE-AMEND-20260801-002 / DEC-20260801-002. Note manifest.yaml
    and the .log extensions per DEC-20260801-006.manifest_filename_ruling.
  archived_by: TASK-20260801-015
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 7200
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
  - >-
    Declared deliverables written within write_scope; APPROVED gate respected; all
    eight sample sets at n = 131328 or an honest short report; every factorization
    independently re-verified with verified over total reported per set; every u
    recomputed from the frozen ladder; null pipeline identity recorded; no search arm,
    no timing decision variable and no R anywhere in the package; no fabricated
    statistic; no disposition stated.
