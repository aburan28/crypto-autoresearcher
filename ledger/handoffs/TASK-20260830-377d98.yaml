handoff:
  id: TASK-20260830-377d98
  from: coordinator
  to: executor
  objective: >-
    Execute the FROZEN, coordinator-approved contract EXP-MONO-670aa6
    exactly as written: a corrected-calibration replication of
    H-MONO-663fb4's K3/K4 discriminating test using 200 null draws per
    cell, a mandatory pre-treatment null-object gate, and
    Holm/Bonferroni-corrected permutation p-values across a >=100-curve
    panel (>=50 j=0, >=50 random-ordinary), plus a smaller 8-curve legacy
    sub-panel reproducing EXP-MONO-c819ba's own subgroup/coset-union/
    ladder controls for continuity. Record observations only -- no verdict
    on H-MONO-663fb4.
  uncertainty_reduced: >-
    Whether the real x-coordinate factor base's character bias (Var_R
    N_m(R) and C/F at m=4) is statistically distinguishable from a matched
    random symmetric subset, under an instrument whose own false-positive
    rate is measured and gated rather than assumed -- the exact question
    EXP-MONO-c819ba's fixed-band design was shown, by independent review,
    to be uncalibrated for (EV-MONO-b84b24, KN-TECH-7745e6).
  inputs:
    - >-
      experiments/EXP-MONO-670aa6/specification.yaml (READ IN FULL — it is
      extremely detailed and self-sufficient; follow it literally,
      especially the Stage-2 null-object gate's HARD STOP condition)
    - ledger/hypotheses/H-MONO-663fb4.yaml
    - ledger/evidence/EV-MONO-b84b24.yaml
    - ledger/decisions/DEC-20260830-891d39.yaml
    - knowledge/techniques/KN-TECH-7745e6.md
    - experiments/EXP-MONO-c819ba/execution_report.yaml (for the legacy panel's construction pattern only)
    - AGENTS.md
  constraints:
    - >-
      Follow experiments/EXP-MONO-670aa6/specification.yaml EXACTLY; it is
      frozen. Every construction procedure (prime, curve, factor base,
      seed derivation with curve_ordinal) is specified as an exact,
      reproducible algorithm — implement it literally.
    - >-
      STAGE 2, THE NULL-OBJECT GATE, IS A HARD STOP, NOT A WARNING. If the
      null-object arm shows ANY Holm/Bonferroni-corrected significant
      curve in either family (j0 or random-ordinary) at alpha=0.05, STOP:
      report `instrument_still_uncalibrated`, do not compute, read, or
      report ANY Stage-3 real-arm number. This is the single most
      important control in this contract — it is what EXP-MONO-c819ba's
      own null arm silently violated (OBJ-6), uncaught.
    - >-
      THE FOUR HOLM/BONFERRONI FAMILIES ARE FIXED BEFORE ANY P-VALUE IS
      COMPUTED: (i) j0 null-object, (ii) random-ordinary null-object, (iii)
      j0 real-arm, (iv) random-ordinary real-arm. Never pool, split, or
      redefine a family after seeing results.
    - >-
      PRIMARY PANEL CONSTRUCTION FAILURES ARE REPORTED, NEVER BACKFILLED.
      If fewer than 40 curves per family are realized after construction
      failures, report the exact realized count and proceed only if
      the contract's success_criterion's 40-per-family floor is met;
      otherwise this is `failed_infrastructure`, not evidence.
    - >-
      REPORT BOTH ORDERED AND MULTISET CONVENTIONS at every cell that
      reports a convention-dependent statistic (dual_convention_control).
    - >-
      NEVER REPORT A RAW STATISTIC WITHOUT ITS MATCHED-NULL P-VALUE OR
      RATIO — the explicit invalidation rule this design exists to enforce.
    - >-
      m=1 remains calibration-only, excluded from every corrected family;
      its passing is never reported as a null result.
    - >-
      TARGETS ARE EXHAUSTIVE (all R in E(F_p)), never sampled.
    - >-
      No hypothesis, experiment, or goal status change. No ECDLP attack,
      cost, exponent, or cryptographic-scale claim. No re-litigation of
      EXP-MONO-c819ba's own already-decided disposition.
    - >-
      Any timeout, crash, construction failure, or dual-path disagreement
      is `failed_infrastructure`/`invalid`, never negative mathematical
      evidence (AGENTS.md rule 3).
    - "Exactly 2 runs, seeds 20260901 and 20260902 per the contract's own `replication`."
    - >-
      If total wall-clock time trends toward the 7200s budget before both
      families' primary panels complete, STOP and report the exact
      progress and cause as an infrastructure/budget signal — do not
      silently reduce the declared panel size to fit.
  deliverables:
    - experiments/EXP-MONO-670aa6/implementation.md
    - experiments/EXP-MONO-670aa6/implementation/ (source code)
    - experiments/EXP-MONO-670aa6/runs/RUN-MONO-670aa6-1/
    - experiments/EXP-MONO-670aa6/runs/RUN-MONO-670aa6-2/
    - execution_report.yaml (per docs/evidence-and-reproducibility.md)
  artifact_paths:
    - experiments/EXP-MONO-670aa6/implementation.md
    - experiments/EXP-MONO-670aa6/implementation/
    - experiments/EXP-MONO-670aa6/runs/RUN-MONO-670aa6-1/
    - experiments/EXP-MONO-670aa6/runs/RUN-MONO-670aa6-2/
  archived_by: TASK-20260830-f1af50
  inference:
    policy: executor-implementation
    reasoning_effort: medium
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
    reasoning_effort_basis: >-
      Bound by .claude/agents/executor.md effort medium and
      orchestration/roles.yaml role executor -> default_policy
      executor-implementation -> reasoning_effort medium.
  budget:
    wall_clock_seconds: 7200
    memory_gb: 2
    maximum_runs: 2
  completion_gate:
    - "Stage 0's fixture reproduction reported before any Stage 1-4 work."
    - "Realized primary-panel sizes per family reported before Stage 2."
    - "Stage 2's null-object gate outcome (pass/fail, both families, both seeds) reported explicitly BEFORE any Stage-3 output."
    - "If Stage 2 fails in either family: run halted at that point, no Stage-3 output present, `instrument_still_uncalibrated` reported."
    - "If Stage 2 passes in both families on both seeds: P1-P5 reported with exact corrected p-value tables, both conventions, both runs."
    - "Legacy-panel L1-L4 and graded controls reported."
    - >-
      Run manifests bind git commit, dirty flag, seeds, environment,
      field_bits, timing, resources, per docs/evidence-and-reproducibility.md,
      using the NESTED manifest schema.
  return_format: >-
    Executor execution_report.yaml per docs/evidence-and-reproducibility.md:
    Stage-by-stage results in the contract's own order, the Stage-2 gate
    outcome as the headline result, P1-P5 tables (or their absence, if
    gated), legacy-panel results, any anomalies. Observations only — no
    verdict on H-MONO-663fb4, no status change.
