handoff:
  id: TASK-20260823-6040d1
  from: coordinator
  to: validator
  objective: 'Verify the two producers'' artifacts from committed state. Joint 1: does the recommended
    base family actually have the generic rank claimed, over the field claimed, and is its Shioda-Tate
    ceiling stated correctly for its degree d? Joint 2: does the pipeline''s reproduction check against
    known ICARM curves actually agree with the board, and does its exact-descent certification hold when
    you re-run it yourself?'
  uncertainty_reduced: Whether the batch's artifacts survive independent scrutiny.
  inputs:
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-f2341e/dispatch_queue.json
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-f2341e/tasks/TASK-20260823-d1cb76
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-f2341e/tasks/TASK-20260823-01d3d9
  - coordination/goals/GOAL-ECQ-002/baseline/frontier_20260823.json
  - ledger/hypotheses/H-ECQ-d60d07.yaml
  constraints:
  - Read ONLY committed state at the snapshot sha. An uncommitted artifact is not evidence.
  - You are BLIND to the other reviewer's findings. Do not read their working files.
  - A published rank the producer CITED is not evidence it re-derived. Check which is which, and say so.
  - Rank over Q(t) vs over Q-bar(t) is the single easiest place for a silent +1. Check it explicitly.
  - A claimed rank must be backed by that many exhibited points verified in exact arithmetic. Re-verify
    independently.
  - Never change hypothesis or goal status. Report only.
  - Re-derive at least one family's generic rank yourself rather than accepting the producer's word.
  deliverables:
  - validation_report.md with per-joint findings
  - 'verdict.yaml with verdict: passed|failed and the reasons'
  artifact_paths:
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-f2341e/tasks/TASK-20260823-6040d1/validation_report.md
  - coordination/goals/GOAL-ECQ-002/batches/BATCH-f2341e/tasks/TASK-20260823-6040d1/verdict.yaml
  archived_by: TASK-20260823-d26c06
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 3600
    memory_gb: 3
    maximum_runs: 40
  completion_gate:
  - both joints addressed explicitly
  - at least one independent re-derivation performed
  - verified-vs-cited split checked for every family
  return_format: validator verdict record.
