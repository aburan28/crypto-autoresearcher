    - Stage 1 hard gate passes exactly in both runs before Stage 3/4a are interpreted.
    - Stage 3 exact-match rate and complete-splitting rate (both multiplicity-aware and distinct) reported for every (m,p) cell in both runs.
    - Stage 4a mutant agreement rate reported, drawn from an independently-sampled comparison set.
    - Operation-count reconciliation for the twist route reported beside (never folded into) H-MONO-40aca5's own j=0 count.
    - All required_artifacts present and internally consistent (raw data agrees with execution_report.yaml's summary tables).
  return_format: >-
