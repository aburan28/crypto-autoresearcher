  objective: >-
    Compute every quantity that the quantities block of this card defines,
    from its definitions and the parameters the named tool prints, and report
    every output it asks for. You are told what to compute and not how, and
    you read no other artifact of this program.
  uncertainty_reduced: >-
    Whether a table of binary-field elliptic-curve parameters, subfield
    memberships, Frobenius orbit lengths, a span-dimension invariant, a trace
    bit, a rho reference line and four stated reference lines is determined
    by the stated definitions. A second implementation, written by someone
    who shares nothing with you, will be compared with yours afterwards.
    Disagreement localises to a model choice or to one of two named
    implementations.
  inputs:
