    - templates/research-records.md
  read_scope_note: >-
    A whitelist of four repository files. Every other repository path is out
    of scope, and every path in the plan's blind_rederivation.blind_from is
    forbidden by name, which you cannot see and need not: read nothing else.
    No git history of any kind, and no pull-request text. No external
    document is retrieved; the only external program you run for inputs is
    openssl ecparam as stated below. (Excluded reads of this batch, carried
    for the record and all outside your whitelist:
    experiments/EXP-QSP-70b731/runs/; experiments/EXP-FROB-30006a/; the ref
    origin/cursor/semaev-2015-audit-program-5b8b; PR #1377; the branch
    cursor/ecdlp2m-revision-design-3d1a.)
  quantities:
    what_you_are_testing: >-
      Whether parameters, subfield memberships, orbit lengths, a
      span-dimension invariant, a trace bit, a rho reference line and four
      reference lines are determined by the stated definitions. A second
      implementation will be compared with yours.
    labels_note: Row names are the names the tool uses. Quantity labels (Q0 to Q4, R-1 to R-4) are this card's own.
    parameters:
      parameter_tool: >-
        For each row name below, run exactly
        openssl ecparam -name <row> -param_enc explicit -text -noout
        and record the output verbatim and the output of openssl version. If
        the tool does not know a row, record that as an impediment for that
        row and compute nothing for it; never substitute parameters from
        memory or from any other source.
      rows_composite: [c2pnb176v1, c2pnb208w1, c2pnb272w1, c2pnb304w1, c2pnb368w1]
      rows_prime_degree_control: [c2tnb191v1, c2tnb239v1]
      field_and_encoding: >-
        The field is F_2[t]/(f), where f is the printed Polynomial. N is the
        degree of f. A field element is a non-negative integer read as a bit
        pattern in the polynomial basis: bit j is the coefficient of t^j. A
        and B are the printed coefficients (colon-separated hex, or a bare
        decimal when small).
      curve: y^2 + x y = x^3 + A x^2 + B over F_(2^N).
      order_and_cofactor: l is the printed Order and h the printed Cofactor.
      frobenius: >-
        For a positive divisor c of N, sigma_c is the map x -> x^(2^c) on
        F_(2^N), and n = N / c.
      span_invariant_definition: >-
        Definition, quoted from a published source with notation adapted:
        "Let the magic number for E relative to n be m = m(b) =
        dim_{F_2}(Span_{F_2}{(1, b_0^{1/2}), (1, b_1^{1/2}), ...,
        (1, b_{n-1}^{1/2})})", where b = B and b_i = sigma_c^i(b). The pairs
        live in F_2 x F_(2^N), and the span is taken over F_2.
      condition_definition: >-
        Definition, quoted from the same source: "Assume that n is odd, or
        m(b) = n, or Tr_{K/F_2}(a) = 0", where K = F_(2^N) and a = A. Report
        whether this holds, as a boolean.
    Q0:
      what: >-
        Every choice the definitions above left open to you (bit order,
        square-root computation, primality test, rounding), each with the
        choice you made. An empty list stated as such.
    Q1:
      what: >-
        For every row: N; f as a list of exponents; A and B in hex; l in hex,
        its bit length, and the name and outcome of the primality test you
        applied; h; d_min, the least positive divisor d of N such that
        A^(2^d) = A and B^(2^d) = B in F_(2^N); and, separately, the least
        positive divisor of N whose subfield contains B alone. For every row
        with d_min < N, also: q0 = 2^(d_min), t = q0 + 1 - h, k = N / d_min,
        the sequence s_0 = 2, s_1 = t, s_(i+1) = t s_i - q0 s_(i-1) up to s_k,
        and the boolean (2^N + 1 - s_k = h * l).
    Q2:
      what: >-
        For every row and every positive divisor c of N with c < N: n = N / c;
        the orbit length, the least i >= 1 with sigma_c^i(A) = A and
        sigma_c^i(B) = B; m by the span_invariant_definition; when n is a
        power of 2, also the least j >= 1 with (sigma_c + 1)^j applied to B
        equal to 0 (written m_level), and when n is not a power of 2,
        m_level = not defined; Tr_{K/F_2}(A), the sum of A^(2^i) for i = 0 to
        N - 1, as 0 or 1; the condition_definition boolean; and the two
        integers 2^(m-1) and 2^(m-1) - 1.
    Q3:
      what: >-
        For every composite row: log2 of sqrt(pi * l / (4 * k)), with k from
        Q1, to four decimals, computed with l as the exact printed integer.
    Q4:
      what: >-
        For every composite row and every divisor c with n = N / c in 2, 4 or
        8, with g = 2^(m-1) from Q2: R-1 = (2 - 2/g) * c; R-2 = (1 - 1/g) * c;
        R-3 = log2(g) + 2 * (1 - 1/g) * c; R-4 = g / c. Report each to four
        decimals.
    output_form: >-
      One table per quantity in rederivation-report.yaml, one row per (row
      name) for Q1 and Q3, one row per (row name, c) for Q2 and Q4. Every
      value as computed; never rounded except where stated.
