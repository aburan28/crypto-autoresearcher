handoff:
  id: TASK-20260721-001
  from: coordinator
  to: idea-generator
  objective: >-
    Produce at most three operation-level novel prime-field ECDLP mechanisms with a
    credible fully charged route below a matched rho/BSGS baseline, or return a
    hash-bound no-candidate frontier that identifies the narrowest unresolved mechanism.
  uncertainty_reduced: >-
    Whether the current corpus leaves a checkable generic-model escape,
    endomorphism/representation lever, relation/descent mechanism, structured-curve
    attack, or multi-target/precomputation tradeoff worth a frozen experiment.
  inputs:
    - AGENTS.md
    - agents/idea-generator.md
    - ledger/
    - experiments/
    - knowledge/
    - ideas/
    - focus/
    - coordination/dispatch_queue.json
  constraints:
    - Read all existing ideas, rejected/preallocation records, knowledge entries, prior evidence, current experiments, and recent DEDUP/REDTEAM reviews before proposing a candidate.
    - Compare by mathematical object, operation, information flow, output semantics, and fully represented cost; renaming or importing a backend after a missing source oracle is a duplicate.
    - Preserve all pre-existing dirty ideas/ paths exactly and write only beneath the assigned task directory.
    - Use lawful defensive cryptanalysis, public constructions, toy fixtures, and symbolic analysis only; do not target live keys or systems.
    - Require complete preprocessing, relation collection, linear algebra, target descent, verification, memory, parallelism, and multi-target accounting against rho and BSGS.
    - Separate a local identity, representation, relation supply, source replay, and end-to-end attack claim.
    - A literature citation or proposed theorem is not evidence; label unverifiable or missing material explicitly.
    - Do not allocate a canonical IDEA, hypothesis, experiment, decision, or breakthrough claim.
    - Record requested_policy, resolved_model_id, reasoning_effort, fallback_used, adapter_version, and the exact corpus boundary inspected.
  deliverables:
    - mechanism_frontier.yaml
    - novelty_matrix.md
  artifact_paths:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-001/tasks/TASK-20260721-001/mechanism_frontier.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-001/tasks/TASK-20260721-001/novelty_matrix.md
  archived_by: TASK-20260721-003
  inference:
    policy: research-sol-max
    fallback_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 3600
    memory_gb: 6
    maximum_runs: 1
  completion_gate:
    - Both deliverables exist at the exact declared paths and bind the inspected corpus by commit plus explicit dirty-tree boundary.
    - Every surviving candidate states mechanism, assumptions, predictions, cheapest decisive test, falsification criteria, confounders, complete attack path, and rho/BSGS comparison.
    - The novelty matrix names nearest semantic predecessors and explains the exact non-duplicate operation and information source.
    - If no candidate survives, the report preserves a precise frontier and exactly one next theorem or experiment target without treating absence as negative ECDLP evidence.
  return_format: >-
    YAML terminal verdict CANDIDATE | FRONTIER_ONLY | INVALID plus a Markdown
    operation-level novelty and full-cost matrix.
