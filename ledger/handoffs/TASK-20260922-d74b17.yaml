handoff:
  id: TASK-20260922-d74b17
  from: coordinator
  to: executor
  objective: >-
    Execute the frozen protocol in
    experiments/EXP-DREG-d76c97/specification.yaml. Emit exactly one
    outcome_label and the degree table. Do not interpret the label as an
    ECDLP result and do not start IDEA-20260922-805a59,
    IDEA-20260922-f7de2a, or IDEA-20260922-fac3e7.
  uncertainty_reduced: >-
    Whether the first accepted odd-prime ell-isogeny has label M, with the
    rebuilt new_falls support equal to the domain and the cleared pullback
    scaled by ell.
  inputs:
    - experiments/EXP-DREG-d76c97/specification.yaml
    - ledger/hypotheses/H-DREG-45c58f.yaml
    - ledger/decisions/DEC-20260922-aaf736.yaml
    - ledger/proposals/IDEA-20260922-221a70.yaml
    - ledger/questions/RQ-DREG-c8ae8d.yaml
  constraints:
    - Do not edit the specification. A protocol change is an amendment.
    - Do not rerun the prime-field m=3 neighbor screen as the result.
    - Do not call an unfinished matrix an exploded degree.
    - Do not edit GOAL-DREG-001. RQ-DREG-c8ae8d has no goal head.
    - Write only under experiments/EXP-DREG-d76c97/runs/.
    - Mint the run id with tools/allocate_id.py --next run --area DREG and --check it.
    - Do not search past p = 211. Do not replace the first accepted edge.
  deliverables:
    - experiments/EXP-DREG-d76c97/runs/<RUN-ID>/metrics.json
    - experiments/EXP-DREG-d76c97/runs/<RUN-ID>/report.md
    - experiments/EXP-DREG-d76c97/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-DREG-d76c97/runs/<RUN-ID>/certificates.json
  artifact_paths:
    - experiments/EXP-DREG-d76c97/runs/
  write_scope:
    - experiments/EXP-DREG-d76c97/runs/
  archived_by: TASK-20260922-cf67f3
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: null
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
    - metrics.json contains exactly one outcome_label from M, C, N, U
    - the degree table is present whenever an edge was accepted
    - certificates.json records the homomorphism checks or the failed certificate
    - no claim of an ECDLP exponent appears in report.md
  dispatch_preconditions:
    - >-
      TASK-20260922-cf67f3 has committed this handoff, the hypothesis, the
      specification, and DEC-20260922-aaf736, and the receipt has verified
      that commit. Launch against uncommitted specifications is forbidden.
    - >-
      RQ-DREG-c8ae8d has no goal head, so no goal-lane claim is required.
      Do not open a lane on GOAL-DREG-001.
  return_format: >-
    The outcome_label, whether every cleared degree ratio equals ell, whether
    the gauge vector matches E, and the paths of the four artifacts.
