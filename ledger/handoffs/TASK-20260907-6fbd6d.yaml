handoff:
  id: TASK-20260907-6fbd6d
  from: coordinator
  to: validator
  goal_id: GOAL-SATIC-c49b77
  batch_id: BATCH-127c82
  role: validator
  objective: >-
    Independently attack the four joints of TASK-20260907-39511d's known-bad control:
    that no repository byte was mutated; that instrument B was pre-registered and
    carries no trial-specific logic; that the frozen predicate was applied literally to
    every cell; and that no sentence in the report transfers the result beyond the one
    receipt, the two instruments under test, the two mutation classes and the four
    planted values.
  uncertainty_reduced: >-
    Whether the recorded sensitivity result is a property of the verification procedures
    or an artifact of the agent that both planted the mutations and wrote one of the
    instruments that detects them.
  inputs:
    - coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-127c82/contracts/known-bad-control.json
    - coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-127c82/tasks/TASK-20260907-39511d/start.json
    - coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-127c82/tasks/TASK-20260907-39511d/procedure.py
    - coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-127c82/tasks/TASK-20260907-39511d/procedure_null.py
    - coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-127c82/tasks/TASK-20260907-39511d/procedure_promiscuous.py
    - coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-127c82/tasks/TASK-20260907-39511d/trials.json
    - coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-127c82/tasks/TASK-20260907-39511d/commands.md
    - coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-127c82/tasks/TASK-20260907-39511d/report.json
    - coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-127c82/archives/TASK-20260907-e7cc96/snapshot.md
    - coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-2cca27/contracts/integrity-review.json
    - tools/research_dispatch.py
  constraints:
    - >-
      A FRESH INDEPENDENT SESSION at review-adversarial with xhigh effort, run by an
      agent that produced none of the artifacts under review. No fallback, no
      degradation.
    - >-
      IF THIS SESSION CANNOT HONOUR review-adversarial AT xhigh, REFUSE -- and still
      write BOTH declared artifacts, the report with verdict `refused`, recording the
      requested policy, the resolved model as exposed, and model_verified as observed.
      Do not degrade to get a verdict moving. GOAL-SATIC-c49b77 already carries a
      standing impediment recording that this policy has been unservable through the
      adapter, and CLAUDE.md rule 10 is explicit that what such an impediment blocks is
      the CLAIM, not the campaign. A durable refusal at the declared paths is a correct
      and useful outcome; TASK-20260905-5681fc's refusal under BATCH-2cca27 remains
      durable precisely because it wrote both files.
    - >-
      Write startup_receipt.json BEFORE opening any object under review, recording the
      start time, the runtime, the resolved model identity as exposed, the task id, and
      the list of what you read before writing it.
    - >-
      Read no coordinator disposition draft and no sibling review report. There is no
      sibling review in this round; TASK-20260907-c3d2d8's disposition worksheet runs
      AFTER you and is not an input.
    - >-
      Report on YOUR OWN JOINTS. Do not return a whole-claim verdict: the Coordinator
      composes. State your verdict per joint as holds | breaks | inconclusive.
    - >-
      Any scratch space you use is outside the repository. Your write_scope is your own
      two artifact paths and nothing else. Never commit.
    - >-
      Read-only with respect to every object under review and every committed record. No
      solver, no benchmark, no network, no installation, no Bedrock. maximum_runs is 0.
    - >-
      Change no status and promote nothing. Your report is an input to a Coordinator
      decision, not a decision.
  deliverables:
    - startup_receipt.json at the declared path, written before any object under review is opened
    - report.json with a per-joint verdict, the blind re-derivation result, the proves-too-much outcomes, and a review_attestation
  artifact_paths:
    - coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-127c82/tasks/TASK-20260907-6fbd6d/startup_receipt.json
    - coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-127c82/tasks/TASK-20260907-6fbd6d/report.json
  write_scope:
    - coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-127c82/tasks/TASK-20260907-6fbd6d/
  archived_by: TASK-20260907-9b71ea
  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 5400
    memory_gb: 4
    maximum_runs: 0
  completion_gate:
    - startup_receipt.json exists at the declared path and enumerates what was read before it was written
    - a verdict for each of J1, J2, J3 and J4, each with the artifact or computation it rests on
    - the blind re-derivation is recorded, with an explicit statement of which producer artifacts were NOT read
    - both proves-too-much objects are executed and their outcomes recorded
    - a review_attestation naming joints owned, sources actually read, read_sibling_reports false, and blind_from_respected
    - requested policy and resolved model recorded beside each other, with model_verified stated honestly
    - no status change, no promotion, no repository byte modified
  return_format: >-
    Per joint: verdict, the attack actually run, and the artifact it rests on. Then the
    blind re-derivation values and whether they agree with the producer's observed
    column. Then the two proves-too-much outcomes. Then what you deliberately did not do.

  review_plan:
    round_id: RR-BATCH-127c82-1
    written_at: '2026-09-07'
    written_by: coordinator-satic-c49b77-276e
    written_before_any_reviewer_ran: true
    is_claim_changing: >-
      It changes no SCIENTIFIC claim -- nothing here bears on SATIC, summation
      polynomials or the ECDLP, and no hypothesis status can move. It is nonetheless run
      under a full review plan because it can support a claim about the program's own
      archive-verification gate and can bear on the first of IMP-3's two recheck
      conditions, and because a control whose own execution is unreviewed is the failure
      mode this batch exists to expose.

    claim_under_review: >-
      As TASK-20260907-39511d will state it in report.json, and identified by the frozen
      predicate rather than by a value because this plan is written before the producer
      runs: for each of the four instruments, whether the negative arm was clean, and
      whether each of the four planted mutations was detected at its expected locus with
      the flag carrying the planted declared value and the true observed value; together
      with the claim that no repository byte was mutated and that exactly one field
      differed per trial.

    coordinator_prior: >-
      RECORDED BEFORE ANY REPORT RETURNS, and unrecoverable afterwards. (1) INSTRUMENT A,
      tools/research_dispatch.py. I expect `partially_sensitive`, and I expect the
      shortfall to be about my predicate rather than about the gate. Reading the source,
      the digest comparison at the `observed != archive["path_sha256"][path]` branch
      raises naming BOTH values, so I expect T2 and T3 to DETECT. The parent branch
      raises "parent_sha must match first parent {parents[0]}", which names the ACTUAL
      first parent and I am not sure it echoes the DECLARED value; if it does not, my
      predicate's `f.declared_value = planted(t)` conjunct is unmet and detect(A,T4) is
      FALSE even though the defect is plainly surfaced. For T5 I expect the unresolvable
      sha to fail inside commit resolution BEFORE any comparison, so detect(A,T5) FALSE
      with the defect surfaced through the exception channel. I PRE-COMMIT to the
      consequence: if that is what returns, the honest reading is that the gate catches
      both mutation classes but does not always echo the declared value, so the strict
      predicate under-credits it -- and I will NOT relax the predicate to reach
      `sensitive`. That would require a versioned protocol_amendment, and re-scoring a
      cell after seeing it is exactly the move the frozen predicate exists to prevent.
      (2) INSTRUMENT A's NEGATIVE ARM is my largest genuine uncertainty, at roughly 60%
      clean. I deliberately did NOT run it while authoring, because running the negative
      arm myself would have partially executed the control outside the frozen protocol.
      BATCH-1a527c's authority_queue.json is a legacy queue and the dispatcher may refuse
      it for reasons unrelated to the archive check -- unassigned non-archive tasks,
      path resolution, or schema drift. If it does, A is `infrastructure_stop`, that is
      an infrastructure outcome under core rule 5 and NOT a sensitivity result, and the
      finding that the program's own gate cannot be pointed at a receipt copy would
      itself be worth more than the sensitivity number I was after. (3) INSTRUMENT B: I
      expect `sensitive` on all four, and I expect that to be WEAK EVIDENCE by
      construction, because the agent that plants the mutations also writes B. That is
      why J2 exists and why B's pre-registration is checkable rather than promised.
      (4) INSTRUMENT C null: `insensitive`. INSTRUMENT D promiscuous: `invalid`. If
      either differs, the batch's result is invalid and my whole prior is worthless.
      (5) The no-mutation proof: I expect it to hold. My specific worry is not a mutated
      receipt but a trial copy written under the batch directory -- which IS inside the
      producer's write_scope and would therefore be permitted, while still putting a
      corrupted receipt copy inside the checkout. J1 attacks that.
      (6) WHAT WOULD MOST INFORM ME: A missing T3, the self-referential entry. That would
      be a real blind spot in the program's actual archive gate at exactly the entry
      whose binding cannot be written inside its own commit -- the case this very lane
      has to work around with a backfill commit. I do not expect it, and I would rather
      learn it here than from a receipt that mattered.

    joints:
      - joint: >-
          J1 -- NO-MUTATION CUSTODY. That no committed byte of any receipt, queue,
          archive or ledger record changed, and that no corrupted copy was written
          anywhere inside the checkout.
        assigned_to: TASK-20260907-6fbd6d
        attack_plan: >-
          Recompute the working-tree sha256 of both source paths and compare against the
          pre-trial values in start.json AND against the bytes at commit 4c72c94c7 and
          9a79547b. Run `git -C /workspace status --porcelain` over the whole tree, not
          just the two paths, and `git log` the two paths for any commit after the
          producer started. Then attack where I think it breaks: enumerate every file
          under coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-127c82/ and look for a
          trial copy, a pristine copy, a plan.json, or any file containing one of the four
          planted values -- the producer's write_scope PERMITS writes there, so a
          corrupted copy inside the checkout would be a scope-compliant violation of the
          contract's central prohibition, and a status check alone would not find it.
          Grep the committed tree for the four planted values.
        breaking_artifact: >-
          A repository path whose bytes differ from its pre-trial digest, or any file
          inside the checkout containing a planted value, or a scratch artifact found
          under /workspace.
      - joint: >-
          J2 -- INSTRUMENT B INDEPENDENCE AND PRE-REGISTRATION. That procedure.py was
          written before the first mutation was planted, and that it contains no logic
          keyed to a trial, a mutation class, or any of the eight declared values.
        assigned_to: TASK-20260907-6fbd6d
        attack_plan: >-
          Recompute procedure.py's sha256 and compare against the value recorded in
          start.json; establish from commands.md's captured ordering and returncodes that
          start.json was closed before the first mutation was written. Read procedure.py
          for any hard-coded path, digest, sha, trial id or mutation-class name, and for
          any branch that treats one field differently from the others. Then run the
          decisive attack: BUILD YOUR OWN MUTATED COPY from the contract's declared
          values, in your own scratch space outside the repository, and run procedure.py
          against it -- and separately build a mutation the contract does NOT declare (a
          different declared-hash entry of the same receipt) and check that procedure.py
          flags that one too. An instrument that detects only the four planted values has
          been shaped to them.
        breaking_artifact: >-
          A digest mismatch against start.json, an ordering that puts procedure.py after
          the first mutation, trial-specific logic in the source, or an undeclared
          mutation that procedure.py fails to flag while flagging the declared ones.
      - joint: >-
          J3 -- PREDICATE APPLICATION. That the four instrument verdicts follow from
          trials.json by the frozen formula, with all four conjuncts of detect() actually
          checked, and that every non-detecting cell carries its defect_surfaced_otherwise
          evidence.
        assigned_to: TASK-20260907-6fbd6d
        attack_plan: >-
          Recompute all four verdicts from trials.json by applying the contract's formula
          literally, WITHOUT reading report.json's own verdict fields first, and record
          your recomputation before you compare. Check each cell's `detect` against all
          four conjuncts individually -- step, locus, declared_value = planted,
          observed_value = true. Where I think it breaks: a cell scored `detect: true` on
          step and locus alone, with the declared-value conjunct unverified. That is the
          exact error that would convert a question about my predicate's strictness into a
          false claim of sensitivity, and it is the most likely single defect in this
          package. Also confirm no cell was re-run to obtain a different outcome, and that
          the predicate was not widened anywhere in report.json's prose.
        breaking_artifact: >-
          A recomputed verdict differing from the reported one, a `detect: true` cell
          failing any conjunct, a missing defect_surfaced_otherwise on a non-detecting
          cell, or predicate language in the report that does not match the frozen text.
      - joint: >-
          J4 -- SCOPE DISCIPLINE. That no sentence transfers the result beyond the one
          receipt, the two instruments under test, the two mutation classes, the four
          planted values and the named commits.
        assigned_to: TASK-20260907-6fbd6d
        attack_plan: >-
          Read report.json for any sentence generalising to "the archive verification
          procedure", to the other four archive_bindings in BATCH-2cca27's contract, to
          merge commits, to untested mutation classes (commit_sha, path SET, removed or
          added entries, record_ids), or to the unpreserved instrument the BATCH-008925
          review actually ran. Confirm it asserts nothing about SATIC, summation
          polynomials or the ECDLP; changes no status; does not claim BATCH-2cca27's other
          five checks were performed; and does not claim IMP-3 is cleared. Where I think
          it breaks: an unqualified summary sentence in a field a later reader quotes in
          isolation -- a headline that is true of four cells and reads as true of the
          gate.
        breaking_artifact: >-
          A quotable sentence whose scope exceeds the tested set, or a claim that any
          impediment or completion criterion is satisfied.

    blindness:
      mutual: true
      lifted_for: []
      rationale: >-
        There is ONE reviewer in this round, so mutual blindness between reviewers is
        vacuous and is stated as such rather than claimed as a property earned. What
        independence actually rests on here is named plainly: the reviewer produced none
        of the artifacts under review, runs in its own session, and may read no
        coordinator disposition draft -- TASK-20260907-c3d2d8 runs after it and is not an
        input. A single-reviewer round buys no cross-reviewer coverage, which is why all
        four joints carry worked attacks rather than a request to review the package.

    proves_too_much:
      note_the_irony_handled_explicitly: >-
        THIS BATCH IS ITSELF A PROVES-TOO-MUCH CONTROL, so the review needs a known-false
        object of its own, one level up. A null object tests whether a measurement is an
        artifact; a known-false object tests whether an argument is. Here the ARGUMENT is
        the predicate that turns twenty cells into four verdicts, and the question is
        whether that argument would also certify an instrument that cannot possibly be
        sensitive.
      objects:
        - >-
          KF-R1 -- YOUR OWN null instrument. Do not reuse the producer's
          procedure_null.py: write your own, in your own scratch space, that reads the
          receipt and unconditionally emits the empty flag set, and run the full five-trial
          protocol against it. The predicate MUST return `insensitive`.
        - >-
          KF-R2 -- a GIT-ONLY "detector", and this is the sharpest object available. Write
          an instrument that recomputes both sides from git and reports a flag at the
          correct step and locus with the correct observed value, but with a declared value
          it never read from the receipt. This is the "receipt as its own oracle" bug the
          whole control exists to find, and it is the object for which the conclusion
          "this instrument is sensitive to a planted receipt defect" is KNOWN FALSE -- it
          would report identically on a pristine receipt and on a corrupted one. The
          predicate MUST NOT credit it as detecting.
      failure_signature: >-
        For KF-R1: negative arm clean, all four detect() false, verdict `insensitive`. For
        KF-R2: a flag present at the expected step and locus on every sensitivity trial,
        and detect() FALSE on every one of them because the declared_value conjunct fails
        -- and, decisively, the SAME flag emitted on T1, so its negative arm is not clean
        and its verdict is `invalid`. If KF-R2 scores `sensitive` or
        `partially_sensitive`, the predicate has proved too much: it is crediting an
        instrument that never reads the receipt, the four conjuncts are not doing the work
        this contract claims, and THIS BATCH'S ENTIRE RESULT MUST BE READ AS INVALID
        rather than as a sensitivity finding.
      assigned_to: TASK-20260907-6fbd6d

    blind_rederivation:
      required: true
      quantity: >-
        The three TRUE values the mutations depart from, stated as quantities rather than
        as a method: the first parent commit of 9a79547b63efbd538197d4399619b4daedd755ac;
        the sha256 of the bytes of
        coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-1a527c/launch.md at that
        commit; and the sha256 of the bytes of
        coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-1a527c/archives/TASK-20260905-79a686/snapshot.md
        at that commit.
      why_it_is_load_bearing: >-
        If a declared from-value were wrong, the corresponding "mutation" would not be a
        mutation and its trial would be void -- a well-formed value replaced by another
        well-formed value, with the receipt no more wrong afterwards than before. The
        entire control rests on these three quantities being what the contract says they
        are.
      parameters: >-
        The commit 9a79547b63efbd538197d4399619b4daedd755ac and the two paths above.
        Nothing else is needed.
      blind_from:
        - coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-127c82/tasks/TASK-20260907-39511d/procedure.py
        - coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-127c82/tasks/TASK-20260907-39511d/trials.json
        - coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-127c82/tasks/TASK-20260907-39511d/commands.md
        - coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-127c82/tasks/TASK-20260907-39511d/report.json
      method_required: >-
        Compute the three quantities from git alone, record them, AND ONLY THEN read
        trials.json and compare against the producer's `observed` column. Recomputing
        from the producer's artifacts would reproduce a wrong-but-self-consistent
        implementation faithfully, which is the one failure mode validation cannot see.
      stated_bound_on_this_rederivation: >-
        It is blind from the PRODUCER's artifacts, not from the Coordinator's declaration:
        this contract states the expected true values, so the re-derivation localises a
        disagreement to the producer's implementation and cannot independently discover an
        error in the contract's own declared values. Recorded as a limitation rather than
        left for a reader to notice. The Coordinator did verify two of the three itself
        while authoring, with the same instrument family under test -- which is why this
        arm exists at all and why its bound is stated.
      # This required field was OMITTED at freeze time and completed additively
      # after the opening snapshot archive. See CORR-20260907-9f5fa9 for the
      # defect, both digests, and why the id could not be superseded (AGENTS.md
      # rule 15: it is named in TASK-20260907-814b9f's completed binding fields).
      assigned_to: TASK-20260907-6fbd6d

    procedure_deviations: []
