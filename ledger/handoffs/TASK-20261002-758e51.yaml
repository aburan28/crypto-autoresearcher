# =============================================================================
# TASK-20261002-758e51 -- ZERO-RUN analysis of the archived PTM-5 exactly
# generic replica outputs, the cheapest first step (a) of the F7/D3 follow-up
# (DEC-20261001-494663 NA-3), designed and approved by DEC-20261002-bed082
# under the standing user authorization of 2026-09-06. Tests whether the
# exactly generic replica reproduces F7's r_rank ratio slope and the identity's
# decomposition, and calibrates per-rung aggregate T at m = 4, 5. NO solver or
# engine execution; reads archived rows only; writes only under its own task
# directory. The decision rule is fixed before data (DEC-20261002-bed082).
# =============================================================================
handoff:
  id: TASK-20261002-758e51
  from: coordinator
  to: executor
  objective: >-
    Compute, from the archived PTM-5 exactly generic replica outputs of the
    TW-FLOOR round, with ZERO solver or engine execution: (a) the r_rank ratio
    slope on the replica's m = 4 on-mode rows over 12..24 bits, under the
    round's conventions, with bootstrap intervals, and its comparison against
    the engine's F7 slope (r_rank -0.01491, calibrated [-0.0242, -0.0053];
    r_frozen -0.03384; level 2.10-3.63 under r_rank); (b) the per-rung
    aggregate T = sum w S_3^2 / sum w r N/4, w = 1/(N B), at m = 4 and m = 5
    on-mode, both r conventions, with 99% curve-bootstrap intervals calibrated
    per the round's MC-5 discipline (five instances per rung per replicate,
    the replica's 200-per-cell rows playing the curve role, at least 20000
    replicates, coverage reported); (c) the identity's decomposition on the
    same rows: slope(log2 ratio_rank) = slope(log2 ratio_frozen) + 0.5 *
    (slope(log2 r_frozen/B) - slope(log2 r_rank/B)) verified within fitting
    tolerance, with the multiplicity growth r_frozen/r_rank fitted and
    compared with the engine's recorded components (r_frozen/|F| +0.040822,
    r_rank/|F| -0.002959); and (d) the pre-registered reading under the
    decision rule of DEC-20261002-bed082, stated as the narrowest supported
    sentence per outcome.
  uncertainty_reduced: >-
    Whether F7's r_rank decline and the identity's decomposition reproduce
    on an exactly generic engine (the replica), i.e. whether the m = 4
    harvest-on approach to the floor is the generic floor-attainment path or
    an engine-specific trend -- the decision-changing quantity of
    DEC-20261001-494663 NA-3 at zero run cost.
  inputs:
    - coordination/review/pfdr-twfloor-20261001/reviews/TASK-20260929-575e80/attacks/out/ptm5_results.jsonl
    - coordination/review/pfdr-twfloor-20261001/reviews/TASK-20260929-575e80/attacks/out/07_ptm5_analysis.json
    - coordination/review/pfdr-twfloor-20261001/reviews/TASK-20260929-575e80/attacks/out/07b_ptm5_pooled.json
    - coordination/review/pfdr-twfloor-20261001/reviews/TASK-20260929-575e80/attacks/out/09b_ptm5_agg_by_rung.json
    - coordination/review/pfdr-twfloor-20261001/reviews/TASK-20260929-575e80/attacks/f3-lemma-map.yaml
    - coordination/review/pfdr-twfloor-20261001/reviews/TASK-20260929-575e80/attacks/07_ptm5_analysis.py
    - coordination/review/pfdr-twfloor-20261001/reviews/TASK-20260929-fd1a9f/calibration/out/f7.stdout
    - coordination/review/pfdr-twfloor-20261001/reviews/TASK-20260929-fd1a9f/calibration/out/f7-supp.json
    - ledger/evidence/EV-PFDR-d90ccd.yaml
    - ledger/decisions/DEC-20261002-bed082.yaml
    - ledger/decisions/DEC-20261001-494663.yaml
    - experiments/EXP-PFDR-1b78f7/amendments/AMD-20261002-2bc8cf.yaml
    - AGENTS.md
    - agents/executor.md
  constraints:
    - >-
      ZERO SOLVER/ENGINE EXECUTION: do not import or execute anything under
      src/crypto_autoresearcher/index_calculus (or any engine code). The
      analysis reads the archived JSONL rows and computes slopes, aggregates,
      bootstrap intervals and identity checks on them. Monte Carlo bootstrap
      over the archived rows is allowed; it is not a solver run, creates NO
      RUN id, and writes nothing under experiments/.
    - Write ONLY under coordination/tasks/TASK-20261002-758e51/. Do not modify any existing record or file.
    - >-
      Conventions verbatim from the archive, never invented: the r, r_frozen
      and r_rank conventions from attacks/f3-lemma-map.yaml symbol_map; the
      replica's row fields and construction from attacks/07_ptm5_analysis.py;
      the F7 slope and interval method from the validator's
      calibration/out/f7.stdout and f7-supp.json. Where a convention is not
      recoverable from the archive, record it as a defect in the report with
      the exact ambiguity; do not guess. Record the field mapping you used
      (which replica field serves as S_3, r_frozen, r_rank, N, B) in the
      report, citing the archived artifact that licenses each mapping.
    - >-
      Aggregate reading rules follow AMD-20261002-2bc8cf C-1..C-4: weights
      w = 1/(N B) per instance; both r conventions reported; the premise
      state is recorded (the replica is exactly generic BY CONSTRUCTION --
      record that as the premise audit, no per-arm audit applies); no
      per-instance predicate is adopted; the per-rung T table reports
      intervals, and any rung whose 99% interval excludes 1 from below is
      FLAGGED for the Coordinator, never self-interpreted.
    - >-
      PRE-REGISTERED DECISION RULE (fixed before data,
      DEC-20261001-494663 NA-3 and DEC-20261002-bed082): (i) replica r_rank
      slope with its own interval INSIDE the engine's calibrated interval
      [-0.0242, -0.0053], or overlapping it with the engine's point inside
      the replica's interval -> reading "the decline reproduces on the
      exactly generic replica" (generic floor-attainment path); (ii) replica
      slope interval containing 0 while the engine's excludes it -> reading
      "the decline is not reproduced at the replica's scale; engine-specific
      or scale-dependent, unresolved at 12..24 bits"; (iii) replica slope
      steeper than the engine's beyond both intervals -> record both, state
      the narrowest sentence, no further interpretation. Per-rung T: any
      interval excluding 1 from below is TW-BREAK-shaped and routes to the
      Coordinator untouched. The identity: it is exact arithmetic per
      instance; a violation beyond fitting tolerance is a defect in THIS
      analysis -- locate it, rerun ONCE, record both attempts.
    - >-
      Determinism: fixed seeds declared in the code and the receipt; every
      command recorded; stdout and stderr retained; a timeout or crash is
      failed_infrastructure, never evidence.
    - Toy scale (the replica runs 12..24 bits); no deployed-curve claim, no
      universal impossibility, no exponent below rho (TW-SCOPE discipline).
    - >-
      No status change, no hypothesis record, no evidence record, no ledger
      write: observations only, under this task directory.
