handoff:
  id: TASK-20260801-811
  from: coordinator
  to: coordinator
  objective: >-
    Commit the independent TASK-20260801-809 validation package and the
    TASK-20260801-810 red-team package together with the scoped evidence record
    EV-AES-004 and the batch decision DEC-20260731-029, then perform the official
    BATCH-004 state transition.
  uncertainty_reduced: >-
    Whether BATCH-004's producer outputs — an attempted lower bound on the
    branching factor B, or an argued statement that none follows, together with
    the OD-3 screen and the hole (ii) quantifier computation — move the campaign's
    only exponent-relevant lane, and what the campaign's single next action
    therefore is with two batches remaining; recorded durably rather than left in
    a working tree.
  inputs:
    - The three TASK-20260801-809 validation artifacts
    - The two TASK-20260801-810 red-team artifacts
    - The verified TASK-20260801-808 producer snapshot and its eight artifacts
    - >-
      DEC-20260731-028, DEC-20260731-026, EV-AES-003, KN-FIND-028, KN-FIND-029,
      GOAL-AES-001, RQ-AES-001
    - >-
      protocol-amendment-GOAL-AES-001-004, in force since the BATCH-004
      coordination commit
  constraints:
    - >-
      Run alone. Stage only the declared review and ledger paths. No other task
      may hold the Git index or HEAD concurrently.
    - >-
      Only the Coordinator may write official records.
    - >-
      THE ISOLATED PREDECESSOR COMMIT IS PLANNED, NOT DISCOVERED. The five
      TASK-20260801-809 and TASK-20260801-810 review artifacts are NOT in this
      ledger commit's declared path set, and neither is any knowledge entry.
      Commit them in an ISOLATED PREDECESSOR COMMIT immediately before the ledger
      commit — together with KN-FIND-019 and the regenerated knowledge/INDEX.md
      IF AND ONLY IF a promotion is warranted — and record that predecessor SHA
      as this commit's parent in the receipt, because the ledger commit must
      change EXACTLY its two declared artifact paths. This is the pattern
      BATCH-001, BATCH-002 and BATCH-003 all used; BATCH-003 recorded it late as
      defect D-805-2 and it is anticipated here instead.
    - >-
      SCOPE THE CONCLUSION TO WHAT WAS TESTED: the exact object class
      (bounded-branching per-word projections with the stated relation form), the
      interfaces actually counted, the field actually worked in, the structured
      subsets actually enumerated, the analogue actually used, and the budget
      actually spent. claim_tier: toy. A derivation is a DERIVATION FACT and an
      exhaustive toy enumeration is a COMPUTATION FACT; neither is empirical
      cryptanalytic evidence about AES and neither supports any claim about AES
      at any round count.
    - >-
      THE PROMOTION GATES ARE THE CENTRAL CONSTRAINT OF THIS ARCHIVE IF A COST
      STATEMENT EXISTS. An asymptotic-complexity claim may not transition toward
      `supported` unless ALL FOUR gates are satisfied by COMMITTED artifacts:
      (1) archived proof decomposition into single-responsibility lemmas with the
      main theorem assembling them under explicit per-attempt-cost x
      inverse-success-probability bookkeeping; (2) every conditional dependence
      stated as an explicit numbered heuristic, each with archived validation
      evidence or a SCHEDULED validation experiment — and if the experiment is
      only scheduled, DEC-20260731-029's next action must actually schedule it in
      BATCH-005, not merely mention it; (3) a concrete-cost table at standardized
      parameter sets with honest hidden-overhead, memory, time-memory-tradeoff
      and parallelization accounting, optimistic assumptions flagged, and an
      explicit affected-vs-safe scope statement; (4) independent review per
      AGENTS.md rule 12 PLUS a red-team pass on the cost model and heuristics. A
      CLAIM MISSING ANY GATE MAY REACH `analyzed`, NEVER `supported`. IF A GATE
      IS MISSING, NAME THE MISSING GATE IN THE DECISION AND IN EV-AES-004 RATHER
      THAN PROMOTING. Record the per-gate status explicitly even if the gates are
      not engaged, so a later batch cannot quietly bypass them.
    - >-
      THE ADVERSE-TRANSITION GATE. No `weaken` or `reject_scoped` may be taken
      without the strongest checkable refutation artifact the result admits —
      counterexample certificate, then derivation note, then declared
      `empirical_only` — ARCHIVED BEFORE the decision that relies on it, which
      for this batch means committed in the TASK-20260801-808 snapshot or in the
      isolated predecessor commit. `reject_scoped` on a single unreplicated
      empirical-only run is FORBIDDEN. In particular NO reject_scoped of the
      round-independent single-word deterministic class may be taken: V-804-1
      stands, no control yet ISOLATES the ingredient such a closure would negate,
      and DEC-20260731-026 withheld it for the second consecutive batch.
    - >-
      KNOWLEDGE PROMOTION IS CONDITIONAL AND MUST NOT BE MANUFACTURED. Fill
      knowledge_promotion in DEC-20260731-029 either with the promoted KN-* ID or
      with a concrete not_warranted reason. Promote a KN-FIND only on `support`
      or `reject_scoped` at replicated/strong evidence, proven boundaries
      counting. If a promotion IS warranted, KN-FIND-019 is the reserved ID:
      write it and the regenerated knowledge/INDEX.md in the isolated predecessor
      commit, and confirm `python3 tools/build_knowledge_index.py --check` exits
      zero against the committed index — do not commit a hand-edited index. If no
      promotion is warranted, KN-FIND-019 stays unallocated and the reservation
      is simply not used.
    - >-
      TWO REVIEW SESSIONS ARE NOT MODEL INDEPENDENCE. TASK-20260801-809 and
      TASK-20260801-810 resolve to the same model as each other, as both
      producers and as this Coordinator under inference-amendment 0137a051. Their
      agreement is CORRELATED and must be recorded as such; do not present a
      validator and a red team concurring as independent confirmation.
    - >-
      DEC-20260731-029 records exactly ONE next action, fills
      knowledge_promotion, and records the status of the four
      asymptotic-complexity promotion gates rather than passing over them —
      naming them explicitly if they remain not engaged.
    - >-
      No literature comparison, recalled baseline, sota_delta, bit-margin or
      extrapolation may enter EV-AES-004 or DEC-20260731-029 in any form; any
      literature statement that does appear carries the unverified-from-memory
      qualifier.
    - >-
      BUDGET ACCOUNTING MUST BE RECORDED HONESTLY. Record in DEC-20260731-029 the
      DECLARED and the MEASURED consumption of this batch and the cumulative
      campaign totals on the measured basis, note that BATCH-004 declared 6350
      against 6849 remaining with 499 s of worst-case headroom, and state how
      many batches remain of the maximum 6. An unrecorded overrun is not a
      research result, and an unmeasured completed task is charged at its
      declared budget under the goal's unmeasured_work_rule.
    - >-
      Update the GOAL-AES-001 checkpoint after this ledger archive, preserving
      exactly ONE next action, in its own follow-on commit; confirm
      protocol-amendment-GOAL-AES-001-004 is registered in the goal's
      `amendments` list with its commit bound. A record cannot carry the SHA of
      the commit that contains it.
    - >-
      Do not write the commit's own SHA into an artifact inside that commit.
    - >-
      GOAL-AES-001 does NOT close on this batch: under inference-amendment
      0137a051 a three-distinct-model closure quorum is unobtainable in this
      harness, so `completed` is unreachable regardless of outcome, and both
      review sessions supply session and not model independence. Record NO
      attestation.
    - >-
      VERIFY THE RESERVED IDS FREE BEFORE WRITING. EV-AES-004 and
      DEC-20260731-029 are RESERVED, and DEC-20260731-029 was NOT independently
      verified free at queue-authoring time. Check both by directory listing.
      Correct any collision by a CORR record rather than by editing a committed
      record; CORR-20260731-006 is the next free correction ID and the
      CORR-20260731-008 remap is the precedent.
  deliverables:
    - EV-AES-004.yaml
    - DEC-20260731-029.yaml
  artifact_paths:
    - ledger/evidence/EV-AES-004.yaml
    - ledger/decisions/DEC-20260731-029.yaml
  archived_by: TASK-20260801-811
  inference:
    policy: coordinator-archive
    requested_policy: coordinator-archive
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
    standing_basis: >-
      inference-amendment commit 0137a051eb5828789eb267fa83c8278086578d4c.
      Cross-model independence is unavailable campaign-wide; nothing archived
      here may be treated as a closure attestation, and the agreement between the
      producers, the validator, the red team and this Coordinator is CORRELATED.
  budget:
    wall_clock_seconds: 800
    memory_gb: 1
    maximum_runs: 1
  budget_basis: >-
    Calibrated against the 409 s and 776 s measured ledger archives, at the top
    of that range because this archive must additionally make an isolated
    predecessor commit carrying five review artifacts and may carry a knowledge
    promotion with a regenerated index.
  completion_gate:
    - >-
      The evidence and decision records preserve the exact reviewed scope, object
      class, interfaces, field, subsets, analogue and claim tier, and no record
      asserts anything about full-round or deployed AES.
    - >-
      If a cost or asymptotic statement was advanced, the per-gate status of all
      four promotion gates is recorded against COMMITTED artifacts, any missing
      gate is NAMED, and no claim missing a gate is moved beyond `analyzed`; if
      none was advanced, the gates are recorded explicitly as not engaged with
      the reason.
    - >-
      Any adverse transition is licensed by a refutation artifact already
      committed in the TASK-20260801-808 snapshot or the isolated predecessor
      commit, with its basis declared; otherwise the closure remains withheld and
      the record says so plainly.
    - >-
      The isolated predecessor commit carrying the five review artifacts — and
      KN-FIND-019 with a regenerated INDEX.md if and only if promotion is
      warranted — is made immediately before the ledger commit, its SHA is
      recorded as this commit's parent in the receipt, and
      `build_knowledge_index.py --check` exits zero if an index was committed.
    - >-
      knowledge_promotion is filled with either a promoted KN-* ID or a concrete
      not_warranted reason.
    - >-
      Git verifies the commit is reachable from HEAD, has the expected parent,
      changes exactly the two declared paths, matches the recorded SHA-256
      hashes, and names the task and record IDs.
    - >-
      The decision records exactly one next action, the declared and measured
      budget consumption with batches remaining, the correlated-agreement
      statement about the two review sessions, and no attestation.
    - >-
      archive.record_ids lists EV-AES-004 and DEC-20260731-029, and each declared
      artifact filename contains one of those IDs.
  return_format: >-
    The two ledger records, plus a plain statement of: the predecessor commit
    SHA, the ledger commit SHA and its parent, the per-gate promotion status, the
    knowledge_promotion outcome, the measured budget consumption of every
    BATCH-004 task, and the single next action.
