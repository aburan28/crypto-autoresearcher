    - coordination/review/pfdr-011cd0-20261002/reviews/TASK-20261002-87ffc4/red-team-report.yaml (J6 replication_requirements_for_a_later_reject_scoped; required_controls RC-1 to RC-3; objections OBJ-RT-1 to OBJ-RT-6) and attacks/j6/out/{cell-statements,replication-sizing,smallx-tt4-localise}.json
    - coordination/review/pfdr-011cd0-20261002/reviews/TASK-20261002-0114ff/validation-report.yaml (findings F-1, F-2, F-6 as design lessons)
