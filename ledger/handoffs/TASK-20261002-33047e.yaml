    - ledger/evidence/EV-PFDR-ad6274.yaml (per-cell readings, claim_boundaries, unresolved_confounds)
    - ledger/hypotheses/H-PFDR-2765d2.yaml (statement, CC references, heuristics, proof_search_map, test_boundary)
