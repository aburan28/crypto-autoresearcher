  constraints:
    - id: DS-1
      text: >-
        DESIGN ONLY. Write one draft contract; approve nothing, freeze
        nothing, run nothing, write no code and compute nothing (planning
        numbers are taken from archived files and cited by path and field, or
        stated as a P0 run the executor performs after approval). No RUN id.
        The draft carries status review_required and approved_by null.
    - id: DS-2
      text: >-
        PART A REQUIREMENTS (RC-1, RC-2, RC-3; DEC-20261002-c3f49b rulings).
        Cell small_x, TT, m 4 at BOTH 30 and 32 bits; fresh curves from the
        same generator and p_filter, disjoint from every c used by
        EXP-PFDR-011cd0 (c = 10 .. 2009 on the table panel) and from the
        reserved R17 range (c >= 20000); the same |F| matching, CC-1 to CC-10
        and statistic. One pre-registered one-sided test for small_x TT4 at
        alpha 0.01, sized by a P0 rule from EXP-PFDR-011cd0's random-arm TT4
        statistics (the red team's Gaussian planning figures, about 5244
        curves pooled for power 0.8 and about 6801 for power 0.9 at kappa
        1.10, are an input to check, not a result). On the same curves: the
        three matched random arms, a known-null arm, a random arm scored as
        structured (null object), ONE base mutation that keeps |F| and
        separates "small x" from chance (the s smallest x above a declared
        offset, or small_x on the quadratic twist; choose and justify before
        any data), and a planted arm at the target size (kappa about 1.15,
        TT) so PC-R measures sensitivity at the target. t is recalibrated on
        the replication's own random arms before any structured arm is read
        (two-step blinding), with the real-data permutation null of the null
        arms reported beside G-NB-R. Per-rung readings are reported and
        pre-registered as secondary.
    - id: DS-3
      text: >-
        PART A DECISION RULES, PRE-REGISTERED. State, before any data, what
        each outcome means: (i) excess replicates at both rungs and is lost
        under the base mutation -- a small_x-specific relation-source
        candidate: no reading, TW-ALIVE-type routing to review-breakthrough
        at max with S_3-to-solution measured there; (ii) excess replicates
        and persists under the mutation -- an engine- or size-level effect,
        not small_x-specific; (iii) no excess and a one-sided bound at or
        below 1.15 -- small_x TT4 joins the weakened set; (iv) no excess but
        the bound above 1.15 -- inconclusive at the target again, with the
        achieved X_rel and bound recorded. A timeout, crash or memory stop is
        never a negative reading.
    - id: DS-4
      text: >-
        PART B REQUIREMENTS (red team J6 replication_requirements). For each
        of the 20 weakened cells: fresh curves as in DS-2; a separate
        executor session; an independent review round with a blind
        re-derivation and a G-REL-style recount from rows; t* recalibrated
        before unmasking; achieved X_rel at or below target AND a one-sided
        bound at or below target per covered cell; a planted arm at target
        size. A second engine is not needed for an engine-scoped statement
        and is needed for anything beyond it; say which the draft supports.
        State the advisory cost and whether B is worth running before A
        returns.
    - id: DS-5
      text: >-
        PART C (exponent bias). State whether a rung above 32 bits (or more
        rungs in the band) is feasible under machine protection for the cells
        where it is cheapest (for example TT3 and the SS cells), the
        resolution on delta in kappa_rel ~ 1 + c N^delta it would give, and
        its advisory cost; or record why it is not feasible. No growth
        statement may be designed to rest on two rungs.
    - id: DS-6
      text: >-
        LESSONS BINDING ON THE DRAFT. P0 inputs are estimated at the decision
        scope (X_fix for SS), never A_fix (OBJ-RT-6). Intervals are labelled
        by their simulated coverage; if the quantile is taken of |dev|, say
        so (OBJ-RT-3). Any data file or mechanical rule application the
        protocol requires names its permitted means (CD-12). Row conventions
        cite specification clauses, not a README (F-2). Manifests write
        instances_claimed and instances_verified explicitly even when zero
        (F-1). If check_identity_v5.py or the CR-4 text is reused, H9 is
        amended first (F-6). A proof_search_map per KN-TECH-080 is included
        (baseline embedding: EXP-PFDR-011cd0's random arms; nearby-object
        controls; method ceiling; quantifier order).
    - id: DS-7
      text: >-
        SCOPE AND LABELS. Toy scale unless Part C argues otherwise; no
        deployed-curve implication, universal impossibility, exponent below
        rho's or floor-relative reading (TW-SCOPE). Any statement of SS m = 4
        power or X_rel carries "[SS m 4 P0 inputs estimated at 22-24 bits;
        TA-1 assumed, not verified by P0]" when it rests on EXP-PFDR-011cd0's
        P0, or names its own estimation scope otherwise. No floor ratio or A7
        quantity is read or written.
    - id: DS-8
      text: >-
        READ AND WRITE SCOPE. Read the inputs above (from the branch);
        write only coordination/design/TASK-20261002-33047e/. Edit no existing
        record, specification, amendment, run or review artifact, and no file
        under ledger/hypotheses/. Respect DEC-20261002-c3f49b NA-5 (no write
        scope over the engine, its tests or experiments/EXP-PFDR-011cd0/**).
        No .md file.
    - id: DS-9
      text: Never select a provider, backend, endpoint or model identifier containing Bedrock.
