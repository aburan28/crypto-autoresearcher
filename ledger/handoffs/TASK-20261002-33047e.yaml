  title: >-
    Design, without approving, the pre-registered replication of the
    EXP-PFDR-011cd0 structural census: a single-cell confirmatory test of
    small_x TT4 at 30 and 32 bits with null objects and a base mutation, the
    independent replication of the 20 weakened FAM-1 cells, and a feasibility
    statement for a growth-with-N read
  objective: >-
    Produce one complete draft experiment contract (templates/research-records.md
    "Experiment" fields, all non-null) for H-PFDR-2765d2 that (A) resolves
    whether small_x TT4's band excess (kappa_rel 1.097, upper bound 1.171 >
    target 1.15; excess concentrated in the 32-bit rung) is chance or a
    small_x-specific relation excess; (B) provides the independent replication
    of the 20 cells weakened by DEC-20261002-c3f49b that a later reject_scoped
    would require; and (C) states whether a growth-with-N read (a rung above
    32 bits, or more rungs) is feasible under machine protection and what
    resolution on delta it would give. Part A is primary and may be proposed
    as its own experiment if that is cheaper or cleaner; B and C may be phases
    or separate drafts, with the order and the reason stated.
  uncertainty_reduced: >-
    The one open cell of the weakened structural branch (small_x TT4), the
    replication gap that blocks any reject_scoped on the other 20 cells, and
    the untested growth of kappa_rel with N, which is the only route by which
    this branch could bear on an exponent (docs/target-result-profile.md).
  inputs:
