  goal_id: GOAL-MD5-001
  question_id: RQ-MDFIVE-6870c1
  batch_id: BATCH-46254b
  task_card: coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/task-cards/TASK-20260810-927ab5.md
  role: coordinator
  from: coordinator
  to: coordinator
  objective: >-
    Commit BCP-1 as immutable bytes, alone, BEFORE the acquisition task imports a
    published collision path into this repository and before either producer
    runs.
  uncertainty_reduced: >-
    Whether the blindness protocol was committed while the corpus was still
    uncontaminated. This is the single ordering fact that later reviewers cannot
    reconstruct from anything else, and a commit timestamp is the only durable
    record of it.
  inputs:
    - TASK-20260810-26d0d5 and its single declared artifact BCP-1.yaml
  constraints:
    - >-
      SC-1 FABRICATE NOTHING. No invented timing, measurement, throughput,
      citation, review verdict, model identifier or commit SHA. A field that is
      not yet knowable stays null and is named as such.
    - >-
      SC-2 CLAIM CEILING. Assert nothing about MD5 - no collision, no preimage,
      no complexity, no method ceiling, no obstruction, and no comparison
      against any published result in either direction.
    - >-
      SC-3 UNVERIFIED FIGURES STAY MARKED. Every figure in RQ-MDFIVE-6870c1
      provenance is web-search excerpt not read in primary text, and none may be
      cited as authority in either direction.
    - >-
      SC-4 A failed, halted or exhausted search is a BUDGET OUTCOME about a
      solver and NEVER evidence about MD5 (AGENTS.md rules 5 and 8).
    - >-
      SC-5 Anything not attempted is named OPEN AND UNATTEMPTED and is never
      recorded as tried, screened or negative.
    - >-
      SC-6 Change no hypothesis, question, experiment or goal status; approve no
      experiment; promote no knowledge; edit no committed record; record no
      attestation and no review verdict.
    - >-
      SC-7 Halt at the declared wall_clock_seconds and report the halt
      truthfully as infrastructure signal, naming the dropped work as scope
      rather than as an answer.
    - >-
      SC-8 Never select, configure, probe, contact or use Amazon Bedrock
      (AGENTS.md rule 16).
    - >-
      Run alone. Stage exactly BCP-1.yaml and this task's own receipt. Stage
      nothing else.
    - >-
      Fetch origin/main and MERGE it into the working branch before committing;
      never rebase. Record the base commit checked and the merge outcome.
    - >-
      Push the branch and refresh the PR naming BCP-1 and this task's
      record_ids.
    - >-
      Record in the receipt, as a first-class field, that this commit precedes
      any write under coordination/goals/GOAL-MD5-001/quarantine/ and any write
      under knowledge/literature/ by TASK-20260810-bde128. This ordering claim is
      the firewall's provenance and must be stated from observation, never
      assumed.
  deliverables:
    - >-
      snapshot-receipt.json recording the commit, parent, staged path set,
      hashes, and the firewall ordering statement
  artifact_paths:
    - >-
      coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/archives/TASK-20260810-927ab5/snapshot-receipt.json
  archived_by: TASK-20260810-927ab5
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 120
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
    - >-
      The archive verifier accepts the parent, the declared path set, hashes,
      reachability, and the record_ids in the commit message.
    - >-
      BCP-1 is committed BEFORE TASK-20260810-3e0793 and TASK-20260810-bde128
      are dispatched, and the receipt states that ordering from observation.
    - The branch is pushed and the PR names BCP-1.
    - >-
      No status changed and nothing outside the two staged paths was committed.
  return_format: >-
    A summary naming the commit and parent as observed, the two staged paths,
    the origin/main base commit checked and the merge outcome, the PR reference,
    and the observed ordering statement that this commit precedes any write
    under the quarantine directory or knowledge/literature/.
