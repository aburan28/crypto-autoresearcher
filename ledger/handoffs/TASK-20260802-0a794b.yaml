handoff:
  id: TASK-20260802-0a794b
  from: coordinator
  to: coordinator
  objective: 'Freeze two contracts before any datum. EXP-HEUR-d640d9 specifies NC-3/NC-6: the first direct
    test of Heuristic 1 at toy scale on ground truth, covering the sampler-uniformity two-sample test
    (RT-H2), the ell=2 parity statistic of the minimal degree (RT-H3, the one small prime the producer''s
    nondegeneracy argument does not cover), the size-model double fit (RT-H1), and the disjointness ratio
    (RT-H4/NC-6). EXP-PEC-d7979c specifies the c-programme closeout: NC2d-PROPER, NC2b-SLOPE, and L2-WEIGHT.'
  uncertainty_reduced: Whether the batch's primary objective - the untested term that multiplies every
    margin row - is specified tightly enough that its result cannot be reinterpreted after the fact.
  inputs:
  - 'coordination/tasks/TASK-20260724-P13-RT/red_team_report.yaml: RT-H1..RT-H4 and next-controls NC-3,
    NC-6 with their protocols'
  - 'research/P13-HEUR-001/heuristic_analysis.md: the producer''s EXP-1/T1..T5 and EXP-2/LMOMENT designs,
    and the B1..B9 de-risking'
  - 'coordination/goals/GOAL-P13-001/batches/BATCH-003/reviews/: RT3-C3 (FC-4 fires on ell in {3,5} alone),
    RT3-C1 (the entry-weighted charging correction, 0.60-1.00 bits), and the Validator''s V-1 (the NC2b
    gate tolerance has no variance term)'
  - 'experiments/EXP-PEC-49c773/specification.yaml and its run: the instrument, the pairing rule, and
    the alpha machinery NC2d-PROPER extends'
  constraints:
  - Both contracts are FROZEN before execution and are not revised in light of results. A needed change
    is a superseding contract under a new id.
  - 'EXP-HEUR-d640d9 must pre-register, before any datum: the prime range and enumeration method for ground
    truth; the sampler under test and the two-sample statistic comparing walk-sampled against enumerated
    delta_E; the exact parity statistic P(delta_E even) with binomial error bars stratified by p mod 8
    and its rejection threshold; the size-model double fit (against Psi(n,B)/n with n the actual delta_E
    AND against Psi(X,B)/X with X = (p/2)^{1/3}) with the discrimination criterion; and the disjointness
    ratio (iii)/(i) with the value that would count as bounded away from 1.'
  - 'EXP-HEUR-d640d9 must carry a NULL OBJECT of the same shape per docs/inventor-protocol.md, and an
    instrument-fidelity control on a case with an exactly known count. State the void criterion: a signal
    that survives the null is an artifact.'
  - 'State plainly in EXP-HEUR-d640d9 what it CANNOT do: Heuristic 1 is a tail statement at u ~ 13 and
    toy primes cannot reach that tail. This measures the body and the sampler, and its honest ceiling
    is to falsify or fail to falsify the MODEL, never to confirm the heuristic. A pass is not evidence
    for the attack.'
  - EXP-PEC-d7979c must pre-register NC2d-PROPER (C-PSCALE at ell in {47,101,151,211}, chosen ABOVE the
    Karatsuba threshold so the ell in {3,5} artifact RT3-C3 identified cannot drive it) with the alpha
    band and the rule fixing the primary designation across every outcome BEFORE the number is seen; NC2b-SLOPE
    (a synthetic slope null with known ground truth, the only gate with power against L1); and L2-WEIGHT
    (the entry-weighted charging correction, exact enumeration plus the Dickman comparator, with its sign
    stated in advance).
  - The NC2b gate tolerance in EXP-PEC-49c773 had NO VARIANCE TERM (Validator V-1). Any tolerance in EXP-PEC-d7979c
    must derive one or state explicitly that it does not and what that costs in power.
  - Restate the standing prohibitions in both contracts so no Executor can cite a forbidden value.
  - Assess docs/inventor-protocol.md Section 8 for each contract and record the determination with its
    reason.
  - 'Declare stopping rules in scientific terms. There is NO BUDGET: no wall clock, no memory ceiling,
    no run cap. A contract may not say ''stop after N seconds''. It must say what result or condition
    ends the experiment, and what a partial result means.'
  deliverables:
  - experiments/EXP-HEUR-d640d9/specification.yaml (frozen, approved)
  - experiments/EXP-PEC-d7979c/specification.yaml (frozen, approved)
  - opening_report.md stating both pre-registrations, the null objects, the Section 8 determinations,
    and what each contract cannot do
  artifact_paths:
  - experiments/EXP-HEUR-d640d9/specification.yaml
  - experiments/EXP-PEC-d7979c/specification.yaml
  - coordination/goals/GOAL-P13-001/batches/BATCH-004/tasks/TASK-20260802-0a794b/opening_report.md
  archived_by: TASK-20260802-56524a
  goal_id: GOAL-P13-001
  batch_id: BATCH-004
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: true
    independent_session_required: false
  completion_gate:
  - Both specifications exist, are marked approved, and pre-register their statistics, thresholds, null
    objects and stopping rules.
  - Neither contract states a time, memory or run ceiling.
  - The opening report records both Section 8 determinations and EXP-HEUR-d640d9's explicit ceiling.
