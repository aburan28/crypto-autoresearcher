handoff:
  id: TASK-20260801-056
  from: coordinator
  to: executor
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-025
  objective: >-
    Execute RUN-LPF-001-measure ONCE with the IDENTICAL driver file the calibration hash-bound.
    Build the frozen deterministic factor base, enumerate all 130816 half-tuples i < j per cell,
    compute the INT-1 fibre invariants, encode under ENC-B, FACTOR EVERY RESULTING INTEGER, and
    record the largest prime factor, the B-smoothness indicator at every rung, R(u) against the
    theoretical Dickman reference, and every statistic of STAT-LPF-1 against the archived measured
    bands.
  uncertainty_reduced: >-
    The distribution of the largest prime factor of genuine half-arity Semaev partial-map
    intermediates at two toy cells - a quantity this campaign has never measured and on which its
    cost reasoning in this lane depends.
  inputs:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/archives/TASK-20260801-055/snapshot_commit_receipt.json
  - experiments/EXP-LPF-001/specification.yaml
  - experiments/EXP-LPF-001/reading_rule.yaml
  - experiments/EXP-LPF-001/implementation/lpf001_driver.py
  - experiments/EXP-LPF-001/results/calib/
  constraints:
  - 'DO NOT RUN WITHOUT APPROVAL_DETERMINATION APPROVED in the TASK-20260801-055 receipt. Check it and quote it in the execution report.'
  - 'EXACTLY ONE RUN. Do not re-run on an unfavourable-looking number; a second run without a Coordinator amendment is a protocol violation and its output is not evidence.'
  - 'EXECUTE THE IDENTICAL DRIVER FILE. Do not edit lpf001_driver.py. Assert its sha256 equals DRIVER_SHA256 from the TASK-20260801-050 receipt and record the assertion.'
  - 'ASSERT factor_base_sha256 EQUALS THE EXP-EQD-001 ARCHIVED VALUE and record it. Read EXP-EQD-001 artifacts READ-ONLY and stage nothing under it.'
  - 'RE-VERIFY EVERY FACTORIZATION AT 100 PERCENT OF SAMPLES and write factorization_verification.json. STOP on any failure.'
  - 'COUNT AND REPORT every degenerate half-tuple with c_2 = 0 mod p and exclude it from every statistic, with the exclusion count reported.'
  - >-
    REPORT R(u) FOR THE REAL ARM AND FOR THE FRESH UNIFORM ARM SIDE BY SIDE AT EVERY RUNG, in the
    same table, because LIMB B's decidability at a rung is a property of the uniform arm.
  - >-
    WRITE deviation_certificate.json UNCONDITIONALLY - if no deviation is found it records that fact
    with the measured margins; if a deviation is found it lists the deviating rungs, the exact
    statistic values, the archived bands and an INDEPENDENT re-verification of the largest prime
    factor of a stated random subsample by a second factorization path.
  - >-
    RECORD OBSERVATIONS ONLY. Do not apply the reading rule, do not select a branch, do not state a
    disposition and do not set any status. Those are TASK-20260801-060's acts.
  - 'Archive a PRE-RUN `git status --porcelain` capture as git_status_prerun.txt.'
  - 'manifest.yaml with the five companions - note .log and not .txt.'
  - 'If the budget is exhausted, STOP and report the budget event. A partial run is not a result and must never be presented as one.'
  - 'MAKE NO COMMIT; TASK-20260801-057 archives.'
  - 'Record inference honestly.'
  deliverables:
  - the RUN-LPF-001-measure run package with its seven declared files
  - experiments/EXP-LPF-001/results/measure/LPF_report.json
  - experiments/EXP-LPF-001/results/measure/absolute_comparison.json
  - experiments/EXP-LPF-001/results/measure/relative_band_comparison.json
  - experiments/EXP-LPF-001/results/measure/deviation_certificate.json
  - experiments/EXP-LPF-001/results/measure/factorization_verification.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/tasks/TASK-20260801-056/execution_report.yaml
  artifact_paths:
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-measure/manifest.yaml
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-measure/raw-result.json
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-measure/command.txt
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-measure/environment.json
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-measure/stdout.log
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-measure/stderr.log
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-measure/git_status_prerun.txt
  - experiments/EXP-LPF-001/results/measure/LPF_report.json
  - experiments/EXP-LPF-001/results/measure/absolute_comparison.json
  - experiments/EXP-LPF-001/results/measure/relative_band_comparison.json
  - experiments/EXP-LPF-001/results/measure/deviation_certificate.json
  - experiments/EXP-LPF-001/results/measure/factorization_verification.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/tasks/TASK-20260801-056/execution_report.yaml
  archived_by: TASK-20260801-057
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 5400
    memory_gb: 8
    maximum_runs: 1
  completion_gate:
  - 'APPROVAL_DETERMINATION APPROVED quoted; exactly one run executed with the identical hash-bound driver and the assertion recorded.'
  - 'factor_base_sha256 asserted equal to the EXP-EQD-001 value; all 130816 half-tuples enumerated per cell with degenerate draws counted and excluded.'
  - 'Every integer factored and 100 percent re-verified.'
  - 'R(u) reported for the real and uniform arms side by side at every rung; every statistic recorded against its archived band.'
  - 'deviation_certificate.json written unconditionally; the seven-file run package present.'
  - 'No reading rule applied and no disposition stated; no commit made.'
