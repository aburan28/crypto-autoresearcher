  constraints:
  - You are not alone. Own only the six exact output files; preserve all other agents, archived sources, reviews
    and ledger. No shared module edits, commits, pushes, claim releases or scientific-status changes.
  - Effective protocol is the original specification plus original approval and the prospective DEC-20260907-38017a
    amendment. Verify all source hashes. Implement actual algorithms and a concrete end-to-end future runner, never
    callback scaffolds, method-description controls or TODOs.
  - Zero scientific runs. Do not generate the experimental fixtures, perform frozen candidate searches or run the
    experimental census/control/timing panel. Implement scientific functions without invoking them. Default CLI
    is help/dry-run; every scientific entry path requires real future authority.
  - Use published reviewer checks and worked counterexamples as regression requirements. Preserve their original
    bytes. Copy/adapt checks only in your own tests.py; explicitly mark obsolete wall/CPU-cap expectations as superseded
    by the new amendment rather than making the implementation violate current policy. A skipped check is not PASS.
  - 'Resolve every accepted finding: discard and record singular candidates; execute constant-O all-start coefficient-reset
    census and verify zero solves; distinguish failed certificates from fruitless denominators; reduce every named
    control into validity; preserve progress incrementally across all stages and checkpoints; produce full canonical
    manifest/companions, rejected candidates, cost splits, Cayley gap and exact all-u decision; atomically publish
    verified artifacts.'
  - Check cancellation and process-group memory inside long loops; one worker. Distinguish cancellation, memory/watchdog,
    I/O and implementation failures from invalid scientific controls. Ordinary wall/CPU estimates remain advisory,
    but total/stage actual costs must be recorded. No silent loss of completed cells, starts or fixture rejections
    on interruption.
  - Lock verification must authenticate externally supplied Coordinator authority and bind actual spec/amendment/driver/plan/runtime/resource
    bytes and an archived review admission decision naming the corrected snapshot and report hashes. Verify required
    review verdict, source identity and reachable archive commit. Never treat arbitrary hash-bound text as an admission
    receipt. Missing real future trust input refuses launch but is not permission to leave code unfinished. Do not
    mint a real lock, key, signature, RUN or review verdict.
  - No ordinary implementation work may be reported as a mathematical blocker. For a genuine conflicting frozen
    requirement or unavailable dependency, report the exact item promptly and complete independent obligations.
    Keep all scientific scope/parameters fixed.
  - Before relinquishing, statically trace every frozen obligation to executable code and a canonical artifact.
    Complete means implementation ready for independent review, not scientific or launch approval. If an obligation
    remains unwritten, label it partial and name it, never claim backend completeness.
  - Accepted V-01..V-08 in ledger/decisions/DEC-20260908-0d2555.yaml are mandatory and must each map to final code,
    canonical outputs and a fixed regression. Preserve original report/checks bytes.
  - Implement separate reviewed_source_snapshot and executing_commit with source-byte equality, correct ancestry,
    real review semantics and authority verification. A passing synthetic report is only an isolated test fixture
    and cannot be used for real launch.
  - Do not introduce a new signature scheme, baseline or scientific definition without naming the exact conflict
    for Coordinator resolution. Preserve the existing approved protocol and prospective authority separation.
  - The current source to copy is TASK-20260908-6a010d. Write only the six declared new files. You are not alone
    in the codebase; preserve all other agent edits and immutable sources. Prior accepted corrections remain required.
  - Implement S2-01 through S2-08 from ledger/decisions/DEC-20260908-94664e.yaml with an explicit mapping to final
    executable code, each canonical output and fixed regressions. This task supplies the exact non-self-referential
    archive binding clarification for S2-06; no scientific definition is changed.
  - At most 240 TOTAL fixed static/synthetic/mock case executions INCLUDING every parameterized input, failure and
    rerun,10 seconds per case and1800 seconds aggregate executed-check wall/CPU,one worker8GiB. Keep a running count
    before each invocation, reject any invocation exceeding the remainder, and reserve a complete final-code suite.
    Source/hash/parse/version checks are administrative. This allowance replaces the earlier 160-case allowance
    prospectively for this new task only. Record exact attempts, failures and actual telemetry; missing telemetry
    stays unknown.
  - No scientific fixture/candidate search, census, experimental control/null/timing panel, future-run command token
    even with mocks, real key/signature/lock or RUN. Exercise fixed lower-level mock helpers directly; implement
    all future functions but do not invoke scientific paths.
  - Require real governed review attestation, plan-owned joints, independent policy/model/session provenance and
    exact source reads. Archive binding must validate the real external commit and its parent/diff/record IDs/source
    hashes against Git, including any required detached queue binding. An in-snapshot receipt must not self-name
    its containing commit. No permissive synthetic PASS fixture is a real authority source.
  - For report coverage derive actual retained fixture/cell/seed counts from completed or partial sink data, and
    include the named secondary values and every diagnostic cost even on early stops. Do not substitute frozen expected
    counts for observed coverage.
  - For path admission resolve the canonical experiment root and reject mismatched or symlink-escaped roots before
    work. Enforce the new RUN-ECDLP-six-lowercase-hex form and explicit allocation/authority binding; a regex alone
    does not prove allocation.
  - For failure custody distinguish receipt attempted, written, file-fsynced, directory-fsynced, quarantine-complete
    and unretained states. Missing process-group/current-process RSS rows must fail operationally. Thread cancellation/RSS
    checks and precise outer/inner progress through every dense loop without changing scientific RNG outputs.
