handoff:
  id: TASK-20260824-3bd362
  from: coordinator
  to: red-team
  goal_id: GOAL-DIFFP-84d641
  batch_id: BATCH-f8bf86
  question_id: RQ-DIFFP-a5c483
  experiment_id: EXP-DIFFP-fe894e
  objective: >-
    Try to falsify the interpretation and the scope of the adjudicator package,
    not its arithmetic: (R-a) ATTACK THE NULL'S DIFFICULTY, NOT ITS OUTCOME --
    construct decoy difference vectors strictly harder than the contract's
    declared families (near neighbours of census entries under the declared
    distance, and objects exactly one generator-step outside the verified group)
    and show whether the adjudicator still says NO; (R-b) ATTACK THE DECLARED
    EQUIVALENCE -- find two genuinely distinct objects the canonicaliser
    identifies (too coarse), or a pair the group should identify and does not
    (too fine), and state which of the two errors the batch's numbers are exposed
    to; (R-c) PROVES-TOO-MUCH -- run the identical membership argument against
    objects for which MEMBER is KNOWN FALSE and show it fails there; (R-d) SCOPE
    AND INTERPRETATION -- check that every verdict is scoped to the census that
    produced it, that no NON-MEMBER verdict is written or implied as novelty,
    that the acquisition gap is not quietly absorbed into a covering claim, and
    that nothing has drifted into GOAL-MD5-001's or GOAL-SHA1-001's work.
  uncertainty_reduced: >-
    Whether a passing control set means the adjudicator is SHARP or only that it
    was never asked a hard question -- and whether the declared equivalence errs
    toward OVER-declaring novelty or UNDER-declaring it, which is the direction
    every later covering number in this goal will inherit.
  inputs:
    - >-
      THE COMMITTED REVIEW PLAN for TASK-20260824-c6625a, which assigns this
      task's joints, its proves-too-much objects and any blind re-derivation with
      its blind_from list, and is AUTHORITATIVE over the objective sketch above.
      THIS TASK MAY NOT BE DISPATCHED BEFORE IT EXISTS.
    - The snapshot receipt and the exact paths it binds.
    - >-
      experiments/EXP-DIFFP-fe894e/specification.yaml -- the frozen contract and
      its interpretation_limits.
    - >-
      coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/batch.yaml -- the
      Coordinator's PRIOR recorded at opening, including P-3's explicit statement
      that the Coordinator expects both controls to pass and trusts that
      prediction LEAST as evidence, and P-2's stated uncertainty about generator
      E2.
    - >-
      The idea-generator's proposal set, as a source of harder decoys and of
      claims to attack.
    - >-
      Coordinator's intended proves-too-much objects, named at opening: the SHA-0
      message expansion (a DV space the adjudicator must NOT accept as SHA-1),
      and a null draw from INSIDE the linearized code.
    - >-
      Coordinator's intended blind re-derivation quantity: the ORBIT COUNT of the
      planted set under the verified generators, re-derived from the generator
      STATEMENTS and the planted seeds alone, with harness/diffpath/** and the
      producer's execution report in blind_from.
  constraints:
    - >-
      INDEPENDENT SESSION, SIBLING-BLIND. Do NOT read
      coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/reviews/TASK-20260824-c40847,
      and declare in your attestation exactly what you read.
    - >-
      If the plan assigns a blind re-derivation, do not read any path in its
      blind_from before your re-derivation is written, and set
      blind_from_respected explicitly. Recomputing from the producer's
      implementation is REPLICATION, not re-derivation, and cannot catch an
      implementation that is wrong and self-consistent.
    - Write only into this task's own directory. The archived artifacts are immutable.
    - Do not read coordination/goals/GOAL-MD5-001/quarantine/** and attest non-reading.
    - >-
      DO NOT RUN A SEARCH FOR A NEW DIFFERENTIAL PATH and do not attempt a
      collision. Constructing hard decoys for the null is in scope; searching the
      difference space is not (EXP-DIFFP-fe894e IR-8).
    - REPORT ON THE JOINTS YOU OWN. Do not compose a whole-claim verdict.
    - >-
      AN OBJECTION MUST NAME WHAT WOULD SETTLE IT. "This is unconvincing" is not
      a finding; "this decoy at these parameters adjudicates MEMBER, and here it
      is" is.
    - >-
      Record requested policy, resolved model identifier, backend, probe status
      and reasoning effort. A tier the backend cannot reach is a PAUSE, never a
      silent downgrade. Never Amazon Bedrock.
    - >-
      No fabricated commands, outputs, timings, statistics, citations or runs;
      every citation carries provenance.
  deliverables:
    - >-
      red-team-report.yaml with joint-by-joint findings (holds | breaks |
      inconclusive), the constructed hard decoys and their adjudication outcomes
      as data whichever way they came out, the proves-too-much outcomes, the
      blind re-derivation and its blind_from_respected flag if assigned, an
      explicit statement of whether the declared equivalence errs toward over- or
      under-declaring novelty with its evidence, a review_attestation block, the
      quarantine non-reading attestation, and the requested policy with the
      resolved model identifier.
    - >-
      An explicit statement of where your findings DEPART from the Coordinator's
      recorded prior P-1..P-5, if they do.
  artifact_paths:
    - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/reviews/TASK-20260824-3bd362/red-team-report.yaml
  archived_by: TASK-20260824-b03556
  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 360
    memory_gb: 3
    maximum_runs: 3
  completion_gate:
    - >-
      Every joint assigned by the committed review plan has an explicit verdict
      of holds, breaks or inconclusive, with its evidence.
    - >-
      At least one class of decoy strictly harder than the contract's declared
      null families was constructed and adjudicated, with the outcome reported as
      data whichever way it came out.
    - >-
      The proves-too-much control was run against the plan's named known-false
      objects and its outcome reported.
    - >-
      An explicit statement of whether the declared equivalence errs toward over-
      or under-declaring novelty, with its evidence.
    - >-
      A review_attestation block with sources_read, read_sibling_reports: false,
      and blind_from_respected if a re-derivation was assigned.
    - The quarantine non-reading attestation is present.
  return_format: >-
    Joint-by-joint verdicts, the hard decoys and their outcomes, the error
    direction of the equivalence, any departure from the Coordinator's recorded
    prior, and anything you could not attack with the reason.
  review_plan: null
  review_plan_note: >-
    NULL BY DESIGN AND NOT BY OVERSIGHT, for the same reason as
    TASK-20260824-c40847: this handoff does not OPEN the review round. The round
    is opened by a SEPARATE coordinator handoff carrying the review_plan, written
    after the snapshot archive lands and before any reviewer runs.
