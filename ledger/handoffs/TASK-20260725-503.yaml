handoff:
  id: TASK-20260725-503
  from: coordinator
  to: red-team
  objective: >-
    Try to falsify novelty, oracle/torsion assumptions, scaling, and full-cost
    advantage of the proposed SSI mechanism, or verify a NO_ADMISSIBLE disposition.
  inputs:
