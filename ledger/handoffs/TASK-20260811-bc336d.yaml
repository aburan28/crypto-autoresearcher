    - experiments/EXP-INSTR-36c8cf/amendments/v2.yaml
    - experiments/EXP-INSTR-36c8cf/amendments/v1.yaml

  budget:
    wall_clock_seconds: 1800
    memory_gb: 8
    maximum_runs: 1
    total_cpu_hours: 0.5
    budget_note: >-
      Generous relative to the actual work: pure post-hoc statistics and
