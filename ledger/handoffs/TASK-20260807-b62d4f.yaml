handoff:
  id: TASK-20260807-b62d4f
  recorded_at: '2026-08-07'
  from: coordinator
  to: executor
  objective: >-
    Execute the frozen contract EXP-FIB-001 exactly as specified and
    produce the immutable run records and execution report it requires.
    Decide whether n_R, the number of factor-base decompositions of a
    target computed from public data only, predicts per-target S_4
    decomposition cost strongly enough to drive a two-phase target-
    selection strategy: measure the Spearman rank correlation rho_s
    between n_R and measured decomposition cost across 200 targets per
    curve, gated at |rho_s| >= 0.4 with permutation-null p < 0.01, run the
    label-shuffled negative control (gated at |rho_s| <= 0.2), the
    exhaustive-truth control (n_R exact on 100% of 8-12 bit audit
    targets), and the HEUR-001 quasirandom distributional reference. The
    two-phase strategy secondary runs only if both gates pass.
  uncertainty_reduced: >-
    Whether a cheap, public-data-only geometric invariant of the Semaev
    fiber predicts per-target decomposition difficulty well enough to be
    operationally useful, versus being spurious (killed by the
    label-shuffled null) or non-representative of true fiber structure
    (killed by the exhaustive-truth control).
  inputs:
