# SUCCESSOR HANDOFF. Supersedes ledger/handoffs/TASK-20260904-50755f as the
# dispatchable copy of the GOAL-MONO-001 rule-12 closure review, under
# DEC-20260930-3a0b7b (R-1..R-4). Reasons, all infrastructure or procedure,
# none research:
#   (1) 50755f carries fallback_allowed false. On this runtime the only route
#       that serves review-breakthrough at max is the Claude Code
#       `validator-breakthrough` subagent with an inherited session model, and
#       that is a model substitution. The card may not be dispatched on that
#       route as written, and the card is immutable.
#   (2) Both BATCH-5abf72 queue tasks are `cancelled`.
#   (3) The 2026-09-04 review plan predates DEC-20260904-dd58c3 /
#       H-MONO-ebd400. J2 is widened to cover those records, J4 is added, and
#       a fresh Coordinator prior is recorded below BEFORE ANY REVIEWER RUNS.
#       No reviewer has ever run on this claim.
# J1-J3 are carried forward from 50755f without changing their substance.
handoff:
  id: TASK-20260930-40470a
  from: coordinator
  to: validator-breakthrough
  goal_id: GOAL-MONO-001
  authorized_by: DEC-20260930-3a0b7b
  supersedes_dispatch_copy: TASK-20260904-50755f
  objective: >-
    Independent rule-12 review, at review-breakthrough max, of the proposed
    closure of GOAL-MONO-001. It has two parts. (i) The scoped instrument
    no-go recorded in DEC-20260810-2f86db (D-1/D-2, grounded in EV-MONO-a0a89c
    OBS-5) and whether it is adequate for completion criterion (c): "a scoped
    instrument/protocol no-go is recorded". (ii) Whether the later m=4 result
    H-MONO-ebd400 / EV-MONO-e9dc3b (DEC-20260904-dd58c3) satisfies completion
    criterion (a) as worded: "the census agrees with full symmetric/wreath
    monodromy within stated error". Your verdicts are the input a Coordinator
    closure decision needs. You decide nothing yourself.
  uncertainty_reduced: >-
    Whether either closure route is sound, correctly scoped and adequate. The
    question is split into four owned joints (review_plan below). A DISSENT on
    J1 with a CONCUR on J4 would leave route (a) standing, and the reverse
    would leave route (c) standing. Both are decision-changing.
  inputs:
    - ledger/decisions/DEC-20260930-3a0b7b.yaml
    - ledger/handoffs/TASK-20260904-50755f.yaml
    - ledger/decisions/DEC-20260810-2f86db.yaml
    - ledger/decisions/DEC-20260802-a51c82.yaml
    - ledger/decisions/DEC-20260904-67cde4.yaml
    - ledger/evidence/EV-MONO-a0a89c.yaml
    - ledger/goals/GOAL-MONO-001/goal.yaml
    - ledger/goals/GOAL-MONO-001/checkpoints/BATCH-003.yaml
    - ledger/corrections/CORR-20260802-1d8384.yaml
    - ledger/questions/RQ-MONO-001.yaml
    - knowledge/open-problems/KN-OPEN-009.md
    - ledger/decisions/DEC-20260904-dd58c3.yaml
    - ledger/evidence/EV-MONO-e9dc3b.yaml
    - ledger/hypotheses/H-MONO-ebd400.yaml
    - ledger/corrections/CORR-20260904-33fbf3.yaml
    - experiments/EXP-MONO-0e6e8f/specification.yaml
    - experiments/EXP-MONO-0e6e8f/execution_report.yaml
    - ledger/decisions/DEC-20260905-021e6e.yaml
    - knowledge/findings/KN-FIND-edd62c.md
    - knowledge/findings/KN-FIND-19f5ea.md
    - AGENTS.md
    - templates/research-records.md
    - docs/inventor-protocol.md
  constraints:
    - >-
      Independent session. You are not the producing agent. Do not open any
      path in review_plan.blind_rederivation.blind_from. Declare every path
      and commit you read.
    - >-
      Report on YOUR joints only (J1-J4 plus the proves-too-much control and
      the blind re-derivation). The Coordinator composes the round. Give no
      whole-goal verdict.
    - >-
      Zero scientific runs. Your own S_4 construction and any
      small-prime checks are review computations. Write them, with their code,
      under the write scope. Do not create a RUN-* directory and do not touch
      experiments/.
    - >-
      Write nothing outside write_scope. Change no official state: no goal,
      hypothesis, evidence, knowledge or queue file.
    - >-
      A timeout, crash or tooling failure is not evidence about the
      mathematics (AGENTS.md core rule 5). Report it as what it is.
    - >-
      Give provenance for every citation (recalled | retrieved | kb |
      internal). A recalled reference is a pointer, never support.
    - >-
      The claim tier ceiling stays toy. No security estimate moves in either
      direction. Nothing you write is an ECDLP result.
    - >-
      Do not read another reviewer's report on this claim. None exists.
      If you find one, stop and report it.
  read_scope: inputs above, plus any public mathematical source you retrieve (declare it)
  write_scope:
    - coordination/goals/GOAL-MONO-001/review/TASK-20260930-40470a/
  deliverables:
    - >-
      review_report.md. For EACH of J1, J2, J3 and J4 it gives: the method
      actually used; what was built, computed or read; a verdict of CONCUR,
      DISSENT or INCONCLUSIVE with reasons; and a reading declaration.
    - >-
      Proves-too-much section: the result on both named objects, and the
      exact step at which the argument stops at the locus boundary, or fails
      to stop there.
    - >-
      Blind re-derivation section: your derivation from scratch, the
      parameters and instances you used, your own S_4 construction (code under
      the write scope), and a statement that you did not open the blind_from
      paths.
    - >-
      review_attestation block with these fields: independent_session true;
      role validator-breakthrough; requested_policy review-breakthrough;
      reasoning_effort as served; resolved_runtime; resolved_model_id as the
      runtime reports it; fallback_used and its reason; model_verified;
      read_sibling_reports false; and the exact record IDs reviewed.
  artifact_paths:
    - coordination/goals/GOAL-MONO-001/review/TASK-20260930-40470a/review_report.md
    - coordination/goals/GOAL-MONO-001/review/TASK-20260930-40470a/s4_construction/
  archived_by: TASK-20260930-a72623   # PD-1 of DEC-20260930-3a0b7b: minted and --check OK by the top-level session 2026-09-30
                      # before this card is first committed. See DP-1.
  inference:
    policy: review-breakthrough
    reasoning_effort: max
    reasoning_effort_note: >-
      Rule 12 closure-result review. Non-degradable. Served by the Claude Code
      validator-breakthrough binding (.claude/agents/validator-breakthrough.md,
      effort max), per DEC-20260930-3a0b7b R-1 condition (d).
    fallback_allowed: true
    fallback_note: >-
      Backend or model substitution is allowed only to a binding that fully
      meets the max floor. It is recorded as fallback_used with the resolved
      model identifier and a reason. Never a cheaper policy, never degraded,
      never Bedrock. If max cannot be served, do not dispatch.
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 14400
    wall_clock_note: >-
      Advisory under docs/research-budget-policy.md. It works as a watchdog
      checkpoint, not a scientific stop. Expiry checkpoints the task. It
      records no verdict and is not negative evidence.
    memory_gb: 8
    maximum_runs: 0
  dispatch_preconditions:
    - id: DP-1
      text: >-
        archived_by is bound before anything else happens. Mint the snapshot
        archive task with `python3 tools/allocate_id.py --next task --date
        20260930`, run --check on it, and write it into this card's archived_by
        BEFORE the card is first committed. Committing or dispatching with
        archived_by null is forbidden.
    - id: DP-2
      text: >-
        Declared inputs are committed and pushed: this card,
        DEC-20260930-3a0b7b, and every path under inputs, on the dispatching
        branch after merging origin/main (merge, never rebase).
    - id: DP-3
      text: >-
        Confirm the tier. `python3 tools/check_runtime_bindings.py --list`
        shows validator-breakthrough at effort max, sourced from the agent
        file. The launched session's resolved model identifier contains no
        "bedrock". If either fails, DO NOT DISPATCH. IMP-1 stands.
    - id: DP-4
      text: >-
        Open a queue for this task through the dispatcher. Use a new batch on
        GOAL-MONO-001 opened by a Coordinator decision or queue revision, never
        an edit of BATCH-5abf72, whose tasks stay `cancelled`. It must contain
        this review task, a snapshot-archive task (DP-1's ID) that runs alone
        after the reviewer returns, a fresh-session Coordinator composer, and a
        ledger-archive task that runs alone. Mint every ID with allocate_id.py.
    - id: DP-5
      text: >-
        Lanes. Run `tools/goal_lanes.py lanes GOAL-MONO-001` and respect
        campaign_budget.max_concurrent 1. Then claim this task with
        `tools/goal_lanes.py claim ... --as <addr> --ttl-minutes N --publish`
        before launch, and release it with its outcome on return.
    - id: DP-6
      text: >-
        Read this whole card, including review_plan, before launch. Launch it as
        a fresh `validator-breakthrough` subagent session that has not read
        DEC-20260810-2f86db's producing session transcript or any blind_from
        path.
  completion_gate:
    - review_report.md exists at the declared path, with a verdict and reading declaration for each of J1, J2, J3 and J4.
    - No verdict is left implicit. J1-J4 are each CONCUR, DISSENT or INCONCLUSIVE, with reasons.
    - The proves-too-much result is reported on BOTH named objects, with the failing or stopping step named.
    - The blind re-derivation covers m=3 and m=4 with at least 20 random factor-base tuples at m=4, on an S_4 the reviewer built itself, and states that blind_from was not opened.
    - review_attestation records requested policy, served effort, resolved runtime and model, fallback_used and model_verified truthfully, and sets read_sibling_reports to false.
    - Zero runs. Nothing is written outside write_scope.
  return_format: >-
    Return the review report body: per-joint verdicts, the proves-too-much
    and blind sections, the reading declaration and the attestation. The
    Coordinator archives the runtime receipt alongside it.
  review_plan:
    id: REVIEW-MONO-20260930-40470a
    written_before_any_reviewer_ran: true
    supersedes_plan_of: TASK-20260904-50755f
    claim_under_review: >-
      Route (c), as stated by its producer in DEC-20260810-2f86db: "the
      generic-fibre Frobenius cycle-type census, in the frozen instrument form
      of EXP-MONO-4b50b6, AS A PROBE OF INDEX-CALCULUS RELATION RATE, at every
      m" is closed. The reason: on the factor-base locus the statistic is
      identically trivial (EV-MONO-a0a89c OBS-5). If x_1..x_{m-1} are
      x-coordinates of F_p-rational points, the roots of S_m(x_1..x_{m-1},T)
      are exactly the 2^{m-2} values x(eps_1 P_1 + ... + eps_{m-1} P_{m-1}),
      all in F_p. That no-go is proposed as the criterion-(c) object. Route (a)
      is not claimed by any record. J4 asks whether it could be, and the
      Coordinator proposes nothing on it in advance.
    coordinator_prior: >-
      Written 2026-09-30, before any reviewer ran. It restates and extends the
      2026-09-04 prior. J1: CONCUR expected, probability about 0.85. The
      argument follows from the group law. The one place I expect a gap could
      hide is still the exhaustion direction: that the sign-vector sums
      account for ALL roots of S_m over the algebraic closure, counted with
      multiplicity. A DISSENT there would most likely come from repeated roots
      (coincident sign-vector sums, e.g. 2-torsion or P_i = +/-P_j), where
      "exactly 2^{m-2} distinct values" fails even though complete splitting
      holds. That would weaken the wording but not the no-go. J2: CONCUR
      expected on overreach. I expect the reviewer to find that D-3's
      "imprimitivity half ... LIVE at m >= 4" and the goal head's text are
      STALE (they underclaim) relative to DEC-20260904-dd58c3, and to flag
      this. Staleness in the direction of underclaiming is not overreach.
      J3: CONCUR expected, about 0.75. The weakest point is whether "recorded"
      in criterion (c) is satisfied by a derivation-based no-go rather than a
      measured one. D-6 argues it is. J4: genuinely uncertain, CONCUR about
      0.5. Criterion (a) does not name an arity, and EV-MONO-e9dc3b is an
      exhaustive census agreeing with full S_4. But the census is not the
      frozen EXP-MONO-4b50b6 protocol the objective names, it covers the
      symmetric base at m=4 on 4 curves and 2 primes only, and
      DEC-20260904-dd58c3 itself declined to mark any criterion met. I would
      not be surprised by DISSENT or INCONCLUSIVE on J4. I expect the
      composed round to support closure under (c) alone.
    joints:
      - joint: >-
          J1 - DERIVATIONAL SOUNDNESS OF THE NO-GO (carried from
          50755f J1). On the factor-base locus, S_m(x_1..x_{m-1},T) splits
          completely over F_p with root set exactly { x(eps_1 P_1 + ... +
          eps_{m-1} P_{m-1}) }, which has cardinality deg_T S_m = 2^{m-2} for
          m >= 3, counted with multiplicity. So the cycle-type statistic is
          constant on that locus.
        assigned_to: TASK-20260930-40470a
        attack_plan: >-
          Re-derive blind (see blind_rederivation), from the group law and the
          defining property of Semaev polynomials (S_m(x_1..x_m) = 0 iff there
          exist points P_i with x(P_i) = x_i and P_1 + ... + P_m = O). Also
          build S_4 yourself by resultant recursion over a prime in 50-2000.
          Check (a) completeness: all four T-roots lie in F_p for random
          factor-base triples. Check (b) exactness: the root multiset equals
          the sign-vector multiset. Check (c) degeneracies: construct triples
          with P_i = +/-P_j, a 2-torsion P_i, and a coincident sum, and report
          what happens to multiplicity and to the statistic. Attack the
          exhaustion direction first.
        breaking_artifact: >-
          One factor-base-locus instance where S_m fails to split completely
          over F_p, or where a root lies outside the sign-vector set; or a
          derivation showing the root count differs from 2^{m-2} with
          multiplicity. A degeneracy that changes only distinctness is
          reported as a scope correction, not a break.
      - joint: >-
          J2 - SCOPE HONESTY (carried from 50755f J2, widened). The no-go
          must close ONLY the instrument form. It must not close the
          relation-rate question (D-2), the D-4 direction swap, or any other
          statistic, and it must not license an m >= 4 census in the rejected
          form. WIDENED: audit the no-go's scope statements against the
          records committed since 2026-09-04 (DEC-20260904-dd58c3,
          H-MONO-ebd400, KN-FIND-edd62c, KN-FIND-19f5ea, DEC-20260905-021e6e)
          and the current goal head.
        assigned_to: TASK-20260930-40470a
        attack_plan: >-
          Run the proves-too-much control (below). Then audit wording for
          overreach: any sentence in DEC-20260810-2f86db or the goal head that
          could be read as closing the relation-rate half, condemning the D-4
          statistic, or closing any statistic other than the generic-fibre
          cycle type. Separately, list statements the later records make
          stale, such as D-3's m >= 4 imprimitivity sentence versus
          H-MONO-ebd400. Label each finding as overreach or underclaim.
        breaking_artifact: >-
          A reading that licenses "the relation-rate half of KN-OPEN-009 is
          closed" or "the D-4 swapped statistic is condemned", or a
          demonstration that the D-1 argument structure transfers to the
          swapped statistic.
      - joint: >-
          J3 - ADEQUACY FOR CRITERION (c) (carried from 50755f J3).
        assigned_to: TASK-20260930-40470a
        attack_plan: >-
          Quote-match criterion (c) against DEC-20260810-2f86db. Is the no-go
          scoped (J2)? Is it recorded in a committed Coordinator decision? Is
          adopting it consistent with DEC-20260802-a51c82 N-2, which examined
          only (a), and with D-6/D-9? Check that closure under (c) implies no
          hypothesis-status change and no claim beyond toy. Build the exact
          quote trail. No new mathematics is needed.
        breaking_artifact: >-
          A reading of criterion (c) that the record does not satisfy (for
          example, one requiring measurement rather than derivation, or scope
          statements the record lacks), or a contradiction that closure would
          paper over.
      - joint: >-
          J4 - ADEQUACY OF H-MONO-ebd400 / EV-MONO-e9dc3b FOR CRITERION (a)
          (NEW). Criterion (a): "the census agrees with full
          symmetric/wreath monodromy within stated error".
        assigned_to: TASK-20260930-40470a
        attack_plan: >-
          This is a consistency joint. Quote-match criterion (a) and the goal
          objective ("Decide KN-OPEN-009 at toy scope via a frozen
          Chebotarev/monodromy census protocol") against EV-MONO-e9dc3b,
          H-MONO-ebd400, EXP-MONO-0e6e8f/specification.yaml and
          DEC-20260904-dd58c3's scope_statement and official_status_changes
          (completion_criteria_met []). Decide five things: whether "the
          census" in (a) must be the EXP-MONO-4b50b6 instrument or any frozen
          census; whether m=4 over the symmetric base on 4 curves and 2 primes
          meets "within stated error"; whether "agrees with full ... monodromy"
          is met by an exhaustive group-theoretic identification (a 4-cycle
          and a 3-cycle force S_4) rather than a distributional fit; whether
          CORR-20260904-33fbf3 affects the headline; and whether the m=3
          non-discrimination (DEC-20260802-a51c82 D-2) conflicts with adopting
          (a). Do not re-run or recompute the census. Its validation is
          committed and is not this joint.
        breaking_artifact: >-
          A reading of criterion (a) or the objective that the m=4 result does
          not satisfy, or a committed statement that adopting (a) would
          contradict.
    blindness:
      mutual: true
      lifted_for: []
      rationale: >-
        Single-reviewer round. No sibling report exists. The reviewer may read
        the committed m=4 review outcomes as recorded in DEC-20260904-dd58c3,
        but not the underlying reviewer task reports, which the inputs do not
        list.
    proves_too_much:
      objects:
        - >-
          A GENERIC base tuple: x_i drawn from F_p and NOT constrained to be
          x-coordinates of F_p-rational points. The census statistic is
          expected to vary there. If the D-1 argument structure also "proves"
          constancy for such tuples, it proves too much.
        - >-
          The D-4 swapped statistic on the same locus: fix T = x(R) and count
          FB-rational points on the fibre of the projection to the T-line. If
          D-1's argument yields constancy here too, the no-go condemns its own
          named successor.
      failure_signature: >-
        The argument succeeds (proves constancy) on either object. Record the
        exact step that fails to stop at the locus boundary.
      assigned_to: TASK-20260930-40470a
    blind_rederivation:
      required: true
      quantity: >-
        The OBS-5 root-set statement for m=3 and m=4: the F_p-root multiset of
        S_m(x_1..x_{m-1},T) on the factor-base locus equals
        { x(sum eps_i P_i) } and has size 2^{m-2} with multiplicity. Derive it
        from the group law and the defining property of Semaev polynomials,
        using your OWN S_4.
      parameters: >-
        Any prime p in 50-2000 and any curve over F_p, with at least 20 random
        factor-base tuples at m=4 plus the degeneracy instances of J1(c). The
        producer used p=211 and y^2 = x^3 + 3x + 8. You need not use them.
      blind_from:
        - experiments/EXP-MONO-4b50b6/
        - coordination/goals/GOAL-MONO-001/batches/BATCH-003/
      assigned_to: TASK-20260930-40470a
    procedure_deviations:
      - id: PD-A
        what: >-
          The plan was refreshed from TASK-20260904-50755f before any reviewer
          ran. J2 is widened, J4 is added, and a new prior is recorded.
          Reasons are in DEC-20260930-3a0b7b R-3. J1-J3 keep their 2026-09-04
          substance, and that prior is preserved in 50755f.
      - id: PD-B
        what: >-
          One reviewer owns every joint, the control and the blind
          re-derivation, as in the 2026-09-04 plan. This buys coverage, not
          cross-reviewer independence. Disclosed in DEC-20260930-3a0b7b
          limitations.
