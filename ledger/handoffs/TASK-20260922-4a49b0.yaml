handoff:
  id: TASK-20260922-4a49b0
  from: coordinator
  to: executor
  objective: >-
    Execute the frozen protocol in experiments/EXP-DREG-dd668d/specification.yaml.
    Emit exactly one outcome_label and the rank profiles. Do not interpret the
    label as an ECDLP result and do not start the other three experiments.
  uncertainty_reduced: >-
    Whether one certified F_4 degree-2 edge moves the degree-filtration rank
    profile of the chained t=4 ideal after the linear-substitution check.
  inputs:
    - experiments/EXP-DREG-dd668d/specification.yaml
    - ledger/hypotheses/H-DREG-1d0e5d.yaml
    - ledger/decisions/DEC-20260922-0397f8.yaml
    - ledger/questions/RQ-DREG-d7b6d6.yaml
  constraints:
    - Do not edit the specification. A protocol change is an amendment.
    - Do not rerun the prime-field m=3 neighbor screen as the result.
    - Do not call a timeout an exploded degree.
    - Do not edit GOAL-DREG-001. This question has no goal head.
    - Write only under experiments/EXP-DREG-dd668d/runs/.
    - Mint the run id with tools/allocate_id.py --next run --area DREG and --check it.
  deliverables:
    - experiments/EXP-DREG-dd668d/runs/<RUN-ID>/metrics.json
    - experiments/EXP-DREG-dd668d/runs/<RUN-ID>/report.md
    - experiments/EXP-DREG-dd668d/runs/<RUN-ID>/manifest.yaml
    - experiments/EXP-DREG-dd668d/runs/<RUN-ID>/certificates.json
  artifact_paths:
    - experiments/EXP-DREG-dd668d/runs/
  write_scope:
    - experiments/EXP-DREG-dd668d/runs/
  archived_by: TASK-20260922-cc9327
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: null
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
    - metrics.json contains exactly one outcome_label from the specification
    - r(d) for d <= 4 is present for every finished ideal, or the label is unmeasured
    - certificates.json records the homomorphism checks or the failed certificate
    - no claim of an ECDLP exponent appears in report.md
  dispatch_preconditions:
    - >-
      TASK-20260922-cc9327 has committed this handoff, the hypothesis, the
      specification, and DEC-20260922-0397f8. Launch against uncommitted
      specifications is forbidden.
    - RQ-DREG-d7b6d6 has no goal head, so no goal-lane claim is required. Do not open a lane on GOAL-DREG-001.
  return_format: >-
    The outcome_label, the primary max absolute rank difference, gl_check_passed,
    and the paths of the four artifacts.
