handoff:
  id: TASK-20260913-495fcc
  from: coordinator
  to: executor
  goal_ids: [GOAL-SEMBIN-5078bc]
  batch_id: BATCH-SEMBIN-20260913-9d649f
  experiment_id: EXP-SEMBIN-db9bc3
  hypothesis_id: H-SEMBIN-4a80f3
  approval_decision: DEC-20260913-d02263
  archived_by: TASK-20260913-a10007

  objective: >-
    Reduce the uncertainty in what Nagao ePrint 2015/984's Theorem 1 actually costs.
    The source states O(n^{8w+1}) over F_{2^n} under the first fall degree assumption,
    calls itself a polynomial-time algorithm, and supplies no table, no timing and no
    measurement of any kind while warning that its own o(1) is HUGE at normal input
    sizes. Execute EXP-SEMBIN-db9bc3 exactly as frozen and return observations.

  inputs:
    - >-
      experiments/EXP-SEMBIN-db9bc3/specification.yaml -- the frozen contract, version
      1, approved by DEC-20260913-d02263. Seven arms: C, R, N, K, P, M, I. Run ARM C
      FIRST and ARM R SECOND; ARM R is a hard gate and no later cell is reported if it
      fails.
    - >-
      inputs/NAGAO-2015-984/paper_fulltext.md (sha256
      337fae555450162e56432ee137d0cb4bb20e2bd901c29f69b38a2f949e913218) -- Theorem 1,
      Lemma 2, Section 6, Section 7, Propositions 2 and 5. Verify the sha256 before
      reading; a mismatch is a stop.
    - inputs/SEMAEV-2015-310/paper_fulltext.md and tables.yaml
    - >-
      COST-SEMBIN-8d123b as superseded in scope by DEC-20260913-74e208 and CORRECTED by
      CORR-20260913-53739b. ARM R reproduces the CORRECTED figures. The uncorrected ones
      are not the target and reproducing them is a failure.
    - >-
      EV-SEMBIN-71e5cd O-6 and O-7 -- read these before writing the baseline charge.
      They record that charging vOW the memory of a 2^30-point store and the time of one
      processor overcharges it by exactly 29.0 bits at n = 283, 310, 409 and 571 alike,
      and that correcting it moves the crossover 85 in n. Charge vOW at the Pareto
      minimum of T = W(1/M + 1/w), Mem = 3n max(w, M).
    - >-
      H-SEMBIN-97ea23 and experiments/EXP-SEMBIN-2c40bb/specification.yaml -- the
      committed omega set and metric set, reused unchanged.

  constraints:
    - >-
      ARM C RUNS FIRST AND ITS RESULT IS REPORTED WHATEVER IT SAYS. It derives the C_0
      lower bound implied by Nagao's own no-empty-coset parenthesis. If it shows C_0
      must grow with n, Theorem 1's "fix k = C_0 a small natural number" is unavailable
      and every later arm is costing a parameter regime the source cannot use. Report
      that, run the later arms anyway, and flag their premise as contested by ARM C. ARM
      C does NOT void them.
    - >-
      ARM R IS A HARD GATE. Reproduce the corrected Semaev figures cell for cell to 1e-3
      bits with your own code before reporting any Nagao cell. If it fails: stop, report
      an implementation failure, and do NOT tune the pipeline until it agrees. A failed
      reproduction is not evidence about Nagao (core rule 5).
    - >-
      NEVER REPORT A SINGLE CROSSOVER NUMBER. Crossovers are a surface over
      (omega, C_0, metric, monomial-count reading). The parent contract's own
      framing-failure condition fired on exactly this (EV-SEMBIN-71e5cd O-9) and this
      contract is designed around it.
    - >-
      NEVER SELECT A C_0. Every cell is reported across the whole declared range, with
      each cell flagged for whether its C_0 satisfies ARM C's bound. Values violating it
      are computed and flagged, not dropped.
    - >-
      EVERY ABSORBED TERM IS ITS OWN COLUMN. T1 monomial count, T2 linear-algebra
      exponent, T3 coset constant, T4 inverse yield, T5 memory. Report the sum AND the
      parts; a total alone is not a deliverable, because the whole point is which terms
      the source absorbed.
    - >-
      ARM I IS BLIND. Write the independent memory-term implementation from the statement
      of the quantity and the parameters alone -- C(N+4,4) at N = n(m-1), m = n/C_0 --
      WITHOUT reading ARM N's implementation or any ARM N output. This exists because
      TASK-20260913-ec11c4's disagreement in the parent round traced to the review plan's
      own parameter block giving a row width where it said variable count, which no
      recomputation from the producer's artifacts could have caught. If you cannot derive
      the quantity from its statement alone, THAT IS THE FINDING and you report it.
    - >-
      MEMORY BESIDE TIME AT EVERY CELL. The source never mentions memory and
      H-SEMBIN-4a80f3 C2 says memory is where the bound dies.
    - >-
      OBSERVATIONS ONLY. You do not move a hypothesis status, do not write an evidence
      record, do not write a decision, and do not promote anything to the knowledge
      corpus. If a cell appears to show Nagao beating vOW at a FIPS label under a
      memory-charging metric, RECORD IT PLAINLY AND FLAG IT for the escalation the
      contract declares -- review-breakthrough at max effort, non-degradable, core rule
      12 -- and do not characterise it as a result.
    - >-
      NO STATEMENT ABOUT ANY CURVE'S SECURITY, at any outcome. Every deliverable carries
      the contract's explicit affected-versus-safe scope statement.
    - >-
      ARM C's exact enumeration stops at the largest (n, k) that fits 2 GB. An unreached
      cell is a recorded scope limit of the enumeration and never a statement about coset
      occupancy at that n.
    - >-
      Retain raw outputs and failed attempts. A failed attempt that was fixed is part of
      the record.
    - >-
      Write only inside your write_scope. Do not edit the specification, any ledger
      record, or any other experiment's directory.

  run_id: RUN-SEMBIN-251fd3
  write_scope:
    - experiments/EXP-SEMBIN-db9bc3/code/
    - experiments/EXP-SEMBIN-db9bc3/runs/RUN-SEMBIN-251fd3/

  deliverables:
    - >-
      c0-lower-bound.json (ARM C) -- the closed form, the bound at each (n, p), the
      exact enumeration counts, the random-subset null counts, and the comparison
    - >-
      reproduction.json (ARM R) -- cell-wise reproduction of the corrected Semaev
      figures and the degenerate-slice check, with the worst error in bits
    - >-
      cost-surface.json and concrete-cost.yaml (ARM N) -- the full surface with T1-T5
      as separate columns, vOW at its Pareto minimum, and crossovers as a surface
    - >-
      known-false-dF5.json (ARM K) -- observed versus predicted rise at d_F = 5
    - >-
      nearby-object-oddchar.json (ARM P) -- the p = 3 and p = 5 exponents from the
      shared code path, with a diff of the paths taken
    - >-
      matched-nulls.json (ARM M) -- free-yield and zero-memory nulls beside the real
      margins, with the differences
    - >-
      independent-memory-term.json (ARM I) -- the blind values and the largest
      cell-wise disagreement in bits
    - raw-result.json, command.txt, environment.json, stdout.log, stderr.log, manifest.yaml
    - a self-test exercising every formula against a hand-checked value
    - >-
      a run report naming explicitly which of H-SEMBIN-4a80f3's P1-P6 held, which
      failed, and which could not be evaluated; and whether the Coordinator's
      preregistered prior in the contract was overturned. The prior expects ARM C to be
      the whole experiment and expects NO time-only crossover below n = 571, against the
      hypothesis's own P2. Say plainly which of the two the arithmetic supports.

  artifact_paths:
    - experiments/EXP-SEMBIN-db9bc3/runs/RUN-SEMBIN-251fd3/manifest.yaml
    - experiments/EXP-SEMBIN-db9bc3/runs/RUN-SEMBIN-251fd3/raw-result.json
    - experiments/EXP-SEMBIN-db9bc3/runs/RUN-SEMBIN-251fd3/c0-lower-bound.json
    - experiments/EXP-SEMBIN-db9bc3/runs/RUN-SEMBIN-251fd3/reproduction.json
    - experiments/EXP-SEMBIN-db9bc3/runs/RUN-SEMBIN-251fd3/cost-surface.json
    - experiments/EXP-SEMBIN-db9bc3/runs/RUN-SEMBIN-251fd3/concrete-cost.yaml
    - experiments/EXP-SEMBIN-db9bc3/runs/RUN-SEMBIN-251fd3/known-false-dF5.json
    - experiments/EXP-SEMBIN-db9bc3/runs/RUN-SEMBIN-251fd3/nearby-object-oddchar.json
    - experiments/EXP-SEMBIN-db9bc3/runs/RUN-SEMBIN-251fd3/matched-nulls.json
    - experiments/EXP-SEMBIN-db9bc3/runs/RUN-SEMBIN-251fd3/independent-memory-term.json

  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false

  budget:
    wall_clock_seconds: null
    memory_gb: 2
    maximum_runs: 1

  completion_gate:
    - ARM C reports both its closed form and its enumeration, with the null beside it
    - ARM R passes at 1e-3 bits per cell, or the run stops and reports an implementation failure
    - ARM N reports every declared cell, or names each unreached cell and why
    - ARM K shows degree sensitivity of the predicted magnitude
    - ARM P returns exponent (6p+2)w+1 and degree 3p+1 at p = 3 and 5 from the shared path
    - ARM M reports both nulls and their differences from the real margins
    - ARM I reports an independent value per p = 2 memory cell, or states the quantity is
      not derivable from its statement alone
    - every deliverable carries the affected-versus-safe scope statement
    - manifest.yaml records the exact command, git commit and dirty state, environment,
      seeds, resolved inference policy and model, timings and validity status
    - no hypothesis status changed, no evidence record written, no knowledge promoted

  review_plan: null
  review_plan_note: >-
    This handoff opens no review round; it produces observations. The independent review
    of what comes back is a separate task with its own plan, written before any reviewer
    runs, and carries the escalation to review-breakthrough at max effort that the
    contract's claim_tier_and_review block declares.
