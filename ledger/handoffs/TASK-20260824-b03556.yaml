handoff:
  id: TASK-20260824-b03556
  from: coordinator
  to: coordinator
  goal_id: GOAL-DIFFP-84d641
  batch_id: BATCH-f8bf86
  question_id: RQ-DIFFP-a5c483
  objective: >-
    Close BATCH-f8bf86: compose the two sibling-blind reviews into ONE ruling at
    the exact tested scope, score the Coordinator's opening prior item by item,
    file the evidence record EV-DIFFP-b878aa and the closing decision
    DEC-20260824-af6d5c, mint any warranted knowledge entry with the regenerated
    index in the same commit, checkpoint the goal head with exactly one next
    action, and commit under a content_first ledger binding with the
    validate_ledger and check_review_independence outputs recorded verbatim.
  uncertainty_reduced: >-
    Whether this program now holds a checkable notion of differential-path
    novelty for MD5 and SHA-1 -- and, given how much census it could actually
    populate, what the single most valuable next action is: acquisition, an
    equivalence repair, or a bounded search.
  inputs:
    - Both review reports and their attestations, plus the committed review plan they ran under.
    - The snapshot receipt and the paths it binds.
    - >-
      The producer's execution report, census.yaml, equivalence-declaration.yaml
      and null-control-result.json.
    - >-
      coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/batch.yaml -- the
      Coordinator's PRIOR recorded at opening, P-1 through P-5, against which the
      round's findings must be scored explicitly.
    - ledger/goals/GOAL-DIFFP-84d641.yaml, ledger/questions/RQ-DIFFP-a5c483.yaml, experiments/EXP-DIFFP-fe894e/specification.yaml
    - tools/validate_ledger.py, tools/check_review_independence.py, tools/obstruction_registry.py, knowledge/README.md
  constraints:
    - RUNS ALONE, and stages only the declared paths.
    - >-
      ledger/decisions is limited to EXACTLY ONE new file,
      DEC-20260824-af6d5c.yaml. The OPENING decision is a separate minted id
      filed by the driving session at the opening commit and is not this task's
      to write. ledger/evidence is limited to exactly one new file,
      EV-DIFFP-b878aa.yaml.
    - >-
      Merge origin/main before the archive (MERGE, NEVER REBASE), record the base
      and outcome, push and refresh the PR after.
    - COMPOSE, DO NOT COUNT. A blinded reviewer's verdict covers its own joints only.
    - >-
      SCORE THE RECORDED PRIOR EXPLICITLY, P-1..P-5. A prior the review overturns
      is among the most valuable results available to this program and must be
      recorded as a first-class finding, not absorbed.
    - >-
      DO NOT CLAIM ANY PATH IS NEW, and do not let any NON-MEMBER verdict be
      written or implied as novelty. State the census's completeness beside every
      verdict cited.
    - >-
      CLAIM CEILING IS `analyzed`. Do not round up and do not record `supported`
      on any batch-1 record; say so explicitly rather than leaving it to
      inference.
    - >-
      A failing control, an empty readable census, or an exhausted budget ENDS A
      TASK, NOT THIS GOAL. Preserve exactly one concrete next action on the goal
      head.
    - >-
      BEFORE ANY ADVERSE TRANSITION, secure the strongest checkable refutation
      artifact the result admits -- counterexample certificate, then derivation
      note, then a DECLARED empirical_only basis -- archive it BEFORE the
      decision that relies on it, and record proof_status and proof_refs on the
      evidence record. `reject_scoped` on a single unreplicated empirical-only
      run is forbidden; use `weaken` plus replication.
    - >-
      IF ANY RECORD HERE WEAKENS OR CLOSES ANYTHING, its evidence carries a
      COMPLETE `obstruction` block -- statement about the OBJECT, quantity, value
      with units and error bars, measured_by run ids, scope -- and a
      `resource_check` that was genuinely asked. Prose does not discharge the
      closure gate, and an obstruction measured over a narrower scope than the
      closure asserts is rejected.
    - >-
      FILL knowledge_promotion. An empty `promoted` requires a concrete
      not_warranted reason. A working adjudicator with both controls passing
      warrants a KN-TECH entry recording the census schema, the per-generator
      verification status and the two controls, since the adjudication problem
      recurs for every primitive this program will ever ask "is this new" about.
    - >-
      IF THE ROUND SURFACED SOLVER-VALIDATION WORK rather than difference-space
      adjudication, record the handoff to GOAL-MD5-001 explicitly in next_actions
      rather than absorbing it.
    - >-
      RECORD ONLY CHECKS THIS SESSION ACTUALLY RAN, with verbatim output. Never
      record an attestation, agreement or approval that was not obtained.
  deliverables:
    - >-
      ledger/evidence/EV-DIFFP-b878aa.yaml -- with claim_tier, certificate_refs,
      proof_status and proof_refs, the observations as integers, the boundaries,
      the unresolved confounds, and an obstruction block with its resource_check
      if anything is weakened or closed.
    - >-
      ledger/decisions/DEC-20260824-af6d5c.yaml -- the closing decision, with the
      prior scored item by item, knowledge_promotion filled, the claim ceiling
      stated, and explicit next_actions.
    - >-
      A knowledge entry under knowledge/findings/ or knowledge/techniques/ if
      knowledge_promotion warrants one, plus the regenerated knowledge/INDEX.md,
      in this same commit.
    - >-
      ledger/goals/GOAL-DIFFP-84d641.yaml checkpointed -- current_batch_id,
      latest_verified_commit, and EXACTLY ONE next_action.
    - >-
      ledger-receipt.json -- content_first, with path_sha256, commit and parent,
      merge base and outcome, and both tool outputs verbatim.
  artifact_paths:
    - ledger/evidence/EV-DIFFP-b878aa.yaml
    - ledger/decisions/DEC-20260824-af6d5c.yaml
    - ledger/goals/GOAL-DIFFP-84d641.yaml
    - coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/archives/TASK-20260824-b03556/ledger-receipt.json
