handoff:
  id: TASK-20260810-e5002d
  recorded_at: '2026-08-10'
  from: coordinator
  to: coordinator
  objective: >-
    Coordinator archive act for RECON-20260810-001: stage and commit the audit
    and disposition artifacts produced by TASK-20260810-c64cf0 and
    TASK-20260810-1b82fe, then record the resulting commit sha, parent sha and
    per-path sha256 in this task's archive receipt so the campaign's outputs are
    durable and independently checkable.
  uncertainty_reduced: >-
    Whether the reconciliation campaign's outputs exist as durable, verifiable
    repository state rather than only in a working tree. AGENTS.md "Durable
    research commits": an artifact is not official until a Coordinator archive
    commits it and the dispatcher's post-commit verifier accepts it.
  inputs:
    - AGENTS.md
    - agents/coordinator.md
    - coordination/reconciliation/RECON-20260810-001/tasks/TASK-20260810-c64cf0/
    - coordination/reconciliation/RECON-20260810-001/tasks/TASK-20260810-1b82fe/
  constraints:
    - >-
      ARCHIVE ACT ONLY. Opens no batch, moves no hypothesis or goal status,
      files no evidence, approves no experiment. It commits what the two
      preceding tasks wrote and records what it committed; it does not
      adjudicate their content.
    - >-
      This archive INTRODUCES the paths it declares. CORR-20260802-009 is the
      standing lesson: an artifact swept into an earlier commit can never
      afterwards be bound by the archive meant to bind it. Do not let the
      audit or disposition artifacts reach a commit before this one.
    - >-
      Record only shas that a git command actually produced. No reconstructed,
      inferred, or placeholder value, per AGENTS.md core rule 5.
    - >-
      Stage exactly the declared paths. Never `git add -A` in a shared worktree.
  deliverables:
    - archive-receipt.json
  artifact_paths:
    - coordination/reconciliation/RECON-20260810-001/archives/TASK-20260810-e5002d/archive-receipt.json
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 900
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
    - The declared audit and disposition paths are committed, and the receipt records commit_sha, parent_sha and path_sha256 for each.
    - Every sha in the receipt came from a git command that was actually run.
    - No path outside the declared set was staged by this act.
  return_format: >-
    YAML terminal verdict ARCHIVED | FAILED with commit sha, parent sha, and the
    exact paths bound.
