handoff:
  id: TASK-20260905-6d5c9c
  from: coordinator
  to: red-team
  goal_id: GOAL-SSI-001
  batch_id: BATCH-79a0cb
  task_card: coordination/goals/GOAL-SSI-001/batches/BATCH-79a0cb/tasks/TASK-20260905-6d5c9c/task_card.yaml
  objective: >-
    Try to falsify the drafted superseding protocol amendment at
    coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/tasks/TASK-20260905-28c89d/protocol_amendment_draft.yaml
    and the package it rests on, on joints R1 through R4 of
    coordination/goals/GOAL-SSI-001/batches/BATCH-79a0cb/review_plan.yaml:
    whether there is a reading of experiments/EXP-WESOVOW-001/specification.yaml
    on which lines 39-40 are NOT a defect at all; whether any further check in
    that package cannot fail, starting from the one that provably cannot;
    whether the C3 corroboration is stated correctly both in the producer's
    original form and in the corrected form DEC-20260905-5f5592 adopted; and
    whether the amendment addresses the category question in the adopted narrow
    form, carries no transcription premise, states what an `off_curve` anchor
    licenses, and does NOT widen beyond the defect it repairs.
  uncertainty_reduced: >-
    Whether the campaign's oldest adverse finding survives an adversarial
    READING rather than a further check of its algebra, and whether the drafted
    repair is safe to enact against a frozen contract - which is the precondition
    DEC-20260905-5f5592 names for approving it and which BATCH-752ef2's single
    reviewer was not asked to supply.
  inputs:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-79a0cb/review_plan.yaml - joints R1-R4 and the proves-too-much control are all yours
    - experiments/EXP-WESOVOW-001/specification.yaml, READ-ONLY, read by you in full and not through anyone's excerpts
    - The snapshot-bound BATCH-752ef2 package under tasks/TASK-20260905-28c89d/ - amendment draft, defect reproduction, category and licensing analysis, amendment_controls.py and its report; IMMUTABLE and READ-ONLY
    - coordination/goals/GOAL-SSI-001/batches/BATCH-752ef2/reviews/TASK-20260905-4098fd/validation_report.yaml - blindness is deliberately lifted for you and you must declare that you read it
    - ledger/decisions/DEC-20260905-5f5592.yaml, DEC-20260904-4c81b6.yaml, DEC-20260904-166ab5.yaml and ledger/evidence/EV-SSI-2aaf6f.yaml
    - A scratchpad OUTSIDE the repository, for every script you write and run
  constraints:
    - Independent session, review-adversarial, xhigh. Report on YOUR joints and do not return a whole-claim verdict on enactability; the Coordinator composes. Copy the four joint names verbatim into joints_owned.
    - A verdict of `holds` is a fully acceptable outcome and is contracted as one in advance. The defect has been reproduced by two routes in two sessions and corroborated twice from outside the frozen file. If you search hard and find nothing, say so plainly and record how you searched. Do not manufacture an objection to make the pass look productive; rate severities honestly, including informational.
    - Reading order, binding, for R1 only, and it is NOT a blind phase - nothing is forbidden to you at any time. Read specification.yaml yourself, the whole file, and write your own reading of lines 39-40 against controls C3 and C4 before opening TASK-20260905-28c89d/defect_reproduction.yaml. Record that you did it in that order, or record honestly that you did not.
    - Record at least one concrete objection per owned joint, or state for that joint that you searched and found none and exactly how. A joint answered by restating the producer or the first reviewer is an uncovered joint.
    - Say per joint what you did NOT accept from the first reviewer's report. Your agreement with F-1, F-3 and F-7 is not independent of it; reproduce each yourself before agreeing, and if your round consists entirely of re-confirming existing F-numbers, say so.
    - Run the package's own control code against inputs you construct, pattern by pattern. Import amendment_controls.py as a module into a scratch script outside the repository and call AC-1 through AC-4 and the scan helpers directly. Do not accept a prose claim that a failure branch is reachable.
    - Do not fix anything, and especially not the one-character F-1 fix. Everything under BATCH-752ef2 is snapshot-bound by commit 2eef128634f23971727626c3974808fa27026987, is immutable, and is the object under attack. The fix is CF-13 and belongs to whoever next holds that file open under a task that may write it.
    - Read-only, absolutely, on experiments/ and inputs/. Do not edit specification.yaml - not one line, not a comment, not a reformat. Do not execute cost_model.py ever, with or without WESOVOW_RAW_PATH set; its default output path names a committed run directory (CF-10).
    - maximum_runs bounds executions of experiment code, producer implementations and anything that writes a run record; your own scratch scripts, including one that imports amendment_controls.py, are not runs (DEC-20260904-166ab5 PD-4). This batch authorizes zero new experiment runs.
    - Run the proves-too-much control on all five declared objects including the positive control, and report what each procedure actually did on each. A pass where the conclusion is known false is a BREAK, not robustness.
    - If you conclude the defect does not reproduce, record it precisely and in full and stop investigating it: it contradicts EV-SSI-2aaf6f at strength `replicated` and requires review-breakthrough at max, which this environment cannot serve. The round halts on that object and the Coordinator decides.
    - Restate the citation prohibition and its predicate extension verbatim, lift neither, and state whether either fired on the package and on your own report. If an attack would require computing a corrected crossover, the output is the statement that it would, never the value. You may recommend; a recommendation is not a decision.
    - Do not restate any PAPER_PAIRS value or EV-SSI-5d954c delta anywhere; name them by locator if you must refer to them.
    - Your report is a .yaml file with a top-level review_attestation mapping carrying task_id, joints_owned, sources_read, read_sibling_reports, blind_from_respected and verdict, parseable in full by yaml.safe_load, and the only file in this batch directory carrying that key. Set read_sibling_reports truthfully; blind_from_respected is true because this plan declares no blind_from list; verdict is one of holds, breaks, inconclusive.
    - Network is not required and no conclusion may rest on a retrieval. Use the configured proxy if you check a citation, never disable TLS verification, never unset HTTPS_PROXY, transmit no repository content, and record URL, method and checksum. A model recollection is a `recalled` pointer and is never support.
    - Record your inference provenance honestly - requested policy, adapter-resolved model identifier, self-report if it differs, model_verified and whether a probe was actually run, effort, fallback status - and escalate any divergence rather than absorbing it. Never record a probe or a model identity you did not obtain.
    - This round is session-independent and NOT model-independent; state that in your limitations. Your agreement with the producer or the first reviewer may never be presented as agreement between distinct models.
    - Change no status, write no ledger record, approve no amendment, commit nothing, repair no artifact, and make no security, SQIsign, CSIDH, standardized-parameter, exponent or asymptotic claim in either direction.
    - Never select a provider, backend, endpoint, or model identifier containing Bedrock, case-insensitively.
  deliverables:
    - >-
      red_team_report.yaml carrying your own reading of specification.yaml lines
      39-40 against C3 and C4 with a statement of the order in which you wrote
      it; a verdict per joint from CONFIRMED, CONFIRMED WITH CAVEAT or REFUTED
      for R1-R4; a concrete objection or a recorded failed search per joint; the
      three dissolving readings worked against the file's own text; a
      pattern-by-pattern exercise table for every scanning vocabulary with the
      input built for each and whether it fired; your own check of the C3
      clause-2 entailment and of the corrected monotonicity route; the
      enumeration of every change the amendment makes beyond the defect it names
      with a smaller repair for each you object to; the over-reading paths with
      their quotations; a CF-10 placement recommendation marked as a
      recommendation; your reading of the CF-14 silence; the proves-too-much
      results on all five objects including the positive control; a per-joint
      statement of what you did not accept from the first reviewer; a limitations
      list stating that this review is not model-independent; the citation
      prohibition and predicate extension restated verbatim with whether either
      fired; and a top-level review_attestation with an honest, complete
      sources_read.
    - >-
      runtime_session_receipt.yaml recording requested policy, resolved model
      identifier, self-report if it differs, model_verified and whether a probe
      was run, reasoning effort, fallback status, wall clock used, and an explicit
      statement that no experiment run was executed, that cost_model.py was
      neither executed nor modified, and that nothing under experiments/, inputs/
      or BATCH-752ef2/ was written.
  artifact_paths:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-79a0cb/reviews/TASK-20260905-6d5c9c/red_team_report.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-79a0cb/reviews/TASK-20260905-6d5c9c/runtime_session_receipt.yaml
  joints_owned:
    - R1 the defect reproduction and its scope assumption, attacked as a reading rather than as algebra
    - R2 F-1 and its class - what else in this package is a check that cannot fail
    - R3 F-3, and the corrected C3 route the Coordinator adopted
    - R4 whether the amendment does what an amendment must, without widening beyond the defect it repairs
  blind_from: []
  blind_from_note: >-
    DELIBERATELY EMPTY. This batch declares no blind phase and forbids this task
    no path at any time; the object under attack is exactly what it must read.
    review_plan.yaml blind_rederivation.required is false with its reason, and
    the only ordering requirement is the attested, non-tool-checkable reading
    order on joint R1.
  archived_by: TASK-20260905-e1d527
  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 4200
    memory_gb: 2
    maximum_runs: 4
  completion_gate:
    - Each of R1, R2, R3 and R4 carries its own verdict and its own recorded attack, and none is answered only by restating the producer or the first reviewer.
    - The whole of specification.yaml was read, and the R1 block records your own reading of lines 39-40 against C3 and C4, states whether it was written before the producer's reproduction was opened, and works all three named dissolving readings against the file's own text.
    - Every pattern of every scanning vocabulary in amendment_controls.py was called on an input you constructed, and the report gives the count of patterns, the count exercised, and the identity of every pattern that did not fire.
    - AC-1 and AC-2 were each called on an input constructed to make them return the other answer, and the report says whether their verdicts are entailed by their own construction.
    - The proves-too-much control was run on all five declared objects including the positive control, and what each procedure actually did is reported.
    - R3 records your own check of both the C3 clause-2 entailment and the corrected monotonicity route adopted by DEC-20260905-5f5592, with any missing premise or counterexample written out.
    - R4 enumerates every change the amendment makes beyond the defect it names, with a smaller repair named for each you object to, and gives your CF-10 placement recommendation marked as a recommendation and not a decision.
    - Every finding carries a severity and a target path with a line or key locator, no finding is inflated, and a joint with no finding says so and says how it was searched.
    - Per joint, what you did not accept from the first reviewer's report is stated.
    - Nothing under experiments/, inputs/ or BATCH-752ef2/ was modified and cost_model.py was neither executed nor modified; this is stated with how it was checked.
    - The report is a YAML file that yaml.safe_load parses, with a top-level review_attestation listing the four joint names verbatim, read_sibling_reports declared truthfully, blind_from_respected true, and a verdict of holds, breaks or inconclusive.
    - runtime_session_receipt.yaml records inference provenance including any divergence between the adapter-resolved model identifier and the session self-report, records no probe that was not run, and states that the review is not model-independent.
    - The citation prohibition and its predicate extension are restated verbatim, neither is lifted, and no crossover value, baseline sign, margin or speedup is derived, recomputed, tabulated or cited anywhere.
    - Exactly the two declared artifacts exist at their exact declared paths and nothing else was written into the repository.
  return_format: >-
    A short report naming the four joint verdicts, whether you formed your own
    reading of the contract before opening the producer's, how many scanning
    patterns you exercised and how many fired, the proves-too-much outcomes, your
    single most consequential finding if you have one, and every limitation -
    including explicitly that this review is not model-independent. If you found
    nothing that changes whether the amendment can be enacted, say exactly that.
  review_plan: null
  review_plan_ref: coordination/goals/GOAL-SSI-001/batches/BATCH-79a0cb/review_plan.yaml
  review_plan_note: >-
    The plan is a standalone file at the batch root with a top-level
    `review_plan` mapping and is the single authoritative copy; it is not
    duplicated here, because a plan that exists twice is a plan that can disagree
    with itself. It was written before this round's only producer ran and carries
    the Coordinator's prior in eight numbered elements.
  citation_prohibition_verbatim: >-
    The `P=512` crossover value and its `w=2^80` sign are **NOT
    citation-eligible**. This task does not lift that prohibition. Only a
    committed Coordinator decision on independently reviewed evidence can lift
    it.
  citation_prohibition_predicate_extension_verbatim: >-
    In addition to the retained sentence, a row of any EXP-WESOVOW-001
    reconciliation is NOT citation-eligible when either (a) the two anchors
    disagree in the SIGN of the baseline comparison at that row, or (b) the
    smaller |margin| across the two anchors at that row is below that field
    size's anchor gap |Delta log2 T_full + Delta log2 M / 2|.
