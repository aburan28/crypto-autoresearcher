handoff:
  id: TASK-20260903-5a62de
  from: coordinator
  to: executor
  goal_id: null
  batch_id: null
  batch_id_note: >-
    Assigned by /run-experiment when the execution batch is opened; this
    handoff is authored at approval time under DEC-20260903-93862f.
  experiment_id: EXP-PFDR-fd901a
  hypothesis_id: H-PFDR-09e1b0
  question_id: RQ-PFDR-ae2fba
  battery_position: 1 of 6 (calibration; runs first among the meter-dependent contracts)
  recorded_at: '2026-09-03'
  objective: >-
    Execute the frozen, approved contract EXP-PFDR-fd901a exactly as
    specified: Stage 0 (zero compute) the explicit (2, 2, 3) matrix family
    at D = 4 with the minor-degree bound and content primes; Stage 1 the
    shared F_p meter at arbitrary p with the frozen-fixture agreement on the
    (2, 2, 3), p = 4099 instance (curve seed 1101, target seed 1); Stage 2
    the direct-presentation positive control at B = round(p^{1/2}), p in
    {4099, 16411}; Stage 3 the p-sweep at (2, 2, 3) over p in {4099, the
    largest prime below 2^64, the P-256 prime} with the Semaev, NULL-SUPPORT
    and non-curve-cubic arms, 8 curves x 5 planted targets per (cell, p)
    plus the named P-256 curve, the 256-bit run last; Stage 4 (zero
    compute) the flatness labels, rank-drop rates with binomial intervals,
    the Semaev-minus-null table and the verdict against the frozen
    criteria. Implement under experiments/EXP-PFDR-fd901a/ with
    implementation.md; one immutable run directory per planned run
    (granularity: one prime over all curves, targets and arms; one
    positive-control prime; the fixture check) under
    experiments/EXP-PFDR-fd901a/runs/<run-id>/ carrying manifest.yaml,
    command.txt, environment.json, stdout.log, stderr.log and
    raw-result.json per docs/evidence-and-reproducibility.md; an
    execution_report YAML; observations only, never interpretation beyond
    the contract's own predefined labels.
  uncertainty_reduced: >-
    How much of a toy-scale prime-field degree measurement can be a small-p
    artifact: whether every graded invariant of the (2, 2, 3) Semaev arm is
    identical at the 64-bit and 256-bit primes in at least 38 of 40 draws,
    what the rank-drop rate at p = 4099 is (the artifact budget handed to
    EXP-PFDR-cbdefb and EXP-PFDR-20ee58), whether the instrument sees p at
    all (positive control d_ff 65 and 129), and whether the Semaev and
    support-matched null arms differ by the same integers at both large
    primes. A positive-control failure or a fixture mismatch is an
    instrument outcome, not a falsification.
  inputs:
    - experiments/EXP-PFDR-fd901a/specification.yaml
    - ledger/hypotheses/H-PFDR-09e1b0.yaml
    - ledger/proposals/IDEA-20260903-26aa81.yaml
    - ledger/decisions/DEC-20260903-93862f.yaml
    - ledger/decisions/DEC-20260903-8cdf8d.yaml
    - ledger/questions/RQ-PFDR-ae2fba.yaml
    - harness/macaulay_fp/ (the F_p meter from TASK-20260903-ba41aa, at its verified snapshot commit)
    - harness/macaulay_fp/VALIDATION.md
    - ledger/handoffs/TASK-20260903-ba41aa.yaml
    - ledger/proposals/IDEA-20260808-093497.yaml
    - ledger/proposals/IDEA-20260808-afe4ce.yaml
    - ledger/proposals/IDEA-20260903-e1e38b.yaml
    - docs/evidence-and-reproducibility.md
    - docs/claims-and-verification.md
    - ledger/handoffs/TASK-20260903-5a62de.yaml
  constraints:
    - >-
      DEPENDENCY, BINDING: this contract requires exact F_p ranks and may
      not start before TASK-20260903-ba41aa has returned and its snapshot
      archive receipt has verified. Refuse to start unless
      harness/macaulay_fp/ exists at a committed path with
      tests/test_macaulay_fp.py passing, and record the meter's commit and
      per-file sha256 in every manifest (the contract's invalidation rule:
      a run whose meter has not passed the p = 2 known answer and the
      planted-syzygy control in the same manifest lineage is invalid).
    - >-
      Refuse to start unless experiments/EXP-PFDR-fd901a/specification.yaml
      is status approved with approved_by coordinator at a committed path
      in a verified snapshot archive. A message saying 'approved' is not an
      approval.
    - >-
      The preregistered prediction and every success / falsification
      criterion are read-only; report measured values against them and
      never adjust them. Any needed change is a versioned
      protocol_amendment under experiments/EXP-PFDR-fd901a/amendments/
      requested from the Coordinator, never an edit.
    - >-
      Timeouts, OOM and crashes are failed_infrastructure with the cell
      named; never evidence about p-dependence or the derivation. Censored
      cells are censored, never bounds.
    - >-
      Record every deviation from the contract (including the 2^64 - 59
      primality outcome, rejection counts for curves with fewer than two
      on-curve window x, the named-curve fallback if it fires, and any cell
      not run) in the execution report and the manifest; never silently
      absorb one.
    - >-
      Every planted target carries a certificate re-verified by independent
      point addition; a failing certificate invalidates that draw as
      invalid_measurement, never a rank statement.
    - >-
      No Groebner output degree as a metric; no subset-column rank; no
      timing as evidence; no mixing of planted and unplanted targets in one
      flatness label; every number is an exact graded rank.
    - >-
      No hypothesis, experiment, question or goal status change; no
      evidence record; no claim beyond the contract's outcome labels O1 /
      O2 / instrument outcome as observations.
    - >-
      Write only under experiments/EXP-PFDR-fd901a/; never commit; never
      run git; never edit the specification, any hypothesis, or any other
      record.
    - >-
      Record the requested policy (executor-implementation, medium), the
      resolved model identifier, model_verified and fallback_used in every
      manifest's inference block and in the execution report; no Bedrock,
      no fallback, no degradation.
    - >-
      Seeds exactly as frozen: curve seeds 1101..1108 per prime, target
      seeds 1..5, null seeds 7, 11, 13, 17, 19, positive-control curve seeds
      2101..2103 with target seeds 1..2; frozen fixture curve seed 1101,
      target seed 1 at p = 4099.
  deliverables:
    - experiments/EXP-PFDR-fd901a/implementation.md (what was built, the meter commit used, every convention, every deviation)
    - experiments/EXP-PFDR-fd901a/stage0-derivation.md (the (2, 2, 3) matrix family at D = 4, the minor-degree bound, content primes)
    - one immutable run directory per planned run under experiments/EXP-PFDR-fd901a/runs/<run-id>/ with manifest.yaml, command.txt, environment.json, stdout.log, stderr.log, raw-result.json
    - experiments/EXP-PFDR-fd901a/analysis.md (flatness labels, rank-drop rates with intervals, Semaev-minus-null table, positive-control table, frozen-fixture agreement record, tail checks, censoring table, verdict against the frozen criteria as observation)
    - experiments/EXP-PFDR-fd901a/execution-report.yaml (per-run terminal status, stage-by-stage report, stopping rules triggered, deviations, certificate results, inference block)
  artifact_paths:
    - experiments/EXP-PFDR-fd901a/implementation.md
    - experiments/EXP-PFDR-fd901a/stage0-derivation.md
    - experiments/EXP-PFDR-fd901a/runs/
    - experiments/EXP-PFDR-fd901a/analysis.md
    - experiments/EXP-PFDR-fd901a/execution-report.yaml
  write_scope:
    - experiments/EXP-PFDR-fd901a/
  archived_by: null
  archived_by_note: >-
    The execution batch's snapshot archive task is minted by
    /run-experiment when the batch is opened and stages exactly the
    artifact_paths above. This handoff itself is archived by the approval
    snapshot of DEC-20260903-93862f.
  inference:
    policy: executor-implementation
    reasoning_effort: medium
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 43200
    memory_gb: 8
    maximum_runs: 12
    budget_note: >-
      Copied from the frozen contract: wall_clock_seconds_per_run 3600 x
      maximum_runs 12 = 43200 s, which equals total_cpu_hours 12 at
      maximum_workers 1, so no further bound is needed; memory_gb 8 is the
      contract's maximum_memory_gb. The 256-bit run is the longest and is
      scheduled last inside this envelope.
  completion_gate:
    - >-
      G1: every planned run (3 sweep primes, 2 positive-control primes, the
      fixture check; re-runs only after an infrastructure stop) has a run
      directory with a manifest carrying a terminal status (completed_valid
      | failed_infrastructure | invalid_measurement | censored) and the six
      required files.
    - >-
      G2: raw-result.json and the analysis tables agree (every table value
      is reproducible from the raw per-draw records; no hand-edited
      number).
    - >-
      G3: every control of the contract is present and reported:
      CTRL-FROZEN-FIXTURE, CTRL-POSITIVE-P-DEPENDENCE, NULL-SUPPORT,
      NEARBY-NON-CURVE-CUBIC, CTRL-SECONDARY-DIRECT-FIXED-B,
      CTRL-NAMED-CURVE, and the CTRL-CONFOUNDERS-NAMED statement.
    - >-
      G4: every manifest carries the meter's commit and per-file sha256, the
      commit and dirty-tree hash of the implementation, seeds, parameters,
      timing, peak RSS, per-file sha256 of the run package, certificate
      results, and the inference block.
    - >-
      G5: the execution report is returned with the stopping rules
      triggered (if any), every deviation, and the observed values against
      each frozen criterion stated as observation, not verdict.
    - >-
      G6: nothing outside experiments/EXP-PFDR-fd901a/ was written; no
      record was edited; no status changed.
  return_format: >-
    A short plain-text return listing: the run ids with terminal status;
    the frozen-fixture agreement result; the positive-control d_ff pair;
    per-cell flatness labels and rank-drop rates with intervals; the
    Semaev-minus-null integers at each large prime; any stop rule
    triggered and where; which of G1-G6 are met and which are not, with
    reasons; the inference block values. Observations only; no claim about
    the hypothesis; no summary files outside the write scope.
  review_plan: null
  review_plan_note: >-
    The review round is opened by a later Coordinator handoff after the
    execution snapshot archive; validator and red-team run at
    review-adversarial (xhigh) in independent sessions before any evidence
    record is written.
  id_allocation_provenance: >-
    TASK-20260903-5a62de pre-allocated by the orchestrating Coordinator
    session with tools/allocate_id.py and supplied for this approval step;
    this agent did not allocate identifiers.
  yaml_parse_disclosure: >-
    Written by the Coordinator subagent without an interpreter; every prose
    value is a folded block scalar or a quoted scalar; no tabs; no duplicate
    keys to the author's reading. The orchestrator must run the strict parse
    and tools/validate_ledger.py before relying on this record.
