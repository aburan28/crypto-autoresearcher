handoff:
  id: TASK-20260928-9c44f2
  created_at: '2026-09-28'
  created_by: top-level session running /propose-ideas on user instruction (2026-09-28)
  from: coordinator
  to: idea-generator
  goal_id: null
  batch_id: null
  review_plan_id: null
  title: >-
    Ideation under RQ-PFDR-ae2fba: can algebraic structure in a prime-field
    factor base lower the per-target decomposition exponent below the
    measured generic meet-in-the-middle bound?
  objective: >-
    Return three to five schema-complete, falsifiable proposals (ids reserved
    below) for a structured prime-field factor base, or a relation mechanism
    over one, in the open classes of KN-OPEN-020 (high-degree,
    implicit-membership, or target-dependent descriptions). Each proposal must
    state how it would lower the charged per-target decomposition exponent
    sigma of IDEA-20260808-812554 strictly below the generic
    meet-in-the-middle value, at matched precomputation, and must carry a
    minimal test that runs at toy scale on the existing
    crypto_autoresearcher.index_calculus engine against a matched null.
  uncertainty_reduced: >-
    Whether any factor-base structure in the open classes has a concrete,
    cheaply testable route to a sigma below sigma_MITM = (m-h)/(m-1), or
    whether the three unmeasured items the 2026-09-28 corpus survey found
    (a PKM chained smooth-subgroup presentation with auxiliary power-map
    variables against a matched null; a composed-map base V = W o W'
    (catalogue A2-10); relation rank of any structured geometry) are already
    dominated before compute.
  inputs:
    - ledger/questions/RQ-PFDR-ae2fba.yaml
    - knowledge/findings/KN-FIND-007.md (mean yield is conserved across bases of equal size; only coverage, relation rank, recognizability or solve cost can move)
    - ledger/FINDING-PF-IC-001.md
    - knowledge/open-problems/KN-OPEN-020 (the open classes)
    - ledger/proposals/IDEA-20260801-021.yaml (Bezout line |F| <= Delta; auxiliary variables and implicit membership as the named escapes)
    - ledger/proposals/IDEA-20260808-812554.yaml (the sigma threshold; beating rho needs sigma < 1 - 2/(m-1))
    - ledger/proposals/IDEA-20260808-9ef88c.yaml (coset base x^B = c^B, binomial ideal, FFT solve O~(B^m), still worse than MITM)
    - ledger/proposals/IDEA-20260808-093497.yaml, IDEA-20260830-cb8e46.yaml, IDEA-20260808-da1428.yaml
    - ledger/proposals/IDEA-20260830-84cdb7.yaml and knowledge/findings/KN-FIND-0618ab.md (the digit map; d_ff grows with the digit length)
    - ledger/proposals/IDEA-20260830-f89eaf.yaml and IDEA-20260830-c5c614.yaml (relation rank never measured; the target-subset escape)
    - ledger/proposals/IDEA-20260806-c5d183.yaml, IDEA-20260901-863e36.yaml, IDEA-20260802-002.yaml and knowledge/findings/KN-FIND-ffe1df.md (the object frame)
    - ideas/catalogue-20260805/A2-solving-degree.md (entry A2-10, composed V = W o W') and research/factor_base_lab.md (FB-POLY-IMAGE, FB-MSUBGROUP designs, never executed)
    - src/crypto_autoresearcher/index_calculus/README.md sections 1-5 (the measured generic baseline, below)
    - src/crypto_autoresearcher/index_calculus/{decompose,tails,factor_base,msolve,solver}.py (the engine a minimal test must run on)
    - the index-calculus known-results map, rendered at commit 504debe68 and pasted verbatim into the launch prompt
  constraints:
    - >-
      THE GENERIC BAR IS MEASURED, NOT ASSUMED. The engine's mitm decomposition
      (tails.py) stores every reachable signed h-point sum once per factor base
      and finds each target's decompositions with |F|^(m-h) S_3 solves, i.e.
      sigma_MITM = (m-h)/(m-1), for a table of |F|^h tails. Measured over
      12-32-bit primes on identical curves (README sections 3 and 5): total S_3
      exponents 0.66 (m=3), 0.75 (m=4), 0.60 (m=5), 0.68 (m=6), 0.58 (m=7)
      against the model max(h, m-h+1)/m, and Pollard rho's walk 0.51. Every
      proposal states its own sigma and its own precomputation exponent, and a
      proposal that does not beat sigma_MITM at matched precomputation is inside
      the generic class and says so.
    - >-
      OBJECT FRAME. Every candidate is a PAIR (representation of the point,
      operation set Sigma the tracked object must survive). Name both
      explicitly in `mechanism`. Sigma must not be the full translation action,
      which is closed for lossy objects by IDEA-20260806-c5d183 and
      KN-FIND-ffe1df Theorem C; if Sigma contains the full translation action,
      the candidate is a branching object and must say so. Index calculus is
      Class I, partial-action (translation by factor-base elements only).
    - >-
      TRICHOTOMY. Place each candidate in exactly one class of
      IDEA-20260806-c5d183 -- partial-action, branching, or
      coordinate-dependent -- and give the one-line reason in `mechanism`.
      A candidate that cannot be placed is returned as `unverified` with the
      obstruction named, not silently dropped.
    - >-
      LOSSY-PROJECTION TEST, AGAINST THE NAMED OPERATION SET. Per
      docs/inventor-protocol.md section 2 and IDEA-20260901-863e36: state what
      the projection discards, show the discard is compatible with Sigma (a
      block system of <Sigma>, or a stated branching bound), and show it is
      lossy in the representation actually used. A projection that loses
      nothing is a change of coordinates and is not returned.
    - >-
      MEAN YIELD IS FIXED. KN-FIND-007: at matched size every base has the
      same mean decomposition yield. A proposal that promises higher mean
      yield is refuted on sight; argue coverage, relation rank,
      recognizability, or solve cost, and name which.
    - >-
      OFF-LIMITS AS PRIMARY LENS: families F1-F7 of IDEA-20260802-002, plus the
      lane-specific closures: every bounded-degree target-independent
      algebraic factor base (KN-OPEN-020, IDEA-20260801-021); interval / small-x
      and the six geometries of EV-FBG-001; automorphism and endomorphism
      orbit folding (H-STR-002, IDEA-20260727-001, constants at most 9x);
      isogeny transport and pooling (H-ISO-001, IDEA-20260808-031a59,
      EV-ENDO-10109d); the monolithic coset base x^B = c^B solved by FFT
      (IDEA-20260808-9ef88c); the digit map (KN-FIND-0618ab). A candidate that
      uses one as a component names it and states what is added.
    - >-
      FACTOR-BASE ESCAPE. Any candidate factor base or relation mechanism must
      say which of the KN-OPEN-020 open classes it belongs to -- high-degree,
      implicit-membership, or target-dependent description -- and charge
      description, membership, relation, descent, time and memory costs, or
      declare itself inside the scoped-out class and stop.
    - >-
      REPRESENTATION CLASS. Name the R1/R2/R3 class of RQ-ECDLP-623a32 the
      representation belongs to, and the attack stage (factor-base membership,
      relation decomposition, collision structure, linear algebra) whose
      charged cost it claims to change. Kummer-line and degree-d-function-on-E
      representations are closed at model lever 1 and are not returned.
    - >-
      PROOF SEARCH MAP before any compute (docs/inventor-protocol.md section 8):
      exact bottleneck, baseline embedding (for this lane the embedding is
      sigma_MITM: the proposal must reduce to the mitm engine at a named
      parameter), observation collision, quantifier order, method ceiling with
      a nearby-object control (a random base of the same size and the same
      description cost where one exists).
    - >-
      MINIMAL TEST ON THE EXISTING ENGINE. The minimal test is a toy-scale
      cell (log2 p 12..32) that the executor can build on
      crypto_autoresearcher.index_calculus without a new solver, reporting the
      proposal's per-target S_3-equivalent cost next to the mitm engine's on
      the same curves, bases and targets, with a matched random-base null and
      Pollard rho as the cost control. Mean-yield and degree readings without a
      matched cost reading are half-cells (RQ-PFDR-ae2fba constraint 2).
    - >-
      HONEST ACCOUNTING. Novelty `unverified` unless checked against knowledge/
      and ledger/hypotheses/; `dominated_by` and `sota_delta` per
      docs/inventor-protocol.md section 5; `target_complexity` with exponents;
      `heuristic_assumptions` each with a validation route; a `prior_art`
      block positioned against the pasted map rows (at least KR-IC-5931ee,
      KR-IC-5a43e5, KR-IC-73db3f, KR-IC-b0fcda). A session that returns no
      candidate still returns the section 5 block, and a closure meets the
      section 4 standard or is recorded as `unverified`.
    - >-
      NO COMPUTE, NO STATUS CHANGE. Proposals only; no experiment, hypothesis,
      or approval; do not edit or write any existing record. Return the idea
      YAML in the final report; the top-level session files it.
  deliverables:
    - >-
      Three to five idea records in the schema of agents/idea-generator.md
      "Required output", each under one of the reserved ids
      IDEA-20260928-ce3ab0, IDEA-20260928-4e2be7, IDEA-20260928-fd7f5d,
      IDEA-20260928-e6677c, IDEA-20260928-6a4e1b, with a prior_art block and the
      docs/inventor-protocol.md section 5 accounting.
    - A recommended first test, naming the idea and why it is the most
      decision-changing per unit cost.
