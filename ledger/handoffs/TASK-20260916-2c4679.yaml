handoff:
  id: TASK-20260916-2c4679
  from: coordinator
  to: coordinator
  role: coordinator
  kind: archive
  archive_kind: snapshot
  batch_id: BATCH-94168f
  goal_id: GOAL-ICPERF-e6b6a4
  experiment_id: EXP-ICPERF-2f2e40
  recorded_at: '2026-09-16'
  state: queued
  depends_on:
    - TASK-20260916-3355fc

  title: >-
    EXP-ICPERF-2f2e40 producer snapshot: commit and push the executor's code
    tree, read declaration and single run directory in one isolated commit,
    verify the receipt against Git, and refresh the PR -- BEFORE any
    independent reviewer reads them

  objective: >-
    Make TASK-20260916-3355fc's output DURABLE AND FROZEN before any reviewer
    opens it. AGENTS.md "Durable research commits": a snapshot commit follows a
    producer and commits its exact implementation and run artifacts BEFORE an
    independent agent reviews them, and a run package is not official until the
    dispatcher's post-commit verifier accepts it. Until this card completes,
    the enumerator and its tables are an unowned working-tree artifact: if the
    session dies they are not evidence at all, and if they change under a
    reviewer's feet the review is of bytes nobody archived.

  uncertainty_reduced: >-
    None. An archival act measures nothing, runs nothing, and interprets
    nothing. It converts an observation into a citable one.

  why_exactly_one_archival_task: >-
    AGENTS.md "Durable research commits": every run receipt and implementation
    tree is assigned to EXACTLY ONE archival task. This card owns
    TASK-20260916-3355fc's three artifact subtrees and nothing else. No other
    task in any lane of GOAL-ICPERF-e6b6a4 stages them.

  why_snapshot_and_not_ledger: >-
    Because no evidence record exists yet and no status moves here. A LEDGER
    archive binds evidence, decision and hypothesis-status records and precedes
    an official transition; this commit precedes INDEPENDENT REVIEW. The ledger
    archive for EXP-ICPERF-2f2e40 is owed later -- after the review round
    described in TASK-20260916-3355fc's review_plan_note has run and the
    Coordinator has composed its verdicts -- and it will be a separate card
    with identifiers this lane does not hold.

  inputs:
    - path: coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-94168f/tasks/TASK-20260916-3355fc/receipt.json
      role: >-
        THE EXECUTOR RETURN RECEIPT. Read it FIRST: it confirms RUN-ICPERF-36a173
        and the exact list of files written under write_scope, which this card
        stages and hashes into path_sha256 alongside the producer's declared
        artifact_paths.
    - path: ledger/handoffs/TASK-20260916-3355fc.yaml
      role: the producer card whose deliverables this archive owns
    - path: experiments/EXP-ICPERF-2f2e40/specification.yaml
      role: READ ONLY, already committed by TASK-20260916-ec9948; NOT staged and NOT edited by this card
    - path: ledger/decisions/DEC-20260916-a91144.yaml
      role: READ ONLY, already committed by TASK-20260916-8d493b; the dispatch decision

  constraints:
    - >-
      RUN THIS ARCHIVE ALONE. No concurrent worker commits into this worktree
      while it runs. Workers do not commit into a shared worktree, and commit
      tasks run alone (AGENTS.md "Durable research commits").
    - >-
      STAGE ONLY THE DECLARED PATHS. A scope-expanding commit is an
      evidence-integrity failure, not a convenience, and it BLOCKS the review
      it exists to enable. In particular do NOT stage
      experiments/EXP-ICPERF-2f2e40/specification.yaml (already committed and
      byte-frozen), ledger/goals/GOAL-ICPERF-e6b6a4/goal.yaml, anything under
      coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-a33cda/,
      coordination/review/icperf-20260915-a33cda/,
      experiments/EXP-ICPERF-e21835/, experiments/EXP-ICPERF-13f001/ or
      experiments/EXP-ICPERF-66fd51/.
    - >-
      BEFORE COMMITTING: fetch origin/main and MERGE it into
      claude/index-calculus-graph-dag-3linyk. MERGE, NEVER REBASE -- rebasing a
      branch that carries pushed run records rewrites the commits those records
      were archived in, and a run receipt whose commit no longer exists is not
      reproducible. Re-run `tools/validate_ledger.py` on the merged tree.
      Record the base commit checked and the merge outcome in the receipt.
      Also run `python3 tools/merge_digest.py --since $(git merge-base HEAD
      origin/main) --until origin/main` and note anything it reports about
      GOAL-ICPERF-e6b6a4.
    - >-
      A SYNC CONFLICT INSIDE AN IMMUTABLE RECORD OR A RUN ARTIFACT IS NEVER
      RESOLVED BY PICKING A SIDE. STOP and create a superseding record under a
      new identifier. Never edit either side, and never edit a run artifact to
      make a merge clean.
    - >-
      DO NOT EDIT, TIDY, REFORMAT, REGENERATE OR "FIX" ANY PRODUCER ARTIFACT.
      The code tree, the read declaration and the run directory are frozen
      exactly as the executor left them, INCLUDING a partial run, a declared
      invalid run, an anomaly, or a stopping rule that fired. An archive that
      improves what it archives has destroyed the thing it was archiving.
    - >-
      ARCHIVE AN INVALID OR PARTIAL RUN EXACTLY AS READILY AS A CLEAN ONE. If
      READ_DECLARATION.json reports a forbidden path, if C-RECON disagreed, if
      the watchdog checkpointed the task, or if every candidate cell was
      refused -- COMMIT IT ANYWAY and say so in the receipt. Those artifacts
      are the evidence for whatever the Coordinator decides next, and an
      unarchived invalid run is an unexplained gap rather than a clean record.
    - >-
      DO NOT INTERPRET. This card records what was committed. It assigns no
      evidence strength, composes no evidence record, and changes no status --
      EXP-ICPERF-2f2e40 stays `approved` and H-ICPERF-afe62e stays where it is.
    - >-
      MINT NO IDENTIFIER. Every identifier in this package was pre-allocated
      and --check verified, except the executor's RUN-ICPERF-<tok>, which the
      executor minted with the allocator and recorded. Verify that RUN id
      matches `^RUN-[A-Za-z0-9._-]+$` with a six-hex suffix and appears in the
      executor's receipt; if a NEW record turns out to be needed, STOP and
      request an identifier.
    - >-
      AFTER COMMITTING: push the branch and open or refresh the PR against
      main, naming the new records (the RUN id, EXP-ICPERF-2f2e40's code tree,
      and TASK-20260916-2c4679). A record that exists only in a local commit is
      unpublished and downstream review must not treat it as durable evidence
      (agents/coordinator.md "Branch and PR discipline").
    - This card launches no trial and is not a /run. It executes no experiment and writes no experiment implementation code.

  deliverables:
    - One isolated commit containing exactly the declared artifact_paths and nothing else.
    - >-
      coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-94168f/archives/TASK-20260916-2c4679/snapshot-receipt.json
      per templates/research-records.md "Coordinator archive receipt": kind
      snapshot, source_task_ids [TASK-20260916-3355fc], commit_sha, parent_sha,
      path_sha256 for EVERY file under the three subtrees (enumerated, not
      globbed), and record_ids including the minted RUN id and EXP-ICPERF-2f2e40.
    - A post-commit verification of that receipt against Git, reported pass or fail with its exact message.
    - >-
      A one-paragraph ARCHIVE NOTE in the receipt stating, without
      interpretation: whether the run completed or was checkpointed, whether
      READ_DECLARATION.json reports any forbidden path, and whether C-RECON
      agreed or disagreed. This is a pointer for the reviewer, not a verdict.
    - The pushed branch and an open or refreshed PR against main naming the records.
    - The origin/main base commit checked and the merge outcome, in the receipt.

  artifact_paths:
    - coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-94168f/archives/TASK-20260916-2c4679/snapshot-receipt.json
  artifact_paths_note: >-
    Archive task owns the receipt path only (BATCH-a33cda pattern). The
    producer's declared exact artifact_paths — including
    runs/RUN-ICPERF-36a173/ schema files — are bound via archive.source_task_ids
    and completed path_sha256. write_scope still covers the three producer
    subtrees for staging. RUN-ICPERF-36a173 is pre-minted on TASK-20260916-3355fc.

  also_staged_sha256:
    - coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-94168f/dispatch_queue.json
  also_staged_note: >-
    The queue is committed in the same commit but is NOT hash-bound as an
    artifact_path, for the fixed-point reason BATCH-a33cda recorded against
    TASK-20260915-1942e2 and TASK-20260916-ec9948 repeats: a queue file that
    records this task's own state transition cannot have its post-commit bytes
    declared before the commit that changes them. Three archival cards in this
    batch therefore each also-stage this one evolving coordination file. That
    is an overlap in the staging set and not a concurrency hazard, because
    archive commits run ALONE and strictly in sequence (ec9948, then 8d493b,
    then this card); it is recorded here rather than left for a reader to trip
    over.

  archived_by: TASK-20260916-2c4679
  archived_by_note: >-
    SELF-OWNED FOR ITS OWN RECEIPT, WHICH IS CORRECT AND NOT A LOOP: the only
    task that can stage this card's receipt in the same isolated commit as the
    package it archives is this one. This mirrors TASK-20260916-ec9948 and
    TASK-20260915-6d72a0 before it.
  this_record_archived_by: TASK-20260916-8d493b
  this_record_archived_by_note: >-
    The card RECORD itself (this file) is archived by TASK-20260916-8d493b
    BEFORE TASK-20260916-3355fc is dispatched -- because `archived_by` must be
    bound on the producer card before dispatch, and a binding that points at an
    uncommitted card is a promise rather than a binding.

  write_scope:
    - experiments/EXP-ICPERF-2f2e40/code/
    - experiments/EXP-ICPERF-2f2e40/runs/
    - coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-94168f/tasks/TASK-20260916-3355fc/
    - coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-94168f/archives/TASK-20260916-2c4679/
    - coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-94168f/dispatch_queue.json
  write_scope_note: >-
    The first three are STAGING scope, not authoring scope: this card commits
    those bytes and never authors or alters them. The fourth is the only path
    this card AUTHORS. The fifth is the queue state transition.

  read_scope:
    - ledger/
    - experiments/EXP-ICPERF-2f2e40/
    - coordination/goals/GOAL-ICPERF-e6b6a4/
    - templates/research-records.md
    - AGENTS.md
    - agents/coordinator.md

  not_in_scope:
    - experiments/EXP-ICPERF-2f2e40/specification.yaml
    - ledger/goals/GOAL-ICPERF-e6b6a4/goal.yaml
    - coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-a33cda/
    - coordination/review/icperf-20260915-a33cda/
    - experiments/EXP-ICPERF-e21835/
    - experiments/EXP-ICPERF-13f001/
    - experiments/EXP-ICPERF-66fd51/
    - experiments/EXP-ICPERF-025a52/
    - ledger/hypotheses/H-ICPERF-5f038b.yaml
  not_in_scope_reason: >-
    specification.yaml is already committed by TASK-20260916-ec9948 and is
    byte-frozen; restaging it would double-own a record and change nothing.
    goal.yaml and the next four belong to BATCH-a33cda, where another session
    held an unreleased claim (TASK-20260915-abf147) when this card was written.
    EXP-ICPERF-66fd51 is the frozen predecessor whose bytes ARE the evidence
    for this goal's defect claims. The last two belong to the descent-as-a-DAG
    lane, which a third session may resume without this one being told.

  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false

  budget:
    wall_clock_seconds: 2700
    memory_gb: 2
    maximum_runs: 0
  budget_note: >-
    NO FIELD IS NULL, so this card is not self-rejected by the Coordinator's
    own budget rule. `maximum_runs: 0` is a HARD scientific constraint rather
    than an estimate: an archival task performs no trial, and a card that
    archives a run must never be the card that reruns it. wall_clock_seconds
    and memory_gb are advisory machine-protection figures; 2700 is larger than
    TASK-20260916-ec9948's 1800 because this archive hashes a full run
    directory including multi-million-entry tables, not nine small YAML files.

  dispatch_preconditions:
    - id: DP-1
      condition: >-
        TASK-20260916-3355fc has RETURNED and its receipt exists at
        coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-94168f/tasks/TASK-20260916-3355fc/receipt.json,
        naming the minted RUN id and the files written. This card's artifact
        subtrees cannot be resolved to a file set without it. A task becomes
        eligible only after every dependency has a `completed` receipt.
      binds: the dispatching session, before launch
    - id: DP-2
      condition: >-
        The executor's lane claim on TASK-20260916-3355fc has been RELEASED
        with its outcome (`tools/goal_lanes.py release ... --outcome ...`), and
        no other task is writing this worktree. Archive commits run ALONE.
      binds: the dispatching session, before launch
    - id: DP-3
      condition: >-
        origin/main has been fetched and MERGED into
        claude/index-calculus-graph-dag-3linyk (merge, never rebase), and
        `tools/validate_ledger.py` reports no NEW errors on the merged tree.
      binds: the dispatching session, before launch
    - id: DP-4
      condition: >-
        Every file under the three artifact subtrees exists with its final
        content, and no not_in_scope path is dirty. In particular
        experiments/EXP-ICPERF-2f2e40/specification.yaml must be BYTE-IDENTICAL
        to its committed state; if it is not, STOP -- the executor wrote
        outside its scope and that is a finding, not something to stage.
      binds: the dispatching session, before launch
      standing: true
    - id: DP-5
      condition: >-
        A lane claim is HELD on GOAL-ICPERF-e6b6a4 for TASK-20260916-2c4679
        (`tools/goal_lanes.py`), after `git fetch`, respecting `max_concurrent`
        2, and released on return.
      binds: the dispatching session, before launch
      standing: true
    - id: DP-6
      condition: >-
        NO REVIEWER HAS BEEN LAUNCHED ON THIS PRODUCER'S OUTPUT. The whole
        point of a snapshot archive is that it precedes independent review; a
        reviewer launched first reads bytes nobody has frozen, and its
        attestation names a state that may no longer exist.
      binds: the dispatching session, before launch
  dispatch_preconditions_note: >-
    AGENTS.md "Dispatch preconditions bind the DISPATCHER, not the agent":
    these six bind the SESSION DOING THE LAUNCHING and must be satisfied BEFORE
    launch, not discovered afterwards, and they are not waived by the work
    turning out fine. Read the whole card before dispatching.
    CORR-20260915-6708e4 records a violation of exactly these on this goal's
    other lane, caught by the dispatched agent rather than by the dispatcher.

  completion_gate:
    - The commit exists, is reachable from HEAD, and has the expected parent.
    - The commit changes EXACTLY the files under the three declared artifact subtrees plus the one also_staged path, and nothing else.
    - Every file under those subtrees appears in the receipt's path_sha256 map, enumerated individually, and every hash matches the committed tree.
    - The receipt's record_ids name the minted RUN id, EXP-ICPERF-2f2e40, TASK-20260916-3355fc and TASK-20260916-2c4679.
    - The commit message names TASK-20260916-2c4679, TASK-20260916-3355fc, EXP-ICPERF-2f2e40 and the RUN id.
    - The receipt records the origin/main base commit checked and the merge outcome.
    - >-
      The receipt's archive note states, without interpretation, whether the
      run completed or was checkpointed, whether READ_DECLARATION.json reports
      any forbidden path, and whether C-RECON agreed.
    - The post-commit verifier ACCEPTS the receipt. Until it does, NOTHING in this package is official and no reviewer may be launched on it (AGENTS.md rule 7).
    - The branch is pushed and a PR against main is open or refreshed, naming the records.
    - '`tools/validate_ledger.py` passes on the committed tree with no new errors attributable to these paths.'
    - No producer artifact was edited: a `git diff` of the staged content against the pre-commit working tree is empty.

  return_format: >-
    The archive receipt path; commit_sha and parent_sha; the number of files
    hashed and the RUN id; the verifier's pass/fail with its exact message; the
    origin/main base commit and the merge outcome; the merge_digest result for
    GOAL-ICPERF-e6b6a4; the PR url or number; the validate_ledger result; and
    the archive note verbatim. Report any refusal, any scope expansion, or any
    producer artifact you found dirty or missing, rather than working around it.

  review_plan: null
  review_plan_note: >-
    Null because this card opens no claim-changing review round -- it PRECEDES
    one. The round that is owed, and everything its plan must contain
    (including the fourth joint that verifies C-INDEP itself, and the
    identifier shortfall that currently blocks it), is written out in
    TASK-20260916-3355fc `review_plan_note` and must not be re-derived
    independently here; two copies of a plan drift.

  provenance:
    written_by: coordinator, BATCH-94168f, 2026-09-16
    authorizing_decision: DEC-20260916-a91144
    identifier_discipline: >-
      NO IDENTIFIER WAS MINTED BY THIS SESSION. TASK-20260916-2c4679 was
      supplied pre-allocated and --check verified.
