  objective: >-
    Read E. Gorla and M. Massierer's paper on point decomposition for
    elliptic curves via the Weil restriction (arXiv:1405.1059; IACR ePrint
    2014/318; the record cites it as recalled) at source, and answer RB-Q1 to
    RB-Q4 below for IDEA-20260922-8278db, pricing its per-trial decomposition
    cost at arity 10 to 22 only as far as the source allows. Record every
    source used with provenance retrieved. Write one reading note under this
    task's directory. Edit nothing else.
  uncertainty_reduced: >-
    What the source actually measured per decomposition trial at its
    implemented arities and field sizes, and what, if anything, it supports
    about growth with arity, so that HOLD-L can be re-ruled from a source read
    (DEC-20260924-99ce20 HOLD-L: Gorla-Massierer is recalled; the per-trial
    cost at arity 10 to 22 is unknown).
  questions:
    RB-Q1: >-
      Which arities, field sizes and curve families did the source implement,
      with which solver and on what hardware, and what per-trial (or
      per-relation) decomposition cost did it report? Quote the table or
      figure pointer for each value you transcribe, with its unit.
    RB-Q2: >-
      Does the source state or fit any growth law of the per-trial cost with
      arity or with the descended system's degree? Quote it; if it states
      none, say so.
    RB-Q3: >-
      Price the record's per-trial cost at arity 10 to 22 over F_(2^16) only
      as far as the source allows: state which part of that range the source
      covers by measurement (likely none), which by a stated law, and which
      not at all. Any extrapolation you make is labelled not supported by the
      source and is not a design figure.
    RB-Q4: >-
      The record's falsification condition reads the source's measured cost
      at its small arities against IDEA-20260906-a77711's H1/H2-only
      prediction. Report the source's values beside that prediction's terms
      as the record states them, without deciding the record's condition;
      the decision is a later design's.
  record_fields_informed: >-
    IDEA-20260922-8278db citations (the Gorla-Massierer entry, recalled),
    citation_note, first_deliverable (retrieve the measured g = 2, 4 costs),
    minimal_test Part 2, frontier_check, dominated_by and sota_delta. The note
    names which field each answer informs; it does not edit the record. The
    closing decision DEC-20260929-7257b2 rules on HOLD-L from it.
