handoff:
  id: TASK-20260810-cb696d
  recorded_at: '2026-08-10'
  from: coordinator
  to: coordinator
  objective: 'SUCC-DISCHARGE-SWEEP: per goal, rule each held queue entry DISCHARGED or PENDING against
    its own completion_gate and the goal''s committed decisions.'
  uncertainty_reduced: Which of the 282 held queue entries represent real pending work and which are already-done
    work whose bookkeeping was never closed. Until this is ruled, every active-goal dispatch plan overstates
    what remains.
  inputs:
  - AGENTS.md
  - agents/coordinator.md
  - coordination/reconciliation/RECON-20260810-001/tasks/TASK-20260810-1b82fe/disposition.yaml
  - coordination/reconciliation/RECON-20260810-001/tasks/TASK-20260810-1b82fe/reconciliation.md
  - coordination/reconciliation/RECON-20260810-001/tasks/TASK-20260810-c64cf0/queue_state_audit.yaml
  - coordination/reconciliation/RECON-20260810-002/tasks/TASK-20260810-65e08f/sibling_classification.yaml
  - ledger/decisions/
  constraints:
  - COORDINATION ACT. Opens no batch, moves no HYPOTHESIS status, files no evidence, promotes no knowledge
    entry, approves no experiment, closes no goal. No claim tier moves. Correcting a goal's head fields
    is bookkeeping, not a research-state transition, and must not be used to smuggle one.
  - Correct by SUPERSESSION, never by overwriting an immutable record. A goal record's head fields are
    current-state and may be edited in place; a committed decision, evidence record, run record or checkpoint
    may NOT be edited. Preserve any superseded note verbatim and add the correction alongside it, exactly
    as this repository's goal records already do.
  - You have NO SHELL. Determine the correct value from record CONTENTS -- decisions, inline checkpoints,
    evidence -- and NEVER from commit ordering. Ordering inside bulk-import commits 33e4c629, 9514c074
    and 65ce43f0 is unrecoverable; the audit graded every verdict depending on it MODERATE or WEAK and
    you must not upgrade one.
  - If the correct value cannot be established from committed contents, STOP and record UNRESOLVED with
    what would settle it. Do not guess a batch id, a sha, or a date. Leaving a head wrong-but-flagged
    is strictly better than making it confidently wrong.
  - Leave exactly ONE next_action where you rewrite one. Preserve any standing hold (e.g. a non-execution
    hold) as part of it rather than dropping it.
  - Write only within your write_scope. Never commit.
  - ARTIFACTS_PRESENT IS NOT A COMPLETION CLAIM. The disposition discharged exactly 1 of 164 on committed
    evidence; do not lower that bar to clear volume.
  - Size per goal and say what you did not reach. Breadth bought by weakening the evidence standard is
    the failure mode here.
  deliverables:
  - discharge_sweep.yaml
  artifact_paths:
  - coordination/reconciliation/RECON-20260810-002/tasks/TASK-20260810-cb696d/discharge_sweep.yaml
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 3000
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
  - discharge_sweep.yaml covers all 282 held entries (163 ARTIFACTS_PRESENT still on hold + 24 PARTIAL
    + 91 ABSENT + 4 declaration defects), grouped BY GOAL, each ruled DISCHARGED | PENDING | DEFECTIVE_DECLARATION
    | UNRESOLVED.
  - Every DISCHARGED ruling names the committed decision, evidence record or review verdict that discharges
    it. An artifact merely existing is NEVER sufficient.
  - Entries classified M1 by the sibling split are ruled against their completion_gate as written, with
    the filename mismatch recorded; artifact_paths is never rewritten to match what was produced.
  - Where a goal's volume exceeds the budget, the sweep states which goals were covered and which were
    not -- an honest partial sweep with its boundary named. A complete-looking sweep that skipped goals
    silently fails this gate.
  - No dispatch queue is edited by this task; it produces the ruling, and the queue edits are a named
    successor.
  return_format: 'YAML terminal verdict: per-item DONE | UNRESOLVED with the committed record that settled
    each, plus paths written and any UNRESOLVED carried forward.'
