handoff:
  id: TASK-20260904-b669ac
  from: coordinator
  to: executor
  created_at: '2026-09-04'
  experiment_id: EXP-MONO-bb6fa1
  hypothesis_id: H-MONO-572e7e
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001

  objective: >-
    Execute EXP-MONO-bb6fa1: measure the Galois group of the m=4 residual
    cubic over the fixed-T summation surface V_R, on one curve and one R
    at p=101, gated by two mandatory nearby-object controls and a free
    m=3 baseline reproduction check.

  authorized_by: coordinator
  authorization_basis: >-
    DEC-20260904-8c2580's own named next step for the D-4 direction-swap
    route, specialized to IDEA-20260904-a1b81b's own Stage 0+1+R8.

  background_you_need: >-
    Read `ledger/proposals/IDEA-20260904-a1b81b.yaml` in full for the
    complete derivation and design (STEP 1-4 of its own `mechanism`
    field, and its own Stage 0/1 minimal_test description) -- this
    handoff summarizes it but the idea record is authoritative for any
    detail. Read `ledger/hypotheses/H-MONO-572e7e.yaml` and
    `experiments/EXP-MONO-bb6fa1/specification.yaml` for the exact
    scoped claim and stopping rules.

    THE CORE OBJECT: fix a curve E/F_101 and a point R, T_0 = x(R). The
    m=4 Semaev polynomial S_4(x1,x2,x3,T) is symmetric in x1,x2,x3, so
    S_4(x1,x2,x3,T_0)=0 descends to a condition on the elementary
    symmetric functions (e1,e2,e3) of (x1,x2,x3) -- this defines a
    surface V_R in (e1,e2,e3)-space. A point of V_R(F_101) is exactly a
    monic cubic g(X)=X^3-e1X^2+e2X-e3 (whose roots are some Galois-stable
    triple with S_4=0 at T_0). The question: as (e1,e2,e3) ranges over
    V_R(F_101), what fraction of the time does g split completely into 3
    distinct F_101-rational roots (density R3, "the relation-rate
    factor"), split into a root plus an irreducible quadratic (density
    R2), or stay irreducible? Under the "textbook" assumption (Galois
    group S_3, density triple (1/6,1/2,1/3)), that's the 1/(m-1)!=1/6
    factor every relation-rate model in this program assumes but has
    never measured. The alternative (Galois group contained in A_3,
    triple (1/3,0,2/3)) would DOUBLE the relation rate and eliminate the
    1+2 type. The DISCRIMINANT-SQUARE RATE (R1: is disc(g) a nonzero
    square in F_101?) is the cheapest, sharpest discriminator: 0.5 under
    S_3, 1.0 under the alternative.

  what_to_do:
    - >-
      SETUP: pick ONE ordinary curve E/F_101 with j not in {0,1728} by a
      fixed, declared deterministic rule (e.g. ascending (A,B) scan,
      first ordinary non-CM curve found -- disclose exactly which rule
      and which curve you used). Pick a generator G of E(F_101) and a
      scalar k such that R=kG is NOT in E[2] (compute R's own TRUE order
      directly and assert it -- do not assume it equals #E(F_101)).
      T_0 = x(R).
    - >-
      STAGE 0: enumerate ALL (e1,e2,e3) in F_101^3 (about 1.03e6 triples)
      DIRECTLY IN SYMMETRIC COORDINATES -- do NOT choose (x1,x2) and
      solve for x3 or e3 (this enumerates only the ORDERED, always-split
      variety and would force split density to a spurious 1.0; this is
      explicitly named in the idea record's own confounders section as
      the single most likely implementation error). For each
      (e1,e2,e3): form g(X)=X^3-e1X^2+e2X-e3, factor it over F_101
      (degree 3, elementary root-finding is fine), determine its type
      (3 distinct roots / 1 root + irreducible quadratic / irreducible /
      degenerate-repeated-root). For each non-degenerate triple, obtain
      the Galois-stable root multiset (over F_101, F_{101^2}, or
      F_{101^3} as needed) and evaluate S_4(t1,t2,t3,T_0) using this
      program's own already-built resultant recursion
      (`experiments/EXP-MONO-815525/implementation/derive_s4.py` and its
      s3/s4 monomial tables -- read that file to understand how S_4 is
      already constructed in this program, and reuse it read-only rather
      than re-deriving S_4 from scratch). Keep the triple iff
      S_4(t1,t2,t3,T_0)=0 (a point of V_R). Tabulate: |V_R(F_101)|, R1
      (fraction of V_R points where disc(g) is a nonzero square in
      F_101), R2 (fraction split as 1+2), R3 (fraction fully split).
      Report every degenerate stratum count separately (never pooled).
    - >-
      STAGE 1 (MANDATORY, GATING -- run the identical classifier logic on
      two synthetic objects BEFORE interpreting Stage 0's own result):
      (a) the synthetic A_3 object -- enumerate (e1,e2,e3) constrained so
      disc(g) is a nonzero square in F_101 (by construction; this is a
      DIFFERENT enumeration, not filtered from V_R), classify the SAME
      way, and confirm the reported triple is (1/3, 0, 2/3); (b) the
      unconstrained object -- uniformly enumerate ALL (e1,e2,e3) in
      F_101^3 with NO V_R membership condition at all, classify the same
      way, and confirm the reported triple is (1/6, 1/2, 1/3). If EITHER
      control fails (i.e. does not match its own expected triple within
      3 standard errors), STOP: report the failure plainly, and do NOT
      interpret Stage 0's own R1/R2/R3 in either direction -- this means
      the classifier cannot see the effect being measured.
    - >-
      STAGE R8 (free, symbolic, m=3 baseline): confirm your own
      classification pipeline's logic, if applied at m=3 (residual
      object degree 2, not 3), reproduces
      `ledger/decisions/DEC-20260904-8c2580.yaml`'s own already-proven
      identity: disc_{x2} S_3(x1,x2,T_0) = 16 f(x1) f(T_0) identically --
      i.e. the m=3 residual is a FORCED quadratic-character structure,
      not a genuine three-type histogram. You do not need to re-run a
      full m=3 enumeration; a direct symbolic/numerical check of this
      identity against a few sample (x1,T_0) pairs suffices, reported
      plainly as pass/fail. If it fails, STOP and report a
      specification_error -- do not report any m=4 output.

  constraints:
    - Enumerate V_R and the two nearby objects ONLY in symmetric (e1,e2,e3) coordinates, never via solve-for-e3 from a chosen ordered pair.
    - Do not interpret Stage 0's own R1/R2/R3 unless BOTH Stage-1 controls pass.
    - Do not report any m=4 output unless R8 passes.
    - Report every degenerate stratum separately; never pool.
    - One run directory: runs/RUN-MONO-bb6fa1-1/, full manifest per docs/evidence-and-reproducibility.md, with the required `id, experiment_id, status, code, environment, inputs, timing, result` top-level keys (a prior run in this sub-lane omitted some of these and the Coordinator had to patch it after the fact -- avoid repeating that).
    - Compute an ACTUAL sha256 for command.txt in the manifest -- no placeholder comments.
    - No network access. Budget per specification.yaml (900s wall/CPU, 128MiB RSS, 1 worker).
    - Any infrastructure failure is failed_infrastructure, never mathematical evidence.
    - Do not run any git command, do not commit, do not push. Write files only; the Coordinator archives separately.

  budget: see experiments/EXP-MONO-bb6fa1/specification.yaml `budget` block.

  completion_gate: >-
    execution_report.yaml filed with: the chosen curve/R and how they
