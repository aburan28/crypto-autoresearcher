handoff:
  id: TASK-20260724-245
  from: coordinator
  to: executor
  objective: >-
    Execute the approved EXP-XEDN-002 exact function-field xedni section census:
    the closed-form lift probability, its exhaustive small-p verification under
    the frozen predicate, the exact multi-section histogram, and the scoped
    codimension lemma.
  uncertainty_reduced: >-
    The exact value of the function-field xedni lift probability P_lift and of the
    probability that a surface carries enough sections for a Mordell-Weil
    relation, replacing the EXP-XEDN-001 phase-2 rare-event design whose target
    rate is below 1e-8 per slot at the contracted sizes.
  inputs:
    - experiments/EXP-XEDN-002/specification.yaml
    - experiments/EXP-XEDN-001/contract.md
    - experiments/EXP-XEDN-001/xedni_sections.py
    - experiments/EXP-XEDN-001/smoke_results.json
    - ledger/hypotheses/H-XEDN-001.yaml
    - ledger/questions/RQ-XEDN-001.yaml
    - knowledge/literature/KN-LIT-020.md
    - knowledge/literature/KN-LIT-021.md
  constraints:
    - Observations and derivations only; do not change any hypothesis, experiment, or goal status.
    - Do not modify anything under experiments/EXP-XEDN-001; use the predicate read-only.
    - >-
      The closed form is admissible only after exact agreement with exhaustive
      enumeration at every completed small size; report any disagreement as an
      invalidation instead of adjusting the formula.
    - >-
      The scoped codimension lemma must carry explicit hypotheses and an explicit
      list of cases it does not cover; it may not be presented as an
      unconditional no-go for lifting.
    - Toy scale only; generated surfaces only; no attack or crypto-scale claim.
    - Stay inside write_scope experiments/EXP-XEDN-002.
  deliverables:
    - Implementation under experiments/EXP-XEDN-002/implementation/
    - Immutable run records under experiments/EXP-XEDN-002/runs/
    - derivation.md (arm A derivation, arm D scoped lemma, open cases)
    - analysis.md (gate verdict against the frozen criteria, claim boundaries)
    - execution-report.yaml
  artifact_paths: []
  archived_by: TASK-20260724-231
  inference:
    policy: executor-terra
    fallback_allowed: true
    independent_session_required: false
  budget:
    wall_clock_seconds: 5400
    memory_gb: 4
    maximum_runs: 6
  completion_gate:
    - Arms A, B, and D have terminal states; arm C reports its largest completed size.
    - Closed form and exhaustive enumeration agree exactly at every completed size, or the disagreement is reported as an invalidation.
    - Every control has an explicit pass, fail, or invalid verdict.
    - The gate verdict is stated against the frozen criteria with its claim boundary.
  return_format: execution_report
