handoff:
  id: TASK-20260822-7f5ed3
  from: coordinator
  to: validator
  objective: 'Complete joint V1 of review-plan-87c429.yaml, left incomplete by TASK-20260822-40389d solely because run_command was unusable to that session (glm-5.2 sent the command argument as a JSON-array string; the api_direct runtime has since coerced that shape in commit 3e23db8d8, with a regression test). Perform the COLD RE-RUN: re-execute the frozen sweep driver in fresh processes for all four production runs and require exact per-seed integer agreement with the archived raw artifacts. No other joint is in scope; V2, V3, V4 already have verdicts in the original report and are not re-adjudicated here.'
  inputs:
  - the frozen review plan: coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/review-plan/review-plan-87c429.yaml (joint V1 attack plan)
  - the original report (your own prior work, not a sibling): coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/reviews/TASK-20260822-40389d/validation-report.yaml
  - the four production run directories under coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/tasks/TASK-20260822-767bb1/runs/ (manifest.yaml + raw-result.json for RUN-MDFIVE-b6-{primary,null}-{md4,md5}-prod)
  - the frozen driver: harness/run_md4_seed_sweep.py (sha256 4aa7b6f0c5d5c7883a463aebc9f49edf8581e64ad1bf4eeee4fa78b34a2b0fe9, bound by the snapshot receipt)
  constraints:
  - re-run ONLY into your own task directory: --out-root coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/reviews/TASK-20260822-7f5ed3 with --run-suffix <original-suffix>-v1check; NEVER write into the archived run directories (run records are immutable; a clobbered raw artifact is an evidence-integrity failure)
  - use the driver default 100-seed schedule (do not pass --seeds): the manifest seed schedule equals the module default; the manifest is the record of what was run
  - sibling-blind: do not read coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/reviews/TASK-20260822-87c429/ (the red-team directory); it is currently empty, and an empty-directory check is your attestation
  - never read coordination/goals/GOAL-MD5-001/quarantine/ (its integrity rests on the snapshot receipt pre-freeze check and the non-reading attestations, by design of the isolation clause; re-hashing it is out of scope)
  - claim ceiling: analyzed. This task completes a mechanical check; it must not restate or extend any routing conclusion
  - if run_command fails for any reason that is not the already-fixed string-array shape, STOP and report the exact tool error verbatim as an infrastructure outcome (AGENTS.md rule 5): a tool failure is not evidence against the artifacts
  deliverables:
  - coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/reviews/TASK-20260822-7f5ed3/validation-report-v1.yaml with: per-run exact-agreement result (400 seed-integer comparisons across the four runs), any mismatch list, the inference provenance (requested policy and the resolved model exactly as the runner records it -- do NOT self-describe the runtime; quote the runner log / inference-receipt fields), an attestation of exactly which paths were read, and the stop reason
  artifact_paths:
  - coordination/goals/GOAL-MD5-001/batches/BATCH-ebac02/reviews/TASK-20260822-7f5ed3/validation-report-v1.yaml
  archived_by: TASK-20260822-554f6d
  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 300
    memory_gb: null
    maximum_runs: 4
  completion_gate:
  - the report file exists, parses as YAML, and carries the provenance + attestation blocks
  - per-run exact agreement is reported for all four production runs; 400/400 matching seed integers yields verdict PASSED, any mismatch yields FAILED with the mismatch list (a mismatch is a first-class finding, not an error state)
  review_plan:
    claim_under_review: >-
      The same claim as the round this task completes (carried over from
      review-plan-87c429.yaml, unchanged): BATCH-ebac02 phase 1 -- the RC-1
      fixed-word-seed distribution (>=100 seeds, MD4 and MD5, 32-bit and
      12-bit resolution, CTL-PO5 raw candidate count) and the RC-4 static
      (y XOR z) mask check, frozen by the TASK-20260822-b325fe snapshot
      receipt, and the routing answer derived from them.
    coordinator_prior: >-
      Carried over unchanged from review-plan-87c429.yaml: the 12-bit
      distinct_fwd distribution is expected to concentrate at the low end
      (the collapse is NOT a seed lottery; the F-multiplexer mask kills the
      free word's varying bits). For this scoped mechanical task the prior
      makes no prediction beyond determinism: a cold re-run of the frozen
      driver reproduces every archived per-seed integer exactly. A
      mismatch, if it occurs, is a first-class finding about the instrument
      or the record, not an error state.
    proves_too_much:
      note: >-
        The round's proves-too-much objects are owned by the red team
        (TASK-20260822-87c429) and are UNEXECUTED (that tier failed on
        infrastructure and is paused; DEC-20260822-d7c2d0 F-4). For this
        scoped task the discriminating-power control on the comparison
        itself is the negative control archived with the close:
        archives/TASK-20260822-554f6d/v1-comparison-negative-control.py,
        which points the same comparison logic at two archived runs of the
        same seeds under different objects and requires mismatches. It
        returned 1591 of 1700 mismatches (status PASS), establishing the
        7600/7600 agreement is not a vacuous comparison.
      objects:
      - 'same-seed/different-object archived pair (primary-md4 vs null-md4, 100 shared seeds, 17 common per-seed fields): the comparison MUST flag differences; it flagged 1591 of 1700'
      failure_signature: >-
        A comparison that reports exact agreement on the known-false object
        (the different-object pair, whose integers differ by construction)
        is vacuous: it cannot have discriminated on the true object either.
        If the negative control returns zero mismatches, the 7600/7600
        result is an artifact of the comparison, the V1 verdict is
        WITHDRAWN, and the close is superseded -- exactly as a wrong-fingerprint
        manifest failing V2 would be. The control passed (1591 of 1700
        mismatches, status PASS), recorded in
        archives/TASK-20260822-554f6d/v1-comparison-negative-control-result.json.
    joints:
    - joint: V1
      assigned_to: TASK-20260822-7f5ed3
      attack_plan: 'cold re-run of the frozen driver for all four production runs (fresh process each, output into this task directory only) and EXACT per-seed integer agreement on distinct_fwd_32bit, distinct_fwd_12bit, distinct_bwd_32bit, distinct_bwd_12bit and the raw candidate count against the archived raw-result.json, wall_seconds and timestamps excluded; then recompute the execution report summary table from the re-run raw and confirm it matches the archived table'
