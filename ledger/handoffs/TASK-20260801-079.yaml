handoff:
  id: TASK-20260801-079
  from: coordinator
  to: executor
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-027
  experiment_id: EXP-LPF-001
  hypothesis_id: H-LPF-001
  run_id: RUN-LPF-001-measure
  objective: >-
    Run the measurement arm ONCE against the UNMODIFIED hash-bound driver and the
    FROZEN reading rule RR-LPF-2 - enumerate all C(512, 2) = 130816 unordered i < j
    half-tuples of the frozen deterministic factor base at both toy cells under
    INT-1 and ENC-B, FACTOR EVERY ONE, record the largest prime factor and the
    B-smoothness indicator at every rung of both Bsm ladders, and compare the
    resulting distribution absolutely against Dickman rho(u). RECORD OBSERVATIONS
    ONLY.
  uncertainty_reduced: >-
    The empirical largest-prime-factor distribution of genuine half-arity Semaev
    partial-map intermediates at the two frozen toy cells - the quantity HEUR-DS-1
    is about and that no experiment in this campaign has ever measured.
  inputs:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-027/archives/TASK-20260801-078/snapshot_commit_receipt.json
  - experiments/EXP-LPF-001/specification.yaml
  - experiments/EXP-LPF-001/reading_rule_v2.yaml
  - experiments/EXP-LPF-001/implementation/lpf001_driver.py
  - experiments/EXP-LPF-001/results/calib/
  constraints:
  - >-
    PROCEED ONLY IF APPROVAL_DETERMINATION IS APPROVED in the TASK-20260801-078
    receipt. Otherwise stop and report. RUN EXACTLY ONCE.
  - >-
    USE RR-LPF-2 AS THE READING RULE, NOT RR-LPF-1. If the driver's reading-rule
    loader must be pointed at a file, point it at
    experiments/EXP-LPF-001/reading_rule_v2.yaml. DO NOT EDIT EITHER READING RULE,
    the specification or lpf001_driver.py - the driver's sha256 must still be
    786aeb0550d75fa3d0785aefbe50b121a24cacae584a4cadd79902c464722d65 at the end of
    this task.
  - >-
    DO NOT SILENTLY REDUCE SCOPE. R_CAL, both ladders, both cells and n = 130816
    are as the frozen contract fixes them. Reducing any of them requires a
    Coordinator protocol_amendment. A REDUCED-SCOPE RUN REPORTED AS THE PLANNED ONE
    WOULD BE THE SINGLE MOST DAMAGING THING THIS BATCH COULD PRODUCE.
  - >-
    THE PILOT BUDGET GATE RUNS FIRST. If the projection exceeds the wall-clock
    budget, ABORT BEFORE BULK WORK and report a BUDGET EVENT - an L-0 instrument
    signal, never a result about anything, and never silently converted into a
    reduced-scope run.
  - >-
    RE-VERIFY EVERY FACTORIZATION AT 100 PERCENT - each returned factor tested for
    primality and the product asserted equal to N - and archive the verification
    count and any failures. A FACTORIZATION THIS EXPERIMENT DID NOT VERIFY IS NOT A
    MEASUREMENT.
  - >-
    RECORD OBSERVATIONS ONLY. Do not apply the reading rule to select a branch, do
    not state a disposition, do not interpret, and do not compare to any
    hypothesis. TASK-20260801-083 owns the branch selection.
  - >-
    Emit a complete run package - manifest.yaml with command.txt, environment.json,
    stdout.log, stderr.log and raw-result.json beside it, plus git_status_prerun.txt
    - and the five declared result files. THE MANIFEST MUST BE SCHEMA-COMPLETE
    AGAINST tools/validate_ledger.py, WITH `environment`, `inputs` AND `resources`
    PRESENT UNDER THE KEYS THE SCHEMA NAMES. RUN tools/validate_ledger.py AGAINST
    YOUR OWN PACKAGE BEFORE REPORTING COMPLETE - this is the exact defect DEF-065-1
    recorded and it must not recur.
  - >-
    Record the exact command, the git commit and dirty-tree state, environment and
    dependency versions, inputs and seeds, the requested policy and the resolved
    model with fallback_used, stdout and stderr, validity status and reason,
    timings and peak RSS.
  - >-
    A TIMEOUT OR CRASH IS INFRASTRUCTURE SIGNAL AND IS REPORTED AS SUCH, never as a
    negative result about smoothness.
  - 'MAKE NO COMMIT; TASK-20260801-080 archives.'
  - Every YAML and JSON file written must parse.
  deliverables:
  - >-
    experiments/EXP-LPF-001/runs/RUN-LPF-001-measure/ (manifest.yaml,
    raw-result.json, command.txt, environment.json, stdout.log, stderr.log,
    git_status_prerun.txt)
  - >-
    experiments/EXP-LPF-001/results/measure/ (LPF_report.json,
    absolute_comparison.json, relative_band_comparison.json,
    deviation_certificate.json, factorization_verification.json)
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-027/tasks/TASK-20260801-079/execution_report.yaml
  artifact_paths:
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-measure/manifest.yaml
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-measure/raw-result.json
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-measure/command.txt
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-measure/environment.json
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-measure/stdout.log
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-measure/stderr.log
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-measure/git_status_prerun.txt
  - experiments/EXP-LPF-001/results/measure/LPF_report.json
  - experiments/EXP-LPF-001/results/measure/absolute_comparison.json
  - experiments/EXP-LPF-001/results/measure/relative_band_comparison.json
  - experiments/EXP-LPF-001/results/measure/deviation_certificate.json
  - experiments/EXP-LPF-001/results/measure/factorization_verification.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-027/tasks/TASK-20260801-079/execution_report.yaml
  archived_by: TASK-20260801-080
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 14400
    memory_gb: 8
    maximum_runs: 1
  completion_gate:
  - >-
    APPROVAL_DETERMINATION confirmed APPROVED before starting; the pilot gate run
    and its projection recorded; no scope reduction anywhere - R_CAL, both ladders,
    both cells and n = 130816 exactly as frozen; RR-LPF-2 used as the reading rule
    and both reading rules, the specification and lpf001_driver.py all unmodified
    at the end; every factorization re-verified at 100 percent with the count
    archived and any failure reported; the manifest schema-complete and
    tools/validate_ledger.py run against the package with its output recorded; all
    five result files and the seven-file run package emitted and parsing; no branch
    selected, no disposition stated, no interpretation offered; no commit made.
