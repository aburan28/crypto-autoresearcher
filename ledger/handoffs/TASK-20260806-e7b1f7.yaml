  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
    fallback_note: >-
      Policy alias does not resolve to a distinct model under this harness;
      the resolved model is the session model and fallback_used is true.

  budget:
    wall_clock_seconds: 600
    memory_gb: 1
    maximum_runs: 1

  completion_gate:
    - Commit changes exactly the one declared artifact path and nothing else
    - Recorded per-path sha256 values match the committed blobs for all 24 artifacts
    - Commit message names this task id
    - The 24 declared artifacts are unchanged by this commit
    - The receipt states the lifecycle deviation rather than implying pre-review ordering

  return_format: >-
    Content-binding receipt naming the declared artifacts, their per-path
    sha256, the commit that actually introduced them, and the lifecycle
    deviation.
