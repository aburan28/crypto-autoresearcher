handoff:
  id: TASK-20260806-e7b1f7
  recorded_at: '2026-08-06'
  archived_at: '2026-08-13'
  from: coordinator
  to: coordinator
  objective: >-
    Bind by content hash the exact hypothesis, experiment-contract and handoff
    artifacts produced for the eleven IDEA-20260806-* proposals, so that
    independent review of those records has a fixed object rather than a working
    tree that could still move.
  uncertainty_reduced: >-
    Whether the records an independent Validator or Red Team would read are
    hash-pinned, or merely present in a tree that later commits could alter.
  inputs:
    - IDEA-20260806-b7fdc3
    - IDEA-20260806-530fdd
    - IDEA-20260806-e4f96e
    - IDEA-20260806-7955a5
    - IDEA-20260806-0c9de1
    - IDEA-20260806-a3ef00
    - IDEA-20260806-071255
    - IDEA-20260806-37eab9
    - IDEA-20260806-6bb3ef
    - IDEA-20260806-bcbcf5
    - IDEA-20260806-94676a

  lifecycle_deviation:
    what_this_is_not: >-
      THIS IS NOT A PRE-REVIEW SNAPSHOT, AND IT MUST NOT BE READ AS ONE.
      AGENTS.md "Durable research commits" defines a snapshot as the commit that
      commits a producer's exact artifacts BEFORE an independent agent reviews
      them. The twenty-four artifacts declared here were already committed and
      merged to main in pull request #202 (branch commits f03f25403 and
      0d252527a) before this receipt existed. No commit made now can be the
      commit that introduced them.
    what_it_is: >-
      A POST-HOC CONTENT BINDING. It records the sha256 of each declared
      artifact as merged, so a later reviewer can verify that what they read is
      byte-identical to what was approved. Under the content-first rule in
      CLAUDE.md -- "Archive receipts bind to CONTENT first ... commit
      reachability is advisory" -- that binding is the part which carries the
      information, and it is still worth having.
    why_the_deviation_happened: >-
      The identifier TASK-20260806-e7b1f7 was allocated and named as archived_by
      in TASK-20260806-b3660f and TASK-20260806-6162ae, but the receipt itself
      was never written before those handoffs were committed and merged. The
      omission was found while auditing the merged pull request. Recording the
      deviation is preferred to backdating a claim that the ordering was met.
    consequence_for_the_two_approved_experiments: >-
      EXP-RHO-60da4f and EXP-REPL-1d1287 are approved and have executor
      handoffs, but their archived_by pointer resolved to nothing until now. No
      run was dispatched in the interval, so no run record depends on the
      missing receipt and nothing downstream needs superseding. This receipt
      makes the pointer resolve; it does not retroactively make the ordering
      correct, and the two experiments' approval rests on the Coordinator
      decision recorded in their specifications, not on this task.
    supersedes: null

  constraints:
    - >-
      Runs alone. No other task may hold the Git index concurrently.
    - >-
      The receipt is committed INSIDE the commit it describes and therefore
      carries commit_sha: null. Committing a receipt in a separate commit is a
      known defect (GOAL-HAWK-001 BATCH-001, CORR-20260802-009) and is not
      repeated here.
    - >-
      The receipt's own path_sha256 entry is omitted: a file cannot contain its
      own final digest. This follows the convention recorded in
      coordination/goals/GOAL-AES-003/batches/BATCH-002/archives/TASK-20260802-f92a96/snapshot-receipt.json.
    - >-
      Stage the declared paths by exact pathspec. Do NOT use git add -A.
    - >-
      This task asserts NO mathematical claim. It binds bytes and nothing else.
    - >-
      The twenty-four declared artifacts are NOT modified by this task. A
      content binding that altered its own subject would be worthless.

  deliverables:
    - coordination/tasks/TASK-20260806-e7b1f7/snapshot-receipt.json
  artifact_paths:
    - coordination/tasks/TASK-20260806-e7b1f7/snapshot-receipt.json
  archived_by: TASK-20260806-e7b1f7

  record_ids:
    - H-RHO-bc6ea6
    - H-REPL-6c431d
    - H-SPR-71a843
    - H-AOM-8d4a83
