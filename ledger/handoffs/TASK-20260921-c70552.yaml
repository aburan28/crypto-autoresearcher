      NOT wrap it in an external short tool-call-duration timeout, the exact
      mistake that caused RUN-FROB-2404fa's interruption and is disclosed as
      self-inflicted tooling, not authorized protocol. The trial plan's own
      watchdog_seconds=86400 is the sole authorized cutoff. This constraint
      is restated verbatim from TASK-20260914-0a026a, TASK-20260919-4baa89,
      and TASK-20260919-490018 because it is this lane's single most
      consequential operational failure mode of THIS particular kind to date
      and must not recur.
    - >-
      RESTATED CONSTRAINT, now strengthened because of RUN-FROB-f3e2a3's own
      interruption on top of RUN-FROB-39714f's: the underlying execution
      environment itself (the container/VM this or any launching session
      runs in) has now been observed TWICE, CONSECUTIVELY, directly and
      without ambiguity, to be capable of being destroyed mid-run with zero
      warning and zero graceful shutdown -- this killed both
      RUN-FROB-39714f's and RUN-FROB-f3e2a3's entire process trees,
      including the Python supervisor process each time, before either could
      write any receipt. This is now an established, RECURRING failure mode
      for this lane, not a hypothetical or single-instance one. Accordingly,
      the launching session should, if it has any means to do so, prefer to
      check in on run progress somewhat more frequently than it might
      otherwise, so that a further whole-environment restart is discovered
      sooner rather than only when the run is next expected to have
      finished. THIS IS ADVISORY ONLY. It does NOT authorize any external
      timeout wrapper, watchdog script, or tool-call-duration bound around
      the trial process itself -- the trial plan's own
      watchdog_seconds=86400 remains the SOLE authorized cutoff on the
      process itself, exactly as the constraint immediately above states.
      Monitoring cadence (how often the launching session looks at the run's
      progress) and process-lifetime cutoff (what is authorized to actually
      terminate the process) are two DIFFERENT things and must not be
      conflated -- conflating them, specifically by wrapping the process
      itself in a short external timeout in the name of "checking in", is
      exactly how RUN-FROB-2404fa was lost. Checking in more often means
      reading logs/output-file sizes more often; it never means shortening,
      wrapping, or otherwise touching the process's own lifetime.
    - >-
      Do not launch on macOS with weakened guards, bypass the adapter, or
      restart other work. All 8 reserved adapter files are produced only by
      the supervisor; the driver writes only its 8 declared scientific
      files; the checker reads and prints, never alters final results or
      reserved files.
    - >-
      No existing run-root reuse (experiments/EXP-FROB-d8aa37/runs/RUN-FROB-16ecb6/
      must not exist before launch), no extra run, no sample reduction, no
      output fabrication, no silent recovery. On interruption/failure retain
      whatever the adapter did or did not manage to produce and require yet
      another fresh, prospectively-minted run_id for any further retry --
      do NOT reuse RUN-FROB-16ecb6.
    - >-
      Every v2/v3/v4/v5 method/control applies unchanged; specification-stage0-v2.yaml
      is not edited. driver-v2.py/checker-v2.py's only differences from
      driver.py/checker.py are the identity/provenance fixes enumerated in
      DEC-20260915-744b57's exact_diff_authorized -- no field/curve/subspace/
      formal-polynomial/panel/control/serialization logic differs. All v1
      remaining stages remain pending. No Bedrock, detached children,
      external Singular/pexpect, or silent policy degradation.
    - >-
      Do not edit coordination/frobenius/BATCH-2f8435/dispatch_queue.json.
      Claim and launch against this committed handoff record directly, or
      open a separate lane queue for this task, per this record's own queue
      field in trial-plan-stage0-v6.json.
    - >-
