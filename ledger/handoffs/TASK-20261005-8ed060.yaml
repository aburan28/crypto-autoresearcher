    - Enumerate n=7 subspaces. Do not sample them.
    - Do not build a Macaulay matrix.
    - Do not treat this run as a verdict on TASK-20260918-190055.
    - Write nothing outside the declared write scope.
    - Use no Bedrock endpoint or model.
