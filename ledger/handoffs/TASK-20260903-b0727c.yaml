handoff:
  id: TASK-20260903-b0727c
  from: coordinator
  to: executor
  goal_id: null
  batch_id: null
  batch_id_note: >-
    Assigned by /run-experiment when the execution batch is opened; this
    handoff is authored at approval time under DEC-20260903-93862f.
  experiment_id: EXP-PFDR-5726af
  hypothesis_id: H-PFDR-4148b8
  question_id: RQ-PFDR-ae2fba
  battery_position: 2 of 6 (the forced cell; decides whether the 84cdb7 ladder runs)
  recorded_at: '2026-09-03'
  objective: >-
    Execute the frozen, approved contract EXP-PFDR-5726af exactly as
    specified: Stage 0 (zero compute, hard gate) the s = 2 hand fixture,
    the frozen prediction file stage0-predictions.yaml written BEFORE any
    rank with its sha256 recorded in every manifest, and the H-TOP symbolic
    check at m = 3 (S_4 by resultant from a from-scratch S_3, checked
    against the archived profile [4, 4, 4, 12]); Stage 1 the shared F_p
    meter on the s = 2 fixture, then the DECIDING CELL (2, 2, 3) on 3
    curves x 2 targets x 2 primes with NULL-1, NULL-2 and NULL-3 in the same
    invocation, plus the H-WIL direct rank check for s in {2..8}; Stage 2
    (only if the deciding cell passes P1-P3) the ladder s in {4, 5, 6} and
    the mixed-block and non-monomial nearby objects at s = 3; Stage 3
    (gated on H-TOP at m = 3) m = 3, s in {4, 5}, p = 65537; Stage 4 (zero
    compute) signed residuals per cell against the frozen predictions and
    the verdict as observation. Implement under experiments/EXP-PFDR-5726af/
    with implementation.md; one immutable run directory per planned run
    (granularity: one (m, s) cell over all curves, targets, primes and arms;
    the H-WIL check; the H-TOP check) under
    experiments/EXP-PFDR-5726af/runs/<run-id>/ carrying manifest.yaml,
    command.txt, environment.json, stdout.log, stderr.log and
    raw-result.json per docs/evidence-and-reproducibility.md; an
    execution_report YAML; observations only, never interpretation beyond
    the contract's predefined labels.
  uncertainty_reduced: >-
    Whether the derived closed form d_ff(2, 2, s) = 4 + floor(s/2) with
    fall_dim 4 at s = 3 holds exactly on the Semaev arm at the deciding
    cell across curves, targets and primes; whether the block-factored null
    reproduces it exactly (first fall carries no curve information) while
    the support-matched null falls at D_null = 6; whether the mixed-block
    nearby object rises to 6; whether Wilson's rank statement holds at
    s <= 8 by direct rank; and whether H-TOP holds symbolically at m = 3.
    A disagreeing Semaev draw is a valid negative at that cell; a
    NULL-2-versus-Semaev difference is the most valuable negative and is
    re-run at the next s before it is named.
  inputs:
    - experiments/EXP-PFDR-5726af/specification.yaml
    - ledger/hypotheses/H-PFDR-4148b8.yaml
    - ledger/proposals/IDEA-20260903-e1e38b.yaml
    - ledger/decisions/DEC-20260903-93862f.yaml
    - ledger/decisions/DEC-20260903-8cdf8d.yaml
    - ledger/questions/RQ-PFDR-ae2fba.yaml
    - harness/macaulay_fp/ (the F_p meter from TASK-20260903-ba41aa, at its verified snapshot commit)
    - harness/macaulay_fp/VALIDATION.md
    - ledger/handoffs/TASK-20260903-ba41aa.yaml
    - ledger/proposals/IDEA-20260830-84cdb7.yaml
    - experiments/EXP-ALPF-011/source/round006_exp010_validated_resweep_result.md
    - docs/evidence-and-reproducibility.md
    - docs/claims-and-verification.md
    - ledger/handoffs/TASK-20260903-b0727c.yaml
  constraints:
    - >-
      DEPENDENCY, BINDING: this contract requires exact F_p ranks in
      squarefree mode and may not start before TASK-20260903-ba41aa has
      returned and its snapshot archive receipt has verified. Refuse to
      start unless harness/macaulay_fp/ exists at a committed path with
      tests/test_macaulay_fp.py passing, and record the meter's commit and
      per-file sha256 in every manifest.
    - >-
      Refuse to start unless experiments/EXP-PFDR-5726af/specification.yaml
      is status approved with approved_by coordinator at a committed path
      in a verified snapshot archive. A message saying 'approved' is not an
      approval.
    - >-
      stage0-predictions.yaml is written before any rank is computed and
      its sha256 is recorded in every manifest; the preregistered
      prediction and the success / falsification criteria are read-only;
      any needed change is a versioned protocol_amendment under
      experiments/EXP-PFDR-5726af/amendments/ requested from the
      Coordinator, never an edit.
    - >-
      Stopping rules are binding: stop before the deciding cell if the
      s = 2 hand fixture or the meter's known answer fails; stop after the
      deciding cell if P1 or P2 fails on any Semaev draw or if NULL-2
      differs from the Semaev arm (report the cell; do not run the ladder);
      skip Stage 3 if H-TOP fails at m = 3.
    - >-
      Timeouts, OOM and crashes (including a Sage failure on the H-TOP
      resultant; missing Sage is failed_infrastructure for that stage) are
      failed_infrastructure with the cell named; never evidence about the
      closed form. A cell run with D_max below D_null + 1 is censored, not
      evidence.
    - >-
      Record every deviation in the execution report and the manifest;
      never silently absorb one. Every planted target carries a
      certificate re-verified by independent point addition.
    - >-
      No d_ff read from a Groebner output degree or a CAS termination
      event; d_ff is the least D with exact fall_dim(D) > 0; sol(D) is a
      covariate only. Both D_null conventions are named wherever compared.
    - >-
      No hypothesis, experiment, question or goal status change; no
      evidence record; observations only.
    - >-
      Write only under experiments/EXP-PFDR-5726af/; never commit; never
      run git; never edit the specification, any hypothesis, or any other
      record. The harness s4_expr path is not relied on (KN-OPEN-5b3a08).
    - >-
      Record the requested policy (executor-implementation, medium), the
      resolved model identifier, model_verified and fallback_used in every
      manifest's inference block and in the execution report; no Bedrock,
      no fallback, no degradation.
    - >-
      Seeds exactly as frozen: curve seeds 1101..1103 per prime; target
      seeds 1, 2; null seeds 7, 11, 13, 17, 19; mixed-block coefficient
      seeds 31, 37, 41; the p = 4099, seed 1101, target 1 instance is the
      frozen fixture shared with EXP-PFDR-fd901a and its full rank profile
      is recorded for that contract's CTRL-FROZEN-FIXTURE.
  deliverables:
    - experiments/EXP-PFDR-5726af/implementation.md
    - experiments/EXP-PFDR-5726af/stage0-predictions.yaml (frozen before any rank; sha256 in every manifest)
    - experiments/EXP-PFDR-5726af/stage0-htop.md (the S_4 top-form symbolic check and the s = 2 hand fixture)
    - one immutable run directory per planned run under experiments/EXP-PFDR-5726af/runs/<run-id>/ with manifest.yaml, command.txt, environment.json, stdout.log, stderr.log, raw-result.json
    - experiments/EXP-PFDR-5726af/analysis.md (residual table, null tables, nearby-object table, H-WIL table, tail checks, verdict against the frozen criteria as observation)
    - experiments/EXP-PFDR-5726af/execution-report.yaml (per-run terminal status, stage report, stopping rules triggered, deviations, certificate results, inference block)
  artifact_paths:
    - experiments/EXP-PFDR-5726af/implementation.md
    - experiments/EXP-PFDR-5726af/stage0-predictions.yaml
    - experiments/EXP-PFDR-5726af/stage0-htop.md
    - experiments/EXP-PFDR-5726af/runs/
    - experiments/EXP-PFDR-5726af/analysis.md
    - experiments/EXP-PFDR-5726af/execution-report.yaml
  write_scope:
    - experiments/EXP-PFDR-5726af/
  archived_by: null
  archived_by_note: >-
    The execution batch's snapshot archive task is minted by
    /run-experiment when the batch is opened and stages exactly the
    artifact_paths above. This handoff itself is archived by the approval
    snapshot of DEC-20260903-93862f.
  inference:
    policy: executor-implementation
    reasoning_effort: medium
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 18000
    memory_gb: 8
    maximum_runs: 10
    budget_note: >-
      Copied from the frozen contract: wall_clock_seconds_per_run 1800 x
      maximum_runs 10 = 18000 s; the contract's total_cpu_hours 2 (7200 s
      at maximum_workers 1) bounds machine compute for the ranks, and the
      remainder of the envelope covers Stage 0 writing, the Sage resultant
      and the execution report; memory_gb 8 is the contract's
      maximum_memory_gb.
  completion_gate:
    - >-
      G1: every planned run (the s = 2 gate, the deciding cell, the ladder
      cells actually authorized by the stopping rules, the H-WIL check, the
      H-TOP check, the m = 3 secondary if gated open) has a run directory
      with a manifest carrying a terminal status and the six required
      files; runs not started because a stopping rule fired are listed by
      name with the rule.
    - >-
      G2: raw-result.json and the analysis tables agree; every residual is
      reproducible from the raw per-draw records and the frozen prediction
      file.
    - >-
      G3: every control is present and reported: NULL-1-SUPPORT-MATCHED,
      NULL-2-BLOCK-FACTORED, NULL-3-CURVE-TARGET-SCRAMBLE,
      CTRL-S2-HAND-FIXTURE, CTRL-H-WIL-DIRECT-RANK, NEARBY-MIXED-BLOCK,
      NEARBY-NON-MONOMIAL-TOP, CTRL-H-TOP-SYMBOLIC, and the
      CTRL-CONFOUNDERS-NAMED statement.
    - >-
      G4: every manifest carries the meter's commit and per-file sha256,
      the sha256 of stage0-predictions.yaml, the implementation commit and
      dirty-tree hash, seeds, parameters, timing, peak RSS, per-file sha256
      of the run package, certificate results, and the inference block.
    - >-
      G5: the execution report is returned with stopping rules triggered,
      every deviation, and the observed values against each frozen
      criterion stated as observation.
    - >-
      G6: nothing outside experiments/EXP-PFDR-5726af/ was written; no
      record was edited; no status changed.
  return_format: >-
    A short plain-text return listing: the run ids with terminal status;
    the s = 2 fixture result; the deciding-cell integers (d_ff, fall_dim)
    per Semaev draw, per NULL-2 seed, per NULL-1 seed; the mixed-block
    d_ff; the H-WIL table summary; the H-TOP result; ladder residuals if
    run; any stop rule triggered and where; which of G1-G6 are met and
    which are not, with reasons; the inference block values. Observations
    only; no claim about the hypothesis; no summary files outside the
    write scope.
  review_plan: null
  review_plan_note: >-
    The review round is opened by a later Coordinator handoff after the
    execution snapshot archive; validator and red-team run at
    review-adversarial (xhigh) in independent sessions before any evidence
    record is written.
