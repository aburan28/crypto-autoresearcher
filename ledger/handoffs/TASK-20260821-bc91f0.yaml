  review_plan_path: coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/review-plan/review-plan-2de43d.yaml
  review_plan_authority: >-
    THE FILE AT review_plan_path IS AUTHORITATIVE. The `review_plan` mapping
    below is a verbatim inline of that file's inner mapping, at +2 indentation
    and with no other change; on any divergence between the two, the FILE wins
    and the divergence is itself a defect to be recorded, never reconciled by
    editing either copy (both are immutable once committed; a correction is a
    new superseding record). Nothing reads the copy below in preference to the
    file: both reviewers' task cards and the dispatch queue point at the path,
    and `tools/check_review_independence.py --batch` reads the file.
  review_plan_placement_rationale: >-
    WHY THIS HANDOFF CARRIES THE PLAN, AND WHY THE TWO REVIEWER HANDOFFS DO NOT.
    `tools/validate_ledger.py` `check_review_plan` requires `review_plan`, when
    present, to be a MAPPING -- a path string is rejected. So the plan is either
    inlined somewhere or validated nowhere, and validated nowhere is the worse
    outcome: this is the check that confirms, before any reviewer runs, that
    every joint is owned exactly once, that each carries a worked attack plan,
    that the proves-too-much control names known-false objects, and that
    blind_from is non-empty. That is the coverage guarantee the review
    architecture exists for.
    IT IS INLINED ONCE, NOT THREE TIMES. Copying a frozen artifact into every
    envelope that is bound by it is the pattern this program deliberately does
    not use: TASK-20260821-372d67's envelope does not inline
    EXP-MDFIVE-a8e71e's contract either, it names the path, because an Executor
    -- and a reviewer -- is bound by a frozen contract AT A DECLARED PATH. Three
    copies of a plan create the possibility of two plans and no way to say which
    bound a reviewer, which is precisely what a pre-committed plan exists to
    rule out.
    IT IS INLINED ON THIS HANDOFF RATHER THAN ON THE SNAPSHOT
    (TASK-20260821-e2ffe4) BECAUSE OF WHEN, NOT WHERE. AGENTS.md requires the
    plan on "the handoff that OPENS a claim-changing review round", and e2ffe4
    is the operational gate -- its completion is what makes the reviewers
    eligible. But e2ffe4 runs AFTER the idea, the gate, and the executor, so a
    schema-validated copy sitting there could not show, from its placement
    alone, that the plan predates the results. The entire evidential value of
    `coordinator_prior` is that it separates "the reviewers concurred" from "the
    reviewers concurred with what the Coordinator already believed", and that
    separation is a fact about TIMING. This handoff is committed in the batch's
    opening commit, before any producer has run; the plan's own `written_by`
    already names TASK-20260821-bc91f0, and this handoff already declares
    review-plan-2de43d.yaml in its artifact_paths. Placing the validated copy
    here makes the pre-commitment legible from the record rather than only
    asserted in it. This handoff opens the round in the operative sense: no
    reviewer may be dispatched except under this plan, and this handoff's own
    completion_gate already requires the plan committed before either reviewer
    may run.
    TASK-20260821-2de43d and TASK-20260821-26ba34 therefore carry
    `review_plan: null` plus a `review_plan_path` pointer and this same
    reasoning; TASK-20260821-e2ffe4 carries the pointer at the gate it operates.

