    policy_routing_judgement: >-
      THIS ROUND ROUTES TO `review-adversarial` AT xhigh, NOT `review-breakthrough`
      AT max, AND THE JUDGEMENT IS RECORDED HERE RATHER THAN ASSUMED.
      AGENTS.md rule 12 and the model-policies routing rules reserve
      review-breakthrough for three things: a claim proposed as a BREAKTHROUGH, a
      CLOSURE result, or a CONTRADICTION between validated evidence records. This
      batch is none of them. It is an ordinary claim-changing round at bounded toy
      scale (MD4 Round 1, two free words, ~10-bit windows), whose claim ceiling is
      `analyzed` and can never be `supported` this batch (DEC-20260821-84a8f1
      claim_ceiling; DEC-20260821-1215e5 F-5). It proposes no goal closure -- the
      goal's method-ceiling completion criterion stays OPEN either way (F-6). It
      does not contradict a validated evidence record: it REPAIRS a construction
      whose defect a validated record (EV-MDFIVE-ab007d) already established.
      Paying the top tier for an ordinary validator pass is how claims end up
      unreviewed at all (AGENTS.md "Model policy"), so the escalation is spent
      where it is needed, not everywhere.
    policy_escalation_trigger:
      condition: >-
        IF the corrected instrument produces a result that CONTRADICTS
        EV-MDFIVE-ab007d's obstruction as that record scopes it -- e.g. the
        declared matching quantity at S=9, tuple position 1, is found to vary with
        word9 after all, or the k1=k2=4 gate PASSES on a construction that
        EV-MDFIVE-ab007d's obstruction predicts must fail -- then that IS a
        contradiction between validated evidence records under rule 12.
      consequence: >-
        The closing task TASK-20260821-6ce8a8 must NOT record a decision on it.
        It stops, records the contradiction, and the Coordinator commissions a
        SEPARATE `review-breakthrough` round at max effort in an independent
        session before any status moves. That policy may never be degraded or run
        on a backend that cannot reach max. This trigger is pre-committed here so
        that recognising it later is not a judgement call made under pressure to
        close.

    claim_under_review: >-
      AS ITS PRODUCERS WILL STATE IT, not as the Coordinator would restate it. The
      package at the TASK-20260821-e2ffe4 snapshot commit asserts, jointly:
      (a) IDEA-20260821-ea35d1 / H-MDFIVE-0ca596 / EXP-MDFIVE-a8e71e: that a
      NAMED corrected split-point / matching-quantity construction repairs ANOM-1
      -- i.e. its declared matching observable genuinely depends on BOTH free
      words -- and that all four KN-TECH-080 audits have been re-run against that
      NEW object;
      (b) TASK-20260821-372d67's execution report: that the mandatory k1=k2=4
      two-directional dependence gate was run FIRST, on the SAME observable and
      code path the declared-scale run uses, and PASSED (or FAILED, in which case
      the claim under review is only (a) plus the gate result, and every
      declared-scale claim below is absent by construction);
      (c) that the MD4 primary run produced an independently re-verifiable
      partial-preimage certificate at the declared bounded scale;
      (d) that the HEUR-H1 validation run constitutes H1's FIRST GENUINE TEST at
      this scale, and reports comparison statistics without concluding
      validated/refuted;
      (e) that any MD5 arm present is exactly the one the frozen contract named
      and identically bounded;
      (f) that every cost figure is labeled measured-or-modeled correctly and that
      NOTHING projects toward the ~2^64-block instrument-class gap;
      (g) that the whole package stays at or below claim tier `analyzed`.
      A FAILED GATE IS NOT A FAILED BATCH. If (b) fails, the reviewers review what
      exists -- (a), the gate result, and the honesty of the stop -- and joints
      whose subject did not occur are returned `not_applicable` with the reason,
      never quietly passed.

    coordinator_prior:
      recorded_before_any_report_returns: true
      recorded_before_any_producer_ran: true
      expectations:
        - id: P-R1
          joint: R1
          text: >-
            THIS IS MY STRONGEST AND MOST SPECIFIC PREDICTION, AND THE ONE I MOST
            WANT OVERTURNED. Reading harness/run_md4_ceiling.py's own algebra at
            BATCH-af29f6's snapshot: `forward_step((a,b,c,d), xk, s, t)` returns
            `(d, new_a, b, c)`, so in the after-step-9 state ONLY tuple position 1
            depends on the word consumed at step 9 (word8). `backward_step` returns
            `(old_a, old_b, old_c, old_d)` with old_b/old_c/old_d pass-throughs of
            its input and only `old_a` computed from the supplied word, so ONLY
            tuple position 0 of that same state depends on word9. IF THAT READING
            IS RIGHT, THE TWO FREE WORDS INFLUENCE DISJOINT COMPONENTS OF THE
            BOUNDARY STATE AT S=9, and the repair EV-MDFIVE-ab007d's
            resource_check names first -- "read tuple position 0 instead of the
            degenerate position 1" -- RELOCATES ANOM-1 ONTO WORD8 RATHER THAN
            CURING IT. In that case no single-register matching quantity at a
            one-step-separated split is jointly discriminating, and the
            constructions that could work are structurally different: match on
            BOTH components (a window on position 0 AND a window on position 1),
            or INCREASE THE SEPARATION between the free words so backward
            propagation through intervening fixed-word steps spreads the second
            word's influence into the register the first updated.
            I THEREFORE PREDICT: if IDEA-20260821-ea35d1 proposes the position-0
            swap ALONE, R1 BREAKS. If it proposes a both-components match or an
            increased-separation split, R1 HOLDS or HOLDS-WITH-NAMED-GAPS.
            THIS PRIOR IS A COORDINATOR READING OF MODULE SOURCE, NOT A MEASURED
            OR INDEPENDENTLY RECONFIRMED FACT (it is recorded as explicitly
            UNSETTLED in KN-TECH-bb7e9f, "Open, not settled"). A reviewer that
            refutes it -- showing position 0 IS jointly discriminating, or that
            the disjointness argument fails somewhere -- has produced one of the
            most valuable results available to this batch, and must report it as a
            refutation of the Coordinator's prior, not fold it into a pass.
        - id: P-R2
          joint: R2
          text: >-
            I expect R2 HOLDS-WITH-NAMED-GAPS. The specific failure I am watching
            for is AUDIT TEXT CARRIED FORWARD: IDEA-20260821-e46061's audit 1
            bottleneck claim (b) and its proof_obligation #2 are exactly what
            rested on the false assumption ANOM-1 falsified (red-team D1), and the
            cheapest way to look compliant is to re-file that text against a new
            object it was never derived for. I do NOT expect a missing or
            placeholder audit -- batch 4's audits were genuinely performed; the
            gap was depth, not presence.
        - id: P-R3
          joint: R3
          text: >-
            I expect R3 to be the joint most likely to carry a real defect after
            R1. HEUR-H1's frozen falsification_condition fired literally last
            batch and was ruled INVALIDATED rather than falsified (F-3), which is
            correct but sets a precedent that could be reached for again. The
            failure I am watching for is a post-hoc reading: an H1 label
            (validated / falsified / open) that the frozen text does not license,
            or a NEW falsification condition written after the data was seen
            without a versioned protocol_amendment (SC-9). "Consistent with, at
            this sample size" is the honest form; "confirms" is not.
        - id: P-R4
          joint: R4
          text: >-
            I expect R4 HOLDS-WITH-NAMED-GAPS. The `caveat_refs` manifest field
            (SC-5) is easy to forget, and the ~2^64 projection prohibition (SC-3)
            is easy to violate accidentally by writing one sentence comparing this
            batch's throughput to a birthday-search block count. I do NOT expect a
            deliberate overclaim; batch 4's prose was clean everywhere the caveat
            was needed.
        - id: P-R5
          joint: R5
          text: >-
            I expect R5 HOLDS. The break I am watching for is claim-tier creep by
            register rather than by assertion: language about "the MITM method
            against MD4/MD5" where the record supports only "this bounded
            Round-1 instrument at this declared slice". A corrected, genuinely
            two-free-word instrument is precisely the result most likely to invite
            that creep, because it finally does what it says.
        - id: P-V1
          joint: V1
          text: >-
            I expect V1 HOLDS. The gate is cheap, explicit, and pre-declared. Two
            failure modes I am watching for, both mechanical: (i) the gate run
            AFTER a declared-scale run (ordering is the whole point -- a gate that
            runs second is a caveat, not a gate); (ii) the gate run on a DIFFERENT
            observable or code path than the declared-scale run uses, which makes
            it a check on something else. A third, subtler one: a gate that varies
            both free words SIMULTANEOUSLY, which passes on a construction
            degenerate in one word and is therefore not the check at all.
        - id: P-V2
          joint: V2
          text: >-
            I expect V2 HOLDS if a certificate is claimed. At this declared bounded
            scale an honest implementation should find or fail to find a match
            deterministically and reproducibly. A certificate the validator's own
            independent recomputation cannot reproduce is BATCH-HALTING, not a soft
            gap.
        - id: P-V3
          joint: V3
          text: >-
            I expect V3 HOLDS mechanically -- batch 4's statistics were
            reproducible bit-for-bit by both reviewers. What I want from V3 that
            batch 4 could not give: a non-degenerate observable should show
            NON-ZERO VARIANCE across independent target draws. Zero variance was
            ANOM-1's empirical signature; if it recurs, V3 has found the gate
            passed on something it should not have, and that is a break, not a
            statistic.
        - id: P-V4
          joint: V4
          text: >-
            I expect V4 HOLDS, and it remains the joint I would bet on breaking if
            anything rule-shaped does. Quiet scope-widening is this program's
            standing highest-probability single defect, and "the MD5 arm ran a bit
            wider because it was cheap" is exactly its shape. An MD5 run present
            without a naming clause in the frozen contract, or at a larger scale
            than the MD4 arm, is BATCH-HALTING.
        - id: P-V5
          joint: V5
          text: >-
            I expect V5 HOLDS-WITH-NAMED-GAP, carrying forward DEFECT-1601d6-01:
            the pre-existing suite failure that status-regressed from 35/35 to
            37/1/1 under CPython 3.11 vs 3.12 in a byte-identical, unmodified
            harness/runner.py. That was accepted as disclosed and environmental
            (F-7) and is out of this batch's write_scope. If the failure mode
            CHANGES -- a different test, or the same test failing for a different
            reason -- that is new and in scope.
      if_the_review_overturns_the_prior: >-
        P-R1 is the prior I most expect to be informative either way and it is
        written down precisely so that both outcomes are legible. An overturn of
        P-R1 (position 0 IS jointly discriminating) is a first-class result of
        this batch and must be reported as an overturn of a recorded Coordinator
        prior, not absorbed into "the design was fine".
        BATCH-HALTING overturns, which stop the batch rather than being composed:
        V2 (a claimed certificate not independently reproducible), V4 (an MD5 run
        outside the frozen contract's named and identical bound), or discovery
        that a declared-scale run was executed BEFORE or WITHOUT a passing
        two-way-dependence gate (V1) -- that last one is the batch's own hard rule
        SC-2 and its breach voids the declared-scale observations entirely.
        A reviewer finding one of these reports it and stops; it does not
        compensate, repair, or soften it.

    joints:
      - joint: >-
          R1 CONSTRUCTION ADEQUACY -- does the NAMED corrected construction
          genuinely make the declared matching observable depend on BOTH free
          words, or does it merely relocate ANOM-1 onto the other word?
        assigned_to: TASK-20260821-2de43d
        attack_plan: >-
          DERIVE IT YOURSELF, FROM THE FROZEN CONTRACT AND THE RFC WORD SCHEDULE
          ALONE. Do not read the executor's module (it is in your blind_from).
          Write your own minimal Round-1 forward and backward step functions from
          RFC 1320's step table, in your own variable naming, and answer three
          questions in order: (1) which components of the boundary state at the
          NEW split point does the FORWARD chunk's free word influence? (2) which
          components does the BACKWARD chunk's free word influence? (3) is the
          DECLARED matching observable inside the intersection? Then build the
          MIRROR-IMAGE NULL: take the construction and swap which free word is
          held fixed. If the observable moves for one word and not the other in
          EITHER direction, R1 BREAKS. Run a POSITIVE CONTROL on each free word
          separately (the word the observable SHOULD depend on must produce
          distinct values) so that a uniformly non-discriminating apparatus cannot
          masquerade as a pass -- this is the control batch 4's red team used to
          confirm ANOM-1 was word9-specific and not general breakage. Sample the
          FULL 32-bit range, not just the declared window; a dependence that
          exists only outside the window is still a dependence and its absence
          inside is still a defect.
          THE COORDINATOR'S PRIOR P-R1 SAYS WHERE I THINK THIS BREAKS: at S=9 the
          two free words appear to influence DISJOINT components, so a bare
          position-0 swap should fail your mirror-image null. Refuting that is a
          result; confirming it is a result; agreeing with it without testing it
          is not.
        breaking_artifact: >-
          A concrete (free-word-A, free-word-B) sweep in which the declared
          matching observable is invariant in one of the two directions, with the
          positive control showing the apparatus discriminates in the other -- plus
          the algebraic reason, stated as a fact about the word schedule.
      - joint: >-
          R2 PROOF_SEARCH_MAP RE-RUN HONESTY -- are all four KN-TECH-080 audits
          genuinely RE-RUN against the NEW construction, and does audit 1's
          bottleneck claim now rest on a CHECKED assumption rather than an
          assumed one?
        assigned_to: TASK-20260821-2de43d
        attack_plan: >-
          Diff IDEA-20260821-ea35d1's proof_search_map against
          IDEA-20260821-e46061's, field by field. Any audit whose text is
          substantively unchanged is presumed CARRIED FORWARD until the idea shows
          it was re-derived for the new object -- say so explicitly per audit.
          Then attack audit 1 specifically: batch 4's bottleneck claim (b) ("lands
          the matching point on a register that was just updated, so the
          comparison is meaningful") and proof_obligation #2 (the k1=k2=6
          brute-force-equality control) BOTH silently assumed the returned
          state-tuple position tracks the free word's dependency, and both were
          false (red-team D1). Check whether the new map states that assumption
          EXPLICITLY and names how it is discharged -- the k1=k2=4 gate is the
          intended discharge; if the map still leaves it implicit, R2 breaks on
          the same defect twice. Check audit 2 (observation collision) actually
          searched rather than asserted none exist. Check audit 4's nearby-object
          prediction is stated BEFORE any run (fixed_before_acquisition), not
          fitted after.
          ALSO CHECK THE VACUOUS-CONTROL PATTERN: if the new proof_obligations
          again include a brute-force-equality control, verify it is not VACUOUS
          -- i.e. that the naive baseline and the MITM search do not read the same
          potentially-degenerate quantity, which would guarantee agreement
          regardless of whether the construction works.
        breaking_artifact: >-
          A named audit that is verbatim-or-equivalent carried forward, or an
          assumption that audit 1 still leaves unchecked, quoted from both
          records.
      - joint: >-
          R3 HEUR-H1 LABEL LICENSING AND CRITERION STABILITY -- is whatever the
          package says about H1 licensed by the frozen falsification_condition's
          own text, and did any success criterion move after outcomes were seen?
        assigned_to: TASK-20260821-2de43d
        attack_plan: >-
          Read H-MDFIVE-0ca596's H1 statement and falsification_condition as
          FROZEN TEXT, before reading any result. Write down, in advance, what
          each possible outcome would license. Then read the execution report's H1
          section and check the label against your own list. Three specific
          attacks: (i) does the report conclude "validated" or "refuted" at all?
          It must NOT -- executor.md forbids that composition; comparison
          statistics only. (ii) If the closing package or the gate decision
          applies a label, is it licensed by the frozen text, or is it batch 4's
          "invalidated by construction defect" move reached for a second time
          where it no longer applies (that ruling was licensed by ANOM-1; with a
          PASSING gate it is not available). (iii) Diff H-MDFIVE-0ca596's H1
          against H-MDFIVE-bf7767's: any change to the falsification condition,
          sample size, or statistic that is NOT accompanied by a versioned
          protocol_amendment is an SC-9 breach even if the new criterion is
          better.
        breaking_artifact: >-
          An H1 label the frozen text does not license, or a changed criterion
          with no protocol_amendment record, quoted side by side.
      - joint: >-
          R4 COST-MODEL HONESTY, CAVEAT CARRY-FORWARD, AND THE PROJECTION
          PROHIBITION -- is every cost number correctly labeled measured or
          modeled, does every citation of BATCH-af29f6 raw metrics carry the
          ANOM-1 caveat, and does anything project toward the ~2^64-block gap?
        assigned_to: TASK-20260821-2de43d
        attack_plan: >-
          Walk every cost-bearing table and sentence in the idea record, gate
          decision, and execution report row by row. Cross-check each number's
          label against which task produced it (6b78d4 = modeled, 372d67 =
          measured). Then run three targeted greps-by-hand: (i) every occurrence of
          2048, 1048576, 512, or R = 1.0 -- each MUST carry the ANOM-1 caveat
          (SC-4, KN-TECH-bb7e9f) or it is an overclaim regardless of arithmetic;
          (ii) every occurrence of 2^64, "birthday", "blocks/sec", or a
          multiplication of a throughput by a block count -- ANY extrapolation
          from this batch's or batch 4's throughput toward the instrument-class
          gap violates SC-3 and F-8, however hedged; (iii) if
          harness/run_md4_ceiling.py or any new sibling module was written or
          modified, confirm a `caveat_refs` field is present in its MANIFEST
          OUTPUT (SC-5, red-team required_controls D2) -- prose disclosure
