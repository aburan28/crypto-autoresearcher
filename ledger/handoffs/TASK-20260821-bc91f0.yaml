    blindness:
      mutual: true
      within_round: >-
        Two-reviewer round. TASK-20260821-2de43d (red team) and
        TASK-20260821-26ba34 (validator) run CONCURRENTLY and may not read each
        other's reports. Each attests `read_sibling_reports: false`. The two are
        deliberately given complementary instruments on the SAME central question:
        the red team re-derives the two-way dependence predicate BLIND, from the
        contract and the RFC alone; the validator REPLICATES the gate from the
        producer's own artifacts. Agreement between a blind re-derivation and a
        replication is evidence about the quantity; disagreement localises to one
        of two named implementations. That is the entire point of running both,
        and it is destroyed if either reads the other.
      lifted_for: []
      rationale: null
      no_quarantine_reads: >-
        No reviewer in this round reads the quarantined payload (SC-6). It is
        structurally irrelevant to this batch's method (MITM/preimage, not the
        differential collision path) and the standing hash-only gate carried from
        BCP-2 is unchanged. Both reviewers attest non-reading; the validator
        additionally re-confirms the sha256.
      attestation_required: >-
        Each report carries `review_attestation` with: task_id; joints_owned (the
        FULL joint text strings from this plan, copied exactly, so
        tools/check_review_independence.py can match them); sources_read (honestly
        and completely -- every path); read_sibling_reports (must be false);
        blind_from_respected (red team only, true means no path in blind_from was
        read, with a note if false); per-joint verdicts; a top-level `verdict`
        field (holds | breaks | inconclusive) for the joints owned; and the
        resolved model identifier alongside the requested policy
        (review-adversarial) and reasoning effort (xhigh).
      reviewers_report_on_their_own_joints: >-
        A blinded reviewer owns joints, not a vote. Neither report issues a
        whole-claim verdict; each reports on what it owns, and the Coordinator
        composes them at TASK-20260821-6ce8a8. A whole-claim verdict from one
        blinded reviewer is an opinion formed from half the evidence.

    proves_too_much:
      objects:
        - object: >-
            OBJECT M (MIRROR-IMAGE DEGENERATE CONSTRUCTION). A synthetic
            construction identical to the proposed one except that its matching
            observable is chosen so as to depend on the BACKWARD chunk's free word
            and provably NOT on the FORWARD chunk's free word -- i.e. ANOM-1 with
            the roles swapped. VERDICT KNOWN FALSE: the two-way-dependence gate
            MUST FAIL it, in the forward direction, at k1=k2=4. If the gate as
            specified or as implemented PASSES object M, the gate does not
            discriminate the failure it exists to catch, and every declared-scale
            result resting on it is unsupported regardless of what it found.
        - object: >-
            OBJECT N (PURE PASS-THROUGH OBSERVABLE). A synthetic matching quantity
            chosen as a register component that is a pass-through of BOTH chunks
            -- independent of both free words. VERDICT KNOWN FALSE: the gate must
            fail it in BOTH directions, and the search must report a fully
            saturated solution set (every candidate pair "matching"), which the
            contract's acceptance criterion must classify NOT ELIGIBLE. A saturated
            solution set reported as a large speedup is the failure signature.
        - object: >-
            OBJECT O (GAP-CLOSING PROJECTION). A synthetic cost-table row
            projecting toward the ~2^64-block instrument-class gap by multiplying
            this batch's or BATCH-af29f6's measured chunk-evaluation throughput by
            a birthday-search block count. VERDICT KNOWN FALSE: INVALID per
            DEC-20260821-1215e5 F-8 and SC-3, regardless of whether the arithmetic
            is correct, because the throughput's units and the gap's units are
            different quantities and the batch-4 anchor is a degenerate
            instrument's.
        - object: >-
            OBJECT P (UNCAVEATED RAW-METRIC CITATION). A synthetic record citing
            BATCH-af29f6's 2048 / 1048576 / 512x / R = 1.0 figures accurately but
            with no ANOM-1 caveat. VERDICT KNOWN FALSE: an overclaim per
            DEC-20260821-1215e5 F-4 and EV-MDFIVE-ab007d O-7, regardless of the
            numbers' accuracy -- the defect is the missing scope, not the value.
      failure_signature: >-
        A gate, contract, acceptance criterion, or reviewer that accepts M as
        passing, accepts N's saturated solution set as a speedup, accepts O as a
        legitimate projection, or accepts P's label as adequate HAS PROVED TOO
        MUCH and is wrong somewhere nobody has read closely enough. This is
        "controls before belief" applied to an argument rather than a
        measurement: object M in particular is the null object for the batch's own
        hard gate, and a gate that has never been shown able to FAIL has not been
        shown to work.
      assigned_to: TASK-20260821-2de43d

    blind_rederivation:
      required: true
      quantity: >-
        THE TWO-WAY DEPENDENCE PREDICATE. Given (target primitive, split point S,
        the declared matching-quantity SPECIFICATION, the two free-word indices,
        the fixed-word generation procedure and its seed, and the declared window
        widths) -> does the declared matching observable take more than one value
        as free word A varies with B held fixed, AND take more than one value as
        free word B varies with A held fixed? Derived from the FROZEN
        H-MDFIVE-0ca596 / EXP-MDFIVE-a8e71e statement of the matching quantity and
        the RFC 1320 step schedule ALONE -- never from the executor's
        implementation, the idea record's rationale, or any report of the gate's
        outcome.
        THIS IS THE BATCH'S OWN HARD GATE, WHICH IS EXACTLY WHY IT GETS THE BLIND
        RE-DERIVATION. Recomputing the gate from the producer's implementation
        reproduces a wrong-but-self-consistent gate faithfully, and that is
        precisely the failure that produced ANOM-1: every mechanical control in
        batch 4 passed, and every one of them was reading the same degenerate
        quantity.
      parameters: >-
        The frozen EXP-MDFIVE-a8e71e contract's declared parameters exactly as the
        producer used them: split point, free-word indices, k1/k2, matching-window
        width m, target width k, the fixed-word generation seed and procedure, and
        the primitive selector. Test inputs additionally include proves_too_much
        objects M and N, whose predicate values are known false.
      blind_from:
        - harness/run_md4_ceiling.py, and any new or modified sibling instrument module written by TASK-20260821-372d67 -- WHOLE FILE, not read at all by the re-deriver; write your own minimal implementation from the RFC
        - coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/tasks/TASK-20260821-372d67/execution-report.yaml -- the two-way-dependence-gate section, the gate outcome, and the narrative self-assessment sections
        - the run directories' raw-result.json and stdout for the gate run
        - coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/tasks/TASK-20260821-6b78d4/ -- the idea record's narrative rationale and "what this shows" sections (the STRUCTURED proof_search_map fields remain readable, being the object of joint R2)
        - coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/task-cards/TASK-20260821-6b78d4/task_card.yaml
        - coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/task-cards/TASK-20260821-372d67/task_card.yaml
        - ledger/handoffs/TASK-20260821-6b78d4.yaml
        - ledger/handoffs/TASK-20260821-372d67.yaml
        - coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/reviews/TASK-20260821-26ba34/ -- the sibling validator's report, under mutual blindness
      blind_from_scoping_note: >-
        THE SCOPING IS SECTION-LEVEL FOR TWO FILES AND WHOLE-FILE FOR THE REST,
        AND THAT CHOICE IS DECLARED RATHER THAN LEFT IMPLICIT. The instrument
        module is excluded ENTIRELY -- the re-derivation is worthless if the
        re-deriver reads the implementation it is checking. The execution report
        and idea record are excluded SECTION-WISE because joints R2, R3, R4 and R5
        require reading their structured content, and a whole-file exclusion would
        make those joints unassignable to the same reviewer. The excluded sections
        are exactly those that could transmit the producer's own answer to the
        predicate. The reviewer must COMPLETE AND WRITE DOWN the blind
        re-derivation BEFORE reading any non-excluded section of those two files,
        and must say so in its attestation; this ordering is part of the
        requirement, not a courtesy.
        Following the BATCH-af29f6 precedent, `blind_from_respected: true` in the
        attestation asserts that no listed path or section was read.
      assigned_to: TASK-20260821-2de43d
      why_not_the_validator: >-
        The validator owns V1, whose whole method is REPLICATION from the
        producer's artifacts -- it must read the module and the run records, so it
        cannot be blind from them. Assigning the blind re-derivation to the same
        agent would collapse the two instruments into one. Splitting them is what
        makes their agreement informative and their disagreement localisable.

    composition_rule: >-
      The Coordinator (TASK-20260821-6ce8a8) composes the two reports; neither
      reviewer votes on the claim. Before treating the round as complete, run
      `python3 tools/check_review_independence.py --batch
      coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa` and record its output.
      Every joint must be owned and attested, no undeclared sibling read, and no
      re-deriver whose declared sources intersect blind_from.

    procedure_deviations: []
    procedure_deviations_note: >-
      Any departure from this plan -- acting before a report returns, reassigning
      a joint mid-round, dropping a control, lifting blindness -- is RECORDED HERE
      rather than quietly absorbed. A departure may well be right in the moment;
      none of them is self-documenting, and a protocol that is silently deviated
      from is worth less than one never declared, because it still reads as
      rigorous.
