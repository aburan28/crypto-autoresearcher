          (linear-throughput scaling, memory-bandwidth omission,
          single-core-unoptimized-Python baseline) are explicitly flagged per
          CLAUDE.md promotion-gate 3.
        breaking_artifact: >-
          A gap-closing projection, an uncaveated raw-metric citation, a
          mislabeled measured/modeled figure, or a manifest missing `caveat_refs`
          on a touched module.
      - joint: >-
          R5 CLAIM-TIER CEILING AND SCOPE -- does anything in the package assert
          above `analyzed`, or generalise from this bounded Round-1 slice to the
          MITM method, to full MD4/MD5, or to the dependent goals?
        assigned_to: TASK-20260821-2de43d
        attack_plan: >-
          Read every claim-bearing sentence in IDEA-20260821-ea35d1,
          H-MDFIVE-0ca596, EXP-MDFIVE-a8e71e, the gate decision, and the execution
          report for language that reads as `supported`. Specifically hunt for the
          register shift from "this bounded instrument at this declared slice" to
          "the splice-and-cut MITM method" or "MD4" / "MD5" unqualified -- a
          corrected, genuinely two-free-word instrument is exactly the result most
          likely to invite that creep, because it finally does what it says.
          Check that the four promotion gates are assessed HONESTLY rather than
          rounded up: gate 2 in particular, where "H1 tested once at toy scale"
          must not be written as "H1 validated". Check the interpretation_limits
          and boundaries explicitly exclude transfer to full 48-step MD4, full
          64-step MD5, SHA-2, and every literature figure (2^96 / 2^102 / 2^116.9
          / 2^123.4, all UNVERIFIED provenance). Check nothing licenses the
          dependent goals (GOAL-SHA2-001, GOAL-SHA3-001, GOAL-BLAKE-001,
          GOAL-ASCON-001, GOAL-SIMSPK-001) to cite more than KN-TECH-bb7e9f allows.
        breaking_artifact: >-
          A quoted sentence asserting more than the declared bounded runs support,
          or a promotion-gate assessment that rounds an unmet gate up.
      - joint: >-
          V1 GATE EXECUTION INTEGRITY -- did the mandatory k1=k2=4 two-directional
          dependence gate actually run, FIRST, in BOTH directions separately, on
          the SAME observable and code path the declared-scale run uses?
        assigned_to: TASK-20260821-26ba34
        attack_plan: >-
          THIS IS REPLICATION FROM THE PRODUCER'S OWN ARTIFACTS, deliberately
          complementary to R1's blind re-derivation -- you may read the executor's
          module and run records; the red team may not. Four mechanical checks,
          each grounded in your own command output: (1) ORDER -- read the run
          directories' timestamps, manifest ordering, and the wrapper's own
          charging records, and establish that the gate run PRECEDES every
          declared-scale run. Ordering is the whole point; a gate that ran second
          is a caveat. (2) BOTH DIRECTIONS SEPARATELY -- confirm the gate varies
          free word A with B held fixed AND free word B with A held fixed, as two
          distinct sweeps. A single simultaneous sweep does NOT discharge it and
          is a FAIL of this joint even if the report calls it a pass. (3)
          OBSERVABLE IDENTITY -- confirm the gate reads the SAME declared matching
          observable, through the SAME function, that mitm_search reads at
          declared scale. Trace the call path yourself; do not accept the report's
          assertion. (4) RE-RUN IT -- invoke the gate cold from the snapshot
          commit with your own command and reproduce its reported verdict and
          counts exactly. IF THE GATE FAILED and the executor stopped, verify the
          stop was honest and complete: no declared-scale run directory exists,
          and the unspent budget is reported as unspent rather than reallocated.
        breaking_artifact: >-
          A declared-scale run whose artifacts predate or lack a passing gate run;
          a gate that sweeps both words at once; a gate reading a different
          observable or code path; or a verdict your cold re-run does not
          reproduce.
      - joint: >-
          V2 CERTIFICATE RE-DERIVATION -- is any claimed MD4 partial-preimage
          certificate independently reproducible from the frozen instrument, the
          declared scale, and the declared seed alone?
        assigned_to: TASK-20260821-26ba34
        attack_plan: >-
          RE-RUN, DO NOT READ. Reconstruct the declared target from the frozen
          contract's seed and procedure using YOUR OWN from-scratch Round-1
          implementation (as BATCH-af29f6's validator did -- that independent
          simulator is what made ANOM-1's confirmation definitional rather than
          empirical). Confirm the claimed witness reproduces both the declared
          partial target AND the full Round-1 output state, through a code path
          independent of the search. Then verify the certificate re-verification
          path the module itself ships is genuinely independent of the search
          (batch 4's `_reference_round1_forward` was; check the corrected module's
          is too, and say so from the source rather than from its docstring).
          A CERTIFICATE YOU CANNOT REPRODUCE IS BATCH-HALTING, not a named gap.
          If no certificate is claimed (ceiling report only), verify the ceiling
          report's counters are internally consistent: search space explored <=
          declared scale, and cost = ceiling if and only if the run halted.
        breaking_artifact: >-
          A claimed certificate your independent recomputation does not reproduce,
          or a re-verification path that shares code with the search.
      - joint: >-
          V3 HEUR-H1 STATISTICS AND THE VARIANCE SIGNATURE -- are the H1
          comparison statistics correctly computed from the raw counters, and does
          the observable show NON-ZERO variance across independent target draws?
        assigned_to: TASK-20260821-26ba34
        attack_plan: >-
          Recompute every reported H1 statistic bit-for-bit from the raw counters
          yourself -- collision counts, the predicted distribution's parameter,
          the goodness-of-fit statistic, the tail check, and the achieved sample
          size N (a halt before the declared N is a budget outcome, truthfully
          reported, not a defect). Then run the check batch 4 could not:
          COMPUTE THE VARIANCE of the matching-window count across independent
          target draws. Batch 4's was EXACTLY ZERO across 1000 draws -- that was
          ANOM-1's empirical signature, 112 standard deviations from a
          Poisson(256) prediction. A non-degenerate observable must show non-zero
          variance. IF VARIANCE IS ZERO OR NEAR-ZERO AGAIN, the gate passed on
          something it should not have and this joint BREAKS -- report it as a
          finding about the construction, not as a statistic. Verify the report
          states comparison statistics only and does not conclude
          validated/refuted.
        breaking_artifact: >-
          A statistic you cannot reproduce from raw counters, an unreported sample
          size, or a zero/near-zero variance signature recurring under a
          supposedly-corrected construction.
      - joint: >-
          V4 MD5-ARM SCOPE COMPLIANCE -- is every MD5 computation in the package
          exactly the one the frozen contract named and identically bounded, or is
          there none?
        assigned_to: TASK-20260821-26ba34
        attack_plan: >-
          Read the frozen EXP-MDFIVE-a8e71e contract's MD5 clause FIRST and write
          down its exact parameters. Then verify compliance FROM PRIMARY RUN
          ARTIFACTS -- command.txt, manifest.yaml, raw-result.json -- not from the
          execution report's narrative. Compare the MD4 and MD5 invocations field
          by field: they must be identical in every parameter except the ones the
          contract names as varying (the shift/constant table selector and the
          target seed). AN MD5 RUN PRESENT WITH NO NAMING CLAUSE IN THE CONTRACT
          IS BATCH-HALTING. AN MD5 RUN AT A LARGER SCALE THAN THE MD4 ARM IS
          BATCH-HALTING (SC-1, "never larger"). If the contract authorizes no MD5
          arm, verify ZERO MD5 computation occurred -- including in build-time
          self-checks and correctness fixtures. Batch 4 recorded exactly this
          ambiguity as DEFECT-1601d6-02 (an MD5-mode H2 fixture defensible but not
          literally named in the authorization text); check whether
          EXP-MDFIVE-a8e71e closed it by naming such fixtures explicitly, and
          report if it did not.
        breaking_artifact: >-
          An MD5 invocation absent from the frozen contract, wider than the MD4
          arm, or differing in a parameter the contract does not name as varying.
      - joint: >-
          V5 RUN-ARTIFACT, SEED, SUITE AND FIREWALL INTEGRITY -- do the run
          records satisfy AGENTS.md's Artifact Policy, do the seeds and fixed
          words match the frozen contract exactly, does the suite hold, and is the
          quarantine untouched?
        assigned_to: TASK-20260821-26ba34
        attack_plan: >-
          Per run directory: confirm the full run_wrapped artifact set is present
          (exact command, git commit and dirty-tree state, environment and
          dependency versions, input parameters and seeds, requested policy /
          backend / resolved model identifier and whether probe-verified,
          reasoning effort, fallback and degraded-requirement fields, stdout,
          stderr, raw machine-readable results, validity status and reason,
          timestamps and resource measurements). Confirm RAW AND SUMMARY AGREE:
          recompute the execution report's headline numbers from raw-result.json
          yourself; a discrepancy is a defect regardless of which is right.
          Confirm SEED INTEGRITY: regenerate the fixed words and the declared
          targets from the frozen contract's stated seeds and procedures with your
          own code and confirm byte-identity with what the runs used. Confirm the
          EXPECTED RUN COUNT: exactly the runs the contract declares, no more, and
          any superseded run preserved and marked invalid rather than deleted.
          Run the full test suite and report the exact pass/fail/skip counts
          against BATCH-af29f6's 37/1/1 baseline -- DEFECT-1601d6-01 (a CPython
          3.11-vs-3.12 environmental regression in an unmodified
          harness/runner.py) is ACCEPTED AS DISCLOSED and out of scope; a
          DIFFERENT failure, or the same test failing for a different reason, is
          new and in scope. Confirm no hashlib in the solver core. Independently
