handoff:
  id: TASK-20260907-0a8773
  recorded_at: '2026-09-07'
  goal_id: null
  goal_id_note: >-
    Mirrors experiments/EXP-ECDLP-6ac801/specification.yaml's own
    goal_id: null (RQ-ECDLP-78dbc5 and H-ECDLP-37dc01 are themselves unbound
    to a GOAL record; see H-ECDLP-37dc01.yaml goal_id_note and the
    contract's own goal_id_note). Not changed by this handoff.
  question_id: RQ-ECDLP-78dbc5
  batch_id: null
  batch_id_note: >-
    Written by the approval task TASK-20260907-7204ee, mirroring the
    identical precedent on EXP-ECDLP-612fb1 v2's own executor handoff
    (ledger/handoffs/TASK-20260906-5e78c7.yaml `batch_id_note`): the
    execution batch for this contract is not yet opened, so its batch id is
    assigned when that batch opens, and dispatch_queue and task_card below
    are null for the same reason. This task does not open a batch, write a
    dispatch_queue.json, or write a task_card.yaml -- a separate step
    handles that mechanics using this handoff.
  dispatch_queue: null
  task_card: null
  role: executor
  from: coordinator
  to: executor
  review_required: true
  objective: >-
    Implement and execute STAGE B (exact-basin generation) and STAGE C
    (analysis) of the approved, frozen contract
    experiments/EXP-ECDLP-6ac801/specification.yaml (status approved,
    approved_by coordinator, frozen true, execution_authorized true,
    version 1, per the approval recorded in TASK-20260907-7204ee and its
    companion decision DEC-20260907-9b1b02, once committed) EXACTLY as
    written: at N = 2^24 exact basins, a_grid = {1/16, 1/8, 3/16, 1/4},
    r = 2, T_sel = T/2 = 128, 5 seeds, compute for every (a, seed) cell the
    exact top-T_sel basin share and STATIC(T)_{r=2} exact coverage, apply
    the v2-contract-verbatim G3-style feasibility criterion, and report the
    per-a pass-count out of 5, the per-seed margins, and the crossing
    bracket per the contract's own `definitions.crossing point`. The
    a = 1/4 REPLICATION CONTROL is evaluated FIRST among the four a-values,
    before the three novel cells (1/16, 1/8, 3/16) are interpreted, exactly
    per the contract's `stopping_rules`; a control FAIL-to-reproduce
    EV-ECDLP-60e266's established G3 FAIL stops interpretation of the other
    three cells (see `invalidation_rules`). ZERO online re-selection
    (RESEL-L) arms are run: this is a closed-form-from-exact-basins
    measurement only, mirroring v1/v2's own Stage 0. REFUSE AND REPORT
    rather than run if, at dispatch time, specification.yaml is not
    `status: approved` AND `execution_authorized: true` -- do not proceed
    on a message or a stale read of this handoff alone; re-read the
    committed contract at dispatch (see `dispatch_authorization` below).
    STAGE A (the contract's own required, frozen blind re-derivation) is
    explicitly NOT this task's responsibility: it is assigned to the
    independent validator task TASK-20260907-80e198 under this approval's
    designation (per the contract's own `review_note`, which permits the
    same task that reviews this executor's Stage B/C output to also perform
    Stage A, provided the seal genuinely predates that reviewer's own
    reading of it). This executor writes only Stage B/C observations: it
    interprets nothing beyond what the contract's own criterion requires it
    to report, draws no hypothesis-level conclusion, and changes no status.
  uncertainty_reduced: >-
    Whether, at N = 2^24 (one scale up from the v2 Stage 0 a-scan's
    N = 2^20), the ORIGINAL clause (C1) claim (T_sel = T/2, r = 2) is
    genuinely G3-feasible at a = 1/16 and/or a = 1/8, where the true
    crossing point falls between a = 1/8 and a = 3/16, and whether the
    a = 1/4 replication control reproduces EV-ECDLP-60e266's established
    G3-INFEASIBLE result at the larger N. This executor produces the Stage
    B/C measurements only; the Coordinator decides after Stage A's sealed
    blind re-derivation and the dependent validator review are complete.
  inputs:
    - >-
      experiments/EXP-ECDLP-6ac801/specification.yaml (the frozen, approved
      contract -- the ONLY protocol; four gate fields plus an additive
      `approval_note` set by TASK-20260907-7204ee under the recorded user
      approval; every other byte byte-identical to the drafted contract)
    - ledger/hypotheses/H-ECDLP-37dc01.yaml (the specified hypothesis; status unchanged by execution; see the contract's own hypothesis_test_boundary_note for the additive boundary disclosure already committed)
    - ledger/questions/RQ-ECDLP-78dbc5.yaml (decision target, definitions and constraints)
    - ledger/decisions/DEC-20260906-bcc097.yaml (the RANK 1 next_action this contract implements)
    - ledger/evidence/EV-ECDLP-f6b3f5.yaml (the confirmed N = 2^20 Stage 0 margins this contract re-tests at N = 2^24)
    - "ledger/evidence/EV-ECDLP-60e266.yaml (the a = 1/4 replication-control anchor: G3 FAIL 10/10 seeds)"
    - >-
      experiments/EXP-ECDLP-612fb1/specification.v2.yaml `definitions` and
      `inputs.g3_gate_procedure` (reused VERBATIM by this contract's own
      `definitions` block; do not re-derive or re-word the feasibility
      criterion)
    - >-
      experiments/EXP-ECDLP-612fb1/source_v2/ (the instrument and
      exact-basin implementation this contract's `instrument` field
      permits Stage B to reuse by explicit, commit-pinned citation in this
      task's own manifest -- reusing it is permitted, but the REQUIRED
      blind re-derivation, Stage A, may NOT read this path; that
      restriction binds TASK-20260907-80e198, not this task)
  constraints:
    - >-
      FROZEN CONTRACT. Any needed change to any field of
      specification.yaml is a further versioned protocol_amendment
      proposed to the Coordinator -- NEVER an inline edit, and never a
      re-score of an executed run.
    - >-
      FRESH IMPLEMENTATION PATH: experiments/EXP-ECDLP-6ac801/source/ -- a
      path distinct from every prior experiment's own source directory.
      Per the contract's own `instrument` field this task MAY cite/reuse
      experiments/EXP-ECDLP-612fb1/source_v2/'s exact-basin code by an
      explicit, commit-pinned reference in this task's own run manifests,
      rather than re-implementing the exact-basin enumeration from scratch;
      either way, one code path for this experiment's own arms, hash-pinned
      by commit in every run manifest.
    - >-
      FRESH RUN DIRECTORY, FRESH RUN IDS: run records go under this
      experiment's own experiments/EXP-ECDLP-6ac801/runs/ directory (never
      any prior experiment's runs/ directory), using fresh RUN-* ids that
      NEVER collide with any prior experiment's own run ids (v1's
      RUN-ECDLP-612fb1-*, v2's RUN-ECDLP-612fb1-v2-*, or any other
      experiment's). This task does not touch, edit, or re-score any prior
      experiment's run records.
    - >-
      STAGE ORDER IS BINDING: the a = 1/4 replication control is evaluated
      FIRST among the four a-values, before the three novel cells (1/16,
      1/8, 3/16) are interpreted, per `stopping_rules`. If the control
      fails to reproduce EV-ECDLP-60e266's G3-INFEASIBLE (i.e. scores
      >= 4/5 PASS at a = 1/4), STOP interpreting the other three cells and
      report an instrument mismatch per `invalidation_rules` /
      `distinguishable_outcomes` (d); do not proceed to report a = 1/16,
      1/8, 3/16 verdicts as if the instrument were confirmed sound.
    - >-
      ZERO ONLINE RE-SELECTION ARMS: only two exact-coverage readings per
      (a, seed) are computed -- STATIC(T)_{r=2} exact coverage and the
      exact top-T_sel (= T/2) basin share. No ORACLE, RESEL-L, NULL-A, CAP,
      RHO, or STATIC2T arm is run this contract (see `out_of_scope`).
    - >-
      G3-STYLE FEASIBILITY CRITERION APPLIED VERBATIM: per-a verdict is
      >= 4 of 5 seeds with exact top-T_sel share >= STATIC(T)_{r=2} exact
      coverage; this is REUSED VERBATIM from
      experiments/EXP-ECDLP-612fb1/specification.v2.yaml
      `inputs.g3_gate_procedure` (control (d)) -- do not re-derive or
      re-word it independently, to keep the units/definition identical to
      the original discrepancy's own reading.
    - >-
      EXACT-COVERAGE NON-EXCEEDANCE (control (c)): no exact top-T_sel share
      may exceed 1.0 or the exact top-T share; an exceedance stops that run
      as completed_invalid (implementation error) and is reported
      immediately, never folded into the a-value's pass-count.
    - >-
      DETERMINISTIC SEEDS: 5 seeds per a (seeds 1-5), matching Stage 0's
      and v2's own seed count and seed policy; a duplicated or missing
      seed invalidates the cell.
    - >-
      STAGE A IS OUT OF THIS TASK'S SCOPE: the contract's own REQUIRED,
      FROZEN blind re-derivation (Stage A) is performed by the independent
      validator task TASK-20260907-80e198, not by this executor. This task
      never seals a blind re-derivation artifact and never claims to.
    - >-
      RUN RECORDS are immutable under experiments/EXP-ECDLP-6ac801/runs/<RUN-ID>/:
      manifest.yaml with the exact command, git commit and dirty-tree
      state, environment and dependency versions, requested policy,
      resolved model identifier and fallback flag, all seeds, wall clock,
      peak_rss_bytes; raw-result.json with exact basin-size data sufficient
      to recompute the top-T_sel share and STATIC(T) coverage
      independently, per (a, seed); summary.json with the per-(a, seed)
      share, coverage, margin, and per-a pass-count. A defective run is
      superseded by a new run record, never edited.
    - >-
      WALL CLOCK IS INFRASTRUCTURE ACCOUNTING ONLY, never a decision
      variable; this is an exact-enumeration measurement (no online walk
      counted-operation charging applies, per the contract's own
      `cost_model`).
    - >-
      A TIMEOUT (3600 s per run), crash, memory exhaustion, or dependency
      failure is failed_infrastructure and is NEVER a result, positive or
      negative (AGENTS.md rule 5; contract `invalidation_rules`); report it
      as such and re-plan with a smaller shard within the contract's spare
      runs, never interpreted.
    - >-
      ZERO INTERPRETATION BEYOND THE CONTRACT'S OWN CRITERION LANGUAGE: no
      hypothesis-level conclusion, no status change, no ledger write (no
      EV-*, DEC-*, H-*, or KN-* record); this task writes only inside its
      write_scope.
    - >-
      NETWORK: none required by the contract for execution.
  deliverables:
    - >-
      experiments/EXP-ECDLP-6ac801/source/ (the fresh implementation path;
      may cite experiments/EXP-ECDLP-612fb1/source_v2/ by commit-pinned
      manifest reference, per constraints above)
    - >-
      experiments/EXP-ECDLP-6ac801/runs/RUN-*/ (fresh run ids, never
      colliding with any prior experiment's run ids): one immutable run
      record per executed run -- manifest.yaml, raw-result.json,
      summary.json -- covering the a = 1/4 control (evaluated first) and
      the a in {1/16, 1/8, 3/16} cells, all at r = 2, T_sel = T/2, 5 seeds
    - >-
      the Stage C analysis output: per-(a, seed) margins (share minus
      coverage), per-a pass-count out of 5, the G3-style verdict at each a,
      the crossing bracket determination per `definitions.crossing point`,
      and the a = 1/4 control's comparison against EV-ECDLP-60e266
    - >-
      execution_report.yaml and artifact_inventory.json in the execution
      batch's own future task directory (path TBD -- assigned when that
      execution batch opens, mirroring TASK-20260906-5e78c7's own
      precedent)
  artifact_paths:
    - experiments/EXP-ECDLP-6ac801/source/
    - experiments/EXP-ECDLP-6ac801/runs/
    - execution_report.yaml and artifact_inventory.json (execution batch task directory, path TBD when that batch opens)
  archived_by: TASK-20260907-11d3d6
  write_scope:
    - experiments/EXP-ECDLP-6ac801/runs/
    - experiments/EXP-ECDLP-6ac801/source/
    - the execution batch task directory (assigned at dispatch)
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 3600
    memory_gb: 8
    maximum_runs: 8
  contract_budget_envelope:
    wall_clock_seconds_per_run: 3600
    total_cpu_hours: 1
    maximum_memory_gb: 8
    maximum_runs: 8
    maximum_workers: 1
  budget_note: >-
    Copied directly from specification.yaml's own `budget` block
    (enforcement advisory): wall_clock_seconds_per_run 3600, total_cpu_hours
    1, maximum_memory_gb 8, maximum_runs 8, maximum_workers 1. Per the
    contract's own `budget_note`: up to 5 execution runs (one per seed,
    sweeping all 4 a-values internally per seed) + 1 analysis run (Stage C)
    + 2 spare for recorded infrastructure re-runs = maximum_runs 8. These
    are advisory estimates per docs/research-budget-policy.md and CLAUDE.md
    "Research budgets: progress first": they require no repeated approval
    to revise upward if the actual run needs more, and are not a gate on
    this handoff's validity.
  completion_gate:
    - >-
      The a = 1/4 replication control is evaluated and reported FIRST,
      before any of the three novel cells (1/16, 1/8, 3/16) is interpreted.
    - >-
      The G3-style feasibility criterion (>= 4/5 seeds, exact top-T_sel
      share >= STATIC(T)_{r=2} exact coverage) is applied identically,
      verbatim, at every (a, seed) cell; per-seed margins and per-a
      pass-counts are reported.
    - >-
      The crossing bracket is reported per `definitions.crossing point`,
      or reported plainly as "not confirmed at this N" if the pattern does
      not cleanly bracket.
    - >-
      No exact top-T_sel share exceeds 1.0 or the exact top-T share at any
      cell (control (c)); any exceedance is reported immediately as
      completed_invalid, not folded into a pass-count.
    - >-
      Every required artifact of the contract is present for every
      executed run: schema-complete manifest, raw-result.json,
      summary.json, and the Stage C analysis output.
    - >-
      execution_report.yaml and artifact_inventory.json are present in the
      execution batch's task directory, with run inventory, gate values
      per (a, seed) cell, exhaustion and infrastructure events, validity
      per run, resource measurements, and stages not reached (if
      budget-exhausted or if the a = 1/4 control fails, reported as
      exhaustion or instrument mismatch, never as a negative).
  review_reservation: >-
    Results of this task are CLAIM-RELEVANT (review_required: true),
    exactly mirroring TASK-20260906-5e78c7's own review_reservation
    pattern. On dispatch the execution batch's task card must carry a
    reserved snapshot-archive task (TASK-20260907-11d3d6) and a dependent
    Validator task (TASK-20260907-80e198) that performs BOTH the contract's
    own required Stage A blind re-derivation AND the review of this
    executor's Stage B/C output (comparing blind vs. production cell by
    cell, confirming the a = 1/4 replication control, and checking that the
    G3-style criterion was applied identically to the v2 contract's own
    wording). NO RUN UNDER THIS HANDOFF IS EVIDENCE before that chain --
    the snapshot archive, the independent validator's sealed blind
    re-derivation and comparison report, and a Coordinator ledger archive
    with the evidence and decision records -- has completed and been
    verified.
  dispatch_authorization: >-
    Written by the approval task TASK-20260907-7204ee. Dispatched ONLY by
    the execution batch opened AFTER this contract's approval is committed
    and merged to main, so the Executor starts from the approved, frozen
    contract on the base branch. At dispatch time the Executor MUST
    re-read experiments/EXP-ECDLP-6ac801/specification.yaml on the base
    branch and refuse if it is not `status: approved` and
    `execution_authorized: true`. A message or in-session word is never an
    approval; this handoff plus the committed contract are.
