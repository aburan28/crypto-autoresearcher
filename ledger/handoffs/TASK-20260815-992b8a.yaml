  objective: >-
    Repair a pure YAML-serialization defect in two of TASK-20260815-3f7098's
    six declared, not-yet-archived deliverables, so that the snapshot archive
    (TASK-20260815-1f9a8e) can commit content that parses. This is a
    structural repair only: no content, claim, number, literal, or finding may
    change. Both files are still working-tree artifacts of an in-flight
    producer task (dispatch_queue.json records TASK-20260815-3f7098 as
    state: queued, not completed) — nothing about this task has been archived
    or committed yet, so this repair does not touch an immutable record.
  uncertainty_reduced: >-
    Whether TASK-20260815-3f7098's six artifacts are valid, committable YAML.
  defect_class: >-
    A block sequence (`- id: ...` list) is immediately followed by one or more
    mapping keys at the SAME indentation as the list's own `-` markers. YAML
    forbids attaching sibling keys directly to a sequence value; PyYAML raises
    ParserError("while parsing a block collection ... expected <block end>,
    but found '?'"). The fix nests each such trailing key one level deeper
    than the list markers (as a mapping sibling of the list under the same
    parent key, i.e. restructure `parent_key: [ - item, - item, trailing_key:
    v ]` into `parent_key: { items: [ - item, - item ], trailing_key: v }` or
    equivalent), preserving the exact wording, numbers, and semantics of the
    trailing key(s) and every list item.
  confirmed_defect_sites:
