      line: 707
      sibling_key: disposition_note
      list_started_line: 695
      note: >-
        The sole defect in this file — verified by an independent structural
        scan for every same-indent-as-list-marker sibling key in the whole
        document, and confirmed to make the file fully parse when only this
        site is fixed.
    - file: coordination/goals/GOAL-ECDLP-001/batches/BATCH-86fd69/tasks/TASK-20260815-3f7098/design-repair-report.yaml
