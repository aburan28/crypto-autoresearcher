handoff:
  id: TASK-20260802-cd08cd
  from: coordinator
  to: validator
  objective: 'Independently verify all three producer packages against their frozen contracts: re-run
    the code yourself, recompute every reported statistic, check each control''s verdict against the evidence
    actually present, and verify the bibliographic provenance hashes against the sources claimed.'
  uncertainty_reduced: Whether the batch's results are admissible evidence and whether the reported numbers
    follow from the raw data.
  inputs:
  - Both frozen specifications and both run packages
  - The bibliographic report and retrieval log
  - coordination/goals/GOAL-P13-001/batches/BATCH-004/archives/TASK-20260802-e83f4d/snapshot_commit_receipt.json
  constraints:
  - 'Independent session: you did not produce these artifacts. Do not edit them.'
  - Judge against the FROZEN contracts, not against what the runs happen to have done. Any deviation is
    a finding whichever direction it favours.
  - Verify experiments/EXP-PEC-49c773/ and experiments/EXP-PEC-6be870/ are byte-unchanged. A batch that
    quietly edits superseded evidence is an integrity failure.
  - Recompute every headline statistic with your own code. A number you cannot reproduce is a finding.
  - 'On the Heuristic 1 run, check the NULL OBJECT specifically: a signal that survives its null is an
    artifact, and a control labelled pass whose supporting data is absent or degenerate is a finding.'
  - On the bibliographic report, verify each recorded hash against the recorded source and check that
    no figure is cited without provenance. A recollected constant presented as retrieved is the most damaging
    error available here.
  - Missing evidence is reported as incomplete or invalid, never reconstructed.
  - Record requested_policy, resolved model identifier, fallback_used, and degraded_requirements.
  - You change no research status.
  deliverables:
  - validation_report.yaml with a terminal verdict and a per-control, per-package verdict table
  artifact_paths:
  - coordination/goals/GOAL-P13-001/batches/BATCH-004/reviews/TASK-20260802-cd08cd/validation_report.yaml
  archived_by: TASK-20260802-375cd8
  goal_id: GOAL-P13-001
  batch_id: BATCH-004
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: true
    independent_session_required: true
  completion_gate:
  - A machine-checkable validation report with a terminal verdict per package and an explicit verdict
    for every pre-registered control.
