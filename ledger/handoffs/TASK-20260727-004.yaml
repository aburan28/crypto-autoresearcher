handoff:
  id: TASK-20260727-004
  from: coordinator
  to: coordinator
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-009
  authorized_by: DEC-20260727-002
  task_kind: archive
  archive:
    kind: snapshot
    source_task_ids:
      - TASK-20260727-002
      - TASK-20260727-003
    commit_sha: null
    parent_sha: null
    path_sha256: {}
    record_ids:
      - BATCH-009
      - TASK-20260727-002
      - TASK-20260727-003
  objective: >-
    Commit the exact TASK-20260727-002 and TASK-20260727-003 artifacts, unmodified, as
    one isolated snapshot commit, so that the Coordinator determination in
    TASK-20260727-005 acts on committed review outputs rather than on working-tree text.
  uncertainty_reduced: >-
    Whether the two independent review outputs are durable and hash-bound before any
    decision rests on them.
  inputs:
    - the two exact TASK-20260727-002 artifacts
    - the two exact TASK-20260727-003 artifacts
    - docs/dynamic-subagent-dispatch.md, "Commit and ledger gate"
    - templates/research-records.md, "Coordinator archive receipt"
  constraints:
    - Run alone. No other task may hold the Git index or HEAD.
    - Stage ONLY the five declared paths (four source artifacts plus this receipt).
      Preserve unrelated dirty files. Do not stage macOS AppleDouble siblings (._*).
    - Do not edit, reformat, normalise or summarise any producer artifact. A snapshot
      commits what the producer wrote, verbatim.
    - Compute every SHA-256 from Git object content at the resulting commit, never from
      the working tree. Never invent, estimate or back-fill a hash or commit sha; a value
      that cannot be computed stays null and is reported as such.
    - >-
      The commit message must contain the literal string TASK-20260727-004 and every
      entry of archive.record_ids. BATCH-004's ledger archive is permanently blocked at 7
      of 8 checks for exactly this omission; do not repeat it.
    - >-
      Run the full post-commit check — the commit resolves, is an ancestor of HEAD, has
      the declared first parent, changes exactly the declared paths with no extras and no
      deletions, matches every recorded SHA-256, and the message contains the task id and
      every record id — and record the per-check result.
    - If any check fails, record the failure and stop. An archive failure is an
      evidence-integrity failure, never a mathematical result.
    - Change no ledger record and no research status. This is a commit task.
  deliverables:
    - >-
      snapshot_commit_receipt.json with kind snapshot, source_task_ids, record_ids, the
      declared paths, commit_sha, parent_sha, a complete path_sha256 over all five paths
      computed from Git object content, and a post_commit_verification block giving the
      per-check result and one verdict.
  artifact_paths:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/archives/TASK-20260727-004/snapshot_commit_receipt.json
  write_scope:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/archives/TASK-20260727-004/
  archived_by: TASK-20260727-004
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 600
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
    - Exactly the declared paths were staged and committed, with no extras and no
      deletions.
    - Every SHA-256 was computed in this task from Git object content; no value was
      copied from an unverified source.
    - The commit message contains the literal TASK-20260727-004 and every
      archive.record_ids entry.
    - The post-commit verification block records a result for each required check and one
      verdict.
    - No producer artifact was modified and no ledger record or research status was
      touched.
  return_format: Coordinator snapshot archive receipt JSON with a per-check post-commit
    verification block.
