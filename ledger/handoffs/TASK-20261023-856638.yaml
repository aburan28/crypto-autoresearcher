    claim_under_review: 'Let E/F_p be ordinary with #E(F_p) = p and End(E) the maximal order of a class-number-one
      field, so its Serre-Tate canonical lift E_can/Z_p is the explicit integral CM model. For a lift E^/Z_p of
      E and any point lift P^ of P in E(F_p), write z = -X/Y for the formal parameter of [p]P^. Then v_p(z([p]P^))
      >= 2 if and only if v_p(j(E^) - j(E_can)) >= 2e, where e is the ramification index of the j-map at j(E_can)
      (e = 3 at j = 0, e = 1 otherwise). Consequently Smart''s precision-p^2 attack recovers d from (P, dP) for
      EVERY point lift when v_p(j(E^) - j_can) < 2e, and for NO point lift on the canonical lift (or on any lift
      with v_p(Delta j) >= 2e); on those degenerate lifts the next digit, z([p]Q^)/z([p]P^) read at precision p^3,
      equals d at the random rate 1/p.'
    coordinator_prior: 'I expect the rule to hold as a restatement of Serre-Tate theory (the experiment can confirm,
      not discover), the non-split recovery to be Smart''s theorem, and the split-lift rate to sit at 1/p. The likeliest
      break is scope: 29 class-number-one curves with p <= 1500 may be read as covering all lifts of all anomalous
      curves. This is a prior, not an outcome.'
    joints:
    - id: R1
      joint: The measurements support H-CZLIFT-889c9d exactly as stated, at the stated scope (class-number-one CM
        anomalous curves, p <= 1500, four lift classes, three sections), and the rule is a measured agreement between
        two independent instruments rather than a tautology.
      assigned_to: TASK-20261023-856638
      attack_plan: Derive from the hypothesis whether v_p(z([p]P^)) >= 2 and v_p(j - j_can) >= 2e can disagree at
        all; if they cannot, the agreement rate measures implementation, not mathematics. Check the e = 3 case at
        j = 0 and the boundary v = 2e lifts (the D = -43, p = 11 lift in VAL-20261022-3232db). State what scope
        the evidence covers and what it does not (non-CM anomalous curves, higher class number, other precisions).
      breaking_artifact: A derivation that the two sides are identically equal (so agreement is uninformative),
        or a lift class outside the tested set where the rule fails.
    - id: R2
      joint: The split-lift success rate is compared with the right null and the test has the power the claim needs.
      assigned_to: TASK-20261023-856638
      attack_plan: Compute the excess over 1/p the |z| <= 4 test could have excluded with 5256 degenerate samples
        per seed; compare with the rate any useful attack would need. Check whether Teichmuller's below-rate z =
        -2.74 / -1.84 (validator observation) is a reduction artifact or a real deficit.
      breaking_artifact: A plausible leaking section whose rate the test could not have distinguished from 1/p,
        or a definition under which the null is wrong.
    blindness:
      mutual: true
      lifted_for:
