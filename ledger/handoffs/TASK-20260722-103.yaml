handoff:
  id: TASK-20260722-103
  from: coordinator
  to: red-team
  objective: >-
    Independently try to falsify the proposed mechanism's novelty, oracle
    model, asymptotic accounting, source completeness, and path to a
    cryptographic-scale advantage.
  uncertainty_reduced: >-
    Whether the candidate survives known lower bounds, prior scoped negatives,
    hidden preprocessing, supplied witnesses, and incomplete ECDLP accounting.
  inputs:
    - TASK-20260722-101 immutable snapshot
    - knowledge/INDEX.md
    - ledger/FINDING-PF-IC-001.md
  constraints:
    - Preserve exact claim scope and distinguish absence of construction from impossibility.
    - Require a cheaper decisive gate before any large run.
    - Change no producer artifact or official state.
  deliverables:
    - red_team_report.yaml
    - falsification_review.md
  artifact_paths:
    - coordination/goals/GOAL-CRYPTO-001/batches/BATCH-001/tasks/TASK-20260722-103/red_team_report.yaml
    - coordination/goals/GOAL-CRYPTO-001/batches/BATCH-001/tasks/TASK-20260722-103/falsification_review.md
  archived_by: TASK-20260722-104
  inference:
    policy: review-xhigh
    fallback_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 1800
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
    - Every claimed exponent and oracle is independently reconstructed.
    - The verdict names the narrowest surviving uncertainty and next gate.
