  batch_id: BATCH-2b0fd1
  task_card: coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/task-cards/TASK-20260810-4a478d.md
  role: coordinator
  from: coordinator
  to: coordinator
  objective: >-
    Author the three RANK 1 protocol items: (a) a frozen, independently
    reviewable cost model CM-1 fixing all six elements (a)-(f) of RQ-AES-002
    claim_tier_ceiling R2 for AES-128/192/256; (b)
    protocol-amendment-GOAL-AES-002-001 resolving blocker BLK-1 by adding a
    key_recovery certificate kind to docs/claims-and-verification.md with the
    corresponding check_run change in tools/validate_ledger.py, both specified
    exactly in the amendment; and (c) the adoption record binding the
    amendment-005 Part B clock convention and the amendment-004/005 provenance
    gate from this batch.
  uncertainty_reduced: >-
    Whether this campaign can state a cost comparison in a single adjudicable
    unit at all, and whether a conforming run record could ever emit an AES
    key-recovery certificate. Both are currently NO, and both gate every later
    card: until CM-1 is committed RQ-AES-002 forbids dispatching any
    cryptanalytic measurement or cost claim, and until BLK-1 is resolved no card
    that could produce a solve may be dispatched at all.
  inputs:
    - RQ-AES-002
    - GOAL-AES-002
    - DEC-20260810-ba50dc
    - protocol-amendment-GOAL-AES-001-004
    - protocol-amendment-GOAL-AES-001-005
    - docs/claims-and-verification.md
    - tools/validate_ledger.py
  constraints:
    - >-
      SC-1 C2 STAMP DUTY. As its FIRST act, before any research work, this task
      writes a stamp record carrying start_utc, start_epoch,
      declared_wall_clock_seconds and a binding_stop_utc COMPUTED as start plus
      declared; writes a further stamp at EACH major section boundary carrying
      utc, elapsed_s and a marker naming what was completed; HALTS at
      binding_stop_utc, records halted_on_budget truthfully and NAMES the work
      dropped; and COMMITS those stamps as a declared artifact, carried as a
      budget block inside this task's designated covering manifest. The
      TASK-20260801-810 budget block is the reference implementation. A halt at
      binding_stop_utc is INFRASTRUCTURE SIGNAL, never a negative mathematical
      result (AGENTS.md rule 5), and dropped work is SCOPE, never an answer
      (rule 8).
    - >-
      SC-2 C4 DECLARATION BASIS. The declared wall_clock_seconds is calibrated
      against AUTHORING-INCLUSIVE session elapsed; the compute component is
      reported SEPARATELY in its own field and may NOT be offered as evidence of
      budget compliance. Discharging SC-1 is FULL compliance even if the charged
      figure later exceeds the declaration, and any residual is a campaign-side
      accounting fact, never a producer defect.
    - >-
      SC-3 COVERING MANIFEST AND CLOSED CLASS VOCABULARY. Every declared
      source-code artifact carries a comment-block inference stanza in its own
      text. AT LEAST ONE machine-readable manifest of this task, DESIGNATED THE
      COVERING MANIFEST by this task's card and by the manifest itself, carries
      an artifact_provenance list covering EVERY declared artifact of the task,
      and EVERY OTHER manifest of the task appears as an ENTRY in it, with fields
      path, kind, sha256, comment_block_inference_stanza (boolean, stated
      honestly including when false) and
      covered_by_this_manifest_inference_block (boolean). A self-referential
      digest is impossible and is recorded as SELF. The kind vocabulary is CLOSED
      and CASE-INSENSITIVE - SOURCE_CODE, MACHINE_READABLE_MANIFEST,
      PROSE_REPORT, LEDGER_AND_COORDINATION_RECORD - matched ignoring
      underscore/hyphen/space differences; no fifth class may be invented, a
      value outside the vocabulary is a DEFECT TO REPORT, and any
      machine-readable structured-data artifact resolves to
      MACHINE_READABLE_MANIFEST.
    - >-
      SC-4 THE R5 ANTI-LAUNDERING CLAUSE, QUOTED VERBATIM FROM RQ-AES-002 AND
      BINDING AS A COMPLETION GATE ON EVERY DELIVERABLE OF THIS TASK: "R5. THE
      ANTI-LAUNDERING CLAUSE. Any record, in any location, that states a margin
      MUST in the SAME SENTENCE (i) name the reference as exhaustive key search
      at the stated key size under CM-1, and (ii) declare the
      published-state-of-the-art comparison UNADJUDICABLE in this environment.
      Transcribing a definitional-reference margin as a state-of-the-art margin
      — in a headline, an evidence record, a decision, a synthesis, a status
      line, a cross-reference, a knowledge entry, a PR title or a commit message
      — is a CLAIM-TIER VIOLATION and is handled exactly as
      docs/claims-and-verification.md handles dropping a conditional qualifier:
      as an assertion above what the record supports. OPERATIONALLY, under
      docs/inventor-protocol.md section 5: every ideation and closure deliverable
      under this question sets `dominated_by: "unresolvable in this environment:
      no primary source reachable; every recalled frontier row is
      unverified-from-memory"` and NEVER `null`, because `null` asserts the
      frontier was checked row by row and it cannot be. `sota_delta` records the
      DEFINITIONAL-REFERENCE delta, explicitly labelled as such, plus the word
      `unadjudicable` for the published frontier."
    - >-
      SC-5 NO RECALLED LITERATURE FIGURE MAY BE CITED AS AUTHORITY, IN EITHER
      DIRECTION. A recalled figure may be named as context with its status
      declared, and may never be used to compare, rank, screen, size, promote or
      DISMISS anything. Using an unverified recollection to dismiss is the same
      fabrication as using it to promote.
    - >-
      SC-6 NO COMPARISON AGAINST THE PUBLISHED STATE OF THE ART IS ASKED FOR OR
      ADMITTED. It is unadjudicable in this environment in both directions; the
      only quantitative reference this campaign may use is the DEFINITIONAL
      exhaustive-key-search reference under CM-1.
    - >-
      SC-7 EVERY DELIVERABLE STATING A MARGIN CARRIES THE R5 CLAUSE IN THE SAME
      SENTENCE, not in a footnote, an appendix, or a later paragraph.
    - >-
      SC-8 NO REDUCED-ROUND FINDING PRODUCED UNDER THIS GOAL MAY BE ASSERTED
      HERE. It belongs to RQ-AES-001's ceiling and is cross-filed there
      (GOAL-AES-002 non_completion_criteria (iii); RQ-AES-002
      relationship_to_RQ_AES_001 (iv)).
    - >-
      SC-9 ANYTHING NOT ATTEMPTED IS NAMED OPEN AND UNATTEMPTED and is NEVER
      recorded as tried, screened or negative (AGENTS.md rules 5 and 8).
    - >-
      SC-10 FABRICATE NOTHING. No invented timing, measurement, throughput,
      citation, review verdict, model identifier or commit SHA. A field that is
      not yet knowable stays null and is named as such.
    - >-
      SC-11 NEVER SELECT, CONFIGURE, PROBE, CONTACT OR USE AMAZON BEDROCK, in any
      runtime, backend, endpoint, model identifier, fallback or probe (AGENTS.md
      rule 16).
    - >-
      CM-1 must fix ALL SIX elements of RQ-AES-002 R2 explicitly and separately
      for AES-128, AES-192 and AES-256. (a) UNIT: one full AES-k encryption of one
      block at 10/12/14 rounds on the pinned FIPS-197-verified implementation,
      stating whether the key schedule is amortised or charged, with a STATED
      CONVERSION for attack work counted in S-box lookups, table accesses, XORs
      or operations, without which the comparison is void. (b) SUCCESS
      CONVENTION: average-case 2^(k-1) or worst-case 2^k, declared ONCE and
      applied to BOTH sides, since mixing conventions manufactures a factor of 2
      that is inside the margin any plausible result here would have. (c) SUCCESS
      PROBABILITY: an attack succeeding with probability p is charged at cost/p,
      with p measured or derived and never assumed. (d) DATA: charged in queries
      and in their kind (known / chosen plaintext / chosen ciphertext /
      adaptive), compared on the full Pareto frontier of time, memory, data and
      success probability rather than on a single scalar. (e) MEMORY: stated
      always, beside time; a time-only comparison is incomplete and is rejected.
      (f) PRECOMPUTATION AND VERIFICATION: charged end to end, including the cost
      of confirming a candidate key.
    - >-
      CM-1 is FROZEN on commit and says so in its own text, together with its role
      as a hard pre-dispatch gate for every later cryptanalytic card of this
      campaign. A margin computed before it is frozen is not evidence but an
      unadjudicated number. Write it to be attacked: it is the primary target of
      the independent red-team task TASK-20260810-1166f2, and GOAL-AES-001's first
      red-team pass destroyed that campaign's only cost model.
    - >-
      protocol-amendment-GOAL-AES-002-001 must specify the EXACT certificate
      vocabulary change and the EXACT check_run change. Statement fields for the
      key_recovery kind: key size, round count, the exact plaintext/ciphertext
      pairs, and the recovered key. Verifier: independent recompute under BOTH
      pycryptodome and the openssl CLI, by the run wrapper and not by the attack
      code. State plainly, because it is load-bearing for review, that the
      currently accepted kinds are discrete_log, decomposition and none, so
      adding key_recovery is PURELY ADDITIVE AND BACKWARD-COMPATIBLE: no existing
      record can be invalidated by it, and no existing run, evidence record or
      decision is re-scored, re-graded or withdrawn.
    - >-
      SCOPE BOUNDARY, STATED PLAINLY RATHER THAN SMUGGLED. This task's write_scope
      covers ONLY the three declared artifact paths. It does NOT include
      docs/claims-and-verification.md or tools/validate_ledger.py. The edits to
      those two files are SPECIFIED BY the amendment and APPLIED UNDER it in a
      separate declared act; they are not made here and must not be made here. An
      amendment that edits the document it amends inside a task whose scope
      excludes it is exactly the scope expansion the archival verifier exists to
      catch.
    - >-
      The adoption record must bind, by explicit reference and not by assumption:
      amendment-005 Part B C1 through C6 in full; amendment-005 Part A's
      coordination-act charging fix; and the artifact-provenance gate of
      amendment-004 Part B AS CORRECTED by amendment-005 Part C. State that these
      are scoped to GOAL-AES-001 and do not bind another goal automatically,
      which is why an explicit adoption record exists.
    - >-
      Attempt knowledge retrieval before asserting that any cost-model or
      certificate-vocabulary choice is untested, and record the query and outcome.
      An unavailable index licenses no absence, novelty or prior-non-testing
      inference, and equally no non-novelty inference.
    - >-
      Assert NOTHING about AES at any round count. No candidate, no mechanism, no
      margin, no distinguisher, no barrier. This is protocol work.
    - >-
      Change no hypothesis, research-question, experiment or goal status; approve
      no experiment; promote no knowledge; edit no committed record. Write strict
      parseable YAML with no duplicate keys.
    - >-
      Do not commit from this task. TASK-20260810-f7bc82 snapshots these exact
      bytes before any review reads them.
  deliverables:
    - CM-1.yaml, the frozen cost model, designated the covering manifest for this task
    - protocol-amendment-GOAL-AES-002-001.yaml resolving BLK-1
    - adoption-amendment-005-partB.yaml binding the clock convention and the provenance gate
  artifact_paths:
    - coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/protocol/CM-1.yaml
    - coordination/goals/GOAL-AES-002/amendments/protocol-amendment-GOAL-AES-002-001.yaml
    - coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/protocol/adoption-amendment-005-partB.yaml
  archived_by: TASK-20260810-f7bc82
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: max
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 900
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
    - All three artifacts are strict parseable YAML with no duplicate keys.
    - >-
      CM-1 fixes all six R2 elements (a)-(f) explicitly and separately for
      AES-128, AES-192 and AES-256, and states its own frozen status and its role
      as a pre-dispatch gate.
    - >-
      The amendment states the exact key_recovery statement fields, the exact
      two-implementation verifier, the exact check_run change, and the purely
      additive backward-compatibility argument.
    - >-
      The amendment states that docs/claims-and-verification.md and
      tools/validate_ledger.py are edited under it in a separate declared act and
      were NOT edited by this task.
    - >-
      The adoption record binds amendment-005 Part B C1-C6, amendment-005 Part A's
      coordination-act charging fix, and the amendment-004 Part B provenance gate
      as corrected by amendment-005 Part C, each by explicit reference.
    - >-
      SC-4 is satisfied on every deliverable, and no deliverable states a margin
      or any claim about AES at any round count.
    - >-
      Knowledge retrieval was attempted and its query and outcome recorded, with
      no absence, novelty or non-novelty inference drawn.
    - >-
      No committed record was edited, no status changed, and no file outside
      write_scope was touched.
  return_format: >-
    A YAML summary naming the three written paths, confirming element-by-element
    coverage of R2 (a)-(f) per key size, the exact certificate vocabulary and
    check_run change specified, the three adoption bindings, the knowledge-
    retrieval query and outcome, and the SC-1 budget stamp block with
    halted_on_budget stated truthfully.
