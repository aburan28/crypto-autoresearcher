    - >-
      V4. C-KOSZUL AND C-GAUGE. Spot-check koszul_all_regular_sequence_on_class:
      false on at least 2 curves (recompute the Koszul complex homology
      directly) and gauge_all_agree: true under an independent
      (u^4 a, u^6 b) transform on at least 2 curves.
    - >-
      V5. BACKEND PROVENANCE. Independently probe this host for msolve,
      Macaulay2, Magma, giac, and a genuinely independent Singular (not
      libsingular). Confirm or refute the report's D-2 characterisation:
      msolve 0.9.5 present and used as backend B, no second off-the-shelf
      resolution engine, Koszul-homology route substituted as backend C.
    - >-
      V6. THE D-1 PROTOCOL DEVIATION. Confirm every run manifest carries
      requested_policy, the binding-resolved model, the actual answering model,
      fallback_used: true, and a per-run model_judgement_steps list naming any
      step that turned on model judgement rather than exact computation. Flag
      any run missing this, and flag if any reported number's provenance traces
      back to an unnamed judgement step rather than a command this run executed.
    - >-
      V7. m=4 SCOPE COMPLIANCE. Confirm RUN-ICINV-geom-m4-v3 computed ONLY
      monomial support and singular locus (per arities.secondary_scope in the
      frozen contract) and that Betti table / regularity are genuinely
      not_computed rather than silently omitted or fabricated.
