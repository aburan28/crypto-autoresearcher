handoff:
  id: TASK-20261010-249c4f
  from: coordinator
  to: executor
  dispatch_state: written_not_dispatched
  objective: >-
    Execute the frozen contract experiments/EXP-ECDLP-15534c/specification.yaml
    exactly as its launcher.command states: python3
    experiments/EXP-ECDLP-15534c/implementation/run.py --d 2 3 5 --curves 6
    --draws 400 --seeds 1 2 3 --out <run_dir>, with <run_dir> the one run
    directory named below, then run implementation/check.py on the result.
    Record observations only. Do not interpret beyond the recorded fields,
    do not change a hypothesis status, and do not approve anything.
  uncertainty_reduced: >-
    Whether, for P of odd prime order l on a non-anomalous E/F_p and
    Q = [k]P lifted to E(Z/p^r) by each of three rules
    (integer-representative Hensel, Teichmuller-x Hensel, random Hensel),
    the formal-group defect delta is uniform on F_p on both the special
    and the matched random prime arm, with Smart's anomalous recovery
    returning delta = 0 and the planted k as the positive control. A
    non-uniform delta under the Teichmuller-x rule would be a point-level
    canonical structure, which H-ECDLP-bd1572 (HEUR-001) says does not
    exist.
  inputs:
    - experiments/EXP-ECDLP-15534c/specification.yaml
    - experiments/EXP-ECDLP-15534c/trial-plan.json
    - experiments/EXP-ECDLP-15534c/implementation/run.py
    - experiments/EXP-ECDLP-15534c/implementation/check.py
    - experiments/EXP-ECDLP-15534c/implementation/primeset.py
    - experiments/EXP-ECDLP-15534c/implementation/queue.json
    - ledger/hypotheses/H-ECDLP-bd1572.yaml
    - ledger/decisions/DEC-20261010-81ff18.yaml
    - ledger/questions/RQ-ECDLP-002.yaml
    - experiments/EXP-CANL-1064e0/specification.yaml
  inputs_note: >-
    The specification cites no KN-LIT entry directly; its preregistered
    source is Smart 1999 (anomalous case), the internal draft
    EXP-CANL-1064e0 and the HEUR-001 statement in H-ECDLP-bd1572, which
    is why the CANL specification is listed as an input.
  constraints:
    - Do not self-dispatch. This card is launched only by a later /run session that meets dispatch_preconditions.
    - Amazon Bedrock is prohibited.
    - The reachable negative is the contract's falsification criterion, a (rule, arm) with at least two curves rejecting uniformity at alpha = 0.001 after Bonferroni while the anomalous control passes and CTRL-PRECISION holds. Record it when it occurs; do not reason it away and do not relabel it.
    - Do not edit the frozen specification, the hypothesis, or this handoff. Amendments only as additive files under experiments/EXP-ECDLP-15534c/amendments/.
    - Use the run id RUN-ECDLP-b927d1 already named in the trial plan. Do not mint a second run id.
    - A timeout, crash, memory abort or resource_exhaustion is failed_infrastructure, never a negative mathematical result.
    - Preserve every raw artifact. Do not overwrite a prior run record.
    - maximum_runs is 12 as the specification counts them, all under the one run id; one invocation of launcher.command covers the grid.
    - Do not add primes, lift rules, curves, draws or seeds beyond the launcher.command, and do not change the precision r = 6 or the 10% subsample at r = 8.
    - No attack claim. The only scalar recovered is the planted k of the anomalous positive control, which the contract names as an instrument check; no discrete logarithm is attempted on any non-anomalous curve.
    - Do not edit RQ-ECDLP-002 and do not edit a goal head.
