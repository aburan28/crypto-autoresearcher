handoff:
  id: TASK-20260826-70d800
  from: coordinator
  to: coordinator
  goal_id: GOAL-MLKEM-005
  batch_id: BATCH-762807
  question_id: RQ-MLKEM-001
  opening_decision: DEC-20260824-5e222e
  objective: >-
    Close BATCH-762807: verify the producer package's validity BEFORE interpreting
    anything, compose the two sibling-blind reviews into ONE ruling at the exact
    tested scope, file the evidence record EV-MLKEM-09d715 and the closing decision
    DEC-20260826-9d7d93, adjudicate both admissibility_ruling blocks explicitly, fill
    knowledge_promotion, checkpoint ledger/goals/GOAL-MLKEM-005.yaml additively with
    EXACTLY ONE next action, and commit under a content_first ledger binding with the
    validator outputs recorded verbatim.
  uncertainty_reduced: >-
    Whether DEC-20260815-3e8e9c's binding condition (i) is now DISCHARGED -- which of
    D1..D6 are proven to fire, which are not, and on what evidence -- and, given the
    two admissibility rulings, what the single next action for GOAL-MLKEM-005 is.
    Whether the 100-bit cell may now be re-attempted, and under what contract and
    what budget basis, is the question this close answers or explicitly declines to
    answer.
  inputs:
    - >-
      Both review reports, both attestations and both admissibility_ruling blocks,
      plus the committed review plan they ran under.
    - The snapshot receipt of TASK-20260826-9e9d53 and the paths it binds.
    - >-
      The producer's twelve artifacts, its acceptance_results.json board and its
      implementation report.
    - >-
      ledger/decisions/DEC-20260824-5e222e.yaml -- the opening authority, its refusal
      and its findings.
    - >-
      ledger/decisions/DEC-20260815-3e8e9c.yaml -- the five binding conditions; (i) is
      the one under discharge, (ii)/(iii)/(iv) constrain the later re-run and are
      carried forward unchanged.
    - >-
      ledger/evidence/EV-MLKEM-59e4a4.yaml -- the predecessor evidence this record
      sits beside and does not supersede.
    - >-
      ledger/goals/GOAL-MLKEM-005.yaml -- the goal head, its completion criteria, its
      pause conditions, its non_terminal_conditions and its one next_action.
  constraints:
    - >-
      RUNS ALONE. Stage only the declared paths. Do not stage dispatch_queue.json,
      dispatch_plan.json, dispatch_plan.md or knowledge/INDEX.md.
    - >-
      VERIFY VALIDITY BEFORE INTERPRETING ANYTHING: expected artifact count,
      schema-complete records, raw-and-summary agreement, and whether each acceptance
      test observed what it claims. AN INVALID OR INCOMPLETE PACKAGE GOES BACK TO THE
      EXECUTOR WITH CONCRETE DEFECTS LISTED; IT IS NOT EVIDENCE.
    - >-
      A TIMEOUT, CRASH OR IMPLEMENTATION FAILURE IS INFRASTRUCTURE SIGNAL AND NEVER A
      NEGATIVE MATHEMATICAL RESULT. A FAIL on an acceptance test is a statement about
      the instrument, never about ML-KEM or about lattice hardness.
    - >-
      COMPOSE, DO NOT COUNT. Where the two reports agree, the agreement is TWO
      observations only if mutual blindness demonstrably held for that object AND the
      two reached it by DIFFERENT mechanisms; otherwise it is ONE observation reached
      twice, and the discount is stated AT THE POINT OF USE. Rule 12 is UNMET AND
      UNWAIVED and the reviews are same-model.
    - >-
      CLAIM CEILING IS `analyzed`. DO NOT ROUND UP AND DO NOT RECORD `supported` ON
      ANY RECORD OF THIS BATCH. CLAIM TIER STAYS `toy`.
    - >-
      DO NOT MOVE H-MLKEM-7d9bcc AND DO NOT MOVE EXP-MLKEM-42ea04. They stay
      `proposed` and `review_required` / `approved_by: null`, carried verbatim from
      DEC-20260815-3e8e9c.
    - >-
      STATE THE SCOPE OF EVERY CONCLUSION: this batch tested an INSTRUMENT at
      acceptance scale in one container with one fpylll build. NOTHING HERE IS A
      STATEMENT ABOUT ML-KEM AT ANY FIPS 203 PARAMETER SET, and no transfer is
      asserted.
    - >-
      ADJUDICATE BOTH admissibility_ruling BLOCKS EXPLICITLY. An ADMIT is not an
      approval of any re-run: approval is a frozen contract at a declared path plus a
      committed decision. SILENCE ON A CONJUNCT IS NOT AN ADMISSION.
    - >-
      IF ANY ADVERSE TRANSITION IS PROPOSED, secure the strongest checkable refutation
      artifact the result admits FIRST -- counterexample certificate, then derivation
      note, then a declared empirical_only basis -- archive it before the decision, and
      record proof_status and proof_refs. `reject_scoped` ON A SINGLE UNREPLICATED
      EMPIRICAL-ONLY RUN IS FORBIDDEN.
    - >-
      FILL knowledge_promotion. Promote a KN-FIND when the decision is `support` or
      `reject_scoped` on `replicated`/`strong` evidence; otherwise record a CONCRETE
      not_warranted reason. If a promotion is warranted you will need an identifier
      this batch did not pre-allocate -- if that binds, SAY THE REASON IS THE MISSING
      IDENTIFIER AND NOT THE MERITS.
    - >-
      PRESERVE EXACTLY ONE next_action ON THE GOAL HEAD, edited ADDITIVELY. A failing
      acceptance test, an exhausted budget or a DO NOT ADMIT ruling ends THIS TASK,
      not GOAL-MLKEM-005; the goal's own non_terminal_conditions list says so
      explicitly and binds this decision.
    - >-
      DO NOT AUTHORISE THE 100-BIT RE-RUN INSIDE THIS DECISION UNLESS THE INSTRUMENT
      IS ACTUALLY DISCHARGED AND YOU SAY WHAT CONTRACT AND WHAT BUDGET BASIS IT WOULD
      RUN UNDER. Any budget must be sized from the 14448 s LOWER BOUND, never from the
      2502.74 s failure time, and no cap raise is self-grantable.
    - >-
      MERGE origin/main BEFORE THE ARCHIVE (MERGE, NEVER REBASE), record the base and
      outcome, push and refresh the PR naming the new records. Never resolve a sync
      conflict by editing a record; supersede instead.
    - >-
      NEVER INVENT A COMMIT SHA OR A HASH. Record only measured values, and record
      only checks you actually ran, with their verbatim output.
  deliverables:
    - >-
      ledger/evidence/EV-MLKEM-09d715.yaml -- type instrument_control, the D1..D6
      board as observations each with the artifact it is read from, admissible_now and
      not_admissible_now, strength with its basis, claim_tier toy, proof_status and
      proof_refs, certificate_refs, boundaries including what the surrogate cannot
      show, unresolved confounds, and reviewed_by naming both review tasks.
    - >-
      ledger/decisions/DEC-20260826-9d7d93.yaml -- the closing decision, with the
      validity check recorded BEFORE any interpretation, a per-defect ruling on
      whether condition (i) is discharged, both admissibility rulings adjudicated, the
      composition discount stated where the reviews agree, knowledge_promotion filled,
      claim tier and claim ceiling stated, rule 12 status, scope, and EXACTLY ONE
      next_action.
    - >-
      ledger/goals/GOAL-MLKEM-005.yaml -- checkpointed ADDITIVELY: the BATCH-762807
      entry, latest_verified_commit from a MEASURED value, and exactly one next_action.
    - >-
      archives/TASK-20260826-70d800/ledger-receipt.json -- content_first, with
      path_sha256, commit and parent as measured, merge base and outcome,
      tools/validate_ledger.py and tools/check_review_independence.py outputs verbatim
      with any nonzero exit adjudicated at read level, and staged_not_in_binding_set
      disclosing dispatch_queue.json by name.
  artifact_paths:
