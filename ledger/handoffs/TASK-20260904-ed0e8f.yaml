  review_plan:
    claim_under_review: >-
      As the producer stated it (experiments/EXP-PFDR-5726af/
      execution-report.yaml, observations, verbatim): "Semaev arm, (m,d,s)
      -> observed (d_ff, fall_dim) on every draw = frozen: (2,2,2)
      (5,4)=(5,4); (2,2,3) (5,4)=(5,4); (2,2,4) (6,10)=(6,10); (2,2,5)
      (6,10)=(6,10); (2,2,6) (7,28)=(7,28); (3,2,4) (13,12)=(13,12); (3,2,5)
      (13,12)=(13,12). Signed residual 0 / 0 at every cell, every draw.";
      "NULL-3 (curve/target scramble): d_ff and fall_dim identical across
      all curves, targets and primes at every cell."; "NULL-2 minus Semaev
      (d_ff, fall_dim): 0/0 at (2,2,3), (2,2,4), (2,2,5), (2,2,6), (3,2,5);
      at the boundary cells (2,2,2) and (3,2,4): d_ff difference 0, fall_dim
      difference -3 and -11 (NULL-2 fall_dim 1 in both)."; "NULL-1 d_ff:
      (2,2,2) 5 at 60/60; (2,2,3) 6 at 60/60; (2,2,4) 7 at 60/60; (2,2,5) 8
      at 60/60; (2,2,6) 9 at 60/60; (3,2,4) 13 at 10/10; (3,2,5) 14 at 10/10.
      Every value equals the frozen D_null"; "Mixed-block nearby object at
      (2,2,3): d_ff 6 in 36 of 36 (fall_dim 14)"; "Non-monomial-top nearby
      object at (2,2,3): d_ff 5 in both readings, because the substituted
      x_1^4 has no degree-4 part at s = 3 and the top form collapses to
      x_1^2 x_2^2"; "H-WIL: 112 of 112 cells at rank min(C(s,j), C(s,j+2))";
      "H-TOP at m = 3: single monomial x_1^4 x_2^4 x_3^4, c = 1". The
      hypothesis (H-PFDR-4148b8, title): "The first fall degree of the d = 2
      digit-presented Semaev system is a closed form in (m, s) alone --
      d_ff(m, 2, s) = m 2^{m-1} + floor((s - 2^{m-1})/2) + 1 -- curve- and
      target-independent, reproduced exactly by a block-factored random
      null and strictly below the support-matched null, so IDEA-20260830-
      84cdb7's H1 ('d_ff bounded in s') is refuted by derivation and its
      Outcome 3 exponent stake is closed at d = 2".
    coordinator_prior: >-
      Written 2026-09-04 before any reviewer runs. I expect the blind
      re-derivation to return (5, 4) on all twelve instances with profile
      (full, top) = (1, 1), (6, 2), (15, 1) at D = 4, 5, 6, and every
      validation joint to hold; the derivation (D1)-(D4) for d_ff is, I
      believe, correct and elementary. I expect the red team to BREAK one
      stated part of the hypothesis: (D4)'s and (D6)'s claim that the
      block-factored null reproduces fall_dim exactly at EVERY cell. The
      meter's fall_dim(D) = full_rank - top_rank equals the top-form kernel
      dimension m [binom(s, a_0) - binom(s, a_0 + e)] only when the fallen
      rows are linearly independent in B; at the boundary cells s = e
      ((2,2,2) and (3,2,4)) the homogeneous block-factored null's top form
      is a single monomial per block product, its multiples a_i g collapse
      onto few monomials, and fall_dim is 1 against the Semaev arm's 4 and
      12, exactly as the executor observed (anomaly A-NULL2-BOUNDARY-
      FALLDIM). I expect the red team to show, by adding random sub-top
      terms to the block-factored null, that the discrepancy is
      homogeneity, not curve information, so the curve-independence
      conclusion survives for d_ff everywhere and for fall_dim off the
      boundary, while P3 as frozen ('forced 0 at every cell') fails at two
      cells and (D4)'s fall_dim identity needs a row-independence
      hypothesis. I also expect the red team to (i) confirm the ALPF-011
      citation mislabel (a generator-degree list, not a per-variable
      profile) so that H-TOP at m = 3 rests on the symbolic check alone,
      (ii) accept the sympy resultant as an exact substitute for the absent
      Sage (the contract names no CAS), (iii) find the 'refuted by
      derivation' claim conditional on Wilson's rank formula for the LOWER
      bound (an upper bound cannot refute boundedness) and tested only at
      s <= 8, and (iv) find the non-monomial nearby object untested at s = 3
      and construct one that works. DECISION I EXPECT: support for
      H-PFDR-4148b8's closed form and curve-independence of d_ff at the
      tested cells, strength replicated (12 draws at the deciding cell
      across 3 curves, 2 targets, 2 primes; the ladder; m = 3; EXP-PFDR-
      fd901a's independent engine at three primes on the same shape;
      EXP-PFDR-cbdefb's closure agreement on the same instances), with the
      fall_dim statement scoped to strict-early-fall cells and the
      exactness statement scoped to s <= 8 unconditionally and to Wilson's
      theorem beyond; a knowledge finding is warranted (closed-form first
      fall of the d = 2 digit presentation; refutation of 84cdb7's H1 at
      d = 2 by derivation-plus-check), carrying the boundary-cell caveat and
      the citation correction. If the blind re-derivation disagrees with
      (5, 4) on any instance, the disagreement localises to one of two named
      implementations and the decision is inconclusive until resolved.
    joints:
      - joint: 'V1 blind re-derivation of (d_ff, fall_dim) and the per-layer profile at the deciding cell'
        assigned_to: TASK-20260904-642cf5
        attack_plan: >-
          Implement review_plan.blind_rederivation.quantity from its
          statement alone: the ring B on 6 squarefree variables, ell_k =
          a_{k,0} + 2 a_{k,1} + 4 a_{k,2}, S~ = S_3(ell_1, ell_2, x_R)
          reduced, the per-layer rows {mu S~ : deg mu = D - 4} for D = 4..7,
          full rank on the 64 monomials and rank of the degree-D homogeneous
          parts, by your own exact elimination modulo p. Run it on the 12
          declared instances and on your own nulls: two block-factored
          products q_1(a_{1,*}) q_2(a_{2,*}) of random degree-2 forms per
          prime, and two support-matched random polynomials on S~'s exact
          monomial support per instance. Record (full, top, fall) at each D,
          d_ff and fall_dim(d_ff). Where I think it breaks: nowhere for the
          Semaev arm ((5, 4) and (1,1),(6,2),(15,1) forced by the tensor
          argument); the support-matched null should fall at 6, and a
          homogeneous block-factored null at s = 3 should give (5, 4).
        breaking_artifact: >-
          Any instance with (d_ff, fall_dim) differing from (5, 4), or a
          profile differing from (1,1),(6,2),(15,1), with your row matrices
          and elimination trace archived; or a statement that the quantity
          as stated is underspecified, naming the missing convention.
      - joint: 'V2 run-set validity, manifest schema and pinning, seed integrity, frozen-prediction binding'
        assigned_to: TASK-20260904-642cf5
        attack_plan: >-
          PHASE B. For each of the ten run directories: seven files present
          (six required plus package-sha256.json), sidecar hashes recomputed
          and matching, manifest status completed_valid, code.commit and
          dirty flag (nine runs at 3a9c1b02; RUN-PFDR-5726af-m2-s6 at
          1b49d491; RUN-PFDR-5726af-m3-s5 recorded dirty: true -- inspect its
          dirty_tree block and explain what was dirty and whether any
          executed file was affected), run_pfdr_5726af.py sha256 identical
          across all ten manifests, meter per-file sha256 equal to
          harness/macaulay_fp/VALIDATION.md, the stage0-predictions sha256
          in every manifest equal to the actual sha256 of
          stage0-predictions.yaml, seeds equal to the contract's (curves
          1101..1103, targets 1..2, null 7..19, mixed-block 31/37/41),
          convention string per_layer with D_max = D_null + 1, one worker,
          the session inference block present with model_verified false
          disclosed. Count runs (10 of 10) and check that D-RUNS-10 (the s =
          2 cell computed inside the gate run) is consistent with the
          manifests. Where I think it breaks: nowhere; the m3-s5 dirty flag
          needs an explanation, not a rejection.
        breaking_artifact: >-
          A hash mismatch, a manifest whose pinned run-script hash differs
          from its siblings', a stage0-predictions sha256 that does not
          match the file, a seed set differing from the contract, or a
          dirty tree touching an executed file.
      - joint: 'V3 instance and certificate checks on the declared deciding-cell instances'
        assigned_to: TASK-20260904-642cf5
        attack_plan: >-
          With your own arithmetic, for each of the 12 instances (p, a, b,
          x_R) in review_plan.blind_rederivation.parameters: the curve is
          non-singular (4a^3 + 27b^2 != 0) with a, b != 0 (j not in {0,
          1728}); enumerate the on-curve x in the planting window [0, 4)
          (x^3 + a x + b a square or zero) and confirm at least two; for
          every pair of window points and sign choice compute x(P_1 + P_2)
          and confirm x_R is among the values (an independent decomposition
          certificate that needs no summands from the raw record); count
          distinct instances per prime (I expect the two targets of curve
          1103 at p = 65537 to coincide at x_R = 47685, reducing the
          distinct-instance count from 12 to 11). Where I think it breaks:
          nowhere except the duplicate, which is a replication-count
          finding.
        breaking_artifact: >-
          An instance whose x_R is not a window-pair sum (certificate
          fails), a singular or special-j curve, or fewer than two window
          points.
      - joint: 'V4 independent recomputation of the H-WIL rank table and the S_4 top form'
        assigned_to: TASK-20260904-642cf5
        attack_plan: >-
          With your own code: (a) for s = 2..8, every j with j + 2 <= s and
          p in {4099, 65537}, the rank of multiplication by ell^2 from
          degree j to degree j + 2 on F_p[a_1..a_s]/(a_i^2) for both ell =
          sum 2^i a_i and ell = sum a_i; compare with min(binom(s, j),
          binom(s, j + 2)) at all 112 cells and check the square maps j + 2
          = s - j; (b) build S_3 from the formula, form S_4 = Res_T(S_3(x_1,
          x_2, T), S_3(x_3, x_R, T)) with a, b, x_R symbolic in sympy, and
          extract the degree-12 homogeneous part in (x_1, x_2, x_3): expect
          the single monomial x_1^4 x_2^4 x_3^4 with coefficient 1; confirm
          the coefficient is a constant, not a polynomial in (a, b, x_R);
          cross-check numerically that S_4 vanishes on random planted
          triples on a random curve at p = 65537. After phase B compare with
          the manifests' recorded htop and hwil metrics. Where I think it
          breaks: nowhere.
        breaking_artifact: >-
          An (s, j, p) with rank below the maximum (exactness withdrawn
          there), or a top form that is not the single monomial or whose
          coefficient can vanish.
      - joint: 'R0 raw/summary agreement and residual regeneration from the raw records'
        assigned_to: TASK-20260904-ed0e8f
        attack_plan: >-
          From runs/*/raw-result.json only, regenerate the tables of
          analysis.md sections B-K with your own code: per-draw d_ff and
          fall_dim per cell against stage0-predictions.yaml; NULL-2 pairs by
          (p, seed) and the NULL-2-minus-Semaev entries including the
          boundary cells; NULL-1 histograms, at/below D_null counts and
          censoring (0); NULL-3 identity across curves, targets, primes; the
          mixed-block histogram (36 at 6) and the non-monomial readings; the
          H-WIL 112 cells; D-STOP-FIRST truncation recorded per draw at
          (2,2,6), (3,2,4), (3,2,5); sol(D) covariate. Diff against
          analysis.md and execution-report.yaml. Where I think it breaks:
          nowhere; a discrepancy would indicate the summariser read
          something other than the raw records.
        breaking_artifact: >-
          Any table entry that differs from the raw records, or a residual
          the report calls 0 that is not.
      - joint: 'R1 the fall_dim identity and the boundary-cell block-factored-null anomaly'
        assigned_to: TASK-20260904-ed0e8f
        attack_plan: >-
          Derive precisely when the meter's fall_dim(D) = full_rank -
          top_rank equals the dimension of the kernel of multiplication by
          S~_top on A_{D - delta}: rows mu S~ with mu in a basis of A_{D-delta}
          map to top parts mu_top S~_top, so top_rank = dim(image), and
          full_rank - top_rank = dim(kernel) exactly when the rows are
          linearly independent in B. Show why the Semaev rows are
          independent at (2,2,2) (sub-top terms) and why the homogeneous
          block-factored null's rows collapse (its top form at s = e is a
          constant times the product of all digit variables; a_i g = g in B
          when a_i divides the monomial). Then construct an INHOMOGENEOUS
          block-factored null (random product of degree-2 forms plus random
          sub-top terms in the same block variables) and compute its (d_ff,
          fall_dim) at (2,2,2) and (3,2,4) with the meter: if it returns (5,
          4) and (13, 12) the anomaly is homogeneity, not curve information;
          if it does not, F2 (curve information at the first fall) is live.
          Write the corrected statement of (D4)/(D6) and list which of the
          contract's P3 assertions survive. Where I think it breaks: (D4)'s
          fall_dim identity is stated without the independence hypothesis;
          P3 fails at the two boundary cells as frozen.
        breaking_artifact: >-
          A derivation note giving the row-independence condition and the
          corrected (D4)/(D6), plus the inhomogeneous-null computation; or
          an inhomogeneous curve-free null that still gives fall_dim 1 at
          s = 2 (a genuine curve-information lead).
      - joint: 'R2 exactness, the Wilson dependence and the scope of the refutation of 84cdb7 H1'
        assigned_to: TASK-20260904-ed0e8f
        attack_plan: >-
          Separate the unconditional upper bound (dimension count, given
          H-TOP) from the lower bound (full rank of the inclusion map for
          p > s). Establish that refuting 'd_ff bounded in s' needs the
          LOWER bound and hence Wilson's rank formula (snippet-level in the
          record). Supply an independent argument for full rank of
          W_{j, j+e} modulo p when p > s, or mark it as still conditional:
          e.g. the diagonal form of Wilson (1990) has entries binom(k - i,
          t - i), all < p when p > s; or Gottlieb (1966) / Kantor for full
          rank over Q plus an integrality argument; record provenance
          honestly (recalled, retrieved or opened). Check the quantifier of
          the hypothesis ('FOR ALL s with 2^{m-1} <= s and 2^s <= p') against
          what the s <= 8 direct check covers and state the residual
          conditionality beyond s = 8. Check the tensor-kernel identity and
          the minimal-degree bookkeeping (the kernel in degree a_0 is the
          direct sum of the block kernels tensor the degree-0 part; m copies).
          Where I think it breaks: nowhere mathematically; 'refuted by
          derivation' should read 'refuted at s <= 8 unconditionally and
          for all s conditional on Wilson'.
        breaking_artifact: >-
          A prime p > s and cell where the inclusion map is not of maximal
          rank (none expected), or a derivation note re-scoping the
          refutation claim with the conditionality made explicit.
      - joint: 'R3 H-TOP provenance, the ALPF-011 citation mislabel and the CAS substitution'
        assigned_to: TASK-20260904-ed0e8f
        attack_plan: >-
          Open experiments/EXP-ALPF-011/source/round006_exp010_validated_
          resweep_result.md and confirm whether '[4, 4, 4, 12]' is a
          generator-degree list (three |FB| = 4 membership polynomials and
          S_4) rather than a per-variable profile of S_4 (the executor's
          A-ARCHIVED-PROFILE-CITATION). State the consequence for
          H-PFDR-4148b8's HEUR-001 random_model_justification (the m = 3
          inference rested on a misread; the symbolic check carries it now)
          and whether the hypothesis record needs a superseding annotation.
          Assess the resultant leading-coefficient argument for general m:
          is the top form of S_{m+1} the single monomial prod x_k^{2^{m-1}}
          for every m, or only checked at m = 2, 3? Assess D-HTOP-CAS: the
          sympy resultant over Z[a, b, x_R] is exact; is anything in the
          contract or the handoff's Sage clause violated in substance? Where
          I think it breaks: the citation is mislabelled; H-TOP at m = 3
          stands on the symbolic run; m >= 4 is unchecked.
        breaking_artifact: >-
          A reading of the archived table that supports the per-variable
          profile (overturning the executor's observation), or an m at
          which the top form is not a single monomial.
      - joint: 'R4 nearby objects, confounds and conventions'
