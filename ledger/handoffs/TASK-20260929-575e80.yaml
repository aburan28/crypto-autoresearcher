        proves-too-much control needs PTM-1 to PTM-5 computed. Before any
        alternative or null is computed, write in attacks/choices.yaml which
        one you chose and why (MC-7).
    - id: RF-3
      text: >-
        ONE OWNER PER JOINT. You own F3, F4, F6 and proves_too_much. You do
        not re-execute any instance, re-verify any solve or re-derive A7
        blind (F1, F2, F5 and F7 are the validator's). You may recompute any
        statistic from the archived rows as an input to your attacks. Offer
        no whole-claim verdict and no status recommendation for
        H-PFDR-0cc7e8 or H-PFDR-4765e4. Give the narrowest supported
        statement per joint. The Coordinator composes the round.
    - id: RF-4
      text: >-
        ZERO RUNS, NO SOLVER EXECUTION. Your computations are analysis of the
        committed rows, reading code, and synthetic simulation; they get no
        RUN id. Do not execute the census CLI, the solver, analyze_census.py
        or any merge script, and do not import a solver module (load stats.py
        by file path). PTM-5 is your own code over Z_N with no curve. A spot
        check of a single discrete logarithm, if you need one, uses your own
        baby-step giant-step and no producer code.
    - id: RF-5
      text: >-
        MACHINE PROTECTION. One computation process at a time, nice 19,
        OMP_NUM_THREADS, OPENBLAS_NUM_THREADS and MKL_NUM_THREADS set to 1.
        Poll VmRSS at least once a second and stop any process that crosses
        1.5e9 bytes; the stop is blocked, not a finding. Launch only if the
        launch facts show at least 4 GB MemAvailable. Stream harvest-rows
        files; never load one whole. Files over 50 MB go to your scratch
        directory scratchpad/rt-575e80/ and are recorded by path and sha256
        only. Never read, signal or touch another session's processes or
        files.
    - id: RF-6
      text: >-
        NO NEGATIVE EVIDENCE FROM INFRASTRUCTURE. A crash, timeout or
        numerical failure in your own simulation is reported as such, never
        as a finding about the floor. A failed_infrastructure instance in the
        rows is never evidence about any base, class or m.
    - id: RF-7
      text: >-
        CITE WITH PROVENANCE. A file you opened is internal. A source you
        recall but did not open is recalled, a pointer, never support. Query
        the knowledge index (search_knowledge) before calling a probability,
        generic-group or collision fact known, and record whether the index
        answered. The Coordinator's derivation sketch in the prior is a claim
        to check, not a source.
    - id: RF-8
      text: >-
        DISCLOSED PRIOR. The Coordinator's prior names what it expects from
        you, including a derivation it may have got wrong. A prior the review
        overturns is among the most valuable results available. Attack the
        joints on their merits.
    - id: RF-9
      text: >-
        TW-SCOPE. No statement in your report may imply anything about a
        deployed curve, a universal impossibility or an exponent below
        rho's. Every statement is scoped to the tested arms, m = 3, 4, 5,
        12..32 bits, this engine and these curves. Do not call any instance a
        contradiction of the floor; report what each computation shows.
    - Never select a provider, backend, endpoint or model identifier containing Bedrock.
