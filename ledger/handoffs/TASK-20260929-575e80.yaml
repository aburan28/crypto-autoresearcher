    - id: RF-2
      text: >-
        BUILD, DO NOT ONLY ARGUE. F3 needs the lemma written as numbered steps
        with the symbol map, the c = 2 versus c = 1 adjudication with G5
        checked on every firing row, and the per-arm premise table. F4 needs
        the code traces with a reproducing instance for any leak, the X_total
