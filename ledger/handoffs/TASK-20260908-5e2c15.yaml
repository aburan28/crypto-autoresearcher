  constraints:
  - You are not alone. Own only three declared outputs; preserve every other agent and immutable source/report.
    No producer/ledger/queue/claim/status changes, commits or pushes.
  - Use only declared inputs and own outputs. Verify hashes before review. Prior archived Tate reports are explicitly
    visible under the declared lift; no parent conversation or concurrent reviewer reports.
  - Zero scientific runs. At most60 TOTAL fixed static/arithmetic/synthetic/mock cases including reruns, each<=10seconds
    and aggregate<=600wall/CPU seconds, one worker2GiB. No frozen fixture searches, pairing calibration, experimental
    controls/timing or future-run invocation. Source hash comparisons are administrative checks outside the fixed-case
    allowance. Record actual commands/counts/timings and preserve failed attempts.
  - Review the full frozen contract and final source, report only the assigned implementation joint. Separate reproduced
    defects, missing definitions, untested concerns and operational prerequisites. No whole-claim, scientific, launch
    or status verdict.
  - No fallback/degradation/Bedrock. Native review-adversarial gpt-5.6-sol/xhigh in an independent session.
  - Routine wall/CPU estimates remain advisory; machine protection/cancellation and exact scientific sample counts
    still bind. Do not demand superseded research spending caps.
