  objective: >-
    Execute the frozen EXP-SCR-002 protocol exactly as specified and produce the immutable
    run records and execution report it requires. Experiment title: SOURCE-LOCATOR-OPEN repaired admission sheet: deterministic static admission audit
    against the frozen P1552/P1553 six-list frontier.
