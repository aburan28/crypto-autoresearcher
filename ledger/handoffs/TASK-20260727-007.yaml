    Apply the frozen repaired admission sheet (requirements R1-R7 below) mechanically to
    the 7 frozen audit items, producing a complete requirement-by-item admissibility
    matrix. Decide: zero admissible operations (success; scoped sheet failure supported,
    first failure at requirement_1) versus at least one operation passing R1-R7 with
    lambda, mu at most 0.45 and one fresh query inside B^(5/4+o(1)) (fal
