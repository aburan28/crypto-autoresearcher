  constraints:
  - INDEPENDENT SESSION, review-adversarial, xhigh. Report on YOUR joints; do NOT return a whole-claim
    verdict on whether the preconditions are satisfied - the Coordinator composes. COPY THE FIVE JOINT
    NAMES VERBATIM into joints_owned; tools/check_review_independence.py matches them by string and a
    paraphrase reads to the tool as an unowned joint.
  - YOU ARE UNDER THE ANTI-LEAK RULE DIRECTLY AND IT BINDS YOUR OWN ARTIFACTS. You will read the governed
    block at paper_fulltext.md lines 234-238. NOTHING YOU READ THERE MAY APPEAR in independent_precondition_check.md,
    in validation_report.yaml, in your receipt, or in your return message - not transcribed, paraphrased,
    rounded, ordered, bucketed, ranged, compared or unit-converted; no operations count, no memory bound,
    no exponent, no ratio, no statement of which row is largest. Run the digit scan over YOUR OWN artifacts
    too and say that you did.
  - 'AT J1, GO ITEM BY ITEM AND SAY SETTLED, NOT SETTLED or OVER-REACHED, quoting the ruling''s own words:
    RT-4''s licensing question itself; AF-4''s interval ruling; F-J2-1''s naming of clause_4''s licence
    and foreclosure; CF-10''s placement and its `travels with` limb; F-2, F-3 and CF-22; RT-6, RT-9(a)
    and RT-12; AF-1, AF-2 and AF-3; the standing citation prohibition and any ruling on how an enacted
    clause_4 foreclosure would interact with it; and approval or enactment of anything. THEN CHECK THE
    CONVERSE: does the ruling settle LESS than RT-4''s licensing question? A ruling that carries the question
    forward has produced no object for the enacting producer to attack and P-1 IS NOT SATISFIED BY IT.'
  - YOU ARE FORBIDDEN TO ATTACK WHETHER THE RULING IS RIGHT. Do not argue the merits, do not state which
    way you would have ruled, do not record a preference. IF YOU HAVE A MERITS OBJECTION, RECORD ONLY
    THAT YOU HAVE ONE AND THAT YOU WITHHELD IT - so the enacting batch's producer knows a first reader
    had one, without being told what it was. That asymmetry is deliberate and is explained at batch.yaml
    p1_placement_ruling.
  - 'AT J2, OPEN EVERY KEY PATH YOURSELF AND READ THE BYTES - never through the ruling''s quotations.
    For each operative proposition: does the artifact carry the quoted words after whitespace normalisation;
    does the proposition FOLLOW from those words or only if a further decision is taken; is it about what
    the TEXT does or about what a party would have to do. THEN RUN OBJ-D: OPEN THE COUNTERFACTUAL ARTIFACT
    THE RULING NAMES and ask whether a different reading of it really would have forced the other position.
    NO COUNTERFACTUAL, OR ONE THAT DOES NOT BEAR, IS A BREAK - the ruling restated rather than ruled.'
  - AT J3, OPEN THE BATCH-2e6130 RECORD YOURSELF AND ANSWER INDEPENDENTLY BEFORE COMPARING. Existence
    of the three key paths under exactly that parent; that record's own `status` and `in_force`, quoted
    or reported absent; and the three invariants ANSWERED AS FORM QUESTIONS. Then run OBJ-A on the three
    probe key paths - a probe reported PRESENT by the procedure is a BREAK; a probe that genuinely exists
    is a fact, reported as one, with the control inconclusive for it. CHECK SPECIFICALLY THAT THE READING
    DID NOT SETTLE RT-6, whose object is invariant 2, and DID NOT EVALUATE ANYTHING at a field size -
    an evaluation is both a break and a citation-prohibition event.
  - 'AT J4, DO BOTH HALVES. HALF ONE: open paper_fulltext.md yourself and independently establish the
    file''s existence, its total line count, that lines 234-238 exist and are non-empty, and your own
    answers to S1 through S7. RECOMPUTE THE BLOCK DIGEST AND THE WHOLE-FILE DIGEST with commands that
    emit ONLY the digest and compare them with what locator_confirmation.yaml recorded; A DIGEST MISMATCH
    IS A STOP, NOT A NOTE, AND IS NEVER REPAIRED BY RE-HASHING. Run OBJ-B on lines 1-5 - S2 MUST come
    out FALSE - and OBJ-C on a past-end-of-file range - it MUST return DOES NOT RESOLVE. HALF TWO: re-run
    the digit scan yourself over all P-3 and P-2 artifacts, classifying every digit run into the closed
    list; exercise it on `SYNTHETIC-LEAK-PROBE 1234.5678` written OUTSIDE the repository (OBJ-E) and CONFIRM
    IT FIRES. AND CHECK THE SUBTLER LEAKS A SCAN CANNOT SEE: a value described in words, an ordering or
    comparison between rows, a range or bucket, a unit conversion, and any sentence placing the label
    512 next to something read out of the block.'
  - 'AT J4, CHECK THE RESERVATION TOO: the S6 observation must carry its mandatory scope sentence and
    must not be written, or citable, as discharging any extension of the precondition to the CHARACTERIZATION.
    THAT IS RT-9(a), IT IS RESERVED, AND YOU MAY NOT SETTLE IT EITHER.'
  - AT J5, THE ORDERING IS ATTESTED AND BINDING - AND IT IS NOT A BLIND PHASE; nothing is forbidden to
    you at any time. BEFORE opening the producers' own control sections, run OBJ-A, OBJ-B, OBJ-C and OBJ-E
    YOURSELF and record what YOU got in independent_precondition_check.md. THEN open theirs and say where
    yours differs. RECORD THAT YOU DID IT IN THAT ORDER, OR RECORD HONESTLY THAT YOU DID NOT.
  - 'AT J5, ALSO CHECK THE CONTAINMENT SEPARATION MECHANICALLY: read TASK-20260906-6c5e0a''s declared
    sources_read and confirm it contains NOTHING under inputs/; read TASK-20260906-decbd5''s and confirm
    it contains NEITHER BATCH-2e6130 NOR cost_model.py NOR BATCH-256a94''s anchor_reconciliation.json.
    A BREACH IS A FINDING ABOUT THIS BATCH''S ONLY STRUCTURAL PROTECTION. SAY PLAINLY THAT THIS IS A REVIEWER
    JOINT AND NOT A TOOL RESULT, and is weaker than a mechanical blind_from comparison.'
  - 'A REVIEW THAT FINDS NOTHING WRONG IS A FULLY ACCEPTABLE OUTCOME AND IS CONTRACTED AS ONE IN ADVANCE.
    If you search hard and find nothing, say so plainly and record HOW you searched. DO NOT MANUFACTURE
    AN OBJECTION to make three file reads look productive; rate severities honestly, including informational.
    AND SYMMETRICALLY: if a key path is absent, an invariant unsatisfied, the locator unresolved, the
    ruling over-reaching or an artifact leaking, SAY SO PLAINLY AND DO NOT SOFTEN IT BECAUSE THE ENACTMENT
    IS CLOSE.'
  - DO NOT FIX ANYTHING. The three packages are the objects under review and are committed; repairing
    one destroys the evidence. Name the defect, give the smaller repair, and leave it. THE REDRAFT, THE
    BATCH-2e6130 RECORD, paper_fulltext.md AND EVERY BATCH-752ef2, BATCH-79a0cb, BATCH-60d6b9 AND BATCH-314308
    ARTIFACT ARE IMMUTABLE and are not yours to annotate either.
  - READ-ONLY, ABSOLUTELY, ON experiments/ AND inputs/. Do not edit specification.yaml - not one line,
    not a comment, not a reformat - and never write an amended copy of it anywhere inside the repository.
    DO NOT EXECUTE cost_model.py EVER, with or without WESOVOW_RAW_PATH set (CF-10); it is not in your
    read scope. Set PYTHONDONTWRITEBYTECODE=1 and sys.dont_write_bytecode before importing anything from
    a snapshot-bound directory.
  - RECORD AT LEAST ONE CONCRETE FINDING PER OWNED JOINT, or state for that joint that you searched and
    found none and exactly how you searched. A joint answered by restating a producer is an UNCOVERED
