    HAS BEEN ACTED ON, LOOK FOR THE COMMITTED RECORD AND RECORD THE ITEM OUTSTANDING IF THERE IS NONE.
    A previous reviewer of this campaign did exactly that and was right.'
  - THIS ROUND IS SESSION-INDEPENDENT AND NOT MODEL-INDEPENDENT - IMP-1's own recheck reports ZERO resolvable
    backends and every agent here is a subagent of one orchestrating session. State it in your limitations;
