# =============================================================================
# TASK-20260929-c05f6e -- RANK 1. Design pass on a SUB-GENERIC m-SUM ORACLE over
# a Frobenius-stable F_2-subspace factor base on a binary elliptic curve.
#
# ZERO SCIENTIFIC RUNS. This produces a hypothesis and a frozen contract, not a
# measurement and not a claim. Designing is NOT approving: the contract lands at
# `approved_by: null` and waits for a separate Coordinator decision.
#
# WRITTEN, NOT DISPATCHED. Blocked on TASK-20260929-7b42d9's verified receipt.
# =============================================================================
handoff:
  id: TASK-20260929-c05f6e
  from: coordinator
  to: idea-generator
  objective: >-
    Produce a falsifiable hypothesis and a frozen experiment contract for a DIRECT
    ATTEMPT AT A SUB-GENERIC m-SUM ORACLE on the group of points of a binary
    elliptic curve with a Frobenius-stable F_2-subspace factor base -- i.e. an
    m-SUM algorithm with time below |F|^(m-s) at store |F|^s for some m and some
    s at most floor(m/2). That is verbatim the falsification_condition of
    HEUR-GENERIC-MSUM (ledger/hypotheses/H-SEMBIN-8e7ae3.yaml lines 67-71), which
    is `unvalidated`, carries `validation_experiment_ids: []`, and on which every
    row of RUN-SEMBIN-c68773's pricing of the decomposition-oracle family rests.
  uncertainty_reduced: >-
    Whether the free Frobenius orbit action on an m-SUM solution set over a
    Frobenius-stable factor base buys a better TIME-STORE TRADEOFF than partial
    meet-in-the-middle, or whether it is a constant-and-log-factor saving that
    leaves the |F|^(m-s)/|F|^s frontier where it is. Those two answers send the
    whole decomposition-oracle family to different places, and no committed record
    in this program distinguishes them: the heuristic's single supporting datum is
    at m = 3, the one arity where meet-in-the-middle confers no time advantage and
    which therefore cannot discriminate it.
  inputs:
    - ledger/decisions/DEC-20260929-3e8a1c.yaml
    - ledger/hypotheses/H-SEMBIN-8e7ae3.yaml
    - experiments/EXP-SEMBIN-04ec3c/specification.yaml
    - ledger/decisions/DEC-20260928-7c3d91.yaml
    - docs/target-result-profile.md
    - docs/inventor-protocol.md
    - knowledge/techniques/KN-TECH-080.md
    - orchestration/research-priority.yaml
  constraints:
    - >-
      ZERO SCIENTIFIC RUNS AND NO IMPLEMENTATION. The deliverable is a hypothesis
      plus a frozen contract. Do not implement a solver, do not instantiate a
      curve, do not compute a relation, do not produce a number that could be
      quoted as a measurement.
    - >-
      DESIGNING IS NOT APPROVING. The contract lands at `approved_by: null`,
      `status: draft`, `execution_authorized: false`. Only a separate committed
      Coordinator decision approves it (CLAUDE.md instruction 11(3)).
    - >-
      A PROOF-ORIENTED PROPOSAL CARRIES A `proof_search_map` BEFORE THE
      COORDINATOR APPROVES IMPLEMENTATION -- all four audits of
      docs/inventor-protocol.md section 8: exact baseline reproduction,
      observation-collision search, explicit quantifier order, and a method
      ceiling with a nearby-object control. An audit that does not apply records
      WHY; it is not silently omitted. These are cheap pre-compute falsification
      checks and a FAILED AUDIT IS OFTEN THE USEFUL RESULT here.
    - >-
      THE BASELINE TO BEAT IS STATED EXACTLY AND REPRODUCED AS A FIXTURE: partial
      meet-in-the-middle at time |F|^(m-s), store |F|^s, s at most floor(m/2),
      with the store charged on the same footing as the baseline's -- the
      symmetry RUN-SEMBIN-c68773 established. A claimed improvement that charges
      the oracle's store as free is not an improvement; that asymmetry is the one
      EXP-SEMBIN-04ec3c exists to close.
    - >-
      SCOPE EVERY STATEMENT TO THE TESTED CURVE FAMILY, DEGREE, FACTOR-BASE
      CONSTRUCTION, m AND s. A result about a Koblitz curve defined over F_2 does
      not transfer to a random binary curve without an explicit stated assumption,
      because the free Frobenius action is exactly what the F_2-definedness buys.
      Say which family each claim is about, every time.
    - >-
      NULL OBJECT REQUIRED BEFORE BELIEF (docs/inventor-protocol.md). The
      contract declares, before any run, a matched factor base that is NOT
      Frobenius-stable, of the same size, on the same curve. If the claimed
      tradeoff gain survives on the non-stable base, the gain is not from
      Frobenius and the mechanism claim is void whatever the timings say. This is
      the single most important control in the contract and it is blocking.
    - >-
      PARETO HONESTY. Carry `dominated_by` -- settable to null ONLY after checking
      every row of the frontier across time, memory and data/queries, with vOW
      parallel rho as a mandatory row -- and a quantitative `sota_delta`. An
      unchecked null is a fabrication under core rule 5.
    - >-
      CITATION PROVENANCE IS MANDATORY AND `recalled` BACKS NOTHING. The k-SUM and
      generalised-birthday literature, Wagner, Wiener-Zuccherato,
      Gallant-Lambert-Vanstone, and any Frobenius-expansion result are `recalled`
      in this program unless an agent opens them in this task and says so in
      `verified_by`. Naming the nearest work you can recall, hedged and marked, is
      WANTED; presenting an unmarked recollection as a checked source is the
      violation.
    - >-
      DO NOT INHERIT THE EXPONENT-SIDE ANALOGY. EXP-ICEX-850e41 and H-ICEX-8f9ea2
      concern a low-Hamming-weight promise on the EXPONENT over a PRIME field in
      the balanced-knapsack regime. Per DEC-20260929-3e8a1c R2 and amendment A4
      they bear on this question on NO axis -- field, object decomposed, or
      parameter regime. Do not cite either as support, as a null, or as a prior.
    - >-
      NO CLAIM ABOUT THE SECURITY OF ANY DEPLOYED CURVE, in either direction, at
      any point in the deliverable.
  deliverables:
    - >-
      D1. LITERATURE SCREEN, FIRST AND CHEAPEST, AND IT MAY END THE TASK. Does the
      k-SUM / generalised-birthday literature already answer whether a free group
      automorphism acting on the factor base improves the k-SUM time-store
      frontier? Use search_knowledge before asserting the avenue is untested
      (AGENTS.md "Knowledge retrieval policy"); report contradictory sources
      rather than picking one; record absence of a result as absence of a SEARCH
      RESULT and never as evidence it was not tried. IF THE ANSWER IS KNOWN, the
      right deliverable is a KN-LIT with `retrieved` provenance and a short note
      that HEUR-GENERIC-MSUM is discharged or refuted by existing work -- and that
      is a SUCCESS of this task, not a failure of it. DEC-20260928-7c3d91's
      knowledge_promotion deferral turns on exactly this question.
    - >-
      D2. THE MECHANISM, ESTABLISHED BEFORE IT IS USED, AND STATED SO IT CAN BE
      WRONG. DEC-20260929-3e8a1c FG-1 records a CANDIDATE mechanism as an UNOPENED
      POINTER that backs nothing: a characteristic relation for Frobenius on a
      binary curve defined over F_2, and a consequent free orbit action on the
      m-SUM solution set over a Frobenius-stable factor base. IT IS NOT GIVEN TO
      YOU AS TRUE. No agent in this program has opened a source for it, a corpus
      search found no internal record stating it, and this Coordinator's attempt to
      cite it was refused by validate_ledger.py under AGENTS.md rule 9. YOUR FIRST
      ACT ON D2 IS TO OPEN A SOURCE and state the relation as that source states
      it -- its form, the permitted values of the trace, and the hypotheses on the
      curve -- marking the citation `retrieved` with a `verified_by`. If FG-1 is
      wrong in form or hypotheses, SAY SO; that correction is a useful deliverable
      and costs this task nothing. THEN, and only on a verified relation, state
      the actual question: not whether an orbit action exists, but whether
      quotienting the search by orbits reduces the STORE exponent, the TIME
      exponent, both, or neither, once the orbit bookkeeping is charged. IF NO
      SOURCE CAN BE OPENED, record that and proceed to D3 treating the mechanism
      as unavailable rather than assumed -- the ranking that sent you here rests on
      HEUR-GENERIC-MSUM's own committed falsification_condition, not on FG-1, so
      an unverifiable FG-1 narrows this task's scope and does not void it.
    - >-
      D3. THE HONEST CEILING, COMPUTED BEFORE ANY CONTRACT. Orbits have size
      dividing d, so the naive orbit quotient is a factor of at most d = O(log|F|)
      -- A LOGARITHMIC COFACTOR, WHICH MOVES NO EXPONENT. Say so plainly. Then
      state precisely what would have to be true for the gain to be EXPONENTIAL
      rather than logarithmic: an m-tuple structure whose orbit count is
      polynomial in |F| rather than in d, or a representation-style multiplicity
      where each solution has many orbit-distinct preimages. IF NO SUCH STRUCTURE
      CAN BE NAMED, SAY SO AND SAY IT EARLY -- that is a method ceiling under
      section 8, it is the cheapest possible refutation of rank 1, and delivering
      it is a completed task, not an abandoned one. docs/target-result-profile.md
      biases this program toward exponent-moving mechanisms over logarithmic
      cofactors, and this deliverable is where that bias is applied honestly
      rather than after a contract has been built.
    - >-
      D4. IF AND ONLY IF D3 NAMES A CANDIDATE EXPONENTIAL STRUCTURE: an
      `H-<AREA>-<tok>` hypothesis with mechanism, numbered heuristics each with a
      falsification condition, predictions, test boundary, interpretation limits
      and the full `proof_search_map`; and an `EXP-<AREA>-<tok>` frozen contract
      with controls including the non-Frobenius-stable null base, metrics with
      units, a budget with no null field, stopping rules, invalidation rules,
      required artifacts, and a success_criterion satisfied EQUALLY BY EITHER
      OUTCOME.
    - >-
      D5. THE GOAL BINDING, READ FROM COMMITTED GOAL RECORDS AND NOT INFERRED FROM
      ANY IDENTIFIER PREFIX. Name the owning `GOAL-*` and quote the committed
      objective or completion-criterion text that makes it the owner.
      GOAL-SEMBIN-5078bc is the EXPECTED owner -- H-SEMBIN-8e7ae3 is its
      hypothesis and the heuristic is that hypothesis's -- but verify it and say
      so, and say explicitly which completion criteria this work would and would
      NOT discharge. DEC-20260928-7c3d91 ruled criterion 4 of that goal NOT
      dischargeable by cost-model work; rule the analogous question here in
      advance, before any number exists that looks quotable against it.
    - >-
      D6. AN EXPLICIT STATEMENT OF WHAT A NEGATIVE WOULD AND WOULD NOT ESTABLISH.
      Failing to find a sub-generic oracle does not validate HEUR-GENERIC-MSUM; it
      narrows where one could live. Under docs/inventor-protocol.md a negative
      claiming a lane is dead needs a NAMED OBSTRUCTION with a measured quantity,
      units, error bars, the runs it is read from, the scope claimed, and a
      `resource_check` asking which theory reads that measurement as an ASSET
      rather than a refutation. State in the contract what quantity the obstruction
      would be, in advance.
