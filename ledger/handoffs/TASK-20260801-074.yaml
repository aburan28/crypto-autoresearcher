    either is an integrity failure and never a result.
  - >-
    APPLY RR-LPF-2 AS WRITTEN, IN ITS DECLARED PRECEDENCE ORDER L-0, then L-1, then L-5,
    then exactly one of L-2, L-3, L-4. Do not amend it, do not add a branch, and do not
    read the result into a branch it does not satisfy. Quote the branch condition, the
    observed statistic values, the archived bands and the R(u) table for BOTH arms in the
    decision.
  - >-
    If any L-0, L-1 or L-5 leg fired, the rule is SUSPENDED, the outcome is inconclusive ON
    THE INSTRUMENT, and nothing is asserted about HEUR-DS-1 in either direction.
  - >-
    CARRY THE RTB-054-6 LIMB B DECLARATION WITH EVERY LIMB B STATEMENT. LIMB B is not a
    symmetric 8x test at these cells and a band exit at bits 16 u = 5 is a weaker fact than
    [1/8, 8] makes it look.
  - >-
    READ DIRECTION ONLY FROM STAT-RATE-u. Per OPEN-RR052-D as ruled and extended, a
    STAT-KS-DICK band exit is non-directional and same-signed excursions across cells are
    not directional agreement.
  - >-
    UNDER L-3 THE REFUTATION ARTIFACT IS MANDATORY AND MUST BE ARCHIVED IN OR BEFORE THIS
    SAME COMMIT - the independently re-verified deviation_certificate.json, with
    proof_status `counterexample_certificate` rather than `empirical_only`, and THE
    DIRECTION OF THE DEPARTURE STATED. The disposition is `weaken` on HEUR-DS-1's TOY
    INSTANCE, scoped exactly. `reject_scoped`, and in particular
    reject_scoped-as-impossibility, is FORBIDDEN on a single unreplicated run.
  - >-
    UNDER L-2, `support` IS FORBIDDEN AND HEUR-DS-1 IS NOT VALIDATED AT ANY TIER. State the
    licensed English exactly and state the scale gap in numbers.
  - >-
    UNDER L-4, STATE PLAINLY THAT THE EVIDENCE CANNOT DISCRIMINATE AND THAT AN L-4 OUTCOME
    CARRIES NO DIRECTIONAL INFORMATION. It is the single most likely non-L-2 outcome on a
    correct null.
  - >-
    STATE EXPLICITLY WHETHER OPEN-BATCH023-A IS DISCHARGED. It is discharged only by a valid
    measurement run, and if any suspending leg fired it SURVIVES INTACT and must be said to
    survive.
  - >-
    WRITE THE H-LPF-001 status_history ENTRIES FOR `approved` AND `running` with
    recorded_retrospectively true, each naming the task and the committed receipt that
    effected it, exactly as pre-declared in status_history_policy_batch025. Do not invent a
    date or an authorization.
  - >-
    BEFORE WRITING THE RECORDS, re-list ledger/decisions and ledger/evidence and confirm
    DEC-20260801-012 and EV-LPF-001 are BOTH free in the CURRENT tree including anything
    merged from origin/main since this queue was opened. If either is occupied, renumber
    OUR record and never the other party's, and file a queue amendment binding the declared
    set, artifact_paths and write_scope together.
  - >-
    Do not claim crypto-scale, medium-scale or asymptotic support. Toy stays toy. Promotion
    gates G1-G4 stay OPEN. No `support` under any branch.
  - >-
    Cite no calibration number and no plant-Z number as evidence about any hypothesis.
    RUN-LPF-001-calib and RUN-LPF-001-plantz are expressly non-evidential in either
    direction.
  - >-
    Restate ABS-REL-LPF-1 and ALT-CLASS-LPF-1 IN FULL in the evidence record and in the
    decision, with V1 through V11 as RESTATED BY RR-LPF-2. A statement of a distributional
    result without its uncertified list is an overclaim by omission.
  - >-
    DO NOT EDIT experiments/EXP-LPF-001/reading_rule.yaml, reading_rule_v2.yaml,
    specification.yaml or lpf001_driver.py. Do not alter H-SMTH-001, H-EQD-001, H-DEP-001,
    H-DS-001, H-IC-001 or H-STR-002, do not re-score EV-EQD-001 or EV-DS-001 through
    EV-DS-004, and do not edit any file under experiments/EXP-SMTH-001/,
    experiments/EXP-DS-001/, experiments/EXP-EQD-001/ or experiments/EXP-DEP-001/. Leave
    FAEST and XEDN alone.
  - >-
    FILL knowledge_promotion EITHER WAY. Judge KN-CAND-BATCH024-A against its recorded
    trigger, KN-CAND-BATCH026-A against whether the mechanically regenerated moving_rungs
    DIFFERED from the hand transcription, and KN-CAND-BATCH023-A on its route (b). If
    promoted, the KN-FIND entry and the regenerated knowledge/INDEX.md go in THIS SAME
    commit under /curate-knowledge conventions and require a queue amendment enlarging this
    declared set first. If not, give a concrete not_warranted reason for each.
  - >-
    Carry every declared open item forward stating for each whether it was repaired,
    mitigated or left open - OPEN-BATCH023-A, OPEN-BATCH022-A, OPEN-BATCH022-B,
    OPEN-BATCH023-B, OPEN-BATCH024-A, OPEN-LPF049-A, OPEN-RR052-B, OPEN-RR052-C,
    OPEN-RR052-D, ANOM-LPF052-1, RT049-B6, OPEN-BATCH026-A, OPEN-BATCH026-B,
    KN-CAND-BATCH023-A, KN-CAND-BATCH024-A and KN-CAND-BATCH026-A - and rank the
