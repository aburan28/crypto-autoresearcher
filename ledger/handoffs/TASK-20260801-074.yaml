  - >-
    CONFIRM THE WHOLE CHAIN BEFORE READING THE MEASUREMENT. TASK-20260801-065 must have
    returned ADMISSIBLE and PLANT_Z_VALIDATION_REPORT_SHA256 named in the TASK-20260801-067
