  role: coordinator
  objective: >-
    Compose the lane's closing disposition worksheet: read the producer's run package and
    the Validator's per-joint verdicts, apply the frozen predicate independently, and
    record what the control did and did not establish -- including whether IMP-3's FIRST
    recheck condition is now satisfied and whether its SECOND remains untouched. This
    task writes a worksheet, not a decision; the decision record is authored and
    committed by the ledger archive TASK-20260907-9b71ea.
  uncertainty_reduced: >-
    Whether the four instrument rows compose into a statement narrow enough to be true --
    and, separately, whether the lane can be closed at all in the record. This node
    exists so that the terminal ledger archive has a non-archive source it can consume
    regardless of how the review round ends.
  why_this_task_exists_structurally: >-
    CORR-20260907-5afd89 records a dispatch queue that COULD NOT REPRESENT its own closing
    archival node: every archive task's `source_task_ids` must be non-empty and must name
    non-archive tasks, each non-archive task may be assigned to at most one archive, and
    every artifact path has exactly one owner -- so once a lane's producers are all
    assigned, the queue is closed to any archive its opening plan did not anticipate,
    including the one a lane close needs when a planned terminal archive is cancelled
    unrun. On THIS goal that is not a hypothetical: TASK-20260905-5681fc's review refused
    before check 1 under BATCH-2cca27, and the top-level IMP-1 records review-adversarial
    at xhigh as unservable through the adapter. This task is therefore planned into the
    opening queue as an unconditionally-running non-archive node, so TASK-20260907-9b71ea
    always has a source and the closing checkpoint is always archivable.
