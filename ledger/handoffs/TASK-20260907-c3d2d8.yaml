      Recompute the four instrument verdicts from trials.json yourself, by the frozen
      formula, and mark clearly which quantities you recomputed and which you read. A
      disposition that restates a report's own numbers as its own verification is a
      citation wearing a check's clothes.
    - >-
      Do not relax the frozen predicate. If a cell's outcome is under-credited by the
      formula, record the formula's answer AND the defect_surfaced_otherwise evidence
      beside it, and say which question each answers.
    - >-
      Compose the Validator's per-joint verdicts; do not treat any one of them as a
      verdict on the whole claim. A single blinded reviewer owning four joints in a
      one-reviewer round is stated for what it is.
    - >-
      If the Validator refused for policy reasons, that is an INFRASTRUCTURE outcome under
      core rule 5, never a negative result about sensitivity, and never grounds to accept
