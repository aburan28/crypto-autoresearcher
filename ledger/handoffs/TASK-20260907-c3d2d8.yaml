    - >-
      Assess IMP-3's two recheck conditions SEPARATELY. The first (execution of the
      known-bad control) is what this lane addresses. The second (a served xhigh binding
      from a credentialed backend, probe-verified) is untouched by this lane and must be
      recorded as untouched. IMP-3 does not clear on the first alone.
    - >-
      Change no status. Write no ledger record. Promote nothing. Approve nothing. This is
      a worksheet under this lane's batch directory.
    - >-
      Carry forward, without repairing, the two defects DEC-20260905-6e8621 named for
      supersession: the by_severity low/informational miscount in BATCH-008925's
      release-bound report bytes, and research_goal.updated_at reading 2026-09-05.
    - Read no other lane's claims or entries. BATCH-008925 is another session's open lane.
    - No solver, no benchmark, no network, no Bedrock. maximum_runs is 0. Never commit.
  deliverables:
