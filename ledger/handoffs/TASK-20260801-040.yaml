handoff:
  id: TASK-20260801-040
  from: coordinator
  to: reviewer
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-024
  objective: >-
    Independently review the frozen EXP-DEP-001 contract and the frozen RR-DEP-1 reading rule and
    return PASS or REVISE. THREE DUTIES ARE NAMED AND EACH GETS ITS OWN DELIVERABLE FILE -
    (1) ATTAINABILITY, that some achievable measurement lands in EVERY branch given the measured
    calibration numbers, with each branch classified DEMONSTRATED-REACHABLE or
    REACHABLE-IN-PRINCIPLE, and including the explicit check that NO branch keys on a ledger
    status the record does not hold at freeze time; (2) ANTI-TUNING, that ATS-DEP-1 held;
    (3) ALTERNATIVE-CLASS, that ALT-CLASS-DEP-1 is complete and accurate AGAINST THE DRIVER
    SOURCE.
  uncertainty_reduced: >-
    Whether the measurement is decidable in advance, whether the calibration supplied numbers
    rather than choices, and above all whether the power this experiment will certify is power
    against the class the claim is about.
  inputs:
  - experiments/EXP-DEP-001/specification.yaml
  - experiments/EXP-DEP-001/reading_rule.yaml
  - experiments/EXP-DEP-001/implementation/dep001_driver.py
  - experiments/EXP-DEP-001/results/calib/
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/reviews/TASK-20260801-037/calibration_validation_report.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/archives/TASK-20260801-034/snapshot_commit_receipt.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/archives/TASK-20260801-036/snapshot_commit_receipt.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/archives/TASK-20260801-039/snapshot_commit_receipt.json
  - ledger/evidence/EV-EQD-001.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/reviews/TASK-20260801-030/red_team_report.yaml
  constraints:
  - 'INDEPENDENT SESSION. You did not author any artifact under review.'
  - >-
    DUTY 1 - ATTAINABILITY, deliverable attainability_check.md. Branch by branch and band by
    band, with the MEASURED calibration numbers and not an analytic argument, state whether some
    achievable measurement lands in it and classify it DEMONSTRATED-REACHABLE or
    REACHABLE-IN-PRINCIPLE. RETURN REVISE IF ANY BRANCH IS UNREACHABLE BY CONSTRUCTION. Verify
    explicitly that no branch condition references a hypothesis status, which is the prospective
    half of the OPEN-BATCH023-B repair, and that the THR-DEP-REPRO dead lower leg is DECLARED
    rather than silently relied on.
  - >-
    DUTY 2 - ANTI-TUNING, deliverable anti_tuning_check.md. VERIFY AGAINST GIT that the
    TASK-20260801-034 commit is an ANCESTOR of the TASK-20260801-036 calibration commit;
    recompute every quoted archived EXP-EQD-001 threshold from its named raw array; confirm that
    no statistic, ladder rung, cut or branch was added, dropped, moved or reordered after
    calibration; confirm structurally that the calibration package contains no OBJ-REAL sample
    and no ladder rung; and rule on whether the DEP-CAL-D anchor's declared pre-disclosure was
    honoured as written. If the calibration appears to have TUNED rather than SUPPLIED, that is a
    REVISE.
  - >-
    DUTY 3 - ALTERNATIVE CLASS, deliverable alternative_class_check.md. READ THE DRIVER SOURCE.
    Verify that C1, C2 and C3 are each actually constructed; that each leaves both marginals
    bit-identical AND measurably moves the K = 16 and K = 64 joint tables, so that DESIGN-TRAP-1
    has not recurred in any form; that the certified list does not overstate what the ladders
    reach; and that nothing under U1 through U6 is silently claimed anywhere. A GAP IS A REVISE.
    THIS IS THE DUTY THE BATCH EXISTS FOR - BATCH-023 certified against a plant that moved only
    the e_1 marginal and the deliverables spoke of power in general terms, and repeating that
    here would be inexcusable.
  - >-
    DUTY 3, MANDATORY SUB-CLAUSE - RE-DERIVE THE DESIGN-TRAP-1 INVARIANCE ARGUMENT YOURSELF AND
    DO NOT ACCEPT IT AS WRITTEN. The contract asserts that permuting e_2 WITHIN strata that
    coincide with the chi-square bins leaves the K x K contingency table EXACTLY invariant,
    because the multiset of bin(e_2) inside each e_1 bin is unchanged, and that such a design
    would therefore return the nominal false-rejection rate at every rung BY CONSTRUCTION - a
    power certificate that measures nothing. DERIVE THAT STATEMENT INDEPENDENTLY, then check each
    of the three implemented constructions against it FROM SOURCE and say, for each, at what
    resolution its reordering actually moves mass and why it is not invariant at K = 16 or at
    K = 64. If any construction turns out to be invariant, or invariant at one resolution and not
    the other, that is a REVISE and it is the same class of defect that made the BATCH-023 result
    bound half of what it appeared to.
  - >-
    Attack the design on its merits as well - the choice of rho_star, the comparability of
    eps_det with delta = 0.02, the resolution of the grids at n = 130816, and whether the reading
    in either direction is honest.
  - >-
    Do not run the measurement arm and do not authorize anything. Recommend PASS or REVISE; the
    approval is recorded by TASK-20260801-041.
  - 'MAKE NO COMMIT; TASK-20260801-041 archives these four files.'
  - 'Record inference honestly (requested review-adversarial, independent session).'
  deliverables:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/reviews/TASK-20260801-040/contract_review.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/reviews/TASK-20260801-040/attainability_check.md
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/reviews/TASK-20260801-040/anti_tuning_check.md
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/reviews/TASK-20260801-040/alternative_class_check.md
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/reviews/TASK-20260801-040/contract_review.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/reviews/TASK-20260801-040/attainability_check.md
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/reviews/TASK-20260801-040/anti_tuning_check.md
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/reviews/TASK-20260801-040/alternative_class_check.md
  archived_by: TASK-20260801-041
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 7200
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
  - >-
    A literal PASS or REVISE recommendation; attainability_check.md with a per-branch
    reachability classification in measured numbers and an explicit no-status-keying verdict;
    anti_tuning_check.md with the Git ancestry verified and every threshold recomputed;
    alternative_class_check.md with a source-level verdict on C1, C2, C3 and on U1 through U6;
    blocking objections listed concretely.
