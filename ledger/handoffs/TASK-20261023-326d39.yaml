    written_before_any_reviewer_ran: true
    claim_under_review: 'For E/Q of rank r the number N_E(H) of rational points of naive height H(x) <= H grows
      like c_E (log H)^{r/2} (the slope of log N_E against log log H lies within 1 of r/2 on the ladder of ranks
      0..7 at H <= 10^5). The reductions mod p of those points hit E(F_p) like independent uniform points: the number
      of distinct residues divided by N_p(1 - (1-1/N_p)^N) has median within [0.8, 1.2] and exceeds 1.5 in fewer
      than 5 percent of cells. Consequently the smallest height H_half(p) covering half of E(F_p) satisfies log
      log H_half = (2/r) log p + O(1), i.e. the height needed to lift a random residue grows exponentially in p^{2/r},
      and passing to K = Q(sqrt D) adds the twist''s points (N_E + N_{E^D}, still (log H)^{r_K/2}) with no coverage
      beyond the same uniform model.'
    coordinator_prior: I expect the growth slopes to be fine, the coverage criterion to be uninformative because
      the validator showed it cannot detect excess, and the observed median 1.033 above the null band to have a
      structural cause (reductions of a lattice are more spread than random points) that does not help an attacker.
      This is a prior, not an outcome.
    joints:
    - id: R1
      joint: 'The census supports H-CZLIFT-9a32e9: small points are too few, their reductions behave like uniform
        points, and H_half(p) grows so fast that global lifts are useless.'
      assigned_to: TASK-20261023-326d39
      attack_plan: 'Take the validator''s null band (median 1.0010 to 1.0023) and the observed 1.033: decide whether
        the excess is real, what mechanism gives it (subgroup structure of reduced multiples, collisions avoided
        by lattice spread), and whether it changes the conclusion. Recompute what the coverage criterion can and
        cannot detect, and decide which clauses of the hypothesis the data actually test.'
      breaking_artifact: A clause of the hypothesis presented as measured that the instrument cannot test, or an
        excess with an attacker-relevant mechanism.
    - id: R2
      joint: The H_half(p) extrapolation to cryptographic p is stated with its transfer assumptions.
      assigned_to: TASK-20261023-326d39
      attack_plan: Check the log log H_half versus log p slopes (0.31 to 0.41 against the predicted 2/r) and the
        range of p they rest on; state the transfer assumption to p ~ 2^256 and whether the slope deviation from
        2/r matters. Check the prime-range and twist-cell definition discrepancies the validator found.
      breaking_artifact: An extrapolation stated without its assumption, or a slope fit whose range cannot support
        the claimed exponent.
    blindness:
      mutual: true
      lifted_for:
      - TASK-20261023-326d39
      rationale: 'Hardening round: the red team reads the sealed validation report VAL-20261022-9ab683 so that it
        attacks the admissible receipts and the defects already found, not the raw package from scratch. Other red-team
        reports of this round stay blind.'
    proves_too_much:
      objects:
      - id: PTM-1
        object: A rank-0 curve (11a1), where no lift of a random residue exists at any height.
        known_false_conclusion: Small rational points cover a constant fraction of E(F_p) at some height.
        expected_failure_signature: The coverage argument must give zero growth on 11a1; it does under CORR-20261023-0657da,
          and the red team checks that the H_half reasoning does not assign a finite H_half to it.
      failure_signature: The coverage argument must give zero growth on 11a1; it does under CORR-20261023-0657da,
        and the red team checks that the H_half reasoning does not assign a finite H_half to it.
      assigned_to: TASK-20261023-326d39
    blind_rederivation:
