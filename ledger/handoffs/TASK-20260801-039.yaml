handoff:
  id: TASK-20260801-039
  from: coordinator
  to: coordinator
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-024
  objective: >-
    Commit the exact TASK-20260801-038 reading rule alone, with this receipt, so that RR-DEP-1
    and ATTAIN-RR-DEP-1 are HASH-BOUND BEFORE the independent reviewer reads them and BEFORE any
    ladder rung is measured. A reading rule that could still be edited after review is not
    pre-registered, and an attainability argument that could be written after seeing which branch
    fired is worthless.
  uncertainty_reduced: >-
    Whether the numeric decision rule provably predates the measurement it will classify.
  inputs:
  - TASK-20260801-038 artifacts
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/reviews/TASK-20260801-037/calibration_validation_report.yaml
  constraints:
  - 'RUN ALONE. Stage exactly declared_commit_sets.TASK-20260801-039_snapshot - two paths.'
  - >-
    The committed tree must contain NO OBJ-REAL sample, no deterministic factor-base x-list and
    no ladder-rung measurement of any kind. TASK-20260801-040 is charged with verifying that
    against Git rather than taking this constraint's word for it.
  - >-
    THE RECEIPT MUST RECORD CALIBRATION_VALIDATION_REPORT_SHA256 AND
    CALIBRATION_VALIDATION_VERDICT AS NAMED FIELDS, quoting the sha256 of
    coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/reviews/TASK-20260801-037/calibration_validation_report.yaml
    and its ADMISSIBLE or INADMISSIBLE verdict. DO NOT STAGE THAT FILE - it is owned by
    TASK-20260801-037 and archived by the ledger commit at TASK-20260801-046, because
    research_dispatch.py requires the archive of an independent review to be a ledger archive.
    Recording its hash here binds WHEN it existed and WHAT it said, so the reading rule frozen in
    this same commit cannot later be defended against a report that changed afterwards.
  - >-
    If TASK-20260801-038 recorded a non-execution instead of a reading rule, archive that record
    instead, state NON-EXECUTION explicitly, and do not proceed to the measurement arm.
  - >-
    Do not stage experiments/EXP-DEP-001/specification.yaml, the driver, the calibration package,
    ledger/goals/GOAL-ECDLP-001.yaml, ledger/hypotheses/H-DEP-001.yaml, dispatch_queue.json, any
    EXP-EQD-001, EXP-DS-001 or EXP-SMTH-001 artifact, FAEST or XEDN.
  - >-
    Commit message must contain TASK-20260801-039, TASK-20260801-038, EXP-DEP-001, RR-DEP-1,
    ATTAIN-RR-DEP-1, GOAL-ECDLP-001, BATCH-024.
  - Do not push from this task.
  - >-
    State no interpretation in the receipt, and DO NOT RECORD ANY APPROVAL. This snapshot
    hash-binds a rule; it authorizes nothing. TASK-20260801-041 is the approval gate.
  deliverables:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/archives/TASK-20260801-039/snapshot_commit_receipt.json
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/archives/TASK-20260801-039/snapshot_commit_receipt.json
  archived_by: TASK-20260801-039
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 900
    memory_gb: 1
    maximum_runs: 1
  completion_gate:
  - >-
    Post-commit verifier accepts exact declared paths, parent and hashes;
    CALIBRATION_VALIDATION_REPORT_SHA256 and CALIBRATION_VALIDATION_VERDICT recorded as named
    fields; the receipt records that the committed tree contains no ladder-rung measurement; no
    approval recorded.
