# OPENING LEDGER ARCHIVE, GOAL-MONO-001, BATCH-dce635. Stages the outputs of
# TASK-20261017-a7d642 and DEC-20261017-12e0f4 in ONE isolated commit, ALONE,
# before any reviewer of REVIEW-MONO-20261017-8aff64 may be claimed. Executed
# by the shell-holding top-level session in the coordinator role. Zero runs.
handoff:
  id: TASK-20261017-eb9601
  from: coordinator
  to: coordinator
  goal_id: GOAL-MONO-001
  batch_id: BATCH-dce635
  authorized_by: DEC-20261017-12e0f4 NA-1
  objective: >-
    Commit and bind, in ONE isolated archive commit, exactly the nine expected
    paths: DEC-20261017-12e0f4, the BATCH-3186a5 checkpoint shard, the
    GOAL-MONO-001 goal-head projection, the five BATCH-dce635 handoffs
    (including the pre-review plan REVIEW-MONO-20261017-8aff64 inline in
    TASK-20261017-8aff64) and this card's receipt. Verify, push, open or
    refresh the PR, open lane BATCH-dce635 and close lane BATCH-3186a5. This
    task runs ALONE.
  uncertainty_reduced: >-
    None about the mathematics. It makes the rerank, the batch opening and the
    pre-review plan durable and checkable before any reviewer runs.
  inputs:
    - ledger/decisions/DEC-20261017-12e0f4.yaml
    - ledger/goals/GOAL-MONO-001/goal.yaml
    - ledger/goals/GOAL-MONO-001/checkpoints/BATCH-3186a5.yaml
    - ledger/handoffs/TASK-20261017-a7d642.yaml
    - ledger/handoffs/TASK-20261017-eb9601.yaml
    - ledger/handoffs/TASK-20261017-ccd10c.yaml
    - ledger/handoffs/TASK-20261017-8aff64.yaml
    - ledger/handoffs/TASK-20261017-fb4481.yaml
    - coordination/goals/GOAL-MONO-001/batches/BATCH-dce635/dispatch_queue.json
    - coordination/goals/GOAL-MONO-001/batches/BATCH-3186a5/dispatch_queue.json
  constraints:
    - >-
      LA-1 The opening commit comes first, in its own commit:
      coordination/goals/GOAL-MONO-001/batches/BATCH-dce635/dispatch_queue.json
      only. Push it and render it with tools/research_dispatch.py, which must
      pass. The queue is never staged by this archive. Then run: python3
      tools/goal_lanes.py open-lane GOAL-MONO-001 BATCH-dce635 --queue
      coordination/goals/GOAL-MONO-001/batches/BATCH-dce635/dispatch_queue.json
      --decision DEC-20261017-12e0f4 --objective "Route-(a) rule-12 review
      round (blind re-derivation and joint review) and its archives; closes
      BATCH-3186a5; zero runs" --as <addr> --publish.
    - >-
      LA-2 Merge origin/main into the working branch first, and never rebase.
      Record base_commit_checked and merge_outcome. If the merge touches any
      expected path, check that this lane's edits still apply without
      rewriting another lane's text. A conflict inside a record is never
      resolved by editing it: stop and report. Re-run tools/research_dispatch.py
      on coordination/goals/GOAL-MONO-001/batches/BATCH-3186a5/dispatch_queue.json
      and record that the TASK-20261017-517bbe receipt still verifies; a
      failure stops this archive and is an integrity finding, not a result.
    - >-
      LA-3 Goal-head check, mechanical. The goal.yaml diff against the base may
      contain only: current_batch_id and dispatch_queue_path changed to
      BATCH-dce635 and its queue path; the two new keys
      current_batch_id_before_BATCH-dce635 and
      dispatch_queue_path_before_BATCH-dce635; one appended open_batches item
      for BATCH-dce635; and one new key, next_action_2026_10_17b, under 1,000
      characters. Any other changed or removed line is a scope finding: stop
      and report, and do not repair it.
    - >-
      LA-4 Shard check. ledger/goals/GOAL-MONO-001/checkpoints/BATCH-3186a5.yaml
      does not exist at the base commit (write-once) and parses as a
      batch_checkpoint mapping. If a BATCH-3186a5 shard already exists, stop.
    - >-
      LA-5 Input pinning (DEC-20261017-12e0f4 lesson LD-2). Before staging,
      record in the receipt the sha256 of all nine files TASK-20261017-a7d642
      wrote: the decision, the shard, goal.yaml, the five handoffs, and the
      queue. The queue's working-tree sha256 must equal its LA-1 committed
      blob. After the commit, the eight staged files' sha256 at the commit
      must equal the pinned values. A difference stops the archive.
    - >-
      LA-6 Plan pre-check. Run python3 tools/check_review_independence.py
      --plan ledger/handoffs/TASK-20261017-8aff64.yaml --reports <an empty
      scratch directory outside the repository> and record its output and exit
      code verbatim. Problems that only say a joint owner or the blind owner
      "filed no review_attestation", or that no attestation was found, are
      expected before any reviewer runs. Any other problem (for example an
      empty coordinator_prior, an unowned joint, a joint with two owners, a
      missing attack_plan, an empty failure_signature, an empty blind_from or
      quantity) is a plan defect: stop before staging and report it to the
      Coordinator. It is never repaired here.
    - >-
      LA-7 Prior-isolation check (LS-1). Read the marker string from
      DEC-20261017-12e0f4 coordinator_prior_for_review.marker. It must occur in
      that decision and in no other file this act wrote: grep both review
      cards (ledger/handoffs/TASK-20261017-ccd10c.yaml and
      ledger/handoffs/TASK-20261017-8aff64.yaml), the other three handoffs,
      goal.yaml, the shard and the queue. Record the counts. A hit outside the
      decision stops the archive.
    - >-
      LA-8 Stage exactly the nine expected paths, one by one. git add -A, git
      add . and directory adds are forbidden. Generated indexes
      (knowledge/INDEX.md, ledger/.index/, dispatch plans) are rebuilt if
      needed and never staged (AGENTS.md "Concurrency").
    - >-
      LA-9 Run tools/validate_ledger.py before committing. Stop on any new
      error attributable to a staged path. Record pre-existing errors on main
      as pre-existing (330 at 33fae6822c per the 517bbe receipt) and do not
      repair them. Run tools/check_merge_hygiene.py for the branch and record
      the outcome.
    - >-
      LA-10 binding_mode content_at_commit (goal.yaml has a life after this
      archive). commit_sha, parent_sha and path_sha256 go into this queue's
      archive block in a later commit, with a tasks_state_revisions entry.
    - >-
      LA-11 The commit message names TASK-20261017-eb9601 and every archive
      record_id literally, and states that no status changes and no
      experiment is approved. Verify the receipt with tools/research_dispatch.py.
      Push, and open or refresh the PR against main naming every record id. A
      missing, dirty or scope-expanding commit makes nothing official. It is an
      integrity failure, not a result.
    - >-
      LA-12 After verification: python3 tools/goal_lanes.py close-lane
      GOAL-MONO-001 BATCH-3186a5 --outcome archived --decision
      DEC-20261017-12e0f4 --ledger-commit <this commit_sha> --as <addr>
      --publish. Lane BATCH-dce635 stays open until its successor writes its
      shard.
    - >-
      LA-13 Release this task with --outcome completed and --artifact
      <path>=<64-hex sha256> for each of its two artifact paths, computed at
      release (lesson LD-1; never --artifact <path> alone, which records an
      empty digest). Check that the release JSON carries two non-empty
      digests and record them in the tasks_state_revisions entry.
    - LA-14 Never edit a staged file while staging. Never amend, rebase or force-push. Zero runs.
  deliverables:
    - >-
      coordination/goals/GOAL-MONO-001/batches/BATCH-dce635/archives/TASK-20261017-eb9601/ledger-receipt.json.
      It holds commit_sha (null inside the commit), parent_sha,
      base_commit_checked, merge_outcome, binding_mode, path_sha256 for every
      staged path, record_ids, the LA-2 (517bbe re-verification), LA-3, LA-4,
      LA-5, LA-6 and LA-7 outcomes, the reserved-id --check results, and the
      validate_ledger.py, check_merge_hygiene.py and research_dispatch.py
      outcomes.
    - One isolated commit, a pushed branch, an open or refreshed PR, lane BATCH-dce635 opened and lane BATCH-3186a5 closed archived.
  artifact_paths:
    - coordination/goals/GOAL-MONO-001/batches/BATCH-dce635/archives/TASK-20261017-eb9601/ledger-receipt.json
    - ledger/decisions/DEC-20261017-12e0f4.yaml
