  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    reasoning_effort_note: null means the policy default (high). The shell-holding top-level session does the staging and hashing.
    fallback_allowed: true
    fallback_note: Runtime inheritance under the Claude Code harness. Backend or model substitution only. Never Bedrock.
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 1800
    memory_gb: 1
    maximum_runs: 0
  dispatch_preconditions:
    - id: LP-1
      text: archived_by is bound (SELF). AGENTS.md standing precondition 1.
    - id: LP-2
      text: LA-1 is done, the queue is committed, pushed and renders clean, and lane BATCH-dce635 is open.
    - id: LP-3
      text: >-
        Claim after git fetch: python3 tools/goal_lanes.py claim
        coordination/goals/GOAL-MONO-001/batches/BATCH-dce635/dispatch_queue.json
        TASK-20261017-eb9601 --as <addr> --ttl-minutes 45 --publish. Release it
        per LA-13.
    - id: LP-4
      text: RUNS ALONE. No other GOAL-MONO-001 task is live (campaign_budget.max_concurrent 1).
  completion_gate:
    - origin/main merged (never rebased), with base_commit_checked and merge_outcome recorded; the 517bbe receipt re-verified.
    - LA-3, LA-4, LA-5, LA-6 and LA-7 passed and are recorded in the receipt.
    - One commit binds exactly the nine expected paths, and its receipt verifies under tools/research_dispatch.py.
    - validate_ledger.py shows no new error attributable to a staged path.
    - The branch is pushed, the PR is open and names every record id, lane BATCH-dce635 is open and lane BATCH-3186a5 is closed archived.
    - The release carries two non-empty artifact digests. Zero runs.
  return_format: >-
