    outcomes, validator, hygiene and dispatcher outcomes), the PR reference,
    the opened-lane and closed-lane record paths, and the release digests.
  review_plan: null
  review_required: false
  review_required_note: FALSE. An archive stages and verifies. It judges nothing.
  runs_launched: 0
