handoff:
  id: TASK-20260907-808ec2
  from: coordinator
  to: executor
  objective: >-
    Implement and execute only the approved eight-fixture definition audit
    EXP-PFDR-a76b91 (version 1, successor of EXP-PFDR-845d33) in its four
    frozen run groups, inside the pinned Linux container per the contract's
    execution_environment section. The scientific protocol is unchanged from
    the predecessor; only the run IDs, the receipt channel, and the execution
    environment differ. Record observations only; do not interpret results.
  uncertainty_reduced: >-
    Whether the frozen eight-fixture audit can complete (measured groups 2 and
    4; unmeasured-by-design groups 1 and 3) under an enforceable 8 GiB hard
    memory boundary, given that the host kernel cannot enforce it and the
    predecessor's attempt measured zero fixtures.
  inputs:
    - experiments/EXP-PFDR-a76b91/specification.yaml (the frozen contract; status approved, version 1, approved_by DEC-20260907-c9b61c)
    - experiments/EXP-PFDR-a76b91/implementation.md (freeze; the frozen sha256 block is authoritative)
    - ledger/hypotheses/H-PFDR-2139a5.yaml
    - ledger/decisions/DEC-20260907-c9b61c.yaml (this successor's approval)
    - ledger/decisions/DEC-20260907-a39256.yaml (re-filed user execution authorization)
    - ledger/decisions/DEC-20260906-280035.yaml (the disposition this contract discharges)
    - ledger/decisions/DEC-20260906-126882.yaml (predecessor approval; protocol-equivalence basis)
    - tools/audit_process.py (supervisor; as committed on main)
    - docs/first-fall-audit-repair.md (repair boundary and adapter mandate)
    - schemas/run-manifest.schema.json (canonical manifest schema)
    - experiments/EXP-PFDR-845d33/ (predecessor, immutable reference including its four failure receipts)
  constraints:
    - Start only after this contract's snapshot commit exists and the frozen hashes re-verify (driver self-assert + adapter re-check).
    - Execute from a clean full clone of this branch (not a worktree: the container needs a self-contained .git directory for the driver's commit/dirty capture).
    - Four serial groups only, maximum 900 seconds each, total 3600 seconds, 8 GiB, one worker, one container per group. No additional parameter search, reruns of a completed group, or budget expansion.
    - The pinned image sha256:1c633a1d80264a1ff31824a06a5b8ea8566e6277bd7af4fa5db6dd993d4ec4de is the only admissible image; no tag pull, no image rebuild after freeze.
    - The driver and adapter are frozen; do not edit them. A launch that cannot succeed as frozen is recorded as its infrastructure class, never patched mid-run.
    - An unresolved native-definition interface is unmeasured, never assumed (groups 1 and 3 expected unmeasured-by-design, as in the predecessor).
    - Write every reserved artifact for every group via the adapter; for a group not measured write the honest unmeasured record with cause and empty data instead of fabricating results.
    - Retain anomalies, stderr, failed checks, censorship and resource stops. Infrastructure failures and incomplete certificates are never negative mathematical evidence.
    - No commits by this task; the Coordinator archives. No Bedrock. No changes to hypotheses, the predecessor package, or other experiments.
