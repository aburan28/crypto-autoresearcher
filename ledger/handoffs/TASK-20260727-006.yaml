handoff:
  id: TASK-20260727-006
  from: coordinator
  to: coordinator
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-009
  authorized_by: DEC-20260727-002
  task_kind: archive
  depends_on:
    - TASK-20260727-005
  archive:
    kind: ledger
    source_task_ids:
      - TASK-20260727-005
    commit_sha: null
    parent_sha: null
    path_sha256: {}
    record_ids:
      - EV-GGM-002
      - DEC-20260727-003
      - H-GGM-001
      - GOAL-ECDLP-001
      - BATCH-009
  objective: >-
    Install, as one isolated verified ledger commit, the TASK-20260727-005 determination,
    the superseding evidence record EV-GGM-002, the superseding decision record
    DEC-20260727-003, the single H-GGM-001 status transition it authorises, and the
    GOAL-ECDLP-001 checkpoint for BATCH-009 including the campaign_budget.maximum_batches
    extension authorised by DEC-20260727-002.
  uncertainty_reduced: >-
    Whether the ruled H-GGM-001 status transition and the superseding evidence record are
    durable, hash-bound and officially recorded, and what the goal record now says about
    the campaign.
  inputs:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/decisions/TASK-20260727-005/status_determination.yaml,
      blocks proposed_decision_record and proposed_evidence_record
    - the same file's exact single-field edit for ledger/hypotheses/H-GGM-001.yaml and its
      goal-checkpoint field list
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/archives/TASK-20260727-004/snapshot_commit_receipt.json
    - ledger/decisions/DEC-20260727-002.yaml, which authorises the
      campaign_budget.maximum_batches extension from 6 to 8 that this task applies
    - ledger/goals/GOAL-ECDLP-001.yaml as it stands at commit time, which may have been
      advanced by a concurrent co-driver runtime
    - templates/research-records.md evidence, coordinator_decision, hypothesis and
      research_goal schemas
  constraints:
    - Run alone. Stage only the declared paths plus the two TASK-20260727-005 source
      artifacts. Preserve unrelated dirty files. Do not stage AppleDouble siblings (._*).
    - >-
      Install the determination VERBATIM. proposed_decision_record becomes
      ledger/decisions/DEC-20260727-003.yaml and proposed_evidence_record becomes
      ledger/evidence/EV-GGM-002.yaml with no substantive edit. If either block is
      incomplete or does not conform to its schema, stop and record the defect; do not
      exercise fresh judgement inside a commit task.
    - Apply exactly ONE field change to ledger/hypotheses/H-GGM-001.yaml — its status, to
      the value DEC-20260727-003 authorises. Change nothing else in that record.
    - Do NOT overwrite EV-GGM-001, DEC-20260726-007, or any other published record.
      Corrections supersede, never overwrite.
    - >-
      Do NOT touch experiments/EXP-GGM-001/ or anything under knowledge/. knowledge/INDEX.md
      and two KN-FIND entries carry unresolved Git conflict markers; any promotion or
      index regeneration belongs to the separate repair batch named in BATCH-009
      known_open_defects.
    - >-
      GOAL RECORD. Re-read ledger/goals/GOAL-ECDLP-001.yaml at commit time and reconcile
      against its then-current committed content, not against any earlier copy. Apply
      campaign_budget.maximum_batches 6 -> 8 citing DEC-20260727-002; set current_batch_id
      BATCH-009 and dispatch_queue_path to this batch's queue; append the BATCH-009
      checkpoint with its exact task ids, both producer verdicts, the evidence and
      decision ids, the archive task ids and a claim_boundary; set latest_verified_commit
      only to a commit whose verification is recorded in a committed receipt; and preserve
      exactly ONE next_action. If a concurrent co-driver has changed the record, record
      the divergence rather than silently discarding their next_action.
    - >-
      GOAL STATUS. paused, blocked, closed_at_budget and active are all available;
      completed is NOT, under any outcome of this batch. AGENTS.md rule 13 requires three
      CONCUR attestations with pairwise-distinct resolved_model_id, none exists, and no
      attestation may be recorded that was not obtained. State which status was set and
      which condition was applied.
    - >-
      Update this batch's dispatch_queue.json card states from committed receipts only,
      and include that file among the staged paths. Two consecutive batches closed with a
      stale queue because the verifier only checks paths the archive itself declared; this
      archive declares its own queue.
    - >-
      The commit message must contain the literal string TASK-20260727-006 and every entry
      of archive.record_ids, and must also name TASK-20260727-005. BATCH-004's ledger
      archive is permanently blocked for omitting its task id; do not repeat it.
    - Compute every SHA-256 from Git object content at the resulting commit, never from the
      working tree. Never invent, estimate or back-fill a hash or commit sha.
    - >-
      Run the full post-commit check — resolves, ancestor of HEAD, declared first parent,
      exactly the declared paths with no extras or deletions, every SHA-256 matching commit
      content, message contains the task id and every record id — and record the per-check
      result. Stop on any failure and record it rather than a research conclusion.
    - Authorize no execution of EXP-GGM-001 or any other experiment.
  deliverables:
    - ledger_commit_receipt.json with kind ledger, source_task_ids, record_ids, declared
      paths, commit_sha, parent_sha, complete path_sha256, and a post_commit_verification
      block with a per-check result and one verdict
    - ledger/evidence/EV-GGM-002.yaml installed verbatim from the determination,
      superseding EV-GGM-001 with run_ids populated
    - ledger/decisions/DEC-20260727-003.yaml installed verbatim from the determination,
      with knowledge_promotion filled
    - ledger/hypotheses/H-GGM-001.yaml with exactly one field changed
    - ledger/goals/GOAL-ECDLP-001.yaml with the extended batch budget, the BATCH-009
      checkpoint, the applied status condition and exactly one next_action
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/dispatch_queue.json with card
      states set from committed receipts
  artifact_paths:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/archives/TASK-20260727-006/ledger_commit_receipt.json
    - ledger/evidence/EV-GGM-002.yaml
    - ledger/decisions/DEC-20260727-003.yaml
    - ledger/hypotheses/H-GGM-001.yaml
    - ledger/goals/GOAL-ECDLP-001.yaml
  write_scope:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/archives/TASK-20260727-006/
    - ledger/evidence/
    - ledger/decisions/
    - ledger/hypotheses/
    - ledger/goals/
  archived_by: TASK-20260727-006
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 900
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
    - The two ledger records were installed verbatim from the determination, or the
      archive stopped with the defect recorded.
    - Exactly one field of ledger/hypotheses/H-GGM-001.yaml was changed, and no published
      record was overwritten.
    - The goal record carries the extended batch budget citing DEC-20260727-002, the
      BATCH-009 checkpoint, the applied status condition and exactly one next_action,
      reconciled against its then-current committed content.
    - GOAL-ECDLP-001 was not set to completed and no closure attestation was recorded.
    - This batch's dispatch_queue.json is among the staged paths and its card states are
      set from committed receipts only.
    - The commit message contains the literal TASK-20260727-006, TASK-20260727-005, and
      every archive.record_ids entry.
    - Every SHA-256 was computed in this task from Git object content, and the
      post-commit verification block records a result for each required check and one
      verdict.
    - Nothing under experiments/ or knowledge/ was modified and no execution was
      authorized.
  return_format: Coordinator ledger archive receipt JSON plus the installed immutable
    evidence, decision, hypothesis and goal records.
