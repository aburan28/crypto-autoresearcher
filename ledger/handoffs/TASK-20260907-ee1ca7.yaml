  constraints:
    - "INDEPENDENT SESSION, MUTUALLY BLIND. You may not read the Validator TASK-20260907-b2a8ad's report, seal, code, notes or task directory in this round (review_plan.blindness.mutual: true, lifted_for: []). Your review_attestation must record `read_sibling_reports: false` honestly. An accidental read is declared, never absorbed."
    - "REPORT ON YOUR OWN JOINTS. J4, J5, J6. Do not opine on the blind re-derivation or the predicate-fidelity audit: they are owned, and a second opinion on an owned joint means some joint has none."
    - "PROVES-TOO-MUCH IS A STOPPING CONDITION FOR INTERPRETATION, NOT AN INVALIDATION AND NOT A NEGATIVE RESULT. If the predicate PASSES at a known-false object, report every measurement, report the firing FIRST and explicitly, and state that no PASS in this batch may be read as support until the Coordinator adjudicates it. Do not invalidate the runs and do not adjudicate it yourself."
    - "AN ARTIFACT TELL IS A FINDING EVEN WHEN THE HEADLINE LOOKS GOOD. A margin that does not decay in r, or a null margin that sits close to the real margin, is reportable AS SUCH even if every primary cell passed. This is the whole point of running controls before belief."
    - "A DEFECT IS A FINDING, NOT A FIX. You do not repair, re-score, re-run for the producer, or edit any run record, specification, amendment or executor artifact."
    - "AN INFRASTRUCTURE FAILURE IS NEVER MATHEMATICAL EVIDENCE. A timeout, crash or memory stop is failed_infrastructure and is not evidence against G3-feasibility at any a (AGENTS.md core rule 5). Do not convert one into a negative finding."
