    predicate, or a cost statement quoted without its siblings. Concretely:
    does the predicate still FAIL where feasibility is already known false;
    does the margin exceed its own null; does the margin decay when the
    parameter meant to destroy it grows; and does the package claim more than
    a ceiling measurement can license.

