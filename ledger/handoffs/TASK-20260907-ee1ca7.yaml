    - "PREMATURE CLOSURE IS A FAILURE MODE SYMMETRIC WITH OVERCLAIMING (docs/inventor-protocol.md). If you conclude a lane is dead, you owe a NAMED OBSTRUCTION with a measured quantity, units, error bars, the runs it is read from, the scope claimed, and a `resource_check` asking which theory reads that measurement as an asset. A count of things that looked bad is a fatigue report, and its honest status is `unverified`."
