  budget:
    wall_clock_seconds: 1000
    memory_gb: 4
    maximum_runs: 6
    queue_computed_binding_stop_utc: '2026-08-10T00:55:13Z'
  budget_basis: >-
    SIZED AGAINST protocol-amendment-GOAL-AES-001-005 PART A's red-team line, which
    records ONE measured datum -- 668 s (TASK-810), well under its declared 1000 -- and
    SIZES AT 1000 AND NOT AT 668, on the stated ground that ONE TASK IS NOT A
    DISTRIBUTION and that a pass which found a live counter-witness early is NO EVIDENCE
    the next will be cheap. Sizing to the single low observation would be exactly the
    error amendment 005 exists to stop making. NO CUSHION ON TOP AND NONE TO BE
    INFERRED. Calibrated against AUTHORING-INCLUSIVE elapsed under C4 with compute
    reported separately. THE DECLARATION IS A BINDING STOP CONDITION, NOT AN ALLOWANCE.
  completion_gate:
    - >-
      budget_stamps.json written as the first act with a computed binding_stop_utc,
      boundary stamps, a truthful halted_on_budget and EVERY UNRUN ATTACK NAMED, and
      COMMITTED; redteam_findings.yaml is the covering manifest and reports session
      elapsed and compute seconds SEPARATELY.
    - The snapshot receipt is confirmed against Git, or the task stops and reports an evidence-integrity failure.
    - >-
      ALL THREE TARGETS attacked and reported separately, with the effort allocation and
      its reason stated and anything not attacked NAMED per target.
    - >-
      TARGET 1: any stated proposition attacked on whether the index bound is derived or
      asserted and on whether the subgroup is the one Step 1 emits; TYPE-STABILITY
      attacked SEPARATELY from existence; an explicit search for UNNUMBERED conditional
      dependences performed and reported with any found recorded as MAJOR; and where the
      package reports no such subgroup exists, an attempt to construct one made and its
      progress reported.
    - >-
      TARGET 2: the census attacked as an instrument on the quantity measured, the
      separation of the two composition models, the basis of the leg C disposition, and
      whether any unrun leg or sample shortfall does work it cannot do in either
      direction; and if the numbers falsify RT-2, its withdrawal recommended plainly.
    - >-
      TARGET 3: the layer-dependence screen v2 attacked on all four named surfaces and
      any found; an attempt made to construct a candidate that passes it and is
      nonetheless vacuous or intractable; and an explicit statement of whether the reform
      makes the screen CORRECT or merely HARMLESS.
    - >-
      The analogue-to-cipher transfer attacked, and the honest-accounting fields and any
      recalled literature numbers checked.
    - >-
      A concrete bounded settling experiment specified for the strongest objection ON
      EACH TARGET, with what would falsify the objection itself, and an honest note that
      BATCH-006 is reserved and the control is likely to be recorded OPEN AND
      UNATTEMPTED.
    - >-
      Every finding labelled DEMONSTRATED (with a reproduction) or UNRESOLVED (with
      why); no unrun attack presented as an attack that found nothing.
    - >-
      redteam_findings.yaml lists every objection with a severity and a settling control
      where one exists, carries the red team's own inference block with the
      SESSION-NOT-MODEL and CORRELATED-PAIR statements, asserts no official state
      change, assigns no evidence strength, and recommends no promotion.
    - No producer artifact modified; all writes under this task's own directory.
  return_format: >-
    The three artifacts, plus a plain statement of: (i) the effort allocation across the
    three targets and its reason; (ii) the strongest finding on each target with its
    DEMONSTRATED / UNRESOLVED label; (iii) any UNNUMBERED conditional dependence found,
    named first; (iv) whether the census falsifies RT-2 and whether you withdraw it;
    (v) whether the layer-dependence screen v2 is CORRECT or merely HARMLESS; (vi) the
    settling control for each target; (vii) every attack not run, named; (viii)
    authoring-inclusive session elapsed and, separately, compute seconds.
