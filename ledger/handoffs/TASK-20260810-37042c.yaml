handoff:
  id: TASK-20260810-37042c
  from: coordinator
  to: red-team
  objective: >-
    ADVERSARIAL review of the committed BATCH-005 package on THREE MANDATORY TARGETS,
    each reported separately and none of them a formality. TARGET 1 -- THE
    BOUNDED-INDEX-SUBGROUP RESIDUAL (TASK-20260810-51fafe): if a proposition is stated,
    TRY TO BREAK IT; attack the TYPE-STABILITY claim hardest, because a subgroup that
    EXISTS but is not emitted-and-consumed by Step 1 does NOT repair the induction and
    existence-dressed-as-repair is this batch's most likely overstatement; hunt for an
    UNNUMBERED conditional dependence; and if a counterexample certificate is offered,
    TRY TO BREAK THE CERTIFICATE. If the package reports no such subgroup exists, TRY
    TO CONSTRUCT ONE, even crudely, and report how far you got -- a negative closure an
    adversary can walk past in one sitting is not a closure. TARGET 2 -- THE CTRL-810-A
    CENSUS (TASK-20260810-a0e0ae): attack it AS AN INSTRUMENT -- does it measure the
    quantity RT-2's dimension count is about; are M-affine and M-nonlinear genuinely
    separated; does the leg C disposition rest on the probe or on convenience; is an
    unrun leg or a sample shortfall anywhere doing work it cannot do; and does the
    reported outcome follow from the numbers, INCLUDING the outcome that falsifies your
    predecessor's own RT-2. TARGET 3 -- THE LAYER-DEPENDENCE SCREEN v2, WHICH THE
    COORDINATOR ENACTED IN THE BATCH-005 QUEUE AND WHICH NO INDEPENDENT PARTY SAW
    BEFORE IT BOUND TWO PRODUCERS. Its predecessor was broken by the first red team on
    first contact and the replacement was written by the same role that wrote the rule
    that broke. ATTACK IT.
  uncertainty_reduced: >-
    Whether the batch's outputs survive an ADVERSARY rather than a CHECKER. The
    validator asks "is this correct"; you ask "how would this be wrong, and what would
    it take to show it". Two of this batch's three targets have never been attacked at
    all: rank 1 is an attempt at a POSITIVE structural statement in the exact place a
    previous positive statement was voided, and the screen v2 is a Coordinator rule
    change enacted without independent review. The third, the census, is the control
    that decides whether three MAJOR red-team findings stand -- INCLUDING ONE OF YOUR
    PREDECESSOR'S OWN.
  inputs:
    - >-
      The full task card, which names four specific attack surfaces on the screen v2
      that the Coordinator states against itself:
      coordination/goals/GOAL-AES-001/batches/BATCH-005/tasks/TASK-20260810-37042c/task_card.yaml
    - The verified TASK-20260810-415ed7 snapshot receipt and the eleven committed producer artifacts
    - >-
      coordination/goals/GOAL-AES-001/batches/BATCH-005/dispatch_queue.json, in
      particular batch_notes.layer_dependence_screen_v2 (TARGET 3, in full),
      batch_notes.rank_2_infrastructure_blocker_resolution, and
      batch_notes.what_is_not_in_this_queue_and_is_open_and_unattempted.
    - >-
      TASK-20260801-810's redteam_findings.yaml -- YOUR PREDECESSOR'S OWN FINDINGS,
      which you hold to the same standard as everything else: RT-1 is a WITNESS, not a
      minimum; RT-2 is a DIMENSION COUNT, not a measurement; RT-3 and RT-4 are
      OMISSIONS, not demonstrated falsehoods; RT-5 is UNRESOLVED; and RT-8 through
      RT-11 are the findings that broke the screen v2's predecessor.
    - >-
      docs/target-result-profile.md and the honest-accounting fields dominated_by and
      sota_delta; docs/inventor-protocol.md section 4 closure standard and its statement
      that PREMATURE CLOSURE IS SYMMETRIC WITH OVERCLAIMING.
    - >-
      ledger/evidence/EV-AES-004.yaml and ledger/goals/GOAL-AES-001.yaml. NOTE DEFECT
      D-4403de-1: this campaign's decision records are NOT present at the
      ledger/decisions/DEC-20260731-0XX.yaml paths in this tree -- those files belong to
      GOAL-ECDLP-001 -- and verifying or refuting that from git history is a legitimate
      and welcome finding.
  constraints:
    - >-
      READ ONLY COMMITTED ARTIFACTS, and confirm the snapshot receipt against Git before
      recording any finding. If it does not verify, STOP and report an
      EVIDENCE-INTEGRITY FAILURE.
    - >-
      THE C2 STAMP DUTY APPLIES TO YOU, AND YOUR PREDECESSOR TASK-20260801-810's
      `budget` block IS ITS REFERENCE IMPLEMENTATION -- it did this voluntarily when the
      rule was unclear and amendment 005 Part B codifies exactly what it did. As your
      FIRST ACT write budget_stamps.json with start_utc, start_epoch,
      declared_wall_clock_seconds and binding_stop_utc COMPUTED as YOUR OWN start plus
      1000 s; stamp EACH major section boundary; HALT at binding_stop_utc, record
      halted_on_budget truthfully, and NAME EVERY ATTACK YOU DID NOT RUN so an unrun
      attack is never mistaken for an attack that found nothing; COMMIT the stamps. The
      QUEUE-COMPUTED binding_stop_utc is 2026-08-10T00:55:13Z (dispatch stamp + 1000 s)
      and is a DISPATCH-BASIS REFERENCE; THE STOP YOU HALT ON IS THE ONE YOU COMPUTE
      FROM YOUR OWN START. Under C4, 1000 s is AUTHORING-INCLUSIVE and COMPUTE IS
      REPORTED SEPARATELY; COMPUTE SECONDS MAY NOT BE OFFERED AS BUDGET COMPLIANCE.
    - >-
      ALL THREE TARGETS ARE MANDATORY AND EACH IS REPORTED SEPARATELY. State your effort
      allocation and its reason. If budget forces you to stop, NAME WHAT YOU DID NOT
      ATTACK ON EACH TARGET.
    - >-
      TARGET 3 IS NOT OPTIONAL AND IS NOT A COURTESY. Work the four named attack
      surfaces and any you find: (i) does the screen v2 filter ANYTHING, given RT-11
      showed any candidate can be re-posed round-independently to obtain n = 1; (ii) is
      requirement 4's separate tractability judgement AUDITABLE, or a licence phrased as
      a duty; (iii) does DEFERRED_UNBOUNDED let a producer decline work at no cost;
      (iv) does requirement 5's own concession that the screen is TOO PERMISSIVE leave a
      screen that kills nothing while still being cited as one. TRY TO CONSTRUCT A
      CANDIDATE THAT PASSES THE SCREEN AND IS NONETHELESS VACUOUS OR INTRACTABLE. IF THE
      REFORM MERELY MAKES A BROKEN SCREEN HARMLESS RATHER THAN CORRECT, SAY SO.
    - >-
      HOLD YOUR PREDECESSOR TO THE SAME STANDARD. If the census falsifies RT-2, SAY SO
      PLAINLY AND RECOMMEND ITS WITHDRAWAL: your predecessor named that outcome
      deliberately against itself, and defending a prior red-team finding against
      measurement would be the worst available failure of this role.
    - >-
      BOTH DIRECTIONS OF FAILURE ARE IN SCOPE. Overclaiming and PREMATURE CLOSURE are
      symmetric, and this campaign has already committed one instance of premature
      closure -- it was NOT PAUSED specifically because it had screened out its best
      remaining exponent-relevant candidate on an erroneous constant. If BATCH-005
      declined work it should have done, that finding is at least as valuable as
      breaking a bound.
    - >-
      ATTACK THE ANALOGUE -- every scaled-down computation runs in a field that is not
      the cipher's and the GF(2^2) analogue is additionally NOT MDS -- and ATTACK THE
      HONEST ACCOUNTING, checking dominated_by, sota_delta and any recalled literature
      number used as if read. Every literature statement here is UNVERIFIED-FROM-MEMORY
      and novelty is UNRESOLVABLE in this environment; SO WOULD YOU BE COMMITTING THE
      ERROR IF YOU REBUTTED ONE WITH ANOTHER RECOLLECTION.
    - >-
      PROPOSE THE NEXT CONTROL FOR YOUR STRONGEST OBJECTION ON EACH TARGET -- what to
      compute or sample, at what scale, what each outcome means, and WHAT WOULD FALSIFY
      YOUR OWN OBJECTION. An objection without a settling control is an opinion. HARD
      CONSTRAINT ON YOUR PROPOSAL: BATCH-006 IS THE LAST BATCH AND IS RESERVED FOR
      CONSOLIDATION, REVIEW AND THE TERMINAL RECORD, so a control you propose is very
      likely to be recorded OPEN AND UNATTEMPTED rather than run. Propose it anyway and
      size it honestly.
    - >-
      DISTINGUISH AN OBJECTION FROM A REFUTATION AND SAY WHICH YOU HAVE: DEMONSTRATED
      with a reproduction, or UNRESOLVED with why (the V-804-6 precedent). Absence of
      evidence is not evidence of absence and an unrun probe is not a null result.
    - >-
      DO NOT FIX ANYTHING. Do not repair, edit, extend or re-run producer artifacts and
      do not write the proposition you think should have been written. Objections are
      RECORDED, NOT REMEDIED. Write only under this task's own directory.
    - >-
      CHANGE NO OFFICIAL STATE: no hypothesis status, no ledger record, no promotion, NO
      EVIDENCE STRENGTH. YOU MAY RECOMMEND AGAINST PROMOTION AND SHOULD, IF WARRANTED.
    - >-
      RECORD YOUR OWN INFERENCE BLOCK and state plainly that under inference-amendment
      0137a051 your independence is in SESSION AND NOT IN MODEL, that this BLOCKS ANY
      GOAL-CLOSURE ATTESTATION FROM YOUR SESSION, and that A VALIDATOR CONCUR PLUS A
      RED-TEAM CONCUR IS ONE DRAW FROM A CORRELATED PAIR, NOT TWO.
    - >-
      PART C APPLIES TO YOUR ARTIFACTS: redteam_findings.yaml is the COVERING MANIFEST
      of this task, carries an artifact_provenance list covering every declared artifact
      with budget_stamps.json as an ENTRY and its own entry as SELF, every `kind` inside
      the CLOSED CASE-INSENSITIVE four-class vocabulary with NO FIFTH CLASS INVENTED,
      and a filled inference block on every artifact with the standing basis 0137a051.
  deliverables:
    - budget_stamps.json
    - redteam_report.md
    - redteam_findings.yaml
  artifact_paths:
    - coordination/goals/GOAL-AES-001/batches/BATCH-005/tasks/TASK-20260810-37042c/budget_stamps.json
    - coordination/goals/GOAL-AES-001/batches/BATCH-005/tasks/TASK-20260810-37042c/redteam_report.md
    - coordination/goals/GOAL-AES-001/batches/BATCH-005/tasks/TASK-20260810-37042c/redteam_findings.yaml
  archived_by: TASK-20260810-b26b16
  inference:
    policy: review-adversarial
    requested_policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
    standing_basis: >-
      inference-amendment commit 0137a051eb5828789eb267fa83c8278086578d4c.
      Cross-model independence is UNAVAILABLE campaign-wide: this session supplies
      SESSION independence and NOT MODEL independence, resolves to the same model as
      both producers, the validator and the Coordinator, and CAN SUPPLY NO CLOSURE
      ATTESTATION. Agreement with the validator is CORRELATED, not independent
