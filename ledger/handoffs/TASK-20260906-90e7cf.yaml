      seal_protocol: >-
        The same validator owns J1, which requires reading the producer's
        code and run records. Independence of J2 is therefore SEQUENCED,
        not partitioned: J2 is computed and SEALED (blind_rederivation_
        sealed.json, sha256 and UTC timestamp recorded in the attestation)
        before any file body under blind_from is opened, and the
        attestation's sources_read lists the pre-seal reads (the list the
        checker tests against blind_from) while sources_read_after_seal
        lists the post-seal reads completely. The ledger archive verifies
        the seal: the sealed file's sha256 matches the attestation, its
        timestamp precedes the first post-seal read in the validator's
        command log, and the sealed values are the ones compared in the
