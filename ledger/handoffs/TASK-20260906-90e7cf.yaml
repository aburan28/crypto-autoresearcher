  completion_gate:
  - "red_team_report.yaml exists inside write_scope and parses as strict YAML."
  - "J3 checks (i)-(v) each carry a worked number from the raw records and the sentence enumeration covers every outcome the ledger archive may face."
  - "J4 run on all three objects with the observed failure signature beside the required one and the pipeline diff recorded; any object on which the argument went through is reported as BROKEN with the criterion named."
  - "review_attestation present with joints_owned exactly [J3, J4], read_sibling_reports false, verdict in {holds, breaks, inconclusive}; no path under the validator directory read; nothing written outside the task directory; no commit."
  return_format: null
  review_plan:
    plan_note: >-
      Written by the Coordinator BEFORE any executor run exists and before
      either reviewer runs (AGENTS.md "Review architecture"). This block is
      byte-identical on ledger/handoffs/TASK-20260906-7ec3ea.yaml and
      ledger/handoffs/TASK-20260906-90e7cf.yaml; each reviewer card's
      review_plan_path points at its own handoff. Joints are named J1-J4
      and a reviewer's attestation lists them in joints_owned by those
      exact labels. The ledger archive TASK-20260906-aa3dd2 runs
      `python3 tools/check_review_independence.py --batch
      coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-289698 --plan
      ledger/handoffs/TASK-20260906-7ec3ea.yaml` before composing (the
      plan lives on the ledger handoffs, outside the batch directory, so
      --plan is passed explicitly).
    claim_under_review: >-
      Two producer claims, as the frozen contracts will state them once the
      executors report. EXP-ECDLP-612fb1 (H-ECDLP-37dc01, executor
      TASK-20260906-3623b9): "at a = 1/4, r = 2, k = 4 on the generic
      keyed-random-function instrument at both N = 2^24 and N = 2^30, with
      gate G1 reported at 2^20 and gate G2 passed at each N, the
      LOWER-bracket re-selected table of T/2 entries reaches the static T
      table's steady-state per-target success within the 95% CI by U = 8T
      (S1), with NULL-A's gain within CI of zero at every round and NULL-B
      and PHI(0) bit-identical to STATIC (S2), the phi decay non-decreasing
      with gain(0) = 0 and gain(1) - gain(0.1) CI-separated above zero
      (S3), and no re-selected table's hit rate exceeding the exact oracle
      top-T_sel share at N <= 2^24 nor 0.42 at 2^30 (S4)"; and for the
      mechanism clause S5 (gain strictly decreasing over r in {2, 4, 8},
      gain(8) <= 0.03) and S6 (UPPER minus LOWER below 0.05).
      EXP-ECDLP-869870 (H-ECDLP-3550b8, executor TASK-20260906-d17254): "the
      basin law (survival slope, cutoff), the unselected law (B1), the
      oracle ceiling (B2) and the published-rule constants measured at N in
      {2^20, 2^22, 2^24, 2^30} match the pre-registered closed forms within
      the stated bands (M1-M5) and are N-independent after the O(theta)
      trend (V5); the relabelling null equals the unselected control and
      the sigma decay is monotone (V2); no exact coverage exceeds the
      global oracle share and every sampled coverage is inside its Wilson
      interval (V3); and the Bernstein-Lange 1.79 case-study / Table 4.1
      seven-cell fixture reproduces within 0.10 in scaled cost and 12% in
      scaled precomputation at N = 2^24 (V1)". The first execution batch
      covers Stage G and Stages 1-2 of 612fb1 and Stages 1-2 of 869870;
      the curve arms and 869870's 2^30 stage may be reported NOT YET RUN,
      in which case the claim under review is the generic-instrument prefix
      actually executed and every reviewer says so.
    coordinator_prior: >-
      Recorded before any run exists. The only prior data are the
      coordinator's own scratch simulator (internal, unverified, two seeds,
      no null, no decay, no certificate; cited in IDEA-20260906-ee3543 and
      H-ECDLP-37dc01 as never evidence): at N = 2^30, T = 1024, a = 1/4,
      r = 2, k = 4 it showed the T/2 re-selected table matching the static
      T table's per-target success from about round 4-5 of 2000 targets,
      i.e. about 8T targets (0.68-0.71 versus 0.68-0.73), the full-T
      re-selected table at 0.83-0.85 versus static 0.67-0.73, UPPER within
      0.01-0.02 of LOWER, and (IDEA-20260906-aed829) a top-T basin share of
      about 0.637 at N = 2^21, a = 1 against the model 0.66. From that
      record the Coordinator's prior is: S1-S4 pass at both 2^24 and 2^30
      with rho_T(8T) near the model 0.51 (inside [0.45, 0.65]) and the
      exact top-T share at 2^20, a = 1/4 inside G1's band around the model
      0.39 (roughly 0.33-0.41, theta = 1/64 being large); the 1.79 fixture
      reproduces within 0.10 at 2^24 under the 8W cap and the paper's
      distinct-DP procedure, with about 0.3 probability that at least one
      of 869870's seven cells -- most likely an N/T = 1 cell, where the
      paper itself notes the duplicate-discard bias -- misses 0.10 at 2^24
      by an O(theta) residual, which would be an instrument-comparability
      failure (invalid, not negative) needing an amendment rather than a
      finding about the mechanism; the most likely GENUINE failure is a
      bookkeeping one -- unequal charging of P or of bits per entry between
      arms, restart multiplications counted in one arm and not another, or
      the LOWER bracket admitting a walk of an unsolved target or a walk
      never run -- and the Coordinator expects J1 to be where a break, if
      any, appears. The Coordinator does NOT expect NULL-A to show a gain
      (it may sit slightly BELOW static, since uniformly relabelled evidence
      is noise added to the weights; only a gain above zero is the artifact
      signature), expects NULL-B and PHI(0) bit-identity to hold if one code
      path is used, expects J2's blind numbers to agree with the executor's
      at the seed-spread level and not per seed, expects J3 to find that
      the UNCAPPED pool's S_peak (of order U k p_s entries, about 20T after
      8T targets) is the weakest point of the "fewer stored DPs" framing so
      that CAP(2T)/CAP(4T) are the only frontier-honest cells, and expects
      the proves-too-much objects to behave (permutation walk: G1 fails and
      S3 fails; a = 1/2 differential holds; NULL-A at zero). A review that
      overturns any of these is the more informative result and is wanted.
    joints:
    - joint: J1
      statement: >-
        Run-receipt validity and control integrity of both packages:
        schema-complete manifests, expected run counts, seed and
        replication integrity, gates G1/G2 and the fixture gate reported
        before other arms, certificate re-verification on any curve arm,
        the null implementations actually destroying the signal (read the
        code: NULL-A relabels evidence among existing pool entries, NULL-B
        freezes the table, the 869870 relabelling null permutes the
        statistic), the LOWER bracket admitting exactly the run walks of
        solved targets, and counted-operation accounting identical across
        arms (P, bits per entry, S_peak, restart scalar multiplications,
        lookups, re-selection integer operations).
      assigned_to: TASK-20260906-7ec3ea
      attack_plan: >-
        Recompute rather than read: re-add basin sizes from raw-result.json
        for one cell per N and compare to the reported exact coverage and
        to the top-T_sel share; diff the round-0 table composition hashes
        of every re-selected arm against its STATIC twin and NULL-B / PHI(0)
        against STATIC at every round; grep the source for any branch on
        the arm name that reaches the walk, the DP predicate or the
        restart draw (a leak); count the walks admitted to the LOWER pool
        per solved target in raw-result.json and confirm none belongs to an
        unsolved target and none was never run; tabulate P, bits, S_peak
        and restart counts per arm from the raw records and confirm they
        are computed by one function; re-verify every certificate with
        your own scalar multiplication; reconcile seeds against the
        seed_policy offsets (100 + s, 200 + s, 300 + s, 400 + s; 500 + s on
        869870). The Coordinator thinks this breaks, if anywhere, in the
        LOWER-bracket admission rule and in the charging of restart
        multiplications and pool bits.
      breaking_artifact: >-
        A located defect (path, line, cell, number): a re-selected arm
        whose round 0 differs from its STATIC twin; a NULL-B or PHI(0)
        table hash differing from STATIC; a pool entry from an unsolved or
        un-run walk; an arm charged differently for P, bits, S_peak or
        restarts; a certificate that fails independent re-verification; a
        manifest missing a required field; a raw/summary disagreement; or
        an exact coverage above the exact top-T_sel share. Any one of
        these makes the affected run set INVALID (not negative) under the
        contracts' invalidation rules.
    - joint: J2
      statement: >-
        BLIND RE-DERIVATION of the two load-bearing quantities from their
        statements alone: (a) the exact global oracle top-T basin share at
        N = 2^20, a = 1/4 (T = 64, W = 64, cap 8W) by independent
        enumeration of the functional graph of a keyed random function of
        the contract's class; (b) the Bernstein-Lange scaled
        main-computation cost fixture (published 1.79 (l/T)^{1/2} at
        alpha = 1/2, N/T = 2, cap 8W; paper parameters T = 64, W = 2^20)
        by an independent simulation of the paper's procedure at the
        contract cells N = 2^24 (T = 256, W = 128) and N = 2^20, plus the
        scaled precomputation P / sqrt(NT) beside 1.24.
      assigned_to: TASK-20260906-7ec3ea
      attack_plan: >-
        Implement both from the definitions in this handoff with your own
        mixer, your own DP hash key and your own keys, seal the numbers,
        then compare to the executor's per-seed values as two samples from
        one law (report means, spreads, a two-sample statistic) and to the
        model 0.39 and the published 1.79 / 1.24. Vary what the contract
        leaves open (mixer choice, tie-breaking, how a capped walk is
        charged, whether in-degree-0 DPs are counted in the global oracle)
        and report the sensitivity of each quantity to each choice: the
        Coordinator thinks the fixture is sensitive to the distinct-DP
        procedure and the cap charging (a pool that discards duplicate
        walks without charging them reads low in P and low in cost), and
        the top-T share is sensitive to whether capped mass is excluded.
      breaking_artifact: >-
        A sealed value that disagrees with the executor's beyond the
        combined seed spread (the two implementations differ and one is
        wrong), or a sealed fixture outside the contract tolerance of the
        published 1.79 while the executor's is inside (or the reverse),
        with the sensitivity table localising the choice responsible.
    - joint: J3
      statement: >-
        Interpretation and cost model of the 612fb1 claim: whether "fewer
        stored DPs" is charged honestly on RQ-ECDLP-78dbc5's (P, S, L,
        epsilon, U) frontier including the pool's S_peak and the
        early-batch penalty; whether the LOWER bracket really excludes
        unknown-log entries on the curve arm and what "solved" means on the
        generic arm; whether steady-state success at U = 8T is the right
        decision quantity against the cumulative break-even U*; and
        whether the same gain would appear for a static table of the same
        total precomputation, i.e. whether the gain is extra precomputation
        in disguise.
      assigned_to: TASK-20260906-90e7cf
      attack_plan: >-
        From the raw per-round records compute r_eff = r + U k p_s / T at
        U = 8T and price the evidence the batch supplied as the static
        precomputation that would buy it (P at that r under (B4) and from
        the RSWEEP arms); compare RESEL-L(T/2)'s gain with STATIC(r = 4, 8)
        and STATIC2T from the same records and state which static table
        the re-selected T/2 table is actually equivalent to and at what P;
        tabulate S_peak of the UNCAPPED arm in entries and bits beside the
        T/2 advice and beside CAP(4T) / CAP(2T), and state the only cells
        on which "fewer stored DPs" survives when working storage counts as
        stored DPs at the online site; recompute eps_cum and U* from the
        cumulative solved counts and state whether the claim's "by U = 8T"
        is steady-state or cumulative; audit that no generic-arm number is
        quoted as a solved logarithm and that every curve-arm pool entry's
        log is derived from a certified k_u. The Coordinator thinks the
        weakest point is S_peak of the uncapped arm and that the honest
        headline cell is CAP(2T).
      breaking_artifact: >-
        A worked cost table showing the T/2 claim does not survive on the
        frontier the RQ defines (working storage or cumulative break-even
        charged), a static table of equal total operations that reaches
        the same success, or an unknown-log entry admitted to the table --
        each with the cells and numbers it is read from.
    - joint: J4
      statement: >-
        PROVES-TOO-MUCH control on the argument: objects on which the
        conclusion is KNOWN FALSE, run through the executor's own pipeline
        (snapshot-committed code, arm selection by configuration, nothing
        else changed): (i) a random PERMUTATION walk on [0, N); (ii) the
        a = 1/2 differential cell; (iii) NULL-A relabelled evidence.
      assigned_to: TASK-20260906-90e7cf
      attack_plan: >-
        (i) Replace the walk by a keyed bijection of [0, 2^20) (a
        permutation has no trees: every basin is the arc back to the
        previous DP on its cycle, of mean size W, with no heavy tail), keep
        T = 64, W = 64, cap 8W, run G1, STATIC(T), RESEL-L(T/2), NULL-A,
        RHO and PHI at U = 8T with 3 seeds. (ii) Take the executor's own
        a = 1/2 cells at N = 2^24: first verify from the exact basins that
        STATIC(T)'s exact coverage exceeds the exact global top-(T/2) share
        at the a = 1/2 walk length (that inequality is what makes the
        conclusion false by disjointness: no T/2 table can cover more than
        the top-T/2 share), then read whether the pipeline ever reports
        RESEL-L(T/2) within CI of STATIC(T) there. (iii) Read NULL-A's gain
        at every round for T_sel in {T, T/2} and check whether the S1-S4
        acceptance logic, applied to NULL-A in place of RESEL-L, would pass.
        Also check whether S1's "within CI" test has a non-vacuity guard:
        on an object where every arm's success is near the RHO floor, S1
        is satisfied trivially.
      breaking_artifact: >-
        A pipeline output that reports the effect where it is known
        false: on (i) the oracle top-T share not collapsing to order
        (T W / N) log(N/W) (a few percent at 2^20), or S1 reported as met
        while STATIC(T) is within CI of the RHO floor, or S3 reported met,
        or G1 reported passed; on (ii) RESEL-L(T/2) reported within CI of
        STATIC(T) at a = 1/2 while STATIC(T)'s exact coverage exceeds the
        exact top-T/2 share; on (iii) NULL-A's gain CI-separated above zero
        or S1-S4 passing on NULL-A. Any of these means the acceptance
        argument proves too much and the affected criterion is not
        evidence for anything until repaired by amendment.
