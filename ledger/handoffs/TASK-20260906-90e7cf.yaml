  recorded_at: '2026-09-06'
  goal_id: GOAL-ECDLP-bbc21f
  question_id: RQ-ECDLP-78dbc5
  batch_id: BATCH-289698
  dispatch_queue: coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-289698/dispatch_queue.json
  task_card: coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-289698/tasks/TASK-20260906-90e7cf/task_card.yaml
  role: red-team
  from: coordinator
  to: red-team
  review_required: false
  id_note: >-
    Identifier pre-minted and --check'ed by the orchestrating session and
    reserved in DEC-20260906-2b1387 and both approved contracts' approval
    notes; the coordinator minted nothing and grepped for nothing.
  objective: >-
    Own joints J3 and J4 of the review plan below, in a FRESH INDEPENDENT
    SESSION, on the snapshot-committed execution packages of
    EXP-ECDLP-612fb1 (TASK-20260906-3623b9) and EXP-ECDLP-869870
    (TASK-20260906-d17254). J3: attack the interpretation and cost model
    -- is "fewer stored distinguished points" charged on RQ-ECDLP-78dbc5's
    (P, S, L, epsilon, U) frontier with the pool's S_peak and the
    early-batch penalty counted; does the LOWER bracket really exclude
    unknown-log entries; is steady-state success at U = 8T the right
    quantity against the cumulative break-even; would a static table of
    the same total operations show the same gain (is the gain extra
    precomputation in disguise). J4: the PROVES-TOO-MUCH control -- run
    the executor's own snapshot-committed pipeline, unchanged except for
    the object under it, on three objects where the conclusion is KNOWN
    FALSE (a random permutation walk; the a = 1/2 differential cell;
    NULL-A relabelled evidence) and show the failure signature each must
    produce. Report per joint HOLDS | HOLDS_WITH_FINDINGS | BROKEN with
    findings, objections and the next control; you write objections and
    falsification routes, you do not rule on the hypotheses.
  uncertainty_reduced: >-
    Whether the acceptance argument of EXP-ECDLP-612fb1 (S1-S6 and the
    cost model behind rho_T) would ALSO go through where its conclusion
    is false -- the artifactual-proof failure that a passing validation
    cannot see -- and whether the claim's headline quantity survives
    honest charging of working storage, the early batch and the
    precomputation it implicitly borrows.
  inputs:
  - >-
    experiments/EXP-ECDLP-612fb1/specification.yaml and
    experiments/EXP-ECDLP-869870/specification.yaml (the frozen approved
    contracts: definitions, arms, controls, success and falsification
    criteria, cost_model, interpretation)
  - ledger/questions/RQ-ECDLP-78dbc5.yaml (the decision target and its definition of fewer_DP on the (P, S, L, epsilon, U) frontier)
  - ledger/hypotheses/H-ECDLP-37dc01.yaml and ledger/hypotheses/H-ECDLP-3550b8.yaml (claims (C1)-(C6); interpretation_limits)
  - ledger/proposals/IDEA-20260906-ee3543.yaml and ledger/proposals/IDEA-20260906-aed829.yaml (the idea records; dominated_by and sota_delta; model numbers cited as MODEL only)
  - ledger/handoffs/TASK-20260906-3623b9.yaml and ledger/handoffs/TASK-20260906-d17254.yaml (the executor handoffs)
  - >-
    coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-289698/archives/TASK-20260906-7a2446/snapshot-receipt.json
    (the snapshot commit binding the packages you attack)
  - >-
    experiments/EXP-ECDLP-612fb1/source, experiments/EXP-ECDLP-612fb1/runs,
    experiments/EXP-ECDLP-869870/source, experiments/EXP-ECDLP-869870/runs,
    and the executor task directories coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-289698/tasks/TASK-20260906-3623b9
    and .../TASK-20260906-d17254 (execution_report.yaml,
    artifact_inventory.json) -- the packages under attack; you are NOT a
    blind re-deriver and may read all of them
  - >-
    Primary sources, fetched by you if needed and recorded with URL and
    retrieval date: Bernstein-Lange, IACR eprint 2012/458; Corrigan-Gibbs-
    Kogan, IACR eprint 2017/1113 (the multi-instance line S T^2/M + T^2 =
    O(MN) the record claims to sit above).
  constraints:
  - >-
    INDEPENDENT FRESH SESSION (independent_session_required true). You
    authored none of this batch's deliverables and did not run either
    executor task. Record honestly whether this supplies MODEL independence
    as well as SESSION independence (state the resolved model identifier
    that answered and whether it equals the executor's).
  - >-
    BLIND to coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-289698/tasks/TASK-20260906-7ec3ea
    (the validator directory): never list, open or read it; no report of
    J1 or J2 exists to you. Report only on J3 and J4; a whole-claim
    verdict from you is an opinion formed from a fraction of the evidence
    and is not requested.
  - >-
    J3 CHECKS, each with a worked number from the raw records: (i)
    FRONTIER CHARGING -- tabulate per cell, for STATIC(T), STATIC(T/2),
    RESEL-L(T/2), RESEL-L(T), CAP(4T), CAP(2T) and STATIC2T: P (counted),
    S (advice bits), S_peak (working-storage bits and entries), L (walk
    steps per target and per success; restart multiplications beside it),
    eps_ss, eps_cum, U; state on which cells "fewer stored DPs" survives
    when S_peak counts as DPs stored at the online site, and whether the
    contract's own interpretation clause (CAPPED arms are the
    frontier-honest points) is respected by the executor's headline
    numbers; (ii) BORROWED PRECOMPUTATION -- compute r_eff = r + U k p_s / T
    at U in {4T, 8T, 16T} from the recorded solve rates, price that
    evidence as static precomputation under (B4) and from the RSWEEP arms
    (r = 4, 8), and state which static table at what P the re-selected T/2
    table is equivalent to; the batch's walks are charged to L already, so
    the question is whether the record's "equal P" framing hides that the
    comparison is against a static table starved of evidence rather than
    against the best static table of equal total operations; (iii) LOWER
    BRACKET -- on the curve arm (if run) verify from raw-result.json that
    every pool entry's log is derived from a certified k_u of a solved
    target and that no entry with an unknown log ever appears in a table
    hash; on the generic arm state what "solved" means (a hit, with no log
    anywhere) and whether the generic LOWER bracket is the same set of
    admitted walks as the curve arm's would be; (iv) STEADY-STATE VERSUS
    CUMULATIVE -- recompute eps_cum(U), the early-batch penalty over the
    first 10% and U* from the cumulative solved counts, and state whether
    the claim "reaches static T by U = 8T" is a steady-state (last two
    rounds) statement, a cumulative statement, or both, and which the RQ's
    decision target actually asks for; (v) SENTENCE ENUMERATION -- for
    each outcome the ledger archive may face (S1-S6 met; S1-S4 met, S5-S6
    not; F1; F2-F4 invalid; gate failure; NOT YET RUN prefix) write the
    exact sentence it licenses at claim_tier toy on the tested grid and
    the sentence it does NOT (no exponent, no cryptographic N, no curve
    statement without control (m), no "fewer DPs" without S_peak beside
    it).
  - >-
    J4 PROTOCOL: use the executor's snapshot-committed code at the commit
    named in the snapshot receipt, copied into your task directory and
    modified ONLY where the object requires (the walk function for (i);
    nothing for (ii) and (iii), which are read from the executor's own
    cells); record the diff. (i) PERMUTATION: a keyed bijection of
    [0, 2^20) (e.g. x -> (odd_multiplier * x + c) mod 2^20 composed with
    an xor-shift, key-seeded; verify bijectivity by counting), T = 64,
    W = 64, cap 8W, a = 1/4; run G1 (exact basins), STATIC(T),
    STATIC(T/2), RESEL-L(T/2), RESEL-L(T), NULL-A(T/2), RHO and PHI at
    T_sel = T/2, U = 8T, 3 seeds; report the exact top-T share, the G1
    verdict, every arm's eps_ss with CI, the S1 and S3 verdicts the
    pipeline's own analysis emits, and whether S1 was satisfied vacuously
    (STATIC(T) within CI of RHO). (ii) a = 1/2 DIFFERENTIAL: from the
    executor's exact basins at N = 2^24, a = 1/2, first check the
    inequality that makes the conclusion false by disjointness --
    STATIC(T)'s exact coverage > the exact global top-(T/2) share at that
    walk length -- per seed; then report whether RESEL-L(T/2) is
    CI-separated below STATIC(T) at every U and whether its hit rate ever
    exceeds the exact top-T/2 share; repeat at 2^30 against the sampled
    numbers with the model 0.42 versus C_max(1/4) = 0.39 labelled MODEL.
    (iii) NULL-A: from the executor's cells, apply the S1-S4 acceptance
    logic with NULL-A(T/2) in the role of RESEL-L(T/2) and report whether
    it passes; report NULL-A's gain per round with CI and note that a
    value slightly BELOW static is a degraded null (noise in the weights),
    not an artifact -- only a gain above zero is.
  - >-
    NO REPAIR AUTHORITY: a hole found is the valuable outcome; report it
    with a concrete successor control or amendment, never fix the
    executor's code or re-score a run. Finding no defect is not a
    certification that none exists.
  - >-
    COMPUTE: budget maximum_runs 0 means zero EXPERIMENT runs under either
    contract; the proves-too-much executions are review controls executed
    inside your task directory (src/, logs/, results/ with exact commands,
    stdout/stderr and resource measurements), within 3600 s wall clock
    and 4 GB; a permutation-walk cell at 2^20 is seconds to minutes. You
    write nothing outside
    coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-289698/tasks/TASK-20260906-90e7cf
    and make no commit; you change no record anywhere.
  - >-
    INFERENCE PROVENANCE in the report: requested_policy review-adversarial;
    requested reasoning_effort xhigh (a floor, never lowered); backend;
    resolved model identifier exactly as answered; model_verified;
    fallback_used with reason if the resolved binding differs from the
    policy's primary (fallback is RECORDED, never silent; degraded_allowed
    false); independent_session true.
  - >-
    Pareto honesty per docs/inventor-protocol.md: every objection names
    the comparator it is measured against (STATIC at r in {2, 4, 8},
    STATIC2T, RHO, IDEA-20260906-a3d6ae's growth-with-relations line, the
    CGK multi-instance line) and the axis on which the record is or is
    not dominated.
  - >-
    NETWORK: permitted only to fetch the two named primary texts, with
    URL and retrieval date recorded; nothing else.
  deliverables:
  - >-
    coordination/goals/GOAL-ECDLP-bbc21f/batches/BATCH-289698/tasks/TASK-20260906-90e7cf/red_team_report.yaml
    -- strict YAML with: per-joint verdicts J3 and J4 in {HOLDS,
    HOLDS_WITH_FINDINGS, BROKEN} with findings (each: id, joint, severity
