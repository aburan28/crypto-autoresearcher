    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 3600
    memory_gb: 4
    maximum_runs: 0
    maximum_runs_note: >-
      Zero EXPERIMENT runs under either contract. The proves-too-much
      controls execute the snapshot-committed pipeline on known-false
      objects inside the red team's task directory within the wall-clock
      and memory ceilings above; that is review work, not an experiment
