    applied to the pipeline; inference provenance; and the
    `review_attestation` block of templates/research-records.md with
    task_id TASK-20260906-90e7cf, joints_owned exactly [J3, J4],
    sources_read = every path read, honestly and completely,
    read_sibling_reports false, blind_from_respected null (you are not the
    re-deriver), and verdict in {holds, breaks, inconclusive} for the
    joints owned (holds if J3 and J4 are HOLDS or HOLDS_WITH_FINDINGS;
    breaks if either is BROKEN; inconclusive only if the run sets are too
    incomplete to run a control).
  - >-
    src/, logs/ and results/ under the task directory: the modified
    pipeline copy with its diff against the snapshot commit, exact
