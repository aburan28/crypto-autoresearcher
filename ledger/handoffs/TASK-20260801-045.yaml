handoff:
  id: TASK-20260801-045
  from: coordinator
  to: red-team
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-024
  objective: >-
    Try to falsify the interpretation, the scope and the alternative-class declaration of the
    RUN-DEP-001-measure package. The single most important question you are asked is the one that
    broke BATCH-023 - IS THE POWER THIS EXPERIMENT CERTIFIES POWER AGAINST THE CLASS THE CLAIM IS
    ABOUT, and what class of deviation remains uncertified after it.
  uncertainty_reduced: >-
    What the measurement does NOT establish, and whether any deliverable is about to overclaim in
    either direction.
  inputs:
  - experiments/EXP-DEP-001/specification.yaml
  - experiments/EXP-DEP-001/reading_rule.yaml
  - experiments/EXP-DEP-001/implementation/dep001_driver.py
  - experiments/EXP-DEP-001/runs/RUN-DEP-001-measure/
  - experiments/EXP-DEP-001/results/measure/
  - ledger/evidence/EV-EQD-001.yaml
  - ledger/hypotheses/H-DEP-001.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-023/reviews/TASK-20260801-030/red_team_report.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/reviews/TASK-20260801-040/
  constraints:
  - 'INDEPENDENT SESSION. You did not author or execute any artifact under review.'
  - >-
    AUDIT ALT-CLASS-DEP-1 ADVERSARIALLY AGAINST THE SOURCE AND THE MEASURED DATA. Name any class
    the deliverables are about to claim and the ladders did not reach, and name any class in U1
    through U6 that turns out to be wider or narrower than declared.
  - >-
    AUDIT THE PLANT CONSTRUCTIONS. Look for a residual DESIGN-TRAP-1 - any way in which a
    construction fails to move the joint table at the resolution the statistics see, or moves it
    in a way unrepresentative of the class it names.
  - >-
    AUDIT THE ATTAINABILITY ARGUMENT AND ATS-DEP-1 POST HOC, including whether the DEP-CAL-D
    anchor's pre-disclosure was in fact benign.
  - >-
    READ THE RESULT IN BOTH DIRECTIONS. If the branch is D-2, attack the upward amendment of
    EV-EQD-001 - what does the measured rho_det actually license and what does it not. If the
    branch is D-3, attack the downward amendment equally hard - a downward amendment is also a
    claim, `weaken` needs its counterexample certificate checked, and calling BATCH-023 vacuous
    would be premature closure under docs/inventor-protocol.md section 4.
  - 'STATE THE NARROWEST SUPPORTED STATEMENT, dominated_by (NEVER null) and a QUANTITATIVE sota_delta.'
  - Name the next required control and rank it.
  - >-
    Rule explicitly on whether the HEUR-DS-1 line was blurred anywhere, on whether the limb
    discipline held, and on whether anything in the package is presented as a replication of
    EV-EQD-001, which it is not.
  - >-
    Rule on whether duplicate_decomposition.json actually discharges promotion route (a) of
    KN-CAND-BATCH023-A, and say so either way. Recommend, do not decide - promotion is the
    Coordinator's.
  - 'Recommend a disposition. You do not set status.'
  - 'MAKE NO COMMIT; TASK-20260801-046 archives this report.'
  - 'Record inference honestly (requested review-adversarial, independent session).'
  deliverables:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/reviews/TASK-20260801-045/red_team_report.yaml
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/reviews/TASK-20260801-045/red_team_report.yaml
  archived_by: TASK-20260801-046
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 7200
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
  - >-
    Blocking constraints listed; an adversarial verdict on ALT-CLASS-DEP-1 against source and
    data; a post-hoc audit of attainability and ATS-DEP-1; the result attacked in whichever
    direction it points; the narrowest supported statement, dominated_by and a quantitative
    sota_delta; the next required control named and ranked; explicit verdicts on the HEUR-DS-1
    line, the limb discipline, the replication question and the KN-CAND-BATCH023-A route; a
    recommended disposition.
