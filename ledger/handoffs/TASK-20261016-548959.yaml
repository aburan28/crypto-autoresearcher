    - >-
      SA-9 binding_mode commit. The commit changes exactly the five declared
      paths. Run tools/validate_ledger.py before committing, and stop on any
      new error attributable to the staged paths.
    - >-
      SA-10 The commit message names TASK-20261016-548959, TASK-20261016-9c1bc5,
      REVIEW-MONO-20261016-9c1bc5, BATCH-450ac7, GOAL-MONO-001 and
      DEC-20261016-5bdc04. It states no verdict and quotes no review content.
      The same holds for the PR text.
    - >-
      SA-11 Verify the receipt with tools/research_dispatch.py. Push, and open
      or refresh the PR. Never amend, rebase or force-push.
