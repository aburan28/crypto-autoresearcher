handoff:
  id: TASK-20260824-7175d9
  from: coordinator
  to: coordinator
  goal_id: GOAL-DIFFP-84d641
  batch_id: BATCH-efcae7
  question_id: RQ-DIFFP-a5c483
  objective: >-
    Snapshot-archive the exact BATCH-efcae7 package -- the opening control plane
    (batch record, dispatch queue, five task cards, five handoffs, the frozen
    contract EXP-DIFFP-4b165f) and the producer's control-power measurement package
    (the new module, the new test file, the four result artifacts, run-index.json
    and the execution report) -- under a content_first binding, with pre-freeze
    checks, BEFORE the independent review runs. Then push the branch and refresh the
    PR against main WITH NO FINDINGS IN ANY COMMIT OR PR BODY.
  uncertainty_reduced: >-
    Whether the artifacts the reviewer will attack are the exact bytes the producer
    wrote, fixed and reachable, rather than a working tree that can still move under
    them -- and whether the frozen instrument the producer measured is byte-identical
    to the one BATCH-f8bf86's review attacked.
  inputs:
    - Terminal receipts and artifacts of TASK-20260824-b7efbf and TASK-20260824-9a489e.
    - >-
      The producer's repro-and-frozen-result.json, for the independent CTL-FROZEN
      cross-check against the tree.
    - >-
      The producer's run-index.json, for the run-file binding check that content-binds
      the run directories without declaring them as artifact_paths.
    - origin/main as of this pass, for the pre-archive merge.
    - tools/validate_ledger.py and tools/research_dispatch.py.
  constraints:
    - RUNS ALONE. No other task may be running concurrently, and the review may not start before this commit exists and is verified.
    - >-
      STAGE ONLY THE DECLARED PATHS. A scope-expanding commit is an evidence-integrity
      failure, not a convenience.
    - >-
      MERGE origin/main, NEVER REBASE. Record the base commit checked and the merge
      outcome in the receipt. A sync conflict inside an immutable record is resolved
      by a new superseding record under a new id, never by picking a side.
    - >-
      SUBJECT-LINE-ONLY COMMIT MESSAGES FROM THIS POINT UNTIL THE ROUND CLOSES. No
      findings, verdicts, mechanisms or integers in any commit body, PR description,
      bus message or branch name while the review round is open, and the same applies
      to anything a concurrent agent could read. This is the adopted mitigation for
      DEC-20260824-af6d5c PD-1, in which the driving session leaked validator findings
      to the red team through a commit message body in a shared worktree.
    - >-
      DO NOT INTERPRET ANY PRODUCER RESULT and record no research verdict. This task
      archives; it does not review. In particular it does not adjudicate whether the
      per-component power table means the instrument discriminates.
    - >-
      RECORD ONLY CHECKS THIS SESSION ACTUALLY RAN, with their verbatim output. Never
      record a command that was not executed.
    - Do not read coordination/goals/GOAL-MD5-001/quarantine/** and attest non-reading.
    - >-
      Any scalar this receipt binds is either MEASURED by this session or quoted WITH
      ITS PROVENANCE AND MARKED UNVERIFIED. PD-3 and CORR-20260824-cc2d27 record the
      concrete cost of the alternative: a defective producer integer propagated two
      hops into Coordinator artifacts and reached a reviewer's instructions.
    - >-
      If the opening coordinator_decision for EXP-DIFFP-4b165f was still not minted
      and filed when the producer ran, say so in the receipt and do not proceed to
      dispatch the review: an unapproved contract cannot carry a claim-changing review
      round.
  deliverables:
    - >-
      snapshot-receipt.json -- content_first, with path_sha256 over the declared
      snapshot set, the commit sha and parent, the merge base and outcome, the
      tools/validate_ledger.py and tools/research_dispatch.py outputs verbatim, the
      independent CTL-FROZEN cross-check of every harness/diffpath module digest
      against the tree, the run-index binding check, and the
      staged_not_in_binding_set disclosures (the goal head, every producer run
      directory, and any harness/diffpath sibling module beyond the bound
      controlpower.py).
    - >-
      A pushed branch and a refreshed PR (#530 on branch
      claude/differential-cryptanalysis-harness-5b5fdq) naming BATCH-efcae7,
      EXP-DIFFP-4b165f, GOAL-DIFFP-84d641, the minted opening decision id and every
      TASK-20260824-* record of this batch -- with no findings in the PR body while
      the round is open.
    - >-
      THE MEASURED COMMIT SHA and merge base, recorded in the receipt for the ledger
      close to write into the goal head. The goal head currently carries
      2dc4d1328e7804ab2494fec8d45f9c16aba53ff3, the value the driving session measured
      at the BATCH-f8bf86 close; this task is the first of this batch that can measure
      one from git rather than restate one it was told.
  artifact_paths:
