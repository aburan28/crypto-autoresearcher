handoff:
  id: TASK-20260731-705
  from: coordinator
  to: validator
  objective: >-
    Independently verify the committed BATCH-002 producer package as THREE
    SEPARATE and SEPARATELY REPORTED checks, whose verdicts are kept physically
    separate in three distinct files and are never merged, averaged, or carried
    across: (a) the standalone derivation note and its verification script,
    together with the super-box ideation package (TASK-20260731-701);
    (b) the harness repair closing defects H-1 and H-3 (TASK-20260731-702);
    (c) the GATE-601-B run package and its null control (TASK-20260731-703).
  uncertainty_reduced: >-
    Whether the derivation note stands on its own as a checkable artifact fit to
    be promoted to knowledge; whether the two harness repairs actually close the
    failure paths they claim to close rather than narrowing them again; and
    whether the GATE-601-B measurements mean what the run record says they mean,
    in particular whether the null control genuinely discriminates and whether
    any struck literature comparison has crept back in.
  inputs:
    - The verified TASK-20260731-704 snapshot receipt
    - >-
      The committed TASK-20260731-701 artifacts
      (derivation_note_column_local_obstructions.md, verify_derivation.py,
      candidate_report.yaml)
    - >-
      The committed TASK-20260731-702 artifacts (mutation_control_v2.py,
      repair_receipt.json, repair_report.md)
    - >-
      The committed TASK-20260731-703 artifacts (gate_601b_impl.c,
      gate_601b_results.json, run_record.md)
    - >-
      DEC-20260731-011 and EV-AES-001 — the binding BATCH-001 checkpoint,
      including the struck CAND-601-B claims and the tracked defects H-1, H-2,
      H-3, H-4 and I-1..I-6
    - >-
      The BATCH-001 committed artifacts at snapshot
      0185c0ff2d3878101d8f6cf5bdef48906ffb197b, read-only, for supersession
      checking
    - GOAL-AES-001 and RQ-AES-001 scope, claim-tier ceiling, and network policy
  constraints:
    - >-
      Read only COMMITTED artifacts. The TASK-20260731-704 snapshot receipt must
      verify against Git — reachable from HEAD, expected parent, exactly the
      declared paths, matching hashes — before any finding is recorded. If it
      does not, STOP and report an evidence-integrity failure.
    - >-
      THREE SEPARATE VERDICTS, PHYSICALLY SEPARATE. Check (a) goes in
      derivation_and_ideation_review.md, check (b) in harness_repair_review.md,
      check (c) in gate_601b_review.md. validation_report.yaml carries the three
      verdicts side by side without combining them. A sound derivation note does
      not validate the gate run; a failed gate does not invalidate the repair.
      Issue NO combined verdict.
    - >-
      CHECK (a) DERIVATION NOTE — the highest-stakes item in this batch, because
      it is the artifact proposed for promotion to KN-FIND-028. Verify it is
      genuinely SELF-CONTAINED: read it as if the BATCH-001 validation report did
      not exist and state whether the argument closes without it. RE-EXECUTE
      verify_derivation.py from the committed source and report, per numerical
      claim, whether it reproduced. INDEPENDENTLY RECOMPUTE both facts by your
      own method rather than only running the producer's script: the order of the
      MixColumns matrix in GL(4,GF(2^8)), the orbit of e1 under <M>, the orbit
      count bound on nonzero vectors, Inv(lambda*v) = lambda^-1 * Inv(v)
      including at zero coordinates, and the failure of collinearity under L.
      State whether the note's scope statements are honest — in particular that
      it asserts nothing about AES at any round count and is not a barrier
      statement about AES security — and whether its proof_status label matches
      what it establishes.
    - >-
      CHECK (a) IDEATION. Confirm every candidate names a concrete tracked object
      on a named byte set at a named round count; confirm it is genuinely
      cross-column / super-box-level with ShiftRows OUTSIDE the object rather
      than a relabelled column-local object; confirm the lossy-projection test
      outcome, the survival depth, the end-to-end cost boundary (data, time,
      memory, precomputation, verification), dominated_by and sota_delta;
      independently attempt to identify each candidate as an instance of a known
      attack family and NAME any candidate you judge to be a rediscovery
      presented as novel. Apply the I-3 lesson hard: for each gate, judge whether
      its positive control can actually DISCRIMINATE against its own null object,
      or whether it fires on a byte-activity pattern. If the session returned
      NO_ADMISSIBLE_NEXT_MECHANISM, judge it against the
      docs/inventor-protocol.md section 4 closure standard and say plainly
      whether it is a closure or a fatigue report.
    - >-
      CHECK (b) HARNESS REPAIR. Do not accept the repair on the strength of the
      repair report. RE-INJECT both H-1 failure shapes yourself — an import-time
      AssertionError unrelated to the fault, and an import-time
      non-AssertionError — and confirm the repaired control scores both as
      detected: false with a non-passing verdict. Then probe for a THIRD escape
      the producer did not consider and report what you find. For H-3, confirm
      each new reduced-round mutant is actually detected by a comparison
      performed at r < Nr and NOT merely at full rounds, and confirm the
      semantics-preserving no-op mutant is scored detected: false so the green
      discriminates. State explicitly whether the named comparison target for
      reduced-round mutants establishes SENSITIVITY only or something stronger,
      and confirm the report does not claim H-4 removed or H-2 closed. Confirm no
      BATCH-001 committed artifact was modified in place.
    - >-
      CHECK (c) GATE-601-B. Verify the correctness-equivalence claim by
      re-running the committed implementation, or by an independent
      reimplementation if budget permits, and confirm the surviving-key sets are
      compared exactly rather than by digest of a partial set. Verify the
      operation-counting convention is genuinely SYMMETRIC across the two
      implementations — an asymmetric counter is the obvious way a counted ratio
      lies. Verify the null control was actually run with a seeded random
      bijection and report both ratios yourself. AUDIT FOR STRUCK CLAIMS: search
      every TASK-20260731-703 artifact for any literature comparison, recalled
      baseline, sota_delta, bit-margin, 8-bit extrapolation, or crossover
      prediction, and report any occurrence as a scope violation of
      DEC-20260731-011. Confirm the run record scopes its measurements to a
      small-scale AES-shaped cipher and asserts nothing about AES.
    - >-
      INFERENCE BLOCKS. Confirm every one of the nine producer artifacts carries
      a filled inference block (policy, requested_policy, resolved model,
      fallback_used, model_verified). Report any gap as a completion-gate defect.
      Record your OWN inference block in validation_report.yaml on the same
      terms, and state plainly that under the 0137a051 amendment your
      independence is in SESSION and not in MODEL.
    - >-
      Every literature comparison you make is itself UNVERIFIED-FROM-MEMORY under
      this network policy and must be marked as such. Do not settle a novelty
      question by asserting a recalled citation as if it had been read. Two
      agreeing recollections are not a citation.
    - >-
      Do not repair, edit, extend, or re-run producer artifacts to make them
      pass. Defects are reported, not fixed. Write only under the assigned task
      directory.
    - >-
      Change no official state. Propose no hypothesis status, create no ledger
      record, promote nothing to knowledge, and assign NO evidence strength —
      those are the Coordinator's transition in TASK-20260731-706.
    - >-
      Distinguish absence of evidence from impossibility, and infrastructure
      failure from mathematical result (AGENTS.md rule 5).
  deliverables:
    - validation_report.yaml
    - derivation_and_ideation_review.md
    - harness_repair_review.md
    - gate_601b_review.md
  artifact_paths:
    - coordination/goals/GOAL-AES-001/batches/BATCH-002/tasks/TASK-20260731-705/validation_report.yaml
    - coordination/goals/GOAL-AES-001/batches/BATCH-002/tasks/TASK-20260731-705/derivation_and_ideation_review.md
    - coordination/goals/GOAL-AES-001/batches/BATCH-002/tasks/TASK-20260731-705/harness_repair_review.md
    - coordination/goals/GOAL-AES-001/batches/BATCH-002/tasks/TASK-20260731-705/gate_601b_review.md
  archived_by: TASK-20260731-706
  inference:
    policy: review-adversarial
    requested_policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
    standing_basis: >-
      inference-amendment commit 0137a051eb5828789eb267fa83c8278086578d4c. The
      session is independent; under this harness the resolved model is NOT
      independent of the producers'. Record that limitation explicitly — it is a
      recorded limitation, not a defect to hide, and it blocks any goal-closure
      attestation.
  budget:
    wall_clock_seconds: 1800
    memory_gb: 4
    maximum_runs: 6
  completion_gate:
    - >-
      The snapshot receipt is confirmed against Git, or the task stops and
      reports an evidence-integrity failure.
    - >-
      Three verdicts are issued in three physically separate files, and
      validation_report.yaml carries them side by side with NO combined verdict.
    - >-
      derivation_and_ideation_review.md states whether the derivation note is
      self-contained, reports the per-claim reproduction of
      verify_derivation.py, reports the validator's OWN independent
      recomputation of both facts, and returns an explicit verdict on whether the
      note is fit for promotion to knowledge as a standalone artifact.
    - >-
      derivation_and_ideation_review.md returns a per-candidate deduplication
      verdict, a survival-depth verdict, and an explicit judgement on whether
      each proposed gate's positive control can discriminate against its own null
      object; and names every candidate judged to be a rediscovery presented as
      novel.
    - >-
      harness_repair_review.md records the validator's OWN re-injection of both
      H-1 failure shapes with their scored outcomes, an attempt at a third
      escape, per-mutant confirmation that H-3 detections occurred at r < Nr, the
      no-op discrimination check, and confirmation that H-2 and H-4 are not
      claimed closed.
    - >-
      gate_601b_review.md returns verdicts on correctness equivalence, on the
      symmetry of the operation-counting convention, and on S-box independence
      with both ratios reported by the validator; and states explicitly whether
      any struck literature comparison, sota_delta, bit-margin or extrapolation
      appears anywhere in the TASK-20260731-703 artifacts.
    - >-
      validation_report.yaml lists every defect found with a severity, confirms
      or denies the presence of an inference block in each of the nine producer
      artifacts, carries the validator's own inference block, asserts no official
      state change, and assigns no evidence strength.
  return_format: >-
    The four artifacts under the assigned task directory, plus a short summary
    giving the three verdicts separately, the promotion-fitness verdict on the
    derivation note, the list of defects with severities, and any struck-claim
    scope violation found.
