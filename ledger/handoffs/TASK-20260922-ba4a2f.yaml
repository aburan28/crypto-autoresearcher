  review_plan:
    claim_under_review: >-
      As the PRODUCER states it: "For binary Koblitz over F_{2^41} at m = 2 with
      l = 20, the median WDSat conflict ratio against 2^{ml}/m! on at least three
      independently certified-UNSAT instances is r_s for a Frobenius-stable
      V = ker f(sigma) and r_r for a size-matched non-stable random V, reported
      per search mode, yielding the verdict <basis_blind | pruning | null_loose |
      inconclusive> per mode under the amended decision rule."
    coordinator_prior: >-
      I expect the RUN to find `basis_blind` on both modes, with `null_loose`
      under XG plus `basis_blind` under default -- a mode disagreement, therefore
      `inconclusive` -- as the second most likely outcome, and `pruning` the
      least likely. I expect the REVIEW to find the measurement sound, WITH J2
      CARRYING MOST OF THE RISK: an independent UNSAT certificate at n = 41 is
      the most expensive requirement in the contract and the likeliest place for
      a shortcut. If it breaks, I expect it to break in the bookkeeping between
      runs/ and RESULTS.json rather than in the algebra. Recorded before any
      report returns and before the measurement exists.
    joints:
      - joint: >-
          J1 -- the stable arm's V is genuinely ker f(sigma) of dimension 20 and
          sigma-closed, and the random arm's V is genuinely NOT stable and is
          size-matched.
        assigned_to: TASK-20260922-ba4a2f
        attack_plan: >-
          Read the basis recorded in each run manifest, not the producer's
          description. Refactor (T^41-1)/(T-1) and confirm f irreducible of
          degree 20; compute dim_F2 V on both arms; apply sigma to every basis
          vector and confirm sigma V = V on stable and sigma V != V on random. I
          think it breaks on the RANDOM arm: a subspace drawn once and reused, or
          drawn inside a stable ambient object, would be near-stable unnoticed
          and would drag r_r toward r_s, making `basis_blind` the default for a
          non-mathematical reason.
        breaking_artifact: >-
          A stable span on the arm labelled random, a dimension other than 20, or
          an f that is reducible or not a factor.
      - joint: >-
          J2 -- every scored row carries an INDEPENDENT UNSAT certificate and no
          row was scored without one (C-CERT).
        assigned_to: TASK-20260922-ba4a2f
        attack_plan: >-
          For every cell contributing to a ratio or verdict, confirm a
          certificate exists on disk; confirm it was produced by something that
          is NOT WDSat, since a certificate from the solver being scored is not
          independent; re-verify at least one end to end yourself; confirm the
          object certified IS the scored instance and not an undeclared
          reduction. I think it breaks on independence or on the certified
          object.
        breaking_artifact: >-
          A scored row without a verifying independent certificate, or a
          certificate whose object is not the scored instance.
      - joint: >-
          J3 -- the null is computed correctly and the amended rule applied as
          written, including the r_r conjunct, the `null_loose` bin and an
          unresolved mode disagreement.
        assigned_to: TASK-20260922-e62294
        attack_plan: >-
          Recompute 2^{ml}/m! per cell; recompute r_s, r_r, r_s/r_r from RAW
          counts; re-apply the amended rule; hunt specifically for a row with
          both arms at or below 0.5 reported as anything but `null_loose`, for a
          resolved mode disagreement, and for a planned cell missing from
          RESULTS.json without a `not_run_reason`.
        breaking_artifact: >-
          A recomputed ratio or bin differing from RESULTS.json, a planned cell
          missing without a reason, or a mode disagreement recorded as resolved.
      - joint: >-
          J4 -- MAX_ID equals the ANF-derived value on every run (C-SIZE), the
          recorded search mode matches the binary, two builds are reported as
          two, and C-REG is within 2x on the number.
        assigned_to: TASK-20260922-ba4a2f
        attack_plan: >-
          Derive MAX_ID from each ANF independently and compare with
          config_used.json; confirm the two-mode rows are the SAME instance
          differing only in mode; confirm the regression bound is met on a real
          archived reference. I think it breaks on the mode label: the
          amendment's whole content is a per-mode comparison, so a label that
          does not match the binary makes both verdicts meaningless while every
          other check passes.
        breaking_artifact: >-
          A MAX_ID disagreeing with its ANF, a "same instance, two modes" pair
          that is not the same instance, or an asserted regression pass with no
          comparable number.
      - joint: J5 -- proves too much; see proves_too_much.
        assigned_to: TASK-20260922-e62294
        attack_plan: See proves_too_much.failure_signature.
        breaking_artifact: >-
          A `pruning` verdict reachable on an arm with no Frobenius structure.
      - joint: J6 -- blind re-derivation; see blind_rederivation.
        assigned_to: TASK-20260922-ba4a2f
        attack_plan: Deliberately not supplied; the point is to start from the statement.
        breaking_artifact: >-
          A re-derived median differing from RESULTS.json, localising the error to
          one of two named implementations.
    blindness:
      mutual: true
      lifted_for: []
      rationale: >-
        Not lifted. Neither reviewer reads the other within this round; a later
        hardening round would be an addendum with its own rationale, never drift.
    proves_too_much:
      objects:
        - >-
          The random-V arm itself, at the same n, m, l, mode and replicate count
          -- an object for which "Frobenius stability causes the reduction" is
          known false by construction.
        - >-
          A variable-order scramble of the stable arm, IF the instruments permit
          it without a protocol change; if not, record it as not performed with
          the reason. An unauthorised extra arm is worse than a missing control.
      failure_signature: >-
        A correct argument must show r_r > 0.5 whenever it reports `pruning`, and
        must not report `pruning` on any object above. If both arms fall at or
        below 0.5 and the result is reported as anything other than `null_loose`,
        the conclusion is a property of the null and the search mode rather than
        of the factor base, and the argument has proved too much. Likewise a
        reduction that survives scrambling the branching order is not coming from
        the algebra.
      assigned_to: TASK-20260922-e62294
    blind_rederivation:
      required: true
      quantity: >-
        The median, over the independently certified-UNSAT replicates of the
        stable arm at the primary cell in one named search mode, of (WDSat
        conflicts on that replicate) / (2^{m l} / m!). Report the median, the
        per-replicate values and the null you used.
      parameters: >-
        n = 41, m = 2, l = 20, arm = stable, mode as named in the extracted input
        file; raw counts and replicate ids from that file and nowhere else.
      blind_from:
        - experiments/EXP-FROB-30006a/implementation/
        - experiments/EXP-FROB-30006a/implementation.md
        - experiments/EXP-FROB-30006a/RESULTS.json
        - experiments/EXP-FROB-30006a/trial-plan.json
        - the executor's return report for TASK-20260922-cd6f21
        - coordination/goals/GOAL-FROB-6333a9/batches/BATCH-5286b0/reviews/TASK-20260922-e62294/
      assigned_to: TASK-20260922-ba4a2f
    procedure_deviations: []

