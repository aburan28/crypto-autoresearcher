handoff:
  id: TASK-20260809-9b78b2
  from: coordinator
  to: idea-generator
  goal_id: GOAL-AES-002
  question_id: RQ-AES-002
  batch_id: BATCH-001
  rank: 2
  parent_decision: DEC-20260809-16c8f4
  task_card: coordination/goals/GOAL-AES-002/batches/BATCH-001/task-cards/TASK-20260809-9b78b2.md
  depends_on:
    - TASK-20260809-7bab1e
  dispatch_precondition: >-
    NOT DISPATCHED until CM-1, protocol-amendment-GOAL-AES-002-001 and the
    adoption record — authored by TASK-20260809-23abf9 — are COMMITTED, PUSHED
    AND VERIFIED by the opening snapshot archive TASK-20260809-7bab1e. THE
    DEPENDENCY IS ON THE ARCHIVE, NOT ON THE AUTHORING TASK: an artifact that
    has been written but not committed, digest-checked and pushed has not
    closed a gate, and a gate uncommitted when the card it gates is issued is
    the retroactive enforcement this program refuses.
  objective: >-
    PERFORM OBJECT-FIRST GENERATION ON FULL-ROUND SINGLE-KEY AES-128/192/256
    (10/12/14 ROUNDS) UNDER docs/inventor-protocol.md SECTION 1, and produce
    the enumeration this goal exists to produce. NAME THE TRACKED OBJECT FIRST,
    then ask what survives it — never the reverse. THE ESTABLISHED FAMILIES ARE
    DECLARED OFF-LIMITS AS THE PRIMARY LENS (RQ-AES-002
    objects_declared_off_limits_as_the_primary_lens): differential and
    truncated differential; linear and multidimensional linear; integral /
    square / division property; impossible differential; meet-in-the-middle and
    Demirci-Selcuk; boomerang and retracing boomerang; biclique; algebraic
    (XSL-family) and Groebner-basis; yoyo; mixture differential /
    exchange-attack; subspace trail; partial sums as a cost reorganisation. A
    candidate arriving in new notation that is a renamed variant of any of
    these is recorded as a REDISCOVERY with the family named, not as a
    candidate. THAT LIST IS RECALLED FROM MEMORY, IS UNVERIFIED, AND IS A
    SCREENING AID AND NEVER AN AUTHORITY: a candidate is NOT established as
    novel by failing to match it, and no novelty claim may be made in either
    direction. APPLY THE LOSSY-PROJECTION TEST TO EVERY CANDIDATE BEFORE ANY
    COMPUTE IS REQUESTED — a projection that discards nothing is a change of
    coordinates, not a new object, and what it discards must be discarded
    compatibly with AES's operations so the retained part still propagates.
    SCORE EVERY SURVIVING CANDIDATE ON THREE AXES: (1) genuinely new versus
    repackaging; (2) concretely testable — can its one-step propagation be
    DEFINED and MEASURED inside the measured resource envelope; (3) how far it
    survives before the structure dissolves, WITH THE FULL ROUND COUNT
    (10/12/14) AS THE SURVIVAL TARGET AND NOT A REDUCED ONE.
  uncertainty_reduced: >-
    Whether the full-round single-key object space contains any admissible
    tracked object at all once the established families are screened out as the
    primary lens and the lossy-projection test is applied — which three batches
    of GOAL-AES-001 ideation did not establish either way for its own narrower
    question, and which nothing under RQ-AES-002 has yet attempted.
  inputs:
    - >-
      docs/inventor-protocol.md sections 1, 2, 3, 4 and 5, and their technique
      abstracts KN-TECH-056 and KN-TECH-080.
    - >-
      RQ-AES-002 in full, in particular claim_tier_ceiling R1-R7,
      objects_declared_off_limits_as_the_primary_lens, the resource-envelope
      constraint and what_the_envelope_forecloses.
    - >-
      The committed CM-1, the committed protocol-amendment-GOAL-AES-002-001 and
      the committed adoption record from TASK-20260809-23abf9.
    - >-
      PRIOR WORK AS INPUT, NOT AS PREMISE, EACH CARRYING ITS ORIGINAL SCOPE
      VERBATIM: EV-AES-001..004, KN-FIND-028 and KN-FIND-029. Proposition 806-1
      may be cited ONLY at ONE super-box interface, for the F-linear
      round-independent subclass, NEVER as a cost inequality, and never with its
      unnumbered state-quantifier dependence U-809-1 dropped. PROP-701-I and
      Proposition 801-1 are WITHHELD and may NOT be cited as established.
      KN-FIND-028's two facts are argument-unavailability results and supply no
      argument. KN-FIND-029's practice rules bind any instrument specified here.
    - >-
      The knowledge-retrieval corpus via the read-only MCP server or the
      `crypto-kb` CLI, queried for prior AES object work before generation
      begins.
  constraints:
    - >-
      SC-1 C2 STAMP DUTY, AND IT BINDS COORDINATOR TASKS EXACTLY AS IT BINDS
      PRODUCERS. As its FIRST act, before any other work, this task writes a
      stamp record in its own task directory carrying start_utc, start_epoch,
      declared_wall_clock_seconds and a binding_stop_utc COMPUTED AT DISPATCH
      TIME as start plus declared; writes a further stamp at EACH major section
      boundary carrying utc, elapsed_s and a marker naming what was completed;
      HALTS at binding_stop_utc, records halted_on_budget truthfully and NAMES
      the work dropped; and COMMITS those stamps as a DECLARED ARTIFACT of the
      task. The TASK-20260801-810 budget block is the reference
      implementation. A halt at binding_stop_utc is INFRASTRUCTURE SIGNAL,
      never a negative mathematical result (AGENTS.md rule 5), and dropped work
      is SCOPE, never an answer.
    - >-
      SC-2 C4 DECLARATION BASIS. The declared budget is calibrated against
      AUTHORING-INCLUSIVE session elapsed, and the COMPUTE component is
      reported SEPARATELY in its own field. Compute seconds are NOT the charged
      clock and may NOT be offered as evidence of budget compliance (C3).
      Discharging SC-1 is FULL COMPLIANCE even if the dispatcher-observed
      figure later exceeds the declaration; any residual is a campaign-side
      accounting fact and is never a producer defect.
    - >-
      SC-3 COVERING MANIFEST AND CLOSED CLASS VOCABULARY, under
      protocol-amendment-GOAL-AES-001-004 Part B as corrected by
      protocol-amendment-GOAL-AES-001-005 Part C, in force from BATCH-001. AT
      LEAST ONE machine-readable manifest of this task, DESIGNATED THE COVERING
      MANIFEST by this card and by the manifest itself, carries an
      `artifact_provenance` list covering EVERY declared artifact of the task,
      and EVERY OTHER MANIFEST OF THE TASK MUST APPEAR AS AN ENTRY IN IT. Entry
      fields: path, kind, sha256, comment_block_inference_stanza (boolean,
      stated honestly including when false),
      covered_by_this_manifest_inference_block (boolean). A self-referential
      digest is impossible and is recorded as SELF. THE `kind` VOCABULARY IS
      CLOSED AND CASE-INSENSITIVE — SOURCE_CODE, MACHINE_READABLE_MANIFEST,
      PROSE_REPORT, LEDGER_AND_COORDINATION_RECORD — matched ignoring
      underscore/hyphen/space differences; NO FIFTH CLASS MAY BE INVENTED, a
      value outside the vocabulary is a DEFECT TO REPORT rather than a class to
      create, and any machine-readable structured-data artifact resolves to
      MACHINE_READABLE_MANIFEST. Every declared SOURCE_CODE artifact
      additionally carries a comment-block inference stanza in its own text.
      THE COVERING MANIFEST OF THIS TASK IS ideation_manifest.json.
    - >-
      SC-4 R5 ANTI-LAUNDERING CLAUSE, QUOTED VERBATIM FROM RQ-AES-002
      claim_tier_ceiling AND BINDING AS A COMPLETION GATE ON EVERY DELIVERABLE
      OF THIS TASK: "R5. THE ANTI-LAUNDERING CLAUSE. Any record, in any
      location, that states a margin MUST in the SAME SENTENCE (i) name the
      reference as exhaustive key search at the stated key size under CM-1, and
      (ii) declare the published-state-of-the-art comparison UNADJUDICABLE in
      this environment. Transcribing a definitional-reference margin as a
      state-of-the-art margin — in a headline, an evidence record, a decision,
      a synthesis, a status line, a cross-reference, a knowledge entry, a PR
      title or a commit message — is a CLAIM-TIER VIOLATION and is handled
      exactly as docs/claims-and-verification.md handles dropping a conditional
      qualifier: as an assertion above what the record supports. OPERATIONALLY,
      under docs/inventor-protocol.md section 5: every ideation and closure
      deliverable under this question sets `dominated_by: "unresolvable in this
      environment: no primary source reachable; every recalled frontier row is
      unverified-from-memory"` and NEVER `null`, because `null` asserts the
      frontier was checked row by row and it cannot be. `sota_delta` records
      the DEFINITIONAL-REFERENCE delta, explicitly labelled as such, plus the
      word `unadjudicable` for the published frontier."
    - >-
      SC-5 EVERY DELIVERABLE STATING A MARGIN CARRIES THE R5 CLAUSE IN THE SAME
      SENTENCE AS THE MARGIN. Not in a footnote, not in an appendix, not in a
      later paragraph, not in a preamble that the sentence itself does not
      repeat.
    - >-
      SC-6 NO RECALLED LITERATURE FIGURE MAY BE CITED AS AUTHORITY, IN EITHER
      DIRECTION. Every literature statement is UNVERIFIED-FROM-MEMORY
      (eprint.iacr.org, csrc.nist.gov and arxiv.org are unreachable under this
      harness's network policy) and must be marked inline at the point of use.
      It may not be used to promote, dismiss, rank, screen or size anything.
      Using a recalled number to DISMISS a candidate is the same fabrication as
      using it to PROMOTE one, and is additionally the premature-closure
      failure mode CLAUDE.md names as symmetric with overclaiming. Two agreeing
      recollections are ONE draw from a correlated pair, not two.
    - >-
      SC-7 NO COMPARISON AGAINST THE PUBLISHED STATE OF THE ART IS ASKED FOR BY
      THIS CARD, AND NONE MAY BE SUPPLIED. The only quantitative reference
      under this question is the DEFINITIONAL exhaustive-key-search reference
      of R1. `dominated_by` is set to the R5 string and NEVER to null.
    - >-
      SC-8 NO REDUCED-ROUND FINDING IS ASSERTED UNDER THIS GOAL. Reduced-round
      work is admissible here only as a validation-ladder instrument for a
      full-round mechanism, carries `toy` tier, and where it yields a result
      ABOUT reduced-round AES it is recorded under RQ-AES-001's ceiling and
      cross-filed there, never asserted here.
    - >-
      SC-9 ANYTHING NOT ATTEMPTED IS NAMED OPEN AND UNATTEMPTED and is NEVER
      recorded as tried, screened or negative (AGENTS.md rules 5 and 8). A
      count of things not reached is not a finding about the problem.
    - >-
      SC-10 CONCURRENCY. max_concurrent is 3 ACROSS BOTH AES GOALS, not 3 each.
      If GOAL-AES-001 BATCH-005 is in flight and dispatching this task would
      exceed the cap, THIS BATCH WAITS: record WAITED_ON_CONCURRENCY_CAP with
      the time waited and dispatch later at full budget, full deliverable set
      and full review chain. Never run degraded. Measured at drafting time on
      the host by the dispatching session: 14 physical cores, 48 GB RAM, load
      averages 40.48 / 43.60 / 40.25 — heavily oversubscribed. That is a
      measurement at drafting time and NOT a forecast of the load at dispatch
      time; re-check the cap immediately before dispatch.
    - >-
      THE LOSSY-PROJECTION SCREEN IS FROZEN BEFORE ANY DEVELOPMENT AND IS ITS
      OWN ARTIFACT. Write lossy_projection_screen.json FIRST, marked as written
      first with a timestamp, carrying for EVERY candidate: its one-line
      statement; the tracked object named explicitly; WHAT IT DISCARDS and
      whether that is discarded compatibly with AES's operations; the verdict
      PASS or CHANGE_OF_COORDINATES; the deduplication verdict against the
      off-limits families with the family named where it matches; and the three
      axis scores. A candidate the screen kills is NOT developed further, and
      relabelling to dodge the screen is forbidden. Note honestly that a
      timestamp inside a producer-written file is PRODUCER ATTESTATION and is
      not auditable from committed bytes (the V-804-2 lesson).
    - >-
      THE ENUMERATION IS A REQUIRED ARTIFACT AND IS EXPLICITLY NOT A COMPLETION
      (GOAL-AES-002 non_completion_criteria (i)). Under
      docs/inventor-protocol.md section 4 a count of screened-and-rejected
      mechanisms is a FATIGUE REPORT whose honest status is `unverified` and
      which is a statement about THIS SEARCH at THIS budget with THIS
      generation procedure in THIS environment, not about AES. Say that in the
      report. Do NOT propose a closure, a barrier statement, a reject_scoped or
      an evidence strength.
    - >-
      SECTION 5 HONEST ACCOUNTING IS MANDATORY AND IS EMITTED EVEN IF NOTHING
      SURVIVES. `dominated_by` is set to the exact R5 string "unresolvable in
      this environment: no primary source reachable; every recalled frontier
      row is unverified-from-memory" and NEVER to null. `sota_delta` records
      the DEFINITIONAL-REFERENCE delta explicitly labelled as such, plus the
      word `unadjudicable` for the published frontier. Where no result is
      claimed, say so in those fields rather than leaving them empty.
    - >-
      NO COMPUTE IS APPROVED BY THIS CARD. This is generation and screening on
      paper. If a candidate needs a measurement, SPECIFY the cheapest
      falsification gate it would need — the object, the statistic, the null
      control, the round-count decay check and the resource cost — and record
      whether that gate fits the envelope. A candidate whose cheapest gate does
      not fit the MEASURED envelope is recorded as OUT OF SCOPE FOR EXECUTION
      rather than estimated (AGENTS.md rule 9). The measured envelope is
      TASK-20260809-8ab82c's deliverable and may not have landed when this task
      runs: where you need it, say the figure is NOT YET MEASURED rather than
      assuming one.
    - >-
      NULL-OBJECT CONTROLS BEFORE BELIEF, SPECIFIED EVEN THOUGH NOTHING IS RUN
      HERE. For any candidate proposing a statistic, specify the matched
      random-permutation control at the same data complexity AND the
      round-count decay check up to the FULL round count, and state that a
      statistic which fails to decay as rounds rise is the canonical artifact
      tell rather than a finding. A control must ISOLATE the property it names
      and its sibling null must be specified before the label is believed
      (KN-FIND-029).
    - >-
      QUERY THE KNOWLEDGE CORPUS BEFORE GENERATING AND RECORD THE QUERY, THE
      TOOL AND THE RESULT. If retrieval is unavailable, record it as
      UNAVAILABLE with the reason and note that NO absence, novelty or
      prior-non-testing inference follows from an unavailable or empty index.
    - >-
      SCOPE AND CLAIM TIER. Default tier `toy`. Nothing in this task is a
      cryptanalytic result, a distinguisher, a key recovery or a barrier
      statement, and nothing here asserts anything about AES at any round count
      or about deployed AES. Create no ledger record, propose no hypothesis,
      promote nothing to knowledge, change no official state, and write only
      under this task's own directory.
    - >-
      DO NOT READ, CITE, COPY FROM OR RELY ON
      coordination/goals/GOAL-AES-002/batches/BATCH-001/tasks/gates/,
      .../ideation/ or .../ideation2/. Those directories pre-date this batch,
      were produced under no dispatch, carry no budget, no card and no review,
      and are NOT inputs to this task. Generate independently.
  deliverables:
    - stamps.json
    - lossy_projection_screen.json
    - object_enumeration.yaml
    - candidate_report.md
    - ideation_manifest.json (THE COVERING MANIFEST)
  artifact_paths:
    - coordination/goals/GOAL-AES-002/batches/BATCH-001/tasks/TASK-20260809-9b78b2/stamps.json
    - coordination/goals/GOAL-AES-002/batches/BATCH-001/tasks/TASK-20260809-9b78b2/lossy_projection_screen.json
    - coordination/goals/GOAL-AES-002/batches/BATCH-001/tasks/TASK-20260809-9b78b2/object_enumeration.yaml
    - coordination/goals/GOAL-AES-002/batches/BATCH-001/tasks/TASK-20260809-9b78b2/candidate_report.md
    - coordination/goals/GOAL-AES-002/batches/BATCH-001/tasks/TASK-20260809-9b78b2/ideation_manifest.json
  write_scope:
    - coordination/goals/GOAL-AES-002/batches/BATCH-001/tasks/TASK-20260809-9b78b2
  archived_by: TASK-20260809-877f6b
  inference:
    policy: research-deep
    requested_policy: research-deep
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
    standing_basis: >-
      inference-amendment commit 0137a051eb5828789eb267fa83c8278086578d4c.
      Cross-model independence is unavailable campaign-wide; nothing produced
      here may be treated as a closure attestation.
  budget:
    wall_clock_seconds: 1600
    memory_gb: 4
    maximum_runs: 4
  budget_basis: >-
    The 1600 s producer line of GOAL-AES-002 campaign_budget.sizing_basis,
    borrowed from GOAL-AES-001's measured executor producer actuals (792 / 892
    / 1609 / 1510) sized at or near the observed maximum with NO cushion added.
    This goal has no measured datum of its own and none is invented.
  completion_gate:
    - >-
      stamps.json exists, was written as the task's FIRST act, and carries
      start_utc, start_epoch, declared_wall_clock_seconds, binding_stop_utc
      computed as start plus declared, a stamp at every major section boundary,
      and a truthful halted_on_budget with the dropped work named if it halted.
    - >-
      lossy_projection_screen.json is marked as written BEFORE any candidate
      development, and carries for EVERY candidate the tracked object, what it
      discards, the compatibility judgement, the PASS / CHANGE_OF_COORDINATES
      verdict, the deduplication verdict against the named off-limits families,
      and the three axis scores.
    - >-
      No candidate recorded CHANGE_OF_COORDINATES or REDISCOVERY was developed
      further, and the report says so explicitly for each.
    - >-
      object_enumeration.yaml enumerates the full-round-relevant tracked
      objects considered, each with its survival target stated at the FULL
      round count (10/12/14) and not at a reduced one, and each with its
      cheapest falsification gate specified or recorded as OUT OF SCOPE FOR
      EXECUTION.
    - >-
      The report contains a docs/inventor-protocol.md section 5
      honest-accounting block with `dominated_by` set to the exact R5 string
      and NEVER null, and `sota_delta` recording the definitional-reference
      delta labelled as such plus `unadjudicable` for the published frontier.
    - >-
      The report states that the enumeration is NOT a completion
      (non_completion_criteria (i)), that a count of screened-and-rejected
      mechanisms is a fatigue report whose honest status is `unverified`, and
      that anything unreached is OPEN AND UNATTEMPTED.
    - >-
      The knowledge-corpus query, the tool used and the result are recorded,
      with the non-inference rule stated if retrieval was unavailable.
    - >-
      Every deliverable satisfies SC-4 as quoted; no deliverable states a
      margin, a cost claim or any relation to the published state of the art in
      either direction; no closure, reject_scoped, evidence strength or
      hypothesis is proposed.
    - >-
      ideation_manifest.json is designated THE COVERING MANIFEST in its own
      text and carries an artifact_provenance entry for EVERY declared artifact
      with path, kind from the closed vocabulary, sha256,
      comment_block_inference_stanza and
      covered_by_this_manifest_inference_block, its own entry recorded as SELF.
    - >-
      No pre-existing gates/, ideation/ or ideation2/ content was read, cited,
      copied or relied on; all writes are under this task's own directory.
  return_format: >-
    The candidate table with tracked object, lossy-projection verdict,
    deduplication verdict and the three axis scores; the enumeration; the
    section 5 honest-accounting block; the specified falsification gates with
    their envelope verdicts; and an explicit list of what is OPEN AND
    UNATTEMPTED.
