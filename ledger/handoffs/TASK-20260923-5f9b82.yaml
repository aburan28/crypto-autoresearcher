  objective: >-
    Decide whether the archived J6 output agrees with RUN-CERTBIN-3b7e05 on
    every compared quantity. For each disagreement, determine which
    implementation departs from the text of the frozen specification.

  uncertainty_reduced: >-
    Whether the run's load-bearing quantities survive an implementation that
    never saw the producer's, and if not, whose error it is.

  inputs:
    - coordination/review/certbin-20260923-c51f07/review-plan.yaml
    - coordination/review/certbin-20260923-c51f07/reviews/TASK-20260923-7a2cd4/ (archived by TASK-20260923-d04c5e; read-access LIFTED for you)
    - coordination/review/certbin-20260923-c51f07/blind/blind-inputs.json
    - coordination/review/certbin-20260923-c51f07/blind-inputs-key.json
    - coordination/review/certbin-20260923-c51f07/archives/ (the e3b590 and d04c5e receipts)
    - experiments/EXP-CERTBIN-4e92d7/specification.yaml
    - experiments/EXP-CERTBIN-4e92d7/impl/
    - experiments/EXP-CERTBIN-4e92d7/runs/RUN-CERTBIN-3b7e05/ (references.json, targets-F-S3.jsonl.gz, F-S3-reference-oplogs-D4.jsonl.gz, sizing.json, pivot-hazards.json, cell-summary.json, curve.json, manifest.yaml, manifest_v2.yaml)

  read_scope_excludes:
    - coordination/review/certbin-20260923-c51f07/reviews/TASK-20260923-b8f163/
    - coordination/review/certbin-20260923-c51f07/reviews/TASK-20260923-29e7af/
    - /home/user/certbin-dev/
    - the top-level session's exploratory scratch script and its outputs
    - the executor's in-session return message

  constraints:
    - id: CP-1
      text: >-
        VERIFY BEFORE COMPARING. Confirm three things. (1) The re-deriver's
        directory matches the TASK-20260923-d04c5e receipt's path_sha256.
        (2) seal.txt matches rederivation.json. (3) blind-inputs.json matches
        the TASK-20260923-e3b590 receipt. Then map labels and positions to run
        records with blind-inputs-key.json.
    - id: CP-2
      text: >-
        COMPARE EVERY ITEM BELOW and tabulate agree or disagree per item and per
        instance.
        Per reference (5), from references.json, the D = 4 reference op logs,
        sizing.json, cell-summary.json and pivot-hazards.json:
        - degenerate flag, s and arm;
        - rank_4, |Z_4| and one_in_R4;
        - the T_strict and T_set CONTENT at D = 4;
        - the T_rank, T_set, T_strict and T_ops hashes, where the run records
          them;
        - ops_strict, saving_strict, saving_set and (R_4, C_4);
        - for the unsatisfiable references, K_exact and K_rank, plus the
          first-64 nonzero-a_k step list with its rank-increment flags,
          against the run's own affine replay. Recompute it with impl/ if the
          run did not archive it.
        Per target (100), from targets-F-S3.jsonl.gz at D = 4:
        - degenerate flag, s and arm;
        - rank_4 and one_in_R4, and |Z_4| if recorded;
        - the four trace hashes, where encodings coincide;
        - the match flags against each reference at the four granularities.
        On the subsample:
        - the retention the run's own per-target match flags imply for each
          unsatisfiable reference, compared with the re-derivation's Q5
          counts. This is an identity check on the same 100 targets, not a
          comparison with the full-arm M1.
        Q7, if present: the regenerated curve against curve.json.
        Also: the re-deriver's `ambiguities` list, each item set against how
        the run resolved it (trial-plan-v1.json I-1..I-25 and impl/).
    - id: CP-3
      text: >-
        LOCALISE EVERY DISAGREEMENT:
        (a) read both implementations at the spec clause concerned;
        (b) run a third, minimal, spec-literal check on that one instance, in
            your own code, declared;
        (c) name which side departs from the spec text, or name the spec
            ambiguity that both sides read differently.
        A hash-only disagreement where the content agrees is an ENCODING
        difference and is recorded as such. It is not a disagreement about
        the quantity.
    - id: CP-4
      text: >-
        VERDICT ON J7:
        - `holds` if every compared quantity agrees, or every disagreement
          localises to the re-deriver or to an encoding difference;
        - `breaks` if any disagreement localises to the producer's
          implementation;
        - `inconclusive` if any disagreement cannot be localised, or if it
          traces to a genuine spec ambiguity read differently by both sides.
          Name the clause.
        Agreement on a quantity whose value is at a floor or a ceiling for
        every instance is weak evidence about the implementation. Say which
        compared items are of that kind.
    - id: CP-5
      text: >-
        REPORT ON J7 ONLY. Do not read the other reviewers' reports. Offer no
        verdict on the claim. Zero trials. Verification computations for
        CP-2/CP-3 are allowed on at most 20 archived instances, declared.
    - id: CP-6
      text: >-
        DISCLOSED PRIOR (review-plan PD-R1). The Coordinator's review prior
        expects agreement and names where a disagreement would most likely
        appear. Do not let that decide where you look hardest. Compare
        everything in CP-2.

