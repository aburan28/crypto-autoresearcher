handoff:
  id: TASK-20260802-002
  from: coordinator
  to: coordinator
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-028
  role: coordinator
  archive_kind: snapshot
  objective: >-
    Commit DEC-20260801-015 alone with this receipt, so the batch opening - and
    in particular the pre-registered seed family and reading rule RR-IVR-1 - is
    durable in Git BEFORE any contract is authored and before any instance
    exists.
  uncertainty_reduced: >-
    Whether the pre-registration is durable evidence rather than a working-tree
    artifact, which is the whole anti-tuning basis of the batch.
  inputs:
  - ledger/decisions/DEC-20260801-015.yaml
  constraints:
  - 'RUN ALONE. Stage exactly the two paths in declared_commit_sets.TASK-20260802-002_snapshot.'
  - 'RUN tools/validate_ledger.py AGAINST THE TREE BEFORE STAGING and record the error count in the receipt.'
  - 'DO NOT STAGE ledger/goals/GOAL-ECDLP-001.yaml, ledger/hypotheses/H-LPF-001.yaml, the dispatch queue, the opening note, any handoff, any tools/ file or any experiment file.'
  - >-
    RECORD SPECIFICATION_SHA256, READING_RULE_V1_SHA256, READING_RULE_V2_SHA256
    and DRIVER_SHA256 as named fields and REFUSE TO COMMIT if any differs from
    its bound value - the self-voiding condition on the reduced duty set,
    checked at its first archive.
  - 'STATE NO INTERPRETATION, SELECT NO BRANCH, STATE NO DISPOSITION AND MAKE NO APPROVAL DETERMINATION.'
  - 'Commit message must contain TASK-20260802-002, TASK-20260802-001, DEC-20260801-015, EXP-LPF-001, GOAL-ECDLP-001, BATCH-028.'
  - 'Do not push from this task; the session pushes and refreshes the PR.'
  deliverables:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/archives/TASK-20260802-002/snapshot_commit_receipt.json
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/archives/TASK-20260802-002/snapshot_commit_receipt.json
  archived_by: TASK-20260802-002
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 900
    memory_gb: 1
    maximum_runs: 1
  completion_gate:
  - >-
    Post-commit verifier accepts the exact two-path diff and hashes; the
    validator error count recorded; the four named sha256 fields recorded and
    matching their bound values; no interpretation, no branch selection and no
    authorization stated.
