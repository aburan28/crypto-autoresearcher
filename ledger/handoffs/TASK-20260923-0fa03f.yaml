      - any file under runs/ whose id is not reserved in trial-plan-v2.json,
        as a scope finding, NOT staged. That includes any addendum id, which
        belongs to TASK-20260923-4ff597.
      __pycache__ byte-code is excluded as a build product. Any msolve input
      or output retained in a package under R-10 is staged with it.
    pre_commit_checks: >-
      (1) The 14 phase-A paths still hash to the phase-A receipt values.
      (2) `python3 experiments/EXP-GFPN-05ff43/implementation-v2/v2_check_run.py`
          runs on each staged package, and its output is recorded verbatim.
          It is recorded, not acted on: a failing package is still staged
          exactly as returned.
      (3) No path outside the staged scopes and the receipt is in the
          commit.
    receipt: coordination/goals/GOAL-GFPN-380702/archives/TASK-20260923-0fa03f/post-run-receipt.json
    receipt_contents: >-
      The receipt records:
      - kind snapshot, phase B, source_task_ids [TASK-20260923-cd932c];
      - parent_sha;
      - path_sha256 for every staged file;
      - the pre_commit_checks outputs;
      - the reserved-id accounting;
      - the origin/main base commit and the merge outcome;
      - record_ids (every staged RUN-GFPN-* id);
      - the validator outcome;
      - scope findings.
    commit_message_must_name: [TASK-20260923-0fa03f, TASK-20260923-cd932c, EXP-GFPN-05ff43, every staged RUN-GFPN-* id]
    completion_gate:
      - stage 2 has returned, and every run directory under a reserved id and execution-report-v2.yaml are staged exactly as returned
      - the phase-B commit changes nothing outside the staged scopes and the post-run receipt
      - the post-run receipt's path_sha256 covers every staged file and matches the committed tree, and records its own parent, origin/main base commit and merge outcome
      - the v2_check_run.py outputs and the reserved-id accounting are recorded verbatim
      - the branch is pushed and the PR refreshed, naming the staged RUN-GFPN-* ids
      - nothing was composed or scored, and no reviewer was launched before this gate was met

  verifier_standard: >-
    The dispatching session performs both commits and writes both receipts.
    After each commit, the post-commit verifier re-checks every path_sha256
    in the receipt against the ARCHIVE COMMIT'S TREE, reading `git show
    <archive commit>:<path>`, not against the working tree. It also checks
    that:
    - the commit changes exactly the declared paths plus the receipt, or a
      superset the receipt lists;
    - the commit names this task and the listed records;
    - the parent recorded in the receipt is the commit's parent.
    Content binds first (CLAUDE.md "Archive receipts bind to CONTENT
    first"). Reachability of the commit from main is advisory, but a content
    mismatch is fatal. A phase is official only when the verifier accepts it.

  deliverables:
