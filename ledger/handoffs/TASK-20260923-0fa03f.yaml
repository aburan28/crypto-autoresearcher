      - experiments/EXP-GFPN-05ff43/implementation-v2.md
      - experiments/EXP-GFPN-05ff43/trial-plan-v2.json
    bound_paths_note: >-
      The 12 file names are those listed in implementation-v2.md section 1
      (lines 25-40). This act's directory listing shows the same 12 files.
      The receipt binds every file that `git ls-tree -r 689716be5
      experiments/EXP-GFPN-05ff43/implementation-v2/` lists. If that set
      differs from these 12 names, the receipt records the difference as a
      scope finding, and the archive STOPS for a Coordinator decision. It
      never binds a narrowed or widened set silently. These paths are already
      committed by the filing commit, so the phase-A commit adds no diff to
      them. It adds only the receipt, as TASK-20260923-64faac bound the
      already-committed TASK-20260923-aa277e card.
    verification_steps: >-
      (1) `git cat-file -e 689716be5` succeeds, and 689716be5 is an ancestor
          of the branch head.
      (2) For each bound path, the blob at 689716be5, the blob at the branch
          head and the working-tree file are identical. `git diff --quiet
          689716be5 HEAD -- <paths>` and `git status --porcelain -- <paths>`
          are both empty.
      (3) sha256 is computed from the working-tree bytes of each bound path.
      (4) No directory experiments/EXP-GFPN-05ff43/runs/<id>/ exists for any
          id reserved in trial-plan-v2.json. This is the "no v2 run package"
          check.
      (5) The amendment file still hashes to
          e02d4976a5e773b9eee95aa4c376d6154e9c0a9da4e6c6118ed58748054924d3.
      (6) Untracked paths under implementation-v2/ are listed in the receipt,
          for example __pycache__/. v2_run_wrapper.py W-4 decides whether they
          block a run. They are never staged.
      A failure of (1), (2), (4) or (5) STOPS the archive. The failure is
      reported, and nothing is committed.
    receipt: coordination/goals/GOAL-GFPN-380702/archives/TASK-20260923-0fa03f/snapshot-receipt.json
    receipt_contents: >-
      The receipt records:
      - kind snapshot, phase A, source_task_ids [TASK-20260923-cd932c];
      - the filing commit 689716be5 in full;
      - parent_sha;
      - path_sha256 for the 14 bound paths;
      - the amendment sha256 as checked;
      - the outcome of verification steps (1) to (6);
      - the origin/main base commit checked and the merge outcome;
      - record_ids;
      - the validator outcome;
      - scope findings.
      The receipt never carries its own commit's sha. The verifier binds
      that after the commit.
    commit_message_must_name: [TASK-20260923-0fa03f, TASK-20260923-cd932c, EXP-GFPN-05ff43, DEC-20260923-e788a1, DEC-20260923-034ba0]
    completion_gate:
      - verification steps (1), (2), (4) and (5) pass, and any finding from (6) is recorded
      - the phase-A commit changes exactly the receipt path, plus nothing else, or a documented superset that the receipt lists
      - the receipt's path_sha256 covers all 14 bound paths and matches the committed tree
      - the receipt records the parent, the origin/main base commit and the merge outcome
      - tools/validate_ledger.py on the head reports no error line beyond the base's pre-existing set
      - the branch is pushed and the PR is refreshed, naming TASK-20260923-0fa03f and EXP-GFPN-05ff43
      - no v2 run package exists, and nothing was launched

