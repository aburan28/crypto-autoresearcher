    - coordination/goals/GOAL-GFPN-380702/archives/TASK-20260923-0fa03f/snapshot-receipt.json
    - 'phase B: one commit naming TASK-20260923-0fa03f, TASK-20260923-cd932c and every staged RUN-GFPN-* id'
