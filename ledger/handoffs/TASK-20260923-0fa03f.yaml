# =============================================================================
# TASK-20260923-0fa03f -- Coordinator SNAPSHOT ARCHIVE of TASK-20260923-cd932c
# (`/run EXP-GFPN-05ff43`, protocol v2). Two phases are declared up front:
#   PHASE A (now, after stage 1 and before any v2 run). It binds by SHA-256 the
#     12 files of experiments/EXP-GFPN-05ff43/implementation-v2/,
#     implementation-v2.md and trial-plan-v2.json, as committed at filing
#     commit 689716be5, and records snapshot-receipt.json.
#   PHASE B (after stage 2, before any independent review). It binds by
#     SHA-256 every v2 run package and execution-report-v2.yaml, and records
#     post-run-receipt.json.
# Reserved by DEC-20260923-e788a1 (AC-3; next_actions). Written by the
# Coordinator ruling act TASK-20260923-242cd0 (DEC-20260923-034ba0 R-8),
# following TASK-20260923-3b12c2 (two receipted commits) and
# TASK-20260923-64faac. An archive is not approval and not evidence. This
# card edits nothing and launches nothing.
# =============================================================================
handoff:
  id: TASK-20260923-0fa03f
  from: coordinator
  to: coordinator
  archive_kind: snapshot
  kind: snapshot_archive
  recorded_at: '2026-09-23'
  source_task_ids:
    - TASK-20260923-cd932c
  source_task_ids_note: >-
    Phase A archives stage 1 of TASK-20260923-cd932c. Phase B archives stage 2
    of the same card.
  goal_id: GOAL-GFPN-380702
  question_id: RQ-GFPN-c01af8
  experiment_ids: [EXP-GFPN-05ff43]
  hypothesis_ids: [H-GFPN-9a29be]
  record_ids:
    - EXP-GFPN-05ff43
    - TASK-20260923-cd932c
    - TASK-20260923-0fa03f
  record_ids_note: >-
    Phase B adds every RUN-GFPN-* id it stages. Each is one of the ids
    reserved in trial-plan-v2.json.

  archival_binding: >-
    THIS CARD IS THE ONE ARCHIVAL TASK that TASK-20260923-cd932c names in
    archived_by. It owns every deliverable of that card, stage 1 and stage 2,
    from before stage 2 writes anything. Phase B is declared here in advance
    as the step that archives the run packages.

  objective: >-
    PHASE A: make stage 1's implementation durable and hash-bound BEFORE ANY
    v2 RUN (DEC-20260923-e788a1 AC-3; amendment DC-6 R-11; card DP-5).
    - Verify that the 14 paths below are byte-identical in the working tree,
      at the branch head and at filing commit 689716be5.
    - Record per-path SHA-256 in a snapshot receipt, with the parent, the
      origin/main base commit checked and the merge outcome.
    - Commit the receipt alone.
    Every v2 manifest then records this commit and a clean tree for these
    paths.
    PHASE B: after stage 2 returns, commit every v2 run package that exists
    under the ids reserved in trial-plan-v2.json, and
    execution-report-v2.yaml, exactly as returned. Record a post-run receipt,
    so that the review plan and independent review read committed,
    hash-bound bytes.

  uncertainty_reduced: >-
    PHASE A: whether the code and plan that stage 2 runs are exactly the
    bytes that stage 1 produced and that reach main, so that no
    implementation change can hide between the commit and a run. PHASE B:
    whether the run packages that reviewers read are the bytes the executor
    wrote, with nothing outside the write scope touched.

  inputs:
    - ledger/handoffs/TASK-20260923-cd932c.yaml
    - ledger/decisions/DEC-20260923-e788a1.yaml
    - ledger/decisions/DEC-20260923-034ba0.yaml
    - experiments/EXP-GFPN-05ff43/implementation-v2/ (phase A)
    - experiments/EXP-GFPN-05ff43/implementation-v2.md (phase A)
    - experiments/EXP-GFPN-05ff43/trial-plan-v2.json (phase A; phase B reads it for the reserved ids)
    - experiments/EXP-GFPN-05ff43/runs/<each RUN-GFPN-* id reserved in trial-plan-v2.json>/ (phase B)
    - experiments/EXP-GFPN-05ff43/execution-report-v2.yaml (phase B)
    - origin/main

  constraints:
    - id: SC-1
      text: >-
        STAGE ONLY THE DECLARED PATHS, per phase, path by path. `git add -A`
        is forbidden. A path that is dirty or untracked outside the declared
        set is not staged. If it lies inside implementation-v2/ (for example
        __pycache__/), it is NAMED in the receipt as a scope finding.
    - id: SC-2
      text: >-
        EDIT NO RECORD WHILE ARCHIVING. That covers implementation-v2/,
        implementation-v2.md, trial-plan-v2.json, run packages, the execution
        report, the specification, both amendments, cards, decisions,
        corrections, the goal record and tools/. A defect found now becomes a
        new record, never a repair.
    - id: SC-3
      text: >-
        MERGE origin/main INTO THE BRANCH, NEVER REBASE, before each phase's
        commit. Record the base commit checked and the merge outcome in that
        phase's receipt. A conflict inside a record is resolved by a
        superseding record under a new id, never by picking a side.
    - id: SC-4
      text: >-
        AN ARCHIVE IS NOT EVIDENCE AND NOT APPROVAL. H-GFPN-9a29be stays
        inconclusive. HEUR-GFPN-DFLAT stays untested. Protocol v2 stays as
        DEC-20260923-e788a1 approved it. Phase B composes, scores and
        interprets nothing.
    - id: SC-5
      text: LAUNCH NOTHING. maximum_runs 0 for both phases.
    - id: SC-6
      text: >-
        PHASE ORDER.
        - Phase A runs after TASK-20260923-2e741f (the act that wrote this
          card) is verified and pushed. It completes, is verified and is
          pushed before stage 1b (TASK-20260923-4c64b5) and before stage 2
          of TASK-20260923-cd932c (DEC-20260923-034ba0 R-5).
        - Phase B runs only after stage 2 returns (any outcome, including a
          failed gate or a checkpoint on wall-clock expiry). It runs before
          stage 2b (TASK-20260923-6c7f55) and before any review plan or
          reviewer.
        - Each phase runs ALONE: no producer, solver or other archive runs
          while it runs.
    - id: SC-7
      text: >-
        After each commit, push the branch and refresh the open PR against
        main (PR #1383 on claude/pollard-rho-speedup-hypotheses-yu8qwp, or its
        successor), naming the records. Amazon Bedrock is prohibited. Write no
        model name into a receipt beyond the inference block's resolved
        binding, which the dispatching session records.

