    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 10800
    memory_gb: 8
    maximum_runs: 1
  completion_gate:
  - >-
    PASS or REVISE returned in contract_review.yaml with a recommendation to
    TASK-20260801-069 and every blocking defect listed with its location and its
    consequence; all five duty deliverables written; every quoted number recomputed and
    every structural claim re-derived from source and re-tested by execution; attainability
    and perturbation-movement RE-RUN from scratch rather than inherited; the moving_rungs
    generating operation re-run rather than its output re-read; the machine diff produced
    with every difference enumerated and classified, and any fifth change reported as a
    REVISE; reading_rule.yaml, specification.yaml and lpf001_driver.py confirmed unmodified
    against Git with their sha256 values quoted; V8's restated claim confirmed recomputable
    from the archived arrays; the RTB-054-6 declaration ruled adequate or not; every routed
    open item ruled on with its counterfactual stated; narrowest supported statement,
    non-null dominated_by and quantitative sota_delta present; no repair authored; no
    commit made.
