handoff:
  id: TASK-20260801-068
  from: coordinator
  to: red-team
  role_assigned_by_queue: reviewer
  role_mapping_note: >-
    This harness has no dedicated reviewer subagent; the red-team contract in
    agents/red-team.md serves the reviewer role. The serving session must record the
    mapping, must not have authored, executed, validated or frozen any artifact under
    review, and must state that independence here is PROCEDURAL and not model-level. THE
    SESSION THAT SERVED TASK-20260801-054 MAY NOT SERVE THIS TASK - it authored the
    findings the repair implements and cannot independently review whether they were
    implemented faithfully.
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-026
  experiment_id: EXP-LPF-001
  hypothesis_id: H-LPF-001
  objective: >-
    Decide whether RR-LPF-2 repairs RTB-054-1, RTB-054-2 and RTB-054-6 without opening any
    other latitude, and whether the apparatus read by it can still measure what it claims.
    Return PASS or REVISE with a recommendation to TASK-20260801-069. FIVE NAMED DUTIES,
    SIX DELIVERABLE FILES, AND A GAP IN ANY ONE IS A REVISE.
  uncertainty_reduced: >-
    Whether a repair authored after an independent review of the measured numbers stayed
    inside its cap, and whether the regenerated certification changes anything the
    attainability argument depended on. THE PRIOR IS MIXED AND YOU SHOULD ACT ON IT - the
    apparatus passed its capability audit at BATCH-025 and its reading rule did not, so the
    failure mode to hunt here is a repair that quietly improves its own position.
  inputs:
  - experiments/EXP-LPF-001/reading_rule_v2.yaml at the TASK-20260801-067 commit
  - experiments/EXP-LPF-001/reading_rule.yaml at 1026150f
  - experiments/EXP-LPF-001/specification.yaml at ba1567ee
  - experiments/EXP-LPF-001/implementation/lpf001_driver.py
  - experiments/EXP-LPF-001/implementation/plant_z_regen.py
  - experiments/EXP-LPF-001/results/calib/
  - experiments/EXP-LPF-001/results/plantz/plant_z_tail_report.json
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-calib/raw-result.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-026/reviews/TASK-20260801-065/plant_z_validation_report.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/reviews/TASK-20260801-054/
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/reviews/TASK-20260801-051/calibration_validation_report.yaml
  - ledger/decisions/DEC-20260801-011.yaml
  - ledger/hypotheses/H-LPF-001.yaml
  - AGENTS.md
  - CLAUDE.md
  - docs/inventor-protocol.md
  - docs/claims-and-verification.md
  constraints:
  - >-
    INDEPENDENT SESSION. You did not author, execute, validate or freeze any artifact under
    review, AND YOU DID NOT SERVE TASK-20260801-054. Record the role mapping and state that
    independence is PROCEDURAL and not model-level.
  - >-
    RECOMPUTE AND EXECUTE, DO NOT READ. Recompute every quoted number from the named raw
    arrays with your own code; re-derive every structural claim from driver SOURCE and then
    re-test it by EXECUTING the driver's own functions on your own inputs. THIS IS WHAT
    CAUGHT RTB-054-1 AND RTB-054-2, NEITHER OF WHICH WAS VISIBLE TO READING.
  - >-
    DUTY 1 - ATTAINABILITY, deliverable attainability_check.md. RE-RUN FROM SCRATCH AGAINST
    RR-LPF-2. DO NOT INHERIT THE BATCH-025 VERDICT ON THE GROUND THAT ONLY THREE ENTRIES
    CHANGED - a regenerated moving_rungs changes what is certified, and what is certified
    feeds the L-1 stop condition, the S1 and S2 certified sets and every per-rung power
    statement. Classify each branch DEMONSTRATED-REACHABLE or REACHABLE-IN-PRINCIPLE; a
    branch UNREACHABLE BY CONSTRUCTION is a REVISE. Check the three extensions - no branch
    keys on a ledger status; NO CONTROL LEG IS AN UNBANDED EXISTENTIAL, with each
    aggregating leg's false-fire probability RECOMPUTED and a value above 0.02 being a
    REVISE; and NO BRANCH DEPENDS ON A QUANTITY THE MEASUREMENT ARM CANNOT CHANGE, checked
    leg by leg. CONFIRM INDEPENDENTLY that L-1's second leg is still FALSE under the
    regenerated lists and that L-2, L-3 and L-4 remain reachable. Verify the end-to-end
    probability that a correct null reaches L-2 and rule on whether the favourable branch
    could still have failed.
  - >-
    DUTY 2 - ANTI-TUNING, deliverable anti_tuning_check.md. Verify AGAINST GIT that
    ba1567ee is an ancestor of 104d32fa which is an ancestor of the TASK-20260801-067
    commit; that specification.yaml still hashes to
    0d6c946fb84073feae47865da9b787b7d7ba459617834644680a06bf886d1cda; that
    reading_rule.yaml is BIT-IDENTICAL to its state at 1026150f with sha256
    8bcb196fa620503c736da307281325d17bb3dc8b0299407b24b584067c979f1d, AN EDIT OF IT BEING
    AN IMMEDIATE REVISE AND AN EVIDENCE-INTEGRITY FAILURE; that lpf001_driver.py still
    hashes to 786aeb0550d75fa3d0785aefbe50b121a24cacae584a4cadd79902c464722d65; that the
    plant-Z regeneration contains no OBJ-REAL sample at the level of objects and not
    labels; and that no statistic, rung, cut, band or branch was added, dropped, moved or
    reordered.
  - >-
    DUTY 3 - ALTERNATIVE CLASS, deliverable alternative_class_check.md. Verify
    ALT-CLASS-LPF-1 against DRIVER SOURCE and against the archived plant-Z arrays. THE
    RESTATED V8 IS THE FOCUS - confirm its quantitative claim is RECOMPUTABLE FROM THE
    ARCHIVED ARRAYS rather than asserted, confirm it does not reintroduce an impossibility
    claim in softer words, and confirm its operative content did not weaken. Confirm that
    the restatement does NOT overturn STRIKE-1, whose measured basis of 0 of 28 flagged
    rows at maximum absolute shift 0.3379820826156079 null sd is unchanged and
    independently sufficient. RE-DERIVE DESIGN-TRAP-LPF-1 INDEPENDENTLY. RULE EXPLICITLY ON
    ABS-REL-LPF-1. Rule on whether the certified list still overstates what the ladders
    reach.
  - >-
    DUTY 4 - PERTURBATION MOVEMENT, deliverable perturbation_movement_check.md. FIRST
    derive from source whether each plant family can move each certifying statistic AT ALL.
    THEN check ROW BY ROW over all 210 rows against RR-LPF-2's 28 regenerated lists. THE
    PRECISE CHECK THIS BATCH EXISTS TO PASS - every gamma in every moving_rungs list must
    carry flag true, and every gamma with flag true must appear in its list. RE-RUN THE
    GENERATING OPERATION RR-LPF-2 STATES rather than re-reading its output.
  - >-
    DUTY 5 - THE SUPERSESSION DIFF, deliverable supersession_diff_check.md. Produce a
    MACHINE DIFF of reading_rule_v2.yaml against reading_rule.yaml, ENUMERATE EVERY
    DIFFERENCE, and classify each as one of the four permitted changes or as a fifth
    change. A FIFTH CHANGE IS A REVISE WHATEVER ITS MERIT, INCLUDING A CHANGE THAT IMPROVES
    THE FILE. Confirm that every band edge, spread, cut, branch string, probability, strike
    and carried ruling is BYTE-IDENTICAL or, where reformatted, semantically identical
    under a stated normalisation. Confirm that every superseded sentence is QUOTED VERBATIM
    beside its replacement.
  - >-
    RULE ON WHETHER THE RTB-054-6 DECLARATION IS ADEQUATE - whether it states the asymmetry
    in numbers, whether it is bound to travel with every LIMB B reading, and whether the
    [1/8, 8] band or the u_star_formula moved anywhere. A moved band is a REVISE.
  - >-
    RULE ON EVERY OPEN ITEM RR-LPF-2 ROUTES TO YOU, on textual grounds where the item is a
    question of what a frozen text means, and STATE EXPLICITLY WHETHER YOUR RULING COULD
    HAVE BEEN MADE WITHOUT THE MEASURED VALUE, with the counterfactual stated in both
    directions.
  - >-
    AUTHOR NO REPAIR AND MODIFY NO ARTIFACT UNDER REVIEW. Naming what a repair would have
    to be is your job; writing it is the Coordinator's.
  - >-
    State the narrowest supported statement, dominated_by (NEVER null) and a QUANTITATIVE
    sota_delta, per docs/inventor-protocol.md section 5.
  - >-
    A REVISE MUST NAME AN OBSTRUCTION, GIVE AN ARGUMENT AND NAME WHAT REMAINS OPEN.
    Declining a direction as exhausted is premature closure and is forbidden. A PASS MUST
    BE EQUALLY EXPLICIT ABOUT WHAT IT IS NOT CERTIFYING - it certifies that the rule reads
    the apparatus honestly, and nothing about the Semaev map, HEUR-DS-1 or anything at
    cryptographic scale.
  - 'MAKE NO COMMIT; TASK-20260801-069 archives these six files.'
  - Record inference honestly (requested review-adversarial, independent session).
  deliverables:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-026/reviews/TASK-20260801-068/contract_review.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-026/reviews/TASK-20260801-068/attainability_check.md
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-026/reviews/TASK-20260801-068/anti_tuning_check.md
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-026/reviews/TASK-20260801-068/alternative_class_check.md
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-026/reviews/TASK-20260801-068/perturbation_movement_check.md
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-026/reviews/TASK-20260801-068/supersession_diff_check.md
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-026/reviews/TASK-20260801-068/contract_review.yaml
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-026/reviews/TASK-20260801-068/attainability_check.md
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-026/reviews/TASK-20260801-068/anti_tuning_check.md
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-026/reviews/TASK-20260801-068/alternative_class_check.md
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-026/reviews/TASK-20260801-068/perturbation_movement_check.md
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-026/reviews/TASK-20260801-068/supersession_diff_check.md
