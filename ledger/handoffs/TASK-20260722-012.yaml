handoff:
  id: "TASK-20260722-012"
  from: "coordinator"
  to: "idea-generator"
  objective: "Construct one exact, versioned schedule-to-receipt-to-rank conservation certificate contract, or return a decisive scoped no-go derivation at the first unsatisfied obligation."
  uncertainty_reduced: "Whether frontier-B can be made mathematically and operationally precise enough for a later toy-only validation design."
  inputs:
    - "EV-ECDLP-002 and DEC-20260722-002"
    - "TASK-20260721-008 producer package"
    - "TASK-20260722-002 independent review package"
    - "current claims, lifecycle, run-record, and dispatch contracts"
    - "DEC-20260722-004"
  constraints:
    - "Review-only theory and schema work; do not implement or execute any experiment."
    - "Use public documentation and toy/public fixture descriptions only."
    - "Seal a hash-bound pre-execution attempt schedule, seeds, retry graph, terminal vocabulary, field, canonical row format, and column schema."
    - "Define an exact schedule-to-terminal-receipt bijection and independent relation, row, and incremental-rank verification."
    - "Preserve CPU, wall time, group operations, I/O, communication, retained bytes, and peak memory as a resource vector with explicit ownership and no illicit scalar sum."
    - "Replace ceil(r/p_L) with a declared-alpha binomial or negative-binomial tail gate and state every IID, stratification, or sequential assumption."
    - "Include planted omission, duplicate-ID, retry-cycle, field/schema mismatch, shared-work attribution, certificate/row mismatch, and wrong-field controls."
    - "Avoid the P1553 R4 operation and make no attack improvement, lower-bound, or cryptographic claim."
    - "If a complete contract cannot be constructed, identify the first exact obligation that fails and provide a reader-checkable scoped no-go derivation; do not assert universal impossibility."
    - "Preserve every pre-existing dirty ideas path and write only within the assigned scope."
    - "Run only with exact model slug gpt-5.6-sol-high."
    - "Record requested_policy research-sol-max, resolved_model_id gpt-5.6-sol-high, reasoning_effort high, available_reasoning_effort high, fallback_used true, adapter_version, and authorization_ref DEC-20260722-004."
    - "Do not claim equivalence between the fallback and the unavailable policy."
  deliverables:
    - "certificate_contract.yaml"
    - "derivation_and_no_go.md"
  artifact_paths:
    - "coordination/goals/GOAL-ECDLP-001/batches/BATCH-002/tasks/TASK-20260722-012/certificate_contract.yaml"
    - "coordination/goals/GOAL-ECDLP-001/batches/BATCH-002/tasks/TASK-20260722-012/derivation_and_no_go.md"
  archived_by: "TASK-20260722-013"
  inference:
    policy: "research-sol-max"
    fallback_allowed: true
    fallback_model: "gpt-5.6-sol-high"
    authorization_ref: "DEC-20260722-004"
    required_resolution:
      requested_policy: "research-sol-max"
      resolved_model_id: "gpt-5.6-sol-high"
      reasoning_effort: "high"
      available_reasoning_effort: "high"
      fallback_used: true
    independent_session_required: false
  budget:
    wall_clock_seconds: 1800
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
    - "Both exact review-only artifacts exist and bind all relied-upon inputs."
    - "The contract either supplies every schedule, schema, probability, rank, resource, control, and verification field or identifies the first missing obligation in a scoped no-go derivation."
    - "Exactly one recommended next action is recorded and no implementation or experiment is authorized."
    - "The inference receipt exactly matches the authorized fallback; otherwise the task is invalid."
  return_format: "YAML certificate contract plus Markdown derivation or scoped no-go analysis."
