handoff:
  id: TASK-20260728-001
  from: coordinator
  to: executor
  batch_id: BATCH-010
  goal_id: GOAL-ECDLP-001
  authorizing_decisions: [DEC-20260728-001, DEC-20260728-002]
  title: >-
    Implement and execute EXP-RT1476-001 version 1: the subresultant-PRS backward-state degree
    meter for the serial-S3 2|3 split of S5, with both controls

  objective: >-
    Produce, for the first time in this program, MEASURED values of the two RT-1476-SUBRES-A1
    exponents on the frozen toy parameter set: beta_deg, the growth exponent in log q of the
    backward 3-sum state at the shared Kummer coordinate u, and beta_ops, the growth exponent of
    counted GF(p) operations RESTRICTED TO MEMBERSHIP QUERIES THAT PRODUCED AN INDEPENDENTLY
    VERIFIED RELATION CERTIFICATE. Run both controls at every size. Record observations only.
  uncertainty_reduced: >-
    Whether the backward 3-sum state of the serial-S3 split collapses below the generic
    q^{3/5} count at balanced m=5 sizing, or does not, at three toy field sizes. This exponent
    has never been measured; the gate has been open for 29+ ideation runs on a prior alone.

  inputs:
    - 'experiments/EXP-RT1476-001/specification.yaml - THE FROZEN PROTOCOL. Read it in full. It is immutable and is the sole authority on parameters, controls, metrics, budgets, stopping rules, invalidation rules and criteria.'
    - 'ledger/hypotheses/H-RT1476-001.yaml - the hypothesis, its mechanism, its assumptions and its non-falsifiers F5 and F6.'
    - 'ledger/decisions/DEC-20260728-002.yaml - the approval, including the ruling that separates beta_deg from beta_ops and the metric-by-metric survival analysis of the sympy substitution.'
    - 'inputs/idea_generation_20260718_batch2.md lines 1286-1319 - the original frozen Contract A1; lines 1388-1397 - the red-team amendment that created the successful-subset restriction.'
    - 'harness/semaev.py - s2, s3_expr, s3_eval, s4_expr, build_factor_base, measure_s3_decomposition, verify_decomposition_certificate.'
    - 'harness/toycurve.py - EllipticCurve (add, mul, negate, lift_x, is_on_curve, order, order_bsgs), ECDLPInstance, generate_instance, _seed_int.'
    - 'harness/runner.py and harness/run.py - the existing run-record conventions, for the manifest layout.'
    - 'templates/research-records.md - run index schema and the Coordinator archive receipt schema.'
    - 'docs/claims-and-verification.md - claim tiers and certificate semantics; every claimed relation carries a certificate the wrapper re-verifies independently.'
    - 'AGENTS.md rules 3, 4, 5, 8, 9, 10 and the Artifact policy section.'
    - 'experiments/EXP-GGM-001/simulability_test.py - READ IT AS AN ANTI-PATTERN. It is the module BATCH-009 found to be a lookup table keyed on its own inputs, with a control gate comparing two string literals in the same source file. Do not write anything with that shape.'

  constraints:
    - >-
      THE SPECIFICATION IS FROZEN AND IMMUTABLE. Do not edit
      experiments/EXP-RT1476-001/specification.yaml. It is outside your write scope. If the
      protocol cannot be implemented as frozen, invoke STOP-4: stop, report the exact
      obstruction, and do not improvise a different measurement under this experiment id. A
      substituted measurement is a different experiment and needs its own specification and its
      own approval.
    - >-
      ANTI-TAUTOLOGY RULE, BINDING. No threshold, expected value, verdict or answer key may be
      visible to the measuring code path. The numbers 0.3, 0.6, 0.2 and 1.5 must not appear in
      subresultant_meter.py's measurement functions, must not be branched on, and no pass/fail
      verdict may be emitted by the module. The module emits MEASUREMENTS. Threshold comparison
      happens in analysis.md, and again independently in TASK-20260728-003. Every per-run gate
      quantity must be WRITTEN INTO raw-result.json - a number that appears only in stdout is a
      number that does not exist.
    - >-
      NINE RUNS MEANS NINE COMPUTATIONS. Each of the 27 run directories must be the product of a
      distinct computation on distinct inputs. If any two raw-result.json files are byte-identical
      when their inputs differ, INVALID-6 fires and the run set is returned. Do not compute once
      and serialize N times; that is precisely what EXP-GGM-001 did across nine directories.
    - >-
      EVERY CLAIMED RELATION CARRIES A CERTIFICATE AND THE WRAPPER RE-VERIFIES IT INDEPENDENTLY.
      A root of the backward eliminant lying in the forward state is a CANDIDATE, never a
      relation: S3 is x-only and does not determine signs. A relation exists only when an
      explicit signed 5-tuple satisfies the group identity on E. Write every certificate to
      certificates.json with its independent re-verification result. An unverified success is not
      a success, and one failing certificate invalidates its whole cell (INVALID-3).
    - >-
      THE SUCCESS-SUBSET RESTRICTION IS THE POINT OF THE EXPERIMENT. beta_ops is fitted on
      ops_success only - operations spent on queries that produced a verified certificate. Report
      ops_all separately so the excluded abort speedup is auditable. Never pool them, never fit
      on the aggregate, and never substitute wall-clock for either.
    - >-
      ops_success MUST BE A REAL INSTRUMENTED INTEGER from a hand-written GF(p) arithmetic layer
      used by the query path, with multiplications, additions/subtractions and inversions counted
      separately and combined by a weighting you declare. If any part of the query path is a
      black-box sympy routine, the operations inside it are UNCOUNTABLE: record ops_success as
      null with that reason (INVALID-7) rather than substituting a wall-clock proxy or an
      estimate. A missing number stays missing.
    - >-
      CURVE CONSTRUCTION: do NOT use harness.toycurve.generate_instance. It chooses p itself and
      cannot be told to use 16769023, and it calls the naive O(p) EllipticCurve.order() at
      field_bits <= 24, which at p = 16769023 is 16.7 million modular exponentiations per
      candidate curve and will consume the whole budget on curve generation. Construct
      EllipticCurve(p, a, b) directly and use order_bsgs(). Verify each p is prime at run time and
      record the check; if any p fails, STOP and report rather than substituting a modulus.
    - >-
      REJECTION-SAMPLE THE CURVE PREDICATE IN FULL: #E prime, ordinary, non-anomalous (n != p),
      j(E) not in {0, 1728}, non-singular. Record the rejection count per cell. A rejection is a
      property of the sampler and is not evidence.
    - >-
      TARGETS ARE UNIFORMLY RANDOM. R = [r]P with r uniform in [1, q-1] from the deterministic
      seed stream, 1200 per cell. PLANTED TARGETS ARE FORBIDDEN IN THE FIT: summing five random
      factor-base points guarantees success but samples targets weighted by their number of
      decompositions, which is a different distribution. If you also run a planted diagnostic, put
      it in a separate clearly labelled block and never pool it.
    - >-
      RUN BOTH CONTROLS AT ALL THREE SIZES AND ALL THREE SEEDS, under identical instrumentation,
      the same PRS variant, the same counter, the same target count and the same session. CTRL-POS
      differs from the main arm in exactly one declared respect (planted factor base
      {x([i]P) : i = 1..L}); CTRL-NEG differs in exactly one (randomized dense chain links of the
      same per-variable degrees). Nothing else may differ.
    - >-
      RESPECT THE STOPPING RULES AND REPORT WHAT THEY STOPPED. 900 s per eliminant, 1800 s per
      cell, 7200 s total. A timeout, crash or memory exhaustion is INFRASTRUCTURE SIGNAL under
      AGENTS.md rule 5 and is NEVER reported as a negative mathematical result and never as
      evidence against H-RT1476-001. Report the exact subset completed. Do not extrapolate,
      interpolate or estimate an uncompleted cell.
    - >-
      YOU RECORD OBSERVATIONS ONLY. Do not change the status of any hypothesis, experiment,
      evidence, decision, goal or knowledge record. Do not write any ledger record. Do not write
      an evidence record. Do not declare the hypothesis supported, weakened, rejected or
      confirmed. analysis.md may state what the numbers are and how they compare to the frozen
      thresholds; it may not state what they mean for ECDLP, for the gate's status, or for any
      attack.
    - >-
      REPORT UNEXPECTED OBSERVATIONS RATHER THAN DISCARDING THEM (AGENTS.md rule 8). In
      particular, a systematic gap between deg_u of the eliminant and the enumerated support size,
      or a success rate far from L^5/(120 q), or seed-to-seed instability, are findings to record,
      not noise to smooth.
    - >-
      NEVER FABRICATE a command, an output, a timing, a statistic, a citation or a run. If a
      quantity cannot be computed, it is recorded null with the reason.
    - >-
      SCOPE EVERY SENTENCE YOU WRITE. Maximum claim tier is toy (24-bit maximum field). Nothing
      you produce is evidence for or against ECDLP hardness, prime-field ECDLP, index calculus at
      any relevant scale, or KN-OPEN-001. No live keys, deployed systems or private targets.
    - >-
      Record requested_policy executor-implementation, the resolved model identifier, the
      reasoning effort actually used, probe/verification status, fallback_used, and
      equivalence_to_requested_policy_claimed false if any substitution occurred, in every run
      manifest's inference block.

  deliverables:
    - 'experiments/EXP-RT1476-001/subresultant_meter.py - the measurement module. Measurements only; no thresholds, no verdicts, no answer key.'
    - 'experiments/EXP-RT1476-001/implementation_notes.md - the exact algebraic chain implemented, the PRS variant used and why, the GF(p) arithmetic layer and its operation-weighting, the meet-in-the-middle certification method, and EVERY place the implementation had to choose something the specification did not fix. This file is what makes the run reproducible by a third party.'
    - '27 immutable run directories experiments/EXP-RT1476-001/runs/RUN-RT1476-<arm>-p<p>-s<seed>/ each containing manifest.yaml (full AGENTS.md artifact policy block), raw-result.json, certificates.json, command.txt, environment.json, stdout.log, stderr.log.'
    - 'experiments/EXP-RT1476-001/runs/INDEX.json - the run index, written as the LAST act of the execution: for every run directory actually produced, its RUN id, arm, p, seed, per-run validity status, and the exact repository-relative path of every file it contains. It is the authoritative enumeration of the run set and the source from which TASK-20260728-002 mechanically expands the file list it must stage and hash-bind individually. A run directory absent from INDEX.json, or an INDEX.json entry with no directory behind it, is a defect.'
    - 'experiments/EXP-RT1476-001/results_summary.json - per-cell and pooled beta_deg and beta_ops with all pairwise slopes, per-seed slopes, raw counts, success rates, both control outcomes, and every null with its reason. Derived only from the raw files.'
    - 'experiments/EXP-RT1476-001/analysis.md - the fits and the threshold comparisons (which live here, never in the module), the control outcomes against INVALID-4 and INVALID-5, the deg-versus-support gap, every stopping rule that fired, every invalidation rule that fired, and an explicit statement of what was NOT measured.'
    - 'coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/tasks/TASK-20260728-001/execution_report.yaml - a compact machine-readable report: per-cell status (complete | partial | insufficient_success_subset | invalid | timeout), the fired stopping and invalidation rules, the runtime receipt, the environment versions, and a plain statement that this task changed no record status and authorized no interpretation.'

  artifact_paths:
    - experiments/EXP-RT1476-001/subresultant_meter.py
    - experiments/EXP-RT1476-001/implementation_notes.md
    - experiments/EXP-RT1476-001/analysis.md
    - experiments/EXP-RT1476-001/results_summary.json
    - experiments/EXP-RT1476-001/runs/INDEX.json
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/tasks/TASK-20260728-001/execution_report.yaml
  artifact_paths_note: >-
    Every entry is an exact repository-relative FILE path, as tools/research_dispatch.py requires
    so that the archive verifier can hash-bind each one. The first draft listed the DIRECTORY
    experiments/EXP-RT1476-001/runs/ here and the dispatcher rejected the queue before any commit;
    a directory cannot be hash-bound, which is the whole point of the rule. The run RECORDS are
    still required deliverables and are still immutable - they are enumerated by
    experiments/EXP-RT1476-001/runs/INDEX.json, which IS an exact file, and TASK-20260728-002
    expands that index mechanically to stage and individually hash-bind every run file. Declaring
    the index rather than the directory changes nothing about what must be produced.
  write_scope:
    - experiments/EXP-RT1476-001/subresultant_meter.py
    - experiments/EXP-RT1476-001/implementation_notes.md
    - experiments/EXP-RT1476-001/analysis.md
    - experiments/EXP-RT1476-001/results_summary.json
    - experiments/EXP-RT1476-001/runs/
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/tasks/TASK-20260728-001/
  write_scope_exclusion: >-
    experiments/EXP-RT1476-001/specification.yaml is EXPLICITLY EXCLUDED from this write scope
    and must not be modified, reformatted or re-saved. It is the frozen protocol.
  read_scope:
    - AGENTS.md
    - CLAUDE.md
    - docs/
    - templates/
    - harness/
    - experiments/EXP-RT1476-001/specification.yaml
    - experiments/EXP-GGM-001/
    - ledger/hypotheses/H-RT1476-001.yaml
    - ledger/decisions/DEC-20260728-001.yaml
    - ledger/decisions/DEC-20260728-002.yaml
    - inputs/idea_generation_20260718_batch2.md
    - inputs/main_research_ledger.md
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/batch.yaml
  archived_by: TASK-20260728-002
  review_required: true
  depends_on: []

  inference:
    policy: executor-implementation
    reasoning_effort: high
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
    note: >-
      Record requested_policy, the resolved model identifier, the reasoning effort actually used,
      probe status, fallback_used, and equivalence_to_requested_policy_claimed false if a fallback
      is used, in every run manifest. Never silently substitute.

  budget:
    wall_clock_seconds: 7200
    memory_gb: 4
    maximum_runs: 27

  completion_gate:
    - 'All 27 run directories exist, or every missing one is explicitly accounted for by a named stopping rule with its elapsed time recorded.'
    - 'experiments/EXP-RT1476-001/runs/INDEX.json exists and enumerates every run directory produced and every file inside it, with no directory missing from the index and no index entry lacking a directory. It is written last, from the run set as it actually is.'
    - 'Every run manifest carries the complete AGENTS.md artifact policy block, including the inference block with requested policy, resolved model identifier, probe status, fallback_used and degraded_requirements.'
    - 'No two raw-result.json files with differing inputs are byte-identical.'
    - 'Every claimed relation has a certificate in certificates.json and an independent re-verification result; zero certificates failed, or the affected cells are marked invalid.'
    - 'ops_success is either a counted integer from instrumented GF(p) arithmetic, or null with INVALID-7 and its reason recorded. It is never a wall-clock proxy.'
    - 'beta_deg and beta_ops are reported per cell, per seed, pooled, and as all pairwise slopes, each alongside its raw counts.'
    - 'Both controls ran at all three sizes and all three seeds, and CTRL-POS and CTRL-NEG outcomes are reported against INVALID-4 and INVALID-5 explicitly.'
    - 'No threshold, expected value, verdict or answer key appears in the measurement code path, and every per-run gate quantity appears in raw-result.json.'
    - 'experiments/EXP-RT1476-001/specification.yaml is byte-for-byte unchanged.'
    - 'No ledger record was written and no hypothesis, experiment, evidence, goal or knowledge status was changed.'
    - 'Every timeout, crash and memory exhaustion is recorded as infrastructure signal and nowhere described as evidence against the hypothesis.'
    - 'analysis.md states plainly what was NOT measured, and states that nothing in this run set is evidence for or against ECDLP hardness.'
  return_format: >-
    Immutable run records plus a machine-readable results summary, an implementation-notes
    document, an analysis document containing the threshold comparisons, and a compact YAML
    execution report. Observations only; no interpretation of research status.
  created_by: coordinator
  created_at: '2026-07-28'
