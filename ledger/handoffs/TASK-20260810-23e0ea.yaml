handoff:
  id: TASK-20260810-23e0ea
  recorded_at: '2026-08-10'
  goal_id: GOAL-MD5-001
  question_id: RQ-MDFIVE-6870c1
  batch_id: BATCH-46254b
  task_card: coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/task-cards/TASK-20260810-23e0ea.md
  role: validator
  from: coordinator
  to: validator
  objective: >-
    Independently verify the integrity of this batch's gate package: that both
    implementations are genuinely independent and genuinely pass the RFC 1321
    published test vectors, that the throughput measurements are reproducible
    from their recorded commands, that every KN-LIT entry's provenance level
    matches what was actually obtained, and that the quarantine firewall is
    intact in the committed tree rather than merely described.
  uncertainty_reduced: >-
    Whether the two preconditions RQ-MDFIVE-6870c1 imposes are actually
    discharged, or only reported as discharged. Every later batch of this
    campaign is priced on the answer, and a gate that passes on its own say-so is
    not a gate.
  inputs:
    - >-
      the committed implementation-pin and test-vector artifacts of
      TASK-20260810-3e0793
    - >-
      the committed acquisition package of TASK-20260810-bde128, including its
      kn-lit-manifest.json
    - >-
      BCP-1, against which the quarantine marker and certificate format are
      checked
    - the three snapshot receipts under this batch's archives directory
    - >-
      RQ-MDFIVE-6870c1 constraints, which define what discharging the gates
      requires
  constraints:
    - >-
      SC-1 FABRICATE NOTHING. No invented timing, measurement, throughput,
      citation, review verdict, model identifier or commit SHA. A field that is
      not yet knowable stays null and is named as such.
    - >-
      SC-2 CLAIM CEILING. Assert nothing about MD5 - no collision, no preimage,
      no complexity, no method ceiling, no obstruction, and no comparison
      against any published result in either direction.
    - >-
      SC-3 UNVERIFIED FIGURES STAY MARKED. Every figure not obtained in primary
      text stays marked unverified and is never cited as authority in either
      direction.
    - >-
      SC-4 A failed, halted or exhausted search is a BUDGET OUTCOME about a
      solver and NEVER evidence about MD5 (AGENTS.md rules 5 and 8). A producer
      that halted on budget is not a producer that failed mathematically.
    - >-
      SC-5 Anything not attempted is named OPEN AND UNATTEMPTED and is never
      recorded as tried, screened or negative.
    - >-
      SC-6 Change no hypothesis, question, experiment or goal status; approve no
      experiment; promote no knowledge; edit no committed record. Report
      findings; the disposition is the Coordinator's.
    - >-
      SC-7 Halt at the declared wall_clock_seconds and report the halt
      truthfully as infrastructure signal, naming the dropped work as scope
      rather than as an answer.
    - >-
      SC-8 Never select, configure, probe, contact or use Amazon Bedrock
      (AGENTS.md rule 16).
    - >-
      RE-RUN the RFC 1321 test vectors yourself against both pinned
      implementations rather than reading the producer's report of them, and
      record agreement or disagreement vector by vector. A validation that reads
      a report has validated a report.
    - >-
      CHALLENGE THE INDEPENDENCE CLAIM CONCRETELY. Two implementations that
      share a compression-function core, a vendored source file, or one upstream
      project are not independent, and a certificate re-verified under such a
      pair is re-verified by itself. State whether independence is established,
      not established, or indeterminate, and on what basis.
    - >-
      CHECK THE FIREWALL IN THE COMMITTED TREE: that no path data appears in any
      KN-LIT entry, that the quarantined payload's recorded sha256 matches the
      file, and that every path in kn-lit-manifest.json was actually staged by
      TASK-20260810-5c819b. Report whether corpus staging can in fact exclude the
      quarantine directory, or whether that exclusion is declaration-only in this
      environment - either answer is useful and the second must not be softened.
    - >-
      Write only under this task's review directory, and read the committed tree
      rather than any uncommitted working state.
  deliverables:
    - validation-report.yaml with a per-check verdict and its basis
    - an explicit independence determination for the implementation pair
    - >-
      an explicit firewall-integrity determination, including whether corpus
      staging can exclude the quarantine directory
    - >-
      a defect list, if any, stated concretely enough to be acted on without
      further interpretation
  artifact_paths:
    - >-
      coordination/goals/GOAL-MD5-001/batches/BATCH-46254b/reviews/TASK-20260810-23e0ea/validation-report.yaml
  archived_by: TASK-20260810-ccfeb4
  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 350
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
    - >-
      The RFC 1321 vectors were re-run independently and agreement or
      disagreement is recorded vector by vector for both implementations.
    - >-
      The independence determination is explicit and reasoned, not inherited
      from the producer's claim.
    - >-
      The firewall-integrity determination is explicit and states whether
      quarantine exclusion from corpus staging is enforceable or
      declaration-only.
    - >-
      Every defect is concrete and actionable, and no defect is softened into a
      caveat.
    - >-
      No status changed, no committed record was edited, and nothing was written
      outside this task's review directory.
  return_format: >-
    A summary naming the single written path, the per-check verdicts with their
    bases, the vector-by-vector re-run outcome for both implementations, the
    explicit independence determination, the explicit firewall-integrity
    determination including whether quarantine exclusion is enforceable or
    declaration-only, and the concrete defect list or its absence.
