    ARTIFACT; and that LIMB B IS NOT A SYMMETRIC 8x TEST at these cells, with only about
    1.75x headroom at bits-16 u=5. Bind it to TRAVEL WITH EVERY LIMB B READING.
  - >-
    CHANGE NOTHING ELSE. Every band edge, every null_spread entry, every branch condition
    and disposition string, identity_binomial_cut 4 with its record, frozen_absolute_band
