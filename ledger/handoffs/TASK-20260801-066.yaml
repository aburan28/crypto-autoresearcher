    every probability and interval, and every OPEN-RR052 and OPEN-LPF049-A ruling AS RULED,
    are COPIED. Prefer byte-identical copying; where a block is reformatted, state the
    normalisation.
  - >-
    DO NOT MOVE THE [1/8, 8] BAND OR THE u_star_formula. Both are hash-bound pre-datum and
    adjusting either after seeing that the uniform arm sits at 4.571 of an 8.0 ceiling
    would be textbook post-hoc band adjustment. The RTB-054-6 change is a DECLARATION and
    changes no number.
  - >-
    DO NOT RE-OPEN ANY RULED OPEN ITEM. OPEN-RR052-A, B, C and D and OPEN-LPF049-A were
    ruled by an independent session at TASK-20260801-054 and are carried as ruled,
    including OPEN-RR052-D's extension barring directional AGREEMENT from STAT-KS-DICK.
  - >-
    RE-RUN THE STOP-CONDITION CHECK against the regenerated lists - in particular confirm
    that L-1's second leg still evaluates FALSE, and record the check rather than asserting
    it.
  - >-
    RECORD, DO NOT RESOLVE, ANY NEW AMBIGUITY. Any clause admitting two readings is written
    with BOTH readings named and ROUTED TO TASK-20260801-068. You may not choose.
