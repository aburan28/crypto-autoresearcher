  - >-
    CHANGE (c) - restate V8 to match, replacing "NEITHER FROZEN PLANT FAMILY CAN PLACE MASS
    THERE" with a statement that the frozen ladder places NEGLIGIBLE MASS there at the
    frozen rungs, with the measured rate. The OPERATIVE CONTENT MUST NOT WEAKEN.
  - >-
    CHANGE (d) - ADD a LIMB B declaration per RTB-054-6, stating that u is defined at D
    while samples live on [1, p**2] with p**2/D of 0.5070 and 0.5358; that recomputing u
    against the actual sample range moves bits-16 u=6 from R = 11.5937 outside the band to
