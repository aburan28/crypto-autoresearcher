handoff:
  id: TASK-20260921-51bc02
  from: coordinator
  to: executor

  objective: >-
    Execute EXP-FROB-91ee9c specification.yaml version 1 AS AMENDED by
    experiments/EXP-FROB-91ee9c/amendments/DEC-20260921-e81e25.yaml
    (version 2): compute the ALREADY-DEFINED C2_non_stable_matched_dimension,
    C3_random_matched_cardinality and C4_matched_null_curve controls,
    UNCHANGED from their frozen design, against the SECOND eligible object
    curve of FROB-SPLIT-q11n5 (A=1, B=2, N=10061) and FROB-EQDEG-q19n5
    (A=1, B=1, N=117991) -- exactly and only these two (cell, curve) pairs.
    Reuse the two declared seeds (2026091401, 2026091402) for C2/C3 exactly
    as specified. Recompute the object arm for both curves as well, as an
    internal consistency check.

  uncertainty_reduced: >-
    Whether H-FROB-d93575's success_criterion clause (6) ("in every
    completed cell the spread of cost_ratio_neg on each of the C2, C3 and
    C4 control arms is STRICTLY SMALLER than the object arm's spread in
    that cell") is met or falsification_criterion clause (c) is triggered,
    on the ONLY curve in each of these two cells where the object arm shows
    non-trivial variation. RUN-FROB-91ee9c-7119f2 could not answer this: it
    ran the full control battery only on the degenerate curve (index 0),
    where all arms are vacuously spread=1 (EV-FROB-2fe225 J3,
    DEC-20260921-3678fc).

  inputs:
    - >-
      experiments/EXP-FROB-91ee9c/specification.yaml (FROZEN v1; read
      controls.C2_non_stable_matched_dimension,
      controls.C3_random_matched_cardinality,
      controls.C4_matched_null_curve, metrics.primary, replication.seeds
      verbatim -- do not redefine any of them)
    - >-
      experiments/EXP-FROB-91ee9c/amendments/DEC-20260921-e81e25.yaml (this
      run's authorizing amendment; defines the exact scope extension and
      the two (cell, curve) targets)
    - >-
      experiments/EXP-FROB-91ee9c/runs/TASK-20260914-7119f2/ (the completed
      first run; IMMUTABLE, read-only reference for the object-arm
      consistency check and for the field/curve construction already used
      for these cells -- e.g. fixtures.json's field modulus,
      certificates.json's curve parameters. Do NOT edit, re-run, or
      re-derive anything under this path.)
    - ledger/decisions/DEC-20260921-3678fc.yaml (the review decision naming this recheck as NA-1)

  constraints:
    - >-
      WRITE SCOPE: experiments/EXP-FROB-91ee9c/runs/TASK-20260921-51bc02/
      only. Never write to runs/TASK-20260914-7119f2/, specification.yaml,
      or any file under ledger/ other than this handoff's own status field
      if the harness requires it.
    - >-
      Use the EXACT curve parameters already recorded for these two curves
      in RUN-FROB-91ee9c-7119f2's certificates.json (FROB-SPLIT-q11n5
      A=1,B=2,N=10061; FROB-EQDEG-q19n5 A=1,B=1,N=117991) and the same
      field construction (fixtures.json). Do not re-run the object-curve
      search; these two curves are already identified and eligible.
    - >-
      C2/C3/C4 constructions are UNCHANGED from specification.yaml's
      controls list -- copy the exact design, do not reinterpret or
      simplify it. C2's non-pi-stable matched-dimension subspace: same
      lexicographic-first construction. C3's random matched-cardinality
      set: same two seeds, same negation-closed/overlap-matched
      construction. C4's matched null curve: same A'=z+a, B'=z+b
      lexicographic scan, N/2 <= N' <= 2N eligibility.
    - >-
      Object arm for these two curves MUST be recomputed (not copied) and
      MUST exactly match RUN-FROB-91ee9c-7119f2's already-recorded values
      for curve index 1 (metrics.json, cost-model.json:
      I(FROB-SPLIT-q11n5)=2055/451 with endpoints 206733/41 and 5533/5;
      I(FROB-EQDEG-q19n5)=6152/861 with endpoints 12097908/205 and
      82593/10). A mismatch is an instrument invalidation (report it as
      such per invalidation_rules IR-1..IR-9 in specification.yaml) -- do
      not silently adjust either run's numbers to agree.
    - >-
      All arithmetic exact (Python fractions.Fraction or equivalent); no
      floating point in any reported ratio (IR-1).
    - >-
      FROB-NOLATTICE-q13n5 is explicitly OUT OF SCOPE for this run (see
      DEC-20260921-e81e25's rationale: its achievable partition lattice is
      {0,4} on every curve by construction, a field-level fact already
      reconfirmed for both its curves in RUN-FROB-91ee9c-7119f2, so a
      second-curve battery there cannot discriminate anything). Do not
      compute it.
    - >-
      FROB-EXT-q13n7 is out of scope; it remains not_run_resource per SR-4,
      untouched by this amendment.
    - >-
      Reuse the memory/worker caps unchanged (maximum_memory_gb: 8,
      maximum_workers: 1). Advisory wall-clock/CPU estimates may be null.

  deliverables:
    - >-
      experiments/EXP-FROB-91ee9c/runs/TASK-20260921-51bc02/manifest.yaml
      (with a complete run.artifacts hash-binding dict -- bytes+sha256 for
      EVERY declared artifact except the manifest itself, matching the
      corrected precedent in runs/TASK-20260914-7119f2/manifest.yaml, not
      its own first, incomplete draft)
    - >-
      experiments/EXP-FROB-91ee9c/runs/TASK-20260921-51bc02/metrics.json
      (measured/modelled/derived_from_measured, mutually exclusive per
      IR-6)
    - experiments/EXP-FROB-91ee9c/runs/TASK-20260921-51bc02/cost-model.json
    - experiments/EXP-FROB-91ee9c/runs/TASK-20260921-51bc02/certificates.json
    - >-
      experiments/EXP-FROB-91ee9c/runs/TASK-20260921-51bc02/report.md,
      stating explicitly, for each of the two (cell, curve) pairs: the
      object-arm spread, each of C2/C3/C4's spread, whether C2/C3/C4's
      spread is strictly smaller than the object arm's, and the object-arm
      consistency check result against RUN-FROB-91ee9c-7119f2
    - >-
      implementation code, checker code (fresh or extending the prior
      run's, Coordinator's choice, but the checker must not import the
      driver, per C8), stdout.log, stderr.log, command.txt,
      environment.json, raw-result.json, fixtures.json (or a pointer to the
      reused one)

  artifact_paths:
    - experiments/EXP-FROB-91ee9c/runs/TASK-20260921-51bc02/

  archived_by: TASK-20260921-23341e

  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false

  budget:
    wall_clock_seconds: null
    memory_gb: 8
    maximum_runs: 1

  completion_gate:
    - manifest.yaml exists with a complete run.artifacts hash-binding dict
      for every declared artifact except itself
    - object arm for both curves reproduces RUN-FROB-91ee9c-7119f2's
      recorded curve-index-1 values exactly, or the mismatch is reported as
      an instrument invalidation
    - C2, C3 (both seeds) and C4 spread computed and reported for both
      (cell, curve) pairs, with an explicit strictly-smaller/not-strictly-
      smaller verdict per pair
    - report.md and metrics.json present with measured/modelled/
      derived_from_measured kept separate
    - isolated snapshot archive commit made under TASK-20260921-23341e and
      its post-commit receipt verified before this handoff is marked
      complete

  return_format: >-
    Report: per (cell, curve) pair, the object-arm spread and each of
    C2/C3/C4's spread with the strictly-smaller verdict; the object-arm
    consistency check result; any instrument invalidation encountered; and
    the exact paths and hashes of every artifact written.

  review_plan: null
