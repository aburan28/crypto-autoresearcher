  constraints:
  - Root Coordinator implements this correction directly. Own only the eight exact new artifacts. You are not alone;
    preserve all predecessor source, receipts, reviews, claims and unrelated state. No identifier remap, scientific
    execution or hypothesis transition.
  - Base the new package on all eight TASK-20260910-89d2df artifacts at efe06c32858aff43a22698b260e872916e394846
    and complete review TASK-20260910-1c7aa0 archived at f7890ec2ef09c7e1e6d86d8712b946f6ff4040f4. Correct V-01/V-02/V-03
    and the adjacent descriptor/cleanup exception families below. Preserve all original F-01 through F-11, NF-01
    through NF-05 and IR-01 through IR-04 obligations, not merely the three latest lines.
  - 'NF-01: Join the actual container report producer and host consumer across the complete payload, using crypto.autoresearch.group_oom_container_result.v2
    as the one current wire schema. Check every field the host consumes against actual production serialization,
    including failure reports. Extract a pure serializer if useful, used by actual container production code. The
    positive integration test must feed actual producer output to actual host parsing through injected host commands;
    no hand-written substitute with the desired schema. Wrong schema, malformed/missing consumed fields and false
    completion must fail closed.'
  - 'NF-02: Cleanup must disable only helper-enabled memory delegation before migrating the supervisor into the
    non-root parent, then remove the owned supervisor subgroup. Preserve owned worker/helper termination/reap, primary
    error and cleanup observations. Exercise cgroup-v2 no-internal-process semantics through an injected stateful
    control that refuses the old ordering; verify exact safe order and all failure paths. No real cgroup operation.'
  - 'NF-03: Carry the generated nonce through full create-to-inspect validation. Require the exact expected task
    label, nonce label, full containerID and intended identity before payload copy/start and ownership-dependent
    cleanup. Correct, missing and mismatched nonce controls are required. A mismatched identity never licenses mutation
    of an unverified foreign container. Do not add privileges or broad-name cleanup.'
  - 'NF-04: Read back the supervisor subgroup membership after migration and before delegation or worker release,
    and preserve explicit membership evidence at the final appropriate pre-cleanup boundary. Require the expected
    own PID and reject empty/misdirected/foreign membership. Parent emptiness or process liveness alone is insufficient.
    Keep existing worker/auxiliary membership acknowledgement and baseline-to-final counter requirements.'
  - 'NF-05: Descriptor-relative child enumeration must propagate or explicitly fail closed on stat OSError, preserving
    the affected path/error. It must not convert an uninspectable child into absence. Test PermissionError, disappearing
    entries and another OSError while preserving valid enumeration and descriptor cleanup. Never inspect or mutate
    live cgroup paths.'
  - Keep the cap-drop ALL plus SETUID/SETGID-only profile. No CAP_KILL addition. If inner signalling cannot complete
    under that profile, retain failed classification and exact verified outer-container containment; do not report
    successful inner cleanup. Keep all frozen memory/swap/group configurations, counter-delta classifications, readiness
    ordering, bounded polling and outer-supervisor survival requirements.
  - 'No Docker CLI/API, container creation/start, live mount/cgroup read/write, privilege change, migration or pressure
    body execution. Inject those observations. Bounded benign POSIX pipe/fork/barrier/drain/wait/reap fixtures remain
    allowed: at most32totalstarts across all attempts, at most2concurrent,3second lifetime,1MiBdeliberate payload
    per fixture; retain every PID,terminal/reap outcome and descriptor disposition.'
  - At most768 cumulative fixed synthetic controls in this successor,including failures/reruns; each complete suite<=192,reserve
    one complete final suite. Preserve all120 prior intended controls and add every named construction in the bound
    preparation, expanding parameterized cases into separate registry entries. Ten seconds/case and1800aggregate
    executed-check wall/CPU are process watchdogs; one checker,2GiB sampled RSS,nominal<=100ms cadence, no RLIMIT_AS
    or hard-kernel-limit claim. This prospectively replaces the prior task's512/128 checking envelope only; no scientific
    protocol/sample/threshold changes.
  - Before every invocation reserve a unique temporary attempt directory and exact checker/source bytes. Preserve
    full outer tool response/session/polls/terminal exit and nested command,UTC,stdout,stderr,allcases and actual
    resources. Never use canonical check-receipt.json as an attempt sink. Create canonical receipt once after all
    intended attempts terminate. No overwritten failures, guessed outer exit, reconstructed prior custody or accounting
    restart.
  - Current protocol-binding/report metadata must explicitly distinguish current task/source, original specification,
    prior failed producer and historical review. Use one unambiguous current-source map. Bind the real tested source
    hashes, actual authority/claim and completed receipts without self-hash cycles; implementation_commit:null until
    actual Coordinator snapshot. Unknown resolved model stays null/unverified.
  - Historical251cases/15childstarts remain summary-only in their original failed source version. The later120/120
    producer suite, its five real benign children and the complete independent review remain immutable with their
    original evidence scope. No correction retrovalidates a missing historical observation. Return eight exact hashes;
    snapshot and fresh independent complete source review precede any live handoff.
  - 'IR-01: Use one current TASK_ID for Docker name and task labels, including lowercase name derivation. Preserve
    full ID/nonce checks and never rewrite historical source IDs. Test actual generated create argv, current label/name
    and all mismatch refusals.'
  - 'IR-02: Every owned child removal must receive the originally created handle. Compare its open descriptor device/inode
    and direct-child relationship against the reopened handle and name boundary before removal; refuse replacement,
    closed/unowned handles, population, unexpected errors and identity drift without removing the substitute. Apply
    to worker and supervisor. Preserve descriptor dispositions and cleanup order. Document the residual race against
    a privileged concurrent namespace mutator; checks do not imply atomic immunity. All cgroup/file operations are
    injected, never live.'
  - 'IR-03: Persist an attempted command record before transport invocation, including argv, UTC start, timeout
    and stdin length/hash. Preserve terminal return or exact launch/transport exception, raw output bytes before
    decoding, known PID/terminal information and unavailable facts. Generic transport exceptions imply unknown process
    state unless actual transport evidence establishes otherwise. Popen failure never fabricates exit or empty output.
    Preserve original and cleanup failures. On timeout, retain cumulative communicate output without duplicating
    partial prefixes. Tests inject launch failure, generic transport failure, invalidUTF8, timeout output and cleanup
    failure, plus normal success.'
  - 'IR-04: Barrier-write failure remains the primary error when finalize also fails; separately retain the secondary
    cleanup failure and real terminal/descriptor uncertainty. Test barrier failure with successful and failed cleanup,
    and ordinary successful release. Journal every actual fixture child PID immediately on creation and finalize
    in finally before failing assertions.'
  - Use every mandatory construction in coordination/experiment-reserve/BATCH-635652/preparations/DEC-20260910-d066bb.json
    plus the three independently archived V counterexamples. Preserve all120 intended existing controls; explain
    any expectation corrected because it encoded a bug. Freeze every distinct named case, exact construction and
    expected predicate before the first suite. The new192-per-suite/768-cumulative envelope applies to this task;
    parameterized controls count separately.
  - Any checker/monitor invocation uses explicit repo and exclusive pre-reserved attempt/log/source paths. require_escalated
    is required for scoped owned-process monitoring when needed; no broader queries or kills. Retain every raw stream
    and outer tool response/session/exit before parsing. Do not create canonical receipt until every intended attempt
    terminates. A one-sample short run is described exactly, not hard-limit success.
  - 'NE-01 descriptor ownership: track each successful open immediately, including a next component opened before
    closing the previous descriptor. On every post-open failure attempt safe cleanup of exactly owned handles, preserve
    the original error and every close/rollback error, and expose unknown disposition. Do not retry a close solely
    by a stale descriptor integer after an exception may already have closed it. Apply across child open, relative
    traversal, post-open root validation and read/write helpers. Do not weaken no-follow, mount, exact identity,
    population or path confinement checks.'
  - 'NE-02 error propagation: primary and secondary facts must survive the actual adapter-to-supervisor cleanup
    and serialization path, not merely Python exception chaining or str(). A refusal followed by a close failure
    remains a refusal with separately retained descriptor uncertainty. Successful name removal followed by close
    failure retains both known removal and incomplete cleanup. Preserve original/current handles and final name
    checks, and the declared residual privileged-mutator race boundary.'
  - 'NE-03 host finalization: catch exact verified-ID kill/rm launch/communication/transport/cleanup exceptions
    inside run_case. Keep the already appended attempted-command record and raw observations, distinguish unknown
    process state from known not-started/terminal facts, retain existing primary errors and subsequent cleanup failures,
    continue only safe remaining exact-ID cleanup, set terminal timestamps and return a failed HostOutcome. Never
    mutate an unverified identity or fabricate successful removal/cleanup.'
  - Fault-injected descriptor tests must intercept the complete relevant OS interface; synthetic FD integers must
    never reach real close/stat calls. Existing bounded benign POSIX fixtures remain governed by their unchanged32totalstarts/2concurrent/3second/1MiB
    limits, immediate PID and descriptor journals, and finally-based reaping. All Docker/cgroup/privilege observations
    remain injected.
  - All checker,registry,compile or producer diagnostic invocations need an exclusive pre-reserved attempt and exact
    source/argv/raw log/PID/case/CPU/wall/RSS/outer tool custody. Use require_escalated for scoped owned-process
    monitoring. Preserve failures before parsing and create canonical receipt once after all intended attempts terminate.
    No unrecorded dry runs or post-receipt hidden checks.
