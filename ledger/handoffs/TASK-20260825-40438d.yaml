      completion gate exists to prevent recurring.
    - origin/main as of this pass, for the pre-archive merge.
    - tools/validate_ledger.py and tools/research_dispatch.py.
  constraints:
    - >-
      DO NOT ARCHIVE UNTIL THE PRODUCER HAS RETURNED A TERMINAL RESULT. FILE PRESENCE IS NOT
      PRODUCER COMPLETION: a producer that has written all its declared paths may still be
      revising them. CORR-20260825-3105b9 records exactly this failure on
      GOAL-SCURVE-51437e -- snapshot commit e9ebf43b9d6e bound an INTERMEDIATE state of
      TASK-20260824-eaf0af's task report because the gate "all declared artifacts exist on
      disk" was evaluated and the gate "run only after the producer has a completed valid
      receipt" was not; a superseding snapshot was required and the correction records the
      cause as an ORCHESTRATION ERROR AND NOT A PRODUCER FAULT. That correction also records
      that a coordinator subagent CANNOT SELF-ENFORCE THIS, because under the claude_code
      binding it has no shell and cannot archive at all: THE GATE IS HELD BY WHICHEVER SESSION
      PERFORMS THE STAGING, and it is written here so that session cannot miss it.
    - >-
      RUNS ALONE. No other task may be running concurrently, and no independent review may
      start before this commit exists and is verified.
    - >-
      STAGE ONLY THE DECLARED PATHS. A scope-expanding commit is an evidence-integrity failure,
      not a convenience. If something outside the declared set must be committed, it is
      disclosed in `staged_not_in_binding_set` and named, never folded in silently.
    - >-
      DO NOT BIND dispatch_queue.json BY CONTENT, IN THIS OR ANY ARCHIVE OF THIS BATCH (BR-12).
      A dispatch queue is the one file in a batch that MUST change after the snapshot, because
      every task-state advance rewrites it; BATCH-efcae7's snapshot bound its own queue and made
      the binding permanently un-reconcilable. The queue is STAGED and COMMITTED and is
      DISCLOSED in `staged_not_in_binding_set` with this reason.
    - >-
      MERGE origin/main, NEVER REBASE. Rebasing rewrites the commits research artifacts were
      archived in. Record the base commit checked and the merge outcome in the receipt. A SYNC
      CONFLICT INSIDE AN IMMUTABLE RECORD IS NEVER RESOLVED BY PICKING A SIDE OR BY EDITING THE
      RECORD: it is a new superseding record under a new id.
    - >-
      SUBJECT-LINE-ONLY COMMIT MESSAGES FROM THIS POINT UNTIL THE REVIEW ROUND CLOSES (BR-11).
      No findings, verdicts, mechanisms or integers in any commit body, PR description, bus
      message or branch name while a round is open, and the same applies to anything a
      concurrent agent could read. This is the adopted mitigation for DEC-20260824-af6d5c PD-1,
      where the driving session leaked validator findings to the red team through a commit
      message body in a shared worktree.
    - >-
      DO NOT INTERPRET ANY PRODUCER RESULT and record no research verdict. THIS TASK ARCHIVES;
      IT DOES NOT REVIEW. In particular it does not adjudicate whether the dependency graph
      reproduces the pre-registered partition, and it does not state what the off-diagonal count
      means.
    - >-
      RECORD ONLY CHECKS THIS SESSION ACTUALLY RAN, WITH THEIR VERBATIM OUTPUT. Never record a
      command that was not executed. Any scalar this receipt binds is either MEASURED by this
      session or quoted WITH ITS PROVENANCE AND MARKED UNVERIFIED -- PD-3 and CORR-20260824-cc2d27
      record the concrete cost of the alternative: a defective producer integer propagated two
      hops into Coordinator artifacts and reached a reviewer's instructions.
    - >-
      DO NOT READ coordination/goals/GOAL-MD5-001/quarantine/** by any route and attest
      non-reading with the mechanism named.
    - >-
      IF THE PRODUCER SPENT A CHARGED RUN, SAY SO IN THE RECEIPT AND DO NOT SMOOTH IT OVER.
      BR-1 sets this batch's charged-run count to zero; a run directory, RUN-* identifier or
      manifest appearing under the producer's path is a DECLARED DEVIATION, is reported as such,
      and its files are disclosed in `staged_not_in_binding_set` rather than quietly bound.
    - >-
      DO NOT FLIP ANY TASK STATE, DO NOT WRITE ledger/goals/GOAL-DIFFP-84d641.yaml, AND DO NOT
      OPEN THE REVIEW ROUND. The goal head still names BATCH-efcae7 while this batch runs; that
      is declared and temporary (batch.yaml `artifact_ownership_note`) and is corrected by this
      batch's ledger close, not here.
