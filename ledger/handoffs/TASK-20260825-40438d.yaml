    SNAPSHOT-ARCHIVE THE EXACT TASK-20260825-ba07db PACKAGE UNDER A content_first BINDING,
    ALONE, AFTER THAT PRODUCER HAS RETURNED A TERMINAL RESULT AND BEFORE ANY INDEPENDENT
