handoff:
  id: TASK-20260813-8a872d
  from: coordinator
  to: coordinator
  goal_id: GOAL-ECDLP-001
  sub_goal_id: SG-ECDLP-002
  question_id: RQ-ECDLP-002
  hypothesis_id: H-ISOU-c5bfea
  experiment_id: EXP-ISOU-2ac81f
  batch_id: BATCH-009b1b
  decision_id: DEC-20260813-d61a99
  archives_task_id: TASK-20260813-e183e6

  status: written_not_dispatched
  status_note: >-
    Written and carded. NOT DISPATCHED. This is the LEDGER archive of the
    BATCH-009b1b pair and it runs ALONE, after the independent Validator report
    exists, never concurrently with the snapshot archive TASK-20260813-619d9c
    and never alongside another agent in this worktree.

  archive_kind: ledger

  objective: >-
    After the independent Validator verdict exists, verify the census run set's
    VALIDITY first, then record the narrowest ledger disposition that the verdict
    and the run set actually support -- evidence EV-ISOU-7c6405, decision
    DEC-20260813-61e8a3, and the BATCH-009b1b checkpoint -- and commit them in
    one isolated ledger archive.

  uncertainty_reduced: >-
    What, if anything, the census establishes about obstruction 4 of
    EV-ECDLP-b3e847 -- within-class uniformity -- within its tested scope, and
    whether this batch closes, returns to the Executor with defects, or calls for
    replication.

  declared_unwritten_records: >-
    EV-ISOU-7c6405 AND DEC-20260813-61e8a3 ARE PRE-ALLOCATED, VERIFIED-FREE IDS
    DECLARED AS DESTINATIONS AND DELIBERATELY NOT YET WRITTEN. Naming an unwritten
    record in a queue's declared paths is correct and is what makes the archive
    verifiable; AUTHORING ITS CONTENT BEFORE THE RUN AND THE REVIEW EXIST WOULD BE
    FABRICATING THE RESULT OF AN EXPERIMENT NOBODY HAS RUN (AGENTS.md rule 9).
    This task writes them on the merits of the run set and the verdict, or it
    writes no evidence record at all and returns the run set to the Executor.

  inputs:
    - >-
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-009b1b/reviews/TASK-20260813-e183e6/review-report.yaml
      -- the independent Validator report and its terminal verdict, including its
      four gate findings: null-object separation, class closure versus mere
      termination, Q1/Q2 coordinate-regime separation, and certificate-checker
      independence.
    - >-
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-009b1b/archives/TASK-20260813-619d9c/snapshot-receipt.json
      -- the immutable commit the review bound to.
    - >-
      experiments/EXP-ISOU-2ac81f/runs/ and
      experiments/EXP-ISOU-2ac81f/specification.yaml -- the run set and the frozen
      standard it is judged against.
    - >-
      ledger/decisions/DEC-20260813-e0077d.yaml -- the approval, whose recorded
      RESOLUTION FLOOR and NULL-OBJECT STRENGTH limitation must appear in the
      evidence record's boundaries rather than being rediscovered or omitted.
    - >-
      ledger/evidence/EV-ECDLP-b3e847.yaml -- the closure this census audits. It
      is cited, not edited; obstruction 4's status changes only by a new record.
    - >-
      ledger/decisions/DEC-20260813-d61a99.yaml -- this batch's opening decision,
      including the unresolved batch-accounting condition, which no result here
      resolves.
    - >-
      templates/research-records.md and docs/claims-and-verification.md -- record
      schemas, claim tiers and the solution-certificate requirement.

  constraints:
    - >-
      RUN ALONE, AFTER THE REVIEW. Stage only the declared paths. Never ask two
      workers to commit in one shared worktree.
    - >-
      VERIFY VALIDITY BEFORE INTERPRETING ANYTHING: expected run count,
      schema-complete manifests, seed integrity, raw-versus-summary agreement,
      control comparability, null-object separation, and the class-completeness
      gate. AN INVALID OR INCOMPLETE RUN SET IS NOT EVIDENCE: it goes back to the
      Executor with concrete defects listed, and NO EVIDENCE RECORD IS WRITTEN AT
      ALL in that case.
    - >-
      A RUN WHERE THE DIFFERENT-ORDER NULL OBJECT FAILED TO SEPARATE CONTRIBUTES
      NO Q1 OR Q3 RESULT IN ANY FORM, including as preliminary, partial or
      indicative. That gate is a stop, not a caveat.
    - >-
      A RUN WHOSE WALK MERELY TERMINATED rather than closing on
      h(disc(End(E_0))), computed independently of the walk, is an incomplete
      subgraph and supports NO "no member is cheaper" statement, which is a claim
      about a complete class or nothing.
    - >-
      CLAIM DISCIPLINE IS UNCHANGED AND IS NOT RENEGOTIATED AFTER SEEING THE
      OUTCOME: claim_tier is toy and nothing above toy may be asserted;
      dominated_by is Pollard rho at exponent 1/2 with sota_delta
      not_applicable on every axis; asymptotic_claim stays null, so the four
      asymptotic-claim promotion gates are NOT engaged and must not be reported
      as satisfied; P-256 is the shape imitated, not the object measured, and no
      statement about P-256 is licensed. Changing a success criterion after
      observing outcomes requires a versioned protocol_amendment and nothing
      less.
    - >-
      SCOPE EVERY CONCLUSION to the tested primes, the tested class, the isogeny
      degrees, the seed schedule, the solver and its parameters, the budget and
      the coordinate regimes, and state the transfer assumptions explicitly. The
      recorded RESOLUTION FLOOR belongs in the evidence record's boundaries -- a
      null on Q1 means "no effect above the frozen seed band at the tested
      scale", NEVER "no effect" -- together with the NULL-OBJECT STRENGTH
      limitation from DEC-20260813-e0077d.
    - >-
      A TIMEOUT, CRASH, BUDGET EXHAUSTION OR IMPLEMENTATION FAILURE IS
      INFRASTRUCTURE SIGNAL AND NEVER NEGATIVE MATHEMATICAL EVIDENCE (AGENTS.md
      rule 5). A budget-exhausted 24-bit census is reported as exactly that, and
      the completed 20-bit censuses stand on their own.
    - >-
      reject_scoped ON A SINGLE UNREPLICATED EMPIRICAL-ONLY RUN SET IS FORBIDDEN;
      use `weaken` plus replication. Before any decision that a theory is wrong,
      archive the strongest checkable refutation artifact the result admits --
      counterexample certificate, then derivation note, then a declared
      `empirical_only` basis -- and archive it BEFORE the decision that relies on
      it. An undeclared basis is the failure, not the absence of a proof.
    - >-
      NO STATUS MOVES BEYOND WHAT THE EVIDENCE SUPPORTS ON ITS MERITS, and
      H-ISOU-c5bfea does not move at all on an invalid or inadmissible run set.
      Obstruction 4 of EV-ECDLP-b3e847 changes status only by a new record, never
      by editing that one.
    - >-
      FILL knowledge_promotion. Promote a KN-FIND only on `support` or
      `reject_scoped` backed by `replicated` or `strong` evidence; otherwise
      record a concrete `not_warranted` reason. A promoted entry and the
      regenerated knowledge/INDEX.md ride in THIS SAME ledger commit, following
      the /curate-knowledge conventions.
    - >-
      THE COMMIT MESSAGE MUST LITERALLY CONTAIN TASK-20260813-8a872d AND EVERY ID
      IN the archive block's record_ids as plain substrings, INCLUDING
      EV-ISOU-7c6405 AND DEC-20260813-61e8a3. A decision id alone is not enough.
    - >-
      FETCH origin/main AND MERGE IT into the branch before generating; MERGE,
      NEVER REBASE. Push after, and open or refresh the PR against main naming the
      new records. Never resolve a sync conflict by editing a record -- stop and
      create a superseding record.
    - >-
      CHECKPOINT THE GOAL RECORD after this ledger archive and PRESERVE EXACTLY
      ONE next action. A scoped rejection, an invalid run or an exhausted batch
      ends this task, not GOAL-ECDLP-001. Do not use the goal head to reopen the
      batch-accounting question or the deferred BATCH-080a9c SYC successor; both
      remain recorded and deferred.
    - >-
      NOTHING HERE RESOLVES THE CAMPAIGN'S UNEVALUABLE BATCH COUNTER OR ITS
      UNTRACKED WALL CLOCK, and no completion criterion of GOAL-ECDLP-001 is met
      or approached by this batch. No closure quorum is claimed.
    - >-
      No fallback, no degradation, no Bedrock (AGENTS.md rule 16).

  deliverables:
    - >-
      ledger/evidence/EV-ISOU-7c6405.yaml -- written ONLY if the run set is valid
      and admissible: scoped to the tested parameters, claim_tier toy,
      dominated_by Pollard rho at exponent 1/2, with the resolution floor and the
      null-object strength limitation in its boundaries and its strength stated
      honestly.
    - >-
      ledger/decisions/DEC-20260813-61e8a3.yaml -- the disposition decision,
      citing the experiment, run, review and evidence ids, with
      knowledge_promotion filled and limitations stated.
    - >-
      ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-009b1b.yaml -- the batch
      checkpoint, preserving exactly one next action and recording that no
      completion criterion was met.
    - >-
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-009b1b/archives/TASK-20260813-8a872d/snapshot-receipt.json
      -- the archive receipt with commit_sha, parent_sha, declared paths and their
      digests, the origin/main base checked and the merge outcome.

  artifact_paths:
    - ledger/evidence/EV-ISOU-7c6405.yaml
    - ledger/decisions/DEC-20260813-61e8a3.yaml
    - ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-009b1b.yaml
    - >-
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-009b1b/archives/TASK-20260813-8a872d/snapshot-receipt.json

  archived_by: TASK-20260813-8a872d
  archived_by_note: >-
    Self-archiving. Its source is the review TASK-20260813-e183e6 alone: the
    producer TASK-20260813-4bee82 is claimed by the snapshot archive
    TASK-20260813-619d9c and belongs to exactly one archive's source_task_ids.
    Depending on the snapshot is a dependency, not an assignment.

  review_required: false
  review_note: >-
    This task records the disposition of a review that has already happened. Its
    own inputs are the independent Validator report and the immutable run set;
    the discipline that constrains it is written into its constraints and gate
    above.

  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false

  budget:
    wall_clock_seconds: 1800
    memory_gb: 1
    maximum_runs: 1
    budget_note: >-
      Disposition and archive budget only. No experiment run and no census
      compute is authorized by this task; maximum_runs counts this act itself.

  completion_gate:
    - >-
      Run-set validity is adjudicated BEFORE any interpretation, and an invalid or
      incomplete set returns to the Executor with concrete defects and produces NO
      evidence record.
    - >-
      Every conclusion is scoped to the tested parameters and cites the
      experiment, run, review and evidence ids supporting it, with the resolution
      floor and the null-object strength limitation stated in the boundaries.
    - >-
      claim_tier is toy, dominated_by is Pollard rho at exponent 1/2,
      asymptotic_claim is null, and no claim above toy tier and no statement about
      P-256 appears anywhere.
    - >-
      No hypothesis, experiment, question or goal status moves beyond what the
      evidence supports on its merits, and none moves at all on an inadmissible
      run set.
    - >-
      knowledge_promotion is filled with either a promoted KN-FIND (with the
      regenerated knowledge/INDEX.md in this same commit) or a concrete
      not_warranted reason.
    - >-
      The checkpoint preserves exactly one next action, and the archive verifier
      and the ledger validator accept the exact commit, whose message names
      TASK-20260813-8a872d and every record id including EV-ISOU-7c6405 and
      DEC-20260813-61e8a3.

  return_format: >-
    The archive receipt, plus a plain listing of the committed paths, the commit
    and parent shas, the origin/main base checked and the merge outcome, the
    terminal decision taken with its evidence strength, and the one preserved next
    action. If the run set was inadmissible, say so plainly, list the defects
    returned to the Executor, and state that no evidence record was written.
