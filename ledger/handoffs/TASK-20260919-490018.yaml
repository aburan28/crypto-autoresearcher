  constraints:
    - >-
      Only after run-binding-stage0-v5-retry-20260919.json's plan_sha256 and
      canonical_initial_handoff.sha256 are FILLED (not PENDING) and this
      handoff and trial-plan-stage0-v5.json are committed and pushed,
