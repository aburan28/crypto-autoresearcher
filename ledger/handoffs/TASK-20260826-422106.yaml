  objective: >-
    Verify the integrity of the replication package against its frozen contract, not its
    interestingness. THE COMMITTED REVIEW PLAN ASSIGNS THIS TASK'S THREE JOINTS AND IS
    AUTHORITATIVE OVER THIS SKETCH. Coordinator's intent at opening:
    (V-a) REPRODUCTION, FROZEN IDENTITY AND RUN REGISTRATION -- cold-re-run the deterministic
    outputs from the declared seeds to EXACT INTEGER agreement; confirm CTL-FROZEN-4's criterion
    set excludes this contract's own required artifacts and is otherwise complete; confirm the
    eight declared seeds with no ninth; and independently confirm whether the producer's runs are
    discovered by tools/validate_ledger.py and accepted by check_run, reporting the verbatim
    output either way.
    (V-b) IS THE FORCED SET WHAT THE RULE AND THE GRAPH PRODUCE -- re-derive the per-instrument
    forced set yourself from the committed graph and the contract's written statement, per
    instrument and per primitive and under BOTH composition orders; check CTL-FORCE-PI's identity
    side against the committed six cells cell by cell with each forcing edge; check that no
    forcing edge cited is `empirical_only` or on a constant column; and check that every
    per-primitive field was COMPUTED per primitive rather than computed once and indexed.
    (V-c) THE DENOMINATORS AND THE SCOPE -- is the denominator DERIVED rather than inherited from
    RT-J8-4's 30; does adjudicated plus excluded reconcile per instrument and per primitive; does
    every excluded cell carry a forcing edge; do the degenerate arms report their PINNING field
    honestly; is O-E reused faithfully against j8_results.json; and is anything reported as a
    fraction, as a pass, as a margin, or without its primitive scope and census completeness?
  uncertainty_reduced: >-
    Whether the reported per-instrument forced sets, re-admitted cell tables and consistent-pair
    results are what the committed code and the contract's stated rule produce from the declared
    seeds; whether the denominator was derived or inherited; and whether every count is scoped to
    exactly the cells it adjudicated.
