      WRITE AN `admissibility_ruling` BLOCK SEPARATE FROM YOUR JOINT FINDINGS, answering
      completion criterion 4's five conjuncts -- controls; certificates; census provenance;
      equivalence-generator verification status; and the absence of uncharged preprocessing,
      memory, oracle or randomness assumptions -- each as ADMIT, DO NOT ADMIT, or NOT IN MY SCOPE
