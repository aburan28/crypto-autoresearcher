    - 'Do not read coordination/goals/GOAL-MD5-001/quarantine/** and attest non-reading BY MECHANISM rather than by intent.'
    - 'AN INFRASTRUCTURE FAILURE IN YOUR OWN RE-RUN IS INFRASTRUCTURE SIGNAL, not a finding against the producer.'
