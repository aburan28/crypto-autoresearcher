handoff:
  id: TASK-20260731-014
  from: coordinator
  to: idea-generator
  goal_id: GOAL-FAEST-001
  batch_id: BATCH-001
  objective: >-
    Produce exactly three schema-complete IDEA-20260731-019, IDEA-20260731-002..003 proposals for
    RQ-FAEST-001 under object-first discipline: each names the exact soundness
    or reduction object being attacked (a consistency-check error term, the
    VOLEitH grinding exponent, the QROM Fiat-Shamir extractor loss, or another
    named reduction link), never 'attack FAEST', and each writes down the
    matched AES baseline cost it claims to challenge.
  inputs:
    - KN-LIT-7637, KN-LIT-7638, KN-LIT-7619..7620 from the verified snapshot TASK-20260731-013 (read the committed copies)
    - RQ-FAEST-001.yaml and GOAL-FAEST-001.yaml (scope, claim_tier_ceiling, pause conditions)
    - docs/inventor-protocol.md and docs/target-result-profile.md (obligations and target shape)
    - agents/idea-generator.md (IDEA record schema)
  constraints:
    - >-
      OBJECT-FIRST: every proposal must name the exact mathematical or protocol
      object it attacks. A proposal whose mechanism is 'an attack on FAEST'
      without a named object is rejected as underspecified by review.
    - >-
      MATCHED BASELINE: every proposal must write down the best known AES
      key-recovery cost AND the best known VOLEitH/Fiat-Shamir soundness attack
      cost at the same parameter set and cost convention it will be compared
      under. No experiment is designed until that baseline is written down.
    - Exactly three IDEA records, schema-complete per agents/idea-generator.md, plus ideation_report.md.
    - >-
      Every idea carries explicit predictions with metric + direction, a minimal
      discriminating test with controls and confounders, falsification
      conditions, scope limits, and numbered heuristic assumptions with a
      validation route each.
    - >-
      Novelty discipline: grep knowledge/ and ledger/ for prior art; set
      novelty_status honestly; where a mechanism is known, say it is a
      replication/extension lane, not a breakthrough.
    - No hypothesis, experiment, evidence, or decision record; no official state change. Proposals only.
    - >-
      Record requested policy, resolved model identifier, fallback status, and
      session independence in ideation_report.md.
    - >-
      Do not fabricate commands, outputs, timings, statistics, citations, or
      successful runs; an unverified number is labeled unverified.
  deliverables: [IDEA-20260731-019.yaml, IDEA-20260731-002.yaml, IDEA-20260731-003.yaml, ideation_report.md]
  artifact_paths:
    - ledger/proposals/IDEA-20260731-019.yaml
    - ledger/proposals/IDEA-20260731-002.yaml
    - ledger/proposals/IDEA-20260731-003.yaml
    - coordination/goals/GOAL-FAEST-001/batches/BATCH-001/tasks/TASK-20260731-014/ideation_report.md
  archived_by: TASK-20260731-015
  inference:
    policy: research-deep
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 2700
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
    - >-
      Three schema-complete IDEA records exist; each names an exact attack
      object and writes down the matched AES baseline cost.
    - >-
      Each idea has predictions with metric+direction, a minimal discriminating
      test with controls and confounders, falsification conditions, scope
      limits, and numbered heuristic assumptions with validation routes.
    - No hypothesis, experiment, evidence, or decision record was created, and no official state changed.
  authorized_by: DEC-20260731-020 (batch decision recorded at BATCH-001 ledger archive)
  recorded_by: coordinator
  recorded_at: '2026-07-31'
