handoff:
  id: TASK-20260908-42e809
  from: coordinator
  to: executor
  objective: 'In one bounded task, discharge global precondition P1 / successor requirement SR1 of the
    frozen audit-plan.yaml for the base-point lane (L3) by raw-fetching RFC 7748 and RFC 8032 as plain
    text via curl (NOT a summarizing fetch tool), computing sha256 of each raw document, and byte-exact
    transcribing the values L3 needs (p, the Montgomery coefficient A, the Edwards coefficient d, both
    curves'' base-point coordinates, base-point order L, and cofactor) directly from the raw bytes with
    recorded line/byte citations -- then, using ONLY those freshly-transcribed, hash-pinned values (never
    the quarantined digit strings in parameter-capsule.yaml section 5, ''unverified_retrieval_transcript'',
    which are USE_PROHIBITED), execute lane L3 exactly as specified in audit-plan.yaml: enumerate every
    sourceable candidate base point, certify each is on-curve, non-identity, of order dividing l via l*B=O,
    and that h*l is the unique multiple of l in the Hasse interval [p+1-2*sqrt(p), p+1+2*sqrt(p)] -- then
    run L3''s three declared controls (positive: an order-4 point and an order-2l point must FAIL the
    prime-order-subgroup-generation test; parameter-matched negative: the Curve25519 base point u=9 with
    its published prime order must PASS every step, run through the identical code path; same-shape null:
    a point on the quadratic twist must fail the on-curve check, plus 1000 uniformly random (x,y) pairs
    in F_p x F_p of which the expected number passing on-curve is approximately 0).'
  uncertainty_reduced: Whether this environment's execution capability (a real shell with curl and arbitrary-precision
    Python arithmetic, which the prior idea-generator session that produced audit-plan.yaml explicitly
    did not have) can discharge the retrieval-channel-corruption conflict (capsule conflict C1 / successor
    requirement SR1) blocking lane L3, and, once discharged, what L3's base-point certificate actually
    shows for every candidate that can be sourced within this batch.
  inputs:
  - ledger/goals/GOAL-SCURVE-15e805/goal.yaml
  - ledger/questions/RQ-SCURVE-4c75e3.yaml
  - ledger/proposals/IDEA-20260807-98a970.yaml
  - coordination/goals/GOAL-SCURVE-15e805/batches/BATCH-c49aa3/tasks/TASK-20260824-233cd4/parameter-capsule.yaml
  - coordination/goals/GOAL-SCURVE-15e805/batches/BATCH-c49aa3/tasks/TASK-20260824-233cd4/audit-plan.yaml
  - coordination/goals/GOAL-SCURVE-15e805/batches/BATCH-c49aa3/tasks/TASK-20260824-233cd4/task-report.yaml
  - https://www.rfc-editor.org/rfc/rfc7748.txt
  - https://www.rfc-editor.org/rfc/rfc8032.txt
  constraints:
  - Fetch RFC 7748 and RFC 8032 with `curl` (or equivalent raw HTTP GET) to plain-text files on disk;
    never use a summarizing fetch tool for these two documents, and never transcribe from parameter-capsule.yaml
    section 5 (every entry there is marked USE_PROHIBITED).
  - Record sha256 of each raw fetched document and cite the exact line number(s) or byte offset for every
    transcribed numeric value.
  - If a value cannot be found in the raw RFC text (e.g. the ePrint 2015/625 pre-rotation base point,
    which needs a PDF this task cannot render), record it UNRETRIEVED and proceed with the candidates
    that ARE retrievable; never reconstruct a missing value from memory or from the quarantined section.
  - 'Global precondition P4 (audit-plan.yaml) binds: the lane''s controls must run and behave as required
    BEFORE any L3 result is believed or reported as a finding. Run all three controls (positive, parameter-matched
    negative, same-shape null) and report their outcomes alongside the primary measurement, not as an
    afterthought.'
  - 'Global precondition P2 stays open in this task (SafeCurves numeric thresholds are still unsourced,
    capsule conflict C6b): report every measured quantity (on-curve status, l*B result, Hasse-interval
    count, control outcomes), but do NOT convert any measurement into a SafeCurves True/False comparison
    cell.'
  - 'Model pinning (audit-plan.yaml `model_pinning`): state explicitly, per candidate, which of M1 (curve448,
    Montgomery), M2 (large-d Edwards), or M3 (edwards448/Ed448-Goldilocks) it belongs to; L3 is NOT isogeny-invariant
    (per `NOT_invariant_across_M1_M3`), so a Montgomery-model candidate and an Edwards-model candidate
    are reported as separate rows, never merged or transferred across the isogeny by assertion.'
  - 'Respect L3''s own stopping rule: budget is production_seconds 300, verification_seconds 10 (order-of-magnitude
    estimate, not a hard measured figure). If genuinely exceeded, stop, record the strongest result achieved,
    and classify UNRESOLVED with the reason -- never silently keep going past a reported budget without
    saying so.'
  - A budget stop, timeout, missing dependency, or unavailable source is an operational observation, never
    mathematical evidence, per AGENTS.md rule 3 and the goal's claim_boundaries.
  - Do not run any curve attack, do not create an experiment record, and do not state or imply that Ed448-Goldilocks
    is safe, unsafe, vulnerable, or free of vulnerabilities -- this task certifies base-point properties
    only.
  - Use only public parameters and locally generated synthetic controls; never test, request, store, or
    derive a live private key.
  - Never select a provider, backend, endpoint, or model identifier containing Bedrock, case-insensitively.
  deliverables:
  - Raw-transcription record with sha256 hashes and line-cited values, discharging successor requirement
    SR1 for this lane
  - 'Lane L3 base-point audit report: per-candidate certificate, control outcomes, honest limitations,
    and outcome interpretation per audit-plan.yaml''s own schema for L3'
  - Task report stating exactly what ran, what stopped early and why, and what remains UNRETRIEVED or
    UNRESOLVED
  artifact_paths:
  - coordination/goals/GOAL-SCURVE-15e805/batches/BATCH-0aef14/tasks/TASK-20260908-42e809/raw-transcription.yaml
  - coordination/goals/GOAL-SCURVE-15e805/batches/BATCH-0aef14/tasks/TASK-20260908-42e809/base-point-audit.yaml
  - coordination/goals/GOAL-SCURVE-15e805/batches/BATCH-0aef14/tasks/TASK-20260908-42e809/task-report.yaml
  read_scope:
