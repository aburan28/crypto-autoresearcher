  - ledger/proposals/IDEA-20260807-98a970.yaml
  - coordination/goals/GOAL-SCURVE-15e805/batches/BATCH-c49aa3/
  write_scope:
  - coordination/goals/GOAL-SCURVE-15e805/batches/BATCH-0aef14/tasks/TASK-20260908-42e809
  budget:
    wall_clock_seconds: 3600
    memory_gb: 2
    maximum_runs: 0
  completion_gate:
  - Both RFC documents are fetched as raw plain text (not via a summarizing tool), their sha256 recorded,
    and every L3-relevant value is transcribed with a line citation into the raw document.
  - No value from parameter-capsule.yaml section 5 (unverified_retrieval_transcript) is used in any certificate
    or measurement.
  - Every sourceable base-point candidate is certified on-curve, non-identity, l*B=O, and Hasse-interval-unique,
    with the model (M1/M2/M3) it belongs to stated.
  - All three of L3's declared controls (positive, parameter-matched negative, same-shape null) actually
    ran and their outcomes are reported.
  - No SafeCurves True/False comparison cell is emitted (P2 remains open).
  - The task report states plainly what ran, what is UNRETRIEVED or UNRESOLVED, and makes no safety or
    vulnerability conclusion about the curve.
