handoff:
  id: TASK-20260904-d4cfc6
  from: coordinator
  to: idea-generator
  objective: >-
    Generate 4 schema-complete, falsifiable proposals against RQ-ECDLP-002 --
    prime-field ECDLP attack-cost reduction -- that are EXPONENT-FIRST and
    mathematical, not audit or portfolio work. The existing open pool for this
    question is 39 proposals and is badly unbalanced: roughly a third are
    self-referential meta-proposals about the campaign's own record-keeping,
    and five more are one iteratively-refined cascade object. What the pool
    lacks is candidate MECHANISMS with a stated target exponent.
  uncertainty_reduced: >-
    Whether this program still has an unexplored mechanism worth costing on
    the central question, or whether the ECDLP line is genuinely exhausted at
    the frontier it can reach. That distinction is currently unmeasured, and
    both answers are valuable: premature closure -- declining to search
    because a target looks saturated -- is treated by docs/inventor-protocol.md
    as a failure mode symmetric with overclaiming. Every result this campaign
    has produced to date is a negative result or a closure, with sota_delta
    +0 everywhere. That is an honest position, not a reason to stop, and it is
    also not a reason to manufacture optimism.

  inputs:
    - AGENTS.md
    - agents/idea-generator.md
    - 'docs/inventor-protocol.md -- object-first generation, the lossy-projection test, null-object controls before belief, Pareto dominated_by / sota_delta honesty'
    - 'docs/target-result-profile.md -- the canonical exemplar is Wesolowski p^{1/3+o(1)}: exponent-moving on a central hard problem, stated conditionally on explicit numbered heuristics, validated at cryptographic scale, costed honestly'
    - docs/claims-and-verification.md
    - templates/research-records.md
    - ledger/questions/RQ-ECDLP-002.yaml
    - 'knowledge/open-problems/KN-OPEN-002.md -- growth of the Groebner solving degree for prime-field summation-polynomial systems. THE DEGREE GAP IS THIS GOAL''S SINGLE LIVE UNBOUNDED QUANTITY and the one measurement with a real chance of changing the picture.'
    - knowledge/open-problems/KN-OPEN-001.md
    - knowledge/open-problems/KN-OPEN-004.md
    - knowledge/open-problems/KN-OPEN-006.md
    - knowledge/open-problems/KN-OPEN-010.md
    - knowledge/open-problems/KN-OPEN-019.md
    - 'knowledge/techniques/KN-TECH-73630e.md -- STANDING BOUNDARY, read before proposing anything that lifts'
    - 'knowledge/findings/KN-FIND-ffe1df.md -- Theorem C, the prime-order no-nontrivial-quotient argument'
    - 'knowledge/findings/KN-FIND-61347e.md -- the cross-genus Poincare-factor embedding is CLOSED unconditionally'
    - 'knowledge/findings/KN-FIND-1ba0fe.md -- the D1 collapse, for contrast'
    - knowledge/techniques/KN-TECH-056.md
    - knowledge/techniques/KN-TECH-080.md

  id_assignment_use_exactly_these:
    note: >-
      Four identifiers, pre-minted and verified free across the whole
      repository in a single indexed scan. Use them exactly, one per proposal.
      Mint nothing. If you produce fewer than four proposals worth filing,
      leave the remainder UNSPENT and say so -- three good proposals and one
      unspent identifier is a better outcome than four, and padding the count
      is the specific failure this instruction prevents.
    ids:
      - IDEA-20260904-d84512
      - IDEA-20260904-f7d47d
      - IDEA-20260904-a195ff
      - IDEA-20260904-f4172f

  constraints:
    - >-
      EXPONENT-FIRST. Every proposal states `target_complexity` as a time AND
      memory exponent against the incumbent, which for this question is
      Pollard rho at O(sqrt(n)) group operations with negligible memory, and
      BSGS where memory is charged. An idea whose best possible outcome is a
      constant-factor or logarithmic improvement is LOW VALUE here and must
      say so in its own `sota_delta` rather than being dressed up. Do not
      propose one and argue it is secretly an exponent move.
    - >-
      DO NOT PROPOSE AUDIT, PORTFOLIO, SCOPE-LANGUAGE, CITATION-COVERAGE, OR
      RECORD-KEEPING WORK. The open pool already holds roughly a dozen such
      proposals and they are not what this question is short of. This is a
      hard exclusion, not a preference.
    - >-
      CHECK FOR DUPLICATES BEFORE YOU WRITE, AND CHECK PROPERLY. Run
      `python3 tools/audit_proposal_backlog.py --question RQ-ECDLP-002 --list`
      and read the 39 open titles; also scan converted proposals, because a
      converted proposal is still prior art. This campaign minted a duplicate
      two cycles ago by generating into a deep pool without doing this, and
      then discovered its own audit query had been wrong twice more. Name in
      each proposal the nearest existing proposal and say what distinguishes
      yours. `Nothing distinguishes it` is a valid finding -- report it and
      drop the idea rather than filing a near-duplicate.
    - >-
      THREE STANDING RESULTS BIND YOU. (1) KN-TECH-73630e: the canonical
      prime-to-p torsion lift is a deterministic function of the input point
      and reduction is a group isomorphism, so ANY statistic of the lift's
      digits is a deterministic function of data the querying party already
      holds. Whatever such a construction offers is COMPUTATIONAL at most,
      never informational, and a proposal claiming otherwise is refuted before
      it is costed. (2) KN-FIND-ffe1df Theorem C: a surjective homomorphism
      onto a strictly smaller structure is impossible when the source has
      prime order -- state explicitly whether your object satisfies that
      argument's hypotheses. (3) KN-FIND-61347e: cross-genus Poincare-factor
      embedding is closed unconditionally. Do not re-propose any of these.
      Proposing a near neighbour and saying exactly how it escapes the
      argument is legitimate and welcome; proposing one blind is not.
    - >-
      APPLY THE LOSSY-PROJECTION TEST AND A NULL-OBJECT CONTROL to every
      candidate before you believe it. If the argument FOR your mechanism
      would also apply to a nearby object where the conclusion is known false,
      it proves too much and is wrong -- report that outcome explicitly, since
      a failed audit is often the useful result. Name the null object
      concretely; `a random curve` is not a null object, a named curve with
      the structure removed is.
    - >-
      HEURISTICS STAY CONDITIONAL AND NUMBERED. Every proposal carries
      `heuristic_assumptions`, each numbered, each formally stated with its
      quantifiers and the distribution it concerns, and each with a CONCRETE
      EXPERIMENTAL VALIDATION ROUTE -- what would be sampled, at what scale,
      against what predicted distribution. A heuristic with no validation
      route is not admissible. Do not soften or drop one to make a claim look
      cleaner.
    - >-
      EVERY PROPOSAL NEEDS A MINIMAL DISCRIMINATING TEST that is cheap, and a
      falsification condition that some achievable outcome actually meets.
      State the cost of that first test in wall-clock and memory at a scale
      this program can reach. An idea whose cheapest decisive test is itself a
      research programme is not yet a proposal.
    - >-
      NOVELTY LABELS. Do not use any novelty label stronger than `unverified`
      without an actual check against knowledge/ and the literature corpus,
      and record what you checked. An honest `unverified` is fine.
    - >-
      If a proposal is proof-oriented, include the `proof_search_map` required
      by KN-TECH-080: exact bottleneck and baseline reproduction,
      observation-collision search, quantifier order, method ceiling, and the
      nearby-object control. These are cheap pre-compute falsification checks
      and passing them all still claims nothing.
    - 'Zero compute. Write proposal records only; run nothing. experiment_maximum_runs is 0.'
    - >-
      Create no H-*/EXP-*/EV-*/DEC-*/KN-*/CORR record and change no status.
      You propose; the Coordinator ranks and admits. Do not edit any existing
      proposal -- they are immutable.
    - >-
      Citation provenance mandatory on every source: recalled | retrieved |
      kb | internal. Do not fabricate a citation, a measurement, a timing, or
      a prior result. Missing data stays missing and is reported as such.
    - >-
      YAML hygiene, re-checked with a strict parser by the orchestrator: no
      plain scalar containing an unescaped double-quote or a
      colon-followed-by-space (single-quote the WHOLE scalar if needed); no
      duplicate keys at any nesting level; no bare mapping key inside a block
      sequence without a leading '-'. This defect class has broken artifacts
      repeatedly on this goal. If your session has no shell you cannot verify
      this yourself -- say so plainly rather than claiming a parse you did not
      run.

  suggested_seeds:
    note: >-
      Starting points, NOT an assignment. Ignore any of them for a better
      object of your own, and say why.
    seeds:
      - >-
        KN-OPEN-002, the Groebner solving-degree growth for prime-field
        summation-polynomial systems. This is the goal's single live unbounded
        quantity. Semaev S_3 has fixed degree 2 and S_n degree 2^{n-2}; what
        is NOT bounded is how the solving degree grows with n, and every
        index-calculus cost claim on this question rests on an unmeasured
        assumption about it.
      - >-
        KN-OPEN-004 support-aware elimination -- whether BKK / mixed-volume
        bounds undercut dense resultants once the actual Newton polytope of
        the summation system is used rather than its total degree.
      - >-
        KN-OPEN-006 designed relation supports -- whether a factor base chosen
        as an arithmetic progression yields a structured, low-displacement-rank
        relation matrix whose linear algebra is genuinely cheaper, and what the
        yield costs in exchange.
      - >-
        KN-OPEN-019 -- whether the enumeration of objects tracked by ECDLP
        attack families is closed. If it is not, the gap is where an
        unconsidered mechanism lives; if it is, that is a real structural
        statement about the problem.

  deliverables:
    - '4 proposal records at ledger/proposals/IDEA-20260904-<tok>.yaml, one per assigned identifier, schema-complete per agents/idea-generator.md'
    - >-
      novelty-and-duplication-audit.yaml: per proposal, the nearest existing
      open or converted proposal, what distinguishes yours, what you checked
      in knowledge/ and the literature corpus, and the resulting novelty
      label with its provenance. Name any idea you DROPPED as a near-duplicate
      and what it duplicated.
    - >-
      ranking.yaml: your own ranking of the 4 with the recommended first test
      and its cost, plus an explicit statement of which is most likely to be
      wrong and how it would show.
    - runtime-session-receipt.json: written last; artifacts, inference provenance, zero experiments, any operational limitation including whether you could run the strict parse.
  artifact_paths:
    - ledger/proposals/IDEA-20260904-d84512.yaml
    - ledger/proposals/IDEA-20260904-f7d47d.yaml
    - ledger/proposals/IDEA-20260904-a195ff.yaml
    - ledger/proposals/IDEA-20260904-f4172f.yaml
    - coordination/goals/GOAL-ECDLP-001/proposals/B71-IDEATION-20260904-d4cfc6/tasks/TASK-20260904-d4cfc6/novelty-and-duplication-audit.yaml
    - coordination/goals/GOAL-ECDLP-001/proposals/B71-IDEATION-20260904-d4cfc6/tasks/TASK-20260904-d4cfc6/ranking.yaml
    - coordination/goals/GOAL-ECDLP-001/proposals/B71-IDEATION-20260904-d4cfc6/tasks/TASK-20260904-d4cfc6/runtime-session-receipt.json
  archived_by: TASK-20260904-a21224
  inference:
    policy: research-deep
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: null
    memory_gb: null
