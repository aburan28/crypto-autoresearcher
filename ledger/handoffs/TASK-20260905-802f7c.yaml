    ledger/questions/RQ-SCURVE-*.yaml titles); goal_id GOAL-ECDLP-001; goal_ids must
    include GOAL-ECDLP-001 and GOAL-CRYPTO-001, add GOAL-ENDO-001 when RQ-MODEL-e61cb2
    is invoked, and add the GOAL-SCURVE-* of every named curve, each with a
    goal_applicability sentence; status proposed; proposed_by idea-generator; added
    2026-09-05; proposed_under_task TASK-20260905-802f7c; ideation_namespace
    equation-schemes-20260905-802f7c; batch_id null; novelty_status unverified unless
    a retrieved source supports adaptation or known; seed_provenance: user-supplied
