handoff:
  id: TASK-20260905-802f7c
  from: coordinator
  to: idea-generator
  objective: >-
    Generate four to six distinct, schema-complete, falsifiable proposals for
    RQ-ECDLP-623a32 on EQUATION SCHEMES: the defining equation form (normal form,
    model) of a prime-field elliptic curve treated as a tracked object PAIRED with the
    operation set it carries -- the rational torsion translations it certifies, the
    isogenies it makes rational, its automorphisms, and Frobenius on the extension
    field where a further model appears -- rather than as a change of coordinates on a
    prime-order curve, which the model lane closed at lever 1. The lane is anchored on
    the twenty SafeCurves curves as verified in
    research/equation_schemes_safecurves_20260905.md: nine prime-order short
    Weierstrass curves with no rational torsion (rational deck order 2 only) and eleven
    cofactor-4 or cofactor-8 Montgomery or Edwards curves with cyclic rational torsion
    Z/4 or Z/8 (deck orders 4, 8 or 16 available to a torsion-quotient coordinate).
  uncertainty_reduced: >-
    Whether an equation scheme changes a charged cost of a named ECDLP attack stage on
    a prime-field curve through what it certifies (rational torsion, rational
    isogenies, extension-field models, coefficient sparsity) rather than through the
    coordinate it supplies; and specifically whether this program's proposed
    deck-group law (IDEA-20260807-dadcd2, status proposed) evaluated at g = 2k > 2 on
    cofactor curves predicts or contradicts the symmetrised-summation-polynomial
    behaviour the literature reports (KN-LIT-004, KN-LIT-6917). Either outcome is
    informative; a constant, not an exponent, is the honest target (RQ-MODEL-e61cb2
    decision target).
