  constraints:
  - >-
    Proposal-only task. No experiments, implementation, attack code, key-recovery
    procedure or third-party target operation; maximum_runs is 0. Every minimal_test
    is a design for a later approved contract. Toy and symbolic scopes; lawful
    defensive cryptanalysis on public constructions. The twenty SafeCurves curves are
    named only as public parameter sets whose torsion structure is verified in the
    note; never as targets, and no statement about their safety is made.
  - >-
    LANE DISJOINTNESS. BATCH-23ec69 (TASK-20260905-a6ea8a, claimed by
    coordinator-ecdlp-brainstorm on branch claude/ecdlp-goal-brainstorm-nz3uem) owns
    the R3 exotic representations: level-n theta and Kohel normal-form embeddings as
    embeddings, elliptic nets, cubical and biextension lifts, quadratic-order R1
    coordinates, E x E / Kummer-surface / glued-Jacobian representations, Weil
    restriction, translation frames, divisor-class and Miller-function
    representations, distribution-valued objects. Do not propose in those classes;
    name them only as nearest neighbours. This lane is R2: the equation scheme and
    what it certifies.
  - >-
    OBJECT FRAME (docs/object-frame-ideation.md section 3). Every candidate is a PAIR
    (equation scheme plus what it certifies, operation set Sigma the tracked object
    must survive). Name both explicitly in `mechanism`. Sigma must not be the full
    translation action, which is closed for lossy objects by IDEA-20260806-c5d183 and
    KN-FIND-ffe1df Theorem C; if Sigma contains the full translation action, the
    candidate is a branching object and must say so. Admissible Sigma here: translation
    by a rational torsion subgroup C (partial action), the isogeny phi_C and its dual,
    automorphisms of the scheme, Frobenius on F_{p^k}, a walk step composed with
    re-canonicalisation.
  - >-
    TRICHOTOMY. Place each candidate in exactly one class of IDEA-20260806-c5d183 --
    partial-action, branching, or coordinate-dependent -- with the one-line reason in
    `mechanism`. A candidate that cannot be placed is returned as `unverified` with
    the obstruction named, not silently dropped.
  - >-
    LOSSY-PROJECTION TEST, AGAINST THE NAMED OPERATION SET (docs/inventor-protocol.md
    section 2; IDEA-20260901-863e36). State what the projection discards, show the
    discard is compatible with Sigma (a block system of <Sigma>, or a stated branching
    bound), and show it is lossy in the representation actually used. A projection
    that loses nothing is a change of coordinates and is not returned. A torsion-
    quotient coordinate x o phi_C is exactly such a candidate: say what it discards
    (the C-coset and the sign) and against which Sigma that is a block system.
  - >-
    PRICE THE ONE OPEN NUMBER. For a quotient object, the cost of canonicalising a
    <Sigma>-orbit, charged end to end. For a branching object, the loss L and
    branching b of IDEA-20260802-002, with the minimal test stating how they are
    measured on a toy curve against the identity, random-label, and generic-group
    (relabelled Z/nZ) controls.
  - >-
    OFF-LIMITS AS PRIMARY LENS. Families F1-F7 of IDEA-20260802-002; degree-2
    coordinates on prime-order curves, closed at lever 1 by IDEA-20260807-8027a2,
    IDEA-20260807-e6d79e and IDEA-20260807-dadcd2; degree-d functions E -> P^1 in
    general (IDEA-20260808-2e14f7) unless a specific d, divisor class and new
    consequence is named -- the torsion-quotient coordinate x o phi_C for a cyclic
    rational torsion subgroup C IS such a specific case and is in scope, with
    IDEA-20260807-dadcd2, KN-LIT-004 and KN-LIT-6917 as the neighbours whose delta must
    be stated; model-conversion certificates for the SCURVE audit (IDEA-20260905-7d14f8,
    IDEA-20260905-89e352 and its duplicates 8e4994, 7720ef, 970b2f); saturation-defect
    chart proposals (IDEA-20260905-0cc259 and duplicates 3c4579, dd547f); the
    user-supplied Edwards/Hessian comparison and theta-Kummer drafts
    (IDEA-20260905-4dff7b, IDEA-20260905-40aa90, PR #750); the availability partition
    across an isogeny class (IDEA-20260811-fe0934) -- consume it, do not re-propose it;
    the Hessian x+y coordinate at fixed curve (IDEA-20260807-5f5ace); the saturated
    meter (IDEA-20260807-1354d8); canonical and p-adic lifts (CANL, XEDN lanes);
    pairing transfer; isogeny-class transfer (ISO, ICINV lanes); the CM-trace factor
    base (IDEA-20260902-701458). A candidate that uses one as a component names it and
    states what is added.
  - >-
    Enumerate candidate OBJECTS before ideas. Classes the Coordinator asks you to
    consider, without quota and in addition to your own: (1) torsion-quotient
    coordinates x o phi_C for cyclic rational torsion C of order k in {2, 4, 8} on the
    eleven cofactor curves and on toy curves with matched torsion structure -- the
    falsifiable object is IDEA-20260807-dadcd2's law at g = 2k (per-variable degree
    g^(m-2), Bezout number B^(m-1)/g) against the symmetrised-summation-polynomial
    claims of KN-LIT-004 and KN-LIT-6917 (compactness, sparsity, smaller factor base),
    measured as per-variable degree, Bezout number, factor-base size at fixed window,
    decomposition probability and Groebner solving degree; (2) extension-field-only
    schemes: Legendre form needs full 2-torsion and twisted Hessian form needs
    3-torsion, neither of which any SafeCurves curve has over F_p, so pair the scheme
    over F_{p^2} or F_{p^3} with Sigma = Frobenius plus torsion translation, state the
    Weil-descent boundary (Gaudry and Diem apply to F_{p^n}, not to F_p) and what a
    prime-field attack stage could still use, or record the obstruction; (3) the
    rational isogeny a Montgomery or Edwards scheme certifies (E -> E/<T> of degree 2,
    both Montgomery; the cyclic 4- and 8-isogenies on the Z/8 curves) as Sigma:
    objects that propagate under the isogeny step rather than under translation, e.g.
    factor bases closed under phi_C and its dual, with the orbit-canonicalisation cost
    priced; (4) equation-scheme coefficient sparsity as a cost carrier: SafeCurves'
    Montgomery A and Edwards d are small integers (486662, 1174, 3617, 39081, ...) --
    does small-coefficient sparsity change the symbolic size or first-fall degree of
    the decomposition system relative to a random-coefficient model of the same
    curve, read as an attack-surface question about the rigidity criterion, with the
    PGL_2 null and a random-A control at the same torsion structure; (5) the
    deck-order vector of a curve (section 4 of the note) as a measurement object for
    the SCURVE goals, admissible only if it names the attack-stage cost it changes;
    (6) anything genuinely new in R2.
  - >-
    Every proposal names the non-generic operation the scheme makes cheaper and the
    attack stage it changes (factor-base membership, decomposition, collision
    structure, linear algebra, descent), names its R2 class in `claim`, and fills
    target_complexity with exponents against Pollard rho at N^(1/2) and against the
    Semaev and Petit-Kosters-Messeng baselines, charging setup, transport, memory and
    verification. Exponent delta is 0 unless derived; RQ-MODEL-e61cb2 forbids claiming
    an exponent from model choice.
  - >-
    Mandatory controls in every minimal_test: the PGL_2(F_p) random-reparametrisation
    battery and the translation-conjugate null of IDEA-20260807-4fc635; a matched
    random curve at the same p with the SAME rational torsion structure (Z/8, Z/4 or
    trivial) and one with a DIFFERENT structure; a known-false object on which the
    claimed effect must vanish (a prime-order curve, deck order 2); Pollard rho with
    distinguished points and BSGS as matched baselines; on CM curves the
    automorphism-discounted rho baseline (KN-TECH-018); a decay test as the parameter
    meant to destroy the effect increases.
  - >-
    FACTOR-BASE ESCAPE. Any candidate factor base or relation mechanism says which
    KN-OPEN-020 open class it belongs to -- high-degree, implicit-membership, or
    target-dependent description -- and charges description, membership, relation,
    descent, time and memory costs, or declares itself inside the scoped-out class and
    stops.
  - >-
    PROOF SEARCH MAP before any compute (docs/inventor-protocol.md section 8) on every
    proof-oriented record: exact bottleneck, baseline embedding, observation collision,
    quantifier order, method ceiling with a nearby-object control, proof obligations.
    Conditional cost claims name numbered heuristics with validation routes.
  - >-
    NOVELTY. Unverified unless a specific local record AND an opened primary source
    support the exact distinction; no global novelty from absent search results. The
    crypto-kb retrieval index is EMPTY this session (':memory:', verified by the
    orchestrating session): do not call search_knowledge; screen by reading
    ledger/proposals, ledger/hypotheses and knowledge; the BBJLP twisted Edwards paper
    is available as retrieved text at
    research/equation-schemes-20260905/retrieved-pages/eprint-2008-013.txt (provenance
    retrieved, verified_by TASK-20260905-802f7c orchestrating session); WebFetch may be
    blocked in this runtime -- disclose every attempt, and record every retrieval and
    every local record read in sources.json. Mark every citation recalled | retrieved |
    kb | internal; a recalled reference is a pointer and supports nothing. Any
    proposal using torsion symmetrisation is at best `adaptation` of KN-LIT-004 /
    KN-LIT-6917 unless it states what goes beyond them.
  - >-
    Read mechanisms of nearest internal proposals, not only titles. Record at least one
    specific nearest internal record and the exact difference for each candidate in
    `discriminated_from`.
  - >-
    dominated_by may be null only after every declared frontier row was checked;
    otherwise record the unresolved comparison. sota_delta is quantitative or an
    explicit unquantified boundary. Every record carries honest_prior_of_survival.
  - >-
    Required per-idea fields, per agents/idea-generator.md "Required output" and the
    validated exemplar ledger/proposals/IDEA-20260905-1a8cb3.yaml: id, title, class,
    claim, mechanism, tracked_object, lossy_projection_test, null_object,
    why_not_a_renamed_known_approach, question_id, question_ids, goal_id, goal_ids,
    goal_applicability, status, proposed_by, added, proposed_under_task,
    ideation_namespace, novelty_status, novelty_screen, seed_provenance, citations,
    assumptions, proof_search_map, discriminated_from, predictions, minimal_test,
    falsification_conditions, confounders, interpretation_limits,
    heuristic_assumptions, target_complexity, estimated_cost, recommended_priority,
    dominated_by, sota_delta, honest_prior_of_survival, inference,
    id_allocation_provenance, yaml_parse_disclosure, source_refs.
  - >-
    Fixed values: question_id RQ-ECDLP-623a32; question_ids must include
    RQ-ECDLP-623a32, RQ-MODEL-e61cb2, RQ-ECDLP-002 and RQ-CRYPTO-001, and the
