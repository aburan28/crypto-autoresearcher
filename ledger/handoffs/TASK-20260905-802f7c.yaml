    SafeCurves Equations page, stored verbatim in context.md), a pointer, not a
    citation and not evidence; inference policy research-deep, requested_policy
    research-deep, reasoning_effort high, resolved_model_id null unless known.
  - >-
    Assigned identifiers, used in order and never re-minted: IDEA-20260905-05648a,
    IDEA-20260905-1f0f0e, IDEA-20260905-28d387, IDEA-20260905-61ea3b,
    IDEA-20260905-2bcabb, IDEA-20260905-54aa18. Unused identifiers are left unused
    and listed in report.md with the reason.
  - >-
    Write ONLY to the assigned ledger/proposals/<id>.yaml files and to
    coordination/ideation/equation-schemes-20260905-802f7c/tasks/TASK-20260905-802f7c/report.md
    and sources.json. Never overwrite an existing file; never run git; edit no existing
    record; no experiment, hypothesis, approval, status transition, knowledge
    promotion or deployed-target interaction; no imagined outcomes; no Bedrock, no
    fallback, no degradation. Write each YAML file so a strict duplicate-key-raising
    loader parses it; keep every scalar containing ': ' inside a block scalar.
  - >-
    report.md records the objects enumerated with their trichotomy class, the
    honest-accounting block of docs/inventor-protocol.md section 5 (dominated_by,
    sota_delta, enumerated closures with mechanisms, open directions), the ranking
    rationale, the single recommended first test and why its minimal test is the
    cheapest valid discriminator, and the unused identifiers with reasons. Every
    session, including one that generates nothing acceptable, returns that block.
