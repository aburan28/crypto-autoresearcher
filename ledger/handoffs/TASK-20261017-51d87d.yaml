  constraints:
    - id: DS-1
      text: >-
        DESIGN ONLY. Write one draft contract. Approve nothing, freeze
        nothing, run nothing, write no code and compute nothing. Planning
        numbers are taken from archived files and cited by path and field,
        or are stated as a P0 step the executor performs after approval.
        Hand approximations are labelled "planning approximation (hand)".
        Do not write a RUN id or a run directory. The draft carries status
