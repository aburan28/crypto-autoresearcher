        session has no shell. It does not run tools/experiment_preapproval.py;
        DS-11 lists what the draft provides for it instead.
    - id: DS-2
      text: >-
        C-1 LADDER (DEC-20261002-d0594a order_ruling.part_C; draft part_C
        C-1_in_band_ladder). Cells: TT3, SS3 and SS5 of FAM-1, using the base
        definitions and conventions of EXP-PFDR-011cd0 (CC-1 to CC-10, |F|
        matching, X_fix for SS) unchanged unless a change is justified
        before data. Rungs: at least four, all inside the numpy band
        (p < 2^32), for example 20, 24, 28 and 32 bits; state the rung set,
        Delta log2 N and the reason. Curves: fresh, from the same generator
        and p_filter, disjoint from every c used by EXP-PFDR-011cd0 and
        EXP-PFDR-0b3699 (cite their design.json ranges) and from any
        reserved range; state the range per rung. Arms per rung: three
        matched random arms; a known-null arm per family;
        random-as-structured null pseudo-cells; a planted arm at the target
        size; and a PLANTED-GROWTH ladder, an excess planted to grow with N
        at a declared delta_target, so that the growth test's power at the
        target is measured rather than assumed. Per-rung n comes from a P0
        rule aimed at equal sigma_b, with every input cited by path and
        field. Each rung is calibrated on its own random arms before any
        structured arm is read (two-step blinding), with the real-data
        permutation null reported beside the model null. Part B's fresh
        30-32-bit rungs may be offered as an optional merge with its cost
        stated; whether to merge is the approval act's choice, and Part B
        stays conditional (DEC-20261010-b662c7 NA-4).
    - id: DS-3
      text: >-
        GROWTH TEST AND DECISION RULES, PRE-REGISTERED. Name one primary
        growth estimator per cell, for example the weighted least-squares
        slope of log2 kappa_hat_b on log2 N_b under the multiplicative model,
        with the additive model's per-rung envelope c N_b^delta <= U_b - 1
        reported beside it. Give one one-sided test of delta > 0 per cell
        and family-wise control across the three cells; state the alpha,
        the detectable delta at power 0.5 and 0.9, and the resulting
        resolution on the exponent move delta/2. Before any data, state
        what each outcome means for each cell:
        (G+) growth resolved, delta > 0 -- an exponent-relevant candidate;
        no claim; routed to a review-breakthrough round at max;
        (G0) no growth, with a one-sided delta bound at or below the
        declared resolution -- a bounded statement over the tested range
        only, with the per-rung envelope recorded;
        (G?) neither -- inconclusive, with the achieved resolution recorded;
        (G-INVALID) a per-rung gate or a growth-control gate fails -- no
        reading.
        No growth statement rests on fewer than four valid rungs. A rung
        lost to a timeout, crash or memory stop is infrastructure signal,
        never a negative reading; state how many rungs a cell may lose
        before it becomes G-INVALID. Per-rung kappa_rel readings are
        secondary. No single unreplicated run set may carry reject_scoped,
        so state which outcome maps to which permitted transition (weaken,
        replicate, or route to review) under H-PFDR-2765d2.
    - id: DS-4
      text: >-
        C-2 PILOT PRECONDITIONS (DEC-20261002-d0594a OB-5; draft part_C
        C-2_rungs_above_32_bits).
        (a) A census --no-accel switch, written as an engine-change item
        (EC-C1) with the exact files and the new tests named, and gated by
        an equality gate: the pure-Python path must reproduce the archived
        numpy-path rows exactly at 30-32 bits.
        (b) A resource probe at 34 and 36 bits on a few curves per rung
        (RSS and CPU per instance) under RLIMIT_AS 3.5e9.
        (c) TT4 and TB3 are excluded.
        EC-C1 needs a Coordinator lift, at approval, of the standing
        restriction (DEC-20261002-c3f49b NA-5 as continued by
        DEC-20261002-e7f8c9 na5_lift.continues_for), limited to the named
        files and one executor-implementation task. The draft states the
        lift it asks for; it lifts nothing. The tier of a rung above 32 bits
        is assigned by the mechanical rule cited in EV-PFDR-ad6274
        claim_tier_basis. C-2 rungs enter a growth fit only after (a) and
        (b) pass. State whether C-2 is a phase of EXP-PFDR-969aae or a later
        experiment, and why. TT3 at 38 bits or above stays out of scope
        under the 3.5e9 cap unless the probe shows otherwise.
    - id: DS-5
      text: >-
        RCT-1 (DEC-20261010-b662c7 R-2, R-6). Replace PC-NULL-R criterion (i)
        with the family-wise maximum of the null pseudo-cell z values,
        calibrated under their simulated joint law. Its null rejection rate
        and its power against a single-arm departure at the target are
        computed at P0 and recorded before data; nothing is computed now.
        Keep criterion (ii), the mean of the null z values, or replace it
        with a stated reason. Say how the rule applies to a ladder: per rung,
        pooled, or both, and which of these gate.
    - id: DS-6
      text: >-
        RCT-2. Report a common-mode yardstick per rung and pooled: the
        null-arm rate rho1 against U and against the previous experiments'
        rates (EXP-PFDR-011cd0, EXP-PFDR-0b3699, where comparable), each
        with a 99% interval, and the multiplicative factor needed to carry
        the reading across its decision boundary. State before data whether
        the yardstick gates or is reported only.
    - id: DS-7
      text: >-
        RCT-3. Pre-register a governing-bound rule that Monte Carlo noise
        cannot decide, replacing the AR-3 coverage switch: for example, the
        larger of the signed and |dev| bounds always governs, or the switch
        requires a 3-SE margin on the simulated coverage. Size replicate
        counts so that each coverage's Monte Carlo SE is stated. The rule
        applies to every per-rung bound and to any bound on delta.
    - id: DS-8
      text: >-
        DEF-2 FIX (DEC-20261010-b662c7 R-4 F-2). Every finalize of a run whose
        required_artifacts.per_run demands declared metrics or an outcome id
        passes --metrics-from (the pinned finalize in
        experiments/EXP-PFDR-0b3699/run_jobs.py supports it), or the new
        launcher's equivalent, and the run list writes that argv in full.
        Add a gate or invalidation rule that fails a run whose raw-result
        metrics or outcome id is null where required. Add a field-level
        completeness item for required artifacts to the Coordinator
        validity checklist the draft proposes; checking that a file exists
        is not enough.
    - id: DS-9
      text: >-
        LAUNCH-PROMPT RULE (DEC-20261010-b662c7 R-5, R-6). Every executor,
        reviewer and archive handoff the draft proposes says that its launch
        prompt names each receipt it depends on (task id, commit sha,
        verifier verdict and, under CF-1, the main commit carrying the same
        bytes). The dispatched session refuses to begin until it has them.
    - id: DS-10
      text: >-
        FURTHER LESSONS BINDING ON THE DRAFT.
        (a) ONE ATTESTATION PER REPORT DIRECTORY (R-3 item 1): fragments
        merged by an assembler carry no top-level review_attestation, and
        tools/check_review_independence.py must pass in directory mode as
        well as file mode.
        (b) CHECKPOINTING (R-5): long executor and reviewer computations
        write resumable state, re-hash their inputs on resume, and write
        the adopted values before any supplementary work starts.
        (c) P0 inputs are estimated at the decision scope (X_fix for SS),
        never A_fix (OBJ-RT-6). Intervals are labelled by their simulated
        coverage, and the quantile basis (signed or |dev|) is stated.
        (d) Every data file and mechanical rule application names its
        permitted means (CD-12); anything else is a stop.
        (e) Manifests write instances_claimed and instances_verified
        explicitly, even when zero (F-1 of the 011cd0 validation).
        (f) ENGINE IDENTITY: C-1 runs on the build Part A's G-REPRO
        validated (38be58dad plus EC-A1 only; EV-PFDR-f6b76c
        claim_boundaries.solver_and_version). Main has moved since, so the
        draft requires an identity check of every engine file on the merged
        tree before dispatch.
        (g) REVIEW REQUIREMENTS: a blind re-derivation of the per-rung
        counts, bounds and growth slope from rows; a proves-too-much control
        (known-null and random-as-structured ladders must show no growth,
        and the planted-growth ladder must show it); one owner per joint.
        (h) SS statements carry their P0 estimation scope label, as in
        TASK-20261002-33047e DS-7.
    - id: DS-11
      text: >-
        RUNNABLE-GATE READINESS (AGENTS.md "Approval is bounded by
        execution"). The draft names the exact prospective paths of the
