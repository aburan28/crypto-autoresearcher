handoff:
  id: TASK-20260801-808
  from: coordinator
  to: coordinator
  objective: >-
    Commit and verify the exact BATCH-004 producer artifacts — the OD-4
    branching-bound package (TASK-20260801-806) and the OD-3 / D-705-5 hole (ii)
    package (TASK-20260801-807), eight artifacts in total — before any
    independent review or red team reads them.
  uncertainty_reduced: >-
    Whether the validator and the red team inspect an immutable, source-bound
    producer snapshot rather than a mutable working tree; and whether any
    derivation, bound or negative closure that a later decision might rest on
    exists as a COMMITTED artifact BEFORE the decision that relies on it, as
    docs/claims-and-verification.md "Refutation artifacts" requires. Also whether
    each producer's PRE-SCREEN artifact was frozen before its derivation, which
    cannot be checked once the tree moves.
  inputs:
    - The four TASK-20260801-806 artifacts
    - The four TASK-20260801-807 artifacts
  constraints:
    - >-
      Run alone. No other task may hold the Git index or HEAD concurrently.
    - >-
      Stage ONLY the eight declared producer artifact paths and this task's own
      receipt path. A scope-expanding commit blocks downstream review; it is an
      evidence-integrity failure, not a research result.
    - >-
      The commit message names TASK-20260801-806, TASK-20260801-807,
      TASK-20260801-808 and GOAL-AES-001.
    - >-
      INFERENCE AND PROVENANCE GATE, PER ARTIFACT CLASS, IN THE IDENTICAL
      LANGUAGE THE PRODUCER CARDS CARRY. Verify BEFORE committing that every
      declared producer artifact carries a filled `inference` block (policy,
      requested_policy, resolved model identifier, fallback_used, model_verified)
      and the standing basis 0137a051eb5828789eb267fa83c8278086578d4c; and, under
      protocol-amendment-GOAL-AES-001-004 PART B which clarifies
      protocol-amendment-GOAL-AES-001-002 per artifact CLASS: every SOURCE-CODE
      artifact additionally carries a comment-block inference stanza in its own
      text; every MACHINE-READABLE MANIFEST carries a full inference block as a
      first-class field AND an `artifact_provenance` list with one entry per
      declared artifact of its task carrying path, kind, sha256,
      comment_block_inference_stanza and covered_by_this_manifest_inference_block;
      every PROSE REPORT carries EITHER an in-text inference block OR a
      provenance pointer naming its covering manifest, BOTH FORMS BEING EQUALLY
      COMPLIANT AND NEITHER PREFERRED. A missing or partial block, a missing
      artifact_provenance list, or a digest that does not match the committed
      bytes is a COMPLETION-GATE FAILURE at dispatch: the producing task is
      returned as incomplete rather than snapshotted, with the defect named
      concretely. Do not waive it and do not refer it forward. THE PER-CLASS
      FORMULATION IS THE POINT: it closes D-803-1, the drafting ambiguity that
      forced a dispatch-time ruling in BATCH-003, so no ruling of that kind is
      needed here and none may be improvised — if a case arises that Part B's
      four classes do not cover, record it as a NEW referred defect and do not
      invent a class.
    - >-
      Recompute each declared artifact's SHA-256 yourself and confirm it matches
      the `artifact_provenance` entry asserted by its covering manifest. A
      provenance list that does not match the bytes is a defect, not a formality.
    - >-
      VERIFY THE PRE-SCREEN FREEZE, which is this batch's distinctive gate and
      cannot be checked later. Confirm that each producer's pre-screen artifact
      (prescreen_od4.json, prescreen_od3.json) exists, is marked as written
      before any derivation or compute with a timestamp, carries a verdict for
      every candidate, and that no candidate recorded IN_SCOPE_VACUOUS was
      pursued in the accompanying report. If a pre-screen is missing, unmarked,
      or contradicted by the report, that is a COMPLETION-GATE FAILURE and the
      producing task is returned as incomplete. Note honestly in the receipt that
      a timestamp inside a producer-written file is NOT auditable from committed
      bytes alone — the BATCH-003 V-804-2 lesson — and record what you could and
      could not verify.
    - >-
      Do not write the commit's own SHA into any artifact inside that commit; the
      dispatch verifier binds the receipt to Git after the commit. Record the
      parent SHA and PERFORM the follow-on commit_sha / parent_sha binding write,
      as TASK-20260801-803 did (closing the D-705-6 shape) rather than as
      TASK-20260731-704 did not.
    - >-
      Create NO evidence, decision, hypothesis, or knowledge record in this task.
      This is a snapshot archive, not a ledger archive: record_ids is empty.
    - >-
      Do not repair, edit, extend, or re-run any producer artifact to make it
      pass. Defects are recorded and returned, never fixed here.
    - >-
      Do not modify any BATCH-001, BATCH-002 or BATCH-003 committed artifact.
  deliverables:
    - snapshot-receipt.json
  artifact_paths:
    - coordination/goals/GOAL-AES-001/batches/BATCH-004/archives/TASK-20260801-808/snapshot-receipt.json
  archived_by: TASK-20260801-808
  inference:
    policy: coordinator-archive
    requested_policy: coordinator-archive
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
    standing_basis: >-
      inference-amendment commit 0137a051eb5828789eb267fa83c8278086578d4c.
      Cross-model independence is unavailable campaign-wide; nothing produced
      here may be treated as a closure attestation.
  budget:
    wall_clock_seconds: 350
    memory_gb: 1
    maximum_runs: 1
  budget_basis: >-
    Calibrated against the 179 s, 215 s and 378 s measured snapshot archives, set
    at the top of that range because this archive verifies eight artifacts under
    a per-artifact-class provenance gate and additionally verifies two pre-screen
    freezes.
  completion_gate:
    - >-
      Every one of the eight producer artifacts carries a filled inference block
      AND satisfies protocol-amendment-GOAL-AES-001-004 Part B for ITS OWN
      ARTIFACT CLASS, or the offending producer task is returned as incomplete
      and NOT snapshotted, with the defect and the class named.
    - >-
      Each artifact's recomputed SHA-256 matches the artifact_provenance entry
      asserted by its covering manifest, and the receipt records both values for
      every artifact.
    - >-
      Both pre-screen artifacts exist, are marked as written before derivation,
      carry a verdict for every candidate, and are not contradicted by their
      reports; the receipt records exactly what was and was not independently
      verifiable about the freeze.
    - >-
      Git verifies the commit is reachable from HEAD, has the expected parent,
      changes exactly the declared paths, and matches the recorded SHA-256
      hashes.
    - >-
      The receipt names the two source task IDs, the archive kind `snapshot`, the
      parent SHA, and a SHA-256 for every committed path; record_ids is empty
      because a snapshot archive commits no ledger record.
    - >-
      The commit_sha / parent_sha binding write prescribed by the receipt is
      actually performed after the commit.
  return_format: >-
    The snapshot receipt, plus a plain statement of the commit SHA, its parent,
    the count of paths committed, the per-artifact-class provenance verdict for
    all eight artifacts, and the pre-screen freeze verdict for both producers
    including what could not be verified from committed bytes.
