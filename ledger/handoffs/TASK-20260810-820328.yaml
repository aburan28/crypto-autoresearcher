      measurement. The dominant cost is exact m = 3 sum-set enumeration over the
      conductor-arm vertices plus one Velu ell-isogeny graph construction per class
      at ell = 107 (degree-107 kernels, the heaviest single item); the T5 walk is
      negligible at 37 vertices. Exhausting any figure is a BUDGET EVENT under
      AGENTS.md rule 5, reported as such, and NEVER as a null level effect and
      NEVER as an unreachable T5 verdict.

  completion_gate:
  - >-
    SR1 passes -- the p = 4001 2-volcano is rebuilt by Velu and reproduces
    {0: 3, 1: 9, 2: 18, 3: 36, 4: 72} exactly, matching h(D_0 f'^2) at every level,
    with the two_torsion_x_count / ell_subgroup_count(., 2) agreement reproduced on
    all 138 curves -- or the run stops, records INVALID, and returns the defect.
  - >-
    SR2 passes -- the N = 19507 family and the t = 211 class structure are
    re-derived, #E = 19507 verified PER CURVE, completeness certificates obtained --
    or the run terminates PREMISE-FAILED.
  - >-
    SR3 passes -- targets_B support certified equal to the enumerated E(F_p) on
    every measured vertex, with any non-exact certificate listed individually, and
    there must be none.
  - >-
    SR4 ordering is honoured -- the f = 1 arbitrary-halves matched-null verdict is
    computed and WRITTEN TO THE RUN RECORD before the real level contrast is read,
    and it shows no effect.
  - >-
    SR5 ordering is honoured -- the enumerated per-level vertex counts and the
    detection floor they imply are computed and written BEFORE any level effect is
    reported.
  - >-
    Per-level means and standard deviations are reported for every conductor-arm
    class at every density row and every r stratum, with the exact r-against-level
    contingency table per class, and with the crater's individual per-vertex values
    listed against the full floor distribution rather than summarised by a mean.
  - >-
    The T5 walk is run from at least the eight declared seeds with the FULL
    per-seed distribution reported -- every value listed, plus minimum, median and
    maximum -- and the local rational-107-isogeny test is evaluated on EVERY vertex
    of the t = 211 class, with every disagreeing vertex listed individually.
  - >-
    At least one T1 transport certificate between crater and floor is emitted and
    independently re-verified.
  - >-
    The run emits BOTH frozen verdicts -- a LEVEL verdict in {LEVEL-EFFECT,
    NO-LEVEL-EFFECT, NOT-RESOLVABLE} and a T5 verdict in
    {reachable_by_commonness, reachable_by_local_test, both, neither} -- computed
    inside the run and written to verdict.json and t5-verdict.json, never selected
    afterwards, with the LEVEL verdict NOT READ before the SR6 instrument gate is
    satisfied.
  - >-
    NULL-C appears nowhere; targets_uniform appears nowhere; no 2-torsion proxy is
    used as a level or crater variable; the saturated row is not reported alone.
  - >-
    `python3 tools/check_run_source_provenance.py --experiment EXP-VOLC-9f5571
    --strict` passes for every run.
  - >-
    The stage-1 geometry report is returned to the Coordinator as soon as Stage 1
    completes, so TASK-20260810-c98659 Phase B can start.
  - >-
    The execution report names every deviation, every dropped vertex with its
    reason, every infrastructure failure, and interprets nothing.

  return_format: >-
    The run directories, the stage-1 geometry report (returned early), and the
    execution report at the paths above. State the emitted LEVEL and T5 verdicts
    and the numbers that produced them, and STOP THERE. Do NOT write an evidence
    record, do not move any hypothesis status, and do not characterise what the
    verdicts mean for RQ-VOLC-f6253b, H-VOLC-dff1f8 or GOAL-ENDO-001 -- those are
    Coordinator acts on a later ledger archive after independent review.
    NO-LEVEL-EFFECT IS A RESULT and is reported exactly as fully as LEVEL-EFFECT:
    per falsification criterion F5 it strengthens DECOMPOSITION.md section 5
    prediction 2 at depth 1 on a matched-order family, and the deliverable must
    then carry the per-level counts, the implied detection floor, the matched-null
    verdict, the r-against-level contingency tables, the full density profile, the
    T5 walk distribution, the local-test result, and a named successor with its
    cost. A T5 verdict of `neither` IS ALSO A RESULT -- it kills the lane on cost,
    which DECOMPOSITION.md section 3 warns is the likely outcome, and it is
    archivable as such. If the matched null fires (F4), say so first and withdraw
    every level result; the deliverable is then the instrument finding. If SR10
    fires, STOP and escalate before writing the number anywhere.

  scope_and_honesty: >-
    claim_tier toy. One matched group order N = 19507 (about 14.25 bits), primes
    near 2^14.3, within-class volcano DEPTH 1 ONLY, a 37-vertex T5 class, plus the
    committed p = 4001 class used SOLELY as a gate on the Velu construction and not
    as a measurement. NO ATTACK, NO EXPONENT, NO SPEEDUP. sota_delta ZERO on every
    axis. dominated_by parallel Pollard rho with distinguished points at
    0.886 sqrt(N) group operations and O(1) memory (KN-TECH-001, KN-TECH-006) and,
    on CM curves, its automorphism-discounted variant (KN-TECH-018), under which
    any factor at or below sqrt(6) which is about 2.449 is BASELINE CALIBRATION and
    never an attack. NO TRANSFER IS CLAIMED to depth greater than 1, to a second N,
    to relation-collection COST as opposed to density, to reachability at any
    larger scale, or to the ECDLP in the prime-order subgroup. A VARIANCE RESULT IS
    NOT AN ATTACK: T5 is binding, and any T5 verdict other than `neither` is a
    statement about a 37-vertex volcano that must be reported alongside the fact
    that at cryptographic scale the corresponding problem is CSIDH vectorization,
    about p^{1/4} classically at best.

