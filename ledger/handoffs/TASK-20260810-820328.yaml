  constraints:
  - >-
    THE CONTRACT IS FROZEN AND IS READ-ONLY TO THIS TASK. Every threshold,
    definition, grid, seed and prediction in
    experiments/EXP-VOLC-9f5571/specification.yaml binds as written. Any change
    requires a versioned protocol_amendment authored by the COORDINATOR under
    experiments/EXP-VOLC-9f5571/amendments/ and filed BEFORE the affected data is
    generated. The executor does not write amendments.
  - >-
    SR1 VELU GATE RUNS FIRST AND COSTS MINUTES. Rebuild the committed p = 4001,
    t = 30 2-volcano by Velu and reproduce the true level distribution
    {0: 3, 1: 9, 2: 18, 3: 36, 4: 72} EXACTLY, matching h(D_0 f'^2) at every level,
    and reproduce the agreement of two_torsion_x_count with
    ell_subgroup_count(., 2) on all 138 curves. IF IT FAILS, STOP -- the level
    machinery is wrong and nothing downstream is interpretable. Run INVALID,
    returned as a defect; it is not evidence about levels.
  - >-
    SR2 FAMILY GATE. Re-derive the N = 19507 family and the t = 211 class structure
    under this run's own immutable record. THE INVENTORY IN THE DESIGN DOCUMENT IS
    DERIVED IN A DESIGN SESSION BY A SCRIPT WITH NO RUN RECORD, NO MANIFEST AND NO
    INDEPENDENT VERIFICATION -- it is NOT evidence and no decision rule may depend
    on it until re-derived. Verify #E(F_p) = 19507 PER CURVE, not per class, and
    obtain a completeness certificate per class. Disagreement terminates
    PREMISE-FAILED.
  - >-
    THE DEURING CAVEAT IS BINDING. For D_0 = -3 the Deuring correspondence weights
    j = 0 by 1/3, so h(-3 * 107^2) = 36 is a CROSS-CHECK ON THE FLOOR and not a
    vertex count for the class. The authority on the exact vertex count is the
    campaign's own Hurwitz-Kronecker enumeration
    (harness/isogeny_class.py class_census), not the class number and not the
    design document.
  - >-
    THE VOLCANO IS BUILT BY VELU ISOGENIES. Explicit Velu ell-isogeny graph at
    ell = 3 and ell = 107, kernels from rational ell-torsion, edges resolved up to
    the isomorphism (a, b) ~ (u^4 a, u^6 b), level assigned by distance to the
    floor. two_torsion_x_count and ell_subgroup_count(., 2) are PROHIBITED as level
    or crater variables anywhere in this experiment -- they are
    character-for-character the same expression and resolved 2 of 5 levels on the
    committed p = 4001 class, reporting {1: 72, 3: 66} where 66 is levels 0-3
    POOLED. Using either as a level variable is an invalidation rule.
  - >-
    SR3 SUPPORT GATE. Use harness/exp_icinv_fullgroup.py targets_B and certify its
    support EQUAL to the enumerated point set of E(F_p) on every measured vertex
    before any rate is recorded. A single failure terminates PREMISE-FAILED.
    exp_icinv.targets_uniform is PROHIBITED in every arm. This is a refusal to
    reuse a sampler whose estimand is under dispute; IT IS NOT A POSITION ON
    H-ICINV-6c7920, which stays `specified` and is neither presumed true nor false,
    and no output may present it as one.
  - >-
    SR4 NULL FIRST, AND THE ORDERING IS PART OF THE PROTOCOL. The f = 1 matched
    null -- a class of the same matched-order family, which has NO level axis by
    construction, split into two arbitrary declared halves of the same sizes as the
    real levels, run through the identical level comparison -- is computed and
    WRITTEN TO THE RUN RECORD before the real level contrast is read. IF IT SHOWS
    AN EFFECT, every level result here is withdrawn and the deliverable is the
    instrument finding.
  - >-
    SR5 FLOOR BEFORE EFFECT. The chi-square dispersion detection floor implied by
    the ACTUAL enumerated per-level vertex counts and target count is computed and
    written BEFORE any level effect is reported. NO EFFECT BELOW ITS OWN FLOOR MAY
    BE DESCRIBED AS AN EFFECT. Reporting a level effect without that floor is an
    invalidation rule.
  - >-
    SR6 INSTRUMENT GATE, BLOCKING. See dependency_note.
  - >-
    SWEEP THE DENSITY GRID; THE SATURATED ROW IS NEVER REPORTED ALONE. The
    committed within-class over-dispersion decays from 2.037 at density 0.5306 to
    0.930 at 0.0234 and the m = 3 operating density is 1/m! which is about 0.167.
    Report the lowest and highest rows explicitly alongside the operating row so an
    effect that exists only at saturation is visible as such.
  - >-
    STRATIFY ON r = #{x in F_p : x^3 + a x + b = 0}, report every statistic per
    stratum as well as pooled, and emit the EXACT r-against-level contingency table
    per class. IF r IS ASSOCIATED WITH LEVEL, the level effect and the r effect are
    CONFOUNDED within that class and the record must say so rather than attributing
    the difference to the endomorphism ring.
  - >-
    THE T5 WALK IS A DISTRIBUTION, NEVER A POINT ESTIMATE. Run from at least the
    eight declared seeds, record the number of steps to FIRST reach a crater vertex
    PER SEED, and report every per-seed value together with the minimum, median and
    maximum. A point estimate, or fewer than the declared seed count, is an
    invalidation rule. This directly discharges committed failure mode N5, where a
    94.7%-of-ceiling walk result was withdrawn because it rested on a single draw
    while the 8-seed mean sat on the ceiling.
  - >-
    C-LOCAL-EXHAUSTIVE. The count of F_p-rational 107-isogenies is evaluated on
    EVERY vertex of the t = 211 class and compared against its Velu-assigned level.
    THE COUNTS ARE MEASURED, NOT ASSUMED FROM THE TEXTBOOK. Every vertex whose
    count disagrees with its level is listed individually; ONE disagreeing vertex
    refutes HEUR-VOLC-1 and branch (ii) is then not available.
  - >-
    C-TRANSPORT-CERT. gcd(107, 19507) = 1 with N prime, so T1 transport carries the
    ECDLP between crater and floor with the SAME k. Emit at least one explicit
    transport with a certificate RE-VERIFIED INDEPENDENTLY of the transport code
    (docs/claims-and-verification.md).
  - >-
    THE IDENTIFIABILITY CEILING IS DECLARED IN ADVANCE AND MUST BE RESTATED IN THE
    OUTPUT. Within a class every regressor is a function of the single integer f_E,
    so the effective sample size of a level regression is the number of LEVELS, and
    the maximal-order level is always the smallest. Within-class depth in this
    family is 1, so the level axis is a crater-versus-floor contrast and nothing
    deeper; f = 1 classes have no level axis at all; the f = 107 crater has ONE
    vertex, supporting a rank statement and no variance statement. DEPTH GREATER
    THAN 1 IS UNTESTED BY THIS CONTRACT and the named successor is a matched-order
    family with greater depth.
  - >-
    THESE RESULTS ARE NEVER POOLED with EXP-JINV-bd141d's, and the between-class
    |D_0| contrast is NOT run here. Either is an invalidation rule.
  - >-
    SR10 BASELINE PAUSE, ESCALATE DO NOT PROCEED. If any level or crater/floor
    ratio appears to exceed the automorphism-discounted rho baseline, STOP and
    escalate to the Coordinator. GOAL-ENDO-001 pause condition P3 requires an
    independent review-adversarial session before any record states the excess, and
    review-breakthrough at max effort before any record calls it a break. Do not
    write the excess into a report, a log summary or a commit message before that
    escalation is answered.
  - >-
    A LEVEL-EFFECT VERDICT PAIRED WITH A T5 VERDICT OF `neither` IS NOT AN ATTACK
    AND MUST NOT BE REPORTED AS ONE. The minimiser is then unreachable and the lane
    dies on cost. Any T5 verdict other than `neither` is scoped to this 37-vertex
    class ONLY and must carry the mandatory statement that at cryptographic scale
    reaching a SPECIFIED curve is the CSIDH vectorization problem, about p^{1/4}
    classically at best, and that nothing measured here transfers.
  - >-
    DO NOT EDIT harness/exp_icinv.py. It is READ-ONLY. All new code -- including
    the new Velu ell-isogeny graph builder for general odd ell -- goes under
    harness/exp_volc_9f5571/, which is this task's own declared write scope, over
    harness/isogeny_class.py, harness/toycurve.py and
    harness/exp_icinv_fullgroup.py.
  - >-
    SOURCE PROVENANCE IS BLOCKING (the standing A6 precondition carried from
    EXP-ICINV-4d33aa amendment v2). Every run manifest must pin the hash of every
    source file executed, via harness/runner.py source_provenance(), and
    `python3 tools/check_run_source_provenance.py --experiment EXP-VOLC-9f5571
    --strict` must pass before any run is considered complete.
  - >-
    NO TRANSCRIBED REFERENCE VALUES. Every value quoted from a committed record --
    the true level distribution {0: 3, 1: 9, 2: 18, 3: 36, 4: 72}, the density-decay
    table, the detection-floor table, any figure delivered by EXP-INSTR-36c8cf --
    must be READ FROM THAT RECORD AT RUN TIME and bound by a source_sha256.
    Transcription at any precision is PROHIBITED and makes the run INVALID
    (EXP-ICINV-4d33aa amendment v2 change A4, CORR-20260807-a24675). This applies
    to every figure quoted in this handoff.
  - >-
    COMPUTE THE EXACT SUM SETS ONCE per (vertex, factor-base size) and reuse them
    across every seed, density row and statistic. Contract requirement, not an
    optimisation.
  - >-
    CONCURRENCY. See concurrency_note. This task runs ALONE. Do not start, spawn or
    parallelise any other BATCH-d7e255 task, and keep this task's own internal
    parallelism low enough that it does not add to a host already at load average
    21.6 / 25.8 / 40.2 on 14 cores.
  - >-
    THE EXECUTOR NEVER INTERPRETS RESULTS. Produce run records and an execution
    report of what ran, what did not, every deviation and the emitted verdicts. Do
    not characterise what they mean for RQ-VOLC-f6253b, H-VOLC-dff1f8,
    H-ICINV-6c7920, GOAL-ENDO-001's criteria, or the campaign.
  - >-
    THE EXECUTOR NEVER CHANGES A HYPOTHESIS STATUS. H-VOLC-dff1f8 stays
    `specified`. H-ICINV-6c7920 stays `specified`. H-ENDO-001 stays `approved` and
    is USED as the admissibility filter, not retested. H-STR-002 stays `weakened`
    with DEFER-BATCH009-001 OPEN and pause condition P2 respected -- this contract
    constructs no equivariant factor base and tests no phi-stable structure, so it
    bears on H-STR-002 in neither direction and no output may suggest it does. Only
    the Coordinator moves a status, on a committed ledger archive after independent
    review.
  - >-
    THE EXECUTOR NEVER COMMITS. Do not run `git commit`, `git push`, or any
    history-modifying git command. Workers do not commit into a shared worktree
    (AGENTS.md, "Durable research commits"); the Coordinator makes the isolated
    snapshot commit. Read-only git inspection is permitted and encouraged.
  - >-
    NO COMPLETION CRITERION MAY BE CLAIMED MET. Claim nothing about GOAL-ENDO-001
    C1-C4. Record no attestation and no closure quorum.
  - >-
    Never fabricate a command, output, timing, statistic or run. A measurement not
    taken stays missing and is reported as missing (AGENTS.md rule 9). A timeout,
    crash or OOM is failed_infrastructure, never negative evidence (AGENTS.md
    rule 5).
  - >-
    Mint every new identifier with `python3 tools/allocate_id.py --next <type>`
    and confirm it with `--check` before use. Do not grep for the next free
    number.
  - >-
    Fetch origin/main and compare it with this branch before the run manifests are
    written; record the base commit checked and the merge outcome in the execution
    report. Merge new main changes into the branch; never rebase pushed run
    records.
  - >-
    SESSION SURVIVAL. Write artifacts to disk as each gate completes -- after SR1,
    after SR2, after SR3, after the matched-null verdict, after the volcano graph,
    after each class measured, and after the T5 walk. Never hold results only in
    memory.
  - >-
    Lawful defensive cryptanalysis on public toy constructions only. N = 19507 and
    primes near 2^14.3, plus the committed p = 4001 Velu gate. No live key, wallet
    or deployed system is touched.

