  objective: >-
    Execute the frozen, approved contract at
    experiments/EXP-VOLC-9f5571/specification.yaml, version 1, exactly as written.
    Read that file IN FULL before writing any code; it is READ-ONLY to this task.
    Measure within-class relation density against the TRUE volcano level -- level
    assigned by explicit VELU ell-isogeny construction at ell = 3 and ell = 107 in
    the N = 19507 matched-order family, never by a 2-torsion proxy -- reporting
    per-level means and standard deviations alongside the detection floor implied
    by the ACTUAL enumerated per-level vertex counts; and evaluate the T5
    REACHABILITY GATE on the 37-vertex depth-1 107-volcano at t = 211, p = 19717,
    by both of its branches: commonness, as a per-seed distribution of steps to
    first reach a crater vertex, and locality, as the exhaustively measured count
    of F_p-rational 107-isogenies from every vertex. Emit both frozen verdicts, a
    LEVEL verdict and a T5 verdict, computed inside the run.

  uncertainty_reduced: >-
    Whether relation density varies with position on the isogeny volcano when the
    level is measured correctly rather than proxied -- the campaign's committed
    "volcano level" WAS the 2-torsion count and resolved 2 of 5 levels -- and,
    the question that decides whether any variance result is worth anything,
    WHETHER THE MINIMISER IS REACHABLE. A variance result is not an attack. Under
    T5 a cost-minimising vertex is useful only if goodness is common enough to hit
    by random walk or is decided by a LOCAL test evaluable at each step, and both
    branches are directly measurable on this 37-vertex class.

  dependency_note: >-
    THIS TASK IS BLOCKED BY TASK-20260810-c98659 (EXP-INSTR-36c8cf) UNDER
    GOAL-ENDO-001 CRITERION C4, AND THAT BLOCK IS ON READING AND REPORTING
    VERDICTS, NOT ON RUNNING. This is the contract's own SR6 INSTRUMENT GATE and
    its instrument_gate.blocking field, restated as a dispatch relation.

    WHAT MAY RUN BEFORE TASK-20260810-c98659 COMPLETES ITS PHASE B. Stage 1 in
    full -- SR1 Velu gate, SR2 family gate, SR3 support gate -- and SR4's
    matched-null verdict, SR5's detection-floor computation, and the measurement
    work itself. Stage 1 is also what PRODUCES the real geometry (the
    Velu-constructed volcano, the enumerated per-level vertex counts at ell = 3 and
    ell = 107, the T5 walk geometry) that TASK-20260810-c98659's Phase B REQUIRES
    under its own SR2; emit those artifacts and return them to the Coordinator as
    soon as Stage 1 completes, because Phase B cannot start without them.

    WHAT MAY NOT. DO NOT READ OR REPORT ANY LEVEL VERDICT until EXP-INSTR-36c8cf
    has delivered, AT THE ACTUAL PER-LEVEL VERTEX COUNTS OF THIS DESIGN, a
    measured detection floor and a measured matched-null false-positive rate for
    every statistic used here. An unmeasured control cell BLOCKS its conclusion; it
    does not pass it.

    THE T5 VERDICT IS NOT GATED BY C4 IN THE SAME WAY, AND THE DISTINCTION MATTERS.
    Branch (ii), the exhaustive per-vertex count of F_p-rational 107-isogenies, is
    an exact enumeration and not an estimate; branch (i) is a per-seed walk-length
    distribution reported in full, with a point estimate PROHIBITED. Report both
    branches and the T5 verdict as measured. Do not, however, pair a T5 verdict
    with an unread LEVEL verdict and present the combination as a finding -- the
    combination is what the Coordinator reads, after review.

    THE RESULTING ORDER, SERIALIZED. TASK-20260810-ab0a07 completes;
    TASK-20260810-c98659 Phase A completes; TASK-20260810-9c2e47 runs its Stage 1
    and measurement and returns; THIS TASK does likewise; TASK-20260810-c98659
    Phase B completes at the real geometries; only then is this task's LEVEL
    verdict readable.

    NULL-C IS PROHIBITED HERE ENTIRELY, IN EITHER DIRECTION, and that prohibition
    is not lifted by anything EXP-INSTR-36c8cf reports. It is a between-class MEAN
    detector with power 1.00 at a 0.9% shift and median p = 0.0590 at zero planted
    shift, disqualified for any within-class contrast by its own committed
    characterisation. A result quoting it is inadmissible regardless of what it
    says.

  concurrency_note: >-
    DISPATCHED STRICTLY ONE AT A TIME. This task runs ALONE. No other
    BATCH-d7e255 task may be running while it is.

    THE REASON, WITH THE MEASUREMENT THAT MOTIVATES IT. The execution host has 14
    cores and, at dispatch time, a load average of 21.6 over 1 minute, 25.8 over
    5 minutes and 40.2 over 15 minutes. It is already oversubscribed by other
    sessions. GOAL-ENDO-001's campaign_budget.max_concurrent is 6; THAT FIGURE IS
    NOT AUTHORIZATION HERE and is deliberately overridden downward to 1 for this
    batch. Sizing concurrency to what the machine can actually run without
    degrading is the dispatching Coordinator's responsibility (AGENTS.md,
    "Dynamic dispatch"), and the recorded cost of getting it wrong is
    GOAL-AES-003 BATCH-002 (DEC-20260802-b226fb, budget_accounting), which lost
    one producer's entire first segment and five of eight trials in another to
    exactly this condition.

    A TIMEOUT, STALL OR DEGRADED RUN CAUSED BY HOST LOAD IS AN INFRASTRUCTURE
    EVENT under AGENTS.md rule 5, recorded as failed_infrastructure with partial
    artifacts retained. IT IS NEVER NEGATIVE MATHEMATICAL EVIDENCE, IT IS NEVER A
    NO-LEVEL-EFFECT VERDICT, AND -- STATED SEPARATELY BECAUSE THIS CONTRACT'S OWN
    SR8 SINGLES IT OUT -- AN EXHAUSTED OR TRUNCATED WALK BUDGET IS NOT AN
    UNREACHABLE T5 VERDICT. The degree-107 Velu kernel construction is the heaviest
    single item here and is exactly the step a saturated host will stretch past its
    budget.

