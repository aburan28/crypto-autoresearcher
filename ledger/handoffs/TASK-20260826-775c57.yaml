  objective: >-
    Close BATCH-171407: compose the two sibling-blind independent reviews into ONE RULING AT THE
    EXACT TESTED SCOPE, file the evidence record EV-DIFFP-1e08cc and the closing decision
    DEC-20260826-e87b33, adjudicate completion criterion 4 from the two admissibility_ruling
    blocks CONJUNCT BY CONJUNCT, make the PROCEED-OR-PAUSE ADJUDICATION this batch's opening
    declared in advance, checkpoint the goal head ADDITIVELY with EXACTLY ONE next_action for this
    lane, and commit under a content_first ledger binding with the tools/validate_ledger.py and
    tools/check_review_independence.py outputs recorded verbatim.
  uncertainty_reduced: >-
    Whether the single differing cell RT-J8-4 measured replicates under an independent
    implementation; whether the consistent-pair family is constructible and whether it populates
    cells the existing family set cannot reach; whether any cell set in this goal now has a
    demonstrated TWO-DIRECTIONAL capacity; and, given all of that and an allocation that this
    batch exhausts, what the single most valuable next action is and whether this campaign
    proceeds, pauses or requires a user-authorised decision.
  inputs:
    - 'Both review reports, both construction indexes, both attestations and both admissibility_ruling blocks, plus the committed review plan they ran under.'
    - 'The snapshot receipt and the paths it binds, including its run-registration check and its concurrent-writer check.'
    - 'The producer''s execution report, its nine result artifacts and its independence-attestation.json.'
    - 'The SEALED Coordinator prior, part 1 and the part-2 addendum, read here for the first time and scored item by item under part 1''s own declared trigger rule.'
    - 'EV-DIFFP-afd96c and DEC-20260824-257f35 -- the obstruction block, the seven-way ranking with its revisit conditions, the corrections owed and the protocol_amendment owed.'
    - 'DEC-20260826-5aaddc -- this batch''s opening decision, its declared budget stop and its obligations_carried.'
    - 'The goal head, the research question, and the frozen contract EXP-DIFFP-f26790.'
  constraints:
    - 'RUNS ALONE, and stages only the declared paths. Do not stage dispatch_queue.json, claims/ or knowledge/INDEX.md.'
    - 'ledger/evidence is limited to EXACTLY ONE new file and ledger/decisions to EXACTLY ONE new file.'
    - 'EDIT THE GOAL HEAD ADDITIVELY ONLY, as a lane. Append this batch''s checkpoint, this lane''s entry and its own next_action line; never rewrite another lane''s entries.'
    - 'Merge origin/main before the archive (MERGE, NEVER REBASE), record the base and outcome, and push and refresh this lane''s PR after.'
    - 'VERIFY VALIDITY BEFORE INTERPRETING ANYTHING. An invalid or incomplete run set goes back to the Executor with concrete defects listed; it is not evidence. A timeout, crash or check_run rejection is INFRASTRUCTURE SIGNAL and never a mathematical result.'
    - >-
      COMPOSE, DO NOT COUNT. A blinded reviewer's scalar verdict is a lossy rollup the checker's
      schema requires; the per-joint maps govern. Where the two reports agree, the agreement is
      TWO observations only when mutual blindness demonstrably held for that object AND the two
      reached it BY DIFFERENT MECHANISMS; otherwise it is ONE observation reached twice, and the
      discount is stated AT THE POINT OF USE.
    - >-
      ADJUDICATE COMPLETION CRITERION 4 EXPLICITLY, FROM THE TWO admissibility_ruling BLOCKS,
      CONJUNCT BY CONJUNCT. It requires that BOTH sessions ADMIT. A `breaks` on an owned joint is
      not by itself a refusal of admission and an ADMIT on a conjunct is not an admission of the
      package; SILENCE ON A CONJUNCT IS NOT AN ADMISSION and reading it as one would be
      manufacturing one. IF THE CRITERION IS REFUSED A THIRD TIME, THAT IS A RESULT AND IS
      RECORDED AS ONE.
    - 'RULE ON THE ROUND''S INDEPENDENCE EXPLICITLY, from the attestations rather than from the plan''s intent, and compose every disclosed exposure rather than absorbing it. Check whether BR-14''s and BR-16''s fixes actually held and say so either way.'
    - 'RULE ON WHETHER THE REPLICATION IS INDEPENDENT IN ANY CHECKABLE SENSE, and weight a MATCHING count differently from a DIFFERING one because contamination pushes toward agreement and not away from it.'
    - >-
      SCORE THE SEALED PRIOR ITEM BY ITEM UNDER ITS OWN DECLARED TRIGGER RULE. Part 1 states in
      advance which items are scored individually in every case, which become VOID rather than
      wrong if the trigger fires, and which is CONFIRMED IN ITS STRONGEST FORM. HONOUR THAT RULE
      OR RECORD EXPLICITLY WHY NOT -- round 3's trigger fired and its addendum departed from it,
      and the close had to rule on the departure.
    - >-
      ADJUDICATE A GREEN TOOL AS CAREFULLY AS A FAILURE. tools/check_review_independence.py's leak
      test covers the RE-DERIVER ONLY, cannot check read order, and cannot see a prior embedded in
      a document it validates. A PASS IS NOT MECHANICAL VERIFICATION FOR BOTH REVIEWERS AND MAY
      NOT BE DESCRIBED AS ONE.
    - 'REPORT THE FORCED SETS, THE CELL TABLES AND THE COUNTS AS TABLES, NEVER AS A PASS AND NEVER AS A BARE FRACTION. Every count carries its denominator, its exclusions and its primitive scope.'
    - 'DO NOT CLAIM ANY PATH IS NEW, and do not let any NON-MEMBER verdict be written or implied as novelty. State the census''s completeness beside every verdict cited, never summed.'
    - 'Claim ceiling is `analyzed`. Do not round up and do not record `supported` on any record of this batch.'
    - 'THE MD5 LANE IS BLOCKED, NOT CLOSED. AMD-20260824-DIFFP-ACQ-1 stands unchanged and the Tier B unblocking route is intact.'
    - 'If any adverse transition is proposed, secure the strongest checkable refutation artifact the result admits FIRST -- counterexample certificate, then derivation note, then a declared empirical_only basis -- archive it before the decision, and record proof_status and proof_refs. `reject_scoped` on a single unreplicated empirical-only run is FORBIDDEN.'
    - >-
      MAKE THE PROCEED-OR-PAUSE ADJUDICATION EXPLICITLY AND DO NOT TAKE ANY OF ITS THREE OPTIONS
      UNILATERALLY. This batch declares the entire remaining allocation; a ceiling raise and a
      reallocation are both explicitly user-authorised decisions, and a pause is recorded with the
      machinery, the measurement and the gap. DO NOT RETIRE THE GOAL UNDER `closed_at_budget` TO
      UNDERSTATE A CRITERION THAT WAS MET.
    - 'A FAILING CONTROL, A REFUTED PRE-REGISTRATION, A GATED-NOT-RUN STAGE OR AN EXHAUSTED TASK BUDGET ENDS A TASK, NOT THIS GOAL. Preserve exactly one concrete next action for this lane.'
    - >-
      FILL knowledge_promotion. Promote a KN-FIND when the decision is `support` or
      `reject_scoped` on `replicated`/`strong` evidence, and otherwise record a concrete
      not_warranted reason. IF A PROMOTION IS WARRANTED YOU WILL NEED AN IDENTIFIER AND A DECLARED
      PATH THIS BATCH DID NOT PRE-ALLOCATE -- that constraint is named in DEC-20260826-5aaddc
      rather than discovered here, and if it binds, SAY THAT THE REASON IS THE MISSING IDENTIFIER
      AND NOT THE MERITS.
    - >-
      FILE OR ROUTE THE OBLIGATIONS THIS CAMPAIGN CARRIES: the five corrections C_1..C_5, the
      CTL-GRAPH-NULL protocol_amendment, and the goal-head garbled-sentence correction specified
      in DEC-20260826-5aaddc. A correction is OWED, not chosen, and an obligation that vanishes
      from the record is the failure.
    - 'If the round surfaced solver-validation work rather than instrument measurement, record the handoff to GOAL-MD5-001 explicitly rather than absorbing it.'
    - 'Record only checks this session actually ran, with their verbatim output. NEVER INVENT A COMMIT SHA; CORR-20260824-ad7f2c records what it costs when an assertion about a transmitted sha is wrong as well as the sha.'
    - 'knowledge/INDEX.md is GENERATED AND GITIGNORED and is never committed.'
    - 'WRITE EVERY PROSE VALUE AS A BLOCK SCALAR OR QUOTED THE FIRST TIME (BR-13).'
  deliverables:
    - 'ledger/evidence/EV-DIFFP-1e08cc.yaml -- with claim_tier, certificate_refs, proof_status and proof_refs, the observations as integers with the artifact each is read from, the boundaries, the unresolved confounds, and an obstruction block with its resource_check if anything is weakened or closed.'
    - 'ledger/decisions/DEC-20260826-e87b33.yaml -- the closing decision, with the validity check recorded before any interpretation, the sealed prior scored item by item under its own trigger rule, the forced sets and cell tables, the independence ruling, knowledge_promotion filled, the claim ceiling stated, the criterion-4 adjudication from the two admissibility_ruling blocks conjunct by conjunct, THE PROCEED-OR-PAUSE ADJUDICATION, a ranked next_action_ranking against real alternatives each with its evidence, test boundary, remaining uncertainty and concrete revisit condition, and explicit next_actions.'
    - 'The goal head checkpointed ADDITIVELY: the BATCH-171407 checkpoint, this lane''s entry, latest_verified_commit from a MEASURED value, and EXACTLY ONE next_action for this lane.'
