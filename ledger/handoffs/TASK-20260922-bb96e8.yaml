    - Verify the C9 disposal preserves horizon-2 numerics exactly by reading (loop expansion with constant 2 must yield the identical x1,x2 computations), or confirm the constants are removed with the stated reason and no dangling reference remains.
    - Confirm no scientific execution -- no runs/ directory, repair report attests zero runs, no panel-scoring or threshold logic was added, no kernel/trap/certificate numeric changed (spot-check the manifest hashes of untouched files against actual bytes).
    - Confirm the repair diff is confined to the repair write_scope (driver.py, transcripts.py and/or reference.py iff C9-wiring touched them, implementation-manifest.yaml hash entries plus annotation, repair-report.yaml).
    - Every finding cites exact file lines; every null carries its reason. No invented values.
    - Bedrock providers/endpoints/model identifiers/fallbacks/probes are prohibited. No network calls.
