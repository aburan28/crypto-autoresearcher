  constraints:
    - You are not alone. Own only the listed deliverable; preserve all other work and immutable source records. Do not read any executor session transcript or agent receipt directory; judge the repaired bytes and the repair report only.
    - Maximum runs is zero. Do not import or execute fixtures.py, kernels.py, transcripts.py, reference.py, or certificates.py. Reading implementation files as text and `python3 -m py_compile` are permitted. Exactly one refusal-path invocation of driver.main with NO bindings is permitted (must exit 2); any invocation with bindings supplied is forbidden.
