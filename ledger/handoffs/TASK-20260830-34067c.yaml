handoff:
  id: TASK-20260830-34067c
  from: coordinator
  to: executor
  objective: >-
    Execute the FROZEN, coordinator-approved contract EXP-MONO-a20e48
    exactly as written: implement generic F_{211^k} arithmetic for k=1..4
    (polynomial ring representation, NOT the sibling's ad hoc Fp2/Fp4
    towers), run the five-step base-change-ladder protocol on all six
    frozen battery objects (N1, N2, N2-twin, N3, N4, N5), and report R_k,
    the hand-derived U/L bounds transcription, and the Step-5 verdict per
    member. Pure Python 3 stdlib only. Record observations only; render no
    verdict on H-MONO-59f6a6.
  uncertainty_reduced: >-
    Whether the base-change ladder over F_{p^k} (k=1..4) correctly
    separates arithmetic from geometric monodromy on a battery of known
    objects at toy scale (p=211), and whether it correctly refuses
    (UNDECIDED) when no independent structural lower bound is available.
  inputs:
    - experiments/EXP-MONO-a20e48/specification.yaml (READ IN FULL -- it
      is ~930 lines and every battery member's parameters, forced values,
      and hand-derivations matter)
    - ledger/hypotheses/H-MONO-59f6a6.yaml
    - ledger/hypotheses/H-MONO-0b3def.yaml (N1's already-established D_4 result)
    - experiments/EXP-MONO-4c7479/specification.yaml and
      experiments/EXP-MONO-4c7479/implementation/ (N1's construction and
      the fp_common.py Fp/Fp2/Fp4 routines this contract's Stage-0 must
      cross-check its own generic F_{p^k} sqrt routine against at k=1)
    - knowledge/findings/KN-FIND-a8990a.md
    - docs/claims-and-verification.md
    - AGENTS.md
  constraints:
    - >-
      Follow experiments/EXP-MONO-a20e48/specification.yaml EXACTLY; it is
      frozen. Every battery member's concrete parameters (p=211, c=2,
      N2's a(e)=e/c*a(e)=2e, N2-twin's a(e)=e/b(e)=e+1, N4's Y^3-2, N5's
      quintic scoping) are fixed -- do not substitute or "improve" them.
    - >-
      Pure Python 3 standard library ONLY. No sympy, sage, numpy, g6k, or
      fpylll. Any import of a forbidden module invalidates the run.
    - >-
      F_{p^k} MUST be implemented as the generic polynomial-ring
      representation `field_arithmetic_representation` specifies
      (F_p[x]/(m_k(x)) for a fixed irreducible m_k found by the specified
      trial search), NOT as ad hoc quadratic towers. Frobenius must be a
      genuine p-power map via polynomial modular exponentiation, with the
      required Frob^j-computed-two-ways cross-check.
    - >-
      Stage 0 gates everything: verify p=211's primality and all stated
      congruences, verify c=2's non-square/non-cube properties, run the
      m_k(x) irreducibility search for k=2,3,4 and record the winning
      polynomial, and cross-check the generic F_{p^k} sqrt routine against
      fp_common.py's plain sqrt_mod at k=1. Any failure here is
      `failed_infrastructure`, never mathematical evidence.
    - >-
      N1's census MUST reproduce EXP-MONO-4c7479's own class histogram
      exactly at k=1 on the same base points (the `reproduction_check`
      control) before its k=2,3,4 ladder steps are interpreted.
    - >-
      IF N1 IS OBSERVED TO DROP AT ANY k (R_k < 8): do NOT report this as
      a routine negative. Flag it explicitly and prominently as the
      run's headline finding per the spec's `stopping_rules`, and
      distinguish (to the extent possible) whether it looks like a defect
      in this contract's own ladder machinery versus a genuine anomaly --
      but do not resolve that question yourself; report the observation
      and both candidate readings for Coordinator/reviewer disposition.
    - >-
      N5's Step-5 verdict is FORCED UNDECIDED at every k regardless of how
      well its measured density profile matches the S_5 Chebotarev law --
      do not let a good density match tempt you into reporting DECIDED.
    - >-
      The labelling convention (lexicographic order on coefficient
      tuples) must be applied consistently across all k for a given
      member, per `field_arithmetic_representation.total_order_for_labelling`.
    - >-
      No hypothesis, experiment, or goal status change. No relation-rate,
      ECDLP, cost, or exponent claim of any kind, in either direction.
    - >-
      Any timeout, crash, or construction failure is `failed_infrastructure`,
      never negative mathematical evidence (AGENTS.md rule 3).
    - Exactly 2 runs; deterministic except where the spec explicitly calls for sampling (k>=2 census cells, N3/N5 draws), each with its own stated seed rule.
  deliverables:
    - experiments/EXP-MONO-a20e48/implementation.md
    - experiments/EXP-MONO-a20e48/implementation/ (source code)
    - experiments/EXP-MONO-a20e48/runs/RUN-MONO-a20e48-1/
    - experiments/EXP-MONO-a20e48/runs/RUN-MONO-a20e48-2/
    - execution_report.yaml (per docs/evidence-and-reproducibility.md)
  artifact_paths:
    - experiments/EXP-MONO-a20e48/implementation.md
    - experiments/EXP-MONO-a20e48/implementation/
    - experiments/EXP-MONO-a20e48/runs/RUN-MONO-a20e48-1/
    - experiments/EXP-MONO-a20e48/runs/RUN-MONO-a20e48-2/
  archived_by: TASK-20260830-81f632
  inference:
    policy: executor-implementation
    reasoning_effort: medium
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
    reasoning_effort_basis: >-
      Bound by .claude/agents/executor.md effort medium and
      orchestration/roles.yaml role executor -> default_policy
      executor-implementation -> reasoning_effort medium. Bounded,
      spec-following implementation of an already-fully-designed contract;
      not design or ideation.
  budget:
    wall_clock_seconds: 1800
    memory_gb: 1
    maximum_runs: 2
  completion_gate:
    - >-
      Stage 0: p/c verification, m_k(x) search log (k=2,3,4), and the
      k=1 sqrt cross-check against fp_common.py all reported before any
      Stage-1/2 census runs.
    - >-
      N1's reproduction control checked before its ladder steps are
      interpreted.
    - >-
      R_k reported for all six members at k=1..4 (N3 at all four k, no
      verdict machinery; N5 at all four k with forced UNDECIDED).
    - Sample-size and labelling controls reported.
    - >-
      Any N1 drop flagged prominently per the handoff's own constraint
      above, not buried as a routine data point.
    - >-
      Run manifests bind git commit, dirty flag, seeds, environment
      (confirming stdlib-only), timing, resources, per
      docs/evidence-and-reproducibility.md, using the NESTED manifest
      schema (run.status/code/environment/inputs/timing/result -- see
      experiments/EXP-MONO-4c7479/runs/*/manifest.yaml for the exact
      required structure; a flat manifest will fail ledger validation
      and require correction before archiving).
  return_format: >-
    Executor execution_report.yaml per docs/evidence-and-reproducibility.md:
    Stage 0 results, per-member R_k tables and verdicts, control outcomes,
    any anomalies -- with any N1 drop reported prominently as specified
    above. Observations only -- no verdict on H-MONO-59f6a6, no status
    change.
