handoff:
  id: TASK-20260801-036
  from: coordinator
  to: coordinator
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-024
  objective: >-
    Commit the exact TASK-20260801-035 driver, implementation note, calibration run package and
    calibration results alone, with this receipt, and BIND DRIVER_SHA256 AND
    EQD_DRIVER_SHA256_VERIFIED IN THE RECEIPT. This is the calibration snapshot ATS-DEP-1.5 and
    CTRL-DEP-DRIVER-HASH refer to - the measurement arm at TASK-20260801-042 must execute a file
    with exactly this hash, and a code change between the stages would otherwise be an undetected
    route to tuning.
  uncertainty_reduced: >-
    Whether the calibrated instrument, including the exact code that produced it and the exact
    imported code it depends on, is immutable and reproducible before the reading rule is frozen
    against it.
  inputs:
  - TASK-20260801-035 artifacts
  constraints:
  - 'RUN ALONE. Stage exactly declared_commit_sets.TASK-20260801-036_snapshot - 14 paths.'
  - >-
    The 14 include experiments/EXP-DEP-001/implementation/dep001_driver.py and
    implementation.md, which command.txt and manifest.yaml point at. Staging fewer would attest a
    non-reproducible run package.
  - >-
    The receipt must record DRIVER_SHA256 for dep001_driver.py and EQD_DRIVER_SHA256_VERIFIED for
    the imported EXP-EQD-001 driver as explicitly named fields, so both hash controls are
    checkable by the Validator from the receipt alone.
  - >-
    Do not stage ledger/goals/GOAL-ECDLP-001.yaml, ledger/hypotheses/H-DEP-001.yaml,
    experiments/EXP-DEP-001/specification.yaml, reading_rule.yaml, dispatch_queue.json, any
    EXP-EQD-001, EXP-DS-001 or EXP-SMTH-001 artifact, FAEST or XEDN.
  - >-
    Commit message must contain TASK-20260801-036, TASK-20260801-035, EXP-DEP-001,
    RUN-DEP-001-calib, GOAL-ECDLP-001, BATCH-024.
  - Do not push from this task.
  - >-
    State no interpretation and no disposition in the receipt, and do not record any threshold.
    This receipt archives an instrument measurement that is expressly non-evidential about every
    hypothesis.
  deliverables:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/archives/TASK-20260801-036/snapshot_commit_receipt.json
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/archives/TASK-20260801-036/snapshot_commit_receipt.json
  archived_by: TASK-20260801-036
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 900
    memory_gb: 1
    maximum_runs: 1
  completion_gate:
  - >-
    Post-commit verifier accepts exact declared paths, parent and hashes; DRIVER_SHA256 and
    EQD_DRIVER_SHA256_VERIFIED recorded as named fields; no interpretation and no threshold in
    the receipt.
