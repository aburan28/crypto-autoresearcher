    h_-(h_+-1)n_+ + h_+(h_--1)n_-, zero iff h_+=h_-=1). Two independent
    reviewers proved that adding "max(h_+,h_-)>=2" to the filter GUARANTEES
    D_sum != D_prod on whatever curve is found. Your job: re-run the same
    kind of test with this corrected filter. Read
    `experiments/EXP-MONO-98abb2/implementation/run_bivariate_test.py` in
    full — it is your starting point, and needs only the Stage-0 filter
    changed (add the max(h_+,h_-)>=2 condition) plus one new sanity check.

  what_to_do:
    - >-
      STAGE 0: adapt the prior search (same fixed ascending order: primes
      in [101,2000], A ascending, B ascending, first hit taken) to require
      Z=3 AND h_+ >= 1 AND h_- >= 1 AND max(h_+, h_-) >= 2 (i.e. exclude
