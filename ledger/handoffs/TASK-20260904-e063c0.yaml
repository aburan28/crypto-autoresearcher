      a specification_error -- do not proceed to Stage 1 or Stage 2. This
      would indicate a bug in the identity or your own implementation of
      it, not a valid experimental outcome.
    - >-
      STAGE 1: exhaustive census of the distinct-split (Z=3) residual
      stratum exactly as the prior experiment did (reusing
      `EXP-MONO-0e6e8f/implementation/run_uncond_census.py`'s own
