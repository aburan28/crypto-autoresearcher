      any specific (A,B) pair from any prior review. Disclose the exact
      number of (A,B) pairs examined before success, or exhaustion.
    - >-
      PRE-STAGE-1 SANITY CHECK (M6, new): before running Stage 1, compute
      D_sum and D_prod from the found curve's own (n_+, n_-, h_+, h_-) and
      explicitly verify D_sum != D_prod (equivalently, verify
      h_-(h_+-1)n_+ + h_+(h_--1)n_- != 0). If this check FAILS (i.e. they
