      counts.
    - >-
      STAGE 2: compare Stage 1's observed counts against BOTH D_sum's and
      D_prod's own predicted #1^4 and #2+1+1 (already computed in the
      sanity check step). Report R1_sum, R2_sum, R1_prod, R2_prod all
