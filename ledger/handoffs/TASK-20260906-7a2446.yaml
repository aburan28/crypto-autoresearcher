    commands over exactly the declared paths (goal-head
    runtime_constraint_note), verifies the commit against Git, backfills
    commit_sha / parent_sha / path_sha256 into this queue's archive block
    in a separate follow-up commit, pushes the branch and refreshes the PR
    naming EXP-ECDLP-612fb1, EXP-ECDLP-869870, TASK-20260906-3623b9,
    TASK-20260906-d17254 and TASK-20260906-7a2446. No status change; no
    interpretation; a package that is incomplete, dirty or fails
    verification blocks review and is an evidence-integrity failure, never
    a mathematical result.
  uncertainty_reduced: >-
