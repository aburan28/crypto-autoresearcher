    - >-
      THIS ENVIRONMENT HAS DEMONSTRATED THREE CONTAINER RESTARTS THIS
      SESSION, each killing an unattended background job before
      completion (see restart_history in
      RUN-RELN-141a86-stage0c-pexist-extended/manifest.yaml). Stage 1's
