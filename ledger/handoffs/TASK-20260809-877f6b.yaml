handoff:
  id: TASK-20260809-877f6b
  from: coordinator
  to: coordinator
  goal_id: GOAL-AES-002
  question_id: RQ-AES-002
  batch_id: BATCH-001
  rank: null
  parent_decision: DEC-20260809-16c8f4
  task_card: coordination/goals/GOAL-AES-002/batches/BATCH-001/task-cards/TASK-20260809-877f6b.md
  depends_on:
    - TASK-20260809-7bab1e
    - TASK-20260809-9b78b2
    - TASK-20260809-8ab82c
  objective: >-
    COMMIT AND VERIFY THE EXACT BATCH-001 PRODUCER ARTIFACTS — the rank-2
    ideation package (TASK-20260809-9b78b2, five artifacts) and the rank-3
    envelope package (TASK-20260809-8ab82c, five artifacts), TEN ARTIFACTS IN
    TOTAL — BEFORE any independent review or red team reads them, so that both
    read immutable, source-bound bytes rather than a mutable working tree. The
    rank-1 protocol artifacts are NOT re-committed here: they were committed by
    TASK-20260809-7bab1e, the opening snapshot archive, in its own isolated
    coordination commit before the producers ran, which is the point of them
    being a gate, and this receipt records that commit's sha as reported rather
    than restaging its contents.
  uncertainty_reduced: >-
    Whether the validator and the red team inspect an immutable, source-bound
    producer snapshot rather than a mutable working tree; whether every
    artifact a later decision might rest on exists as a COMMITTED artifact
    BEFORE the decision that relies on it, as docs/claims-and-verification.md
    "Refutation artifacts" requires; and whether the rank-2 lossy-projection
    screen was frozen before candidate development, which cannot be checked
    once the tree moves.
  inputs:
    - The five TASK-20260809-9b78b2 artifacts.
    - The five TASK-20260809-8ab82c artifacts.
    - >-
      The commit sha of the rank-1 isolated coordination commit, PRODUCED BY
      THE OPENING SNAPSHOT ARCHIVE TASK-20260809-7bab1e and recorded in its
      receipt, as reported by the dispatching session.
  constraints:
    - >-
      SC-1 C2 STAMP DUTY, AND IT BINDS COORDINATOR TASKS EXACTLY AS IT BINDS
      PRODUCERS. As its FIRST act, before any other work, this task writes a
      stamp record in its own task directory carrying start_utc, start_epoch,
      declared_wall_clock_seconds and a binding_stop_utc COMPUTED AT DISPATCH
      TIME as start plus declared; writes a further stamp at EACH major section
      boundary carrying utc, elapsed_s and a marker naming what was completed;
      HALTS at binding_stop_utc, records halted_on_budget truthfully and NAMES
      the work dropped; and COMMITS those stamps as a DECLARED ARTIFACT of the
      task. The TASK-20260801-810 budget block is the reference
      implementation. A halt at binding_stop_utc is INFRASTRUCTURE SIGNAL,
      never a negative mathematical result (AGENTS.md rule 5), and dropped work
      is SCOPE, never an answer.
    - >-
      SC-2 C4 DECLARATION BASIS. The declared budget is calibrated against
      AUTHORING-INCLUSIVE session elapsed, and the COMPUTE component is
      reported SEPARATELY in its own field. Compute seconds are NOT the charged
      clock and may NOT be offered as evidence of budget compliance (C3).
      Discharging SC-1 is FULL COMPLIANCE even if the dispatcher-observed
      figure later exceeds the declaration; any residual is a campaign-side
      accounting fact and is never a producer defect.
    - >-
      SC-3 COVERING MANIFEST AND CLOSED CLASS VOCABULARY, under
      protocol-amendment-GOAL-AES-001-004 Part B as corrected by
      protocol-amendment-GOAL-AES-001-005 Part C, in force from BATCH-001. AT
      LEAST ONE machine-readable manifest of this task, DESIGNATED THE COVERING
      MANIFEST by this card and by the manifest itself, carries an
      `artifact_provenance` list covering EVERY declared artifact of the task,
      and EVERY OTHER MANIFEST OF THE TASK MUST APPEAR AS AN ENTRY IN IT. Entry
      fields: path, kind, sha256, comment_block_inference_stanza (boolean,
      stated honestly including when false),
      covered_by_this_manifest_inference_block (boolean). A self-referential
      digest is impossible and is recorded as SELF. THE `kind` VOCABULARY IS
      CLOSED AND CASE-INSENSITIVE — SOURCE_CODE, MACHINE_READABLE_MANIFEST,
      PROSE_REPORT, LEDGER_AND_COORDINATION_RECORD — matched ignoring
      underscore/hyphen/space differences; NO FIFTH CLASS MAY BE INVENTED, a
      value outside the vocabulary is a DEFECT TO REPORT rather than a class to
      create, and any machine-readable structured-data artifact resolves to
      MACHINE_READABLE_MANIFEST. Every declared SOURCE_CODE artifact
      additionally carries a comment-block inference stanza in its own text.
      THE COVERING MANIFEST OF THIS TASK IS snapshot-receipt.json.
    - >-
      SC-4 R5 ANTI-LAUNDERING CLAUSE, QUOTED VERBATIM FROM RQ-AES-002
      claim_tier_ceiling AND BINDING AS A COMPLETION GATE ON EVERY DELIVERABLE
      OF THIS TASK: "R5. THE ANTI-LAUNDERING CLAUSE. Any record, in any
      location, that states a margin MUST in the SAME SENTENCE (i) name the
      reference as exhaustive key search at the stated key size under CM-1, and
      (ii) declare the published-state-of-the-art comparison UNADJUDICABLE in
      this environment. Transcribing a definitional-reference margin as a
      state-of-the-art margin — in a headline, an evidence record, a decision,
      a synthesis, a status line, a cross-reference, a knowledge entry, a PR
      title or a commit message — is a CLAIM-TIER VIOLATION and is handled
      exactly as docs/claims-and-verification.md handles dropping a conditional
      qualifier: as an assertion above what the record supports. OPERATIONALLY,
      under docs/inventor-protocol.md section 5: every ideation and closure
      deliverable under this question sets `dominated_by: "unresolvable in this
      environment: no primary source reachable; every recalled frontier row is
      unverified-from-memory"` and NEVER `null`, because `null` asserts the
      frontier was checked row by row and it cannot be. `sota_delta` records
      the DEFINITIONAL-REFERENCE delta, explicitly labelled as such, plus the
      word `unadjudicable` for the published frontier."
    - >-
      SC-5 EVERY DELIVERABLE STATING A MARGIN CARRIES THE R5 CLAUSE IN THE SAME
      SENTENCE AS THE MARGIN. Not in a footnote, not in an appendix, not in a
      later paragraph, not in a preamble that the sentence itself does not
      repeat.
    - >-
      SC-6 NO RECALLED LITERATURE FIGURE MAY BE CITED AS AUTHORITY, IN EITHER
      DIRECTION. Every literature statement is UNVERIFIED-FROM-MEMORY
      (eprint.iacr.org, csrc.nist.gov and arxiv.org are unreachable under this
      harness's network policy) and must be marked inline at the point of use.
      It may not be used to promote, dismiss, rank, screen or size anything.
      Using a recalled number to DISMISS a candidate is the same fabrication as
      using it to PROMOTE one, and is additionally the premature-closure
      failure mode CLAUDE.md names as symmetric with overclaiming. Two agreeing
      recollections are ONE draw from a correlated pair, not two.
    - >-
      SC-7 NO COMPARISON AGAINST THE PUBLISHED STATE OF THE ART IS ASKED FOR BY
      THIS CARD, AND NONE MAY BE SUPPLIED. The only quantitative reference
      under this question is the DEFINITIONAL exhaustive-key-search reference
      of R1. `dominated_by` is set to the R5 string and NEVER to null.
    - >-
      SC-8 NO REDUCED-ROUND FINDING IS ASSERTED UNDER THIS GOAL. Reduced-round
      work is admissible here only as a validation-ladder instrument for a
      full-round mechanism, carries `toy` tier, and where it yields a result
      ABOUT reduced-round AES it is recorded under RQ-AES-001's ceiling and
      cross-filed there, never asserted here.
    - >-
      SC-9 ANYTHING NOT ATTEMPTED IS NAMED OPEN AND UNATTEMPTED and is NEVER
      recorded as tried, screened or negative (AGENTS.md rules 5 and 8). A
      count of things not reached is not a finding about the problem.
    - >-
      SC-10 CONCURRENCY. max_concurrent is 3 ACROSS BOTH AES GOALS, not 3 each.
      If GOAL-AES-001 BATCH-005 is in flight and dispatching this task would
      exceed the cap, THIS BATCH WAITS: record WAITED_ON_CONCURRENCY_CAP with
      the time waited and dispatch later at full budget, full deliverable set
      and full review chain. Never run degraded. Measured at drafting time on
      the host by the dispatching session: 14 physical cores, 48 GB RAM, load
      averages 40.48 / 43.60 / 40.25 — heavily oversubscribed. That is a
      measurement at drafting time and NOT a forecast of the load at dispatch
      time; re-check the cap immediately before dispatch.
    - >-
      RUN ALONE. No other task may hold the Git index or HEAD concurrently. The
      queue's dependency structure already guarantees this; the dispatching
      session enforces it in fact.
    - >-
      STAGE ONLY THE TEN DECLARED PRODUCER ARTIFACT PATHS AND THIS TASK'S OWN
      TWO RECEIPT PATHS. A scope-expanding commit blocks downstream review; it
      is an evidence-integrity failure, not a research result. In particular do
      NOT stage the pre-existing gates/, ideation/ or ideation2/ directories,
      which are not this batch's artifacts, and do not stage the rank-1
      artifacts, which are already committed.
    - >-
      BEFORE COMMITTING, FETCH origin/main AND MERGE IT INTO THE WORKING BRANCH
      (merge, never rebase). Record the base commit checked and the merge
      outcome in the receipt. Never resolve a sync conflict by editing a
      record; stop and escalate.
    - >-
      VERIFY THE PROVENANCE GATE BEFORE COMMITTING, IN THE IDENTICAL LANGUAGE
      THE PRODUCER CARDS CARRY. Every declared producer artifact carries a
      filled `inference` block (policy, requested_policy, the ACTUAL resolved
      model identifier, fallback_used, model_verified) and the standing basis
      0137a051eb5828789eb267fa83c8278086578d4c, with an unobserved resolved
      model recorded as `unrecorded` and never guessed. Each producer's
      COVERING MANIFEST — ideation_manifest.json and envelope_receipt.json
      respectively — is designated as such in its own text and carries an
      artifact_provenance entry for every declared artifact of its task, with
      every other manifest of that task appearing as an entry. Every
      SOURCE_CODE artifact carries a comment-block inference stanza in its own
      text. Every PROSE_REPORT carries EITHER an in-text inference block OR a
      provenance pointer naming its covering manifest, both forms EQUALLY
      COMPLIANT and NEITHER PREFERRED. A `kind` value outside the closed
      case-insensitive vocabulary is a DEFECT TO REPORT, never a class to
      create.
    - >-
      RECOMPUTE EACH DECLARED ARTIFACT'S SHA-256 YOURSELF and confirm it
      matches the entry asserted by its covering manifest. A provenance list
      that does not match the bytes is a defect, not a formality. Record both
      values for every artifact.
    - >-
      VERIFY THE RANK-2 SCREEN FREEZE, which cannot be checked later:
      lossy_projection_screen.json exists, is marked as written before any
      candidate development with a timestamp, carries a verdict for every
      candidate, and is not contradicted by candidate_report.md. Record
      honestly that a timestamp inside a producer-written file is PRODUCER
      ATTESTATION and is NOT auditable from committed bytes alone (the V-804-2
      lesson), and record exactly what you could and could not verify.
    - >-
      A MISSING OR PARTIAL BLOCK, A MISSING artifact_provenance LIST, A DIGEST
      MISMATCH, OR A CONTRADICTED SCREEN IS A COMPLETION-GATE FAILURE AT
      DISPATCH: the producing task is RETURNED AS INCOMPLETE with the defect
      named concretely, and is NOT snapshotted. Do not waive it, do not refer
      it forward, and DO NOT REPAIR, EDIT, EXTEND OR RE-RUN any producer
      artifact to make it pass.
    - >-
      DO NOT WRITE THE COMMIT'S OWN SHA INTO ANY ARTIFACT INSIDE THAT COMMIT.
      Record the parent sha and PERFORM the follow-on commit_sha / parent_sha
      binding write after the commit. Push the branch and open or refresh the
      PR against `main` naming TASK-20260809-9b78b2, TASK-20260809-8ab82c and
      this task.
    - >-
      CREATE NO EVIDENCE, DECISION, HYPOTHESIS OR KNOWLEDGE RECORD. This is a
      snapshot archive, not a ledger archive: archive.record_ids stays empty.
  deliverables:
    - stamps.json
    - snapshot-receipt.json (THE COVERING MANIFEST)
  artifact_paths:
    - coordination/goals/GOAL-AES-002/batches/BATCH-001/archives/TASK-20260809-877f6b/stamps.json
    - coordination/goals/GOAL-AES-002/batches/BATCH-001/archives/TASK-20260809-877f6b/snapshot-receipt.json
  write_scope:
    - coordination/goals/GOAL-AES-002/batches/BATCH-001/archives/TASK-20260809-877f6b
  archive:
    kind: snapshot
    source_task_ids:
      - TASK-20260809-9b78b2
      - TASK-20260809-8ab82c
    commit_sha: null
    parent_sha: null
    path_sha256: {}
    record_ids: []
  archived_by: TASK-20260809-877f6b
  archived_by_note: >-
    SELF. This IS the batch's PRODUCER snapshot archival task (the opening
    snapshot TASK-20260809-7bab1e covers the control plane and the rank-1
    protocol act, on a disjoint path set); its own receipt is
    committed in its own commit and the commit_sha / parent_sha binding write
    is performed afterwards, because a record cannot carry the sha of the
    commit that contains it.
  inference:
    policy: coordinator-orchestration
    requested_policy: coordinator-orchestration
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
    standing_basis: >-
      inference-amendment commit 0137a051eb5828789eb267fa83c8278086578d4c.
      Cross-model independence is unavailable campaign-wide; nothing produced
      here may be treated as a closure attestation.
  budget:
    wall_clock_seconds: 500
    memory_gb: 1
    maximum_runs: 2
  budget_basis: >-
    The 500 s snapshot line of GOAL-AES-002 campaign_budget.sizing_basis,
    borrowed from GOAL-AES-001's single measured snapshot datum (378 s) and
    sized ABOVE it because the provenance gate has grown since that datum was
    taken. ONE DATUM IS NOT A DISTRIBUTION and this is recorded as a sizing,
    not a prediction.
  completion_gate:
    - >-
      stamps.json exists, was written as the task's FIRST act, and carries
      start_utc, start_epoch, declared_wall_clock_seconds, binding_stop_utc
      computed as start plus declared, boundary stamps and a truthful
      halted_on_budget.
    - >-
      All ten producer artifacts carry a filled inference block and satisfy the
      provenance gate for THEIR OWN artifact class, or the offending producer
      task is returned as incomplete and NOT snapshotted, with the defect and
      the class named.
    - >-
      Each artifact's recomputed SHA-256 matches the entry asserted by its
      covering manifest, and the receipt records both values for every
      artifact.
    - >-
      The rank-2 screen freeze is verified as far as committed bytes allow, and
      the receipt states exactly what was and was not independently verifiable,
      naming producer attestation as attestation.
    - >-
      origin/main was fetched and merged (not rebased) before committing, and
      the base commit and merge outcome are recorded in the receipt.
    - >-
      The commit changes EXACTLY the twelve declared paths, is reachable from
      HEAD with the expected parent, and matches the recorded SHA-256 hashes;
      the pre-existing gates/, ideation/ and ideation2/ directories and the
      rank-1 artifacts are NOT staged.
    - >-
      The receipt names the two source task IDs, the archive kind `snapshot`,
      the parent sha, and a SHA-256 for every committed path; record_ids is
      EMPTY because a snapshot archive commits no ledger record.
    - >-
      The commit_sha / parent_sha binding write is actually performed after the
      commit, the branch is pushed, and the PR against `main` is opened or
      refreshed naming the three task ids.
    - >-
      No producer artifact was repaired, edited, extended or re-run; no ledger
      record of any kind was created; no status was transitioned.
  return_format: >-
    The snapshot receipt, the commit sha and its parent, the count of paths
    committed, the per-artifact-class provenance verdict for all ten artifacts
    with both sha values each, the screen-freeze verdict including what could
    not be verified from committed bytes, and the merge base checked.
