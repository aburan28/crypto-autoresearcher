  objective: >-
    Attack BATCH-014's REASONING, not its arithmetic -- the Validator
    (TASK-20260810-098fad) has the mechanical verification. The batch spent a
    slot, produced zero measurements, and is being recorded as a fully
    successful execution of its frozen contract. That framing is convenient
    for this campaign and must be stress-tested by someone who did not
    author it. Attack the accounting, the forward plan, and the standing of
    every archived comparison this lineage rests on.
  uncertainty_reduced: >-
    Whether the Coordinator's reading of a zero-measurement batch as a
    designed success is honest or self-serving; whether the ~2x-faster-host
    observation implies a deeper defect in the b = 1.10 s control than a
    host mismatch; and whether the obvious forward move (re-baseline the
    reference host) would silently void the archived comparisons runs a..j
    depend on.
  inputs:
    - >-
      The content-verified BATCH-014 package at commit 5471247e6, archived by
      TASK-20260810-dae7ef. Read
      coordination/goals/GOAL-SSIQ-001/batches/BATCH-014/archives/TASK-20260810-dae7ef-receipt.yaml
      FIRST, including its process_deviation and non_official_observation
      blocks.
    - ledger/decisions/DEC-20260810-616fd5.yaml (the adjudication you are asked to attack)
    - ledger/goals/GOAL-SSIQ-001/checkpoints/BATCH-014.yaml (the write-once checkpoint shard)
    - experiments/EXP-SSIQ-a85692/specification_v11.yaml (frozen; especially load_defer_gate_v11, the b=1.10s control's 49.93ms margin, and inputs.contribution_accounting_v11)
    - experiments/EXP-SSIQ-a85692/runs/RUN-SSIQ-a85692-k/
    - experiments/EXP-SSIQ-a85692/runs/RUN-SSIQ-a85692-h/ (the archived reference every v11 prediction derives from)
