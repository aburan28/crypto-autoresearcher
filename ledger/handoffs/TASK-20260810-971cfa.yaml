    - ledger/handoffs/TASK-20260808-d458a3.yaml
    - ledger/decisions/DEC-20260808-c2a470.yaml
    - coordination/goals/GOAL-SSIQ-001/batches/BATCH-014/reviews/ (all five pre-freeze reports, especially the PF-26 correction)
  constraints:
    - >-
      independent_session: true REQUIRED. Do not originate, edit, repair, or
      re-run the artifacts under review. Write findings only.
    - >-
      A G-0c defer is an infrastructure outcome and never negative
      mathematical evidence (AGENTS.md rule 5). You may attack how that
      principle is being APPLIED here; you may not convert the absence of a
      measurement into a claim about delta_E, H-SSIQ-36e970, or lever L4.
    - >-
      DO NOT cite the pre-execution CAL-1 figures as measurements of
      RUN-SSIQ-a85692-k. They came from a verification exercise outside the
      official run and were never written to its artifacts (RUN-k recorded
      cal1_records = [], cal2_records = []). You are explicitly asked to
      reason ABOUT them in RC-2 -- but every use must carry that boundary.
    - >-
      Premature closure and overclaiming are symmetric failure modes
      (docs/inventor-protocol.md). If your honest finding is that the
      Coordinator's framing is correct and the batch is fine, say that
      plainly; a manufactured challenge is as damaging as a suppressed one.
    - Record policy / model / independence metadata, including any fallback actually used.
  required_challenges:
    - id: RC-1
      challenge: >-
        SHOULD A DEFER THIS CHEAP COUNT AS CONSUMING A BATCH AT ALL? The run
        consumed 0.1884760856628418 s of a 1000 s budget -- 0.02% -- and
        performed exactly one 203-vertex graph build before stopping. It is
        nonetheless being recorded as BATCH-014's producer run, against a
        contract with maximum_runs: 1, with the batch's entire measurement
        objective unmet. Attack this from both sides. If a 0.19 s
        environment check consumes a batch slot, does this campaign's batch
        accounting measure anything real, or does it let an unrunnable
        environment silently absorb research capacity? Conversely, if it does
        NOT consume the batch, what stops a campaign from re-running a
        contract until an environment happens to cooperate -- which is the
        multiple-comparisons hazard the frozen maximum_runs: 1 exists to
        prevent? Name which failure this campaign is actually exposed to,
        and whether the checkpoint shard's framing ("sixth batch under the
        No budget constraints extension") is honest bookkeeping or slot
        inflation.
    - id: RC-2
      challenge: >-
        DOES THE ~2x-FASTER-HOST FINDING FORCE A RE-DERIVATION OF THE
        b = 1.10 s CONTROL'S 49.93 ms MARGIN, RATHER THAN MERELY A HOST
        MATCH? specification_v11 states that the b = 1.10 s arm's "guaranteed
        truncated" control rests on the execution host not being faster than
        the archived host, protected by a margin of only 49.93 ms (4.3%). The
        non-official pre-execution exercise measured this host at roughly
        2.0x-2.3x faster on the CAL-1 workload (ratio range [0.4308,
        0.4703]). The Coordinator reads this as vindication of G-0c. Attack
        that reading: a control protected by 4.3% is a control that a
        moderately faster CPU, a newer Python build, a different libc, or an
        idle machine could break WITHOUT tripping any host-identity check --
        G-0c compares OS family, ISA and CPU count, none of which is
        clock speed. Is host IDENTITY the right gate at all, or is the real
        requirement a measured speed bound the gate does not currently test?
        Would a "matched" Linux/x86_64/4-CPU host that is simply newer and
        faster pass G-0c and then silently invalidate the control anyway? If
        so, the correct remedy is not a matched host but a re-derived margin
        or a speed-calibrated gate -- and this Coordinator's forward plan
        (branch A) would be inadequate. Say so if that is what you find.
    - id: RC-3
      challenge: >-
        WOULD RE-BASELINING THE ARCHIVED REFERENCE TO A NEW HOST SILENTLY
        INVALIDATE THE ARCHIVED COMPARISONS THAT RUNS -a THROUGH -j REST ON?
        DEC-20260810-616fd5's forward branch (B) is a versioned amendment
        re-establishing a new archived reference host with its own reference
        curve. Attack it. Every prediction in specification_v11 derives from
        RUN-SSIQ-a85692-h's timings; several earlier batches' conclusions
        rest on comparisons against archived values produced on that same
        lineage of hosts, and NONE of runs -a..-j recorded its execution host
        at all (that absence is exactly what made the PF-26 defect
        possible). So: if the reference is re-baselined, do the archived
        comparisons underpinning earlier batches remain interpretable, or do
        they become comparisons against a reference that no longer exists?
        Identify concretely which prior conclusions -- name them -- would be
        placed in question, and whether any of them can be rescued without
        re-running the corresponding measurements. If re-baselining would
        strand prior results, that is a finding this Coordinator did not
        anticipate and it must be stated before anyone chooses branch (B).
    - id: RC-4
      challenge: >-
        IS THE "DESIGNED SUCCESSFUL BEHAVIOUR" FRAMING SELF-SERVING? The
        Coordinator, the dispatching handoff, and the checkpoint shard all
        assert that deferring was a fully successful outcome, citing
        TASK-20260808-d458a3's own advance language. Notice the structure of
        that argument: the party that wrote the contract is citing the
        contract it wrote as proof that the contract succeeded. Test whether
        anything OTHER than the contract's self-description supports the
        claim, and whether a defer was foreseeable at dispatch time. If the
        Coordinator knew, or with ordinary care should have known, that the
        execution environment was a macOS/arm64 host while the reference was
        Linux/x86_64, then dispatching the contract at all was the error and
        the gate merely caught it -- which is a real and different finding
        from "the gate worked as designed", and it belongs on the record.
    - id: RC-5
      challenge: >-
        ATTACK THE ARCHIVAL PROCESS DEVIATION HARDER THAN THE COORDINATOR
        DID. The package was producer-committed at 5471247e6 before any
        Coordinator snapshot; the receipt is after-the-fact and
        content-verified. The Coordinator asserts the integrity property
        survives because the artifacts are immutable, their hashes declared,
        and no reviewer has read them. Test the weak point: content hashes
        computed AFTER the producer commit certify only that the package has
        not changed SINCE that commit, not that it was produced as the
        contract required. What class of defect would this ordering fail to
        catch that a true snapshot-before-review would have caught? Is
        "content-verified" doing real work here or is it a relabelling of a
        skipped step? State whether you regard the deviation as acceptable,
        acceptable-with-conditions, or disqualifying for this package.
    - id: RC-6
      challenge: >-
        IS THE UNENFORCED 2 GiB MEMORY CAP BEING WAVED THROUGH? The frozen
        budget's memory bound was not applied on this host because `ulimit
        -v` is unsupported on macOS; the only binding cap was `timeout 1000`.
        Both the Coordinator and this handoff note it is immaterial for a run
        that deferred in 0.19 s -- which is likely true and also exactly the
        reasoning that lets an enforcement gap persist until the run where it
        matters. Establish whether any FUTURE execution of this contract, on
        any plausible host, would run unbounded in memory, and whether the
        frozen contract can honestly be described as budget-enforced on a
        non-Linux host at all.
