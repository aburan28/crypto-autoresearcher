handoff:
  id: TASK-20260801-042
  from: coordinator
  to: executor
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-024
  objective: >-
    Execute RUN-DEP-001-measure ONCE, exactly as the frozen contract specifies, using the
    BYTE-IDENTICAL driver already archived - the three ladders DEP-LADDER-RHO, DEP-LADDER-CELL
    and DEP-LADDER-BLOCK at R_REPS = 200 replicates per rung at both cells against the ARCHIVED
    EXP-EQD-001 thresholds, with exact binomial confidence intervals on every detection rate,
    plus the non-decisional duplicate decomposition DIAG-DEP-DUP. Observe and record only.
  uncertainty_reduced: >-
    The measured detection power of the EV-EQD-001 test against dependence-only deviations at
    bit-identical marginals, and therefore what the EV-EQD-001 non-rejection actually bounds.
  inputs:
  - experiments/EXP-DEP-001/specification.yaml
  - experiments/EXP-DEP-001/reading_rule.yaml
  - experiments/EXP-DEP-001/implementation/dep001_driver.py
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/archives/TASK-20260801-041/snapshot_commit_receipt.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/archives/TASK-20260801-036/snapshot_commit_receipt.json
  constraints:
  - >-
    run_authorized ONLY if TASK-20260801-041 records APPROVAL_DETERMINATION APPROVED. Otherwise
    cancel with no run and say so; a REVISE is a BATCH-024 non-execution for this arm and is a
    design verdict, never a mathematical result.
  - >-
    EXECUTE THE IDENTICAL DRIVER FILE, UNEDITED. Verify its sha256 equals DRIVER_SHA256 in the
    TASK-20260801-036 receipt before starting and record the comparison. A mismatch ABORTS and
    fires D-0.
  - >-
    Verify CTRL-DEP-EQDHASH again at startup and record it. DO NOT WRITE, EDIT, RENAME OR STAGE
    ANY FILE UNDER experiments/EXP-EQD-001/.
  - >-
    RUN EVERY RUNG OF EVERY LADDER AT R_REPS = 200 AT BOTH CELLS. Do not skip a rung for cost -
    the measured basis says the whole stage is of order 300 s.
  - >-
    RUN CTRL-DEP-MARG ON EVERY PLANTED ARM WITHOUT EXCEPTION and record its digests. A MISMATCH
    ABORTS THE ARM, is recorded with its rung and replicate index, and is INSTRUMENT FAILURE,
    NEVER A RESULT.
  - >-
    Report every detection rate WITH ITS EXACT TWO-SIDED 95 PERCENT CLOPPER-PEARSON INTERVAL AND
    ITS ONE-SIDED 95 PERCENT LOWER BOUND, for all four statistics at both cells at every rung.
  - >-
    Emit maximal_deviation_certificate.json UNDER EVERY OUTCOME, recording the topmost-rung arm
    in full - its marginal digests, its measured rank correlation, its four statistics and its
    four thresholds with the rejection booleans - so that a D-3 reading has an independently
    re-verifiable counterexample certificate archived before any decision relies on it.
  - >-
    Emit duplicate_decomposition.json with dup_translate_explained, dup_residual and the orbit
    decomposition AS MACHINE-READABLE FIELDS, on OBJ-REAL and on a stated number of fresh null
    draws at each cell. dup_residual is PRE-REGISTERED AT ZERO as an integrity tell. THIS IS THE
    ONLY QUANTITY COMPUTED FROM OBJ-REAL IN THIS EXPERIMENT - compute NO statistic of OBJ-REAL
    against any null and make NO comparison.
  - 'Use the frozen streams and verify disjointness from every archived EXP-EQD-001 stream. Record every stream seed and hash.'
  - 'The run wrapper writes git_status_prerun.txt BEFORE invoking the driver.'
  - >-
    manifest.yaml with command.txt, environment.json, stdout.log, stderr.log and raw-result.json
    beside it; result.certificate.kind is the literal string none.
  - >-
    DO NOT APPLY RR-DEP-1 AND DO NOT STATE A DISPOSITION. Classification is TASK-20260801-046's
    and no one else's.
  - 'NO FACTORIZATION, NO SMOOTHNESS STATISTIC, NO SEARCH ARM, NO TIMING DECISION VARIABLE, NO COST IDENTITY, NO R.'
  - >-
    Timeouts, crashes, memory exhaustion and budget cancellation are infrastructure signal, never
    mathematical negatives (AGENTS.md rule 5). Report the terminal status honestly -
    completed_valid, completed_invalid, failed_infrastructure, failed_implementation,
    resource_exhaustion or cancelled_by_budget.
  - 'MAKE NO COMMIT; TASK-20260801-043 archives.'
  - Do not alter any ledger record. Leave FAEST and XEDN alone.
  deliverables:
  - experiments/EXP-DEP-001/runs/RUN-DEP-001-measure/manifest.yaml
  - experiments/EXP-DEP-001/runs/RUN-DEP-001-measure/raw-result.json
  - experiments/EXP-DEP-001/runs/RUN-DEP-001-measure/command.txt
  - experiments/EXP-DEP-001/runs/RUN-DEP-001-measure/environment.json
  - experiments/EXP-DEP-001/runs/RUN-DEP-001-measure/stdout.log
  - experiments/EXP-DEP-001/runs/RUN-DEP-001-measure/stderr.log
  - experiments/EXP-DEP-001/runs/RUN-DEP-001-measure/git_status_prerun.txt
  - experiments/EXP-DEP-001/results/measure/DEP_report.json
  - experiments/EXP-DEP-001/results/measure/dependence_power_curve.json
  - experiments/EXP-DEP-001/results/measure/detection_floor_certificate.json
  - experiments/EXP-DEP-001/results/measure/maximal_deviation_certificate.json
  - experiments/EXP-DEP-001/results/measure/duplicate_decomposition.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/tasks/TASK-20260801-042/execution_report.yaml
  artifact_paths:
  - experiments/EXP-DEP-001/runs/RUN-DEP-001-measure/manifest.yaml
  - experiments/EXP-DEP-001/runs/RUN-DEP-001-measure/raw-result.json
  - experiments/EXP-DEP-001/runs/RUN-DEP-001-measure/command.txt
  - experiments/EXP-DEP-001/runs/RUN-DEP-001-measure/environment.json
  - experiments/EXP-DEP-001/runs/RUN-DEP-001-measure/stdout.log
  - experiments/EXP-DEP-001/runs/RUN-DEP-001-measure/stderr.log
  - experiments/EXP-DEP-001/runs/RUN-DEP-001-measure/git_status_prerun.txt
  - experiments/EXP-DEP-001/results/measure/DEP_report.json
  - experiments/EXP-DEP-001/results/measure/dependence_power_curve.json
  - experiments/EXP-DEP-001/results/measure/detection_floor_certificate.json
  - experiments/EXP-DEP-001/results/measure/maximal_deviation_certificate.json
  - experiments/EXP-DEP-001/results/measure/duplicate_decomposition.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-024/tasks/TASK-20260801-042/execution_report.yaml
  archived_by: TASK-20260801-043
  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 3600
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
  - >-
    APPROVAL gate respected; driver hash equality verified and recorded; CTRL-DEP-EQDHASH
    verified; every rung of all three ladders at R_REPS = 200 at both cells complete or an honest
    incomplete report; CTRL-DEP-MARG run on every planted arm; every detection rate reported with
    its exact binomial intervals; maximal_deviation_certificate.json and
    duplicate_decomposition.json emitted with machine-readable fields; no statistic of OBJ-REAL
    against any null computed; no disposition stated; manifest.yaml with its five companions and
    git_status_prerun.txt present.
