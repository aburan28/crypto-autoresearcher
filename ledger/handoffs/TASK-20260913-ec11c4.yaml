  objective: >
    Own joint J6-BLIND of REVIEW-SEMBIN-20260913-9d649f: a BLIND re-derivation
    of the batch's single load-bearing quantity -- the memory-charged crossover
    n under (time * memory) with the sparse storage reading, and the signed
    margin in bits at n = 409 under the same measure. Build it from the
    statement of the quantity and the parameters in the review plan, and from
    the frozen source, and from nothing else.
  uncertainty_reduced: >
    Whether the 375 crossover and the +11.52-bit margin at n = 409 are
    properties of the quantity or of one implementation. The two existing
    implementations agree, but they were written by one session from one reading
    of the source, and independent-arithmetic.json says so on its face: it is
    method-independent, not agent-blind. That is precisely the failure mode
    replication cannot see, so agreement here is worth more than a third
    recomputation from the same artifacts.
  inputs:
