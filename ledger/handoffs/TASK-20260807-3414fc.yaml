handoff:
  id: TASK-20260807-3414fc
  recorded_at: '2026-08-07'
  from: coordinator
  to: executor
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-aa267f
  experiment_id: EXP-ICINV-4d33aa
  hypothesis_id: H-ICINV-6c7920
  question_id: RQ-ICINV-475b5e
  objective: >-
    Implement and execute the frozen, approved contract EXP-ICINV-4d33aa exactly
    as written. Build harness/exp_icinv_fullgroup.py and harness/run_fullgroup.py,
    then run the three stages in the contract's declared order: Stage 1 (exact
    per-curve coverage certificate at p = 2003, 4001, 6007 -- can terminate the
    experiment on its own), Stage 2 (the NULL-R matched null under Arm B and the
    Arm C planted signal, written to the run record BEFORE any primary-class Arm
    B verdict is read), Stage 3 (Arm A0 baseline reproduction gate, then the full
    A0 / A1 / B density sweep, r-stratified). Emit the frozen decision rule's
    terminal_state from inside the run.
  uncertainty_reduced: >-
    Whether EV-ENDO-10109d's headline finding -- that the within-class m = 3
    decomposition-rate over-dispersion is real and density-independent -- survives
    a target sampler whose support is certified BY ENUMERATION to be the whole
    group, and whether it stratifies by r = #{x in F_p : x^3 + ax + b = 0}.
    CORR-20260807-d78e2f records that the committed sampler's support is a cyclic
    subgroup whose size r fixes exactly (r = 1 -> 100%, r = 3 -> 50%, zero variance
    within strata at three primes), which is a mechanism of exactly the right shape
    to manufacture the entire effect and was never controlled for. This experiment
    discharges DEC-20260807-41c173 next action N8, the campaign's highest-priority
    open question.
  inputs:
  - experiments/EXP-ICINV-4d33aa/specification.yaml
  - ledger/hypotheses/H-ICINV-6c7920.yaml
  - ledger/proposals/IDEA-20260807-0a3272.yaml
  - ledger/corrections/CORR-20260807-d78e2f.yaml
  - ledger/evidence/EV-ENDO-10109d.yaml
  - ledger/decisions/DEC-20260807-41c173.yaml
  - harness/exp_icinv.py
  - harness/isogeny_class.py
  - harness/toycurve.py
  - harness/runner.py
  - analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md
  constraints:
  - >-
    THE CONTRACT IS FROZEN. Every prime, factor-base size, target count, seed,
    threshold, control and terminal-state rule in specification.yaml was fixed
    before any run exists. Do not add a prime, a density row, a seed or an arm,
    and do not adjust a threshold, without first filing a versioned
    protocol_amendment under experiments/EXP-ICINV-4d33aa/amendments/ and having
    it approved. Stopping rule SR4 makes this explicit.
  - >-
    DO NOT EDIT harness/exp_icinv.py. Arm A0 must obtain its targets by CALLING
    the committed exp_icinv.targets_uniform so the baseline is bit-exact and every
    already-committed run stays reproducible against the same file. All new
    behaviour goes in harness/exp_icinv_fullgroup.py. Modifying exp_icinv.py makes
    the run INVALID under the contract's own invalidation rules.
  - >-
    NULL-C (exp_icinv.permutation_null) may NOT be used anywhere in this
    experiment. It is a between-class MEAN detector and every question here is
    within-class. Using it makes the run INVALID.
  - >-
    Compute the exact m = 3 sum set ONCE per (curve, fb_size) and reuse it across
    every arm, seed and target count. This is a contract requirement rather than
    an optimisation: it is what guarantees the arms differ in the sampler and in
    nothing else. Recomputing per arm is a defect even if the numbers agree.
  - >-
    RUN THE STAGES IN ORDER AND HONOUR THE GATES. SR1: if Stage 1's coverage
    certificate does not stratify by r, the terminal state is PREMISE-FAILED --
    stop, report, and do not evaluate OUTCOME A/B/C at all. SR2: Stage 2's NULL-R
    and planted-signal results are written to the run record before Stage 3's
    primary Arm B verdict is read. SR3: if Arm A0 fails the baseline-reproduction
    control, stop and return the defect; Arm B's contrast would be meaningless.
  - >-
    THE TERMINAL STATE IS COMPUTED BY THE RUN, NOT CHOSEN AFTERWARDS (SR6). Emit
    it from inside the code into decision-rule-evaluation.json together with its
    inputs, the per-prime F_p, and the per-row S1/S2/S3 evaluations. The set of
    reported metrics must not depend on which state fired.
  - >-
    A timeout, crash, OOM or dependency failure is status failed_infrastructure
    with partial artifacts retained. It is NEVER negative mathematical evidence
    and never a verdict (AGENTS.md rule 5). Do not convert an infrastructure
    failure into a result in either direction.
  - >-
    DO NOT INTERPRET AND DO NOT MOVE ANY STATUS. Produce run records and an
    execution report. The hypothesis status, the evidence record, and any
    supersession of EV-ENDO-10109d are the Coordinator's, on a separate ledger
    archive, after independent review (AGENTS.md rule 1).
  - >-
    Never fabricate a command, an output, a timing, a statistic or a run. A
    measurement not taken stays missing and is reported as missing (AGENTS.md
    rule 9).
  - >-
    Fetch origin/main and compare it with this branch before the run manifests are
    written; record the base commit checked and the merge outcome in the execution
    report. Merge new main changes, never rebase pushed run records.
  - >-
    Mint every new identifier with `python3 tools/allocate_id.py --next <type>`
    and confirm it with --check before use. Do not grep committed state for the
    next free number.
  - >-
    Lawful defensive cryptanalysis on public toy constructions only (p <= 10007).
    No live key, wallet or deployed system is touched, and nothing here transfers
    to cryptographic scale.
  deliverables:
  - harness/exp_icinv_fullgroup.py
  - harness/run_fullgroup.py
  - >-
    One immutable run directory per (prime, class role) under
    experiments/EXP-ICINV-4d33aa/runs/<RUN-ID>/, each carrying the full artifact
    set named in the contract's required_artifacts block.
  - >-
    experiments/EXP-ICINV-4d33aa/runs/<RUN-ID>/coverage-certificates.json --
    BLOCKING artifact: per curve per arm, (a, b), r, certified (n1, n2),
    support_size, coverage_fraction, support_equals_predicted.
  - >-
    experiments/EXP-ICINV-4d33aa/runs/<RUN-ID>/decision-rule-evaluation.json --
    the frozen rule's inputs, per-prime F_p, per-row S1/S2/S3, emitted
    terminal_state.
  - >-
    experiments/EXP-ICINV-4d33aa/runs/<RUN-ID>/baseline-reproduction.json -- Arm
    A0 against the committed EV-ENDO-10109d values, row by row.
  - >-
    experiments/EXP-ICINV-4d33aa/runs/<RUN-ID>/per-curve-measurements.json and
    tail-checks.json, so every aggregate is recomputable by a reviewer without
    rerunning anything.
  - >-
    coordination/goals/GOAL-ENDO-001/batches/BATCH-aa267f/execution/EXP-ICINV-4d33aa/execution_report.md
    -- what ran, what did not, every deviation, and the emitted terminal state,
    with no interpretation of what it means for the research question.
  artifact_paths:
  - harness/exp_icinv_fullgroup.py
  - harness/run_fullgroup.py
  - experiments/EXP-ICINV-4d33aa/runs/
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-aa267f/execution/EXP-ICINV-4d33aa/execution_report.md
  archived_by: null
  inference:
    policy: executor-implementation
    requested_policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
    independent_session_note: >-
      The Executor runs in a session separate from the Coordinator session that
      drafted and approved this contract. Under this Claude Code harness every
      policy alias resolves to the one model the session runs on (CLAUDE.md model
      policy note), so "independent session" means independent context and a fresh
      reading, not a genuinely different model. Record requested_policy alongside
      the resolved model id in every run manifest, with fallback_used: true and
      its reason if they differ. Never silently substitute.
  budget:
    wall_clock_seconds: 14400
    memory_gb: 4
    maximum_runs: 18
    total_cpu_hours: 12
    budget_note: >-
      Taken verbatim from the contract's budget block: 3 primes x {Stage-1 premise
      check, primary class, NULL-R class} = 9 core runs, plus up to 3
      secondary-class runs if the stratum floor triggers, plus headroom for
      re-runs, plus the optional p = 10007 stretch. Exceeding
      wall_clock_seconds_per_run stops that run at status failed_infrastructure
      with partial artifacts retained (SR5), which is never negative evidence.
  completion_gate:
  - >-
    Both new modules exist, harness/exp_icinv.py is byte-identical to its
    committed version, and the run is reproducible from command.txt and
    environment.json.
  - >-
    class_census returns agrees: true for every ordinary class used, at every
    prime used.
  - >-
    Every curve in every arm carries a passing exact support certificate, with Arm
    B coverage exactly 1.0 on every measured curve and Arm A coverage exactly 1/n1
    for the certified (n1, n2).
  - >-
    Arm A0 reproduces the committed EV-ENDO-10109d numbers within the declared
    tolerance (variance ratio in [1.3, 3.6] at every density row, monotonic_decay
    False, operating row within +-0.25 of 1.918 at p = 4001 and 1.591 at p = 6007)
    -- or the run stops at SR3 and returns the defect.
  - >-
    The variance-decomposition identity check passes to 1e-9 relative at every
    cell.
  - >-
    The NULL-R matched null and the Arm C planted signal are measured and written
    to the run record BEFORE the primary class's Arm B verdict is read.
  - >-
    The frozen decision rule terminates in EXACTLY ONE of INVALID,
    PREMISE-FAILED, OUTCOME-A, OUTCOME-B or OUTCOME-C, emitted by the run itself,
    with the persistence and stratification statistics and all five tail checks
    reported.
  - >-
    At least two of the three required primes yield a persistence verdict;
    fewer, or exactly two that disagree, is INVALID and returns for the missing
    prime rather than producing a result.
  - >-
    The execution report names every deviation from the contract, every dropped
    curve with its reason, and every infrastructure failure, and interprets
    nothing.
  return_format: >-
    An execution report at the path above plus the run directories. State the
    emitted terminal_state and the numbers that produced it, and stop there. Do
    NOT write an evidence record, do not move a hypothesis status, and do not
    characterise what the result means for EV-ENDO-10109d, RQ-ICINV-475b5e or
    GOAL-ENDO-001 -- those are Coordinator acts on a later ledger archive after
    independent review. If the terminal state is OUTCOME-A, say so plainly and
    leave the supersession of EV-ENDO-10109d to the Coordinator; AGENTS.md rule 4
    forbids editing that record and the correction path is a new one.
  scope_and_honesty: >-
    Toy scale throughout (p <= 10007), claim_tier: toy, sota_delta zero. No run of
    this contract can support or reject an ECDLP cost claim: the measurement is
    exact sum-set enumeration rather than an algorithm, r is a 2-part invariant
    and KN-TECH-030 keeps the 2-part irrelevant to the ECDLP in the prime-order
    subgroup. OUTCOME-C -- the over-dispersion persists and r does not explain it,
    refuting H-ICINV-6c7920 and STRENGTHENING the finding this experiment was
    built to attack -- fully satisfies the success criterion and must be reported
    with the same clarity as any other outcome.
