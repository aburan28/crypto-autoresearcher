handoff:
  id: TASK-20260801-803
  from: coordinator
  to: coordinator
  objective: >-
    Commit and verify the exact BATCH-003 producer artifacts — the OD-1 diameter
    and redesigned-GATE-701-C package (TASK-20260801-801) and the ER-6 close-out
    package (TASK-20260801-802) — before any independent review reads them.
  uncertainty_reduced: >-
    Whether the validator inspects an immutable, source-bound producer snapshot
    rather than a mutable working tree; and whether the derivation supporting
    any adverse transition this batch might license exists as a COMMITTED
    artifact BEFORE the decision that relies on it, as
    docs/claims-and-verification.md ("Refutation artifacts") requires.
  inputs:
    - The three TASK-20260801-801 artifacts
    - The four TASK-20260801-802 artifacts
    - coordination/goals/GOAL-AES-001/amendments/protocol-amendment-GOAL-AES-001-002.yaml
  constraints:
    - "Run alone. No other task may hold the Git index or HEAD concurrently."
    - >-
      Stage ONLY the seven declared producer artifact paths and this task's own
      receipt path. A scope-expanding commit blocks downstream review; it is an
      evidence-integrity failure, not a research result.
    - >-
      The commit message names TASK-20260801-801, TASK-20260801-802,
      TASK-20260801-803 and GOAL-AES-001.
    - >-
      INFERENCE AND PROVENANCE GATE, IN THE IDENTICAL LANGUAGE THE PRODUCER
      CARDS CARRY. Verify BEFORE committing that every declared producer
      artifact carries a filled `inference` block (policy, requested_policy,
      resolved model identifier, fallback_used, model_verified) and the standing
      basis 0137a051eb5828789eb267fa83c8278086578d4c; and, under
      protocol-amendment-GOAL-AES-001-002 prospectively from this batch, that
      every declared SOURCE-CODE artifact additionally carries a comment-block
      inference stanza in its own text and that the covering manifest carries an
      `artifact_provenance` list binding each declared source path to its
      SHA-256. A missing or partial block, or missing provenance, is a
      COMPLETION-GATE FAILURE at dispatch: the producing task is returned as
      incomplete rather than snapshotted, with the defect named concretely. Do
      not waive it and do not refer it forward — the amendment was in force when
      the card was issued, which is precisely why D-704-1 could not be enforced
      retroactively in BATCH-002 and can be enforced here.
    - >-
      Recompute each declared source file's SHA-256 yourself and confirm it
      matches the `artifact_provenance` entry asserted by its covering manifest.
      A provenance list that does not match the bytes is a defect, not a
      formality.
    - >-
      Do not write the commit's own SHA into any artifact inside that commit;
      the dispatch verifier binds the receipt to Git after the commit. Record
      the parent SHA, and perform the follow-on binding write that BATCH-002's
      receipt prescribed for itself and did not do (D-705-6).
    - >-
      Create NO evidence, decision, hypothesis or knowledge record in this task.
      This is a snapshot archive, not a ledger archive: record_ids is empty.
    - >-
      Do not repair, edit, extend or re-run any producer artifact to make it
      pass. Defects are recorded and returned, never fixed here.
    - "Do not modify any BATCH-001 or BATCH-002 committed artifact."
  deliverables:
    - snapshot-receipt.json
  artifact_paths:
    - coordination/goals/GOAL-AES-001/batches/BATCH-003/archives/TASK-20260801-803/snapshot-receipt.json
  archived_by: TASK-20260801-803
  inference:
    policy: coordinator-orchestration-code
    requested_policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
    standing_basis: >-
      inference-amendment commit 0137a051eb5828789eb267fa83c8278086578d4c.
  budget:
    wall_clock_seconds: 300
    memory_gb: 1
    maximum_runs: 1
  budget_basis: >-
    Calibrated against MEASURED consumption: the two prior snapshot archives
    actually consumed 179 s and 215 s. 300 s is that measured maximum with
    honest margin.
  completion_gate:
    - >-
      Every one of the seven producer artifacts carries a filled inference block
      AND satisfies protocol-amendment-GOAL-AES-001-002 (comment-block stanza in
      each source-code artifact; artifact_provenance list in the covering
      manifest), or the offending producer task is returned as incomplete and
      NOT snapshotted, with the defect named.
    - >-
      Each source file's recomputed SHA-256 matches the artifact_provenance
      entry asserted by its covering manifest, and the receipt records both.
    - >-
      Git verifies the commit is reachable from HEAD, has the expected parent,
      changes exactly the declared paths, and matches the recorded SHA-256
      hashes.
    - >-
      The receipt names the two source task IDs, the archive kind `snapshot`,
      the parent SHA, and a SHA-256 for every committed path; record_ids is
      empty because a snapshot archive commits no ledger record.
    - >-
      The commit_sha / parent_sha binding write prescribed by the receipt is
      actually performed after the commit, closing the D-705-6 shape rather than
      repeating it.
  return_format: >-
    The snapshot receipt, plus the commit SHA, its parent, the exact list of
    changed paths, and confirmation that every producer artifact carried an
    inference block and matching artifact_provenance digests.
