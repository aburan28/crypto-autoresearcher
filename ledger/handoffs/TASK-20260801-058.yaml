handoff:
  id: TASK-20260801-058
  from: coordinator
  to: validator
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-025
  objective: >-
    Verify run validity BEFORE anyone interprets it. Expected arm counts, schema-complete manifest,
    seed and stream integrity, driver-hash equality across the calibration and measurement boundary,
    raw versus summary agreement, control comparability, and above all THE FACTORIZATIONS
    THEMSELVES.
  uncertainty_reduced: 'Whether the measurement is admissible as evidence at all.'
  inputs:
  - experiments/EXP-LPF-001/runs/RUN-LPF-001-measure/
  - experiments/EXP-LPF-001/results/measure/
  - experiments/EXP-LPF-001/results/calib/
  - experiments/EXP-LPF-001/specification.yaml
  - experiments/EXP-LPF-001/reading_rule.yaml
  - experiments/EXP-LPF-001/implementation/lpf001_driver.py
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/archives/TASK-20260801-050/snapshot_commit_receipt.json
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/archives/TASK-20260801-057/snapshot_commit_receipt.json
  constraints:
  - 'INDEPENDENT SESSION. You did not author or execute any artifact under review.'
  - >-
    RECOMPUTE, DO NOT READ. Regenerate the report from the archived raw arrays with your own code
    and compare at TOLERANCE ZERO. Reimplement at least one certifying statistic reusing NONE of the
    driver's code.
  - >-
    PRIORITY DUTY - INDEPENDENTLY REFACTOR at least 5000 uniformly random real-arm samples per cell
    by a factorization path that reuses none of the driver's code, and compare the largest prime
    factor. Report the exact agreement count. A single disagreement is a blocking defect and the
    package is NOT ADMISSIBLE.
  - >-
    VERIFY DRIVER-HASH EQUALITY ACROSS THE CALIBRATION AND MEASUREMENT BOUNDARY AGAINST GIT - the
    git blob id of lpf001_driver.py at the TASK-20260801-050 commit and at the measurement commit
    must be the same object, and `git diff` across that boundary must be empty.
  - >-
    VERIFY THE ENUMERATION - exactly 130816 half-tuples per cell with i < j, the diagonal absent by
    construction, degenerate draws counted and excluded, and factor_base_sha256 equal to the
    EXP-EQD-001 archived value.
  - 'VERIFY EVERY THRESHOLD IS TRACEABLE - each band equal to the named order statistic of the named archived calibration array, recomputed by your own sort.'
  - 'VERIFY SEED AND STREAM DISJOINTNESS between the measurement''s fresh uniform arm and every archived calibration stream.'
  - 'RUN tools/validate_ledger.py check_run on the manifest and report the error list verbatim.'
  - 'RETURN ADMISSIBLE or NOT ADMISSIBLE with a concrete defect list. DO NOT APPLY THE READING RULE, do not select a branch and do not state a disposition.'
  - 'MAKE NO COMMIT; TASK-20260801-060 archives this report.'
  - 'Record inference honestly (requested review-adversarial, independent session).'
  deliverables:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/reviews/TASK-20260801-058/validation_report.yaml
  artifact_paths:
  - coordination/goals/GOAL-ECDLP-001/batches/BATCH-025/reviews/TASK-20260801-058/validation_report.yaml
  archived_by: TASK-20260801-060
  inference:
    policy: review-adversarial
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 7200
    memory_gb: 8
    maximum_runs: 1
  completion_gate:
  - 'ADMISSIBLE or NOT ADMISSIBLE with a concrete defect list.'
  - 'The report regenerated at tolerance zero and one statistic reimplemented independently.'
  - 'At least 5000 real-arm factorizations per cell re-verified by a second code path with the exact agreement count.'
  - 'Driver-hash equality verified against Git; the enumeration, thresholds, seeds and streams verified.'
  - 'check_run output reported verbatim; no reading rule applied; no commit made.'
