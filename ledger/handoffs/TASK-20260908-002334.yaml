  - coordination/goals/GOAL-SCURVE-15e805/batches/BATCH-c49aa3/tasks/TASK-20260824-233cd4/parameter-capsule.yaml
  constraints:
  - Re-fetch the raw RFC documents yourself via curl or equivalent; do not simply trust the producer's
    transcription or its recorded sha256 without recomputing it from your own fetch.
  - Re-derive every arithmetic result (on-curve check, l*B=O, Hasse-interval count, control outcomes)
    with your own independently written code, not by re-running or reading the producer's scripts.
  - Exercise at least one adversarial negative control of your own (e.g. a deliberately wrong candidate
    point, or a tampered l) in your own ephemeral process memory only, never written to any file, and
    confirm your method rejects it.
  - Verify that no value from parameter-capsule.yaml section 5 (unverified_retrieval_transcript, USE_PROHIBITED)
    leaked into the producer's certificate.
  - Verify that no SafeCurves True/False comparison cell was emitted (P2 must remain open).
  - Zero scientific claims about curve safety may be made by this review; it verifies the base-point certificate
    and control fidelity only.
  - Never select a provider, backend, endpoint, or model identifier containing Bedrock, case-insensitively.
  - Do not modify producer or snapshot artifacts; write only your own declared deliverables.
  deliverables:
  - coordination/goals/GOAL-SCURVE-15e805/batches/BATCH-0aef14/reviews/TASK-20260908-002334/validation-report.yaml
  - coordination/goals/GOAL-SCURVE-15e805/batches/BATCH-0aef14/reviews/TASK-20260908-002334/runtime-session-receipt.json
  artifact_paths:
