handoff:
  id: TASK-20260908-002334
  from: coordinator
  to: validator
  objective: 'Independently re-verify TASK-20260908-42e809''s raw-transcription and lane-L3 base-point
    audit: re-fetch RFC 7748 and RFC 8032 yourself, recompute sha256 of the raw bytes, independently re-derive
    every transcribed value from the raw text (not from the producer''s report), and independently re-run
    every arithmetic check the producer claims (on-curve, l*B=O, Hasse-interval uniqueness, and all three
    controls) using your own code, not the producer''s.'
  uncertainty_reduced: Whether the producer's raw-transcription and L3 certificate are reproducible from
    the primary sources by an independent session, and whether the reported controls actually distinguish
    real signal from artifact.
  inputs:
  - TASK-20260908-42e809
  - coordination/goals/GOAL-SCURVE-15e805/batches/BATCH-0aef14/tasks/TASK-20260908-42e809/raw-transcription.yaml
  - coordination/goals/GOAL-SCURVE-15e805/batches/BATCH-0aef14/tasks/TASK-20260908-42e809/base-point-audit.yaml
  - coordination/goals/GOAL-SCURVE-15e805/batches/BATCH-0aef14/tasks/TASK-20260908-42e809/task-report.yaml
  - coordination/goals/GOAL-SCURVE-15e805/batches/BATCH-0aef14/archives/TASK-20260908-08f8f1/snapshot-receipt.json
