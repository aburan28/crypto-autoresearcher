  constraints:
  - RUN ALONE.
  - >-
    VERIFY VALIDITY BEFORE INTERPRETING - expected run and arm counts, schema-complete manifest,
    seed and stream integrity, driver-hash equality, CTRL-DEP-MARG on every planted arm, raw
    versus summary agreement, control comparability. An invalid or incomplete set goes back to
    the Executor with concrete defects and is NOT evidence.
  - >-
    CONFIRM THE CALIBRATION CHAIN BEFORE READING THE MEASUREMENT. TASK-20260801-037 must have
    returned ADMISSIBLE, and the CALIBRATION_VALIDATION_REPORT_SHA256 named in the
    TASK-20260801-039 receipt must equal the sha256 of the report you are archiving. A mismatch
    means the report changed after the reading rule was frozen against it, which is an integrity
    failure and never a result.
  - >-
    APPLY THE FROZEN READING RULE AS WRITTEN, IN ITS DECLARED PRECEDENCE ORDER D-0, then D-1,
    then D-5, then exactly one of D-2, D-3, D-4. Do not amend it, do not add a branch, and do not
    read the result into a branch it does not satisfy. Quote the branch condition and the
    observed detection rates with their confidence intervals in the decision.
  - >-
    If any D-0, D-1 or D-5 leg fired, the rule is SUSPENDED, the outcome is inconclusive ON THE
    INSTRUMENT, and EV-EQD-001 IS NOT AMENDED IN EITHER DIRECTION.
  - >-
    UNDER D-3 THE REFUTATION ARTIFACT IS MANDATORY AND MUST BE ARCHIVED IN OR BEFORE THIS SAME
    COMMIT - the independently re-verified maximal_deviation_certificate.json, with proof_status
    `counterexample_certificate` rather than `empirical_only`. The disposition is `weaken` on the
    INFORMATIVENESS of the EV-EQD-001 measurement, scoped exactly to INT-2, Bfb = 512, the two
    toy cells, m = 4, the frozen grids, the archived thresholds and the three constructed
    families. `reject_scoped`, and in particular reject_scoped-as-impossibility, is FORBIDDEN.
  - >-
    UNDER EVERY BRANCH, EV-EQD-001 IS SUPERSEDED BY ADDITION AND NEVER EDITED. EV-EQD-002 names
    it in supersedes; EV-EQD-001 gains no forward pointer, and that discoverability gap is
    carried as OPEN-BATCH024-A.
  - >-
    DO NOT EDIT ledger/hypotheses/H-EQD-001.yaml. H-EQD-001 stays `analyzed` with
    SCOPE-EQD-ANALYZED-1 unaltered under every branch; the amendment lives in EV-EQD-002 and
    DEC-20260801-010.
  - >-
    WRITE THE H-DEP-001 status_history ENTRIES FOR `approved` AND `running` with
    recorded_retrospectively true, each naming the task and the committed receipt that effected
    it, exactly as pre-declared at the opening in status_history_policy_batch024. Do not invent a
    date or an authorization.
  - >-
    BEFORE WRITING THE RECORDS, re-list ledger/decisions and ledger/evidence and confirm
    DEC-20260801-010, EV-DEP-001 and EV-EQD-002 are ALL free in the CURRENT tree including
    anything merged from origin/main since this queue was opened. If any is occupied, renumber
    OUR record and never the other party's, and file a queue amendment binding the declared set,
    artifact_paths and write_scope together.
  - >-
    Do not claim crypto-scale, medium-scale or asymptotic support. Toy stays toy. Promotion gates
    G1-G4 stay OPEN. No `support` under any branch.
  - 'Cite no calibration number as evidence about any hypothesis. RUN-DEP-001-calib is expressly non-evidential in either direction.'
  - >-
    STATE EXPLICITLY THAT THIS IS NOT A REPLICATION of EV-EQD-001 and cannot move H-EQD-001
    toward `replicated`, and that OPEN-BATCH023-A is NOT discharged - no integer was factored
    here either.
  - >-
    Restate ALT-CLASS-DEP-1 in full in both evidence records and in the decision. A statement of
    power without its uncertified list is an overclaim by omission.
  - >-
    Do not alter H-EQD-001, H-SMTH-001, H-DS-001, H-IC-001 or H-STR-002, do not re-score
    EV-EQD-001 or EV-DS-001 through EV-DS-004, and do not edit any file under
    experiments/EXP-EQD-001/, experiments/EXP-DS-001/ or experiments/EXP-SMTH-001/. Leave FAEST
    and XEDN alone.
  - >-
    FILL knowledge_promotion EITHER WAY. Judge KN-CAND-BATCH023-A on the merits against its
    recorded trigger - route (a) requires an archived machine-readable decomposition with
    dup_residual pre-registered as an integrity tell and observed at zero. If promoted, the
    KN-FIND entry and the regenerated knowledge/INDEX.md go in THIS SAME commit under
    /curate-knowledge conventions and require a queue amendment enlarging this declared set
    first. If not, give a concrete not_warranted reason.
  - >-
    Carry every declared open item forward stating for each whether it was repaired, mitigated or
    left open - OPEN-BATCH022-A, OPEN-BATCH022-B, OPEN-BATCH023-A, OPEN-BATCH023-B, RT049-B6,
    KN-CAND-BATCH023-A and OPEN-BATCH024-A - and rank the owed smoothness measurement and
    RT049-CTRL-5 into the BATCH-025 opening rather than dropping them.
  - 'Preserve every existing field and note in GOAL-ECDLP-001.yaml verbatim; supersede by addition and preserve exactly one next action.'
  - >-
    Commit message must contain TASK-20260801-046, EV-DEP-001, EV-EQD-002, the filed decision id,
    H-DEP-001, EXP-DEP-001, GOAL-ECDLP-001, BATCH-024.
  - Do not push from this task.
