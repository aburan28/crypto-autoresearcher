handoff:
  id: TASK-20260801-805
  from: coordinator
  to: coordinator
  objective: >-
    Commit the independent TASK-20260801-804 validation package together with
    the scoped evidence record EV-AES-003 and the batch decision
    DEC-20260731-026, then perform the official BATCH-003 state transition.
  uncertainty_reduced: >-
    Whether BATCH-003's two producer outputs — an exact graph diameter with an
    argued or declined OD-1 extension and a redesigned falsification gate that
    either discriminates or does not, plus a closed ER-6 coverage escape —
    discharge the two conditions DEC-20260731-025 recorded, and what the
    campaign's next single action therefore is; recorded durably rather than
    left in a working tree.
  inputs:
    - The three TASK-20260801-804 validation artifacts
    - The verified TASK-20260801-803 producer snapshot
    - DEC-20260731-025, EV-AES-002, KN-FIND-028, GOAL-AES-001, RQ-AES-001
    - coordination/goals/GOAL-AES-001/amendments/protocol-amendment-GOAL-AES-001-002.yaml
  constraints:
    - >-
      Run alone. Stage only the declared review and ledger paths. No other task
      may hold the Git index or HEAD concurrently.
    - "Only the Coordinator may write official records."
    - >-
      SCOPE THE CONCLUSION TO WHAT WAS TESTED: the exact graph, the exact
      matrices, the GF(2^4) analogue the gate runs in, the mutant suite and task
      set actually generated, and the budget actually spent. claim_tier: toy. A
      repaired instrument is a REPRODUCIBILITY FACT and a computed diameter is a
      DERIVATION FACT; neither may be upgraded into empirical cryptanalytic
      evidence about AES, and neither supports any claim about AES at any round
      count.
    - >-
      THE ADVERSE-TRANSITION GATE IS THE CENTRAL CONSTRAINT OF THIS ARCHIVE. A
      reject_scoped of the round-independent single-word deterministic class is
      admissible ONLY IF the redesigned gate returned a DISCRIMINATING result on
      the independent validator's own re-run, AND the refutation artifact it
      rests on is already committed in the TASK-20260801-803 snapshot, AND the
      basis is declared (counterexample certificate, then derivation note, then
      declared empirical_only). If the gate did not discriminate, the closure
      stays WITHHELD exactly as DEC-20260731-025 left it, and that is a correct
      and complete outcome, not a failure of the batch. `reject_scoped` on a
      single unreplicated empirical-only run is FORBIDDEN — use `weaken` plus
      replication.
    - >-
      KNOWLEDGE PROMOTION IS CONDITIONAL AND MUST NOT BE MANUFACTURED. Fill
      knowledge_promotion in DEC-20260731-026 either with the promoted KN-* ID
      or with a concrete not_warranted reason. Promote a KN-FIND only on
      `support` or `reject_scoped` at replicated/strong evidence, proven
      boundaries counting. If a promotion IS warranted, KN-FIND-029 is the
      reserved ID: write it and the regenerated knowledge/INDEX.md in an
      ISOLATED PREDECESSOR COMMIT immediately before the ledger commit — the
      pattern BATCH-001 and BATCH-002 both used — and record that predecessor
      SHA as this commit's parent in the receipt, because this ledger commit
      must change EXACTLY its two declared artifact paths. Confirm
      `python3 tools/build_knowledge_index.py --check` exits zero against the
      committed index. If no promotion is warranted, KN-FIND-029 stays
      unallocated and the reservation is simply not used.
    - >-
      DEC-20260731-026 records exactly ONE next action, fills
      knowledge_promotion, and records the status of the four
      asymptotic-complexity promotion gates rather than passing over them —
      naming them explicitly if they remain not engaged, so a later batch cannot
      quietly bypass them.
    - >-
      No literature comparison, recalled baseline, sota_delta, bit-margin or
      extrapolation may enter EV-AES-003 or DEC-20260731-026 in any form; any
      literature statement that does appear carries the unverified-from-memory
      qualifier.
    - >-
      BUDGET ACCOUNTING MUST BE RECORDED HONESTLY. Record in DEC-20260731-026
      the DECLARED and the MEASURED consumption of this batch and the cumulative
      campaign totals on both bases, together with whichever amendment the user
      ruled on to authorize dispatch. An unrecorded overrun is not a research
      result.
    - >-
      Update the GOAL-AES-001 checkpoint after this ledger archive, preserving
      exactly ONE next action, in its own follow-on commit; register
      protocol-amendment-GOAL-AES-001-002 in the goal's `amendments` list at the
      same time. A record cannot carry the SHA of the commit that contains it.
    - "Do not write the commit's own SHA into an artifact inside that commit."
    - >-
      GOAL-AES-001 does NOT close on this batch: under inference-amendment
      0137a051 a three-distinct-model closure quorum is unobtainable in this
      harness, so `completed` is unreachable regardless of outcome, and
      TASK-20260801-804 supplies session and not model independence. Record NO
      attestation.
    - >-
      Correct any ID collision by a CORR record rather than by editing a
      committed record; CORR-20260731-006 is the next free correction ID.
  deliverables:
    - EV-AES-003.yaml
    - DEC-20260731-026.yaml
  artifact_paths:
    - ledger/evidence/EV-AES-003.yaml
    - ledger/decisions/DEC-20260731-026.yaml
  archived_by: TASK-20260801-805
  inference:
    policy: coordinator-orchestration-code
    requested_policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: false
    standing_basis: >-
      inference-amendment commit 0137a051eb5828789eb267fa83c8278086578d4c.
  budget:
    wall_clock_seconds: 800
    memory_gb: 1
    maximum_runs: 1
  budget_basis: >-
    Calibrated against MEASURED consumption: the two prior ledger archives
    actually consumed 409 s and 776 s. 800 s is that measured maximum with
    minimal margin.
  completion_gate:
    - >-
      The evidence and decision records preserve the exact reviewed scope,
      objects, matrices, field, task set and claim tier, and no record asserts
      anything about full-round or deployed AES.
    - >-
      Any reject_scoped is licensed by a validator-confirmed DISCRIMINATING gate
      and by a refutation artifact already committed in the TASK-20260801-803
      snapshot, with its basis declared; otherwise the closure remains withheld
      and the record says so plainly.
    - >-
      knowledge_promotion is filled with either a promoted KN-* ID or a concrete
      not_warranted reason; if KN-FIND-029 is written, it and the regenerated
      INDEX.md are in the isolated predecessor commit and
      `build_knowledge_index.py --check` exits zero.
    - >-
      Git verifies the commit is reachable from HEAD, has the expected parent,
      changes exactly the two declared paths, matches the recorded SHA-256
      hashes, and names the task and record IDs.
    - >-
      The decision records exactly one next action, the declared and measured
      budget consumption on both accounting bases, and the status of the four
      promotion gates.
    - >-
      archive.record_ids lists EV-AES-003 and DEC-20260731-026, and each
      declared artifact filename contains one of those IDs.
  return_format: >-
    The two ledger records, the commit SHA and its parent, the exact list of
    changed paths, the decision's single next action, and the filled
    knowledge_promotion field.
