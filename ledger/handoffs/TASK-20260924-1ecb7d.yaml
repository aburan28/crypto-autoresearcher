# REVIEW of the DIFFERENCE between the DRAFT
# AMD-EXP-GFPN-05ff43-20260924-childend and the DRAFT
# AMD-EXP-GFPN-05ff43-20260924-failclosed (RG-1..RG-9), and of that
# difference's interaction with everything incorporated.
# It runs no msolve, valgrind, callgrind_annotate, gp, Sage or builder child,
# creates no run package, and imports no module of the scanned trees.
# Its single question, as before: can a package be PASSED, PASSED_ZL or
# ADMITTED by the rules while a capped child that may have executed argv has
# no recorded cap read-back, while a created child is recorded as not created,
# while a record written in a process other than the installing one goes
# undetected, or while its outcome was recorded by the wrapper (a FAIL-OPEN
# counterexample)? And does any planned basis outcome FAIL by design? It must
# first reproduce known answers, including FO-1 and PB-1 on failclosed as
# worded. A fail-closed finding is reported and is never a bar.
# Ordered by DEC-20260924-844896. Written by the Coordinator under
# TASK-20260924-64c8fe. This card launches nothing. Its one archival task is
# TASK-20260924-7e8a5d.
# =============================================================================
