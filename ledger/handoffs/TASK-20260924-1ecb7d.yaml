  review_plan: null
  review_plan_note: >-
    Not a claim-changing review round: it can move no hypothesis status, close
    no lane and support no headline claim; its only consumer is a protocol
    decision. Its design is written first, below, with one owner per joint,
    a worked attack per joint, a known-answer control and declared blindness;
    the Coordinator's prior is recorded in DEC-20260924-844896
    (review_design.prior), to which this reviewer is blind.
  review_design:
    owner_of_every_joint: TASK-20260924-1ecb7d (single reviewer)
    joints:
      CJ-0_known_answer_control:
        reading: failclosed RFR-0 (c), and CRT-4 (b), (c)
        claim_under_attack: The reviewer's own method is sensitive enough to find the fail-open and planned-basis cases the previous round found.
        worked_attack: >-
          Apply the method used for CJ-1..CJ-3, unchanged, to the objects CRT-4
          names; then to childend with RG-1 (c) weakened so that
          "frozen_pre_exec_exit" accepts ANY returncode when no exec is
          observed: it must then report FO-1 variant C as fail-open again.
          Report what the method actually did on each object.
        failure_signature: A method that does not flag these objects cannot support "holds" on CJ-1 or CJ-3.
      CJ-1_child_end_evidence_no_fail_open:
        reading: failclosed RFR-1 (definitions (i)-(v)), applied to RG-1, RG-4 and their interaction with RF-0..RF-3
        claim_under_attack: >-
          Under RG-1, no created child that left the frozen child path
          (v2_solver.py 182-208) other than by exec or by a frozen os._exit
          can be recorded child_end "exec" or "frozen_pre_exec_exit"; so no
          package whose child ran recorder, entry or frozen caller code in
          another process can PASS, whatever that process wrote or failed to
          write; and RG-4 opens no route by which a lost launch record goes
          unnoticed.
        worked_attack: >-
          (1) Re-run FO-1 variants B and C, and every census path (census md
          190-206), under RG-1. (2) Construct: an escaped child whose exit
          status is 97, 98 or 99 (any SystemExit on an unwinding path in the
          frozen trees, the r3 entries, r3_resolve or the r3 wrapper;
          RGL-2); a second fork within one recorder call; a child that exits
          or is killed before the callback reads the children list; the
          callback firing outside a recorder call, or in a call whose record
          says child_created false; a counter opened on the wrong pid; a pid
          reused between fork and reap; exec by a grandchild with the counter
          not inherited; an exec that happens and then a Python image
          (argv[0] a Python interpreter, e.g. the comparator or the build
          child) that runs repository code. (3) Under RG-4, a lost launch
          record whose files are attributed to another launch through a
          directory named in argv. (4) For each, fail-open (a break) or
          fail-closed (a finding)?
        where_it_may_break: >-
          RGL-2's returncode set; the pid-discovery step; argv[0] being a
          Python interpreter (an exec'd Python child is outside the installing
          process by construction: decide whether definition (iv) reaches the
          records it writes).
      CJ-2_child_end_evidence_no_planned_basis_refusal:
        reading: failclosed RFR-2, applied to RG-1
        claim_under_attack: >-
          Every launch on a normal path of either plan (a solve, the build
          child, the comparator, the callgrind child, the health child, the gp
          child; count_instructions true or false) is recorded child_end
          "exec", "frozen_pre_exec_exit" or "no_child" as RG-1 (c) words it,
          so RG-1 refuses no planned basis outcome by design.
        worked_attack: >-
          For each of the six run_child call sites (v2_driver.py 101, 166,
          650; v2_solver.py 517; a1_health.py 147; a1_pari.py 96) and each
          frozen outcome (ok, crashed, memory_exhausted, timeout,
          refused_to_start with each report shape), state child_end and the
          class. Check the counter semantics RGL-1 relies on against their
          documentation and state provenance; say where the verdict depends on
          a behaviour the review cannot read.
        where_it_may_break: An exec'd child whose counter reads time_enabled 0; a timeout kill between go byte and exec.
      CJ-3_infrastructure_stop_scope:
        reading: failclosed RFR-2, applied to RG-2
        claim_under_attack: >-
          No outcome that RG-2 classes infrastructure-stop is one the frozen
          sequencing is designed to act on as a planned basis, and RG-2
          changes no verdict.
        worked_attack: >-
          For each package kind of both r3 plans and each outcome with at
          least one launch record and no collected pair (every launch refused
          before fork for host state, the host lock or driver RSS above 1 GiB,
          v2_solver.py 153-169; every created child ending with an ERR
          setrlimit or empty report; mixtures), state whether the frozen
          sequencing (_load_build, _prior_cells, _condition_met, the
          aggregates) is designed to act on it, with lines, and whether RG-2
          classes it infrastructure-stop. Check that RG-2 turns no PASS or
          PASS_ZL row of the close census's RKR-4 (b) table (md 476-492) into
          anything else.
        where_it_may_break: The driver-RSS envelope refusal (AC-1) as a designed "m = 5 infeasible" signal.
      CJ-4_development_harness:
        reading: failclosed RFR-3, applied to RG-3
        claim_under_attack: >-
          With RG-3, DV-18's development packages of controls,
          anchor-identity and controls-a1 on the r3 base fail exactly the
          three listed checker items, their substituted argv carries neither
          the label nor the scratch root, and no other frozen read of a
          replaced or redirected value or of the label makes them compute
          differently.
        worked_attack: >-
          (1) Re-check r3_check_run.py 320-340 for every item that fails on a
          NOT_EVALUABLE block. (2) For every argv element the three commands
          build (v2_driver.py 98-101, 160-166, 647-650; a1_pari.py 91-96;
          a1_health.py 141-147), apply RG-3 (e). (3) Look for any other
          path-bearing or label-bearing value a child reads (spec files,
          scripts, environment) that differs after substitution. (4) Confirm
          RG-3 (a)-(c) against r3_run_wrapper.py 437-440, 464 and r3_dv12.py
          119.
      CJ-5_readers_of_the_difference:
        reading: failclosed RFR-4 and RFR-6 (informational), applied to RG-1, RG-2 and RG-4
        worked_attack: >-
          List every reader, in the r3 base and the rules, of child_end,
          child_end_observer, stdout_path, stderr_path, the infrastructure-stop
          class and the RG-4 attribution, and whether any changes what it
          computes (REG-1, the key and byte sweeps, the frozen checkers).
      CJ-6_value_classes_and_neutrality:
        reading: failclosed RFR-6 (informational), applied to RG-1 (f) and RG-8
        worked_attack: >-
          Whether the callback, as RG-1 (a) words it, can change any value the
          frozen parent records (the frozen perf counter, wall time, the order
          of 210-236), and whether it is a function replacement under HR-3 /
          RL-5.

