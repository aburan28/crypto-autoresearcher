        operating-system behaviour or through ordinary errors. A FAIL-CLOSED
        finding (the rules FAIL, stop or say `undetermined`) is NOT a break:
        list it under fail_closed_findings with its cost.
    - id: CRT-4
      text: >-
        KNOWN-ANSWER CONTROL FIRST (CJ-0). Before CJ-1 and CJ-3 are reported
        as holding, the reviewer's own method, unchanged, must flag: (a) on
        readbackclose's RK-1 and RK-3 AS WORDED, P-16 and P-F2 (after P-14a)
