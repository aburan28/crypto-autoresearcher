    - id: CRT-3
      text: >-
        REPORT ON JOINTS. Each of CJ-0..CJ-6 carries holds | breaks |
        inconclusive with the reading or computation it rests on, the files
        and lines read, and what would change the verdict. A BREAK of CJ-1 is
        a FAIL-OPEN counterexample and of CJ-2 or CJ-3 a PLANNED-BASIS
