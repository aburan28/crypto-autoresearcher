handoff:
  id: TASK-20260906-e2719b
  id_status: >-
    RESOLVED. The authoring Coordinator session proposed TASK-20260906-c47f3a
    (hand-generated, no Bash tool available to it). The dispatching
    (top-level) session minted and verified the real id via
    `python3 tools/allocate_id.py --next handoff` followed by `--check`
    (0 occurrences across the union at mint time): TASK-20260906-e2719b. This
    file was renamed and this field updated accordingly before commit, per
    CLAUDE.md's "Do not grep for the next free number" rule.
  from: coordinator
  to: executor
  role: executor
  to_rationale: >-
    Executor, because the deliverable is a bounded, deterministic exact-integer
    computation against a frozen, already-approved contract (status: approved,
    per specification.yaml's own status_enactment_note) with no protocol design
    or hypothesis-status decision left to make. The Coordinator does not run
    experiments (agents/coordinator.md "Authority").

  goal_id: null
  goal_id_note: >-
    Deliberately null, not GOAL-ECDLP-001. RQ-JMV-001 is a STANDALONE track,
    explicitly detached from GOAL-ECDLP-001 and GOAL-CRYPTO-001 by the
    contract's own control C2 ("must not be attached to GOAL-ECDLP-001 or
    GOAL-CRYPTO-001, from which RQ-JMV-001 is explicitly detached") and by
    DEC-20260906-b083ce's rationale ("RESOURCE FIT... goal_attachment: NONE,
    by explicit structural design, not merely budgetary"). Labelling this
    task under GOAL-ECDLP-001 would itself violate C2's framing discipline.
  question_id: RQ-JMV-001
  experiment_id: EXP-JMV-001
  hypothesis_id: H-JMV-001
  authorized_by: DEC-20260906-b083ce
  authorized_by_note: >-
    This is the ONLY valid authorization citation for this task. It is a real,
    checkable Coordinator approval decision (committed 2026-09-06). It is NOT
    DEC-20260726-001 or DEC-20260726-003 -- the specification.yaml's own
    `approved_under` field cites those, but DEC-20260906-b083ce's context
    section documents, from an independent full read of both, that neither
    contains any mention of JMV, arXiv:math/0411378, H-JMV-001, or
    RQ-JMV-001, and that DEC-20260807-5adc24 found the same thing first. Do
    not cite DEC-20260726-001/-003 anywhere in this task's artifacts as the
    approval basis; cite DEC-20260906-b083ce.
  supersedes_handoff: >-
    None. This is the FIRST handoff ever filed for EXP-JMV-001, at any
    version. Confirmed this session (and independently confirmed by
    DEC-20260906-b083ce's own context/limitations): no run, manifest, or
    evidence record exists for EXP-JMV-001 at any version, and no prior
    ledger/handoffs/TASK-*.yaml ever cited it. There is no prior false
    citation in a handoff to correct here -- unlike five sibling
    experiments in the same repair effort, the defect for this experiment
    lived only in specification.yaml's own `approved_under` field (an
    immutable frozen record, not edited by this handoff) and in
    RQ-JMV-001.yaml (out of this handoff's write_scope; see
    CORR-20260906-a6a296).

  objective: >-
    Execute experiments/EXP-JMV-001/specification.yaml (frozen contract,
    version 2, status approved) EXACTLY as frozen: a conductor audit of the
    JMV (arXiv:math/0411378v3) Figure 1 curve set, AS HELD IN THIS PROGRAM'S
    OWN TRANSCRIPTION ARTIFACT, against the ten in-scope curves
    (P-192/224/256/384/521, K-163/233/283/409/571), with derived order
    controls (CTRL-ORDER-PRIME, CTRL-ORDER-KOBLITZ, CTRL-CM-KOBLITZ,
    CTRL-HASSE) and the three-part Figure 1 row check (CTRL-FIG1-ROWCHECK).
    Produce a per-row confirm/contradict/censored verdict table, exact
    conductor values under the D1 definition (or explicit censoring),
    level counts under the D2 definition, and machine-checkable
    counterexample certificates for every contradicted row. THE RUN STOPS AT
    THE TABLE AND THE CERTIFICATES: no conclusion about arXiv:math/0411378v3
    itself (e.g. "the paper has an error") may be written by this task; that
    is gated on the independent C1 review, which this task does not perform.

  uncertainty_reduced: >-
    Whether the Figure 1 table, as held in this program's own plain-text
    transcription (research/JMV2005_experiment_suite_20260726.md Sec. 2 and
    the embedded constants in experiments/EXP-JMV-001/cpi_audit.py), is
    arithmetically reproducible from published NIST/IETF curve parameters
    under a fully controlled pipeline -- extending the unreviewed scouting
    result (P-256 mod-9 mismatch; K-163 internal inconsistency) to a
    complete, artifact-backed, certificate-bearing run for the first time.
    Currently unknown because the scouting script explicitly does not
    perform primality/maximality checks, has no Figure 1 check at all on
    K-409/K-571, and never emits c_pi under the D1 conductor definition for
    the prime rows (specification.yaml notes).

  inputs:
    - experiments/EXP-JMV-001/specification.yaml
    - ledger/hypotheses/H-JMV-001.yaml
    - ledger/decisions/DEC-20260906-b083ce.yaml
    - experiments/EXP-JMV-001/cpi_audit.py
    - research/JMV2005_experiment_suite_20260726.md
    - ledger/questions/RQ-JMV-001.yaml
    - ledger/corrections/CORR-20260906-a6a296.yaml
  inputs_note: >-
    ledger/questions/RQ-JMV-001.yaml and cpi_audit.py / the research/*.md
    scouting note are read for CONTEXT AND AS THE HELD TRANSCRIPTION SOURCE
    ONLY. RQ-JMV-001.yaml's own `admitted_by`/`approved_experiments`
    citations of DEC-20260726-001 are documented fabrications
    (CORR-20260906-a6a296): do not cite them as this task's authorization.
    cpi_audit.py and the research/*.md note are the SCOUTING script and
    write-up -- "NOT A RUN, produces no evidence" per specification.yaml's
    own notes -- and are inputs to extend/reproduce independently, never
    artifacts to copy forward as this run's output. No copy of
    arXiv:math/0411378v3 itself exists anywhere in this repository's
    inputs/ corpus (verified this session); the plain-text paste embedded in
    the two files above IS the complete "figure1_transcription_artifact"
    referenced by specification.yaml `inputs.figure1_transcription_artifact`
    -- there is no separate, cleaner source file. This task must archive
    that paste VERBATIM as held (including its row inventory) into
    figure1_transcription.md per required_artifacts; it must not tidy,
    reformat, or "correct" it in the process (specification.yaml
    stopping_rules: "Reconstructing or tidying the artifact destroys the
    object under test").

  constraints:
    - >-
      FROZEN PROTOCOL, NO AMENDMENT. specification.yaml version 2 is frozen
      and approved; this task may not alter it in any way. Any perceived
      gap, ambiguity, or needed loosening is reported and PROPOSED as a
      versioned protocol_amendment to the Coordinator, never written
      directly (AGENTS.md rule 4; specification.yaml notes on version 2
      being a pure tightening over version 1).
    - >-
      AUTHORIZED_BY DEC-20260906-b083ce ONLY. Do not cite
      DEC-20260726-001/-003 as this task's approval basis in any artifact;
      see authorized_by_note above.
    - >-
      SHARED BUDGET POOL -- READ BEFORE COUNTING RUNS. specification.yaml's
      own budget block for THIS experiment is wall_clock_seconds_per_run
      3600, total_cpu_hours 1, maximum_runs 5, maximum_memory_gb 4. That is
      NOT an independent allocation: specification.yaml's own
      budget_provenance states it is "funded from the standalone RQ-JMV-001
      track budget (2 CPU-hours, 10 runs total across EXP-JMV-001 and
      EXP-JMV-004 branch (a))" -- i.e. ONE shared pool split between the two
      experiments, where this experiment's 1 CPU-hour / 5 runs is already
      exactly this experiment's half-share of that pool, not an additional
      draw on top of it. THE HAZARD THIS CONSTRAINT NAMES EXPLICITLY: a
      dispatcher who reads the "2 CPU-hours / 10 runs total" language on
      EACH experiment's own spec and treats it as a PER-EXPERIMENT
      entitlement (rather than one pool the two specs both quote) could
      authorize this task's 5 runs / 1 CPU-hour AND EXP-JMV-004 branch (a)'s
      handoff for a further, independently-counted 5 runs / 1 CPU-hour on
      top of what each already implies as its half, silently doubling the
      real ceiling to 10 CPU-hours / 20 runs. This task's authorization is
      capped at maximum_runs: 5, wall_clock_seconds_per_run: 3600 (<= 1
      CPU-hour total), maximum_memory_gb: 4, and the dispatching session
      must track this task's actual consumption against the combined
      RQ-JMV-001 track pool (2 CPU-hours / 10 runs total) jointly with
      whatever EXP-JMV-004 branch (a)'s sibling handoff (TASK-20260906-a29dee)
      consumes, before authorizing any further run of either experiment.
    - >-
      NO CONCLUSION ABOUT THE PAPER. Per stopping_rules and
      invalidation_rules: the run stops at the table and the certificates.
      No artifact from this task may assert that arXiv:math/0411378v3
      contains an error; the only permitted formulation pre-C1-review is
      "THE TRANSCRIPTION WE HOLD IS INCONSISTENT WITH THESE CURVES'
      PARAMETERS." The words "verified", "confirmed", or "finding" may not
      describe any Figure 1 result. No CORR- record may be emitted for any
      Figure 1 discrepancy (DEC-20260726-003 part A, as accurately described
      inside specification.yaml, even though that decision's JMV citation
      elsewhere was fabricated).
    - >-
      NOT A REVIEW TASK. This task does NOT satisfy control C1 (the
      transcription-fidelity gate) or C1b. It archives the transcription
      with a required "UNCHECKED-AGAINST-SOURCE" banner and stops; the C1
      review by a reviewer who did not produce the transcription is a
      SEPARATE, later Coordinator-dispatched task and is a precondition this
      task's completion does not satisfy.
    - >-
      NO CURVE OUTSIDE inputs.curves_attempted. The seven rows listed in
      inputs.curves_not_attempted (B-163/233/283/409/571,
      IPSec-3rdOG-F2^155, IPSec-4thOG-F2^185) must not be computed or
      reported with any result of any sign (invalidation_rules).
    - >-
      Claim tier stays `crypto` under the exact claim_boundary stated in
      specification.yaml: exact integer arithmetic about the named curves
      and the transcription artifact only. No statement about dlog
      difficulty, Theorem 1.1, Corollary 1.2, or GRH. No attack framing of
      any kind (control C2).
    - >-
      Timeouts and crashes are infrastructure signals, never negative
      results, per specification.yaml's own stopping_rules and AGENTS.md
      rule 3.
    - >-
      Workers never commit. All artifacts are written only inside
      write_scope; the Coordinator alone performs the snapshot and ledger
      archival commits.

  deliverables:
    - "experiments/EXP-JMV-001/runs/<RUN-ID>/manifest.yaml"
    - "experiments/EXP-JMV-001/runs/<RUN-ID>/raw.json"
    - "experiments/EXP-JMV-001/runs/<RUN-ID>/stderr.txt"
    - "experiments/EXP-JMV-001/runs/<RUN-ID>/analysis.md"
    - "experiments/EXP-JMV-001/runs/<RUN-ID>/cpi_table.csv"
    - "experiments/EXP-JMV-001/runs/<RUN-ID>/controls.json"
    - "experiments/EXP-JMV-001/runs/<RUN-ID>/figure1_transcription.md"
    - "experiments/EXP-JMV-001/runs/<RUN-ID>/transcription_fidelity.md"
    - "experiments/EXP-JMV-001/runs/<RUN-ID>/certificates/P-256_mod9.json"
    - "experiments/EXP-JMV-001/runs/<RUN-ID>/certificates/K-163_composite_P.json"
    - "experiments/EXP-JMV-001/runs/<RUN-ID>/certificates/K-163_product_mismatch.json"
    - "experiments/EXP-JMV-001/runs/<RUN-ID>/verify_certificates.py"
  deliverables_note: >-
    Exact required_artifacts list from specification.yaml, verbatim. Every
    item is mandatory for completion; <RUN-ID> is assigned by the Executor
    at run time. verify_certificates.py must share no code with the run
    script (specification.yaml required_artifacts comment).

  artifact_paths:
    - experiments/EXP-JMV-001/runs/
  artifact_note: >-
    Canonical index artifact declared at open, per the deliverables list
    above; the exact per-run-ID file inventory is amended into this task's
    artifact_paths after the Executor's terminal receipt and BEFORE the
    Coordinator's snapshot archive binds.

  write_scope:
    - experiments/EXP-JMV-001/runs/
  write_scope_note: >-
    Non-overlapping with EXP-JMV-004's sibling task (TASK-20260906-a29dee),
    which writes only under experiments/EXP-JMV-004/runs/. This task writes
    nothing under ledger/, nothing under experiments/EXP-JMV-001/specification.yaml,
    and nothing under experiments/EXP-JMV-004/.

  review_required: true
  review_required_note: >-
    Claim-relevant producer task (AGENTS.md "Dynamic dispatch"): it produces
    per-row Figure 1 verdicts and, if any row is reported contradicted,
    counterexample certificates asserting a defect in an external published
    artifact's transcription. Per AGENTS.md rule 12 and specification.yaml's
    own notes, a claimed erratum against a published paper requires
    independent review-xhigh review by an agent that did not originate the
    claim, PLUS the separate C1 reviewer who did not produce the
    transcription (specification.yaml control C1, DEC-20260726-001 as
    accurately restated by DEC-20260906-b083ce). Neither review is opened by
    this handoff; the Coordinator must author a `review_plan` and dispatch
    both before any evidence-review decision is recorded on this run's
    output. review_plan is null here because this handoff is the PRODUCER
    task, not the review round.

  inference:
    policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: true
    fallback_reason_if_used: >-
      Record the resolved model with fallback_used true and its reason if
      the harness cannot resolve the canonical policy alias. Never
      substitute silently (AGENTS.md rule 11).
    degraded_allowed: false
    independent_session_required: false

  budget:
    wall_clock_seconds: 3600
    memory_gb: 4
    maximum_runs: 5
  budget_note: >-
    Exactly specification.yaml's own budget block for this experiment
    (wall_clock_seconds_per_run 3600, maximum_memory_gb 4, maximum_runs 5,
    total_cpu_hours 1). This is this experiment's half-share of the combined
    RQ-JMV-001 track pool (2 CPU-hours / 10 runs total); see the
    shared-budget constraint above. Do not raise maximum_runs above 5 for
    this task under any reading of the shared-pool language.

  completion_gate:
    - >-
      All 12 required_artifacts present under a single <RUN-ID> directory
      (or one directory per run if more than one run is executed within the
      5-run cap), each matching specification.yaml's manifest_requirements
      (inference block with requested_policy/resolved_model/fallback_used;
      exact software versions and factoring routine with its cap; explicit
      seeds-not-applicable statement).
    - >-
      All four control families (CTRL-ORDER-PRIME, CTRL-ORDER-KOBLITZ,
      CTRL-CM-KOBLITZ, CTRL-HASSE) reported as passing in controls.json for
      every attempted row; any failure invalidates the affected row(s) or
      the whole pipeline per specification.yaml invalidation_rules and is
      reported as such, not silently worked around.
    - >-
      CTRL-FIG1-ROWCHECK applied per row with all three applicable checks
      (product identity, primality, maximality) for complete factorizations,
      and divisibility + censored residual for incomplete ones (K-409,
      K-571); no row described as "reproduces Figure 1" on product identity
      alone.
    - >-
      figure1_transcription.md carries the complete row inventory (row
      count, labels, printed order), the stated P(c_pi) column semantics,
      provenance, and an explicit UNCHECKED-AGAINST-SOURCE banner.
    - >-
      Every row reported as "contradicts" is backed by a machine-checkable
      counterexample certificate under certificates/, independently
      re-verified by verify_certificates.py sharing no code with the run
      script.
    - >-
      No level count reported for any row whose c_pi factorization is
      incomplete; no censored factorization reported as c_pi = 1; no
      naive-square-part value reported as the D1 conductor without being
      labelled secondary.
    - >-
      analysis.md contains no statement asserting that arXiv:math/0411378v3
      contains an error, and uses none of "verified", "confirmed", or
      "finding" to describe any Figure 1 result.
    - >-
      Artifacts exist only under write_scope; nothing is committed by the
      Executor. A Coordinator snapshot archival task, run alone, stages
      exactly these artifacts, and the post-commit verifier accepts the
      receipt before this result is treated as durable (AGENTS.md;
      CLAUDE.md).

  archived_by: TASK-20260906-426de9
  archived_by_note: >-
    Allocated and verified free by the dispatching session
    (`tools/allocate_id.py --next handoff` then `--check`, 0 occurrences at
    mint time). TASK-20260906-426de9 is the single Coordinator-run snapshot
    archival task covering both this handoff's and EXP-JMV-004 branch (a)'s
    sibling handoff's (TASK-20260906-a29dee) producer output, dispatched
    together as one batch. That archival task's own record is authored when
    the Coordinator performs the snapshot commit, per AGENTS.md's archival
    discipline (isolated snapshot before ledger commit).

  return_format: >-
    A short structured summary naming: the run id(s) actually executed
    (up to 5, within the 3600s/run, 4GB, 1-CPU-hour cap); per-control-family
    pass/fail across all attempted rows; the per-row Figure 1 verdict table
    location (cpi_table.csv) with counts of reproduces/contradicts/censored/
    not_attempted; the exact list of certificate files emitted (if any row
    contradicted); confirmation that figure1_transcription.md carries the
    complete verbatim paste with its UNCHECKED-AGAINST-SOURCE banner;
    cumulative wall-clock and CPU-hours consumed BY THIS TASK, stated
    explicitly so the dispatching session can reconcile it against the
    shared RQ-JMV-001 track pool alongside EXP-JMV-004 branch (a)'s
    consumption; and confirmation that no Figure 1 conclusion language was
    used anywhere. If any control or invalidation_rule was triggered, report
    it plainly as an invalidated row/pipeline, not as a negative finding.
