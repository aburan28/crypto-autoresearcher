  constraints:
  - You are not alone. Own only three exact new outputs;no Git,ledger,queue,claim,status,approval,source or
    image mutation.
  - Read full declared inputs and verify all hashes. No producer/parent conversation or concurrent reports.
  - Fresh native review-adversarial gpt-5.6-sol/xhigh,no fallback,degradation,Bedrock or serving probe.
  - Allowed Docker operations are read-only image inspect and image save for exact ID sha256:376f4a364f0b4cf1422b0f4ef1855b080e91ac858b47ef94dd8eee764d1eb3a7
    through unix:///Users/adamburan/.docker/run/docker.sock only. No create/run/start/exec/cp/commit/tag/pull/push/kill/rm/prune
    or settings changes. No image code or library import executed.
  - At most2read-only image export invocations including failures;precheck each output path and keep unique
    owned temporary exports. Maximum2GiB per export/cumulative uncompressed data,memory2GiB,streamed buffers<=1MiB,oneworker.
    Export watchdog180seconds. Reject malformed/traversing archive paths;read members as data,never extract
    or follow archive symlinks. Retain export/command hashes and delete only owned temporary exports after
    custody.
  - At most128fixed malformed-control cases including failures/reruns,each complete suite<=48with finalreserved;10s/case1800aggregate
    executed-check wall/CPU. Source/hash/archive-file comparisons are administrative and their counts remain
    explicit.
  - The final preparation receipt adds Coordinator annotations inside inner.image_binding after execution;they
    are not container-emitted observations. Its solver/generator exclusion means repository experiment code,not
    the mathematical functions shipped by SymPy. Audit actual command outputs separately.
  - Return exact three hashes,scoped verdict and all limitations. No scientific,8GiB group-guard,whole-runtime
    or launch verdict.
  - 'Both historical audits remain inconclusive: one original supervised invocation and two portable setup
    attempts,all before image operations/controls. Prior missing reservation/UTC and command-result bytes remain
    unavailable. This successor does not reset or rewrite those historical counts.'
  - Every supervisor,watcher-readiness and audit invocation MUST use exec_command sandbox_permissions=require_escalated,with
    justification limited to the approved scoped process queries,owned-worker supervision and exact read-only
    image inspect/save. Do not repeat the known default-environment query path. No sudo,settings change,provider/model
    change,live container action or broader Docker permission is authorized.
  - Take explicit --repo from the published claim. No fixed parent-depth inference or import-time repository
    lookup before reservation. Before any code invocation create a unique exclusive attempt directory,command/source
    reservation and outer log destinations. Include launch exceptions as observations with unavailable exit/output
    fields where appropriate.
  - Before any Docker operation,the exact owned audit worker must pause at a nonce/hash/PID-bound startup barrier.
    Demonstrate scoped descendant discovery and at least two valid aggregate-RSS samples under the declared
    escalated mode. Save an explicit watchdog-readiness phase record with all command rows and its outcome
    before releasing the barrier. A failed readiness phase performs no image operation.
  - Parent sampled-RSS threshold2GiB,nominal sample start cadence<=100ms,one checker worker,streamed buffers<=1MiB
    and existing2GiB export/uncompressed-data caps remain. No RLIMIT_AS attempt. Record actual cadence/overshoot
    and raw sample basis;never claim kernel hard-limit enforcement. Known-terminal children have unavailable
    final samples,not fabricated zero RSS.
  - Persist every monitor/Docker command argv,start timestamp,terminal status,stdout,stderr,timeout or launch
    exception to an append-only journal or exclusive per-command files BEFORE checking/parsing the return or
    raising. Do not keep the only copy in a local list returned on success. Exceptions carry or reference their
    preserved command history. On controller failure,terminate/reap only its owned worker/process group and
    preserve the primary cause plus any cleanup failure.
  - At most two watchdog setup attempts including failures,only the second following a concrete documented
    setup correction. Existing2export and128control ceilings remain inclusive of all attempts. Do not rerun
    successful observations or export again merely to reread a hash-preserved temporary archive after a checker
    correction.
  - Use the previous independent checker as a starting point only after inspecting its logic;unexecuted checks
    are not evidence. Independently challenge complete config/layer/base-prefix/wheel/file/overlay semantics
    with declared malformed controls,not just watcher setup.
  - Every attempt preserves exact checker bytes,all outer tool responses/session/polls/terminal exits,nested
    commands/UTC/streams,all controls and metrics. Create canonical check-receipt.json exactly once after every
    intended attempt has terminated. Never reserve it as an attempt sink. Retain every failure and missing
    layer explicitly;no reconstructed history.
  - The committed source snapshot is an all-input tree anchor. The image preparation remains bound to its original
    image/receipt identities;unlisted native-source files in that tree are not inputs or evidence for this
    audit.
  - Capture command stdout/stderr as raw bytes or lossless encoded/log-file data before decoding or parsing;
    a decoding error must not discard the original bytes. Any human-readable replacement decoding is supplementary
    and explicitly labeled.
