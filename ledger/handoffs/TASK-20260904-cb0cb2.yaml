handoff:
  id: TASK-20260904-cb0cb2
  from: coordinator
  to: [validator, red-team]
  created_at: '2026-09-04'
  experiment_id: EXP-MONO-917e3a
  hypothesis_id: H-MONO-93bc4d
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001

  objective: >-
    Stage-2 independent review, required before HEUR-KUM-2 (H-MONO-45183a's
    own named weakest link) can be cited anywhere as discharged: blindly
    re-derive the candidate proof in IDEA-20260904-0417a5/H-MONO-93bc4d that
    the translation action of V=F_2^{m-1}/<diag> on the Semaev summation
    cover's sign-class roots is free (hence the cover is irreducible, hence
    the monodromy over k(x_1..x_{m-1}) is exactly (Z/2)^{m-2}), starting
    from the reduction's own statement and the relevant parameters -- never
    from this record's own argument text -- and independently verify the
    Stage 0-1 computations this Coordinator performed directly.

  review_plan:
    coordinator_prior: >-
      Recorded BEFORE either reviewer is dispatched. This Coordinator finds
      the reduction (translation-action faithfulness implies irreducibility)
      genuinely elementary and correct, and finds Steps 1, 2, and 4 of the
      mechanism (see IDEA-20260904-0417a5) fully rigorous on inspection. The
      one step this Coordinator holds with only moderate confidence is Step
      3's own honest gap for |S|>=2: the idea's own text offers a
      specialization-witness repair (existence of one point where a
      polynomial identity is nonzero proves it is not the zero polynomial),
      which this Coordinator independently computed and confirmed at m=4
      (two curves, both clean on the first attempt) and m=5 (one clean
      witness after one disclosed collision). This Coordinator believes the
      specialization-witness technique is sound and sufficient, but has NOT
      independently verified that the witnesses computed are drawn from a
      sufficiently generic point in the sense the technique formally
      requires (i.e., that no hidden lower-dimensional degeneracy in the
      chosen curves/points could invalidate the inference) -- this is
      exactly the kind of subtle gap this lane's own history (the group-
      uniform formula error found by TASK-20260904-b4b00c) suggests a fresh
      reviewer is more likely to catch than the party who wrote the
      argument.
    claim_under_review: >-
      Whether (a) the translation-action-freeness reduction of HEUR-KUM-2
      is correct and complete except for the named |S|>=2 gap; (b) the
      specialization-witness technique, as applied to the specific curves
      and points this Coordinator computed, rigorously closes that gap at
      m=4 and m=5; (c) the proves-too-much control (the argument's own
      genericity step correctly fails to apply on the factor-base
      sublocus) is correctly satisfied.
    joints:
      - joint: J1-BLIND-REDERIVATION-OF-THE-REDUCTION
        assigned_to: validator
        attack_plan: >-
          Starting ONLY from the statement "HEUR-KUM-2 claims S_m is
          irreducible over k(x_1..x_{m-1}) for m>=4; A-2 (already
          `supported_scoped`) shows the Galois group embeds in
          V=F_2^{m-1}/<diag> acting by translation on the 2^{m-2} sign-class
          roots" -- WITHOUT reading IDEA-20260904-0417a5's or
          H-MONO-93bc4d's own mechanism text -- independently derive
          whether containment plus a translation action gives equality
          whenever the action is faithful, and independently derive the
          exact torsion criterion for when a nonzero class [w] fixes a
          root (expected: 2Q_S=O or 2Q_S'=O, where S is w's support). Then,
          and only then, compare against this record's own stated
          derivation and report agreement or discrepancy.
      - joint: J2-INDEPENDENT-WITNESS-VERIFICATION
        assigned_to: validator
        attack_plan: >-
          Independently re-implement the witness search (do not read or
          reuse experiments/EXP-MONO-917e3a/implementation/witness_search.py
          before writing your own) and verify: (i) the two m=4 witnesses
          reported in raw-result.json are correct (recompute the point
          additions yourself from the given curve parameters and starting
          points); (ii) at least one clean m=5 witness exists (you may use
          the same curve/points this record used, or find your own -- report
          which); (iii) whether the "specialization implies genericity"
          inference is actually valid for THESE specific witnesses, or
          whether you can identify a reason a witness at one point might
          fail to establish the generic claim (e.g., if the witness curve
          or points sit on some special sublocus).
      - joint: J3-ADVERSARIAL-GAP-HUNT
        assigned_to: red-team
        attack_plan: >-
          Adversarially hunt for a flaw in the |S|>=2 case specifically.
          Try to construct, or argue for the existence of, a nonempty
          signed subset sum of GENERIC (indeterminate) points that DOES lie
          in E[2] for some |S|>=2 -- even a partial or heuristic argument
          for why this might be possible would be a serious finding. Also
          check: does the argument's claimed injectivity of S_{m-1} ->
          Aut(V) for m>=4 (Step 4) actually hold at m=4 specifically (deg 3
          symmetric group into GL_2(F_2), order 6 vs order 6 -- is this
          actually an isomorphism, and does the mechanism's claim survive
          that special case)?
      - joint: J4-SCOPE-AND-CONFLATION-CHECK
        assigned_to: red-team
        attack_plan: >-
          Check the record's own named confounder (object conflation
          between H-MONO-0b3def's m=3 D_4 on four POINTS of E, versus this
          record's m=3 corollary group of order 4 on two ROOTS of S_3) is
          genuinely avoided in H-MONO-93bc4d's own text, not merely
          disclaimed. Also verify the m=3 baseline reproduction claim
          (setting m=3 in this record's own reduction should give exactly
          S_2, matching EV-MONO-a0a89c OBS-2) actually works out.
    blindness:
      lifted_for: null
      rationale: null
      declaration: >-
        Both reviewers are launched as fresh subagents with no prior
        context; each must independently state whether it read the other's
        output or any sibling review directory before forming its own
        conclusions. The Validator's J1 blind rederivation must be
        completed and locked to disk BEFORE reading this record's or the
        idea's own mechanism text, per this lane's established blind-first
        discipline (TASK-20260904-b4b00c).
    proves_too_much:
      objects:
        - >-
          The reduction argument, if applied unmodified to the
          FACTOR-BASE sublocus (where x_i are specific rational values, not
          indeterminates), must FAIL to conclude freeness -- because
          freeness is known FALSE there (Part B's own B-1 criterion, rate
          6(tau-1)/N at m=4). A reviewer's own re-derivation must be
          checked against this known-false case.
      failure_signature: >-
        If a reviewer's own independent re-derivation of the reduction
        would ALSO "prove" freeness on the factor-base sublocus, the
        re-derivation itself is flawed (it is not using genericity
        essentially), regardless of what it concludes about the generic
        case.
    blind_rederivation:
      required: true
      quantity: "The translation-action-freeness reduction and its torsion criterion"
      assigned_to: validator
      blind_from:
        - ledger/proposals/IDEA-20260904-0417a5.yaml
        - ledger/hypotheses/H-MONO-93bc4d.yaml
        - experiments/EXP-MONO-917e3a/implementation/witness_search.py

  budget:
    wall_clock_seconds: 3600
    memory_gb: 4
    maximum_runs: 0

  constraints:
    - Do not commit or push. Report only, in your own review directory under experiments/EXP-MONO-917e3a/reviews/{validator,red-team}/.
    - Do not read the sibling reviewer's directory before forming your own conclusions; disclose whether you did.
    - Do not change any research status, ledger record, or hypothesis field -- this Coordinator composes the resulting decision after both reports land.

  completion_gate: >-
    Both a validation-report.yaml and a red-team-report.yaml filed, each
    addressing its owned joints explicitly, before the Coordinator composes
    the decision that determines whether HEUR-KUM-2 is discharged.

  inference:
    requested_policy: review-adversarial
    reasoning_effort: xhigh
    runtime: claude_code
    resolved_model_id: claude-sonnet-5
    model_verified: true
    fallback_used: false
    degraded_requirements: []
