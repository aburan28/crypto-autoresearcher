  objective: >-
    Compute every quantity that
    coordination/review/nistbin-20261002-f435ab/blind-inputs.yaml and its
    amendment coordination/review/nistbin-20261002-f435ab/blind-inputs-amendment-01.yaml
    define (Q0 undetermined choices; Q1-571 matched rho at two rows; QM memory
    columns and the Boolean variable count of system (5); Q3 a threshold
    table; QB the degree at which one row-count reading stops growing faster
    than another; QNF any transcribed quantity), from their definitions and
    parameters alone, and report every output they ask for. You are told what
    to compute and not how, and you read no other artifact of this program.
  uncertainty_reduced: >-
    Whether the memory columns, the variable count of system (5), the
    threshold table and the M7-BIN degree are determined by the stated
    definitions and the published model. Disagreement localises to a model
    choice or to one of named implementations.
  inputs:
    - ledger/handoffs/TASK-20261002-84c5d6.yaml
    - coordination/review/nistbin-20261002-f435ab/blind-inputs.yaml
    - coordination/review/nistbin-20261002-f435ab/blind-inputs-amendment-01.yaml
  read_scope:
    - ledger/handoffs/TASK-20261002-84c5d6.yaml
    - coordination/review/nistbin-20261002-f435ab/blind-inputs.yaml
    - coordination/review/nistbin-20261002-f435ab/blind-inputs-amendment-01.yaml
    - inputs/FIPS186-4-BINARY-CURVES/fips186-4_text.md
