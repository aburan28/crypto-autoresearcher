  read_scope_note: >-
    A whitelist of twelve repository files; the Semaev paper under RD-SEM and
    the SEMBIN specification under RD-SPEC (both stated in blind-inputs.yaml).
    Every other repository path is out of scope. No git history of any kind,
    no pull-request text and no commit message. Published mathematics from
    outside the repository may be used and is cited with provenance.
  write_scope:
    - coordination/goals/GOAL-ECDLP2M-001/batches/BATCH-f435ab/reviews/TASK-20261002-84c5d6/
  constraints:
    - BL-1 Read only the twelve paths of read_scope, under RD-SEM and RD-SPEC. Do not open any other file, any other card, or any report of this batch.
    - BL-2 Run no git log, git show, git blame or git diff of any kind, and read no pull-request text or commit message.
    - BL-3 Choose your own libraries and algorithms and name them with versions. Do not transcribe any value; compute it.
    - BL-4 If you find a computed answer to any quantity anywhere you were permitted to read, stop reading that file and report a leak by file and line, never the value.
    - BL-5 Report on J10 only, with verdict inconclusive by design; you are forbidden to compare.
    - BL-6 Zero experiment runs. Instantiate no curve, run no rho walk and no Groebner, XL, SAT or F4 solver.
    - BL-7 Write nothing outside your write scope and your private scratch subdirectory. Put every script, command and raw output inside computations.json. sources_read lists files read, never files written.
    - BL-8 Obey RD-SEM, RD-SPEC and the exposure rule; attest each.
    - BL-9 If the amendment is absent when you are launched, stop and report an impediment, not a result.
    - BL-10 R-CONTINUATION; write a skeleton first and fill quantity by quantity.
