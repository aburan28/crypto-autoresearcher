handoff:
  id: TASK-20260811-029a6c
  recorded_at: '2026-08-11'
  from: coordinator
  to: red-team
  role: red-team
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-aeeb17
  reviews_batch: BATCH-aeeb17
  preregistered: true
  preregistration_note: >-
    THIS ENVELOPE WAS WRITTEN AND COMMITTED BEFORE ANY PRODUCER OUTPUT EXISTED,
    so the review scope could not be tuned to the results. The snapshot commit
    and the concrete list of filed IDEA identifiers are the only fields the
    Coordinator fills in at dispatch; every check below is fixed as of the
    pre-registration commit.

  objective: >-
    ATTACK the BATCH-aeeb17 idea corpus: hidden assumptions, quantifier slippage,
    omitted end-to-end costs, renamed known approaches from the published
    literature, and optimistic priors. Then do the two constructive things only an
    adversarial reader can do -- give the cheapest falsification of the batch's most
    attractive proposal, and return an honest per-axis verdict on whether these five
    axes reached objects the fourteen-lane index cannot express or merely re-derived
    the existing corpus in new language.

  uncertainty_reduced: >-
    Whether BATCH-aeeb17's proposals are admissible, genuinely novel against a
    146-record corpus, honestly costed, and correctly routed under pause
    conditions P2 and P3 -- and whether the batch's own pre-registered coverage
    hypothesis survived contact with its results. Ideation is cheap to produce
    and expensive to act on; this review is what decides whether anything here
    is worth a contract.

  inputs:
  - AGENTS.md
  - CLAUDE.md
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-aeeb17/BATCH-CARD.md
  - analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md
  - ledger/goals/GOAL-ENDO-001/goal.yaml
  - knowledge/findings/KN-FIND-b7e091.md
  - docs/inventor-protocol.md
  - docs/claims-and-verification.md
  - ledger/proposals/
  - ledger/handoffs/TASK-20260811-5ff234.yaml
  - ledger/handoffs/TASK-20260811-6ca12c.yaml
  - ledger/handoffs/TASK-20260811-f58f22.yaml
  - ledger/handoffs/TASK-20260811-c439c2.yaml
  - ledger/handoffs/TASK-20260811-6d56a7.yaml
  snapshot_commit: FILLED_AT_DISPATCH
  filed_idea_ids: FILLED_AT_DISPATCH

  constraints:
  - >-
      YOU ARE AN INDEPENDENT SESSION AND DID NOT ORIGINATE THIS OUTPUT. Read the artifacts at the declared snapshot commit. Do not accept any producer's self-report as verification of itself; a self-reviewed instrument is not a control, and the same applies to a self-screened novelty claim.
  - >-
      YOU CHANGE NO STATUS AND NO RAW ARTIFACT. You do not edit the IDEA records, do not move any hypothesis, do not approve or reject anything officially, and do not commit. You write ONE report at your declared path. The Coordinator adjudicates.
  - >-
      CORE RULE 5 BINDS YOU TOO. Never fabricate a check you did not run, a file you did not read, or a count you did not compute. If you could not verify something, record it as unverified and say why. An unverified check is not a passed check.
  - >-
      STANDING CONSTRAINTS YOU ARE CHECKING AGAINST, not relitigating: H-ENDO-001 is the admissibility filter (every endomorphism acts on the prime-order subgroup G as a scalar, so a proposal whose only use of phi is to apply it to points of G is INADMISSIBLE ON ITS FACE); KN-FIND-b7e091's generic-group closure is BINDING and may be extended but never revisited; H-STR-002 is `weakened` with DEFER-BATCH009-001 OPEN, so goal pause condition P2 fires on any result bearing on it in either direction; pause condition P3 means a candidate appearing to exceed the automorphism-discounted rho baseline must be FLAGGED AND STOPPED, never stated, and sqrt(6) (KN-TECH-018) is baseline calibration and never an exponent.
  - >-
      THE BATCH'S OWN COVERAGE HYPOTHESIS IS ITSELF UNDER REVIEW. BATCH-CARD.md section 1 pre-registers the claim that the fourteen lanes are indexed by resource applied to a single curve's point group, leaving objects the indexing cannot express thinly generated. If what came back is mostly existing proposals in new language, SAY SO PLAINLY -- that finding is worth more than a generous review, and 'the idea space is saturated' is an accepted and intended deliverable of this batch.

  checklist:
  - >-
      R1. QUANTIFIER SLIPPAGE, AXES A2 AND A3 ABOVE ALL. Reductions and preprocessing claims in this area die almost entirely from quantifier order. For every proposal that asserts a reduction, a barrier, or an advice tradeoff, write out the quantifier order YOU read in its mechanism and compare it to the one the record CLAIMS. Any mismatch is a finding. A2 was explicitly told a proposal that does not pin the order is inadmissible -- check that it complied rather than gestured.
  - >-
      R2. OMITTED END-TO-END COSTS, AXIS A3 ABOVE ALL. A preprocessing proposal is the single easiest place in this program to hide a cost. For every such proposal, charge it yourself end to end: advice size, advice CONSTRUCTION cost, transport cost (and WHICH transport -- reaching a uniformly random class member is cheap in O(log p) steps, reaching a SPECIFIED one is vectorization-hard at about p^{1/4}), memory access pattern, and the online time. Then compare against the generic bounds the record cites (Corrigan-Gibbs--Kogan roughly S*T^2 ~ N, Bernstein--Lange, Mihailescu, AT^2) and CHECK THE RECORD QUOTED THEM CORRECTLY. A misquoted bound invalidates the axis and you should say so.
  - >-
      R3. RENAMED KNOWN APPROACHES. Every record carries a `why_not_a_renamed_known_approach` field. Attack it. Use WebSearch/WebFetch against the published literature, not only against this repository's corpus -- the validator covers the internal corpus, you cover the outside world. Name any proposal that is a known published technique wearing new vocabulary, with the citation.
  - >-
      R4. THE CHEAPEST FALSIFICATION OF THE BATCH'S MOST ATTRACTIVE PROPOSAL. Identify the single proposal most likely to be promoted to a contract, then design the CHEAPEST measurement or derivation that would kill it. If that test is cheaper than the one the record proposes as its `minimal_test`, say so and give it -- that is a direct, immediately actionable contribution to the next batch.
  - >-
      R5. CALIBRATION OF `honest_prior_of_survival`. These numbers are supposed to be honest. Judge whether each is calibrated or optimistic, given the campaign's actual track record: 146 prior proposals, a paused gating lane, and a pre-registered expectation in DECOMPOSITION.md section 5 that the most likely genuine deliverable is a NEGATIVE. Systematic optimism across a batch is itself a finding.
  - >-
      R6. THE SATURATION VERDICT. Answer the batch's own pre-registered coverage hypothesis directly and in your own words: did these five axes actually reach objects the fourteen-lane index cannot express, or did they re-derive the existing corpus in new language? Give a verdict per axis. 'Saturated' is an accepted and intended deliverable and you are not doing the campaign a favour by avoiding it.
  - >-
      R7. THE ONE THING THAT WOULD MAKE THIS BATCH WORTHLESS. State the strongest single argument that this entire batch is make-work -- and then say whether you believe it. The campaign's own rules treat premature closure as a failure mode symmetric with overclaiming, so answer honestly in both directions.

  deliverables:
  - >-
    ONE report at coordination/goals/GOAL-ENDO-001/batches/BATCH-aeeb17/reviews/TASK-20260811-029a6c/red-team-report.yaml, parseable YAML, carrying: a per-record verdict for
    every filed IDEA identifier; a per-axis verdict; every finding with an id,
    a severity, the exact file and field it attaches to, and what would settle
    it; an explicit list of checks you could NOT complete and why; and the
    requested policy alongside the model that actually answered.
  - >-
    An overall verdict of one of: PASSED, PASSED_WITH_FINDINGS, INCONCLUSIVE, or
    FAILED -- with the reason stated in one sentence. INCONCLUSIVE is a real and
    acceptable verdict; do not manufacture a decisive one.
  - >-
    A DISSENT is available to you and BLOCKS Coordinator approval of whatever it
    names until a successor Coordinator decision supersedes it on the merits.
    Use it for something you would defend, not as emphasis.

  artifact_paths:
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-aeeb17/reviews/TASK-20260811-029a6c/red-team-report.yaml

