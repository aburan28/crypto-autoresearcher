handoff:
  id: TASK-20260906-ff9f2e
  from: coordinator
  to: idea-generator
  objective: 'Generate one or two schema-complete proposals bound to RQ-LHW-1877bb: a low-storage algorithm
    for the low-Hamming-weight discrete logarithm problem (logarithm of bit-length m and weight w in a
    generic prime-order group) whose time matches sqrt(binom(m, w)) up to polynomial factors, or a stated-model
    obstruction. Known as reported: meet-in-the-middle on the weight reaches that time WITH storage of
    the same order; polynomial-memory methods (KN-LIT-4794, Esser-May nested collision finding and representations)
    are reported at a worse exponent. Candidate shapes: (i) an algorithm proposal -- e.g. a rho-type walk
    on the class with a step rule whose mixing is justified, a nested-collision or representation construction
    with a declared memory profile, or a distinguished-point meet-in-the-middle with time-memory trade-off
    analysed exactly -- with target_complexity giving time and memory exponents in terms of binom(m, w)
    and m, numbered heuristic_assumptions with validation routes, a planted-instance instrument with certificate
    [x]P = Q and popcount(x) = w, a measured peak-storage trace, and the four comparison rows named in
    the RQ (memory-heavy MITM, plain rho ignoring the promise, the reported 2^{0.65n}-type algorithm as
    a control, and the plain-integer subset-sum arm as the dynamic-range control); (ii) an obstruction
    proposal scoped to a named class of low-memory methods, with the cheapest falsifying measurement.
    H-ICEX-8f9ea2 and EXP-ICEX-850e41 already treat W(m, w) as a promise class and measure T(W); name
    them in discriminated_from with the exact delta (storage is the object here, not the time exponent
    alone).'
  uncertainty_reduced: Whether the user-named target 'low-storage low-Hamming-weight DLP at sqrt(binom(m,
    w)) time' admits an object-first, falsifiable proposal with a sound verifier that no existing record
    already covers.
  inputs:
  - coordination/ideation/targets-20260906-76d6dc/tasks/TASK-20260906-ff9f2e/context.md
  - ledger/questions/RQ-LHW-1877bb.yaml
  - knowledge/literature/KN-LIT-4794.md
  - knowledge/literature/KN-LIT-2177.md
  - knowledge/literature/KN-LIT-2135.md
  - ledger/hypotheses/H-ICEX-8f9ea2.yaml
  - experiments/EXP-ICEX-850e41/specification.yaml
  - ledger/questions/RQ-ECDLP-002.yaml
  - AGENTS.md
  - agents/idea-generator.md
  - docs/inventor-protocol.md
  - docs/target-result-profile.md
  - templates/research-records.md
  - ledger/proposals
  - knowledge/literature
  - knowledge/techniques
  constraints:
  - Use exactly the assigned IDEA ids and write only their files; never overwrite; never run git; file
    one proposal if only one genuinely distinct candidate survives screening -- never pad.
  - 'THE crypto-kb RETRIEVAL INDEX IS EMPTY THIS SESSION ('':memory:'', verified by the orchestrator):
    do not call search_knowledge; screen by reading; cap novelty_status at unverified unless you actually
    opened a primary source (provenance retrieved, verified_by naming this task). WebFetch is available
    for opening sources.'
  - 'Every proposal is a complete idea record per agents/idea-generator.md: claim, mechanism, novelty_status
    and novelty_screen, citations with provenance (user-supplied framing is provenance internal citing
    the RQ record), assumptions, predictions with named metrics and minimum_effect, minimal_test with
    controls and a null object of the same shape, a decay parameter, falsification_conditions, confounders,
    interpretation_limits (claim_tier toy), heuristic_assumptions with validation routes, target_complexity
    with honest exponents and hidden_overhead, non-null dominated_by, quantitative sota_delta, estimated_cost,
    recommended_priority, honest_prior_of_survival, discriminated_from naming the nearest existing record
    and the exact delta, yaml_parse_disclosure; proof_search_map for any proof-oriented proposal.'
  - 'Respect the RQ constraints verbatim: the verifier named in decision_target is mandatory in the minimal
    test; reported literature exponents are treated as reported until reproduced; toy scale only; no run
    is authorized by a proposal.'
  - 'Pace output: read files one at a time; write each proposal in its own Write call; keep any single
    response under roughly 12,000 tokens (a prior session was terminated at the 64,000-token output cap).'
  - No experiment, hypothesis, approval, status transition, knowledge promotion, or deployed-target interaction;
    no imagined outcomes; no Bedrock, no fallback, no degradation.
  deliverables: &id001
  - ledger/proposals/IDEA-20260906-ab08cb.yaml
  - ledger/proposals/IDEA-20260906-f0b07d.yaml
  artifact_paths: *id001
  archived_by: TASK-20260906-76d6dc
  inference:
    policy: research-deep
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 3600
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
  - One or two schema-complete proposals bound to RQ-LHW-1877bb, mechanism-distinct from every screened
    record with the nearest record and exact delta named.
  - Each proposal gives time AND memory exponents against binom(m, w) and names the meet-in-the-middle
    and plain-rho baselines.
  - Each proposal names H-ICEX-8f9ea2 / EXP-ICEX-850e41 in discriminated_from with the exact delta.
  - Every claimed solve in the minimal test carries a certificate; every memory claim is a measured trace.
  - novelty_status unverified unless an opened source is cited with provenance retrieved and verified_by.
  - 'Return lists per filed id: title, class, novelty_status, sota_delta, first test; unused ids and why.'
  return_format: idea records per agents/idea-generator.md plus the per-id summary
