handoff:
  id: TASK-20260803-90c29e
  from: coordinator
  to: red-team
  objective: 'Two jobs. FIRST, challenge the D7 source reading: is the quoted locus really what it is
    claimed to be, is the inside/outside answer entailed by the quotes, and does any other passage in
    the document contradict it? SECOND, and this is the substantive one, ATTACK THE BATCH-010 MISSPECIFICATION
    READING. EV-MLKEM-eac95b O-2 concludes that Approximation 4.9''s family is misspecified because the
    best achievable rms on real data is 0.426 bits rather than 0, while the identifiability control recovers
    the generating exponent exactly on noiseless data. Build the strongest case that the 0.426-bit floor
    is instead an ARTIFACT: of the fitted-normalisation protocol, of the resolved-band choice, of counting
    noise in the archived measurement, of the quadrature, or of any modelling choice BATCH-010 made and
    did not vary. Then name the single cheapest check that would settle it. Also weigh the tail counter-instance
    (O-4: on T>1000 the n=43 own exponent IS the argmin) -- is it the least informative region as recorded,
    or is it the region that matters?'
  uncertainty_reduced: Whether the misspecification reading survives adversarial challenge, or whether
    BATCH-010 mistook its own protocol's floor for a property of the model. Nothing may be promoted until
    this is answered.
  inputs:
  - The verified snapshot commit and its three artifacts
  - ledger/evidence/EV-MLKEM-eac95b.yaml and ledger/decisions/DEC-20260803-ed6522.yaml
  - coordination/goals/GOAL-MLKEM-003/batches/BATCH-010/ (producer and validator packages, including the
    identifiability control)
  - docs/inventor-protocol.md
  - ledger/corrections/CORR-20260802-d8ba0e.yaml (why this branch promotes nothing without a red-team
    pass)
  constraints:
  - Never fabricate a command, output, quotation, statistic, citation, or run (AGENTS.md rule 9).
  - 'ZERO NEW SAMPLING and NO NETWORK. Work only from artifacts already in the repository: the vendored
    PDF at experiments/EXP-MLKEM-010/vendor-lock/Carrier-2022-1750-hal-05406481.pdf (sha256 083b1422...b8005,
    immutable - READ ONLY, never modify) and the extracts under inputs/MLKEM-DUAL-SOURCES-20260802/extracts/.'
  - Quote verbatim with a page and equation locus. A paraphrase of a formula is not a reading of it.
  - Toy tier. No ML-KEM security claim in either direction.
  - 'AGENTS.md rule 12 is UNMET and UNWAIVED: EV-MLKEM-011, EV-MLKEM-013 and EV-MLKEM-017 keep their status.
    Write nothing that changes them.'
  - Write only inside your declared write_scope. Do not git commit.
  - Independent session. Do not defer to the producer, the validator, or the Coordinator's framing.
  - You did not produce these packages and must not repair them. Write objections; do not edit producer
    artifacts.
  - 'Every objection must be CHECKABLE: name the artifact, path, locus, or computation that would settle
    it. An objection that cannot be settled is a complaint.'
  - If the misspecification reading SURVIVES your attack, say so plainly and say what it is then entitled
    to claim. A red team that always finds a fatal flaw is as useless as one that never does.
  - 'Apply the inventor-protocol closure standard: any claim that a lane is dead needs a named obstruction
    and forward guidance, not a fatigue count.'
  deliverables:
  - 'red_team_report.yaml: numbered objections each with a named cheapest check, a verdict of pass / pass_with_constraints
    / blocking_objections, and an explicit statement of whether the misspecification reading survives'
  - 'objections.md: the argued case'
  artifact_paths:
  - coordination/goals/GOAL-MLKEM-003/batches/BATCH-011/tasks/TASK-20260803-90c29e/red_team_report.yaml
  - coordination/goals/GOAL-MLKEM-003/batches/BATCH-011/tasks/TASK-20260803-90c29e/objections.md
  archived_by: TASK-20260803-9d382c
  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: true
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 2700
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
  - every objection names a checkable artifact, locus or computation
  - the cheapest check that would settle the 0.426-bit floor question is named
  - the survival or failure of the misspecification reading is stated explicitly
