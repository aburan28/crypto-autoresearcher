      editing an artifact.
    - >-
      git fetch and merge origin/main into the branch first (merge, never
      rebase); a conflict inside a run artifact or record is a stop, resolved
      only by a superseding record, never by picking a side.
    - >-
      One commit, message naming TASK-20260928-f15632, TASK-20260928-51b8c8,
      EXP-PFDR-7c8bf2, EXP-PFDR-1b78f7, H-PFDR-0cc7e8, H-PFDR-4765e4 and every
      RUN id committed. Then write and verify the post-commit receipt with
      tools/research_dispatch.py (content-first binding: path_sha256 for every
      staged path), push, and open or refresh the PR against main naming the
      same ids. The package is not durable until the verifier accepts it.
    - >-
      Archive as produced. A failed, partial or invalid run set is archived
      with its status; it is not evidence and not negative evidence
      (AGENTS.md core rule 5).
    - No hypothesis, experiment, evidence or goal status changes in this task.
    - Never select a provider, backend, endpoint or model identifier containing Bedrock.
