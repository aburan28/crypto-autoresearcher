  constraints:
    - >-
      DA-1 Superseding and additive. Write exactly the three declared files,
      all new. H-BINSTD-7951d2 carries supersedes H-BINSTD-6e4713 and
      EXP-BINSTD-517186 carries supersedes EXP-BINSTD-532d7f, each with a
      supersession note citing DEC-20260928-cec92e. Each new record is
      complete in itself, not a diff. Edit no version-1 file, proposal,
      hypothesis, experiment, decision, question, correction or goal record.
      Mint no identifier.
    - >-
      DA-2 Scope unchanged. S1 only, as DEC-20260928-63addc states it, with
      IDEA-20260926-4b65e3 Stage 0 as a section; Stages 0 to 3 as in version 1
      except where a revision requirement changes them. Excluded: the
      prime-field engine cells (ICPERF's, PTR-ICPERF); any deployed-parameter
      run; 4b65e3's Stages 1-2 (HOLD-X1).
    - >-
      DA-3 R-J1-1. One B range for the m = 4 envelope, committed identically
      in the specification text and in stage0_code, with the envelope design
      figures (lower edge, upper edge, closing g, contiguity at each g)
      recomputed on that range and stated beside both named slices. So that
      the blind card covers it, the range lies inside log2 B in [29.036035,
      36.000] with endpoints on the 0.01-bit grid that starts at 29.036035 or
      equal to log2 B_cap(4); a range outside that is permitted only with the
      reason recorded, and the part outside is then not compared by J5.
    - >-
      DA-4 R-J2-1. Replace exponent_ic as the gated amortisation observable
      with observables that can fail (the knee location, the flattening ratio
      beyond the knee against kappa_2 times the mean attempt cost, a fit over
      all L), and restate G1, IR-3, the success clauses, the NEGATIVE outcome
      and the falsification criterion on them. For every gated observable
      state the range it can take for arbitrary cost data under the admission
      and fit rules, so the review can see it is not confined inside its pass
      band.
    - >-
      DA-5 R-J2-2. Either predict the determined-column usable probability at
      the R/B of the run (the giant-component law at m = 2) or choose R so the
      touched prediction is the determined one; keep the touched value as a
      diagnostic.
    - >-
      DA-6 R-J2-3. One unit for retries; the prediction stated per mu regime
      with multi-decomposition acceptance; the tail check restated in that
      unit; either match the CTRL-ZN mu to the binary cells (about 1) or
      predict the control's own retries.
    - >-
      DA-7 R-J3-1. A no-reuse null arm (fixed setup plus an independent
      per-target solve) with identical accounting on CTRL-ZN and at least one
      binary cell, differing from the amortisation reading on a gated
      observable; a two-sided binary-against-control usable test; CTL-6 wired
      into an invalidation rule; and an outcome table that assigns every
      reachable result, including the most likely one, to a declared
      outcome. Add an outcome_reachability block: for each declared outcome a
      data pattern that reaches it, and the most likely pattern under the
      contract's random model with its assigned outcome.
    - >-
      DA-8 R-J4-1. Reword the hypothesis title and statement (D) to what the
      contract can certify (toy validation of the form of the law under H1 and
      H2; the two-row reading as the question S1 decides), and keep the
      red-team caution explicit in the outcome table: any window reading made
      with a measured per-attempt cost is a TW-01 reading, routed to its own
      review-breakthrough round.
    - >-
      DA-9 Non-breaking items R-J1-2 to R-J1-6 and R-J4-3. Correct the audit_1
      symbolic check and the reproduction_check (which single-target law the
      L = 1 slice reproduces in each convention); evaluate T_shared from the
      model terms in the L = 1 print; compute the promised m = 5 envelope over
      B or remove the promise, and label statement (B) a B = B_cap statement;
      attribute the D3 values at m = 5, 6, 8 to their actual source; state the
      one-to-one rate between group-operation equivalents in C and modular
      multiply-adds as a model assumption; use the unrounded D3(4) =
      11.010251 or state the tie rule.
    - >-
      DA-10 Non-breaking items R-J2-4 to R-J2-8. Align the coded G1 test with
      the rule text; tie the Stage 1 gate to I1 and I2 or gate them, and
      specify I2's behaviour at a new distinguished point; pin the extraction
      method and reference sha256 of fixture_code and stage0_code, reconcile
      seed labels and the generator, add the F / -F reseed rule and align S2
      wording; charge the Krylov working vectors, put bytes beside time, charge
      the comparator memory at the window upper ends and correct the
      window_memory example; restrict AR-MU to the binary cells.
    - >-
      DA-11 Non-breaking items R-J3-2 to R-J3-4, R-J4-2, R-J4-4 and R-SRC.
      Carry the conventions with the column (129-bit words; N_prime = r/262;
      the multi-target constant c with source and sensitivity; "on the
      frontier within 0.5 bit" restricted to the Bernstein-Lange convention;
      CGK Theorem 10 for the precomputation axis); restate A2 and A3 at m = 2;
      record the orbit-quotient pointer conditional under CORR-20260925-649e25
      and marked not independently reviewed; define the prime-field self-test
      curve and place I1 and I2 under experiments/EXP-BINSTD-517186/ with
      provenance rather than extending the shared index_calculus package in
      place; reword items 3 to 7 of R-J4-4; cite the version-1 red-team
      retrievals with URL and sha256, provenance retrieved, verified_by
      TASK-20260928-a75ba7.
    - >-
      DA-12 Constants. Keep the version-1 model constants as exact forms
      (A(mu) = 1/(1 - exp(-mu)); retry_m = 1/(1 - m exp(-m)); kappa_m =
      A(1) retry_m; mu(B) = B^m/(m! 2^131); LA_m(B) = m B^2) and the unrounded
      comparator inputs (D3(5) = 33.075936, D3(4) = 11.010251, proposal
      convention 32.414212, sub-cap base log2 B = 29.036035), which the blind
      card of this round carries. Any change goes in a constants_delta block
      with its reason.
    - >-
      DA-13 C1 to C8 unchanged. Rho 2^60.8090 (CORR-20260922-81aeab); D3,
      never D1 (CORR-20260928-4cb669); the first-below-the-line clause never
      an outcome, prediction or success criterion (TW-01); fixture as code
      (C4); H1 and H2 with numbered statements, random-model justification,
      supporting results with provenance, validation plans and falsification
      conditions (C5); memory beside time (C6); per-orbit framing conditional
      under CORR-20260925-649e25 (C7); exclusions and zero runs (C8).
    - >-
      DA-14 Approval fields. Controls, metrics, budget, stopping rules,
      invalidation rules, required artifacts, a decidable success criterion
      with at least one reachable negative outcome, a falsification criterion,
      interpretation limits, a proof_search_map; status review_required;
      approved_by null; an approval block stating approval if and only if
      DEC-20260929-1f5fcb is official with decision approve naming
      EXP-BINSTD-517186. The hypothesis has status specified, a mechanism,
      predictions, a test boundary and falsification criteria, with no
      exponent claimed for any oracle.
    - >-
      DA-15 Audit sheet. The four KN-TECH-080 audits and the strictness and
      interface obligations; a C1 to C8 discharge table; a revision discharge
      table mapping every R-J1-1 to R-SRC item of DEC-20260928-cec92e to the
      clause that discharges it; fixture_code and stage0_code as block scalars
      with extraction method and reference sha256; the Stage 0 output; the
      constants block; an attestation of every source read and at what depth.
    - >-
      DA-16 No sentence claims an ECDLP speedup, an exponent move, a
      deployed-curve verdict, an oracle below any budget, or a lane closure
      (plan tripwire TA-1).
    - >-
      DA-17 Zero runs. Execute no instrument, driver or solver. Stage 0 Python
      arithmetic and synthetic data patterns built to show outcome
      reachability are design figures, never results. Cite with provenance.
    - >-
      DA-18 No AUXIN census value, reviewer finding value of another lane,
      RUN-FROB value or EXP-FROB-30006a outcome; nothing about any
      EXP-QSP-70b731 run.
