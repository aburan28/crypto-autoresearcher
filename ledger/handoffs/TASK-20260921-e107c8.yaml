  constraints:
    - >-
      OWN NOTHING OUTSIDE write_scope. Do not edit specification.yaml, any
      file under runs/TASK-20260907-ee1e3c/, or this handoff record. Do not
      edit ledger/decisions/DEC-20260914-d04668.yaml or
      ledger/handoffs/TASK-20260914-7119f2.yaml -- DEP-1 is discharged by
      this review's own evidence/decision records existing, never by editing
      the dependent handoff.
    - >-
      Zero claims are made by EXP-FROB-b8cf21's own frozen spec
      (raw-result.json: certificate.kind=none, claims=[]) and no
      solve/relation certificate applies (docs/claims-and-verification.md's
      certificate requirement is for a claimed solve/relation; this
      experiment states an existence/nonexistence fact about matrix rank,
      not a solve).
    - >-
      The spec's own incomplete_selection rule (specification.yaml line ~95):
      "Fewer than 2 qualifying object curves at either field or any unmatched
      null makes the planned 12-cell experiment inconclusive. Do not replace
      parameters, increase pools or substitute curves outside the fixed
      ordering." q7-n3 has exactly ONE eligible object curve
      (FROB-q7-n3-object02 is ineligible_object,
      reason=fixed_object_curve_pool_exhausted, per
      runs/TASK-20260907-ee1e3c/metrics.json). Do NOT read around this rule
      or treat q11,n5's completeness as curing it; the rule is field-scoped
      language ("at either field") and its own text forbids substituting
      curves to rescue completion.
    - >-
      Do not conflate this review's likely verdict tier with the tier
      appropriate to a support/reject_scoped claim. Re-read
      docs/evidence-and-reproducibility.md's strength hierarchy and
      docs/claims-and-verification.md's claim_tier rules before assigning
      either field.
    - >-
      This task's own review-20260921-independent-replication/ artifacts are
      a REPLICATION, not the required blind_rederivation (see that
      directory's README.md and the blind_rederivation joint below). Do not
      report them as satisfying blind_rederivation.blind_from.

  deliverables:
    - experiments/EXP-FROB-b8cf21/analysis.md
    - ledger/evidence/EV-FROB-<minted>.yaml
    - ledger/decisions/DEC-<minted>.yaml (the coordinator_decision)
    - hypothesis status update on ledger/hypotheses/H-FROB-824aa8.yaml
    - knowledge_promotion disposition (a KN-FIND/KN-OPEN entry, or a
      one-line not_warranted reason -- never "n/a")
    - review_attestation for the blind_rederivation joint, naming
      sources_read, checked by tools/check_review_independence.py against
      this plan's blind_from before the decision is finalised

  artifact_paths:
    - experiments/EXP-FROB-b8cf21/analysis.md
    - ledger/evidence/EV-FROB-<minted>.yaml
    - ledger/decisions/DEC-<minted>.yaml
    - ledger/hypotheses/H-FROB-824aa8.yaml (status field only)
    - knowledge/findings/KN-FIND-<minted>.md OR knowledge/open-problems/KN-OPEN-<minted>.md
      (whichever the promotion gate calls for; may be neither, with reason
      recorded)

  # Minted 2026-09-21 with `tools/allocate_id.py --next handoff --date 20260921`
  # and confirmed free with `--check` (0 occurrences across 25550 paths).
  archived_by: TASK-20260921-2befda

  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false

  budget:
    wall_clock_seconds: null
    memory_gb: null
    maximum_runs: 0

  completion_gate:
    - analysis.md exists, strictly separated into Observation/Comparison/
      Inference/Limitation, and cites every EV-/DEC-/EXP-/RUN- id it relies on
    - EV-FROB-<minted>.yaml exists with direction, strength, claim_tier,
      certificate_refs (empty list, justified per constraints above),
      proof_status/proof_refs, boundaries, unresolved confounds
    - >-
      if direction is weakens or contradicts, the obstruction block is
      filled (quantity, measured value, units, error bars, runs, scope) and
      resource_check.examined is true
    - DEC-<minted>.yaml records one of
      replicate|expand|refine|support|weaken|reject_scoped|inconclusive|pause,
      with rationale, evidence_refs, limitations, next_actions
    - H-FROB-824aa8.yaml status updated to match the decision
    - knowledge_promotion filled (promoted list, or not_warranted with a
      concrete one-line reason)
    - blind_rederivation joint has a review_attestation on file, and
      tools/check_review_independence.py run against this plan reports no
      blind_from violation for that attestation
    - isolated ledger archive commit made and its post-commit receipt
      verified before this handoff is marked complete

  return_format: >-
    Report: the decision, evidence strength, the exact scoped claim the data
    justify (negative-result phrasing per
    docs/evidence-and-reproducibility.md), whether DEP-1 is now discharged,
    and the single next action for TASK-20260914-7119f2 with its role.

  review_plan:
    claim_under_review: >-
      H-FROB-824aa8, statement (verbatim): "For at least one eligible object
      curve in each frozen field cell, a preregistered cover of two or three
      invariant factor bases adds at least one independent mixed-incidence
      row beyond all single-base rows in the same lawful quotient columns.
      This is a signed-triple existence prediction, not the parent idea's
      attack-cost prediction." Predictions (verbatim): (1) metric=Delta_rank,
      direction=higher, minimum_effect="At least 1 on one object curve per
      field, exact controls; no cost gain assumed." (2) metric="Frobenius
      copies incremental rank", direction=different, minimum_effect="Exactly
      0 after first nonzero row." Frozen falsification_criterion (verbatim,
      specification.yaml): "After complete, eligible, matched and
      independently verified cells, either field has no positive mixed-span
      witness over any frozen cover on either object. This contradicts only
      the finite existence prediction." Frozen incomplete_selection rule
      (verbatim): "Fewer than 2 qualifying object curves at either field or
      any unmatched null makes the planned 12-cell experiment inconclusive.
      Do not replace parameters, increase pools or substitute curves outside
      the fixed ordering."

    coordinator_prior: >-
      Recorded 2026-09-21, before this handoff is dispatched, by the session
      that wrote this plan (not the coordinator subagent that will execute
      it). Prediction: the formal verdict will be INCONCLUSIVE, because the
      spec's own incomplete_selection rule fires unconditionally on the q7,n3
      field cell (exactly 1 eligible object curve there, not 2 -- confirmed
      from metrics.json: FROB-q7-n3-object02 status=ineligible_object,
      reason=fixed_object_curve_pool_exhausted, and its two null seeds
      status=not_run_no_eligible_object), and that rule's own text forbids
      reading around it via the other field's completeness. Distinct from
      that formal verdict, I predict the decision record will ALSO carry a
      scoped, honest secondary finding: within the q11,n5 field cell alone
      (which DID complete with 2 eligible object curves and both matched
      null-seed pairs for each), BOTH object curves
      (FROB-q11-n5-object01: all 119 non-trivial covers checked, ALL show
      Delta_rank=0 and mixed_accepted_pairs=0; FROB-q11-n5-object02: all 4
      non-trivial covers show Delta_rank=0) show zero positive mixed-span
      witnesses on every frozen cover, while their matched null curves show
      strictly positive Delta_rank at several covers (up to 5 at the full
      triple cover on object02's nulls) -- i.e. q11,n5 alone independently
      satisfies the falsification_criterion's stated pattern ("no positive
      mixed-span witness ... on either object"), a fact this plan's own
      independent replication (review-20260921-independent-replication/,
      code-informed, not blind) already confirms is not a code/rank-counting
      bug: the same independent arithmetic finds nonzero accepted-relation
      counts (12 and 180) on FROB-q7-n3-object01's covers, where the
      producer's data says relations exist. I expect the coordinator subagent
      may instead read q11,n5's clean falsification as sufficient for
      reject_scoped on that field in isolation, treating incomplete_selection
      as gating only the q7,n3 field -- this is the single most likely point
      of disagreement with my prior, and J4 below is assigned to resolve it
      by the text alone, not by whichever reading makes the strongest claim.

    joints:
      - joint: >-
          J1: incomplete_selection genuinely fires on the q7,n3 field cell
          (object02 pool-exhausted is a real, unremediable ineligibility, not
          a data-entry or protocol-reading error) and the null-only cells for
          object02 are correctly recorded not_run rather than silently
          omitted.
        assigned_to: coordinator
        attack_plan: >-
          Re-read runs/TASK-20260907-ee1e3c/report.md and metrics.json's full
          cell list (12 entries) independently; confirm object02's
          ineligibility reason against the frozen curve-pool definition in
          specification.yaml (do not accept the Executor's own report.md
          prose as sufficient -- verify against the pool it names). Check
          whether any later amendment
          (experiments/EXP-FROB-b8cf21/amendments/, if any exist) expanded
          the pool after this run, which would change the eligibility count
          for a re-run but does not retroactively change THIS run's verdict.
        breaking_artifact: >-
          If object02 is shown eligible after all (pool not actually
          exhausted, or a wider pool was always in scope), this breaks the
          inconclusive-by-protocol reading and the review proceeds on
          completeness grounds instead.
      - joint: >-
          J2: the q11,n5 all-zero result is a genuine combinatorial fact
          about the stated curve and base points, not a bug in the
          rank/accept-counting code.
        assigned_to: coordinator
        attack_plan: >-
          ALREADY PARTIALLY DISCHARGED by this session's own independent
          replication (review-20260921-independent-replication/): two
          from-scratch arithmetic implementations, sharing no code with
          implementation.py/checker.py, independently confirm accepted_count=0
          on FROB-q11-n5-object01 covers 1/2/1,2, and (positive control)
          accepted_count=12/180 on FROB-q7-n3-object01 covers 1/1,2,3 where
          the producer's data shows nonzero relations -- ruling out
          "the independent code always returns zero." This is a REPLICATION,
          not the blind_rederivation (see that directory's README.md and J5
          below); it is NOT sufficient on its own to close this joint if the
          coordinator subagent finds a reason the replication's own encoding
          assumptions (field digit convention, curve model) could be wrong in
          a way that happens to agree with the producer by construction --
          check this specifically, since both readings were taken from the
          same fixtures.json.
        breaking_artifact: >-
          Any accepted mixed relation the coordinator's own check finds on
          q11-n5-object01 that this session's replication missed, or a
          demonstrated flaw in the replication's field-arithmetic encoding.
      - joint: >-
          J3: the null curves for q11,n5 are a fair, matched control whose
          positive Delta_rank is informative (not itself an artifact of the
          "deliberately nongeometric" membership-transport construction).
        assigned_to: coordinator
        attack_plan: >-
          Read specification.yaml's null_bases design text and
          implementation.py's null_labels() function (lines ~453-472) in
          full. Verify the stated invariants (exact candidate cardinalities,
          intersection sizes, negation closure preserved; Frobenius weights
          NOT transported) actually hold on the null cells' own fixture data
          by direct inspection, not by trusting the assertions in the
          producer's code to have run correctly.
        breaking_artifact: >-
          A demonstrated mismatch between the null's claimed invariants and
          its actual fixture data, which would mean the null-vs-object
          contrast is not the clean comparison the falsification_criterion
          needs.
      - joint: >-
          J4: whether the falsification_criterion's "either field has no
          positive mixed-span witness ... this contradicts only the finite
          existence prediction" is triggered by q11,n5 ALONE despite q7,n3's
          incompleteness, or requires BOTH fields to show the pattern before
          it fires.
        assigned_to: coordinator
        attack_plan: >-
          Read the criterion in the full context of specification.yaml's
          success_criterion ("at least one object curve per field has a cover
          with Delta_rank>=1... This passes only a necessary-condition span
          gate") and the hypothesis statement's own "in each frozen field
          cell" quantifier (a universal over fields). Under a universal
          success condition, failure on any one field is sufficient to falsify
          the universal, independent of whether other fields succeed or are
          incomplete -- but the incomplete_selection rule's own text
          separately voids ANY verdict on a run with fewer than 2 qualifying
          object curves at ANY field, which reads as an unconditional stop
          rule applying to the WHOLE run's verdict, not a per-field one. Do
          not resolve this by picking whichever reading yields the more
          interesting claim; state both readings, which one the frozen text
          actually supports, and cap the decision's claim_tier accordingly.
        breaking_artifact: >-
          A textual argument that the incomplete_selection rule is scoped
          per-field rather than per-run, which would let q11,n5's result
          stand as a field-scoped reject_scoped even though q7,n3 is
          incomplete.
      - joint: >-
          J5 (blind_rederivation, separately declared below): independently
          state the Delta_rank/accepted-relation definition from
          specification.yaml's primary_quantity/quotient prose ALONE, before
          opening implementation.py or this session's replication scripts,
          then compute accepted_count for FROB-q11-n5-object01 cover "1,2"
          from the frozen fixture data, then compare to both the producer's
          number and this session's replication.
        assigned_to: coordinator
        attack_plan: >-
          See blind_rederivation block below; this is its worked form as a
          joint so it is owned and attackable like the others. If the
          prose-only reading of "accepted" differs from implementation.py's
          actual arity-3 P1+P2+P3=O-with-P3-in-union predicate (this session's
          own first, pre-code reading was the arity-2 P1+P2=O reading, and it
          was wrong), that divergence is itself a reportable finding about
          the frozen spec's clarity, independent of which reading the
          eventual accepted_count comes out to under.
        breaking_artifact: >-
          A prose-only reading that yields a materially different
          accepted_count (nonzero where the code says zero, or vice versa)
          on the same cover and fixture data.

    blindness:
      mutual: true
      lifted_for: []
      rationale: null

    proves_too_much:
      objects:
        - >-
          PTM-1: FROB-q7-n3-object01 itself, used as the positive control in
          this session's replication. The SAME independent code and the SAME
          "does any pair sum to minus a third union point" test, applied
          here, must find nonzero accepted relations (producer's data:
          all_rank=1 at cover "1", all_rank=8 at cover "1,2,3") -- ALREADY
          CONFIRMED (12 and 180 respectively). If the same reasoning that
          finds "zero mixed-span witnesses on q11,n5" had ALSO found zero
          here, that would prove the method is blind to real gains and the
          q11,n5 null result would be uninformative.
        - >-
          PTM-2: the t=1 (single-base, cover of size 1) baseline control
          built into the frozen spec itself ("t=1 implies R_all=R_same and
          Delta_rank=0 exactly"). Every cover-of-size-1 row in metrics.json,
          across every cell including nulls, must show Delta_rank=0 by
          construction (R_all=R_same trivially when there is only one base).
          A cover-of-size-1 row showing Delta_rank!=0 anywhere would indicate
          the rank-computation itself is broken in a way that invalidates
          every other number in the run.
      failure_signature: >-
        Either PTM object showing the SAME null pattern as q11,n5's real
        finding (PTM-1 showing zero where nonzero is known to exist; PTM-2
        showing nonzero where zero is structurally forced) means the
        method's null result on q11,n5 is not informative and the review
        cannot proceed past inconclusive-for-instrument-reasons.
      assigned_to: coordinator

    blind_rederivation:
      required: true
      quantity: >-
        accepted_count for a stated cover C of a stated cell: the number of
        ordered pairs (Q1,Q2) drawn from the union of C's invariant factor
        bases such that Q1+Q2+Q3=O for some Q3 ALSO in that union (a 3-point
        closure relation within the union), as defined in
        specification.yaml's primary_quantity/quotient text (Delta_rank(C) =
        rank(R_all(C)) - rank(R_same(C)), where rows are built from such
        accepted triples). The re-deriver states its OWN reading of this
        definition from that prose BEFORE opening any code, records that
        reading verbatim, and only then computes accepted_count for
        FROB-q11-n5-object01 cover "1,2" from the frozen fixture data (curve
        A=1,B=2 over F_{11^5}, modulus [1,0,0,0,2,1]; base[1] and base[2]
        point lists, both exactly as given in fixtures.json).
      parameters: >-
        q=11, n=5, field modulus=[1,0,0,0,2,1] (f(z)=z^5+2z^4+1 over GF(11)),
        curve y^2=x^3+x+2, cover "1,2" = base[1] union base[2] (20 points),
        base[1] and base[2] point lists exactly as recorded in
        runs/TASK-20260907-ee1e3c/fixtures.json cell FROB-q11-n5-object01.
      blind_from:
        - experiments/EXP-FROB-b8cf21/runs/TASK-20260907-ee1e3c/implementation.py
        - experiments/EXP-FROB-b8cf21/runs/TASK-20260907-ee1e3c/checker.py
        - experiments/EXP-FROB-b8cf21/runs/TASK-20260907-ee1e3c/report.md
        - experiments/EXP-FROB-b8cf21/review-20260921-independent-replication/README.md
        - experiments/EXP-FROB-b8cf21/review-20260921-independent-replication/replication_q11n5_object01.py
        - experiments/EXP-FROB-b8cf21/review-20260921-independent-replication/positive_control_q7n3_object01.py
        - experiments/EXP-FROB-b8cf21/review-20260921-independent-replication/q11n5_object01_output.txt
        - experiments/EXP-FROB-b8cf21/review-20260921-independent-replication/positive_control_output.txt
      blind_from_note: >-
        The last five paths are this session's own replication code, README
        and results -- the re-deriver must not read what number this session
        already got, or how it defined "accepted", before recording its own
        prose-derived definition and number from specification.yaml alone.
      assigned_to: coordinator

    procedure_deviations:
      - >-
        PD-1: joints and blind_rederivation are assigned to the role address
        "coordinator" rather than a distinct reviewer TASK-* id, because this
        review dispatches a single coordinator subagent per the
        /review-evidence skill's own step 2 (it does not spin up separate
        validator/red-team sessions with their own handoffs), and inventing
        a TASK-* id for a reviewer that does not exist would be a
        fabrication (same reasoning as TASK-20260914-7119f2's PD entry). This
        means J1-J5 are NOT independently owned by DISTINCT agents in the
        strict AGENTS.md sense -- they are owned by distinct, explicitly
        sequenced STEPS within one dispatch, with the blind_rederivation step
        (J5) required to happen textually BEFORE that same session opens
        implementation.py for the other joints, so its blind_from
        obligation is real within the one session's own reading order, not
        merely nominal. If the eventual decision is support or
        reject_scoped with strength >= strong (per
        docs/evidence-and-reproducibility.md), a full multi-agent
        independence-checked round is a candidate escalation and should be
        named as a next_action rather than silently substituted for by this
        lighter round.
      - >-
        PD-2: this session's own review-20260921-independent-replication/
        artifacts were produced by reading implementation.py first (for
        understanding the accepted/same/Delta_rank predicate), then writing
        independent code informed by that reading. They are archived as a
        citable replication, explicitly labelled non-blind in their own
        README.md, and are named in blind_from above precisely so they
        cannot be mistaken for, or silently substituted for, J5's required
        blind reading.
