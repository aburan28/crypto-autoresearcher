handoff:
  id: TASK-20261015-a617ad
  from: coordinator
  to: executor
  objective: Add narrowly scoped prospective blind-phase owner and explicit scoped-lift composition support to the
    native review independence checker.
  uncertainty_reduced: Whether the existing native checker can represent a committed blind subtask followed by the
    same Reviewer full-joint comparison without fabricating read scopes or weakening original protections.
  inputs:
  - tools/check_review_independence.py
  - tools/test_review_independence_addenda.py
  - tools/test_check_review_independence.py
  - research/lattice_ic_experiments_20261015/coordinator/review-plan-blind-phase-addendum.yaml
  constraints:
  - Exclusive two-file implementation/test scope only; no scientific experiment, producer code/results, protocol,
    run, ledger state, source archives or Git writes.
  - Preserve all existing legacy/addendum checks and semantics. Never make failed or missing attestations pass by
    omission, unknown-owner reassignment, disabling required blind rederivation, removing blind_from, dropping joints
    or broadening mutual reads.
  - Recognize what_changes.blind_rederivation_assigned_to only as a valid TASK ID owning an explicitly declared
    joint in the composed plan. Preserve original blind_rederivation required/quantity/parameters/blind_from and
    unchanged full-joint owner; report the actual owner change in composition notes. Reject malformed explicit directives
    instead of silently treating them as supported.
  - Recognize blindness_lifted_for_additions only with explicit nonempty blindness_lift_rationale and nonempty lift_read_allowlist,
    valid named full-joint owners, preserving mutual=true and all original lift entries. Compose narrowly scoped
    per-task read authorization, not a blanket permission to read other reviewers.
  - 'Enforce source/read scope of new scoped lifts: only declared allowed prior blind-artifact paths for this same
    Reviewer may be read; a different sibling report outside allowlist must fail. A truthfully unblinded full-comparison
    task may read producer artifacts because blind_rederivation owner is now the separate still-blind task. The
    blind task must still fail on any blind_from source.'
  - 'Meaningful adversarial tests: exact named split phase accepted; full joint owner unchanged; native check rejects
    blind producer read, unexpected sibling report, missing/malformed owner, missing lift rationale/allowlist, duplicate
    attestation and absent required joint; existing owner/control/widening tests remain. Use only synthetic strings/fixtures,
    no study execution or observed counts.'
  - Actual native backend is unverified absent exposed runtime identification; record requested executor-implementation/high,
    no probe, downgrade or invented attestations. Return implementation/test receipts only.
  deliverables: &id001
  - tools/check_review_independence.py
  - tools/test_review_independence_addenda.py
  artifact_paths: *id001
  archived_by: TASK-20261015-530f87
  budget:
    memory_gb: 2
    maximum_runs: 0
  inference:
    policy: executor-implementation
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
    delivery: interactive
  completion_gate:
  - Actual targeted software tests and existing checker tests pass; source/read protections remain enforced; no
    scientific fixture executed.
  - Report exact two source hashes, commands/results and new behavior/limitations for root code acceptance; no whole-round
    independence or scientific verdict.
  return_format: Exact two-file manifest plus actual non-scientific test receipt; no Git or producer-artifact reads.
