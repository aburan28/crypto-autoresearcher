  inputs_note: >-
    The four working-tree inputs are uncommitted until f42d75. Their sha256,
    with the other seven files of TASK-20261022-a2f575, are recorded by the
    top-level session before this task starts (VP-3) and re-verified by f42d75
    (CC-11). The review artifacts are committed at e3de77970e64. Read
    computations.json by key or range, never whole.
  constraints:
    - >-
      RV-1 Executed by the shell-holding top-level session in the coordinator
      role. Write only the five declared files, in a new write-once directory.
      Never write into a run directory or anywhere else under experiments/.
      Zero runs.
    - >-
      RV-2 The first paragraph says the decision is CONDITIONAL and takes
      effect only when TASK-20261022-f42d75 verifies, and that only then does
      GOAL-MONO-001 move to completed, on criterion (c) only. Then state the
      decision (route (a) declined on the merits; J4 DISSENT sustained and
      disposed by concurrence; CU-9 derivations promoted as KN-FIND-bdcd60;
      KN-OPEN-62c870 supersedes KN-OPEN-8a7432; CORR-20261022-87c9cd), the
      evidence strength (replicated, by CORR-20261022-87c9cd for
      EV-MONO-e9dc3b; derivation tier for KN-FIND-bdcd60), claim tier (toy) and
      the scoped claim (KN-FIND-bdcd60 Statement and Scope). Name
      DEC-20261022-a0f165, DEC-20261017-435b01, DEC-20261017-12e0f4,
      EV-MONO-e9dc3b, H-MONO-ebd400, EXP-MONO-0e6e8f, RUN-MONO-0e6e8f-1,
      TASK-20261017-ccd10c, TASK-20261017-8aff64, TASK-20261017-fb4481 and
      TASK-20260930-40470a. Keep Observation, Comparison, Inference and
      Limitation separate. Include the joint table (composition.joint_table),
      the K4b comparison, the independence rulings I-1 to I-7 in one line each,
      the goal_status_ruling criteria table, and NA-1. Carry CS-K1d2, CS-PR,
      CS-M3, CS-QA2, CS-R7 and CS-IND verbatim.
    - >-
      RV-3 monodromy-frequencies.svg, three labelled panels. (A) Ordered base,
      m = 4: identity-class (1^4) frequency per curve and source, with 95%
      binomial intervals for sampled rows and no interval for exhaustive rows
      (labelled "exhaustive"); horizontal reference lines at 1/4 (regular V_4,
      Chebotarev) and 1/2 (order-2 competitor), each labelled; and, as a
      separate marker, each row's exact finite-p expectation where the source
      report gives one (TASK-20261017-8aff64 section 2.4 "exact conditional";
      TASK-20261017-ccd10c Tables 5.1 and 5.2 "exact over f != 0"), labelled
      with which expectation it is, since the two differ in conditioning. Rows:
      every row of TASK-20261017-8aff64 section 2.4 and of
      TASK-20261017-ccd10c Tables 5.1 (m = 4 rows) and 5.2, with N on each.
      (B) Symmetric base, m = 4: the five class frequencies per curve against
      the S_4 densities 1/24, 1/8, 1/4, 1/4, 1/3, from TASK-20261017-8aff64
      section 2.5 (six curves) and TASK-20261017-ccd10c Table 5.4 (four curves)
      plus its exhaustive p = 101 admissible frequencies; mark the classes A_4
      cannot realise (2+1+1, 4) and the one D_4 cannot (3+1). MAP CLASSES BY
      LABEL: the two reports order their columns differently (8aff64: 1^4,
      2^2, 2+1+1, 4, 3+1; ccd10c: 1^4, 2.1^2, 2^2, 3.1, 4). (C) OBS-1
      reconciliation: for C1 and C2, the g-split "2+1+1" count split into
      non-squarefree and squarefree (TASK-20261017-8aff64 section 5 table).
      No fitted curve, no extrapolation, no value not in a source table.
    - >-
      RV-4 plot-data.json records every plotted value with: its panel, curve,
      prime, m, class, numerator and denominator, the report section and table
      it appears in, the computations.json key path it was read from, and
      "measured" or "derived" (exact expectations and Chebotarev densities are
      derived). Read each value by key and check it equals the report table.
      If a value cannot be found under any key, do not plot it; list it in the
      report as "report table only; not traced by key". A disagreement between
      a key and a table stops the task and is reported to the Coordinator; it
      is never repaired.
    - >-
      RV-5 Canonical graphs: check knowledge/frontiers/ecdlp/ (README.md and
      the KR-IC-* and KR-RHO-* rows and any graph source or rendering that
      mention Semaev, monodromy or GOAL-MONO-001). List each in the report as
      checked and unchanged. If one would need to change, stop and report it as
      a scope finding; do not edit it. This decision is not a performance
      measurement: no benchmarks/ entry and no IC leaderboard regeneration
      apply; say so in the report.
    - >-
      RV-6 Render with Typst from a scratch virtualenv outside the repository
      (research-visuals "Rendering"), the SVG embedded. Open the PDF, read every
      page, and check legibility, labels, IDs and citations. If no renderer can
      be installed, stop and report the exact blocker; commit no placeholder
      PDF.
    - >-
      RV-7 Release with --artifact <path>=<64-hex sha256> for each of the five
      outputs, computed at release; never --artifact <path> alone. Check the
      release JSON carries five non-empty digests. Stage nothing and commit
      nothing.
    - RV-8 No reviewer-computed value and no verdict goes into any commit message, PR text or bus post as official before f42d75 verifies; such text calls the decision conditional.
