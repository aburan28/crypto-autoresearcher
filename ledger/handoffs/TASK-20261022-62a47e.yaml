# nothing and commits nothing; TASK-20261022-f42d75 archives its outputs.
# Zero runs. The ID was reserved by the top-level session.
handoff:
  id: TASK-20261022-62a47e
  from: coordinator
  to: coordinator
  goal_id: GOAL-MONO-001
  batch_id: BATCH-e6e94f
  authorized_by: DEC-20261022-a0f165 decision_report and NA-1
  objective: >-
    Produce the decision report for DEC-20261022-a0f165, with its graph and an
    inspected PDF, in
    experiments/EXP-MONO-0e6e8f/reports/review-DEC-20261022-a0f165/. Every
    plotted number is traced by key to the committed review artifacts of
    REVIEW-MONO-20261017-8aff64 and checked against the report table it comes
    from. Add no claim beyond the decision and the review artifacts.
  uncertainty_reduced: >-
    None about the mathematics. It discharges the visual-record duty so that
    the report lands in the same ledger archive as the decision (CC-10).
  inputs:
    - ledger/decisions/DEC-20261022-a0f165.yaml (working tree; pinned, CC-11)
