    - knowledge/findings/KN-FIND-bdcd60.md (working tree; pinned)
    - knowledge/open-problems/KN-OPEN-62c870.md (working tree; pinned)
    - ledger/evidence/EV-MONO-e9dc3b.yaml
    - coordination/goals/GOAL-MONO-001/review/TASK-20261017-8aff64/review_report.md (sections 2.4, 2.5, 5 and 7)
    - coordination/goals/GOAL-MONO-001/review/TASK-20261017-8aff64/computations.json (by key only, under outputs)
    - coordination/goals/GOAL-MONO-001/review/TASK-20261017-ccd10c/blind_rederivation.md (sections 5 and 5b)
    - coordination/goals/GOAL-MONO-001/review/TASK-20261017-ccd10c/computations.json (by key only, under outputs)
