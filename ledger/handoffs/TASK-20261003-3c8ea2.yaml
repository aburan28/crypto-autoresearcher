handoff:
  id: TASK-20261003-3c8ea2
  from: coordinator
  to: idea-generator
  objective: >-
    Design, without running anything, the cheapest experiment that measures
    the single-bucket gain G(M) = M * max_{c,d} pi_c(d) of poly(n)-computable,
    F_2-linear x-functional filters h_j on the prime-order subgroup <P> of toy
    ordinary binary curves, along a ladder in j (M = 2^j), against a SHA null
    and a matched-marginal null, with the trace and one-halving filters on
    E(F_{2^n}) as positive controls. Deliver a draft IDEA, a draft hypothesis
    stating the null prediction, and a draft contract, all with status
    proposed or review_required and nothing approved.
  uncertainty_reduced: >-
    Whether any cheap characteristic-2 x-filter shows a single-bucket gain on
    <P> that grows with M, which is the ingredient a Wagner/HGJ-type tree on an
    approximate quotient would need (exponent stake, KN-OPEN-91d4f6), or
    whether every tested family decays with the null, as the prime-field
    ladder did (KN-FIND-ffe1df RT-EXP-1).
  inputs:
    - knowledge/open-problems/KN-OPEN-91d4f6.md
    - knowledge/findings/KN-FIND-ffe1df.md
    - analysis/o2-sum-compatible-filters/reviews/RT-EXP-1-RESULT.md
    - coordination/goals/GOAL-SEMBIN-5078bc/reviews/TASK-20260928-62ad14/report.md
    - coordination/goals/GOAL-SEMBIN-5078bc/reviews/TASK-20261002-9e27f4/validation_report.yaml
    - coordination/goals/GOAL-SEMBIN-5078bc/reviews/TASK-20261002-9e27f4/scratch_koblitz_identities_output.txt
    - ledger/hypotheses/H-SEMBIN-83a856.yaml
    - ledger/decisions/DEC-20261003-4e91b7.yaml
    - docs/inventor-protocol.md
    - docs/target-result-profile.md
    - docs/claims-and-verification.md
    - .claude/skills/propose-ideas/SKILL.md
    - .claude/skills/design-experiment/SKILL.md
    - templates/research-records.md
  constraints:
    - >-
      ZERO SCIENTIFIC RUNS AND NO IMPLEMENTATION OF THE MEASUREMENT. No G(M),
      pi_c(d) or bucket statistic of any curve at any scale. Scratch sizing
      arithmetic is allowed and labelled scratch.
    - >-
      THE OBSERVABLE IS THE SINGLE-BUCKET RATE, as KN-FIND-ffe1df and
      KN-OPEN-91d4f6 define it, never the bucket-averaged eps. Because
      max_{c,d} over M^2 cells of empirical frequencies is biased upward, the
      design must remove selection bias (for example select (c, d) on one half
      of the sample and estimate on the other) and must apply the identical
      procedure to every null.
    - >-
      NULLS. A SHA-based filter with matched M, AND the matched-marginal
      shuffle that RT-EXP-1 needed to expose its popcount and digit-sum false
      positives (the marginal-bias floor). A family "trips" only if it
      separates from BOTH nulls.
    - >-
      DOMAIN IS LOAD-BEARING (KN-OPEN-91d4f6; VAL-20261003-17b1e4 OPEN-A A-2).
      The question is asked on <P>. The positive controls (Tr(x), exact gain 2
      at h = 2; one point halving, exact gain 4 at h = 4) are run with Q, R
      sampled from E(F_{2^n}), where they must be flagged. Run each control on
      <P> too, where it must read gain 1; a control that reads otherwise on
      <P> is an instrument defect.
    - >-
      BASELINE AND NEARBY OBJECT. Reproduce one RT-EXP-1 cell on E(F_p)
      exactly as a regression fixture before any binary cell, and include a
      planted-dependence sensitivity control sized like RT-EXP-1's planted
      dlog mixture. Specify a method ceiling: Theorem C excludes exact filters
      on <P>; the design measures level 1 only and states that a level-1
      result does not close tree levels >= 2.
    - >-
      FILTER FAMILIES. At least: F_2-linear x-functionals (Tr(alpha_i x)) with
      random and structured alpha (polynomial-basis coordinates; normal-basis
      coordinates where available), and the combining rules f they admit;
      state how f is chosen per family and that the choice is fixed before
      the run. Toy n with at least two n per j; the ladder's upper j set by
      sample size, with the derivation shown.
    - >-
      DECISION AND ROUTING. Pre-register: the null prediction (G(M) decays
      with the nulls); the refutation criterion (a family whose
      selection-corrected G(M) grows along the ladder while both nulls decay,
      with its CI excluding the null slope); INCONCLUSIVE (a positive control
      missed, a control alive on <P>, the baseline fixture not reproduced).
      A refutation reading routes to the Coordinator before any
      interpretation, as possible rule-12 material.
    - >-
      PRIOR ART AND HONESTY. A prior_art block on the IDEA (the program's
      RT-EXP-1, H-SEMBIN-83a856, the J3 RC5 recommendation, and any
      characteristic-2 Artin-Schreier literature found, with provenance;
      recalled backs nothing). dominated_by and sota_delta required.
    - NO CLAIM ABOUT THE SECURITY OF ANY CURVE in either direction.
    - >-
      IDENTIFIERS. Mint draft ids with tools/allocate_id.py if a shell is
      available (--next idea --date 20261003; --next hypothesis --area SEMBIN;
      --next experiment --area SEMBIN), otherwise disclose hand-chosen tokens.
    - >-
      INDEPENDENCE: not the TASK-20261001-9b3e70 session and not either
      reviewer session of REVIEW-SEMBIN-20261002-c7e1d4.
    - >-
      WRITE SCOPE: coordination/tasks/TASK-20261003-3c8ea2/ ONLY. Do not
      commit. Do not edit any record.
