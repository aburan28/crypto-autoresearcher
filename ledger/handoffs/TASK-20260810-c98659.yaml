  - harness/exp_instr_36c8cf/**
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-d7e255/execution/EXP-INSTR-36c8cf/**
  write_scope_note: >-
    EXCLUSIVE AND EXHAUSTIVE, AND NON-OVERLAPPING WITH THE OTHER THREE
    BATCH-d7e255 TASKS. It covers BOTH phases; Phase B writes into the same scope.
    experiments/EXP-INSTR-36c8cf/specification.yaml is READ-ONLY, as is
