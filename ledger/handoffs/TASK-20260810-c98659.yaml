  constraints:
  - >-
    THE CONTRACT IS FROZEN AND IS READ-ONLY TO THIS TASK. Every planted size,
    null construction, seed set, nominal level and interval coverage in
    experiments/EXP-INSTR-36c8cf/specification.yaml binds as written. Any change
    requires a versioned protocol_amendment authored by the COORDINATOR under
    experiments/EXP-INSTR-36c8cf/amendments/ and filed BEFORE the affected data is
    generated. The executor does not write amendments.
  - >-
    SR1 REPRODUCTION GATE RUNS FIRST, IN PHASE A. Reproduce NULL-C's published
    power profile from the committed p = 4001 rate_m3 values -- median p = 0.0590
    at delta 0, power 0.08 at delta 0.002, power 1.00 at delta 0.005 and above, 12
    repetitions per cell. Failure means the control harness is not exercising the
    same statistic the red team exercised; STOP, run INVALID, return the defect,
    and characterise nothing.
  - >-
    SR2 GEOMETRY DEPENDENCY, BLOCKING. Run no geometry-specific control before the
    corresponding Stage 1 of EXP-JINV-bd141d or EXP-VOLC-9f5571 has emitted the
    real geometry. See dependency_note for the Phase A / Phase B split this
    imposes. Reporting a control at a geometry other than the actual geometry of
    use is an invalidation rule.
  - >-
    SR3 DOWNWARD SWEEP. Planted sizes are swept downward from the declared maximum
    to the declared minimum. Stop a sweep when detection fails and record that
    size as the cell's floor. Do NOT restart a sweep with different sizes after
    seeing a result; adjusting a planted size after seeing a result is an
    invalidation rule.
  - >-
    SR4 NO WIDENING, AND IT IS ABSOLUTE. If the SR3 v3 self-consistency check
    fails -- a faithful re-measurement of the reference run at its own frozen
    parameters falling outside its own declared interval -- STOP and report to the
    Coordinator. DO NOT widen the interval, do not change the coverage, and do not
    proceed to gate anything with it. Widening a threshold after seeing it fail is
    precisely the move this campaign's rules exist to prevent, and the old gate is
    being replaced for exactly that defect.
  - >-
    PLANT INTO REAL MEASURED VALUES, NEVER SYNTHETIC DATA, so the null retains the
    real data's r composition, stratum sizes and per-curve heterogeneity. Planting
    into synthetic data is an invalidation rule.
  - >-
    NULL-C IS DISQUALIFIED FOR ANY WITHIN-CLASS CONTRAST, INHERITED AND NOT
    RE-LITIGATED. exp_icinv.permutation_null is a between-class MEAN detector with
    power 1.00 at a 0.9% shift and median p = 0.0590 at zero planted shift. It may
    not be used for any within-class contrast in this batch in either direction.
    Its admissibility for the BETWEEN-CLASS matched-order contrast is a SEPARATE
    question answered afresh here, and it is NOT presumed admissible merely
    because the #E confound is annihilated by construction.
  - >-
    EVERY CELL IS REPORTED IN BOTH DIRECTIONS. A detection floor without a
    matched-null false-positive rate, or the reverse, does not discharge criterion
    C4 for that cell.
  - >-
    NOT-MEASURED IS A FIRST-CLASS OUTCOME AND MUST BE RECORDED AS ONE. Every
    (statistic, geometry, density row) cell the budget, the host or the schedule
    did not reach is listed explicitly in cell-coverage.json as not_measured,
    TOGETHER WITH THE LANE CONCLUSION IT THEREBY BLOCKS. Presenting a not_measured
    cell as a pass is an invalidation rule.
  - >-
    DO NOT EDIT harness/exp_icinv.py. It is READ-ONLY. All new code goes under
    harness/exp_instr_36c8cf/, which is this task's own declared write scope, as a
    new control driver over harness/exp_icinv.py, harness/exp_icinv_fullgroup.py,
    harness/isogeny_class.py and harness/toycurve.py.
  - >-
    SOURCE PROVENANCE IS BLOCKING (the standing A6 precondition carried from
    EXP-ICINV-4d33aa amendment v2). Every run manifest must pin the hash of every
    source file executed, via harness/runner.py source_provenance(), and
    `python3 tools/check_run_source_provenance.py --experiment EXP-INSTR-36c8cf
    --strict` must pass before any run is considered complete.
  - >-
    NO TRANSCRIBED REFERENCE VALUES. Every value quoted from a committed record --
    the NULL-C power profile, the detection-floor table, the density-decay table,
    the [1.3, 3.6] band and its slacks, the reference run's own parameters -- must
    be READ FROM THAT RECORD AT RUN TIME and bound by a source_sha256 in
    baseline-provenance.json, which names the exact run ids the redesigned gate
    compares against. Transcription at any precision is PROHIBITED and makes the
    run INVALID (EXP-ICINV-4d33aa amendment v2 change A4, CORR-20260807-a24675).
    This applies to every figure quoted in this handoff as well.
  - >-
    NO CURVE-SIDE CONCLUSION OF ANY KIND may appear in this experiment's output.
    It characterises instruments. A curve claim here means the scope was exceeded
    and is an invalidation rule.
  - >-
    THIS TASK DOES NOT CREATE experiments/EXP-ICINV-4d33aa/amendments/v3.yaml. It
    carries the SUBSTANCE of the SR3 v3 redesign; the formal versioned amendment
    file is a separate COORDINATOR act, named as next action N5 of
    DEC-20260810-a4bec4, and is required before any successor run of
    EXP-ICINV-4d33aa. Do not author it, do not dispatch a successor run of
    EXP-ICINV-4d33aa, and do not treat this contract's delivery as unpausing
    RQ-ICINV-475b5e for that experiment.
  - >-
    CONCURRENCY. See concurrency_note. This task runs ALONE in each of its two
    phases. Do not start, spawn or parallelise any other BATCH-d7e255 task, and
    keep this task's own internal parallelism low enough that it does not add to a
    host already at load average 21.6 / 25.8 / 40.2 on 14 cores.
  - >-
    THE EXECUTOR NEVER INTERPRETS RESULTS. Produce run records and an execution
    report of what ran, what did not, every deviation, and the measured floors,
    rates and intervals. Do not characterise what they mean for RQ-INSTR-f8faa0,
    H-INSTR-444c7b, GOAL-ENDO-001 criterion C4, pause condition P1, or the
    admissibility of any lane conclusion. Reporting that a cell BLOCKS a lane
    conclusion is a required factual statement of the contract, not an
    interpretation; deciding what follows for the lane is the Coordinator's.
  - >-
    THE EXECUTOR NEVER CHANGES A HYPOTHESIS STATUS. H-INSTR-444c7b stays
    `specified`. H-ICINV-6c7920 stays `specified` and is neither presumed true nor
    false. H-ENDO-001 stays `approved`. H-STR-002 stays `weakened` with
    DEFER-BATCH009-001 OPEN. Only the Coordinator moves a status, on a committed
    ledger archive after independent review.
  - >-
    THE EXECUTOR NEVER COMMITS. Do not run `git commit`, `git push`, or any
    history-modifying git command. Workers do not commit into a shared worktree
    (AGENTS.md, "Durable research commits"); the Coordinator makes the isolated
    snapshot commit. Read-only git inspection is permitted and encouraged.
  - >-
    NO COMPLETION CRITERION MAY BE CLAIMED MET. Delivering this contract does not
    by itself satisfy GOAL-ENDO-001 criterion C4, which requires EVERY instrument
    supporting ANY conclusion to have passed both directions. Claim nothing about
    C1-C4. Record no attestation and no closure quorum.
  - >-
    Never fabricate a command, output, timing, statistic or run. A cell not
    measured stays missing and is reported as missing (AGENTS.md rule 9). A
    timeout, crash or OOM is failed_infrastructure, never negative evidence
    (AGENTS.md rule 5).
  - >-
    Mint every new identifier with `python3 tools/allocate_id.py --next <type>`
    and confirm it with `--check` before use. Do not grep for the next free
    number.
  - >-
    Fetch origin/main and compare it with this branch before the run manifests are
    written; record the base commit checked and the merge outcome in the execution
    report. Merge new main changes into the branch; never rebase pushed run
    records.
  - >-
    SESSION SURVIVAL. Write artifacts to disk as each gate and each cell
    completes. A twelve-seed sweep held only in memory is one crash away from
    being unreproducible. Never hold results only in memory.
  - >-
    Lawful defensive cryptanalysis on public toy constructions only. p = 4001 and
    the N = 19507 matched-order family. No live key, wallet or deployed system is
    touched.

