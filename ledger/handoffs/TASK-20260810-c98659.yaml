  - experiments/EXP-INSTR-36c8cf/runs/<RUN-ID>/pseudo-crater-control.json
  - experiments/EXP-INSTR-36c8cf/runs/<RUN-ID>/arbitrary-halves-control.json
  - experiments/EXP-INSTR-36c8cf/runs/<RUN-ID>/label-permutation-control.json
  - experiments/EXP-INSTR-36c8cf/runs/<RUN-ID>/nuisance-direction.json
  - experiments/EXP-INSTR-36c8cf/runs/<RUN-ID>/nullc-matched-order-recharacterisation.json
  - experiments/EXP-INSTR-36c8cf/runs/<RUN-ID>/sr3v3-reference-sampling.json
  - experiments/EXP-INSTR-36c8cf/runs/<RUN-ID>/sr3v3-interval-stability.json
  - experiments/EXP-INSTR-36c8cf/runs/<RUN-ID>/sr3v3-self-consistency.json
  - experiments/EXP-INSTR-36c8cf/runs/<RUN-ID>/baseline-provenance.json
  - experiments/EXP-INSTR-36c8cf/runs/<RUN-ID>/cell-coverage.json
  - >-
    coordination/goals/GOAL-ENDO-001/batches/BATCH-d7e255/execution/EXP-INSTR-36c8cf/execution_report.md
    -- one report covering both phases, naming which artifacts came from Phase A
    and which from Phase B, what ran, what did not, every deviation, the SR1 gate
