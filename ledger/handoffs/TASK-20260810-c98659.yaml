  archived_by: null
  archived_by_note: >-
    DELIBERATELY NULL, NOT OMITTED. A producer task may not archive itself
    (AGENTS.md, "Durable research commits"). The Coordinator assigns separate,
    Coordinator-owned SNAPSHOT archival tasks -- run alone, before independent
