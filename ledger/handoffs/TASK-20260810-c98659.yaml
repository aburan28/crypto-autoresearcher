    requested_policy: executor-implementation
    reasoning_effort: null
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
    inference_note: >-
      Mirrors the frozen contract's inference block exactly. Under this Claude
      Code harness every policy alias resolves to the one model the session runs
      on (CLAUDE.md model policy note). Record requested_policy alongside the
      resolved model identifier in every run manifest, with fallback_used true and
      its reason if they differ -- never silently substitute (AGENTS.md rule 11).
      SEPARATELY AND NOT CREATED BY THIS RECORD: an independent review-adversarial
      session must review THIS CONTRACT'S OUTPUT before any lane conclusion in
      EXP-JINV-bd141d or EXP-VOLC-9f5571 relies on it (DEC-20260810-a4bec4 next
      action N7). A self-reviewed instrument control is not a control. That review
      is a separate handoff the Coordinator authors.

  budget:
    wall_clock_seconds: 14400
    memory_gb: 8
    maximum_runs: 20
    total_cpu_hours: 24
    budget_note: >-
      MIRRORS THE FROZEN CONTRACT'S BUDGET BLOCK EXACTLY AND ADDS NOTHING.
      wall_clock_seconds is the contract's wall_clock_seconds_per_run (14400);
      memory_gb is its maximum_memory_gb (8); maximum_runs is its maximum_runs
      (20); total_cpu_hours is its total_cpu_hours (24). NO FIELD OF THE
      CONTRACT'S BUDGET BLOCK IS NULL, so no coordinator-set substitute was
      required and none was invented. The contract itself records these as
      COORDINATOR-SET, because MATCHED-ORDER-DESIGN.md states no budget for E4;
      they bound the task and are not derived from any measurement. THE BUDGET
      COVERS BOTH PHASE A AND PHASE B TOGETHER and is not per phase; the executor
      must therefore report the split it actually spent. Exhausting any figure is
      a BUDGET EVENT under AGENTS.md rule 5, reported as such, and the affected
      cells are recorded as not_measured and BLOCK their lane conclusions -- a
      budget exhaustion is never a pass and never negative evidence about an
      instrument.

  completion_gate:
  - >-
    PHASE A. SR1 passes -- NULL-C's published power profile is reproduced from the
    committed p = 4001 values -- or the run stops, records INVALID, and returns the
    defect without characterising anything.
  - >-
    PHASE A. The SR3 v3 reference characterisation is delivered in full -- the
    per-density-row empirical sampling distribution of the variance-ratio
    statistic across the twelve declared seeds, the declared central interval per
    row, interval width as a function of seed count, the extreme per-seed ratios
    at each row, and the self-consistency verdict -- with every reference value
    read at run time and bound by source_sha256 in baseline-provenance.json, and
    the reference run ids named explicitly.
  - >-
    PHASE A. If the self-consistency check fails, the interval is NOT widened, the
    run stops, and the Coordinator is told (SR4). Reporting that failure IS a
    successful completion of this gate.
  - >-
    PHASE B. Every (statistic, geometry, density row) cell declared by
    EXP-JINV-bd141d and EXP-VOLC-9f5571 has BOTH a measured detection floor and a
    measured matched-null false-positive rate, at the ACTUAL geometry emitted by
    those contracts' Stage 1 gates -- or is listed explicitly in cell-coverage.json
    as not_measured together with the lane conclusion it BLOCKS.
  - >-
    PHASE B. C-PSEUDO-CRATER, C-ARBITRARY-HALVES, C-LABEL-PERMUTATION and
    C-NUISANCE-DIRECTION are all reported, with the pseudo-crater flag rate at
    n = 1 and the arbitrary-halves flag rate per density row.
  - >-
    PHASE B. NULL-C's admissibility for the BETWEEN-CLASS matched-order contrast is
    characterised afresh, including its median p at zero planted shift on that
    geometry, and NULL-C is used nowhere for a within-class contrast.
  - >-
    The smallest-stratum cell is reported explicitly with its own floor, not
    folded into an average across strata; the full matched-null distribution is
    reported per cell, not merely its exceedance rate.
  - >-
    The report states plainly that the superseded [1.3, 3.6] band was the
    outward-rounded hull of the committed rows it gated, with the floor slack
    0.020397 and ceiling slack 0.011900 read from the committed record at run
    time, and that this -- not a failure of the campaign's finding -- is why
    literal band membership is being replaced, together with the cost the chosen
    replacement imposes.
  - >-
    `python3 tools/check_run_source_provenance.py --experiment EXP-INSTR-36c8cf
    --strict` passes for every run.
  - >-
    Every floor, rate and interval is computed by the frozen rule INSIDE the run
    and written to the run record; none is selected afterwards and the set of
    reported metrics does not depend on what was found (SR7).
  - >-
    The execution report names every deviation, every not_measured cell with the
    lane conclusion it blocks, every infrastructure failure, and interprets
    nothing.

  return_format: >-
    The run directories plus the single two-phase execution report at the path
    above. Return to the Coordinator at the END OF PHASE A and again at the END OF
    PHASE B; do not run past the end of Phase A into Phase B without being
    dispatched. State the measured floors, rates and intervals and STOP THERE. Do
    NOT write an evidence record, do not move any hypothesis status, and do not
    declare GOAL-ENDO-001 criterion C4 discharged -- that is a Coordinator act on a
    later ledger archive after independent review. A STATISTIC THAT FAILS EITHER
