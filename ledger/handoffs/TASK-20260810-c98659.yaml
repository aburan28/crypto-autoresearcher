  approving_decision: DEC-20260810-a4bec4

  objective: >-
    Execute the frozen, approved contract at
    experiments/EXP-INSTR-36c8cf/specification.yaml, version 1, exactly as
    written. Read that file IN FULL before writing any code; it is READ-ONLY to
    this task. Characterise, IN BOTH DIRECTIONS -- planted-signal detection and
    matched-null rejection -- every statistic EXP-JINV-bd141d and EXP-VOLC-9f5571
    rely on, AT THEIR ACTUAL GEOMETRY OF USE, reporting one detection floor and
    one false-positive rate per (statistic, geometry, density row) cell; and
    deliver the reference-run per-density-row sampling characterisation without
    which the redesigned SR3 gate of EXP-ICINV-4d33aa cannot be evaluated at all
    -- its empirical sampling distribution per density row, its declared central
    interval, that interval's width as a function of seed count, and the
    self-consistency verdict.

  uncertainty_reduced: >-
    Whether this batch's negatives are citable and its positives admissible. An
    instrument that cannot detect a planted signal cannot support a negative; one
    that fires on a matched null cannot support a positive. Both directions are
    GOAL-ENDO-001 criterion C4 and this contract is where they are discharged for
    BATCH-d7e255. Separately, whether the reference run's own per-density-row
    sampling uncertainty is stable enough to serve as the SR3 v3 acceptance
    region, which is the measurement the user's selected gate replacement
    requires and which does not exist today.

  dependency_note: >-
    THIS TASK IS DISPATCHED SECOND IN BATCH-d7e255, AFTER TASK-20260810-ab0a07
    (EXP-ICINV-e0cd8f) HAS RETURNED A TERMINAL RECEIPT. That ordering is host
    capacity, not science -- see concurrency_note. EXP-ICINV-e0cd8f computes no
    statistic, so nothing in it feeds this contract and nothing in this contract
    gates it; if TASK-20260810-ab0a07 terminates failed_infrastructure,
    PREMISE-FAILED or INVALID, this task is still dispatched.

    THIS TASK IS BLOCKING FOR TASK-20260810-9c2e47 (EXP-JINV-bd141d) AND
    TASK-20260810-820328 (EXP-VOLC-9f5571) UNDER GOAL-ENDO-001 CRITERION C4.
    Neither of those tasks may READ OR REPORT any arm verdict until this contract
    has delivered, at their ACTUAL geometry, a measured detection floor and a
    measured matched-null false-positive rate for every statistic they use. An
    unmeasured control cell BLOCKS its lane conclusion; it does not pass it.

    THIS TASK IS NOT BLOCKING FOR EXP-ICINV-e0cd8f, which estimates nothing.

    THE CONTRACT'S SR2 CREATES A GENUINE TWO-WAY ORDER, AND THIS HANDOFF SPLITS
    THE TASK ACCORDINGLY. SR2 forbids running any geometry-specific control before
    the corresponding Stage 1 of EXP-JINV-bd141d or EXP-VOLC-9f5571 has emitted
    the REAL geometry -- the family construction, the class census, the Velu
    volcano and the enumerated per-level vertex counts. A control at an assumed
    geometry does not discharge criterion C4. So this task executes in TWO PHASES
    under this single task identifier and this single write scope:

    PHASE A, DISPATCHED NOW, NEEDING NO GEOMETRY FROM ANY OTHER CONTRACT. SR1, the
    NULL-C power-profile reproduction gate from the committed p = 4001 rate_m3
    values (C-NULLC-REPRODUCTION); and the ENTIRE SR3 v3 reference-run
    characterisation -- the twelve-seed per-density-row sampling distribution, the
    declared central interval, C-SEED-STABILITY interval width against seed count,
    and the C-SELF-CONSISTENCY verdict. Phase A ends with those artifacts written
    and returned to the Coordinator.

    PHASE B, DISPATCHED LATER, AFTER TASK-20260810-9c2e47 AND TASK-20260810-820328
    HAVE EACH EMITTED AND RETURNED THEIR STAGE 1 GEOMETRY ARTIFACTS. Every
    geometry-specific cell -- the between-class matched-order geometry at the real
    51 conductor-1 class sizes and r compositions, the within-class per-level
    geometry at the real enumerated per-level vertex counts at ell = 3 and
    ell = 107, the single-vertex geometry at the real enumerated size of the
    t = 211 class, and the T5 walk geometry on the Velu-constructed 107-volcano --
    together with C-PSEUDO-CRATER, C-ARBITRARY-HALVES, C-LABEL-PERMUTATION,
    C-DOWNWARD-SWEEP, C-NUISANCE-DIRECTION and the fresh NULL-C recharacterisation
    on the matched-order between-class geometry.

    PHASE B IS A RESUMPTION OF THIS SAME TASK, not a new one, and it is dispatched
    by the Coordinator with the same strict one-at-a-time rule. DO NOT START PHASE
    B ON YOUR OWN INITIATIVE and do not substitute an assumed geometry to avoid
    waiting -- that substitution is an invalidation rule of this contract. The
    single budget below covers BOTH phases; it is not per phase.

    CONSEQUENCE FOR THE TWO BLOCKED TASKS, STATED SO NOBODY IS SURPRISED. They may
    run their Stage 1 gates and their measurement work before Phase B completes;
    they may NOT read or report a verdict until Phase B has delivered their cells.
    That is exactly what the C4 block means and it is what their own SR3 (JINV)
    and SR6 (VOLC) already say.

  concurrency_note: >-
    DISPATCHED STRICTLY ONE AT A TIME. This task -- in Phase A, and again in
    Phase B -- runs ALONE. No other BATCH-d7e255 task may be running while it is.

    THE REASON, WITH THE MEASUREMENT THAT MOTIVATES IT. The execution host has 14
    cores and, at dispatch time, a load average of 21.6 over 1 minute, 25.8 over
    5 minutes and 40.2 over 15 minutes. It is already oversubscribed by other
    sessions. GOAL-ENDO-001's campaign_budget.max_concurrent is 6; THAT FIGURE IS
    NOT AUTHORIZATION HERE and is deliberately overridden downward to 1 for this
    batch. Sizing concurrency to what the machine can actually run without
    degrading is the dispatching Coordinator's responsibility (AGENTS.md,
    "Dynamic dispatch"), and the recorded cost of getting it wrong is
    GOAL-AES-003 BATCH-002 (DEC-20260802-b226fb, budget_accounting), which lost
    one producer's entire first segment and five of eight trials in another to
    exactly this condition.

    A TIMEOUT, STALL OR DEGRADED RUN CAUSED BY HOST LOAD IS AN INFRASTRUCTURE
    EVENT under AGENTS.md rule 5, recorded as failed_infrastructure with partial
    artifacts retained and the affected cells recorded as not_measured. IT IS
    NEVER NEGATIVE EVIDENCE ABOUT ANY INSTRUMENT AND IT IS NEVER A PASS. A cell
    lost to host load BLOCKS its lane conclusion exactly as a cell lost to budget
    does. This matters more here than anywhere else in the batch, because a
    twelve-seed sweep run on a saturated host is precisely the shape of a
    measurement that silently degrades and then reads as an instrument property.

