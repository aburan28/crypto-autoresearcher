handoff:
  id: TASK-20260727-005
  from: coordinator
  to: coordinator
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-009
  authorized_by: DEC-20260727-002
  depends_on:
    - TASK-20260727-002
    - TASK-20260727-004
  objective: >-
    Determine H-GGM-001's official status on the basis of the TASK-20260727-002 review
    verdict, and author, in full and final form, the superseding decision record
    DEC-20260727-003 and the superseding evidence record EV-GGM-002 that
    TASK-20260727-006 will install verbatim into the ledger. This is the
    ESC-20260727-001 section C superseding decision, which DEC-20260727-001 recorded as
    its single next action and which has not yet been written.
  uncertainty_reduced: >-
    What H-GGM-001's official status actually is, and what an evidence record about
    origin/main's EXP-GGM-001 execution may honestly assert, once an independent rule-12
    review has spoken.
  inputs:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/reviews/TASK-20260727-002/review_report.yaml
      and adversarial_notes.md, as committed by TASK-20260727-004
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/archives/TASK-20260727-004/snapshot_commit_receipt.json
    - coordination/goals/GOAL-ECDLP-001/escalations/ESC-20260727-001/ruling.yaml section C
      (superseding_records_required) and section A (validity grounds A1-A5)
    - ledger/decisions/DEC-20260727-001.yaml, whose single next_action is precisely this
      determination
    - ledger/hypotheses/H-GGM-001.yaml (currently supported), ledger/evidence/EV-GGM-001.yaml,
      ledger/decisions/DEC-20260726-007.yaml (origin/main's), ledger/decisions/DEC-20260726-008.yaml,
      ledger/evidence/EV-ECDLP-007.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-006/reviews/TASK-20260726-005/review_report.yaml
      (REV-20260726-005) and redteam/TASK-20260726-006/ (RT-20260726-001), including its
      recorded claim_tier ceiling
    - ledger/goals/GOAL-ECDLP-001.yaml BATCH-006 claim_boundary, which states H-GGM-001
      stays specified and currently contradicts the hypothesis record
    - templates/research-records.md hypothesis, evidence and coordinator_decision schemas;
      docs/claims-and-verification.md
  constraints:
    - >-
      THE OUTCOME IS NOT PRE-DECIDED. ESC-20260727-001 section C ruled specified, but that
      ruling was written WITHOUT an independent review and its own author asked for it to
      be tested. The admissible landing statuses are those in AGENTS.md Research states;
      at least specified, supported, weakened, inconclusive and superseded are live
      options. Choose the one the TASK-20260727-002 verdict supports, name it, and give
      the reason. If the review says the closure survives, saying so is the correct
      output; if it says it does not, saying so is the correct output; if it cannot
      determine, inconclusive is the correct output and must be stated plainly.
    - >-
      Do not edit ledger/hypotheses/H-GGM-001.yaml, any ledger record, any experiment
      record, or anything under knowledge/. This task DETERMINES; TASK-20260727-006
      INSTALLS. Write only under your own write scope.
    - >-
      Rest the determination on the committed review. Do not substitute your own
      re-derivation of the simulability question for the reviewer's verdict, and do not
      overturn the reviewer on a point the reviewer addressed unless you state the
      disagreement explicitly and give a checkable reason.
    - >-
      Before landing on weaken, reject_scoped, or a rejected status, identify the
      strongest checkable refutation artifact the result admits (counterexample
      certificate, then derivation note, then declared empirical_only), name it, and cite
      where it is archived. reject_scoped on a single unreplicated empirical-only run set
      is forbidden; use weaken plus replication.
    - >-
      Strength discipline. The 9 runs are 3 seeds at 3 bit sizes of a deterministic
      classifier over the same 8 frozen strings. Whether that constitutes replication is a
      question you must answer explicitly rather than assume in either direction.
    - >-
      EV-GGM-002 must supersede rather than overwrite. EV-GGM-001 is published and
      immutable. EV-GGM-002 must carry supersedes EV-GGM-001, must populate run_ids with
      all 9 RUN-GGM-* identifiers (EV-GGM-001 asserts 9 runs with run_ids empty, which is
      ESC ground A5 and is fixable only in a new record), and must state claim_tier and
      proof_status explicitly. Its claim_tier must not exceed the ceiling recorded in
      RT-20260726-001 falsification_routes.yaml unless TASK-20260727-002 explicitly
      supersedes that ceiling with reasons, in which case quote the review verbatim.
    - >-
      Do NOT authorize execution of EXP-GGM-001 version 1 under any outcome, and do not
      set experiments/EXP-GGM-001/specification.yaml status or approved_by. Approving a
      specification is a separate decision on a separate record, and version 1 still
      carries RT-20260726-001 OBJ-02 as a blocking objection.
    - >-
      Fill knowledge_promotion concretely. knowledge/ is not writable in this batch:
      knowledge/INDEX.md and knowledge/findings/KN-FIND-001.md and KN-FIND-002.md carry
      unresolved Git conflict markers and KN-FIND-002 is claimed by two different
      findings. If the determination is support or reject_scoped on evidence of strength
      replicated or strong, a KN-FIND promotion is REQUIRED by the Coordinator contract —
      in that case record the promotion as deferred to a named successor task with the
      corpus-conflict defect as the reason, rather than skipping it silently. Otherwise
      record a concrete not_warranted reason.
    - >-
      Address origin/main's DEC-20260726-007 knowledge_promotion of KN-FIND-002
      explicitly: state whether the determination requires a correction or superseding
      entry for it, and assign that to a successor task. Do not perform it here.
    - >-
      State plainly in the decision text whether this is a process ruling, a substantive
      finding, or both. Never let a process defect stand in as a mathematical finding. A
      process-invalid execution is not negative evidence about any oracle.
    - Scope every sentence to the tested oracle specifications, the tested toy sizes, the
      named model variant and the named solver. Nothing here is evidence about
      prime-field ECDLP or KN-OPEN-001.
  deliverables:
    - >-
      status_determination.yaml containing the reviewed inputs with their commit
      bindings; the review verdict quoted verbatim; the determined landing status for
      H-GGM-001 with its reason and the rejected alternatives with theirs; the
      refutation-artifact basis if the determination is adverse; a complete
      proposed_decision_record block that is the exact intended file content of
      ledger/decisions/DEC-20260727-003.yaml conforming to the coordinator_decision
      schema with knowledge_promotion filled; a complete proposed_evidence_record block
      that is the exact intended file content of ledger/evidence/EV-GGM-002.yaml
      conforming to the evidence schema with supersedes and run_ids populated; the exact
      single-field edit required in ledger/hypotheses/H-GGM-001.yaml; the exact
      goal-record checkpoint fields for TASK-20260727-006; and an explicit list of every
      follow-up assigned to a successor rather than performed here.
    - decision_rationale.md giving the reasoning in prose, including the strongest
      argument against the determination reached and why it did not prevail.
  artifact_paths:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/decisions/TASK-20260727-005/status_determination.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/decisions/TASK-20260727-005/decision_rationale.md
  write_scope:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/decisions/TASK-20260727-005/
  archived_by: TASK-20260727-006
  inference:
    policy: coordinator-orchestration-code
    reasoning_effort: high
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: false
  budget:
    wall_clock_seconds: 1800
    memory_gb: 2
    maximum_runs: 1
  completion_gate:
    - The determination cites the TASK-20260727-002 verdict verbatim and rests on it
      rather than on ESC-20260727-001's authority.
    - Exactly one landing status is determined for H-GGM-001, with the rejected
      alternatives named and reasoned.
    - If the determination is adverse to the hypothesis, the strongest available
      refutation artifact is named and its archive location cited.
    - proposed_decision_record and proposed_evidence_record are complete,
      schema-conforming, and installable verbatim with no further judgement.
    - EV-GGM-002 carries supersedes EV-GGM-001, all 9 run_ids, an explicit claim_tier and
      proof_status, and does not exceed the recorded ceiling without a quoted review
      supersession.
    - knowledge_promotion is filled with either a deferred-promotion assignment or a
      concrete not_warranted reason naming the corpus-conflict defect.
    - No ledger, experiment or knowledge file was edited by this task, and no execution
      was authorized.
    - The determination states plainly what it is not evidence for.
  return_format: YAML determination carrying installable record blocks, plus a Markdown
    rationale.
