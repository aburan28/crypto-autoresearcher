  corrected_value:
    task_20260731_040_artifact_paths_entry: ledger/decisions/DEC-20260731-010.yaml
    task_20260731_040_write_scope_entry: ledger/decisions/DEC-20260731-010.yaml
    task_20260731_041_archive_path_sha256_key: ledger/decisions/DEC-20260731-010.yaml
    task_20260731_041_archive_record_ids_entry: DEC-20260731-010
  fields_deliberately_left_at_the_live_id: >-
    FOUR BINDING FIELDS WERE CORRECTED TO THE HISTORICAL ID. EVERY OTHER
    DEC-20260731-019 REFERENCE IN THE QUEUE IS LEFT ALONE AND THAT IS
    DELIBERATE. tools/research_dispatch.py binds on the TOP-LEVEL
    tasks[].artifact_paths / write_scope / archive.path_sha256 /
    archive.record_ids only. The remaining eight references -
    authorization_status, declared_commit_sets.TASK-20260731-041_snapshot[4],
    the tasks[0] and tasks[1] handoff objectives and constraints,
    tasks[0].handoff.deliverables[4], tasks[0].handoff.artifact_paths[4] and
    tasks[2].handoff.inputs[4] - are prose or worker-facing mirrors that
    correctly denote the LIVE record, which is DEC-20260731-019. The queue is
    therefore INTERNALLY SPLIT BY DESIGN: binding fields name the blob inside
    commit cac4d8b4, everything else names the live decision. Editing the
    mirrors was rejected as over-reach into a queue another session authored.
  reason: >-
    THE FOUR CORRECTED FIELDS ARE STATEMENTS ABOUT A BOUND HISTORICAL COMMIT,
    AND THE HISTORICAL VALUE IS THE TRUE ONE. Archive TASK-20260731-041 is bound
    to commit cac4d8b459a44f1561d3f47835562824f7767765, which created the
    decision record at ledger/decisions/DEC-20260731-010.yaml. The later merge
    da6f4fda ("merge: resolve origin/main conflicts; remap PR DEC-009..012 to
    DEC-018..021") renamed that record to DEC-20260731-019 to clear an ID
    collision with origin/main, and the queue's three binding fields were
    updated to the new ID. But a pushed, merged commit cannot be rewritten, so
    those fields then described a tree that does not exist at the bound commit
    and verification could never pass again.
    THE IDENTIFICATION IS PROVED BY THE ALREADY-RECORDED HASH, NOT ASSUMED. The
    queue's path_sha256 recorded b76b7f915cf5625ada84e9e933bfd9919c592e9cd2eb1ec0f4d563820097189e
    for the DEC-20260731-019 key, and that is exactly the sha256 of
    DEC-20260731-010.yaml as it exists in commit cac4d8b4. Only the key was
    wrong; the hash beside it was always the historical blob's hash. The
    verifier requires record_ids to appear literally in the bound commit
    message, and that message reads "... DEC-20260731-010 GOAL-ECDLP-001
    BATCH-020" - it names -010 and never -019.
  what_this_correction_does_NOT_do:
    - >-
      IT DOES NOT MOVE, RENAME, EDIT OR REVERT ANY LEDGER DECISION RECORD.
      ledger/decisions/DEC-20260731-019.yaml remains the live ECDLP/EXP-DS-001
      `revise` decision and is untouched. ledger/decisions/DEC-20260731-010.yaml
      remains main's unrelated AES/FAEST `approve` decision and is untouched.
    - >-
      IT DOES NOT UNDO CORR-20260731-00x OR THE da6f4fda REMAP. The remap was
      correct and stands; only the queue's description of a frozen commit is
      corrected.
    - >-
      IT MOVES NO HYPOTHESIS STATUS, NO CLAIM TIER AND NO GOAL STATUS, AUTHORIZES
      NO RUN, AND MEETS NO COMPLETION CRITERION.
  the_trap_this_creates_and_it_is_recorded_rather_than_hidden: >-
    AFTER THIS CORRECTION THE BATCH-020 QUEUE NAMES ledger/decisions/DEC-20260731-010.yaml,
    AND THE FILE AT THAT PATH IN THE CURRENT TREE IS NOT THE RECORD THE QUEUE MEANS.
    In the current tree that path holds main's AES/FAEST decision. The queue entry
    refers to the blob at that path INSIDE COMMIT cac4d8b4 ONLY. A reader
    resolving the path against the working tree will get the wrong record. The
    live ECDLP decision this archive actually produced is DEC-20260731-019.
  generalization_flagged_for_the_coordinator: >-
    THIS FAILURE MODE IS STRUCTURAL, NOT A ONE-OFF. Any ID remap that renames a
    ledger record already named in a COMPLETED archive's binding fields breaks
    that archive's verification permanently, because the commit is immutable.
    Two sibling goals are refusing to render for their own binding defects as of
    this date: GOAL-CRYPTO-001 BATCH-013 ("completed archive task
    TASK-20260731-002 requires archive.commit_sha") and GOAL-DREG-001 BATCH-003
    ("tasks[0].handoff.inputs must be a nonempty text list"). NEITHER IS
    REPAIRED BY THIS CORRECTION and both remain open.
  evidence_artifacts:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-020/dispatch_queue.json
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-020/QUEUE-AMEND-20260731-004.md
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-020/archives/TASK-20260731-041/snapshot_commit_receipt.json
