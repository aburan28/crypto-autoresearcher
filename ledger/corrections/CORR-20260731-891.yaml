      tools/research_dispatch.py REFUSED THE ENTIRE BATCH-020 QUEUE with
      "archive task TASK-20260731-041 commit must change exactly declared
      archive and source artifacts (missing
      ['ledger/decisions/DEC-20260731-019.yaml']; extra
      ['ledger/decisions/DEC-20260731-010.yaml'])". No dispatch plan could be
