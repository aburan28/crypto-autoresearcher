  record_id: KN-FIND-aa2efc
  companion_record_note: >-
    The same product law, ambient and floor table appear verbatim in
    EV-ICPERF-10c5fc (observation 6 and obstruction value (a)), from which the
    finding is distilled. This record corrects the finding; it reads onto the
    evidence record's copy of the table by that citation. The evidence
