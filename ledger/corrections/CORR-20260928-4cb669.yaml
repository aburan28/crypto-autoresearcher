  field: >-
    (1) The AMBIENT of the product law and of the free-oracle floor table:
    the group order N in "relations x targets x oracle = m * 2^131
    independently of dim V" (proof_refs item 1; the section "Why this bounds
    the family and not just the implementation"). (2) The six floor values
    derived from it. (3) The DEFINITION of the m = 4 "headroom" quantity
    2^-4.41 as it has been read downstream ("oracle budget per attempt").

  prior_value: >-
    N = 2^131, written without stating that 2^131 stands for the FULL CURVE
    GROUP #E = 4r (r the 129-bit prime 680564733841876926932320129493409985129),
    so that the floors are quoted as if they applied to the target space.
    The six floors as written: m = 2 -> 2^89.25, m = 3 -> 2^68.58,
    m = 4 -> 2^56.40, m = 5 -> 2^48.44, m = 6 -> 2^42.85, m = 8 -> 2^35.61
    (the validator reproduces these at real l as 89.2516, 68.5850, 56.4049,
    48.4352, 42.8501, 35.6086 bits, max deviation 0.005 bit). The m = 4
    headroom "2^-4.41 before any oracle cost is charged" is stated in the
    finding as a total-cost gap (rho/floor), which is correct; downstream
    program records then quoted that same number as a PER-ATTEMPT oracle
    budget, which it is not (validator report wrong_quantity_records).

  corrected_value: >-
    AMBIENT. The product law and the floor table are scoped to the FULL CURVE
    GROUP, N = #E(F_2^131) = 4r (the validator's J3 confirms #E = 4r from the
    Frobenius recurrence and r prime). The challenge targets live in the
    order-r subgroup. For a factor base restricted to that subgroup (N = r,
    |F| = 2^l / 4) every free-oracle floor is lower by EXACTLY 4/(m+1) bits,
    because the cofactor divides N by 4 and the floor scales as N^(2/(m+1));
    re-derived here: 4/(m+1) = 1.3333, 1.0000, 0.8000, 0.6667, 0.5714, 0.4444
    bits at m = 2, 3, 4, 5, 6, 8. SUBGROUP-RESTRICTED FLOORS (bits, real l;
    validator J1 and blind re-derivation Q1 agree to within 0.02 bit):
    m = 2 -> 87.9183, m = 3 -> 67.5850, m = 4 -> 55.6049, m = 5 -> 47.7685,
    m = 6 -> 42.2786, m = 8 -> 35.1642. VERDICTS UNCHANGED: against matched
    rho 2^60.8090 (sqrt(pi r / (4 * 131)); J3), the m = 3 subgroup floor is
    still +6.776 bits above rho (67.5850 - 60.8090) and no m <= 3 row crosses
    rho under either ambient. The N = 4r ambient is not merely conservative:
    the validator's proves-too-much control found three high-cofactor toy
    Koblitz rows (e.g. n = 39, cofactor 8012) measured up to 2^-1.76 BELOW the
    N = #E floor while none of 216 rows sits below the N = r floor
    (minimum total/floor = 2^+2.58), so the ambient must be recorded as a
    stated scope of the finding. DEFINITION PIN, three distinct quantities at
    m = 4, all real, none interchangeable: (D1) the floor-to-rho GAP,
    rho/floor = 2^-4.41 as quoted (re-derived here from the four-decimal
    values as 60.8090 - 56.4049 = 4.4041 bits; the 4.41 figure is
    60.81 - 56.40 on the finding's two-decimal values), a total-cost headroom
    before any oracle cost is charged, NOT a per-attempt budget; (D2) the
    producer's PER-TARGET ORACLE BUDGET at the floor-optimal l with linear
    algebra ignored, rho/T = 2^+5.71 (the external note's section-5.3 column;
    validator recomputes +5.726, blind re-derivation +5.73); (D3) the
    RE-OPTIMISED PER-ATTEMPT BUDGET, one attempt per relation with l
    re-optimised, 2^+11.01 (validator D3; equal to IDEA-20260926-4b65e3's
    corrected capped column 2^11 at m = 4). An m >= 4 design is priced against
    D2 or D3 as its record states, never against D1. The program records that
    quote D1 as a per-attempt budget are listed by path in the validator
    report's wrong_quantity_records; no verdict in any of them changes, and
    none is edited by this record.

  reason: >-
    REVIEW-ICPERF-20260926-bcf1b2, the first independent in-program read of
    the finding's artifacts. Joint J1 (product identity and ambient size)
    HOLDS and derives the 4/(m+1) shift; joint J2 (floor table and the
    oracle-budget definition) HOLDS on arithmetic with a definition defect
    downstream; joint J3 (rho reference) HOLDS; the proves-too-much control
    PASSES in the same-unit boundary ledger with the N = r ambient and, under
    the producer's N = 4r ambient, exhibits the sub-floor rows that
    corroborate J1; the blind re-derivation (Q1-Q5) AGREES from the statement
    alone. Composition sections 1 to 3 record the verdicts, the prior versus
    outcome (P2 held in direction, smaller in size, and the control produced
    evidence FOR the correction the prior did not anticipate), and item 1 of
    section 4 names this scoping correction as the act a later Coordinator
    would write; item 2 names the definition pin, folded into this record
    rather than written separately because it changes no record's verdict
    and one record per downstream quoter would be many records for one
    definition. Every number above is either re-derived in this record from
    the cited report values or marked as quoted.

