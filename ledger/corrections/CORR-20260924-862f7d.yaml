  items:
    - item: 1
      what: the "driver died after 227" PASS route under readbackclose RK-3 (b) as worded
      records:
        - id: DEC-20260924-8fa3d4
          path: ledger/decisions/DEC-20260924-8fa3d4.yaml
          locations:
            - lines: 605-616
              context: RKR-7 ruling frozen_v2_check_run_62-70_through_the_union ("RK-3 (b) gives it PASS")
            - lines: 814-820
              context: named defect E-2 (c)
            - lines: 1239-1245
              context: rationale ("real fail-open routes ... the E-2 (c) PASS route")
        - id: CORR-20260924-7fcbd2
          path: ledger/corrections/CORR-20260924-7fcbd2.yaml
          locations:
            - lines: 140-146
              context: item 2 corrected_value, second bullet
        - id: AMD-EXP-GFPN-05ff43-20260924-failclosed
          path: experiments/EXP-GFPN-05ff43/amendments/v2_addendum_failclosed.yaml
          locations:
            - lines: 252-255
              context: RFF-3's last sentence
            - lines: 396-402
              context: RF-3 (a)'s parenthetical
      prior_value: >-
        Under RK-3 (b) as worded, a package whose driver died after a launch
        whose pair was read carries that pair in a raise-frame record, passes
        v2_check_run.py 66-67, fails no other item and receives PASS.
      corrected_value: >-
        That holds only if the r4 wrapper records the requested cap
        independently of raw-result.json. On the r3 base the manifest's
        child_rlimit_as_requested_bytes is read from raw-result.json's
        envelope (r3_run_wrapper.py 550); a wrapper-written raw-result.json
        (500) carries no envelope, so the requested cap is None and the frozen
        item at v2_check_run.py 68-70 fails (review OB-1; evaluator DIED227:
        R0 Mr3 FAIL, R0 Mc PASS). The route was conditional on an unwritten
        wrapper, not a property of RK-3 (b) alone.
      consequence: >-
        None on any verdict: failclosed RF-3 (a) FAILs the route either way
        (raised non-null; wrapper-recorded). The successor childend RG-6 (b)
        reads the two failclosed passages with this item.
      evidence: >-
        review-report.yaml 266-269 (J-2 driver_died_after_227), 683-693
        (OB-1); r3_run_wrapper.py 491-505, 550.
    - item: 2
      what: the known-answer expectation on a weakened RF-1
      records:
        - id: TASK-20260924-f5631b
          path: ledger/handoffs/TASK-20260924-f5631b.yaml
          locations:
            - lines: 292-294
              context: J-5 worked_attack ("apply it to a deliberately weakened RF-1 ... it must report P-16 as fail-open")
      prior_value: >-
        Under RF-1 weakened to "false whenever no pid is found", the
        reviewer's method must report P-16 as fail-open.
      corrected_value: >-
        Under RF-2 and RF-3 no raise path reaches PASS or PASS_ZL (the raise
        ends the frozen driver, so the outcome is wrapper-recorded, and the
        launch record carries raised non-null), so the draft's FAIL-OPEN
        precondition cannot be met on P-16 whatever RF-1 records. The correct
        expectation was a record-level (iii) defect under the full failclosed
        rules, and a package-level fail-open only with RK-3 (b) as worded under
        an independently recorded cap. The method reported exactly that
        (review DV-1).
      consequence: >-
        DV-1 is accepted as the method's correct report; RFR-0 (c), which does
        not name the weakened-RF-1 object, is unaffected
        (DEC-20260924-844896). The observation that RF-1's three-valued
        precision bears on no verdict is carried to KN-TECH-79d6b9.
      evidence: review-report.yaml 133-156, 1035-1041; review-report.md 107-130.
    - item: 3
      what: failclosed's verdict rules as fail-closed by positive evidence on every condition
      records:
        - id: AMD-EXP-GFPN-05ff43-20260924-failclosed
          path: experiments/EXP-GFPN-05ff43/amendments/v2_addendum_failclosed.yaml
          locations:
            - lines: 31-37
              context: header (1) and (2)
            - lines: 715-722
              context: options_weighed FB ("a new path that only yields FAIL cannot break it")
        - id: DEC-20260924-8fa3d4
          path: ledger/decisions/DEC-20260924-8fa3d4.yaml
          locations:
            - lines: 1239-1245
              context: rationale "THE PROPERTY THE SCIENCE NEEDS IS MONOTONE"
            - lines: 717-722
              context: change_of_approach.what_changes (1)
      prior_value: >-
        Every r4 recording and verdict value is taken from a named positive
        record or is `undetermined`; PASS and PASS_ZL require positive child
        classes; so a new path can only yield FAIL.
      corrected_value: >-
        One favourable condition of PASS and PASS_ZL is inferred from an
        ABSENCE: "no recorder-foreign file exists in the package" (failclosed
        RF-2 (viii), RF-3 (a)) is read as "no created child ran recorder or
        entry code in another process", and the only evidence of such a run
        is a write that the escaped process itself must make. That contradicts
        failclosed's own RF-0 (a) (review OB-7) and is the basis of FO-1. On
        every other condition the rules are positive as stated.
      consequence: >-
        RFR-1 fails on FO-1 (DEC-20260924-844896). The successor childend
        RG-1 replaces the absence-based condition, for every created child, by
        positive child-end evidence collected by the installing process.
      evidence: review-report.yaml 470-564 (FO-1), 728-732 (OB-7).
    - item: 4
      what: failclosed's planned-basis scope
      records:
        - id: AMD-EXP-GFPN-05ff43-20260924-failclosed
          path: experiments/EXP-GFPN-05ff43/amendments/v2_addendum_failclosed.yaml
          locations:
            - lines: 616-617
              context: definitions, PLANNED BASIS OUTCOME
            - lines: 409-417
              context: RF-3 (b) replacing readbackclose RK-3 (c)
            - lines: 137-139
              context: incorporates_by_reference ("(c) replaced by RF-3 (b)")
      prior_value: >-
        RF-3 (b) carries readbackclose RK-3 (c)'s designed stop forward, and
        the planned-basis scope of the readings is the one the lineage used.
      corrected_value: >-
        RK-3 (c) also stated that an outcome whose basis includes only
        launches that never released a capped workload under a recorded cap
        "is not a planned basis outcome" (readbackclose lines 360-363), and
        readbackclose's reading RKR-4 (b) exempted such outcomes. failclosed
        RF-3 (b) keeps the stop but not the exclusion, and its definition of
        PLANNED BASIS OUTCOME carries none, so outcomes that every protocol
        version fails by the frozen item v2_check_run.py 65-67 became planned
        basis outcomes refused by design (review PB-1).
      consequence: >-
        RFR-2 fails as worded, definitionally (DEC-20260924-844896). The
        successor childend RG-2 restores the exclusion by rule text; no
        verdict changes.
      evidence: review-report.yaml 299-347 (J-3), 566-608 (PB-1); readbackclose 355-363.
    - item: 5
      what: the writer of a driver-written raw-result.json
      records:
        - id: AMD-EXP-GFPN-05ff43-20260924-failclosed
          path: experiments/EXP-GFPN-05ff43/amendments/v2_addendum_failclosed.yaml
          locations:
            - lines: 289-291
              context: RF-0 (b) "(written by the frozen command's finish())"
      prior_value: A driver-written raw-result.json is written by the frozen command's finish().
      corrected_value: >-
        The aggregate and aggregate_a1 commands write raw-result.json directly
        (v2_driver.py 1322; a1_driver.py 388). RF-0 (b)'s test (the file exists
        and parses after the driver exits) still reads "driver" for them; they
        launch nothing (review OB-2).
      consequence: None on any verdict. childend RG-6 (a) states the writers.
      evidence: review-report.yaml 257-265, 694-699.
    - item: 6
      what: the number of checker items that fail on a development package
      records:
        - id: AMD-EXP-GFPN-05ff43-20260924-failclosed
          path: experiments/EXP-GFPN-05ff43/amendments/v2_addendum_failclosed.yaml
          locations:
            - lines: 463-471
              context: RF-4 (c) "exactly the r4 REG-1 item (the analogue of r3_check_run.py 327-330)"
        - id: DEC-20260924-8fa3d4
          path: ledger/decisions/DEC-20260924-8fa3d4.yaml
          locations:
            - lines: 534-539
              context: RKR-6 a_ruling ("the r3 REG-1 check item ... fails")
            - lines: 827
              context: named defect E-6
      prior_value: Exactly one checker item (the REG-1 verdict item) fails on a development package.
      corrected_value: >-
        Three fail on the r3 base: r3_check_run.py 329-330 (verdict
        NOT_EVALUABLE), 331-332 (d_branch None against the plan's d-parsed
        value) and 333-334 (exclusion_list_sha256 None against the plan's
        value), because the NOT_EVALUABLE block (r3_run_wrapper.py 158,
        recorded at 565-566) carries neither key (review FC-1).
      consequence: >-
        As worded, RF-4 (c) STOPs DV-18 by construction (a fail-closed
        finding, never a bar). childend RG-3 (d) lists the three items.
      evidence: review-report.yaml 397-405, 612-622.

  nothing_else_changes: >-
