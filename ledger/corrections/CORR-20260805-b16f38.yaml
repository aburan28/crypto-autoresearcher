correction:
  id: CORR-20260805-b16f38
  title: >-
    Three declared 40-hex values in the BATCH-d2a728 archive chain do not resolve;
    the ledger receipt is content-sound, mechanically unverified, and
    commit-unverifiable. Supersedes CORR-20260805-3d9c47.
  recorded_at: '2026-08-05'
  recorded_by: coordinator
  record_type: archive_receipt
  record_type_note: >-
    templates/research-records.md offers candidate|claim|run. None fits: the
    subject is a Coordinator archive receipt together with two ledger records that
    restate its values. The vocabulary is extended rather than forced.

  supersedes: CORR-20260805-3d9c47
  supersedes_reason: >-
    CORR-20260805-3d9c47 scoped its finding to ONE field -- the `snapshot_commit`
    of the live EV-MLKEM-da9e3b -- and wrote its own supersession condition into
    its next_actions: "Run `git cat-file -t` on the receipt's own commit_sha
    35ab6209... and parent_sha c7df368e..., and record the result. If either fails
    to resolve the defect is broader than one field and this record must be
    superseded by one that says so." THE CONDITION FIRED. The receipt's own
    commit_sha does not resolve. This record is that supersession.
  supersedes_note: >-
    CORR-20260805-3d9c47's content is UNCHANGED and remains correct within its
    stated scope; every check it reported still holds. The only edit made to it is
    the addition of a `superseded_by` pointer to this record, which is the
    corpus-wide supersession convention and not a rewrite. Read that record for the
    original evidence; read this one for the current scope and ruling.

  relates_to:
    - CORR-20260805-527ffc
    - CORR-20260805-527ffc-branch-EV-MLKEM-da9e3b.yaml
    - DEC-20260805-7b3e91

  # ───────────────────────────────────────────────────────────────────────────
  # CHECKS PERFORMED
  # ───────────────────────────────────────────────────────────────────────────
  check_performed:
    performed_by: >-
      The dispatching session, at this Coordinator's request. This Coordinator has
      no command execution and did not run these commands or hash any file; the
      outputs below are reported, not reproduced.
    performed_at: '2026-08-05'
    repository_state: A clone containing origin/main.
    commit_resolution:
      - value: 8cc51677f7202e9f9b85efdf834860254798abf4
        declared_in: >-
          BATCH-d2a728 snapshot receipt (commit_sha), batch dispatch queue, and all
          four validator/red-team review artifacts
        resolves: true
        detail: >-
          commit, dated 2026-08-03, "snapshot: BATCH-d2a728 first sieve measurement
          (TASK-20260803-aa727e archiving e53ce2)"
      - value: 8cc51677f7205d8b6b2f66e5ba31f0d8bbb84c9e
        declared_in: >-
          live ledger/evidence/EV-MLKEM-da9e3b.yaml (snapshot_commit),
          ledger/goals/GOAL-MLKEM-004.yaml BATCH-d2a728 batch_log entry
          (snapshot_commit), BATCH-d2a728 ledger receipt (reviewed_snapshot)
        resolves: false
      - value: 35ab620987be6b7157b1b8f90a6d4c1df6812879
        declared_in: >-
          BATCH-d2a728 ledger receipt archives/TASK-20260803-586a7f/ledger_commit_receipt.json
          (commit_sha), AND in the commit message of 3476d25e (short form, 8 hex)
        resolves: false
        new_in_this_record: true
      - value: c7df368e5f15087d17ff181086a9707487adc43e
        declared_in: same receipt (parent_sha)
        resolves: true
        new_in_this_record: true
    introducing_commit:
      sha: 3476d25ecc3da0f9e1896e5c909c94f22fc41136
      date: '2026-08-03'
      message: >-
        "coordination: bind TASK-20260803-586a7f ledger receipt to 35ab6209;
        BATCH-d2a728 complete"
    verifier_key_mismatch:
      finding: >-
        tools/research_dispatch.py reads `path_sha256` ONLY -- twelve occurrences,
        including the content-fallback path (`hashes = archive.get("path_sha256")`)
        and the error string "declares no path_sha256 to fall back on". The
        BATCH-d2a728 ledger receipt spells the key `source_path_sha256`. The
        verifier therefore acts on NO content binding for this receipt.
      but: >-
        All four paths declared under `source_path_sha256` were hashed by hand and
        ALL FOUR MATCH the bytes on disk. The binding is sound in substance and
        invisible to the tool. BOTH HALVES ARE LOAD-BEARING AND NEITHER MAY BE
        REPORTED WITHOUT THE OTHER.

  # ───────────────────────────────────────────────────────────────────────────
  # THE RULING ASKED FOR: IS THIS A VERIFIED ARCHIVE?
  # ───────────────────────────────────────────────────────────────────────────
  ruling:
    verdict: content_sound__mechanically_unverified__commit_unverifiable
    plain_statement: >-
      NO, THIS IS NOT A VERIFIED ARCHIVE. YES, ITS CONTENTS ARE SOUND. Those are
      different claims and collapsing them in either direction would misreport it.
    not_a_verified_archive_because:
      - >-
        CLAUDE.md's content-first rule describes a status the TOOL reports:
        research_dispatch.py "verifies the declared hashes against the tree and
        reports the archive as content-verified in the dispatch plan." The tool
        reads `path_sha256`; this receipt spells `source_path_sha256`. The
        mechanism CLAUDE.md names cannot reach these hashes, so it will not and
        cannot report this archive content-verified.
      - >-
        Commit reachability, which that rule demotes to advisory, is unavailable
        here too: the receipt's own commit_sha does not resolve.
      - >-
        AGENTS.md rule 7 is explicit that "a theory, run package, review report, or
        ledger record is not official until the dispatcher's post-commit verifier
        accepts it." The verifier cannot accept this receipt on either binding. By
        the program's own definition it is not verified.
    contents_are_sound_because: >-
      All four declared source hashes match the bytes on disk. Whatever is wrong
      with the commit identifiers, THE ARTIFACTS THIS RECEIPT ARCHIVED ARE THE ONES
      ON DISK, UNMODIFIED. This is a tooling-spelling defect plus a provenance
      defect. IT IS NOT AN EVIDENCE-TAMPERING FINDING AND MUST NOT BE READ AS ONE.
    why_the_content_first_rule_does_not_rescue_it: >-
      The rule exists for a specific failure: CLAUDE.md ties it to squash merges
      destroying recorded shas (CORR-20260802-a1f151, five goals left with
      unresolvable `latest_verified_commit`). In that failure the recorded sha was a
      TRUE statement about the repository when written, and history rewriting made
      it stale; content-first correctly rescues such an archive. That remedy is
      addressed to a commit that BECAME unreachable. Whether these values ever named
      reachable objects is not established here and is not assumed either way --
      but the rule cannot be invoked to rescue an archive whose content binding the
      verifier also cannot read, because then nothing is verified at all.
    what_is_repairable_and_what_is_not:
      repairable: >-
        The content binding. Because all four hashes already match, a SUPERSEDING
        receipt spelling the key `path_sha256` would be content-verifiable by the
        tool today, asserting nothing new -- only what has now been checked by
        hand. The existing receipt is an archived artifact and MUST NOT BE EDITED.
      not_repairable: >-
        The commit bindings. No action makes 35ab6209... or
        8cc51677f7205d8b6b... resolve.
      explicitly_forbidden: >-
        DO NOT substitute 3476d25e for 35ab6209 in any superseding receipt.
        3476d25e is the commit that INTRODUCED THE RECEIPT; the receipt's
        `commit_sha` field means the commit that MADE THE LEDGER ARCHIVE. They are
        different things, and swapping one for the other would produce a receipt
        that verifies while describing an event that did not happen -- the tidy
        falsification this whole line of correction exists to prevent. A
        superseding receipt records the commit values as unresolvable and binds on
        content alone.

  # ───────────────────────────────────────────────────────────────────────────
  # THE COMMIT-MESSAGE OCCURRENCE
  # ───────────────────────────────────────────────────────────────────────────
  commit_message_asymmetry:
    observation: >-
      3476d25e's own message names 35ab6209, so the non-resolving value was written
      into an immutable commit message as well as into a YAML field.
    what_this_licenses:
      - >-
        The value has TWO independent declarations in the repository, not one. A
        slip confined to a single YAML field is therefore a less economical
        explanation than it was under CORR-20260805-3d9c47's narrower scope.
      - >-
        The defect cannot be fully repaired by superseding the receipt. A commit
        message is immutable; anyone reading `git log` will always see this value.
        A correction record is the ONLY place that fact can be flagged, which is
        part of why this record exists.
    what_this_does_not_license:
      - >-
        ANY INFERENCE ABOUT INTENT, KNOWLEDGE, OR FABRICATION. NONE IS ALLEGED AND
        NONE SHOULD BE READ IN. One wrong value copied twice from one source is one
        error propagated, not two errors; the field and the message were plausibly
        written in the same operation from the same string.
      - >-
        Any inference that no ledger commit was made. The workflow shape here is
        CORRECT: templates/research-records.md requires "Do not put a commit's own
        SHA into an artifact within that same commit", and a separate follow-up
        commit binding the receipt is exactly the prescribed two-step pattern. A
        correct workflow with a wrong recorded value is fully consistent with an
        ordinary operational error -- an amend, reset or rebase before push, or a
        transcription slip -- and this session cannot distinguish among those.
      - >-
        That the commit MESSAGE is wrong at all. IT NAMES THE VALUE IN 8-HEX SHORT
        FORM. A short prefix cannot distinguish a correct short sha from the prefix
        of an incorrect long one -- the identical ambiguity `8cc51677` carried, and
        which only `--disambiguate` resolved. Until the check below is run, the
        message is NOT established as incorrect.
    decisive_check_outstanding:
      command: git rev-parse --disambiguate=35ab6209
      why_it_decides: >-
        If it returns a commit, the pattern matches the 8cc51677 case exactly --
        correct short prefix, wrong 40-hex tail -- the commit message is exculpated,
        and the defect is confined to the two 40-hex fields. If it returns nothing,
        the value names no object in this repository at any length, and the
        commit-message occurrence stands as a second declaration of an
        unresolvable identifier. RUN THIS BEFORE ANY FURTHER RULING ON THE
        COMMIT MESSAGE.

  # ───────────────────────────────────────────────────────────────────────────
  # EXCULPATORY — the open check from CORR-20260805-3d9c47 is CLOSED
  # ───────────────────────────────────────────────────────────────────────────
  closed_in_the_receipt_authors_favour:
    subject: >-
      The BATCH-d2a728 ledger receipt's `validator_diff` attestation:
      "tools/validate_ledger.py: 20 new errors vs baseline before these records, 20
      after. ZERO new validation errors."
    raised_as: >-
      CORR-20260805-3d9c47 `related_observation_not_a_finding` -- raised as an OPEN
      CHECK, explicitly not as a finding, on the ground that the validator's
      TypeError on a mapping-shaped knowledge_promotion entry silently skipped every
      check after check_knowledge_entries and might have made that attestation
      meaningless.
    check_performed: >-
      The tree at the resolving snapshot commit
      8cc51677f7202e9f9b85efdf834860254798abf4 was examined. The crashing line WAS
      present in tools/validate_ledger.py at that commit, but all 229
      ledger/decisions/*.yaml files in that tree were parsed and ZERO mapping-shaped
      `promoted` entries were found.
    result: >-
      THE VALIDATOR DID NOT CRASH THERE. The receipt's "ZERO new validation errors"
      attestation is consistent with the tree it was made against. THE CHECK IS
      CLOSED IN THE RECEIPT AUTHOR'S FAVOUR, BY NAME, AND NOTHING IN THIS RECORD OR
      IN CORR-20260805-3d9c47 IMPUGNS THAT ATTESTATION.
    note_on_having_raised_it: >-
      Recorded because raising an open check against a named artifact carries a cost
      even when it resolves favourably, and the resolution deserves the same
      prominence as the question. The condition was stated precisely so it could be
      settled cheaply; it was, and this is the settlement.

  # ───────────────────────────────────────────────────────────────────────────
  # SCOPE
  # ───────────────────────────────────────────────────────────────────────────
  what_this_establishes:
    - >-
      Three declared 40-hex values in one archive chain do not resolve: the live
      EV-MLKEM-da9e3b `snapshot_commit`, the receipt's `reviewed_snapshot`, and the
      receipt's own `commit_sha`. The receipt's `parent_sha` does resolve.
    - >-
      The verifier reads `path_sha256` and the receipt spells `source_path_sha256`,
      so no content binding is machine-readable for this receipt.
    - >-
      All four declared source hashes nevertheless match the bytes on disk.
    - >-
      The BATCH-d2a728 ledger archive is therefore not a verified archive under
      AGENTS.md rule 7, while its archived contents are sound.

  what_this_does_not_establish:
    - >-
      HOW ANY OF THE THREE VALUES AROSE. Same discipline as CORR-20260805-3d9c47:
      an amend or reset before push, a rebase, a transcription error, a copy from a
      rewritten history and a coincidence all remain consistent with what was
      checked. NO INTENT IS ALLEGED.
    - >-
      What any of the fields was meant to contain. In particular this record does
      NOT determine that the live EV-MLKEM-da9e3b `snapshot_commit` "should have
      been" the resolving value; the two BATCH-d2a728 bodies differ in content and
      may describe different work.
    - >-
      That any measurement, certificate, or review verdict is wrong. Nothing here
      touches the science, and the four matching hashes are affirmative evidence
      that the archived artifacts were not altered.
    - >-
      That main's GOAL-MLKEM-004 lineage is unreliable. The defect is in the
      archive chain of the batch BOTH lineages share.

  # ───────────────────────────────────────────────────────────────────────────
  # EFFECT ON THE GOAL-MLKEM-004 ADJUDICATION
  # ───────────────────────────────────────────────────────────────────────────
  effect_on_goal_mlkem_004_adjudication:
    verdict: >-
      Strengthens the procedural case further and adds a precondition; still does
      NOT settle which closure is correct.
    what_changed_since_CORR_3d9c47: >-
      That record said "one field in one record is not a lineage." That reasoning no
      longer describes the situation: three declared values across an evidence
      record, a goal batch_log entry and an archive receipt -- including the
      receipt's OWN commit_sha -- is a defect in the archive chain itself, not a
      blemish on one field. The finding is raised from "a provenance defect" to "the
      durability binding for BATCH-d2a728 does not verify."
    new_precondition_for_the_reviewer: >-
      BATCH-d2a728 is the batch on which BOTH closure lineages rest. If its ledger
      archive does not verify, then under AGENTS.md rule 7 neither lineage's
      foundation is currently in the state the program requires before an official
      transition. This is SYMMETRIC -- it favours neither main nor the branch -- and
      it must be repaired, or explicitly accepted as unrepairable with reasons,
      before either closure is declared official.
    still_does_not_settle_it_because:
      - >-
        The disputed question is whether GOAL-MLKEM-004 closed WITH a named
        obstruction (branch: DEC-20260804-bcdecb / EV-MLKEM-4a9cfe) or WITHOUT one
        (main: DEC-20260805-0b3e11 / EV-MLKEM-2cd08b). An unverifiable archive in a
        shared earlier batch is logically independent of which closure correctly
        characterises the evidence.
      - >-
        Strengthening the PROCEDURAL case is not strengthening either side's
        SUBSTANTIVE case, and the two must not be conflated. Nothing here is an
        argument that the branch's obstruction is real or that main's omission of it
        is wrong.
    unchanged_prohibitions:
      - >-
        Do not switch the live lineage on the strength of these checks. A verifying
        provenance value is not an argument about the obstruction.
      - >-
        Do not edit the live EV-MLKEM-da9e3b, the GOAL-MLKEM-004 batch_log, or any
        archived receipt. All are immutable; corrections supersede.
      - >-
        Do not retire, re-open or restate GOAL-MLKEM-004. `closed_at_budget` asserts
        no success and understates nothing.
      - >-
        AGENTS.md rule 12 still governs the adjudication and is not suspended -- only
        rule 13 is. This record is an input to that independent review-breakthrough
        session, not a substitute for it.

  next_actions:
    - >-
      DECISIVE AND CHEAP: run `git rev-parse --disambiguate=35ab6209` and record the
      result. It determines whether the commit message is exculpated or is a second
      declaration of an unresolvable identifier.
    - >-
      Issue a SUPERSEDING ledger archive receipt for TASK-20260803-586a7f that
      spells the content key `path_sha256`, carries the four already-matching
      hashes, and records the commit values as unresolvable. Do not edit the
      existing receipt and do not substitute 3476d25e for 35ab6209.
    - >-
      Audit every other archive receipt in the repository for the
      `source_path_sha256` spelling. If the misspelling is systemic, the correct
      remedy is a tooling change accepting both keys plus a sweep, not N superseding
      receipts -- and that is a tooling decision with its own review, not a
      Coordinator act.
    - >-
      Carry this record, and CORR-20260805-3d9c47 which it supersedes, into the
      rule 12 independent review-breakthrough session owed on the GOAL-MLKEM-004
      double closure.

  does_not_rewrite_history: true
  official_research_state_changed: false
  hypothesis_status_transition: none
