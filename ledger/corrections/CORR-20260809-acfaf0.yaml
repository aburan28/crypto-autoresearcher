correction:
  id: CORR-20260809-acfaf0
  title: >-
    Merge collision — GOAL-MLKEM-005 BATCH-a44d08 review reports
    (TASK-20260806-7418bc, TASK-20260806-e43218) diverge from origin/main
  recorded_at: '2026-08-09'
  recorded_by: coordinator
  context: >-
    Merging origin/main into feat/launch-research-harness-f73931 (this
    worktree's branch) produced add/add conflicts at two paths:
    coordination/goals/GOAL-MLKEM-005/batches/BATCH-a44d08/reviews/TASK-20260806-7418bc/validation_report.yaml
    and
    coordination/goals/GOAL-MLKEM-005/batches/BATCH-a44d08/reviews/TASK-20260806-e43218/red_team_report.md.
    Both sides had genuinely different content at the identical task ID and
    path: an independent Validator report (verdict `failed`, 685 lines, dated
    2026-08-09T05:53:10Z) and an independent Red Team report on this branch,
    versus a different Validator/Red Team pair on origin/main.
    Investigation before resolving (per AGENTS.md "Durable research commits":
    a sync conflict inside a run artifact is never resolved by picking a side
    without checking binding) found the two sides are NOT symmetric:
    origin/main's ledger/decisions/DEC-20260806-607779.yaml (decided
    2026-08-08) explicitly names TASK-20260806-7418bc ("independent Validator
    ... returned verdict `failed`") and TASK-20260806-e43218 ("An independent
    Red Team ... reached the same place on Section C by a different route")
    in its narrative, and lists both exact paths in its archive_binding
    target_ids. GOAL-MLKEM-005.yaml on origin/main is current through a
    successor batch (BATCH-cbe023, closed by DEC-20260808-05b684) that
    presupposes DEC-20260806-607779. This branch's copy of GOAL-MLKEM-005.yaml
    was stale (current_batch_id still BATCH-a44d08, updated_at 2026-08-06) and
    did not reference DEC-20260806-607779 at all, and no decision anywhere in
    this branch's own ledger cites TASK-20260806-7418bc or TASK-20260806-e43218
    either. This branch's two review files were therefore never adopted by any
    Coordinator decision on either lineage — an orphaned duplicate pass over
    the same batch, not a disputed live claim.
  resolution:
    - >-
      Kept origin/main's content at both live paths. Rule 15 (AGENTS.md)
      forbids remapping an identifier that appears in a completed archive's
      binding fields; TASK-20260806-7418bc and TASK-20260806-e43218 appear in
      DEC-20260806-607779's archive_binding, so that content is authoritative
      and was not touched.
    - >-
      Preserved this branch's orphaned versions in full, unedited, under
      CORR-20260809-acfaf0-MLKEM-MERGE-branch-TASK-20260806-7418bc-validation_report.yaml
      and
      CORR-20260809-acfaf0-MLKEM-MERGE-branch-TASK-20260806-e43218-red_team_report.md
      in this directory, so the independent review work is not silently
      discarded even though it was never load-bearing.
  live_goal_authority: ledger/goals/GOAL-MLKEM-005.yaml
  does_not_rewrite_history: true
  limitations:
    - >-
      The preserved branch-side Validator report reaches a compatible but not
      identical verdict to the live version (frozen cell verdicts NEITHER in
      all four cells; Section B admissibility INADMISSIBLE; Section C V-match
      gate FAIL on all 10 reachable pairs) — the two independent passes agree
      on substance where they overlap. This correction does not merge or
      reconcile them; any future GOAL-MLKEM-005 batch that wants a second
      opinion on BATCH-a44d08 can read the preserved copy.
    - >-
      Not investigated: which session produced this branch's orphaned copy,
      when, or why it was never committed through a proper snapshot/ledger
      archive before landing in this worktree's single bundled local commit.
      That worktree-hygiene question is out of scope for this correction.
