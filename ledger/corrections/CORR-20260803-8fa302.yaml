correction:
  id: CORR-20260803-8fa302
  recorded_at: '2026-08-03'
  record_type: claim
  record_id: RC-10-PREMISE-AND-MECHANISM-SCOPE
  field: prior_measurement_status_of_the_analytic_null_and_the_localisation_of_the_r5_excess
  decided_by: coordinator
  supersedes: null
  superseded_by: null
  partially_corrects: CORR-20260803-7d41c8

  defect_1_the_absence_claim_inside_the_absence_claim_correction:
    prior_value: >-
      From CORR-20260803-7d41c8: "RC-10's premise -- that the analytic null
      4*2^-32 had never been checked against measurement -- was NOT falsified by
      the BATCH-006 arms and remains correct as stated."
    corrected_value: >-
      FALSE. ELEVEN PRIOR r >= 6 NULL ARMS EXIST AND THE NULL WAS ALREADY PINNED
      TO ROUGHLY PLUS OR MINUS 26 PERCENT. BATCH-001 yoyo5/analysis.json carries
      four (3 vs 4.0; 3 vs 4.0; 10 vs 8.0; 13 vs 8.0); BATCH-002 carries
      arm_A2, arm_A2b, arm_A3 and arm_A3b (6 vs 4.0; 7 vs 8.0; 5 vs 8.0; 7 vs
      8.0); BATCH-004 carries three r=6 arms (0 vs 2.0; 1 vs 2.0; 2 vs 2.0).
      AGGREGATE: 57 OBSERVED AGAINST 58.0 MODELLED. BATCH-001 additionally
      carried a byte-level chi-squared at r=5 (6.73 on 4 dof) testing the same
      independence assumption.
    the_aggravating_circumstance: >-
      THIS ERROR WAS MADE INSIDE THE CORRECTION WHOSE OWN LESSON WAS THAT
      ABSENCE CLAIMS MUST CITE THE DIRECTORIES SEARCHED. CORR-20260803-7d41c8
      states that rule and then, in the paragraph limiting its own scope,
      asserts a second absence without searching. Writing the rule down did not
      make it operative, because the check it prescribes was never run on the
      document that prescribed it.
    who_caught_it: >-
      The BATCH-008 independent validator (TASK-20260803-bc660a), which scanned
      4858 JSON files under coordination/goals/GOAL-AES-003/** and experiments/**
      rather than reasoning from memory. The Coordinator then re-derived all
      eleven arms and the 57-against-58.0 aggregate independently before
      adopting the finding.
    what_the_red_team_actually_said: >-
      RECORDED BECAUSE THE ORIGINAL SOURCE WAS NOT AT FAULT HERE. The BATCH-005
      red team never wrote "never checked". It wrote that the 32-bit endpoint
      "can never reach" that precision, which is accurate and is a statement
      about attainable precision rather than about absence. The escalation from
      that to "never measured" was the Coordinator's.

  defect_2_what_rc_10_actually_contributes:
    not: >-
      A first measurement of the null. That had been done eleven times.
    but: >-
      TWO THINGS, BOTH REAL. (a) NO INSTRUMENT IN THIS CAMPAIGN HAD EVER EMITTED
      A PREFIX STATISTIC. The validator grepped for it and confirmed the
      producer's blindness claim holds. (b) It tightens the null by roughly 500x,
      from about plus or minus 26 percent to plus or minus 0.05 percent at k=1.
    the_consequence_that_lowers_this_batch_s_stakes: >-
      A NULL ERROR LARGE ENOUGH TO EXPLAIN A 14x EXCESS WAS ALREADY EXCLUDED
      BEFORE THIS BATCH RAN. The BATCH-008 objective presented RC-10 as testing
      whether "every excess factor in five batches is wrong by the same factor",
      and that possibility was already dead at 57-against-58.0. This is the
      campaign UNDERSTATING its own prior evidence in order to overstate a new
      batch's stakes -- the same direction of error as the r=5-arm gap recorded
      in EV-AES-a47618, and the opposite direction from overclaiming a result.

  defect_3_the_mechanism_claim_is_narrower_than_the_coordinator_stated:
    prior_value: >-
      The Coordinator reported that the r=5 excess is "absent at k=1, 2 and 3 and
      appears only at the full 32-bit word", and that "the four-byte framing is
      doing the work" -- stated as established.
    corrected_value: >-
      HALF ESTABLISHED, HALF NOT. The NEGATIVE half is strong and was
      UNDERSTATED by the producer: k=1 sits at [0.99941, 1.00036] of model on
      16.7M events and k=2 at [0.99114, 1.00645] on 65k, so a byte-local
      mechanism of the observed magnitude is excluded by about four orders of
      magnitude. The EXISTENCE of the k=4 effect also survives model-free against
      the matched-seed r=10 arm: 14 against 1, exact two-sided p = 9.77e-4.
      WHAT IS NOT ESTABLISHED IS THE LOCALISATION TO 32 BITS RATHER THAN 24. By
      NESTING, the 13 excess k=4 events are already inside the k=3 count;
      removing them leaves 266 against 255.0, z = +0.69. The k=3 model count is
      256 with Poisson sd 16, against a k=4 absolute excess of 13 events -- 0.8
      sigma, invisible by construction. "Full 32-bit word, not three-byte" is
      therefore one notch stronger than the data supports.
    magnitude_versus_existence: >-
      Existence of the r=5 k=4 effect survives; its MAGNITUDE does not. The
      model-free ratio interval against the matched r=10 arm is [2.13, 592].

  defect_4_the_round_profile_distinguishes_neither_hypothesis:
    what: >-
      RANK 1 HAD ZERO DISCRIMINATING POWER AND ITS FALSIFIER WAS STRUCTURALLY
      INCAPABLE OF FIRING. At r <= 4 the by-word histogram is [0,0,0,N,0] and
      W = 3 on every trial -- a deterministic property that holds under a random
      S-box too, and which BATCH-007's Proposition 1 proves. At rate 1.0 the
      "excess" is identically 1/p_null = 2^30 regardless of exposure or data, so
      both the decay hypothesis and the instrument-artifact hypothesis predict
      exactly 1.0 there. The producer had additionally read the saturated
      BATCH-006 arms before preregistering, and disclosed that as deviation D-4.
    consequence: >-
      "The falsifier did not fire" IS NOT CORROBORATION HERE and is withdrawn as
      such. The informative content of the round profile reduces to two points:
      r=5 elevated, r >= 6 at null. What it does establish is the
      inventor-protocol section 3 decay test -- the quantity falls as rounds
      increase -- which is necessary and not sufficient.

  finding_5_the_r5_excess_is_not_aes_sbox_specific:
    what: >-
      NOBODY IN THIS BATCH OR ANY PRIOR ONE STATED THIS, AND THE DATA HAS BEEN ON
      DISK SINCE BATCH-006. Its 27 random-S-box arms at r=5, 2^30, give
      W_ge1 ranging 6 to 25 with mean 15.48. The AES arms read 12 (seed 631001)
      and 14 (seed 531001). P(X >= 14 | Poisson(15.48)) = 0.681, and the AES
      reading sits at roughly the 41st percentile of the campaign's own
      random-S-box distribution.
    why_it_matters: >-
      THE r=5 EXCESS BELONGS TO THE FIVE-ROUND SPN SHAPE, NOT TO THE AES S-BOX.
      Taken with RC-10, the campaign now has two localisations pointing the same
      way: the excess is a property of the round structure and of the 4-byte
      word framing, and is not a property of the AES S-box. This is the
      campaign's own existing null object answering a question the campaign had
      not asked it.
    status: >-
      Computed by the BATCH-008 validator and independently recomputed by the
      Coordinator from the 27 arms before adoption.

  what_does_not_change: >-
    NO MEASUREMENT IS WITHDRAWN. Every count and interval in BATCH-008 stands as
    measured, and the v2-to-v3 equivalence proof stands -- the validator
    reconstructed v3 from the shipped diff byte-exactly, rebuilt it to a
    byte-identical binary, and wrote its own prefix counter by a different
    algorithm that reproduced the counts bit-exactly. The negative half of the
    mechanism result is real and is if anything stronger than reported.

  the_pattern_now_at_four: >-
    CORR-20260803-c92db5 (PRP null said never measured), CORR-20260803-7d41c8
    (RC-9 said never run), CORR-20260803-4e91da (a target said two draws away
    that no number of draws could reach), and now this one -- an absence claim
    made inside the correction that prohibited absence claims. Three of the four
    were made by the Coordinator. The mechanical remedy adopted here, replacing
    the exhortation that plainly failed: A BATCH OBJECTIVE OR CORRECTION MAY NOT
    ASSERT THAT SOMETHING WAS NEVER MEASURED UNLESS THE SAME DOCUMENT RECORDS
    THE SEARCH -- the glob or grep executed, the file count scanned, and the
    date. An unsearched absence claim is to be treated as an unrun measurement,
    which is what it is.

  status_effects:
    hypothesis_status_changed: false
    evidence_strength_changed: false
    claim_tier_changed: false
  edits_are_additive_or_schema_only: true
  affects:
    - CORR-20260803-7d41c8, the RC-10 scope paragraph only; its RC-9 content stands
    - GOAL-AES-003 BATCH-008 dispatch_queue.json objective text
    - the Coordinator's BATCH-008 reporting of the mechanism claim
  verification: >-
    Enumerate the eleven r >= 6 arms and sum: BATCH-001 yoyo5/analysis.json
    entries with rounds >= 6 give 29 observed against 24.0 modelled; BATCH-002
    arm_A2/A2b/A3/A3b give 25 against 28.0; BATCH-004's three r=6 arms give 3
    against 6.0. Total 57 against 58.0. For the S-box finding, take the 27
    B*-RAND-* arms at rounds == 5 in BATCH-006 and compute the mean and the
    Poisson upper tail at 14.

