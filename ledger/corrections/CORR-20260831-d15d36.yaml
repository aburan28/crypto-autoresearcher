    supersingular-curve number theory here, but it matches the Executor's
    own independent finding during implementation, corroborating it); (4)
    `master_seed` not entering panel construction, so both replication runs
    used an identical curve panel (matches the Executor's own disclosed
    note; whether this is a defect or an accepted design choice --
    EXP-MONO-c819ba's OWN panel construction had the same property -- is
    left to independent review rather than asserted here); (5) the
    null-object gate families (i)/(ii) being Var-only rather than Var+C/F
    (this was the Executor's own disclosed, reasoned interpretation of an
    acknowledged textual ambiguity in v1, not obviously a "defect" so much
    as a resolved ambiguity -- the out-of-band edit makes the C/F
    inclusion explicit and mandatory, which is a reasonable tightening but
    was not independently adjudicated as necessary by this Coordinator).

