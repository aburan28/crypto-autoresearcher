  independently_verified_defect_1_p_value_floor_vs_holm_threshold: >-
    VERIFIED BY THIS COORDINATOR, DIRECTLY AGAINST THE ARCHIVED RAW DATA:
    a two-sided permutation p-value computed against n=200 null draws has
    an absolute floor of 1/(n+1) = 1/201 ~= 0.0049751. Holm-Bonferroni's
    most lenient rejection threshold (applied to the single smallest
    p-value in a family) is alpha/m; with m=98 tests (j0 family, Var+C/F
    pooled) or m=100 (random-ordinary family), that threshold is
    0.05/98 ~= 0.000510 or 0.05/100 = 0.0005. Since the floor
    (0.0049751) exceeds BOTH thresholds by roughly a factor of 10, NO
    p-value computed under this design could EVER be Holm-significant, at
    any true effect size, however large. Directly querying
    `runs/RUN-MONO-670aa6-{1,2}/raw-result.json`'s
    `stage3_per_curve.<family>.<ordinal>.p_var_uncorrected` /
    `.p_cf_uncorrected` confirms this is not merely theoretical: the
    MINIMUM p-value actually achieved, across all curves, both statistics,
    both families, both runs, is EXACTLY 0.004975124378109453 = 1/201 --
    the theoretical floor itself, hit exactly, and still ~10x above the
    tightest Holm threshold. The Stage-2 null-object gate "passing" and
    the Stage-3 real-arm "zero significant curves" result were therefore
    GUARANTEED OUTCOMES of this design, independent of the true state of
    the world. They carry ZERO discriminating information about
    H-MONO-663fb4's K3/K4 question in either direction.

  independently_verified_defect_2_family_colliding_prime_streams: >-
    VERIFIED BY THIS COORDINATOR, DIRECTLY AGAINST THE IMPLEMENTATION
    SOURCE: `experiments/EXP-MONO-670aa6/implementation/panel_primary.py`'s
    `_construct_one(domain, family, k)` calls `construct_prime(domain, b,
    k)` and `curve_stream(domain, p, k, ...)` with NO `family` argument in
    either seed derivation. Because the round-robin `field_bits[k mod 5]`
    also depends only on `k`, not `family`, the j0 curve at curve_ordinal
    k and the random-ordinary curve at the SAME curve_ordinal k are
    constructed from the IDENTICAL prime `p` and the IDENTICAL underlying
    SHA-256 stream for (A,B) candidates -- contradicting this contract's
    own text, which claims "Each of the 100 curves is an INDEPENDENTLY
    drawn curve... distinct primes and distinct (A,B) per curve... no two
    panel curves share a construction stream." This is FALSE as
    implemented: the two families are constructed as 50 MATCHED PAIRS
    sharing a prime (and much of the same pseudorandom stream) per pair,
    not as 100 independent draws. This does not invalidate Stage 0, the
    dual-path convolution-engine check, or the legacy 8-curve sub-panel
    (all unaffected by this bug), but it DOES undermine the independence
    assumption behind P5's Fisher-exact enrichment comparison between the
    two families, and it means the "100 independently-constructed curves"
    claim in the contract's own `claim_ceiling` and `primary_panel` text
    is not accurate for the runs as executed.

  other_three_named_defects_not_independently_re_derived_here: >-
    The out-of-band commit also names: (3) no p=1 mod 3 admission control
    on j0 curves (confirmed consistent with the Executor's own disclosed
    deviation note that ~half of j0 curve_ordinal slots would otherwise be
