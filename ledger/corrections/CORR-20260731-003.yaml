correction:
  id: CORR-20260731-003
  recorded_at: '2026-07-31'
  record_type: claim
  record_id: SCHEMA-CONFORMANCE-GOAL-MLKEM-003-DUAL-ATTACK
  field: ledger_and_run_manifest_schema
  prior_value:
    schema_shape: >-
      GOAL-MLKEM-003 dual-attack archive records (DEC-20260731-007..006,
      EXP-MLKEM-012..014 specs, RUN-MLKEM-010..015 packages, KN-FIND-012..016)
      used campaign-local field names that did not satisfy
      tools/validate_ledger.py required keys. Several run directories lacked
      manifest.yaml and companion artifact filenames expected by the validator.
      KN-FIND internal_refs included knowledge IDs (KN-LIT/KN-OPEN/KN-FIND) and
      RT-* labels that are not indexed in ctx.ids.
  corrected_value:
    schema_shape: >-
      Decisions carry decided_by, target_ids, and knowledge_promotion.promoted
      (list; empty list paired with not_warranted where applicable).
      EXP-MLKEM-012/013 gain budget; EXP-MLKEM-014 gains metrics, budget,
      success_criterion, and falsification_criterion. Each RUN-MLKEM-010..015
      directory gains manifest.yaml plus command.txt, environment.json,
      stdout.log, stderr.log, and raw-result.json (raw-result.json is a
      byte-identical copy of results.json; stdout.log copies stdout.txt when
      present). KN-FIND-012..016 internal_refs restricted to ledger/run IDs.
      knowledge/INDEX.md regenerated.
  reason: >-
    PR #74 failed CI on merge hygiene (H-MLKEM-014 YAML parse) and would fail
    the validate_ledger regression gate with ~50 new errors relative to
    origin/main. This correction is representational / archival metadata only.
    No experiment was re-executed. No numerical result, cost table, validity
    judgement, or certificate was altered. Where original command/timing were
    never captured, manifests record that gap explicitly rather than inventing
    a shell transcript. code.commit names the git commit that first archived
    the run package path on the dual-attack branch.
  edits_are_additive_or_schema_only: true
  evidence_artifacts:
    - ledger/corrections/CORR-20260731-003.yaml
    - experiments/EXP-MLKEM-015/runs/RUN-MLKEM-015-001/manifest.yaml
    - ledger/decisions/DEC-20260731-007.yaml
  affects:
    - GOAL-MLKEM-003 dual-attack archive (EXP-MLKEM-010..015 / DEC-20260731-007..006)
  verification: >-
    After this correction, tools/check_merge_hygiene.py --base origin/main
    passes and tools/validate_ledger.py introduces zero new errors relative
    to origin/main.
  decided_by: coordinator
