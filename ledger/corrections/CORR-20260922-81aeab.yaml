correction:
  id: CORR-20260922-81aeab
  recorded_at: '2026-09-22'
  record_type: candidate
  record_id: IDEA-20260922-6cf862

  field: >-
    The matched-rho baseline convention, at every occurrence: heuristic
    H-6cf862-2, target_complexity, dominated_by, sota_delta and
    asymptotic_claim.prior_best (seven occurrences of the formula in total),
    together with every figure derived from it -- in particular the repeated
    "net movement sqrt(k/2)" on which the record's "no exponent moves"
    conclusion rests.

  prior_value: >-
    "0.886 sqrt(r) / sqrt(2k) group operations: Pollard rho with negation and
    the order-k Frobenius class map." The label and the formula are mutually
    inconsistent. The net-movement figure sqrt(k/2) is derived from this
    formula by comparing the Frobenius quotient's factor k against rho's
    claimed sqrt(2k).

  corrected_value: >-
    0.886 sqrt(r) / sqrt(k), equivalently sqrt(pi r / (4k)). The constant
    0.886 = sqrt(pi/4) is ALREADY the negation-only row, so the gain from the
    order-k Frobenius class map OVER that row is sqrt(k), not sqrt(2k);
    dividing by sqrt(2k) spends negation twice and understates matched rho by
    half a bit (0.5 * log2 2).
    CONSEQUENCE NOT YET DISCHARGED: the net-movement figure sqrt(k/2) was
    derived against rho's sqrt(2k) and does not survive unchanged. Under the
    corrected convention rho gains sqrt(k) against the quotient's k, so the
    net figure must be re-derived. Until that is done, 6cf862's "no exponent
    moves" conclusion is UNESTABLISHED rather than refuted -- the conclusion
    may well survive, but it is not currently supported by a correct
    derivation and may not be cited as if it were.

  reason: >-
    Raised as a medium-severity finding by Cursor Bugbot on PR #1371 and
    verified independently here before action, because the fix direction turns
    on which convention 0.886 sqrt(r) denotes and two readings differ by
    exactly sqrt(2).
    THE DECIDING EVIDENCE IS INTERNAL AND NUMERICAL. IDEA-20260922-1a081a, a
    sibling record generated in a lane that could not see 6cf862, derives the
    same correction and anchors it to IDEA-20260915-8fe0ef's own n = 17
    figures: 227 (negation-only) -> 55 (<tau,-1> classes). 227/55 = 4.127,
    while sqrt(17) = 4.123 and sqrt(2*17) = 5.831. The measured ratio is
    sqrt(n). That arithmetic was re-checked in this session and holds.
    NOTE ON A THIRD RECORD, RECORDED BUT NOT CORRECTED HERE: by the same
    reading IDEA-20260915-8fe0ef's own LABEL ("sqrt(2n) below the negation-only
    0.886 sqrt(r) row") is off by sqrt(2) while its FIGURES are right. That
    record is pre-existing, outside the batch this correction belongs to, and
    is deliberately left alone; IDEA-20260922-1a081a carries the observation.

  evidence_artifacts:
