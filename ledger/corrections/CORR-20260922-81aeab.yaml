#
# WHY A CORRECTION AND NOT AN EDIT. 6cf862 is a filed record on main (merged
# in PR #1371). AGENTS.md rule 2 is absolute: ledger records are immutable and
# corrections supersede, never overwrite. The lane that authored 6cf862 was
# asked to fix it in place and REFUSED on exactly this ground; the refusal was
# correct and the instruction was not. This record is the form the correction
# should have taken from the start.
#
# WHAT IS CORRECTED IS ONE CONVENTION, NOT THE RECORD. 6cf862's structural
# result -- that the subfield-rational factor base is structurally empty in the
