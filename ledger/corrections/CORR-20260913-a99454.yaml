correction:
  id: CORR-20260913-a99454
  recorded_at: '2026-09-13'
  recorded_by: coordinator
  goal_id: GOAL-SEMBIN-5078bc
  batch_id: BATCH-SEMBIN-20260913-9d649f
  produced_by: TASK-20260913-391a65
  archived_by: TASK-20260913-525e13

  corrects:
    - RUN-SEMBIN-1b9afe

  nature: >-
    REPAIRS A SCHEMA DEFECT IN A FRESHLY WRITTEN RUN MANIFEST, ADDITIVELY AND WITHOUT
    RERUNNING ANYTHING. No measured value changes, no control outcome changes, and no
    conclusion is drawn. The manifest of RUN-SEMBIN-1b9afe records every fact the run
    schema requires but records five of them under names or at locations
    tools/validate_ledger.py does not read, so the validator reported the run as missing
    required fields it in fact carries. The repair is a superseding companion record,
    manifest_v2.yaml, registered in tools/run_supersession_registry.yaml. Both records
    remain and both stay hash-pinned.

  context: >-
    RUN-SEMBIN-1b9afe is the EXP-SEMBIN-354a75 realized-yield measurement produced by
    TASK-20260913-4df669 and snapshot-archived by TASK-20260913-a10004 in commit
    40e1cf727. The manifest was written the same day, against the current schema. Its
    content is unusually complete -- six controls, six stopping rules evaluated, four
    unexpected observations, a declared deviation, and a full reproduction block -- which
    is why the defect is worth a record: this is not a thin manifest, it is a thorough
    one filed under the wrong field names.

  correction_1:
    subject: >-
      FIVE REQUIRED FIELDS WERE PRESENT IN SUBSTANCE AND ABSENT BY NAME.
    what_validate_ledger_reported: >-
      Six errors against
      experiments/EXP-SEMBIN-354a75/runs/RUN-SEMBIN-1b9afe/manifest.yaml: run missing
      required field 'status'; missing 'code'; missing 'environment'; missing 'inputs';
      missing 'result'; run.code.commit missing (not reproducible); run.code.command
      missing (not reproducible); and run.result.certificate.kind must be one of
      discrete_log|decomposition|none.
    what_was_actually_wrong:
      - >-
        `status` was recorded at `run.validity.status` (value completed_valid) with its
        reason beside it, not at `run.status` where RUN_REQUIRED_TOP looks.
      - >-
        `code` was split across `run.revision` (git_commit, git_branch, git_dirty and a
        full dirty-path list) and `run.command` (exact, working_directory, wrapper), so
        both code.commit and code.command read as missing while both were recorded.
      - >-
        `inputs` was recorded across `run.parameters` and `run.randomness`.
      - >-
        `environment` and `result` were left to companion files the manifest hash-pinned
        -- environment.json and raw-result.json -- rather than carried as manifest fields.
      - >-
        The certificate was at `run.certificate` with kind `none`, one level above
        `run.result.certificate` where certificate discipline reads it. So a correctly
        declared no-claim certificate was invisible to the check that exists to catch an
        undeclared claim.
    what_was_not_wrong: >-
      Nothing about the measurement. The run is `completed_valid`; all 180 configurations
      completed with exit code 0; every declared cell was enumerated exhaustively with an
      empty unreached list; all six controls returned their required outcomes. The
      reproducibility the schema was protecting is in fact present and is in fact bound:
      the commit is recorded, the dirty tree is enumerated path by path, and all twelve
      code files are hash-pinned in run.artifacts.code_sha256, so the run reproduces from
      the hashes independently of the commit.

  correction_2:
    subject: >-
      WHY THIS IS A SUPERSEDING RECORD AND NOT A BASELINE ENTRY.
    reasoning: >-
      tools/validate_ledger_baseline.txt grandfathers 1210 legacy errors by exact line
      match, and adding three lines to it would have turned these errors green in
      seconds. That would have been wrong. The baseline exists for records that PREDATE a
      rule and are immutable; this manifest was written on 2026-09-13 against the rule it
      violates. Suppressing a same-day violation in the file that suppresses historical
      ones switches the check off for precisely the case it exists to catch, and it does
      so invisibly, since a baseline entry looks identical whatever its date. The
      repository's own convention warns against exactly this move for corpus counts --
      never move a floor to turn a red test green -- and the same reasoning applies to an
      error baseline.
    what_was_done_instead: >-
      An `additive_schema_completion` entry in tools/run_supersession_registry.yaml, the
      mechanism this repository already uses for 71 manifests with the same class of
      defect. check_run() routes the schema check to the superseding record, while
      check_run_supersessions() keeps requiring that the superseded file still exists and
      still hashes to its registered value. Both records are therefore live and neither
      is editable.
    cost_stated_plainly: >-
      A package now has two manifests, and a reader who opens the wrong one first sees
      fields under two different names. manifest_v2 mitigates this by naming, for every
      field it supplies, the archived field the value came from, and by declaring that
      the archived record governs every field it already carries. It does not restate a
      single measured value -- a second copy of a number is a second thing to drift --
      and points at raw-result.json and per-R-counts.json instead.

  correction_3:
    subject: >-
      ONE FIELD IS DELIBERATELY DIFFERENT IN THE SUPERSEDING RECORD, AND IT IS NOT A
      SCHEMA MATTER.
    what: >-
      The archived manifest records
      `run.authority_boundaries_observed.write_scope_respected: true` and, in the same
      file, a declared deviation of kind `write_outside_declared_write_scope` for
      coordination/bus/messages/MSG-20260913-477ddd.yaml. Those two statements are in
      tension in the archived bytes.
    how_it_is_handled: >-
      manifest_v2 sets the field false and states the reason inline, pointing at the
      deviation block. It does NOT overwrite the archived claim, which stands as written
      and remains readable. This is a reading of a self-inconsistent pair of fields, not
      a new fact.
    why_it_matters_little_and_is_recorded_anyway: >-
      The write was one agent-bus message sent after every artifact was sealed, and the
      executor recorded it rather than concealing or deleting it, which is the right
      handling of the situation it found itself in -- a bus record is write-once and
      deleting one is the worse fault. The Coordinator has since committed, acked and
      published that message. The deviation affects no measurement. It is recorded here
      because a `write_scope_respected: true` that a reader could take at face value,
      sitting beside a declared out-of-scope write, is the kind of small inconsistency
      that an audit trail is supposed to surface rather than smooth over.

  what_this_correction_does_not_assert:
    - >-
      Nothing about whether the run's ratio-above-1 diagnosis is correct. That is
      TASK-20260913-31d530's independent review and it has not run. The diagnosis is
      committed unread on purpose.
    - >-
      Nothing about H-SEMBIN-c5b2e0. No hypothesis status moves here and no evidence
      record is written.
    - >-
      Nothing about any curve's security, at any parameter.
    - >-
      No claim that the four unexpected observations in the archived manifest are
      resolved. They are not restated in manifest_v2 precisely so that a reader must go
      to the archived record, where they are load-bearing: the specification annotation
      mismatch at cell (n15, m5, t3, k3), the Poisson shape failure at 7 of 9 cells where
      the matched null passes at every cell, the non-monotone shape deficit in t, and the
      chained presentation that never gains and loses on 648 of 360000 draws.

  forward_guidance: >-
    The defect is cheap to prevent and was not prevented, in a batch that had already
    written a similar manifest correctly: EXP-SEMBIN-92724f's RUN-SEMBIN-cbd770 manifest,
    written the same day by a sibling executor, validates cleanly. The difference is that
    one copied a canonical shape and the other invented a reasonable-looking one. Future
    executor handoffs in this goal should name a validating manifest to copy, and should
    require the producer to run
    `python3 tools/validate_ledger.py 2>&1 | grep <RUN-ID>` before reporting done. This
    was added to the TASK-20260913-495fcc dispatch for the Nagao costing run, which was
    launched after this defect was found.

  records_affected:
    - path: experiments/EXP-SEMBIN-354a75/runs/RUN-SEMBIN-1b9afe/manifest.yaml
      sha256: 7729836bca6fd513dd28ccbc0f5fdeac779f93b0641f04904ea7242836c03ca9
      disposition: superseded_for_schema_only; governs every field it carries; immutable
    - path: experiments/EXP-SEMBIN-354a75/runs/RUN-SEMBIN-1b9afe/manifest_v2.yaml
      disposition: new superseding record; schema-checkable; asserts no new fact
    - path: tools/run_supersession_registry.yaml
      disposition: one additive_schema_completion entry appended

  citations:
    - ref: AGENTS.md core rule 4
      provenance: internal
      what: >-
        Results are immutable records; corrections create new records. This is why the
        manifest was not edited in place even though it is hours old and the edit would
        have been three field renames.
    - ref: AGENTS.md "Artifact policy"
      provenance: internal
      what: >-
        The list of what every run must retain -- exact command, commit and dirty state,
        environment and dependency versions, parameters and seeds, inference policy and
        resolved model, stdout and stderr, raw results, validity status and reason,
        timestamps and resource measurements. The archived manifest satisfies all of it;
        the defect is where the fields sit, not what they contain.
    - ref: tools/run_supersession_registry.yaml
      provenance: internal
      what: >-
        71 prior additive_schema_completion entries, which establish this as the
        repository's existing mechanism rather than a new one invented here.
    - ref: experiments/EXP-SEMBIN-92724f/runs/RUN-SEMBIN-cbd770/manifest.yaml
      provenance: internal
      what: >-
        A same-day sibling manifest under the same batch that validates cleanly, which is
        the evidence that the schema was reachable and the divergence avoidable.
