  why_this_is_a_new_class_of_incident_for_this_lane: >-
    Every prior out-of-band incident this lane disclosed touched a
    proposal, hypothesis narrative, or ledger status field -- never a
    FROZEN, ALREADY-DISPATCHED experimental specification.yaml mid-run.
    docs/task-lifecycle.md and .claude/skills/run-experiment/SKILL.md are
    explicit and absolute on this point: "After approval the protocol is
    frozen. Any later change requires a versioned protocol_amendment...
    never an edit of the frozen prediction, and never a silent re-scoring
    of completed runs against a new one." This edit violates that rule
    regardless of the edit's own content correctness, because it broke
    the correspondence between the specification that authorized
    dispatch and the specification an outside reader would find on the
    branch afterward -- exactly the failure mode the freeze rule exists
    to prevent.

  content_assessment_this_edit_is_verified_correct: >-
    UNLIKE CORR-20260831-ca3ec5 (independently verified WRONG) and LIKE
    CORR-20260831-f6e70f (independently verified CORRECT), this
    Coordinator independently re-derived the underlying mathematics from
    first principles rather than trusting the commit's own message: v1's
    group-uniform sampler construction genuinely overweighted 2-torsion
    points by exactly 2x relative to generic points (unconditional
    acceptance vs. a fair coin-flip split) and never actually drew the
    point at infinity despite the surrounding prose claiming it did --
    both confirmed independently against the Executor's own disclosed
    protocol_deviation in execution_report.yaml, which reported the exact
    same missing-infinity defect from a different angle (implementing v1
    faithfully). The replacement 2p+1-slot rejection-sampling
    construction is verified, by direct counting of accepting slots
    against the group's N points, to draw every point with probability
    exactly 1/N. Full derivation: experiments/EXP-MONO-cb905d/amendments/v1.yaml
    `independent_content_verification`.

  disposition: >-
    NOT ADOPTED BY SILENT ACCEPTANCE OF THE IN-PLACE MUTATION, regardless
    of verified correctness -- a frozen, already-dispatched contract is
    never edited in place under this program's rules, and the fact that
    a fix happens to be correct does not retroactively make an
    unauthorized in-place edit the proper vehicle for it. Instead:
    (1) the verified-correct fix is re-filed under this Coordinator's own
    authority as a proper versioned protocol_amendment
    (experiments/EXP-MONO-cb905d/amendments/v1.yaml, base version 1 to
    resulting version 2); (2) RUN-MONO-cb905d-1, which executed against
    v1's biased construction (confirmed by the Executor's own disclosed
    deviation), has its Part A measurements downgraded to
    not_evidentially_usable for H-MONO-1d50ac's Part-A question --
    reported as an apparatus/construction defect per AGENTS.md rule 3,
    never as negative mathematical evidence; its Part B measurements
    (transversal-only, unaffected by this defect) remain valid
    exploratory context; (3) a corrected re-run (RUN-MONO-cb905d-2) is
    authorized via handoff TASK-20260831-52f3df to actually answer Part
    A's headline question. H-MONO-1d50ac's status is UNCHANGED by this
    record alone (remains proposed_instrument_underexplored_single_cell_inconclusive)
    pending that corrected re-run and its own independent review.

  reason: >-
    AGENTS.md rule 4 (immutability; corrections supersede, never
    overwrite) and this lane's own established sixteen-incident
    disclosure practice require this filed as a correction regardless of
    the edit's correctness, because the PROCESS violation (editing a
    frozen, dispatched contract in place, breaking dispatch-vs-execution
