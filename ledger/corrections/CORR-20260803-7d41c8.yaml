correction:
  id: CORR-20260803-7d41c8
  recorded_at: '2026-08-03'
  record_type: claim
  record_id: RC-9-NEVER-RUN-PREMISE
  field: prior_measurement_status_of_the_yoyo_round_profile_below_r5
  decided_by: coordinator

  prior_value:
    red_team_RC_9_status: "NEVER RUN, and never previously named by any reviewer."
    red_team_supporting_claim: >-
      "Every yoyo claim in five batches rests on a monotone r-profile that has
      been measured only on one side of its peak" and "The only reading below
      r=5 is r=2 at 100% (BATCH-002 arm_PC), three rounds away."
    coordinator_batch_008_objective: >-
      "THE BATCH-005 RED TEAM NAMED A ONE-MINUTE MEASUREMENT THAT CAN FALSIFY
      FIVE BATCHES OF WORK, AND NOBODY HAS EVER RUN IT... Nobody has measured
      r=3 or r=4."
    coordinator_commit_message_e41a4871: >-
      "the red team's RC-9 and RC-10 -- the two cheapest measurements in this
      campaign that can falsify rather than confirm"

  corrected_value:
    r3_and_r4_were_already_measured: true
    where: >-
      coordination/goals/GOAL-AES-003/batches/BATCH-006/tasks/TASK-20260803-0764fc/runs/
      A2-R4-K1.json (r=4), A1-R4-MAIN.json (r=4), A3-R3-MAIN.json (r=3),
      A4-R2-MAIN.json (r=2). Committed in the BATCH-006 ledger archive 0a7b9e42.
    the_decisive_one: >-
      A2-R4-K1 is r=4 at amask 1, smask 1, sbox aes, seed 531001, armid 1,
      log2N=30 -- D-AES-K1's parameters in every field except rounds, which is
      EXACTLY the pairing RC-9 specified, at 2^30 rather than the 2^22 RC-9
      proposed. It reads W_ge1_nontrivial = 1073741824 of 1073741824, i.e.
      saturated at rate 1.0, with W_ge1_by_word = [0, N, N, N].
    consequence_for_rc9: >-
      RC-9 as executed in BATCH-008 is a REPLICATION AT A SECOND EXPOSURE, not a
      first measurement. Its scientific value is real but smaller than the batch
      objective claimed.

  who_erred_and_how: >-
    BOTH THE RED TEAM AND THE COORDINATOR, INDEPENDENTLY, AND THE COORDINATOR'S
    ERROR IS THE WORSE ONE. The BATCH-005 red team reviewed BATCH-005 and
    BATCH-004 material; the r=3 and r=4 arms are in BATCH-006, which its card
    did not put in its read scope, so its claim was made outside its evidence
    rather than against it. The Coordinator had no such excuse: BATCH-007's own
    objective, written by the Coordinator, cites the BATCH-006 validator's
    null-object control from that very run directory. The Coordinator restated
    a reviewer's absence claim as established fact, in a batch objective and in
    a pushed commit message, without opening the directory that refutes it.

  how_it_was_caught: >-
    BY THE PRODUCER, UNPROMPTED, AND IT IS RECORDED THAT WAY. The executing
    Executor read the BATCH-006 runs before writing its preregistration,
    reported the premise as false, and disclosed the resulting non-blindness as
    deviation D-4 rather than quietly inheriting the framing it had been given.
    The card had told it the measurement had never been run; it checked anyway.

  the_generalisable_lesson: >-
    A CLAIM OF ABSENCE IS NOT CHECKED BY REPRODUCTION. This is the second time
    in two days this exact failure has been recorded in this campaign -- see
    CORR-20260803-c92db5, where the Coordinator claimed the PRP null had never
    been measured and arm_A3/arm_A3b refuted it. A false positive is caught when
    someone re-runs it and gets a different number. A false claim that something
    was never measured produces no number to disagree with, survives every
    reproduction check, and is refuted only if someone goes looking in a place
    the claim implied was empty. Absence claims in this campaign must from here
    cite the directories actually searched.

  what_does_not_change: >-
    NO MEASUREMENT, STATISTIC OR INTERVAL IN BATCH-008 IS AFFECTED. Every number
    the batch produced stands exactly as measured; the r=4 and r=3 readings agree
    with the BATCH-006 arms rather than conflicting with them, which is
    corroboration and is reported as such. RC-10 and the v2-to-v3 equivalence
    proof are untouched by this correction: RC-10's premise -- that the analytic
    null 4*2^-32 had never been checked against measurement -- was NOT falsified
    by the BATCH-006 arms and remains correct as stated.

  also_corrected_in_the_same_direction: >-
    The framing "the statistic PEAKS at r=5" is not supported and is withdrawn.
    With r<=4 saturated at rate 1.0, r=5 is simply the last round count with a
    sub-saturated but above-null reading. The profile is non-increasing across
    every round measured (r=2,3,4 at 1.0; r=5 at 14.0x; r=6 at ~0.5x; r=10 at
    1.0x), so there is no interior maximum and "peak" names nothing. The red
    team's underlying worry -- that a monotone profile measured on one side only
    could hide a probe-geometry artifact -- was well posed; the falsifier simply
    did not fire, and could not have, since the relevant arms already existed.

  status_effects:
    hypothesis_status_changed: false
    evidence_strength_changed: false
    claim_tier_changed: false
  edits_are_additive_or_schema_only: true
  affects:
    - GOAL-AES-003 BATCH-008 dispatch_queue.json objective text
    - commit e41a4871's message
    - BATCH-005 red_team_report.yaml required_controls RC-9 status field
  verification: >-
    Read A2-R4-K1.json and A3-R3-MAIN.json directly and compare rounds, amask,
    smask, seed, log2N, key_hex and W_ge1_nontrivial against D-AES-K1. A2-R4-K1
    carries key_hex bdf3823182ad657dab3d556b3886ba72, the same derived key as
    D-AES-K1, confirming the pairing rather than merely the parameters.
  supersedes: null
  superseded_by: null

