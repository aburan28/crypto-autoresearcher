  field: multiple (see per_record below)
  prior_value: as filed in commits 84d765f2a / 61f8062e5 / 7fb367034
  corrected_value: >-
    See per_record. NO FILED PROPOSAL IS EDITED BY THIS RECORD. Per AGENTS.md
    rule 4 and the /propose-ideas rule "never overwrite an existing proposal
    file", the proposals stand exactly as filed and this correction supersedes
    the specific claims named below.

  context: >-
    The 2026-08-08 bulk ideation round filed 118 proposals. The Coordinator's
    dedup corpus (KNOWLEDGE_BARRIERS.txt) had an extraction defect that blanked
    five barrier entries, so an independent adversarial re-screen was dispatched
    over the 15 proposals touching the two on-topic recovered barriers
    (KN-FIND-006, KN-FIND-a8990a). The re-screen cleared 13 of 15 against those
    barriers, but found two substantive defects that the barrier defect does NOT
    explain, plus two records needing a discrimination note. Both substantive
    defects were independently re-verified by the Coordinator before this record
    was written; neither is accepted on the reviewer's word alone.

  per_record:

    IDEA-20260808-2e14f7:
      verdict: DUPLICATE_AND_MECHANISM_REFUTED
      do_not_dispatch: true
      finding_1_duplication: >-
        Duplicates IDEA-20260807-fed641, a record that WAS fully visible in the
        dedup corpus (EXISTING_PROPOSALS.txt) and that 2e14f7's own
        novelty_screen claims to have read. fed641 section (C) already computes
        the degree-n>2 coarse-coordinate trade in both the Galois case (gain
        capped by |Aut| <= 6) and the non-Galois case (deg_t S_m^f = n^{m-1},
        strictly worse than n=2 for every n), and already states the governing
        refutation: the rational count is governed by the RATIONAL DECK ORDER,
        not by the map degree. 2e14f7's discriminated_from mischaracterises that
        lane as covering "degree-2 maps only".
      finding_2_mechanism_refuted: >-
        The record's central mechanism -- that a degree-d coordinate map yields
        d times the factor-base points per unit of window budget -- is false.
        The expected number of rational points in a fibre of a transitive
        degree-d cover is the number of Frobenius orbits, which averages to 1
        for every d (Burnside). The record's HA-1 cites Chebotarev as its
        rigorous ingredient; Chebotarev gives the opposite of what HA-1 asserts.
      coordinator_independent_verification: >-
        Re-derived from scratch by the Coordinator, not taken from the reviewer.
        Counting rational points of y^2 = x^3 + ax + b over an x-window of size
        B = 800 (each x contributes 2 points if the RHS is a nonzero square, 1
        if zero, 0 if a non-square): p=50021 gave 826 points (ratio 1.0325),
        p=10007 gave 796 (ratio 0.9950), p=99991 gave 812 (ratio 1.0150). The
        mechanism predicts ratio 2.0000 at d=2. It fails at its OWN
        known-answer calibration point, which is the strongest possible form of
        this refutation. The reviewer independently measured |V|/|W| = 1.019
        (d=2 x-map) and 1.013 (d=3 y-map) at p=50021, B=800, consistent.
      disposition: >-
        The proposal remains filed and unedited as an immutable record of what
        was proposed. It must NOT be dispatched to /design-experiment. Any
        future record reaching for a coarser-coordinate factor-base gain must
        cite this correction and fed641 section (C).

    IDEA-20260808-481e07:
      verdict: HEADLINE_CLAIM_REFUTED_RESIDUE_SURVIVES
      do_not_dispatch_as_filed: true
      finding: >-
        The record claims the ideal-theoretic solution count exceeds the
        group-decomposition count by a uniform factor 2^{m-1}. On the generic
        stratum the map is a bijection -- exactly one sign vector realises R --
        so the factor is 1, not 2^{m-1}. The reviewer measured 30 cells
        (p in {101,211,307}, B in {18,24}, m in {2,3}, 5 seeds): ratio 1.000 in
        15 of 15 m=2 cells against a predicted 2, and 1.000 in 11 of 15 m=3
        cells with 1.04-1.31 elsewhere against a predicted 4 (4112 ideal vs
        4366 group solutions, overall 1.062).
      surviving_residue: >-
        A correction IS present but it is stratum-driven and small, not a
        uniform 2^{m-1}. The narrowest supported statement is an audit plus an
        OPEN per-stratum ratio. The record's own HA-1 bounds the degenerate
        strata at O_m(1/B); measured excess of 4-31% at B=18 shows the
        degenerate contribution is not negligible at reachable toy sizes, i.e.
        worse than the record's own stated weakest point estimates.
      scope_error: >-
        The record transports KN-FIND-a8990a's 2^{m-1} from the fibre degree in
        the LAST variable to the solution count of an ideal in m variables. The
        cited theorem does not license that transport.

    IDEA-20260808-093497:
      verdict: CONFOUNDER_LIST_CARRIES_THE_REFUTED_CLAIM
      severity_note: >-
        This is the only record carrying the defect that is filed at
        recommended_priority: high, which is why this correction exists rather
        than a note for a later session.
      finding: >-
        The refuted 2^{m-1} correction factor from IDEA-20260808-481e07 has
        propagated into this record's confounder list. The confounder as stated
        is not established in either direction; with the factor wrong by 2-4x,
        the record's claimed degree shift of "at most one degree" is
        unsupported both ways.
      not_affected: >-
        The record's PRIMARY claim -- the prime-field semi-regular null
        d_reg = ceil((m(B-1)+D_S)/2) -- is NOT affected by this correction and
        was independently re-derived by the Coordinator (m-fold uniform-box
        convolution, symmetric about m(B-1)/2 and unimodal; first non-positive
        coefficient at 2d >= m(B-1)+D_S). The reviewer separately confirmed the
        record honestly flags its HA-1 as conjectural, validated only at
        B <= 16, p <= 16411, with no crypto-scale route claimed -- the correct
        disposition under AGENTS.md rule 7.

    IDEA-20260808-f104a2:
      verdict: NOVEL_BUT_NEEDS_DISCRIMINATION
      required_discriminated_from_text: >-
        Distinct from KN-FIND-006 in scheme (MAYO, not Semaev/Weil-descent) but
        subject to the same standing methodological verdict: claim (A) states
        the deficit is a function of k alone, i.e. bounded in n, and KN-FIND-006
        already establishes that a bounded deficit yields no asymptotic
        leverage. The record should sweep n, not k -- MAYO's k is fixed by
        specification, so the decay parameter is the system size, which the
        record never varies.

    IDEA-20260808-9ef88c:
      verdict: NOVEL_BUT_NEEDS_DISCRIMINATION
      required_discriminated_from_text: >-
        The record claims to be "the first computable violation of the
        semi-regular null in this lane". KN-FIND-006 is already one:
        deficit(4) = 8k-1 exact, with the null measured at 0. The claim should
        be scoped to the specific system class the record addresses.

  additional_findings_not_requiring_record_correction:
    - >-
      IDEA-20260808-11b8c7 misquotes KN-FIND-a8990a's NULL-B rate: 48.9% is the
      OBEY rate, so the rejection rate is 51.1%. It also calls the support-null's
      zero deficit "by construction" where KN-FIND-006 records it as MEASURED.
    - >-
      IDEA-20260808-b188d0 prediction 3 treats KN-FIND-006's 8k-1 as possibly
      derivable from the last-fall-degree literature; KN-FIND-006 states it is
      measured-exact over k=3..7 and NOT derived, and records two refuted
      derivation hypotheses. Expect a null there.
    - >-
      IDEA-20260808-fc5e3e's zero-compute premise is wrong: KN-FIND-006 records
      rank deficits, not the k-degree row profiles that crossbred admissibility
      requires. Its separate point -- that published F4-at-first-fall costings
      omit memory -- stands independently.
    - >-
      IDEA-20260808-ec2128 cites the DAMAGED barrier file as evidence for a
      negative. The conclusion happens to be true but is unsupported as stated.
    - >-
      IDEA-20260808-6a2b50 must decide homogeneous vs inhomogeneous before any
      frame battery: graded Macaulay rank is frame-invariant for homogeneous
      systems, making the claim a no-op against KN-FIND-006's numbers in that case.

  corpus_defect_count_correction: >-
    SUPERSEDES the count given in commit 61f8062e5, which said FOUR barrier
    entries were blanked by the KNOWLEDGE_BARRIERS.txt extraction defect. The
    correct count is FIVE. Commit 7fb367034 already carried this correction;
    it is restated here so the ledger records it independently of the git log.
    The five: KN-FIND-006, KN-FIND-720727, KN-FIND-860118, KN-FIND-a8990a,
    KN-TECH-057. The reviewer additionally measured that 19 of 118 proposals
    touch KN-TECH-057's ground (isogeny path-finding full-cost baselines), of
    which 12 cite it anyway and 7 do not.

  mitigating_measurement: >-
    The blast radius of the barrier defect was smaller than feared: 8 of 118
    proposals cite KN-FIND-006 and 5 cite KN-FIND-a8990a, several quoting their
    internals correctly, because six generators went around the damaged corpus
    into knowledge/findings/ directly. Against the two recovered barriers
    specifically, 13 of the 15 assigned proposals are novel and NONE is a
    duplicate of either barrier.

  finding_about_a1f3c2_vs_a8990a: >-
    KN-FIND-a8990a adds four constraints over the previously-visible
    KN-FIND-a1f3c2, most importantly the non-collision step that
    CORR-20260807-652652 records a1f3c2 as having skipped -- so a1f3c2 alone was
    never a sound barrier on its own. No verdict in this correction changes as a
    result, since no proposal in the batch proposes a summation-fibre census or
    an m >= 4 discriminant statistic.

  reason: >-
    An independent adversarial re-screen (red-team) found two substantive
    defects in filed proposals, one of them inside a recommended_priority: high
    record. Both were independently re-verified by the Coordinator against
    first-principles computation before this record was written. Recording
    rather than editing, per AGENTS.md rule 4 (immutable records; corrections
    supersede, never mutate) and the /propose-ideas rule against overwriting an
    existing proposal file.

  limitations:
    - >-
      EXTERNAL NOVELTY IS UNADJUDICATED for every record named here, including
      KN-FIND-a8990a itself, which records eprint.iacr.org returning 403 and
      states its own novelty is not adjudicated. WebSearch and WebFetch failed
      for every agent in this session. Nothing in this correction speaks to
      whether any proposal is novel against the published literature.
    - >-
      The reviewer's 481e07 counterexample counts F_p-points set-theoretically,
      which is what that record says it means and what a Macaulay corank sees.
      If a future reader intends scheme-theoretic degree with multiplicity, that
      distinction is what would settle any residual disagreement.
    - >-
      This correction adjudicates only the 15 proposals assigned to the
      re-screen. The remaining 103 proposals of the 2026-08-08 round have NOT
      been adversarially re-screened against the recovered barriers.

  evidence_artifacts:
    - ideas/rescreen-20260808/RESCREEN.md
