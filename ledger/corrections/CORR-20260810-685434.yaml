  prior_value: >-
    CORR-20260810-308774's required_action named exactly two items: (1) a
    provably collision-free auxiliary-tuple construction, replacing
    auxiliary_k_rule_frozen; (2) an assessment (not necessarily a fix in
    the same way) of the shell-count tolerance, C0=1 threshold tie, and
    "whether the f_E=1 gap requires an extended or different
    C2-congruence-ladder rule" -- i.e., framed the f_E finding as a
    QUESTION OF WHICH PRIMES/TWISTS TO PICK.
  corrected_value: >-
    INDEPENDENT VALIDATOR AND RED TEAM REVIEW, DISPATCHED AFTER
    CORR-20260810-308774 WAS FILED, BOTH FOUND THE REQUIRED SCOPE IS
    LARGER, AND THIS COORDINATOR INDEPENDENTLY CONFIRMED THE MOST
    CONSEQUENTIAL OF THEIR FINDINGS BEFORE ACCEPTING EITHER REPORT'S WORD.
    Full reports:
    coordination/goals/GOAL-ENDO-001/batches/BATCH-74ebef/execution/EXP-CANL-96b0ad/{validation_report.md,redteam_report.md}.

    FINDING A (Red Team, MAJOR, independently confirmed by this
    Coordinator both mathematically and computationally). The f_E>1
    finding is very likely an ARTIFACT OF WHICH RING IS BEING MEASURED,
    not a fact about End_{F_p}(E) itself, and reframes item (2) above
    entirely: no choice of C2-congruence prime or twist would have avoided
    it, because the bug is not in which curve is selected. Argument,
    independently re-derived by this Coordinator before accepting it: for
    a j=0 curve at p = 1 (mod 3), the automorphism (x,y) -> (mu*x,y),
    mu^3=1, is F_p-rational, so Z[mu] subset End_{F_p}(E). Z[mu]'s minimal
    polynomial x^2+x+1 has discriminant -3, a FUNDAMENTAL discriminant, so
    Z[mu] IS ALREADY the maximal order of Q(sqrt(-3)); an order containing
    the maximal order cannot be a proper suborder of it, so
    End_{F_p}(E) = Z[mu] exactly -- f_E = 1 is FORCED, unconditionally,
    regardless of which sextic twist or which p = 1 (mod 3) is chosen.
    This is not merely asserted: G3's own tautology gate (1000 sampled
    points per prime, 4 primes, 4000 points total, 100% pass) is exactly
    the constructive check that mu genuinely acts as claimed. What
    `harness/isogeny_class.py:frobenius_discriminant` computes is
    disc(Z[pi]) -- the order generated by FROBENIUS ALONE -- which can be
    (and here, is) a proper suborder of End_{F_p}(E) whenever an
    additional automorphism like mu is present and not itself a power of
    pi in the relevant sense; this is exactly the genericity assumption
    that fails at j=0/j=1728 by construction, not at other j-invariants.
    The executor's own exhaustive twist check (implementation.md,
    confirmed by this Coordinator against `frobenius_discriminant`'s
    definition directly) is fully consistent with this: it shows f_E>1
    for Z[pi] on EVERY twist, because Z[pi] never sees mu regardless of
    twist, not because the true ring varies by twist.

    THIS COORDINATOR PERFORMED THE FREE RE-ANALYSIS RED TEAM RECOMMENDED
    (zero new runs, direct calls to already-committed harness/exp_canl.py
    functions with substituted arguments) BEFORE ACCEPTING FINDING A:
    recomputed `lambda_of_w`/`lambda_reduce` at all four c2-congruence
    primes (1009, 10009, 100003, 1000003) with (D_E=-3, f=1) in place of
    each curve's realized (D_E, f_E) -- every value is well-defined and
    nonzero (no gcd(f,N) failure, since gcd(1,N)=1 trivially), unlike the
    realized-order computation which uses a different D_E per prime
    (-192, -6912, -588, -12) despite the class-number-one list intending
    ALL FOUR to test the SAME discriminant D0=-3. Recomputed
    `shell_enumerate(-3, C0, -3, 1)` for C0 in {1,2,3,5,8}: relative error
    against the predicted 2*pi*C0^2/sqrt(3) is 0.34% at C0=5 and 3.80% at
    C0=8 -- both comfortably inside the contract's 15% tolerance, in
    contrast to the realized-order computation's own reported failures
    (19.9%, 17.5%) at exactly these kinds of cells. This is consistent
    with, though does not by itself prove, Finding A being the correct
    fix: computing the shell at the TRUE (small) discriminant -3 rather
    than the artificially inflated realized D_E (as large as -6912)
    behaves as the asymptotic formula predicts it should.

    FINDING B (Validator F4, MAJOR, new). The contract's own required,
    blocking `certificate_semantics` clause (c) -- a 1% independent
    re-derivation of every exact reachable-count cell by a second,
    separately-written reducer -- is implemented
    (`harness/exp_canl.py:spot_check_reachable`) but is NEVER CALLED
    anywhere in `harness/run_canl.py`. No reachable-count number in
    RUN-CANL-78b8bd has actually cleared this required check; the
    execution report's completion-gate checklist states otherwise by
    conflating it with the (correctly executed) tautology-certificate
    re-verification, which is a different check on a different quantity.

    FINDING C (Validator F5, MAJOR, new, and connected to Finding A). The
    reachable-count computation hard-codes the halved slot count
    `s = r_Z//2+1`, which assumes r_Z = 2*r_O -- H-CANL-e59a06's own STEP
    1 states this is AUTOMATIC only for maximal O and OPEN for
    non-maximal O (f_E > 1), exactly the case every realized C2 curve in
    this run falls into per the (uncorrected) realized-order computation.
    If Finding A is right and the true order is maximal (f_E=1) for every
    tested curve, this specific inconsistency resolves as a byproduct of
    the same fix, since projectivity becomes the automatic case rather
    than the open one -- but this must be verified, not assumed, once
    Finding A's fix is implemented.

    FINDING D (Validator, section 9, new). The D1 design choice (one
    aggregated run/verdict for the whole grid, not one per prime) creates
    a structural risk for the NEXT dispatch: a single anomalous cell in a
    otherwise-clean rerun could route straight to `C1_REFUTED_REOPEN` or
    `C2_GAIN_EXCESSIVE` (the maximal-escalation, rule-12 review-breakthrough
    states) with no route to a "preliminary, one dissenting prime named"
    outcome the frozen contract's own evidence_strength_calibration_frozen
    text was written to allow. Does not affect RUN-CANL-78b8bd's own
    (INSTRUMENT_INVALID) terminal states, but must be addressed before a
    second dispatch risks an under-powered escalation.

    BOTH REVIEWS INDEPENDENTLY CONFIRMED THE DUAL-AUXILIARY-TUPLE FINDING
    CORR-20260810-308774 ALREADY MADE, AGAINST THE RUN'S OWN ACTUAL DATA,
    NOT MERELY THE ILLUSTRATIVE EXAMPLE: the Validator traced the run's
    actual disagreeing cell (p=101, C0=1, r_Z=2, weights [2,1] vs [3,1],
    7 vs 9 achievable sums) and confirmed it matches the root cause
    exactly. That finding stands unchanged; this correction extends,
    it does not revise, that part of CORR-20260810-308774.
  why_this_still_does_not_authorize_a_new_dispatch: >-
    Nothing here changes RUN-CANL-78b8bd's own terminal states
    (C1_INSTRUMENT_INVALID, C2_INSTRUMENT_INVALID), which both independent
    reviews confirm were computed correctly by the frozen decision rule
    given its actual inputs. What changes is the required SCOPE of the v2
    protocol_amendment before any second dispatch: CORR-20260810-308774's
    original two items (auxiliary-tuple redesign; tolerance/threshold
    review) are necessary but not sufficient. A v2 amendment must also fix
    how D_E/f_E is computed for j=0 (and, by the same argument, j=1728)
    curves specifically (Finding A), wire in the required spot-check
    (Finding B), verify or fix the slot-count/projectivity assumption for
    non-maximal orders once Finding A's fix is applied (Finding C), and
    address the D1 aggregation-granularity risk before a clean rerun could
    land on a maximal-escalation state without the calibrated majority
    structure the contract intends (Finding D).
  required_action:
  - >-
    A v2 protocol_amendment to EXP-CANL-96b0ad must address all of:
    Finding A (compute D_E/f_E for j=0/j=1728 curves from the
    automorphism-forced maximal order, not from frobenius_discriminant
    alone, when p = 1 (mod 3) for j=0 or p = 1 (mod 4) for j=1728), the
    original dual-auxiliary-tuple construction (CORR-20260810-308774),
    Finding B (wire spot_check_reachable into run_canl.py's actual
    execution path), Finding C (re-verify the slot-count/projectivity
    assumption once Finding A lands), Finding D (a per-prime or
    per-cell verdict granularity that preserves the contract's own
    "preliminary, dissenting cell named" outcome path), and the
    tolerance/threshold-tie review CORR-20260810-308774 already named.
    Not drafted by this correction.
  - >-
    Before drafting that amendment, independently confirm Finding A
    against at least one concrete curve computation this Coordinator's
    free re-analysis did not attempt (e.g. an explicit isogeny or division-
    polynomial check that mu genuinely generates an index-1 suborder, not
    merely the tautology gate's constructive-but-indirect evidence), since
    this Coordinator's own confirmation here is a strong but not exhaustive
    check (a formula recomputation and an asymptotic-error comparison, not
    a from-scratch endomorphism-ring computation).
