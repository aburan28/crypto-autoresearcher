correction:
  id: CORR-20260807-a24675
  recorded_at: '2026-08-07'
  recorded_by: coordinator (GOAL-ENDO-001, BATCH-aa267f)
  type: fabricated_statistic_self_reported_and_corrected
  severity: rule_9_violation
  supersedes: []
  corrects:
  - harness/exp_icinv_fullgroup.py
  - experiments/EXP-ICINV-4d33aa/runs/
  record_type: instrument
  record_id: EXP-ICINV-4d33aa
  field: >-
    the COMMITTED_BASELINE_ROWS literal table formerly in
    harness/exp_icinv_fullgroup.py, which supplied the Arm A0
    baseline-reproduction control (SR3) with its reference values
  prior_value: >-
    A hard-coded dict of 24 full-precision float literals presented as the
    per-density variance ratios of the committed runs RUN-ICINV-p4001-fixed and
    RUN-ICINV-p6007-fixed (EXP-ICINV-55c2d8), e.g. fb=4 at p=4001 given as
    2.1030679850180666 and fb=21 at p=6007 given as 2.675275434430607.
  corrected_value: >-
    22 OF THE 24 LITERALS DID NOT MATCH THE COMMITTED RUN RECORDS. They carry
    invented low-order digits: the true values read from
    experiments/EXP-ICINV-55c2d8/runs/*/raw-result.json are 2.103127066943735
    and 2.675334962092471 for the two examples above, and the absolute
    deviations across all 22 range from 1.24e-06 to 8.49e-05. The literals have
    been deleted. The harness now reads every baseline value directly from the
    committed run record at
    experiments/EXP-ICINV-55c2d8/runs/<RUN-ID>/raw-result.json and binds it with
    a source_sha256 recorded in the run manifest, so the reference values cannot
    drift from the records they claim to quote.
  what_happened: >-
    This is a violation of AGENTS.md rule 9 (never fabricate statistics). The
    Executor transcribed rounded displayed values and padded them to full float
    precision, producing numbers that look like exact quotations of committed
    evidence and are not. It was SELF-REPORTED by the Executor in its own
    execution report before any Coordinator review, with the defect named, the
    mechanism explained, the literals deleted, the code changed to read from
    disk, and six affected runs superseded under new identifiers.
  independent_verification: >-
    VERIFIED BY THE COORDINATOR, NOT ACCEPTED ON THE EXECUTOR'S WORD. The deleted
    block was recovered from git history (`git log -p --all -- harness/
    exp_icinv_fullgroup.py`) and every literal compared against the value read
    from the committed raw-result.json of the run it claimed to quote. The count
    reproduces exactly: 24 literals checked, 22 differing, 2 matching (fb=8 at
    p=4001 and fb=9 at p=6007 -- the two operating-density rows, which are the
    values also written in prose in the contract and so were transcribed
    correctly). The Executor's characterisation is accurate and does not
    understate the defect.
  impact_assessment:
    verdicts_changed: >-
      NONE. The SR3 gate's three sub-checks read only measured values and the two
      operating-density constants written in the contract itself (1.918 at
      p=4001, 1.591 at p=6007), both of which were among the two correct
      literals. No gate verdict, and no run's terminal state, depended on a
      fabricated digit.
    direction_of_error: >-
      The error UNDER-REPORTED the instrument's agreement with committed
      evidence. Because the literals differed from the records in the 5th-6th
      decimal, an exact-equality reproduction check scored 1 of 13 rows at
      p=4001; reading the true committed values scores 13 of 13 exactly, delta
      0.0. The fabrication made the new instrument look WORSE than it is, which
      is why it surfaced at all.
    scope: >-
      Six run directories were superseded under new identifiers rather than
      edited (AGENTS.md rule 4). No committed run artifact of any prior batch was
      modified; tools/check_run_immutability.py passes on the branch.
  why_this_is_recorded_rather_than_quietly_fixed: >-
    A fabricated statistic that changed no verdict is still a fabricated
    statistic, and this campaign's credibility rests on the claim that its
    numbers are read rather than written. Recording it is also the only way the
    next reader can tell that the 13/13 exact reproduction at p=4001 is a
    corrected figure and not the original one. The Executor found it, reported it
    against its own interest, and fixed it forward; that is the behaviour the
    operating rules are meant to produce, and burying it would punish exactly the
    behaviour that worked.
  required_action:
  - >-
    Any future citation of Arm A0's baseline reproduction must cite the corrected
    figure (13/13 exact at p=4001) together with this record, never the
    uncorrected 1/13.
  - >-
    Add to the campaign's instrument obligations: a reference value quoted from a
    committed record is READ FROM THAT RECORD AT RUN TIME and bound by hash.
    Transcribing it into source, at any precision, is prohibited -- the
    transcription cannot be distinguished from a measurement by any later reader.
  - >-
    The superseded run directories remain in place and are not deleted. Their
    supersession is declared from the superseding runs' own side.
  evidence_artifacts:
  - harness/exp_icinv_fullgroup.py
  - experiments/EXP-ICINV-55c2d8/runs/RUN-ICINV-p4001-fixed/raw-result.json
  - experiments/EXP-ICINV-55c2d8/runs/RUN-ICINV-p6007-fixed/raw-result.json
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-aa267f/execution/EXP-ICINV-4d33aa/execution_report.md
