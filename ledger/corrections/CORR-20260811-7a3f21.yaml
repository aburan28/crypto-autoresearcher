correction:
  id: CORR-20260811-7a3f21
  recorded_at: '2026-08-11'
  recorded_by: coordinator (GOAL-ENDO-001, BATCH-aeeb17)
  type: non_discriminating_gate_declared_as_a_halting_gate_in_a_coordinator_artifact
  severity: >-
    major_forward_looking_no_measurement_invalidated -- nothing has been
    measured under this question, so no run, evidence record or conclusion is
    affected. The correction is filed precisely BECAUSE nothing has run yet: the
    gate as written would have sent an Executor to spend a contract on a test
    that cannot discriminate.
  supersedes: []
  corrects:
  - ledger/questions/RQ-RAYCL-3985f4.yaml
  record_type: research_question
  record_id: RQ-RAYCL-3985f4
  field: >-
    constraints[0] -- "THE HARD GATE COMES FIRST AND IS ELEMENTARY", the
    requirement that the counting identity #X_m = #Cl_m(O) be checked by
    independent enumeration before any reduction claim is believed, and that a
    mismatch HALTS this line.
  prior_value: >-
    "THE HARD GATE COMES FIRST AND IS ELEMENTARY. Before any reduction claim is
    believed, the counting identity #X_m = #Cl_m(O) must be checked by
    independent enumeration on toy ordinary classes ... A mismatch falsifies
    simple transitivity as implemented and HALTS this line."
  corrected_value: >-
    THE COUNTING IDENTITY IS NOT A GATE AND CANNOT DISCRIMINATE. Per
    IDEA-20260811-9402e9, both sides of #X_m = #Cl_m(O) evaluate to the same
    expression h(O) * #(O/m)^* / #im(O^*) by derivations that never mention the
    group action -- the geometric side as curves times generators divided by
    automorphisms, the ideal-theoretic side by the elementary exact sequence. The
    identity therefore HOLDS WHETHER OR NOT THE ACTION IS SIMPLY TRANSITIVE, so
    it can neither confirm nor falsify the property the constraint invokes it to
    test. Worse, the identity is already used as a PREMISE in the freeness step
    of the very argument it was supposed to gate, so treating it as independent
    confirmation is circular.

    WHAT REPLACES IT. An orbit-and-stabiliser check, carrying a PLANTED
    NON-TRANSITIVE CONTROL on which the counting identity must still pass --
    which is exactly the null object that makes the replacement gate
    two-directional in the sense docs/inventor-protocol.md requires, and which
    the original gate lacked. Separately, the seed's `[open]` simple-transitivity
    obligation is reported to be a three-line derivation for O maximal
    (transitivity via Cl(O) on curves plus surjectivity of (O/m)^* on the fibre;
    freeness from #G = #X), so the property the gate was protecting is closer to
    settled than the question record assumed -- for MAXIMAL orders only.
    NON-MAXIMAL ORDERS REMAIN GENUINELY OPEN with two named failure points and
    are NOT covered by this correction.

    A DISCLOSED DOWNGRADE OF THE SEED'S DEPENDENCY TRAVELS WITH THIS
    CORRECTION. IDEA-20260811-319a07 marks the ray-class exact sequence
    "[recall-confident], standard class field theory of generalised ideal class
    groups". The ideal-theoretic derivation actually needed here is an
    ELEMENTARY exact sequence, not class field theory. That is a weakening of
    what the argument depends on, which is favourable, but it was asserted at a
    higher level of machinery than required and any citation should use the
    weaker dependency.
  why_it_happened: >-
    THIS IS A COORDINATOR ERROR, NOT A PRODUCER ERROR. The gate was written into
    RQ-RAYCL-3985f4 by this Coordinator at f05894024, taken over from the seed
    record IDEA-20260811-319a07's own minimal_test STEP 3, which calls the
    counting identity its "HARD GATE". Neither the seed nor this Coordinator
    checked whether the two sides of the identity are derivable from a common
    expression without reference to the action. They are, and the check is
    elementary -- exactly the kind of cheap pre-compute falsification audit that
    docs/inventor-protocol.md section 8 exists to force, and that this
    Coordinator did not run before freezing the constraint.
  scope_of_effect: >-
    NO MEASUREMENT, RUN, EVIDENCE RECORD, DECISION OR HYPOTHESIS IS AFFECTED.
    RQ-RAYCL-3985f4 has produced no experiment and consumed no run identifier.
    DEC-20260811-6306cf's next action N4, which restates the gate as the
    question's first obligation, is corrected BY REFERENCE here and its text is
    left untouched, per AGENTS.md rule 4. The question record itself is likewise
    NOT edited; it stands as committed and this correction supersedes its
    constraints[0] on the merits.
  what_would_settle_it: >-
    Re-derive both sides of #X_m = #Cl_m(O) independently and confirm they
    reduce to h(O) * #(O/m)^* / #im(O^*) without invoking the action -- two
    lines of algebra, zero compute, and it refutes or confirms this correction
    on paper. Then confirm the replacement orbit-and-stabiliser gate does
    discriminate by checking it FAILS on the planted non-transitive control that
    the counting identity passes.
  status: open
