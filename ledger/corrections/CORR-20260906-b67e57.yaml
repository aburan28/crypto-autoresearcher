  field: budget_check.memory_gb_used_approx
  prior_value: >-
    manifest.yaml states `budget_check.memory_gb_used_approx: 0.0000105`.
    Found by the independently-dispatched validator
    (coordination/goals/GOAL-QALG-001/reviews/RUN-MLKEM-12d9b8-001-validation/report.yaml)
    to be an off-by-1024 unit-conversion bug: `resources.peak_rss_kb: 10976`
    is reported by Python's stdlib `resource.getrusage` in KIBIBYTES, and
    0.0000105 is what results from dividing the raw peak_rss_kb NUMBER
    (10976) by 1024^3 as if it were already a byte count, rather than
    converting kibibytes to gibibytes (divide by 1024^2).
  corrected_value: >-
    The correct conversion is 10976 / 1024^2 = 0.010467529296875 GB (~10.5
    MB). This does not change the manifest's `within_budget: true`
    conclusion (both the erroneous and the corrected value are far below
    the 2 GB `budget.memory_gb` ceiling; the true peak RSS of ~11 MB is
    itself trivial for this arithmetic-only computation), does not touch
    any required artifact, and does not affect `class_group_order_match`,
    `applicability_outcome`, or any other claimed metric. The underlying
    raw measurements (`peak_rss_bytes: 11239424`, `peak_rss_kb: 10976`,
    `cpu_seconds_user`, `cpu_seconds_system`, `wall_seconds`) are all
    correct and mutually consistent; only this one derived diagnostic field
    is wrong.
  reason: >-
    Discovered by the independently-dispatched validator session
    (report.yaml, agentId a0b7dc0a56bb24a7a) during its required
    environment/resource-consistency check, and confirmed by this
    Coordinator session by re-deriving the arithmetic
    (10976/1024/1024 = 0.010467529296875) before filing this correction.
