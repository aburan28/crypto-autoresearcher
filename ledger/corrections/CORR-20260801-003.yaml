        an unverifiable one. RR-LPF-2's own DEF-065-1 entry demands "A
        SUPERSEDING MANIFEST RECORD ... never an edit"; RTB-068 restates it as
        "RECORD, NOT EDIT".
      why_this_path:
      - >-
        CONVENTION. It is the supersession pattern this campaign already used
        for a frozen experiment-directory artifact - reading_rule.yaml
        superseded by reading_rule_v2.yaml, a `_v2` sibling in the same
        directory, with the superseded file left byte-identical. CORR records
        supersede the same way, by new file under a new id.
      - >-
        VISIBILITY. It sits inside the run package it corrects, so a reader who
        opens the run directory finds the correction beside the defect. A
        correction filed only under ledger/ leaves the run directory looking
        uncorrected to anyone who reads it directly.
      - >-
        SAFETY. It is deliberately NOT named `manifest.yaml`.
        tools/validate_ledger.py globs experiments/*/runs/*/manifest.yaml and
        registers every run id it finds; two files named `manifest.yaml`
        claiming run id RUN-LPF-001-plantz would raise a duplicate-ID error
        emitted with force=True, which cannot be suppressed by any means.
