correction:
  id: CORR-20260801-003
  recorded_at: '2026-08-01'
  recorded_by: coordinator
  record_type: run
  record_id: RUN-LPF-001-plantz
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-026
  experiment_id: EXP-LPF-001
  claim_tier: toy
  authored_at_task: 'Coordinator repair task preceding TASK-20260801-069'
  field: >-
    two_defects_owed_before_the_TASK-20260801-069_approval_gate - (A) the
    RUN-LPF-001-plantz manifest's absent `environment`, `inputs` and
    `resources` blocks; (B) the RR-LPF-1 d9_handling row-index parenthetical
    that RR-LPF-2 deleted without quoting and that was wrong when written.

  why_one_record_and_not_two:
    ruling: 'FOLDED INTO ONE RECORD. Justified rather than assumed.'
    grounds:
    - >-
      Both are the same species of repair - a defect in a hash-bound frozen
      artifact that must be superseded on the record because the artifact may
      not be edited. Splitting them would suggest they are governed by
      different rules; they are not.
    - >-
      Both are preconditions of the SAME gate. RTB-068 conditions its APPROVE
      recommendation on exactly these two items, so the session that reads that
      gate should read one record, not hunt two.
    - >-
      They belong to one archival unit. AGENTS.md assigns every record to
      exactly one archival task, and these two arrive together or the gate is
      not satisfiable.
    what_would_have_justified_splitting: >-
      A difference in the object corrected or in who owes the repair. There is
      none - both are Coordinator-owed records about frozen BATCH-025/026
      artifacts of the same experiment.

