    the_half_of_the_defect_this_repair_does_not_close:
      stated_plainly: >-
        THE VALIDATOR WILL STILL ERROR, AND THIS RECORD SAYS SO RATHER THAN
        LETTING IT BE DISCOVERED. tools/validate_ledger.py discovers run
        manifests by the path glob experiments/*/runs/*/manifest.yaml and has no
        notion of supersession. It will keep reading the prior manifest at its
        own path and keep emitting both error lines for as long as that file
        exists unedited. The superseding record is not matched by that glob, so
        the tool does not read it.
      therefore: >-
        NO RECORD CAN SATISFY THE LITERAL SECOND CLAUSE OF RTB-068's FIRST
        PRECONDITION - "a SUPERSEDING RUN-LPF-001-plantz manifest record that
        makes tools/validate_ledger.py stop erroring". The two halves of that
        precondition are not jointly satisfiable by an artifact of the class the
        reviewer named. That is a finding about the tooling, not a shortfall in
        the repair, and it is recorded rather than papered over.
      what_is_closed: >-
        The SUBSTANCE. The environment, inputs and resource measurements the
        schema asks for now exist as a committed, sourced, machine-readable
        record for this run.
      what_remains_open: >-
        The MECHANICAL half. The run package does not index cleanly until the
        validator learns supersession.
      routes_refused:
      - route: 'edit the prior manifest in place'
        refused_because: >-
          It invalidates an attested archive receipt over a pushed run record.
      - route: 'add the two error lines to tools/validate_ledger_baseline.txt'
        refused_because: >-
          The baseline's own header states that lines may only ever be REMOVED
          and that adding one to absorb a new violation defeats the check. This
          is a new violation introduced this session - precisely the case the
          rule exists to catch.
      - route: 'register the manifest in tools/legacy_run_inventory.yaml'
        refused_because: >-
          That inventory grandfathers records that PREDATE the validator. This
          manifest was written on 2026-08-01, after it. Registering it there
          would launder a new defect as historical debt.
      the_only_clean_mechanical_fix: >-
        A REVIEWED TOOL CHANGE, not a record - a supersession registry read by
        check_run, mapping superseded path to superseding path with both sha256
        values, so the schema check routes to the superseding record while the
        prior path stays hash-pinned and immutable. IT MUST NOT BE MADE BY THE
        SESSION WHOSE RECORD IS FAILING THE GATE. It needs its own task, its own
        tests beside tools/test_goal_closure_quorum.py, and independent review.
        Changing a gate to accommodate a record that fails it is otherwise
        indistinguishable from moving a success criterion after seeing the
        outcome, which AGENTS.md permits only under a versioned
        protocol_amendment.
      a_trap_for_whoever_wires_it: >-
        tier_of_run() in tools/validate_ledger.py evaluates int(bits) on
        inputs.parameters.field_bits. This run's field_bits is the LIST [16, 20],
        exactly as RUN-LPF-001-calib records it, and int() of a list raises
        TypeError rather than producing an error line. The path is reached only
        when an evidence record cites the run, and none cites this one, so it is
        latent today. Anyone routing a plantz manifest into check_run must
        handle list-valued field_bits first.

