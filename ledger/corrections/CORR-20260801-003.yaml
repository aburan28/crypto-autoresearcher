#
# Two record-level repairs owed before the TASK-20260801-069 approval gate,
# both discharged BY RECORD AND NOT BY EDIT:
#
#   PART A - DEF-065-1. The RUN-LPF-001-plantz manifest omits `environment`
#            and `inputs` (and `resources`), so tools/validate_ledger.py
#            errors on it. THE FIRST VALIDATOR ERROR THIS SESSION'S RECORDS
#            HAVE INTRODUCED.
#   PART B - DEF-068-C / RTB-068-1. RR-LPF-1's d9_handling parenthetical
#            "(rows 199 and 206 of 210 in row order)" was DELETED by RR-LPF-2
#            without verbatim quotation, and the deleted parenthetical was
#            ITSELF WRONG - the correct zero-based indices are 201 and 208.
