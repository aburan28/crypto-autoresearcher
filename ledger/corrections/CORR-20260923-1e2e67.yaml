  id: CORR-20260923-1e2e67
  recorded_at: '2026-09-23'
  record_type: run
  record_id: RUN-GFPN-61bba9
  experiment_id: EXP-GFPN-05ff43
  goal_id: GOAL-GFPN-380702
  task_id: TASK-20260923-e52c88
  decision_id: DEC-20260923-d86ff2

  field: >-
    (a) inputs.parameters.solver ("threads=4") in
    experiments/EXP-GFPN-05ff43/runs/RUN-GFPN-61bba9/manifest.yaml and
    runs/RUN-GFPN-bbed6f/manifest.yaml, carried into
    experiments/EXP-GFPN-05ff43/corrections/RUN-GFPN-bbed6f.v2.yaml.
    (b) implementation.md deviation D-3 (lines 155-160): "segfaults in its
    rational-parametrization step for prime characteristics between about 2^16
    and 2^18" and "-g 1 leading-ideal output succeeds at 65551". Also the
    comment at implementation/pdp_cell.py lines 228-231 ("-g 1 ... also works
    at the 17-bit rung").

  prior_value: >-
    (a) solver threads=4. (b) The crash is located in rational
    parametrization, and -g 1 succeeds at 65551.

  corrected_value: >-
    (a) The anchor runs used msolve -t 1 (single thread). "threads=4" is the
    cell default, not the anchor configuration.
    (b) On the anchor system, the Joux-Vitse 4-point decomposition system over
    F_{p'^5} at p' = 65551 (4 variables, 5 equations of total degree 8, 495
    monomials, 2471 terms), msolve 0.6.5 on this host crashes with SIGSEGV
    INSIDE F4 under -g 1, at the header of the degree-9 round ("9 3 3 24 x 714
    64.19%"), before any rational parametrization. The -g 1 claim does not
    hold for this system. D-3's two-variable toy system was not re-tested, and
    its statements about that system are neither confirmed nor refuted. The
    17-bit rung's exclusion from the ladder is, if anything, better justified.

  reason: >-
    Validator TASK-20260923-58953e, joint K4(f), breaking artifact
    coordination/goals/GOAL-GFPN-380702/reviews/TASK-20260923-58953e/scratch/inv2/
    (command.txt, stdout.log, stderr.log, returncode.txt = 139; input
    anchor17_random.ms sha256
    ca96c48cd8b22472de9bf96248430296e628da67d83554fd3fe22e5c53a7ac62). The
    validator derived the 17-bit system independently from the manifest's
    curve coefficients (scratch/k4a_anchor_system.py; no producer module
    imported). msolve -g 1 died with SIGSEGV at the same place, with an F4
    trace identical line for line, including the degree-8 "found reducer"
    debug lines, to all five archived RUN-GFPN-bbed6f anchor_t*.ms.log files.
    The -t 1 reading is the validator's (CO-6). Its own identical-trace
    reproduction used -t 1. CORR-20260923-d4220b's observation that the
    crashes occurred during the degree-9 F4 round under -g 1 is confirmed.

  effect_on_dependent_records: >-
    - CORR-20260923-d4220b and RUN-GFPN-bbed6f.v2.yaml remain correct in
      substance: failed / infrastructure_error, nothing measured. The v2
      record's solver thread count is read through facet (a). It is not
      edited, and no v3 is needed, because the status is not affected.
    - The anchor's system identity (K4(a)) is unaffected, and so is its timing
      (7.995 s at 25 bits). The control's status is recorded in
      DEC-20260923-d86ff2: FAILED on the literal [0.5, 2.0] band.

  evidence_artifacts:
