correction:
  id: CORR-20260802-bc9e33
  recorded_at: '2026-08-02'
  record_type: claim
  record_type_note: >-
    claim is the closest permitted token, as in CORR-20260724-001 and
    CORR-20260802-008. The corrected artifact is a research question's motivation
    field and an access-status assessment.
  id_scheme_note: >-
    THIS RECORD USES THE RANDOM 6-HEX SUFFIX FORM introduced by
    CORR-20260802-ff373d, which landed on main between BATCH-001's close and this
    record. That record identifies the exact defect this session hit FOUR times -
    "concurrent worktrees scan the same state and get the same answer, so they
    mint the SAME identifier for DIFFERENT records" - and rules that the
    sequential \d{3} form must never be minted again. CORR-20260802-008 (this
    session's own, renumbered twice) is the last sequential correction this
    branch mints.

  corrected_record: ledger/questions/RQ-HAWK-001.yaml
  also_records: access-status of iacr:2026/1318 after the BATCH-002 retry
  goal_id: GOAL-HAWK-001
  question_id: RQ-HAWK-001
  batch_id: BATCH-002
  raised_by: >-
    DEC-20260802-007 next_action items (a) and (c), which the BATCH-001 close
    recorded. Item (c) originates in TASK-20260802-007 (Red Team) objection O5,
    which found that BATCH-001 had attacked the wrong record.

  summary: >-
    Records the outcome of the declared access-order retry for iacr:2026/1318 -
    route A4 is now EXHAUSTED WITH A DEFINITIVE NEGATIVE rather than
    rate-limited, A2 is stably gated on a third confirmation, and A5 is blocked
    by an unauthenticated service tier rather than by this session's usage. Also
    corrects RQ-HAWK-001's motivation, which conflates two distinct HAWK attacks
    and never names the disclosed one.

  item_a_access_retry:
    context: >-
      BATCH-001 declined to fire pause condition 2 on the ground that routes A4
      and A5 had returned TEMPORARY 429s caused by this session's own earlier
      gather sweeps. TASK-20260802-007 upheld the conclusion but objected that
      "retry available" carried no retry-by date or owner and was therefore
      unfalsifiable. DEC-20260802-007 made the retry item (a) of the single next
      action.
    retried_at: '2026-08-02'
    retried_by: coordinator
    results:
      - route: A4
        service: arXiv API
        prior_status: HTTP_429_TEMPORARY
        new_status: RESPONDING
        outcome: EXHAUSTED_DEFINITIVE_NEGATIVE
        method: >-
          Four queries - all:"Cryptanalysis of HAWK"; all:HAWK AND all:nrdPIP;
          au:"Mendelsohn" AND all:HAWK; all:"Guessing Game" AND all:lattice.
        finding: >-
          iacr:2026/1318 IS NOT CROSS-POSTED TO arXiv. The first three queries
          returned zero results, including the author search. The fourth returned
          three unrelated papers (Gibbs partitions, collective intelligence,
          majorization uncertainty). THIS IS A RESULT, NOT A RATE LIMIT: the
          route now answers and the answer is no.
      - route: A5
        service: Semantic Scholar Graph API (unauthenticated)
        prior_status: HTTP_429_TEMPORARY
        new_status: HTTP_429_PERSISTENT
        outcome: BLOCKED_BY_SERVICE_TIER
        method: Two queries, then one further query after a 45-second wait.
        finding: >-
          429 on every attempt roughly fourteen hours after the original ones.
          THE BATCH-001 ATTRIBUTION WAS PARTLY WRONG: this is the unauthenticated
          tier's own throttle, not residue from this session's gathers. Its
          marginal value is now LOW regardless, because A4 has answered the
          cross-post question that A5 would have answered less directly.
      - route: A2
        service: eprint.iacr.org PDF endpoint
        new_status: HTTP_403_CLOUDFLARE
        outcome: STABLY_GATED
        finding: >-
          Third independent confirmation, on both 2026/1318 and 2026/890. Not a
          transient and not the harness network policy.
    pause_condition_2_status: >-
      STILL NOT FIRED, and now on much firmer ground than BATCH-001's. The
      condition is that the sources "cannot be obtained under the network policy
      after the declared source-preference order is exhausted". TWO OF THREE
      OBJECTIONS TO FIRING IT SURVIVE: the blocker remains ORIGIN-SIDE BOT
      PROTECTION rather than the network policy, and one declared route remains
      untried. THE THIRD - "A4/A5 are temporary" - IS NOW RETIRED: A4 is
      exhausted with a negative and A5 is a tier limit.
    remaining_untried_route: >-
      The Red Team's named cheapest untried route - a contact-author request to
      the four addresses printed on the reachable abstract page. IT IS NOT
      EXECUTED HERE AND MUST NOT BE EXECUTED WITHOUT EXPLICIT USER
      AUTHORIZATION: it is outward-facing correspondence with named third
      parties on this program's behalf, which no Coordinator decision in this
      campaign authorizes. Recorded as the open decision, not as a blocker.
    explicitly_not_attempted: >-
      Circumventing the Cloudflare challenge by proxy, header forgery, or any
      other means. The Red Team recommended against it and this record forbids
      it.

  item_c_rq_motivation_conflation:
    claimed: >-
      BATCH-001 asserted that GOAL-HAWK-001's next_action was defective because
      it asked for "the four heuristics" of an unconditional attack.
    corrected: >-
      THAT WAS AN OVERREAD, already recorded in CORR-20260802-008 defect 5 and in
      the goal's own corrected_at_batch001_close note. The modifier attaches to
      the four sources collectively and the instruction was satisfiable.
    the_real_defect: >-
      RQ-HAWK-001.motivation is the record that actually conflates the two
      attacks. It reads that "Reported 2026 cryptanalysis claims a classical
      probabilistic-polynomial-time recovery of the HAWK secret key, resting on
      four number-theoretic heuristics and on a reduction from HAWK's rank-2
      module-LIP instances to nrdPIP, enabled by an automorphism whose existence
      van Gent and Pulles (2025) showed would halve the effective rank but which
      was not known at the time." THIS WELDS TOGETHER THREE DISTINCT WORKS.
    what_is_actually_true:
      - >-
        The four heuristics and the nrdPIP route are iacr:2026/1318
        (Nelson-Limbrey-Ling-Mendelsohn), KN-LIT-7674. Its polynomial-time claim
        is WITHDRAWN by its authors; Heuristics 1-3 are independently verified
        and Heuristic 4 failed.
      - >-
        The automorphism and the rank-halving are van Gent-Pulles 2025,
        KN-LIT-7673 - a SEPARATE paper with exactly one numbered heuristic, whose
        own abstract says the work "does not affect the security of HAWK".
      - >-
        The rank n/2+1 result the motivation gestures at is Straznickas-Weis,
        KN-LIT-7592 - the DISCLOSED ATTACK, which is unconditional, exponential
        at 2^{(n/2+1)+o(n)}, and WHICH RQ-HAWK-001 NEVER NAMES ANYWHERE.
    correction_method: >-
      BY SUPERSESSION, NOT BY EDIT. RQ-HAWK-001.yaml is NOT modified by this
      record. Its motivation field states what was believed on 2026-07-29 from
      secondary reporting, and the record itself says so - its constraints field
      opens "Every per-scheme technical claim in this record is sourced from
      secondary reporting or from memory of the literature and is UNVERIFIED."
      THE RECORD WARNED ABOUT ITSELF ACCURATELY and editing it would destroy that
      provenance. This record is the correction.
    corrected_statement: >-
      RQ-HAWK-001's decision_target and scope remain sound and are NOT corrected.
      Its motivation describes a single composite attack that does not exist.
      Anyone reading RQ-HAWK-001 must substitute the three-way separation above,
      which EV-HAWK-001 OBS-1 through OBS-3 measured and DEC-20260802-007 D-1
      acted on.

  what_is_and_is_not_wrong:
    no_research_claim_is_affected: >-
      No evidence record, decision, hypothesis or experiment consumed
      RQ-HAWK-001's motivation. The goal it binds was re-scoped by
      DEC-20260802-007 on measured grounds, not on the motivation.
    no_hawk_assessment: >-
      Nothing here assesses HAWK's security in either direction.
    kn_open_027_superseded_separately: >-
      KN-OPEN-028 supersedes KN-OPEN-027 as item (b) of the same next action, on
      the ground that its question 1 is substantially answered by the 30/06
      update. That supersession is recorded in the knowledge corpus, not here.

  changes_no_hypothesis_status: true
  is_not_a_cryptanalytic_result: true
  admissible_toward_closure_quorum: false

  open_items:
    - id: OI-1
      item: >-
        The contact-author request is the only untried declared route and needs
        EXPLICIT USER AUTHORIZATION before anyone executes it. Until that
        decision exists, iacr:2026/1318's body stays unread and KN-OPEN-028 Q1
        stays open.
    - id: OI-2
      item: >-
        KN-OPEN-028 Q1 may be answerable WITHOUT the paper: the corrected count
        is fractional ideals of norm q' in O_F, a standard algebraic-number-theory
        quantity. Deriving the corrected exponent independently is a cheaper route
        to the same answer and is not blocked by OI-1.
    - id: OI-3
      item: >-
        BATCH-002 was NOT constructed as a formal dispatch queue with archive
        tasks. Items (a), (b) and (c) were executed directly by the Coordinator
        and committed. This is a deliberate departure recorded rather than
        concealed: BATCH-001's queue carries two unrepaired archive-shape defects
        and does not render, and reproducing that shape would have compounded
        them. A conforming BATCH-002 queue - receipts inside their archive
        commits, per the pattern of TASK-20260725-502 - is owed before any batch
        that dispatches workers.

  recorded_by: orchestrator
  authority_note: >-
    Written from claude/algebraic-number-theory-kb-zpmu0c by the session that
    executed the retry, following the CORR-20260729-003 precedent. It creates no
