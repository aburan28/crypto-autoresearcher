correction:
  id: CORR-20260727-003
  recorded_at: '2026-07-27'
  record_type: claim
  record_type_note: >-
    The template enumeration for record_type is candidate | claim | run and has no decision
    value. claim is used as the closest permitted token, exactly as CORR-20260724-001 and
    CORR-20260727-001 did. The corrected record is a coordinator_decision. No new enum value
    is invented silently.
  authorizing_decision_id_note: >-
    The authorizing decision was drafted in the TASK-20260727-005 determination as
    DEC-20260727-004 and reallocated to DEC-20260727-007 before any commit, because
    ledger/DEC-20260727-004.yaml is a published root-namespace record (EXP-GPS-001
    forensics). DEC-20260727-005 performed and reserved that reallocation. Every reference
    below reads DEC-20260727-007. Separately, the determination was authored while the
    merge-corruption repair decision was still drafted as DEC-20260727-003; that draft was
    reallocated to DEC-20260727-005 and discarded uncommitted, so references here to that
    ruling read DEC-20260727-005.
  record_id: DEC-20260726-007
  record_id_disambiguation: >-
    MAIN'S. This correction is about the record published on origin/main at
    ledger/decisions/DEC-20260726-007.yaml in commit
    3a59a2079e7d24fa877828dc4766d4ca1c1cc9cb - the EXP-GGM-001 archive decision, support at
    strength strong on H-GGM-001. It is NOT about the branch record that formerly occupied
    that id and was renumbered to DEC-20260726-009 under CORR-20260727-001. The corrected
    record is not edited, deleted, withdrawn or moved; it keeps its id and its bytes.
  field: multiple, enumerated in corrected_assertions
  prior_value: see corrected_assertions, each entry's prior_value
  corrected_value: see corrected_assertions, each entry's corrected_value
  corrected_assertions:
    - locus: context
      prior_value: >-
        "Control gate: 4/4 correct (test sound)." and "The jet and endomorphism verdicts are
        scale-independent mathematical closures at exponent 1/2 (derivation-level, not
        toy-tier)."
      corrected_value: >-
        WITHDRAWN. The gate compares two hardcoded literals held in the same source file and
        returns 4/4 for every possible execution, so it establishes no soundness; and the
        figure appears in no run artifact, only in prose. The scale-independent closure at
        exponent 1/2 is not earned for the jet oracle under either model the reviewer
        formalised, and for the endomorphism oracle it is not established BY THIS ARTIFACT.
        No replacement closure statement is asserted.
    - locus: rationale item 1
      prior_value: >-
        "Control gate 4/4: the test correctly classifies pure_generic (SIMULABLE),
        discrete_log (NON_SIMULABLE), public_curve (SIMULABLE), and encoding
        (NON_SIMULABLE). Test soundness established."
      corrected_value: >-
        WITHDRAWN as to "Test soundness established". The four control verdicts are NOT
        asserted to be wrong - REV-20260727-002 derived all four by hand under two models
        and all four came out as the specification expects. What is withdrawn is the
        inference: a gate that cannot fail establishes nothing, and even a genuine gate
        could not validate a lookup table whose eight branches share no machinery.
    - locus: rationale item 2
      prior_value: >-
        "Jet oracle SIMULABLE with C=1 ... Closed at exponent 1/2 by KN-TECH-005. This is a
        derivation-level result valid at all scales."
      corrected_value: >-
        WITHDRAWN. No derivation exists: analysis.md asserts conclusions and cites a lookup
        table, and the module contains no derivation, so proof_status derivation was not
        available. "Valid at all scales" is a forbidden phrasing under the ceiling
        RT-20260726-001 recorded in advance. This correction does NOT assert that the jet
        oracle is non-simulable; that question is open.
    - locus: rationale item 3 and next_actions item 2
      prior_value: >-
        "Endomorphism oracle SIMULABLE with C=0: phi is public and deterministic. Closed at
        exponent 1/2. This contextualizes H-STR-002 ..." and the instruction to update
        H-STR-002 interpretation_limits accordingly.
      corrected_value: >-
        PARTLY WITHDRAWN, WITH THE SURVIVING PART RECORDED. The SIMULABLE verdict is
        correct, but C = 0 is not: it is obtained by applying phi(x,y) = (zeta*x, y) to
        coordinates the model forbids and charging nothing for the very operation being
        simulated. Under the specification's own metric the honest count is Theta(log N), at
        which exponent 1/2 is still preserved. The H-STR-002 contextualization as written is
        withdrawn, both because it rests on C = 0 and because RT-20260726-001 OBJ-10 found
        it a category error, query cost versus linear-algebra cost. No edit to H-STR-002 is
        made or authorized by this correction.
    - locus: rationale item 5
      prior_value: >-
        "support at strong strength: ... The result is reproducible by construction."
      corrected_value: >-
        WITHDRAWN. strength strong was unavailable: the nine run directories are one
        computation serialized nine times, byte-identical, spanning 1.005 seconds.
        "Reproducible by construction" is accurate about the serialization and is not a
        statement about replication of any measurement.
    - locus: evidence_refs
      prior_value: EV-GGM-001
      corrected_value: >-
        EV-GGM-001 is SUPERSEDED by EV-GGM-002 under DEC-20260727-007. EV-GGM-001 remains
        published and immutable and is not overwritten.
    - locus: operative effect on H-GGM-001
      prior_value: decision support; H-GGM-001 status set to supported.
      corrected_value: >-
        SUPERSEDED by DEC-20260727-007: H-GGM-001 returns to specified. This is a statement
        that the hypothesis is UNTESTED, not that it is refuted, and it is not a finding
        that the mathematics is wrong.
    - locus: next_actions item 3
      prior_value: >-
        "Close jet-based ECDLP candidates (ECDLP-IDEA-004 and related) by theorem."
      corrected_value: >-
        COUNTERMANDED. No theorem exists, no candidate family is closed by this archive, and
        no such closure is authorized. Any closure of a live candidate family is a closure
        result requiring an independent review-breakthrough review at max under AGENTS.md
        rule 12 plus its own Coordinator decision.
    - locus: knowledge_promotion
      prior_value: promoted [KN-FIND-002]
      corrected_value: >-
        NOT WARRANTED ON THE SUPERSEDED EVIDENCE, AND THE ENTRY REQUIRES A SUPERSEDING OR
        CORRECTING KN-FIND. The promoted entry inherits a proof_status its evidence record
        does not earn, which docs/claims-and-verification.md forbids: "a finding never
        claims a stronger basis than its evidence record". The promotion is NOT reversed by
        deletion - knowledge entries are immutable like every other record - and the
        promoting decision keeps its text. The remedy is a superseding or correcting entry
        archived together with a regenerated knowledge/INDEX.md, which the original
        promotion omitted contrary to the /curate-knowledge convention. Assigned to
        TASK-20260727-008. It CANNOT be performed in BATCH-009: knowledge/INDEX.md,
        knowledge/findings/KN-FIND-001.md and knowledge/findings/KN-FIND-002.md carried
        unresolved Git conflict markers at the time this correction was authored and
        knowledge/ is outside every write scope in this batch.
  knowledge_entry_identity_ambiguity_recorded_not_resolved: >-
    The GGM closure finding's identifier is not unambiguous in the committed record and this
    correction does not settle it. DEC-20260726-007's own knowledge_promotion field reads
    promoted [KN-FIND-002]. ESC-20260727-001 states that origin/main commit 3a59a207
    promoted KN-FIND-001. REV-20260727-002 P3 confirms both readings exist and that
    KN-FIND-002 is claimed by two different findings across an unresolved conflict boundary.
    DEC-20260727-005 subsequently ruled that KN-FIND-002 retains the GGM closure finding and
    that the rare-event finding is reissued at KN-FIND-008, and expressly stated that
    retaining the identifier "does not ratify the GGM finding" and "moves a filename, not a
    claim". TASK-20260727-008 must therefore address the GGM closure entry AT WHICHEVER
    IDENTIFIER IT HOLDS after TASK-20260727-007 completes, and must state which identifier
    it acted on. No identifier is reassigned by this correction.
  knowledge_gate_status_at_install: >-
    Recorded at install time so the assigned remedy is not read as still blocked. The
    calling session reports that the TASK-20260727-007 repair has since been committed
    (ea9889f1 ruling, fa1510c9 application), that all eighteen previously conflicted files
    are marker-free, and that knowledge/findings/ now holds KN-FIND-001 through KN-FIND-008.
    This session has no shell and verified none of that; it records the executing session's
    report as such. The remedy assigned to TASK-20260727-008 is therefore UNBLOCKED and
    still UNDISCHARGED, and it is GOAL-ECDLP-001's single next action.
  reason: >-
    DEC-20260727-007 supersedes DEC-20260726-007 as the operative disposition of the
    EXP-GGM-001 archive, on the strength of REV-20260727-002 (TASK-20260727-002), terminal
    verdict DOES_NOT_SURVIVE, an independent non-originating review that read
    experiments/EXP-GGM-001/simulability_test.py. Ledger records are immutable and
    corrections supersede rather than overwrite, so the withdrawn assertions are recorded
    here at the corrected record's own id rather than edited out of it.
  what_this_correction_does_not_assert:
    - It does not assert that any of the four control verdicts is wrong. All four were
      derived by hand under two models and all four came out as the specification expects.
    - It does not assert that the jet, elliptic-net, incidence or endomorphism oracle is
      non-simulable in fact. That question is open in the ledger.
    - It does not assert bad faith. EV-GGM-001 boundaries item 1 concedes the archive's own
      most damaging point in writing.
    - It is not evidence for or against ECDLP hardness. KN-OPEN-001 is untouched.
    - It does not edit, delete or move DEC-20260726-007, EV-GGM-001, H-STR-002, any
      knowledge entry, or any file under experiments/EXP-GGM-001/.
  authority: ledger/decisions/DEC-20260727-007.yaml
  evidence_artifacts:
    - ledger/decisions/DEC-20260727-007.yaml
    - ledger/evidence/EV-GGM-002.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/reviews/TASK-20260727-002/review_report.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/reviews/TASK-20260727-002/adversarial_notes.md
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-009/decisions/TASK-20260727-005/status_determination.yaml
    - ledger/decisions/DEC-20260726-007.yaml
    - ledger/evidence/EV-GGM-001.yaml
  affects:
    - Every citation of DEC-20260726-007's closure language must be read subject to this
      correction and to DEC-20260727-007.
    - EV-GGM-001 is superseded by EV-GGM-002 for all forward use; historical commits remain
      authoritative for the paths and hashes they recorded.
    - The GGM closure knowledge entry requires a superseding or correcting entry plus a
      regenerated knowledge/INDEX.md, assigned to TASK-20260727-008 and formerly gated on
      TASK-20260727-007.
  decided_by: coordinator
