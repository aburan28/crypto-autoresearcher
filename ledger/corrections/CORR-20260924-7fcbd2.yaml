  items:
    - item: 1
      what: child_created "true for every created child"
      records:
        - id: AMD-EXP-GFPN-05ff43-20260924-readbackclose
          path: experiments/EXP-GFPN-05ff43/amendments/v2_addendum_readbackclose.yaml
          locations:
            - lines: 660
              context: >-
                options_weighed RA: reading the frozen record object "makes
                child_created true for every created child"
            - lines: 504-512
              context: >-
                RKL-2: a child left waiting for the go byte when the parent
                raises before 236 ... "Its launch record exists (RK-1 (b))"
        - id: DEC-20260924-a789e1
          path: ledger/decisions/DEC-20260924-a789e1.yaml
          locations:
            - lines: 640-646
              context: >-
                disposition.route (1): "child_created is true for every
                created child (key presence or a positive `pid`)"
            - lines: 1085-1090
              context: >-
                rationale "CLASSIFY BY A STATIC FACT, NOT BY AN ENUMERATION OF
                BRANCHES"
      prior_value: >-
        On a raise, RK-1 (b) sets child_created true for every created child,
        from the report key in the frozen `rec` or a positive `pid` in a
        _run_child_locked frame on the traceback; so every created child is
        classified by one static fact.
      corrected_value: >-
        RK-1 (b) as worded records child_created FALSE for a created child on
        two paths the close census found:
        - P-16: a raise at v2_solver.py 181 after fork() created the child and
          before `pid` is stored (the line is CALL then STORE_FAST pid); `rec`
          has no report key (220 not reached) and no frame holds `pid`;
        - P-F2 after P-14a (or after P-16): a raise in _run_child_locked after
          fork and before 220, then a raise from lk.release() in run_child's
          finally (172-174); the exception that leaves run_child carries a
          traceback without the _run_child_locked frame, which is only on its
          __context__.
        So child_created, the input of the classification, still depends on
        the path. RKL-2's "Its launch record exists" is true, but on P-16 that
        record says the child was not created. Neither path changes any
        package verdict under RK-3 (every raise is an infrastructure launch,
        and the driver has no handler), which is part of why DEC-20260924-8fa3d4
        changes the approach rather than patching the rule.
      consequence: >-
        The readbackclose draft is NOT approvable as written under its RKR-1
        (b) (DEC-20260924-8fa3d4). The successor DRAFT
        AMD-EXP-GFPN-05ff43-20260924-failclosed makes child_created three-valued
        (true / false only on positive pre-fork evidence / undetermined), walks
        the __context__ / __cause__ chain, and treats undetermined as FAIL
        (RF-1, RF-3).
      evidence: >-
        readbackclose-census.md 133-172 (mechanical facts; bytecode of 181),
        190-206 (P-16, P-F2 rows), 226-233 (notes), 257-268 (reading);
        TASK-20260924-71d070 snapshot-receipt.json 165-176
        (census_outcomes_as_stated RKR-1); v2_solver.py 149-236.
    - item: 2
      what: the scope of PASS_ZL and of the RK-3 verdict
      records:
        - id: AMD-EXP-GFPN-05ff43-20260924-readbackclose
          path: experiments/EXP-GFPN-05ff43/amendments/v2_addendum_readbackclose.yaml
          locations:
            - lines: 219-227
              context: >-
                RKF-3: zero-launch packages are outcomes "the frozen dependants
                act on"
            - lines: 345-354
              context: >-
                RK-3 (b) WHY: an empty launch_records list with no child file
                "is a positive record that the package created no capped
                child, and the proxy is vacuous there"
        - id: DEC-20260924-a789e1
          path: ledger/decisions/DEC-20260924-a789e1.yaml
          locations:
            - lines: 709-712
              context: >-
                D-3 remedy: "RK-3 (b) PASS_ZL and RK-3 (c) designed stop"
            - lines: 1091-1098
              context: >-
                rationale "THE CHECKER IS FROZEN; THE VERDICT ON IT CAN BE
                EXACT"
      prior_value: >-
        PASS_ZL admits exactly the zero-launch driver outcomes the frozen m = 4
        rule and the aggregates are designed to act on, and every package that
        launched has its verdict decided by the frozen checker and the
        designed stop.
      corrected_value: >-
        RK-3 (b) reads neither run_status nor who wrote raw-result.json. So:
        - PASS_ZL also applies to W-1, a WRAPPER-RECORDED infrastructure
          failure (the driver exited or raised before any launch;
          r3_run_wrapper.py 491-505), and to Z-C5 with an invalid cell (close
          census md 425-426, 491). On a W-1 m = 5 package the m = 4 package's
          _condition_met reads "no m = 5 cell" (v2_driver.py 1121-1122) and
          skips its conditional arms, so an infrastructure failure would steer
          the sequencing. The Z-C5 case is a driver-logic outcome and is not a
          defect.
        - By this act's reading of the census rows (md 382, 385-396, 707; NOT
          a census result): a package whose driver died after a launch whose
          pair was read (P-14c, e.g. at 236 or 281) carries that pair in a
          raise-frame record, passes the frozen item at v2_check_run.py 66-67,
          fails no other item, and receives PASS under RK-3 (b) although its
          raw-result.json is wrapper-written; RK-3 (c)'s stop applies only to a
          FAIL.
        "An empty launch_records list with no child file is a positive record
        that the package created no capped child" remains correct; what it
        does not show is that the package's zero-launch outcome is one the
        frozen logic produced.
      consequence: >-
        Recorded as DEC-20260924-8fa3d4 E-2. The successor records
        raw_result_writer, requires "driver" for PASS and PASS_ZL, and
        restricts PASS to positive child classes (failclosed RF-0 (b), RF-2,
        RF-3).
      evidence: >-
        readbackclose-census.md 377-429 (zero-call outcomes W-1, W-2),
        476-492 (verdict table), 704-707 (readers: the frozen checker passes
        66-67 where a raise-path pair is the only source); v2_check_run.py
        62-73; v2_driver.py 1006-1013, 1110-1127; r3_run_wrapper.py 483-509.
    - item: 3
      what: what DV-18's development world requires
      records:
        - id: AMD-EXP-GFPN-05ff43-20260924-readbackclose
          path: experiments/EXP-GFPN-05ff43/amendments/v2_addendum_readbackclose.yaml
          locations:
            - lines: 378-395
              context: >-
                RK-4 (a): "RUNS and the plan paths redirected in-process ... (as
                the r3 development checks redirect them; r3_run_wrapper.py
                68)"; "No bypass flag, mode or argument is added"
        - id: DEC-20260924-a789e1
          path: ledger/decisions/DEC-20260924-a789e1.yaml
          locations:
            - lines: 559-576
              context: >-
                R-RLR7-wrapper_admission: the successor states "preflight
                recorded, expected admission refusals listed, the separate
                launch path (423) invoked in the development process, no bypass
                flag"
            - lines: 717-720
              context: D-5 remedy "RK-4 (a); checked by RKR-6"
      prior_value: >-
        In-process redirection of RUNS and the plan paths, a recorded preflight
        and a direct call of launch are enough to run DV-18 (a), (b) and (e)
        through the wrapper's execution path, as the r3 development checks
        did.
      corrected_value: >-
        The r3 development checks did more than redirect in-process. They
        replaced W.ENTRY_V2 / W.ENTRY_A1 with a shim entry, K.FROZEN_LAUNCHER
        with a shim checker launcher (both re-applying the redirections in the
        CHILD process from R3_TOY_CFG), W.git_tree_state with a lambda, and
        W.DRIVER_PYTHONHASHSEED, and ran the whole wrapper through W.main
        (close census md 612-631). Without child-process redirection the entry
        child loads the real plan and Ctx raises KeyError on the development
        label (a W-1 outcome; N-1), and the checker child looks the label up in
        the real plan (v2_check_run.py 45; N-4). Launch also writes the
        NOT_EVALUABLE REG-1 block, which fails the r3 REG-1 check item
        (r3_check_run 327-330) on a development package (md 570-572), so RB-5
        (c)'s "the r4 checks pass" cannot hold there. R-10 and an r4 analogue
        of R-6 can refuse outside RK-4 (a)'s expected list (md 590, 638-645;
        L-14). The frozen controls and controls-a1 commands also write the
        label into every certificate (v2_driver.py 252 -> v2_lift.py 220; md
        605-606).
      consequence: >-
        RKR-6 (c) fails as worded and DV-18 is infeasible as worded
        (DEC-20260924-8fa3d4). The successor names a CLOSED development
        harness (the r3 method), the expected refusals, the one expected
        checker item and the label fields (failclosed RF-4).
      evidence: >-
        readbackclose-census.md 552-692; TASK-20260924-71d070
        snapshot-receipt.json 222-227 (RKR-6 as stated); r3_run_wrapper.py
        30-79, 231-325, 423-570.

