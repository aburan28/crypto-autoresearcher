# =============================================================================
# CORR-20260924-7fcbd2 -- CORRECTS THREE OVERSTATEMENTS, EDITS NO FILE:
# the DRAFT AMD-EXP-GFPN-05ff43-20260924-readbackclose and DEC-20260924-a789e1
# state (1) that reading the frozen record object from the traceback makes
# child_created true for every created child; (2) that the zero-launch verdict
# PASS_ZL applies only to packages the frozen dependants act on as designed
# basis outcomes; and (3) that DV-18's development world needs only in-process
# redirection "as the r3 development checks redirect them". The close census
# TASK-20260924-e8da78 (archived by TASK-20260924-71d070) shows each is too
# strong. Ruled in DEC-20260924-8fa3d4. WRITE-ONCE. Archived by
# TASK-20260924-eb2540.
# =============================================================================
