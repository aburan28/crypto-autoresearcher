  dominant_failure_mode: >-
    THE MAJORITY OF KILLS ARE RECORDS THAT FAIL A CONTROL THEY THEMSELVES
    DECLARED MANDATORY, decidable in under a minute of arithmetic BEFORE any
    compute is spent. Five of six reviewers independently reported this as
    their most productive move: apply the record's own prediction at a point
    where the answer is already forced. This is a process finding, not a
    verdict on any single idea: the round generated 126 proposals without ever
    executing the cheap self-consistency check each record had already written
    down.

  coordinator_verified_findings: >-
    The Coordinator independently re-derived a sample of the kills from first
    principles rather than accepting reviewer reports. Each below reproduced
    exactly:
      * IDEA-20260808-c5f9a2 (endomorphism-image oracle): the claimed m/d yield
        advantage is an ordered/unordered overcount --
        B*C(B,m-1)/C(B,m) = B*m/(B-m+1) -> m exactly. Separately, on a group of
        PRIME order N, gcd(2,N)=1 makes [2] a bijection, so [2]G = G and the
        image oracle is a CONSTANT function on the subgroup it operates in.
      * IDEA-20260808-a3f7c1 (y-coordinate oracle): identical defect class,
        found by a DIFFERENT reviewer in a different slice. Guided search
        examines exactly m times MORE candidates: B*C(B-1,2)/C(B,3) = 3.0000
        at B = 10, 50, 200, 1000. The measured "3x gain" is the overcount.
      * IDEA-20260808-40aab9 (Kani / embedding degree): counterexample
        reproduced exactly. E/F_53: y^2 = x^3 + x + 15 has #E = 52 = 4*13, so
        13 || #E; 53 = 1 mod 13 gives ord_13(53) = 1, i.e. k_emb = 1; but
        13^2 does not divide 52, so the 13-torsion is cyclic -- RANK 1. This
        falsifies "rank 2 iff k_emb = 1", and under the record's own N || #E
        hypothesis the rank-2 cell is provably EMPTY, making its planted
        positive control unsatisfiable.
      * IDEA-20260808-a33400 (AES): the Coordinator implemented AES
        independently and measured the integral property at 16/16 balanced at
        3 rounds and 0/16 at 4 rounds, reproducing the classical Square-attack
        boundary and the reviewer's numbers. The record predicted c(4) > 1;
        its own claim (i) forces c(4) = 1, verbatim its stated falsification
        condition.
      * IDEA-20260808-c64123: justifies itself by closing "one of
        GOAL-ECTD-001's four named priority families" for descent/torsion.
        GOAL-ECTD-001.yaml contains ZERO occurrences of "descent" or "torsion"
        across 193 lines; its actual title is "Prime-field elliptic-curve
        trapdoors: Teske analogue via secret isogenies to rare endpoint
        weaknesses."
      * IDEA-20260808-fa1d80: its Lagrangian certificate requires
        k^2 = -1 mod N, solvable only for N = 1 mod 4. At N=11, the FIRST
        prime in the record's own declared test range, there is no solution --
        the certificate has nothing to fire on.
      * IDEA-20260808-c1abd1: its defining quantity
        g = log2 min(C_lattice,|B_tau|) - log2 max(C_reduce,|B_tau|) is <= 0
        identically, since max(x,|B|) >= |B| >= min(y,|B|). The g > 0 branch
        it is filed on cannot occur.
      * IDEA-20260808-d935d1: its "exponentially large stratum, Theta(n)" is
        exactly 0 at every perfect square k (verified k = 4,9,...,100); the
        exponent is k - floor(sqrt k)^2 = O(sqrt k).
      * IDEA-20260808-76260d: 4-round AES requires >= 25 active S-boxes (wide
        trail, 5^2). If the LP relaxation optimum is r = 4 as measured, weak
        duality caps ANY dual certificate at 4, so no dual vector can certify
        25; integrality gap 6.25 against a predicted 1.

  coordinator_error_root_cause:
    summary: >-
      A SECOND, LARGER DEFECT IN THE COORDINATOR'S OWN DEDUP CORPUS, found by
      a reviewer and confirmed directly. CORR-20260808-f4d780 disclosed FIVE
      barrier entries blanked by a title-parsing bug. That disclosure was
      incomplete.
    additional_defect: >-
      KNOWLEDGE_BARRIERS.txt contains only 60 of the 89 KN-TECH records on
      disk. TWENTY-NINE ARE MISSING ENTIRELY, in a contiguous block from
      KN-TECH-061 upward, because the Coordinator's corpus builder piped that
      extraction through `head -60`. This was written by the Coordinator, not
      inherited. Among the invisible records were three copies of "Null
      sufficiency -- deriving a contrast's forced value before measuring it",
      which is precisely the technique that disposes of at least one proposal
      this pass killed, and KN-TECH-074/076/079, the nearest neighbours of
      another. Several filed records also quote wrong corpus sizes taken from
      that truncated file.
    consequence: >-
      The novelty screening these 126 proposals received was materially weaker
      than PR #244's commit messages and body claim. Those messages state
      screening against "1,380 prior records" and against "the 57 KN-FIND
      durable findings"; in fact 5 barrier titles were blank and 29 KN-TECH
      records were absent. The claim should be read as: screened against an
      INCOMPLETE corpus, with the gaps now enumerated here.
    mitigating_measurement: >-
      Six generators bypassed the damaged corpus and read knowledge/findings/
      and knowledge/techniques/ directly, which is why several records cite
      KN-TECH-057 correctly despite its blank corpus entry. Twelve records
      cite it; five state an isogeny path-finding baseline and do not
      (3da739, ba4e37, 750ead, 8a6cb5, bba3dc; 5ee6b4 borderline).

  intra_batch_duplication: >-
    A FAILURE MODE THE PIPELINE DID NOT CHECK AT ALL. Nine generators ran in
    parallel and never saw each other's output, and the Coordinator's dedup
    ran only against PRIOR records, never within the batch. Reviewers found at
    least eleven same-round collisions with no cross-citation, several of them
    contradictory rather than merely redundant:
      486ae2 <-> d6d973 (one contains the other's entire claim)
      812554 <-> 2ef5c8 (same model; 2ef5c8 derives the correct answer)
      5ee6b4 <-> 28361d (flatly contradictory)
      40aab9 <-> bba3dc (bba3dc states the correct criterion)
      4d77a6 <-> ceca08 (same identity; ceca08 makes 4d77a6 vacuous at scale)
      71c2b2 <-> f313da (a determinant identity in one attacks the other's
                         load-bearing heuristic)
      83b3ba <-> bfee7e, ae175e <-> f104a2, b9a74c <-> 3d3be9,
      ba4e37 <-> 40aab9, f4edc6 <-> 0e9fa1 (the last two directly contradict
                         each other on whether the KN-FIND-007 mean is an identity)
    Also: d07cd4's discriminated_from against IDEA-20260805-bd8339 is FALSE
    against the record it cites -- bd8339 already defines d_max over distinct
    irreducible factors and already names the radical lift as its undischarged
    obligation.

  unbound_records: >-
    Seven proposals filed in the same window by a concurrent session carry NO
    goal_id: 3f8a2b, 4f3ef4, 621df3, 7c4e9d, a3f7c1, b8e2d4, c5f9a2. They are
    not bound to any campaign. Three of them (a3f7c1, b8e2d4, c5f9a2) are
    oracle-class proposals and were refuted above; 4f3ef4's x-oracle is group
    equality up to sign, i.e. inside KN-FIND-b7e091's GGM-simulability
    closure, which its own novelty_screen never checks.

  instrument_finding_of_note: >-
    IDEA-20260808-b3c97b proposes a detector for fabricated artifact digests --
    the defect class this program found in EV-ECDLP-65b004. A reviewer measured
    its distributional D2 score at 0.1148 on the four real placeholders against
    a genuine-digest mean of 0.1237, i.e. BELOW genuine: essentially no power on
    its own motivating artifact. The Coordinator could not reproduce that exact
    statistic (an independent nibble-transition metric DOES separate them,
    0.0164 vs 0.0625) and records that discrepancy rather than adopting the
    number. The reviewer's operative conclusion is confirmed regardless: the
    four placeholders are 62 hex characters against a real SHA-256's 64, and
    the LENGTH check -- not any distributional score -- is what actually caught
    them in this program's own history.

  disposition:
    - >-
      NO PROPOSAL IS WITHDRAWN OR EDITED. All 126 stand as filed. The refuted
      records are marked here as do_not_dispatch pending correction by their
      authors.
    - >-
      Records with a REFUTED verdict must not be routed to /design-experiment
      until the named defect is answered, because the defect voids the
      headline the experiment would test.
    - >-
      Records with PARTIAL-OVERLAP need the discriminated_from text supplied
      verbatim in the slice reports before dispatch.
    - >-
      The full per-record reports, with the computations each reviewer ran,
      are committed at ideas/rescreen-20260808/ (slice1..slice6).

  process_recommendations:
    - >-
      Run each record's OWN declared control before filing. This one check
      would have caught the majority of the 50 defects at negligible cost, and
      is exactly what KN-TECH's "null sufficiency" technique prescribes -- a
      technique that was invisible in the truncated corpus.
    - >-
      Dedup WITHIN a parallel batch, not only against prior records. Eleven
      intra-batch collisions went unnoticed because no such check existed.
    - >-
      Treat novelty_screen and discriminated_from as claims to be TESTED. The
      first pass's duplicate (2e14f7) cited a record it claimed to have read;
      d07cd4's discrimination is false against the record it names.
    - >-
      Repair the corpus builder: remove the `head -60` truncation and parse
      YAML block-scalar titles instead of reading only the first line.

  limitations:
    - >-
      EXTERNAL NOVELTY REMAINS UNADJUDICATED FOR ALL 126 RECORDS. WebSearch and
      WebFetch failed for every generator and every reviewer in this session.
      Nothing here speaks to novelty against the published literature. One
      reviewer flagged IDEA-20260808-040db9 as, to its recollection, the core
      of published SNOVA cryptanalysis -- unverifiable here and named as an
      open risk rather than a finding.
    - >-
      The Coordinator independently re-derived nine of the roughly forty
      headline-voiding defects. The remainder rest on the reviewers' own
      reported computations, which are recorded in the slice reports but were
      not all re-executed.
    - >-
      Reviewer verdicts of NOVEL mean "not duplicated within the corpus checked
      and internally sound as far as tested". They are not a positive novelty
      finding.

