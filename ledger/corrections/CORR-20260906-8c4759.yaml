correction:
  id: CORR-20260906-8c4759
  recorded_at: '2026-09-06'
  record_type: process
  supersedes: CORR-20260906-34357d
  also_supersedes: CORR-20260906-72f696
  corrected_record: ledger/corrections/CORR-20260906-34357d.yaml
  field: which superseding record governs ledger/decisions/DEC-20260905-01a1b4.yaml
  goal_id: GOAL-ECRANK-002
  corrected_by_lane: GOAL-SSI-001
  raised_by: >-
    A MERGE, not a review. Merging origin/main into
    claude/isogeny-search-prime-fields-5xcc2x produced an add/add conflict at
    ledger/corrections/schema-supersessions/20260906/ledger__decisions__DEC-20260905-01a1b4.v2.yaml
    and a content conflict in tools/schema_supersession_registry.yaml. The branch
    was 73 commits behind at the time.
  what_happened: >-
    TWO SESSIONS REPAIRED THE SAME RECORD CONCURRENTLY AND NEITHER KNEW. This lane
    repaired DEC-20260905-01a1b4 because it failed the whole-corpus kb check on
    every branch (CORR-20260906-72f696, completed by CORR-20260906-34357d as a v3
    after CI showed the first attempt had converted an unparseable record into a
    schema-invalid one). Independently, commit c4d3fa29a on main repaired the same
    record AND the three sibling records this lane had explicitly declined to touch
    and recorded as belonging to their owner: DEC-20260905-36847f,
    DEC-20260905-e140ee and TASK-20260905-2c383f.
  corrected_value: >-
    MAIN'S REPAIR GOVERNS. The registry entry for DEC-20260905-01a1b4 points at
    main's ledger__decisions__DEC-20260905-01a1b4.v2.yaml, and THE REGISTRY IS THE
    SOLE AUTHORITY on which replacement is in force: tools/schema_supersession_registry.yaml
    hash-pins both sides of every binding, and kb's stager and tools/validate_ledger.py
    route readers through it, so an unregistered file is inert to every consumer.
    This lane's v3 file is RETAINED IN THE TREE AND UNREGISTERED, not deleted.
  why_v3_is_retained_rather_than_deleted: >-
    STATED BECAUSE THE FIRST PLAN WAS TO DELETE IT AND THAT PLAN WAS WRONG TWICE
    OVER. First mechanically: check_merge_hygiene.py, running as a pre-commit hook,
    puts every staged path in its candidate set and reads it from disk, so a staged
    DELETION is reported as "does not parse: No such file or directory" and the
    merge commit is refused. That is a hook limitation on deletions rather than an
    integrity finding, and the correct response was not to bypass the hook with
    --no-verify. Second on the merits: v3 is an immutable correction artifact that
    was already committed and pushed, and this program's rule is that corrections
    SUPERSEDE and never overwrite. Deleting a pushed correction artifact to tidy the
    tree is the overwrite pattern wearing a different hat. The ambiguity a reader
    might feel on finding two replacements is resolved by the registry, not by
    removing evidence that a second repair happened.
  why_this_is_not_picking_a_side: >-
    AGENTS.md directs that a merge conflict is not resolved by picking a side, but
    by a Coordinator creating a new superseding record. That is what this record is.
    The resolution is not a preference between two equal repairs: main's version is
    already committed to the shared trunk, is registered there, is functionally
    equivalent on the limb this lane cared about - it carries the coordinator_decision
    envelope, its three context items, and the "PR #769" text that the original
    unquoted-comment defect destroyed, all verified by reading main's file - and it
    covers FOUR records where this lane's covered one. Preferring the trunk's
    committed state over an unmerged branch's is the rule that makes concurrent
    worktrees converge.
  what_this_lane_got_wrong_and_what_it_got_right: >-
    RIGHT: the diagnosis, the mechanism, and the refusal to widen the disclosed-debt
    set to absorb the failure. WRONG, or at least wasteful: this lane crossed a
    campaign boundary to repair another goal's record without checking whether that
    goal's owner was already repairing it, and the check was available - origin/main
    had moved and a fetch would have shown it. The concurrency doctrine in CLAUDE.md
    is explicit that every rule there exists because a writer was made to read shared
    state it had no reason to read; this is the mirror image, a writer that did not
    read shared state it had every reason to read. The correct sequence was fetch,
    then check whether the owning campaign had acted, then repair only if not.
  cost_stated_plainly: >-
    Duplicated effort across two sessions, one add/add conflict, one content
    conflict, and three superseded correction records for a defect that needed one.
    No research artifact was affected, no evidence changed, and the kb whole-corpus
    check that motivated the original repair is satisfied by main's version.
  verification:
    - >-
      main's v2 read directly: top-level key is coordinator_decision, the record
      carries three context items, and the string "PR #769" survives - the exact
      text the original unquoted "#" comment defect had orphaned.
    - >-
      The resolved registry carries 104 entries, main's count, and its
      DEC-20260905-01a1b4 entry names main's v2. This lane's only registry addition
      this session was that same record's entry, so nothing of this lane's work is
      lost that main's does not already cover.
  scope_and_limits: >-
    PARSEABILITY AND REGISTRY BOOKKEEPING ONLY. Not evidence, in either direction,
    about any mathematical or cryptanalytic claim; an infrastructure defect is never
    negative mathematical evidence. This record neither endorses nor disputes the
    cancellation the archived decision states, and takes no position on
    GOAL-ECRANK-002's research content. It lifts no citation prohibition.
  citations:
    - ledger/corrections/CORR-20260906-72f696.yaml
    - ledger/corrections/CORR-20260906-34357d.yaml
    - ledger/decisions/DEC-20260905-01a1b4.yaml
    - ledger/corrections/schema-supersessions/20260906/ledger__decisions__DEC-20260905-01a1b4.v2.yaml
    - tools/schema_supersession_registry.yaml
