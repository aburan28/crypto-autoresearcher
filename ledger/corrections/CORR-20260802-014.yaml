  reason: >-
    Two independently numbered decision lanes both wrote records directly into
    the ledger root. The root lane (THM_INCBARRIER / THM_BKKMV theory notes and
    EXP-SIG-* / EXP-DREG-* / EXP-GPS-* measurements, targeting H-INCB-001,
    H-BKKMV-001, H-SIG-001, H-DREG-001) reused seven IDs that the canonical
    ledger/decisions/ lane had already assigned to unrelated GOAL-CRYPTO-001
    BATCH decisions. tools/validate_ledger.py refused all fourteen root records
    ("new root-level ledger record is forbidden") and, because the root copies
    were indexed first, the seven canonical GOAL-CRYPTO-001 decisions were
    reported as duplicate IDs and dropped from the record registry entirely,
    disabling their cross-reference and knowledge-promotion checks. AGENTS.md
    forbids ID reuse. The canonical lane's IDs are retained unchanged; the seven
    colliding root records move to the next free IDs in their own date lanes and
    the seven non-colliding root records keep their IDs. All fourteen move into
    the canonical subdirectories, which is where the validator requires them and
    where the frozen legacy inventory does not apply — these records postdate the
    inventory's freeze boundary (its most recent entry is DEC-20260722-006), so
    they are gate-violating rather than gate-predating and are repaired instead
    of grandfathered. This is the remedy already applied at two earlier merge
    boundaries (CORR-20260724-001, CORR-20260724-003/004).
  content_changes:
    - >-
      Bodies are preserved verbatim apart from (i) the id field where remapped,
      (ii) an added `relocation:` block naming the prior path and remap, and
      (iii) fields the current schema requires that can be stated without
      inventing data: `knowledge_promotion` on the nine decisions (all
      promoted: [] with a procedural not_warranted reason — no research claim is
      created, withdrawn, or re-opened), and `proof_status`/`proof_refs` on four
      of the five evidence records. This is the same latitude CORR-20260724-003
      recorded: "canonical decision copies preserve the historical conclusions
      and add only remap and required promotion metadata."
    - >-
      No number, measurement, control result, boundary, limitation, or
      unresolved confound was altered, added, or removed in any of the fourteen
      records.
    - >-
      proof_status was declared, never derived: EV-DREG-004 is `not_applicable`
      (the record asserts no mathematical result — it is partial-cell telemetry
      plus an infrastructure-incident narrative), and EV-GPS-001, EV-SIG-006 and
      EV-SIG-008 are `empirical_only` with empty proof_refs, the declared basis
      that docs/claims-and-verification.md provides when no counterexample
      certificate or derivation note exists.
    - >-
      EV-SIG-007 received NO schema fields. It was written as a flat mapping
      with no top-level `evidence:` key and states no direction, strength or
      claim_tier; supplying those would be an evidence judgement, not a
      relocation. It is relocated verbatim and its single validator error is
      carried as a named open defect.
  unrepaired_defects_carried_forward:
    - ledger/evidence/EV-SIG-007.yaml: >-
        missing top-level `evidence:` key (and, consequently, direction,
        strength, claim_tier, proof_status, proof_refs). Repair path: a fresh
        review of the EXP-SIG-007 receipts issuing a superseding
        schema-conformant record.
    - ledger/evidence/EV-GPS-001.yaml: >-
        no `hypothesis_id` (its GPS-1/GPS-4 labels are research-note labels, not
        ledger hypotheses); `experiment_ids: [EXP-GPS-001]` and all six cited run
        IDs do not resolve, because experiments/EXP-GPS-001/ carries run
        directories but no specification.yaml and no run manifests. Repair path:
        register the GPS hypotheses in ledger/hypotheses/ and reconstruct the
        EXP-GPS-001 contract and manifests from the surviving raw.json/command.txt
        artifacts, or supersede the evidence record.
    - ledger/evidence/EV-SIG-008.yaml: >-
        cited run IDs from RUN-EXP-SIG-008-l onward (plus duplicated -q/-r
        entries) have no committed manifests; the record itself states the
        artifacts were destroyed by concurrent external agents. Not repairable
        without fabricating provenance.
    - ledger/evidence/EV-DREG-004.yaml: >-
        three of four run_ids entries are collective range labels
        ("...-CONT-1..32", "...-REBUILD-A", "...-REBUILD-A-CONT-1..52") rather
        than resolvable run IDs. Repair path: enumerate the 32 committed CONT
        manifests explicitly; the REBUILD-A series has no committed manifests.
    - ledger/decisions/DEC-20260727-013.yaml: >-
        cites ledger/EV-GPS-002.yaml and experiments/EXP-GPS-002/analysis.md;
        neither exists in this repository. Its conclusions are therefore not
        checkable in-tree.
  affects:
    - >-
      References to the seven remapped IDs that were written by the ROOT lane
      must be read at their new IDs. Two such references exist and are NOT
      edited, because both live in immutable records:
      ledger/CORR-20260724-002.yaml evidence_refs cites DEC-20260724-002, which
      reads as DEC-20260724-024; and ledger/SYNTHESIS-20260718.md Addendum 3
      names "DEC-20260724-001…005", which reads as DEC-20260724-023, -024, -025,
      -026 and DEC-20260724-005.
    - >-
      Every OTHER reference to DEC-20260724-001..004 and DEC-20260727-001..003 in
      the repository refers to the canonical GOAL-CRYPTO-001 lane, whose IDs are
      unchanged. No such reference is retargeted.
    - >-
      DEC-20260724-005 and DEC-20260727-004 keep their IDs because both slots
      were free in ledger/decisions/. DEC-20260727-004 fills a gap in an
      otherwise contiguous canonical sequence (-005 through -010 exist), so a
      future merge that independently assigns DEC-20260727-004 in the canonical
      lane would collide; the remedy would again be a remap under a new
      correction, never an edit.
    - >-
      tools/legacy_ledger_inventory.yaml is NOT edited. Its `records` map must
      equal the set of root-level ledger records observed on disk
      (tools/test_validate_ledger.py::test_legacy_inventory_covers_and_freezes_every_root_record),
      and its `remapped_ids` keys must be keys of `records`
      (::test_legacy_id_remaps_resolve_to_canonical_records). The fourteen root
      files are being removed, so they cannot appear in either map. Freezing them
      instead would have retroactively grandfathered fourteen post-boundary
      records and suppressed their remaining schema defects as read-only legacy
      warnings; relocation keeps those defects visible.
    - >-
      ledger/write_decisions_20260724.py and ledger/write_decisions_20260727.py
      are generator scripts that write these records back into the ledger root.
      Re-running either would recreate the violation.
    - >-
      Historical snapshot and ledger commits remain authoritative for the paths
      and hashes they recorded; HEAD navigation uses the relocated paths and the
      remapped IDs.
