correction:
  id: CORR-20260807-2c9ae4
  recorded_at: '2026-08-07'
  recorded_by: coordinator (GOAL-ENDO-001, BATCH-cb71b5)
  type: mis_specified_criterion_and_decomposition_errors
  supersedes: []
