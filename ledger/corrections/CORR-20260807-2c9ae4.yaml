  - harness/run_icinv.py
  - experiments/EXP-ICINV-180a0d/runs/RUN-ICINV-p4001-a/raw-result.json
  - experiments/EXP-ICINV-9b1f7c/runs/RUN-ICINV-p4001-uniform/raw-result.json
  record_type: run
  record_id: >-
    RUN-ICINV-p4001-a, RUN-ICINV-p4001-b, RUN-ICINV-p6007-a, RUN-ICINV-p6007-b,
    RUN-ICINV-p4001-uniform, RUN-ICINV-p6007-uniform (the decay_verdict string
    only), and DECOMPOSITION.md sections T4 and T5
  field: decay_verdict; DECOMPOSITION.md T4 "what varies"; DECOMPOSITION.md T5 conclusion
  prior_value: >-
    (A) Every EXP-ICINV run's `decay_verdict` reads "NOT explained by the trace
    identity -- investigate". (B) DECOMPOSITION.md T4 lists what varies within an
    isogeny class as: the j-invariant, the isomorphism class of (a,b), the
    endomorphism-ring level in each ell-volcano, h(End(E)), and the number of
    F_p-rational ell-isogenies. (C) DECOMPOSITION.md T5 concludes that goodness
    identifiable only by a global address "is unreachable, and the lane dies on
    cost even if the variance is large."
  corrected_value: >-
    (A) THE IDENTITY HOLDS AND THE THRESHOLD WAS WRONG. The check tested whether
    the full-field within-class variance of the liftable count was below 1e-9,
    i.e. ZERO. But the identity #liftable_x = (#E - 1 + z)/2 predicts that
    variance to be Var(z)/4, not zero, because #E is class-invariant and z is not.
    At p = 4001 the observed value is 0.249385729288988 and Var(z)/4 is
    0.249385729289016 -- agreement to 2.9e-14. The correct verdict is FULLY
    EXPLAINED. The superseding run is RUN-ICINV-p4001-identity.
    (B) T4's list OMITS THE GROUP STRUCTURE OF E(F_p). Tate fixes the ORDER across
    an isogeny class; it does not fix the decomposition into Z/n1 x Z/n2. This
    batch's own data shows it directly: at p = 2003, trace 36, the class splits 52
    curves with z = 3 against 52 with z = 1, so the rational 2-torsion -- and
    hence the group structure -- varies within a single class. The omission
    matters because that variation is the entire explanation of the liftable-count
    result in (A).
    (C) T5'S COST CONCLUSION IS WRONG, AND CORRECTING IT MAKES THE CAMPAIGN'S
    NEGATIVE STRONGER RATHER THAN WEAKER. Identifying a specified member of the
    class is claw-finding on Cl(O) with h ~ p^{1/2}, costing p^{1/4+o(1)}. Since
    1/4 < 1/2, that is CHEAPER than the rho baseline it is charged against, so the
    reachability gate does NOT close the lane on asymptotic cost and no lane may
    be dismissed on that ground. What actually closes the lane is the measurement:
    there is no within-class variance to go and find. A negative that rests on
    "nothing varies" is a substantive result; one that rested on "you could not
    reach it anyway" would have been an excuse, and the two must not be confused.
    Concrete cost is a separate matter and is model-dependent: at 2^256 with a
    conservative O(ell^3) per-step model the identification is 2^96-2^112 against
    an N^{1/3} online phase near 2^89, i.e. it fails concretely by 2^7-2^23 while
    passing asymptotically. Both statements must travel together.
  provenance:
    a_found_by: >-
      The RQ-INSTR-f8faa0 lane's independent proposal session (IDEA-20260807-c015f5),
      which checked the arithmetic against the committed run record and reported
      that the flagged quantity equals Var(z)/4 to 2.9e-14. Reproduced by the
      Coordinator against RUN-ICINV-p4001-uniform before this record was written.
    b_and_c_found_by: >-
      The RQ-ICINV-475b5e lane's independent proposal session (IDEA-20260807-c36472,
      IDEA-20260807-0a3272), which flagged both as corrections to campaign inputs
      and explicitly did not act on them. The RQ-MTGT-2cabee lane
      (IDEA-20260807-a127ab) reached the same p^{1/4} conclusion independently and
      added the concrete-cost split.
  what_this_does_not_affect:
  - >-
    No measured number changes. (A) is a verdict STRING computed from numbers that
    were correct; the underlying observed and predicted variances are unchanged and
    were recorded in full in every run's raw-result.json, which is why the error was
    catchable from the committed artifact alone.
  - >-
    (B) and (C) are errors in the decomposition's prose, not in any measurement.
    No experiment was designed around the omitted group structure, and no result was
    justified by the T5 cost claim.
  - >-
    The campaign's headline finding is UNCHANGED and, under (C), rests on firmer
    ground: the isogeny-class grouping carries no detectable information about
    decomposition efficiency under the corrected sampler at two primes.
  required_action:
  - >-
    Read DECOMPOSITION.md T4 as including the group structure of E(F_p) in its
    varies-within-class list, and T5 as stating that identification costs
    p^{1/4+o(1)} -- asymptotically below the rho baseline, concretely above it under
    a conservative per-step model -- and NOT as a cost-based closure. The file is not
    edited; this record is its correct reading (AGENTS.md rule 4).
  - >-
    No lane in this campaign may be closed on a reachability-cost argument without
    stating the per-step model and the parameter regime, because the asymptotic and
    concrete verdicts disagree.
  - >-
    Cite RUN-ICINV-p4001-identity for the decay verdict. The superseded runs' other
    rows remain citable.
