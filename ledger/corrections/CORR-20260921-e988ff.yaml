  defects:
    - id: D-1
      what: >-
        The report's own D = 3 deficit figure contradicts its "first-fall reading
        is plainly 4", and therefore its "may well come out 0".
      where: >-
        report.md section 7 item 1: "It may well come out 0 as well -- the D = 3
        deficit is 1 everywhere and the D = 4 deficit is 46-71 everywhere, so a
        first-fall reading is plainly 4 -- and 0 there would be a *real* trigger
        of the falsification criterion's antecedent".
      what_the_report_itself_records: >-
        Section 1.5: "D = 3: 126 completed measurements, deficit_vs_semiregular
        in {0, 1} (1 on every structured instance, 0 on the planted-point
        control). D = 4: 111 completed measurements, deficit ranging 0 ... 71
        (46 ... 71 on structured cells)." Section 1.5 also names the reading:
        "A first-degree-of-rank-deficiency reading -- one of the three readings
        H-SEMBIN-112e2e explicitly names -- is computable from those two columns".
      the_definition_invoked: >-
        H-SEMBIN-112e2e.mechanism defines the Macaulay-rank statistic as reporting
        a degree as active "whenever the degree-d block contributes rank the
        degree-(d-1) block did not", and lists "first-degree-of-rank-deficiency"
        as one of three readings GOAL-DREG-001 may report. Under that reading the
        statistic is the LEAST probed degree at which deficit_vs_semiregular is
        non-zero.
      truth: >-
        A deficit of 1 at D = 3 IS a rank deficiency at D = 3. Under the reading
        the sentence invokes, the first fall is therefore at or below 3 on every
        structured instance, not 4. Over the degrees actually probed it reads 3;
        it is an UPPER BOUND rather than a pinned value, because the package
        contains no single-level measurement at D = 2 (the only single-level
        degrees present anywhere in results-table.json are 3 and 4). With
        d_F4 = 4 on every structured instance in the census, D - d_F4 under this
        reading is -1, not 0. The sentence's premise (deficit 1 at D = 3) and its
        conclusion (first fall 4) cannot both hold.
      why_it_matters: >-
        The sentence tells a successor what the zero-run recomputation "may well"
        return and what a 0 there would mean. Under the one reading the report
        itself says is computable from the package, 0 is NOT a reachable outcome
        on any structured instance, so the antecedent of H-SEMBIN-112e2e's second
        falsification condition ("D - d_F4 = 0 on every measured instance") cannot
        be triggered by that recomputation. A successor following section 7 or
        objections.json's next_concrete_action, computing 4 - 4 = 0 because the
        report said the first fall is "plainly 4", would record a false
        falsification trigger. The report's own section 4(iii) analysis of the
        consequent is unaffected; it is the antecedent that this record corrects.
      what_a_minus_one_is_and_is_not: >-
        -1 is a d_F4 > D instance, which is the shape of H-SEMBIN-112e2e's FIRST
        falsification condition (the direction of the map), not its second. This
        record does NOT assert that condition fires. Whether
        "first-degree-of-rank-deficiency against the semi-regular prediction, as
        this run's re-implementation computes it" is GOAL-DREG-001's statistic
        is exactly the un-made Coordinator choice the report itself says must
        precede any computation (section 1.5, section 7 item 1, next_concrete_action);
        a uniform deficit of exactly 1 at D = 3 is as consistent with a
        convention offset in the semi-regular prediction (field equations, constant
        term) as with a structural fall, and the report's own section 1.2-1.3
        record that the single-level instrument was never calibrated against an
        archived GOAL-DREG-001 rank. The corrected statement is only: under that
        reading the committed data give -1 everywhere, so "may well come out 0" is
        unsupported.
      consistency_with_PD_5: >-
        DEC-20260921-2c62d7 PD-5 already records that for a degree-valued statistic
        defined as the LEAST D reaching a stated rank condition (solving degree,
        degree of regularity), nothing is computable from the package at zero runs,
        because the sweep stops at D = 4 where every structured instance is far
        from determining. This record covers the remaining reading. Taken
        together: under two of the three readings the recomputation is not
        possible from committed data, and under the third it returns -1 (upper
        bound on D of 3), so under none of them is the report's "may well come
        out 0" supported.
      severity: >-
        Medium. No status, verdict, or evidence strength moved on this sentence;
        the J-2 verdict rests on OBJ-1, which is untouched. The defect is in
        forward guidance a successor is invited to act on, and it points that
        successor at the wrong falsification condition.

