  items:
    - id: K1
      field: TASK-20260923-e3b590 SC-4 (the protected set in blind-phase-hygiene.yaml)
      prior_value: >-
        Every literal the Coordinator supplied out of band is protected. The
        --blind-history check must PASS on HEAD. If it fails, stop, and give
        the re-deriver a clean worktree whose reachable history passes.
      corrected_value: >-
        Hygiene item `ai` is REMOVED from the protected set. The file keeps the
        other 65 entries with their labels unchanged, and records the removal
        as `removed: [{item: ai, by: CORR-20260923-7c14d9}]` under
        blind_phase_hygiene. The removed entry's digest is not written anywhere.
        Every other SC-4 requirement stands: after the archive commit, run the
        check on HEAD; it must PASS with 65 entries; a failure stops the task.
      facts: >-
        The pre-commit dry run on main 9657b98 matched item `ai` in exactly two
        commits: dd9e5545a (2026-09-22, EXP-ICPERF-783e9e) and 647035403
        (2026-09-22, EXP-FROB-ec08b5). In both, the token is a binary-field
        degree n in a list of field degrees. It is unrelated to
        RUN-CERTBIN-3b7e05, and both commits are one day older than the run.
        No other item matched.
      reason: >-
        This is a false positive of a token-hash check on a small integer that
        is also a standard field degree. It is not a leak. Keeping the item
        would require giving the re-deriver a history with no main ancestry,
        option (b). That was rejected: it gives up the reproducibility of the
        re-deriver's tree, which is a real cost, to protect a statistic that
        buys nothing. The removed literal is a NULL-FAMILY arm size. It is not
        among J6's quantities: the re-deriver computes on F-S3 instances only,
        at D = 4. Knowing it cannot bias any value the re-deriver produces or
        any comparison J7 makes. The prose outcome-hygiene rule still covers
        it: no measured value in any commit message, PR text or bus message.
        Only its mechanical check is withdrawn.
      residual_risk: >-
        The two cited commits let a reader who opens this record infer the
        removed value. That is why this record and the addendum are added to
        blind_from.
    - id: K2
      field: TASK-20260923-e3b590 artifact_paths and deliverables (staging and PR)
      prior_value: >-
        The archive stages DEC-20260923-4d7a19, CORR-20260923-a86e3b,
        review-plan.yaml and the seven TASK cards. It pushes and refreshes
        PR #1385.
      corrected_value: >-
        Those ten files are already in main's tree through PR #1388 (merged).
        They were committed to keep them from being lost, outside any archival
        task. PR #1385 is also merged. The archive therefore:
        (i) does NOT re-stage them. It binds each by sha256 at HEAD under
            `prior_commit_bindings`, with the commit that introduced it, next to
            the 5016669 bindings of DEC-20260923-4d7a19 R-5. It asserts that the
            bytes at HEAD equal the bytes written by the Coordinator. Any
            difference stops the task.
        (ii) stages exactly these files:
             - blind/blind-inputs.json
             - blind-inputs-key.json
             - blind-phase-hygiene.yaml (65 entries plus the `removed` note)
             - archives/TASK-20260923-e3b590/snapshot-receipt.json
             - ledger/corrections/CORR-20260923-7c14d9.yaml
             - ledger/decisions/DEC-20260923-2b6e84.yaml
             - coordination/review/certbin-20260923-c51f07/review-plan-addendum-1.yaml
             The last three are added to the declared set by this correction.
        (iii) opens a NEW PR against main naming the records, in place of
              refreshing #1385. It carries no measured value and no verdict.
      reason: >-
        The committed card cannot be edited, and a record already on main
        cannot be staged twice. Binding by content is the only honest
        archival relation left. PR #1388's commit has no receipt of its own.
        This receipt supplies the binding, and it discloses that the
        commit-before-archive order was inverted.
    - id: K3
