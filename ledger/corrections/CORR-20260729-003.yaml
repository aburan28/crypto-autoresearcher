correction:
  id: CORR-20260729-003
  recorded_at: '2026-07-29'
  record_type: claim
  record_type_note: >-
    The template enumeration for record_type is candidate | claim | run and has no
    coordination value. claim is used as the closest permitted token, exactly as
    CORR-20260724-001 and CORR-20260727-001 did for merge and identifier repairs.
    The corrected artifact is a dispatch-queue task card, not a research claim.

  corrected_record: coordination/goals/GOAL-ECDLP-001/batches/BATCH-010/dispatch_queue.json
  corrected_task_id: TASK-20260728-002
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-010

  summary: >-
    The BATCH-010 snapshot archive TASK-20260728-002 committed 195 paths while its
    task card declared 7, and its card's archive.path_sha256 was left empty. The
    commit and its receipt are honest; the DECLARATION is what is wrong. This record
    documents the scope overrun rather than repairing the card, because editing the
    declaration to match a commit that already happened would invert the purpose of
    declaring scope in advance.

  measured_facts:
    method: >-
      Read on the tree at origin/main bf9e2819. Path counts from
      `git show --pretty="" --name-only 777b1e43 | wc -l` and from the committed
      receipt and queue card. No value is relayed.
    card_declared_paths: 7
    card_archive_path_sha256_entries: 0
    commit_777b1e43_paths_changed: 195
    receipt_path_sha256_entries: 195
    receipt_commit_sha: 777b1e43e509c112c50d67d952e5f82dee0beee4
    receipt_parent_sha: e1847fc8496cfa4dab04671300b78552e1f21a56
    undeclared_paths: 188
    overrun_content: >-
      The 188 undeclared paths are the EXP-RT1476-001 run package - run
      directories with certificates.json, command.txt, environment.json and
      manifest.yaml. The archive committed an entire experiment's run artifacts
      under a card that named seven paths.

  what_is_and_is_not_wrong:
    receipt_is_honest: >-
      snapshot_commit_receipt.json records commit_sha 777b1e43, its parent, and all
      195 path hashes. It does not misreport what was committed.
    commit_is_legitimate: >-
      The 195 paths are a real run package for a real experiment. Nothing was
      committed that should not have been; the objection is to the declaration, not
      the content.
    declaration_is_wrong: >-
      The card declared 7 and archive.path_sha256 is empty, so the pre-commit
      statement of intent does not match the commit.
    consequence: >-
      tools/research_dispatch.py refuses to render any plan for BATCH-010. First it
      rejects the completed archive for a null archive.commit_sha; supplying that
      from the receipt then trips
      "path_sha256 contains paths outside its commit scope", because the receipt's
      195 entries exceed the card's 7 declared paths. The batch is therefore
      unrenderable and GOAL-ECDLP-001 cannot open a successor batch through the
      dispatcher.

  why_this_is_a_correction_and_not_a_repair:
    - >-
      Rewriting the card's artifact_paths from 7 to 195 would retrofit a declaration
      to a commit that already exists. The archive contract's entire value is that
      scope is declared BEFORE the commit and checked after; a post-hoc declaration
      that always matches proves nothing.
    - >-
      Deleting hashes from the receipt to fit the card would discard truthful
      recorded evidence in order to satisfy a false declaration. That is worse.
    - >-
      The honest repair is a superseding record that states what was declared, what
      was committed, and why they differ, leaving both the card and the receipt
      untouched. That is this record.

  corrected_statement: >-
    BATCH-010's snapshot archive TASK-20260728-002 committed commit 777b1e43, which
    changed 195 paths, under a task card declaring 7. The undeclared 188 paths are
    the EXP-RT1476-001 run package. The commit and its receipt are accurate; the
    card's declaration is not, and the card's archive.path_sha256 was never filled.
    No research claim is affected: BATCH-010 closed on the merits at 8f408cdf with
    DEC-20260728-003 recording weaken on H-SUBRES-001, and that decision does not
    depend on the declaration count.

  scope_of_this_correction:
    corrects: >-
      The declared-versus-committed scope of TASK-20260728-002 only.
    does_not_correct:
      - >-
        DEC-20260728-003 and the BATCH-010 weaken on H-SUBRES-001, which stand on
        their own evidence.
      - >-
        The EXP-RT1476-001 run package, which is legitimately committed and whose
        records are unaffected.
      - >-
        The separate identifier repair already recorded in CORR-20260728-001
        (EXP-RT1476-001 / H-RT1476-001 / EV-RT1476-001 renumbered to the SUBRES
        series).
      - >-
        TASK-20260728-004's state, addressed under open_items below.
    changes_no_hypothesis_status: true
    is_not_a_cryptanalytic_result: true

  open_items:
    - id: OI-1
      item: >-
        TASK-20260728-002 remains state completed with archive.commit_sha null. It
        cannot be bound without also resolving the 7-versus-195 declaration, so it
        is left as found and documented here.
    - id: OI-2
      item: >-
        TASK-20260728-004 reads state running with archive.commit_sha null, although
        its ledger archive committed at 8f408cdf and its receipt was bound in a
        separate commit ec0a0169. The batch is finished; the card lags it. Clearing
        a running marker on another session's card is not this record's to make.
    - id: OI-3
      item: >-
        Deciding how BATCH-010's queue should be brought to a renderable state -
        whether by a queue amendment recording the overrun, by closing the batch out
        of band, or by opening BATCH-011 against a fresh queue - is a Coordinator
        decision on the GOAL-ECDLP-001 line and is deliberately not taken here.

  recorded_by: orchestrator
  authority_note: >-
    Written from a side branch by the session that measured the discrepancy. It
    creates no decision record, changes no status, edits no immutable record, and
    makes no queue amendment. Its only claim is the measured declared-versus-
    committed gap and the reason a card edit is the wrong repair.
