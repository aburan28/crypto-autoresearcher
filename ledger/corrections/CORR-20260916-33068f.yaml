correction:
  id: CORR-20260916-33068f
  recorded_at: '2026-09-16'
  recorded_by: coordinator
  area: ICPERF
  supersedes_on_these_points_only:
    - CORR-20260916-d51133
  does_not_supersede: >-
    CORR-20260916-d51133 stands in full as the disclosure of amendment D6 and as the instruction to
    in-flight reviewers. Its central acts — recording the post-acceptance change to bench.py, marking D6
    UNACCEPTED, and telling reviewers to expect a hash mismatch and review the accepted bytes — are
    correct and unaffected. This record corrects three claims inside it and RAISES the importance of the
    defect it disclosed. Nothing here reverses it.
  origin: >-
    Found by the independent validator of joints R1-R5 (TASK-20260915-3f4b52,
    coordination/review/icperf-20260915-a33cda/TASK-20260915-3f4b52/report.md), which read the accepted
    code and the correction together and flagged two factual errors in it. This session then verified
    both against the repository and found the second one WORSE than the reviewer reported. A third defect
    — the one that matters scientifically — follows from a measurement the same report produced.

    A reviewer catching a Coordinator record written an hour earlier, inside the review round that record
    was written to inform, is the review architecture working as designed. It is recorded that way.

  defects:
    - id: D-1
      what: the poll interval was stated as 2.0 s; it is 0.25 s
      where: >-
        CORR-20260916-d51133, what_this_correction_does_not_assert, third bullet: "the Macaulay2 row's
        49.2 s wall against a 2.0 s poll interval is plainly unaffected".
      truth: >-
        experiments/EXP-ICPERF-e21835/code/bench.py:65 sets RSS_POLL_INTERVAL_S = 0.25. There is no 2.0 s
        interval anywhere in the instrument. The figure was asserted without reading the constant.
      consequence_for_the_conclusion: >-
        NONE for the conclusion drawn, and the conclusion is in fact stronger: a 49.2 s wall quantized to
        a 0.25 s boundary carries at most 0.5% of polling artifact, where a 2.0 s boundary would have
        allowed 4%. The Macaulay2 row is unaffected either way.
      consequence_for_everything_else: >-
        Material, because the same sentence used the wrong interval to guess where the defect COULD bite
        ("the fast SAT rows are where it could bite"). That guess was right, and D-3 below records that
        the reviewer measured how hard.
      severity: >-
        Low as arithmetic, and worth a record anyway: a number stated without reading its source is the
        same class of error as a citation to an unread paper, and this one appeared in a record whose
        entire purpose was provenance.

    - id: D-2
      what: >-
        the claim that code.commit recovers the measured bytes was true for the composite manifest and
        FALSE for epoch 1's own record, which the correction did not distinguish
      where: >-
        CORR-20260916-d51133 in two places: hash_divergence.consequence ("a reader who checks out that
        commit gets the bytes that were measured. THIS IS PRECISELY WHY `code.commit` IS A REQUIRED FIELD,
        and the first time in this campaign that it has done any work") and forward_guidance third bullet
        ("`code.commit` IS WHAT MADE THIS RECOVERABLE").
      what_the_reviewer_said: >-
        "code.commit recovers epoch 2's bytes, not epoch 1's."
      what_this_session_verified: >-
        Worse than that. Epoch 1's manifest records code.git_commit 1fc65075c. At that commit
        experiments/EXP-ICPERF-e21835/code/bench.py DOES NOT EXIST — `git show
        1fc65075c:experiments/EXP-ICPERF-e21835/code/bench.py` produces nothing, hashing to
        e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855, the sha256 of the empty string.
        The repaired instrument was still uncommitted when epoch 1 ran, which is exactly what that
        manifest's own `dirty_tree: true` says.
      the_narrower_truth: >-
        The earliest commit containing the measured bytes d835b1ea… is ecdd3bffd, the epoch-1 snapshot
        commit, and they are then invariant across 6ad48e04c, 2bfdc65b and 5fa8ffed8 — verified this
        session by hashing bench.py at each. So manifest_v2.yaml's code.commit 2bfdc65b DOES recover the
        bytes measured in BOTH epochs, because the bytes were byte-identical across the two epochs.
      why_that_is_luck_and_not_design: >-
        The composite manifest carries ONE code.commit for a two-epoch run. It recovers epoch 1 only
        because (a) this session happened to name an epoch-2 commit that predates no relevant change and
        (b) the bytes did not move between epochs. Had the instrument changed between epochs — which is
        precisely what D6 later did to it — a single code.commit would have recovered one epoch and
        silently misattributed the other, and nothing in the record would have said which.
      consequence: >-
        The recovery holds; the REASON given for it was wrong, and the credit was misplaced. `code.commit`
        did no work for epoch 1: the field that carries epoch 1's provenance is its per-file sha256 plus
        the later commit that first contained those bytes. The honest statement is that epoch 1 is
        recoverable BECAUSE IT DISCLOSED A DIRTY TREE AND HASHED ITS FILES, not because it recorded a
        commit. Its recorded commit points at a tree with no instrument in it.
      what_this_does_not_mean: >-
        NOT that epoch 1's measurements are unverifiable or that RUN-ICPERF-a4a24b's provenance is broken.
        Every measured byte is identified by hash and reachable from ecdd3bffd onward. The defect is in a
        Coordinator record's account of WHY, not in the run.
      severity: >-
        Moderate. A future reader following the corrected record's advice — "review against the bytes at
        code.commit" — would have got the right bytes for the wrong reason, and a reader who tried the
        same move on epoch 1's own manifest would have got an empty file and no explanation.

    - id: D-3
      what: >-
        D6's rank and the rationale for it understated the defect. The reviewer MEASURED the consequence
        and it is large.
      where: >-
        CORR-20260916-d51133, amendment.ranked: "Behind the review round already in flight. D6 is a
        latency fix on a measurement the campaign has not yet begun taking in anger, so accepting it is
        worth less right now than finishing the review of what the instrument does with memory."
      what_the_reviewer_measured: >-
        Frozen RUN-ICPERF-305ca3 against the acceptance run on identical instances with identical conflict
        counts (report.md:127-149, artifacts/r2/fastchild_cms_standalone.json):
        WDSat default n15l5-1-S, 26 conflicts: 0.0049 s frozen vs 0.2515 s accepted — 51x.
        CryptoMiniSat pure_cnf n15l5-1-S: 0.0091 vs 0.2533 — 28x.
        MiniSat pure_cnf n15l5-1-S: 0.0176 vs 0.2535 — 14x.
        CaDiCaL pure_cnf n15l5-1-S: 0.7172 vs 0.7538, rounding up to 3 x 0.25.
        WDSat default n15l5-11-U, 31257 conflicts: 0.2153 vs 0.2513 — 1.2x.
        Its own standalone cryptominisat5 on the same DIMACS at load 0.04: 0.0049 / 0.0048 / 0.0045 s.
        CPU seconds and conflict counts are unaffected, and C-SATREG's exact conflict counts still hold.
      the_consequence_the_ranking_missed: >-
        EVERY WALL-BASED RATIO BETWEEN CHILDREN THAT BOTH FINISH INSIDE 0.25 s READS APPROXIMATELY 1 AT
        THE ACCEPTED BYTES, REGARDLESS OF THE ENGINES BEING COMPARED. The reviewer names the specific
        clauses: P2's wdsat_default_over_* wall ratios and P3's *_wall_censored clauses on l=5. That is
        not a latency nuisance. It is a mechanism that would have flattened the campaign's comparative
        wall-time findings toward parity and produced a confident null — a solver-speedup measurement
        reading "no difference" because the instrument could not resolve either solver.
      why_no_criterion_caught_it: >-
        No acceptance criterion in EXP-ICPERF-e21835 tests a fast child's wall time. The reviewer's
        judgement, which this session adopts: a criterion gap, not a mis-execution. Epoch 2 disclosed the
        quantization honestly as an anomaly; what neither the executor nor this Coordinator did was work
        out what it would do to a ratio.
      corrected_rank: >-
        D6 IS A PRECONDITION FOR ANY WALL-BASED COMPARATIVE MEASUREMENT ON THIS INSTRUMENT, and it is
        ranked accordingly: ahead of collecting any further wall-based row, and ahead of reporting any
        wall ratio among sub-second children. It remains BEHIND finishing the review round in flight,
        which is unchanged and for a reason that survives this correction — the round is nearly complete
        and its findings feed the acceptance D6 needs.
      what_this_does_not_change: >-
        D6's status stays UNACCEPTED. Raising a fix's importance is not accepting it, and
        what_acceptance_would_require in CORR-20260916-d51133 stands verbatim — including its requirement
        that the watchdog null controls be re-run, since D6 touches the loop that decides both kills. The
        reviewer's measurement now supplies the fast-child case that acceptance must exercise: a child
        under 0.25 s whose reported wall tracks the child and not the boundary.
      what_this_does_not_assert: >-
        NOT that any published ICPERF number is wrong. No wall ratio among fast children has been reported
        as a finding by this campaign; the frozen RUN-ICPERF-305ca3 rows were produced by the PREDECESSOR
        instrument, whose 0.0049 s reading the reviewer reproduced standalone to within 0.0004 s. The
        defect is in what the accepted instrument WOULD have reported, which is why it was catchable
        before it cost anything.

  verification_this_session:
    - >-
      RSS_POLL_INTERVAL_S read directly at experiments/EXP-ICPERF-e21835/code/bench.py:65 -> 0.25.
    - >-
      bench.py hashed at 1fc65075c (absent, empty-string hash), ecdd3bffd, 6ad48e04c, 2bfdc65b and
      5fa8ffed8 -> absent, then d835b1ead969989d… at all four later commits.
    - >-
      The reviewer's fast-child table was NOT independently re-measured by this session. It is recorded
      here as a reviewer measurement with its artifact path, and it is load-bearing for D-3's rank, so it
      is one of the things the composition must weigh rather than absorb.

  citations:
    - id: TASK-20260915-3f4b52
      provenance: internal
      what: >-
        The R1-R5 validation report and attestation. Source of D-1, D-2 and the D-3 measurements.
    - id: CORR-20260916-d51133
      provenance: internal
      what: the record corrected here, which stands except on these three points
    - id: RUN-ICPERF-a4a24b
      provenance: internal
      what: the two-epoch acceptance run whose provenance D-2 concerns
    - id: EXP-ICPERF-e21835
      provenance: internal
      what: the contract carrying the criterion gap named in D-3

  forward_guidance:
    - >-
      A ONE-COMMIT `code.commit` CANNOT CARRY A MULTI-EPOCH RUN. When a run spans epochs, record the
      commit PER EPOCH, or record the per-file hashes and the commit that first contained them. A single
      field that happens to be right because nothing moved is indistinguishable, in the record, from one
      that is right by construction.
    - >-
      A DISCLOSED ANOMALY IS NOT AN ASSESSED ANOMALY. Epoch 2 wrote the quantization down and this
      Coordinator repeated it, and neither of us multiplied it out against a ratio the contract predicts.
      The next disclosed anomaly gets the same question asked of it explicitly: which reported quantity
      does this change, and by how much.
    - >-
      A POLLING INTERVAL IS A MEASUREMENT FLOOR. Any timing instrument that samples should refuse to
      report a duration below its own resolution, or report it with the floor attached, rather than
      returning a number indistinguishable from the interval.
