  items:
    - id: E1
      field: strength_basis
      prior_value: >-
        "Every quantity is an exact finite count, not a sample ... Each
        structural claim is carried by at least two derivations that share no
        step (divisor enumeration vs sigma-closure vs exhaustive subspace
        enumeration vs direct orbit iteration; and annihilator/totient vs
        Burnside for the census), and the curve-level claims carry two controls
        that must fail and did fail on every cell. ... clause (iii) is verified
        exactly at 14 cells and argued, not measured, at cryptographic n."
      corrected_value: >-
        `strong` rests on three things, none of them preregistration:
        (1) DERIVATION -- clauses (i) to (iii), as restated by
        CORR-20260923-9a3529, are short derivations (module structure of
        F_{q^n} over F_q[T]; pi^n = id and F_{q^2} not inside F_{q^n} for n
        odd);
        (2) INDEPENDENT RECOMPUTATION in review -- TASK-20260923-69e71b
        reproduced every count and spectrum on all 12 lattice cells by three
        routes of its own, every one of the 14 curve rows end to end, and all
        64 target-table verdicts;
        (3) BLIND AGREEMENT -- TASK-20260923-21ae7f, reading none of the
        producer's artifacts, agreed on every Q1, Q2 and Q3 value it was asked
        for (DEC-20260923-e6cd5d J6 comparison).
        The run's own cross-checks are NOT independent derivations: methods B,
        C and O share one field construction and one sigma matrix, B and C share
        the canonicalisation, O runs on B's output, and the totient and Burnside
        censuses share the coset model and _coset_order. The one code-independent
        pairing inside the run is method A (integer cosets) against the field
        side. The part argued rather than measured at any n is clause (iv): no
        relation collection or linear algebra was run; its verdicts are outputs
        of the model MA-1 to MA-4.
      found_by: TASK-20260923-69e71b F-J1-1; TASK-20260923-33a48b J3(iv).

    - id: E2
      field: 'strength coverage (implicit in `strength: strong`)'
      prior_value: "strong, for all five predictions P1-P5 and the clause (iv) verdicts at every enumerated cell"
      corrected_value: >-
        `strong` covers: the sigma-stable subspace lattice (count, dimension set,
        least faithful dimension) at the 12 lattice cells and the 16 target
        (q, n) rows; the orbit census at the 9 coprime lattice cells and the 15
        census cells; the curve-panel pi-orbit counts on 14 rows (10 cells, 12
        rows with orbit content), read as agreement of the implementation with
        a theorem (E5); and the net LOSS at q = 2, n in {131, 163},
        m in {2, 3, 4, 5}, which holds in every cost model examined in review.
        `strong` does NOT cover the net-win / net-loss verdicts at the other 56
        enumerated (q, n, m) cells: they are exact outputs of the model MA-1 to
        MA-4 and are model-dependent at the cells TASK-20260923-33a48b lists.
      found_by: TASK-20260923-33a48b J3(i), J3(iv).

    - id: E3
      field: >-
        "preregistered" (EV P-headers, observations[9] "The preregistered choice", and H-FROB-6774fb status_note "all five preregistered predictions")
      prior_value: the predictions are described as preregistered before RUN-FROB-627924.
      corrected_value: >-
        PREREGISTRATION ORDERING CANNOT BE SHOWN FROM GIT. All 28 bound paths --
        specification, trial plan, implementation, run package, this EV, the
        hypothesis, the decision and the producer card -- were first committed
        together in 6470354038 at 2026-09-22T05:39:14Z, 17 min 32 s after the
        execution receipt's started_at (05:21:41Z). The only in-artifact ordering
        datum is the trial-plan hash the driver itself writes, which is
        self-attested and cannot order the plan against an earlier execution.
        The 50-bit threshold in H-FROB-6774fb P5 is absent from
        trial-plan-v1.json. The predictions are to be read as stated derivations
        checked by the run, not as preregistered tests. (In observations[9]
        "preregistered" refers to GOAL-FROB-6333a9's own cell choice, which is
        not this experiment's; that sentence is rescoped under E10.)
      found_by: TASK-20260923-69e71b F-J5-1.
      is_not: A custody finding. Under CA-8 it is not a mathematical result, and no value is withdrawn.

    - id: E4
      field: observations[0] (P1 HELD) and measurements (lattice)
      prior_value: >-
        "Four independent methods ... agree exactly on subspace count, dimension
        spectrum and orbit-length census on all 12 lattice cells"
      corrected_value: >-
        Three methods produce counts and spectra (A and B on 12 cells, C on the
        10 cells with q^n <= 256); method O produces censuses only. They agree
        on every lattice cell. The orbit-length census was compared on the 9
        coprime cells only: at the three p | n cells (2,4), (2,6), (3,3) it was
        skipped (orbit_census_agrees null). The methods are not independent
        (E1). The validator's own three routes reproduce all 12 cells.
      found_by: TASK-20260923-69e71b F-J1-1, F-J1-3.

    - id: E5
      field: observations[3] (P4 HELD EXACTLY, 14 of 14) and measurements.orbit_prediction_exact_cells / curve_cells_measured
      prior_value: "P4 HELD EXACTLY, 14 of 14 cells ... every orbit not inside E(F_q) has length exactly n"
      corrected_value: >-
        Under clause (iii)'s premises P4 is a THEOREM (pi^n = id and length 1
        exactly on E(F_q)), so exact equality could not have failed as
        mathematics; a deviation could only have exposed an implementation
        defect. "Exact on 14 of 14" is therefore an implementation-consistency
        check against a theorem, not confirmation of a hypothesis that could
        have been false, and no promotion wording cites it as confirmation. f is
        computed independently of the orbit partition (driver.py:180). The 14 are
        (cell, curve) ROWS over 10 (q, n, dim) cells; 12 rows carry an orbit of
        length n; rows (2,7,3) and (2,7,4) have 1 and 3 points, all pi-fixed, and
        carry no orbit content.
      found_by: TASK-20260923-69e71b F-J2-1, F-J2-4, F-J2-5.
      key_applied: J2_finds_P4_non_falsifiable_as_implemented

    - id: E6
      field: observations[2] (P3 HELD)
      prior_value: >-
        "On all 14 curve cells ... a uniformly random non-stable V' of the SAME
        dimension never does; and the null object ... never does. Both controls
        failed on every cell"
      corrected_value: >-
        Both controls failed, by membership, on every row; there are 10 control
        instances (one V' draw and one null curve per cell), not 14. The seeded
        V' and null curve are not recorded individually in the run artifacts
        (the specification says they are); j_in_subfield is a hard-coded literal,
        not a measurement. The controls have low power: at every cell except
        (2,7,3) no non-stable V' of that dimension can pass on the recorded
        curve, and the null control is forced by algebra once |F_V| > 4. "Never
        does" is false as a universal statement at (2,7,3), where 182 of 11,809
        non-stable V' give a pi-stable factor base of 1 or 3 pi-fixed points.
      found_by: TASK-20260923-69e71b F-J2-2, F-J2-3, F-J2-4, F-J2-6.

    - id: E7
      field: observations[4] (CONSEQUENCE OF P4)
      prior_value: >-
        "the Frobenius-orbit gain in the factor base is EXACTLY n asymptotically
        and never more ... now measured rather than assumed, and it is confirmed
        to be the whole of the gain available at this stage."
      corrected_value: >-
        For n an odd prime, gcd(q, n) = 1, and E with a model not over a proper
        subfield of F_q, the q-power Frobenius alone has orbits of length 1 or n
        on F_V, so the pi-quotient's gain is the mean orbit size g <= n (exactly
        n only asymptotically), checked exactly on 12 orbit-bearing toy-scale
        rows up to |F_V| = 4005 and derived in general. It is a constant factor.
        It is NOT the whole of the symmetry available on F_V: negation, extra
        automorphisms at special j, and the Frobenius of a smaller field of
        definition can each give larger classes (CORR-20260923-9a3529 H2).
      found_by: TASK-20260923-33a48b S3, PTM-6, PTM-7.

    - id: E8
      field: observations[5] (P5 HELD) and observations[6] (availability "governed entirely by d = ord_n(q)")
      prior_value: >-
        "For every m in {2,3,4,5} the orbit trick is therefore a NET LOSS ..." /
        "Availability is governed entirely by d = ord_n(q) ... It does not depend
        on the curve, on the basis used to write field elements, or on the
        solver. Where q is a primitive root mod n the lattice degenerates to
        {0, 1, n-1, n} and no index-calculus dimension survives."
      corrected_value: >-
        For the linear family with n prime and gcd(q, n) = 1, the attainable
        dimensions of sigma-stable V are {a + b d : a in {0,1},
        0 <= b <= (n-1)/d}, d = ord_n(q); where q is a primitive root mod n the
        only faithful ones are n - 1 and n. This lattice is a property of
        (q, n). Whether the pi-quotient on it is a net win also depends on the
        curve's field of definition and on the cost model. At q = 2,
        n in {131, 163} the faithful subspace of dimension n - 1 EXISTS
        (target_table.json records available: true) and the pi-quotient on it is
        a net loss for every m in {2, 3, 4, 5}, under MA-1 to MA-4 and in every
        other cost model examined in review. "No index-calculus dimension
        survives" is withdrawn: dimension n - 1 is available and is a net loss;
        non-linear pi-stable factor bases are outside this record.
      found_by: TASK-20260923-33a48b S2, PTM-4, PTM-5.

    - id: E9
      field: observations[7] (net-win list across binary degrees)
      prior_value: >-
        "Net win available in the panel at n = 113 (m = 2, 4, 5), 127 (all of
        m = 2..5), 233 (m = 2, 4), 239 (m = 2), 283 (m = 3), 409 (m = 2), 571
        (m = 5); never at n = 131 or 163."
      corrected_value: >-
        Under the pinned-dimension model MA-1 to MA-4 the pi-quotient is a net
        win at exactly those cells. These win verdicts are cost-model-dependent
        (some become losses in the rebalanced model the red team examined). Only
        "never at n = 131 or 163" (m in {2, 3, 4, 5}) holds in every model
        examined.
      found_by: TASK-20260923-33a48b S6.

    - id: E10
      field: observations[9] ("INDEPENDENT VINDICATION OF GOAL-FROB-6333a9's OWN CELL CHOICES")
      prior_value: >-
        "Those are exactly the cells at which the net-win margin is positive
        with zero dimension penalty ... The preregistered choice was correct for
        a reason the goal had not recorded."
      corrected_value: >-
        Under the pinned-dimension model the goal's cells (2, 41, 2) and
        (2, 43, 3) are zero-penalty cells for the pi-quotient. That is a
        property of the factor-base lattice. It is not a test of the goal's WDSat
        question, and "vindication" and "correct" are withdrawn as normative
        claims no artifact measures.
      found_by: TASK-20260923-33a48b S7.

