        batch-6 opening that must first request explicit USER authorization for a
        `total_wall_clock_seconds` amendment (the trigger's limb (a) is met) and
        then dispatch RC-1 with RC-4 as phase 1. A REPAIR MUST NOT DISPLACE THE
        ONE ACTION GENUINELY BLOCKING THE CAMPAIGN, and it does not.
  records_that_still_carry_the_superseded_reason_and_are_NOT_edited:
