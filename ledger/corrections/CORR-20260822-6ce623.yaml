correction:
  id: CORR-20260822-6ce623
  id_note: >-
    SENTINEL, NOT A RECORD ID -- `PENDINGMINT` is deliberately not a valid 6-hex
    token so it cannot be mistaken for one. THIS FILE IS A CORRECTION BODY
    AWAITING AN ID AND A HOME, NOT A FILED RECORD. The Coordinator subagent that
    wrote it has no shell and cannot run
    `python3 tools/allocate_id.py --next correction --date 20260822 --check`.
    The driving session mints the id and files this body under it, byte-identical
    apart from this field, exactly as it did for DEC-20260821-333267.
  filing_instruction:
    requested_path_is_wrong_and_here_is_the_checkable_reason: >-
      The dispatch message asked for this record "under ledger/decisions/". THAT
      PATH WOULD BREAK tools/validate_ledger.py, and the reason is mechanical
      rather than stylistic. validate_ledger.py line 151 defines LEDGER_DIRS with
      "decisions" mapped to `coordinator_decision`, and its main loop globs
      `ledger/<sub>/*.yaml` and calls check_ledger_record(path, rec_type) on EVERY
      yaml file it finds there. A CORR-*.yaml placed in ledger/decisions/ would be
      validated AS a coordinator_decision and would fail at least four checks --
      the id pattern (`^DEC-\d{8}-...`), the required top-level key, the required
      fields (decision, target_ids, knowledge_promotion, decided_by), and the
      filename-stem-equals-id check. ledger/corrections/ is NOT in LEDGER_DIRS,
      which is why all 174 existing CORR-* records live there.
    correct_destination: >-
      ledger/corrections/CORR-20260822-<minted>.yaml, per the 174-file convention
      and the CORR-20260819-08ff19 / CORR-20260802-a1f151 precedent whose shape
      this body follows. A defensible alternative with its own precedent is
      coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/corrections/, following
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-080a9c/corrections/.
    why_it_is_staged_here_instead: >-
      NEITHER destination is inside TASK-20260821-6ce8a8's task-card write_scope.
      The card grants ledger/evidence/EV-MDFIVE-24e077.yaml, ledger/decisions,
      ledger/goals/GOAL-MD5-001.yaml, ledger/hypotheses/H-MDFIVE-0ca596.yaml,
      knowledge/findings, knowledge/techniques, and this archive directory --
      ledger/corrections/ is not among them, and the card's
      write_scope_exclusivity_note additionally limits ledger/decisions/ to
      EXACTLY ONE new DEC-*.yaml, which DEC-20260822-40bf14 has already consumed.
      So this body is written to the one in-scope location that no schema
      validator scans, with its destination named rather than assumed. WRITING IT
      TO THE REQUESTED PATH WOULD HAVE BEEN THE SECOND SCOPE ERROR OF THIS
      EXCHANGE, and the point of the exchange is that a message cannot enlarge or
      redirect a write_scope.
    after_filing: >-
      Delete or leave this staging copy at the driving session's discretion; it is
      not a bound artifact of the TASK-20260821-6ce8a8 archive (which is closed at
      d54afa5f82d07fae432718fc61b4fa06bd514176 with 7 paths) and must NOT be added
      to that archive's path_sha256, which is already verified.

  recorded_at: '2026-08-22'
  record_type: claim
  record_type_note: >-
    "claim" is the closest permitted token (record_type: candidate | claim | run,
    per templates/research-records.md), following the CORR-20260724-001 and
    CORR-20260802-a1f151 precedent for correcting a committed ledger record whose
    type the enumeration does not cover. The corrected artifact is an IMMUTABLE
    committed coordinator_decision; this record supersedes one stated reason
    inside it and edits nothing.

  goal_id: GOAL-MD5-001
  batch_id: BATCH-7215fa
  question_id: RQ-MDFIVE-6870c1

  corrected_record: ledger/decisions/DEC-20260822-40bf14.yaml
  corrected_record_commit: d54afa5f82d07fae432718fc61b4fa06bd514176
  corrected_record_commit_note: >-
    The BATCH-7215fa closing ledger archive, parent 3167f2482, accepted by
    tools/research_dispatch.py with all ten gates passing and 7 declared paths
    content-bound. The commit sha is recorded here by the DRIVING SESSION's report
    of it; the Coordinator subagent writing this body has no shell and ran no git
    command.

  raised_by: >-
    THE DRIVING SESSION, self-reported, in a message to the Coordinator subagent
    immediately after the archive was accepted. It compared
    DEC-20260822-40bf14 F-19's stated cause against
    `git show 3813b4df1:coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/task-cards/TASK-20260821-6ce8a8/task_card.yaml`
    and found that the card's write_scope DOES list
    ledger/hypotheses/H-MDFIVE-0ca596.yaml, while the write_scope list transmitted
    in its own dispatch prompt did not. IT REPORTED ITS OWN ERROR RATHER THAN
    LEAVING IT TO BE FOUND, which is the conduct this program wants and is not a
    mitigation of the error itself.

  correction_1:
    field: >-
      DEC-20260822-40bf14 rationale finding F-19 -- specifically the STATED CAUSE
      of the deferral of the H-MDFIVE-0ca596 status-field edit, and the two
      compressed restatements of that cause in
      coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/archives/TASK-20260821-6ce8a8/ledger-receipt.json
      (`records_deliberately_NOT_touched`) and in ledger/goals/GOAL-MD5-001.yaml
      (`batch_7215fa_closing_refs.outstanding_field_edit`).
    prior_value: >-
      That the field edit was withheld because ledger/hypotheses/ was outside the
      closing task's write_scope; that the deferral was therefore necessary; and,
      in consequence, that "batch 4's split between the ruling and the field edit
      IS repeated here, knowingly, under a narrower scope", with the edit left to
      "the next task carrying ledger/hypotheses/ in scope".
    corrected_value: >-
      THE EDIT WAS WITHIN TASK-20260821-6ce8a8'S OWN WRITE_SCOPE AND HAS NOW BEEN
      MADE BY THAT TASK. ledger/hypotheses/H-MDFIVE-0ca596.yaml is listed in the
      task card's write_scope as committed in 3813b4df1, granted for its `status`
      field and a `status_note` and for nothing else. The deferral was
      UNNECESSARY. H-MDFIVE-0ca596.status is now `weakened` with a status_note
      citing DEC-20260822-40bf14 F-4, F-5 and F-12 and EV-MDFIVE-24e077, written
      by the same Coordinator task that made the ruling. BATCH 4'S SPLIT IS
      THEREFORE NOT REPEATED, and no follow-up task inherits the edit.
    reason: >-
      TWO DISTINCT ERRORS, BOTH RECORDED, NEITHER ABSORBED INTO THE OTHER.
      ERROR 1 -- THE DRIVING SESSION'S, AND IT IS THE PROXIMATE CAUSE. The
      write_scope list transmitted in the dispatch prompt that launched
      TASK-20260821-6ce8a8 OMITTED ledger/hypotheses/, narrowing the subagent's
      declared authority below its own committed task card, and the omission was
      not noticed at dispatch time. This is the same class as procedure deviation
      PD-1 recorded at severity HIGH in DEC-20260822-40bf14 F-13, where the same
      session's dispatch prompt disclosed a blind re-derivation's expected answer:
      IN BOTH CASES THE CONTROL PLANE TRANSMITTED SOMETHING OTHER THAN WHAT THE
      COMMITTED CARD SAID, and in both cases the receiving agent behaved correctly
      on what it was given. PD-1 was recorded at full strength against the driving
      session by a decision that same session had commissioned; this one is
      recorded at full strength by the agent the session is correcting. Neither is
      discounted for who reported it, and the symmetry is the point.
      ERROR 2 -- THE COORDINATOR SUBAGENT'S, AND IT IS SMALLER BUT REAL. F-19's
      own full text DID state the divergence accurately -- it recorded that "the
      task card grants this task ledger/hypotheses/H-MDFIVE-0ca596.yaml for its
      status and status_note only" and that "the dispatch instruction that
      actually launched this task declares a NARROWER write_scope that excludes
      ledger/hypotheses/ entirely". SO THE FACTS WERE ON THE RECORD AND THE
      INFERENCE FROM THEM WAS WRONG. The subagent treated the dispatch prompt as
      authoritative over the committed card on the ground that it was "the later
      and more specific instruction". THAT GROUND IS WRONG AND ITS WRONGNESS
      GENERALISES: a message is a pointer, never a permission (AGENTS.md
      "Inter-agent messaging"), and a prompt that cannot ENLARGE a write_scope
      cannot NARROW one either -- authority comes from the committed card and the
      handoff, and a divergence between a prompt and a card is a control-plane
      defect to be raised, not a new scope to be obeyed. The compressed
      restatements in the ledger receipt and the goal head then dropped the
      divergence caveat entirely and asserted the flat falsehood that the path was
      "excluded from this task's declared write_scope".
    what_was_NOT_wrong_and_is_carried_forward_intact: >-
      F-19 gave THREE reasons and only the scope reason fails. The other two were
      true when written and remain instructive. (i) The artifact-ownership
      hazard is real -- H-MDFIVE-0ca596.yaml is declared as an artifact of
      TASK-20260821-fad775, and an artifact-ownership collision on exactly this
      class of file already cost this goal a fix commit at batch 4 (2c577d3ab, on
      H-MDFIVE-bf7767.yaml). (ii) The archive-mechanics hazard was real -- under
      content_first with SET EQUALITY, editing an eighth file while declaring
      seven would either have broken the dispatcher's check or left the edit
      uncommitted. BUT NEITHER WAS A BAR, AND THAT IS THE CORRECTION: both were
      solvable by DECLARING THE EIGHTH PATH in the archive's path set and
      disclosing the shared ownership in the receipt, which is precisely what the
      handoff's own artifact_paths_note pre-authorised when it wrote that the
      H-MDFIVE-0ca596 write is "DISCLOSED in this receipt rather than bound by
      it". The subagent read that note, quoted its intent, and still did not take
      the option it opened. A hazard that has a declared remedy is not an
      obstacle.

  what_is_and_is_not_corrected:
    the_ruling_stands_unchanged: >-
      DEC-20260822-40bf14's RULING that H-MDFIVE-0ca596 is `weakened` is
      UNAFFECTED and stands on its merits -- on the confirmed mechanism claim
      (F-4, F-5), the failed near-injectivity premise and PO-5 (F-5, F-6), and
      HEUR-H1b's falsification at these parameters by its own frozen text (F-12).
      Only the reason given for not applying the corresponding field edit is
      corrected. NOTHING about the batch is reopened.
    no_scientific_content_changes: >-
      No observation, measurement, statistic, evidence record, obstruction,
      knowledge entry, claim tier, promotion-gate assessment, scope statement or
      transfer assumption is altered, revisited or re-scored by this correction.
      EV-MDFIVE-24e077, KN-TECH-c3d80e and the archive binding at
      d54afa5f82d07fae432718fc61b4fa06bd514176 stand exactly as written and
      verified. SC-9 IS NOT ENGAGED: no success criterion, threshold, prediction
      or statistic moved after an outcome was observed.
    the_batch_is_not_reopened_and_this_is_not_a_second_close: >-
      BATCH-7215fa remains CLOSED at DEC-20260822-40bf14. This correction changes
      one stated reason, applies one already-ruled status field, and updates the
      mutable goal head accordingly. It closes nothing, approves nothing,
      dispatches nothing and promotes nothing.
    the_still_true_part_of_the_original_conduct: >-
      Recorded so the correction is not read as a reprimand of the refusal itself.
      Refusing to write outside a declared scope, and DISCLOSING the refusal in
      the record rather than deferring silently, was correct conduct and is what
      made this repairable within minutes. The failure mode this program actually
      fears is the opposite one -- an agent that quietly writes outside its scope,
      or quietly drops an obligation without saying so.

  consequential_edits_made_alongside_this_correction:
    - path: ledger/hypotheses/H-MDFIVE-0ca596.yaml
      change: >-
        `status: approved` -> `status: weakened`, and `status_note` rewritten to
