  verification:
    performed_by_the_coordinator_subagent_by_reading: >-
      The task card at
      coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/task-cards/TASK-20260821-6ce8a8/task_card.yaml
      was re-read in the working tree: its write_scope lists
      ledger/hypotheses/H-MDFIVE-0ca596.yaml, and its
      write_scope_exclusivity_note confirms the grant is for the status field and
