  open_items:
    - id: OI-1
      item: >-
        THE GENERAL DEFECT IS THE CONTROL PLANE, NOT THIS FILE. Two independent
        divergences between a committed task card and what the dispatching session
        transmitted or stored surfaced in ONE batch -- the queue's write_scope for
        TASK-20260821-6ce8a8 omitting `knowledge/techniques` (caught by the
        dispatcher, which rejected the archive), and the dispatch prompt's
        write_scope omitting `ledger/hypotheses/` (caught by nothing, and
        discovered only because the subagent disclosed its refusal in the record).
        THE SECOND HAD NO MECHANICAL DETECTOR. A cheap one exists and is
        recommended, not decided here: have the dispatcher diff each queued task's
        write_scope against its committed task card's write_scope and fail on any
        divergence, exactly as it already diffs artifact_paths against commit
        scope. Recorded for the next batch opening alongside the CPC-3 and
        task-card-binding items handed forward by DEC-20260822-40bf14 F-21 -- and
        note that CPC-3's own rationale already observed that TASK CARDS ARE NOT
        BOUND ARTIFACTS, which is what let a card and a queue drift apart unnoticed.
    - id: OI-2
      item: >-
        PD-1 and this correction are the same failure shape at two different
        stakes -- a dispatch prompt that carried something other than the committed
        card. PD-1 cost the round some of its blindness; this cost a field edit and
        a false sentence in three records. Whether dispatch prompts should be
        generated FROM the committed card rather than composed alongside it is a
        harness-design question outside this correction's authority.

