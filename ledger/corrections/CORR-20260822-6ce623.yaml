        obligations, heuristics, predictions, test boundary, falsification
        conditions and interpretation_limits are unchanged and immutable.
      convention_followed: >-
        H-MDFIVE-bf7767's status/status_note pair (set by DEC-20260821-1215e5
        F-2), extended in one respect -- bf7767 replaced its prior note, whereas
        this edit preserves the prior note verbatim so the frozen pre-run state
        stays legible.
    - path: ledger/goals/GOAL-MD5-001.yaml
      change: >-
        `batch_7215fa_closing_refs.outstanding_field_edit` -> DISCHARGED, and the
        stale clause in `next_action` requiring a future task to set the status is
