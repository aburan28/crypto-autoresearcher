    - record: coordination/goals/GOAL-MD5-001/batches/BATCH-7215fa/archives/TASK-20260821-6ce8a8/ledger-receipt.json
      why_not_edited: >-
        Committed AND BYTE-BOUND -- it is one of the 7 paths in its own accepted
