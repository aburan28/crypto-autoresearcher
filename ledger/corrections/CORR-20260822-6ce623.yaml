      `status: approved` with the gate's status_note. tools/validate_ledger.py was
      read (LEDGER_DIRS at line 151 and the main scan loop) to establish the
      filing_instruction above. NO SHELL COMMAND WAS RUN BY THIS SUBAGENT: no git,
      no validator, no id allocator, no test suite, no commit.
    attributed_to_the_driving_session_and_not_claimed_by_this_subagent: >-
      `git show 3813b4df1:.../task_card.yaml`; the archive acceptance at
      d54afa5f82d07fae432718fc61b4fa06bd514176 with all ten dispatcher gates
      passing and the commit message verified programmatically to name
      TASK-20260821-6ce8a8 and all twenty record_ids;
      `check_review_independence.py --batch` PASSING with 2 reports, every joint
