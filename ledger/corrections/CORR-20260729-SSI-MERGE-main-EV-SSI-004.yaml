evidence:
  id: EV-SSI-004
  hypothesis_id: IDEA-20260725-001
  experiment_ids: []
  run_ids: []
  run_ids_basis: >-
    EMPTY BY CONSTRUCTION, NOT BY OMISSION. BATCH-002 was a zero-compute
    derivation gate. No experiment was designed, approved, or executed; no
    isogeny was evaluated, no j-invariant computed, no graph sampled, no command
    run. There is therefore no run to cite, and no empirical claim at any tier
    arises from this record. All three producing sessions
    (TASK-20260728-005, TASK-20260728-007, TASK-20260728-009) independently
    record zero curve compute.
  type: theoretical
  direction: weakens
  direction_basis: >-
    Relative to IDEA-20260725-001. Its stated mechanism - levying a memory
    charge against the classical supersingular path-finding baseline - is shown
    to add nothing on either field regime, and its prediction
    matched_baseline_identity = different is false on F_p. The idea is not
    thereby valueless: executing its gate surfaced corrections C-alpha, C-beta
    and C-gamma, which are decision-relevant for reasons unrelated to memory
    charging.
  strength: preliminary
  strength_basis: >-
    NOT replicated and NOT strong. Four independent reasons, each recorded
    rather than smoothed over. (1) MODEL INDEPENDENCE WAS NOT ACHIEVED:
    orchestration/model-bindings.yaml binds both research-deep and
    review-adversarial to claude-opus-5 on the default backend with
    last_probed null, so producer, reviewer and erratum author all resolved to
    one model - three SESSIONS, not three independently-resolved judgements -
    and every session records model_verified false. (2) The erratum
    TASK-20260728-009 introduced new content (disagreement D1 and the derived
    Lemma 4-prime(b)) that no independent session has reviewed. (3) The entire
    F_p regime relays through an abstract nobody in this repository has read.
    (4) One independent review was commissioned, not two.
  claim_tier: theory
  claim_tier_basis: >-
    Theory / derivation. The toy-medium-crypto ladder does not apply because
    there is no instance at all: no prime p, no curve, no field size, no
    parameter set is named anywhere in the batch. Nothing here may be quoted as
    validation at any scale, toy or cryptographic, and nothing here establishes
    concrete bit security for any parameter set.
  certificate_refs: []
  proof_status: derivation
  proof_refs:
    - coordination/goals/GOAL-SSI-001/batches/BATCH-002/tasks/TASK-20260728-005/derivation_note.md
    - coordination/goals/GOAL-SSI-001/batches/BATCH-002/tasks/TASK-20260728-005/baseline_recommendation.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-002/reviews/TASK-20260728-007/red_team_report.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-002/reviews/TASK-20260728-007/falsification_review.md
    - coordination/goals/GOAL-SSI-001/batches/BATCH-002/tasks/TASK-20260728-009/baseline_recommendation_v2.yaml
    - coordination/goals/GOAL-SSI-001/batches/BATCH-002/tasks/TASK-20260728-009/errata_note.md
    - coordination/goals/GOAL-SSI-001/batches/BATCH-002/archives/TASK-20260728-006/snapshot_commit_receipt.json
  authoritative_artifact: >-
    coordination/goals/GOAL-SSI-001/batches/BATCH-002/tasks/TASK-20260728-009/baseline_recommendation_v2.yaml
    SUPERSEDES the v1 recommendation of TASK-20260728-005 for every
    machine-readable field. The v1 artifacts remain committed and immutable and
    were not edited. Any downstream record quoting a BATCH-002 figure must quote
    v2. The four values RT-20260728-007 forbade from reaching the ledger - a
    p^{3/5} MITM full-cost optimum, a p^{7/20} gap, an asymmetric-charge audit
    reading NONE FOUND, and an unqualified mitm_ever_competitive false - are not
    asserted anywhere in this record.
  observations:
    - >-
      G1, STRENGTHENED AGAINST THE PRODUCER. Under the named convention
      SSI-FC-2026 with the table-construction phase charged for its own memory
      accesses (red-team objection F1, control RC1), meet-in-the-middle over the
      F_{p^2} supersingular isogeny graph has full cost Omega(p^{2/3}) for EVERY
      table size, against a step count of p^{1/2}. The minimum is attained
      exactly at the textbook balance. The p^{3/5} full-cost-optimal rebalance
      asserted by TASK-20260728-005 DOES NOT EXIST and is withdrawn: it was an
      artifact of an uncharged build phase. The producer's error therefore ran
      CONSERVATIVE - the correction makes a dominated algorithm more expensive,
      not less - and it dissolves the producer's own open item by recovering
      Wiener's published n^{2/3} as the optimum over the table size within
      SSI-FC-2026 rather than as a coincidence at one balance point.
    - >-
      G2, UNCHANGED. RT-20260725-503 fatal objection F2 is UPHELD, not answered.
      MITM over the full F_{p^2} graph is never competitive on F_p-rational
      instances. The proof is model-independent - it runs off the one-line
      Lemma 1 (full cost is never below step count, from W1 and W6 alone) and is
      untouched by F1, F2 and F3 - so no wiring model satisfying W1 can reverse
      the ranking. Consequence for IDEA-20260725-001: its prediction
      matched_baseline_identity = different is FALSE on the F_p regime and would
      have been false under any honest convention.
    - >-
      G2 SCOPE CORRECTION, machine-readable. v1 carried an unqualified boolean
      asserting MITM is never competitive on F_p. That over-generalised a proof
      about MITM over the FULL graph into a claim about all MITM. MITM used as
      Delfs-Galbraith's INNER search inside V_p is competitive at full cost
      p^{1/3+o(1)} and is the fallback when the F_p-subgraph mixing heuristic
      fails. v2 retires the flag and records both facts separately.
    - >-
      G3, SURVIVES RESTATED - NOT FALSIFIED AND NOT UNDERSPECIFIED. The
      low-memory collision-search analogue on the path-index space is DEFINED,
      but well-defined only under the restated heuristics H1-prime, H2-prime and
      H4-prime and only after one restatement: v1 sized its index space at a
      walk length at which its own mixing heuristic is provably false, and its
      p^{1/2+o(1)} figure followed from its lemmas only because two distinct
      quantities coincided numerically at that sizing. Restated with the walk
      length decoupled from the index-space size and the birthday parameter set
      to the image of the collision map, the same headline follows and the
      memory-independence conclusion is strengthened. The naive continuous
      graph-walk variant remains falsified in place, and that falsification also
      bites v1's own Delfs-Galbraith descent specification, repaired under RC3.
    - >-
      G3 GENUINE CONTENT, and the one item that is novel against the archived
      corpus. The any-claw versus golden-claw accounting - at unrestricted
      degree claws are abundant so the cost is independent of the memory budget,
      while at fixed degree the constraint leaves one claw so memory matters at
      exponent level - is the precise technical reason the SIDH/CSSI
      van Oorschot-Wiener versus MITM cost-model literature does not transfer to
      pure path-finding. Both the reviewer and the erratum author searched and
      state that it appears in NO archived corpus entry. It explains why the
      exponents are what they are; it produces no algorithm that beats a
      baseline. Its supporting Lemma 4-prime(b) is unreviewed (see confounds).
    - >-
      G4, F_{p^2}. Two tiers, both to be quoted. Unconditional tier
      p^{1/2+o(1)} time at polynomial memory; heuristic-conditional tier
      p^{1/3+o(1)} time and memory, conditional on Heuristic 1 of
      inputs/P13-WESOLOWSKI-2026/paper_fulltext.md. THE UNCONDITIONAL TIER
      SURVIVES BY CITATION ONLY: correction C-alpha is recorded CITED, not
      DERIVED. It rests on one parenthetical clause of a related-work paragraph
      in a paper about a different algorithm, read verbatim by two sessions, and
      on the standard reading of "polynomial memory" against an input size of
      log p - which is a reading, labelled an interpretation of a quotation and
      not a quotation. Both in-repo reconstructions offered as independent
      support are conditional on H1-prime, so neither is independent derivation.
    - >-
      G4, F_p. Delfs-Galbraith at p^{1/4+o(1)} step count remains the matched
      baseline and is NOT displaced by the archived p^{1/3+o(1)} algorithm,
      since 1/4 < 1/3. Recorded at confidence relayed_from_abstract inline on
      every F_p figure. The ranking is robust to whether the F_p-subgraph mixing
      heuristic holds, because the heuristic-free fallback still beats p^{1/2}.
    - >-
      MOST DECISION-RELEVANT OUTPUT, and it needed no cost model at all.
      Correction C-beta: KN-TECH-029's classical F_{p^2} figure is STALE against
      this repository's own archived primary text, which places the frontier at
      p^{1/3+o(1)} conditional on that paper's Heuristic 1. Any GOAL-SSI-001
      candidate benchmarked against p^{1/2} on F_{p^2} is measuring against a
      superseded baseline. Both the reviewer and the erratum author concur.
    - >-
      SIGN ERROR IN v1, CORRECTED; VERDICT UNCHANGED, REASONING REPLACED. v1
      argued that the memory rebalance of the archived p^{1/3+o(1)} algorithm
      RAISES the attacker's cost and cited that as a reason no attack mechanism
      was found. The opposite is true in the full-cost metric: rebalancing to
      w = p^{1/5+o(1)} LOWERS a live attack's full cost from p^{4/9+o(1)} as
      operated to p^{2/5+o(1)}. v1's justification item is withdrawn as unsound
      and replaced; the verdict it supported is reached on other grounds.
    - >-
      OPERATIVE THRESHOLDS ARE TIME, NOT FULL COST. The conditional full-cost
      figures sit above a SUPERPOLYNOMIAL o(1) overhead disclosed by the source
      paper's own authors, so they are thresholds nobody can evaluate at any
      realisable p. A future candidate is measured against the p^{1/2+o(1)}
      unconditional and p^{1/3+o(1)} conditional TIME tiers; the full-cost
      figures are carried as provisional. v1 framed a full-cost figure as an
      operative target; that framing is corrected.
    - >-
      COMPLETION FLAG. new_attack_mechanism_detected is FALSE, reached
      independently in three sessions - producer, independent reviewer, and
      erratum author - each declining to adopt the others' justification and the
      latter two rejecting one of the producer's four items as unsound.
      THEREFORE BATCH-002 SATISFIES NO GOAL-SSI-001 COMPLETION CRITERION,
      exactly as the batch opening pre-registered. Criterion 1 fails because
      nothing materially improves a matched baseline; criterion 2 is not met by
      a review that verified scope and cost hygiene for a derivation rather than
      novelty of an attack; criterion 3 is this archive and asserts no success.
      Nothing was manufactured to satisfy a completion route.
    - >-
      TARGET-CLASS SELF-ASSESSMENT, CONCURRED BY THE REVIEW. Under
      docs/target-result-profile.md rule A1 nothing in BATCH-002 is
      target-class. C-alpha moves no exponent; C-beta is a bookkeeping
      correction that imports someone else's exponent; C-gamma is a cost-metric
      re-parameterisation of an existing algorithm along a tradeoff its own
      source text invites. No exponent of any named hard problem moves. This is
      cost-model hygiene plus one corpus-currency correction. It is not a
      cryptanalytic result and it breaks nothing.
  inference: >-
    Accept the batch at the derivation tier with v2 as the authoritative
    artifact; record IDEA-20260725-001's stated premise as closed on its exact
    tested scope - supersingular path-finding under SSI-FC-2026, Problems 1 and
    2 - and not beyond it, where KN-TECH-035 and KN-TECH-044 remain in force.
    Do not treat this as a rejection of a theory: the evidence is one
    unreplicated derivation lineage on a single resolved model, the correcting
    artifact carries unreviewed content, and no H-SSI-* hypothesis exists to
    move. The full-cost lane is exhausted of decision-relevant content and
    should not be re-dispatched; the residual value of BATCH-002 is C-beta
    (a knowledge-corpus currency fix), the any-claw/golden-claw accounting
    (pending independent review), and three named open controls RC4, RC5, RC7.
  boundaries:
    - >-
      Scoped to the named cost convention SSI-FC-2026 - Wiener full cost with
      three-dimensional bisection-limited memory - and to the four algorithms
      compared under it. A different wiring model changes every full-cost
      exponent here except the ones derived from Lemma 1.
    - >-
      Scoped to supersingular isogeny path-finding at unrestricted degree
      (Problem 1 on F_{p^2}, Problem 2 on F_p-rational inputs). It does NOT
      transfer to the fixed-degree CSSI/SIDH regime, and the batch's own central
      observation is the reason why.
    - >-
      Zero curve computation and zero runs. No empirical claim at any tier, no
      scale, no parameter set, no concrete bit security for any deployed system.
    - >-
      Every p^{1/3+o(1)}, p^{4/9+o(1)} and p^{2/5+o(1)} figure is CONDITIONAL on
      Heuristic 1 of inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, which this
      program has neither validated nor challenged. Dropping that qualifier
      downstream is a claim-tier violation.
    - >-
      H1-prime through H4-prime are unvalidated. Validating them requires the
      curve computation this batch forbade, and toy-scale sampling would
      validate nothing at cryptographic scale.
    - >-
      Asymptotic full-cost statements settle BASELINE IDENTITY, not security
      levels. No security level is asserted or implied.
    - >-
      Closes nothing about CGL, SQIsign, CSIDH hardness, sub-p^{1/4}
      endomorphism-ring attacks, KN-OPEN-013, KN-OPEN-014, KN-OPEN-015, quantum
      attacks, or torsion-image attacks. SIDH/SIKE torsion-image key recovery
      remains a closed known attack and was never a target.
    - >-
      Novelty screening was against ledger/, coordination/ and inputs/ only. No
      web fetch and no web search was performed by any BATCH-002 session, so
      every novelty statement is at best unverified against the open literature.
  unresolved_confounds:
    - >-
      UNREVIEWED CONTENT IN THE CORRECTING ARTIFACT. TASK-20260728-009
      introduced two items that no independent session has checked:
      disagreement D1 (the reviewer's claim that the v1 claw-count equality
      survives the restatement is wrong; the correct relation is omega, not
      Theta) and the newly derived Lemma 4-prime(b) establishing a constant
      useful fraction of detected collisions. Lemma 4-prime(b) is load-bearing
      for the memory-independence conclusion. Both are carried as unreviewed and
      gated on a successor review.
    - >-
      RC4 OPEN - THE F_p REGIME RESTS ON AN ABSTRACT. Every F_p figure relays
      through KN-TECH-029 to KN-LIT-078, whose own corpus entry states "Full
      paper not read; the p^{1/2} / p^{1/4} costs relayed from the abstract" and
      records that the IACR ePrint number could not be confirmed. KN-TECH-050
      instructs a BATCH-002 derivation that it must obtain every quoted figure
      from the papers themselves. The F_{p^2} figures satisfy that instruction;
      the F_p figures do not. Both quotations were verified verbatim by two
      sessions. This is a PRECISION control, not a verdict control: the F_p
      ranking is robust either way.
    - >-
      RC5 OPEN - ATTRIBUTION. Whether KN-LIT-094 itself frames n^{2/3} as an
      optimum over the table size or only at the square-root balance is an
      attribution question no pen-and-paper step can settle. The item is
      recorded closed WITHIN SSI-FC-2026, not closed.
    - >-
      RC7 OPEN - NO HEURISTIC VALIDATION EXISTS OR IS SCHEDULED. Under the
      coordinator promotion gates this alone caps any asymptotic claim built on
      H1-prime through H4-prime below supported.
    - >-
      MODEL INDEPENDENCE NOT ACHIEVED, AND MODEL IDENTITY UNVERIFIED. All three
      sessions self-reported claude-opus-5 and none ran the adapter probe;
      last_probed is null in the binding. No policy equivalence is claimed. No
      future GOAL-SSI-001 closure attestation may count these three sessions as
      independently-resolved models.
    - >-
      REVIEW DEPTH AND BUDGET. One independent review was commissioned, not two.
      The campaign wall-clock tally is NOMINAL and NOT AUDITABLE: no committed
      artifact records what BATCH-001 actually consumed, so the budget is not
      asserted to be satisfied.
    - >-
      ORCHESTRATOR REPAIR, DISCLOSED. baseline_recommendation_v2.yaml did not
      parse when first returned; after one failed round-trip the orchestrator
      dedented four lines. The change was verified whitespace-only - stripping
      all whitespace from both versions yields identical bytes - but it was an
      edit by the dispatching layer to a producer artifact and is recorded as
      such rather than left implicit.
    - >-
      PROCESS DEFECT. TASK-20260728-009 was added to BATCH-002 mid-batch on the
      reviewer's mandate and its own session records that a repository-wide
      search found no dispatch card for it in the tree; the handoff reached that
      session in-conversation. The erratum artifacts are committed; the handoff
      that authorised them is not.
    - >-
      MODEL ASSUMPTION NOT DISCHARGED. The achievability half of the memory
      model (mesh routing reaching the claimed throughput) is assumed, not
      proved. Only the bisection LOWER bound is derived, which is why the
      "MITM loses" conclusions are safe even if achievability fails, while every
      full-cost UPPER bound in the batch is not.
    - >-
      A SUPERPOLYNOMIAL o(1) SITS UNDER THE CONDITIONAL TIER, by the source
      authors' own disclosure. No concrete-parameter conclusion follows from any
      conditional exponent recorded here.
  reviewed_by: coordinator
