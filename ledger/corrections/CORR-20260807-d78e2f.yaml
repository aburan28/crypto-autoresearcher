  field: >-
    the N3 / saturation-sweep observation and inference -- specifically the claim
    that the within-class m=3 decomposition-rate over-dispersion is "real,
    persistent and density-independent" rather than an artifact
  prior_value: >-
    EV-ENDO-10109d (strength `replicated`, direction `mixed`, independently
    validated by VAL-20260807-endo001-523510 check 4) states that the
    within-class over-dispersion "is now shown to be density-independent rather
    than a saturation boundary effect", with variance ratio in [1.3, 3.6] across
    densities 0.024-0.97 at two primes and no decay trend, and records it as
    "the campaign's most substantive open finding" whose cause is unknown but
    which is "an established, replicated fact rather than a saturation
    artifact". DEC-20260807-41c173 carries the same reading and makes
    investigating its CAUSE the campaign's highest-priority next action (N8).
  corrected_value: >-
    THAT CLAIM NOW CARRIES A NEWLY IDENTIFIED, UNTESTED CONFOUND OF EXACTLY THE
    RIGHT SHAPE TO PRODUCE IT, AND MUST NOT BE CITED AS AN ESTABLISHED FACT
    UNTIL EXP-ICINV-4d33aa RESOLVES IT. This record does NOT assert the prior
    finding is wrong -- no experiment has yet been run against the confound.
    It asserts that the finding is no longer supported at the strength
    EV-ENDO-10109d claims for it, because a mechanism capable of manufacturing
    the entire effect has been measured and was not controlled for.
  the_confound:
    measured_fact: >-
      `harness/exp_icinv.py:targets_uniform` selects the highest-order point
      among up to 200 liftable candidates and samples `[h % gen_order] * G`.
      That is a CYCLIC subgroup of order `gen_order`, not the full group of
      order #E. The integer r = #{x in F_p : x^3 + ax + b = 0} determines
      `gen_order/#E` EXACTLY and deterministically:
        r = 1  ->  gen_order/#E = 1.0   (100% of the group reachable)
        r = 3  ->  gen_order/#E = 0.5   (50% of the group reachable)
      Measured with zero variance within each stratum on the largest ordinary
      isogeny class at THREE primes: p = 2003 (trace 36, 25 curves per stratum),
      p = 4001 (trace 30, 32 and 28 curves), p = 6007 (trace 8, 26 and 24
      curves). Every single curve in every r-stratum returned exactly 1.0 or
      exactly 0.5; the split is arithmetic, not statistical.
    why_it_is_the_right_shape: >-
      r = 3 holds exactly when E has full rational 2-torsion, i.e. when the
      2-part of E(F_p) is non-cyclic, i.e. when n1 is even in
      E(F_p) ~= Z/n1 x Z/n2. And r VARIES WITHIN AN ISOGENY CLASS -- this
      campaign measured that directly (p = 2003, trace 36: 52 curves with r = 3
      against 52 with r = 1) and CORR-20260807-2c9ae4 already corrected
      DECOMPOSITION.md T4 for omitting group structure from its
      varies-within-class list. So roughly half of every measured class was
      sampled from half its group while the other half was sampled from all of
      it. The measured rate for an r=3 curve is |3V and <G>| / (#E/2) whereas
      for an r=1 curve it is |3V| / #E -- systematically different quantities
      computed on curves that the analysis pooled as exchangeable. Excess
      within-class variance is the expected consequence, and it would be
      density-independent, because the coverage split is a property of the
      group and not of the factor base.
    provenance: >-
      The sampler's single-generator limitation was DISCLOSED, not hidden: it is
      written into `targets_uniform`'s docstring and the independent Validator
      restated it in VAL-20260807-endo001-523510 check 1, reporting gen_order =
      1986 = 3972/2 on curve (p=4001, a=2175, b=1450) and correctly calling it
      "consistent with the docstring's stated, honestly-declared limitation".
      What nobody did -- not the Coordinator writing the synthesis, not the
      Validator checking it -- was CONNECT check 1's disclosed limitation to
      check 4's over-dispersion finding. The Validator's scope was four
      independent named claims and it verified each correctly; nothing in its
      dispatch asked whether check 1 undermined check 4. That gap is the
      Coordinator's, not the Validator's.
  what_this_does_not_touch:
  - >-
    The N4 result (transport loses against a correctly-costed rebuild at every
    odd ell, no crossover in range, replicated at two primes) is UNAFFECTED:
    it uses no target sampler at all.
  - >-
    The N5 result (walk speedup sits on its ceiling across 20 seeds and both
    automorphism arms) is UNAFFECTED: `harness/run_ewalk2.py` samples nothing
    through `targets_uniform`.
  - >-
    CORR-20260807-9f83be's own findings are UNAFFECTED and in fact reinforced:
    that record fixed a DIFFERENT, grosser failure of the same function (a base
    point of order 2, collapsing the sample to one repeated point) and already
    warned that the single-generator design "can still fail to reach a
    non-cyclic group's full structure from a single generator -- a genuine
    mathematical limitation, not a bug". This record is that warning coming due.
  - >-
    The BETWEEN-class conclusion (NULL-C finds no signal) is not obviously
    affected, because the coverage split is within-class, but it has not been
    re-checked under a full-group sampler and must not be assumed safe either.
  required_action:
  - >-
    DO NOT cite EV-ENDO-10109d's density-independence observation, or
    BATCH-523510 SYNTHESIS.md's N3 section, as an established finding. Cite this
    correction alongside them until EXP-ICINV-4d33aa reports.
  - >-
    EV-ENDO-10109d is NOT edited (AGENTS.md rule 4). Its correct reading is this
    record. If EXP-ICINV-4d33aa returns OUTCOME A (sampler artifact), a
    superseding evidence record must be written that retracts the
    density-independence claim explicitly; if OUTCOME B or C, a superseding
    record must state which.
  - >-
    Any future between-class or within-class comparison in this campaign must
    declare its sampler's GROUP COVERAGE per curve, not merely its distinct-
    target count. Coverage is the quantity that was never reported and it is
    what hid this.
  - >-
    Add to the campaign's instrument obligations: a sampler whose reachable set
    depends on a curve invariant that varies within the comparison group is a
    confound by construction, whether or not the dependence is documented.
    Documenting a limitation is not controlling for it.
