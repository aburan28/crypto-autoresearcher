correction:
  id: CORR-20260916-1c7d8a
  recorded_at: '2026-09-16'
  recorded_by: coordinator
  area: ICPERF
  correction_type: schema_defect_in_a_committed_record
  supersedes: []
  supersedes_note: >-
    Nothing scientific. This registers an ADDITIVE SCHEMA COMPLETION of a committed
    decision record. The original is not edited, not withdrawn, and not weakened; its
    bytes stay exactly as archived and both sides are hash-pinned in
    tools/schema_supersession_registry.yaml.
  targets:
    - ledger/decisions/DEC-20260915-927eaa.yaml
  target_records:
    - DEC-20260915-927eaa
  related:
    - EV-ICPERF-433fa5
    - BATCH-a33cda
    - TASK-20260915-efa91b

  title: >-
    DEC-20260915-927eaa was committed with a schema-invalid knowledge_promotion block --
    its reason recorded under `not_promoted_reason` where the validator has required
    `not_warranted` since 2026-07-22 -- which means the ledger archive that carried the
    ICPERF batch closure was committed without a passing validator run

  what_was_wrong:
    the_defect: >-
      `knowledge_promotion.promoted` is the empty list and the reason for promoting
      nothing was written as `not_promoted_reason`. check_record in
      tools/validate_ledger.py (:546) requires a nonempty `not_warranted` whenever
      `promoted` is empty. The record therefore fails validation as committed.
    what_was_NOT_wrong: >-
      THE REASON ITSELF. It reads: "The instrument acceptance itself is a fact about this
      repository's harness on one host. It belongs in the ledger, is fully recorded there,
      and would be noise in a corpus meant to carry results that outlive a machine." That
      is a complete and specific answer to the question the field asks, and the deferred
      candidate KP-1 is recorded beside it with its own reason. Nothing about the promotion
      judgement is being corrected here.
    scope: >-
      ONE KEY NAME, in one block, of one record. No transition, verdict, prior, refuted
      prior, procedure deviation, next action, evidence reference or citation differs
      between the original and its replacement. They are diffable and the diff is the
      renamed key plus the replacement's own header.

  the_real_finding: >-
    THE DEFECT IS NOT THE INTERESTING PART; THE PROCESS GAP IS. A schema rule that has
    been enforced since 2026-07-22 was violated by a record written on 2026-09-16 and
    committed in the ledger archive TASK-20260915-efa91b, whose completion gate included a
    validator run. Either the validator was not run before that commit or its output was
    read past: the run emits dozens of grandfathered legacy lines and this error sat among
    them, which is exactly the failure mode a long error list produces. Either way the
    archive was committed on an unverified claim about schema validity, and that is a
    process defect of the kind the durable-commit rules exist to prevent.

  what_changed:
    - >-
      A complete replacement is registered at
      ledger/corrections/schema-supersessions/20260916/ledger__decisions__DEC-20260915-927eaa.v2.yaml
      with `not_warranted` carrying the original reason verbatim, plus a
      `key_renamed_by_this_replacement` note so a reader of the replacement alone can see
      what moved. Registered in tools/schema_supersession_registry.yaml with both sha256
      digests.
    - >-
      NOTHING IN ledger/decisions/DEC-20260915-927eaa.yaml. Its sha256 is
      970184ed78baa005c722ec6ba54e2dcdd35f5745ef759907023b2ef31021c9f5, which is the value
      the archive receipt of TASK-20260915-efa91b binds, and it is unchanged. Editing it in
      place would have broken that binding for a key rename -- and would have repeated the
      immutability violation this campaign has already recorded twice this week
      (CORR-20260916-5166fe, CORR-20260916-2e9bc3), both times against another session for
      doing exactly that.

  what_this_correction_does_not_do:
    - >-
      DOES NOT reopen BATCH-a33cda, revisit the instrument acceptance, or change what
      DEC-20260915-927eaa decided. The wall-clock channel is still not accepted; the four
      accepted channels are still accepted on the same evidence.
    - >-
      DOES NOT change the promotion judgement. Nothing is promoted, KP-1 stays deferred
      with its reason, and NA-8 still owns it.
    - >-
      DOES NOT assert that the rest of the tree validates. 61 new validator errors stand on
      this branch after merging origin/main; two were this session's (this one and a missing
      `decision` field in the then-uncommitted DEC-20260916-59921c, fixed before commit) and
      the remaining 59 belong to other campaigns' records — nine handoffs under stricter
      review_plan rules, thirteen EXP-PRECOMP specifications and two EXP-AES run manifests.
      Those are named here so this record cannot be read as a clean bill, and they are NOT
      claimed as this session's to fix.

  forward_guidance: >-
    RUN THE VALIDATOR AS A DIFF, NOT AS A LOOK. tools/validate_ledger.py already separates
    new errors from grandfathered ones and prints the count first; the failure here was
    treating a long list as background noise rather than reading the two lines in it that
    named files this session had just written. The cheap discipline: before any ledger
    archive, grep the validator's output for the exact paths the commit will stage. That is
    a one-line filter and it would have caught this before the commit rather than after.

    Second: A COMPLETION GATE THAT SAYS "VALIDATOR PASSES" MUST RECORD THE OUTCOME, not
    just list the step. TASK-20260915-efa91b's gate named the run; nothing in its receipt
    records what the run said, so nothing distinguishes "ran and passed" from "ran and was
    read past". A receipt field carrying the new-error count for the staged paths would
    make the difference auditable instead of a matter of recollection.

  citations:
    - id: DEC-20260915-927eaa
      provenance: internal
      what: the record carrying the defect; read in full, and its knowledge_promotion block quoted above
      verified_by: coordinator, this session, which authored the record and is correcting its own defect
    - id: TASK-20260915-efa91b
      provenance: internal
      what: >-
        the ledger archive that committed the defective record, whose completion gate named
        a validator run whose outcome its receipt does not record
      verified_by: coordinator, this session, which read the receipt
    - id: CORR-20260916-2e9bc3
      provenance: internal
      what: >-
        the second in-place edit of committed artifacts this week, cited for why this
        correction supersedes additively instead of editing the original
      verified_by: coordinator, this session, which authored it
