  part_a_our_own_error:
    defect: >-
      GOAL-HQC-001 BATCH-002 opened asserting that the value 49 in the RS-S3
      parameter triple was the BATCH-001 TRANSCRIPTION'S OWN misreading of the
      specification. THAT ATTRIBUTION IS FALSE. The value 49 is PRINTED IN THE
      PUBLISHED SPECIFICATION.
    the_evidence: >-
      hqc_specifications_2025_08_22.pdf page 18, text layer, reads verbatim:
      "• RS-S3[90 = 255 −165, 32 = 197 −165, 49]." The PDF was re-acquired
      independently FIVE times across four sessions (BATCH-001 executor,
      BATCH-001 validator, the Coordinator, the BATCH-002 validator, the
      BATCH-002 red team), byte-identical every time at sha256
      174186cb5fdc0108aad914391360c222f52ea533bfb406146fac124b3a25406d. The
      text layer carries character codes and cannot manufacture a 5-to-4
      confusion, and the line was additionally confirmed against a rendered
      page.
    what_this_exonerates: >-
      TASK-20260802-6344ed TRANSCRIBED FAITHFULLY, and its classification of
      the discrepancy as SOURCE anomaly X6 WAS CORRECT. The BATCH-001 producer
      was right and two later reviewers were wrong about it.
    records_superseded_on_this_point:
      - record: coordination/goals/GOAL-HQC-001/batches/BATCH-002/BATCH-002-OPENING.md section 3
        text_superseded: "It is the transcription's own error."
        status: FALSE. Superseded here. The document is committed and is not edited.
      - record: >-
          coordination/goals/GOAL-HQC-001/batches/BATCH-001/reviews/TASK-20260802-73a352/red_team_report.md
          objection O1
        text_superseded: >-
          The claim that RS-S3[90,32,49] is "almost certainly the transcription's
          own extraction error ... filed as a source anomaly (X6) and left
          unmarked".
        status: >-
          FALSE ON ATTRIBUTION, CORRECT ON THE NUMBER. O1's identification of 49
          as wrong and its 50.7-bit consequence estimate stand; its attribution
          does not.
      - record: >-
          coordination/goals/GOAL-HQC-001/batches/BATCH-002/tasks/TASK-20260802-15971b/a17_sensitivity.yaml,
          step 8, per_set.HQC-5.delta_e_note
        text_superseded: >-
          "BATCH-002-OPENING.md section 3 records that the BATCH-001
          transcription's RS-S3 minimum distance 49 is the transcription's own
