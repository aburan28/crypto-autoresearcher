  part_b_a_defect_in_the_specification:
    statement: >-
      The HQC specification of 22/08/2025 prints RS-S3's minimum distance as 49.
      Its own definitions give 59. THIS IS A DEFECT IN THE PUBLISHED
      SPECIFICATION OF A SELECTED NIST ALGORITHM, recorded by this program, not
      caused by it.
    four_independent_routes_to_59:
      - id: R1
        route: The specification's own shortening arithmetic
        derivation: >-
          RS-S3 is shortened from RS[255,197] over F256; the printed triple
          itself gives n = 255 − 165 = 90 and k = 197 − 165 = 32, i.e. 165 is
          subtracted from BOTH n and k, so n − k = 58 is invariant and
          d = n − k + 1 = 59. Section 3.4.2 states the relation for this family
          directly ("n − k = 2δ", "d_min = 2δ + 1"), so NO EXTERNAL MDS THEORY
          IS IMPORTED. Verified on all three rows.
      - id: R2
        route: Table 3's delta
        derivation: "delta = 29 for RS-3/RS-S3, so d = 2*29 + 1 = 59."
      - id: R3
        route: The printed generator polynomial
        derivation: >-
          g3(x) as printed terminates in "+ 187x^57 + x^58", so deg g3 = 58
          = n − k = 2*delta, giving delta = 29 and d = 59. Found by
          TASK-20260802-63b16a; named by neither the handoff nor any BATCH-001
          review.
      - id: R4
        route: Consistency with the specification's own DFR target
        derivation: >-
          Only delta_e = 29 yields a Theorem 6.1 value consistent with Table 5's
          DFR < 2^-256 at HQC-5. Contributed by TASK-20260802-caddef.
    why_the_source_prints_49: >-
      49 = 80 − 32 + 1 is the CORRECT minimum distance for the n = 80 external
      code in Aragon-Gaborit-Zemor HQC-RMRS Figure 6 (KN-LIT-1c9474). The
      specification moved n from 80 to 90 and did not update d. A STALE
      PARAMETER, not a random typo. The same printed list is self-consistent on
      RS-S1 (31) and RS-S2 (33), so the defect is exactly one numeral —
      cross-check contributed by TASK-20260802-32250e.
    scope_of_the_consequence: >-
      THE PUBLISHED DFR WAS NOT COMPUTED WITH 49. TASK-20260802-caddef was
      directed at the uncomfortable possibility that HQC's own security claim
      rested on the wrong value and answered NO: Table 5 and Table 11 are
      consistent with 59. The defect is documentation, not a security claim.
      The BATCH-001 red team's 50.7-bit figure is the cost of PROPAGATING the
      error into a derived claim, which no filed record does — it is NOT a
      finding about HQC's security and must never be cited as one.

  part_c_a_second_documentation_defect_in_the_same_family:
    statement: >-
      The specification's internal references to Propositions 6.1.3 and 6.1.4
      are inconsistent: Table 11's column header names 6.1.4 while its caption
      names 6.1.3, and Theorem 6.1's own text names 6.1.3.
    resolution_derived_here: >-
      TABLE 11'S PRINTED VALUES ARE NUMERICALLY PROPOSITION 6.1.4'S. Theorem 6.1
      evaluated with Prop 6.1.3's p_i MISSES SPEC Table 5's own DFR targets at
      all three security levels (by 5.75 / 6.08 / 12.28 bits) while 6.1.4 clears
      at all three, and the specification's p.3 Changelog entry of 2020/10/01
      records that the improved Reed-Muller bound is what set the parameters.
      Derived by TASK-20260802-caddef.
    classification: >-
      A STALE CROSS-REFERENCE OF THE SAME FAMILY AS THE PRINTED 49. Resolving it
      moves ZERO published bits.
    defect_in_our_own_filing: >-
      KN-LIT-b9e1a8 item 3 FLAGS this inconsistency AND NEVER DERIVES THE
      RESOLUTION, and that entry is now immutable in the corpus. This is
      verbatim the failure mode the Coordinator faulted BATCH-001 for on the 49.
      Found by TASK-20260802-caddef objection O2 and confirmed by the
      Coordinator against the filed entry. The entry is NOT edited; this
      correction supplies the resolution it lacks, and anyone reading
      KN-LIT-b9e1a8 item 3 must read this record with it.

  unaffected_claims:
    - >-
      Every numeric result in the BATCH-001 transcription and in the A17
      characterization. delta_e = 29 is correct on either attribution, so no
