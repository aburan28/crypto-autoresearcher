      - record: >-
          The TASK-20260802-1f2e40-successor snapshot receipt and commit message
          a89e7542, which announced the reversal
        text_superseded: >-
          "BATCH-002-OPENING section 3, THIS BATCH'S OPENING COMMIT MESSAGE, and
