correction:
  id: CORR-20260802-3ae664
  date: '2026-08-02'
  goal_id: GOAL-HQC-001
  batch_id: BATCH-002
  reported_by: >-
    TASK-20260802-63b16a (executor), confirmed independently by the Coordinator,
    by TASK-20260802-32250e (validator) and by TASK-20260802-caddef (red team).
  record_type: correction_of_records_and_of_a_source_defect
  corrects: >-
    (a) THIS PROGRAM'S ATTRIBUTION of the RS-S3 minimum-distance defect, as it
    appears in three of its own records; and (b) separately, it RECORDS a defect
    in the HQC specification itself, which this program cannot fix and does not
