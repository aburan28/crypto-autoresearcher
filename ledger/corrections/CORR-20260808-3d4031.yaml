correction:
  id: CORR-20260808-3d4031
  recorded_at: '2026-08-08'
  recorded_by: >-
    top-level session running RQ-FALSIFY-a2c501 (NOT an independent Coordinator
    subagent, and NOT independently reviewed). This correction WITHDRAWS a claim
    made by this same session's own evidence record. It raises nothing.
  type: overstated_novelty_and_stale_premise
  supersedes: []
  corrects:
    - ledger/evidence/EV-FALSIFY-440677.yaml
  record_type: evidence
  record_id: EV-FALSIFY-440677

  # ---------------------------------------------------------------- item 1
  field: EV-FALSIFY-440677 "what_this_does_not_establish"
  prior_value: >-
    "the recorded proof sketch still argues 'for generic parameters, these m-1
    quadratic extensions are independent' and the finding still quantifies over
    EVERY curve; that quantifier gap is a defect in the ARGUMENT and no amount of
    sampling closes it, because an exceptional locus is by definition where
    genericity fails. ... The correct reading is that the finding's CONCLUSION
    survived a real attempt on it while its recorded PROOF remains a derivation
    with an unrepaired quantifier step."
  corrected_value: >-
    THE OBSERVATION WAS CORRECT AND IT WAS NOT NEW, AND THE WORD "unrepaired" IS
    FALSE AS OF 2026-08-07.

    CORR-20260807-652652, recorded the day before RUN-FALSIFY-d770c1-001, had
    already identified the same defect and stated it more sharply. It records
    that the sketch "omits the only step with mathematical content": inferring
    the faithful quotient C_2^{m-1}/{sigma_all} requires sigma_all to be the
    WHOLE kernel, which is equivalent to the 2^{m-2} signed sums being pairwise
    distinct at the generic point -- "so the sketch assumes away the question it
    answers". It further records that "these m-1 quadratic extensions are
    independent" is exactly the statement it is offered as a reason for.

    That correction also SUPPLIES the missing step, as Lemma 3.2 of
    papers/semaev-conservation-specialization/paper.tex: a coincidence among the
    roots forces a partial signed sum into E[2]; the summation map
    E^{m-1} -> E is a surjective homomorphism, so the preimage of the finite
    scheme E[2] is a proper closed subscheme; and the generic point of the
    integral variety E^{m-1} lies in no proper closed subscheme. It replaces the
    independence assertion with the observation that E^{m-1} -> (E/+-)^{m-1} is a
    fibre product of m-1 degree-2 Galois covers, so the deck group is
    (Z/2)^{m-1} by Artin's theorem -- with no computation and in EVERY
    characteristic.

    So the proof step was repaired before the probe ran. EV-FALSIFY-440677 should
    have said that the conclusion survived an independent finite-scale attack AND
    that its argument had already been completed elsewhere in the corpus.

  # ---------------------------------------------------------------- item 2
  additional_corrections:
    - field: EV-FALSIFY-440677 "successor_task"
      prior_value: >-
        "F-1b ... before any statement about KN-FIND-a1f3c2's universal
        quantifier is made either way."
      corrected_value: >-
        F-1b (targeted special families, m >= 6) remains worth running as an
        independent finite-scale check, but its stated motivation is void: the
        universal quantifier is no longer resting on a generic-case argument.
        Under Theorem A of KN-FIND-a8990a the group is (Z/2)^{m-2} with
        arithmetic monodromy equal to geometric monodromy, for every curve, every
        base field and every characteristic, so a counterexample search is now a
        check on the derivation rather than an open question about an exceptional
        locus. Re-scope F-1b accordingly or drop it.

    - field: EV-FALSIFY-440677 "knowledge_promotion_reason"
      prior_value: >-
        "The targeted-family sweep in docs/falsification-program.md F-1b is the
        successor that could change this."
      corrected_value: >-
        Unchanged in disposition -- promotion is still not warranted -- but for a
        different reason than the one recorded. A non-refutation still adds no
        mathematical content. What the run DOES contribute is independent
        corroboration, noted in item 3.

    - field: EV-FALSIFY-440677 scope of corroboration
      prior_value: (absent)
      corrected_value: >-
        RUN-FALSIFY-d770c1-001 independently corroborates the finite-scale
        dichotomy asserted by KN-FIND-a8990a Theorem A -- "totally split, or
        2^{m-3} quadratics, never anything else" -- on 1274 good specializations
        (906 at m=4, 368 at m=5, primes 11..103) with zero exceptions, using a
        separate implementation and its own null object. KN-FIND-a8990a reports
        241643 good specializations with zero exceptions. The two runs share no
        code. This is worth recording because a8990a's confidence_note states
        plainly that AGENTS.md rule 12 is NOT met for it; an independent
        reimplementation agreeing on the same dichotomy is a partial, and only
        partial, step toward that.

  # ---------------------------------------------------------------- cause
  cause: >-
    The probe was designed and run without first checking ledger/corrections/ for
    records targeting the finding under test. AGENTS.md's knowledge-retrieval
    policy requires a search before "asserting that an ECDLP avenue has already
    been tested" and before "changing an authoritative research conclusion", and
    a claim that a named proof step is UNREPAIRED is exactly such an assertion.
    The corpus is versioned by supersession rather than by edit, so a finding's
    own file is NOT the current state of its claim, and reading only the finding
    guarantees a stale premise. A sweep of ledger/corrections/ against all seven
    probe targets was run after this was discovered: only KN-FIND-a1f3c2 carried
    one, so EV-FALSIFY-2a5e46, EV-FALSIFY-40291d, EV-FALSIFY-67150b and
    EV-FALSIFY-e983ed are unaffected and stand as recorded.

  preventive_action: >-
    docs/falsification-program.md now carries a mandatory pre-step: before any
    probe, grep ledger/corrections/ and every finding's superseded_by for the
    target, and record the result in the run manifest. A probe that skips it may
    not assert that any defect is unrepaired.

  what_still_stands: >-
    Everything measured. The 0/906 and 0/368 violation counts, the null-object
    control at 0/1340 and 0/932, the positive control at 207/0 and 101/0, and the
    harness incident in which an uncontrolled probe manufactured a 28% false
    violation rate are all unaffected by this correction. What changes is the
    characterisation of the finding's proof status, not any measurement.
