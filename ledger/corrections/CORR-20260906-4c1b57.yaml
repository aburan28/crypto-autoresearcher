  field: >-
    (1) Kuperberg 2005 citation location; (2) Simon 2026 Theorem-vs-Proof
    scope disclosure; (3) manifest.yaml timing measurement and budget
    compliance; (4) manifest.yaml required_artifacts_crosscheck field
  prior_value: >-
    (1) applicability_audit.md cites "Kuperberg 2005, Section 3, p.2" for
    the quote "We will prove Theorem 1.1 in a convenient case, N=2^n, in
    Section 3" -- both the independent validator and red-team, fetching the
    actual PDF, found this exact sentence is in the paper's Introduction
    (Section 1, physical page 1), not Section 3 (which begins on page 2 and
    independently states the same N=2^n restriction in its own words).
    (2) applicability_audit.md quotes only Simon 2026's Proof clause "For
    simplicity, let N=2^n" without disclosing that the immediately
    preceding Theorem STATEMENT (same page 6) reads "N is exponential in
    n" -- a nominally broader scope the audit never surfaces or explicitly
    dismisses, found independently by both reviewers. (3) manifest.yaml
    records timing.started_at 2026-09-06T15:00:00Z and finished_at
    16:30:00Z (a 5400-second / 90-minute span) against
    specification.yaml's hard budget.wall_clock_seconds_per_run: 1800 (30
    minutes) -- a 3x apparent overrun -- while its own wall_seconds_note
    discloses these timestamps were never actually measured, only
    "approximate, reconstructed from session activity," and asserts
    without supporting arithmetic that this is "within the 1800s budget's
    intent." No resource_usage.json-equivalent artifact with a genuinely
    measured timer exists (contrast sibling RUN-MLKEM-12d9b8-001, which
    has one). (4) manifest.yaml contains no required_artifacts_crosscheck
    field at all, unlike its sibling RUN-MLKEM-12d9b8-001's manifest.
  corrected_value: >-
    (1) The Kuperberg citation should read "Section 1 (Introduction),
    physical p.1" for the quoted sentence; the substantive claim (Kuperberg's
    own algorithm is first proved only for N=2^n, generalized later in
    Section 5) remains independently true and is separately, correctly
    stated in Section 3 itself (p.2) in different words -- only the specific
    quoted sentence's location was misattributed, not fabricated or
    substantively wrong. (2) A corrected reading should explicitly state:
    Simon 2026's Theorem statement (Sec.2.2, p.6) asserts scope "N is
    exponential in n," but its Proof immediately narrows to "N=2^n, for
    simplicity," and the Proof is the only place the construction is
    actually established -- both independent reviewers, applying
    CSIDH-CHG-2's operative test to this broader Theorem-statement language
    directly, concluded it still does NOT satisfy criterion (i) (a bare,
    unaccompanied assertion of generality is not "a NAMED technique," and
    the Theorem's own proof never establishes the general case), so
    outcome B is NOT disturbed by this omission -- but the omission should
    have been surfaced and dismissed explicitly rather than left implicit,
    since a preprint's own Theorem-vs-Proof scope tension is exactly the
    kind of primary-source subtlety this contract's citation-completeness
    control exists to catch. (3) The 90-minute span reflects a genuine
    resource/instrumentation gap: this task's actual work (retrieving and
    reading five to eight full primary-source PDFs, cross-checking
    citations, and performing arithmetic verification) is not the kind of
    bounded compute run specification.yaml's 1800s wall-clock budget field
    was originally calibrated for elsewhere in this program, and no
    stopping_rule or invalidation_rule in specification.yaml or
    amendments/v1.yaml addresses a wall-clock overrun for this
    literature-heavy task shape. Neither reviewer found evidence the
    overrun reflects anything other than genuine reading/verification work
    (no idle time, no unrelated activity), but the timestamps are
    unmeasured and the budget compliance claim ("within the 1800s budget's
    intent") is unsupported as written. This is recorded as an open,
    disclosed instrumentation and budget-compliance gap, neither
    excused nor treated as invalidating the substantive findings (per
    AGENTS.md rule 3, an infrastructure/procedural gap is never negative
    mathematical evidence, and here it is also not evidence FOR the
    findings -- it is orthogonal to them, and both findings were
    independently re-derived from scratch by two separate reviewers
    regardless of how long the original run took). A future task of this
    literature-heavy shape should either use a genuinely measured wall-clock
    timer or specify a budget field calibrated for full-text literature
    review rather than bounded compute. (4) A required_artifacts_crosscheck
    section should be added for internal consistency with sibling runs in
    this same batch; both reviewers independently performed the crosscheck
    directly against specification.yaml's required_artifacts list and found
    all 5 items substantively present regardless of the missing
    self-attestation field.
