correction:
  id: CORR-20260801-758
  recorded_at: '2026-08-01'
  record_type: identifier_allocation
  record_id: GOAL-ECDLP-001/BATCH-020-021 branch records
  field: colliding_record_identifiers_and_the_allocation_rule_that_produced_them
  prior_value:
    remap:
      EV-DS-003: EV-DS-648
      DEC-20260801-001: DEC-20260801-629
      CORR-20260731-007: CORR-20260731-891
      CORR-20260731-008: CORR-20260731-463
      CORR-20260801-001: CORR-20260801-502
    note: >-
      Five identifiers were minted on branch
      claude/cryptanalysis-techniques-enrichment-wllntg and INDEPENDENTLY minted,
      with DIFFERENT content, on origin/main. git merge origin/main conflicted on
      23 files; these five were add/add conflicts on immutable ledger records.
  corrected_value:
    determination: >-
      THE BRANCH'S FIVE RECORDS MOVE TO RANDOMLY ALLOCATED IDENTIFIERS.
      origin/main keeps the original identifiers. NO CONTENT IS DISCARDED ON
      EITHER SIDE and no record is edited to agree with the other; this is the
      supersede-by-reallocation route, the same shape as CORR-20260731-006's
      KN-TECH remap.
  why_main_keeps_the_originals: >-
    EV-DS-003 IS FORWARD-REFERENCED AT THE MERGE BASE. Commit ea1c7001 already
    contains nine references to it, because BATCH-020's TASK-20260731-048
    declared ledger/evidence/EV-DS-003.yaml as a planned artifact before either
    line filled it. origin/main filled that slot, so the shared forward reference
    resolves to main's record and the branch's record is the one that must move.
    The other four are branch-minted with no merge-base presence; they move with
    it so the whole set stays internally consistent.
  rule_15_precheck_performed: >-
    AGENTS.md rule 15 forbids remapping an identifier named in a COMPLETED
    archive's binding fields, because the commit is immutable and its declared
    set could never agree with the tree again - that is exactly how
    CORR-20260731-891 (formerly -007) and CORR-20260731-010 arose. CHECKED BEFORE
    REMAPPING: the only archive naming these records is BATCH-021's
    TASK-20260801-003, which is state `queued` with archive.commit_sha null. No
    completed archive binds any of the five. THE REMAP IS THEREFORE SAFE, and the
    check was run first rather than after.
  known_residue_disclosed: >-
    THE COMMIT MESSAGES OF c5972948 AND c17a7cea NAME THE OLD IDENTIFIERS
    (EV-DS-003, DEC-20260801-001, CORR-20260801-001) AND CANNOT BE REWRITTEN -
    they are pushed. Anyone reading git history will see the pre-remap names.
    This record is the mapping. No attempt is made to rewrite that history, and
    no archive binds those messages.
  the_allocation_rule_this_changes: >-
    ROOT CAUSE WAS SEQUENTIAL ALLOCATION. tools/allocate_id.py --next returned
    max+1, so every concurrent worktree computed the SAME next identifier from
    the SAME committed state and minted it for DIFFERENT records. Adopted this
    date: --next now allocates a suffix UNIFORMLY AT RANDOM from the free tail
    above the current maximum, never filling a gap; --sequential is opt-in and
    documented as the collision bug rather than a fallback. Recorded as AGENTS.md
    rule 14, with rule 15 recording that a remap is a last resort. Four tests pin
    the behaviour in tools/test_allocate_id.py.
  residual_collision_probability: >-
    STATED RATHER THAN IMPLIED: randomisation REDUCES collisions, it does not
    eliminate them. Two worktrees drawing from a tail of length L collide with
    probability about 1/L per identifier - for CORR-20260801 today, about 1/996.
    The --check step before use remains mandatory, and it is what catches the
    residue.
  what_this_does_NOT_do:
    - Changes no finding, disposition, claim tier or hypothesis status. The renamed records carry identical content under new identifiers.
    - Does not merge origin/main and does not resolve the remaining content conflicts, which include the RUN-DS-001-ctrl-unplanted package and ledger/goals/GOAL-ECDLP-001.yaml.
    - Does not assert that the branch's BATCH-020/021 line supersedes main's; both lines reached the same substantive conclusion independently and that is for the Coordinator to reconcile.
  evidence_artifacts:
    - tools/allocate_id.py
    - tools/test_allocate_id.py
    - AGENTS.md
    - CLAUDE.md
