correction:
  id: CORR-20260822-40bcb5
  recorded_at: '2026-08-22'
  record_type: claim
  record_type_note: >-
     "claim" is the closest permitted token (record_type: candidate | claim |
     run per templates/research-records.md), following the CORR-20260724-001,
     CORR-20260802-a1f151, and CORR-20260819-08ff19 precedent. The corrected
     artifact is a frozen, hash-pinned run manifest that predates the nested
      `run:` schema; because that run's original bytes are immutable
     (AGENTS.md core rule 4), the correction documents the defect and the
      deferral of its schema completion rather than rewriting the manifest.

  corrected_record: experiments/EXP-SSI-697354-v2/runs/RUN-SSI-697354-v2-a/manifest.yaml
  corrected_record_commit: a035baddeee07632ef2f3e50f332bf3b7f03f71a
  corrected_record_commit_note: >-
     The frozen git_commit recorded inside the manifest itself. The same
     manifest (byte-identical) is present on origin/main and on this branch's
     head, so the defect is NOT a regression introduced by any open branch --
     it is pre-existing main-side schema debt that simply post-dates the
     prune-only grandfather baseline tools/validate_ledger_baseline.txt
     (registered 2026-08-02).

  defect: >-
     validate_ledger.py reports "expected top-level key 'run'" for this file.
     The manifest is in the FLAT pre-nested schema (command, environment,
     outputs, resource_limits, seed, validity_* at the top level) rather than
     the current nested shape `run: {id, experiment_id, status, code,
     environment, inputs, timing, result}`. 423 of 2235 committed run
     manifests are flat in this way; most are frozen in the prune-only
     baseline, but this one was snapshotted 2026-08-17 (TASK-20260817-4d5e6f,
     commit 06a255416) -- after the baseline re-anchor -- so it is reported as
     a new violation rather than a grandfathered one. It is the sole non-
     grandfathered error from validate_ledger.py as of this record.

  why_not_silently_repaired:
      - >-
        The manifest's bytes are immutable (AGENTS.md core rule 4; the run was
        snapshotted under an archived ledger receipt). Wrapping the existing
        top-level keys under a `run:` block -- or editing them in place -- is
        the exact silent mutation the rule forbids.
      - >-
        tools/validate_ledger_baseline.txt is prune-only: a new line may not
        absorb a new violation. Grandfathering this entry is therefore not a
        permitted repair either.
      - >-
        The only mechanism that CLEARS the error is a registered superseding
        manifest via tools/run_supersession_registry.yaml, and the validator
        only routes to it when a complete `manifest_v2.yaml` exists in the run
        directory (validate_ledger.py check_run: it falls back to in-place
        validation -- and re-reports the error -- when superseding_path is
        missing). A complete nested completion requires
         {id, experiment_id, status, code:{commit,command}, environment,
        inputs, timing, result}, and this run's flat manifest records NONE of
        id / inputs / result / actual timing. Fabricating those values would
        violate AGENTS.md core rule 9 (never fabricate commands, outputs, or
        timings). There are real companion artifacts in the run directory
        (raw-result.json, monotonicity.json, null_object.json,
        p_star_table.json, sensitivity.json, undefined_segments.json,
        scope_statement.json, execution_report.yaml, stdout.txt, stderr.txt,
        cross_check_secondary.json, input_hashes.json, environment.json), but
         the mapping from those to the required nested fields is run-specific
        and must be performed by the owning Coordinator, not inferred here.

  correction_1:
    field: the frozen run manifest's shape under the current run schema
    action: DEFER, DO NOT EDIT
    rationale: >-
      The defect is schema debt, not a scientific result; the run's scientific
      content is intact and cited elsewhere. Editing it is forbidden by core
      rule 4, and inventing the missing nested fields is forbidden by core
      rule 9. The correct disposition is an additive_schema_completion
      supersession filed by the owning Coordinator after the real
      input/result/timing values are recovered from the archived companion
      artifacts by that Coordinator.
    next_action: >-
      GOAL-SSI-001's owning Coordinator should (1) read the run directory's
      companion artifacts, (2) author experiments/EXP-
      SSI-697354-v2/runs/RUN-SSI-697354-v2-a/manifest_v2.yaml in the nested
      shape deriving id / inputs / result / timing / code ONLY from archived
      bytes, (3) register it in tools/run_supersession_registry.yaml with the
      additive_schema_completion fields (superseded_sha256 of the flat
      manifest + superseding_sha256 of the new file), so the error clears by
      routing rather than by mutation, and (4) confirm validate_ledger.py is
      back to green. This record is the superseding documentation of that
      deferral; it does not itself complete the run.
    completion_state: DEFERRED -- schema completion owned by GOAL-SSI-001 Coordinator.

  boundaries_unchanged:
      - "No run was re-executed and no scientific figure changed."
      - "The flat manifest bytes were NOT modified by this record."
      - "No baseline line was added (prune-only invariant preserved)."
      - "No experiment, hypothesis, or goal status changed."

  raised_by: >-
    The 2026-08-22 continuation session (OpenCode harness; self-reported
    serving model vllm/qwen3.8-27b on the local backend, unverified -- the
    adapter is the authority) while reconciling the standing ledger for a
    commit request. The defect was discovered by running
     tools/validate_ledger.py, which reported exactly one non-grandfathered
    error: this manifest.

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      A schema-debt deferral records no measurement and promotes nothing.

  attestation:
    decision_authored_by: "coordinator (top-level harness session)"
    resolved_model_id: "vllm/qwen3.8-27b"
    model_verified: "unverified (adapter is authority)"
    bedrock: "not selected, configured, probed, or used"
