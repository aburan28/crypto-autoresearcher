  nature: >-
    The D6 design packet and its receipt were committed in snapshot commit
    ef3431b991. No goal_lanes claim for TASK-20261011-29ed96 and no open-lane
    record for BATCH-e261c2 existed before that commit. The design producer's
    declared source paths were first committed in that snapshot, so they were
    not committed and pushed before archival dispatch. The original queue
    remains queued with null archive binding because it is one of the nine
    source artifacts captured by the commit. These are real dispatch and lane
    precondition deviations; Conductor path claims do not substitute for a
    goal_lanes claim. A later claim or lane record cannot make the earlier
    dispatch compliant. The additive correction source paths also first enter
    Git in their own snapshot, so their pre-dispatch committed-and-pushed
    input requirement remains unmet despite the prospective lane and claim.
  disposition: >-
    Preserve all ten bytesets in ef3431b991. The additive
    dispatch_queue.post_snapshot.json records the actual verified commit and
    the ten content hashes, while dispatch_queue.correction.json owns this
    correction packet. Neither file rewrites the original source queue or
    receipt. Treat the archival content binding as distinct from procedural
    compliance. Before any successor dispatch, register a prospective lane,
    commit and push its declared inputs, and claim the Ready task under the
    active lane; never backdate those records.
  effect_on_research: >-
    This correction changes no experiment result, D6 instrument acceptance,
    ECDLP claim, approval, or scientific status. EXP-ICPERF-104054 remains
    review_required with approved_by null; D6 has not been accepted by a run.
  citations:
