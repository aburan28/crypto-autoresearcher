        coordination/goals/GOAL-ICPERF-e6b6a4/batches/BATCH-e261c2/archives/TASK-20261011-29ed96/snapshot-receipt.json
      provenance: internal
      verified_by: coordinator, this correction session, from the frozen receipt and commit identity.
    - claim: Precommit claim and lane records did not exist.
      source: >-
        BATCH-e261c2 goal_lanes claim and GOAL-ICPERF-e6b6a4 lane feeds
        inspected before this correction; no precommit entries for the batch.
