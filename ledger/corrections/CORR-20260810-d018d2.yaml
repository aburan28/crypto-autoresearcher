    is dated 2026-07-31 13:24. The goal record is byte-identical from 24068f305
    through origin/main today. So the BATCH-005 ledger archive LISTED
    GOAL-DREG-001 in record_ids and DECLARED its digest while MAKING NO
    GOAL-HEAD TRANSITION: it bound bytes that already existed and were already
    stale. The update was NEVER MADE; it was not made-and-lost. This closes the
    question of why the head stood at current_batch_id BATCH-003 / updated_at
    "2026-07-27" with no BATCH-004 or BATCH-005 checkpoint, and it is why those
    two checkpoints are being appended in 2026-08 rather than in 2026-07.
    Reported by the dispatching session, which ran the git checks; this
    Coordinator session verified nothing itself.

