  reason: >-
    An identifier remap is a last resort, not a repair (AGENTS.md rule 15).
    Renaming records that a completed archive names in its binding fields breaks
    that archive permanently: the commit is immutable, so its declared set and
    the live tree can never be reconciled. That is precisely what happened here -
    the remap moved the bytes and left the receipts declaring digests that now
    match nothing at the paths they name, so an archive that was genuinely
    content-verified at 2f7771fa0124 reads today as a failed verification. The
    second defect is worse and is a record LOSS rather than a binding failure: a
    legacy three-digit decision identifier was reused by an unrelated campaign
    for different content, and the merge that kept one version silently removed
    the other. A destroyed adjudication is not a superseded one, and this program
    may not let an official BATCH-005 decision simply be absent while the
    evidence it adjudicated remains on the ledger. This record makes both
    defects, their exact commits, and the recovery route explicit so that no
    later reader mistakes a broken content binding for a defective measurement,
    or an absent decision for a decision never made.

  independent_verification: >-
