  prior_value: >-
    The two BATCH-005 archive receipts assert that their declared repository
    paths hold exactly the bytes named by their declared sha256 digests. The
    snapshot receipt
    coordination/goals/GOAL-DREG-001/batches/BATCH-005/archives/TASK-20260731-025/snapshot-receipt.json
    declares nine producer paths under
    coordination/goals/GOAL-DREG-001/batches/BATCH-005/tasks/TASK-20260731-016/
    (run_manifest.yaml, results.json, execution_report.md, stdout.log,
    stderr.log, ctrlb_execute.py, raw-result.json, column-audit.json,
    chunk-coverage.log) with their digests. The ledger receipt
    coordination/goals/GOAL-DREG-001/batches/BATCH-005/archives/TASK-20260731-027/ledger-receipt.json
    declares five paths - the two review artifacts under
    coordination/goals/GOAL-DREG-001/batches/BATCH-005/tasks/TASK-20260731-026/
    (red_team_report.yaml, falsification_review.md), ledger/evidence/EV-DREG-008.yaml,
    ledger/decisions/DEC-20260731-014.yaml at digest
    6093f111f4b1f7eef4c5da8e067a9f8e8cb14984c1885cbdff88414ba1a0a81b, and
    ledger/goals/GOAL-DREG-001.yaml - and names record_ids EV-DREG-008,
    DEC-20260731-014, GOAL-DREG-001. Read at face value, that pair of receipts
    asserts that the GOAL-DREG-001 BATCH-005 CTRL-B producer package and its
    adjudicating coordinator decision are both byte-bound and retrievable at the
    declared paths on origin/main.

  corrected_value: >-
    Neither assertion holds on origin/main, for one shared cause. The CTRL-B
    producer run originally executed as TASK-20260731-011 and was
    snapshot-archived by TASK-20260731-012 at commit
    2f7771fa0124cca31ef446fbec6aefc5b64a52d7, which is an ancestor of
    origin/main. Merge commit b1dfd9865b2e8bebac0ecca0fe824ca3cd46427d ("merge
    origin/main into cursor/ecdlp-tier-path-goals; remap colliding ledger IDs",
    2026-07-31) resolved an identifier collision by reissuing this campaign's
    task identifiers under free ones - TASK-20260731-011 -> TASK-20260731-016,
    TASK-20260731-012 -> TASK-20260731-025, and the review and ledger tasks ->
    TASK-20260731-026 and TASK-20260731-027. The remap wrote the artifacts to NEW
    paths with the embedded identifiers edited, so the copies' bytes differ from
    the originals, while the reissued receipts kept declaring the ORIGINAL
    digests. The pre-remap TASK-20260731-011 and TASK-20260731-012 paths no
    longer exist on origin/main. Net effect, as reported by the dispatching
    session: 6 of the 9 paths declared by the TASK-20260731-025 snapshot receipt,
    and 2 of the 2 review paths declared by the TASK-20260731-027 ledger receipt,
    fail content verification against their own declared paths; the declared
    digests appear nowhere in history at the post-remap paths. The three that
    still match are stderr.log, column-audit.json and chunk-coverage.log, which
    the remap did not alter. Separately, the ledger receipt's declared
    ledger/decisions/DEC-20260731-014.yaml at digest 6093f111... was the
    GOAL-DREG-001 BATCH-005 coordinator decision as it stood at commit
    4692de41f; commit 98fa35db1 wrote a DIFFERENT record at that same legacy
    three-digit path for GOAL-ECDLP-001 BATCH-021, and merge 3b342d3c5
    (2026-08-03) kept the GOAL-ECDLP-001 version. Today
    ledger/decisions/DEC-20260731-014.yaml is a GOAL-ECDLP-001 / BATCH-021
    record. Consequently the GOAL-DREG-001 BATCH-005 coordinator decision exists
    at NO path on origin/main. It was DESTROYED BY A LEGACY THREE-DIGIT
    IDENTIFIER COLLISION, not superseded on the merits by a later decision. Both
    receipts additionally carry commit_sha: null and parent_sha: null, never
    backfilled, so neither can be checked by commit reachability either - the
    same is true of every BATCH-004 and BATCH-005 archive receipt.

  measurement_not_in_doubt: >-
    THE UNDERLYING MEASUREMENT IS NOT IN DOUBT AND IS NOT WHAT FAILED. The
    dispatching session reports that all NINE declared artifact digests in the
    current snapshot receipt verify EXACTLY - 9 match, 0 mismatch - against the
    pre-remap TASK-20260731-011 paths at commit
    2f7771fa0124cca31ef446fbec6aefc5b64a52d7. The CTRL-B producer package is
    therefore content-verified and sound at that commit, and this correction
    records no doubt about the run, its instrument, its chunk coverage, or the
    rank it reports. What failed is (a) the ARCHIVE'S CONTENT BINDING - the
    receipts point at paths that no longer carry the declared bytes - and (b) the
    EXISTENCE of the adjudicating decision record. Re-running the measurement is
    neither required nor authorized by this correction.

