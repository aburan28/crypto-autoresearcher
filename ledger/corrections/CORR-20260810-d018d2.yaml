    origin/main, the 6-of-9 and 2-of-2 post-remap mismatches, the identity of
    the record now at ledger/decisions/DEC-20260731-014.yaml, and the
    recoverability of the pre-remap decision content at 4692de41f. THIS
    COORDINATOR SESSION HAS NO SHELL: it ran no git command, computed no hash,
    and verified no blob. It read the receipts, the red-team report, the goal
    record and the two evidence records in the working tree, and took the git
    facts from the dispatching session as reported. No independent reviewer has
    checked this correction. THE SAME ATTRIBUTION COVERS THE SECOND ROUND OF
    FINDINGS BELOW - fifth_declared_path_resolved, stale_queue_state_observation
    and off_main_work_not_lost, including the 24068f305 dating, the branch and
    mirror-ref reachability, and the off-main record identifiers. Those git
    checks were also run by the dispatching session, not by this Coordinator
    session, which still has no shell.

