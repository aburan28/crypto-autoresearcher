correction:
  id: CORR-20260802-1a713e
  recorded_at: '2026-08-02'
  record_type: harness_environment
  record_id: GOAL-ECDLP-001/BATCH-028/TASK-20260802-dce621
  field: scope_of_the_primary_source_verification_blocker
  supersedes_field_in: coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/dispatch_queue.json (TASK-20260802-dce621.blocked_reason)

  prior_value:
    blocked_reason_as_first_written: >-
      "REQUIRES A SESSION WITH WORKING PRIMARY-SOURCE ACCESS AND A DISTINCT
      MODEL IDENTITY. The session that produced TASK-20260802-a04888 could not
      reach any of the four cited sources (HTTP 403 at the agent proxy for
      www.math.snu.ac.kr, ee.stanford.edu and www.math.uni-leipzig.de; control
      fetch of eprint.iacr.org also refused)."
    why_that_understates_it: >-
      As written it reads as a property of one session and four URLs, which
      invites a future session in the same environment to retry and rediscover
      the same wall. The blocker is environmental, not per-session.

  corrected_value:
    determination: >-
      SCHOLARLY EGRESS IS CLOSED FOR THE WHOLE ENVIRONMENT, NOT FOR ONE SESSION
      OR FOUR URLS. No session running in this Claude Code remote execution
      environment can discharge a primary-literature verification task,
      regardless of model, effort, or retry.
    probe_performed_at: '2026-08-02'
    probe_method: >-
      curl with a 12 s timeout against eight scholarly hosts spanning
      preprint servers, resolvers, publishers, indexes and a general reference
      host, after confirming the agent proxy itself reports enabled with an
      empty recentRelayFailures list.
    probe_result_all_refused:
      - https://arxiv.org
      - https://doi.org
      - https://www.semanticscholar.org
      - https://dl.acm.org
      - https://link.springer.com
      - https://en.wikipedia.org
      - https://api.crossref.org
      - https://www.iacr.org
    probe_result_detail: >-
      Every host returned HTTP status 000 with the connection refused at the
      proxy ("CONNECT tunnel failed, response 403"). Earlier in the same
      session the four hosts cited by TASK-20260802-018 returned 403 through
      WebFetch, and a control fetch of eprint.iacr.org was refused the same
      way. Reachable egress is limited to the destinations named in the proxy's
      noProxy list -- package registries, GitHub, and Anthropic endpoints.
    consequence_for_this_harness: >-
      Any task whose completion gate includes "check the primary source" is
      structurally undischargeable here. That covers theorem-scout verification
      of the kind BATCH-026 and BATCH-027 ran, literature promotion into
      knowledge/literature that asserts more than an abstract, and any review
      obligation phrased as re-verification against a cited paper.
    routing_requirement: >-
      TASK-20260802-dce621 must be routed to the runtime the campaign already
      uses for literature work. BATCH-027's own reviewer session
      (TASK-20260802-018) checked seven sources by URL and recorded
      resolved_model_id gpt-5 with fallback_used true, so such a runtime exists
      and is not this one. Routing there also satisfies the independent-model
      requirement in the same move.

  what_is_NOT_claimed:
    - >-
      This does not assert the environment is misconfigured. An egress
      allowlist is a deliberate policy of the remote execution environment, and
      the correct response is to route the task, not to work around the policy.
    - >-
      This does not invalidate BATCH-028's correction. That correction's
      arithmetic was verified in-session and stands; only the source
      attributions remain carried_unverified, exactly as its
      verification_provenance block already states.
    - >-
      This does not reopen or change any disposition, hypothesis status, claim
      tier, or goal status.

  effect_on_research_state:
    dispositions_changed: 0
    statuses_changed: 0
    hypotheses_moved: []
    goal_status_changed: false
    claim_tier: none

  inference:
    requested_policy: coordinator-orchestration-code
    resolved_model_id: claude-opus-5
    model_verified: false
    fallback_used: true
    fallback_reason: >-
      Run under the Claude Code harness, which cannot resolve the GPT-5.6
      family policy aliases in orchestration/model-policies.yaml. The actual
      resolved model is recorded directly per the CLAUDE.md model policy note.
    degraded_requirements: []
