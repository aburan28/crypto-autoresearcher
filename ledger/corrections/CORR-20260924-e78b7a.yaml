# =============================================================================
# CORR-20260924-e78b7a -- SUPERSEDES A CONSUMER PRESUMPTION, NOT ANY FILE: the
# readers of the callgrind child's record in the EXP-GFPN-05ff43 repair
# lineage.
#   (1) The DRAFT AMD-EXP-GFPN-05ff43-20260924-launchcover states, as premise
#       LP-2 (iv), that "no frozen, r1 or r2 function other than
#       r2_reg1.compare reads instructions_callgrind or any of its keys"
#       (lines 618-623), and in CG-4 that in cells "the callgrind fields are
#       recorded and no check reads them" (lines 355-358). Both are false.
#       The frozen and preserved run wrappers collect
#       child.rlimit_as_child_getrlimit from the WHOLE raw result by key name,
#       which picks up the callgrind child's read-back, and the frozen checker
#       v2_check_run.main fails a package if any collected read-back differs
#       from the requested cap. r1_reg1.compare also compares the record.
#   (2) DEC-20260924-afdc3b's seed_sensitivity_ruling says "In cells the
#       callgrind fields are recorded and no check reads them (census.md line
#       311; v2_scoring reads no instructions_callgrind key, by search)"
#       (lines 327-330). Same presumption.
#   (3) The census says the callgrind site "enters neither classify_solve ...
#       nor any frozen v2 or v2-a1 check or gate" (census.md line 311). Its
#       record's read-back field does enter the frozen v2 checker's cap check,
#       through the wrapper's manifest. Reading note only: the census's CN-1
#       classification of the site (CLASSIFIED) is unaffected.
# Found by the premise check TASK-20260924-159c1b (premise-check.md lines
# 513-532, 1242-1288) and confirmed by the Coordinator reading the frozen and
# preserved code under TASK-20260924-410b46.
# WRITE-ONCE. Written by the Coordinator under TASK-20260924-410b46 (ruled in
# DEC-20260924-a7453e), archived by TASK-20260924-a28f0e. No existing file is
# edited.
# =============================================================================
