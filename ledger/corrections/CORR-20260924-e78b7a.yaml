      prior_value: >-
        r2_reg1.compare is the only frozen, r1 or r2 function that reads the
        callgrind record, and in cells no check reads it.
      corrected_value: >-
        Six further readers exist (premise-check.md lines 524-531; receipt
        TASK-20260924-0957c2 lines 86-93):
        - v2_run_wrapper.main (v2_run_wrapper.py line 202, via collect at
          lines 71-80), a1_run_wrapper.main (line 324), r1_run_wrapper.launch
          (line 408) and r2_run_wrapper.launch (line 474) each call
          collect(raw, "rlimit_as_child_getrlimit") over the whole raw result.
          collect recurses into every mapping, so it gathers
          instructions_callgrind.child.rlimit_as_child_getrlimit (written at
          v2_solver.py line 519) together with the primary children's
          read-backs. The deduplicated set is recorded as manifest
          resources.child_rlimit_as_read_back_by_getrlimit (v2_run_wrapper.py
          line 222; a1 349; r1 443; r2 517).
        - v2_check_run.main (lines 62-70) fails the package ("child RLIMIT_AS
          read-back ... != requested ...") if any entry of that list differs
          from resources.child_rlimit_as_requested_bytes. a1_check_run.main
          runs it unchanged (line 133), and r2_check_run runs a1_check_run.main
          (line 70) or v2_check_run (imported at line 47) unchanged; r1_check_run
          likewise (line 37).
        - r1_reg1.compare (r1_reg1.py lines 168-174) compares every target
          entry whole, minus the r1 exclusions, as r2_reg1.compare does.
        So in every package whose raw result carries a callgrind record
        (fixture, and cells with m = 4 at target 0; census.md lines 281-287),
        a check DOES read one callgrind field: the child's cap read-back. The
        other callgrind fields are, as far as the premise check's search
        reached, read only by REG-1 (b) and the r1 comparator.
        By the Coordinator's own search under TASK-20260924-410b46 (not a
        premise-check result), three development harnesses also read the
        derived manifest list, report-only: r2_dv12.py line 261, r1_toy.py
        line 386 and a1_toy.py line 380.
      evidence: >-
        premise-check.md lines 513-532 (key set, compared subset,
        discrepancies), 1242-1288 (generic consumers and manual readings);
        the Coordinator's reading of v2_run_wrapper.py lines 71-80 and
        195-226, v2_check_run.py lines 38-109, r1_reg1.py lines 150-184,
        r2_check_run.py lines 55-70, r2_dv12.py lines 253-261, and the call
