        read from the child's own getrlimit and is not a function of msolve's
        clock seed. A read-back different from the cap would fail the
        package, never alter D or an outcome silently.
      evidence: As item 1. The decision's hash is the TASK-20260924-b2b59a path_sha256 value, as premise-check.md line 280 quotes it.
