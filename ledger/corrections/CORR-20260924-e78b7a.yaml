      why_it_matters: >-
        The draft's disposition for the callgrind site pre-declared a reading
        only for a REG-1 difference (CG-4). A callgrind child whose cap
        read-back differed from the requested cap would instead fail the
        frozen checker, in any package with a callgrind child, G1 and m = 4
        cells included, with no pre-declared reading. In RUN-GFPN-ac4487 all
        36 callgrind read-backs equal the cap, {10737418240, 10737418240}
        (premise-check.md lines 1298-1333), and the child is launched with the
        same cap as the primary child (v2_driver.py line 209, ctx.cap). So the
        exposure is narrow. It is still a checker path that the draft said
        did not exist, and the draft's LP-2 reading makes that a bar.
