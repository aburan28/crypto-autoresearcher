  record_type: draft_amendment_correction
  record_id: AMD-EXP-GFPN-05ff43-20260924-attcount
  record_path: experiments/EXP-GFPN-05ff43/amendments/v2_addendum_attcount.yaml
  record_sha256: 4154fd5206dde2987f9fe049e779078f7212c6d4afd23d9303e880946ea11a48
  record_sha256_note: >-
    As bound by the TASK-20260924-2a7c7f receipt (path_sha256, line 40;
    addendum_sha256, lines 61-69). This act computed no hash.
  field: >-
    Statements about which lost launches RI-1 detects, the scope of RGL-9,
    RI-4's list of development path values, the temporal clause of RI-5 (a),
    and the expected outcomes and stand-in level of RI-3 (24)-(26)

  items:
    - item: 1
      what: RI-1's WHY sentence on the callgrind launch, and option IE's claim that RI-1 covers middle and last losses
      records:
        - id: AMD-EXP-GFPN-05ff43-20260924-attcount
          path: experiments/EXP-GFPN-05ff43/amendments/v2_addendum_attcount.yaml
          locations:
            - lines: 340-345
              context: RI-1 WHY ("The callgrind launch needs no count of its own ... so a re-solved tag has at most one callgrind launch per solve call, and (b) covers a tag solved twice.")
            - lines: 594-601
              context: options_weighed IE ("RI-1 covers both with records the layer already writes.")
      prior_value: >-
        The callgrind launch needs no count of its own, because a re-solved
        tag has at most one callgrind launch per solve call and RI-1 (b)
        covers a tag solved twice; RI-1 covers a lost middle record and a lost
        last record with records the layer already writes.
      corrected_value: >-
        RI-1 (b)'s uniqueness bounds DUPLICATION (TW-1 FAILs), not LOSS. A
        callgrind launch whose record is lost is detected only if its child
        left a file (LC-1 FAIL); a callgrind child that fails before creating
        its stdout file (v2_solver.py 188, 206-208) leaves none, and with its
        record lost the package PASSes (CX-A, review-report.yaml 397-442;
        TW-2 218-221; OB-2 480). RI-1 covers middle and last losses for the
        msolve and health launches only. The gp launch is in the same position
        once its pre-launch script is listed as a non-launch write (CX-A-gp,
        428; OB-8 486).
      consequence: >-
        RFR-1 fails on CX-A (DEC-20260924-babd04). The successor launchkind
        RJ-1 binds the callgrind launch to a presence bit of the returned
        solve result and replaces the sentence (RJ-1 (e)); RJ-2 restores the
        gp script as launch evidence; RJ-4 tables every launch kind.
      evidence: review-report.yaml 212-221, 397-442, 480, 486; v2_solver.py 177-239, 512-552; v2_driver.py 207-209 (read by DEC-20260924-babd04).
    - item: 2
      what: RI-2's restated RH-1 WHY sentence, as a claim about lost launches
      records:
        - id: AMD-EXP-GFPN-05ff43-20260924-attcount
          path: experiments/EXP-GFPN-05ff43/amendments/v2_addendum_attcount.yaml
          locations:
            - lines: 360-364
              context: RI-2 ("RI-1 binds the number of those records to counts written independently in the installing process; a file of a lost launch record is then a gap unless every such count was lost with it (RGL-9).")
      prior_value: >-
        With RI-1, a file of a lost launch record is a gap unless every count
        was lost with it.
      corrected_value: >-
        The sentence is true of FILES. It is not a statement that every lost
        launch is detected: a launch that left no file has nothing to be a
        gap, and it is detected only where a count binds its kind (msolve and
        health launches under RI-1). For the callgrind and gp kinds no count
        bound it (CX-A, CX-A-gp).
      consequence: None on any verdict beyond item 1's. launchkind RJ-7 (c) adds the per-kind statement to the WHY sentence.
      evidence: review-report.yaml 222-227, 397-442.
    - item: 3
      what: the undetected class RGL-9 declares
      records:
        - id: AMD-EXP-GFPN-05ff43-20260924-attcount
          path: experiments/EXP-GFPN-05ff43/amendments/v2_addendum_attcount.yaml
          locations:
            - lines: 497-505
              context: RGL-9 ("A loss that removes a launch record AND every count RI-1 reads for it consistently ..., or an alteration of solver-events.json after the launch, is not detected by RI-1; ... RL-3's listing hashes show an alteration after the fact (RGL-7).")
      prior_value: >-
        Every consistent loss of a launch record with its counts, and every
        alteration of solver-events.json after the launch, go undetected by
        RI-1 and are visible only after the fact through RL-3's listing
        hashes.
      corrected_value: >-
        A consistent loss FAILs whenever the launch left a file in the five
        directories (LN-3, LN-4b, LE-3 FAIL by file gaps); the undetected
        class is the consistent loss of a launch that left no file (LN-6
        meets no definition; LN-7b meets (ii)) (OB-1, 479). At an event tag
        the event's attempts list is the attempt-record list, so the
        independent counts there are accepted_attempt, the renamed_files keys
        and the site counters (OB-10, 488). An alteration of solver-events.json
        after the manifest records its hash FAILs the carried V-7 item; one
        between the launch and the manifest write is not detected by V-7
        (OB-3, 481).
      consequence: None on any verdict. launchkind RGL-10 replaces RGL-9 with this statement.
      evidence: review-report.yaml 198-210, 222-227, 479, 481, 488.
    - item: 4
      what: RI-4's list of development path values and its "as a path prefix"
      records:
        - id: AMD-EXP-GFPN-05ff43-20260924-attcount
          path: experiments/EXP-GFPN-05ff43/amendments/v2_addendum_attcount.yaml
          locations:
            - lines: 414-430
              context: RI-4 ("every recorded value that carries the development run directory as a path prefix, in particular ... the 'script' and 'command' fields a1_pari.py 97 writes; and the 'input.path' and 'command' fields a1_health.py 148-149 writes ... A recorded value carrying the development run directory other than as a path prefix ... is a STOP.")
      prior_value: >-
        The listed values carry the development run directory as a path
        prefix, and the list, with the general clause, covers every such value
        of the three development packages.
      corrected_value: >-
        The two "command" fields RI-4 names (a1_pari.py 97; a1_health.py 149),
        the S-2 attempt record "command" (r3_resolve.py 198) and command.txt's
        second line carry the run directory INSIDE a command string, not as
        its prefix, so under a strict reading RI-4's last sentence STOPs on
        the values it names (FC-2, 456-461). The list omits the S-2 attempt
        record command and command.txt line 2 (covered by no clause) and the
        launch-record stdout_path / stderr_path (covered only by the general
        clause), and over-includes the controls builds' raw build npz, which
        the controls raw-result.json does not carry (v2_driver.py 768, 816)
        (OB-5, 483; RI-4_enumeration 342-353).
      consequence: A development STOP by construction, never a result. launchkind RJ-6 repairs the clause and the list.
      evidence: review-report.yaml 342-353, 456-461, 483.
    - item: 5
      what: the temporal clause of RI-5 (a)
      records:
        - id: AMD-EXP-GFPN-05ff43-20260924-attcount
          path: experiments/EXP-GFPN-05ff43/amendments/v2_addendum_attcount.yaml
          locations:
            - lines: 440-445
              context: RI-5 (a) ("in every protocol version of the lineage it FAILs by the frozen item v2_check_run.py 68-70 before any dependant reads it")
      prior_value: In every protocol version the mixture FAILs before any dependant reads it.
      corrected_value: >-
        Every protocol version FAILs it by the frozen item 68-70. Under r4, RL-4
        admits a reading package only on the checker's exit 0, so no r4
        dependant reads it; under v2 and r3, R-8 admitted on manifest existence
        (RLF-5; r3_run_wrapper.py 199-203), so a dependant could read it there
        (OB-4, 482; BJ-3 308-313). The in-package conditional
        measured_in_this_package reads the package's own cell, and that
        package FAILs as a whole.
      consequence: >-
        None on the r4 ruling: the four conditions of DEC-20260924-61b22c
        R-OB-B_referent_narrowing are met for r4, the protocol under decision
        (DEC-20260924-babd04 RFR-2). launchkind RJ-7 (b) restates the clause.
      evidence: review-report.yaml 299-318, 482.
    - item: 6
      what: the expected outcome of RI-3 (25) and the stand-in level of RI-3 (24) and (26)
      records:
        - id: AMD-EXP-GFPN-05ff43-20260924-attcount
          path: experiments/EXP-GFPN-05ff43/amendments/v2_addendum_attcount.yaml
          locations:
            - lines: 379-394
              context: RI-3 (24)-(26) ("built on development packages with a stand-in solve returning the SSF signature"; (25) "yield no gap and PASS on LR-1, LR-2, LR-3 and LR-5")
      prior_value: >-
        Evaluated with RI-1 (a) and (d) disabled, the in-place-altered objects
        yield no gap and PASS; a stand-in solve produces the development
        packages of (24) and (26).
      corrected_value: >-
        The carried V-7 item (r3_check_run.py 153-158; hash recorded at
        r3_run_wrapper.py 395) FAILs every in-place alteration of
        solver-events.json made after the wrapper recorded its hash, so (25)'s
        PASS is unattainable unless the evaluator is read without V-7 (FC-1,
        450-455); the discriminant is at the gap level (BJ-4 331, 338-340).
        A stand-in that replaced solve itself would bypass the SE-3 wrapper and
        write no RB-1 record, so (26)'s positive control would show COUNT GAPs
        (FC-6, 471-473); the stand-in must sit beneath the wrapper.
      consequence: A development STOP by construction, never a result. launchkind RJ-5 (a) and (b) repair both.
      evidence: review-report.yaml 322-341, 449-455, 471-473.

  nothing_else_changes: >-
