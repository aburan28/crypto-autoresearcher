# =============================================================================
# CORR-20260924-c248d6 -- CORRECTS SIX STATEMENTS, EDITS NO FILE:
# the DRAFT AMD-EXP-GFPN-05ff43-20260924-attcount states (1) that the callgrind
# launch needs no count of its own and that RI-1 covers a lost middle and last
# record "with records the layer already writes"; (2) that under RH-1 with
# RI-1 a file of a lost launch record is a gap unless every count was lost
# with it, as if that detected every lost launch; (3) that RGL-9's undetected
# class is every consistent loss and every later alteration of
# solver-events.json; (4) that RI-4's list and its "as a path prefix" cover
# the development path values; (5) that a cap-mismatch mixture FAILs "before
# any dependant reads it" in every protocol version; (6) that RI-3 (25)
# expects PASS on objects altered in place, with no stated stand-in level.
# The independent red-team review TASK-20260924-be2daf (archived by
# TASK-20260924-682890, commit e01f4d270) shows each is too strong, inexact or
# incomplete. Ruled in DEC-20260924-babd04. WRITE-ONCE. Archived by
# TASK-20260924-a571c7.
# =============================================================================
