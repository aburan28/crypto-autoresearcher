  reason: >-
    Merging origin/main into PR #144 produced content/add-add conflicts on
    .gitignore, BATCH-028/031/032 dispatch_queue.json, BATCH-031/032
    INPUT-CAPSULE.md and SCOPE-DECISION.md, and ledger/goals/GOAL-ECDLP-001.yaml.
    Main already used those batch directory numbers for unrelated lanes
    (BATCH-028 = EXP-IT-001; BATCH-031/032 = isogeny-transfer / other work;
    documented in CORR-20260803-77d5da). Overwriting main's queues would destroy
    committed IT-001 history. Remapping PR batch directories would break
    completed archive path bindings (AGENTS.md rule 15). Resolution: keep main
    for canonical shared filenames; preserve PR shared files under alternate
    names; keep PR-unique TASK-* paths in place so archive path_sha256 keys
    remain content-verifiable; keep main goal binding fields; record PR status
    notes and proposed next_action as additive amendments.
  determination: >-
    Official SMTH execute path on main remains BATCH-4e8538 / EXP-SMTH-71b1b0
    (CORR-20260803-ff53c0 supersedes EXP-SMTH-4403c4). PR evidence
