correction:
  id: CORR-20260802-757677
  recorded_at: 2026-08-02
  record_type: run
  record_id: EXP-SMTH-4403c4
  field: approval status and evidence_eligible self-declaration
  prior_value: >-
    experiments/EXP-SMTH-4403c4/specification.yaml carries approved_by: null and
    status: frozen_pending_approval at lines 26-17, AND evidence_eligible: true at
    line 28. It was executed by TASK-20260802-6a39f8 on the authority of the
    dispatch card alone.
  corrected_value: >-
    THE RUN IS ADMISSIBLE AS AN INSTRUMENT AND PROVENANCE RECORD ONLY, NOT AS A
    PRE-REGISTERED DECISION READING. The contract's own evidence_eligible: true is
    superseded by this correction and does not stand: a frozen artifact cannot
    confer eligibility on itself while its approval field is null. EV-DS-84d006
    records the measurement at strength weak and direction inconclusive
    accordingly.
  reason: >-
    THE DEFECT IS THE COORDINATOR'S. The BATCH-028 dispatch queue placed a
    contract-freeze task and an execution task adjacent with NO APPROVAL TASK
    BETWEEN THEM, and the execution card's completion gate did not require a
    non-null approved_by. The executor ran on the authority that queue gave it and
    then flagged the gap itself, correctly stating it could not cure it.
    TWO REVIEWERS INDEPENDENTLY FOUND A SECOND BYPASS INSIDE THE FROZEN FILE:
    evidence_eligible: true sitting beside approved_by: null. That is worse than
    the missing approval task, because it means the artifact answers the
    eligibility question internally and no external determination document can
    repair it. The Coordinator's own APPROVAL-DETERMINATION.md, written after the
    results were known, explicitly discounted itself and referred the question to
    the reviewers; the validator gave it zero weight, which was right.
    WHAT WAS NOT DAMAGED. The integrity property approval protects -- the contract
    fixed before any datum -- is intact and was verified four ways by the
    validator, two of them on filesystem evidence the producer did not author. The
    numbers are sound and were reproduced bit-exactly. What is missing is the
    prospective judgement, and eight design defects the reviewers found are the
    demonstration that the judgement function was not vestigial.
    THE CONTRACT IS NOT EDITED. It is frozen; approved_by is not backdated and
    evidence_eligible is not flipped. Both would be falsifications of the record.
  binding_on_future_batches: >-
    (1) Every batch that freezes a contract carries an explicit Coordinator
    APPROVAL TASK between the freeze and the execution. (2) The execution card's
    completion gate requires a non-null approved_by. (3) THE EXECUTOR'S HALT
    CONDITION MUST INCLUDE approved_by IS NULL -- the red team's formulation, which
    I adopt verbatim: a gate only the failing party can arm is not a gate.
    (4) No contract may carry an evidence_eligible field at all; eligibility is a
    reviewer and Coordinator determination made outside the artifact, never a
    self-declaration inside it.
  evidence_artifacts:
    - experiments/EXP-SMTH-4403c4/specification.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/authorizations/APPROVAL-DETERMINATION.md
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/tasks/TASK-20260802-0a1d4d/validation_report.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/tasks/TASK-20260802-411037/red_team_report.yaml
  supersedes: null
