correction:
  id: CORR-20260915-b7ca0c
  recorded_at: '2026-09-15'
  recorded_by: coordinator
  goal_id: GOAL-SEMBIN-fcb7a2
  batch_id: null
  produced_by: top-level coordinator session, cursor/semaev-2015-audit-program-5b8b
  archived_by: TASK-20260915-c1d9f4
  corrects:
    - ledger/goals/GOAL-SEMBIN-fcb7a2/goal.yaml (uncommitted 2026-09-13 draft)
    - DEC-20260913-8d19e5 (item (d), claimable outcomes; superseded, NOT edited)
  nature: >-
    TWO DEFECTS, ONE STRUCTURAL AND ONE MATHEMATICAL, BOTH FOUND WITHOUT COMPUTE.

    DEFECT 1 -- A GOAL THAT THE PROGRAM CITED AND THE LEDGER DID NOT CONTAIN.
    GOAL-SEMBIN-fcb7a2's head record was authored on 2026-09-13 and never committed. It
    sat untracked in one worktree for two days while FOUR COMMITTED RECORDS ON
    origin/main cited the goal as their `goal_id` -- DEC-20260913-8d19e5,
    DEC-20260913-c224bb, DEC-20260913-92aa48 and the handoff TASK-20260913-335d65 -- and
    while the committed bus message MSG-20260913-67d64f announced the campaign by name
    to every lane, listing EXP-SEMBIN-4fa22c and H-SEMBIN-a7e721 in its refs. Neither of
    those records existed either. So the program's committed state referred to a goal
    that no branch defined, and to an experiment and a hypothesis that had never been
    written.

    The draft was also not merely incomplete, it was WRONG IN A DIRECTION THAT MATTERS.
    Its `next_action` read "BATCH-efea59 is open with two producer lanes" and described
    TASK-20260913-60a066 as "DISPATCHED ... approved by DEC-20260913-4f44a7, contract
    frozen at experiments/EXP-SEMBIN-4fa22c/specification.yaml, run RUN-SEMBIN-8eda8e".
    None of BATCH-efea59's dispatch queue, DEC-20260913-4f44a7, DEC-20260913-2f07ee, the
    frozen contract, or the run exists. Committing it unchanged would have entered into
    the ledger an approval that was never obtained and an executor run that was never
    dispatched: a fabrication under AGENTS.md core rule 9, and precisely the failure its
    inter-agent messaging section names when it says a peer saying "approved" is not an
    approval.

    DEFECT 2 -- TWO RECORDS ASSERTED OPPOSITE EVIDENTIAL DIRECTIONS FOR THE SAME
    INSTRUMENT, AND THE SOURCE IS WHY. The draft head stated that a fake-first-fall-degree
    measurement "makes a d'_F measurement able to CONFIRM a first-fall bound and unable
    to REFUTE one". The committed DEC-20260913-8d19e5, item (d), stated the reverse: "a
    measured d'_F > 4 REFUTES 2015/984's Proposition 5 regardless of Lemma 4 ... The
    instrument is therefore a one-directional refuter". These cannot both be read as
    unconditional, and the disagreement is load-bearing: it decides whether the
    campaign's central measurement can refute a published proposition, and therefore
    whether core rule 12's review-breakthrough tier applies to its result.
  how_the_error_was_made: >-
    DEFECT 1: the design session that authored the goal head was terminated before it
    wrote the batch queue, the hypothesis, the contract, or the opening decision, and it
    had already written the head in the tense of work it INTENDED to complete. This is
    the third session lost to a host timeout in this program's Semaev/ICPERF work and
    the second whose partial output had to be repaired by the top-level session. The
    forward guidance below is about the record-authoring habit rather than the timeout,
    because the timeout is not preventable from inside the record.

    DEFECT 2: both records reasoned correctly from an unstated premise, and the premises
    differed. Neither said which quantity it believed Proposition 5 bounds, so neither
    author could see that they disagreed about anything.
  how_it_was_found: >-
    While the ICPERF executor held the machine for a timing measurement, the top-level
    Coordinator looked for zero-compute work and found `ledger/goals/GOAL-SEMBIN-fcb7a2/`
    untracked in `git status`. Checking each identifier the head named with
    `tools/allocate_id.py --check` showed the hypothesis, contract and both decisions
    free -- i.e. never allocated -- while BATCH-efea59 was taken, which located the
    committed work and separated it from the fictional queue. Defect 2 surfaced on
    reading the two records' direction claims side by side and was then settled against
    the frozen bytes rather than by preferring a record.
  corrected_values:
    resolution_of_defect_2: >-
      NEITHER RECORD IS SIMPLY WRONG. THE SOURCE DOES NOT SAY WHICH QUANTITY
      PROPOSITION 5 BOUNDS, and each record is correct under one reading:

      (a) Definition 5 (inputs/NAGAO-2015-984/paper_fulltext.md line 398) defines the
      TRUE first fall degree d_F of {f_1..f_M}. Definition 6 (line 430) defines the FAKE
      d'_F of {f_1..f_M} + S_fe, differing in that every degree is taken mod S_fe and
      that condition 3 requires the combination to be non-zero MOD S_fe, which is
      strictly harder to satisfy -- which is why the fake degree is the larger of the
      two. Lemma 4 (line 510) states d_F <= d'_F and is printed WITHOUT PROOF;
      DEC-20260913-8d19e5 established from the frozen 2013/549 bytes that this
      inequality appears there in NEITHER direction.

      (b) Proposition 5 (line 719) is printed as "First fall degree of EQS4(m,R) is
      bounded by 4 (p = 2)", unqualified. By the paper's own Definition 5 that is d_F.
      Under this reading a measured d'_F <= 4 CONFIRMS the bound, because d_F <= d'_F <=
      4; and a measured d'_F > 4 refutes NOTHING, because exceeding an upper bound on
      d_F is not a statement about d_F. The draft head's direction.

      (c) Proposition 5's ONLY justification is footnote 6 (line 844): "The situation is
      the same as the Semaev's case. So, we omit the proof." The passage that footnote
      defers to (lines 449-452) describes Semaev's argument as yielding "the relation
      that its Fake first fall degree d'_F <= 4". Under the reading its own proof
      supports, Proposition 5 is a statement about d'_F, and a measured d'_F > 4 refutes
      it directly. DEC-20260913-8d19e5's direction.

      (d) A further wrinkle recorded rather than resolved: Definition 8 (line 709) puts
      S_fe INSIDE EQS4, so Proposition 5's subject is the true first fall degree of a
      generating set that already contains the field equations. Adding generators cannot
      raise a first fall degree, so d_F(EQS4) <= d_F(descent part) <= d'_F, and reading
      (b) survives this wrinkle. It is noted because it is the step at which a careless
      reader concludes that Definitions 5 and 6 must coincide on EQS4. They do not: the
      definitions differ in how degrees and non-vanishing are computed, not only in
      which generators are present.
    rule_adopted_instead_of_a_choice: >-
      GOAL-SEMBIN-fcb7a2 objective (2) now requires every reported d'_F to carry BOTH
      consequences side by side and forbids reporting one alone. This is sound under
      either reading, costs nothing, and is strictly more informative than a choice: a
      measured d'_F > 4 is then recorded as refuting the fake-degree reading of
      Proposition 5 AND as not bearing on the printed reading, and that pair is the
      result. The goal's completion criterion 1 was amended to fail any report that
      silently picks a reading, however the number came out.
    goal_head_state: >-
      current_batch_id, dispatch_queue_path and open_batches are null or empty;
      active_hypothesis_ids is empty with H-SEMBIN-a7e721 and EXP-SEMBIN-4fa22c recorded
      as RESERVED identifiers so the committed bus announcement resolves when they are
      written; the two impediments' `recorded_under` now names the real opening decision
      DEC-20260915-94855e; and criterion 4 is marked MET on DEC-20260913-8d19e5.
    committed_work_is_not_orphaned: >-
      TASK-20260913-0188bf's Nagao read report and TASK-20260913-74b33c's sizing and
      budget artifacts sit under coordination/goals/GOAL-SEMBIN-fcb7a2/batches/BATCH-efea59/
      but are declared, owned and archived by the PARENT goal's queue at
      coordination/goals/GOAL-SEMBIN-5078bc/batches/BATCH-9d649f/dispatch_queue.json
      (snapshot 37a455f07, ledger a88b4dfd0). The directory is a working location named
      for this campaign under a parent-goal batch; it is not a batch of this goal, and
      the corrected head does not claim it as one. This is also why BATCH-efea59 is
      refused as taken and why the campaign's first real batch takes a new identifier.
  why_the_receipts_are_not_edited: >-
    DEC-20260913-8d19e5 is committed on origin/main and immutable. Its item (d) is
    SUPERSEDED by the both-consequences rule, not rewritten, and its reading survives as
    one of the two the goal now requires to be reported -- so nothing of its content is
    discarded. The draft goal head was never committed and so has no immutable version;
    what is recorded here is what it said, so that the difference between it and the
    committed head is auditable rather than invisible. MSG-20260913-67d64f is likewise
    immutable and its announcement is honoured by reserving the two identifiers it named
    instead of minting fresh ones.
  consequence: >-
    No measurement, evidence record, or claim changes, because this campaign has taken no
    measurement: it had no committed goal, hypothesis, contract, or run. What changes is
    that the goal now exists and says what is true about itself, and that the instrument
    the campaign is about to build has a reporting rule that cannot be quietly read in the
    favourable direction. Defect 2 would have been invisible in run artifacts: a d'_F
    table is the same table under both readings, and only the sentence drawn from it
    differs.
  forward_guidance:
    - >-
      WRITE A GOAL HEAD IN THE TENSE OF WHAT EXISTS. A head whose next_action says
      "DISPATCHED" before the queue is written is indistinguishable, to the next reader,
      from one where the dispatch happened. If a design session intends to open a batch,
      the head says the batch is not open until the queue is committed.
    - >-
      A GOAL RECORD IS THE FIRST THING COMMITTED UNDER A CAMPAIGN, NOT THE LAST. Four
      records reached origin/main citing a goal_id that no branch defined. Any session
      about to cite a goal should check that
      `ledger/goals/<GOAL>/goal.yaml` or `ledger/goals/<GOAL>.yaml` exists on the base
      it is merging into, which is one `git cat-file -e origin/main:<path>`.
    - >-
      NAME THE QUANTITY, NOT THE PHRASE. "The first fall degree" is four quantities in
      this literature -- Nagao's d_F, his d'_F, Semaev's d_F4, and this program's
      Macaulay-rank statistic -- and IDEA-20260913-449d2b exists precisely because they
      are conflated. Two records here reasoned validly to opposite conclusions purely by
      leaving the quantity implicit. A record that states a bound states which quantity
      it bounds and, when the source is ambiguous, says that the source is ambiguous.
    - >-
      WHEN TWO OF THIS PROGRAM'S RECORDS DISAGREE, READ THE SOURCE BEFORE PREFERRING
      EITHER. The apparent contradiction here was not an error by either author; it was a
      gap in the paper that both had silently filled in different ways. Deciding it by
      seniority of record would have produced a confident and possibly backwards success
      criterion.
  what_this_correction_does_not_assert:
    - >-
      NOT that Proposition 5 is true or false, and not that its omitted proof is
      recoverable. It asserts only that the paper does not fix which quantity the
      proposition bounds, and that the campaign must therefore report both consequences.
    - >-
      NOT that Lemma 4 is false. Lemma 4 is unproved in 2015/984 and absent from
      2013/549; unproved is not refuted, and no work here bears on its truth.
    - >-
      NOT a measurement of any first fall degree, true or fake, at any parameter. This
      correction is a reading of frozen bytes and a repair of record state. It ran no
      solver and no rank computation.
    - >-
      NOT an independent review. One reader settled a question two records had answered
      differently, and one reader is how the disagreement arose. The corrected goal head
      ranks an independent check of exactly this reading FIRST, before any contract
      freezes a success criterion on it, and flags that if the fake-degree reading is the
      right one then a d'_F > 4 result contradicts a published proposition and falls under
      core rule 12's review-breakthrough tier at max.
    - >-
      NOT an approval of EXP-SEMBIN-4fa22c, which does not exist. The identifier is
      reserved, not approved.
