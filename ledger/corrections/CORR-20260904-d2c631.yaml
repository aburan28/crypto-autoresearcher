  finding_1_the_ordered_base_theorem_is_already_published: >-
    The Red Team, independently reading the primary literature (which
    neither the drafting idea-generator nor this Coordinator had searched
    -- both honestly disclosed `novelty_status: unverified` for exactly
    this reason), found arXiv:1403.0126 Theorem 1 states "f_m is absolutely
    irreducible and symmetric of degree 2^{m-2} in each variable"
    (attributed to Semaev), corroborated by eprint.iacr.org/2017/609.
    Absolute irreducibility over the ordered base gives HEUR-KUM-2 in two
    lines via Gauss's lemma. THE UNDERLYING THEOREM IS NOT A NEW RESULT.
    This program's genuine contribution is (a) noticing and citing the
    connection within this program's own ledger structure (H-MONO-45183a's
    own weakest-link disclosure had stood unresolved despite the answer
    being published), and (b) the structural observation that Part A's
    equality question and Part B's E[2]-collision criterion are the same
    computation read at two loci (an observation about THIS program's own
    records, independent of the base theorem's own prior publication).

  finding_2_the_symmetric_base_extension_d3_is_wrong_at_its_own_baseline: >-
    Independently confirmed by the Red Team via explicit computation: (D3)
    claims the symmetric-base monodromy is V semidirect S_{m-1}, order
    2^{m-2}(m-1)!, at every m -- giving order 4 acting on 2 roots at m=3.
    THE TRUE VALUE AT m=3 IS S_2, ORDER 2, not 4 -- independently verified
    by factoring disc_T S_3 = 16 f(x_1) f(x_2) in k(e_1,e_2) (squarefree,
    hence a non-square, hence S_3 is irreducible over the symmetric base
    with group exactly S_2), matching this lane's own already-established
    OBS-2. (D3)'s own root cause: it requires K_ord subset-or-equal N (the
    symmetric-base splitting field surjects onto S_{m-1}) -- an assumption
    NEVER STATED OR PROVED in the original record, and PROVEN FALSE AT
    m=3 (f(x_1)f(x_2)*(e_1^2-4e_2) is not a square in k(e_1,e_2), so
    N intersect K_ord = K_sym, the opposite of what (D3) needs). THIS IS A
    PROVES-TOO-MUCH FAILURE IN THE RECORD'S OWN DESIGNATED BASELINE SLOT:
    m=3 is H-MONO-93bc4d's own stated reproduction check, and (D3) fails it
    outright -- a defect the original record did not catch because it
    asserted consistency without actually computing the m=3 corollary
    against the independently-known truth.
  finding_2_disposition: >-
    (D3)'s claimed order-2^{m-2}(m-1)!, empty-exceptional-locus conclusion
    for the SYMMETRIC base is NOT adopted at any m and is actively shown
    WRONG at m=3, its own baseline case. (D1) and (D2) (the ORDERED-base
    reduction) are untouched by this finding and their own m=3
    reproduction (giving S_2) is independently confirmed correct by both
    reviewers. The symmetric-base question at m=4 (whether the monodromy
    is the full AGL(2,2)=S_4 IDEA-20260904-ad63fe's own separate,
    still-`proposed` record claims) remains genuinely OPEN, not settled by
    H-MONO-93bc4d in any direction.

  finding_3_the_disclosed_m5_collision_was_mislabeled: >-
    Both reviewers, working fully independently via disjoint methods
    (the Validator via direct point-arithmetic re-verification; the Red
    Team via the same, arriving at an identical correction), found that
    H-MONO-93bc4d's and RUN-MONO-917e3a-1/raw-result.json's own disclosed
    collision note is WRONG about which sign classes collided. The note
    states "(1,1,1,1) and (1,1,-1,-1) both mapped to x=3", but the root
    table in the SAME raw-result.json records (1,1,-1,-1) -> 21, not 3. The
    ACTUAL colliding pair is (1,1,1,1) and (1,-1,-1,-1), caused by
    P_2 + P_3 + P_4 = O -- exactly the POINT-AT-INFINITY BRANCH of E[2]
    that the original mechanism's own Step 3 text silently dropped when it
    wrote "Q_S in E[2], hence y(Q_S)=0" (E[2] = {O} union {three finite
    2-torsion points}, and y(O) is undefined, not zero -- the O branch was
    never addressed). The record's own single disclosed negative datum was
    therefore EVIDENCE FOR the exact defect in its own original derivation,
    and the mislabeling concealed this connection rather than revealing
    it. Both reviewers independently identified the identical correct
    pair and the identical root cause -- a strong convergent confirmation.

  reason: >-
    AGENTS.md rule 4 (corrections supersede, never overwrite) and rule 6
    require this filed as a correction: a novelty claim is downgraded by
    published prior art, a specific mathematical sub-claim is shown wrong
    at its own stated baseline, and an archived run's own disclosed
    anomaly note misidentified its own data. All three were found via
    exactly the independent review architecture this program requires
    before any such claim is cited, working as intended: two disjoint
    reviewers, on the same day, converged on corrections to different
    aspects of the same record via unrelated methods.

