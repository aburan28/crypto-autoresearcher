correction:
  id: CORR-20260731-463
  recorded_at: '2026-07-31'
  record_type: dispatch_queue
  record_id: GOAL-ECDLP-001/BATCH-020/TASK-20260731-045
  field: declared_artifact_and_commit_set_missing_the_instrument_that_produced_the_run
  prior_value:
    task_20260731_044_artifact_paths_count: 11
    task_20260731_045_declared_commit_set_count: 12
    omitted_path: experiments/EXP-DS-001/implementation/ds001_driver.py
  corrected_value:
    task_20260731_044_artifact_paths_count: 12
    task_20260731_045_declared_commit_set_count: 13
    added_path: experiments/EXP-DS-001/implementation/ds001_driver.py
  reason: >-
    THE QUEUE AUTHORIZED WRITING THE INSTRUMENT BUT NEVER DECLARED IT AS AN
    ARTIFACT, AND THE TWO MUST AGREE. TASK-20260731-044's write_scope already
    contains `experiments/EXP-DS-001/implementation`, so modifying the driver was
    within the executor's authority. But TASK-20260731-045's declared commit set
    named only the eleven run/result deliverables plus its own receipt. Since
    tools/research_dispatch.py requires an archive commit to change EXACTLY the
    declared set, the batch as drafted admitted no legal outcome once the driver
    changed: staging it fails as an `extra` path, and omitting it commits run
    artifacts WITHOUT THE CODE THAT PRODUCED THEM, which breaks the manifest's
    code binding and the reproducibility rule in docs/claims-and-verification.md.
    Declaring the instrument is the only resolution that keeps the artifacts and
    their generating code in one immutable snapshot, which is also the only way
    the independent reviewers of TASK-20260731-046 / -047 can read the code that
    produced the numbers they are reviewing.
  what_actually_changed_in_the_instrument: >-
    787 insertions and 2 deletions, ADDITIVE. A new `--mode ctrl-unplanted` and
    eight NEW functions (random_uniform_target, harvest_real_unplanted,
    harvest_null_arm, execute_ctrl_cell, compute_live_plant_companion,
    inference_block_ctrl_unplanted, write_ctrl_run_artifacts,
    mode_ctrl_unplanted). The orchestrator verified with `git diff -U0` that NO
    pre-existing function body was modified: the two deleted lines are both CLI
    wiring inside main() - the --mode choices list gaining "ctrl-unplanted", and
    `if args.mode != "finalize"` rewritten as `if args.mode not in ("finalize",)`,
    which is semantically identical. BACKEND_ID and the cost/search/null
    primitives are reused unchanged.
  why_the_executor_wrote_new_code_at_all: >-
    Reported by the executing session and NOT independently confirmed: none of
    the driver's existing modes could produce unplanted targets, because
    harvest_real() always calls random_target(), which plants a known m-sum; and
    mode_impl unconditionally ORs in a hardcoded synthetic known-answer detection
    path that CTRL-RT025-UNPLANTED.yaml forbids for this control. THAT DIAGNOSIS
    IS THE PRODUCER'S OWN AND IS EXACTLY WHAT INDEPENDENT REVIEW MUST CHECK.
  disclosure_the_coordinator_must_not_lose: >-
    THIS AMENDMENT ACCOMMODATES A CHANGE MADE BY THE ORCHESTRATOR'S OWN
    SUBAGENT, AND IT IS RECORDED AS SUCH RATHER THAN PRESENTED AS ROUTINE
    HOUSEKEEPING. The instrument that produced every number in this run was
    written by the same session that ran it, in the same task, and has had NO
    independent review. Producer-authored measurement code is the single
    highest-risk item in this batch and is flagged here as the first thing
    TASK-20260731-046 (Validator) and TASK-20260731-047 (Red Team) should attack.
  what_this_correction_does_NOT_do:
    - IT AUTHORIZES NO RUN AND RE-RUNS NOTHING. The run already executed under TASK-20260731-044.
    - >-
      IT MAKES NO STATEMENT THAT THE NEW CODE IS CORRECT. It declares the path so
      the code can be committed and reviewed; declaring an artifact is not
      validating it.
    - IT MOVES NO HYPOTHESIS STATUS, NO CLAIM TIER AND NO GOAL STATUS, AND MEETS NO COMPLETION CRITERION.
    - IT DOES NOT EDIT specification.v2.yaml, any amendments/ file, or any control YAML.
  evidence_artifacts:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-020/dispatch_queue.json
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-020/QUEUE-AMEND-20260731-005.md
    - experiments/EXP-DS-001/implementation/ds001_driver.py
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-020/tasks/TASK-20260731-044/execution_report.yaml
