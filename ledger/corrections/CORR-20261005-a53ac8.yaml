  prior_value:
    D-5_dispositions_sentence_lines_121_124: >-
      "Dispositions: if the transport holds, the swapped route is dead at m=3
      and only m >= 4 remains open for it; if it does not hold, the swapped
      statistic is the live relation-rate instrument and is the thing a future
      batch should measure."
    N-2_directive_lines_302_307: >-
      "If YES, the swapped statistic collapses at m=3 exactly as the original
      did and only m >= 4 remains for that route - report the collapse as the
      result. If NO, the swapped statistic - the count of FB-rational points on
      the fibre of the projection to the T-line at fixed T = x(R) - is the live
      relation-rate instrument and is what a future batch should specify and
      measure."
    quoting_note: >-
      Verbatim, with the YAML line folding of the source collapsed to single
      spaces. Nothing outside these two passages is quoted as superseded.
  corrected_value:
    S1: >-
      The D-5 transport identity, disc_{x2} S_3(x1,x2,T0) = 16 f(x1) f(T0),
      holds identically. Basis: it follows from EV-MONO-a0a89c OBS-1
      (disc_T S_3(x1,x2,T) = 16 f(x1) f(x2)) by relabelling under the symmetry
      of S_3, which D-5 itself names. It is corroborated by the reviewer's
      committed symbolic check in computations.json (sha256
      0959f0ac878fe904b5d2806e68fcbc433559c0173833f8cf60af0630a9e0dac0) at
      outputs."ptm_out.json".content.D5_transport (file lines 10213-10217),
      produced by the embedded script ptm.py (sha256 as recorded at
      scripts."ptm.py".sha256, file line 90:
      a612a804b3c779fe6931f6c7b39f64caf94316e7ee29ede59d9d9e05bba103d6), and by
      review_report.md J2 O-1 (lines 499-500) and its metric_recomputations
      entry (line 821).
    S1_check_result_verbatim: |-
      "D5_transport": {
       "OBS-1: disc_T S3(x1,x2,T) - 16 f(x1) f(x2)": "0",
       "D-5 transport: disc_{x2} S3(x1,x2,T0) - 16 f(x1) f(T0)": "0",
       "reason": "S3 is symmetric in all three variables, so S3(x1,X,T0) = S3(x1,T0,X) and the identity transports by relabelling."
      }
    S1_location_note: >-
      The card writes the key as outputs."ptm_out.json".D5_transport. In the
      committed file the output's content sits under a `content` key beside
      `sha256_of_raw_file`, so the full path is
      outputs."ptm_out.json".content.D5_transport. The same holds for object2.
    S2: >-
      What the identity governs is a swapped Frobenius or cycle-type
      statistic, and on the factor-base locus that statistic is trivial for the
      same reason as D-1. That is all the identity shows. Cited, not
      recomputed: review_report.md proves-too-much object 2 (lines 433-441)
      and J2 O-1 (lines 505-506).
    S3: >-
      The D-4 statistic, the count of factor-base-rational points on the fibre
      of the projection to the T-line at fixed T = x(R), is NOT condemned, at
      m=3 or at any m. The withdrawal rests on the logical gap the reviewer
      names (review_report.md proves-too-much object 2, lines 442-444 and 456;
      J2 O-1, lines 501-502 and 505-506): "every root lies in F_p" does not imply
      membership in the factor base, and that membership is what the count
      measures. It does NOT rest on any N(R) value.
    S3_values_note: >-
      CC-4. No value is quoted here. The reviewer's N(R) figures are at
      review_report.md lines 446-452 and 503-504, and their raw form at
      computations.json outputs."ptm_out.json".content.object2 (from file line
      10218; sub-keys C3_m3, C2_m3, C2_m4). They are single-reviewer,
      toy-scale and not re-derived (CU-9 is open). This withdrawal does not
      depend on them, and this record makes no statement about what they show.
    consequences_CC3:
      - >-
        Neither branch of either superseded clause is carried forward.
      - >-
        The YES branch of D-5 and of N-2 is withdrawn as a non-sequitur for
        the count: the identity holding does not make the D-4 count dead,
        collapsed or degenerate at m=3, and does not confine the D-4 route to
        m >= 4.
      - >-
        The NO branch is not triggered, because the identity holds. It is NOT
        converted into a claim that the count is "the live relation-rate
        instrument".
      - >-
        The designation of the D-5 check as D-4's cheapest falsification check
        is withdrawn as non-discriminating for the count. Where
        DEC-20260810-2f86db describes the D-5 check as D-4's falsification or
        collapse check (D-5's opening sentence; N-2's title and closing
        sentence; not_closed item 3; limitations item 4, "its m=3 collapse
        check (D-5)"), those texts stand and are not superseded, but that
        description is read under this withdrawal. Their other content is
        unchanged.
      - >-
        D-4 stays exactly what D-4 says: an untested proposal.
      - >-
        Nothing else in DEC-20260810-2f86db is superseded. D-1 to D-4, D-6 to
        D-10, N-1, N-3, N-4, closed_at_scope, not_closed, limitations and
        knowledge_promotion stand.
      - >-
        Designing a check appropriate to the count is NOT scheduled by this
        record.
