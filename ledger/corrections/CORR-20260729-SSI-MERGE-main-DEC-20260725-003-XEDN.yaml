    - >-
      μ₃ is absent on eligible surfaces, so the bound is not an artifact of the
      isotrivial j=0 automorphism that saturated EXP-XEDN-003. This licenses a
      scoped transfer of the coefficient-bound reading of DEC-20260724-009 past
      that window for this degree class.
    - >-
      Red team narrowing is accepted: not B2 closure; search-bound and thin
      p=31 cell must be stated; Gram coefficients stay diagnostic
      (VAL-XEDN-004-01).
    - >-
      GOAL-XEDN-001 completion criterion is met: RQ-XEDN-002 receives a
      committed decision on H-XEDN-003 with independent review and an explicit
      claim boundary.
  knowledge_promotion:
    promote:
      - id: KN-FIND-004
        reason: >-
          Durable finding: non-isotrivial free-x sections in this degree window
          still admit infinity-norm-1 verified MW relations at the tested sizes;
          Gram over-report of coefficients is confirmed without μ₃.
  next_actions: []
