  provenance_of_this_correction: >-
    COORDINATOR RE-DERIVATION, NOT AN INDEPENDENTLY REVIEWED RESULT. Every figure below
    is an exact evaluation of a published formula at stated parameters, computed by
    coordination/goals/GOAL-SEMBIN-5078bc/batches/BATCH-9d649f/coordinator-rederivation-53739b/rederive.py
    with its output retained beside it in rederivation.txt. NOTHING HERE IS MEASURED and
    no degree is measured or asserted. The re-derivation has not been independently
    checked; TASK-20260913-25da8c is queued in the batch dispatch queue for that, and
    until it returns these figures carry the authority of one session's arithmetic and no
    more. The eq. (11) reading below was verified against the frozen primary source
    (inputs/SEMAEV-2015-310/paper_fulltext.md, the P(q,m,t,|V|) derivation at line 396
    onward) rather than recalled.

  correction_1:
    subject: >-
      IDEA-20260913-191ed2's TWO COPIES CHARGE THE YIELD DIFFERENTLY, AND THE CANONICAL
      LEDGER COPY IS THE ONE THAT IS INTERNALLY INCONSISTENT.
    what_the_two_copies_say:
      ledger_proposals_copy: >-
        Charges 1/P ~ m!. Reports stage-1 at (n, m, k) = (571, 12, 48) as
        186.7 / 187.2 / 212.8 / 240.3 bits for d_sat = 4 / 5 / 6 / 7; re-optimised totals
        186.4 / 186.5 / 197.1 at d_sat = 4 / 5 / 6; crossover with 2^{n/2} at
        n = 303 / 307 / 347 / 400; and "re-optimising m under d_s = 6 SHRINKS k from 48
        to 32 at n = 571, i.e. a worse time exponent buys a 16-bit memory saving".
      ideation_draft_copy: >-
        Charges 1/P = m! 2^{n-mk}. Reports stage-1 as 181.7 / 185.5 / 212.8 / 240.3;
        re-optimised totals 175.1 / 176.9 / 192.8; crossover at n = 281 / 295 / 337 / 393;
        and "48 to 28 ... a 20-bit memory saving".
    both_copies_are_internally_consistent: >-
      This is not one copy containing an arithmetic slip. Re-derivation reproduces EVERY
      figure in EACH copy exactly, under that copy's own yield charge. The 48->32 / 16-bit
      line is correct under the m!-only charge and the 48->28 / 20-bit line is correct
      under the eq. (11) charge, so c441f43ea's edit of that one line in the draft was not
      an error introduced -- it completed a migration the rest of that draft had already
      made. A reader who compares the two copies line by line without noticing the yield
      charge will conclude one of them is simply wrong, and neither is.
    which_charge_is_faithful: >-
      Eq. (11) OF THE FROZEN SOURCE. Semaev derives
      P(q, m, t, |V|) = 1 - (1 - 1/q)^K with K ~ |V|^t / t!, and states that when
      |V|^t/(q t!) = o(1) then P ~ |V|^t/(q t!). At |V| = 2^k, q = 2^n and t = m this is
      P = 2^{mk-n}/m!, hence 1/P = m! 2^{n-mk}. The eq. (11) charge is therefore the
      faithful one and the m!-only charge is its asymptotic simplification, exact only
      when mk = n.
    why_the_ledger_copy_is_inconsistent_rather_than_merely_coarser: >-
      Because it makes k an INTEGER. Table 3 uses un-ceiled k = n/m, where mk = n exactly,
      2^{n-mk} = 1, and the two charges coincide -- re-derivation confirms they agree to
      |difference| = 0.00e+00 at n = 283 and n = 571 under un-ceiled k. The ledger copy
      sets k = ceil(n/m), which OVERSHOOTS: mk >= n, so the factor base is larger, the
      2^k term is paid in full, and the yield is correspondingly BETTER by 2^{mk-n}. The
      m!-only charge pays for the ceiling and declines to collect it. The defect is
      therefore in the audit's own integer-k refinement, NOT in Semaev's paper, whose own
      convention has no slack to lose.
    measured_size_of_the_overcharge:
      quantity: >-
        re-optimised total cost under the m!-only charge minus the same under the eq. (11)
        charge, in bits, at d_sat = 4, d_unsat = 4, omega = 3, omega' = 2, k = ceil(n/m)
      value_bits: {mean: 9.11, median: 9.29, min: 1.00, max: 15.00, sd: 2.93}
      scope: every integer n in [100, 1000], optimised over m in [2, n] independently
        under each charge
      read_from: coordinator-rederivation-53739b/rederivation.txt section 5
      mechanism_note: >-
        The overcharge is NOT simply the slack at a fixed m. The faithful charge rewards
        larger m -- more slack means better yield -- so the optimum itself moves, and the
        optimal m differs between the two charges at 863 of the 901 values of n tested.
        At n = 571 the optimum moves from (m, k) = (13, 44) to (15, 39).
      bounds: >-
        The slack mk - n lies in [0, m-1] by construction, so the per-cell overcharge is
        bounded by m-1 bits at fixed m; the measured max of 15.00 is consistent with that
        and is not an extrapolation beyond the tested range.
    consequence_for_the_records_headline_claim: >-
      IDEA-20260913-191ed2's stated point is that "the published threshold is the fragile
      part of the claim". That survives and is SHARPENED, because the threshold is more
      fragile than the record says. Its own headline effect -- one extra degree on the
      satisfiable arm moving the crossover 303 -> 307 -- is 4 in n. The yield-charge
      correction moves the d_sat = 4 crossover from n = 303 to n = 281, which is 22 in n,
      about five times larger. Under the faithful charge the crossovers are
      281 / 295 / 337 / 393 for d_sat = 4 / 5 / 6 / 7. The two charges DISAGREE about
      whether the method beats 2^{n/2} at all for 18 values of n, namely n in [281, 302].
    authoritative_figures: >-
      Under eq. (11) at integer k = ceil(n/m), omega = 3, omega' = 2, d_unsat = 4:
      stage-1 at (571, 12, 48) is 181.7 / 185.5 / 212.8 / 240.3 bits for
      d_sat = 4 / 5 / 6 / 7; re-optimised totals are 175.1 / 176.9 / 192.8 at
      d_sat = 4 / 5 / 6, attained at (m, k) = (15, 39) / (15, 39) / (21, 28); crossovers
      are 281 / 295 / 337 / 393; and the d_s = 6 re-optimisation shrinks k from 48 to 28,
      a 20-bit memory saving. A future record citing this idea's cost table cites these.
    control_the_linearisation: >-
      Eq. (11)'s linearisation is only valid while lambda = |V|^t/(q t!) = o(1), and the
      faithful charge moves the optimum to larger m, so the condition was re-checked at
      the shifted optimum rather than assumed. Using the unlinearised
      P = 1 - (1 - 1/q)^K instead changes the re-optimised total by less than 0.001 bits
      at every n tested, and log2(lambda) is at most -10.47 (n = 163) and reaches -36.25
      (n = 1000). The linearisation is safe over the whole tested range.
    control_omega_prime_invariance: >-
      The disputed k value is invariant in omega'. Under the m!-only charge the d_s = 6
      optimum is (m, k) = (18, 32) at every omega' in {1, 2, 2.376, 3}, and m = 21
      (k = 28) is 6.3 bits worse there (203.36 against 197.08), so the disagreement
      between the two copies is not a near-tie broken by a stage-2 exponent choice.

  correction_2:
    subject: >-
      IDEA-20260913-8138a0's REQUIRED-DEGREE FLOOR COEFFICIENT IS ROUTE-DEPENDENT, AND
      NEITHER COPY'S QUOTED CONSTANT IS THE VALUE AT THE ROUTE THE RECORD NAMES.
    what_the_two_copies_say:
      ledger_proposals_copy: >-
        "at the m = n/log2 n route and omega = 3, d >= (c ln 2)/(2 omega) sqrt(n / ln n)
        = 0.196 sqrt(n / ln n), and 0.248 sqrt(n / ln n) at omega = 2.376"
      ideation_draft_copy: >-
        the same sentence with (c ln 2)/(4 omega) = 0.098 sqrt(n / ln n), and 0.124 at
        omega = 2.376
    the_underlying_formula_is_not_in_dispute: >-
      Both copies state the same inequality, (C5)'s
      d(n, m) >= [c - 1/c'] sqrt(n ln n) / (omega log2(n(m-1))), and re-derivation
      confirms c' = sqrt(2 ln 2) = 1.177410, c = 2/c' = 1.698644 and
      c - 1/c' = 0.849322 = c/2. The disagreement is entirely in what log2(n(m-1)) is
      replaced by when the inequality is collapsed to a single constant, and BOTH
      collapses are limits of the same formula at different routes in m:
        log2(n(m-1)) -> log2(n)     i.e. m = 2 (constant m)  gives 0.19624
        log2(n(m-1)) -> 2 log2(n)   i.e. m ~ n               gives 0.09813
    why_neither_constant_labels_the_named_route: >-
      The record names the route m = n / log2(n). At that route log2(n(m-1))/log2(n)
      tends to 2, so the ASYMPTOTIC coefficient is the draft's 0.098 and the ledger
      copy's 0.196 mislabels an m = 2 constant as the named route's value. But the
      convergence is extremely slow and 0.098 is not the value at any parameter anyone
      will evaluate: the implied coefficient at that route is 0.11910 at n = 571,
      0.11415 at n = 10^4, 0.11003 at n = 10^6, 0.10620 at n = 10^10 and still 0.10280
      at n = 10^20. The honest object is the m-dependence, and quoting any single
      constant without its route is what produced the divergence.
    authoritative_figures: >-
      At n = 571, omega = 3 the floor is d >= 1.8612 at m = 2 (coefficient 0.19624),
      1.3509 at m = 12 (0.14243), 1.1296 at m = 62 = n/log2(n) (0.11910), and 0.9307 at
      m = n = 571 (0.09813). At omega = 2.376 the bracketing routes give d >= 2.3500
      (m = 2, coefficient 0.24777) and d >= 1.1752 (m = n, 0.12390). Cite the floor with
      its m, or cite the interval.
    no_conclusion_changes: >-
      AND THIS IS THE IMPORTANT PART. At n = 571 the floor lies in [0.93, 1.86] over the
      whole range of m, and both endpoints are far below Assumption 1's d_F4 = 4. So
      EXP-SEMBIN-92724f's interpretation_limits statement -- that the floor "evaluates to
      1.86 at n = 571, BELOW Assumption 1's 4, so no contradiction with Assumption 1 at
      FIPS-labelled parameters follows from the floor alone" -- holds under EVERY reading
      of the coefficient, and holds with more margin under the smaller one. The
      divergence changes a quoted constant and no conclusion. The concrete-n force of
      that record still comes from the monotonicity in m, not from the floor, exactly as
      its interpretation_limits already say.
    effect_on_the_run_in_flight: >-
      EXP-SEMBIN-92724f is frozen and approved (DEC-20260913-cb5ee2) and preregisters
      "the required-degree floor coefficient 0.196 at omega = 3 and 0.248 at
      omega = 2.376", with approval_basis recording the Coordinator's re-derivation of
      0.19624 and 0.24777 and the n = 571 floor value 1.861. Those are all the m = 2
      values and are mutually consistent; what the contract omits is the m label. THE
      CONTRACT IS NOT AMENDED -- it is immutable and its required artifact is already
      "the required-degree floor re-derived with its coefficient at each omega", which a
      faithful re-derivation discharges by reporting the m-dependence. The executor was
      sent a pointer to this correction so the route-dependence is reported rather than
      a single constant; a pointer confers no authority and amends nothing.

  correction_3:
    subject: >-
      TWO COMMITTED PROPOSAL RECORDS WERE EDITED IN PLACE INSTEAD OF SUPERSEDED.
    what_happened: >-
      Commit c441f43ea ("Fix stale SEMBIN audit calculations", another session) rewrote
      lines inside ledger/proposals/IDEA-20260913-c94e52.yaml and inside the ideation
      drafts of IDEA-20260913-c94e52 and IDEA-20260913-191ed2. Core rule 4 and CLAIM 2 of
      CLAUDE.md make ledger records immutable: a correction supersedes and never
      overwrites. The pre-edit text of a committed record is now recoverable only from git
      history, which is exactly the property immutability exists to avoid depending on.
    the_edits_were_arithmetically_right: >-
      Stated plainly because it matters for how this is read: the c94e52 edit fixed a
      real internal inconsistency and its replacement figures check out.
      52480/39424 = 1.33117, 1.331^3 = 2.3579 and 91648/52480 = 1.74634, so the pre-edit
      text -- which quoted the proxy as 1.20 while its own ratio was 1.331, and gave the
      band as both [1.0, 1.73] and [1.00, 2.36] in adjacent paragraphs -- was the
      defective version. The objection is to the MECHANISM, not the content: the same fix
      recorded as a correction would have been unobjectionable and auditable.
    remedy: >-
      No file is reverted. Reverting an in-place edit is another in-place edit, and the
      corrected content is better than what it replaced. This record is the supersession:
      a reader of IDEA-20260913-c94e52 reads it beside this, and the pre-edit bytes remain
      in c441f43ea's parent for anyone auditing what changed.

  correction_4:
    subject: >-
      THE DRAFT IS NOT SYSTEMATICALLY SHARPER THAN THE LANDED RECORD, SO EACH DIVERGENCE
      MUST BE ADJUDICATED ON ITS MERITS.
    detail: >-
      Corrections 1 and 2 both resolve in the draft's favour, which invites the rule "when
      the copies disagree, trust the draft". That rule is false. In
      IDEA-20260913-9c54f9 the LANDED copy is the improved one: a citation that reads
      "ref: null, provenance: recalled" in the draft reads "ref: KN-TECH-006, provenance:
      internal" in the landed record, which is a recalled pointer properly resolved under
      the citation-provenance rule. In IDEA-20260913-449d2b the landed copy is a 938-line
      expansion of a 479-line draft. IDEA-20260913-9ba7fc differs only in question_ids and
      goal_ids, and IDEA-20260913-c94e52's two copies are byte-identical.
    the_structural_defect: >-
      Keeping a full second copy of an immutable record in a working directory means the
      record has no single text, and no convention about which copy wins can be right,
      because the drafts and the landed records were each improved in different places
      after they diverged. The successor practice is to land the record and keep the
      ideation directory for the SESSION's own artifacts -- lane notes, screening
      transcripts, rejected candidates -- rather than a duplicate of the record. Not
      retro-fitted here: the existing duplicates are committed and stay, and this record
      says which figures are authoritative for the two pairs where it matters.

  limitations:
    - >-
      A COORDINATOR RE-DERIVATION IS NOT INDEPENDENT REVIEW. Every number above comes from
      one session running one script. TASK-20260913-25da8c is queued for an independent
      check and no figure here should be promoted to knowledge before it returns.
    - >-
      This corrects the COST BOOKKEEPING of two proposals. It asserts nothing about
      whether Semaev's method works, about any solving degree, about Assumption 1 or
      Assumption 2, and about the security of any deployed curve in either direction. No
      degree was measured; no algebra engine is installed on this host
      (IMP-SEMBIN-ENGINE).
    - >-
      The overcharge statistics are scoped to n in [100, 1000], d_sat = d_unsat = 4,
      omega = 3, omega' = 2 and k = ceil(n/m). They are exact evaluations over that grid,
      not an extrapolation, and the mechanism (slack mk - n in [0, m-1]) is stated so a
      later reader can re-scope rather than re-guess.
    - >-
      Correction 2 leaves the (C5) inequality itself unaudited. Whether
      d >= [c - 1/c'] sqrt(n ln n)/(omega log2(n(m-1))) is the right inequality is a
      separate question from which constant it collapses to; this record only settles the
      collapse. The inequality's own derivation is named here as unreviewed.
    - >-
      Both proposals remain `proposed`. Nothing in this record moves a hypothesis, closes
      a lane, or supports a claim, and it is not a decision: a Coordinator decision citing
      it is a separate committed record.

