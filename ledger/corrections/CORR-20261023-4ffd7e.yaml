    RT-20261023-d796bb R1-B1 asks which governs, and this record names it. The
    specification's success and falsification criteria govern the
    experiment-level reading. The success criterion is met on both seeds
    (0.000625 and 0.0), and the falsification criterion (> 0.01 on both seeds)
