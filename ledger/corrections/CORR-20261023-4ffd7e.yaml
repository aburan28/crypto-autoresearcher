      corrected_value:
        statement_as_tested: >-
          For p in {101, 211, 401, 809, 1601, 3203, 6421, 12809}; a random
          nonsingular y^2 = x^3 + a x + b over F_p; and r in {2, 3} points
          drawn by the frozen, hash-pinned sampler harness/czlift.py
          random_point. That sampler draws uniformly from the affine points of
          E(F_p) with y != 0, so 2-torsion points are never drawn, and the r
          points have pairwise distinct x. Each point is lifted to its
          symmetric integer representatives (X, Y) with |X|, |Y| < p/2. The
          lifted curve is the unique zero-freedom rational model through the
          lifts, which reduces mod p to the sampled curve: Y^2 = X^3 + A X + B
          for r = 2, and Y^2 = X^3 + A2 X^2 + A4 X + A6 for r = 3. There is no
          discriminant minimization and no further freedom. Prediction under
          test: the exact search for sum m_i P~_i = O with 0 < max |m_i| <= 6
          finds no relation in any of the 100 trials of any (p, r) cell on
          either seed (seeds 20261009 and 20261010). That means
          dependence_rate_overall = 0 on each seed, with a one-sided 95 percent
          upper bound below 0.002 on each seed. The planted control
          P~_2 = [2] P~_1 is detected as (2, -1) in each of the 24 controls per
          seed. The height clause was tested as the producer's r = 2 cell mean
          naive log-height of a lifted point divided by ln p (validator
          finding F2), predicted to be about 0.7.
        outcome_recorded_against_it: >-
          Seed 20261010 (RUN-CZLIFT-218843): 0 relations in 1600 valid trials,
          one-sided 95 percent upper bound 0.00187. Clause holds on this seed.
          Seed 20261009 (RUN-CZLIFT-c3f8a8): 1 relation in 1600 valid trials,
          one-sided 95 percent upper bound 0.00296. It occurred at p = 101,
          r = 2, trial index 61 (0-based): (a, b) = (90, 49) mod 101, points
          (77, 86) and (48, 86), lifts P~1 = (-24, -15) and P~2 = (48, -15), and
          fitted curve Y^2 = X^3 - 1728 X - 27423. The relation is
          2 P~1 + P~2 = O, recorded as [-2, -1]. The line Y = -15 is tangent
          at P~1 because X^3 - 1728 X - 27648 = (X + 24)^2 (X - 48), and P~1
          has infinite order. So the clauses "no relation in any of 100 trials
          per cell on either seed" and "upper 95 percent bound below 0.002" are
          false on seed 20261009 by an exact counterexample
          (EV-CZLIFT-ee9b23 proof_refs). Pooled over both seeds: 1 in 3200,
          one-sided upper bound 0.00148. Controls: 24 of 24 detected on each
          seed. Height clause: the recorded ratio is 0.632 to 0.810 (seed
          20261009) and 0.655 to 0.831 (seed 20261010), rising with p. It
          follows 1 - (1 + ln 2)/ln p, the value for a uniform symmetric
          residue (0.633 at p = 101 to 0.821 at p = 12809). It is not a
          constant 0.7.
      found_by: >-
        VAL-20261022-b08129 (TASK-20261022-67902e) findings F1, F2 and F4, and
        its accidental_relation_probe; RT-20261023-d796bb (TASK-20261023-62eb31)
        R1-B1, R1-B2 and R1-S1, and rt_sampler_probe.json (0 of 60000 sampler
        draws with y = 0 on three p = 101 curves with full 2-torsion, where
        about 1820 are expected; 0 of 8000 replayed producer points with
        Y = 0).
      effect_on_values: none. Every recorded count, rate and control result stands as recorded.

    - id: S2
      field: title
      prior_value: >-
        Xedni lifts of two or three random points are never dependent within a
        relation bound of 6, while a planted dependence is always detected
      corrected_value: >-
        Symmetric lifts of two or three random y != 0 points under the
        zero-freedom Weierstrass fit, predicted never dependent within a
        relation bound of 6 (one dependence observed in 3200 trials), with a
        planted (2, -1) dependence always detected. This is not xedni proper:
        there is no discriminant minimization, no reverse-Mestre conditions,
        and r <= 3.
      found_by: RT-20261023-d796bb R1-B1, O6 and SC2.

    - id: S3
      field: mechanism
      prior_value: >-
        A dependence among the lifted points is a rational point of small height
        on a curve whose coefficients have height about 2 log p; the
        Jacobson-Koblitz-Silverman-Stein-Teske analysis (KR-IC-cd159a) gives the
        probability of such a configuration as negligible, and the exact bounded
        search measures the count directly where the attack would need it.
      corrected_value: >-
        Jacobson, Koblitz, Silverman, Stein and Teske, "Analysis of the xedni
        calculus attack", Des. Codes Cryptogr. 20 (2000) 41-64 (provenance
        retrieved; read in full by TASK-20261023-62eb31). Its Theorem 4.1
        bounds xedni success by C0/p conditionally on Lang's lower bound for
        the canonical height and on Lemma 4.1's assumption
        log|D| >= C1 max hhat(P_i). The mechanism is an absolute bound C2 on
        relation coefficients followed by pigeonhole. With C0 ~ 1e4 (r = 2)
        and ~ 1e12 (r = 3), the bound is vacuous at every p <= 12809. The same
        paper measures frequent dependence at small discriminants (sections
        5.1 and 5.2). It does not give the probability of dependence as
        negligible at this scale. The bounded search with max |m_i| <= 6 does
        not measure "where the attack would need it". A Q-relation within the
        bound reduces to the same relation mod p. Its rate is therefore at
        most the mod-p bounded-relation rate, which decays like
        (13^r - 1)/(2p). The relations an attacker needs have coefficients of
        order p^(1/r) (JKSST pp. 51-52), above the bound in every r = 2 cell
        with p >= 211 and every r = 3 cell with p >= 3203 (red-team R2,
        rt_modp_null.json). The search therefore measures the regime an
        attacker cannot use, and it cannot certify independence (red-team
        PTM-1: an order-7 torsion pair at p = 6421 passes it).
      found_by: RT-20261023-d796bb R1-B3, R1-S2, R2, PTM-1, HC1 and citations_checked.

