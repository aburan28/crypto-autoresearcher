# =============================================================================
# CORR-20261007-f4d600 -- disclosure of late archival ownership for the P-192
# weighted-CM v1 design and the audit work that preceded its archive binding.
# This is a process correction.  It changes no immutable scientific record.
# =============================================================================
correction:
  id: CORR-20261007-f4d600
  id_provenance: >-
    Supplied for this correction and confirmed free with
    `python3 tools/allocate_id.py --check CORR-20261007-f4d600` on
    2026-10-07 before this file was created.
  recorded_at: '2026-10-07'
  recorded_by: coordinator
  archived_by: TASK-20261007-66d44b

  record_type: claim
  record_type_note: >-
    The correction template has candidate, claim, and run categories but no
    process or custody category.  `claim` is used because this corrects the
    implied archival-compliance claim, not any scientific run or observation.
  record_id: EXP-SCURVE-1a8daf
  corrects:
    - the archival ownership and snapshot ordering of the v1 design work committed at 4b9207ea3751de5b1986e28b627ae4476f4ead4f
    - the archival ownership ordering of the additive v2 amendment, report, and review bundle written before TASK-20261007-66d44b existed
    - the dispatch ordering of the pre-execution audit agents that began before an archived_by owner existed
  field: archival_ownership_and_pre_review_snapshot_order
  supersedes: []

  prior_value: >-
    The standing archive precondition requires exactly one archived_by owner
    to be bound before a producer writes a deliverable and requires a durable
    snapshot before independent audit begins.  A later binding can repair
    custody, but cannot make an earlier dispatch compliant.

  actual_history:
    - >-
      V1 authoring for EXP-SCURVE-1a8daf began before any archived_by owner
      had been assigned to the design bundle.
    - >-
      The v1 design was committed as
      4b9207ea3751de5b1986e28b627ae4476f4ead4f while that ownership gap still
      existed.
    - >-
      The additive v2 amendment, specification, report, diagram, checker, and
      review bundle were drafted before TASK-20261007-66d44b was written.
      Their later assignment to that task is therefore another after-the-fact
      custody remedy, not proof that the ownership precondition held.
    - >-
      The pre-execution audit agents began examining the committed v1 design
      before an archived_by owner was bound.  Their work therefore began in
      violation of the required archive-before-review ordering even though
      they read a real commit.
    - >-
      Those audits identified design defects and no scientific protocol run
      was launched.  That outcome does not waive, excuse, or retroactively
      satisfy the ownership and ordering precondition.

  corrected_value:
    late_owner: TASK-20261007-66d44b
    v1_restoration_and_immutability: >-
      The tracked v1 package has been restored to the exact byte state of
      commit 4b9207ea3751de5b1986e28b627ae4476f4ead4f and remains immutable.
      Neither this correction nor the archive rewrites, amends in place, or
      re-stages those v1 paths.
    additive_protocol_remedy: >-
      The audit findings are addressed prospectively by the additive v2
      amendment and specification for EXP-SCURVE-1a8daf, approved for design
      only by DEC-20261007-0ed467.  V2 supersedes future protocol use without
      altering the historical v1 bytes.
    archival_remedy: >-
      TASK-20261007-66d44b performs a two-commit post-commit snapshot archive:
      its first commit contains exactly the declared v2 bundle, decision,
      correction, and handoff; after that commit exists, a receipt records its
      real SHA, parent, exact changed paths, and per-path hashes and is added in
      a second receipt-only commit.  The receipt also verifies the immutable
      v1 head and precursor bytes.  This establishes custody after the fact;
      it does not erase the original violation.

  violation_disposition:
    violation_occurred: true
    remedied_after_the_fact: true
    retroactively_compliant: false
    outcome_waives_violation: false
    rationale: >-
      A favorable or useful audit outcome, committed v1 bytes, zero runs, and
      an eventual archive do not satisfy a precondition that had to hold
      before authoring and audit dispatch.  The sequence remains disclosed.

  scientific_boundary:
    scientific_runs_performed: 0
    scientific_results: []
    execution_authorized: false
    statement: >-
      This correction and its archive are governance and custody records only.
      They create no relation, map, timing, recovery, benchmark, security
      conclusion, curve-weakness finding, or evidence for or against the
      underlying hypothesis.

  reason: >-
    Preserve the true chronology and repair archival custody without rewriting
    history.  Omitting the late binding would make the v1 commit and audit
    sequence look compliant when it was not; editing v1 would destroy the
    historical evidence.  The additive v2 design plus the post-commit archive
    is the narrow remedy consistent with immutability.

  evidence_artifacts:
    - 4b9207ea3751de5b1986e28b627ae4476f4ead4f
    - experiments/EXP-SCURVE-1a8daf/specification.yaml
    - research/p192-weighted-cm-20261006/REPORT.md
    - experiments/EXP-SCURVE-1a8daf/amendments/protocol-amendment.v2.yaml
    - experiments/EXP-SCURVE-1a8daf/amendments/specification.v2.yaml
    - ledger/decisions/DEC-20261007-0ed467.yaml
    - ledger/handoffs/TASK-20261007-66d44b.yaml
    - coordination/p192-weighted-cm-20261007/archives/TASK-20261007-66d44b/snapshot-receipt.json

  interpretation_limits:
    - This corrects process and custody, not mathematics or experiment status.
    - V1 remains immutable historical design and nondispatchable; v2 remains an approved but unexecuted design.
    - The audit findings motivate the additive amendment but are not converted here into scientific evidence or a result.
    - The post-commit receipt must report observed commit and hash values; this record predicts none of them.
