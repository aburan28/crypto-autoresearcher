      finding: ALL PRESENT AND ALL ON THEIR FORCED VALUES, WITH ONE DECLARED COVERAGE GAP
      detail: >-
        Read from RUN-QSP-33b442-S1/raw-result.json forced_fixtures_C1_C4
        (pass: true) and C6_linearized_cross_check.
        C1 (n=12, n'=6, lambda=X): forced 64, measured (I1, I2, I3) = (64, 64,
