correction:
  id: CORR-20260917-8b80cc
  recorded_at: '2026-09-17'
  recorded_by: coordinator
  goal_id: null
  goal_id_note: >-
    RQ-QSP-f9bbdb is not attached to a goal head (see TASK-20260917-892420
    dispatch precondition DP-4). Recorded as a fact, not an omission.
  question_id: RQ-QSP-f9bbdb
  experiment_id: EXP-QSP-33b442
  produced_by: >-
    coordinator subagent, lifecycle step 8 (validity gate) of EXP-QSP-33b442,
    branch claude/ecc2k-130-quasi-subfield-poly-nhcj1f, session of 2026-09-17.
    THIS SESSION HAD NO SHELL: every verification below was performed by reading
    files and the validator source directly, never by executing a command. Where
    a check required execution it is recorded as NOT PERFORMED and assigned.
  archived_by: null
  archived_by_note: >-
    UNBOUND AT AUTHORING TIME. This record is not durable until a Coordinator
    ledger-archive task owns it by exact path and the post-commit verifier
    accepts the commit (AGENTS.md "Durable research commits"). The dispatching
    session binds this field before archiving. Recorded as null rather than
    filled with an unminted identifier.
  record_type: run
  corrects:
    - experiments/EXP-QSP-33b442/runs/RUN-QSP-33b442-S1/manifest.yaml (field run.result.certificate.kind; to be SUPERSEDED, never edited)
    - experiments/EXP-QSP-33b442/runs/RUN-QSP-33b442-S1B/manifest.yaml (field run.result.certificate.kind; to be SUPERSEDED, never edited)
    - experiments/EXP-QSP-33b442/runs/RUN-QSP-33b442-S2B/manifest.yaml (field run.result.certificate.kind; to be SUPERSEDED, never edited)
    - experiments/EXP-QSP-33b442/runs/RUN-QSP-33b442-S3/manifest.yaml (field run.result.certificate.kind; to be SUPERSEDED, never edited)
    - experiments/EXP-QSP-33b442/runs/RUN-QSP-33b442-S0/ (run package: five companion artifacts absent; see D2-S0 below)
    - experiments/EXP-QSP-33b442/runs/RUN-QSP-33b442-S2/ (run package: stderr.log and raw-result.json absent)
    - experiments/EXP-QSP-33b442/runs/RUN-QSP-33b442-S5/ (run package: five companion artifacts absent)

  found_by: >-
    The dispatching session's run of `python3 tools/validate_ledger.py` at
    commit 8f390d54f, which exits 1 with 75 new errors, fifteen of them
    belonging to EXP-QSP-33b442. The defects were then RE-VERIFIED
    INDEPENDENTLY by this coordinator subagent against the validator source and
    the manifests themselves, rather than taken on report. What was checked and
    what was found is recorded under `independent_verification` below.

  nature: >-
    FIFTEEN LEDGER-SCHEMA ERRORS ON A RUN PACKAGE WHOSE MEASUREMENTS ARE INTACT.

    Two distinct defects, neither of which touches a measured value:

    (D1) An INVENTED CERTIFICATE KIND. Four manifests -- RUN-QSP-33b442-S1,
    -S1B, -S2B and -S3 -- record `run.result.certificate.kind: root_list`.
    `root_list` is not in the certificate vocabulary. The authoritative
    vocabulary is docs/claims-and-verification.md line 33 --
    discrete_log | decomposition | key_recovery | none -- and the enforced set
    is CERTIFICATE_KINDS at tools/validate_ledger.py line 62. These are
    root-COUNT measurement runs: they claim no discrete log, no relation and no
    decomposition, and `kind: none` is documented for exactly that case at
    docs/claims-and-verification.md line 84. The correct value is `none`.

    (D2) COMPANION ARTIFACTS ABSENT FROM THREE RUN DIRECTORIES.
    tools/validate_ledger.py lines 766-771 require command.txt,
    environment.json, stdout.log, stderr.log and raw-result.json in every run
    directory, with exactly one exemption (raw-result.json only, and only for a
    `running`/`in_progress` manifest declaring `result.raw_result_pending: true`
    with `certificate.kind: none`). There is NO zero-compute exemption. Absent:
    all five on RUN-QSP-33b442-S0 (stage 0, declared zero compute), all five on
    RUN-QSP-33b442-S5 (stage 5, declared extraction only), and stderr.log plus
    raw-result.json on RUN-QSP-33b442-S2 (the aborted invalid run).

  independent_verification:
    method: >-
      No shell was available to this session, so the validator was NOT re-run
      here. Every claim below was verified by reading the named file directly.
      The dispatching session's validator run stands as the source of the error
      list; this section is the independent confirmation of each item.
    d1_confirmed:
      - 'tools/validate_ledger.py:62 reads CERTIFICATE_KINDS = ("discrete_log", "decomposition", "key_recovery"); :793-799 accept a kind in that tuple or the literal "none" and reject everything else. READ DIRECTLY.'
      - 'docs/claims-and-verification.md:33 gives the vocabulary discrete_log | decomposition | key_recovery | none; :84-86 document `kind: none` for pure measurement runs. READ DIRECTLY.'
      - 'The string `root_list` appears in NO file under docs/, tools/ or templates/ (three separate greps, zero matches). It is an invention of these four manifests.'
      - 'The four manifests carrying `kind: root_list` are S1 (line 126), S1B (156), S2B (863), S3 (120). S0 (96), S2 (109), S4 (116) and S5 (105) already record `kind: none` and are NOT affected.'
    d2_confirmed:
      - 'RUN-QSP-33b442-S0/ contains exactly derivation-note.md and manifest.yaml. All five companions absent.'
      - 'RUN-QSP-33b442-S5/ contains exactly metrics.json, manifest.yaml and report.md. All five companions absent.'
      - 'RUN-QSP-33b442-S2/ contains command.txt, environment.json, stdout.log, manifest.yaml and cells/ (54 files). stderr.log and raw-result.json absent. The manifest declares stderr merged into stdout.log and raw_result "absent: the run did not reach its result-writing step".'
      - 'tools/validate_ledger.py:765-771 carries no zero-compute exemption; the only skip is raw-result.json under the nonterminal raw_result_pending path (:757-764), which requires status running/in_progress. S0 and S5 are `completed_valid` and S2 is `aborted_implementation_error`, so none qualifies and none may be made to qualify by restating its status.'
      - 'check_run docstring (:693-695): "Companion artifacts are always looked for in the discovered run directory, since they belong to the run package regardless of where the superseding record is filed." A supersession therefore CLEARS D1 and does NOT clear D2. This is load-bearing for the route below.'
    measurement_bearing_runs_are_complete: >-
      Every run that produced a number -- S1, S1B, S2B, S3, S4 -- carries all
      five companion artifacts. Verified by directory listing of each. NOT ONE
      OF THE FIFTEEN ERRORS FALLS ON A MEASUREMENT-BEARING RUN DIRECTORY.

  route:
    principle: >-
      These manifests are committed on main (PR #1263, merge dc1f19e2b). AGENTS.md
      rule 4 binds: results are immutable and corrections create new records.
      tools/validate_ledger_baseline.txt is PRUNE-ONLY and cannot absorb a new
      error, so suppression is unavailable and was not attempted. The route
      below uses the repository's established hash-pinned supersession mechanism
      (tools/run_supersession_registry.yaml, schema run-supersession-registry-v1)
      and, where that mechanism cannot honestly reach, DISCLOSES THE RESIDUE
      rather than closing it.

    D1_route:
      action: register_four_certificate_label_supersessions
      precedent: >-
        RUN-ECDLP-122c4e-002 in tools/run_supersession_registry.yaml, whose
        `supersession_kind` is `certificate_schema_label_correction` and whose
        defect reads "The immutable valid run manifest used a certificate kind
        outside the validator's bounded vocabulary. The superseding record
        changes only the certificate label to none and retains the exact raw
        result and metrics." That is this defect exactly, and this route is that
        precedent applied.
      instruction: >-
        For each of RUN-QSP-33b442-S1, -S1B, -S2B and -S3: write
        manifest_v2.yaml BESIDE the original in the same run directory,
        byte-for-byte identical to the original except that (i)
        run.result.certificate.kind becomes `none`, (ii) a
        `certificate.kind_note` states that this is a root-COUNT measurement run
        claiming no solve, relation or decomposition, that `none` is the
        documented value for such a run
        (docs/claims-and-verification.md line 84), and that the original
        recorded the invented value `root_list`, and (iii) a `run.supersedes`
        block declares the supersession from the record's own side, naming the
        superseded path, its sha256, and the rule that the prior manifest
        GOVERNS every field it carries. The `verifier`, `certified_candidates`
        and every other certificate field are carried over VERBATIM: the
        explicit root lists are real, were independently re-verified by
        qspcore.verify_roots_f2, and nothing in this correction weakens or
        withdraws them. The original manifests stay byte-identical at their
        original paths. Then add four entries to
        tools/run_supersession_registry.yaml with
        `supersession_kind: certificate_schema_label_correction`, both sha256
        values pinned, and `decision_id: CORR-20260917-8b80cc`.
      clears: 4 of the 15 errors
      touches_no_measurement: >-
        The label is metadata about what class of claim the run asserts. No
        count, ratio, histogram, seed, timestamp, orbit decomposition or
        certificate payload is read, written or recomputed by this route.

    D2_route_S2:
      action: complete_the_aborted_run_package_from_already_recorded_content
      precedent: >-
        RUN-SSIQ-4de240-a and RUN-MLKEM-980909-a in the same registry:
        companions "derived only from bytes already frozen at that commit" and
        "explicit transcriptions of preserved artifacts", with an
        integrity-recovery.json binding each file to its source. The SSIQ entry
        also settles the receipt question in terms: "Adding files leaves the
        receipt's declared path hashes valid, because a receipt pins paths and
        not directory contents."
      instruction: >-
        Write two files into RUN-QSP-33b442-S2/ and touch nothing that is
        already there.
        (1) stderr.log: an EXPLICIT TRANSCRIPTION, not a copy. Its content
        states that this invocation merged fd 2 into fd 1, that the combined
        stream is stdout.log in this directory, and that the manifest records
        this. DO NOT copy stdout.log's bytes into stderr.log: that would assert
        those bytes came from fd 2, which is false.
        (2) raw-result.json: a DECLARED-ABSENCE record, machine-readable, whose
        first key is a loud non-result declaration (e.g.
        "THIS_IS_NOT_A_RESULT": true) and which carries `run_id`,
        `status: aborted_implementation_error`, `terminal_raw_result_produced:
        false`, the abort reason quoted from the manifest, the list of the 54
        per-cell checkpoint files under cells/, and an explicit statement that
        NO number from this run is reported anywhere. NO COUNT, RATIO OR
        MEASUREMENT OF ANY KIND MAY APPEAR IN IT.
        Then supersede the manifest (manifest_v2.yaml,
        `supersession_kind: aborted_run_companion_completion`) declaring both
        files, their derivation, and that the run remains INVALID and remains
        not evidence.
      clears: 2 of the 15 errors
      what_this_must_not_become: >-
        An aborted run acquiring a file named raw-result.json is the exact shape
        of a run appearing to have produced a result. The loud non-result key
        and the manifest_v2 declaration exist to make that reading impossible
        for any reader who opens the file.

    D2_route_S5:
      action: genuine_re_execution_of_the_extraction_step_under_the_wrapper
      judgement: >-
        THIS IS THE ONE PLACE A RE-RUN IS BOTH POSSIBLE AND HONEST, AND IT IS
        CHOSEN DELIBERATELY OVER RECONSTRUCTION. make_report.py DID run: the
        manifest records the exact command
        (`python3 experiments/EXP-QSP-33b442/implementation/make_report.py`) and
        metrics.json and report.md are its output. What was missed is the
        CAPTURE, not the execution. And the step takes NO MEASUREMENT: it reads
        five frozen raw-result.json files and evaluates the M7 table in closed
        form. A re-execution therefore cannot move a measured value, and its
        agreement with the committed metrics.json is a free determinism check
        that ADDS evidence rather than manufacturing it. Reconstructing
        stdout.log from the manifest instead would produce a file describing
        output nobody captured; re-running produces the real thing.
      budget_ruling: >-
        THIS RE-EXECUTION DOES NOT CONSUME budget.maximum_runs = 6, AND THE
        BASIS IS THE CONTRACT'S OWN TEXT, NOT A BUDGET WAIVER. specification.yaml
        budget.note defines the run budget as "the five compute stages plus one
        re-invocation for infrastructure failure"; Stage 5 takes no measurement
        and is not a compute stage. Both RUN-QSP-33b442-S0 and -S5 recorded
        exactly this reading in `counts_against_maximum_runs_reason` BEFORE this
        defect was raised, so it is a pre-existing declared reading and not a
        post-hoc reinterpretation minted to license a re-run. The six counted
        invocations remain S1, S1B, S2, S2B, S3, S4. I decline to rest this
        ruling on the CLAUDE.md research-budget instruction of 2026-09-06 (which
        would independently make run-count estimates advisory), because resting
        it there would license re-running any stage at will, which is exactly
        what maximum_runs exists to prevent. Machine protection is untouched:
        the step runs in under a second against a 4 GB cap that was never
        approached.
      instruction: >-
        (1) Re-run make_report.py under the run wrapper with output directed to
        a SCRATCH directory outside experiments/ (the QSP_RUNS_DIR override the
        Executor already used for smoke tests).
        (2) Compare the scratch metrics.json against the committed
        experiments/EXP-QSP-33b442/runs/RUN-QSP-33b442-S5/metrics.json BYTE FOR
        BYTE. If they differ in any way, STOP AND RETURN TO THE COORDINATOR with
        the diff. A divergence is a finding about determinism or about the
        frozen inputs and is never smoothed over, reconciled, or resolved by
        preferring either file.
        (3) Only on byte-identity: copy the five companions
        (command.txt, environment.json, stdout.log, stderr.log,
        raw-result.json) from the scratch run into
        RUN-QSP-33b442-S5/, and write integrity-recovery.json binding each file
        to its source and stating in terms that these companions come from a
        VERIFIED-IDENTICAL RE-EXECUTION at a later commit and are NOT the
        original invocation's captured output. raw-result.json is the scratch
        run's own raw result; it is not a copy of metrics.json and does not
        replace it.
        (4) DO NOT TOUCH manifest.yaml, report.md or metrics.json in that
        directory. Supersede the manifest with manifest_v2.yaml
        (`supersession_kind: uncaptured_extraction_step`) declaring the
        uncaptured original invocation, the re-execution, its commit, and the
        byte-identity result.
      clears: 5 of the 15 errors
      fallback_if_not_byte_identical: >-
        Do not proceed and do not reconstruct. Return the diff. The Coordinator
        decides; the likely outcome is that S5 joins S0 as disclosed residue
        rather than that any file is adjusted to match.

    D2_route_S0:
      action: supersede_the_classification_and_DISCLOSE_the_residual_five_errors
      judgement: >-
        S0 IS THE CASE THAT CANNOT BE CLEARED HONESTLY, AND I AM NOT GOING TO
        PRETEND OTHERWISE.

        No program ran in Stage 0. The contract says so in terms ("compute:
        ZERO. No program is run in this stage") and the artifact is a
        hand-written derivation note. There is no stdout, no stderr and no raw
        result -- not uncaptured, NON-EXISTENT -- and there never can be.
        Writing those three files now would describe an execution that did not
        occur: fabrication under AGENTS.md rule 9, and forbidden.

        I considered and REJECT each of the available escapes, with reasons:

        (a) Write the three files as explicit transcriptions saying no program
        ran. Rejected. Such a file asserts nothing false to a reader who opens
        it, but the check it satisfies is an EXISTENCE check -- which is what
        the validator performs and what the rule is for. Writing it converts a
        true "this stage ran no program" into a green signal meaning "this run
        captured its stdout". That is the check ceasing to be a check, and it is
        the same failure mode CLAUDE.md names for a floor moved to turn a red
        test green. For the same reason I decline even command.txt and
        environment.json, which COULD honestly be re-serialised from the
        manifest's own blocks (the RUN-SSIQ-4de240-a precedent): clearing 2 of 5
        leaves the directory red anyway and buys nothing but clutter and a
        second provenance question.

        (b) Move the derivation note out of runs/ so no run manifest is
        discovered there. Rejected. The classification would be right -- a hand
        derivation is a theory artifact, not a run -- but the path is committed
        and is bound by the snapshot archive's declared path_sha256, and moving
        it would break that binding permanently (AGENTS.md rule 15).

        (c) Give tools/validate_ledger.py a declared zero-compute exemption.
        Rejected HERE, not on the merits. This may well be the right repository-
        level fix -- the same category error will recur in every contract with a
        zero-compute stage, and EXP-ECDLP-a98ea9-S0 in the supersession registry
        suggests it already has -- but a shared check that constrains forty
        campaigns is not repaired inside the evidence-review gate of the one
        campaign it inconveniences. That is a proposal to route, not a change to
        make here.

        (d) Relabel S0's status to `running` with raw_result_pending to reach
        the validator's one exemption. Rejected: it is a lie about a terminal
        artifact.

      instruction: >-
        Write manifest_v2.yaml beside the original, preserving every field and
        adding (i) `execution: none_occurred` with the contract's own
        zero-compute line quoted, (ii)
        `companion_artifacts_absent_permanently` naming all five with the
        statement that they do not exist, cannot be derived, and MUST NEVER BE
        WRITTEN, and (iii) a `run.supersedes` block. Register it with
        `supersession_kind: zero_compute_misclassification` and
        `decision_id: CORR-20260917-8b80cc`. This clears NO validator error and
        is not intended to: it makes the classification defect legible in the
        record.
      clears: 0 of the 15 errors
      residual_disclosed_debt:
        count: 5
        errors:
          - "experiments/EXP-QSP-33b442/runs/RUN-QSP-33b442-S0/manifest.yaml: run directory missing artifact 'command.txt'"
          - "experiments/EXP-QSP-33b442/runs/RUN-QSP-33b442-S0/manifest.yaml: run directory missing artifact 'environment.json'"
          - "experiments/EXP-QSP-33b442/runs/RUN-QSP-33b442-S0/manifest.yaml: run directory missing artifact 'stdout.log'"
          - "experiments/EXP-QSP-33b442/runs/RUN-QSP-33b442-S0/manifest.yaml: run directory missing artifact 'stderr.log'"
          - "experiments/EXP-QSP-33b442/runs/RUN-QSP-33b442-S0/manifest.yaml: run directory missing artifact 'raw-result.json'"
        status: >-
          STANDING, DISCLOSED, NOT SUPPRESSED. tools/validate_ledger.py will
          continue to report these five for EXP-QSP-33b442 until the repository
          decides the general question. They are named here in full so that no
          later reader mistakes silence for absence, and so that any archive
          receipt covering this experiment can list them as known debt rather
          than discovering them.
        honest_summary: >-
          An honestly red check is worth more than a dishonestly green one. The
          baseline is prune-only precisely so that nobody can make this go away
          by suppression, and this record does not try.

    net_effect: >-
      15 errors on this experiment become 5, all five on a single zero-compute
      artifact that records no measurement, all five disclosed by exact text
      above, and none suppressed. The 60 further errors in the dispatching
      session's run belong to TASK-20260910-*, EXP-PRECOMP-0* and EXP-AES-14352a
      and are NOT touched by this correction or by this campaign; they are noted
      for the record and left to their owning campaigns, which
      .github/workflows/main-health.yml files against by design.

  amendment_rulings:
    ruling_note: >-
      These are Coordinator rulings and are recorded here because this session
      was directed not to open a decision record. If the dispatching session
      wants them carried as a `coordinator_decision`, it should mint a DEC-* id
      and lift them verbatim; nothing in them changes on transcription.

    AMD-20260917-001:
      path: experiments/EXP-QSP-33b442/amendments/AMD-20260917-001-i3-feasibility-cap.yaml
      ruling: RATIFIED
      effective_status: ratified_by_coordinator
      reasons:
        - >-
          AUTHORED BEFORE THE AFFECTED RUNS. `authored_before_runs` names
          RUN-QSP-33b442-S1 and -S2, and the S1, S1B, S2B, S3 and S4 manifests
          all carry `amendments_in_force: [AMD-20260917-001]`. It is a
          pre-registration, not a retro-fit, which is the one property that
          decides whether an amendment may be ratified at all.
        - >-
          IT NARROWS AN INSTRUMENT, NOT A RESULT. No cell, candidate set, seed,
          threshold, metric definition, pre-registered value, success criterion
          or falsification branch changes. Stage 2's primary instrument I2 ran
          on all 42244 candidates; the cap withholds the REDUNDANCY instrument
          I3 on a deterministic, exhaustively listed subset.
        - >-
          THE IMPEDIMENT IS REAL AND IS INFRASTRUCTURE. No sub-quadratic
          GF(2)[X] reduction engine is installed (recorded independently in each
          run's environment.json and in the execution report's
          tooling_impediment anomaly). Under AGENTS.md rule 3 that is never
          negative mathematical evidence, and stopping Stage 2 would have
          discarded M3 entirely to protect a redundancy check.
        - >-
          THE EXCLUSION IS REVERSIBLE AND AUDITABLE. All 14 candidates are
          listed by name with exact deg D in RUN-QSP-33b442-S2B's raw result
          (I3_skipped_above_cap), so the withheld work is a re-run away on any
          machine with NTL, Flint, Sage or Magma.
      ratification_scope_limit: >-
        RATIFICATION COVERS CHANGE A1 AND NOT THE AMENDMENT'S CHARACTERISATION
        OF ITS OWN COST. Both the amendment summary and execution-report PD-1
        describe the exclusion as "14 of the 356 near-complete candidates" and
        argue that M3 is unaffected because I2 ran on every candidate. That is
        true as far as it goes, and it understates the cost in a way a reviewer
        must be told: TEN OF THE FOURTEEN EXCLUDED CANDIDATES ARE COMPLETE
        SPLITTERS -- 10 of the 65 rows of M3, all at (n, n') = (31, 5) with
        d = 8, N = 32 and deg D = 2097152 -- whose completeness and whose N rest
        on I2 alone with no second instrument. Verified by this session by
        reading RUN-QSP-33b442-S2B/raw-result.json: the 24 occurrences of
        `"i3_run": false` decompose as 14 rows in M3_near_complete and 10 rows
        inside the M3_complete_splitters block (lines 16528-18090).
      why_that_disclosure_does_not_change_the_ruling: >-
        For those 10 rows, beta is a function of (n, n', d) alone and does not
        depend on N: beta = 3*31/25 = 3.72 against corollary_exact
        31/35 = 0.886, a margin of 2.834. Recomputed by hand this session and it
        checks. The F2 decision is not close for them, and because I2 ran on all
        42244 candidates no complete splitter can have been MISSED by the cap.
        The residual risk is confined to a systematic I2 error, which is joint
        J4 of the review plan and is assigned.
      carry_forward: >-
        The 10-of-65 figure is carried into the review handoff
        TASK-20260917-43701b and must appear in any later evidence record's
        boundaries. It may not be reported again as "14 of 356" without it.

    v2_yaml:
      path: experiments/EXP-QSP-33b442/amendments/v2.yaml
      what_it_is: >-
        An unratified, differently-authored protocol amendment carrying two
        internal-consistency corrections to the version-1 contract, found on
        review of PR #1261 and dated before execution. (1) The F1 and F2
        stopping rules give contradictory orders on one and the same event: a
        Stage 2 complete splitter with beta below the exact corollary is, by the
        arithmetic of (B), also a bound violation, and F1 says stop immediately
        while F2 says finish the sweep. v2 makes F1 take precedence. (2) M1's
        definition enumerates only the Stage 1, 1b and 3 cells, while S1, P-A
        and P-C all quantify over Stage 2 as well, so S1 and P-C are not
        decidable from the metrics as listed. v2 extends M1's enumeration to
        every Stage 2 sweep cell. It declares `affected_runs: []`,
        `approved_by: coordinator`, and a `binding` clause requiring run
        manifests to record contract version 2 with this file's path.
      ruling: NOT RATIFIED; REJECTED AS AN IN-FORCE AMENDMENT; ITS TWO DIAGNOSES ARE ACCEPTED AND PRESERVED
      reasons:
        - >-
          IT WAS NEVER IN FORCE ON ANY RUN, BY ITS OWN TEST. Every one of the
          eight manifests records `specification_version: 1` with
          `amendments_in_force: [AMD-20260917-001]`, and not one names v2.yaml.
          Its own `binding` clause -- "the run manifest records contract version
          2 with this file's path" -- was not honoured. Ratifying it now would
          make a protocol change true retroactively for runs that did not carry
          it, which is precisely the post-hoc amendment CLAUDE.md and the
          contract's own status_note forbid.
        - >-
          IT SELF-ASSERTS ITS OWN APPROVAL. `approved_by: coordinator` is a
          field in a file, not an approval. Approval is a frozen contract at a
          declared path plus a COMMITTED Coordinator decision, and no committed
          decision ratifying v2.yaml exists. A record cannot approve itself,
          and a record written by one agent cannot record another role's
          consent (AGENTS.md, "Never record an agreement, attestation, or
          approval you did not obtain").
        - >-
          IT CARRIES NO RECORD IDENTIFIER. `v2.yaml` is a filename. The sibling
          amendment is AMD-20260917-001; a new amendment needs an id minted by
          tools/allocate_id.py and confirmed with --check.
        - >-
          ITS FACTUAL PREMISE HAS EXPIRED. It states "no run of this contract
          has executed (experiments/EXP-QSP-33b442/runs/ is empty)" and
          `affected_runs: []`. Eight run directories now exist. Those assertions
          cannot be re-affirmed as written.
      why_its_diagnoses_are_nevertheless_ACCEPTED: >-
        Both defects it identifies are REAL and I confirm them independently.
        Rejecting the vessel is not rejecting the finding, and discarding a
        correct diagnosis because its record is malformed would be the
        premature-closure failure mode applied to housekeeping. They are
        recorded here as standing contract defects of version 1 and are carried
        to the reviewers:
        (i) The F1/F2 contradiction is real and NEVER FIRED: S2B records
