        unaffordable, per the contract's own instrument line); I3 skipped under
        AMD-20260917-001 (deg D = 2097152 above the cap). C6 independently
        predicts 32768 with symbol T^15 + T^7 + T^3 + T + 1.
        C4 (n=3, n'=2, X^2+X): forced 4, measured (4, 4, 4), bound 4 ATTAINED,
        roots listed and re-verified, C6 predicts 4.
        C5 is the Stage 1b arm: 1200 draws, 0 disagreements, 0 above the bound.
        C6: 30 linearized candidates in Stage 1 and 1170 in Stage 2, 0
        disagreements with Proposition 2 of KN-LIT-4fe9d2.
        M6 = (64, 8, 32768, 4) exactly, as pre-registered.
      declared_gap: >-
        C3 stands on two independent procedures (I2 and the C6 Proposition-2
        decision) rather than three. The Executor declares this in
        unfinished_work and the amendment declares it in
        instrument_coverage_of_the_forced_fixtures_after_this_amendment. It is
        disclosed, not hidden, and it is the amendment's own declared cost.
      control_that_never_fired_and_is_reported_as_a_finding: >-
        DEGENERATE DETECTION WAS NEVER EXERCISED, AND THAT IS A PROPERTY OF THE
        CELL DESIGN RATHER THAN AN OBSERVATION. Every cell reports
        `degenerate_candidates: 0`. The degenerate case requires d = p^j with
        j(q+1) = n' - r. Evaluating that condition at all eight cells of this
        contract: (7,3) needs 3j = 2; (11,6) 2j = 1; (13,7) 2j = 1; (11,4)
        3j = 1; (13,5) 3j = 2; (131,33) 4j = 1; (131,44) 3j = 1; (131,66)
        2j = 1. NONE HAS AN INTEGER SOLUTION. So no cell in this experiment can
        produce a degenerate candidate, "0 degenerate candidates" is a
        structural consequence of the chosen cells, and the degenerate-detection
        instrument -- which the contract lists as an instrument and on which the
        whole of corollary (B) depends -- returned no positive on any of the
        3192 candidates it saw. Derived by this session from the cell
        definitions; it is not stated anywhere in the contract, the amendment or
        the execution report. It is carried to the review round as joint J2 and
        it is the single most consequential thing this gate found.
    certificates_are_what_they_claim: >-
      CONFIRMED FOR STAGE 3, WITH A DIRECTIONAL LIMIT THAT MUST BE STATED. The
      certificates carry explicit root lists as F_2 coefficient vectors grouped
      into Frobenius orbits with an independent re-verification block, exactly
      as specification.stage_3.certificate requires. But the re-verification
      checks that every LISTED root IS a root and that the listed roots are
      distinct: it detects false positives and CANNOT detect a missed root. A
      missed root lowers N, and lowering N is the direction that makes the bound
      look satisfied. The certificate architecture therefore verifies only in
      the direction that favours the hypothesis. This is not a defect -- it is
      what a root-list certificate can do -- but it means the n = 131 census's
      completeness rests on instrument I3 alone, since I1 and I2 are infeasible
      there. Assigned as joint J4.

