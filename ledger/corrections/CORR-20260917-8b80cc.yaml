        proves-too-much control requires, the 64 explicit roots are listed and
        re-verified, and C6 independently predicts 64 with symbol T^6 + 1.
        C2 (n=7, n'=3, X^2+X): forced 8, measured (8, 8, 8), bound 8 ATTAINED,
        explicit roots listed and re-verified, C6 predicts 8.
        C3 (n=31, n'=15, X^128 + X^8 + X^2 + X): forced 32768, measured by I2
