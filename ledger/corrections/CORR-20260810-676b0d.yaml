  source_of_this_correction: >-
    VAL-20260810-ad7360 (coordination/goals/GOAL-ENDO-001/batches/BATCH-d7e255/
    reviews/validator/validation_report.yaml), finding F-V2.1, independently
    reconfirmed by this Coordinator per TASK-20260810-539f92's own
    pre-verification: read RUN-ICINV-geom-m3-v2/per-curve-invariants.json
    directly for curve (17,1345) and cross-checked against
    execution_report.md section 4 and RT-20260810-2ee0af's independent
    re-derivation of both witness curves' elimination polynomials.

  field: >-
    The free-text narrative of the snapshot commit message at 1721063e4 --
    specifically its description of which witness curve has 0 F_p-rational
    points on the singular-locus variety and which has a single non-extending
    rational root. THIS IS NOT A CORRECTION TO ANY COMMITTED RESEARCH
    ARTIFACT: execution_report.md section 4 states the fact correctly for
    (148,2766) throughout, and every value in per-curve-invariants.json for
    both curves is, and always was, correct. Only the commit-message prose
    this Coordinator wrote is wrong.

  prior_value: >-
    Commit message prose (1721063e4, git log, not a reviewed research
    artifact): "Verified concretely for (17,1345): both backends in fact
    agree (0 rational points, one non-extending rational root)."

  corrected_value: >-
    (17,1345) does NOT have 0 F_p-rational points on the variety. Read
    directly from RUN-ICINV-geom-m3-v2/per-curve-invariants.json: fp_points=6,
    fp_x3_values=[306,1661,2034] -- all three roots of the elimination
    polynomial x3^3+17x3+1345 are rational, factorisation type (1,1,1). The
    curve WITH 0 F_p-rational points, and the one the D-4 supersession
    diagnosis in execution_report.md section 4 actually rests on, is
    (a,b)=(148,2766): elimination polynomial x3^3+148x3-1235 =
    (x3-615)(x3^2+615x3-1722) mod 4001, exactly one rational root, ZERO
    F_p-rational points on the 2-dimensional variety (fp_points=0,
    fp_x3_values=[]). Both facts independently re-verified by this
    Coordinator by direct read, matching VAL-20260810-ad7360 checks V1 and V2
    exactly (which include a hand-checked algebraic re-expansion of the
    factorisation confirming 615*1722 mod 4001 = 2766 = -1235 mod 4001), and
    consistent with RT-20260810-2ee0af's independent programmatic
    re-derivation of both curves' elimination polynomials under A1/A3.

  reason: >-
    A free-text narrative error in prose this Coordinator wrote when authoring
    commit 1721063e4, swapping which of the two witness curves named in
    execution_report.md section 4 exhibits which property. Caught by the
    Validator's V2 check (finding F-V2.1) against the committed artifact
    (per-curve-invariants.json), not by re-deriving anything new -- the
    artifact was always correct. No run record, no manifest field, no
    verdict.json value, and no number in execution_report.md is affected;
    git commit messages are prose, not versioned research records. AGENTS.md
    rule 4's immutability applies to the commit itself (never rewritten);
    this correction supersedes the prose by reference for any future reader
    of the commit log, per SC-2 of the dispatching handoff.

  additional_findings:
    source_reproducibility_gap:
      title: >-
        Three distinct, all-untracked source-file versions of
        harness/exp_icinv_geometry.py were used across the five completed
        runs of EXP-ICINV-e0cd8f; only the LAST is git-recoverable.
      severity: material_reproducibility_finding_no_primary_number_affected
      affected_runs:
        - RUN-ICINV-geom-gates   # source sha256 7ac1030c...
        - RUN-ICINV-geom-m3      # source sha256 7ac1030c...
        - RUN-ICINV-geom-m3-v2   # source sha256 8fb54bc5... -- THE PRIMARY m=3 RECORD
        - RUN-ICINV-geom-m4      # source sha256 8fb54bc5...
      not_affected:
        - RUN-ICINV-geom-m4-v3   # source sha256 91384d9c...; matches the current
                                   # working-tree file AND commit 1721063e4's
                                   # own committed copy exactly; the SECONDARY
                                   # m=4 result, the ONE run genuinely
                                   # bit-exactly reproducible from this repository
                                   # today
      detail: >-
        Read directly from every run manifest's code.source.files sha256
        pins, independently re-verified by this Coordinator per the handoff's
        item (2). `git log --all -- harness/exp_icinv_geometry.py` shows
        exactly ONE commit ever touched that path (1721063e4, the snapshot
        commit itself), whose committed content hashes to 91384d9c...,
        matching ONLY RUN-ICINV-geom-m4-v3's pin. The two earlier code
        versions (7ac1030c..., used for gates+m3; 8fb54bc5..., used for
        m3-v2+m4 -- INCLUDING THE PRIMARY m=3 RESULT) exist nowhere in git
        history or the current working tree; only their hash pins survive as
        fingerprints. This means execution_report.md section 9's claim
        "Reproducible from the recorded commands and the pinned source hashes
        at the recorded commit" is FALSE AS STATED for 4 of the 5 completed
        runs, including the primary one -- a third party cannot literally
        re-execute the code that produced RUN-ICINV-geom-m3-v2 today from
        this repository, only verify that the currently-committed file's hash
        does NOT match the pin, which is itself how this gap was found: a
        disclosed-by-mismatch gap, not a silent one.
      does_not_mean: >-
        This does NOT cast doubt on the NUMBERS. This Coordinator, the
        Validator (fresh Sage session, own code written from the frozen
        contract's formula, not by reading or trusting
        harness/exp_icinv_geometry.py at any version), and the Red Team each
        independently re-derived the headline results from the raw committed
        JSON and, for the two witness curves, from scratch -- none of that
        recomputation depends on which harness-script version originally
        produced the artifacts. Independently confirmed by the Validator
        (V6/finding F-V6.1): every primary invariant (s3_support, betti,
        regularity_of_quotient_S_mod_J, singular_locus_affine
        dimension/degree, elimination degree AND factorisation type) is
        byte-identical across all 138 curves between RUN-ICINV-geom-m3
        (7ac1030c...) and RUN-ICINV-geom-m3-v2 (8fb54bc5...), consistent with
        the report's claim that only the derived cross-check predicate
        changed between those two versions.
      standing_gap: >-
        A repeatable failure mode: an Executor's working script can be
        rewritten multiple times across a run sequence with no intermediate
        commit, so only the LAST version a session ever reaches becomes
        git-recoverable even though every run's own manifest claims a pinned,
        reproducible hash. Flagged forward as N16 in the goal head's
        next_action (harness-hygiene, for a future maintenance session, not
        research work).

    m4_status_label_discrepancy:
      title: >-
        RUN-ICINV-geom-m4's own manifest.yaml records status:
        completed_invalid; execution_report.md's summary table and
        executor_assessment instead label the same run failed_infrastructure.
      severity: presentation_inconsistency_not_a_substantive_disagreement
      detail: >-
        experiments/EXP-ICINV-e0cd8f/runs/RUN-ICINV-geom-m4/manifest.yaml
        line 9: `status: completed_invalid`,
        `result.invalid_reason: "OSError: [Errno 28] No space left on device:
        ..."`. execution_report.md section 1's run table and section 10's
        `executor_assessment.runs.failed` both instead say
        `failed_infrastructure`. Both descriptions point at the SAME
        underlying event -- host disk exhaustion mid-run, an external OSError
        unrelated to this run's own I/O footprint (peak RSS <=0.4GB), with
        SR1-SR3 gates passed before the crash -- and both are consistent with
        AGENTS.md rule 5 (never negative mathematical evidence): this run
        contributes no number used anywhere in verdict.json or any primary
        invariant table. Independently confirmed by the Validator (finding
        F-V6.2, consistent with the generic-exception string format vs. the
        OSError-special-case format the currently-committed harness uses) and
        by this Coordinator reading manifest.yaml directly.
      does_not_change: >-
        Nothing. No hypothesis, question, experiment, or goal status changes
        because of this discrepancy; it is a documentation-layer vocabulary
        mismatch between a manifest field and a report's prose table, not a
        disagreement about what happened, its cause, or its evidential weight
        (which remains: an infrastructure event, never mathematical evidence,
        under AGENTS.md rule 5).

