    explicitly noting the contract remains a committed, frozen SPECIFICATION artifact (not revoked, since
    revoking would rewrite an immutable record) while EXECUTION AUTHORIZATION, which was never granted,
    is what the decision withholds. specification.yaml''s plain `status: approved` field was never updated
    to reflect this -- the exact same live-discrepancy pattern DEC-20260807-5adc24 separately documented
    for EXP-ICEX-146ff5, and one this program''s own decisions warn is checkable only by reading governing
    decisions, not by trusting the field. DEC-20260806-a00a28''s own next_actions named the required repair
    (fix the vOW-law anchoring so it reduces to T_full at w=M; replace the reproduction gate; supply at
    least one control capable of a negative verdict; add re/ast to stdlib_modules_permitted) as a VERSIONED
