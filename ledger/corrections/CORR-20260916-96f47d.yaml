  found_by: >-
    An independent blind textual audit dispatched 2026-09-16 as GOAL-SEMBIN-fcb7a2's first ranked
    action, on `review-adversarial` at `xhigh` in an independent session, barred by its handoff from
    reading the six records that had already answered the question — including both records this
