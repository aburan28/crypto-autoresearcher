    committed at 7676955ce.
  nature: >-
    THE COORDINATOR CONCLUDED THAT NAGAO'S PAPER DOES NOT DETERMINE WHICH FIRST FALL DEGREE
    PROPOSITION 5 BOUNDS. IT DOES. The blind read finds the referent is the TRUE d_F of Definition 5,
    at a stated confidence near 0.85-0.9, and one of its three grounds dissolves the Coordinator's
    argument rather than merely outweighing it.

    The Coordinator's argument was: Proposition 5 is printed unqualified, which by Definition 5 means
    the true d_F; but its only justification is footnote 6's deferral to "the Semaev's case", and the
    passage deferred to delivers a FAKE bound; therefore the statement and its proof point at
    different quantities and the text does not fix which the proposition is about.

    The missing observation, which the Coordinator did not look for: THE PAPER DOES THIS EVERYWHERE.
    Lemma 6's statement (:540-542) is about the true "first fall degree of {F↓_j} ∪ S_fe", and its
    proof (:580-583) bounds the FAKE quantity and then invokes Lemma 4 to convert. So a statement in
    d_F whose proof bounds d'_F is the paper's NORMAL PROOF ARCHITECTURE, not a symptom of
    indeterminacy. Footnote 6 routing Proposition 5 to a fake-degree argument is therefore evidence
    about how the paper proves things, and no evidence at all about what Proposition 5 is about. The
    Coordinator read a proof as evidence about a statement's referent.
  the_two_further_grounds:
    role_of_the_bound: >-
      Proposition 5 feeds Proposition 6 (:731-742), whose exponent is 4w. That 4w is d_F·w from
      Lemma 2 (:423-424) under Assumption 1 (:416-417), both of which are written in d_F. So the
      quantity Proposition 5 bounds must be d_F, or Proposition 6's complexity claim does not follow
      from it. This is an independent structural argument and the Coordinator had all of its inputs.
    terminology: >-
      The paper writes "Fake" every single time it means d'_F (:428, :430, :432, :458, :461-462,
      :513, :580) and omits it in Proposition 5 (:719), Lemma 6 (:540), Proposition 2 (:587),
      Lemma 4 (:510), Assumption 1 (:416) and Lemma 2 (:423). Definition 6 attributes the fake
      quantity to a set of the form {f_i} ∪ S_fe and EQS4 has exactly that form, so the ARGUMENT of
      the phrase does not disambiguate; only the presence or absence of "Fake" does.
  corrected_values:
    referent_of_proposition_5:
      as_recorded: >-
        "The paper does not fix which" — DEC-20260915-94855e's adopted premise and the
        GOAL-SEMBIN-fcb7a2 objective's stated ambiguity.
      corrected_to: >-
        The TRUE first fall degree d_F of Definition 5, applied to EQS4 = G ∪ S_fe with the field
        equations INSIDE the generating set (Definition 8 :713; footnote 5 :690). Confidence ~0.85-0.9,
        residual recorded below. Stated about d_F, argued via d'_F.
    evidential_direction_of_a_fake_measurement:
      as_recorded_in_DEC_20260913_8d19e5_item_d: >-
        The instrument is a one-directional REFUTER: a measured d'_F > 4 refutes Proposition 5, and a
        measured d'_F <= 4 confirms nothing.
      as_recorded_in_the_draft_goal_head: >-
        A d'_F measurement can CONFIRM Proposition 5 and never REFUTE it.
      corrected_to: >-
        THE DRAFT HEAD HAD THE DIRECTIONS RIGHT AND THE COMMITTED DECISION HAD THEM BACKWARDS, and
        both were less informative than the truth.
        (i) A measured d'_F > 4 does NOT refute Proposition 5. Lemma 4 runs d_F <= d'_F, so
        d_F <= 4 < d'_F is perfectly consistent; a large fake value cannot push the true value up.
        What it DOES contradict is the paper's only justification for that instance — the borrowed
        Semaev d'_F <= 4 plus footnote 6's "the situation is the same" — leaving Proposition 5
        UNPROVEN there rather than false. That is a real and reportable finding, and it is the useful
        half of what the committed decision was reaching for.
        (ii) A measured d'_F <= 4 DOES confirm Proposition 5 at that instance, via
        d_F <= d'_F <= 4 — conditional on Lemma 4, which this paper asserts without proof (:507
        cites [11] and notes the proof is "complicated and not constructive"), and instance-level
        only, since the proposition is universal.
        The two readings agree on the confirmation direction and differ only on refutation.
  the_finding_that_most_changes_the_campaign: >-
    A BOOLEAN-RING MACAULAY INSTRUMENT IS STRUCTURALLY UNABLE TO EXHIBIT d_F > 4, so the planned
    instrument cannot refute Proposition 5 under the corrected reading however it is tuned.
    Mechanism, verified by the Coordinator: with S_fe inside the generating set, the field equations
    carry their own multipliers and degrees are taken BEFORE reduction, so a degree drop produced
    purely by X^2 -> X counts toward d_F and is invisible to d'_F. Worked witness, rechecked
    independently: for f = X1X2X3 + X1X4X5 + X2, the multipliers X1 on f and (X2X3 + X4X5) on
    (X1^2 + X1) give two degree-4 products summing to X1X2X3 + X1X4X5 + X1X2, of degree 3 — a true
    fall at 4 — while the same multipliers in the Boolean ring give degree 3 with no drop at all.
    This is the mechanism behind d_F <= d'_F, and it means the gap the ">4" observation would have to
    cross is not merely unbridged but unbridgeable by that class of instrument.
  two_defects_in_the_paper_found_in_passing:
    lemma_4_literal_form_is_false: >-
      Lemma 4 (:510) puts d_F on {f_1..f_M} with the field equations OUTSIDE the left-hand system.
      In that form it is FALSE. Counterexample over F_2, rechecked by the Coordinator with an
      EXHAUSTIVE search rather than a witness check: f_1 = X1X2 + X3, f_2 = X1 + X2 give d'_F = 2
      (f_1 + X2·f_2 ≡ X2 + X3 mod S_fe from degree-2 reduced products), while no combination with
      degree-2 products has a degree-1 sum in the polynomial ring — the search over all 31 nonzero
      coefficient choices returns none — and the first true fall is at degree 3
      ((X1+X2)f_1 + X1X2·f_2 = X1X3 + X2X3 from degree-3 products). So d_F = 3 > 2 = d'_F. With the
      field equations INSIDE, f_1 + X2·f_2 + (X2^2 + X2) = X2 + X3 is a true fall at 2 and the
      inequality holds. Every application in the paper (Lemma 6, footnote 5, Definitions 4 and 8)
      takes the inside form, which is the form the campaign needs; a reader who transcribes Lemma 4
      literally and applies it to G alone is relying on a false statement.
    trivial_koszul_ceiling: >-
      With S_fe inside and condition (1) read as ">=", the literal true d_F of ANY cubic system
      ∪ S_fe at p = 2 is <= 5: taking g = (X_j^2 + X_j) on a cubic f and h_j = f + 1 on the field
      equation gives degree-5 products summing to X_j^2 + X_j, of degree 2. Rechecked. So
      Proposition 5's bound of 4 sits ONE DEGREE BELOW A TRIVIAL CEILING, and any instrument must
      declare whether trivial falls count and whether condition (1) is ">=" or "="; the paper does
      not say, and under the literal ">=" reading Assumption 1 would be false outright.
  residual_uncertainty:
    what_is_not_settled: >-
      The proposition itself is silent and the paper's own evidence for it bounds the other quantity,
      so the residual ~0.1-0.15 is authorial intent rather than anything further in this text. The
      reader also reports an extraction limit it could not resolve: condition (1) of both definitions
      reads ">= dF" (:401, :439) and Definition 6's conditions name dF rather than d'F, and whether
      that is in the PDF or is a lost prime glyph is not determinable from the frozen text alone.
    what_would_settle_it: >-
      The two frozen upstream papers the reader was deliberately barred from — Nagao 2013/549 (for
      Lemma 3, on which Lemma 4 rests) and Semaev 2015/310 (for what Semaev's argument actually
      delivers). Both are already in `inputs/` with sha256 sidecars. DEC-20260913-8d19e5 records that
      Lemma 3 is proved upstream while d_F <= d'_F appears in neither upstream paper in either
      direction, so the specific open question is whether the upstream Lemma 3 supports the INSIDE
      form. That is a zero-compute read and is ranked in DEC-20260916-88ac73.
  how_the_error_was_made: >-
    The Coordinator read the paper for one question — which quantity does Proposition 5 bound — and
    found a genuine tension between a statement and its footnote. Having found a tension sufficient to
    explain why two records disagreed, it stopped, because the ambiguity finding already resolved the
    inconsistency it had set out to resolve. It did not then ask the next question, whether the paper
    does the same thing elsewhere, which is the question that would have shown the tension to be a
    convention. A reading that explains the discrepancy is not thereby the correct reading, and an
    explanation that arrives is more persuasive than one that has to be looked for.
  what_the_correction_vindicates: >-
    ADOPTING A RULE INSTEAD OF A CONCLUSION. DEC-20260915-94855e declined to choose between the two
    readings and instead required every reported d'_F to carry both consequences, explicitly because
    one reader had settled the question and that is not an independent review. That decision is
    superseded on its premise and its rule survives the change intact: everything already required to
    be reported is still required, and nothing recorded under it needs retracting. Had it recorded the
    ambiguity as a finding rather than as a reporting obligation, this correction would be retracting a
    conclusion instead of narrowing a premise.
  why_the_records_are_not_edited: >-
    DEC-20260915-94855e, DEC-20260913-8d19e5 and the 2026-09-15 state of the goal head are committed
    and immutable. All three are superseded by reference here and by DEC-20260916-88ac73; none is
    edited. A later reader consults all of them and can see that the program's reading changed, when,
    and on what evidence.
  forward_guidance:
    - >-
      A PAPER'S PROOF CONVENTION IS PART OF ITS TEXT. Before concluding that a statement and its proof
      disagree about a referent, check whether the same author does the same thing in the neighbouring
      results. Here Lemma 6 and Proposition 2 make the pattern explicit, and either alone would have
      settled it.
    - >-
      WHEN TWO RECORDS DISAGREE, THE EXPLANATION THAT DISSOLVES THE DISAGREEMENT IS THE ONE TO DISTRUST
      MOST. It arrives with the strongest motive to be believed and the least pressure to be checked.
    - >-
      BAR THE INDEPENDENT READER FROM THE RECORDS THAT ALREADY ANSWERED, INCLUDING THE DISPATCHER'S OWN.
      This audit's value came entirely from that: a third opinion formed after reading either prior
      record would have been worth nothing, and the reader confirms it opened neither.
  what_this_correction_does_not_assert:
    - >-
      NOT that Proposition 5 is false, unproven-in-general, or in any way defective as mathematics. It
      is a statement about d_F whose only justification in THIS paper is borrowed and whose proof is
      omitted by footnote; the upstream sources are frozen and one of them is unread.
    - >-
      NOT that d_F <= d'_F is false. Lemma 4's LITERAL form is false, verified; the INSIDE form the
      paper actually uses holds in every instance checked and is not proven in general here.
    - >-
      NOT a measurement of anything, and no evidence about any elliptic curve. This is a reading of a
      frozen text plus toy hand algebra on five variables.
    - >-
      NOT a hypothesis status change. GOAL-SEMBIN-fcb7a2 still has no hypothesis: H-SEMBIN-a7e721
      remains a reserved identifier.
