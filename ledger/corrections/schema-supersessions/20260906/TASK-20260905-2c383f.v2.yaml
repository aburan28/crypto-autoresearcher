handoff:
  id: TASK-20260905-2c383f
  from: coordinator
  to: validator
  objective: Independent integrity review of the existing GOAL-SATIC-c49b77 launch
    archives (BATCH-1a527c, BATCH-971dc7, BATCH-cef2eb) with an early startup receipt
    and a durable final report. This is the fresh bounded review whose separate committed
    approval the goal's next_action requires.
  inputs:
  - coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-008925/contracts/integrity-review.json
  - coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-008925/tasks/TASK-20260905-2c383f/task_card.yaml
  - ledger/decisions/DEC-20260905-36847f.yaml
  constraints:
  - Write the startup receipt before opening any archive under review; two prior review
    attempts (TASK-20260905-a05748, TASK-20260905-b6c926) ended without a formal report
    and the receipt exists to decouple liveness from delivery.
  - Recompute every digest from file bytes; never treat a recorded digest as its own
    evidence (blind re-derivation, blind from all recorded digests).
  - Apply the J1 method to the known-good BATCH-cef2eb set as a proves-too-much control;
    report if the method flags everything or nothing.
  - No solver execution, no benchmarks, no resource-limit changes, no network activity,
    never Amazon Bedrock; workers never commit.
  - The blocked ledger stages of BATCH-1a527c and BATCH-971dc7 stay blocked; unblocking
    is a separate Coordinator decision regardless of this verdict.
  - No scientific claim, no goal status change; report only within declared scope.
  deliverables:
  - coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-008925/tasks/TASK-20260905-2c383f/startup_receipt.json
  - coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-008925/tasks/TASK-20260905-2c383f/report.json
  artifact_paths:
  - coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-008925/tasks/TASK-20260905-2c383f/startup_receipt.json
  - coordination/goals/GOAL-SATIC-c49b77/batches/BATCH-008925/tasks/TASK-20260905-2c383f/report.json
  archived_by: TASK-20260905-2c383f
  inference:
    policy: review-adversarial
    reasoning_effort: xhigh
    fallback_allowed: false
    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: 5400
    memory_gb: 4
    maximum_runs: 1
  completion_gate:
  - startup_receipt.json written before any reviewed archive is opened
  - report.json at the declared path with per-joint verdicts J1-J4, the control outcome,
    and an overall verdict of pass | fail | inconclusive
  - every verdict cites exact artifact paths; J1 cites recomputed digests
  review_plan:
    coordinator_prior: Archives are expected to be internally consistent and honestly
      recorded; the intake's main weakness is expected to be limited proposal metadata
      and unverified 600-second-cap compliance. No hash mismatches are expected. A
      finding against this prior is more informative than confirmation.
    joints:
    - joint: J1
      assigned_to: TASK-20260905-2c383f
      attack_plan: Recompute sha256 of every bound artifact from the working tree
        and compare to recorded digests; also scan for unbound extra files.
    - joint: J2
      assigned_to: TASK-20260905-2c383f
      attack_plan: Check each design-intake obligation against the three delivered
        files; name file and obligation for any gap.
    - joint: J3
      assigned_to: TASK-20260905-2c383f
      attack_plan: Cross-check report claims against artifacts in both directions.
    - joint: J4
      assigned_to: TASK-20260905-2c383f
      attack_plan: Read observer.json without the decision's framing, then compare
        to DEC-20260905-293536's characterization.
    blindness:
      single_reviewer: true
      lifted_for: []
    blind_rederivation:
      blind_from: all recorded digest values in the three batches' release and archive
        records
      what: J1 recomputes every artifact digest directly from file bytes
    proves_too_much_control: J1 method applied to the known-good BATCH-cef2eb delivery
      set; an all-flags or no-flags outcome is miscalibration and must be reported.
    claim_under_review: Historical administrative integrity of existing launch archives;
      no scientific claim
    proves_too_much:
      objects:
      - object: Known-good BATCH-cef2eb delivery set
        attack_plan: J1 method applied to the known-good BATCH-cef2eb delivery set;
          an all-flags or no-flags outcome is miscalibration and must be reported.
      failure_signature: An all-flags or no-flags outcome is miscalibration and must
        be reported.
