# Schema-only replacement for the immutable, snapshot-bound hypothesis.
# It adds the canonical scalar question_id alongside the original semantics.
hypothesis:
  id: H-SSI-125654
  title: Source-EndRing routing and collision loops for random-walk endpoints
  area: SSI
  question_id: RQ-SSI-1946c9
  idea_id: IDEA-20261007-7625cc
  status: proposed
  statement: >-
    For the exact bare-curve EndRing challenge distribution and fixed small ell,
    there may exist a polynomial Route(E,B,y) accepting every complete
    evaluable basis B of End(E) and returning a bounded path to an honest
    random-walk endpoint; oracle access to relation inversion may also yield
    enough collision loops to reconstruct a complete evaluable basis. Neither
    conjunct is established.
  mechanism: >-
    Use the source ring basis to route to a public endpoint. For extraction,
    compose a known sampled path with the dual of an inverter-returned path,
    then generate and saturate the order of the resulting source endomorphisms.
  predictions:
    - Route remains polynomial after every GL_4(Z) basis change.
    - Collision loops span rank four and saturate End(E) with an explicit bound.
    - Any global smaller routing witness either reconstructs the ring or refutes necessity.
  falsification_criteria:
    - Route needs undeclared endpoint or alignment data.
    - A smaller witness routes all endpoints without reconstructing the complete ring.
    - An inverter can return paths whose loops give no rank-four or saturation information.
  test_boundary: Zero-run proof search only; no PKE or security theorem.
  proof_search_map: coordination/design/TASK-20261007-d54864/tasks/TASK-20261007-61dd3f/proof-search-map.yaml
  scientific_runs: 0
  created_at: '2026-10-07'
  producer_task_id: TASK-20261007-61dd3f
