  title: Unoriented torsion-transport kernel interface
  area: SSI
  question_id: RQ-SSI-1946c9
  goal_id: GOAL-SSI-2fa82a
  status: proposed
  class: trapdoor-interface-typed-obstruction
  claim: >-
    Test whether a public pointed torsion-transport transcript of a smooth
    cyclic isogeny admits inversion from every complete evaluable End(E) basis;
    this packet records a typed obstruction at that inverse.
  mechanism: >-
    Publicly sample a kernel generator and torsion basis from bare E, publish
    the quotient curve and transported torsion points, and attempt to compile
    an arbitrary complete ring basis to a torsion-attack-suitable endomorphism.
  novelty_status: unverified
  novelty_note: >-
    Likely Seta-family overlap is visible only from an internal pointer; the
    primary paper was not read and distinctness is not established.
  prior_art:
    frontier_map: not_applicable
