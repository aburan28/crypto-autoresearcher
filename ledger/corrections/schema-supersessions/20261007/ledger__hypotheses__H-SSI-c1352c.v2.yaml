# Schema-only replacement for the immutable, snapshot-bound hypothesis.
# It adds the canonical scalar question_id alongside the original semantics.
hypothesis:
  id: H-SSI-c1352c
  title: Any-basis inversion of an unoriented torsion-transport transcript
  area: SSI
  question_id: RQ-SSI-1946c9
  idea_id: IDEA-20261007-c5a097
  status: proposed
  statement: >-
    For the declared UTTK distribution, every complete evaluable basis of
    End(E) can be compiled in polynomial time to data that recovers the sampled
    isogeny kernel from its pointed torsion-transport transcript.
  mechanism: >-
    Derive an attack-suitable non-scalar endomorphism from an arbitrary basis
    and use it with transported torsion to recover the cyclic kernel.
  predictions:
    - A basis-change-invariant compiler exists with polynomial bounds.
    - Kernel recovery succeeds for every supported curve, basis and transcript.
    - A smaller endomorphism witness either fails or reconstructs the complete ring.
  falsification_criteria:
    - The compiler works only for planted or reduced bases.
    - Required endomorphism search or degree is superpolynomial.
    - A one-endomorphism witness preserves inversion without ring reconstruction.
    - The cited attack does not cover the exact distribution or encoding.
  test_boundary: Zero-run definition and proof audit only.
  proof_search_map: coordination/design/TASK-20261007-d54864/tasks/TASK-20261007-6f5135/proof-search-map.yaml
  scientific_runs: 0
  created_at: '2026-10-07'
  created_by: TASK-20261007-6f5135
