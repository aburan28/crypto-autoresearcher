# Schema-only replacement for the immutable, snapshot-bound hypothesis.
# The original used `hypothesis` as a scalar field instead of a wrapper; that
# scalar is represented below as the canonical `statement` field.
hypothesis:
  id: H-SSI-2c8bba
  title: Selector-robust saturation is not implied by ordinary RWER success
  area: SSI
  question_id: RQ-SSI-1946c9
  idea_id: IDEA-20261007-0024cc
  status: proposed
  added: '2026-10-07'
  statement: >-
    In the exact endpoint-preimage RWER syntax without public binding, ordinary
    relation-inversion success does not imply any positive uniform probability
    of extracting non-scalar independent loops that saturate End(E), and the
    minimal selected-message mask adapter does not supply a correctly directed
    attacker-to-inverter compiler.
  mechanism: >-
    Public validity constrains only endpoints. A deterministic selector can
    correlate outputs while saturation depends on hidden sampled walks.
    Fiber-dependent masking breaks decryption through arbitrary inverses;
    fiber-constant masking lacks a decision-to-search proof.
  predictions:
    - The claimed selector-robust saturation lower bound derivable from ordinary success is zero.
    - Arbitrary valid inverse outputs need not preserve a fiber-dependent mask.
    - Every-basis routing remains undefined after a generic basis change.
  falsification_criteria:
    - Prove a public binding mechanism with every-basis inversion.
    - Prove selector-robust maximal-order saturation with a positive bound.
    - Give a selected-message attacker-to-interface reduction with explicit accounting.
  test_boundary: >-
    Zero-run symbolic audit of the explicit endpoint-relation syntax only; no
    claim about richer interfaces or all EndRing-based PKE.
  scientific_runs: 0
  later_review_boundary: >-
    Fresh review did not validate epsilon^q*u_I or a concrete zero-infimum
    theorem; the archived final evidence weakens those conclusions to no
    derived positive bound.
