# Schema-only replacement for the immutable, snapshot-bound proposal record.
# The original used `proposal` rather than the canonical `idea` wrapper.
idea:
  id: IDEA-20261007-7625cc
  title: Random-walk endpoint routing as an EndRing trapdoor interface
  area: SSI
  question_id: RQ-SSI-1946c9
  goal_id: GOAL-SSI-2fa82a
  status: proposed
  class: trapdoor-interface-typed-obstruction
  claim: >-
    Test whether the endpoint relation of a publicly sampled constant-degree
    supersingular isogeny walk can be inverted in polynomial time from every
    complete evaluable basis of the source endomorphism ring, and whether a
    relation inverter can reconstruct that complete ring. Neither algorithm is
    asserted to exist.
  mechanism: >-
    From bare E, sample and encode an ell-isogeny walk and map it to a canonical
    endpoint. A desired Route(E,B,y) accepts any full evaluable End(E) basis and
    returns any path to y. Collision loops formed from sampled and returned
    paths would then need to generate and saturate the complete order.
  novelty_status: unverified
  novelty_note: Primary papers were not read in this task.
  prior_art:
    frontier_map: not_applicable
    not_applicable_reason: >-
      This is a trapdoor-interface proof-search proposal, not an ECDLP attack
      or exponent-frontier claim.
    rows_checked: []
    nearest:
      - ref: KN-LIT-6572
        provenance: internal
        relation: adjacent
        delta: Replaces torsion-transport data with a public random-walk endpoint relation; no advantage or novelty is established.
      - ref: KN-LIT-6628
        provenance: internal
        relation: adjacent
        delta: Uses no auxiliary-point hidden-isogeny interface, but leaves source-ring routing undefined.
      - ref: KN-LIT-827
        provenance: internal
        relation: adjacent
        delta: Audits an endpoint-relation trapdoor rather than a completed key-updatable PKE.
      - ref: KN-LIT-1260
        provenance: internal
        relation: adjacent
        delta: Uses no LIT diagram and makes no PKE claim.
  predictions:
    - Public Sample and Eval require only the bare curve and public walk data.
    - A qualifying Route is invariant under arbitrary GL_4(Z) basis changes.
    - Collision loops generate and saturate End(E) with an explicit polynomial bound.
  minimal_test: >-
    Write Route(E,B,y) without endpoint-ring, orientation, planted-basis or
    routing-table oracles, then prove arbitrary-basis invariance.
  controls:
    - CEST/RWCT provenance-versus-necessity regression
    - edge/dual-edge scalar collision
    - leaked full path and arbitrary basis change
  falsification_conditions:
    - Route requires undeclared endpoint or alignment data.
    - A smaller witness routes all endpoints without reconstructing the complete ring.
    - Collision loops do not yield rank-four maximal-order saturation with the claimed probability.
  heuristic_assumptions:
    - collision_loop_generation
    - source_ring_routing
  proof_search_map: coordination/design/TASK-20261007-d54864/tasks/TASK-20261007-61dd3f/proof-search-map.yaml
  scientific_runs: 0
  producer_task_id: TASK-20261007-61dd3f
