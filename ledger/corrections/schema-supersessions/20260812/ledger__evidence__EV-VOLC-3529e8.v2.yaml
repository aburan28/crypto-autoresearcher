  observations:
    - >-
      SR1_VELU_GATE (Velu-2 volcano reconstruction on p=4001, t=30) PASSED
      and is independently, exhaustively re-derived by the Validator from a
      wholly separate implementation (own point-search, own Velu-2 image
      formula re-derived from first principles rather than copied, own
      isomorphism-class canonicalizer, own tree-center algorithm),
      cross-validated against the classical weight-2 modular polynomial
      Phi_2(j,j')=0 mod p as an independent isogeny-existence certificate
      (VAL-20260811-31690a, check V1). The FIXED Velu-2 formula
      (v=3x0^2+a, no doubling at a 2-torsion self-paired point) is
      CONFIRMED correct, not merely numerically matching: this discharges
      the doubled-v_Q defect fix the run's own protocol_deviations
      disclose. The Validator additionally found (bonus context, not a
      defect against C-VELU-GATE) that the 138-curve class decomposes into
      3 disjoint 46-curve trees under pure 2-isogeny (D_0=-59, 2 inert),
      whose aggregate level histogram matches the run's reported
      {0:3,1:9,2:18,3:36,4:72} exactly.
    - >-
      SR2_FAMILY_GATE numbers (N=19507: 59 candidates, 51 at f=1, 7 at f=3,
      1 at f=107) are independently re-derived by the Validator over a
      wider trace range than the Executor scanned (a superset check),
      reproducing the Executor's and MATCHED-ORDER-DESIGN.md's committed
      numbers digit for digit, including #E(F_p)=19507 for the specific
      t=211,p=19717 class (VAL-20260811-31690a, check V2).
    - >-
      CORRECTED ROOT-CAUSE DIAGNOSIS FOR SR5/T5/T1-TRANSPORT (the most
      important content of this record). The run's own terminal state is
      UNCHANGED: SR5 (per-level vertex counts), T5 (both branches and
      verdict), and C-TRANSPORT-CERT (T1) all remain UNREACHED in
      RUN-VOLC-sr1-sr5-plus-t5-gate-v3, because gcd(N,3)=gcd(N,107)=1 means
      no curve in either conductor-arm class (f=3 or f=107) carries an
      F_p-rational POINT of the relevant order, and harness/isogeny_class.py
      implements only point-based Velu construction. What CHANGES, per
      CORR-20260810-4a8bc6 in this same archive, is the diagnosis of WHY:
      this Coordinator's own prior snapshot-commit framing (a72f28b1e,
      "genuine design tension in MATCHED-ORDER-DESIGN.md") OVERREACHED and
      is corrected there. The Validator independently derived, by two
      methods (a general algebraic argument from local CM-order theory: 107
      is inert and unramified in O_K=Z[(1+sqrt(-3))/2] and exactly divides
      the conductor to the first power, forcing Frobenius to act as a
      scalar at the crater and as a genuine Jordan block at the floor; and
      an executable toy-analog numerical confirmation at D_0=-3, ell=5,
      p=19 via 5-division-polynomial factorisation over GF(19)) that a
      Frobenius-RATIONAL KERNEL (not a rational point) EXISTS for the
      crater<->floor 107-isogeny on this exact class -- at the crater, all
      108 order-107 subgroups are individually rational; at each floor
      vertex, exactly 1 of 108 is rational. This Coordinator independently
      re-derived the same conclusion by a separate method before accepting
      the correction (see CORR-20260810-4a8bc6). The correct diagnosis is
      "wrong tool (harness/isogeny_class.py has no
      Frobenius-eigenspace/kernel-polynomial construction path), not wrong
      design, and not a mathematical impossibility." This does not promote
      SR5/T5/T1-transport in this run, which remain correctly UNREACHED; it
      corrects only the interpretation of why.
    - >-
      SR4 NARRATIVE DISCREPANCY (a report-text inaccuracy, not a
      data-correctness issue). execution_report.md and implementation.md
      both assert that "a plain pooled (non-split-aware) statistic never
      fires on either null class." The Validator's direct recomputation
      from matched-null-verdict.json's own raw cell data (the SAME artifact
      both documents cite as their source) found this claim FALSE: the
      pooled_over_dispersion_NOT_split_aware field reads "over-dispersed"
      on 2 of 48 cells for the f=3-sized null and on 4 of 48 cells for the
      f=107-sized null (VAL-20260811-31690a, check "V4-additional-finding").
      This does not change SR4's own gate verdict field
      (NULL_FIRES_OVERDISPERSION_DETECTED for both null instances,
      independently confirmed accurate) and does not affect run
      admissibility or any SR1/SR2/SR3/SR5/T5/transport finding; it is
      recorded here, per the handoff, as a report-text inaccuracy citing
      the Validator's own figures, without this Coordinator re-deriving the
      exact fire count.
    - >-
      Two implementation defects (SR4 pooled-not-split-aware statistic;
      module-global SEEDS/TARGET_COUNTS not overridden in
      measure_curve_all_arms) were disclosed by the Executor, independently
      confirmed against the actual harness source, and their fixes
      confirmed correct by the Validator (check V4); the two superseded run
      ids (RUN-VOLC-sr1-sr5-plus-t5-gate, -v2) remain immutable in the
      ledger with accurate SUPERSEDED.md markers, independently verified
      present at the reviewed snapshot.

  inference: >-
    This run is a bounded, honest, incomplete terminal state on the level
    (SR5/T5/T1-transport) axis, with SR1-SR4 fully measured and validated.
    Direction is neutral: no level-invariance or T5 verdict was reached in
    either direction on any arm. Strength reflects the exhaustiveness and
    independence of validation on everything that WAS measured (SR1-SR4,
    the defect fixes, the artifact/commit integrity), plus the two
    corrections this record documents (the kernel-exists root-cause
    diagnosis and the SR4 narrative inaccuracy) -- not a claim about
    level-invariance itself.

  boundaries:
    - >-
      Toy scale only: p=4001 (SR1 gate) and N=19507/p up to 19717
      (SR2-SR4). claim_tier: toy, sota_delta: 0. No ECDLP claim in either
      direction. The kernel-exists correction is a CM-theory/tooling
      finding about local Frobenius structure at a conductor prime, NOT an
      attack result, and must not be read as one: it establishes existence
      of a mathematical object, not a working construction, a cost
      estimate, or any advantage over any baseline.
    - >-
      Existence of a rational kernel polynomial is necessary but not
      established here to be operationally sufficient for T1/T5's actual
      transport needs; the Validator's own report labels the
      T1-sufficiency and T5 hub-and-spoke predictions as ITS OWN derived,
      falsifiable claims, not as something this run measured, and this
      evidence record does not promote them either.
    - >-
      Building a kernel-polynomial/eigenspace construction method for the
      vertical, conductor-prime case into harness/isogeny_class.py (or a
      sibling module) is real engineering work with its own risk (the
      horizontal case demonstrated separately by
      tools/isogeny_class_screen.py does not simply transfer) -- named as
      N18 in this archive's next_action, NOT approved, NOT contracted, and
      NOT assumed trivial by this evidence record.
    - >-
      Review-independence limits: this review (review-adversarial,
      resolved_model: claude-sonnet-5, fallback_used: false) and the
      reviewed producer session and this Coordinator's own prior
      snapshot-commit synthesis all resolve to models on the SAME backend
      under this harness (only one usable backend currently configured).
      "Independent" here means independent context and a fresh
      from-scratch reading and re-derivation, not independent judgement
      from a genuinely different model family.

  unresolved_confounds:
    - >-
      Whether an actual ell=107 kernel-polynomial construction, if
      implemented, reproduces the toy-analog's hub-and-spoke prediction
