    - >-
      THAT THE IDEAL IS THE RIGHT ONE. R6 re-derived cardinality 43, maximal
      degree 2, proper ideal and quotient dimension 3 from the UPSTREAM instance
      through its own parser, its own emitter and its own verification, and
      proved 43 and 2 order-independent for this instance. The previous
      corroboration -- two engines agreeing on 43 -- read two files from ONE
      converter and could not have caught a dropped equation. This can, and did
      not.
    - >-
      THAT THE MEMORY LIMIT IS A RESIDENT-SET LIMIT, FOR NON-FORKING CHILDREN.
      `Max address space unlimited` read from a live child; a 12 GiB resident hog
      killed at the declared 8 GiB; a 64 GiB PROT_NONE reserver surviving;
      watchdog peak agreeing with external VmHWM to 0.16% on the Groebner row.
    - >-
      THAT THE REDUCTION MOVED NO NUMBER AND REPORTS WHAT IT CANNOT EVALUATE.
      186/186 cells identical, the four l = 6 ratios four distinct correct
      values, and all four deletion controls reporting `holds: null` with an
      explicit unevaluable list.
    - >-
      THAT THE ENVIRONMENT PROBE IS FIXED, measured on both sides of the defect
      under one controlled launch: the frozen body blocks and returns
      `unavailable` at 60.06 s, the repaired body returns `Singular 4.3.2` in
      0.008 s.
    - >-
      THAT THE ACCEPTANCE PROCEDURE CAN TELL A REPAIRED TREE FROM AN UNREPAIRED
      ONE. Proves-too-much object 1 discriminates: every criterion that must
      fail on the frozen tree fails, in the way its defect predicts.

  what_is_explicitly_not_accepted:
    - id: N-1
      what: THE WALL-CLOCK CHANNEL, at these bytes, for any comparative use.
      why: >-
        The accepted Runner polls in 0.25 s sleeps, so `wall_s` for a child
        faster than one poll is a poll boundary and not a duration -- 0.2515 s
        recorded for a SAT invocation the frozen run timed at roughly a fiftieth
        of that. Every wall RATIO between two fast children is driven toward 1
        regardless of engine, and the row contract's comparative predictions ARE
        wall ratios. No acceptance criterion could see this: A2 checks that a
        49-second Groebner wall lands in [30, 120], which a quarter-second
        quantum cannot perturb.
      status_of_the_fix: >-
        Amendment D6 (commit e1728d8a8, `p.wait()` in place of the sleep)
        postdates the certified run and is recorded UNACCEPTED
        (CORR-20260916-d51133 as corrected by CORR-20260916-33068f). It is not
        part of what this decision accepts, and the CURRENT
        experiments/EXP-ICPERF-e21835/code/bench.py is NOT the accepted bytes.
      consequence: AP-6 above, and next action NA-1.
    - id: N-2
      what: C-BYTE's per-hunk attribution clause, WHICH FAILED AS WRITTEN.
      why: >-
        5 of 13 bench.py hunks draw lines from two or three of D1-D5. Line-level
        attribution is complete with zero unattributable lines, which is the
        substance the clause was protecting.
      what_this_decision_does_not_do: >-
        IT DOES NOT AMEND THE CLAUSE. A criterion rewritten to match the
        measurement that failed it has stopped being a criterion. The reviewer's
        proposal -- state it at line granularity, or accept mixed hunks
        explicitly -- is recorded as next action NA-2 for a successor contract,
        where it will apply prospectively to code nobody has written yet.
    - id: N-3
      what: >-
        A4 AT THE CONTRACT'S OWN VOCABULARY, and the label
        `PASS_WITH_DECLARED_DEVIATION` that stood in for it.
      why: >-
        Direction (i) of the watchdog null-object control ran at a scaled 2 GiB
        limit against a 4 GiB target, for a reason recorded before the run
        (MemAvailable was 6.45 GiB with no swap, so the kernel OOM killer would
        have fired before the watchdog). That is a sound MECHANISM test and it is
        not the declared criterion. R5 is right that the contract's vocabulary is
        PASS / FAIL / NOT_EVALUABLE and admits no fourth value, and the invented
        label is withdrawn: at the contract's vocabulary A4 is NOT_EVALUABLE from
        the run's own artifacts. What closes it is INDEPENDENT: R2 ran both
        directions itself at the full declared 8 GiB. The distinction is worth
        the words -- the producer did not evaluate the criterion, and a reviewer
        did.
    - id: N-4
      what: THE MEMORY LIMIT FOR A FORKING ENGINE.
      why: >-
        `pgid_rss_kb` sums copy-on-write-shared anonymous pages once per process,
        demonstrated at roughly 2 GiB reported for one 1 GiB mapping. Macaulay2
        threads rather than forks, so the run's own agreement with VmHWM is real
        for this engine and says nothing about a driver that forks per subtask.
        The joint's wording ("does not double count threads or shared pages") is
        half false; threads are fine.
      consequence: next action NA-3.
    - id: N-5
      what: ANYTHING ABOUT INDEX CALCULUS.
      why: >-
        No relation found, no point decomposed, no discrete log solved, no curve
        attacked. The Groebner COLUMN of the RQ-ICPERF-94c86e boundary table is
        declared MEASURABLE at (15, 5) on this host; it is not declared MEASURED,
        and l = 6 remains unknown and expected censored. A measurable column is
        an empty column with an instrument behind it.

