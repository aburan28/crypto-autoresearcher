  what_is_accepted:
    - >-
      THE GROEBNER CHANNEL, END TO END. The repaired converter emits a script
      Macaulay2 parses without error; its RESULT line matches the regex the
      accepted bench.py actually uses; and the harness row carries a non-null
      basis size, engine CPU time and maximal degree. R1 measured the whole
