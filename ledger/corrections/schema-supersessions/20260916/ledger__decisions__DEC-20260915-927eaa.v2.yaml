  decision: >-
    THE REPAIRED ICPERF INSTRUMENT IS ACCEPTED FOR THE GROEBNER, CPU-SECOND,
    PEAK-RSS AND SAT-STATUS CHANNELS AT (n, l) = (15, 5) ON THIS HOST, AT THE
    BYTES RUN-ICPERF-a4a24b MEASURED -- AND ITS WALL-CLOCK CHANNEL IS NOT
    ACCEPTED FOR ANY COMPARATIVE USE AT THOSE BYTES. EXP-ICPERF-e21835 moves
    from `completed` to `analyzed`. AP-1 of EXP-ICPERF-13f001 is DISCHARGED for
    the accepted channels and a new precondition is owed for the wall channel.
    No hypothesis moves, no column of the boundary table moves, and nothing is
    promoted to the knowledge corpus.
  decision_label: accept_scoped

  context: >-
    BATCH-a33cda existed because RUN-ICPERF-305ca3 spent an eight-hour executor
    budget and returned a ZERO Groebner column for two independent instrument
    reasons, and its own summary reported three predictions as holding that were
    partly unevaluated. A producer's self-check caught neither. The batch built a
    repair (EXP-ICPERF-e21835), ran it across two epochs (RUN-ICPERF-a4a24b,
    interrupted at epoch 1 by a model billing quota and resumed under an additive
    inference amendment), and put it in front of two independently launched
    validators under a plan written before the executor was dispatched.

    The reason care was warranted is the reason it is still warranted: the
    Coordinator wrote the frozen tree's four files and therefore wrote three of
    the four defects under repair. That concentration is disclosed in the plan as
    this round's principal weakness and is why joint R6 -- a re-derivation of the
    load-bearing quantity from the upstream instance by an agent forbidden to read
    the converter -- exists at all.

