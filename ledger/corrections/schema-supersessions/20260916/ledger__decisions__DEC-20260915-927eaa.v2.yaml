  rationale: >-
    THE ROUND DID WHAT IT WAS SET UP TO DO, AND THE JOINT THAT MATTERED MOST IS
    THE ONE THAT HELD. The whole acceptance turns on one question: does the
    repaired converter compute the RIGHT ideal, or does it compute some ideal
    consistently? Two engines agreeing on 43 could not answer it, because both
    read files from one converter. R6 answered it from the upstream instance,
    through a parser, an emitter, a verifier and a Buchberger implementation that
    share no code with the producer, and arrived at the same four values -- with
    the quotient dimension, the one value nobody leaked, settled by brute force
    over 2^15 assignments using no Groebner engine at all. It also proved that 43
    and 2 are forced in every monomial order for this instance, which upgrades
    the agreement from a coincidence of two implementations to a property of the
    ideal. That is why the acceptance is an acceptance.

    IT IS SCOPED BECAUSE THREE THINGS DID NOT HOLD, and each is named above
    rather than folded into a qualifier. The wall channel is unfit at these bytes
    and no acceptance criterion could have seen it -- an instrument that reports
    0.2515 s for two different fast solvers would have returned "no engine is
    faster than any other" as a measurement, and the row contract's predictions
    are exactly those ratios. C-BYTE failed as written, and rewriting the clause
    to match what passed would destroy the clause. Custody broke three times, and
    only one of those is inside the run.

    THE PRIORS ARE WHERE THIS ROUND EARNED ITS COST. Six of them are refuted in
    writing, including the two the Coordinator was most confident about: that R5
    would be the least informative joint (it is the only one that breaks), and
    that 156 was an authoring slip (it is a real value the contract cites the
    wrong file for). One refutation is about the review protocol itself -- the
    document written to protect R6's blind was the first thing to break it -- and
    that is the finding this batch will be remembered for. None of those would
    have been recoverable if the priors had been written after the reports
    returned.

    WHAT I AM NOT DOING, deliberately. Not promoting anything to the corpus: the
    one real candidate, R6's order-independence lemma, arrived inside a review
    report and has not been stated as a standalone claim or read by anyone who
    did not just write it. Not amending the frozen contract's defective A5 and A6
    statements by edit: they are superseded by record. Not approving
    EXP-ICPERF-13f001: AP-1 is discharged for the accepted channels and four
    preconditions remain open, one of them created here. Not treating the quota
    interruption or any censored engine run as evidence about anything
    mathematical.

  next_actions:
    - id: NA-1
      priority: 1
      action: >-
        Accept or reject amendment D6 on the evidence of a measurement. Run the
