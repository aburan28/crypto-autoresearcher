coordinator_decision:
  id: DEC-20260907-f2c2e5
  date: '2026-09-07'
  coordinator: coordinator-a5f766-run (opencode session, in-process; subagent coordinator runtime cancelled once this session)
  area: ECDLP
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-06d612
  title: >-
    Classify RUN-ECDLP-a5f766-001 as failed_infrastructure and authorize exactly
    one corrected repair run RUN-ECDLP-a5f766-002 under the unchanged frozen
    v2 science.
  context: >-
    EXP-ECDLP-a5f766 v2 (approved-contract-v2.yaml, sha256 a81b1476...,
    DEC-20260906-ea2ea4) was dispatched under TASK-20260906-b7628e via
    execution queue BATCH-06d612. The first attempt RUN-ECDLP-a5f766-001
    completed stages 1-2 (contract hash verified; eligibility and symbolic
    certificate stages finished in 0.39 s) and then crashed in stage 3 with an
    unhandled StopIteration in the C/G collision-pairing orchestration loop
    (nested at the wrong level; searched for G rows before they were
    produced). No scientific stage failed; no expected identity failed; no
    stop rule of mathematical content fired.
  classification: >-
    failed_infrastructure (implementation crash) per agents/executor.md and
    core rule 5: not evidence against the hypothesis, excluded from every
    metric. The crashed run is preserved immutably with a terminal receipt
    (runs/RUN-ECDLP-a5f766-001/manifest.json) and a frozen source snapshot
    (runs/RUN-ECDLP-a5f766-001/source-snapshot/).
  decision: >-
    Authorize exactly one repair run, RUN-ECDLP-a5f766-002, executing the
    identical frozen scientific protocol (no change to any prediction,
    control, grid, metric, stop rule, or invalidation rule) with the corrected
    stage-3 orchestration. This is the design.md-contemplated path: "There is
    one planned execution with no automatic reruns; a corrected implementation
    requires a fresh immutable run." The rerun is Coordinator-authorized, not
    automatic, and is recorded here before execution.
  budget_ruling: >-
    The contract's maximum_runs: 1 ceiling was consumed by the crashed
    attempt. This decision authorizes one additional immutable run solely as
    an infrastructure repair, within the unchanged per-run ceilings (1200 s
    wall, 2 GiB nominal, 1 worker, same stage budgets) and the unchanged total
    cpu envelope (0.334 h; ~0.4 s consumed so far). No scientific budget is
    increased. The additive amendment record is
    experiments/EXP-ECDLP-a5f766/amendments/run2-repair-authorization.yaml;
    the frozen contract file itself is not edited.
  authorization: >-
    Standing user authorization 2026-09-06 ("all is approved.
    ideas/experiments should be always approved", AGENTS.md) plus the explicit
    user direction 2026-09-07 to execute EXP-ECDLP-a5f766. No protocol
    content changed, so no re-approval of science is required or claimed.
  evidence_refs:
    - experiments/EXP-ECDLP-a5f766/execution/TASK-20260906-b7628e/runs/RUN-ECDLP-a5f766-001/manifest.json
    - experiments/EXP-ECDLP-a5f766/execution/TASK-20260906-b7628e/runs/RUN-ECDLP-a5f766-001/stderr.log
    - experiments/EXP-ECDLP-a5f766/execution/TASK-20260906-b7628e/runs/RUN-ECDLP-a5f766-001/stdout.log
  scope_limits: >-
    This decision changes no hypothesis or experiment status, promotes
    nothing, and does not interpret any observation. The independent review
    round scheduled in BATCH-06d612 (validator TASK-20260907-f9d7ef, red-team
    TASK-20260907-6180fe, gated on a committed review_plan) still governs any
    claim.
  status_change: none
