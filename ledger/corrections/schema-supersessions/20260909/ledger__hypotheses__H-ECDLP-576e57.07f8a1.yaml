hypothesis:
  id: H-ECDLP-576e57
  kind: hypothesis
  status: proposed
  title: Deterministic scope-to-coverage reconciliation for ledger negative conclusions
  source_idea:
    id: IDEA-20260815-024cf2
    provenance: internal
  claim:
    exact: A source-bound ledger corpus can classify eligible scoped-negative statements
      as clean, overbroad, unauditable, or inconclusive using a deterministic typed
      comparison of the statement scope and its uniquely resolved cited-artifact coverage,
      without making missing provenance or untyped prose into an overbreadth finding.
    class: control-plane record-integrity hypothesis
    asserts_not:
    - ECDLP weakness
    - mathematical validity
    - run correctness
    - scientific conclusion
  mechanism: An absolute root-level statement grammar accounts for unsupported shapes
    as exclusions. Normalized sets, intervals, and canonical JSON vectors compare
    only under declared relations; prose and missingness route conservatively. Non-duplication
    from the JINV L3 audit requires a unique immutable, hash-verified comparison envelope
    for the same statement and artifacts.
  predictions:
    controls:
    - identical typed vectors classify clean
    - a widened target-family set classifies overbroad
    - a missing binding classifies unauditable, never overbroad
    - untyped or marked prose generalization classifies inconclusive
    falsification:
    - any prescribed control takes another disposition
    - an unsupported negative shape disappears without exclusion accounting
    - an L3-linked row or an unbound comparison envelope establishes non-duplication
  minimal_discriminating_experiment: EXP-ECDLP-df24c3
  limits:
  - clean is not validation of a cited run or a negative scientific result
  - overbroad is a record-level finding only
  - no corpus outcome, cost, or implementation result exists at proposal time
  approval:
    approved_by: DEC-20260909-003602
    implementation_authorized: false
    scientific_execution_authorized: false
  provenance:
    reviewed_design: coordination/design/BATCH-261772/reviews/TASK-20260909-323f93/review.yaml
    review_verdict: holds for constructible_comparison_hash_envelope_v4 only
