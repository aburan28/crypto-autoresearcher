# DEC-20261016-5d2fb8 -- evidence review of EXP-SEMBIN-7c8e98 / RUN-SEMBIN-9ecb77.
# Run set invalid as evidence (unsound, target-blind closure instrument plus
# incomplete manifest). Decision: refine. H-SEMBIN-371c51 status unchanged.
coordinator_decision:
  id: DEC-20261016-5d2fb8
  id_provenance: >-
    Random 6-hex token chosen by the coordinator subagent, which has no
    shell. Freedom was checked by repository-wide path-component and ledger
    content search (no occurrence of '5d2fb8'). The dispatching session must
    confirm it with `python3 tools/allocate_id.py --check
    DEC-20261016-5d2fb8` before the ledger archive.
  recorded_at: '2026-10-16'
  decided_at: '2026-10-16'
  decided_by: coordinator
  mode: evidence_review
  question_ids:
    - RQ-SEMBIN-fa2e3f
  goal_id: GOAL-SEMBIN-5078bc
  archived_by: null
  decision: refine
  decision_label: >-
    Set RUN-SEMBIN-9ecb77 aside as invalid evidence. Keep H-SEMBIN-371c51
    untested, with status unchanged. Commission a new versioned contract
    with a sound degree-capped closure and a satisfiable high-degree planted
    control.
  target_ids:
    - EXP-SEMBIN-7c8e98
    - RUN-SEMBIN-9ecb77
    - H-SEMBIN-371c51
    - IDEA-20261010-066c44
    - TASK-20261012-d17d69
  context: >-
    DEC-20261012-b4ec9c approved the frozen stage-0 contract
    EXP-SEMBIN-7c8e98: one chained S_3 system over F_32 with k = 2, and the
    prediction that refutation degree = 4. The executor ran the trial
    plan once this session; run.py and check.py exited 0. The run is not yet
    published or committed and has no run report. raw-result.json records
    selected_target 6, refutation_degree 1, planted_ok true and
    matrix_holds false.
  rationale:
    - >-
      Validity comes before interpretation. manifest.yaml is not
      schema-complete: run.id, status, code.commit, code.command,
      environment, inputs, timing and result are missing. command.txt,
      environment.json, stdout.log, stderr.log and execution-receipt.json
      are absent. The run is unpublished. An incomplete run set is not
      evidence.
    - >-
      Independently of packaging, the frozen driver's contains_one()
      truncates each generator and product to monomials of degree <= D
      instead of admitting only products of degree <= D. That is not an
      ideal consequence. Counterexample, derived by reading the code: the
      satisfiable x0*x1 + 1 = 0 is "refuted" at D = 1. Because S_3(u, x1,
      x2) has constant term 1 and no linear terms, the instrument returns
      degree 1 for every target in 1..31. The recorded value therefore says
      nothing about the selected system (EV-SEMBIN-3e91a7,
      O-instrument-defect).
    - >-
      check.py recomputes from the same run.py, so it cannot catch this.
      The planted controls contain no satisfiable equation with a monomial
      above the cap, so truncation passes them all.
    - >-
      The contract's literal falsification clause is not applied, because
      it presupposes a valid measurement. This is not a post-hoc change of
      criterion: the frozen contract is untouched, and the remedy is a new
      contract version frozen before execution. An implementation defect is
      infrastructure signal, never a negative mathematical result. weaken
      and reject_scoped are therefore unavailable.
    - >-
      Bias toward exponent-targeting work: the D_W-stays-4 question is the
      idea's route to polynomial-in-N attempts and remains decision-relevant
      at stage 0. A cheap corrected certificate is the right next step;
      dropping the lane is not.
  evidence_refs:
    - EV-SEMBIN-3e91a7
    - experiments/EXP-SEMBIN-7c8e98/runs/RUN-SEMBIN-9ecb77/raw-result.json
    - experiments/EXP-SEMBIN-7c8e98/runs/RUN-SEMBIN-9ecb77/manifest.yaml
    - experiments/EXP-SEMBIN-7c8e98/implementation/run.py
    - experiments/EXP-SEMBIN-7c8e98/specification.yaml
    - DEC-20261012-b4ec9c
  evidence_strength: inconclusive
  claim_tier: toy
  scoped_claim: >-
    None. On the one chained S_3 system over F_2[z]/(z^5+z^2+1) (k = 2,
    z = 6, cap 4), the frozen EXP-SEMBIN-7c8e98 driver did not measure the
    refutation degree. Its recorded value of 1 is an artifact of generator
    truncation.
  hypothesis_status:
    H-SEMBIN-371c51: unchanged (specified). No transition is made. The
      hypothesis record is immutable and is not edited.
  success_criterion_reading: >-
    No cost was measured, so there is no improvement over the
    index-calculus baseline. The gap to matched rho is not measured by this
    experiment. No cross-method comparison is made, so the §5a GAE band
    does not apply.
  limitations:
    - >-
      The instrument counterexample is derived, not executed (no shell in
      this subagent). Its reproduction line is in the decision report.
    - >-
      Only the closure routine was audited. build_system and the
      solution_count brute force were not independently re-derived.
    - >-
      The trial-plan source_sha256 values were not re-hashed in this review.
    - >-
      experiments/EXP-SEMBIN-7c8e98/analysis.md was not written, because
      the subagent harness refuses .md writes. The analysis lives in
      EV-SEMBIN-3e91a7 and in the review report's report.typ.
    - >-
      The decision report PDF and the SVG render were not produced or
      inspected here (no shell, no renderer). This is an open gap for the
      dispatching session.
    - >-
      One toy system. Nothing here concerns larger m, batch rates, exponents
      or deployed curves.
  next_actions:
    - >-
      Dispatching session (no new research state): run `python3
      tools/allocate_id.py --check EV-SEMBIN-3e91a7` and `--check
      DEC-20261016-5d2fb8`. Execute the counterexample reproduction line in
      the review report and record its output beside report.typ. Render
      graph.svg and report.pdf from
      experiments/EXP-SEMBIN-7c8e98/reports/review-DEC-20261016-5d2fb8/ and
      inspect them. Run tools/validate_ledger.py.
    - >-
      Executor, via a handoff minted by /coordinate: republish
      RUN-SEMBIN-9ecb77 through the run skill's publishing step with a
      schema-complete manifest (run.id, status, code.commit/command,
      environment, inputs, timing, result) and its companion artifacts. Mark
      the run invalid_instrument and cite this decision. Then run the
      snapshot archive TASK-20261012-c5a016 alone, followed by the ledger
      archive of EV-SEMBIN-3e91a7 and DEC-20261016-5d2fb8. Do not rerun
      the trial.
    - >-
      Design a new versioned contract via /design-experiment
      IDEA-20261010-066c44, superseding EXP-SEMBIN-7c8e98, with the same
      system, target order and cap 4. The closure must admit m*f only when
      deg(m) + deg(f) <= D, with no truncation, and must use Boolean field
      equations. The contract must add planted satisfiable controls with
      monomials above the cap (for example x0*x1 + 1 = 0, which must not
      refute at any D <= 4). It must add a checker that recomputes the
      closure with an independent implementation, and a blind re-derivation
      of the degree. Prediction degree = 4 is frozen before execution.
    - >-
      GOAL-SEMBIN-5078bc stays active, with one next action: the corrected
      closure-degree contract above.
  knowledge_promotion:
    promoted: []
    not_warranted: >-
      There is no durable research claim: the decision is refine on
      inconclusive evidence from an invalid run. The instrument lesson
      (truncating generators makes a degree-capped closure unsound) is a
      candidate KN-TECH only once the corrected contract's independent
