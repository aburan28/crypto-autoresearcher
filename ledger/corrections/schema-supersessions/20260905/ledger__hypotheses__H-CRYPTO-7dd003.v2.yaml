  heuristic_assumptions:
  - id: HEUR-RETR-1
    source_id_in_proposal: HEUR-RETR-1
    formal_statement: Recall on author-recorded references is indicative of recall on prior art the author
      did not know about.
    random_model_justification: NOT A RANDOM MODEL, and labelled as such rather than dressed as one. The
      parent proposal records its rigorous support as NONE and adds that the assumption is PROBABLY OPTIMISTIC,
      because a reference the author recorded is one the author already knew. That statement is preserved
      unchanged. The operative consequence, which the proposal states and which is binding here, is that
      the measured value is an UPPER BOUND and must be quoted as one wherever it appears.
    supporting_results: []
    supporting_results_note: EMPTY AND CORRECT. The parent proposal states plainly that there is no rigorous
      support. Populating this field would manufacture support the proposal declined to claim.
    validation_experiment_ids:
    - EXP-CRYPTO-79832d
    falsification_condition: 'The parent proposal offers no direct falsifier and instead binds the reporting:
      report the measured value as an upper bound and say so wherever the number is quoted. That reporting
      rule is carried into the contract as an invalidation rule, so a run that quotes the number without
      the bound is invalid. An INDIRECT falsifier is available and is added by the converting Coordinator
      rather than attributed to the proposal: if recall on the subset of pairs whose labelled entry was
      NOT in the proposal''s own source_refs at authoring time (where such pairs can be identified from
      git history) is substantially lower than on the rest, the optimism is measured rather than merely
      asserted.'
  structural_ingredients:
