hypothesis:
  id: H-CRYPTO-7dd003
  question_id: RQ-CRYPTO-001
  source_proposal: IDEA-20260807-fa706a
  derived_from_idea: IDEA-20260807-fa706a
  statement: 'SCOPE. A known-answer retrieval measurement over this repository''s own literature corpus
    and its own committed novelty screens. NO MATHEMATICAL CLAIM, NO SECURITY CLAIM, NO ECDLP CONTENT.
    The hypothesis has four conjuncts and each is separately falsifiable. (C1, CONSTRUCTIBILITY) A labelled
    set of at least 50 pairs (proposal, prior-art KN-LIT entry) is constructible from proposals whose
    source_refs already name a KN-LIT entry, where the prior art IS in the corpus and IS genuinely relevant.
    If fewer than 50 pairs can be built, the measurement is reported BLOCKED -- an infrastructure and
    coverage disposition, never a negative result about the screens. (C2, THE SCREENS ARE NOT CHANCE)
    Replaying each proposal''s own recorded novelty-screen terms against the corpus, with the labelled
    entry''s reference hidden, retrieves the labelled entry at a rate that EXCEEDS the random-entry null
    rate by a wide margin. This conjunct CAN FAIL, and its failure is the strongest possible finding:
    screens that retrieve at the chance rate mean every novelty_screen block in the corpus needs re-reading.
    (C3, RECALL IS LOW ENOUGH THAT RETRIEVAL IS THE BINDING CONSTRAINT) The measured recall of the recorded
    terms is below 0.5. This threshold is NOT invented here: it is the parent proposal''s own stated prior
    (0.55 probability that recall is below 0.5), pre-registered as a direction rather than as a requirement,
    and a measured recall AT OR ABOVE 0.5 is a clean negative that REDIRECTS effort from retrieval to
    corpus ACQUISITION. Both outcomes are deliverables and both are decidable. (C4, THE CHEAP FIX IS A
    FIX) A BM25 or embedding retrieval step over titles and abstracts, evaluated on the IDENTICAL labelled
    set, achieves a strictly higher recall than the recorded terms. A non-positive delta refutes the proposed
    remedy at the tested scope and is reported as such. C2 gates C3 and C4: if the screens retrieve at
    chance, no recall number in the package means anything.'
  mechanism: 'THE DEFECT, STATED AS A MEASUREMENT RATHER THAN A COMPLAINT. The literature corpus holds
    7,819 KN-LIT entries and the parent proposal reports 7,573 of them as referenced by no record under
    ledger/ or experiments/. A 400-entry random sample of the unreferenced set shows a broad and largely
    UNDIRECTED sweep -- MPC, blind signatures, FHE, hardware implementations, one hep-th Seiberg-Witten
    paper -- mixed with genuinely on-topic and uncited items such as algebraic modellings of the supersingular
    isogeny problem and the genus theory attack on the decisional Diffie-Hellman problem for class group
    actions. THE DEFECT IS NOT THE COUNT. It is that no relevance instrument exists over the corpus, so
    at novelty-screen time on-topic prior art is indistinguishable from off-topic bulk. 117 of 278 proposals
    carry a novelty_screen block; every one records greps and NONE records a recall measurement. So the
    instrument every novelty judgement in this program rests on has never been evaluated. ALL THOSE COUNTS
    ARE RELAYED FROM THE PARENT PROPOSAL AND ARE NOT EVIDENCE HERE. The experiment re-derives every one
    of them and reports its own numbers beside the relayed ones.

    THE MEASUREMENT. Build a labelled set of (proposal, prior-art entry) pairs where the prior art IS
    in the corpus and IS genuinely relevant, by taking proposals whose source_refs already name a KN-LIT
    entry, HIDING that reference, and asking whether the proposal''s own recorded grep terms would have
    retrieved it. That gives a measured RECALL for the screening method actually used, on cases where
    the right answer is known and is in the corpus. Report recall, and report the terms that failed. If
    recall is low, the cheap fix is not a better corpus but a better retrieval step: a BM25 or embedding
    index over titles and abstracts, evaluated on the SAME labelled set, reported as a recall delta.

    WHY THIS IS NOT A TAUTOLOGY, AND THE CHECK THAT MAKES IT NOT ONE. The labelled pairs are built from
    references the proposals themselves recorded, so one might expect the terms to find them trivially.
    They were not written to find them: the grep terms in a novelty_screen block were written to characterise
    a research area, and the source_refs were written separately, so the two are independent of the hiding
    procedure. High recall would therefore be a genuine and reassuring result rather than a tautology.
    What makes the number interpretable at all is the RANDOM-ENTRY NULL: for each proposal, measure the
    retrieval rate for a RANDOM corpus entry under the same terms. If recall does not substantially exceed
    that rate, the screens are retrieving by chance and the measured recall means nothing.

    THE TWO SECONDARY FORCED VALUES. A FORCED HIT: a pair whose entry title contains the proposal''s own
    primary keyword verbatim MUST be retrieved; a screen that misses it is broken. A FORCED MISS: an off-topic
    entry -- the hep-th Seiberg-Witten sample is a good one -- must NOT be retrieved. These are two different
    failure directions and a screen that fails both for the same reason is not responding to the terms
    it names.

    THE ONE-DIRECTIONAL BIAS, STATED BEFORE IT IS DISCOVERED. Recall measured this way is an UPPER BOUND
    on real-world recall, because the labelled set is built from references the proposals'' authors already
    knew about. That is the content of HEUR-RETR-1 below and it must be restated wherever the number is
    quoted. It follows that a LOW measured recall is the stronger result: a low upper bound bounds the
    true value, whereas a high upper bound bounds nothing.

    WHAT THIS CANNOT DO, AND IT IS THE HALF THAT MATTERS MOST. This measures recall against prior art
    ALREADY IN the corpus. It says NOTHING about prior art the corpus does not contain, which is the other
    and harder half of novelty, and it therefore validates NO novelty_status anywhere. The parent proposal
    puts its own probability that this validates any novelty_status at exactly 0.0, and that number is
    preserved here rather than softened.

    WHAT THIS IS NOT, RELATIVE TO THE ADJACENT OPEN PROBLEM. KN-OPEN-3f7a21 records that 7,457 of 7,666
    entries claim citation_verified against a source the program believed unreachable. That is a PROVENANCE
    failure -- an entry claiming to have been read. This hypothesis concerns RETRIEVAL -- an entry that
    exists, is correct, and is never surfaced. The two are different failures with different remedies
    and must not be merged.'
  assumptions:
  - That the grep terms recorded in a novelty_screen block are the exact queries used rather than a summary
    of them. WHERE THEY ARE A SUMMARY, THE FIDELITY MUST BE STATED PER PAIR, and pairs whose fidelity
    cannot be established are reported separately rather than pooled into the recall figure.
  - That a proposal's source_refs naming a KN-LIT entry indicates the entry is GENUINELY RELEVANT prior
    art for that proposal. Where a source_ref is incidental rather than prior art, the pair is dropped,
    and the drop rate is reported, because a labelled set built from incidental references measures something
    else.
  - That corpus titles and abstracts are of sufficient quality to be retrieved at all. Bulk-seeded entries
    with poor metadata suppress retrieval for reasons unrelated to the screen, so the metadata-completeness
    of every labelled entry is recorded and the recall figure is reported both pooled and split by metadata
    completeness.
  - That the counts relayed from the parent proposal (7,819 entries, 7,573 unreferenced, 117 of 278 proposals
    carrying a novelty_screen block) are RELAYED AND NOT EVIDENCE. The experiment re-derives each and
    reports its own number beside the relayed one.
  - That the labelled set can reach 50 pairs. If it cannot, the measurement is BLOCKED and reported as
    a coverage disposition, never as a negative result about the screens and never run underpowered.
