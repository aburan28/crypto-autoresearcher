      claiming citation_verified against a source the program believed unreachable. Named here to be DISCRIMINATED
      FROM, not relied on: that is a provenance failure, this is a retrieval failure.'
    citation: KN-OPEN-3f7a21
    provenance: recalled
    verified_by: null
    verified_by_note: NULL AND FLAGGED. Named in the parent proposal; not opened during this conversion.
