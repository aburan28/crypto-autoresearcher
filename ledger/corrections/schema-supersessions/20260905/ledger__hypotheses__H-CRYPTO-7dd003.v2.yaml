  reduction_chain:
    core_problem: Measure the recall of this program's recorded novelty-screen queries against prior art
      the corpus demonstrably contains, relative to a chance baseline, and measure whether a ranked retrieval
      step improves it on the same labelled set.
    corollaries: []
    corollaries_note: DELIBERATELY EMPTY. This measurement reduces to NOTHING about novelty. It cannot
      validate any novelty_status, cannot establish that any proposal is or is not novel, cannot establish
      what the external literature contains, and cannot establish anything about prior art the corpus
      does not hold -- which is the other and harder half of the novelty question. The parent proposal
      puts its own probability that this validates any novelty_status at exactly 0.0 and that number is
      preserved.
  predictions:
  - metric: 'G1 -- forced hit: retrieval of a labelled pair whose entry title contains the proposal''s
      own primary keyword verbatim'
    direction: higher
    minimum_effect: RETRIEVED, at every such pair. A screen that misses a verbatim title-keyword match
      is BROKEN and no recall number in the package is reportable.
  - metric: 'G2 -- forced miss: retrieval of a manifestly off-topic entry, the hep-th Seiberg-Witten sample
      or an equivalent, under the same terms'
    direction: lower
    minimum_effect: NOT RETRIEVED, at every such pair. A screen that retrieves a manifestly off-topic
      entry is a rubber stamp in the opposite direction and the recall number means nothing.
  - metric: 'G3 -- random-entry null: the retrieval rate for a uniformly random corpus entry under each
      proposal''s own terms, over at least 20 draws per proposal'
    direction: lower
    minimum_effect: 'SUBSTANTIALLY BELOW the measured recall. The pre-registered decision rule, fixed
      before any measurement: recall must exceed the null rate by at least a factor of 3 AND by at least
      0.20 in absolute terms. If it does not, the screens are retrieving by CHANCE, every novelty_screen
      block in the corpus needs re-reading, and no recall number is interpretable. This is the conjunct
      that gates every other one and it CAN fail.'
  - metric: G4 -- recall of the recorded terms on the labelled pairs
    direction: different
    minimum_effect: 'BELOW 0.5. THE THRESHOLD IS NOT INVENTED HERE: the parent proposal states its own
      prior as 0.55 probability that recall is below 0.5, and that is pre-registered as a DIRECTION, not
      as a requirement. Both outcomes are deliverables and both are decidable. Recall at or above 0.5
      means the screens work on prior art the corpus contains, novelty_status `unverified` is limited
      by the corpus''s COVERAGE rather than its retrieval, and effort is redirected to ACQUISITION --
      a clean negative for the proposal''s motivating complaint. Recall below 0.5 means novelty screens
      have been missing prior art already filed, and the fix is a retrieval index.'
  - metric: G5 -- recall delta from adding a BM25 or embedding retrieval step, measured on the IDENTICAL
      labelled set
    direction: higher
    minimum_effect: STRICTLY POSITIVE. A non-positive delta refutes the proposed remedy at the tested
      scope and must be reported as such rather than reported as an inconclusive tuning problem. The parent
      proposal's own prior is 0.75 that a BM25 index improves recall measurably.
  - metric: G6 -- size of the constructible labelled set
    direction: higher
    minimum_effect: AT LEAST 50 PAIRS. The parent proposal's prior is 0.9 that at least 50 are constructible.
      Below 50 the measurement is reported BLOCKED -- a coverage and infrastructure disposition, never
      a negative result about the screens and never run underpowered.
  - metric: 'G7 -- the corpus recount: number of KN-LIT entries, number unreferenced by any ledger or
      experiment record, and number of proposals carrying a novelty_screen block'
    direction: different
    minimum_effect: NO VALUE IS PRE-REGISTERED. The parent proposal's figures (7,819 / 7,573 / 117 of
      278) are RELAYED and were not re-derived during conversion; adopting them as predictions would launder
      a relayed number into a measurement. The run reports its own counts beside the relayed ones with
      the difference stated.
  test_boundary:
    instances:
    - Every committed proposal under ledger/proposals whose source_refs names at least one KN-LIT entry,
      from which the labelled pairs are drawn.
    - The committed KN-LIT corpus, read at a stated commit so that the denominator is fixed and reproducible.
    - At least 20 uniformly random corpus entries per proposal for the random-entry null, drawn under
      a declared seed.
    - At least one forced-hit pair and at least one forced-miss pair per proposal in the labelled set,
      constructed before any recall is computed.
    parameters:
      minimum_labelled_pairs: 50
      random_null_draws_per_proposal: 20
      null_margin_factor: 3
      null_margin_absolute: 0.2
      recall_direction_threshold: 0.5
      recall_threshold_provenance: the parent proposal's own honest_prior_of_survival, not a Coordinator
        invention
      corpus_commit: fixed at run time and recorded; the corpus grows and an unfixed denominator is not
        reproducible
      retrieval_arms:
      - recorded novelty_screen terms
      - BM25 over titles and abstracts
      reported_bound: upper bound; HEUR-RETR-1 requires the phrase wherever the number appears
    implementation: Python 3 standard library for the corpus pass and the term replay; a BM25 implementation
      for the second arm, either from the standard library plus numpy or a single declared dependency
      named before approval. NO network access is required and none may be used. The corpus is read at
      a fixed commit. Runs recorded through harness/runner.py.
    budget:
      stage0_wall_clock_seconds: 1800
      stage1_wall_clock_seconds: 1800
      stage2_wall_clock_seconds: 1800
      stage3_wall_clock_seconds: 1800
      total_wall_clock_seconds: 7200
      maximum_memory_gb: 8
      note: A full pass over 7,819 entries per query, times a few hundred queries, is seconds of compute.
        The budget is sized to the labelled-set construction and to the per-pair relevance adjudication,
        which is careful reading.
  falsification_conditions:
  - F1 (INSTRUMENT) -- the forced-hit pair is not retrieved. The screen replay is broken and NO recall
    number in the package is reportable.
  - F2 (RUBBER STAMP) -- the forced-miss entry is retrieved. The replay retrieves indiscriminately and
    the recall number means nothing.
  - F3 (CHANCE) -- recall does not exceed the random-entry null by the declared margin. The screens are
    retrieving by chance; every novelty_screen block in the corpus needs re-reading; no recall number
    is interpretable. This is the strongest possible finding and it is pre-registered as decidable.
  - F4 (THE CLEAN NEGATIVE FOR THE PROPOSAL'S COMPLAINT) -- recall is at or above 0.5 while the controls
    fire. The screens work on prior art the corpus contains, the binding constraint is corpus COVERAGE
    rather than retrieval, and effort is redirected to acquisition. C3 is rejected at the tested scope
    and that rejection is a deliverable, not a disappointment.
  - F5 (THE REMEDY FAILS) -- the BM25 recall delta is zero or negative. The proposed cheap fix does not
    fix the measured problem at the tested scope. C4 is rejected and must be reported plainly rather than
    as a tuning issue.
  - F6 (BLOCKED, NOT NEGATIVE) -- fewer than 50 labelled pairs are constructible. The measurement cannot
    be built. Reported as a coverage and infrastructure disposition; it is NEVER evidence about the screens
    and the measurement is never run underpowered (AGENTS.md rule 5).
  - F7 (SUPERSEDED BY AN EXISTING INSTRUMENT) -- Stage 0 finds that the program's existing derived retrieval
    index under kb/ already provides the ranked retrieval step this hypothesis proposes to add, with a
    measured recall on a comparable set. The remedy half is superseded; the run reports and cites that
    measurement instead of re-deriving it, and the measurement of the RECORDED TERMS still stands as a
    separate and unmeasured quantity.
  - F8 (SCOPE OVERREACH, A FAILURE OF THE REPORT) -- any output presenting the measured recall as a validation
    of any novelty_status, or quoting it without the upper-bound qualification HEUR-RETR-1 requires, or
    presenting it as a statement about prior art outside the corpus.
  interpretation_limits:
  - THIS MEASURES RETRIEVAL OVER THE CORPUS THE PROGRAM HAS. It says NOTHING about literature the corpus
    lacks, and therefore validates NO novelty_status. The parent proposal's own probability that it validates
    any novelty_status is exactly 0.0 and that number is preserved rather than softened.
  - THE MEASURED RECALL IS AN UPPER BOUND, because the labelled set is built from references the proposals'
    authors already knew about. The bound must be stated wherever the number is quoted, and a run that
    quotes it bare is invalid.
  - NO SECURITY OR MATHEMATICAL CLAIM. This is not toy, medium or crypto evidence about the ECDLP or anything
    else, and it may never be cited in a cost or complexity statement.
  - 'This is a RETRIEVAL measurement and is deliberately DISCRIMINATED FROM the provenance failure recorded
    in KN-OPEN-3f7a21. Merging the two would misattribute a remedy: a retrieval index does not fix an
    entry that claims to have been read and was not.'
  - Re-reading any novelty_screen block, changing any novelty_status, or building any new index into the
    corpus is a separate act. Only the Coordinator promotes findings and no agent may write to the retrieval
    index (AGENTS.md, Knowledge retrieval policy). This hypothesis proposes no such write.
  - SCOPE MISMATCH, RECORDED RATHER THAN HIDDEN. The parent proposal is filed under RQ-CRYPTO-001 but
    concerns the whole program's screening practice rather than RQ-CRYPTO-001's own question of whether
    a non-generic algorithm can beat Pollard rho. It is bound to RQ-CRYPTO-001 to preserve its provenance
    chain and should be ranked on its program-wide value.
