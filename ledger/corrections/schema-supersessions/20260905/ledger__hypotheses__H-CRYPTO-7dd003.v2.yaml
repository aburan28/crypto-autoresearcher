    proof_obligations: []
    not_applicable_reason: PURELY EMPIRICAL. This hypothesis proposes no theorem, asymptotic bound, certificate
      family, reduction or closure argument; its content is a known-answer retrieval measurement over
      a fixed corpus with a chance baseline. There is no mathematical object whose baseline could be reproduced
      and no certificate whose preimages could collide. Per templates/research-records.md, a purely empirical
      hypothesis sets this field and leaves the other subfields null; that is complete work here rather
      than an omission. The identifiability question that DOES apply -- whether the retrieval measurement
      can return a low value at all -- is handled by the random-entry null and the two forced-value pairs
      in the predictions below, which is the right place for it.
