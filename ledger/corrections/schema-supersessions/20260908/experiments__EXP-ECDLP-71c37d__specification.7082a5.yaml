    under the standing 2026-09-06 user authorization. Stage 0 is the exact embedding-order
    / factor-degree calibrator.

    '
  objective: 'Evaluate the exact integer identity that (N,p)=(7,11) has gcd(7,10)=1,
    k=ord_7(11)=3, degrees [1, 3, 3], and rejects (7,29) whose k=1, on one frozen
    family (REAL, KF, NULL). Stage 0 does not construct a Miller function and does
    not authorize Stage 1+.

    '
  preregistered_prediction:
    quantity: 'Stage 0 instrument: REAL N=7 p=11 has gcd=1, k=3, degrees [1, 3, 3];
      KF N=7 p=29 k=1 rejected; NULL empty pair rejected; N=0 rejected. Certificate
      kind none.

      '
    formula: 'k = min { d>=1 : p^d ≡ 1 (mod N) } when gcd(p, N)=1, else undefined.
      Forced degrees are [1] plus k repeated (N-1)/k times, sorted. REAL: 11 ≡ 4 (mod
      7), 4^3 ≡ 1, k=3, degrees [1, 3, 3]. KF: 29 ≡ 1 (mod 7), k=1, rejected as a
      generic large-k target.

      '
    claim_tier: observational
  inputs:
    fixture:
      real_pair:
        N: 7
        p: 11
        must_gcd: 1
        must_k: 3
        must_degrees:
        - 1
        - 3
        - 3
      known_false:
        N: 7
        p: 29
        must_k: 1
        must_N_divides_p_minus_1: true
        must_reject: true
      matched_null:
        kind: empty_pair
        must_reject: true
      invalid:
      - N: 0
        must_reject: true
  controls:
  - name: known_false_k1
