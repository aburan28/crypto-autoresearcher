    and does not authorize Stage 1+.

    '
  preregistered_prediction:
    quantity: 'Stage 0 instrument: REAL p=7 a=0 b=3 has N=13, N''=3, gcd=1, affine
      count 12, empty 2-torsion; KF p=7 a=0 b=2 order 9 rejected; NULL empty point-list
      rejected; p=0 rejected. Certificate kind none.

      '
    formula: 'On E: y^2=x^3+3 over F_7, enumerate (x,y) and count N=13. t=p+1-N=-5.
      N''=p+1+t=3. gcd(13,3)=1. y=0 has no root. The nearby curve y^2=x^3+2 has N=9
      and is rejected as a prime-order target.

      '
    claim_tier: observational
