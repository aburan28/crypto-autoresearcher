  status_note: 'Frozen at version 1 and approved 2026-09-08 by DEC-20260908-4ddeae
    under the standing 2026-09-06 user authorization. Stage 0 is the exact Z/7Z one-step
    next-feature split calibrator.

    '
  objective: 'Evaluate the exact integer identity that phi(x)=x mod 2 with action
    x+1 on Z/7Z splits the even class by next-feature and rejects the claim that phi
    is a homomorphism, on one frozen family (REAL, KF, NULL). Stage 0 does not minimize
    an automaton and does not authorize Stage 1+.

    '
  preregistered_prediction:
    quantity: 'Stage 0 instrument: REAL n=7 phi equals [0, 1, 0, 1, 0, 1, 0] and next-phi
      equals [1, 0, 1, 0, 1, 0, 0]; even next equals [1, 1, 1, 0]; odd next equals
      [0, 0, 0]; KF homomorphism claim rejected; NULL empty x-list rejected; n=0 rejected.
      Certificate kind none.

      '
    formula: 'On Z/7Z, phi(x)=x mod 2, sigma(x)=x+1. The even next- feature list is
      [1,1,1,0] so {0,2,4} splits from {6}. The homomorphism identity phi(a+b)=phi(a)+phi(b)
      fails at (3,4). Empty x-list and n=0 are rejected.

      '
    claim_tier: observational
  inputs:
    fixture:
      group: Z/nZ
      real_split:
        n: 7
        feature: parity
        action: plus_one
        must_phi:
        - 0
        - 1
        - 0
        - 1
        - 0
        - 1
        - 0
        must_next_phi:
        - 1
        - 0
        - 1
        - 0
        - 1
        - 0
        - 0
        must_even_next:
        - 1
        - 1
        - 1
        - 0
        must_odd_next:
        - 0
        - 0
        - 0
      known_false:
        claim: phi_is_homomorphism
        witness:
        - 3
        - 4
        must_reject: true
      matched_null:
        kind: empty_x_list
        must_reject: true
      invalid:
      - n: 0
        must_reject: true
  controls:
  - name: known_false_homomorphism
    object: KF claim that phi is a homomorphism Z/7Z -> Z/2Z
  - name: matched_null
    object: empty x-list
  - name: invalid_n
    object: n=0
  independent_variables:
  - n
  - feature
  - action
  primary_metrics:
  - fixture_pass
  - real_split_pass
  - known_false_hom_pass
  - reject_invalid_pass
  - null_empty_pass
  secondary_metrics: []
  seeds:
