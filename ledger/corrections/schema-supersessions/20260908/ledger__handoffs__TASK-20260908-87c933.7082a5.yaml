  - experiments/EXP-ECDLP-ac7e8b/amendments/v2_2_custody_replay_closure.yaml
  - coordination/design/BATCH-28dddb/protocol-appendix.yaml
  constraints:
  - You are not alone in the worktree. Preserve all existing artifacts and write only
    the declared report path.
  - Do not read TASK-20260908-77c865 or any other review report. Read only the source
    packet, this handoff, and the review plan.
  - Perform source-level reasoning only. Do not implement, execute, generate fixtures,
