    degraded_allowed: false
    independent_session_required: true
  budget:
    wall_clock_seconds: null
    memory_gb: 4
    maximum_runs: 0
  completion_gate:
  - The report contains worked constructions for every plan-listed attack, a joint-local
    verdict, limitations, and no implementation, execution, or scientific approval.
  - The report's attestation names this task, the assigned joint, all sources actually
    read, and read_sibling_reports false.
  return_format: A source-only red-team report at the declared path, ready for Coordinator
    archival and review-independence checking.
  review_plan:
    id: sdeg_counter_v2_2_custody_replay
    experiment_id: EXP-ECDLP-ac7e8b
    claim_under_review: The prospective v2.2 custody definitions reject the four source-level
      replay and double-count constructions identified in TASK-20260908-77c865. This
      is not an implementation, execution, correctness, cost, or cryptanalytic claim.
    amendment: experiments/EXP-ECDLP-ac7e8b/amendments/v2_2_custody_replay_closure.yaml
    amendment_sha256: 256b92d1df1b74058f553f42024f34654c066da6ee8709024cae8fb80a0a1933
    source_snapshot:
      commit: 97fbf5a2b7b5770b4690522e5ab8d0b3d6557580
      paths:
      - experiments/EXP-ECDLP-ac7e8b/amendments/v1_to_v2_hardening_protocol.yaml
      - experiments/EXP-ECDLP-ac7e8b/amendments/v2_1_lifecycle_custody.yaml
      - experiments/EXP-ECDLP-ac7e8b/amendments/v2_2_custody_replay_closure.yaml
      - coordination/design/BATCH-28dddb/protocol-appendix.yaml
    coordinator_prior: The v2.2 fields appear to bind all four failed constructions,
      but a source review may still find an omitted equality, ambiguous aggregate
      scope, or a control that only rejects the example rather than the mutation family.
    inference:
      policy: review-adversarial
      reasoning_effort: xhigh
      fallback_allowed: false
      degraded_allowed: false
      independent_session_required: true
    joints:
    - joint: custody_replay_and_interval_reconciliation_v2_2
      assigned_to: TASK-20260908-87c933
      scope: Target-bound timeout authority, launch-bound rank owner and slot coverage,
        once-only CPU/IO counter ranges, and common-clock wall union.
      attack_plan: Construct a root-B timeout receipt reusing root-A authority; reuse
        a rank owner label from a different launch; omit a sealed EC slot after an
        accepted relation; place one cumulative CPU/IO range under two provenance
        records; and sum overlapping intervals from two processes. For each, identify
        the exact v2.2 required field, equality, ordering, or partition rule that
        rejects it, or record the missing rule.
      breaking_artifact: A concrete source-level construction accepted by every stated
        v2.2 rule, with the exact absent or non-binding field identified.
    blindness:
      mutual: true
      lifted_for: []
      rationale: No prior report is readable; the reviewer receives only the pinned
        source packet and own handoff.
    proves_too_much:
      objects:
      - The v2.1 timeout-authority definition, which is known not to bind authority
        to the terminal target.
      - The v2.1 shared-cost definition, which is known not to require a disjoint
        counter partition or a reporting-scope wall union.
      failure_signature: The source-level attack must remain accepted by the v2.1
        definitions and be rejected by v2.2. If the same argument reports a v2.1 hold,
        it has proved too much and the v2.2 conclusion is unsupported.
      assigned_to: TASK-20260908-87c933
    blind_rederivation:
      required: false
      rationale: 'This joint has no load-bearing numeric quantity: it audits prospective
        equality, ordering, and set-partition definitions. The independent reviewer
        constructs its own counterexamples from the pinned rules.'
    outcome_rule: A holds verdict is limited to these prospective source definitions.
      It cannot approve implementation or execution. A Coordinator may synthesize
      this report only after its exact bytes are committed and independently attested;
      any break requires another additive correction.
