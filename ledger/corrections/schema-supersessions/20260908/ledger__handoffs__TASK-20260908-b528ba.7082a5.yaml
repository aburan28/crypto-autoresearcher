      - tiny_significant_practical_agreement
      - equality_at_tau
      - missing_profile
      - one_undefined_bootstrap
      - duplicate_final
      - checkpoint_as_final
      - changed_attempt_on_resume
      - unowned_rank_state
      - false_not_activated
      - negative_signed_id_replaced
      - duplicate_target_encoding
      - omitted_alias_subtraction
      failure_signature: 'Try to construct duplicate or cross-hash joins, an undefined
        bootstrap survivor interval, a missing-size survivor fit, and an equality
        decided by binary64. Re-derive the v2 target inventories and examine whether
        a profile can enter a primary estimator.

        Trace a normal timing root, a checkpoint/resume, and a failed-first- calibration
        campaign. Attempt to create a seventh process, fork a segment, double-count
        a shared object, or convert a machine checkpoint into a campaign cancellation.

        Read the entire pinned contract, derive each listed F5 row modulo 7 from point
        encodings, and challenge every mutation''s specified failure route. Check
        that the amendment does not represent the controls as measurements.'
