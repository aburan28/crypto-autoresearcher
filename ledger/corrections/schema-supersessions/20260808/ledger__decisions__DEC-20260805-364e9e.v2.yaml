  archived_by: TASK-20260805-006
  context: "BATCH-121 ran two analysis tracks on proposals from BATCH-120: (A) TASK-20260805-004:\
    \ comparison-oracle GGM \u2194 H-PSEUDO characterization (IDEA-62ef74) (B) TASK-20260805-005:\
    \ doubling-oracle closure (IDEA-58b638) + multi-target BKK crossover (IDEA-0cd03f)"
  findings: "TASK-20260805-004 (oracle_hpseudo_analysis.md):\n  - Semaev IC is sub-rho\
    \ (L[1/2, sqrt(2)] \u2248 2^61.7 << 2^128) in GGM+C_t UNCONDITIONALLY.\n  - H-PSEUDO\
    \ failure shifts the L[1/2,c] constant downward only; cannot reach\n    polynomial\
    \ time. Max failure restricts IC to a subgroup (fraction 1/k* of targets).\n \
    \ - C_t is NON-SIMULABLE (Tier 3, encoding-dependent), same class as elliptic-net\
    \ oracle.\n  - IDEA-62ef74 has two defects: (1) H-PSEUDO condition is INVERTED\
    \ \u2014 H-PSEUDO holding\n    means yield AT heuristic, not above; chain-complex\
    \ sub-rho requires H-PSEUDO to FAIL.\n    (2) \"Sub-rho\" conflated: algorithmic\
    \ sub-rho holds unconditionally; chain-complex\n    sub-rho (\u03B21 < sqrt(N))\
    \ requires above-heuristic yield.\n  - Corrected biconditional: \u2203F [chain-complex\
    \ C_R^F sub-rho] \u2194 \u2203F [H-PSEUDO fails for F]\n    (KN-FIND-9d2f56 with\
    \ the oracle layer; C_t does not alter which F have above-heuristic\n    yield).\n\
    TASK-20260805-005 (closure_and_multi_target.md):\n  - Doubling oracle O_D(P) =\
    \ x([2]P) is a rational function of x(P) alone (y-sign\n    cancels); GGM-simulable.\
    \ ord_q(2) \u2265 sqrt(q) verified on 5 curves at p=1009.\n    IDEA-58b638 barrier\
    \ CONFIRMED \u2192 status rejected.\n  - Multi-target BKK: K*(BKK) = \u2308s\xB7\
    \u03B2/(1\u2212t\xB7\u03B2)\u2309 with \u03B2 = 2/(m+1). Crossover shrinks by\n\
    \    factor ~2/(m+1). Critical regime: BKK RESCUES instances with T_desc \u2208\
    \ [sqrt(N),\n    (m+1)/2 \xB7 sqrt(N)) that standard IC cannot touch (t \u2208\
    \ [1, (m+1)/2)). At m=5,\n    s=200, t=0.9: K* drops 2001 \u2192 96. Asymptotic\
    \ per-target speedup 1/(t\xB7\u03B2) for large k.\n    Mechanism algebraically\
    \ sound \u2192 ready for experiment design."
  decisions:
  - "IDEA-20260805-58b638 (doubling oracle): CLOSED as rejected. Barrier confirmed:\
    \ simulable oracle, ord_N(2) = \u03A9(sqrt(N)). No sub-rho path. "
  - "IDEA-20260805-62ef74 (comparison oracle \u2194 H-PSEUDO): DISPATCH for formal\
    \ theorem work on the corrected biconditional: C_t minimality + chain-complex\
    \ iff. The ECCG unification (C_t queries on {[j]G}) is the cleanest original insight\
    \ and is correct. "
  - "IDEA-20260805-0cd03f (multi-target BKK): APPROVED for experiment design. K*(BKK)\
    \ formula verified; critical regime where BKK rescues t \u2208 [1, (m+1)/2) is\
    \ the principal new capability. EV-SEMAEV-7f7d22 reserved for this track. "
  - "H-PSEUDO orientation correction recorded: H-PSEUDO HOLDING \u2192 yield AT heuristic\
    \ (pseudorandom DLs); chain-complex sub-rho requires H-PSEUDO FAILURE. KN-FIND-9d2f56\
    \ Corollary restated accordingly. This does not change H-PSEUDO-83817b status\
    \ (open), only the interpretation direction used in DEC-20260804-384a4a. "
  decision_scope: These decisions apply only to the oracle/multi-target analysis tracks
    within GOAL-ECDLP-001. No hypothesis state machine transitions performed beyond
    the IDEA-58b638 closure (idea-level record, not hypothesis-level). KN-FIND-9d2f56
    corollary orientation is a clarification, not a retraction.
  exact_next_action: "BATCH-122: (A) Design experiment EV-SEMAEV-7f7d22 (multi-target\
    \ BKK) \u2014 validate K*(BKK) at\n    toy scale: 5 curves, k \u2208 {2,5,10,25},\
    \ m \u2208 {3,4,5}, measure crossover vs theory.\n(B) Formalize corrected Claim\
    \ C (C_t minimality as weakest order-based non-simulable\n    oracle) as a standalone\
    \ lemma \u2014 mathematical writeup, no compute required."
