hypothesis:
  id: H-MLDSA-d1e509
  question_id: RQ-MLDSA-001
  goal_id: GOAL-MLDSA-001
  source_idea: IDEA-20260805-3f7ab2
  experiment_id: EXP-MLDSA-3f7ab2
  status: specified
  title: The SelfTargetMSIS hardness margin in ML-DSA differs from the published CRYSTALS-Dilithium
    estimate when re-derived independently with memory charged and KN-LIT-3907 tightness
    loss applied
  mechanism: KN-LIT-056 Table 2 gives concrete hardness estimates for SelfTargetMSIS
    and MSIS at Dilithium parameter sets. KN-LIT-3907 identifies a CMA-to-NMA tightness
    loss that was not accounted for in those estimates. An independent re-derivation
    from KN-LIT-056 Table 2 with the tightness loss applied may show a different security
    margin. Additionally, the gap between MSIS and SelfTargetMSIS (the scheme-specific
    problem) may be larger than implied by published estimates once the binding assumption
    is properly identified.
  prediction: After applying KN-LIT-3907's tightness factor to KN-LIT-056 Table 2
    SelfTargetMSIS estimates, the corrected margin at ML-DSA-65 (NIST Cat 3, k=5 l=4)
    differs from the published 128-bit target by a measurable amount.
  falsification_criteria:
  - If the re-derived estimate matches the published estimate to within 1 bit, the
    tightness loss is negligible and the published margin is confirmed.
  - 'If the re-derivation cannot be carried out without the FIPS 204 standard body
    (parameter sets not matching academic Dilithium), record as requires_fips204_body:
    true and defer.'
  scope: arithmetic_re_derivation
  claim_tier: theoretical_analysis
  constraints:
  - Scope to academic ML-DSA/Dilithium parameter sets from KN-LIT-056 Table 2
  - FIPS 204 body not available; do not claim FIPS 204 parameter coverage
  - SelfTargetMSIS estimate must be compared to MSIS estimate in the same table
  created_at: '2026-08-05'
