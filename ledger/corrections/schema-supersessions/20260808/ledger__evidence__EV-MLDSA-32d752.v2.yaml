  what_was_established: 'Via ePrint 2023/246 abstract (primary source, read 2026-08-05):
    KN-LIT-3907 proves CMA security of Dilithium in the standard ROM/QROM cryptographic
    adversary model. The adversary can query signing and hash oracles but does NOT
    have physical access to the signing device. Both the Shin DFA (KN-LIT-340675,
    challenge-sampling via hash) and the Jendral voltage-glitch (KN-LIT-4f3b80, nonce
    erasure) require physical device access. Neither is covered by KN-LIT-3907''s
    formal model.'
  coverage_determinations:
    H-MLDSA-f3a291_shin_dfa: outside_formal_model
    H-MLDSA-c7b4e8_jendral_glitch: outside_formal_model
    determination_basis: abstract_level
    determination_note: Adversary model boundary is unambiguous from the abstract
      (ROM/QROM CMA security, no physical fault adversary). Full text not read; a
      formal adversary definition may add nuance but is unlikely to change the physical/cryptographic
      boundary.
  boundaries:
  - Abstract-level determination only; full text of ePrint 2023/246 not obtained.
  - No claim about whether the attacks are practically feasible or about ML-DSA security.
  - No claim that the attacks constitute breaks of Dilithium/ML-DSA.
  - SelfTargetMSIS is the formal hard problem; these attacks target implementation,
    not the mathematical problem.
