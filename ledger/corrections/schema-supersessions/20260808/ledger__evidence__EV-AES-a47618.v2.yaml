evidence:
  id: EV-AES-a47618
  hypothesis_id: null
  hypothesis_id_note: DELIBERATELY NULL. This record's central content is a PROPOSITION
    ABOUT THE INSTRUMENT, not a finding about a cipher property, and its effect is
    to REMOVE a quantity from this campaign's evidence base rather than to bear on
    any hypothesis. RQ-AES-003 carries no hypothesis about the r<=4 word- preservation
    statistic, and naming one here would manufacture a binding the result does not
    have. Admitted under the documented-null allowance recorded in CORR-20260802-009.
  experiment_ids: []
  run_ids: []
  task_ids:
  - TASK-20260803-d6ebce
  - TASK-20260803-e55757
  - TASK-20260803-f971d0
  - TASK-20260803-cddc64
  type: derivation_plus_measurement
  direction: refutes_own_prior_reading
  strength: moderate
  strength_basis: MODERATE, AND THE LIMIT IS MODEL INDEPENDENCE RATHER THAN EXECUTION.
    The derivation was reworked step by step by an independent validator that wrote
    TWO instruments of its own -- a byte-oriented C probe and a Python structural
    checker whose word geometry is DERIVED FROM ShiftRows ITSELF rather than copied
    from an index formula -- both pinned to the FIPS-197 C.1 known-answer vector in
    both directions before any structural claim was tested. That discharges the producer's
    own declared caveat that its verifier was "independent in implementation but not
    in specification". The validator reproduced all 15 amasks at r=4, added four never
    previously run (10, 11, 13, 14), and confirmed under a drawn S-box and a second
    key. What holds the strength at moderate is that every party -- both producers,
    the BATCH-006 validator, this validator and the Coordinator -- resolved to claude-opus-5
    under standing basis 0137a051eb5828789eb267fa83c8278086578d4c, so correlated judgement
    is not excluded and NOTHING HERE COUNTS TOWARD A CLOSURE QUORUM.
  claim_tier: toy
  claim_tier_basis: Reduced-round AES-shaped SPN, C1 convention, r in 1..8, one machine,
    2^24 to 2^31 trials, one campaign-specific definition of "word". No crypto-scale,
    medium-scale, affected-scheme or asymptotic claim is made or implied, and no comparison
    to published cryptanalysis is made in either direction.
  certificate_refs: []
  proof_status: derivation
  proof_refs:
  - coordination/goals/GOAL-AES-003/batches/BATCH-007/tasks/TASK-20260803-d6ebce/PREREGISTRATION.md
  - coordination/goals/GOAL-AES-003/batches/BATCH-007/tasks/TASK-20260803-cddc64/validation_report.yaml
  observations:
  - id: OBS-B7-1
    statement: PROPOSITION 1 FOLLOWS. At r <= 4, with active mask A, the number of
      preserved plaintext words is W = 4 - |A| on EVERY trial, and word j is preserved
      iff j is not in A. Every step -- lemmas L2, L3, L4 and Steps 1 through 4 --
      was reworked from the instrument source by an independent validator using instruments
      it wrote itself, and all follow.
    status: CONFIRMED by independent rederivation and re-measurement
  - id: OBS-B7-2
    statement: THE PROPOSITION REMOVES A RESULT RATHER THAN ADDING ONE, AND THAT IS
      THE POINT OF THIS BATCH. At r <= 4 the quantity is 1.0 BY THEOREM. It is not
      a statistic, it is blind to the swap mask conditional on a nontrivial swap,
      and the "excess 2^30" this campaign has cited is the arithmetic ceiling of the
      ratio 1.0 / (4 * 2^-32) -- never a magnitude, and carrying no information beyond
      "the rate is 1".
    status: CONFIRMED
  - id: OBS-B7-3
    statement: THE NULL CONTROL AND THE SIGNAL ARE ONE FORMULA AT TWO POINTS. The
      BATCH-006 validator's amask=15 arm is the |A|=4 case of W = 4 - |A|, so it is
      another point of the same deterministic family rather than a null object of
      the same shape. The campaign has therefore NEVER run an inventor-protocol section
      3 null object for the r <= 4 statistic, and a drawn-S-box arm does not supply
      one either, because H1 uses only bijectivity -- making a random-S-box arm a
      POSITIVE control.
    status: CONFIRMED, and the validator recorded the producer as UNDERSTATING it
    why_the_section_3_concern_nevertheless_dissolves: 'Section 3 exists to catch a
      statistic that is an artifact of counting. A quantity that is 1.0 by theorem
      is not a statistic and there is nothing for a null object to disconfirm. The
      decay test section 3 actually asks for is SATISFIED by the round sweep: rate
      1.0 at r <= 4; 29 and 33 hits in 2^31 at r=5 (14.5x and 16.5x the analytic null);
      approximately null at r=6 and r=10 in prior batches. The canonical artifact
      tell -- a quantity that will not decay -- is ABSENT. The r <= 4 reading needs
      no control because it needs no belief; the r = 5 reading is where the control
      question actually lives.'
  - id: OBS-B7-4
    statement: 'TWO STATED JUSTIFICATIONS IN THE DERIVATION ARE WRONG, AND NEITHER
      IS LOAD-BEARING. (a) Lemma L1''s second sentence REVERSES THE DIRECTION: column
      j of a post-ShiftRows state pulls back to PW[j], not to CW[j]. The lemma is
      used four times and every use takes the correct direction. (b) Step 1''s stopping
      claim is OVERSTATED: "a diagonal meets all four columns" is not the operative
      criterion; "CONTAINS NO FULL COLUMN" is. A set can meet all four columns and
      still contain full columns.'
    status: CONFIRMED; recorded as defects in a surviving argument
  - id: OBS-B7-5
    statement: THE WITNESS THAT THOSE TWO CRITERIA DIFFER IS A COUNTEREXAMPLE TO THE
      PROPOSITION'S OWN STATED SCOPE. At smask = 15 the swapped set is the WHOLE STATE,
      the pushback does not stop, and the conclusion holds at EVERY round count --
      measured at r=5 and r=6, 2^24 trials, rate 1.0 with by-word vector [N,0,N,N],
      and structurally 40/40 at r = 1..8. The predictions P5 and N5 AS WRITTEN ARE
      THEREFORE FALSE; they require the smask in 1..14 restriction that Proposition
      1 itself already carries.
    status: CONFIRMED by the validator's own construction. Recorded as a scope defect
      in the predictions, not in the proposition.
  - id: OBS-B7-6
    statement: 'THE DERIVATION SHOWS ONLY THAT ITS OWN TECHNIQUE STOPS AT r = 5, NOT
      THAT THE PHENOMENON DOES. The argument survives at r=4 because of a two-tier
      fact the producer states only implicitly: at the swap point the pair is a transposition,
      so any bytewise map preserves the difference; one layer below, MC^-1 carries
      the VALUE while SB^-1 supplies only the PATTERN, and Step 3''s test is a pattern
      test. r=4 needs exactly one of each. The break at r=5 was named in advance and
      is where the producer said it would be -- but the phenomenon''s failure at r=5
      is MEASURED, not DERIVED.'
    status: CONFIRMED; recorded as the boundary of what the proposition proves
  - id: OBS-B7-7
    statement: RC-8 REPLICATES EXACTLY. All 27 draws agree with the raw files across
      all eight fields with zero mismatches, and all 27 S-box tables are byte-identical.
      Both NOT_ALIVE draws -- B11 at X=6 ratio 6.0, and B25 at X=9 ratio 9.0 -- pass
      the first conjunct and fail ONLY the Poisson conjunct. The Clopper-Pearson one-sided
      95% lower bound on the preserving fraction is 0.784700038857546, recomputed
      independently.
    status: CONFIRMED field-by-field from the raw files
  - id: OBS-B7-8
    statement: THE 0.90 TARGET WAS UNREACHABLE AT n = 27 UNDER ANY OUTCOME. The supremum
      of the bound at 27 draws is 0.05^(1/27) = 0.89498, so a PERFECT record of 27
      ALIVE of 27 would still have missed it. The campaign's "missed by two draws"
      was a conflation of a confidence bound with a distance, and the goal's rank
      3 next action -- two further ALIVE draws -- would have reached 0.798439, the
      pooled figure already on record. Reaching 0.90 while carrying the two observed
      failures requires n = 61, i.e. 34 further draws.
    status: CONFIRMED. Found by the validator and independently recomputed by the
      Coordinator by bisection on the exact binomial tail before adoption. Recorded
      as CORR-20260803-4e91da, superseding CORR-20260803-2cefa6.
  - id: OBS-B7-9
    statement: A CAMPAIGN CLAIM OF ABSENCE WAS FALSE FOR THE THIRD TIME IN TWO DAYS.
      The producer recorded "any r=5 arm at an amask other than 1" as an open gap;
      SEVEN such arms exist, in directories the producer itself names (BATCH-002,
      BATCH-004, BATCH-005, all at amask=15). Unlike the other two instances this
      one UNDERSTATES the campaign's evidence base rather than overstating it.
    status: CONFIRMED by the validator
  - id: OBS-B7-10
    statement: '"THE ACTIVE WORD TAKES THE LARGEST COUNT" AT r = 5 IS NOISE. The validator''s
      independent arm puts the largest count on a NON-active word, with chi-squared
      p = 0.845, 0.081 and 0.450 across its tests.'
    status: CONFIRMED; the reading is withdrawn
  defects_carried:
  - id: D-B7-1
    statement: commands.txt line 3 records a command with exit 139, but that command
      re-runs to exit 0; the DEV-1 form with the seed omitted reproduces the segfault.
      A non-measuring line, but it is the "exact command" record and it does not reproduce
      as written.
  - id: D-B7-2
    statement: Addendum A's header says 18:23Z while the arms it pre-registers finished
      at 18:16:14Z and 18:22:07Z. The budget stamp and the filesystem mtime both say
      18:16:00Z, so the pre-registration survives on the stamp -- but the document
      AS WRITTEN would void it. Timestamp corroboration resting partly on mtimes is
      weaker evidence than the stamp it agrees with.
  - id: D-B7-3
    statement: 'The verifier''s headline "60/60 at r <= 4" is a compression: r=1 is
      not applicable and r=2 is vacuous. The load-bearing contrast is r=4 (60/60)
      against r=5 (0/60); the validator independently got 40/40 against 0/40.'
  - id: D-B7-4
    statement: 'The producer reported itself as FAILING a bit-for-bit reproduction
      standard that its own completion gate did not set. Against the gate it was actually
      given, all four items are met. The validator then closed the gap anyway: five
      recorded commands reproduce bit-for-bit against the frozen binary. Recorded
      because a producer marking itself failed against an invented standard is a defect
      in the opposite direction from overclaiming.'
  boundaries:
  - Proposition 1 is a statement about a yoyo statistic under one cipher convention
    with one campaign-specific definition of "word". It says nothing about the security
    of anything.
  - The proposition covers r <= 4 with smask in 1..14. At smask = 15 the conclusion
    holds at every round count for a different reason, and the predictions P5 and
    N5 do not hold as written.
  - The r = 5 break is measured, not derived. What is derived is that this technique
    stops there.
  - Session and implementation independence only. NO MODEL INDEPENDENCE under standing
    basis 0137a051eb5828789eb267fa83c8278086578d4c; nothing here counts toward a closure
    quorum.
  - The validator's re-measurements use its own key derivation and trial stream, so
    they confirm the STRUCTURE and not the producer's exact counts. Exact-count confirmation
    was done separately against the frozen binary.
  - No memory measurement was taken by anyone; the 8 GB budget is unverified in both
    directions.
  unresolved_confounds:
  - Whether the r = 5 residual reading (29 and 33 hits in 2^31, 14.5x and 16.5x the
    analytic null) is a cipher property or a probe-geometry property remains open.
    It is the only round count in this campaign where the question is live, since
    r <= 4 is a certainty and r >= 6 reads at the null.
  - An inventor-protocol section 3 null object for the r = 5 statistic -- a random
    bijection in place of the cipher, not another point of the same parametric family
    -- has never been run.
  - A second r = 5 arm at amask = 1 was dropped on budget and is named as such.
  reviewed_by:
