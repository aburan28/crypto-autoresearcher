idea:
  id: IDEA-20260808-8a63b8
  question_id: SG-ECDLP-002
  added: '2026-08-07'
  title: 'CLOSURE with named obstruction: DLP difficulty is uniform within an ordinary
    isogeny class (all curves have the same group order N, embedding degree, CM discriminant,
    and GHS profile), so no within-class transfer can improve on Pollard rho; the
    isogeny-transfer approach for ordinary F_p-isogenies is structurally infeasible
    for generic prime-field curves'
  class: mechanism
  claim: "Within an ordinary isogeny class (fixed trace t, fixed group order N), all\
    \ curves E/F_p share the following properties: (1) Group order: #E(F_p) = p +\
    \ 1 - t = N (fixed by trace) (2) Embedding degree: the least k with N | p^k -\
    \ 1 (depends only on N and p) (3) CM discriminant: D = t^2 - 4p (fixed by trace)\
    \ (4) GHS profile: Weil descent feasibility depends on N and p (fixed) (5) GLV\
    \ performance: all curves have CM by orders of discriminant D, so\n    endomorphism\
    \ norms are ~ sqrt(|D|) ~ sqrt(p), giving 2D rho cost ~ p^{1/2}\n\nMECHANISM:\
    \ Attempt to transfer DLP from E to E' in the same isogeny class via an ordinary\
    \ F_p-isogeny phi: E -> E'. If E' has a faster DLP algorithm, solve on E' and\
    \ transfer back.\nOBSTRUCTION: Since all curves in the class have the same N,\
    \ embedding degree, CM discriminant, and GHS profile, they have the SAME DLP difficulty.\
    \ There is no \"special\" curve in the class to transfer to. The isogeny-transfer\
    \ approach requires a target with lower DLP complexity, but no such target exists\
    \ within the class.\nCONCLUSION: DLP difficulty is uniform within an ordinary\
    \ isogeny class. No within-class transfer can improve on Pollard rho. This is\
    \ a CLOSURE with a named obstruction: the \"within-class uniformity\" \u2014 all\
    \ curves in the class have the same DLP complexity."
  mechanism: "(1) Fix a target curve E/F_p with prime-order subgroup of order N. (2)\
    \ Compute the isogeny class: all E'/F_p with #E'(F_p) = N. (3) For each E' in\
    \ the class, check if a faster DLP algorithm exists:\n    - Anomalous? No, trace\
    \ is fixed at t != 1 for generic E.\n    - MOV vulnerability? No, embedding degree\
    \ is fixed by N and p.\n    - GHS vulnerability? No, depends on N and p (fixed).\n\
    \    - GLV speedup? All curves have CM discriminant D = t^2-4p, so\n      endomorphism\
    \ norms are ~ sqrt(|D|) ~ sqrt(p), giving 2D rho cost\n      ~ p^{1/2} = same\
    \ as standard rho.\n(4) Conclude: no E' in the class has lower DLP complexity\
    \ than E.\nThe isogeny-transfer approach requires a target with lower complexity,\
    \ but no such target exists. The mechanism is structurally infeasible."
  novelty_status: known_in_substance
  novelty_note: The uniformity of DLP difficulty within an isogeny class follows from
    the fact that all relevant parameters (N, embedding degree, CM discriminant) are
    determined by the trace t. This is a standard result in CM theory and the study
    of isogeny classes (Waterhouse 1969, Kohel 1996).
  avoids_tate_obstruction: true
  avoids_tate_obstruction_reason: This mechanism works entirely within a single isogeny
    class (fixed trace t). The Tate theorem blocks crossing between classes; this
    mechanism does not attempt to. However, the within-class uniformity obstruction
    shows that no advantage exists even within the class.
  assumptions:
  - All curves in the same isogeny class have the same DLP complexity. This follows
    from the fact that N, embedding degree, and CM discriminant are determined by
    the trace t.
  - No "hidden" DLP weakness exists that depends on the j-invariant or the specific
    Weierstrass model (as opposed to the trace-determined parameters).
  heuristic_assumptions:
  - id: H1
    statement: DLP difficulty depends only on (N, p, embedding degree, CM discriminant),
      not on the j-invariant or Weierstrass model.
    rigorous_support: All known DLP algorithms (Pollard rho, BSGS, index calculus,
      GLV, MOV, GHS) depend only on these parameters. No algorithm is known that depends
      on j or the model.
    validation_plan: At toy scale (bits=20), generate 100 curves in the same isogeny
      class (same trace t). Run Pollard rho on each and verify that the step count
      is the same (up to constant factors). This confirms uniformity at toy scale.
  predictions:
  - metric: within_class_dlp_variance
    direction: lower
    minimum_effect: The variance of Pollard rho step counts across curves in the same
      isogeny class is O(1) (constant factor variation due to random walk). No systematic
      variation correlated with j-invariant or conductor.
  - metric: special_curve_existence
    direction: lower
    minimum_effect: No curve E' in the isogeny class has DLP complexity < O(sqrt(N)).
      All curves have the same complexity.
  minimal_test:
    design: 'At bits=20: (1) Generate a random prime p and trace t. (2) Generate 100
      curves E_1, ..., E_100 in the same isogeny class (same trace t, different j-invariants).
      (3) Run Pollard rho on each curve with the same target DLP instance. (4) Measure
      the step count for each curve. (5) Compute the variance and check for correlation
      with j-invariant or conductor.'
    controls:
    - For curves in DIFFERENT isogeny classes (different traces), verify that the
      step count varies as expected (different N means different rho cost).
    - For CM curves (j=0, j=1728) in the same class, verify that GLV gives the predicted
      constant-factor speedup (but not an exponent change).
    required_metrics:
    - within_class_step_count_variance (should be O(1))
    - correlation_with_j (should be 0)
    - correlation_with_conductor (should be 0)
  falsification_conditions:
  - If the variance of step counts across the isogeny class is >> O(1) and correlates
    with j-invariant or conductor, then DLP difficulty is NOT uniform within the class,
    and a within-class transfer might be viable.
  - If a curve E' in the class has DLP complexity < O(sqrt(N)), the uniformity hypothesis
    is false.
  confounders:
  - 'Small-sample effects: at bits=20, the isogeny class might have only a few hundred
    curves, so statistical power is limited.'
  - CM curves (j=0, j=1728) have known endomorphisms, but these give only constant-factor
    speedup, not an exponent change.
  interpretation_limits:
  - A positive result (uniform difficulty) confirms that within-class transfer is
    not viable for generic curves.
  - Does not rule out the possibility of a "hidden" weakness that depends on some
    parameter not yet identified (but no such parameter is known).
  dominated_by: Pollard rho at exponent 1/2. The within-class uniformity obstruction
    shows that no curve in the class has lower complexity, so transfer gives no improvement.
  sota_delta:
    time_exponent: not_applicable
    memory_exponent: not_applicable
    data_or_query_exponent: not_applicable
    note: For generic curves, all curves in the isogeny class have the same DLP complexity
      O(sqrt(N)). No improvement is possible via within-class transfer.
  target_complexity:
    time_exponent: 1/2 (same as Pollard rho for all curves in the class)
    memory_exponent: 0 (same as Pollard rho)
    best_known: 1/2 (Pollard rho)
    hidden_overhead: None. The within-class uniformity is a structural result, not
      an algorithm.
    tradeoff_note: No time-memory tradeoff; the mechanism is a structural obstruction.
  estimated_cost:
    implementation: low (toy-scale test of within-class variance)
    compute: low (100 curves at bits=20)
  recommended_priority: medium
  proof_search_map:
    bottleneck: 'The within-class uniformity obstruction: all curves in the class
      have the same DLP complexity, so no target exists for transfer.'
    baseline_embedding:
      parameter_slice: Generic prime-order curves E/F_p with prime-order subgroup
        of order N, all in the same isogeny class (same trace t).
      reproduction_check: At bits=20, verify that Pollard rho step counts are uniform
        across the isogeny class (variance O(1)).
    observation_collision:
      observable: Pollard rho step count as a function of j-invariant and conductor
        within the isogeny class.
      distinct_preimage_search: Find two curves in the same class with different step
        counts (should not exist beyond O(1) variation).
    constructive_transforms:
    - transform: stronger_invariant
      proposed_object: A proof that DLP difficulty depends only on (N, p, embedding
        degree, CM discriminant), not on j or the model.
      predicted_gain: If proven, this would formally close the within-class transfer
        direction.
    quantifier_order: 'FOR ALL curves E, E'' in the same isogeny class, DOES THERE
      EXIST a DLP algorithm on E'' that is faster than Pollard rho on E? Answer: NO
      (uniformity).'
    method_ceiling:
      strongest_certifiable_claim: DLP difficulty is uniform within an ordinary isogeny
        class. No within-class transfer can improve on Pollard rho.
      nearby_object_control: For CM curves (j=0, j=1728), GLV gives constant-factor
        speedup, but this applies to all curves in the class (since they all have
        the same CM discriminant), so no relative advantage exists.
    proof_obligations:
    - claim: DLP difficulty is uniform within the class
      responsibility: correctness (all known algorithms depend only on trace-determined
        parameters)
    - claim: No hidden weakness exists
      responsibility: scope (no known algorithm depends on j or model)
    not_applicable_reason: The within-class uniformity obstruction shows that no advantage
      exists for within-class transfer. This is a CLOSURE direction.
  scope: Applies to ordinary prime-field curves E/F_p with prime-order subgroup of
    order N. For all curves in the same isogeny class, DLP difficulty is uniform (O(sqrt(N))).
    No within-class transfer can improve on Pollard rho.
