  title: The Jendral (2024) nonce-erasure voltage-glitch against hedged ML-DSA on
    Cortex-M4 operates outside the formal fault-injection security guarantee
  mechanism: "Hedged ML-DSA derives the signing nonce via \u03C1' = H(\u03BE || M\
    \ || rnd) where \u03BE is the secret key seed and rnd is externally supplied randomness.\
    \ A voltage-glitch that zeroes or corrupts rnd (nonce erasure) reduces the effective\
    \ randomness in the nonce derivation. The formal security proofs (KN-LIT-3907)\
    \ model the signing oracle with fresh randomness; whether nonce degradation via\
    \ glitch falls within the formally modelled fault class is the open question."
  prediction: The Jendral attack (KN-LIT-4f3b80) with 58.2% success probability on
    Cortex-M4 is consistent with a fault model not covered by any existing formal
    proof. Specifically, no formal proof is known that explicitly handles glitch-induced
    nonce erasure in the hedged ML-DSA construction.
  falsification_criteria:
  - If KN-LIT-3907 or KN-LIT-8ce0b5 explicitly model nonce-erasure glitches and prove
    security against them, this hypothesis is falsified.
  - If the Jendral attack requires physical access that the formal adversary model
    already excludes by convention (not as a gap), this hypothesis requires reframing
    rather than falsification.
