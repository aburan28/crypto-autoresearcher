coordinator_decision:
  id: DEC-20260805-0d59ff
  goal_id: GOAL-MLDSA-001
  batch_id: BATCH-001
  recorded_at: '2026-08-05'
  decision: advance_with_filed_entries
  decision_label: BATCH-001 literature acquisition admitted. Five KN-LIT entries filed.
    Three red-team gates addressed explicitly below. RQ-MLDSA-001 corrections canonicalised.
    BATCH-002 may proceed to SelfTargetMSIS ideation without the FIPS 204 standard
    body.
  context: GOAL-MLDSA-001 BATCH-001. Idea-generator TASK-20260805-a1c3f9 acquired
    5 sources and proposed 5 KN-LIT entries. Validator accept_with_qualifications.
    Red team pass_with_constraints (3 required ledger gates). Reviews at 4f080b385.
  evidence_refs:
  - EV-MLDSA-faf2ec
  red_team_gates_resolved:
    gate_1_fips204_standard_body: 'RULING: The partial FIPS 204 entry (bibliographic
      identity confirmed, standard body not read) SATISFIES RQ-MLDSA-001.constraints[0]
      for the purpose of BATCH-002 SelfTargetMSIS ideation. Rationale: RQ-MLDSA-001
      constrains "experiment design" not "ideation." SelfTargetMSIS is defined and
      discussed in academic literature already in the corpus (KN-LIT-056, KN-LIT-3907).
      The FIPS 204 body would be required before designing a concrete experiment that
      claims to test a FIPS 204 parameter set. BATCH-002 will be scoped to ideation
      only; the body gap will be named as a constraint in every BATCH-002 handoff.'
    gate_2_corrections_canonical: 'RULING: Jendral year (2024 not 2026) and success
      probability (58.2% not ~53%) are now canonical in the ledger via this decision.
      Any BATCH-002 ideation handoff that references the Jendral attack must use the
      corrected values. The RQ-MLDSA-001 record is immutable; this decision supersedes
      its provisional claims on these two points.'
    gate_3_ravi_dominance: 'RULING: Ravi 2022/737 is filed at KN-LIT-180ad5 with a
      note that it may be dominated by the 2026 targeted papers (KN-LIT-4f3b80, KN-LIT-4dadec)
      for the specific differential fault and glitch lanes. Its dominated_by field
      is set to null only until a Coordinator confirms; it is provisionally set to
      null with an explicit open-question annotation. IEEE Trans. Computers venue
      is recorded as unconfirmed.'
  knowledge_promotion:
    promoted:
    - KN-LIT-4dadec
    - KN-LIT-340675
    - KN-LIT-4f3b80
    - KN-LIT-180ad5
    - KN-LIT-8ce0b5
  next_actions:
  - 'Open BATCH-002: run /propose-ideas RQ-MLDSA-001 against the now-filed KN-LIT
    entries. The producing task receives the five new entries as context. All BATCH-002
    handoffs must: (a) reference the corrected Jendral values (2024, 58.2%), (b) scope
    ideation to what is supportable without the FIPS 204 standard body, (c) treat
    SelfTargetMSIS in both directions (could be well-studied; could be the gap).'
