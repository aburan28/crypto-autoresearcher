  provenance_and_scope:
    why_this_experiment_exists: 'DEC-20260802-446a54 closed BATCH-028 as INCONCLUSIVE
      and named a SINGLE next action: a successor contract, under a new id, with a
      Coordinator approval task between freeze and execution, whose first two phases
      are the two cheap arms both BATCH-028 reviewers independently converged on.
      (1) The null-scaling arm: enlarge ONLY the null at CELL-16, holding the treatment
      fixed, and see whether the observed CELL-16 statistic decays as n^(-1/2). (2)
      The support-matched null: BATCH-028''s own INTEG-3 observation OBS-1 proved
      that all 130816 treatment discriminants are squares, so the treatment occupies
      about half the support its null sampled, and no pre-registered rule in that
      contract noticed. This contract is those two arms and nothing else.'
    inputs_that_are_frozen_and_were_read_only:
    - experiments/EXP-SMTH-4403c4/specification.yaml (sha256 664e37a3752b984f6b213dde21c9d7c26e891708325185c785f36c5d6462eb6f)
