    what_this_experiment_can_conclude: 'A toy-tier, single-host, unreplicated answer
      to two mechanical questions about one instrument at one toy cell: (1) does the
      BATCH-028 CELL-16 KS statistic decay under an 8x-enlarged null, and (2) is a
      support-matched null distinguishable from the uniform null this instrument used.
      Nothing else.'
    what_this_experiment_can_never_conclude:
    - No crypto-scale, medium-scale, affected-scheme or asymptotic claim, under any
      outcome.
    - No cost saving, no exponent, no early-abort licence, no ECDLP consequence.
    - HEUR-DS-1 is neither validated nor refuted by any outcome here. The words "validated"
      and "refuted" may not appear unqualified in any deliverable. Both arms are about
      the CALIBRATION AND THE COMPARATOR of a measurement, not about the heuristic.
    - No discrete logarithm is computed, no relation is harvested, no live key is
      touched. certificate.kind is `factorization_reconstruction`; there is no dlog
      certificate because there is no dlog.
    - THE DEEP-SMOOTH REGIME IS OUT OF SCOPE AND IS NOT ATTEMPTED HERE. It was unpowered
      at both BATCH-028 cells and remains untested. It needs a larger factor base
      and its own funded contract, and no outcome of this experiment bears on it in
      either direction. Any deliverable that reads a result here as touching the deep-smooth
      regime is misreading it.
    - CELL-20 is not run here. It is not a control, not a replication and not a silent
      input; it is simply outside this contract.
    - The judgment of what these arms mean for HEUR-DS-1, for BATCH-028's standing,
      or for the instrument's fitness belongs to the Reviewer and the Coordinator.
      The Executor records the measured quantities beside the pre-registered rules
      and states the mechanical outcome labels only.
  calibration_decision:
    id: CAL-e932e8
    the_question: 'BATCH-028 applied a TWO-sample Kolmogorov-Smirnov critical value,
      T_KS2 = 1.63*sqrt(2/n_eff) = 0.006373414579727891 at n_eff = 130816, and recorded
      D = 0.004808280332681103 at CELL-16, a NOT-REJECT at 75 percent of threshold.
      That same contract states, in its own seeds block, that the treatment arm "carries
      NO SEED AND NO SAMPLING NOISE: it is EXHAUSTIVE over all 130816 pairs and is
      reproducible from (p, a, b, FB) alone." Read that way the comparison is a ONE-sample
      test of a random null sample against a FIXED CDF, whose critical value at the
      same alpha is 1.63/sqrt(n) = 0.004506684668638803 - which the recorded D EXCEEDS.
      BATCH-028''s headline therefore lives in the gap 0.004507 < 0.004808 < 0.006373
      between two defensible calibrations, and its contract never argued for the wider
      one.'
    THE_DECISION: 'THIS CONTRACT USES THE ONE-SAMPLE CALIBRATION FOR EVERY COMPARISON
      IN WHICH THE TREATMENT ARM APPEARS, AND THE TWO-SAMPLE CALIBRATION ONLY FOR
      COMPARISONS BETWEEN TWO SAMPLED ARMS. Concretely: any statistic of the form
      sup |F_treatment - F_sampled_arm| is referred to the Kolmogorov distribution
      at the SAMPLED arm''s size m, critical value 1.63/sqrt(m) at alpha = 0.01; any
      statistic between two sampled arms of sizes n1, n2 is referred to 1.63*sqrt(1/n1
      + 1/n2).'
    why: 'The inferential target of this contract is stated and fixed: the POPULATION
      of C(512,2) i<j pairs determined by the FROZEN constants (p, a, b, FB) of CELL-16.
      Relative to that target the treatment arm is not a sample of anything - it is
      the entire population, computed deterministically, with no seed, no draw and
      no sampling step anywhere in its construction. The only random object in the
      comparison is the null. A test of a random sample against a fixed reference
      CDF is a one-sample test, and using a two-sample critical value there inflates
      the critical value by sqrt(2) and buys an unearned not-reject.'
    the_strongest_counter_argument_stated_fairly_and_answered: 'RT028-B2 argues the
      opposite direction: if one regards the 512-element factor base as itself one
      pseudorandom draw, then the treatment IS a sample - a heavily dependent one,
      since 130816 pairs are built from 512 elements each appearing in 511 pairs -
      and its effective sample size is far below 130816, making the honest threshold
      much LOOSER than either value above. That argument is sound, and it is an argument
      about a DIFFERENT INFERENTIAL TARGET: "a random curve with a random factor base"
      rather than "this curve with this factor base". This contract does not adopt
      that target and does not claim generality over factor bases or curves. Generalizing
      over the factor-base draw requires replication across independent (curve, FB)
      seeds with a between-seed variance component; that is NOT done here, NOT costed
      here, and no deliverable of this experiment may generalize past the single frozen
      instance. Within the stated target the treatment CDF is a constant and the one-sample
      calibration is the exact one.'
    note_that_this_choice_is_the_stricter_one: 'Recorded deliberately: the calibration
      adopted here is the one that makes the BATCH-028 CELL-16 number look WORSE,
      not better. It is chosen because the argument above favours it, and the fact
      that it disfavours the prior headline is a reason to state it plainly rather
      than a reason to avoid it.'
    ties_and_atoms_caveat: 'z = ln(N)/ln(LPF(N)) has an atom at z = 1 (every prime
      N) and further ties, so the z distribution is not continuous and the Kolmogorov
      limit is not exact. The direction of the error is known: with atoms the null
      distribution of the KS statistic is stochastically SMALLER than the Kolmogorov
      law, so the critical values above are CONSERVATIVE - a rejection remains valid
      at nominal alpha <= 0.01 and a not-reject is weaker than nominal. The executor
      therefore ALSO reports the tie structure (number of distinct z values and the
      mass at z = 1 in each arm) and the empirical block calibration of DR-A1c, which
      is tie-aware because it is built from the same discrete pipeline.'
    this_decision_is_frozen: It is not adjusted after any datum, and no completed
      run of this contract is re-scored against a different calibration. A later judgment
      that the choice was wrong produces a NEW experiment; it does not re-read this
      one.
    the_primary_rule_is_deliberately_calibration_robust: 'Stated in advance so that
      this decision cannot be made load-bearing after the fact: DR-A1''s decision
      bands (below) are set by the DECAY-versus-PLATEAU geometry, not by the choice
      of critical constant. At the enlarged null the one-sample alpha = 0.01 value
      is 0.001593354 and the unequal-size two-sample value is 0.004780061; the plateau
      band begins at 0.003214927. A PLATEAU outcome therefore rejects under BOTH calibrations,
      and a DECAY outcome not-rejects under both. The calibration choice is decided
      above because the task requires it and because it governs the ARM 2 rules and
      the reported p-values; it is not what decides ARM 1.'
  cell:
    id: CELL-16
    role: THE ONLY CELL. This contract runs one cell.
    construction: harness.toycurve.generate_instance(seed=4403, field_bits=16), then
      harness.semaev.build_factor_base(inst, size=512, seed=4403)
    bits_names_the_FIELD_prime: RT047-B5 discipline. `bits` names the field prime
      p and nothing else. No sentence in any deliverable may say "at 16 bits" without
      saying it is the FIELD.
    expected_constants_frozen_from_the_BATCH_028_record:
      p: 62897
      a: 21062
      b: 40159
      X_equals_p_squared: 3956032609
      factor_base_size: 512
      factor_base_sha256: 93bef1529def8c1d00ea2c96272580f456c75f47b014f381d957bc546e8c31b4
      provenance: These are FROZEN INPUTS quoted from BATCH-028's immutable RESULTS.json,
        not measurements of this task. They appear here so that INTEG-B is a hard
        equality check rather than a re-derivation the executor could rationalize.
  treatment_arm:
    id: T-REAL
    definition: "Identical in every respect to BATCH-028's arm 16/A-REAL: for every\
      \ pair (i, j) with 0 <= i < j < 512, f_ij(Z) = S_3(x_i, x_j, Z) mod p written\
      \ as c_2*Z^2 + c_1*Z + c_0 with\n  c_2 = (x_i - x_j)^2, c_1 = -2*((x_i + x_j)*(x_i*x_j\
      \ + a) + 2*b),\n  c_0 = (x_i*x_j - a)^2 - 4*b*(x_i + x_j)   (all mod p);\ne_1\
      \ = (-c_1)*c_2^(-1) mod p, e_2 = c_0*c_2^(-1) mod p, lifted to [0, p); N_ij\
      \ = e_1*p + e_2 + 1 in [1, p^2]   (encoding ENC-B); z_ij = ln(N_ij)/ln(LPF(N_ij))\
      \ for N_ij > 1."
    enumeration_rule_as_code: "pairs = []\nfor i in range(512):\n    for j in range(i\
      \ + 1, 512):     # j starts strictly above i\n        pairs.append((i, j))\n\
      assert len(pairs) == 130816         # C(512, 2)\n"
    no_post_hoc_filter: The diagonal is excluded BY THE LOOP BOUNDS. No filter, skip
      or continue may be applied to the pair set. An implementation that builds i
      <= j and removes the diagonal VIOLATES THIS CONTRACT and its run is invalid_measurement.
    n_T: 130816
    it_is_exhaustive_and_carries_no_randomness: T-REAL has no seed, no draw and no
      sampling step. It is a deterministic function of (p, a, b, FB). This is the
      fact the calibration decision above rests on, and INTEG-A turns it into a checkable
      claim.
    it_is_held_fixed_in_both_arms: 'NOTHING about the treatment arm changes between
      BATCH-028 and this contract, and nothing about it changes between ARM 1 and
      ARM 2. That is the design: only the null side moves.'
  pipeline:
    shared_function_requirement: Every arm - treatment, uniform null, support-matched
      null, contamination source - is pushed through ONE shared function computing
      factorization, LPF, z, ladder indicators and the ECDF. The arms differ by their
      input iterator ONLY. No code path may differ anywhere else.
    factoring_backend:
      library: sympy
      version_pinned: 1.14.0
      version_policy: The runtime-observed sympy.__version__ and sys.version are recorded.
        If the observed version differs from 1.14.0 the run proceeds and RECORDS THE
        DEVIATION; it never silently substitutes.
      calls: sympy.factorint(N); sympy.isprime(q) for every returned base q.
      forbidden: No alternate backend, no probabilistic early exit, no partial factorization,
        no cached factor table shared across arms, no precomputed smooth-number list.
      memory_discipline: Aggregates are streamed; per-record certificates are NOT
        accumulated in memory. RUN-SMTH-PILOT-002 died at 4.31 GB RSS from certificate
        accumulation and BATCH-028 recorded the same discipline as its deviation D8.
        Repeat the discipline, not the failure.
    sampler:
      method: 'Rejection sampling of unbiased integers from SHA-256-derived bit strings.
        To draw uniformly in [1, X]: take k = X.bit_length() bits per attempt, big-endian
        as v, accept iff 1 <= v <= X, else discard and redraw. To draw uniformly in
        [0, p): take k = p.bit_length() bits, accept iff v < p.'
      modulo_reduction_forbidden: MODULO REDUCTION IS FORBIDDEN. It biases the low
        end of the range and the bias is in the smooth direction.
      stream: Bytes are SHA-256(domain || ":" || object || ":" || bits || ":" || counter)
        with domain = "EXP-SMTH-e932e8/v1", counter a decimal uint64 starting at 0,
        incremented per 32-byte block. UTF-8, ":" separated, no padding.
      why_the_domain_string_differs_from_BATCH_028: BATCH-028 used domain "EXP-SMTH-4403c4/v1".
        This contract uses "EXP-SMTH-e932e8/v1", so every null record drawn here is
        INDEPENDENT of every null record drawn there. Independence is required by
        DR-A1c, whose exchangeability argument fails if any draw is shared or derived.
    stream_objects:
      NULL-BIG: the 8x uniform null of ARM 1, drawn on [1, X].
      SUPP: the support-matched null of ARM 2, drawn as (e_1, e_2) pairs on [0, p)
        x [0, p) with rejection on the Legendre condition.
      FLOOR-SRC: the ENC-A contamination source of the ARM 3 diagnostic, drawn as
        (e_1, e_2) pairs on [0, p) x [0, p).
    seeds_and_randomness_to_record:
    - master/curve/factor-base seed 4403 (fixed, matches BATCH-028 so that T-REAL
      reproduces)
    - domain string "EXP-SMTH-e932e8/v1" and the three stream objects above
    - the statement that T-REAL carries no randomness
    - any other source of randomness, including none
    certificate:
      kind: factorization_reconstruction
      verification_rule: 'For every integer in every arm, code that does not call
        factorint again asserts: every returned base is prime under sympy.isprime,
        every exponent is >= 1, and prod(q**e) == N exactly as Python integers. LPF
        is max(bases) with LPF(1) := 1.'
      independence_requirement: In addition, a deterministic 1-in-1000 subsample (sequential_index
        mod 1000 == 0) of every arm is re-factored by an INDEPENDENT trial-division
        + Pollard-rho routine in the driver that does not import sympy's factorization
        path, and must agree on the full factorization.
      failure_handling: A factorization that fails, errors or exceeds its 5 s per-integer
        timeout is RECORDED with its index and EXCLUDED from that arm's statistics.
        It is NEVER imputed, never redrawn and never silently dropped. A timeout is
        resource exhaustion, not evidence.
      exclusion_tolerance: If exclusions plus N == 1 records exceed 0.1 percent of
        any arm's n, the affected arm's outcome is INSTR (see the outcome map) and
        no distributional label is read from it.
    reported_only_context: For every new arm the executor ALSO reports the smooth
      COUNTS at the frozen CELL-16 ladder Bsm in [65536, 1626, 256, 84, 40], the tie
      structure, and the top-16 z values. THESE CARRY NO DECISION RULE IN THIS CONTRACT.
      They are reported for continuity with BATCH-028 and for the reviewers, and no
      rule below reads them.
  arm_1:
    id: ARM-NULLSCALE
    one_sentence: Hold the treatment arm fixed at its exhaustive 130816 records, multiply
      ONLY the null by 8, and ask whether the CELL-16 KS statistic decays like m^(-1/2)
      as it must if it is null-side sampling noise.
    the_logic: D = sup |F_T - F_null,m| decomposes into a fixed separation delta =
      sup |F_T - F_null,population| plus null-side sampling fluctuation of typical
      size ~ m^(-1/2). If delta = 0 the whole of BATCH-028's D = 0.004808 was fluctuation
      and D must shrink by about sqrt(8) = 2.828 when m grows 8x. If delta > 0 and
      comparable to 0.004808, D cannot shrink below delta no matter how large m grows.
      The two hypotheses make numerically disjoint predictions at m = 8n, and the
      bands below are set BEFORE any datum exists.
    null_arm:
      id: N-BIG
      draw: m8 = 1046528 integers uniform on [1, X], X = p^2 = 3956032609, stream
        object NULL-BIG, indices 0 .. 1046527 in stream order.
      multiplier: 8x the BATCH-028 null size of 130816
      blocks: 'The draw is partitioned by index into 8 DISJOINT contiguous blocks
        of 130816: block b = indices [b*130816, (b+1)*130816) for b = 0..7. Blocks
        are used by DR-A1b and DR-A1c and by the ARM 3 diagnostic; they are a partition
        of the same 1046528 records, not extra draws.'
      nested_prefixes: m1 = 130816 (block 0), m2 = 261632 (blocks 0-1), m4 = 523264
        (blocks 0-3), m8 = 1046528 (blocks 0-7). The prefixes are NESTED by construction,
        so the decay curve is monotone in information and not four independent samples.
    frozen_numeric_inputs_from_BATCH_028:
      D_028_CELL16: 0.004808280332681103
      D_028_signed_F_real_minus_F_null: 0.004808280332681103
      note: A recorded constant from an immutable record, used as the reference point
        of the pre-registered bands. Quoting it here does not re-score BATCH-028.
    pre_registered_constants:
      one_sample_alpha_0.01_critical_values:
        m1_130816: 0.004506684668638803
        m2_261632: 0.0031867072898639458
        m4_523264: 0.0022533423343194013
        m8_1046528: 0.0015933536449319729
      rounding_rule_for_the_frozen_bands: The band edges in DR-A1 are stated to nine
        decimals (0.001593354 and 0.003214927). THE NINE-DECIMAL LITERALS ARE THE
        BINDING NUMBERS; they are the roundings of 1.63/sqrt(1046528) = 0.0015933536449319729
        and of 0.004808280332681103 - 0.0015933536449319729 = 0.00321492668774913.
        The difference is below 1e-9 and cannot change any comparison at the resolution
        of a KS statistic on 1046528 records, but the literals bind so that no reader
        has to reconstruct a rounding after the fact.
      kolmogorov_reference_quantiles_of_sqrt(m)*D:
        median: 0.827574
        q90: 1.223848
        q95: 1.358099
        q99: 1.627624
        mean: 0.868731
      point_prediction_under_pure_noise_at_m8: 0.001699984
      point_prediction_note: 0.001699984 = D_028/sqrt(8), the value D would take at
        m8 if it scaled exactly as m^(-1/2) from the BATCH-028 realization. A POINT
        PREDICTION, not a threshold; the thresholds are the bands below.
      provenance_of_every_number_above: Computed in the authoring task from closed
        forms - 1.63/sqrt(m) with the alpha = 0.01 two-sided KS constant already frozen
        in EXP-DS-001 and reused unchanged, and the Kolmogorov CDF P(K <= x) = 1 -
        2*sum_{k>=1} (-1)^(k-1) exp(-2 k^2 x^2) inverted numerically. They are properties
        of the frozen design, NOT measurements of any sample. NO factorization and
        NO datum was produced in writing them.
    DR-A1:
      name: PRIMARY - DECAY versus PLATEAU at the 8x null
      statistic: D8 = sup_t | F_T(t) - F_N-BIG,m8(t) | over the pooled z sample, F_T
        the exhaustive treatment ECDF
      calibration: one-sample at m = 1046528, per CAL-e932e8
      bands_frozen_before_any_datum:
        A1-DECAY_fires_iff: D8 <= 0.001593354
        A1-PLATEAU_fires_iff: D8 >= 0.003214927
        A1-INTERMEDIATE_fires_iff: 0.001593354 < D8 < 0.003214927
      band_derivation:
        decay_edge: 0.001593354 = 1.63/sqrt(1046528), the one-sample alpha = 0.01
          critical value at the enlarged null. Under delta = 0 the probability of
          landing above it is 0.01 (conservative under ties).
        plateau_edge: 0.003214927 = 0.004808280332681103 - 1.63/sqrt(1046528), i.e.
          the BATCH-028 statistic less the alpha = 0.01 noise allowance at the enlarged
          null. Under a true separation delta equal to the BATCH-028 statistic, D8
          >= delta - sup-noise, so the probability of landing below this edge is at
          most 0.01 by the same allowance.
      interpretation_of_each_band_stated_in_advance:
        A1-DECAY: The statistic fell to the level that pure null-side sampling noise
          predicts. The BATCH-028 CELL-16 near-miss is then attributable to the finite
          null, and the one-sample-versus-two-sample calibration question DISSOLVES
          because under either calibration the enlarged comparison not-rejects. This
          FALSIFIES the proposition "there is a real separation of the size BATCH-028
          observed".
        A1-PLATEAU: The statistic did not decay. A separation of that size survives
          an 8x null, so it is not null-side noise, and the stricter one-sample reading
          of the BATCH-028 number is the correct one. This FALSIFIES the proposition
          "the BATCH-028 CELL-16 statistic was sampling noise". It does NOT retroactively
          change BATCH-028's frozen verdict and no deliverable may say that it does.
        A1-INTERMEDIATE: 'A NAMED, EXPECTED, LEGITIMATE OUTCOME, NOT A RESIDUAL. The
          statistic decayed partially: consistent with a true separation smaller than
          the BATCH-028 realization but larger than zero, and this design cannot resolve
          which. Neither proposition is falsified. See reach_and_power for exactly
          what would resolve it.'
      what_it_cannot_do: Neither band says anything about HEUR-DS-1, about the deep-smooth
        regime, or about any other cell, curve or factor base.
    DR-A1b:
      name: SECONDARY, REPORTED-ONLY - the decay curve and its log-log slope
      statistic: D(m) at m in {130816, 261632, 523264, 1046528} from the nested prefixes,
        and the ordinary-least-squares slope beta of log D(m) against log m over those
        four points.
      reference_bands: DECAY-CONSISTENT if beta <= -0.35; PLATEAU-CONSISTENT if beta
        >= -0.15; NEITHER otherwise. Under delta = 0 the expectation is beta = -0.5;
        under a plateau, beta = 0.
      no_decision_weight: REPORTED ONLY. Four nested, dependent points give a noisy
        slope and this rule NEVER overrides DR-A1. If DR-A1b disagrees with DR-A1,
        the executor REPORTS THE DISAGREEMENT and does not adjudicate it.
    DR-A1c:
      name: SECONDARY, REPORTED-ONLY - empirical, tie-aware calibration of D at m
        = n from the 8 blocks
      statistic: D_b = sup |F_T - F_block_b| for b = 0..7, each an independent null
        of size 130816 against the SAME fixed treatment CDF, i.e. each exchangeable
        with the way BATCH-028's D was computed. Report all eight values, their min,
        median and max, and the rank of the frozen constant 0.004808280332681103 among
        the nine values {D_028, D_0..D_7}.
      exact_nominal_level_and_its_limit: Under the noise hypothesis and independence
        of the two streams, all nine are exchangeable, so P(D_028 is strictly the
        largest) = 1/9 = 0.1111. THAT IS THE SMALLEST p-VALUE THIS CHECK CAN EVER
        PRODUCE; it cannot reach alpha = 0.01 and is therefore reported as a descriptive
        calibration, never as a test. Its value is that it is TIE-AWARE - it is built
        from the same discrete z pipeline - so it measures directly what the Kolmogorov
        approximation only approximates.
      explicitly_not_a_re_scoring: D_028 enters as a recorded constant in a NEW nine-way
        comparison defined by THIS contract. BATCH-028's verdict is untouched.
    arm_1_cost:
      factorizations: 1046528 (null) + 130816 (treatment recompute) = 1177344
      estimated_wall_seconds_MODELED: About 60 s of factoring, MODELED by dividing
        the count by the MEASURED BATCH-028 throughput of 130816 records in 4.03 to
        5.02 s across 4 workers (run_manifest.json per_arm_records). The 60 s figure
        is MODELED, not measured; the BATCH-028 throughput it divides is MEASURED.
  arm_2:
    id: ARM-SUPPORT
    the_observation_it_answers: BATCH-028's run_manifest OBS-1 records that INTEG-3
      found ALL 130816 pairs have both roots of f_ij in F_p at both cells (roots_checked
      = 261632, bad_root_checks = 0). Both roots in F_p is equivalent to the discriminant
      e_1^2 - 4*e_2 being a square mod p. So the treatment's (e_1, e_2) pairs live
      on a subset of [0, p) x [0, p) of density about 1/2, while BATCH-028's A-NULL
      and A-IDENT drew from the whole grid. The two arms are provably not the same
      distribution on (e_1, e_2), and no pre-registered rule there observed it.
    why_the_restriction_is_derivable_and_not_merely_observed: For distinct x-coordinates
      x_i, x_j of points P_i, P_j in E(F_p), the roots of S_3(x_i, x_j, Z) are the
      x-coordinates of P_i + P_j and P_i - P_j, which are x-coordinates of F_p-rational
      points and hence lie in F_p. Therefore the discriminant is a square in F_p for
      EVERY emitted pair, by derivation, and BATCH-028's 130816-of-130816 observation
      is the measured confirmation of it. INTEG-D below tests the derivation rather
      than assuming it, and names the outcome if it fails.
    support_definition:
      S_sq: '{ (e_1, e_2) in [0,p) x [0,p) : e_1^2 - 4*e_2 mod p is a square, i.e.
        Legendre symbol in {0, +1} }'
      cardinality: p*(p+1)/2 = 62897*62898/2 = 1978047753
      density_relative_to_the_full_grid: 1978047753 / 3956032609 = 0.5000079495047458
      derivation_of_the_cardinality: For each of the p values of e_1, the map s ->
        e_2 = (e_1^2 - s)/4 is a bijection from F_p to F_p (4 is invertible since
        p is odd), so the admissible e_2 are exactly the images of the (p+1)/2 squares
        including 0. Hence |S_sq| = p*(p+1)/2, computed in this task by exact integer
        arithmetic on the frozen p; it is a property of the design, not a measurement.
      zero_discriminant_is_INCLUDED: 'Legendre 0 (repeated root) is INCLUDED in S_sq.
        Decided here, before any datum, so it cannot be tuned later. Rationale: a
        repeated root is the degenerate case of "both roots in F_p", it is the case
        the derivation above covers, and it carries weight 1/p per e_1, so excluding
        it would change the support by O(1/p) while introducing a data-dependent choice.'
      the_support_definition_is_NOT_data_dependent: S_sq is defined by the derivation
        above and by the frozen p ALONE. It is not fitted to the treatment sample,
        and no quantity in ARM 2's rules is a function of the treatment arm. INTEG-D
        measures the treatment's actual discriminant classes but does NOT feed the
        support definition; it can only trigger the named MIS-SPECIFIED-SUPPORT outcome.
    null_arm:
      id: N-SUPP
      n_S: 130816
      draw: Draw e_1 uniform on [0, p) and e_2 uniform on [0, p) by the shared rejection
        sampler on stream object SUPP; ACCEPT iff legendre(e_1^2 - 4*e_2 mod p, p)
        in {0, +1}, else discard BOTH components and redraw. This yields the exactly-uniform
        distribution on S_sq; acceptance probability is (p+1)/(2p) = 0.500008.
      forbidden_alternative_sampler: 'Drawing s = t^2 for t uniform on [0, p) and
        setting e_2 = (e_1^2 - s)/4 is FORBIDDEN: it gives weight 2/p to each nonzero-square
        discriminant and 1/p to the zero discriminant, which is NOT uniform on S_sq.'
      encoding: ENC-B, N = e_1*p + e_2 + 1, identical to the treatment and to the
        uniform null.
    comparators:
      N-UNIF-BLOCK0: block 0 of ARM 1's N-BIG draw, 130816 uniform records on [1,
        X]. Reused, not redrawn; it is the same object BATCH-028's A-NULL was, at
        the same size, on an independent stream.
    DR-A2a:
      name: PRIMARY FOR ARM 2 - is the support restriction visible to this instrument
        at all?
      statistic: D_SU = sup |F_N-SUPP - F_N-UNIF-BLOCK0|
      calibration: TWO-sample, both arms sampled, n1 = n2 = 130816, per CAL-e932e8
      threshold: T2 = 1.63*sqrt(1/130816 + 1/130816) = 0.006373414579727891
      outcomes:
        A2-SUPPORT-DETECTED_fires_iff: D_SU > 0.006373414579727891
        A2-SUPPORT-NOT-DETECTED_fires_iff: D_SU <= 0.006373414579727891
    DR-A2b:
      name: THE CORRECTLY-SUPPORTED COMPARISON - treatment against the support-matched
        null
      statistic: D_TS = sup |F_T - F_N-SUPP|, and for direct comparison D_TU = sup
        |F_T - F_N-UNIF-BLOCK0| on the same block
      calibration: one-sample at m = 130816, per CAL-e932e8
      threshold: 0.004506684668638803
      reported_labels: TS-REJECT iff D_TS > threshold else TS-NOT-REJECT; TU-REJECT
        iff D_TU > threshold else TU-NOT-REJECT
      status: REPORTED WITH ITS LABEL, and it is the comparison a correctly-specified
        version of BATCH-028's DR-1 would have made. It is NOT a verdict about HEUR-DS-1
        and the executor states the label only.
    pre_registered_interpretation_both_directions:
      if_A2-SUPPORT-NOT-DETECTED: 'THIS DOES NOT CLEAR THE SUPPORT MISMATCH, AND NO
        DELIVERABLE MAY SAY THAT IT DOES. Stated flatly because the red team will
        be asked exactly this. What it establishes is an UPPER BOUND: a derivable,
        ~50-percent-of-support structural restriction, present with certainty in every
        treatment record, produces a z-CDF displacement no larger than this instrument''s
        detection floor of 0.006374 at n = 130816. That is FAILURE TO DETECT, not
        absence of an effect, and the two are not interchangeable. It cuts in a direction
        that is uncomfortable rather than reassuring: it measures the BLINDNESS OF
        THE PROJECTION, and it bounds what a not-reject of the treatment against a
        uniform null can ever mean, because a statistic that cannot see a proven structural
        difference cannot certify the absence of structure. The forbidden words on
        this outcome are "cleared", "resolved", "harmless", "irrelevant" and "ruled
        out". The permitted statement is: "the support restriction produced no displacement
        this instrument could detect at this n, and the detection floor is X" - with
        X the measured floor from the ARM 3 diagnostic if it ran, or the nominal 0.006374
        if it did not.'
      if_A2-SUPPORT-DETECTED: 'The uniform null was MIS-SPECIFIED as a comparator
        for this treatment: the treatment cannot be compared to a distribution supported
        on twice the set it occupies without confounding the support restriction with
        whatever else is being tested. The correctly-specified comparison is DR-A2b''s
        D_TS, and any future contract in this line must use a support-matched null.
        This does NOT re-score BATCH-028, whose frozen verdict stands as a reading
        against the null it froze - now with a measured reason to regard that null
        as the wrong comparator.'
      the_joint_reading_that_must_be_reported_if_it_occurs: 'If A2-SUPPORT-DETECTED
        holds while TU-NOT-REJECT also holds - the support-matched null is distinguishable
        from the uniform null, yet the treatment is not - that combination is itself
        a reportable observation: it implies the treatment differs from its own support-matched
        null in a compensating direction. The executor REPORTS the three statistics
        side by side and offers no mechanism.'
      asymmetry_declared: The two directions are NOT symmetric in what they license.
        DETECTED is a positive finding about the comparator. NOT-DETECTED is a bound
        on an instrument, never a finding about the object.
    arm_2_cost:
      factorizations: 130816 (N-SUPP); the treatment and block-0 arms are already
        computed by ARM 1 and are reused, not recomputed.
      estimated_wall_seconds_MODELED: about 6 s of factoring plus rejection-sampling
        overhead, MODELED from the same MEASURED BATCH-028 throughput.
  arm_3:
    id: DIAG-FLOOR
    status: DIAGNOSTIC ONLY, ZERO DECISION WEIGHT IN EVERY RULE ABOVE. It exists solely
      to put a MEASURED number on the phrase "detection floor" that ARM 2's NOT-DETECTED
      interpretation leans on. If the budget is tight it is the FIRST work dropped,
      and dropping it costs no rule.
    construction: 'Contamination source: 130816 records N = max(u,1)*max(v,1) with
      u, v drawn uniformly on [0, p) by the shared rejection sampler on stream object
      FLOOR-SRC. This is the ENC-A arithmetic encoding, derivably smoother than a
      uniform integer on [1, p^2] - BATCH-028 measured D_power = 0.6279 for it. For
      each eps on the frozen grid, form C(eps) = the first (130816 - k_eps) records
      of N-BIG block 1 followed by the first k_eps records of the contamination source,
      with k_eps = floor(eps*130816).'
    eps_grid_frozen:
    - 0.0
    - 0.005
    - 0.01
    - 0.02
    - 0.05
    - 0.1
    k_eps_frozen:
    - 0
    - 654
    - 1308
    - 2616
    - 6540
    - 13081
    statistic: D_floor(eps) = sup |F_C(eps) - F_N-BIG block 2|, two-sample, both sampled,
      threshold 0.006373414579727891
    reported: the full D_floor(eps) table and the SMALLEST eps on the grid at which
      D_floor(eps) > the threshold.
    honest_limit: A grid of six points bounds the floor only to within a grid step,
      and the contamination direction is ENC-A smoothness, which is one particular
      alternative and not a general one. Reported as such.
    arm_3_cost: 130816 factorizations, about 6 s MODELED at the same MEASURED throughput.
      Blocks 1 and 2 are already factored by ARM 1.
  integrity_checks:
  - id: INTEG-H
    check: sha256 of THIS file recomputed by the executing task equals contract_sha256
      in coordination/goals/GOAL-ECDLP-001/batches/BATCH-029/tasks/TASK-20260802-979fae/freeze_receipt.json,
      AND the approval record at coordination/goals/GOAL-ECDLP-001/batches/BATCH-029/approvals/APPROVAL-EXP-SMTH-e932e8.yaml
      EXISTS, has determination exactly `APPROVED`, and names that same sha256.
    on_failure: HALT BEFORE THE FIRST DATUM. The run does not start. Record the check
      and its outcome in the run manifest either way.
  - id: INTEG-A
    check: The recomputed treatment arm's N-sequence sha256 equals BATCH-028's recorded
      16/A-REAL value c8c07aab6e5ce0009c530a0bb73fbf8c93b210778d0f8b64c0cbd3d2ab978773,
      in the same i<j order, count 130816, N_min 27543, N_max 3956022243.
    on_failure: invalid_measurement, HALT. A treatment arm that does not reproduce
      is a different object and no comparison here is meaningful.
    why_it_is_the_most_important_check: The whole design rests on the treatment being
      fixed and exhaustive. This check is what makes that a verified fact rather than
      an assertion, and it is simultaneously an independent re-implementation check
      of the pipeline.
  - id: INTEG-B
    check: p == 62897, a == 21062, b == 40159, X == p**2 == 3956032609, len(FB) ==
      len(set(FB)) == 512, sha256(FB) == 93bef1529def8c1d00ea2c96272580f456c75f47b014f381d957bc546e8c31b4,
      and every x in FB lifts to a point of E(F_p).
    on_failure: invalid_measurement, HALT before any pair is formed.
  - id: INTEG-C
    check: enumeration is i<j by loop bounds, exactly 130816 pairs, strictly increasing
      in (i, j) lexicographic order, no pair with i == j, and c_2 != 0 mod p for every
      pair.
    on_failure: invalid_measurement for the whole run. Not handled by skipping a pair.
  - id: INTEG-D
    check: Over all 130816 treatment pairs, classify disc = e_1^2 - 4*e_2 mod p by
      Legendre symbol and report the three exact counts d_zero, d_square, d_nonsquare.
      The derivation in arm_2 predicts d_nonsquare == 0.
    on_failure: 'If d_nonsquare > 0 the support derivation is WRONG and S_sq is the
      wrong support. ARM 2''s outcome is then A2-MIS-SPECIFIED-SUPPORT: the counts
      are reported in full, DR-A2a and DR-A2b are reported as computed with an explicit
      note that their support premise failed, and NO support interpretation is read
      from them. The support definition is NOT adjusted mid-run to fit the counts.'
  - id: INTEG-E
    check: Every accepted N-SUPP draw satisfies legendre(e_1^2 - 4*e_2, p) in {0,
      +1}; report the acceptance rate against the derived 0.500008; report the count
      of accepted draws with Legendre 0.
    on_failure: invalid_measurement for ARM 2 only; ARM 1 is unaffected and is reported.
  - id: INTEG-F
    check: The sampler uses rejection only; no modulo reduction appears on any draw
      path. Verified by reading the sampler, and by asserting the drawn ranges. The
      stream domain string is exactly "EXP-SMTH-e932e8/v1" and differs from BATCH-028's,
      so no null record is shared or derived.
    on_failure: invalid_measurement.
  - id: INTEG-G
    check: the certificate rule and the independent 1-in-1000 re-factorization of
      every arm, per pipeline.certificate.
    on_failure: invalid_measurement.
  - id: INTEG-I
    check: The 8 blocks are index-disjoint, cover exactly 1046528 records, and the
      nested prefixes m1 < m2 < m4 < m8 are prefixes of the same stream order. No
      record is counted in two arms except by the explicit reuse declared above (block
      0 in ARM 2, blocks 1-2 in ARM 3), and every such reuse is reported.
    on_failure: invalid_measurement.
  outcome_map:
    there_is_no_global_verdict: This contract issues NO combined verdict and no statement
      about HEUR-DS-1. Each arm gets one label from its own list. Combining them into
      a judgment is the Reviewer's and Coordinator's work, not the Executor's.
    instrument_gate: An arm's distributional label is ADMISSIBLE only if INTEG-H,
      INTEG-A, INTEG-B, INTEG-C, INTEG-F, INTEG-G and INTEG-I pass and that arm's
      exclusions are within tolerance. Otherwise the arm's label is INSTR and nothing
      is said in either direction.
    arm_1_outcomes:
    - id: A1-DECAY
      meaning: D8 <= 0.001593354. Falsifies "there is a real separation of the size
        BATCH-028 observed".
    - id: A1-PLATEAU
      meaning: D8 >= 0.003214927. Falsifies "the BATCH-028 CELL-16 statistic was sampling
        noise".
    - id: A1-INTERMEDIATE
      meaning: strictly between the bands. Named in advance, expected with non-negligible
        probability, falsifies neither. NOT a residual and NOT rounded toward either
        band.
    - id: A1-INSTR
      meaning: instrument gate failed. No disposition in either direction. AGENTS.md
        rule 3.
    - id: A1-BUDGET
      meaning: a ceiling, timeout, crash or resource exhaustion stopped the arm. Resource
        exhaustion, never evidence, never a negative_observation.
    arm_2_outcomes:
    - id: A2-SUPPORT-DETECTED
      meaning: D_SU > 0.006373. The uniform null is a mis-specified comparator for
        this treatment.
    - id: A2-SUPPORT-NOT-DETECTED
      meaning: D_SU <= 0.006373. An upper bound on the effect at this n and a measurement
        of the projection's blindness. NOT a clearance of the mismatch.
    - id: A2-MIS-SPECIFIED-SUPPORT
      meaning: INTEG-D found d_nonsquare > 0, so S_sq is the wrong support. Counts
        reported; no support interpretation read.
    - id: A2-INSTR
      meaning: instrument gate or INTEG-E failed for this arm.
    - id: A2-BUDGET
      meaning: budget or infrastructure stopped the arm. Not evidence.
    arm_3_outcomes:
    - id: A3-REPORTED
      meaning: the floor table was computed. Diagnostic only.
    - id: A3-DROPPED
      meaning: dropped for budget or gate reasons, with the stamp that stopped it.
        Costs no rule.
    inconclusive_is_a_legitimate_outcome: DECLARED IN ADVANCE. A1-INTERMEDIATE, A1-INSTR,
      A1-BUDGET, A2-INSTR, A2-BUDGET and A2-MIS-SPECIFIED-SUPPORT are legitimate terminal
      outcomes. None may be reported, summarized or cited as support or as refutation
      of anything, and no deliverable may round an inconclusive reading toward a band.
    reporting_rule: Every measured value is reported beside its pre-registered threshold,
      in the same record, with the label. A result that falsifies BATCH-028's headline
      reading is reported plainly and is not softened. A result that does not is reported
      equally plainly.
  reach_and_power:
    arm_1_is_adequately_powered_for_the_question_asked: 'ARM 1 cleanly separates the
      two hypotheses the batch exists to separate: delta = 0 (pure noise) and delta
      ~ 0.0048 (a separation of the size BATCH-028 saw). Each band has nominal error
      probability <= 0.01 under its respective point hypothesis, and the bands are
      disjoint by construction with a gap of 0.001622 between them.'
    arm_1_gap_stated_without_euphemism: 'ARM 1 CANNOT RESOLVE A TRUE SEPARATION IN
      THE MIDDLE RANGE, roughly 0.0016 < delta < 0.0032. Such a delta lands in A1-INTERMEDIATE,
      which is a real possibility and not a remote one: D_028 = 0.004808 is itself
      one noisy realization, so if a separation exists its point estimate is BELOW
      0.004808 and the middle range is exactly where a modest true delta would sit.'
    what_would_be_needed_to_close_the_gap: "To place a true delta cleanly outside\
      \ both bands requires the noise allowance 1.63/sqrt(m) to be at most delta/2,\
      \ i.e. m >= (3.26/delta)^2:\n  delta = 0.0032 needs m >= 1.04e6  (about 8x the\
      \ BATCH-028 null; already met here)\n  delta = 0.0024 needs m >= 1.85e6  (about\
      \ 14.1x)\n  delta = 0.0016 needs m >= 4.15e6  (about 31.7x)\n  delta = 0.0012\
      \ needs m >= 7.38e6  (about 56.4x)\nThe null side is cheap - 8x costs about\
      \ 40 s of factoring at BATCH-028's MEASURED throughput, so 32x would cost about\
      \ 160 s and 64x about 320 s. IF THE COORDINATOR WANTS THE MIDDLE RANGE RESOLVED\
      \ IN THIS BATCH, THE HONEST MOVE IS TO APPROVE A LARGER MULTIPLIER NOW, BEFORE\
      \ ANY DATUM, RATHER THAN AFTER SEEING A1-INTERMEDIATE. This contract freezes\
      \ 8x because the dispatch names 8x; the number is a design parameter, not a\
      \ physical limit, and raising it is a superseding contract, never an edit."
    the_structural_limit_that_more_null_cannot_fix: STATED PLAINLY BECAUSE IT BOUNDS
      EVERY FUTURE CONTRACT IN THIS LINE. Under the two-sample framing the detection
      floor for any treatment-versus-null comparison is 1.63*sqrt(1/n_T + 1/m), which
      as m -> infinity tends to 1.63/sqrt(130816) = 0.004507 and NEVER goes below
      it. The treatment side is capped at n_T = C(512,2) = 130816 because it is exhaustive.
      Lowering that floor requires a LARGER FACTOR BASE - n = C(Bfb,2), so Bfb = 2048
      gives 2096128 pairs and Bfb = 8192 gives 33550336 - not more null draws. Under
      the one-sample framing adopted here the floor does fall as 1.63/sqrt(m), which
      is precisely why ARM 1 is worth running at all.
    arm_2_power_stated_honestly: DR-A2a detects a z-CDF displacement between the support-matched
      and uniform nulls only if it exceeds 0.006373 at n = 130816. A smaller displacement
      is INVISIBLE to this arm, and A2-SUPPORT-NOT-DETECTED must therefore be read
      as the bound it is. Halving that floor needs 4x the draws on BOTH sampled sides,
      about 25 s more factoring; that is affordable and is NOT done here only because
      the dispatch specifies one support-matched arm. A superseding contract wanting
      a tighter bound should enlarge both sampled arms together.
    is_this_contract_designed_to_come_back_inconclusive: No, and here is the honest
      accounting. ARM 1's primary question - decay or no decay at the BATCH-028 effect
      size - is answered decisively by this budget, under BOTH calibrations, and either
      answer falsifies a proposition that is live right now. ARM 2's DETECTED direction
      is decisive; its NOT-DETECTED direction is a bound and is declared as a bound
      in advance rather than dressed as a clearance. The one place this design can
      come back genuinely unresolved is a middle-range delta in ARM 1, and that possibility
      is named as a first-class outcome with the exact multiplier that would remove
      it. Nothing else in this contract is at risk of quiet inconclusiveness.
    what_this_budget_provably_does_not_reach: The deep-smooth regime (out of scope
      by construction), CELL-20, any second curve or factor-base seed, any replication
      across hosts, limb (b) of HEUR-DS-1, and any arithmetically live encoding other
      than the ENC-A contamination source of the ARM 3 diagnostic. None of these is
      attempted and no deliverable may imply otherwise.
  budget:
    wall_clock_seconds: 4800
    memory_gb: 8
    maximum_runs: 30
    maximum_factorization_calls: 1500000
    per_integer_factorization_timeout_seconds: 5
    maximum_workers: 4
    no_network: true
    total_planned_factorizations: 1438976
    total_planned_breakdown: 1046528 (N-BIG) + 130816 (T-REAL) + 130816 (N-SUPP) +
      130816 (FLOOR-SRC)
    cost_estimate_label: MODELED. About 60 to 70 s of factoring in total, obtained
      by dividing the planned count by BATCH-028's MEASURED throughput of 130816 records
      in 4.03 to 5.02 s on 4 workers. The estimate is MODELED; the throughput input
      is MEASURED; this authoring task measured nothing.
    priority_order_under_budget: ARM 1 first and to completion, then ARM 2, then ARM
      3. Work is dropped from the tail. An arm that cannot complete is labelled BUDGET
      with the stamp that stopped it and its partial data is NOT read against any
      rule.
    stop_semantics: Crossing any ceiling stops at the next record boundary. Resource
      exhaustion is never evidence about smoothness, HEUR-DS-1, H-SMTH-001, H-DS-001
      or ECDLP, and is never reported as a negative_observation.
    c2_clock: The executing task stamps start_utc, start_epoch, declared_wall_clock_seconds
      and a COMPUTED binding_stop_utc as its first act, stamps each section boundary,
      halts at the binding stop, and names the dropped work truthfully. Halting is
      full compliance.
