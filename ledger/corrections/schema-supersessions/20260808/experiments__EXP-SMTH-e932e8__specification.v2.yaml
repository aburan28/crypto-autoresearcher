  freeze_rule:
    statement: THIS CONTRACT IS FROZEN AT THE sha256 RECORDED IN coordination/goals/GOAL-ECDLP-001/batches/BATCH-029/tasks/TASK-20260802-979fae/freeze_receipt.json.
      ANY needed change - to an arm, a band, a threshold, the support definition,
