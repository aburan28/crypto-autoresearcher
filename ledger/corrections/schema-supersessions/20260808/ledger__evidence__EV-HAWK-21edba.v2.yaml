  corrections_to_prior_record:
  - 'EV-HAWK-68b8b6 claimed "our BATCH-56498f/d44912 derivation was about O-ideals
    (quaternion algebra) which correctly showed fractional O-ideals are infinite."
    CORRECTION: HAWK''s quaternion algebra A = (-1,-1|K) is TOTALLY DEFINITE (Section
    3.5 of paper). Our derivation used the local-global principle for INDEFINITE quaternion
    algebras (Claim 2.2 / Eichler/strong approximation). This principle does NOT apply
    to totally definite algebras where the norm form is positive definite and ideal
    counts behave differently.'
  what_actually_establishes_case_c: "Section 6.3 of iacr:2026/1318: \u03B2 is reduced\
    \ by Babai rounding with \u2016\u03B2\u2016 < O(n^{13/2}). This bounds the denominator\
    \ of accessible FRACTIONAL O_F-IDEALS in the NUMBER FIELD F = K(\u221A\u03B1)\
    \ (a Dedekind domain, NOT the quaternion algebra). The argument for infinite fractional\
    \ O_F-ideals is a DEDEKIND DOMAIN argument: - For a \u2208 O_K and I integral\
    \ with N_{F/K}(I) = a^2\xB7q'O_K, the\n  fractional ideal (1/a)\xB7I has relative\
    \ norm q'O_K\n- F = K(\u221A\u03B1) is a CM field (totally complex extension of\
    \ K) - O_F is a Dedekind domain; fractional ideals are well-defined - The number\
    \ of such (a, I) pairs grows with \u2016a\u2016, so the pool is\n  infinite as\
    \ a \u2192 \u221E\n- The bounded-\u03B2 constraint BOUNDS a (since a enters through\
    \ the Babai\n  reduction), placing the algorithm in Case C\nThis argument is INDEPENDENT\
    \ of the quaternion algebra type."
  kn_open_028_answers:
    q1: 'CLOSED (still valid via Dedekind domain / O_F argument, not quaternion).
      Case C: super-polynomial runtime. DEC-20260805-ed4cd3 stands.'
    q2: "CLOSED: Does the re-randomization idea survive? YES. Section 4 of the paper\
      \ explains: conjugating G by U produces DISTINCT nrd-PIP instances. The mechanism\
      \ is independent of the ideal count. What failed is Heuristic 4 (density of\
      \ \"easy\" instances is smaller than claimed). The re-randomization itself is\
      \ valid \u2014 the algorithm just needs more guesses than polynomial."
    q3: 'CLOSED: KN-OPEN-024 unaffected. Section 12 of paper confirms: "this attack
      does not break the quaternion nrdPIP." The reduction from module-LIP to nrd-PIP
      (Chevignard et al., [8]) remains valid. What failed is only the density estimate
      in Heuristic 4. KN-OPEN-024 (rank-1 quaternion PIP tractability) is not affected
      by this correction.'
  additional_observations_from_paper_body:
