  observations:
  - "Wesolowski 2026 Section 4.1 gives a deliberate LOWER BOUND of 2^{106.5} F_{p\xB2\
    }-operations at SQIsign NIST-I (p=5\xB72^248-1) by assuming 1 op/entry."
  - "Toy-scale implementation (8 primes, p~2^9 to 2^40) measured ops/entry scaling\
    \ as ~8.1 \xD7 2\xB7log\u2082(p), giving extrapolated ~4147 (2^{12}) at NIST-I."
  - "Corrected concrete cost estimate: 2^{118.5} to 2^{121.5} F_{p\xB2}-operations.\
    \ Red-team confirmed, adjusted to AES-equivalent 2^{120-123}."
  - "This is 5-8 bits below the 128-bit NIST-I target (theoretical). Red-team notes\
    \ the attack is MEMORY-INFEASIBLE at this scale (2^{92.5} entries \u2248 10^{29}\
    \ bytes exceeds all storage on Earth)."
  - "P\u2080 multiplicity (Remark 1) confirmed at toy scale (165-202\xD7 above theory)\
    \ but assessed as graph-size artifact unlikely to transfer to NIST-I."
  - 'Red-team verdict: SLIGHTLY UNDERSTATED. Gap survives at 6-8 bits below 128 (not
    9-12 as initially claimed). Practical security unchanged due to memory.'
  inference: The concrete-cost finding is a cost-model refinement of Wesolowski 2026,
    not a new algorithm. It tightens the security estimate from [2^{106.5}, 2^{128}]
    to [2^{118.5}, 2^{123}] at SQIsign NIST-I. The theoretical gap (6-8 bits below
    128) is real but the attack is memory-infeasible. This informs parameter selection
    but does not constitute a practical threat.
  boundaries:
  - "Theoretical cost model only \u2014 no attack was executed at NIST-I parameters."
  - Memory requirement (2^{92.5} entries) makes the attack physically impossible.
  - Extrapolation from toy scale (2^40) to NIST-I (2^256) carries uncertainty.
  - The ops/entry model uses schoolbook arithmetic, not optimized implementations.
  - "Does NOT account for \u221A\xE9lu optimization (confirmed inapplicable by red-team)."
  unresolved_confounds:
  - Optimal B at NIST-I may differ from the asymptotic formula. A precise numerical
    optimization could shift the estimate by 1-2 bits in either direction.
  - Time-memory tradeoffs (VW-style with smaller tables) would increase time but make
    the attack more practical. The tradeoff curve is not computed.
  - The AES-equivalence conversion is model-dependent (RAM vs hardware, amortized
    vs per-operation). Different models give 2-4 bits variation.
