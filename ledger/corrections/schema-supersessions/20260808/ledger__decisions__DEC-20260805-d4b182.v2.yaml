  context: 'BATCH-124 (three tracks from DEC-20260805-48b52e): (A) EXP-MTBK-306bdb
    BKK sparse-check reimplementation and smoke rerun (B) C_t-minimality promotion
    to KN-FIND (C) y-sign oracle control-object analysis (C7 follow-up)'
  findings:
  - track: A
    title: EXP-MTBK-306bdb v2 smoke
    items:
    - statement: v2 driver implements the correct BKK enumeration ((m-1)-tuples over
        F[:B/2], solve last element) per KN-FIND-c7d31e.
    - statement: 'Smoke gate PASSED under the corrected metric: theorem_index_test
        gamma_empirical 0.49997 vs theorem lower bound 0.5 (within 0.01%); speedup_empirical
        1.99988 vs theorem 2.0 at m=3, 200k trials.'
    - id: SMOKE-FIND-004
      status: resolved
      statement: 'The enumeration-based proxy gate (mean checks ratio >= 2^(m-1))
        was the wrong quantity: at F=230 targets have many decompositions, first-found
        position is not the theorem quantity (measured 1.09, not 4). The theorem''s
        statement is about the index distribution, verified directly.'
    - id: SMOKE-FIND-003
      status: open
      statement: 'Design honesty: the m=3 b=0.5 cell sits below the rescue window
        (descent >= sqrt(N), K* infinite). Rescue-window cells need b in {0.6, 0.7}
        or larger N; must be addressed in the full dataset amendment.'
  - track: B
    title: KN-FIND promotion
    results:
    - statement: KN-FIND-982fdf (C_t-minimality theorem) drafted with review_refs.
    - statement: 'Promotion is POLICY-CONSISTENT: qualified acceptance (Q1-Q3 presentation-level)
        recorded; wording stays attached to the review.'
  - track: C
    title: y-sign oracle
    results:
    - statement: 'y_sign_oracle.md: sign oracle S(P) = [y(P) < p/2] selects ~half
        the curve (probe 26218/26219 at p=52721), never a factor base. Sign cannot
        carve B << N; only the x-threshold family C_t does. Rejected as a factor-base
        selector (cardinality + probe).'
  decisions:
  - id: EXP-MTBK-306bdb
    decision: approve_full_dataset_conditional
    statement: 'APPROVE continued full-dataset development on condition: the Executor
      runs the v2 pipeline on the corrected factor-base and rescue-window cells, and
      a design amendment (SMOKE-FIND-003) including b in {0.6, 0.7} cells is REQUIRED
      before the dataset can test the rescue-window prediction. Experiment status
      stays ''functional smoke passed''; full dataset not yet dispatched. BATCH-125
      engages the Executor for the full run only after the rescue-window amendment.'
  - id: KN-FIND-982fdf
    decision: promoted
    statement: C_t-minimality theorem PROMOTED as a finding with review_refs. Qualified
      accept wording is attached to the review record, not silent.
  - id: y-sign-factor-base
    decision: rejected
    statement: y-sign factor-base selector REJECTED (cardinality floor + toy probe).
      The oracle's control value is preserved under BATCH-060 tier-3 classification.
  - id: provenance
    decision: disclosed
    statement: Subagents returned no artifacts for the executor/reviewer dispatches
      (BATCH-120..124 pattern); coordinator authored the v2 driver, ran it, and verified
      the probe. Disclosed in receipts and execution-report.
  decision_scope: Covers the BKK reimplementation smoke, the KN-FIND promotion, and
