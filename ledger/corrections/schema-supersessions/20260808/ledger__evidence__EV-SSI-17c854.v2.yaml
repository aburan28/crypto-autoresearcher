  observations:
  - 'EXP-SSI-S1 executed: 3 replicate runs of chi2_7 test on KLPT kernel-scalar residues
    mod 7 at p=6143, D=2^17, K=5 keys, n=400 transcripts/key.'
  - 'CLEAN NEGATIVE: No per-key test rejects at corrected alpha=0.0002. No aggregate
    test rejects at alpha=0.001. Largest aggregate chi2_7 = 20.942 (Run 2, p=0.0019)
    does not cross preregistered threshold.'
  - Simulator and controls consistent with chi-squared(6) null. Mutual information
    I(residue; key) near zero (0.0067-0.0071 bits). Diagnostic control (independent
    vs simulator) KS p-values 0.72-1.00.
  - 'Baseline pool: all 688 norm-D quaternion elements have near-uniform s mod 7 distribution
    (chi2=1.07, p=0.983).'
  - 'Implementation qualified: quaternion-algebraic model preserves algebraic norm
    constraint (DEV-1: no F_{p^2} curve arithmetic; DEV-2: Gaussian-weighted KLPT
    selection). Validator verdict VALID with QUALIFIED implementation fidelity.'
  - "Run 2 anomaly ANOM-1 (aggregate p=0.0019) assessed as within null expectation\
    \ (3 runs \xD7 null \u2192 ~0.3% false positive rate per run). Does not constitute\
    \ evidence of leakage."
  inference: The preregistered chi2_7 statistic does not distinguish KLPT-generated
    kernel scalars from uniform random selection at toy scale (p=6143, mod 7). This
    closes the specific statistic/modulus/prime combination tested. It does NOT assert
    security of SQIsign at cryptographic scale, does not rule out other statistics
    or moduli, and does not rule out diffuse biases (power ~0.73 for TV=0.05 diffuse).
    The clean negative validates the experimental methodology for future transcript-
    leakage tests at larger parameters or different statistics.
  boundaries:
  - Toy scale only (p=6143, ~512 supersingular curves, 6-bit security).
  - "Single statistic (chi2_7, residues mod 7) \u2014 other statistics not tested."
  - Quaternion-algebraic model, not full F_{p^2} curve arithmetic.
  - Negative result closes only this combination; does not assert SQIsign security.
  - Power ~0.73 for diffuse biases means a diffuse TV=0.05 bias cannot be ruled out.
  - Gaussian-weighted KLPT model may not capture all real KLPT distribution properties.
  unresolved_confounds:
  - Diffuse biases at TV=0.05 have only ~0.73 power at aggregate level. A follow-up
    with larger n or different moduli could narrow this gap.
  - The quaternion model (DEV-1) bypasses F_{p^2} arithmetic. Real SQIsign KLPT operates
    through the Deuring correspondence on actual curves; the isomorphism is exact
    but the computational path differs.
  - Only q=7 tested. Other small primes (11, 13) or composite moduli might detect
    structure invisible to mod-7 residues.
  reviewed_by: coordinator
  recorded_at: '2026-08-04'
