  what_was_derived: "KN-OPEN-028 Q1 (corrected nrd-PIP cost). The set of fractional\
    \ left O-ideals of reduced norm q' in an indefinite maximal quaternion order O\
    \ is INFINITE, proved via: (1) existence of integral ideals of all norms (local-global\
    \ principle / Eichler's theorem for indefinite maximal orders), (2) canonical\
    \ form I=(1/r)\xB7J for fractional ideals, (3) divergence of the denominator sum.\
    \ Numerically confirmed at M\u2082(Z), q'=7."
  key_observation: "The original attack (iacr:2026/1318, Heuristic 4) assumed the\
    \ pool of ideals of norm q' to re-randomize over is finite (size \u2248 q'+1 integral\
    \ ideals). The corrected pool is infinite. Under Case A (sampling reaches the\
    \ full infinite pool), the density of \"easy\" nrd-PIP instances is 0 in any natural\
    \ measure, making the re-randomization step non-terminating in expectation. This\
    \ is consistent with the paper's own 30/06 statement: \"the main algorithm appears\
    \ to run in super-polynomial time.\""
  complexity_classification:
    case_B: "If the algorithm only samples integral ideals (denominator r=1): original\
      \ polynomial density is recovered, restoring the polynomial-time claim \u2014\
      \ but the paper's correction refutes this case."
    case_C: "If the algorithm samples fractional ideals with bounded denominator \u2264\
      \ R: density \u2192 0 as R grows; runtime is super-polynomial with no upper\
      \ bound derivable without the algorithm body. This is the case most consistent\
      \ with the paper's \"super-polynomial time\" characterization."
    case_A: 'If the algorithm samples from the full infinite pool: density is 0, runtime
      is non-terminating in expectation (undefined-degenerate). Requires knowing whether
      the algorithm samples with unbounded denominator.'
  proof_gaps_requiring_repair:
  - 'Claim 2.1 uniqueness proof: circular norm argument; correct repair is by minimality
    of exact denominator'
  - 'Claim 2.2 local-global citation: Hasse-Minkowski quoted for an integral result;
    correct citation is Eichler''s theorem (strong approximation)'
  what_is_not_established:
  - "Which case (A/B/C) applies \u2014 requires iacr:2026/1318 algorithm body"
  - Whether the route retains any sub-exponential advantage over brute force
  - Any claim about HAWK's concrete security level
