experiment:
  id: EXP-PTH-48eee1
  title: "NC-3 / NC-6: Heuristic 1 tail validation at the operating point \u2014 sample\
    \ the B-smooth isogeny distribution and compare against the predicted probability\
    \ P0, with an explicit feasibility gate"
  hypothesis_id: H-WESO-001
  status: approved
  approved_by: coordinator
  approval:
    task_id: TASK-20260804-c802a9
    goal_id: GOAL-P13-001
    batch_id: BATCH-403f13
    approved_at: '2026-08-04'
    authority: Coordinator only (AGENTS.md, "Roles"). This approval authorises execution
      by TASK-20260804-6519fa, which is CONTINGENT on NC2d-PROPER not firing FC-4.
      If FC-4 fires on ell in {47,101,151,211} in TASK-20260804-241b87, this task
      is SKIPPED and the batch's remaining capacity redirects to L5 characterisation.
      Changes no hypothesis status; promotes nothing.
    frozen: true
    freeze_rule: This contract is written before any datum of the NC-3/NC-6 run exists.
      A needed change is a SUPERSEDING contract under a new EXP id.
  dispatch_contingency:
    condition: TASK-20260804-241b87 reports FC-4 DID NOT FIRE on ell in {47,101,151,211}
    if_fc4_fired: This task is SKIPPED. Report the skip explicitly in the task receipt.
      The batch's remaining capacity redirects to L5 characterisation per the RERANK
      TRIGGER in BATCH-403f13/dispatch_queue.json.
    authority: 'DEC-20260802-48c72c next_actions NA-1: "if NC2d-PROPER fires FC-4
      again on ell >= 47, L5 is contradicted at the ell where it is actually applied,
      alpha ceases to be the smallest term in the law, and the batch''s remaining
      capacity should go to characterising it rather than to NC-3/NC-6."'
  context:
    why_this_is_the_substantive_item: Heuristic 1 of the Wesolowski 2026 paper (inputs/P13-WESOLOWSKI-2026/
      paper_fulltext.md) is the condition Theorem 1.1 is conditional on. Its tail
      behaviour at the operating point (B = B_opt) determines P0, the probability
      that Algorithm 1 actually finds a B-smooth path in the expected number of iterations.
      P0 multiplies EVERY one of the eighteen margin rows in the corrected c table
      identically. A constant-factor error in P0 moves all margin rows by the same
      amount, independently of anything NC-2 measured. This programme has run three
      batches of cost-calibration work downstream of a Heuristic-1-conditional theorem
      without ever testing the heuristic.
    prior_status: NC-3 and NC-6 have been carried as open controls since DEC-20260724-016
      (BATCH-001 decision). They have not been executed in BATCH-002 or BATCH-003.
      DEC-20260802-48c72c next_actions NA-1 designates NC-3/NC-6 as "the substantive
      item" of BATCH-004 and explicitly overrides the alternative (NC2c) for the stated
      reason.
    open_red_team_objections: RT-H1, RT-H2, RT-H3, RT-H4 remain open (DEC-20260802-48c72c
      heuristic_1_status). This experiment addresses the tail behaviour specifically.
    pairing_obligation: agents/coordinator.md and docs/target-result-profile.md require
      that a conditional result be PAIRED with a heuristic-validation experiment in
      the same or the following batch. This is that pairing.
  objective: "(NC-3) Validate that the fraction of random B-smooth isogeny paths starting\
    \ from a fixed base curve j_0 matches the Heuristic 1 prediction at B = B_opt\
    \ (calibrated to the measurement prime p3). (NC-6) Validate the tail of the B-smooth\
    \ isogeny count distribution \u2014 specifically that the distribution of smooth-path\
    \ counts over j-invariants has the predicted tail behaviour near P0. Both are\
    \ subject to an explicit FEASIBILITY GATE: if the sampler for the relevant distribution\
    \ cannot be validated within the task budget, the outcome is an infrastructure/feasibility\
    \ outcome, never evidence about Heuristic 1."
  what_this_experiment_cannot_do:
  - Validate Heuristic 1 at cryptographic scale. The measurement is at p ~ 2^40 (p3
    = 1099511627563) with B_opt calibrated to that prime. AGENTS.md rule 7 applies.
    A toy-scale validation cannot be extrapolated to NIST-I.
  - Change any hypothesis status, evidence strength, or standing prohibition without
    a Coordinator ledger archive.
  - Run if the RERANK TRIGGER has fired. See dispatch_contingency.
  heuristic_1_statement:
    source: inputs/P13-WESOLOWSKI-2026/paper_fulltext.md
    informal: The number of B-smooth isogenies (as sequences of prime-degree isogenies
      of degree at most B) starting from a given supersingular curve in the ell-isogeny
      graph, of a fixed length N, is distributed approximately as predicted by a random-model
      calculation (analogous to the Dickman function for integer smoothness), uniformly
      over the starting curve.
    p0_definition: P0 is the probability that a random isogeny chain of length N is
      B-smooth, under Heuristic 1. At the operating point B = B_opt (the value that
      minimises Algorithm 1's expected run time for a given prime p), P0 is a specific
      number the heuristic predicts. A deviation from this prediction changes the
      attack's actual run time by a factor of P0_actual / P0_heuristic.
    operating_point:
      prime: p3 = 1099511627563 (p ~ 2^40)
      B_opt_measurement_prime: "B_opt at the measurement prime is NOT the NIST-I B_opt\
        \ (= 2^14.2). It is the B_opt calibrated to p3. The Executor computes this\
        \ from EXP-P13VOW-001's methodology at p3's field size (log2 p3 \u2248 40.0).\
        \ The Executor records the computed value before any sampling begins."
      N_opt: The optimal path length N_opt is similarly calibrated to p3 and B_opt.
        Record and use this value.
  feasibility_gate:
    id: FG-1
    priority: 'HIGHEST: runs before any substantive measurement'
    purpose: Validate that the sampler for the B-smooth isogeny distribution at p3
      and B_opt(p3) can produce a statistically useful number of smooth paths within
      the task's wall-clock budget. A sampler that produces fewer than 30 observed
      smooth paths in 1200 seconds cannot support a distributional comparison.
    procedure:
      step_1_compute_params: Compute B_opt(p3) and N_opt(p3) using EXP-P13VOW-001's
        methodology. Record both values.
      step_2_pilot_sample: 'Run a pilot sample of 500 random isogeny chains of length
        N_opt(p3) starting from j_0 = 1728. For each chain, check whether every prime-degree
        isogeny step has degree <= B_opt(p3) (i.e., whether the chain is B_opt-smooth).
        Record: the number of chains tested, the number that are smooth, and the elapsed
        time.'
      step_3_feasibility_verdict:
        check_1_smooth_count: If fewer than 30 smooth chains are observed in the 500-chain
          pilot, the expected smooth fraction is below 0.06 and a statistically meaningful
          distribution comparison requires > 500 samples of total compute time that
          may exceed the budget. Compute the estimated time to collect 100 smooth
          chains at the observed rate.
        check_2_time_estimate: If the estimated time to collect 100 smooth chains
          exceeds 3000 seconds (leaving 2400 seconds for the main measurement), declare
          the sampler INFEASIBLE within budget.
        pass: At least 30 smooth chains observed in the 500-chain pilot AND estimated
          time for 100 smooth chains <= 3000 seconds.
        fail: 'Fewer than 30 smooth chains in the pilot OR estimated time > 3000 seconds.
          Outcome: INFRASTRUCTURE/FEASIBILITY. The task reports this immediately,
          records the pilot statistics, and STOPS. No further measurement is performed.'
    agents_md_rule_5_binding: A FAILED FEASIBILITY GATE IS AN INFRASTRUCTURE/FEASIBILITY
      OUTCOME (AGENTS.md rule 5) AND IS NEVER EVIDENCE ABOUT HEURISTIC 1. The failure
      says only that the sampler cannot reach the relevant distribution within budget
      at the measurement prime. It is NOT evidence that Heuristic 1 is true or false.
  nc3_smooth_fraction:
    what_it_tests: Whether the observed fraction of B_opt-smooth chains matches the
      Heuristic 1 prediction at the measurement prime p3.
    gated_by: FG-1
    procedure: Collect a target of at least 100 smooth chains by sampling random isogeny
      chains of length N_opt(p3) from j_0=1728 and recording smooth/not-smooth. Use
      a fixed RNG seed (see seeds below) for reproducibility.
    preregistered_prediction:
      predicted_fraction: P0_predicted = psi(N_opt(p3), B_opt(p3)) / (p3 + 1) where
        psi is the Dickman-type smoothness probability function. The Executor computes
        this from first principles using the same Dickman implementation as RUN-WESOVOW-001
        (experiments/EXP-WESOVOW-001/) and records it before sampling.
      acceptance_band: 'The observed fraction f_smooth is compared to P0_predicted.
        Pre-registered: |f_smooth - P0_predicted| / P0_predicted <= 0.50 (50% relative
        tolerance). This is a wide tolerance appropriate for a toy-scale first measurement;
        the primary purpose is to check ORDER OF MAGNITUDE agreement, not precise
        calibration.'
    falsification_criterion: '|f_smooth - P0_predicted| / P0_predicted > 2.0 (more
      than a factor of 3 off) on a sample of >= 100 smooth chains. This would indicate
      a serious failure of Heuristic 1 at the measurement scale, warranting immediate
      investigation.'
    what_a_pass_cannot_claim: A pass (within the 50% band) validates Heuristic 1 at
      toy scale only. It cannot be cited as validation at NIST-I. AGENTS.md rule 7
      applies.
    what_a_fail_cannot_claim: A failure at toy scale is a falsification signal for
      follow-up, not a proof that Heuristic 1 fails at NIST-I. The scope of any adverse
      finding is strictly the measurement prime and path length.
  nc6_tail_distribution:
    what_it_tests: Whether the distribution of smooth-path counts over different starting
      j-invariants matches the predicted uniform distribution (Heuristic 1 predicts
      that P0 is approximately the same for every supersingular j-invariant, not concentrated
      at a few special curves).
    gated_by: FG-1
    procedure: At each of 20 randomly chosen starting j-invariants (drawn from the
      supersingular set at p3, using the walk with walk_seeds 0..3), collect at least
      20 smooth chains. Compare the per-starting-j smooth fractions.
    preregistered_prediction: 'The variance across starting-j fractions is consistent
      with Poisson fluctuations around P0_predicted. Pre-registered: the coefficient
      of variation (std/mean) of the per-j smooth fractions is <= 0.5. Higher variance
      would indicate that P0 is concentrated at a small number of special curves.'
    falsification_criterion: Coefficient of variation > 2.0 on a sample of >= 20 j-invariants
      with >= 20 smooth chains each.
    note: NC-6 requires significantly more compute than NC-3 and may hit the budget
      wall. If only NC-3 completes within budget, report NC-3's verdict and record
      NC-6 as BUDGET-LIMITED (not FAILED). Budget-limited is an infrastructure outcome
      and never evidence against the tail uniformity.
  controls:
  - id: C-SAMPLER-NULL
    description: 'Null object for the sampler: instead of checking B_opt-smoothness,
      check B_null-smoothness where B_null = 2 (every isogeny has degree 2, so a 2-smooth
      chain of length N_opt is an isogeny of degree 2^N_opt). The fraction of 2-smooth
      chains should be 0 for N_opt >> 1 at p3 (since a chain of N_opt 2-isogenies
      has degree 2^N_opt >> p3). This controls for whether the smoothness checker
      is working correctly.'
    pass: "Fraction of 2-smooth chains \u2248 0 (at most 2 out of 500 pilot chains).\
      \ If > 2 chains are 2-smooth, there is a bug in the smoothness checker."
    fail: '> 2 chains are 2-smooth -> the smoothness checker is defective; STOP'
  - id: C-SEED-REPRO
    description: At seeds 0..3 only, record the first two chains and their smoothness
      verdict in full (each step's ell value). A Reviewer must be able to reproduce
      these from the recorded seed and the committed instrument.
  seeds:
    pilot_seed: 20260804
    main_sample_seed: 20260804001
    j_invariant_selection_seed: 20260804002
    walk_seeds_for_starting_j:
    - 0
    - 1
    - 2
    - 3
  section_8_assessment:
    applicable: false
    reason: NC-3/NC-6 is an empirical validation of a named heuristic by sampling,
      not a theorem, bound, reduction, or closure argument. The four audits of section
      8 are inapplicable. This determination is stated explicitly rather than omitted.
  required_report:
    feasibility_gate:
    - 'FG-1 verdict: PASS or INFEASIBLE'
    - 'Pilot statistics: chains tested, smooth chains, elapsed time'
    - 'If INFEASIBLE: estimated time for 100 smooth chains and the reason'
    nc3 (if FG-1 passes):
    - 'P0_predicted (from Dickman computation): stated before any sampling'
    - Observed fraction f_smooth with 95% binomial CI
    - '|f_smooth - P0_predicted| / P0_predicted'
    - 'Gate verdict: PASS or FALSIFICATION'
    nc6 (if FG-1 passes and budget allows):
    - Coefficient of variation of per-j fractions
    - 'Gate verdict: PASS or FALSIFICATION or BUDGET-LIMITED'
    null_control:
    - C-SAMPLER-NULL verdict
  non_claims:
  - A PASS on NC-3 cannot be cited as validation of Heuristic 1 at cryptographic scale
    (AGENTS.md rule 7).
  - An INFEASIBLE verdict from FG-1 is never evidence for or against Heuristic 1 (AGENTS.md
    rule 5).
  - No record produced under this contract changes any hypothesis status or standing
    prohibition without a Coordinator ledger archive.
  resource_budget: &id001
    wall_clock_seconds: 5400
    memory_gb: 8
    maximum_runs: 1
  required_artifacts:
    run_receipt:
    - runs/RUN-P13-NC36-a/manifest.yaml
    - runs/RUN-P13-NC36-a/raw-result.json
    - runs/RUN-P13-NC36-a/execution_report.yaml
    - runs/RUN-P13-NC36-a/command.txt
    - runs/RUN-P13-NC36-a/environment.json
    - runs/RUN-P13-NC36-a/stdout.log
    - runs/RUN-P13-NC36-a/stderr.log
    implementation:
    - implementation/nc36_heuristic1.py
  completion_gate:
  - manifest.yaml exists and parses
  - FG-1 verdict recorded (PASS or INFEASIBLE)
  - C-SAMPLER-NULL verdict recorded
  - 'If FG-1 PASS: P0_predicted recorded before any sampling result'
  - 'If FG-1 PASS: NC-3 gate verdict stated'
  - 'If FG-1 INFEASIBLE: pilot statistics recorded; experiment stops there'
  inference_policy:
    policy: executor-implementation
    fallback_allowed: true
    degraded_allowed: true
    amendment: INFAMEND-20260802-P13-002
  version: 1
  metrics: []
  budget: *id001
  success_criterion: null
  success_criterion_note: The archived record was observational and declared no success
    criterion; this correction preserves that absence explicitly.
  falsification_criterion: null
  falsification_criterion_note: The archived approved contract did not state a separate
    falsification criterion; this correction records that defect explicitly and does
    not invent one.
