  goal_id: GOAL-AES-002
  question_id: RQ-AES-002
  batch_id: BATCH-2b0fd1
  hypothesis_id: null
  hypothesis_id_note: >-
    GOAL-AES-002's active_hypothesis_ids is [] and this batch creates none: an
    object-first enumeration is not a hypothesis and does not become one by
    being dispatched (DEC-20260810-ba50dc hypothesis_status_transition). This
    record therefore reviews a BATCH of protocol, ideation and measurement
    work against RQ-AES-002 directly, not evidence for or against any
    H-AES-* record.
  experiment_ids: []
  run_ids: []
  type: empirical
  type_note: >-
    Mixed content, disclosed rather than forced into a false single label.
    CM-1 (the cost model) and the object enumeration are DERIVATIONS and a
    ZERO-COMPUTE screening pass respectively — theoretical in character. The
    RANK 3 envelope receipt contains a genuinely MEASURED, KAT-verified
    figure (see observations below). `empirical` is selected because the one
    quantity independently re-derived and confirmed by BOTH reviewers from
    raw instrument output — the 1-core pure-Python throughput — is what makes
    this record's content checkable rather than merely argued; the
    derivational content is described in full below and is not upgraded by
    this label.
  direction: neutral
  direction_note: >-
    No hypothesis exists under this goal for this evidence to support,
    weaken, contradict, or leave undiscriminated. `neutral` records that this
    batch settles infrastructure and screening questions about the CAMPAIGN's
    own instruments (a frozen cost model, a candidate enumeration, a measured
    throughput envelope) and asserts nothing about AES.
  strength: anecdotal
  strength_note: >-
    Single batch, unreplicated, over instruments this campaign itself
    authored. The strongest content (the pure-Python throughput measurement)
    is a one-session measurement independently re-derived by two reviewers
    from the SAME raw inline data, not an independently replicated
    measurement from a second, separate run. `anecdotal` is the honest floor
    tier for a first-batch instrument-and-screening result; it is not
    downgraded further only because both reviewers' re-derivations agreed.
  claim_tier: toy
  claim_tier_note: >-
    Per RQ-AES-002 R7: "DEFAULT TIER IS `toy` for every evidence record under
    this question." No claimed key recovery, no claimed distinguisher, and no
    certificate of any kind is present anywhere in this batch, so the `crypto`
    tier gate (a re-verified full-round key-recovery certificate) is not even
