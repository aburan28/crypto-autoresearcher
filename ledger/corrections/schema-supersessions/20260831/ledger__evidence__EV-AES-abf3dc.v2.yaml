  certificate_refs: []
  proof_status: not_applicable
  proof_status_note: >-
    No claimed solve, relation, key recovery, or distinguisher exists in this
    batch's artifacts to require a certificate, derivation, or declared
    empirical_only basis. CM-1's own numeric derivations (S-box-application
    counts, AddRoundKey byte-XOR counts, data-pair unicity figures) were
    independently re-derived from FIPS-197's structure by BOTH the red team
    and the validator, from first principles rather than by re-reading CM-1's
    own text, and CONFIRMED CORRECT for all three key sizes in every case —
    this is a checked derivation of an ACCOUNTING INSTRUMENT, never a
    cryptanalytic proof_status.
  proof_refs: []

  # =====================================================================
  # OBSERVATIONS. WHAT THIS BATCH'S COMMITTED ARTIFACTS ACTUALLY CONTAIN.
  # =====================================================================
  observations:
    - >-
      RANK 1 — CM-1 (coordination/goals/GOAL-AES-002/batches/BATCH-2b0fd1/protocol/CM-1.yaml)
      was authored by TASK-20260810-4a478d, committed by TASK-20260810-f7bc82
      (commit 96bfe78d313d29ad7f73f5870e9af5c1bc9b3e05, parent
      aaa23143a7b273f3c0de0d5560705de9ca043acd, content-first binding
      independently content-verified by both TASK-20260810-1166f2 and
      TASK-20260810-9fc65d against the live tree), and fixes all six elements
      (a)-(f) of RQ-AES-002 claim_tier_ceiling R2, each explicitly and
      separately for AES-128/192/256, as its pre-dispatch gate role requires.
      Its own numeric derivations were independently re-derived and CONFIRMED
      CORRECT by both reviewers, including the AES-256 double-SubWord clause
      CM-1 names as its own weakest line.
    - >-
      THE INDEPENDENT RED TEAM (TASK-20260810-1166f2, RT-20260831-1166f2)
      located THREE concrete cross-conforming-party divergences in CM-1's
      text — two conforming readers of the identical stated rule computing
      genuinely DIFFERENT AEU-k figures for the same future attack: (i)
      element (a)'s S-box-application conversion route states no materiality
      threshold for accompanying non-S-box work, while a separate clause
      categorically forbids converting such work by any factor, so a real
      attack's cost is either a finite number or "unadjudicable" depending on
      which sentence a reader applies literally; (ii) elements (c) and (f)
      interact ambiguously at the partial-key-recovery / candidate-
      verification boundary — a residual exhaustive search may or may not
      ALSO pay element (f)'s separate per-candidate verification charge on
      top of itself, and the two readings diverge by close to a FACTOR OF 2,
      which CM-1's own R2(b) ruling names as "inside the margin of any result
      this campaign could plausibly produce"; (iii) element (d)'s Pareto
      "data" coordinate is a compound (count, kind) quantity and CM-1 never
      states how the two combine into the single order its own four-tuple
      domination rule requires. A fourth, lower-severity gap was found at
      element (b)/(c): CM-1 is written entirely in "repeated attempts to
      first success" vocabulary and states no bridge from a distinguisher's
      measured false-positive rate or advantage to a comparable AEU-k figure,
      even though RQ-AES-002 R7 keeps distinguisher claims explicitly in
      scope. THESE ARE SPECIFICATION FINDINGS ABOUT CM-1 ITSELF — a
      campaign-authored accounting instrument — NEVER mathematical or
      empirical evidence about AES at any round count (AGENTS.md rule 5), and
      never usable to promote or dismiss any future candidate. The
      independent validator (TASK-20260810-9fc65d) independently re-confirmed
      each of these four findings as textually accurate against CM-1's own
      quoted text and the live codebase, and confirmed the red team's fifth
      finding (BC1: a third certificate-kind-vocabulary site,
      tools/cairn_bridge.py's SUPPORTED_KINDS gating harness/runner.py:489,
      missed by the amendment's own declared search set but traced by both
      reviewers to a confirmed-BENIGN runtime effect — a `key_recovery`
      certificate is simply skipped for cairn cross-verification exactly as
      any other unrecognised kind already is today).
    - >-
      protocol-amendment-GOAL-AES-002-001 (the BLK-1 certificate-vocabulary
      extension) SPECIFIES the exact `key_recovery` certificate kind and the
      exact `check_run` text change, and its backward-compatibility mechanism
      argument (widening the accepted-kind tuple can only ever turn a
      previously-erroring input into a non-erroring one, never the reverse)
      was independently re-traced and CONFIRMED SOUND by both reviewers
      against the live tools/validate_ledger.py text. HOWEVER, both reviewers
      independently confirmed that the specified edits to
      tools/validate_ledger.py and docs/claims-and-verification.md have NOT
      YET been applied — both files, read directly at HEAD, still show the
      pre-amendment vocabulary (`kind: discrete_log | decomposition | none`).
      BLK-1 IS THEREFORE STILL OPEN IN SUBSTANCE: no `key_recovery`
      certificate can currently be emitted by a conforming run, and no card
      that could produce a solve may be dispatched until a separate declared
      act applies the specified edits (RQ-AES-002's BLK-1 constraint; both
      reviewers' verdicts state this explicitly).
    - >-
      adoption-amendment-005-partB.yaml, binding the amendment-005 Part B
      clock convention (C1-C6) and the amendment-004/005 provenance gate from
      this batch, was confirmed by both reviewers to bind exactly the sources
      it claims, with an explicit and correct `explicitly_not_adopted`
      boundary (amendment-005 Part A's own budget figures, amendment-004 Part
      A's reduced-round certification restatement, and any GOAL-AES-001
      status/budget/priority change are all correctly excluded).
    - >-
      RANK 2 — the object-first ideation (TASK-20260810-d8835b,
      object-enumeration.yaml + ideation-report.md) generated SEVEN candidates
      (C1-C7) at zero compute, exactly as its card required. Both reviewers
      confirmed full tier compliance: no key-recovery, distinguisher, margin,
      barrier, or universal-impossibility claim anywhere; status `unverified`
      throughout; `dominated_by` set verbatim to the unresolvable-in-this-
      environment string on every deliverable, never null; `sota_delta`
      states "DEFINITIONAL-REFERENCE DELTA: 0 bits" with the published
      frontier recorded as unadjudicable; the lossy-projection test applied
      to every candidate BEFORE any compute was requested. Of the seven: C1,
      C3, C5, C6 deduplicate to a REDISCOVERY of a named established family;
      C7 FAILS the lossy-projection test on a correct, independently-checked
      algebraic argument (Macaulay-matrix rank invariance under an invertible
      GF(2)-linear change of basis); C4 passes lossy-projection and
      deduplication but fails testability and is recorded, scored, but not a
      survivor; C2 alone — a paired-independent-key data-path Hamming-distance
      histogram, tracked round-by-round at the full round count for a fixed
      plaintext under two independently uniform random keys with NO assumed
      algebraic relation between them — PASSES the lossy-projection test,
      deduplicates as `not_a_rediscovery` against every named established
      family and against this campaign's own prior working-tree candidates,
      and scores `testability: high`. C2's `survival` axis is scored
      `predicted_null_but_untested`: the candidate's own author predicts, by a
      full-diffusion argument, that the tracked statistic reaches its
      Binomial(128,1/2) null by round ~2-4 and does NOT retain exploitable
      structure at the full round count — stated at BELOW default confidence
      because this same campaign's own prior key-schedule measurement
      (H-AES-77230c, cited by path, unadopted) found an analogous diffusion
      assumption WRONG in a different but structurally adjacent context (bit-
      influence density stuck at 0.78125, never reaching 1.0, at round 10).
      C2 is therefore a NAMED, SCREENED, UNTESTED CANDIDATE, not a finding of
      any kind about AES.
    - >-
      RANK 3 — the measured toolchain-and-throughput envelope
      (TASK-20260810-2a0a37, envelope-receipt.json + measure_envelope.c +
      execution-report.md) resolved the named toolchain contradiction BY
      MEASUREMENT: gcc/-maes is confirmed to compile and run AES-NI on an
      x86-64 host but the resulting accelerated path FAILS its own FIPS-197
      known-answer-test check (0/8 agreement with the openssl CLI) and is
      correctly excluded from any budget calculation as `invalid_measurement`
      throughout, never silently used; an ARM64 crypto-extension path
      likewise FAILS its KAT check and is likewise excluded. The ONE VALID,
      MEASURED figure is a 1-core, pure-Python AES-128 implementation at a
      median 11061.1924 evaluations/second/core (fresh-key, key schedule
      charged, CM-1 AEU-128 shape), cross-checked 4/4 against the openssl CLI
      before any timing was taken. Both reviewers independently recomputed
      this figure directly from the receipt's own preserved raw elapsed-time
      data (not merely re-read the receipt's claim) and MATCHED it to stated
      precision, and independently recomputed the single-core, four-core and
      fourteen-core log2 ceiling figures (24.077 / 26.077 / 27.884) and
      MATCHED all three exactly, including the explicit
      "multi-core scaling is ASSUMED LINEAR and was NOT measured" disclosure
      carried at the point of use.
    - >-
      FINDING F1 (validator, MEDIUM severity, independently confirmed by this
      review of the primary artifact): envelope-receipt.json's item vi
      14-core DECIMAL ceiling figure (488,600,000,000) is arithmetically
      WRONG by a factor of approximately 1972 (~2^10.95) against the same
      field's own correctly-derived and independently-reconfirmed log2 figure
      of 27.884 (2^27.884 ≈ 247,770,710, not 488,600,000,000). All other
      figures in the same receipt — every log2 figure and the pre-amendment
      campaign-line decimal (3,484,275,606) — are independently confirmed
      CORRECT; the defect is isolated to this one decimal field and must be
      repaired before it is cited in any later budget or ceiling calculation.
      This is an arithmetic transcription defect in a campaign instrument,
      never a measurement about AES.
    - >-
      FINDING F2 (validator, MEDIUM severity): TASK-20260810-1a81be's own
      committed C2 stamps (section_boundary_stamps elapsed_s 480 and 742)
      show it continuing 280 s and then 542 s PAST its own self-declared
      binding_stop_utc (200 s after start) without halting, without naming
      the overrun, and without updating `halted_on_budget` from `false`. This
      is an infrastructure/process defect on a producer task's own stamp
      duty, disclosed here rather than concealed, and is INFRASTRUCTURE
      SIGNAL, never a negative mathematical result (AGENTS.md rule 5); the
      CONTENT that task committed (hashes, parent, changed-path set,
      record_ids) independently verifies cleanly regardless, per both
      reviewers' archive checks.
    - >-
      FINDING F3 (validator, LOW severity): TASK-20260810-2a0a37's own
      covering manifest (envelope-receipt.json) declares provenance over 24
      raw-run, source-variant, and per-session stamp/transcript files that
      are named with real sha256 values but are NOT present anywhere in this
      repository's committed snapshot — only the three officially declared
      artifacts (envelope-receipt.json, measure_envelope.c,
      execution-report.md) were extracted from the source commit and
      committed by TASK-20260810-1a81be, per that task's own disclosed
      source_byte_provenance. This was a deliberate scope decision by the
      dispatching session, disclosed rather than hidden, and limits — but
      does not defeat — future re-derivation of items i/ii/iii/v to what the
      committed bytes preserve inline; items iv and vi were independently
      re-derived from the inline raw_output text alone by both reviewers, as
      recorded above.
    - >-
      FINDING F4 (validator, LOW severity): the red-team report was
      UNCOMMITTED working-tree content at validation time — expected by this
      batch's own designed shape, since review reports are committed
      together with this evidence record by THIS ledger-archive task
      (TASK-20260810-9f661a), not by the producer snapshot task
      (TASK-20260810-1a81be). The validator recorded the red-team report's
      exact content sha256
      (2cd01cf9edbe6ec334a58b7e8bd6a2aea1404bd142b86f413b760bc8b9057fdf) so
      byte-identity to the version committed here can be checked; this task
      commits it unchanged.
    - >-
      FINDING F5 (validator, COSMETIC severity): the red-team report's own
      "objections" section banner references a "cost_model_challenges" key
      that does not exist anywhere in the document — the worked detail
      actually lives under `r2_element_dispositions`. A trivial cross-
      reference defect, does not affect the substance of any finding.
    - >-
      THE INDEPENDENT VALIDATOR (TASK-20260810-9fc65d, VAL-20260831-9fc65d)
      independently re-verified every archive receipt of this batch against
      the live git tree — TASK-20260810-f7bc82, TASK-20260810-1a81be, and the
      TASK-20260810-c1cfd5 repair chain (TASK-20260815-aa30e8 /
      TASK-20260815-0f5486) — confirming exact commit existence,
      reachability from HEAD, declared parent, exact changed-path diff
      matching each task's declared artifact set with no scope expansion or
      omission, every declared path_sha256 recomputed and matched, and every
      declared record_id present in the corresponding commit message. The
      TASK-20260810-c1cfd5 opening-snapshot archive's two original defects
      (a two-commit sequencing deviation, and RQ-AES-002 genuinely absent
      from one commit message) are both disclosed in that task's own receipt
      and adjudicated on the record by DEC-20260810-17d5e8 / DEC-20260810-
      334c34 / DEC-20260815-cd90d4, not hidden or silently repaired.

  inference: >-
    THIS BATCH ESTABLISHES NO CRYPTANALYTIC MEASUREMENT AND NO COST CLAIM,
    AND ASSERTS NOTHING ABOUT AES AT ANY ROUND COUNT. What it establishes is:
    (1) a frozen, committed, and content-verified cost model CM-1 that fixes
    all six required elements of RQ-AES-002's R2 but is NOT yet safe to
    charge a real cryptanalytic cost claim against, because two independent
    reviewers located three genuine reading ambiguities under which two
    conforming parties would compute different AEU-k figures for the
    identical attack, one of them reaching a discrepancy close to the factor-
    of-2 threshold CM-1's own text calls claim-relevant; (2) a specified but
    NOT YET APPLIED certificate-vocabulary extension (BLK-1 remains open in
    substance until the actual code/documentation edits land in a separate
    declared act); (3) a fully tier-compliant, zero-compute object
    enumeration of seven full-round-relevant candidates, of which exactly ONE
    (C2) survives every screen and is worth carrying forward, UNTESTED, as a
    named next candidate; (4) a measured toolchain-and-throughput envelope
    whose single valid figure (1-core pure-Python throughput) is genuinely
    measured, KAT-verified, and independently re-derived and confirmed by
    both reviewers, but whose 14-core decimal figure (F1) is arithmetically
    wrong and must not be relied upon until repaired. Both independent
    reviewers reached PASS_WITH_LIMITATIONS, scoped explicitly and only to
    the purposes this batch was produced for (protocol freeze, object-first
    ideation, and measured envelope), with no security claim, no margin
    stated, no comparison against the published state of the art in either
    direction, and — stated explicitly by both reports — NO AUTHORIZATION TO
    DISPATCH A CRYPTANALYTIC CARD.

  boundaries:
    - >-
      SCOPED STRICTLY to full-round AES-128/192/256 (10/12/14 rounds) under
      RQ-AES-002; no round-count claim of any kind is made anywhere in this
      batch, and none is asserted here.
    - >-
      SCOPED to this batch's own committed artifacts and this environment's
      resource envelope (4 CPU cores measured reachable, 51.54 GB RAM, no
      GPU, no MILP/SAT, no numpy, no reachable AES-NI or ARM64-crypto
      acceleration under KAT verification — both accelerated paths FAILED
      their own correctness check). No transfer or extrapolation assumption
      beyond this envelope is made.
    - >-
      NO CRYPTANALYTIC CARD MAY BE DISPATCHED under this goal until BOTH (i)
      a superseding versioned protocol amendment resolves CM-1's three
      identified reading ambiguities and the distinguisher-class gap, and
      (ii) protocol-amendment-GOAL-AES-002-001's specified check_run and
      documentation edits are actually applied. Neither condition is met by
      this record.
    - >-
      C2's `predicted_null_but_untested` survival score is a PREDICTION
      stated at below-default confidence by its own author, not a
      measurement; if pursued, it requires the round-by-round Hamming-
      distance-histogram measurement its own minimal_test_sketch names, run
      against a matched null control and the round-count decay check, before
      any statement about it beyond "screened and worth testing" is made.

  unresolved_confounds:
    - >-
      CROSS-MODEL INDEPENDENCE IS UNAVAILABLE campaign-wide under standing
      inference-amendment/basis 0137a051. The independent red-team and
      validator verdicts both self-report resolved_model_id claude-sonnet-5;
      they supply SESSION independence only, are ONE DRAW FROM A CORRELATED
      PAIR rather than two independent draws, and no attestation of
      independent multi-model agreement is recorded here or in either
      report.
    - >-
      The envelope receipt's raw-run provenance for items i, ii, iii, and v
      is not independently re-derivable beyond the inline text preserved in
      the committed receipt (F3) — the 24 supporting files it names by path
      are not present in this repository's snapshot, and their source commit
      is disclosed as unreachable from this branch's history.
    - >-
      Neither reviewer independently re-swept the full experiments/ tree to
      exhaustion for a pre-existing `kind: key_recovery` certificate; both
      relied on the amendment's own recorded S-4/S-7 searches for that
      specific zero count, named explicitly as unverified-by-this-session-
      beyond-the-amendment's-own-record rather than treated as independently
      exhaustive.

  obstruction: null
  obstruction_note: >-
    FIELD OMITTED (null) BY DESIGN, not filled with empty sub-fields:
    tools/validate_ledger.py's check_obstruction only skips validation when
    `obstruction` itself is absent/null; a dict with null sub-fields is
    validated as a claimed-but-incomplete obstruction and fails schema
