experiment:
  id: EXP-PRECOMP-011
  hypothesis_id: null
  hypothesis_id_note: >-
    Added by schema supersession (DEC-20261017-0fab25). The archived
    specification names no hypothesis: it is a proposed structural-measurement
    contract (see predecessor_evidence). None is assigned here.
  version: 1
  version_note: >-
    Added by schema supersession (DEC-20261017-0fab25). The archived
    specification carries no version; it is the only version on record.
  budget:
    advisory_estimate: null
    budget_note: >-
      Added by schema supersession (DEC-20261017-0fab25). The archived
      specification records no budget. Budgets are advisory and may be null
      (AGENTS.md, Budgets: progress first); no estimate is invented here.
  status: proposed
  title: Decomposition-arity sweep under solver precomputation
  objective: >-
    Test whether reusable solver state changes the usual tradeoff between factor
    base size and algebraic difficulty as decomposition arity m increases.
  fixtures:
    field_bits: [11, 13, 16, 20, 24, 28]
    curve_seeds: [1, 2, 3]
    decomposition_arities: [2, 3, 4, 5, 6]
    target_count: 200
  stopping_rules:
    - stop an arity/size cell when cold solve exceeds the declared wall-clock budget
    - never infer larger-arity failure from timeout alone
  metrics:
    primary: warm_verified_relations_per_second
    required:
      - factor_base_size
      - decomposition_probability
      - degree_of_regularity_proxy
      - cold_seconds
      - precompute_seconds
      - warm_seconds
      - cache_bytes
      - structural_reuse_fraction
      - warm_speedup
  controls:
    - compare cold and warm modes for every completed arity cell
    - use the same factor-base sizing rule within an arity unless explicitly swept
    - include planted positive controls when random relation probability is too low
  success_criterion: >-
    An arity m>=3 that is inferior under cold cost becomes superior in charged
    warm verified-relation throughput in at least two matched >=16-bit cells.
  strong_signal: >-
    The warm-optimal arity increases with field size while exact verification
    remains clean and precompute break-even remains <=1000 targets.
  falsification_hook: >-
    Solver reuse does not change the ordering of arities and higher m remains
    uniformly dominated after total precompute accounting.
  depends_on: [EXP-PRECOMP-002, EXP-PRECOMP-004, EXP-PRECOMP-005]
