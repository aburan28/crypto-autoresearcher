experiment:
  id: EXP-PRECOMP-006
  hypothesis_id: null
  hypothesis_id_note: >-
    Added by schema supersession (DEC-20261017-0fab25). The archived
    specification names no hypothesis: it is a proposed structural-measurement
    contract (see predecessor_evidence). None is assigned here.
  version: 1
  version_note: >-
    Added by schema supersession (DEC-20261017-0fab25). The archived
    specification carries no version; it is the only version on record.
  budget:
    advisory_estimate: null
    budget_note: >-
      Added by schema supersession (DEC-20261017-0fab25). The archived
      specification records no budget. Budgets are advisory and may be null
      (AGENTS.md, Budgets: progress first); no estimate is invented here.
  status: proposed
  title: Pivot and elimination-schedule stability across targets
  objective: >-
    Measure whether Macaulay elimination pivots, row/column permutations, and
    reducer schedules remain stable across target-specialized systems strongly
    enough to precompute a fixed elimination plan.
  fixtures:
    field_bits: [11, 13, 16, 20, 24, 28, 32]
    curve_seeds: [1, 2, 3]
    holdout_targets: 500
    decomposition_arities: [2, 3]
  metrics:
    primary: pivot_overlap_fraction
    required:
      - pivot_sequence_edit_distance
      - row_permutation_overlap
      - column_permutation_overlap
      - elimination_schedule_success_rate
      - cold_linear_algebra_seconds
      - scheduled_linear_algebra_seconds
      - warm_speedup
      - verification_failures
  controls:
    - fixed sparse-linear-algebra backend within each cell
    - compare exact rank and reduced result, not pivot count only
    - stratify SAT/decomposable and UNSAT/nondecomposable targets
  success_criterion: >-
    Median pivot overlap >=0.90 and a precomputed schedule applies without
    repair to >=0.80 of holdouts in two >=20-bit cells.
  strong_signal: >-
    Pivot overlap >=0.98 with >=2x end-to-end linear-algebra speedup and stable
    or improving overlap versus n.
  falsification_hook: >-
    Pivot overlap <=0.50 or schedule repair cost erases all measured speedup
    at every completed >=20-bit size.
  depends_on: [EXP-PRECOMP-001, EXP-PRECOMP-005]
