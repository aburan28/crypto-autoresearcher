  supersedes_scope_of: DEC-20261015-a08389
  target_ids: [H-ECDLP-60de36, EXP-ECDLP-502ae2, EV-ECDLP-7e970a]
  hypothesis_status_transition:
    H-ECDLP-60de36: rejected_scoped -> rejected_scoped (scope widened)
  scope: >-
    Rejected for prime fields at toy scale, m in {2, 3} under Singular
    std/slimgb + fglm (EV-ECDLP-6bdff6) and m = 3 under msolve 0.6.5 F4 + FGLM
    (EV-ECDLP-7e970a). Not rejected: other monomial/elimination orders, other
    modellings of the chain, m >= 4.
  rationale:
    - The frozen falsification criterion of EXP-ECDLP-502ae2 is met on both limbs, independently recomputed by VAL-20261015-280100 (passed).
    - The slowdown holds on the basis step alone (8x to >79x), so it is not an artefact of msolve's -P 1 genericity retries.
    - The chain does lower the maximum F4 degree, but the 3L-variable system still costs more; the instrument-dependence question raised by DEC-20261015-a08389 is answered negatively for F4.
  evidence_strength: replicated (two solver families, same instances)
  evidence_refs:
    - EV-ECDLP-7e970a
    - EV-ECDLP-6bdff6
    - experiments/EXP-ECDLP-502ae2/reports/validation-20261015/validation.md
    - experiments/EXP-ECDLP-502ae2/reports/review-DEC-20261015-ab6f23/report.pdf
  next_actions:
    - problems/pkm-isogeny-chain-factor-base-no-fast-decomposition.md stays open; the "F4 solver" unblock path is now tested and negative. Remaining untested routes - block/elimination orders exploiting the chain's triangular shape, and a degree-of-regularity argument.
    - No further P-256 work on this route unless one of those routes beats the dense and random controls on the frozen toy grid.
  approval_basis: AGENTS.md standing user authorization (2026-09-06)
