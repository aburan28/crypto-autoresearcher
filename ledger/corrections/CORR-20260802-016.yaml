correction:
  id: CORR-20260802-016
  recorded_at: '2026-08-02'
  record_type: claim
  record_id: RELOCATION-CARRIED-DEBT-ITEMIZATION-PR87
  field: unrepaired_defects_carried_forward
  prior_value:
    source: CORR-20260802-014 unrepaired_defects_carried_forward
    method: >-
      Class-based itemization derived by reading the fourteen relocated records
      and predicting which validator errors would follow them to their new paths.
      Five classes were named, covering EV-SIG-007, EV-GPS-001, EV-SIG-008,
      EV-DREG-004 and DEC-20260727-013, with an approximate total of ~32 lines.
    omission: >-
      "ledger/decisions/DEC-20260727-012.yaml: decision references unknown target
      'EXP-SIG-008'" was omitted. The prediction verified that
      experiments/EXP-SIG-008/specification.yaml EXISTS and concluded from that
      the target would register. It does not parse — the file is a Markdown prose
      document with a .yaml extension, so check_experiment never registers
      EXP-SIG-008 and every reference to it dangles. Existence was checked;
      parseability was not. The same reading also produced the ~32 estimate
      against a measured 36.
  corrected_value:
    itemized_line:
      new: >-
        ledger/decisions/DEC-20260727-012.yaml: decision references unknown
        target 'EXP-SIG-008'
      pre_relocation: >-
        ledger/DEC-20260727-002.yaml: decision references unknown target
        'EXP-SIG-008'
      status: >-
        Carried-forward debt. Present in the pre-relocation error set; the record
        was renumbered DEC-20260727-002 -> DEC-20260727-012 and moved into
        ledger/decisions/. Same defect, same cause, new path.
      category: C3
    amended_exclusion_rule:
      applies_to: >-
        DEC-20260802-008 excluded_from_amendment, third bullet ("any line naming
        a record created by the DEC-20260802-001 relocation, except the lines
        itemized in CORR-20260802-014").
      replaced_by: >-
        A line naming a record created by the DEC-20260802-001 relocation may
        enter the baseline IF AND ONLY IF the identical error message appears in
        the committed pre-relocation error snapshot under that record's
        pre-relocation path, as mapped in CORR-20260802-014 prior_value /
        corrected_value. A line naming a relocated record whose message has no
        such pre-relocation counterpart is BLOCKED and must be repaired or
        separately decided.
      why_not_by_intent: >-
        The executing session offered "exclusion 3 is by content rather than by
        path" and was right to refuse to apply it unilaterally. Reading an
        exclusion by intent hands back exactly the judgement that made the
        exclusion valuable; it is how a smuggled line gets argued in. The rule
        above is content-correct AND mechanically checkable, because it is set
        membership against a frozen artifact rather than an assessment of what a
        line means.
      why_not_by_re_itemization: >-
        A superseding hand-itemization would have unblocked this commit while
        preserving the method that produced the omission. The failure was that
        the list came from prediction rather than measurement; appending one
        predicted-then-measured entry does not fix that.
      prerequisite: >-
        tools/prerelocation_error_snapshot.txt must be committed: the verbatim
        error set of `python3 tools/validate_ledger.py --no-baseline` at the
        commit immediately preceding the DEC-20260802-001 relocation. Without it
        the rule is not reproducible by a later reader and degrades into an
        appeal to memory.
  reason: >-
    Step 3 of DEC-20260802-008 required verifying that no excluded line appears
    in the candidate baseline set before regeneration. It found one:
    DEC-20260727-012's dangling EXP-SIG-008 target, which is pre-existing debt
    whose path moved during the relocation but which CORR-20260802-014 did not
    itemize. The letter of the exclusion blocked a line its purpose was never
    aimed at. Rather than read past the exclusion, or patch the list by hand, the
    exclusion is restated as a mechanical test against a frozen pre-relocation
    snapshot: it admits carried-forward debt by construction and still blocks
    anything the relocation actually introduced. CORR-20260802-014 is immutable
    and is not edited.
  evidence_artifacts:
    - ledger/corrections/CORR-20260802-016.yaml
    - ledger/decisions/DEC-20260802-010.yaml
    - ledger/corrections/CORR-20260802-014.yaml
    - ledger/decisions/DEC-20260802-008.yaml
    - tools/prerelocation_error_snapshot.txt
  affects:
    - >-
      All 36 lines naming relocated records (35 covered by CORR-20260802-014's
      classes, plus this one) must each be verified against the snapshot before
      the baseline is written, and the verified old-path -> new-path mapping
      reported back for the closing decision record. Verification is set
      membership and transcription; it involves no selection.
    - >-
      Header category C3 is widened to cover decision target_ids as well as
      evidence run_ids and experiment_ids. The cause is identical in both cases:
      the referenced experiment or run does not register.
    - >-
      No hypothesis status, evidence strength, claim boundary, or research
      conclusion moves. DEC-20260727-012's findings on the EXP-SIG-008 n=12 D6
      gates stand exactly as recorded; what is added is that the experiment it
      names has no machine-readable contract, so the reference cannot resolve and
      nothing built on it may be presented as pre-registered.
  interpretation_limits:
    - >-
      Admitting this line removes an error from the default output. It does not
      repair EXP-SIG-008's specification and does not make the reference resolve.
    - >-
      The rule admits carried-forward debt automatically. That is its purpose and
      also its limit: it cannot distinguish debt that SHOULD have been repaired
      during the relocation from debt that could not be. Repairability stays a
      separate judgement, recorded in DEC-20260802-001 and CORR-20260802-014.
  decided_by: coordinator
