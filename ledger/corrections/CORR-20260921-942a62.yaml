  archived_by: null
  archived_by_note: >-
    NULL, AND DISCLOSED AS SUCH. This record exists because deliverables were lost for
    want of an owner that committed them, so writing it with a dangling archive
    reference would repeat the failure it documents. It is committed directly by the
    session that wrote it, in the same commit, and that commit IS its durability. The
    successor batch binds an archival task before any producer runs again.
  kind: producer_output_loss
  severity: evidence_integrity

  corrects:
    - >-
      The implicit reading that BATCH-e0a0c1's two blind source reads and
      EXP-SEMBIN-4fa22c's execution are recoverable work. They are not. Their outputs
      no longer exist in any tree, on any branch, or in any reflog.
    - >-
      Any later statement of this session's findings that cites
      coordination/goals/GOAL-SEMBIN-fcb7a2/batches/BATCH-e0a0c1/read-nagao-2013-549/*,
      .../read-semaev-2015-310/*, experiments/EXP-SEMBIN-4fa22c/runs/RUN-SEMBIN-891f79/*,
      or experiments/EXP-SEMBIN-4fa22c/code/*. Those paths are unreadable and the
      citations are void.
    - >-
      coordination/bus/messages/MSG-20260916-0d4b98.yaml and MSG-20260916-c6e3d1.yaml,
      which announced findings whose supporting artifacts are now gone. They remain
      immutable and are NOT edited; this record is what a reader following their refs
      must read next.

  nature: >-
    THREE PRODUCER TASKS RAN TO COMPLETION AND THEIR ENTIRE OUTPUT WAS LOST, because the
    VM holding it was replaced before any of it was committed.

    The session that dispatched them ended between turns. The next turn resumed on a
    FRESH CLONE of the repository on a new machine: `git reflog` shows `clone:` as its
    earliest entry, and the four local commits the previous turn had made
    (95be12c2c, 12b0af8cc, e5e5d4eaf, 32dde4561) are not objects in this repository at
    all. They were committed locally and never pushed. Everything those commits
    contained, and everything still untracked beside them, is gone.

    What was lost, and what each was:

      1. coordination/.../BATCH-e0a0c1/read-nagao-2013-549/  (17 files)
         A blind source read of Nagao 2013/549 under TASK-20260916-9da6e0: report,
         statement map over 20 statements, attestation, an executable recheck of its own
         claims, and seven re-extractions of the frozen PDFs. Joints J-1, J-2, J-3, J-5.

      2. coordination/.../BATCH-e0a0c1/read-semaev-2015-310/  (12 files)
         A blind source read of Semaev 2015/310 under TASK-20260916-64a93b: report,
         statement map, attestation, two rechecks, four re-extractions. Joint J-4 and
         the J-5 control.

      3. experiments/EXP-SEMBIN-4fa22c/code/  (7 modules + CODE_SHA256.json)
         and experiments/EXP-SEMBIN-4fa22c/runs/RUN-SEMBIN-891f79/  (13 files)
         The execution under TASK-20260916-0c2802, which had reached
         run_status: completed_valid with 132 measured rows across four arms and six
         field sizes, its own S-1..S-7 protocol verdicts, null controls measured before
         targets at every n, and a fixture suite.

    All three were UNTRACKED working-tree directories at the moment the machine went
    away. The archive tasks that owned them (TASK-20260916-92128f, TASK-20260916-8eb394)
    were correctly declared and bound BEFORE dispatch, which is what the contract
    requires -- and it made no difference, because an owner is not a commit.

  what_this_is_not: >-
    NOT negative evidence about anything mathematical. Core rule 5 and rule 3 of
    CLAUDE.md both apply directly: an infrastructure failure is not evidence against a
    hypothesis, and the loss of a measurement is not a measurement. H-SEMBIN-a7e721 is
    exactly where it was before the run: its mechanism premise is untested, not
    weakened.

    NOT a reason to restate the lost findings as established. The Coordinator read all
    three outputs before they were lost and can describe what they said, and that
    description is inadmissible as evidence: no reviewer can read the artifact, no
    attestation survives, and a Coordinator's recollection of a blind reader's verdict
    is precisely the hearsay the messaging rules forbid. The findings below are recorded
    as LEADS TO RE-DERIVE, at provenance `recalled`, and none of them may discharge a
    joint, move a status, or support a claim until an artifact exists again.

  what_survived:
    committed_and_pushed:
      - coordination/review/sembin-20260916-e0a0c1/read-plan.yaml — the round's prior,
        with P-1..P-6 recorded before any reader ran. Intact and still usable.
      - >-
          coordination/review/sembin-20260916-cbb416/review-plan-addendum-3.yaml — the
          pre-measurement prior for the shifted arm. Intact, and its pre-registration claim is
          UNAFFECTED: it was committed at c15dc4318 when runs/ did not exist, and runs/ now
          does not exist again.
      - ledger/decisions/DEC-20260916-b0e654.yaml and the collision-audit package.
      - experiments/EXP-SEMBIN-4fa22c/specification.yaml and its amendment.
      - tools/check_review_independence.py's blind_from_additions fix, with tests.
      - Both bus messages, which is why this record must supersede their framing.
    recovered_independently:
      - tools/lemma4_inside_form.py and tools/test_lemma4_inside_form.py, committed at
        c55103916. The one finding that IS recoverable, because the Coordinator had
        already re-derived it from the definitions in its own implementation rather than
        taking the reader's word, and a pair of polynomials over F_2 needs no provenance
        to be checkable. See `recovered_finding` below.

  recovered_finding:
    claim: >-
      The INSIDE form of Nagao 2015/984's Lemma 4 -- d_F(F u S_fe) <= d'_F(F u S_fe),
      which EXP-SEMBIN-4fa22c records as a dependency of its central inference and which
      the run's own S-1 protection is phrased in terms of -- is FALSE.
    witness: f_1 = X_1X_2 + X_3, f_2 = X_1X_3 + X_2 over F_2, N = 3, with d'_F = 2 and
      d_F = 3.
    support: tools/lemma4_inside_form.py, re-runnable by anyone, pinned by 8 tests.
    provenance: >-
      The witness pair was FIRST REPORTED by the lost read (TASK-20260916-9da6e0). That
      report cannot be cited. What supports the claim now is an independent
      implementation written from the definitions, which never read that reader's code,
      and which reproduces the refutation from scratch on a different machine. Stated
      this way because the honest description is neither "the reader found it" (no
      artifact) nor "the Coordinator found it" (the Coordinator was handed the pair).
    strengthened_beyond_the_lost_report: >-
      The re-derivation measured something the lost report did not: the violation is not
      a pathological instance. Roughly 23% of random multilinear pairs at N = 3 violate
      the inside form. It also caught two bugs in its own first drafts, both pinned as
      tests, one of which (condition (1) is an equality) is a failure mode the lost
      report had separately reported hitting.
    claim_tier: >-
      A refutation of a universally quantified statement about a published lemma,
      verified at N = 3 over F_2. It asserts NOTHING about Nagao's Proposition 5, which
      may hold by another route, and NOTHING about descended summation-polynomial
      systems at n in [7,12].

  leads_to_rederive:
    note: >-
      Recorded at provenance `recalled` so the re-dispatched work is not sent out blind
      to what was already looked at. NONE of these is evidence, none may be cited, and a
      re-dispatched reader must NOT be shown this list where it would destroy the
      independence of its own read -- each is a claim the reader is meant to reach or
      refute on its own. They are listed here for the Coordinator's ranking, and the
      successor read plan states which of them are blind_from.
    from_the_nagao_read:
      - >-
          J-1: 2015/984's "Lemma 3 ([11])" matched on content to 2013/549's Lemma 2, not to
          that paper's own Lemma 3. Restatement reported faithful.
      - >-
          J-2: the upstream lemma reported PROVED and effectively constructive; 2015/984's
          "complicated and not constructive" reported as conflating constructivity with the
          upstream paper's separate cost objection.
      - >-
          J-3: the derivation reported NOT to reach the inside form, bounding the unreduced
          product degree where a fake witness controls only the reduced one.
      - >-
          J-5: control reported PASSED — the derivation does not go through against the
          known-false outside form, and fails at a different identifiable step.
      - >-
          An extraction defect reported in inputs/NAGAO-2013-549/paper_fulltext.md: the frozen
          markdown is said to have lost the graded monomial order that Lemma 2's proof depends
          on, leaving a vacuous-looking hypothesis. `mutool` reported available in the
          environment where `pdftotext` is not. THIS ONE IS CHEAP TO RECHECK DIRECTLY and is
          not a reader's judgement; see next_actions.
      - A reported inconsistency with inputs/NAGAO-2015-984/source_record.yaml, which
        frames the fake/true confusion as "safe in the direction people use it".
    from_the_semaev_read:
      - >-
          J-4: Semaev's proved degree fall reported to SURVIVE Nagao's coset shifts, which is
          the opposite of what H-SEMBIN-a7e721's mechanism predicts.
      - >-
          J-4c: a degree-convention mismatch reported in the source — a definition stated in
          true total degree, argued in Boolean/ANF degree.
      - >-
          J-5 control A reported FAILED UPWARD: the cost model reported to improve even where
          its own validity hypothesis k > ceil(n/m) is violated.
    from_the_lost_run:
      - A-SHIFTED reported at d'_F in {3,4} across n in [7,12], within the
        review-plan-addendum-3 prior's ceiling of 4.
      - Null arms reported at d'_F in {3,4,5}, i.e. BRACKETING both descent arms, which
        would make any shifted-vs-unshifted separation uninterpretable at one draw per
        cell. This is the observation most worth re-obtaining, and it argues for more
        draws per descent cell in the successor contract.

  root_cause: >-
    A producer's deliverables become durable only when a LATER, SEPARATE archival task
    runs, and that task runs in a later turn of a session that may not exist. Between
    production and archival the output lives only in one machine's working tree. Cloud
    sessions are ephemeral by construction, so the window is not an edge case: it is the
    normal state of every producer's output for as long as it takes the dispatching
    session to get back to it.

    AGENTS.md's dispatch precondition 1 already states the consequence in terms --
    "Dispatching first leaves the deliverable as an unowned working-tree artifact for
    the length of the task ... if the session dies it is not evidence at all" -- and
    prescribes binding `archived_by` before dispatch. That was done here, for all three
    tasks, and it did not help. The precondition makes the output OWNED. It does not
    make it EXIST. That gap is the defect, and it is in the contract, not in the
    dispatcher's compliance with it.

  remedy:
    mechanism: >-
      tools/producer_landing.py, added with this record: one command that verifies a
      producer's declared artifacts are present, stages exactly those paths, and commits
      them under the producing task's id — to be run IN THE SAME TURN the producer
      returns, before the Coordinator reads a line of the output. The archival task
      still runs afterwards and still writes the receipt that binds hashes and records
      what the read is evidence of; landing does not replace it. It removes the window,
      which is all it is for.
    visibility: >-
      research_dispatch.py gains an UNLANDED PRODUCER OUTPUT report: any task whose
      declared artifacts exist on disk but are absent from HEAD is named in the dispatch
      plan. An exposure that is visible in the plan is an exposure someone can act on;
      this one was invisible until the machine was gone.
    what_neither_fixes: >-
      Neither closes the window between a producer WRITING a file and returning. A
      subagent that dies mid-task still loses partial work, and that is accepted: it is
      bounded by one task rather than by a session's whole turn.

  next_actions:
    - id: NA-1
      action: >-
        Recheck the reported extraction defect in inputs/NAGAO-2013-549 DIRECTLY, with
        mutool, in this session. It is a mechanical fact about a frozen file rather than
        a reader's judgement, so it can be re-established without re-dispatching a read
        -- and if it holds it affects every future reader of that input package.
      rank: >-
        First, because it is cheap, load-bearing for J-2, and independent of every lost
        artifact.
    - id: NA-2
      action: >-
        Re-dispatch both blind reads against the SURVIVING read-plan, with the producer
        landing step bound into the card. The plan's prior is intact and was never
        exposed to a reader, so the round's independence is recoverable in full.
      rank: Second.
    - id: NA-3
      action: >-
        Re-dispatch EXP-SEMBIN-4fa22c's execution. The contract, its amendment and the
        pre-measurement prior all survive, so the re-run is against an unchanged frozen
        protocol. Raise draws per descent cell above one, which the lost run's own null
        spread argues for.
      rank: Third.
    - id: NA-4
      action: >-
        Do NOT edit the two bus messages. Publish a superseding message pointing at this
        record, so a session that read them learns their support is void.
      rank: Alongside NA-1.

  limitations:
    - >-
      This record is the Coordinator's account of its own session's loss, written by the
      session that suffered it. There is no independent witness to what the lost
      artifacts contained, and there cannot be. Every item under `leads_to_rederive` is
      therefore uncorroborated in the strongest sense: the only copy was read by one
      agent and no longer exists.
    - >-
      The file counts (17, 12, 7, 13) are the Coordinator's count from a directory
      listing taken while the artifacts existed. They cannot now be checked.
    - >-
      Whether the lost run was CORRECT was never independently reviewed — its validator
      and blind re-derivation tasks had not run. Its loss therefore costs a measurement
      of unknown quality, which is a smaller loss than a reviewed one and a larger loss
      than none.
