  prior_value: >-
    The design note's D ~ 2^20 and 2^142 floor are properties of the RAW
    descended system S_6(x_1..x_5, x_R) in x_1..x_5. The S_5 arm lowers D to
    about 2^20/120, and the (Z/2)^4 x| S_5 arm lowers it to about 2^20/1920 =
    2^9.1, giving a band of about 2^121 to 2^132.

  corrected_value: >-
    The design note's system -- "5 equations with 5 unknowns, and a total
    degree 2^{k-1} = 16", with D "close to 2^{k(k-1)} = 2^20" and a D^2 floor
    of 2^40, giving "at least 2^142" -- is the S_5-SYMMETRIZED system in the
    elementary symmetric functions e_1..e_5.
    - Only that system has total degree 16. Its Newton polytope is the
      degree-16 simplex, so its Bezout number and mixed volume are
      16^5 = 2^20.
    - The raw system has degree 16 in EACH variable. Its mixed volume is
      5! * 16^5 = 2^26.9, so D_raw ~ 2^26.9.
    - A genuine (Z/2)^4 x| S_5 quotient gives about 2^16 = 2^{(m-1)^2}.
    - Re-anchored under the design note's own model, which is arithmetic and
      not a measurement: the raw system sits at 2^156.2 (D^2); the S_5 system
      at 2^142.4, the note's own figure; a genuine torsion quotient at 2^134.4
      (D^2) to 2^152.7 (5 D^3). With the inverse success probability charged,
      which the note and the frozen band omit (JV "n! c(n,q) q^{2-2/n}";
      FHJRV line 854, 2^4 x 5! per relation), the torsion quotient sits at
      2^144.3 to 2^162.6.
    These are re-anchored model figures, not security findings, and not
    measurements.

