correction:
  id: CORR-20261024-851c82
  recorded_at: '2026-10-24'
  recorded_by: subagent (Claude Mythos 5.1, worktree fix/ic-refutation-propagation-20261024), at the Coordinator's request
  ratification: pending owner
  type: refutation_propagation_failure_and_supersession
  severity: claim_status_stale_no_new_measurement
  supersedes: []
  corrects:
    - KN-FIND-2a8b7e
    - KN-FIND-c7d31e
  what_happened: >-
    EV-FALSIFY-67150b (recorded 2026-08-08, direction contradicts, strength
    strong, claim_tier toy) refuted the growing-with-m speedup law of
    KN-FIND-2a8b7e (speedup ~ 1.72 * 1.36^(m-2), 3 to 5x at crypto scale,
    "the program's main algorithmic contribution"). The decay of gamma_m the
    finding fitted is confounded with the simultaneous shrinking of B across
    its four rows (B = 54, 18, 12, 10); at fixed B the per-step ratios rise
    toward and past 1.0 instead of decaying at 0.68 (EV-FALSIFY-67150b O-3,
    O-4). The geometric law of KN-FIND-2a8b7e and the linear (m+1)/2 law of
    KN-FIND-c7d31e also cannot both hold (O-2). EV-FALSIFY-67150b correctly
    edited no finding and asked for new records. No such record followed, so
    KN-FIND-2a8b7e kept superseded_by: null and kept presenting the refuted law
    and its crypto-scale extrapolations as the program's headline result for
    about 11 weeks. This record is the missing propagation step.
  supersession:
    finding: KN-FIND-2a8b7e
    superseded_by: KN-FIND-921fbf
    superseding_finding_note: >-
      knowledge/README.md and all existing precedent put a KN id in superseded_by,
      so the superseding entry is KN-FIND-921fbf (withdrawal entry); this record
      is its authority and is cited in its body.
    scope: >-
      The growing-with-m speedup law, the gamma_m ~ 0.86 * 0.68^(m-2) model,
      the crypto-scale extrapolations (3.3x at N=2^256, 5.9x at N=2^1024, and
      m=6,7,8 -> 5.9x, 8.0x, 10.9x) and the "genuine algorithmic contribution"
      framing. The finding's raw rows, relabelled as per-target success at their stated B (m, B, heuristic, gamma_m, speedup at
      p=1009) are observations at their stated B and are not themselves
      retracted; they do not support a law in m because B varies with m.
    replacement_basis: >-
      EV-FALSIFY-67150b for the refutation; KN-FIND-c7d31e for the proved
      per-decomposition retention (m+1)/2^m (speedup (m+1)/2). No replacement growth law is
      asserted by this record.
  related_findings_unchanged_except_scoped_note:
    - id: KN-FIND-c7d31e
      treatment: >-
        NOT superseded. The (m+1)/2^m retention theorem is matched exactly at
        m=2,3 and to within a B-dependent residual at m=4,5 (O-5). Refuted: (1)
        its sentence claiming to be the "foundation" of KN-FIND-2a8b7e's
        geometric law, and (2) its "gamma empirical" column and the "~0.1 bonus
        above the theoretical floor", a per-target estimand artefact (O-6). A
        dated correction section is appended to its body scoped to those two.
    - id: KN-FIND-f8c290
      treatment: >-
        Not in EV-FALSIFY-67150b findings_under_test and carries no BKK
        reference; left unchanged.
  scope: >-
    Status propagation only. This record asserts no new measurement, restates
    no EV-FALSIFY-67150b number as independently reverified, and inherits its
    toy claim_tier: the refutation is of the extrapolated law, not a proof that
    no BKK constant-factor gain exists at any scale. By AGENTS.md rule 6 it
    closes only the tested scope.
  process_failure: >-
    A strong contradicting evidence record gave no mechanical trigger for the
    Coordinator to supersede the finding it contradicted. Findings under test
    named in an evidence record with direction contradicts should be checked for
    superseded_by or a pending correction.
  visuals_note: >-
    AGENTS.md visuals rule checked. No canonical graph source or rendering was
    edited by this change, and no new graph or PDF was generated; this record
    changes claim status in knowledge/ only. A reviewer should confirm whether
    any graph that cites KN-FIND-2a8b7e as a verified edge needs relabelling.
  not_actioned:
