  recorded_by: coordinator
  type: near_exhaustive_census_proven_by_null_object_control_to_have_zero_discriminating_power_despite_scale_a_third_instance_of_this_lanes_conditioning_trap
  severity: high_instrument_no_go_not_a_result
  supersedes: []
  corrects:
    - ledger/hypotheses/H-MONO-5b6617.yaml
    - experiments/EXP-MONO-815525/specification.yaml
