  finding_1_the_projective_interpretation_is_proven_not_merely_plausible: >-
    Both reviewers, independently, via disjoint methods, proved the exact
    identity c_4(e) = S_3^sym(e)^2 (the m=4 quartic's own leading
    coefficient vanishes if and only if H-MONO-93bc4d's own S_3 vanishes,
    i.e. if and only if some signed sum of the three base points equals
    O). This converts "the degree-drop instances are points at infinity"
    from an inference into a THEOREM. The Validator additionally built real
    F_{p^3}/F_{p^6} point arithmetic and directly verified, for ALL 6,762
    disclosed instances (not a sample), that exactly one signed sum equals
    O and that this class is always the Frobenius-fixed one, matching the
    predicted affine action exactly. The Red Team independently derived
    the same closed form and used it to PREDICT the exact exhaustive-sweep
    deviation counts (3378, 3378) with no census at all. The S_4
    construction itself is independently confirmed correct by a third,
    fully disjoint method (direct point enumeration across 15 curves, 7
    primes, 146,839 S_4 multisets, zero mismatches). This is now among the
    most thoroughly independently verified constructions in this lane's
    history.
  finding_1_disposition: >-
    ADOPTED. The projective reading is correct; the 0.98% affine-reading
    deviation is fully explained and does not indicate any monodromy
    anomaly.

  finding_2_the_curve_sample_was_partially_degenerate: >-
    The Red Team found curves C1 (A=2,B=3) and C5 (A=37,B=29) at p=101,
    reported as two independent test curves, are in fact F_p-ISOGENOUS
    (same trace, same group order, same CM discriminant -368, same
    (t,Z)=(6,1) class) -- explaining their "unexpectedly identical" deviation
    counts as a curve-class invariant, not independent confirmation. A
    third randomly-chosen trace-6 curve reproduces the identical count.
  finding_2_disposition: >-
    ADOPTED. The experiment's own claimed "5 independent curves" overstates
    its actual diversity; the effective independent-curve count is closer
    to 4.

  finding_3_the_experiment_has_zero_discriminating_power_a_third_instance_of_this_lanes_conditioning_trap: >-
    THE HEADLINE FINDING. The Red Team proved, via an explicit null-object
    control, that this experiment's own design cannot distinguish full S_4
    monodromy from a MANIFESTLY WRONG, INTRANSITIVE construction. The
    reasoning: AGL(2,2)=S_4's own 8 elements with an order-3 LINEAR part
    are ALL 3-cycles, for EVERY translation -- so "g irreducible" (order-3
    linear part) already logically forces cycle type (1,3) as a pure
    consequence of group structure, INDEPENDENT of which specific
    translation cocycle (the actual curve-specific data that would
    distinguish full S_4 from a smaller group) is realized. The null
    object NULL(T) = (T-e1)*g(T) -- whose monodromy is the INTRANSITIVE
    point-stabilizer S_3, not even transitive on the four roots, let alone
    S_4 -- REPRODUCES THE EXACT SAME CENSUS RESULTS, INSTANCE FOR
    INSTANCE, across every tested prime (19,902/19,902 at p=101,
    9,901/9,901 at p=211, 2,739/2,739 at p=1999). A test that cannot tell
    the real elliptic-curve cover apart from an intransitive dummy
    polynomial provides ZERO evidence for or against the claim it was
    designed to test.
  finding_3_disposition: >-
    ADOPTED IN FULL. This experiment supports the full-S_4 claim by ZERO
    and refutes it by ZERO, regardless of its 688,300-instance scale. This
    is a THIRD INSTANCE OF A NAMED FAILURE CLASS IN THIS LANE: OBS-5's
    factor-base-locus trap (the cycle-type statistic is constant on the
    factor-base locus, by derivation); EXP-MONO-12ce1c's ordered-generic-
    locus trap (F_p's unique quadratic extension caps possible cycle
    types); and now this g-irreducible-CONDITIONING trap (selecting on
    "g irreducible" discards exactly the base points where the real cover
    and a trivial null object would differ, and keeps only the base
    points where group theory alone forces agreement). All three traps
    share the same shape: a locus or conditioning choice that looks like a
    natural, generous sampling domain but is, by pure algebra, blind to
    the very question being asked -- and all three were caught only by
    building an explicit null-object or proves-too-much control, never by
    scale alone.
  finding_3_positive_content: >-
    The Red Team also found the CORRECT diagnostic: an UNCONDITIONED
    five-class census (not filtering to g-irreducible), where every proper
    subgroup of S_4 predicts probability EXACTLY ZERO for at least one
    class actually observed thousands of times -- genuine discriminating
    power. An informal, review-side pilot (10-14s per curve, explicitly
    marked NOT evidence-eligible by the reviewer) found observed
    frequencies matching uniform S_4 Chebotarev predictions well
    (chi-square approximately 4.5-4.9). This is disclosed as informative
    context only; it does not constitute evidence under this program's own
    rules (it was never a frozen, approved contract) and must be re-run
    under a proper contract before any citation.
  finding_3_additional_finding: >-
    H-MONO-5b6617's own claimed "PRE-REGISTERED, TWO-SIDED" framing was
    itself not actually two-sided: the Red Team confirmed the named
    falsifying alternatives (complete splitting, two quadratics,
    irreducible quartic) are GROUP-THEORETICALLY IMPOSSIBLE under an
    order-3 linear part for ANY subgroup capable of producing an
    irreducible g at all -- the falsification branch was empty before the
    run, and any failure would have indicted the construction, not the
    monodromy group. This is the identical one-sidedness this lane already
    diagnosed in the two PRIOR rejected instruments, reintroduced here by
    conditioning rather than by an outright degenerate locus, and not
    caught by this Coordinator's own design review before dispatch.

  reason: >-
    AGENTS.md rule 4 and rule 9 (pursue promising paths in good faith;
    never mischaracterize) require this filed as a correction: an
    experiment reported with an apparently overwhelming 688,300-instance,
    near-exhaustive-sweep result is shown, on independent adversarial
    review, to carry zero evidential content for the question it was
    designed to answer. This is exactly the premature-closure-symmetric
    failure mode docs/inventor-protocol.md names (a target that LOOKS
    thoroughly tested is not the same as one that IS), and disclosing it
    fully, including this Coordinator's own design-review gap in not
    catching the empty-falsification-branch problem before dispatch, is
    required by this lane's own standing practice.

