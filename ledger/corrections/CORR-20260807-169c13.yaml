correction:
  id: CORR-20260807-169c13
  recorded_at: '2026-08-07'
  recorded_by: >-
    top-level session, on EXP-KDUAL-8f0b69 / RUN-KDUAL-8f0b69-001. NOT an independent
    Coordinator and NOT reviewed. This correction re-scopes a claim; it contradicts no
    measurement in the record it corrects.
  type: correct_measurement_at_risk_of_being_read_out_of_scope
  supersedes: []
  corrects:
    - knowledge/findings/KN-FIND-015.md
  record_type: claim
  record_id: KN-FIND-015

  field: KN-FIND-015 "Why it matters" item 1, and the comparison table supporting it
  prior_value: >-
    "Dual does not win under the public MATZOV instrument. Headline dual superiority is
    not visible in lattice-estimator's `dual_hybrid` once the comparison is matched
    inside RC.MATZOV." The supporting table places columns `best`, `Carrier claim` and
    `MATZOV-2022 claim` side by side against estimator outputs for Kyber512/768/1024.
  corrected_value: >-
    THE MEASUREMENT STANDS AND THE HEADLINE SENTENCE IS CORRECTLY SCOPED. What is
    corrected is what the table invites a reader to conclude -- and that is now settled
    rather than left standing as the finding's own unresolved caveat.

    KN-FIND-015 recorded, and did not resolve, the caveat that decides its meaning: that
    lattice-estimator's `dual_hybrid` might not implement the coded-dual improvement
    Carrier's paper is about. IT DOES NOT. At the pinned commit
    3e48ef421ec256afddb3e7d2249a77eab6e9ba12 -- the same commit KN-FIND-015 used -- a
    scan of nine estimator source files returns ZERO code-based decoding terms. The 19
    hits in reduction.py are all BDGL16 `list_decoding`, the nearest-neighbour cost model
    used inside sieving, under three spellings. Structurally, the dual cost in
    lwe_dual.py (class MATZOV, documented "Theorem 7.6") is

        rop = T_sample + T_guess

    -- two terms -- against Carrier Theorem 4.1

        T = T_sample + R * (N * T_dec + T_FFT)

    -- three components, with an explicit per-sample decoding cost and a repetition
    factor. A two-term cost has nowhere to put either. A negative control passes: the
    same scan finds 54 FFT hits in the same file, so the zero is a fact about the source
    and not about the procedure.

    CONSEQUENCE. The `Carrier claim` column and the estimator column are NOT measuring
    the same algorithm, and the row-wise comparison between them is not meaningful.
    KN-FIND-015 is evidence about the public instrument. It must not be cited, in this
    corpus or outside it, as evidence that the coded dual attack fails to beat primal on
    Kyber, nor as support for or against Carrier's claimed margins. KN-FIND-016 remains
    the corpus's actual engagement with that paper.

  additional_corrections:
    - field: KN-FIND-015's comparison against MATZOV-2022's own numbers
      prior_value: >-
        The table lists MATZOV-2022 claims 137.5 / 193.5 / 257.8 beside estimator
        dual_hybrid+fft outputs 143.79 / 203.79 / 273.82, without comment.
      corrected_value: >-
        NOT CORRECTED -- ESCALATED. This gap of 6.3 / 10.3 / 16.0 bits is NOT explained by
        the missing coded-dual stage, because the estimator class in question is
        documented as implementing MATZOV Theorem 7.6 and is being compared against
        MATZOV's own headline. Something else is responsible. Candidates, none
        investigated here: the cost model passed to `short_vectors`, the `beta_sieve ~
        beta` assumption the source itself flags in a comment, or how success probability
        is charged. With the Carrier comparison now removed as meaningless, THIS is the
        live question in the lattice lane -- and it is a question about whether the
        corpus can reproduce a published dual-attack cost at all.

  reason: >-
    KN-FIND-015 wrote down the caveat that decided its own meaning and left it open, and
    the corpus has since cited the finding without distinguishing the two readings. The
    determination turned out not to need SageMath at all: EXP-KDUAL-8f0b69 specified it
    as a SOURCE READ precisely because output numbers cannot separate "modelled and
    cheaper" from "not modelled at all". It cost one curl and one grep against a
    content-addressed commit.

  evidence_artifacts:
    - experiments/EXP-KDUAL-8f0b69/specification.yaml
    - experiments/EXP-KDUAL-8f0b69/runs/RUN-KDUAL-8f0b69-001/raw-result.json
    - experiments/EXP-KDUAL-8f0b69/runs/RUN-KDUAL-8f0b69-001/source/
    - ledger/evidence/EV-KDUAL-bd9750.yaml

  caveat: >-
    Unreviewed, single session. The mitigations specific to this claim: it is binary, the
    source is archived and hash-pinned inside the run directory, the upstream commit is
    content-addressed, and the whole determination reproduces in two commands. The
    lexical scan is backed by a structural reading of MATZOV.cost, but a reader wanting
    certainty should read that method rather than trust the grep.
