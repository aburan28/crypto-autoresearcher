correction:
  id: CORR-20260805-4b91ca
  recorded_at: '2026-08-05'
  recorded_by: dispatching-session
  type: proposal_defect_record
  supersedes: []
  corrects:
  - ledger/proposals/IDEA-20260803-fa9839.yaml
  - ledger/proposals/IDEA-20260803-82b2b7.yaml
  authority:
    found_by: coordinator
    found_in: >-
      Pre-compute design audit for proposed batches BATCH-70a55a (GOAL-SSI-001) and
      BATCH-156658 (GOAL-ECDLP-001), recorded in DEC-20260805-0e1c91 and
      DEC-20260805-bb162b.
    independently_verified_by: >-
      dispatching-session, at source, before this record was written. Each of the two
      load-bearing findings (D5, D6) was checked against the cited committed artifact
      rather than against the auditor's quotation of it; the two arithmetic defects
      (D2, D3) were re-derived independently.
  summary: >-
    THE TWO PROPOSALS ARE NOT WITHDRAWN AND ARE NOT OVERWRITTEN. Both remain committed
    records at ledger/proposals/ exactly as filed on 2026-08-03 (AGENTS.md rule 4:
    results are immutable; corrections create new records). This record enumerates six
    defects found during a pre-compute design audit, so that any goal later considering
    either proposal reads the defects alongside it. Two defects are fatal to
    IDEA-20260803-82b2b7 as written; four are repairable defects in
    IDEA-20260803-fa9839, whose core algebra was independently re-derived and is
    correct.
  defects:
  - id: D1
    record: IDEA-20260803-fa9839
    field: proof_search_map.baseline_embedding
    severity: design
    statement: >-
      The baseline-reproduction gate is evaluated at N = q^n, m = n - which is exactly
      the family at which DEC-20260802-a51c82's per-fibre correction 2(1 - 1/W_eff)
      is said to compound as 2^(n-1) - and the gate does not model that correction. The
      headline point prediction (discrepancy exactly 2/(n(n+1))) could therefore pass or
      fail for an unmodelled reason.
    repair: >-
      Make IDEA-20260803-ff7415 a BLOCKING dependency of the baseline gate rather than
      the "independent" it is currently recorded as. ff7415 decides whether that
      correction compounds; until it reports, the gate cannot attribute a discrepancy.
  - id: D2
    record: IDEA-20260803-fa9839
    field: predictions[model_optimizer_exponent]
    severity: fatal_as_written
    statement: >-
      The prediction asserts B* = N^(1/(m+1)) "exactly". With D_trial = N^d the
      stationary point is B* = [(m-1) m! N D / (2 c_LA)]^(1/(m+1)), i.e.
      B* proportional to N^((1+d)/(m+1)). The two agree ONLY at d = 0, and the entire
      region the threshold concerns has d > 0. As written the prediction would trip the
      proposal's own falsifier F3 (symbolic verification failure) and void everything
      downstream.
    repair: >-
      Restate as B* proportional to N^((1+d)/(m+1)), recovering N^(1/(m+1)) as the d = 0
      special case. The threshold d < (m-3)/4 and T* = Theta((m! N D)^(2/(m+1))) are
      UNAFFECTED and remain correct.
  - id: D3
    record: IDEA-20260803-fa9839
    field: target_complexity.memory_exponent
    severity: material
    statement: >-
      The memory row quotes 2^42.7 stored elements at m = 5, N = 2^256, which is the
      d = 0 optimum N^(1/6). At the threshold value d = (m-3)/4 = 1/2 the same formula
      gives B* = N^((1+1/2)/6) = N^(1/4) = 2^64. The row understates memory at the
      headline cell by a factor of about 2^21, and memory is a feasibility constraint the
      proposal itself says must be emitted beside every time row.
    repair: >-
      Emit the memory row as a function of d, with the value AT the threshold as the
      headline, not the value at d = 0.
  - id: D4
    record: IDEA-20260803-fa9839
    field: minimal_test.design step 4 / dependencies
    severity: design
    statement: >-
      The blocking primary-source gate is expected to be UNRUN in this environment, and
      an UNRUN gate deletes every step-(6) artifact - the threshold table, the d_max
      rows, the deferred-measurement ranking, and the m <= 3 reading - i.e. the entire
      headline deliverable. The proposal does not pre-register what it emits in that
      case.
    repair: >-
      Pre-register the degraded deliverable explicitly, before execution. EV-IC-002
      records this exact lane retracting a support verdict because a criterion was
      revised after being observed to fail; deciding the fallback after seeing the gate
      fail would repeat it.
  - id: D5
    record: IDEA-20260803-82b2b7
    field: claim / proof_search_map.bottleneck
    severity: fatal
    statement: >-
      The proposal asserts that "this single measurability question is what QM-STOPPING
      has been failing on for eight batches". THE COMMITTED RECORD SAYS OTHERWISE.
      coordination/goals/GOAL-SSI-001/batches/BATCH-018/tasks/TASK-20260730-043/stopping_law_artifact.md
      section 4 records the FAIL as SEVEN obligation rows - six not_instantiated and one
      rejected_as_insufficient. Their stated reasons are absence of source material
      (transition kernel, independence, uniform success bound, joint postprocessing cost,
      classical recovery/tail), and the terminal sigma-algebra row's own reason is
      "Verify(x,k') absent in pinned code; recovery_spec only". NOT ONE ROW IS A
      pi-INVARIANCE ROW. EV-SSI-041 had already classified the gap in terms - "OUTCOME-D
      for-all-hosts remains undischarged (availability/host gap, not object obstruction)".
      The proposal hunts an object obstruction where the lane's evidence records an
      availability gap.
    verification: >-
      Confirmed at source by the dispatching session: the seven rows and the quoted
      reason strings were read directly from stopping_law_artifact.md, not from the
      audit's quotation of it.
    repair: >-
      None available within the proposal's frame. The correct successor is the
      QM-STOPPING premise-and-exit audit named in DEC-20260805-0e1c91, which classifies
      each of the seven rows as source_absent | object_obstructed | undetermined. A
      measurability instrument acquires a target only if that audit returns at least one
      object_obstructed row (revisit condition R-B).
  - id: D6
    record: IDEA-20260803-82b2b7
    field: minimal_test.controls / predictions[planted_control_detection]
    severity: fatal
    statement: >-
      The planted lossy-projection control is the proposal's own HARD BLOCKER - by its
      falsifier F1, without it NEITHER primary outcome may be read - and it is
      UNCONSTRUCTIBLE from frozen material. FC0-EXT-PKG-SSI-001 freezes interface
      SIGNATURES only: surfaces_frozen is a list of names plus
      "stage_live_sets_and_F_star_error_channels_as_spec_checklists"; explicit_non_claims
      includes not_implemented; the interpretation_limit states that freeze "does not
      mean Verify or lifetimes are implemented"; and the package carries the constraint
      "Do not invent Verify(x,k') or W/R/B/M_tail lifetime APIs on this pin. This package
      is a separate in-repo interface, not a CollimationSieve API surface." The package
      defines NO execution model and NO projection pi. Building one is the host-API
      invention prohibited by every decision since BATCH-019.
    verification: >-
      Confirmed at source by the dispatching session against
      coordination/goals/GOAL-SSI-001/batches/BATCH-021/tasks/TASK-20260730-055/fc0_extension_package.yaml.
    repair: >-
      None available. Revisit condition R-A applies: reconsider only if a committed
      artifact defines an execution model, a projection pi on it, and the stopping event
      S as a subset of that model.
  - id: D7
    record: IDEA-20260803-82b2b7
    field: predictions[lane_disposition_emitted] / minimal_test baseline gate
    severity: minor
    statement: >-
      Two internal inconsistencies, neither a ground for the decline. (a) The prediction
      says the batch emits "exactly one of two dispositions" while falsifiers F1-F4 admit
      at least three more, and its phrasing "Retain FAIL IS NOT AN ADMISSIBLE OUTCOME"
      is in verbal conflict with a prohibition that must be carried forward verbatim.
      (b) The BATCH-013 reproduction gate is real and reproducible (analyzer_results.yaml:
      36 rows, 1014 pairs, zero_progress_count 16, minimum positive p = 1/4) but it is a
      REACHABLE-STATE PROGRESS search, not a projection-collision search; it exercises
      enumeration machinery only and has no power over the collision predicate. The
      proposal overstates it as a known-answer control for the instrument.
    repair: >-
      Both repairable in a task card; recorded so that a future reader does not inherit
      the overstatement.
  what_this_does_not_do:
  - >-
    It does NOT withdraw either proposal, edit either file, or change any status. Both
    remain exactly as committed on 2026-08-03.
  - >-
    It does NOT refute IDEA-20260803-82b2b7's underlying observation - that eight-plus
    batches retained QM-STOPPING FAIL with no named obstruction. DEC-20260805-0e1c91
    records that observation as standing unrefuted and names a successor aimed at it.
  - >-
    It does NOT adjudicate the merit of IDEA-20260803-fa9839. DEC-20260805-bb162b is a
    routing decline; the core algebra was independently re-derived and is correct, and
    the four defects here are repairs, not rejections.
  - >-
    It asserts nothing about ECDLP or supersingular-isogeny hardness in either
    direction, and moves no exponent, cost, or claim tier.
