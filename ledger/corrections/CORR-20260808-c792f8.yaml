  field: >-
    observations[4] (the "Executor run (EXP-WESOVOW-001, RUN-WESOVOW-001)"
    bullet's clause "with zero hidden overhead the vOW middle regime beats
    Delfs-Galbraith at every tested budget w = 2^30..2^80 for all five
    sizes") AND inference (the clause "NIST-III/V retain comfortable
    margins under every tested overhead scenario").
  source: >-
    DEC-20260806-a00a28's corrections_owed_not_made names EV-WESO-001 as
    owing a superseding correction: "Its committed finding that the method
    'beats Delfs-Galbraith at every tested budget w = 2^30..2^80' is
    reported to be a direct product of the MC_P13 anchor error. Correctly
    anchored, the crossover sits near log2 w ~ 49.5 entries." That
    figure's derivation is committed at
    coordination/goals/GOAL-SSI-001/batches/BATCH-b3c87f/reviews/
    TASK-20260806-9536f4/red_team_report.md, section "4. THE vOW
    CONVENTION CONFLICT" (l.271-275): "Under the correct law at NIST-I,
    w = 2^30 gives 106.5 + 0.5(92.5 - 30) = 137.75 > 128: the method loses
    to Delfs-Galbraith there. The correct crossover is at log2 w ~ 49.5
    entries, not at every tested budget." That same report independently
    identifies EV-WESO-001's inference field as where the subject
    inverts (l.339-345): "EV-WESO-001's own inference field then rewrites
    it as 'NIST-III/V retain comfortable margins under every tested
    overhead scenario', which in a security document reads as scheme
    safety... A superseding correction must therefore supersede
    EV-WESO-001's inference sentence, not only the synthesis line." This
    record is that superseding correction to EV-WESO-001 itself (the
    synthesis document's own separate sentence in
    analysis/SSI-ECDLP-SYNTHESIS-20260803.md remains a distinct, still-
    queued correction -- see the accompanying decision record's
    next_actions).
  independent_verification_by_the_coordinator: >-
    RECOMPUTED HERE FROM EXP-WESOVOW-001/cost_model.py'S OWN COMMITTED
    LITERALS (FIELD_SIZES, PAPER_PAIRS), NOT ACCEPTED ON THE RED TEAM'S
    WORD ALONE. cost_model.py defines, per field size, the paper's raw
    (log2 time, log2 memory) pair (no E(P) per-entry correction --
    EV-WESO-001 predates and is unrelated to that later, separate
    correction from EV-SSI-59f7a2): P=256:(106.5,92.5),
    384:(157.5,138.6), 512:(204.2,181.3), 576:(230.9,206.0),
    768:(302.4,272.2); and the memoryless Delfs-Galbraith baseline
    T_DG(P)=P/2 (cost_model.py's own "T_DG_baseline": "p^{1/2}"). Applying
    the already red-team-verified corrected charging
    T_A(P,w) = T_full(P) + 0.5*max(0, L_mem(P) - log2_w) (the same formula
    verified twice independently for EXP-SSI-9b542d, per
    coordination/goals/GOAL-SSI-001/batches/BATCH-284f63/reviews/
    TASK-20260806-10980e/red_team_report.md section 1) to
    EXP-WESOVOW-001's own PAPER_PAIRS, at the SINGLE explicitly-tested
    budget w=2^30 (the low end of EV-WESO-001's own cited range
    2^30..2^80), for ALL FIVE sizes:

      P=256: T_A(256,30) = 106.5 + 0.5*(92.5-30)  = 137.75  vs T_DG=128   -> LOSES by  9.75 bits
      P=384: T_A(384,30) = 157.5 + 0.5*(138.6-30) = 211.80  vs T_DG=192   -> LOSES by 19.80 bits
      P=512: T_A(512,30) = 204.2 + 0.5*(181.3-30) = 279.85  vs T_DG=256   -> LOSES by 23.85 bits
      P=576: T_A(576,30) = 230.9 + 0.5*(206.0-30)  = 318.90  vs T_DG=288   -> LOSES by 30.90 bits
      P=768: T_A(768,30) = 302.4 + 0.5*(272.2-30)  = 423.50  vs T_DG=384   -> LOSES by 39.50 bits

    At the SAME single tested budget (w=2^30) already inside
    EV-WESO-001's own claimed range, the correctly-anchored method loses
    to Delfs-Galbraith at ALL FIVE sizes -- this alone is a sufficient
    counterexample to "beats Delfs-Galbraith at every tested budget
    w=2^30..2^80 for all five sizes" and requires no further computation
    to refute the claim as stated. Separately, solving
    T_full(P) + 0.5*(L_mem(P) - log2 w*) = T_DG(P) for the exact crossover
    log2 w* = L_mem(P) - 2*(T_DG(P) - T_full(P)) at all five sizes (only
    the P=256 value was previously stated in a committed record; the other
    four are newly derived here, by the identical method, directly from
    cost_model.py's own literals, and are NOT yet independently reviewed):

      P=256: log2 w* = 92.5  - 2*(128-106.5) = 92.5  - 43.0  =  49.5   (matches the committed red-team figure exactly)
      P=384: log2 w* = 138.6 - 2*(192-157.5) = 138.6 - 69.0  =  69.6   (newly derived)
      P=512: log2 w* = 181.3 - 2*(256-204.2) = 181.3 - 103.6 =  77.7   (newly derived)
      P=576: log2 w* = 206.0 - 2*(288-230.9) = 206.0 - 114.2 =  91.8   (newly derived; exceeds the largest tested budget, 2^80)
      P=768: log2 w* = 272.2 - 2*(384-302.4) = 272.2 - 163.2 = 109.0   (newly derived; exceeds the largest tested budget, 2^80)

    So at P=576 and P=768 the method does not beat Delfs-Galbraith at ANY
    of EV-WESO-001's tested budgets (w=2^30..2^80): the true crossover
    lies entirely above the tested range. At P=256/384/512 the method
    loses below its crossover (49.5/69.6/77.7) and only wins above it,
    still contradicting "at every tested budget."
  prior_value: >-
    observations: "Executor run (EXP-WESOVOW-001, RUN-WESOVOW-001): the
    paper's five concrete (time, memory) pairs reproduce only within
    0.05-3.51 bits (partial control failure, honestly disclosed); with
    zero hidden overhead the vOW middle regime beats Delfs-Galbraith at
    every tested budget w = 2^30..2^80 for all five sizes; overhead
    scenario 2^{c*sqrt(log2 p)} shifts the crossover by 2c*sqrt(log2 p)
    bits." inference: "...NIST-III/V retain comfortable margins under
    every tested overhead scenario. The deciding control is an empirical
    calibration of the per-entry table construction cost (red-team NC-2)."
  corrected_value: >-
    THE "BEATS DELFS-GALBRAITH AT EVERY TESTED BUDGET" CLAIM IS REFUTED BY
    COUNTEREXAMPLE, NOT MERELY DISPUTED. It is a direct product of
    EXP-WESOVOW-001/cost_model.py line 236's anchor error
    (T_w_vOW = T_full/sqrt(min(w,M)), the square root of a memory COUNT
    rather than a RATIO, which does not reduce to T_full at w=M -- the
    identical defect class independently repaired and red-team-verified
    in EXP-SSI-9b542d). Correctly anchored, at the single already-tested
    budget w=2^30 the method LOSES to Delfs-Galbraith at all five tested
    sizes (9.75 to 39.50 bits behind, worst at the largest size, not
    best). The true crossover log2 w* is 49.5/69.6/77.7 entries at
    NIST-I/384/512 -- inside the tested range, so the method beats
    Delfs-Galbraith only above that point, not throughout -- and 91.8/109.0
    entries at 576/768, i.e. ABOVE the entire tested range
    (max tested = 2^80), so at those two sizes the method never beats
    Delfs-Galbraith at any tested budget at all. "Beats Delfs-Galbraith at
    every tested budget for all five sizes" is false at every one of the
    five sizes tested, not merely imprecise at the margin.
    The `inference` field's "NIST-III/V retain comfortable margins under
    every tested overhead scenario" inherits the same inversion the red
    team traced to this exact sentence: under the correct anchoring,
    NIST-III (P~384-576 range) and NIST-V (P~512-768 range) are the sizes
    at which the assessed method's advantage over Delfs-Galbraith, if any,
    requires the MOST memory relative to what was tested -- the opposite
    of "comfortable margins" read as a defender-favorable statement. No
    claim about deployed-scheme safety is supportable by this record in
    either direction; see boundaries below.
  what_this_does_not_establish:
    - >-
      This is NOT a new EV-* evidence record and does not itself supply a
      claim_tier / proof_status'd finding about the true crossover curve
      p*(w) across parameter sizes -- it is a correction that refutes the
      specific overclaim EV-WESO-001 makes, using a counterexample
      (the w=2^30 case, checkable by direct substitution, requiring no
      new experiment) plus a derivation (the five-size crossover table,
      an algebraic identity applied to already-committed literals). A
      proper superseding evidence record for the crossover-curve
      deliverable itself (matching proposal IDEA-20260803-48e258) is
      still owed and is NOT created here; per AGENTS.md rule 12 and the
      precedent set by CORR-20260807-732541's own required_action, no
      such record may be written from this finding, cited as a corpus
      KN-FIND, or relied upon in a review-xhigh / review-breakthrough
      context, without independent review of the newly-derived four
      P!=256 crossover values above.
    - >-
      This does not touch EXP-WESOVOW-001/cost_model.py at its own
      source; the code defect that produced the original overclaim
      remains uncorrected there and is separately queued (see the
      accompanying decision's next_actions) as Executor-scoped work
      (a code change plus a re-run), not Coordinator-authorable.
    - >-
      This does not correct analysis/SSI-ECDLP-SYNTHESIS-20260803.md's
      own "NIST-III/V retain comfortable margins" sentence, which is a
      separate markdown document, not a ledger record, and remains a
      distinct, still-queued correction (DEC-20260806-a00a28's
      corrections_owed_not_made lists it independently of EV-WESO-001).
    - >-
      This asserts nothing about SQIsign's deployed security or about any
      NIST-standardized parameter set's practical margin. The corrected
      finding is scoped exactly to the tested EXP-WESOVOW-001 cost-model
      comparison (an extrapolated estimator, no executed attack,
      certificate.kind: none throughout).
    - >-
      This does not change H-WESO-001's hypothesis status.
