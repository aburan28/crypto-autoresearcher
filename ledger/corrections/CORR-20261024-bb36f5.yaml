correction:
  id: CORR-20261024-bb36f5
  recorded_at: '2026-10-24'
  recorded_by: coordinator
  authorizing_decision: DEC-20261024-23d64d
  goal_id: GOAL-CZLIFT-1516d5
  record_type: hypothesis
  record_id: H-CZLIFT-6d4ed1
  field: >-
    mechanism (M1, M2), statement "alike" clause (M3), and
    structural_ingredients (C1, a new citation entry beside the Katz entry).
    One correction: one record, one review round.
  prior_value: Quoted verbatim per item in items[].prior_value.
  corrected_value: Per item in items[].corrected_value.

  items:
    - id: M1
      field: mechanism, last sentence
      prior_value: >-
        "The canonical curve lift changes End(E^) but not this exact sequence,
        so it contributes nothing."
      corrected_value: >-
        The canonical curve lift changes End(E^) but not the prime-to-p
        splitting E^(Q_p)[n] = E(F_p)[n] (theorem), and at toy scale it does
        not change the identity-readout success rate of the three named
        sections (measured; red-team matched-lift control within 0.967x to
        1.058x of a same-shape null). It is not structurally inert: on the
        canonical j = 0 lift the Teichmuller section is Aut(E^)-equivariant
        (multiplier set mu_6 minus {1} on 16 of 16 curves), and on a perturbed
        lift of the same reduction it is not. That structure is already owned
        by Pollard rho with automorphism classes and is not a discrete-log
        resource.
      basis: [EV-CZLIFT-ad28f5 B-6/OBS-8/obstruction.resource_check, red-team O5 of RT-20261023-5636c1]
    - id: M2
      field: mechanism, fifth sentence
      prior_value: >-
        "A section recovering d would need tau(dP)/tau(P) = d for all d, i.e.
        tau would have to encode the discrete logarithm itself."
      corrected_value: >-
        A section recovers d through the Smart functional exactly when its
        tau-ratio z(tau_dP)/z(tau_P) is an efficiently invertible function
        f(d) (f = id is the frozen readout; the planted f(x) = n - x and
        f(x) = x^2 mod n sections recover d at rate 0.990 to 1.000 and pass
        the frozen test). Any such section is a discrete-log oracle: tau then
        encodes the discrete logarithm.
      basis: [EV-CZLIFT-ad28f5 B-7/B-5/OBS-8, red-team O6 of RT-20261023-5636c1]
    - id: M3
      field: statement, clause "on the canonical curve lift and on an arbitrary lift alike"
      prior_value: >-
        "and for the Hensel, naive-integer and Teichmuller sections it equals
        d mod p at the random rate 1/p, on the canonical curve lift and on an
        arbitrary lift alike."
      corrected_value: >-
        Read as stated in EV-CZLIFT-ad28f5 supported_statement: for the three
        sections, the event "Smart ratio = d mod p" occurs at a rate
        consistent with 1/p per arm and seed (frozen detection floor 4.2x to
        5.2x of 1/p). "Alike" holds for that success event only, on the
        per-arm tests and the matched-lift control; the frozen arm comparison
        is confounded and powerless and is excluded from the basis, and the
        lifts are structurally different (M1). Not a statement that every
        non-canonical section recovers d only at 1/p (EV-CZLIFT-ad28f5 B-3),
        and subject to the integral-multiple stratification of
        DEC-20261023-039ddf control C1 before any rate is read as random.
      basis: [EV-CZLIFT-ad28f5 supported_statement/B-3/B-4, DEC-20261023-039ddf]
    - id: C1
      field: structural_ingredients (citation added beside the Katz entry; the Katz entry is unchanged)
      prior_value: >-
        "description: Serre-Tate canonical lift of an ordinary curve; CM
        curves with class number one lift as their integral model; citation:
        'N. Katz, Serre-Tate local moduli, LNM 868 (1981)'; provenance:
        recalled; verified_by: null; role: the canonical curve lift arm"
      corrected_value:
        added_entry:
          description: >-
            For ordinary E/F_p there is a unique lift for which End(lift) ->
            End(E) is an isomorphism, equivalently the unique lift to which
            Frobenius lifts: the canonical lift (Deuring's lifting theorem;
            Lubin-Serre-Tate).
          citation: >-
            M. Deuring (1941); J. Lubin, J.-P. Serre, J. Tate (1964); as stated
            in A. Chambert-Loir, "Compter (rapidement) le nombre de solutions
            d'equations dans les corps finis", Seminaire Bourbaki 968 (2006),
            arXiv:math/0611584, section 3.2.1
          provenance: retrieved
          verified_by: TASK-20261023-1d45b5
          role: >-
            the canonical-lift label of the cm_canonical arm. Not load-bearing
            for s_tor, which exists on every lift. Checked directly (a
            Frobenius lift exists) for D = -3 on 16 of 16 models; for
            D in {-7, -8, -11, -19, -43, -67, -163} the label rests on exact
            j-invariants plus this theorem.
        katz_entry: >-
          Unchanged and still provenance recalled, verified_by null. The red
          team could not access Katz's text, so it remains a pointer, never
          support (AGENTS.md core rule 9).
      basis: [red-team citations_checked of RT-20261023-5636c1, DEC-20261023-36b4f0 N-4, EV-CZLIFT-ad28f5 unresolved_confounds]

  reason: >-
    DEC-20261023-36b4f0 N-4 asks for a correction on the two mechanism
