  field: >-
    inputs.auxiliary_k_rule_frozen, and the "DUAL-AUXILIARY-TUPLE
    CONSISTENCY CHECK" entry under controls -- both added by this
    Coordinator's own subagent dispatch, NOT present in either source
    proposal (IDEA-20260807-fd5a24, IDEA-20260807-11b93d).
  prior_value: >-
    "Every exact reachable-count measurement is run twice with two
    independently fixed auxiliary-k tuples (auxiliary_k_rule_frozen); the
    two counts must agree exactly. A disagreement is a code defect,
    reported under invalidation_rules, not absorbed as noise." The rule
    itself: fix k_i = i+1 for i=1..(slots-1) as tuple A, and k_i = slots+i
    for tuple B, leaving the final "target" slot's own multiplier
    unassigned by the rule's text. This was drafted as an ADDITION beyond
    what either source proposal specified, "made to remove an ambiguity
    neither IDEA-20260807-fd5a24 nor IDEA-20260807-11b93d pinned down" --
    and, unlike everything carried FROM the source proposals, this specific
    check was never independently mathematically verified before being
    frozen. It was not caught by this Coordinator's own review of the
    drafted contract (which independently re-derived Lemma 1 and the
    alpha_min correction, but did not re-derive this check's own premise).
  corrected_value: >-
    THE PREMISE IS MATHEMATICALLY FALSE IN GENERAL, RE-VERIFIED
    INDEPENDENTLY BY THIS CORRECTION, NOT ACCEPTED ON THE EXECUTOR'S REPORT
    ALONE. The number of distinct integer sums achievable from a FIXED set
    of weights over a symmetric box [-C0, C0] depends on the SPECIFIC
    weight values, not merely on their count or range -- this is a basic,
    well-known fact of additive combinatorics (a Sidon-set / mixed-radix
    separation condition), not a code defect. Only weights satisfying
    w_i > 2*C0*sum(w_1..w_{i-1}) for each i give a provably collision-free,
    tuple-choice-independent count (a genuine positional number system);
    k_i = i+1 (1, 2, 3, 4, ...) grows only linearly and does not come close
    to satisfying that separation at any tested C0. Independently
    re-derived and confirmed by direct enumeration in this correction (not
    merely re-stated from the execution report): for weights (1,2) versus
    (1,3) over box {-1,0,1}, achievable sums are
    {-3,-2,-1,0,1,2,3} (7 values) versus {-4,-3,-2,-1,0,1,2,3,4} (9
    values) -- unequal, exactly as the Executor's own worked example
    (experiments/EXP-CANL-96b0ad/implementation.md, deviation D6) states,
    reproduced here with a fresh brute-force script rather than trusted.
  why_the_underlying_measurements_are_unaffected_but_both_verdicts_are_blocked: >-
    This is a defect in a GATE this Coordinator added, not in the
    substantive measurements it gates. Every individual quantity RUN-CANL-
    78b8bd actually computed -- the exact shell enumerations, the Lemma-1
    search, the tautology certificates (independently re-verified by a
    second, separately-invoked call per the contract's own certificate
    semantics), the reachable-k-count ratios -- passed its own component
    self-tests (G0's canl_self_test and canonical_height_self_test) and is
    reported as raw measurement in c1-measurements.json/c2-measurements.json.
    What is NOT valid is the dual-auxiliary-tuple check's own PASS/FAIL
    verdict, because the check itself compares two quantities that a
    correct implementation is mathematically required to disagree on at
    these weight values -- so the check firing "correctly" (per the frozen
    contract's own literal text) proves nothing about either regime's
    substantive claim. The frozen decision rule routed this exactly as
    written (C1_INSTRUMENT_INVALID, C2_INSTRUMENT_INVALID, "instrument
    cannot see what it needs to see" -- both true statements about THIS
    check, applied honestly), and that routing is not itself in question;
    what is in question is whether this particular check should have been
    part of the frozen contract in the form it was frozen in.
  scope_of_this_correction: >-
    This correction does NOT reach C2's other two independent
    INSTRUMENT_INVALID findings from the same run (the 2/65 shell-count
    cells exceeding 15% relative error at small predicted counts, and the
    C0=1 threshold-control tie) -- both read, on this Coordinator's own
    first pass, as plausible genuine finite-size effects of the shell-count
    formula's own stated O(...) error term and a degenerate small-C0 case
    respectively, NOT as defects in a check this Coordinator wrote, but
    this has NOT yet been independently verified with the same rigor as
    the dual-tuple finding above and is explicitly left open pending the
    independent review this Coordinator has separately dispatched. Nor
    does this correction reach the finding that none of the four
    c2-congruence-ladder primes realize the maximal order for j=0 (f_E=1)
    -- a fact about which primes the frozen ladder rule happens to select,
    stratified and reported rather than pooled exactly as H-CANL-e59a06's
    own open assumption requires, and a separate question from whether it
    represents a gap this lane still needs to close.
  required_action:
  - >-
    A versioned protocol_amendment (v2) to EXP-CANL-96b0ad is required
    before any second dispatch of this experiment. It must replace
    auxiliary_k_rule_frozen and the dual-auxiliary-tuple check with a
    construction that is actually collision-free by proof, not by
    assumption -- for example, two independently fixed weight tuples each
    satisfying the separation condition above (a genuine mixed-radix
    choice), so "the two counts must agree exactly" becomes a provable
    consequence of the construction rather than an empirical hope. This
    Coordinator has not yet drafted that amendment; doing so is a
    follow-up action, not performed by this correction.
  - >-
    The same amendment pass should independently assess (not necessarily
    fix in the same way) the shell-count tolerance and C0=1 threshold-tie
    findings, and should explicitly decide whether the f_E=1 gap requires
    an extended or different C2-congruence-ladder rule before this lane's
    claim C2 can be said to have been tested in the regime its own
    mechanism (H-CANL-e59a06 STEP 5) most directly derives its formulas
    for.
  - >-
    Cite this correction alongside any future reference to RUN-CANL-78b8bd's
    C1_INSTRUMENT_INVALID / C2_INSTRUMENT_INVALID terminal states: the
    states are genuine and correctly computed by the frozen rule as
    written, but "the instrument could not see what it needed to see"
    is, for the dual-tuple component specifically, a fact about a check
    this Coordinator wrote unsoundly, not a fact about the Executor's
    implementation or the underlying mathematics of C1/C2 themselves.
