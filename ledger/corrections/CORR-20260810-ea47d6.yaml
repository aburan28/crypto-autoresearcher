correction:
  id: CORR-20260810-ea47d6
  recorded_at: '2026-08-10'
  recorded_by: coordinator (GOAL-ENDO-001, BATCH-de621d, TASK-20260810-934566)
  type: >-
    material_overstatement_in_a_committed_decision_plus_understated_disclosure_in_the_amendment_it_approves
  supersedes: []
  corrects:
  - ledger/decisions/DEC-20260810-6b4554.yaml (rationale item 4 and limitation
    item (iii))
  - experiments/EXP-ICINV-4d33aa/amendments/v3.yaml (the
    `disclosed_thinness_that_is_NOT_repaired_here` block)
  record_type: decision
  record_id: DEC-20260810-6b4554
  source_of_this_correction: >-
    VAL-20260810-48202a, the independent validation dispatched as
    TASK-20260810-5d32a5 and archived at
    coordination/goals/GOAL-ENDO-001/batches/BATCH-de621d/reviews/validator/validation_report.yaml.
    Terminal verdict `passed`, verdict statement "v3 FROZEN WITH FINDINGS".
    Findings F-V3.2 and F-V2.4 are the two corrected here. Read in full by this
    Coordinator, not summarised from a message.
  field: >-
    (1) the whole-gate false-failure probability of SR3-v3 as restated in
    DEC-20260810-6b4554 rationale item 4; and (2) the "estimated sampling
    standard deviations" attached to the retained +-0.25 operating-row tolerance
    in v3's `disclosed_thinness_that_is_NOT_repaired_here` and repeated in
    DEC-20260810-6b4554 limitation (iii)
  prior_value: >-
    (1) DEC-20260810-6b4554 rationale item 4 ends: "and the whole-gate
    false-failure probability, approximately 2.0e-3, computed from the frozen
    constants" -- unqualified. (2) v3's disclosure applies ONE pair of figures to
    BOTH G3b and G3c: "about 1.08 estimated sampling standard deviations at
    p = 4001's operating row and about 1.25 at p = 6007's"; DEC-20260810-6b4554
    limitation (iii) repeats the pair as "approximately 1.08 and 1.25 estimated
    sampling standard deviations at the two operating rows".
  corrected_value: >-
    (1) F-V3.2. THE 2.0e-3 FIGURE IS QUALIFIED IN THE AMENDMENT AND THE
    QUALIFIER IS DROPPED IN THE DECISION. v3's own `value` field reads
    "Approximately 2.0e-3 ... EXCLUDING G1, G4 and G3b/G3c for which no sampling
    model is stated." It is therefore NOT the whole-gate false-failure
    probability; it is the false-failure probability of G2 and G3a only, over two
    primes. The validator reproduced the arithmetic exactly (1.973865e-3 by the
    record's approximation, 1.973054e-3 exact) and confirms the amendment is
    CORRECT; the defect is that the decision's summary presents the headline
    number without its exclusion, where a later reader will take it as the gate's
    risk. Wherever the figure is restated it must carry the exclusion.
    (2) F-V2.4. THE TWO-SAMPLE sqrt(2) IS APPLIED TO z AND w BUT OMITTED FROM
    G3b. The pair 1.08 / 1.25 is CORRECT FOR G3c ONLY -- a comparison against a
    FIXED CONSTANT, 0.25/sigma_VR = 1.0779 at p = 4001 and 1.3188 at p = 6007.
    G3b is a comparison of TWO MEASUREMENTS, whose sampling standard deviation is
    sd_j = sqrt(2) sigma_VR, so its figures are 0.25/sd_j = 0.7622 at p = 4001
    and 0.9325 at p = 6007. The sqrt(2) the record applies to z and w is omitted
    exactly where including it would make the record's own disclosed thinness
    look worse.
  magnitude_of_the_second_defect_and_its_effect_on_the_first: >-
    Under a fresh independent redraw the two-sided false-failure probability of
    G3b ALONE would be 0.446 at p = 4001 and 0.351 at p = 6007, against 0.281 and
    0.187 for G3c. G3b -- one of the checks the 2.0e-3 figure EXCLUDES -- is
    therefore the check most likely to fire on a fresh draw, by more than two
    orders of magnitude above 2.0e-3, and would dominate any fresh-draw gate
    failure. That is the corrected reading of rationale item 4: not "the whole
    gate fails falsely at 2.0e-3", but "G2 and G3a together fail falsely at
    2.0e-3, while the excluded G3b would fail falsely at roughly 0.45 and 0.35 on
    a fresh draw".
  what_does_not_change: >-
    NOTHING OPERATIONAL TURNS ON EITHER DEFECT TODAY, and this correction claims
    no more than that. Under the frozen seed 20260807 Arm A0 and the reference
    are the same committed sampler on the same class at the same T over the same
    grid, so G3b's delta is 0 BY CONSTRUCTION and no fresh-draw risk is realized
    at all. The amendment's arithmetic reproduced independently at every point
    the validator checked, its central mitigation claim -- that the acceptance
    region at every row is a function of (T, n_j, mbar_j, VR_ref_j) and of
    gamma2_j and of nothing else -- is VERIFIED and not overstated, and the
    terminal verdict is `passed`. Both defects must be corrected before any
    amendment that changes the seed, T, the curve set or the sampler, which is
    the exact condition v3's own block sets for itself.
  other_findings_recorded_here_but_not_corrected_by_this_record:
  - >-
    F-V1.4, BLOCKING BEFORE EXECUTION, and the finding this review existed to
    catch. v3 freezes a MUST-report on per-curve exactness against the reference,
    but THE REFERENCE'S PER-CURVE RATES DO NOT EXIST IN ANY COMMITTED ARTIFACT:
    RUN-ICINV-f09176 and RUN-ICINV-p4001-fixed each contain exactly command.txt,
    environment.json, manifest.yaml, raw-result.json, stdout.log and stderr.log,
    and their raw-result.json carries only row-level aggregates and an n_curves
    count, with no per-curve array at any depth. The handoff records that the
    dispatching Coordinator independently re-verified this by walking the full
    raw-result.json structure of both reference runs. A9 forbids re-measuring or
    substituting a reference and makes doing so INVALID, so the natural repair is
    the third non-mathematical INVALID termination. This is NOT corrected here
    because it cannot be corrected by a correction: it requires a versioned
    protocol_amendment v4, which is next action N13 in DEC-20260810-3110d5. NO
    EXECUTION OF EXP-ICINV-4d33aa IS CONTRACTED, APPROVED, OR PERMITTED UNTIL
    F-V1.4 IS RESOLVED.
  - >-
    F-V4.1, composite disclosure gap. Assembling the record's own facts, SR3-v3
    applied to the frozen configuration against the frozen references IS KNOWN IN
    ADVANCE TO PASS IN ITS ENTIRETY -- G1 passes, G2 passes with z = w = 0 at
    every row, G3a passes, G3b's delta is 0 by construction, G3c's deltas are
    0.0002028291085371947 and -0.012235844773044402 (both inside +-0.25), G4's
    monotonic_decay is False in both references, and G5 cannot fire. Every
    component is disclosed; the CONJUNCTION is drawn in neither v3 nor
    DEC-20260810-6b4554. On this configuration SR3-v3 is an
    implementation-drift detector, not a control that could fire on the
    mathematics. That is a defensible thing for a gate to be and an indefensible
    thing to leave a reader to assemble; it must be stated in whatever record
    accompanies a version-3 dispatch.
  - >-
    F-V2.1: v3's declared approximation is stated as "within 0.15% of 1 at every
    row of both primes" while its own bound in the same sentence gives
    (VR-1)/T <= 0.0065; the validator computed max (VR_ref - 1)/T = 0.006470 at
    p = 4001, fb = 18, i.e. 0.65% on the variance and 0.32% on the standard
    deviation. Permissive in direction; an accuracy defect in a frozen record.
  - >-
    F-V3.1: the "3.5 is stricter than Sidak" claim is family-size sensitive and
    the record uses the largest defensible family. The crossover is at k = 21.60;
    at k = 52 the Sidak value is 3.7277, at k = 26 -- the per-prime family the
    aggregate rule actually fires over -- it is 3.5492, and at k = 13 it is
    3.3624, where 3.5 would be LOOSER. The conclusion SURVIVES the family that
    matches how the rule fires, so no looseness was bought, but the margin falls
    from 0.228 to 0.050 and the per-prime value belongs beside the 52-test one.
  - >-
    F-V5.1: the "not reverse engineered" rebuttal is VACUOUS rather than false.
    Its counterfactual -- "if the version-2 failure had been a G2 failure, this
    aggregate rule would have failed the prime anyway" -- has an antecedent that
    cannot occur, since no row CAN be a G2 failure when the two measurements are
    identical by construction. The conclusion survives and is if anything
    strengthened: nothing in v3 is sized to absorb the failure, because the
    failure mode is removed outright by the change of tested quantity. The honest
    statement is "the aggregate tolerance is INERT on the observed data".
  - >-
    F-V4.2 (the design implements candidate (b) plus a piece of candidate (c),
    whose authority is the Coordinator's task card and not the user's election);
    F-V4.3 (values labelled "reference" are read from a file carrying only Arm
    A0's, differing only in the last floating-point digits); F-V5.2 ("tighter,
    not looser" holds upward and fails downward at 23 of 26 rows); F-V6.1 (G3c is
    a RESTORATION of the specification's literal text, not only a new
    strengthening, and the record does not name the version-2 substitution it
    corrects); F-V6.2 (naming). Recorded; none is corrected here and none is
    operationally live under the frozen seed.
  what_this_does_and_does_not_mean:
  - >-
    THE AMENDMENT REMAINS ADMISSIBLE AS A FROZEN CONTRACT. `passed` means no
    numeric free parameter remains in any reachable state of the contracted run;
    the three ambiguities the validator found are drafting defects in branches
    that are provably unreachable under this contract. It does NOT authorize
    execution, and under F-V1.4 execution must not be contracted at all until a
    v4 amendment resolves the unsatisfiable MUST.
  - >-
    NEITHER PRIOR ICINV TERMINATION IS EVIDENCE AND THIS CORRECTION CREATES NONE.
    Both version-1 and version-2 INVALID terminations are admissibility failures,
    and bear on H-ICINV-6c7920 and EV-ENDO-10109d in NEITHER direction. No
    hypothesis status moves, no evidence record is written, EV-ENDO-10109d is
    untouched, and zero runs were executed by this task or by the review that
    produced these findings.
  - >-
    TOY SCALE THROUGHOUT. p in {2003, 4001, 6007}, n_curves 138/140, T = 400,
    `claim_tier: toy`, `sota_delta` zero, no transfer offered. Nothing here
    supports or weakens any claim about ECDLP hardness at any scale.
  - >-
    THE REVIEW'S INDEPENDENCE IS LIMITED AND THE LIMIT IS PART OF THIS RECORD.
    VAL-20260810-48202a records that the requested policy `review-adversarial`
    resolved with `fallback_used: false` and reasoning_effort xhigh, but also
    `model_verified: false` (no `doctor --probe` receipt, so the identifier is
    verified configuration and not a probe result) and, in its own limitations,
    that THIS REVIEW AND THE REVIEWED AMENDMENT RESOLVE TO MODELS ON THE SAME
    BACKEND -- "independent" means an independent session, context and fresh
    reading, NOT independent judgement from a different model. An error of
    reasoning shared by the authoring and reviewing sessions would not have been
    caught.
  - >-
    THE USER'S ELECTION OF CANDIDATE (b) IS UNCHECKED, NOT PASSED (F-V4.4). It
    appears only in three Coordinator-authored artifacts of the same dispatching
    session. What the validator COULD corroborate independently is that
    DEC-20260809-de11f9 reserves the third attempt as "a user decision, not
    dispatched automatically", names three candidates, and that candidate (b)'s
    wording is quoted VERBATIM; and that the records are careful to label the
    authority as the user's rather than a Coordinator self-grant. A Validator
    cannot verify a user utterance from artifacts, and this record does not
    represent it as verified.
  - >-
    THE VALIDATOR ALSO DID NOT EVALUATE whether SR3-v3 is the BEST of the three
    candidates -- only whether the filed design is frozen, arithmetically
    correct, and not quietly sized to pass -- and could not verify that the
    underlying statistical model is the right one for the physical process.
    F-V2.3 records a real tension between the two declared randomness models;
    both discrepancies the validator could sign run in the permissive direction.
  required_action:
  - >-
    DO NOT EDIT DEC-20260810-6b4554, experiments/EXP-ICINV-4d33aa/amendments/v3.yaml,
    or any other committed record (AGENTS.md rule 4). This correction supersedes
    by reference; the validator's own limitations say the same.
  - >-
    N13 (recorded in DEC-20260810-3110d5, blocking and highest priority): author
    protocol_amendment v4 resolving F-V1.4 before any version-3 execution is
    contracted -- either restrict the per-curve report to what the committed
    artifacts can support, or declare the reference-side per-curve comparison
    UNAVAILABLE BY ARTIFACT and record that A9 makes it permanently so, or state
    the alternative evidence that discharges the requirement. Note the
    second-order consequence the validator identified: the block's stated purpose
    ("reported so that a version-4 amendment can promote it on evidence") is
    defeated too, because the scheduled evidence can never be produced while A9
    stands.
  - >-
    IN THAT SAME SUPERSEDING RECORD, not by edit: attach the exclusion qualifier
    to the 2.0e-3 figure wherever it is restated (F-V3.2); apply the sqrt(2) to
    G3b's disclosed thinness, giving 0.76 and 0.93 sd rather than 1.08 and 1.25
    (F-V2.4); correct the 0.15% figure to 0.65% on the variance and 0.32% on the
    sd (F-V2.1); and record the per-prime Sidak value 3.5492 beside the 52-test
    3.7277 (F-V3.1).
  - >-
    STATE THE CONJUNCTION OF F-V4.1 in whatever record accompanies a version-3
    dispatch.
