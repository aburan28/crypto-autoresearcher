correction:
  id: CORR-20260803-f459b3
  recorded_at: 2026-08-03
  record_type: claim
  record_id: GOAL-ECDLP-001
  field: latest_verified_commit, and the BATCH-028 identifier
  prior_value: >-
    This branch wrote
    latest_verified_commit: 927f78e29ff2762074380c464c2f4aa9b3c1f2fe598687f33a71e816fc43a6925cbc
    into GOAL-ECDLP-001 at its BATCH-028 checkpoint. That string is SIXTY-EIGHT
    hex characters. A git commit SHA is forty.
  corrected_value: >-
    (1) THE FIELD WAS CORRUPTED BY MY OWN EDIT AND IS RESTORED TO MAIN'S VALUE.
    The Coordinator wrote the checkpoint with a regular expression bounded at
    [0-9a-f]{7,40}, which matched only the first forty characters of the value
    already present and left the remaining twenty-eight attached as a tail. The
    leading forty characters, 927f78e29ff2762074380c464c2f4aa9b3c1f2fe, ARE a
    real commit -- the BATCH-028 ledger archive TASK-20260802-268ec9, which
    research_dispatch.py accepted. The corruption is in the FIELD, not in the
    archive. On merge, main's own concurrently-advanced value c52a0ca0... is
    taken, because main's lane published first and a living checkpoint field is
    not an immutable record.
    THE FACT MAIN'S RECORD DOES NOT CARRY, recorded here so it is not lost: this
    branch's GOAL-ECDLP-001 BATCH-028 produced a DISPATCHER-VERIFIED ledger
    archive at 927f78e2 carrying EV-DS-84d006, DEC-20260802-446a54 and
    CORR-20260802-757677 -- the owed direct smoothness measurement of HEUR-DS-1,
    1046528 integers factored, reproduced bit-exactly by an independent
    validator, and closed as ATTEMPTED_AND_INCONCLUSIVE.
    (2) BATCH-028 IS A SECOND BATCH-NUMBER COLLISION AND HOLDS BOTH LINES. Main's
    BATCH-028 carries TASK-20260731-125 through -131; this branch's carries
    TASK-20260802-80f5e9, -6a39f8, -d34ac4, -0a1d4d, -411037 and -268ec9. The
    task sets are DISJOINT, so no artifact collides and only the living dispatch
    documents did. Main keeps dispatch_queue.json and its plans; this line is
    republished as dispatch_queue.smth-4403c4.json with matching plan files, named
    for the experiment it dispatches. Same resolution as CORR-20260803-202715 gave
    BATCH-029, and the same precedent CORR-20260802-002 set for BATCH-020: no task
    renumbered, no artifact moved, no hash-bound path changed.
  reason: >-
    THE REGEX DEFECT IS ENTIRELY MINE AND IT IS THE SECOND TIME THIS SESSION A
    COORDINATOR EDIT DAMAGED A FIELD IT MEANT TO SET. It went unnoticed because
    nothing validated the field's shape and because I read the write as having
    succeeded rather than reading the result. That is the same failure mode as
    marking a validator FAILED without opening its directory and as reporting a
    hygiene PASS from an unread pipeline: asserting the state of something I did
    not look at. CORR-20260803-791ca7 already records the pattern for summary
    lines; this extends it to FIELD WRITES. A Coordinator edit to a ledger field
    must be read back and shape-checked, not assumed from the absence of an error.
    THE COLLISION IS THE SIXTH IDENTIFIER COLLISION THIS SESSION and the second at
    BATCH granularity. tools/allocate_id.py --next covers record identifiers and
    does NOT cover batch numbers, which are still chosen by scanning what exists --
    the method KN-FIND-030 recorded as not concurrency-safe. Two independent
    demonstrations now exist.
  evidence_artifacts:
    - ledger/goals/GOAL-ECDLP-001.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/dispatch_queue.smth-4403c4.json
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/archives/TASK-20260802-268ec9/ledger-receipt.json
    - ledger/corrections/CORR-20260803-202715.yaml
  supersedes: null
  superseded_by: null
