correction:
  id: CORR-20260916-292e53
  recorded_at: '2026-09-16'
  recorded_by: coordinator
  area: ICPERF
  supersedes_on_this_point_only:
    - REVIEW-ICPERF-20260915-a33cda-R6-ADD1
  does_not_supersede: >-
    The addendum stands in full on everything else: its three leak sites are real, its extended
    blind_from list is correct, its pre-registration procedure is the right mitigation and WORKED, and
    its recorded priors stand. review-plan-r6.yaml is untouched. What is corrected is one claim the
    addendum makes about ITSELF — that it protects the value — and one omission from its own list.

  defect:
    what: >-
      THE MITIGATION WAS THE EARLIEST LEAK SITE, AND IT IS THE ONLY ONE THE REVIEWER WAS GUARANTEED TO
      HIT. review-plan-r6-addendum-1.yaml exists to stop the value R6 must derive independently from
      reaching R6 before it derives it. It names three leak sites by QUOTING WHAT THEY CARRY: `gb_size:
      43` appears in its leak_sites block three times, at lines 38, 50 and 51, and the summary form
      `gb_size = 43 / maxdeg = 2` appears at line 51. The dispatch brief for TASK-20260915-abf147
      instructed the reviewer to read the addendum IN FULL before starting. The disclosure therefore
      delivered the value to the reviewer by mandate, before it opened a single instance file.
    the_omission: >-
      The addendum's own `blind_from_extended_by_this_addendum` list does not — and by construction
      cannot — include itself. A fourth leak site existed and went unlisted: this file.
    how_it_is_known: >-
      Not inferred. The reviewer disclosed it in
      coordination/review/icperf-20260915-a33cda/TASK-20260915-abf147/PREREGISTERED-VALUES.json, block
      `exposure_disclosure`, which names the addendum's leak_sites block as the exposure site, times it
      at approximately 2026-09-16T08:29Z "on the dispatch brief's instruction to read the addendum in
      full, before any instance file was opened and before any derivation", and states the consequence
      the addendum itself prescribed for an early exposure. That disclosure is the record; this
      correction only accepts it.
    the_irony_is_load_bearing_and_not_decoration: >-
      The addendum's own forward guidance, item 2, reads "DO NOT PUT MEASURED VALUES IN COORDINATION
      PROSE. A number in a task card, a batch opening report or a bus message cannot be un-read by the
      agent the card assigns. Cite the record that holds the value instead; a pointer costs nothing and
      does not leak." The addendum then put the measured value in coordination prose the assigned agent
      was required to read. The rule was correct and was violated in the act of writing it, which is
      worth recording precisely because it shows the rule is not obvious enough to follow by intention
      alone — it needs a mechanical check, which is what the forward guidance below supplies.

  what_this_costs_and_what_it_does_not:
    the_unperturbed_derivation: >-
      Reported as an INFORMED independent computation, never as a blind re-derivation. This is the
      weighing the addendum itself prescribed for exposure before pre-registration, so the outcome is
      the one the mitigation was designed to make readable rather than a surprise. The composition of
      REVIEW-ICPERF-20260915-a33cda will use those words.
    what_survives_at_full_strength: >-
      Three things, and they are not small. (1) The ORDER was protected: the reviewer pre-registered
      four values, its exact command, its engine input hash and an independent non-engine solution count
      BEFORE reading anything further, which is exactly what pre-registration buys and is why it is
      worth doing even when a blind looks airtight. (2) The perturbed control is UNAFFECTED — no record
      in this repository carries the Groebner basis of a deliberately perturbed n15l5-1-S, so it cannot
      be looked up, and it therefore carries the joint. (3) Two of the four pre-registered quantities
      were NOT exposed anywhere the reviewer read: the quotient dimension over GF(2) and the
      brute-force count of GF(2) solutions. The reviewer states this explicitly and the Coordinator has
      confirmed by search that neither value appears in the leak sites. An agreement on those two is
      evidence at full strength.
    what_this_is_not: >-
      NOT a reviewer failure. The reviewer did the one thing that preserves value here: it disclosed the
      exposure, timed it, and named the file that caused it, unprompted, in a write-once record it wrote
      before deriving anything. NOT a measurement defect either — no number changes, and no engine
      output is in question.
    exactly_how_far_the_two_unexposed_quantities_are_protected: >-
      Checked by search rather than asserted, and the two differ. The QUOTIENT DIMENSION's value appears
      in no leak site: the phrase "quotient dimension" occurs in the dispatch queue only as the NAME of
      a quantity the reviewer is asked to derive, which is the assignment and not an answer. The
      BRUTE-FORCE SOLUTION SET is different — the three satisfying assignments are recorded in
      experiments/EXP-ICPERF-e21835/runs/RUN-ICPERF-a4a24b/ (results_engine.jsonl, the WDSat logs,
      stdout.log) and in experiments/EXP-ICPERF-66fd51/runs/RUN-ICPERF-305ca3/. Both directories are
      inside review-plan-r6.yaml's original blind_from, so that quantity is protected BY THE BLIND
      rather than by not existing anywhere. Its strength therefore rests on the reviewer's attestation
      that it did not read those directories, which the composition must check rather than assume — a
      weaker footing than the quotient dimension's, and recorded here so the composition does not treat
      the two as equally clean.

  forward_guidance:
    - >-
      DISCLOSE A LEAK BY PATH, NEVER BY QUOTING ITS CONTENT. "source_record.yaml carries three of the
      four values R6 must derive, for this exact instance" says everything a reviewer needs in order to
      avoid the file. Naming the value adds nothing to the avoidance and destroys the thing being
      protected. This is the same rule as the addendum's own forward guidance item 2, now with the
      disclosure document itself inside its scope.
    - >-
      IF A LEAK MUST BE CHARACTERISED EXACTLY, PUT IT IN A SEALED SIBLING. Write the quoting version to
      a separate file, name it in the reviewer's blind_from, and have the brief say the reviewer may
      open it only after pre-registration. The Coordinator keeps a precise record; the reviewer keeps
      its order.
    - >-
      A BLIND ASSIGNMENT'S GREP MUST INCLUDE THE DOCUMENTS THE BRIEF MANDATES. The addendum's first
      forward-guidance item — grep for the value before dispatching — was followed, and still missed
      this, because the search was run over the repository as it stood BEFORE the addendum was written.
      A file authored as part of the dispatch is part of what the reviewer reads; re-run the search
      after writing the brief, over the brief.
    - >-
      PRE-REGISTRATION IS NOT A CONSOLATION PRIZE, IT IS THE LOAD-BEARING PART. On this joint the blind
      was breached by the mitigation document itself and the joint still returns usable evidence,
      entirely because the order was fixed in a write-once file. Make it the default for every blind
      re-derivation, and expect the blind to leak.

  refs:
