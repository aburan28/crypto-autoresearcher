  summary: The m=3 exclusion is scoped to the model without Frobenius-orbit collapse. The review's
    idealized orbit model gives 2^58.0348, below its rho reference 2^60.8090. This removes that model-based
    exclusion only; no efficient decomposition algorithm or end-to-end speedup is demonstrated.
  field: Scope of the m<=3 exclusion and the J1(c) orbit-collapse comparison; original measurements
    unchanged.
  prior_value: The finding says no amount of oracle engineering at m=3 produces a crossover. The
    validator J1(c) output prints an orbit-collapsed m=3 floor of 2^58.0348 but then states m=3 stays
    above rho; its explanatory sentence assigns only about 3.5 bits to the collapse.
  corrected_value: 'The no-collapse continuous model remains above rho at m=3: 2^68.58496 for N=4r
    and 2^67.58496 for N=r. In the separate hypothetical orbit model C(B)=(B/k)N/binom(B,3)+3(B/k)^2
    with k=131, the same N=4r yields 2^58.03483, below rho 2^60.80904. Replacing binom(B,3) by B^3/6,
    AM-GM gives min C=6*sqrt(2N)/k^(3/2): the discount is (3/2)*log2(131)=10.55013 bits, not about
    3.5. The ordinary-base model does not acquire this discount. Consequently the no-collapse floor
    cannot exclude all m=3 Frobenius-stable-set methods. The archived script/stdout remain historical
    artifacts; this record supersedes the contradictory comparison sentence and any extension of
    the no-collapse exclusion to that separate model.'
  reason: An immutable review contains a numerical result and a conflicting hard-coded interpretation.
    Correct the scope rather than rewriting the history or treating an optimistic floor as a working
    algorithm.
  scope_note: Arithmetic audit of a conditional continuous cost model, not an unconditional complexity
    lower bound. A realizable Frobenius-stable base with compatible subgroup accounting, decomposition
    yield, independent rank, the assumed collapsed linear algebra, and an affordable decomposition
    oracle remain unestablished here. Factor-base construction, memory, verification, relation failures
    and real operation costs are not validated by this comparison. No experimental observation, hypothesis
    status, goal status or rho measurement changes. A non-invariant linear subspace may not be charged
    as a full orbit union. CORR-20260928-2b8f4e retains its separate reproducibility-gap claim; only
    its broad m=3 exclusion and m=4 first-in-principle wording are restricted to the model without
    orbit collapse.
  provenance: internal; cited source files retrieved and read at the input base commit
