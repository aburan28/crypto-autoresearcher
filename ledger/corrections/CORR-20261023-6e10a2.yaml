  record_id: RQ-CZLIFT-b9f765
  field: >-
    decision_target: the four obstruction clauses of branch (a) (A1 to A4),
    the closure sentence of (a) (A5) and the trigger of branch (b) (B1). One
    correction, because every item concerns the same field of one record, the
    same closure condition and the same review round.
  prior_value: >-
    Quoted verbatim, clause by clause, in items[].prior_value. The whole field
    reads: "Either (a) the measured obstruction: on the canonical curve lift
    Smart's residue is degenerate for every point lift; the canonical point
    section exists, is computable in O(log n + k log p) curve additions, and
    kills the formal logarithm; every non-canonical section recovers d at the
    random rate 1/p; small global points cover E(F_p) no better than uniform
    reductions -- in which case the question closes negatively for the tested
    constructions and the exact obstructions are promoted as findings; or (b) a
    section family or a global point family whose success or coverage exceeds
    the random model with replicated significance, which triggers independent
    review and a scaling experiment before any claim. Toy-scale evidence
    authorizes scaling work only; nothing here bears on a deployed curve."
  corrected_value: >-
    Per item in items[].corrected_value. The final sentence ("Toy-scale
    evidence authorizes scaling work only; nothing here bears on a deployed
    curve.") stands unchanged.

  items:
    - id: A1
      field: decision_target (a), first clause
      prior_value: >-
        "on the canonical curve lift Smart's residue is degenerate for every
        point lift"
      corrected_value: >-
        On an anomalous ordinary curve with class-number-one CM, Smart's
        precision-p^2 residue is degenerate for every point lift exactly on the
        unramified Z_p-lifts with v_p(j(E^) - j_can) >= 2e (e = 3 at j = 0,
        e = 1 otherwise): the canonical lift and every lift congruent to it to
        that order (the isomorphic and pert_p2 classes degenerate on 100
        percent of samples), not the canonical lift alone. On every lift with
        v_p(j(E^) - j_can) < 2e Smart recovers d; the operative condition is
        "P has no p-torsion lift", which equals "E^[p] non-split" because
        #E(F_p) = p. This is a Serre-Tate/Kummer theorem with prior art
        (Belding 2007, section 7, arXiv:math/0703906, provenance retrieved by
        TASK-20261023-856638). The runs calibrate the instruments against it
        (14,616 of 14,616 rows, p <= 1373; 4608 of 4608 rows at
        10^4 <= p <= 10^5, toy tier); they are not independent evidence for
        it. The j = 0 threshold 2e = 6 is pinned only to (3, 6].
      basis: [DEC-20261023-147f9f, EV-CZLIFT-712fe4, DEC-20261023-9de83a, EV-CZLIFT-e9a7cf, KN-FIND-3c7e19]
    - id: A2
      field: decision_target (a), second clause
      prior_value: >-
        "the canonical point section exists, is computable in O(log n + k log
        p) curve additions, and kills the formal logarithm"
      corrected_value: >-
        For ordinary E/F_p, p >= 5, a subgroup <P> of prime order n != p and
        any good-reduction Z_p-lift, the n-torsion section s_tor is the unique
        homomorphic section of reduction over <P>, is computable in at most
        2(bits(n) + bits(p^k)) + 1 complete additions at precision k, and the
        Smart (formal-logarithm) functional z([n]s(R)) vanishes identically on
        it. Established by derivation uniform in p (analysis.md I-A, D1 to D6),
        not only at toy scope; the runs confirm the instruments (1116 of 1116
        pairs). s_tor carries the discrete-log relation isomorphically into
        E^(Q_p)[n], where it is no easier. "Kills the formal logarithm" covers
        the formal-logarithm readout only. Whether a coordinate or digit
        encoding of s_tor carries d is OPEN (KN-OPEN-d3a6f0, KN-OPEN-3417fc).
        EXP-CZLIFT-1a3453 (H-CZLIFT-fba874 analyzed, refine, preliminary)
        excludes only single-character correlations above a per-record floor on
        42 power-bearing records and may not be cited as closing this clause.
      basis: [DEC-20261023-36b4f0, EV-CZLIFT-ad28f5, KN-FIND-7e2b94, DEC-20261023-2e7447, EV-CZLIFT-764f54]
    - id: A3
      field: decision_target (a), third clause
      prior_value: >-
        "every non-canonical section recovers d at the random rate 1/p"
      corrected_value: >-
        False as worded. Counterexamples: the validator's s_leak and the
        red team's planted sections f(x) = n - x and x^2 recover d at rate
        about 1 (any section whose tau-ratio is an efficiently invertible
        function of d is a discrete-log oracle); on F_p^* the naive integer
        section beats 1/p exactly where g^d mod p^2 < p; and, review-side, an
        integral section on a small-coefficient global model recovers d
        exactly at the integral multiples of a small global lift of P
        (Siegel-finite, no discrete-log leverage). Supportable form, at toy
        tier: for the three named choice-free sections (hensel_random, naive,
        Teichmuller) and the identity readout (Smart ratio = d mod p), off the
        instances on which the section coincides with a homomorphic global
        section on small-height elements, (i) on non-anomalous curves
        (50 <= p <= 600, n <= 613, k = 4) the success rate is consistent with
        1/p, and the frozen test excludes only excesses of about 4.2x to 5.2x
        of 1/p per arm and seed; (ii) on anomalous degenerate lifts
        (p <= 1373) the POOLED count is consistent with the matching
        random-section null 1/(p+1) for the governing definition
        (CORR-20261023-9f2176), not per cell (on j = 0 lifts the Teichmuller
        section never succeeds on d in mu_6 minus {+1, -1}); (iii) at
        10^4 <= p <= 10^5 zero successes give 95 percent upper bounds of
        8.7e-4 per anomalous row and 5.2e-3 per row per torsion section, which
        do not test 1/p. No clause of this item may be read as a random rate
        until the integral-multiple stratification (control C1 of
        DEC-20261023-039ddf) has split every elliptic Smart-style statistic in
        GOAL-CZLIFT-1516d5.
      basis: [DEC-20261023-36b4f0, EV-CZLIFT-ad28f5, DEC-20261023-147f9f, EV-CZLIFT-712fe4, CORR-20261023-9f2176, DEC-20261023-9de83a, EV-CZLIFT-e9a7cf, DEC-20261023-039ddf, EV-CZLIFT-f2a401]
    - id: A4
      field: decision_target (a), fourth clause
      prior_value: >-
        "small global points cover E(F_p) no better than uniform reductions"
      corrected_value: >-
        False as worded, on both census lanes, and untestable on its upper side
        by the frozen instrument. The distinct-residue ratio of any point set is
        at most min(x,1)/(1 - e^-x) with x = n/N_p, so the frozen band
        [0.8, 1.2] cannot fail upward at the observed cell sizes. Against
        calibrated nulls (post hoc), the reductions are not uniform: median
        1.0330 / 1.0333 against uniform bands with upper edges <= 1.0041
        (EXP-CZLIFT-a255fc, eight-curve ladder) and 1.0424 against a nested
        uniform null of 1.0008 +- 0.0017 (EXP-CZLIFT-14f6d5, record curves). The
        excess is structured (kernel-of-reduction height floor
        h^ >= 2 log p - c_E, image index) and works against relation finding;
        by pigeonhole any spread saves at most a factor 2 ln 2 in the number of
        points. A negative closure of the global-lift sub-question rests on the
        fixed-rank counting obstruction of EV-CZLIFT-376eee, not on
        uniformity: reduction is a homomorphism, so half coverage of E(F_p)
        needs at least N_p/2 distinct global points (Omega(p) points against
        O(sqrt p) for rho), i.e. log H_half >= (sqrt(Reg) N_p/(2 V_r))^{2/r}
        (1 + o(1)) at fixed rank r. Beyond toy scale that bound holds only
        under transfer assumptions T1 to T4 (rank fixed independently of p;
        bounded c_E and height difference; index <= 2; a fixed E/Q standing in
        for the attacker's p-dependent lift). Height is not attack cost.
        EXP-CZLIFT-ed8113 measures no coverage and may not be cited for this
        clause. E(K) coverage is untested (EV-CZLIFT-376eee C5; the
        EXP-CZLIFT-8c50ea run set is inadmissible, DEC-20261023-fdc4af).
      basis: [DEC-20261023-26a6de, EV-CZLIFT-376eee, DEC-20261023-6931ab, EV-CZLIFT-b6fe48, DEC-20261023-488023, DEC-20261023-fdc4af]
    - id: A5
      field: decision_target (a), closure sentence
      prior_value: >-
        "in which case the question closes negatively for the tested
        constructions and the exact obstructions are promoted as findings"
      corrected_value: >-
        A negative closure through (a) uses A1 to A4 as corrected here, never
        the clauses as originally worded. It is a closure result, so it takes
        independent review-breakthrough review at max (AGENTS.md rule 12,
        never degraded) under a review_plan written before any reviewer runs,
        and each cited evidence record's obstruction block must be measured
        over a scope at least as wide as the closure asserts. "The tested
        constructions" names, at the time of closure, the curves, lifts,
        sections, readouts, precisions, height windows and fields that the
        cited evidence records actually cover; E(K) and fields of degree > 2
        are excluded unless a valid E(K) run set exists, and coordinate or
        digit encodings of s_tor are excluded while KN-OPEN-d3a6f0 is open.
        Promotions already made this round: KN-FIND-3c7e19, KN-FIND-7e2b94,
        KN-FIND-c71e5d (findings), KN-OPEN-d3a6f0 (open problem).
      basis: [DEC-20261024-23d64d, DEC-20261023-36b4f0]
    - id: B1
      field: decision_target (b), trigger
      prior_value: >-
        "a section family or a global point family whose success or coverage
        exceeds the random model with replicated significance"
      corrected_value: >-
        "The random model" means the null that matches each metric definition,
        stated before the run: 1/(p+1) for the all-v_p >= 2 anomalous
        next-digit rate, the exact lift-conditioned null for a deterministic
        section, and, for coverage, a seeded same-shape uniform null together
        with the structured kernel-floor null, with the per-cell cap reported.
        An excess that a known non-p-adic mechanism explains (the archimedean
        no-carry region on F_p^*; integral multiples of a small global lift on
        E) is not a (b) trigger. A coverage excess on an instrument whose upper
        side is capped below its threshold is not a (b) trigger. A section that
        encodes d by construction (a discrete-log oracle) is excluded.
      basis: [CORR-20261023-9f2176, DEC-20261023-039ddf, DEC-20261023-26a6de, DEC-20261023-fdc4af, EV-CZLIFT-ad28f5]

