  source: >-
    GOAL-SSI-001's own committed next_action (DEC-20260807-47db22 /
    EV-SSI-0c529c, carried forward unchanged and unresolved until this
    record) names exactly this correction as the one required, non-blocking
    follow-up owed before this contract's output may be cited in any
    review-xhigh or review-breakthrough context. It is independently
    confirmed at source by TWO separate red-team passes, in addition to the
    Coordinator's own re-derivation below: (1) TASK-20260806-9536f4's report
    (coordination/goals/GOAL-SSI-001/batches/BATCH-b3c87f/reviews/
    TASK-20260806-9536f4/red_team_report.md, section "4. THE vOW CONVENTION
    CONFLICT", the "Now the two committed chargings" table, l.256-269),
    which is where the 46.25/69.30/90.65-bit deviations were first computed
    against the P=256/384/512 rows; and (2), decisively and specifically
    against this exact sentence, TASK-20260806-10980e's report
    (coordination/goals/GOAL-SSI-001/batches/BATCH-284f63/reviews/
    TASK-20260806-10980e/red_team_report.md, section "3b. A genuine
    inconsistency in the new spec's own self-description of
    RG-REPRODUCTION-GATE", l.153-177), which quotes the sentence verbatim
    and states plainly: "the literal sentence quoted above therefore
    appears to be false for the superseded formula." The Coordinator's own
    repair_report.md (coordination/goals/GOAL-SSI-001/batches/BATCH-284f63/
    tasks/TASK-20260806-55cf1f/repair_report.md, section "Fix 3", 3.1 and
    3.3) independently tabulates the same per-P deviations, by hand, before
    either red-team pass existed.
  independent_verification_by_the_coordinator: >-
    RECOMPUTED HERE, NOT ACCEPTED ON EITHER REVIEWER'S WORD. At
    log2_w=1000 (the frozen spec's own
    memory_grid.unbounded_memory_representation stand-in for "unbounded
    memory"), the superseded formula
    MC_P13_SUPERSEDED_do_not_use gives
    T_A(P,w) = T_full(P) - 0.5*min(log2_w, L_mem(P)). Since the largest
    committed L_mem(P) is 272.2 (at P=768) and 1000 > 272.2,
    min(1000, L_mem(P)) = L_mem(P) for every one of the five committed
    rows, so the memory term at log2_w=1000 evaluates to exactly
    -0.5*L_mem(P) under the superseded formula -- NOT zero and NOT small.
    At P=256 (NIST-I, the exact parameter RG-REPRODUCTION-GATE evaluates):
    L_mem(256)=92.5, so the term is -46.25 bits. Substituting into RG-1's
    own declared configuration (law L1, S=0, A=0), whose frozen T_full
    value is 118.461328: T_A(256,1000) = 118.461328 - 46.25 = 72.211328,
    which lies 46.038672 bits outside RG-1's asserted band
    [118.25, 118.75] -- roughly 92 times the band's own half-width
    (0.25 bits), not a near-miss. This independently reproduces both cited
    reviewers' numbers (72.2113 / 72.211337) to the trailing digit, and it
    is the identical value EV-SSI-455241's OBJ-1 finding already recorded
    as the reason EXP-SSI-697354 was rejected (DEC-20260806-a00a28).
  prior_value: >-
    "...this control's tolerance windows are wide enough that a CONSTANT
    offset in the memory term at unbounded memory (exactly the class of
    bug that got EXP-SSI-697354 rejected) does NOT necessarily move any of
    RG-1..RG-5 outside their bands, because those bands were never
    actually sensitive to the memory term at log2_w=1000 in either formula
    version -- repair_report.md section 'Fix 3' section 3.1 shows this in
    detail. This is exactly why BOUNDARY-CONDITION-GATE exists as a
    SEPARATE, tighter, absolute-value control rather than relying on
    RG-1..RG-5 alone."
  corrected_value: >-
    THE SENTENCE IS FALSE AS WRITTEN FOR THE SUPERSEDED FORMULA, NOT
    MERELY IMPRECISE. RG-1, RG-2, RG-3, and RG-5's bands ARE -- and
    historically WERE -- highly sensitive to the memory term at
    log2_w=1000: evaluating MC_P13_SUPERSEDED_do_not_use at that point
    produces a 46.25-to-136.1-bit deviation across the five committed P
    rows (256/384/512/576/768) that moves each of those bands' outputs
    tens to over a hundred bits outside its asserted 0.5-bit-wide window --
    this IS EV-SSI-455241's OBJ-1 finding (T_A(256)=72.2113 against
    [118.25,118.75]), the exact defect that got EXP-SSI-697354 rejected,
    and RG-1 caught it in that sense precisely BECAUSE it is sensitive to
    this term, not because it is insensitive. The corrected
    characterization, consistent with both independent reviews and with
    BOUNDARY-CONDITION-GATE's own reason for existing: "the DESIGN-TIME
    HAND-COMPUTED numbers used to SET RG-1..RG-5's bands were derived by
    taking the memory penalty to be identically 0 at unbounded memory --
    i.e. from the CORRECTED formula's own limit (repair_report.md section
    'Fix 2'), not from literally evaluating either committed formula
    string -- so those design-time numbers were never pushed through
    EITHER formula before the anchor bug was found. It is NOT true that
    RG-1..RG-5, once evaluated at runtime against the superseded formula,
    are numerically insensitive to the memory term at log2_w=1000; the
    opposite is the case, and that sensitivity is exactly how OBJ-1 was
    originally caught." This is why a SEPARATE control
    (BOUNDARY-CONDITION-GATE) was still worth building -- not because
    RG-1..RG-5 cannot detect this defect class at all, but because relying
    on RG-1..RG-5 alone left the defect undetected for one full contract
    cycle (EXP-SSI-697354) despite their sensitivity, since "unbounded
    memory" was never literally run through the committed formula string
    at freeze time (repair_report.md Fix 2's own point) -- a workflow gap,
    not an arithmetic-insensitivity gap.
  what_this_does_not_establish:
    - >-
      This does not reopen, weaken, or reverse any pass/fail verdict of
      RUN-SSI-9b542d-001. RG-1..RG-5, BCG-1, and BCG-2 were evaluated, in
      every archived run and every independent review to date, ONLY under
      MC_P13_CORRECTED as the primary path; the superseded formula appears
      only as BCG-2's deliberate negative-control arm, which already and
      correctly reports FAIL by design. No control's PASS verdict, and no
      part of EV-SSI-0c529c's "support" decision, is affected by this
      correction.
    - >-
      This does not touch RUN-SSI-9b542d-001's manifest, raw output, or
