correction:
  id: CORR-20260807-732541
  recorded_at: '2026-08-07'
  recorded_by: coordinator (GOAL-ENDO-001, BATCH-aa267f)
  type: refuted_attribution_in_an_execution_report
  supersedes: []
  corrects:
  - coordination/goals/GOAL-ENDO-001/batches/BATCH-aa267f/execution/EXP-INSTR-85b102/execution_report.md
  record_type: experiment
  record_id: EXP-INSTR-85b102
  field: >-
    section 12 item 3's attribution of the non-monotone ratio verdicts along the
    N ladder to Monte-Carlo noise
  source: >-
    RT-20260807-743198, an independent Red Team dispatch scoped to this single
    question because both Validators flagged it as the batch's largest
    unexamined gap (CORR-20260807-0f5d56). Report at
    coordination/goals/GOAL-ENDO-001/batches/BATCH-aa267f/reviews/
    red-team-nonmonotonicity/report.yaml
  prior_value: >-
    The execution report records non-monotone ratio verdicts along the N ladder
    in 17 to 23 of 36 cells per pool and attributes them to Monte-Carlo noise.
  corrected_value: >-
    THE ATTRIBUTION IS REFUTED, NOT MERELY UNSUPPORTED. Every cell already
    stores an EXACT closed-form null mean containing zero Monte-Carlo error
    (`variance_ratio_R_closed_form`, applicability `exact`). Re-running the
    Executor's own verdict rule on the exact ratio instead of the empirical one
    returns THE IDENTICAL non-monotone count, cell for cell. Setting the
    Monte-Carlo error to exactly zero changes nothing, so Monte-Carlo error
    cannot be what produces the effect. Under the attribution the exact recount
    must return 0; it returns 74.
  independent_verification_by_the_coordinator: >-
    VERIFIED, NOT ACCEPTED ON THE REVIEWER'S WORD -- this Coordinator has
    already been caught once this batch repeating a reviewer's count unchecked
    (CORR-20260807-911ef7). An independent re-implementation of the verdict rule
    at harness/run_blocknull.py:1552, run over the four operative runs'
    committed results.json, reproduces the reviewer's numbers exactly:

      pool     non-monotone (empirical)   non-monotone (EXACT)   comparable cells
      POOL_A            17                        17                    34
      POOL_B            18                        18                    34
      POOL_C            23                        23                    36
      POOL_D            16                        16                    34
      TOTAL             74                        74                   138

    138 of 138 comparable cells agree cell for cell. The six cells excluded from
    my denominator are those carrying no closed-form value, which is the same
    six the reviewer independently identified as scored `MONOTONE RISE`
    VACUOUSLY -- `all()` over an empty list is True at
    run_blocknull.py:1551-1552 -- so the true denominator is 34 rather than 36
    at three of the four pools. That error runs in the conservative direction.
    The whole check is a pure read of four committed files and cost seconds.
  what_the_reviewer_established_beyond_the_recount:
  - id: RT1
    finding: >-
      PARAMETRIC VERSION, SAME CONCLUSION. Of 115 adjacent-pair reversals, 59
      are testable (both endpoints non-degenerate, so T_obs cancels and the
      comparison is purely between two estimated null means). 55 of those 59
      exceed three combined Monte-Carlo standard errors, against an expected
      0.08 under the MOST GENEROUS instance of the noise hypothesis (ties
      everywhere, B = 10000) -- a factor of roughly 690. Median reversal 22.7 MC
      sigma, maximum 80.
    coordinator_note: NOT independently re-derived. Recorded as the reviewer's.
  - id: RT2
    finding: >-
      THE REMAINING 56 REVERSALS ARE REAL NOISE OF A DIFFERENT KIND, AND THE
      DISTINCTION IS OPERATIONAL. They are the deterministic fact that T_obs
      exceeds its null mean at the last non-degenerate rung, by at most 1.2 NULL
      sd -- exchangeability noise, which does not shrink with B. A reader who
      accepted the stated label would respond by running more permutations,
      which cannot help.
  - id: RT3
    finding: >-
      REVERSALS CLUSTER, HARD, AND THE CLUSTERING VARIABLE IS THE ONE THE LADDER
      BLOCKS ON. Functionals that are exact or affine functions of N (`order`,
      `full_liftable`, `liftable_density` at W = p) are monotone in 24 OF 24
      cells; every other functional is non-monotone in 74 of 120. Fisher exact
      one-sided 2.62e-09, and 1.05e-06 after conservatively dropping the eight
      near-vacuous `order` cells. `sumset_m3` and `sumset_eff_m3` reverse in 8
      of 8 cells each, at both primes and under both statistics. Noise is
      exchangeable across cells; this is not.
  - id: RT4
    finding: >-
      THE DECAY QUESTION IS ANSWERED THE WRONG WAY A SECOND TIME, ONE LEVEL UP.
      The reversal rate RISES as the ladder refines: 15% -> 27% -> 28%.
  - id: RT5
    finding: >-
      A NAMED OBSTRUCTION, NOT JUST AN ANOMALY. Delta_max(N) does not order the
      null means of functionals the N-blocking does not act on, so the
      contract's `what_non_decay_means` clause fires BY CONSTRUCTION on
      N-uncoupled functionals. The ladder's decay parameter is an unnumbered,
      underived and false assumption doing load-bearing interpretive work.
  what_this_does_not_establish: >-
    FINDING THE ATTRIBUTION WRONG IS NOT FINDING THE PHENOMENON MEANINGFUL, and
    the reviewer says so in its own words: whether the residue has arithmetic
    content is `undetermined`. This record asserts only that the stated cause is
    refuted. No claim is made that the non-monotonicity reflects structure in the
    isogeny classes, and none may be made until CTRL-VALUESHUFFLE runs.
  what_is_untouched:
  - >-
    NONE of the two Validators' ten passed checks is weakened. The S1 gate, the
    frozen-function zero-behavioural-change receipt, the CTRL-NULLOBJ 28/28
    calibration, the pre-registered twist-blocking contradiction and the D6
    stopping-rule disposition all stand exactly as recorded.
  - >-
    EXP-INSTR-85b102's run records are not edited and its terminal artifacts are
    not re-scored. The execution report is corrected by this record, never
    overwritten (AGENTS.md rule 4).
  - >-
    Nothing here bears on EXP-ICINV-4d33aa, EV-ENDO-10109d,
    CORR-20260807-d78e2f's confound, or any GOAL-ENDO-001 hypothesis.
  cheapest_settling_control:
    name: CTRL-VALUESHUFFLE
    design: >-
      Hold (trace, N) and the committed block assignment fixed; permute
      per-curve functional values across the pool; recompute the whole ladder
      from `closed_form_null_mean` alone -- no permutation study at all, since
      the recount above shows the decisive quantity is closed-form.
    deciding_number: >-
      Where the observed 50-of-144 type-A residue falls in the shuffled null.
    cost: >-
      Measured 0.631 ms per closed-form call at n = 1464 (weighted), 768 calls
      per replicate, 153,600 calls at 200 replicates -- about 1.6 CPU-minutes,
      under 10 CPU-minutes in total, against this contract's 6 CPU-hour budget.
      No curve re-enumerated, no functional re-measured, no frozen function
      touched.
    zero_compute_precheck_already_done: >-
      The exact-ratio recount above, which is a pure read of four committed
      results.json files. It is what refuted the attribution.
  the_pattern_this_makes_three_of: >-
    THE DECISIVE EVIDENCE WAS ALREADY INSIDE COMMITTED ARTIFACTS, FOR THE THIRD
    TIME IN THIS CAMPAIGN. CORR-20260807-d78e2f: the sampler's coverage split was
    in a docstring and a Validator check, and nobody connected it to the finding
    it undermined. CORR-20260807-14431d: the p = 6007 baseline's parameters were
    in a committed raw-result.json that the contract's premise contradicted.
    Here: an exact zero-MC-error null mean sat in every cell of every operative
    run while the report attributed the effect to MC error. Each was settled in
    seconds once someone looked. The campaign's recurring failure mode is not bad
    measurement -- it is not reading what has already been measured.
  required_action:
  - >-
    Cite section 12 item 3 of the EXP-INSTR-85b102 execution report only together
    with this record. The observation stands; the attribution does not.
  - >-
    NO EVIDENCE RECORD may be written from this finding without independent
    review. AGENTS.md rule 12 governs: a contradiction between a validated
    execution report and an independent review is exactly the case it names.
  - >-
    Run CTRL-VALUESHUFFLE before any characterisation of what the residue IS. It
    costs under 10 CPU-minutes and it is the only thing that separates
    "the label was wrong" from "this is arithmetic structure".
  - >-
    Fix the vacuous-`all()` verdict at harness/run_blocknull.py:1551-1552 so an
    empty sequence does not score MONOTONE RISE. Under the frozen contract this
    requires a protocol_amendment for EXP-INSTR-85b102 if the fix is to apply to
    a re-scored run; the defect is conservative, so it is not urgent.
  - >-
    Add to the campaign's review obligations: before attributing an effect to
    noise, recompute the effect with the noise set to zero. Where a closed form
    exists this is free, and here it was decisive.
