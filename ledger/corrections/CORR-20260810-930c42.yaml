  record_type: decision
  record_id: DEC-20260810-2c7e3c
  source_of_this_correction: >-
    RT-20260810-3f7ca3, the independent red-team review dispatched as
    TASK-20260810-ea4965 and archived at
    coordination/goals/GOAL-ENDO-001/batches/BATCH-de621d/reviews/red-team/red_team_report.md.
    Its verdict is `closure_confirmed_with_scope_correction`, main finding A3-b.
    Read in full by this Coordinator, not summarised from a message.
  field: >-
    the identification of the argument that holds lane L9 (RQ-CANL-63098f)
    closed -- specifically the decision's Answer-1 headline that Lemma 1's
    norm-form gap N(alpha) >= |D_E|/4, composed with Lemma 2's
    hhat(alpha P) = N(alpha) hhat(P), places every CM-generated companion vector
    outside the Xedni height budget -- and, downstream of it, EXP-CANL-86c465's
    pre-registered success_criterion, which states that composition as a
    universal, measurable prediction
  prior_value: >-
    DEC-20260810-2c7e3c states the composition without qualification, in its own
    capitals: "THE O-MODULE STRUCTURE INFLATES THE Z-RANK WITHOUT PLACING A
    SINGLE NEW VECTOR INSIDE ANY BALL OF RADIUS o(sqrt(p)) TIMES THE LATTICE
    MINIMUM", and uses the general form in Answer 3 ("the second half of the
    2 r_O-dimensional lattice is longer by sqrt(|D_E|)/2"). Its own
    `refutation_artifact` and its "why this is a closure and not a fatigue
    report" item both name Lemma 1 plus Lemma 2 as THE one argument for why the
    lane's central hope fails. EXP-CANL-86c465's success_criterion
    correspondingly pre-registers that the ratio of successive minima must be
    >= sqrt(|D_E|)/2 and "must track sqrt(|D_E|) with slope 0.5 in log-log
    across at least 5 values of |D_E|".
  corrected_value: >-
    THE CLOSURE STANDS; THE STATED LOAD-BEARING ARGUMENT DOES NOT HOLD
    UNIVERSALLY. The norm-form gap is a property of the PRINCIPAL CLASS, not of
    the ORDER. Lemma 1 itself is correct and needs no hypothesis, and the
    multi-generator extension is correct in the FREE/CYCLIC case (the reviewer
    checked the completed square for v = x + w y with Gram matrix G and confirms
    hhat(v) >= (|D_E|/4) lambda_1(M)^2 when y != 0). But a rank-1 projective
    O-module is an IDEAL CLASS a, and when h(O) > 1 the generic Steinitz class
    is non-principal -- in the volcano-floor regime h(O) ~ sqrt(p). Writing the
    class's reduced form (a_Q, b, c) with 4 a_Q c - b^2 = |D|, the first minimum
    is a_Q, attained at the RATIONAL element, and the second is c, attained at
    an IRRATIONAL element, so the operative ratio is c/a_Q and NOT |D|/4. For a
    balanced class (a_Q ~ c ~ sqrt(|D|)/2, permitted since a_Q <= sqrt(|D|/3))
    the ratio is O(1) at arbitrarily large |D_E|. Lemma 1 bounds N(alpha)
    ABSOLUTELY; the operative Xedni quantity is smallness RELATIVE to the
    module's own minimum, and the two coincide only in the free/cyclic case.
    WHAT ACTUALLY HOLDS THE LANE CLOSED, and survives every objection the review
    raised, is (i) EXP-CANL-1064e0's target-independence bound -- for any
    construction definable from (E, O, K) alone with p^{o(1)} output, S is fixed
    before Q is seen, so Pr[Q in red(S)] <= |S|/N = p^{-1+o(1)} for a uniform
    target, closing four of the five point-lifting routes (the fifth is G3 and
    is explicitly not closed) -- together with (ii) the constancy of C_0 and r
    at fixed arity, which is reopening condition G6. The escape A3-b opens is
    arithmetically the SAME Theta(C_0^2)-per-slot constant as Answer 2's
    small-|D_E| escape, so the instance count stays N^{1-o(1)} and the exponent
    stays 1 against rho's 1/2. The conclusion is unchanged; its stated support
    is not.
  reproduced_counts_from_the_review: >-
    Enumerating ALL reduced forms of each discriminant, the reviewer reports:
    D = -2003 (h = 9), Lemma-1 gap |D|/4 tabulated as 501, min(c/a) = 1.42,
    median 6.33, 4/9 = 44% of classes with c/a <= 4; D = -10007 (h = 77), gap
    2502, min 1.04, median 4.42, 38/77 = 49%; D = -100003 (h = 39), gap 25001,
    min 1.15, median 2.50, 24/39 = 62%; D = -1000003 (h = 105), gap tabulated as
    250001, min 1.03, median 3.79, 56/105 = 53%. At |D| as large as 1000003,
    where Lemma 1 predicts a gap of that size, over half of all classes have a
    successive-minima ratio at most 4 and the smallest is 1.03. Counting the
    coefficient window RELATIVE to the class's own minimum at C_0 = 3: the
    principal class (1, 1, c) gives exactly 6 = 2 C_0, reproducing Lemma 1,
    while the median class gives 14-16, i.e. Theta(C_0^2).
  status_of_those_counts: >-
    The reviewer states them as reviewer-side arithmetic and explicitly claims
    NO run, NO evidence and NO artifact for them. The handoff TASK-20260810-934566
    records that the DISPATCHING Coordinator independently reproduced them by
    direct enumeration of reduced forms; that reproduction is reported here as
    the dispatching session's, is not an executed run under any EXP-CANL-*
    contract, and no RUN-CANL-* record exists. This ledger-archive Coordinator
    has no Bash and re-derived none of these numbers itself; it read them from
    the committed review artifact and from the handoff, and states no command
    output as if run.
  the_pre_registered_criterion_is_falsified_as_a_universal_prediction: >-
    EXP-CANL-86c465's success_criterion -- ratio of minima >= sqrt(|D_E|)/2,
    tracking sqrt(|D_E|) with slope 0.5 in log-log across at least five values
    of |D_E| -- IS FALSE AS A UNIVERSAL PREDICTION and holds only for the
    principal class. The operational consequence is worse than an inaccurate
    prediction: AS WRITTEN, an executor whose lift lands in a balanced
    non-principal class measures a FLAT ratio and, under that contract's
    falsification_criterion item 3, is directed to conclude "either the height
    implementation or Lemma 2 is wrong". THE CONTRACT WOULD CONVERT A CORRECT
    MEASUREMENT INTO A DECLARED INSTRUMENT FAILURE, because it carries no
    stratifier that can tell a legitimate flat measurement apart from a bug.
    This is docs/inventor-protocol.md section 3's decay test running backwards:
    the quantity that "should grow with |D_E|" legitimately does not, for
    roughly half the inputs.
  a1_cleared: >-
    A1 CLEARS. The failure mode the dispatching task card warned about -- using
    disc Z[pi] where disc End(E) is meant -- IS NOT COMMITTED anywhere in the
    decision or in the four drafts it leans on. Lemma 1 is applied throughout to
    D_E = disc End(E~) = disc End(E) (Serre-Tate), never to disc Z[pi] as a
    substitute; the single appearance of 4p - t^2 is explicitly conditioned on a
    curve at the bottom of its volcano, precisely the locus where End(E) = Z[pi]
    and the substitution is entitled; and secp256k1 is handled separately and
    correctly at |D_E| = 3 (j = 0 forces End(E) = O_{-3}), with the norm-1 GLV
    endomorphism denied nowhere. No discriminant is misused.
  further_material_objections_recorded_not_repaired_here:
  - >-
    A1-a: the attacker's freedom to move on the volcano is never composed with
    Lemma 1's hypothesis. The saving fact -- D_0 is an invariant of (p, t), so
    |D_E| >= |D_0| and the small-|D_E| regime cannot be manufactured, only
    inherited -- is in the record only inside the reachability item and never
    beside Answer 1. Fixable in one sentence.
  - >-
    A1-b: EXP-CANL-86c465's own tail_checks requires stratification by f_E and
    warns that r_Z = 2 r_O can fail for f_E > 1; the decision imports
    m >= r_Z/2 + 1 and "the 2 r_O-dimensional lattice" unconditionally, and its
    headline instantiation (the volcano floor) is the f_E = f case. Error
    direction is defender-favourable, so the verdict is untouched; what is
    over-stated are the two POSITIVE deliverables credited to CM.
  - >-
    A2: the |D_E| <= 4 C_0^2 regime is INSIDE the rejection scope (correctly --
    excluding it would be the premature closure the protocol forbids) and is
    handled by argument, which the reviewer re-derived and confirms; but by a
    DIFFERENT and weaker argument than the headline, namely constant-factor
    accounting conditioned on G6. Answer 1's own text is correctly conditioned;
    the closure narrative and the snapshot commit message are not.
  - >-
    A3-a: the decision restates Lemma 1's equality clause while dropping the
    source's parenthetical "(possible only for D_E even)" and adding "No
    hypothesis is used". As restated the equality clause is FALSE for
    D_E = 1 mod 4 (at D_E = -3 the minimum off-Z norm is 1, not 3/4). The
    inequality actually used is unaffected.
  - >-
    A3-c: EXP-CANL-86c465 states the module structure over the ring class field
    H; the decision names no field. Over Q the CM action is not defined at all,
    and over H the bookkeeping [H:Q] = 2 h(O) ~ sqrt(p) in the floor regime bears
    on the "height B implies coordinate bit-size Theta(B)" step. Answer 3's
    thresholds (r_Z > 4 -> r_Z > 8; Z-rank >= 6, >= 8 with margin) are UNUSABLE
    AS FORWARD GUIDANCE until the field is stated.
  - >-
    A3-d: the record uses an ABSOLUTE-norm coefficient criterion in Answer 1 and
    a RELATIVE-to-lambda_1 criterion in Answer 3 and never reconciles them.
    KN-LIT-021 carries `confidence: reported` with "full paper not read" and
    describes JKSST's mechanism as an ABSOLUTE coefficient bound, while
    DECOMPOSITION.md L9 states the obstruction as a height ~N. The two readings
    are not interchangeable once the module is non-free. The JKSST relay -- the
    obstruction the entire lane is closed on -- is NOT flagged in the decision's
    limitations although Sutherland and Hindry-Silverman are. UNRESOLVED, and
    the largest unverified input to the closure.
  - >-
    A4-a: the pre-registered obstruction is a HEIGHT (~N); the delivered
    conclusion is an INSTANCE COUNT (Theta(N)). Theta(N) is right as an instance
    count, but the decision's own Answer 3 derives the height budget as
    Theta(N^{2/r}) (N^0.667 at r = 3 down to N^0.222 at r = 9), contradicting
    "~N" for every r >= 3, and the record never says so. The defect is in the
    gate as well as in this record and belongs in a superseding record against
    DECOMPOSITION.md L9 / RQ-CANL-63098f's decision_target rather than being
    silently inherited by the next lane.
  - >-
    A4-c: Answer 4 leg (iii), which the decision calls "the sharpest single
    statement the lane produced", is QUANTITATIVELY VACUOUS. Lang's height floor
    c log|Delta| ~ 2c log(mp) grows logarithmically in the search parameter; the
    budget it must exceed is B = Theta(N^{2/r_O}), exponential in the security
    parameter; it binds only at m ~ exp(N^{2/r_O}/2c). The source record
    IDEA-20260807-13c821 states that threshold in its own survival_score and the
    decision drops it. The anti-correlation is real and negligible.
  - >-
    A4-d: Answer 4 leg (ii) is an unmeasured cost model presented as settled.
    The attack needs a point above a PRESCRIBED residue at height Theta(N^{2/r});
    a rank lower bound needs any r independent points, found by descent. The
    source pre-registers this as a MEASUREMENT (STEP 4, STEP 5) with OUTCOME 2 as
    a supersession condition. The m-knob is closed on a scheduled, unrun
    experiment.
  - >-
    A5: "five independent proposals reach the same exponent-1 verdict from five
    different directions" is INFLATED. Three of the five run through the SAME
    Lemma 1 + Lemma 2 composition and one cites another by ID for it. The
    genuinely independent legs are the target-independence count and fd2d89's
    k^2 size bound. This claim is load-bearing for the decision's TIMING argument
    (close now rather than pause a fifth time), and the one lemma the three
    restatements share is the step with the scope defect.
  - >-
    A6: forward guidance clears the closure standard but has three gaps --
    (1) G6 is described as invalidating the coefficient-set step yet is EXCLUDED
    from the revisit condition, which reopens only on G1-G4, although A2 and
    A3-b both show the closure rests on it; (2) IDEA-20260807-13c821's OUTCOME 2
    is a pre-registered supersession condition from a cited source and is not
    carried forward; (3) no G7 exists for the module-class regime of A3-b, in
    which the norm-form gap fails at ANY |D_E|.
  - >-
    BASELINE OMISSION: the automorphism-discounted rho on CM curves
    (KN-TECH-018) is a MANDATORY control under RQ-CANL-63098f's constraints and
    is carried in the drafts' own controls, but is never used in the decision's
    comparison -- although Answer 2's regime (j = 0) is exactly where the
    discount applies and Answer 2's gain is exactly a constant. Not
    verdict-changing (constants against exponents), but it must be stated before
    any KN-FIND promotion.
  what_this_does_and_does_not_mean:
  - >-
    THE LANE REMAINS CLOSED WITHIN ITS DECLARED BOUNDARY. This is a correction to
    the ARGUMENT and the SCOPE STATEMENT of DEC-20260810-2c7e3c, not a reversal
    of it. The reviewer's own narrowest supported statement is: within prime
    fields, ordinary E/F_p, the Serre-Tate canonical lift and global CM models
    reducing to it, fixed arity 2 <= r <= 9 with C_0 an absolute constant, and
    the twelve enumerated mechanism families, no CM-specific mechanism examined
    in lane L9 moves the Xedni instance-count exponent off 1 against Pollard
    rho's 1/2 -- supported by the target-independence bound and by every
    coefficient-set enlargement CM can produce being a function of C_0 and r
    alone, with the norm-form gap supporting it only for cyclic/free O-modules
    with |D_E| > 4 C_0^2.
  - >-
    NOTHING HERE IS EVIDENCE ABOUT ECDLP HARDNESS IN EITHER DIRECTION. Zero runs
    were executed under any EXP-CANL-* contract, no RUN-CANL-* record exists, no
    EV-* record is written, `claim_tier` is toy and `sota_delta` is zero. No
    attack on any deployed curve is claimed, hinted at, or implied; secp256k1 is
    named only because the small-discriminant regime is populated and therefore
    had to be examined.
  - >-
    THE DEFERRED KN-FIND CANDIDATE IS NOW KNOWN TO BE WRONG AS STATED.
    DEC-20260810-2c7e3c's `knowledge_promotion` named a candidate corpus entry --
    the norm-form gap N(alpha) >= |D_E|/4 with hhat(alpha P) = N(alpha) hhat(P)
    giving "the CM order places no new vector inside the Xedni height budget" --
    and deferred it. A3-b establishes that this statement is FALSE about the
    ORDER and true only about the PRINCIPAL CLASS. Deferring it was correct for
    reasons that turned out to be weaker than the real ones. No promotion may be
    made on this text.
  - >-
    THE REVIEW'S INDEPENDENCE IS LIMITED AND THE LIMIT IS PART OF THIS RECORD.
    RT-20260810-3f7ca3 records `fallback_used: true` (this harness cannot resolve
    policy aliases, so `review-adversarial` resolved to the single model the
    session runs on), `model_verified: false` (no adapter probe receipt), and an
    explicit independence_limitation: the review and DEC-20260810-2c7e3c resolve
    to models on the SAME BACKEND, so "independent" means independent context and
    a fresh adversarial reading of a committed snapshot, NOT independent
    judgement from a different model. An error of reasoning shared by the
    authoring session and the reviewing session would not have been caught. This
    correction must not be cited as more corroborated than that.
  - >-
    WHAT THE REVIEW COULD NOT CHECK, carried forward verbatim in substance:
    KN-LIT-021 (JKSST) itself -- not in the repository, not read, so the
    absolute-versus-relative reading of C_0 is UNRESOLVED and unchecked, not
    passed; ECFG-P1543-R1's own C_0/p reconstruction (quoted strings verified,
    derivation not re-derived); the Hindry-Silverman, Coates-Wiles/Rubin,
    Sutherland and Gross-Zagier relays; WHETHER MORDELL-WEIL O-MODULES OF ACTUAL
    CANONICAL LIFTS REALISE NON-PRINCIPAL BALANCED CLASSES, which is exactly what
    the stratified STAGE 0 would settle and is unchecked by every record in this
    lane; the retrieval index, absent from that session's tool surface; and
    G2-G5 on their merits.
  required_action:
  - >-
    DO NOT EDIT DEC-20260810-2c7e3c, EXP-CANL-86c465/specification.yaml, or any
    other committed record (AGENTS.md rule 4). This correction supersedes by
    reference. The seven EXP-CANL-* contracts remain `status: draft` with
    `approved_by: null` and are untouched by this record.
  - >-
    N14 (recorded in DEC-20260810-3110d5): before any KN-FIND promotion and
    before any of the seven EXP-CANL-* contracts is approved, run EXP-CANL-86c465
    STAGE 0 and STAGE 1 exactly as pre-registered, EXTENDED BY AN IDEAL-CLASS
    STRATIFIER rather than a |D_E| stratifier alone. This is the reviewer's one
    concrete next action, costs minutes of integer arithmetic, and is the
    falsifier the closure decision itself named. Its predictions are stated in
    advance in the review: STAGE 0 confirms N(alpha) >= |D_E|/4 for all
    alpha in O \ Z and refutes the decision's equality clause for D_E = 1 mod 4;
    the stratified extension shows the ratio-of-minima law holds for the
    PRINCIPAL class and stays O(1) for roughly half the non-principal classes at
    every |D_E|. Approving it needs its own Coordinator decision and a contract
    freeze; THIS RECORD APPROVES NOTHING AND DISPATCHES NOTHING.
  - >-
    IF that stratified run returns the predicted split, a SUPERSEDING decision --
    not an edit -- must restate the closure in the two-regime, two-argument form
    the review specifies, add a G7 for the non-principal balanced-class regime,
    add G6 to the revisit condition, state the ring class field H over which
    every rank is measured, stratify by f_E, flag the JKSST relay in
    `limitations` beside the other two, record that Answer 4 (iii) is a
    log-versus-exponential comparison that does not bind at feasible search
    depths, and re-scope EXP-CANL-86c465's success_criterion and
    falsification_criterion item 3 to the principal class BEFORE that contract is
    ever approved.
  - >-
    Carry A4-a to its own home: DECOMPOSITION.md L9 and RQ-CANL-63098f's
    `decision_target` state the kill criterion against a HEIGHT ~N that the
    closure's own analysis corrects to Theta(N^{2/r}). That is a defect in the
    GATE, not only in this record, and must be corrected by a superseding record
    rather than inherited by the next lane.
