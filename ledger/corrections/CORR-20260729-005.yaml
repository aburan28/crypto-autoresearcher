correction:
  id: CORR-20260729-005
  recorded_at: '2026-07-29'
  record_type: claim
  record_type_note: >-
    Third-round ID-collision repair, and the repair of a distinct and more
    serious defect the second round left behind: nine tracked files were merged
    into origin/main still holding literal conflict markers. CORR-20260729-001
    covers the first-round renames (merge 9d683f6b), CORR-20260729-002 the
    second (merge 38bfc195). This record covers the collisions introduced by
    the GOAL-SSI-001 branch and merged at f5895f58, together with the marker
    corruption itself. IDs -003 and -004 are not free — they are live on open
    PRs #59 and #60 — so this correction takes -005.
  record_id: multiple
  field: id
  prior_values:
    - DEC-20260728-004 (branch — SSI BATCH-002 close-out, decision revise)
    - DEC-20260728-005 (branch — SSI BATCH-003 mechanism screen, decision revise)
    - EV-SSI-002 (branch — zero-compute BATCH-002 derivation gate, direction weakens)
    - EV-SSI-003 (branch — zero-compute BATCH-003 mechanism screen)
    - KN-TECH-056 (branch — supersingular isogeny-problem corrected baselines)
  corrected_values:
    - DEC-20260728-006
    - DEC-20260728-007
    - EV-SSI-004
    - EV-SSI-005
    - KN-TECH-058

  defect: >-
    Branch claude/ecdlp-resume-20260728 committed a half-finished merge at
    73c02399 ("chore: begin merge conflict resolution from origin/main") with
    conflict markers still in the working tree. That commit was merged to
    origin/main at f5895f58 without the markers ever being removed, so nine
    tracked files on main carried literal `<<<<<<< HEAD` / `>>>>>>> origin/main`
    lines: two coordinator decisions, two evidence records, one goal record, two
    dispatch queues, knowledge/INDEX.md, and knowledge/techniques/KN-TECH-056.md
    — the last of which CLAUDE.md names as the inventor-protocol technique
    abstract. Every one of those files was unreadable as a record.

  why_it_was_not_caught: >-
    Three independent gaps, all now closed by tools/check_merge_hygiene.py.
    (1) Nothing in the toolchain looked for conflict markers at all.
    (2) The CI validator is a RELATIVE gate: it compares the error set on the
    head against the error set on the base and fails only on new strings. A
    record that does not parse cannot be schema-checked, so corrupting one
    REMOVES errors — corruption reads as an improvement.
    (3) check_knowledge_index reported only the FIRST line of the index
    builder's failure, which for any crash is the constant string "Traceback
    (most recent call last):" — identical on head and base, therefore cancelled
    out by the diff. The index builder had in fact been crashing on the
    committed markers the whole time.
    Compounding all three, GitHub held the workflow in "awaiting approval" on
    both PRs, so CI never ran on the merges that did the damage.

  resolution: >-
    No side was picked, for any record. Both sides of every collision were
    recovered from the merge parents (origin/main at 7edbefe5, branch at
    045bdba9) rather than by parsing the corrupted files, so both are exact.
    For each colliding immutable record the version already published on
    origin/main keeps its identifier and is restored byte-exact; the branch's
    differing record is reissued under the next free identifier, with
    references to its sibling branch records renumbered to match. This is the
    protocol of fa1510c9 and CORR-20260729-001/-002.

  affected_records:
    - DEC-20260728-006: >-
        was DEC-20260728-004 on branch. GOAL-SSI-001 BATCH-002 close-out,
        decision revise, idea_status premise_closed_on_tested_scope. The ID
        DEC-20260728-004 remains with the BATCH-003 baseline-correction support
        ruling published on main.
    - DEC-20260728-007: >-
        was DEC-20260728-005 on branch. GOAL-SSI-001 BATCH-003 mechanism screen,
        decision revise. The ID DEC-20260728-005 remains with the ECDLP
        EXP-ENDO-001 reject_scoped closure published on main.
    - EV-SSI-004: was EV-SSI-002 on branch (zero-compute, type theoretical, direction weakens).
    - EV-SSI-005: was EV-SSI-003 on branch (zero-compute mechanism screen).
    - KN-TECH-058: >-
        was KN-TECH-056 on branch, "Supersingular isogeny-problem baselines,
        corrected against archived primary text". KN-TECH-056 could not be the
        one to move: CLAUDE.md cites that exact path as the inventor-protocol
        abstract, so reissuing it would have broken a documented anchor.

  mutable_records_restored:
    note: >-
      GOAL-SSI-001.yaml and the BATCH-002/BATCH-003 dispatch queues are living
      state, not immutable point records, so the supersession rule does not
      govern them and the branch copy is simply a stale divergent state. Each
      was restored to origin/main's version at 7edbefe5, which is the newer
      state (current_batch_id BATCH-004, latest_verified_commit 94df4f86).
    unadjudicated: >-
      The branch's GOAL-SSI-001 recorded a DIFFERENT checkpoint chain for the
      same batches — BATCH-002 and BATCH-003 both as revise, bound to the
      records now reissued as DEC-20260728-006 and -007 — against main's
      BATCH-002 revise (DEC-20260727-003) and BATCH-003 support
      (DEC-20260728-004). These are contradictory narratives of the same goal.
      They are NOT merged here: doing so would fabricate a checkpoint chain no
      decision authorizes. The branch chain is preserved in git at 045bdba9 and
      requires Coordinator adjudication.

  defects_found_not_repaired:
    - EV-SSI-002 and EV-SSI-003 as published on main declare proof_status
      derivation_with_revision and derivation_confirmed respectively, neither of
      which is in the permitted set (certificate|derivation|empirical_only|
      not_applicable). This defect predates the merge and was MASKED by the
      conflict markers — while the files were unreadable the validator could not
      reach the field. Restoring them makes two real errors newly visible. They
      are immutable records and are left as published; repair requires a
      Coordinator supersession.
    - >-
      DEC-20260727-010 did not parse, from an unquoted colon-space inside a
      plain scalar. Repaired here by quoting that one scalar and nothing else,
      text preserved character for character — the same quoting-only mechanism
      that record itself adjudicates for two experiment specs. Noted because
      the record was published unparseable and no gate objected. (This entry
      was itself first drafted with the same defect it describes, and the new
      gate caught it before commit. That is the gate working.)
    - 33 further records across ledger/ and experiments/ do not parse. They
      predate this incident and are grandfathered in
      tools/merge_hygiene_baseline.txt, which may only ever shrink.

  scope_of_this_correction:
    files_repaired: 10
    records_reissued: 5
    records_restored_byte_exact: 5
    sides_discarded: 0
    hypotheses_moved: 0
    runs_executed: 0
    asymptotic_claims: none
  author: coordinator
  authored_by_agent: true
  agent_note: >-
    Prepared by an automated session at the repository owner's explicit
    instruction. CLAUDE.md rule 2 forbids resolving an immutable-record conflict
    by choosing a side, and nothing here does: every side is preserved, either
    at its published identifier or at a reissued one. The re-linking of the
    reissued records into GOAL-SSI-001's checkpoint chain is deliberately left
    open above and needs Coordinator sign-off.
