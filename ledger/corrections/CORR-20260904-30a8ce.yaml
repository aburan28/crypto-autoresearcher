correction:
  id: CORR-20260904-30a8ce
  recorded_at: '2026-09-04'
  recorded_by: coordinator
  type: construction_defect_disclosed_by_breakthrough_review_supersingular_contamination
  severity: medium_affects_exploratory_panel_only_not_headline_cells
  supersedes: []
  corrects:
    - experiments/EXP-MONO-64aaa4/implementation/run_experiment.py (construct_cm_j0, construct_cm_j1728)

  incident_summary: >-
    The breakthrough-tier Red Team review (TASK-20260904-4580e8,
    OBJ-B6/RC-B8) found that `construct_ordinary` explicitly rejects
    supersingular candidates ("if N % p == 1: continue"), but the CM
    constructors `construct_cm_j0` and `construct_cm_j1728` do not. As a
    result, 64 of the 100 cross-prime matched-(N,tau) cells in
    RUN-MONO-cb905d-1's own Part B panel have a SUPERSINGULAR curve on the
    "CM" side (N = p_cm + 1; 58 distinct such curves) -- whose
    endomorphism ring is a maximal order in a quaternion algebra, not an
    imaginary quadratic order, despite the panel being described
    throughout as a CM-vs-ordinary comparison.

  scope: >-
    Cells 1 (p=617) and 2 (p=3541), the two cells this hypothesis's own
    pre-registered tests were run on, are UNAFFECTED -- both CM curves at
    those cells are independently verified ordinary (617 = 1 mod 4,
    3541 = 1 mod 3, and N != p+1 in both cases). This defect affects only
    the 100-cell exploratory Part B panel's own composition.

  disposition: >-
    NOT fixed in place (immutable per this program's rules; the affected
    run RUN-MONO-cb905d-1's own Part B artifacts remain exactly as
    archived). Disclosed here so that any future use of the 100-cell panel
    as evidence about ordinary CM curves first partitions it by
    supersingular/ordinary on the CM side. This also means the Validator's
    own FB4 finding on this panel (EV-MONO-9c760b) is provisional pending
    that partition -- see that record's own scoping.

  reason: >-
    AGENTS.md rule 4 requires disclosure of any discovered construction
    defect regardless of whether it changes the headline conclusion at the
    two cells actually tested. A panel mislabeled as "CM vs ordinary" that
    is 64% contaminated with supersingular curves on its CM side is a
    genuine defect in an archived artifact, independent of this cycle's
    own pooled-statistic question, and future sessions must not assume the
    panel is clean.

  evidence_artifacts:
    - path: experiments/EXP-MONO-005b49/reviews/red-team-breakthrough/red-team-report.yaml
      note: OBJ-B6, RC-B8 -- the supersingularity contamination audit.

  refs:
