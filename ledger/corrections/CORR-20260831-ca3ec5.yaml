  content_assessment_this_edit_is_wrong_not_correct: >-
    UNLIKE ALL FIFTEEN PRIOR INCIDENTS THIS SESSION -- every one of which
    was either independently verified correct, or a defensible judgment
    call on an ambiguity -- this edit is INDEPENDENTLY VERIFIED, BY THIS
    COORDINATOR'S OWN LOGICAL RE-DERIVATION, TO BE FACTUALLY WRONG,
    DESPITE ITS OWN COMMIT MESSAGE CALLING ITSELF A FIX.

    The bullet under review states a falsification condition: "The
    oracle perturbed-only arm fails to reject even at the strongest
    tested cell (10% perturbation, 15 curves)" -- i.e., even the single
    MOST favorable cell in the entire tested grid (largest per-curve
    effect, most curves pooled, hence the best chance of rejection) shows
    no signal. The ORIGINAL text concluded this "indicat[es] the
    statistic's power ceiling sits ABOVE this entire tested range" -- read
    as: the effect size / panel size actually required to reach adequate
    statistical power lies BEYOND (stronger/larger than) everything
    tested, since even the best-case tested cell already failed.

    THE EDIT CHANGED "above" TO "below." This is logically inconsistent
    with the bullet's own stated premise: if the required threshold sat
    BELOW the tested range (i.e., were already achievable well within
    it), then the WEAKEST cells should have succeeded, and certainly the
    STRONGEST cell (the one the bullet says failed) should have succeeded
    a fortiori. "Below" directly contradicts "fails to reject even at the
    strongest tested cell" in the same sentence. The original "above"
    reading is the only one consistent with the bullet's own stated
    condition.

  disposition: >-
    Per this session's established practice (never revert, always
    disclose) -- APPLIED HERE IN THE OPPOSITE DIRECTION FROM
    CORR-20260831-f6e70f: because this edit is independently verified
    INCORRECT, this Coordinator does NOT adopt it. The out-of-band
    commit is not reverted (per this session's standing policy against
    reverting external commits), but the affected proposal file
    (`ledger/proposals/IDEA-20260831-3fa5c9.yaml`) now carries an
    additive `known_errata` block, placed immediately after the affected
    field per this program's immutability discipline (never overwrite an
    already-filed record's text in place), explaining the error and
    stating the correct reading. Any future conversion of this proposal
    into a hypothesis or experiment contract MUST use the ORIGINAL
    ("above") wording, not the out-of-band-edited ("below") text
    currently sitting in the bullet itself.

  reason: >-
    AGENTS.md rule 4 and this session's own established practice
