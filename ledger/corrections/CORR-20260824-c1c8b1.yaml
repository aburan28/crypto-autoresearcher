  reason: >-
    THE EMITTED SENTENCE IS STRICTLY STRONGER THAN WHAT THE FUNCTION COMPUTES, AND
    THE COMPUTATION IS CORRECT. `isolating_components` in
    harness/diffpath/controlpower.py derives the field ONLY from the family-(d) and
    D-SHA1-INCODE attribution distributions, and its own docstring declares the
    narrower notion it means: a draw differing from ITS OWN SOURCE census entry. That
    restriction is not arbitrary -- families (a), (b) and (c) generate their draws
    freshly rather than from a census entry, so they HAVE no source entry to differ
    from in one component, and the function cannot see them by construction. THE
    DEFECT IS THAT THE EMITTED STRING DROPS THE WORD "OWN" AND QUANTIFIES OVER "A
    CENSUS ENTRY" AND OVER "NO DECLARED FAMILY", turning a true statement about one
    family's draws into a false statement about all four.
    IT IS A DEFECT IN A DESCRIPTION AND NOT IN A MEASUREMENT. No integer, count,
    attribution, verdict or scope statement anywhere in the package depends on it.

