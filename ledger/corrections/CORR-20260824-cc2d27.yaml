      COORDINATOR artifacts, one of which then handed it to a reviewer as an
      instruction. A correction that names only the producer's field would leave
      both of those reading 5583 with nothing pointing here, which is precisely
      how a corrected number goes on circulating.
    P1:
      artifact: coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/archives/TASK-20260824-be7bbc/snapshot-receipt.json
      location: >-
        pre_freeze_checks.quarantine_payload_sha256_reconfirmed_from_bytes.detail,
