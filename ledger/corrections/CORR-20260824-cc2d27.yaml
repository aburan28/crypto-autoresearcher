    - "coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/reviews/TASK-20260824-c40847/validation-report.yaml -- joint_J1 defect VD-2 and joint_J4 part_3: independent byte-wise re-hash, 3103, with os.path.getsize agreeing"
