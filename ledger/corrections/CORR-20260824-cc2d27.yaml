    P2:
      artifact: coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/review-plan/review-plan-f8bf86.yaml
      location: 'joints J4, attack_plan step (3): "compare against ... at 5583 bytes"'
      corrected_reading: 3103
      whose_fault: >-
        THE COORDINATOR'S, at TASK-20260824-be7bbc, and one hop worse than P1: a
        defective integer was written into the INSTRUCTIONS A REVIEWER WAS GIVEN.
        The reviewer measured the quantity rather than accepting the stated
        comparison target, which is the only reason it was caught, and it named
        the propagation itself.
      what_it_does_not_do: >-
        IT DOES NOT INVALIDATE THE REVIEW PLAN AS A PRE-REGISTRATION. The plan's
