  # ====================================================================
  reason: >-
    THE STATED BYTE COUNT IS WRONG AND THE DIGEST BESIDE IT IS RIGHT. The
    quarantined GOAL-MD5-001 payload at
    coordination/goals/GOAL-MD5-001/quarantine/MD5-COLLISION-PATH-WANG-2004-199.yaml
    is 3103 bytes. execution-report.yaml line 367 states 5583. Every raw source
    of the same measurement states 3103, and two independent re-measurements
    confirm 3103.
    THE DEFECT WAS DETECTABLE FROM THE SUMMARY ALONE, WHICH IS THE PART WORTH
    NOTING: the byte count and the sha256 as printed together are MUTUALLY
    INCONSISTENT, because a 5583-byte file cannot have that digest. A reader who
    treated the two numbers as one observation rather than two independent ones
    would have caught it without any re-measurement at all.

  evidence_artifacts:
    - "coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/tasks/TASK-20260824-c6625a/raw-observations.json line 108 -> 3103"
