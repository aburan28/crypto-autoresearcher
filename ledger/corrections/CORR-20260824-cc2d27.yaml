  record_type: run
  record_type_note: >-
    STATED RATHER THAN SILENTLY PICKED, BECAUSE THE SCHEMA HAS NO RIGHT ANSWER
    HERE. templates/research-records.md admits exactly three values for
    `record_type` -- candidate | claim | run -- and NONE of them names "a
    producer's terminal execution-report artifact", which is what is corrected
    below. `run` is the CLOSEST TRUE value: execution-report.yaml is the summary
    of the six charged runs of EXP-DIFFP-fe894e
    (RUN-DIFFP-fe894e-buildcheck, -equivalence-verification, -census-build,
    -controls, -observation-collision, -nearby-object), the corrected field is a
    measurement those runs produced, and the raw sources that carry the correct
    value are those runs' own raw-result.json and stdout.log files. It is not
    `claim` (nothing is claimed by a byte count) and not `candidate` (there is no
    candidate object here).
    THE SCHEMA GAP IS ITSELF WORTH RECORDING AND IS NOT A COMPLAINT ABOUT THIS
    CORRECTION: as this program's producers increasingly emit a terminal
    execution report ALONGSIDE their run records, "the summary artifact of a run
    set" becomes the most likely thing to need correcting, and it is the one
    thing `record_type` cannot name. Offered to whoever owns
    templates/research-records.md; not fixed here, because editing the template
    is outside this task's write scope and a correction record is not the place
    to change a schema.

