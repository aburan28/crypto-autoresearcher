correction:
  id: CORR-20260904-f3aa7a
  recorded_at: '2026-09-04'
  record_type: claim
  record_type_note: >-
    The corrected artifact is a rationale bullet in a committed coordinator
    decision, and the same claim appears in stronger form inside an unapproved
    experiment contract. `claim` is the closest permitted token.
  corrected_record: ledger/decisions/DEC-20260904-3bb7fc.yaml
  field: rationale[3]
  goal_id: GOAL-ECDLP-001
  raised_by: >-
    The independent pre-approval review of EXP-ECDLP-a1c262 commissioned by
    ruling 4 of DEC-20260904-726129 and written to
    coordination/reviews/approval-a1c262-20260904/validation_report.yaml. Its Q4
    finding contradicted the bullet. The orchestrating session then re-derived
    the point directly from the archive before recording this correction, rather
    than relaying the reviewer's verdict.

  prior_value: >-
    "A BLOCKING ZERO-COMPUTE CONTROL was added because two of
    IDEA-20260802-001's five quoted bits-16 departure figures do not reproduce
    from the archived arrays at integer u: coordinator hand arithmetic gives
    4.49543 and 11.15351 against the quoted 4.5709 and 11.5937, reconciling only
    at the archived non-integer u. THAT ARITHMETIC IS A PRIOR, NOT EVIDENCE, and
    C-A-ARCHIVED-REDERIVATION can void the tranche's motivating figures before
    any expensive stage runs."
  corrected_value: >-
    All five quoted bits-16 figures DO reproduce, because they are not derived
    quantities at all: they are recorded verbatim in
    experiments/EXP-LPF-001/results/calib/null_replicate_statistics.json as
    LPF_R_u_uniform_mean_over_replicates = 1.170186146593335, 1.452189666846296,
    2.0520520663207287, 4.570887928556306, 11.593661937425654. The coordinator's
    4.49543 and 11.15351 are correct arithmetic on the WRONG DENOMINATOR --
    Dickman rho evaluated at integer u rather than at the archived non-integer u
    the figures were computed from. C-A-ARCHIVED-REDERIVATION therefore CANNOT
    void the tranche's motivating figures; at most it can confirm a readback of
    literals already in the archive.

  what_was_wrong:
    - >-
      THE SENTENCE IS NARROWLY TRUE AND MATERIALLY MISLEADING, and the
      distinction is the whole correction. The figures genuinely do not reproduce
      "at integer u", and the bullet says so, hedges its own arithmetic as "A
      PRIOR, NOT EVIDENCE", and names the reconciliation. What it gets wrong is
      the inference drawn in its last clause: that a control could VOID the
      motivating figures. A quantity read out of an archive cannot be voided by
      recomputing it; only its provenance or its interpretation can be
      questioned. The bullet framed a units mismatch in the coordinator's own
      check as a possible defect in the source proposal's numbers.
    - >-
      THE SAME CLAIM APPEARS IN STRONGER AND UNQUALIFIED FORM in the unapproved
      contract experiments/EXP-ECDLP-a1c262/specification.yaml, whose wording
      "ALREADY HALF-FAILING" carries none of the decision's hedging. That wording
      is unsupported and is one of the eight blocking changes the review returns.
    - >-
      THE ERROR RAN IN THE CAUTIOUS DIRECTION, which is why it survived: it
      manufactured a reason to run a cheap check before spending, and a
      needlessly cautious gate reads as diligence rather than as a defect. It is
      corrected anyway. A control convened against a defect that does not exist
      is not a cheap safeguard; it is a control that cannot fail, which
      DEC-20260904-166ab5 refuted in the round immediately before and which this
      program treats as a failure mode in its own right.

  independently_verified_here:
    - >-
      The five archived literals were read directly out of
      experiments/EXP-LPF-001/results/calib/null_replicate_statistics.json by the
      session recording this correction, not taken from the reviewer's report.
      They match the quoted 4.5709 and 11.5937 to the quoted precision.
    - >-
      ln(X)/ln(D) = 0.9693744651138807, recomputed here from the archived
      X_over_D = 0.5069737250450999 and D = 2**32. The DIRECTION of the
      range/argument mismatch reported in DEC-20260904-3bb7fc's preceding bullet
      is therefore CONFIRMED and is NOT corrected by this record: u_D overstates
      u, understates rho, and inflates R.

  what_is_not_corrected:
    - >-
      THE UNDERLYING DEFECT IN EXP-LPF-001 STANDS. lpf001_driver.py:627 states
      that samples are drawn on [1, p**2] while :482 computes u from D = 2**32.
      That mismatch is real, its direction is confirmed above, and
      DEC-20260904-3bb7fc's separate bullet recording it is untouched by this
      correction.
    - >-
      NO OTHER BULLET, LIMITATION OR NEXT ACTION of DEC-20260904-3bb7fc is
      corrected. In particular its refusal to approve anything, its ranking of
      EXP-ECDLP-a1c262 first among the tranche, and its statement that approval
      is a separate round all stand -- and the review that ruling 4 commissioned
      is exactly the mechanism that caught this.
    - >-
      THE ORIGINAL RECORD IS NOT EDITED. DEC-20260904-3bb7fc is immutable and
      remains on disk as written; this record supersedes the named field
      (CLAUDE.md rule 2).

  consequences:
    - >-
      EXP-ECDLP-a1c262 may not be approved carrying the "ALREADY HALF-FAILING"
      wording or a control whose stated purpose is to void figures that cannot be
      voided. It remains status review_required with approved_by null.
    - >-
      C-A-ARCHIVED-REDERIVATION should either be withdrawn or restated as what it
      can actually do: confirm that the pipeline still reads back the archived
      literals it claims to, which is a drift check on the reader and not a test
      of the figures.
    - >-
      No evidence record, hypothesis status, or goal status changes. Nothing was
      run, and this correction is not evidence for or against any mathematical
      claim.
