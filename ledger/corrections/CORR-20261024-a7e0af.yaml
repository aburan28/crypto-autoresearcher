  record_id: H-CZLIFT-9a32e9
  field: >-
    mechanism (M1 to M3), structural_ingredients (C1 Neron entry, C2 JKSST
    entry), and a qualifier beside source_statement (Q1). One correction: one
    record, one review round.
  prior_value: Quoted verbatim per item in items[].prior_value.
  corrected_value: Per item in items[].corrected_value.

  items:
    - id: M1
      field: mechanism, first sentence
      prior_value: >-
        "Neron's theorem counts Mordell-Weil points of bounded canonical
        height as lattice points in a ball of radius sqrt(log H), giving (log
        H)^{r/2}; the naive height differs from the canonical one by a bounded
        amount, so the exponent is unchanged."
      corrected_value: >-
        The count of points of naive height <= H with its constant,
        N_E(H) = V_r (log H)^{r/2} / sqrt(Reg) (1 + o(1)) as written in the
        EV-CZLIFT-376eee obstruction, is the lattice-point count in a canonical-height
        ball, cited to Lang 1983 (Fundamentals of Diophantine Geometry, Ch. 5,
        Thm 7.4) rather than Neron 1965 (an imprecise attribution). The naive
        and canonical heights differ by a bounded but model-dependent amount,
        so the exponent and the leading constant are unchanged asymptotically,
        while at finite H the shift can dominate (EXP-CZLIFT-14f6d5
        translation instance). Confirmed at toy scope on the ladder (C1 of
        EV-CZLIFT-376eee, within [0.963, 1.309] for 1e3 <= H <= 3e5).
      basis: [DEC-20261023-26a6de synthesis item 4 and limitations, EV-CZLIFT-376eee, DEC-20261023-6931ab (D3)]
    - id: M2
      field: mechanism, second sentence and the clause "and they are spread uniformly"
      prior_value: >-
        "Reduction mod p of a set of global points that is small relative to p
        has no reason to be structured in E(F_p), and the coupon-collector
        count then says that hitting a prescribed residue needs on the order
        of p points, which costs log H of order (p/c_E)^{2/r}." and "... and
        they are spread uniformly."
      corrected_value: >-
        Reduction mod p is a homomorphism, and that structures the reductions:
        kernel vectors have canonical height >= 2 log p - c_E (measured
        >= 2 log p + 0.91), so collisions are suppressed at short distance and
        clumped on few kernel vectors, and the image index caps coverage
        (EV-CZLIFT-376eee D1 to D5). The reductions are not spread uniformly:
        median coverage ratio 1.0330 / 1.0333 against uniform null bands with
        upper edges <= 1.0041 (post hoc, replicated within shared point sets;
        a structured kernel-floor null fits). The structure does not help an
        attacker: by pigeonhole any spread saves at most a factor 2 ln 2 in
        the number of points (D6). Hitting a prescribed residue still needs on
        the order of p distinct points, by counting, not by coupon collection
        under uniformity: half coverage needs >= N_p/2 distinct global points,
        i.e. log H_half >= (sqrt(Reg) N_p / (2 V_r))^{2/r} (1 + o(1)) at fixed
        rank (D7).
      basis: [DEC-20261023-26a6de C2 clause decision and rationale, EV-CZLIFT-376eee]
    - id: M3
      field: mechanism, last sentence
      prior_value: >-
        "This is the quantitative form of the Silverman-Suzuki, Huang-Kueh-Tan
        and xedni obstructions: lifting a random point of E(F_p) to a point of
        E(Q) of height polynomial in log p is impossible because there are
        only polynomially many such points and they are spread uniformly."
      corrected_value: >-
        The census quantifies the counting ingredient (the N(B) point count)
        that JKSST 2000 use in Lemma 4.1 and Theorem 4.1, not their theorem,
        and not the Silverman-Suzuki or Huang-Kueh-Tan arguments (recalled
        pointers, not retrieved in primary form). That those analyses "die on
        this" is not established. "Impossible" is not shown: beyond the toy
        range only the conditional fixed-rank bound D7 holds, under transfer
        assumptions T1 (rank fixed independently of p; it weakens to
        polynomial height once r >~ 2 log p / log(2 log p)), T2 (bounded c_E
        and naive-canonical height difference along the lifts), T3 (image
        index <= 2) and T4 (a fixed E/Q stands in for the attacker's
        p-dependent lift). Height is not attack cost.
      basis: [DEC-20261023-26a6de synthesis item 3, EV-CZLIFT-376eee transfer_assumptions, red-team citations_checked of RT-20261023-d796bb]
    - id: C1
      field: structural_ingredients[0] (Neron)
      prior_value: >-
        "citation: 'A. Neron, Quasi-fonctions et hauteurs sur les varietes
        abeliennes, Ann. Math. 82 (1965)'; provenance: recalled; role: the
        (log H)^{r/2} growth law"
      corrected_value: >-
        Role re-cited to S. Lang, Fundamentals of Diophantine Geometry
        (Springer, 1983), Ch. 5, Thm 7.4, for the count with its constant;
        provenance recalled, verified_by null (not retrieved in this round;
        DEC-20261023-26a6de lists it as a recalled ingredient). The Neron 1965
        entry stays as written, recalled, and is not the attribution for the
        constant. Both are pointers, never support, until an agent that reads
        the source records itself in verified_by.
      basis: [DEC-20261023-26a6de]
    - id: C2
      field: structural_ingredients[1] (JKSST)
      prior_value: >-
        "citation: 'M. J. Jacobson, N. Koblitz, J. H. Silverman, A. Stein, E.
        Teske, Analysis of the xedni calculus attack, Des. Codes Cryptogr. 20
        (2000)'; provenance: recalled; verified_by: null; role: the
        obstruction this census quantifies"
      corrected_value: >-
        Citation completed to Des. Codes Cryptogr. 20 (2000) 41-64; provenance
        retrieved, verified_by TASK-20261023-62eb31 (primary PDF read in full;
        also read by TASK-20261023-326d39). Role restated: the source of the
        N(B) counting ingredient this census measures. Its Theorem 4.1 bounds
        xedni success by C0/p conditionally on Lang's canonical-height
        conjecture and Lemma 4.1's assumption log|D| >= C1 max hhat(P_i); the
        bound is vacuous at toy p (C0 ~ 1e4 for r = 2, ~ 1e12 for r = 3), and
        the paper measures frequent dependence at small discriminants
        (sections 5.1, 5.2). The census does not quantify that theorem.
      basis: [CORR-20261023-4ffd7e S3, red-team citations_checked of RT-20261023-d796bb, DEC-20261023-26a6de procedure_deviations]
    - id: Q1
      field: source_statement (qualifier beside the user's verbatim words; the words are not changed)
      prior_value: >-
        "Silverman-Suzuki, Huang-Kueh-Tan, and the xedni analysis all die on
        this."
      corrected_value: >-
        User H2 stays verbatim. Qualifier: not established by this round. The
        round measured the counting ingredient only (M3), and the "rank r is
        small" premise is not what the counting bound needs (it holds at every
        fixed rank; CORR-20261023-1cf8b3 M2).
      basis: [DEC-20261023-26a6de synthesis item 3, DEC-20261023-6931ab synthesis item 5]

