  lanes_affected: [L-RIGID, D8]
  field: rigidity closure, specifically the premise that the seed's provenance cannot be recovered by computation
  prior_value: >-
    P-256: "The rigidity question cannot be settled by any computation on the
    published parameters", because "no amount of transcript verification bounds
    how the seed was chosen". Documentary or historical evidence about the seed
    "is outside this program's methods entirely". P-384: "rigidity cannot be
    VERIFIED by any transcript computation at any budget, because the seed's
    provenance is not a function of any curve data", and "S is an input, not
    an output". P-224: rigidity is a property of the preimage of the SEED -> b
    projection, "which is why part of lane L-RIGID is documentary and not
    computable".
  corrected_value: >-
    The seed-origin half of the rigidity question has been settled by
    computation on the published seeds. For all ten X9.62 / FIPS 186-2
    prime-curve seeds (P-224, P-256 and P-384 included), the seed is one
    20-byte block of (int)(drand48()*256) output after srand48(t), with t a UNIX
    time between May 1997 and April 1998. This was recovered from the seed
    bytes alone: external lattice state recovery reported in KN-LIT-d2f917, and
    an internal forward regeneration listed in
    research/nist_seed_provenance_20261016/README.md. The chance that a 48-bit
    LCG state regenerates a 160-bit seed is about 2^-112. The premise that the
    seed's provenance "is not a function of any curve data" ("S is an input,
    not an output") is therefore false for these curves. The narrower
    statement still stands: checking b = F(S) alone, without a model of how S
    was produced, does not bound how S was chosen. Computation has NOT
    settled three things: (i) why about half of the candidates passing every
    known check were skipped in each run (10 published, 11 skipped; a
    preregistered screen found no separating rule;
    problems/nist-seed-selection-rule-unexplained.md); (ii) the base points of
    P-224, P-256, P-384 and P-521; (iii) the B-163 seed. The expected
    SafeCurves cell rigid = false for P-224, P-256 and P-384 is therefore
    unchanged. The generator still left about 30 bits of freedom per curve
    (Valsorda, reported), and the selection rule and these base points remain
    unexplained.
  reason: >-
    The closures were written before the seeds' generator was identified. They
    assumed the seed carried no recoverable structure. It does. AGENTS.md
    core rule 4 makes results immutable and puts corrections in new records, so
    the five archived planning artifacts are left as they are and this record
    supplies the corrected statement.
  consequences_for_lanes:
    - >-
      L-RIGID (verification half): the planned transcript check r * b^2 = -27
      (mod p) is unaffected. Reporting REPRODUCED or NOT REPRODUCED now sits
      beside a known seed origin. A successor lane that reports the transcript
      must cite KN-LIT-d2f917 and must not restate that the seed is
      unexplained.
    - >-
      D8 (degrees-of-freedom half): D8 as planned samples uniform 160-bit seeds
      and measures the procedure. That remains a measurement of the procedure
      as written. It is no longer a measurement of the freedom the historical
      generator had. For the historical curves that freedom is bounded at about
      30 bits by the generator (KN-LIT-d2f917) and is recorded at full size in
      research/nist_seed_provenance_20261016/census/summary.json. A successor
      D8 must say which of the two it measures.
  evidence_artifacts:
    - knowledge/literature/KN-LIT-d2f917.md
    - research/nist_seed_provenance_20261016/README.md
    - research/nist_seed_provenance_20261016/census/summary.json
    - research/nist_seed_provenance_20261016/PREREGISTRATION.md
