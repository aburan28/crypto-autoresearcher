    - problems/nist-seed-selection-rule-unexplained.md
  non_retroactivity: >-
    The task reports, audit plans and mirror addendum are preserved byte for
    byte. They were planning artifacts and adjudicated no criterion cell. This
    correction adjudicates none either: no SafeCurves comparison cell, goal
    status, hypothesis status or claim tier changes.
  interpretation_limits:
    - >-
      Verified provenance, not an attack. Nothing here changes the ECDLP on
      P-224, P-256 or P-384, or any attack cost, and it does not show that any
      curve is weak or that none is.
    - >-
      The internal reproduction has not yet been independently validated by
      this program. The skip-filter screen and the base-point scans ran outside
      the repository and are reported in the bundle as observations.
