correction:
  id: CORR-20260921-c6d31a
  recorded_at: '2026-09-21'
  record_type: claim
  record_id: CORR-20260921-9dc350
  corrected_record_path:
    - ledger/corrections/CORR-20260921-9dc350.yaml
  field: >-
    corrections[C3].corrected_value -- the stated mechanism by which a
    collision moves `spread`, and the stated direction of the success_criterion
    clause (6) inequality. The directional conclusion of that entry (clause (6)
    needs MORE collisions on the CONTROL than on the OBJECT) is NOT corrected;
    it is correct and stands.
  prior_value: >-
    "The condition clause (6) actually requires is a strictly smaller object
    spread, which needs MORE collisions on the CONTROL than on the OBJECT (a
    collision lowers `distinct_targets`, which lowers `p_m`, which raises
    `cost_ratio_neg`, which widens spread -- so a control with a collision the
    object lacks would show the LARGER cost_ratio_neg / smaller p_m needed for
    the object's spread to be strictly smaller by comparison; ...)"
  corrected_value: >-
    Two clauses of that sentence are inverted, and the inversions cancel.
    (i) specification.yaml's success_criterion clause (6) requires the spread
    of cost_ratio_neg on EACH of the C2, C3 and C4 control arms to be STRICTLY
    SMALLER than the object arm's spread in that cell, i.e.
    spread(control) < spread(object): the passing condition is a strictly
    smaller CONTROL spread (equivalently a strictly LARGER object spread), not
    "a strictly smaller object spread". (ii) spread = max/min of cost_ratio_neg
    over the arm's achievable partitions; on both tested cells that is R1/R2
    with R1 the m=1 (coarse) ratio and R2 the m=2 (fine, argmin) ratio. A
    collision (distinct_targets < prod_tuple_count) can occur only at the m=2
    partition -- at m=1 distinct_targets == prod_tuple_count identically -- so
    it lowers p_m and raises R2, the MIN of the two, which NARROWS the spread;
    it does not widen it. Put together: a control carrying a fine-partition
    collision the object lacks shows a strictly SMALLER spread than the
    collision-free object, which is exactly what clause (6) needs -- hence
    "more collisions on the CONTROL than on the OBJECT" is the correct
    direction, for the reason given here rather than the reason given in
    CORR-20260921-9dc350 C3. The measured record already exhibits this
    mechanism: C2 on FROB-SPLIT-q11n5, the one control with a collision
    (36 -> 18 distinct targets at [2,2]), has spread 4365/1936 (~2.25),
    strictly SMALLER than the collision-free object's 2055/451 (~4.56). The
    commit message of e5b791b6a, which CORR-20260921-9dc350 cites as its
    independent confirmation, states the mechanism in this correct form
    ("the fine cost_ratio_neg rises, which shrinks the max/min spread"); the
    parent record's paraphrase of it inverted both halves.
  reason: >-
    Because the two inversions cancel, CORR-20260921-9dc350 C3 reaches the
    right directional fix by accident, but a reader applying either clause of
    its text in isolation -- "clause (6) requires a strictly smaller object
    spread", or "a collision raises cost_ratio_neg, which widens spread" --
    would re-invert the very passing condition that record exists to correct.
    Found by a PR review of this branch and verified by the recording session
    directly against specification.yaml's success_criterion clause (6), the
    spread definition in its metrics block, and the independently recomputed
    spreads and collision counts in validation-20260921-round2.md (Sections 1
    and 3). Changes no measured value, no spread, no collision count, no
    artifact hash, no review verdict, no decision and no hypothesis status;
    C1, C2 and the directional conclusion of C3 in CORR-20260921-9dc350 are
    untouched. Recorded additively because CORR-20260921-9dc350 is already
    official on origin/main and AGENTS.md rules 2/4 forbid editing it in place.
  evidence_artifacts:
    - experiments/EXP-FROB-91ee9c/specification.yaml
    - experiments/EXP-FROB-91ee9c/validation-20260921-round2.md
    - ledger/corrections/CORR-20260921-9dc350.yaml
