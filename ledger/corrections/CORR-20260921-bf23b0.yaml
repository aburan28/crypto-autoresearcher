  nature: >-
    A CORRECT TECHNICAL FINDING FILED THROUGH THE WRONG MECHANISM ON ALREADY-
    OFFICIAL RECORDS. c13a21cf1's underlying diagnosis is right and is
    preserved below: PA-ECDLP-e36df2-v1-to-v2's original total_cpu_hours
    derivation (31226.33s / 28 runs =~ 1115s/run average, times 4 new runs
    =~ 4460s) is the wrong model. experiments/EXP-ECDLP-e36df2/driver's v1
    orchestration (instance_runner.run_curve) walks ONE shared m-ladder for
    all 4 primes of a curve and attributes the same
    cpu_seconds_curve_shared/wall_seconds_curve_shared figure to each of that
    curve's 4 run manifests (independently confirmed by this session during
    TASK-20260921-9b17e4's own archival: RUN-ECDLP-e36df2-029 through -032
    all record cpu_seconds=575.68-575.96s and identical
    wall_seconds_curve_shared=575.8183977603912, matching a SINGLE curve-level
    job's cost repeated across 4 manifests, not 4 independent ~1115s jobs).
    So the 28 existing runs are 7 curve-level jobs, not 28, and the per-job
    cost is dominated by that curve's largest prime rather than averaging out
    across primes.

    BUT: DEC-20260921-e21d6a, ledger/handoffs/TASK-20260921-9b17e4.yaml, and
    ledger/hypotheses/H-ECDLP-c48f2a.yaml were already merged into main via
    PR #1344 (merge commit cde1231330088ff8995dfed95ceeee88ac7899bd,
    2026-09-21T20:12:58Z) BEFORE c13a21cf1 was authored
    (2026-09-21T20:23:37Z). Editing an official, merged coordinator_decision,
    handoff, or hypothesis record in place -- however correct the new content
    -- is exactly what AGENTS.md rule 2 (ledger records immutable;
    corrections supersede, never overwrite) and this repository's own
    CORR-20260917-8b80cc precedent (which goes to considerable lengths to
    supersede rather than touch a single already-committed byte, even for
    trivial fixes) forbid. The amendment file
    (v1_to_v2_new_curve_extension.yaml) is closer to a living document by
    its own version_from/version_to nature, but it too was already cited
    verbatim, at its original values, by DEC-20260921-e21d6a's own committed
    rationale text -- editing it silently after that citation was made
    creates exactly the drift-between-a-decision-and-what-it-cites problem
    the immutability rule exists to prevent.

  operational_impact: NONE.
  operational_impact_detail: >-
    TASK-20260921-9b17e4 already executed and was already independently
