    correction is purely a refinement of the WRITTEN JUSTIFICATION for a
    number that turned out not to bind in practice, and changes no
    scientific parameter, run record, or verdict.

  corrected_derivation_preserved_for_the_record: >-
    Measured cpu_seconds_curve_shared for the six EXP-ECDLP-e36df2 v1 main
    curves (curve_idx 0-4 plus the engineered positive control, idx 5):
    6783s, 319s, 3320s, 7781s, 6110s, 6243s; the mu0_target=40 sensitivity
    redo of curve_idx=1 (the smallest-prime curve) cost 655s. Sum = 31211s,
    matching orchestrate_manifest_summary.json's recorded 31226.33s to
    within logging/summary overhead. Any FUTURE new-curve extension to this
    experiment family should budget one curve-level job at the observed
    per-curve maximum (7781s, at p=14821, the largest prime among the six)
    scaled toward the top of the frozen prime range ([2**10,2**14)), plus
    curve/prime-search and pooled-summary overhead -- c13a21cf1's own
    estimate of ~8600s for the scaled compute plus ~10800s (3 hours)
    all-in is a reasonable, itemized figure and is recommended for citation
    if this experiment is amended again, rather than a per-run average.

  disposition: >-
    DEC-20260921-e21d6a, ledger/handoffs/TASK-20260921-9b17e4.yaml,
    ledger/hypotheses/H-ECDLP-c48f2a.yaml, and
    experiments/EXP-ECDLP-e36df2/amendments/v1_to_v2_new_curve_extension.yaml
