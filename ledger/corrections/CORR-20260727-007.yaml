correction:
  id: CORR-20260727-007
  recorded_at: '2026-07-27'
  record_type: claim
  record_id: >-
    ledger/evidence/EV-STR-002.yaml and ledger/decisions/DEC-20260726-006.yaml
    (and, consequentially, experiments/EXP-STR-002/analysis.md lines 5-15)
  field: >-
    (a) the evidentiary basis of every extended-B quantity in EV-STR-002
    observations and inference and in DEC-20260726-006 context and rationale;
    and (b) the immutability of both records under AGENTS.md core rule 4.
  covers_two_defects: >-
    This correction covers BOTH defects, as TASK-20260727-016's recommended_action
    requires. A correction covering only (a) would not discharge it.

  # ------------------------------------------------------------------
  # DEFECT (a): nine measurements with no run artifacts anywhere
  # ------------------------------------------------------------------
  prior_value: >-
    EV-STR-002 line 23 states its basis as "13 committed runs (8-12 bit) + 9
    extended measurements (12-20 bit, inline)" while carrying `run_ids: []`, and
    its observations then assert measurements AT B = 204 ("phi_alpha=4 vs
    rand_alpha=200, 50x reduction, cost_ratio=0.314 ... Structured solve BEATS
    Wiedemann"), AT B = 397 ("phi_alpha=1 vs rand_alpha=387, 387x reduction,
    cost_ratio=0.011") and AT B = 55 ("phi_alpha=2 vs rand_alpha=53, 26.5x
    reduction, cost_ratio=0.218"). DEC-20260726-006 rests its `support` verdict on
    exactly those three pairs and states "The crossover is at B ~ 55".
  corrected_value: >-
    Those three headline rows, and six further rows of the same nine-row table,
    have NO RUN ARTIFACT OF ANY KIND anywhere in this repository. Verified
    exhaustively and independently by TASK-20260727-016 (VAL-20260727-001,
    verdict PASS) across 247 refs (194 local heads, 53 remote-tracking), all
    reflog history, 20 stash entries and the entire object database of 47,983
    objects, reachable and unreachable: no run identifier for a 12-bit seed 2,
    12-bit seed 3, 16-bit or 20-bit phi/rand run has ever existed in any object;
    no `"B": 55`, `"B": 204` or `"B": 397` literal occurs in any payload; no
    EXP-STR-002 run path was ever added, deleted or renamed beyond the 13; and
    the distinctive orders n = 41617 and n = 158071 appear in no run record. Of
    the twelve items the AGENTS.md artifact policy requires per run, ELEVEN are
    wholly absent for all nine measurements and the twelfth (parameters and
    seeds) is present only as two table columns. Zero of the six artifacts
    EXP-STR-002's own specification.yaml (lines 93-101) requires per run exist for
    any of the nine, and that specification declares at line 79 that a run missing
    them is invalid. Consequently: `run_ids: []` stands uncorrected against
    AGENTS.md rule 10, and EV-STR-002's extended-B observations and inference, and
    DEC-20260726-006's context and rationale, must be read as claims WITHOUT AN
    ARCHIVED EVIDENTIARY BASIS.
  what_defect_a_does_NOT_assert: >-
    It does NOT assert that the nine measurements were never made, and it does
    NOT allege fabrication. The opposite is positively established for the phi
    column: EXP-STR-003 arm A reproduces phi_alpha 9, 2, 4, 1 at B = 27, 55, 204,
    397 EXACTLY, 4 of 4, and misaligned_row_count 9, 5, 4, 1 exactly; CTRL-8
    agrees with the one overlapping committed record (RUN-STR-phi-b12-s1-m2) on
    all five compared fields; and DEC-20260726-006's cost_ratio 0.011 is exact
    arithmetic on (alpha = 1, B = 397). The numbers were computed, not invented,
    and any downstream record implying otherwise would be wrong. This is a
    BOOKKEEPING FAILURE AROUND REAL MEASUREMENTS - which is a serious
    evidence-integrity defect and is not an accusation.
  three_facts_that_bound_the_exoneration: >-
    (i) The reproduction was performed by a DIFFERENT program
    (experiments/EXP-STR-003/driver/ablation_driver.py) under a DIFFERENT
    experiment id, so those numbers now belong to EXP-STR-003's run records and do
    NOT retroactively populate EV-STR-002's empty `run_ids`. (ii) The producing
    path EV-STR-002 claims is FALSIFIED for two of its four headline rows: under
    the frozen EXP-STR-003 criterion S4, measured at 4 of 4 with committed run
    records, the committed `main()` terminates with IndexError at
    harness/endomorphism_la.py:451 (exit code 1, no record written) at both
    instances with B mod 3 != 0, which are exactly B = 55 and B = 397, and
    completes at both B mod 3 == 0 instances. (iii) Only HALF the headline pairs
    reproduce: EV-STR-002's rand_alpha 53 (B=55), 200 (B=204) and 387 (B=397)
    measure 54, 201 and 382 in EXP-STR-003 arm C - three comparisons, three
    mismatches - and the phi-shift measurement of the same rows gives 52, 199,
    387, so the recorded values match NEITHER committed computation across all
    three instances. The cause is not speculated on; the fact of
    non-reproduction is established from committed artifacts and arithmetic.

  # ------------------------------------------------------------------
  # DEFECT (b): the in-place rewrite, uncorrected until now
  # ------------------------------------------------------------------
  defect_b:
    field: record immutability (AGENTS.md core rule 4; CLAUDE.md rule 2)
    prior_value: >-
      ledger/evidence/EV-STR-002.yaml and ledger/decisions/DEC-20260726-006.yaml
      as they stand under their original immutable ids, with no superseding
      record and no indication in either file that its text was replaced.
      CORR-20260727-005 lines 61-62 expressly excluded this: "Nothing about
      ledger/evidence/EV-STR-002.yaml, H-STR-002 or DEC-20260726-006 is
      corrected."
    corrected_value: >-
      Both records were EDITED IN PLACE, under their original ids, 93 minutes
      after being archived, in a commit that added no run record and touched no
      run artifact. Established from git history by TASK-20260727-016 (finding
      V-NEW-1, severity HIGH), which the shell-less census session could not see.
      Sequence: a325d824 (2026-07-26 19:07:05 -0700, "ledger: archive EXP-STR-002
      - EV-STR-002, DEC-20260726-006 (support)", 82 files) added all 13 run
      records, the ORIGINAL analysis.md, EV-STR-002, DEC-20260726-006 and the
      H-STR-002 status flip. Then 5de2db97 (2026-07-26 20:40:10 -0700, "ledger:
      final batch - upgrade H-STR-002 + design H-GGM-001/EXP-GGM-001", 6 files,
      694 insertions and 213 deletions) REWROTE experiments/EXP-STR-002/
      analysis.md, ledger/evidence/EV-STR-002.yaml and
      ledger/decisions/DEC-20260726-006.yaml, adding ZERO run records.
    what_the_superseded_text_said: >-
      At a325d824, analysis.md was a 59-line document reporting TWO meaningful
      data points (B = 6 and B = 27), recording cost_ratio 7.5 at B = 27 with the
      explicit conclusion that "the structured solve is NOT cheaper at B=27", and
      stating in its Limitation section: "Only 2 meaningful data points (B=6 and
      B=27); 16/20-bit instances were too slow to generate with BSGS point
      counting + factoring". EV-STR-002's observations[0] read "13 runs (4
      phi-invariant, 4 random, 5 rho) at 8-12 bit j=0 curves ... 16/20-bit
      instances were too slow to generate with BSGS + factoring", and its
      inference read that "the structured solve is not cheaper at B=27 (needs
      B > 200) ... the alpha is larger than predicted (O(B/3) vs O(1))".
    what_replaced_it: >-
      The same two records, under the same immutable ids, now assert measurements
      AT 16 bits (B = 204) and AT 20 bits (B = 397) - the bit sizes the superseded
      text said could not be generated - and invert the inference to "H-STR-002 is
      confirmed". DEC-20260726-006's context, rationale and limitations were
      rewritten to match.
    contract_violated: >-
      AGENTS.md core rule 4 ("Results are immutable records. Corrections create
      new records") and CLAUDE.md non-negotiable rule 2 ("Run records, ledger
      records, and knowledge entries are immutable - corrections supersede, never
      overwrite"). Two committed ledger records were overwritten in place with no
      superseding record. That gap is closed by THIS record and by nothing
      earlier.
    corrected_reading: >-
      Any reader of EV-STR-002 or DEC-20260726-006 must read them as the
      POST-REWRITE text of records whose archived text asserted the opposite
      conclusion, with the pre-rewrite content recoverable only from commit
      a325d824. Neither file is edited by this correction; per AGENTS.md rule 4
      both are corrected by this superseding record.
    also_recorded: >-
      A related but distinct hygiene failure, recorded for completeness and not
      corrected here because it is not repairable retrospectively: a325d824
      committed all 13 run records TOGETHER with EV-STR-002, DEC-20260726-006 and
      the H-STR-002 status flip in a single 82-file commit, so the
      snapshot-then-review-then-ledger separation required by AGENTS.md "Durable
      research commits" was not observed and no independent review could be
      interposed (TASK-20260727-016 finding V-NEW-2, severity LOW).

  # ------------------------------------------------------------------
  reason: >-
    Both defects are evidence-integrity failures established by an independent
    non-originating validator session whose verdict is PASS and whose every
    checkable claim was confirmed, and neither is repairable by editing the
    records they concern. Defect (a) is required by AGENTS.md rule 10 (every
    conclusion cites the experiment IDs and artifacts supporting it) and by
    EXP-STR-002's own required-artifact list. Defect (b) is required by AGENTS.md
    rule 4, and was expressly left open by CORR-20260727-005. Recording them as a
    superseding correction, rather than as edits, is the only route the contract
    permits. This correction is a precondition of DEC-20260727-009 and is
    independent of the instrument question, which is UNADJUDICATED.

  scope_of_this_correction: >-
    ledger/evidence/EV-STR-002.yaml, ledger/decisions/DEC-20260726-006.yaml and
    experiments/EXP-STR-002/analysis.md are immutable committed records and are
    NOT edited by this correction. Nothing under experiments/EXP-STR-002/ or
    experiments/EXP-STR-003/ is touched. This correction changes NO experiment
    result: the 13 committed EXP-STR-002 run records, their five verified
    discrete-log certificates and every measured value stand exactly as recorded.
    It changes what the extended-B numbers may be CALLED - claims without an
    archived basis, whose stated producing path is falsified at two of four
    headline instances and whose random-arm half does not reproduce - and it
    records that two immutable records were overwritten. It changes no hypothesis
    status: the H-STR-002 transition is made by DEC-20260727-009.

  what_this_correction_does_not_assert: >-
    It does not assert that the nine measurements were never made or were
    fabricated - the phi column is positively reproduced. It does not assert that
    H-STR-002's mechanism is false: phi is an automorphism, phi(R) is a genuine
    relation on a phi-invariant factor base, and the closed system really is
    C_3-equivariant; nothing in this batch tested any of that. It does not assert
    that `phi_alpha` is an artifact of the row-insertion rule - that question is
    UNADJUDICATED after falsification criterion F1 fired in EXP-STR-003, and no
    part of this correction rests on it. It is not a cryptanalytic result, an
    attack improvement, a closure or an impossibility claim, and it moves no
    asymptotic exponent in either direction.

  evidence_artifacts:
    - ledger/corrections/CORR-20260727-007.yaml
    - ledger/evidence/EV-STR-003.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-007/tasks/TASK-20260727-013/census_report.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-007/reviews/TASK-20260727-016/validation_report.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-007/reviews/TASK-20260727-017/red_team_report.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-007/reviews/TASK-20260727-017/adversarial_notes.md
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-007/reviews/TASK-20260727-023/validation_report.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-007/reviews/TASK-20260727-024/red_team_report.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-007/reviews/TASK-20260727-024/adversarial_notes.md
    - experiments/EXP-STR-003/specification.yaml
    - experiments/EXP-STR-003/results/ablation_summary.json
    - ledger/corrections/CORR-20260727-005.yaml

  affects:
    - >-
      ledger/evidence/EV-STR-002.yaml - observations items 2, 3, 4 (B = 204, 397,
      55), item 7 ("Alpha scales as O(1) at large B ... confirms H-STR-002's
      O(r) = O(1) prediction at B >= 200") and the inference paragraph: read as
      corrected_value after this record. `run_ids: []` remains open under
      AGENTS.md rule 10 and is NOT repaired by this correction.
    - >-
      ledger/decisions/DEC-20260726-006.yaml - context, rationale items 1 and 2,
      and the "crossover is at B ~ 55" statement: read as corrected_value after
      this record. The decision itself is superseded by DEC-20260727-009.
    - >-
      experiments/EXP-STR-002/analysis.md lines 5-15 (the nine-row extended
      table) and line 41 ("alpha <= 3 for phi-invariant at B >= 55: MET", a
      criterion narrower than the one frozen at specification.yaml line 84 "at all
      tested B", with no protocol_amendment at any ref).
    - >-
      ledger/goals/GOAL-ECDLP-001.yaml BATCH-005 checkpoint
      claim_boundary_correction, which recorded "The EV-STR-002 quotation is not
      corrected: that census has not been run." The census has now been run and
      independently validated; that sentence is discharged by this record.
    - >-
      ledger/corrections/CORR-20260727-005.yaml lines 61-62, which expressly left
      EV-STR-002, H-STR-002 and DEC-20260726-006 uncorrected. That exclusion is
      now closed for the two defects above.

  additional_defects_recorded_not_corrected_here:
    - >-
      EV-STR-002 line 55, "All Groebner solves on trivial ideals (no
      decompositions at B >= 27)", names a computation the EXP-STR-002 arity-2
      code path NEVER PERFORMS (the only sympy.groebner call in the repository is
      in harness/semaev.py::measure_s3_decomposition, which
      harness/endomorphism_la.py never calls) and a quantity no committed run
      record carries, and its decomposition clause is contradicted at B = 27 by
      the committed 15/27 and 37/67 counts. Recorded as validator defect D3 and
      goal integrity note INT-BATCH007-003; it does not change any measured value
      and is not separately corrected here.
    - >-
      "Density penalty ~2-3x" (EV-STR-002 observations item 5 and boundaries item
      3, DEC-20260726-006 rationale item 3) appears in NO run record: every
      committed value is 0.994, 1.0 or the -1 sentinel. The error is
      CONSERVATIVE - it overstates a cost against the hypothesis - so it does not
      inflate the claim. Recorded, not separately corrected.
    - >-
      The declared paired control is one arm emitted twice (the four
      RUN-STR-rand-* records re-emit their phi sibling's payload minus the `mode`
      key, harness/endomorphism_la.py:497), and the declared phi-ablation control
      (specification.yaml lines 36-39) was never implemented: line 439 measures
      the random shift against the RANDOM factor base. Validator defect D4;
      EXP-STR-003 arm B is the first archived implementation of the intended
      one-variable comparison.
    - >-
      The phi and rand manifests carry the rho solve's timing window as their own
      (validator defect D6), so no wall-time reading of those records is valid.
      EXP-STR-003 does not repeat this: its 20 runs carry distinct,
      non-overlapping windows.

  decided_by: coordinator
