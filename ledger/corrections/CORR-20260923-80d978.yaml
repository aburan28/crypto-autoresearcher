  field: >-
    (a) experiments/EXP-GFPN-726eb2/runs/RUN-GFPN-3bbef2/audit-table.yaml,
    row criterion cm_discriminant_bits, field result.
    (b) The meaning of `result: PASS` on the rows order_certificate, cofactor,
    embedding_degree, cm_discriminant_bits, twist_order_factorization,
    twist_security_bits and rigidity_reproduced, in the audit-table.yaml of
    RUN-GFPN-3bbef2 AND RUN-GFPN-b71f2f.
    (c) The row scurve_control_certificate_match, "PASS (RUN-GFPN-17ed52,
    recorded before this run)", in both tables.

  prior_value: >-
    (a) result: PASS (with matches_self_report: false; self_report "D = t^2 -
    4q = -0x350910d7...e43 (323 bits)"; note "|D| = 322 bits; fundamental
    discriminant 322 bits").
    (b) PASS, read in a SafeCurves-style table as "meets the criterion".
    (c) PASS, read as the computed outcome of the contract's blocking
    instrument control.

  corrected_value: >-
    (a) result: FAIL -- the finding under the frozen falsification criterion.
    The self-reported cm_discriminant_bits figure is 323 bits. Independent
    recomputation gives 322 bits, and no rounding tolerance is declared for a
    bit count. The self-reported INTEGER D reproduces exactly. The run remains
    valid measurement, as the frozen text states.
    (b) PASS means "a certificate-bearing value was computed". For
    rigidity_reproduced it means "the search's first hit equals the declared
    tuple". No row compares any value with any SafeCurves threshold. No row
    except rigidity_reproduced has a FAIL branch (gfpn_audit.py lines 627-633).
    matches_self_report is recorded but never read by a label. Readers take
    the information from the values, from matches_self_report and from the
    certificates, never from the labels.
    (c) The row is a string literal written by gfpn_audit.py line 635. The
    GFPN pipeline never reads RUN-GFPN-17ed52's result. The control as run
    (deviation D-1) is a separate script that shares no project function with
    the GFPN scoring path and calls no PARI. It is therefore not the frozen
    contract's instrument re-run, and no protocol_amendment authorised the
    change. The control's own run, RUN-GFPN-17ed52, is a valid regeneration of
    the prior SCURVE dossier and stays completed_valid.

  reason: >-
    (a) The frozen falsification_criterion of
    experiments/EXP-GFPN-726eb2/specification.yaml (lines 194-199) reads: "a
    self-reported numeric figure (order, twist_security_bits,
    cm_discriminant_bits) fails independent recomputation by more than the
    declared rounding tolerance ... That criterion row is FAIL and is the
    finding; the run remains valid measurement". The validator
    (TASK-20260923-2d8db0, J2(d)) ruled that the self-reported figure is the
    bit count, for four reasons:
    - the metric is named cm_discriminant_bits;
    - H-GFPN-ee4d45 lists "CM discriminant bit-length";
    - the note states "323 bits" three times (lines 243, 249, 271);
    - the producer's own matches_self_report is the bit-length comparison.
    Dispatcher verification (2026-09-23): the recomputed D equals the
    committed integer, has 81 hex digits with leading digit 3, and is
    therefore 322 bits. No explanation of "323" is adopted.
    (b) The red team's proves-too-much control (TASK-20260923-01af16, objects
    A-C). The committed pipeline, fed literal-only input mutations, emits PASS
    in these cases:
    - embedding_degree, with a wrong e = n - 1, on a supersingular curve
      (true embedding degree 2);
    - rigidity "reproduced" on a subfield curve outside the published search;
    - three of three rows on EcMasFp5 with tampered self-reports.
    Artifacts: scratch/objects/*/out/audit-table.yaml and
    scratch/variants/*/variant.diff.
    (c) Validator J3: static call graph
    (scratch/inv1/result.json D_J3a_callgraph), gfpn_audit.py line 635, and
    specification.yaml's control object "re-run must match prior certificate
    bytes (or hash) before GFPN scoring" together with its status_note "Any
    change requires a versioned protocol_amendment".

  effect_on_dependent_records: >-
    - The contract's frozen falsification criterion is unreachable through
      these labels as built. This bears on the evidence reading
      (EV-GFPN-ba8e4d) and on any reuse of the pipeline, which is covered by
      the instrument-repair next action of DEC-20260923-a118fa, with objects
      A-D as acceptance fixtures.
    - The invalidation rule "Scoring results after a failed SCURVE control
      match invalidates GFPN rows" did NOT fire: nothing failed. The certified
      values stand on their own certificates, independently re-verified in
      J1, J2 and J4.
    - check_run.py (lines 37-43) checks only that labels agree with metrics.
      The package gate therefore could not flag (a) either.

  evidence_artifacts:
