# (RUN-GFPN-3bbef2 and RUN-GFPN-b71f2f). (a) EcMasFp5 cm_discriminant_bits
# reads PASS where the frozen falsification criterion makes it FAIL. (b) PASS
# throughout both tables means "computed with a certificate", never
# "criterion met". (c) The scurve_control_certificate_match row is a
# hard-coded literal. One defect class: result labels that do not express
# what the frozen contract says they express.
# Written by the Coordinator under TASK-20260923-e52c88 from joints J2 and J3
# and the proves-too-much control of TASK-20260923-cc166b. The archived tables
# are NOT edited.
# =============================================================================
