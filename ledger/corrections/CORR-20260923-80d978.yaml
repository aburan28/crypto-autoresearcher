    - experiments/EXP-GFPN-726eb2/runs/RUN-GFPN-3bbef2/audit-table.yaml
    - experiments/EXP-GFPN-726eb2/runs/RUN-GFPN-b71f2f/audit-table.yaml
    - experiments/EXP-GFPN-726eb2/implementation/gfpn_audit.py
