correction:
  id: CORR-20260802-012
  recorded_at: '2026-08-02'
  record_type: schema
  record_id: EV-WESO-001-PROOF-STATUS-CONDITIONAL
  field: ledger/evidence/EV-WESO-001.yaml proof_status
  reason: >-
    The record held `proof_status: conditional_on_heuristic`, which is not one
    of the four defined statuses, so the field was rejected and the record's
    proof level was effectively unstated.
  resolution: >-
    docs/claims-and-verification.md, section "Heuristic-conditional claims", is
    explicit that a heuristic-conditional result IS a derivation record whose
    statement begins "Assuming Heuristic N, ..." and enumerates every heuristic
    by number. The conditionality belongs in the statement, not in proof_status.
    EV-WESO-001 already enumerates Heuristic 1, so `derivation` is the status
    that doctrine assigns it rather than a judgement introduced here. The
    original marker is preserved verbatim in a new
    proof_status_conditionality field so nothing is lost.
  what_this_does_not_do: >-
    It does NOT discharge the heuristic or strengthen the claim. Per the same
    section, the only events that remove the "conditional on Heuristic N"
    qualifier are an unconditional proof of the heuristic or replacement by a
    stronger unconditional result; experimental validation at any scale,
    including cryptographic scale, does not discharge it. The claim remains
    conditional on Heuristic 1 exactly as before.
  related_defect_still_open: >-
    EV-WESO-001 and H-WESO-001 still carry digit-bearing area codes, and
    EXP-WESOVOW-001's contract is a flat mapping with no `experiment:` key, so it
    does not register and the records citing it report unresolved references.
    Left for a dedicated change when GOAL-P13-001 checkpoints, per
    CORR-20260802-011: the identifiers have 30-35 references across a campaign
    that dispatched two batches on 2026-08-02, and a committed run directory
    carries the identifier.
  substantive_delta: >-
    None. No claim, direction, strength, scope or hypothesis status is created,
    altered or withdrawn, and the claim's conditional status is unchanged.
  status_effects:
    hypothesis_status_changed: false
  supersedes: null
  superseded_by: null
