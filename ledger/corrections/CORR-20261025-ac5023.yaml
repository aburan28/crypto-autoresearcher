# =============================================================================
# CORR-20261025-ac5023 -- H-ICEX-6ca21f: additive citations for the floor that
# HEUR-ICEX-6ca21f-1 states, and for the generic bound on the known-log
# (random) factor-base family the hypothesis's CRT argument concerns.
#
# APPEND-ONLY. ledger/hypotheses/H-ICEX-6ca21f.yaml keeps its statement,
# mechanism, coordinator_prior, predictions, falsification_conditions and
# status (approved, DEC-20261001-36e4fa) byte-for-byte. This record changes no
# status, prediction or criterion; it supplies the published lower bound and
# the generic-group reduction that the hypothesis's structural_ingredients did
# not cite because the papers had only been read at abstract level.
# =============================================================================
correction:
  id: CORR-20261025-ac5023
  recorded_at: '2026-10-25'
  recorded_by: coordinator
  authorizing_decision: DEC-20261025-48232f
  goal_id: GOAL-ICEX-001
  record_type: hypothesis
  record_id: H-ICEX-6ca21f
  field: >-
    structural_ingredients (four citation entries added beside the existing ones, C1-C4) and
    heuristic_assumptions[HEUR-ICEX-6ca21f-1].supporting_results (one entry, S1). One
    correction: one record, one review round.
  prior_value: Quoted per item in items[].prior_value.
  corrected_value: Per item in items[].corrected_value.
  reason: >-
    The 2026-10-24 review (DEC-20261025-48232f) read the full texts of the papers the hypothesis
    cited as "recalled" pointers and found (a) a published lower bound for exactly the ideal
    the hypothesis's G1 backend computes a Groebner basis of, and (b) a generic-group reduction
    showing that the known-log/random-base family behind the CRT argument cannot beat sqrt(p)
    by any generic algorithm either. Both belong in the record's ingredients so that a reader of
    the hypothesis sees the floor is literature-established, not only a design-time heuristic.

  items:
    - id: C1
      field: structural_ingredients (new entry)
      prior_value: >-
        (absent)
      corrected_value: >-
        description: Any S-polynomial-based Groebner computation for S_{m+1}(x_1..x_m, x(aP+bQ)) = 0,
        F(x_1) = ... = F(x_m) = 0 with F | x^q - x of degree d > 2^{m-1} needs at least
        (m d^{m-1})^{1-eps} field operations (Lemma 8, Proposition 9), under semi-normality and
        coefficient-genericness assumptions checked to 25 bits; the cofactor in 1 = T S + sum A_i F(x_i)
        is the Lagrange interpolant over the d^m grid points (§5.2). citation: K. Yokoyama, M. Yasuda,
        Y. Takahashi, J. Kogure, Complexity bounds on Semaev's naive index calculus method for ECDLP,
        J. Math. Cryptol. 14 (2020) 460-485, doi:10.1515/jmc-2019-0029 (KN-LIT-8bf122).
        provenance: retrieved. verified_by: DEC-20261025-48232f (delegated lane, full text read).
        role: published lower bound for the G1 backend's computation; weaker than HEUR-ICEX-6ca21f-1's
        d^m floor and consistent with it.
      basis: [KN-LIT-8bf122 §4.1, §4.1.3, §5.2; DEC-20261025-48232f]
    - id: C2
      field: structural_ingredients (new entry)
      prior_value: >-
        (absent)
      corrected_value: >-
        description: A k-sum solver in a cyclic group gives discrete logarithms in the same time
        (Theorem 2, W. Dai); every generic k-sum algorithm needs Omega(sqrt p) (Corollary 1); the
        k-tree algorithm needs a chain of normal subgroups with efficiently computable quotient maps
        or an order-compatible coordinate (long version §2), which a prime-order E(F_p) lacks.
        citation: D. Wagner, A generalized birthday problem, CRYPTO 2002, LNCS 2442, 288-304; long
        version https://people.eecs.berkeley.edu/~daw/papers/genbday-long.ps (KN-LIT-7a7034).
        provenance: retrieved. verified_by: DEC-20261025-48232f (delegated lane, long version read).
        role: generic bound on the known-log / random factor-base family (Amadori-Pintore-Sala,
        McGuire-Mueller) that the CRT argument of this hypothesis concerns; the random-x control
        of EXP-ICEX-153c34 is an instance of that family.
      basis: [KN-LIT-7a7034 §2, §3; DEC-20261025-48232f]
    - id: C3
      field: structural_ingredients (new entry)
      prior_value: >-
        (absent)
      corrected_value: >-
        description: Random known-log factor base R_j = u_j P + v_j Q with s^m ~ q, disjoint
        m-partition, one Groebner solve of S_m = 0, f_i(X_i) = 0 per attempt, about m^m attempts;
        "We do not claim" an improvement over q^{1/2}. citation: A. Amadori, F. Pintore, M. Sala,
        On the discrete logarithm problem for prime-field elliptic curves, Finite Fields Appl. 51
        (2018) 168-182, doi:10.1016/j.ffa.2018.01.009 (KN-LIT-1e6270). provenance: retrieved.
        verified_by: DEC-20261025-48232f (delegated lane, accepted manuscript read). role: origin of
        the known-log base; its "one relation" trick is unavailable to the interval base of this
        hypothesis (unknown logs) and is bounded by C1 and C2 where it applies.
      basis: [KN-LIT-1e6270 §3, §3.2; DEC-20261025-48232f]
    - id: C4
      field: structural_ingredients (replaces the "pointer only" status of the existing Petit-Kosters-Messeng entry by a verified entry beside it; the existing entry is unchanged)
      prior_value: >-
        "description: Algebraic structure in the factor base (rational-map images, subgroups) is
        what makes Groebner methods useful over prime fields; citation: C. Petit, M. Kosters,
        A. Messeng, PKC 2016; provenance: recalled; verified_by: null; role: pointer only"
      corrected_value: >-
        description: Factor bases F = {L(x) = 0} with L a composition of low-degree maps; the
        smooth-order multiplicative-subgroup/coset base (§3.3) and the isogeny-kernel coset base
        (§3.4); cost P + m! p/(deg L)^{m-1} T + (deg L)^omega, beating generic algorithms only if
        one system costs below p^{1/2-1/m} (§3.2); "not practical at the moment and we do not know
        their asymptotic complexity" (§5); the committee-suggested Groebner version of Semaev's
        split interval system was "intriguingly ... easier to solve than ours" (§5). citation: as
        before, doi:10.1007/978-3-662-49387-8_1 (KN-LIT-9c442f). provenance: retrieved.
        verified_by: DEC-20261025-48232f (delegated lanes, full text read). role: the structured
        prime-field bases this hypothesis's interval base is compared with; the chained
        presentation has the same quotient algebra as the split polynomial (KR-IC-585a96).
      basis: [KN-LIT-9c442f §3.2-3.5, §5; KR-IC-585a96; DEC-20261025-48232f]
    - id: S1
      field: heuristic_assumptions[HEUR-ICEX-6ca21f-1].supporting_results
      prior_value: >-
        []
      corrected_value: >-
        [KN-LIT-8bf122 Lemma 8 / Proposition 9: published lower bound (m d^{m-1})^{1-eps} on the
        S-polynomial Groebner computation of the same ideal, under stated statistical assumptions;
        it is below the d^m floor this heuristic states and does not discharge or falsify it.]
      basis: [KN-LIT-8bf122 §4.1; DEC-20261025-48232f]
  evidence_artifacts:
  - docs/reports/aps-prime-field-review-20261025/report.md
  - docs/reports/aps-prime-field-review-20261025/lanes/aps2018_dissection.md
  - docs/reports/aps-prime-field-review-20261025/lanes/prime_field_barriers.md
  - docs/reports/aps-prime-field-review-20261025/lanes/prior_art_new_ideas.md
