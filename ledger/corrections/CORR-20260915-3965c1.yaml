  nature: >-
    DISCLOSES AN IN-PLACE EDIT OF MERGED RECORDS AND PRESERVES BOTH VALUES.
    Commit 3bf175a2c ("Fix ICPERF descent contract parameters", author "Cursor
    Agent", 2026-09-15T10:36:54Z) revised H-ICPERF-5f038b and
    EXP-ICPERF-025a52 in place AFTER both had merged to main in PR #1197, with
    no correction or amendment record and without bumping the experiment's
    version. AGENTS.md rule 2 (corrections supersede, never overwrite) and the
    CLAUDE.md convention that a frozen protocol changes by additive amendment
    were not followed. This record is the disclosure those rules require: it
    names the fields, the prior values and the corrected values, so a later
    reader sees the change rather than silently inheriting it.

    THE EDIT ITSELF IS RETAINED, NOT REVERTED. Its mathematics is correct and
    load-bearing, and reverting it would restore a protocol that cannot work.

  substance_of_the_edit:
    field: >-
      EXP-ICPERF-025a52 descent_rule.step, grid.target_degree,
      parameters.d_a, and a new stage_a.branching_model; the paired sentences
      of H-ICPERF-5f038b.statement, and a new H-ICPERF-5f038b.branching_model
      (the only added top-level key; verified by diff against origin/main).
    prior_value: >-
      d_a: 4*b; the multiplier a drawn "uniformly at random among b-smooth
      monic polynomials of degree <= d_a"; targets stated only as "a monic
      target t with deg t = d_t > b" with no declared target degree; no
      branching_model on either record.
    corrected_value: >-
      d_a: n - b - 1; the multiplier drawn with degree in the interval
      [n - d_t, d_a]; grid.target_degree: n - 1 with targets required monic
      irreducible; plus an explicit frozen Stage A branching_model (the
      S_L(z) generating-function recurrence for N_j, T_j, M_j, B_j and j*),
      declared not fitted to any Stage B measurement.
    why_the_correction_is_right: >-
      w = (a*t) mod f only reduces when deg(a*t) >= n. Under the prior bound
      d_a = 4*b, a mid-tree target with d_t << n gives deg(a*t) < n, so the
      reduction is a no-op, w = a*t retains the irreducible t as a factor, and
      the acceptance test "largest factor degree strictly less than d_t" can
      never pass -- the descent would not descend. Requiring deg a >= n - d_t
      forces the reduction; d_a = n - b - 1 keeps the interval non-empty for
      every grid cell with d_t >= b + 1. Verified independently by this
      session and, separately, by the PR #1198 reviewer.

  what_this_session_did_about_it:
    - >-
      MERGED rather than force-pushed. The edit arrived on this session's own
      branch after PR #1197 merged; a force-push would have destroyed it. The
      merge commit keeps the other author's checkout valid.
    - >-
      BUMPED EXP-ICPERF-025a52 version 1 -> 2 with an ADDITIVE status_history
      entry citing this record. The v1 entry is unchanged. This exists so a
      later archive receipt cannot bind "v1" ambiguously to two different
      protocols.
    - >-
      DID NOT revert the mathematics, and DID NOT rewrite H-ICPERF-5f038b back
      to its merged text: the corrected statement is the one that matches the
      contract, and restoring the prior text would re-introduce the defect.
      The prior value is preserved here instead, which is what the
      supersession rule asks for.

  status_unchanged: >-
