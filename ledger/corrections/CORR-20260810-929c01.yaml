correction:
  id: CORR-20260810-929c01
  recorded_at: '2026-08-10'
  recorded_by: >-
    coordinator (GOAL-DREG-001 BATCH-005 closure, scheduled coordinator-only
    harness session; worktree branch coord/harness-hourly-20260810-1610, forked
    from origin/main at c022cd2de)
  type: identifier_collision_resolved_against_a_campaign_voiding_its_archive_receipt
  supersedes: []
  corrects:
    - >-
      coordination/goals/GOAL-DREG-001/batches/BATCH-005/archives/TASK-20260731-027/ledger-receipt.json
      (field record_ids, the entry `DEC-20260731-014`; and field
      artifact_sha256, the entries whose digests no longer resolve)
  record_type: archive_receipt
  record_id: TASK-20260731-027
  field: >-
    record_ids[1] = "DEC-20260731-014", together with the artifact_sha256 map
    that binds this receipt to content. NEITHER THIS RECEIPT NOR THE COMMITTED
    ledger/decisions/DEC-20260731-014.yaml IS EDITED BY THIS CORRECTION. Both
    are immutable. This record documents what happened to them and names the
    superseding decision.

  prior_value: >-
    The BATCH-005 ledger receipt declares record_ids
    [EV-DREG-008, DEC-20260731-014, GOAL-DREG-001], with commit_sha null,
    parent_sha null, and verification.status "pending_post_commit". Its
    artifact_sha256 map declares five paths, including
    "ledger/decisions/DEC-20260731-014.yaml":
    "6093f111f4b1f7eef4c5da8e067a9f8e8cb14984c1885cbdff88414ba1a0a81b". Read at
    face value today, that receipt says GOAL-DREG-001 BATCH-005 was closed by a
    decision that, when opened, turns out to belong to GOAL-ECDLP-001.

  corrected_value: >-
    THE RECEIPT WAS AUTHORED CORRECTLY AND WAS LATER VOIDED BY AN IDENTIFIER
    COLLISION RESOLVED IN ANOTHER CAMPAIGN'S FAVOUR. IT IS NOT EVIDENCE THAT THE
    DREG DECISION WAS NEVER WRITTEN.

    Two concurrent campaigns independently minted the same legacy three-digit
    identifier DEC-20260731-014 on 2026-07-31 for different records --
    GOAL-DREG-001's BATCH-005 closure, and GOAL-ECDLP-001's BATCH-021 residual-
    control repair approval. This is precisely the failure mode CLAUDE.md's
    ID-minting rule describes: every concurrent worktree asked committed state
    for the next free number, got the same answer, and minted the same
    identifier for different records, discovered only at merge time when both
    were already immutable.

    The path history, established by hashing every revision of
    ledger/decisions/DEC-20260731-014.yaml across all refs rather than by
    reading commit messages or dates:
      - 98fa35db18e4 (2026-07-31)  content = GOAL-ECDLP-001 / BATCH-021
      - 91e404845e7f (2026-07-31)  content = GOAL-DREG-001 / BATCH-005
      - 4692de41f951 (2026-07-31)  content = GOAL-DREG-001 / BATCH-005
        <- sha256 6093f111...a0a81b, EXACTLY the digest the BATCH-005 receipt
           declares for this path; this commit IS reachable from origin/main
      - 3b342d3c55e5 (2026-08-03)  content = GOAL-ECDLP-001 / BATCH-021
        <- "Merge origin/main into codex/reconcile-ecdlp-b30"; the collision is
           resolved in favour of the ECDLP record and the DREG decision ceases
           to exist at its own path
    The DREG closure was therefore authored, committed, and reachable, and was
    then displaced. The receipt's digest is the proof of authorship: a receipt
    cannot declare the sha256 of a file that was never written.

    THE COLLISION IS NOT REPAIRED BY RENAMING ANYTHING. Per AGENTS.md core rule
    15, an identifier remap is a last resort and never a repair, because
    renaming a record that a completed archive names in its binding fields
    breaks that archive permanently. ledger/decisions/DEC-20260731-014.yaml
    keeps its id and its GOAL-ECDLP-001 content. GOAL-DREG-001's closure is
    re-issued under the freshly minted, collision-free id DEC-20260810-b12d0a,
    which restates the recovered 2026-07-31 closure in substance and names this
    correction in its evidence_refs.

  collateral_damage_recorded_not_repaired: >-
    THREE OF THE RECEIPT'S FIVE DECLARED DIGESTS RESOLVE TO NOTHING, AND THAT IS
    REPORTED RATHER THAN EXPLAINED AWAY. Verified by hashing the live tree and
    every committed revision of each path:
      - ledger/evidence/EV-DREG-008.yaml                     MATCHES live tree
      - ledger/decisions/DEC-20260731-014.yaml               matches only the
        historical blob at 4692de41f951 (see above)
      - .../TASK-20260731-026/red_team_report.yaml           NO MATCH in any of
        the 1 committed revisions of that path
      - .../TASK-20260731-026/falsification_review.md        NO MATCH in any of
        the 1 committed revisions of that path
      - ledger/goals/GOAL-DREG-001.yaml                      NO MATCH (this file
        has been legitimately edited many times since; a mutable goal head
        drifting away from a receipt digest is expected, not anomalous)
    The two review artifacts ARE present and committed and DO record verdict
    PASS (id RT-20260731-013, task_id TASK-20260731-026), read directly from the
    artifact. What cannot be established is that their committed bytes are the
    bytes the receipt hashed -- consistent with commit_sha null and
    "pending_post_commit": the archive task appears to have hashed a working
    tree that was never committed at those paths under that task.

  consequence_for_what_may_be_claimed: >-
    BATCH-005 WILL NEVER HAVE A POST-COMMIT-VERIFIED LEDGER ARCHIVE, because the
    receipt that would have carried the verification is immutable and carries a
    null commit_sha. DEC-20260810-b12d0a therefore rests on the artifacts as
    committed today -- which were opened and read, not summarized -- and NOT on
    a verified archive receipt. It says so in its own `limitations`. This is
    weaker than a verified archive and is recorded as such.

    Nothing here changes any measurement. EV-DREG-008 is byte-identical to the
    evidence the original archive bound, its digest matches, and the raw 17947
    headline remains quarantined_confounded. H-DREG-001 does not move.

  what_this_correction_is_not: >-
    It opens no batch, authorizes no measurement, moves no hypothesis status,
    files no evidence, promotes no knowledge entry, approves no experiment, and
    closes no goal. It edits no immutable record. It is a durable explanation of
    a voided receipt, attached to the fresh decision that replaces the lost one.

  refs:
    - DEC-20260810-b12d0a
    - EV-DREG-008
    - GOAL-DREG-001
    - TASK-20260731-027
