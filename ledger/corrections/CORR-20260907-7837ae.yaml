    identifier collisions ("already published on origin/main with different
    content") and blocked every further commit on this branch via its
    pre-commit hook until resolved.
  corrected_value: >-
    Per CLAUDE.md's collision-handling rule ("Identifiers are immutable and
    never reused... reissue this record under the next free id... Do not
    resolve this by choosing a side"), this branch's copy is reissued under
    non-colliding names, with NO scientific content, numeric result, or
    conclusion changed anywhere -- only path/filename/run-ID strings:
    RUN-ECDLP-bbb42f-1 -> RUN-ECDLP-bbb42f-7 (and -2->-8, -3->-9, -4->-10,
