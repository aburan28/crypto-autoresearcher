    driver/isogeny_transfer_census.py ->
    driver/isogeny_transfer_census_reissued.py; driver/predicates.py ->
    driver/predicates_reissued.py; driver/rrg_null.py ->
    driver/rrg_null_reissued.py; implementation.md ->
    implementation_reissued.md; results/summary.json ->
    results/summary_reissued.json; results/seed_env_manifest.yaml ->
    results/seed_env_manifest_reissued.yaml. Every internal cross-reference
    (Python imports, `command.txt` invocations, manifest.yaml artifact
    paths, prose mentions of the renamed files in implementation_reissued.md
    and the driver modules) was mechanically updated to the new names by a
    single reviewed script (no hand-editing, to rule out a transcription
    slip); `tools/check_merge_hygiene.py --base origin/main` now reports
    zero identifier collisions, and every touched JSON/YAML file was
    independently re-parsed after the rename to confirm no syntax was
    broken by the substitution. `origin/main`'s version of
    EXP-ECDLP-bbb42f (dfa3c2d31) is left completely untouched by this
    correction; this branch does not adjudicate which of the two
    independent executions is scientifically preferred -- that is a
