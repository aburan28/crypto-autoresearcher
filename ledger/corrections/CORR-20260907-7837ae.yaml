    isogeny_transfer_census.py, predicates.py, rrg_null.py,
    implementation.md, results/summary.json,
    results/seed_env_manifest.yaml) -- a collision this experiment's
    specification made structurally likely, since it names required
    artifacts by fixed filename rather than by a per-dispatch token, and
    both dispatches independently used sequential ordinals 1-6 for six
    declared runs rather than random or dispatch-scoped suffixes.
