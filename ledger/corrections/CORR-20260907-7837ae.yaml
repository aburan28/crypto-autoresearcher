  reason: >-
    Two independent Executor dispatches against the same frozen contract
    produced colliding path-level identifiers, discovered only once this
    branch fetched a `main` that had since absorbed the other execution.
    This is exactly the "hidden execution location" / concurrent-worktree
    identifier-collision hazard CLAUDE.md's Concurrency section describes
    for randomly-tokenized IDs, occurring here instead at the run-ordinal /
    fixed-filename level because this experiment's specification prescribes
    literal artifact filenames rather than per-dispatch tokens. Recorded as
    a correction rather than resolved silently because AGENTS.md rule 2
    treats a committed run record as immutable; renaming a colliding path
    is a genuine change to what is citable at that name and must be
    disclosed, not just quietly patched.
