# =============================================================================
# CORR-20260922-0d365e -- IDEA-20260922-261004 carries the same negation
# double-count as IDEA-20260922-6cf862 (CORR-20260922-81aeab). The proposal is
# NOT edited and NOT withdrawn.
#
# WHY THIS RECORD EXISTS IN THIS FORM, AND WHAT WAS UNDONE TO MAKE IT.
# 261004 is a filed record on main (merged in PR #1371). On 2026-09-22 an
# external autofix agent pushed commit 3dbecc910 to the follow-up branch, which
# EDITED 261004 IN PLACE to apply the correction below. That edit was sound
# arithmetic and the wrong mechanism: AGENTS.md rule 2 makes ledger records
# immutable, and an in-place edit to a record already on main creates a silent
# divergence between main's copy and the branch's copy of the same immutable
# identifier. The branch content has been restored to the as-filed version and
# the correction moved here, where both values are recorded side by side.
# The autofix commit remains in history; nothing was rewritten.
# =============================================================================
correction:
  id: CORR-20260922-0d365e
  recorded_at: '2026-09-22'
  record_type: candidate
  record_id: IDEA-20260922-261004
  related_corrections: [CORR-20260922-81aeab]

  field: >-
    Heuristic H-261004-2 (the rho baseline convention) and
    target_complexity.best_known (the K-233 worked example derived from it).

  prior_value: >-
    H-261004-2: "RHO BASELINE CONVENTION, identical to IDEA-20260922-6cf862's
    H-2: 0.886 sqrt(r)/sqrt(2k) group operations, charged under van
    Oorschot-Wiener, calibrated against KN-LIT-096's 2^60.9 for ECC2K-130
    before use."
    target_complexity.best_known: "0.886 sqrt(r)/sqrt(2n). K-233 at r ~ 2^232:
    116 - 0.175 - log2 sqrt(466) = 116 - 0.175 - 4.43 = 2^111.4."

  corrected_value: >-
    H-261004-2: 0.886 sqrt(r)/sqrt(k), equivalently sqrt(pi r/(4k)). The
    constant 0.886 = sqrt(pi/4) is already the negation-only row, so the
    Frobenius gain over it is sqrt(k), not sqrt(2k).
    target_complexity.best_known: K-233 at log2 r = 231:
    115.5 - 0.175 - log2 sqrt(233) = 115.5 - 0.175 - 3.93 = 2^111.4.
    THE HEADLINE FIGURE IS UNCHANGED, AND THAT IS THE POINT. The prior
    derivation reached the same 2^111.4 by pairing the surplus sqrt(2) with
    r ~ 2^232 when log2 r for K-233 is 231 -- two errors of opposite sign,
    partly cancelling. A correct figure reached by a wrong route is the
    hardest kind of defect to notice, and it is recorded here precisely
    because the number gives no warning.

  reason: >-
    Raised as a medium-severity finding by Cursor Bugbot on PR #1371,
    including the observation about the cancelling r ~ 2^232 / log2 r = 231
    substitution. Verified independently here: 231/2 - 0.175 - 0.5*log2(233)
    = 111.393. The convention question is settled by the same internal
    numerical evidence recorded in CORR-20260922-81aeab -- IDEA-20260915-8fe0ef's
    own n = 17 figures, 227 -> 55, ratio 4.127 = sqrt(17), not sqrt(34) = 5.831,
    as derived independently by IDEA-20260922-1a081a.

  evidence_artifacts:
    - ledger/corrections/CORR-20260922-81aeab.yaml
    - ledger/proposals/IDEA-20260922-1a081a.yaml
    - ledger/proposals/IDEA-20260915-8fe0ef.yaml
    - knowledge/literature/KN-LIT-096.md
    - https://github.com/aburan28/crypto-autoresearcher/pull/1371

  scope_note: >-
    This correction records an arithmetic and labelling defect in a `proposed`,
    unapproved record. It changes no hypothesis status, approves nothing,
    promotes nothing, and is not a Coordinator decision. No run, evidence or
    goal record depends on the corrected quantity, because no experiment has
    been approved under RQ-BINSTD-b6f698.
