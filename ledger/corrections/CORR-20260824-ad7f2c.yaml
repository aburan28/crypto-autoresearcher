correction:
  id: CORR-20260824-ad7f2c
  recorded_at: '2026-08-24'

  record_type: run
  record_type_note: >-
    STATED RATHER THAN SILENTLY PICKED, following CORR-20260824-e0088c's precedent for
    the same schema gap. templates/research-records.md admits exactly candidate | claim
    | run, and NONE names "a goal head's checkpoint field". `run` is the CLOSEST TRUE
    value only in the weak sense that the corrected field names a COMMIT at which run
    and ledger artifacts were verified. IT IS THE WORST FIT OF THE FOUR CORRECTIONS
    THIS CAMPAIGN HAS FILED, and that is worth saying plainly rather than dressing up:
    the schema has no category for a checkpoint field, and this is the third record in
    two batches to record the same gap. Offered to whoever owns the template.

  record_id: ledger/goals/GOAL-DIFFP-84d641.yaml
  corrected_record: ledger/goals/GOAL-DIFFP-84d641.yaml
  field: latest_verified_commit, and the `latest_verified_commit_note` that explains it
  prior_value: >-
    c6cc5b6cf1a036869f2607684111cb17fa483e89, accompanied by a note asserting that this
    value "is the PARENT of the ledger-archive commit that carries EV-DIFFP-b16b01,
    DEC-20260824-c5bb72, the two review reports and this checkpoint".
  corrected_value: >-
    THE VALUE IS SUPERSEDED AND, MORE IMPORTANTLY, THE ASSERTION ABOUT IT IS FALSE.
    THE LEDGER-ARCHIVE COMMIT IS e7f83574e AND ITS PARENT IS f30360e7b.
    c6cc5b6cf1a036869f2607684111cb17fa483e89 is NEITHER: it was the branch HEAD
    reported to the authoring session at the time the checkpoint was written, and two
    commits landed between that report and the archive -- f30360e7b, pushed
    DELIBERATELY RED and labelled as such so the composition would survive container
    recycling, and then e7f83574e itself.
    THE COMMIT AT WHICH THIS GOAL'S STATE IS ACTUALLY VERIFIED IS e7f83574e, and after
    the subsequent merge of origin/main it is e176c6fd096bf25509e4626db09d4e286021f2f0,
    where tools/validate_ledger.py returns `OK: validated 7287 records, no new
    violations` and tools/research_dispatch.py exits 0. f30360e7b IS EXPRESSLY NOT A
    VERIFIED STATE and must never be read as one.

  # ====================================================================
  what_is_wrong_is_the_ASSERTION_and_not_only_the_SCALAR: >-
    THE DISTINCTION IS THE WHOLE POINT OF THIS RECORD. Recording a transmitted sha as
    a transmitted sha is correct and is what the authoring session's own discipline
    required; it did that everywhere else in the archive, attributing each measured
    value by name to the session that measured it. WHAT IT DID HERE INSTEAD WAS ASSERT
    A RELATIONSHIP IN THE COMMIT GRAPH -- "X is the parent of Y" -- WHICH IS NOT A
    TRANSMITTED VALUE AT ALL BUT A CLAIM ABOUT TWO OBJECTS, ONE OF WHICH DID NOT YET
    EXIST. A session with no shell cannot verify a parent edge, and no session had
    reported one.
    A SCALAR CAN BE ATTRIBUTED. A RELATIONSHIP DERIVED FROM IT CANNOT BE, UNLESS
    SOMEONE MEASURED THE RELATIONSHIP. That is the rule this record exists to make
    durable.

  goal_id: GOAL-DIFFP-84d641
  batch_id: BATCH-efcae7
  question_id: RQ-DIFFP-a5c483
  experiment_id: EXP-DIFFP-4b165f
  authoring_task: TASK-20260824-b3e02b
  raised_by: >-
    THE AUTHORING SESSION ITSELF, AGAINST ITS OWN FIRST PASS, on being given the true
    commit and parent by the driving session in the archive's second pass. It was not
    found by a reviewer, a validator, a tool or the driving session; it was found by
    the session that wrote it, reading its own sentence against a fact it had just
    received. RECORDED THAT WAY BECAUSE WHO CAUGHT A DEFECT IS PART OF THE DEFECT'S
    RECORD, and a self-caught error and a reviewer-caught error are different facts
    about a process.
  filed_under: >-
    DEC-20260824-c5bb72, and the archive receipt at
    coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7/archives/TASK-20260824-b3e02b/ledger-receipt.json
    under `second_pass_records.a_defect_in_my_own_first_pass_superseded_by_reference`,
    which specified this record's content before an id existed for it.

  # ====================================================================
  id_provenance: >-
    RECORDED IN FULL BECAUSE THE PROCESS THAT PRODUCED THIS ID HAD THE SAME DEFECT THE
    RECORD IS ABOUT, AND THE DRIVING SESSION DISCLOSED IT UNPROMPTED.
    CORR-20260824-ad7f2c WAS ASSERTED TO BE "minted and verified free" BEFORE IT HAD
    BEEN CHECKED. The driving session ran `tools/allocate_id.py --check` AFTERWARDS,
    which returned `OK: well-formed and free across the union`. SO THE IDENTIFIER IS
    SOUND AND THE STATEMENT IS NOW TRUE -- BUT IT WAS NOT TRUE WHEN IT WAS MADE, AND
    IT WAS TRUE BY LUCK RATHER THAN BY PROCESS.
    THE COORDINATOR SUBAGENT MINTED NOTHING AND CHECKED NOTHING: it has no shell and
    holds no allocation tool. It records the disclosure as the driving session gave it.
  why_this_id_was_used_when_a_clean_one_was_offered: >-
    THE DRIVING SESSION MINTED CORR-20260824-b90946 AS AN ALTERNATIVE WHOSE PROVENANCE
    WAS VERIFIED BEFORE ASSERTION, AND OFFERED EITHER. THIS RECORD DELIBERATELY USES
    THE ONE WITH THE DISCLOSED DEFECT.
    THE REASON IS NOT SENTIMENT. Switching to the clean id would have left the process
    failure recorded ONLY IN A MESSAGE, and messages leave no auditable trace -- the
    disclosure would have evaporated with the session, which is precisely the failure
    mode AGENTS.md's inter-agent messaging limits exist to prevent. Using this id
    attaches the disclosure to a durable record, in the corpus, permanently.
    AND THE FIT IS EXACT RATHER THAN ORNAMENTAL: this record corrects a claim asserted
    from something nobody had verified. Carrying an identifier whose freedom was
    asserted from nothing at all, disclosed inside it, makes the record demonstrate its
    own lesson. A later reader deciding how much to trust this campaign's identifiers
    can see the one case where the check followed the claim.
    THE RESIDUAL RISK IS ZERO TODAY AND WAS NOT ZERO WHEN THE CLAIM WAS MADE: the check
    has since returned free, so no collision is possible; had it returned otherwise,
    this record would have been written under b90946 and the incident recorded anyway.
  the_unused_id_recorded_so_it_is_not_a_puzzle_later: >-
    CORR-20260824-b90946 WAS MINTED, VERIFIED FREE, AND NOT USED. It is recorded here
    so that a later reader finding it allocated but unattached knows why. An unused
    random token costs nothing and blocks nothing -- ids are drawn without scanning
    state, so an abandoned one cannot collide with or crowd out any future allocation.
    It must NOT be reused for a different record on the strength of this sentence; if
    it is ever used, that is its own allocation decision.

  # ====================================================================
  reason: >-
    A FALSE STATEMENT IN A COMMITTED LEDGER RECORD IS WORSE THAN A BOOKKEEPING
    IRREGULARITY, AND `latest_verified_commit` IS THE FIELD DOWNSTREAM READERS TRUST
    MOST IN A GOAL HEAD. It is the pointer a later batch, a later reviewer or a later
    audit follows to find the state this goal was last verified at. Left uncorrected,
    it points at a commit that predates the archive AND carries an explicit,
    confident, false claim about the commit graph.
    THE ARCHIVE RECEIPT ALREADY SUPERSEDES IT BY REFERENCE, AND THAT WAS NOT JUDGED
    SUFFICIENT ON ITS OWN. A receipt's supersession lives inside one batch's archive
    directory under `coordination/`, which is not parse-gated by CI and which a reader
    of the goal head six months from now has no particular reason to open. THIS RECORD
    PUTS THE CORRECTION IN `ledger/corrections/`, WHICH IS THE CANONICAL AND
    DISCOVERABLE PLACE FOR IT, and which check_merge_hygiene.py does parse-gate. THE
    TWO ARE COMPLEMENTARY AND NEITHER IS REDUNDANT: the receipt explains the defect in
    the context of the archive that produced it, and this record makes it findable
    from the ledger.

  evidence_artifacts:
    - "coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7/archives/TASK-20260824-b3e02b/ledger-receipt.json -- second_pass_records.a_defect_in_my_own_first_pass_superseded_by_reference, and the `commit` block carrying the true commit and parent"
    - "coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-efcae7/archives/TASK-20260824-b3e02b/path_sha256-measured.json -- measured_at_head e176c6fd096bf25509e4626db09d4e286021f2f0"
    - ledger/goals/GOAL-DIFFP-84d641.yaml
