  field: EV-FBST-8949fc OBS-3, coverage-spread statistics
  prior_value: >-
    "Spread (max-min coverage within a group): median 0.031, mean 0.045, max 0.238 (at
    N=1049, B=24)." Stated without specifying whether this is computed over all 240
    smallest_x same-N groups or only over the groups that actually differed.
  corrected_value: >-
    COMPUTED OVER THE 212 DIFFERING GROUPS, NOT ALL 240 -- CORRECT ONCE THAT DENOMINATOR
    IS IDENTIFIED, BUT UNDOCUMENTED. Independently recomputed by the validator: over all
    240 smallest_x groups, median 0.024 / mean 0.040 (NOT matching OBS-3). Tracing the
    discrepancy: 28 of the 240 groups happen to coincide despite smallest_x not being
    guaranteed invariant, and OBS-3's figures are computed over exactly the 212 groups
    that differed. Recomputing over that 212-group subset reproduces median 0.0309, mean
    0.045, max 0.2383 EXACTLY. The numbers are correct; the record simply did not state
    which denominator (240 vs 212) it used, which cost the validator real verification
    time to trace. Restated precisely: "median 0.031, mean 0.045, max 0.238, computed over
    the 212 of 240 same-N smallest_x groups that showed any coverage difference; the 28
    coincidentally-identical groups are excluded from this statistic (though counted in
    the 212/240 rate itself)."

  additional_corrections:
    - field: >-
        specification.yaml `controls:` section, "SHUFFLED-BASE NULL" -- "for each
        structured construction, a size-matched base drawn uniformly from the same
        rational points"
      prior_value: >-
        Specified a null paired 1:1 with each structured construction (one shuffled
        control per structured construction tested).
      corrected_value: >-
        NOT IMPLEMENTED AS SPECIFIED. `code/factorbase_stats.py` and
        `code/deepen_same_N.py` implement a single generic `uniform_random` construction,
        not a separate shuffled null instantiated per structured construction. This does
        NOT undermine the headline result -- the exact-N grouping test (independently
        confirmed by the validator to show precisely zero variance for the three
        non-curve-reading constructions, across 848 groups in run 001 and 280 curves in
        run 002) is a stronger, exact disentangling mechanism than a shuffled-base null
        would have been, and the result rests on that test, not on the unimplemented one.
        But the specified control as literally written was not what was built, and that
        gap was not called out in specification.yaml's `amendment_v2` or in either
        evidence record until now.

  reason: >-
    Neither issue changes the substance of what was found; both are the kind of
    unstated-methodology gap that costs an independent reviewer real time to trace (as
    happened here) and should be closed once identified rather than left for the next
    reader to rediscover.

  evidence_artifacts:
