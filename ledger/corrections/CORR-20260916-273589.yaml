correction:
  id: CORR-20260916-273589
  recorded_at: '2026-09-16'
  recorded_by: coordinator
  goal_id: GOAL-SEMBIN-5078bc
  batch_id: null
  produced_by: top-level coordinator session, cursor/semaev-2015-audit-program-5b8b
  archived_by: TASK-20260916-3c1a7e
  corrects:
    - H-SEMBIN-c59e50 (attribution language only; superseded, NOT edited)
  discharges:
    recommendation_from: DEC-20260913-8d19e5
    which: >-
      Its QUESTION 4 recommendation, which states the indicated change "is an ATTRIBUTION
      correction, not a novelty downgrade, and it is the top-level Coordinator's to make".
      This record makes it. The recommendation had been outstanding since 2026-09-13 and was
      re-recorded as deliberately-not-targeted by DEC-20260915-94855e, which correctly
      declined to make it under a different goal.
  nature: >-
    A PRIORITY SENTENCE IS TOO NARROW. H-SEMBIN-c59e50 states that "the m! is removable by a
    PUBLISHED device: Galbraith-Gebregiyorgis 2014/806 section 4.2 coset-typed factor bases
    F_i = {P : x(P) in V + v_i}", and elsewhere attributes the accounting to
    "Galbraith-Gebregiyorgis's own accounting".

    AS A STATEMENT OF WHERE THIS PROGRAM READ THE DEVICE, THAT IS ACCURATE AND PROPERLY
    PROVENANCED. The program did read it there: KN-LIT-439 is the read record of ePrint
    2014/806, verified under TASK-20260913-6519c9. Nothing about the mechanism, the
    arithmetic, or the (m-1)!-not-m! accounting that record so carefully separates is
    affected.

    AS A PRIORITY STATEMENT IT IS TOO NARROW. The construction and its 1/d! accounting are
    present in the frozen bytes of Nagao ePrint 2013/548 Section 7 (pages 4-5, footnote 3),
    read in full and recorded as KN-LIT-ebd657 under TASK-20260913-0188bf. That paper does
    not claim the idea: it credits Diem (2009) and Matsuo (2005/2006, unpublished). So the
    device is older than this hypothesis's mechanism lane assumed, and it is not Nagao's
    either.
  corrected_values:
    attribution_chain_as_now_supported: >-
      READ BY THIS PROGRAM IN: Galbraith-Gebregiyorgis ePrint 2014/806 section 4.2
      (KN-LIT-439, verified TASK-20260913-6519c9). PRESENT EARLIER IN: Nagao ePrint 2013/548
      Section 7, in frozen bytes with a sha256 sidecar, including the disjointness recipe and
      the 1/d! accounting (KN-LIT-ebd657, verified TASK-20260913-0188bf). ATTRIBUTED BY THAT
      PAPER TO: Diem (2009) and Matsuo (2005/2006, unpublished). ALSO RELEVANT: Nagao ePrint
      2015/984 Section 7 asserts that 2014/806 "recently re-discovered" the construction --
      that is one author's assertion about his own earlier work and is NOT a checked reading
      (DEC-20260913-8d19e5).
    what_the_hypothesis_should_be_read_as_saying: >-
      That the m!-removing device is PUBLISHED and therefore not this program's invention --
      which is the load-bearing content of the sentence and is unaffected. The specific
      naming of 2014/806 as its source should be read as this program's reading provenance,
      not as a priority claim.
  scope_point_the_priority_question_should_not_swallow: >-
    2013/548's OWN DLP statement built on the coset family -- its Proposition 5, page 5, which
    is a DIFFERENT proposition from the Proposition 5 of 2015/984 that GOAL-SEMBIN-fcb7a2
    audits -- is restricted to extension fields F_{p^n} with log p = O((ng)^2), the
    LARGE-characteristic Diem regime. 2015/984's Theorem 1 is small-characteristic with
    F_{2^n} as its headline, and H-SEMBIN-c59e50 lives in the small-characteristic setting.
    The coset CONSTRUCTION is shared; the complexity conclusion drawn from it in 2013/548 is
    not the conclusion drawn in the small-characteristic regime. An attribution correction
    about the construction therefore carries no complexity claim across regimes, and this
    record makes none.
  why_this_is_not_a_novelty_downgrade: >-
    STATED EXPLICITLY BECAUSE THE CONSERVATIVE-LOOKING MOVE HERE WOULD BE THE WRONG ONE.
    H-SEMBIN-c59e50 carries its own novelty-downgrade condition, and that condition requires
    prior work which composes a typed factor base with an auxiliary-variable presentation AND
    DERIVES THE DEGREE CONSEQUENCE. 2013/548 Section 7 composes the coset family with a
    Weil-descent system in the large-characteristic Diem regime and derives a degree bound of
    the form <= Const_1^d. It derives NO first-fall-degree consequence and says nothing about
    a chained presentation. The condition is therefore not triggered.
    Downgrading novelty anyway, on the general feeling that the device turned out to be older
    than assumed, would be a closure not supported by the reading -- and premature closure is
    a failure mode symmetric with overclaiming (docs/inventor-protocol.md). The honest change
    is exactly the narrow one made here.
  how_the_error_was_made: >-
    The hypothesis was authored from the source this program had actually read, and named it.
    That is the right habit; what was missing is the distinction between "where we read this"
    and "where this comes from", which are different claims that a single citation cannot
    carry. The upstream Nagao papers were unread pointers at the time and were frozen and read
    only later, under TASK-20260913-0188bf.
  how_it_was_found: >-
    DEC-20260913-8d19e5 found it while reading the two frozen upstream Nagao papers, and
    recommended the change rather than making it, correctly, since a hypothesis under one goal
    is not a read task's to amend.
  why_the_record_is_not_edited: >-
    H-SEMBIN-c59e50 is committed, immutable, and already at status `weakened`. Its attribution
    sentence is SUPERSEDED by this record and stays as written; a later reader consults both.
    Its status is NOT changed here -- this record touches attribution only, and a correction
    that quietly moved a status would be doing two things under one heading.
  consequence: >-
    No number, measurement, cost estimate, or status changes. The (m-1)!-versus-m! accounting
    that H-SEMBIN-c59e50 is careful about, and its finding that the collapse is structural
    rather than arithmetic, stand entirely untouched. What changes is that a reader asking
    "whose device is this" is no longer pointed at a single 2014 paper as though it were the
    origin.
  forward_guidance:
    - >-
      SEPARATE "WHERE WE READ IT" FROM "WHERE IT COMES FROM". A citation answers the first
      question. The second needs the cited work's own attributions to have been read, and a
      record should say which of the two it is asserting when the distinction could matter --
      as it does for anything described as a PUBLISHED device.
    - >-
      A DEVICE FOUND TO BE OLDER THAN ASSUMED IS NOT AUTOMATICALLY A NOVELTY DOWNGRADE. Check
      the record's own declared downgrade condition against what the earlier work actually
      derives. Here the earlier work has the construction and not the consequence, which is
      the whole distinction the condition was written to capture.
  what_this_correction_does_not_assert:
    - >-
      NOT that H-SEMBIN-c59e50's mechanism, arithmetic, or conclusions are wrong. It corrects
      an attribution and nothing else.
    - >-
      NOT a novelty downgrade, and not a status change. The hypothesis remains `weakened` for
      the reasons already recorded, which are unrelated to attribution.
    - >-
      NOT that the priority question is settled. It is not, and DEC-20260913-8d19e5 says what
      remains open: the DATE at which 2013/548 Section 7 first appeared is not established,
      because two earlier revisions of that paper are not frozen and only the last is; whether
      2015/984's "recently re-discovered by [5]" is accurate is not established; and the
      Matsuo attribution is unverifiable in principle, being to unpublished work. What would
      settle the remaining part is recovering an earlier revision of 2013/548 from outside
      ePrint, and its unavailability would then itself be a disclosed limit.
    - >-
      NOT a claim that any of these papers' complexity conclusions transfer between
      characteristic regimes. See the scope point above.
  citations:
    - claim: >-
        The coset-typed factor base construction, its disjointness recipe and its 1/d!
        accounting are present in Nagao ePrint 2013/548 Section 7, which credits Diem (2009)
        and Matsuo rather than claiming the idea.
      source: knowledge/literature/KN-LIT-ebd657.md (frozen bytes at inputs/NAGAO-2013-548/)
      provenance: kb
      verified_by: >-
        TASK-20260913-0188bf, which opened and read the frozen paper in full; recorded in the
        committed DEC-20260913-8d19e5. This Coordinator did not re-read 2013/548 for this
        correction and relies on that read record.
    - claim: >-
        This program read the device in Galbraith-Gebregiyorgis ePrint 2014/806 section 4.2,
        which is what H-SEMBIN-c59e50's sentence accurately records as its source.
      source: knowledge/literature/KN-LIT-439.md
      provenance: kb
      verified_by: TASK-20260913-6519c9
    - claim: >-
        The recommendation this record discharges, its finding that the novelty-downgrade
        condition is NOT triggered, and the residual open parts of the priority question.
      source: ledger/decisions/DEC-20260913-8d19e5.yaml
      provenance: internal
      verified_by: coordinator, this session, which read the record in full.
