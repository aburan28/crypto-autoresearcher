      prior_value: >-
        Recording the returned run_child record covers every capped child on
        every branch on which it is created, by construction, and closes L-1.
      corrected_value: >-
        It covers, by construction, every created child on every path on
        which the frozen run_child RETURNS and the returned record carries
        the pair (successor census P-8, P-10..P-13), and it closes L-1 for a
        raise in the CALLER after run_child returned (census L-1 as carried,
        md 659-661). It does NOT cover:
        - P-14: a raise inside _run_child_locked after fork (os.read 214,
          os.wait4 223 / 230 / 244, the go-byte os.write 236); the frozen
          function has no explicit raise, but these operating-system calls
          can raise, and on 230, 236 and 244 the pair set at 227 is in the
          record the raise discards;
        - P-15: a raise in _perf_read (141, called at 281) after the child
          was reaped, reachable only at v2_driver.py:166 where
          count_instructions defaults to true; the pair set at 227 is
          discarded;
        - P-7: a child-side failure before setrlimit (188-191, swallowed at
          206; exit 99), for which run_child returns a record whose
          child_rlimit_report is the empty string and which carries no pair.
        On P-14 and P-15, RL-1 (c) as worded derives child_created from the
        returned record, of which there is none, so it records child_created
        false for a created child (census L-6). On P-7, whether RL-1 (c)'s
        "carries child_rlimit_report" is a key-presence test is unstated
        (census L-7). The docstring "never raises for child failures" (151)
        holds for failures the child reports through its pipe, not for
        parent-side raises.
      consequence: >-
