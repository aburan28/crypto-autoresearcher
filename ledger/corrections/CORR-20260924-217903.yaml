        defines child_created by key presence or a positive pid (RK-1 (a),
        (b)), and classifies every created child by whether line 227
        executed (RK-1 (c)). No ruling of DEC-20260924-650068 on readbackcover
        changes: readbackcover stays not approvable as written, for the
        reasons given there.
