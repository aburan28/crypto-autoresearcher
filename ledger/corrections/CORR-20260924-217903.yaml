# state that recording the record the frozen v2_solver.run_child returns
# covers every capped child "on every branch" "by construction" and "closes"
# readbackcover's L-1 (a frozen function that raises after its child ran).
# The successor census TASK-20260924-cab04e (archived by TASK-20260924-ddfb69)
# found paths on which the frozen run_child RAISES after fork (P-14; P-15 at
# v2_driver.py:166), so no record is returned, and a created-child path with
# an empty report and no pair (P-7). On those paths RL-1 as worded records no
# pair, and on the raise paths it records child_created false for a created
# child. Ruled in DEC-20260924-a789e1. WRITE-ONCE. Archived by
# TASK-20260924-1ae107.
# =============================================================================
