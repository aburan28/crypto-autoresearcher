      field: DEC-20260922-5796b8 next_actions[2], the proposed KN-FIND sentence
      prior_value: >-
        "On successful review, promote to a KN-FIND entry: the availability of
        the Frobenius-orbit factor base is decided by ord_n(q) alone, and it is
        unavailable at the ECC2K-130 and K-163 degrees."
      corrected_value: >-
        NOT ADOPTED. Adopting it as written would fire tripwire T2 of
        REVIEW-FROB-20260923-458763. It lacks the linear-F_V qualifier; it is
        false inside the linear family (target_table.json records available: true
        at (2,131) and (2,163), l' = n - 1: the pi-quotient there is a net loss,
        not unavailable); "ord_n(q) alone" fails for composite n or p | n, for
        curves with a model over a proper subfield of F_q, for the null object,
        and for the cost-model dependence of the trade; and it carries no m
        range, cost model or constant_factor qualifier. The promoted entry is
        KN-FIND-b9a41d, with the scoped wording DEC-20260923-e6cd5d sets out.
      found_by: TASK-20260923-33a48b S1, PTM-4, PTM-5.

    - id: D2
      field: DEC-20260922-5796b8 summary
      prior_value: >-
        "The factor-base half of RQ-FROB-7d8dd4 is answered: the Frobenius-orbit
        gain in a Gaudry/Diem factor base is exactly n and never more, it is
        available only on the coarse dimension lattice cut by the divisors of
        T^n - 1, and at the ECC2K-130 and NIST K-163 extension degrees it is a
        net loss at every m tested."
      corrected_value: >-
        The factor-base EXISTENCE and pi-orbit-SIZE part of RQ-FROB-7d8dd4 is
        settled for the linear Gaudry/Diem family at the enumerated (q, n), in
        the scope of CORR-20260923-9a3529. The pi-quotient alone gains the mean
        orbit size, at most n. At (q, n) = (2, 131) and (2, 163) the pi-quotient
        on the only faithful stable subspace (dimension n - 1) is a net loss for
        m in {2, 3, 4, 5} in every cost model examined in review. The
        stage-by-stage cost comparison the question's decision target (a) asks
        for was NOT measured: no relation collection or linear algebra was run.
      found_by: TASK-20260923-33a48b S5.

