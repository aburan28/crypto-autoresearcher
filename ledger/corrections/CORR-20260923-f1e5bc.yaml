    - id: D6
      field: EXP-FROB-ec08b5 specification.yaml execution.determinism ("the seeded control subspace and null curve ... are recorded in the run artifacts"); curve_panel.json control_null_curve.j_in_subfield
      prior_value: the seeded control objects are recorded; j_in_subfield false is a measured value.
      corrected_value: >-
        Neither seeded control object is recorded; curve_panel.json records only
        their factor-base sizes and booleans. j_in_subfield is a hard-coded
        literal (driver.py:207). The null test actually used is j^q != j plus
        ordinary; at q = 4, n = 3 that admits curves with j in F_8, a proper
        subfield of F_64 (the control still fails on them). The specification's
        replication clause ("cells where only one exists are recorded as such
        and their evidence strength is capped accordingly") is not implemented.
      found_by: TASK-20260923-69e71b F-J2-4, F-J2-6.

    - id: D7
      field: EXP-FROB-ec08b5 impl/driver.py -- the P4 lines of phase_curve_panel and the closed-form counts of phase_target_table
      prior_value: implicit applicability to any (q, n) the functions accept.
      corrected_value: >-
        VALID ONLY for n an odd prime with gcd(q, n) = 1. phase_curve_panel
        computes predicted_orbits and prediction_exact for any n (its
        divisibility guard is arithmetic, not a primality check) and reports
        exactness at even and composite n wherever an instance happens to have
        no intermediate orbits. phase_target_table uses n-prime closed forms
        (2 ** (1 + (n - 1) // d), (n - 1) // d) that are wrong at every
        composite n tested. curve_panel.ordinary_subfield_curves de-duplicates on
        j, so over F_2 it never returns the quadratic twist. None of the run's 16
        targets or 10 curve cells is affected. Any reuse of this driver outside
        n odd prime is made by ADDITIVE AMENDMENT (refuse the P4 lines outside
        n odd prime with gcd(q, n) = 1; take the target-table count from
        lattice.num_stable_subspaces; select curves by F_q-isomorphism class,
        both twists), never by editing the frozen code. The dead function
        lattice.min_faithful_dimension is wrong at p | n and has no caller.
      found_by: TASK-20260923-33a48b PTM-2, PTM-3, RC-3, RC-4; TASK-20260923-69e71b F-J1-4.
      key_applied: J4_proves_too_much_in_the_code (run values unaffected; no re-read of J1/J2 needed)

