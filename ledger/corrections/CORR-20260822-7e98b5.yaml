      and do NOT use the failure-provenance hatch (route R-B).
    - >-
      NA-D (UNCHANGED, AND STILL THE GOAL'S REAL NEXT ACTION) NA-1 and NA-2 of
      DEC-20260812-f56a44 stand -- mint one coordinator task for the SUPERSEDING
