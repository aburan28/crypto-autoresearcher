dispatch_conflict_ruling:
  id: CORR-20260822-7e98b5
  id_note: >-
    SENTINEL, NOT A RECORD ID -- `PENDING_MINT_BY_DRIVING_SESSION` is
    deliberately not a valid 6-hex token so it cannot be mistaken for one. THIS
    FILE IS A RULING BODY AWAITING AN ID AND A HOME, NOT A FILED RECORD. The
    Coordinator subagent that wrote it has no shell and cannot run
    `python3 tools/allocate_id.py`. It follows CORR-20260822-6ce623's precedent
    exactly - that body was staged inside a task's in-scope directory with its
    destination NAMED rather than assumed, because the correct destination was
    outside the writing task's write_scope.

  ruling_in_one_line: >-
    (b). The archive `kind` is RIGHT and `_validate_ledger_archive` IS WRONG.

  filing_instruction:
    why_this_file_is_here_and_not_where_it_belongs: >-
      THIS RULING NEEDS A PATH OUTSIDE TASK-20260812-4177ac's COMMITTED
      WRITE_SCOPE, AND I AM RAISING THAT RATHER THAN REACHING FOR IT. The
      write_scope is exactly three entries -- ledger/decisions/DEC-20260812-f56a44.yaml
      (now COMMITTED AND IMMUTABLE at commit A, and I have not touched it),
      ledger/evidence/EV-DREG-ea5086.yaml (which I refuse to fabricate, for the
      reason already committed at DEC-20260812-f56a44 `ev_dreg_ea5086_disposition`),
      and this archive directory. A harness-defect finding of general effect
      belongs in a correction or a fresh coordinator_decision, and BOTH
      destinations are outside that scope. The archive directory is the one
      in-scope location that no schema validator scans, so the body is staged
      here with its destination named.
    correct_destination: >-
      ledger/corrections/CORR-20260822-<minted>.yaml, following the 174-file
      convention and the CORR-20260822-6ce623 / CORR-20260802-a1f151 precedent.
      A defensible alternative with its own precedent is
      coordination/goals/GOAL-DREG-001/batches/BATCH-006/corrections/.
      NOT ledger/decisions/ -- tools/validate_ledger.py maps that directory to
      `coordinator_decision` and would validate a CORR-* record as one and fail
      it (the mechanical reason is set out in CORR-20260822-6ce623
      `filing_instruction`).
    record_type_to_mint: >-
      correction. `python3 tools/allocate_id.py --next correction --date 20260822`,
      then `--check` before use. I MINTED NO IDENTIFIER. If the driving session
      judges this is substantive enough to be a fresh `coordinator_decision`
      instead, that is a defensible reading and the type to mint is
      coordinator_decision -- but it is a NEW record either way and never an edit
      of DEC-20260812-f56a44.
    relation_to_the_immutable_record: >-
      DEC-20260812-f56a44 IS COMMITTED AND IS NOT EDITED BY THIS BODY OR BY
      ANYTHING IN IT. This ruling SUPERSEDES ONE LINE OF IT BY REFERENCE -- see
      `supersedes_by_reference` below. Everything else in that record stands.
    after_filing: >-
      Delete or leave this staging copy at the driving session's discretion. It
      is NOT a bound artifact of the TASK-20260812-4177ac archive, whose accepted
      content_first binding covers exactly two paths (the decision at commit A
      1e4037e39ae61091a882ded50622dba0fcad1f70, the receipt at commit B
      eaeb82544ea5ccd6ee393c5048c4b07e8a2794bb), and it MUST NOT be added to that
      archive's path_sha256. If it is committed, it belongs in a SEPARATE later
      commit that is not an archive commit.

  recorded_at: '2026-08-22'
  goal_id: GOAL-DREG-001
  batch_id: BATCH-006
  question_id: RQ-DREG-001
  task_id: TASK-20260812-4177ac
  recorded_by: coordinator

  question_ruled_on: >-
    tools/research_dispatch.py raises "ledger archive TASK-20260812-4177ac must
    own exact artifacts under ledger/evidence/ and ledger/decisions/". The
    archive owns a decision and no evidence record, because the Validator verdict
    was REVISE and a REVISE produces no evidence. Is the archive's `kind` wrong
    (limb a), or is the check wrong (limb b), or is it something else (limb c)?

  ruling: >-
    (b) THE `kind` IS RIGHT AND THE TOOLING IS WRONG. `_validate_ledger_archive`
    encodes the assumption that EVERY ledger archive promotes an evidence record.
    That assumption is FALSE for a whole family of legitimate Coordinator ledger
    acts, and this batch is not an exotic case -- it is the ordinary one. The
    archive stays `kind: ledger`, TASK-20260812-4177ac stays UNCOMPLETED with the
    conflict recorded, and the defect is filed against the harness.

  basis_stated_as_what_was_actually_done: >-
    I READ tools/research_dispatch.py -- `_validate_ledger_archive` at lines
    450-467, `_validate_review_chains` at lines 470-516, the archive loop at lines
    659-666, and `_failure_provenance_dependencies` at lines 244-285. I DID NOT
    RUN IT. I have no shell -- no git, no renderer, no validator, no hasher -- and
    every claim below is a reading of committed source, not an observed run. The
    driving session's report of the error string is accepted as its measurement
    and is attributed to it. This is an out-of-read_scope read of the same class
    already raised as PD-C1 in DEC-20260812-f56a44 and is disclosed here for the
    same reason.

  why_limb_a_fails:
    it_is_semantically_wrong: >-
      AGENTS.md "Durable research commits" separates the two kinds by POSITION IN
      THE LIFECYCLE, not by filename. A SNAPSHOT commit "follows a producer and
      commits its exact theory, implementation, run, or report artifacts" -- it is
      the PRE-REVIEW freeze. A LEDGER commit "follows the required reviews and
      commits the exact evidence, decision, hypothesis, and knowledge records" --
      it is the POST-REVIEW official record. This archive commits
      ledger/decisions/DEC-20260812-f56a44.yaml, an official Coordinator decision
      taken AFTER an independent review returned. RE-LABELLING IT `snapshot` WOULD
      ASSERT THAT IT IS A PRE-REVIEW PRODUCER PACKAGE, WHICH IS FALSE, and would
      quietly demote the one act in this batch that consumed a review verdict into
      something that never saw one. That is a worse misstatement than a wrong
      filename.
    it_is_also_mechanically_impossible_and_this_is_decisive: >-
      LIMB (a) DOES NOT EVEN WORK. It trades one dispatcher error for another,
      deterministically. `_validate_review_chains` (lines 470-516) runs
      immediately after the archive loop (line 661). TASK-20260812-f6df51 carries
      `review_required: true`, so it is a claim-relevant producer; its independent
      review successor is TASK-20260812-963ec3 (role validator, depends_on
      includes f6df51); that review's assigned archive is THIS task; and line 507
      reads `if ledger["archive"]["kind"] != "ledger": raise ... requires a ledger
      archive after review`. So setting `kind: snapshot` would skip
      `_validate_ledger_archive` at its line 452-453 early return and then fail at
      line 507-510 instead. THE HARNESS ITSELF INSISTS THIS ARCHIVE IS A LEDGER
      ARCHIVE. Limb (a) is refuted by the same file that raised the error.
    what_it_does_to_PD_C3: >-
      PD-C3 IN DEC-20260812-f56a44 IS SUPERSEDED BY REFERENCE, IN ONE DIRECTION
      ONLY, AND THE RECORD IS NOT EDITED. PD-C3 recorded the mismatch between
      `kind: ledger` and the receipt filename `snapshot-receipt.json` and left the
      direction of the resolution open. IT IS NOW RESOLVED AGAINST THE FILENAME.
      The `kind` is correct; the FILENAME is the cosmetic error. The file stays
      named `snapshot-receipt.json` because it is committed and byte-bound at
      commit B and renaming it would break an accepted binding for a cosmetic
      gain. Nothing else in PD-C3 changes.

  why_limb_b_holds:
    the_defect_precisely_stated:
      id: HD-1
      location: tools/research_dispatch.py, function `_validate_ledger_archive`, lines 454-460
      current_behaviour: >-
        It partitions `task["artifact_paths"]` into paths under `ledger/evidence/`
        and paths under `ledger/decisions/` and raises unless BOTH lists are
        non-empty. The evidence limb is UNCONDITIONAL -- it does not consult
        `archive["record_ids"]`, the decision's verb, or anything else.
      the_false_invariant: >-
        "Every ledger archive promotes an evidence record." This is false for at
        least five ordinary Coordinator ledger acts, none of them exotic -- (i) a
        REVISE or block decision, where no evidence exists to file and filing one
        would assert an evidence basis that does not exist; (ii) a `supersede`
        control-plane ruling; (iii) a `pause` decision resting on infrastructure;
        (iv) a versioned protocol amendment; (v) a correction. In every one of
        them the ledger act's entire content IS the decision.
      the_harness_already_contains_its_own_counterexample: >-
        RECORDED BECAUSE IT IS CHECKABLE AND BECAUSE IT IS SIX DAYS OLD, ON THIS
        GOAL. ledger/decisions/DEC-20260822-badc59.yaml `archive_binding.declared_paths`
        lists FIVE paths -- the decision, the goal record, batch.yaml,
        dispatch_queue.json and the review-plan artifact -- AND NOT ONE OF THEM IS
        UNDER ledger/evidence/. That act was a legitimate Coordinator ledger act
        on this very batch and it would fail HD-1 identically. It did not fail
        only because the driving session committed it directly under NA-2 rather
        than through a queued archive task. THE INVARIANT IS ALREADY VIOLATED BY
        THE PROGRAM'S OWN PRACTICE; what varies is whether an act happens to pass
        through the checker.
      why_the_check_over_reads_its_source: >-
        AGENTS.md item 2 says a ledger commit commits "the exact evidence,
        decision, hypothesis, and knowledge records". That is an ENUMERATION OF
        THE RECORD TYPES A LEDGER COMMIT MAY CARRY, not a conjunction requiring
        them. The check turns two of the four into hard requirements and the other
        two into nothing -- a reading the source text does not support in either
        direction.
    proposed_minimal_fix: >-
      Keep the decision limb, make the evidence limb CONDITIONAL on the archive
      claiming an evidence record. In `_validate_ledger_archive`, replace the
      `if not evidence or not decisions` conjunction with (1) `if not decisions`
      -> raise, because owning the official decision is what MAKES an archive a
      ledger archive; and (2) `if any(rid.startswith("EV-") for rid in
      archive["record_ids"]) and not evidence` -> raise, because an archive that
      NAMES an evidence record in `record_ids` must commit that record's file. The
      `record_ids` non-emptiness check and the `_ledger_record_matches_path` loop
      at lines 461-467 are untouched and still bind.
    what_the_fix_preserves: >-
      All three protections the current code actually delivers. (i) A ledger
      archive still cannot exist without the official decision it archives. (ii) A
      dangling evidence reference is still impossible -- naming EV-* in
      `record_ids` without committing the file still raises, which is the failure
      the evidence limb was presumably reaching for and which it currently catches
      only by accident. (iii) Record ids must still be visible in the filenames of
      every evidence and decision artifact.
    what_the_fix_COSTS_stated_rather_than_smoothed_over: >-
      THE HONEST COST. The dispatcher would no longer mechanically force an
      evidence record to exist at every review-closing ledger act, so an archive
      that SHOULD have filed evidence and quietly did not would no longer be
      caught HERE. The compensating controls are record-level rather than
      dispatcher-level -- the decision must carry `knowledge_promotion` (required
      by templates/research-records.md and checked by tools/validate_ledger.py)
      and, by the convention this program already follows, an explicit
      `evidence_filed` boundary flag. DEC-20260812-f56a44 carries both and answers
      both in the negative with reasons. A GUARANTEE MOVES FROM MECHANICAL TO
      RECORD-LEVEL, AND THAT IS A REAL LOSS, not a free relabelling. It is
      accepted because the alternative is a checker that is satisfied only by
      fabricating the record it is checking for, which is the failure AGENTS.md
      rule 9 forbids outright.

  routes_examined_and_rejected:
    - route: >-
        R-A. Declare ledger/evidence/EV-DREG-ea5086.yaml in artifact_paths but
        never write it, so the queue validates and the task is simply never
        completed.
      why_rejected: >-
        IT WOULD WORK, AND THAT IS THE PROBLEM. `_validate_ledger_archive` runs at
        line 660 over DECLARED artifact_paths and never checks that a declared
        file exists; the content binding runs only when the archive task's state
        is `completed` (line 663-666). So declaring the path passes validation and
        the conflict resurfaces only at the completed-archive gate. THIS IS
        DISHONESTY BY OMISSION -- it parks a permanent declaration of a record that
        will never exist, in order to make a checker pass. REJECTED. Removing the
        path, which the driving session did, is the honest act and is what surfaced
        the real conflict.
    - route: >-
        R-B. Use the `dispatch_exception` failure-provenance escape hatch
        (`_failure_provenance_dependencies`, lines 244-285), which is already
        coordinator-only and already requires `kind: ledger`.
      why_rejected: >-
        REJECTED ON BOTH GROUNDS. SEMANTICALLY it is for preserving a TERMINAL
        FAILURE without unblocking work; nothing here failed. TASK-20260812-963ec3
        RAN AND RETURNED A VERDICT. Routing a completed review through a
        failure-provenance path would record a successful adversarial review as an
        infrastructure failure, which is the AGENTS.md rule 5 confusion running in
        reverse and is worse than the error it would silence. MECHANICALLY it is
        unavailable anyway - lines 266-274 require a dependency in state `failed`,
        `invalid` or `cancelled`, and both of this task's dependencies
        (TASK-20260812-963ec3, TASK-20260812-f6df51) are `completed`, so it would
        raise "must name a terminal failed dependency".
    - route: >-
        R-C. Fabricate EV-DREG-ea5086 as a null or placeholder evidence record so
        the list comes out even.
      why_rejected: >-
        FORBIDDEN OUTRIGHT. AGENTS.md rule 9. It would assert an evidence basis
        that does not exist, above the claim tier, for a ranking whose winner is
        blocked. Already refused and already committed as refused at
        DEC-20260812-f56a44 `ev_dreg_ea5086_disposition`. Restated here only so
        the enumeration is complete.
    - route: >-
        R-D. Re-scope TASK-20260812-4177ac by a new Coordinator act so it is no
        longer the review's ledger archive.
      why_rejected_for_now_but_named_as_live: >-
        NOT REJECTED ON THE MERITS, DEFERRED. `_validate_review_chains` requires
        SOME ledger archive successor for the review of a claim-relevant producer,
        so this route means designating a different one, not deleting the
        obligation. It is a real option if the harness fix is judged too invasive,
        and it is named so a later session does not think it was overlooked. It is
        NOT taken here because it would restructure a committed queue to work
        around a defect rather than fixing the defect, and because the archive it
        would restructure has ALREADY LANDED at commits A and B.

  what_this_ruling_changes_and_does_not_change:
    the_commits_stand: >-
      DEC-20260812-f56a44 is durable at commit A 1e4037e39ae61091a882ded50622dba0fcad1f70
      and its receipt at commit B eaeb82544ea5ccd6ee393c5048c4b07e8a2794bb, both
      pushed to PR #506. THOSE SHAS AND THE DIGESTS 4fb1233b56b5... and
      f3cd4e053a6e... ARE THE DRIVING SESSION'S MEASUREMENTS, reported to me and
      recorded as its measurements. I ran no git command and verified none of
      them. What is unresolved is only whether the DISPATCHER can accept the
      archive; the records' durability does not depend on that, because archive
      receipts bind to CONTENT first (CLAUDE.md, concurrency doctrine).
    the_task_state: >-
      TASK-20260812-4177ac STAYS UNCOMPLETED, with this conflict as its recorded
      reason. Marking it `completed` while its archive cannot be dispatcher-accepted
      would be an official transition on an unaccepted archive, which
      agents/coordinator.md prohibits. THE HONEST STATE IS `queued` OR `blocked`
      WITH THE REASON NAMED, and the state change is the driving session's to
      record -- I have no shell and changed no task state.
    the_yaml_repair_accepted: >-
      The driving session reports it dedented a `minting_note:` key that sat at
      list-item indent inside `identifiers_needed_and_NOT_minted_here`, so the file
      would not parse, and verified the whitespace-split word stream identical
      otherwise. ACCEPTED AND RECORDED. That was a parse repair to an uncommitted
      file before commit A, not an edit to an immutable record, and disclosing it
      is the right conduct. The defect was mine.
    nothing_scientific_moves: >-
      `scientific_effect: none`. This is a harness-defect finding and a control-plane
      ruling. H-DREG-001 stays `inconclusive`; OBJ-013-4 stays OPEN; item B stays
      BLOCKED and unauthorized to run; wave 2 stays unappended; BATCH-005 stays
      CLOSED; GOAL-DREG-001 stays `active`; the raw 17947 headline stays
      quarantined; the n=18 rung stays INFRA-LIMITED. NO EVIDENCE, NO MEASUREMENT,
      NO RUN, NO ATTESTATION, NO PROMOTION.

  supersedes_by_reference:
    - record: ledger/decisions/DEC-20260812-f56a44.yaml, procedure_deviation PD-C3
      what: >-
        Only the OPEN DIRECTION of the kind-versus-filename mismatch. It is now
        resolved AGAINST THE FILENAME -- `kind: ledger` is correct and
        `snapshot-receipt.json` is the cosmetic error, which is left in place
        because the file is committed and byte-bound.
      why_not_edited: >-
        Committed and IMMUTABLE (AGENTS.md rule 4, CLAUDE.md rule 2), and the
        driving session expressly instructed that it not be edited. Superseded by
        reference, never overwritten. Any reader of PD-C3 must read this with it.

  next_actions:
