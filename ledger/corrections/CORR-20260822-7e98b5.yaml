    - >-
      NA-C (DRIVING SESSION) LEAVE TASK-20260812-4177ac UNCOMPLETED and record the
      conflict as its state_note, citing this ruling. Do NOT re-declare
      ledger/evidence/EV-DREG-ea5086.yaml to make the checker pass (route R-A), do
