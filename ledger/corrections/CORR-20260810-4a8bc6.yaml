  corrected_value: >-
    The framing OVERREACHED. The correct diagnosis, independently confirmed
    by TWO separate methods, is that a Frobenius-RATIONAL KERNEL (not a
    rational point) EXISTS for the crater<->floor 107-isogeny on the t=211,
    p=19717, D=-34347=-3*107^2 class -- "wrong tool, not wrong design."
    Method A (the Validator's algebra plus an executable toy-analog
    computation, VAL-20260811-31690a Q1 steps 1-7): the characteristic
    polynomial of Frobenius mod 107 has a repeated root (discriminant
    104^2-4*29 mod 107 = 0 exactly); 107 is inert/unramified in
    O_K=Z[(1+sqrt(-3))/2] (Kronecker(-3,107)=-1, since 107 mod 3 = 2);
    conductor(Z[pi]) = 107 exactly (v_107(D)=2, D_0=-3); combining these,
    pi mod 107 is fixed by the residue Frobenius and lies in the prime
    subfield F_107, so multiplication by pi acts as a SCALAR on
    O_K/107*O_K = E[107] at the crater, making all 108 order-107 subgroups
    individually Frobenius-stable there, while at the floor (Z[pi] exactly)
    the same local computation gives a genuine nontrivial Jordan block with
    exactly one stable line. Confirmed on an executable toy analog of the
    identical shape (D_0=-3, ell=5 inert, p=19, t=1, D=-75): the 5-division
    polynomial factors into six rational quadratic factors at the crater
    (all 6 kernels rational) and one rational quadratic plus one irreducible
    degree-10 factor at each floor vertex (exactly 1 of 6 rational),
    matching the algebraic prediction exactly. Method B (this Coordinator's
    own independent field-theoretic re-derivation, not accepted from the
    Validator's writeup): D=-34347, D mod 107 = 0 exactly (D/107^2 = -3.0
    exactly, confirming D_0=-3, conductor f=107 exactly); Kronecker(-3,107)
    via Euler's criterion, (-3)^53 mod 107 = 106 = -1 mod 107, confirming
    107 IS INERT in O_K; from these two facts alone and standard CM theory
    (not from the Validator's prose), O_K/(107) is a FIELD (inertness), pi
    mod 107 satisfies a repeated-root quadratic in that field, and a field's
    lack of nontrivial nilpotents forces pi mod 107 to equal the scalar root
    exactly -- the same conclusion, reached by an independent path. Both
    methods agree; the correction is accepted on that basis, not on either
    party's assertion alone.

  reason: >-
