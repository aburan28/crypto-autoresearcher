correction:
  id: CORR-20260815-092c9f
  recorded_at: '2026-08-15'
  record_type: claim
  record_type_note: >-
    "claim" is the closest permitted token (record_type: candidate | claim |
    run per templates/research-records.md), following CORR-20260724-001 and
    CORR-20260802-a1f151 precedent. The corrected artifact is a committed
    Coordinator archive receipt (JSON), not a ledger evidence/decision
    record; it is immutable once committed (it lives inside commit
    17604382167aa7c48a92bcb1a58deb659566144b, parent
    c3fef4fcfc7c2e9c46ccf6085ef34be4b28578ed, already on the branch), so this
    correction supersedes two of its fields by a new record rather than
    editing them in place.

  corrected_record: coordination/goals/GOAL-ECDLP-001/batches/BATCH-86fd69/archives/TASK-20260815-1f9a8e/snapshot-receipt.json
  corrected_record_commit: 17604382167aa7c48a92bcb1a58deb659566144b
  raised_by: >-
    Independently and convergently by Validator TASK-20260815-9b0fb4 (finding
    VAL-9B0FB4-OWN-PROVENANCE for correction_1's general defect class, and
    VAL-9B0FB4-REPAIR-COMMIT-PROVENANCE-LABEL for correction_2) and Red Team
    TASK-20260815-d7c570 (session_provenance_finding
    RED-TEAM-SESSION-POLICY-BINDING-MISMATCH, the same class of defect as
    correction_1, observed directly on its own session), then re-verified
    directly by the top-level archiving session on itself for correction_1
    and by re-running `git show c3fef4fc:<path>` for correction_2.

  correction_1:
    field: native_runtime.resolved_model_id
    attributed_to: >-
      "this archive task, top-level session" per
      native_runtime.resolution_command_executed_by in the corrected record
    prior_value: 'anthropic:claude-opus-5'
    corrected_value: 'claude-sonnet-5'
    corrected_value_note: >-
      The prior value is the committed BINDING TARGET for the
      coordinator-orchestration-code policy on the anthropic backend
      (`python3 -m orchestration.adapter resolve --role coordinator`
      correctly returns "coordinator-orchestration-code ->
      anthropic:claude-opus-5 (effort=high)"), not a live confirmation of
      what actually served this authoring session. Independently confirmed
      false via this session's own runtime system context (self-report),
      cross-checked via `python3 -m orchestration.adapter doctor --probe`
      (WARN: anthropic backend unusable via api_direct, $ANTHROPIC_API_KEY
      unset) and AUTORESEARCH_POLICY/AUTORESEARCH_BACKEND both absent from
      the process environment: the session that actually wrote this receipt
      is claude-sonnet-5, not anthropic:claude-opus-5.
    reason: >-
      Root cause: the archive-receipt author conflated "the committed
      binding's target for this policy" with "the model that actually served
      this authoring session" -- exactly the PRODUCER-POLICY-RESOLUTION-BINDING
      defect class this whole batch exists to repair, reproduced, ironically,
      in the record repairing it.

  correction_2:
    field: repair_disclosure.repair_committed_at
    also_corrects: >-
      the snapshot commit's own message clause "Repaired by scoped successor
      TASK-20260815-992b8a (committed separately at c3fef4fc)"
    prior_value: >-
      c3fef4fcfc7c2e9c46ccf6085ef34be4b28578ed, characterized as where the
      repaired bytes were committed, "separately" from the snapshot.
    corrected_value: >-
      The repaired bytes of experiments/EXP-SYC-793304/specification.yaml
      and coordination/goals/GOAL-ECDLP-001/batches/BATCH-86fd69/tasks/TASK-20260815-3f7098/design-repair-report.yaml
      first appear in git history at 17604382167aa7c48a92bcb1a58deb659566144b
      itself -- the snapshot commit under review -- not at c3fef4fc.
      c3fef4fc's only change is the addition of
      ledger/handoffs/TASK-20260815-992b8a.yaml (101 insertions, one file:
      the repair task's handoff/plan record, not the repaired file bytes).
      The repair's actual output and the archive's snapshot were committed
      together, atomically, in one commit; they were not committed
      "separately."
    corrected_value_note: >-
      Independently verified by Validator TASK-20260815-9b0fb4 via `git show
      c3fef4fc:experiments/EXP-SYC-793304/specification.yaml` and `git show
      c3fef4fc:.../design-repair-report.yaml` (both fail: neither repaired
      file exists at that commit) and `git show c3fef4fc --stat` (confirms
      the single-file, 101-insertion change), and independently re-verified
      by the top-level archiving session just now with the identical result.
    reason: >-
      Same root cause as correction_1: the archive task's author wrote
      provenance/custody narrative from memory/earlier context rather than
      re-deriving it fresh at write time.
    scope_of_defect: >-
      This does NOT misstate WHAT was repaired or HOW: content correctness
      is independently confirmed by both reviewers via cross-reference and
      internal consistency, since no pre-repair commit exists to byte-diff
      against directly. It does NOT violate immutability: both files were
      still working-tree-only artifacts of an in-flight producer task at the
      time of the fix, per TASK-20260815-992b8a's own handoff. It is
      narrowly a mischaracterization of WHERE the repaired bytes were
      committed.

  what_is_and_is_not_wrong:
    receipt_was_written_from_memory_not_rederived: >-
      Both false claims trace to the same proximate cause: the archive
      task's author wrote provenance/custody narrative from memory/earlier
      context rather than re-deriving it fresh at write time, for both
      fields. This is recorded plainly and neither finding is softened.
    content_binding_survives: >-
      All six declared path_sha256 values in the snapshot receipt are
      independently recomputed and confirmed correct by both reviewers; only
      the two provenance-narrative fields above are wrong.
    no_research_claim_is_affected: >-
      Neither false claim changes any HA-2 literal, capacity residual,
      peak-composition rule, RT-OBJ status, or the checkpoint's REVISE
      verdict.
    changes_no_hypothesis_status: true
    is_not_a_cryptanalytic_result: true

  evidence_artifacts:
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-86fd69/reviews/TASK-20260815-9b0fb4/review-report.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-86fd69/red-team/TASK-20260815-d7c570/red-team-report.yaml
    - coordination/goals/GOAL-ECDLP-001/batches/BATCH-86fd69/archives/TASK-20260815-1f9a8e/snapshot-receipt.json

  open_items:
    - id: OI-1
      item: >-
        The harness-wide session-launch condition underlying correction_1
        (native Claude Code remote/mobile launch -- CLAUDE_CODE_REMOTE=true,
        CLAUDE_CODE_ENTRYPOINT=remote_mobile -- not through
        orchestration/adapter's env mechanism, AUTORESEARCH_POLICY/
        AUTORESEARCH_BACKEND unset) is NOT fixed by this correction and will
        reproduce on every future review-adversarial or review-breakthrough
        dispatch from a session launched this same way. See the
        inference_amendment recorded in DEC-20260815-23d3bd for this
        checkpoint's disposition; a durable launch-path fix is a
        harness-design decision outside this correction's scope.

  recorded_by: coordinator
  recorded_by_task: TASK-20260815-de2514
  authority_note: >-
    Written by the Coordinator-only ledger-archive task for BATCH-86fd69. It
    corrects two provenance/custody-narrative fields of an already-committed
    archive receipt via a superseding record, per AGENTS.md's rule that a
    sync conflict or defect inside an immutable record is never resolved by
    editing it -- a new superseding record is created instead. It changes no
    hypothesis or experiment status, edits no immutable record body, and
    makes no scientific decision (see DEC-20260815-23d3bd for this batch's
    decision, which cites this correction).
