  items:
    - id: E1
      error: the generic-constant premise
      where: >-
        CORR-20261002-e58c3a K14 corrected_value sentence 3; DERIVATION.md
        sections 3.1 (Shoup and Hhan rows) and 3.4 item 1; H-SEMBIN-c7e1d4
        draft GENERIC LAYER and SD-1 reason; DEC-20261002-7a3f19 R8
        residual (1), insofar as it reads "unspecified constant" as the only
        available form.
      prior_value: >-
        "No source opened by this program states the constant numerically."
        "(Hhan Thm 3.3 is O(T^2/|G|))." "c > 0 is an absolute constant that no
        source opened by this program states numerically."
      corrected_value: >-
        WITHDRAWN. Two independent reviewer sessions report that Hhan 2024
        (arXiv 2402.11269v1) states explicit bounds in the proofs of Thm 3.3
        (type-safe model, eps <= (T+3)^2/(2|G|)) and Thm 3.4 (m-instance,
        (e(T+2m+1)^2/(2m|G|))^m), and that App. C Thm C.1 transfers them to
        faithful random-representation algorithms at equal group-operation
        count (RT-20261003-24c995 O2; VAL-20261003-17b1e4 JR1-B4 and
        citations). These are a POINTER until SRC freeze and back nothing in
        any record. Wagner 2002 Cor. 1 itself states no constant (read at
        source by VAL-20261003-17b1e4), so EV-SEMBIN-b6d042's and R8's
        description of Cor. 1 as Omega(sqrt l) with no constant remains TRUE
        of Cor. 1 and is not corrected.
      what_stays: >-
        K14's CONCLUSION stands: no record asserts "no generic algorithm below
        0.886 sqrt(N)". VAL-20261003-17b1e4 JR1-B4 computes, from the reported
        bound (so resting on the pointer), about 0.943 sqrt(l) when inversions
        are charged and about 0.471 sqrt(l) when negation is free, against the
        VOW column's 0.886 sqrt(N) in additions only. Even on the pointer the
        constant-level comparison is unit-dependent and does not yield K14's
        excluded sentence.
    - id: E2
      error: the Shoup/Maurer attribution
      where: >-
        DERIVATION.md section 3.3 MITM row ("Not covered by a Maurer-model
        statement alone (Hhan's Thm 3.3 is Maurer-model)") and section 3.1
        Shoup row; H-SEMBIN-c7e1d4 draft SD-2 reason ("Shoup's model, not
        Maurer's, is needed for tables and hashing"), proof_obligations
        ("Shoup-model, not Maurer-model, statement needed for hashing
        algorithms"), HEUR-HARVEST-FV-2 supporting_results Hhan row
        ("Maurer model").
      prior_value: >-
        Table and MITM harvesters need Shoup's random-representation model
        because Hhan's bound is Maurer-model; hashing and tables are the reason
        for requiring Shoup's model.
      corrected_value: >-
        WITHDRAWN AS INVERTED. As both reviewers report Hhan's model (pointer),
        equality tests are free gates, so lookup/table/MITM harvesters fall
        under the type-safe bound directly. What a type-safe model cannot
        express is control flow that depends on encodings: hash-driven walks
        and distinguished points (rho, PCS batching X-6, vOW golden-collision
        compression X-5). Those are the rows that need the random-
        representation model, which Thm C.1 reportedly covers for faithful
        algorithms (VAL-20261003-17b1e4 JR1-B3; RT-20261003-24c995 O2). The
        program-level statement that does NOT depend on the pointer is: every
        row of DERIVATION.md section 3.3 marked "yes" lies in Shoup's generic
        model with encodings visible, which covers both tables and hash-driven
        walks at exponent level (Shoup 1997 via Wagner 2002 Cor. 1). The
        sentence "Shoup's model, not Maurer's, is needed for tables" is false
        as a reason and is withdrawn.
    - id: E3
      error: "+7.17 bits quoted as the best / minimum generic harvesting cell"
      where: >-
        DEC-20261002-7a3f19 header, R8 reasons item 2, rationale item 4;
        DERIVATION.md sections 0, 2.2, 2.5, 2.7 and 6.
      prior_value: >-
        "The best constructed generic cell at n = 131 is 2^71.5, which is 7.17
        bits above the vOW column." "a 1999 generic algorithm that is 7 bits
        ABOVE rho." "The excess over VOW is 2.17 + d - w/2" (as a frontier).
      corrected_value: >-
        +7.17 bits is the value of the X-6 formula 2 + d + (N - w)/2 at
        n = 131, d = w = 10, under the program convention (no negation map in
        the harvester, K = 2^d), inside vOW's measured range w >= 2^10, and in
        the multi-version regime w <= K. It is reproduced at source by both
        reviewers (RT-20261003-24c995 C1; VAL-20261003-17b1e4
        metric_recomputations). It is NOT the PCS frontier and NOT the
        generic minimum. Over the 39 generic configuration families the red
        team constructed per degree (PCS as written and at source constants,
        ideal full-memory birthday harvesting, per-target vOW golden collision
        in sparse and dense regimes with the coupon correction, shared-table
        hybrids with distinct-entry fill), the minimum margin against the VOW
        column is +0.585 bits at EVERY listed degree. It is degree-independent
        and sits at the degenerate end (ideal birthday harvesting with a
        negation map, |F| = 2, K = 2), and tends to 0 from above as K -> 1,
        where the harvester is vOW rho itself (baseline embedding +0.00037
        bits). PCS at source constants (FAV, generation-only) gives +6.690 at
        d = 11, w = 2^10. Ideal birthday harvesting gives margin
        log2[Gamma(K+1/2)/(Gamma(K) Gamma(3/2))], e.g. +4.676 at |F| = 2^10.
        The bound 2 + d - w/2 >= 2 + d/2 holds only for w <= d; for w > K the
        birthday law governs (RT-20261003-24c995 O1, O7, per-degree table).
        These are single-session reviewer computations from the vendored vOW
        source (claim tier heuristic_estimate), not independently re-derived.
        Conclusion unchanged: no constructed generic configuration is below
        the VOW column at any listed degree.
    - id: E3b
      error: IDEA-20260930-4b7d1e claim (B) boundary
      where: DEC-20261002-7a3f19 R8 effect_on_P3_and_IDEA_4b7d1e; DERIVATION.md section 2.4
      prior_value: >-
        Claim (B) "per relation >= min(sqrt l, l/coverage)" holds only in the
        sparse regime.
      corrected_value: >-
        Claim (B)'s per-relation PREMISE holds through the sparse regime AND
        into the shallow dense regime, and fails only beyond n_h w ~ 24.5 l at
        vOW eq. (8) constants (at n = 131, m = 8, with vOW's memory ceiling,
        beyond about 2^13.6 golden pairs per target). Its CONCLUSION "this does
        not by itself create a sub-rho cell" holds in every regime constructed,
        by the total-cost envelope (RT-20261003-24c995 claim_B_answer, O6).
        "Right in direction, wrong in boundary."
    - id: E3c
      error: dense-regime limit and guard
      where: DERIVATION.md section 2.4
      prior_value: >-
        "as n_h -> l, the compression g becomes injective"; the dense
        per-relation expression 7 l'/sqrt(n_h w) stated without a validity
        guard.
      corrected_value: >-
        The injectivity limit is n_h -> l_e/2, since |I x {1,2}| = 2 n_h, and
        cost equality with PCS is reached far earlier (at n = 131, d >= 20,
        n_h ~ 2^93). The dense per-relation expression is valid only when the
        per-target harvest is at least one vOW version's yield (1.1 w q);
        below that the birthday floor binds. Carried into a total without that
        guard it manufactures 115 (n = 97) to 905 (n = 571) spurious sub-VOW
        cells per degree (RT-20261003-24c995 O4, O5). Every future dense-regime
        figure carries the guard (DEC-20261003-4e91b7 R2).

