  field: multiple -- see items E1, E2, E3, E3b, E3c
  prior_value: >-
    (E1) The generic-group DL bound is available to this program only as
    Omega(sqrt l) with an unspecified constant; no opened source states it
    numerically; Hhan 2024 Thm 3.3 states it as O(T^2/|G|). (E2) Hhan's
    Thm 3.3 is a Maurer-model statement, so table/MITM harvesters are not
    covered by it, and Shoup's model rather than Maurer's is what tables and
    hashing need. (E3) The best constructed generic harvesting cell is +7.17
    bits above the VOW column at n = 131, and the generic margin is
    2.17 + d - w/2 >= 2.17 + d/2.
  corrected_value: >-
    See items. In one sentence: two independent reviewer sessions report that
    the opened source DOES state explicit constants and counts equality as
    free, so E1's premise and E2's attribution are withdrawn (their
    replacement content is a pointer pending freeze); and the minimum margin
    over every generic harvesting configuration constructed in the round is
    +0.585 bits at every listed degree, not +7.17, which is one convention-
    bound cell of one formula.
  reason: >-
    E1 and E2: RT-20261003-24c995 (TASK-20261002-46ba70, O2) and
    VAL-20261003-17b1e4 (TASK-20261002-9e27f4, JR1-B3, JR1-B4) each read arXiv
    2402.11269 at source in independent, mutually blinded sessions (the red
    team the HTML and the v1 PDF; the validator the HTML, sha256 c76d7566...).
    Both report the explicit constants in the proofs of Thm 3.3 and 3.4, free
    equality gates, and App. C Thm C.1. Two concordant independent source
    readings establish that the program's statement about the source was
    wrong. E3: RT-20261003-24c995 O1, O7 and its per-degree minimum-margin
    table (39 configuration families per degree, both conventions).
  application_note: >-
    The corrected values carry NO new constant-level claim as program content.
