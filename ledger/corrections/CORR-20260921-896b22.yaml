# Correction record. Supersedes by reference and edits nothing.
#
# DEC-20260916-87fc5c was committed at 80242e204 roughly forty minutes before
# this was written. Its third limitation is too generous to the source it
# critiques: it concedes the whole refutation to the ">=" reading, when the
# refutation survives that reading for the placement Lemma 4 actually prints.
# Correcting a decision this fresh is not a sign the round was rushed; the
# tension was raised BY the first task dispatched after it, which is the
# harness working as intended.
correction:
  id: CORR-20260921-896b22
  recorded_at: '2026-09-21'
  recorded_by: coordinator
  goal_id: GOAL-SEMBIN-fcb7a2
  batch_id: BATCH-e0a0c1
  produced_by: >-
    The dispatching coordinator session, from a tension raised by
    TASK-20260921-d61759 and adjudicated arithmetically with
    tools/lemma4_inside_form.py.
  archived_by: >-
    This session, in the same commit that adds the pinning tests. NOT assigned to
    a batch archival task: BATCH-e0a0c1's queue is closed at its ledger archive,
    and inventing a tenth card to own a correction that supersedes that archive's
    own decision would put the correction inside the structure it corrects. Same
    route CORR-20260921-942a62 took in this campaign, for the same reason.

  corrects:
    record: DEC-20260916-87fc5c
    field: limitations, third entry
    committed_at: 80242e204f9c393ec4353ad9dde5409c930c1665
    the_text_being_corrected: >-
      "The refutation is void under the literal '>=' reading printed in
      2015/984, under which the inequality holds and is empty. The equality
      reading is a DECLARED interpretation of an ambiguous source, supported by
      three independent routes and settled by none."
    what_is_wrong_with_it: >-
      The first sentence names a READING but not a PLACEMENT, and the void
      depends on both. It is true for the placement with S_fe INSIDE the true
      system and FALSE for the placement with it OUTSIDE. Because it is stated
      without qualification it concedes more to 2015/984 than the arithmetic
      requires, and it concedes it at exactly the point a reader would look to
      discount the round's central finding.
    what_is_NOT_wrong_with_it: >-
      The second sentence stands unchanged and is important: the equality
      reading is still a declared interpretation of an ambiguous source,
      supported by three independent routes and settled by none. This correction
      does not resolve the ambiguity of condition (1). It narrows which cell of
      the reading-by-placement table the concession applies to.

  found_by:
    who: TASK-20260921-d61759, the NA-1 amendment writer
    how: >-
      It was directed to state the scope note as DEC-20260916-87fc5c states it,
      did so verbatim, and separately recorded the discrepancy it noticed as
      `recorded_tension` T-1 in
      experiments/EXP-SEMBIN-4fa22c/amendments/AMD-EXP-SEMBIN-4fa22c-20260921-lemma4.yaml,
      declining to adjudicate because it held no decision that could.
    why_that_was_the_right_call: >-
      A producer that quietly "fixes" a limitation in a committed decision it
      was told to quote would have hidden the disagreement inside an amendment,
      where nobody compares it against the decision. Recording it as an
      unresolved tension is what made it visible in one reading. The amendment is
      not edited and its caution is vindicated rather than overridden.
    the_underlying_source_already_said_so: >-
      read-nagao-2013-549/report.md lines 389-395 tabulate witness A at true
      d_F = 3 under BOTH readings with S_fe outside the true system, collapsing
      to 2 under ">=" only for the inside placement, and the line beneath the
      table reads "Lemma 4 as printed is false, under both readings". So the
      evidence records did not disagree with each other. The Coordinator's
      synthesis disagreed with the reader it rested on, in the direction of
      understating it.

  nature: scope_of_a_recorded_finding_understated

  corrected_values:
    established_by_exact_finite_arithmetic: >-
      For BOTH witnesses -- A: f_1 = X^2 Y, f_2 = XY + X over F_2[X,Y]; and
      B: f_1 = X_1X_2 + X_3, f_2 = X_1X_3 + X_2 over F_2[X_1,X_2,X_3] -- the
      fake first fall degree d'_F is 2 and is INERT to the placement of S_fe,
      and the true side reads as follows.
    the_four_way_table:
      equality_reading_S_fe_inside_true_system: >-
        d_F = 3 > d'_F = 2. REFUTED.
      equality_reading_S_fe_outside_true_system: >-
        d_F = 3 > d'_F = 2. REFUTED.
      ge_reading_S_fe_inside_true_system: >-
        d_F = 2 = d'_F. NOT refuted; the inequality holds and is empty. This is
        the cell DEC-20260916-87fc5c's limitation correctly describes.
      ge_reading_S_fe_outside_true_system: >-
        d_F = 3 > d'_F = 2. REFUTED. This is the cell the limitation wrongly
        included in its concession.
    the_load_bearing_step_and_why_it_is_exact: >-
      least_degree_in_ideal searches cofactors only to a fixed degree and so
      returns an UPPER bound; a longer search can only find something smaller,
      and something smaller would drag the outside-placement d_F down to 2 and
      void the refutation after all. For witness A the value 2 is EXACT, by an
      argument short enough to check by hand: every generator of (X^2 Y, XY + X)
      is divisible by X, hence so is every element of the ideal, so no nonzero
      element has degree 0; degree 1 would require X itself, which would require
      g_1 X Y + g_2 (Y + 1) = 1, and modulo Y + 1 that reads g_1 X = 1, which is
      impossible in a polynomial ring. So the least degree is at least 2, and
      f_2 = X(Y + 1) attains it. Widening the cofactor bound to 6 moves nothing.
    pinned_as_tests: >-
      tools/test_lemma4_inside_form.py::TestTheGeReadingVoidsOnlyOnePlacement,
      three tests, which pin the whole four-way table for both witnesses rather
      than any one cell -- because it is the table, not a cell, that a scope
      statement has to match, and pinning one cell is how this error was made.
      The suite is 18 tests and passes.
    independence_of_this_adjudication: >-
      tools/lemma4_inside_form.py was written in this program without sight of
      the Nagao reader's implementation, and that reader was blind to it. The
      agreement is therefore evidence about the quantities rather than about
      either implementation. This session recomputed the table from that module
      and also checked the load-bearing cell by hand, by the argument above.

  the_consequence_that_matters:
    conditional_statement: >-
      IF Lemma 4 as printed places S_fe OUTSIDE the true system -- which is what
      read-nagao-2013-549 reports and what the NA-1 amendment's L-1 states --
      THEN the refutation of Lemma 4 AS PRINTED does not depend on the declared
      equality convention at all, and the single largest scope caveat the round
      recorded against its central finding does not apply to the printed form.
    what_that_condition_rests_on: >-
      A TEXTUAL reading of a frozen source by one agent that opened it
      (TASK-20260916-9da6e0, provenance retrieved). It is not machine-checkable
      and this session did not independently re-read 2015/984 to confirm it. The
      arithmetic above is established unconditionally; this consequence is
      conditional on that reading and is stated conditionally on purpose.
    what_would_settle_it: >-
      A second independent read of 2015/984's Definitions 5 and 6 and the
      statement of Lemma 4, reporting only which system each degree is taken in
      and whether S_fe is a member of the generating set on each side. That is a
      narrow, cheap, zero-compute question and it is worth a successor task.

  what_this_correction_does_not_assert:
    - >-
      IT DOES NOT PROMOTE THE CLAIM. The step from "this universally quantified
      statement is false" to "a published subexponential ECDLP bound rests on an
      unsupported lemma" still requires review-breakthrough at max under core
      rule 12, that tier is degradable false and unservable in this checkout, and
      IMP-SEMBIN-FCB7A2-LEMMA4-TIER stands unchanged. Strengthening a finding's
      scope is not promoting a claim, and the temptation to treat it as such is
      exactly what the impediment exists to resist.
    - >-
      Nothing about Nagao's Proposition 5, which may hold by another route, and
      nothing about the bound of his Theorem 1. DC-1 is untouched.
    - >-
      Nothing about Semaev's Assumption 1, which is correctly stated and is not
      refuted by anything here.
    - >-
      Nothing at p >= 3. Every witness is over F_2, at N <= 3.
    - >-
      Nothing about whether the EQS4 instances EXP-SEMBIN-4fa22c will measure are
      among the violating instances. A counterexample refutes a universal
      statement and says nothing about a typical instance, still less about a
      structured family. That is why the amendment's per-instance U-4 bookkeeping
      requirement is the operative clause and is unaffected by this correction.
    - >-
      Nothing about any elliptic curve, any deployed parameter set, or the
      security of anything.
    - >-
      It does not reopen any joint verdict, prior score, or the inertness ruling
      of REVIEW-SEMBIN-20260916-e0a0c1, none of which this touches.

  why_the_records_are_not_edited: >-
    DEC-20260916-87fc5c, EV-SEMBIN-1ca3c8, KN-FIND-936151, the closing checkpoint
    shard and the NA-1 amendment are all immutable and all remain exactly as
    committed. The decision's limitation is historically accurate for what the
    Coordinator believed when it composed the round, and the amendment quoting it
    is historically accurate for what it was directed to quote. Editing either
    would destroy the only evidence that the understatement happened and that the
    harness caught it one task later.

  where_the_corrected_scope_must_be_carried_forward:
    - >-
      KN-FIND-936151 carries the ">=" scope note as one of its five required
      items, and it now carries it in the too-broad form. The entry is immutable;
      a successor knowledge edit or a superseding entry must state the table
      rather than the reading alone. Until then a reader of that entry gets a
      caveat wider than the arithmetic supports, which understates the finding
      rather than overstating it -- the safe direction, and still wrong.
    - >-
      Any future record stating the ">=" scope note states WHICH PLACEMENT it
      applies to. A reading without a placement is underdetermined. This is the
      same defect as the ruling's section 4.1 naming defect, one level up: that
      one failed to say which SIDE a placement was on, and this one failed to say
      which PLACEMENT a reading applied to.
    - >-
      EV-SEMBIN-1ca3c8's scope statement should be read together with this
      record. The evidence record's arithmetic is correct and complete; what this
      corrects is a limitation in the decision that cites it.

  forward_guidance:
    - id: FG-1
      action: >-
        Dispatch a narrow zero-compute read of 2015/984 Definitions 5 and 6 and
        Lemma 4, reporting ONLY which system each degree is taken in and whether
        S_fe is a member of the generating set on each side. Nothing else. This
