      (KN-LIT-7637, KN-LIT-7638, KN-LIT-7619..7620) carry citation_verified:
      true"). Its inference also attributes the RSF-5 blocker to a "KN-LIT-7637
      limit".
    disposition: >-
      NOT EDITED AND NOT SUPERSEDED. EV-FAEST-001 is immutable and its
      substance is unchanged: it is a literature/theoretical ideation record of
      strength `preliminary` that claims nothing about FAEST's security, and
      the ideation outcome it records stands. This correction is the durable
      gloss on its KN-LIT-7637 references, exactly as it is on the goal head's.
      Read EV-FAEST-001's four-entry source list as the three-entry list above.
    why_it_is_named_here: >-
      Because a reader correcting the goal head alone would still meet the same
      bad credit one citation hop away, and because AGENTS.md rule 8 requires an
      unexpected observation to be recorded rather than quietly dropped.

  what_this_does_not_establish:
    - >-
      IT ASSERTS NOTHING ABOUT FAEST. Not about its security, not about its
      claimed NIST category, not about the tightness of any link in its claim
      chain, not about VOLEitH soundness, the Fiat-Shamir transform, the
      commitment layer, or any parameter set. The FAEST claim ceiling is
      unchanged by this record.
    - >-
      It changes NO hypothesis status. GOAL-FAEST-001.active_hypothesis_ids
      stays EMPTY, no H-FAEST-* record exists, and none is created or implied.
    - >-
      It moves NO claim tier and files NO evidence. No EV-* record is created,
      edited, or re-scored; EV-FAEST-001 and EV-FAEST-002 stand exactly as
      committed at strength `preliminary`.
    - >-
      It does not establish that anything in GOAL-ECDLP-001 is wrong.
      DEC-20260731-020 is a valid record of that campaign and this correction
      neither edits, renames, supersedes, nor reinterprets it, nor any of
      BATCH-024, SG-ECDLP-002, H-IT-001, EXP-IT-001, or EV-DS-007.
    - >-
      It does not establish that the BATCH-001 work product is defective. All
      ten BATCH-001 dispatch-queue tasks (TASK-20260731-005..010, -012..015)
      are at state completed and the batch is genuinely finished; what was
      broken is how the goal head cites that work, not the work.
    - >-
      It does not determine how the KN-LIT-7637 credit arose, and it does not
      determine whether a FAEST specification entry exists anywhere outside
      knowledge/literature/. It records only what a direct read of the
      committed tree shows.
    - >-
      It does not re-assert the source-acquisition blocker. Pause condition #2
      DID hold on 2026-07-31 and is documented in
      coordination/goals/GOAL-FAEST-001/source-acquisition-probe-20260731.md;
      it was SUBSEQUENTLY CLEARED by the filing of KN-LIT-7619, KN-LIT-7620 and
      KN-LIT-7638. Both facts stand: the blocker once held, and it does not
      hold now.
    - >-
      It does not establish that RSF-5 is resolvable. Whether the deployed
      parameters can actually be pinned is exactly what BATCH-0ed590 must
      determine, and it may fail.

