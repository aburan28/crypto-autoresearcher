  supersedes: []
  corrects:
    - >-
      ledger/goals/GOAL-FAEST-001.yaml (research_goal.next_action, the decision
      identifier cited in its opening clause)
    - >-
      ledger/goals/GOAL-FAEST-001.yaml
      (research_goal.batch_checkpoints[0].decision_id)
    - >-
      ledger/goals/GOAL-FAEST-001.yaml
