  record_type: research_goal
  record_id: GOAL-FAEST-001
  field: >-
    Two independent citation defects in the same record. (1)
    research_goal.next_action and research_goal.batch_checkpoints[0].decision_id
    both cite DEC-20260731-020 as the decision that closed BATCH-001 and opened
    the next batch; that identifier resolves to a GOAL-ECDLP-001 record. (2)
    research_goal.batch_checkpoints[0].outcome credits KN-LIT-7637 as one of the
    FAEST primary sources filed and citation-verified by BATCH-001; that
    identifier resolves to an unrelated OpenAI technical report. Neither defect
    touches any research content, any hypothesis status, any claim tier, or any
    statement about FAEST; both are citation-basis defects under AGENTS.md rule
    10 (every conclusion cites the records that support it).

  prior_value: >-
    DEFECT 1, STRING A -- ledger/goals/GOAL-FAEST-001.yaml
    research_goal.next_action, verbatim: "Open BATCH-002 as a single design gate
    (DEC-20260731-020): resolve the spec v2.0 PDF-text blocker (RSF-5) by
    pinning the deployed parameters (exact consistency-check equation, degree,
    (kappa, tau), field, LeafCommit/bAVC modes) from primary-source text or a
    pinned faest-ref commit; apply scope fixes RSF-1..4 to IDEA-20260731-019,
    IDEA-20260731-002..003; then design frozen experiment contracts for the
    admitted ideas. Five of six campaign batches remain."

    DEFECT 1, STRING B -- the same record's
    research_goal.batch_checkpoints[0], verbatim: "batch_id: BATCH-001" /
    "decision_id: DEC-20260731-020" / "evidence_id: EV-FAEST-001".

    DEFECT 1, STRING C -- the same stale cross-reference inside the genuine
    FAEST decision, ledger/decisions/DEC-20260731-021.yaml next_actions[0],
    verbatim opening: "Open BATCH-002 as a single design gate (unchanged from
    DEC-20260731-020):". That record is immutable, is NOT edited, and is
    corrected by reference only.

    DEFECT 2 -- ledger/goals/GOAL-FAEST-001.yaml
    research_goal.batch_checkpoints[0].outcome, first sentence, verbatim:
    "Primary sources filed and citation-verified (KN-LIT-7637, KN-LIT-7638,
    KN-LIT-7619..7620; no Round-3 spec exists as of 2026-07-31, v2.0 is latest,
    tweaks due 2026-08-14)."

  corrected_value: >-
    DEFECT 1 -- THE AUTHORITATIVE BATCH-001 CLOSING DECISION FOR GOAL-FAEST-001
    IS DEC-20260731-021, NOT DEC-20260731-020.

    ledger/decisions/DEC-20260731-020.yaml is a GOAL-ECDLP-001 record. Read
    directly at base commit 7df1972a4 it carries goal_id: GOAL-ECDLP-001,
    batch_id: BATCH-024, recorded_by_task: TASK-20260731-081, decision:
    approve, and a context concerning SG-ECDLP-002 / IDEA-20260731-008 /
    H-IT-001 / EXP-IT-001. It contains no FAEST content of any kind.

    ledger/decisions/DEC-20260731-021.yaml is the FAEST record. Its context
    opens "GOAL-FAEST-001 BATCH-001 expansion (campaign open)", its decision is
    admit_ideation_to_experiment_design, it was decided_by coordinator on
    2026-07-31, its target_ids are [IDEA-20260731-004, IDEA-20260731-005,
    IDEA-20260731-006, GOAL-FAEST-001, RQ-FAEST-001, TASK-20260731-007,
    TASK-20260731-009, EV-FAEST-002], and its next_actions[0] carries the same
    BATCH-002 design-gate instruction that the goal head paraphrases. Every
    reader of the goal head, of batch_checkpoints[0], and of
    DEC-20260731-021's own next_actions[0] must from now on resolve
    "DEC-20260731-020" in a GOAL-FAEST-001 context to DEC-20260731-021.

    DEFECT 2 -- THE BATCH-001 PRIMARY-SOURCE LIST IS KN-LIT-7619, KN-LIT-7620
    AND KN-LIT-7638. KN-LIT-7637 IS NOT A FAEST SOURCE AND THE CREDIT IS
    WITHDRAWN.

    knowledge/literature/KN-LIT-7637.md, read directly at base commit
    7df1972a4, is titled "Ten Advances in Mathematics and Theoretical Computer
    Science", authors [OpenAI], venue "OpenAI technical report; 249-page
    collection", url https://cdn.openai.com/pdf/ten-proofs-oai.pdf, added
    2026-08-01. A case-insensitive search for "faest" in that file returns zero
    matches, and its own "Relevance to this program" section describes it as
    methodological rather than as any scheme's specification. Its `added` date
    is also AFTER the 2026-07-31 date the BATCH-001 checkpoint states for the
    filing it is credited in, so it cannot have been filed by that batch.

    The three genuine FAEST sources ARE filed and were verified present at the
    same commit, so this correction NARROWS the checkpoint's source list rather
    than emptying it: KN-LIT-7619 "FAEST reference implementation (faest-ref)"
    (citation_verified: true, added 2026-07-31), KN-LIT-7620 "NIST IR 8610:
    Status Report on the Second Round of the Additional Digital Signature
    Schemes for the NIST Post-Quantum Cryptography Standardization Process"
    (citation_verified: true, added 2026-07-31), and KN-LIT-7638 "Publicly
    Verifiable Zero-Knowledge and Post-Quantum Signatures From VOLE-in-the-Head"
    (citation_verified: true, added 2026-07-31).

    WHAT THE CHECKPOINT'S REMAINING CLAUSES STILL REST ON. The clause "no
    Round-3 spec exists as of 2026-07-31, v2.0 is latest, tweaks due
    2026-08-14" is NOT withdrawn by this correction; it is re-attributed. Its
    surviving basis is KN-LIT-7620 and EV-FAEST-001's own observations, not
    KN-LIT-7637. Stated plainly and verified in this session: a
    case-insensitive search for "faest" across knowledge/literature/ returns
    exactly three files -- KN-LIT-7619, KN-LIT-7620 and KN-LIT-7638 -- so THIS
    CORPUS CONTAINS NO KN-LIT ENTRY FOR THE FAEST SPECIFICATION v2.0 PDF UNDER
    ANY IDENTIFIER. That absence is itself material to RSF-5 and is handed to
    BATCH-0ed590 as a thing to determine, not resolved here.

  mechanism: >-
    DEFECT 1 IS THE RESIDUE OF AN IDENTIFIER REMAP PERFORMED AT A MERGE, AND
    THAT REMAP IS NOT REPEATED, EXTENDED, OR REVERSED HERE.

    The mechanism is visible in git history at merge commit da6f4fdaf, whose
    message reads "merge: resolve origin/main conflicts; remap PR DEC-009..012
    to DEC-018..021". That merge moved this campaign's decisions into an
    identifier range that GOAL-ECDLP-001 records already occupied on main. The
    outcome on main is that DEC-20260731-018, DEC-20260731-019 and
    DEC-20260731-020 all carry goal_id GOAL-ECDLP-001, and only
    DEC-20260731-021 survived in that range as a FAEST record -- while the
    GOAL-FAEST-001 goal head, written before the remap, still cites the
    pre-remap number. The two pre-remap FAEST decisions were not destroyed:
    DEC-20260731-009 (decision: pause -- the FAEST source-acquisition blocker)
    and DEC-20260731-010 (decision: approve -- which opened the separate AES
    campaign) both still exist and still reference GOAL-FAEST-001.

    This is exactly the failure AGENTS.md rule 15 names: an identifier remap is
    a last resort, not a repair. THE REMEDY APPLIED HERE IS CORRECTION BY
    REFERENCE, AND NOTHING IS RENAMED, MOVED, REMAPPED, OR EDITED.
    DEC-20260731-020 remains a valid, untouched, correctly-numbered
    GOAL-ECDLP-001 record; nothing about BATCH-024, SG-ECDLP-002, H-IT-001 or
    EXP-IT-001 is altered, re-read, or reinterpreted by this correction.
    DEC-20260731-021, DEC-20260731-009 and DEC-20260731-010 are likewise
    untouched. No BATCH-001 archive receipt is altered; the receipts bind
    content hashes at paths that this correction does not move.

    DEFECT 2 HAS NO ESTABLISHED MECHANISM AND NONE IS GUESSED AT. What is
    verified is only that the identifier as committed resolves to a non-FAEST
    entry added a day after the checkpoint's stated filing date. Whether it was
    a transcription slip, a second remap, or a placeholder that was never
    replaced is NOT determined by this correction and is not asserted.

  reason: >-
    AGENTS.md rule 10 requires every conclusion to cite the experiment IDs and
    artifacts that support it, and rule 6 scopes conclusions to what was
    actually tested. A goal head whose cited closing decision resolves to
    another campaign's record, and a checkpoint that credits an unrelated
    report as a primary source, both break the citation basis on which every
    downstream FAEST record stands -- including the next batch, which is gated
    on precisely the source situation the defective sentence describes.

    Recorded as a CORRECTION rather than as an edit to the cited records
    because ledger records are immutable (AGENTS.md rule 4) and because rule 15
    forbids reaching for a second remap to repair the first. The goal record's
    MUTABLE control-plane fields (next_action, current_batch_id,
    batch_checkpoints) are separately updated by DEC-20260810-67d674 under
    TASK-20260810-0feb81, which appends rather than overwrites: the BATCH-001
    checkpoint's original decision_id and outcome text stay in place as the
    historical record and are read from now on only alongside this correction.

  observation_requiring_a_curate_knowledge_successor:
    what: >-
      knowledge/literature/KN-LIT-7619.md (added 2026-07-31) contains, in its
      "What this is" section, the cross-reference "(the FAEST team; see
      KN-LIT-7637 for the 12-member roster)". Under the corpus as committed
      that pointer resolves to the same unrelated OpenAI technical report, so
      the roster it promises is not there to be read.
    status: >-
      RECORDED AS AN OBSERVATION, NOT FIXED HERE. Knowledge entries are
      immutable and only the Coordinator promotes or supersedes corpus records,
      through /curate-knowledge. KN-LIT-7619 is NOT edited by this correction
      and MUST NOT be edited inline by any downstream task.
    successor_required: >-
      A /curate-knowledge successor entry superseding KN-LIT-7619 on that one
      cross-reference, or a corpus correction record that redirects it. Until
      that successor exists, no record may cite KN-LIT-7637 for the FAEST team
      roster or for any other FAEST fact.
    what_is_not_affected: >-
      Everything else in KN-LIT-7619 stands exactly as committed, including the
      pinned commits and the parameter-variant list that DEC-20260810-67d674
      relies on for RSF-5 route B. The defective pointer is one parenthetical
      about a roster; it bears on no parameter, no commit hash, and no layout
      fact.

  additional_affected_citation_verified_in_this_session:
    record: ledger/evidence/EV-FAEST-001.yaml
    what: >-
      EV-FAEST-001, read directly in this session at base commit 7df1972a4,
      carries the same KN-LIT-7637 credit in two places: observations[0]
