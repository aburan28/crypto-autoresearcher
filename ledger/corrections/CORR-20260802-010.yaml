correction:
  id: CORR-20260802-010
  recorded_at: '2026-08-02'
  record_type: schema
  record_id: DECIDED-BY-APPROVED-BY-AND-XEDN-DECISION-MISBINDING
  field: three records repaired, one defect recorded for Coordinator action
  reason: >-
    Two records were missing fields whose value is entailed by the schema
    itself. A third finding is not a schema gap at all and is recorded here for
    Coordinator action rather than repaired.
  repaired:
    DEC-20260724-016: >-
      Missing decided_by and knowledge_promotion. decided_by is `coordinator`,
      the value all 163 decisions carrying the field use and the only value
      AGENTS.md rule 1 permits. knowledge_promotion is the empty-with-reason
      shape used by 141 of 162 decisions, and the reason is read off this
      decision's own content: it is refine_and_expand, so it commissions more
      work rather than concluding a line, and its own limitations and
      next_controls state what is still open. No new judgement is introduced.
    EXP-MLKEM-004: >-
      status `approved` with approved_by null. Set to `coordinator`, matching
      all 146 other approved contracts and entailed by AGENTS.md rule 1, under
      which no other actor can approve an experiment.
  not_repaired_deliberately:
    EV-SIG-007: >-
      Flat record lacking the `evidence:` key and the direction / strength /
      claim_tier / proof_status / proof_refs fields. Its own relocation note
      already states the reason it was left alone -- supplying those fields
      "would require assigning a direction and an evidence strength that the
      record never states, which is an evidence judgement, not a relocation" --
      and names the repair path: a fresh review of the EXP-SIG-007 receipts
      issuing a superseding schema-conformant record. Editing it here would be
      exactly the overreach that note warns against.
  open_defect_found_requires_coordinator:
    what: >-
      THIS IS A CORRECTNESS DEFECT, NOT SCHEMA DEBT. Three XEDN evidence
      records name a decision_id that never ruled on them. It was found while
      auditing their missing direction/strength fields and is recorded rather
      than repaired, because rebinding evidence to a decision is a Coordinator
      act under AGENTS.md rule 1.
    misbindings:
      EV-XEDN-002: >-
        cites DEC-20260724-009, whose decision is `supported` with target_ids
        [H-BKKMV-001, H-BKK-001]. That decision concerns the BKK/mixed-volume
        law, not the XEDN free-x Mordell-Weil family, and does not name
        H-XEDN-002, EXP-XEDN-003 or EV-XEDN-002.
      EV-XEDN-003: >-
        cites DEC-20260725-001, whose decision is `revise` with target_ids
        [GOAL-ECDLP-001, BATCH-003, TASK-20260725-001..003] -- a batch dispatch
        ruling naming no hypothesis, experiment or evidence record at all.
      EV-XEDN-004: >-
        cites DEC-20260725-002, whose decision is `revise` with target_ids
        [IDEA-20260725-001, GOAL-SSI-001, RQ-SSI-001, TASK-20260725-501, -503]
        -- a supersingular-isogeny goal ruling, unrelated to XEDN.
    correctly_bound_for_contrast: >-
      EV-XEDN-005 and EV-XEDN-006 cite DEC-20260730-001 and DEC-20260730-002,
      both `support_scoped` and both naming the evidence record, its experiment
      and H-XEDN-005 in target_ids. This is what the binding should look like,
      and it shows the three above are anomalies rather than a house convention.
    consequence_if_unrepaired: >-
      Each of the three carries a decision_id implying a Coordinator ruling that
      does not exist. KN-FIND-003, -004 and -005 carry the same pairing in their
      internal_refs, inherited from their own frontmatter, so the mis-binding is
      reproduced in the knowledge corpus. No claim is thereby strengthened --
      none of the three decisions says anything about XEDN -- but the records
      read as decided when they are not.
    repair_path: >-
      A Coordinator review of the EXP-XEDN-003/004/005 receipts either
      identifies the decision that actually ruled on each, or issues one. The
      direction and strength fields these records are missing should be filled
      by that same review, since both are evidence judgements. Until then the
      missing-field errors stay reported.
  substantive_delta: >-
    None. No claim, direction, strength, scope, proof level or hypothesis
    status is created, altered or withdrawn, and no mis-binding is silently
    corrected.
  status_effects:
    hypothesis_status_changed: false
  supersedes: null
  superseded_by: null
