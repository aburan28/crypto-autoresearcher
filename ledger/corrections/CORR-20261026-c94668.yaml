  field: strength
  reason: 'Apply the strength recommendations of sheriff case SHF-20261019-ccc409 for the 25 replicated/strong
    evidence records whose cited artifacts do not show the reproduction or independent review their label
    needs. Basis categories: 17 records assert independent reproduction in their own prose but cite no
    reviewer artifact that resolves on disk (label unconfirmed, not disproved); 8 cite no independent
    reproduction or review at all.'
  effect: Additive. The evidence files are not edited and stay byte-identical; for these ids the strength
    to read is `corrected_value` below, the file value is `prior_value`. This lowers a label. It changes
    no hypothesis status, direction, verdict or claim boundary, and says nothing about whether any claim
    is true.
  not_applied:
  - the 38 `moderate` records (a label the schema lacks; mapping needs a Coordinator choice)
  - the 179 malformed strength values (need assignment, not downgrade)
  - strong/replicated records recommended to keep their label
  reversal: A record regains its prior label by a new correction citing a resolvable independent reviewer
    or reproduction artifact.
