  recorded_at: '2026-08-03'
  record_type: frozen_contract_risk
  record_id: EXP-SMTH-4403c4
  field: CTRL_NULL_SELF_requires_a_Dickman_pass_a_prior_review_measured_failing
  authority: >-
    Recorded by TASK-20260802-80f5e9, the freezing task, immediately after the
    freeze and BEFORE any datum exists. The freezing card exists to catch this
    class of defect prospectively; this is that catch, including the part of it
    that is against my own artifact.

  # -------------------------------------------------------------------------
  what_prompted_the_check: >-
    After freezing EXP-SMTH-4403c4 I read EXP-EQD-001's specification, which
    restates the two defects REV-20260801-012 found in EXP-SMTH-001 -- the
    predecessor from which H-SMTH-001's decision rules descend. EXP-SMTH-001
    was recorded NOT APPROVED by TASK-20260801-013 and never executed. I had
    frozen the contract without reading that review first. Two findings follow,
    one favourable and one adverse, and the adverse one is the operative half.

  # -------------------------------------------------------------------------
  finding_1_FAVOURABLE_rv012_a2_is_already_fixed_by_this_contract:
    the_defect_in_the_predecessor: >-
      RV012-A2: "The leading coefficient of S_3(x_1, x_2, Z) in Z is
      (x_1 - x_2)**2, zero over F_p exactly on the diagonal x_1 = x_2, so the
      fibre invariants were undefined on exactly 512 of the 131328 enumerated
      half-tuples i <= j, and the integrity guard M-0 fired on every possible
      outcome."
    why_EXP_SMTH_4403c4_does_not_inherit_it: >-
      This contract enumerates STRICTLY i < j, so x_i != x_j on every tuple and
      the leading coefficient (x_i - x_j)**2 is never zero. The invariants are
      defined everywhere in the index set. Arithmetic: 512 diagonal tuples +
      130816 strict pairs = 131328, exactly the predecessor's count.
    what_this_explains: >-
      IT EXPLAINS WHY DEC-20260801-011 NAMES THE i < j ENUMERATION EXPLICITLY,
      and it independently corroborates the pre-registration correction this
      contract already made. H-SMTH-001 quotes n = 131328 and derives its KS2
      threshold from it; that n is the DEFECTIVE predecessor's count, inclusive
      of the 512 diagonal tuples on which the measured quantity does not exist.
      The correction to n = 130816 and KS2-DS-1 = 0.006373 was made before this
      review was read, on the enumeration rule alone, and this review confirms
      it was not merely a bookkeeping tidy-up but the removal of a degenerate
      stratum.

  # -------------------------------------------------------------------------
  finding_2_ADVERSE_the_risk_this_contract_carries:
    the_defect_in_the_predecessor: >-
      RV012-A1: "TAIL-DS-1 fails on a CORRECT uniform null. p_ext = min_j
      rho(u_j) makes n * p_ext asymptotically Exp(1), so the analytic pass
      probability is 1/e and not the 1 - 1/e the contract asserted; and the
      reviewer measured the declared null arm passing 0 of 8 at bits 16 and
      0 of 8 at bits 20, BECAUSE ASYMPTOTIC rho UNDER-PREDICTS DEEP-TAIL
      SMOOTHNESS AT X OF ORDER 2**32 TO 2**40."
    what_EXP_SMTH_4403c4_got_right: >-
      Its TAIL-DS-1 is defined against the MEASURED null NULL-UNIF-D, not
      against analytic rho, so RV012-A1's mechanism does not reach it. Its
      primary test KS2-DS-1 is likewise two-sample against the measured null.
      Making the measured null the calibration and demoting Dickman to a
      secondary reference was the right call and is independently vindicated by
      this review.
    WHAT_IT_GOT_WRONG: >-
      CTRL-NULL-SELF requires that NULL-UNIF-D "must itself pass KS-DS-1 and
      RATE-DS-1 against Dickman", and its failure branch is APPARATUS_FAILURE.
      But RV012-A1 is precisely a measurement that a CORRECT uniform null does
      NOT match asymptotic rho at these X. The control therefore asks the null
      to pass a comparison a prior independent review measured it failing, at
      exactly the two field sizes this contract uses.
    consequence_if_left_standing: >-
      A run could terminate in APPARATUS_FAILURE for a reason that is a known
      finite-size property of the Dickman asymptotic rather than any fault of
      the apparatus -- burning the 5400 s measurement budget without ever
      reaching KS2-DS-1, the one test H-SMTH-001 records as never having been
      performed. The bulk-CDF leg (KS-DS-1 at a loose 0.05) may well pass; the
      rate-band leg at the deep rungs u = 4, 5 is where the under-prediction
      RV012-A1 names would bite, and this session has NOT measured whether the
      factor-8 band absorbs it. THE RISK IS NAMED, NOT QUANTIFIED.

  # -------------------------------------------------------------------------
  disposition:
    contract_edited: false
    why_not: >-
      EXP-SMTH-4403c4 is frozen and its sha256
      80b75c415b3456772acf09901a67ea0644d984dae84f8ad01946fc8afeb5b801 is
      recorded in freeze_receipt.json. Its own freeze_rule says any needed
      change is a SUPERSEDING contract under a NEW id, never an edit, and the
      measurement task re-hashes the file and HALTS on any difference. Editing
      it now -- even minutes after writing it, even with nothing committed and
      no datum in existence -- would be exactly the "repair by quiet edit" that
      the freeze mechanism exists to prevent, and would make the receipt's
      digest a lie.
    recommended_repair: >-
      A superseding contract, identical except that CTRL-NULL-SELF's Dickman
      leg becomes ADVISORY-AND-REPORTED rather than blocking, with
      APPARATUS_FAILURE reserved for the two legs that do not depend on the
      asymptotic: CTRL-ENCA-POWER (the test must be able to reject ENC-A) and
      CTRL-APPARATUS-IDENTITY. A null that fails Dickman at finite X while
      still rejecting ENC-A is a working instrument, and the contract should
      say so.
    what_is_NOT_recommended: >-
      Deleting the Dickman comparisons outright. They are inherited from
      H-SMTH-001's own sentence and their disagreement at finite X is itself
      worth reporting. The repair is to stop letting a known asymptotic
      artifact BLOCK the run, not to stop looking at it.
    execution_status: >-
      TASK-20260802-6a39f8 SHOULD NOT BE DISPATCHED against EXP-SMTH-4403c4 as
      frozen until this is resolved, because a foreseeable deadlock in a
      contract is a reason to fix the contract, not a reason to spend the
      budget discovering it.

