correction:
  id: CORR-20260814-ac666c
  recorded_at: '2026-08-14'
  record_type: knowledge
  record_id: KN-TECH-9d21c4
  field: superseded_by (and the same field on nine further knowledge entries, listed below)
  prior_value: >-
    KN-TECH-9d21c4 carries superseded_by: null, and so does KN-TECH-6c0e15. Both
    read as live, current entries.
  corrected_value: >-
    BOTH ARE SUPERSEDED AND HAVE BEEN SINCE THEY WERE WRITTEN, BY THEIR
    SUCCESSORS' OWN DECLARATIONS. KN-TECH-6c0e15 carries
    "supersedes: KN-TECH-9d21c4" and KN-TECH-1a5b7e carries
    "supersedes: KN-TECH-6c0e15". The chain is
    KN-TECH-9d21c4 (3 failure modes) -> KN-TECH-6c0e15 (adds Mode 4, the
    decision rule that cannot discriminate) -> KN-TECH-1a5b7e (adds Mode 5 and
    the scoping cases; 660 lines, the current tip). The supersession was
    declared from the successor side each time and the reciprocal field on the
    predecessor was never filled.

    THIS IS NOT A NAMING QUIBBLE, BECAUSE THE RETRIEVAL LAYER READS THAT FIELD.
    crypto-kb excludes superseded material from search_knowledge by default. With
    superseded_by unset on the predecessors, a query for null sufficiency returns
    ALL THREE entries as current, at comparable relevance, with no signal which
    one an agent should follow. Measured directly: the query "a validation
    statistic that cannot fail; control that could have come out the other way;
    non-discriminating check carried as an assurance" returned KN-TECH-9d21c4 at
    0.359, KN-TECH-1a5b7e at 0.333 and KN-TECH-6c0e15 at 0.200 -- the OLDEST and
    least complete entry ranked FIRST of the three.
  reason: >-
    Found while closing the novelty check that knowledge/findings/KN-FIND-a4d4a4.md
    declared INCOMPLETE. That entry recorded that the corpus had not been searched
    because CRYPTO_KB_QDRANT_URL was ':memory:', an embedded in-process index that
    dies between commands, and asked to be re-checked when an index was available.
    The index was brought up file-backed (11,142 manifests, 51,082 points) and the
    check was run.

    THE NOVELTY CHECK ITSELF CAME BACK CLEAN AND IS NOW COMPLETE: no entry
    anticipates KN-FIND-a4d4a4's worked instance, and its filing under
    KN-TECH-1a5b7e Mode 4 is correct, because KN-TECH-1a5b7e is the current tip of
    the chain. That was arrived at by grep before this correction existed, so it
    was RIGHT BY LUCK RATHER THAN BY CONSTRUCTION -- the corpus offered no way to
    tell the tip from its predecessors. One provenance note the finding does not
    make: Mode 4 ORIGINATED in KN-TECH-6c0e15, not in KN-TECH-1a5b7e, which
    inherited it.

    SCOPE, MEASURED RATHER THAN ESTIMATED. A sweep of all 8,046 knowledge entries
    found TEN one-way supersession links -- a successor declaring "supersedes: X"
    while X still reads "superseded_by: null":
      KN-LIT-13a01d -> KN-LIT-3c9f21
      KN-LIT-4c8135 -> KN-LIT-c41d8b
      KN-LIT-71d1a0 -> KN-LIT-a4d70e
      KN-LIT-7639   -> KN-LIT-7640
      KN-LIT-7ee1a9 -> KN-LIT-6b1fc8
      KN-LIT-c41d8b -> KN-LIT-5ff88f   (also a predecessor in the row above: a
                                        two-step chain, both links one-way)
      KN-LIT-e37d4c -> KN-LIT-d82a53
      KN-TECH-029   -> KN-TECH-058
      KN-TECH-6c0e15 -> KN-TECH-1a5b7e
      KN-TECH-9d21c4 -> KN-TECH-6c0e15
    Ten of 8,046 is a small rate and a real defect: each stale entry is served as
    current to every agent that searches, and the two technique chains are
    methodology entries that bind idea-generation and review.

    WHAT IS NOT DONE HERE, AND WHY. The ten predecessor files are NOT edited.
    Knowledge entries are immutable and this session holds no write scope over
    them -- eight belong to other campaigns. Filling superseded_by would be a
    metadata repair that merely completes what the successors already declare,
    which is a strong argument for making it and not a licence for this session to
    make it unilaterally. It is recorded for the owning campaigns and for a
    curation pass to act on.

    A SECOND, ENVIRONMENTAL DEFECT IS RECORDED HERE RATHER THAN SEPARATELY. The
    retrieval index defaults to ':memory:', which is embedded AND in-process, so
    ingesting in one command and searching in another cannot work and every tool
    returns nothing. kb/README.md documents this and crypto-kb status reports it,
    yet it has now cost this program two recorded novelty failures --
    CORR-20260813-1a06db and the declared-incomplete check in KN-FIND-a4d4a4.
    A file-backed index (CRYPTO_KB_QDRANT_URL=./.kb-index) needs no server and
    fixes it. THE FIX APPLIED IN THIS SESSION IS LOCAL AND DOES NOT PROPAGATE:
    kb/.env and kb/.kb-index are gitignored by design as machine-specific, so
    every other worktree, container and session still starts at ':memory:' until
    it runs the same setup. No claim is made here that the problem is fixed
    program-wide.
