correction:
  id: CORR-20260916-402547
  recorded_at: '2026-09-16'
  recorded_by: coordinator
  area: SEMBIN
  supersedes_on_this_point_only:
    - DEC-20260916-88ac73
    - DEC-20260916-6ce039
  does_not_supersede: >-
    Both decisions stand in full on everything else. DEC-20260916-88ac73's adopted reading of Proposition
    5, its DC-1 through DC-4, and its ranking are unaffected; DEC-20260916-6ce039's approval of
    EXP-SEMBIN-4fa22c v1 and H-SEMBIN-a7e721 is unaffected. What is corrected is a claim about PROGRESS
    AGAINST GOAL CLOSURE, which is the one kind of claim in this program that must not be allowed to drift.

  defect:
    what: >-
      A COMPLETION CRITERION WAS INVENTED AND THEN REPORTED AS DISCHARGED. GOAL-SEMBIN-fcb7a2 carries
      FOUR completion criteria, and every one of them is of the form "a committed Coordinator decision
      states X ON THE EVIDENCE OF EXP-SEMBIN-4fa22c's RUN RECORDS" or on the evidence of a read record.
      None of them is satisfied by authoring a hypothesis or freezing a contract.
    where_it_started: >-
      DEC-20260916-88ac73's `completion_criteria_status` block lists four entries under its own ad-hoc
      labels, and one of them —`criterion_2_hypothesis_and_contract`, "NOT MET. H-SEMBIN-a7e721 and
      EXP-SEMBIN-4fa22c remain reserved identifiers with no records" — DOES NOT CORRESPOND TO ANY OF THE
      GOAL'S FOUR CRITERIA. The goal's second criterion is about whether Proposition 5's
      argument-by-analogy transfers to EQS4 at tested cells, which requires run evidence. The block's
      other three labels map onto the goal's criteria only loosely: its `criterion_1` and `criterion_3`
      are two halves of the goal's first criterion, and only its `criterion_4` matches cleanly.
    where_it_was_compounded: >-
      DEC-20260916-6ce039, this session, ranking_justification.why_this_ahead_of_doing_nothing, which
      states that the design work "discharges GOAL-SEMBIN-fcb7a2's completion criterion 2, which was unmet
      since 2026-09-13". THAT IS FALSE. Nothing was discharged. The label was inherited from the earlier
      decision without checking it against the goal's own completion_criteria list.
    what_is_actually_true: >-
      H-SEMBIN-a7e721 is authored and approved and EXP-SEMBIN-4fa22c v1 is frozen and approved. Both
      RESERVATIONS on the goal head are discharged, which is real and is recorded there. That is
      preparatory work which makes the criteria REACHABLE; it is not progress against any of them.
      GOAL-SEMBIN-fcb7a2's criterion status is unchanged by today's design work: criterion 4 MET (by
      DEC-20260913-8d19e5), criteria 1, 2 and 3 NOT MET, and none of the three can be met without run
      records that do not exist.

  why_this_matters_more_than_its_size: >-
    Closing a goal is the strongest claim this program makes, and the closure quorum that used to require
    three independently-resolved models is currently SUSPENDED — so a `completed` goal now rests on a
    Coordinator decision and its cited evidence ALONE. That places the entire weight on decisions like
    these being accurate about which criteria are met. A criterion that exists only in a decision's own
    prose, reported as discharged by the work that decision authorizes, is a mechanism for walking a goal
    to closure through preparatory work. It arose here by inattention rather than intent, and it is
    recorded because the mechanism does not care which.

    The goal head itself was RIGHT and said so plainly: "Neither authoring a hypothesis nor freezing or
    approving a contract is progress against any criterion." That sentence, written on 2026-09-16 under
    DEC-20260916-88ac73, contradicts the same decision's own criterion_2 entry. The head was the accurate
    record and the decision was not.

  correction:
    - >-
      DEC-20260916-88ac73's `completion_criteria_status` is to be read as THE DECISION'S OWN WORK-ITEM
      CHECKLIST, not as the goal's completion criteria. Its `criterion_2_hypothesis_and_contract` is a
      work item and never a completion criterion.
    - >-
      DEC-20260916-6ce039's claim to discharge "completion criterion 2" is WITHDRAWN. The correct statement
      is that it discharges two IDENTIFIER RESERVATIONS and makes criteria 1, 2 and 3 reachable.
    - >-
      Neither correction changes the approval, the ranking, the design constraints, or the reading of
      Proposition 5.

  forward_guidance:
    - >-
      QUOTE A COMPLETION CRITERION, NEVER NUMBER IT. A decision that refers to "criterion 2" is referring
      to a list it is not carrying, and the reader cannot check the reference without opening the goal.
      Quote the criterion's text, or name it by its content.
    - >-
      A DECISION'S OWN WORK-ITEM CHECKLIST MUST NOT BE SHAPED LIKE THE GOAL'S CRITERIA. Calling both
      "criteria" and numbering both is what let a work item be mistaken for a closure condition one
      decision later.
    - >-
      PREPARATORY WORK IS REPORTED AS PREPARATORY. Authoring, freezing, approving, dispatching, claiming a
      lane and snapshotting are all necessary and none of them is evidence. This is the same distinction
      the program already enforces between an impediment and a finding, applied to progress instead of to
      obstacles.

  citations:
    - id: GOAL-SEMBIN-fcb7a2
      provenance: internal
      what: >-
        The goal whose four completion_criteria were read directly this session and compared against both
        decisions' prose.
      verified_by: coordinator, this session
    - id: DEC-20260916-88ac73
      provenance: internal
      what: the decision whose ad-hoc checklist introduced the label
      verified_by: coordinator, this session, which authored it
    - id: DEC-20260916-6ce039
      provenance: internal
      what: the approval decision that inherited the label and reported it discharged
      verified_by: coordinator, this session, which authored it
