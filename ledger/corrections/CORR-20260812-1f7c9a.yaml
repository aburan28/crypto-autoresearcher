  source_of_this_correction: >-
    First flagged by an independent idea-generator session
    (TASK-20260809-4e04eb's proposal.md, Sec.1 and Sec.11, dedup pass over
    knowledge/INDEX.md), independently reconfirmed by the Validator
    (TASK-20260809-28c68e, validation_report.yaml
    dedup_verification/finding F-5), and independently reconfirmed a THIRD
    time by this Coordinator directly in this reconciliation task: grepped
    the same pattern class (Argon2|memory-hard|depth-robust|pebbling|Alwen|
    Blocki|scrypt|Percival) against the corpus, confirmed via Glob that all
    eight cited files exist under knowledge/literature/, and read two of the
    eight (KN-LIT-3385.md, KN-LIT-494.md) directly to confirm they are
    genuinely memory-hard-function-related literature entries (titles
    "Depth-Robust Graphs and Their Cumulative Memory Complexity" and
    "Balloon Hashing: A Memory-Hard Function" respectively), not an artifact
    of a stale or mis-tagged index.

  field: idea.dominated_by

  prior_value: >-
    "Not dominated by any corpus record; no memory-hard-function records
    exist in the corpus." (ledger/proposals/IDEA-20260809-a915ea.yaml,
    verbatim, as committed and unedited by this correction.)

  corrected_value: >-
    FALSE AS WRITTEN. Eight memory-hard-function-related records exist in
    the corpus as of this correction: KN-LIT-3385 ("Depth-Robust Graphs and
    Their Cumulative Memory Complexity"), KN-LIT-4894 ("Memory-Hard
    Functions from Cryptographic Primitives"), KN-LIT-494 ("Balloon Hashing:
    A Memory-Hard Function"), KN-LIT-5442 ("On the Complexity of Scrypt and
    Proofs of Space..."), KN-LIT-6385 ("Scrypt is Maximally Memory-Hard"),
    KN-LIT-6793 ("Static-Memory-Hard Functions..."), KN-LIT-7033 ("The
    Parallel Reversible Pebbling Game..."), KN-LIT-7247 ("Tradeoff
    Cryptanalysis of Memory-Hard Functions"). None of the eight is confirmed,
    on a full read, to be the exact Alwen-Blocki / Alwen-Blocki-Pietrzak
    depth-robust-graph line of work a915ea's own mechanism most directly
    needs -- KN-LIT-3385's title is the closest match but its content was
    only heuristically parsed from a PDF's first two pages during the
    2026-07-24 bulk seeding pass (no abstract, authors, or year were
    extracted), so it cannot yet be cited as confirming or ruling out that
    specific attribution. This correction therefore does NOT set
    dominated_by to a single named, checked frontier row (that would itself
    be a fabrication under AGENTS.md rule 5 and the inventor protocol's
    Pareto-honesty duty). The corrected field reads: "UNKNOWN -- NOT null.
    The corpus contains eight memory-hard-function-adjacent literature
    records (KN-LIT-3385, -4894, -494, -5442, -6385, -6793, -7033, -7247);
    the prior claim that none exist is retracted. Whether any specifically
    dominates this proposal's object (the standardized-indexing-function-
    induced DAG, measured directly rather than bounded for a graph family)
    remains unverified: the two most on-topic entries (KN-LIT-3385,
    KN-LIT-7247) were read in full by TASK-20260809-4e04eb and found
    adjacent-but-not-identical (KN-LIT-7247 analyzes Catena/yescrypt/Lyra2
    tradeoff cryptanalysis, not Argon2's own DAG; KN-LIT-3385's title is the
    right shape but its content is unverified past the title in this
    corpus). A live web-literature check was attempted and failed on session
    infrastructure (proposal.md Sec.0, Sec.10), so dominated_by: null remains
    unavailable (per docs/inventor-protocol.md, null is settable only after
    checking every row on the frontier, which this failure directly
    prevents)."

  reason: >-
    a915ea's dominated_by field made a categorical existence claim ("no ...
    records exist in the corpus") that is directly falsified by a corpus
    grep any of three independent sessions performed (the producer of
    TASK-20260809-4e04eb, the Validator TASK-20260809-28c68e, and this
    Coordinator). AGENTS.md rule 5 forbids fabricated claims, and the
    inventor protocol's Pareto-honesty duty specifically forbids an unchecked
    dominated_by claim of either polarity (null asserts a full frontier
    check that did not happen; "none exist" here asserts a corpus state that
    is directly falsifiable and false). Recorded as a correction rather than
    an edit to a915ea itself because ledger records are immutable (AGENTS.md
    rule 4); this correction supersedes the field by reference for any
    future reader, following the same convention used in
    CORR-20260810-4a8bc6 and CORR-20260810-676b0d (GOAL-ENDO-001).

  what_this_does_and_does_not_mean:
    - >-
      THIS CORRECTS ONLY THE dominated_by FIELD. No other field of a915ea
      (claim, mechanism, predictions, minimal_test, controls,
      falsification_conditions, sota_delta, novelty_status, novelty_screen,
      source_refs) is touched, disputed, or reassessed by this correction.
    - >-
      THIS DOES NOT ITSELF DETERMINE a915ea's STANDING GOING FORWARD.
      Separately from this dominated_by correction, DEC-20260812-03fa10
      (same reconciliation batch) determines that TASK-20260809-4e04eb's
      more-rigorous reformalization supersedes a915ea's content for
      RQ-ARGON-141710 going forward. Both facts are true independently:
      a915ea's dominated_by field was wrong regardless of whether a915ea is
      later superseded in content, and its correction stands even though
      a915ea's own content is separately being superseded.
    - >-
      NO CLAIM ABOUT ARGON2's SECURITY, ANY PARAMETER SET's SAFETY, OR ANY
      ATTACK's COST is made or implied by this correction.
    - >-
      NO HYPOTHESIS STATUS CHANGES. a915ea never reached hypothesis status
      (it is a proposal, not an H-* record); this correction changes nothing
      about GOAL-ARGON-001's completion criteria.

  required_action:
    - >-
      Do not edit ledger/proposals/IDEA-20260809-a915ea.yaml in place
      (immutable, AGENTS.md rule 4). A future reader of a915ea's
      dominated_by field should be pointed at this correction record.
    - >-
      Whichever future record supersedes a915ea's content (per
      DEC-20260812-03fa10) must state its OWN dominated_by honestly and
      independently -- inheriting a915ea's now-corrected text is not a
      substitute for a fresh check at the time that record is filed.
