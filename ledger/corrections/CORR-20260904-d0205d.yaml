correction:
  id: CORR-20260904-d0205d
  recorded_at: '2026-09-04'
  recorded_by: coordinator
  type: own_instrument_defect_statistical_test_mismatch_self_and_reviewer_caught
  severity: high_flips_headline_significance
  supersedes: []
  corrects:
    - experiments/EXP-MONO-cb905d/execution_report.yaml
    - experiments/EXP-MONO-cb905d/runs/RUN-MONO-cb905d-2/raw-result.json

  incident_summary: >-
    RUN-MONO-cb905d-2's own reported P3 headline statistic
    (`group_uniform_fisher_exact_ord_vs_cm`, p=0.32999, "not significant")
    tests the WRONG quantity. Its 2x2 table uses `tuples_with_collision`
    (1049 ord, 1005 cm out of 20000) -- whether a tuple has ANY colliding
    pair -- while P1 and P2 (the actual metrics under comparison) are built
    from `total_pairs_colliding` (1470 ord, 1405 cm) divided by each curve's
    OWN reused transversal rate (0.03065 ord, 0.03405 cm). The archived test
    therefore (a) measures a different, only loosely correlated statistic
    (any-collision-per-tuple, not pairs-per-tuple) than P1/P2/P3 are defined
    on, and (b) entirely ignores that the two curves' transversal baselines
    differ by about 11% (0.03065 vs 0.03405) and are themselves noisy
    measurements, not fixed constants -- so a real difference in that
    baseline can appear in the ratio P1/P2 without appearing in a bare
    group-uniform-rate comparison, and the archived test cannot see it.

  discovery: >-
    Found independently by the Red Team reviewer (RT report, joint
    J4-HEADLINE-INTERPRETATION, task TASK-20260904-bb2f29) via a from-scratch
    reconstruction of a proper homogeneity-of-ratios test using all four
    counts, cross-checked by three of their own independent methods,
    reporting p in [0.022, 0.038]. Independently re-verified by this
    Coordinator directly against the raw JSON (not the reviewer's own
    prose): a log-ratio delta-method test on
    log(P1/P2) = log(gu_ord/tr_ord) - log(gu_cm/tr_cm), using
    Var(log rate) ~= 1/count for each of the four counts (1470, 613, 1405,
    681), gives z=2.244, two-sided p=0.0248 -- inside the reviewer's own
    reported range, via a different (delta-method vs. the reviewer's own
    from-scratch method) computation. Two independent derivations agree.

  disposition: >-
    The archived p=0.32999 in RUN-MONO-cb905d-2's raw-result.json and
    execution_report.yaml is NOT edited or deleted (immutable per this
    program's rules) -- it stands as the literal output of a flawed test,
    now cross-referenced by this record. The CORRECTED reading -- a
    properly-specified test of whether P1 and P2 differ gives p
    approximately 0.02-0.038, NOMINALLY SIGNIFICANT at alpha=0.05, the
    OPPOSITE of the archived "not significant" headline -- is adopted as
    this Coordinator's own official reading going forward, recorded in
    EV-MONO-c0bf6d and DEC-20260904-8c17d5. This does NOT mean the
    underlying scientific question is resolved: see those records for why
    the disposition remains inconclusive-leaning-toward-interesting rather
    than supported, given this is now the third borderline headline
    statistic on the same single cell and no multiplicity correction has
    been applied across them.

  reason: >-
    AGENTS.md rule 4 (immutability; corrections supersede, never overwrite)
    and rule 6 (every conclusion cites the IDs supporting it) require this
    filed as a correction: a headline significance verdict this program
    already archived and could have cited in a decision record is reversed
    by a properly independently-verified re-analysis. Filing this
    separately from the evidence/decision record keeps the DEFECT
    (a statistical test-specification error) and the DISPOSITION (what this
    means for H-MONO-1d50ac) auditable as distinct facts.

  evidence_artifacts:
    - path: experiments/EXP-MONO-cb905d/reviews/red-team/red-team-report.yaml
      note: Original discovery, joint J4, with the reviewer's own three-method cross-check.
    - path: experiments/EXP-MONO-cb905d/reviews/validator/validation-report.yaml
      note: >-
        Independently confirmed the raw counts and the archived (flawed)
        P1/P2/P3 arithmetic are internally consistent (joint J2) -- the
        Validator was not assigned J4 and did not audit the test's own
        specification against the metrics it was meant to test, which is
        exactly why disjoint joint ownership across two reviewers caught
        this: J2 verified the arithmetic was computed correctly FROM THE
        CHOSEN TEST; J4 challenged whether the chosen test was the right one.

  independent_reverification_by_coordinator: >-
    log(P1/P2)=0.15044, using counts gu_ord=1470, tr_ord=613, gu_cm=1405,
    tr_cm=681 (all read directly from raw-result.json, not from either
    report's prose): Var(log P1) ~= 1/1470 + 1/613 = 0.002312;
    Var(log P2) ~= 1/1405 + 1/681 = 0.002181; SE = sqrt(0.004493) = 0.06703;
    z = 0.15044/0.06703 = 2.2444; two-sided p = 0.0248 (normal
    approximation). Falls inside the Red Team's own independently-derived
    [0.022, 0.038] range via a different method, corroborating rather than
    merely repeating their finding.

  git_forensics: null

