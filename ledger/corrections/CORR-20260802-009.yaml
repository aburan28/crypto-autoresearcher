correction:
  id: CORR-20260802-009
  recorded_at: 2026-08-02
  record_type: claim
  record_id: GOAL-AES-003
  field: research_goal.latest_verified_commit and latest_verified_commit_note
  prior_value: >-
    The field held the string `TASK-20260802-909`, a TASK ID and not a commit
    SHA. Directly beneath it, the note still read "NULL BY FACT. This field
    binds to the last VERIFIED LEDGER ARCHIVE of this goal and there has been
    none." The two disagreed with each other: the field asserted an archive had
    advanced the checkpoint while the note asserted none existed. Both were
    wrong, in opposite directions, and neither was true of the repository.
  corrected_value: >-
    The field is set to null and the note now states the specific facts.
    (1) THE ARCHIVE WAS MADE. Commit 669b385b carries EV-AES-005,
    DEC-20260802-9bda5c, CORR-20260802-ab8656, the validator package and the goal
    checkpoint, and is reachable from HEAD and from origin. Its thirteen paths
    are bound by sha256 in the TASK-20260802-909 ledger receipt, which is
    backfilled with the commit and parent SHAs in the same change as this
    correction.
    (2) IT IS NOT DISPATCHER-VERIFIED, so under AGENTS.md rule 7 EV-AES-005 and
    DEC-20260802-9bda5c are PUBLISHED BUT NOT OFFICIAL, and the checkpoint field
    stays null. Two structural reasons, neither repairable without rewriting
    pushed history, which the immutability rules forbid:
      (a) research_dispatch.py requires the archive commit message to name the
          archive task id and every record id; the message names the two record
          ids but not TASK-20260802-909.
      (b) The verifier requires the archive commit to change EXACTLY the
          archive's own artifacts plus every source task's artifacts. Source
          TASK-20260802-908's artifact, red_team_report.yaml, rode the earlier
          commit a7d9437f, because the red team finished first and its findings
          were acted on immediately -- two corrections to this campaign's own
          receipts, CORR-20260802-003 and CORR-20260802-007, came out of it.
          Acting on them promptly was right; committing the report alongside
          them is what broke the archive's path set.
    TASK-20260802-909 accordingly stays `queued` in the BATCH-001 queue, which
    is the honest state, and research_dispatch.py validates the queue in that
    state.
  reason: >-
    Found by the Coordinator while auditing the BATCH-001 checkpoint after the
    ledger commit, not by a reviewer. Nothing in EV-AES-005 or DEC-20260802-9bda5c
    is retracted or weakened by this: the validator's re-execution rests on its
    own artifacts and its own keys, and the refutation of the counting-artifact
    hypothesis is deterministic. What is missing is the harness's officiality
    gate, and saying the evidence is fine is not a substitute for passing it.
    ROOT CAUSE, AND IT IS THE SAME ONE TWICE IN ONE BATCH. TASK-20260802-906
    already recorded that this batch's producer artifacts were committed ad hoc
    before the batch had a queue. This is that same defect at the other end of
    the lifecycle: review artifacts committed as they landed rather than staged
    by the archive task alone. The dispatcher's exact-path rule assumes the
    archive task is the only writer of the commit, and a batch that runs its
    lifecycle out of order cannot satisfy it retroactively.
    CORRECTIVE ACTION FOR BATCH-002, binding: every review artifact is left
    uncommitted until the ledger archive task stages it, the archive commit
    message names the archive task id and every record id, and the archive is
    verified with research_dispatch.py BEFORE the goal checkpoint is written
    rather than after.
  evidence_artifacts:
    - ledger/goals/GOAL-AES-003.yaml
    - coordination/goals/GOAL-AES-003/batches/BATCH-001/archives/TASK-20260802-909/ledger-receipt.json
    - coordination/goals/GOAL-AES-003/batches/BATCH-001/archives/TASK-20260802-906/snapshot-receipt.json
    - coordination/goals/GOAL-AES-003/batches/BATCH-001/dispatch_queue.json
