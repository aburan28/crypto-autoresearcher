correction:
  id: CORR-20260802-009
  recorded_at: '2026-08-02'
  record_type: schema
  record_id: PROPOSAL-KEY-PMA-IDS-AND-DOCUMENTED-NULL-HYPOTHESIS
  field: three unrelated schema defects
  reason: >-
    Three defects cleared together, none of which changes a research claim.
  proposals:
    what: >-
      IDEA-20260724-001 and -002 were committed under a `proposal:` top-level
      key with `statement:` where the schema says `claim:`. 69 of 71 proposals
      use `idea:`; these two never parsed as idea records, so no field rule ever
      applied to them.
    resolution: >-
      Key renamed to `idea:` and `statement` to `claim` (no idea record carries
      both, so they are the same field under an older name). `class` is set
      from each proposal's own description -- control for -001, which adds the
      baseline-invisible synthetic control, and measurement for -002, the
      library-facing adequacy probe. `novelty_status: adaptation` is the label
      the existing `novelty_screen` prose already argues for: both texts say
      "not a new cryptanalytic mechanism" and describe a direct repair or
      successor. The screen text is kept as the rationale.
  pma_identifier_rename:
    what: >-
      RQ-PMA4-001, H-PMA4-001 and EXP-PMA4-001 carry a digit-bearing area code,
      which the identifier patterns forbid -- the defect CORR-20260728-001
      recorded when EXP-RT1476-001 shipped and was reissued as EXP-SUBRES-001.
    resolution: >-
      Reissued as RQ-PMA-001, H-PMA-001 and EXP-PMA-001. The 4 denoted the 4x4
      matrix size, which the question title and scope already state, so no
      information is lost. Only the three full identifier strings were
      substituted: all 14 uses of bare "PMA4" as prose naming the method
      (ordinary PMA4 anchored orientation quadratics) are untouched, verified
      by count before and after.
  documented_null_hypothesis_id:
    what: >-
      EV-ECDLP-009, EV-ECDLP-010, EV-AES-d33b1c and the EXP-YIELD-002 and
      EXP-YIELD-003 contracts declare `hypothesis_id: null` DELIBERATELY, each
      with a long sibling note explaining why. EXP-YIELD-002 is an instrument
      control on another experiment's control object; EV-ECDLP-009 states
      plainly that "naming a hypothesis here would invite exactly the inference
      the run cannot support."
    why_this_is_a_schema_defect_not_a_record_defect: >-
      The validator required the field non-empty, so it pushed those records
      toward naming a hypothesis they explicitly must not name. The rule
      inverted its own purpose: it existed to stop evidence floating free of a
      hypothesis, and instead pressured scope-honest records into a false
      binding. These records are more rigorous than the schema allowed.
    resolution: >-
      validate_ledger accepts an explicit null for hypothesis_id when the record
      documents the choice in a sibling hypothesis_id_note or hypothesis_note.
      A silently absent field is still an error, an empty or whitespace note is
      still an error, and the allowance applies to no other field. Verified
      against all six cases.
  substantive_delta: >-
    None. No claim, direction, strength, scope, proof level or hypothesis
    status is created, altered or withdrawn. The documented-null change records
    that these experiments and evidence records bear on no hypothesis, which is
    what they already said in prose.
  status_effects:
    hypothesis_status_changed: false
  supersedes: null
  superseded_by: null
