correction:
  id: CORR-20260904-00b27d
  recorded_at: '2026-09-04'
  recorded_by: coordinator
  type: two_findings_from_independent_followup_verification_small_formula_error_and_empirical_corroboration_does_not_survive_decontamination
  severity: low_neither_finding_changes_any_conclusion
  supersedes: []
  corrects:
    - experiments/EXP-MONO-005b49/reviews/red-team-breakthrough/red-team-report.yaml (group-uniform closed form)
    - ledger/evidence/EV-MONO-9c760b.yaml (FB4 100-cell panel corroboration claim)
    - ledger/decisions/DEC-20260904-d79f75.yaml (next_action items 1 and 2, now discharged)

  finding_1_group_uniform_formula_error_found_by_independent_rederivation: >-
    Per DEC-20260904-d79f75 next_action (1), a fresh Validator session
    performed a genuinely blind-first rederivation (own derivation and own
    1511+44-curve brute-force validation completed BEFORE reading the Red
    Team's report) of the two exact closed forms. The TRANSVERSAL formula
    is CONFIRMED exactly (algebraically identical). The GROUP-UNIFORM
    formula has a genuine, precisely located error: the Red Team computed
    Pr[COLLISION(k=3, epsilon=+1)] correctly but then multiplied by 6,
    treating the six class-pair collision conditions as exchangeable --
    valid for the transversal arm but INVALID for group-uniform sampling,
    because the sequential distinct-key rejection sampler draws its three
    points non-exchangeably (P1 ~ U(N), P2 ~ U(N-c1), P3 ~ U(N-c1-c2)).
    The six conditions take three DISTINCT values with Pr[k=1] < Pr[k=2] <
    Pr[k=3], and the largest was the one multiplied by 6, causing an
    OVERSTATEMENT of +10.09% at N=13, +3.74% at N=12, +0.098% at cell 1,
    +0.016% at cell 2. The Red Team's own brute-force check
    (`brute_gu`) shares the identical `6x-single-condition` structure and
    could never have caught this; nothing in the original archive tested
    the group-uniform form independently of its own analytic derivation.
  finding_1_consequence: >-
    THIS ERROR CHANGES NO CONCLUSION IN THIS CHAIN. Cell 1's true effect
    remains EXACTLY zero (both curves receive the identical incorrect
    value under the flawed formula, so their equality -- the load-bearing
    claim -- is untouched). Cell 2's corrected exact P3 is
    0.99957538460151266 (vs. the Red Team's 0.99957533425646642) -- a
    difference of 5.03e-8, same sign, same order of magnitude, identical
    qualitative conclusion (a tiny, opposite-signed true effect). The
    calibration figures reproduce almost exactly (mean z=-0.0096,
    sd=0.9118, vs. the Red Team's -0.010, 0.915). DEC-20260904-d79f75's
    verdict does NOT need reopening: this is precisely the
    wrong-but-consistent-implementation failure mode independent
    rederivation exists to catch, and it changed a fifth decimal place,
    not a conclusion.
  finding_1_disposition: >-
    The TRANSVERSAL formula is confirmed by two independent full
    derivations and ready for knowledge promotion at DETERMINISTIC tier.
    The GROUP-UNIFORM formula is corrected (superseding the Red Team's
    published version) but, per the rederiving Validator's own
    conservative recommendation, awaits ONE more independent check before
    DETERMINISTIC-tier promotion -- the corrector is now in the same
    single-party position the original derivation was in. This Coordinator
    judges this a low-priority follow-up given the bounded, tiny (<=0.1%)
    magnitude of the remaining uncertainty and the diminishing returns of
    a further round; it is recorded as open rather than dispatched
    immediately.

  finding_2_panel_corroboration_does_not_survive_decontamination: >-
    Per DEC-20260904-d79f75 next_action (2), an Executor re-analyzed
    RUN-MONO-cb905d-1's Part B 100-cell panel after partitioning out the
    64 supersingular-contaminated cells (CORR-20260904-30a8ce) --
    independently confirming the exact 64/100, 58-distinct-curve
    contamination count via its own rebuild of the archived construction
    code, with zero mismatches. On the CLEAN 36-cell subset, the exact
    conditional-binomial CM/ordinary ratio is 1.009604, 95% exact CI
    [0.982383, 1.037580] -- THE CI NOW INCLUDES 1. The full-100-cell
    figure previously cited as corroborating evidence (EV-MONO-9c760b:
    ratio 1.01798, CI [1.00016, 1.03612], excluding 1) was itself
    substantially driven by the contaminated cells: the contaminated-only
    subset alone reproduces the significant result (ratio 1.024056, CI
    [1.000593, 1.048071]).
  finding_2_consequence: >-
    THE VALIDATOR-BREAKTHROUGH'S OWN FB4 FINDING, WHICH THIS COORDINATOR
    HAD ALREADY FLAGGED AS "PROVISIONAL" IN EV-MONO-9c760b, DOES NOT
    SURVIVE THE REQUIRED PARTITION. There is now NO surviving empirical
    corroboration, from this panel, of a real CM-vs-ordinary effect at any
    magnitude -- the apparent corroboration was itself a contamination
    artifact, plausibly because supersingular curves (endomorphism ring a
    maximal order in a quaternion algebra, not an imaginary quadratic
    order) have their own distinct collision-rate behavior unrelated to
    any genuine CM-vs-ordinary comparison. This DOES NOT reopen
    DEC-20260904-d79f75's own refutation of the pooled two-cell headline
    (that refutation never depended on the 100-cell panel). It DOES mean
    the only remaining basis for the "endomorphism ring enters via #E[4]"
    finding is the exact closed-form derivation itself (now doubly
    confirmed for the transversal arm, corrected-and-pending-one-more-
    check for the group-uniform arm), not any independent empirical
    corroboration from sampled data.
  finding_2_disposition: >-
    EV-MONO-9c760b's own characterization of the 100-cell panel as
    "corroborating" is superseded by this record; future citations of
    that panel must use the clean-subset figures (1.0096, CI including 1)
    and must not cite the contaminated full-panel figure as evidence.
    The se_deviation asymmetry (ordinary vs. CM, per Part B's own
    approximate closed form) DOES persist on the clean subset (+0.060 vs.
    +0.188, gap ~0.13, consistent across variants tested), supporting the
    #E[4]-explanation qualitatively even though the panel's own POOLED
    RATIO corroboration does not survive. The executor additionally
    disclosed, rather than silently reconciled, an inability to exactly
    reproduce the specific "-0.002/+0.293" se_deviation figures cited
    elsewhere in this chain despite trying several plausible method
    variants -- flagged here for any future reader who traces that
    specific number, though it does not affect the qualitative persistence
    finding.

  reason: >-
    AGENTS.md rule 4 requires disclosure of both findings regardless of
    their small individual impact: a load-bearing derivation was
    corrected by exactly the process this program's own review
    architecture calls for, and a previously-cited piece of corroborating
    evidence was found not to survive a required data-quality check. Both
    are genuine updates to the record, and both discharge named next
    actions from DEC-20260904-d79f75.

