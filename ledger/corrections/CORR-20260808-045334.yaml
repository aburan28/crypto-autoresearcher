  record_id: EXP-INSTR-85b102
  field: >-
    CTRL-VALUESHUFFLE's terminal state STRUCTURE_PRESENT, every reading built on
    it, and the descriptive clause of execution report section 12 item 3
  source: >-
    RT-20260808-5e244e, the AGENTS.md rule 12 `review-breakthrough` review, at
    coordination/goals/GOAL-ENDO-001/batches/BATCH-aa267f/reviews/breakthrough/
    report.yaml. Commissioned by this Coordinator as the gate on any evidence
    record from this line, with an explicit instruction to be willing to fail it.
    It did.
  prior_value: >-
    CORR-20260807-f551a5 read CTRL-VALUESHUFFLE's STRUCTURE_PRESENT as a real but
    direction-inverted finding weakened by one partly circular arm contributing
    33.2% of the effect, and
    coordination/goals/GOAL-ENDO-001/batches/BATCH-aa267f/analysis/
    valueshuffle-ncoupled-excluded.md concluded that "the effect survives removal
    of its circular component" because excluding the four N-coupled functionals
    left the observed value below the entire null support (50 against a null
    minimum of 71, gap 39 cells).
  corrected_value: >-
    THE CONTROL IS VOID AND ITS TERMINAL STATE IS UNINTERPRETABLE -- not
    inverted-but-surviving, not weakened-but-standing. STRUCTURE_PRESENT is
    withdrawn. The analysis artifact's survival claim is WITHDRAWN. The 33.2%
    figure in CORR-20260807-f551a5 is superseded: the correct figure is 100%.
  the_three_deciding_numbers:
  - id: V1
    finding: >-
      THE STATISTIC IS INVARIANT UNDER THE CORRECTLY MATCHED CONDITIONAL NULL.
      The type-A residue is a function of the value multisets inside the finest
      non-degenerate N-bands and nothing else: T_obs cancels out of the ordering
      and E[T_pi | rung] depends only on block-pooled variances, and the realized
      ladder is a genuine nested refinement at all 16 adjacent rung pairs, so the
      whole sequence reduces to the finest bands. A within-class shuffle returns
      EXACTLY 50 in 30 of 30 replicates; a within-finest-band shuffle returns
      EXACTLY 50 in 30 of 30. Variance exactly zero, p = 1.0 -- CONTROLLED_NULL
      under the amendment's own frozen rule.
    consequence: >-
      Amendment v2's `state_2` definition -- "the reversal pattern depends on
      WHICH curve carries which value" -- is FALSE AS ARITHMETIC. My uniform
      shuffle broke the conditioning the statistic is defined on, so it was never
      testing what the contract said it tested.
  - id: V2
    finding: >-
      AN OBJECT WITH ZERO ARITHMETIC CONTENT REPRODUCES THE ENTIRE RESULT. A pure
      N surrogate (slope*N plus matched noise -- the version-1 CTRL-NSURR object)
      gives residue median 48 against the observed 50, and falls below the
      committed null minimum of 89 in 60 of 60 draws.
    consequence: >-
      "Observed lies below the entire null support" is not evidence of structure;
      it is what a pure function of N does. This answers the B4 suspicion the
      review was asked to press hardest on: not a bug, and not a finding.
  - id: V3
    finding: >-
      MY EXCLUSION SET WAS THE WEAKEST DEFENSIBLE ONE AND THE GAP DECAYS
      MONOTONICALLY AS COUPLING IS STRIPPED. The four functionals I excluded are
      exactly the R^2 >= 0.9994 stratum. Sweeping the threshold instead:
      excluding cells with eta^2 >= 0.02 against the finest N-band leaves
      observed 40 against a null median of 41, p = 0.887 -- CONTROLLED_NULL. The
      reviewer's gap sequence as coupling is stripped is -58, -39, -34, -30, -12,
      -1, +4: monotone decay through zero and a sign change.
    coordinator_independent_check: >-
      CONFIRMED DIRECTIONALLY BY MY OWN RE-DERIVATION, from the committed
      per-replicate by_functional counts. Progressively excluding the most
      shuffle-sensitive functionals gives gaps 57.63, 51.28, 44.94, 40.16, 35.50,
      30.90, 26.60, 22.32, 18.24, 14.66, 11.96, 9.34, 7.02, 5.37, 3.72 --
      monotone decay toward zero with no plateau anywhere. My published cut sat
      at the third step (40.16). It was not a principled correction; it was an
      early stopping point on a continuum, and I presented it as a survival.
  a_fourth_finding_that_subsumes_the_control_entirely: >-
    A uniform value shuffle and a uniform label shuffle induce the same
    distribution, so CTRL-VALUESHUFFLE's null IS NULL-C -- the contaminated free
    permutation this very contract exists to replace, and which version 1 already
    rejected at p_lower = 9.999e-05. I designed a control whose null object is
    the thing the experiment was built to retire, and did not notice.
  what_i_got_wrong_and_how: >-
    I wrote and approved amendment v2 from RT-20260807-743198's item-4
    specification. I caught one circular arm after the fact (CORR-20260807-f551a5
    finding 2) and treated the remaining 66.8% as unexplained residue. That was
    the error: I checked whether the excluded set was circular, not whether the
    STATISTIC was invariant under the null I should have drawn. The invariance
    check costs 30 replicates and settles it outright. Having found one design
    defect I stopped looking, and the record of that is this file.
  additionally_corrected_execution_report_section_12_item_3: >-
    A DEFECT NEITHER PRIOR REVIEW CAUGHT, in the same sentence whose noise
    attribution CORR-20260807-732541 already refuted. Its DESCRIPTIVE clause --
    "most non-monotone cells are within ~0.5% of 1 at the free rung" -- is also
    false: the true count is 21 of 74 (28%), with median |R_free - 1| = 0.0155.
    Cite neither clause of that sentence.
  what_survives_unchanged:
  - >-
    CORR-20260807-732541 IS UPHELD IN FULL and independently re-verified a third
    time: 74 of 144 non-monotone on the empirical ratio, 74 of 144 on the exact
    closed form, 144 of 144 cells agreeing. The reviewer additionally verified
    the PREMISE rather than assuming it, re-deriving the closed-form null mean
    from per_curve.csv and rung_table.json with no harness import -- 720 cells,
    maximum relative deviation 6.5e-16. The Monte-Carlo attribution stays
    refuted.
  - >-
    RT-20260807-743198's N-coupling clustering result stands: monotone in 24 of
    24 cells whose functional is exact or affine in N, non-monotone in 74 of 120
    others, Fisher exact one-sided 2.6e-09; and Delta_max(N) does not order the
    null means of functionals the N-blocking does not act on.
  - >-
    Both Validators' ten passed checks are untouched, as are all version-1 run
    records. Nothing here bears on EXP-ICINV-4d33aa, EV-ENDO-10109d, or
    CORR-20260807-d78e2f's confound.
  the_honest_count: >-
    I wrote that "three candidate explanations have been eliminated and none
    confirmed". THE HONEST COUNT IS ONE. Monte-Carlo noise is eliminated. The
    blocking-geometry-artifact explanation is NOT eliminated -- it is what V1, V2
    and V3 each independently support. The m = 3 localization was never
    established and remains withdrawn.
  one_live_object_flagged_by_the_review_and_not_previously_recorded: >-
    `two_torsion_x` sits at the resolution floor with R = 0.647 at POOL_C R4 and
    R = 0.912 at POOL_D R3, the POOL_C case being the stronger and, as far as the
    reviewer could find, unrecorded anywhere in this campaign. It is FLAGGED, not
    claimed: no control has been run against it and it carries no interpretation
    here.
  required_action:
  - >-
    STRUCTURE_PRESENT may not be cited in any formulation. Cite this record
    instead. The two valueshuffle runs are retained (AGENTS.md rule 4) and are
    readable as what they are: a control whose null object was mis-specified.
  - >-
    The analysis artifact valueshuffle-ncoupled-excluded.md is WITHDRAWN as to
    its conclusion. Its arithmetic is correct and its numbers reproduce; what is
    wrong is the inference that a gap surviving one weak exclusion threshold
    means the effect survives.
  - >-
    DO NOT COMMISSION A REPLACEMENT SHUFFLE. Version 1's blocked conditional test
    is already committed at B = 10000 and disposes of the withdrawn m = 3
    localization more cheaply (`sumset_m3` p_lower 0.7786 / 0.7303 / 0.5724 /
    0.06919, R = 0.997-1.003).
  - >-
    Exactly ONE evidence record is permitted from this line, EV-INSTR-03fdcf, for
    the B1 finding only, at strength `replicated` and `claim_tier: toy`. Refused
    at any strength: anything from CTRL-VALUESHUFFLE, "the effect survives
    removal of its circular component", STRUCTURE_PRESENT in any formulation, and
    "three candidate explanations eliminated".
  - >-
    Add to the campaign's control-design obligations, above the one added by
    CORR-20260807-f551a5: BEFORE drawing a null, check whether the statistic is
    INVARIANT under the conditional null the statistic is actually defined on. It
    costs tens of replicates and it is what would have caught this at design
    time.
  review_independence_limitation_carried_forward: >-
    This review resolved to the same model on the same backend as the Coordinator
    and the prior Red Team, so "independent" means independent context and a
    fresh adversarial reading, not independent judgement from a different model.
    Recorded in the report's own inference block rather than concealed, and
    repeated here.
