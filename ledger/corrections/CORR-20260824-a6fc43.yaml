  record_type: run
  record_type_note: >-
    STATED RATHER THAN SILENTLY PICKED, following the precedent CORR-20260824-e0088c
    set for the same gap. templates/research-records.md admits exactly candidate |
    claim | run for `record_type`, and NONE names "an evidence record's account of
    where its producer's charged runs live and whether they can be cited", which is
    what is corrected below. `run` is the CLOSEST TRUE value: what is corrected is a
    statement about the SIX CHARGED RUNS of EXP-DIFFP-fe894e executed by
    TASK-20260824-c6625a. It is not `claim` (no claim rests on it) and not
    `candidate` (there is no candidate object). The schema gap is offered to whoever
    owns the template; it is not fixed here.

  record_id: ledger/evidence/EV-DIFFP-b878aa.yaml
  corrected_record: ledger/evidence/EV-DIFFP-b878aa.yaml
  field: run_ids, and the `run_ids_note` that explains it
  prior_value: >-
    run_ids empty, with a note attributing the emptiness to the load-bearing ablation
    battery having been review-side computation carried out against the snapshot-bound
    source with no run directory, no RUN-* identifier, no manifest and no armed
    deadline, read from committed review reports rather than from charged runs.
  corrected_value: >-
    THE NOTE IS TRUE ABOUT THE ABLATION BATTERY AND INCOMPLETE ABOUT THE RECORD, AND
    THE PART IT OMITS IS THE PART THAT MATTERED.
    BATCH-f8bf86's producer task TASK-20260824-c6625a executed SIX CHARGED RUNS under
    EXP-DIFFP-fe894e, with manifests, declared seeds and armed deadlines, at
    `coordination/goals/GOAL-DIFFP-84d641/batches/BATCH-f8bf86/tasks/TASK-20260824-c6625a/runs/`.
    THEY EXISTED AND THEY WERE NOT CITED.
    HAD THEY BEEN CITED, EV-DIFFP-b878aa WOULD HAVE FAILED tools/validate_ledger.py
    FOR EXACTLY THE REASON EV-DIFFP-b16b01's FIRST DRAFT DID: the validator registers
    runs from a single glob, `experiments/*/runs/*/manifest.yaml`, and checks evidence
    `run_ids` against the ids that glob registered plus `ctx.legacy_aliases`. This
    campaign has never written a run directory under that root, so no evidence record
    of this goal could cite a run by id at the time either record was written.
  what_the_corrected_field_does_NOT_become: >-
    `run_ids` IS NOT CHANGED TO NAME THE SIX RUNS, AND THIS RECORD DOES NOT ASK FOR
    THAT. Citing them there would break the ledger exactly as it did in batch 2. The
    empty list stays; what is corrected is the RECORD'S ACCOUNT OF WHY IT IS EMPTY.
    The value was right for a reason the record did not give.

  goal_id: GOAL-DIFFP-84d641
  batch_id: BATCH-f8bf86
  question_id: RQ-DIFFP-a5c483
  experiment_id: EXP-DIFFP-fe894e
