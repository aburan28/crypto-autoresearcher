  the_finding_this_record_exists_to_make_durable: >-
    THE HARNESS HAS A SINGLE HARD-CODED RUN-DISCOVERY ROOT AND NO CHECK THAT A PRODUCER
    WROTE ITS RUNS WHERE AN EVIDENCE RECORD WILL LATER CITE THEM. A producer can
    complete, be archived, be reviewed by two independent sessions and pass a
    content-first snapshot before the mismatch appears, because the only thing that
    tests it is an evidence record finally citing a run id. ELEVEN RUN DIRECTORIES
    ACROSS TWO BATCHES OF THIS CAMPAIGN ARE AFFECTED.
    IT IS THE SAME SHAPE AS THE COORDINATION PARSE GAP THIS ROUND ALSO RECORDED -- A
    CHECK THAT EXISTS BUT DOES NOT COVER WHERE THE WORK LANDS -- WITH ONE INSTRUCTIVE
    DIFFERENCE THE DRIVING SESSION MEASURED AND WHICH SHARPENS RATHER THAN WEAKENS IT:
    `check_merge_hygiene.py` parse-gates `ledger/**.yaml`, so a malformed record in
    `ledger/` IS caught by CI, while `coordination/**` has its `.json` checked and its
    `.yaml` not. The gate works exactly where it is pointed, and it is pointed at two
    of the three trees this program writes records into. The cheapest real fix for the
    run half is a check at the SNAPSHOT archive that every run directory reachable from
    a task's run-index.json is discoverable by the validator's glob -- where it would
    have fired before two independent reviews were spent.
    THIS IS INFRASTRUCTURE SIGNAL AND IS NOT EVIDENCE ABOUT MD5, SHA-1, THE
    ADJUDICATOR, THE CENSUS OR THE EQUIVALENCE, IN ANY DIRECTION.

