  raised_by: >-
    THE LEDGER VALIDATOR, AT THE BATCH-efcae7 CLOSE, AGAINST A DIFFERENT RECORD. The
    driving session ran tools/validate_ledger.py against the first draft of
    EV-DIFFP-b16b01 and it failed with five errors, one per cited run id, of the form
    "evidence references unknown run"; nothing else in the repository failed. The
    Coordinator subagent TASK-20260824-b3e02b then read the mechanism from committed
    source rather than accepting the diagnosis, established that no field shape
    resolves a run outside the glob, and asked whether the same condition held for
    batch 1. IT DID.
  filed_under: DEC-20260824-c5bb72 `corrections_owed` item 2 and `run_registration_defect`
  id_provenance: >-
    CORR-20260824-a6fc43 was MINTED AND VERIFIED FREE BY THE DRIVING SESSION and
    transmitted to the coordinator subagent that wrote this record. That subagent has
    no shell and minted no identifier of any kind.

  # ====================================================================
  reason: >-
    SO THAT THE DEFECT IS RECORDED AGAINST BOTH BATCHES RATHER THAN ONLY AGAINST THE
    ONE THAT CITED ITS RUNS.
    EV-DIFFP-b878aa VALIDATED CLEANLY IN PART BECAUSE IT CITED LESS. Its `run_ids: []`
    never exercised the property that failed in batch 2, so a green validator on that
    record was weaker evidence than it looked -- not wrong, but silent about a
    condition it did not test. WITHOUT THIS CORRECTION A LATER READER TREATS BATCH 1 AS
    THE WELL-BEHAVED PRECEDENT AND BATCH 2 AS THE DEVIATION, WHICH IS PRECISELY
    BACKWARDS: batch 2 did the more rigorous thing, cited its runs, and that is why the
    defect surfaced at all.
    THIS CORRECTION MAKES THE EARLIER RECORD LOOK WORSE, NOT BETTER, AND THAT IS THE
    DIRECTION A CORRECTION SHOULD RUN. A correction filed to improve the appearance of
    the record it touches is the failure mode; this one exists because the earlier
    record's silence would otherwise be read as a clean bill of health.

  evidence_artifacts:
    - "tools/validate_ledger.py -- the run-discovery glob experiments/*/runs/*/manifest.yaml, and the evidence run_ids check against ctx.ids plus ctx.legacy_aliases"
    - "ledger/evidence/EV-DIFFP-b16b01.yaml -- run_registration_status, including the three candidate resolution mechanisms and why none applies"
    - "ledger/decisions/DEC-20260824-c5bb72.yaml -- run_registration_defect, the three options ruled on, and PD-11"
