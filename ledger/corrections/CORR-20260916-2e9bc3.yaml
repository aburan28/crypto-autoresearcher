correction:
  id: CORR-20260916-2e9bc3
  recorded_at: '2026-09-16'
  recorded_by: coordinator
  area: ICPERF
  supersedes_on_this_point_only: []
  extends: CORR-20260916-5166fe
  what_it_extends: >-
    CORR-20260916-5166fe recorded a concurrent session editing an immutable, hash-pinned epoch-1 run
    manifest in place. This records the SECOND instance of the same act in the same batch, against
    different files, and therefore promotes it from a slip to a pattern with a named mechanism and a
    prescribed alternative.

  defect:
    what: >-
      A PRODUCER'S FILED ARTIFACTS WERE EDITED IN PLACE, AND THE PRODUCER IS THE REVIEWER WHOSE VERDICT
      BREAKS ON EXACTLY THAT. Commit e85791e6e (concurrent session) modified
      coordination/review/icperf-20260915-a33cda/TASK-20260915-3f4b52/artifacts/r3/compare.py and
      regenerated compare_out.json beside it. Both files were committed as part of the R1-R5 reviewer's
      producer snapshot at 89d034156, before any composition.
    the_substance_was_right: >-
      The bug is real and the fix is correct. `leaves()` emits list elements as `<field>[i]`, so the
      classifier's `last in NEW_FIELDS` test could never match them, and the 16 entries of the new
      `unevaluable` lists were recorded as UNATTRIBUTED. The concurrent session reproduced the committed
      output byte-for-byte with the unfixed script before changing it, which is the right discipline.
      This correction disputes NOTHING about the finding.
    what_was_wrong_was_the_mechanism: >-
      A reviewer's artifacts are its report. Editing them after it files means a later reader cannot tell
      what the reviewer actually produced from what someone else improved afterwards, and the reviewer
      cannot be asked, because its session is gone.
    why_this_instance_is_worse_than_the_first: >-
      TASK-20260915-3f4b52's R5 verdict BREAKS partly on custody. It cites, in its own words, that the
      committed manifest.yaml was edited in place by a concurrent session and restored by merge DURING
      its review window, and that bench.py changed after the run and during review. Its artifacts have
      now been edited after it filed. The reviewer that raised custody as a break condition became the
      third instance of it.
    what_it_did_not_break: >-
      Stated precisely, because the difference from CORR-20260916-5166fe matters: NO COMPLETED ARCHIVE
      BINDING WAS BROKEN. These paths are not in any completed archive's path_sha256 — the archive that
      will bind them, TASK-20260915-efa91b, is still queued with an empty binding. The first instance
      broke a live hash pin; this one did not. It is an integrity defect in the record, not in an
      archive.

  resolution:
    - >-
      The reviewer's two files are RESTORED to the bytes it filed at 89d034156, verified by sha256
      (compare.py 9fdf6a41…a927c, compare_out.json 2d581079…75b286). Its report is again exactly what it
      submitted.
    - >-
      The fix is PRESERVED, additively and under new names, at
      coordination/review/icperf-20260915-a33cda/coordinator-r3-reattribution/ with a README naming its
      true author (commit e85791e6e), what it changes, and what this session did and did not verify. It
      is Coordinator-owned rather than a sibling inside TASK-20260915-3f4b52/, because writing into a
      producer's declared write scope is the same ownership error mirrored.
    - >-
      The re-attribution was checked leaf by leaf rather than taken on the commit message: flattening
      both JSONs gives 249 leaves and exactly 66 differences — the 16 re-classified entries at four
      fields each plus two count keys. n_differences stays 135, n_leaves stays 491/619, UNATTRIBUTED goes
      16 -> absent, new_reporting_field goes 68 -> 84, and all 16 are `unevaluable[i]` entries under P2
      (12), P5 (3) and P6 (1). No verdict, ratio, cell or measurement moves.
    - >-
      NOT re-derived: the JSON was not regenerated here, because that needs the scratch directory the
      concurrent session reconstructed and did not commit. What is established is that the script diff is
      two lines and that the output differs in exactly the leaves those two lines can explain. Recorded
      as such rather than as a reproduction.

  bearing_on_the_composition_of_REVIEW_ICPERF_20260915_a33cda: >-
    R3's verdict is unaffected and its evidence is slightly STRENGTHENED: the re-attribution turns a hand
    correction in the reviewer's prose (ADD1-c) into a machine-checkable one, and it agrees with the
    reviewer. R5's custody clause gains a third instance and the composition must report it as such —
    the reviewer broke R5 partly because artifacts moved during review, and one more moved after it
    filed. That does not make R5's break heavier in substance; it makes the reviewer's diagnosis of the
    environment more accurate than the Coordinator's, which is the second time this round.

  forward_guidance:
    - >-
      A FILED PRODUCER ARTIFACT IS SUPERSEDED, NEVER EDITED, and the superseding copy lives OUTSIDE the
      producer's directory. The pattern is the same one the run schema needed twice already:
      manifest.yaml -> manifest_v2.yaml, compare.py -> coordinator-r3-reattribution/. The cost is a
      second file and a pointer; the cost of the alternative is a report no reader can trust the
      provenance of.
    - >-
      "NOTHING IS PINNED YET" IS NOT A LICENCE. This edit broke no archive only because the ledger
      archive had not run. The correct reading is that it landed inside the window where the fix was
      still cheap, not that the window makes editing acceptable — the very next commit binds these paths.
    - >-
      A CHECK IS AVAILABLE AND IS NOT YET WRITTEN. `check_merge_hygiene.py` sees the files a branch
      touched; it does not know which of them a producer snapshot already committed. A check that flags
      "this change modifies a path introduced by a snapshot commit whose task is complete" would have
      caught all three instances in this batch before they merged. Ranked as tooling work under
      GOAL-ICPERF-e6b6a4, and named here so it is not lost.
    - >-
      WHEN A CONCURRENT SESSION IS RIGHT, KEEP ITS FINDING AND FIX ITS MECHANISM. Both instances in this
      batch were substantively correct work done the wrong way. Reverting the content would have
      discarded two real improvements; that is not what immutability is for.

  refs:
    - TASK-20260915-3f4b52
    - CORR-20260916-5166fe
    - BATCH-a33cda
    - coordination/review/icperf-20260915-a33cda/coordinator-r3-reattribution/README.md
  citation_provenance: internal
