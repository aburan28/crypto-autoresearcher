  decision: expand
  decision_label: >-
    Batch 1 raw-data measurement admitted; expand to batch 2 with independence
    test as the primary objective. Neither review found a blocking defect. Both
    named two blocking constraints for batch 2's comparison.

  context: >-
    GOAL-MLKEM-004 BATCH-d2a728, batch 1 of 6. Executor TASK-20260803-e53ce2
    produced a dim=60, q=127, bgj1_sieve, N=17,919 dual-vector score
    distribution at σ=2 with null object and decay sweep. Snapshot
    TASK-20260803-aa727e at commit 8cc51677f. Validator TASK-20260803-535d15
    returned accept_with_qualifications (4 deferred qualifications, 0 blocking).
    Red Team TASK-20260803-bc2f41 returned pass_with_constraints (7 objections,
    0 blocking for batch 1, 2 blocking for batch 2's comparison).

  evidence_refs:
    - EV-MLKEM-da9e3b

  review_summary:
    validator: >-
      All 6 hash checks pass (5 artifact files + snapshot commit structure).
      Certificate adequacy confirmed, including independent phase-equality
      confirmation. Secret leakage ruled out; null shape verified correct
      (b_null is truly uniform Z_q^m; correct candidate ranks 18/33 mid-pack).
      Raw-vs-summary agreement confirmed for 10 spot-checked values. Scope
      (no cost-model comparison) confirmed. DEF-1..4 all deferred, none blocking.
    red_team: >-
      Core design attack (OBJ-1 + OBJ-2): the measurement tests per-vector
      marginal means, not the independence VARIANCE structure. MATZOV.Nf's
      N formula rests on Var[T_N] = N·Var[single score]; testing this requires
      ≥50 independent sieve runs on the same instance (B2-1). The null object
      (uniform b) tests signal hallucination, not inter-vector correlation —
      the independence null needs fresh sieve runs on the same LWE problem.
      OBJ-3: all 17,919 vectors exceed the Gaussian heuristic minimum (58%
      above); any batch-2 mean comparison must use the actual norm distribution,
      not the GH-ideal. OBJ-4: wrong_mean_of_means = +0.18 is a pooled artifact;
      batch 2 must compare against the uniform-Z_q wrong-candidate population only.
      OBJ-6: CTRL-RT-4 (known-answer on MATZOV.Nf callable) absent — correctly
      deferred for batch 1 but BLOCKING for batch 2's comparison validity.
      OBJ-5, 7: near-miss gap unresolvable at N=17,919; decay curve coarse at
      σ=2→4 boundary; both are notes for batch 2.

  rationale: >-
    The measurement is physically valid and its controls hold. The null and
    decay controls both pass. The raw data is admissible and reproducible.
    The decision to EXPAND rather than ACCEPT is driven by the red team's
    structural observation: batch 1 established the ability to make the
    measurement, but the stated goal (test the independence assumption
    underlying MATZOV.Nf) requires a fundamentally different experimental
    structure — multiple independent sieve realizations of the same instance
    to estimate Var[T_N]. Batch 2 is that experiment.

  hypothesis_status_changes: []

  knowledge_promotion:
    promoted: []
    not_warranted: >-
      Batch 1 states no finding and performs no cost-model comparison.
      Nothing here is promotable under AGENTS.md rules 3–4. The red team's
      design-level observations (OBJ-1..7) are batch-2 constraints, not
      findings. AGENTS.md rule 12 UNMET and UNWAIVED; no action on any
      predecessor record.

  scope_statements:
    - Dimension 60 only; not crypto-scale; no FIPS 203 statement.
    - No ML-KEM break, no security proof, no FIPS 203 parameter set affected.
    - Rule 12 UNMET and UNWAIVED throughout this batch.

  next_actions:
    - >-
      Open BATCH-6f309b (batch 2 of 6). Producing task: rebuild instrument from
      KN-TECH-14efa5 and run ≥50 independent bgj1_sieve realizations on the
      SAME LWE instance (instance seed 20260803001) with DIFFERENT g6k Siever
      seeds. Compute T_N = sum of cosine scores for the correct candidate over
      all N=17,919 vectors for each realization. Record T_N per run. Compare
      empirical Var[T_N] against N·Var[single score] (computable from batch-1
      raw_scores.json). This is the cheapest test of the independence
      assumption. BEFORE scoring: run CTRL-RT-4 — a known-answer test on
      estimator.lwe_dual.matzov on a synthetic instance with zero error (all
      scores should be exactly cos(0)=1.0) and on a uniform-error instance
      (expected score ~0). CTRL-RT-4 is a batch-2 COMPLETION GATE, not an
      aspiration.

  decided_by: coordinator
  decided_at: '2026-08-03'

