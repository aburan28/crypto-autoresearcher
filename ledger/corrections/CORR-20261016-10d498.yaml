  field: >-
    The count of seeds the 1997 generator forwent by always taking the
    (p+1)/4 root of b^2 and never trying -b (the quadratic twist), and the
    number of runs that statement covers.
  prior_value:
    README: >-
      "On every curve with `p ≡ 3 (mod 4)` (nine published curves), `b` is the
      `(p+1)/4` root (2^−9 by chance). That is the root exponentiation returns,
      so the 1997 code never tried `−b`, which would have given the twist. In
      the four `p ≡ 3 mod 4` runs, 31 seeds were lost this way."
    DEC-20261016-264eed: >-
      "The 1997 code therefore never tried -b. In the p = 3 (mod 4) runs, 31
      candidates whose quadratic twist (reachable by -b) has prime order were
      never taken (bundle README, "Derived observations")."
  corrected_value: >-
    In the five p = 3 (mod 4) runs (p239, p192, p521, p256 and p384; p521
    contributes none), 31 candidates have a prime-order quadratic twist, the
    curve y^2 = x^3 - 3x - b0 that -b would have given. The 1997 code never
    tried them. Five of these 31 twist orders have more bits than p: p192 rows
    774, 1477, 3506 and 4492, and p384 row 1432. Those five would have failed
    the bitlen(n) <= bitlen(p) rule anyway. So 26 seeds were lost to the fixed
    root (9 / 10 / 0 / 4 / 3 by run), not 31. "Lost" means only that the -b
    curve would have passed the stated classifier criteria. Whether the 1997
    procedure would have published any of them is unknown, because the rule
    that skipped 11 of 21 accepted candidates is unexplained. P-224's 16
    twist-only rows are not part of either count: p224 = 1 (mod 4), so -b
    gives an isomorphic curve and the twist has no a = -3 model.
  scope_of_each_correction:
    README: >-
      Two errors. "four" should be "five" (or "the four runs that have
      twist-only rows"), and "31 seeds were lost" should be "26 seeds were
      lost (31 have a prime-order twist, 5 of which fail bitlen on the
      twist)". The count 31 itself, and the counts 47 and 17, are correct.
    DEC-20261016-264eed: >-
      Clarification, not a retraction. The sentence contains neither "four"
      nor "lost", and its count is literally accurate: 31 candidates with a
      prime-order twist were never taken. It cites the README sentence
      corrected above, though, and it stands in an argument about the "free
      bit" of claim A2. There it should be read as "at most 26 acceptable
      candidates were forgone", not 31. The ruling's conclusion, that A2 does
      not describe the historical generator, is unaffected.
    note_on_brief: >-
      The dispatching brief said DEC-20261016-264eed carries the "31 seeds were
      lost / four runs" wording. It carries the 31 count only. This record
      quotes both texts verbatim and corrects each for what it says.
  unaffected:
    - >-
      problems/nist-seed-selection-rule-unexplained.md (2026-10-16 entry):
      "31 candidates with a prime-order twist that were never tried". Accurate
      as a count, and not corrected.
    - >-
      research/nist_seed_provenance_20261016/census/summary.json and the six
      orders files. The data are correct (EV-SCURVE-e9d71b, C3 strong).
  reason: >-
    VAL-20261016-cd9156 check J4-3 (concern), confirmed by this Coordinator from
    out/j4_lost_criteria.json in the TASK-20261016-670480 snapshot. Five of the
    six runs have p = 3 (mod 4), and applying the bundle's own criteria to the 31
    twist orders leaves 26. The twist orders behind the five bitlen failures
    were all fully counted, and the prime ones certified by N*P = O (VAL J3-1),
    so the correction rests on certified values, not on the early-abort
    census alone. The coordinator_prior in TASK-20261016-9bf74b expected the
    "four" miscount. It did not anticipate the 26-versus-31 point.
  evidence_artifacts:
