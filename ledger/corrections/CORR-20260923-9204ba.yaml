  field: >-
    provenance.what_the_paper_claims.headline -- the extension-field modulus
    (source_record.yaml line 25, "... with p = 2^64 - 2^32 + 1 and modulus
    z^5 - 2, ...").

  prior_value: 'z^5 - 2'
  corrected_value: 'z^5 - 3'

  reason: >-
    The frozen extraction of the paper,
    inputs/PORNIN-2022-274-ECGFP5/paper_fulltext.md, defines the field at
    lines 43-53 as GF(p^5) = GF(p)[z]/(z^5 - 3) ("...all operations performed
    modulo the irreducible polynomial z^5-3"; superscripts are flattened by
    the extraction, e.g. line 46 "5 − 3), i.e. the ring of polynomials").
    Lines 160-180 give the choice explicitly: "Among polynomials in GF(p)[z],
    none of the following polynomials happens to be irreducible: ... z^5 ± 2.
    The next best choices are z^5 − 3 and z^5 + 3, which are both
    irreducible; we thus choose M = z^5 − 3." Lines 249-256 give the
    multiplication formulas with the constant 3 and state "The
    multiplications by 3 come from the reduction modulo the polynomial
    z^5 − 3." So the frozen text not only uses z^5 - 3 but states that
    z^5 - 2 is reducible over GF(p) and therefore does not define GF(p^5) at
    all. The Hermez EcMasFp5 note, frozen at
    inputs/ECMASFP5-HACKMD-2025/note_fulltext.md lines 20-41, uses the same
    field F_p[z]/(z^5 - 3) and asserts in its verification script that
    z^5 ± c for c in [0,2] is not irreducible. Independent corroboration
    recorded by the dispatching session (S4 of TASK-20260923-e9ddd2): its
    PARI re-check reproduced EcGFp5's published group order exactly over
    F_p[z]/(z^5 - 3). The EXP-GFPN-726eb2 producer used z^5 - 3 and reported
    this headline defect as an observation outside its write scope
    (experiments/EXP-GFPN-726eb2/implementation.md section 7;
    runs/RUN-GFPN-b71f2f/audit-table.yaml deviations).

  effect_on_dependent_records: >-
    None found that computed over z^5 - 2 for the deployed prime. The
    EXP-GFPN-726eb2 audit used z^5 - 3. The toy-ladder fields of
    EXP-GFPN-05ff43 use z^5 - c for small primes p' with c chosen per prime
    (experiments/EXP-GFPN-05ff43/implementation.md section 1.1 and section 5
    table, where z^5 - 2 appears legitimately for p' = 4111, 16777291 and
    65551); those are different fields and are unaffected. RQ-GFPN-c01af8
    already states z^5 - 3. Readers of the source record must read the
    headline through this correction.

  evidence_artifacts:
    - inputs/PORNIN-2022-274-ECGFP5/paper_fulltext.md
    - inputs/PORNIN-2022-274-ECGFP5/source_record.yaml
    - inputs/ECMASFP5-HACKMD-2025/note_fulltext.md
    - experiments/EXP-GFPN-726eb2/implementation.md
