  id: CORR-20260923-9204ba
  recorded_at: '2026-09-23'
  record_type: claim
  record_type_note: >-
    "claim" is the closest permitted token (record_type: candidate | claim |
    run, templates/research-records.md). The corrected artifact is a
    source-freeze record's summary of what the paper claims
    (what_the_paper_claims.headline), i.e. a transcription of a claim, not a
    candidate proposal and not a run. Precedent for the closest-token choice:
