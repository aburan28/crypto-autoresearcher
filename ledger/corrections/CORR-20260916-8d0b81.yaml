  title: >-
    The n = 131 cost surface archived in TASK-20260916-523cab used the wrong
    mixed-volume exponent, and RQ-QSP-f9bbdb's premise that 131 = -1 mod n' is
    the best case for a quasi-subfield polynomial is inverted for F_2
    coefficients: such an L has at most d^{q+1} roots there
  record_type: claim
  record_id: RQ-QSP-f9bbdb
  field: motivation (4), decision_target (a), and the analysis note's resultant-model floor
  prior_value:
    analysis_M_E: "M(E) = 2^{m(m-1)} d^{m(m-1)} (qsp_ecc2k130.py cost_cell, log2_ME = m(m-1)(1 + log2 d))"
    analysis_floor_rows: "orbit row (33, 3, 4): 2^60.6; no-orbit minimum 2^68.0 at (33, 3, 4)"
    rq_premise_4: >-
      "131 = -1 mod n' for n' in {33, 44, 66}, the BEST case of Lemma 4.1, so a
      NON-linearized lambda of degree 3 at n' = 33 or 66 is excluded by no theorem"
    rq_decision_target_a: >-
      a certified existence result for X^{2^33} + lambda(X), lambda in F_2[X]
      non-linearized, deg lambda <= 7, root count >= 2^32, to be decided by a
      finite GF(2)[x] census (at most 2^8 candidates, degree-2^33 gcds)
  corrected_value:
    analysis_M_E: >-
      M(E) = prod_{k=1}^m lambda_k with lambda_k = d^{k-1} 2^{m-1}
      = 2^{m(m-1)} d^{m(m-1)/2} (KN-LIT-0a321c Appendix A.1;
      inputs/HUANG-2020-JMC-QSP/paper_fulltext.md lines 1029-1032)
    analysis_floor_rows: >-
      orbit row (33, 3, 4): 2^53.9 (linear-algebra bound); no-orbit minimum
      2^65.8 at (27, 3, 5); Theorem 3.2 totals unchanged (2^133 / 2^126)
    rq_premise_4: >-
      For lambda in F_2[X] (equivalently, any L whose root set is
      Frobenius-stable, which is what the orbit rows require), Frobenius commutes
      with lambda, so a root x satisfies x^{2^{n'(q+1)}} = lambda^{o(q+1)}(x) and,
      since n'(q+1) = n + (n' - r), x^{2^{n'-r}} = lambda^{o(q+1)}(x): at most
      max(2^{n'-r}, d^{q+1}) roots. At n' = 33: at most d^4 <= 2401 against the
      2^32 needed. 131 = -1 mod n' is therefore the WORST case for F_2-coefficient
      quasi-subfield polynomials, and no F_2-coefficient census is needed.
    rq_decision_target_a: >-
      Decided negatively for F_2 coefficients by the argument above (verified by
      the Coordinator session for F_p coefficients; a formal fixture at toy n is
      IDEA-20260916-3f7a1c Stage 1). The open existence question moves to
      coefficients outside F_2, where no orbit reduction applies and the floor is
      >= 2^65.8; IDEA-20260916-5c9d6e proposes a general-coefficient bound,
      unverified.
  reason: >-
    The idea-generator dispatched by TASK-20260916-a93a2a re-read Appendix A.1
    against the script and reported the exponent discrepancy, and derived the
    injection bound; the Coordinator session confirmed both against the frozen
    text (the "/2" is on its own line in the extraction) and by re-deriving the
    F_p-coefficient injection. The RQ record is immutable and is NOT edited; this
    correction appends the corrected reading. The analysis note is a derived
    artifact and was regenerated in place, with a dated correction section; its
    archived hashes at commit 3b362fbd2 remain valid for that commit.
