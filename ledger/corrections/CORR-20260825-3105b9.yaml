correction:
  id: CORR-20260825-3105b9
  recorded_at: '2026-08-25'
  record_type: run
  record_type_note: 'STATED RATHER THAN SILENTLY PICKED, following the precedent CORR-20260824-e0088c
    set for the same gap. templates/research-records.md admits exactly candidate | claim | run for
    `record_type`, and none of the three names "a snapshot archive that bound an intermediate state
    of a producer artifact". `run` is the closest true value: what is corrected is the binding recorded
    by an archive task execution. It is not `claim` (no claim rests on it) and not `candidate` (there
    is no candidate object). The schema gap is offered to whoever owns the template; it is not fixed
    here.'
  record_id: coordination/goals/GOAL-SCURVE-51437e/batches/BATCH-a41eb7/tasks/TASK-20260824-6d44f8/snapshot-receipt.json
  corrected_record: coordination/goals/GOAL-SCURVE-51437e/batches/BATCH-a41eb7/tasks/TASK-20260824-6d44f8/snapshot-receipt.json
  field: path_sha256 entry for the producer task-report, and the completeness of the snapshot it
    names
  prior_value: Snapshot commit e9ebf43b9d6e bound coordination/goals/GOAL-SCURVE-51437e/batches/BATCH-a41eb7/tasks/TASK-20260824-eaf0af/task-report.yaml
    at sha256 79222b636e6107b46687dee57fafc7f0eedda51ff0a4393ba2a7ae128a652f70, with the receipt
    asserting that the committed blob hashes matched the hashes taken before staging. That assertion
    was and remains TRUE of the instant it was made.
  corrected_value: THE RECEIPT IS ACCURATE ABOUT THE INSTANT AND INCOMPLETE ABOUT THE TASK, AND THE
    PART IT OMITS IS THE PART THAT MATTERS. The producer TASK-20260824-eaf0af had NOT yet returned
    a terminal result when the snapshot ran. It subsequently revised its own task-report, adding
    post_authorship_errata that (a) direct a reader to the errata before the parameter capsule and
    (b) surgically quarantine the subset of recorded values whose only support came through the WebFetch
    path. Commit e9ebf43b9d6e therefore bound an INTERMEDIATE state of that one path. The producer-final
    state is sha256 2ad09457ee0533cd064247ea9d586850409587daf34b62f059d9bdfbd18ee325, bound by superseding
    snapshot commit 0bbf8d566f4955001e7b29a64bf846647a9de775. Both commits and both hashes stand;
    neither receipt was edited.
  cause: 'ORCHESTRATION ERROR, NOT A PRODUCER FAULT. The archive was gated on the condition "all
    three declared artifacts exist on disk" alone. The archive handoff (ledger/handoffs/TASK-20260824-6d44f8.yaml)
    requires BOTH that AND "Run only after the producer has a completed valid receipt". Only the
    second half of the gate was evaluated. File presence is not producer completion: a producer that
    has written all its declared paths may still be revising them.'
  producer_conduct: Correct throughout. Instructed mid-task not to rewrite already-finalized deliverables,
    the producer left parameter-capsule.yaml untouched and recorded its corrections in the task report
    instead, which is supersede-never-overwrite applied correctly. It also independently raised the
    WebFetch digit-corruption defect as a program-level concern rather than trying to settle it inside
    its own goal.
  scope_measured_not_assumed: All 30 archived artifact paths across the 10 archived GOAL-SCURVE-*
    batches were re-hashed against their receipts. 29 of 30 match. This one path is the only drift.
    Every other batch's producer had returned a terminal result before its snapshot ran, so the exposure
    window was open for this batch alone.
  recurrence_prevention: 'An archive must be gated on the producer''s TERMINAL RESULT, not on file
    presence. Under this runtime that means: do not run a snapshot for a producer whose agent has
    not yet reported completion, even when all declared artifact paths already exist on disk. Note
    that the coordinator subagent cannot self-enforce this, because under the claude_code binding
    it has no shell and so cannot archive at all (orchestration/roles.yaml grants the role read/search/write/edit
    only); the gate has to be held by whichever session performs the staging.'
  supersedes:
    commit: e9ebf43b9d6e
    binding: partial, one path of three
  superseded_by:
    commit: 0bbf8d566f4955001e7b29a64bf846647a9de775
    path_sha256:
      coordination/goals/GOAL-SCURVE-51437e/batches/BATCH-a41eb7/tasks/TASK-20260824-eaf0af/task-report.yaml: 2ad09457ee0533cd064247ea9d586850409587daf34b62f059d9bdfbd18ee325
  affects_claims: false
  affects_claims_note: No hypothesis, experiment, goal, evidence, safety or vulnerability status
    depends on either binding. Both snapshots archive a planning dossier that makes no scientific
    claim.
