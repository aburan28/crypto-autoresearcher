      reading_convention: >-
        Within the BATCH-020 dispatch queue, as-committed declarations belonging
        to the completed TASK-20260731-040 / TASK-20260731-041 pair read
        DEC-20260731-010, because that is what commit cac4d8b4 and its commit
        message actually contain. Live references and current-ledger reads read
        DEC-20260731-019, because that is the file present in the tree today.
        The two are the same record under two labels; this correction is the
        authority that binds them.
      scope_note: >-
        The restoration had to extend past the TASK-20260731-041 archive block:
        tools/research_dispatch.py derives an archive task's expected commit
        scope as the union of the archive task's artifact_paths and each source
        task's artifact_paths, and requires archive.path_sha256 keys to be a
        subset of it, so TASK-20260731-040's declarations had to state the same
        as-committed path. The dispatcher additionally requires the attested
        commit message to contain every id in archive.record_ids; cac4d8b4's
        message contains DEC-20260731-010, which is why the restored record_ids
        and the TASK-20260731-041 commit-message constraint are the historically
        true ones. TASK-20260731-040.write_scope was included for internal
        consistency with its own artifact_paths.
