  reason: >-
    An archive receipt is a factual description of what a commit did. It must
    state what commit cac4d8b459a44f1561d3f47835562824f7767765 actually
    contains, not the label the record was later renumbered to. This correction
    supersedes the retroactive edits made by merge da6f4fdafd to the
    TASK-20260731-041 snapshot receipt and to the TASK-20260731-041 archive
    declaration in the BATCH-020 dispatch queue, restoring the as-committed
    declarations (ledger/decisions/DEC-20260731-010.yaml / DEC-20260731-010) and
    recording the ID remap here instead, where it remains auditable. The remap
    itself is real, intentional, and retained: the live ledger record is
    DEC-20260731-019. Without this restoration
    tools/research_dispatch.py rejects the TASK-20260731-041 archive receipt
    (missing DEC-20260731-019.yaml / extra DEC-20260731-010.yaml against the
    commit's actual contents), blocking all further BATCH-020 dispatch.
