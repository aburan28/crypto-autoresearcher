# CORR-20260923-187ea3 -- the RUN-AUXIN-fd1edc escalate set and the typing of
# its one E(r) column (review joints J5 and J6, and J7 for the reading).
#
# WHAT THIS CORRECTS: WHICH rows the frozen escalate rule covers, and WHICH
# problem each row's number answers. It changes no arithmetic value, and it
# does NOT make the run citable: DEC-20260923-ce06a6 rules the run inadmissible
# as evidence (controls, binding; see CORR-20260923-64ee17). This record exists
# so that no later record repeats "six curves escalated" or reads the r+1 rows
# as Cheon's cost.
# =============================================================================
