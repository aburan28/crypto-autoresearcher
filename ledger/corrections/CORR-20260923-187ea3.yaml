  record_type: run
  record_id: RUN-AUXIN-fd1edc
  field: >-
    stop_and_escalate_curves (and every restatement of it: e_table.json,
    raw-result.json, manifest.yaml, execution-report.yaml, stdout.log), and the
    single untyped E(r) column beside rho_baseline 0.5.

  prior_value:
    stop_and_escalate_curves: [NIST-P-224, NIST-P-256, secp256k1, brainpoolP256r1, BN254-r, BLS12-381-r]
    column: >-
      One E(r) = min over both branches of log2(sqrt(m/d) + sqrt(d)) / log2(r),
      with the SAME expression on r - 1 and r + 1, placed beside rho_baseline
      0.5 "at identical accounting" with no auxiliary-input label.
    escalate_predicate_as_implemented: >-
      driver.py lines 707-715 add a row only when quantity_kind == "E(r)";
      E_bound rows are never counted.

  corrected_value:
    rule_text_ruling: >-
      The frozen rule is "if any deployed E(r) <= 0.40". An E_bound row whose
      reported minimizer is an explicit divisor d of m with expression value
      <= r^0.40 PROVES that the true E(r) <= 0.40, because E(r) is a minimum
      over divisors. Excluding such rows is an undisclosed narrowing of the
      rule, and it is not among the execution report's protocol_deviations.
      Adopted from RT-20260923-ca6b7c J5 part_i. This departs from the prior
      round's objection RT-FA9626-O4, whose two stated errors still stand: never
      promote an E_bound to an exact E(r), never read it as a specific E(r).
      The pairing rows (role deployed_pairing) are IN the rule and are
      STRATIFIED by expected_structure_flag, not excluded.
    branch_typing_ruling: >-
      The frozen expression sqrt(m/d) + sqrt(d) is Cheon's d | r - 1 cost (input
      P, [x]P, [x^d]P: ONE auxiliary power; floor about r^(1/4)). For d | r + 1,
      Cheon EUROCRYPT 2006 Theorem 2 requires the 2d consecutive powers
      g^(alpha^i), i = 1..2d, and costs O(log p * (sqrt((p+1)/d) + d)), which is
      LINEAR in d, with floor about r^(1/3). The red team retrieved and read
      Theorem 2 (IACR archive copy, sha256 2e04bcbc...73c5a), and two later
      sources it read keep the linear term. The dispatching session also read
      Theorems 1 and 2 before staging; that is a provenance note, not a review
      finding. The frozen expression therefore UNDERSTATES the published r + 1
      cost whenever d is large. Its r + 1 minima are "frozen-expression
      arithmetic", not the running time of any algorithm in the sources read.
      The r - 1 and r + 1 rows answer DIFFERENT PROBLEMS with DIFFERENT inputs
      and may not share one column or one ceiling. None found in the sources
      read is not none exists. The J. Cryptology 2010 version was not
      retrievable, and a source giving a sqrt(d) second term for d | r + 1 would
      reopen this ruling.
    escalate_set_by_reading: >-
      As the census computed it (brainpoolP384r1 VOID in every reading, field
      prime, CORR-20260923-64ee17 C1):
      (A) producer's code: the six listed. (B) the contract's literal rule with
      bounds counted, which is the reading the frozen text specifies: NIST-P-224,
      NIST-P-256, NIST-P-384, secp256k1, brainpoolP256r1, [brainpoolP384r1
      void], Ed25519-L, BN254-r, BLS12-381-r, with NIST-P-521 undetermined; on
      valid rows that is 8 of 9, NIST-P-521 undetermined. (C) typed r - 1 (one
      power): NIST-P-256, secp256k1, BN254-r, BLS12-381-r escalate;
      NIST-P-384, NIST-P-521, Ed25519-L undetermined; NIST-P-224 and
      brainpoolP256r1 do not, on complete lattices. (E) typed r + 1 (Cheon
      Theorem 2 cost, Theta(d) consecutive powers): NIST-P-224, NIST-P-384
      (bound), brainpoolP256r1, Ed25519-L, BN254-r, BLS12-381-r escalate;
      NIST-P-521 undetermined; NIST-P-256 and secp256k1 do not. The boolean
      stop_and_escalate is true under every reading; the SET is not stable
      across readings. Every count is reported stratified by
      expected_structure_flag: BN254-r and BLS12-381-r are pairing rows whose
      near-floor values are forced by their family polynomials
      (BLS12 r - 1 = u^2 (u^2 - 1); BN r + 1 = 2(3u^2+3u+1)(6u^2+1)), i.e.
      expected structure, not signal.
    what_the_flagged_minimizers_presuppose: >-
      The r - 1 minimizers of NIST-P-256, secp256k1 and BLS12-381-r each need one
      power [x^d]P with a 128-bit d. brainpoolP256r1 and BN254-r are listed on
      r + 1 minimizers of 126 and 127 bits. Under Theorem 2 those need about
      2^126 and 2^128 consecutive powers, and the Theorem 2 cost at those d is
      about r^0.49 and r^0.50, i.e. no gain over rho. Their near-1/4 frozen
      values (0.2556 and 0.25394) are artefacts of applying the r - 1 cost to
      the r + 1 branch. BN254-r's r - 1 branch reaches 0.2539434 with one
      power at a 127-bit d in its own right. On restricted d (a review diagnostic,
      not a census quantity) no row reaches 0.40 with d <= 2^40 on either
      branch, so the whole escalate rests on divisors of at least about 51 bits.
    generic_reading: >-
      Under the contract's reading the same trigger fires on 30 of 32 random
      256-bit primes (93.8 %, Clopper-Pearson 95 % interval 79.2-99.2 %), and
      0 of 32 were inert (PTM-1, seed 2026092201, 300 s cap; a review
      computation that mints no RUN-*). The escalate is therefore a generic
      property of primes of that size, not a fact about how the standardized
      curves were chosen. Plan key J7_generic applies: the frozen 0.40 / 0.49
      thresholds are left standing, and the calibration gap is a finding about
      the protocol. Any future census that reuses them needs a
      protocol_amendment first.
    labelling_rule_for_any_citing_record: >-
      rho_baseline 0.5 is the ordinary-input cost exponent, a different problem.
      Any record that places it beside these values annotates the columns as
      rho_ordinary_input and E_ASSUMES_AUXILIARY_INPUT, states per row the
      branch, the input model and the bits of d, cites DEC-20260802-204
      B032-C7/C8, and does not use the phrase "identical accounting" unqualified
      (RT-20260923-ca6b7c J6 ruling_on_rho_column).
    tripwire_clause: >-
      No reviewer reported T1-T4, and this record asserts nothing that fires
      one. But any LATER record that asserts a frozen-expression r + 1 value as
      the running time of a known or new algorithm is asserting an
      auxiliary-input exponent below the published r + 1 bound. It routes as T2
      of REVIEW-AUXIN-20260922-fd1edc to review-breakthrough.

  reason: >-
    Joints J5 and J6 broke (TASK-20260922-0e10d1, RT-20260923-ca6b7c), and the
    frozen plan's composition key J5_breaks prescribes exactly this: "The
