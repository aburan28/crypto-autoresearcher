correction:
  id: CORR-20260803-c92db5
  recorded_at: 2026-08-03
  record_type: claim
  record_id: GOAL-AES-003-BATCH-005-SNAPSHOT-RECEIPT
  field: the asserted PRP-null gap
  prior_value: >-
    The BATCH-005 snapshot receipt carried, as its headline open item: "NO ARM IN
    THIS CAMPAIGN HAS EVER MEASURED THE PRP NULL THAT EVERY EXCESS FACTOR DIVIDES
    BY. Every 13.5x, 20.5x and 15.63x across five batches rests on an analytic
    4 * 2^-32 that has never been checked against a measurement." The Coordinator
    also reported this to the user as the most valuable line in the producer's
    report.
  corrected_value: >-
    FALSE. THE MEASUREMENT IS ON DISK AND HAS BEEN SINCE BATCH-002.
    coordination/goals/GOAL-AES-003/batches/BATCH-002/tasks/TASK-20260802-e4fa63/
    arm_A3.json and arm_A3b.json are the identical yoyo probe at r = 10 -- full
    AES-128, the standard permutation stand-in -- with amask 1, smask 1, 2^33
    trials each, returning 5 and 7 hits against an analytic null of 8.0 each.
    Pooled: 12 observed against 16.0 expected over 2^34 trials, ratio 0.75, and
    the Coordinator computed P(X <= 12 | 16) = 0.193 directly from the files.
    Entirely consistent with the analytic constant.
    The red team went further and aggregated all nine clean should-be-null arms,
    excluding r = 6 as circular: 26 observed against 29.0 expected, ratio interval
    [0.586, 1.314]. THE CONSTANT IS CONFIRMED TO ABOUT +/- 31%, against excess
    factors of 11x to 15.6x. Nothing in the campaign's excess factors can move on
    this, and the "gap" was never a gap.
  reason: >-
    THE COORDINATOR TOOK A PRODUCER'S NEGATIVE CLAIM ABOUT THE CORPUS AND
    REPEATED IT WITHOUT OPENING THE CORPUS. The producer wrote that no arm had
    ever checked the null; the Coordinator put it in a snapshot receipt as a
    headline open item and told the user it was the report's most valuable line.
    Two files in a prior batch of the same campaign refute it, and finding them
    took one directory listing.
    THIS IS THE SAME FAILURE MODE FOR THE FOURTH TIME THIS SESSION, in a new
    form. CORR-20260803-791ca7 records it for summary lines -- compressions that
    outran their evidence. CORR-20260803-f459b3 records it for field writes -- a
    regex whose result was never read back. It also produced a validator marked
    FAILED without opening its directory, and a merge-hygiene PASS reported from
    a pipeline whose output was discarded. The common act is asserting the state
    of something without looking at it.
    THE NEW FORM IS THE MOST DANGEROUS OF THE FOUR, because a false claim that
    evidence is MISSING is not caught by the checks that catch false claims that
    evidence EXISTS. A fabricated positive gets challenged by a reviewer who
    cannot reproduce it. A fabricated absence looks like diligence, and it
    directs real budget at work already done. Had this stood, a future batch
    would have spent an arm measuring a null measured three batches earlier.
    RULE, recorded for successors: A CLAIM THAT SOMETHING HAS NEVER BEEN MEASURED
    IS AN EMPIRICAL CLAIM ABOUT THE REPOSITORY AND REQUIRES THE SAME SEARCH A
    POSITIVE CLAIM REQUIRES. Name the paths searched. The red team did exactly
    this -- it enumerated every W_ge1-bearing file in the tree before ruling on
    which round counts had ever run -- and that is why its version is reliable
    and the Coordinator's was not.
  evidence_artifacts:
    - coordination/goals/GOAL-AES-003/batches/BATCH-002/tasks/TASK-20260802-e4fa63/arm_A3.json
    - coordination/goals/GOAL-AES-003/batches/BATCH-002/tasks/TASK-20260802-e4fa63/arm_A3b.json
    - coordination/goals/GOAL-AES-003/batches/BATCH-005/tasks/TASK-20260803-33f760/red_team_report.yaml
    - ledger/corrections/CORR-20260803-791ca7.yaml
  supersedes: null
  superseded_by: null
