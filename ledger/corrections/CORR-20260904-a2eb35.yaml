correction:
  id: CORR-20260904-a2eb35
  recorded_at: '2026-09-04'
  recorded_by: coordinator
  type: executor_code_bug_wrong_target_probability_reused_in_standard_error_formula_plus_a_related_structural_test_design_flaw_in_the_r3_exact_value_followup_check
  severity: >-
    low_the_named_conclusion_group_exclusion_is_unaffected_the_affected_claim_within_3_standard_errors_is_a_secondary_tolerance_characterization_not_the_headline_finding
  supersedes: []
  corrects:
    - experiments/EXP-MONO-e102a3/execution_report.yaml
    - experiments/EXP-MONO-e102a3/implementation/run_galois_cubic_census_v2.py

  finding_1_the_executor_own_se_bug: >-
    `run_galois_cubic_census_v2.py`'s own Stage-0 interpretation computed
    a SINGLE standard error, `se = sqrt(0.5*0.5/n)` (the maximal Bernoulli
    variance, correct for the p=0.5 target used by R1 and R2), and reused
    that SAME value, unchanged, to test R3 -- whose own correct target
    probability is 1/6, not 0.5, and whose correct standard error is
    therefore smaller: sqrt((1/6)(5/6)/n) at n=10005, about 1.341x
    smaller than the reused value. Using the too-large SE made R3's own
    observed deviation (0.014443) appear to fall within "3 standard
    errors" when, computed with R3's own correct target-specific SE, it
    is actually 3.88 standard errors away -- outside a naive 3-sigma
    band, the opposite of what the archived execution_report.yaml
    reports.

  finding_2_the_r3_equals_17_over_101_followup_check_was_structurally_unable_to_decide_the_question_on_this_object: >-
    Separately, and more consequentially: the pre-registered "does R3
    equal EXACTLY 17/101 again" check (named in EXP-MONO-e102a3's own
    specification as the key test of whether the first object's own
    exact match was a genuine curve/R-independent law or a coincidence)
    could not have succeeded on THIS object regardless of the true
    underlying dynamics. R3's own reduced fraction here is 1523/10005,
    and 10005 = 3 x 5 x 23 x 29 has NO factor of 101 -- so 1523/10005
    can never equal k/101 for any integer k, as a matter of pure
    arithmetic. (The FIRST object's own denominator, 9999 = 3^2 x 11 x
    101, DID carry a factor of 101, which is why 17/101 was even
    representable there.) This means the non-match reported for this
    object is NOT informative about whether an exact (p+1)/(6p)-type law
    governs V_R's own split density -- the test itself was incapable of
    confirming such a law on an object whose own point count happens not
    to be divisible by p in the right way, independent of whether the
    law is true.

  who_caught_it: >-
    THE RED TEAM, in its own independent review of EXP-MONO-e102a3 (J3
    and J4, task TASK-20260904-a17443), by tracing the Executor's own
    claim to its exact source line in the archived script and
    recomputing the correct target-specific standard error, and by
    independently analyzing the denominator structure of both objects'
    own R3 fractions. Neither finding was caught by the Executor itself,
    the Validator (whose own joints were scoped to independent
    reproduction of the reported numbers, not to auditing the
    interpretation code), or this Coordinator's own prior spot-check
    (which correctly flagged the tolerance question as needing review
    but did not itself locate the specific code bug or the denominator
    structural issue).

  disposition: >-
    RUN-MONO-e102a3-1 remains archived exactly as recorded; no reported
    number (R1, R2, R3, irreducible density, |V_R'|) is affected --
    these were independently re-derived and confirmed exact by the
    Validator via an entirely different classification method. What is
    corrected is the INTERPRETATION: the "within 3 standard errors"
    claim in `execution_report.yaml` is WRONG under a self-consistent
    version of its own naive iid model (true figure: 3.88 SE, outside
    the band) -- though this Coordinator and both reviewers agree the
    entire naive-iid framing is likely the wrong conceptual model for an
    exhaustive census in the first place, per the theoretically preferred
    (but unproven for this specific object) Weil-style relative-error
    framing, under which the deviation IS contained. The named group-
    exclusion conclusion (trivial, C_2, A_3 all excluded) is unaffected
    by either error model, since those deviations are orders of
    magnitude, not marginal. Separately, the R3=17/101 non-match on this
    object is DOWNGRADED from "confirms the first match was a
    coincidence" (this record's own prior, premature framing, now
    withdrawn) to "structurally uninformative on this specific object" --
    see EV-MONO-6319f9 and DEC-20260904-fb4413 for the corrected
    evidentiary reading.

  scope_of_error: >-
    Confined to EXP-MONO-e102a3's own Stage-0 interpretation text and
    the R3-exact-value follow-up check's own test design. Does not
    affect EXP-MONO-bb6fa1's own already-decided results (that object's
    own R3=17/101 match remains genuinely representable, since its own
    denominator 9999 does carry a factor of 101) or CORR-20260904-8cc20f
    (a different, Stage-1-specific tolerance defect, already corrected).

  next_action: >-
    Any future R3-exact-value check across objects must use a
    denominator-independent normalization (e.g. compare n*R3 - n/6, or
    equivalently the exact integer numerator of R3 - 1/6 over a COMMON
    denominator fixed in advance, such as 6p) rather than checking
    whether the REDUCED fraction happens to equal k/p -- a test that is
    only even capable of succeeding when the specific object's own point
    count happens to be divisible by p in the right way, an arithmetic
    accident unrelated to the underlying question. Any future
    "N standard errors" tolerance check must use the standard error
    computed from the ACTUAL target probability of the specific metric
    being tested, not a value computed for a different metric and reused.

  reported_by: red-team (J3/J4, TASK-20260904-a17443)
  acknowledged_by: coordinator
