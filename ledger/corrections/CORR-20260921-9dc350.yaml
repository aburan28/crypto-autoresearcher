    evidence strength, and no run artifact.

  corrections:
    - id: C1
      field: EV-FROB-576872.yaml boundaries (and the matching sentence in
        experiments/EXP-FROB-91ee9c/runs/TASK-20260921-51bc02/report.md)
      prior_value: >-
        "Only 2 of 15 achievable set-partitions are `ok`... for either
        tested curve, in either cell." True of FROB-SPLIT-q11n5 (s=4
        non-trivial atomic factors, Bell(4)=15 total set-partitions, of
        which the frozen protocol restricts attention to 2). Not true of
        FROB-EQDEG-q19n5: per specification.yaml's named_parameter_sets,
        19 = -1 mod 5 so ord_5(19)=2, giving s=2 non-trivial factors of
        equal degree 2 -- Bell(2)=2 total set-partitions, not a fraction of
        15. Independently confirmed against specification.yaml before
        recording this correction.
      corrected_value: >-
        "2 of 15" describes FROB-SPLIT-q11n5 only. For FROB-EQDEG-q19n5,
        the frozen cell admits exactly 2 set-partitions in total (Bell(2)=2)
        -- there is no larger lattice to be a fraction of. This is a
        PERMANENT, cell-design ceiling fixed by DEC-20260914-d04668's
        original q=19 selection, distinct in kind from FROB-SPLIT-q11n5's
        sparsity, which is a per-curve, potentially-enrichable, contingent
        fact (a different generator or curve search could in principle
        surface more `ok` partitions on that curve; no search inside
        FROB-EQDEG-q19n5's cell can ever exceed 2). Neither round's
        boundaries/report text drew this distinction; it was found by
        red-team's audit (redteam-20260921-round2.md, Section 1) and
        independently re-confirmed by the dispatching session directly from
        specification.yaml before this record was written.
      reason: >-
        A reader following EV-FROB-576872's boundaries field alone would
        wrongly infer FROB-EQDEG-q19n5 has an enrichable partition lattice
        like FROB-SPLIT-q11n5's, which would misdirect exactly the kind of
        follow-up (a curve/generator search) this record's next_actions
        below rule out for that cell specifically.

    - id: C2
      field: >-
        DEC-20260921-d5e997.yaml rationale / EV-FROB-576872.yaml observations
        (J3): falsification_criterion clause (c)'s stated basis
      prior_value: >-
        "Falsification_criterion clause (c)... is literally TRIGGERED in
        both cells, via the C3/C4 ties (>= includes equality) and
        additionally via C2 on FROB-EQDEG-q19n5." (EV-FROB-576872.yaml,
        observations; substantively the same attribution recurs in
        DEC-20260921-d5e997.yaml's rationale.) Round 2's own PTM-2(i)
        conclusion read C2's larger-than-object spread on FROB-EQDEG-q19n5
        as independent evidence that "the instrument retains general
        discriminating power."
      corrected_value: >-
        C2's `[2,2]` partition -- the only non-trivial partition either
        tested cell reaches -- has a construction defect, independently
        confirmed by the dispatching session via BOTH code-reading of
        implementation.py (lines ~222-238 and ~429-470: `non_stable_subspace_of_dim`
        is called once per DISTINCT slot dimension via
        `dims_present = sorted(set(... for d in r["slot_dims"]))`, and the
        resulting single point-set is appended TWICE into `block_ksets` for
        a `[2,2]` partition, i.e. the same cached list object) AND raw
        arithmetic from metrics.json (SPLIT C2 `[2,2]` U_neg = 3.0 =
        |B_W|/2 for one 6-element set, not (6+6)/2=6.0 for two distinct
        sets; EQDEG C2 `[2,2]` U_neg = 12.0 = |B_W|/2 for one 24-element
        set, not (24+24)/2=24.0). C2 therefore sums a non-stable subspace
        with ITSELF, producing a swap-symmetry collision (Q1+Q2=Q2+Q1)
        unrelated to Frobenius structure, cardinality, or scale -- traced
        by red-team to specification.yaml's own singular design text
        ("Take the lexicographically first such subspace"), not merely an
        implementation slip. This removes C2 as independent support for
        "the instrument retains general discriminating power" and for
        falsification clause (c)'s trigger on FROB-EQDEG-q19n5: the
        "additionally via C2" attribution should be read as WITHDRAWN. The
        C3/C4 ties remain the sole, and independently sufficient, basis for
        clause (c)'s trigger in both cells -- this defect does not weaken
        that basis, since C3/C4 do not share C2's per-dimension-not-per-slot
        construction.
      reason: >-
        A falsification trigger attributed in part to a broken control
        overstates the evidence's robustness; withdrawing the C2 leg leaves
        the same trigger (clause (c) fires via C3/C4 alone) resting on a
        sound basis instead of a partially unsound one.

    - id: C3
      field: >-
        EV-FROB-576872.yaml resource_check.reading / DEC-20260921-d5e997.yaml
        rationale: the clause-6-passing condition's stated direction
      prior_value: >-
        States the success_criterion clause (6) passing condition as
        "more collisions on the OBJECT than on the CONTROL."
      corrected_value: >-
        Backwards. The object arm has zero collisions on the tested
        partitions (its own finest achievable partition is collision-free
        in both cells), so it cannot show "more" collisions than anything.
        The condition clause (6) actually requires is a strictly smaller
        object spread, which needs MORE collisions on the CONTROL than on
        the OBJECT (a collision lowers `distinct_targets`, which lowers
        `p_m`, which raises `cost_ratio_neg`, which widens spread -- so a
        control with a collision the object lacks would show the LARGER
        cost_ratio_neg / smaller p_m needed for the object's spread to be
        strictly smaller by comparison). Flagged by validator
        (validation-20260921-round2.md, "Overall verdict" point 3) after an
        initial wrong-direction attempt the validator itself disclosed and
        corrected before finalizing its report.
      reason: >-
        Does not change J3's resolution -- the actual measured outcome
        (exact ties on C3/C4, both directions of the sentence agree no such
        collision differential exists) is unaffected regardless of which
        direction the prose states -- but the sentence as recorded is
        internally impossible (the object cannot exceed its own zero) and
        should not propagate uncorrected into any later citation.

