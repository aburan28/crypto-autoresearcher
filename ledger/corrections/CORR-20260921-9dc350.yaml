  next_actions:
    - id: NA-1
      action: >-
        If control C2 is reused in any future experiment on a partition with
        two or more slots of equal dimension, fix
        non_stable_subspace_of_dim's per-dimension cache to draw an
        independent (non-stable, matched-dimension) subspace PER SLOT rather
