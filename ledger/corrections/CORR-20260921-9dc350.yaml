        generator search inside FROB-EQDEG-q19n5's own cell can exceed its
        permanent Bell(2)=2 ceiling (C1 above).
      rank: >-
        Candidate future experiment; not started, not approved, and not
        required by this correction.
    - id: NA-3
      action: >-
        Both reviewers independently computed a birthday-collision null
        model (~0.5, ~0.38 expected collisions for the object/C3/C4 arms at
        these cardinality-to-N ratios) showing clause (6) was statistically
        underpowered by construction at these toy cardinalities on both
        tested cells. Any future control-battery design against this
        hypothesis should size cardinalities so the null model's expected
        collision count is not itself near the observed one.
      rank: >-
        Design guidance for a future experiment; not itself an experiment
        or a request to run one.

