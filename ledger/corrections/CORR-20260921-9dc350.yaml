    the mechanical/algebraic record verify, and does `weaken` survive
    interpretive challenge -- resolves against the decision. The audit does,
    however, independently identify three defects in the RECORD'S OWN
    SUPPORTING TEXT, all in already-merged, official files that AGENTS.md
    rule 2 forbids editing in place. This record captures those three
