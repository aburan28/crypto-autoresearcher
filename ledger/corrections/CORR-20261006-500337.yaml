  field: hypothesis.assumptions[1] and hypothesis.proof_search_map.observation_collision.observable
  prior_value: >-
    "The confirmation surface depends deterministically only on the 32-byte
    big-endian padded output x-coordinate" and "Confirmation tag of the
    32-byte padded x-coordinate."
  corrected_value: >-
    The effective protocol encodes zx(S) as exactly 25 bytes:
    0x00||00^24 for Infinity or 0x01||I2OSP_24(S.x) for a finite result, then
    derives the confirmation key from zx(S). The status byte prevents Infinity
    from colliding with affine x=0; y is never included. The experiment
    specification and v2 amendment govern.
  reason: >-
    P-192 field elements occupy 24 bytes. The frozen hypothesis used an
    incorrect descriptive width while the approved experiment specification
    already froze the unambiguous status-byte plus 24-byte encoding.
  evidence_artifacts:
    - experiments/EXP-SCURVE-29040c/specification.yaml
    - experiments/EXP-SCURVE-29040c/amendments/v1_to_v2.yaml
