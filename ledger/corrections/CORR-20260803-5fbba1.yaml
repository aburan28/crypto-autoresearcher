correction:
  id: CORR-20260803-5fbba1
  recorded_at: '2026-08-03'
  record_type: frozen_contract_defects
  record_id: EXP-SMTH-71b1b0
  field: outcomes_disposition_label_and_ENC_A_definition_gap
  recorded_by_task: TASK-20260803-30e21a
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-038
  supersedes_nothing: true
  the_contract_is_not_edited: >-
    EXP-SMTH-71b1b0 is frozen and stays byte-identical at sha256
    e193a1966b264804b17976c1575f7bded858936005cab393f31763fef8a0e432. These are
    defects recorded against it, never edits to it.

  defect_1_disposition_label_contradicts_the_hypothesis:
    what_the_contract_says: >-
      outcomes.SUPPORT_AT_TOY_SCALE carries disposition `support`.
    what_the_hypothesis_says: >-
      H-SMTH-001.interpretation_limits states, verbatim, "A pass is `replicate`,
      never `support`, and never validation of HEUR-DS-1 above the toy tier."
    ruling: >-
      The hypothesis governs. The contract's `support` label is NOT adopted by
      EV-SMTH-bea84b. Independently, the null-object control makes even
      `replicate` overstated, so the recorded direction is `inconclusive`.
    found_by: RT-20260803-51fb7d objection on the over-read sentence.

  defect_2_ENC_A_undefined_in_a_blocking_control:
    what_is_missing: >-
      ENC-A is the object of the BLOCKING control CTRL-ENCA-POWER but is defined
      nowhere inside EXP-SMTH-71b1b0, whose reuses_nothing_unapproved clause
      declines to reuse EXP-SMTH-001's contract.
    how_it_was_resolved: >-
      The Executor imported the single definition existing in the corpus,
      EXP-SMTH-001 step_5, M = max(e1,1)*max(e2,1), because H-SMTH-001 names
      ENC-A in the power_certificate_encoding role. It exercised no discretion
      and flagged the gap rather than choosing quietly.
    validator_ruling: ADMISSIBLE-WITH-SCOPE-NOTE (VAL-20260803-d2df58)
    binding_scope_note: >-
      CTRL-ENCA-POWER certifies that the KS2 statistic can reject AT ALL,
      i.e. non-degeneracy. It does NOT certify power against a small deviation.
      The arm is 100.0000 percent u=2-smooth with 0.0000 percent tail at both
      field sizes and is arithmetically incapable of failing. Every downstream
      record must carry this. A record stating that the test was shown to have
      power would overstate the run.

  defect_3_rho2_transcription:
    what: >-
      Frozen rho_frozen.u2 is 0.30684282 where 1 - ln 2 is 0.30685282, a
      relative error of 3.26e-05, with a single-digit slip pattern.
    who_touched_it: >-
      Nobody. The Executor used the frozen values verbatim and took no action,
      which is correct - an Executor does not repair a frozen contract.
    why_it_does_not_change_a_verdict: >-
      DECAY-1 IS gating and DOES derive from rho(2). The threshold computed from
      the erroneous value is 0.0064038291 and from the correct value
      0.0064036204; BOTH round to the frozen 0.006404, so the gate cannot move.
      Observations sit 18.8x and 23.1x inside it.
    coordinator_self_correction: >-
      The BATCH-038 archive receipt committed in b72b120a stated that this slip
      touches only non-gating RATE-DS-1 and that the band is approx 64x the gap.
      BOTH PARTS WERE WRONG - DECAY-1 is gating and does derive from rho(2), and
      the true margin ratio is approx 215000x. Corrected here and in the commit
      message of d4a50424. No verdict changes.

  claim_ceiling: >-
    Records contract defects only. No cost saving, no exponent, no crypto-scale
    claim, no hypothesis status change follows from this record.
