      corrected_value: >-
        G3 RUN-GFPN-f5412a evidences 7 capped children (1 build_poly builder,
        5 gb_only S-1 msolve solves, 1 Sage comparator). The read-backs of 6
        reach the manifest list through raw-result.json. The read-back of the
        seventh, the solve anchor_comparator_system launched at
        v2_driver.py:711 with gb_only true, reaches no source the collector
        reads: raw-result.json keeps only its outcome, input and trace
        (v2_driver.py 713-716), it writes no meta file, and the r3
        pass-through writes no attempt record (census I-10). The census lists
        no other package file that carries it. So its read-back is recorded
        NOWHERE in the package, as for G4's 8 solves (CORR-20260924-ec044e
        item 1).
        The frozen checker passed G3 because its cap check requires a
        non-empty collected list and compares each collected entry with the
        requested cap (v2_check_run.py 62-73); the other six read-backs
        de-duplicate to one entry equal to the cap. The checker therefore did
        not, and by design cannot, detect a single missing child. This is the
        concern readbackcover option RE names ("the checker's non-empty test
        would hide the gap"), realized in G3.
        WHAT CAN BE SAID OF THAT CHILD'S ENVELOPE, AND ON WHAT BASIS: the
        frozen run_child refuses to exec a child whose read-back differs from
        the cap (v2_solver.py 193-201, 228-232), so the cap held for it is an
        INFERENCE FROM FROZEN CODE, not a recorded observation.
        By the census's same table, G1 RUN-GFPN-f6a21a and G2 RUN-GFPN-902222
        each evidence 88 capped children, of which the 12 raw_grid builders'
        read-backs are in child/*.meta.json only (recorded in the package, not
        collected; all equal to the cap).
      consequence: >-
        No ruling of DEC-20260924-1ce186 changes. The r3 gate stays NOT
        ESTABLISHED (decided by G4). G3 stays a valid record of the r3 layer
        at its scope, and its gate outcome and checker pass stand as recorded.
        What is narrowed is the reading that G3's manifest carries every
        child's read-back: it carries 6 of 7, and one child's cap is shown only
        by frozen code. The successor draft
        AMD-EXP-GFPN-05ff43-20260924-readbackfull records every capped child's
        read-back at launch (RL-1) and states pass-through recording (RL-2), so
        an r4 anchor-identity package cannot repeat this.
