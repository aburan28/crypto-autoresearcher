      quorum is suspended (AGENTS.md "Goal closure quorum - SUSPENDED"), but a
      suspended quorum does not substitute for an unmet criterion, and this
      record makes no closure claim.
    - >-
      research_goal.active_hypothesis_ids stays []. See
      `further_observations_not_dispositioned`.
    - >-
      EVERY IMMUTABLE RECORD. No decision, evidence record, review report,
      knowledge entry or commit is edited by this act.

  provenance_observation_bedrock:
    observation: >-
      All three HAWK decisions this reconciliation relies on -
      DEC-20260805-bdcb53, DEC-20260805-77a735 and DEC-20260805-a62164 - record
      `inference_provenance.resolved_model_id:
      amazon-bedrock/us.anthropic.claude-sonnet-4-6`, with `fallback_used:
      true` and `model_verified: false`. So do DEC-20260805-ed4cd3 and the two
      BATCH-56498f review reports (TASK-20260805-36cc26's validation_report.yaml
      and TASK-20260805-80676e's red_team_report.yaml, both of which
      additionally set `independent_session: true`) and BATCH-d44912's
      validation_report_d44912.yaml.
    files_not_modified: >-
      NONE OF THOSE FILES IS MODIFIED, AND NONE MAY BE. AGENTS.md rule 16
      prohibits Bedrock going forward and states explicitly: "Historical
      receipts that record prior Bedrock use remain immutable and must not be
      rewritten."
    what_it_bears_on: >-
      HOW MUCH INDEPENDENT WEIGHT THOSE DECISIONS CARRY, said plainly. Every
      one of them records `model_verified: false`, so no probe receipt confirms
      which model actually served them; `fallback_used: true` on the decisions
      means the requested policy (`coordinator-archive`) was not what answered.
      The two BATCH-56498f reviews assert `independent_session: true`, but on
      the same unverified resolved model as the decision they review - which is
      the exact correlation AGENTS.md "Goal closure quorum" identifies as not
      constituting independent agreement. Their findings are still findings and
      this record relies on them; but they are one unverified model's
      judgements, not corroborated ones, and nothing in this campaign should be
      presented as more independently reviewed than that.
    additionally_not_re_checkable_from_the_repository: >-
      DEC-20260805-ed4cd3, EV-HAWK-c99848 and DEC-20260805-a62164 all rest on
      the BODY TEXT of iacr:2026/1318, which KN-LIT-7674 records as
      "citation_verified: body_read_from_user_provided_text ... provided
      directly in research session 2026-08-05". THAT TEXT IS NOT IN THE
      REPOSITORY: a glob of inputs/ finds no HAWK paper artifact (the only
      full-text paper filed there is inputs/P13-WESOLOWSKI-2026/
      paper_fulltext.md). Those three records' paper-body claims therefore
      cannot be re-checked against a committed artifact by any later session.
      Recorded as a limit on independent checkability, not as a charge that the
      reading was wrong.

  divergences_from_the_briefing_this_session_received:
    note: >-
      Recorded rather than silently reconciled, per AGENTS.md core rule 8
      (unexpected observations must be recorded) and the instruction under
      which this record was written. Neither divergence changes any correction
      above.
    items:
    - id: DIV-1
      briefing_said: >-
        BATCH-d44912's decision is DEC-20260805-77a735 and its evidence is
        EV-HAWK-68b8b6; the 2026-08-06 scope correction (DEC-20260805-a62164,
        EV-HAWK-21edba) "was a DIRECT Coordinator ledger commit, NOT a batch -
        there is no batch directory for it."
      the_files_say: >-
        Both statements hold as far as they go, but the batch attribution is
        richer than stated. FOUR further records self-label
        `batch_id: BATCH-d44912`: DEC-20260805-ed4cd3
        (case_c_confirmed_from_paper_body, promoting KN-LIT-7674),
        EV-HAWK-c99848, AND ALSO DEC-20260805-a62164 and EV-HAWK-21edba
        themselves - the two records the briefing describes as the non-batch
        scope correction. Both of those carry `batch_id: BATCH-d44912` and
        `recorded_at: '2026-08-05'` in their own text, while being committed on
        2026-08-06 at 61d5ccbb1 with no batch directory work.
      how_this_record_treats_it: >-
        FAITHFULLY AND WITHOUT REPAIR. The appended BATCH-d44912 checkpoint
        lists DEC-20260805-77a735, DEC-20260805-ed4cd3, EV-HAWK-68b8b6 and
        EV-HAWK-c99848. The scope correction is recorded as its own non-batch
        entry, as instructed, WITH AN EXPLICIT NOTE that its two records
