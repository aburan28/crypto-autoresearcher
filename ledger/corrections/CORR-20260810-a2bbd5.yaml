    - id: D3
      title: >-
        next_action is a three-layer splice containing a remnant that begins
        mid-sentence and contradicts its own leading text
      severity: major
      field: research_goal.next_action
      prior_value: >-
        Each of a9e1b6778, 893483df8 and 61d5ccbb1 replaced only the leading
        line(s) of next_action and left the earlier body standing. The result
        opens "KN-OPEN-028 ALL QUESTIONS CLOSED ... No further action required
        for this goal", and then, further down, resumes mid-sentence with
        "corrected cost of the nrd-PIP route independently - KN-OPEN-028 Q1."
        - whose grammatical head ("EXACTLY ONE NEXT ACTION, and it does NOT
        require the paper. Derive the") was deleted at 893483df8 - and directs
        deriving that corrected nrd-PIP cost as "the cheapest remaining move",
        which the leading text says is already answered. The record instructs a
        reader to do a thing it has just said is done.
      corrected_value: >-
        next_action replaced wholesale with ONE concrete action (the
        number-field Dedekind-domain O_F-ideal count derivation named by
        DEC-20260805-a62164), carrying its constraints explicitly. The
        headless remnant is NOT carried forward; the full prior text is
        preserved verbatim in next_action_history so nothing is lost.
      action: CORRECTED_IN_HEAD
      evidence_for_the_corrected_value:
        - >-
          The splice is directly readable in the committed file: the leading
          block and the remnant beginning "corrected cost of the nrd-PIP route
          independently" both stand in ledger/goals/GOAL-HAWK-001.yaml at
          origin/main.
        - >-
          The deleted grammatical head at 893483df8 was exactly "EXACTLY ONE
          NEXT ACTION, and it does NOT require the paper. Derive the" (verified
          git fact, established by the orchestrating session).

    - id: D4
      title: updated_at predates the last three ledger updates to this goal
      severity: minor
      field: research_goal.updated_at
      prior_value: "'2026-08-02'"
      corrected_value: "'2026-08-10'"
      action: CORRECTED_IN_HEAD
      evidence_for_the_corrected_value: >-
        The goal head was written to at a9e1b6778 and 893483df8 (both carrying
        BATCH-56498f/BATCH-d44912 work whose decisions are recorded_at
        '2026-08-05'), at 61d5ccbb1 (the 2026-08-06 scope correction), and at
        3994acb2d (the merge). '2026-08-10' is the date of THIS reconciliation,
        which is the last write; it is not a claim about when the earlier work
        happened, which the batch checkpoints carry.

    - id: D5
      title: latest_verified_commit predates all three later archives
      severity: major
      field: research_goal.latest_verified_commit
      prior_value: >-
        7c3cce2c, with latest_verified_commit_note explaining that it is the
        squash-merge commit of PR #105 and that the BATCH-001 branch shas are
        unreachable (CORR-20260802-a1f151).
      corrected_value: >-
        UNRESOLVED IN THIS ACT, AND DELIBERATELY SO. The correct value is the
        commit of the most recent VERIFIED archive for this goal, which on the
        established history is at least 61d5ccbb1 - but this session ran no git
        command and holds no archive receipt for that commit, so writing any
        sha into this field would be recording a value no command I ran
        produced.
      action: RECORDED_ONLY - HEAD LEFT UNCHANGED
      why_not_corrected_here: >-
        latest_verified_commit is a RECEIPT-BOUND field: AGENTS.md "Durable
        research commits" makes a commit official only once the dispatcher's
        post-commit verifier accepts its receipt. A coordinator-only session
        with no shell cannot produce or check that receipt. This is the same
        stop TASK-20260807-dcfaee recorded for GOAL-MLDSA-001 - that filing
        reconstructed hashes would itself be a fabrication under core rule 5 -
        and the reason RECON-20260810-001 splits the audit (executor, with git)
        from the disposition (coordinator, without).
      successor: >-
        The next ledger archive for GOAL-HAWK-001 sets this field from its own
        verified receipt; or RECON-20260810-001's TASK-20260810-c64cf0 audit
        supplies the sha and TASK-20260810-1b82fe dispositions it. Until then
        the field must be read as "the last commit anyone verified", not "the
        head of this campaign".

    - id: D6
      title: >-
        next_action_history has no entry for either next_action text that was
        overwritten in place
      severity: major
      field: research_goal.next_action_history
      prior_value: >-
        One entry only, for the 2026-07-29 text superseded at '2026-08-02'.
        The texts introduced at a9e1b6778 and at 893483df8 were each replaced
        by the following commit with no history entry recording them.
      corrected_value: >-
        Two entries appended reconstructing those texts AS FAR AS THE RECORD
        PERMITS - only the leading line of each is recoverable, because each
        superseding commit replaced only the leading line and the git fact
        establishes only the deleted leading text - plus a third entry
        preserving verbatim the spliced text this correction replaces.
      action: CORRECTED_IN_HEAD
      recoverability_limit_stated_plainly: >-
        For the text overwritten at 893483df8, the recoverable leading line is
        exactly "EXACTLY ONE NEXT ACTION, and it does NOT require the paper.
        Derive the". For the text overwritten at 61d5ccbb1, it is exactly
        "BATCH-d44912 CLOSED (DEC-20260805-77a735). KN-FIND-528ca0 promoted."
        THE BODIES BELOW THOSE LINES ARE NOT SEPARATELY RECOVERABLE from the
        facts this session was given: because each commit replaced only the
        leading line, the body that followed was inherited unchanged, and
        whether a given body sentence originated in that version or in an
        earlier one CANNOT BE DETERMINED without a diff this session did not
        run. The appended history entries say exactly this rather than
        reconstructing a plausible body, which would be a fabrication.

    - id: D7
      title: >-
        the standing obligation to build a conforming dispatch queue was never
        discharged, and two further batches then ran with no queue at all
      severity: major
      field: >-
        research_goal.next_action (the clause "A conforming BATCH-003 dispatch
        queue - receipts inside their own archive commits - is owed before any
        batch that dispatches workers"), and
        research_goal.dispatch_queue_path
      prior_value: >-
        The obligation was recorded at CORR-20260802-bc9e33 OI-3 (for BATCH-002)
        and restated in the head for BATCH-003. It was never discharged.
        dispatch_queue_path still points at
        coordination/goals/GOAL-HAWK-001/batches/BATCH-001/dispatch_queue.json.
      corrected_value: >-
        The obligation SURVIVES and now covers BATCH-56498f and BATCH-d44912
        RETROSPECTIVELY as well. It is carried into the new next_action as the
        first requirement of the next batch. dispatch_queue_path is LEFT
        UNCHANGED.
      action: RECORDED_ONLY - CARRIED INTO THE NEW next_action
      why_dispatch_queue_path_is_left_pointing_at_a_stale_file: >-
        BECAUSE THERE IS NOTHING CONFORMING TO POINT IT AT. Directory listing of
        coordination/goals/GOAL-HAWK-001/batches/ confirms that NEITHER
        BATCH-56498f NOR BATCH-d44912 CONTAINS A dispatch_queue.json - both
        batches ran without one. Repointing the field at a path that does not
        exist would break the dispatcher and would assert a queue that was never
        built; leaving it at BATCH-001's queue at least names a file that
        exists. That file is itself known-defective, and the head already says
        so in BATCH-001's own `known_defect`: its receipt was committed
        separately from the artifacts it binds, so "THE QUEUE DOES NOT RENDER in
        that shape". Read the field as historical, not as live.
      what_this_does_not_do: >-
        This does NOT retract BATCH-56498f's or BATCH-d44912's results. Their
        artifacts, review reports and decisions are committed and were read
        directly in this worktree. What is missing is the queue that would have
        made their task states, budgets and completion gates independently
        checkable - a coordination-integrity gap, recorded rather than
        concealed, exactly as CORR-20260802-bc9e33 OI-3 recorded its
        predecessor.

    - id: D8
      title: >-
        SUBSTANTIVE - the head asserts "No further action required" while its
        own governing decision lists two items that still need establishing
      severity: substantive
      field: research_goal.next_action (the "no further action" assertion)
      prior_value: >-
        "No further action required for this goal unless new experimental
        evidence changes the heuristic verification status."
      corrected_value: >-
        FALSE AS WRITTEN. DEC-20260805-a62164 - the decision that governs the
        current head text, and the one the head itself cites in its opening
        line - carries a field named `what_needs_to_be_established_freshly`
        with two items, quoted here verbatim from
        ledger/decisions/DEC-20260805-a62164.yaml as read in this worktree:
        (i) "The count of fractional O_F-ideals of relative norm q'O_K in the
        NUMBER FIELD setting (Dedekind domain O_F, F = K(√α)) is what the
        paper's 30/06 correction actually requires. This is a Dedekind domain
        argument, not a quaternion algebra argument. The paper's authors stated
        this count is larger than O(n^{1+o(1)}) — it needs independent
        verification in the number field setting."
        (ii) "The Dedekind domain argument: for fractional O_F-ideals
        J = (1/r)·I where r ∈ O_K and I is integral with
        N_{F/K}(I) = r^2·q'O_K, the count grows with r. This IS the correct
        argument for the number field case."
        NO COMMITTED ARTIFACT OF THIS CAMPAIGN PERFORMS EITHER. Both committed
        derivations (TASK-20260805-755738's derivation.md and
        TASK-20260805-a39814's corrected_derivation.md) are about fractional
        left O-IDEALS IN A QUATERNION ORDER, and DEC-20260805-a62164 is
        precisely the decision recording that those are THE WRONG OBJECT for
        HAWK, whose algebra A = (-1,-1|K) is totally definite. The number-field
        O_F count it calls for has not been done.
      action: CORRECTED_IN_HEAD - the new next_action IS item (i)/(ii)
      rule_engaged: >-
        AGENTS.md "Research-direction integrity and auditability". A head that
        reads "no further action required" while its governing decision lists
        open items understates the remaining work and steers the next session
        away from a lead that decision itself identified as needed. That is a
        defect to be recorded, not smoothed over. It is recorded here, and the
        remedy is that the open item becomes the head's single next action.
      what_this_does_not_assert: >-
        This says nothing about whether the number-field count will come out
        for or against the paper's route, nothing about HAWK's security in
        either direction, and nothing about any hypothesis status. It says only
        that a named, cheap, unblocked derivation the governing decision asked
        for has not been done and was described as unnecessary.

  fields_left_unchanged_and_why:
    - >-
      research_goal.latest_verified_commit - see D5. Receipt-bound; this
      session holds no receipt and ran no git command.
    - >-
      research_goal.dispatch_queue_path - see D7. No conforming queue exists to
