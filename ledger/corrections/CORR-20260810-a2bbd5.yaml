correction:
  id: CORR-20260810-a2bbd5
  recorded_at: '2026-08-10'
  recorded_by: >-
    coordinator (GOAL-HAWK-001 goal-head reconciliation; coordinator-only
    session with no shell, no batch opened, no worker dispatched)
  type: >-
    goal_head_regression_by_forbidden_conflict_resolution, plus unrecorded
    batch history and a self-contradictory spliced next_action

  record_type: claim
  record_type_note: >-
    `claim` is the closest token the template permits, following
    CORR-20260802-bc9e33 and CORR-20260808-ea85c0. The corrected artifact is a
    research goal's HEAD FIELDS - current-state fields, not an immutable
    result - so this correction both records the defects and (for four of them)
    directs the in-place head edit that repairs them. No immutable record is
    edited by this act.
  record_id: GOAL-HAWK-001
  corrected_record: ledger/goals/GOAL-HAWK-001.yaml
  supersedes: []
  corrects:
    - >-
      ledger/goals/GOAL-HAWK-001.yaml (current_batch_id, updated_at,
      next_action, next_action_history, batch_checkpoints)
    - >-
      the merge commit 3994acb2d's resolution of the GOAL-HAWK-001.yaml
      conflict, which is the root cause of D1 and which AGENTS.md "Durable
      research commits" forbids. THIS RECORD IS THE SUPERSEDING RECORD THAT
      RULE REQUIRES; the merge commit itself is immutable and is not rewritten.

  field: >-
    Five head fields of ledger/goals/GOAL-HAWK-001.yaml. The head describes a
    campaign that stopped at BATCH-002 on 2026-08-02. The committed record
    shows it ran two further batches (BATCH-56498f, BATCH-d44912) and one
    direct Coordinator scope-correction commit, producing three decisions,
    three evidence records and one knowledge promotion, through 2026-08-06.

  summary_prior_value: >-
    current_batch_id: BATCH-002; updated_at: '2026-08-02'; batch_checkpoints
    holding entries for BATCH-001 and BATCH-002 only; next_action a
    three-layer splice whose surviving remnant contradicts its own leading
    text and asserts "No further action required for this goal";
    next_action_history holding one entry (the 2026-07-29 text) and no entry
    for either of the two next_action texts that were overwritten in place.

  summary_corrected_value: >-
    current_batch_id: BATCH-d44912; updated_at: '2026-08-10'; three
    batch_checkpoints entries appended (BATCH-56498f, BATCH-d44912, and the
    2026-08-06 scope correction recorded as a non-batch direct ledger commit);
    three next_action_history entries appended (the two overwritten texts, each
    reconstructible only as far as its leading line, plus the spliced text now
    replaced); one concrete, non-self-contradictory next_action derived from
    DEC-20260805-a62164's own what_needs_to_be_established_freshly.

  reason: >-
    A goal head is the one field set every future session reads first to decide
    what to do next. This one directed a reader to a batch that closed on
    2026-08-02, hid two later batches with committed evidence and decisions,
    contradicted itself about whether the cheapest remaining move was already
    made, and asserted that no further action was required while its own
    governing decision lists two items that still need establishing. Each of
    those is separately recorded below, with its prior value, its corrected
    value, and the committed evidence for the corrected value.

  what_this_session_could_and_could_not_verify: >-
    THIS SESSION HAS NO SHELL AND RAN NO GIT COMMAND. Every commit sha, every
    statement about which commit changed which line of GOAL-HAWK-001.yaml, and
    every claim about a diff's contents was established by the orchestrating
    session directly against this worktree and is carried here as given; this
    record does not re-derive them and does not add any sha of its own.
    Everything else below - the contents of every ledger record, review report,
    knowledge entry and batch directory cited - was READ DIRECTLY FROM THE
    FILES in this worktree by the Coordinator writing this record. Where the
    two sources differ, the divergence is recorded verbatim under
    `divergences_from_the_briefing_this_session_received` rather than smoothed
    over. NO SHA IS RECONSTRUCTED, INFERRED, OR ESTIMATED ANYWHERE IN THIS
    RECORD; that is the exact fabrication AGENTS.md core rule 5 forbids and the
    reason latest_verified_commit is left unchanged (see D5).

  defects:

    - id: D1
      title: >-
        current_batch_id was silently regressed from BATCH-d44912 to BATCH-002
        by resolving a merge conflict INSIDE a committed ledger record
      severity: root_cause
      field: research_goal.current_batch_id
      prior_value: BATCH-002
      corrected_value: BATCH-d44912
      action: CORRECTED_IN_HEAD
      how_it_happened: >-
        Commit 893483df8 (the BATCH-d44912 ledger archive) set current_batch_id
        from BATCH-56498f to BATCH-d44912. Commit 61d5ccbb1 (the 2026-08-06
        scope correction) LEFT it at BATCH-d44912. Merge commit 3994acb2d then
        resolved a conflict in this file by picking a side: `git diff 61d5ccbb1
        3994acb2d -- ledger/goals/GOAL-HAWK-001.yaml` shows EXACTLY ONE hunk
        changing EXACTLY ONE line, BATCH-d44912 -> BATCH-002, and nothing else
        in the file. The regressed value is not nonsense - BATCH-002 is a real,
        genuinely closed batch with its own checkpoint - which is precisely why
        the regression survived: it reads as a plausible head rather than as
        damage.
      rule_violated: >-
        AGENTS.md, "Durable research commits": a branch is kept current by
        merging, and the merge "never resolves a conflict: when a sync conflicts
        inside a ledger record, run artifact, or knowledge entry, the resolution
        is a new superseding record under a new id - the same rule as any other
        correction - and never an edit that picks one side." Restated in
        agents/coordinator.md "Branch and PR discipline" item 1 and in CLAUDE.md.
      this_record_is_the_required_supersession: >-
        YES. The rule requires a new superseding record under a new id; this is
        that record. Commit 3994acb2d is immutable and is NOT rewritten, and no
        history is rebased. What is corrected is the live head field, plus this
        durable statement of what the merge did and why it was not permitted.
      evidence_for_the_corrected_value:
        - >-
          893483df8 set current_batch_id to BATCH-d44912 (verified git fact,
          established by the orchestrating session).
        - >-
          3994acb2d's single-line reversal (verified git fact, established by
          the orchestrating session).
        - >-
          SIX COMMITTED RECORDS, ALL READ DIRECTLY IN THIS WORKTREE, SELF-LABEL
          batch_id: BATCH-d44912 - ledger/decisions/DEC-20260805-77a735.yaml,
          ledger/decisions/DEC-20260805-ed4cd3.yaml,
          ledger/decisions/DEC-20260805-a62164.yaml,
          ledger/evidence/EV-HAWK-68b8b6.yaml,
          ledger/evidence/EV-HAWK-c99848.yaml,
          ledger/evidence/EV-HAWK-21edba.yaml. No committed record produced
          after 2026-08-02 carries batch_id: BATCH-002.
        - >-
          BATCH-002 HAS NO DIRECTORY under coordination/goals/GOAL-HAWK-001/
          batches/ (directory listing; the head's own BATCH-002 checkpoint says
          "NOT CONSTRUCTED", per CORR-20260802-bc9e33 OI-3), whereas
          BATCH-56498f and BATCH-d44912 both do.

