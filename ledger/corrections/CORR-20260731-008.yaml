      When TASK-20260731-706 writes DEC-20260731-025, that decision should cite
      CORR-20260731-008 in its provenance so the mismatch against
      DEC-20260731-012's reservation is explained inside the decision series.

  reason: >-
    REPRESENTATIONAL / ARCHIVAL METADATA ONLY. A concurrent session merged main
    into this branch and remapped the AES and FAEST decision IDs because they
    collided with records already published on main. The remap was incomplete:
    stale DEC-20260731-005 references remained in the GOAL-AES-001 goal record
    and BATCH-002 queue, and TASK-20260731-706 still reserved two IDs
    (DEC-20260731-004, KN-FIND-012) that belong to GOAL-MLKEM-003 records on
    the merged tree. Left unrepaired, TASK-20260731-706 would have attempted to
    write over another campaign's decision and knowledge entry, which is an
    evidence-integrity failure. This correction records the completion of that
    ID-reference repair. It was NOT recorded as a coordinator_decision because
    it effects no state transition and asserts no judgement: a decision record
    whose only content is that a merge renumbered files would dilute the
    decision series rather than document it.

