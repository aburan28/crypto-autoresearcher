correction:
  id: CORR-20260916-d51133
  recorded_at: '2026-09-16'
  recorded_by: coordinator
  goal_id: GOAL-ICPERF-e6b6a4
  batch_id: BATCH-a33cda
  produced_by: top-level coordinator session, cursor/semaev-2015-audit-program-5b8b
  archived_by: TASK-20260915-7da7f1
  kind: additive_contract_amendment_disclosure
  corrects:
    - >-
      experiments/EXP-ICPERF-e21835/specification.yaml — the frozen contract's declared defect list
      D1-D5 does not cover the change in commit e1728d8a8. Amended additively by this record; the
      contract file is NOT edited.
    - >-
      The implicit reading that the instrument certified by RUN-ICPERF-a4a24b is the instrument now in
      the tree. It is not, as of e1728d8a8.
  nature: >-
    THE INSTRUMENT CHANGED AFTER THE RUN THAT WAS MEANT TO CERTIFY IT, AND WHILE THE REVIEW OF THAT RUN
    WAS IN FLIGHT. Commit e1728d8a8 ("Fix runner polling latency"), authored by a concurrent session and
    arriving in this branch by merge, modifies `experiments/EXP-ICPERF-e21835/code/bench.py` — the
    Runner that took every timing in RUN-ICPERF-a4a24b.

    The change replaces the poll loop's `time.sleep(RSS_POLL_INTERVAL_S)` with a bounded
    `p.wait(timeout=min(RSS_POLL_INTERVAL_S, timeout - elapsed))`, so a child that exits mid-interval is
    noticed at once instead of after the remainder of the interval.

    Three facts, which point in different directions and are recorded separately because collapsing them
    would misrepresent the situation:
      1. THE FIX IS CORRECT AND IT FIXES SOMETHING REAL. Epoch 2 disclosed wall-time quantization for
         fast children as an anomaly; this is its cause and its cure. Reviewed for the obvious hazard: the
         `timeout` check precedes the wait, so `timeout - elapsed` cannot be negative at that point, and
         where it is exactly zero `wait` raises immediately and the loop's own timeout branch breaks on
         the next pass. It cannot spin and it cannot hang. RSS sampling cadence is unchanged, since `wait`
         returns after at most one poll interval.
      2. IT IS NOT COVERED BY THE FROZEN CONTRACT. EXP-ICPERF-e21835 declares a defect list D1-D5 and this
         is a sixth change. No amendment existed for it before this record.
      3. IT CHANGES THE DEFINITION OF A MEASURED QUANTITY. `wall_s` for a fast child means something
         different before and after. Every `wall_s` in results.jsonl and results_engine.jsonl was measured
         under the OLD behaviour, so a re-run against the current tree will not reproduce them for fast
         children — by design, and that is exactly why it must be written down.
  hash_divergence:
    accepted_bench_py_sha256: d835b1ead969989d58857bfd46d107f2bd42ec2faa8be80fa3bd203e9016cc05
    frozen_predecessor_sha256: e8aad273646c4eb12efbcd0bfb75ca42a8278d2046549ffeb3f53d49388c88d8
    tree_bench_py_sha256_after_e1728d8a8: 2eee015387b61ae67db89331dcf97218f16dae1c2dcd754eacb241dd723e83b5
    consequence: >-
      Any agent that recomputes bench.py's hash against the run manifests from now on WILL FIND A
      MISMATCH, and that mismatch is real rather than an integrity failure of the run. The run's
      provenance is intact because it binds a commit: manifest_v2.yaml records
      code.commit 2bfdc65b13f70c74120a91e9b488a4c3ed531452, and a reader who checks out that commit gets
      the bytes that were measured. THIS IS PRECISELY WHY `code.commit` IS A REQUIRED FIELD, and the first
      time in this campaign that it has done any work.
  amendment:
    id: D6
    added: '2026-09-16'
    authority: >-
      Recorded by the Coordinator as an ADDITIVE amendment under AGENTS.md's rule that changing a frozen
      protocol uses an additive amendment and never a rewrite of a historical record. The contract file
      and both run manifests are untouched.
    defect: >-
      Runner.run's poll loop slept the full RSS_POLL_INTERVAL_S after a child had already exited, so
      `wall_s` was quantized to multiples of the poll interval. For a child faster than the interval the
      reported wall time was dominated by the polling artifact rather than by the child.
    change: >-
      `time.sleep(RSS_POLL_INTERVAL_S)` replaced by a bounded `p.wait()` that returns as soon as the child
      exits and otherwise times out after at most one poll interval.
    status: UNACCEPTED
    status_meaning: >-
      NO RUN HAS EXERCISED THIS CODE. RUN-ICPERF-a4a24b certified the pre-D6 bytes and cannot speak to
      D6; the acceptance criteria it satisfied were satisfied by a different Runner. The instrument in the
      tree is therefore un-certified, and that is a statement about the certificate rather than a doubt
      about the fix.
    what_acceptance_would_require: >-
      A run that measures a child fast enough for the interval to matter and shows `wall_s` tracking the
      child rather than the interval, alongside the existing watchdog null controls re-run to show that
      D6 did not weaken RSS enforcement — the resident-set null object must still be killed and the
      address-space null object must still survive, since D6 touches the same loop that decides both.
    ranked: >-
      Behind the review round already in flight. D6 is a latency fix on a measurement the campaign has not
      yet begun taking in anger, so accepting it is worth less right now than finishing the review of what
      the instrument does with memory.
  effect_on_the_in_flight_review:
    what_is_affected: >-
      TASK-20260915-3f4b52 (joints R1-R5) and TASK-20260915-abf147 (joint R6, blind) both read the code
      tree. R1-R5 includes a `proves_too_much` control that applies the acceptance to the UNREPAIRED tree,
      and R6 is a blind re-derivation of a load-bearing quantity. A reviewer that recomputes bench.py's
      hash will now find it matches neither the accepted nor the frozen value.
    what_a_reviewer_should_do: >-
      TREAT THE MISMATCH AS EXPECTED AND SAY SO, then review against the bytes at
      code.commit 2bfdc65b13f70c74120a91e9b488a4c3ed531452 rather than against the working tree. A verdict
      that the run's code provenance is broken would be WRONG, and a verdict that quietly reviews the
      post-D6 bytes as if they were the accepted ones would be worse, because it would certify code no run
      has exercised.
    this_is_not_a_downgrade: >-
      Nothing about the review's tier, independence, joint ownership or blindness changes. The plan and
      its addendum stand exactly as written; this record adds a fact the reviewers need, which is what
      `procedure_deviations` and plan addenda exist for.
  forward_guidance:
    - >-
      DO NOT EDIT AN EXPERIMENT'S CODE TREE WHILE ITS ACCEPTANCE RUN IS UNDER REVIEW. The window between
      a run and its review is the one time the tree must hold still, because that is the interval in
      which the tree and the record are supposed to be the same thing. A fix found in that window is
      recorded as an amendment and applied after, or applied with an amendment like this one — never
      applied silently.
    - >-
      A DISCLOSED ANOMALY IS AN INVITATION TO EXACTLY THIS MISTAKE. Epoch 2 wrote down the wall-time
      quantization honestly, and a session that read the anomaly list did the obvious helpful thing.
      Disclosure worked; what was missing was any signal that the disclosed defect was already inside a
      review's scope.
    - >-
      `code.commit` IS WHAT MADE THIS RECOVERABLE. Had the run recorded only per-file hashes, the measured
      bytes would now be unreachable from the record. It is worth noting that the field only existed on
      this run because a schema check forced it hours earlier.
  what_this_correction_does_not_assert:
    - >-
      NOT that the change should be reverted. It is a correct fix to a real defect and it stands. What it
      lacks is a run, not merit.
    - >-
      NOT that RUN-ICPERF-a4a24b is invalid or that any of its measurements is wrong. Every measurement
      stands at the commit its manifest records, unaltered.
    - >-
      NOT a performance claim of any kind. Whether the quantization ever mattered to a reported number is
      an open question this record does not answer; the Macaulay2 row's 49.2 s wall against a 2.0 s poll
      interval is plainly unaffected, and the fast SAT rows are where it could bite.
    - >-
      NOT an acceptance of D6, and not a criticism of the concurrent session's engineering judgement. The
      defect is that a certified artifact moved without a record, which is a process failure and not a
      coding one.
  citations:
    - claim: The content and correctness of the change.
      source: git commit e1728d8a8, experiments/EXP-ICPERF-e21835/code/bench.py Runner.run
      provenance: internal
      verified_by: >-
