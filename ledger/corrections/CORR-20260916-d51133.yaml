        negative-timeout and spin hazards against the order of the loop's guards.
    - claim: The three hashes and the accepted/frozen values.
      source: >-
        experiments/EXP-ICPERF-e21835/runs/RUN-ICPERF-a4a24b/manifest.yaml `code.files`, and sha256sum on
        the working tree
      provenance: internal
      verified_by: coordinator, this session.
    - claim: That epoch 2 disclosed the wall-time quantization as an anomaly.
      source: experiments/EXP-ICPERF-e21835/runs/RUN-ICPERF-a4a24b/manifest-epoch2.yaml
      provenance: internal
      verified_by: coordinator, this session, which read the anomalies block.
