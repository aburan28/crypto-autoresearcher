# =====================================================================
# CORRECTION -- CORR-20260916-c5bb9c
# Discloses an IN-PLACE EDIT of an APPROVED, MERGED experiment contract,
# and the decision text it falsified. Preserves both values. WRITE-ONCE.
# =====================================================================

correction:
  id: CORR-20260916-c5bb9c
  recorded_at: '2026-09-16'
  recorded_by: coordinator
  goal_id: GOAL-ICPERF-e6b6a4
  batch_id: BATCH-94168f
  archived_by: null
  archived_by_note: >-
    Snapshot commit on the research branch alongside the v2 bump it discloses.
    It changes no research status, so it needs no ledger archive of its own.

  record_type: claim
  record_id: EXP-ICPERF-2f2e40
  corrects:
    - EXP-ICPERF-2f2e40
    - DEC-20260916-a91144

  nature: >-
    DISCLOSES AN IN-PLACE EDIT OF AN APPROVED CONTRACT AND A DECISION
    STATEMENT IT FALSIFIED. Commit 19566947c ("EXP-ICPERF-2f2e40: carry (23,6)
    and (23,8) on the producer grid for EXP-ICPERF-61c136's l-cancellation",
    author "Cursor Agent", 2026-09-16T09:08:11Z) added two candidate cells to
    EXP-ICPERF-2f2e40 AFTER that contract had been approved at version 1 by
    DEC-20260916-3c0cf5 and merged to main. No amendment record accompanied
    it and the version stayed at 1.

    This is the second instance of the same pattern on this goal in two days;
    CORR-20260915-3965c1 disclosed the first, on a DRAFT contract. The
    difference matters: an approved contract that changes at a fixed version
    makes every later archive receipt binding "EXP-ICPERF-2f2e40 v1" ambiguous
    between two different producer grids, and a receipt that cannot say which
    protocol it bound is not a receipt.

    THE EDIT IS RETAINED, NOT REVERTED. It closes a real gap.

  substance_of_the_edit:
    field: >-
      EXP-ICPERF-2f2e40 grid.candidate_new and grid.candidate_new_note; the
      paired producer-grid sentence in EXP-ICPERF-61c136.
    prior_value: >-
      The approved v1 grid carried the three shipped cells and no candidate_new
      entry for (23,6) or (23,8). EXP-ICPERF-61c136's l-cancellation prediction
      was recorded by DEC-20260916-3c0cf5 as NOT EVALUABLE on the frozen grid,
      because that prediction needs two cells sharing n and differing in l and
      no candidate cell did.
    corrected_value: >-
      candidate_new carries (23,6) and (23,8), declared for the l-cancellation
      prediction only, with candidate_new_note recording why. The prediction
      becomes evaluable if and only if both cells are admitted under the
      contract's own (cell, side) admission rule; if either is refused it still
      reports NOT EVALUABLE with its reason, which the design act already
      required.
    why_the_change_is_right: >-
      DEC-20260916-3c0cf5 recorded the gap at design time and could not close
      it from the shipped cells. Adding exactly two cells is the minimal fix
      and does not touch any control, metric, budget, stopping rule,
      invalidation rule or success criterion.

  what_this_correction_changes:
    - >-
      EXP-ICPERF-2f2e40 version 1 -> 2 via an ADDITIVE status_history entry
      citing this record. The v1 entry is unchanged. status stays `approved`
      and approved_by stays DEC-20260916-3c0cf5; nothing is re-approved.
    - >-
      Supersedes the statement in DEC-20260916-a91144 that the frozen contract
      was not edited. That statement was TRUE OF THAT SESSION -- the coordinator
      that wrote the decision edited nothing -- and FALSE OF THE RECORD by the
      time the decision was committed, because 19566947c had already landed on
      the same branch. Both values stand; the decision is not edited.

  what_this_correction_does_NOT_do:
    - >-
      Does not re-approve the contract, and is not an approval of the added
      cells for execution. Admission is decided per (cell, side) by the
      contract's own pre-pass at run time, not here.
    - >-
      Does not revert the mathematics, and does not rewrite EXP-ICPERF-61c136.
    - >-
      Asserts nothing about whether (23,6) and (23,8) will be admitted. The
      contract's admission rule is sized on |Fb_s|, which is not predictable
      from (n, l) -- that unpredictability is why the rule binds at
      (cell, side) rather than (cell).

  evidence_artifacts:
    - experiments/EXP-ICPERF-2f2e40/specification.yaml
    - experiments/EXP-ICPERF-61c136/specification.yaml
    - ledger/decisions/DEC-20260916-3c0cf5.yaml
    - ledger/decisions/DEC-20260916-a91144.yaml

  interpretation_limits:
    - >-
      PROCESS and PROTOCOL-PARAMETER correction. Not evidence for or against
      H-ICPERF-afe62e or H-ICPERF-81de5c, and it may not be cited as such.
    - >-
      A version bump records WHICH protocol a receipt binds. It does not make
      the added cells reachable, and no run has been made against either
      version of this contract.
