  - id: RET-1
    owner: executor
    record_id: EXP-QSP-33b442
    artifact: experiments/EXP-QSP-33b442/execution-report.yaml
    field: >-
      the parenthetical in the M3 metric summary, "minimum beta - exact =
      0.000000 (equality at two splitters)"
    prior_value: >-
      equality at TWO complete splitters
    corrected_value: >-
      equality at EXACTLY THREE complete splitters: lambda = X^2 + X and
      lambda = X^2 + X + 1 at (n, n', d) = (7, 3, 2), and lambda = X^4 + X^2 + X
      at (n, n', d) = (7, 4, 4).
    what_is_NOT_corrected: >-
      THE METRIC ITSELF IS RIGHT AND IS NOT TOUCHED. min(beta - exact) =
      0.000000 is correct, as is min(beta - conservative) = 7/32 = 0.21875, as
      are all 65 complete-splitter rows. Only the parenthetical count is wrong.
    reason: >-
      TASK-20260917-34b637 recomputed all 65 archived complete-splitter rows
      from (n, n', d) ALONE with exact rationals -- beta, n/(n + n' - r),
      n(n'-1)/(n'(n + n' - r)), both margins, q, r and the bound -- with 0
      disagreements with the archive on any column, and counted the equality
      cases directly. beta depends on (n, n', d) and not on N, so this
      recomputation trusts no counting instrument.
    also_overturns: >-
      CORR-20260917-8b80cc's inference of "at least four distinct splitters at
      equality", which was drawn from 8 literal `"beta_minus_exact": 0.0`
      occurrences in RUN-QSP-33b442-S2B/raw-result.json. The correct answer is
      three. That record's CLASSIFICATION of the item -- a prose imprecision
      rather than a measurement defect -- is CONFIRMED, not overturned.
      A Coordinator arithmetic inference and an Executor prose count were both
      wrong, in different directions, about the same quantity; the independent
      recomputation is what settled it, which is recorded in
      DEC-20260917-793ae2 prior_calibration as one of the three places the round
      corrected the Coordinator.
