    - ledger/corrections/CORR-20260917-8b80cc.yaml

  - id: RET-2
    owner: executor
    record_id: RUN-QSP-33b442-S5
    artifact: experiments/EXP-QSP-33b442/runs/RUN-QSP-33b442-S5/report.md section 7
    field: the Stage 5 report's summary sentence describing the n = 131 census
    prior_value: >-
      "732 exact, independently re-verified counts"
    corrected_value: >-
      732 exact counts at n = 131, of which 546 are certificate-bearing and
      independently re-verified. The archive carries 732 candidate rows: 546
      with N > 0 and a certificate_path, and 186 with N = 0 and
      certificate_path null.
    reason: >-
      THE SENTENCE CONTRADICTS THREE OF THE RUN'S OWN RECORDS -- the execution
      report, that report's own M4 section, and raw-result.json, all three of
      which say 546 (`certificates_written: 546`) -- and 546 certificate files
      exist on disk. "Independently re-verified" is a DEFINED OPERATION in this
      contract (the run wrapper checks that every listed x satisfies
      x^{2^{n'}} = lambda(x) in K and that the listed roots are pairwise
      distinct) AND IT CANNOT BE PERFORMED ON AN EMPTY ROOT LIST. The contract's
      own required_artifacts defines the Stage-3 certificates as "one file per
      n = 131 candidate WITH N > 0", so the 186 rows with N = 0 correctly have
      no certificate; the defect is in the sentence, not in the run.
    relation_to_the_contract_headline: >-
      THIS IS A SEPARATE, SHARPER INSTANCE AND NOT A DUPLICATE. The frozen
      contract's own pre-registered success headline says "732
      certificate-bearing exact counts at n = 131", overstating by 186 rows --
      732 claimed against 546 that exist, 34% more than exist (732/546 =
      1.3407); the 186 surplus is 25% of the 732 claimed and 34% of the 546
      actual. That headline defect is the J5 break recorded in
      DEC-20260917-793ae2 and is NOT corrected here: a frozen contract is not
      amended after the fact, and the corrected headline is recorded in the
      decision and carried by H-QSP-645a07 interpretation_limits and by
      KN-FIND-617d78. What RET-2 corrects is the Stage 5 report's SHARPER
      restatement, which adds "independently re-verified" to the same wrong
      count.
    counterexample_certificate: >-
      This item reaches COUNTEREXAMPLE-CERTIFICATE tier against the sentence
      (docs/claims-and-verification.md, "Refutation artifacts"): 186 named rows,
      re-countable by any reader from the committed cell JSONs under
      RUN-QSP-33b442-S3/cells/.
    what_is_NOT_corrected: >-
      NO COUNT, HISTOGRAM, ROOT LIST OR CERTIFICATE IS WRONG. max N = 132 at
      n' = 33 with histogram {0:62, 1:118, 2:60, 132:4}; max N = 2 at n' = 44
      and n' = 66 with histogram {0:62, 1:122, 2:60} each; 546/546 certificates
      independently re-verified with 0 failures; and the n' = 33 cell's maximum,
      argmax, histogram and orbit structure were independently re-derived BLIND
      by TASK-20260917-5fa7d5 with EXACT agreement.
    evidence_artifacts:
    - coordination/investigations/QSP-ECC2K130/tasks/TASK-20260917-34b637/report.md
    - coordination/investigations/QSP-ECC2K130/tasks/TASK-20260917-34b637/out/j5_census_enum.txt
    - experiments/EXP-QSP-33b442/runs/RUN-QSP-33b442-S3/raw-result.json
    - experiments/EXP-QSP-33b442/runs/RUN-QSP-33b442-S3/certificates/
    - ledger/evidence/EV-QSP-a6aa4b.yaml

  - id: RET-3
    owner: TASK-20260917-34b637 (validator-breakthrough)
    record_id: TASK-20260917-34b637
    artifact: >-
      coordination/investigations/QSP-ECC2K130/tasks/TASK-20260917-34b637/out/j1_grand_total.txt
      versus the prose of the same task's report.md
    field: the J1 sweep's grand totals
    prior_value: >-
      TWO FIGURE SETS THAT DO NOT RECONCILE. The machine roll-up
      (out/j1_grand_total.txt) records 205 rows / 292105 candidates / "degenerate
      (D == 0): 46" / 12 boundary rows covering 53993 candidates (29526 survive +
      24421 cancel). The report's prose gives deduplicated totals of 203 rows /
      291997 candidates, and 10 boundary rows covering 53885 with 29526 / 24321 /
      38 degenerate.
    corrected_value: >-
      NOT ADJUDICATED, AND DELIBERATELY SO. This record does not pick a side.
      Only the reviewer that produced both artifacts can say which figure set is
      the deduplicated one, which the raw, and where the 2 rows / 108 candidates
      / 8 degenerate / 2 boundary rows went. THE CORRECTION HERE IS THAT THE
      DISCREPANCY IS FILED AGAINST THE OWNING TASK rather than left standing
      only inside an evidence record's `unresolved_confounds`.
    reason: >-
      A Coordinator that adjudicated this would be choosing between two
      artifacts it did not produce and cannot re-derive, which is exactly the
      move CORR-20260917-8b80cc refused when it declined to repair the
      producer's "equality at two splitters". Assigning it back is the correct
      disposition, not an evasion.
    why_no_verdict_depends_on_it: >-
      EVERY VIOLATION COUNT IS 0 IN BOTH FIGURE SETS: 0 candidates with
      N > max(d^{q+1}, p^{n'-r}), 0 with deg D above the bound, 0 where the
      K-root set of L fails to divide D, 0 brute-vs-gcd disagreements, 0
      injection-vs-gcd disagreements, and the largest N/bound anywhere exactly
      1.0. J1 HOLDS under either reading. EV-QSP-a6aa4b quotes the MACHINE
      ROLL-UP wherever it quotes a total and names the report's deduplicated
      figures beside it, which is why the disagreement is visible at all.
    resolution_route: >-
      A superseding record from TASK-20260917-34b637's owner naming which figure
      set is which, or a re-run of the roll-up against the deduplicated cell
      list. Either supersedes this item by a new record and NEVER by an edit to
      this one or to the reviewer's artifacts.
    evidence_artifacts:
    - coordination/investigations/QSP-ECC2K130/tasks/TASK-20260917-34b637/out/j1_grand_total.txt
    - coordination/investigations/QSP-ECC2K130/tasks/TASK-20260917-34b637/report.md
    - ledger/evidence/EV-QSP-a6aa4b.yaml

