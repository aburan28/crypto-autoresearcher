correction:
  id: CORR-20260805-3d9c47
  title: >-
    Declared snapshot commit in EV-MLKEM-da9e3b (live body, BATCH-d2a728) does not
    resolve to an object in this repository
  recorded_at: '2026-08-05'
  recorded_by: coordinator
  record_type: evidence
  record_type_note: >-
    templates/research-records.md offers candidate|claim|run for this field. None
    fits: the defect is in a provenance field of a committed EVIDENCE record. The
    vocabulary is extended rather than forced, so the record is not miscategorised.
  record_id: EV-MLKEM-da9e3b
  field: snapshot_commit
  prior_value: 8cc51677f7205d8b6b2f66e5ba31f0d8bbb84c9e
  corrected_value: null
  corrected_value_note: >-
    DELIBERATELY NULL. This record establishes that the declared value does not
    resolve; it does NOT supply a replacement. Supplying one would require
    deciding what the field was meant to contain, which is a question about intent
    that the evidence below cannot answer. See `what_this_does_not_establish`.

  supersedes: null
  relates_to:
    - CORR-20260805-527ffc
    - CORR-20260805-527ffc-branch-EV-MLKEM-da9e3b.yaml
    - DEC-20260805-7b3e91

  # ───────────────────────────────────────────────────────────────────────────
  # WHAT WAS CHECKED, AND BY WHOM
  # ───────────────────────────────────────────────────────────────────────────
  check_performed:
    performed_by: >-
      The dispatching session, at this Coordinator's request. This Coordinator has
      no command execution and did not run these commands; the outputs below are
      reported, not reproduced here.
    performed_at: '2026-08-05'
    repository_state: >-
      A clone containing origin/main. Stated explicitly because "the object exists
      but has not been fetched" is the ordinary benign explanation for a
      non-resolving sha, and it is excluded here.
    commands_and_outputs:
      - command: git cat-file -t 8cc51677f7202e9f9b85efdf834860254798abf4
        output: commit
      - command: git cat-file -t 8cc51677f7205d8b6b2f66e5ba31f0d8bbb84c9e
        output: could not get object info
      - command: git rev-parse --disambiguate=8cc51677
        output: 8cc51677f7202e9f9b85efdf834860254798abf4 only
    resolving_commit_detail: >-
      The resolving value is a commit dated 2026-08-03 whose message is
      "snapshot: BATCH-d2a728 first sieve measurement (TASK-20260803-aa727e
      archiving e53ce2)", reachable from origin/main and from every branch in the
      clone.
    prefix_relation: >-
      The two 40-hex values share their first twelve hex characters; the remaining
      twenty-eight differ. `--disambiguate=8cc51677` returns exactly one object,
      so no second commit in this repository carries that short prefix.

  # ───────────────────────────────────────────────────────────────────────────
  # THE FINDING
  # ───────────────────────────────────────────────────────────────────────────
  finding: >-
    The value declared in the `snapshot_commit` field of the LIVE
    ledger/evidence/EV-MLKEM-da9e3b.yaml -- the body that came from main and is
    currently authoritative -- is not an object in this repository. The value
    declared in the BRANCH body of the same record, preserved verbatim at
    ledger/corrections/CORR-20260805-527ffc-branch-EV-MLKEM-da9e3b.yaml, is a real
    commit. This is an AGENTS.md rule 5 matter: provenance is one of the things
    that rule names, and a 40-hex commit identifier is an assertion about the
    repository that is either true or false and is cheap to check.

  distribution_of_the_two_values: >-
    Recorded because it bounds the defect precisely. Every PRODUCER and REVIEWER
    artifact for BATCH-d2a728 names the RESOLVING value: the snapshot receipt
    (archives/TASK-20260803-aa727e/snapshot_receipt.json, field commit_sha), the
    batch dispatch queue, the validator's report.yaml, validation_report.yaml and
    validation_notes.md (TASK-20260803-535d15), and the red team's report.yaml,
    red_team_report.yaml and falsification_review.md (TASK-20260803-bc2f41). The
    NON-RESOLVING value appears in exactly three places, all written after review:
    the live EV-MLKEM-da9e3b `snapshot_commit`, the GOAL-MLKEM-004 batch_log entry
    for BATCH-d2a728, and the `reviewed_snapshot` field of
    archives/TASK-20260803-586a7f/ledger_commit_receipt.json. (Two further
    occurrences, in CORR-20260805-527ffc and this record, are descriptive quotation
    and are not declarations.)

  consequence_for_review_provenance: >-
    The ledger archive receipt's `reviewed_snapshot` therefore names a commit that
    does not exist, while the two independent review reports it archives each
    record, in their own committed text, that they reviewed the commit that does.
    The reviewers' own statements of what they reviewed are unaffected by this
    defect; the receipt's restatement of it cannot be verified.

  # ───────────────────────────────────────────────────────────────────────────
  # WHAT THIS MEANS FOR ANYTHING THAT BINDS THE VALUE
  # ───────────────────────────────────────────────────────────────────────────
  binding_consequences:
    - artifact: coordination/goals/GOAL-MLKEM-004/batches/BATCH-d2a728/archives/TASK-20260803-aa727e/snapshot_receipt.json
      binds: 8cc51677f7202e9f9b85efdf834860254798abf4 (commit_sha)
      consequence: UNAFFECTED. Resolves; remains commit-verifiable.
    - artifact: coordination/goals/GOAL-MLKEM-004/batches/BATCH-d2a728/archives/TASK-20260803-586a7f/ledger_commit_receipt.json
      binds: 8cc51677f7205d8b6b2f66e5ba31f0d8bbb84c9e (reviewed_snapshot)
      consequence: >-
        Its `reviewed_snapshot` pointer cannot be commit-verified: there is no
        object to reach. CLAUDE.md's content-first rule limits the damage --
        research_dispatch.py verifies declared path hashes and treats commit
        reachability as advisory, reporting an archive as content-verified when a
        commit cannot be reached, with a content mismatch still fatal. This receipt
        does declare content hashes: `source_path_sha256` carries four
        repository-relative paths with sha256 values. So a content binding exists
        in form and may still stand.
      unverified_by_this_record:
        - >-
          Whether research_dispatch.py consumes the key `source_path_sha256` (this
          receipt's spelling) or `path_sha256` (the spelling in
          templates/research-records.md and CLAUDE.md). If the verifier reads only
          the latter, this receipt has no content binding it can act on and the
          non-resolving pointer is its only remaining binding. CHECK THIS BEFORE
          relying on content verification here.
        - >-
          Whether the receipt's OWN commit_sha 35ab620987be6b7157b1b8f90a6d4c1df6812879
          and parent_sha c7df368e5f15087d17ff181086a9707487adc43e resolve. They
          were not among the commands run and are not asserted either way here.
    - artifact: ledger/goals/GOAL-MLKEM-004.yaml (BATCH-d2a728 batch_log entry)
      binds: 8cc51677f7205d8b6b2f66e5ba31f0d8bbb84c9e (snapshot_commit)
      consequence: >-
        The live goal record's batch_log declares a snapshot that cannot be
        reached. The goal record is not itself evidence, but this is the value a
        reader following the goal's own audit trail will land on.
    - artifact: ledger/evidence/EV-MLKEM-da9e3b.yaml
      binds: 8cc51677f7205d8b6b2f66e5ba31f0d8bbb84c9e (snapshot_commit)
      consequence: >-
        The record's substantive content is NOT impugned by this. Its certificate,
        its measurements, and both review verdicts stand on the artifacts, and the
        record's own prose refers throughout to the snapshot by the eight-hex short
        form "8cc51677", which is common to both values and is consistent with the
        resolving commit. What is defective is the one 40-hex field.

  # ───────────────────────────────────────────────────────────────────────────
  # SCOPE
  # ───────────────────────────────────────────────────────────────────────────
  what_this_establishes:
    - One declared snapshot commit resolves to an object in this repository.
    - The other does not, in a clone that contains origin/main.
    - >-
      The non-resolving value is the one in the live, main-derived body; the
      resolving value is the one in the branch body preserved under
      CORR-20260805-527ffc.
    - >-
      A receipt field that names it (`reviewed_snapshot`) cannot be
      commit-verified.

  what_this_does_not_establish:
    - >-
      HOW THE VALUE AROSE. A short prefix later extended by something other than a
      lookup, a transcription error, a copy from a rewritten history, and a
      coincidence are all consistent with what was checked, and this session cannot
      distinguish them. NO INTENT IS ALLEGED AND NONE SHOULD BE READ IN.
    - >-
      What the field was meant to contain. That every other BATCH-d2a728 artifact
      names the resolving commit is recorded above as an observation about the
      tree, not as a determination that the live field "should have been" that
      value. The two BATCH-d2a728 bodies differ in decision vocabulary, review task
      identifiers and content; they may describe different work, and
      CORR-20260805-527ffc did not determine which is the archived snapshot.
    - >-
      That any measurement, certificate, or review verdict in EV-MLKEM-da9e3b is
      wrong. Nothing here touches the science.
    - >-
      That main's GOAL-MLKEM-004 lineage is unreliable as a whole. One field in one
      record is not a lineage.

  related_observation_not_a_finding: >-
    The same ledger receipt carries `validator_diff`: "tools/validate_ledger.py: 20
    new errors vs baseline before these records, 20 after. ZERO new validation
    errors." That attestation was made on 2026-08-03. The validator's TypeError on
    a mapping-shaped knowledge_promotion entry -- which silently skipped every
    check after check_knowledge_entries, and which DEC-20260805-7b3e91 was written
    in response to -- is the reason 290 errors were invisible on this branch. It is
    NOT established here that the crash was reachable in the tree at that commit:
    the mapping-shaped entries this Coordinator inspected are dated 2026-08-04. The
    condition is stated so a reviewer can settle it cheaply, and it is recorded as
    an open check, not as a finding against the receipt's author.

  # ───────────────────────────────────────────────────────────────────────────
  # EFFECT ON THE GOAL-MLKEM-004 ADJUDICATION
  # ───────────────────────────────────────────────────────────────────────────
  effect_on_goal_mlkem_004_adjudication:
    verdict: strengthens_the_case_for_independent_review_does_not_settle_it
    does_not_settle_it_because:
      - >-
        The defect is in BATCH-d2a728, which is the ONE batch BOTH lineages share
        (branch batch_log: BATCH-d2a728, BATCH-e87ab3; main batch_log: BATCH-d2a728
        plus five others). It is a defect in the common prefix, not in the disputed
        tail.
      - >-
        The disputed question is whether GOAL-MLKEM-004 closed WITH a named
        obstruction (branch: DEC-20260804-bcdecb / EV-MLKEM-4a9cfe) or WITHOUT one
        (main: DEC-20260805-0b3e11 / EV-MLKEM-2cd08b). An unresolvable provenance
        pointer in a shared earlier batch is logically independent of that: it says
        nothing about which closure correctly characterises the evidence.
      - >-
        A defect in one field does not transfer to a lineage. Deciding otherwise
        would be exactly the kind of unsupported inference the closure dispute needs
        protecting from.
    strengthens_independent_review_because:
      - >-
        CORR-20260805-527ffc gave three reasons for treating main's lineage as
        live: it is the shared-trunk record, it is later, and it carries the
        terminal batch. NONE of those is a claim about correctness, and that
        correction said so. This check supplies the first checkable asymmetry
        between the two bodies, and it runs the other way: the branch body's
        provenance value verifies and the live body's does not.
      - >-
        CORR-20260805-527ffc recorded as an explicit limitation that "at most one
        can be the archived snapshot; this merge does not determine which, and does
        not verify either against the repository." That limitation is now PARTLY
        DISCHARGED: one is verified, one does not resolve. The remaining question --
        which body is the archived snapshot's record -- is unchanged.
      - >-
        AGENTS.md rule 12 already required independent review-breakthrough at max
        for this adjudication (two independently-committed closures of one goal,
        disagreeing about whether an obstruction exists, is a contradiction between
        validated evidence records; rule 12 is NOT suspended -- only rule 13 is).
        This adds a rule 5 provenance question to that reviewer's docket rather than
        creating a new process.
    what_must_not_be_done_on_the_strength_of_this_record:
      - >-
        Do not switch the live lineage to the branch's on the basis of this check.
        A verifying provenance field is not an argument about the obstruction.
      - >-
        Do not edit the live EV-MLKEM-da9e3b, the GOAL-MLKEM-004 batch_log, or the
        ledger receipt. All three are immutable; corrections supersede. This record
        is that correction for the first two, and the receipt is an archived
        artifact that must not be rewritten at all.
      - >-
        Do not retire, re-open or restate GOAL-MLKEM-004. `closed_at_budget`
        asserts no success and understates nothing.

  next_actions:
    - >-
      Verify whether research_dispatch.py reads `source_path_sha256` or
      `path_sha256`, and report whether the BATCH-d2a728 ledger receipt retains a
      content binding the verifier can act on.
    - >-
      Run `git cat-file -t` on the receipt's own commit_sha 35ab6209... and
      parent_sha c7df368e..., and record the result. If either fails to resolve the
      defect is broader than one field and this record must be superseded by one
      that says so.
    - >-
      Carry this record into the AGENTS.md rule 12 independent review-breakthrough
      session owed on the GOAL-MLKEM-004 double closure, as an input to that
      review and not as a substitute for it.
    - >-
      Settle the open check in `related_observation_not_a_finding` by testing
      whether the validator crashed on the tree at 8cc51677f7202e9f9b85efdf834860254798abf4.

  does_not_rewrite_history: true
  official_research_state_changed: false
  hypothesis_status_transition: none
