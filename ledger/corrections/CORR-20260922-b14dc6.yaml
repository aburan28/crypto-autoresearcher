  corrected_value: >-
    THE AUTHORIZATION IS VOID AS A MATTER OF PROCESS. GOAL-FROB-6333a9 (the
    goal record that owns EXP-FROB-d8aa37, confirmed by direct read of
    ledger/goals/GOAL-FROB-6333a9/goal.yaml on main) carries a live impediment,
    IMP-20260922-stage0, recorded by DEC-20260922-5796b8 and merged to main via
    PR #1360 -- BEFORE DEC-20260922-022f6c was drafted, committed, and pushed.
    Its recheck field states plainly: "Do not authorise a twentieth identical
    relaunch before the amendment lands." DEC-20260922-022f6c does exactly
    that. No future session may claim TASK-20260922-9c9ba0 or launch
    RUN-FROB-e94b2f under trial-plan-stage0-v24.json. IMP-20260922-stage0
    remains the controlling record for this experiment; its clears_when
    (stage0 amended to emit bounded aggregates instead of a per-tuple stream,
    to checkpoint per cell with a --resume path, and to resolve the
    interpreter by absolute path -- EXP-FROB-ec08b5's driver is the worked
    reference) governs the next authorized action, not DEC-20260922-022f6c.

  reason: >-
    SEQUENCING, NOT A HIDDEN CONFLICT DELIBERATELY IGNORED. The coordinator
    subagent that drafted DEC-20260922-022f6c and its four sibling artifacts
    was dispatched, and did its work, against this branch's state as of
    commit 8ff70732e (the RUN-FROB-7b3e6d preservation) -- before
    DEC-20260922-5796b8 / IMP-20260922-stage0 had merged to origin/main. The
    dispatching session did fetch and merge origin/main before committing the
    v24 authorization (merge commit visible in this branch's history), and
    that merge DID bring in GOAL-FROB-6333a9's updated goal.yaml carrying the
    new impediment -- but the merge's own content was not read before
    proceeding to commit and push DEC-20260922-022f6c. That is the actual
    process gap: `git merge origin/main` was treated as a mechanical
    prerequisite (confirm no conflicts, proceed) rather than as a reason to
    re-read state that might bear on the decision about to be authored. This
    is exactly the failure mode DEC-20260921-8aa5cf's own NA-4 escalation was
    written to guard against in a different guise: mechanically repeating a
    retry pattern without re-checking whether the grounds for it still hold.

    CAUGHT BY cursor[bot]'s review on PR #1362 (review_id 5279406610,
    comment_id 4072724231), independently verified by the dispatching session
    against ledger/goals/GOAL-FROB-6333a9/goal.yaml on main before this
    record was written. The review is correct: the impediment's diagnosis is
    well-founded and matches this lane's own observed failures directly --
    driver-v2.py writes one JSON record per signed tuple with no bound
    (exactly why RUN-FROB-4b8e05's partial output reached 2.44GB before the
    restart that ended it), has no checkpoint/resume path (so every
    environment reclamation loses the whole run, independent of the
    infrastructure-diagnosis findings in
    coordination/infrastructure/frob-d8aa37-restart-diagnosis-20260921/findings.md
    about WHY those reclamations happen), and does not resolve `sage` by
    absolute path (the driver invocation has only worked across nineteen
    launch attempts because this session's own launch wrapper has manually
    prepended /opt/conda-sage/bin to PATH every time -- a workaround at the
    dispatching-session layer that the frozen driver itself does not carry).

    ADDITIONALLY DISCLOSED: PR #1362 was merged by cursor[bot]'s automated
    merge pipeline (merged_by cursor[bot], merged_at 2026-09-22T14:23:25Z)
    BEFORE the dispatching session's own close-without-merge action (which
    had already read and accepted the review's finding) registered at
    2026-09-22T14:25:24Z -- a race between the automated merge pipeline and a
    manual correction attempt, the same failure mode previously observed and
    documented on PR #1323/#1324 in this lane. DEC-20260922-022f6c therefore
    reached main genuinely, not as an accident of a subsequent action; this
    correction record is the proper remedy, not a revert.

    THE SAME PROPAGATION GAP CAUGHT A SECOND, ENTIRELY SEPARATE AGENT BEFORE
    THIS CORRECTION COULD MERGE. PR #1365 (a Cursor cloud background agent,
    session bc-01a0c976-1721-7126-a373-5013934d2adb, distinct from this
    dispatching session, opened 2026-09-22T14:32:05Z, merged 14:34:38Z) read
    `main` at a moment when DEC-20260922-022f6c was live and merged but this
    correction (opened 14:30:28Z) had not yet reached it, and in good faith
    claimed TASK-20260922-9c9ba0 and launched RUN-FROB-e94b2f exactly as that
    decision authorized -- with no way to have known the authorization was
    already being corrected. This is not a second instance of the same
    process gap in this session; it is the identical propagation-lag failure
    mode landing on a different, independent actor, which is itself evidence
    the gap is structural to how fast a correction can reach concurrent
    readers of `main`, not particular to any one session's diligence. This
    correction does not retroactively fault PR #1365's own action, and does
    not attempt to interrupt or otherwise act on RUN-FROB-e94b2f -- it runs on
    infrastructure this dispatching session has no access to. Once
    RUN-FROB-e94b2f reaches a terminal state (completion, or a further
    interruption matching IMP-20260922-stage0's own diagnosis), that outcome
    is for a future decision or correction to record; this one states only
    what was true when it was written.

