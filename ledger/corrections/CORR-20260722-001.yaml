correction:
  id: CORR-20260722-001
  recorded_at: '2026-07-22'
  record_type: claim
  record_id: KN-FIND-SP4-EQUIV-001
  field: "Corollary 9 interpretation ('binding resource')"
  prior_value: >-
    "The binding resource is preprocessing SPACE, not solve time. Every approach
    that only speeds up the decomposition TEST (Groebner solving, degree of
    regularity, summation-polynomial elimination) provably cannot beat rho at
    m=3, no matter how fast it gets. This says the campaign's degree-of-regularity
    axis (DREG/SIG) is aimed at the wrong variable."
  corrected_value: >-
    WRONG AS STATED. Theorem 8's condition is S*T = o(B^2); Corollary 9 only
    establishes the special case S = Theta(B^2), T = 1, which indeed gives exactly
    2*sqrt(N). But an algebraic/Groebner decomposition test lives in the LOW-SPACE
    regime S = Theta(B) (it stores only the factor base and the polynomial system,
    not a pairwise table). There S*T = B*T = o(B^2) iff T = o(B). Hence a
    Theta(B)-space test with SUBLINEAR-in-B query beats rho: with T = B^{1-eps},
    total = N^{1/(2+eps)} < sqrt(N) for every eps > 0 (verified numerically:
    eps=0.2 -> N^0.473, eps=0.5 -> N^0.418 at N=1e16).
  reason: >-
    Self-audit (AGENTS.md rule 12: closure results require independent review).
    The original inference generalised a single point of the (S,T) trade-off to
    the whole frontier. In the low-space corner the binding resource is exactly
    the solve time, not space.
  evidence_artifacts:
    - research/THM-collection-lower-bound-20260722.md
    - knowledge/findings/KN-FIND-SP4-EQUIV-002.md
  consequence: >-
    The campaign's degree-of-regularity / summation-polynomial solving program
    (DREG, SIG) is REHABILITATED as a valid route: its correct target is a
    decomposition test with query cost o(B) at O(B) space. Theorem 8 itself and
    Corollary 9's arithmetic are unaffected.
