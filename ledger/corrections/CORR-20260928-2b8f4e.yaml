# =============================================================================
# CORR-20260928-2b8f4e -- the committed free-oracle floor table is not
# reproducible from the records that publish it.
#
# WHAT THIS IS: a disclosed reproducibility gap in KN-FIND-aa2efc and
# EV-ICPERF-10c5fc, found by two agents independently while attempting to build
# a control against the table, BEFORE any code for EXP-SEMBIN-04ec3c existed.
#
# WHAT IT IS NOT: it is NOT a claim that the six tabulated numbers are wrong,
# and it does NOT overturn either record's inference. Both independent
# reconstructions preserve the table's ordering, its monotone decrease in m, and
# the sign of every margin against rho -- including the two signs the inference
# rests on, m = 3 above rho and m = 4 below it. What is missing is the
# derivation, not the conclusion.
# =============================================================================
correction:
  id: CORR-20260928-2b8f4e
  recorded_at: '2026-09-28'
  record_type: claim
  record_id: KN-FIND-aa2efc
  also_affects:
    - EV-ICPERF-10c5fc
  also_affects_note: >-
    The same six values appear in EV-ICPERF-10c5fc's observations block ("THE
    PRODUCT LAW AND THE FREE-ORACLE FLOOR (derivation, not measurement)") and in
    its obstruction.value limb (a). The gap is one defect published in two
    places, not two defects.
  field: proof_refs[0] -- the stated derivation of the free-oracle floor table
  prior_value: >-
    "The free-oracle floor table is arithmetic on the product law, not a
    measurement: relations x targets x oracle = m * 2^131 independently of dim V
    gives a required oracle speedup of 2^-(70.19 + log_2 m), hence m = 2 ->
    2^89.25, m = 3 -> 2^68.58, m = 4 -> 2^56.40, m = 5 -> 2^48.44, m = 6 ->
    2^42.85, m = 8 -> 2^35.61."
  corrected_value: >-
    The two clauses before "hence" are sound and are NOT withdrawn. The product
    law is independent of dim V, and the required-speedup formula checks out
    exactly: 70.19 = 131 - 60.809. THE WORD "hence" DOES NOT HOLD. The six
    tabulated values do not follow from the sentence that introduces them: with
    the oracle charged 1 the product is m * 2^131, which is nowhere near 2^68.58,
    so the entries are evidently the cost AFTER optimising the factor-base
    dimension under a balance neither record writes down. That balance, and
    whatever convention fixes its constants, is UNPUBLISHED. The values stand as
    reported figures of unrecovered derivation; the claim that they are derived
    IN THESE RECORDS is withdrawn.
  reason: >-
    Two agents attempted the reconstruction independently, from the records' own
    text, while building a reproduction control for EXP-SEMBIN-04ec3c. Both
    arrived at the same standard balance -- relations |F|, trials m! N / |F|^m,
    linear algebra |F|^2, optimum at d = n/(m+1), cost 2^(2n/(m+1)) -- and both
    got 87.33, 65.50, 52.40, 43.67, 37.43, 29.11 at m = 2, 3, 4, 5, 6, 8,
    agreeing with each other to within 0.05 bits and with the committed table
    nowhere. The offsets are +1.92, +3.08, +4.00, +4.77, +5.42, +6.50: positive
    and MONOTONE INCREASING IN m, which is the signature of a different
    m-dependence rather than of a constant convention difference. Variants were
    tried and rejected: folding log2(m!) into the balance leaves residuals of
    1.25 to 3.11 bits, still monotone; using the 129-bit prime subgroup order in
    place of n = 131 fits worse; rounding the optimising d to an integer at m = 8
    gives 2^34.0 to 2^34.3 against the committed 2^35.61.
  practical_consequence: >-
    CONCRETE AND THE REASON THIS WAS FOUND AT ALL. EXP-SEMBIN-04ec3c's
    C-FLOOR-REPRO control required each FREE-model row within 5 bits of the
    committed table and would abort the run on disagreement. The m = 8 offset is
    6.50 bits, so the control as authored WOULD HAVE FAILED ON A CORRECT
    IMPLEMENTATION and aborted a run on a bad control rather than a bad result.
    Repaired pre-approval by that contract's amendment A1, which gates on
    convention-independent structure and demotes the offsets to a reported
    diagnostic with a declared expected signature.
  forward_guidance:
    conjectured_convention: >-
      A LEAD, EXPLICITLY NOT A RECOVERY, recorded so the next session does not
      repeat the two failed attempts from scratch. The committed rows are fit by
      2n/(m+1) + 2*log2(m) to within 0.08, 0.09, 0.00, 0.13, 0.25 and 0.50 bits
      at m = 2, 3, 4, 5, 6, 8 -- exact at m = 4. The residual is itself monotone,
      so this is a close fit and not an identification. Anyone closing this gap
      should test whether a factor of m^2 (or a per-summand charge of 2 bits)
      enters the producing script's oracle or relation accounting, and should read
      the external artifacts bound by sha256 in EV-ICPERF-10c5fc's
      external_provenance block rather than re-deriving from the ledger text.
    cheapest_closure: >-
      Read the sha256-bound summary files in github.com/aburan28/crypto --
      research/nagao_relations/solver_10/summary.json and
      solver_13/summary.json above all -- and recover the balance and constants
      that produce the six tabulated values. A records task, not a compute task.
      NOT dispatched by this correction.
    a_second_provenance_defect_found_while_writing_this: >-
      THE DOCUMENT EV-ICPERF-10c5fc NAMES AS THE SOURCE OF VALUE (a) IS NOT PRESENT
      AT origin/main. That record's `note_path` is
      RESEARCH_ECC2K130_RR_SOLVER_PANEL.md and its `measured_by_note` says value
      (a) is read "from the research note's section 5.3". The executing session
      checked origin/main of github.com/aburan28/crypto and reports the note
      ABSENT, while solver_10/summary.json and solver_13/summary.json are readable.
      So the one number this correction is about is attributed to a file that
      cannot now be opened, and the record's own reasoning for leaving it unhashed
      -- "it is the document a later session will extend, so pinning its bytes
      would make any extension read as a provenance mismatch" -- has cost more
      than it saved: an unhashed file that later disappears leaves nothing, whereas
      a hashed one would at least have recorded what was read.
    who_reported_that: >-
      The executing session, from a checkout this Coordinator cannot reach. I did
      not verify it myself and it is recorded as its report, not as my check. It is
      the reason the closure guidance above was rewritten to route to the two
      readable summary files instead of to the note -- sending a future session to
      a file that is not there would have been the more expensive error.
  what_this_does_not_withdraw: >-
    Stated explicitly because a reader scanning for damage will overread this.
    The inference of both records survives intact: the decomposition-oracle
    family is bounded below by its arity arithmetic rather than by oracle quality,
    a free oracle at m = 3 still loses to rho, and m = 4 is the first row even in
    principle below it. Both independent reconstructions agree with the committed
    table on ORDERING, on monotone decrease in m, and on the SIGN of every margin
    against 2^60.8090, which are the only properties that inference uses. The
    measured observations -- 32/32 against 0/32, the 0.494x null-object ratio,
    the candidate ratios at d = 4..8, the 0.12% amortisable share, the span
    saturation -- are untouched by this correction and are not in its scope.
  relation_to_prior_rulings: >-
    This is an INDEPENDENT AND ADDITIONAL reason to constrain citation of these
    two records, not a restatement of an existing one. DEC-20260918-4b7e21 ITEM-3
    ruled both `external_unreviewed` and ruled EV-ICPERF-10c5fc's
    `strength: replicated` not conferred by this program, on PROVENANCE grounds --
    no reviewer here has read the artifacts. This correction is about
    REPRODUCIBILITY: even a reader who accepts the provenance cannot rederive six
    of the published numbers from the published derivation. KN-FIND-aa2efc was
    already flagged by that decision as not citable as a replicated finding of
    this program; it is NOT quarantined by this correction, because its headline
    claim does not depend on the unrecovered constants.
  authorship_disclosure: >-
    The gap was disclosed by the author of both affected records, unprompted,
    while checking its own contract's control against them. Recorded because it
    bears on how the disclosure should be weighed: it is a self-report against
    interest, which is the cheap kind of finding this program wants to keep
    cheap. The correction nonetheless rests on two independent reconstructions
    read from the committed records, not on the author's concession -- the same
    discipline DEC-20260918-4b7e21 applied when it refused to rest
    CORR-20260918-3e91d7 on an inter-agent message.
  evidence_artifacts:
    - knowledge/findings/KN-FIND-aa2efc.md
    - ledger/evidence/EV-ICPERF-10c5fc.yaml
    - experiments/EXP-SEMBIN-04ec3c/specification.yaml
    - ledger/decisions/DEC-20260918-4b7e21.yaml
  archived_by: TASK-20260928-5a6b03
  recorded_under: DEC-20260928-7c3d91
