  content_assessment: >-
    A genuine, valid ambiguity catch in this Coordinator's own original
    prose. The original `background_reuse` clause named only "the
    random-ordinary `stage3_per_curve_raw_pvalues` (Var statistic)" as
    THE background panel, without stating that S3/S4 (the C/F Fisher
    panels) need a C/F-based background specifically -- a literal reading
    could pool a C/F treatment p-value with Var background p-values, an
    invalid, statistically meaningless Fisher combination. The fix
    correctly clarifies that `p_var_raw` backs the Var panels and
    `p_cf_raw` backs the C/F panels, matching the archived background
    data's own structure (each curve entry carries both fields).

    CHECKED DIRECTLY AGAINST THE ALREADY-COMPLETED RUN: the Executor's
    own `implementation/run.py` (lines ~170-171, ~255-256, confirmed by
    direct reading) already reads BOTH `p_var_raw` and `p_cf_raw` from
    the background panel and correctly pools each with its matching
    statistic's treatment p-value (`mixed_var` uses `background_p_var`;
    `mixed_cf` uses `background_p_cf`) -- the Executor resolved the
    ambiguity correctly on their own, independent of and before this
    out-of-band fix landed, simply by reading the archived data's actual
    field structure. RUN-MONO-b1423c-1's S1-S4 results are therefore
    UNAFFECTED: the ambiguity in the frozen text was never exploited.

