correction:
  id: CORR-20260825-e9f40a
  recorded_at: '2026-08-25'
  record_type: claim
  record_type_note: STATED RATHER THAN SILENTLY PICKED, per CORR-20260825-3105b9. The schema admits
    only candidate | claim | run; what is corrected is a CLAIM ABOUT DOCUMENT CONTENT -- specifically
    a claim of ABSENCE -- so `claim` is the closest true value.
  record_id: coordination/goals/GOAL-SCURVE-be9707/batches/BATCH-8f9107/tasks/TASK-20260824-c00879/parameter-capsule.yaml
  corrected_record: coordination/goals/GOAL-SCURVE-be9707/batches/BATCH-8f9107/tasks/TASK-20260824-c00879/parameter-capsule.yaml
  archived_in_snapshot: 3d77c6cb2cce
  field: source S1 (RFC 5903) `not_present` list
  prior_value: 'not_present: [SEED, cofactor, generation procedure]'
  corrected_value: 'RFC 5903 DOES contain the P-256 SEED and states the generation procedure. Verified
    independently against raw mirror bytes, not relayed: inputs/SAFECURVES-20260825/specs/rfc5903.txt
    (sha256 939fab548a6e6bb49a5b3c4dd24a3c5df54a46645447b2d6f4df4fd88ff2d69f) line 220 reads "The group
    was chosen verifiably at random using SHA-1 as specified in [IEEE-1363] from the seed:" and line
    222 carries the seed itself, "C49D3608 86E70493 6A6678E1 139D26B7 819F7E90". Only the cofactor is
    genuinely absent from that document.'
  mechanism: 'THE SUMMARIZER''S OMISSION SIGNATURE, NOT ITS CORRUPTION SIGNATURE. The producer fetched
    a document that contained the seed and received a summary that did not, then correctly recorded
    what it had been given. Every digit it recorded is exactly right; what was manufactured was a FALSE
    NEGATIVE. This is the trap that makes a claim of absence uniquely unsafe on this channel: a summarizer
    omission and a document omission are indistinguishable from the downstream side.'
  error_direction: OVER-QUARANTINE, NOT OVERCLAIM. Nothing downstream is overstated and no value is
    wrong. The cost is wasted budget and a blocked lane, not a false result -- which is the benign direction,
    and is stated so the correction is not read as more alarming than it is.
  downstream_consumers_to_release:
  - 'seed.corroboration: NONE -- the seed now has a primary-document witness'
  - the characterisation of the seed as "the single weakest link in the capsule"
  - conflict C5
  - planning finding F4
  - the block on lane L-RIGID, which this unblocks
  - successor handoff PS1, currently PRIORITY 1 against a problem that does not exist -- cancel or re-scope
    it
  independent_verification: The P-256 tuple itself was separately checked during the same sweep and
    is correct; this correction changes a statement about what a document contains, not any parameter
    value.
  affects_claims: false
  affects_claims_note: No hypothesis, evidence, decision, goal status, safety or vulnerability statement
    depends on this. GOAL-SCURVE-be9707 adjudicated no criterion cell.
  related:
  - CORR-20260825-c29738
