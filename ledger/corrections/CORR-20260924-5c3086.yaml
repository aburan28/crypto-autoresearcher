  field: >-
    Statements about what RH-1 attributes and the lost-record property it
    claims, the derivability of three DV-18 checks, the scope of RH-4's last
    sentence, RH-7's class inventory, condition (iii) for the cap-mismatch
    class, and the attribution of exec'd programs' outputs

  items:
    - item: 1
      what: RH-1's WHY sentence
      records:
        - id: AMD-EXP-GFPN-05ff43-20260924-gapattr
          path: experiments/EXP-GFPN-05ff43/amendments/v2_addendum_gapattr.yaml
          locations:
            - lines: 281-287
              context: RH-1 WHY POSITIVE ("No clause attributes a file by its directory alone ... so a file written by a launch whose record was lost stays a gap unless another record's own positive source names exactly that file.")
      prior_value: >-
        No RH-1 clause attributes a file by its directory alone, by a name
        pattern alone, or by the absence of another owner, so a file written by
        a launch whose record was lost stays a gap unless another record's own
        positive source names exactly that file.
      corrected_value: >-
        RH-1 (iv) attributes every file under a directory that exactly one
        launch record's argv names (comparator/ in the frozen launch set): a
        directory clause, carried from childend RG-4 (b) (review OB-1,
        review-report.yaml 839-849). And at a tag re-solved by SE-3 or HR-3
        every attempt's launch record carries the same stdout_path, stderr_path
        and argv (v2_driver.py 161-166; a1_health.py 141-147), so "another
        record's own positive source" ALWAYS names exactly the files of a lost
        attempt record: they are attributed to a sibling, no gap, PASS (CX-1,
        657-757; red_team_report proof_architecture_challenges 1013-1014). The
        stated property does not hold at re-solved tags.
      consequence: >-
        RFR-1 fails on CX-1 (DEC-20260924-1d7614). The successor attcount RI-1
        binds launch-record multiplicity to independent counts, and RI-2
        restates the sentence with (iv) named and RGL-8 and RGL-9 declared.
      evidence: review-report.yaml 284-300, 657-757, 839-849, 1013-1014; v2_driver.py 158-166 and a1_health.py 140-147 (read by DEC-20260924-1d7614).
    - item: 2
      what: the expected outcomes of RH-6 (i) (19), (20) and (22), and their "scratch copy"
      records:
        - id: AMD-EXP-GFPN-05ff43-20260924-gapattr
          path: experiments/EXP-GFPN-05ff43/amendments/v2_addendum_gapattr.yaml
          locations:
            - lines: 394-400
              context: RH-6 (i) (19) third case ("the same copy with one launch record of the tag removed yields a recorder gap and FAIL") and (20)
            - lines: 404-407
              context: RH-6 (i) (22) (".spec.json, .stdout, .stderr, .npz and .meta.json are recorder gaps")
      prior_value: >-
        On a scratch copy of a package, removing one launch record of a
        re-solved tag yields a recorder gap and FAIL, and removing a child-job
        launch record makes its five files (including the .npz) recorder gaps.
      corrected_value: >-
        Under RH-1 as worded, removing one launch record of a re-solved tag
        yields NO gap and PASS (FC-1, 769-776; CX-1), so DV-18 would STOP at
        (19) and (20) by construction. For a raw_grid child job the .npz is
        removed at v2_driver.py 144 on the normal path, so (22)'s five files
        exist only for an uncached build_poly child job (FC-2, 777-785). And
        RH-1 compares recorded absolute paths, so a copy moved to another root
        has every launch file unattributed (FC-3, 786-797): the "scratch copy"
        must stay at its recorded root.
      consequence: >-
        Fail-closed findings, never a bar. Repaired in attcount RI-3 ((19),
        (20) derivable under RI-1; (22) split by job kind; alterations made in
        place; the review's discriminating control added as (25)).
      evidence: review-report.yaml 766-797.
    - item: 3
      what: the scope of RH-4's last sentence
      records:
        - id: AMD-EXP-GFPN-05ff43-20260924-gapattr
          path: experiments/EXP-GFPN-05ff43/amendments/v2_addendum_gapattr.yaml
          locations:
            - lines: 351-355
              context: RH-4 ("with one, the frozen parent may continue where it would otherwise have raised at v2_solver.py 181, and the record FAILs the package instead")
      prior_value: With an exception during the callback, the record FAILs the package.
      corrected_value: >-
        That holds for an exception caught inside the callback's body or
        pending at its entry (review H4-a, H4-b, H4-c; 388-390). An exception
        escaping the callback's epilogue or another after-fork callback (H4-d,
        391-396) gets no mark and no FAIL; the child was created, execed and
        recorded and its pair read, so no failclosed definition holds (OB-2,
        850-859; recalled interpreter behaviour B-2, 897-903).
      consequence: None on any verdict. attcount RI-5 (c) states the scope.
      evidence: review-report.yaml 387-397, 850-859, 897-903.
    - item: 4
      what: RH-7's class inventory for the RH-2 class
      records:
        - id: AMD-EXP-GFPN-05ff43-20260924-gapattr
          path: experiments/EXP-GFPN-05ff43/amendments/v2_addendum_gapattr.yaml
          locations:
            - lines: 428-431
              context: RH-7 (the RH-2 class given no class letter; last bullet "lists ... the RH-2 class with exactly one class each")
      prior_value: DV-11's VC-3 inventory lists the RH-2 class with exactly one class.
      corrected_value: >-
        RH-7 assigns the RH-2 class no value class, as childend RG-8 left the
        RG-2 class, so the last bullet cannot be met as worded for it (review
        OB-4, 872-877; AJ-6 649-653).
      consequence: None on any verdict. attcount RI-5 (b) lists both classes as classification labels with no value class.
      evidence: review-report.yaml 649-653, 872-877.
    - item: 5
      what: condition (iii) for the cap-mismatch class
      records:
        - id: AMD-EXP-GFPN-05ff43-20260924-gapattr
          path: experiments/EXP-GFPN-05ff43/amendments/v2_addendum_gapattr.yaml
          locations:
            - lines: 313-318
              context: RH-2 (d) ("no launch of the class released a capped workload under a recorded cap equal to the requested cap")
        - id: DEC-20260924-61b22c
          path: ledger/decisions/DEC-20260924-61b22c.yaml
          locations:
            - lines: 516-526
              context: R-OB-B_referent_narrowing, condition (iii) and "PB-1 (RG-2) and PB-4 (gapattr RH-2) meet all four"
      prior_value: The cap-mismatch class meets condition (iii) as worded.
      corrected_value: >-
        It meets (iii) for the launches whose collected pair places an outcome
        in the class, which is how DEC-20260924-61b22c applied the condition to
        PB-4 ("a child's getrlimit read-back differs", R-PB-4 (1), lines
        468-475). An outcome that mixes such a launch with a measured launch
        under an equal cap contains a launch that did release a capped workload
        under an equal recorded cap (review OB-3, 860-871); it is in the class
        by its unequal pair, and every protocol version FAILs it by the frozen
        item v2_check_run.py 68-70 before any dependant reads it (AJ-3,
        503-521).
      consequence: >-
        None on any verdict; not outcome-determinative in DEC-20260924-1d7614.
        attcount RI-5 (a) states the launch-level reading before its review and
        makes it a joint (BJ-3).
      evidence: review-report.yaml 503-521, 860-871; DEC-20260924-61b22c 464-490, 503-526.
    - item: 6
      what: the attribution of an exec'd program's outputs
      records:
        - id: DEC-20260924-61b22c
          path: ledger/decisions/DEC-20260924-61b22c.yaml
          locations:
            - lines: 383-387
              context: R-reading_of_iv second bullet ("an exec'd argv program's outputs ... are either attributed to that record or are recorder gaps that FAIL the package")
      prior_value: >-
        An exec'd argv program's outputs are either attributed to the launch
        record that launched it or are recorder gaps that FAIL the package.
      corrected_value: >-
        Under gapattr RH-1 as worded, at a tag re-solved by SE-3 or HR-3 the
        outputs of one attempt's msolve child can be attributed to ANOTHER
        attempt's launch record of the same tag (CX-1; LR-2 attributes attempt
        1's renamed files to attempt 2's record, 734). The statement holds for
        launches whose output paths are unique to one launch record.
      consequence: >-
        The (iv) ruling itself is unchanged (CX-1 is not a foreign-process
        record; review 662). attcount RI-1 restores the statement by binding
        multiplicity to independent counts.
      evidence: review-report.yaml 657-757.

