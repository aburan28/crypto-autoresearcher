# =============================================================================
# CORR-20260924-5c3086 -- CORRECTS SIX STATEMENTS, EDITS NO FILE:
# the DRAFT AMD-EXP-GFPN-05ff43-20260924-gapattr and DEC-20260924-61b22c state
# (1) that no RH-1 clause attributes a file by its directory alone and that a
# file of a lost launch record stays a gap unless another record's own
# positive source names exactly that file; (2) that the DV-18 checks RH-6 (i)
# (19), (20) and (22) have the expected outcomes they state, on "a scratch
# copy"; (3) that with a callback-caught exception "the record FAILs the
# package instead"; (4) that DV-11 lists the RH-2 class "with exactly one
# class"; (5) that the cap-mismatch class meets condition (iii) without
# qualification; (6) that an exec'd program's outputs are either attributed to
# the record that launched it or are recorder gaps. The independent red-team
# review TASK-20260924-94cc33 (archived by TASK-20260924-93f3ca, commit
# 5792005e1) shows each is too strong, inexact or incomplete. Ruled in
# DEC-20260924-1d7614. WRITE-ONCE. Archived by TASK-20260924-2a7c7f.
# =============================================================================
