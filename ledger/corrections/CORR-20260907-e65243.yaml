  prior_value: >-
    (1) Both reviews independently found, and this Coordinator
    independently re-confirmed by reading implementation/run_experiment.py
    directly, that nonexceptional_full_box_fraction as COMPUTED is
    tautologically 1.0 by construction: `nonexceptional_targets` is
    defined as `{t : t not in observed_hull_set}` (the complement of the
    very hull-based classification being tested), so every element of
    that set already satisfies `saturated_flags[t] == True` by
    construction, making `nonexceptional_saturated_count ==
    len(nonexceptional_targets)` ALWAYS, regardless of the actual
    polynomial support. Both reviews confirmed this by an executed
    mutation test (a genuine injected falsifying instance still returns
    1.0 from this formula). As reported, this metric carries zero
    evidentiary weight on its own.
    (2) All four run manifests (RUN-SEMAEV-002-{a,b,c,d}) record
    `code.dirty: true`, computed from a broader `git status --porcelain`
    reading that includes untracked files from concurrent, unrelated
    tasks in the shared multi-agent worktree -- not from any tracked file
    actually differing from the pinned commit. specification.yaml's
    invalidation_rules states, unconditionally and without qualification,
    "Any run with a dirty code revision in its manifest is invalid,"
    which a literal reading of `code.dirty: true` trips, even though no
    tracked file was modified.

  corrected_value: >-
    (1) NONEXCEPTIONAL_FULL_BOX_FRACTION IS GENUINELY 1.0 AT ALL 8 TESTED
    CELLS -- not by construction, but as a THEOREM following from the
    independently-verified fact that `exception_set_identity_hull` is
    True at every cell (`observed_exception_set_hull ==
    predicted_exception_set` exactly, confirmed by both reviews and this
    Coordinator via separate, from-scratch code). Recomputing the metric
    against the CORRECT partition -- `nonexceptional_targets_corrected =
    F_p \ predicted_exception_set` (the independently, group-arithmetic
    predicted set specification.yaml's own success_criterion specifies,
    not the observed classification) -- using ONLY fields already
    archived in raw-result.json (`predicted_exception_set` and
    `observed_exception_set_hull`, both present per cell) requires no
    rerun: `nonexceptional_saturated_count_corrected = |F_p \
    (predicted_exception_set UNION observed_exception_set_hull)|`. Because
    the two sets are IDENTICAL at every cell (the independently verified
    fact), this equals `|F_p \ predicted_exception_set|` exactly, so
    `nonexceptional_full_box_fraction_corrected = 1.0` exactly, at every
    cell -- genuinely, not tautologically, because a genuine classification
    error (predicted_exception_set != observed_exception_set_hull at some
    cell) WOULD have produced a value < 1.0 under this corrected formula,
    unlike the original formula which could not decay under any input.
    This Coordinator independently computed this correction from the
    already-committed raw-result.json files for all 8 cells (verified with
    a standalone Python script, not by re-running run_experiment.py):

    | run | m | p | \|predicted_exception_set\| | identity | corrected fraction |
    |---|---|---|---|---|---|
    | RUN-SEMAEV-002-b | 3 | 101 | 2 | True | 99/99 = 1.0 |
    | RUN-SEMAEV-002-b | 3 | 103 | 2 | True | 101/101 = 1.0 |
    | RUN-SEMAEV-002-b | 3 | 107 | 2 | True | 105/105 = 1.0 |
    | RUN-SEMAEV-002-b | 3 | 211 | 2 | True | 209/209 = 1.0 |
    | RUN-SEMAEV-002-c | 4 | 101 | 3 | True | 98/98 = 1.0 |
    | RUN-SEMAEV-002-c | 4 | 103 | 3 | True | 100/100 = 1.0 |
    | RUN-SEMAEV-002-c | 4 | 107 | 3 | True | 104/104 = 1.0 |
    | RUN-SEMAEV-002-c | 4 | 211 | 3 | True | 208/208 = 1.0 |

    The corrected value coincides numerically with the originally-reported
    (tautological) value at every cell -- a coincidence of this particular
    dataset (since identity holds everywhere tested), not evidence that
    the distinction doesn't matter: a dataset where the hull classification
    disagreed with the predicted set at even one target would have
    produced a corrected value < 1.0 while the original buggy formula
    would still have reported 1.0. Going forward, this metric must be
    cited as "1.0, confirmed non-tautologically per CORR-20260907-e65243"
    or recomputed the corrected way; the raw, as-committed field value
    must not be cited as independent confirmation without this
    correction's context.

    IMPLEMENTATION FIX (not merely documented): this Coordinator also
    fixed the underlying bug directly in
    experiments/EXP-SEMAEV-002/implementation/run_experiment.py (driver
    code, not a frozen contract file named in specification.yaml's
    required_artifacts, so this is ordinary implementation maintenance,
    not a protocol amendment): `nonexceptional_targets` now partitions
    against `pred_exc` (the independently predicted set) instead of
    `observed_hull_set`. Verified by actually re-running the patched
    script end to end in a scratch directory (not overwriting the
    committed run) -- reproduces nonexceptional_full_box_fraction=1.0 at
    all 8 cells, matching this correction's hand-derived table exactly --
    and by an executed mutation test against the FIXED formula (a genuine
    injected falsifying instance at t=50, p=101, outside {0,76}, forced
    non-saturated): the fixed formula correctly returns 0.98989898989899
    (< 1.0), matching VAL-20260907-b16812's own independently-computed
    mutation-test figure exactly, confirming the fix is genuinely
    non-tautological, not merely coincidentally unchanged. Any FUTURE run
    of run_experiment.py will compute this metric correctly; the four
    already-archived runs (RUN-SEMAEV-002-{a,b,c,d}) are unaffected and
    remain exactly as committed, correctly interpreted per this
    correction's derivation above rather than reprocessed.

    (2) CLARIFICATION, NOT A CONTENT CHANGE: `code.dirty` in this run
    package's manifests uses a NON-CANONICAL, STRICTER methodology (raw
    `git status --porcelain`, including untracked files) than this
    program's canonical definition, per `harness/runner.py:git_state()`:
    "'dirty' means tracked source differs from HEAD... untracked files...
    are intentionally ignored." Under the CANONICAL definition,
    EXP-SEMAEV-002's runs are NOT dirty: `harness/semaev.py` and
    `harness/toycurve.py` are confirmed byte-identical to the pinned
    commit (53aac6d88) at current HEAD, and every execution-relevant
    implementation file is independently sha256-pinned and verified to
    match in both the original archival commit and both independent
    reviews. specification.yaml's invalidation_rules item is read, by this
    correction, as referring to the CANONICAL tracked-file definition of
    "dirty" (consistent with how every other run manifest in this
    repository, including this experiment's companion EXP-HZM-001 archived
    in the identical commit, records this field), not the broader
    untracked-inclusive reading these four manifests happened to compute
    it with. Under that reading, invalidation_rules' dirty-code clause
    does NOT invalidate RUN-SEMAEV-002-{a,b,c,d}.

