correction:
  id: CORR-20260916-5166fe
  recorded_at: '2026-09-16'
  recorded_by: coordinator
  goal_id: GOAL-ICPERF-e6b6a4
  batch_id: BATCH-a33cda
  produced_by: top-level coordinator session, cursor/semaev-2015-audit-program-5b8b
  archived_by: TASK-20260915-7da7f1
  corrects:
    - >-
      commit 3dc30bfcf (concurrent session): edited the immutable epoch-1 manifest of RUN-ICPERF-a4a24b
      and miscited the provenance of three command lines. Restored and superseded, not reverted from
      history.
    - >-
      commit dbbb2e7ab (this session): asserted in command.txt and manifest_v2.yaml that epoch 1's
      commands were UNRECOVERABLE. Superseded; the claim understated what committed bytes determine.
  nature: >-
    TWO SESSIONS INDEPENDENTLY REPAIRED THE SAME SIX SCHEMA ERRORS AGAINST RUN-ICPERF-a4a24b WITHIN AN
    HOUR, AND BOTH GOT THE SAME FACT WRONG IN OPPOSITE DIRECTIONS. Neither session knew the other was
    working; both pushed to the same branch; the merge surfaced it.

    The shared question was where epoch 1's commands are recorded. `tools/validate_ledger.py` requires
    `run.code.command` and a `command.txt`, epoch 1's manifest carries no `commands` block, and
    logs/PROGRESS.md records no invocation strings.

    - The concurrent session wrote the three command lines
      `python3 accept/{probe_check,sumreg,watchdog_null}.py` and cited them as "those recorded in
      logs/PROGRESS.md (epoch 1)". THE COMMAND LINES ARE RIGHT AND THE CITATION IS FALSE: PROGRESS.md
      contains no such string, as `grep -c` over it returns zero.
    - This session checked PROGRESS.md, found nothing, checked the JSON outputs, recovered two child
      argv, and recorded the three wrapper commands as UNRECOVERABLE — declining to write a command line
      it could not source, on core rule 9 grounds. THAT REFUSAL WAS RIGHT IN PRINCIPLE AND WRONG ON THE
      FACTS: it searched the logs and never looked in `accept/`.

    The fact both missed: accept/probe_check.py, accept/sumreg.py and accept/watchdog_null.py are
    COMMITTED, are DECLARED in epoch 1's own `artifacts` list, are named to match one-for-one the
    `invocation` label each writes into its own JSON output, and read NEITHER argv NOR the environment —
    no argparse, no sys.argv, no os.environ, no getenv. A script that consults nothing outside itself
    admits exactly one invocation. `python3 accept/<name>.py` from the run directory is therefore
    DETERMINED BY COMMITTED BYTES, which is a stronger provenance than a prose record of the same string
    would have been, and neither "recorded in PROGRESS.md" nor "unrecoverable" describes it.
  the_serious_defect: >-
    COMMIT 3dc30bfcf EDITED experiments/EXP-ICPERF-e21835/runs/RUN-ICPERF-a4a24b/manifest.yaml, ADDING
    `code.commit` AND `code.command` TO A COMMITTED, IMMUTABLE RUN RECORD. That file was archived at
    ecdd3bffd with sha256 8a4f1c0c30c374d490be6fd67727f83a66d8361ffafaa301d2d1175303677107, and that
    hash is a binding field of the completed archive TASK-20260915-7da7f1 as well as being pinned in
    tools/run_supersession_registry.yaml and referenced by manifest-epoch2.yaml's `supersedes`. The edit
    moved the file to 23327c0ffcc088f0ebbc9d2912bcd1bd9b614ac1e767f79be36760b85b0f328d, which breaks the
    archive's content verification: the commit is immutable, so its declared hash and the live tree could
    never agree again while the edit stood.

    The intent was legitimate — the schema fields really are required, and the added values were
    accurate. The mechanism was not: run records are append-only, and a schema field that an immutable
    record lacks is supplied by a NEW record that supersedes it, which is exactly what the registry's
    `additive_schema_completion` and `terminal_run_result` kinds exist for.
  resolution:
    manifest_restored: >-
      manifest.yaml was restored to its archived bytes with `git checkout ecdd3bffd --`, and its sha256 is
      again 8a4f1c0c30c374d490be6fd67727f83a66d8361ffafaa301d2d1175303677107. THIS IS NOT AN EDIT THAT
      PICKS A SIDE: the archive declares what those bytes are, so restoring them returns the record to the
      only state consistent with a completed archive. Leaving the modification in place would have left a
      permanently unverifiable archive and, separately, a false citation inside an immutable record.
    history_not_rewritten: >-
      Commit 3dc30bfcf stays in history exactly as pushed. Nothing is reverted, amended or force-pushed;
      the working tree is corrected forward and this record explains why, which is the same discipline
      every other correction in this ledger follows.
    schema_fields_supplied_additively: >-
      `code.commit` and `code.command` for the run as a whole live in manifest_v2.yaml, a new record
      registered in tools/run_supersession_registry.yaml as `terminal_run_result` over the epoch-1
      manifest, with epoch 2's executor-authored manifest pinned alongside as `intermediate_record`. All
      three records stay in the tree and stay hash-pinned.
    companions_reconciled: >-
      The four companion artifacts kept this session's versions, which are generated by the committed
      accept/compose_companions.py and reproduce byte-for-byte on an unchanged tree, rather than the
      concurrent session's hand-written stubs. TWO OBSERVATIONS FROM THE CONCURRENT VERSION WERE FOLDED
      IN AND IMPROVED ON, because both were true and this session's first version omitted them: the three
      epoch-1 command lines (now recorded with their real warrant instead of a false citation), and the
      explicit statement that no top-level stdout/stderr stream was ever captured, which stdout.log and
      stderr.log now carry so they cannot be mistaken for captured streams.
    the_check_is_now_the_warrant: >-
      compose_companions.py re-verifies the argument-free property of each driver every time it runs and
      DOWNGRADES ITS OWN CLAIM to "not determined, and recording a command line here would be a
      fabrication" if a driver ever gains an argument or an environment read. The claim that the command
      is determined therefore cannot outlive the property that makes it true. A comment asserting it once
      would have rotted silently the first time a driver took a flag.
  what_this_says_about_the_concurrency_model: >-
    Both sessions were following the rules as written. The repository's concurrency discipline addresses
    identifier collisions, goal-head contention and queue contention, and it worked — no identifier
    collided. What it does not cover is TWO SESSIONS REPAIRING THE SAME DEFECT IN A SHARED ARTIFACT, which
    is what happened here: a fatal validation error is visible to every session at once and reads as
    unclaimed work to each of them. `tools/goal_lanes.py` can only claim a task that exists in a queue,
    and this repair was nobody's queued task.

    Recorded as an observation rather than a proposal. The cheap mitigation is a bus message before
    touching a shared artifact outside one's own batch, which costs one write and would have prevented the
    duplicated work and the immutability violation both. Whether that becomes a rule is not this
    correction's to decide.
  what_this_correction_does_not_assert:
    - >-
      NOT that the concurrent session's command lines were fabricated. They are correct, and the drivers
      they name determine them. The defect is the citation and the immutable edit, not the content.
    - >-
      NOT that this session's caution was misplaced. Declining to write a command line it could not source
      was right; failing to look in `accept/` before declaring it unrecoverable was the error.
    - >-
      NOT a change to any measurement, verdict, deviation or anomaly of either epoch. Every number in the
      run is exactly where it was, and both epoch manifests are byte-identical to their committed state.
    - >-
      NOT an acceptance verdict on the instrument. That remains the independent review round's to compose
      under REVIEW-ICPERF-20260915-a33cda and its addendum.
  verification:
    - >-
      `sha256sum manifest.yaml` = 8a4f1c0c30c374d490be6fd67727f83a66d8361ffafaa301d2d1175303677107, equal
      to `git show ecdd3bffd:...manifest.yaml | sha256sum`.
    - >-
      `tools/check_run_immutability.py`: OK, no committed run artifacts modified or deleted.
    - >-
      `tools/validate_ledger.py`: the six RUN-ICPERF-a4a24b errors are cleared with none added; the
      remaining new errors are pre-existing on main (PRECOMP specifications, legacy review_plan handoffs,
      AES manifests) and belong to other campaigns.
    - >-
      `accept/compose_companions.py` run twice on the unchanged tree produces identical hashes for all
      four companions.
  citations:
    - claim: The three epoch-1 drivers are committed, declared, and read neither argv nor the environment.
      source: >-
        experiments/EXP-ICPERF-e21835/runs/RUN-ICPERF-a4a24b/accept/{probe_check,sumreg,watchdog_null}.py
        and manifest.yaml `artifacts`
      provenance: internal
      verified_by: >-
        coordinator, this session, by reading each script and by the programmatic check in
        accept/compose_companions.py, which re-runs on every generation.
    - claim: logs/PROGRESS.md records no invocation string for any epoch-1 phase.
      source: experiments/EXP-ICPERF-e21835/runs/RUN-ICPERF-a4a24b/logs/PROGRESS.md
      provenance: internal
      verified_by: coordinator, this session, by grep over the file; the match count is zero.
    - claim: The epoch-1 manifest's archived hash and the hash the concurrent commit moved it to.
      source: git objects ecdd3bffd and 3dc30bfcf
      provenance: internal
      verified_by: coordinator, this session, by sha256sum on both versions.
