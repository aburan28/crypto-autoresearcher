correction:
  id: CORR-20260906-72f696
  recorded_at: '2026-09-06'
  record_type: process
  corrected_record: ledger/decisions/DEC-20260905-01a1b4.yaml
  field: whole-file YAML parseability
  goal_id: GOAL-ECRANK-002
  corrected_by_lane: GOAL-SSI-001
  raised_by: >-
    GitHub Actions check `kb` on PR #791 (run 34015454783, job 101438304730),
    head 402b6d274, at 2026-09-06T06:04Z. The failing assertion is
    kb/tests/unit/test_repo_corpus.py:516, which pins the DISCLOSED DEBT set of
    unparseable sources by membership. DEC-20260905-01a1b4 appeared as an EXTRA
    item in that set.
  prior_value: >-
    ledger/decisions/DEC-20260905-01a1b4.yaml, sha256
    0639800b360305bcf03ffef3c00b3c9d2ff9296e40de1a90ec1c9e253ef4e1cf, does not
    parse as YAML and has never parsed in any committed revision. It entered the
    repository unparseable at cc71793dc.
  corrected_value: >-
    A complete, content-preserving schema-supersession replacement at
    ledger/corrections/schema-supersessions/20260906/ledger__decisions__DEC-20260905-01a1b4.v2.yaml,
    registered in tools/schema_supersession_registry.yaml (records 100 -> 101)
    with BOTH SIDES HASH-PINNED. The immutable original is untouched, exactly as
    AGENTS.md requires: corrections supersede, never overwrite.
  what_went_wrong: >-
    TWO INDEPENDENT YAML SYNTAX DEFECTS, both inside plain multi-line sequence
    items, and neither is visible to a reader skimming the record because both
    are ordinary English punctuation. (1) Line 15 contains "PR #769": the
    space-hash opens a COMMENT, which terminates the plain scalar and orphans
    line 16, giving "expected <block end>, but found '<scalar>'". (2) Line 18
    contains "failed-empty delivery: the subagent": the colon-space is read as a
    MAPPING VALUE inside a sequence item, giving "mapping values are not allowed
    here". The second defect was invisible until the first was repaired, which is
    why this correction records both rather than the one the parser named first.
  the_repair_and_what_it_deliberately_does_not_do: >-
    The replacement converts the seven multi-line plain sequence items to folded
    block scalars (`>-`) and changes NOTHING ELSE. Folding semantics are
    identical between a plain multi-line scalar and `>-` (newline becomes space),
    so every character of the author's text is preserved in place, "PR #769"
    included. This was not asserted from inspection: each parsed item was
    compared mechanically against the archived lines joined on single spaces, and
    all three context items and all four decision items matched exactly. NO
    RESEARCH CONTENT WAS INTERPRETED, SUMMARISED, REWORDED OR JUDGED. The
    replacement asserts nothing about GOAL-ECRANK-002, its witness, its rank
    claim or its construction, and changes no status.
  why_this_lane_repaired_another_campaigns_record: >-
    STATED PLAINLY BECAUSE IT IS A BOUNDARY CROSSING. GOAL-SSI-001 does not own
    GOAL-ECRANK-002 and did not write the archived record. CLAUDE.md's ordinary
    routing for breakage already on `main` is the hourly main-health sweep, which
    files an issue against the OWNING campaign, and "what is no longer every
    campaign's problem is breakage that was already on main". That routing was
    not sufficient here for one specific reason: kb/tests/unit/test_repo_corpus.py
    stages the WHOLE corpus, so this defect fails the `kb` check on EVERY branch,
    not only on the owning campaign's. It is byte-identical on origin/main and on
    this branch. The repair is mechanical, content-preserving, and uses the
    repository's own sanctioned mechanism; it no-ops the moment the owning
    campaign lands an equivalent fix.
  why_the_debt_set_was_not_simply_widened: >-
    Adding this path to `expected_unparseable` would have turned the check green
    in one line and is FORBIDDEN. CLAUDE.md: disclosed debt "is closed and never
    grown, so any addition there is a regression", and a pin "you moved to match
    what you just measured has stopped being a check". The debt set is unchanged
    by this correction and still holds its original 24 legacy members.
  verification:
    - >-
      Reproduced the failure locally before repairing: python3 -c
      "yaml.safe_load(open(...))" on the archived path raises ParserError at
      line 13 column 3 / line 16 column 5, identically on HEAD and on
      origin/main, and the two revisions are byte-identical.
    - >-
      After the repair, CI's exact command -- PYTHONPATH=kb/src python3 -m pytest
      kb/tests/unit/test_repo_corpus.py -q -- reports 15 passed (previously 1
      failed, 14 passed).
    - >-
      CAUSATION CHECKED, NOT ASSUMED. With the replacement file present but its
      registry entry reverted, the same test FAILS again; restoring the entry
      makes it pass. The operative change is the hash-pinned registration, not
      the presence of the file.
  scope_and_limits: >-
    This correction is about PARSEABILITY ONLY. It is not evidence, in either
    direction, about any mathematical or cryptanalytic claim, and an
    infrastructure defect is never negative mathematical evidence. It does not
    review, endorse or dispute the cancellation decision the archived record
    states. It lifts no citation prohibition.
  what_this_correction_leaves_open_and_who_owns_it: >-
    MEASURED, NOT ASSUMED. tools/validate_ledger.py reports the SAME FOUR errors
    before and after this correction; this change adds none and removes none. It
    converts one of them from "invalid YAML: while parsing a block collection" to
    "expected top-level key 'coordinator_decision'" -- that is, from unreadable to
    readable-but-legacy-schema. The remaining defect is that the record uses flat
    top-level keys instead of the current `coordinator_decision` envelope, and it
    is NOT REPAIRED HERE. Two sibling records of the same campaign
    (DEC-20260905-36847f, DEC-20260905-e140ee) and one handoff
    (TASK-20260905-2c383f) carry the identical defect, all four pre-existing on
    origin/main, so the correct repair is campaign-wide and belongs to
    GOAL-ECRANK-002, which owns the records and their content. A partial
    envelope-rewrite by this lane would risk colliding with that campaign's own
    fix and would require interpreting research content this lane has no standing
    to interpret. What justified crossing the boundary at all was that the PARSE
    defect fails the whole-corpus kb check on every branch; the schema defect does
    not, and so the justification does not extend to it.
  citations:
    - ledger/decisions/DEC-20260905-01a1b4.yaml
    - ledger/corrections/schema-supersessions/20260906/ledger__decisions__DEC-20260905-01a1b4.v2.yaml
    - tools/schema_supersession_registry.yaml
    - kb/tests/unit/test_repo_corpus.py
