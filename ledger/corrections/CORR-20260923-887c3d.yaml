correction:
  id: CORR-20260923-887c3d
  recorded_at: '2026-09-23'
  record_type: run
  record_id: RUN-GFPN-b71f2f
  experiment_id: EXP-GFPN-726eb2
  goal_id: GOAL-GFPN-380702
  task_id: TASK-20260923-e52c88
  decision_id: DEC-20260923-a118fa

  field: >-
    experiments/EXP-GFPN-726eb2/runs/RUN-GFPN-b71f2f/raw-result.json
    steps.cm_discriminant.conductor_squared. The same value is restated in
    experiments/EXP-GFPN-726eb2/implementation.md line 128 ("conductor 1 for
    EcMasFp5, 2 for EcGFp5") and line 197 ("(conductor 2)").

  prior_value: 'conductor_squared "4" (conductor 2)'
  corrected_value: >-
    conductor_squared "1" (conductor 1). The EcGFp5 CM discriminant
    D = t^2 - 4q is itself fundamental: D = D_K, |D| = 2^2 * 3 * 41 * p313,
    322 bits. |D| and the fundamental discriminant as committed (both 322
    bits) are unchanged.

  reason: >-
    Three sources agree.
    (1) Validator TASK-20260923-2d8db0, joint J2. The validator recomputed t
    and D from the certified order and verified the factorization of |D|,
    with p313 re-proved prime. The squarefree part is s = 3 * 41 * p313, and
    d = -s = 3 (mod 4). So D_K = 4d = D and the conductor is 1. The committed
    raw-result is internally inconsistent: D != conductor_squared *
    fundamental_discriminant. Artifact:
    coordination/goals/GOAL-GFPN-380702/reviews/TASK-20260923-2d8db0/scratch/inv1/result.json,
    B_EcGFp5.cm.
    (2) Dispatcher verification, 2026-09-23, recorded in the
    TASK-20260923-35aa39 ledger receipt. An independent PARI recomputation
    from the certified order gives D equal to the committed D, coredisc(D) == D
    and isfundamental(D) = 1.
    (3) Coordinator derivation (experiments/EXP-GFPN-726eb2/analysis.md
    section 1.4). With #E = 2n, n odd and q = 1 (mod 4), t = 0 (mod 4), so
    D/4 = (t/2)^2 - q = 3 (mod 4). D/4 is therefore not a discriminant, and
    the conductor must be odd. "Conductor 2" is impossible for this curve.
    CAUSE: gfpn_audit.py line 440 sets conductor_squared = abs(D) // sf. That
    equals f^2 only when -sf = 1 (mod 4).
    The error does not affect the SafeCurves discriminant criterion, which
    reads |D_K|, and |D_K| was committed correctly.

  effect_on_dependent_records: >-
    - ledger/handoffs/TASK-20260923-cc166b.yaml joint J2 states "conductor (2
      for EcGFp5, 1 for EcMasFp5)" as the producer's value under review. That
      plan is immutable and is read through this correction.
    - EcMasFp5's committed conductor_squared "1" (RUN-GFPN-3bbef2) is correct
      and is not affected.
    - The defect is in the instrument (line 440). Any reuse of gfpn_audit.py
      must fix it; it is listed in the instrument-repair next action of
      DEC-20260923-a118fa.

  evidence_artifacts:
    - experiments/EXP-GFPN-726eb2/runs/RUN-GFPN-b71f2f/raw-result.json
    - experiments/EXP-GFPN-726eb2/implementation.md
    - experiments/EXP-GFPN-726eb2/implementation/gfpn_audit.py
    - coordination/goals/GOAL-GFPN-380702/reviews/TASK-20260923-2d8db0/review-report.yaml
    - coordination/goals/GOAL-GFPN-380702/reviews/TASK-20260923-2d8db0/scratch/inv1/result.json
    - experiments/EXP-GFPN-726eb2/analysis.md

  scope_note: >-
