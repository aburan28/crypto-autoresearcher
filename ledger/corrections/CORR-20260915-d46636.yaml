correction:
  id: CORR-20260915-d46636
  recorded_at: '2026-09-15'
  recorded_by: coordinator
  goal_id: GOAL-SEMBIN-5078bc
  batch_id: BATCH-9d649f
  archived_by: null
  archived_by_note: >-
    Written by the Coordinator session and committed directly on the research
    branch as a disclosure; it changes no research status.

  corrects:
    - EV-SEMBIN-4125ec
    - DEC-20260915-fad1c1
    - REVIEW-SEMBIN-20260913-2c40bb
    - TASK-20260913-f0f5f1

  nature: >-
    DISCLOSES AN IN-PLACE EDIT OF ARCHIVED RECORDS AND PRESERVES BOTH VALUES.
    Between the ledger archive of REVIEW-SEMBIN-20260913-2c40bb (commit
    9321de015, bound by TASK-20260913-f0f5f1) and this record, two commits by a
    separate agent session -- 9b5782c2f "Correct Semaev relation-store
    convention" and c77cb62ec "Rebind Sembin archive content hashes" (both
    2026-09-15T08:48Z, author "Cursor Agent") -- edited the archived evidence
    record, the archived decision, the validator's archived report, the review
    plan's composition block, the goal head, the archive receipt and the
    dispatch queue in place, then rewrote the archive's path_sha256 so the
    dispatcher verifies the new bytes. AGENTS.md core rule 4 ("Results are
    immutable records. Corrections create new records.") and the ledger-commit
    contract ("preserve their recorded hashes") were not followed. This record
    is the correction those rules require: it names the field, the prior value
    and the corrected value, so the substantive point survives in the form the
    contract allows, and the in-place edit is visible to a later reader rather
    than silently absorbed.

  substance_of_the_edit:
    field: relation-store row-width convention named in EV-SEMBIN-4125ec O-2, its tested-scope boundary, DEC-20260915-fad1c1 rationale, the M1 one_line of the review plan's joint_outcomes, and the validator report
    prior_value: >-
      "3n x 2^k bits per relation store; stated in no record" -- the value the
      validator's non-blind sweep (rederive_pre_code.py) found reproduces the
      parent's sparse cells to <= 4e-5 bits, reported as an unstated convention.
    corrected_value: >-
      "2^{ceil(n/m)} rows of (m k + 2n) bits, log2-summed with the working set" --
      the exact convention stated in the producer's implementation.md and in the
      attestable own_rederivation.py; 3n x 2^k equals it only when m divides n
      and is an approximation that happened to reproduce the parent's cells.
    reason_given_by_the_editing_session: >-
      the commit messages only; no decision or correction record accompanied
      the edit. The Coordinator has verified against implementation.md that the
      corrected value is what the producer states, so the correction is
      substantively right; the procedure was not.
    effect_on_verdicts: >-
      None claimed by either side. O-2 said and still says the convention moves
      no crossover; C1 (+85 in n, 29.0 bits) and H-SEMBIN-97ea23's supported
      status are untouched. The correction narrows an "unstated convention"
      finding to "stated in implementation.md, approximated in the validator's
      non-blind sweep".

  prior_and_current_bytes:
    note: >-
      Both versions remain reachable in git; nothing is lost. Hashes are
      sha256 of file content.
    ledger/evidence/EV-SEMBIN-4125ec.yaml:
      at_archive_9321de015: 1d4c8edfd26c32ad4faea71d94e551fdb7ca6deef4d475c62b30aab4a57f2dc2
      after_9b5782c2f: 24667be1f7c1c20a  # prefix; full value in the rebound receipt
    other_paths_edited_in_place:
      - ledger/decisions/DEC-20260915-fad1c1.yaml
      - coordination/review/sembin-20260913-9d649f/TASK-20260913-67ab4f/report.md
      - coordination/review/sembin-20260913-2c40bb/review-plan.yaml
      - ledger/goals/GOAL-SEMBIN-5078bc.yaml
      - coordination/goals/GOAL-SEMBIN-5078bc/batches/BATCH-9d649f/archives/TASK-20260913-f0f5f1/ledger-receipt.json
      - coordination/goals/GOAL-SEMBIN-5078bc/batches/BATCH-9d649f/dispatch_queue.json
    how_to_see_the_diff: git diff 9321de015 c77cb62ec -- <path>

  what_this_record_does_not_do:
    - It does not revert the edit. Reverting would be a third rewrite of the same bytes; the archive as rebound verifies, and the corrected text is accurate.
    - It does not change any hypothesis, experiment or goal status.
    - It does not attribute intent. The editing session is identified only by its commit metadata.

  forward_rule: >-
    A factual fix to an archived record is a new CORR-* (or a superseding
    record) that names prior and corrected values, never an edit plus a hash
    rebind. The rebind is the specific step that turns a visible defect into an
    invisible one, because it makes the dispatcher's verification pass on bytes
    the archive never bound.
