correction:
  id: CORR-20260802-004
  recorded_at: '2026-08-02'
  record_type: claim
  id_renumber_note: >-
    ORIGINALLY WRITTEN AS CORR-20260802-001 AND RENUMBERED TO -004 ON THE SAME
    DAY, before this branch merged origin/main. CORR-20260802-001 was free on
    every local and remote ref when this record was allocated; main then landed
    an unrelated record (MERGE-REMAP-ROOT-LEDGER-PR87) under that id, producing
    an add/add merge conflict. Per the convention this program already applies -
    renumber OUR record and never the other party's - the id moved to the next
    free value, 002 and 003 being taken on origin/claude/pr-87-review-u3l49u and
    origin/integration/merge-all-prs. NO CONTENT OF THIS RECORD OR OF MAIN'S
    CORR-20260802-001 IS ALTERED BY THE RENUMBER. Commit 8dad7520 and the header
    notes it wrote into KN-LIT-7670 and KN-LIT-7674 cite the old id; those
    citations are corrected in the same commit as this renumber. This is the
    add/add collision failure mode CORR-20260724-001 records and GATHER-20260729
    warns about, occurring for the third time in this session's work.
  record_type_note: >-
    The template enumeration for record_type is candidate | claim | run. claim is
    the closest permitted token, as in CORR-20260724-001 and CORR-20260801-003.
    The corrected artifacts are a knowledge entry and a batch's producer
    artifacts.

  corrected_record: knowledge/literature/KN-LIT-7670.md
  also_corrects:
    - knowledge/gathers/GATHER-20260801B.md
    - coordination/goals/GOAL-HAWK-001/batches/BATCH-001/tasks/TASK-20260802-004/heuristics_transcription.md
    - coordination/goals/GOAL-HAWK-001/batches/BATCH-001/tasks/TASK-20260802-004/disclosed_attack_transcription.md
    - coordination/goals/GOAL-HAWK-001/batches/BATCH-001/BATCH-001-OPENING.md
    - ledger/goals/GOAL-HAWK-001.yaml
  goal_id: GOAL-HAWK-001
  batch_id: BATCH-001
  raised_by: >-
    TASK-20260802-007 (Red Team) objection O1, and TASK-20260802-006 (Validator)
    qualifications Q5 and the SRC-1 directional-gap note. Both were dispatched as
    independent review tasks of BATCH-001 and both returned defects the producer
    had not found.

  summary: >-
    A self-inflicted extraction artifact was recorded as a property of a source
    and propagated into six artifacts across two sessions. This program's own
    fetch script capped ABSTRACT DISPLAY at 1600 characters; the ePrint abstract
    for iacr:2026/1318 is 2031 characters and complete. The cut-off display was
    written down as "the abstract as served is TRUNCATED mid-sentence", and the
    omitted text contains the authors' withdrawal of the paper's polynomial-time
    claim. Four further overclaims found by the same reviews are corrected here.

  defect_1_the_truncation_that_was_not:
    claimed: >-
      KN-LIT-7670 (added 2026-08-01, GATHER-20260801B) states the 30/06 update is
      "truncated mid-sentence in the retrieved record" and that the entry
      "deliberately leaves it incomplete rather than guess at" its content.
      GOAL-HAWK-001's BATCH-001 artifacts repeat this as a source defect.
    measured_facts:
      method: >-
        curl of https://eprint.iacr.org/2026/1318 on 2026-08-02, regex extraction
        of the abstract block, length measured. Independently confirmed by the Red
        Team via the ePrint OAI-PMH endpoint (verb=GetRecord).
      page_bytes: 18133
      abstract_chars: 2031
      oai_datestamp: '2026-07-05'
      source_unchanged_since_before_the_entry: true
      real_cause: >-
        tools used ad hoc in the scratchpad printed o.get('abstract','')[:1600].
        The 1600-character DISPLAY cap cut the update mid-sentence. The stored
        value was capped at 2500 and so was never truncated at all. THE DEFECT
        WAS IN THE READING, NOT IN THE SOURCE.
    omitted_text_verbatim: >-
      "Update (30/06): Following discussions with Daniel Apon and Markku-Juhani
      Saarinen, we acknowledge that Heuristic 4 is insufficient to conclude that
      the main algorithm runs in polynomial time, and in fact the main algorithm
      appears to run in super-polynomial time. This mistake originates from the
      count of ideals of norm $q'$ in $\mathcal{O}_F$: one must include fractional
      ideals in this count, of which there are many. We note as an aside that
      Heuristics 1-3 have been independently experimentally verified. We would
      also like to thank the HAWK team and Alice Pellet-Mary for their responses
      to our work."
    why_it_matters: >-
      The omitted text is decision-critical in BOTH directions. (a) The authors
      WITHDRAW the polynomial-time claim - "the main algorithm appears to run in
      super-polynomial time" - so there is no live claim of a polynomial-time HAWK
      break from this paper, and GOAL-HAWK-001's objective, which is framed around
      "the reported classical polynomial-time smLIP key-recovery attack", is void
      as applied to it. (b) HEURISTICS 1-3 HAVE BEEN INDEPENDENTLY EXPERIMENTALLY
      VERIFIED, which KN-LIT-7670 misses entirely and which cuts the OTHER way -
      three of the four heuristics are in BETTER standing than that entry implies.
    repair: >-
      KN-LIT-7674 written with the complete update transcribed verbatim;
      KN-LIT-7670 marked superseded_by with a header note, body unedited.
    not_repaired_here: >-
      GATHER-20260801B and the BATCH-001 producer artifacts repeat the false
      truncation claim. They are committed records and are NOT edited. This
      record is their correction. KN-OPEN-027 was written against the incomplete
      record and its question 1 is now partly answered; a superseding revision of
      it is owed and is NOT attempted here.

  defect_2_program_voice_stronger_than_sources:
    raised_by: Red Team O2
    claimed: >-
      BATCH-001 artifacts and KN-LIT-7673 say Straznickas-Weis "DISCHARGES" van
      Gent-Pulles's Heuristic 1, and that the GP25 result "now also exists
      unconditionally".
    objection_upheld: >-
      The authors' own phrase is "upgrades the endgame from the heuristic pricing
      of [GP25, Thm. 1] to the unconditional accounting of Theorem 6.1". They
      AVOID GP25's heuristic on one specific lattice rather than proving it. The
      program-voice verbs are stronger than the source and were not marked as
      inference.
    also_upheld: >-
      The Pareto axis was never checked. GP25 gives blocksize beta = n/4+1 under
      heuristic BKZ; Straznickas-Weis gives ORACLE DIMENSION n/2+1. These are not
      the same unit and were never placed in a common one before being combined
      into "a stronger position for the attack side than either paper states
      alone".
    corrected_statement: >-
      Straznickas-Weis replaces GP25's heuristically-priced BKZ step with a
      provable block reduction on a lattice it proves exactly near-hypercubic,
      for the specific lattice arising in its own construction. Whether that
      constitutes a strictly stronger attack position REQUIRES a common cost unit
      that this program has not computed, and no such comparison is asserted.

  defect_3_no_heuristics_headline_overbroad:
    raised_by: Validator Q5
    claimed: >-
      disclosed_attack_transcription.md headlines "this attack has no heuristics".
    objection_upheld: >-
      Broader than the capitalized-token census supports. The REDUCTION is
      unconditional - confirmed independently by the Validator, Heuristic x0 and
      Conjecture x0 across three extractions with negative and positive controls -
      but at least three components of the paper are explicitly heuristic: the
      gate-count totals, the end-to-end demonstration ("The released code is the
      heuristic implementation of section 6.2, not the provable reduction of
      section 5"), and the non-power-of-two conductor scope claim.
    corrected_statement: >-
      THE REDUCTION of Straznickas-Weis is unconditional and deterministic and
      contains no numbered heuristic. THE PAPER contains heuristic components -
      its cost estimates, its implementation, and its scope claim - and any
      statement of the form "this attack has no heuristics" must say REDUCTION.

  defect_4_omitted_countervailing_sentence:
    raised_by: Validator directional-gap note
    objection_upheld: >-
      Neither BATCH-001 artifact records van Gent-Pulles's own sentence "Although
      this work does not affect the security of HAWK, it opens up a new attack
      avenue". heuristics_transcription.md instead asserts flatly that the
      unnumbered section 5 argument is "the load-bearing claim of the paper for
      cryptanalytic purposes". Omitting an author's own de-escalation while
      elevating their most alarming passage is a selection defect, and it runs in
      the direction this program is most obliged to guard against.
    corrected_statement: >-
      van Gent-Pulles state that their work does not affect HAWK's security and
      opens an attack avenue. KN-LIT-7673's characterization of section 5 as
      load-bearing is THIS PROGRAM'S reading, not the authors' framing.

  defect_5_minor_factual_errors:
    raised_by: Red Team O5
    items:
      - claimed: >-
          "KN-LIT-7592 was filed 2026-07-28, FOUR DAYS before this goal asked for
          it."
        corrected: >-
          ONE day. GOAL-HAWK-001 was created 2026-07-29; KN-LIT-7592's added field
          is 2026-07-28. The interval was computed against today's date rather
          than the goal's creation date.
      - claimed: >-
          The goal's next_action asks for "the four heuristics OF the disclosed
          attack", which is impossible because that attack is unconditional.
        corrected: >-
          OVERREAD, and the correction is upheld only in part. The next_action
          reads "obtain the primary sources (the disclosed attack, eprint
          2026/890, eprint 2026/1318, van Gent-Pulles 2025) and file them as
          KN-LIT entries with the four heuristics transcribed verbatim" - the
          modifier attaches to the FOUR SOURCES COLLECTIVELY, and on that reading
          the instruction is satisfiable, since 2026/1318 does have four
          heuristics. THE GOAL RECORD IS NOT DEFECTIVE IN THE WAY BATCH-001
          CLAIMED. What IS defective is RQ-HAWK-001.motivation, which welds
          2026/1318's nrdPIP route to Straznickas-Weis's automorphism and
          rank-halving into one narrative and never names Straznickas-Weis; the
          batch missed that and attacked the wrong record.

  defect_6_producer_finding_committed_before_review:
    raised_by: Validator, closing note
    measured: >-
      ledger/goals/GOAL-HAWK-001.yaml asserts TASK-20260802-004's census result
      and was committed in 57950abf (the OPENING snapshot) at 05:13:52, BEFORE the
      producer snapshot 3a39803c at 05:14:06 and before any review ran.
    objection_upheld: >-
      A producer finding belongs in the post-review LEDGER commit, not in the
      opening snapshot. The fourteen-second gap shows these were batched writes
      committed in a misleading order rather than a genuine pre-registration, and
      the ordering makes the goal record appear to have anticipated a result it
      had not yet reviewed.
    not_repaired_here: >-
      The commits stand. Rewriting them would rewrite pushed history, which
      AGENTS.md forbids. The correction is this record plus the discipline that
      TASK-20260802-008's ledger archive must carry the reviewed findings.

  defect_7_extraction_hash_not_reproducible:
    raised_by: Validator
    measured: >-
      The SRC-4 pdfminer.six extraction sha256 recorded in source_access_log.yaml
      does NOT reproduce: five runs produced three distinct hashes, all of length
      78015, first divergence at char 18729 (an orphan token migrating within a
      display). pdfminer.six is nondeterministic on that PDF. SRC-1's extraction
      hash DID reproduce exactly.
    consequence: >-
      The PDF hash is byte-exact and the character count is stable, so the receipt
      holds and no finding is affected. But a recorded hash that does not
      reproduce is a broken verification affordance and must be labelled
      run-specific rather than presented as a check a reviewer can repeat.

  what_is_and_is_not_wrong:
    the_censuses_hold: >-
      Independently re-measured by the Validator from byte-identical re-acquired
      PDFs: SRC-4 Heuristic 0, Conjecture 0, Assumption 1, Theorem 28, Lemma 60,
      Proposition 19, unconditional 4 - all seven exact. SRC-1 exactly one
      numbered Heuristic 1. BATCH-001's central factual claims about the two
      obtained papers SURVIVE review.
    the_receipts_hold: >-
      Commit 3a39803c is an ancestor of HEAD, has the recorded parent, changes
      exactly the six declared paths, and all six path_sha256 values reproduce.
    the_provenance_holds: >-
      KN-LIT-7592's web-to-read upgrade was 21 insertions and 1 deletion, the
      single deleted line being citation_verified: web. No claim was edited.
    no_research_claim_is_affected: >-
      No evidence record, decision, hypothesis or experiment consumed any of these
      artifacts. No hypothesis exists for GOAL-HAWK-001.
    no_hawk_assessment_is_made_or_retracted: >-
      Neither the defective nor the corrected records assess HAWK's security in
      either direction.

  corrected_statement: >-
    The ePrint abstract for iacr:2026/1318 was never truncated. Its 30/06 update
    states that the main algorithm appears to run in SUPER-POLYNOMIAL time, names
    the fractional-ideal miscount as the cause, and reports that Heuristics 1-3
    have been INDEPENDENTLY EXPERIMENTALLY VERIFIED. KN-LIT-7674 supersedes
    KN-LIT-7670. Straznickas-Weis's REDUCTION is unconditional; its cost
    estimates, implementation and scope claim are not. van Gent-Pulles state their
    work does not affect HAWK's security. GOAL-HAWK-001's next_action was not
    defective in the way BATCH-001 claimed; RQ-HAWK-001.motivation is the record
    that conflates the two attacks.

  scope_of_this_correction:
    changes_no_hypothesis_status: true
    is_not_a_cryptanalytic_result: true
    does_not_correct:
      - The two regex censuses, which independent re-measurement confirmed exactly.
      - The BATCH-001 snapshot receipts, which verified.
      - KN-LIT-7673's citation, which the Validator confirmed verbatim.

  open_items:
    - id: OI-1
      item: >-
        KN-OPEN-027 was written against the incomplete 2026/1318 record. Its
        question 1 ("do the heuristics hold?") is now partly answered - 1-3
        verified independently, 4 failed and its failure is why the algorithm is
        super-polynomial. A superseding revision is owed.
    - id: OI-2
      item: >-
        GOAL-HAWK-001's objective is framed around a "polynomial-time" attack.
        For 2026/1318 that framing is void by the authors' own statement, and the
        disclosed attack is exponential-but-halved rather than polynomial. The
        goal needs re-scoping by a Coordinator decision.
    - id: OI-3
      item: >-
        Red Team O4: pause condition 2's non-firing rests on "retry available"
        with no retry-by date, owner, or queued task, which makes it
        unfalsifiable. Route A6 was declared but never attempted for SRC-2; the
        Red Team attempted it (Imperial Spiral DSpace, totalElements 0). Cheapest
        untried route is a contact-author request; proxying the gated PDF is
        explicitly NOT recommended.
    - id: OI-4
      item: >-
        Red Team O3: BATCH-001's synthesis is filed inside KN-LIT relay records
        while dispatch_queue.json pre-instructs the decision to record "no
        internal result". knowledge/SEEDING.md holds that a literature entry never
        becomes a finding. Whether the synthesis warrants its own record class is
        a Coordinator decision.

  recorded_by: orchestrator
  authority_note: >-
    Written from the branch claude/algebraic-number-theory-kb-zpmu0c by the
    session that produced the defective artifacts, after two independent review
    tasks it dispatched returned the defects. It creates no decision record,
    changes no status, edits no immutable record body, and makes no queue
    amendment. Model independence is PROCEDURAL only - producer, validator and
    red team all resolve to claude-opus-5 - and nothing here is admissible toward
    the AGENTS.md rule 13 closure quorum.
