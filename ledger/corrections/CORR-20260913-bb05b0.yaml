  context: >-
    REVIEW-SEMBIN-20260913-9d649f was composed from the reviewer artifacts as they stood
    in snapshot 1c207023f. That snapshot captured the red team's report MID-WRITE. The
    completed report -- committed in e5ed53a12, same four verdicts, same author, same
    session, strictly additive -- contains a section the snapshot does not, and that
    section runs a control the composition described as un-run and as out of reach.

  correction_1:
    subject: >-
      THE PRIME-FIELD NEARBY-OBJECT CONTROL HAS BEEN BUILT AND RUN, AND IT FAILS AT THE
      RECORD'S OWN CHARGING POINT.
    what_the_committed_records_say: >-
      DEC-20260913-74e208 rationale records that the parent run asserted no prime-field
      index-calculus cost model exists in this repository, that the red team LOCATED such
      models (EXP-ICEX-c32447, EXP-ICEX-349205, DEC-20260804-14b457, KN-OPEN-001), and
      that "ARM N of EXP-SEMBIN-2c40bb instantiates it" -- i.e. as future work.
      EV-SEMBIN-71e5cd O-15 and O-16 record the substitution and its false premise. The
      Coordinator's preregistered prior in EXP-SEMBIN-2c40bb went further and predicted
      that "instantiating it will be harder than the red team's location of it suggests,
      and that the honest outcome may be a documented impediment rather than a passing
      control."
    what_is_now_true: >-
      IT WAS ALREADY INSTANTIATED, FROM A BETTER SOURCE THAN THE ONE THE COMPOSITION
      NAMED. Not EXP-ICEX-c32447 (a draft specification with no runs) but
      experiments/EXP-PFDR-c04716/runs/STATIC-001/concrete-cost.yaml -- a COMMITTED
      54-cell prime-field index-calculus concrete-cost table over log2 N in
      {64, 128, 256}, charging time AND memory, and charging its Pollard-rho prior in
      exactly COST-SEMBIN-8d123b's own 0.886 x 2^{n/2} convention. That convention
      agreement was verified cell by cell to 1e-3 at all three sizes before any figure
      was imported (recomputations.json, J6 baseline_convention_agrees_with_sembin).
      Charged against the baseline THE WAY THE RECORD CHARGES IT, prime-field index
      calculus BEATS Pollard rho at all three sizes: margins +8.49, +6.84, +4.77 bits at
      64, 128, 256. This corpus records that ordering as false twice over (KN-OPEN-001
      "Does index calculus beat Pollard rho for prime-field ECDLP? -- No"; KN-TECH-003
      "uncompetitive with rho"). The inversion appears at store_log2 >= 21.51 / 23.16 /
      25.23 and THE RECORD CHARGES 30. Under a baseline charged coherently on its own
      time-memory curve the inversion does not appear at any size (margin -20.51 at 64
      bits).
    why_it_matters: >-
      This is the strongest single result in the round, and it is stronger than the
      argument the composition was built on. J2 established the 29.0-bit baseline
      overcharge BY ARGUMENT -- product invariance along vOW's curve, a dominated
      operating point. J6's control establishes the same defect by RUNNING THE RECORD'S
      OWN CONVENTION AGAINST AN OBJECT WHOSE ANSWER THIS CORPUS ALREADY RECORDS AS FALSE.
      An argument that a charge is wrong and a known-false object that the charge
      inverts are different kinds of evidence, and the second is the one the review
      architecture calls a proves-too-much control. J2 and J6 are therefore ONE defect
      reached from two directions, which is how the completed report states it.
    the_coordinator_prior_is_refuted: >-
      This makes FOUR refuted Coordinator priors in this batch, not three. The prior
      recorded in EXP-SEMBIN-2c40bb -- that instantiating the control would be hard and
      might end in an impediment -- was already false when it was written: the control had
      been built and run before that contract was frozen, in a report the Coordinator had
      read a mid-write copy of. The Coordinator's calibration in this batch is poor and
      the tally is recorded rather than smoothed.

  correction_2:
    subject: THE INVALIDATION RULE THIS CONTROL FIRES IS TOO BLUNT AS WRITTEN.
    what_the_committed_contract_says: >-
      EXP-SEMBIN-2c40bb control C6 and its stopping rules state that if the machinery
      "reports index calculus beating rho for prime-field ECDLP at cryptographic size,
      the machinery mischarges memory or parallelism and EVERY row of this experiment AND
      of RUN-SEMBIN-121b59 is void." H-SEMBIN-97ea23's falsification conditions carry the
      same "whole hypothesis is VOID" wording.
    additive_amendment: >-
      THE CONTROL IS NOW KNOWN TO FAIL AT ONE CHARGING POINT AND PASS AT ANOTHER, WHICH
      THE RULE AS WRITTEN CANNOT EXPRESS. Read literally it voids RUN-SEMBIN-121b59
      outright, and that would be the wrong conclusion: a control that fails at
      store_log2 = 30 and passes under a coherent baseline does not say the machinery is
      unusable, it LOCALISES the defect to exactly the parameter H-SEMBIN-97ea23 claims is
      miscoded. That is the control working, not the experiment collapsing. The amendment,
      which ADDS to the frozen protocol and rewrites nothing in it:

      C6 is evaluated PER CHARGING MODE, not once. Its outcomes are (i) PASSES UNDER
      EVERY MODE -- the machinery is sound and the control is uninformative about which
      mode is right; (ii) FAILS UNDER EVERY MODE -- the machinery mischarges memory or
      parallelism independently of the operating point, and the original void applies in
      full to this experiment and to RUN-SEMBIN-121b59; (iii) FAILS UNDER SOME MODES AND
      PASSES UNDER OTHERS -- the machinery is sound and THE FAILING MODES ARE REFUTED AS
      CHARGING CONVENTIONS, with every crossover computed under a failing mode marked
      convention-refuted rather than merely undeclared. Outcome (iii) is what is now
      observed, and it is a STRONGER result for H-SEMBIN-97ea23's C1 than the surface it
      was commissioned to compute: the record's charging convention is not merely
      undeclared, it is refuted by an object whose answer the corpus already fixes.
    what_the_amendment_does_not_relax: >-
      Nothing. Outcome (ii) keeps the original void verbatim. C6 remains a hard control
      run before the expensive grid. The reproduction gate ARM R is untouched and still
      stops the run on failure. No prediction is loosened, no tolerance widened, and the
      contract's own falsification criterion for C2 -- which can retire the experiment's
      reason for existing -- stands exactly as frozen. What the amendment adds is the
      ability to record the outcome that actually occurred; a protocol that can only say
      "void" cannot report a localised defect, and reporting one as a void would be less
      accurate, not more rigorous.
    arm_n_is_now_partly_discharged: >-
      ARM N of EXP-SEMBIN-2c40bb must still be run, but its job has changed and shrunk.
      It no longer has to find or build a prime-field model: it instantiates
      EXP-PFDR-c04716/runs/STATIC-001/concrete-cost.yaml, REPRODUCES the red team's
      convention check and its six-row store sweep as a comparison against its own
      source, and extends the sweep across the remaining charging modes and kappa to
      settle which modes are convention-refuted. It must NOT claim its agreement with
      recomputations.json as independent corroboration -- that limit was already in the
      frozen contract and now binds this arm specifically.

  correction_3:
    subject: PD-4 OF DEC-20260913-74e208 IS SUPERSEDED. THE RED TEAM ATTESTATION EXISTS.
    what_the_committed_record_says: >-
      PD-4 records that the red team directory carries no attestation.yaml, that
      tools/check_review_independence.py therefore cannot verify its declared reads
      mechanically, and that the Coordinator would not author one on a reviewer's behalf
      because that would be recording an attestation it did not obtain.
    what_is_now_true: >-
      coordination/review/sembin-20260913-9d649f/red-team-cf9d98/attestation.yaml is
      present, authored by the reviewer itself, and lists its reads including the five
      KN-TECH records and the committed prime-field cost table. The independence check is
      now mechanically verifiable for this round. THE COORDINATOR'S REFUSAL TO
      RETRO-FIT ONE WAS CORRECT AND IS WHY THIS RESOLVES CLEANLY: had the Coordinator
      written a stand-in, there would now be two attestations for one reviewer and no way
      to tell which was the reviewer's own.
    consequence_for_citation_6: >-
      DEC-20260913-74e208 citations[6] names TASK-20260913-cf9d98 as the agent that read
      KN-TECH-006, 035, 036, 001 and 018, with the Coordinator relaying them. That
      attribution is now CONFIRMED by the attestation's own sources_read list rather than
      inferred from the report's prose. The gap it discloses is unchanged and still
      matters: no agent in this program has opened the primary van Oorschot-Wiener 1999
      paper, so HEUR-VOW-CURVE still rests on corpus records, and retrieving the source
      stays ranked work.

  correction_4:
    subject: >-
      THE VALIDATOR TASK RAN TWICE AND THE TWO REPORTS ARE NOT INTERCHANGEABLE, THOUGH
      THEY CONCUR ON EVERY VERDICT.
    what_happened: >-
      Two sessions executed TASK-20260913-da3982 concurrently in one worktree against one
      declared write_scope with no lane claim, so neither could see the other. The session
      that lost the declared-path slot self-documented the collision in
      validator-da3982/COLLISION-NOTICE.md, declined to overwrite anything of its peer's,
      declined to write an attestation on its peer's behalf, and declined to adjudicate
      ownership. All three refusals are what AGENTS.md requires. It also corrected itself
      on a spurious objection: a YAML parse error it nearly reported was a torn read of a
      file its peer was still writing.
    the_evidentiary_position: >-
      REASSURING AND THEREFORE EASY TO OVER-READ. The two sessions agree that J1 holds,
      that J4 holds, and that all four proves-too-much objects returned the answer
      refuting their known-false statements -- 4/4 concurrence, from different scripts,
      different memory accountings and different object-4 patch points, with no contact
      between them. That is worth more than one session's word for it. IT IS NOT A SECOND
      INDEPENDENT REVIEW AND MUST NEVER BE COUNTED AS ONE: same task, same role, same
      handoff, same frozen inputs, no declared blindness between them. It is one review
      executed twice.
    why_both_are_kept: >-
      They differ in content even where they agree in verdict. The 21-of-27 measurement
      bracketing that EV-SEMBIN-71e5cd O-4 and DEC-20260913-74e208 both cite appears ONLY
      in the committed report; and the other session's report carries a material finding
      of its own -- an undisclosed square-matrix assumption worth 8.9 to 12.5 bits -- that
      the committed one does not. Discarding either would lose a cited figure or an
      uncited finding. So the declared paths hold exactly the snapshot's content, keeping
      every citation in the composition resolvable, and both sets sit beside them under
      explicit .session-a.* and .session-b.* names. Neither attestation is edited or
      merged, because merging two would record an attestation nobody made.
    the_procedural_defect: >-
      Round-wide, not a one-off: TASK-20260913-ec11c4 was also dispatched twice and there
      the two instances reached DIFFERENT VERDICT WORDS on the same facts (`breaks` versus
      `incomplete`), which DEC-20260913-74e208 PD-3 adjudicates. A
      tools/goal_lanes.py claim before each subagent launch would have made the second
      session visible to the first as `running`. max_concurrent bounds how many tasks run
      at once; it does not stop one task from being dispatched twice. THIS IS AN
      EVIDENCE-INTEGRITY AND COORDINATION FINDING AND NOT A MATHEMATICAL RESULT IN EITHER
      DIRECTION.

  what_does_not_change:
    - >-
      EVERY VERDICT IN THE COMPOSITION. J1 holds, J4 holds, J5 holds, J2 breaks, J3
      breaks, J6 breaks, J6-BLIND incomplete. The completed red-team report carries the
      same four verdicts as the snapshot copy; the two validator sessions carry the same
      two as each other.
    - >-
      EVERY FIGURE QUOTED IN DEC-20260913-74e208, EV-SEMBIN-71e5cd AND EV-SEMBIN-1d36a3.
      All were checked against the completed artifacts and none moved: 29.0 bits of
      product excess, +85 in n, 460 / 520, -17.48 at n = 409, 180 and 183 against 132 and
      72, the 2^65 to 2^89 band, alpha = 0.811, +159 against -87, 21 of 27, k - log2(t),
      27.68 to 44.00 bits, max log2 A = -1.0, 4.8e-5 bits, 18.2535 bits.
    - >-
      THE SCOPED CLOSURE OF KN-OPEN-94f456 AND THE PROMOTION OF KN-FIND-9643e7. Nothing
      here touches CLAIM B, whose reviewer was the validator and whose verdict both
      sessions share.
    - >-
      THE RANKING. EXP-SEMBIN-354a75 stays ranked above EXP-SEMBIN-2c40bb: it can invert
      a closure, and correction_1 makes the surface's direction MORE settled, not less,
      which lowers rather than raises that experiment's urgency.
    - >-
      NO DEGREE IS MEASURED OR ASSERTED ANYWHERE, and Assumption 1 remains unvalidated
      with its degree-5 sensitivity (+19.4 bits at n = 409) still larger than every effect
      discussed in this correction. IMP-SEMBIN-ENGINE stands.

  limitations:
    - >-
      NOTHING HERE IS A STATEMENT ABOUT THE SECURITY OF ANY CURVE, IN EITHER DIRECTION.
      A known-false object inverting under a charging convention is a finding about the
      CONVENTION. No curve was instantiated, no relation computed, no solve performed, and
      no certificate attaches to any number in this record.
    - >-
      The prime-field control's own source is a committed STATIC cost table, not a run
      that solved anything. It inherits whatever assumptions EXP-PFDR-c04716 recorded, and
      this correction does not audit them. What makes it usable as a control is narrower
      than correctness: its Pollard-rho prior is in the same convention as
      COST-SEMBIN-8d123b's, verified cell by cell, and the corpus already fixes the
      answer it is being asked to reproduce.
    - >-
      The control was run by ONE reviewer, in ONE implementation, and this correction is
      composed by the Coordinator from that reviewer's report and machine-readable output.
      The Coordinator did not re-execute it. ARM N of EXP-SEMBIN-2c40bb is the
      reproduction, and its agreement will be a comparison against its own source rather
      than independent corroboration.
    - >-
      This correction ADDS an evaluation rule to a frozen contract. Under the standing
      instruction that a frozen scientific protocol is changed only by additive amendment,
      that is the permitted form, and outcome (ii) preserves the original void verbatim.
      A reviewer who thinks the amendment weakens C6 should read the three outcomes: the
      only one it adds is the one that localises a defect instead of discarding a working
      instrument.
