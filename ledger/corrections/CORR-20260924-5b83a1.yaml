        reached through `import a1_health as H` (a1_driver.py line 38) and
        `H.run(p, ...)` in cmd_controls_a1 (a1_driver.py line 129), i.e. by
        `controls-a1 --p 1073741831`, package order 1 of
        trial-plan-v2-a1-r2.json (RUN-GFPN-599b87, the addendum's blocking
        package; plan lines 681-698). SE-2 as written does not reach it, and
        SE-3's DV-11 requirement cannot be met by the SE-3 replacement alone.
        Whether any further site exists is established only by the census
        TASK-20260924-1039eb (DEC-20260924-bea197 R-4).
      evidence: >-
        Read directly by the Coordinator under TASK-20260924-69587a:
        implementation-v2-a1/a1_health.py lines 140-220 (run_system) and
        223-253 (run), and implementation-v2-a1/a1_driver.py lines 38 and
