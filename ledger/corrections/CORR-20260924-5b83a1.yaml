# BOUND, NOT ANY FILE: the msolve launch paths of the EXP-GFPN-05ff43 repair
# lineage.
#   (1) solverevent SE-3 (as incorporated by the approved seedresolve draft)
#       presumes that replacing v2_driver.solve reaches every CLASSIFIED msolve
#       launch of both successor plans. It does not:
#       implementation-v2-a1/a1_health.py run_system launches msolve (line 147)
#       and classifies its output with the frozen classifier (line 182)
#       outside solve(), and controls-a1 reaches it (a1_driver.py line 129).
#   (2) the characterization's S_ub derivation counts 2 classified solves for
#       the controls_a1 package; the frozen code can make up to 6.
#   (3) PR-3 (iii), as the premise check computed it and DEC-20260924-15a77a
#       applied it, is correct for solve() call sites; it is recorded here
#       that it does not establish that solve() is the only classified msolve
#       launch site.
# Found by the successor stage r2 (TASK-20260923-de3a7d, DV-11;
# implementation-v2-r2.md section 12) and confirmed by the Coordinator reading
# the frozen code. WRITE-ONCE. Written by the Coordinator under
