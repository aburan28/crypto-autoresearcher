        classification in the repaired lineage depends on the wall-clock
        second at which msolve's FGLM seeded rand(). The health check's
        classification feeds controls_a1 check (d), whose pass gates every
        other addendum package. Left outside the rule, that gate would keep
        the exposure the rule exists to remove.
