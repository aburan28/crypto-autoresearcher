correction:
  id: CORR-20260929-d6ddce
  id_provenance: >-
    Pre-minted and --check verified by the top-level session on 2026-09-29.
    This Coordinator minted nothing.
  recorded_at: '2026-09-29'
  record_type: claim
  record_id: EV-SEMBIN-c71cad
  also_applies_to:
    - record_id: DEC-20260929-d75c82
      fields: >-
        rationale item 4, qualification (b) ("With the field equations as
        generators, the fall at D = 2 returns and nothing separates"), and
        rationale item 5, the KN-OPEN-7f0511 (A) paragraph ("it vanishes in
        the {f} union S_fe form that is relevant to Weil descent").
  ordered_by: DEC-20260929-0d6685 NA-5 (definitional_finding)
  kind: >-
    DEFINITIONAL SCOPE NOTE. The prior statements are correct for the
    observable they were computed on and are not withdrawn. What is corrected
    is their unqualified wording, which reads as a statement about "the first
    fall degree with field equations" in general.
  field: >-
    EV-SEMBIN-c71cad observations, item (b), and its inference paragraph
    ("the separation disappears once the field equations are generators";
    "vanishes in the field-equation form relevant to Weil descent").
  prior_value: >-
    Unqualified: at (6,3), the identity presentation I = [1,2,4,8,16] and the
    witness M = [1,2,4,8,26] stop separating once the field equations
    u_j^2 + u_j are generators, because h4*h4 + sum_j (u_j^2 + u_j) = h4 is a
    fall at D = 2, so D_ff(M) = 2.
  corrected_value: >-
    The no-separation statement holds for Nagao 2013/549 Definition 1 with
    S_fe as generators, and ONLY for that observable. Under the differencing
    observable of research/FFD_SEMAEV_MEASUREMENT1.md section 0
    (new_falls(D) = dim(V_D cap R_{<D}) - dim V_{D-1}), with the XOR
    Boolean-ring product, the witness STILL SEPARATES at this instance,
    d_ff(I) = 2 and d_ff(M) = 3, under both named conventions:
    "reduced" (field equations reduced modulo in every product, rows filtered
    by reduced degree) and "formal" (rows filtered by deg m + deg f), and the
    formal convention is, for new_falls/d_ff and squarefree generators, the
    Macaulay filtration of {f} union S_fe in the unreduced ring F_2[u]
    (VAL-20260929-sembin473340 check 5). So the separation does NOT vanish
    merely because the field equations are generators. What removes it is
    the choice of Definition 1, which counts a degree fall even when the
    fallen element is already in V_{D-1}.
    Mechanism, at this instance: the Definition 1 fall element at D = 2 is
    sum_{j in supp h4} u_j * h4 = h4 in B (h4*h4 + sum_j (u_j^2 + u_j) = h4 in
    F_2[u]). h4 = u0 + u2 + w0 + w2 is the unique degree-<=1 element of the
    generator span and is itself a generator of M, so h4 is already in V_1.
    Under differencing it is not a NEW fall: formal lowdim(2) = dim V_1 = 1,
    so new_falls(2) = 0, and the first new fall of M is at D = 3.
  reason: >-
    DEC-20260929-0d6685 definitional_finding recorded this as a scope note
    from the pre-launch gate and ordered this correction once
    prelaunch_test.log was archived. It was archived in the snapshot commit
    cfeb0b6d04 (VAL-20260929-sembin473340 check 1). Since then the validator
    has established the formal convention's identity with the F_2[u]
    {f} union S_fe filtration for this observable, which removes the one
    remaining way to read the prior wording as correct for the differencing
    observable ("perhaps formal is not really the field-equation form").
    The same effect appears at scale in RUN-SEMBIN-3a4248: two Semaev draws at
    (5,3) (s = 4 and s = 8, x_R = 8) each carry a degree-1 generator, and under
    the XOR product their degree-2 combination lands on that generator, which
    is already in V_1, so no new fall occurs at D = 2 (EV-SEMBIN-07960c O-7).
    That is corroboration of the mechanism on other systems, not a second
    instance of this witness.
  evidence_artifacts:
    - path: experiments/EXP-SEMBIN-473340/runs/RUN-SEMBIN-3a4248/prelaunch_test.log
      role: >-
        Gate output, lines 6, 7, 10, 11, 12 and 13: identity reduced 2; witness
        reduced 3; the Definition 1 D = 2 element sum_j u_j*h4 == h4 exists;
        it is not new (formal lowdim(2) == dim V(1) == 1); witness formal 3;
        identity formal 2. Archived in snapshot commit cfeb0b6d04.
    - path: experiments/EXP-SEMBIN-473340/src/test_boolean_macaulay.py
      role: >-
        The assertions behind those lines (section 4). Pinned by sha256
        87f38ff89d8e1c00457ff09347ca9c6718c991e56d2b752101fce699dd3b74fc.
    - path: experiments/EXP-SEMBIN-473340/validation/validator-20260929/fixture_check.json
      role: >-
        Corroboration by the validator's independent kernel (vbr.py): identity
        2 reduced and 2 formal; witness 3 reduced and 3 formal; witness formal
        falls(2) = dim V_1 = 1; x_R = 15, 5 independent generators. Committed
        with the ledger archive of this record if not already committed at
        3b88ad54b8 (session to confirm).
    - path: experiments/EXP-SEMBIN-473340/validation/validator-20260929/polyring_formal_check.json
      role: >-
        Formal convention equals the F_2[u] {f} union S_fe filtration for
        new_falls/d_ff: 296/296 random and 39/39 experiment systems (with the
        argument in the validation report, check 5).
    - path: experiments/EXP-SEMBIN-e76704/validation-report-20260929.yaml
      role: the source of the prior_value (VAL-20260929-sembine76704 DA-7)
  limits:
    - >-
      SINGLE INSTANCE. One system: Semaev (n, n') = (6,3), basis [1,2,4],
      x_R = 15 (a_real_xR(6, 1, 1, random.Random(603))), reduced to 5
      independent generators; one witness M. This instance is UNSATISFIABLE
      over F_2 (EV-SEMBIN-c71cad observation (d)). Nothing is claimed about
      other instances, other witnesses, satisfiable systems or other cells.
    - >-
      NON-BLIND. The producer's gate was written by the same session that
      wrote the instrument. The validator's fixture_check.json reproduces the
      fixture values with an independent kernel, but that check was not blind
      to the expected values: the validator had read DEC-20260929-0d6685,
      which states them, before its seal. The formal-equals-F_2[u]
      identification is independent (argument plus computation), and it is
      the part this correction leans on hardest.
    - >-
      NOT NAGAO'S OBSERVABLE. The differencing d_ff is not Nagao 2013/549
      Definition 1 and not literal 2015/984 Definition 5 or 6. This correction
      does not say the witness separates under any of Nagao's definitions.
      Under Definition 1 with S_fe, EV-SEMBIN-c71cad (b) stands: no
      separation.
  consequence_for_KN-OPEN-7f0511_A: >-
    NONE IN EITHER DIRECTION. (A) concerns Nagao's D_ff^max for Weil-descent
    systems, a Definition 1-type quantity, and for that observable the prior
    statement stands. What changes is that DEC-20260929-d75c82's (A) paragraph
    may no longer be quoted as "the separation vanishes with field equations"
    without naming Definition 1. KN-OPEN-7f0511 is not edited; any note on it
    goes through /curate-knowledge as a new record.
  related_limit_discharged: >-
    DEC-20260929-0d6685 definitional_finding.limits said "The formal
    convention's equality with the F_2[u] Macaulay filtration of
    {f} union S_fe is not established." It is now established for
    new_falls/d_ff with squarefree generators (VAL-20260929-sembin473340
    check 5), and not for dim V_D. That decision is not edited.
  supersedes_nothing_in_place: >-
