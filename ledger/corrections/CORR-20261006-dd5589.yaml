      state_at_merge: All nine CI checks pending (the pull_request run 37403208023 was queued and had not started).
    - rule: DEC-20261005-072d80 merge condition
      text: >-
        The full pass of tests/test_experiment_execution.py is required on a
        host that supports RLIMIT_AS (Linux CI on the PR) before merge, and a
        CI failure in those tests blocks the merge.
      state_at_merge: Not satisfied. Linux CI had not run the tests.
    - rule: Handoff instruction to the snapshot session
      text: '"Do not enable auto-merge, do not merge."'
      state_at_merge: Overridden by the dispatching session.

