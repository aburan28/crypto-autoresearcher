  nature: >-
    DISCLOSES A MERGE MADE WHILE CI WAS PENDING. At 2026-10-06T02:16:08Z the
    dispatching session ran `gh pr merge 1875 --auto --merge`, intending to
    ENABLE auto-merge. main has no branch protection and no required status
    checks, so GitHub merged the PR at once, with the merge-commit method,
    while all nine CI checks were pending. The Coordinator session that
    archived the snapshot had been told "Do not enable auto-merge, do not
    merge", and its report repeated that. The dispatching session overrode
    that instruction. The violation was caused by the dispatching session,
    not by the Coordinator session that wrote the PR.

  rules_violated:
    - rule: CLAUDE.md "Auto-merge a PR once its CI passes"
      text: >-
        "Never merge a red, pending, or conflicted head, and never skip or
