  disposition:
    merge_not_undone: >-
      The merge is NOT reverted. The post-hoc Linux run meets the substance
      of DEC-20261005-072d80's condition: on a host that supports RLIMIT_AS,
      tests/test_experiment_execution.py passes in full (rc 0), and the
      macOS failures were host_limitation as that decision classified them.
      Reverting would remove tooling that passes its own tests, with no
      defect to cure.
    violation_not_cured: >-
      That outcome does NOT cure the procedural violation. Under AGENTS.md
      ("A precondition is not waived by the work turning out fine"), the
      condition was a precondition of the merge. The merge happened before
      it was met, and a later passing run does not change the order of
      events. The violation stands as recorded here.
    ci_crash_is_separate: >-
      The check_merge_hygiene.py crash is a separate tooling defect. It is
      not attributable to PR #1875: _run() decodes `git show <base>:<path>`
      output as UTF-8 text, and the failing input was a base-side path with
      non-UTF-8 bytes. Locally, `python3 tools/check_merge_hygiene.py --base
      origin/main` at the snapshot passed (receipt of TASK-20261005-d59b5a,
      10 candidate paths), and the dispatching session reports a local PASS
      with `--base 6e637362e1` at f2f48e270e (11 candidate paths). CI saw 3
      candidate paths because it checked out the PR merge ref after the PR
      had already merged. The crash means CI said nothing either way about
      this PR's tests.

  what_this_does_and_does_not_change:
