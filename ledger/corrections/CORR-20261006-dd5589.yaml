  remedies_recorded:
    - >-
      Never run `gh pr merge` in any form, including `--auto`, on a PR whose
      checks are pending while main has no required status checks. On this
      repository `--auto` merges at once.
    - >-
      The repository settings named in CLAUDE.md (merge commits only) do not
      include required status checks for main. Until they do, auto-merge
      gives no protection, and "merge once CI passes" must be enforced by
      the merging session reading `gh pr checks` first.

