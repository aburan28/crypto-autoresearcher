correction:
  id: CORR-20260913-a3ffdb
  recorded_at: '2026-09-13'
  recorded_by: coordinator
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-e5c603
  archived_by: TASK-20260913-019feb
  record_type: run
  record_id: RUN-ECDLP-1bef8f-S0
  field: run.result.validity_status
  prior_value: valid
  corrected_value: invalid
  classification: invalid_stage0_fixture_and_instrument_receipt
  correction_scope: Stage_0_validity_claim_only
  amendment_path: >-
    experiments/EXP-ECDLP-1bef8f/amendments/CORR-20260913-a3ffdb-stage0.yaml
  superseding_run_id: RUN-ECDLP-7ff4d9

  reason: >-
    Required control J3 did not check its stated identity. It computed
    (n/c_H^m)c_H^m=n, a tautology, instead of comparing H^(2m) with
    n/c_H^m. The frozen cell also does not satisfy the premise B^m=n:
    at m=2, B=138 and n=9851, so B^2/n=19044/9851=1.9332. Required
    control J6 is also non-discriminating: KF-1 does not enforce either
    premise, KF-2 accepts incomplete grids and crashes when (1,1) is
    removed, KF-3 takes no payload and returns a static rejection, and
    certificate/no-gamma gates are literal True. The original
    completed_valid/valid receipt is therefore inadmissible.

  exact_corrections:
    j3:
      producer_check: (n/c_H^m)c_H^m=n
      producer_check_class: tautology
      required_check: H^(2m)=n/c_H^m
      frozen_cell:
        H: 10
        p: 10007
        B: 138
        n: 9851
        c_H: 127/100
        pinning_ratio:
          exact: 10000/10007
          decimal: '0.99930'
        density_ratio:
          exact: 19044/9851
          decimal: '1.9332'
        density_premise_exact: false
        m2_identity_ratio:
          exact: 16129/9851
          equals_one: false
        m3_identity_ratio:
          exact: 2048383/9851
          equals_one: false
        finite_n_over_c_H_m_sequence: strictly_decreasing
        finite_sequence_reason: c_H=127/100 is greater than 1
    j6:
      KF-1: >-
        Tautological restoration of n and literal exponent bookkeeping; no
        enforcement of B=c_H*H^2 or B^m=n.
      KF-2: >-
        Iterates only supplied keys, accepts deletion of (0,0), and raises
        KeyError on deletion of (1,1).
      KF-3: >-
        Zero-argument function with a static rejection; it validates no claim
        payload or witness.
      tail_gates: >-
        certificate_kind_none_pass and no_gamma_reported_pass are literal True,
        not scans of the assembled result and artifact payload.

  preserved_observations:
    eligibility: observation_only_not_evidence
    rule: >-
      The following observations remain readable from the immutable artifacts
      but none may be promoted to evidence while the run is invalid.
    items:
      - J1 relation-condition two-directional recomputation holds.
      - J2 box counts and base recomputation hold.
      - J4 dispersion cell and matched-null recomputation hold.
      - Blind J5 monomial-support derivation holds.
      - J7 density-observable collision limit is honoured.
      - J8 Stage 0 authorization and claim ceiling are honoured.
      - INV-1, INV-2 and INV-3 hold.

  immutability:
    prior_run_remains_at: >-
      experiments/EXP-ECDLP-1bef8f/runs/RUN-ECDLP-1bef8f-S0/
    prior_artifacts_edited: false
    prior_specification_edited: false
    prior_reports_edited: false
    correction_method: additive
    superseding_run_is_distinct: true
    superseding_run_directory: >-
      experiments/EXP-ECDLP-1bef8f/runs/RUN-ECDLP-7ff4d9/

  evidence_artifacts:
    - experiments/EXP-ECDLP-1bef8f/specification.yaml
    - experiments/EXP-ECDLP-1bef8f/runs/RUN-ECDLP-1bef8f-S0/manifest.yaml
    - experiments/EXP-ECDLP-1bef8f/runs/RUN-ECDLP-1bef8f-S0/raw-result.json
    - experiments/EXP-ECDLP-1bef8f/runs/RUN-ECDLP-1bef8f-S0/known-false-report.yaml
    - >-
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-e5c603/reviews/TASK-20260913-2868d5/validation_report.yaml
    - >-
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-e5c603/reviews/TASK-20260913-2868d5/independent-recomputation.json
    - >-
