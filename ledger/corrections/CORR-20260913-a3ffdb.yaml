    - >-
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-e5c603/reviews/TASK-20260913-1414af/red_team_report.yaml

  scientific_effect: >-
    None. This is an instrument and fixture-validity correction at two toy
    cells. It neither weakens nor supports H-ECDLP-b97b72 and says nothing
    about gamma_m, lattice feasibility, height-box advantage, cryptographic
    transfer, or ECDLP security.
