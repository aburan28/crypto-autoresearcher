  incident_summary: >-
    A THIRTEENTH out-of-band commit by the same external git identity
    ("Cursor Agent <cursoragent@cursor.com>"): commit
    `16c7432aa0328666fd88ba8370946a39942805d3` ("Fix EXP-MONO-b19c6b gate
    calibration, vacuous P6 clause, and reuse scope", authored 2026-08-31
    08:02:25Z), landing on `ideas-ecdlp-20260830` AFTER this Coordinator's
    design snapshot (`7d10489bf`, PR #639, merged) and AFTER the Executor
    had already completed both runs against that frozen text. Discovered
    during the mandatory pre-snapshot `git fetch`/merge.

  independently_verified_content_assessment: >-
    THREE DISTINCT CHANGES, EACH INDEPENDENTLY VERIFIED BY THIS
    COORDINATOR AGAINST THE ACTUAL EXECUTED RUNS' DATA, NOT MERELY
    TRUSTED FROM THE COMMIT'S OWN PROSE.

    (1) STAGE-2 GATE MULTIPLE-COMPARISON CORRECTION -- CORRECT AND
    MATERIAL FOR FUTURE CONTRACTS, EMPIRICALLY BENIGN TO THIS RUN. The
    frozen v1 text declared the Stage-2 gate as a UNION of six nominal
    tests (two Holm families x {implicitly at alpha=0.05} plus four
    Fisher-combined checks x {implicitly at alpha=0.05}) without
    correcting alpha across that union. Verified directly: at alpha=0.05
    uncorrected across 6 tests, the probability that a genuinely
    well-calibrated instrument trips at least one by chance is
    1-(0.95)^6 ~= 26.5% per seed (independently recomputed here), far
    above the 5% the `instrument_still_uncalibrated` label implicitly
    promised. The fix (alpha_gate = 0.05/6 ~= 0.00833, Bonferroni across
    the six) is the standard, correct remedy. EMPIRICAL CHECK AGAINST
    THE ALREADY-COMPLETED RUNS: the minimum Fisher-combined p-value
    observed across both runs, both families, both statistics is
    0.4302 -- and both Holm tests report 0 significant results out of
    90-98 tests (implying their own minimum Holm-adjusted p-value already
    exceeds the LOOSER alpha=0.05, hence trivially exceeds the STRICTER
    alpha_gate=0.05/6 too). Every one of the 8 relevant checks is
    therefore unaffected by which threshold is used: RUN-MONO-b19c6b-1/2
    would have passed Stage 2's gate identically under either the
    original (uncorrected) or the corrected (alpha/6) reading. This
    correction is real, useful, and CONTENT-BENIGN to the runs already
    executed.

    (2) FALSIFICATION_CRITERION(e), "VACUOUS P6 CLAUSE" -- CONFIRMED, A
    GENUINE DRAFTING DEFECT IN THIS COORDINATOR'S OWN ORIGINAL TEXT. The
    v1 text's criterion (e) named "P6's enrichment direction disagreeing
    with either prior experiment's own reading" as falsifying -- but
    EXP-MONO-670aa6's own reading (j0 >= random-ordinary) and
    EXP-MONO-c819ba's own Red Team reading (12.1% vs 20.0%, i.e.
    j0 < random-ordinary) already DISAGREE WITH EACH OTHER, so any
    possible direction P6 could show would satisfy "disagrees with at
    least one prior" -- the criterion as originally written could never
    fail to trigger and was not a real falsification test. The out-of-
    band edit's replacement (require a STATISTICALLY SIGNIFICANT
    cross-family difference, report which prior's direction it matches
    as context only) is the correct fix. This affects only the framing of
    a not-yet-observed future escalation criterion, not any already-
    reported number; content-benign to the completed runs by
    construction (P6 was not significant in either run: Fisher exact
    p=0.609 and p=1.0, confirmed directly against execution_report.yaml).

    (3) HANDOFF REUSE-SCOPE CLARIFICATION -- CONFIRMED AS A LATENT RISK
    IN THIS COORDINATOR'S OWN ORIGINAL HANDOFF TEXT, NOT EXPLOITED IN
    PRACTICE. The original handoff told the Executor it "MAY reuse the
    arithmetic core (fields.py, curve.py, conv.py, groupstate.py)" --
    but EXP-MONO-670aa6's curve.py contains `construct_prime` and
    `curve_stream`, which ARE the family-less prime/curve-a/curve-b seed
    call sites this contract exists to fix. Verified directly against the
    Executor's own execution_report.yaml and implementation/ directory:
    the Executor wrote a FRESH curve.py (not reusing EXP-MONO-670aa6's),
    reusing only fields.py/groupstate.py/conv.py verbatim, exactly as the
    corrected handoff text now explicitly requires. This latent
    imprecision in the original instructions was therefore NOT exploited
    -- confirmed, not merely assumed -- and is content-benign.

  disposition: >-
    Per this session's established practice (never revert, always
    disclose): this correction does not revert commit `16c7432aa`. The
    current on-disk specification.yaml/handoff now read the corrected
    text; this is NOT adopted as an authorized protocol amendment (the
    contract's own invalidation_rules require a versioned amendment for
    a change after any Stage-2/3 number is observed, and no such
    amendment was authored or approved by this Coordinator), but its
    content is independently verified correct and, checked directly
    against the archived run data, changes nothing about
    RUN-MONO-b19c6b-1/2's own disposition. EV-MONO-* and DEC-* for this
    experiment are composed against the run as actually executed
    (frozen text at commit `7d10489bf`), per this session's established
    practice, while NOTING this correction's content as a documented
    methodological improvement for any future contract in this style.

  reason: >-
    AGENTS.md rule 4 and this session's established practice (twelve
    prior disclosures) require this filed as a correction. This is the
    THIRTEENTH occurrence from the same unauthorized external identity
    this session, and unlike most prior incidents, ALL THREE of its
    named changes were independently verified as substantively correct
    (not merely plausible) by direct arithmetic and by checking the
    actual archived run data -- while also being empirically inconsequential
