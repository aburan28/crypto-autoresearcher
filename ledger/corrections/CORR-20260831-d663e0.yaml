    disclosure of unauthorized-but-correct content, distinct from both
    the "content-benign and unremarkable" tier (incidents 7, 9, 12) and
    the "content-correct and severely consequential" tier (incident 11).

  knowledge_note: >-
    The alpha-across-a-composite-gate issue (item 1 above) is a natural
    extension of KN-TECH-95a42b's own design-time check: that entry
    checks a single test's floor against a single threshold; this
    incident shows the SAME discipline must also be applied ACROSS a
    declared union of gate tests (Bonferroni or equivalent over the
    number of composite checks, not just within each check's own
    internal correction). A brief addendum note is appended to
    KN-TECH-95a42b.md documenting this extension, per this correction.

