  also_concerns:
    - EXP-ENDO-7494e7
    - H-ENDO-f58749
    - EV-ENDO-7628a0 (cites the corrected values)
    - experiments/EXP-ENDO-7494e7/reports/run-20261016T1942Z/report.typ (its one-shot column)
  field: >-
    raw-result.json rows[*].combined_vs_glv_on_E.oneshot_gain and, by the same
    term, rows[*].combined_vs_E_model_baseline.oneshot_gain, for the six
    population rows with a combined route (GOST 2001 test curve, mnt/mnt3/1,
    mnt/mnt3/3, mnt/mnt5/2, mnt/mnt5/3, other/Tom-384). The implied one-shot
    combined cost glv_M_eq + conversion_M_eq is the quantity under-charged.

  defect: >-
    harness/endosweep/isoglv.py prices the combined one-shot cost as
    combined.glv.glv_M_eq + combined.conversion_M_eq. The conversion
    (isomodel.conversion_cost, 48 M_eq for a degree-5 path) prices the
    forward step's output as a Jacobian point. curvesweep.sweep_curve prices
    the neighbour's chain endomorphism with the affine-input shortcut for the
    chain's first step (first=True); for example [11, 5] costs 61 = 29 + 31 + 1
    on both E and E'. In the route, the GLV input on E' is the Jacobian image
    Q = phi(P), so that shortcut is not available. curvesweep's table and main
    loop use full Jacobian additions and do not depend on the input format;
    the chain's first step is the only term affected (validation report
    TASK-20261016-35d324, joint A4).
  found_by: TASK-20261016-35d324 (independent validator), joint A4, "Material finding".

  omitted_cost_derivation:
    source: experiments/EXP-ENDO-7494e7/validation/TASK-20261016-35d324.md, section A4
    statement: >-
      Two ways exist to evaluate psi(Q); the cheaper is the minimum extra
      cost. (a) The chain on a Jacobian input: +47 M_eq for [11, 5] and
      [11, 3, 7], +29 M_eq for [7, 5] and [7, 5, 5]. (b) psi_E on the affine P,
      then one more forward step: +32 M_eq. (b) is valid because the isogeny is
      horizontal and commutes with the CM action on the crater curves the
      validator verified in joint A3. Normalising Q to affine would cost a
      field inversion, about 1.5 log2 p M_eq, which is far larger.
    minimum_omitted_M_eq:
      GOST 2001 test curve: 32      # chain [11, 3, 7]: min(47, 32)
      mnt/mnt3/1: 29                # chain [7, 5]: min(29, 32)
      mnt/mnt3/3: 29
      mnt/mnt5/2: 32                # chain [11, 5]: min(47, 32)
      mnt/mnt5/3: 32
      other/Tom-384: 29             # chain [7, 5, 5]: min(29, 32)

  items:
    - id: C1
      field: combined_vs_glv_on_E.oneshot_gain
      prior_value:
        GOST 2001 test curve: 0.03705
        mnt/mnt3/1: 0.0776
        mnt/mnt3/3: 0.0776
        mnt/mnt5/2: 0.0905
        mnt/mnt5/3: 0.0905
        other/Tom-384: 0.10359
