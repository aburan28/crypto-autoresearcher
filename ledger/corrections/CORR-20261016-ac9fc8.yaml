    - id: C3
      field: persistent columns (combined_vs_glv_on_E.persistent_gain, combined_vs_E_model_baseline.persistent_gain)
      prior_value: as recorded
      corrected_value: unchanged
      corrected_value_basis: The persistent column charges no route, so the input-format term does not enter (validator A4).

  scientific_effect: >-
    The sign condition of the frozen success criterion (combined_vs_glv_on_E
    oneshot_gain > 0 on at least one population curve with a GLV arm) holds
    on every corrected row, so the success outcome is unchanged. The GOST
    margin shrinks by about 40 %. The corrected one-shot conversion is
    3.75 % (GOST), 5.25 % (mnt3), 3.75 % (mnt5) and 2.38 % (Tom-384) of
    glv_M_eq on E, above the non-gating predicted "about 1 to 3 %" on three
    of four classes. These are modelled corrections, not measurements.
  control_rows: >-
    control+ascent (unit endomorphism (x, y) -> (beta x, y) on the j = 0
    crater) and control-/mnt/mnt5/1 (no combined route) are not named by the
    validator's finding. The ascent control's one-shot gain against E's model,
    +32.57 %, carries a margin far above any term of this size.
  remedy: >-
    Fix isoglv's one-shot pricing (price the neighbour chain's first step on a
    Jacobian input, or the psi_E-then-forward evaluation, whichever is
    cheaper) and re-run under a new frozen contract with a new run id. This
    record does not authorize editing RUN-ENDO-795989 or the frozen
    EXP-ENDO-7494e7 specification.
  non_retroactivity: >-
