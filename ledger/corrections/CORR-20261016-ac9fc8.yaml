# NOTHING IS EDITED. experiments/EXP-ENDO-7494e7/runs/RUN-ENDO-795989/ and every
# file in it (raw-result.json, rows.jsonl, manifest.yaml, logs, receipt) stay
# byte-for-byte as committed. Any citation of the run's one-shot combined figures
# from now on cites them together with this record.
# =============================================================================
correction:
  id: CORR-20261016-ac9fc8
  recorded_at: '2026-10-16'
  recorded_by: coordinator
  authorizing_decision: DEC-20261016-4f3a1a
  archived_by: TASK-20261016-5c0f78
  goal_id: GOAL-ENDO-001

