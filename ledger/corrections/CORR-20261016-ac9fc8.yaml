        mnt/mnt3/1: '<= +5.78 %'
        mnt/mnt3/3: '<= +5.78 %'
        mnt/mnt5/2: '<= +7.55 %'
        mnt/mnt5/3: '<= +7.55 %'
        other/Tom-384: '<= +9.46 %'
      corrected_value_basis: >-
        The validator's figures (TASK-20261016-35d324 A4 table, "one-shot with
        that cost charged"): 1 - (glv_M_eq on E' + conversion_M_eq + minimum
        omitted) / glv_M_eq on E, from the recorded M_eq values, for example
        GOST 1 - (2005.5 + 48 + 32) / 2132.5. "At most" because the omitted term
        is a minimum; every corrected gain stays positive.
    - id: C2
      field: combined_vs_E_model_baseline.oneshot_gain
      prior_value:
        GOST 2001 test curve: 0.32978
        mnt/mnt3/1: 0.35699
        mnt/mnt3/3: 0.35699
        mnt/mnt5/2: 0.37956
        mnt/mnt5/3: 0.37956
        other/Tom-384: 0.41195
      corrected_value:
        GOST 2001 test curve: '<= 0.3193'
        mnt/mnt3/1: '<= 0.3432'
        mnt/mnt3/3: '<= 0.3432'
        mnt/mnt5/2: '<= 0.3693'
        mnt/mnt5/3: '<= 0.3693'
        other/Tom-384: '<= 0.4061'
      corrected_value_basis: >-
        Not stated by the validator. Coordinator arithmetic with the same
