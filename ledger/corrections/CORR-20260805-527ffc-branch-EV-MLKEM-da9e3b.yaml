  type: empirical
  claim_tier: toy_scale
  states_a_finding: false
  compared_against_assumed_law: false

  what_was_measured: >-
    The per-vector dual-sieve cosine score distribution at dimension 60
    (m=35, n=25, q=127), bgj1_sieve, 17,919 vectors, ML-KEM-style secret
    (η=2 CB) and error (σ=2 rounded Gaussian). For each sieve-produced
    dual-lattice vector v=(x,y), score_i(s') = cos(2π·centre_mod(x·b−y·s',q)/q)
    was computed for 33 candidates: 1 correct secret, 16 uniform-Z_q wrong,
    8 CB-distribution wrong, 8 near-miss (s+e_i for unit e_i). A null object
    (b replaced by uniform Z_q^m) and a decay sweep (σ from 0.5 to 16) were
    also run.

  instrument:
    components:
      - passagemath-standard 10.8.7
      - fpylll 0.6.4
      - g6k 0.1.2 (bgj1_sieve)
    install_recipe: KN-TECH-14efa5
    verified_functional: true
    instrument_note: >-
      Venv pre-existing from same session; install recipe re-executed and
      reported "Requirement already satisfied". Both documented gotchas
      (BKZ.DEFAULT_STRATEGY, Siever requires UinvT) reproduced exactly per
      KN-TECH-14efa5. Three verification checks passed (passagemath version,
      fpylll BKZ-30 on dim 60, g6k gauss_sieve on dim 50).

  key_observations:
    - >-
      At the correct secret: mean score +0.42738, rank 1/33. Null object
      (uniform b): correct-secret ranks 18/33 (mid-pack, mean +0.00330) —
      pipeline does not find structure that is not there.
    - >-
      Decay sweep: correct-secret mean decays monotonically from +0.94924
      (σ=0.5) through +0.42738 (σ=2, MAIN) to +0.01827 (σ=4) and is
      indistinguishable from noise by σ=8. Inventor-protocol artifact tell
      (failure to decay) NOT triggered.
    - >-
      Near-miss candidates (s + unit e_i, i=0..7) score +0.42349 to +0.42672,
      within 0.0032 of the correct secret (+0.42738). Mechanically: the
      phase difference is a single coordinate of the short dual vector y_i,
      which is small.
    - >-
      Wrong-candidate populations are NOT exchangeable: uniform-Z_q mean ≈
      +0.004, CB-distribution wrong mean ≈ +0.291, near-miss mean ≈ +0.425.
      results.json wrong_mean_of_means = +0.18082 is a pooled artifact and
      must not be used as the MATZOV wrong-candidate baseline.
    - >-
      All 17,919 vectors verified as dual-lattice members (y ≡ Aᵀx mod q,
      0 violations). Lattice-membership certificate kind.
    - >-
      Reproduction: bit-identical scientific content on same machine
      (sha256 differs by 1 byte, wall-clock timing leaves only).

  admissibility:
    validator_verdict: accept_with_qualifications
    red_team_verdict: pass_with_constraints
    admissible_as_raw_data: true
    validator_qualifications: [DEF-1, DEF-2, DEF-3, DEF-4]
    red_team_objections: [OBJ-1, OBJ-2, OBJ-3, OBJ-4, OBJ-5, OBJ-6, OBJ-7]
    blocking_for_batch_1: none
    blocking_for_batch_2_comparison:
      - >-
        B2-1: ≥50 independent sieve runs (different seeds, same LWE instance)
        to estimate Var[T_N] and test the independence assumption. A single run
        cannot test variance structure (OBJ-1).
      - >-
        B2-2: CTRL-RT-4 — known-answer test on MATZOV.Nf callable before any
        comparison (OBJ-6). Four batches of GOAL-MLKEM-003 argued about this
        callable and none covered it.

  scope_statements:
    - >-
      Dimension 60, q=127, bgj1_sieve, σ=2, N=17,919. ONE LWE instance,
      ONE sieve run, ONE seed. NOT crypto-scale evidence (AGENTS.md rule 7).
      No extrapolation to FIPS 203 dimensions.
    - >-
      No finding is stated. No cost-model comparison was performed. The data
      is raw material for batch 2; it is not a result.
    - >-
      AGENTS.md rule 12 is UNMET and UNWAIVED (inherited from GOAL-MLKEM-003).
      Nothing here changes the status of EV-MLKEM-011/013/015/017/018/019/020/021/af61e7
      or any KN-* record.
    - No ML-KEM break, no security proof, no FIPS 203 parameter set affected.

