# =============================================================================
# CORR-20260923-111265 -- SUPERSEDES A FACTUAL PREMISE, NOT THE DECISION FILE:
# DEC-20260923-80e280 condition RC-6 states, in its last sentence, "The r1
# wrapper does not set PYTHONHASHSEED for packages (RUN-GFPN-ac4487 ran without
# it), so G1 inherits the same condition as the reference." The parenthesis is
# FALSE. The frozen v2 wrapper sets PYTHONHASHSEED="0" for the driver child, so
# RUN-GFPN-ac4487 ran with PYTHONHASHSEED=0. The v2-a1 wrapper and the v1
# wrapper do the same. Following the sentence's instruction literally gives G1
# a DIFFERENT hash-seed condition from its reference, which defeats the
# sentence's own stated purpose.
# Found and flagged by the stage-R1 Executor as deviation RD-1
# (implementation-v2-r1.md lines 406-416 and 677-678), which followed RC-6
# literally and recorded the inherited value. That was the correct behaviour.
# WRITE-ONCE. Written by the Coordinator under TASK-20260923-234811
# (DEC-20260923-582d6b ruling R-2). DEC-20260923-80e280 is not edited.
# =============================================================================
correction:
  id: CORR-20260923-111265
  recorded_at: '2026-09-23'
  recorded_by: coordinator
  goal_id: GOAL-GFPN-380702
