  field: conditions[RC-6].text, last sentence (DEC-20260923-80e280 lines 469-471)
  prior_value: >-
    "The r1 wrapper does not set PYTHONHASHSEED for packages (RUN-GFPN-ac4487
    ran without it), so G1 inherits the same condition as the reference."
  corrected_value: >-
    FACT: RUN-GFPN-ac4487 ran with PYTHONHASHSEED="0", set by the frozen v2
    wrapper for the driver child (v2_run_wrapper.py lines 177-178). The
    sentence's PURPOSE -- G1 runs under the same condition as its reference --
    is the governing intent. The operative rule that implements it for the
    repaired packages is set by AMD-EXP-GFPN-05ff43-20260923-solverevent SE-6
    (a DRAFT until approved): the successor wrapper sets PYTHONHASHSEED="0"
    for every package's driver child, exactly as the frozen v2 and v2-a1
    wrappers do, and records it. Until that addendum is approved no repaired
    package runs at all (DEC-20260923-582d6b), so no package is ever launched
    under the literal, mistaken reading.
  corrected_value_is: >-
    THE OFFICIAL READING of RC-6's last sentence for every later record: the
    successor addendum, its approval act, the successor stage card, the review
    plan and the evidence review. The first part of RC-6 (two toy runs in
    separate processes with DIFFERENT PYTHONHASHSEED values; a difference in
    any compared field stops the stage; the exclusion list may not absorb it)
    is NOT corrected. It stays binding on stage R1 as run, and the successor
    addendum carries it forward in amended form (SE-5).

  facts:
    - >-
      experiments/EXP-GFPN-05ff43/implementation-v2/v2_run_wrapper.py lines
      177-178: `child_env = dict(os.environ, GFPN_RUN_DIR=rd,
      GFPN_V2_PACKAGE=rid, GFPN_V2_REPLACES=replaces or "",
      PYTHONHASHSEED="0", PYTHONUNBUFFERED="1", PYTHONDONTWRITEBYTECODE="1")`.
      This is the environment of the driver process of every v2 package,
      RUN-GFPN-ac4487 included. The file is bound by phase A of
      TASK-20260923-0fa03f.
    - >-
      experiments/EXP-GFPN-05ff43/implementation-v2-a1/a1_run_wrapper.py line
      299 sets PYTHONHASHSEED="0" in the same way, and the v1 wrapper
      experiments/EXP-GFPN-05ff43/implementation/run_wrapper.py line 94 does
      too.
    - >-
      experiments/EXP-GFPN-05ff43/implementation-v2-r1/r1_run_wrapper.py line
      35 states that the r1 wrapper does not set PYTHONHASHSEED, and lines
      351-359 record the inherited value or "unset". This follows RC-6's
      literal instruction.
    - >-
      implementation-v2-r1.md lines 406-416 flag the discrepancy before any
      plan was treated as final, and lines 650-653 report that 30 msolve
      solves under reconstructed PYTHONHASHSEED conditions (0, 12345, unset)
