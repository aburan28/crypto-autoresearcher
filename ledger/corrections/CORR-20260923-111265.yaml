      PYTHONHASHSEED.

  reason: >-
    The Coordinator wrote RC-6 in Act 4 from a reading of v2_run_wrapper.py
    that did not reach line 178 (DEC-20260923-80e280 lines 149-174 list what
    that act read; v2_run_wrapper.py is not among the files read in full).
    The premise was asserted, not checked. A condition whose premise is false
    must not be applied literally when doing so defeats its stated purpose,
    and must not be silently reinterpreted either. This record states the
    fact, names the governing intent, and routes the operative change to the
    successor addendum, which a separate act approves on archived bytes.

  what_it_is_not:
    - >-
      NOT A CAUSE OF THE STOP. The DV-7 difference arose inside msolve on
      byte-identical input (implementation-v2-r1.md lines 637-653).
      PYTHONHASHSEED is a Python setting; msolve is a C program, and the 30
      reconstructed-environment solves did not reproduce world A.
    - >-
      NOT A DEFECT OF THE EXECUTOR. The Executor followed the approved
      condition literally, recorded the inherited value, and flagged the
      conflict for a ruling (RD-1). That is the behaviour the contract asks
      for.
    - >-
      NOT EVIDENCE about D, the quotient, H-GFPN-9a29be or HEUR-GFPN-DFLAT.

  consequences:
