correction:
  id: CORR-20260805-12e5b8
  title: >-
    Merge collision note — origin/main into claude/aes-campaign-harness-0o9p7y
    (GOAL-ECDLP-001 BATCH-028 / EXP-SMTH-4403c4 duplicate lane)
  recorded_at: '2026-08-05'
  recorded_by: coordinator
  context: >-
    PR #174 (GOAL-AES-003 BATCH-005..009) was unmergeable against main. None of
    the sixteen conflicts touched the AES campaign the PR is about. Fifteen are
    the GOAL-ECDLP-001 BATCH-028 duplicate-lane collision that
    tools/validate_ledger.py already documents in prose: two lanes computed
    "highest batch + 1" from the same committed state, both opened BATCH-028,
    and both wrote the same paths and the same record identifiers for different
    measurement packages. Main resolved its side of that collision earlier
    (see the PR #144 and PR #154 notes in .gitignore, and CORR-20260804-1e9769);
    this branch still carries the other side.
  collision_detail:
    EV-DS-84d006: >-
      Branch body binds hypothesis H-DS-001, run_ids [], type measurement,
      direction inconclusive, strength weak. Main body binds H-SMTH-001,
      run_ids [RUN-SMTH-4403c4-calib, RUN-SMTH-4403c4-real], type empirical,
      direction neutral, strength inconclusive. Same identifier, different
      evidence.
    DEC-20260802-446a54: >-
      Branch body records decision `inconclusive` over targets
      [GOAL-ECDLP-001, H-DS-001, EXP-SMTH-4403c4, EV-DS-84d006]. Main body
      records the BATCH-028 ledger archive under TASK-20260802-268ec9 with the
      validator/red-team dispositions named. Same identifier, different decision.
    coordination_artifacts: >-
      Twelve BATCH-028 producer, reviewer and archive artifacts under
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/ plus the frozen
      contract experiments/EXP-SMTH-4403c4/specification.yaml exist on both
      sides at the same paths with different bytes.
  resolution:
    - >-
      Main's bodies are live at every canonical path: it is the shared trunk,
      it already carries the run manifests EV-DS-84d006 cites, and its side of
      this collision has been through a merge review.
    - >-
      Every branch body is preserved verbatim under
      ledger/corrections/CORR-20260805-12e5b8-branch/, mirroring its original
      path. Nothing was dropped and nothing was edited.
    - >-
      .gitignore: kept both sides' additions, except the branch's
      `experiments/EXP-SMTH-4403c4/` ignore, which main deliberately removed so
      the run manifests EV-DS-84d006 cites stay trackable. Re-adding it would
      have hidden them from the validator.
    - >-
      BATCH-028 dispatch_plan.json and dispatch_plan.md are generated artifacts
      that main no longer tracks; removed from the index per the .gitignore
      migration note.
  does_not_rewrite_history: true
  limitations:
    - >-
      NO ADJUDICATION IS MADE about which BATCH-028 package is the real one, or
      about whether the branch's H-DS-001 reading or main's H-SMTH-001 reading
      of the smoothness measurement is correct. Both are preserved; a
      Coordinator decision is owed.
    - >-
      The branch's BATCH-028 lineage is now reachable only through this
      correction. Any record elsewhere on the branch that cites EV-DS-84d006 or
      DEC-20260802-446a54 now resolves to main's body, which says something
      different.
    - >-
      No attestation, review, or verification was obtained for this merge, and
      none is recorded.
  recorded_by_note: >-
    Recorded during conflict resolution for PR #174 at the user's request, not
    as part of a dispatched batch. No hypothesis status changed and no
    experiment was approved.
