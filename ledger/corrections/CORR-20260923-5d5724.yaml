  prior_value: >-
    "For fixed n = 5, fixed m = 4, fixed symmetrization arm A in {raw, S_4,
    2-torsion x| S_4}, and for all primes p' on the frozen cost ladder, the
    FGLM ideal degree D_4,A of the descended (n-1)-point system over F_{p'}
    is independent of p' up to relative variation < 10% across any three
    ladder primes spanning >= 12 bits." Justification: "the descended ideal is
    cut out by polynomials whose number, degrees and monomial structure are
    determined by n, m and the symmetrization group ... so D_4,A is a
    combinatorial invariant of (n, m, A)." With predictions D_4 raw <= 8^4 =
    2^12, S4 at least 2^3 below raw, and torsion_S4 at least 2^2 below S4, all
    measured on 20 random X_r per cost cell (EXP-GFPN-659e34 specification
    lines 80-85, 141, 269-271).

  corrected_value: >-
    THE OBJECT IS NOT A P'-INDEPENDENT INVARIANT ON RANDOM TARGETS.
    - The descended (n-1)-point system at n = 5, m = 4 is 5 equations over
      F_{p'} in 4 unknowns (JV lines 678-680). It is overdetermined.
    - A random X_r is a sum of 4 signed factor-base points with probability
      about 1/(24 p'). That is this hypothesis's own HEUR-GFPN-RATE4 count
      (lines 243-246).
    - Otherwise the ideal is generically the unit ideal: the quotient ring
      is zero and there is no positive finite degree. On a decomposable X_r
      the degree counts the decompositions present. It is not a combinatorial
      invariant of (n, m, A).
    - EXP-GFPN-05ff43's m = 4 random-target cells, which use the driver this
      contract reuses, recorded exactly this: 0/20 decompositions with D
      undefined (experiments/EXP-GFPN-05ff43/implementation.md lines
      251-255).
    - The random_model_justification's "combinatorial invariant" claim holds
      for a square, zero-dimensional generic system, such as
      HEUR-GFPN-DFLAT's n = m = 5 case. It does NOT hold for this
      overdetermined system.
    CONSEQUENCES, until a versioned amendment restates the object:
    - HEUR-GFPN-DFLAT4 as stated is NOT EVALUABLE on the frozen cost ladder.
      It can neither pass nor fail.
    - A flatness figure computed from unit-ideal or undefined degrees
      (0 = 0) is vacuous. It is never recorded as heur_dflat4_pass true.
    - The D_4 predictions, falsification conditions 2 to 4 (F2, F3 and F4 of
      the contract), and the D_4-band fallback [D_4^2, 4 D_4^3] of the work
      projection are likewise not evaluable.
    - The statement's "p'-independent in its ideal degree" and the
      reproduction check's "D_4 is recorded" are read through this
      correction.
    WHAT THIS CORRECTION DOES NOT DO. It does not choose a replacement object.
    The replacement is restated only by a v2 -> v3 amendment of
    EXP-GFPN-659e34, drafted under a zero-run design card, archived, and
    approved by a separate Coordinator decision before any run of that
    contract.
    Constraints that restatement must meet:
    (i) it is defined on the targets the cost ladder draws;
    (ii) it carries its own random-model justification and falsification
         condition;
    (iii) any absolute degree prediction is re-anchored in the manner of
          CORR-20260923-27ce4f. The Coordinator's unreviewed reading: under a
          square 4-equation subsystem, S4 ~ 8^4 = 2^12 (Bezout, total degree
          8 in 4 variables) and raw ~ 4! 8^4 ~ 2^16.6 (box mixed volume); the
          ratio threshold 2^3 survives because 4! = 2^4.6;
    (iv) it admits no vacuous pass.
    Candidates named for the design, NOT chosen:
    (1) the ideal degree of a declared square 4-equation subsystem;
    (2) invariance across the ladder of the per-round F4 trace of the full
        overdetermined system. This is the property JV rely on when they
        reuse one precomputed list of relevant pairs for 16-, 25- and 32-bit
        characteristics (JV lines 706-710), and the one 05ff43 already uses
        as its anchor identity.

