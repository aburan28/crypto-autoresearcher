  corrected_value:
    B22-T03: >-
      S*T = N with balanced N^(1/2) is HELLMAN's permutation case, not a
      Fiat-Naor guarantee. Fiat-Naor's own relation specialised to a
      permutation (q(f) = 1/N) is T*S^2 = N^2, balanced at T = S = N^(2/3).
      Hellman's random-function construction is m*t^2 = N per table over t
      tables, balanced T = M = N^(2/3). Preprocessing is N f-evaluations in
      every variant.
    B22-T01: >-
      Setup charged at N^(1/4+o(1)) for deterministic generator construction
      given the factorization, with the factorization itself at a heuristic
      N^(1/4) scale -- co-dominant with the theta = 1/2 core rather than a
      lower-order term.
    B22-T02: >-
      Main theorem is expected time exp(O(max(log(q), n^2))) for E/F_(q^n);
      the (q_i^n_i)^o(1) form is a regime-bound consequence. The degree-two
      cover is constructed inside the proof and is not a hypothesis.
    B22-T04: >-
      Three obligations added and marked unmet: exhibit the circuit over
      Z/2^(k+1) and charge its t and s; exhibit the witness interface that
      turns detection into a returned source tuple; charge 2^k at the k the
      instance needs.

