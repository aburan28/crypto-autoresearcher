  finding_this_coordinators_own_design_defect: >-
    EXP-MONO-bb6fa1's own frozen specification (Stage 1, R4) required the
    two mandatory nearby-object controls to match their EXPECTED
    p-to-infinity ASYMPTOTIC Chebotarev triples -- (1/3,0,2/3) for the
    synthetic A_3 object and (1/6,1/2,1/3) for the unconstrained object
    -- "within about 3 standard errors," language this Coordinator wrote
    by analogy with a STATISTICAL SAMPLE, where repeated draws fluctuate
    around a true mean with shrinking error as sample size grows. Both
    control objects are instead EXHAUSTIVE, DETERMINISTIC censuses of the
    ENTIRE finite population of monic cubics over F_101 (respectively:
    all cubics with square discriminant, and all cubics with no
    condition at all) -- there is no sampling, no randomness, and no
    "standard error" to shrink. Their measured densities are not noisy
    ESTIMATES of the asymptotic triple; they are the EXACT finite-p
    triples, which classical finite-field combinatorics gives in closed
    form: for the unconstrained object, split density (p-2)/(6p) and
    irreducible density (p+1)/(3p) (both O(1/p) away from the idealized
    1/6 and 1/3, by construction, at every finite p); for the A_3 object,
    split density (p-2)/(3p) and irreducible density 2(p+1)/(3p). At
    p=101 these give (0.16337, 0.5, 0.33663) and (0.32673, 0.0, 0.67327)
    respectively -- exactly what the Executor measured, to the last
    reported digit, and independently RE-DERIVED FROM FIRST PRINCIPLES
    by this Coordinator (not merely re-checked against the Executor's own
    claim): C(p,3), p^2(p-1)/2, and (p^3-p)/3 are the classical counts of
    split/1+2/irreducible monic cubics over F_p, their sum plus p^2
    degenerate cubics equals p^3 exactly, and the resulting ratios match
    the closed forms and the Executor's own reported values bit-for-bit.
    A tolerance band built for a shrinking-with-n statistical estimate
    was applied to a fixed, exact, O(1/p) finite-population quantity that
    was NEVER going to converge to the idealized asymptote at any fixed
    p -- the "failure" was guaranteed by the specification's own wording,
    regardless of whether the classifier or the underlying mathematics
    was correct.

  who_caught_it: >-
    THE EXECUTOR ITSELF, self-disclosed in full in
    `experiments/EXP-MONO-bb6fa1/execution_report.yaml`'s own
    `stage_1_mandatory_controls.disclosure` field, proactively and
    without prompting: it followed the frozen stopping rule LITERALLY
    (correctly refusing to interpret Stage 0's own R1/R2/R3, since S1 as
    written did fire), while ALSO independently deriving and reporting
    the exact closed-form formulas and showing the bit-exact match --
    giving the Coordinator everything needed to recognize this as a
    specification defect rather than a real instrument failure, without
    ever overriding the frozen gate itself. This is exactly the kind of
    disciplined behavior this program's own "record, never discard, never
    unilaterally reinterpret a frozen stopping rule" practice exists to
    produce.

  disposition: >-
    RUN-MONO-bb6fa1-1 remains archived exactly as recorded --
    `control_failure_instrument_result` is the CORRECT disposition for
    THAT RUN under the SPECIFICATION AS FROZEN, and nothing about the
    run's own numbers is wrong or re-scored. What is corrected is the
    INTERPRETATION available to a FUTURE run under a corrected tolerance
    standard: per this correction, BOTH Stage-1 controls in fact
    DEMONSTRATE the classifier can see the difference between the two
    nearby objects (they are sharply and exactly distinguished from each
    other, and each matches its own correct, derivable, exact finite-p
    prediction with ZERO discrepancy) -- the opposite of what S1 exists
    to rule out. R8 (m=3 baseline) independently passed. Stage 0's own
    census (|V_R|=10202, R1=0.4952, R2=0.5048, R3=0.1683) remains
    RECORDED but this correction does not itself authorize interpreting
