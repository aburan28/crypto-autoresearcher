correction:
  id: CORR-20260803-b4e663
  recorded_at: 2026-08-03
  record_type: claim
  record_id: CORR-20260802-46b73b
  field: the characterisation of M1 as making fact 2 false "for every j0"
  prior_value: >-
    The BATCH-002 producer reported, and the BATCH-003 snapshot receipt repeated
    in the Coordinator's own words, that under the four-zero matrix M1 the
    derivation's section-3.5 fact 2 is FALSE FOR EVERY j0 -- the property that
    made M1 the decisive test of the round-split rule's r=5 half, since M0's
    single zero leaves fact 2's conclusion intact.
  corrected_value: >-
    THAT IS TRUE ONLY OF THE SUPERSEDED BLANKET FORM OF FACT 2, NOT OF THE
    j0-RELATIVISED FORM THE ROUND-SPLIT RULE ITSELF USES. Under M1 the critical
    entries are M[(-c-j0) mod 4][c] for c = 0..3:
      j0 = 0 gives M[0][0] = M[3][1] = M[2][2] = M[1][3] = 0 -- all four zero, the
        adversarial case, fact 2 genuinely false;
      j0 = 1 gives M[3][0] = 3, M[2][1] = 1, M[1][2] = 3, M[0][3] = 1 -- ALL FOUR
        NONZERO, so the critical condition HOLDS at that index.
    The two BATCH-002 M1 arms therefore test STRUCTURALLY DIFFERENT CONDITIONS
    and were reported as if they tested the same one. Only the j0 = 0 arm is the
    adversarial test the rule needs.
  reason: >-
    Found by the independent red team (TASK-20260802-fa1dcc) doing the arithmetic
    itself, and verified by the Coordinator against the matrix. The error was
    propagated rather than originated by me: I repeated the producer's phrasing
    into the BATCH-003 snapshot receipt and the dispatch card without checking
    four entries I had the matrix to check.
    WHAT THIS DOES NOT DO. It does not falsify the r=5 half of the round-split
    rule. BATCH-003's rank 1 arm ran at j0 = 0 -- the adversarial index -- on an
    independently generated key with an independently written engine, and read
    n mod 8 = 0. The decisive test was performed. What is corrected is the CLAIM
    ABOUT COVERAGE: two arms were presented as two instances of the adversarial
    condition when one of them was not, so the rule rests on FEWER adversarial
    arms than the record implied.
    THE MORE SERIOUS OPEN ITEM IS SEPARATE AND IS RECORDED IN EV-AES-96257a AS
    OBS-B3-4: there is no decay control for zero-entry matrices anywhere in this
    campaign, and their fiber degeneracy may force n mod 8 = 0 independently of
    round count. That, not this counting error, is what could void the finding.
