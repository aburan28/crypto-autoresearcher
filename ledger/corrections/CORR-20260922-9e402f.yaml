# =============================================================================
# CORR-20260922-9e402f -- the EXP-FROB-30006a run package has no owning archival
# task, and the one its card names closed before any deliverable existed.
#
# WHAT THIS CORRECTS: an archival OWNERSHIP binding, not a measurement. No number
# is withdrawn, no figure changes, and nothing mathematical is asserted or
# retracted.
#
# WHY IT IS A CORRECTION AND NOT AN EDIT: TASK-20260920-66a30e is immutable, and
# AGENTS.md is explicit that a handoff card is never edited to make a dispatch
# look compliant. That rule binds before a dispatch exactly as it binds after
# one: the card is historically accurate for the moment it was written, and a
# correction supplies what followed.
#
# CAUGHT BEFORE THE DISPATCH, NOT AFTER. TASK-20260920-66a30e is still
# `written_not_dispatched`. The standing precondition -- an owner for a
# deliverable from the moment it exists -- has not been violated, because nothing
# has been produced. This is recorded as a disclosed pre-dispatch repair, not as
# a clean bill: the reason it was found is that the WHOLE card was read before
# routing it, which is the read AGENTS.md records CORR-20260915-6708e4 for when
# it was skipped.
# =============================================================================
correction:
  id: CORR-20260922-9e402f
  recorded_at: '2026-09-22'
  recorded_by: coordinator
  authorizing_decision: DEC-20260922-e9d35a
  archived_by: TASK-20260922-0e3b58
  goal_id: GOAL-FROB-6333a9
  batch_id: BATCH-5286b0

  record_type: claim
  record_type_note: >-
    `claim` of the three values templates/research-records.md permits
    (candidate | claim | run). The object corrected is a HANDOFF CARD's binding
    claim about who owns its deliverables -- neither a candidate mechanism nor a
    run record. `claim` is the closest of the three and is chosen rather than a
    fourth value being invented; the precise object is named in `record_id` and
    `field` below so no reader has to guess.

  record_id: TASK-20260920-66a30e
  field: >-
    TWO FIELDS OF ONE MERGED CARD, both dispatch-blocking: `archived_by` (as it
    governs the declared artifact_paths), and `artifact_paths` itself.

  one_correction_and_not_two: >-
    DELIBERATE. Both defects belong to one merged record, both were found before
    this correction was published, and both have the same remedy. Splitting them
    would create a second correction whose only distinguishing property is the
    minute I noticed it -- the "one defect, reported twice" double-count
    DEC-20260918-4b7e21 had to unpick for the shared-registry hash, where two
    goals reported one tooling problem and it read as two.

    THE PUBLICATION TEST, APPLIED TWO-SIDEDLY BECAUSE IT WAS ASKED. It governs
    the record whose BYTES CHANGE, not the topic. TASK-20260920-66a30e is
    committed AND merged, so it may only be SUPERSEDED, never edited -- and it is
    not edited here. This correction is committed but UNPUSHED, so it may be
    AMENDED, and it is: the second defect is written into it rather than into a
    sibling. Those two readings are the same rule, not a convenience.

  prior_value:
    archived_by: TASK-20260920-956d12
    artifact_paths:
      - experiments/EXP-FROB-30006a/implementation.md
      - experiments/EXP-FROB-30006a/implementation/
      - experiments/EXP-FROB-30006a/runs/
