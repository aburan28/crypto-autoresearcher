  corrected_value: >-
    BOTH REMEDIES ARE CARRIED BY ONE SUPERSEDING CARD, TASK-20260922-cd6f21,
    rather than as two side bindings a dispatcher must remember to read.

    (i) archived_by for the RUN PACKAGE is TASK-20260922-98729f, a coordinator
    snapshot archive opened in BATCH-5286b0 whose declared source_task_ids name
    TASK-20260922-cd6f21 and whose declared sources are
    experiments/EXP-FROB-30006a/implementation.md,
    experiments/EXP-FROB-30006a/implementation/,
    experiments/EXP-FROB-30006a/trial-plan.json,
    experiments/EXP-FROB-30006a/RESULTS.json and
    experiments/EXP-FROB-30006a/runs/. TASK-20260920-956d12 retains ownership of
    exactly what it actually staged: the design package.

    (ii) artifact_paths on the superseding card is THREE EXACT FILES --
    implementation.md, trial-plan.json and RESULTS.json -- while write_scope
    KEEPS the two directories, because the two fields answer different questions.
    The instrument sources and the per-run package are bound where they can be
    bound honestly: as sources of TASK-20260922-98729f, hashed at archive time
    when their names are facts.

  reason: >-
    TASK-20260920-956d12 IS A COMPLETED ARCHIVE THAT STAGED NONE OF THE CARD'S
    DELIVERABLES. Its receipt at
    coordination/goals/GOAL-FROB-6333a9/archives/TASK-20260920-956d12/
    snapshot-receipt.json records `recorded_at: 2026-09-20T08:23:48Z`,
    `commit_sha: 14ef07b8378db1271db504cd7b28a40ee21dcaa2`, parent
    8c4da50ba6870a116fcfb3b88d6922c18ea9e6ba, and a ten-entry `staged_paths`
    list: the proposal IDEA-20260920-b9f0c5, the hypothesis H-FROB-a5bf86, the
    specification, `experiments/EXP-FROB-30006a/amendments/.gitkeep`,
    `experiments/EXP-FROB-30006a/runs/.gitkeep`, the decision
    DEC-20260920-cf8ded, the goal head, both handoff cards, and its own receipt.

    NONE of TASK-20260920-66a30e's four declared artifact_paths appears in that
    list. `runs/.gitkeep` is the placeholder DIRECTORY MARKER, not the run
    package; binding it is not binding the runs. So the run package has no owning
    archival task at all, and the owner its card names is an archive that closed
    before any deliverable it would own could exist. An archive cannot be
    reopened: its commit is immutable, so its declared set and a later tree can
    never be reconciled (AGENTS.md rule 15).

    This is the same defect class the portfolio health report flags as needing
    repair on GOAL-ICEX-001 and GOAL-SIG-001 -- an archive task whose declared
    artifacts and whose bound task's deliverables do not match.

    SECOND DEFECT, FOUND WHEN THE QUEUE WAS RENDERED AND STRICTLY WORSE THAN THE
    FIRST: `tools/research_dispatch.py` refuses the card outright --
    "artifact_paths must be an exact safe repository-relative file path" --
    because its artifact_paths and its write_scope are the SAME list and two of
    the four entries are directories. The tool's own two validators say why:
    `validate_scope` (lines 211-216) strips a trailing slash and ALLOWS a
    directory; `validate_artifact_path` (lines 219-227) refuses one. The fields
    answer different questions -- a permission boundary versus a
    completion-checkable declared set -- and the merged card gave one answer to
    both. Across every queue in this repository 15876 entries conform and 5 do
    not; two of the five are this card, and the other three sit on
    GOAL-DREG-001, which is also not dispatching.

    WHAT THAT SECOND DEFECT MEANS FOR THE CAMPAIGN, STATED PLAINLY BECAUSE IT IS
    MORE THAN BOOKKEEPING: GOAL-FROB-6333a9 HAS NEVER HAD A DISPATCHABLE EXECUTOR
    CARD. Its two days at `current_batch_id: null` were not only a missing queue
    -- the card the queue would have carried could not have been routed either.
    That is a deeper and more useful finding than the one this correction was
    opened for, and it is the reason the remedy is a superseding card rather than
    a second side binding.

  what_is_NOT_corrected:
    - >-
      THE CARD IS NOT EDITED, NOT WITHDRAWN, AND NOT DELETED.
      TASK-20260920-66a30e keeps `archived_by: TASK-20260920-956d12`, keeps its
      four-entry artifact_paths, keeps `state: written_not_dispatched`, and keeps
      the dispatch_precondition "archived_by TASK-20260920-956d12 is bound
      (satisfied on this card)" -- which was true of the binding and is exactly
      the sentence this correction shows was not sufficient. It stays the
      historically accurate record of what was asked on 2026-09-20. Both values
      now appear in the record, which is what a correction is for.
    - >-
      NOT ONE SCIENTIFIC PARAMETER IS CORRECTED, AND THE SUPERSEDING CARD CHANGES
      NONE EITHER. TASK-20260922-cd6f21 enumerates its seven changes and states
      that none is a cell, curve, dimension, seed, control, certificate
      requirement, invalidation rule, stopping rule, budget number or threshold.
      A superseding executor card that quietly moved a parameter would be a
      protocol change wearing a clerical disguise; this one is diffable against
      its predecessor line by line, and a reviewer should diff it.
    - >-
      TASK-20260920-956d12's RECEIPT IS NOT TOUCHED. It is part of a completed
      archive and is immutable. Its nine declared hashes are not recomputed here;
      this session has no shell. It is accurate about what it staged and is not
      at fault for not staging artifacts that did not exist.
    - >-
      NOTHING ABOUT THE DESIGN PACKAGE CHANGES. EXP-FROB-30006a stays approved at
      version 1, H-FROB-a5bf86 stays approved, and the design package stays
      archived and content-bound by the receipt named above.
    - >-
      NO MEASUREMENT, FIGURE, OR CONCLUSION IS WITHDRAWN, because none exists:
      experiments/EXP-FROB-30006a/runs/ holds only .gitkeep and the experiment
      has never run. This correction changes who will own an artifact, not what
      any artifact says.

  consequence_for_the_dispatcher: >-
    SIMPLER THAN IT WAS, AND THAT IS THE POINT OF THE SUPERSESSION.
    TASK-20260920-66a30e IS NOT DISPATCHED AND IS NOT DISPATCHABLE; it does not
    appear in BATCH-5286b0's queue. The card to route is TASK-20260922-cd6f21,
    which carries the corrected owner and the conforming paths natively, so no
    dispatcher has to remember to read a side binding. The first draft of this
    correction left the merged card in the queue with an `archived_by_corrected`
    overlay, which was a live trap: a dispatcher reading only the card's own
    field would have repeated the defect. That overlay is gone.

  a_generalisable_finding_not_claimed_as_one: >-
    RECORDED AS A POINTER, NOT A RULE. The same conflation of `write_scope` with
    `artifact_paths` accounts for the other three non-conforming entries in the
    repository, all on GOAL-DREG-001, which is also not dispatching. That is two
    campaigns stopped by one misreading of two adjacent fields. It is plausibly
    worth a standing note -- "a producer's write_scope is a directory and its
    artifact_paths are exact files; they are never the same list" -- of the kind
    DEC-20260918-4b7e21 made standing for crossover search floors. IT IS NOT
    DECLARED STANDING HERE: this Coordinator has read two cards and a statistic,
    not GOAL-DREG-001's queue, and a rule asserted from an unexamined second
    instance is the failure this program keeps correcting. Named so the next
    session can rank it.

