correction:
  id: CORR-20260803-ff53c0
  recorded_at: '2026-08-03'
  record_type: superseding_contract
  record_id: EXP-SMTH-4403c4
  field: contract_superseded_before_any_datum_by_EXP-SMTH-71b1b0
  supersedes: EXP-SMTH-4403c4
  superseded_by: EXP-SMTH-71b1b0
  recorded_by_task: TASK-20260802-80f5e9
  companion_record: CORR-20260803-b3d7f1

  three_defects_repaired:
    D1_structural_my_error:
      what: >-
        In EXP-SMTH-4403c4 everything from `measured_quantity` onward was
        written at YAML DOCUMENT TOP LEVEL rather than nested under
        `experiment:`. The experiment record therefore contained only its 18
        header fields; the entire contract body -- the measured quantity, the
        enumeration, the null, the decision rules, the outcomes, the controls,
        the budget -- was a set of sibling documents-level keys that no schema
        check reads as part of the record.
      how_it_was_caught: >-
        tools/validate_ledger.py, on the run immediately after the freeze:
        three NEW errors, "missing required field 'budget'", "'metrics'" and
        "'success_criterion'".
      why_it_was_not_caught_sooner: >-
        The freeze receipt asserted `parses_as_yaml: true`, which was TRUE and
        USELESS. A file can parse perfectly and still put every field in the
        wrong record. PARSING IS NOT VALIDATING, and the freezing card's
        completion gate did not require a schema check. That gap is the real
        lesson here and it is worth more than the fix.
    D2_schema:
      what: >-
        `metrics` and `success_criterion` were never written under those names
        at all; their content existed as `decision_rules` and `outcomes`.
      repair: >-
        EXP-SMTH-71b1b0 carries `metrics` and `success_criterion` as required
        fields and RETAINS `decision_rules` and `outcomes` alongside them, so
        nothing that was said is lost and the schema is satisfied honestly
        rather than by renaming a section to fit.
    D3_substantive:
      what: >-
        CTRL-NULL-SELF made APPARATUS_FAILURE conditional on the uniform null
        matching asymptotic Dickman rho. REV-20260801-012 measured a CORRECT
        uniform null failing exactly that comparison 0 of 8 at bits 16 and 0 of
        8 at bits 20, because asymptotic rho under-predicts deep-tail
        smoothness at X of order 2**32 to 2**40 (RV012-A1).
      repair: >-
        EXP-SMTH-71b1b0 replaces it with CTRL-NULL-DICKMAN, `blocking: false`.
        The Dickman comparison on the null is still MEASURED AND REPORTED --
        the disagreement is informative -- but it can no longer terminate the
        run before KS2-DS-1, the one test H-SMTH-001 records as never having
        been performed. Instrument health is established instead by
        CTRL-ENCA-POWER, which does not depend on the asymptotic: if the
        pipeline cannot reject ENC-A, a pass on ENC-B has no power and that IS
        a blocking failure.

  what_is_carried_over_unchanged:
    - The strict i < j enumeration, n = 130816, and the well-definedness argument that the leading coefficient (x_i - x_j)**2 is never zero off the diagonal.
    - The pre-registration correction KS2-DS-1 = 0.006373, with H-SMTH-001's quoted 0.006362 shown to derive from the defective predecessor count 131328.
    - The measured null as PRIMARY calibration and Dickman as a secondary reference.
    - The null-before-treatment ordering with manifest-digest enforcement.
    - TAIL-DS-1 defined against the measured null rather than analytic rho.
    - DECAY-1 as an instrument-artifact tell rather than a test of the heuristic.
    - The bounded-working-set requirement and pre-flight RSS probe from the BATCH-029 diagnosis.
    - Toy claim ceiling, symmetric SUPPORT/REFUTE, and inconclusive as a legitimate outcome.

  the_superseded_contract_is_not_edited: >-
    experiments/EXP-SMTH-4403c4/specification.yaml stands byte-identical at
    sha256 80b75c415b3456772acf09901a67ea0644d984dae84f8ad01946fc8afeb5b801, as
    recorded in freeze_receipt.json. Its own freeze_rule required exactly this:
    a needed change is a superseding contract under a new id, never an edit --
    and that rule binds its author as much as anyone else, minutes after
    writing it, with nothing committed and no datum in existence.

  WRITE_SCOPE_EXCURSION_DECLARED:
    what_happened: >-
      TASK-20260802-80f5e9's declared write_scope is
      coordination/goals/GOAL-ECDLP-001/batches/BATCH-028/tasks/TASK-20260802-80f5e9
      and experiments/EXP-SMTH-4403c4. A superseding contract needs a NEW id by
      definition, so experiments/EXP-SMTH-71b1b0/ and the .gitignore line that
      keeps it out of early commits are both OUTSIDE that scope.
    why_it_was_done_anyway: >-
      The alternative was to leave a contract with three known defects standing
      as the batch's frozen artifact and let the measurement card discover them
      by spending its budget. Recording the defects without repairing them
      would have satisfied the letter of the write scope and failed the task.
    what_is_owed: >-
      A QUEUE AMENDMENT extending TASK-20260802-80f5e9's write_scope to
      experiments/EXP-SMTH-71b1b0 and .gitignore, and updating
      TASK-20260802-6a39f8's inputs and the snapshot archive
      TASK-20260802-d34ac4's declared paths from EXP-SMTH-4403c4 to
      EXP-SMTH-71b1b0. THE ARCHIVE CANNOT BIND WHAT ITS QUEUE DOES NOT DECLARE,
      so this amendment is a precondition of the snapshot, not a tidy-up after
      it. Declared here rather than performed silently.
    gitignore_line_added: >-
      experiments/EXP-SMTH-71b1b0/ was added to .gitignore mirroring the
      existing EXP-SMTH-4403c4 entry and its stated rationale: a
      dispatcher-verified archive must INTRODUCE every path it declares, so the
      contract must stay out of every earlier commit. Without that line a
      `git add -A` in any session would sweep it in and make the archive
      permanently unbindable, which is the GOAL-AES-003 failure recorded as
      CORR-20260802-009.

  effect_on_research_state:
    dispositions_changed: 0
    statuses_changed: 0
    hypotheses_moved: []
    goal_status_changed: false
    claim_tier: none
    data_produced: none
    note: >-
      No datum exists for either contract. Nothing about HEUR-DS-1, H-SMTH-001
      or H-DS-001 moves in either direction.

  inference:
    requested_policy: executor-implementation
    resolved_model_id: claude-opus-5
    model_verified: false
    fallback_used: true
    fallback_reason: >-
      Run under the Claude Code harness, which cannot resolve the GPT-5.6
