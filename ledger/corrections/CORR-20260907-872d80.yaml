  field: >-
    Figure 1's K-409/K-571 row boundary and the completeness of each row's
    printed P(c_pi) value.

  prior_value: >-
    provenance.json states: "K-409: c_pi = 21262439877311*22431439539154506863*P(c_pi),
    P(c_pi) printed = 57030553306655053533734286593
    9021184135396238924389891(contd) -- the string '(contd)' is printed
    verbatim in the published table; the value is genuinely truncated in
    the source itself, confirmed by direct visual inspection of the
    rendered PDF page (not just pdftotext extraction)." VAL-20260907-ec062f
    independently reached the same qualitative conclusion for BOTH K-409
    and K-571: its row_values_as_read_koblitz_rows field records the
    identical two-line reading for K-409 as provenance.json, and its own
    K-571 concatenation-hypothesis test concatenated only TWO printed line
    fragments ("9451926768145189936450898" + "07769277009849103733654828039")
    against K-571's derived c_pi, found the product off by a factor of
    roughly 10^25, and concluded K-571's printed value is "genuinely
    incomplete in the source itself, not merely a two-line value this
    program's transcription failed to stitch together correctly." Both
    conclusions rest on the SAME underlying row-boundary error: treating
    the first "(contd)"-suffixed line as K-409's own second line, when it
    is actually K-571's first line.

  corrected_value: >-
    K-409's printed P(c_pi) is a COMPLETE, single printed LINE with no
    "(contd)" suffix and no truncation: "57030553306655053533734286593"
    (29 digits). Figure 1's K-571 cell spans THREE printed lines, not two,
    with "NIST K-571" vertically centered beside all three: line 1
    "9021184135396238924389891(contd)", line 2
    "9451926768145189936450898(contd)", line 3
    "07769277009849103733654828039" (no further "(contd)"; the value
    terminates). This Coordinator independently re-verified this a THIRD
    time, after RT-20260907-4a1432's finding, by rendering
    inputs/JMV-0411378-20260907/sources/jmv-math-0411378v3.pdf page 5 at
    400 dpi (`pdftoppm -r 400 -f 5 -l 5`), cropping the K-block region
    directly, and reading the table's horizontal rules and cell boundaries
    by eye at native resolution: the rule falls immediately after
    K-409's single line and before K-571's first line, and "NIST K-571"
    (the curve label) sits centered beside all three P(c_pi) lines in that
    cell, not beside just one.

    Both values are COMPLETE, not truncated, and both independently satisfy
    the full three-part CTRL-FIG1-ROWCHECK rubric (already applied to
    K-233/K-283 in the archived run) when checked against the run's own
    already-computed derived c_pi values (cpi_table.csv), verified
    independently three times now (RT-20260907-4a1432; this Coordinator,
    twice):

    K-409: c_pi = 27200558982140686235006970440600674058217108588553475783236049
    (already in cpi_table.csv). c_pi / (21262439877311 * 22431439539154506863)
    = 57030553306655053533734286593 EXACTLY (zero remainder), which is
    PRIME (sympy.isprime, independently confirmed by this Coordinator) and
    is by far the largest of the three factors (29 digits vs. 14 and 20
    digits for the listed factors, both independently confirmed prime).

    K-571: c_pi = 35655896511340624687810845487372082980344185179452596885179918179218090432562595510057
    (already in cpi_table.csv). c_pi / 3952463 = the 79-digit concatenation
    of the source's three printed lines
    (9021184135396238924389891 + 9451926768145189936450898 +
    07769277009849103733654828039) EXACTLY (zero remainder), which is
    PRIME (independently confirmed), and is by far the largest factor
    (79 digits vs. 7 digits for the one listed factor, itself independently
    confirmed prime).

    Root cause of the original misattribution (independently reconstructed
    by RT-20260907-4a1432 and confirmed by this Coordinator): plain
    (non-`-layout`) `pdftotext` extraction emits curve LABELS as one text
    block and VALUES as a separate block, so "NIST K-571" appears in the
    raw text stream textually AFTER K-409's own value and BETWEEN K-571's
    first and second printed lines. Reading that stream without
    cross-checking against `-layout` output or a direct page render
    produces exactly this conflation. This Coordinator's original retrieval
    used both extraction modes but did not catch the row-boundary error
    before writing provenance.json's characterization; RT-20260907-4a1432
    caught it via a targeted, high-resolution crop specifically of the
    K-409/K-571 boundary, cross-checked against both text-extraction
    channels.

