correction:
  id: CORR-20260802-e73e06
  recorded_at: 2026-08-02
  record_type: claim
  record_id: EV-AES-005
  field: two understatements identified by the independent validator (US-1, US-2)
  prior_value: >-
    US-1: EV-AES-005's boundary clause scopes the r=4 and r=5 properties to
    mixing layers "with no zero in the relevant entries", stating a narrower
    class than the evidence supports at r=5.
    US-2: EV-AES-005 records the closure of its own open INSTRUMENT RISK in a
    sub-field rather than as a finding, despite that closure being, in the
    validator's assessment, the strongest single item in the BATCH-002 package.
  corrected_value: >-
    US-1 IS SUPERSEDED BY CORR-20260802-46b73b, which splits the condition by
    round count and drops it at r=5. It is listed here as well because the
    validator classified it as an UNDERSTATEMENT, and the classification matters
    independently of the fix: the record claimed LESS than its evidence
    supported.

    US-2 IS CORRECTED HERE. EV-AES-005 recorded an open INSTRUMENT RISK: every
    surviving producer control predicted ZERO, so a counting engine that
    systematically undercounted would have passed all of them, and no control
    then existed that could distinguish a correct instrument from a silently
    broken one. THAT RISK IS NOW CLOSED, and it deserves to be stated as a
    finding rather than buried. A control was preregistered with an exact,
    large, non-zero prediction -- n = 547608330240 with occupancy histogram
    {0: 4278190080, 256: 16777216} and max occupancy exactly 256 -- and the
    instrument returned it TO THE DIGIT, histogram included. The validator
    reproduced the same value on an engine it wrote from scratch, and also
    reproduced the paired non-critical arm at exactly 0.
    Two qualifications, both from the reviewers and both retained. The exact
    count and its occupancy histogram are ONE structural prediction reported as
    two, since n is a deterministic function of the histogram. And what
    genuinely discriminates is the PAIRED j0 behaviour rather than either arm
    alone: a convention misalignment between the instrument and the object would
    have swapped the destroyed and intact readings, and it did not.

  the_pattern_this_makes_and_why_it_is_recorded: >-
    THIS CAMPAIGN HAS NOW UNDERSTATED ITS OWN EVIDENCE TWICE AND OVERSTATED IT
    ONCE. CORR-20260802-007 corrected a receipt that cited a 1-in-8 coincidence
    probability correct for one trial but not for six, AND falsely listed a
    control as not run; both errors understated. These two are understatements.
    The overstatement was the producer's blanket "the derivation is WRONG",
    caught before it reached the ledger.
    An error that understates evidence is the same class of defect as one that
    overstates it: both misreport what the measurements say. It is recorded as a
    pattern because the asymmetry is worth noticing -- this campaign's review
    machinery is tuned to catch overclaiming, and understatement has slipped
    through it more often. A reviewer instructed to audit in BOTH directions
    found these; earlier reviews not so instructed did not.
  reason: >-
    Identified by the independent validator (TASK-20260802-98bdb8) as US-1 and
    US-2 against the package bound at snapshot commit c1ff4665. EV-AES-005 is
    immutable and is not edited; this correction supersedes the two fields named.
  evidence_artifacts:
    - coordination/goals/GOAL-AES-003/batches/BATCH-002/tasks/TASK-20260802-98bdb8/validation_report.yaml
    - coordination/goals/GOAL-AES-003/batches/BATCH-002/tasks/TASK-20260802-958bac/red_team_report.yaml
    - ledger/corrections/CORR-20260802-46b73b.yaml
    - ledger/corrections/CORR-20260802-007.yaml
  supersedes: null
  superseded_by: null
