correction:
  id: CORR-20260807-652652
  recorded_at: '2026-08-07'
  recorded_by: >-
    top-level session (NOT an independent Coordinator subagent, and NOT independently
    reviewed). This correction narrows a claim and supplies a missing proof step; it
    does not raise any claim.
  type: incomplete_proof_and_overstated_disposition
  supersedes: []
  corrects:
    - knowledge/findings/KN-FIND-a1f3c2.md
  record_type: claim
  record_id: KN-FIND-a1f3c2

  # ---------------------------------------------------------------- item 1
  field: KN-FIND-a1f3c2 "Proof sketch"
  prior_value: >-
    "The splitting field of S_m in x_1 over F_p(x_2,...,x_{m-1}, c) is generated by
    {y_2,...,y_{m-1}, y_c} where y_i^2 = f(x_i). For generic parameters, these m-1
    quadratic extensions are independent, giving Gal = C_2^{m-1}. The central element
    sigma_all (flipping all y_i) acts trivially on all roots, so the faithful monodromy
    is C_2^{m-1} / {sigma_all} = C_2^{m-2}."
  corrected_value: >-
    THE CONCLUSION IS CORRECT AND THE SKETCH IS NOT A PROOF. It omits the only step with
    mathematical content and asserts one step that needs an argument.

    (a) OMITTED, AND LOAD-BEARING. The sketch says sigma_all acts trivially on the roots
    and infers that the faithful quotient is C_2^{m-1}/{sigma_all}. That inference needs
    sigma_all to be the WHOLE kernel, which is equivalent to the 2^{m-2} signed sums
    x(eps_1 P_1 + ... + eps_{m-1} P_{m-1}) being PAIRWISE DISTINCT at the generic point.
    If they were not, the kernel would be larger and the monodromy SMALLER -- which is
    precisely the exceptional locus KN-OPEN-009 was asking about. So the sketch assumes
    away the question it answers. The missing step is supplied as Lemma 3.2 of
    papers/semaev-conservation-specialization/paper.tex: a coincidence among the roots
    forces sum_{i in S} eps_i P_i in E[2] for some proper nonempty S, the summation map
    E^{m-1} -> E is a surjective homomorphism so the preimage of the finite scheme E[2]
    is a proper closed subscheme, and the generic point of the integral variety E^{m-1}
    lies in no proper closed subscheme. This holds for EVERY curve, so the conclusion
    survives -- but it had not been established.

    (b) ASSERTED WITHOUT ARGUMENT. "these m-1 quadratic extensions are independent" is
    true but is exactly the statement Gal = C_2^{m-1} that it is offered as a reason for.
    In coordinates it needs f(x_1),...,f(x_{m-1}) to be independent in
    L*/(L*)^2, which needs the Weierstrass model, char != 2, and f squarefree. The
    manuscript replaces it with the observation that E^{m-1} -> (E/+-)^{m-1} is the fibre
    product of m-1 copies of a degree-2 Galois cover, so its deck group is (Z/2)^{m-1} by
    Artin's theorem, with no computation and IN EVERY CHARACTERISTIC.

    (c) NOTATION. The sketch's base field "F_p(x_2,...,x_{m-1}, c)" leaves the role of c
    unstated. The corrected statement fixes the base as K(t_1,...,t_{m-1}) with t_i
    independent transcendentals, and the cover as the T-fibre of
    S_m(t_1,...,t_{m-1},T).

  # ---------------------------------------------------------------- item 2
  additional_corrections:
    - field: KN-FIND-a1f3c2 "Implications" item 3, and its title/tags
      prior_value: >-
        "KN-OPEN-009 CLOSED: The question of whether an exceptional locus exists is now
        resolved negatively by this analysis." Title asserts "no exceptional locus for
        prime-field index calculus"; tags include `closed`.
      corrected_value: >-
        THE MATHEMATICAL STATEMENT STANDS; THE DISPOSITION DOES NOT. There is indeed no
        curve with smaller generic-fibre monodromy -- that is now proved, not sketched.
        But "KN-OPEN-009 CLOSED" is not supported, for two independent reasons.

        (i) No AGENTS.md rule 12 review was ever obtained for the underlying batch, and
        none has been obtained for the present derivation either. KN-FIND-c41ea9 already
        records this defect for the m=3 half; the same defect applies here.

        (ii) GOAL-MONO-001's completion criterion (a) asks for a CENSUS that decides
        full-versus-exceptional monodromy within stated error, or an exhibited
        exceptional locus, or a scoped instrument no-go. The question was answered by
        DERIVATION instead. That is a stronger kind of answer to the mathematical
        question and a non-answer to the criterion as written. DEC-20260802-a51c82 D-2
        and GOAL-MONO-001.paused_because already say so for m=3; nothing in BATCH-061
        changed the criterion.

        The corpus currently holds two entries that contradict each other on this point:
        KN-FIND-c41ea9 (2026-08-02) says "KN-OPEN-009 is not closed and is not
        superseded", and KN-FIND-a1f3c2 (2026-08-04) says it is CLOSED. This correction
        resolves the contradiction in favour of the earlier, weaker disposition. The
        honest reading available today is: the generic-fibre question KN-OPEN-009 poses
        has a derived answer (no exceptional locus, at any m), that answer has not been
        independently reviewed, and the criterion under which the goal would close was
        not the one that got met.

    - field: KN-FIND-a1f3c2 "Implications" item 1
      prior_value: >-
        "The factor-2 BKK improvement is universal (confirmed by BATCH-055/056)."
      corrected_value: >-
        NOT A CONSEQUENCE OF THE MONODROMY THEOREM, and not established by this
        correction in either direction. The Galois group of the T-fibre says nothing
        about the BKK/Bernstein-Kushnirenko bound of the decomposition SYSTEM; those are
        different objects (a monodromy group of one cover versus a mixed volume of a
        Newton polytope collection). Whatever support that claim has must be traced to
        BATCH-055/056 on its own terms. A reader should not cite KN-FIND-a1f3c2's
        monodromy result as evidence for it.

    - field: KN-FIND-a1f3c2 "Implications" item 2
      prior_value: >-
        "Frobenius cycle type on the factor-base locus: The Frobenius acts as the
        identity on the factor-base locus for all prime-field curves."
      corrected_value: >-
        CORRECT, and now proved and exhaustively verified (paper Theorem 5.1;
        EV-SMON-9c1c23 OBS-4: 16107/16107 good factor-base specializations split
        completely at m = 3,4,5). Two caveats belong with it, neither of which was
        recorded. First, it holds only OUTSIDE the degenerate locus described in paper
        Proposition 3.9 -- 962 of 8000 sampled factor-base points at m=4 and 839 of 2000
        at m=5 were degenerate, which is not a negligible fraction at these primes.
        Second, and more important, it is not an algorithmic statement: it concerns
        solving for the LAST coordinate given the other m-1, whereas relation search
        fixes the target and searches for the others. See paper section 5.1.

  reason: >-
    A later entry (KN-FIND-a1f3c2) asserted a stronger disposition than an earlier one
    (KN-FIND-c41ea9) on the same open problem, on a proof sketch that skipped the step
    that decides the question, and bundled in an unrelated claim about BKK. The
    mathematics is right; the record around it was not. Recording the complete proof and
    narrowing the disposition is the smallest change that makes the corpus consistent.
    Nothing is deleted: KN-FIND-a1f3c2 remains, and this record supersedes only the
    fields named above.

