correction:
  id: CORR-20260807-0021c7
  recorded_at: '2026-08-07'
  recorded_by: >-
    top-level session, on the strength of EXP-HPSC-74991c / RUN-HPSC-74991c-001. NOT an
    independent Coordinator and NOT independently reviewed. This correction narrows two
    claims and raises none.
  type: unreproduced_scaling_exponent_and_untested_model_choice
  supersedes: []
  corrects:
    - knowledge/findings/KN-FIND-4c9e71.md
    - knowledge/findings/KN-FIND-e7a3b1.md
    - knowledge/findings/KN-FIND-d4f820.md
  record_type: claim
  record_id: KN-FIND-4c9e71

  # ---------------------------------------------------------------- item 1
  field: KN-FIND-4c9e71 "CORRECTION (BATCH-107)" -- the revised scaling of C
  prior_value: >-
    "At p=50021: max C = 5.182 (6 measurements), consistent with p^{0.079} scaling
    (prediction: 5.31). The adversarial max DOES grow with p ... Revised finding: BOTH
    mean C AND adversarial max C scale as ~ p^{0.079}. H-PSEUDO with C = O(p^{0.079})
    (slowly growing) is the correct empirical characterization. At crypto scale
    (p=2^256): C_max ~ 2^{20}, yield error O(2^{-110}) -- negligible."
  corrected_value: >-
    NOT REPRODUCED. With the curve count MATCHED at 24 per prime, the full k-range used
    at every prime, prime-order curves whose order is verified independently by [N]P = O,
    and a seven-prime ladder from 1009 to 400009, the fitted power-law exponents are

        C_max  : 0.0334, bootstrap 95% CI [0.0261, 0.0514]
        C_mean : 0.0508, bootstrap 95% CI [0.0461, 0.0552]

    and 0.079 lies OUTSIDE BOTH intervals. The correction over-corrected: its own first
    reading ("bounded ~4, not growing significantly") was closer to what a matched
    measurement finds than its revision was.

    THE MECHANISM OF THE OVER-CORRECTION IS VISIBLE IN THE RECORD'S OWN TABLE. It
    compares an adversarial MAXIMUM across primes at 152, 26, 12 and 6 measurements
    respectively. The maximum of a sample is an increasing function of sample size, so
    that comparison confounds growth in p with variation in n; here it does so in the
    direction that inflates the apparent exponent, because the largest prime has the
    fewest draws and still produced the largest value. Matching n removes the confound.
    KN-FIND-d4f820's caveat that two of its primes used a truncated k-range (k = 1..300
    rather than 1..N-1) is a second, independent reason its four points are not
    commensurable with each other.

    KN-FIND-d4f820's own figure for the MEAN, C ~ p^{0.055}, is NOT corrected: 0.055 lies
    inside the mean's interval, at its upper edge. What is corrected is the claim that
    mean and max share the exponent 0.079.

  # ---------------------------------------------------------------- item 2
  additional_corrections:
    - field: >-
        KN-FIND-e7a3b1 statement of H-PSEUDO, "where C(p) ~ p^{0.079} empirically",
        and every downstream use of a power law for C(p)
      prior_value: >-
        The finding states H-PSEUDO with "C(p) ~ p^{0.079} empirically" and treats the
        power-law form as settled, as do KN-FIND-5c1a03 and KN-FIND-f8c290 when they
        conclude that the yield error term is negligible at crypto scale.
      corrected_value: >-
        THE EXPONENT IS THE WRONG THING TO ARGUE ABOUT, AND THIS IS THE MORE IMPORTANT
        HALF OF THIS CORRECTION. No record in the corpus tests whether a power law is the
        right FORM for C(p). The standard heuristic for a pseudorandom subset of size B
        in Z/N gives max_k |1hat_F(k)| ~ sqrt(B log N), i.e. C ~ sqrt(log p) -- a
        logarithm, not a power. Over any prime range toy scale can reach, the two are
        nearly collinear.

        Fitted on the same seven-prime data, with two free parameters each, the RMS
        residuals in C are:

          C_mean :  log 0.0993 | sqrt(log) 0.0996 | power law 0.1008 | constant 0.2914
          C_max  :  power 0.1363 | log 0.1376 | sqrt(log) 0.1408 | constant 0.2481

        The first three are separated by under 0.002 RMS on seven points: the data does
        not distinguish them. The constant model is decisively worse, so the comparison
        does discriminate when there is something to discriminate.

        Those same indistinguishable models extrapolate to p = 2^256 as:

          C_mean :  constant 2.7 | sqrt(log) 11.2 | log 25.2 | power law 13102
          C_max  :  constant 3.0 | sqrt(log)  9.4 | log 20.0 | power law   808

        Three orders of magnitude, decided entirely by a model choice that was never
        tested. Under the recorded exponent 0.079 the figure would be ~1.2 x 10^6.

        CONSEQUENCE FOR THE DOWNSTREAM RECORDS. KN-FIND-5c1a03 and KN-FIND-f8c290 rest
        on the yield error term being negligible at cryptographic scale. That conclusion
        may well be correct -- under sqrt(log p) it is more comfortably correct than
        under any power law -- but the corpus does not presently hold evidence for it. It
        holds a power-law fit that was never compared against the alternative its own
        subject matter predicts. Those records should cite the form as an assumption.

    - field: KN-FIND-d4f820 and KN-FIND-4c9e71 -- the absolute level of C
      prior_value: >-
        Mean C reported as 3.0, 3.5, 3.7, 3.84 at p = 1009, 4001, 9001, 50021.
      corrected_value: >-
        NOT CORRECTED, BUT NOT REPRODUCED EITHER, AND THE GAP IS UNEXPLAINED. This
        experiment measures 2.254, 2.451, 2.496, 2.682 at the same four primes -- the
        same shape, a consistent offset of about 0.75-1.2. Candidate causes, none of them
        settled here: a different threshold t (this run pins t = floor(p/2)), curve
        selection (this run uses prime-order curves only), or the truncated k-range at
        two of the four primes. The prior records do not pin t, so the discrepancy cannot
        be resolved from the record alone. THE EXPONENT COMPARISON IS MUCH LESS SENSITIVE
        TO THIS THAN THE LEVEL COMPARISON, but it is not immune, and a reader should not
        treat the level offset as settled in either direction.

  reason: >-
    Three records state three different things about one quantity, a fourth and fifth
    lean on the result at crypto scale, and the measurement that produced the operative
    figure compared a sample maximum across sample sizes differing by a factor of 25. A
    matched re-measurement was cheap -- 26 seconds -- and it does not reproduce the
    recorded exponent. It also shows that the exponent was never the load-bearing
    quantity: the functional form was, and it was never tested.

  evidence_artifacts:
    - experiments/EXP-HPSC-74991c/specification.yaml
    - experiments/EXP-HPSC-74991c/runs/RUN-HPSC-74991c-001/raw-result.json
    - ledger/evidence/EV-HPSC-a23ace.yaml
    - ledger/hypotheses/H-HPSC-e76e8e.yaml

  caveat: >-
    This correction is itself unreviewed, produced by one agent with one implementation
    and one seed, on 24 curves per prime, and its own largest prime is 18.6 bits. Its
    first draft carried a point-counting defect that inflated C to 20.7 before a
    walk-coverage gate caught it (EV-HPSC-a23ace OBS-6). It should be read as a reason to
    re-open the question, not as a settled replacement figure.
