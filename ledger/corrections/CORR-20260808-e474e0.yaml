  field: >-
    The P=512 row in CORR-20260808-c792f8's derived crossover table and the
    associated statement about the sign at w=2^80. The remainder of
    CORR-20260808-c792f8 is outside this record's scope.
  source: >-
    The independent Validator review recorded in
    coordination/goals/GOAL-SSI-001/batches/BATCH-5a3d0a/closeout.md found
    that CORR-20260808-c792f8 used cost_model.py's PAPER_PAIRS anchor for its
    newly-derived P=512 row, while the same committed run's fitted optimal
    values give a different crossover and reverse the qualitative sign at the
    largest tested budget. The authoritative source for this amendment is
    the committed raw result
    experiments/EXP-WESOVOW-001/runs/RUN-WESOVOW-001/raw-result.json.
  independent_verification_by_the_coordinator: >-
    RECOMPUTED FROM THE COMMITTED RAW RESULT, but not yet independently
    reviewed by a separate Validator session. The raw result's
    per_field[log2p=512].optimal values are T_full = 206.1038967394178 and
    L_mem = 181.43583267427067, and its baseline_log2TDG is 256.0. Applying
    the already-committed corrected charging law
    T_A(P,w) = T_full(P) + 0.5*max(0, L_mem(P)-log2_w), the equality
    T_A(P,w*) = T_DG(P) gives
    log2(w*) = L_mem - 2*(T_DG-T_full)
    = 181.43583267427067 - 2*(256.0-206.1038967394178)
    = 81.64362615310627. At the largest tested budget log2(w)=80,
    T_A = 206.1038967394178 + 0.5*(181.43583267427067-80)
    = 256.82181307655313, which is 0.82181307655313 bits slower than the
    256.0-bit Delfs-Galbraith baseline. A second direct arithmetic path,
    using the same three values parsed independently from raw JSON, produced
    the same values to the displayed precision. This is arithmetic
    re-derivation, not an independent-session review.
  prior_value: >-
    CORR-20260808-c792f8 states P=512: log2(w*) = 77.7 from the
    PAPER_PAIRS pair (204.2, 181.3), and its corrected_value says that the
    method wins above this point, including at w=2^80. The closeout therefore
    treated that P=512 row as not citation-eligible until the anchor choice
    was resolved.
  corrected_value: >-
    For the P=512 row, the run's own fitted optimal values yield
    log2(w*) = 81.64362615310627, conventionally rounded to 81.6 bits of
    table-entry budget. Since 81.64362615310627 > 80, the method does not
    beat Delfs-Galbraith anywhere in the tested w=2^30..2^80 interval under
    this fitted-opt anchor; specifically, at w=2^80 it is 0.82181307655313
    bits slower. The prior 77.7 row and its attacker-favourable w=2^80 sign
    are withdrawn for this P=512 comparison only. The other rows, the
    w=2^30 counterexample, and all scope restrictions in
    CORR-20260808-c792f8 remain untouched.
  what_this_does_not_establish:
    - >-
      This is not a new evidence record, not an executed attack, and not a
      security claim about SQIsign or any deployed parameter set.
    - >-
      The arithmetic has not yet received the required independent Validator
      review. Until that review and a verified ledger archive complete, this
      amendment is a recorded Coordinator correction draft and must not be
      cited as independently reviewed in review-xhigh or
      review-breakthrough context.
    - >-
      This does not repair experiments/EXP-WESOVOW-001/cost_model.py. Its
      source-level anchor defect remains a separate Executor-scoped item.
  what_is_untouched:
