    still `queued`, with no commit and an empty path_sha256.
    (b) The execution that started 2026-10-03T03:29:07Z (authority commit
    8cae4ad274) was snapshot-archived by TASK-20261003-60defb at f920583227,
    which reached main through #1768 on 2026-10-03. The dispatcher queue
    records that archive as `completed` with 34 path digests. d9ccb72fa then
    added manifest_v2.yaml for it, registered at 286df4b2 / 9fdb3725.
    Eight days later, #1616 merged branch (a) and replaced every
    companion, both manifest_v2.yaml files and stage0/precommit-hashes.json
    with (a)'s bytes. The flat manifest.yaml, stdout and check logs are
    byte-identical in (a) and (b), so they did not change.
